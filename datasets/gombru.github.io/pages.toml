["https://gombru.github.io/about"]
title = "About"
description = "Computer vision, deep learning and image processing stuff by Raúl Gómez Bruballa, PhD in computer vision."
full_description = "I’m Raúl Gómez Bruballa and I was born in Altafulla and moved to Barcelona to study telecommunications engineering with an specialization in audiovisuals systems at the Universitat Politècnica de Catalunya. After that I did a computer vision master at the Computer Vision Center (UAB), where I also did my PhD together with Eurecat, the Catalonia technological center, under an industrial PhD program. During my PhD I researched on diverse topics involving visual and textual data, focusing on learning from Web and Social Media data and on applied research. Those topics include multi-modal image retrieval, image tagging, multi-modal hate speech detection or scene text detection. During my PhD I did research stay at the Multimedia and Human Understanding Group, in the University of Trento, and an internship in at Huawei Ireland Research Center, in the behavior analysis group. Currently I’m working at Shutterstock, in Dublin, where I’m developing Recommendation Systems. I’m interested in computer vision, deep learning and image processing, and I like to work on research and development projects that have a direct impact in our society. In this personal website I write about my scientific work, either publications, toy experiments or coding stuff. Curriculum Publications Follow @gombru Places you can find me besides in the mountains: raulgombru@gmail.com Github Linkedin Twitter YouTube Instragram Portfolio Education 2016–2020 PhD in Computer Vision Eurecat and Computer Vision Center, Universitat Autónoma de Barcelona, Exellent Cum Laude. Research stay in University of Trento. Working with the Multimedia and Human Understanding Group. Internship in Huawei Ireland Research Center. Working in the human behaviour analysis group. 2015–2016 Master in Computer Vision Oficial master at Universitat Autónoma de Barcelona. GPA – 8.45. 2010–2014 Bachelor’s Degree in Telecomunications Engineering ETSETB, Universistat Politécnica de Catalunya, GPA – 6.8. Specialized in Audiovisual Systems Experience 2021-Present Data Scientist - Computer Vision. Shutterstock, Dublin. Developing Recommendation Systems. 2020-2021 Research Intern (PhD). Huawei Ireland Research Center, Dublin. Working on video action recognition for human behaviour analysis. 2016-2020 Computer Vision Researcher Eurecat Technology Centre, Barcelona. Worked on R&D computer vision consultancy projects and on the PhD research. 2016-2017 Research assistant Computer Vision Centre, Barcelona. Working with Convolutional Neural Networks in image text understanding. 2015–2016 Research Intern (MS), EURECAT, Barcelona. Internship in the context of the master thesis. Worked on text detection. Computer Vision R&D Image Retrieval I’ve an extense experience training deep models for image retrieval, using triplet nets architectures and ranking losses with different deep learning frameworks. Image by text retrieval learning from Social Media data. [Project] Face images by attributes retrieval. [Project] Image retrieval by text and location. [Project] Image Tagging and Classification I’ve also designed and trained models for image tagging tasks (or Multi Label Classification) applied to different scenarios. Tagging of geolocated images. [Project]. Finding ingredients in food images. [Project] Object Detection I’ve experience training object detection models (YOLO, Faster-RCNN, Mask-RCNN, etc) in different datasets. I designed a small CNN (based on MobileNet) to embed it in a parking camera for car detection. I trained Mask-RCNN (Detectron 2) for person detection ussing annotated video frames. Object Segmentation I’ve trained object segmentation models (FCN, Mask-RCNN) for different tasks. Face and hair segmentation model to embed in a Nvidia Jetson. [Project] Scene Text segmentation to detect text at a pixel level. [Project] Defects in sewers segmentation model for an automatic sewer inspection robot. [Project] Text Detection I’ve experience in scene text detection and have worked in several projects in the field. I organized the COCO-Text Detection Competition. [Project] I published a method to improve the former scene text detection pipeline. [Project] Selective Text Style transfer, a model which detects text in an image and then stylizes it. [Project] Video Understanding I’ve worked on video action recognition for human behaviour analysis, improving state of the art SlowFast models and training then on several large scale datasets. NLP I’ve also experience with NLP and have trained word representation models (Word2Vec, GLoVe, BERT) and LSTM networks for text understanding, most of the times working in multimodal (images and text) tasks. Training word representation models with Social Media data for an image by text retrieval task. [Project] Training an LSTM with Twitter data for multimodal hate speech classification. [Project] Other Projects Technical Courses Development I’ve worked developing online technical courses to teach machine learning to computer scientist by doing applied projects. Manning: Image Retrieval using Textual Inquiry with Deep Learning External Writer I’ve worked as a freelance technical writer and have recognized written communications skills, especially to explain technical concepts in an intuitive way. Neptune Blog Post: Implementing Content-Based Image Retrieval with Siamese Networks in PyTorch SetaMind: Image Classification App I developed this Android App that, given a photo of a mushroom, recognizes its species. It uses a CNN that runs locally in the phone. Social Media Analysis I developed tools that learn from images and associated text, and applied that to Instagram data analysis. I presented an application of this work to #Barcelona Instagram images and tourism in the TurisTICForum of Barcelona. Blog I have a blog where I explain my PhD work, toy experiments and general machine learning concepts. One of its articles explaining Cross-Entropy Loss is featured in the Deep Learning fast.ai course and in the deeplearning.ai Introduction to TensorFlow course. It’s visited by 15k people per month. I constantly receive good feedback aplauding my intuitive explanations."
