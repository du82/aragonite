full_description = "Learning Users’ Preferred Visual Styles in an Image Marketplace - ACM RecSys 2022 After my PhD I joined Shutterstock where I’ve been working on Recommender Systems. I gave a talk in ACM RecSys 2022 explaining what I’ve been up to the last year: Visual Styles RecSys: a model that learns users’ visual style preferences transversal to the projects they work on, and which aims to personalise the content served at Shutterstock. You can find the paper and more resources here. PhD Thesis Defence I defended my PhD thesis “Exploiting the Interplay between Visual and Textual Data for Scene Interpretation” in the Computer Vision Center under hard Covid restrictions. And yep, I’m already a Dr.! Got an exellent Cum Laude. You can find my thesis, the presentation slides, and a video of the defence here. #Barcelona​ en Instagram: Redes neuronales para aprender las relaciones entre imágenes y palabras [ES] Presentación en el Forum TurisTIC 2018 en el CaixaForum Barcelona sobre cómo aprender patrones visuales usando imágenes y texto asociado. Explico cómo este método se puede emplear para aprender las relaciones entre imágenes y texto que los usuarios de Instagram establecen en los posts con hashtag #Barcelona​. Y qué interés puede tener para el sector turístico. Más info sobre esta presentacion aquí. Categorical/Binary Cross-Entropy Loss, Softmax Loss, Logistic Loss and all those confusing names Intuitive explanation of Cross-Entropy Loss, Categorical Cross-Entropy Loss, Binary Cross-Entropy Loss, Softmax Loss, Logistic Loss, etc. I also explain the tasks of Multi-Class Classification y Multi-Label Classification and the activation functions Sigmoid and Softmax. Video version of my succesfull blog post about the same topic. A version in Spanish is available here. Ranking Loss, Contrastive Loss, Margin Loss, Triplet Loss and all those confusing names Intuitive explanation of Ranking Loss, Contrastive Loss, Margin Loss, Triplet Loss. I also explain what Siamese Nets and Triplet Nets are. Video version of my succesfull blog post about the same topic. A version in Spanish is available here. ¿Cómo funciona una RED NEURONAL? Explicación intuitiva de CNN para clasificación de imágenes [ES] Explicación intuitiva de cómo funciona una red neuronal, con un poco de historia. En concreto se explica como funciona una CNN (Red Neuronal Convolucional) para clasificación de imágenes. Barcelona Deep Dream: Visualizando qué aprende una red neuronal de #Barcelona​ en Instagram [ES] En este vídeo muestro qué patrones visuales aprende una red neuronal (CNN) de imágenes de Instagram con el hashtag #Barcelona​. Para ello, utilizo Deep Dream, un algoritmo que magnifica los patrones visuales reconocidos por una CNN en una imagen. La CNN que utilizo ha sido entrenada para aprender relaciones entre imágenes y texto de manera semi-supervisada. Artículo en mi blog sobre Barcelona Deep Dream. Artículo sobre cómo entreno la CNN con imágenes de Instagram y su texto asociado. Follow @gombru"
