& InterviewsGenresArtBiographyBusinessChildren'sChristianClassicsComicsCookbooksEbooksFantasyFictionGraphic NovelsHistorical FictionHistoryHorrorMemoirMusicMysteryNonfictionPoetryPsychologyRomanceScienceScience FictionSelf HelpSportsThrillerTravelYoung AdultMore GenresCommunity ▾GroupsQuotesAsk the Author Discover new books on Goodreads See if your friends have read any of Maya Angelou's books Sign in with Facebook Sign in options Join Goodreads Maya Angelou’s Followers (14,060) Add NewVideos 7 comments 1 comment More videos… Maya Angelou Born in St. Louis, Missouri, The United States April 04, 1928 Died May 28, 2014 Website http://www.mayaangelou.com/ Twitter DrMayaAngelou Genre Biographies & Memoirs, Poetry Influences Robert Burns Robert Burns ...more edit data Maya Angelou was an American memoirist, poet, and civil rights activist. She published seven autobiographies, three books of essays, several books of poetry, and is credited with a list of plays, movies, and television shows spanning over 50 years. She received dozens of awards and more than 50 honorary degrees. Angelou's series of seven autobiographies focus on her childhood and early adult experiences. The first, I Know Why the Caged Bird Sings (1969), tells of her life up to the age of 17 and brought her international recognition and acclaim.She became a poet and writer after a string of odd jobs during her young adulthood. These included fry cook, sex worker, nightclub performer, Porgy and Bess cast member, Southern Christian Leadership Maya Angelou was an American memoirist, poet, and civil rights activist. She published seven autobiographies, three books of essays, several books of poetry, and is credited with a list of plays, movies, and television shows spanning over 50 years. She received dozens of awards and more than 50 honorary degrees. Angelou's series of seven autobiographies focus on her childhood and early adult experiences. The first, I Know Why the Caged Bird Sings (1969), tells of her life up to the age of 17 and brought her international recognition and acclaim.She became a poet and writer after a string of odd jobs during her young adulthood. These included fry cook, sex worker, nightclub performer, Porgy and Bess cast member, Southern Christian Leadership Conference coordinator, and correspondent in Egypt and Ghana during the decolonization of Africa. Angelou was also an actress, writer, director, and producer of plays, movies, and public television programs. In 1982, she was named the first Reynolds Professor of American Studies at Wake Forest University in Winston-Salem, North Carolina. Angelou was active in the Civil Rights Movement and worked with Martin Luther King Jr. and Malcolm X. Beginning in the 1990s, she made approximately 80 appearances a year on the lecture circuit, something she continued into her eighties. In 1993, Angelou recited her poem "On the Pulse of Morning" (1993) at the first inauguration of Bill Clinton, making her the first poet to make an inaugural recitation since Robert Frost at the inauguration of John F. Kennedy in 1961.With the publication of I Know Why the Caged Bird Sings, Angelou publicly discussed aspects of her personal life. She was respected as a spokesperson for Black people and women, and her works have been considered a defense of Black culture. Her works are widely used in schools and universities worldwide, although attempts have been made to ban her books from some U.S. libraries. Angelou's most celebrated works have been labeled as autobiographical fiction, but many critics consider them to be autobiographies. She made a deliberate attempt to challenge the common structure of the autobiography by critiquing, changing, and expanding the genre. Her books center on themes that include racism, identity, family, and travel. ...more Combine EditionsMaya Angelou’s books Maya Angelou Average rating: 4.28 · 760,491 ratings · 33,334 reviews · 250 distinct works • Similar authors //<![CDATA[ function submitShel