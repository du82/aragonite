her. Young Simon Baruch worked for Baum as a bookkeeper and, with Baum's help, taught himself English. Mrs. Baum persuaded her husband to send Simon to South Carolina Medical College and the Medical College of Virginia in Richmond. He became a renowned surgeon chief on Robert E. Lee's staff during the Civil War. It was Mannes Baum who gave Simon the uniform and sword he wore when he joined the Third Battalion, South Carolina Infantry, in 1862. Bernard's mother, Isabelle, was the daughter of Sailing Wolfe, a young merchant and planter of Winnsboro, and Sara Cohen, daughter of Rabbi Hartwig Cohen of Charleston. Baruch's family moved to New York when he was about 10 years old. While his remarkable accomplishments came in New York, Washington, and abroad, his roots were always in South Carolina. Seventy years after he went to New York, he still had not relinquished a trace of his Southern accent. Baruch graduated from City College of New York in 1889, and his first job was as an office boy earning $3 a week. He ran errands in the banking and financial district and became enamored of the potential Wall Street held. He became a runner for a brokerage house and invested all his effort and time in learning the business, eventually becoming a broker and then a partner in the firm of A. A. Housman and Company. His earnings and commissions afforded him the opportunity to buy a seat on the New York Stock Exchange, and by the time he was 30 years old, he had become a millionaire. Baruch left Housman to open Baruch Brothers, in partnership with one of his brothers, Hartwig "Harty" Baruch. In succeeding years he lost his fortune and made it back several times.In 1907, he and Harty bought H. Hentz and Company, an international commodity firm with offices on Wall Street and in Paris, London, Berlin, and other cities. By 1910, Bernard Baruch had become one of Wall Street's financial leaders. When Woodrow Wilson was re-elected president and war was looming, he called on Baruch for advice because of the latter's understanding of the nation's economy and industrial resources. Baruch was chairman of the War Industries Board, which controlled the industrial establishment of the country for three years. With the end of the war imminent, he helped President Wilson negotiate the peace agreements in Paris. When Baruch joined Woodrow Wilson's War Industries Board, he had left H. Hentz and Company to speculate on his own. His two other brothers, Sailing and Herman, joined H. Hentz and Company as managing partners. Herman Baruch, a doctor and banker, later became ambassador to Portugal and Holland. After World War I, Baruch continued as an adviser to Presidents Harding, Coolidge, Hoover, Roosevelt, and Truman. He often conferred with officials on a bench in Washington's Lafayette Park because of the privacy and relaxed atmosphere. Thus, he became known as the "Park Bench Statesman." In 1905, he had bought Hobcaw Barony, a 17,000-acre plantation about three miles by water from Georgetown in South Carolina. It originally was part of the barony granted Lord Carteret by King George II. Baruch would permit no telephone lines to be strung to Hobcaw. The plantation was his retreat for the hunting season and the month of May each year. Baruch took great pride in his Souther ...more Combine EditionsBernard M. Baruch’s books Bernard M. Baruch Average rating: 4.0 · 239 ratings · 28 reviews · 30 distinct works • Similar authors //<![CDATA[ function submitShelfLink(unique_id, book_id, shelf_id, shelf_name, submit_form, exclusive) { var checkbox_id = 'shelf_name_' + unique_id + '_' + shelf_id; var element = document.getElementById(checkbox_id) var checked = element.checked if (checked && exclusive) { // can't uncheck a radio by clicking it! return } if(document.getElementById("savingMessage")){ Element.show('savingMessage') } var element_id = 'shelfInDropdownName_' + unique_id + '_' + shelf_id; Element.update(element_id, "saving..."); if (submit_form) { Element.hide('sh