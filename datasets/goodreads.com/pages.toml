["https://goodreads.com/book/show/3450744-nudge"]
title = "Nudge: Improving Decisions About Health, Wealth, and Happiness by Richard H. Thaler | Goodreads"
description = "From the winner of the 2017 Nobel Prize in Economics, Richard H. Thaler, and Cass R. Sunstein: a revelatory look at how we make decisionsNew York Times bestsellerNamed a Best Book of the Year by The Economist and the Financial Times Every day we make choices—about what to buy or eat, about financial investments or our children’s health and education, even about the causes we champion or the planet itself. Unfortunately, we often choose poorly. Nudge is about how we make these choices and how we can make better ones. Using dozens of eye-opening examples and drawing on decades of behavioral science research, Nobel Prize winner Richard H. Thaler and Harvard Law School professor Cass R. Sunstein show that no choice is ever presented to us in a neutral way, and that we are all susceptible to biases that can lead us to make bad decisions. But by knowing how people think, we can use sensible “choice architecture” to nudge people toward the best decisions for ourselves, our families, and our society, without restricting our freedom of choice."
full_description = '''Anya Weber101 reviews1 followerFollowFollowOctober 18, 2009I don't understand why this is a runaway bestseller--it's just not that enthralling. I've been reading lots of books lately about behavioral psychology and economics: why people make the decisions we do, economically and in other life areas. But Predictably Irrational and Made to Stick both explore these questions in a much more engaging way."Nudge" is mostly concerned with how companies and governments can practice what the authors term "libertarian paternalism"--gently, noncoercively pushing people toward doing something that they really want to do. For example, a company might, by default, enroll new employees in a 401K plan and put a certain salary percentage into that plan. The employees can opt out or change their contribution amount at any time, but by enrolling everyone by default, the company does an end run around its workers' natural procrastination tendencies, without forcing them into anything.Another use of "nudging," this one on the state level, might be to require that everyone signing up for a driver's license check a box saying either "Yes, I want to be an organ donor" or "No, I don't wish to be an organ donor." Or, a state could change its laws so that people are, by default, assumed to be willing donors unless they say they don't want to. This would greatly increase the number of organs available for emergency transplants.So, interesting stuff--but not enough to fuel an entire book. I wound up skimming quite a bit, and while some of the anecdotes are funny and interesting, many of the writers' proposals are dry unless you happen to be fascinated by the particular social or economic issue they're addressing. It's worth picking "Nudge" up to see if it grabs you; just don't be surprised if it lets go about 100 pages in.402 likes27 commentsLike Comment Trevor1,445 reviews23.8k followersFollowFollowMarch 22, 2009This one took me longer to read that is reasonable for a book of its length or the clear style it is written in. I mean, such a simply written text of 250 pages ought to have finished in no time. The problem was that I don’t live in the US and so many of the examples made the book a struggle for me. All the same, there are ideas in this book that are important no matter where you live.Don’t you just love the internet? I wanted to start this paragraph with that quote by Göring, “when I hear the word culture I reach for my luger”, but it turns out it is actually a quote from a play by Hanns Johst which is even better, “Whenever I hear of culture I release the safety on my Browning”. I have much the same reaction when I hear the word choice. There is a false equality set up between freedom and choice. It is as if the two terms are identical. Since I’ve had to read through dozens of American examples in this book of why this identity may not always apply, I would like to give an Australian example to explain some of the key concepts of this book.A couple of decades ago Australian workers went without a national pay increase and rather had this money directed into superannuation. Superannuation is essentially forced saving for retirement. Over the years this required percentage of an employee’s wage dedicated to superannuation has increased so that today it stands at 9%. Everyone knows that if people are to retire on anything like their current salary they need to put aside around 15% of their lifetime earnings. The gap between 9% and 15% is one that will be, for most people, borne by reduced living standards at the end of their lives.The previous Australian Government decided that it would be a good idea to introduce ‘choice’ into the superannuation system. So whereas previously most people were corralled into mostly industry superannuation funds that were ‘not for profit’ (meaning they had low fees and profits went back into the fund), the new system opened up the superannuation business to private operators. People would now be able to ‘choose’ which fund to invest their money in. (Where did I put that Luger?)The industry funds obviously didn’t like this idea. But like choice, competition is always a good thing and can never be criticised, right? Well, it is not quite so easy. The problem is that the industry funds asked the previous government to structure the new system so that all funds would have to disclose all fees and charges associated with their products. This would clearly have favoured the industry funds – that often don’t charge fees at all. The government refused to include this disclosure of information as a proviso in the legislation.Of course, this made ‘freedom of choice’ a bit of a joke. You can’t really have ‘freedom’ if your choice is also based on your being ‘free’ from vital information.What made matters worse was that the ‘financial planning’ industry in Australia isn’t as well regulated as it might be. Financial planners generally receive commissions from the financial institutions whose products they sell (oh, sorry, encourage you to take up). So, rather than providing you with a plan that is unequivocally in your best interests, the financial planner you are seeing may have (actually, will have) a strong motivation to provide you with information that is in their best financial interests, rather than yours.Economists would say that despite all of the obvious problems with this new system of choice it is still better as people ‘always act in their own best interests as rational economic agents’ and more choice (even if some of those choices might be biased against people) is always better.The writers of this book define themselves as Libertarian Paternalists. Essentially, they also believe that choices are good things – however, they acknowledge that choice alone isn’t enough and that people aren’t always economically rational entities.One of the ideas I found most useful in this book is the idea of ‘choice architecture’. They do not believe in taking choices away from people, but they recognise that being presented with a bewildering array of choices is often enough to stop people from making any choice at all. The book opens with a discussion of a school cafeteria and how you can affect the eating habits of kids simply by how you place the food on display. That is, putting healthier food at eye level, rather than fatty, sugary foods, will ‘nudge’ kids towards eating more healthy food. This is not a subtle change; this ‘nudge’ can drastically improve the eating choices made by the kids. The kids still have a choice to eat rubbish, but this simple change nudges them towards eating better. The point is that you simply don’t have the option to display the food in a ‘non-nudge’ way. You have to make some choice about how you are going to display the food – so doesn’t it make sense to set up the display so that people are nudged towards eating well, rather than badly?Choices don’t occur in a vacuum and one of the lessons of this book is that if we are going to provide ‘choices’ we need to think about the consequences of the choice architecture we put in place in which those ‘choices’ are going to be made.Another of those pieces of ‘choice architecture’ is going to depend on what is the default choice. This is because, people being people, many of us are going to get bored early on in the decision making process and just go for the default. Therefore, the default should be the choice that is most likely to meet the needs of those required to make the choice. There is a very disturbing discussion of the ‘Part D’ prescription drug coverage process in the US in which people who do not make what is an incredibly difficult choice are ‘randomly’ assigned to a range of default plans that takes the principle of government non-intervention to absurd extremes.The other idea that is very strongly pushed in this book is that people are very much ‘loss averse’. This is an idea that has been in virtually every book I’ve read lately, but this book does more than most to explain the consequences of this aversion. Going back to our superannuation example, one of the reasons why people don’t increase their superannuation contributions – despite knowing that it would be good for them in the long term – is that it involves them in a perceived loss now. The authors discuss a way of encouraging higher contributions which they call the ‘pay more later’ plan. Essentially people are encouraged to commit to increasing their contributions at the time of their next pay increase. This way the increase in contributions does not feel like a loss and the authors show that this way of increasing contributions leads to higher contributions than virtually any other method.I particularly liked their solution to the ‘gay marriage’ issue that is producing so much heat and so little light in society lately. Their answer is for the government to get out of the marriage business altogether. That the government should enable people to have their relationships recognised on the basis of it being a ‘civil union’ and that this be open to all couples, irrespective of their sex or the sex of their partner. This civil union would be the legal and social recognition of a couple’s partnership. Marriage then would be left up to religious bodies to worry about. If a particular church refuses to marry you because you want to marry someone they don’t think you should – well, find yourself another church – or even better yet, avoid churches altogether.The last part of this book is a defence of the idea of nudges against radical free market types; the sorts of people who, like our previous government, think that choice is always good and ill-informed choice is even better. The idea that people might be nudged towards donating their organs after they’ve finished with them, nudged to eat better food or to get better health care cover or to slow down when approaching a dangerous intersection all just seem obviously good to me, so this part of the book was preaching to the converted.But then, like Hegel, I don’t equate freedom with choice, but with needs and how we understand those needs. I think freedom has less to do with getting to choose and more to do with getting adequate information on the consequences of that choice. This book doesn’t go as far as I might along this path – but at least it recognises that we are human and that we often need help in making decisions that are in our own best interests. …If it was up to me there would not only be no freedom of choice in superannuation, but superannuation would be a tax and would be run by the Australian Tax Office. But don’t get me started…This would be an even more interesting book if you live in America, given the nature of the examples, but either way, this is still worth a look.behavioural-economics economics psychology ...more197 likes11 commentsLike Comment'''
year_published = 2025
