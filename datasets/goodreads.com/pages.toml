amous by fighting for the civil rights of Muslim and Hindu Indians in South Africa, using new techniques of non-violent civil disobedience that he developed. Returning to India in 1915, he set about organizing peasants to protest excessive land-taxes. A lifelong opponent of "communalism" (i.e. basing politics on religion) he reached out widely to all religious groups. He became a leader of Muslims protesting the declining status of the Caliphate. Assuming leadership of the Indian National Congress in 1921, Gandhi led nationwide campaigns for easing poverty, expanding women's rights, building religious and ethnic amity, ending untouchability, increasing economic self-reliance, and above all for achieving Swaraj—the independence of India from British domination. His spiritual teacher was the Jain philosopher/poet Shrimad Rajchandra. ...more Combine EditionsMahatma Gandhi’s books Mahatma Gandhi Average rating: 4.08 · 86,527 ratings · 3,674 reviews · 977 distinct works • Similar authors //<![CDATA[ function submitShelfLink(unique_id, book_id, shelf_id, shelf_name, submit_form, exclusive) { var checkbox_id = 'shelf_name_' + unique_id + '_' + shelf_id; var element = document.getElementById(checkbox_id) var checked = element.checked if (checked && exclusive) { // can't uncheck a radio by clicking it! return } if(document.getElementById("savingMessage")){ Element.show('savingMessage') } var element_id = 'shelfInDropdownName_' + unique_id + '_' + shelf_id; Element.update(element_id, "saving..."); if (submit_form) { Element.hide('shelfDropdown_' + unique_id) var form = document.getElementById('addBookForm' + book_id) if (form) { form.shelf.value = shelf_name form.onsubmit() } } else { var action = checked ? 'remove' : '' element.checked = !element.checked new Ajax.Request('/shelf/add_to_shelf', {asynchronous:true, evalScripts:true, onSuccess:function(request){shelfSubmitted(request, book_id, checkbox_id, element_id, unique_id, shelf_name)}, parameters:'book_id=' + book_id + '