["https://goodreads.com/book/show/42844155-harry-potter-and-the-sorcerer-s-stone"]
title = "Harry Potter and the Sorcerer’s Stone by J.K. Rowling | Goodreads"
description = '''An alternative cover for this ASIN can be found here"Turning the envelope over, his hand trembling, Harry saw a purple wax seal bearing a coat of arms; a lion, an eagle, a badger and a snake surrounding a large letter 'H'."Harry Potter has never even heard of Hogwarts when the letters start dropping on the doormat at number four, Privet Drive. Addressed in green ink on yellowish parchment with a purple seal, they are swiftly confiscated by his grisly aunt and uncle. Then, on Harry's eleventh birthday, a great beetle-eyed giant of a man called Rubeus Hagrid bursts in with some astonishing news: Harry Potter is a wizard, and he has a place at Hogwarts School of Witchcraft and Wizardry. An incredible adventure is about to begin!'''
full_description = '''Jayson3,181 reviews3,763 followersFollowFollowJuly 22, 2024(A-) 83% | Very GoodNotes: An effortless enchantment, it's lush with warmth and lore: seeded well, it casts a spell, and leaves you wanting more.*Check out progress updates for detailed commentary: Progress updates:01/11/2020 - Preamble(1) After nearly 9 months, I finally finished all five "A Song of Ice and Fire" audiobooks, I was going to run a poll on what I should listen to next but, c'mon, let's be real.(2) I decided on the Stephen Fry version over Jim Dale simply because I can't abide by "Sorcerer's Stone." It's "Philosopher's Stone" for me or no stones at all!01/12/2020 - 9%(1) "People in cloaks! Mr. Dursley couldn't bear people who dressed in funny clothes – the getups you saw on young people!"- With the movies, it's easy to forget that everyday wizard attire involves brightly colored cloaks and pointy hats.(2) McGonagall: "There will be books written about Harry – every child in our world will know his name!"01/13/2020 - 16%(1) Harry gets Dudley's second room, which seems very much like the Room of Requirement. It's used to hide Dudley's disused and broken things, but now functions as a bedroom.(2) If this snake was bred in captivity, and doesn't often speak to humans, how does it speak Portuguese? I suppose there's some Parseltongue iteration of Portuguese.01/14/2020 - 23%(1) Hagrid: "'The gold ones are Galleons,' he explained. 'Seventeen silver Sickles to a Galleon and twenty-nine Knuts to a Sickle.'"- It's interesting that despite UK decimalization, wizards still use a kind of £sd currency. They're sort of American that way: resisting metric.(2) A knut is a wizard penny, I presume after King Cnut the Great.01/15/2020 - 34%(1) Harry: "What are Slytherin and Hufflepuff?"Hagrid: "School houses. There's four. Everyone says Hufflepuff are a lot o' duffers, but–"Harry: "I bet I'm in Hufflepuff," said Harry gloomily."- Hufflepuff does sound like it's for stoners.(2) Ron's both shocked and impressed that Harry said "Voldemort." Sort of like cursing, uttering his name.01/16/2020 - 43%(1) "Hermione almost ran to the stool and jammed the hat eagerly on her head. 'GRYFFINDOR!' shouted the hat. Ron groaned."- And thus begins our enemies-to-lovers romance.(2) "Ickle" must be Britishism of Britishisms. I've only ever seen it in "Harry Potter" books.(3) Hope my GIFs are well-received. Let me know if they ever get annoying.01/17/2020 - 55%(1) "The students all hated [Filch], and it was the dearest ambition of many to give Mrs. Norris a good kick."- Well, as long as they don't actually kick the cat.(2) Re: Football: "Ron couldn't see what was exciting about a game with only one ball where no one was allowed to fly."- I dislike soccer for separate, non-magical, reasons.01/18/2020 - 62%(1) Ron saves Hermione from the troll. When it comes to Hermione, Harry's invariably placid, it's always fireworks with Ron.(2) Before I knew better, I used to think "Hermione" was pronounced "hermy-won."(3) "Ron was fascinated by the fifty pence. 'Weird!' he said, 'What a shape! This is money?'"- I guess heptagons aren't common among wizards.01/19/2020 - 69%(1) The problem with the library's "restricted section" is that anyone can go there. Just keep them locked in a separate room, there must be hundreds of those available.(2) Remembralls are about as useful as tying string around your finger.(3) Harry: "How did you know – ?"Dumbledore: "I don't need a cloak to become invisible."- Totally pwned!01/20/2020 - 73%(1) “Ron and Hermione [were] playing chess. Chess was the only thing Hermione ever lost at, something Harry and Ron thought was very good for her.”- I agree, it keeps her humble and open to suggestions.- It’s good for Ron too, having something he’s best at.(2) I love how openly biased teachers are toward their houses. It makes them more human.01/21/2020 - 77%(1) Ron and Neville fist fight Malfoy, Crabbe & Goyle. If you ask me, Malfoy's Ron's nemesis not Harry's.(2) "Hermione... had started drawing up study schedules and color coding all her notes. Harry and Ron wouldn't have minded, but she kept nagging them to do the same."- Pressuring idiosyncrasies is weird... like making friends dress like you.01/22/2020 - 84%(1) Filch: "Hang you by your wrists... I've got the chains still in my office, keep 'em well oiled in case they're ever needed."- Not an awful idea, motives aside. Manacles can be handy.(2) "Snape made them all nervous... while they tried to remember how to make a Forgetfulness potion."- Trick question! Potion fumes might cause them to forget!01/23/2020 - 90%(1) The difference between J.K. Rowling and Rick Riordan is that Rowling plays the long game, building scenes toward the climax. Whereas Riordan plays in short bursts, ping-ponging from one mini-quest to another. Here, for example, Ron being best at chess, Hagrid giving Harry a flute, Peeves being scared of the Bloody Baron, etc., all pay-off at the climax.01/24/2020 - 90%(1) Dumbledore: "Call him Voldemort, Harry. Always use the proper name for things. Fear of a name increases fear of the thing itself."- Wonder why Dumbledore doesn't give this advice to everyone? Surely people would listen.(2) Lost in the narrative is that Harry kills a guy. Literally kills him with the power of love... it's a curious thing.audiobook-audible author-british genre-juvenile-fantasy ...more828 likes160 commentsLike Comment'''
