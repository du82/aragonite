["https://goodreads.com/book/show/4671.The_Great_Gatsby"]
title = "The Great Gatsby by F. Scott Fitzgerald | Goodreads"
description = "The only edition of the beloved classic that is authorized by Fitzgerald’s family and from his lifelong publisher.This edition is the enduring original text, updated with the author’s own revisions, a foreword by his granddaughter, and with a new introduction by National Book Award winner Jesmyn Ward.The Great Gatsby, F. Scott Fitzgerald’s third book, stands as the supreme achievement of his career. First published by Scribner in 1925, this quintessential novel of the Jazz Age has been acclaimed by generations of readers. The story of the mysteriously wealthy Jay Gatsby and his love for the beautiful Daisy Buchanan is an exquisitely crafted tale of America in the 1920s."
full_description = "Nataliya919 reviews15.1k followersFollowFollowMarch 17, 2023Oh Gatsby, you old sport, you poor semi-delusionally hopeful dreamer with “some heightened sensitivity to the promises of life”, focusing your whole self and soul on that elusive money-colored green light - a dream that shatters just when you are *this* close to it. Jay Gatsby, who dreamed a dream with the passion and courage few possess - and the tragedy was that it was a wrong dream colliding with reality that was even more wrong - and deadly. Just like the Great Houdini - the association the title of this book so easily invokes - you specialized in illusions and escape. Except even the power of most courageous dreamers can be quite helpless to allow us escape the world, our past, and ourselves, giving rise to one of the most famous closing lines of a novel. “Gatsby believed in the green light, the orgastic future that year by year recedes before us. It eluded us then, but that’s no matter — to-morrow we will run faster, stretch out our arms farther... And one fine morning —— So we beat on, boats against the current, borne back ceaselessly into the past.” Dear Gatsby, not everything I liked back when I was fourteen has withstood the test of time¹ - but you clearly did, and as I get older, closer to your and Nick Carraway's age, your story gathers more dimensions and more tragedy, fleshing out so much more from what I thought of as a tragic love story when I was a child - turning into a great American tragedy.¹ I hang my head in shame at my ability to still belt out an enthusiastic (albeit poorly rendered) version of '...Baby One More Time' when it comes on the radio (provided, of course, that my car windows are safely up).I blame it on my residual teenage hormones. Jay Gatsby, you barged head-on to achieve and conquer your American dream, not stopping until your dreams became your reality, until you reinvented yourself with the dizzying strength of your belief. Your tragedy was that you equated your dream with money, and money with happiness and love. And honestly, given the messed up world we live in, you were not that far from getting everything you thought you wanted, including the kind of love that hinges on the green dollar signs. And you *almost* saw it, you poor bastard, but in the end you chose to let your delusion continue, you poor soul.Poor Gatsby! Yours is the story of a young man who suddenly rose to wealth and fame, running like a hamster on the wheel amassing wealth for the sake of love, for the sake of winning the heart of a Southern belle, the one whose “voice is full of money” - in a book written by a young man who suddenly rose to wealth and fame, desperately running on the hamster wheel of 'high life' to win the heart of his own Southern belle. Poor Gatsby, and poor F. Scott Fitzgerald - the guy who so brilliantly described it all, but who continued to live the life his character failed to see for what it was. The Great Gatsby is a story about the lavish excesses meant to serve every little whim of the rich and wannabe-rich in the splendid but unsatisfying in their shallow emptiness glitzy and gaudy post-war years, and the resulting suffocation under the uselessness and unexpected oppressiveness of elusive American dream in the time when money was plenty and the alluring seemingly dream life was just around the corner, just within reach.But first and foremost, it is a story of disillusionment with dreams that prove to be shallow and unworthy of the dreamer - while at the same time firmly hanging on to the idea of the dream, the ability to dream big, and the stubborn tenacity of the dreamer, “an extraordinary gift for hope, a romantic readiness such as I have never found in any other person and which it is not likely I shall ever find again” . This is why Gatsby is still so relevant in the world we live in - almost a hundred years after Fitzgerald wrote it in the Roaring Twenties - the present-day world that still worships money and views it as a substitute for the American dream, the world that hinges on materialism, the world that no longer frowns on the gaudiness and glitz of the nouveau riche. In this world Jay Gatsby, poor old sport, with his huge tasteless mansion and lavish tasteless parties and in-your-face tasteless car and tasteless pink suit would be, perhaps, quietly sniggered at - but would have fit in without the need for aristocratic breeding - who cares if he has the money and the ability to throw parties worthy of reality show fame??? Because in the present world just the fact of having heaps of money makes you worthy - and therefore the people whose voices are “full of money”, who are “gleaming like silver, safe and proud above the hot struggles of the poor”, people who genuinely believe that money makes them worthy and invincible are all too common. Tom and Daisy Buchanan would be proud of them. And wannabe Gatsbys pour their capacity to dream into chasing the shallow dream of dollar signs, nothing more. “They were careless people, Tom and Daisy — they smashed up things and creatures and then retreated back into their money or their vast carelessness, or whatever it was that kept them together, and let other people clean up the mess they had made.” This book somehow hit the right note back when I read it when I was fourteen, and hit even truer note now, deeply resonating with me now, almost a full century since it was written. If you read it for school years ago, I ask you to pick it up and give its pages another look - and it may amaze you. Five green-light stars in the fog at the end of a dock.——————Also posted on my blog.2013-reads 2021-reads i-also-saw-the-film ...more2,244 likes129 commentsLike Comment"
