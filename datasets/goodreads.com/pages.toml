["https://goodreads.com/book/show/43641.Water_for_Elephants"]
title = "Water for Elephants by Sara Gruen | Goodreads"
description = "When Jacob Jankowski, recently orphaned and suddenly adrift, jumps onto a passing train, he enters a world of freaks, drifters, and misfits, a second-rate circus struggling to survive during the Great Depression, making one-night stands in town after endless town. A veterinary student who almost earned his degree, Jacob is put in charge of caring for the circus menagerie. It is there that he meets Marlena, the beautiful young star of the equestrian act, who is married to August, the charismatic but twisted animal trainer. He also meets Rosie, an elephant who seems untrainable until he discovers a way to reach her. Beautifully written, Water for Elephants is illuminated by a wonderful sense of time and place. It tells a story of a love between two people that overcomes incredible odds in a world in which even love is a luxury that few can afford."
full_description = '''Rachel M.23 reviews140 followersFollowFollowDecember 29, 2007* * REVIEW CONTAINS SLIGHT SPOILERS * *I really wanted to like this book. I think my low opinion is partially my fault, because I drove into the story with high expectations due to rave reviews. I need to learn not to do that.The beginning of this novel was excellent. A Ivy League dropout, who formerly studied to be a vet, runs away and joins the circus. The time period? The Depression and Prohibition America - a historical era of uncertainty and chaos. I was looking for an intriguing tale of a college youth thrust into an unfamiliar world, along with a dose of touching animal stories. What I got was a romance. Pure and simple.A major issue in this novel is the characterization. The characters, with the exception of Walter (aka Kinko) and his dear Queenie, were flat and predictable. Marlena and August bothered me the most - Marlena being beautiful and kind and boring, and August being a cruel husband due to his mental illness. Besides the hackneyed stereotype of the mentally ill being violent, August's schizophrenia appeared to be a plot device to bring Jacob and Marlena together without making them look like bad people for cheating. I didn't buy it for half a second. I think the affair would've been much more interesting if August was...well, basically a normal husband who was maybe a little too obsessed with his own accomplishments.The romance between Jacob and Marlena made me yawn. While Jacob was a fairly developed character, Marlena was the epitome of a side-female love interest: gorgeous with little beneath the surface. Barbara, the "cooch girl", had more depth than her. If Marlena were developed further (and if she had a flaw or two), I could buy their love story. And hey, maybe one day I'll appreciate where the characters ended up. Today is not that day. On a similar note, I've heard some people complain about the sex scenes, and while the descriptions are a bit odd, I had no problem with there being sex in the book. The setting is a circus, there is booze everywhere, and sex is gonna happen.Again - I think I went into this novel with high expectations and if I'm getting the wrong idea or whatever, that's my own doing. I'll probably pick it up again in the future to see if I think differently then.436 likes47 commentsLike Comment'''
