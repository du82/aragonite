["https://goodreads.com/book/show/19063.The_Book_Thief"]
title = "The Book Thief by Markus Zusak | Goodreads"
description = "Librarian's note: An alternate cover edition can be found hereIt is 1939. Nazi Germany. The country is holding its breath. Death has never been busier, and will be busier still.By her brother's graveside, Liesel's life is changed when she picks up a single object, partially hidden in the snow. It is The Gravedigger's Handbook, left behind there by accident, and it is her first act of book thievery. So begins a love affair with books and words, as Liesel, with the help of her accordian-playing foster father, learns to read. Soon she is stealing books from Nazi book-burnings, the mayor's wife's library, wherever there are books to be found.But these are dangerous times. When Liesel's foster family hides a Jew in their basement, Liesel's world is both opened up, and closed down.In superbly crafted writing that burns with intensity, award-winning author Markus Zusak has given us one of the most enduring stories of our time.(Note: this title was not published as YA fiction)"
full_description = "Kat Kennedy475 reviews16.4k followersFollowFollowJanuary 15, 2014Just to clarify: Yes, I did cry.I've read a lot of positive and negative reviews for this book. I can see why people wouldn't like it - I really can. Perhaps because I took a lot out of it personally, I found I enjoyed it a lot.Quick test to see if you'll like this book:1. Did you like Anne of Green Gables?2. Can you cope with an off-beat, melancholy, caustic, dead-pan, self-righteous narrator?3. Do you like words?(Questions 4-8 were all about what kind of underwear you're wearing so don't worry about them).So, let's all gather around for story time with Mistress Kat.Two incidents set me off lately.1. My neighbour came to me and complained about the Islanders (for those not Australian: the Tongan, Fiji, Papa New Guinea and New Zealand populations of Australia) causing trouble and otherwise defiling our great and beautiful nation.2. I was tooling around on Facebook when I noticed one of my friends (one of those friends you’ve never met except in an internet community) hosting a link to a video of a speech from a man addressing the American people. I wouldn’t go so far as to say that he is reminiscent of a neo-Hitler but let’s just say that the comparison would not be wholly unearned. Her comments on the video were that: everything he’d said was right, it was time that people sat up and listened for the sake of their country and that it’s about time “somebody did something”. (Fuck me, I’ve heard this phrase so many times. What is it exactly that they’re referring to? Do they actually know? I’ve yet to hear them pronounce what this “something” is or what it looks like. Is there some plan that I’m not aware of that they’re referring to? Does it involve chipmunks, honey and tequila?)To my neighbour, I simply mumbled that I had to leave and got in my car. I was offended on behalf of my friends so I blew him off and I haven’t really spoken to him since. To my Facebook friend, I resisted the urge to make any comments. I debated about starting a fight that would, in all likelihood, spill over to our community. In the end I ignored her and I haven’t spoken to her since.The Book Thief is not your typical WWII story. It doesn’t even ask you to sympathize with the Jews. Their plight is background to the story and their struggles and pains are rarely shown except through the pitiful/beautiful character of Max. This story actually focuses on the bad guys. Zusak assumes that you know about the struggle and the plight of the Jews. He assumes that you feel for them, that you are horrified on their behalf and so he doesn’t spend much time eliciting an emotion that you are expected to have.Instead it focuses on the BAD guys. You get to know and live the lives of a small and poor town in Germany. The thing is, though, that these aren’t really the bad guys. Zusak, probably rightly, assumes that we’d never be able to really empathize and enjoy reading a book about characters truly bad. They’re not really bad. After all, they may be Germans and they may have escaped persecution and death, but they’re still poor. They’re the tiny fraction of the German population who sympathizes with the Jews. They harbour a Jewish man in their home and come to love him. The thing is though that for most of the novel, they’re not the good guys either. They don’t speak up for the Jewish people, they don’t try to change popular opinion, they don’t stand for what’s right. They quietly try to get by without causing waves and without risking much of themselves.So you can see how I would sympathize. How could I think that I’m one of the “good guys” when I don’t stand up for people either? Shouldn’t I have challenged my neighbour and asked how he knew that the Islanders were to blame for all the crime? Shouldn’t I have asked him how many Islanders he knew? How he could make such assumptions about people? Shouldn’t I have challenged my facebook friend? Shouldn’t I have asked her why she’s spreading propaganda? Couldn’t I have probed her to think critically about this man’s claims, about facts and ethics? No. I didn’t want to cause problems and I didn’t want to make waves.The narrator of The Book Thief makes a claim that Hitler’s took over a country and started a war – not with guns or weapons but with words. I’ve read others consider this claim to be stupid and ridiculous but I actually agree with him. When I was a child I asked my Great Aunt Nell why she insisted on engaging me in long and tedious hypothetical debates about morality, human nature, ethics and theology. Her response was always the same: if you don’t fill a child’s head with all the right stuff, someone will come along and fill it with all the wrong stuff. It’s kind of like those corny motivational quotes that the teachers post in their rooms: Those who stand for nothing fall for anything.Well, I agree. When you don’t educate people, when you don’t teach them to think critically, with full understanding and proper knowledge, then other people come along and whisper in their ear and fill their heads up with mindless rot. Hitler told the German people how to think. He told them who was Wrong. Why they were Wrong. How to fix the Wrong. What was Right. Then he did the most powerful thing a person could do: he told them a story. When you tell a whole nation a story about the future – a gloriously bright future with Plenty and Joy; a future in which they are redeemed and have conquered their enemies; a future in which they are happy and Everything Is As It Should Be – and if you tell that story well enough, then you can conquer a country and wage a war without ever firing a single bullet. Coincidently when you don’t speak up, when you don’t proclaim the truth, when you’re too afraid to replace ignorance with knowledge then you’re no better than an accomplice to a crime. I can’t imagine how my friends would feel if they’d known that I stood by and allowed them and their family and children to be slandered like that. Pretty appalled, I imagine – and rightfully so.And now we come to the big reason why I think a lot of people didn’t like this book – the narrator.The Hunger Games did a similar thing to The Book Thief. It sought to instil in its readers a sense of proper shame. However, as opposed to The Book Thief, you didn’t feel judged. After all, for the Sins that The Hunger Games was preaching of, we’re all guilty – and in our combined guilt there seems to be a lessening of accountability. Perhaps there’s a sense that we’re all going down together. When we’re damned, at least we’ll have good company, right? The Book Thief, however, singles you out as solely responsible. It strips you naked and looks down on you as it asks you to account of yourself. Not even the narrator can sympathize with you because he is the only one left blameless and innocent, looking upon us with a reserved kind of pity and bewilderment. Maybe I’m a glutton for punishment. I don’t mind being stripped down. I don’t mind being reprimanded and so I loved this book. I loved this book for inspiring me to be even more outlandishly outspoken and persistently and doggedly forthcoming on my opinions of these issues. I loved this book because I loved the narrator. I loved this book because I loved the story. I loved this book because I now have the PERFECT excuse to start a helluva lot more fights. For some reason, that thought makes me very happy.australian-writer contemporary-fiction i-learned-something-new ...more2,097 likes112 commentsLike Comment"
