w England. Frost's poems include "Mending Wall" ("Good fences make good neighbors"), "Stopping by Woods on a Snowy Evening" ("Whose woods these are I think I know"), and perhaps his most famous work, "The Road Not Taken" ("Two roads diverged in a wood, and I-- / I took the one less traveled by"). Frost was awarded the Pulitzer Prize for poetry four times: in 1924, 1931, 1937 and 1943. He also served as "Consultant in Poetry to the Library of Congress" from 1958-59; that position was renamed as Poet Laureate Consultant in Poetry (or simply Poet Laureate) in 1986.Frost recited his poem "The Gift Outright" at the 1961 inauguration of John F. Kennedy... Frost attended both Dartmouth College and Harvard, but did not graduate from either school... Frost preferred traditional rhyme and meter in poetry; his famous dismissal of free verse was, "I'd just as soon play tennis with the net down." ...more Combine EditionsRobert Frost’s books Robert Frost Average rating: 4.23 · 138,980 ratings · 4,933 reviews · 889 distinct works • Similar authors //<![CDATA[ function submitShelfLink(unique_id, book_id, shelf_id, shelf_name, submit_form, exclusive) { var checkbox_id = 'shelf_name_' + unique_id + '_' + shelf_id; var element = document.getElementById(checkbox_id) var checked = element.checked if (checked && exclusive) { // can't uncheck a radio by clicking it! return } if(document.getElementById("savingMessage")){ Element.show('savingMessage') } var element_id = 'shelfInDropdownName_' + unique_id + '_' + shelf_id; Element.update(element_id, "saving..."); if (submit_form) { Element.hide('shelfDropdown_' + unique_id) var form = document.getElementById('addBookForm' + book_id) if (form) { form.shelf.value = shelf_name form.onsubmit() } } else { var action = checked ? 'remove' : '' element.checked = !element.checked new Ajax.Request('/shelf/add_to_shelf', {asynchronous:true, evalScripts:true, onSuccess:function(request){shelfSubmitted(request, book_id, checkbox_id, element_id, unique_id