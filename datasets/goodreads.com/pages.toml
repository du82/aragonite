), serving as its first president. His efforts led to the 1963 March on Washington, where King delivered his “I Have a Dream” speech. Here he raised public consciousness of the civil rights movement and established himself as one of the greatest orators in U.S. history. In 1964, King became the youngest person to receive the Nobel Peace Prize for his efforts to end segregation and racial discrimination through civil disobedience and other non-violent means.King was assassinated on April 4, 1968, in Memphis, Tennessee. He was posthumously awarded the Presidential Medal of Freedom by President Jimmy Carter in 1977. Martin Luther King, Jr. Day was established as a national holiday in the United States in 1986. In 2004, King was posthumously awarded a Congressional Gold Medal. ...more Combine EditionsMartin Luther King Jr.’s books Martin Luther King Jr. Average rating: 4.49 · 72,868 ratings · 6,315 reviews · 355 distinct works • Similar authors //<![CDATA[ function submitShelfLink(unique_id, book_id, shelf_id, shelf_name, submit_form, exclusive) { var checkbox_id = 'shelf_name_' + unique_id + '_' + shelf_id; var element = document.getElementById(checkbox_id) var checked = element.checked if (checked && exclusive) { // can't uncheck a radio by clicking it! return } if(document.getElementById("savingMessage")){ Element.show('savingMessage') } var element_id = 'shelfInDropdownName_' + unique_id + '_' + shelf_id; Element.update(element_id, "saving..."); if (submit_form) { Element.hide('shelfDropdown_' + unique_id) var form = document.getElementById('addBookForm' + book_id) if (form) { form.shelf.value = shelf_name form.onsubmit() } } else { var action = checked ? 'remove' : '' element.checked = !element.checked new Ajax.Request('/shelf/add_to_shelf', {asynchronous:true, evalScripts:true, onSuccess:function(request){shelfSubmitted(request, book_id, checkbox_id, element_id, unique_id, shelf_name)}, parameters:'book_id=' + book_id + '&name=' + shelf_name + '&a=' + action + '&a