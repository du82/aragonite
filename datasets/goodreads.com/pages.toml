title = "Boneshaker (The Clockwork Century, #1) by Cherie Priest | Goodreads"
description = "In the early days of the Civil War, rumors of gold in the frozen Klondike brought hordes of newcomers to the Pacific Northwest. Anxious to compete, Russian prospectors commissioned inventor Leviticus Blue to create a great machine that could mine through Alaska’s ice. Thus was Dr. Blue’s Incredible Bone-Shaking Drill Engine born.But on its first test run the Boneshaker went terribly awry, destroying several blocks of downtown Seattle and unearthing a subterranean vein of blight gas that turned anyone who breathed it into the living dead.Now it is sixteen years later, and a wall has been built to enclose the devastated and toxic city. Just beyond it lives Blue’s widow, Briar Wilkes. Life is hard with a ruined reputation and a teenaged boy to support, but she and Ezekiel are managing. Until Ezekiel undertakes a secret crusade to rewrite history.His quest will take him under the wall and into a city teeming with ravenous undead, air pirates, criminal overlords, and heavily armed refugees. And only Briar can bring him out alive."
full_description = '''Michael273 reviews843 followersFollowFollowDecember 4, 2013``Miss Eliza Bennet, let me persuade you to follow my example, and take a turn about the room. -- I assure you the anti-gravity hoverchannel is very refreshing after sitting so long in one attitude.'' Eliza was surprised, but agreed to it immediately. She unstrapt herself from her leather seat restraints and stood, careful to maintain her balance as the airship encountered turbulence. When she entered the hoverchannel, she activated the polarity redistribution magnets within her combat suit and began floating comfortably around the perimeter of the foyer. Miss Bingley's attention was quite engaged in watching Mr. Darcy's progress through his book, so much so that at one point she nearly navigated the ship into the side of Pemberley; and she was perpetually making some inquiry. At length, finally exhausted by her tenacious attempts to force a conversation regarding his book, Darcy relented. "It's entitled Boneshaker. An American novel." "What do you think of it?" Eliza said as she drifted by. "A bit nonsensical, really. Steampunk claptrap about the Civil War going on much longer than it actually did, which caused technological advances that didn't really happen until much later. And a zombie-infested city called Seattle. It has been blocked off from the rest of the country, and our heroine must go in to rescue her foolish son." Mr. Bingley crossed the room, his steam-powered mechanical legs stomping their way across the carpet to the cabinet where he refilled his glass. "Zombies in America? That does sound quite silly. Everyone knows that zombies are native to Britain. That's how I lost my legs." "Please, Bingley, don't tell us that old story again," Mr. Hurst said, adjusting himself on the sofa before falling back asleep. Darcy said, "The plot moves along at a good pace, but the characters are a bit uninspired. A teenage boy constantly doing something inadvisable; the protective mother, blasting zombies and trying to save him." Eliza smiled. "Darcy, certainly you aren't saying literature is full of strong female characters who run around rescuing male characters." "Nor should it be," Mr. Hurst said, drifting slowly in and out of consciousness. Ignoring Mr. Hurst's interjection, Darcy said, "I suppose the fairer sex aren't shown in powerful roles that often, even in these books written in the far future about the distant past . . . er, or perhaps about the same time as now . . . When were we written?" Miss Bingley inquired, "Are you sure the dinner agreed with you?" "I feel fine, thank you," Darcy said. "Admit it," Sherlock Holmes said, standing in the doorway, Watson at his side. "You enjoy all the fashionable gimmicks flying left and right, and the pace keeps you entertained. Yet you wonder why nothing surprising was done with any of these elements." Darcy moved over as Holmes sat on the sofa beside him, lighting a pipe. "You're right, Holmes. The whole reinvention of the Civil War is fascinating in theory. Then the author does nothing with it. The book has nothing to say. No reflections on the civil war, racism, or politics. Nor does it say anything about the true nature of zombies. In fact, it says little about love, which is the very heart of the story." J. K. Rowling, refilling her glass of zinfandel, said, "And it's practically a young adult novel, isn't it? Other than one or two mildly violent zombie moments and one four letter 'S' word, this could be the next film from Pixar. There's not even a gay sorcerer to throw off the prudes." Darcy met Eliza's eyes as she orbited the room. "Have you read it as well, Miss Bennett?" "Braaaains," Mr. Hurst moaned softly."I found it diverting," Eliza said. "I always read the books nominated for the Nebula awards. But, like you, I found the novel didn't meet my expectations. When you look beyond the stylish trappings, you have a run-of-the-mill adventure story written in a workmanlike fashion. I imagine the query letter was spectacular, though." Darcy was on the verge of speaking when Mr. Hurst lunged up from the sofa, saliva splattering from his vicious maw, his eyes sunken in and rolled back into his head. He lurched across the room toward Bingley, whose back was facing him. Eliza kicked off of the wall and rolled over to Darcy, pulling his pistol from his belt, and fired several rounds through Mr. Hurst's head. A splatter of blood, brain and skull chips showered down on Harold Bloom. "Well," Mr. Harold Bloom said, wiping blood from his face and wiping it on the sofa, "that was entirely unnecessary, but what HASN'T been? The whole book review is sound and fury, signifying nothing. And how many times is this hack going to parody Pride and Prejudice? He seems to think it's much more funny than it is, just as Oscar Wilde thought himself hilarious, when he is in fact highly over-esteemed." Holmes puffed his pipe, a gray cloud of smoke rising above him. "I can't believe I didn't notice Mr. Hurst was turning. Usually I'm so attentive to details." "Nobody's perfect," Darcy said. "Would you mind putting that pipe out? We are in a zeppelin, you know." Holmes sighed and stood up, pulling on his overcoat. "I'm going next door to the Kurt Vonnegut review. Pipe smoking is encouraged over there." And as Holmes left the room, suddenly the review stopped.most-popular-reviews sf-fantasy382 likes68 commentsLike Comment'''
