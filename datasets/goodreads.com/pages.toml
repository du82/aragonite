["https://goodreads.com/book/show/11468377-thinking-fast-and-slow"]
title = "Thinking, Fast and Slow by Daniel Kahneman | Goodreads"
description = "In the highly anticipated Thinking, Fast and Slow, Kahneman takes us on a groundbreaking tour of the mind and explains the two systems that drive the way we think. System 1 is fast, intuitive, and emotional; System 2 is slower, more deliberative, and more logical. Kahneman exposes the extraordinary capabilities—and also the faults and biases—of fast thinking, and reveals the pervasive influence of intuitive impressions on our thoughts and behavior. The impact of loss aversion and overconfidence on corporate strategies, the difficulties of predicting what will make us happy in the future, the challenges of properly framing risks at work and at home, the profound effect of cognitive biases on everything from playing the stock market to planning the next vacation—each of these can be understood only by knowing how the two systems work together to shape our judgments and decisions.Engaging the reader in a lively conversation about how we think, Kahneman reveals where we can and cannot trust our intuitions and how we can tap into the benefits of slow thinking. He offers practical and enlightening insights into how choices are made in both our business and our personal lives—and how we can use different techniques to guard against the mental glitches that often get us into trouble. Thinking, Fast and Slow will transform the way you think about thinking."
full_description = "Trevor1,445 reviews23.8k followersFollowFollowMay 1, 2012This is a fascinating book. Reading this book means not having to read so many others. For example, you could avoid having to read, Sway, Blink, Nudge and probably a dozen or so other books on Behavioural Economics. And the best part of it is that this is the guy (or, at least one half of the two guys) who came up with these ideas in the first place. I was thinking that perhaps the best way to explain those other books would be to compare them to Monty Python. I want you to imagine something - say you had spent your entire life and never actually seen an episode of Monty Python's Flying Circus. That wouldn't mean you wouldn't know anything about Monty Python. It is impossible to have lived at any time since the late 60s and not have had some socially dysfunctional male reprise the entire Parrot sketch or Spanish Inquisition sketch at you at some stage in your life. I suspect, although there is no way to prove this now, obviously, that Osama bin Laden could do the Silly Walk like a natural. Well, if you had never seen an episode of Monty Python and your entire experience of their work was via the interpretation of men of a certain age down the pub - then finally getting to see an episode of the original would be much the same effect as reading this book. Hundreds of people have already told all this guy's best stories in their own books - but all the same it is a pleasure to hear them again by the guy that first said, 'this parrot is dead' or rather, 'framing effects make fools of us all'.You need to read this book - but what is particularly good about it is that you come away from it knowing we really are remarkably easy to fool. It's because we think we know stuff that this comes as a constant surprise to us. Years ago I was talking to a guy who liked to bet. Everyone needs a hobby and that was his. Anyway, he told me he was playing two-up - an Australian betting game - and he realised something like tails hadn't come up frequently enough and so he started betting on tails and sure enough he made money. I told him that coins don't remember the last throw and so the odds of getting a tail was still 50%, as it had previously been. But I had no credibility - I'd already told him I never bet - so, how would I possibly know anything if I wasn't even brave enough to put my own money on the outcome? And didn't I understand the point of this story was he had already WON?Still, when faced with a series of coin flips that run - H, H, H, H, H, T, H, H, H - it does feel like tails are 'due'. This is the sort of mistake we are all too prone to make. The thing to remember is that while there is a law of large numbers - toss a coin often enough and in the very long run there will be as many heads turn up as tails - that isn't the case in the short run - where just about anything is possible.We (that is, we humans) are remarkably bad at mental statistics. And what makes it worse is that we are predictably bad at statistics. And this brings me to Bourdieu and him saying that Sociology is kind of martial art. He means that Sociology allows you to defend yourself from those who would manipulate you. Well, this book is the Bruce Lee book of advanced self-defence. Learning just how we fool ourselves might not make you feel terribly great about what it means to be human - but at least you will know why you hav stuffed up next time you do stuff up. I'm not sure it will stop you stuffing up - but that would be asking for an awful lot from one book.If you want the short version of this book, he has provided the two papers that probably got him the Nobel Prize - and they are remarkably clear, easy to understand and comprehensive. But look, read this book - it will do you good. behavioural-economics935 likes68 commentsLike Comment"
