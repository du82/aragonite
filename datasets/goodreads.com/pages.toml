& InterviewsGenresArtBiographyBusinessChildren'sChristianClassicsComicsCookbooksEbooksFantasyFictionGraphic NovelsHistorical FictionHistoryHorrorMemoirMusicMysteryNonfictionPoetryPsychologyRomanceScienceScience FictionSelf HelpSportsThrillerTravelYoung AdultMore GenresCommunity ▾GroupsQuotesAsk the Author About Goodreads About Goodreads Jobs Blog Authors & Advertisers Blog Press Contact Advertisers Author Program Librarian Manual Help FOLLOW US /goodreads @goodreads goodreads.com /goodreads The right book in the right hands at the right time can change the world. Who We Are Goodreads is the world’s largest site for readers and book recommendations. Our mission is to help readers discover books they love and get more out of reading. Goodreads launched in January 2007. A Few Things You Can Do On Goodreads See what books your friends are reading. Track the books you're reading, have read, and want to read. Check out your personalized book recommendations. Our recommendation engine analyzes 20 billion data points to give suggestions tailored to your literary tastes. Find out if a book is a good fit for you from our community’s reviews. A Message From Our Co-Founder When I was in second grade, I discovered the Hardy Boys series. Ever since, I've loved to read — both for fun and to improve my mind. And I'm always looking for the next great book. One afternoon while I was scanning a friend's bookshelf for ideas, it struck me: when I want to know what books to read, I'd rather turn to a friend than any random person or bestseller list. So I decided to build a website – a place where I could see my friends' bookshelves and learn about what they thought of all their books. Elizabeth, my co-founder (and now my wife) wrote the site copy and I wrote the code. We started in my living room, motivated by the belief that there was a better way to discover and discuss good books, and that we could build it. Goodreads is that site. It is a place where you can see what your friends are reading and vice versa. You can create "bookshelves" to organize what you've read (or want to read). You can comment on each other's reviews. You can find your next favorite book. And on this journey with your friends you can explore new territory, gather information, and expand your mind. Knowledge is power, and power is best shared among readers. Otis Chandler Co-Founder Company About us Careers Terms Privacy Interest Based Ads Ad Preferences Help Work with us Authors Advertise Authors & ads blog Connect © 2025 Goodreads, Inc. Mobile version'''
