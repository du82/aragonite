& InterviewsGenresArtBiographyBusinessChildren'sChristianClassicsComicsCookbooksEbooksFantasyFictionGraphic NovelsHistorical FictionHistoryHorrorMemoirMusicMysteryNonfictionPoetryPsychologyRomanceScienceScience FictionSelf HelpSportsThrillerTravelYoung AdultMore GenresCommunity ▾GroupsQuotesAsk the Author Discover new books on Goodreads See if your friends have read any of Oscar Wilde's books Sign in with Facebook Sign in options Join Goodreads more photos (1) Oscar Wilde’s Followers (37,233) Add NewVideos 4 comments More videos… Oscar Wilde Born in Dublin, Ireland October 16, 1854 Died November 30, 1900 Genre Theatre, Poetry, Humor and Comedy, Fiction, Children's Influences Balzac, Walter Pater, Edgar Allan Poe, John Ruskin, Peter Kropotkin, L Balzac, Walter Pater, Edgar Allan Poe, John Ruskin, Peter Kropotkin, Lewis Carroll, Robert Louis Stevenson ...more edit data Oscar Fingal O'Fflahertie Wills Wilde was an Irish poet and playwright. After writing in different forms throughout the 1880s, he became one of the most popular playwrights in London in the early 1890s. He is best remembered for his epigrams and plays, his novel The Picture of Dorian Gray, and his criminal conviction for gross indecency for homosexual acts.Wilde's parents were Anglo-Irish intellectuals in Dublin. In his youth, Wilde learned to speak fluent French and German. At university, he read Greats; he demonstrated himself to be an exceptional classicist, first at Trinity College Dublin, then at Magdalen College, Oxford. He became associated with the emerging philosophy of aestheticism, led by two of his tutors, Walter Pater and Joh Oscar Fingal O'Fflahertie Wills Wilde was an Irish poet and playwright. After writing in different forms throughout the 1880s, he became one of the most popular playwrights in London in the early 1890s. He is best remembered for his epigrams and plays, his novel The Picture of Dorian Gray, and his criminal conviction for gross indecency for homosexual acts.Wilde's parents were Anglo-Irish intellectuals in Dublin. In his youth, Wilde learned to speak fluent French and German. At university, he read Greats; he demonstrated himself to be an exceptional classicist, first at Trinity College Dublin, then at Magdalen College, Oxford. He became associated with the emerging philosophy of aestheticism, led by two of his tutors, Walter Pater and John Ruskin. After university, Wilde moved to London into fashionable cultural and social circles.Wilde tried his hand at various literary activities: he wrote a play, published a book of poems, lectured in the United States and Canada on "The English Renaissance" in art and interior decoration, and then returned to London where he lectured on his American travels and wrote reviews for various periodicals. Known for his biting wit, flamboyant dress and glittering conversational skill, Wilde became one of the best-known personalities of his day. At the turn of the 1890s, he refined his ideas about the supremacy of art in a series of dialogues and essays, and incorporated themes of decadence, duplicity, and beauty into what would be his only novel, The Picture of Dorian Gray (1890). Wilde returned to drama, writing Salome (1891) in French while in Paris, but it was refused a licence for England due to an absolute prohibition on the portrayal of Biblical subjects on the English stage. Undiscouraged, Wilde produced four society comedies in the early 1890s, which made him one of the most successful playwrights of late-Victorian London.At the height of his fame and success, while An Ideal Husband (1895) and The Importance of Being Earnest (1895) were still being performed in London, Wilde issued a civil writ against John Sholto Douglas, the 9th Marquess of Queensberry for criminal libel. The Marquess was the father of Wilde's lover, Lord Alfred Douglas. The libel hearings unearthed evidence that caused Wilde to drop his charges and led to his own arrest and criminal prosecution for gross indecency with other males. The jury was unable to reach a verdict and so a retrial was ordered. In the second trial Wilde was convicted and sentenced to two years' hard labour, the maximum penalty, and was jailed from 1895 to 1897. During his last year in prison he wrote De Profundis (published posthumously in abridged form in 1905), a long letter that discusses his spiritual journey through his trials and is a dark counterpoint to his earlier philosophy of pleasure. On the day of his release, he caught the overnight steamer to France, never to return to Britain or Ireland. In France and Italy, he wrote his last work, The Ballad of Reading Gaol (1898), a long poem commemorating the harsh rhythms of prison life. ...more Combine EditionsOscar Wilde’s books Oscar Wilde Average rating: 4.12 · 2,716,711 ratings · 140,863 reviews · 5,153 distinct works • Similar authors //<![CDATA[ function submitShelfLink(unique_id, book_id, shelf_id, shelf_name, submit_form, exclusive) { var checkbox_id = 'shelf_name_' + unique_id + '_' + shelf_id; var element = document.getElementById(checkbox_id) var checked = element.checked if (checked && exclusive) { // can't uncheck a radio by clicking it! return } if(document.getElementById("savingMessage")){ Element.show('savingMessage') } var element_id = 'shelfInDropdownName_' + unique_id + '_' + shelf_id; Element.update(element_id, "saving..."); if (submit_form) { Element.hide('shelfDropdown_' + unique_id) var form = document.getElementById('addBookForm' + book_id) if (form) { form.shelf.value = shelf_name form.onsubmit() } } else { var action = checked ? 'remove' : '' element.checked = !element.checked new Ajax.Request('/shelf/add_to_shelf', {asynchronous:true, evalScripts:true, onSuccess:function(request){shelfSubmitted(request, book_id, checkbox_id, element_id, unique_id, shelf_name)}, parameters:'book_id=' + book_id + '&name=' + shelf_name + '&a=' + action + '&authenticity_token=' + encodeURIComponent('ivGVF3A0ffpiNRefiVx5kOTS59IClRBbheStKA3Y5ySbKPJ5LLrT