["https://goodreads.com/book/show/1713426.Predictably_Irrational"]
title = "Predictably Irrational: The Hidden Forces That Shape Our Decisions by Dan Ariely | Goodreads"
description = '''Why do our headaches persist after taking a one-cent aspirin but disappear when we take a 50-cent aspirin?Why does recalling the Ten Commandments reduce our tendency to lie, even when we couldn't possibly be caught?Why do we splurge on a lavish meal but cut coupons to save twenty-five cents on a can of soup?Why do we go back for second helpings at the unlimited buffet, even when our stomachs are already full?And how did we ever start spending $4.15 on a cup of coffee when, just a few years ago, we used to pay less than a dollar?When it comes to making decisions in our lives, we think we're in control. We think we're making smart, rational choices. But are we?In a series of illuminating, often surprising experiments, MIT behavioral economist Dan Ariely refutes the common assumption that we behave in fundamentally rational ways. Blending everyday experience with groundbreaking research, Ariely explains how expectations, emotions, social norms, and other invisible, seemingly illogical forces skew our reasoning abilities.Not only do we make astonishingly simple mistakes every day, but we make the same "types" of mistakes, Ariely discovers. We consistently overpay, underestimate, and procrastinate. We fail to understand the profound effects of our emotions on what we want, and we overvalue what we already own. Yet these misguided behaviors are neither random nor senseless. They're systematic and predictable--making us "predictably" irrational.From drinking coffee to losing weight, from buying a car to choosing a romantic partner, Ariely explains how to break through these systematic patterns of thought to make better decisions. "Predictably Irrational" will change the way we interact with the world--one small decision at a time.'''
full_description = '''Petra is wondering when this dawn will beome day2,456 reviews35.3k followersFollowFollowNovember 6, 2022“I asked them why when they persecute men, for religion or colour it was seen by the world as oppression and when they persecute women, it was dismissed as tradition.” Emer Martin This book is generally brilliant if you ignore the misogyny. It is a book written by a man about a man's world for men. The "Our' in the title does not include half the world. The misogny, the putting down of fat women, ugly ones, old ones in this often otherwise insightful and percipient book is making me groan. The author is trying to prove something we all know, that we (he uses 'we' and 'our' to sound inclusive, but he only means men really) do not make good decisions when sexually aroused. To that end he sets up an experiment where the men, MIT students, will have to answer a set of questions 'sober' and while they are wanking to pictures of buxom young women flashed on their computers.The questions include, Would you want to have sex with a really fat woman? An ugly one? A woman over 50? All the undesirable women. All these women are put down as sexual objects these really clever guys wouldn't want to have sex with unless they were so aroused by any stimuli they didn't care. That their general powers of discernment and decision-making ie. we don't screw fat,ugly or old women, would go by the board because at that stage they'd screw anything. Also, that in such an aroused state, those clever MIT men, future leaders of technology and business, perhaps even footballers) those men might deliberately get a woman drunk and/or persist in pushy or downright aggressive sexual advances even after she had said 'no' and they wouldn't give a monkeys about using a condom either.(Part of me wonders how those men felt who had girlfriends who didn't look like supermodels).Personally I think he wrote up the experiment so as he could begin with describing the visual of a cling-film (saran wrap to Americans) wrapped computer (to protect it from splashes of semen) flashing porn and questions and a man 'furiously wanking with his left hand' while propped up on the bed. Ok, so I'm predictably irrational about books that slag off my half the human race. You know that I will pick up the misogyny and be compelled to write about it.2015-read 2015-reviews popculture-anthropology ...more586 likes70 commentsLike Comment'''
