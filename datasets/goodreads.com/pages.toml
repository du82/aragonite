title = "1984 by George Orwell | Goodreads"
description = "Among the seminal texts of the 20th century, Nineteen Eighty-Four is a rare work that grows more haunting as its futuristic purgatory becomes more real. Published in 1949, the book offers political satirist George Orwell's nightmarish vision of a totalitarian, bureaucratic world and one poor stiff's attempt to find individuality. The brilliance of the novel is Orwell's prescience of modern life—the ubiquity of television, the distortion of the language—and his ability to construct such a thorough version of hell. Required reading for students since it was published, it ranks among the most terrifying novels ever written."
full_description = '''Mohammed Arabey709 reviews6,377 followersFollowFollowFebruary 19, 2017It's written 1948? Clearly History has its twisted ways to repeat itself..A Note that MUST be written in the cover of every edition..لم اتوقع أن هذا التحذير "إن هذه الرواية تحذير وليست بدليل" بهذه الواقعية، مازالت الحكومات العربية تراقب الجميع لحماية أمن الحكام..بينما مازال أمن الأفراد هزيلا..منعدماهي الرواية التي كتبت في 1948 بعبقرية، أرسي بها جورج أورويل قواعد روايات الديستوبيا بحقوإن كانت مستوحاه من واقع محيط به ولكن التاريخ دائما يجد وسيلة ليتكرر ويزيد وينتشر ويتوغلهي رواية مازالت صداها في روايات شبابية تصدر حتي الأن متأثرة بها..بل وقد تكون اكثر امتاعا منها*تحذير هام قبل البدء*كاتب الريفيو متأثرا ويعاني أعراض "ازدواجية التفكير" بشكل خطيرفأذا لم تقرأ الرواية بعد فستستشعر ان كاتب الريفيو "مجنونا"، أما اذا قد قرأتها فستتيقن انه حتما يعاني من الجنون =======*****=======عشقت هذه الروايه لدرجه الكراهيهاحببت جمال قبح العامه، وكرهت الحريه بشده..اقتنعت باننا يجب ان نخطئ وارتعبت جدا من الصوابوقد كرهت بشده الاجزاء السياسيه و ضجرت من تلك المقاله السياسيه الطويله "في الجزء الثاني" والتي عزمت علي ان اقرأها قراءه سريعه ..ولكن قرأت مايقرب من 40 صفحه في ساعه ونصف!! لأني شعرت انها فعلا يجب ان تقرأ بتمعن, فهي من اهم المقالات السياسية الواقعيةكرهت تلك المشاهد الجنسيه البسيطه ولعلي استشطت غضبا اذا لم تحدثوكم كرهت تلك النهايه التي شعرت انها قُدمت كنهاية سعيده..واكرهها اكثر كلما اشعر انها فعلا ليست سعيدهلقد عشقت تلك الروايه لاني شعرت بالملل المثير طوال احداثهالم اشعر انها كلاسيكيه,رايتها معاصره واحداثها واقعية وتدور في الوقت الحالي , ومع ذلك شعرت بملل الكلاسيكيات بهاروايه ينعدم فيها العواطف ولكني تأثرت لدرجه الدمع في احد مشاهدها روايه عشقت فيها اشمئزازي الرهيب منها, واحداثها وشخصياتهاروايه كنت اسابق الزمن كي انهي عذابي معها..وافكر في نفس الوقت متي سأقرأها مره ثانيه..قريبا =======*****=======الاحداث------اذا كنت من هواة قراءة الروايات الحديثة -مثلي- واعجبتك تلك الروايات المصنفه كديستوبيا - حيث يعم المدينه او الدوله او العالم ككل الظلم و القهر والفساد والاستبداد, الدمار والتجارب اللاانسانيه - تلك الروايات مثلThe Hunger Games و The Maze Runner و Divergentاو تجربه الرائع احمد خالد توفيق المصريه يوتوبيا فعليك بالبدء في تلك الروايه الكلاسيكيه للروائي العبقري "جورج اورويل" 1984-فهي مدخل رائع لمثل ذلك النوع من الروايات, ولن تشعر أبدا انها كلاسيكية او قديمة, حتي وان كانت ترجع ل1948...قبل عنوان الرواية بأربعون عامايجب التنويه انه اذا كنت قراءتها واعجبتك بالفعل فعليك بقراءه تلك الروايات الحديثه ايضا- ..بالأخص العاب المجاعاتعقب الحرب العالميه الثانيه وفي وقت صراعات النازيه والشيوعيه ,فتره الاربعينات من القرن الماضي ينقلك المؤلف الي لندن في الديستوبيا التي يتنبأ بها بعد اقل من 40 عاماففي عام 1984 ستجد ان العالم بعد صراعاته الدمويه النوويه صار مقسما الي 3 قوي رئيسيه تتحكم في العالم بكل ما تحمله كلمه "تحكم" من معنيفتتحكم في مسكنك ومأكلك ومشربك,تتحكم في اسلوب حياتك,تتحكم في أراءك,توجهاتكتتحكم في افكارك,مشاعرك,عواطفك..فتذكر ان الاخ الكبير يراقبك..دائما وابداهل العالم كله هكذا؟ كيف لك ان تعرف ماذا يحدث في باقي العالم..اصمت واستمع للاخ الكبير فحسب..لا يوجد لك سبيل تواصل مع العالم الخارجي..فكلهم عدو لبلدكانت منعزل تماما عن العالم..لايصلك من اخباره الا ما يقوله لك الأخ الكبير - هل يبدو ذلك مألوفا لك؟؟ستقابل مفاجأت واحداث مثيره, ثوره داخليه بعقلك,عقل وينستون البطل الذي تتعايش معه..كراهيه التمرد والشغف الشديد بهنبذ الحريه التي هي العبوديه..نبذ السلام الذي هو الحرببالنسبه لي ما يعيب الاحداث شيئا ما هو الجزء المطول من "كتاب حكم الاقليه" والذي ذكرني كثيرا بجو كتب الفلسفه السياسيه كتلك التي يقدمها "يوسف زيدان" وغيره من مدعي الحنكة السياسية...ولكن يقدمها جورج اورويل ��نا بطريقه محايده, مفهومة ومتميزة وبالرغم من الملل الذي اعتراني في الجزء الثاني ربما اغلبه بسبب هذا الجزء والذي بالرغم من انك قد قرأت ملخصه في الجزء الاول من الاحداث الا انك ستجد انه من الصعب ان تتركه دون قراءهويحسب بحق للمؤلف "تعمقه الشديد"في احداث روايته ورسمها فعلا كانها عن عالم حقيقي.. "ذكرني بعبقريه اخري معاصره هي جي كي رولينج عندما تسهب في عرض مقالات من جرائد عالمها الساحر او عرض صفحات عده لاحد كتب ذلك العالم الخيالي الذي ابتكرته" وهذا ان دل علي شئ فانما يدل عن انك امام روايه ثريه لم يبخل المؤلف بها بشئ ليجعل من الخيال واقعيه فهو ايضا مزج تاريخ اوقيانيا بتاريخ تلك الاحداث العالميه الحقيقيه والمعاصره -وقت صدور الروايه - من نازيه و شيوعيهراعني ايضا ملاحظه وجدتها علي الويكابيديا هو ان "تبخير الانسان" واعتباره لم يكنUnpersonكان امرا حقيقيا واتبعه بتعديل الصور وذلك في الاتحاد السوفييتي في الثلاثينات في صوره لستالين مع نيكولاي يزوف رئيس الشرطه السريه والتي تم تعديلها بعد اعدام الاخير لينسب الفضل لستالين وحده في حمله التطهير الشيوعيه وليكون وحده صاحب الفضل في بناء الاتحاد السوفييتي..اي ان الامر له اصول حقيقيهوأه من مظهر ستالين نفسه :)وكما قلت في بدايه الريفيو ان ازدواجيه التفكير قادتني الي الجنون في هذا الريفيوفاني من اعجابي الشديد بالروايه كنت اتمني ان لا تنتشر, ولا يتم طبعها ولا قراءتها علي نطاق واسع...فكم من اخ كبير ظهر بعدها ونفذ قليلا او كثيرا من سياسته...سواء كان علي حق وصواب في جزء من سياسته او علي خطأكم منا وصل الامر معه لعشق الاخ الكبير وحبه وتوقف عقله وذهنه وكأن هذا الاخ الكبير الذي نصبه لنفسه لا يخطئ؟وايضا من اعجابي الشديد بالروايه اتمني ان تنتشر ويتم طبعها كثيرا و تقرأ علي نطاق واسعفكم منا يجب ان يفيق ويدرك ان عليه ان يعمل بعقله ويفكر كثيرا في حريه فكره وعقله...يفكر لصالحه ولصالح المجتمع ويتخلص من سلطه الاخ الكبير عندما يراه خاطئا كاذبا او منافقا الصور مجرد صور..لاتعبر عن راي شخصي فمابين تلك الصور ناس احترم سياستهم ولكني لا اراهم دائما علي حق ..فهم بشر اولا واخيرا بعضهم اصابوا ويصيبون قليلا و اخطئوا و يخطئون كثيرا و بعضهم العكستناقض؟ هذا هو مايسمي بازدواجيه الفكر التي ستجدها في تلك الروايه الرائعه بحقاقرأها لتتعرف كيف تحكم عقلك في مايعرض عليك من تاريخ..لتحاول التفرقه بين الزيف وبين الحقلعلنا نستطيع القضاء علي من يسيطر علينا باسم الاخ الكبير..او من يدعي انه جولدشتاين عصره..اقرأها فانها بحقروايه مرهقه للعقل=======*****=======الشخصيات------- وينستون سميثهو من ستتوحد معه خلال احداث الروايهوهو الاختيار المناسب ,فهو الطبقه المتوسطه-ماتحت النخبة-..فهو يتوافر له الطعام والشراب والمسكن...ليس ادميا او يتناسب مع كونه احد اعضاء الحزب الخارجي وانما علي الاقل ادميا بما فيه الكفايه مقارنه بعامه الشعب ,اللاشئ , هؤلاء الذين يمثلون 85% من السكان,وهو في وضع أأمن منهم بعيدا عن اماكنهم المعرضه للقصف باستمرارولكنه ليس افضل حالا منهمفقيود حريته اعظم بكثير فهو -عكس عامه الشعب-مراقب 24/7حتي في احلامه واغوار عقله الباطن فيجب ان يكون منضبطا كالمسطره..تاركا افكارك ومشاعرك وعواطفك وتوجهاتك في يد "الاخ الكبير"..في يد حزبك الداخلي والذي يمثل 2% من السكان..اسيادكذلك الحزب الداخلي الذي لا تعرف كيف يعيش..هل هو مثلك في تلك المعيشه..معيشه الكفاف او ما دونه؟ بالتاكيد لا, هم ليسوا كعامه الشعب الذين صاروا تحت مستوي الفقر..بل تحت مستوي الحياه نفسها, فلا يلقوا الكفاف..وحياتهم مهدده من وقت لاخر جراء عمليات القصف الحربيه التي لا احد يعرف كنهها بالتحديدبرع المؤلف في رسم شخصيته بطريقه ممتازه,تحولاته ودوافعه وافكاره بل ورسم ذكرياته باتقان وربط بينها وبين الاحداث بطريقه..عبقريه جورج اورويل فعلا ايقنتها برسمه لشخصيتهادمعت بحق كما قلت في بدايه الريفيو في تلك الذكري التي تذكرها قبل لحظات النهايه عندما كان يلعب السلم والثعبان مع امهتبا ها انا ارفض الكتابه عن تلك اللحظه لاني شعرت بالقشعريره الان مره اخريبالطبع وغضبت جدا لتلك النهايه السعيده..انها ليست تلك التي تمناها وينستون وانا معاه..ومع ذلك فاني متقبل تماما ان يلقي مصيره..سعيداالم اقل لك؟ انها ازدواجيه التفكير تبا لها تلك اللعينهجولياجوليا جوليا جوليا..اه من جوليا..لازدواجيه الفكر ظللت اعشقها واعشق فكرها واعشق ايضا فكره تحطيم راسها في اغلب الوقتهي زميله وينستون في وزاره الحقيقه في الحزب الخارجي..زميلته الغامضه المريبه المتزمته لدرجة انك ستشعر انها روح الحزب نفسه..ولكنك ستكتشف عنها اشياء لم تخطر علي بالاوبراينعضو الحزب الداخلي الموقر..واحد من الساده ..ال2% من الشعب والذي من خلاله ستعرف مميزات هذه النخبهرجل وقور..مهيب..محترم..ستشعر كم يتفهمك بمجرد نظرتهوكم من المفاجأت التي يطويها في طياتهافستفاجأ انه مثلك ومعك في الفكر..ولعلك ستفاجأ بحق عندما تجد انه بالفعل روح متمردة تغلغلت الي هذا الحد بالحزبروايه لن تشعر معها بالوقت..روايه ستقلب تفكيركوكما يقول المترجم "الرائع بحق" انور الشامي لهذه النسخه العربيه إنها رواية تقرأ، ثم تقرأ من جديد وبالفعل..الي قراءه اخري ربما للنسخه الانجليزيه المره القادمه ان شاء اللهمحمد العربيمن 27 مايو 2013الي 30 مايو 2013785 likes102 commentsLike Comment'''
