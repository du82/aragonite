questions. Even let customers answer questions, too. Create posts, offers, and events Add posts to your Business Profile to promote special offers, events, and updates to keep customers in the loop. Respond to reviews Reply to public customer reviews to build trust with new and returning customers. Post answers to frequently asked questions List helpful business info upfront and save time by posting answers to common questions. Even let customers answer questions, too. 1 / 3 Show what you offer, from products to services Whether you’re a restaurant, store, or service provider, your profile helps customers do business with you easily and directly with product inventory, ordering, bookings, quotes, and more. Manage now Accept food orders and more Take orders for delivery and pickup and let customers make reservations. Even add your menu, so people can discover your best dishes. Learn more Be found for what you sell Be found by automatically listing your in-store products for free, right from your Business Profile. Learn more Offer your services Show a list of your business services and provide online quotes, so customers get the info they need to choose you. Learn more Know how customers find your business Discover what keywords people search to find you, and get insights on calls, reviews, bookings, and more to understand how your business connects with customers. Manage now .ion-case-study-module-191814062_main-0__picture { @media (max-width: 599px) { img { object-position: 50% 15%; } } @media (min-width: 600px) and (max-width: 1023px) { img { object-position: 50% 15%; } } } “I always asked customers, ‘What made you call me?’ and oftentimes they tell me, ‘We reached out because of your Business Profile on Google.’” Detroit Voltage-Detroit, Michigan Watch Story .ion-case-study-module-191814062_main-1__picture { @media (max-width: 599px) { img { object-position: 50% 15%; } } @media (min-width: 600px) and (max-width: 1023px) { img { object-position: 50% 15%; } } } “Getting Yogolandia on Google was absolutely key. It truly legitimizes you as a business. It’s free, there are photos, and we've gotten phenomenal reviews.” Yogolandia Yogurt and Botana Bar-Chicago, Illinois .ion-case-study-module-191814062_main-2__picture { @media (max-width: 599px) { img { object-position: 50% 15%; } } @media (min-width: 600px) and (max-width: 1023px) { img { object-position: 50% 15%; } } } “We love the insights that we get on searches.” Chicago Music Exchange-Chicago, Illinois .ion-case-study-module-191814062_main-3__picture { @media (max-width: 599px) { img { object-position: 50% 15%; } } @media (min-width: 600px) and (max-width: 1023px) { img { object-position: 50% 15%; } } } “We’re able to clearly say what we’re about and what our mission is.” Honest Soul Yoga-Alexandria, Virginia 1 / 4 Show the best of your business Reach more customers in three simple steps, with your free Business Profile. Manage now Claim Create a Business Profile, or manage an existing profile on Search and Maps Personalize Add hours, photos, and other details and get discovered by customers near you Manage Share updates, respond to reviews, and connect with customers on Google Your questions, answered Is a Business Profile on Google free? Yes, creating a Business Profile and listing your business on Google is free. Create your profile at no cost, and you can manage your business from Google Search and Maps to start reaching more customers. See all FAQ’s"
