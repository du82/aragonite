["https://goose.game/support"]
title = "Untitled Goose Game - Official Support / FAQ"
description = "It's a lovely morning in the village, and you are a horrible goose. Out now on Mac, PC, Nintendo Switch, PS4, and Xbox One."
full_description = '''Frequently Asked Questions Where do I get Untitled Goose Game? For PC/Mac, get it on the Epic Games Store, Steam, or itch.io. For the Nintendo Switch, from the Nintendo eShop. For the PlayStation 4, from the PlayStation Store. For the Xbox One, from the Microsoft Store. Is there a physical version? Yes. There are two versions: a retail one from Skybound Games available almost everywhere, and a lovely and fancier one direct from iam8bit. What's this new two-player mode? Oh dear! Two horrible geese! Now you can enjoy Untitled Goose Game with a friend, in a new two-player cooperative mode. The levels are the same, but now, as a honking duo, you can find new ways to play pranks and ruin everyone's day, together. What controllers does the two-player mode need? You'll need two controllers. On computers, a mouse and keyboard counts as a controller, so you can play two-player with that, plus a second non-keyboard controller. On Switch, you can control your goose with a single Joy-Con, so you can play two-player with a pair of Joy-Cons. Is the two-player mode online? No, it is local only. However! On some platforms, like Steam's Remote Play Together, PlayStation 4's Share Play, and Parsec for Mac or PC, you can actually play over the internet with a friend via streaming! Give it a try. What's new in the latest update? View the version history to see what's changed. What are the system requirements? macOS 10.12+ Windows 7 SP1+ 64-Bit DX10 graphics (shader model 4) What controls are supported on the PC? The game has full mouse and keyboard support, and supports most game controllers. Do I need to manually save my game? Nope! The game will auto-save as you play. When you return, your progress will be preserved, but the village will be tidied up and items put back to their original positions. Can I stream this game?Can I make money off those streams? Yes, you can, and thanks for asking. (But please note, we reserve the unlikely right to revoke that permission at any time.) Can I make or sell fan art? We love fan art, please hand-make wonderful art and share it with us! But if you want to sell your art, please read our policy on fan art. What accessibility features does it have? The game features re-bindable controls, and "hold"/"toggle" settings for all actions. Cursive text can also be swapped to a more legible sans serif font. I might be stuck and can’t progress despite doing the correct thing. Try using the “Reset” option from the in-game pause menu. Reset tidies the village while maintaining your progress. Items and people are restored to their default states, but any open gates remain open, and your completed tasks remain completed. If you do get stuck and find it necessary to reset, let us know! Resetting is meant to be a convenience, not a necessity. How can I contact you? For support issues, e-mail support@goose.game For media inquiries, e-mail press@goose.game And, most importantly, thank you for playing the Goose. It means a lot to us.'''
year_published = 2025
