sh Please The site was great. Thank you John L., April 6, 2018 Nominate Mr. Peter Stoffer to be appointed Senator of the House I found the site great; or, I found the site helpful. I did not carry on with the campaign for some reasons but no doubt this is a great platform to promote fairness and justice. Many thanks! Murad, April 2, 2018 Give Murad's parents a visit visa to the UK Good site but I liked the original 'read last first' way of dealing with signatures. I could find no way of choosing that, but my eyes are failing, so it may be my fault. I also find pale blue on white hard to read. I am relying on you keeping the petition archived in case I can find someone relevant to whom to submit it in future. J Y Comben, April 1, 2018 Non-residents of Wales ask for S4C funding to be maintained Unfortunately your site did not attract enough signatures. Kate O., March 28, 2018 Re-open Cessnock Railway Line Now! This platform served my needs and would recommend the service to others. Chad S., March 25, 2018 Great platform for local engagement GVA, March 19, 2018 Excellent experience thank you so much Jennifer H., March 6, 2018 Thank you for providing a space for me and a lot of other people's voice that needed heard heard!! Thank you Cacia Z., March 2, 2018 Empower Instagram Artists & Disarm the Instagram Trolls Thank you for this great tool. We were able to create a professional petition and will use this site again as necessary. Kathy T., March 1, 2018 The McFarland Apartments - Request for Resolution of Support from City Council Excellent site! Please make it easier to cancel / delete a petition. Lake Mabel Shores HOA, February 23, 2018 1 2 3 4 5 6 … 14 15 16 › Last »"
