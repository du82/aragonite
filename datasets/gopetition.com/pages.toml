full_description = '''President Trump, Restore the Arlington National Cemetery Reconciliation Memorial 3110 Signatures Nov 8 2024 Lunelle Siegel #Military Target: President Donald J. Trump Region: United States of America Website: www.DefendArlington.org In 2021, in the aftermath of the George Floyd death, Senator Elizabeth Warren pushed through an amendment to the National Defense Authorization Act that created the "Naming Commission". In a surprise move, the Commission recommended taking down the majestic, historic bronze sculpture sculpted by Jewish Veteran, Moses Ezekiel, which not only became his grave marker, upon his death, but also marks more than 300 veteran and widow graves in Section 16. Section 16 was established by US President William McKinley, a Union War Veteran, who advocated for 'reconciliation' between the south and the north after the American Victory in the Spanish-American war, when the sons of both sides joined together under 1 flag to defeat a common foe. Biden Secretary of Defense Lloyd Austin ordered implementation of the removal recommendation, frustrating multiple Federal laws meant to protect historic and cultural resources, and failing to utilize the Army's own citizen Advisory Committee. In a horrific display, between Hanukkah and Christmas, 2023, the military drove a massive crane into the cemetery and on Sunday morning began hoisting away the Memorial, while running heavy equipment over Ezekiel's, and others, graves. It was fully removed and boxed up by Christmas Eve. Called the "Christmas Monument" because of its reconciliation theme, the image of the removal while beautiful fresh green wreaths with red bows adorned the surrounding graves was shocking. Two lawsuits have been filed, but did not prevent the removal. As Commander in Chief, President Trump has the power to direct the Military to re-install the Memorial immediately. Please join us in asking him to so so by signing the petition. Thank you, - Defend Arlington Dear President Trump, I am requesting that you issue an immediate Executive Order to re-install the Reconciliation Memorial in Section 16 of Arlington National Cemetery by the Biden-Harris Administration. I know you tried to prevent the destruction of American History when you vetoed the 2021 NDAA and request that you put this on your first day agenda when inaugurated. Thank you. Sign the petition Sponsor Select your country or region United States of America Australia Canada United Kingdom ------------------- Afghanistan Africa Akrotiri and Dhekelia Åland Albania Algeria American Samoa Andorra Angola Anguilla Antarctica Antigua and Barbuda Argentina Armenia Aruba Ascension Island Asia Australia Austria Azerbaijan Bahamas Bahrain Bangladesh Barbados Belarus Belgium Belize Benin Bermuda Bhutan Bolivia Bosnia and Herzegovina Botswana Bouvet Island Brazil British Indian Ocean Territory British Virgin Islands Brunei Bulgaria Burkina Faso Burma (Myanmar) Burundi Cambodia Cameroon Canada Cape Verde Caribbean Cayman Islands Central African Republic Central America Chad Chile China Christmas Island Cocos Islands Colombia Comoros Cook Islands Costa Rica Côte d'Ivoire Croatia Cuba Curaçao Cyprus Czech Republic D.R. of the Congo Denmark Dhekelia Djibouti Dominica Dominican Republic East Timor Ecuador Egypt El Salvador England Equatorial Guinea Eritrea Estonia Ethiopia Europe Falkland Islands Faroe Islands Fiji Finland France French Guiana French Polynesia French Southern Territories Gabon Gambia Georgia Germany Ghana Gibraltar Greece Greenland Grenada Guadeloupe Guam Guatemala Guernsey Guinea Guinea-Bissau Guyana Haiti Heard and McDonald Islands Honduras Hong Kong Hungary Iceland India Indonesia Iran Iraq Ireland Isle of Man Israel Italy Ivory Coast Jamaica Japan Jersey Jordan Kazakhstan Kenya Kiribati Kosovo Kuwait Kyrgyzstan Laos Latvia Lebanon Lesotho Liberia Libya Liechtenstein Lithuania Luxembourg Macau Macedonia, Republic of Madagascar Malawi Malaysia Maldives Mali Malta Marshall Isl