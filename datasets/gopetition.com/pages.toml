["https://gopetition.com/about"]
title = "About Us | GoPetition"
description = "GoPetition - a leading international petition hosting portal with over 15 million registered users and nearly 70,000 petitions in more than 100 countries."
full_description = "Help (FAQ) About us Contact us Privacy Terms of use Disclaimer About Us GoPetition - a leading international petition hosting portal - offers advanced global hosting services and unrivalled customer service. GoPetition has a multi-million membership base with over 80,000 petitions in more than 100 countries. The site has helped many campaigners achieve success stories and has developed an international presence with robust social networks. GoPetition has no political affiliations and welcomes speech from a variety of perspectives. Our aim is to provide access to quality software and tailored petition hosting services while encouraging valuable content. Our customer service goal is to maintain same-day service standards. All petitions at GoPetition are instantly available when uploaded. GoPetition is a premium content site and has many academic, NGO and Government patrons. Our aim is to promote the publication of high profile and quality premium content. GoPetition has a robust privacy policy while also complying with international data access protocols. GoPetition encourages content from individuals and groups. Information about how to write a petition and tips about petition writing are provided in detail. The GoPetition site was launched in Sydney Australia in the year 2000 by five friends from Macquarie University who were talking about viral business ideas one night at a pub. The group came up with the idea of a petitioning site after seeing poker machines and excessive gambling in the pub venue. The idea was born to amplify the voices of concerned individuals and groups. GoPetition seeks to provide the best petitioning software to amplify valuable campaigns. We do not use spam marketing techniques but instead encourage our clients to feel confident in a trusted and premium content ecosystem that allows for the organic traction of their ideas. Whether you are writing a petition or simply supporting one, GoPetiton can facilitate real change for your cause. After you start a petition feel free to contact us with any questions."
