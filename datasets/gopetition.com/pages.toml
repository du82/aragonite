full_description = "Legalize Marijuana 16 Signatures Feb 21 2025 Kolektif 420 #Civil Rights Target: Prime Minister Region: Mauritius Website: www.facebook.com In order to fight against Drug abuse in Mauritius, where people don't feel safe to walk in their own locality. The Kolektif 420 Team went on a journey to fight against these drug abuse, to free our country, to create stable economy though the Legalization of Cannabis. Throughout the last 20 years, countries such as USA, Spain, Germany, England, South Africa, Thailand and many more has legalize cannabis and has proven to be very effective. Many advantages has been seen and acknowledge in these countries, here are a few of them : - Huge decrease in rate of criminality - Huge decrease in hard drugs consumptions - Huge decrease in road accidents - Safer environment for children to grow - Locally grow plants can be use for many purposes such as CBD for medicinal use, artisanal use such as bags, clothes. - Employment in different fields. - Huge Increase in tourism. And many more. Citizens of Mauritius, It is high time we stand for our country. Enough is Enough. Where are our children of tomorrow. If you are asking me, they are on the streets taking drugs, ending their life, fighting their parents, selling their home appliances and their parent's jewelries for drugs. This is what is going on and we cannot keep our eye shut on this. I am here asking on behalf of the Team Kolektif 420, to all citizen of Mauritius to sign this petition and help us make a better Mauritius, a safer land for our future. Sign the petition Sponsor Select your country or region United States of America Australia Canada United Kingdom ------------------- Afghanistan Africa Akrotiri and Dhekelia Åland Albania Algeria American Samoa Andorra Angola Anguilla Antarctica Antigua and Barbuda Argentina Armenia Aruba Ascension Island Asia Australia Austria Azerbaijan Bahamas Bahrain Bangladesh Barbados Belarus Belgium Belize Benin Bermuda Bhutan Bolivi