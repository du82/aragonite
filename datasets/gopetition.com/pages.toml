title = "Sign petition: ¡Protege tu derecho a utilizar energía solar en Puerto Rico - Defiende nuestra ley de medición neta! · GoPetition.com"
description = "Nosotros, los firmantes, llamamos a la Junta Fiscal, al Gobierno de Puerto Rico y al…"
full_description = '''¡Protege tu derecho a utilizar energía solar en Puerto Rico - Defiende nuestra ley de medición neta! 10026 Signatures Jun 23 2024 Laura Castillo #Justice Target: Junta Fiscal, gobernador Pierluisi, Negociado de Energía, líderes de Cámara y Senado de Puerto Rico Region: Puerto Rico Website: www.sesapr.org La Medición Neta permite conectar paneles solares a casas o negocios y recibir crédito en la factura de LUMA por cada kWh exportado. Vigente desde 2007, fue protegida hasta 2030 por la Ley 10-2024. Es crucial para más de 130,000 hogares con energía solar y baterías. Terminar la política de Medición Neta solo resultaría en menos vidas puertorriqueñas protegidas por la energía solar y las baterías, y afectaría gravemente a las personas de bajos ingresos y vulnerables. No podemos ni permitiremos que eso suceda. La Junta de Control Fiscal de Puerto Rico atacó esta política en abril, alegando "interferencia política". La Ley 10 simplemente extiende la protección de 2024 a 2030, y la ley fue aprobada unánimemente por ambas cámaras de la legislatura de Puerto Rico y firmada por nuestros líderes democráticamente electos. Respetar esta ley es vital para avanzar hacia la energía renovable y proteger la instalación de sistemas solares y baterías en Puerto Rico. Nosotros, los firmantes, llamamos a la Junta Fiscal, al Gobierno de Puerto Rico y al Negociado de Energía a respetar la Ley 10-2024, que protege la medición neta hasta 2030. Esta ley es vital para nuestra seguridad con energía solar y baterías. Qué le diremos a la Junta: Que detenga su intención de acabar o alterar el programa de medición neta y, con esto, el acceso a la energía solar en Puerto Rico. Qué le diremos al Gobernador: Que defienda la Ley 10 ante la Junta de Control Fiscal y que la AAFAF responda con datos a las cartas que la Junta ha emitido en contra de la Ley. Qué le diremos al Negociado: Que respete la Ley 10 y no prosiga con su proceso administrativo de alterar el programa de medición neta. Qué le diremos a los líderes de la Cámara y del Senado de Puerto Rico: Que intervengan y luchen para proteger la Ley 10 y la continuidad de la medición neta. Sign the petition Sponsor Select your country or region United States of America Australia Canada United Kingdom ------------------- Afghanistan Africa Akrotiri and Dhekelia Åland Albania Algeria American Samoa Andorra Angola Anguilla Antarctica Antigua and Barbuda Argentina Armenia Aruba Ascension Island Asia Australia Austria Azerbaijan Bahamas Bahrain Bangladesh Barbados Belarus Belgium Belize Benin Bermuda Bhutan Bolivia Bosnia and Herzegovina Botswana Bouvet Island Brazil British Indian Ocean Territory British Virgin Islands Brunei Bulgaria Burkina Faso Burma (Myanmar) Burundi Cambodia Cameroon Canada Cape Verde Caribbean Cayman Islands Central African Republic Central America Chad Chile China Christmas Island Cocos Islands Colombia Comoros Cook Islands Costa Rica Côte d'Ivoire Croatia Cuba Curaçao Cyprus Czech Republic D.R. of the Congo Denmark Dhekelia Djibouti Dominica Dominican Republic East Timor Ecuador Egypt El Salvador England Equatorial Guinea Eritrea Estonia Ethiopia Europe Falkland Islands Faroe Islands Fiji Finland France French Guiana French Polynesia French Southern Territories Gabon Gambia Georgia Germany Ghana Gibraltar Greece Greenland Grenada Guadeloupe Guam Guatemala Guernsey Guinea Guinea-Bissau Guyana Haiti Heard and McDonald Islands Honduras Hong Kong Hungary Iceland India Indonesia Iran Iraq Ireland Isle of Man Israel Italy Ivory Coast Jamaica Japan Jersey Jordan Kazakhstan Kenya Kiribati Kosovo Kuwait Kyrgyzstan Laos Latvia Lebanon Lesotho Liberia Libya Liechtenstein Lithuania Luxembourg Macau Macedonia, Republic of Madagascar Malawi Malaysia Maldives Mali Malta Marshall Islands Martinique Mauritania Mauritius Mayotte Mexico Micronesia, Federated States of Middle East Moldova Monaco Mongolia Montenegro Montserrat Morocco Mozambique Myanmar Nagorno-Karabakh Namibia Nauru Nep