title = "Privacy Policy | got.net - Safeguarding Your Data"
description = "At Got.Net, your privacy is paramount. Dive into our Privacy Policy to learn how we protect, use, and manage your personal information."
full_description = "Privacy Policy Got.net – The Internet Connection, Inc. (hereafter referred to as “got.net”) is committed to preserving the privacy of its customers and protecting their personal information. Got.net does not actively monitor customer use of the Internet, customer email or other customer communications in the course of its regular operations.Types of Information CollectedInformation You Provide: When you sign up for service with got.net we ask you for personal information, such as your name, address, telephone number, and credit card number. All such information is considered private. This information is kept in an encrypted format on secure servers not accessible from the public Internet.Browser Cookies: got.net websites or services may utilize cookies – small files containing strings of characters – that are sent to your computer in order to uniquely identify your browser. We use cookies to improve the quality of the service and the usefulness of our websites. Most browsers are initially set to accept cookies, but you can reset your browser to refuse all cookies or to indicate when a cookie is being sent if you so choose. However, some features of the got.net website and our enhanced services may not function properly if cookies are disabled.User Communication: When you submit support requests or other communication to got.net, we may retain those communications in order to process your inquiries, respond to requests, or for training purposes.Logging Data: got.net also keeps logs of limited technical information pertaining to matters such as customer connectivity and email processing. These logs are retained on a temporary basis for the purpose of service health monitoring and troubleshooting.Disclosure PolicyThe only circumstances wherein got.net will disclose any of the above-mentioned information to a third party are: In the course of providing services our customers have specifically requested, got.net may make some of this information available to our affiliates or vendors in order to fulfill the requirements of order processing or service delivery. In the event that we receive a legitimate, legally-mandated request for customer information, got.net will respond only within the narrow scope of that request.Got.net will not otherwise disclose any private information about its customers to any other third party without the customer’s prior consent.Limitation of ScopeThis Privacy Policy applies solely to web sites and services that are owned and operated by got.net. We do not exercise control over the sites visited by our customers while using our services. Other sites or Internet services may place their own cookies or other files on your computer, collect data or solicit personal information from you. Got.net assumes no responsibility for the content, practices or information use policies of third-party sites or services.Changes to this PolicyPlease note that this Privacy Policy may change from time to time. We will not reduce your rights under this Policy without your explicit consent, and we expect most such changes will be minor. Regardless, we will post any Policy changes on this page and will make hard copies available upon request.If you have any questions about this Policy, please feel free to contact us through our website or write to us at:Privacy Inquiry c/o got.net 303 Potrero St. #40E Santa Cruz, CA, 95060 USA"
