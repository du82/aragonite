["https://www.got.net/faqs"]
title = "got.net - Hosting Frequently Asked Questions"
description = "Explore got.net's Hosting Frequently Asked Questions page for all your hosting queries. Dive into detailed answers on our range of hosting services, features, and best practices. Your hosting solutions, clarified."
full_description = "Hosting Frequently Asked QuestionsReady to Explore Our Products?Unlock seamless hosting solutions with Got.Net. Dive into our FAQs now and elevate your online experience!Order NowCan you provide me with internet service?If the service address is in the Sashmill or Tannery Suites we can provide service without question. DSL service will require an AT&T landline before we can check for any provisioning opportunities. Our wireless services require a line of site to one of our tower locations. Please call our support staff at (831)460-2000 for more information.Can I reset my password?Accessed using our client portal.Mbay.net, Got.net and Cruzers.net emails require a call in to our support team at (831) 460-2000 option 1. Our support team can assist with resetting passwords as well as address any other questions or concerns you may have.How can I access my website's control panel?The website control panel can be viewed by going to https://portal.got.net if you have already established hosting service with us, if it is not, please call support to get access to a different URL to use.What if I want to cancel my account?A simple email to support@got.net or to billing@got.net will let us know if you wish to have your services terminated. In the email, please include a date that you wish to have the services end.Does the service require a contract?Most of our services are month to month services. The exceptions being colocation and other custom services that require specific setups to be maintained.I would like to set up an email auto-reply. How do I go about doing this?If your email address ends with ( @got.net, @cruzers.net, or @mbay.net) please contact our support staff. If your email address belongs to your domain you may access all email options including auto replies and forwarding from your websites control panel. If you have any difficulties or are unaware of how to access the control panel. More information about accessing your hosting control panel can be found here.I am receiving a lot of spam messages or bounce backs. What should I do?If you are receiving a lot of spam, we recommend forwarding it to fn@proofpoint.com. This will help train our spam filters and firewalls to detect and block new forms of spam. If you are receiving large amounts of bounce back messages from failed emails, it is possible your email account has been compromised and we advise immediate contact with the support staff. You can reach us at 831-460-2000 option 1."
