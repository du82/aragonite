title = "NYPD says man in custody after Queens woman found dead outside her home - Gothamist"
description = "Police say they arrested a 40-year-old man who lived nearby in connection with her death."
full_description = "GothamistA non-profit newsroom, powered by WNYC.Gothamist Listen LiveDonate NewsNYPD says man in custody after Queens woman found dead outside her homeBy Brittany KriegsteinPublished Feb 28, 2025Modified Feb 28, 2025ShareFacebookTwitterRedditEmailNever miss a story Email address By submitting your information, you're agreeing to receive communications from New York Public Radio in accordance with our Terms . Brittany Kriegstein / GothamistBy Brittany KriegsteinPublished Feb 28, 2025Modified Feb 28, 2025ShareFacebookTwitterRedditEmailWe rely on your support to make local news available to all Make your contribution now and help Gothamist thrive in 2025. Donate today Gothamist is funded by sponsors and member donationsA Queens woman was discovered dead outside her home Thursday evening in a case that police are now investigating as a homicide.NYPD officials said officers responded to a 911 call at around 5:30 p.m. and found 64-year-old Juliet Kashidas-Singh unresponsive near 103rd Avenue and 105th Street in South Ozone Park. She was pronounced dead at the scene and had injuries to her face, according to officials.Police said they arrested 40-year-old Francisco Sevilla at around 1 a.m. Friday, charging him with first-degree murder and weapons possession in connection with Kashidas-Singh’s death. Officials said the two knew each other but police were still looking into their relationship. Police said he lived about a half-mile away from Kashidas-Singh.At the home Friday morning, there were signs a struggle had occurred on the front steps, including blood spots, overturned furniture and broken pieces of décor. A discarded wallet was also visible, and the area was closed off with crime scene tape, which encircled a red pickup truck parked on the street.Neighbor Annie Persaud said she was home Thursday night and was shocked to hear sirens coming from directly outside. She said she was not sure how Kashidas-Singh and Sevilla knew each other, but noted that the truck appeared to belong to him.“Sometimes he’d take her out and bring her back and stuff,” Persaud said, adding that she never saw them fighting. “He’s been here often.”Other neighbors said Kashidas-Singh was a pleasant presence on the quiet street who owned a landscaping company and mostly kept to herself. Online records show a company called J & H Landscaping Inc. was registered at her address.Sevilla’s arraignment was pending in Queens Criminal Court on Friday morning. Information for his lawyer was not yet available.The city medical examiner has not officially determined a cause of death.The NYPD’s 106th Precinct, which includes South Ozone Park and other parts of South Central Queens, had recorded no homicides so far this year through Feb. 23, compared with one during the same period last year, police data shows.This story has been updated with additional information.Taggednew york cityqueenspublic safetyozone parkBrittany KriegsteinTwitterBrittany Kriegstein covers all breaking news around New York City, with a focus on crime and gun violence. Got a tip? Email Brittany at [email protected].Read moreGothamist is funded by sponsors and member donationsGothamist is funded by sponsors and member donations MORE newsGunman opened fire into Manhattan bar, killing staffer, police sayThe shooting happened early Saturday at Nolita bar Tom & Jerry'sBy Ryan KailathPublished Mar 1, 2025 at 6:28 p.m. ETTwo in custody after NYPD blocks off Park Slope streets for reports of gunshotsPolice said there were no reports of injuriesBy Louis C. Hochman and Ryan KailathNewsTwo in custody after NYPD blocks off Park Slope streets for reports of gunshotsPolice said there were no reports of injuriesBy Louis C. Hochman and Ryan KailathFormer Gov. Andrew Cuomo officially declares run for NYC mayorBy Jon Campbell and Michelle BocanegraHazel Dukes, longtime NYC, national civil rights leader dead at 92By Michelle BocanegraDead dolphin washes ashore in Astoria — cause of death under investigationBy Giulia HeywardNever miss a story Catch up on the most important headlines with a roundup of essential NYC stories, delivered to your inbox daily. Sign upEmail address By submitting your information, you're agreeing to receive communications from New York Public Radio in accordance with our Terms ."
