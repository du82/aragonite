["https://gothamist.com/arts-entertainment/10-ways-to-commemorate-black-history-month-in-new-york-city"]
title = "10 ways to commemorate Black History Month in New York City - Gothamist"
description = "Featuring free classical music performances, poetry walks, historical discussions and even a 'drunk history' comedy show, Black History month in New York City offers something for just about everyone."
full_description = '''GothamistA non-profit newsroom, powered by WNYC.Gothamist Listen LiveDonate Arts & Entertainment10 ways to commemorate Black History Month in New York CityBy Anthony SchneckPublished Jan 29, 2025ShareFacebookTwitterRedditEmailNever miss a story Email address By submitting your information, you're agreeing to receive communications from New York Public Radio in accordance with our Terms . Photo by Brad Farwell / Courtesy of the Museum of the City of New YorkBy Anthony SchneckPublished Jan 29, 2025ShareFacebookTwitterRedditEmailWe rely on your support to make local news available to all Make your contribution now and help Gothamist thrive in 2025. Donate today Gothamist is funded by sponsors and member donationsFebruary is Black History Month. If you are looking to celebrate, honor or learn more about a community that’s been part of New York City’s history for centuries, here are some events to mark the occasion across New York.See classical music in HarlemFor the 17th straight year, the Harlem Chamber Players will host its Black History Month Celebration, with a full lineup of classical music and guest performances at the Schomburg Center for Research in Black Culture. It’s Thursday, Feb. 13, starting at 6:30 p.m. and is totally free with an RSVP.If you can’t make it to Harlem that day, the Chamber Players will have another Black History Month concert featuring a string quartet at Brooklyn Public Library on Sunday, Feb. 9, at 4 p.m., which is also free.On Saturday, Feb. 8 the Museum of the City of New York will host “Roots and Rise: A NYC Black History Celebration.”Courtesy the Museum of the City of New YorkSpend a day at the Museum of the City of New YorkOn Saturday, Feb. 8, starting at 11 a.m., the Museum of the City of New York will put on "Roots and Rise: A NYC Black History Celebration." It’s an event for all ages, featuring storytelling, music and art to explore the legacy of Black culture in the city. It’s free with museum admission, but some events — like the film screenings and book discussion — require an RSVP.Melba Liston with the Dizzy Gillespie Big Band and Quincy Jones (back left), 1956.Courtesy of New York Public LibraryLearn about the women who shaped jazzLearn about the first racially integrated, all-female band in the United States by watching the documentary “International Sweethearts of Rhythm,” at the Bruno Walter Auditorium at the New York Public Library for the Performing Arts on the West Side, Thursday, Feb. 6, starting at 5:30 p.m. There will be a free screening of that film, as well as “Tiny and Ruby: Hell Divin' Women,” which profiles jazz trumpeter Tiny Davis and her partner. And while you're there, check out the library's exhibition, "Rhythm Is My Business: Women Who Shaped Jazz," on view through June 13.Audre Lorde, pictured in 1984.Robert Alexander / GettyGet inspired on an Audre Lorde poetry walkSilver Lake Park on Staten Island provides the background to a nature walk honoring groundbreaking poet and activist Audre Lorde. On Sunday, Feb. 23 at 11 a.m., the Urban Park Rangers will lead the exploration of a path named for one of Staten Island’s most notable residents. Participants will look to their surroundings for inspiration to create their own poetry, paying tribute to Lorde’s legacy. It’s yet another free event!Visit Weeksville Heritage Center in BrooklynWeeksville Heritage Center is on the site of one of the largest free Black communities in pre-Civil War America. On Thursday, Feb. 20 at 6 p.m., it will host a Black History Month celebration hosted by the Brooklyn Chamber of Commerce. Business and civic leaders will be honored, locally sourced refreshments will be provided and an arts program will be on display.Sixteen signs with historical information mark the prominent sites of Seneca Village.Zakiyyah Woods for GothamistLearn the history of Seneca VillageBefore the Civil War, the largest collection of Black property owners was in Seneca Village, on what’s now the western edge of Central Park from West 82nd to 89th streets. The city parks department will host a program on Sunday, Feb. 9, from 1 p.m. to 2:30 p.m. to teach attendees about the lives of Seneca Village’s residents in the years before Central Park, which first opened portions to the public just before the Civil War in 1858.On Sunday, Feb. 16 at 2 p.m. Lefferts Historic House in Prospect Park will host a day of painting, drinking, eating and community.Photo by Obed Obwoge / Courtesy of Prospect Park AllianceSip and paint to celebrate “Peace over Prejudice”Head to the Lefferts Historic House in Prospect Park on Sunday, Feb. 16, starting at 2 p.m. for the "Peace over Prejudice" event. The idea is that everyone will contribute to a collective artwork to be unveiled in its entirety at the end of the day. Meanwhile, you can hang out, drink, eat and bask in the company of a peace-loving community.Check out a five-day “entertainment extravaganza”Five days, four headlining shows, 14 performances: That’s what you get at the second annual "Rhythms and Movements of African American Culture Festival," happening from Feb. 12-16 at the Abrons Arts Center Playhouse Theater in the Lower East Side. You can experience everything from dance to spoken word; from a djembe showcase to visual arts. Tickets for individual shows start at around $25, or you can spring for an all-events pass for $126.Brew up a love potion with the spirit of Langston HughesOne of the Harlem Renaissance’s preeminent figures will not be in physical attendance, since he died in 1967, but Langston Hughes’ jazz poetry will serve as the background for an interactive and educational event. Head to the Bronx’s Crotona Park on Sunday, Feb. 9, at 1 p.m. for a creative session hosted by the Urban Park Rangers. Guests will create their own color-changing “love potions” while learning about Hughes’ legacy and impact on the Harlem Renaissance.Littlefield in Brooklyn is hosting a Drunk Black History event in February.Courtesy LittlefieldCheck out 'Drunk Black History' in BrooklynIt’s Drunk Black History at Littlefield in Brooklyn on Feb. 28 at 8 p.m. Comedian Brandon Collins will educate, entertain and presumably consume alcohol in a Black History Month take on the “drunk history” genre. Special guests include Sarah Cooper, Bomani Jones and Onika McClean. Tickets go for around $25.Taggedblack history monthMusichistorypoetrynew york cityartseventsAnthony SchneckRead moreGothamist is funded by sponsors and member donationsGothamist is funded by sponsors and member donations MORE arts-entertainmentYou can buy a mini-village in upstate NY built from junk and found objectsArtist Matt Bua has been constructing it in bursts of inspiration for almost 20 years.By Hannah FrishbergPublished Feb 2, 202511 completely free things to do in New York City this FebruaryClose your wallet and hit the town for free concerts, book talks, art shows and more.By Anthony SchneckArts & Entertainment11 completely free things to do in New York City this FebruaryClose your wallet and hit the town for free concerts, book talks, art shows and more.By Anthony Schneck'Like Florida without sunshine': The end of Blue Man Group's 33-year run in NYCBy Hannah FrishbergBryant Park Grill closing this spring, set to be replaced by a Jean-Georges restaurantBy Ryan KailathThe Queens cafe that’s a go-to spot for Korean cultural celebrationsBy Caroline ShinNever miss a story Catch up on the most important headlines with a roundup of essential NYC stories, delivered to your inbox daily. Sign upEmail address By submitting your information, you're agreeing to receive communications from New York Public Radio in accordance with our Terms .'''
