title = "11 completely free things to do in New York City this February - Gothamist"
description = '"The Gates: An Augmented Reality Experience" in Central Park will be available through the Bloomberg Connects app.'
full_description = '''GothamistA non-profit newsroom, powered by WNYC.Gothamist Listen LiveDonate Arts & Entertainment11 completely free things to do in New York City this FebruaryBy Anthony SchneckPublished Feb 1, 2025ShareFacebookTwitterRedditEmailNever miss a story Email address By submitting your information, you're agreeing to receive communications from New York Public Radio in accordance with our Terms . Photo by Helane Blumfield / Courtesy of Harlem Chamber PlayersBy Anthony SchneckPublished Feb 1, 2025ShareFacebookTwitterRedditEmailWe rely on your support to make local news available to all Make your contribution now and help Gothamist thrive in 2025. Donate today Gothamist is funded by sponsors and member donationsSmack in the middle of February is Valentine’s Day, which is not a holiday that rewards skimping. So, if you find most of your monthly fun budget going toward a prix fixe dinner or another lavish display of affection quantified in monetary terms, we have some good news!As you can infer from the title, there are plenty of free things to do in New York City this month. Close your wallet and enjoy.Celebrate the 20th anniversary of 'The Gates'Remember Christo and Jeanne-Claude's “The Gates,” the controversial, expensive and enormous installation in Central Park in 2005, that featured large steel gates lining the the park's pathways? Well, it turns 20 this year, and you can relive the experience through the magic of augmented reality. By downloading the Bloomberg Connects app, you can see original images of "The Gates" as you stroll through Central Park, starting on Feb. 12.There will also be a companion exhibition at The Shed in Hudson Yards, also opening Feb. 12, featuring background on how “The Gates” came into existence. Tickets at the Shed are available on a choose-what-you-pay basis, with a suggested price of $10."The Gates: An Augmented Reality Experience" in Central Park will be available through the Bloomberg Connects app.Photo by Joe Pugliese and Dirt EmpireConnect with your spirituality at Jazz VespersJazz Vespers has made past appearances on “free things to do” lists, mostly because it’s a great free thing to do! Every Sunday at 5 p.m., you can witness the unique jazz prayer service, featuring top-notch musicians. It's totally free and open to anyone of any faith. One highlight this month is Feb. 23, when Ron Jackson, Dishan Harper and Zach Adleman make an appearance.Hit up Lunar New Year eventsThe Year of the Snake may have started on Jan. 29, but the celebrations roll well into February. You can check out the whole list of ways to ring in the new year throughout the city, but the signature parade in Manhattan's Chinatown is free, and happens Sunday, Feb. 16 at 1 p.m.A scene from a previous year's Lunar New Year parade in Manhattan's Chinatown.Scott Lynch / GothamistListen to world music all night longDJs LSJ and SOUNDSBYGO put on a global dance party dedicated to world music, with special guests Sailor Goon and Jamesy. It’s called “Where Ya At?,” and it’s happening at Prospect Heights’ Friends and Lovers on Feb. 13 starting at 10 p.m. Go get your groove on to music you may not have heard before, and expand your horizons this February.Ponder “Speed of Light” with two artists at a Tribeca galleryPainters Chris Martin and Peter Halley get together at 5:30 p.m. on Wednesday, Feb. 12 at the Timothy Taylor gallery in Tribeca. Halley will engage Martin on his new exhibition, titled “Speed of Light,” on view at the gallery. The conversation will focus on Martin's “process; directness; and openness to experience.” You'll need to RSVP, but will not need to turn over any of your hard-earned cash.The Harlem Chamber Players will perform free shows this month at the Schomburg Center for Research in Black Culture and at the Brooklyn Public Library.Photo by Helane Blumfield / Courtesy of Harlem Chamber PlayersExplore Black History Month events around the city.February is Black History Month, and while many of the associated events cost money, there are plenty of free ones too. Check out the Harlem Chamber Players at the Schomburg Center for Research in Black Culture on Thursday, Feb. 13 at 6:30 p.m., or go see a string quartet version at the Brooklyn Public Library on Sunday, Feb. 9 at 4 p.m. You can also join the community art event in Prospect Park, called “Peace over Prejudice,” on Sunday, Feb. 16 at 2 p.m. And there are plenty of other activities to choose from all month long.“Drunk Planet Earth” returns to Caveat on Friday, Feb. 21 at 9:30 p.m.Courtesy of CaveatWatch drunk people talk about animalsThree words: “Drunk Planet Earth.” What more do you need to know? Maybe the fact that it’s happening on Friday, Feb. 21 at 9:30 p.m. at Caveat on the Lower East Side? Or that it'll feature comedians Brian Morabito and Stephen Buckley hosting a show described as “'Mystery Science Theater' meets animal documentary?” There’s also an audience participation element to the event, when attendees can try to stump the hosts with animal trivia... all while consuming alcohol. Fun!Hear a poet’s thoughts on despairPop quiz, hotshot: What’s the antidote to despair? Awe. The answer is awe. At least, that’s the idea behind an upcoming talk called “The antidote to despair is awe”: An afternoon with Christian Wiman. It's part of the ongoing events series at Trinity Church in Lower Manhattan, which invites artists and philosophers to discuss "issues of faith, social justice, and community." Wiman, a poet, will discuss his latest book on Sunday, Feb. 9 at Trinity Church starting at 12:30 p.m, and an optional small group discussion will follow.“Nordic Utopia? African Americans in the 20th Century” is on view through March 8 at the Scandinavia House.Courtesy of the Scandinavia HouseLearn about the connection between Scandinavia and African American artistsOn Saturday, Feb. 22 at 3 p.m. the Scandinavia House will host a symposium with curators and scholars to discuss the “themes, artistic output, and shared histories on view” in their latest exhibition, which looks at the importance of Scandinavian countries as destinations for African American artists throughout the 20th century."Portrait of Roy De Coverley," by Kristen Kjaer, 1933 is on view now at the Scandinavia House.Courtesy of Kirsten Kjærs Museum, Frøstrup, Denmark Photo: Ole AkhoejAbsorb even more poetry (and wine) at a poetry salonDidn’t get enough poetry in February? There’s no excuse. Head to Greenlight Bookstore’s Poetry Salon on Thursday, Feb. 20 starting at 7:30 p.m. for an evening of mingling with locally and nationally celebrated poets. Angel Nafis will host, and the evening will feature poets Perry Janes, Roya Marsh, Monica McClure and Brittany Rogers. Plus: Wine! Nothing goes better with poetry – just ask the ancient Greeks.Make plantable paper from native speciesDid you know you can make your own paper? Out of native plants? And you can embed seeds in the paper, then plant the paper, so you’re planting plants when you plant paper? It’s all true. On Friday, Feb. 7 at 10 a.m., head to Greenbelt Native Plant Center on Staten Island for a workshop that will teach you how to use recycled pulp embedded with seeds to make plantable paper. Dress to get dirty, and be prepared to hold your papermaking skills over your friends’ heads.Taggednew york cityfreeartAnthony SchneckRead moreGothamist is funded by sponsors and member donationsGothamist is funded by sponsors and member donations MORE arts-entertainmentYou can buy a mini-village in upstate NY built from junk and found objectsArtist Matt Bua has been constructing it in bursts of inspiration for almost 20 years.By Hannah FrishbergPublished Feb 2, 2025'Like Florida without sunshine': The end of Blue Man Group's 33-year run in NYC“ We were just three guys who decided to get bald and blue,” said one of the show's cofounders.By Hannah FrishbergArts & Entertainment'Like Florida without sunshine': The end of Blue Man Group's 33-year run in NYC“ We were just three guys who decided to get bald and blue,” said one of the show's cofounders.By Hannah Frishberg10 ways to commemorate Black History Month in New York CityBy Anthony SchneckBryant Park Grill closing this spring, set to be replaced by a Jean-Georges restaurantBy Ryan KailathThe Queens cafe that’s a go-to spot for Korean cultural celebrationsBy Caroline ShinNever miss a story Catch up on the most important headlines with a roundup of essential NYC stories, delivered to your inbox daily. Sign upEmail address By submitting your information, you're agreeing to receive communications from New York Public Radio in accordance with our Terms .'''
