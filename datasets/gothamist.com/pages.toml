full_description = "GothamistA non-profit newsroom, powered by WNYC.Gothamist Listen LiveDonate Jimmy VielkindArticles by Jimmy VielkindJimmy VielkindJimmy Vielkind covers how state government and politics affect people throughout New York. He has covered Albany since 2008, most recently as a reporter for The Wall Street Journal. Jimmy led a team of reporters that won a New York Press Club award for coverage of Andrew Cuomo’s downfall and was on a team that won a Gerald Loeb Award for coverage of Amazon’s HQ2 process. A native of the Capitol Region, Jimmy has two degrees in urban planning. His position is funded by a grant from the Corporation for Public Broadcasting. Reach Jimmy at [email protected].NewsNY reaches tentative deal to end prison strike by suspending anti-solitary confinement lawThe state said officers will escape discipline if they return to work by Saturday, and the National Guard will remain in the prisons for now.By Jimmy VielkindNewsNY orders prison guards back to work as Gov. Hochul considers out-of-state transfersThe state threatened striking workers with loss of pay as Albany debates prison policy.By Jimmy VielkindNewsIncarcerated men describe deteriorating conditions as unlawful NY prison strikes drag onMen imprisoned at Woodbourne Correctional Facility said they had been denied hot meals and confined to their cells.By Jimmy VielkindNewsTrump order on refugees leaves NY resettlement agencies scramblingThe federal government froze funding that nonprofits used to pay caseworkers’ salaries and provide basic necessities.By Jimmy VielkindNewsShould he stay or should he go: Gov. Hochul, top Dems mull Mayor Adams’ fateThe meetings come as the mayor faces staff departures and continued questions about whether he traded his cooperation with President Trump’s immigration crackdown for the pending dismissal of corruption charges.By Jon Campbell and Jimmy VielkindNewsAs Gov. Hochul weighs removing Mayor Adams, Lt. Gov. Delgado says he 'speaks for New York