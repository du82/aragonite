full_description = "GothamistA non-profit newsroom, powered by WNYC.Gothamist Listen LiveDonate Jon CampbellArticles by Jon CampbellJon CampbellTwitterJon Campbell covers the New York State Capitol for WNYC and Gothamist. Prior to that, he covered the Capitol for more than a decade for the USA TODAY Network. He has twice earned the Walter T. Brown Memorial Award, an honor given annually by the Legislative Correspondents Association alumni for outstanding state government coverage. Jon grew up in the Buffalo area and graduated from the University at Albany. Got a tip? Email Jon at [email protected] or Signal 518-210-7087.NewsFormer Gov. Andrew Cuomo officially declares run for NYC mayorThe former governor, who resigned amid sexual harassment allegations, launched his mayoral bid in a video posted on X.By Jon Campbell and Michelle BocanegraNews2 people die while incarcerated at Sing Sing amid officers' unauthorized strikeThe two men's causes of death have not been released since they were found unresponsive in their cells on Wednesday.By Jon CampbellNewsInside the push to disbar former NY Gov. Andrew CuomoDocuments obtained by Gothamist show Albany’s Attorney Grievance Committee has been looking into the former governor’s conduct.By Jon CampbellNewsLt. Gov. Antonio Delgado won’t run again with Gov. Kathy HochulDelgado and Hochul’s relationship has steadily and publicly deteriorated over the past year.By Jon CampbellNewsGov. Hochul says she won't remove NYC Mayor Adams from officeHochul unveiled a new plan that would expand Albany’s oversight of the mayor’s office. But lawmakers would have to approve it.By Jon CampbellNewsFederal judge: I won't 'shoot from the hip' on move to dismiss Mayor Adams' chargesU.S. District Judge Dale Ho held a hearing Wednesday but declined to rule on the dismissal request from the bench.By Samantha Max and Jon CampbellNewsTrump declares NYC congestion pricing dead, proclaiming 'LONG LIVE THE KING'A letter from the federal Department of Transportation says the government will rescind approval granted under former President Joe Biden.By Jon Campbell, Stephen Nessen and Ramsey KhalifehNewsGov. Hochul may send National Guard into state prisons as officer strikes spreadUnsanctioned strikes spread to more than two dozen prisons across the state, with Hochul threatening to send in troopsBy Jon CampbellNewsShould he stay or should he go: Gov. Hochul, top Dems mull Mayor Adams’ fateThe meetings come as the mayor faces staff departures and continued questions about whether he traded his cooperation with President Trump’s immigration crackdown for the pending dismissal of corruption charges.By Jon Campbell and Jimmy VielkindNewsNY’s top court rejects Andrew Cuomo’s push to blow up state ethics boardThe Court of Appeals ruled the structure of the Commission on Ethics and Lobbying in Government does not violate the separation of powers laid out in the state constitution.By Jon CampbellNewsHochul to consider Adams’ future after 4 top NYC officials resignHochul has the legal authority to remove Adams from office for malfeasance – a move she has been reluctant to make since Adams faced corruption charges.By Elizabeth Kim, Brigid Bergin, David Brand and Jon CampbellNewsA 'trial' after all? Here’s how Gov. Hochul could remove Mayor Adams.The governor isn’t closing the door on giving the mayor the boot. State and city law lay out a process for doing so.By Jon Campbell and Brigid BerginGothamist is funded by sponsors and member donationsGothamist is funded by sponsors and member donationsLoad MoreNever miss a story Catch up on the most important headlines with a roundup of essential NYC stories, delivered to your inbox daily. Sign upEmail address By submitting your information, you're agreeing to receive communications from New York Public Radio in accordance with our Terms ."
