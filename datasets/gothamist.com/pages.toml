full_description = '''GothamistA non-profit newsroom, powered by WNYC.Gothamist Listen LiveDonate Caroline LewisArticles by Caroline LewisCaroline LewisCaroline Lewis is on the health care beat for WNYC and Gothamist. She has covered COVID, a nurses' strike, the overdose crisis and New York’s marijuana legalization effort, and spent a year investigating patients' medical bills. She always wants to hear about how everyday New Yorkers experience the health system. Got a tip? Email [email protected].NewsNYC's Beth Israel hospital closure stalls anew as judge orders temporary stayThe temporary stay will remain in place pending a determination by a panel of judges.By Caroline LewisNewsNY health officials urge measles vaccinations for kids amid rise in casesIn New Jersey, a measles patient who recently traveled abroad had close contact with two other people who were later diagnosed with the disease.By Caroline LewisNewsJudge dismisses lawsuit challenging closure of Mount Sinai Beth Israel Hospital in ManhattanMount Sinai says it will "immediately" begin implementing the shutdown, though an appeal is likely.By Caroline LewisNewsNY AG sues flavored vape vendors, says they're fueling youth ‘public health crisis’The lawsuit puts ‘blue razz slushy’ and ‘sour watermelon patch’ under scrutiny.By Caroline LewisNews7 CDC workers fired this week had been assigned to NYC, health officials sayThe workers' duties included city immunization efforts, tuberculosis research and preparation for public health emergencies, a health department spokesperson said.By Caroline LewisNewsNurses at NYU Langone Hospital in Brooklyn threaten to strike on March 1The nurse's union accused NYU Langone of focusing more on its “glossy public image” than its nurses, citing spending on a recent 30-second Super Bowl ad.By Caroline LewisNewsEx-NYPD commissioner’s twin impersonated him to sway nightlife oversight, per complaintA police lieutenant accused James Caban of posing as his brother during visits to a W