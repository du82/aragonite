["https://gothamist.com/arts-entertainment/a-new-makerspace-brooklyn-spark-is-slated-to-open-in-bushwick"]
title = "A new makerspace, Brooklyn Spark, is slated to open in Bushwick - Gothamist"
description = "It will be equipped with a 600-square-foot woodshop, a ceramics studio, areas dedicated to textiles and fine arts, and workspace and lounge areas."
full_description = '''GothamistA non-profit newsroom, powered by WNYC.Gothamist Listen LiveDonate Arts & EntertainmentA new makerspace, Brooklyn Spark, is slated to open in BushwickBy Hannah FrishbergPublished Feb 17, 2025ShareFacebookTwitterRedditEmailNever miss a story Email address By submitting your information, you're agreeing to receive communications from New York Public Radio in accordance with our Terms . Photo credit: Not Just a HobbyBy Hannah FrishbergPublished Feb 17, 2025ShareFacebookTwitterRedditEmailWe rely on your support to make local news available to all Make your contribution now and help Gothamist thrive in 2025. Donate today Gothamist is funded by sponsors and member donationsAttention, crafty people: Bushwick is getting a new makerspace.Brooklyn Spark is located at 75 Stewart Ave., and is equipped with a 600-square-foot woodshop, a ceramics studio complete with a kiln and slab roller, areas dedicated to textiles and fine arts, and workspace and lounge areas.A lounge area within the makerspace.Photo credit: Not Just a HobbyThe venue is slated to open March 1, according to Caleb Young, one of Spark’s nine co-founders. He said they selected Bushwick for the venue because leases were within what they could afford (unlike Williamsburg) and generally “there’s a ton of creatives and it’s a great neighborhood.”Young, a former mechanical engineer who now works in software, decided to open Spark because he “really missed building things.” When he put the word out to friends and the maker community, he found eight other people on board to help him realize the dream.Since February 2024, the nine founders — who have a diverse array of craft-related interests, from adaptive reuse to loudspeaker-design and furniture-making — have been meeting at each others’ apartments, planning Brooklyn Spark.Membership costs $165 a month and includes 24/7 access and use of equipment including a laser cutter, 3-D printers, a sewing machine, a serger, a floor loom and a table loom.Membership to Brooklyn Spark costs $165 a month.Photo credit: Not Just a HobbyAccording to a GoFundMe for the self-funded venture, there are no requirements to join, and everyone from "beginners to seasoned experts” is welcome.While rising rents have shrunk Brooklyn’s DIY arts scene in recent decades, Young believes makerspaces are on the rise.“I think the makerspace movement is just going to keep growing and growing,” he said. “I think there is a huge demand.”Taggednew york cityartHannah FrishbergRead moreGothamist is funded by sponsors and member donationsGothamist is funded by sponsors and member donations MORE arts-entertainmentSome eggs in NY are less than $4, others are $11. Here's how to navigate a chaotic market.Prices don't just vary wildly from store to store. There can be huge differences from carton to carton in any aisle.By Ryan Kailath and Catalina GonellaPublished Feb 19, 2025Modified Feb 19, 2025The Barclays Center's controversial history is revisited at a free event in Red HookThe event at Pioneer Works is billed as the 20th anniversary of the “resistance to the Atlantic Yards project.”By Hannah FrishbergArts & EntertainmentThe Barclays Center's controversial history is revisited at a free event in Red HookThe event at Pioneer Works is billed as the 20th anniversary of the “resistance to the Atlantic Yards project.”By Hannah FrishbergNYC socialists are seizing the means of reproduction at a lefty singles mixerBy Ryan KailathDating coaches' advice to single New Yorkers: It’s not them, it’s you.By Giulia HeywardLegendary art installation ‘The Gates’ returns (digitally) to Central ParkBy Hannah FrishbergNever miss a story Catch up on the most important headlines with a roundup of essential NYC stories, delivered to your inbox daily. Sign upEmail address By submitting your information, you're agreeing to receive communications from New York Public Radio in accordance with our Terms .'''
