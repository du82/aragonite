full_description = "GothamistA non-profit newsroom, powered by WNYC.Gothamist Listen LiveDonate NewsDead dolphin washes ashore in Astoria — cause of death under investigationBy Giulia HeywardPublished Mar 1, 2025ShareFacebookTwitterRedditEmailNever miss a story Email address By submitting your information, you're agreeing to receive communications from New York Public Radio in accordance with our Terms . Chris St. Lawrence/Gotham WhaleBy Giulia HeywardPublished Mar 1, 2025ShareFacebookTwitterRedditEmailWe rely on your support to make local news available to all Make your contribution now and help Gothamist thrive in 2025. Donate today Gothamist is funded by sponsors and member donationsA dead dolphin’s body was recovered after it washed up onshore in Astoria, Queens on Friday, but experts still aren't sure what caused the animal’s death.While dolphins aren’t often seen in the East River, there have been some sightings of the marine mammals, including in recent weeks, according to Rob DiGiovanni, the chief scientist at the Atlantic Marine Conservation Society.The conservation society now has custody of the dolphin’s body, DiGiovanni said, adding a necropsy is being conducted to help determine what factors — including its age or diet — may have contributed to its death.“There’s a lot of things that you have to be careful about, including jumping to any conclusions. We will take samples and see if we see anything,” he said.DiGiovanni said that he’s also aware of claims on social media that another dead dolphin was also found earlier this week. However, he told Gothamist he suspects it’s the same dolphin because the only one corpse was retrieved and both sightings occurred close by.“We’ve only recovered one dolphin so we can only say that there’s one dolphin. Everything we are saying right now is speculation,” DiGiovanni said.The NYPD said the deceased dolphin appeared at Hallet’s Cove Beach along Vernon Boulevard in Astoria shortly after 7 a.m. The authorities recovered the corpse several hours later, shortly after 12:30 p.m.Chris St. Lawrence, who works for Gotham Whale, a local research organization that studies marine life, said animals living in and around cities face many perils.“One of the things with wildlife in these urban places is that there are a lot of threats against them and that is something that I think anybody who cares about wildlife in the city will know about,” he said.“I think people are really interested — whether they recognize it or not — with that intersection of city and wildlife. We see it with birds like Flaco, or whales and dolphins,” he continued. “When we hear about marine animals living here in the city, it can be exciting.”This is a developing story and may be updated.TaggedqueensenvironmentGiulia HeywardGiulia Heyward is a breaking news reporter on the Day-Of desk. She previously worked at NPR, as a breaking news reporter, and the New York Times, as a reporting fellow on the national desk. Her work has also appeared in CNN, The Atlantic and Politico. Got a tip? Email [email protected] or more securely on signal at 917-715-1458.Read moreGothamist is funded by sponsors and member donationsGothamist is funded by sponsors and member donations MORE newsGunman opened fire into Manhattan bar, killing staffer, police sayThe shooting happened early Saturday at Nolita bar Tom & Jerry'sBy Ryan KailathPublished Mar 1, 2025 at 6:28 p.m. ETTwo in custody after NYPD blocks off Park Slope streets for reports of gunshotsPolice said there were no reports of injuriesBy Louis C. Hochman and Ryan KailathNewsTwo in custody after NYPD blocks off Park Slope streets for reports of gunshotsPolice said there were no reports of injuriesBy Louis C. Hochman and Ryan KailathFormer Gov. Andrew Cuomo officially declares run for NYC mayorBy Jon Campbell and Michelle BocanegraHazel Dukes, longtime NYC, national civil rights leader dead at 92By Michelle BocanegraMarch's spring night skies blossom with a blood moon and solar eclipse