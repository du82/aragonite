["https://gothamist.com/news/ny-reaches-tentative-deal-to-end-prison-strike-by-suspending-anti-solitary-confinement-law"]
title = "NY reaches tentative deal to end prison strike by suspending anti-solitary confinement law - Gothamist"
description = "The state said officers will escape discipline if they return to work by Saturday, and the National Guard will remain in the prisons for now."
full_description = "GothamistA non-profit newsroom, powered by WNYC.Gothamist Listen LiveDonate NewsNY reaches tentative deal to end prison strike by suspending anti-solitary confinement lawBy Jimmy VielkindPublished Feb 28, 2025Modified Feb 28, 2025ShareFacebookTwitterRedditEmailNever miss a story Email address By submitting your information, you're agreeing to receive communications from New York Public Radio in accordance with our Terms . Spencer Platt/Getty ImagesBy Jimmy VielkindPublished Feb 28, 2025Modified Feb 28, 2025ShareFacebookTwitterRedditEmailWe rely on your support to make local news available to all Make your contribution now and help Gothamist thrive in 2025. Donate today Gothamist is funded by sponsors and member donationsA law restricting the use of solitary confinement in New York’s prisons would remain partly suspended for 90 days if corrections officers accept a tentative agreement the state reached with their union to end an ongoing wildcat strike.There will be no departmental discipline for any of the thousands of corrections officers if they return to work by Saturday, according to a memo the governor released. The agreement also includes provisions to reduce mandated overtime, increase the overtime pay rate and temporarily hire retired corrections officers to assist in transporting incarcerated people.More than 3,500 National Guard personnel who were deployed to prisons during the strike will remain there, according to the agreement. Gov. Kathy Hochul will determine the “overall support and draw down,” the document says.Hochul announced the terms of the tentative deal after four days of state-backed mediation between the state’s Department of Corrections and Community Supervision and the New York State Correctional Officers & Police Benevolent Association, the union that represents officers.The union didn’t officially back the strike, which is illegal under state law. NYSCOBA spokesperson James Miller said the union is urging its members to return to work.“The decision to return to work is not a collective vote by members of NYSCOPBA,” Miller said. “It will be up to each individual who currently is refusing to work to decide whether to return to work or risk termination, potential fines and possible arrest for violating the court order.”Hochul said the tentative deal struck a balance.“We have reached a consent award to address many of the concerns raised by correction officers, put DOCCS back on the path to safe operations, respect the rights of incarcerated individuals and prevent future unsanctioned work stoppages,” the Democratic governor said in a statement.Corrections officers started walking off their posts on Feb. 17 at two facilities, and picket lines soon spread to more than two-dozen facilities around the state. The strikers say prisons are increasingly understaffed and dangerous for employees. They've pointed to the 2021 HALT law, which they said makes it harder to maintain discipline.That law set limits on how long incarcerated people are segregated to solitary confinement and requires a hearing before someone is placed in it. Prison officials had already partially suspended HALT, and Hochul has threatened strikers with loss of pay and health insurance.Hochul spokesperson Maggie Halley said only parts of the HALT law which mandate specific programming for incarcerated people are suspended.Advocates for incarcerated people say solitary confinement is akin to torture. Progressive lawmakers have said they didn’t have plans to change the law, and many advocates and lawmakers criticized Hochul for temporarily suspending its provisions.Sen. Julia Salazar, a Democrat from Brooklyn who chairs the chamber’s corrections committee, said she was disappointed and concerned that the language in the draft agreement “creates the fear that New York would take a step backward regarding the harmful use of long-term segregated confinement in our state’s prisons.”Gothamist spoke with two incarcerated people who said conditions at the Woodbourne Correctional Facility had deteriorated during the strike. They lost access to telephones, hot meals and the commissary for several days when the facility went on lockdown. At least three incarcerated people have died during the strike; their deaths remain under investigation.The strike is unfolding in the wake of the death of Robert Brooks, who was fatally beaten by staff at the Marcy Correctional Facility near Utica. A special prosecutor charged six employees with murder in connection with Brooks’s death. They’ve pleaded not guilty.Some Republicans in the state legislature said they were skeptical about the deal.“It remains to be seen whether this will lead to real, lasting reforms,” Sen. George Borrello of Chautauqua County said of the HALT provisions. “Overall, I still have serious reservations about whether the changes offered in this tentative agreement go far enough to truly restore order and safety to our corrections facilities. It will ultimately be up to the striking corrections officers to decide.”Update: This story has been updated with additional comments.Taggednew york statePoliticsJimmy VielkindJimmy Vielkind covers how state government and politics affect people throughout New York. He has covered Albany since 2008, most recently as a reporter for The Wall Street Journal. Jimmy led a team of reporters that won a New York Press Club award for coverage of Andrew Cuomo’s downfall and was on a team that won a Gerald Loeb Award for coverage of Amazon’s HQ2 process. A native of the Capitol Region, Jimmy has two degrees in urban planning. His position is funded by a grant from the Corporation for Public Broadcasting. Reach Jimmy at [email protected].Read moreGothamist is funded by sponsors and member donationsGothamist is funded by sponsors and member donations MORE newsGunman opened fire into Manhattan bar, killing staffer, police sayThe shooting happened early Saturday at Nolita bar Tom & Jerry'sBy Ryan KailathPublished Mar 1, 2025 at 6:28 p.m. ETTwo in custody after NYPD blocks off Park Slope streets for reports of gunshotsPolice said there were no reports of injuriesBy Louis C. Hochman and Ryan KailathNewsTwo in custody after NYPD blocks off Park Slope streets for reports of gunshotsPolice said there were no reports of injuriesBy Louis C. Hochman and Ryan KailathFormer Gov. Andrew Cuomo officially declares run for NYC mayorBy Jon Campbell and Michelle BocanegraHazel Dukes, longtime NYC, national civil rights leader dead at 92By Michelle BocanegraDead dolphin washes ashore in Astoria — cause of death under investigationBy Giulia HeywardNever miss a story Catch up on the most important headlines with a roundup of essential NYC stories, delivered to your inbox daily. Sign upEmail address By submitting your information, you're agreeing to receive communications from New York Public Radio in accordance with our Terms ."
