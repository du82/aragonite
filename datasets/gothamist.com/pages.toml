title = "Two in custody after NYPD blocks off Park Slope streets for reports of gunshots - Gothamist"
description = "The shooting happened early Saturday at Nolita bar Tom & Jerry's"
full_description = "GothamistA non-profit newsroom, powered by WNYC.Gothamist Listen LiveDonate NewsTwo in custody after NYPD blocks off Park Slope streets for reports of gunshotsBy Louis C. Hochman and Ryan KailathPublished Mar 1, 2025 at 3:34 p.m. ETModified Mar 1, 2025 at 8:20 p.m. ETShareFacebookTwitterRedditEmailNever miss a story Email address By submitting your information, you're agreeing to receive communications from New York Public Radio in accordance with our Terms . Audrey Cooper/GothamistBy Louis C. Hochman and Ryan KailathPublished Mar 1, 2025 at 3:34 p.m. ETModified Mar 1, 2025 at 8:20 p.m. ETShareFacebookTwitterRedditEmailWe rely on your support to make local news available to all Make your contribution now and help Gothamist thrive in 2025. Donate today Gothamist is funded by sponsors and member donationsThe NYPD took two people into custody at a Park Slope, Brooklyn home Saturday, after an hours-long incident that authorities say began with a report of gunshots outside.Police blocked off several streets around the home at 164 St. John’s Place, between 6th and 7th Avenues, Saturday afternoon. The NYPD said it got a report at about 1:30 p.m. of shots fired, and responding officers found two shell casings. Police said no injuries were reported, but that they were told a man had gone into the house and were working to establish contact with someone inside.Neighbors said later that afternoon, they saw police escort multiple people out of the home. By around 4 p.m., police said two people of interest had been taken into custody, and though the investigation was continuing, they weren't looking for anyone further.As of early Saturday evening, police had not yet released names of any individuals involved or announced any charges.A large police presence remained at the scene for hours afterward, with the area of St. John's Place between 5th and 7th Avenues blocked off, and a stretch of 6th Avenue between Lincoln and Stirling Places closed as well. Those streets had reopened by early Saturday evening.The home at 164 St. John’s Place is subject of an ongoing eviction dispute in Kings County Civil Court that has been delayed multiple times, with the next hearing scheduled for March 20, according to court filings. The case lists several defendants, including some only identified as John or Jane Doe.Calls to the attorneys listed for landlord 164 St. Johns Group LLC in the court documents weren't immediately returned Saturday.— Includes reporting by Audrey CooperTaggedpublic safetybrooklynLouis C. HochmanAfter about two decades in (mostly) New Jersey-focused commercial print, digital and digital-but-radio-adjacent news, Lou stumbled into member-supported news in early 2021, as the editor and CEO of Montclair Local. There, he (hopes he) expanded enterprise, brought more sophistication to digital storytelling and moved the nonprofit newsroom closer to long-term financial sustainability. He helped lead the Local to its fourth consecutive General Excellence award from the New Jersey Press Association — the NJPA's highest honor with judges noting the paper's work to strip away layers of government opacity, to hold power to account, to make news accessible for more members of the community, to share the stories and concerns of more facets of the community and to tell compelling stories across multiple media. He's excited to continue the same ethic — news as a public service — at NYPR as the New Jersey and suburbs editor, drawing on the extraordinary talents of reporters including Karen Yi and Nancy Solomon. Lou lives in Philly (that commute!) with his partner and their two cats, about whom and about which he speaks incessantly.Read moreRyan KailathRead moreGothamist is funded by sponsors and member donationsGothamist is funded by sponsors and member donations MORE newsGunman opened fire into Manhattan bar, killing staffer, police sayThe shooting happened early Saturday at Nolita bar Tom & Jerry'sBy Ryan KailathPublished Mar 1, 2025 at 6:28 p.m. ETFormer Gov. Andrew Cuomo officially declares run for NYC mayorThe former governor, who resigned amid sexual harassment allegations, launched his mayoral bid in a video posted on X.By Jon Campbell and Michelle BocanegraNewsFormer Gov. Andrew Cuomo officially declares run for NYC mayorThe former governor, who resigned amid sexual harassment allegations, launched his mayoral bid in a video posted on X.By Jon Campbell and Michelle BocanegraHazel Dukes, longtime NYC, national civil rights leader dead at 92By Michelle BocanegraDead dolphin washes ashore in Astoria — cause of death under investigationBy Giulia HeywardMarch's spring night skies blossom with a blood moon and solar eclipseBy Rosemary MisdaryNever miss a story Catch up on the most important headlines with a roundup of essential NYC stories, delivered to your inbox daily. Sign upEmail address By submitting your information, you're agreeing to receive communications from New York Public Radio in accordance with our Terms ."
