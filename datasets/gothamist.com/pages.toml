["https://gothamist.com/news/rough-ride-on-the-r-train-brooklyn-lawmaker-rips-mta-over-recurring-rail-woes"]
title = "Rough ride on the R train: Brooklyn lawmaker rips MTA over recurring rail woes - Gothamist"
description = "The MTA is investigating the issue while shifting resources to ease wait times, but state Sen. Andrew Gounardes says riders' frustrations remain high."
full_description = "GothamistA non-profit newsroom, powered by WNYC.Gothamist Listen LiveDonate NewsRough ride on the R train: Brooklyn lawmaker rips MTA over recurring rail woesBy Giulia HeywardPublished Feb 28, 2025ShareFacebookTwitterRedditEmailNever miss a story Email address By submitting your information, you're agreeing to receive communications from New York Public Radio in accordance with our Terms . Metropolitan Transportation Authority / Patrick CashinBy Giulia HeywardPublished Feb 28, 2025ShareFacebookTwitterRedditEmailWe rely on your support to make local news available to all Make your contribution now and help Gothamist thrive in 2025. Donate today Gothamist is funded by sponsors and member donationsBrooklyn commuters are facing longer wait times on the R train after the MTA pulled two dozen relatively new subway cars from service due to a mysterious mechanical issue, according to a local lawmaker.To mitigate the delays, some trains from the G line have been reassigned to the R, but riders should still expect some disruptions, state Sen. Andrew Gounardes said after meeting with MTA officials Wednesday.Gounardes said the MTA was investigating the unusual wear on the wheels of 24 trains, which were taken out of service last month despite being only 15 years old and well within their expected lifespan.“The MTA is doing what they can to restore normal service while they work to determine and fix the underlying cause,” Gounardes wrote on X. “I’ve pushed the agency to run more trains during rush hour, especially headed toward Manhattan, so commuters can get where they need to go.”An MTA spokesperson said the problem affects R160 model trains housed at the Jamaica Yard in Queens, adding that transit officials were investigating why the wheels are degrading more quickly than expected.MTA CEO and Chairman Janno Lieber addressed the issue at an MTA board meeting last month, saying engineers were “studying the heck out of this issue.”“We don’t have any findings to act on yet. We are really still studying,” he said.The latest subway setback comes as the MTA grapples with aging infrastructure across the system. As Gothamist previously reported, 77 out of the city’s 224 subway substations still rely on outdated and unreliable technology, contributing to delays that frequently leave commuters stranded.Taggednew york citytransportationbrooklynMTAGiulia HeywardGiulia Heyward is a breaking news reporter on the Day-Of desk. She previously worked at NPR, as a breaking news reporter, and the New York Times, as a reporting fellow on the national desk. Her work has also appeared in CNN, The Atlantic and Politico. Got a tip? Email [email protected] or more securely on signal at 917-715-1458.Read moreGothamist is funded by sponsors and member donationsGothamist is funded by sponsors and member donations MORE newsGunman opened fire into Manhattan bar, killing staffer, police sayThe shooting happened early Saturday at Nolita bar Tom & Jerry'sBy Ryan KailathPublished Mar 1, 2025 at 6:28 p.m. ETTwo in custody after NYPD blocks off Park Slope streets for reports of gunshotsPolice said there were no reports of injuriesBy Louis C. Hochman and Ryan KailathNewsTwo in custody after NYPD blocks off Park Slope streets for reports of gunshotsPolice said there were no reports of injuriesBy Louis C. Hochman and Ryan KailathFormer Gov. Andrew Cuomo officially declares run for NYC mayorBy Jon Campbell and Michelle BocanegraHazel Dukes, longtime NYC, national civil rights leader dead at 92By Michelle BocanegraDead dolphin washes ashore in Astoria — cause of death under investigationBy Giulia HeywardNever miss a story Catch up on the most important headlines with a roundup of essential NYC stories, delivered to your inbox daily. Sign upEmail address By submitting your information, you're agreeing to receive communications from New York Public Radio in accordance with our Terms ."
