full_description = '''GothamistA non-profit newsroom, powered by WNYC.Gothamist Listen LiveDonate Louis C. HochmanArticles by Louis C. HochmanLouis C. HochmanAfter about two decades in (mostly) New Jersey-focused commercial print, digital and digital-but-radio-adjacent news, Lou stumbled into member-supported news in early 2021, as the editor and CEO of Montclair Local. There, he (hopes he) expanded enterprise, brought more sophistication to digital storytelling and moved the nonprofit newsroom closer to long-term financial sustainability. He helped lead the Local to its fourth consecutive General Excellence award from the New Jersey Press Association — the NJPA's highest honor with judges noting the paper's work to strip away layers of government opacity, to hold power to account, to make news accessible for more members of the community, to share the stories and concerns of more facets of the community and to tell compelling stories across multiple media. He's excited to continue the same ethic — news as a public service — at NYPR as the New Jersey and suburbs editor, drawing on the extraordinary talents of reporters including Karen Yi and Nancy Solomon. Lou lives in Philly (that commute!) with his partner and their two cats, about whom and about which he speaks incessantly.NewsTwo in custody after NYPD blocks off Park Slope streets for reports of gunshotsPolice said there were no reports of injuriesBy Louis C. Hochman and Ryan KailathNewsJudge dismisses corruption case against NJ Democratic party boss George NorcrossNorcross had argued the indictment was an attempt to criminalize New Jersey's bareknuckle politics.By Louis C. Hochman and Catalina GonellaNewsMSG Networks returning to Optimum in NY, NJ as companies reach a dealA contract standoff meant viewers lost access to Knicks, Rangers, Islanders and Devils programming.By Louis C. HochmanNewsNY AG: 300K people to see refunds, bills canceled after CityMD charged for COVID testsThe NY-based urgent care company billed patients despite federal rules prohibiting out-of-pocket payments, officials say.By Louis C. HochmanNewsWatch out for weekend road closures, traffic in Queens and Brooklyn for Lunar New Year eventsThe Year of the Snake began earlier this week.By Louis C. HochmanNewsHoboken PATH station shuts for a month on Thursday night. Here's how to get around.Officials say this was the "least painful" way to quickly complete extensive repairs.By Louis C. HochmanNewsNY trooper faked his own shooting, setting off a massive manhunt, Nassau DA saysWhen Trooper Thomas Mascia reported that he’d been shot last fall, it set off a multiday, multistate manhunt for a vehicle and driver that authorities now say he made up entirely.By Louis C. HochmanNewsAnother court rejects NJ's last-ditch effort to block Manhattan congestion pricingAlso Saturday, drivers got their first look at the "Congestion Relief Zone" signage.By Liam Quigley and Louis C. HochmanNewsPerson abandoned baby girl on Bronx street in tote bag, NYPD saysPolice said they were still searching for the suspect on Monday.By Louis C. HochmanNewsMinimum wage increases in New York and New Jersey on Jan. 1: What you need to knowFor most workers, the hourly wage is going up to $16.50 in New York City, Long Island and Westchester County and $15.49 in the Garden State.By Louis C. HochmanNewsAlert for NYC travelers: Delays on American Airlines after ground stop Christmas Eve morningThe delays came during one of the busiest travel times of the year.By Louis C. HochmanNewsAmtrak warns of 'significant delays' in and out of New York MondayAll service between New York and Philadelphia shut down temporarily over the weekend.By Louis C. HochmanGothamist is funded by sponsors and member donationsGothamist is funded by sponsors and member donationsLoad MoreNever miss a story Catch up on the most important headlines with a roundup of essential NYC stories, delivered to your inbox daily. Sign upEmail address By submitting your information, you