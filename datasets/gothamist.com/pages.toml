full_description = '''GothamistA non-profit newsroom, powered by WNYC.Gothamist Listen LiveDonate Arts & Entertainment Featured Arts & Entertainment Stories Henna artists around New York City brace for the Ramadan rushFor some local artists, the week leading up to Eid is one of the busiest times of the year.By Ryan KailathPublished Mar 1, 2025 at 12:00 p.m. ETLooking to spend more time at Port Authority? Now there's a theater.The Jewel Box Theater opened in October in a space formerly occupied by a Mrs. Fields cookie shop.By Hannah FrishbergArts & EntertainmentLooking to spend more time at Port Authority? Now there's a theater.The Jewel Box Theater opened in October in a space formerly occupied by a Mrs. Fields cookie shop.By Hannah Frishberg11 completely free things to do in New York City in MarchBy Anthony SchneckWhere to eat in Jersey City: 10 great spots that are worth a journeyBy Robert Sietsema121-year-old Ferdinando’s Focacceria in Brooklyn seeks new owners after sudden closingBy Ryan Kailath Latest Arts & Entertainment Articles Arts & EntertainmentSome eggs in NY are less than $4, others are $11. Here's how to navigate a chaotic market.Prices don't just vary wildly from store to store. There can be huge differences from carton to carton in any aisle.By Ryan Kailath and Catalina GonellaArts & EntertainmentA new makerspace, Brooklyn Spark, is slated to open in BushwickIt will be equipped with a 600-square-foot woodshop, a ceramics studio, areas dedicated to textiles and fine arts, and workspace and lounge areas.By Hannah FrishbergArts & EntertainmentThe Barclays Center's controversial history is revisited at a free event in Red HookThe event at Pioneer Works is billed as the 20th anniversary of the “resistance to the Atlantic Yards project.”By Hannah FrishbergArts & EntertainmentNYC socialists are seizing the means of reproduction at a lefty singles mixer“I think it’s important for us to have explicitly leftist dating spaces, because I want to sleep with someone who shares my values," said an organizer of the event.By Ryan KailathArts & EntertainmentDating coaches' advice to single New Yorkers: It’s not them, it’s you.“I think people blaming their own city is a cop-out sometimes for lack of accountability for actually putting in the work,” said one Manhattan-based dating coach.By Giulia HeywardArts & EntertainmentLegendary art installation ‘The Gates’ returns (digitally) to Central ParkA free exhibition and app launched this week to time with the 20th anniversary of The Gates.By Hannah FrishbergArts & EntertainmentSome NYC influencers are finding the secret to love: Dating yourselfOscar Wilde once said "to love oneself is the beginning of a lifelong romance."By Kenneal PattersonArts & EntertainmentNew Yorkers raced to get tickets to Paul McCartney’s surprise show on TuesdayThe music legend made the surprise announcement Tuesday, hours before his show later that day.By Ryan Kailath and Hannah FrishbergArts & EntertainmentThe ‘art-school feminists’ making New York fashion weird againWomen’s History Museum was started by New Yorkers Mattie Barringer and Amanda McGowan, who met at NYU and shared a love for fashion.By Hannah FrishbergArts & EntertainmentAn all-gender beauty pageant is coming to GreenpointEveryone, including people over aged 80, are encouraged to apply.By Ryan KailathArts & EntertainmentMeet Schmutzie, a champion show dog and West Village residentShe loves snow, outdoor dining and head pets. She's also competing at the Westminster Kennel Club Dog Show on Tuesday.By Hannah FrishbergArts & EntertainmentFor the perfect dating profile, some New Yorkers are letting AI do the work“The only solution is when you have somebody — or something — searching for you, and it understands your taste almost better than you do.”By Kenneal PattersonArts & EntertainmentWhy do New York City movie theaters have captions now?A new law requires movie theaters to show screenings with captions. Not all cinemas are complying.By Ryan KailathArts & EntertainmentYou can buy a mini-village in upstate NY built from junk and found objectsArtist Matt Bua has been constructing it in bursts of inspiration for almost 20 years.By Hannah FrishbergArts & Entertainment11 completely free things to do in New York City this FebruaryClose your wallet and hit the town for free concerts, book talks, art shows and more.By Anthony SchneckArts & Entertainment'Like Florida without sunshine': The end of Blue Man Group's 33-year run in NYC“ We were just three guys who decided to get bald and blue,” said one of the show's cofounders.By Hannah FrishbergArts & Entertainment10 ways to commemorate Black History Month in New York CityFeaturing free classical music performances, poetry walks, historical discussions and even a 'drunk history' comedy show, Black History month in New York City offers something for just about everyone.By Anthony SchneckArts & EntertainmentBryant Park Grill closing this spring, set to be replaced by a Jean-Georges restaurantAfter weeks of tension, the announcement was made at a committee meeting for Community Board Five on Monday.By Ryan KailathArts & EntertainmentThe Queens cafe that’s a go-to spot for Korean cultural celebrationsWith more than 30 kinds of tteok, Yedang Cafe in Bayside has been serving up artisanal Korean specialties for decades.By Caroline ShinArts & Entertainment13 ideas to celebrate Lunar New Year in New York CityCelebrate the year of the wood snake with music, dance and more.By Anthony SchneckLoad MoreNever miss a story Catch up on the most important headlines with a roundup of essential NYC stories, delivered to your inbox daily. Sign upEmail address By submitting your information, you're agreeing to receive communications from New York Public Radio in accordance with our Terms .'''
