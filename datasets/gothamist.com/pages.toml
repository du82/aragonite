ent occurred shortly after noon Sunday in the Ambrose Channel, according to authorities.By Giulia HeywardNewsNJ man convicted of trying to kill Salman Rushdie in western New YorkRushdie was attacked while he was speaking on stage at the Chautauqua Institution in 2022.By Giulia Heyward and Catalina GonellaNewsMTA to roll out major Queens bus redesign this summerThe first phase of the borough’s revamped bus network will launch on June 29, with a second phase coming in August.By Giulia HeywardNewsQueens community board divided over issue of fluoride in drinking waterAstoria's community board debated a motion to seek the removal of fluoride from NYC water after a federal ruling questioned its safety. The board decided to delay action, citing the need for more evidence.By Giulia Heyward and Phil CorsoNewsOn track? A behind-the-scenes look at the Hoboken PATH station renovations.From stripped-down tracks to brand-new infrastructure, the transformation is underway — check out what’s next for the Hoboken PATH station.By Giulia HeywardGothamist is funded by sponsors and member donationsGothamist is funded by sponsors and member donationsLoad MoreNever miss a story Catch up on the most important headlines with a roundup of essential NYC stories, delivered to your inbox daily. Sign upEmail address By submitting your information, you're agreeing to receive communications from New York Public Radio in accordance with our Terms ."
