["https://gothamist.com/news/after-fatal-bronx-fire-fdny-issues-1st-ever-criminal-summons-for-blocking-hydrant"]
title = "FDNY issues 1st ever criminal summons for blocking hydrant after fatal Bronx fire - Gothamist"
description = "It’s the first time a section of the city’s fire code has been used to fine a driver of a car blocking a fire hydrant."
full_description = "GothamistA non-profit newsroom, powered by WNYC.Gothamist Listen LiveDonate NewsFDNY issues 1st ever criminal summons for blocking hydrant after fatal Bronx fireBy Giulia HeywardPublished Feb 28, 2025ShareFacebookTwitterRedditEmailNever miss a story Email address By submitting your information, you're agreeing to receive communications from New York Public Radio in accordance with our Terms . By Giulia HeywardPublished Feb 28, 2025ShareFacebookTwitterRedditEmailWe rely on your support to make local news available to all Make your contribution now and help Gothamist thrive in 2025. Donate today Gothamist is funded by sponsors and member donationsThe New York City Fire Department issued its first-ever criminal summons to a driver whose car blocked a fire hydrant and slowed down efforts to extinguish a Bronx fire that killed two people, officials said on Friday.Blocked fire hydrants are a common occurrence across the city. The deadly Bronx fire occurred mere days after another blocked hydrant slowed down efforts to subdue a deadly fire in Brooklyn. And earlier this month, a group of Queens residents who said blocked fire hydrants are rampant in their neighborhood sent the FDNY a letter demanding stricter enforcement.The FDNY did not identify the individual who was fined $4,000 for violating a section of the city's fire code that makes it illegal to render a fire hydrant inaccessible or inoperable.However, fire department officials said the parked vehicle blocked the closest fire hydrant located directly across the street from a building where a three-alarm fire broke out on Feb. 12. Two people died in the blaze, which officials said was caused by a space heater.In a statement, FDNY Commissioner Robert S. Tucker said he hoped the pricey ticket would deter New Yorkers from blocking fire hydrants.“Seconds count in an emergency, and blocking a fire hydrant is a selfish decision that can kill people and endanger FDNY members as they work to save residents,” Tucker said.Taggednew york citypublic safetybronxGiulia HeywardGiulia Heyward is a breaking news reporter on the Day-Of desk. She previously worked at NPR, as a breaking news reporter, and the New York Times, as a reporting fellow on the national desk. Her work has also appeared in CNN, The Atlantic and Politico. Got a tip? Email [email protected] or more securely on signal at 917-715-1458.Read moreGothamist is funded by sponsors and member donationsGothamist is funded by sponsors and member donations MORE newsGunman opened fire into Manhattan bar, killing staffer, police sayThe shooting happened early Saturday at Nolita bar Tom & Jerry'sBy Ryan KailathPublished Mar 1, 2025 at 6:28 p.m. ETTwo in custody after NYPD blocks off Park Slope streets for reports of gunshotsPolice said there were no reports of injuriesBy Louis C. Hochman and Ryan KailathNewsTwo in custody after NYPD blocks off Park Slope streets for reports of gunshotsPolice said there were no reports of injuriesBy Louis C. Hochman and Ryan KailathFormer Gov. Andrew Cuomo officially declares run for NYC mayorBy Jon Campbell and Michelle BocanegraHazel Dukes, longtime NYC, national civil rights leader dead at 92By Michelle BocanegraDead dolphin washes ashore in Astoria — cause of death under investigationBy Giulia HeywardNever miss a story Catch up on the most important headlines with a roundup of essential NYC stories, delivered to your inbox daily. Sign upEmail address By submitting your information, you're agreeing to receive communications from New York Public Radio in accordance with our Terms ."
