full_description = "GothamistA non-profit newsroom, powered by WNYC.Gothamist Listen LiveDonate NewsGunman opened fire into Manhattan bar, killing staffer, police sayBy Ryan KailathPublished Mar 1, 2025 at 6:28 p.m. ETShareFacebookTwitterRedditEmailNever miss a story Email address By submitting your information, you're agreeing to receive communications from New York Public Radio in accordance with our Terms . Wirestock / Getty ImagesBy Ryan KailathPublished Mar 1, 2025 at 6:28 p.m. ETShareFacebookTwitterRedditEmailWe rely on your support to make local news available to all Make your contribution now and help Gothamist thrive in 2025. Donate today Gothamist is funded by sponsors and member donationsA gunman opened fire into popular NoLiTa bar Tom & Jerry’s early Saturday, killing an employee inside, police said. Police said the gunman opened fire into the Elizabeth Street bar after 3 a.m., striking the employee twice in the chest and once in the stomach. He was rushed to Bellevue Hospital and later pronounced deceased.The bar was closed as of Saturday evening.No arrests have been made, and the investigation is ongoing, police said.Taggedpublic safetymanhattanRyan KailathRead moreGothamist is funded by sponsors and member donationsGothamist is funded by sponsors and member donations MORE newsTwo in custody after NYPD blocks off Park Slope streets for reports of gunshotsPolice said there were no reports of injuriesBy Louis C. Hochman and Ryan KailathPublished Mar 1, 2025 at 3:34 p.m. ETModified Mar 1, 2025 at 8:20 p.m. ETFormer Gov. Andrew Cuomo officially declares run for NYC mayorThe former governor, who resigned amid sexual harassment allegations, launched his mayoral bid in a video posted on X.By Jon Campbell and Michelle BocanegraNewsFormer Gov. Andrew Cuomo officially declares run for NYC mayorThe former governor, who resigned amid sexual harassment allegations, launched his mayoral bid in a video posted on X.By Jon Campbell and Michelle BocanegraHazel Dukes, lo