title = "First Partner Jennifer Siebel Newsom | Governor of California"
description = "Jennifer Siebel Newsom is the First Partner of California, award-winning filmmaker, advocate, and mother of four."
full_description = "About the Governor First Partner Jennifer Siebel Newsom First Partner of California, award-winning filmmaker, advocate, and mother of four Jennifer Siebel Newsom is the First Partner of California, an award-winning filmmaker, and an influential thought leader on gender equality. Through her California for ALL Kids campaign, she is championing initiatives to support children’s mental and physical health, as well as provide families with the tools to build a solid learning foundation. And through her California for ALL Women campaign she’s making strides to build economic equity, equal representation, and advance a family-first agenda. Jennifer Siebel Newsom chose the title First Partner, as opposed to the traditional title of First Lady, to send a signal of inclusivity, recognizing that one day there will be a woman or LGBTQ+ Governor of California, and to elevate the importance of partnership and the need for, and benefits of, a caring, inclusive government. Learn more about Jennifer Siebel Newsom California for All Women We are dedicated to furthering the cause of gender equity in California, and lifting up women and their families by ensuring that women can thrive both at work and at home. California for All Kids California For All Kids is about putting children on a path to a healthier future by focusing on their minds, bodies, and environments. From Me to We We work to create a culture of selflessness and community, a culture that values WE over me and taps into our common humanity through service and empathy. California Partners Project First Partner Jennifer Siebel Newsom co-founded The California Partners Project, an organization focused on increasing women’s representation in leadership in California, and ensuring that our state’s media and technology industries are a force for good in the lives of all children. The California Partners Project is a nongovernmental organization, and its website is not an official government website. For information about the California Partners Project, a 501(c)(4) organization. First Partner’s Summer Book Club Featured media February 7, 2025 | InstagramVisiting Altadena Girls February 19, 2025 | InstagramIt was great to spend time with the California Legislative Women’s CaucusJanuary 22, 2025 | InstagramAt the National Sports Equity ConveningFebruary 13, 2025 | InstagramSo much gratitude for our California Conservation Corps Featured news Governor Newsom, First Partner Siebel Newsom statement on passing of Cecile Richards Jan 20, 2025News Los Angeles, California – Governor Gavin Newsom and First Partner Jennifer Siebel Newsom issued the following statement today on the passing of Cecile Richards, former Planned Parenthood president:“Today, we mourn the passing of an indomitable healthcare and... State secures federal funding for new maternal health initiative that will focus on quality of care for pregnant Medi-Cal members Jan 6, 2025News What you need to know: California was selected by the Centers for Medicare & Medicaid Services (CMS) to implement its Transforming Maternal Health (TMaH) Model, an initiative that will reimburse providers based on patient health outcomes and quality of care,... Governor Newsom issues executive order to crack down on ultra-processed foods and further investigate food dyes Jan 3, 2025News What you need to know: Governor Newsom issued an executive order today directing state agencies to recommend potential actions to limit the harms associated with “ultra-processed foods” and food ingredients that pose a health risk to individuals. Sacramento,... « Older Entries Next Entries » @media (max-width: 980px) { .half-width { max-width: 90vw !important; } } @media (max-width: 1200px) { .half-width { max-width: 80vw !important; } } @media (min-width: 1201px) { .half-width { max-width: 50vw !important; } }"
