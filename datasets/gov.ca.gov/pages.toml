anagement projects – part of the state’s ongoing efforts to protect communities from catastrophic wildfire. SACRAMENTO – Following the devastation of the Los... Governor Newsom releases 2024 judicial appointment data Feb 28, 2025News SACRAMENTO – Governor Gavin Newsom today released judicial applicant and appointee data for the administration’s judicial appointments.Since taking office in 2019 through 2025, Governor Newsom made 576 judicial appointments – including 131 in 2024 – from a pool... What they are saying: Governor Newsom’s latest economic investments will help bolster LA firestorm recovery Feb 28, 2025News What you need to know: Local community leaders are praising Governor Newsom’s announcement this week of new financial investments to help boost LA’s economic recovery, as well as the launch of California’s Economic Blueprint and the Los Angeles County Jobs First...'''
