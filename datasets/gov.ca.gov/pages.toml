title = "Share your California story | Governor of California"
description = "California’s story is your story. Every day, Governor Newsom is working to better the lives of all Californians. We want to hear from you."
full_description = "Share your California story California’s story is your story. Every day, Governor Newsom is working to better the lives of all Californians. We want to hear from you. How have state policies or programs helped you and your family? Share your story with us. Note: This form is NOT a method to contact the Governor. If you are trying to contact the Governor, visit our Contact page Please enable JavaScript in your browser to complete this form.Please enable JavaScript in your browser to complete this form.Name *Email address *Zip code *Your California story *Terms and conditions *I agree to the terms and conditions.Submit Terms and conditions By submitting your story, you are authorizing the Governor’s Office to use, publish, reproduce, display, and distribute your story in a number of different ways, including by publicly displaying it on this website and in social media, press releases, and other promotional materials, attributed to you. You are also authorizing us to reformat, translate, shorten, and correct errors in your story, and to incorporate it into other publications and works the Governor’s Office may create. You additionally grant us permission to use your story for any purpose, anywhere and in perpetuity, without compensating you. You also grant us permission to contact you for more information if needed. Please note that any story submitted to the Governor’s Office, regardless of whether it is used or published, becomes a public record that must be retained by the Governor’s Office and may be transferred to and archived by the California State Archives at the end of the Administration."
