["https://www.gov.ca.gov/2025/02/11/governor-newsom-issues-executive-order-to-support-childcare-providers-impacted-by-la-fires"]
title = "Governor Newsom issues executive order to support childcare providers impacted by LA fires | Governor of California"
full_description = '''News Feb 11, 2025 Governor Newsom issues executive order to support childcare providers impacted by LA fires What you need to know: Governor Gavin Newsom issued an executive order today ordering the state to ensure that childcare providers impacted by the recent wildfires in Los Angeles are aware of their potential eligibility for Disaster Unemployment Assistance and have the support needed to apply. Los Angeles, California – Today, Governor Gavin Newsom issued an Executive Order for the Department of Social Services, in collaboration with the California Employment Development Department (EDD), to individually contact childcare programs or providers whose childcare facility has not reopened in the wake of the Los Angeles wildfires and make them aware of their potential eligibility for Disaster Unemployment Assistance. It also orders the agencies to support each individual in completing the application for those benefits. “As California begins to recover from the devastating Los Angeles wildfires, we are working to make sure that childcare providers are aware of the federal and state supports available to them if they still are unable to work due to the fires. We will make sure that those who help our families have the resources they need and deserve.” Governor Gavin Newsom “Caregiving isn’t just a service—it’s the infrastructure we all need to go to work — making it a vital piece of the workforce equation. Ensuring that childcare providers— an industry that is majority women — are able to provide for their own families during this time is crucial to their ability to recover and rebuild, just as it’s critical to supporting the larger economy.” First Partner Jennifer Siebel Newsom Text of the executive order is available here. Get help today EDD helps people and businesses in California who have been affected by disasters. If you lost your job or can’t work because of this disaster, you may qualify for unemployment, disability, or Paid Family Leave benefits. For information on this disaster and to see if you qualify, visit EDD’s Disaster Unemployment Assistance website. For those Californians impacted by the firestorms in Los Angeles, there are resources available. Californians can go to CA.gov/LAfires – a hub for information and resources from state, local and federal government. Individuals and business owners who sustained losses from wildfires in Los Angeles County can apply for disaster assistance: Online at DisasterAssistance.gov By calling 800-621-3362 By using the FEMA smart phone application Assistance is available in over 40 languages If you use a relay service, such as video relay service (VRS), captioned telephone service or others, give FEMA the number for that service Executive Orders, First Partner, Press Releases, Recent News body p, body ul, body .whattoknow p { font-size: clamp(1rem, var(--base), 5rem); line-height: 1.5; } #category-container .et_pb_title_meta_container:before { content: 'Categories: '; font-weight: normal; color: #000; } #category-container .et_pb_title_meta_container a { text-decoration: underline; } #category-container .et_pb_title_meta_container a:hover { color: var(--navigation-hover-light) !important; text-decoration: underline; } .et_pb_gutters3 .et_pb_column_1_3 .et_pb_module, .et_pb_gutters3.et_pb_row_inner .et_pb_column_1_3 .et_pb_module, .et_pb_gutters3 .et_pb_column_1_3 .et_pb_widget { margin-bottom: 0; } .et_pb_title_container h1 { font-size: var(--h1); } @media (max-width: 1279px) { #main-content .quote { padding-left: 1em; } } @media (max-width: 980px) { .et_pb_module.et_pb_sidebar_0 { text-align: left; } a.a2a_button_facebook { padding-left: 0; margin-left: -5px; } .et_pb_column_inner { margin-bottom: .5em; } } @media (min-width: 981px) { .recent-news { margin-top:28rem!important; } } @media (min-width: 991px) { .recent-news { margin-top:22rem!important; } } @media only screen and (max-width: 600px) { .news-body-text { max-width: 100% !important; } } .news-