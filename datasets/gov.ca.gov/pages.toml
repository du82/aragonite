["https://www.gov.ca.gov/2025/03/03/governor-newsom-orders-return-to-office"]
title = "Governor Newsom orders return to office | Governor of California"
full_description = '''News Mar 3, 2025 Governor Newsom orders return to office State looks to hire former federal workers, including firefighters and forest service staff, seeking employment What you need to know: Governor Newsom ordered state agencies to update telework policies to reflect a new default expectation of at least four in-office days per week beginning July 1, 2025. To further strengthen the state’s emergency and disaster response and address employment needs, the Governor is also directing CalHR to make it easier for former federal workforce employees in targeted areas to enter state service to fill existing vacancies. SACRAMENTO — Governor Gavin Newsom today issued an executive order requiring all agencies and departments within his Administration to update their hybrid telework policies to a default of at least four days per week by July 1, 2025. The order establishes a four-day-per-week in-office expectation, with further telework flexibilities granted on a case-by-case basis in light of individual circumstances, consistent with the executive order and existing family-friendly employment policies and legal obligations. To further enhance the state’s workforce needs, the Governor is also directing CalHR to streamline the hiring process for former federal employees seeking employment in key roles, including firefighting, forest management, and weather forecasting. “State employees are the backbone of our government, and we are blessed in California with public servants who devote their time and talents to the smooth operation of critical services and public infrastructure. In-person work makes us all stronger — period. When we work together, collaboration improves, innovation thrives, and accountability increases. That means better service, better solutions, and better results for Californians, while still allowing flexibility.” Governor Gavin Newsom Building a more effective, accountable state government This executive order reinforces California’s commitment to operational efficiency and high-quality public service. By bringing employees back to the office four days a week, the state will: ✅ Improve collaboration and communication, leading to faster, more effective decision-making. ✅ Enhance mentorship and knowledge-sharing, particularly for newer employees. ✅ Strengthen oversight and accountability, ensuring public resources are managed effectively. ✅ Deliver better services to Californians, with increased responsiveness and coordination. Top talent in state service California employs more than 224,000 full-time state workers who provide critical public services, more than half of whom already report in-person to work every day, including peace officers, health care workers, maintenance workers, and safety inspectors. As the world’s fifth-largest economy, home to Silicon Valley, the entertainment industry, and the nation’s agricultural hub, the state remains a top employer for skilled professionals nationwide. With federal workforce reductions, California is strategically recruiting experienced professionals to fill key job openings in firefighting, extreme weather forecasting, climate resilience, and water management roles — ensuring the state remains prepared for natural disasters and environmental challenges — in addition to other critical fields such as medical and mental health care. Key directives in the executive order: State agencies offering a hybrid telework policy will implement a default of four in-office days per week beginning July 1, 2025, allowing for case-by-case telework exceptions consistent with the executive order. CalHR will issue statewide guidance on appropriate exceptions that will address, among other topics, employees whose positions require telework and employees who do not live near their duty stations and were hired with a mutually agreed-upon telework arrangement. State agencies and departments must develop plans to accommodate the increase in in-person work, including with respect to workplace facilities and employee transportation options. The Government Operations Agency, the Department of General Services, and CalHR, will support agencies and departments in implementing the order. CalHR will promptly notify impacted bargaining units. CalHR will identify job openings that align with the skills of former federal employees, particularly in firefighting, weather forecasting and modeling, natural resource management, medical and mental health care, and the sciences. Read the executive order Executive Orders, Recent News body p, body ul, body .whattoknow p { font-size: clamp(1rem, var(--base), 5rem); line-height: 1.5; } #category-container .et_pb_title_meta_container:before { content: 'Categories: '; font-weight: normal; color: #000; } #category-container .et_pb_title_meta_container a { text-decoration: underline; } #category-container .et_pb_title_meta_container a:hover { color: var(--navigation-hover-light) !important; text-decoration: underline; } .et_pb_gutters3 .et_pb_column_1_3 .et_pb_module, .et_pb_gutters3.et_pb_row_inner .et_pb_column_1_3 .et_pb_module, .et_pb_gutters3 .et_pb_column_1_3 .et_pb_widget { margin-bottom: 0; } .et_pb_title_container h1 { font-size: var(--h1); } @media (max-width: 1279px) { #main-content .quote { padding-left: 1em; } } @media (max-width: 980px) { .et_pb_module.et_pb_sidebar_0 { text-align: left; } a.a2a_button_facebook { padding-left: 0; margin-left: -5px; } .et_pb_column_inner { margin-bottom: .5em; } } @media (min-width: 981px) { .recent-news { margin-top:28rem!important; } } @media (min-width: 991px) { .recent-news { margin-top:22rem!important; } } @media only screen and (max-width: 600px) { .news-body-text { max-width: 100% !important; } } .news-body-text { max-width: 85%; } .recent-new .et_pb_text_inner h2{ color:#6d6d6d; } #main-content .quote { width: 100%; font-size: 24px; font-style: normal; font-weight: 400; line-height: 35px; border-left: solid 3px var(--GO-brand-Big-Sur-Blue, #1b499b); paddin