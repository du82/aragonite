["https://www.gov.ca.gov/2025/02/04/governor-newsom-announces-new-food-benefits-available-for-people-in-los-angeles-impacted-by-recent-fires"]
title = "Governor Newsom announces new food benefits available for people in Los Angeles impacted by recent fires | Governor of California"
full_description = '''News Feb 4, 2025 Governor Newsom announces new food benefits available for people in Los Angeles impacted by recent fires What you need to know: People impacted by the recent fires in Los Angeles may be eligible for new food benefits. A family of four with a monthly income up to $3,529 per month may be eligible to receive $975. Los Angeles, California – As part of California’s ongoing wildfire response and recovery efforts, Governor Gavin Newsom today announced that individuals and families directly impacted by the recent fires in Los Angeles County – living in the zip codes listed below – may be eligible to receive Disaster CalFresh food benefits. A family of four with a monthly income up to $3,529 per month may be eligible to receive a one-time $975 food benefit through this program, which is available to those who lived or worked in a fire-impacted area within Los Angeles County on January 7, 2025. “California’s response and recovery efforts will continue to be guided by the needs of people throughout the impacted region. My administration is focused on serving the individuals and families who need our help the most, which means creating new and expanded benefit programs. Starting February 10th, I encourage eligible people to apply for D-CalFresh benefits, which will allow more families to put more food on the table.” Governor Gavin Newsom “No family should have to worry about how they’re going to put food on the table, especially during a crisis. D-CalFresh food benefits will help ensure that those most in need have access to critical assistance. Angelenos, please apply and know that we will continue to stand with you—no family should have to navigate this hardship alone.” First Partner Jennifer Siebel Newsom California Health and Human Services Agency (CalHHS) Secretary Kim Johnson: “The California Health & Human Services Agency and its departments, in partnership with our federal, local, and other state partners, are committed to helping people impacted by these historic wildfires.” Who can apply? Individuals and families who lived or worked in a fire impacted area within Los Angeles County on January 7, 2025 may be eligible for Disaster CalFresh food benefits. Wildfire impacted areas include the following ZIP codes: Eaton: 91104, 91206, 91103, 91016, 91010, 91001, 91214, 91101, 91107, 91006, 91208, 91020, 91105, 91011, 91024, 91008, 91007, 91042, and 91106 (total = 19) Hughes: 91334, 91350, 91355, 91384, 91390, 93532, and 93536 (total = 7) Hurst: 91342, 91344, 91321, 91326, 91381, and 91311 (total = 6) Palisades: 90049, 91302, 91301, 90290, 90272, 90265, 90402, 90073, 90077, 90095, 90401, 90403, 90404, 91316, 91356, 91367, 91403, 91436, and 91340 (total = 19) Other (qualifying power outages): 91750, 93510 (total = 2) Additionally, at least one person in the household must not already be receiving regular CalFresh food benefits and must have experienced at least one of the following as a direct result of the severe wildfires: Money was spent because of the wildfires or related power outage, Money was lost from work because of the wildfires, Money was spent because of damage to a home or business, or Food loss alone. Individuals already participating in CalFresh and living in these zip codes do not need to apply for Disaster CalFresh benefits, but may be eligible to receive supplemental benefits, which bring the household up to the maximum benefit amount based on their household size. How to apply Households may only apply for Disaster CalFresh between February 10-14, 2025 and February 18-19, 2025 by calling 866-488-8482 (M-F, 8:00 a.m. to 5:00 p.m.) or visiting a Los Angeles DPSS office to apply in person. In most cases, benefits will be available within three days of the date of a qualifying interview. Benefits will be provided via an Electronic Benefits Transfer (EBT) card, which is like a debit card that can be used to purchase food items at grocery stores and other authorized retailers. If applicants are approved, the county will tell them when and where to pick up their EBT card. Other food supports for survivors California has also secured waivers to support people receiving CalFresh food benefits in the impacted region. People receiving CalFresh can use their benefits to purchase hot foods in Los Angeles and surrounding counties, as impacted individuals and families may not have access to food storage and/or cooking facilities. This waiver will be in effect through February 8, 2025. Also, people receiving CalFresh who lost food due to the fires that was purchased with their benefits have an extended period of time to request replacement benefits. This waiver will be in effect through February 5, 2025. CalFresh recipients may contact the Los Angeles DPSS at (866) 613-3777 (M-F, 7:30 a.m. to 6:30 p.m.) to request replacement benefits. California also released $1 million in emergency reserve funding that is providing emergency food boxes and potable water to people in need, in partnership with the Los Angeles Regional Food Bank. People can find a list of food distributions in their area here. First Partner, Health care, Press Releases, Recent News body p, body ul, body .whattoknow p { font-size: clamp(1rem, var(--base), 5rem); line-height: 1.5; } #category-container .et_pb_title_meta_container:before { content: 'Categories: '; font-weight: normal; color: #000; } #category-container .et_pb_title_meta_container a { text-decoration: underline; } #category-container .et_pb_title_meta_container a:hover { color: var(--navigation-hover-light) !important; text-decoration: underline; } .et_pb_gutters3 .et_pb_column_1_3 .et_pb_module, .et_pb_gutters3.et_pb_row_inner .et_pb_column_1_3 .et_pb_module, .et_pb_gutters3 .et_pb_column_1_3 .et_pb_widget { margin-bottom: 0; } .et_pb_title_container h1 { font-size: var(--h1); } @media (max-width: 1279px) { #main-content .quote { padding-left: 1em; } } @media (max-width: 980px) { .et_pb_module.et_pb_sidebar_0 { text-align: lef