["https://www.gov.ca.gov/2025/02/28/governor-newsom-announces-executive-staff-transitions-with-appointments-of-nani-coloretti-ann-patterson"]
title = "Governor Newsom announces executive staff transitions with appointments of Nani Coloretti, Ann Patterson | Governor of California"
full_description = '''News Feb 28, 2025 Governor Newsom announces executive staff transitions with appointments of Nani Coloretti, Ann Patterson SACRAMENTO – Governor Gavin Newsom today announced the appointment of Nani Coloretti as his new Cabinet Secretary and expressed deep gratitude to departing Cabinet Secretary Ann Patterson for her six years of exemplary service. Patterson, who had planned to step down, has agreed to extend her public service as Senior Counselor to the Governor, primarily supporting the administration’s recovery initiatives for Los Angeles. “I am profoundly grateful for Ann’s guidance over these last six years — helping me navigate some of the most meaningful, as well as the most challenging, moments of my governorship. “Ann was ready to take the next step, but her willingness to stay to help us transition during LA’s recovery speaks volumes about her dedication to California. “During this transition, I am thrilled to welcome Nani as she steps into this critical role. Nani’s decades of experience navigating complex policy issues at all levels of government make her uniquely qualified to lead our cabinet in continuing to deliver bold solutions to improve the health, well-being, and safety of all Californians.” Governor Gavin Newsom Coloretti previously held the position of Deputy Director of the Office of Management and Budget under President Joe Biden, where she helped manage the nation’s nearly $7 trillion federal budget and implement key initiatives across all areas of government. She has also held senior leadership roles at the U.S. Department of Housing and Urban Development and the U.S. Department of the Treasury and played a pivotal role in establishing the Consumer Financial Protection Bureau. During her tenure as Cabinet Secretary, Patterson guided California through historic challenges, including the state’s response to multiple natural disasters and the COVID-19 pandemic. She played a pivotal role in advancing nearly all of Governor Newsom’s efforts, including PAGA reform, historic laws protecting ratepayers and wildfire survivors, establishing the world’s largest aerial wildfire-fighting fleet, improving public safety through the California Model, and implementing universal free school meals for all kids in California. Nani Coloretti, of Sacramento, has been appointed Cabinet Secretary in the Office of Governor Gavin Newsom. Coloretti has been Senior Counselor in the Office of Governor Gavin Newsom since 2025. Coloretti was Deputy Director at the United States Office of Management and Budget from 2022 to 2025. She was Senior Vice President for Business and Financial Strategy at The Urban Institute from 2017 to 2022. Coloretti was Deputy Secretary at the United States Department of Housing and Urban Development from 2014 to 2017. She served in multiple roles at the United States Department of the Treasury from 2009 to 2014, including Assistant Secretary for Management, Acting Chief Operating Officer for the Consumer Financial Protection Bureau, and Deputy Assistant Secretary of Management and Budget. Coloretti was San Francisco Budget Director in the Office of Mayor Gavin Newsom from 2006 to 2009. She served in multiple roles in the Office of Mayor Gavin Newsom from 2005 to 2006, including Policy Director and Deputy Policy Director. Coloretti earned a Master of Public Policy degree from University of California, Berkeley and a Bachelor of Arts degree in Economics and Communications from University of Pennsylvania. This position does not require Senate confirmation, and the salary is $235,344. Coloretti is a Democrat. Ann Patterson, of Sacramento, has been appointed Senior Counselor at the Office of Governor Gavin Newsom. Patterson has been Cabinet Secretary at the Office of Governor Gavin Newsom since 2022 and has served in multiple roles in the Office of Governor Newsom since 2019, including Legal Affairs Secretary and Chief Deputy Legal Affairs Secretary. Patterson was a Partner at Orrick, Herrington, and Sutcliffe from 2005 to 2018. This position does not require Senate confirmation, and the compensation is $235,344. Patterson is a Democrat. Press Releases, Recent News body p, body ul, body .whattoknow p { font-size: clamp(1rem, var(--base), 5rem); line-height: 1.5; } #category-container .et_pb_title_meta_container:before { content: 'Categories: '; font-weight: normal; color: #000; } #category-container .et_pb_title_meta_container a { text-decoration: underline; } #category-container .et_pb_title_meta_container a:hover { color: var(--navigation-hover-light) !important; text-decoration: underline; } .et_pb_gutters3 .et_pb_column_1_3 .et_pb_module, .et_pb_gutters3.et_pb_row_inner .et_pb_column_1_3 .et_pb_module, .et_pb_gutters3 .et_pb_column_1_3 .et_pb_widget { margin-bottom: 0; } .et_pb_title_container h1 { font-size: var(--h1); } @media (max-width: 1279px) { #main-content .quote { padding-left: 1em; } } @media (max-width: 980px) { .et_pb_module.et_pb_sidebar_0 { text-align: left; } a.a2a_button_facebook { padding-left: 0; margin-left: -5px; } .et_pb_column_inner { margin-bottom: .5em; } } @media (min-width: 981px) { .recent-news { margin-top:28rem!important; } } @media (min-width: 991px) { .recent-news { margin-top:22rem!important; } } @media only screen and (max-width: 600px) { .news-body-text { max-width: 100% !important; } } .news-body-text { max-width: 85%; } .recent-new .et_pb_text_inner h2{ color:#6d6d6d; } #main-content .quote { width: 100%; font-size: 24px; font-style: normal; font-weight: 400; line-height: 35px; border-left: solid 3px var(--GO-brand-Big-Sur-Blue, #1b499b); padding-left: 16px; } .et_pb_column_3_4 .spacing .et_pb_row_inner { padding: 0; } jQuery("#page-container").removeClass('page-container-ds'); /* Aside Bar All Posts */ body[class*="post-template-default single single-post"] .et_pb_sidebar_0 a.tag-cloud-link { background: transparent; display: table; font-size: clamp(1rem,var(--base),5rem) !important; padding-left: 0; paddin