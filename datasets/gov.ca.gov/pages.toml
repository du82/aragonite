["https://gov.ca.gov/about/first-partner/me-to-we"]
title = "From Me to WE | Governor of California"
description = "The Office of the First Partner is dedicated to elevating the value of service and creating a community where the health and well-being of all of us is as important, if not more important, than our individual success. It is more important than ever that we begin to create a culture of selflessness and community, a culture that values WE over me."
full_description = "Office of the First Partner From Me to We The Office of the First Partner is dedicated to elevating the value of service and creating a community where the health and well-being of all of us is as important, if not more important, than our individual success. It is more important than ever that we begin to create a culture of selflessness and community, a culture that values WE over me. Learn more below. California Volunteers The First Partner serves as Honorary Chair of the California Volunteers Commission. The California Volunteers Commission supports California Volunteers, which is tasked with uniting Californians in service and empowering them to take action in their communities. Visit the site and be a part of the solution California Hall of Fame Established in 2006, the California Hall of Fame honors the trailblazers of California who used their talents and platform to make a difference in their communities. From activists to entrepreneurs, athletes, and authors, these Californians exemplify the innovative and diverse spirit of California – the spirit of #metoWE. Visit the Hall of Fame site #MetoWE online! Acts of #metoWE are happening all around us, and we’re using our platform to highlight these stories and encourage more people to join in. Check out some of the amazing ways people are uplifting their communities, and tag #metoWE online to highlight even more inspiring stories. #MetoWE gallery FP_FM2W_1FP_FM2W_2FP_FM2W_3FP_FM2W_4FP_FM2W_5FP_FM2W_6"
