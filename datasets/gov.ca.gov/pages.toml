["https://www.gov.ca.gov/2025/01/27/on-holocaust-remembrance-day-governor-newsoms-council-on-holocaust-and-genocide-education-releases-findings-and-recommendations"]
title = "On Holocaust Remembrance Day, Governor Newsom’s Council on Holocaust and Genocide Education releases findings and recommendations | Governor of California"
full_description = '''News Jan 27, 2025 On Holocaust Remembrance Day, Governor Newsom’s Council on Holocaust and Genocide Education releases findings and recommendations What you need to know: The Council was tasked with assessing the status of Holocaust and genocide education in California, making recommendations for how to improve that education, and promoting best practices for educators, schools, and organizations and sponsor Holocaust and genocide remembrance. Sacramento, California – On International Holocaust Remembrance Day, Governor Gavin Newsom’s Council on Holocaust and Genocide Education today released the “Holocaust and Genocide Education in California: A Study of Statewide Context and Local Implementation.” In 2021, following a disturbing increase in antisemitic hate, Governor Newsom established the Governor’s Council on Holocaust and Genocide Education to identify instructional resources to teach students across California about the Holocaust and other acts of genocide and provide young people with the tools necessary to recognize and respond to instances of antisemitism and bigotry. Read the full study HERE. “In California, hate is unacceptable, and the shocking decline in awareness among young people about the Holocaust and other acts of genocide is especially alarming. I was proud to establish the Council on Holocaust and Genocide Education and grateful for their work on this comprehensive report. I look forward to reviewing the Council’s recommendations and ensuring that California continues to be a beacon for tolerance, empathy, and education.” Governor Gavin Newsom How we got here The Council assessed the status of Holocaust and genocide education in California, made recommendations for how to improve Holocaust and genocide education in our schools, and will now work to promote best practices for educators, schools and organizations and sponsor Holocaust and genocide remembrance. The Council is co-chaired by State Senator Henry Stern, Attorney General Rob Bonta, State Superintendent of Public Instruction Tony Thurmond and Dr. Anita Friedman, Executive Director, Jewish Family and Children’s Services/Northern California. Dr. Anita Friedman, Executive Director, Jewish Family and Children’s Services (JFCS)/Northern California: “California leads the nation in support for state-of-the art Holocaust and Genocide Education. As a result, our State is systematically creating a more unified society and a more informed, morally courageous and socially responsible next generation. We are inspired by the enthusiastic cooperation of educators, communities and students in this common cause.” State Senator Henry Stern: “On this Yom HaShoah, or Holocaust Remembrance Day, we reaffirm the plea to ‘Never Forget.’ Never forget our ancestors, the unimaginable horrors endured, and the systemic failures that allowed such atrocities to unfold. We remember not only to honor our ancestors but to safeguard against history repeating itself. Understanding the patterns of genocide that occurred to numerous groups worldwide, is essential in fostering empathy, combatting hate, and upholding our collective moral responsibility. We have to ensure that our students are learning this complex subject matter so they are equipped to enter a society increasingly rife with misinformation. I’m proud that this critical report will allow us to invest in the resources, teacher training, and curriculum necessary to equip our students with factual information to break the cycle of history repeating itself.” Attorney General Rob Bonta: “There is no place for hate in California. The California Department of Justice is committed to combatting all forms of hate and bigotry, and to building a more just, empathetic society for our children. Acknowledging the truth and teaching our youth are crucial steps toward ensuring that we don’t repeat the atrocities of our past. I’m grateful to our state partners and the Council on Holocaust and Genocide Education for their work and recommendations to continue fighting antisemitism and intolerance through education and beyond.” State Superintendent of Public Instruction Tony Thurmond: “We must counter hate wherever and whenever it rears its head, and especially in our schools. Every child must feel safe to learn, and every child should feel that they belong on their school campus. It takes strong leaders to end hate and foster understanding. I am proud to stand alongside nearly 100 school and district leaders and antibias practitioners as we commit to use the power of education to end hate across California.” “I’m grateful for the work of the Governor’s Council Holocaust and Genocide Education for identifying gaps in education on the Holocaust and other genocides. This education is vital as history often repeats itself if unchecked. Young people are our future leaders, and this education equips them with the tools to recognize and respond to antisemitism and bigotry in all forms. California must always stand for love, tolerance, and understanding. Securing that future begins with a strong foundation of empathy and understanding amongst our youth population.” First Partner Jennifer Siebel Newsom Key findings Key findings of the study released today show that while some districts have developed robust programs, the overall landscape remains fragmented, with success often dependent on individual educator initiative. Local Educational Agency (LEA) representatives emphasized the need for state-level support – ultimately pointing to the necessity of a systematic, state-supported approach to ensure the kind of equitable, high-quality Holocaust and genocide education statewide that the Council envisions. Respondents highlighted increased student knowledge, heightened empathy, and higher levels of engagement as key successes of their Holocaust and genocide education efforts. However, the study uncovered significant gaps in implementation support. The majority of respondents shared that their LEAs did not provide professional development focused on Holocaust and genocide education. The California-focused analysis revealed that while the state has made significant strides, including recent legislation and funding allocations, there are opportunities to further align and amplify these efforts. Recommendations Drawing on these comprehensive findings, this report offers 10 recommendations to strengthen Holocaust and genocide education in California: Communicate California’s Vision for Holocaust and Genocide Education Revise the California History–Social Science Content Standards Revise the History–Social Science Framework for California Public Schools Update, Distribute, and Provide Guidance for the Model Curriculum for Human Rights and Genocide Continue to Create a Vetted Central Clearinghouse for Curriculum, Instruction, Assessment, and Professional Learning Increase Direct Funding to Districts and Schools for Holocaust and Genocide Education Expand Existing Statewide Professional Learning on Holocaust and Genocide Education Monitor and Evaluate Educational Outcomes Continue to Conduct Additional Research to Inform the Council’s Future Actions Expand, Publicize, and Strengthen the Role of the Governor’s Council on Holocaust and Genocide Education Fighting hate Governor Newsom has long made the eradication of discrimination and hate a priority. Working with the Jewish Caucus and Legislature, the Newsom administration successfully secured millions of dollars to ensure that future generations of Californians never forget the lessons of past genocides, including millions of dollars to develop curriculum resources related to Holocaust and genocide education, such the Holocaust Museum LA, the JFCS Holocaust Center, the Museum of Tolerance, and the California Teachers Collaborative for Holocaust and Genocide Education. First Partner, Media Advisories, Recent News body p, body ul, body .whattoknow p { font-size: clamp(1rem, var(--base), 5rem); line-height: 1.5; 