gin-top: -5%; } } Recent news California seizes $534 million in illegal cannabis in 2024 Mar 4, 2025News What you need to know: California enforcement officials have seized an estimated retail value of $534 million of unlicensed cannabis in 2024. Since 2019, officials have seized approximately $2.8 billion in illegal cannabis. Sacramento, California – Reinforcing... With growing fire risk, Governor Newsom proclaims state of emergency to fast-track critical wildfire prevention projects statewide Mar 1, 2025News What you need to know: Governor Newsom is proclaiming a state of emergency to fast-track critical forest management projects – part of the state’s ongoing efforts to protect communities from catastrophic wildfire. SACRAMENTO – Following the devastation of the Los... Governor Newsom releases 2024 judicial appointment data Feb 28, 2025News SACRAMENTO – Governor Gavin Newsom today released judicial applicant and appointee data for the administration’s judicial appointments.Since taking office in 2019 through 2025, Governor Newsom made 576 judicial appointments – including 131 in 2024 – from a pool...'''
