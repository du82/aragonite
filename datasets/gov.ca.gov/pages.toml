full_description = 'Priorities & Progress Priorities Priorities & Progress Priorities .top-left { position: absolute; top: 0px; left: 0px; height: auto; padding: var(--gutter-gap); text-align: left; max-width: 33cqi; width: auto; background-image: var(--go-brand-radial-gradient); opacity: 0.9; color: #fff; } Housing & homelessness Tackling homelessness and building more housing Governor Newsom is tackling California’s homelessness crisis head-on. It’s an emergency decades in the making. But no more excuses, no more passing the buck. We will meet this emergency with the compassion and urgency it demands by: holding cities and counties accountable, getting and keeping more people in housing, and building more housing, faster See the Governor’s initiatives for housing Public safety Keeping California safe Governor Newsom is taking proven steps to fight crime and keep Californians safe. Since 2019, the Golden State has invested a record amount of funding to: tackle organized crime, strengthen local law enforcement response, hold perpetrators accountable, and get guns and drugs off our streets. See the Governor’s initiatives for public safety Economy Creating opportunity for all Californians California’s economic dominance didn’t happen overnight. For generations, we’ve embraced a set of core principles for economic success. We’re doubling down on this strategy by: expanding the conveyor belt for talent, cultivating our innovation ecosystem, building a healthier and cleaner California, encouraging risk-taking without recklessness, and making the state affordable for all. See the Governor’s initiatives for the economy Health care A healthier California Governor Newsom has led the charge to: expand health care access, make it more affordable, and improve care for all Californians, regardless of age, income, or immigration status. See the Governor’s initiatives for health care Climate California’s Climate Commitment is the most ambitious in the world. Governor Newsom is leading the global shift to a sustainable future. That means more clean energy, and less pollution. Schools Governor Newsom is putting families first. He’s giving parents the freedom to choose how to educate their kids. And he’s expanding childcare and leave benefits to support families. Government Governor Newsom is making state government work for all Californians. He’s improving services and cutting red tape. He’s building a state government that reflects California’s diversity at every level. Belonging California’s incredible diversity is the foundation of our success. We’ve made great progress toward addressing historic wrongs, but much work remains. The Newsom Administration is doing that work to make the California Dream a reality for every one of us. .priorities-progress { background-image: url("https://www.gov.ca.gov/wp-content/uploads/2024/04/priorities-landing-banner.png"); background-repeat: no-repeat; background-size: cover; color: var(--text-white); padding: 0 !important; & .top-left { opacity: 1; } } body #page-container .main-content-ds .priorities-progress.et_pb_section.et_section_specialty .et_pb_row { max-width: 100% !important; padding: 0 !important; } body #page-container .main-content-ds .priorities-progress.et_pb_section.et_section_specialty .et_pb_row .et_pb_column, body #page-container .main-content-ds .priorities-progress.et_pb_section.et_section_specialty .et_pb_row .et_pb_column .et_pb_row_inner { padding-bottom: 0 !important; } body #page-container .main-content-ds .landing-banner.et_pb_section.et_section_specialty .et_pb_row { max-width: 100% !important; padding: 0 !important; } body #page-container .main-content-ds .landing-banner.et_pb_section.et_section_specialty .et_pb_row .et_pb_column, body #page-container .main-content-ds .landing-banner.et_pb_section.et_section_specialty .et_pb_row .et_pb_column .et_pb_row_inner { padding-bottom: 0 !important; }'
