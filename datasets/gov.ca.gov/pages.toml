["https://www.gov.ca.gov/about"]
title = "About Gavin Newsom | Governor of California"
description = "Gavin Newsom was elected as California’s 40th Governor on November 6, 2018."
full_description = "Governor Gavin Newsom Gavin Newsom was elected as California’s 40th Governor on November 6, 2018. Gavin Newsom is the Governor of California, former Lieutenant Governor of California, and former Mayor of San Francisco. Newsom is widely recognized for his willingness to lead – repeatedly developing, advocating, and implementing innovative and groundbreaking solutions to some of our most challenging issues. On a wide range of topics including same-sex marriage, gun safety, marijuana, the death penalty, universal health care, access to preschool, technology, criminal justice reform, and the minimum wage, Newsom stuck his neck out and did the right thing, which often led to sweeping changes when his policies were ultimately accepted, embraced, and replicated across the state and nation. Newsom’s top priorities for his administration include: tackling homelessness and building more housing, keeping California safe, creating opportunity for all, building a healthier California, and standing up for California values — from civil rights, to immigration, environmental protection, access to quality schools at all levels, and justice. Governor Newsom is married to Jennifer Siebel Newsom. They have four children: Montana, Hunter, Brooklynn, and Dutch. Download a high-res portrait of the Governor here. First Partner Jennifer Siebel Newsom Governor’s cabinet"
