full_description = '''News Mar 4, 2025 Governor Newsom: “Tariffs are taxes on American families” SACRAMENTO — Governor Gavin Newsom today issued the following statement regarding the Trump Administration’s action to impose tariffs on goods from Canada, Mexico, and China: “Tariffs are nothing more than a tax on hardworking American families — driving up the cost of groceries, cars, and essential goods.” Governor Gavin Newsom California is the fifth-largest economy in the world and is the country’s largest importer and second-largest exporter. The state relies heavily on trade with Mexico, Canada, and China, particularly for manufactured goods and agricultural products that employ Californians across the state. Over 40% of California imports come from Mexico, Canada, and China. Imports from these countries were $203.3 billion of the total $491.5 billion California imported in 2024. Retaliatory tariffs will impact California businesses and exporters. Mexico, Canada, and China are California’s top 3 export destinations. Tariffs also hurt builders. The tariffs will affect access to important construction materials critical to rebuilding after the Los Angeles fires. Economy, News, Recent News body p, body ul, body .whattoknow p { font-size: clamp(1rem, var(--base), 5rem); line-height: 1.5; } #category-container .et_pb_title_meta_container:before { content: 'Categories: '; font-weight: normal; color: #000; } #category-container .et_pb_title_meta_container a { text-decoration: underline; } #category-container .et_pb_title_meta_container a:hover { color: var(--navigation-hover-light) !important; text-decoration: underline; } .et_pb_gutters3 .et_pb_column_1_3 .et_pb_module, .et_pb_gutters3.et_pb_row_inner .et_pb_column_1_3 .et_pb_module, .et_pb_gutters3 .et_pb_column_1_3 .et_pb_widget { margin-bottom: 0; } .et_pb_title_container h1 { font-size: var(--h1); } @media (max-width: 1279px) { #main-content .quote { padding-left: 1em; } } @media (max-width: 980px) { .et_pb_module.et_