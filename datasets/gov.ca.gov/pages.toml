description = "The priorities of the Newsom Administration, and the progress we have made supporting them."
full_description = "Priorities & Progress Priorities & Progress Working towards a better life for all Californians deserve a government that works for them and with them. One that will work to ensure opportunity and justice. This is the goal of the Newsom Administration. We are informed by our history as a state and nation. We are building a California not for the few, but for all — including those who have historically been left out. We are doing the work to make our state a place for every Californian and all the diversity that makes us strong. Our state will be known as a place where everyone is respected, protected, and connected. Priorities Focusing on the issues Californians care about most Progress Driving change, delivering results"
