["https://gov.ca.gov/priorities-and-progress/priorities/health-care"]
title = "Health care | Governor of California"
description = "Here’s how the Newsom Administration is making better health care available to all Californians."
full_description = "Priorities Health care Here’s how we’re making better health care available to all Californians. Affordable health care for all We are one of the first states in the nation to offer health care to everyone with low incomes. We did this through an expansion of Medi-Cal. You can get this medical care, no matter your immigration status. California is also lowering health care costs, including for prescription drugs and insulin. And we are increasing access to high-quality health care providers. More about affordable health care Transforming behavioral health California is making behavioral health services more available to all, especially our youth. We’re investing in our health care workers and building housing and treatment sites. We’re getting more help to those challenged with mental illness and substance abuse. And we’ve started a nation-leading program called CARE Court. It helps get people off the streets, out of jails and hospitals, and into treatment, with the support they need. More about mental health care for all Safeguarding reproductive health Radical politicians are assaulting women’s health care with dangerous and deadly consequences. But California is protecting women. Governor Newsom has taken action, including signing more than 20 laws to support and expand abortion care. He led the successful push to have the right to reproductive freedom added to California’s constitution. We will protect women who seek basic care and the health care workers who provide it. More about California abortion access News about health care Governor Newsom announces stronger accountability measures, launches new tool measuring local progress in tackling homelessness Feb 24, 2025News Releases $920 million in additional homelessness funding What you need to know: Governor Newsom today announced stronger accountability measures to hold local governments accountable if they fail to make progress in addressing homelessness. The Governor also... Governor New