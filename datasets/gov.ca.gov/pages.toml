w: Local community leaders are praising Governor Newsom’s announcement this week of new financial investments to help boost LA’s economic recovery, as well as the launch of California’s Economic Blueprint and the Los Angeles County Jobs First... Governor Newsom announces executive staff transitions with appointments of Nani Coloretti, Ann Patterson Feb 28, 2025News SACRAMENTO – Governor Gavin Newsom today announced the appointment of Nani Coloretti as his new Cabinet Secretary and expressed deep gratitude to departing Cabinet Secretary Ann Patterson for her six years of exemplary service. Patterson, who had planned to step... Governor Newsom announces appointments 2.27.25 Feb 27, 2025News SACRAMENTO – Governor Gavin Newsom today announced the following appointments:Aaron Maguire, of Roseville, has been appointed Executive Officer of the Board of State and Community Corrections, where he has been Acting Executive Officer at the Board of State and... Governor Newsom partners with 21 Brazilian state governors to protect the environment, cut harmful pollution Feb 27, 2025News SACRAMENTO – California and a consortium of 21 Brazilian states are partnering together to combat pollution and foster sustainable economic growth. Governor Gavin Newsom and Governor Renato Casagrande of the Brazilian state of Espírito Santo signed a Memorandum... Featured stories With growing fire risk, Governor Newsom proclaims state of emergency to fast-track critical wildfire prevention projects statewide Mar 1, 2025News What you need to know: Governor Newsom is proclaiming a state of emergency to fast-track critical forest management projects – part of the state’s ongoing efforts to protect communities from catastrophic wildfire. SACRAMENTO – Following the devastation of the Los... Governor Newsom announces stronger accountability measures, launches new tool measuring local progress in tackling homelessness Feb 24, 2025News Releases $920 million in additional homelessness funding What you need to know: Governor Newsom today announced stronger accountability measures to hold local governments accountable if they fail to make progress in addressing homelessness. The Governor also... Here are all the actions Governor Newsom has taken in response to the Los Angeles fires Jan 24, 2025News See actions by dayLaunched historic recovery and rebuilding efforts — faster than ever before Cutting red tape to help rebuild Los Angeles faster and stronger. Governor Newsom issued an executive order to streamline the rebuilding of homes and... More news Featured media February 13, 2025 | XOur federal, state, and local partners have moved at a record pace to assess damage... February 20, 2025 | InstagramI met with owners Perry and Melanie from @PerrysJoint cafe in Pasadena...February 15, 2025 | InstagramGrateful for the tireless work of the Southern California emergency response teams...February 24, 2025 | XWe're launching a new platform to bring Californians together to engage, interact, and share ideas... Priorities for California We’re taking on our biggest challenges and finding solutions that work. See what we’re working on PrioritiesTackling homelessness and building more housing PrioritiesKeeping California safe PrioritiesCreating opportunity for all Californians PrioritiesA healthier California Progress in our communities Since 2019, California has made progress to improve lives of millions. See our progress ProgressThe most ambitious climate action plan in the world ProgressInvesting in workers and families ProgressBetter mental health care for all Californians California For All California For All is the belief in an inclusive and just society. That we can achieve a better life, regardless of where we start out. That our people are our greatest resource. And that we can renew the California Dream for a new generation. California is working hard to protect our rights and freedoms. Together, we’re creating a stronger, healthier, and more prosperous future for all. GovernorGavin Newsom Gavin Newsom is the Governor of California. He previously served as Lieutenant Governor of California and Mayor of San Francisco. He was sworn into office on January 7, 2019. About the Governor First PartnerJennifer Siebel Newsom Jennifer Siebel Newsom is the First Partner of California. She is an award-winning filmmaker, advocate, and mother of four. She chose the title First Partner instead of First Lady to reflect California’s spirit of inclusivity. About the First Partner Connect with us Sign up for updates Please enable JavaScript in your browser to complete this form.Please enable JavaScript in your browser to complete this form.Email *Subscribe Share your California storyStories connect people in our state. What’s your story? We want to hear from you!Share your story .homepage-priority-container h3, .scroll-animation h2 { font-size: var(--h1, 4rem); } h3 &gt; strong { color: var(--action-alt, #F26522); display: block; } .homepage-priority-container .arrow-right-orange { background: none; } .homepage-priority-container a.arrow-right-orange { display: block; } .homepage-priority-container .arrow-right-orange::after { background-size: 0.9em !important; background-image: url('data:image/svg+xml,<svg width="51" height="52" viewBox="0 0 51 52" xmlns="http://www.w3.org/2000/svg"><path d="M20.3714 6.55355L36.3179 22.5H1H0.5V23V29V29.5H1H36.3179L20.3714 45.4464L20.0148 45.8031L20.3746 46.1567L24.6496 50.3567L25.0031 50.704L25.3536 50.3536L49.3536 26.3536L49.7071 26L49.3536 25.6464L25.3536 1.64645L25.0031 1.29601L24.6496 1.64333L20.3746 5.84333L20.0148 6.19686L20.3714 6.55355Z" /></svg>'); content: ""; display: inline-block; height: 1em; width: 1em; margin-inline-start: 1rem; background-repeat: no-repeat; vertical-align: middle; } h3 &gt; a { color: var(--brand-primary, #20367C); } h3 &gt; a:hover { color: var(--brand-hover-dark, #0073a5); } .homepage-priority-container .et_pb_text_inner p { font-size: var(--h4); margin-block-end: 1rem; } .homepage