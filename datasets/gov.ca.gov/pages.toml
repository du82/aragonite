["https://gov.ca.gov/priorities-and-progress/priorities/public-safety"]
title = "Public safety | Governor of California"
description = "Here’s how initiatives from the Newsom Administration are keeping California safe."
full_description = "Priorities Public safety Here’s how we’re keeping California safe. Cracking down on property crime The Governor is cracking down on professional thieves. California made the largest-ever state investment to combat organized retail crime. Now, the Governor is going further by calling for new laws that give new tools to police and prosecutors. They will help prevent smash-and-grabs, retail theft, and car burglaries. More about property crime laws Fighting gun violence California leads the nation with gun safety laws that work: universal background checks, 10-day purchase waiting periods, mental health reporting, requiring most gun buyers to be 21 years and older, allowing people to sue those who illegally distribute assault weapons and ghost guns, red flag laws, and an assault weapons ban. More about gun safety Tackling the fentanyl crisis Governor Newsom has a master plan for tackling the crisis caused by fentanyl and opioids. It’s an approach that will save lives. It builds on a historic investment with funds for more treatment. It also expands California National Guard actions against drug trafficking. These actions have helped seize 1,066% more fentanyl since 2021. More about fighting fentanyl News about public safety California seizes $534 million in illegal cannabis in 2024 Mar 4, 2025News What you need to know: California enforcement officials have seized an estimated retail value of $534 million of unlicensed cannabis in 2024. Since 2019, officials have seized approximately $2.8 billion in illegal cannabis. Sacramento, California – Reinforcing... Governor Newsom grants executive clemency Feb 26, 2025News SACRAMENTO – Governor Gavin Newsom today announced multiple clemency actions. He granted pardons in three cases. He also sent multiple clemency cases to the Board of Parole Hearings, initiating the process for granting clemency in fifteen cases. He also sent two... $300 million of illicit fentanyl seized in California since 2023 Feb 19, 2025News State continues raising awareness of dangerous drug What you need to know: California is using a multifaceted approach to tackle illicit fentanyl, including seizing nearly $300 million of illicit fentanyl since 2023 and increasing public education in schools... « Older Entries"
