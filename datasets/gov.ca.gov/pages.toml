title = "First Partner Jennifer Siebel Newsom | Governor of California"
description = "Jennifer Siebel Newsom is the First Partner of California, award-winning filmmaker, advocate, and mother of four."
full_description = "About the Governor First Partner Jennifer Siebel Newsom First Partner of California, award-winning filmmaker, advocate, and mother of four Jennifer Siebel Newsom is the First Partner of California, an award-winning filmmaker, and an influential thought leader on gender equality. Through her California for ALL Kids campaign, she is championing initiatives to support children’s mental and physical health, as well as provide families with the tools to build a solid learning foundation. And through her California for ALL Women campaign she’s making strides to build economic equity, equal representation, and advance a family-first agenda. Jennifer Siebel Newsom chose the title First Partner, as opposed to the traditional title of First Lady, to send a signal of inclusivity, recognizing that one day there will be a woman or LGBTQ+ Governor of California, and to elevate the importance of partnership and the need for, and benefits of, a caring, inclusive government. Learn more about Jennifer Siebel Newsom California for All Women We are dedicated to furthering the cause of gender equity in California, and lifting up women and their families by ensuring that women can thrive both at work and at home. California for All Kids California For All Kids is about putting children on a path to a healthier future by focusing on their minds, bodies, and environments. From Me to We We work to create a culture of selflessness and community, a culture that values WE over me and taps into our common humanity through service and empathy. California Partners Project First Partner Jennifer Siebel Newsom co-founded The California Partners Project, an organization focused on increasing women’s representation in leadership in California, and ensuring that our state’s media and technology industries are a force for good in the lives of all children. The California Partners Project is a nongovernmental organization, and its website is not an official government website. For in