["https://gov.uk/check-national-insurance-record"]
title = "Check your National Insurance record - GOV.UK"
description = "Find out if you've paid enough National Insurance to qualify for the full State Pension - check gaps, contributions and credits, get a National Insurance statement, call the helpline."
full_description = "Check your National Insurance record You can check your National Insurance record online to see: what you’ve paid, up to the start of the current tax year (6 April 2024) any National Insurance credits you’ve received if gaps in contributions or credits mean some years do not count towards your State Pension (they are not ‘qualifying years’) if you’ll benefit from paying voluntary contributions to fill any gaps how your State Pension forecast will change if you decide to pay voluntary contributions if you can pay voluntary contributions online and how much this will cost This service is also available in Welsh (Cymraeg). Start now Before you start You’ll need to sign in to check your National Insurance record. If you do not already have sign in details, you’ll be able to create them. You’ll be told when you sign in if you need to prove your identity. This is to keep your details safe and normally involves using photo ID like a passport or driving licence. Other ways to apply You can request a printed National Insurance statement: online, if you live in the UK online or by post, if you live abroad by phone You’ll need to say which years you want your statement to cover. You cannot request statements for the current or previous tax year. You can also write to HM Revenue and Customs (HMRC). PT Operations North East EnglandHM Revenue and CustomsBX9 1AN If you’ve paid National Insurance in the Isle of Man Your record will not show National Insurance contributions from the Isle of Man if you reach State Pension age after 5 April 2016. Email the National Insurance office in the Isle of Man to find out how much you’ve paid. Isle of Man National Insurance office nationalinsurance.itd@gov.im You can also write to the office. National Insurance contributionsIncome Tax DivisionGovernment OfficeBucks RoadDouglasIsle of ManIM1 3TX Related content National Insurance: introduction National Insurance credits Voluntary National Insurance Find your National Insurance number Collection National Insurance: detailed information Explore the topic National Insurance"
