title = "Check the MOT history of a vehicle - GOV.UK"
description = "Check the MOT history of a vehicle from 2005 onwards, including if it passed or failed, its mileage and why it failed, download MOT test certificate"
full_description = "Check the MOT history of a vehicle Check the past results of a vehicle’s MOT tests, including: if it passed or failed the mileage recorded when it was tested You can also: check when the next MOT is due download a copy of the current and previous MOT certificates If you got your test in England, Scotland or Wales You’ll also be able to see: where each test was done - you’ll need the 11-digit number from the vehicle’s log book (V5C) what parts failed at each test, and if any parts had minor problems Your MOT history may also tell you if your vehicle has been recalled for a safety reason, depending on the manufacturer. You can also check if a vehicle model, part or accessory has been recalled. Which test results you can get For cars, motorcycles and vans you can only get results for tests done since 2005. For HGVs, trailers, buses and coaches you can only get results for tests done since 2018. If you got your test in Northern Ireland You can only get results for tests done since 2017. Check a vehicle’s MOT history You’ll need the vehicle’s number plate (registration number). Start now Part of Buy a vehicle: step by step Get an annual test (MOT) for a lorry, bus or trailer: step by step Related content Check the MOT status of a vehicle Get MOT reminders Check a used vehicle you’re buying Tax your vehicle Check if a vehicle is taxed Explore the topic Vehicle and driver data and information Vehicle tax, MOT and insurance"
