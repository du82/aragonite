full_description = "Government Digital Service GovernmentDigital Service Part of Department for Science, Innovation and Technology Featured Launching the Artificial Intelligence Playbook for the UK Government 10 February 2025 — Blog post Read more about GDS’s AI Playbook to provide the public sector with accessible technical guidance on the safe and effective use of AI. Same name, new ambitions 27 January 2025 — Blog post A new chapter begins. We unveil the name and vision for the new digital centre for government. A blueprint for modern digital government 21 January 2025 — Policy paper A long-term vision for digital public services, a 6-point plan for reform, and the role of the new digital centre of government. State of digital government review 21 January 2025 — Research and analysis A review of technology and data in the public sector: successes, challenges and root causes. Digital driving licence coming this year 21 January 2025 — Press release The UK government is launching a GOV.UK Wallet and App to simplify access to services and documents like digital driver’s licences, alongside reforms to public sector technology to save £45 billion and drive efficiency and growth. Shake up of tech and AI usage across NHS and other public services to deliver plan for change 21 January 2025 — Press release The government has announced a new plan to leverage technology and AI tools like “Humphrey” to streamline public services, eliminate delays through improved data sharing, and reduce costs, including consultant spending. Latest from the Government Digital Service Deleting your GOV.UK One Login 27 February 2025 Guidance Changing the sign in details for your GOV.UK One Login 27 February 2025 Guidance RPA: Flood Extent Classification 27 February 2025 Algorithmic Transparency Record See all latest documents Subscriptions Get emails What we do We are the digital centre of government. We serve the public, central government departments and the wider public sector. GDS is part o