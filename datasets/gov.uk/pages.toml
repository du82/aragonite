["https://gov.uk/prove-right-to-work"]
title = "Prove your right to work to an employer: Overview - GOV.UK"
description = "Find out how to prove your right to work in the UK to an employer. Get an online share code to prove your right to work if you’re eligible or check what documents you can use instead."
full_description = "Prove your right to work to an employer Skip contents Contents Overview Get a share code online Using immigration documents Overview You’ll need to prove your right to work in the UK to your employer before you start working for them. How you do this depends on your nationality and what kind of permission you have to work in the UK. If you’re a British or Irish citizen If you’re a British or Irish citizen, you can prove your right to work in the UK with either of the following: a British passport an Irish passport or passport card Your passport or passport card can be current or expired. If you do not have a passport or passport card, you can prove your right to work with one of the following: a UK birth or adoption certificate an Irish birth or adoption certificate a certificate of registration or naturalisation as a British citizen You must also give your employer an official letter or document from a previous employer or a government agency. For example, you could use a letter from HM Revenue and Customs (HMRC), the Department for Work and Pensions (DWP) or the Social Security Agency in Northern Ireland. The letter must show your name and National Insurance number. If you have a passport or passport card, you may be able to use an online identity service provider (IDSP) to prove your right to work. Ask your employer if they offer this. If you’re not a British or Irish citizen If you’re not a British or Irish citizen, you can prove your right to work with: a share code - you can get a share code online your eligible immigration documents You can choose which option you use. Your employer cannot reject your application because you gave them an eligible immigration document instead of a share code, for example. If you cannot prove your right to work If you’re not a British or Irish citizen, your employer can check if you can work with the employer checking service. If you’re a Commonwealth citizen, you may be able to get documents to show that you can work in the UK through the Windrush Scheme. Next : Get a share code online View a printable version of the whole guide Related content Check if a document allows someone to work in the UK Checking a job applicant's right to work Checks employers can make on job applicants Job offers: your rights Explore the topic Living in the UK, government and democracy What you need to do Work in the UK Finding a job"
year_published = 2025
clearnet = "https://gov.uk/prove-right-to-work"
