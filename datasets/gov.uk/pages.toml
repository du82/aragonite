description = "Find out what benefits you could get, how much you could get and how to claim"
full_description = "Benefits calculators You can use an independent, free and anonymous benefits calculator to check what you could be entitled to. This will give you an estimate of: the benefits you could get how much your benefit payments could be how your benefits will be affected if you start work or increase your hours how your benefits will be affected if your circumstances change - for example, if you have a child or move in with your partner This guide is also available in Welsh (Cymraeg). Calculators For information on income-related benefits, contribution-based benefits, Universal Credit, tax credits, Council Tax Reduction and Carer’s Allowance use: entitledto benefits calculator Turn2us benefits calculator Policy in Practice better off calculator You can also check with a local benefits adviser to find out what you could be entitled to. What you’ll need You’ll need accurate information about your: savings income, including your partner’s (from payslips, for example) existing benefits and pensions (including anyone living with you) outgoings (such as rent, mortgage, childcare payments) Council Tax bill Who cannot use them You cannot use the calculators if you’re under 18, and they will not give accurate results if you’re: a prisoner a student not a British or Irish citizen on strike living outside the UK living permanently in residential care or a nursing home Related content Child Benefit Housing Benefit Check benefits and financial support you can get Employment and Support Allowance (ESA) Jobseeker's Allowance (JSA) Show 2 more Universal Credit and Benefit cap Collection Universal Credit: information for employers Universal Credit: information for landlords Universal Credit: information for stakeholders and partners Explore the topic Benefits and financial support for families Benefits and financial support if you're caring for someone Benefits and financial support if you're disabled or have a health condition Benefits and financial support if you're l