["https://gov.uk/get-access-evisa"]
title = "Get access to your online immigration status (eVisa) - GOV.UK"
description = "Set up a UKVI account and access your eVisa."
full_description = "Get access to your online immigration status (eVisa) An eVisa is an online record of: your immigration status the conditions of the type of permission you have to enter or stay in the UK To get access to your eVisa you need to create a UK Visas and Immigration (UKVI) account. Once you have access to your eVisa, you can sign in to your UKVI account to view your eVisa and prove your immigration status. Using an eVisa does not affect your immigration status or the conditions for you to enter or stay in the UK. If you have a wet ink stamp or vignette sticker that shows that you have settlement in the UK with no expiry date (for example, indefinite leave to remain) you can either: continue to use the stamp or sticker choose to get access to an eVisa - this is known as a ‘no time limit application’ Create a UKVI account to get access to your eVisa To access your eVisa you must have permission to stay in the UK: for longer than 6 months which was granted in England, Scotland, Wales or Northern Ireland (not the Channel Islands or Isle of Man) You cannot get access to an eVisa if you: have a visa for less than 6 months, such as a visitor visa have an EU Settlement Scheme family permit have an electronic travel authorisation (ETA) are exempt from immigration control, including if you’re a diplomat or have ‘right of abode’ Start now Before you start You’ll need to give a phone number and email address you can use again. You’ll use them each time you prove your immigration status online. You’ll also need one of the following, if you have them: a valid passport and your visa application number - this is a global web form (GWF) number or unique application number (UAN) a valid passport and your biometric residence permit (BRP) number your BRP card - this can be expired If you do not use your passport to get access to your eVisa, you’ll need to update your UKVI account with your passport details before you can use your eVisa to travel to the UK. If you have either a valid passport or a BRP card, you’ll need access to a smartphone so that you can install an app to confirm your identity. Get access to your eVisa if you have settlement If you’re making a no time limit application you’ll also need: your settlement document, for example a passport containing a stamp or vignette sticker the passport or travel document you used when you most recently entered the UK It can take up to 6 months to get your eVisa. You can continue to use your document to travel until you get it. Helping someone else You can help someone else to create their UKVI account, for example, your child or someone who cannot use the internet. You can manage their account for them if you’re acting on their behalf, for example if you have power of attorney. Get help Contact UK Visas and Immigration to get: help with your UKVI account guidance about how to access your eVisa Report an error with your eVisa if: the details on your eVisa are wrong you cannot view your eVisa when you sign in to your UKVI account You can get additional help if you’re in the UK and either: you do not have access to the internet or do not feel confident using it you’re vulnerable If you do not have access to the internet or do not feel confident using it You can get help setting up access to your eVisa if you: do not feel confident using a computer or mobile device do not have internet access do not have access to a device like a laptop or smart phone If you’re vulnerable You can get help setting up access to your eVisa if you’re vulnerable, for example if you: are elderly are isolated are disabled are a child in care have significant language or literacy problems have mental health issues do not have a permanent address are in an abusive or controlling relationship, or are experiencing domestic violence are the victim of human trafficking Part of Apply for a Parent of a Child Student visa: step by step Study in the UK on a Student visa Apply for a Short-term study visa: step by step Study in the UK on a Child Student visa Related content Update your UK Visas and Immigration account details View and prove your immigration status: get a share code Explore the topic What you need to do"
