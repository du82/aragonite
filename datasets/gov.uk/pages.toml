["https://gov.uk/get-a-passport-urgently"]
title = "Get a passport urgently - GOV.UK"
description = "Renew or replace a passport urgently with the 1 day Premium service or the 1 week Fast Track service."
full_description = "Get a passport urgently You can pay to get a passport urgently if you think the standard service will take too long. Use this online service to apply, pay and book an appointment at a passport office. You can book an appointment up to 3 weeks in advance. Passport office appointments last up to 10 minutes. If you need to travel urgently for medical treatment, on government business, or because a friend or family member is seriously ill or has died, call the Passport Adviceline instead. Ways to apply There are 2 ways to apply for an urgent passport. 1 day premium The earliest you can get an appointment is 2 days after you apply. You’ll need to hand in your old passport at your appointment. Your new passport will be ready to collect from the passport office 4 hours after your appointment. You can only use this service to renew an adult passport. It costs £207.50 (or £219.50 for a 54-page frequent traveller passport). 1 week fast track The earliest you can get an appointment is the next day after you apply. Your new passport will be delivered to you by courier 1 week after your appointment. You can use this service to: renew a passport change personal details on your passport (for example your name, place of birth or gender) replace a lost, stolen or damaged passport get a child passport It costs: £166.50 for an adult passport (or £178.50 for a 54-page frequent traveller passport) £135.50 for a child passport (or £147.50 for a 54-page frequent traveller passport) Apply online You’ll be asked some questions to work out what services you’re eligible for. You can then book an appointment, apply and pay. You’ll need: your old passport (if you have one) a digital photo of you a credit or debit card Start now When you cannot apply You cannot use this service if: you’re applying for a first adult passport - use the standard service instead you’re outside the UK - apply for an emergency travel document instead If you’ve already applied for a passport and have not received it yet, do not pay for an urgent passport. You will not get your passport sooner and you will be charged a £30 admin fee for each additional application. Change or cancel your appointment To change your appointment, follow the guidance in your confirmation email. It’s free if your appointment is more than 48 hours away. If your appointment is less than 48 hours away, you’ll need to cancel it instead and book again. To cancel your appointment and get a refund, call the Passport Adviceline. You’ll be charged a £30 admin fee if your appointment is less than 48 hours away. If you miss your appointment, you will not get a refund. You’ll have to book and pay again. Send someone in your place You can ask someone else to go to your appointment for you. They’ll need to bring your application reference number, which starts with ‘PEX’. You’ll find this on your confirmation email and in any text messages you get about your appointment. If you used the 1 day premium service, they’ll also need to bring: your old passport a signed and dated letter from you, naming them and giving them permission to collect the new passport their ID, for example a passport or driving licence If you used the 1 week fast track service, they’ll also need to bring: your old passport (if you have one) any documents you were told to bring in the service Related content Renew or replace your adult passport Get a passport for your child Getting your first adult passport Cancel a lost or stolen passport Passport services if you're disabled Explore the topic Passports"
year_published = 2025
clearnet = "https://gov.uk/get-a-passport-urgently"
