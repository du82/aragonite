["https://gov.uk/self-assessment-tax-returns"]
title = "Self Assessment tax returns: Overview - GOV.UK"
description = "Self Assessment tax returns - deadlines, who must send a tax return, penalties, corrections and returns for someone who has died."
full_description = "Self Assessment tax returns Skip contents Contents Overview Who must send a tax return Registering for Self Assessment Sending a return If you no longer need to send a tax return Deadlines Penalties If you need to change your return Claiming a tax refund How to get help Returns for someone who has died Overview Self Assessment is a system HM Revenue and Customs (HMRC) uses to collect Income Tax. Tax is usually deducted automatically from wages and pensions. People and businesses with other income must report it in a Self Assessment tax return. If you need to send a Self Assessment tax return, fill it in after the end of the tax year (5 April) it applies to. You must send a return if HMRC asks you to. You may have to pay interest and a penalty if you do not file and pay on time. This guide is also available in Welsh (Cymraeg). Sending your return You can file your Self Assessment tax return online. If you need a paper form you can: download the SA100 tax return form call HMRC and ask for the SA100 tax return form Deadlines Send your tax return by the deadline. You must tell HMRC by 5 October if you need to complete a tax return and you have not sent one before. You could be fined if you do not. You can tell HMRC by registering for Self Assessment. Check how to register for Self Assessment. Filling in your return You need to keep records (for example bank statements or receipts) so you can fill in your tax return correctly. You can get help filling in your return. Paying your bill HMRC will calculate what you owe based on what you report. Pay your Self Assessment bill by 31 January. How much tax you pay will depend on the Income Tax band you’re in. There’s a different rate for Capital Gains Tax if you need to pay it, for example you sell shares or a second home. Next : Who must send a tax return View a printable version of the whole guide Related content File your Self Assessment tax return online Understand your Self Assessment tax bill Pay your Self Assessment tax bill Collection Self Assessment: detailed information Income Tax: detailed information Self-employment: detailed information Explore the topic Income Tax Self Assessment"
year_published = 2025
