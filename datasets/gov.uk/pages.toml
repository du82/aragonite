["https://gov.uk/personal-tax-account"]
title = "Personal tax account: sign in or set up - GOV.UK"
description = "Sign into or set up a personal tax account to check and manage HMRC records, including Income Tax, change of address, Self Assessment and company car tax."
full_description = "Personal tax account: sign in or set up Use your personal tax account to check your records and manage your details with HM Revenue and Customs (HMRC). This service is also available in Welsh (Cymraeg). You can: check your Income Tax estimate and tax code submit, view or manage a Self Assessment tax return claim a tax refund check your Child Benefit check your income from work in the previous 5 years check how much Income Tax you paid in the previous 5 years check and manage your tax credits check your State Pension check if you’ll benefit from paying voluntary National Insurance contributions and if you can pay online track tax forms that you’ve submitted online check or update your Marriage Allowance tell HMRC about a change of name or address check or update benefits you get from work, for example company car details and medical insurance find your National Insurance number find your Unique Taxpayer Reference (UTR) number, if you already have one check your Simple Assessment tax bill There’s a different service to register for Self Assessment and your UTR number or report and pay Capital Gains Tax on UK property. Before you start You’ll need to sign in to use this service. If you do not already have sign in details, you’ll be able to create them. You’ll be told when you sign in if you need to prove your identity. This is to keep your details safe and normally involves using photo ID like a passport or driving licence. Sign in to or set up your personal tax account Start now Related content HMRC online services: sign in or set up an account Check your Income Tax for the current year Tax codes Contact HMRC Self Assessment tax returns Collection Income Tax: detailed information Explore the topic Dealing with HMRC Income Tax"
