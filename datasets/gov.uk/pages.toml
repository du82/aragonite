["https://gov.uk/log-in-file-self-assessment-tax-return"]
title = "File your Self Assessment tax return online - GOV.UK"
description = "Sign in and send your Self Assessment tax return online."
full_description = "File your Self Assessment tax return online You can file your Self Assessment tax return online if you: are self-employed are not self-employed but you still send a tax return, for example because you receive income from renting out a property This service is also available in Welsh (Cymraeg). You can also use the online service to: view returns you’ve made before check your details print your tax calculation sign up for paperless notifications If you did not file a tax return last year You must register for Self Assessment before using this service if: you’re filing for the first time you’ve sent a tax return in the past but did not send one last tax year Check how to register for Self Assessment. When you cannot use this service You cannot use this service to file your tax return online: for a partnership for a trust or for an estate if you lived abroad as a non-resident to report multiple ‘chargeable gains’, for example from life insurance if you get income from a trust, you’re a Lloyd’s underwriter or a religious minister Use commercial software or download or request other forms instead. If you’re sending an SA100 tax return for the 2022 to 2023 tax year or earlier, get forms from the National Archives. Sign in to file your tax return You’ll need to sign in to use this service. If you do not already have sign in details, you’ll be able to create them. You’ll also need your Unique Taxpayer Reference (UTR) number. You do not have to complete your return in one go. You can save your entry and go back to it later if you need to. Sign in Prove your identity to use this service You’ll be told if you need to prove your identity when you sign in. This is to keep your details safe and usually involves using photo ID like a passport or driving licence. Related content Pay your Self Assessment tax bill Self Assessment tax returns Self Assessment tax return forms Help online with Self Assessment HMRC email updates, videos and webinars for Self Assessment Check if you need to send a Self Assessment tax return Collection Self-employment: detailed information Self Assessment: detailed information Explore the topic Self Assessment"
