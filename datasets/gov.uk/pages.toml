["https://gov.uk/sign-in-childcare-account"]
title = "Sign in to your childcare account - GOV.UK"
description = "If you're a parent registered for Tax-Free Childcare or free childcare if you're working, sign in to pay into your account, reconfirm your eligibility, update your details."
full_description = "Sign in to your childcare account Use this account to get free childcare if you’re working or pay for your Tax-Free Childcare. To keep getting free childcare if you’re working or Tax-Free Childcare, you must sign in every 3 months and confirm your details are up to date. If you want to get free childcare if you’re working or Tax-Free Childcare and you’re from an EU country, Switzerland, Norway, Iceland or Liechtenstein, you need settled or pre-settled status or permission to access public funds. If you’re eligible for free childcare if you’re working, sign in to get a code to give to your childcare provider. If you’ve registered for Tax-Free Childcare, sign in to: pay money into your account pay your childcare provider apply for a new child You’ll need to sign in to use this service. If you do not already have sign in details, you’ll be able to create them. This service is also available in Welsh (Cymraeg). Sign in Before you start You sign in to your account in a different way if you’re a childcare provider. If you’ve been unable to use the service You may be able to claim compensation if you’ve had technical problems with your account. Part of Get Tax-Free Childcare: step by step Get free childcare if you're working: step by step Get childcare: step by step Related content Help paying for childcare Explore the topic Manage an existing benefit, payment or claim Childcare"
