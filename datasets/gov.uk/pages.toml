["https://gov.uk/student-finance-register-login"]
title = "Student finance login - GOV.UK"
description = "Your student finance online account - check payment dates, track an application, change details, reset password, find customer reference numbers"
full_description = "Student finance login Use your student finance account to: view statements and letters from Student Finance England (SFE) track an existing application check when your payments are due update some of your personal or application details reset your password or find your customer reference number apply for finance as a new or continuing student You can also use this service if you’re supporting a student finance application and SFE has asked for details of your household income. Sign in on the Student Finance England website Before you start You’ll be given a customer reference number (CRN) and asked to create a password and secret answer when you first set up your account. You’ll get a letter telling you how to sign in to your account, if you do not apply online. You need your CRN or email and your password each time you sign in. Recover your sign in details online. Other ways to apply If you cannot apply online, use the form finder to get the forms you need. You can call Student Finance England if you want to apply online but you cannot use a computer without help. Part of Get undergraduate student finance: step by step Step 1: Check if you're eligible Check if you're eligible for student finance There’s a different process if you’re a student from: Scotland Wales Northern Ireland Jersey Guernsey Isle of Man Step 2: Find out how much loan you could get Find out the maximum tuition fee and maintenance loan you could get if you're a: new full-time student continuing full-time student part-time student student who started before 1 August 2016 How much maintenance loan you get depends on where you'll study and your household income. Use the student finance calculator to estimate your maintenance loan You'll have to pay back any loan you get. Find out how much you'll repay Find out when you'll start repaying and Check if you can get extra help You might be able to get extra money if you: are under 25, have no contact with your parents and support yourself pay for childcare are a full-time student with children have an adult who depends on you financially have a disability, mental or physical health problem or learning difficulty like dyslexia You might also be able to get other financial help, for example from your university or the government. Find out about extra help Step 3: Prepare your application Check when you can apply Check what ID you'll need Check if you need to give proof of your household income Step 4: Apply online Apply online If you're eligible for Tuition Fee Loans, Maintenance Loans, or Maintenance Grants, you can apply online. You'll need to create a student finance account if you're a new student or sign into an existing account if you're a returning student. It can take up to 6 weeks to process your application. You might have to provide extra evidence. or Apply by post Apply by post If you’re eligible for tuition fee-only funding, you must complete a form and send it by post instead. You cannot apply online. You can also apply by post if you're unable to apply online. It can take up to 6 weeks to process your application. You might have to provide extra evidence. Step 5: Update your details if your circumstances change You must update your application if your circumstances change. For example if you: change your course through clearing change where you're going to live - for example with your parents instead of halls Find out how to update your application Step 6: Make sure you can be paid After you register at your university or college you'll usually get your maintenance loan paid directly into your bank account at the start of each term. Use your student finance account to: update your bank details - for example if you open a student account check how much you'll be paid check when you'll be paid You are currently viewing: Sign in to your student finance account Step 7: Check what to do while you're studying You'll need to reapply for student finance for each year of your course. You must keep your details up to date throughout your course because some changes can affect your loan payments, for example if your household income or bank details change. Check how to update your details Find out what to do if you suspend or leave your course Step 8: Check what to do when you stop studying When you stop studying the Student Loans Company (SLC) will create a student loans repayment account for you. The log in details will be the same as for your student finance account. You should check your contact details are correct. Sign in to your student loan repayment account You must update your employment details if: you leave the UK for more than 3 months SLC asks you to update them Update your employment details Step 9: Repay your loan The repayment plan you're on will determine when you start repaying and how much you repay. Check which repayment plan you’re on Find out how much you'll repay Find out when you'll start repaying Find out how to repay"
year_published = 2025
