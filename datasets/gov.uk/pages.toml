["https://gov.uk/how-the-post-office-check-and-send-service-works"]
title = "Passport Check and Send service - GOV.UK"
description = "How to use the Post Office passport Check and Send service for passport applications and renewals, what it costs, where you can use the service."
full_description = "Passport Check and Send service Some Post Offices can check your passport application - called ‘Check and Send’. It’s less likely that your application will be rejected if you use Check and Send. Look up a Post Office that offers the Check and Send service. From the drop down list, choose: ‘Passport Check and Send - digital’ if you want Post Office staff to take your photo and help you fill out your application online ‘Passport Check and Send - paper’ if you’re applying with a paper form How much it costs Digital Check and Send includes the cost of the photo. It costs £16.00 on top of the passport application fee. Paper Check and Send does not include the cost of the photo. It costs £16.00 on top of the passport application fee and the cost of your photos. The Check and Send service is free if you qualify for a free passport. How to pay You can pay using: cash credit or debit card postal order (payable to ‘Post Office Limited’) Getting a refund You can only get a refund if HM Passport Office sends you a letter to say that the Post Office made a mistake with your application. The letter will tell you how you can ask the Post Office for a refund. You cannot get a refund if your application is rejected. Making a digital application The Post Office will take your photo and help you to fill in your application online. What you need to bring depends on what type of application you’re making. If you’re renewing or replacing a passport You must bring your old passport to the Post Office if you still have it. If you’ve changed your name, you’ll also need to bring proof of your new name (like a marriage certificate). If your passport is lost, you’ll also need the name and email address of someone who can confirm your identity. If you’re applying for your first adult passport You will need to give the email address of someone who can confirm your identity. You’ll also need your parents’ details, including their: names, dates and places of birth nationality UK passport details, if they have them details of their marriage or civil partnership, if they had one If you’re applying for someone under 16 You’ll need to give both of their parents’ details, including their: names, dates and places of birth nationality UK passport details, if they have them details of their marriage or civil partnership, if they had one If you cannot provide both parent’s details, you need to say why (for example, you’re the only parent named on the birth certificate or you adopted the child on your own). You’ll also need the email address of someone who can confirm the child’s identity unless you’re renewing a passport for a child who is 12 or over and you have the child’s old passport with you. What happens next You’ll get email and text updates from HM Passport Office at each stage of the application process, and you can track it online. Using the Check and Send service does not guarantee your passport application will be successful. Making a paper application You should take your completed paper application form, photos and any supporting documents to the Post Office. The Post Office Check and Send service will check you’ve: filled in the right sections of the paper form got the right supporting documents (including photos) paid the right fee They will send your application to HM Passport Office by Special Delivery. Using Check and Send is usually faster than posting your own application. HM Passport Office may still need to contact either you or your countersignatory to check details. Related content Get a passport urgently Passport fees Get a passport photo Passport services if you're disabled Renew or replace your adult passport Explore the topic Passports"
year_published = 2025
clearnet = "https://gov.uk/how-the-post-office-check-and-send-service-works"
