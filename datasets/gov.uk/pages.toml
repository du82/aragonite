title = "Apply online for a UK passport - GOV.UK"
description = "You can apply for, update, renew or replace a passport online."
full_description = "Apply online for a UK passport Use this service to apply for, renew, replace or update your passport and pay for it online. This service is also available in Welsh (Cymraeg). If your passport is burgundy or has ‘European Union’ on the cover, you can continue to use it until it expires. How long it takes Check how long it will take to get a passport before you apply. If you need a passport urgently, you can find out more about the Online Premium or 1 week Fast Track services. Do not book travel until you have a valid passport - your new passport will not have the same number as your old one. Before you start You’ll need a debit or credit card to use this service. It’s £11.50 cheaper to apply for a passport online than by post. You can get help making an online passport application with the digital Check and Send service at a Post Office. Apply online Start now Other ways to apply Help applying online You can get help with your online application at a Post Office. Staff can: take your digital photo help you fill in the application online This service costs extra. Find out more about the digital Check and Send service. You can pay by cash, or debit or credit card. Paper forms You can pick up a paper passport application form from your local Post Office and apply by post. It takes longer to apply by post than online. If you need help, Post Office staff can check you’ve filled in the form correctly - but you’ll need to provide your own photos. This service costs extra. Find out more about the paper Check and Send service. You can pay by cash, or debit or credit card. Related content Passport fees Get a passport photo Change your name or personal details on your passport Getting your first adult passport Get a passport for your child Explore the topic Passports"
