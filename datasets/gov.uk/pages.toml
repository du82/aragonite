full_description = "Cost of living support Skip contents Contents Overview Benefits, tax and work Living costs: bills, housing and health If you’re 60 or over If you’re disabled or have a health condition Childcare and maternity costs Managing money, savings and debt If you’re finding things difficult Overview Find out what support is available to help with the cost of living. This includes income and disability benefits, bills and allowances, childcare, housing and travel. Check benefits and financial support you can get Answer a few questions to find out what support you might be able to get to help with living costs if you live in the UK. Check benefits and financial support you can get. Scams You may get calls, emails or messages that are pretending to be from a government service or an energy bill support scheme. If you get a message asking for your personal details (for example, bank details or passwords) this could be a scam. Report anything you think is suspicious. Support available in England This guide covers cost of living support available in England. Find out about cost of living support in Scotland, support in Wales and support in Northern Ireland. Benefits, tax and work Find out what support is available to help increase your income. This includes the Cost of Living Payment, Universal Credit and Carer’s Allowance. Living costs: bills, housing and health Find out what support is available to help with bills and costs. This includes support with utility bills, support from your local council and Council Tax Reduction. If you’re 60 or over Find out what support is available if you’re 60 or over. This includes Pension Credit, discounted travel and how to check your State Pension. If you’re disabled or have a health condition Find out what support is available if you’re disabled or have a health condition. This includes disability benefits, the Disability Cost of Living Payment and support with prescriptions and health costs. Childcare and maternity costs 