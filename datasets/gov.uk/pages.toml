["https://www.gov.uk/government/how-government-works"]
title = "How government works - GOV.UK"
description = "About the UK system of government. Understand who runs government, and how government is run."
full_description = "How government works In the UK, the Prime Minister leads the government with the support of the Cabinet and ministers. You can find out who runs government and how government is run, as well as learning about the history of government. Contents Who runs government How government is run Civil service Get involved Legislation Access to information Devolved government Local government Parliament History of government Who runs government The Prime Minister The Prime Minister is the leader of His Majesty’s Government and is ultimately responsible for all policy and decisions. The Prime Minister also: oversees the operation of the Civil Service and government agencies appoints members of the government is the principal government figure in the House of Commons The Prime Minister is The Rt Hon Sir Keir Starmer KCB KC MP. Read more about the Prime Minister's Office, 10 Downing Street The Cabinet The Cabinet is made up of the senior members of government. Every week during Parliament, members of the Cabinet (Secretaries of State from all departments and some other ministers) meet to discuss the most important issues for the government. See who is in the Cabinet Ministers 1 Prime Minister 22 Cabinet ministers 97 Other ministers 120 Total ministers Ministers are chosen by the Prime Minister from the members of the House of Commons and House of Lords. They are responsible for the actions, successes and failures of their departments. See full list of ministers How government is run Government departments and agencies Departments and their agencies are responsible for putting government policy into practice. Government departments Some departments, like the Ministry of Defence, cover the whole UK. Others don’t – the Department for Work and Pensions doesn't cover Northern Ireland. This is because some aspects of government are devolved to Scotland, Wales and Northern Ireland. Non-ministerial departments are headed by senior civil servants and not ministers. They usually have a regulatory or inspection function like the Charity Commission. Executive agencies These are part of government departments and usually provide government services rather than decide policy - which is done by the department that oversees the agency. An example is the Driver and Vehicle Licensing Agency (overseen by the Department for Transport). Other public bodies These have varying degrees of independence but are directly accountable to ministers. There are 4 types of non-departmental public bodies (NDPBs). Executive NDPBs do work for the government in specific areas - for example, the Environment Agency. Advisory NDPBs provide independent, expert advice to ministers - for example, the Committee on Standards in Public Life. Tribunal NDPBs are part of the justice system and have jurisdiction over a specific area of law - for example, the Competition Appeal Tribunal. Independent monitoring boards are responsible for the running of prisons and treatment of prisoners - for example, His Majesty's Inspectorate of Prisons. 24 Ministerial departments 20 Non-ministerial departments 400+ Agencies and other public bodies Civil Service The Civil Service does the practical and administrative work of government. It is co-ordinated and managed by the Prime Minister, in their role as Minister for the Civil Service. Around half of all civil servants provide services direct to the public, including: paying benefits and pensions running employment services staffing prisons issuing driving licences The Civil Service is on GOV.UK. Work for us Find and apply for vacancies in departments, executive agencies and non-departmental public bodies. Work with us Search Contracts Finder for any government contract over £10,000 and get details of all previous tenders. Get involved Read about ways to get involved. Engage with government Interact with government through consultations and petitions to inform and influence the decisions it makes. Take part Offer your skills and energy to a project in your neighbourhood, around the UK or overseas. Legislation Laws go through several stages before they are passed by Parliament. The House of Commons and the House of Lords work together to make them. They can include: Draft legislation White papers outline proposals for new laws. Green papers ask for public comments before the white paper is published. Bills are proposals for new laws or changes to existing ones. Once agreed by Parliament, they have to be approved by the King before becoming law. Acts of Parliament These are bills which have been approved by the Commons, the Lords, and the King. The relevant government department is responsible for putting the act into practice. Visit www.legislation.gov.uk Access to information Freedom of information The Freedom of Information Act gives you the right to ask any public sector organisation for all the recorded information it has on any subject. Anyone can make a request for information – known as a Freedom of Information (or FOI) request. There are no restrictions on your age, nationality or where you live. How to make a freedom of information request See FOI releases on GOV.UK Statistics Government produces Official Statistics about most areas of public life. Statistics are used by people inside and outside government to make informed decisions and to measure the success of government policies and services. Find out about the legislation that governs the publication of UK national and Official Statistics. See statistics publications on GOV.UK Transparency The government publishes information about how government works to allow you to make politicians, public services and public organisations more accountable. We are committed to publishing information about: how much public money has been spent on what the job titles of senior civil servants and how much they are paid how the government is doing against its objectives See transparency releases on GOV.UK Data Putting data in people’s hands can help them have more of a say in the reform of public services. On data.gov.uk you can easily find, review and use information about our country and communities - for example, to develop web applications. Devolved government In Scotland, Wales and Northern Ireland, devolved administrations are responsible for many domestic policy issues, and their Parliaments/Assemblies have law-making powers for those areas. Areas the Scottish Government, Welsh Government, and the Northern Ireland Executive are responsible for, include: health education culture the environment transport Local government Councils make and carry out decisions on local services. Many parts of England have 2 tiers of local government: county councils and district, borough or city councils. In some parts of the country, there’s just one tier of local government providing all the functions, known as a ‘unitary authority’. This can be a city, borough or county council – or it may just be called ‘council’. As well as these, many areas also have parish or town councils. Understand how your council works Parliament Parliament is separate from government. Made up of the House of Commons and the House of Lords, its role is to: look at what the government is doing debate issues and pass new laws set taxes Find out about how Parliament works Read The Official Report at Hansard History of government Britain has one of the oldest governments in the world. Find out more about how it has worked and who has shaped it in the history section. Read about past Prime Ministers, Chancellors and Foreign Secretaries in notable people. Learn more about historic government buildings on Whitehall and around the UK. You can also find links to historical research, documents and records."
year_published = 2025
clearnet = "https://www.gov.uk/government/how-government-works"
