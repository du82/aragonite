["https://gov.uk/passport-fees"]
title = "Passport fees - GOV.UK"
description = "How much it costs to renew or get a new adult or child passport and ways you can pay"
full_description = "Passport fees How much your passport costs depends on how you apply for it. You cannot get a refund if you cancel your application or you’re not entitled to a passport. Apply online Apply by paper form Adult (16 and over) standard 34-page passport £88.50 £100 Adult (16 and over) 54-page frequent traveller passport £100.50 £112 Child (under 16) standard 34-page passport £57.50 £69 Child (under 16) 54-page frequent traveller passport £69.50 £81 Passport for people born on or before 2 September 1929 Free Free You’ll pay a different fee if you apply for a passport from another country. If you need to get a passport urgently, it costs more. You can pay extra to use the Post Office’s Check and Send service. How to pay Depending on how you apply, you can pay by: debit or credit card cash cheque or postal order (payable to the correct organisation, and write the application barcode numbers on the back) Debit or credit card accepted Cheque or postal order Cash Apply using the Post Office Passport Check and Send service Yes Postal order payable to ‘Post Office Ltd’ Cheques not accepted Yes Apply by post Yes - complete the form in the application pack Cheque or postal order payable to ‘HM Passport Office’ No Apply online Yes No No Fees for returning supporting documents Your supporting documents (for example birth certificates) will be sent back to you free of charge by normal second class post. It usually costs an extra £5 if you want your documents sent back by secure delivery. Choose this option on your application if you want to use it. If you were born on or before 2 September 1929 You can get or renew a British passport for free if you’re a British national and you were born on or before 2 September 1929. You can also use the Post Office Check and Send service for free and get free secure delivery. You must pay a fee if you need to get a passport urgently or if you want a frequent traveller passport (54 pages instead of 34). Related content Getting your first adult passport Get a passport urgently Passport Check and Send service Renew or replace your adult passport Get a passport for your child Show 2 more Cancel a lost or stolen passport and Countersigning passport applications and photos Explore the topic Passports"
year_published = 2025
clearnet = "https://gov.uk/passport-fees"
