["https://gov.uk/apply-first-adult-passport"]
title = "Getting your first adult passport:  Who can apply - GOV.UK"
description = "Apply for your first adult British passport - who can apply, how long it takes, costs, how to apply, documents you need, passport interviews"
full_description = "Getting your first adult passport Skip contents Contents Who can apply What documents you need to apply Apply online Apply with a paper form After you apply Who can apply You can apply for a first adult passport if all of the following apply: you’re a British national you’re aged 16 or over (or will be in 3 weeks) you’ve never had a UK passport before You must also apply if your last UK passport was issued before 1 January 1994. You can use your child passport until it expires, even if you’re over 18. An adult passport is valid for 10 years. How long it takes Check how long it will take to get a passport before you apply. If you need a passport to travel urgently for medical treatment or because a friend or family member is seriously ill or has died, call the Passport Adviceline. Do not book travel until you get your passport. Ways to apply If you’re in the UK, you can either: apply online - it costs £88.50 apply with a paper form - it costs £100 There’s a different way to apply if you’re overseas. If you have a non-British passport If you have dual citizenship (‘dual nationality’) and have a non-British passport, the name and gender on your non-British passport must match the name and gender you want on your British passport. If they’re different, change the details on your non-British passport before you apply for a new British passport. Next : What documents you need to apply View a printable version of the whole guide Related content British passport eligibility Countersigning passport applications and photos Get a passport for your child Order a birth, death, marriage or civil partnership certificate Passport Check and Send service Show 2 more Get a passport photo and Passport services if you're disabled Explore the topic Passports"
