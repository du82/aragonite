["https://gov.uk/government/organisations/hm-passport-office/about-our-services"]
title = "About our services - HM Passport Office - GOV.UK"
description = "Find out how long your passport application is likely to take."
full_description = "About our services Find out how long your passport application is likely to take. HM PassportOffice Contents Processing times in the UK How to apply Urgent travel for compassionate reasons If you’ve already applied Processing times in the UK You’ll usually get your passport within 3 weeks. It may take longer than 3 weeks if we need more information, or we need to interview you. We’ll tell you this within 3 weeks. There are different turnaround times if you’re applying from another country. When your application processing time starts The processing time starts from when we receive your documents. How to apply Apply online to use the standard service. You can also apply with a paper form from a post office. This costs an extra £16.00. If you need a passport urgently, you can find out more about the Online Premium or 1 week Fast Track services. Urgent travel for compassionate reasons If you need a passport to travel urgently for medical treatment, because a friend or family member is seriously ill or has died, or for urgent government business, call the Passport Adviceline. If you’ve already applied You can track your passport application. Contents"
