["https://www.gov.uk/government/get-involved"]
title = "Get involved - GOV.UK"
description = "Find out how you can engage with government directly, and take part locally, nationally or internationally."
full_description = "Government activity Get Involved Find out how you can engage with government directly, and take part locally, nationally or internationally. Engage with government You can give your views on new or changing government policies by responding to consultations. Government departments take these responses into consideration before making decisions. Respond to consultations 56 Open consultations 219 Closed consultations in the past 12 months Closing tomorrow Northern Ireland Office launches consultation on the use of non-jury trials in Northern Ireland Read and respond Recently opened Decarbonisation readiness: proposed guidance Closes: 9 May 2025 Updated: 28 February 2025 (EA) Exchange of car driving licences issued in Moldova Closes: 28 March 2025 Updated: 28 February 2025 (DVLA) Reforms to inheritance tax reliefs: consultation on property settled into trust Closes: 23 April 2025 Updated: 27 February 2025 (HMRC) Search all consultations Recent outcomes Project Gigabit National Rolling Open Market Review January 2025 Closed: 13 February 2025 Updated: 13 February 2025 (BDUK) UK Green Taxonomy Closed: 6 February 2025 Updated: 14 November 2024 (HMT) SMS investigation into Google's general search and search advertising services Closed: 3 February 2025 Updated: 27 February 2025 (CMA) Search all consultations Start a petition You can create a petition to influence government and Parliament. If the petition gets at least 100,000 online signatures, it will be considered for debate in the House of Commons. Follow a blog or social media channel For an instant way to interact with government departments, try their social media streams. These are listed under 'Follow us' on the department's home page. As well as access to blogs, audio, video and more, you can comment, debate and rate. See all government departments Some active government blogs include History of Government Civil Service Quarterly FCDO blogs Government Digital Service Civil Service Take part National Citizen Service If you're 16 or 17 years old, you can take part in the National Citizen Service Start a public service mutual If you work in the public sector, you may be able to set up a public service mutual. Set up a new school Free schools are independent, state-funded schools. Help make your neighbourhood a safer place You can help make your local area safer in a number of different ways. Decide where homes, shops and businesses should be built Your community can get involved in making decisions about where new buildings should be built. Challenge to run a local service Your group could take over the running of a local service, if you could make improvements. Improve your social housing Improve where you live by making sure your landlord provides what you need. Protect a local building Use the Community Right to Bid to mark out local buildings or land as valuable to your community. Organise a street party Meet your neighbours, celebrate an event or mark an occasion with a party. Take over a local pub, shop, or green space for the community Ways to help your area by supporting local businesses and services, and reclaiming underused space. Volunteer as a school governor or academy trustee Join one of the largest volunteer workforces in the UK and start making a difference to the lives of young people in your local community. Set up a town or parish council Local councils provide services to meet local needs and improve community wellbeing. Invest in local enterprises Use 'community shares' to support and invest in local businesses. Help run a charity Find out how you could help run a charity by volunteering as a charity trustee. Make a neighbourhood plan Have a say in development in your area by joining a neighbourhood planning group, or starting one of your own. Create a community library Find out how you can help support local libraries, including taking on ownership and management. Become a councillor All councils are led by democratically elected councillors who set the vision and direction, and represent their local community. More ways to take part Many people are already volunteering, donating and contributing, both in the UK and abroad. If you'd like to join them, but dont know where to start, here's a list of suggestions Take part in your local Neighbourhood Watch Make a donation to charity Link up with a school overseas"
