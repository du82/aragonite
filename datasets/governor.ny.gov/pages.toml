full_description = '''.o-hero.-noImage .o-hero__wrapper { background-image: url(''); } .o-hero.-image .o-hero__wrapper { background-image: url('https://www.governor.ny.gov/sites/default/files/styles/hero_mobile/public/2025-01/00-child-care.jpg?h=b53cb0b4&itok=L5OEkuyB'); } @media(min-width: 768px) { .o-hero.-image .o-hero__wrapper { background-image: url('https://www.governor.ny.gov/sites/default/files/styles/hero_narrow/public/2025-01/00-child-care.jpg?h=b53cb0b4&itok=vU1NtWbU'); } } @media(min-width: 1024px) { .o-hero.-image .o-hero__wrapper { background-image: url('https://www.governor.ny.gov/sites/default/files/styles/hero_wide/public/2025-01/00-child-care.jpg?h=b53cb0b4&itok=NyaAWpze'); } } Programs Making New York State More Affordable Making New York State More Affordable Stay Updated Get updates from Governor Hochul about the 2025 State of the State. Sign up Stay Updated Get updates from Governor Hochul about the 2025 State of the State. Sign up A Note from Governor Kathy Hochul "My top priority is tackling New York’s affordability crisis.Since COVID, inflation has eaten away at New Yorkers’ incomes. When costs for basic necessities skyrocket, it makes putting food on the table so much more difficult. Many New Yorkers still feel the pinch. They know that every dollar counts. It adds up quickly, especially for a family with small children or for seniors on a fixed income.I understand this struggle intuitively. I watched my grandparents – who worked in factories their whole lives – struggle in their old age. I watched my mother – who raised a family of eight – stretch every dollar by buying used clothes and serving fried spam sandwiches for dinner. When I started my own family, I had to leave my job because we couldn’t find affordable childcare.Since taking office, my administration has delivered more than $5.5 billion in supplemental payments, tax relief and rebates for homeowners, tuition assistance for students, heating and cooling assistance for seniors, as well as expanded access to child care assistance and paid leave for families and pregnant women.I will never stop fighting for New Yorkers and their families."— Governor Kathy Hochul New Affordability Policies In Effect as of January 1, 2025 Governor Hochul fought to raise the Minimum Wage and index it to inflation – it is now $16.50 in New York City, and Nassau, Suffolk, and Westchester counties, and $15.50 elsewhere in the state.Pregnant women are now eligible for 20 hours of Paid Prenatal Leave as first-in-the-nation law takes effect.New Yorkers needing Insulin will pay $0 in co-pays on any state-regulated insurance plan. New Policy Information Watch: Governor Hochul Announces Affordability Policies Taking Effect January 1st https://www.youtube.com/embed/Rh8weUBePnM We’re putting money back in the pockets of more than a million New Yorkers because this administration delivers for working families." Governor Hochul Affordability Agenda Highlights .o-cardLogo.-index1.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/child-tax-credit_hero-01.jpg?h=1312ab98&itok=pBWn1wHc"); } .o-quickCardLogo.-index1.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/child-tax-credit_hero-01.jpg?h=1312ab98&itok=pBWn1wHc"); } @media(min-width: 768px) { .o-cardLogo.-index1.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/2025-01/child-tax-credit_hero-01.jpg?itok=sH8olPgC"); } } @media(min-width: 1024px) { .o-cardLogo.-index1.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/child-tax-credit_hero-01.jpg?h=1312ab98&itok=pBWn1wHc"); } } Largest Expansion Ever Proposed for Child Tax Credit Largest Expansion Ever Proposed for Child Tax Credit The proposal would give families an annual tax credit of up to $1,000 per child under age four and up to $500 per child age four through 16. .o-cardLogo.-index2.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/child-care-construction-card_500x300.jpg?itok=xTaI5FeW"); } .o-quickCardLogo.-index2.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/child-care-construction-card_500x300.jpg?itok=xTaI5FeW"); } @media(min-width: 768px) { .o-cardLogo.-index2.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/2025-01/child-care-construction-card_500x300.jpg?itok=Hj-VrP5F"); } } @media(min-width: 1024px) { .o-cardLogo.-index2.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/child-care-construction-card_500x300.jpg?itok=xTaI5FeW"); } } Making Child Care More Accessible and Affordable Making Child Care More Accessible and Affordable Governor Hochul’s proposal include committing $110 million to build new child care facilities and repair existing sites. .o-cardLogo.-index3.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2021-04/family_middle_class_tax_cuts.jpg?h=a856383b&itok=yelEH_9e"); } .o-quickCardLogo.-index3.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2021-04/family_middle_class_tax_cuts.jpg?h=a856383b&itok=yelEH_9e"); } @media(min-width: 768px) { .o-cardLogo.-index3.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/2021-04/family_middle_class_tax_cuts.jpg?itok=rDxxu4mh"); } } @media(min-width: 1024px) { .o-cardLogo.-index3.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2021-04/family_middle_class_tax_cuts.jpg?h=a856383b&itok=yelEH_9e"); } } Make Raising a Family More Affordable in New York Make Raising a Family More Affordable in New York Governor Hochul signed a package of new laws that will expand the availability of resources for new parents and young children. .o-cardLogo.-index4.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/inflation_refund_1280v2.jpg?h=b5f6a62e&itok=TPVLmvvQ"); } .o-quickCardLogo.-index4.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/inflation_refund_1280v2.jpg?h=b5f6a62e&itok=TPVLmvvQ"); } @media(min-width: 768px) { .o-cardLogo.-index4.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/2025-01/inflation_refund_1280v2.jpg?itok=1RaRTmVb"); } } @media(min-width: 1024px) { .o-cardLogo.-index4.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/inflation_refund_1280v2.jpg?h=b5f6a62e&itok=TPVLmvvQ"); } } New York State’s First-Ever Inflation Refund New York State’s First-Ever Inflation Refund Governor Hochul's proposed Inflation Refund in New York State would provide around $3 billion in direct payments to 8.6 million taxpayers. .o-cardLogo.-index5.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2024-12/paid-prenatal-leave-campaign_hero-01.jpg?h=d95ac7bc&itok=qx-fY9BZ"); } .o-quickCardLogo.-index5.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2024-12/paid-prenatal-leave-campaign_hero-01.jpg?h=d95ac7bc&itok=qx-fY9BZ"); } @media(min-width: 768px) { .o-cardLogo.-index5.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/2024-12/paid-prenatal-leave-campaign_hero-01.jpg?itok=yToiEQ2l"); } } @media(min-width: 1024px) { .o-cardLogo.-index5.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2024-12/paid-prenatal-leave-campaign_hero-01.jpg?h=d95ac7bc&itok=qx-fY9BZ"); } } New York’s First-in-the-Nation Paid Prenatal Leave Policy New York’s First-in-the-Nation Paid Prenatal Leave Policy Starting January 1, 2025, workers will have the ability to take paid leave for any pregnancy-related medical appointments. .o-cardLogo.-index6.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/homeownership-for-sale-sign-young-family-card_1.jpg?h=ae1281eb&itok=QN1YM-7S"); } .o-quickCardLogo.-index6.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/homeownership-for-sale-sign-young-family-card_1.jpg?h=ae1281eb&itok=QN1YM-7S"); } @media(min-width: 768px) { .o-cardLogo.-index6.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/2025-01/homeownership-for-sale-sign-young-family-card_1.jpg?itok=y3YKPIeU"); } } @media(min-width: 1024px) { .o-cardLogo.-index6.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/homeownership-for-sale-sign-young-family-card_1.jpg?h=ae1281eb&itok=QN1YM-7S"); } } Making Homeownership More Affordable and Accessible Making Homeownership More Affordable and Accessible Governor Hochul is addressing the housing crisis by ensuring that even more New Yorkers can purchase a home. .o-cardLogo.-index7.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/thumbnails/image/Summer_Meal_Free_Lunch_Boy_Food_hero.jpg?h=f83a10fc&itok=iduJBY39"); } .o-quickCardLogo.-index7.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/thumbnails/image/Summer_Meal_Free_Lunch_Boy_Food_hero.jpg?h=f83a10fc&itok=iduJBY39"); } @media(min-width: 768px) { .o-cardLogo.-index7.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/thumbnails/image/Summer_Meal_Free_Lunch_Boy_Food_hero.jpg?itok=y5EKgOu4"); } } @media(min-width: 1024px) { .o-cardLogo.-index7.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/thumbnails/image/Summer_Meal_Free_Lunch_Boy_Food_hero.jpg?h=f83a10fc&itok=iduJBY39"); } } Free Breakfast and Lunch for More Than 2.7M Students Free Breakfast and Lunch for More Than 2.7M Students Governor Hochul's plan will help save money, address food insecurity and create more opportunities for students to succeed. .o-cardLogo.-index8.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2024-09/STAR_hero1.jpg?h=443174b3&itok=a3-B7wxE"); } .o-quickCardLogo.-index8.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2024-09/STAR_hero1.jpg?h=443174b3&itok=a3-B7wxE"); } @media(min-width: 768px) { .o-cardLogo.-index8.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/2024-09/STAR_hero1.jpg?itok=Mj8bdzQe"); } } @media(min-width: 1024px) { .o-cardLogo.-index8.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2024-09/STAR_hero1.jpg?h=443174b3&itok=a3-B7wxE"); } } STAR Program Delivers $2.3B in Tax Relief for New Yorkers STAR Program Delivers $2.3B in Tax Relief for New Yorkers Nearly 3 million New Yorkers are taking advantage of the State’s School Tax Relief program to ease the burden of property taxes. .o-cardLogo.-index9.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2024-07/Cost_hero1.jpg?h=095fd3ff&itok=4umxOBkv"); } .o-quickCardLogo.-index9.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2024-07/Cost_hero1.jpg?h=095fd3ff&itok=4umxOBkv"); } @media(min-width: 768px) { .o-cardLogo.-index9.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/2024-07/Cost_hero1.jpg?itok=F3zG7B9R"); } } @media(min-width: 1024px) { .o-cardLogo.-index9.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2024-07/Cost_hero1.jpg?h=095fd3ff&itok=4umxOBkv"); } } Empire State Child Credit Program Delivers Assistance Empire State Child Credit Program Delivers Assistance Approximately $350 million in supplemental payments have been made to low- and moderate-income families statewide. .o-cardLogo.-index10.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2024-05/TAP_hero2.jpg?h=b5f6a62e&itok=Xy3MviM-"); } .o-quickCardLogo.-index10.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2024-05/TAP_hero2.jpg?h=b5f6a62e&itok=Xy3MviM-"); } @media(min-width: 768px) { .o-cardLogo.-index10.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/2024-05/TAP_hero2.jpg?itok=fDJS2hjp"); } } @media(min-width: 1024px) { .o-cardLogo.-index10.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2024-05/TAP_hero2.jpg?h=b5f6a62e&itok=Xy3MviM-"); } } Making Higher Education More Accessible & Affordable Making Higher Education More Accessible & Affordable Governor Hochul announced the historic expansion of TAP, which increases the minimum award to $1,000. .o-cardLogo.-index11.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2024-08/ebt_hero.jpg?h=23394dc2&itok=A8hJoh05"); } .o-quickCardLogo.-index11.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2024-08/ebt_hero.jpg?h=23394dc2&itok=A8hJoh05"); } @media(min-width: 768px) { .o-cardLogo.-index11.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/2024-08/ebt_hero.jpg?itok=0fdKwQCC"); } } @media(min-width: 1024px) { .o-cardLogo.-index11.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2024-08/ebt_hero.jpg?h=23394dc2&itok=A8hJoh05"); } } Food Assistance for 1.5 Million Children in New York State Food Assistance for 1.5 Million Children in New York State New York State sent nearly $200M or $120 per child to eligible families to help pay for healthy meals as part of the Summer EBT program. .o-cardLogo.-index12.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2023'''
