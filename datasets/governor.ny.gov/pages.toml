title = "Ensuring Distraction-Free Learning in Schools | Governor Kathy Hochul"
description = "More Learning, Less Scrolling"
full_description = '''.o-hero.-noImage .o-hero__wrapper { background-image: url(''); } .o-hero.-image .o-hero__wrapper { background-image: url('https://www.governor.ny.gov/sites/default/files/styles/hero_mobile/public/2025-01/smartphones1200.jpg?h=aff6a1f7&itok=pfLFFvhI'); } @media(min-width: 768px) { .o-hero.-image .o-hero__wrapper { background-image: url('https://www.governor.ny.gov/sites/default/files/styles/hero_narrow/public/2025-01/smartphones1200.jpg?h=aff6a1f7&itok=YIoSNvXr'); } } @media(min-width: 1024px) { .o-hero.-image .o-hero__wrapper { background-image: url('https://www.governor.ny.gov/sites/default/files/styles/hero_wide/public/2025-01/smartphones1200.jpg?h=aff6a1f7&itok=3kQELouG'); } } Programs Ensuring Distraction-Free Learning in Schools More Learning, Less Scrolling Ensuring Distraction-Free Learning in Schools Overview Governor Hochul is launching a new effort to restrict smartphone use in K-12 schools statewide. The legislative proposal is part of the Governor's FY 2026 Executive Budget. The proposal follows recommendations released in a new report from a statewide listening tour with students, parents, teachers and other stakeholders to address smartphone use in schools.Governor Hochul is committed to protecting youth mental health and promoting student success in the digital age. Last year, she signed first-in-the-nation legislation to restrict addictive social media feeds and protect children online. Governor Hochul is also building on her "Get Offline, Get Offside" initiative with "Unplug and Play," which encourages New York's kids and families to put down their phones and computers, take a break from social media, enjoy recreation and outdoor social media, and put their mental and physical health first. Creating a Statewide Standard for Distraction-Free Schools Smartphone-Free Zone The proposal calls for no unsanctioned use of smartphones and other internet-enabled personal devices on school grounds in K-12 schools for the entire school day. Exemptions to these restrictions include students who need an internet-enabled device for medical reasons, if required by a student's Individualized Education Program (IEP), or for translation purposes. Schools Develop Own Operational Plans The proposal allows schools to develop their own plans for storing smartphones during the day — giving administrators and teachers the flexibility to do what works best for their buildings and students. Staying in Contact The proposal requires schools to give parents a way to contact their kids during the day if needed. Students would still be authorized to have access to simple cellphones without internet capability, as well as internet-enabled devices officially provided by their school for classroom instruction, such as laptops or tablets used as part of lesson plans. Learn more Watch: Governor Hochul unveils plan to restrict smartphone use in schools statewide https://www.youtube.com/embed/kZ7mvNH2X3g Report More Learning, Less Scrolling: Creating Distraction-Free Schools Governor Hochul released a new report with recommendations gathered from her statewide listening tour this past year with students, parents and teachers regarding excessive smartphone use in schools. Read the report Featured News .o-cardLogo.-index1.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/distraction-free-school_hero-01.jpg?h=3af41558&itok=ZNYb32OI"); } .o-quickCardLogo.-index1.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/distraction-free-school_hero-01.jpg?h=3af41558&itok=ZNYb32OI"); } @media(min-width: 768px) { .o-cardLogo.-index1.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/2025-01/distraction-free-school_hero-01.jpg?itok=5fLBsP_j"); } } @media(min-width: 1024px) { .o-cardLogo.-index1.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/distraction-free-school_hero-01.jpg?h=3af41558&itok=ZNYb32OI"); } } Restricting Smartphone Use in New York Schools Statewide Restricting Smartphone Use in New York Schools Statewide Governor Hochul proposed legislation to ensure distraction-free learning in New York schools statewide. .o-cardLogo.-index2.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/distraction-free-school_hero-01.jpg?h=3af41558&itok=ZNYb32OI"); } .o-quickCardLogo.-index2.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/distraction-free-school_hero-01.jpg?h=3af41558&itok=ZNYb32OI"); } @media(min-width: 768px) { .o-cardLogo.-index2.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/2025-01/distraction-free-school_hero-01.jpg?itok=5fLBsP_j"); } } @media(min-width: 1024px) { .o-cardLogo.-index2.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/distraction-free-school_hero-01.jpg?h=3af41558&itok=ZNYb32OI"); } } Support for Push to Restrict Smartphone Use in Schools Support for Push to Restrict Smartphone Use in Schools Elected officials, labor leaders, school administrators and community advocates voice support for restricting smartphones in schools. .o-cardLogo.-index3.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2024-07/smartphoneschools_heroweb.jpg?h=440bfa7e&itok=MnXBogID"); } .o-quickCardLogo.-index3.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2024-07/smartphoneschools_heroweb.jpg?h=440bfa7e&itok=MnXBogID"); } @media(min-width: 768px) { .o-cardLogo.-index3.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/2024-07/smartphoneschools_heroweb.jpg?itok=3jDn9I_f"); } } @media(min-width: 1024px) { .o-cardLogo.-index3.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2024-07/smartphoneschools_heroweb.jpg?h=440bfa7e&itok=MnXBogID"); } } Listening Tour Starts to Address Smartphone Use in Schools Listening Tour Starts to Address Smartphone Use in Schools Governor Hochul kicked off a statewide listening tour focused on addressing smartphone use in schools. Support for Distraction-Free Schools .m-supporter.supporter_1::before { position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: url('https://www.governor.ny.gov/sites/default/files/styles/cover_image_660x400_/public/2025-01/person-melinda.jpg?h=f3e42b6d&itok=hTcZb8G1'); background-size: cover; background-repeat: no-repeat; background-position: 50% 50%; opacity: .15; content: ""; z-index: 0; } .m-supporter.supporter_1.bg-primary-light-blue .m-supporter__links .read-quote:hover { color: #FACE00; } .m-supporter.supporter_1.bg-primary-light-blue .m-supporter__links .social-links a:hover { color: #FACE00; } NYSUT President Melinda Person Read Quote “Today marks a pivotal step in our push to create distraction-free learning environments, ensuring our schools are sanctuaries for learning, growth and genuine connection. This movement is growing larger and stronger every day, and has brought together parents, teachers, law enforcement, and local officials who all recognize the crucial importance of giving children a school day free from the pressures of social media and other distractions. I want to thank Gov. Hochul for keeping student mental health a top priority, and for her clear dedication to the success and well-being of the next generation.” Melinda Person .m-supporter.supporter_2::before { position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: url('https://www.governor.ny.gov/sites/default/files/styles/cover_image_660x400_/public/2025-01/rijos-bio-2023.jpg?h=75d9f236&itok=PEafVUed'); background-size: cover; background-repeat: no-repeat; background-position: 50% 50%; opacity: .15; content: ""; z-index: 0; } .m-supporter.supporter_2.bg-primary-light-blue .m-supporter__links .read-quote:hover { color: #FACE00; } .m-supporter.supporter_2.bg-primary-light-blue .m-supporter__links .social-links a:hover { color: #FACE00; } NYS PTA Vice President and Parent from Yonkers Roberto Rijos Read Quote “As a father of three, my wife and I fully understand the concerns regarding smartphone usage in classrooms and schools. Our classrooms and schools must remain places of learning, collaboration, and cooperation where our students continue to thrive — free from unnecessary distractions. We thank Governor Hochul for truly listening to parents, families, educators, students, NYS PTA and other stakeholders in drafting this legislation — which balances common sense limitations to support in-class learning and socialization, and includes allowances for necessary usage of devices in certain instances." Roberto Rijos .m-supporter.supporter_3::before { position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: url('https://www.governor.ny.gov/sites/default/files/styles/cover_image_660x400_/public/2025-01/anika-bhupati.jpg?h=7d66a0c3&itok=mYeIlvzE'); background-size: cover; background-repeat: no-repeat; background-position: 50% 50%; opacity: .15; content: ""; z-index: 0; } .m-supporter.supporter_3.bg-primary-light-blue .m-supporter__links .read-quote:hover { color: #FACE00; } .m-supporter.supporter_3.bg-primary-light-blue .m-supporter__links .social-links a:hover { color: #FACE00; } Eighth Grade Farnsworth Middle School Student Anika Bhupati Read Quote “Focusing in school and getting involved in activities is just easier without the constant distraction of apps and phones. I think it’s great that Governor Hochul is helping more kids to get away from all the scrolling and get back to exploring our real interests and having fun with friends.” Anika Bhupati .m-supporter.supporter_4::before { position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: url('https://www.governor.ny.gov/sites/default/files/styles/cover_image_660x400_/public/2025-01/sup-james-03apr24-crop_0.jpg?h=8842e6b8&itok=bltzSqhe'); background-size: cover; background-repeat: no-repeat; background-position: 50% 50%; opacity: .15; content: ""; z-index: 0; } .m-supporter.supporter_4.bg-primary-light-blue .m-supporter__links .read-quote:hover { color: #FACE00; } .m-supporter.supporter_4.bg-primary-light-blue .m-supporter__links .social-links a:hover { color: #FACE00; } New York State Police Superintendent Steven G. James Read Quote “The use of mobile phones by students during a quickly developing school emergency is a distraction that could compromise the safety of students and school staff. State Police and local law enforcement will support school districts as they implement new cell phone policies as part of their school safety plans.” Steven G. James What they are saying'''
