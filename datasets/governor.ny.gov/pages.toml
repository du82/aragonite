full_description = ".o-hero .o-hero__image { background-image: url('https://www.governor.ny.gov/sites/default/files/styles/hero_mobile/public/thumbnails/image/Capitol_2.PKhero.jpg?h=b5f6a62e&itok=SAuY5D_q'); } .o-hero.-noImage .o-hero__image { background-image: url(''); } @media(min-width: 768px) { .o-hero .o-hero__image { background-image: url('https://www.governor.ny.gov/sites/default/files/styles/hero_narrow/public/thumbnails/image/Capitol_2.PKhero.jpg?h=b5f6a62e&itok=fE5l2FCd'); } } @media(min-width: 1024px) { .o-hero .o-hero__image { background-image: url('https://www.governor.ny.gov/sites/default/files/styles/hero_wide/public/thumbnails/image/Capitol_2.PKhero.jpg?h=b5f6a62e&itok=mjI7S3ly'); } } Freedom of Information Law (FOIL) Requests On this page Overview Availability of Records Make a FOIL Request Right to Appeal Frequently FOILed Documents On this page Overview Availability of Records Make a FOIL Request Right to Appeal Frequently FOILed Documents Freedom of Information Law (FOIL) Requests Overview The Freedom of Information Law (Public Officers Law, Article 6) (FOIL) grants members of the public access to the records of government in accordance with its provisions. For more information about FOIL and the Personal Privacy Protection Law (Public Officers Law, Article 6-A), please visit the New York State Committee on Open Government’s website. View the Executive Chamber's subject matter list pertaining to FOIL. Availability of Records Upon appointment, public records maintained by the Executive Chamber are available for inspection or copying on weekdays between the hours of 9:00 a.m. and 5:00 p.m. at the Executive Chamber, State Capitol, Albany, NY 12224. Make a FOIL Request FOIL requests for records maintained by the Executive Chamber must be submitted in writing to the Executive Chamber’s Records Access Officer. Please be as specific as possible in describing the records you seek. Requests can be delivered in person, mailed, faxed, emailed or submitted online by using the link below.Contact InformationChristopher RitcheyFOIL Counsel & Records Access OfficerExecutive ChamberState CapitolAlbany, NY 12224Tel: (518) 408-2303E-mail: [email protected]SUBMIT A FOIL REQUEST Right to Appeal To the extent you believe you have been denied access to a record by the Executive Chamber, you have thirty (30) days from the date of the determination to take a written appeal. You may make an appeal by writing:Contact InformationBella SatraFOIL Appeals OfficerExecutive ChamberState CapitolAlbany, NY 12224E-mail: [email protected] Frequently FOILed Documents Executive Chamber Aircraft PolicyExecutive Chamber Vehicle Use PolicyGovernor and Lieutenant Governor Staff List"
