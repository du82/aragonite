al opportunity to enjoy all of its programs, services, and activities. For example, individuals with service animals are welcomed in Executive Chamber offices, even where pets are generally prohibited.Anyone who requires an auxiliary aid or service for effective communication, or a modification of policies or procedures to participate in a program, service, or activity of Executive Chamber should contact the American Disability Act (ADA) Coordinator, Elatisha Kirnon at [email protected].The ADA does not require the Executive Chamber to take any action that would fundamentally alter the nature of its programs or services, or impose an undue financial or administrative burden.Complaints that a program, service, or activity of the Executive Chamber is not accessible to persons with disabilities should be directed to the ADA Coordinator, Elatisha Kirnon at [email protected]. Grievance Procedure and Complaint Form customElements.define('nysds-asl-pb1kyq61nne', class extends HTMLElement { constructor() { super(); const shadowRoot = this.attachShadow({mode: 'open'}); shadowRoot.innerHTML = ` <div class="nysds-asl-container"><a href="https://www.youtube.com/watch?v=idza7GZnkio&list=PLWFSbPySNf6XIYaG9NlCvz7-uPhr6T5cv&index=15" class="nysds-asl-link">American Sign Language (ASL) Version of Grievance Procedure<span class="nysds-sr-only"></span></a></div><style>.nysds-asl-container{display:flex;flex-direction:row;justify-content:center;align-items:flex-start;margin:5px 0}.nysds-asl-link{font-family:"Proxima Nova","proxima nova",proxima-nova,ProximaNovaRegular,sans-serif;font-size:13px;line-height:15px;font-weight:700;color:#000;border:1px solid #d0d0ce;border-radius:15px;display:flex;flex-direction:row;align-items:center;background:#ededed;text-decoration:none;letter-spacing:2px;padding:10px 15px}.nysds-asl-link:focus,.nysds-asl-link:hover{background:#000;color:#fff}.nysds-asl-link::after,.nysds-asl-link::before{box-sizing:content-box;display:block;content:" ";background-repeat