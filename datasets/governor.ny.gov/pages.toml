["https://governor.ny.gov/executive-order/no-44-declaring-disaster-emergency-counties-allegany-cattaraugus-chautauqua-erie"]
title = "No. 44: Declaring a Disaster Emergency in the Counties of Allegany, Cattaraugus, Chautauqua, Erie, Genesee, Jefferson, Lewis, Niagara, Oneida, Orleans, Oswego, Wyoming, and Contiguous Counties | Governor Kathy Hochul"
description = "Declaring a Disaster Emergency in the Counties of Alleghany, Cattaraugus, Chautauqua, Erie, Genesee, Jefferson, Lewis, Niagara, Oneida, Orleans, Oswego, Wyoming, and Contiguous Counties."
full_description = ".o-hero .o-hero__wrapper { background-image: linear-gradient(rgba(0, 0, 0, 0.75),rgba(0, 0, 0, 0.75)), url(''); } .o-hero.-noImage .o-hero__wrapper { background-image: url(''); } @media(min-width: 768px) { .o-hero .o-hero__wrapper { background-image: linear-gradient(to right,#000,rgba(0,0,0,0.25) 50%,rgba(0,0,0,0)), url(''); } } @media(min-width: 1024px) { .o-hero .o-hero__wrapper { background-image: linear-gradient(to right,#000,rgba(0,0,0,0.25) 50%,rgba(0,0,0,0)), url(''); } } January 20, 2025 No. 44: Declaring a Disaster Emergency in the Counties of Allegany, Cattaraugus, Chautauqua, Erie, Genesee, Jefferson, Lewis, Niagara, Oneida, Orleans, Oswego, Wyoming, and Contiguous Counties No. 44: Declaring a Disaster Emergency in the Counties of Allegany, Cattaraugus, Chautauqua, Erie, Genesee, Jefferson, Lewis, Niagara, Oneida, Orleans, Oswego, Wyoming, and Contiguous Counties Executive Order No. 44 Declaring a Disaster Emergency in the Counties of Alleghany, Cattaraugus, Chautauqua, Erie, Genesee, Jefferson, Lewis, Niagara, Oneida, Orleans, Oswego, Wyoming, and Contiguous Counties. Download No. 44 E X E C U T IV E O R DE R DECLARING A DISASTER EMERGENCY IN THE COUNTIES OF ALLEGANY, CATTARAUGUS, CHAUTAUQUA, ERIE, GENESEE, JEFFERSON, LEWIS, NIAGARA, ONEIDA, ORLEANS, OSWEGO, WYOMING, AND CONTIGUOUS COUNTIES.WHEREAS, on January 20, 2025, and continuing thereafter, a severe storm system is expected to create hazardous conditions posing an imminent danger to public transportation, utility service, public health, and public safety systems within the counties of Allegany, Cattaraugus, Chautauqua, Erie, Genesee, Jefferson, Lewis, Niagara, Oneida, Orleans, Oswego, Wyoming, and contiguous counties;WHEREAS, the storm is expected to produce significant snow, strong winds, and freezing temperatures, which may result in road closures, travel disruptions, widespread power outages, and damage to public and private property, which pose a threat to the public health and safety;NOW, THEREFORE, I, KATHY HOCHUL, Governor of the State of New York, by virtue of the authority vested in me by the Constitution of the State of New York and Section 28 of Article 2-B of the Executive Law, do hereby find that a disaster is imminent for which the affected local governments are unable to respond adequately. Therefore, I hereby declare a State Disaster Emergency, effective January 20, 2025, for the counties of Allegany, Cattaraugus, Chautauqua, Erie, Genesee, Jefferson, Lewis, Niagara, Oneida, Orleans, Oswego, Wyoming, and contiguous counties. This Executive Order shall be in effect through February 19, 2025;FURTHER, pursuant to Section 29 of Article 2-B of the Executive Law, I direct the implementation of the State Comprehensive Emergency Management Plan and authorize, effective January 20, 2025, State agencies as necessary, and the American Red Cross, to take appropriate action to protect State property and to assist affected local governments and individuals in responding to and recovering from this disaster, and to provide such other assistance as necessary to protect the public health and safety;IN ADDITION, this declaration satisfies the requirements of 49 CFR 390.23(b), which provides relief from 49 CFR sections 395.2 and 395.5. Such relief from the federal motor carrier hours of service rules is necessary to ensure that crews can clear vital roadways and hasten the movement of utility power restoration crews into New York State;FURTHER, by virtue of the authority vested in me by Section 29-a of Article 2-B of the Executive Law to temporarily suspend or modify any statute, local law, ordinance, order, rule, or regulation, or parts thereof, if compliance with such statute, local law, ordinance, order, rule, or regulation would prevent, hinder, or delay action necessary to cope with the disaster emergency, I hereby temporarily suspend or modify, for the period from the date of this Executive Order through February 19, 2025, the following laws:Section 97-G of the State Finance Law, to the extent necessary to purchase food, supplies, services, and equipment or furnish or provide various centralized services to assist affected local governments, individuals, and other non-State entities in responding to and recovering from the disaster emergency;Section 112 of the State Finance Law, to the extent consistent with Article V, Section I of the State Constitution, and to the extent necessary to add additional work, sites and time to State contracts;Section 163 of the State Finance Law and Article 4-C of the Economic Development Law, to the extent necessary to purchase commodities, services, technology and materials without following the standard notice and procurement processes;Article 5-A of the General Municipal Law to the extent necessary to purchase supplies, services, including construction, and equipment without following the standard notice and procurement processes;Section 9 of the Public Buildings Law and Article 4-C of the Economic Development Law, to the extent necessary to authorize the award of emergency contracts in excess of one million five hundred thousand dollars;Section 38 (1),(2) and (3) of the Highway Law to the extent necessary to authorize the award of emergency contracts; andSections 375, 385 and 401 of the Vehicle and Traffic Law to the extent that exemption for vehicles validly registered in other jurisdictions from vehicle registration, equipment and dimension requirements is necessary to assist in preparedness and response to the emergency.FURTHER, I hereby temporarily modify, for the period from the date of this Executive Order through February 19, 2025, the following laws:Section 24 of the Executive Law; Sections 104 and 346 of the Highway Law; Sections 1602, 1630, 1640, 1650, and 1660 of the Vehicle and Traffic Law; Section 14(16) of the Transportation Law; Sections 6-602 and 17-1706 of the Village Law; Section 20(32) of the General City Law; Section 91 of Second Class Cities Law; and Section 107.l of Title 21 of the New York Codes, Rules and Regulations, to the extent necessary to provide the Governor with the authority to regulate traffic and the movement of vehicles on roads, highways, and streets.G I V E N under my hand and the Privy Seal of the State in the City of Albany this 20th day of January in the year two thousand twenty-five.BY THE GOVERNOR Secretary to the Governor"
