title = "2025 State of the State | Governor Kathy Hochul"
description = "Fighting for Your Family"
full_description = '''.o-hero.-noImage .o-hero__wrapper { background-image: url(''); } .o-hero.-image .o-hero__wrapper { background-image: url('https://www.governor.ny.gov/sites/default/files/styles/hero_mobile/public/2025-01/sots25_1200.jpg?h=b53cb0b4&itok=bC__OuEb'); } @media(min-width: 768px) { .o-hero.-image .o-hero__wrapper { background-image: url('https://www.governor.ny.gov/sites/default/files/styles/hero_narrow/public/2025-01/sots25_1200.jpg?h=b53cb0b4&itok=mQCtXQRk'); } } @media(min-width: 1024px) { .o-hero.-image .o-hero__wrapper { background-image: url('https://www.governor.ny.gov/sites/default/files/styles/hero_wide/public/2025-01/sots25_1200.jpg?h=b53cb0b4&itok=ykEcAdjC'); } } Programs 2025 State of the State Fighting for Your Family 2025 State of the State 2025 State of the State Book Governor Hochul delivered her 2025 State of the State Address on January 14 in Albany. It includes more than 200 initiatives that will put money back in people’s pockets, keep New Yorkers safe, and ensure the future of New York is a place where all families can thrive. Read about these policy initiatives in the 2025 State of the State Book. 2025 State of the State Book Large Print Version New Yorkers expect results and that’s why I fight day in and day out to make New York safer, healthier, cleaner, more affordable for you and your family. Governor Kathy Hochul 2025 State of the State Highlights .o-cardLogo.-index1.-paragraph3{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2024-12/inflation_refund_1280v2.jpg?h=b5f6a62e&itok=6DzhiB-F"); } .o-quickCardLogo.-index1.-paragraph3{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2024-12/inflation_refund_1280v2.jpg?h=b5f6a62e&itok=6DzhiB-F"); } @media(min-width: 768px) { .o-cardLogo.-index1.-paragraph3{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/2024-12/inflation_refund_1280v2.jpg?itok=9X_0bKhA"); } } @media(min-width: 1024px) { .o-cardLogo.-index1.-paragraph3{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2024-12/inflation_refund_1280v2.jpg?h=b5f6a62e&itok=6DzhiB-F"); } } Inflation Refund to Provide Relief to 8.6 million NY'ers Inflation Refund to Provide Relief to 8.6 million NY'ers The Inflation Refund would deliver about $3 billion in direct payments to around 8.6 million New York taxpayers statewide in 2025. .o-cardLogo.-index2.-paragraph3{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/child-tax-credit_hero-01.jpg?h=1312ab98&itok=pBWn1wHc"); } .o-quickCardLogo.-index2.-paragraph3{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/child-tax-credit_hero-01.jpg?h=1312ab98&itok=pBWn1wHc"); } @media(min-width: 768px) { .o-cardLogo.-index2.-paragraph3{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/2025-01/child-tax-credit_hero-01.jpg?itok=sH8olPgC"); } } @media(min-width: 1024px) { .o-cardLogo.-index2.-paragraph3{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/child-tax-credit_hero-01.jpg?h=1312ab98&itok=pBWn1wHc"); } } Largest Expansion Ever Proposed for Child Tax Credit Largest Expansion Ever Proposed for Child Tax Credit The proposal would give families an annual tax credit of up to $1,000 per child under age four and up to $500 per child age four through 16. .o-cardLogo.-index3.-paragraph3{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/child-care-construction-card_500x300.jpg?itok=xTaI5FeW"); } .o-quickCardLogo.-index3.-paragraph3{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/child-care-construction-card_500x300.jpg?itok=xTaI5FeW"); } @media(min-width: 768px) { .o-cardLogo.-index3.-paragraph3{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/2025-01/child-care-construction-card_500x300.jpg?itok=Hj-VrP5F"); } } @media(min-width: 1024px) { .o-cardLogo.-index3.-paragraph3{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/child-care-construction-card_500x300.jpg?itok=xTaI5FeW"); } } Making Child Care More Accessible and Affordable Making Child Care More Accessible and Affordable Governor Hochul’s proposal include committing $110 million to build new child care facilities and repair existing sites. .o-cardLogo.-index1.-paragraph4{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/subway_safety.jpg?h=a1e1a043&itok=TG1AHU0P"); } .o-quickCardLogo.-index1.-paragraph4{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/subway_safety.jpg?h=a1e1a043&itok=TG1AHU0P"); } @media(min-width: 768px) { .o-cardLogo.-index1.-paragraph4{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/2025-01/subway_safety.jpg?itok=Q0NNoaTc"); } } @media(min-width: 1024px) { .o-cardLogo.-index1.-paragraph4{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/subway_safety.jpg?h=a1e1a043&itok=TG1AHU0P"); } } Protecting Subway Riders and Transit Workers Protecting Subway Riders and Transit Workers Governor Hochul announced new steps to make our state safer and protect New Yorkers throughout the subway system. .o-cardLogo.-index2.-paragraph4{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/thumbnails/image/housing_gallery_2.jpg?h=c851a607&itok=yigjDzOL"); } .o-quickCardLogo.-index2.-paragraph4{ background-image: url("https://www.governor.ny.gov/sites/defau