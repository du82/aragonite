full_description = ".o-hero .o-hero__wrapper { background-image: linear-gradient(rgba(0, 0, 0, 0.75),rgba(0, 0, 0, 0.75)), url(''); } .o-hero.-noImage .o-hero__wrapper { background-image: url(''); } @media(min-width: 768px) { .o-hero .o-hero__wrapper { background-image: linear-gradient(to right,#000,rgba(0,0,0,0.25) 50%,rgba(0,0,0,0)), url(''); } } @media(min-width: 1024px) { .o-hero .o-hero__wrapper { background-image: linear-gradient(to right,#000,rgba(0,0,0,0.25) 50%,rgba(0,0,0,0)), url(''); } } Executive Order February 23, 2025 No. 47.2: Declaring a Disaster Emergency in the State of New York and Ordering Into Active Service the New York National Guard to Assist Authorities in Guaranteeing Public Order and Protection of Public Property at Various Correctional Facilities No. 47.2: Declaring a Disaster Emergency in the State of New York and Ordering Into Active Service the New York National Guard to Assist Authorities in Guaranteeing Public Order and Protection of Public Property at Various Correctional Facilities Executive Order 47.2 Declaring a Disaster Emergency in the State of New York and Ordering Into Active Service the New York National Guard to Assist Authorities in Guaranteeing Public Order and Protection of Public Property at Various Correctional Facilities. Download No. 47.2 E X EC U T I V E O R D E R DECLARING A DISASTER EMERGENCY IN THE STATE OF NEW YORK AND ORDERING INTO ACTIVE SERVICE THE NEW YORK NATIONAL GUARD TO ASSIST AUTHORITIES IN GUARANTEEING PUBLIC ORDER AND PROTECTION OF PUBLIC PROPERTY AT VARIOUS CORRECTIONAL FACILITIES WHEREAS, on February 19, 2025, I issued Executive Order 47 declaring a State Disaster Emergency in the State of New York arising from an illegal and unlawful strike by correction officers that began on February 17, 2025, and has continued thereafter;NOW THEREFORE, I, Kathy Hochul, by virtue of the authority vested in me by Section 29-a of Article 2-B of the Executive Law to temporarily suspend or modify any statute, local law, ordinance, order, rule, or regulation, or parts thereof, if compliance with such statute, local law, ordinance, order, rule, or regulation would prevent, hinder, or delay action necessary to cope with the disaster emergency, I hereby temporarily suspend or modify, for the period from the date of this Executive Order through March 21, 2025, the following laws:Section 11 of the General Business Law, as applicable to any action seeking judicial relief regarding alleged violations of Section 210 of the Civil Service Law; andSection 19(4) of the Correction Law, to the extent necessary, to pay additional compensation and/or increased overtime rates of pay to superintendents who continue to work in correctional facilities during the illegal strike. Such suspension shall be deemed effective as of February 17, 2025. G I V E N under my hand and the Privy Seal of the State in the City of Albany this twenty third day of February in the year two thousand twenty-five. BY THE GOVERNOR Secretary to the Governor Translations Arabic Translation الترجمة إلى العربية Download Bengali Translation বাংলা অনুবাদ Download Chinese Translation 中文翻譯 Download French Translation Traduction en français Download Haitian-Creole Translation Tradiksyon kreyòl ayisyen Download Italian Translation Traduzione italiana Download Korean Translation 한국어 번역 Download Polish Translation Polskie tłumaczenie Download Russian Translation Перевод на русский язык Download Spanish Translation Traducción al español Download Urdu Translation پیلے رنگ سے نمایاں کردہ ٹیکسٹ Download Yiddish Translation אידישע איבערטייטשונג Download"
