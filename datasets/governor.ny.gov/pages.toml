full_description = '''.o-hero .o-hero__wrapper { background-image: url('https://www.governor.ny.gov/sites/default/files/styles/hero_mobile/public/2025-02/housingrochesterhero.jpg?h=07da02da&itok=uS7WW-23'); } @media(min-width: 768px) { .o-hero .o-hero__wrapper { background-image: url('https://www.governor.ny.gov/sites/default/files/styles/hero_narrow/public/2025-02/housingrochesterhero.jpg?h=07da02da&itok=qlgZH17u'); } } @media(min-width: 1280px) { .o-hero .o-hero__wrapper { background-image: url('https://www.governor.ny.gov/sites/default/files/styles/hero_wide/public/2025-02/housingrochesterhero.jpg?h=07da02da&itok=Cs_brBsl'); } .o-hero .o-hero__wrapper.-right { background-image: url('https://www.governor.ny.gov/sites/default/files/styles/hero_wide/public/2025-02/housingrochesterhero.jpg?h=07da02da&itok=Cs_brBsl'); } .o-hero .o-hero__wrapper.-bottom { background-image: url('https://www.governor.ny.gov/sites/default/files/styles/hero_wide/public/2025-02/housingrochesterhero.jpg?h=07da02da&itok=Cs_brBsl'); } } February 28, 2025 Leveling the Playing Field of Homeownership Governor Hochul's 2025 State of the State proposal gives more families an opportunity to become homeowners by disincentivizing institutional investors from buying family homes. Fighting for New Yorkers Stay Updated Get updates from Governor Hochul's office about issues important to you. Sign Up Stay Updated Get updates from Governor Hochul's office about issues important to you. Sign Up 2025 State of the State Governor Hochul delivered her 2025 State of the State Address on January 14 in Albany. It includes more than 200 initiatives that will put money back in people’s pockets, keep New Yorkers safe, and ensure the future of New York is a place where all families can thrive. Read about these policy initiatives in the 2025 State of the State Book. 2025 State of the State Book State of the State Highlights FY 2026 EXECUTIVE BUDGET Governor Hochul unveiled a balanced budget for FY 2026 that contains record investments that support New Yorkers without raising income taxes. The Executive Budget will deliver more than $5 billion in tax cuts, credits and refunds to New York families, while making record investments in education and health care and keeping $21 billion in reserves. Budget Details .o-cardLogo.-index1.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/NewLawsCard.jpg?h=54497f27&itok=wR7fEBi7"); } .o-quickCardLogo.-index1.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/NewLawsCard.jpg?h=54497f27&itok=wR7fEBi7"); } @media(min-width: 768px) { .o-cardLogo.-index1.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/2025-01/NewLawsCard.jpg?itok=_aAmLqrC"); } } @media(min-width: 1024px) { .o-cardLogo.-index1.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/NewLawsCard.jpg?h=54497f27&itok=wR7fEBi7"); } } Making New York State More Affordable Governor Hochul's "Money in Your Pockets" Agenda helps address the cost of living and puts money back in the pockets of millions of hard-working New Yorkers. Affordability Agenda Details Recent Actions .o-cardLogo.-index1.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/inflation_refund_1280v2.jpg?h=b5f6a62e&itok=TPVLmvvQ"); } .o-quickCardLogo.-index1.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/inflation_refund_1280v2.jpg?h=b5f6a62e&itok=TPVLmvvQ"); } @media(min-width: 768px) { .o-cardLogo.-index1.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/2025-01/inflation_refund_1280v2.jpg?itok=1RaRTmVb"); } } @media(min-width: 1024px) { .o-cardLogo.-index1.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/inflation_refund_1280v2.jpg?h=b5f6a62e&itok=TPVLmvvQ"); } } Inflation Refund to Provide Relief to 8.6 million NY'ers Inflation Refund to Provide Relief to 8.6 million NY'ers Governor Hochul is proposing about $3 billion in direct payments to around 8.6 million New York taxpayers statewide in 2025. .o-cardLogo.-index2.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/distraction-free-school_hero-01.jpg?h=3af41558&itok=ZNYb32OI"); } .o-quickCardLogo.-index2.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/distraction-free-school_hero-01.jpg?h=3af41558&itok=ZNYb32OI"); } @media(min-width: 768px) { .o-cardLogo.-index2.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/2025-01/distraction-free-school_hero-01.jpg?itok=5fLBsP_j"); } } @media(min-width: 1024px) { .o-cardLogo.-index2.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/distraction-free-school_hero-01.jpg?h=3af41558&itok=ZNYb32OI"); } } Ensuring Distraction-Free Learning in New York Ensuring Distraction-Free Learning in New York Governor Hochul launched her proposal to restrict smartphone usage in schools to ensure distraction-free learning for students. .o-cardLogo.-index3.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2023-08/doctor_patient_woman_1280_0.jpg?h=febbe5d5&itok=IUZu5Jqz"); } .o-quickCardLogo.-index3.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2023-08/doctor_patient_woman_1280_0.jpg?h=febbe5d5&itok=IUZu5Jqz"); } @media(min-width: 768px) { .o-cardLogo.-index3.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/2023-08/doctor_patient_woman_1280_0.jpg?itok=bYClyvPS"); } } @media(min-width: 1024px) { .o-cardLogo.-index3.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2023-08/doctor_patient_woman_1280_0.jpg?h=febbe5d5&itok=IUZu5Jqz"); } } Abortion in New York State: Know Your Rights Abortion in New York State: Know Your Rights New York State will ensure that abortion remains safe, legal, and accessible for all who need it. GOVERNOR Kathy Hochul Biography Kathy Hochul is the 57th and first female Governor of New York State.Governor Kathy Hochul began her career in public service on her local Town Board before serving as Erie County Clerk, and then as a member of Congress for New York’s 26th Congressional District. She more recently served in statewide office as Lieutenant Governor and now as the first female Governor of the State of New York. Learn More'''
