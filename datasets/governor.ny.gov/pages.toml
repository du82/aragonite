description = "Your Family is My Fight"
full_description = '''.o-hero.-noImage .o-hero__wrapper { background-image: url(''); } .o-hero.-image .o-hero__wrapper { background-image: url('https://www.governor.ny.gov/sites/default/files/styles/hero_mobile/public/2025-01/executivebudget1200.jpg?h=df3d2bf2&itok=xGYlYBnv'); } @media(min-width: 768px) { .o-hero.-image .o-hero__wrapper { background-image: url('https://www.governor.ny.gov/sites/default/files/styles/hero_narrow/public/2025-01/executivebudget1200.jpg?h=df3d2bf2&itok=5tzf9CHq'); } } @media(min-width: 1024px) { .o-hero.-image .o-hero__wrapper { background-image: url('https://www.governor.ny.gov/sites/default/files/styles/hero_wide/public/2025-01/executivebudget1200.jpg?h=df3d2bf2&itok=FuIvWrZz'); } } Programs FY 2026 Executive Budget Your Family is My Fight FY 2026 Executive Budget Stay Updated Get updates from Governor Hochul about the New York State Budget. Sign up Stay Updated Get updates from Governor Hochul about the New York State Budget. Sign up Executive Budget Overview Governor Hochul unveiled a balanced budget for FY 2026 that contains record investments that support New Yorkers without raising income taxes.The Executive Budget will deliver more than $5 billion in tax cuts, credits and refunds to New York families, while making record investments in education and health care and keeping $21 billion in reserves. This year’s budget will put money back in New Yorkers’ pockets and make our streets and subways safer. Working together with my partners in the Legislature, we can get this done and make New York the best place in the country to raise a family.” Governor Kathy Hochul Watch: Governor Hochul's FY 2026 Budget Address Play this youtube video Governor Hochul's FY 2026 Budget Address Governor Hochul's FY 2026 Budget Address https://www.youtube.com/embed/9ispBP_kfao FY 2026 Executive Budget Highlights .o-cardLogo.-index1.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/inflation_refund_1280v2.jpg?h=b5f6a62e&itok=TPVLmvvQ"); } .o-quickCardLogo.-index1.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/inflation_refund_1280v2.jpg?h=b5f6a62e&itok=TPVLmvvQ"); } @media(min-width: 768px) { .o-cardLogo.-index1.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/2025-01/inflation_refund_1280v2.jpg?itok=1RaRTmVb"); } } @media(min-width: 1024px) { .o-cardLogo.-index1.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/inflation_refund_1280v2.jpg?h=b5f6a62e&itok=TPVLmvvQ"); } } Addressing the Cost of Living Addressing the Cost of Living The Executive Budget includes the State's first-ever Inflation Refund, increases the Child Tax Credit and cuts middle-class taxes. .o-cardLogo.-index2.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/thumbnails/image/CrimeSceneTape_Police_GunViolence_hero2.jpg?h=48c7b732&itok=35G6I3m1"); } .o-quickCardLogo.-index2.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/thumbnails/image/CrimeSceneTape_Police_GunViolence_hero2.jpg?h=48c7b732&itok=35G6I3m1"); } @media(min-width: 768px) { .o-cardLogo.-index2.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/thumbnails/image/CrimeSceneTape_Police_GunViolence_hero2.jpg?itok=gHdmmCx3"); } } @media(min-width: 1024px) { .o-cardLogo.-index2.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/thumbnails/image/CrimeSceneTape_Police_GunViolence_hero2.jpg?h=48c7b732&itok=35G6I3m1"); } } Fighting Crime and Keeping New Yorkers Safe Fighting Crime and Keeping New Yorkers Safe Governor Hochul is doubling down on proven crime-fighting investments, including gun violence prevention programs. .o-cardLogo.-index3.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2023-10/Affordable-Housing-Generic-Hero.jpg?h=b08ee015&itok=N54h4jYR"); } .o-quickCardLogo.-index3.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2023-10/Affordable-Housing-Generic-Hero.jpg?h=b08ee015&itok=N54h4jYR"); } @media(min-width: 768px) { .o-cardLogo.-index3.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/2023-10/Affordable-Housing-Generic-Hero.jpg?itok=L143pZQX"); } } @media(min-width: 1024px) { .o-cardLogo.-index3.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2023-10/Affordable-Housing-Generic-Hero.jpg?h=b08ee015&itok=N54h4jYR"); } } Building More Housing to Increase Supply Building More Housing to Increase Supply The Executive Budget works to increase the housing supply, supports Pro-Housing Communities and offers incentives for first-time homebuyers. .o-cardLogo.-index4.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2024-02/mid-hudson-dri_hero-02.jpg?h=93ab165f&itok=Lq6fjiq1"); } .o-quickCardLogo.-index4.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2024-02/mid-hudson-dri_hero-02.jpg?h=93ab165f&itok=Lq6fjiq1"); } @media(min-width: 768px) { .o-cardLogo.-index4.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/2024-02/mid-hudson-dri_hero-02.jpg?itok=hk8eIwAI"); } } @media(min-width: 1024px) { .o-cardLogo.-index4.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2024-02/mid-hudson-dri_hero-02.jpg?h=93ab165f&itok=Lq6fjiq1"); } } Kick-Starting Economic Growth Kick-Starting Economic Growth The Executive Budget continues to invest in communities and funds free community college for NY'ers aged 25-55 for in-demand degrees. .o-cardLogo.-index5.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2024-09/hempsteadhero1.jpg?h=b5f6a62e&itok=LRIWka45"); } .o-quickCardLogo.-index5.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2024-09/hempsteadhero1.jpg?h=b5f6a62e&itok=LRIWka45"); } @media(min-width: 768px) { .o-cardLogo.-index5.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/2024-09/hempsteadhero1.jpg?itok=CrAwJBzl"); } } @media(min-width: 1024px) { .o-cardLogo.-index5.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2024-09/hempsteadhero1.jpg?h=b5f6a62e&itok=LRIWka45"); } } A Healthy Start for Every Kid in New York A Healthy Start for Every Kid in New York Governor Hochul will end electronic device use in the classroom and continue record investments in education. .o-cardLogo.-index6.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2023-05/Mental_Health_Budget.jpg?h=260839f1&itok=TqiLnTAT"); } .o-quickCardLogo.-index6.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2023-05/Mental_Health_Budget.jpg?h=260839f1&itok=TqiLnTAT"); } @media(min-width: 768px) { .o-cardLogo.-index6.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/2023-05/Mental_Health_Budget.jpg?itok=RRNS2LQ4"); } } @media(min-width: 1024px) { .o-cardLogo.-index6.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2023-05/Mental_Health_Budget.jpg?h=260839f1&itok=TqiLnTAT"); } } Investments to Strengthen Mental Health Care Investments to Strengthen Mental Health Care The Executive Budget expands services, capacity and increases wages for mental health professionals. .o-cardLogo.-index7.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2023-04/Heat_pump.jpg?h=6e7c4d87&itok=NQoKqRj7"); } .o-quickCardLogo.-index7.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2023-04/Heat_pump.jpg?h=6e7c4d87&itok=NQoKqRj7"); } @media(min-width: 768px) { .o-cardLogo.-index7.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/2023-04/Heat_pump.jpg?itok=iGxSvNZl"); } } @media(min-width: 1024px) { .o-cardLogo.-index7.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2023-04/Heat_pump.jpg?h=6e7c4d87&itok=NQoKqRj7"); } } Largest Climate Investment In New York History Largest Climate Investment In New York History New York is continuing its global leadership on climate action including a clean energy transition and retrofitting homes with heat pumps. .o-cardLogo.-index8.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/Jamaica-Hospital-Funding_Hero-02.jpg?h=a09058ff&itok=OZU7hNGk"); } .o-quickCardLogo.-index8.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/Jamaica-Hospital-Funding_Hero-02.jpg?h=a09058ff&itok=OZU7hNGk"); } @media(min-width: 768px) { .o-cardLogo.-index8.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/2025-01/Jamaica-Hospital-Funding_Hero-02.jpg?itok=BC2iXwoL"); } } @media(min-width: 1024px) { .o-cardLogo.-index8.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2025-01/Jamaica-Hospital-Funding_Hero-02.jpg?h=a09058ff&itok=OZU7hNGk"); } } Protecting the Health and Well-Being of New Yorkers Protecting the Health and Well-Being of New Yorkers The Executive Budget strengthens our health care system through workforce development and facility improvements. .o-cardLogo.-index9.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/thumbnails/image/Traffic_Construction_Transportation.jpg?h=8f33f2e8&itok=SJV-fKXb"); } .o-quickCardLogo.-index9.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/thumbnails/image/Traffic_Construction_Transportation.jpg?h=8f33f2e8&itok=SJV-fKXb"); } @media(min-width: 768px) { .o-cardLogo.-index9.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/thumbnails/image/Traffic_Construction_Transportation.jpg?itok=3x3aXQBR"); } } @media(min-width: 1024px) { .o-cardLogo.-index9.-paragraph5{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/thumbnails/image/Traffic_Construction_Transportation.jpg?h=8f33f2e8&itok=SJV-fKXb"); } } Investing in Transformative Transportation Investing in Transformative Transportation The Executive Budget includes investments to cut commutes and invest in road, bridge and safety improvements across New York. FY 2026 Executive Budget Resources Budget Briefing Book Budget Press Release Division of Budget Website'''
