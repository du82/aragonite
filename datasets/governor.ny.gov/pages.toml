["https://governor.ny.gov/judicial-screening"]
title = "Judicial Screening | Governor Kathy Hochul"
description = "For an application, please download and complete the PDF below."
full_description = ".o-hero .o-hero__image { background-image: url(''); } .o-hero.-noImage .o-hero__image { background-image: url(''); } @media(min-width: 768px) { .o-hero .o-hero__image { background-image: url(''); } } @media(min-width: 1024px) { .o-hero .o-hero__image { background-image: url(''); } } Judicial Screening The Governor established Judicial Screening Committees to evaluate the qualifications of candidates for appointment or designation to judicial office throughout New York State, and to recommend to the Governor those persons who are highly qualified to hold judicial office.The New York State Judicial Screening Committees continuously accepts applications for the following positions:Additional Justices of the New York State Supreme Court, Appellate Division, First, Second, Third, and Fourth DepartmentsApplicants must be elected New York State Supreme Court Justices and reside in New York State.Judge of the New York State Court of ClaimsApplicants must reside in New York State, be admitted to practice law in New York for at least ten years, and be attorneys in good standing.Interim Supreme Court Justice – for sitting non-Supreme Court judges reaching the age of 70 this calendar yearSitting judges who will reach the age of 70 in the coming calendar year and wish to continue to serve may seek an Interim Supreme Court Justice appointment by the Governor, with the consent of the New York State Senate to become eligible for Certification by the Administrative Board of the Courts. Applicants should submit the requisite paperwork by March 1st of the calendar year they reach the age of 70.For more information, contact the New York State Judicial Screening Committees:By Telephone: (518) 474-1310By Email: [email protected]By Mail: Judicial Screening - State Capitol Executive Chamber, Room 225, Albany, NY 12224State Committee MembersFirst Department Committee MembersSecond Department Committee MembersThird Department Committee MembersFourth Department Committee Members Documents For an application, please download and complete the PDF below. Judicial Appointments Questionnaire Download"
