ering Serious Mental Illness Support & Resources for NY'ers Suffering Serious Mental Illness Governor Hochul announced major reforms to strengthen New York laws so those in mental health crisis get the help they need. .o-cardLogo.-index1.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/thumbnails/image/Sales_tax_credit_store_purchase_hero.jpg?h=3a92cd4e&itok=R5gYH5yO"); } .o-quickCardLogo.-index1.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/thumbnails/image/Sales_tax_credit_store_purchase_hero.jpg?h=3a92cd4e&itok=R5gYH5yO"); } @media(min-width: 768px) { .o-cardLogo.-index1.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/thumbnails/image/Sales_tax_credit_store_purchase_hero.jpg?itok=OIk2xM8L"); } } @media(min-width: 1024px) { .o-cardLogo.-index1.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/thumbnails/image/Sales_tax_credit_store_purchase_hero.jpg?h=3a92cd4e&itok=R5gYH5yO"); } } New Proposals Announced to Protect New York Consumers New Proposals Announced to Protect New York Consumers Proposals aim to protect consumers shopping online, crack down on exploitative practices, and regulate emerging industries. .o-cardLogo.-index2.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2021-06/school_playground_kids_1280.jpg?h=5825a585&itok=m2PhfTz_"); } .o-quickCardLogo.-index2.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2021-06/school_playground_kids_1280.jpg?h=5825a585&itok=m2PhfTz_"); } @media(min-width: 768px) { .o-cardLogo.-index2.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/2021-06/school_playground_kids_1280.jpg?itok=KwR4OVnm"); } } @media(min-width: 1024px) { .o-cardLogo.-index2.-paragraph6{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2021-06/school_playground_kids_1280.jpg?h=5825a585&itok=m2PhfTz_"); } } New Effort to Promote Kids’ Mental and Physical Health New Effort to Promote Kids’ Mental and Physical Health Governor Hochul announced "Unplug and Play" to get kids off their phones by funding community centers & recreational opportunities. More State of the State Information Remarks as Prepared Additional State of the State Proposals Official Program Putting Money Back in the Pockets of New Yorkers Governor Hochul's State of the State Affordability Agenda is the latest step in her ongoing commitment to help address the cost of living by putting money back in the pockets of New Yorkers statewide. Since taking office, the Hochul Administration has delivered more than $5.5 billion in supplemental payments, tax relief and rebates, as well as expanding access to child care assistance and paid leave for families and pregnant women. Learn more about how Governor Hochul is working to make life more affordable for New York families. Governor Hochul's Affordability Agenda Watch: 2025 State of the State Address https://www.youtube.com/embed/XgZU1H5Ncqo Sign Up Get updates from Governor Hochul's office about issues important to you. Sign Up Sign Up Get updates from Governor Hochul's office about issues important to you. Sign Up'''
