["https://www.governor.ny.gov/lt-governor-antonio-delgado"]
title = "Lt. Governor Antonio Delgado | Governor Kathy Hochul"
description = "Antonio Delgado is Lieutenant Governor of New York State, appointed by Governor Hochul in May 2022."
full_description = ".o-hero .o-hero__wrapper .o-bioHero__mobileImg { background-image: url('https://www.governor.ny.gov/sites/default/files/styles/hero_mobile/public/2022-05/delgado_family_swearing_in_hochul_1280.jpg?h=b5f6a62e&itok=LvHyPCSj'); } @media(min-width: 768px) { .o-hero .o-hero__wrapper .o-bioHero__mobileImg { background-image: url('https://www.governor.ny.gov/sites/default/files/styles/hero_narrow/public/2022-05/delgado_family_swearing_in_hochul_1280.jpg?h=b5f6a62e&itok=JMXZGcnC'); } } @media(min-width: 1024px) { .o-hero .o-hero__wrapper { background-image: url('https://www.governor.ny.gov/sites/default/files/styles/hero_wide/public/2022-05/delgado_family_swearing_in_hochul_1280.jpg?h=b5f6a62e&itok=kM7vY1sC'); } } Lieutenant Governor of New York State Antonio Delgado Antonio Delgado on facebook Antonio Delgado on X Antonio Delgado on instagram Contact the Lieutenant Governor’s Office Phone: 518-402-2292 Email: [email protected] Antonio Delgado is Lieutenant Governor of New York State, appointed by Governor Kathy Hochul in May 2022.Family, Education and Early CareerLieutenant Governor Delgado is from Schenectady, NY, and lives in Rhinebeck with his wife, Lacey, and their twin sons, Maxwell and Coltrane. Growing up, his parents worked for General Electric in Schenectady, demonstrating the values of hard work and commitment to community. That hard-working spirit has stayed with him throughout his life: he earned a Rhodes Scholarship while attending Colgate University in Hamilton, NY, and after returning home from Oxford, he received a law degree from Harvard Law School. Before serving as Lieutenant Governor, Delgado enjoyed a career in the music industry focused on empowering young people through hip hop; worked as an attorney focusing on complex commercial litigation, while dedicating significant time to pro bono work in connection with criminal justice reform; and served in the U.S. House representing New York’s 19th Congressional District. It's because of these diverse professional and personal experiences that Delgado finds common ground with people from all walks of life.In CongressDelgado was the first person of color to represent upstate New York in Congress. While there, he focused on improving the lives of New Yorkers, working with local, state, and federal partners — regardless of party — to get results. From improving access to quality, affordable health care, to fighting for universal Pre-K, to serving our nation’s veterans, to protecting our small businesses and family farms, Delgado was an effective legislator who achieved results. Eighteen of his bills were signed into law under two different presidents and he was recognized by various organizations throughout his tenure in Congress for his bipartisan work. His legislative accomplishments include passage of his Family Farmer Relief Act, the Strengthening Financial Aid for Students Act, and the Improving Benefits for Underserved Veterans Act, among others. When the pandemic hit, Delgado shifted his focus to securing federal support for frontline and essential workers and small businesses. He successfully secured much-needed loan repayment relief for small businesses and his Direct Support for Communities Act delivered $10.8 billion to New York State counties, cities, towns, and villages for economic recovery.Delgado served as Chairman of the House Agriculture Subcommittee on Commodity Exchanges, Energy, and Credit as well as the House Small Business and Transportation & Infrastructure Committees."
