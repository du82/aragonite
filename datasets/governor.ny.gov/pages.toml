["https://governor.ny.gov/about-governor-hochul"]
title = "About | Governor Kathy Hochul"
description = "Kathy Hochul is the 57th and first female Governor of New York State."
full_description = '''.o-hero .o-hero__wrapper .o-bioHero__mobileImg { background-image: url('https://www.governor.ny.gov/sites/default/files/styles/hero_mobile/public/2021-08/LGOption3.jpg?h=b5f6a62e&itok=bKQtWAGv'); } @media(min-width: 768px) { .o-hero .o-hero__wrapper .o-bioHero__mobileImg { background-image: url('https://www.governor.ny.gov/sites/default/files/styles/hero_narrow/public/2021-08/LGOption3.jpg?h=b5f6a62e&itok=Qilj9jMb'); } } @media(min-width: 1024px) { .o-hero .o-hero__wrapper { background-image: url('https://www.governor.ny.gov/sites/default/files/styles/hero_wide/public/2021-08/LGOption3.jpg?h=b5f6a62e&itok=AyQT5oEB'); } } The 57th Governor of New York State Kathy Hochul Kathy Hochul on facebook Kathy Hochul on X Kathy Hochul on instagram Kathy Hochul on youtube Kathy Hochul on flickr Kathy Hochul on soundcloud Kathy Hochul is the 57th and first female Governor of New York State. She began her career in public service on her local Town Board, before serving as Erie County Clerk and as a Member of Congress for New York’s 26th Congressional District. As Lieutenant Governor, she chaired the statewide Regional Economic Development Councils, and served as co-chair of the State’s Heroin and Opioid Task Force, Women’s Suffrage Commission, and Child Care Availability Task Force. Since being sworn into office in 2021, Governor Hochul has led by establishing a bold vision for New York’s future. Governor Hochul has spearheaded comprehensive policies and initiatives to help New Yorkers and their families, while building an economy that is stronger and more inclusive than before. Governor Hochul is making historic investments in the people, places, and things to make that happen – from healthcare workers, small businesses, and working families to infrastructure, education, and workforce development. And in the wake of the U.S. Supreme Court’s reckless decisions to strip away abortion rights and strike down commonsense gun regulations, Governor Hochul led the charge in Albany to protect reproductive health care and strengthen gun safety laws, ensuring New York continues to stand as a beacon of hope and freedom for the rest of the nation. Governor Hochul was born and raised in Western New York. She and her husband, Bill Hochul, are the proud parents of two children and one granddaughter. Governor Hochul enjoys the Erie County Fair in Hamburg. Speaking at a Paid Family Leave for All Event in Albany. Then-Lieutenant Governor Hochul briefs the media on remaining road closures in and around Buffalo after heavy lake effect snow in January 2015. Promoting free snowmobiling weekend at The Ridgeview Inn in Lowville, New York. Then-Lieutenant Governor Kathy Hochul delivers remarks at the Annual New York State Police Officers' Memorial Remembrance Ceremony in Albany, May 2015. Then-Lieutenant Governor Hochul delivers remarks at the 10th Mountain Division Memorial Ceremony honoring active duty military and veterans in Wilmington. Learn More .o-cardLogo.-index1.-paragraph4{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2022-05/delgado_family_swearing_in_hochul_1280.jpg?h=b5f6a62e&itok=rh74-36i"); } .o-quickCardLogo.-index1.-paragraph4{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2022-05/delgado_family_swearing_in_hochul_1280.jpg?h=b5f6a62e&itok=rh74-36i"); } @media(min-width: 768px) { .o-cardLogo.-index1.-paragraph4{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_horizontal/public/2022-05/delgado_family_swearing_in_hochul_1280.jpg?itok=xFmH4NAv"); } } @media(min-width: 1024px) { .o-cardLogo.-index1.-paragraph4{ background-image: url("https://www.governor.ny.gov/sites/default/files/styles/card_vertical/public/2022-05/delgado_family_swearing_in_hochul_1280.jpg?h=b5f6a62e&itok=rh74-36i"); } } Learn about Lt. Governor Delgado .o-cardLogo.-index2.-paragraph4{ background-image: url("https://www.gov