["https://gpgtools.org"]
title = "GPG Suite"
description = "Everything you need to get started with secure communication and encrypting files in one simple package leveraging the power of OpenPGP/GPG"
full_description = "2024-09-16: GPG Suite beta includes a GPG Mail version that supports the just released macOS Sequoia. Download here. Use GPG Suite to encrypt, decrypt, sign and verify files or messages. Manage your GPG Keychain with a few simple clicks and experience the full power of GPG easier than ever before. integrates the full power of GPG seamlessly into macOS Mail. Protecting your emails has never been so simple. allows you to manage your OpenPGP keys. Create new keys, modify existing ones and import your colleagues' keys from a key server. integrates the power of GPG into almost any application via the macOS Services context menu. It allows you to encrypt/decrypt, sign/verify text selections, files, folders and much more. is the underlying encryption engine of GPG Suite. If you are familiar with the command line, you can use its raw powers. Based on the latest version of GnuPG. When creating a key, you have the option to upload it to a key server, which makes it very easy for your friends to find and import it. When creating a key, you can enable the advanced view, which lets you choose key size, expiration date and algorithm to use for your keys. Have full control over your keys. gives you quick access to the most important actions. Create a new key, import or export an existing key, or search for a specific key using the search field. Select a key and right-click on it to bring up a context menu, letting you send your key to a key server, update or manage the details of your key. After installing GPG Suite, you'll see two new buttons when writing a new email: the lock button and the sign button next to it. Activate the lock button to encrypt an email. Only you and the recipient will be able to read the contents of your message. Toggle between encrypting and not encrypting your email pressing ⌥ ⌘ Y. Activate the sign button to sign an email. The recipient will be able to tell, that the email came from you and whether or not it was tampered with in any way. Using the security method indicator in the upper right corner, you can quickly switch between PGP and S/MIME. This is very handy if you use both."
