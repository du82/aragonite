["https://gpgtools.org/sequoia"]
title = "GPG Suite"
description = "Everything you need to get started with secure communication and encrypting files in one simple package leveraging the power of OpenPGP/GPG"
full_description = "2024-09-16: GPG Suite beta includes a GPG Mail version that supports the just released macOS Sequoia. Download here. GPG Mail for macOS Sonoma and later is now a Mail Extension based on Apple's official API to enhance macOS Mail. If you plan to use GPG Mail for macOS Sonoma or later in production, please make sure to have a look at the list of Known Issues below. To provide you the best OpenPGP experience possible on macOS, we continue working with Apple to fix the remaining issues. Please read the known issues and potential workarounds to get the best experience and stability out of this beta version of GPG Mail for macOS Sonoma. In case the extension crashes or Mail loses the connection for some other reason, the compose window UI doesn't reflect that and might still show the encrypt and sign button as enabled, but the message might be sent in plain instead of being sent encrypted. If offline mode is enabled or no internet connection is available, each message will show an empty body. While previous versions of GPG Mail were able to automatically toggle encryption and signing in case of a reply to a signed and encrypted message or toggle the encryption and sign button based on user configured defaults, that is currently no longer possible. Instead the last toggled state of the sign and encryption button will be remembered and restored when composing new messages. None. Pay special attention to verify that the sign and encrypt buttons are toggled to the state you would expect. At the moment it is not possible to encrypt drafts, since they can't always be reliably decrypted which could result in data loss of the draft content.If existing encrypted drafts are continued, the draft content will be stored in plain on the mail server. In case the user starts composing a reply to an encrypted message, GPG Mail does not know whether or not the original message was encrypted and thus is not able to warn the user in case they are about to reply in plain due to missing recipient public keys for example."
year_published = 2025
