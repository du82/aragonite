["https://gpgtools.org/releases/gpgsuite/release-notes.html"]
title = "GPG Suite - Release Notes"
full_description = '''GPG Suite 2023.3 July 23rd, 2023 macOS 13.5 introduces changes in macOS Mail which lead to a crash when running a version of GPG Mail < 7.2. In order to continue using GPG Mail 7 on macOS 13.5, make sure to install this update of GPG Suite. Adapts GPG Mail 7 to changes of Mail in macOS 13.5 A method of macOS Mail that was previously used by GPG Mail to create outgoing messages has been removed and replaced by a new one GPG Mail 7.2 addresses that change and calls the new method if available GPG Mail 7.2 (macOS Ventura) Fixes Fixes a problem where macOS Mail would crash as GPG Mail is calling a method that no longer exists in Mail for macOS 13.5 [#1148] Makes sure to suppress macOS Mail's "public key not available"-dialog when the user is trying to reply to an encrypted message in plain, as GPG Mail's warning is already shown [#1144] GPG Suite 2023.2 March 26th, 2023 macOS 13.3 introduces changes to macOS Mail which require an update of the GPG Mail loader bundle. In order to continue using GPG Mail 7 on macOS 13.3, make sure to install this update of GPG Suite. Adapts GPG Mail 7 to changes of Mail in macOS 13.3 Adds the new mailbundle UUID introduced in macOS 13.3 to GPG Mail 7 GPG Suite 2023.1 February 28th, 2023 Draft saving and sending error on macOS 13.2 Under specific circumstances, saving a draft or sending a reply to an encrypted or sign message failed with an error that attachments are too large or that the message could not bet sent GPG Mail 7.1 (macOS Ventura) Improvements Automatic activation of GPG Mail with a support plan is now silent by default. The behavior can be configured via SupportPlanAutomaticActivationShowSuccessDialog and SupportPlanAutomaticActivationSuppressErrorDialog Adds proper support for iCloud's Hide-My-Email addresses [#1137] Fixes Fixes a problem where saving a draft or sending a reply to an encrypted or signed message was not possible when replying the successful activation dialog would be shown on every Mail launch in case automatic support plan activation was configured [#1135] Fixes an error where Mail believed that public key for encryption were missing when continuing a draft and attempting to sending it not encrypted [#1133] GPG Mail 6.3 (macOS Monterey) Fixes Fixes a crash when using iCloud's Hide-My-Email addresses [#1137] Fixes a problem where saving a draft or sending a reply to an encrypted or signed message was not possible when an S/MIME certificate was available, but the user switch the security method to "OpenPGP" [#1135] GPG Keychain 1.12 Improvements Automatically converts OpenPGP key server URLs if the http(s) scheme is used instead of hkp(s) [#547] Renames "Preferences" to "Settings" to match the new macOS Ventura style [#542] Fixes Adds missing strings for "Yes" and "No" button when uploading a public key to a verifying key server [#543] MacGPG 2.2.41 Improvements Integrates GnuPG 2.2.41 [#776] GPG Suite 2022.2 October 24th, 2022 GPG Mail 7 adds support for macOS Ventura GPG Mail 7 is a paid upgrade. As a token of our appreciation we would like to offer you a 30% upgrade discount if you have already purchased a GPG Mail Support Plan in the past. If you are not on macOS Ventura yet, feel free to keep using your current GPG Mail version with your active GPG Mail Support Plan for as long as you want. Includes GnuPG 2.2.40 GnuPG 2.2.40 with the latest version of libksba fixes CVE-2022-3515. The libksba security bug affects mainly S/MIME which is not used by our tools. It also affects dirmngr however when used in combination with a web key directory. Replaces the no longer active pool of sks-keyservers.net with Ubuntu's hockeypuck based key server as optional fallback in GPG Keychain, when keys.openpgp.org is configured but doesn't return any results for a key search. GPG Mail 7.0 (macOS Ventura only) New Adds compatibility for macOS Ventura [#1125] Fixes Fixes a problem where the successful activation dialog would be shown on every Mail launch in case automatic support plan activation was configured Alerts the user to manually close Mail in order for the GPG Mail Upgrader to complete in case Mail can't be closed automatically. This most often occured when a modal dialog blocked Mail from closing GPG Keychain 1.11 New Uses Ubuntu's hockeypuck keyserver as optional fallback in case a key search leads to no results from keys.openpgp.org and that is configured as default keyserver [#763] Fixes Pinentry is no longer shown when creating a new key GPG Services 2.5 Improvements Improves error message when decryption fails due to a missing secret key Fixes Fixes a problem where previously selected keys were not shown on top of the key list [#286] MacGPG 2.2.40 Improvements Integrates GnuPG 2.2.40 [#773] Upgrades Libksba to version 1.6.2 which fixes CVE-2022-3515 Libmacgpg 1.5.1 New Uses Ubuntu's hockeypuck keyserver as optional fallback in case a key search leads to no results from keys.openpgp.org and that is configured as default keyserver [#187] Fixes Fixed a problem where Pinentry was launched during key generation in some cases, even though a passphrase-fd was specified. This resulted in an additional Pinentry request when creating a new key [#186] GPG Suite 2022.1 March 7th, 2022 Includes GPG Mail 6.2 which is required for macOS 12.3. If you are running macOS Monterey, this upgrade is necessary to keep using GPG Mail without interruption. GPG Mail 6.2 (macOS Monterey) New Adds compatibility for macOS 12.3 [#1110] Fixes Fixes a problem where GPG Mail could be removed after an OS upgrade. Now the GPG Mail Upgrader is run to re-enable it again [#1109] Fixes a problem where Mail in some cases would show a random error message during composing [#1108] Fixes an issue around BCC usage [#1118] Fixes a problem where sign and encrypt status might not match the user's last decision when continuing to edit an encrypted draft which is to be sent out from a sender address for which no OpenPGP key is available [#1114, #1115, #1116, #1117] GPG Keychain 1.10 New New square app icon to match icon style on macOS Big Sur and later [#526] GPG Services 2.4 Improvements Always show the signer's fingerprint in case verified data was signed with an untrusted key [#281] Fixes Fixes a problem where encrypting with password and signing at the same time could result in an error message [#276] Fixes a problem where incorrect number of selected keys could be shown below key list MacGPG 2.2.34 Improvements Integrate GnuPG 2.2.34 [#766] Libmacgpg 1.5 Improvements Better dialogs concerning key expiration GPG Suite 2021.3 December 14th, 2021 Includes GPG Mail 6.1 which is required for macOS 12.1 Revamp of the GPG Services verification UI New icons make it easier to distinguish between untrusted and trusted signatures of signed files Trusted signatures show a green checkmark Untrusted signatures (created with untrusted keys) show a yellow checkmark Invalid or otherwise broken signatures use red color coding GPG Mail 6.1 (macOS Monterey) New Adds compatibility for macOS 12.1 Fixes Fixes a problem where Thunderbird would display an empty message under specific circumstances [#1103] Fixes a problem on macOS 12.1 where Mail would crash when composing a new message [#1104] [#1107] GPG Services 2.3 New Revamped verification UI [#266] GPG Suite 2021.2 October 31st, 2021 GPG Mail 6 adds support for macOS Monterey GPG Mail 6 is a paid upgrade. As a token of our appreciation we would like to offer you a 30% upgrade discount if you have already purchased a GPG Mail Support Plan in the past. If you are not on macOS Monterey yet, feel free to keep using your current GPG Mail version with your active GPG Mail Support Plan for as long as you want. GPGMail 6.0 (macOS Monterey) New Support for macOS Monterey Fixes No longer displays the remote content banner if remote content is detected [#1097] GPG Keychain 1.9 Fixes Fixes sorting key list by creation and expiration date [#523] GPG Suite Preferences 2.6 Fixes Fixes a crash when users where asked if they wanted to remove the default GPGTools gnupg comment [#120] MacGPG 2.2.32 Improvements Integrate GnuPG 2.2.32 [#760] Fixes Fixes a failure when connecting to api.protonmail.ch [#758] GPG Suite 2021.1 May 21st, 2021 Support for Apple Silicon completed The previous release of GPG Suite included optimized versions of all our Apps and Services for Apple Silicon This release includes a MacGPG version optimized for Apple Silicon as well Rosetta 2 is no longer required to use GPG Suite GPGMail 5.1 (macOS Big Sur, Catalina & Mojave) Improvements Introduces flattened colors for the OpenPGP and S/MIME security method picker to better fit the look of macOS Catalina and Big Sur Shows the security method picker as a toolbar icon if the window is too narrow Automatically change security method based on senders OpenPGP keys or S/MIME certificates [#1087] Fixes Sending a signed email with an empty body could lead to a crash [#1079] The security method picker now properly pre-selects the configured default security method [#1078] Fixes a problem where custom wildcard based key mappings were not properly applied [#1080] Workaround a problem where users running Antidote Mail plugin did not see GPG Mail loader and could not load GPG Mail [#1077] Fixes keyboard shortcuts to toggle between S/MIME and OpenPGP [#1085] Fixes a problem where under rare circumstances remote content would be loaded [#1086] GPG Keychain 1.8 Improvements Centered toolbar icons in preferences window on Big Sur [#520] Fixes Fixes a problem where custom column order was not saved [#518] GPG Services 2.2 Improvements The password dialog necessary for encrypting messages or files with a password is now integrated into the main GPG Services window rendering the two separate dialogs previously used obsolete [#270] Fixes Fixes a problem where the main window was not shown when Do Not Disturb (DND) was active [#272] Fixes the scrolling performance of key lists [#275] Fixes a rare problem where too many lines were shown on key import, resulting in the dialog growing too large to fit on the screen [#274] MacGPG 2.2.27 New Full support for Apple Silicon [#751] Improvements Integrate GnuPG 2.2.27 [#754] Integrate Pinentry 1.1.1 [#756] Fixes Properly fetches certificates from macOS keychain to establish SSL/TLS connections [#752] Fixes broken key auto-retrieve mechanism [#752] GPG Suite 2020.2 November 24th, 2020 GPG Mail 5 adds support for macOS Big Sur GPG Mail 5 is a paid upgrade. As a token of our appreciation we would like to offer you a 30% upgrade discount if you have already purchased a GPG Mail Support Plan in the past. If you are not on macOS Big Sur yet, feel free to keep using your current GPG Mail version with your active GPG Mail Support Plan for as long as you want. Native Support for Apple Silicon All of our Apps and Services are optimized for Apple Silicon MacGPG will launch in Rosetta 2 compatibility mode for now but should be available soon GPGMail 5.0 (macOS Big Sur, Catalina & Mojave) New Support for macOS Big Sur Native support for Apple Silicon Improvements Optimized the regular expression engine to catch messages that might have been unrecognized before GPG Keychain 1.7 New New icons for macOS Big Sur Improvements Make sure the verified key server fallback to sks keyservers works on newer macOS versions [#513] Added an error message with additional context when a user tries to import corrupted data [#509] Fixes Ensure name and email are pre-filled when creating a key on Big Sur [#514] Fixes a problem where dragging a key to desktop would not result in an exported file [#512] Fixes a potential lockup when a key search was initiated [#510] GPG Services 2.1 Improvements 'Show in Finder' option is now part of the verification results dialog [#262] GPG Suite Preferences 2.4 Fixes Fixes and adjustments for macOS Big Sur [#116] MacGPG 2.2.24 Improvements Integrate GnuPG 2.2.24 [#749] GPG Suite 2020.1 June 8th, 2020 GPG Mail 4 adds support for macOS Catalina GPG Mail 4 is a paid upgrade. As a token of our appreciation we would like to offer you a 30% upgrade discount if you already have an active GPG Mail 3 Support Plan. If you are not yet on macOS Catalina feel free to keep using GPG Mail 3 with your active GPG Mail 3 Support Plan for as long as you want. Native system notifications for GPG Services GPG Services is now using system notifications to alert users when an operation has been completed. By default notifications will remain on the screen until the user has reacted to them. They can be configured to automatically disappear however by switching to 'Banner Style' in 'System Preferences › Notifications › GPG Services' System notifications greatly improve the experience of GPG Services and we hope you take advantage of the possibilities to tailor the notifications to your specific needs. Alert dialogs are used as a fallback if system notifications are in "Do Not Disturb"-mode Notifications for GPG Services are only available on macOS 10.14 and later. GPGMail 4.1 (macOS Catalina, Mojave & High Sierra) Improvements Display a tooltip when no signing key is available - it’s now much easier to find out why signing is not possible. While previously the encrypt and sign buttons would disappear, they now remain visible and when you hover over the sign button a tooltip with details why you can't sign, appears [#1060] Adds a space between the security header title and the signature icon when viewing signed messages [#1068] Fixes Includes a workaround for a bug in macOS Catalina which resulted in message content for partly signed / encrypted messages being cut off (scrolling was disabled) [#1057] Fixes a problem where switching security method had no effect on the security method used to protect messages that were sent. Instead outgoing messages were always protected using the default encryption method configured. [#1058] Fixes a bug where the Mail plug-in manager would not open if other bundles were installed alongside GPG Mail [#1056] Re-ordered keyboard shortcuts for the encrypt and sign buttons: use ⌥⌘Y to toggle the encrypt button and ⌥⌘X to toggle the sign button [#1067] The security method chosen to be used while composing a draft is properly restored when the users continues to edit the draft [#1061] Picks up GnuPG key ring changes again on macOS Catalina, so it is not necessary to re-start Mail if a new key is imported [#1059] Fixes a problem where GPG Mail 3 was not installed when the user customized their installation [#1069] Adds the option to switch support plan in Mail › Preferences › GPG Mail [#1064] Shows a better error message when a user tries to activate GPG Mail with a support plan that has been previously disabled [#1071] GPG Keychain 1.6 Improvements When creating a new key, GPG Keychain now checks if a valid secret key already exists for that email and will warn users, before creating a second key for the same email [#476] Search results for sks key servers show long key ID [#496] Passphrase v'''
