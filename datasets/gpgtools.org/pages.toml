["https://gpgtools.org/faq"]
title = "GPG Suite"
description = "Everything you need to get started with secure communication and encrypting files in one simple package leveraging the power of OpenPGP/GPG"
full_description = '''2024-09-16: GPG Suite beta includes a GPG Mail version that supports the just released macOS Sequoia. Download here. A release of a new major version of GPG Mail will most likely coincide with a new major macOS release, but certainly not more often than that. Yes, in order to use GPG Mail 7 – which is compatible with macOS Ventura – you need a GPG Mail 7 Support Plan. As a token of our appreciation, we would like to offer you a 30% upgrade discount if you already have an active GPG Mail Support Plan for a previous version. The short answer is no, as long as you have a valid support plan for your current macOS version, you can keep using that for as long as you don't upgrade. To benefit from the latest updates and features of GPG Mail 7 however, you will need a GPG Mail 7 Support Plan. The support plan is per person, so you will probably only need one. Currently the activations are restricted to 5 personally owned computers. If you are purchasing for a company, each employee needs their own support plan. When employees leave the company however, you can transfer the support plan to a different employee, by first deactivating GPG Mail Support Plan in "Mail › Preferences › GPG Mail" The activation code arrives via email. To activate GPG Mail open "Mail › Preferences › GPG Mail". The most likely reason is that you have exceeded your 5 possible activations or that there were characters missing from the activation code. Yes, you absolutely will. You will however no longer be able to encrypt/sign/verify emails and will be reminded that you are running a trial version of GPG Mail. Visit our Knowledge Base with instructions on how to uninstall only GPG Mail. After removing only GPG Mail, subsequent updates of GPG Suite will not install GPG Mail again. So should you change your mind you will have to download and re-install GPG Suite from our website. Paddle is our reseller which takes care of payment processing, invoicing and VAT handling. That's also the reason why you will receive an invoice directly from Paddle after completing your purchase.'''
year_published = 2025
