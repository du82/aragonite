description = "Everything you need to get started with secure communication and encrypting files in one simple package leveraging the power of OpenPGP/GPG"
full_description = "2024-09-16: GPG Suite beta includes a GPG Mail version that supports the just released macOS Sequoia. Download here. Your privacy is very important to us at GPGTools GmbH (“GPGTools”). We created this Privacy Policy to inform you about how we collect, use and store data personally related to you (“Personal Information”). If you have any questions or concerns, please let us know at private@gpgtools.org. This Privacy Policy covers all apps which are part of GPG Suite as well as the website, and our GPG Mail Support Plan activation web service. Any information, personal or not, we collect serves the purpose of providing and improving our service as well as providing support. We will only collect, use, and store your Personal Information securely in order to ensure confidentiality. We will not share your Personal Information with other parties without your prior consent, and unless it is necessary to provide our services to you. It may also be necessary to share your Personal Information to comply with the law or protect our rights. Furthermore, you have the right to be informed, at your request, about Personal Information we have collected from you and stored, as well as its origin, and the purpose of storage. In addition, you have the right to have such Personal Information corrected or deleted; in the latter case, however, we may have to cancel the service, if it is connected with that piece of information. Non-personal Information is data that does not relate to a specific person. We may combine personal and non-personal information, in which case we will treat this bundle of information as Personal Information for as long as it remains combined. Service Partners are entities different to GPGTools that provide services to GPGTools that contribute to the functioning and improvement of the all apps which are part of GPG Suite as well as the website, and our GPG Mail Support Plan activation web service. For traffic analysis we use Matomo, an open source web analytics platform. We collect our website visitors’ nonpersonal information. All data, including the IP address, is anonymized before storing. As we only use this data for statistical analysis and website improvement, we do not combine it with other data or information. This data is deleted after 6 months."
