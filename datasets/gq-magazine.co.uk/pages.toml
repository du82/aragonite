title = "How Mikey Madison charmed Hollywood | British GQ"
description = "At 25, Anora’s enigmatic lead could become the youngest best actress winner in over a decade. Mikey Madison's just trying to enjoy the moment."
full_description = '''GQ HypeHow Mikey Madison charmed HollywoodAt 25, Anora’s enigmatic lead could become the youngest best actress winner in over a decade. She’s just trying to enjoy the momentBy Molly LambertPhotography by Morgan Maher7 February 2025Shirt by Vintage. Shorts by Brunello Cucinelli. Jewellery by Tiffany & Co.It's a particularly surreal day to be Mikey Madison. For a few months, she's been tunnel-visioned on one thing: the long, relentless awards campaign for Anora, Sean Baker’s drama about an exotic dancer whose too-good-to-be-true romance with the son of an oligarch is threatened when his family comes to town, which was released way back in October. Just when she had come to terms with this new reality – days filming Variety's iconic Actors on Actors video with Pamela Anderson, nights taking her father to awards parties and attending the Golden Globes – everything came to an abrupt standstill. “Everything kind of came to a screeching halt because of what's happening in Los Angeles,” Madison says, referring to the harrowing wildfires that have been ravaging the area.In west Hollywood in early January, the sky is clear and bright baby blue. Aside from the unusual lunch-hour emptiness of the vegan bistro Crossroads Kitchen, if you didn’t know any better, you’d think it was just another day in LA, but in reality, both sides of the city are still on fire. When we meet, Madison has just been nominated for a BAFTA for best actress, and the Oscar nominations will be announced in a couple of days – and yes, she will pick one up, as was expected by anyone paying attention – but the campaign is more or less on pause, because how could you be thinking about golden statues at a time like this? And yet here we are, talking about just that. Madison immediately acknowledges the inherent strangeness of this contrast: “It's so weird to be where we are right now, and it kind of feels like business as usual, and then just a handful of miles away, there's so much craziness happening,” she says. She’s been doing her part, donating to GoFundMes for people who lost everything and sending clothes to supply drives for the thousands of people who lost everything to the fires: “I just want to help more.”<img alt="Image may contain Mikey Madison Adult Person Publication Face Head Photography Portrait and Advertisement" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67a56ff696d8a43b6fd94137/master/w_1600%2Cc_limit/IMG_8451%2520(1).png" srcSet="https://media.gq-magazine.co.uk/photos/67a56ff696d8a43b6fd94137/master/w_120,c_limit/IMG_8451%20(1).png 120w, https://media.gq-magazine.co.uk/photos/67a56ff696d8a43b6fd94137/master/w_240,c_limit/IMG_8451%20(1).png 240w, https://media.gq-magazine.co.uk/photos/67a56ff696d8a43b6fd94137/master/w_320,c_limit/IMG_8451%20(1).png 320w, https://media.gq-magazine.co.uk/photos/67a56ff696d8a43b6fd94137/master/w_640,c_limit/IMG_8451%20(1).png 640w, https://media.gq-magazine.co.uk/photos/67a56ff696d8a43b6fd94137/master/w_960,c_limit/IMG_8451%20(1).png 960w, https://media.gq-magazine.co.uk/photos/67a56ff696d8a43b6fd94137/master/w_1280,c_limit/IMG_8451%20(1).png 1280w, https://media.gq-magazine.co.uk/photos/67a56ff696d8a43b6fd94137/master/w_1600,c_limit/IMG_8451%20(1).png 1600w" sizes="100vw"/>Jacket and skirt by Gucci. Shoes by Vintage Converse. Jewellery by Tiffany & Co. Despite having been named as a frontrunner for best actress as early as Anora’s Cannes premiere last May, Madison’s unique position in this race should not be understated. At 25, she would be the youngest recipient of the award since Jennifer Lawrence in 2013. She is certainly the only person to migrate from Scream villain to Oscar nominee within the space of three years. But Madison has been on the grind since her teens. “Lots of people have no idea who I am,” she tells me. She has barely been able to process her own sudden rise, which she feels will make more sense in the rearview. “A lot of it feels surreal,” she says. “But I think I'm so much just in my own world that I'm taking it in at a slower pace, and then I'll have a realisation later of like, ‘Wow, I actually did that.’”After spending six years on dramedy Better Things as creator and star Pamela Adlon’s daughter, she’s built a career in film on the back of attention-grabbing appearances like her live-wire take on Manson girl Sadie in Quentin Tarantino’s Once Upon a Time… in Hollywood. As a young cinephile, Madison was already a Tarantino superfan. “Seeing his films genuinely changed my life,” she says of the director. She connected with him instantly during her audition for the 2019 film, where she showed up in a colourful vintage ’60s dress and a fur coat, barefoot and clutching a painting she’d made for him as a gift. It was Madison’s performance in Once Upon a Time… and wild heel turn in 2022’s Scream (no spoilers) that caught the attention of Baker, who contacted her after seeing it to get coffee and discuss a film he wanted to write for her.I think people expect something, and then when they get me, I wonder if they’re disappointed. But I can't be anyone other than myself, right?Baker recalls how Mikey’s acid-soaked turn as Sadie (based on real-life Manson family member Susan Atkins) knocked him flat on his back. “She comes out of nowhere in the last 15 minutes of the film,” he says. “And I'm like, ‘Oh my God, who is that?’ She has such an impactful persona and performance in that film. I saw it again because I really liked the film, and then I went back a third time simply to watch her scenes.” He kept her filed in his mind for a future project. “There was something unique about her. I think that she had something different from what you would see Hollywood normally producing.”Baker was reminded again of Madison a few years later when he saw her “subtly funny” part in Scream (2022), calling her “the whole package.” He recalls looking for the perfect actress to play the lead in a movie he was conceptualising about a stripper named Anora – an enigmatic and charming Brooklynite – “and there she was, right on the screen.” He didn’t audition anyone else for the role. He called Madison’s agent and a year later they were shooting Anora together in New York.<img alt="Image may contain Mikey Madison Face Head Person Photography Portrait Bed Furniture Adult Happy Smile and Bedroom" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67a49185dc45dc10e898deca/master/w_1600%2Cc_limit/Feb%252007%2520-%2520Mikey%2520Madison_Online7.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67a49185dc45dc10e898deca/master/w_120,c_limit/Feb%2007%20-%20Mikey%20Madison_Online7.jpg 120w, https://media.gq-magazine.co.uk/photos/67a49185dc45dc10e898deca/master/w_240,c_limit/Feb%2007%20-%20Mikey%20Madison_Online7.jpg 240w, https://media.gq-magazine.co.uk/photos/67a49185dc45dc10e898deca/master/w_320,c_limit/Feb%2007%20-%20Mikey%20Madison_Online7.jpg 320w, https://media.gq-magazine.co.uk/photos/67a49185dc45dc10e898deca/master/w_640,c_limit/Feb%2007%20-%20Mikey%20Madison_Online7.jpg 640w, https://media.gq-magazine.co.uk/photos/67a49185dc45dc10e898deca/master/w_960,c_limit/Feb%2007%20-%20Mikey%20Madison_Online7.jpg 960w, https://media.gq-magazine.co.uk/photos/67a49185dc45dc10e898deca/master/w_1280,c_limit/Feb%2007%20-%20Mikey%20Madison_Online7.jpg 1280w, https://media.gq-magazine.co.uk/photos/67a49185dc45dc10e898deca/master/w_1600,c_limit/Feb%2007%20-%20Mikey%20Madison_Online7.jpg 1600w" sizes="100vw"/>Suit by Tiger of Sweden. Bra and scarf by Tom Ford. Shoes by Saman Amel. Jewellery by Tiffany & Co. Madison’s parents are both psychologists. She brought her father to one film event, where she says he diagnosed the characters in various movies (although he hasn’t shared where exactly in the DSM he’d place Anora). His passions include woodworking and photography, and Madison calls him “an artist trapped in a psychologist’s body”. He made a lot of the family’s furniture.While her folks take a clinical approach to emotions, Madison’s is generally more visceral. “I think a lot of the way that I work is quite intuitive,” she says. “Sometimes I'll sort of be breaking things down and really dissecting a character and their psychology, why they do things, and sometimes I just feel it.”Madison is nothing like Anora, aside from a shared fondness for long, manicured nails. “I think people expect something, and then when they get me, I wonder if people are disappointed,” she says. “But I can't be anyone other than myself, right?” She’s drawn to playing extreme characters precisely because it allows her to explore. “If I play these characters, then I'm going to get to experience so much life and living through them. And it doesn't have to be me, you know? I get to have a safety net.”<img alt="Image may contain Mikey Madison Clothing Skirt Blouse Person Photography Face Head Portrait and Accessories" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67a491430059f2812d22aeed/master/w_1600%2Cc_limit/Feb%252007%2520-%2520Mikey%2520Madison_Online5.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67a491430059f2812d22aeed/master/w_120,c_limit/Feb%2007%20-%20Mikey%20Madison_Online5.jpg 120w, https://media.gq-magazine.co.uk/photos/67a491430059f2812d22aeed/master/w_240,c_limit/Feb%2007%20-%20Mikey%20Madison_Online5.jpg 240w, https://media.gq-magazine.co.uk/photos/67a491430059f2812d22aeed/master/w_320,c_limit/Feb%2007%20-%20Mikey%20Madison_Online5.jpg 320w, https://media.gq-magazine.co.uk/photos/67a491430059f2812d22aeed/master/w_640,c_limit/Feb%2007%20-%20Mikey%20Madison_Online5.jpg 640w, https://media.gq-magazine.co.uk/photos/67a491430059f2812d22aeed/master/w_960,c_limit/Feb%2007%20-%20Mikey%20Madison_Online5.jpg 960w, https://media.gq-magazine.co.uk/photos/67a491430059f2812d22aeed/master/w_1280,c_limit/Feb%2007%20-%20Mikey%20Madison_Online5.jpg 1280w, https://media.gq-magazine.co.uk/photos/67a491430059f2812d22aeed/master/w_1600,c_limit/Feb%2007%20-%20Mikey%20Madison_Online5.jpg 1600w" sizes="100vw"/>Tank top by Vintage. Skirt by Gucci. Shoes by Vintage Puma. Jewellery by Tiffany & Co. <img alt="Image may contain Mikey Madison Face Head Person Photography Portrait Teen Accessories Jewelry and Necklace" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67a49153dc45dc10e898dec8/master/w_1600%2Cc_limit/Feb%252007%2520-%2520Mikey%2520Madison_Online4.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67a49153dc45dc10e898dec8/master/w_120,c_limit/Feb%2007%20-%20Mikey%20Madison_Online4.jpg 120w, https://media.gq-magazine.co.uk/photos/67a49153dc45dc10e898dec8/master/w_240,c_limit/Feb%2007%20-%20Mikey%20Madison_Online4.jpg 240w, https://media.gq-magazine.co.uk/photos/67a49153dc45dc10e898dec8/master/w_320,c_limit/Feb%2007%20-%20Mikey%20Madison_Online4.jpg 320w, https://media.gq-magazine.co.uk/photos/67a49153dc45dc10e898dec8/master/w_640,c_limit/Feb%2007%20-%20Mikey%20Madison_Online4.jpg 640w, https://media.gq-magazine.co.uk/photos/67a49153dc45dc10e898dec8/master/w_960,c_limit/Feb%2007%20-%20Mikey%20Madison_Online4.jpg 960w, https://media.gq-magazine.co.uk/photos/67a49153dc45dc10e898dec8/master/w_1280,c_limit/Feb%2007%20-%20Mikey%20Madison_Online4.jpg 1280w, https://media.gq-magazine.co.uk/photos/67a49153dc45dc10e898dec8/master/w_1600,c_limit/Feb%2007%20-%20Mikey%20Madison_Online4.jpg 1600w" sizes="100vw"/>There’s an intensity to her work that couldn’t be more different from her calm, peaceful energy in real life. Sean Baker remembers his surprise at meeting the shy, soft-spoken Madison after seeing her passionate performances. “She's a listener more than a talker,” he says. But that power you see onscreen in her acting roles is clearly lurking somewhere just under the surface.To prepare Madison for her role in Anora, Baker bought her a Blu-ray player and started sending her movies to watch, like Maurice Pialat’s Loulou – particularly for the lead performance by Isabelle Huppert – and À Nos Amours. He also sent over a bunch of sexploitation movies, including Japanese film Female Prisoner Number #701: Scorpion, which Madison says she didn’t quite understand the purpose of at first, other than that Baker just really loves ’70s sexploitation movies. “But then there would be something that would click, and I'd be like, ‘Oh! He wants me to see this, or collect the energy from this character,’” she tells me. Baker says he wanted her to watch Scorpion for the scene where Anora leaves her rich beau’s mansion in her fur coat. Madison says sharing these highly specific tonal recommendations with Baker helped her understand the type of vividly colourful, high-impact but unpretentious movie he wanted them to make together.Something I observed is how emotional of a job [sex work] is. You kind of get to the nitty gritty of someone very quickly.Madison had never done screen nudity before Anora, but she didn’t feel nervous about it, particularly because of how goofy a lot of it is. “I found in the script that there was a lot of, like, humour and silliness involved in some of the sex scenes,” she says (example: in an early scene, co-star Mark Eydelshteyn cuts through the tension by doing a naked roly-poly). She found that Anora’s sexual content, rather than merely being titillating, was more about disarming the audience and humanising sex work. While preparing for the role, Madison met with sex workers, including consultant Andrea Werhun, and worked with a dance instructor, who taught her the fundamentals of pole- and lap-dancing. She also set out on an odyssey through LA strip clubs to meet and shadow exotic dancers. “Now I have a lot of wonderful friends that are a part of that community,” she says. “It was important to me to try to research as much as possible. I wanted to try to understand that community in a really specific way, so that I could portray Ani’s life as realistically as possible. I didn't want it to be sensationalised or dramatised in a negative way. I just wanted it to be what it was.”<img alt="Image may contain Mikey Madison Clothing Shorts Face Head Person Photography Portrait TShirt Teen and Blouse" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67a494b6dc45dc10e898dece/master/w_1600%2Cc_limit/Feb%252007%2520-%2520Mikey%2520Madison_Online3.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67a494b6dc45dc10e898dece/master/w_120,c_limit/Feb%2007%20-%20Mikey%20Madison_Online3.jpg 120w, https://media.gq-magazine.co.uk/photos/67a494b6dc45dc10e898dece/master/w_240,c_limit/Feb%2007%20-%20Mikey%20Madison_Online3.jpg 240w, https://media.gq-magazine.co.uk/photos/67a494b6dc45dc10e898dece/master/w_320,c_limit/Feb%2007%20-%20Mikey%20Madison_Online3.jpg 320w, https://media.gq-magazine.co.uk/photos/67a494b6dc45dc10e898dece/master/w_640,'''
