["https://gq-magazine.co.uk/article/natasha-jonas-lauren-price-fight-interview"]
title = "Natasha Jonas, Lauren Price are the fight that will redefine women’s boxing in Britain | British GQ"
description = "Ahead of a history-making showdown at Royal Albert Hall, the Olympic welterweight titans talk family, legacy and how they plan to win"
full_description = '''SportNatasha Jonas, Lauren Price are the fight that will redefine women’s boxing in BritainAhead of a history-making showdown at Royal Albert Hall, the Olympic welterweight titans talk family, legacy and how they plan to winBy Tracy Kawalik 4 March 2025“I know most [boxing] platforms now insist on featuring a female fighter,” says Natasha Jonas, “but you don’t want to be a tokenistic gesture – you want to be there because you’ve earned it as an elite athlete.” As Olympic welterweight titans and multiple world champions, the elite status of Jonas and her opponent this weekend, Lauren Price, is beyond question. As for tokenism, there’s no fear of that either: they’re making history as the first female headliners to box at the Royal Albert Hall, in what will also be the venue’s first all-female card.Legendary fighters like Lennox Lewis, Frank Bruno, Prince Naseem and Muhammad Ali laced up their gloves at the grand old hall. Yet professional women's boxing was illegal for more than one hundred years in the UK until 1996, dismissed as a novelty and derided thanks to outdated beliefs about PMS, emotional instability and claims that women bruised too easily.Despite this, pioneering UK female fighters like Barbara Buttrick and Jane Couch continued to box – gloves on or off – undaunted by the consequences. Their perseverance helped inspire a new generation of top athletes like Jonas and Price, who continued to push the women’s game into the limelight.Last year, Irish champion Katie Taylor and Puerto Rican Amanda Serrano shared a card with Mike Tyson, boxing at Madison Square Garden in a landmark bout that earned both fighters $1 million+ and a Netflix special. This Friday, a match dubbed Unstoppable marks the British women’s boxing equivalent: another testament to the blockbuster trajectory the sport is on in terms of respect, ticket sales, TV ratings, and popularity."I hope this fight between Tash and me inspires the next generation of girls to come through,” Price beams over the telephone. “I hope we show that anyone can achieve anything if they work hard enough. Women's boxing is on a meteoric rise. It's at a great place, and it's only getting bigger, better."And yet, as with most other sports, gender pay disparity in boxing is seismic. Despite being among the best fighters in the world, Jonas has talked candidly about struggling financially and having to push back against low-ball offers for high-profile bouts."I'm a self-employed athlete, so if I don't work, I don't get paid. I'm no different than any other working mum," Jonas says. The balance for any boxer between training and personal life isn't easy, let alone securing steady cash flow and raising a child. “I struggled with that initially because I didn't know what motherhood would look like,” she says. ”I was dropping Mela off at nursery at eight o'clock, picking her up at 5 o'clock, and she's in bed for seven. After talking to all my other friends, I slowly got to grips with that. As she grows older and finds her own routine, I fit mine around hers. I try to do all my sessions before half three, then run around to gymnastics, swimming, singing, tennis, and boxing in the evening."<img alt="Image may contain Natasha Jonas Adult Person Clothing Glove Face Head Photography Portrait and Undershirt" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c6f22dfc3858032976d082/master/w_1600%2Cc_limit/NATASHA%2520JONAS%252077.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c6f22dfc3858032976d082/master/w_120,c_limit/NATASHA%20JONAS%2077.jpg 120w, https://media.gq-magazine.co.uk/photos/67c6f22dfc3858032976d082/master/w_240,c_limit/NATASHA%20JONAS%2077.jpg 240w, https://media.gq-magazine.co.uk/photos/67c6f22dfc3858032976d082/master/w_320,c_limit/NATASHA%20JONAS%2077.jpg 320w, https://media.gq-magazine.co.uk/photos/67c6f22dfc3858032976d082/master/w_640,c_limit/NATASHA%20JONAS%2077.jpg 640w, https://media.gq-magazine.co.uk/photos/67c6f22dfc3858032976d082/master/w_960,c_limit/NATASHA%20JONAS%2077.jpg 960w, https://media.gq-magazine.co.uk/photos/67c6f22dfc3858032976d082/master/w_1280,c_limit/NATASHA%20JONAS%2077.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c6f22dfc3858032976d082/master/w_1600,c_limit/NATASHA%20JONAS%2077.jpg 1600w" sizes="100vw"/>LAWRENCE LUSTIGPrice, too, knows all too well about striking a complex balance between her personal and professional life. Growing up, she made ends meet by driving a taxi for her grandparent's company to fund her training. She'll also share the 'Unstoppable' card with her ex-partner, the English featherweight Karriss Artingstall. “We competed in the Olympics together. We'll always be supporters of each other's journey; she's a great fighter," Price says. “You have to have good people and a strong team around you," she goes on. “If there's one thing I've learned in life: no matter how good you are, someone will try to bring you down. Don't let them."Not that the fight needs it, but the rivalry between Jonas and Price has been hyped up in the media. Jonas, 41, is the Team GB trailblazer; she started training at 20, fought numerous world champions, won arms full of belts. She has been inactive in spells but came back to achieve what a lot of people said she couldn't. Price – who was awarded an MBE in 2022 – is the ‘golden girl'; a decade younger, undefeated, determined to bring the belt back to Wales, cement her legacy and blow Natasha back into retirement."I think people push a narrative that isn't there,” shrugs Jonas. "Rivals? This isn't me and Katie Taylor [who has beaten Jonas twice]. But there is competition there. [Lauren] wants to be undisputed. I want to be undisputed.""It's just a business at the end of the day,” says Price. “We're both in the sport. There's nothing personal. I think it's going to be a great fight. I respect Tash, but she's got titles that I want, and that's it.”If the fight were to end in retirement for Jonas, it would be a huge loss for the sport. Liverpool's WBC and IBF World Champion (16-2-1, 9 KOs) was selected to box for Team GB in 2009. In 2012, she became the first female British boxer to qualify for the Olympic Games, where she took home bronze. In 2022, she was named British Boxing's Fighter of the Year—the first woman to receive the honour. A self-managed boxer, she also became the first Black woman to be granted a managerial license in British boxing.When asked about her impact on boxing, she answers humbly. "That's a question you'd have to ask someone else. I didn't get into boxing to be anybody's hero. I was just trying to be the best person I could be. If people take inspiration from that – or because I'm Black, because I'm a woman, or because I'm from Liverpool – I appreciate that. I know that after I was in the 2012 Olympics, the number of girls in boxing schools rose by 70 plus per cent."In the early 2000's Price was asked to write down three goals in a school project. She wanted to become a kickboxing world champion, play international football for Wales and go to the Olympic Games. Her teacher raised an eyebrow, but Price didn't. Her grandmother told her to reach for the moon; if she fell short, she'd land on the stars.She did precisely what she set out to do, winning gold at the 2020 Tokyo Olympics. "I don't think anything will ever top [that],” she admits. “It's the pinnacle of the sport, and it had been a dream of mine since I was eight years old, getting goosebumps and watching Kelly Holmes win gold. She inspired me while I was sat in the living room with my grandparents. So to stand on top of the podium and listen to the national anthem—yeah, that's the proudest moment of my career."<img alt="Image may contain Face Head Person Photography Portrait and Adult" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c6f24de24e3215e316657e/master/w_1600%2Cc_limit/LAUREN%2520PRICE%252002.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c6f24de24e3215e316657e/master/w_120,c_limit/LAUREN%20PRICE%2002.jpg 120w, https://media.gq-magazine.co.uk/photos/67c6f24de24e3215e316657e/master/w_240,c_limit/LAUREN%20PRICE%2002.jpg 240w, https://media.gq-magazine.co.uk/photos/67c6f24de24e3215e316657e/master/w_320,c_limit/LAUREN%20PRICE%2002.jpg 320w, https://media.gq-magazine.co.uk/photos/67c6f24de24e3215e316657e/master/w_640,c_limit/LAUREN%20PRICE%2002.jpg 640w, https://media.gq-magazine.co.uk/photos/67c6f24de24e3215e316657e/master/w_960,c_limit/LAUREN%20PRICE%2002.jpg 960w, https://media.gq-magazine.co.uk/photos/67c6f24de24e3215e316657e/master/w_1280,c_limit/LAUREN%20PRICE%2002.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c6f24de24e3215e316657e/master/w_1600,c_limit/LAUREN%20PRICE%2002.jpg 1600w" sizes="100vw"/>LAWRENCE LUSTIGPrice was raised by her grandparents from the age of three because her parents were unable to care for her due to substance abuse. Her grandfather introduced her to kickboxing at eight, and she went on to win four world titles before excelling in football, earning 52 caps for Wales. She also trained in Taekwondo but always felt her true strength was in her hands—leading her to eventually find her way to boxing. “My Nan always gives me a good luck card before every match. I've kept them all since the Olympics, and before every fight, I bring them with me and put them up in my room. She doesn't just write a paragraph—she fills them with motivational messages. It's like a book, really!" Price laughs.Jonas, too, is fighting with her family never far from her mind. “Rotunda, my old amateur club where my daughter Mela now trains, is known for producing boxers with great footwork. The funniest thing was, after my last fight, I asked her if she'd watched, and she said, ‘Yeah, Mum, well done.’ I pushed her for a critique, and she went, ‘Do you want me to be honest? You were good, but sometimes you were walking a tightrope—your feet were too close together.’”Motherhood, Jonas says, has altered how she approaches sport. "Before I became a mom, I remember if I went to a tournament and lost, I'd be raging. It was mentally so stressful. I’d be at family gatherings worried about what I was eating. I never wanted to be that person. In the end, it was that stress mixed with injuries that made me retire. Having my daughter put a lot of things into perspective. When I leave the gym and open my door to my house, I'm just Tasha, I'm her mum. Equally, I want her to see where hard work gets you."Occasionally, it even manages to impress her daughter. “The only time I got any real kudos was when Mela's school asked me to give a talk. I walked in with my belts and medals, and all the kids were like, ‘Is that your mum?!’ Suddenly, Mela was there holding my head and nodding her head all proud.”Jonas and Price are both southpaws, lending their fight and added tactical complexity. "There aren't many elite female southpaws,” Jonas says. “So because Lauren is, I've been sparring with a lot of lads. I've got fellow Scouse super-bantamweight champ "Jazza" Dickens this week. I also trained in Saudi with [Arnold] Barboza, who is ranked seventh in the world. Plus, I was around Shakur Stevenson, so I was able to ask questions and pick their brains on what works best against southpaws."At 41, Jonas has no plans of slowing down. Instead, her eyes are locked on future fights and thrilling years to come. "I haven't reached my glass ceiling yet. I still haven't gotten to the stage where I'm not improving or showing something different. Even with Lauren, I'm kind of the underdog. I'm still learning, developing, and, most of all, winning. Eventually, they'll be a ceiling. When I'm not getting any fitter, stronger, faster, that'll be it. But until that day, I will push, push and push until I get the things that I think will satisfy me." She concludes: "One is revenge on Katie Taylor. I was a tough test for her last time. Two is a rematch with Mikaela Mayer. I can still do that. I still want to do that."Price, too, is thinking beyond Friday night’s landmark bout and about her legacy. "I just want to be the best, you know, I think there's so much more to come from me. I want to create greatness, not just [as] a Welsh legend, but to headline stadium fights and be recognised by the world. It's such a short career that you got to give your all to it. Keep winning, keep climbing the ladder, keep breaking barriers."Natasha Jonas vs Lauren Price is presented by BOXXER live on Sky Sports on Friday, March 7 as part of an all-women’s event at the Royal Albert Hall.'''
