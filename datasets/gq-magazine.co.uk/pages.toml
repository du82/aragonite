["https://gq-magazine.co.uk/article/adrien-brody-hype-interview-2025"]
title = "Adrien Brody on The Brutalist, The Fear of 13 and finding a character's spirit | British GQ"
description = "22 years after winning his Oscar for The Pianist, the chameleonic actor is once again an awards-season favourite for his role in Brady Corbet’s unorthodox masterpiece, The Brutalist. It’s made him reflect on the path that got him here"
full_description = 'GQ HypeAdrien Brody has waited for this22 years after winning his Oscar for The Pianist, the chameleonic actor is once again an awards-season favourite for his role in Brady Corbet’s unorthodox masterpiece, The Brutalist. It’s made him reflect on the path that got him hereBy Douglas GreenwoodPhotography by Elliot Morgan23 January 2025Shirt by Mfpen. Jumper by Dries Van Noten.In his dressing room at the Donmar Warehouse, a small 251-seat theatre in London’s West End, Adrien Brody has enough herbal tinctures to set up his own traditional medicine shop. “What would you like?” the actor asks, picking up tiny dropper bottles, surveying the labels like he’s never seen some of them before. “Ashwagandha?” Sure. I tip my head back and he spurts a pipette full of earthy liquid under my tongue before giving himself the same treatment, swirling it about his gums a little like some kind of muddy mouthwash.Herbal remedies – these supposedly de-stressing elixirs (effects unverified), along with some lion’s mane mushroom supplements – have been helping Brody stay sharp lately. “I know 70 to 90 per cent of them are going to be psychosomatic,” he says, “but I enjoy the routine.” It’s a Sunday, and Brody – propped up sharply in a desk chair (he’s conscious of his posture) wearing a white T-shirt, cargo trousers and Dior trainers – is seeking refuge from his thoughts. Eight times already this week, he has performed on stage in Lindsey Ferrentino’s play The Fear of 13 – based on a true story – in which he plays a Pennsylvania man wrongfully put on death row. It’s the 51-year-old’s first time doing theatre in at least 30 years, and the monologues have been rolling around in his brain, stirring him from sleep.There’s that, and the lingering feeling that there is a machine in motion that he’s going to have to jump onto as soon as the run is over: awards season. While Brody’s been holed up in his dressing room, a mattress laid out on the floor for between-show snoozes, his latest film, The Brutalist, has steadily become a frontrunner for this year’s Academy Awards, and Brody himself (at least if you believe the pundits) a shoo-in for best actor.<img alt="Image may contain Adrien Brody Accessories Formal Wear Tie Clothing Suit Blazer Coat Jacket Adult and Person" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/677e638512c12e646f2a1cc4/master/w_1600%2Cc_limit/Jan%252013%2520-%2520Adrien%2520Brody_Cover.jpg" srcSet="https://media.gq-magazine.co.uk/photos/677e638512c12e646f2a1cc4/master/w_120,c_limit/Jan%2013%20-%20Adrien%20Brody_Cover.jpg 120w, https://media.gq-magazine.co.uk/photos/677e638512c12e646f2a1cc4/master/w_240,c_limit/Jan%2013%20-%20Adrien%20Brody_Cover.jpg 240w, https://media.gq-magazine.co.uk/photos/677e638512c12e646f2a1cc4/master/w_320,c_limit/Jan%2013%20-%20Adrien%20Brody_Cover.jpg 320w, https://media.gq-magazine.co.uk/photos/677e638512c12e646f2a1cc4/master/w_640,c_limit/Jan%2013%20-%20Adrien%20Brody_Cover.jpg 640w, https://media.gq-magazine.co.uk/photos/677e638512c12e646f2a1cc4/master/w_960,c_limit/Jan%2013%20-%20Adrien%20Brody_Cover.jpg 960w, https://media.gq-magazine.co.uk/photos/677e638512c12e646f2a1cc4/master/w_1280,c_limit/Jan%2013%20-%20Adrien%20Brody_Cover.jpg 1280w, https://media.gq-magazine.co.uk/photos/677e638512c12e646f2a1cc4/master/w_1600,c_limit/Jan%2013%20-%20Adrien%20Brody_Cover.jpg 1600w" sizes="100vw"/>Suit by Dior Men. Shirt by Mfpen. Tie by NN07. Socks by Falke. Shoes by Dune. Some time – over two decades, in fact – has passed since he was last in this situation. In 2003, a then-29-year-old Brody won for his role as Władysław Szpilman, a Jewish musician who skirted capture in Second World War Poland, in Roman Polanski’s The Pianist. He is still the youngest person to win the prize.For some, an Oscar win is a certification of Movie Star status, opening the door to becoming a household name. Yet if you mention Adrien Brody to an average cinemagoer, they might shrug. Show them his face, though – angular, emotional, like a wounded soldier from a Robert Capa photograph – and they’ll know him in an instant. If not The Pianist, they’ve almost certainly seen him as part of Wes Anderson’s troupe (appearing in The Grand Budapest Hotel and The Darjeeling Limited, among others). Or as Jack Driscoll in Peter Jackson’s epic mid-noughties take on King Kong. More recently, he’s followed Hollywood’s prestige pivot to television, playing a philanthropic billionaire in Succession and a mobster in Peaky Blinders. Throughout his career, Brody has bolstered talented ensembles, or injected clout into projects at risk of being dismissed as popcorn fodder. He is an actor whose work you seek out because you know his taste is good.“You can have really wonderfully talented people, and some things just don’t happen. But sometimes, sometimes you prevail.”All the while, he’s been searching for a project that swallowed him whole, one where the toil of its creation results in something truly singular. Since The Pianist, he says, “it’s been hard to find something of that magnitude.”He’s finally found it. The Brutalist, the third film from director Brady Corbet, debuted at the Venice Film Festival last September. It’s a grandiose statement piece – three and a half hours long with an interval, and shot in VistaVision, a format last used in the early 1960s – that has electrified audiences at a time when we’re told cinema’s death sentence has already been delivered.The Brutalist tells the story of László Tóth (Brody), a Hungarian Jewish architect who has survived the Buchenwald concentration camp and set sail for the US, chasing the American dream. From Tóth’s arrival on the rocking deck of a boat pulling into a New York harbour in 1947 through more than three decades, we’re shown what that dream means in practice; America is framed as a nation that pillages the labour of the people to whom it’s made a false promise. The film is also, of particular interest to Brody, about a brilliant artist under the boot heel of capitalism, unwilling to bend to its rules.<img alt="Adrien Brody is rebuilding" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/672b4716fad5725da3eced46/1:1/w_775%2Cc_limit/GQ_MOTY_ONLINE_HEADER_ADRIEN%2520BRODY.jpg" srcSet="https://media.gq-magazine.co.uk/photos/672b4716fad5725da3eced46/1:1/w_120,c_limit/GQ_MOTY_ONLINE_HEADER_ADRIEN%20BRODY.jpg 120w, https://media.gq-magazine.co.uk/photos/672b4716fad5725da3eced46/1:1/w_240,c_limit/GQ_MOTY_ONLINE_HEADER_ADRIEN%20BRODY.jpg 240w, https://media.gq-magazine.co.uk/photos/672b4716fad5725da3eced46/1:1/w_320,c_limit/GQ_MOTY_ONLINE_HEADER_ADRIEN%20BRODY.jpg 320w, https://media.gq-magazine.co.uk/photos/672b4716fad5725da3eced46/1:1/w_640,c_limit/GQ_MOTY_ONLINE_HEADER_ADRIEN%20BRODY.jpg 640w" sizes="100vw"/>MOTY 2024Adrien Brody is rebuildingBy Douglas GreenwoodWhen he first read the script, written by Corbet and his partner Mona Fastvold, a few years ago, Brody saw its “great potential”, and “felt so well-suited to honour this character,” he says. Part of it was personal: Brody’s grandmother lived in Nazi-occupied Budapest during World War One; his mother, the photographer Sylvia Plachy, fled persecution during the Hungarian revolution of 1956, arriving, like László, in New York. As an artist, Brody says, the experience gave her a “sensitivity to the suffering of others” – influencing her work in the same way László’s traumas are infused into his architecture. Everywhere Brody looked, tendrils were tying him to the character. But at first, he lost the part to Joel Edgerton. “That’s the nature of the business,” he says. Thankfully, nothing happens quickly in Hollywood, and by the time the film was ready to shoot after years of waiting, Edgerton had a scheduling conflict. And so, Corbet called Brody.After an arduous and near decade-long route to fruition, Corbet and his crew shot the film in 2023 over just 33 intensive days in Budapest and Italy. Guy Pearce, who plays the film’s wealthy, narcissistic antagonist, remembers how Brody “arrived with this wealth of, not just knowledge, but understanding,” he says. “He was extremely invested.”It wasn’t an easy shoot, but Corbet and Brody laughed somewhat deliriously through the exhaustion of it all, sharing the burden of pushing the film, like a gargantuan rock, up its steep final hill. “Many performers as well- established [as Brody] can sort of coast by, because they’ve been doing it for so long,” Corbet told me. “But he does the hard work.”On rare films like The Brutalist, Brody says, you encounter what he calls “the spirit”: the profound feeling that beautiful things are fusing together into something almost alchemical. Something worth breaking your back for. “If [you feel] no spirit, you know that spirit will not be present,” he says.It’s common for Brody to watch a project and feel like it’s not lived up to his expectations. “Most movies [are like that],” he admits. “It’s very hard to catch magic in a bottle. You can have really wonderfully talented people, and some things just don’t happen, or it doesn’t come alive in the edit, or the camera broke on the best two takes. Numerous things.” His lips unfurl into a smile. “But sometimes, sometimes you prevail.”<img alt="Image may contain Adrien Brody Clothing Shirt Dress Shirt Formal Wear Accessories Tie Adult Person Face and Head" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/677e63cd585ffb24562696c9/master/w_1600%2Cc_limit/Jan%252013%2520-%2520Adrien%2520Brody_Online_2.jpg" srcSet="https://media.gq-magazine.co.uk/photos/677e63cd585ffb24562696c9/master/w_120,c_limit/Jan%2013%20-%20Adrien%20Brody_Online_2.jpg 120w, https://media.gq-magazine.co.uk/photos/677e63cd585ffb24562696c9/master/w_240,c_limit/Jan%2013%20-%20Adrien%20Brody_Online_2.jpg 240w, https://media.gq-magazine.co.uk/photos/677e63cd585ffb24562696c9/master/w_320,c_limit/Jan%2013%20-%20Adrien%20Brody_Online_2.jpg 320w, https://media.gq-magazine.co.uk/photos/677e63cd585ffb24562696c9/master/w_640,c_limit/Jan%2013%20-%20Adrien%20Brody_Online_2.jpg 640w, https://media.gq-magazine.co.uk/photos/677e63cd585ffb24562696c9/master/w_960,c_limit/Jan%2013%20-%20Adrien%20Brody_Online_2.jpg 960w, https://media.gq-magazine.co.uk/photos/677e63cd585ffb24562696c9/master/w_1280,c_limit/Jan%2013%20-%20Adrien%20Brody_Online_2.jpg 1280w, https://media.gq-magazine.co.uk/photos/677e63cd585ffb24562696c9/master/w_1600,c_limit/Jan%2013%20-%20Adrien%20Brody_Online_2.jpg 1600w" sizes="100vw"/>Shirt and trousers by Yves Saint Laurent. Tie by Mfpen. Watch by Cartier. Brody has been chasing the spirit for over two decades. By the time he filmed The Pianist, then just 27 years old, he had appeared in a number of modestly sized parts in modestly sized films and television shows, one day working on short-lived sitcoms (Annie McGuire), the next with an early-career Steven Soderbergh (King of the Hill). Before he was even out of the gate, he had been hired at 23 by director Terrence Malick, who cast him as the lead Corporal Fife in his now-legendary war drama The Thin Red Line. Brody was prepared for the world to know his name. His publicist had booked him a slot on the 1999 cover of Vanity Fair’s Hollywood issue, positioning him for that year’s Oscars. Then he saw the film, and realised Malick had totally reconfigured it in post-production, reducing his screen time to just five minutes of the near-three-hour feature.“I was always kind of grateful that The Thin Red Line was such a harrowing experience for me, and full of personal loss,” Brody says. “There was public embarrassment and potential career disaster affiliated with all of that – I didn’t know that the role had been eviscerated. Then I looked back and I thought, How lucky I am that I averted acclaim and praise at that age.”The Thin Red Line earned the kind of critical love that could have, in different circumstances, changed Brody’s life. Instead, he laid low, playing smaller roles in films by Spike Lee (Summer of Sam) and Ken Loach (Bread and Roses). In the years afterwards, he skirted projects that would have felt like cash grabs, instead chasing roles he could connect with. Shortly before he landed The Pianist, he says, he passed up two other opportunities, including a role in a “massive studio movie” and an unnamed independent film. The latter came at a time when he had already committed to playing a war photographer in Élie Chouraqui’s Harrison’s Flowers, a romantic drama opposite Brendan Gleeson and Andie MacDowell. “I wanted to play a photographer [for] my mom,” he says. “I grew up knowing [the photographer] Gilles Peress. It was a great role.” The other movie, his agents suggested, would have had a bigger impact on his career, “but I was more interested in honouring my commitment,” says Brody.He followed Harrison’s Flowers with The Affair of the Necklace, a lush American take on Marie Antoinette’s downfall, shot in France. That film’s first assistant director Mishka Cheyko recommended Brody to Roman Polanski, with whom Cheyko had worked on 1999’s The Ninth Gate. So Brody invited Polanski and the producers of The Pianist to a private screening of Harrison’s Flowers in Paris, eventually earning the part of Szpilman without auditioning. “Had I not done that supporting role in The Affair of the Necklace and not worked with Mishka, who sang my praises, then who knows what that path would be?” he says.“To enter this phase of life where I am visible is like a spiritual passageway. I’ll make someone’s day buying toilet paper.”I tell him I’m intrigued by what the splashy studio film is – the one he turned down, prompting a domino effect that practically made his career. “I understand your position, that it’s exciting,” he says gently, “but it’s not the point.”Instead, he says, this is: “In retrospect, it’s often easy to see that you could have done better here, or you shouldn’t have done that, but sometimes you have to look back and say, ‘It’s kind of amazing how that happened.’”Something spectral was with Brody on that journey, Pearce thinks. A cosmic alignment, or payback, for what happened on The Thin Red Line. “The Oscar, in a way,” he says, “was the spirit world’s way of saying, ‘We’re going to make it up to you.’”<img alt="Image may contain Adrien Brody Person Standing Adult Clothing Footwear Shoe Coat Door Face Head and Photography" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/677e63e04cf738e63003237a/master/w_1600%2Cc_limit/Jan%252013%2520-%2520Adrien%2520Brody_Online_4.jpg" srcSet="https://media.gq-magazine.co.uk/photos/677e63e04cf738e63003237a/master/w_120,c_limit/Jan%2013%20-%20Adrien%20Brody_Online_4.jpg 120w, https://media.gq-magazine.co.uk/photos/677e63e04cf738e63003237a/master/w_240,c_limit/Jan%2013%20-%20Adrien%20Brody_Online_4.jpg 240'
