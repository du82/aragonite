["https://gq-magazine.co.uk/article/stephen-graham-a-thousand-blows-workout"]
title = "How Stephen Graham got into fighter-mode for A Thousand Blows | British GQ"
description = "Boxing legend Jamal Akay put the Scouse actor through this deadly fitness routine to get him in the shape of his life."
full_description = '''FitnessHow Stephen Graham got into fighter-mode for A Thousand BlowsBoxing legend Jamal Akay put the Scouse actor through this deadly fitness routine to get him in the shape of his lifeBy Tom Ward24 February 2025As Combo, the belligerent, Fred Perry-loving skinhead in Shane Meadows’ terrific This Is England, Stephen Graham managed to terrify a generation. Squat and hulking, for a while there, Graham was pretty much the last actor you’d want to meet down a dark alley.In the decades since, Graham has continued to work as Britain’s most interesting character actor, cropping up in everything from Covid dramas to UK chef stresser Boiling Point, and gigs with Hollywood’s finest directors in Michael Mann and Martin Scorsese.His latest outing is in A Thousand Blows, where he's transformed into Sugar Goodson, an East End boxer dishing out punishment in Victorian London. As soon as Graham was recruited by Peaky Blinders creator Steven Knight for the role, first stop was getting in tiptop shape. Legendary boxer Jamal Akay was the man for the job, and here's what he had Graham doing to transform him into a convincing fighter.Stephen Graham gets his gloves on<img alt="Image may contain Stephen Graham Malachi Kirby Adult Person Accessories Jewelry Necklace Baby Clothing and Hat" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67b6ef5218e7f05ef2a89eb1/master/w_1600%2Cc_limit/Stephen-Graham-in-A-Thousand-Blows.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67b6ef5218e7f05ef2a89eb1/master/w_120,c_limit/Stephen-Graham-in-A-Thousand-Blows.jpg 120w, https://media.gq-magazine.co.uk/photos/67b6ef5218e7f05ef2a89eb1/master/w_240,c_limit/Stephen-Graham-in-A-Thousand-Blows.jpg 240w, https://media.gq-magazine.co.uk/photos/67b6ef5218e7f05ef2a89eb1/master/w_320,c_limit/Stephen-Graham-in-A-Thousand-Blows.jpg 320w, https://media.gq-magazine.co.uk/photos/67b6ef5218e7f05ef2a89eb1/master/w_640,c_limit/Stephen-Graham-in-A-Thousand-Blows.jpg 640w, https://media.gq-magazine.co.uk/photos/67b6ef5218e7f05ef2a89eb1/master/w_960,c_limit/Stephen-Graham-in-A-Thousand-Blows.jpg 960w, https://media.gq-magazine.co.uk/photos/67b6ef5218e7f05ef2a89eb1/master/w_1280,c_limit/Stephen-Graham-in-A-Thousand-Blows.jpg 1280w, https://media.gq-magazine.co.uk/photos/67b6ef5218e7f05ef2a89eb1/master/w_1600,c_limit/Stephen-Graham-in-A-Thousand-Blows.jpg 1600w" sizes="100vw"/>Akay comes from a boxing family. His dad – known affectionately as ‘Mr Akay’ – started a boxing gym in the East End in 1974, and Akay’s oldest brother went on to become British champion. As the youngest child, Akay got into the ring a bit later, eventually progressing to win a few fights for England before turning pro.“I was always throwing a jab, probably before I said my first word,” he says. It’s no surprise that with this pedigree, Akay’s gym, All Stars Boxing Gym, had a reputation of its own. “It’s very popular in London,” says Akay. “It has an old-school look and any time there were actors passing through, they always trained or filmed there.”Akay was friendly with Tom Miller, a producer, and Miller put his name forward for A Thousand Blows. “When I met Stephen, we had a connection right away,” says Akay. “He’d done some boxing in the past, so he’s a fighter at heart.”Their first sparring session was on set, as production had actually built a replica Victorian boxing ring for filming. “It looked like a real amateur gym,” says Akay, adding that Graham, now 51, took to it straight away. “He’d been working with a strength and conditioning coach for about a year before production and they had the nutrition sorted, so my role was to work on the boxing.“He had an idea of how his character would look, and the boxing training helped refine this, but also make him look like a boxer, not a bodybuilder, because he’d put some size on,” continues Akay.The pair clicked from round one, discussing old “rough and tumble” boxers – legends whose technique was a bit looser than today’s fighters. “My face lit up,” says Akay. “It was exactly what I had in mind for him.” The emphasis was on what Akay calls “dirty, rough, gritty stuff”, including keeping his hands lower, adding in more brute force, and being a bit less calculated with his punches.A lot of their work was focusing on scene-specific boxing moves, but also slowing them down for the camera. “You want it to be more visual, to see the mechanics of it,” explains Akay. “In real life, you want to keep things as subtle as you can and not signal what you’re about to do to your opponent. On film, you want to accentuate certain things so the audience can follow the action.”The focus required to improve an already sound techniqueSimilar to boxing, sticking to a strict fitness schedule requires a certain degree of commitment and inner grit. According to Akay, Graham had this in abundance and his age didn’t really come into consideration. “Everyone has niggles to take into account,” he says. “We just warm-up properly and we’re good.”They hit the ground running: “The first pad session we did, he was going through it. He had some venom in his shots from day one and he can hold himself,” says Akay. He also describes Graham as a focused and serious man, laughing and joking one minute then immediately able to dial in to the task at hand when required.“We’d be in the changing room having a laugh, playing music, but as soon as we’re in the ring, it’s like a light switch and he goes into tunnel vision. He’s a fighter and it was really great to see.”The workout<img alt="Image may contain Stephen Graham Adult Person Head and Face" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67acc9a9702c415b4b3d99bc/master/w_1600%2Cc_limit/Stephen-Graham-fitness-diary-.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67acc9a9702c415b4b3d99bc/master/w_120,c_limit/Stephen-Graham-fitness-diary-.jpg 120w, https://media.gq-magazine.co.uk/photos/67acc9a9702c415b4b3d99bc/master/w_240,c_limit/Stephen-Graham-fitness-diary-.jpg 240w, https://media.gq-magazine.co.uk/photos/67acc9a9702c415b4b3d99bc/master/w_320,c_limit/Stephen-Graham-fitness-diary-.jpg 320w, https://media.gq-magazine.co.uk/photos/67acc9a9702c415b4b3d99bc/master/w_640,c_limit/Stephen-Graham-fitness-diary-.jpg 640w, https://media.gq-magazine.co.uk/photos/67acc9a9702c415b4b3d99bc/master/w_960,c_limit/Stephen-Graham-fitness-diary-.jpg 960w, https://media.gq-magazine.co.uk/photos/67acc9a9702c415b4b3d99bc/master/w_1280,c_limit/Stephen-Graham-fitness-diary-.jpg 1280w, https://media.gq-magazine.co.uk/photos/67acc9a9702c415b4b3d99bc/master/w_1600,c_limit/Stephen-Graham-fitness-diary-.jpg 1600w" sizes="100vw"/>Graham’s physical transformation was being handled elsewhere, but boxing training holds immeasurable benefits of its own. Here’s what a typical day looked like on set.Mobility warm-upYou know the drill. Stretch your arms, touch your toes. Get your blood pumping. Get that band out and work on that persistent ache you have.Shadow boxingThree, three minute rounds. Akay would call out specific shots for Graham, so maybe ask a friend or your partner to yell ‘Jab’, ‘Hook’ ‘Jab, jab’ at you. Don’t slow down; pain doesn’t take a day off. If you’re flagging, picture your boss who keeps whatsapping you out of work hours and you should find the juice.Bag workKeeping the same timings as above, Graham practiced his range on the bag, with one minute of long range punches, a second minute of closer hits, and back to long range for the last minute. “This helped us work on different combinations, and it also keeps you safe when you’re working with actors so they can gauge their distance and not accidentally hit anyone,” says Akay. You’ll benefit from this too.Ground workA boxer’s core is vital. Medicine ball sit-ups, Russian twists, knee raises, planks, leg raises, and sit-up variations like dead-bugs all play a role here. You don’t need us to talk you through specifics – you can find that here – but the aim is to work through sets of 40 secs per exercise with a short rest between for 10 to 15 minutes, depending on time available, and how much your core can take.StretchTime to cool down, bust out the foam roller, maybe throw a steak on those abs. You’ve earned it, champ.Watch A Thousand Blows on Disney+ from 21 February'''
author = "Tom Ward"
