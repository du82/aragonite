["https://gq-magazine.co.uk/article/how-we-test"]
title = "GQ Recommends reviews: How we test and why you can trust us | British GQ"
description = "Wondering how British GQ reviews the products in its Recommends guides? Here's everything you need to know about our testing process."
full_description = '''ShoppingGQ Recommends reviews: How we test and why you can trust usWondering how British GQ reviews the products in its Recommends guides? Here's everything you need to know about our testing process.By Robert Leedham5 April 2024British GQ has been helping its readers look and feel their best since its launch in 1989. In the three-plus decades since our fashion cupboard has seen enough coats to survive a nuclear winter, we’ve inhaled a menagerie of men’s fragrances and have gazed upon some simply glorious watches from the show floors of Geneva, Dubai and beyond. All of which goes to say that we know what we’re talking about when it comes to GQ Recommends. Still, it’s one thing to declare our expertise and another thing entirely to spell out why you can trust our coverage, which spans from essential SPF moisturisers to decadent Egyptian cotton bed sheets.That’s why our team of in-house writers and pool of freelancers work hard to bring you the best kit for your wardrobe, bathroom cabinet and beyond. They’re the folks who’ll try, test and ultimately review the products that are worthy of GQ’s seal of approval. So how do they do it and why should you trust them? We thought you’d never ask. Here’s everything you need to know about how British GQ tests products.Meet the teamRob Leedham<img alt="Image may contain Face Head Person Photography Portrait Happy Smile Clothing Coat Jacket Adult and Body Part" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/6610038fe7fa3caed346e146/master/w_1600%2Cc_limit/Rob-Leedham---GQ.jpg" srcSet="https://media.gq-magazine.co.uk/photos/6610038fe7fa3caed346e146/master/w_120,c_limit/Rob-Leedham---GQ.jpg 120w, https://media.gq-magazine.co.uk/photos/6610038fe7fa3caed346e146/master/w_240,c_limit/Rob-Leedham---GQ.jpg 240w, https://media.gq-magazine.co.uk/photos/6610038fe7fa3caed346e146/master/w_320,c_limit/Rob-Leedham---GQ.jpg 320w, https://media.gq-magazine.co.uk/photos/6610038fe7fa3caed346e146/master/w_640,c_limit/Rob-Leedham---GQ.jpg 640w, https://media.gq-magazine.co.uk/photos/6610038fe7fa3caed346e146/master/w_960,c_limit/Rob-Leedham---GQ.jpg 960w, https://media.gq-magazine.co.uk/photos/6610038fe7fa3caed346e146/master/w_1280,c_limit/Rob-Leedham---GQ.jpg 1280w, https://media.gq-magazine.co.uk/photos/6610038fe7fa3caed346e146/master/w_1600,c_limit/Rob-Leedham---GQ.jpg 1600w" sizes="100vw"/>Rob Leedham Rob Leedham is British GQ’s Senior Commerce Editor for Europe, which means he's our lead for product recommendations across the UK, Germany, Italy, Spain and France. Whether you're in need of a new face wash or exercise bike, he's edited the commerce team's expert picks and likely chimed in with a few words of his own. These days that tends to be when his beard trimmer has finally left this mortal coil, he’s run out of exfoliator or our watch guides need ritzing up with the latest models.When he’s not knee-deep in denim jackets and gift guides, Rob writes and commissions GQ’s tech and gaming coverage. Sometimes, he's also being dragged into his colleagues’ IT woes. He especially loves it when that happens.Before joining GQ Rob was the editor of Stuff and the deputy editor for technology and cars at Which?. He was one of PPA’s 30 Under 30 for 2019 and has written for the Sunday Times, Wired, Condé Nast Traveller, What Hi-Fi? and NME among others. Given a spare moment, Rob is probably watching Southampton FC concede a late equaliser and questioning the life choices that brought him to that moment.You can email Rob at robert.leedham@condenast.co.uk or find him on LinkedIn. He did an Instagram once, but hasn’t bothered since.Owen GoughOwen Gough is the only writer in the team with a beard, which inevitably crowns him the king of grooming content for British GQ. It’s a well-earned title: he’s been writing about the men’s grooming world and the latest tech trends for almost a decade, covering everything from skin-revitalising moisturisers and jawline-defining beard trimmers to the latest Apple iPhone launches. As a Senior Commerce Writer, he’s clued into any online shopping event you’d care to mention, with a canny eye to cut through the noise to find the best offers and deals so you don’t have to.Before advising British GQ’s readers on the proper care and maintenance of facial fuzz, Owen cut his teeth writing for Men’s Health, Cosmopolitan, Digital Spy, Esquire and Good Housekeeping, guiding readers on what the best coffee machines are for aspiring baristas or how to find the ultimate record player that will do your vinyl collection justice. Before that, Owen learned his trade in the world of cryptocurrencies, reporting on the staggering boom and bust of Bitcoin, Etherium et al.Outside of work hours, Owen finds comfort in blasting noobs on competitive FPS games or slipping on a pair of boxing gloves at the gym. If there’s a spare moment at the weekend, he enjoys trying to keep up with his whippet Pippa, or focusing his creative might on penning his first fiction novel.If your grooming routine could do with a bit of attention, you can get in touch with Owen at owen.gough@condenast.co.uk, or find him on X (the artist formerly known as) where he’s revelling in Arsenal’s second stab at “The Glory Days”. And if you simply must see how cute Pippa the whippet is, you can also catch him on Instagram.<img alt="Image may contain Head Person Face Photography Portrait Happy Smile Adult Clothing Coat Jacket Beard and Dimples" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/6610038e2f5d2597dbff6058/master/w_1600%2Cc_limit/Owen-Gough---GQ.jpg" srcSet="https://media.gq-magazine.co.uk/photos/6610038e2f5d2597dbff6058/master/w_120,c_limit/Owen-Gough---GQ.jpg 120w, https://media.gq-magazine.co.uk/photos/6610038e2f5d2597dbff6058/master/w_240,c_limit/Owen-Gough---GQ.jpg 240w, https://media.gq-magazine.co.uk/photos/6610038e2f5d2597dbff6058/master/w_320,c_limit/Owen-Gough---GQ.jpg 320w, https://media.gq-magazine.co.uk/photos/6610038e2f5d2597dbff6058/master/w_640,c_limit/Owen-Gough---GQ.jpg 640w, https://media.gq-magazine.co.uk/photos/6610038e2f5d2597dbff6058/master/w_960,c_limit/Owen-Gough---GQ.jpg 960w, https://media.gq-magazine.co.uk/photos/6610038e2f5d2597dbff6058/master/w_1280,c_limit/Owen-Gough---GQ.jpg 1280w, https://media.gq-magazine.co.uk/photos/6610038e2f5d2597dbff6058/master/w_1600,c_limit/Owen-Gough---GQ.jpg 1600w" sizes="100vw"/>Owen Gough <img alt="Image may contain Clothing TShirt Accessories Jewelry Necklace Face Head Person Photography Portrait and Adult" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/6610038ee80d8ae86a5cfc53/master/w_1600%2Cc_limit/Heidi-Quill---GQ.jpg" srcSet="https://media.gq-magazine.co.uk/photos/6610038ee80d8ae86a5cfc53/master/w_120,c_limit/Heidi-Quill---GQ.jpg 120w, https://media.gq-magazine.co.uk/photos/6610038ee80d8ae86a5cfc53/master/w_240,c_limit/Heidi-Quill---GQ.jpg 240w, https://media.gq-magazine.co.uk/photos/6610038ee80d8ae86a5cfc53/master/w_320,c_limit/Heidi-Quill---GQ.jpg 320w, https://media.gq-magazine.co.uk/photos/6610038ee80d8ae86a5cfc53/master/w_640,c_limit/Heidi-Quill---GQ.jpg 640w, https://media.gq-magazine.co.uk/photos/6610038ee80d8ae86a5cfc53/master/w_960,c_limit/Heidi-Quill---GQ.jpg 960w, https://media.gq-magazine.co.uk/photos/6610038ee80d8ae86a5cfc53/master/w_1280,c_limit/Heidi-Quill---GQ.jpg 1280w, https://media.gq-magazine.co.uk/photos/6610038ee80d8ae86a5cfc53/master/w_1600,c_limit/Heidi-Quill---GQ.jpg 1600w" sizes="100vw"/>Heidi Quill Heidi QuillHeidi Quill is obsessed with clothes. It is often said that if you ask for outfit advice three times into a mirror, she will appear. As a Senior Commerce Writer and section head for fashion, Heidi can be found complimenting the shoes of strangers, enthusing about a recent charity shop find, talking about her cat, and overseeing the output of style content on British GQ’s shopping pages.Having worked in fashion ever since leaving school, Heidi’s career began in 2018 when she started freelancing in product writing, before a two-and-a-half-year stretch at luxury fashion giant, Farfetch. Joining British GQ in 2021 at the age of 21, Heidi might primarily look after clothing content, but she also enjoys trend reporting and interviewing the odd celebrity for Recommends’ ongoing ‘At Home With’ series.Out of hours, you can find Heidi lusting over vintage gemstone rings, writing tongue-in-cheek poetry, styling the odd Instagram celebrity, or lost in the latest TikTok trend as a true Gen Z. Find her on Instagram and Twitter at @heidiquill, or email her at heidi.quill@condenast.co.uk.Jessie AtkinsonJessie Atkinson is the guardian of the gift guides at British GQ, overseer of the Recommends’ grooming and fitness content, and enthusiastic chime-inner on the department’s style recommendations. A Senior Commerce Writer, she can most often be found enthusing about face serums, gym trainers, knitwear, or the new lingerie brand that your girlfriend probably wants you to buy her something from.A music editor before life at Condé Nast, Jessie still writes about culture — sometimes speaking with bands for NME and other times drawing out shoppable moments from films and TV series here at GQ. As Gigwise’s former Editor-in-Chief, she launched the music brand's print iteration and has interviewed such stars and bands as Joan Jett, Debbie Harry and the Pixies.Out of hours, Jessie has a voracious appetite for films and the gym, plays guitar and participates in Japanese jiu-jitsu. She also does even more writing when not at her desk: she’s written two novel manuscripts and is in the process of penning her first film screenplay. Find her on Instagram and TikTok at @jessieatkinsonxo, or email her at jessie.atkinson@condenast.co.uk.<img alt="Image may contain Clothing TShirt Face Head Person Photography Portrait Skin Tattoo Adult Sleeve and Blonde" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/6610038e2f5d2597dbff6059/master/w_1600%2Cc_limit/Jessie-Atkinson-_-GQ.jpg" srcSet="https://media.gq-magazine.co.uk/photos/6610038e2f5d2597dbff6059/master/w_120,c_limit/Jessie-Atkinson-_-GQ.jpg 120w, https://media.gq-magazine.co.uk/photos/6610038e2f5d2597dbff6059/master/w_240,c_limit/Jessie-Atkinson-_-GQ.jpg 240w, https://media.gq-magazine.co.uk/photos/6610038e2f5d2597dbff6059/master/w_320,c_limit/Jessie-Atkinson-_-GQ.jpg 320w, https://media.gq-magazine.co.uk/photos/6610038e2f5d2597dbff6059/master/w_640,c_limit/Jessie-Atkinson-_-GQ.jpg 640w, https://media.gq-magazine.co.uk/photos/6610038e2f5d2597dbff6059/master/w_960,c_limit/Jessie-Atkinson-_-GQ.jpg 960w, https://media.gq-magazine.co.uk/photos/6610038e2f5d2597dbff6059/master/w_1280,c_limit/Jessie-Atkinson-_-GQ.jpg 1280w, https://media.gq-magazine.co.uk/photos/6610038e2f5d2597dbff6059/master/w_1600,c_limit/Jessie-Atkinson-_-GQ.jpg 1600w" sizes="100vw"/>Jessie Atkinson Daphne BuglerBritish GQ’s mattress queen, Daphne Bugler is in charge of all of GQ’s sleep content, with a special love for mattresses, as can be attested to by all of the writers who sleep soundly thanks to her recommendations. As Senior Commerce Writer, she also runs all of our interiors and furniture guides, whether that’s finding the pillows that won’t hurt your neck or the sofas that actually look good in your living room. Daphne also runs GQ’s ‘At Home With’ series, getting the inside scoop on what everyone’s favourite actors, musicians and athletes have going on in their homes.At British GQ since 2019, Daphne started as Social Media Assistant, running the Facebook and Twitter accounts and being behind the scenes at some of GQ’s biggest annual events. While she still keeps a close eye on what’s trending, she moved across to the Commerce team during the pandemic in 2020. Before this, she worked for BBC Radio 2, studied a Masters in Journalism at City, University of London and previously wrote for publications including The Times and The Financial Times.When she’s not deep in the world of mattresses, Daphne tends to spend her free time taking on a new challenge, whether that’s training for the 2024 London Marathon or attempting to cycle 100 miles in a day. You can find her on Instagram @daphnebugler, or email her at daphne.bugler@condenast.co.uk.Josephine JuddJosephine Binta Judd is GQ’s Commerce Picture Editor looking after the visuals across GQ Recommends. Josephine joined GQ in 2020 after working at British Vogue as a Junior Picture Assistant. She first joined Condé Nast six years ago on a graduate internship producing video franchises for the international Vogue titles. As well as designing and picture editing for commerce, Josephine is also a contributor for the website, focusing mainly on Recommends' Travel section.When Josephine is not off jet-setting, she is busy campaigning for marginalised communities as part of PPA’s Next Gen Board and as a co-chair of Condé Nast's Disability ERG. Josephine has penned art pieces and talent interviews for British GQ’s print edition and has bylines in six different international Vogue titles. Josephine is a graduate and scholarship recipient from Condé Nast College. You can email her at josephine_judd@gq.com.<img alt="Image may contain Face Head Person Photography Portrait Happy Smile Body Part Neck and Adult" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/6610038ee80d8ae86a5cfc54/master/w_1600%2Cc_limit/Daphne-Bugler---GQ.jpg" srcSet="https://media.gq-magazine.co.uk/photos/6610038ee80d8ae86a5cfc54/master/w_120,c_limit/Daphne-Bugler---GQ.jpg 120w, https://media.gq-magazine.co.uk/photos/6610038ee80d8ae86a5cfc54/master/w_240,c_limit/Daphne-Bugler---GQ.jpg 240w, https://media.gq-magazine.co.uk/photos/6610038ee80d8ae86a5cfc54/master/w_320,c_limit/Daphne-Bugler---GQ.jpg 320w, https://media.gq-magazine.co.uk/photos/6610038ee80d8ae86a5cfc54/master/w_640,c_limit/Daphne-Bugler---GQ.jpg 640w, https://media.gq-magazine.co.uk/photos/6610038ee80d8ae86a5cfc54/master/w_960,c_limit/Daphne-Bugler---GQ.jpg 960w, https://media.gq-magazine.co.uk/photos/6610038ee80d8ae86a5cfc54/master/w_1280,c_limit/Daphne-Bugler---GQ.jpg 1280w, https://media.gq-magazine.co.uk/photos/6610038ee80d8ae86a5cfc54/master/w_1600,c_limit/Daphne-Bugler---GQ.jpg 1600w" sizes="100vw"/>Daphne Bugler <img alt="Image may contain Face Head Person Photography Portrait Happy Smile Adult Body Part Neck Clothing and Coat" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/6610038f2f5d2597dbff605a/master/w_1600%2Cc_limit/Josephine-Judd---GQ.jpg" srcSet="https://media.gq-magazine.co.uk/photos/6610038f2f5d2597dbff605a/master/w_120,c_limit/Josephine-Judd---GQ.jpg 120w, https://media.gq-magazine.co.uk/photos/6610038f2f5d2597dbff605a/master/w_240,c_limit/Josephine-Judd---GQ.'''
