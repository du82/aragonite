title = "10 business watches that'll turn heads in the boardroom | British GQ"
description = "10 of the best watches for business meetings, because while it's been 25 years since American Psycho, the same one-upmanship exists when you enter a meeting room."
full_description = '''Watches10 business watches to boss the boardroom with, according to the expertsIt's been 25 years since American Psycho yet still the same one-upmanship exists when you enter a meeting room. Here's how to come out on top in the watch stakesBy Vivian Morelli5 March 2025Just as you’d pick a slightly smarter outfit to dress for work (at least we hope so), business watches are always going to be slightly different to your weekender. But, what's the best play here? Do you wear your best investment watch and potentially worry about showing off too much, or do you wear an affordable pick to appear more relatable and down-to-earth?We asked watch collectors – who also happen to be business owners CEOs and entrepreneurs – to weigh in. “We usually say, we dress up for the watch we wear as watch enthusiasts,” says Mike Wüthrich of Wandering Watches. “But for an important business meeting, I wear my suit first and then choose a dress watch. Now do I go with the heavy hitters or the more recognisable Rolex?” (Well, scroll down to find out!)“The business world loves its rules: dress to impress, flash a little gold, make sure people know you’ve got it,” says Homer Narvaez, watch designer and co-founder of Tokyo Watch Club. “But when you're on a site in scorching heat or developing new projects to improve society, that’s not the game. Here, it’s all about reliability and simplicity – nothing too flashy. I don’t need anything drawing attention away from the work. But let’s be honest: I’m a watch guy. I want something solid – something that doesn’t shout but still says just enough to make me smile.”Dying to find out about their picks? Here are the best watches to wear for business meetings, according to 8 of our experts.Casio G-Shock MRG-B5000<img alt="Image may contain Computer Hardware Electronics Hardware Monitor Screen Wristwatch Digital Watch Arm and Body Part" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c836f532567cafb9d65290/master/w_1600%2Cc_limit/Best%2520Business%2520meeting%2520watches_0002_Casio%2520MR%2520G.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c836f532567cafb9d65290/master/w_120,c_limit/Best%20Business%20meeting%20watches_0002_Casio%20MR%20G.jpg 120w, https://media.gq-magazine.co.uk/photos/67c836f532567cafb9d65290/master/w_240,c_limit/Best%20Business%20meeting%20watches_0002_Casio%20MR%20G.jpg 240w, https://media.gq-magazine.co.uk/photos/67c836f532567cafb9d65290/master/w_320,c_limit/Best%20Business%20meeting%20watches_0002_Casio%20MR%20G.jpg 320w, https://media.gq-magazine.co.uk/photos/67c836f532567cafb9d65290/master/w_640,c_limit/Best%20Business%20meeting%20watches_0002_Casio%20MR%20G.jpg 640w, https://media.gq-magazine.co.uk/photos/67c836f532567cafb9d65290/master/w_960,c_limit/Best%20Business%20meeting%20watches_0002_Casio%20MR%20G.jpg 960w, https://media.gq-magazine.co.uk/photos/67c836f532567cafb9d65290/master/w_1280,c_limit/Best%20Business%20meeting%20watches_0002_Casio%20MR%20G.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c836f532567cafb9d65290/master/w_1600,c_limit/Best%20Business%20meeting%20watches_0002_Casio%20MR%20G.jpg 1600w" sizes="100vw"/>“This isn’t just another G-Shock. It’s a G-Shock on elite samurai armor. It has the same G-Shock shape, but with much more parts to make each angle look sharp, giving it an obsessive level of craftsmanship. Multiple finishes, titanium strength, and yet, it doesn't scream luxury. To most, it’s just a tough watch. But to someone who appreciates fine watches? It’s a whole different thing. Subtle, impressive, quietly beautiful. It’s perfect. I get to keep my head in the game, focus on what matters, and still have this little reminder on my wrist – my watch is tough, yet refined. And the best part? No one else needs to know. By the way, it's the exact reason I'm making my watch too; I took the same principles of the MRG, but brought it to high horology." Homer Narvaez, Tokyo Watch ClubFurlan Marri Salmon Sector Dial<img alt="Image may contain Wristwatch Arm Body Part Person and Adult" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c770a3c88f13d5f5cd4957/master/w_1600%2Cc_limit/Best_Business_meeting_watches_0001_mike_wuthrich.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c770a3c88f13d5f5cd4957/master/w_120,c_limit/Best_Business_meeting_watches_0001_mike_wuthrich.jpg 120w, https://media.gq-magazine.co.uk/photos/67c770a3c88f13d5f5cd4957/master/w_240,c_limit/Best_Business_meeting_watches_0001_mike_wuthrich.jpg 240w, https://media.gq-magazine.co.uk/photos/67c770a3c88f13d5f5cd4957/master/w_320,c_limit/Best_Business_meeting_watches_0001_mike_wuthrich.jpg 320w, https://media.gq-magazine.co.uk/photos/67c770a3c88f13d5f5cd4957/master/w_640,c_limit/Best_Business_meeting_watches_0001_mike_wuthrich.jpg 640w, https://media.gq-magazine.co.uk/photos/67c770a3c88f13d5f5cd4957/master/w_960,c_limit/Best_Business_meeting_watches_0001_mike_wuthrich.jpg 960w, https://media.gq-magazine.co.uk/photos/67c770a3c88f13d5f5cd4957/master/w_1280,c_limit/Best_Business_meeting_watches_0001_mike_wuthrich.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c770a3c88f13d5f5cd4957/master/w_1600,c_limit/Best_Business_meeting_watches_0001_mike_wuthrich.jpg 1600w" sizes="100vw"/>“If I’ll be meeting people for the very first time, I usually go with my Salmon Sector Dial Furlan Marri. It’s definitely a conversation starter due to it’s beautiful dial and overall design. But not the overpowering type, and this is a very important consideration. Besides, I’ve landed my two most recent jobs wearing my Furlan Marri during my interviews. The wrist shot was taken after that successful meeting. And then I wore my 5712 on the first day at work.” Mike Wüthrich, watch expertVacheron Constantin Historiques 222<img alt="Image may contain Wristwatch Arm Body Part and Person" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c770d8949cde9a358fca3d/master/w_1600%2Cc_limit/Best_Business_meeting_watches_0008_andy_freedman.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c770d8949cde9a358fca3d/master/w_120,c_limit/Best_Business_meeting_watches_0008_andy_freedman.jpg 120w, https://media.gq-magazine.co.uk/photos/67c770d8949cde9a358fca3d/master/w_240,c_limit/Best_Business_meeting_watches_0008_andy_freedman.jpg 240w, https://media.gq-magazine.co.uk/photos/67c770d8949cde9a358fca3d/master/w_320,c_limit/Best_Business_meeting_watches_0008_andy_freedman.jpg 320w, https://media.gq-magazine.co.uk/photos/67c770d8949cde9a358fca3d/master/w_640,c_limit/Best_Business_meeting_watches_0008_andy_freedman.jpg 640w, https://media.gq-magazine.co.uk/photos/67c770d8949cde9a358fca3d/master/w_960,c_limit/Best_Business_meeting_watches_0008_andy_freedman.jpg 960w, https://media.gq-magazine.co.uk/photos/67c770d8949cde9a358fca3d/master/w_1280,c_limit/Best_Business_meeting_watches_0008_andy_freedman.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c770d8949cde9a358fca3d/master/w_1600,c_limit/Best_Business_meeting_watches_0008_andy_freedman.jpg 1600w" sizes="100vw"/>“As a managing partner of a New York City law firm, I’m constantly meeting with current clients, pitching new ones and hosting all sorts of panels and roundtables. I have a go-to watch for every occasion. But for my most important new client meetings, I’ve been wearing my Vacheron Constantin Historiques 222. It’s so elegant with a suit and flies a bit more under the radar than something like a Daytona. My 222 always seems to spark a conversation, which has helped land some big clients.” Andy Freedman, watch collectorRolex Day-Date Ref. 1803<img alt="Image may contain Wristwatch Arm Body Part and Person" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c7710ec88f13d5f5cd4959/master/w_1600%2Cc_limit/Best_Business_meeting_watches_0000_Zoe_Rolex.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c7710ec88f13d5f5cd4959/master/w_120,c_limit/Best_Business_meeting_watches_0000_Zoe_Rolex.jpg 120w, https://media.gq-magazine.co.uk/photos/67c7710ec88f13d5f5cd4959/master/w_240,c_limit/Best_Business_meeting_watches_0000_Zoe_Rolex.jpg 240w, https://media.gq-magazine.co.uk/photos/67c7710ec88f13d5f5cd4959/master/w_320,c_limit/Best_Business_meeting_watches_0000_Zoe_Rolex.jpg 320w, https://media.gq-magazine.co.uk/photos/67c7710ec88f13d5f5cd4959/master/w_640,c_limit/Best_Business_meeting_watches_0000_Zoe_Rolex.jpg 640w, https://media.gq-magazine.co.uk/photos/67c7710ec88f13d5f5cd4959/master/w_960,c_limit/Best_Business_meeting_watches_0000_Zoe_Rolex.jpg 960w, https://media.gq-magazine.co.uk/photos/67c7710ec88f13d5f5cd4959/master/w_1280,c_limit/Best_Business_meeting_watches_0000_Zoe_Rolex.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c7710ec88f13d5f5cd4959/master/w_1600,c_limit/Best_Business_meeting_watches_0000_Zoe_Rolex.jpg 1600w" sizes="100vw"/>“Usually the watch I pick depends on the outfit and the mood for the meeting, but if I were to choose one watch that could fit every meeting it would be my vintage Rolex Day-Date Ref. 1803 in white gold, from 1978. It’s not too flashy being in a white metal, but still demands respect and seriousness (in my opinion.)” Zoe Abelson, founder of GraalPatek Philippe Nautilus 3800<img alt="Image may contain Wristwatch Arm Body Part and Person" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c771382e7a9136cf11f920/master/w_1600%2Cc_limit/Best_Business_meeting_watches_0007_Danny_Shahid.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c771382e7a9136cf11f920/master/w_120,c_limit/Best_Business_meeting_watches_0007_Danny_Shahid.jpg 120w, https://media.gq-magazine.co.uk/photos/67c771382e7a9136cf11f920/master/w_240,c_limit/Best_Business_meeting_watches_0007_Danny_Shahid.jpg 240w, https://media.gq-magazine.co.uk/photos/67c771382e7a9136cf11f920/master/w_320,c_limit/Best_Business_meeting_watches_0007_Danny_Shahid.jpg 320w, https://media.gq-magazine.co.uk/photos/67c771382e7a9136cf11f920/master/w_640,c_limit/Best_Business_meeting_watches_0007_Danny_Shahid.jpg 640w, https://media.gq-magazine.co.uk/photos/67c771382e7a9136cf11f920/master/w_960,c_limit/Best_Business_meeting_watches_0007_Danny_Shahid.jpg 960w, https://media.gq-magazine.co.uk/photos/67c771382e7a9136cf11f920/master/w_1280,c_limit/Best_Business_meeting_watches_0007_Danny_Shahid.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c771382e7a9136cf11f920/master/w_1600,c_limit/Best_Business_meeting_watches_0007_Danny_Shahid.jpg 1600w" sizes="100vw"/>“I was once in a business meeting and the gentleman asked if my black dial Patek Philippe Nautilus 3800 was an original, as he’d never seen one before. Obviously the Nautilus is really popular in the watch industry but the black dial and smaller case size of this particular model are very unusual, so for me it’s the perfect conversation starter.” Danny Shahid, Diamond Watches LondonRolex Daytona<img alt="Image may contain Wristwatch Arm Body Part and Person" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c8370bcb59a49b479df89a/master/w_1600%2Cc_limit/Best%2520Business%2520meeting%2520watches_0004_Rolex%2520Daytona.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c8370bcb59a49b479df89a/master/w_120,c_limit/Best%20Business%20meeting%20watches_0004_Rolex%20Daytona.jpg 120w, https://media.gq-magazine.co.uk/photos/67c8370bcb59a49b479df89a/master/w_240,c_limit/Best%20Business%20meeting%20watches_0004_Rolex%20Daytona.jpg 240w, https://media.gq-magazine.co.uk/photos/67c8370bcb59a49b479df89a/master/w_320,c_limit/Best%20Business%20meeting%20watches_0004_Rolex%20Daytona.jpg 320w, https://media.gq-magazine.co.uk/photos/67c8370bcb59a49b479df89a/master/w_640,c_limit/Best%20Business%20meeting%20watches_0004_Rolex%20Daytona.jpg 640w, https://media.gq-magazine.co.uk/photos/67c8370bcb59a49b479df89a/master/w_960,c_limit/Best%20Business%20meeting%20watches_0004_Rolex%20Daytona.jpg 960w, https://media.gq-magazine.co.uk/photos/67c8370bcb59a49b479df89a/master/w_1280,c_limit/Best%20Business%20meeting%20watches_0004_Rolex%20Daytona.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c8370bcb59a49b479df89a/master/w_1600,c_limit/Best%20Business%20meeting%20watches_0004_Rolex%20Daytona.jpg 1600w" sizes="100vw"/>“For business meetings, I typically reach for a Rolex Daytona. It strikes the perfect balance between sportiness and sophistication – versatile enough to complement any outfit while still making a statement. With its rich history, precision, and timeless appeal, the Daytona is more than just a watch; it’s a conversation starter and a piece that always feels right on the wrist, no matter the occasion.” Paul Altieri, Bob’s WatchesAudemars Piguet Royal Oak, Grand Seiko Spring Drive and Patek Philippe Calatrava<img alt="Image may contain Wristwatch Arm Body Part and Person" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c772e42e7a9136cf11f922/master/w_1600%2Cc_limit/Best_Business_meeting_watches_0002_Mark_Cho_AP.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c772e42e7a9136cf11f922/master/w_120,c_limit/Best_Business_meeting_watches_0002_Mark_Cho_AP.jpg 120w, https://media.gq-magazine.co.uk/photos/67c772e42e7a9136cf11f922/master/w_240,c_limit/Best_Business_meeting_watches_0002_Mark_Cho_AP.jpg 240w, https://media.gq-magazine.co.uk/photos/67c772e42e7a9136cf11f922/master/w_320,c_limit/Best_Business_meeting_watches_0002_Mark_Cho_AP.jpg 320w, https://media.gq-magazine.co.uk/photos/67c772e42e7a9136cf11f922/master/w_640,c_limit/Best_Business_meeting_watches_0002_Mark_Cho_AP.jpg 640w, https://media.gq-magazine.co.uk/photos/67c772e42e7a9136cf11f922/master/w_960,c_limit/Best_Business_meeting_watches_0002_Mark_Cho_AP.jpg 960w, https://media.gq-magazine.co.uk/photos/67c772e42e7a9136cf11f922/master/w_1280,c_limit/Best_Business_meeting_watches_0002_Mark_Cho_AP.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c772e42e7a9136cf11f922/master/w_1600,c_limit/Best_Business_meeting_watches_0002_Mark_Cho_AP.jpg 1600w" sizes="100vw"/><img alt="Image may contain Wristwatch Arm Body Part and Person" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c77374c88f13d5f5cd495b/master/w_1600%2Cc_limit/Best_Business_meeting_watches_0004_Mark_Cho_Grand_seiko.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c77374c88f13d5f5cd495b/master/w_120,c_limit/Best_Business_meeting_watches_0004_Mark_Cho_Grand_seiko.jpg 120w, https://media.gq-magazine.co.uk/photos/67c77374c88f13d5f5cd495b/master/w_240,c_limit/Best_Business_meeting_watches_0004_Mark_Cho_Grand_seiko.jpg 240w, https://media.gq-magazine.co.uk/photos/67c77374c88f13d5f5cd495b/master/w_320,c_limit/Best_'''
