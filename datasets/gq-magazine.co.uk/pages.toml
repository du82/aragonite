title = "Heartstopper's Kit Connor and Joe Locke’s new watches prove they are ready to graduate | British GQ"
description = "At the Oscars, we witnessed a shift in the duo's horological A-game – signalling a significant coming of age moment for them both"
full_description = '''WatchesKit Connor and Joe Locke’s new watches prove the Heartstopper boys are ready to graduateAt the Oscars, we witnessed a shift in the duo's horological A-game – signalling a significant coming of age moment for them bothBy Ollie Cox3 March 2025Last night, just a few months after Heartstopper season three hit our screens, stars Joe Locke and Kit Connor hit up the Oscars for the first time. In the same way their characters in the coming of age series that catapulted the duo into the limelight, both actors wore pretty heavyweight watches to signal their own coming of age era IRL.Both Locke and Connor are pretty tight with big-name fashion labels like Celine and Giuliva Heritage. It’s the type of thing that comes with heartthrob actor territory. But at the Academy Awards last night they showed their love of design extends beyond blockbuster menswear, into quality crafted timepieces.In an interview with GQ ahead of the Oscars Locke shared how his “tastes have matured along with his personality” before unveiling a mighty fine 40mm IWC Portofino Automatic on the red carpet. Looks-wise, the silver-coated dial and gold hands on a black alligator strap is as timeless and tasteful as it comes. A clean date and time only dial keeps things smart, practical, and fuss-free, which is what you need when you’re pairing it with a gold sequin-embellished waistcoat like Locke did.<img alt="Joe Locke and Kit Connor" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c5c81ffc2290afc718f6cd/master/w_1600%2Cc_limit/0303-joe-lock-.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c5c81ffc2290afc718f6cd/master/w_120,c_limit/0303-joe-lock-.jpg 120w, https://media.gq-magazine.co.uk/photos/67c5c81ffc2290afc718f6cd/master/w_240,c_limit/0303-joe-lock-.jpg 240w, https://media.gq-magazine.co.uk/photos/67c5c81ffc2290afc718f6cd/master/w_320,c_limit/0303-joe-lock-.jpg 320w, https://media.gq-magazine.co.uk/photos/67c5c81ffc2290afc718f6cd/master/w_640,c_limit/0303-joe-lock-.jpg 640w, https://media.gq-magazine.co.uk/photos/67c5c81ffc2290afc718f6cd/master/w_960,c_limit/0303-joe-lock-.jpg 960w, https://media.gq-magazine.co.uk/photos/67c5c81ffc2290afc718f6cd/master/w_1280,c_limit/0303-joe-lock-.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c5c81ffc2290afc718f6cd/master/w_1600,c_limit/0303-joe-lock-.jpg 1600w" sizes="100vw"/>The 21-year-old actor could have gone for another statement timepiece but with a stealth grail like the Portofino, he chose an understated design gem sure to get a quiet round of applause from watch nerds. It’s the kind of watch that does everything you need it to do, looks good, but doesn’t scream for your attention by bulging out from your shirt sleeve – making it a certified red carpet gem.Locke’s Heartstopper co-star Connor went for a more macho Tag Heuer Monaco on a black leather strap. Steeped in history, this cubic kettle was first released to commemorate the Monaco Grand Prix back in 1969. It’s a split-second chronograph was the first designed by the watchmaker, and has quickly become an icon for motorsport heads. But it’s also got some movie star rizz in the mix, too. Steve McQueen famously wore the Monaco to in the full-throttle 1971 movie Le Mans. Throw it on a sleek black strap like Connor, and you’ve got yourself a very sick, and importantly Oscar-worthy flex.<img alt="Joe Locke and Kit Connor" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c5c81ffc2290afc718f6cc/master/w_1600%2Cc_limit/0303-joe-lock-kit.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c5c81ffc2290afc718f6cc/master/w_120,c_limit/0303-joe-lock-kit.jpg 120w, https://media.gq-magazine.co.uk/photos/67c5c81ffc2290afc718f6cc/master/w_240,c_limit/0303-joe-lock-kit.jpg 240w, https://media.gq-magazine.co.uk/photos/67c5c81ffc2290afc718f6cc/master/w_320,c_limit/0303-joe-lock-kit.jpg 320w, https://media.gq-magazine.co.uk/photos/67c5c81ffc2290afc718f6cc/master/w_640,c_limit/0303-joe-lock-kit.jpg 640w, https://media.gq-magazine.co.uk/photos/67c5c81ffc2290afc718f6cc/master/w_960,c_limit/0303-joe-lock-kit.jpg 960w, https://media.gq-magazine.co.uk/photos/67c5c81ffc2290afc718f6cc/master/w_1280,c_limit/0303-joe-lock-kit.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c5c81ffc2290afc718f6cc/master/w_1600,c_limit/0303-joe-lock-kit.jpg 1600w" sizes="100vw"/>For Heartstopper actors Kit Connor and Joe Locke, their first Oscars appearance was the perfect chance to show their own coming of age arc is fulling loading, and what watches they flexed played a key role in this. Rather than going all-out on shouty timepieces for the most prestigious Hollywood awards ceremony, the duo proved the cold hard power of universally appreciated classics. And in both cases, they came out on top.'''
