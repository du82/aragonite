title = "The 40 best movies on Netflix to watch this week | British GQ"
description = "New this week: With Bong Joon-ho's Mickey 17 soon to hit screens, check out his utterly unique dystopian thriller Snowpiercer. You can also watch Emilia Perez, Paddington 2, The Irishman and Arrival."
full_description = '''FilmThe 40 best movies on Netflix to watch this weekBy Jack King4 March 2025©Weinstein Company/Courtesy Everett CollectionNew this week: With Bong Joon-ho's Mickey 17 soon to hit screens, check out his utterly unique dystopian thriller SnowpiercerGQ's best Netflix movies guide is updated weekly.The thing about movies, not least on a streamer like Netflix, is that there are so goddamn many of them. Shit-yourself-scary movies; shoot ‘em up action movies; frenetic thrillers that send your heart into your mouth and blood pressure into overdrive.Spinning through the bright red carousel like the world's longest magazine rack, how are you to separate the good from the naff? We just have so little free time, and we give too much of our lives to movie-picking.But freeze no more in the shadow of the Big Red N. Here are GQ's top 40 movies now streaming on Netflix, updated every Monday morning for the week ahead.New this week: With Bong Joon-ho's Mickey 17 soon to hit screens, check out his utterly unique dystopian thriller Snowpiercer. And if you fancy taking a gamble on Amazon Prime and Disney+, try these guides.©Weinstein Company/Courtesy Everett Collection1/40SnowpiercerParasite director Bong Joon-ho's utterly unique take on the end of the world is set aboard a high-speed train that rockets across the surface of an earth that has been rendered a glacial wasteland by the advent of a new ice age. Its compartments are segregated based on social class; we follow Curtis Everett (Chris Evans), the grizzled leader of the poor who live in squalor in the back carriages. Both an apt climate crisis cautionary tale and a metaphor for the social inequality that persists across the globe. You can watch Snowpiercer on Netflix.<source media="(max-width: 767px)" srcSet="https://media.gq-magazine.co.uk/photos/6548ceed3dc021fc674b0a47/master/w_120%2Cc_limit/Parasite_.jpg 120w, https://media.gq-magazine.co.uk/photos/6548ceed3dc021fc674b0a47/master/w_240%2Cc_limit/Parasite_.jpg 240w, https://media.gq-magazine.co.uk/photos/6548ceed3dc021fc674b0a47/master/w_320%2Cc_limit/Parasite_.jpg 320w, https://media.gq-magazine.co.uk/photos/6548ceed3dc021fc674b0a47/master/w_640%2Cc_limit/Parasite_.jpg 640w, https://media.gq-magazine.co.uk/photos/6548ceed3dc021fc674b0a47/master/w_800%2Cc_limit/Parasite_.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.gq-magazine.co.uk/photos/6548ceed3dc021fc674b0a47/master/w_320%2Cc_limit/Parasite_.jpg 320w, https://media.gq-magazine.co.uk/photos/6548ceed3dc021fc674b0a47/master/w_640%2Cc_limit/Parasite_.jpg 640w, https://media.gq-magazine.co.uk/photos/6548ceed3dc021fc674b0a47/master/w_960%2Cc_limit/Parasite_.jpg 960w, https://media.gq-magazine.co.uk/photos/6548ceed3dc021fc674b0a47/master/w_1280%2Cc_limit/Parasite_.jpg 1280w, https://media.gq-magazine.co.uk/photos/6548ceed3dc021fc674b0a47/master/w_1600%2Cc_limit/Parasite_.jpg 1600w, https://media.gq-magazine.co.uk/photos/6548ceed3dc021fc674b0a47/master/w_1920%2Cc_limit/Parasite_.jpg 1920w, https://media.gq-magazine.co.uk/photos/6548ceed3dc021fc674b0a47/master/w_2240%2Cc_limit/Parasite_.jpg 2240w, https://media.gq-magazine.co.uk/photos/6548ceed3dc021fc674b0a47/master/w_2580%2Cc_limit/Parasite_.jpg 2580w" sizes="100vw"/><img alt="After Parasite won Best Picture at the Oscars in 2020 director Bong Joonho issued a challenge to movie audiences in the..." class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/6548ceed3dc021fc674b0a47/master/w_320%2Cc_limit/Parasite_.jpg"/>Everett Collection2/40ParasiteAfter Parasite won Best Picture at the Oscars in 2020, director Bong Joon-ho issued a challenge to movie audiences in the west. “Once you overcome the one-inch-tall barrier of subtitles,” he said, statuette raised high, “you will be introduced to so many more amazing films.” Perhaps it didn't move the dial for world cinema quite as far as we then anticipated. But Parasite, a masterful class thriller, has become a gateway drug for new cinephiles getting into Korean cinema. You can watch Parasite on Netflix.<source media="(max-width: 767px)" srcSet="https://media.gq-magazine.co.uk/photos/67c5c5684dec91530d593b65/master/w_120%2Cc_limit/0303-netflix-1.jpg 120w, https://media.gq-magazine.co.uk/photos/67c5c5684dec91530d593b65/master/w_240%2Cc_limit/0303-netflix-1.jpg 240w, https://media.gq-magazine.co.uk/photos/67c5c5684dec91530d593b65/master/w_320%2Cc_limit/0303-netflix-1.jpg 320w, https://media.gq-magazine.co.uk/photos/67c5c5684dec91530d593b65/master/w_640%2Cc_limit/0303-netflix-1.jpg 640w, https://media.gq-magazine.co.uk/photos/67c5c5684dec91530d593b65/master/w_800%2Cc_limit/0303-netflix-1.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.gq-magazine.co.uk/photos/67c5c5684dec91530d593b65/master/w_320%2Cc_limit/0303-netflix-1.jpg 320w, https://media.gq-magazine.co.uk/photos/67c5c5684dec91530d593b65/master/w_640%2Cc_limit/0303-netflix-1.jpg 640w, https://media.gq-magazine.co.uk/photos/67c5c5684dec91530d593b65/master/w_960%2Cc_limit/0303-netflix-1.jpg 960w, https://media.gq-magazine.co.uk/photos/67c5c5684dec91530d593b65/master/w_1280%2Cc_limit/0303-netflix-1.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c5c5684dec91530d593b65/master/w_1600%2Cc_limit/0303-netflix-1.jpg 1600w, https://media.gq-magazine.co.uk/photos/67c5c5684dec91530d593b65/master/w_1920%2Cc_limit/0303-netflix-1.jpg 1920w, https://media.gq-magazine.co.uk/photos/67c5c5684dec91530d593b65/master/w_2240%2Cc_limit/0303-netflix-1.jpg 2240w, https://media.gq-magazine.co.uk/photos/67c5c5684dec91530d593b65/master/w_2580%2Cc_limit/0303-netflix-1.jpg 2580w" sizes="100vw"/><img alt="Image may contain Ana de Armas Adrien Brody Face Head Person Photography Portrait Blouse Clothing and Bench" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c5c5684dec91530d593b65/master/w_320%2Cc_limit/0303-netflix-1.jpg"/>©Netflix/Courtesy Everett Collection3/40BlondeNamed a two-time Oscar winner for his leading role in The Brutalist, it's worth revisiting the ever-enigmatic Adrien Brody's stand-out supporting role in Andrew Dominik's controversial Marilyn Monroe film Blonde. In it, he plays playwright Arthur Miller, one of the less toxic men in Norma Jeane's (Ana de Armas) orbit, whose love ushers in a brief ceasefire for her violent and unstable inner life — until tragedy strikes anew. This isn't a traditional celebrity biopic; it is a brutal film about the hazards of fame and the objectification of women in the public eye. Which is to say, maybe don't watch it if you're on a downer. You can watch Blonde on Netflix.<source media="(max-width: 767px)" srcSet="https://media.gq-magazine.co.uk/photos/67c5c568fc2290afc718f6c7/master/w_120%2Cc_limit/0303-netflix-2.jpg 120w, https://media.gq-magazine.co.uk/photos/67c5c568fc2290afc718f6c7/master/w_240%2Cc_limit/0303-netflix-2.jpg 240w, https://media.gq-magazine.co.uk/photos/67c5c568fc2290afc718f6c7/master/w_320%2Cc_limit/0303-netflix-2.jpg 320w, https://media.gq-magazine.co.uk/photos/67c5c568fc2290afc718f6c7/master/w_640%2Cc_limit/0303-netflix-2.jpg 640w, https://media.gq-magazine.co.uk/photos/67c5c568fc2290afc718f6c7/master/w_800%2Cc_limit/0303-netflix-2.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.gq-magazine.co.uk/photos/67c5c568fc2290afc718f6c7/master/w_320%2Cc_limit/0303-netflix-2.jpg 320w, https://media.gq-magazine.co.uk/photos/67c5c568fc2290afc718f6c7/master/w_640%2Cc_limit/0303-netflix-2.jpg 640w, https://media.gq-magazine.co.uk/photos/67c5c568fc2290afc718f6c7/master/w_960%2Cc_limit/0303-netflix-2.jpg 960w, https://media.gq-magazine.co.uk/photos/67c5c568fc2290afc718f6c7/master/w_1280%2Cc_limit/0303-netflix-2.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c5c568fc2290afc718f6c7/master/w_1600%2Cc_limit/0303-netflix-2.jpg 1600w, https://media.gq-magazine.co.uk/photos/67c5c568fc2290afc718f6c7/master/w_1920%2Cc_limit/0303-netflix-2.jpg 1920w, https://media.gq-magazine.co.uk/photos/67c5c568fc2290afc718f6c7/master/w_2240%2Cc_limit/0303-netflix-2.jpg 2240w, https://media.gq-magazine.co.uk/photos/67c5c568fc2290afc718f6c7/master/w_2580%2Cc_limit/0303-netflix-2.jpg 2580w" sizes="100vw"/><img alt="Image may contain Baby Person Helmet Clothing Footwear Shoe Glove Game and Super Mario" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c5c568fc2290afc718f6c7/master/w_320%2Cc_limit/0303-netflix-2.jpg"/>©Universal/Courtesy Everett Collection4/40The Super Mario Bros. MovieMario, Luigi, Donkey Kong, Toad and everyone else you love playing as on Mario Kart assemble for this Avengers-sized animated take on the origin story of everyone's favourite Italian plumbers. Animated by Illumination, the studio behind Minions, this is a vibrant, nostalgic feast for the senses, simple so it might be from a plot POV. Insofar as there is one: Bowser (Jack Black) snatches up Princess Peach (Anya Taylor-Joy) and the Brooklyn brothers must save the day, one mushroom at a time. Perfect for kids and everyone else who spent an ungodly amount of hours trying to hit high scores on the SNES. You can watch The Super Mario Bros. Movie on Netflix.<source media="(max-width: 767px)" srcSet="https://media.gq-magazine.co.uk/photos/67c5c56801350cbc20d8dcb5/master/w_120%2Cc_limit/0303-netflix-3.jpg 120w, https://media.gq-magazine.co.uk/photos/67c5c56801350cbc20d8dcb5/master/w_240%2Cc_limit/0303-netflix-3.jpg 240w, https://media.gq-magazine.co.uk/photos/67c5c56801350cbc20d8dcb5/master/w_320%2Cc_limit/0303-netflix-3.jpg 320w, https://media.gq-magazine.co.uk/photos/67c5c56801350cbc20d8dcb5/master/w_640%2Cc_limit/0303-netflix-3.jpg 640w, https://media.gq-magazine.co.uk/photos/67c5c56801350cbc20d8dcb5/master/w_800%2Cc_limit/0303-netflix-3.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.gq-magazine.co.uk/photos/67c5c56801350cbc20d8dcb5/master/w_320%2Cc_limit/0303-netflix-3.jpg 320w, https://media.gq-magazine.co.uk/photos/67c5c56801350cbc20d8dcb5/master/w_640%2Cc_limit/0303-netflix-3.jpg 640w, https://media.gq-magazine.co.uk/photos/67c5c56801350cbc20d8dcb5/master/w_960%2Cc_limit/0303-netflix-3.jpg 960w, https://media.gq-magazine.co.uk/photos/67c5c56801350cbc20d8dcb5/master/w_1280%2Cc_limit/0303-netflix-3.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c5c56801350cbc20d8dcb5/master/w_1600%2Cc_limit/0303-netflix-3.jpg 1600w, https://media.gq-magazine.co.uk/photos/67c5c56801350cbc20d8dcb5/master/w_1920%2Cc_limit/0303-netflix-3.jpg 1920w, https://media.gq-magazine.co.uk/photos/67c5c56801350cbc20d8dcb5/master/w_2240%2Cc_limit/0303-netflix-3.jpg 2240w, https://media.gq-magazine.co.uk/photos/67c5c56801350cbc20d8dcb5/master/w_2580%2Cc_limit/0303-netflix-3.jpg 2580w" sizes="100vw"/><img alt="Image may contain Leonardo DiCaprio Head Person Face Adult Smoke Accessories Jewelry Ring Device Hammer and Tool" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c5c56801350cbc20d8dcb5/master/w_320%2Cc_limit/0303-netflix-3.jpg"/>©Weinstein Company/Courtesy Everett Collection5/40Django UnchainedA good slice of Quentin Tarantino's filmography is now on Netflix. Django Unchained is perhaps the most Tarantino of all of them: a maximalist bloodbath that verges on bad taste and is both reverent to and subversive of the western genre, propped up by a whip-smart script, unexpected needle drops and the terrific twosome of Christoph Waltz and Jamie Foxx. Foxx plays the titular Django, an escaped slave in 1850s Texas who is taken under the wing of frontier assassin Dr. King Schultz (Christoph Waltz). After some time working together, they become friends, and Schultz promises to help Django find his enslaved wife. You can watch Django Unchained on Netflix.<source media="(max-width: 767px)" srcSet="https://media.gq-magazine.co.uk/photos/67a0f381b625bdaf3aa073e7/master/w_120%2Cc_limit/0302-Film-1.jpg 120w, https://media.gq-magazine.co.uk/photos/67a0f381b625bdaf3aa073e7/master/w_240%2Cc_limit/0302-Film-1.jpg 240w, https://media.gq-magazine.co.uk/photos/67a0f381b625bdaf3aa073e7/master/w_320%2Cc_limit/0302-Film-1.jpg 320w, https://media.gq-magazine.co.uk/photos/67a0f381b625bdaf3aa073e7/master/w_640%2Cc_limit/0302-Film-1.jpg 640w, https://media.gq-magazine.co.uk/photos/67a0f381b625bdaf3aa073e7/master/w_800%2Cc_limit/0302-Film-1.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.gq-magazine.co.uk/photos/67a0f381b625bdaf3aa073e7/master/w_320%2Cc_limit/0302-Film-1.jpg 320w, https://media.gq-magazine.co.uk/photos/67a0f381b625bdaf3aa073e7/master/w_640%2Cc_limit/0302-Film-1.jpg 640w, https://media.gq-magazine.co.uk/photos/67a0f381b625bdaf3aa073e7/master/w_960%2Cc_limit/0302-Film-1.jpg 960w, https://media.gq-magazine.co.uk/photos/67a0f381b625bdaf3aa073e7/master/w_1280%2Cc_limit/0302-Film-1.jpg 1280w, https://media.gq-magazine.co.uk/photos/67a0f381b625bdaf3aa073e7/master/w_1600%2Cc_limit/0302-Film-1.jpg 1600w, https://media.gq-magazine.co.uk/photos/67a0f381b625bdaf3aa073e7/master/w_1920%2Cc_limit/0302-Film-1.jpg 1920w, https://media.gq-magazine.co.uk/photos/67a0f381b625bdaf3aa073e7/master/w_2240%2Cc_limit/0302-Film-1.jpg 2240w, https://media.gq-magazine.co.uk/photos/67a0f381b625bdaf3aa073e7/master/w_2580%2Cc_limit/0302-Film-1.jpg 2580w" sizes="100vw"/><img alt="Image may contain Brad Pitt Adult Person Clothing Hat Firearm Gun Rifle Weapon Coat Military and Military Uniform" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67a0f381b625bdaf3aa073e7/master/w_320%2Cc_limit/0302-Film-1.jpg"/>©Weinstein Company/Courtesy Everett Collection6/40Inglourious BasterdsIn which Brad Pitt, Eli Roth and Til Schweiger land deep behind enemy lines in Hitler's Third Reich, scalp hundreds of Nazis, and beat at least one of them to death with a baseball bat. Quentin Tarantino's pulpy action masterwork is a revenge thriller, war epic, gnarly B-movie and alt-history all rolled into one ensemble package, making for one of the genre auteur's most rewatchable movies this side of Pulp Fiction. Elevated, of course, by Christoph Waltz's performance as one of the most sadistic, nefarious and creepily charismatic screen Nazis of all time. You can watch Inglourious Basterds on Netflix.<source media="(max-width: 767px)" srcSet="https://media.gq-magazine.co.uk/photos/67a0f382a8c5232779b7e57d/master/w_120%2Cc_limit/0302-film-3.jpg 120w, https://media.gq-magazine.co.uk/photos/67a0f382a8c5232779b7e57d/master/w_240%2Cc_limit/0302-film-3.jpg 240w, https://media.gq-magazine.co.uk/photos/67a0f382a8c5232779b7e57d/master/w_320%2Cc_limit/0302-film-3.jpg 320w, https://media.gq-magazine.co.uk/photos/67a0f382a8c5232779b7e57d/master/w_640%2Cc_limit/0302-film-3.jpg 640w, https://media.gq-magazine.co.uk/photos/67a0f382a8c5232779b7e57d/master/w_800%2Cc_li'''
