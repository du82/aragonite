full_description = '''ShoppingHow to buy champagne: GQ's ultimate cheat sheet (from the people who make it)Champagne is a big and sometimes intimidating world, so we’ve answered the important questions when it comes to fizz – with help from some of our favourite producersBy David Taylor13 February 2025All products are independently selected by our editors. If you buy something, we may earn an affiliate commission.“I love going down these stairs, because for me it’s like entering another world,” says Florent Roques-Boizel, president of family-run Champagne Boizel, as he takes me into the wine cellars burrowed beneath Épernay’s Avenue de Champagne. “No mobile phone reception – it’s always very quiet.”It’s certainly a world away from what we think of when it comes to champagne: revelry, celebration and the odd sword used to open an explosive bottle. With 300 million bottles produced a year, a fiercely protective and passionate region of wine growers, and more champagne houses than you could ever drink your way through, it’s a world that can be hard to decipher. So, to help you get to grips with champagne – and impress friends at your next party – we asked some of our favourite producers for all the tips, tricks and recommendations you need for your own champagne cheat sheet.<img alt="Image may contain Plant Vegetation Grass Balloon Slope Outdoors Nature Scenery and Tree" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67a5eee10c84726a8ccfd37a/master/w_1600%2Cc_limit/HowToBuyChampagne_001.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67a5eee10c84726a8ccfd37a/master/w_120,c_limit/HowToBuyChampagne_001.jpg 120w, https://media.gq-magazine.co.uk/photos/67a5eee10c84726a8ccfd37a/master/w_240,c_limit/HowToBuyChampagne_001.jpg 240w, https://media.gq-magazine.co.uk/photos/67a5eee10c84726a8ccfd37a/master/w_320,c_limit/HowToBuyChampagne_001.jpg 320w, https://media.gq-magazine.co.uk/photos/67a5eee10c84726a8ccfd37a/master/w_640,c_limit/HowToBuyChampagne_001.jpg 640w, https://media.gq-magazine.co.uk/photos/67a5eee10c84726a8ccfd37a/master/w_960,c_limit/HowToBuyChampagne_001.jpg 960w, https://media.gq-magazine.co.uk/photos/67a5eee10c84726a8ccfd37a/master/w_1280,c_limit/HowToBuyChampagne_001.jpg 1280w, https://media.gq-magazine.co.uk/photos/67a5eee10c84726a8ccfd37a/master/w_1600,c_limit/HowToBuyChampagne_001.jpg 1600w" sizes="100vw"/>The view of Champagne from its premier hotel, the Royal Champagne Hotel & Spa. What exactly is champagne?For centuries, France’s kings were crowned in Reims cathedral. Coronations demand celebrations, so still wine from the area was served during lunches and parties. Then, in the late 1600s, something miraculous happened, thanks – as usual, when it comes to alcohol – to a few monks.“Dom Pérignon made a mistake and created bubbles, and because it was served at the banquet, it became very famous. It’s how champagne became related to special events,” says Champagne Pommery’s Christine Prudhomme. “We say in French that it’s ‘le roi des vins, et le vin des rois’ – the king of wines and the wine of kings.”Champagne’s rapid rise led to everyone, from other wine producers to completely unassociated businesses, using the name on their products. It’s still happening now – on sparkling wine, bars of soap, perfume, beer cans and, more recently, with Apple trying to use it to describe the colour of the iPhone 5S. To combat all this, the Champagne region became an Appellation d'Origine Contrôlée (AOC) in 1936, meaning that for any wine to use the name, the grapes must strictly have been grown in the area among and around the towns of Reims and Épernay.After processing those grapes and waiting a few months, the classic bubbles are created during a process called ‘second fermentation’, when yeast and sugar are added: the yeast eats the sugar, creates alcohol and carbon dioxide, and mixes into the wine. Voila: your next bottle of liquid celebration is ready, and you’re basically a chemist.<img loading="lazy" alt="Image may contain: Alcohol, Beverage, Bottle, Liquor, Wine, Wine Bottle, and Beer" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67a5eee4366f96678bab5368/3:4/w_748%2Cc_limit/HowToBuyChampagne_Boizel-Brut-Re%25CC%2581serve%2C-%25C2%25A340.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67a5eee4366f96678bab5368/3:4/w_120,c_limit/HowToBuyChampagne_Boizel-Brut-Re%CC%81serve,-%C2%A340.jpg 120w, https://media.gq-magazine.co.uk/photos/67a5eee4366f96678bab5368/3:4/w_240,c_limit/HowToBuyChampagne_Boizel-Brut-Re%CC%81serve,-%C2%A340.jpg 240w, https://media.gq-magazine.co.uk/photos/67a5eee4366f96678bab5368/3:4/w_320,c_limit/HowToBuyChampagne_Boizel-Brut-Re%CC%81serve,-%C2%A340.jpg 320w, https://media.gq-magazine.co.uk/photos/67a5eee4366f96678bab5368/3:4/w_640,c_limit/HowToBuyChampagne_Boizel-Brut-Re%CC%81serve,-%C2%A340.jpg 640w" sizes="100vw"/>BoizelBrut Réserve NV£40 Majestic<img loading="lazy" alt="Image may contain: Alcohol, Beverage, Bottle, Liquor, Wine, Wine Bottle, and Beer" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67a5eee4fd687e8c9b4d5c20/3:4/w_748%2Cc_limit/HowToBuyChampagne_Boizel-Blanc-de-Noirs-%25E2%2580%2598-La-Montagne%25E2%2580%2599%2C-%25C2%25A355%2C-.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67a5eee4fd687e8c9b4d5c20/3:4/w_120,c_limit/HowToBuyChampagne_Boizel-Blanc-de-Noirs-%E2%80%98-La-Montagne%E2%80%99,-%C2%A355,-.jpg 120w, https://media.gq-magazine.co.uk/photos/67a5eee4fd687e8c9b4d5c20/3:4/w_240,c_limit/HowToBuyChampagne_Boizel-Blanc-de-Noirs-%E2%80%98-La-Montagne%E2%80%99,-%C2%A355,-.jpg 240w, https://media.gq-magazine.co.uk/photos/67a5eee4fd687e8c9b4d5c20/3:4/w_320,c_limit/HowToBuyChampagne_Boizel-Blanc-de-Noirs-%E2%80%98-La-Montagne%E2%80%99,-%C2%A355,-.jpg 320w, https://media.gq-magazine.co.uk/photos/67a5eee4fd687e8c9b4d5c20/3:4/w_640,c_limit/HowToBuyChampagne_Boizel-Blanc-de-Noirs-%E2%80%98-La-Montagne%E2%80%99,-%C2%A355,-.jpg 640w" sizes="100vw"/>BoizelBlanc de Noirs ‘La Montagne’ Premier Cru NV£55 MajesticWhat are the main styles of champagne?Like all wine, a champagne’s style depends on the grapes used. There are three main grape varieties found in the best champagnes: chardonnay, pinot noir and pinot meunier. Blanc de blancs, made exclusively from white grapes, is a fresh, citrus snap, while a blanc de noirs (made from dark grapes) is usually fruitier and offers a little more body. There’s also rosé champagne, which has grown in popularity thanks to its versatility.What’s the difference between vintage and non-vintage champagne?Vintage champagne is made with grapes from one specific harvest year, while non-vintage (or multi-vintage) champagne takes wine from the current harvest and blends it with a house’s reserve wine from previous years to create a signature flavour.“We usually keep reserve wines for three to four years,” says Roques-Boizel. “Your reserve is a big asset. When you have a good harvest, you can be very tempted to use it all, but you have to think about the future.” For the producers, at least, champagne is less Jay Gatsby and more Moneyball.Do you capitalise the word?If you’re talking about the region, yes. If you’re talking about the wine, no. As it’s a protected product, nobody will argue if you turn it into a proper noun, but it would look a little old-fashioned to people from the area. Then again, it doesn’t really matter when it’s in your glass, does it?<img loading="lazy" alt="Image may contain: Alcohol, Beverage, Bottle, Liquor, Wine, and Wine Bottle" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67a5eee15104c837b397eeaf/3:4/w_748%2Cc_limit/HowToBuyChampagne_Palmer-&amp;-Co-Blanc-de-Blancs%2C-%25C2%25A353.99.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67a5eee15104c837b397eeaf/3:4/w_120,c_limit/HowToBuyChampagne_Palmer-&amp;-Co-Blanc-de-Blancs,-%C2%A353.99.jpg 120w, https://media.gq-magazine.co.uk/photos/67a5eee15104c837b397eeaf/3:4/w_240,c_limit/HowToBuyChampagne_Palmer-&amp;-Co-Blanc-de-Blancs,-%C2%A353.99.jpg 240w, https://media.gq-magazine.co.uk/photos/67a5eee15104c837b397eeaf/3:4/w_320,c_limit/HowToBuyChampagne_Palmer-&amp;-Co-Blanc-de-Blancs,-%C2%A353.99.jpg 320w, https://media.gq-magazine.co.uk/photos/67a5eee15104c837b397eeaf/3:4/w_640,c_limit/HowToBuyChampagne_Palmer-&amp;-Co-Blanc-de-Blancs,-%C2%A353.99.jpg 640w" sizes="100vw"/>Palmer & CoBlanc de Blancs Champagne£58.75 The Whisky Exchange<img loading="lazy" alt="Image may contain: Alcohol, Beverage, Bottle, Liquor, Wine, and Wine Bottle" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67a5eee45104c837b397eeb1/3:4/w_748%2Cc_limit/HowToBuyChampagne_Ruinart-&#x27;Second-Skin&#x27;-Blanc-de-Blancs%2C-%25C2%25A385.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67a5eee45104c837b397eeb1/3:4/w_120,c_limit/HowToBuyChampagne_Ruinart-&#x27;Second-Skin&#x27;-Blanc-de-Blancs,-%C2%A385.jpg 120w, https://media.gq-magazine.co.uk/photos/67a5eee45104c837b397eeb1/3:4/w_240,c_limit/HowToBuyChampagne_Ruinart-&#x27;Second-Skin&#x27;-Blanc-de-Blancs,-%C2%A385.jpg 240w, https://media.gq-magazine.co.uk/photos/67a5eee45104c837b397eeb1/3:4/w_320,c_limit/HowToBuyChampagne_Ruinart-&#x27;Second-Skin&#x27;-Blanc-de-Blancs,-%C2%A385.jpg 320w, https://media.gq-magazine.co.uk/photos/67a5eee45104c837b397eeb1/3:4/w_640,c_limit/HowToBuyChampagne_Ruinart-&#x27;Second-Skin&#x27;-Blanc-de-Blancs,-%C2%A385.jpg 640w" sizes="100vw"/>RuinartBlanc de Blancs Second Skin£96.25 The Whisky Exchange<img loading="lazy" alt="Image may contain: Bottle, Alcohol, Beverage, Liquor, Wine, Wine Bottle, and Beer" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67a5eee5366f96678bab5369/3:4/w_748%2Cc_limit/HowToBuyChampagne_Pommery-Brut-Royal%2C-%25C2%25A344.99.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67a5eee5366f96678bab5369/3:4/w_120,c_limit/HowToBuyChampagne_Pommery-Brut-Royal,-%C2%A344.99.jpg 120w, https://media.gq-magazine.co.uk/photos/67a5eee5366f96678bab5369/3:4/w_240,c_limit/HowToBuyChampagne_Pommery-Brut-Royal,-%C2%A344.99.jpg 240w, https://media.gq-magazine.co.uk/photos/67a5eee5366f96678bab5369/3:4/w_320,c_limit/HowToBuyChampagne_Pommery-Brut-Royal,-%C2%A344.99.jpg 320w, https://media.gq-magazine.co.uk/photos/67a5eee5366f96678bab5369/3:4/w_640,c_limit/HowToBuyChampagne_Pommery-Brut-Royal,-%C2%A344.99.jpg 640w" sizes="100vw"/>PommeryChampagne NV Brut Royal£44.99 Waitrose<img loading="lazy" alt="Image may contain: Alcohol, Beverage, Bottle, Liquor, Wine, Wine Bottle, and Beer" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67a5eee40c84726a8ccfd37f/3:4/w_748%2Cc_limit/HowToBuyChampagne_Lanson-Black-Label-Brut-Magnum%2C-%25C2%25A384.99.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67a5eee40c84726a8ccfd37f/3:4/w_120,c_limit/HowToBuyChampagne_Lanson-Black-Label-Brut-Magnum,-%C2%A384.99.jpg 120w, https://media.gq-magazine.co.uk/photos/67a5eee40c84726a8ccfd37f/3:4/w_240,c_limit/HowToBuyChampagne_Lanson-Black-Label-Brut-Magnum,-%C2%A384.99.jpg 240w, https://media.gq-magazine.co.uk/photos/67a5eee40c84726a8ccfd37f/3:4/w_320,c_limit/HowToBuyChampagne_Lanson-Black-Label-Brut-Magnum,-%C2%A384.99.jpg 320w, https://media.gq-magazine.co.uk/photos/67a5eee40c84726a8ccfd37f/3:4/w_640,c_limit/HowToBuyChampagne_Lanson-Black-Label-Brut-Magnum,-%C2%A384.99.jpg 640w" sizes="100vw"/>LansonLe Black Label Brut Champagne Magnum£86 Amazon£100 MajesticWhat’s the best bottle size and why?Bottle sizes for champagne vary wildly. If we forget about the mini and half bottles, there are seven main bottle sizes, from a standard 75cl bottle (read: five to six glasses) to the Nebuchadnezzar, a 15-litre monster that pours around 120 glasses of the good stuff, if you can lift it.While there’s great variety, pretty much everyone involved in champagne agrees that a magnum offers the best quality. It’s the size of two standard bottles, but with the same size neck, meaning there’s less space for air to oxidise the wine inside the bottle. “Whichever style of champagne you choose, a magnum is the best,” says Robert Rand, UK managing director for Champagne Lanson. “The larger bottle creates excitement and theatre, but most importantly, quality is enhanced. This format slows down the ageing process of the wine and lowers the risk of oxidation, creating wines with more finesse, complexity and freshness.”“Life is better with magnums,” says François Demouy of Palmer & Co. “The magnum offers superior ageing potential, better bubble quality, and a more enjoyable experience. At Palmer, we like to say that our 75cl bottles are half-magnums.” Formula 1 makes sure its winners have four-bottle Jeroboams to hand on the podium (which GQ contributing editor and wine expert Lela London affectionately refers to as double magnums), in case you wanted to channel Sir Lewis and his seven – or eight – world championships.When should you drink champagne?There’s an inclination to save champagne for special events or milestones. Especially if you're looking for a failsafe option when it comes to the best gifts for him or best gifts for her.Ask anyone from Champagne and they’ll tell you to stop limiting yourself. After all, champagne is wine. “The British tend to celebrate all special and romantic occasions with an aperitif of champagne,” says Rand. “Personally, I'm more in line with Napoleon's sentiments, who famously said ‘In victory, you deserve champagne; in defeat, you need it.’” He certainly had plenty of practice.<img alt="Image may contain Nature Outdoors Countryside Desk Furniture Table Plate Rural Farm Vineyard Alcohol and Beverage" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67a5eee15104c837b397eeae/master/w_1600%2Cc_limit/HowToBuyChampagne_003.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67a5eee15104c837b397eeae/master/w_120,c_limit/HowToBuyChampagne_003.jpg 120w, https://media.gq-magazine.co.uk/photos/67a5eee15104c837b397eeae/master/w_240,c_limit/HowToBuyChampagne_003.jpg 240w, https://media.gq-magazine.co.uk/photos/67a5eee15104c837b397eeae/master/w_320,c_limit/HowToBuyChampagne_003.jpg 320w, https://media.gq-magazine.co.uk/photos/67a5eee15104c837b397eeae/master/w_640,c_limit/HowToBuyChampagne_003.jpg 640w, https://media.gq-magazine.co.uk/photos/67a5eee15104c837b397eeae/master/w_960,c_limit/HowToBuyChampagne_003.jpg 960w, https://media.gq-magazine.co.uk/photos/67a5eee15104c837b397eeae/master/w_1280,c_limit/HowToBuyChampagne_003.jpg 1280w, https://media.gq-magazine.co.uk/photos/67a5eee15104c837b397eeae/master/w_1600,c_limit/HowToBuyChampagne_003.jpg 1600w" sizes="100vw"/>Rosé champagne served in a tulip glass, as god intended. How do you open and'''
