["https://gq-magazine.co.uk/article/chris-bonington-mountaineer-interview-2025"]
title = "“You accept the fact that people are going to die”: life lessons from legendary mountaineer Sir Chris Bonington | British GQ"
description = "The 90-year-old on what it takes to lead an expedition up Everest, the state of modern climbing, and why worry is different thing to fear"
full_description = 'Lifestyle“You accept the fact that people are going to die”: life lessons from legendary mountaineer Sir Chris BoningtonThe 90-year-old on what it takes to lead an expedition up Everest, the state of modern climbing, and why worry is different thing to fearBy Josiah Gogarty27 February 2025All products are independently selected by our editors. If you buy something, we may earn an affiliate commission.The Old Man of Hoy is a stack of sandstone 137 metres high, rising out of the water off the coast of the Orkney Islands. No one knows it like Sir Chris Bonington. He was part of the three-person team that first climbed it back in 1966. The following year, he did so again for a live BBC broadcast viewed by 15 million people. In 2014, to celebrate his 80th birthday, Bonington climbed it again: an old man on the Old Man.Bonington, now 90, has climbed an awful lot else too, including Everest, Nupste, Annapurna II and Mont Blanc. Many of his expeditions – many of which he led – were the first to conquer a mountain’s particularly difficult ridge or rock face. After climbing Pakistan’s Baintha Brakk (“The Ogre”) with fellow mountaineer Doug Scott in 1977, no-one managed to replicate the feat until 2001. This year marks half a century since the 1975 expedition Bonington led which successfully scaled Everest by its southwest face – though he only summited the mountain himself a decade later in 1985. At age 50, he was briefly the oldest person to ever do so (a 55-year-old did it a few days later).Speaking from his house in the south of France, Bonington told GQ about his current, slightly more relaxed routine (including the odd visit to a climbing wall); the lessons he’s learned from leading people up and down very high mountains; and how he’s dealt with losing friends in treacherous terrain.What does your current day-to-day routine look like?I wake up about eight o’clock every morning, and gently come into life. I grab my iPhone and quickly see whether I’ve had any emails – I’m almost email-obsessive. We’ll have a light breakfast and then probably go for a walk. Then in the afternoon, if [it’s] slightly later on in the summer, I’ll go for a swim – we’ve got a very nice pool. I always hate that moment of actually committing yourself, and I find the best way [is] if I go down the deep end and jump in – splash! – then it’s fine. I usually try to do about 20 lengths.I’ve also got an apartment in Kensington – I walk out of our front door and can just turn left and walk a short distance, and I’m in Kensington Gardens. Then when we’re back in my original home, in Cumbria, you’ve got mile upon mile of fairly trackless country to go wandering over.Did you have a more rigorous regime during your peak climbing years?I always hated any form of routine. [Any] exercise was the natural exercise I had in the process of climbing.How did you lead your big climbing expeditions?I always kept about two bivouacs [camps] below the lead climbers. If you sat at base camp, you lost all control of what was happening. You [also] didn’t want to get involved in lead climbing, because you’d be focused totally [on] climbing the mountain and couldn’t control the rest of the expedition.As far as your decision-making goes, you had to be very careful not to immediately react to an event, because you had to see how it was going to reflect on everything else. At the same time, you couldn’t be too slow. You [needed a] medium kind of processing.I’d never relax, because on all those trips, it was always at the last minute that something went terribly wrong. You could only totally relax when every single person had come off the mountain and [was] alive and well.You didn’t make it to the summit yourself on your 1975 Everest trip, but you finally did on a trip ten years later. How did that feel?It was the first time I actually stood on top of [Everest]. I hadn’t realised just how much it meant to me; I couldn’t stop crying. It was the thought, really, of so many very, very close friends who’d lost their lives in our various efforts trying to climb that mountain.<img alt="Image may contain Mountain Mountain Range Nature Outdoors Peak Clothing Coat Glove Face Head and Person" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c0648da8753868e2199fd0/master/w_1600%2Cc_limit/1985%2520BONINGTON%2520EVEREST%25202.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c0648da8753868e2199fd0/master/w_120,c_limit/1985%20BONINGTON%20EVEREST%202.jpg 120w, https://media.gq-magazine.co.uk/photos/67c0648da8753868e2199fd0/master/w_240,c_limit/1985%20BONINGTON%20EVEREST%202.jpg 240w, https://media.gq-magazine.co.uk/photos/67c0648da8753868e2199fd0/master/w_320,c_limit/1985%20BONINGTON%20EVEREST%202.jpg 320w, https://media.gq-magazine.co.uk/photos/67c0648da8753868e2199fd0/master/w_640,c_limit/1985%20BONINGTON%20EVEREST%202.jpg 640w, https://media.gq-magazine.co.uk/photos/67c0648da8753868e2199fd0/master/w_960,c_limit/1985%20BONINGTON%20EVEREST%202.jpg 960w, https://media.gq-magazine.co.uk/photos/67c0648da8753868e2199fd0/master/w_1280,c_limit/1985%20BONINGTON%20EVEREST%202.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c0648da8753868e2199fd0/master/w_1600,c_limit/1985%20BONINGTON%20EVEREST%202.jpg 1600w" sizes="100vw"/>Bonington and Ang Lhakpa on the Everest summit, 1985 Chris BoningtonDid the danger of those climbs ever overwhelm you?No. It’s part of your own personal character, but it’s also experience: you’ve been through all of these things so many times before. You’d be worried about the people out in front and whether they were okay or not. You were worried, which is a very different thing from fear. You knew you had to keep it in control.How do you handle the responsibility of leading people in really risky situations?You accept the fact that people are going to die. On all too many of my expeditions, practically every expedition to Everest, someone has died. If they died just through bad luck, because they were in the wrong place at the wrong time, you’re saddened, but there’s no guilt in it.What about when someone – maybe you – makes an error?We were attempting K2 [in 1978], and I’d made a mistake in thinking a particular slope was safe. I remember Doug Scott said, “Look, Chris, I think it could go.” I said, “No, I’m pretty sure it’s safe.” I’d then gone down for a rest one camp below. Suddenly there’s this huge avalanche. I remember grabbing my camera to take a picture of it, and [someone] said, “For Christ’s sake, Chris, do you realise some of our guys could be in that?” Our guys were in it. It was Nick Estcourt, my dearest friend, and he was swept away in that avalanche. That was where I felt a real sense of guilt. When that thought comes [back], it still hits me.How did you cope with it?The first shock, it’s appalling. Then you have time to rationalise it and realise there’s nothing you could do – or even if there was, you’ve made a ghastly mistake, but it’s done. It’s finished. You’ve got to get on and deal with life as it actually is. That’s how you get through it.<img alt="Image may contain Mountain Mountain Range Nature Outdoors Peak Clothing Glove Adventure and Hiking" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c0648e156bf0909903488a/master/w_1600%2Cc_limit/10090%2520Chris%2520on%2520Menlungtse%25201988.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c0648e156bf0909903488a/master/w_120,c_limit/10090%20Chris%20on%20Menlungtse%201988.jpg 120w, https://media.gq-magazine.co.uk/photos/67c0648e156bf0909903488a/master/w_240,c_limit/10090%20Chris%20on%20Menlungtse%201988.jpg 240w, https://media.gq-magazine.co.uk/photos/67c0648e156bf0909903488a/master/w_320,c_limit/10090%20Chris%20on%20Menlungtse%201988.jpg 320w, https://media.gq-magazine.co.uk/photos/67c0648e156bf0909903488a/master/w_640,c_limit/10090%20Chris%20on%20Menlungtse%201988.jpg 640w, https://media.gq-magazine.co.uk/photos/67c0648e156bf0909903488a/master/w_960,c_limit/10090%20Chris%20on%20Menlungtse%201988.jpg 960w, https://media.gq-magazine.co.uk/photos/67c0648e156bf0909903488a/master/w_1280,c_limit/10090%20Chris%20on%20Menlungtse%201988.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c0648e156bf0909903488a/master/w_1600,c_limit/10090%20Chris%20on%20Menlungtse%201988.jpg 1600w" sizes="100vw"/>Bonington on the mountain Melungtse in 1988 Do mountaineers like yourself have a fundamentally different attitude towards risk than the rest of us? Is it an attitude we can learn from?The danger is the part that attracts [us], like a moth attracted by a candle. But then you become accustomed to it; you rationalise it; you deal with it. It becomes just part of the game you play. I think it [depends on the] basic character you’re born with. Some people were born cautious, other people were born as risk takers, and the majority were born somewhere in the middle.What do you make of the groups queueing up to summit Everest today?It was inevitable that, with time, more and more people were going to go to Everest. I just thank goodness I climbed [it] before all that was happening. Even in 1985, it was still very quiet – we had the mountain to ourselves, just about. But you’ve got to remember the interests of the local people. For them, Everest is an important cash cow. They make a living guiding, people staying in [their] tea houses and so on. That’s what one’s got to bear in mind, not worrying about our own climbing ethics. One can deplore the rubbish and everything else, but that’s superficial. It will all vanish and decay. In 500 years’ time, Everest will be just the same.Do you still do any climbing now?I do a tiny bit – we’ve got Westway Climbing in Shepherd’s Bush. I’ve even got my wife Loreto on it as well. I usually find that I’m the oldest around.Sir Chris Bonington has spent much of his career testing and refining Berghaus gear, and (alongside Liam Gallagher) models the brand’s Icons Collection.'
author = "Josiah Gogarty"
