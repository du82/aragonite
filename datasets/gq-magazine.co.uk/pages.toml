full_description = '''FashionThe best knitted polo shirts for injecting some mod energy into your wardrobeBy Heidi Quill, Adam Cheung, Jessie Atkinson and Faye Fearon4 March 2025From Jacob Elordi to Pharrell Williams, the knitted polo shirt is a modish style staple. Find yours with GQ's pick of the most praiseworthy polos out thereAll products are independently selected by our editors. If you buy something, we may earn an affiliate commission.Once upon a time, evoking an image of the best knitted polo shirts might have meant 1950s Italian-America, The Talented Mr Ripley’s Dickie or even Mad Men’s Don Draper. Today, you may also think of Jacob Elordi in Saltburn and its attached press tour — we all remember the star in that perennial sell-out Ami Paris number on Jimmy Kimmel, don’t we? Modern retro or a modern classic, the truth is that the modern best polo shirts are becoming almost as important a best men's knitwear wardrobe staple as a T-shirt and a pair of chinos.SKIP TO: What is a knitted polo shirt? | Which knitted polo shirts are best for a smart casual look?<img alt="Image may contain Clothing Pants Jeans Person Standing Adult Footwear Shoe Wristwatch Face Head and Photography" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/665720c127530c059ab2a881/master/w_1600%2Cc_limit/Street_Style_Shoot_A_13.jpg" srcSet="https://media.gq-magazine.co.uk/photos/665720c127530c059ab2a881/master/w_120,c_limit/Street_Style_Shoot_A_13.jpg 120w, https://media.gq-magazine.co.uk/photos/665720c127530c059ab2a881/master/w_240,c_limit/Street_Style_Shoot_A_13.jpg 240w, https://media.gq-magazine.co.uk/photos/665720c127530c059ab2a881/master/w_320,c_limit/Street_Style_Shoot_A_13.jpg 320w, https://media.gq-magazine.co.uk/photos/665720c127530c059ab2a881/master/w_640,c_limit/Street_Style_Shoot_A_13.jpg 640w, https://media.gq-magazine.co.uk/photos/665720c127530c059ab2a881/master/w_960,c_limit/Street_Style_Shoot_A_13.jpg 960w, https://media.gq-magazine.co.uk/photos/665720c127530c059ab2a881/master/w_1280,c_limit/Street_Style_Shoot_A_13.jpg 1280w, https://media.gq-magazine.co.uk/photos/665720c127530c059ab2a881/master/w_1600,c_limit/Street_Style_Shoot_A_13.jpg 1600w" sizes="100vw"/>Percival ‘Pablo’ knit polo shirt, shot nearby the GQ HQ in London by Jeeba Marri Jeeba Marri<img alt="Image may contain Clothing Shirt Wristwatch Adult Person Pants Accessories Jewelry Necklace Sleeve and Jeans" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/66587c535d0197b3acbc3991/master/w_1600%2Cc_limit/Street_Style_Shoot_A_5_Updated.jpg" srcSet="https://media.gq-magazine.co.uk/photos/66587c535d0197b3acbc3991/master/w_120,c_limit/Street_Style_Shoot_A_5_Updated.jpg 120w, https://media.gq-magazine.co.uk/photos/66587c535d0197b3acbc3991/master/w_240,c_limit/Street_Style_Shoot_A_5_Updated.jpg 240w, https://media.gq-magazine.co.uk/photos/66587c535d0197b3acbc3991/master/w_320,c_limit/Street_Style_Shoot_A_5_Updated.jpg 320w, https://media.gq-magazine.co.uk/photos/66587c535d0197b3acbc3991/master/w_640,c_limit/Street_Style_Shoot_A_5_Updated.jpg 640w, https://media.gq-magazine.co.uk/photos/66587c535d0197b3acbc3991/master/w_960,c_limit/Street_Style_Shoot_A_5_Updated.jpg 960w, https://media.gq-magazine.co.uk/photos/66587c535d0197b3acbc3991/master/w_1280,c_limit/Street_Style_Shoot_A_5_Updated.jpg 1280w, https://media.gq-magazine.co.uk/photos/66587c535d0197b3acbc3991/master/w_1600,c_limit/Street_Style_Shoot_A_5_Updated.jpg 1600w" sizes="100vw"/>Modelled by Senior Commerce Writer Owen Gough, styled by Senior Commerce Writer Heidi Quill Percival ‘Pablo’ knit polo shirt | Duke + Dexter ‘Wilde Orange’ loafers | Burberry ‘Kensington’ trench coatWhat are GQ's best knitted polo shirts for men?Best overall knitted polo shirt: Arket, £67 at arket.comBest retro style knitted polo shirt: Percival, £112 at percivalclo.comBest chunky knitted polo shirt: Ami Paris, £395 £276 at mytheresa.comBest high street knitted polo shirt: Reiss, £90 at reiss.comBest knitted polo shirt by a classic brand: John Smedley, £230 at johnsmedley.comHow do we select our favourite knitted polo shirts?So, how exactly do we choose what constitutes the best knitted polo shirts for men in 2025? Simple. We know our stuff, we do our research, and we get out there to experience as much product as possible.Our section head of menswear for GQ Recommends, Heidi Quill, is obsessed with clothes. Joining British GQ in 2021, Heidi might primarily look after clothing content, but she spends a healthy amount of time up to her neck in samples, checking product for the very best quality, price and design, all before recommending it to you. That includes knowing everything there is to know about an excellent knitted polo.Finely balanced between smart and casual, this menswear staple ought to have a short, sharp placket and use either a cotton or wool blend to create a textural finish. That's in the minds of Heidi and our team of contributing writers and freelancers (Jessie Atkinson, Faye Fearon and Adam Cheung), anyway. Scroll on for their top picks.For more fashion, grooming and technology releases delivered straight to your inbox, sign up for our GQ Recommends newsletter.Best overall knitted polo shirt<source media="(max-width: 767px)" srcSet="https://media.gq-magazine.co.uk/photos/65e60bc0327053bb4d66cc9c/3:4/w_120%2Cc_limit/Knitted-polos-2.jpg 120w, https://media.gq-magazine.co.uk/photos/65e60bc0327053bb4d66cc9c/3:4/w_240%2Cc_limit/Knitted-polos-2.jpg 240w, https://media.gq-magazine.co.uk/photos/65e60bc0327053bb4d66cc9c/3:4/w_320%2Cc_limit/Knitted-polos-2.jpg 320w, https://media.gq-magazine.co.uk/photos/65e60bc0327053bb4d66cc9c/3:4/w_640%2Cc_limit/Knitted-polos-2.jpg 640w, https://media.gq-magazine.co.uk/photos/65e60bc0327053bb4d66cc9c/3:4/w_800%2Cc_limit/Knitted-polos-2.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.gq-magazine.co.uk/photos/65e60bc0327053bb4d66cc9c/3:4/w_320%2Cc_limit/Knitted-polos-2.jpg 320w, https://media.gq-magazine.co.uk/photos/65e60bc0327053bb4d66cc9c/3:4/w_640%2Cc_limit/Knitted-polos-2.jpg 640w, https://media.gq-magazine.co.uk/photos/65e60bc0327053bb4d66cc9c/3:4/w_960%2Cc_limit/Knitted-polos-2.jpg 960w, https://media.gq-magazine.co.uk/photos/65e60bc0327053bb4d66cc9c/3:4/w_1280%2Cc_limit/Knitted-polos-2.jpg 1280w, https://media.gq-magazine.co.uk/photos/65e60bc0327053bb4d66cc9c/3:4/w_1600%2Cc_limit/Knitted-polos-2.jpg 1600w, https://media.gq-magazine.co.uk/photos/65e60bc0327053bb4d66cc9c/3:4/w_1920%2Cc_limit/Knitted-polos-2.jpg 1920w, https://media.gq-magazine.co.uk/photos/65e60bc0327053bb4d66cc9c/3:4/w_2240%2Cc_limit/Knitted-polos-2.jpg 2240w, https://media.gq-magazine.co.uk/photos/65e60bc0327053bb4d66cc9c/3:4/w_2580%2Cc_limit/Knitted-polos-2.jpg 2580w" sizes="100vw"/><img loading="lazy" alt="Arket knitted polo shirt as selected by Heidi Quill" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/65e60bc0327053bb4d66cc9c/3:4/w_320%2Cc_limit/Knitted-polos-2.jpg"/>1/22ArketMerino Polo Jumper £67 ArketArketFabrication: Stretch cottonSizes: XS-XLColours: Navy, Cream, Black, Khaki (+4 more)Arket has chosen merino wool for its selection of knit polos — and what a selection it is. If you’re exploring the transitional piece for the first time, buying one of Arket’s interpretations may encourage you to collect ‘em all — they’re only £67 each and available in a neutral rainbow of colours, including this: classic navy.Best retro-style knitted polo shirt<source media="(max-width: 767px)" srcSet="https://media.gq-magazine.co.uk/photos/667afec5158be83d8b1a17b7/3:4/w_120%2Cc_limit/Percival-sale-Casa-Piccante-Shirt.jpg 120w, https://media.gq-magazine.co.uk/photos/667afec5158be83d8b1a17b7/3:4/w_240%2Cc_limit/Percival-sale-Casa-Piccante-Shirt.jpg 240w, https://media.gq-magazine.co.uk/photos/667afec5158be83d8b1a17b7/3:4/w_320%2Cc_limit/Percival-sale-Casa-Piccante-Shirt.jpg 320w, https://media.gq-magazine.co.uk/photos/667afec5158be83d8b1a17b7/3:4/w_640%2Cc_limit/Percival-sale-Casa-Piccante-Shirt.jpg 640w, https://media.gq-magazine.co.uk/photos/667afec5158be83d8b1a17b7/3:4/w_800%2Cc_limit/Percival-sale-Casa-Piccante-Shirt.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.gq-magazine.co.uk/photos/667afec5158be83d8b1a17b7/3:4/w_320%2Cc_limit/Percival-sale-Casa-Piccante-Shirt.jpg 320w, https://media.gq-magazine.co.uk/photos/667afec5158be83d8b1a17b7/3:4/w_640%2Cc_limit/Percival-sale-Casa-Piccante-Shirt.jpg 640w, https://media.gq-magazine.co.uk/photos/667afec5158be83d8b1a17b7/3:4/w_960%2Cc_limit/Percival-sale-Casa-Piccante-Shirt.jpg 960w, https://media.gq-magazine.co.uk/photos/667afec5158be83d8b1a17b7/3:4/w_1280%2Cc_limit/Percival-sale-Casa-Piccante-Shirt.jpg 1280w, https://media.gq-magazine.co.uk/photos/667afec5158be83d8b1a17b7/3:4/w_1600%2Cc_limit/Percival-sale-Casa-Piccante-Shirt.jpg 1600w, https://media.gq-magazine.co.uk/photos/667afec5158be83d8b1a17b7/3:4/w_1920%2Cc_limit/Percival-sale-Casa-Piccante-Shirt.jpg 1920w, https://media.gq-magazine.co.uk/photos/667afec5158be83d8b1a17b7/3:4/w_2240%2Cc_limit/Percival-sale-Casa-Piccante-Shirt.jpg 2240w, https://media.gq-magazine.co.uk/photos/667afec5158be83d8b1a17b7/3:4/w_2580%2Cc_limit/Percival-sale-Casa-Piccante-Shirt.jpg 2580w" sizes="100vw"/><img loading="lazy" alt="Image may contain Blouse Clothing Shirt Sleeve Adult and Person" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/667afec5158be83d8b1a17b7/3:4/w_320%2Cc_limit/Percival-sale-Casa-Piccante-Shirt.jpg"/>2/22Percival'Casa Piccante' polo shirt£139 £111.20 PercivalPercivalFabrication: 100% cottonSizes: XS-XXLColours: Rust, navy, greenPercival is no stranger to the humble knit polo, and this ‘Casa Piccante’ piece is among our favourites. A standout in the collection, this pick subtly references 1950's Italian American aesthetics. Wear yours with black dress pants and as many buttons undone as you dare.Best chunky knitted polo shirt<source media="(max-width: 767px)" srcSet="https://media.gq-magazine.co.uk/photos/65e60bc0a17626c416cfb923/3:4/w_120%2Cc_limit/Knitted-polos-4.jpg 120w, https://media.gq-magazine.co.uk/photos/65e60bc0a17626c416cfb923/3:4/w_240%2Cc_limit/Knitted-polos-4.jpg 240w, https://media.gq-magazine.co.uk/photos/65e60bc0a17626c416cfb923/3:4/w_320%2Cc_limit/Knitted-polos-4.jpg 320w, https://media.gq-magazine.co.uk/photos/65e60bc0a17626c416cfb923/3:4/w_640%2Cc_limit/Knitted-polos-4.jpg 640w, https://media.gq-magazine.co.uk/photos/65e60bc0a17626c416cfb923/3:4/w_800%2Cc_limit/Knitted-polos-4.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.gq-magazine.co.uk/photos/65e60bc0a17626c416cfb923/3:4/w_320%2Cc_limit/Knitted-polos-4.jpg 320w, https://media.gq-magazine.co.uk/photos/65e60bc0a17626c416cfb923/3:4/w_640%2Cc_limit/Knitted-polos-4.jpg 640w, https://media.gq-magazine.co.uk/photos/65e60bc0a17626c416cfb923/3:4/w_960%2Cc_limit/Knitted-polos-4.jpg 960w, https://media.gq-magazine.co.uk/photos/65e60bc0a17626c416cfb923/3:4/w_1280%2Cc_limit/Knitted-polos-4.jpg 1280w, https://media.gq-magazine.co.uk/photos/65e60bc0a17626c416cfb923/3:4/w_1600%2Cc_limit/Knitted-polos-4.jpg 1600w, https://media.gq-magazine.co.uk/photos/65e60bc0a17626c416cfb923/3:4/w_1920%2Cc_limit/Knitted-polos-4.jpg 1920w, https://media.gq-magazine.co.uk/photos/65e60bc0a17626c416cfb923/3:4/w_2240%2Cc_limit/Knitted-polos-4.jpg 2240w, https://media.gq-magazine.co.uk/photos/65e60bc0a17626c416cfb923/3:4/w_2580%2Cc_limit/Knitted-polos-4.jpg 2580w" sizes="100vw"/><img loading="lazy" alt="Ami Paris knitted polo shirt as selected by Heidi Quill" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/65e60bc0a17626c416cfb923/3:4/w_320%2Cc_limit/Knitted-polos-4.jpg"/>3/22AMI ParisHairy Polo£420 FlannelsAmi ParisFabrication: Alpaca/wool mixSizes: S-XLColours: AquamarineThe sweater; the myth; the legend. This is the knitted polo worn by Jacob Elordi on Jimmy Kimmel. While the grey taupe number the Priscilla star wore is (understandably) now out of stock, both cream and aqua shades are still available. Now we only have to pray that the goes-with-everything grey is restocked very soon.Best high street polo shirt<source media="(max-width: 767px)" srcSet="https://media.gq-magazine.co.uk/photos/65e60bc3327053bb4d66cca0/3:4/w_120%2Cc_limit/Knitted-polos-7.jpg 120w, https://media.gq-magazine.co.uk/photos/65e60bc3327053bb4d66cca0/3:4/w_240%2Cc_limit/Knitted-polos-7.jpg 240w, https://media.gq-magazine.co.uk/photos/65e60bc3327053bb4d66cca0/3:4/w_320%2Cc_limit/Knitted-polos-7.jpg 320w, https://media.gq-magazine.co.uk/photos/65e60bc3327053bb4d66cca0/3:4/w_640%2Cc_limit/Knitted-polos-7.jpg 640w, https://media.gq-magazine.co.uk/photos/65e60bc3327053bb4d66cca0/3:4/w_800%2Cc_limit/Knitted-polos-7.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.gq-magazine.co.uk/photos/65e60bc3327053bb4d66cca0/3:4/w_320%2Cc_limit/Knitted-polos-7.jpg 320w, https://media.gq-magazine.co.uk/photos/65e60bc3327053bb4d66cca0/3:4/w_640%2Cc_limit/Knitted-polos-7.jpg 640w, https://media.gq-magazine.co.uk/photos/65e60bc3327053bb4d66cca0/3:4/w_960%2Cc_limit/Knitted-polos-7.jpg 960w, https://media.gq-magazine.co.uk/photos/65e60bc3327053bb4d66cca0/3:4/w_1280%2Cc_limit/Knitted-polos-7.jpg 1280w, https://media.gq-magazine.co.uk/photos/65e60bc3327053bb4d66cca0/3:4/w_1600%2Cc_limit/Knitted-polos-7.jpg 1600w, https://media.gq-magazine.co.uk/photos/65e60bc3327053bb4d66cca0/3:4/w_1920%2Cc_limit/Knitted-polos-7.jpg 1920w, https://media.gq-magazine.co.uk/photos/65e60bc3327053bb4d66cca0/3:4/w_2240%2Cc_limit/Knitted-polos-7.jpg 2240w, https://media.gq-magazine.co.uk/photos/65e60bc3327053bb4d66cca0/3:4/w_2580%2Cc_limit/Knitted-polos-7.jpg 2580w" sizes="100vw"/><img loading="lazy" alt="Reiss &#x27;Trafford&#x27; knitted polo shirt as selected by Faye Fearon" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/65e60bc3327053bb4d66cca0/3:4/w_320%2Cc_limit/Knitted-polos-7.jpg"/>4/22ReissTrafford Merino Wool Polo Shirt£98 ReissReissFabrication: Merino woolSizes: XS-3XLColours: Navy, Black, Grey, Racing Green (and one more)So light is the merino wool spun by Reiss in this polo sweater that you’d be forgiven for thinking it’s cotton. Up close though, the opulent melange texture of the material can be admired, offering a rich base for the rest of your outfit to excel around.Best knitted polo shirt by a classic brand<source media="(max-width: 767px)" srcSet="https://media.gq-magazine.co.uk/photos/65e60bc3a17626c416cfb927/3:4/w_120%2Cc_limit/Knitted-polos-6.jpg 120w, https://media.gq-magazine.co.uk/photos/65e60bc3a17626c416cfb927/3:4/w_240%2Cc_limit/Knitted-polos-6.jpg 240w, https://media.gq-magazine.co.uk/photos/65e60bc3a17626c416cfb927/3:4/w_320%2Cc'''
