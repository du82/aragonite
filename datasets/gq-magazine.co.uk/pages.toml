["https://gq-magazine.co.uk/christmas/gallery/best-gifts-for-mum"]
title = "Best gifts for mums 2025: Gift ideas for your mum | British GQ"
description = "Discover the best gifts for mum in 2025 with British GQ's curated selection. From luxury beauty products to unique experiences, find the perfect gift for every mum"
full_description = '''GiftsThe best gifts for mums that she actually wants in 2025By Jessie Atkinson24 February 2025Shop GQ’s edit of the best gifts for mum this year, from hampers and scented candles to jewellery and booksAll products are independently selected by our editors. If you buy something, we may earn an affiliate commission.I have dutifully compiled a very big list of lovely things in this guide to the best gifts for mums, but up top I'd like to discuss what dutiful children, commenters on Reddit forums, such as R/Gifts, and mothers themselves know to be true. Namely: the most important thing you can do for your mum on her next birthday is be there and be nice.Sure, gifts for new mums, old mums, mother-in-laws and mother figures are coming out of our ears, but your choice should always be accompanied by an experience: a visit home, breakfast in bed, a home-cooked feast, a promise for a weekend away, or even a homemade gift such as the best hamper you can muster, including all her favourite things. The best gifts for dads might elude even the most inventive of us at times, but choosing something for your mum is comparatively easy… and easily fortified by your best behaviour.Having said that, my edit of gifts to buy your mum covers everything from gift sets and beauty products to homeware bits, chocolates and experiences. In order to cater to every mum, I've touched on seasonal standouts such as Desmond & Dempsey's sleepwear gift sets, plus The White Company's cosy presents, as well as year-round picks, like the uniquely excellent experience that is ABBA Voyage or a lovely new fragrance from Molton Brown. In essence, I've tried to make it easier than ever to find the perfect present for your mum — within your budget.Best Overall Gifts for MumsBest Mother's Day GiftsBest Birthday Gifts for MumsBest Affordable Gifts for MumsBest Homeware Gifts for MumsBest Fashion & Beauty Gifts for MumsBest Gifts for the Mum Who Has EverythingBest Luxury Gifts for MumsWhat are GQ's best gifts for mums?Best overall gift for mums: The White Company Dressing Gown, £70 at thewhitecompany.comBest last-minute gift for mums: Bloom & Wild flower subscription, from £20/bouquet at bloomandwild.comBest jewellery gift for mums: Mejuri Silver/Gold Hoop Earrings, £78 at mejuri.comBest hamper for mums: Cheesegeek Stevie Cheese/Wine Subscription, £55 at thecheesegeek.comBest experience gift for mums: Kew Gardens & Cream Tea Experience for Two, £52 at virginexperiencedays.co.ukTeam British GQ choose the best gifts for mumsEditorial Assistant Olivia Vaile swears by a scented candle. “Nothing radiates tranquillity and says ‘sit down and relax’ quite like a burning candle. Jo Malone’s Pear and Freesia scent is my go-to.”Audience Development Manager Hannah Enderby concurs: “The gift of a candle doesn’t get better than one from Diptyque.”<img loading="lazy" alt="Best gifts for mums chosen by Olivia Vaile for British GQ" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/6728f4edf5e260a579a6d0a8/3:4/w_748%2Cc_limit/Gifts-for-mums-jo-malone-candle.jpg" srcSet="https://media.gq-magazine.co.uk/photos/6728f4edf5e260a579a6d0a8/3:4/w_120,c_limit/Gifts-for-mums-jo-malone-candle.jpg 120w, https://media.gq-magazine.co.uk/photos/6728f4edf5e260a579a6d0a8/3:4/w_240,c_limit/Gifts-for-mums-jo-malone-candle.jpg 240w, https://media.gq-magazine.co.uk/photos/6728f4edf5e260a579a6d0a8/3:4/w_320,c_limit/Gifts-for-mums-jo-malone-candle.jpg 320w, https://media.gq-magazine.co.uk/photos/6728f4edf5e260a579a6d0a8/3:4/w_640,c_limit/Gifts-for-mums-jo-malone-candle.jpg 640w" sizes="100vw"/>Jo MaloneEnglish Pear & Freesia Scented Candle£56 Jo Malone<img loading="lazy" alt="The White Company Seychelles candle reviewed for GQ’s guide to the best scented candles" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/66e30169a464209c29c9b35f/3:4/w_748%2Cc_limit/Scented-candles-The-White-Company-Seychelles.jpg" srcSet="https://media.gq-magazine.co.uk/photos/66e30169a464209c29c9b35f/3:4/w_120,c_limit/Scented-candles-The-White-Company-Seychelles.jpg 120w, https://media.gq-magazine.co.uk/photos/66e30169a464209c29c9b35f/3:4/w_240,c_limit/Scented-candles-The-White-Company-Seychelles.jpg 240w, https://media.gq-magazine.co.uk/photos/66e30169a464209c29c9b35f/3:4/w_320,c_limit/Scented-candles-The-White-Company-Seychelles.jpg 320w, https://media.gq-magazine.co.uk/photos/66e30169a464209c29c9b35f/3:4/w_640,c_limit/Scented-candles-The-White-Company-Seychelles.jpg 640w" sizes="100vw"/>The White CompanySeychelles candle£24 The White CompanyResearch Associate Zinya Salifti relies on Liberty London for her mum-related gifting: “Colourful, soft, and elegant, this robe is perfect for lounging around with a cup of tea at home. It’s practical, but choosing a thoughtful pattern makes it all the more personal. Plus, she’ll think of you every time she wears it!”Lifestyle Director Mike Christensen goes a more zany but undeniably smart route: a fancy dog poo bag holder. “These days, the bowel movements of my mother’s dog (a Tibetan Terrier called Kenzo, btw) get a lot of airtime. So here’s to making at least one part of the whole carrying-poo-bags-with-you chic.”<img loading="lazy" alt="Best gifts for mums chosen by Jessie Atkinson Liberty Ciara Tana Lawn Robe" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/679b8f0f96b015f378b3b539/3:4/w_748%2Cc_limit/Gifts-for-Mum--Liberty-Ciara-Tana-Lawn-Robe.jpg" srcSet="https://media.gq-magazine.co.uk/photos/679b8f0f96b015f378b3b539/3:4/w_120,c_limit/Gifts-for-Mum--Liberty-Ciara-Tana-Lawn-Robe.jpg 120w, https://media.gq-magazine.co.uk/photos/679b8f0f96b015f378b3b539/3:4/w_240,c_limit/Gifts-for-Mum--Liberty-Ciara-Tana-Lawn-Robe.jpg 240w, https://media.gq-magazine.co.uk/photos/679b8f0f96b015f378b3b539/3:4/w_320,c_limit/Gifts-for-Mum--Liberty-Ciara-Tana-Lawn-Robe.jpg 320w, https://media.gq-magazine.co.uk/photos/679b8f0f96b015f378b3b539/3:4/w_640,c_limit/Gifts-for-Mum--Liberty-Ciara-Tana-Lawn-Robe.jpg 640w" sizes="100vw"/>Liberty LondonCiara Tana Lawn Cotton Robe£245 Liberty London<img loading="lazy" alt="Best gifts for mums chosen by Jessie Atkinson Anya Hindmarch Coca Cola Purse" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/679b8f011eae08691f30f707/3:4/w_748%2Cc_limit/Gifts-for-Mum-Anya-Hindmarch-Coca-Cola-Purse.jpg" srcSet="https://media.gq-magazine.co.uk/photos/679b8f011eae08691f30f707/3:4/w_120,c_limit/Gifts-for-Mum-Anya-Hindmarch-Coca-Cola-Purse.jpg 120w, https://media.gq-magazine.co.uk/photos/679b8f011eae08691f30f707/3:4/w_240,c_limit/Gifts-for-Mum-Anya-Hindmarch-Coca-Cola-Purse.jpg 240w, https://media.gq-magazine.co.uk/photos/679b8f011eae08691f30f707/3:4/w_320,c_limit/Gifts-for-Mum-Anya-Hindmarch-Coca-Cola-Purse.jpg 320w, https://media.gq-magazine.co.uk/photos/679b8f011eae08691f30f707/3:4/w_640,c_limit/Gifts-for-Mum-Anya-Hindmarch-Coca-Cola-Purse.jpg 640w" sizes="100vw"/>Anya HindmarchCoca Cola Coin Purse£295 Anya Hindmarch<img alt="Image may contain Bottle Book Publication and Cup" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/66d9c03c1ded9d01cb55d62a/master/w_1600%2Cc_limit/Gifts%2520for%2520Mums%2520UGC%2520.jpg" srcSet="https://media.gq-magazine.co.uk/photos/66d9c03c1ded9d01cb55d62a/master/w_120,c_limit/Gifts%20for%20Mums%20UGC%20.jpg 120w, https://media.gq-magazine.co.uk/photos/66d9c03c1ded9d01cb55d62a/master/w_240,c_limit/Gifts%20for%20Mums%20UGC%20.jpg 240w, https://media.gq-magazine.co.uk/photos/66d9c03c1ded9d01cb55d62a/master/w_320,c_limit/Gifts%20for%20Mums%20UGC%20.jpg 320w, https://media.gq-magazine.co.uk/photos/66d9c03c1ded9d01cb55d62a/master/w_640,c_limit/Gifts%20for%20Mums%20UGC%20.jpg 640w, https://media.gq-magazine.co.uk/photos/66d9c03c1ded9d01cb55d62a/master/w_960,c_limit/Gifts%20for%20Mums%20UGC%20.jpg 960w, https://media.gq-magazine.co.uk/photos/66d9c03c1ded9d01cb55d62a/master/w_1280,c_limit/Gifts%20for%20Mums%20UGC%20.jpg 1280w, https://media.gq-magazine.co.uk/photos/66d9c03c1ded9d01cb55d62a/master/w_1600,c_limit/Gifts%20for%20Mums%20UGC%20.jpg 1600w" sizes="100vw"/>Shot at GQ HQ by Jeeba Marri Aesop Bathroom Essentials Bundle | Drowsy Silk Eye Mask | Missoma Drop Earrings | Rachel Jackson Necklace | Nio Cocktails Gin Box | Papier Reading Journal | Drowsy Candle | Elizabeth Scarlett Embroidered PouchHow I chose the best gifts for mums<img alt="Image may contain Clothing TShirt Face Head Person Photography Portrait Happy Smile Adult Formal Wear and Suit" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/668e9adb5a37ccd97427b205/master/w_1600%2Cc_limit/JESSIE_ATKINSON_039.jpg" srcSet="https://media.gq-magazine.co.uk/photos/668e9adb5a37ccd97427b205/master/w_120,c_limit/JESSIE_ATKINSON_039.jpg 120w, https://media.gq-magazine.co.uk/photos/668e9adb5a37ccd97427b205/master/w_240,c_limit/JESSIE_ATKINSON_039.jpg 240w, https://media.gq-magazine.co.uk/photos/668e9adb5a37ccd97427b205/master/w_320,c_limit/JESSIE_ATKINSON_039.jpg 320w, https://media.gq-magazine.co.uk/photos/668e9adb5a37ccd97427b205/master/w_640,c_limit/JESSIE_ATKINSON_039.jpg 640w, https://media.gq-magazine.co.uk/photos/668e9adb5a37ccd97427b205/master/w_960,c_limit/JESSIE_ATKINSON_039.jpg 960w, https://media.gq-magazine.co.uk/photos/668e9adb5a37ccd97427b205/master/w_1280,c_limit/JESSIE_ATKINSON_039.jpg 1280w, https://media.gq-magazine.co.uk/photos/668e9adb5a37ccd97427b205/master/w_1600,c_limit/JESSIE_ATKINSON_039.jpg 1600w" sizes="100vw"/>Choosing a gift for your mum is a subjective endeavour, which is why I've tried to present a wide variety of options from very different categories: while I do like to dabble in the cliché, I also present things like jigsaws, DIY biscuit icing boxes and tickets to ABBA Voyage in order to cater to the diverse types of mum to be found outside traditionally narrow gifting categories. As British GQ's in-house gifting expert, I (Jessie Atkinson) work across 25+ gift guides, attending launches, trying out products of all kinds that would make great presents and personally selecting from my own favourite things (currently, I can't get enough of my Eberjey pyjamas, and my mum loves the Maison Balzac glassware I bought her last year). Elsewhere, I've selected products and experiences that have excellent customer feedback and/or are provided by brands that we’ve tried and loved before.Shop GQ's edit of the top gifts for mums in 2025 that she will love…Best Overall Gifts for MumsIf you want to be rid of the pressures of gifting in 1, 2, 3, these are your most prominent lifelines. Somewhat of a one stop shop, The White Company has cashmere-streaked socks, cosy robes and faux fur warmers, as well as diffusers and candles in abundance. For the latter, Neom is also a dab hand at candle-making, while Mejuri and Monica Vinader hold the answer to your affordable-but-still-quality jewellery prayers. Some other easy solutions: knitwear, glassware, sleepwear, and cheese and wine (duh).<img loading="lazy" alt="" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/65b3b7c98a0aedb70aa637e4/3:4/w_748%2Cc_limit/WinteraEssentials_Dressing-gowns.jpg" srcSet="https://media.gq-magazine.co.uk/photos/65b3b7c98a0aedb70aa637e4/3:4/w_120,c_limit/WinteraEssentials_Dressing-gowns.jpg 120w, https://media.gq-magazine.co.uk/photos/65b3b7c98a0aedb70aa637e4/3:4/w_240,c_limit/WinteraEssentials_Dressing-gowns.jpg 240w, https://media.gq-magazine.co.uk/photos/65b3b7c98a0aedb70aa637e4/3:4/w_320,c_limit/WinteraEssentials_Dressing-gowns.jpg 320w, https://media.gq-magazine.co.uk/photos/65b3b7c98a0aedb70aa637e4/3:4/w_640,c_limit/WinteraEssentials_Dressing-gowns.jpg 640w" sizes="100vw"/>The White CompanyDressing Gown£70 The White CompanySave her the guilt of theft by replacing that five-star hotel robe she's had her eye on with The White Company's just as luxurious fluffy gown. <img loading="lazy" alt="Best gifts for mums chosen by Jessie Atkinson Adidas x Liberty Track Pants" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/679b8f1255a013cbfc861f4a/3:4/w_748%2Cc_limit/Gifts-for-Mum-Adidas-x-Liberty-Track-Pants.jpg" srcSet="https://media.gq-magazine.co.uk/photos/679b8f1255a013cbfc861f4a/3:4/w_120,c_limit/Gifts-for-Mum-Adidas-x-Liberty-Track-Pants.jpg 120w, https://media.gq-magazine.co.uk/photos/679b8f1255a013cbfc861f4a/3:4/w_240,c_limit/Gifts-for-Mum-Adidas-x-Liberty-Track-Pants.jpg 240w, https://media.gq-magazine.co.uk/photos/679b8f1255a013cbfc861f4a/3:4/w_320,c_limit/Gifts-for-Mum-Adidas-x-Liberty-Track-Pants.jpg 320w, https://media.gq-magazine.co.uk/photos/679b8f1255a013cbfc861f4a/3:4/w_640,c_limit/Gifts-for-Mum-Adidas-x-Liberty-Track-Pants.jpg 640w" sizes="100vw"/>Adidasx Liberty London Wide Leg Track Pants£75 AdidasAdidas' cult striped joggers, now bedazzled with a classic chintzy Liberty print. <img loading="lazy" alt="Image may contain: Cosmetics, Lipstick, and Bottle" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/679a60f06324c9885be5d878/3:4/w_748%2Cc_limit/best-gifts-for-mums-chosen-by-Jessie-Atkinson-111skin-all-over-radiant-skin-set.jpg" srcSet="https://media.gq-magazine.co.uk/photos/679a60f06324c9885be5d878/3:4/w_120,c_limit/best-gifts-for-mums-chosen-by-Jessie-Atkinson-111skin-all-over-radiant-skin-set.jpg 120w, https://media.gq-magazine.co.uk/photos/679a60f06324c9885be5d878/3:4/w_240,c_limit/best-gifts-for-mums-chosen-by-Jessie-Atkinson-111skin-all-over-radiant-skin-set.jpg 240w, https://media.gq-magazine.co.uk/photos/679a60f06324c9885be5d878/3:4/w_320,c_limit/best-gifts-for-mums-chosen-by-Jessie-Atkinson-111skin-all-over-radiant-skin-set.jpg 320w, https://media.gq-magazine.co.uk/photos/679a60f06324c9885be5d878/3:4/w_640,c_limit/best-gifts-for-mums-chosen-by-Jessie-Atkinson-111skin-all-over-radiant-skin-set.jpg 640w" sizes="100vw"/>111SkinAll Over Radiant Skin Set£145 111SkinIf you're going to trust one brand with a real skincare treat, let it be 111Skin and its cosmetic surgeon-developed masks and tinctures. <img loading="lazy" alt="Image may contain: Napkin, Accessories, Wallet, and Blanket" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67a605484d7357b956d11dc2/3:4/w_748%2Cc_limit/Lulu_Guiness_best-gifts-for-her-chosen-by-Jessie-Atkinson-Lulu-Guinness-scarf.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67a605484d7357b956d11dc2/3:4/w_120,c_limit/Lulu_Guiness_best-gifts-for-her-chosen-by-Jessie-Atkinson-Lulu-Guinness-scarf.jpg 120w, https://media.gq-magazine.co.uk/photos/67a605484d7357b956d11dc2/3:4/w_240,c_limit/Lulu_Guiness_best-gifts-for-her-chosen-by-Je'''
