title = "Jeremy Strong on The Apprentice, Donald Trump and playing Roy Cohn | British GQ"
description = "Whether he’s channelling one of 20th-century history’s greatest monsters, Roy Cohn, or immersing himself in coffee grounds for Ben Affleck, the Apprentice star goes all-in on every performance. He’s aware that some people find his 1,000-per-cent, irony-free commitment to the craft a little bit absurd; he’s OK with that. “I feel like, if you're not risking that,” he says, “then what are you risking?”"
full_description = '''GQ HypeOut on a limb with Jeremy StrongWhether he’s channelling one of 20th-century history’s greatest monsters, Roy Cohn, or immersing himself in coffee grounds for Ben Affleck, the Apprentice star goes all-in on every performance. He’s aware that some people find his 1,000-per-cent, irony-free commitment to the craft a little bit absurd; he’s OK with that. “I feel like, if you're not risking that,” he says, “then what are you risking?”By Hayley CampbellPhotography by Arnaud Pyvka13 February 2025When Jeremy Strong signed up to play Senator Joseph McCarthy’s witchfinder general Roy Cohn in The Apprentice – a man who maintained a full-body tan year-round, collected ornamental frogs, and taught Donald Trump everything he knows about attacking, denying, and lying – he never imagined that Trump would be re-elected. This wasn’t really the point; the film wasn’t supposed to be a political polemic. To him, it was a Frankenstein story: a character study about the making of a monster. That we are talking in the corner booth of a closed cocktail bar in Covent Garden just weeks after the monster was inaugurated for the second time is not something Strong expected to happen. But the world got weirder while he waited.The film was initially announced in May 2018, and then everything slowed down. There were delays in funding, there was a pandemic. The project was on and off again several times over. Sebastian Stan, who plays the future president, had to reverse course on his Trumpian weight gain to become shredded for a Marvel movie, until that too was delayed by the Hollywood writers’ strikes. When it finally premiered at Cannes to an eight-minute standing ovation (which Strong missed because he was performing on Broadway) there were still more delays to come. Trump’s legal team tried to block the film’s release, and it struggled to find a distributor in the USA. Ultimately, The Apprentice landed in cinemas three weeks before the presidential election, at which point Trump posted on Truth Social calling it a “FAKE and CLASSLESS” movie and “a cheap, defamatory, and politically disgusting hatchet job… to try and hurt the Greatest Political Movement in the History of our Country” and referring to everyone involved in it as “HUMAN SCUM.” You know, the usual.<img alt="Image may contain Jeremy Strong Adult Person Art Painting Face Head Photography Portrait and Publication" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67ac83d0b312a569637e1498/master/w_1600%2Cc_limit/Feb%252013%2520-%2520Jeremy%2520Strong_Cover_4x5.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67ac83d0b312a569637e1498/master/w_120,c_limit/Feb%2013%20-%20Jeremy%20Strong_Cover_4x5.jpg 120w, https://media.gq-magazine.co.uk/photos/67ac83d0b312a569637e1498/master/w_240,c_limit/Feb%2013%20-%20Jeremy%20Strong_Cover_4x5.jpg 240w, https://media.gq-magazine.co.uk/photos/67ac83d0b312a569637e1498/master/w_320,c_limit/Feb%2013%20-%20Jeremy%20Strong_Cover_4x5.jpg 320w, https://media.gq-magazine.co.uk/photos/67ac83d0b312a569637e1498/master/w_640,c_limit/Feb%2013%20-%20Jeremy%20Strong_Cover_4x5.jpg 640w, https://media.gq-magazine.co.uk/photos/67ac83d0b312a569637e1498/master/w_960,c_limit/Feb%2013%20-%20Jeremy%20Strong_Cover_4x5.jpg 960w, https://media.gq-magazine.co.uk/photos/67ac83d0b312a569637e1498/master/w_1280,c_limit/Feb%2013%20-%20Jeremy%20Strong_Cover_4x5.jpg 1280w, https://media.gq-magazine.co.uk/photos/67ac83d0b312a569637e1498/master/w_1600,c_limit/Feb%2013%20-%20Jeremy%20Strong_Cover_4x5.jpg 1600w" sizes="100vw"/>“On the level of the art form, this was a feast,” says Strong. “On the level of the world that we're in, we're talking about a living danger.” He’s solemn as he says this. He doesn’t take it lightly. Strong, you may have heard, doesn’t take anything lightly.GQ: How are you feeling about The Apprentice now, post-inauguration?Jeremy Strong: The film has become, to me, more of a horror movie. It takes on a different resonance, and is harrowing to see now. I really did feel like I could feel Roy Cohn hovering over the Capitol Rotunda a few Mondays ago, fist pumping. All this stuff that's happening now: flooding the zone and Steve Bannon talking about muzzle velocity, and Trump's response to Bishop Budde. I mean, I thought that sermon was remarkable. It was so courageous. And really undeniable. I don't care what you believe – what she said, I felt, was for everyone. It's hard for me to swallow his response to that. But it was straight out of Roy Cohn's playbook: attack and deny, whether or not he found anything worthwhile in what she had to say. So the movie has become scarier to me. Roy Cohn said, and I say it in the movie, “This is a nation of men, not laws.” And so I think what’s happening right now is we are stress testing that thesis in real time.If more people had seen the film, do you think it could have moved the needle on the election results?I’ve thought about this a lot. I mean, I'm someone who was deeply affected by watching certain movies when I was growing up, and in a lot of ways, they informed a lot of my worldview. I remember movies like Mississippi Burning or The Killing Fields, or Midnight Express… these kinds of movies had a huge impact on me. So I think certainly for a lot of the younger people who didn't vote, it may have moved the needle.Since you played the guy who created Trump, do you have any kind of empathetic view of him, even with everything he’s doing now?Maybe. Certainly when I was doing it and sort of inside of it, I felt kinship with the Donald character. I want to be careful of how I talk about this; it feels dangerous. There's a line that was omitted from the movie, but basically it defined what linked them, which was in Roy's words, that they were both willing to walk over fresh corpses to get what they want. And so that sort of dark alliance and kinship, I certainly felt while we were making it. And did it change how I see Trump on a human level? Probably. I mean, whether it's Roy Cohn, or even Lee Harvey Oswald [in 2013’s Parkland], or Kendall Roy [in Succession], or any of these characters – I get the sense that people label them despicable, monstrous, whatever. And I don't disagree with that in some cases, but you have to suspend your judgment to try and walk in their shoes and understand them. And part of that is understanding their pain and understanding their drive and their need. Those are the things, as an actor, you have to latch on to.<img alt="Image may contain Jeremy Strong Adult Person Barefoot Sitting Performer Solo Performance Art and Painting" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67acb02d4a537297657823ef/master/w_1600%2Cc_limit/05-APY_250203_GQ_JEREMY%2520STRONG_LEICA_0013.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67acb02d4a537297657823ef/master/w_120,c_limit/05-APY_250203_GQ_JEREMY%20STRONG_LEICA_0013.jpg 120w, https://media.gq-magazine.co.uk/photos/67acb02d4a537297657823ef/master/w_240,c_limit/05-APY_250203_GQ_JEREMY%20STRONG_LEICA_0013.jpg 240w, https://media.gq-magazine.co.uk/photos/67acb02d4a537297657823ef/master/w_320,c_limit/05-APY_250203_GQ_JEREMY%20STRONG_LEICA_0013.jpg 320w, https://media.gq-magazine.co.uk/photos/67acb02d4a537297657823ef/master/w_640,c_limit/05-APY_250203_GQ_JEREMY%20STRONG_LEICA_0013.jpg 640w, https://media.gq-magazine.co.uk/photos/67acb02d4a537297657823ef/master/w_960,c_limit/05-APY_250203_GQ_JEREMY%20STRONG_LEICA_0013.jpg 960w, https://media.gq-magazine.co.uk/photos/67acb02d4a537297657823ef/master/w_1280,c_limit/05-APY_250203_GQ_JEREMY%20STRONG_LEICA_0013.jpg 1280w, https://media.gq-magazine.co.uk/photos/67acb02d4a537297657823ef/master/w_1600,c_limit/05-APY_250203_GQ_JEREMY%20STRONG_LEICA_0013.jpg 1600w" sizes="100vw"/>Likeability of a character doesn't seem to be something you care about all that much.No, I don't really give a fig for likeability. I mean, it's like, are we likeable? [Laughs.] It's like, I don't know. I don't even really know. In certain moments maybe, and in another moment maybe not. And it's that duality that everyone has. It's Blake, it's The Marriage of Heaven and Hell: we have aspects that are saintly and we have aspects that are monstrous. We all do. Light and shadow. And I think part of the trouble we've run into is this collective disavowal of the darker aspects of ourselves and the otherization. “Oh, it's them. It's the basket of deplorables. It's the right, or it's the left, it's the other.” And it makes it easy for us to not look at those parts of ourselves. So as an actor, I think you're forced to look at those parts of yourselves. Shakespeare said, “This thing of darkness, I acknowledge mine.” And that's sort of entering into something like The Apprentice. I think Sebastian [Stan] and I both had to do that.Were you at all worried about doing the film?The only trepidation I had about doing this was on a creative, artistic level. Not on a real-world level.Why?The usual.…What's the usual?Oh you know, abject terror and the fear of making a giant fool of yourself, and of not having it [or not] finding it. It. Whatever that is. Especially something like this, where you're doing character work that is fairly heightened and fairly extreme and precise. It could very easily be ridiculous. And I don't even quite understand what makes it not that. Part of it is embracing the whole thing, embracing the possibility that it [could fail]. I remember hearing Dustin Hoffman quote Jacques Cousteau once about knowing how far to go too far. Like, finding just how far out on that limb to go out on. So those are the usual fears I have.Also, I'm not the kind of actor that shows up and I say the lines. I feel like my job is to become the person. That's what I enjoy doing, and that's the challenge of it. And so becoming this person felt impossible, basically. I didn't have a lot of time and it felt impossible to transform into him. I didn't know that I'd be able to understand him. You know? All of it. And then you slowly enter into the research and start learning and absorbing and internalising, and…I don't know. At some point this critical mass happens and you're in, and you tip over into it. And I find that very exciting. But every time it feels like it might not happen.<img alt="Image may contain Jeremy Strong Adult Person Clothing Pants Face Head Photography and Portrait" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67acb02e7eeb72f0dab68933/master/w_1600%2Cc_limit/04-APY-JEREMY%2520STRONG-2025-10.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67acb02e7eeb72f0dab68933/master/w_120,c_limit/04-APY-JEREMY%20STRONG-2025-10.jpg 120w, https://media.gq-magazine.co.uk/photos/67acb02e7eeb72f0dab68933/master/w_240,c_limit/04-APY-JEREMY%20STRONG-2025-10.jpg 240w, https://media.gq-magazine.co.uk/photos/67acb02e7eeb72f0dab68933/master/w_320,c_limit/04-APY-JEREMY%20STRONG-2025-10.jpg 320w, https://media.gq-magazine.co.uk/photos/67acb02e7eeb72f0dab68933/master/w_640,c_limit/04-APY-JEREMY%20STRONG-2025-10.jpg 640w, https://media.gq-magazine.co.uk/photos/67acb02e7eeb72f0dab68933/master/w_960,c_limit/04-APY-JEREMY%20STRONG-2025-10.jpg 960w, https://media.gq-magazine.co.uk/photos/67acb02e7eeb72f0dab68933/master/w_1280,c_limit/04-APY-JEREMY%20STRONG-2025-10.jpg 1280w, https://media.gq-magazine.co.uk/photos/67acb02e7eeb72f0dab68933/master/w_1600,c_limit/04-APY-JEREMY%20STRONG-2025-10.jpg 1600w" sizes="100vw"/><img alt="Image may contain Jeremy Strong Face Head Person Photography Portrait Adult Sitting Clothing Pants and Furniture" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67acb02e4a537297657823f0/master/w_1600%2Cc_limit/02-APY-JEREMY%2520STRONG-2025-09.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67acb02e4a537297657823f0/master/w_120,c_limit/02-APY-JEREMY%20STRONG-2025-09.jpg 120w, https://media.gq-magazine.co.uk/photos/67acb02e4a537297657823f0/master/w_240,c_limit/02-APY-JEREMY%20STRONG-2025-09.jpg 240w, https://media.gq-magazine.co.uk/photos/67acb02e4a537297657823f0/master/w_320,c_limit/02-APY-JEREMY%20STRONG-2025-09.jpg 320w, https://media.gq-magazine.co.uk/photos/67acb02e4a537297657823f0/master/w_640,c_limit/02-APY-JEREMY%20STRONG-2025-09.jpg 640w, https://media.gq-magazine.co.uk/photos/67acb02e4a537297657823f0/master/w_960,c_limit/02-APY-JEREMY%20STRONG-2025-09.jpg 960w, https://media.gq-magazine.co.uk/photos/67acb02e4a537297657823f0/master/w_1280,c_limit/02-APY-JEREMY%20STRONG-2025-09.jpg 1280w, https://media.gq-magazine.co.uk/photos/67acb02e4a537297657823f0/master/w_1600,c_limit/02-APY-JEREMY%20STRONG-2025-09.jpg 1600w" sizes="100vw"/>Strong has a reputation for being A Lot: too intense, too serious, committed to becoming a character to the point of physical injury to himself. In 2021, a viral New Yorker profile painted such an over-the-top picture of Strong’s process that people who had worked with him (Jessica Chastain, Aaron Sorkin, Anne Hathaway, and others) were moved to defend him on social media. Sebastian Stan missed all of this – he deliberately doesn’t read about actors on the internet – so when Strong’s name came up for The Apprentice, he asked Chastain and Hathaway about him. Stan told me that on set, he and Strong discovered that they spoke the same language artistically. “I’m also intense about how I do things,” he says. He found Strong’s commitment liberating: it allowed him to go there too. “I think it only reaffirmed my approach. I felt that I was unafraid – and that was what the movie was asking for.” At this point on our call, Stan also gushes about how much he respects Strong’s authenticity, how he is one of the greatest actors working today, and how much Strong is like a brother to him, and will be for life – doing what anyone does when they feel like they need to stick up for a guy they love: “Hopefully you can mention all that?”When Strong’s performance in The Apprentice landed him an Academy Award nomination for best supporting actor, he responded in the manner we’ve come to expect: with a deeply earnest, no-fun statement about what it truly meant to him (indescribable, but everything). His Succession co-star Kieran Culkin, on the other hand, nominated in the same category for A Real Pain, issued no public statement. But on Instagram, his wife posted a photo in which he’s pouring Champagne on a balcony in Paris; the overlaid text reads “Let’s fucking goooooo.” Contrasting these two reactions became a thing online, which is where this idea of Strong mostly lives – where people wonder what’s with all the hyperintense character work, the bucket hats, his whole deal. But when he’s sitting in front of me in an empty cocktail bar, holding his beanie in his hand, I get the feeling that he has made himself a subject of sometimes cruel and baffled scrutiny just by '''
