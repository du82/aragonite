os/67bc8f12aa13e2e2228b425b/3:4/w_748%2Cc_limit/Best-Mother%25E2%2580%2599s-Day-Gifts-Hotel-Chocolat-Mother%25E2%2580%2599s-Day-Sleekster.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67bc8f12aa13e2e2228b425b/3:4/w_120,c_limit/Best-Mother%E2%80%99s-Day-Gifts-Hotel-Chocolat-Mother%E2%80%99s-Day-Sleekster.jpg 120w, https://media.gq-magazine.co.uk/photos/67bc8f12aa13e2e2228b425b/3:4/w_240,c_limit/Best-Mother%E2%80%99s-Day-Gifts-Hotel-Chocolat-Mother%E2%80%99s-Day-Sleekster.jpg 240w, https://media.gq-magazine.co.uk/photos/67bc8f12aa13e2e2228b425b/3:4/w_320,c_limit/Best-Mother%E2%80%99s-Day-Gifts-Hotel-Chocolat-Mother%E2%80%99s-Day-Sleekster.jpg 320w, https://media.gq-magazine.co.uk/photos/67bc8f12aa13e2e2228b425b/3:4/w_640,c_limit/Best-Mother%E2%80%99s-Day-Gifts-Hotel-Chocolat-Mother%E2%80%99s-Day-Sleekster.jpg 640w" sizes="100vw"/>Hotel ChocolatMother's Day Everything Sleekster£29.95 Hotel ChocolatHotel Chocolat's decadent crowd-pleasers in a special Mother's Day sleeve. <img loading="lazy" alt="Image may contain: Art, Diary, Drawing, Page, Text, and Doodle" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67bc8f15870101891c219b42/3:4/w_748%2Cc_limit/Best-Mother%25E2%2580%2599s-Day-Gifts-Papier-Recipe-Journal.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67bc8f15870101891c219b42/3:4/w_120,c_limit/Best-Mother%E2%80%99s-Day-Gifts-Papier-Recipe-Journal.jpg 120w, https://media.gq-magazine.co.uk/photos/67bc8f15870101891c219b42/3:4/w_240,c_limit/Best-Mother%E2%80%99s-Day-Gifts-Papier-Recipe-Journal.jpg 240w, https://media.gq-magazine.co.uk/photos/67bc8f15870101891c219b42/3:4/w_320,c_limit/Best-Mother%E2%80%99s-Day-Gifts-Papier-Recipe-Journal.jpg 320w, https://media.gq-magazine.co.uk/photos/67bc8f15870101891c219b42/3:4/w_640,c_limit/Best-Mother%E2%80%99s-Day-Gifts-Papier-Recipe-Journal.jpg 640w" sizes="100vw"/>PapierSoftback Spiral Recipe Journal£29 PapierA forensically-sectioned recipe journal for keeping her concoctions safe. One day it'll make for a beautiful archive of her handwriting, too. <img loading="lazy" alt="Image may contain: Clothing, T-Shirt, Shirt, and Symbol" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c589c2c73329a475311d13/3:4/w_748%2Cc_limit/Best-Mother%25E2%2580%2599s-Day-gifts-Lulu-Guinness-Choose-Love-Tee.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c589c2c73329a475311d13/3:4/w_120,c_limit/Best-Mother%E2%80%99s-Day-gifts-Lulu-Guinness-Choose-Love-Tee.jpg 120w, https://media.gq-magazine.co.uk/photos/67c589c2c73329a475311d13/3:4/w_240,c_limit/Best-Mother%E2%80%99s-Day-gifts-Lulu-Guinness-Choose-Love-Tee.jpg 240w, https://media.gq-magazine.co.uk/photos/67c589c2c73329a475311d13/3:4/w_320,c_limit/Best-Mother%E2%80%99s-Day-gifts-Lulu-Guinness-Choose-Love-Tee.jpg 320w, https://media.gq-magazine.co.uk/photos/67c589c2c73329a475311d13/3:4/w_640,c_limit/Best-Mother%E2%80%99s-Day-gifts-Lulu-Guinness-Choose-Love-Tee.jpg 640w" sizes="100vw"/>Lulu GuinnessChoose Love T-Shirt£25 Lulu GuinnessBuying into Lulu Guinness' contribution to the refugee advocacy group Choose Love means that she gets a nifty T-shirt, the charity gets a donation, and you get a feeling of selflessness and wellbeing. <img loading="lazy" alt="Image may contain: First Aid, Cabinet, Furniture, and Cosmetics" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/65d3919118f6105af2a9a137/3:4/w_748%2Cc_limit/Mothersday.jpg" srcSet="https://media.gq-magazine.co.uk/photos/65d3919118f6105af2a9a137/3:4/w_120,c_limit/Mothersday.jpg 120w, https://media.gq-magazine.co.uk/photos/65d3919118f6105af2a9a137/3:4/w_240,c_limit/Mothersday.jpg 240w, https://media.gq-magazine.co.uk/photos/65d3919118f6105af2a9a137/3:4/w_320,c_limit/Mothersday.jpg 320w, https://media.gq-magazine.co.uk/photos/65d3919118f6105af2a9a137/3:4/w_640,c_limit/Mothersday.jpg 640w" sizes="100vw