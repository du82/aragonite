title = "The 10 best Matthew McConaughey films, ranked | British GQ"
description = "This is a top ten that's more than alright, alright alright"
full_description = '''CultureThe 10 best Matthew McConaughey films, rankedThis is a top ten that's more than alright, alright, alrightBy Killian Faith-Kelly4 March 2025Thirty or forty years from now, someone will make a film about Matthew McConaughey. He’s a remarkable man who’s led a remarkable life. His parents got divorced twice (and then remarried again until his father died in 1992). He made his breakthrough at the age of 24 in Dazed and Confused by talking his way into getting way more screen time than he was initially supposed to get, then endured a series of under-appreciated gems that ended with the casting directors of Hollywood sentencing him to life (it seemed at the time) as the sexy male romcom lead.He slogged his way through romcoms years – The Weddings Planner, Fool’s Gold, Ghosts of Girlfriends Past etc – before, in true Hollywood fashion, having himself what’s now referred to as The McConaissance. It started with some standout performances in some otherwise fairly meh films – Lincoln Lawyer, Killer Joe, we’re looking at you – before a run of Magic Mike and Mud in 2012, Dallas Buyers Club and Wolf of Wall Street in 2013, and then Interstellar in 2014 established McConaughey as a figure whose days of posing back to back with his romantic co-lead for a DVD cover are little more than a quirky smudge in the rearview mirror of his career.Now, it seems the man can do pretty much whatever he wants. It’s exciting to think about what the future may hold for Matthew McConaughey, but before we do, let’s cast a fond eye over his past. Here are our top 10 Matthew McConaughey films, ranked.10. How to Lose a Guy in 10 Days (2003)<img alt="Image may contain Kate Hudson Edward Bunker Kissing Person Romantic Face Head Photography Portrait Adult and Art" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c05f622980fa7229b71b2f/master/w_1600%2Cc_limit/MCDHOTO_EC067.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c05f622980fa7229b71b2f/master/w_120,c_limit/MCDHOTO_EC067.jpg 120w, https://media.gq-magazine.co.uk/photos/67c05f622980fa7229b71b2f/master/w_240,c_limit/MCDHOTO_EC067.jpg 240w, https://media.gq-magazine.co.uk/photos/67c05f622980fa7229b71b2f/master/w_320,c_limit/MCDHOTO_EC067.jpg 320w, https://media.gq-magazine.co.uk/photos/67c05f622980fa7229b71b2f/master/w_640,c_limit/MCDHOTO_EC067.jpg 640w, https://media.gq-magazine.co.uk/photos/67c05f622980fa7229b71b2f/master/w_960,c_limit/MCDHOTO_EC067.jpg 960w, https://media.gq-magazine.co.uk/photos/67c05f622980fa7229b71b2f/master/w_1280,c_limit/MCDHOTO_EC067.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c05f622980fa7229b71b2f/master/w_1600,c_limit/MCDHOTO_EC067.jpg 1600w" sizes="100vw"/>©Paramount/Courtesy Everett CollectionThe romcom years may not have been the strongest of McConaughey’s career (and were, in fact, absolutely the weakest), but he was actually pretty good in them, and in some instances that was enough to redeem the material. The leading example of this is How to Lose a Guy in 10 Days, in which he applies his unstoppable smile as Ben, a cocksure charmer who bets he can get Kate Hudson's hotshot journalist to fall in love with him. Only thing is, she's engaged in a little experiment of her own – one that requires her to lose a man initially besotted with her in the titular ten-day period. It's silly, it's a bit of fun, and it's good at being those things.9.Tropic Thunder (2008)An unusually unromantic role that squeezes its way into the heyday of McConaughey's romcom years because it was initially meant for Owen Wilson, for whom McConaughey provided a last-minute replacement. There's a lot to unpick in McConaughey's scenes in this film, in which he plays agent Rick Peck to Ben Stiller's action star shooting a film in the Vietnamese jungle that accidentally becomes all too real. We've got Tom Cruise, bald-capped and bouncing around in a moment of rare goofiness for him, Bill Hader floating along in the background as Cruise's wide-eyed crony, and uber-stressed, Wii-Tennis-playing McConaughey, with a headset the never leaves his ear and a client commission payment that never leaves his sights. This was perhaps the pre-Wold of Wall Street performance, and it comes in a similarly batshit and brilliant film.8. 13 Conversations About One Thing (2002)<img alt="Image may contain Matthew McConaughey Formal Wear Clothing Suit Accessories Tie Coat Jacket Blazer Face and Head" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c05f652980fa7229b71b31/master/w_1600%2Cc_limit/MSDTHCO_EC003.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c05f652980fa7229b71b31/master/w_120,c_limit/MSDTHCO_EC003.jpg 120w, https://media.gq-magazine.co.uk/photos/67c05f652980fa7229b71b31/master/w_240,c_limit/MSDTHCO_EC003.jpg 240w, https://media.gq-magazine.co.uk/photos/67c05f652980fa7229b71b31/master/w_320,c_limit/MSDTHCO_EC003.jpg 320w, https://media.gq-magazine.co.uk/photos/67c05f652980fa7229b71b31/master/w_640,c_limit/MSDTHCO_EC003.jpg 640w, https://media.gq-magazine.co.uk/photos/67c05f652980fa7229b71b31/master/w_960,c_limit/MSDTHCO_EC003.jpg 960w, https://media.gq-magazine.co.uk/photos/67c05f652980fa7229b71b31/master/w_1280,c_limit/MSDTHCO_EC003.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c05f652980fa7229b71b31/master/w_1600,c_limit/MSDTHCO_EC003.jpg 1600w" sizes="100vw"/>©Sony Pictures/Courtesy Everett CollectionIf you've never seen this film, don't watch the trailer. That thing is awful, and horrible, and riddled with comic sans. But this is a much better film than its abomination of a so-called marketing team would have you believe. Thirteen vignettes revolve around McConaughey's prosecutor Troy, who becomes entangled after a hit-and-run incident with cleaner Beatrice, who is in turn re-evaluating her life in accordance with self-preserving the values of co-worker Dorrie, etc. You get the idea. Along the lines of Robert Altman's peerless Short Cuts, this is a stirring rumination on the stasis of life – how it breaks people, and how they break it back. John Turturro, Alan Arkin and a very young Rob McIlhenny make up a rock-solid supporting cast.7. Magic Mike (2012)<img alt="Image may contain Matthew McConaughey Concert Crowd Person Lighting Urban Accessories Belt and Performer" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c05f650a7ff47a73aa5143/master/w_1600%2Cc_limit/MCDMAMI_EC148.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c05f650a7ff47a73aa5143/master/w_120,c_limit/MCDMAMI_EC148.jpg 120w, https://media.gq-magazine.co.uk/photos/67c05f650a7ff47a73aa5143/master/w_240,c_limit/MCDMAMI_EC148.jpg 240w, https://media.gq-magazine.co.uk/photos/67c05f650a7ff47a73aa5143/master/w_320,c_limit/MCDMAMI_EC148.jpg 320w, https://media.gq-magazine.co.uk/photos/67c05f650a7ff47a73aa5143/master/w_640,c_limit/MCDMAMI_EC148.jpg 640w, https://media.gq-magazine.co.uk/photos/67c05f650a7ff47a73aa5143/master/w_960,c_limit/MCDMAMI_EC148.jpg 960w, https://media.gq-magazine.co.uk/photos/67c05f650a7ff47a73aa5143/master/w_1280,c_limit/MCDMAMI_EC148.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c05f650a7ff47a73aa5143/master/w_1600,c_limit/MCDMAMI_EC148.jpg 1600w" sizes="100vw"/>©Warner Bros/Courtesy Everett CollectionThe film that probably gave McConaughey's career a bigger shove back into the big leagues than any other, this was an absolute stonker from Steven Soderbergh. Channing Tatum might grab the headlines putting his experience as an actual stripper to very good use indeed, but for his part, McConaughey is confidence personified as the owner of the strip club around which this film revolves. He achieves an air of cautious mentorship as he watches over the men he employs, and the question of how much if at all he cares as he sees Alex Pettyfer's protagonist fall victim to all of the traps his profession lays out for him hangs over the film like a churning cloud.6. Interstellar (2014)<img alt="Image may contain Matthew McConaughey Anne Hathaway Adult Person Teen and Astronaut" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c05f620a7ff47a73aa513d/master/w_1600%2Cc_limit/MCDINTE_EC208.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c05f620a7ff47a73aa513d/master/w_120,c_limit/MCDINTE_EC208.jpg 120w, https://media.gq-magazine.co.uk/photos/67c05f620a7ff47a73aa513d/master/w_240,c_limit/MCDINTE_EC208.jpg 240w, https://media.gq-magazine.co.uk/photos/67c05f620a7ff47a73aa513d/master/w_320,c_limit/MCDINTE_EC208.jpg 320w, https://media.gq-magazine.co.uk/photos/67c05f620a7ff47a73aa513d/master/w_640,c_limit/MCDINTE_EC208.jpg 640w, https://media.gq-magazine.co.uk/photos/67c05f620a7ff47a73aa513d/master/w_960,c_limit/MCDINTE_EC208.jpg 960w, https://media.gq-magazine.co.uk/photos/67c05f620a7ff47a73aa513d/master/w_1280,c_limit/MCDINTE_EC208.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c05f620a7ff47a73aa513d/master/w_1600,c_limit/MCDINTE_EC208.jpg 1600w" sizes="100vw"/>©Paramount/Courtesy Everett CollectionA year after Magic Mike, and another after Dallas Buyers Club, here McConaughey takes another step into the upper echelons of Planet Blockbuster. The serious and rarely-smirking lead in a Christopher Nolan epic about an astronaut voyaging through time and space in search of a new home for humanity, this was the role that cemented our sense of what the man can do. Main man status among a cast that includes the likes of Michael Caine, Anne Hathaway, Matt Damon, Jessica Chastain and John Lithgow requires a performer who can hold a room like nobody's business, and, if we didn't know it before Interstellar, we certainly knew that McConaughey was one of those after it.5. The Wolf of Wall Street (2013)<img alt="Image may contain Matthew McConaughey Electronics Screen Computer Hardware Hardware Monitor and Accessories" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c05f650a7ff47a73aa5141/master/w_1600%2Cc_limit/MCDWOOF_EC099.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c05f650a7ff47a73aa5141/master/w_120,c_limit/MCDWOOF_EC099.jpg 120w, https://media.gq-magazine.co.uk/photos/67c05f650a7ff47a73aa5141/master/w_240,c_limit/MCDWOOF_EC099.jpg 240w, https://media.gq-magazine.co.uk/photos/67c05f650a7ff47a73aa5141/master/w_320,c_limit/MCDWOOF_EC099.jpg 320w, https://media.gq-magazine.co.uk/photos/67c05f650a7ff47a73aa5141/master/w_640,c_limit/MCDWOOF_EC099.jpg 640w, https://media.gq-magazine.co.uk/photos/67c05f650a7ff47a73aa5141/master/w_960,c_limit/MCDWOOF_EC099.jpg 960w, https://media.gq-magazine.co.uk/photos/67c05f650a7ff47a73aa5141/master/w_1280,c_limit/MCDWOOF_EC099.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c05f650a7ff47a73aa5141/master/w_1600,c_limit/MCDWOOF_EC099.jpg 1600w" sizes="100vw"/>©Paramount/Courtesy Everett CollectionThere's a good case to be made that McConaughey's performance in this film has generated more minutes of conversation and imitation per minute of screen time than any other in cinematic history. Remember nothing else from Scorsese's story of a shyster sliming his way to the top of the American financial industry, and you'll remember McConaughey in that restaurant, beating his chest, humming solemnly to himself and also probably to lots of annoyed fellow diners. Supposedly the scene was written after Scorsese saw McConaughey doing his vocal warmup, which was basically identical to the chanting he ends up doing in the film. Is that true? Who knows. It's fugayzi. It's fugazi. It's a whazy. It's a whoozie. It's fairy dust, it doesn't exist. (Except yes it does, that is true).4. Mud (2012)<img alt="Image may contain Tye Sheridan Matthew McConaughey Person Teen Adult Face Head Photography Portrait and Accessories" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c05f62156bf09099034885/master/w_1600%2Cc_limit/MCDMUDD_EC008.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c05f62156bf09099034885/master/w_120,c_limit/MCDMUDD_EC008.jpg 120w, https://media.gq-magazine.co.uk/photos/67c05f62156bf09099034885/master/w_240,c_limit/MCDMUDD_EC008.jpg 240w, https://media.gq-magazine.co.uk/photos/67c05f62156bf09099034885/master/w_320,c_limit/MCDMUDD_EC008.jpg 320w, https://media.gq-magazine.co.uk/photos/67c05f62156bf09099034885/master/w_640,c_limit/MCDMUDD_EC008.jpg 640w, https://media.gq-magazine.co.uk/photos/67c05f62156bf09099034885/master/w_960,c_limit/MCDMUDD_EC008.jpg 960w, https://media.gq-magazine.co.uk/photos/67c05f62156bf09099034885/master/w_1280,c_limit/MCDMUDD_EC008.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c05f62156bf09099034885/master/w_1600,c_limit/MCDMUDD_EC008.jpg 1600w" sizes="100vw"/>©Roadside Attractions/Courtesy Everett CollectionA Huckleberry Finn-esque story of two adventurous young boys who happen upon an escaped fugitive (McConaughey) by the banks of the Mississippi and decide to help him. McConaughey's role here to to present a sort of warped vision of masculinity to two characters in the process of finding theirs, in a way that forces them to decide more quickly than they ought to have to what kind of men they want to be. Reese Witherspoon and Michael Shannon contribute strong supporting performances, but this is a film that twists its way around McConaughey's irresistible pull.3. Lone Star (1996)<img alt="Image may contain Matthew McConaughey Kris Kristofferson Alcohol Bar Bar Counter Beverage Pub Clothing and Hat" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c05f650a7ff47a73aa5142/master/w_1600%2Cc_limit/MSDLOST_EC004.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c05f650a7ff47a73aa5142/master/w_120,c_limit/MSDLOST_EC004.jpg 120w, https://media.gq-magazine.co.uk/photos/67c05f650a7ff47a73aa5142/master/w_240,c_limit/MSDLOST_EC004.jpg 240w, https://media.gq-magazine.co.uk/photos/67c05f650a7ff47a73aa5142/master/w_320,c_limit/MSDLOST_EC004.jpg 320w, https://media.gq-magazine.co.uk/photos/67c05f650a7ff47a73aa5142/master/w_640,c_limit/MSDLOST_EC004.jpg 640w, https://media.gq-magazine.co.uk/photos/67c05f650a7ff47a73aa5142/master/w_960,c_limit/MSDLOST_EC004.jpg 960w, https://media.gq-magazine.co.uk/photos/67c05f650a7ff47a73aa5142/master/w_1280,c_limit/MSDLOST_EC004.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c05f650a7ff47a73aa5142/master/w_1600,c_limit/MSDLOST_EC004.jpg 1600w" sizes="100vw"/>©Sony Pictures/Courtesy Everett CollectionA small Texas town is run by a despised, corrupt sheriff. His deputy, Matthew McConaughey, is all in on the hatred. Then that sheriff dies, and McConaughey takes over. Forty years later, with his son in the seat of power, the former sheriff's skeleton is discovered – and McConaughey's son worries his beloved old man may have been the kill'''
