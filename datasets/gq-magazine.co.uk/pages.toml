full_description = "A festival of ideas GQ Heroes is our exclusive annual summit celebrating game-changers, radical creatives, and big ideas. Over two days in the picturesque Oxfordshire countryside, GQ brings together a unique lineup of global talent – from legends of the entertainment industry to design icons, industry-shifting CEOs, political heavyweights, influencers, activists, and more. From stage talks to experiential sessions, one-off live performances and intimate dinners, Heroes is a rare opportunity to spark inspiration, forge partnerships, and lean into the future of the culture. (Not to mention, have an unforgettable time among legends in their fields). See you in July... The Venue GQ Heroes takes place from 3-5 July 2024 and will be hosted at Soho Farmhouse, spread across 100 acres in Oxfordshire, less than a 90-minute drive from Central London. Once on site you can also indulge your senses in the spa and make full use of the facilities, including an extensive gym, tennis courts, spinning room and horse riding. Agenda After checking in and welcome drinks with the GQ Heroes team, talks will commence, with the headline keynote taking place in the Hay Barn before dinner at Japanese restaurant Pen Yen. After-dinner entertainment will include a live performance. On Thursday 4 July, after breakfast, talks will commence promptly, with a full schedule of speakers throughout the day. There will be breakout sessions, chances to meet the speakers and a relaxed lunch. Thursday evening’s gala dinner will be held in the decadent Barwell Barn, including Champagne reception, very special performances, a DJ and the already legendary GQ Heroes afterparty. Friday will be more relaxed, with a closing breakfast to be taken at leisure and attendees able to make full use of the Soho Farmhouse facilities."
