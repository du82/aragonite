["https://gq-magazine.co.uk/article/audemars-piguet-biggest-cultural-moments-experts"]
title = "All the times Audemars Piguet captured the culture, ranked by real heads | British GQ"
description = "Over the years, Audemars Piguet has teamed up with Jay-Z, John Mayer, Travis Scott and Arnie among others. Here, we got experts to chart their favourite AP cultural moments."
full_description = '''WatchesAll the times Audemars Piguet captured the culture, ranked by real headsOver the years, Audemars Piguet has teamed up with Jay-Z, John Mayer, Travis Scott and Arnie among others. Here, we got experts to chart their favourite AP cultural momentsBy Vivian Morelli5 March 2025All products are independently selected by our editors. If you buy something, we may earn an affiliate commission.Turning 150 years old deserves a proper birthday bash. Audemars Piguet duly kicked off reaching this major milestone with a host of sophisticated new Royal Oaks and Code 11.59s. As a collective, they point to the future while harking back to the brand’s decorated past – and so far the fans are loving them.The watches, many of them iconic, are of course the main reason AP has made it to the big 1-5-0, but just as key to AP’s success is the emphatic cultural impact the Swiss watchmaker has had over the years. Name another watch brand as closely tied to pop culture as AP, we’ll wait. It’s affiliated with everything: movies, music, sporting events, museums, not to mention the endless list of celebs, actors, artists and rappers whose reps are enhanced when they rock an AP. With this in mind, we figured a fitting way to mark this major anniversary for Audemars Piguet would be to ask hotshot AP experts, fans and collectors to shoutout their favourite AP cultural moments.<img alt="Image may contain Muhammad Ali Arnold Schwarzenegger Arnold Schwarzenegger People Person and Electrical Device" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c04a1c03a8676b055d556c/master/w_1600%2Cc_limit/AP-150-CHRISTIES.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c04a1c03a8676b055d556c/master/w_120,c_limit/AP-150-CHRISTIES.jpg 120w, https://media.gq-magazine.co.uk/photos/67c04a1c03a8676b055d556c/master/w_240,c_limit/AP-150-CHRISTIES.jpg 240w, https://media.gq-magazine.co.uk/photos/67c04a1c03a8676b055d556c/master/w_320,c_limit/AP-150-CHRISTIES.jpg 320w, https://media.gq-magazine.co.uk/photos/67c04a1c03a8676b055d556c/master/w_640,c_limit/AP-150-CHRISTIES.jpg 640w, https://media.gq-magazine.co.uk/photos/67c04a1c03a8676b055d556c/master/w_960,c_limit/AP-150-CHRISTIES.jpg 960w, https://media.gq-magazine.co.uk/photos/67c04a1c03a8676b055d556c/master/w_1280,c_limit/AP-150-CHRISTIES.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c04a1c03a8676b055d556c/master/w_1600,c_limit/AP-150-CHRISTIES.jpg 1600w" sizes="100vw"/>Spencer Platt“For me, the best AP cultural moment was the Time To Give auction arranged by the brand in 2000. For some context, I was a broke college student at the time who had developed a deep love of fine watchmaking. Reading the Christie's catalog was like Xmas day to me – seeing 20+ lots worn by a who's who of A-list celebrities all auctioned for charity. Emcee'd by Arnold Schwarzenegger, the event saw nearly all participating celebrities in the room as the gavel fell on each lot. This was a watershed moment for the brand and perhaps the very first time that fine watchmaking intersected with celebrity culture. The brainchild of François-Henry Bennahmias, this auction will live on as a true cultural zeitgeist moment for the industry and for watch collecting.” Eric Ku, watch collector<img alt="Image may contain Wristwatch Arm Body Part Person Accessories and Jewelry" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c04a1fc3e82ab5094e6af8/master/w_1600%2Cc_limit/AP-150-POCKET-WATCH-CrEdit-Collection-MusEe-international-d&#x27;horlogerie234a-0501C-I_2.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c04a1fc3e82ab5094e6af8/master/w_120,c_limit/AP-150-POCKET-WATCH-CrEdit-Collection-MusEe-international-d&#x27;horlogerie234a-0501C-I_2.jpg 120w, https://media.gq-magazine.co.uk/photos/67c04a1fc3e82ab5094e6af8/master/w_240,c_limit/AP-150-POCKET-WATCH-CrEdit-Collection-MusEe-international-d&#x27;horlogerie234a-0501C-I_2.jpg 240w, https://media.gq-magazine.co.uk/photos/67c04a1fc3e82ab5094e6af8/master/w_320,c_limit/AP-150-POCKET-WATCH-CrEdit-Collection-MusEe-international-d&#x27;horlogerie234a-0501C-I_2.jpg 320w, https://media.gq-magazine.co.uk/photos/67c04a1fc3e82ab5094e6af8/master/w_640,c_limit/AP-150-POCKET-WATCH-CrEdit-Collection-MusEe-international-d&#x27;horlogerie234a-0501C-I_2.jpg 640w, https://media.gq-magazine.co.uk/photos/67c04a1fc3e82ab5094e6af8/master/w_960,c_limit/AP-150-POCKET-WATCH-CrEdit-Collection-MusEe-international-d&#x27;horlogerie234a-0501C-I_2.jpg 960w, https://media.gq-magazine.co.uk/photos/67c04a1fc3e82ab5094e6af8/master/w_1280,c_limit/AP-150-POCKET-WATCH-CrEdit-Collection-MusEe-international-d&#x27;horlogerie234a-0501C-I_2.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c04a1fc3e82ab5094e6af8/master/w_1600,c_limit/AP-150-POCKET-WATCH-CrEdit-Collection-MusEe-international-d&#x27;horlogerie234a-0501C-I_2.jpg 1600w" sizes="100vw"/>“My personal biggest Audemars Piguet moment is about their historical responsibility for their world famous complicated pocket watches. My deepest respect goes to the restoration of the "Universelle", the Universaluhr (1899), the most complex watch of its time from Union Glashütte with a movement from Piguet. Three such super-complicated movements are known and made under the names "La Fabuleuse", "La Grandiose", and "Universelle". In 2023, AP unveiled the new Code 11.59 Ultra Complication Universelle wristwatch as a tribute to the “Universelle” pocket watch with 40 functions and 23 complications with 1,100 components.” Thomas Brechtel, watch writer<img alt="Image may contain Travis Scott Performer Person Solo Performance Adult Accessories Jewelry Necklace and Electronics" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c04a2503a8676b055d5576/master/w_1600%2Cc_limit/AP-150-TRAVIS-SCOTT-GettyImages-1813873741.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c04a2503a8676b055d5576/master/w_120,c_limit/AP-150-TRAVIS-SCOTT-GettyImages-1813873741.jpg 120w, https://media.gq-magazine.co.uk/photos/67c04a2503a8676b055d5576/master/w_240,c_limit/AP-150-TRAVIS-SCOTT-GettyImages-1813873741.jpg 240w, https://media.gq-magazine.co.uk/photos/67c04a2503a8676b055d5576/master/w_320,c_limit/AP-150-TRAVIS-SCOTT-GettyImages-1813873741.jpg 320w, https://media.gq-magazine.co.uk/photos/67c04a2503a8676b055d5576/master/w_640,c_limit/AP-150-TRAVIS-SCOTT-GettyImages-1813873741.jpg 640w, https://media.gq-magazine.co.uk/photos/67c04a2503a8676b055d5576/master/w_960,c_limit/AP-150-TRAVIS-SCOTT-GettyImages-1813873741.jpg 960w, https://media.gq-magazine.co.uk/photos/67c04a2503a8676b055d5576/master/w_1280,c_limit/AP-150-TRAVIS-SCOTT-GettyImages-1813873741.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c04a2503a8676b055d5576/master/w_1600,c_limit/AP-150-TRAVIS-SCOTT-GettyImages-1813873741.jpg 1600w" sizes="100vw"/>Nina Westervelt“AP’s collaboration with US rapper Travis Scott in 2023 was a clear sign that the brand wanted to reach the younger generation and this helped fuel Gen-Z's interest in investing in luxury watches, impacting the market. With only 200 made, this Royal Oak is super limited but we recently managed to source one for a client.” Danny Shahid, Diamond Watches London“In many ways, the Royal Oak reference 5402A from 1972 was the first watch to be propelled into the public eye by “influencers." In the traditional sense of the word, people with great influence helped contextualise this revolutionary timepiece. By seeing it on the wrist of the newly minted owner of Ferrari Gianni Agnelli, the up and coming designer Karl Lagerfeld, and the lavish parties held by the Shah of Iran, the Royal Oak became the watch “of the moment” and impressively, has held on to this “moment” for over 50 years.” Yoni Ben-Yehuda, Head of Watches, Material Good<img alt="Image may contain Josh Hopkins JayZ Blazer Clothing Coat Jacket Accessories Formal Wear Tie Suit and Glasses" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c04a21156bf09099034879/master/w_1600%2Cc_limit/AP-150-JAY-Z-10TH-ANNIVERSARY.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c04a21156bf09099034879/master/w_120,c_limit/AP-150-JAY-Z-10TH-ANNIVERSARY.jpg 120w, https://media.gq-magazine.co.uk/photos/67c04a21156bf09099034879/master/w_240,c_limit/AP-150-JAY-Z-10TH-ANNIVERSARY.jpg 240w, https://media.gq-magazine.co.uk/photos/67c04a21156bf09099034879/master/w_320,c_limit/AP-150-JAY-Z-10TH-ANNIVERSARY.jpg 320w, https://media.gq-magazine.co.uk/photos/67c04a21156bf09099034879/master/w_640,c_limit/AP-150-JAY-Z-10TH-ANNIVERSARY.jpg 640w, https://media.gq-magazine.co.uk/photos/67c04a21156bf09099034879/master/w_960,c_limit/AP-150-JAY-Z-10TH-ANNIVERSARY.jpg 960w, https://media.gq-magazine.co.uk/photos/67c04a21156bf09099034879/master/w_1280,c_limit/AP-150-JAY-Z-10TH-ANNIVERSARY.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c04a21156bf09099034879/master/w_1600,c_limit/AP-150-JAY-Z-10TH-ANNIVERSARY.jpg 1600w" sizes="100vw"/>KMazur“One of the most important cultural moments in the Maison’s modern history has to be when Jay-Z collaborated with Audemars Piguet to release the Royal Oak Offshore Chronograph “Jay-Z 10th Anniversary” in 2006. Not only was it done to celebrate the rapper’s 10-year milestone in the music industry, it was also a partnership that would change the industry as it was the first-ever collaboration between a luxury watch brand and a hip-hop artist.” Kevin Cureau, Wristcheck“For me it wasn’t a big campaign or novelty. It was one of the classic watch lover movements a few years back in Lugano in Italy. I was sitting back, sipping on my morning coffee when I spotted this gent in his seventies, effortlessly cool, top to toe, and even more so in his attitude. Full of chat and laughter – you know the type. What was on his wrist? A yellow gold Jumbo. Against the perma tan and cotton polo, he could have been off a movie set. Instantly recognisable and the first of its genre. The Royal Oak to this day is a horological behemoth.” Justin Hast, The Watch Annual<img alt="Image may contain John Mayer Photography Wristwatch Face Head Person Portrait Lighting Adult Body Part and Finger" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c04a2103a8676b055d5573/master/w_1600%2Cc_limit/AP-150-JOHN-MAYER.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c04a2103a8676b055d5573/master/w_120,c_limit/AP-150-JOHN-MAYER.jpg 120w, https://media.gq-magazine.co.uk/photos/67c04a2103a8676b055d5573/master/w_240,c_limit/AP-150-JOHN-MAYER.jpg 240w, https://media.gq-magazine.co.uk/photos/67c04a2103a8676b055d5573/master/w_320,c_limit/AP-150-JOHN-MAYER.jpg 320w, https://media.gq-magazine.co.uk/photos/67c04a2103a8676b055d5573/master/w_640,c_limit/AP-150-JOHN-MAYER.jpg 640w, https://media.gq-magazine.co.uk/photos/67c04a2103a8676b055d5573/master/w_960,c_limit/AP-150-JOHN-MAYER.jpg 960w, https://media.gq-magazine.co.uk/photos/67c04a2103a8676b055d5573/master/w_1280,c_limit/AP-150-JOHN-MAYER.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c04a2103a8676b055d5573/master/w_1600,c_limit/AP-150-JOHN-MAYER.jpg 1600w" sizes="100vw"/>“When a collaboration between Audemars Piguet and one of my favourite artists, John Mayer, came about, I fell in love and followed the project wholeheartedly. The result is one of my favourite Royal Oaks. This textured dial offers an infinite depth that makes you want to lose yourself inside, like in one of Mayer’s romantic songs.” Charles Brunet, Mon Petit Horloger<img alt="Image may contain Person Adult Outdoors Nature Mountain Clothing Footwear Shoe Accessories Bag and Handbag" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c04a2460959646979fc187/master/w_1600%2Cc_limit/AP-150-RYOJI-IKEDA.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c04a2460959646979fc187/master/w_120,c_limit/AP-150-RYOJI-IKEDA.jpg 120w, https://media.gq-magazine.co.uk/photos/67c04a2460959646979fc187/master/w_240,c_limit/AP-150-RYOJI-IKEDA.jpg 240w, https://media.gq-magazine.co.uk/photos/67c04a2460959646979fc187/master/w_320,c_limit/AP-150-RYOJI-IKEDA.jpg 320w, https://media.gq-magazine.co.uk/photos/67c04a2460959646979fc187/master/w_640,c_limit/AP-150-RYOJI-IKEDA.jpg 640w, https://media.gq-magazine.co.uk/photos/67c04a2460959646979fc187/master/w_960,c_limit/AP-150-RYOJI-IKEDA.jpg 960w, https://media.gq-magazine.co.uk/photos/67c04a2460959646979fc187/master/w_1280,c_limit/AP-150-RYOJI-IKEDA.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c04a2460959646979fc187/master/w_1600,c_limit/AP-150-RYOJI-IKEDA.jpg 1600w" sizes="100vw"/>“Audemars Piguet’s brilliance lies in its engagement with the art world, which began in 2013. AP formed a partnership with Art Basel and established its own Art Commission, collaborating on projects with artists. One of the defining moments came in 2019 with the exhibition Beyond Watchmaking in Japan. It featured a visual installation by Ryoji Ikeda and expanded the brand’s artistic narrative. This broader exposure played a key role in elevating AP’s presence.” Yuu Sekiguchi, Hodinkee Japan<img alt="Image may contain Arnold Schwarzenegger Accessories Formal Wear Tie Blazer Clothing Coat Jacket Adult and Person" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c04a1c03a8676b055d556b/master/w_1600%2Cc_limit/AP-150-CHRISTIES-2.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c04a1c03a8676b055d556b/master/w_120,c_limit/AP-150-CHRISTIES-2.jpg 120w, https://media.gq-magazine.co.uk/photos/67c04a1c03a8676b055d556b/master/w_240,c_limit/AP-150-CHRISTIES-2.jpg 240w, https://media.gq-magazine.co.uk/photos/67c04a1c03a8676b055d556b/master/w_320,c_limit/AP-150-CHRISTIES-2.jpg 320w, https://media.gq-magazine.co.uk/photos/67c04a1c03a8676b055d556b/master/w_640,c_limit/AP-150-CHRISTIES-2.jpg 640w, https://media.gq-magazine.co.uk/photos/67c04a1c03a8676b055d556b/master/w_960,c_limit/AP-150-CHRISTIES-2.jpg 960w, https://media.gq-magazine.co.uk/photos/67c04a1c03a8676b055d556b/master/w_1280,c_limit/AP-150-CHRISTIES-2.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c04a1c03a8676b055d556b/master/w_1600,c_limit/AP-150-CHRISTIES-2.jpg 1600w" sizes="100vw"/>Spencer Platt“Let’s go back to before all the watch brands had super long rosters of celebrity ambassadors. Audemars Piguet jumped on the Arnold Schwarzenegger cult back in 1999 – unveiling the Royal Oak Offshore "End of Days" watch in partnership with the then 52-year-old. He wore the super cool 42mm black PVD watch in the movie and its limited editions sold out quickly. That was the start of a seven-series success story. Both AP and Schwarzenegger terminated their partnership after a decade, but it was an adventurous journey that watch lovers and mov'''
