title = "Adrien Brody likes his menswear with a lot of menace | British GQ"
description = "At the premiere of The Brutalist, a fit that's both immaculate and evil at once"
full_description = '''FashionAdrien Brody likes his menswear with a lot of menaceAt the premiere of The Brutalist, a fit that's both immaculate and evil at onceBy Mahalia Chang6 December 2024Andrew TothOK, yeah, we know The Brutalist is actually the name of a historical drama about a Hungarian architect. But it could also be Adrien Brody's supervillain alter ego.Brody, along with co-stars Joe Alwyn and Felicity Jones, attended the premiere of their epic drama in LA overnight. For the occasion, Brody suited up in an extremely sick jacket and trouser combo. Up top, a military-inspired jacket that featured a folded-over lapel that crossed over at the neck. Unlike a regular blazer that would button at the mid-chest, Brody’s menace fastened way up high to chime with the mandarin collared uniform of an intergalactic battle commander — think of the likes of General Moff from Star Wars and Admiral Adama from Battlestar Galactica.<img alt="Image may contain Adrien Brody Clothing Formal Wear Suit Person Standing Adult Fashion Coat Face and Head" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/6752ceb2f62ae13ac360b7a6/master/w_1600%2Cc_limit/2188458795" srcSet="https://media.gq-magazine.co.uk/photos/6752ceb2f62ae13ac360b7a6/master/w_120,c_limit/2188458795 120w, https://media.gq-magazine.co.uk/photos/6752ceb2f62ae13ac360b7a6/master/w_240,c_limit/2188458795 240w, https://media.gq-magazine.co.uk/photos/6752ceb2f62ae13ac360b7a6/master/w_320,c_limit/2188458795 320w, https://media.gq-magazine.co.uk/photos/6752ceb2f62ae13ac360b7a6/master/w_640,c_limit/2188458795 640w, https://media.gq-magazine.co.uk/photos/6752ceb2f62ae13ac360b7a6/master/w_960,c_limit/2188458795 960w, https://media.gq-magazine.co.uk/photos/6752ceb2f62ae13ac360b7a6/master/w_1280,c_limit/2188458795 1280w, https://media.gq-magazine.co.uk/photos/6752ceb2f62ae13ac360b7a6/master/w_1600,c_limit/2188458795 1600w" sizes="100vw"/>Jon Kopaloff/Getty ImagesBrody — who you may have spotted at GQ’s Men of the Year event at the end of last month in a grey Margiela banger — kept things simple elsewhere. Straight-leg trousers and shiny lace-up shoes added some contrast. We've been seeing this style of high-collar outerwear a lot recently, on well-dressed guys like Colman Domingo and David Beckham, and on the runways via Dior, Zegna and Dries Van Noten.Rumours are swirling that Brody’s performance in the three-and-a-half-hour “modern masterpiece” is putting him on the path to another Oscar, which would be thoroughly deserved. And if we get an entire press tour, plus an awards season, with fits this good? Oh, we’re rubbing our hands together with a cackle.'''
