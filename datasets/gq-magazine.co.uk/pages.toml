title = "Best men's jewellery under £150: Necklaces, rings and more | British GQ"
description = "We've rounded up the best necklaces, bracelets, and rings under £150. Check out our picks from Mejuri, Jaxxon, and more"
full_description = '''ShoppingThe best men's jewellery under £150 will help you shine bright on a budgetBy Michael Nolledo4 March 2025Image: Getty; Collage by Brittany LogginsThese accessible, everyday pieces are an ice-cold stealAll products are independently selected by our editors. If you buy something, we may earn an affiliate commission.The best men’s jewellery under £150 is gleaming, glittering proof that the category isn’t just a rich guy’s game. In 2025, there’s no shortage of stellar jewellery brands offering shockingly righteous accessories at shockingly affordable prices. These days, you can scoop an assortment of primo-looking necklaces, rings, bracelets, and more for a fraction of what you'd otherwise expect.How did we get here? A long-simmering men’s jewellery renaissance has made even the most stoic of gentlemen entertaining the idea of adding shine to their 'fits. The market, in turn, has responded, eager to accommodate men’s fashion’s newfound fluid (and welcomed!) outlook on jewellery.To clarify: solid gold and diamond-cut gemstones won’t be in the mix here, but rest assured, your gold vermeil, gold-plated, and sterling silver jewellery are duly represented. Make a point to take care of these materials, and they’ll last for years to come. Sure, fine jewellery will always have its time and place, but if you're looking for a little extra bling to accentuate your fits, trust that a gold vermeil link chain will do you justice, and most passersby will be none the wiser.There's a whole world of men's jewellery under £150 out there, and it's all yours for the taking. Not literally, though – even if at these prices, it really does feel like a steal.Best necklaces under £150The easiest way to elevate your look? Adorning your neck. From simple gold chains to silvery pendants ringing in for less than a Benjamin, the market for balling on a budget is very strong. That said, if the price looks too good to be true, that’s probably because it is. To help you sift out the gems from the scams, we’ve selected some of our favourites right now.<img loading="lazy" alt="Gold Chain Necklace" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c6e705a234dde0d2f12c5b/3:4/w_748%2Cc_limit/necklace3.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c6e705a234dde0d2f12c5b/3:4/w_120,c_limit/necklace3.jpg 120w, https://media.gq-magazine.co.uk/photos/67c6e705a234dde0d2f12c5b/3:4/w_240,c_limit/necklace3.jpg 240w, https://media.gq-magazine.co.uk/photos/67c6e705a234dde0d2f12c5b/3:4/w_320,c_limit/necklace3.jpg 320w, https://media.gq-magazine.co.uk/photos/67c6e705a234dde0d2f12c5b/3:4/w_640,c_limit/necklace3.jpg 640w" sizes="100vw"/>Gold Chain Necklace£115 SSENSE<img loading="lazy" alt="Silver Jacks Chain Necklace" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c6e707a234dde0d2f12c5c/3:4/w_748%2Cc_limit/necklace5.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c6e707a234dde0d2f12c5c/3:4/w_120,c_limit/necklace5.jpg 120w, https://media.gq-magazine.co.uk/photos/67c6e707a234dde0d2f12c5c/3:4/w_240,c_limit/necklace5.jpg 240w, https://media.gq-magazine.co.uk/photos/67c6e707a234dde0d2f12c5c/3:4/w_320,c_limit/necklace5.jpg 320w, https://media.gq-magazine.co.uk/photos/67c6e707a234dde0d2f12c5c/3:4/w_640,c_limit/necklace5.jpg 640w" sizes="100vw"/>Silver Jacks Chain Necklace£130 SSENSE<img loading="lazy" alt="2.4mm Wheat Chain Necklace" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c6e709fc2290afc718f6f4/3:4/w_748%2Cc_limit/necklace1.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c6e709fc2290afc718f6f4/3:4/w_120,c_limit/necklace1.jpg 120w, https://media.gq-magazine.co.uk/photos/67c6e709fc2290afc718f6f4/3:4/w_240,c_limit/necklace1.jpg 240w, https://media.gq-magazine.co.uk/photos/67c6e709fc2290afc718f6f4/3:4/w_320,c_limit/necklace1.jpg 320w, https://media.gq-magazine.co.uk/photos/67c6e709fc2290afc718f6f4/3:4/w_640,c_limit/necklace1.jpg 640w" sizes="100vw"/>2.4mm Wheat Chain Necklace£148 Mejuri<img loading="lazy" alt="Image may contain: Accessories, Jewelry, Necklace, and Chain" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c6e709a234dde0d2f12c5e/3:4/w_748%2Cc_limit/jaxxon-chain.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c6e709a234dde0d2f12c5e/3:4/w_120,c_limit/jaxxon-chain.jpg 120w, https://media.gq-magazine.co.uk/photos/67c6e709a234dde0d2f12c5e/3:4/w_240,c_limit/jaxxon-chain.jpg 240w, https://media.gq-magazine.co.uk/photos/67c6e709a234dde0d2f12c5e/3:4/w_320,c_limit/jaxxon-chain.jpg 320w, https://media.gq-magazine.co.uk/photos/67c6e709a234dde0d2f12c5e/3:4/w_640,c_limit/jaxxon-chain.jpg 640w" sizes="100vw"/>Cuban Link Chain - 3mm£149 JaxxonBest bracelets under £150If wearing a watch isn't in your wheelhouse, the next best thing for your miserable, bare wrists is a bracelet. Cuffs are an easy way to make a statement, but don’t shy away from the dainty and delicate. Either way, you'll want to make sure the flash complements your fit without risk of becoming a distracting eyesore.<img loading="lazy" alt="Round box chain bracelet" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/6745a91702933ad1f554af3f/3:4/w_748%2Cc_limit/Mejuri_BlackFriday_Round-box-chain-bracelet.jpg" srcSet="https://media.gq-magazine.co.uk/photos/6745a91702933ad1f554af3f/3:4/w_120,c_limit/Mejuri_BlackFriday_Round-box-chain-bracelet.jpg 120w, https://media.gq-magazine.co.uk/photos/6745a91702933ad1f554af3f/3:4/w_240,c_limit/Mejuri_BlackFriday_Round-box-chain-bracelet.jpg 240w, https://media.gq-magazine.co.uk/photos/6745a91702933ad1f554af3f/3:4/w_320,c_limit/Mejuri_BlackFriday_Round-box-chain-bracelet.jpg 320w, https://media.gq-magazine.co.uk/photos/6745a91702933ad1f554af3f/3:4/w_640,c_limit/Mejuri_BlackFriday_Round-box-chain-bracelet.jpg 640w" sizes="100vw"/>MejuriBox chain bracelet£98 £73.50 Mejuri<img loading="lazy" alt="Mixed Metal Beaded Chain Bracelet" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c6e70e56f8ebcd56bba4b8/3:4/w_748%2Cc_limit/bracelet6.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c6e70e56f8ebcd56bba4b8/3:4/w_120,c_limit/bracelet6.jpg 120w, https://media.gq-magazine.co.uk/photos/67c6e70e56f8ebcd56bba4b8/3:4/w_240,c_limit/bracelet6.jpg 240w, https://media.gq-magazine.co.uk/photos/67c6e70e56f8ebcd56bba4b8/3:4/w_320,c_limit/bracelet6.jpg 320w, https://media.gq-magazine.co.uk/photos/67c6e70e56f8ebcd56bba4b8/3:4/w_640,c_limit/bracelet6.jpg 640w" sizes="100vw"/>Mixed Metal Beaded Chain Bracelet£48 Monica Vinader<img loading="lazy" alt="Image may contain: Accessories, Bracelet, Jewelry, and Cuff" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/66854cedfa8bd6e725769e05/3:4/w_748%2Cc_limit/GiftsForBros_Eliou-Bracelet.jpg" srcSet="https://media.gq-magazine.co.uk/photos/66854cedfa8bd6e725769e05/3:4/w_120,c_limit/GiftsForBros_Eliou-Bracelet.jpg 120w, https://media.gq-magazine.co.uk/photos/66854cedfa8bd6e725769e05/3:4/w_240,c_limit/GiftsForBros_Eliou-Bracelet.jpg 240w, https://media.gq-magazine.co.uk/photos/66854cedfa8bd6e725769e05/3:4/w_320,c_limit/GiftsForBros_Eliou-Bracelet.jpg 320w, https://media.gq-magazine.co.uk/photos/66854cedfa8bd6e725769e05/3:4/w_640,c_limit/GiftsForBros_Eliou-Bracelet.jpg 640w" sizes="100vw"/>ÉliouBracelet£155 £93 Mr Porter<img loading="lazy" alt="Missoma &#x27;Square Snake&#x27; bracelet, as selected by Heidi Quill" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/6602ffa8b5fc51760a16f279/3:4/w_748%2Cc_limit/Bracelets_Missoma.jpg" srcSet="https://media.gq-magazine.co.uk/photos/6602ffa8b5fc51760a16f279/3:4/w_120,c_limit/Bracelets_Missoma.jpg 120w, https://media.gq-magazine.co.uk/photos/6602ffa8b5fc51760a16f279/3:4/w_240,c_limit/Bracelets_Missoma.jpg 240w, https://media.gq-magazine.co.uk/photos/6602ffa8b5fc51760a16f279/3:4/w_320,c_limit/Bracelets_Missoma.jpg 320w, https://media.gq-magazine.co.uk/photos/6602ffa8b5fc51760a16f279/3:4/w_640,c_limit/Bracelets_Missoma.jpg 640w" sizes="100vw"/>MissomaSquare Snake Bracelet£149 MissomaBest rings under £150It’s wise to exercise caution when shopping for a piece of jewellery you’ll want to wear every day – that is, if it doesn’t tarnish or literally fall apart. From simple, gilded bands to iced out signet rings that won’t leave you the other type of green thumb, we’ve picked out the best rings that’ll make the digits on your hand and your bank account happy.<img loading="lazy" alt="Siren Muse Band Ring" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c6e7125c51543c1f4daae1/3:4/w_748%2Cc_limit/ring6.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c6e7125c51543c1f4daae1/3:4/w_120,c_limit/ring6.jpg 120w, https://media.gq-magazine.co.uk/photos/67c6e7125c51543c1f4daae1/3:4/w_240,c_limit/ring6.jpg 240w, https://media.gq-magazine.co.uk/photos/67c6e7125c51543c1f4daae1/3:4/w_320,c_limit/ring6.jpg 320w, https://media.gq-magazine.co.uk/photos/67c6e7125c51543c1f4daae1/3:4/w_640,c_limit/ring6.jpg 640w" sizes="100vw"/>Siren Muse Band Ring£78 Monica Vinader<img loading="lazy" alt="Courage Signet Ring" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c6e71078aadc02ee39b7ca/3:4/w_748%2Cc_limit/ring2.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c6e71078aadc02ee39b7ca/3:4/w_120,c_limit/ring2.jpg 120w, https://media.gq-magazine.co.uk/photos/67c6e71078aadc02ee39b7ca/3:4/w_240,c_limit/ring2.jpg 240w, https://media.gq-magazine.co.uk/photos/67c6e71078aadc02ee39b7ca/3:4/w_320,c_limit/ring2.jpg 320w, https://media.gq-magazine.co.uk/photos/67c6e71078aadc02ee39b7ca/3:4/w_640,c_limit/ring2.jpg 640w" sizes="100vw"/>Courage Signet Ring£148 Mejuri<img loading="lazy" alt="Image may contain: Body Part, Finger, Hand, Person, Accessories, Bracelet, Jewelry, Ring, and Skin" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/677c08e2fb7b942cc3c6990f/3:4/w_748%2Cc_limit/Trends_TwoJeys-01-Ring.jpg" srcSet="https://media.gq-magazine.co.uk/photos/677c08e2fb7b942cc3c6990f/3:4/w_120,c_limit/Trends_TwoJeys-01-Ring.jpg 120w, https://media.gq-magazine.co.uk/photos/677c08e2fb7b942cc3c6990f/3:4/w_240,c_limit/Trends_TwoJeys-01-Ring.jpg 240w, https://media.gq-magazine.co.uk/photos/677c08e2fb7b942cc3c6990f/3:4/w_320,c_limit/Trends_TwoJeys-01-Ring.jpg 320w, https://media.gq-magazine.co.uk/photos/677c08e2fb7b942cc3c6990f/3:4/w_640,c_limit/Trends_TwoJeys-01-Ring.jpg 640w" sizes="100vw"/>TwoJeys ring£65 End Clothing<img loading="lazy" alt="Image may contain: Clothing, Coat, Jacket, Accessories, Jewelry, Ring, Blazer, Body Part, Finger, Hand, Person, and Adult" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/677c08e221f9563721711fe4/3:4/w_748%2Cc_limit/Trends_Rough-rings.jpg" srcSet="https://media.gq-magazine.co.uk/photos/677c08e221f9563721711fe4/3:4/w_120,c_limit/Trends_Rough-rings.jpg 120w, https://media.gq-magazine.co.uk/photos/677c08e221f9563721711fe4/3:4/w_240,c_limit/Trends_Rough-rings.jpg 240w, https://media.gq-magazine.co.uk/photos/677c08e221f9563721711fe4/3:4/w_320,c_limit/Trends_Rough-rings.jpg 320w, https://media.gq-magazine.co.uk/photos/677c08e221f9563721711fe4/3:4/w_640,c_limit/Trends_Rough-rings.jpg 640w" sizes="100vw"/>AllSaintsAllSaints textured ring£45 AllSaintsBest earrings under £150When it comes to earrings, there are plenty of unisex styles out there, from gold-tone hoops to of-the-moment ear cuffs. You can even score some sparkly studs without emptying out your pocket purse on the counter. Here’s how to get in on the action.<img loading="lazy" alt="Image may contain: Accessories, Earring, Jewelry, Adult, Person, Body Part, and Ear" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/6685756afa8bd6e725769e45/3:4/w_748%2Cc_limit/Gifts-for-Sisters-Pearl-Earrings.jpg" srcSet="https://media.gq-magazine.co.uk/photos/6685756afa8bd6e725769e45/3:4/w_120,c_limit/Gifts-for-Sisters-Pearl-Earrings.jpg 120w, https://media.gq-magazine.co.uk/photos/6685756afa8bd6e725769e45/3:4/w_240,c_limit/Gifts-for-Sisters-Pearl-Earrings.jpg 240w, https://media.gq-magazine.co.uk/photos/6685756afa8bd6e725769e45/3:4/w_320,c_limit/Gifts-for-Sisters-Pearl-Earrings.jpg 320w, https://media.gq-magazine.co.uk/photos/6685756afa8bd6e725769e45/3:4/w_640,c_limit/Gifts-for-Sisters-Pearl-Earrings.jpg 640w" sizes="100vw"/>Astrid & MiyuPearl Huggie Earrings£60 Astrid & Miyu<img loading="lazy" alt="Best gifts for teens chosen by Jessie Atkinson for British GQ Florence London Star Studs" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/673201bf230a1f81639c6d59/3:4/w_748%2Cc_limit/Best-gifts-for-teens-chosen-by-Jessie-Atkinson-for-British-GQ-Florence-London-Star-Studs.jpg" srcSet="https://media.gq-magazine.co.uk/photos/673201bf230a1f81639c6d59/3:4/w_120,c_limit/Best-gifts-for-teens-chosen-by-Jessie-Atkinson-for-British-GQ-Florence-London-Star-Studs.jpg 120w, https://media.gq-magazine.co.uk/photos/673201bf230a1f81639c6d59/3:4/w_240,c_limit/Best-gifts-for-teens-chosen-by-Jessie-Atkinson-for-British-GQ-Florence-London-Star-Studs.jpg 240w, https://media.gq-magazine.co.uk/photos/673201bf230a1f81639c6d59/3:4/w_320,c_limit/Best-gifts-for-teens-chosen-by-Jessie-Atkinson-for-British-GQ-Florence-London-Star-Studs.jpg 320w, https://media.gq-magazine.co.uk/photos/673201bf230a1f81639c6d59/3:4/w_640,c_limit/Best-gifts-for-teens-chosen-by-Jessie-Atkinso