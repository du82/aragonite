["https://gq-magazine.co.uk/article/new-james-bond"]
title = "Next James Bond: Who will be the new 007? | British GQ"
description = "It has been four years since Daniel Craig bowed out of Bond in No Time to Die, and long-time custodians Barbara Broccoli and Michael G Wilson have just ceded creative control to Amazon MGM Studios. So what's next — and who will step into 007's shoes?"
full_description = '''James BondWho will be the next James Bond?It has been four years since Daniel Craig bowed out of Bond in No Time to Die, and long-time custodians Barbara Broccoli and Michael G Wilson have just ceded creative control to Amazon MGM Studios. So what's next — and who will step into 007's shoes?By Jack King and Killian Faith-Kelly21 February 2025Getty, Adobe StockAll products are independently selected by our editors. If you buy something, we may earn an affiliate commission.This is GQ's power ranking of the prime candidates to be the next James Bond, which is updated regularly — and will be until an official announcement is made.Four years on from the conclusion of Daniel Craig's acclaimed Bond stint, and we're still yet to find his successor. The question remains: who will be the next James Bond?The rumour mill has turned out names as varied as Idris Elba, James Norton, Theo James, Callum Turner, Harris Dickinson and Aaron Taylor-Johnson over the years. Elba was long thought to be the frontrunner, but has taken himself out of the race multiple times. Taylor-Johnson has also emerged as a leading candidate — so much so that The Sun reported last year that he had been formally offered the role. This is obviously yet to be corroborated by official channels, though. And with every passing week without confirmation, it feels more and more like bluster.But it looks like there may finally be movement in the near future. This week, it was announced that long-time franchise custodians Barbara Broccoli and Michael G Wilson, the daughter and stepson of O.G. Bond producer Albert “Cubby” Broccoli, will cede creative control over Bond to Amazon MGM Studios. This means that the company founded by bonafide Bond villain Jeff “Blofeld” Bezos will exclusively dictate the future of 007, leading to online speculation that the franchise will evolve from film series into a fully fledged media universe similar to the MCU.Complicating matters, Ian Fleming's original James Bond novels are expected to enter the public domain in 2035 — which could hypothetically lead to rival film studios making their own movies about the Bond books. Amazon better get their skates on, then. To that end, the announcement of Daniel Craig's successor feels closer than it has since 2021. Bezos even straw-polled X on who the next Bond should be — and the replies were dominated by blue ticks clamouring for Henry Cavill.So, the bookies' odds are all over the place, and it's tough to say with any certainty who the next Bond will be. But we've long kept a close (golden)eye on the leading candidates for the license to kill, and have below assembled a power list of the most viable names — though keep in mind that Craig himself was considered an outside pick in the early 2000s, so even the unlikeliest actor could end up a double-O.Here we judge who could and should become the next James Bond.Top AgentsJames NortonThe star of television's Happy Valley, War and Peace and Grantchester.<img alt="Image may contain James Norton Human Person Fashion Premiere Red Carpet Red Carpet Premiere Tie and Accessories" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/5d138db1b6fee9f36ac9dc4b/master/w_1600%2Cc_limit/James-Norton-GQ-6Feb17_getty_b.jpg" srcSet="https://media.gq-magazine.co.uk/photos/5d138db1b6fee9f36ac9dc4b/master/w_120,c_limit/James-Norton-GQ-6Feb17_getty_b.jpg 120w, https://media.gq-magazine.co.uk/photos/5d138db1b6fee9f36ac9dc4b/master/w_240,c_limit/James-Norton-GQ-6Feb17_getty_b.jpg 240w, https://media.gq-magazine.co.uk/photos/5d138db1b6fee9f36ac9dc4b/master/w_320,c_limit/James-Norton-GQ-6Feb17_getty_b.jpg 320w, https://media.gq-magazine.co.uk/photos/5d138db1b6fee9f36ac9dc4b/master/w_640,c_limit/James-Norton-GQ-6Feb17_getty_b.jpg 640w, https://media.gq-magazine.co.uk/photos/5d138db1b6fee9f36ac9dc4b/master/w_960,c_limit/James-Norton-GQ-6Feb17_getty_b.jpg 960w, https://media.gq-magazine.co.uk/photos/5d138db1b6fee9f36ac9dc4b/master/w_1280,c_limit/James-Norton-GQ-6Feb17_getty_b.jpg 1280w, https://media.gq-magazine.co.uk/photos/5d138db1b6fee9f36ac9dc4b/master/w_1600,c_limit/James-Norton-GQ-6Feb17_getty_b.jpg 1600w" sizes="100vw"/>Getty ImagesWhy: James Norton’s profile rocketed in 2016 with his triple whammy performances in Happy Valley (profound psycho), War and Peace (mournful warrior) and Grantchester (Anglican priest with a robust moral compass). With an eclectic mix of characters already on his CV, as well as an education at Cambridge, we’re certain that Norton could easily slip into the role of the suave and sophisticated 007.<img alt="How A Little Life made James Norton a more resilient, fearless, better-dressed guy" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/661c3e9c27843109247897cd/1:1/w_775%2Cc_limit/James_BOTTEGA_retouched_1.jpg" srcSet="https://media.gq-magazine.co.uk/photos/661c3e9c27843109247897cd/1:1/w_120,c_limit/James_BOTTEGA_retouched_1.jpg 120w, https://media.gq-magazine.co.uk/photos/661c3e9c27843109247897cd/1:1/w_240,c_limit/James_BOTTEGA_retouched_1.jpg 240w, https://media.gq-magazine.co.uk/photos/661c3e9c27843109247897cd/1:1/w_320,c_limit/James_BOTTEGA_retouched_1.jpg 320w, https://media.gq-magazine.co.uk/photos/661c3e9c27843109247897cd/1:1/w_640,c_limit/James_BOTTEGA_retouched_1.jpg 640w" sizes="100vw"/>How A Little Life made James Norton a more resilient, fearless, better-dressed guyBy Lucy FordHollywood veteran Diane Keaton told Sky News that Norton would be perfect for the 007 role: "He's got everything that you need. First of all he's extremely attractive, very smart, he's well educated, and he's a fantastic actor. And he's sexy, right? I'm not wrong, I mean, women are gonna love him.” And at the young age of 39, he could definitely carry the Bond franchise for many years to come.Why Not: One issue with Norton is his ability to attract a large enough audience to back him. The transition from beloved TV actor to the face of the world’s biggest action franchise could prove to be too big of an ask, and Norton is yet to prove that he’s true blockbuster material. But then again, did that prevent the Bond producers from hiring Pierce Brosnan (best known when he made GoldenEye for the TV series Remington Steele) or indeed Craig (whose credits were largely in independent films like Layer Cake)?What are the odds? Paddy Power has Norton at 3/1, while William Hill gives him a more bullish 2/1.Aaron Taylor-JohnsonAlready known for playing kick-ass superheroes, Bond isn't a huge leap for Taylor-Johnson.<img alt="Next James Bond Who will be the new 007" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/6384d604ef2a956ccb37de1b/master/w_1600%2Cc_limit/Bond-aaron-taylor-johnson.jpg" srcSet="https://media.gq-magazine.co.uk/photos/6384d604ef2a956ccb37de1b/master/w_120,c_limit/Bond-aaron-taylor-johnson.jpg 120w, https://media.gq-magazine.co.uk/photos/6384d604ef2a956ccb37de1b/master/w_240,c_limit/Bond-aaron-taylor-johnson.jpg 240w, https://media.gq-magazine.co.uk/photos/6384d604ef2a956ccb37de1b/master/w_320,c_limit/Bond-aaron-taylor-johnson.jpg 320w, https://media.gq-magazine.co.uk/photos/6384d604ef2a956ccb37de1b/master/w_640,c_limit/Bond-aaron-taylor-johnson.jpg 640w, https://media.gq-magazine.co.uk/photos/6384d604ef2a956ccb37de1b/master/w_960,c_limit/Bond-aaron-taylor-johnson.jpg 960w, https://media.gq-magazine.co.uk/photos/6384d604ef2a956ccb37de1b/master/w_1280,c_limit/Bond-aaron-taylor-johnson.jpg 1280w, https://media.gq-magazine.co.uk/photos/6384d604ef2a956ccb37de1b/master/w_1600,c_limit/Bond-aaron-taylor-johnson.jpg 1600w" sizes="100vw"/>Han Myung-GuWhy: Taylor-Johnson has it all. The actor, no stranger to stunts, has proven himself as an action star in the making through roles in the Kick-Ass movies, Avengers: Age of Ultron, Godzilla, Tenet and Bullet Train. On top of this, he has great emotional range, as showcased by his breakthrough role as a young John Lennon in Nowhere Boy.<img alt="Bullet Train, Aaron Taylor-Johnson’s Bond audition, proves he can bring the fun the franchise needs" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/65fadbb718aef123e8e570f8/1:1/w_775%2Cc_limit/Aaron-Taylor-Johnson-Bond.jpg" srcSet="https://media.gq-magazine.co.uk/photos/65fadbb718aef123e8e570f8/1:1/w_120,c_limit/Aaron-Taylor-Johnson-Bond.jpg 120w, https://media.gq-magazine.co.uk/photos/65fadbb718aef123e8e570f8/1:1/w_240,c_limit/Aaron-Taylor-Johnson-Bond.jpg 240w, https://media.gq-magazine.co.uk/photos/65fadbb718aef123e8e570f8/1:1/w_320,c_limit/Aaron-Taylor-Johnson-Bond.jpg 320w, https://media.gq-magazine.co.uk/photos/65fadbb718aef123e8e570f8/1:1/w_640,c_limit/Aaron-Taylor-Johnson-Bond.jpg 640w" sizes="100vw"/>Bullet Train, Aaron Taylor-Johnson’s Bond audition, proves he can bring the fun the franchise needsBy Jack KingThe 34-year-old became a frontrunner after The Sun reported that he went for a secret screen test with producers including Barbara Broccoli at Pinewood studios, and seriously impressed them. “Aaron went for a screen test to be the next Bond in September and producers and Barbara loved him. He is now one of the frontrunners,” the source said. Then, in March 2024, a report from The Sun — which was cited by pretty much every major online outlet, including the BBC — claimed that he had been formally offered the role.That report looks increasingly like tabloid bluster, though, with every passing week. It's been almost a year, after all. You'd imagine we'd have official confirmation by now. And with Broccoli and Wilson now out of the picture, we'll see if he has stuck in Amazon's mind.Why not: At 34, Taylor-Johnson might be a tad too young for a weary and weathered Bond a la Craig. But then again, Wilson revealed in October 2022 that the team were gravitating towards “a thirty-something”. Aside from that, there really aren't very many downsides to Taylor-Johnson, and it looks like the Bond team may feel similarly.What are the odds? Betfair says 3/1 for Taylor-Johnson, while Ladbrokes is marginally less confident at 7/2.Harris DickinsonThe Kingsman and Babygirl star boasts all of the suave sophistication one might wish for from a potential Bond.<img alt="Next James Bond Who will be the new 007" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/624b0c7eb63bdfb22a905010/master/w_1600%2Cc_limit/0404_Bond_02.jpg" srcSet="https://media.gq-magazine.co.uk/photos/624b0c7eb63bdfb22a905010/master/w_120,c_limit/0404_Bond_02.jpg 120w, https://media.gq-magazine.co.uk/photos/624b0c7eb63bdfb22a905010/master/w_240,c_limit/0404_Bond_02.jpg 240w, https://media.gq-magazine.co.uk/photos/624b0c7eb63bdfb22a905010/master/w_320,c_limit/0404_Bond_02.jpg 320w, https://media.gq-magazine.co.uk/photos/624b0c7eb63bdfb22a905010/master/w_640,c_limit/0404_Bond_02.jpg 640w, https://media.gq-magazine.co.uk/photos/624b0c7eb63bdfb22a905010/master/w_960,c_limit/0404_Bond_02.jpg 960w, https://media.gq-magazine.co.uk/photos/624b0c7eb63bdfb22a905010/master/w_1280,c_limit/0404_Bond_02.jpg 1280w, https://media.gq-magazine.co.uk/photos/624b0c7eb63bdfb22a905010/master/w_1600,c_limit/0404_Bond_02.jpg 1600w" sizes="100vw"/>Karwai TangWhy: A shape-shifter of a performer, Harris Dickinson has done it all by his mid-twenties: he's led a major franchise installment in The Kingsman, and won over cinephillic hearts and minds in esoteric, artsier fare like Beach Rats, Matthias & Maxime and The Souvenir Part II. The Kingsman especially proved his spy bonafides, along with atypical emotional versatility and all of the screen presence you'd demand of Bond. His take? “Nah, I don't think so,” he told ES Magazine. Humble, too!<img alt="Harris Dickinson’s bright future" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/64e61b2d6cdcf7c30385f489/1:1/w_775%2Cc_limit/August%252028_Harris%2520Dickinson_Online%2520Header.jpg" srcSet="https://media.gq-magazine.co.uk/photos/64e61b2d6cdcf7c30385f489/1:1/w_120,c_limit/August%2028_Harris%20Dickinson_Online%20Header.jpg 120w, https://media.gq-magazine.co.uk/photos/64e61b2d6cdcf7c30385f489/1:1/w_240,c_limit/August%2028_Harris%20Dickinson_Online%20Header.jpg 240w, https://media.gq-magazine.co.uk/photos/64e61b2d6cdcf7c30385f489/1:1/w_320,c_limit/August%2028_Harris%20Dickinson_Online%20Header.jpg 320w, https://media.gq-magazine.co.uk/photos/64e61b2d6cdcf7c30385f489/1:1/w_640,c_limit/August%2028_Harris%20Dickinson_Online%20Header.jpg 640w" sizes="100vw"/>FilmHarris Dickinson’s bright futureBy Iana MurrayWhy not: He's only 28, which would historically prove a touch too young to play the grizzled super spy. But if he keeps up his present momentum, it's hard not to see how he won't be at the centre of the conversation in five or ten years — assuming the slot isn't filled by a long-timer.What are the odds? William Hill is especially strong on Dickinson, assigning him favourable 5/2 odds. At 4/1, Ladbrokes is less confident in his chances.Theo JamesHe's like if you could make James Bond on The Sims.<img alt="Next James Bond Who will be the new 007" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/63c7d0bb2ef9ea0a352d5ec1/master/w_1600%2Cc_limit/1456782225" srcSet="https://media.gq-magazine.co.uk/photos/63c7d0bb2ef9ea0a352d5ec1/master/w_120,c_limit/1456782225 120w, https://media.gq-magazine.co.uk/photos/63c7d0bb2ef9ea0a352d5ec1/master/w_240,c_limit/1456782225 240w, https://media.gq-magazine.co.uk/photos/63c7d0bb2ef9ea0a352d5ec1/master/w_320,c_limit/1456782225 320w, https://media.gq-magazine.co.uk/photos/63c7d0bb2ef9ea0a352d5ec1/master/w_640,c_limit/1456782225 640w, https://media.gq-magazine.co.uk/photos/63c7d0bb2ef9ea0a352d5ec1/master/w_960,c_limit/1456782225 960w, https://media.gq-magazine.co.uk/photos/63c7d0bb2ef9ea0a352d5ec1/master/w_1280,c_limit/1456782225 1280w, https://media.gq-magazine.co.uk/photos/63c7d0bb2ef9ea0a352d5ec1/master/w_1600,c_limit/1456782225 1600w" sizes="100vw"/>Jacopo Raule/Getty ImagesWhy: Theo James's lead role in Guy Ritchie's The Gentlemen, the 2019 film's universe-expanding series on Netflix, is basically an eight-episode audition for Bond. In it, he plays a charming aristocrat with a secret set of army skills — basically, he can nut bad guys in the face, or jump shotgun in a getaway car, without breaking much of a sweat. He also, not for nothing, looks like if you could make a generic idea of James Bond on the Sims. He's fronted action franchises and played romantic leads. But crucially he's never been pigeon-holed by any one character from his roster, and that's good if you're going to sign on to the most defining role of all time.Why not: Well, he just doesn't seem that keen on it. Of course, this may be classic ac'''
