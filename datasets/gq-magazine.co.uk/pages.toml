["https://gq-magazine.co.uk/article/andrew-garfield-hype-interview-2025"]
title = "Andrew Garfield on grief, We Live in Time and Spider-Man 4 | British GQ"
description = "You'll have noticed that Andrew Garfield is talking a lot about grief lately. Now, he's reckoning with the cost of regularly opening the door to tremendous pain"
full_description = '''GQ HypeAndrew Garfield is cracked openYou'll have noticed that Andrew Garfield is talking a lot about grief lately. Now, he's reckoning with the cost of regularly opening the door to tremendous painBy Ben AllenPhotography by Fumi Homma2 January 2025Roll neck and jumper by 16Arlington. Trousers by Lanvin. Socks by Falke. Shoes by Camper.Have you seen Andrew Garfield cry? It’s really something. When Andrew Garfield cries, his brow furrows and his eyes narrow and quiver. He doesn’t do that thing that most men do where they fight and fight to stop it coming, gritting teeth and holding it in. Andrew Garfield embraces the tears and they flow down his cheeks gratefully, his irises glistening like pebbles underwater. As I sit across from him at lunch, a sick part of me wants him to cry just so I can see it.Have you seen Andrew Garfield cry? Who am I kidding, of course you have. You’ve probably seen him sobbing heavily as Peter Parker, who he played with youthful vulnerability across three Spider-Man movies in the past 12 years, or weeping silently through song as the late Broadway legend Jonathan Larsen in the Oscar-nominated biopic Tick… Tick… Boom!, or scream-crying as a doomed man in Never Let Me Go, the devastating 2010 adaptation of Kazuo Ishiguro’s alternative history novel.<img alt="Image may contain Andrew Garfield Publication Adult Person Head Face and Magazine" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/6762f8485c38c7cb7b7d6359/master/w_1600%2Cc_limit/Jan%252002%2520-%2520Andrew%2520Garfield_Cover.jpg" srcSet="https://media.gq-magazine.co.uk/photos/6762f8485c38c7cb7b7d6359/master/w_120,c_limit/Jan%2002%20-%20Andrew%20Garfield_Cover.jpg 120w, https://media.gq-magazine.co.uk/photos/6762f8485c38c7cb7b7d6359/master/w_240,c_limit/Jan%2002%20-%20Andrew%20Garfield_Cover.jpg 240w, https://media.gq-magazine.co.uk/photos/6762f8485c38c7cb7b7d6359/master/w_320,c_limit/Jan%2002%20-%20Andrew%20Garfield_Cover.jpg 320w, https://media.gq-magazine.co.uk/photos/6762f8485c38c7cb7b7d6359/master/w_640,c_limit/Jan%2002%20-%20Andrew%20Garfield_Cover.jpg 640w, https://media.gq-magazine.co.uk/photos/6762f8485c38c7cb7b7d6359/master/w_960,c_limit/Jan%2002%20-%20Andrew%20Garfield_Cover.jpg 960w, https://media.gq-magazine.co.uk/photos/6762f8485c38c7cb7b7d6359/master/w_1280,c_limit/Jan%2002%20-%20Andrew%20Garfield_Cover.jpg 1280w, https://media.gq-magazine.co.uk/photos/6762f8485c38c7cb7b7d6359/master/w_1600,c_limit/Jan%2002%20-%20Andrew%20Garfield_Cover.jpg 1600w" sizes="100vw"/>Shirt by Studio Nicholson. My mind wanders to these emphatic displays of emotion as he and I sit in silence for over a minute. We’re in a restaurant in one of those laughably expensive hotels in London where waiters circle your table like anxious sharks. “Have you had a chance t–?” “Do you need any–?” “Can I interest you in a–?” They seem to think the absence of conversation at our table means we’re in need of attention. But, actually, Garfield is scrolling through his phone as he’s desperate to show me something. “Fuck, sorry,” he says, as we stretch into minute two. “It’s important to get this right. No, it’s not that...”He’s looking for a quote from Angels in America, Tony Kushner’s play about the AIDS crisis which Garfield performed in London in 2017 and New York in 2018. It’s a monologue delivered by his character Prior Walter to James McArdle’s Louis on a park bench. Both are dealing with the relentless grief of losing friends and lovers to the disease over the course of a decade, but Prior Walter feels that Louis is neglecting to address the great pain within, and actually Garfield can’t find the piece so he’s going to have to paraphrase. “It’s like, ‘I want to see bruises. I want to see blood. Don’t come near me again until you have something to show.’”Garfield performed in Angels in America a short while before his mother Lynn’s death from pancreatic cancer in 2019 created a seismic rift in the timeline of his own existence, separating it into a before and after, as losses of that magnitude often do. But in the years after that event, the script has come to take on greater meaning in his life, because now he understands it deeply. The quote he’s looking for is about having to really feel grief in order to process it. “It’s gotta cost,” he says. “Otherwise, we’re staying in a place where there’s no vitality, and it’s safe and numb.”<img alt="Image may contain Andrew Garfield Andrew Garfield Andrew Garfield Andrew Garfield Adult Person Face and Head" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/6762f8da5ab064023773ace0/master/w_1600%2Cc_limit/Jan%252002%2520-%2520Andrew%2520Garfield_Online_6.jpg" srcSet="https://media.gq-magazine.co.uk/photos/6762f8da5ab064023773ace0/master/w_120,c_limit/Jan%2002%20-%20Andrew%20Garfield_Online_6.jpg 120w, https://media.gq-magazine.co.uk/photos/6762f8da5ab064023773ace0/master/w_240,c_limit/Jan%2002%20-%20Andrew%20Garfield_Online_6.jpg 240w, https://media.gq-magazine.co.uk/photos/6762f8da5ab064023773ace0/master/w_320,c_limit/Jan%2002%20-%20Andrew%20Garfield_Online_6.jpg 320w, https://media.gq-magazine.co.uk/photos/6762f8da5ab064023773ace0/master/w_640,c_limit/Jan%2002%20-%20Andrew%20Garfield_Online_6.jpg 640w, https://media.gq-magazine.co.uk/photos/6762f8da5ab064023773ace0/master/w_960,c_limit/Jan%2002%20-%20Andrew%20Garfield_Online_6.jpg 960w, https://media.gq-magazine.co.uk/photos/6762f8da5ab064023773ace0/master/w_1280,c_limit/Jan%2002%20-%20Andrew%20Garfield_Online_6.jpg 1280w, https://media.gq-magazine.co.uk/photos/6762f8da5ab064023773ace0/master/w_1600,c_limit/Jan%2002%20-%20Andrew%20Garfield_Online_6.jpg 1600w" sizes="100vw"/>Top by Dior Men. Let’s address this out of the gate: this probably isn’t the first time you’ve heard Andrew Garfield talking about grief. A few months ago, he re-emerged from a two-year career break with a film that’s acutely meaningful to him. We Live In Time is a movie about cancer and appreciating the little “nothing-y” moments in life with our loved ones, and in which he does some of his best crying yet.Garfield, 41, has been admirably open in the conversations he’s been having alongside it. He went on the New York Times’ Modern Love podcast and broke down in tears while reciting an essay about loss. “I think what’s hitting me,” he said at the time, “It’s the preciousness… it’s the longing for more.” Clips of this moment were shared with astonishment across social media, where such expressions of genuine emotion and vulnerability are scarce. That same day, he went on CNN anchor Anderson Cooper’s podcast All There Is, which is specifically about processing grief (Cooper started it after his mother’s death in 2019). On that one, his words made Cooper cry.Listening to it, it occurred to me that I had never heard a conversation between two men like it – so nakedly vulnerable and honest about their own pain. The visceral affection with which they both talk about their mothers is particularly heart-wrenching. “On her hospice bed,” Garfield tells Cooper of his mother, “she was more concerned with the nurses than she was with her own pain and discomfort.”The day after those two interviews, Garfield says, he found himself unable to get out of bed. “I woke up and I was like, I don't want to move. What is going on? Am I sick? And I hadn't connected it. I hadn't thought about the emotional rawness of the previous day at all.” Opening that wound, especially in such a public way, had taken its toll on him. “It pulverised me and I needed to actually recover from it.”In We Live In Time – which is directed by John Crowley – Garfield plays Tobias, a Weetabix sales rep who meets and falls in love with a chef, Almut (Florence Pugh). Tobias’ emotions are so close to the surface that you can almost feel his heart pumping through the screen. The film takes us through their romance in non-linear fashion: we’ll see Tobias in preppy dad mode with Almut in heavy pregnancy, and then we’ll see them being told about their slim-to-none chances of conception in a doctor’s office, and later, we’ll see the evening they meet, when Almut runs Tobias over with her car. At some point in this temporal blender, Almut is diagnosed with ovarian cancer. You might have some idea where this is going, and it feels like a film that isn’t really spoilable, but I’ll stop here nonetheless.The film came out in the US in early October, so Garfield has been talking about this movie, and as a result, about his own grief, for a few months by the time we meet. He’s understandably exhausted. “I'm so tired,” he says, laughing. “And I've said so much. I've said enough. It’s time to disappear again. It’s time to hibernate.” He’s wearing a heavy-knit pink jumper, looking cosy and protected in this cold restaurant.So, I do the talking for a bit. I tell him that watching his interviews in these past few weeks opened up a door in me to my own buried grief. I tell him my father died about 13 years ago, when I was 20 and unable to process it properly. I tell him that over the years I’ve had moments where the reality of the loss creeps up on me from nowhere, and one of those was in listening to him and Cooper talk about dealing with their loved ones’ belongings.I tell him that five days before I had forced myself to throw out a ratty old pair of loafers that had belonged to my dad. I had worn them into oblivion (and to be honest, they weren’t really my style anyway) but it still felt like swinging an axe at his memory. I tell him that what he’s doing is powerful; that as men in our 30s and 40s it’s unfortunately rare for us to talk like this; that I have close friends who have experienced similar things but would never talk about it. I litter this spiel with apologies, knowing that I’m probably not the first person to spill my entrails to him on this subject.But Garfield, of course, is understanding. “As a 20-year-old man, losing your dad is a very, very different thing,” he says. “Twenty-year-old boy,” he corrects himself. “We are boys when we're 20. I don’t know if I would've had the capacity to go through what I'm going through now in the way that I'm going through it at that age, I think I would've acted out in a lot of weird ways. I probably would've tried to escape it.”<img alt="Image may contain Andrew Garfield Photography Face Head Person Portrait Adult Clothing Footwear Shoe and Sitting" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/6762fa1e5c38c7cb7b7d635f/master/w_1600%2Cc_limit/Jan%252002%2520-%2520Andrew%2520Garfield_Online_2.jpg" srcSet="https://media.gq-magazine.co.uk/photos/6762fa1e5c38c7cb7b7d635f/master/w_120,c_limit/Jan%2002%20-%20Andrew%20Garfield_Online_2.jpg 120w, https://media.gq-magazine.co.uk/photos/6762fa1e5c38c7cb7b7d635f/master/w_240,c_limit/Jan%2002%20-%20Andrew%20Garfield_Online_2.jpg 240w, https://media.gq-magazine.co.uk/photos/6762fa1e5c38c7cb7b7d635f/master/w_320,c_limit/Jan%2002%20-%20Andrew%20Garfield_Online_2.jpg 320w, https://media.gq-magazine.co.uk/photos/6762fa1e5c38c7cb7b7d635f/master/w_640,c_limit/Jan%2002%20-%20Andrew%20Garfield_Online_2.jpg 640w, https://media.gq-magazine.co.uk/photos/6762fa1e5c38c7cb7b7d635f/master/w_960,c_limit/Jan%2002%20-%20Andrew%20Garfield_Online_2.jpg 960w, https://media.gq-magazine.co.uk/photos/6762fa1e5c38c7cb7b7d635f/master/w_1280,c_limit/Jan%2002%20-%20Andrew%20Garfield_Online_2.jpg 1280w, https://media.gq-magazine.co.uk/photos/6762fa1e5c38c7cb7b7d635f/master/w_1600,c_limit/Jan%2002%20-%20Andrew%20Garfield_Online_2.jpg 1600w" sizes="100vw"/>Jumper and trousers by Bottega Veneta. Belt by Elliot Rhodes. Socks by Falke. Shoe by Vans. More than 10 years ago, when Garfield was researching for his film 99 Homes – about people who had been evicted from their houses in Florida during the recession – he met a construction worker whose wife had recently died. It was “one of those wonderful random interactions that become very, very deep very quickly,” Garfield says. The man, who was in his 50s, said something that really stuck with Garfield. “It was something like ‘we either travel into the wound of our loss and we become bigger-hearted creatures for it, or we go the other way, and we become smaller and more atrophied and more locked up.’” The man told Garfield that he had considered suicide, but his wife’s voice in his head told him not to do it. The man said that he had realised something: that, actually, he had been through the worst thing imaginable, and the rest of his life stretching out before him seemed easier in that context. “I'm walking wounded,” the man said. “And I can be there for other people in a way that I've never been able to be there for other people before. The world has cracked me open.”Now Garfield too is cracked open. “Thank you for sharing that with me,” he says, referring to my own grief spiel. “I feel quite passionate about this thing that's just available to us that we've been somehow imprisoned from or cordoned off from. It's like, Oh, wait a minute, we're allowed to feel all of this. And actually, we can show up for each other and support each other as men.”I feel bad asking this, and he may feel bad answering it. But do people come up to him and talk to him about their own grief, like I have, and does that sometimes feel like a burden? “No,” he says. “It’s a privilege. I'm looking to feel as connected as I can be to people, to life, to the human experience.”With all of this talk of death, we’ve neglected to order any food. The sharks are visibly agitated and so we put them out of their misery. In the meantime we both paw hunks from the miniature loaf of bread they’ve slotted down between us like we haven’t eaten in days.Garfield does have friends he can talk to about this kind of stuff. He’s part of a WhatsApp group called “The Lucky Fuckers”, which is a collection of older male friends from different walks of life who he has met in dribs and drabs over the last 12 years. “The thing that binds us is this longing to live in a way that is full of vitality and truth and honesty,” he says. He gets out his phone once again to pull up their chat and share some of it with me, because “there’s some good shit happening right now.”One of these friends, he says, is doing an ancestral journey in Italy with his family as we speak. “It’s profound shit.” He scrolls. “One of them is saying, ‘Thanks for always welcoming me back when I get overwhelmed with life, I continue to choose and lose track of the thread. There is a beauty in the way that when one loses the beat for a moment, the others keep the rhythm, the banter, the connection alive with a heart longing for renewed vitality and feeling hopeful with my brothers at my back.’”I tell him that I think a lot of men don’t have that kind of open dialogue with their friends. “I know,” he says. “It’s a rare thing.” Garfield in turn'''
author = "Ben Allen"
