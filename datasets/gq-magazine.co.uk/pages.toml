title = "Wanna crush a half-marathon and actually enjoy it? A definitive expert's take on how | British GQ"
description = "GQ's running pros lift the lid on the best way to prep for a cheeky 21.1 kilometre jog without losing the will to run"
full_description = '''FitnessWanna crush a half-marathon and actually enjoy it? A definitive expert's take on howGQ's running pros dish out tips on the best way to prep for a cheeky 21.1 kilometre jog without losing the will to runBy Olivia Vaile28 February 2025Orbon AlijaAll products are independently selected by our editors. If you buy something, we may earn an affiliate commission.Running a half-marathon hits something of a sweet spot. It says “I’ve got goals” while also accounting for “I still want to enjoy my weekends”, which is probably why it’s fast becoming the go-to distance for runners far and wide. It's long enough to push your limits without your body staging a full revolt safe in the knowledge you can cross the finish line without needing a hand walking the next day.That said, running 13.1 miles is no joke. Calling it a ‘half’ doesn’t mean it's half as impressive, just as signing up for one shouldn't mean you're obliged to run a full one someday (unless, you want to, of course).Whether it’s your first, or fiftieth, your happiness levels when crossing the finish line always rests on your training. So we’ve rounded up GQ’s running experts to arm you with all the tips and tricks that’ll have you hitting whatever goal you're comfortable setting yourself.Slow and steady wins the half-marathon trainingDon't let the time you're chasing dictate your training – think of it as a goal to achieve on the big day. Learning to run slow now will help you run faster when it counts.“Slow runs are the bedrock of training for any endurance event,” says Robert Brundish, an endurance coach who has an extensive racing CV from London Marathon category winner to top-10 global finishes in Ironmans.“The load on your body goes up exponentially as your pace goes up, so it's really important to do the majority of your training at any ‘easy’ pace to give your body a chance to absorb that training,” he explains, meaning you'll be able to sustain “harder for longer come race-day”.The easy, slow part here means “spending 80% of your entire training time in a lower aerobic endurance zone, which is basically your long, slow, ‘conversational’ pace training”.“Easy slow runs really help keep that injury risk down and the fatigue levels from soaring, meaning you can be more consistent with your running week-in week-out. Consistency is no.1.”Run as close to the full distance as you can in trainingUnlike a marathon, where it's advised not to run the full distance until race-day, half-marathon training lets you gradually build up to the big 13.1 and even run it before the actual event.You'll want to build up to it by working those miles into your total weekly mileage. Ian Groves, managing director of Training Station recommends running for roughly 25 miles a week (except for the first week). His weekly breakdown is as follows: “Do one longer run (between 10 and 13.1 miles), and three or four runs between three and six miles each.”If you are going to go the full 13.1 miles in a practice run, be mindful that you don't run your reserves dry: "You want to work on longer tempo intervals running as close to race pace, but be careful you don't actually run your race in training,” says Brundish.Focus on interval trainingHalf-marathon training is all about being smart, and running more is not always better. “Yes, at least one of your weekly runs should be long, but you can't run this much every day – it's not realistic. Adding shorter runs such as intervals or sprints will improve your pace and help you over the finish line.”Mixing up the distance of your runs is also highly encouraged by Emma Bond, running coach for Enertor: “Having shorter runs in the week gives your body more time to recover (between runs) and adapt to your training. This helps avoid injury and overtraining, while also benefiting mental recovery.”You might even consider sprinting sessions, too, as Bond says these will “improve speed and leg turnover”. She advises sessions of reps between 30 seconds and up to five minutes with 60-90 seconds rest.Design your training around your lifeCutting yourself some slack is just as important as getting through the training. “Never be too dogmatic with a training plan if it's not realistic around what else you've got going on in life,” says Brundish. “Each run is not a test to see how far or fast you can go on that given day. You're always better off training at 80-90% of your capacity for your entire training block rather than training at 100% for half of it and spending the other half injured. Your fitness is defined by the work you put in day-in day-out over weeks and months of training. Focus on the bigger picture.Practice heat trainingThe temperature swing between now and race day could throw a spanner in the works if you're not prepared, especially if you've signed up to do a race in a warmer country. “During a half-marathon, an athlete's core temperature can rise to levels not experienced in training. Without the necessary preparation, experiencing these elevated core temperatures on race day can degrade performance. It can also lead to dangerous overheating,” says Brian Maiorano, coach liason at CORE.The first step in heat training, Maiorano explains, is getting to know your body's core temperature, so you can better understand how it handles heat. He recommends wearing a discreet wearable to monitor it while you train.Step two is to put yourself in a sweat-inducing environment. Since a tropical escape may not be on the cards, you'll need to create these conditions on your own. “Run on a treadmill without the use of a fan or open windows, and if you don't have access to a treadmill then you can run outside, but will need to layer up to insulate the heat you create while running. Start slowly by adding on an extra layer or two of clothing. After you get used to the feeling of being hot and sweaty, add more layers,” says Terrence Mahon, another running coach at CORE (who has coached Olympic medalists and British Athletics BTW).“The goal with each heat session is to get in at least 40 minutes of work in the appropriate heat strain zone," he explains. And the best part, you don't actually have to spend the whole time running: “You can start it out on the treadmill and then when done, you can hop in a sauna, jacuzzi or do some circuit training.”Come race day, play it smart by beginning your cooling strategies early: “By the time you notice you're hot, it's too late to bring your core temperature down, so it's best to start taking measures to cool down the body at the start of a race.” Pouring water over your head and torso, or placing ice in your hat should do the trick.Master your running formDon't be that runner with sloppy technique. a) it's not a look and b) it's a fairly simple fix.“Tap into your natural elasticity,” says explains Steve Doidge-Harrison, award-winning PT and ultramarathon runner. “It's amazing how much more efficiently you can run if you capitalise on your body's natural ‘energy return’ as you foot lands." By this, he means: “Landing with your foot directly beneath you rather than in front, a gentle lean from your ankles, a tall posture and running with a cadence (foot strikes per minute) of between 175-185.” Practice makes perfect friends.Hit the gymA lot of runners recoil at the idea of strength training. But only pounding the pavement actually stunts your progress if you're not priming your leg muscles."[Strength training] improves your running economy, your fatigue resistance and most importantly, reduces your injury risk,” says Doidge-Harrison. What's more, “You don’t need to do any specialised exercises: squats, lunges, and calf raises should be your staple,” he adds.“Do at least two strength training workouts a week leading up to your half-marathon,” advises Groves. “Aim for 15 or more reps on each set because this is optimal to build muscular endurance.”Nourish your trainingPut fantasising about that perfectly greasy post-race burger to one side and tune your thoughts into loading your carbs pre-race. From day dot smart nutrition should become a priority. “Fuelling yourself properly before, during and after race day can significantly impact your performance and endurance," says Edward Mather, performance nutritionist at FuelHub. “Create a personalised nutrition plan that aligns with your training intensity. This should focus on gradually increasing carbohydrate and protein intake to support energy levels and muscle repair.”So, as your training intensifies, increase that intake. Over to Mather for his nutritional breakdown:In the run-up to race day: “Increase your carb intake to around 6-8 grams per kilogram of bodyweight to provide your body with a steady supply of fuel.” Up to you to do the maths.Pre race meal: “Aim to eat a light, digestible meal 2-3 hours before the race. Avoid heavy, fatty, or fibre-rich foods that might upset your stomach. Instead, opt for a balanced meal of carbohydrates, protein and healthy fats and drink plenty of water. Consume 500ml of fluid in the two hours before the start.”Intra-race: “As carbohydrate stores are relatively small, even after carbohydrate loading, these stores can become depleted after 2 hours of intense exercise. Therefore, consuming 30-60g of carbohydrates per hour in the form of energy gels, chews or sports drinks can help to top up glycogen stores and provide sustained energy. For a quick energy boost on the run, consider carrying dates in your running vest. They're a convenient and natural way to boost your energy levels on the go.”After the race: “Proper post-race recovery is crucial for replenishing energy stores, repairing muscle damage, and preparing your body for future physical activity. Within 30-60 minutes of finishing the race, aim to have a snack that includes plenty of carbohydrates and protein. While you may not feel hungry immediately after the race, it's important to eat a balanced meal within a few hours."For those fearing the nightmare of a dogey stomach, Emily English, BSC-qualified nutritionist and author of Live to Eat, shares that: "‘Runner’s gut’ digestive discomfort, cramping, or sudden urgency are often caused by eating too much fat or fibre too close to a run. These foods slow digestion, meaning they sit in the gut longer, increasing the risk of bloating or discomfort when you start moving."So, to steer clear of any unpleasantries mid-run, English has the scoop: “For runners with IBS or gut sensitivity, it's important to test pre-run meals, choosing low-fibre carbs like white rice, sourdough, or oats while limiting heavy. Proper hydration and electrolytes also help keep digestion running smoothly, preventing unnecessary discomfort on race day.”<img loading="lazy" alt="Image may contain: Cabinet, Furniture, Electrical Device, and Switch" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67b8697d217e3cc0c6302e86/3:4/w_748%2Cc_limit/2102-half-marathon-2.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67b8697d217e3cc0c6302e86/3:4/w_120,c_limit/2102-half-marathon-2.jpg 120w, https://media.gq-magazine.co.uk/photos/67b8697d217e3cc0c6302e86/3:4/w_240,c_limit/2102-half-marathon-2.jpg 240w, https://media.gq-magazine.co.uk/photos/67b8697d217e3cc0c6302e86/3:4/w_320,c_limit/2102-half-marathon-2.jpg 320w, https://media.gq-magazine.co.uk/photos/67b8697d217e3cc0c6302e86/3:4/w_640,c_limit/2102-half-marathon-2.jpg 640w" sizes="100vw"/>Epetõme Synbiotic Duo Cap£54.99 Epetõme“A strong microbiome supports efficient carbohydrate absorption, helping muscles access energy without causing GI distress. Epetōme’s synbiotic supplement delivers 50 billion live bacteria daily in a duo cap design, ensuring they reach the gut where they’re needed most.” -Emily English.Recognise when you're pushing too hardThere is a delicate balance between running through soreness and setting yourself up for an injury. Smart runners know the difference. “Intermittent, mild ache and niggles are very common when regularly running and trying to improve your fitness or speed. Often they can be managed with some simple adjustments to training, however, if you are ever unsure, you should seek the care of a medical professional,” says Quinn.Feeling too sore to run but don't want a dent in your schedule? “Use low impact cross-training, switching a session to the bike, cross trainer or pool will reduce the physical loads on all tissues in the lower limbs compared to running,” says Quinn, "and aim to match the time and intensity of the planned run.”And don't forget, planning a strategic sofa session isn't slacking – it's a crucial part getting back on track. “Being flexible with your plan and allowing additional recovery time can often be enough to allow minor issues to settle,” says Quinn. “Consider deload weeks during your training plan, too. These are weeks of reduced running volume and intensity to allow the body time to recover, adapt and reduce the risk of injury.”Ice baths, foam rolling, massages, cryotherapy and stretching are also all great methods of recovery. But Quinn doesn't sugarcoat it – without adequate sleep and nutrition, they're practically pointless. So, make those your top priority when you're feeling sore.Accept that a half-marathon is going to be tough“Think of it as an adventure than a race,” says Doidge-Harrison. “Your fellow competitors are more your travelling companions than your competition.”And if you need an extra pep in your step, Bond suggests challenging yourself to a shorter race: “Entering races in the lead up to the big day can give you confidence in your training. Going into a race with this knowledge is so motivating. 5k or 10k is perfect," says Bond.Harness the mindset that you can, and you will complete it. See you at the finish line.'''
