["https://gq-magazine.co.uk/article/charlie-cox-hype-interview-2025"]
title = "How Daredevil rescued Charlie Cox | British GQ"
description = "A decade after the Marvel series changed the actor’s life, the show is back (or as Disney+ has it, Born Again) prompting fans to once again ask: why isn’t Cox far more famous?"
full_description = 'GQ HypeHow Daredevil rescued Charlie CoxA decade after the Marvel series changed the actor’s life, the show is back (or as Disney+ has it, Born Again), prompting fans to once again ask: why isn’t Cox far more famous?By Oliver Franklin-WallisPhotography by Jeremy Liebman18 February 2025Jacket and jeans by Officine Générale. Vest by Dior. Shoes by Tod’s.Years ago, before he was cast as daredevil, Charlie Cox travelled to the Scottish Highlands to relearn how to be a man. “I had read this book about male archetypes, I think it’s called, King, Warrior, Magician, Lover,” Cox explains. The book, about building a healthier kind of masculinity, affected him so much that the actor signed up for a weekend men’s retreat in Inverness. “It was like, talks, poetry reading, dancing – getting in touch with parts of being a man that aren’t talked about much.”This was 2014, and Cox, like so many guys in their early thirties, was struggling with the gap between the life he’d once imagined and the more modest path he now found himself stumbling along. “My career had been chugging along OK. I had this quite big moment early on where I’d been the lead of a film, Stardust, and then the years after that had been barren,” Cox says. “Then there had been a rebuilding, and that had been a very humbling experience.”<img alt="Image may contain Charlie Cox Clothing Coat Jacket Accessories Sunglasses Adult Person Blazer Publication and Face" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67ab264dd9751e1f96129a1e/master/w_1600%2Cc_limit/image.png" srcSet="https://media.gq-magazine.co.uk/photos/67ab264dd9751e1f96129a1e/master/w_120,c_limit/image.png 120w, https://media.gq-magazine.co.uk/photos/67ab264dd9751e1f96129a1e/master/w_240,c_limit/image.png 240w, https://media.gq-magazine.co.uk/photos/67ab264dd9751e1f96129a1e/master/w_320,c_limit/image.png 320w, https://media.gq-magazine.co.uk/photos/67ab264dd9751e1f96129a1e/master/w_640,c_limit/image.png 640w, https://media.gq-magazine.co.uk/photos/67ab264dd9751e1f96129a1e/master/w_960,c_limit/image.png 960w, https://media.gq-magazine.co.uk/photos/67ab264dd9751e1f96129a1e/master/w_1280,c_limit/image.png 1280w, https://media.gq-magazine.co.uk/photos/67ab264dd9751e1f96129a1e/master/w_1600,c_limit/image.png 1600w" sizes="100vw"/>Jacket, jumper and trousers by Zegna. Sunglasses by Moscot. 2007’s Stardust had seemed like the dream gig for a young actor: playing the romantic lead in a big-budget fantasy adaptation, alongside a legend-filled cast that included Claire Danes, Michelle Pfeiffer, Robert De Niro, and Peter O’Toole. Today Matthew Vaughn’s film, with its earnestly camp Princess Bride energy has a cult fandom, particularly in Britain. But it received mixed reviews, underperformed at the US box office, and for Cox, work dried up overnight.“There would be months,” Cox says, when he wouldn’t work. Back then he was living in Los Angeles, spending most of his days hanging around with a group of fellow out-of-work actors that included a young Andrew Garfield, Eddie Redmayne, Jamie Dornan, and Robert Pattinson. Often the five friends found they were auditioning – and being rejected – for the same roles. “I remember me and a couple of my friends who were out of work used to use the expression ‘we can’t get arrested right now.’”Under the terms of his US visa, Cox says, he wasn’t allowed to wait tables or serve coffee like other unemployed actors. “I couldn’t make any money, at all. I couldn’t pay rent,” Cox says. As his friends went on to win Oscars and front billion-dollar franchises, Cox flitted from job to job, including a recurring role in HBO’s Boardwalk Empire, but eventually moved back to London, deflated, when a friend recommended the book. “It can sound probably quite trite, but I guess most people at a certain age start to question a bit more: what’s the point of all this? What’s of value to me? What should be of value to me?” Cox says. “You know, what kind of man do I want to grow into?”<img alt="Image may contain Charlie Cox Adult Person City Clothing Footwear Shoe Coat and Outdoors" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67ab27b40bce5f722cd01fd4/master/w_1600%2Cc_limit/Feb%252017%2520-%2520Charlie%2520Cox_Online3.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67ab27b40bce5f722cd01fd4/master/w_120,c_limit/Feb%2017%20-%20Charlie%20Cox_Online3.jpg 120w, https://media.gq-magazine.co.uk/photos/67ab27b40bce5f722cd01fd4/master/w_240,c_limit/Feb%2017%20-%20Charlie%20Cox_Online3.jpg 240w, https://media.gq-magazine.co.uk/photos/67ab27b40bce5f722cd01fd4/master/w_320,c_limit/Feb%2017%20-%20Charlie%20Cox_Online3.jpg 320w, https://media.gq-magazine.co.uk/photos/67ab27b40bce5f722cd01fd4/master/w_640,c_limit/Feb%2017%20-%20Charlie%20Cox_Online3.jpg 640w, https://media.gq-magazine.co.uk/photos/67ab27b40bce5f722cd01fd4/master/w_960,c_limit/Feb%2017%20-%20Charlie%20Cox_Online3.jpg 960w, https://media.gq-magazine.co.uk/photos/67ab27b40bce5f722cd01fd4/master/w_1280,c_limit/Feb%2017%20-%20Charlie%20Cox_Online3.jpg 1280w, https://media.gq-magazine.co.uk/photos/67ab27b40bce5f722cd01fd4/master/w_1600,c_limit/Feb%2017%20-%20Charlie%20Cox_Online3.jpg 1600w" sizes="100vw"/>For most of his life, Cox has been “a real people pleaser, approval seeker”. A stereotypical boarding school kid: polite, upbeat, never wanting to rock the boat. (He has, in life as on screen, a loveable, Golden Retriever energy.) Part of wanting to go on the retreat was, Cox says, “unlearning [that]. To become someone, ultimately, who is more authentic and less concerned with what other people think – more concerned about how I feel, about how I behave.”"For whatever reason, having had this kind of empowering experience, I said, ‘I will come, but I’m only reading for Matt, only for the lead.’"Shortly before travelling to Scotland, Cox had auditioned for a role in a new Netflix adaptation of Marvel’s Daredevil. Despite being an unlikely choice to play the crimefighting lawyer Matt Murdock (in the comics, Murdock is tall, redheaded, and – embarrassingly for Cox, who didn’t realise this at first – blind) the producers liked him, and that Friday night, in the hills outside Inverness, he got a call from his agent. “I heard them say, ‘we need you to come to Los Angeles to test.’” But, this being the Highlands, the line cut out. “I had a choice,” Cox says. “I could go back to the city and try and make a call, or call him Monday.” He was desperate, but he’d also committed to the retreat, so Cox stayed, and spent two days among strangers who had also felt the pull to examine, and perhaps try to alter, something fundamental in their lives.When he finally got a signal again that Sunday night, Cox had five new voicemail messages. The producers liked him – but for Foggy Nelson, Murdock’s best friend. “And for whatever reason, having had this kind of empowering experience, I said, ‘I will come, but I’m only reading for Matt. I’m only reading for the lead,’” Cox says.Cox isn’t naive: he knows it wasn’t just the retreat that eventually landed him Daredevil, a job that would come to change his life. There were countless other factors – not least his performance in the auditions and eventual screen tests. But he still wonders if the boost in self-confidence had something to do with it. After all, sometimes it’s hard for others to see something in you until you can see it in yourself.<img alt="Image may contain Charlie Cox Performer Person Solo Performance Adult Clothing Footwear and Shoe" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67ab26a70bce5f722cd01fd0/master/w_1600%2Cc_limit/Feb%252017%2520-%2520Charlie%2520Cox_Online6.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67ab26a70bce5f722cd01fd0/master/w_120,c_limit/Feb%2017%20-%20Charlie%20Cox_Online6.jpg 120w, https://media.gq-magazine.co.uk/photos/67ab26a70bce5f722cd01fd0/master/w_240,c_limit/Feb%2017%20-%20Charlie%20Cox_Online6.jpg 240w, https://media.gq-magazine.co.uk/photos/67ab26a70bce5f722cd01fd0/master/w_320,c_limit/Feb%2017%20-%20Charlie%20Cox_Online6.jpg 320w, https://media.gq-magazine.co.uk/photos/67ab26a70bce5f722cd01fd0/master/w_640,c_limit/Feb%2017%20-%20Charlie%20Cox_Online6.jpg 640w, https://media.gq-magazine.co.uk/photos/67ab26a70bce5f722cd01fd0/master/w_960,c_limit/Feb%2017%20-%20Charlie%20Cox_Online6.jpg 960w, https://media.gq-magazine.co.uk/photos/67ab26a70bce5f722cd01fd0/master/w_1280,c_limit/Feb%2017%20-%20Charlie%20Cox_Online6.jpg 1280w, https://media.gq-magazine.co.uk/photos/67ab26a70bce5f722cd01fd0/master/w_1600,c_limit/Feb%2017%20-%20Charlie%20Cox_Online6.jpg 1600w" sizes="100vw"/>T-shirt, trousers and shoes by Brunello Cucinelli. Eleven years have passed since that trip, and Cox is once again in the familiar position of preparing to play Daredevil. In March, Disney will release Daredevil: Born Again, the franchise’s long-awaited sort-of-reboot (it’s complicated). Although the release is a few months away when we meet, Cox is already preparing to shoot the second season, which explains why he’s in superhero mode when he slips into Mayfair’s Mount St Restaurant on this particularly sleepy betwixtmas day in December, all bulging biceps, rugged scruff, and eyes shining despite stepping off a red-eye from Australia only a few hours ago.Born Again has had a long and convoluted gestation. In 2018 Netflix cancelled Daredevil after three hit seasons and a run of MCU-lite spinoffs that culminated in 2017’s The Defenders. Cox was staying with a friend in London when he first heard. “I got a call late at night, and my boss at Marvel television at the time said, ‘they’ve pulled all the shows. All five of them,’” Cox recalls. “There was some… I don’t know, it was a conversation about the politics behind it all, some feud between Netflix and Disney. My bosses at Netflix and Marvel all called and were very nice, and very polite, but it was done.”In the months after its cancellation, Cox travelled, and booked a role in a West End play – Betrayal, opposite Tom Hiddleston and Zawe Ashton, which ran for about three months in London and another four on Broadway – while experiencing, for the second time in his life, the grief-like process that one goes through when the path you thought your life was on suddenly falls away.Daredevil had been more than a job. Cox met his wife, the producer Samantha Thomas, while they were working together on the first season; they now have two children. Many of the cast became close friends. And Cox himself had grown fiercely protective of Murdock, as fans had grown protective of him. His co-star Vincent D’Onofrio, who plays Wilson Fisk, insisted that the cancellation was temporary. (According to Variety, under the terms of the Netflix deal, Marvel and Disney were prohibited from using the characters for two years.) “He’d always say, ‘Oh, they’ll bring us back,” Cox says. “And I used to say to my wife, ‘He’s delusional. He’s got to move on.’”One day, Marvel chief Kevin Feige (who, as then-head of Marvel Studios, has said that he was not involved with TV projects) came to see Betrayal in New York. “I went to shake his hand, and he was nice and enjoyed the play, but never mentioned Daredevil, never mentioned me,” Cox says. “I thought maybe he’d at least say, ‘Oh, I liked the show,’ but he didn’t say that.”So when Feige called him, he says, one day during that eerie pandemic summer of 2020, Cox had zero expectations. “I thought it was maybe going to be a charity thing. Like, ‘Can we all get together and do some video,’” Cox says. “And then he said, ‘are you interested in coming back?”Though he wasn’t clear what he was signing up to (“they said, ‘it’s going to be something in Spider-Man, probably a cameo in She-Hulk, and then we’ll see”), Cox agreed. Even then, with the pandemic and various creative reshuffles at Marvel, Born Again didn’t start filming until early 2023.<img alt="Image may contain Charlie Cox Blazer Clothing Coat Jacket Person Standing Adult Architecture Building and House" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67ab274790829c3ab632af40/master/w_1600%2Cc_limit/Feb%252017%2520-%2520Charlie%2520Cox_Online5.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67ab274790829c3ab632af40/master/w_120,c_limit/Feb%2017%20-%20Charlie%20Cox_Online5.jpg 120w, https://media.gq-magazine.co.uk/photos/67ab274790829c3ab632af40/master/w_240,c_limit/Feb%2017%20-%20Charlie%20Cox_Online5.jpg 240w, https://media.gq-magazine.co.uk/photos/67ab274790829c3ab632af40/master/w_320,c_limit/Feb%2017%20-%20Charlie%20Cox_Online5.jpg 320w, https://media.gq-magazine.co.uk/photos/67ab274790829c3ab632af40/master/w_640,c_limit/Feb%2017%20-%20Charlie%20Cox_Online5.jpg 640w, https://media.gq-magazine.co.uk/photos/67ab274790829c3ab632af40/master/w_960,c_limit/Feb%2017%20-%20Charlie%20Cox_Online5.jpg 960w, https://media.gq-magazine.co.uk/photos/67ab274790829c3ab632af40/master/w_1280,c_limit/Feb%2017%20-%20Charlie%20Cox_Online5.jpg 1280w, https://media.gq-magazine.co.uk/photos/67ab274790829c3ab632af40/master/w_1600,c_limit/Feb%2017%20-%20Charlie%20Cox_Online5.jpg 1600w" sizes="100vw"/>Suit by Dolce & Gabbana. Shirt by Brunello Cucinelli. The new series was initially conceived as a clean break from the Netflix original, which, with its violent and more adult tone (exemplified by Cox’s simmering, guilt-wracked performance) stands out even now from Marvel’s typically CGI-heavy fare. “The thinking was, Well, we don’t want to do the same thing. We’ve done that,” Cox says. Although Cox and D’Onofrio both agreed to return, it was reported that the showrunners initially recast several other characters, drawing mixed reactions from fans. Cox, for his part, says that he started to have doubts early in production. “Vincent and I were both not 100 per cent convinced what we were doing at the time was the right path, but we’re both good soldiers and professionals, and we were trying to be open-minded.”In May 2023, with six episodes already largely shot, the Writers Guild Of America went on strike, halting production on the show. “The writers’ strike happened, then the actors’ strike, which gave the producers an opportunity to look at our episodes and decide that it wasn’t quite working,” Cox says. Once again, he got an ominous call from Marvel – this time to say that he wouldn’t be going back to work as planned."In a bizarre twist of fate, the strikes that were so terrible for so many people in the industry ended up being the best thing for our show."But rather than cancel the project, Marvel’s bosses replaced Born Again’s showrunners, Matt Corman and Chris Ord, with Dario Scardapane, who had worked on Netflix’s The Punisher. Scardapane, Cox says, reworked the series, adding three entirely new episodes, and wrote additional scenes to '
