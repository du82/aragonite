["https://gq-magazine.co.uk/article/joseph-quinn-dev-patel-paris-fashion-week-2025"]
title = "In Paris, Joseph Quinn and Dev Patel bro'd out in party boy suits | British GQ"
description = "The link-up the world needs right now"
full_description = '''FashionIn Paris, Joseph Quinn and Dev Patel bro'd out in party boy suitsThe link-up the world needs right nowBy Adam Cheung5 March 2025Victor Boyko/Getty ImagesOf course everyone looks good at Paris Fashion Week – after all, that's kinda the whole point. But last night, Joseph Quinn and Dev Patel showed up in two of the nicest suits we've seen in a while. The crazy part? This wasn't even a fashion show.Just before Le Grand Dîner du Louvre, which is basically a very intimate fundraising event that celebrates the new Louvre Couture exhibition, the British boys posed for some very cute photos together in two suits that work for a long dinner (and a loud afterparty).Quinn rocked a McQueen tux with shiny, fanged out lapels and buttons that were linked with a little silver chain. He layered this over a red shirt (with the top two buttons undone, of course, because this is Paris and thus a tiny bit sexy), and he finished with a pair of high-waisted, flared trousers.<img alt="Image may contain Dev Patel Andrey Gaydulyan Blazer Clothing Coat Jacket Formal Wear Suit Adult and Person" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c8303532567cafb9d65282/master/w_1600%2Cc_limit/2203316895" srcSet="https://media.gq-magazine.co.uk/photos/67c8303532567cafb9d65282/master/w_120,c_limit/2203316895 120w, https://media.gq-magazine.co.uk/photos/67c8303532567cafb9d65282/master/w_240,c_limit/2203316895 240w, https://media.gq-magazine.co.uk/photos/67c8303532567cafb9d65282/master/w_320,c_limit/2203316895 320w, https://media.gq-magazine.co.uk/photos/67c8303532567cafb9d65282/master/w_640,c_limit/2203316895 640w, https://media.gq-magazine.co.uk/photos/67c8303532567cafb9d65282/master/w_960,c_limit/2203316895 960w, https://media.gq-magazine.co.uk/photos/67c8303532567cafb9d65282/master/w_1280,c_limit/2203316895 1280w, https://media.gq-magazine.co.uk/photos/67c8303532567cafb9d65282/master/w_1600,c_limit/2203316895 1600w" sizes="100vw"/>Victor Boyko/Getty Images<img alt="Dev Patel gets to a good fit by “listening to his gut”" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67b31eca0960d7e64a0c127d/1:1/w_775%2Cc_limit/1702-DEV_PATEL_0873-copy.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67b31eca0960d7e64a0c127d/1:1/w_120,c_limit/1702-DEV_PATEL_0873-copy.jpg 120w, https://media.gq-magazine.co.uk/photos/67b31eca0960d7e64a0c127d/1:1/w_240,c_limit/1702-DEV_PATEL_0873-copy.jpg 240w, https://media.gq-magazine.co.uk/photos/67b31eca0960d7e64a0c127d/1:1/w_320,c_limit/1702-DEV_PATEL_0873-copy.jpg 320w, https://media.gq-magazine.co.uk/photos/67b31eca0960d7e64a0c127d/1:1/w_640,c_limit/1702-DEV_PATEL_0873-copy.jpg 640w" sizes="100vw"/>Dev Patel gets to a good fit by “listening to his gut”By Mahalia ChangWhile the Gladiator 2 star kept things nice and flowy, Patel's fit was lovely and cropped. If you feel like you've seen it somewhere before, that's probably because you have. Just last week, he was spotted in Milan wearing the exact same silhouette from Gucci, just in a different colourway. And honestly? There's absolutely nothing wrong with that. If something looks good on you and it fits well, you might as well wear it again and again (and again). Austin Butler does it with his Carhartt jackets and Justin Bieber with his furry Loewe boots. And listen, the world should do it for sustainable reasons, too.Plus, in this ultra-casual age, what could be better than a suit for a big night out? The Hollywood party boy has changed. He's smarter, smoother, and wants to make a semblance of effort that isn't full tuxedo regalia. That works for the Oscars, but less so a candlelight dinner in the 1st.Sure, both Joseph Quinn and Dev Patel are actors first and foremost, but they're also emerging as fashion's new guard in menswear that doesn't try too hard. Just a couple of bros chalking it up in good tailoring – the world is a nice place to be after all.'''
author = "Adam Cheung"
year_published = 2025
