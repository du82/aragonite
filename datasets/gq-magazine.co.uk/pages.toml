title = "Best Divan Beds 2025: Chosen by experts | British GQ"
description = "A stress-free storage option that helps you instantly de-clutter your bedroom, divan beds are one of the best options for both small and large spaces alike. Shop our pick of the best below."
full_description = '''ShoppingThe best divan beds, chosen by sleep & interiors expertsBy Ali Howard and Daphne Bugler 3 March 2025A stress-free storage option that helps you instantly de-clutter your bedroom, divan beds are one of the best options for both small and large spaces alike. Shop our pick of the best belowAll products are independently selected by our editors. If you buy something, we may earn an affiliate commission.If you appreciate a clean, contemporary line in the bedroom and are currently shopping for a new bed frame, the best divan bed frames will likely catch your eye when you're browsing. More often than not the choice of hotels – including some of the world’s finest – there’s every reason why this classic boxy bed appeals, including the fact that they’re among the best cheap bed frames on the market. Its surface perfectly supports the best mattress with no interruption to the overall silhouette, unlike a traditional slatted bed frame. Divans typically come in two parts and with nifty castors, allowing you to manoeuvre it into place without the backache. And talking of backache, this particular style of bed can incorporate pocket springs that respond to your body’s movement while you’re giving it z’s, essentially acting as an extension of your mattress for added support.With a wealth of sumptuous and design-led headboards on offer, a simple divan also offers the flexibility of choosing a bed head to suit your taste and space. That said, most bed brands will give you the option of a headboard perfectly matched to your divan’s upholstery fabric, and there’s everything to be said for the chic, monochrome look.Of course, a calm and clutter-free bedroom starts with proper storage, and this is where a divan really comes into its own. Most models will come with the option of integrated drawers that are both inconspicuous and generous in their storage capacity, and the best ones simply glide in and out without any tension. If you have a lot of stuff to store, it’s worth considering one of the best ottoman beds that opens up, mattress and all, from the side or the foot of the bed to give you the entire interior to chuck in your clutter and nobody will know it’s there. We do love a means to maximise on storage.What's in GQ's guide to the best divan beds frame?AccordionItemContainerButtonLargeChevronWhich divan beds are the best?Best divan bed with extra depth: Heal’s deep divan bedBest divan bed for versatile storage: Nectar luxury plus divan bedThe best divan beds at a glanceCan a divan bed accommodate different kinds of mattresses?Are divan beds suitable for people with back issues?How do I attach a headboard to my divan bed?How we chose and tested the best divan bed frames?How we choose and test the best divan bed frames?Your bed frame is an important part of your bedroom – it can really make or break the vibe in your space and it's the first step to building a supportive, comfortable sleeping environment - so we've taken our recommendations below very seriously. We only include brands whose bed frames we know and trust, whether that means we, or another member of the GQ team has tried and tested one of the frames in their own home, or that we've been to a showroom or a furniture store to test them out that way. This means we can get a sense of what the upholstery or fabrics might look like in real life, check they can hold weight well, and generally just look at the quality and value for money of the product before we include it below. We also understand that our readers are all after different styles and have varying budgets, so we've tried to include something for everyone below, paying close attention to forums like MoneySavingExpert and Reddit to see what's most important to all of the divan bed shoppers out there.<img alt="Image may contain Clothing Footwear Shoe Indoors Interior Design Furniture Bed Home Decor Rug and Electronics" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/6756d69f1f291cf8dbf8cb42/master/w_1600%2Cc_limit/MP-05.jpg" srcSet="https://media.gq-magazine.co.uk/photos/6756d69f1f291cf8dbf8cb42/master/w_120,c_limit/MP-05.jpg 120w, https://media.gq-magazine.co.uk/photos/6756d69f1f291cf8dbf8cb42/master/w_240,c_limit/MP-05.jpg 240w, https://media.gq-magazine.co.uk/photos/6756d69f1f291cf8dbf8cb42/master/w_320,c_limit/MP-05.jpg 320w, https://media.gq-magazine.co.uk/photos/6756d69f1f291cf8dbf8cb42/master/w_640,c_limit/MP-05.jpg 640w, https://media.gq-magazine.co.uk/photos/6756d69f1f291cf8dbf8cb42/master/w_960,c_limit/MP-05.jpg 960w, https://media.gq-magazine.co.uk/photos/6756d69f1f291cf8dbf8cb42/master/w_1280,c_limit/MP-05.jpg 1280w, https://media.gq-magazine.co.uk/photos/6756d69f1f291cf8dbf8cb42/master/w_1600,c_limit/MP-05.jpg 1600w" sizes="100vw"/>Emma Ottoman Bed <img alt="Image may contain Indoors Interior Design Furniture Plant Bed Book and Publication" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/6756d6a243b312001f0a8356/master/w_1600%2Cc_limit/MP-25.jpg" srcSet="https://media.gq-magazine.co.uk/photos/6756d6a243b312001f0a8356/master/w_120,c_limit/MP-25.jpg 120w, https://media.gq-magazine.co.uk/photos/6756d6a243b312001f0a8356/master/w_240,c_limit/MP-25.jpg 240w, https://media.gq-magazine.co.uk/photos/6756d6a243b312001f0a8356/master/w_320,c_limit/MP-25.jpg 320w, https://media.gq-magazine.co.uk/photos/6756d6a243b312001f0a8356/master/w_640,c_limit/MP-25.jpg 640w, https://media.gq-magazine.co.uk/photos/6756d6a243b312001f0a8356/master/w_960,c_limit/MP-25.jpg 960w, https://media.gq-magazine.co.uk/photos/6756d6a243b312001f0a8356/master/w_1280,c_limit/MP-25.jpg 1280w, https://media.gq-magazine.co.uk/photos/6756d6a243b312001f0a8356/master/w_1600,c_limit/MP-25.jpg 1600w" sizes="100vw"/>Emma Divan Bed We tested a range of storage beds to find the best ones worth recommending below.Our team and why you can trust usOur guide to the best divan bed frames has been compiled by our GQ Recommends Interiors team, overseen by GQ’s Senior Commerce Writer Daphne Bugler who has five years of experience writing about everything from mattresses and sofas to celebrity homes and the latest trends in furniture, all of which has given her a wide-ranging knowledge and expertise over what makes for a good furniture investment.We’ve also spoken to experts and attended many a store, showroom and pop-up to get a good sense of what our favourite brands and designers are producing so we only recommend the very best. And once we've chosen our favourites, we've consulted online forums like Reddit's r/BuyItForLife to get a sense of customer opinion too. Of course, there’s still a good range in our guide, with options for every budget and style as well.Nectar Luxury Divan Bed<source media="(max-width: 767px)" srcSet="https://media.gq-magazine.co.uk/photos/65549a0124751a06c3102beb/3:4/w_120%2Cc_limit/Divan-bed_Nectar.jpg 120w, https://media.gq-magazine.co.uk/photos/65549a0124751a06c3102beb/3:4/w_240%2Cc_limit/Divan-bed_Nectar.jpg 240w, https://media.gq-magazine.co.uk/photos/65549a0124751a06c3102beb/3:4/w_320%2Cc_limit/Divan-bed_Nectar.jpg 320w, https://media.gq-magazine.co.uk/photos/65549a0124751a06c3102beb/3:4/w_640%2Cc_limit/Divan-bed_Nectar.jpg 640w, https://media.gq-magazine.co.uk/photos/65549a0124751a06c3102beb/3:4/w_800%2Cc_limit/Divan-bed_Nectar.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.gq-magazine.co.uk/photos/65549a0124751a06c3102beb/3:4/w_320%2Cc_limit/Divan-bed_Nectar.jpg 320w, https://media.gq-magazine.co.uk/photos/65549a0124751a06c3102beb/3:4/w_640%2Cc_limit/Divan-bed_Nectar.jpg 640w, https://media.gq-magazine.co.uk/photos/65549a0124751a06c3102beb/3:4/w_960%2Cc_limit/Divan-bed_Nectar.jpg 960w, https://media.gq-magazine.co.uk/photos/65549a0124751a06c3102beb/3:4/w_1280%2Cc_limit/Divan-bed_Nectar.jpg 1280w, https://media.gq-magazine.co.uk/photos/65549a0124751a06c3102beb/3:4/w_1600%2Cc_limit/Divan-bed_Nectar.jpg 1600w, https://media.gq-magazine.co.uk/photos/65549a0124751a06c3102beb/3:4/w_1920%2Cc_limit/Divan-bed_Nectar.jpg 1920w, https://media.gq-magazine.co.uk/photos/65549a0124751a06c3102beb/3:4/w_2240%2Cc_limit/Divan-bed_Nectar.jpg 2240w, https://media.gq-magazine.co.uk/photos/65549a0124751a06c3102beb/3:4/w_2580%2Cc_limit/Divan-bed_Nectar.jpg 2580w" sizes="100vw"/><img loading="lazy" alt="" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/65549a0124751a06c3102beb/3:4/w_320%2Cc_limit/Divan-bed_Nectar.jpg"/>1/11NectarLuxury Divan Bed£1,250 £562.50 NectarReasons to buy: Sustainably made, includes plush headboard, exudes modern glamourSizes: Double, King, Super KingStorage options: 2 or 4 drawers, ottoman side, ottoman frontGuarantee: 1 yearThis plush divan bed comes complete with a buttoned floor-standing headboard that hints at the traditional yet keeps to the clean lines of contemporary design. The headboard feels luxuriously tall and is padded for bedtime reading comfort. Scoring points on sustainability, the bed is crafted from FSC-certified timber, while the all-over upholstery fabric, in charcoal, taupe or silver, is equal parts luxe and durable. Storage-wise, this one boasts a choice of two or four deep drawers, as well as two ottoman options: the classic foot-end opening, or the side-opening, which is a no-brainer for tight spaces like loft conversions with slanting ceilings.Pros & ConsAccordionItemContainerButtonLargeChevronProsSustainably madePlush headboardConsOnly a one-year guaranteeSimba Didsbury Bed frame<source media="(max-width: 767px)" srcSet="https://media.gq-magazine.co.uk/photos/67c5d49efc2290afc718f6d1/3:4/w_120%2Cc_limit/Simba-didsbury.jpg 120w, https://media.gq-magazine.co.uk/photos/67c5d49efc2290afc718f6d1/3:4/w_240%2Cc_limit/Simba-didsbury.jpg 240w, https://media.gq-magazine.co.uk/photos/67c5d49efc2290afc718f6d1/3:4/w_320%2Cc_limit/Simba-didsbury.jpg 320w, https://media.gq-magazine.co.uk/photos/67c5d49efc2290afc718f6d1/3:4/w_640%2Cc_limit/Simba-didsbury.jpg 640w, https://media.gq-magazine.co.uk/photos/67c5d49efc2290afc718f6d1/3:4/w_800%2Cc_limit/Simba-didsbury.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.gq-magazine.co.uk/photos/67c5d49efc2290afc718f6d1/3:4/w_320%2Cc_limit/Simba-didsbury.jpg 320w, https://media.gq-magazine.co.uk/photos/67c5d49efc2290afc718f6d1/3:4/w_640%2Cc_limit/Simba-didsbury.jpg 640w, https://media.gq-magazine.co.uk/photos/67c5d49efc2290afc718f6d1/3:4/w_960%2Cc_limit/Simba-didsbury.jpg 960w, https://media.gq-magazine.co.uk/photos/67c5d49efc2290afc718f6d1/3:4/w_1280%2Cc_limit/Simba-didsbury.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c5d49efc2290afc718f6d1/3:4/w_1600%2Cc_limit/Simba-didsbury.jpg 1600w, https://media.gq-magazine.co.uk/photos/67c5d49efc2290afc718f6d1/3:4/w_1920%2Cc_limit/Simba-didsbury.jpg 1920w, https://media.gq-magazine.co.uk/photos/67c5d49efc2290afc718f6d1/3:4/w_2240%2Cc_limit/Simba-didsbury.jpg 2240w, https://media.gq-magazine.co.uk/photos/67c5d49efc2290afc718f6d1/3:4/w_2580%2Cc_limit/Simba-didsbury.jpg 2580w" sizes="100vw"/><img loading="lazy" alt="Image may contain Furniture and Bed" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c5d49efc2290afc718f6d1/3:4/w_320%2Cc_limit/Simba-didsbury.jpg"/>2/11SimbaDidsbury Bed frame £1,169 SimbaReasons to buy: Available in 34 colours with a range of customisation options, including 5 drawer configurationsSizes: Single, Double, King, Super KingStorage options: No storage, 2 drawer, 4 drawer, ottoman or electric ottomanGuarantee: 10 yearSimba is one of those brands that we recommend time and time again because its products really are just that good. The mattresses have never failed us (we’re Hybrid Pro stans for life), the duvets have somehow kept us warm throughout whatever dreary winter we’ve just been through, and the bed frames are no different. Specifically, our tried and tested Didsbury.Starting with the obvious, this bed frame has some of the most impressive height we’ve found. We’re not against smaller headboards, of course, but when you see a tall one done this well it’s hard to think why you’d ever want anything else. The tufted quilting and upholstery feel luxurious with a premium feel, while the narrow frame adds barely extra width on the side of the mattress, making it suitable for compact spaces. As always, we’re looking for good customisation options, and the Didsbury not only has 34 colours to choose from in velvet, linen, chenille and flat-weave fabrics but also comes with five different storage configurations. We’d suggest a four-drawer or ottoman if you really want to maximise space.Read our full review of the Simba Didsbury bed frame reviewPros & ConsAccordionItemContainerButtonLargeChevronProsAvailable in multiple configurationsA range of different customisation optionsConsVery tall headboard can be tricky if you have anything hanging on the wallDusk Cheshire Ottoman Bed<source media="(max-width: 767px)" srcSet="https://media.gq-magazine.co.uk/photos/67b720d754558437b2f313c6/3:4/w_120%2Cc_limit/NewYork_Loft_Ottoman-storage-bed-.jpg 120w, https://media.gq-magazine.co.uk/photos/67b720d754558437b2f313c6/3:4/w_240%2Cc_limit/NewYork_Loft_Ottoman-storage-bed-.jpg 240w, https://media.gq-magazine.co.uk/photos/67b720d754558437b2f313c6/3:4/w_320%2Cc_limit/NewYork_Loft_Ottoman-storage-bed-.jpg 320w, https://media.gq-magazine.co.uk/photos/67b720d754558437b2f313c6/3:4/w_640%2Cc_limit/NewYork_Loft_Ottoman-storage-bed-.jpg 640w, https://media.gq-magazine.co.uk/photos/67b720d754558437b2f313c6/3:4/w_800%2Cc_limit/NewYork_Loft_Ottoman-storage-bed-.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.gq-magazine.co.uk/photos/67b720d754558437b2f313c6/3:4/w_320%2Cc_limit/NewYork_Loft_Ottoman-storage-bed-.jpg 320w, https://media.gq-magazine.co.uk/photos/67b720d754558437b2f313c6/3:4/w_640%2Cc_limit/NewYork_Loft_Ottoman-storage-bed-.jpg 640w, https://media.gq-magazine.co.uk/photos/67b720d754558437b2f313c6/3:4/w_960%2Cc_limit/NewYork_Loft_Ottoman-storage-bed-.jpg 960w, https://media.gq-magazine.co.uk/photos/67b720d754558437b2f313c6/3:4/w_1280%2Cc_limit/NewYork_Loft_Ottoman-storage-bed-.jpg 1280w, https://media.gq-magazine.co.uk/photos/67b720d754558437b2f313c6/3:4/w_1600%2Cc_limit/NewYork_Loft_Ottoman-storage-bed-.jpg 1600w, https://media.gq-magazine.co.uk/photos/67b720d754558437b2f313c6/3:4/w_1920%2Cc_limit/NewYork_Loft_Ottoman-storage-bed-.jpg 1920w, https://media.gq-magazine.co.uk/photos/67b720d754558437b2f313c6/3:4/w_2240%2Cc_limit/NewYork_Loft_Ottoman-storage-bed-.jpg 2240w, https://media.gq-magazine.co.uk/photos/67b720d754558437b2f313c6/3:4/w_2580%2Cc_limit/NewYork_Loft_Ottoman-storage-bed-.jpg 2580w" sizes="100vw"/><img loading="lazy" alt="Image may contain Furniture and Bed" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="ht'''
