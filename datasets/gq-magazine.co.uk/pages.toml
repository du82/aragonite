["https://gq-magazine.co.uk/article/the-sims-adhd"]
title = "How The Sims helped me understand my ADHD | British GQ"
description = "First released 25 years ago, the bestselling life sim has been a life-long timesuck for writer Hannah Strong. But her recent ADHD diagnosis has made her think about her fixation with the franchise differently"
full_description = '''CultureHow The Sims helped me understand my ADHDFirst released 25 years ago, the bestselling life sim has been a life-long timesuck for writer Hannah Strong. But her recent ADHD diagnosis has made her think about her fixation with the franchise differentlyBy Hannah Strong5 March 2025In the dog days of last summer, sitting at my desk on a Zoom call, a doctor named Jesus told me what I had suspected for some time: I had ADHD. This did not come as a surprise. I had long wondered if my various personality ‘quirks’ – chiefly among them hyperfixation, poor time management, a short attention span and emotional dysregulation – might actually be symptoms of a neurological disorder, and my younger sister was diagnosed with ADHD when she was seven years old.<img alt="Here’s how to dress your Sims more stylishly" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/5e860475013fff000829dd49/1:1/w_775%2Cc_limit/20200402-sims-12.jpg" srcSet="https://media.gq-magazine.co.uk/photos/5e860475013fff000829dd49/1:1/w_120,c_limit/20200402-sims-12.jpg 120w, https://media.gq-magazine.co.uk/photos/5e860475013fff000829dd49/1:1/w_240,c_limit/20200402-sims-12.jpg 240w, https://media.gq-magazine.co.uk/photos/5e860475013fff000829dd49/1:1/w_320,c_limit/20200402-sims-12.jpg 320w, https://media.gq-magazine.co.uk/photos/5e860475013fff000829dd49/1:1/w_640,c_limit/20200402-sims-12.jpg 640w" sizes="100vw"/>FashionHere’s how to dress your Sims more stylishlyBy Angelo MitakosEven so, it was strange to be 31 years old when I finally received my own diagnosis. It was like suddenly noticing a new room in the house you’ve lived in your entire life: I began to retrace my steps, curious if the signs had been there all along. Was my childhood obsession with Neo from The Matrix symptomatic of a neurodiverse mind? And what about the compulsive nail-biting I’ve battled for as long as I’ve had teeth? I’ve cycled through enough hyperfixations to last a lifetime, but of all the pop culture flotsam that has held my attention for longer than five minutes, I have always returned to one constant: The Sims.I started playing The Sims in 2002, after seeing an advert online for the Unleashed expansion pack, which added furry friends to the roster of purchasable home additions. I became, fittingly, a dog with a bone.“You can make people and they can have pets,” I enthused to my bewildered mother.“You have a gerbil,” she reminded me.“That’s not the same!” I groaned.And it wasn’t. I got The Sims for my 11th birthday, and it soon became my favourite thing in the world. I could spend entire evenings — and weekends, and holidays — happily playing God, creating families and designing homes for them. I became engrossed in their petty drama: in matchmaking, helping them advance in their career paths, creating my own little storylines. And yes, removing the pool ladder to punish the Sims that had attracted my ire.My love of The Sims persevered over the years, right through to The Sims 4. I'll still happily spend upwards of four hours perfecting a mid-century modern two-bedroom home for a newlywed couple, and will lose an entire Sunday to seeing through entire generations of a family line from cradle to grave.<img alt="Image may contain Adult Person Lamp Indoors Interior Design and Kitchen" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c5e40146c14ba6fc07b954/master/w_1600%2Cc_limit/0303-Sims43.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c5e40146c14ba6fc07b954/master/w_120,c_limit/0303-Sims43.jpg 120w, https://media.gq-magazine.co.uk/photos/67c5e40146c14ba6fc07b954/master/w_240,c_limit/0303-Sims43.jpg 240w, https://media.gq-magazine.co.uk/photos/67c5e40146c14ba6fc07b954/master/w_320,c_limit/0303-Sims43.jpg 320w, https://media.gq-magazine.co.uk/photos/67c5e40146c14ba6fc07b954/master/w_640,c_limit/0303-Sims43.jpg 640w, https://media.gq-magazine.co.uk/photos/67c5e40146c14ba6fc07b954/master/w_960,c_limit/0303-Sims43.jpg 960w, https://media.gq-magazine.co.uk/photos/67c5e40146c14ba6fc07b954/master/w_1280,c_limit/0303-Sims43.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c5e40146c14ba6fc07b954/master/w_1600,c_limit/0303-Sims43.jpg 1600w" sizes="100vw"/>No game has ever held my attention like it. Such is why, in light of my ADHD diagnosis, I suspected there might be some neurological reason the series appeals to me so much. In an effort to better understand this, I turned to Dr. Rachel Kowert, who specialises in the psychology of video games with her production studio Psychgeist. “The Sims is like life with instructions,” Rachel says. “Playing the game, you learn that ‘If I do this thing, then I am rewarded because now my Sim is in a good mood or now my Sim is getting their promotion.’ I think the clear objectives, and very visual feedback is probably a strong component of it.”Struggling to stay on task without clear instructions and tangible goals is a common symptom of ADHD, and certainly one I’ve had to battle against all my life. Furthermore, for someone with impulse control issues, playing The Sims is a less destructive pastime than others I’ve entertained. If the urge ever strikes to do a bit of DIY, I can renovate and decorate in the game to my heart’s content — which is significantly less hazardous to my rent deposit than going ham on my flat with a can of Dulux. And as much as their short attention spans might frustrate me, I can’t help but see myself in the Sims who start cooking dinner, get distracted, and wander off to do something else, leaving their pasta languishing in a pot of cold water for six hours.In our conversation, Kowert brought up something else I hadn’t considered: how The Sims may have covertly taught me about emotional dysregulation, which is an ADHD symptom whereby one struggles to control and regulate their emotions, leading to extreme mood swings or inappropriate reactions.“In The Sims, you have all those little status bars explaining your Sims’ different needs, and you can really see how one impacts the other,” she explains. “I think that might be one of the reasons the game resonates with people who experience dysregulation in their daily lives – it helps them to better understand how all of these emotional and physical elements of life work together.” I told Kowert I’d never thought of it like that, but it’s entirely plausible that watching my Sims go about their highly volatile day-to-day lives with full oversight on their hunger, tiredness, social battery and hygiene has subconsciously aided my own ability to regulate my mood and basic needs.I have come to understand the world around me a little differently since my diagnosis. I’m under no illusion that everything in my life can be ascribed to my ADHD, but it’s certainly helped provide a framework for my own thought patterns, habits and interests – none more so than The Sims. For 23 years now, almost the entirety of The Sims’ 25-year history, the franchise has been my electronic comfort blanket, expanding in size but always reassuringly familiar.In the safety of The Sims, I am able to impersonate a person capable of keeping her life together. Remarkably, it seems this goofy, enduring game has helped me learn how to do that in real life.'''
