title = "Best Mother’s Day gifts 2025: Oil diffusers to pyjamas | British GQ"
description = "Mother’s Day is fast-approaching, but worry not. Everything she’s after is listed right here."
full_description = '''LifestyleThe best Mother’s Day gifts for the world's greatest mumBy Jessie Atkinson3 March 2025Mother’s Day is fast-approaching, but worry not: everything she’s after is listed right hereAll products are independently selected by our editors. If you buy something, we may earn an affiliate commission.The powers that be have dictated that you don't need to start worrying about the best Mother's Day gifts until a little later in 2025. This year, the national celebration falls on 30 March, meaning you've got more time to think about the best gifts for mum… so long as you're reading this before, say, 28 March, that is.Think of this as your opportunity to get your gift in order with plenty of days to spare: most brands have already launched their mum-centric lines, meaning that you should have an easy time of it. In this guide — one of 25+ I (Jessie Atkinson) look after for British GQ — I've listed the best of what's on offer, from classics like chocolates and jewellery to more unusual products such as a diffuser for the car or a jug shaped like a fish (both very popular options, FYI). I hope you find something that your mum will love — chances are she more than deserves it.Best OverallBest AffordableBest HomewareBest Beauty & StyleBest for the Mum Who Has EverythingWhat are GQ's best Mother's Day gifts…Best overall Mother's Day gift: The White Company cashmere sock, £38 at thewhitecompany.comBest affordable Mother's Day gift: Anna + Nina ‘Good Morning’ plate, £20 at fenwick.co.ukBest homeware Mother's Day gift: Le Creuset stoneware heart mug & saucer, £45 at lecreuset.co.ukBest jewellery Mother's Day gift: Tiffany & Co. mum pendant necklace, £200 at tiffany.co.ukBest beauty Mother's Day gift: Beautifect makeup box, £279 at beautifect.comBest style Mother's Day gift: Lulu Guinness wool scarf, £70 at luluguinness.comHow I chose the best Mother's Day giftsAs part of my role as senior commerce writer at British GQ, I look after more than 20 gift guides including everything from the best gifts for her to the best tech gifts. For all of these articles, I spend a healthy portion of time sorting through press releases, attending product launches and trying and testing things at home in order to work out what — small and large — is actually worth your money. I also rely on my fellow colleagues' recommendations (and leave out anything they think is a dud), as well as assessments from, to give one relevant example, my own mum. Everything in this guide has been either tested by me or someone I know, is made by a brand GQ has worked with and trusts, and/or has excellent customer reviews.Shop the best gifts for Mother's Day in 2025 below…Best overall Mother's Day giftsIf we're talking the big picture — and with this section, I am — it's important to remember that what your mum probably wants most of all is to a) spend time with you, and b) feel like you appreciate her. You don't need to buy something to achieve either of these things: in fact, it's more important for you to book in to visit her. That being said, it'll definitely help with the appreciation part of things if you've been thoughtful enough to buy her something you think she'll really like. Here are some of your best options on that front.<img loading="lazy" alt="The White Company cashmere bed sock" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67488818c4d30901fb3cff6e/3:4/w_748%2Cc_limit/The-White-Company-cashmere-bed-sock.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67488818c4d30901fb3cff6e/3:4/w_120,c_limit/The-White-Company-cashmere-bed-sock.jpg 120w, https://media.gq-magazine.co.uk/photos/67488818c4d30901fb3cff6e/3:4/w_240,c_limit/The-White-Company-cashmere-bed-sock.jpg 240w, https://media.gq-magazine.co.uk/photos/67488818c4d30901fb3cff6e/3:4/w_320,c_limit/The-White-Company-cashmere-bed-sock.jpg 320w, https://media.gq-magazine.co.uk/photos/67488818c4d30901fb3cff6e/3:4/w_640,c_limit/The-White-Company-cashmere-bed-sock.jpg 640w" sizes="100vw"/>The White CompanyCashmere Bed Socks£38 The White CompanyWould this Mother's Day gift guide even be a Mother's Day gift guide if there wasn't a smattering of cashmere goodies included? I don't think so — and nor does The White Company. <img loading="lazy" alt="Image may contain: Clothing, Long Sleeve, Sleeve, Knitwear, Sweater, and Sweatshirt" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67bc8f15440230e3765d40ac/3:4/w_748%2Cc_limit/Best-Mother%25E2%2580%2599s-Day-Gifts-M&amp;S-Cashmere-Jumper.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67bc8f15440230e3765d40ac/3:4/w_120,c_limit/Best-Mother%E2%80%99s-Day-Gifts-M&amp;S-Cashmere-Jumper.jpg 120w, https://media.gq-magazine.co.uk/photos/67bc8f15440230e3765d40ac/3:4/w_240,c_limit/Best-Mother%E2%80%99s-Day-Gifts-M&amp;S-Cashmere-Jumper.jpg 240w, https://media.gq-magazine.co.uk/photos/67bc8f15440230e3765d40ac/3:4/w_320,c_limit/Best-Mother%E2%80%99s-Day-Gifts-M&amp;S-Cashmere-Jumper.jpg 320w, https://media.gq-magazine.co.uk/photos/67bc8f15440230e3765d40ac/3:4/w_640,c_limit/Best-Mother%E2%80%99s-Day-Gifts-M&amp;S-Cashmere-Jumper.jpg 640w" sizes="100vw"/>Marks & SpencerCashmere Jumper£89 M&SThe most affordable pure cashmere you can buy — in 21 choices of colour, no less. <img loading="lazy" alt="" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/655f652ae8ffd679cbb293cc/3:4/w_748%2Cc_limit/GiftsForMum_Charlotte-Tilbury-Magic-Cream.jpg" srcSet="https://media.gq-magazine.co.uk/photos/655f652ae8ffd679cbb293cc/3:4/w_120,c_limit/GiftsForMum_Charlotte-Tilbury-Magic-Cream.jpg 120w, https://media.gq-magazine.co.uk/photos/655f652ae8ffd679cbb293cc/3:4/w_240,c_limit/GiftsForMum_Charlotte-Tilbury-Magic-Cream.jpg 240w, https://media.gq-magazine.co.uk/photos/655f652ae8ffd679cbb293cc/3:4/w_320,c_limit/GiftsForMum_Charlotte-Tilbury-Magic-Cream.jpg 320w, https://media.gq-magazine.co.uk/photos/655f652ae8ffd679cbb293cc/3:4/w_640,c_limit/GiftsForMum_Charlotte-Tilbury-Magic-Cream.jpg 640w" sizes="100vw"/>Charlotte TilburyMagic Cream Moisturiser£79 Charlotte TilburyYou may not know much about moisturiser beyond which one you favour, so trust me on this: Charlotte Tilbury's ‘Magic Cream’ is worth the spend. <img loading="lazy" alt="Image may contain: Accessories, Jewelry, Necklace, Pendant, and Locket" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/65ddc982f046b67ee92aec34/3:4/w_748%2Cc_limit/Gifts-for-Mums-10.jpg" srcSet="https://media.gq-magazine.co.uk/photos/65ddc982f046b67ee92aec34/3:4/w_120,c_limit/Gifts-for-Mums-10.jpg 120w, https://media.gq-magazine.co.uk/photos/65ddc982f046b67ee92aec34/3:4/w_240,c_limit/Gifts-for-Mums-10.jpg 240w, https://media.gq-magazine.co.uk/photos/65ddc982f046b67ee92aec34/3:4/w_320,c_limit/Gifts-for-Mums-10.jpg 320w, https://media.gq-magazine.co.uk/photos/65ddc982f046b67ee92aec34/3:4/w_640,c_limit/Gifts-for-Mums-10.jpg 640w" sizes="100vw"/>Tiffany & Co.Mum Pendant Necklace£200 TiffanyNow especially engraved for Mother’s Day: the iconic Tiffany heart tag pendant inspired by archival brand price tags and worn by classic dressers the world over. <img loading="lazy" alt="Best Hampers as chosen for British GQ by Jessie Atkinson M&amp;S Afternoon Tea Letterbox" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/66f53fe3170dc1faaac5f347/3:4/w_748%2Cc_limit/Best-Hampers-as-chosen-for-British-GQ-by-Jessie-Atkinson-M&amp;S-Afternoon-Tea-Letterbox.jpg" srcSet="https://media.gq-magazine.co.uk/photos/66f53fe3170dc1faaac5f347/3:4/w_120,c_limit/Best-Hampers-as-chosen-for-British-GQ-by-Jessie-Atkinson-M&amp;S-Afternoon-Tea-Letterbox.jpg 120w, https://media.gq-magazine.co.uk/photos/66f53fe3170dc1faaac5f347/3:4/w_240,c_limit/Best-Hampers-as-chosen-for-British-GQ-by-Jess