title = "Best linen shirts for men 2025: Percival to Drake's | British GQ"
description = "Easier and breezier than anything else you’ll be wearing this summer, a good linen shirt will keep things cool and comfortable while the sun’s out."
full_description = '''FashionThe best linen shirts to make styling a breezeBy Heidi Quill, Faye Fearon and Jessie Atkinson4 March 2025Easier and breezier than anything else in your wardrobe, a good linen shirt will keep things casual, cool and comfortable while the sun’s outAll products are independently selected by our editors. If you buy something, we may earn an affiliate commission.Nothing is as smart as an Oxford button-up and as lightweight as one of the best T-shirts for men... right? You’ll never be happier to be wrong: the best linen shirts for men are both of these things and so much more: more breathable than a tee; just as dressed up as an Oxford. In the first blush of warm weather, nothing is more satisfying to pull out of your wardrobe.Anyone who has ever put linen to skin in the form of summer shirt will be unsurprised to hear that this summer staple first came into being in the arid conditions of Ancient Egypt, used as a catch-all breathable fabric for surviving sky-high temperatures. The material has stood the test of time: thousands of years later and we’re still throwing on white linen, now in the form of a nice button-down as opposed to a toga.Why has this material gone the distance in men’s wardrobes from thousands of years BC until the present day? It’s simple, really: a linen shirt is the most comfortable way to look and feel cool in the heat. Sure, like with even the very best linen suits or blazers, there is the small issue of creasing, but many modern iterations come blended with cotton to see off that problem. There are two options for those in the market for the pure linen alternative: up your ironing game or embrace the wrinkles. On more casual styles, we'd go so far as to say a slightly creased linen shirt adds to the laid-back aesthetic.SKIP TO: What to wear with a linen shirt? | What are the benefits of wearing linen? | Which type of linen is best? | Does linen shrink when washed?What are GQ’s best men’s linen shirts?Best affordable linen shirt: M&S, £40 at marksandspencer.comBest versatile linen shirt: Reiss, £98 at reiss.comBest holiday linen shirt: Percival, £119 at percivalclo.comBest striped linen shirt: Everlane, £87 at everlane.comBest smart linen shirt: Drake's, £196 at drakes.comHow did we choose the best linen shirts?Well, dear reader, it's rather simple. We at GQ know our stuff, and we've compiled a collection of the biggest names in linen, unsung heroes and designer offerings to bring you a well-rounded image of what are truly the best linen shirts for men in 2025.Fan of the fabric? Check out our other guides to the best linen suits, linen shorts, and linen trousers for more on linen-based luxury. Or, check out our guide to the best shirts for men for the same silhouette in something different.Shop GQ's edit of the best linen shirts for 2025…Best affordable linen shirt<source media="(max-width: 767px)" srcSet="https://media.gq-magazine.co.uk/photos/666af8625b16e551de3fdbdd/3:4/w_120%2Cc_limit/LinenShirts_LinenShirts_Marks&amp;Spencer.jpg 120w, https://media.gq-magazine.co.uk/photos/666af8625b16e551de3fdbdd/3:4/w_240%2Cc_limit/LinenShirts_LinenShirts_Marks&amp;Spencer.jpg 240w, https://media.gq-magazine.co.uk/photos/666af8625b16e551de3fdbdd/3:4/w_320%2Cc_limit/LinenShirts_LinenShirts_Marks&amp;Spencer.jpg 320w, https://media.gq-magazine.co.uk/photos/666af8625b16e551de3fdbdd/3:4/w_640%2Cc_limit/LinenShirts_LinenShirts_Marks&amp;Spencer.jpg 640w, https://media.gq-magazine.co.uk/photos/666af8625b16e551de3fdbdd/3:4/w_800%2Cc_limit/LinenShirts_LinenShirts_Marks&amp;Spencer.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.gq-magazine.co.uk/photos/666af8625b16e551de3fdbdd/3:4/w_320%2Cc_limit/LinenShirts_LinenShirts_Marks&amp;Spencer.jpg 320w, https://media.gq-magazine.co.uk/photos/666af8625b16e551de3fdbdd/3:4/w_640%2Cc_limit/LinenShirts_LinenShirts_Marks&amp;Spencer.jpg 640w, https://media.gq-magazine.co.uk/photos/666af8625b16e551de3fdbdd/3:4/w_960%2Cc_limit/LinenShirts_LinenShirts_Marks&amp;Spencer.jpg 960w, https://media.gq-magazine.co.uk/photos/666af8625b16e551de3fdbdd/3:4/w_1280%2Cc_limit/LinenShirts_LinenShirts_Marks&amp;Spencer.jpg 1280w, https://media.gq-magazine.co.uk/photos/666af8625b16e551de3fdbdd/3:4/w_1600%2Cc_limit/LinenShirts_LinenShirts_Marks&amp;Spencer.jpg 1600w, https://media.gq-magazine.co.uk/photos/666af8625b16e551de3fdbdd/3:4/w_1920%2Cc_limit/LinenShirts_LinenShirts_Marks&amp;Spencer.jpg 1920w, https://media.gq-magazine.co.uk/photos/666af8625b16e551de3fdbdd/3:4/w_2240%2Cc_limit/LinenShirts_LinenShirts_Marks&amp;Spencer.jpg 2240w, https://media.gq-magazine.co.uk/photos/666af8625b16e551de3fdbdd/3:4/w_2580%2Cc_limit/LinenShirts_LinenShirts_Marks&amp;Spencer.jpg 2580w" sizes="100vw"/><img loading="lazy" alt="Marks Spencer linen shirt as selected by Faye Fearon" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/666af8625b16e551de3fdbdd/3:4/w_320%2Cc_limit/LinenShirts_LinenShirts_Marks&amp;Spencer.jpg"/>1/20Marks & SpencerLinen Shirt£40 £20 Marks & SpencerM&SSizes: S-4XLColours: White, BlackMarks & Spencer has been serving well-made (and affordable) menswear staples for as long as we can remember, making it a smart port of call for a linen shirt to last. Our top choice from the current selection? This grandad collar design. Topped with this timeless and simplistic fastening, its lightweight frame falls to a relaxed shape and incorporates an easy-to-iron finish. For just £40, you can’t go wrong.Best versatile linen shirt<source media="(max-width: 767px)" srcSet="https://media.gq-magazine.co.uk/photos/67c6e9b2fc2290afc718f6f9/3:4/w_120%2Cc_limit/Linen-shirts-update-Reiss.jpg 120w, https://media.gq-magazine.co.uk/photos/67c6e9b2fc2290afc718f6f9/3:4/w_240%2Cc_limit/Linen-shirts-update-Reiss.jpg 240w, https://media.gq-magazine.co.uk/photos/67c6e9b2fc2290afc718f6f9/3:4/w_320%2Cc_limit/Linen-shirts-update-Reiss.jpg 320w, https://media.gq-magazine.c