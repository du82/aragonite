full_description = "CultureThe best and most anticipated movies of 2025From Chalamet as Dylan in A Complete Unknown to Avatar: Fire & Ash, Mickey 17 and 28 Years Later, it's gonna be a big year for the multiplexBy Killian Faith-Kelly and Jack King4 March 2025Yep, we're already thinking about 2025 movies. Time may be moving faster than we'd like, but there'll always be the cinema for pressing pause for a couple of hours, putting the phone on airplane mode and just kind of boycotting reality for a while.And in 2025, you're gonna be spending a lot of time off-grid. Who'd be replying to texts when Timothée Chalamet's playing Bob Dylan? Who'd want to answer their phone when Cillian Murphy's back on the big screen?Tell you friends. Tell your family. You're going to be hard to reach next year. These are the 2025 movies we're hyped for.Nosferatu1 JanuaryWillem Defoe in a creepy horror film. What more could you want? I'm sure he's lovely in person, but the man can give you the chills like nobody's business. Under the instruction of The Lighthouse director Robert Eggers once again, and with company from Emma Corrin, Aaron Taylor-Johnson and Bill Skarsgård, you can trust this one will have your skin crawling, walking and maybe even running right out of the cinema. In an enjoyable way. Nosferatu is now in cinemas.We Live in Time1 JanuaryWhile our friends across the Atlantic got to see this in October, we'll have to wait until the New Year to cry buckets at this Andrew Garfield and Florence Pugh weeper. John Crowley's newest film — which has fared much better with the critics than the infamously eviscerated Goldfinch — sees Garfield and Pugh play a pair of lovers over the course of a decade, before one of them is hit with a shock cancer diagnosis. You've seen The Fault in Our Stars, you know how this goes. Tissues at the ready, folks. We Live in Town is now in cinemas.Nickel Boys3 JanuaryOne of the big Oscar movies to keep an eye on, Nickel Boys — an adaptation of the acclaimed, Pulitzer-winning novel of the same name — is a timely period piece about a young Black boy navigating Jim Crow racism in ‘60s Florida. IndieWire critic David Ehrlich calls it “a staggeringly beautiful story of resilience,” and “as major and memorable an achievement as any American film this decade.” What’s more, it was produced by Plan B, the studio behind 12 Years a Slave and Moonlight — basically, put it at the top of your watchlist. Nickel Boys is now in cinemas.Babygirl10 JanuaryWork is all the rage on screen. Just look at the success of cult TV hits like Severance, Succession and Industry. They're best when they get into the knottiest taboos of the modern workplace: illicit relationships, managers and CEOs wielding their power like militant despots, drugs and scandals that test the limits of legality. Babygirl, which premiered to great reviews at the Venice Film Festival, is jumping on that trend with a story of forbidden romance between a high-ranking CEO, played by Nicole Kidman, and her enigmatic new intern (Triangle of Sadness' Harris Dickinson). With Bodies Bodies Bodies director Halina Reijn at the helm, this is a thrilling, sexy exploration of professional power dynamics. Babygirl is now in cinemas.A Real Pain10 JanuaryJesse Eisenberg and Kieran Culkin as cousins — it kind of just makes sense, doesn't it? And the trailer suggests the brotherly dynamic will work exactly as you'd think: Culkin the fast-talking braggadocio, Eisenberg the stuttering nervous one following behind, as the brothers travel through Poland in a trip specially arranged to honour their grandmother and the land of her birth. Emma Stone is on board as a producer while Eisenberg writes and directs, which is an amusing thing to learn after seeing him slap Culkin in the face in the trailer. A Real Pain is now in cinemas.A Complete Unknown17 JanuaryWhose face could possibly be slight enough, whose motions jaunty enough, to convincingly embody Bob Dylan? Enter Timothée Chalamet. And if the trailer’s anything to go by, his voice is pretty convincingly Dylan too. Setting the film around the seismic shift that was Dylan’s introduction of the electric guitar to Newport Folk Festival is a clever move, accompanied as it was by such furore and fraternity – Johnny Cash, Pete Seeger, Joan Baez, Woody Guthrie and more are portrayed here. I so hope it’s good. I think it just might be. A Complete Unknown is now in cinemas.The Brutalist24 JanuaryAdrien Brody's latest, directed by Vox Lux's Brady Corbet, has won comparisons to The Godfather and Once Upon a Time in America since it debuted to mega reviews at the Venice Film Festival in September 2024 (and not just because it's very long). It sees him play a European migrant who, in the years following the Holocaust, moves to America to make a name for himself. Once there, he forms a relationship with wealthy benefactor Harrison Lee Van Buren (Guy Pearce), which leads him down a path towards the wonder — and risk — of the American Dream. The Brutalist is now in cinemas.September 524 JanuaryThis new thriller from Swiss director Tim Fehlbaum covers the hostage crisis at the 1972 Munich Olympics from the perspective of the ABC Sports crew whose coverage was watched by over a billion people globally — and may have proven inadvertently ruinous for the rescue effort. Peter Sarsgaard, John Magaro and Ben Chaplin star, with excellent performances throughout in a film which is nauseatingly tense right until the credits roll, even if you know how the true story ends. September 5 is now in cinemas.Hard Truths31 JanuaryWhy, exactly, wouldn't we be excited by a new Mike Leigh film? Let's make it even more tantalising a prospect, then: how about the first Mike Leigh film to star British indie legend Marianne Jean-Baptiste since Secrets and Lies? The classic 1996 family drama is roundly considered to be one of the best films of the ‘90s, and it's certainly one of our favourites — such is why we’re overwhelmingly hyped for Hard Truths, which sees Jean-Baptiste play “a woman tormented by anger and depression, hypersensitive to the slightest possible offence and ever ready to fly off the handle,” per its IMDb synopsis. Hard Truths is now in cinemas.The Seed of the Sacred Fig7 FebruaryThis nigh-on three-hour epic debuted at Cannes to rave reviews, taking home a special prize from the competition jury headed by Greta Gerwig. More noteworthy is the political context in which it was made, as director Mohammad Rasoulof was effectively exiled from his home country of Iran soon after the film was announced, charged with defying the state's strict censorship rules. As to its premise, The Seed of the Sacred Fig centres on a good-hearted lawyer shuffled to the top of the Revolutionary Court, where he is called on to approve executions sight-unseen. The Seed of the Sacred Fig is now in cinemas.Bridget Jones: Mad About the Boy13 FebruaryWho would've thought that the fourth entry of Renée Zellweger's treasured rom-com series — in which her titular protagonist is Britain's unluckiest woman in love — could stand as the series' best? It's certainly this one or the original. What makes Mad About the Boy so special is that it is less a schlocky, paint-by-numbers romance of whose ilk we have seen many times over so much as a touching film about grief, as Bridget deals with her husband Mark's (Colin Firth) death. And, yes, there is a fling along the way to help her recapture her sexy sense of self, and it happens to be with hunk-of-the-moment Leo Woodall (whose name is, inexplicably, Roxster). But it's the surprising heart of Mad About the Boy, and its bittersweet reflection on the permanence of true love, that makes it one of 2025's surprise knockouts.The Monkey21 FebruaryHere comes another Stephen King adaptation — what are there, 237 now? The Monkey, named for the film's killer cymbal-bashing monkey doll, is also exciting for two other reasons: it stars Theo James, making the leap to the big screen after splashy TV turns in The White Lotus and Netflix's The Gentlemen, and it is directed by Osgood Perkins, best known for this year's Longlegs. Seems like one helluva trip, which is precisely how the trailer describes it. The Monkey is now in cinemas.I'm Still Here21 FebruaryThe most surprising Best Picture nominee at this year's Oscars — well, maybe not that much of a surprise as it followed lead actress Fernanda Torres' Golden Globe win in January — is a Brazilian period drama that concerns the disappearance of a political dissident and the family he leaves behind. Walter Salles' film has been championed by the passionate cinephiles of Brazil since it premiered at the Venice Film Festival, and might just see Torres pull off a major upset in the Best Actress race. I'm Still Here is now in cinemas.The Last Showgirl28 FebruaryPamela Anderson mounts a comeback in The Last Showgirl, Gia Coppola's — the latest name in the great Coppola movie dynasty — moving ode to the old-time razzle dazzle of Vegas. “The Last Showgirl is both the role of a lifetime for Anderson,” Kate Erbland wrote for IndieWire, “and (we can only hope) the start of a brand new career for her.” From the looks of it, think Baz Luhrmann's Elvis by way of Sean Baker's The Florida Project. The Last Showgirl is now in cinemas.Mickey 177 MarchNot to sound inadvertently hyperbolic, but we have literally been waiting for years for the release of Mickey 17, Bong Joon-ho's follow-up to 2019's Oscars sensation Parasite. (Really, can you imagine saying back then that we'd be waiting for over half a decade for Joon-ho's next film to come out?) The existential sci-fi comedy — which was supposed to come out in March 2024, and was first teased in December 2022 — stars Robert Pattinson as a series of expendable clones on an interstellar mission to colonise a new planet. Conceptually it sounds like a bit of a head-ringer, but we'll be seated. As long as it isn't delayed again.Marching Powder7 MarchDanny Dyer came back with a proper bang as housewife catnip Freddie Jones in Disney+'s Rivals, and now he is set to return to the big screen in a film that will hark back to his roots — in a self-aware sort of way. Such is the parodic feel of Marching Powder, Dyer's reunion with Football Factory director Nick Love. Dyer plays an ageing hardman who decides that it's about time he stops racking up lines, beating up Millwall fans and settle down for good — but can you teach an old dog new tricks?The Alto Knights21 MarchIt's Robert De Niro versus… Robert De Niro in a classic gangster movie. What wouldn't there be to love? He holds dual roles in the film, portraying rival mob bosses Frank Costello and Vito Genovese, one-time friends turned rivals who are “on a deadly collision course that will reshape the Mafia (and America) forever,” per the official synopsis. We'll watch anything with De Niro, but two of him? Now that's molto bene.Novocaine28 MarchJust like Breaking Bad's Bob Odenkirk, The Boys' Jack Quaid is getting his very own John Wick clone, the twist here being that his character can't feel pain, hence the title (and his name being Nathan Caine — warra pun!) Quaid is always good value on screen, and he looks like he's having a good, ass-kicking time here, in which Nathan Caine must rescue his girlfriend who is caught in the middle of a bank robbery.A Minecraft Movie4 AprilOn the face of it, Minecraft — the sales-record-breaking video game that is basically about crafting cubic structures within an infinite, liminal space — isn't the first adaptation-worthy bit of gaming IP that jumps to mind. You might even instinctively turn your nose up at something called A Minecraft Movie, and we'd hardly blame you for it. But the newest trailer shows a bit of promise. It looks like they've gone for an unserious tone, and the script seems to be happy to make of itself. Why else would you have the least self-serious actor of all time, Jack Black, as your lead?Warfare11 AprilCivil War's Alex Garland co-directs pretty much every online-popular actor in their 20s or early 30s in this Iraq War thriller that looks to stick us right in the middle of the action. War is hell, and can Joseph Quinn, Kit Connor, Will Poulter, Cosmo Jarvis and Finn Bennett survive, or are they just more meat for the grinder? We'll find out in April. Bring your own earplugs.Sinners18 AprilThroughout film history, there have been a handful of elite-tier director/actor pairings. Steven Spielberg and Tom Hanks. Martin Scorsese and Robert DeNiro. Wes Anderson and Owen Wilson. Surely, now, we can add Ryan Coogler and Michael B. Jordan to the mix? Their follow-up to Creed and Black Panther comes in the form of an appropriately gothic vampire movie set in the 1930s American South. Jordan plays twin brothers. The twist? Vampires! An exciting step into bloody genre space for the duo.Until Dawn25 AprilIf you've played Until Dawn, the PlayStation game that just had a big remake for the PS5, you'll know that it's not much of a game at all — it's more of an interactive horror film, wherein you control the decisions of the characters and deal with the attendant consequences. This big screen adaptation starring Love, Victor's Michael Cimino probably won't be all that unfamiliar to gamers, then, but it's a shit-yourself-scary story with murderers and supernatural wendigos, so you'll probably be glad to have your hands free to cover your eyes.Thunderbolts*2 MayCan Thunderbolts, Marvel Studios' latest attempt defibrillate the pulseless MCU, rescue the premier superhero franchise from its present doldrums? We'll see come May, but the trailer makes it look a hoot — we've got David Harbour as a menacing Russian anti-hero, Florence Pugh in full assassin mode a la Black Widow, and a newly Oscar-nominated Sebastian Stan coming in clutch as Captain America's rogue pal Bucky Barnes. It looks like it has the energy of Guardians of the Galaxy by way of the edginess of The Suicide Squad, albeit in PG-friendly mode, and isn't that a great sounding formula?Mission: Impossible — The Final Reckoning21 MayHere's an impossible mission for you — not getting absolutely hyped for the next and possibly last instalment in Tom Cruise's stuntathon. Our colleagues in the US have argued that Mission: Impossible is the greatest action franchise of all time, and while Bond would surely want a word, it's hard to argue with the series' brilliant consistency. The Final Reckoning, previously titled Dead Reckoning Part Two, will pick up on one of the zanier plots of the Mission: Impossible movies so far, including a submarine controlled by a malevolent AI program and Cruise and Co.'s attempts to stop it for good. Day one!The Salt Path30 MayBased on the apparently quite beautiful book about the true story of a couple who embark on an enormous walk around the south of England after some unwelcome health news, we’ve got Gillian Anderson and Jason Isaacs as the lead couple in a film that sounds quite (read: very) likely to make everyone cry. Some Ande"
