full_description = '''ShoppingThis £110 Dickies jacket has pub garden style on lockBe honest: your overshirt isn't enough for the shade and your wool overcoat is too much for a sun trapBy Jessie Atkinson4 March 2025All products are independently selected by our editors. If you buy something, we may earn an affiliate commission.We may be having a false spring right now but mark our words, and the calendar, because real, genuinely warm days are in the post. Time to think about liberating your tennis racket from the storage cupboard and upping the number on your SPF moisturiser. In clothing terms, it's also the moment to ask yourself the question: how's your light jacket game looking?Answer carefully, because there are real-world consequences at stake: we've all been caught shivering in a beer garden in April with nothing but a cardigan for warmth, or been found lumbered with a wool overcoat for a walk around the shops in a sun trap mid-March. What you need is something in between; something transitional; something like the new Dickies ‘Service Painter’ jacket.You already know all about this workwear brand's goes-with-everything 874 work trousers, but if you want a piece that's equally as likely to survive an apocalypse up top, then this is a place that can also serve you well. Cut to a blouson silhouette in sturdy cotton, yarn-dyed in a subtle stripe — red on cream, or cream on black — and a little heavier than the overshirt you think will be enough for that first park trip of the year.<img loading="lazy" alt="Image may contain: Clothing, Shirt, Long Sleeve, Sleeve, Coat, Jacket, Dress Shirt, Knitwear, and Sweater" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c70a53fc3858032976d08e/3:4/w_748%2Cc_limit/Dickies_Service-Painter-Jacket-Cream-2.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c70a53fc3858032976d08e/3:4/w_120,c_limit/Dickies_Service-Painter-Jacket-Cream-2.jpg 120w, https://media.gq-magazine.co.uk/photos/67c70a53fc3858032976d08e/3:4/w_240,c_limit/Dickies_Service-Painter-Jacket-Cream-2.jpg 240w, https://media.gq-magazine.co.uk/photos/67c70a53fc3858032976d08e/3:4/w_320,c_limit/Dickies_Service-Painter-Jacket-Cream-2.jpg 320w, https://media.gq-magazine.co.uk/photos/67c70a53fc3858032976d08e/3:4/w_640,c_limit/Dickies_Service-Painter-Jacket-Cream-2.jpg 640w" sizes="100vw"/>DickiesService Painter Jacket£110 Dickies<img loading="lazy" alt="Image may contain: Clothing, Long Sleeve, Sleeve, Coat, Jacket, Knitwear, Sweater, and Fleece" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c70a5656f8ebcd56bba4cd/3:4/w_748%2Cc_limit/Dickies_Service-Painter-Jacket-Black-2.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c70a5656f8ebcd56bba4cd/3:4/w_120,c_limit/Dickies_Service-Painter-Jacket-Black-2.jpg 120w, https://media.gq-magazine.co.uk/photos/67c70a5656f8ebcd56bba4cd/3:4/w_240,c_limit/Dickies_Service-Painter-Jacket-Black-2.jpg 240w, https://media.gq-magazine.co.uk/photos/67c70a5656f8ebcd56bba4cd/3:4/w_320,c_limit/Dickies_Service-Painter-Jacket-Black-2.jpg 320w, https://media.gq-magazine.co.uk/photos/67c70a5656f8ebcd56bba4cd/3:4/w_640,c_limit/Dickies_Service-Painter-Jacket-Black-2.jpg 640w" sizes="100vw"/>DickiesService Painter Jacket£110 DickiesDickies isn't reinventing the wheel here in its quest for the Goldilocks jacket — and boy, are we glad about it. Instead, the ‘Service Painter’ borrows from classic cuts and builds upon its own fabrication work, using indestructible canvas to craft a subtly tailored piece of spring-loaded layering. Think of it as a denim jacket that you won't need to worry about mirroring with a pair of jeans, or a leather jacket that you won't need to fret about April showers in. For spring, it's just right.Zip it up to the top, leave it open atop your best layering extravaganza, throw it down on the grass for an impromptu seat on which to consume your Meal Deal 