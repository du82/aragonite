title = "Nosferatu is an age-gap romance, actually | British GQ"
description = "Robert Eggers' gnarly gothic horror isn't all that scary — but it is kind of sexy"
full_description = '''CultureNosferatu is an age-gap romance, actuallyRobert Eggers' gnarly gothic horror isn't all that scary — but it is kind of sexyBy Jack King7 January 2025The following article contains major spoilers for Nosferatu.Ah, age-gap relationships: the source of endless X discourse, Gen Z discomfort and a resurgent subject of Hollywood intrigue, from Babygirl to The Idea of You. The latest film to add to the list? Nosferatu, director Robert Eggers' curdled love story centred on Victorian waif Ellen (Lily-Rose Depp) and her curious relationship with the ancient vampire she summoned as a melancholy teen, who now marauds Ye Olde Germany as the enigmatic Count Orlok (Bill Skarsgard). It's less bloody horror so much as it is a gothic tale of parasitic obsession, skin-crawling less for its traditional scares than it is for how it leans into the queasy romance at its core.<img alt="Location scouting with Robert Eggers, who knows a great bone church near Prague" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/6777bb9a25e27683a5dddd98/1:1/w_775%2Cc_limit/location-scout.jpg" srcSet="https://media.gq-magazine.co.uk/photos/6777bb9a25e27683a5dddd98/1:1/w_120,c_limit/location-scout.jpg 120w, https://media.gq-magazine.co.uk/photos/6777bb9a25e27683a5dddd98/1:1/w_240,c_limit/location-scout.jpg 240w, https://media.gq-magazine.co.uk/photos/6777bb9a25e27683a5dddd98/1:1/w_320,c_limit/location-scout.jpg 320w, https://media.gq-magazine.co.uk/photos/6777bb9a25e27683a5dddd98/1:1/w_640,c_limit/location-scout.jpg 640w" sizes="100vw"/>Location scouting with Robert Eggers, who knows a great bone church near PragueBy Gabriella PaiellaNot that this will come as a surprise to the Stoker nerds among us. Vampires have long been associated with eroticism in pop culture, embodying lust and desire; they kiss our throats, penetrate our skin, and feed on our blood, sucking us dry. Such is probably why Eggers centres sex and desire in his ghoulish vision for Nosferatu, blurring the lines of consent and freaky sexual taboo. Orlok is a malevolent, manipulative older lover — you can tell this from the fact that he literally controls Ellen's mind, feasts on innocent children, and such — but is she entirely uninterested?You might even describe what emerges a third of the way in as the strangest, most curiously sexy love triangle this side of Challengers. The third point? Thomas (Nicholas Hoult), Ellen's young husband and a budding solicitor who is sent traipsing across Europe from his native Wisborg to Orlok's castle in Transylvania, where he is to help the mysterious count with his relocation to a decrepit Wisborgian manor. This is also where we see Orlok for the first time, a hulking man-thing the height and width of an industrial fridge, with striking cheekbones and a jutting jaw. Despite the rotting flesh — and wider air of decomposition, which is very much a downer — there've been worse daddy figures.Thomas fears and loathes him, but he is also transfixed, such is Orlok's curious magnetism. He has his blood sucked twice: first, after he nicks his thumb on a blade, which Orlok descends upon like a ravenous mosquito, and he later awakens to find two puncture wounds in his chest. His blood is sustenance. Perhaps it is also a way for Orlok to be closer to his beloved, by consuming the life-force of the man who usurped him. Maybe he just found himself caught in Thomas' handsome allure, and decided to snack on his neck.None of this is especially scary, save for a jump-scare or two — and if you've a weak stomach, you might struggle with the blood — but it is disquietingly weird. None more so than when Orlok arrives at Wisborg on a plague ship, where he gives Ellen a handful of days to return to him. Thomas and a coterie of mad scientists work towards banishing Orlok before his plague can kill everyone in the small town; in the meantime, Ellen meets with Orlok, they have sex, and she allows him to feast on her. It's enough to distract him until the sun arrives to burn him to a crisp, relieving the world of the Nosferatu curse.Thomas is also saved, holding Ellen's hand as she dies, be it from the ordeal of Orlok's obsession or a broken heart upon his death. An alternative thought: perhaps it is Ellen's sacrifice that is Nosferatu's deepest expression of love, giving herself to Orlok to save the man that she truly loves, even in the knowledge that she will leave him behind. Well, it's less queasy than fancying a walking corpse.Nosferatu is now in cinemas.'''
author = "Jack King"
year_published = 2025
year_updated = 2025
