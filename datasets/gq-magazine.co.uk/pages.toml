title = "How to make a big Hollywood brooch | British GQ"
description = "At the Oscars, we couldn't stop staring at Brady Corbet's glorious lapel pin. So, we caught up with the guy who created it"
full_description = '''FashionHow to make a big Hollywood broochAt the Oscars, we couldn't stop staring at Brady Corbet's glorious lapel pin. So, we caught up with the guy who created itBy Adam Cheung5 March 2025ANGELA WEISS/Getty ImagesBrady Corbet started working on The Brutalist about seven years ago. The journey, from writing his very first draft to exporting the final cut, has been, in his own words, “pretty relentless.” So when your work is being touted by critics as “one of the best films of the 21st century,” you're gonna want to celebrate – and look damn good while doing it.On Sunday, the American filmmaker pulled up to the biggest awards show on Earth (the Oscars, FYI) wearing something on his lapel that felt new, elegant, and left-field all at once. It was the Endeavours brooch by Sauvereign, and it was custom-made for Corbet and Corbet alone.<img alt="Image may contain Brady Corbet Blazer Clothing Coat Jacket Formal Wear Suit Accessories Sunglasses and Wristwatch" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c84d240ea230a3e1eb2cf6/master/w_1600%2Cc_limit/2202893977" srcSet="https://media.gq-magazine.co.uk/photos/67c84d240ea230a3e1eb2cf6/master/w_120,c_limit/2202893977 120w, https://media.gq-magazine.co.uk/photos/67c84d240ea230a3e1eb2cf6/master/w_240,c_limit/2202893977 240w, https://media.gq-magazine.co.uk/photos/67c84d240ea230a3e1eb2cf6/master/w_320,c_limit/2202893977 320w, https://media.gq-magazine.co.uk/photos/67c84d240ea230a3e1eb2cf6/master/w_640,c_limit/2202893977 640w, https://media.gq-magazine.co.uk/photos/67c84d240ea230a3e1eb2cf6/master/w_960,c_limit/2202893977 960w, https://media.gq-magazine.co.uk/photos/67c84d240ea230a3e1eb2cf6/master/w_1280,c_limit/2202893977 1280w, https://media.gq-magazine.co.uk/photos/67c84d240ea230a3e1eb2cf6/master/w_1600,c_limit/2202893977 1600w" sizes="100vw"/>Frazer Harrison<img alt="Cillian Murphy&#x27;s Oscars brooch was never meant to be at the Oscars" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/65eedf024f2d3ba0316d7c72/1:1/w_775%2Cc_limit/2074705296" srcSet="https://media.gq-magazine.co.uk/photos/65eedf024f2d3ba0316d7c72/1:1/w_120,c_limit/2074705296 120w, https://media.gq-magazine.co.uk/photos/65eedf024f2d3ba0316d7c72/1:1/w_240,c_limit/2074705296 240w, https://media.gq-magazine.co.uk/photos/65eedf024f2d3ba0316d7c72/1:1/w_320,c_limit/2074705296 320w, https://media.gq-magazine.co.uk/photos/65eedf024f2d3ba0316d7c72/1:1/w_640,c_limit/2074705296 640w" sizes="100vw"/>Cillian Murphy's Oscars brooch was never meant to be at the OscarsBy Adam CheungWhen he first approached the Hong Kong-based house, he didn't really have anything specific in mind. “[Corbet] had no requests whatsoever,” says Bertrand Mak, founder and chief creative of Sauvereign. “Carte blanche is a dream for my creativity.”So Mak, free to do whatever he desired, turned to the drawing board. The Endeavours brooch was handcrafted in Switzerland from sterling silver. Its sharp, angular lines were inspired by the raw, geometric style of Brutalist architecture. Covered in a satin finish, each chamfer and edge was polished to give it a more three-dimensional vibe. And while part of his job is, of course, to make things look pretty, he wanted this piece to be something deeper and more meaningful.When you take a step back, you'll see that the brooch is also a tribute to spomeniks – concrete memorial monuments that can be seen in the old sites of Yugoslavia. It's a sign of respect to the survivors and fallen heroes who fought in the Second World War. And it's little details like these that are making brooches one of the hottest things on the red carpet right now.<img alt="Image may contain Aluminium Blade Weapon and Mailbox" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c84f3d0ea230a3e1eb2cf8/master/w_1600%2Cc_limit/Image%2520GQ.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c84f3d0ea230a3e1eb2cf8/master/w_120,c_limit/Image%20GQ.jpg 120w, https://media.gq-magazine.co.uk/photos/67c84f3d0ea230a3e1eb2cf8/master/w_240,c_limit/Image%20GQ.jpg 240w, https://media.gq-magazine.co.uk/photos/67c84f3d0ea230a3e1eb2cf8/master/w_320,c_limit/Image%20GQ.jpg 320w, https://media.gq-magazine.co.uk/photos/67c84f3d0ea230a3e1eb2cf8/master/w_640,c_limit/Image%20GQ.jpg 640w, https://media.gq-magazine.co.uk/photos/67c84f3d0ea230a3e1eb2cf8/master/w_960,c_limit/Image%20GQ.jpg 960w, https://media.gq-magazine.co.uk/photos/67c84f3d0ea230a3e1eb2cf8/master/w_1280,c_limit/Image%20GQ.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c84f3d0ea230a3e1eb2cf8/master/w_1600,c_limit/Image%20GQ.jpg 1600w" sizes="100vw"/>Sauvereign“There aren't a great deal of accessory options for men without appearing pretentious or trying too hard,” says Mak. “Brooches are incredibly expressive, often proudly visible, they can send subtle messages, sartorial or dramatic, evoking powerful emotions with both the wearer and viewer. The piece I made for Brady Corbet [was] an embodiment of this.”“Like The Brutalist, this unique Sauvereign brooch is also a tribute to the purity of creative vision in the face of adversity. It resonates with me emotionally and I will treasure it as a memento of this very special moment,” says Corbet. “It was great to work with Bertrand Mak and his wider team, to experience their commitment to creativity and storytelling.”Last year, Mak also designed Cillian Murphy's HS14 Gem brooch that he wore to the Oscars. So if you're really serious about your acting career, maybe it's time forget about those expensive acting lessons and hit up Sauvereign instead. Every Hollywood guy is.'''
