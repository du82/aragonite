title = "Best sweater vests for men 2025: Cos to Drake's | British GQ"
description = "Sweater vests are back on the style menu for men in 2025. Easy to wear with or without tailoring, shop our favourites from Cos and Arket to Prada."
full_description = '''FashionThe best sweater vests to embrace '70s style in all its gloryOnce the preserve of people old before their time and plasticine Wensleydale obsessives, sweater vests are back on the style menu By Jessie Atkinson and Heidi Quill4 March 2025All products are independently selected by our editors. If you buy something, we may earn an affiliate commission.Once, the best sweater vests you could conjure in your mind's eye were hardly worth the superlative. Most were the kind of thing you might associate with a great-grandad in a knotted head hanky or a fusty professor with dandruff. In essence, for as long as anyone could remember, sleeveless jumpers were considered the torso-covering equivalent of white socks worn with leather sandals. That reputation is no more.In the world of baggy pants and the return of the classic boxer short, you can wear a knitted sweatshirt with the sleeves lopped off and look like the coolest guy at the house party. The most interesting, non-fusty grandad way to do this is either on its own with bare arms or on top of a white T-shirt. If you do want to wear it with a shirt, make it a stiff white dress shirt that's on the oversized side – size up on the knit, too – and skip the tie.Got it? Good! Let's take a look at our current favourites.Drake's<img loading="lazy" alt="Image may contain: Clothing, Vest, Knitwear, and Sweater" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c711df5990e6322243612c/3:4/w_748%2Cc_limit/Best-sweater-vests-for-men-Drakes-Fairisle-Sweater-Vest.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c711df5990e6322243612c/3:4/w_120,c_limit/Best-sweater-vests-for-men-Drakes-Fairisle-Sweater-Vest.jpg 120w, https://media.gq-magazine.co.uk/photos/67c711df5990e6322243612c/3:4/w_240,c_limit/Best-sweater-vests-for-men-Drakes-Fairisle-Sweater-Vest.jpg 240w, https://media.gq-magazine.co.uk/photos/67c711df5990e6322243612c/3:4/w_320,c_limit/Best-sweater-vests-for-men-Drakes-Fairisle-Sweater-Vest.jpg 320w, https://media.gq-magazine.co.uk/photos/67c711df5990e6322243612c/3:4/w_640,c_limit/Best-sweater-vests-for-men-Drakes-Fairisle-Sweater-Vest.jpg 640w" sizes="100vw"/>Drake'sFair Isle Sweater Vest£275 Drake'sFabrication: LambswoolSizes: S-XXLColours: MultiThe power of Drake's has made what is already a timeless icon of menswear — the Fair Isle knit — into something even more recognisable. It's done that with its multi-coloured lambswool take on the intarsia pattern, which instantly stands out as a piece of iconography in its own right, to be worn with a sport coat or with bare arms. As sported by Djo aka Jo Keery at the BRIT Awards 2025. £275, drakes.comPercival<img loading="lazy" alt="Image may contain: Clothing, Vest, Knitwear, Sweater, Blouse, Person, Teen, and Wristwatch" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c711dccc0b8f58919ceef3/3:4/w_748%2Cc_limit/Best-sweater-vests-for-men-Percival-Cable-Knit-Sweater-Vest.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c711dccc0b8f58919ceef3/3:4/w_120,c_limit/Best-sweater-vests-for-men-Percival-Cable-Knit-Sweater-Vest.jpg 120w, https://media.gq-magazine.co.uk/photos/67c711dccc0b8f58919ceef3/3:4/w_240,c_limit/Best-sweater-vests-for-men-Percival-Cable-Knit-Sweater-Vest.jpg 240w, https://media.gq-magazine.co.uk/photos/67c711dccc0b8f58919ceef3/3:4/w_320,c_limit/Best-sweater-vests-for-men-Percival-Cable-Knit-Sweater-Vest.jpg 320w, https://media.gq-magazine.co.uk/photos/67c711dccc0b8f58919ceef3/3:4/w_640,c_limit/Best-sweater-vests-for-men-Percival-Cable-Knit-Sweater-Vest.jpg 640w" sizes="100vw"/>PercivalCable Knit V-Neck Vest£129 PercivalFabrication: Alpaca wool blendSizes: XS-XXLColours: CreamPercival's SS25 sweater vest leans into the cricket of it all by virtue of cream cable knitted wool and a v-neckline. Typical of the brand that brought you your favourite knitted polo shirt, Percival proves itself a dab hand with a wool yarn, conjuring it into a thick dollop of creamy transitional goodness. £129, percivalclo.comArket<img loading="lazy" alt="Image may contain: Clothing, and Vest" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c711dfcc0b8f58919ceef6/3:4/w_748%2Cc_limit/Best-sweater-vests-for-men-Arket-Alpaca-Blend-Vest.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c711dfcc0b8f58919ceef6/3:4/w_120,c_limit/Best-sweater-vests-for-men-Arket-Alpaca-Blend-Vest.jpg 120w, https://media.gq-magazine.co.uk/photos/67c711dfcc0b8f58919ceef6/3:4/w_240,c_limit/Best-sweater-vests-for-men-Arket-Alpaca-Blend-Vest.jpg 240w, https://media.gq-magazine.co.uk/photos/67c711dfcc0b8f58919ceef6/3:4/w_320,c_limit/Best-sweater-vests-for-men-Arket-Alpaca-Blend-Vest.jpg 320w, https://media.gq-magazine.co.uk/photos/67c711dfcc0b8f58919ceef6/3:4/w_640,c_limit/Best-sweater-vests-for-men-Arket-Alpaca-Blend-Vest.jpg 640w" sizes="100vw"/>ArketAlpaca-Wool Blend Sweater Vest£67 ArketFabrication: Alpaca/wool blendSizes: XS-XLColours: Burgundy, black, navyWant a sweater vest that would've looked as great with a tailored two-piece 100 years ago as it does now? Arket's wool and alpaca-blend is just the ticket, combining a slouchy, generous arm hole, ribbed crew neck and a mohair-effect texture that come together to create something truly enduring. £67, arket.comSeasalt Cornwall<img loading="lazy" alt="Image may contain: Clothing, Vest, Undershirt, Tank Top, and Coat" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c711dca234dde0d2f12c92/3:4/w_748%2Cc_limit/Best-sweater-vests-for-men-Seasalt-Cornwall-Fairisle-Sweater-Vest.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c711dca234dde0d2f12c92/3:4/w_120,c_limit/Best-sweater-vests-for-men-Seasalt-Cornwall-Fairisle-Sweater-Vest.jpg 120w, https://media.gq-magazine.co.uk/photos/67c711dca234dde0d2f12c92/3:4/w_240,c_limit/Best-sweater-vests-for-men-Seasalt-Cornwall-Fairisle-Sweater-Vest.jpg 240w, https://media.gq-magazine.co.uk/photos/67c711dca234dde0d2f12c92/3:4/w_320,c_limit/Best-sweater-vests-for-men-Seasalt-Cornwall-Fairisle-Sweater-Vest.jpg 320w, https://media.gq-magazine.co.uk/photos/67c711dca234dde0d2f12c92/3:4/w_640,c_limit/Best-sweater-vests-for-men-Seasalt-Cornwall-Fairisle-Sweater-Vest.jpg 640w" sizes="100vw"/>Seasalt CornwallLambswool Rich Fair Isle Knitted Vest£79.95 M&SFabrication: Lambswool blendSizes: XS-3XLColours: MultiSeasalt Cornwall's entry into the Fair Isle canon is for fans of the Drake's spectacular who don't want to spend close to £300. Quirky in its own right, but a little more muted than the bright reds and turquoises found in the peppier of preppy pieces, this design is ideal if you want to introduce some fun into your wardrobe without swerving too far out of your neutral-toned wardrobe. £79.95, marksandspencer.comOliver Spencer<img loading="lazy" alt="Image may contain: Clothing, Vest, Knitwear, and Sweater" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c711dffc3858032976d0a6/3:4/w_748%2Cc_limit/Best-sweater-vests-for-men-Oliver-Spencer-V-Neck-Sweater-Vest.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c711dffc3858032976d0a6/3:4/w_120,c_limit/Best-sweater-vests-for-men-Oliver-Spencer-V-Neck-Sweater-Vest.jpg 120w, https://media.gq-magazine.co.uk/photos/67c711dffc3858032976d0a6/3:4/w_240,c_limit/Best-sweater-vests-for-men-Oliver-Spencer-V-Neck-Sweater-Vest.jpg 240w, https://media.gq-magazine.co.uk/photos/67c711dffc3858032976d0a6/3:4/w_320,c_limit/Best-sweater-vests-for-men-Oliver-Spencer-V-Neck-Sweater-Vest.jpg 320w, https://media.gq-magazine.co.uk/photos/67c711dffc3858032976d0a6/3:4/w_640,c_limit/Best-sweater-vests-for-men-Oliver-Spencer-V-Neck-Sweater-Vest.jpg 640w" sizes="100vw"/>Oliver Spencer'Graves' V Neck Vest£169 Oliver SpencerFabrication: Organic cottonSizes: XS-XXLColours: MultiOliver Spencer's textured sleeveless jumper makes beautiful use of texture, weaving a navy, burgundy and cream dream of knitwear acrobatics. Crucially, this piece is made of organic cotton as opposed to wool, making it ideal for wear in summer with bare arms (perfect if wool is a little itchy for you). £169, oliverspencer.co.ukCos<img loading="lazy" alt="Image may contain: Clothing, Undershirt, Tank Top, and Vest" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c711dca234dde0d2f12c91/3:4/w_748%2Cc_limit/Best-sweater-vests-for-men-Cos-Double-Faced-Knitted-Sweater-Vest.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c711dca234dde0d2f12c91/3:4/w_120,c_limit/Best-sweater-vests-for-men-Cos-Double-Faced-Knitted-Sweater-Vest.jpg 120w, https://media.gq-magazine.co.uk/photos/67c711dca234dde0d2f12c91/3:4/w_240,c_limit/Best-sweater-vests-for-men-Cos-Double-Faced-Knitted-Sweater-Vest.jpg 240w, https://media.gq-magazine.co.uk/photos/67c711dca234dde0d2f12c91/3:4/w_320,c_limit/Best-sweater-vests-for-men-Cos-Double-Faced-Knitted-Sweater-Vest.jpg 320w, https://media.gq-magazine.co.uk/photos/67c711dca234dde0d2f12c91/3:4/w_640,c_limit/Best-sweater-vests-for-men-Cos-Double-Faced-Knitted-Sweater-Vest.jpg 640w" sizes="100vw"/>CosDouble-Faced Knitted Sweater Vest£55 CosFabrication: Organic cottonSizes: XS-XLColours: Grey, navyIf you aren't a fan of the “shrunken” look that so many sweater vests have then you might be persuaded to the sleeveless way of life by something with more of a tabard shape like Cos' double-faced cotton piece, in a relaxed silhouette, for example. In everlasting navy or grey mélange, this piece has the look of your favourite crew new sweatshirt, and should be worn in the same way you style that. £55, cos.comToast<img loading="lazy" alt="Image may contain: Clothing, Vest, Knitwear, and Sweater" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c711dc1895cf485de24758/3:4/w_748%2Cc_limit/Best-sweater-vests-for-men-Toast-Donegal-Wool-Sweater-Vest.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c711dc1895cf485de24758/3:4/w_120,c_limit/Best-sweater-vests-for-men-Toast-Donegal-Wool-Sweater-Vest.jpg 120w, https://media.gq-magazine.co.uk/photos/67c711dc1895cf485de24758/3:4/w_240,c_limit/Best-sweater-vests-for-men-Toast-Donegal-Wool-Sweater-Vest.jpg 240w, https://media.gq-magazine.co.uk/photos/67c711dc1895cf485de24758/3:4/w_320,c_limit/Best-sweater-vests-for-men-Toast-Donegal-Wool-Sweater-Vest.jpg 320w, https://media.gq-magazine.co.uk/photos/67c711dc1895cf485de24758/3:4/w_640,c_limit/Best-sweater-vests-for-men-Toast-Donegal-Wool-Sweater-Vest.jpg 640w" sizes="100vw"/>ToastDonegal Wool Knitted Sweater Vest£155 ToastFabrication: Donegal woolSizes: XS-XLColours: Green, greyToast's love affair with Donegal wool continues in this beautiful knitted tank with standout ribbed trims and dreamy natural speckling. Though it also comes in grey, our favourite version is in moss green, which nods to the It colour of the SS25 season. £155, toa.stAmi Paris<img loading="lazy" alt="Image may contain: Blouse, Clothing, Knitwear, Sweater, Adult, and Person" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c711dcfc3858032976d0a4/3:4/w_748%2Cc_limit/Best-sweater-vests-for-men-Ami-Paris-Sweater-Vest.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c711dcfc3858032976d0a4/3:4/w_120,c_limit/Best-sweater-vests-for-men-Ami-Paris-Sweater-Vest.jpg 120w, https://media.gq-magazine.co.uk/photos/67c711dcfc3858032976d0a4/3:4/w_240,c_limit/Best-sweater-vests-for-men-Ami-Paris-Sweater-Vest.jpg 240w, https://media.gq-magazine.co.uk/photos/67c711dcfc3858032976d0a4/3:4/w_320,c_limit/Best-sweater-vests-for-men-Ami-Paris-Sweater-Vest.jpg 320w, https://media.gq-magazine.co.uk/photos/67c711dcfc3858032976d0a4/3:4/w_640,c_limit/Best-sweater-vests-for-men-Ami-Paris-Sweater-Vest.jpg 640w" sizes="100vw"/>AMI Paris'Ami de Coeur' Sweater Vest£240 Ami ParisFabrication: WoolSizes: XXS-XXLColours: Cream, navyThe ‘Ami de Coeur’ Ace of hearts branding is rarely hidden in an Ami Paris piece. The label's recognisable stamp is tonally knitted in this case, taking chunky pride of place on the left chest and adding to the American college look of the open knit and contrast striped trims. £340, amiparis.comRepresent<img loading="lazy" alt="Image may contain: Clothing, Vest, Knitwear, Sweater, Tank Top, and Undershirt" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c711db56f8ebcd56bba4e0/3:4/w_748%2Cc_limit/Best-sweater-vests-for-men-Represent-Washed-Knit-Sweater-Vest.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c711db56f8ebcd56bba4e0/3:4/w_120,c_limit/Best-sweater-vests-for-men-Represent-Washed-Knit-Sweater-Vest.jpg 120w, https://media.gq-magazine.co.uk/photos/67c711db56f8ebcd56bba4e0/3:4/w_240,c_limit/Best-sweater-vests-for-men-Represent-Washed-Knit-Sweater-Vest.jpg 240w, https://media.gq-magazine.co.uk/photos/67c711db56f8ebcd56bba4e0/3:4/w_320,c_limit/Best-sweater-vests-for-men-Represent-Washed-Knit-Sweater-Vest.jpg 320w, https://media.gq-magazine.co.uk/photos/67c711db56f8ebcd56bba4e0/3:4/w_640,c_limit/Best-sweater-vests-for-men-Represent-Washed-Knit-Sweater-Vest.jpg 640w" sizes="100vw"/>RepresentWashed Knit Vest£90 RepresentFabrication: CottonSizes: XS-XXLColours: Pink, blueCasual observers of Represent might be surprised to see that the brand has broader horizons than its wildly popular hoodies. Don't go missing the knitted wood for the jersey trees (or something): this open knitted vest ought to be as high on your list as an ‘Owners Club’ sweat. £90, uk.representclo.comSims Wear<img loading="lazy" alt="Image may contain: Clothing, Vest, and Tank Top" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c711df56f8ebcd56bba4e2/3:4/w_748%2Cc_limit/Best-sweater-vests-for-men-Sims-Wear-Lambswool-Sweater-Vest.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c711df56f8ebcd56bba4e2/3:4/w_120,c_limit/Best-sweater-vests-for-men-Sims-Wear-Lambswool-Sweater-Vest.jpg 120w, https://media.gq-magazine.co.uk/photos/67c711df56f8ebcd56bba4e2/3:4/w_240,c_limit/Best-sweater-vests-for-men-Sims-Wear-Lambswool-Sweater-Vest.jpg 240w, https://media.gq-magazine.co.uk/photos/67c711df56f8ebcd56bba4e2/3:4/w_320,c_limit/Best-sweater-vests-for-men-Sims-Wear-Lambswool-Sweater-Vest.jpg 320w, https://media.gq-magazine.co.uk/photos/67c711df56f8ebcd56bba4e2/3:4/w_640,c_limit/Best-sweater-vests-for-men-Sims-Wear-Lambswool-Sweater-Vest.jpg 640w" sizes="100vw"/>Sims WearBrushed Lambswool Sweater Vest£225 Sims WearFabrication: LambswoolSizes: S-XXLColours: NavyAllow us to introduce a new knitter on the block. Sims Wear deserves your attention for its premium production chops, using fine Scottish '''
