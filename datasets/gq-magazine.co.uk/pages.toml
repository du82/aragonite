title = "10 affordable clothing brands for men, under £100 | British GQ"
description = "From Stüssy to Universal Works, these are the best affordable menswear brands with items coming in at less than and around £100."
full_description = '''FashionAffordable (yet advanced) menswear brands you can get for £100 or lessFrom Stüssy to Universal Works, some menswear won't cost you the Earth – and it won't torch it, eitherBy Adam Cheung and Ollie Cox4 March 2025All products are independently selected by our editors. If you buy something, we may earn an affiliate commission.Looking for the best affordable menswear brands? There are so many high street labels out there that won't send your bank balance into the negatives, while also nodding to the big boys of the runway to ensure you look fresh. But how good are they, really?Buying tonnes of cheap clothes doesn't help your wardrobe (or the planet). Not only do they wear and tear easily (T-shirts, in particular, have a short shelf life), they also don't tend to fit all that well. All in all, not much is working.So, to help you scope out some of the greatest affordable menswear brands that a) last and b) look good, we've trawled the internet to seek out the pieces that won't break the bank, nor the planet. Oh, and we've added a few of our own favourite affordable menswear brands to really spice things up.1 | CosIf you’re in the market for swooshy, steezy menswear that looks really expensive (but isn’t), Cos is the one. For every relaxed Côte D’Azure-appropriate slinky shirt, there are baggy trousers that you can wear with sneakers, but also look mega with penny loafers and boots (AKA bang for your buck). Plus, the suede and leather pieces in its roster help add that extra high-end feeling.If you needed any more convincing of Cos’ elite affordable menswear offering, look no further than its recent spring/summer 2025 campaign starring Adrien Brody. The Oscar winner is a king of low-effort max-impact menswear. And if it works for him, it definitely works for us.The pieces to buy:<img loading="lazy" alt="Image may contain: Clothing, Long Sleeve, Shirt, Sleeve, Dress Shirt, and Blouse" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c71873cc0b8f58919ceef9/3:4/w_748%2Cc_limit/Affordable%2520menswear%2520brands_0026_Cos.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c71873cc0b8f58919ceef9/3:4/w_120,c_limit/Affordable%20menswear%20brands_0026_Cos.jpg 120w, https://media.gq-magazine.co.uk/photos/67c71873cc0b8f58919ceef9/3:4/w_240,c_limit/Affordable%20menswear%20brands_0026_Cos.jpg 240w, https://media.gq-magazine.co.uk/photos/67c71873cc0b8f58919ceef9/3:4/w_320,c_limit/Affordable%20menswear%20brands_0026_Cos.jpg 320w, https://media.gq-magazine.co.uk/photos/67c71873cc0b8f58919ceef9/3:4/w_640,c_limit/Affordable%20menswear%20brands_0026_Cos.jpg 640w" sizes="100vw"/>CosRelaxed striped shirt£85 Cos<img loading="lazy" alt="Image may contain: Clothing, Knitwear, Sweater, Cardigan, and Coat" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c718bb12bc3b8f3972c5ca/3:4/w_748%2Cc_limit/Affordable%2520menswear%2520brands_0025_Cos.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c718bb12bc3b8f3972c5ca/3:4/w_120,c_limit/Affordable%20menswear%20brands_0025_Cos.jpg 120w, https://media.gq-magazine.co.uk/photos/67c718bb12bc3b8f3972c5ca/3:4/w_240,c_limit/Affordable%20menswear%20brands_0025_Cos.jpg 240w, https://media.gq-magazine.co.uk/photos/67c718bb12bc3b8f3972c5ca/3:4/w_320,c_limit/Affordable%20menswear%20brands_0025_Cos.jpg 320w, https://media.gq-magazine.co.uk/photos/67c718bb12bc3b8f3972c5ca/3:4/w_640,c_limit/Affordable%20menswear%20brands_0025_Cos.jpg 640w" sizes="100vw"/>CosMerino wool V-neck cardigan£85 Cos<img loading="lazy" alt="Image may contain: Clothing, Coat, Jacket, Long Sleeve, Sleeve, Pants, and Blouse" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c718f6fc3858032976d0af/3:4/w_748%2Cc_limit/Affordable%2520menswear%2520brands_0024_Cos.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c718f6fc3858032976d0af/3:4/w_120,c_limit/Affordable%20menswear%20brands_0024_Cos.jpg 120w, https://media.gq-magazine.co.uk/photos/67c718f6fc3858032976d0af/3:4/w_240,c_limit/Affordable%20menswear%20brands_0024_Cos.jpg 240w, https://media.gq-magazine.co.uk/photos/67c718f6fc3858032976d0af/3:4/w_320,c_limit/Affordable%20menswear%20brands_0024_Cos.jpg 320w, https://media.gq-magazine.co.uk/photos/67c718f6fc3858032976d0af/3:4/w_640,c_limit/Affordable%20menswear%20brands_0024_Cos.jpg 640w" sizes="100vw"/>CosLinen bomber jacket£135 Cos2| J. CrewJ. Crew is an all-American hallmark of preppy goodness, and one to have on your radar if you’re into killer staples. It’s been in the game since 1983 and has been consistent in producing wardrobe workhorses that do the heavy lifting without too much thought. Skate rats and bookish menswear gurus share a passion for its baggy chinos, cotton sweaters are built to last, and relaxed Oxford shirts come in under £100. Not to be sniffed at.The pieces to buy:<img loading="lazy" alt="Image may contain: Clothing, Shirt, Pants, Coat, Long Sleeve, Sleeve, Vest, and Jeans" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c7192056f8ebcd56bba4e8/3:4/w_748%2Cc_limit/Affordable%2520menswear%2520brands_0021_J%2520crew.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c7192056f8ebcd56bba4e8/3:4/w_120,c_limit/Affordable%20menswear%20brands_0021_J%20crew.jpg 120w, https://media.gq-magazine.co.uk/photos/67c7192056f8ebcd56bba4e8/3:4/w_240,c_limit/Affordable%20menswear%20brands_0021_J%20crew.jpg 240w, https://media.gq-magazine.co.uk/photos/67c7192056f8ebcd56bba4e8/3:4/w_320,c_limit/Affordable%20menswear%20brands_0021_J%20crew.jpg 320w, https://media.gq-magazine.co.uk/photos/67c7192056f8ebcd56bba4e8/3:4/w_640,c_limit/Affordable%20menswear%20brands_0021_J%20crew.jpg 640w" sizes="100vw"/>J.CrewBrushed twill shirt£89 J.Crew<img loading="lazy" alt="Image may contain: Clothing, Knitwear, Sweater, and Sweatshirt" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c719455990e63222436132/3:4/w_748%2Cc_limit/Affordable%2520menswear%2520brands_0022_J%2520crew.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c719455990e63222436132/3:4/w_120,c_limit/Affordable%20menswear%20brands_0022_J%20crew.jpg 120w, https://media.gq-magazine.co.uk/photos/67c719455990e63222436132/3:4/w_240,c_limit/Affordable%20menswear%20brands_0022_J%20crew.jpg 240w, https://media.gq-magazine.co.uk/photos/67c719455990e63222436132/3:4/w_320,c_limit/Affordable%20menswear%20brands_0022_J%20crew.jpg 320w, https://media.gq-magazine.co.uk/photos/67c719455990e63222436132/3:4/w_640,c_limit/Affordable%20menswear%20brands_0022_J%20crew.jpg 640w" sizes="100vw"/>J.CrewHeritage cotton crewneck sweater£100 J.Crew<img loading="lazy" alt="Image may contain: Clothing, Pants, Jeans, Adult, and Person" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c71ad4fc3858032976d0b1/3:4/w_748%2Cc_limit/Affordable%2520menswear%2520brands_0023_J%2520Crew.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c71ad4fc3858032976d0b1/3:4/w_120,c_limit/Affordable%20menswear%20brands_0023_J%20Crew.jpg 120w, https://media.gq-magazine.co.uk/photos/67c71ad4fc3858032976d0b1/3:4/w_240,c_limit/Affordable%20menswear%20brands_0023_J%20Crew.jpg 240w, https://media.gq-magazine.co.uk/photos/67c71ad4fc3858032976d0b1/3:4/w_320,c_limit/Affordable%20menswear%20brands_0023_J%20Crew.jpg 320w, https://media.gq-magazine.co.uk/photos/67c71ad4fc3858032976d0b1/3:4/w_640,c_limit/Affordable%20menswear%20brands_0023_J%20Crew.jpg 640w" sizes="100vw"/>J.CrewClassic chino pant£100 J.Crew3| Estudio NiksenFounded in 2021, Montreal lifestyle brand Estudio Niksen is a relative new kid on the block when it comes to menswear. But in that time it’s created a recognisable, sharply defined look around boxy staples, like zip-through cardigans, jackets, and trousers that all sell out on its web store. Estudio Niksen offers functional, wearable and unfussy menswear and is definitely one to have in mind for an affordable high-yield menswear win.The pieces to buy:<img loading="lazy" alt="Image may contain: Clothing, Fleece, Knitwear, Sweater, Sweatshirt, Hoodie, and Hood" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c71c3a5990e6322243613c/3:4/w_748%2Cc_limit/Affordable%2520menswear%2520brands_0018_estudioniksen.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c71c3a5990e6322243613c/3:4/w_120,c_limit/Affordable%20menswear%20brands_0018_estudioniksen.jpg 120w, https://media.gq-magazine.co.uk/photos/67c71c3a5990e6322243613c/3:4/w_240,c_limit/Affordable%20menswear%20brands_0018_estudioniksen.jpg 240w, https://media.gq-magazine.co.uk/photos/67c71c3a5990e6322243613c/3:4/w_320,c_limit/Affordable%20menswear%20brands_0018_estudioniksen.jpg 320w, https://media.gq-magazine.co.uk/photos/67c71c3a5990e6322243613c/3:4/w_640,c_limit/Affordable%20menswear%20brands_0018_estudioniksen.jpg 640w" sizes="100vw"/>Estudio NiksenBoxy zip-up hoodie£100 Estudio Niksen<img loading="lazy" alt="Image may contain: Clothing, Fleece, Coat, Jacket, Hoodie, Knitwear, Sweater, and Sweatshirt" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c71b4b56f8ebcd56bba4ee/3:4/w_748%2Cc_limit/Affordable%2520menswear%2520brands_0019_estudioniksen.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c71b4b56f8ebcd56bba4ee/3:4/w_120,c_limit/Affordable%20menswear%20brands_0019_estudioniksen.jpg 120w, https://media.gq-magazine.co.uk/photos/67c71b4b56f8ebcd56bba4ee/3:4/w_240,c_limit/Affordable%20menswear%20brands_0019_estudioniksen.jpg 240w, https://media.gq-magazine.co.uk/photos/67c71b4b56f8ebcd56bba4ee/3:4/w_320,c_limit/Affordable%20menswear%20brands_0019_estudioniksen.jpg 320w, https://media.gq-magazine.co.uk/photos/67c71b4b56f8ebcd56bba4ee/3:4/w_640,c_limit/Affordable%20menswear%20brands_0019_estudioniksen.jpg 640w" sizes="100vw"/>Estudio NiksenBoxy wide fleece£100 Estudio Niksen<img loading="lazy" alt="Image may contain: Clothing, Coat, Jacket, Knitwear, Sweater, and Fleece" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c71b6da234dde0d2f12cab/3:4/w_748%2Cc_limit/Affordable%2520menswear%2520brands_0020_estudioniksen.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c71b6da234dde0d2f12cab/3:4/w_120,c_limit/Affordable%20menswear%20brands_0020_estudioniksen.jpg 120w, https://media.gq-magazine.co.uk/photos/67c71b6da234dde0d2f12cab/3:4/w_240,c_limit/Affordable%20menswear%20brands_0020_estudioniksen.jpg 240w, https://media.gq-magazine.co.uk/photos/67c71b6da234dde0d2f12cab/3:4/w_320,c_limit/Affordable%20menswear%20brands_0020_estudioniksen.jpg 320w, https://media.gq-magazine.co.uk/photos/67c71b6da234dde0d2f12cab/3:4/w_640,c_limit/Affordable%20menswear%20brands_0020_estudioniksen.jpg 640w" sizes="100vw"/>Estudio NiksenDouble-zip pocket sweater£100 Estudio Niksen4| StüssyIt was hailed by US GQ’s Rachel Tashjian as “the Chanel of streetwear,” but Stüssy has a lot to offer in the affordable menswear camp, too. Obviously, you’ve got killer graphic tees – the kind of hallowed grails worn by Goldie, Tom Hardy, and A$AP Rocky. But there’s also heavyweight thermals, and killer beanies in the mix, landing in that golden sub-£100 bracket.Sure, these pieces look great on their own, but they’re also mega for layering. Take the thermal for example, rock it under your favourite beater tee to channel your inner ’90s thrash god. Or rock a blue logo knit beanie with a heavy wool overcoat to tone things down with the brand’s Cali perma-cool.The pieces to buy:<img loading="lazy" alt="Image may contain: Military, Military Uniform, Camouflage, Clothing, and T-Shirt" class="ResponsiveImageContainer-eybHBd fptoWY responsive-im