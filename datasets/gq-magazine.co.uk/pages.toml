["https://gq-magazine.co.uk/article/nothing-phone-3a-review"]
title = "Nothing's Phone (3a) review: The new king of budget phones | British GQ"
description = "Smartly designed with an abundance of personality, the £329 Nothing Phone (3a) offers imperious value against its many charmless rivals"
full_description = '''ShoppingNothing's Phone (3a) is the new king of budget phonesSmartly designed with an abundance of personality, the £329 Nothing Phone (3a) offers imperious value against its many charmless rivalsBy Robert Leedham4 March 2025All products are independently selected by our editors. If you buy something, we may earn an affiliate commission.These are dire times if you want to write anything interesting about a new smartphone. At the top end of the market, they all boast a bunch of new AI powers of varying usefulness. They all feature a seriously great camera and most of them borrow their design cues from Apple’s still imperious iPhone. Thank god the Nothing Phone (3a) has something to say for itself.Ever since Carl Pei’s tech company burst into anarchic life in 2021, it’s made waves by doing things differently and its latest budget-minded offering is no exception. At £329, the Phone (3a) is nearly half the price of Apple’s recent ‘best value’ iPhone 16e. Rather than offer the usual hodgepodge of compromise and half-steps, this handset stands as a commendable product in its own right. Just as we called the Phone (2a) one of 2024’s very best, its successor builds on that legacy with a series of welcome upgrades.By far and away the most interesting thing about the Phone (3a) remains its design. Borrowing from the translucent GameBoy Color and Apple iMac G3s of the ‘90s, the backside of this handset’s 6.77-inch screen is made to resemble a circuit board. Something that’s further elevated by the ‘Glyph’ lighting array on its backside that gives you a unique visual notification for incoming phone calls, timer countdowns and the like. It’s very geek chic – the kind of tech you’d expect to be handed in a neon-drenched Denis Villeneuve movie – but I love the brash aesthetic in the same way I do a pair of Dr. Martens or TAG Heuer Monaco. Those products say something about the people who own them.<img loading="lazy" alt="Image may contain: Electronics, Mobile Phone, Phone, Camera, and Tape Player" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c6d09cc2eb1c36385f1f4d/3:4/w_748%2Cc_limit/NothingPhone.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c6d09cc2eb1c36385f1f4d/3:4/w_120,c_limit/NothingPhone.jpg 120w, https://media.gq-magazine.co.uk/photos/67c6d09cc2eb1c36385f1f4d/3:4/w_240,c_limit/NothingPhone.jpg 240w, https://media.gq-magazine.co.uk/photos/67c6d09cc2eb1c36385f1f4d/3:4/w_320,c_limit/NothingPhone.jpg 320w, https://media.gq-magazine.co.uk/photos/67c6d09cc2eb1c36385f1f4d/3:4/w_640,c_limit/NothingPhone.jpg 640w" sizes="100vw"/>NothingPhone (3a)£329 NothingWith other smartphones, this kind of pretence might fall apart the minute you turn the thing on. Much like Google’s recent Pixel 8a, the Phone (3a) is admirably specced for the price. To be clear, you are not getting anything like a ‘flagship’ phone for your money here, but do you need one? I would suggest probably not and it’s that same sentiment that seems to be driving 2025’s push away from raw power and towards the ultra-thin, super premium Samsung Galaxy S25 Edge phone, as well as the much-rumoured iPhone 17 Air.So for the money, the specs here are solid. You get a punchy AMOLED display that’s just a smidge bigger than last year’s Phone 2(a), the latest Qualcomm Snapdragon 7s Gen 3 processor and an ample 5,000 mAh capacity. As with all devices at this price point, the real sacrifice you’re making can be found in its camera. To this end, the Phone (3a)’s dual camera – you get a 50MP main camera and a 50MP telephoto with up to 4x zoom – is absolutely fine. It’s not amazing in high-contrast settings and you’re going to see more graininess in low light than you would with other more expensive rivals. As a point-and-shoot companion, I think you’ll get on with it OK.For those who do want a more accomplished camera, Nothing is also launching the Phone 3(a) Pro. Why are we calling £449 phones ‘Pro’ these days? I do not know. Nevertheless, this handset is a decent upsell, boasting a three-camera setup (main, periscope and ultrawide), as well as up to 12GB RAM and 256GB storage – the OG Phone 3(a) starts at 8GB RAM and 128GB storage. It’s a good deal, and arguably represents a better buy than the 2023’s Phone 2 – supposedly the best Nothing you can get your hands on right now. Still, most people are going to get on fine with the standard Phone (3a).Of course, given this is the year of our Lord 2025, the Nothing Phone (3a) is launching with some original AI capabilities. In this case, the headline feature is called ‘Essential Space’, which is an AI-powered notes app where screenshots and photos live together with additional context. For example, Sam Fender tour dates and a reminder for when tickets go on sale. It’s a smaller, more focused idea than something as broad as Apple Intelligence, but one with plenty of potential. Especially since it’s been married up with a new, physical Essential Key on the phone’s right-hand frame to make engaging with Essential Space as easy as possible.Although you need to use an app like Essential Space over a number of months to truly judge its worth, I do think that this is a smart implementation of AI from Nothing. Especially since, you’ve already got the likes of Google Gemini and Chat GPT available for Android to handle bigger, more computing-intensive requests and queries. We’ve already reached the point in the AI arms race where no one needs another chatbot that’s built off more or less the same model as most options out there.Nothing Phone (3a) reviewIn the same way that I fully understand why someone would own a Dell laptop, I get the appeal of owning an anonymous, accomplished smartphone that’s going for a good price. Since the Nothing (3a) exists, that choice is redundant. For £329, you get a great smartphone with an abundance of personality. Like any device of its ilk, there are a few compromises you’ll have to make here, most of all with a camera that’s good enough without being great – hence the creation of a superior Phone (3a) Pro. Still, Nothing’s Phone (3a) is a rare thing in tech: a phone that makes you feel something. More of this, please.'''
