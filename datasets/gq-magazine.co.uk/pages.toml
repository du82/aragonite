q-magazine.co.uk/photos/67c71bfdcc0b8f58919cef03/3:4/w_120,c_limit/Affordable%20menswear%20brands_0010_Stussy.jpg 120w, https://media.gq-magazine.co.uk/photos/67c71bfdcc0b8f58919cef03/3:4/w_240,c_limit/Affordable%20menswear%20brands_0010_Stussy.jpg 240w, https://media.gq-magazine.co.uk/photos/67c71bfdcc0b8f58919cef03/3:4/w_320,c_limit/Affordable%20menswear%20brands_0010_Stussy.jpg 320w, https://media.gq-magazine.co.uk/photos/67c71bfdcc0b8f58919cef03/3:4/w_640,c_limit/Affordable%20menswear%20brands_0010_Stussy.jpg 640w" sizes="100vw"/>StüssyCuff beanie£40 Stüssy5| Stan RayBagging great affordable menswear is one thing. But great affordable menswear that’s built to last is even better. And that’s what you get with Stan Ray, the Texas-based workwear label founded in 1972.Carpenter trousers are a brand staple, made from materials like canvas and ripstop which will age like fine-wine. Its hardy indigo denim jacket is cut to a boxy, cropped fit, ideal for layering with a hoodie during transitional weather. Plus, '''
