lly in white, as shown by the brand – for a spring-ready fit.Best holiday linen shirt<source media="(max-width: 767px)" srcSet="https://media.gq-magazine.co.uk/photos/65fd56a3e3c0ed4d93971949/3:4/w_120%2Cc_limit/LinenShirts_Percival.jpg 120w, https://media.gq-magazine.co.uk/photos/65fd56a3e3c0ed4d93971949/3:4/w_240%2Cc_limit/LinenShirts_Percival.jpg 240w, https://media.gq-magazine.co.uk/photos/65fd56a3e3c0ed4d93971949/3:4/w_320%2Cc_limit/LinenShirts_Percival.jpg 320w, https://media.gq-magazine.co.uk/photos/65fd56a3e3c0ed4d93971949/3:4/w_640%2Cc_limit/LinenShirts_Percival.jpg 640w, https://media.gq-magazine.co.uk/photos/65fd56a3e3c0ed4d93971949/3:4/w_800%2Cc_limit/LinenShirts_Percival.jpg 800w" sizes="100vw"/><source media="(min-width: 768px)" srcSet="https://media.gq-magazine.co.uk/photos/65fd56a3e3c0ed4d93971949/3:4/w_320%2Cc_limit/LinenShirts_Percival.jpg 320w, https://media.gq-magazine.co.uk/photos/65fd56a3e3c0ed4d93971949/3:4/w_640%2Cc_limit/LinenShirts_Percival.jpg 640w, https://media.gq-magazine.co.uk/photos/65fd56a3e3c0ed4d93971949/3:4/w_960%2Cc_limit/LinenShirts_Percival.jpg 960w, https://media.gq-magazine.co.uk/photos/65fd56a3e3c0ed4d93971949/3:4/w_1280%2Cc_limit/LinenShirts_Percival.jpg 1280w, https://media.gq-magazine.co.uk/photos/65fd56a3e3c0ed4d93971949/3:4/w_1600%2Cc_limit/LinenShirts_Percival.jpg 1600w, https://media.gq-magazine.co.uk/photos/65fd56a3e3c0ed4d93971949/3:4/w_1920%2Cc_limit/LinenShirts_Percival.jpg 1920w, https://media.gq-magazine.co.uk/photos/65fd56a3e3c0ed4d93971949/3:4/w_2240%2Cc_limit/LinenShirts_Percival.jpg 2240w, https://media.gq-magazine.co.uk/photos/65fd56a3e3c0ed4d93971949/3:4/w_2580%2Cc_limit/LinenShirts_Percival.jpg 2580w" sizes="100vw"/><img loading="lazy" alt="Percival linen shirt as selected by Heidi Quill" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/65fd56a3e3c0ed4d93971949/3:4/w_320%2Cc_limit/LinenShirts_Percival.jpg"/>3/20PercivalCuban Shirt£119 Perci