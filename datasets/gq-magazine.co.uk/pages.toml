title = "England’s Six Nations vibe shift began with an iPad | British GQ"
description = "After a torrid losing streak, England’s men’s rugby team is in with a shot of winning the Six Nations. Powering its analytics team is Apple…"
full_description = '''ShoppingEngland’s Six Nations vibe shift began with an iPadAfter a torrid losing streak, England’s men’s rugby team is in with a shot of winning the Six Nations. Powering its analytics team is Apple…By Robert Leedham27 February 2025GettyAll products are independently selected by our editors. If you buy something, we may earn an affiliate commission.Try as they might, England are incapable of being a boring rugby team. Prior to their Six Nations face-off against France on a dreary February afternoon, Steve Borthwick’s belligerent side had lost six of their last seven games – all of them by single-figure margins. With just a minute left to play, the same familiar abyss is threatening to engulf Twickenham’s Allianz Stadium and its Guinness-soaked inhabitants. France lead 25-19 and beneath the nervous hum of "Swing Low, Sweet Chariot" hatchets are being sharpened in the press box. Seconds later, Fin Smith hurls a glorious, delayed pass into the hands of Elliot Daly and the square-jawed substitute hurls himself across Les Bleus’ goal line.England are the victors. How? No one seems to know. One grimacing Parisian stood next to me offers a shrug of fittingly Gallic proportions. The sodden man stood five rows behind him in a drooping cartoon rooster hat betrays a truer emotion: disbelief. Further back still are two Welshmen, dressed in knee-high Umbro shorts, smiling into their laptops. “Some people think we just crunch numbers through the GPS, others think it’s Moneyball,” explains Carwyn ‘Caz’ Morgan, lead senior team analyst for England Rugby. “The best analysts know which bits of paint to throw onto the wall.”<img alt="Image may contain Charlie Flynn Rory Thornton Carlos Hyde Body Part Finger Hand Person Adult and People" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67bf54e4b5264bd1f5f48b34/master/w_1600%2Cc_limit/England%2520iPad%2520bench.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67bf54e4b5264bd1f5f48b34/master/w_120,c_limit/England%20iPad%20bench.jpg 120w, https://media.gq-magazine.co.uk/photos/67bf54e4b5264bd1f5f48b34/master/w_240,c_limit/England%20iPad%20bench.jpg 240w, https://media.gq-magazine.co.uk/photos/67bf54e4b5264bd1f5f48b34/master/w_320,c_limit/England%20iPad%20bench.jpg 320w, https://media.gq-magazine.co.uk/photos/67bf54e4b5264bd1f5f48b34/master/w_640,c_limit/England%20iPad%20bench.jpg 640w, https://media.gq-magazine.co.uk/photos/67bf54e4b5264bd1f5f48b34/master/w_960,c_limit/England%20iPad%20bench.jpg 960w, https://media.gq-magazine.co.uk/photos/67bf54e4b5264bd1f5f48b34/master/w_1280,c_limit/England%20iPad%20bench.jpg 1280w, https://media.gq-magazine.co.uk/photos/67bf54e4b5264bd1f5f48b34/master/w_1600,c_limit/England%20iPad%20bench.jpg 1600w" sizes="100vw"/>GettyBy now, elite sport’s data era can’t have escaped you. Whether it’s Mikel Arteta remonstrating wildly in the direction of the nearest iPad or your average NFL defensive coordinator surrounding themselves with more touchscreens than a family SUV at half-term, technology has been imbued with the same mythic status as Messi’s left foot. At its balletic best, rugby grinds order out of a 30-person battlefield. At its worst, it's a glorified mud fight. You don’t have to be a stammering Jonah Hill-type to see the appeal of marginal gains to Steve Borthwick’s team.Recently, England have started working with Apple to implement an array of Cupertino-made tech and developer expertise into the 153-year-old sporting institution. It’s an agreement that applies to the men’s, women’s and youth national squads, and – whilst Apple often works with coaches and athletes – this is the first time it has supported a national sports team in Europe. “It’s making a difference already,” Borthwick proclaims a week later from the relative calm of Pennyhill Park training ground. “There were a couple of key moments on Saturday – George Ford [veteran fly-half] wasn’t in the team but he was watching on the bench, studying the game there.” Perhaps to underline the gravity of this new setup, we’re later told the touchline Red Bull fridge has now been swapped out for an iPad cabinet.<img loading="lazy" alt="Image may contain: Computer Hardware, Electronics, Hardware, Computer, and Pc" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67bf235c150ec739e38e9227/3:4/w_748%2Cc_limit/Apple-MacBook-Pro-M4-lineup.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67bf235c150ec739e38e9227/3:4/w_120,c_limit/Apple-MacBook-Pro-M4-lineup.jpg 120w, https://media.gq-magazine.co.uk/photos/67bf235c150ec739e38e9227/3:4/w_240,c_limit/Apple-MacBook-Pro-M4-lineup.jpg 240w, https://media.gq-magazine.co.uk/photos/67bf235c150ec739e38e9227/3:4/w_320,c_limit/Apple-MacBook-Pro-M4-lineup.jpg 320w, https://media.gq-magazine.co.uk/photos/67bf235c150ec739e38e9227/3:4/w_640,c_limit/Apple-MacBook-Pro-M4-lineup.jpg 640w" sizes="100vw"/>AppleMacBook Pro (M4)£1,599 £1,434 Amazon£1,599 Apple<img loading="lazy" alt="apple ipad pro" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/666c02f4419ef65d858b47f7/3:4/w_748%2Cc_limit/iPad-Pro.jpg" srcSet="https://media.gq-magazine.co.uk/photos/666c02f4419ef65d858b47f7/3:4/w_120,c_limit/iPad-Pro.jpg 120w, https://media.gq-magazine.co.uk/photos/666c02f4419ef65d858b47f7/3:4/w_240,c_limit/iPad-Pro.jpg 240w, https://media.gq-magazine.co.uk/photos/666c02f4419ef65d858b47f7/3:4/w_320,c_limit/iPad-Pro.jpg 320w, https://media.gq-magazine.co.uk/photos/666c02f4419ef65d858b47f7/3:4/w_640,c_limit/iPad-Pro.jpg 640w" sizes="100vw"/>AppleiPad Pro (2024)£999 £973 Amazon£999 AppleLooking out onto the team’s drone-monitored lineout practice, the temptation is to portray England training as a Formula 1 pit garage transplanted to rural Surrey – all relentless precision and steely pragmatism. It is that, to a degree, but then there’s also team manager Richard Hill wandering around with an ‘iPhone on a pole’ that he pokes over practice scrums and Johnny Wilkinson popping by to chat kicking technique with Marcus Smith. In a corner of the players’ lounge, there’s a primary school-style presentation board with ‘heroes, hardships and highlights’ belonging to the extended group. Rugby feels important here, but not oppressively so.Up in the training centre that overlooks preparations for England’s upcoming match against Scotland, Caz and his fellow senior team analyst Joe Lewis observe proceedings through an array of control desks and Studio Displays. If beating France was a matter of pride, getting a result next weekend is a necessity. Without it, Finn Russell and company will win a historic five games in a row over their Auld Enemy. Later that afternoon, the pair will cherrypick initial observations on line-outs, formations and other tactical nuances back to Steve Borthwick and the rest of his coaching staff. In the meantime, they are particularly enamoured with the Walkie-Talkie app for Apple Watch where they can message each other as they please outside of the wider team’s radio frequency.<img alt="Image may contain Steve Borthwick Clothing Footwear Shoe People Person Adult Hat Accessories Bag and Handbag" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67bf524360b0c65dcfb28bce/master/w_1600%2Cc_limit/England%2520rugby%2520training.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67bf524360b0c65dcfb28bce/master/w_120,c_limit/England%20rugby%20training.jpg 120w, https://media.gq-magazine.co.uk/photos/67bf524360b0c65dcfb28bce/master/w_240,c_limit/England%20rugby%20training.jpg 240w, https://media.gq-magazine.co.uk/photos/67bf524360b0c65dcfb28bce/master/w_320,c_limit/England%20rugby%20training.jpg 320w, https://media.gq-magazine.co.uk/photos/67bf524360b0c65dcfb28bce/master/w_640,c_limit/England%20rugby%20training.jpg 640w, https://media.gq-magazine.co.uk/photos/67bf524360b0c65dcfb28bce/master/w_960,c_limit/England%20rugby%20training.jpg 960w, https://media.gq-magazine.co.uk/photos/67bf524360b0c65dcfb28bce/master/w_1280,c_limit/England%20rugby%20training.jpg 1280w, https://media.gq-magazine.co.uk/photos/67bf524360b0c65dcfb28bce/master/w_1600,c_limit/England%20rugby%20training.jpg 1600w" sizes="100vw"/>England Rugby ContentGiven the stakes at play and their prestigious legacy – England have won the Six Nations outright more than any other team – you could be forgiven for assuming preparations have always been this meticulous. Legendary flanker Hill assures us we are very much mistaken. “We've had to clear our family home recently and I opened up this box with my first cap on a VHS tape,” says the 2003 World Cup winner. “I would have played the game and it would have been sent to me in the post days later. I don’t know whether people watched those tapes – the quality was awful.”When Hill got that first cap against Scotland in 1997, he joined a team with just two full-time coaches. Now there are more than 20 members of back-room staff in Borthwick’s setup, including strength and conditioning coaches, a nutritionist, and legal counsel. Compared to less than a decade ago, Caz and Lewis’ work is far less precarious, too. “When I first started there was a capture box with a load of Mac Minis and it weighed at least 30 kilos,” says Lewis. “Caz told me, ‘This is how you set it up and run a feed into it, but you’ve got to be careful otherwise it’ll electrocute you.’” During one particularly humid night in Buenos Aires in 2017, he briefly considered “throwing that thing out of the building just to get a new one”.<img alt="Image may contain Ezgjan Alioski Luke CowanDickie Clothing Footwear Shoe Adult Person Rugby Sport and Accessories" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67bf2117b26ca59a1044f472/master/w_1600%2Cc_limit/England%2520vs%2520Scotland%2520rugby.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67bf2117b26ca59a1044f472/master/w_120,c_limit/England%20vs%20Scotland%20rugby.jpg 120w, https://media.gq-magazine.co.uk/photos/67bf2117b26ca59a1044f472/master/w_240,c_limit/England%20vs%20Scotland%20rugby.jpg 240w, https://media.gq-magazine.co.uk/photos/67bf2117b26ca59a1044f472/master/w_320,c_limit/England%20vs%20Scotland%20rugby.jpg 320w, https://media.gq-magazine.co.uk/photos/67bf2117b26ca59a1044f472/master/w_640,c_limit/England%20vs%20Scotland%20rugby.jpg 640w, https://media.gq-magazine.co.uk/photos/67bf2117b26ca59a1044f472/master/w_960,c_limit/England%20vs%20Scotland%20rugby.jpg 960w, https://media.gq-magazine.co.uk/photos/67bf2117b26ca59a1044f472/master/w_1280,c_limit/England%20vs%20Scotland%20rugby.jpg 1280w, https://media.gq-magazine.co.uk/photos/67bf2117b26ca59a1044f472/master/w_1600,c_limit/England%20vs%20Scotland%20rugby.jpg 1600w" sizes="100vw"/>GettyAs pleasant as it must be to own a computer that won’t spark up on an hourly basis, the real benefit of England’s new Apple partnership is the sheer speed at which data can be processed. You can buy the same 16-inch MacBook Pro model with an M4 Max chip yourself, but chances are you aren’t using it to parse six live video streams through the lens of up to 400 metrics that account for everything from passing numbers to territory stats. “Previously it would be seven minutes until halftime and I’d have to start a database for the players to watch,” says Lewis. “Last weekend there was a lineout on 38 minutes and I was able to take that straight down to Ollie Chessum.”“You don’t want to wait until the game’s finished to come up with a solution,” says fly-half George Ford. “At the weekend, we felt like there was a fair bit of space in the backfield on a wet day that we could exploit. I was able to look on the iPad and confirm that.”<img alt="Image may contain Adult Person Computer Electronics Laptop Pc Computer Hardware Hardware Monitor and Screen" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67bf5404b26ca59a1044f4eb/master/w_1600%2Cc_limit/England%2520rugby%2520Twickenham.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67bf5404b26ca59a1044f4eb/master/w_120,c_limit/England%20rugby%20Twickenham.jpg 120w, https://media.gq-magazine.co.uk/photos/67bf5404b26ca59a1044f4eb/master/w_240,c_limit/England%20rugby%20Twickenham.jpg 240w, https://media.gq-magazine.co.uk/photos/67bf5404b26ca59a1044f4eb/master/w_320,c_limit/England%20rugby%20Twickenham.jpg 320w, https://media.gq-magazine.co.uk/photos/67bf5404b26ca59a1044f4eb/master/w_640,c_limit/England%20rugby%20Twickenham.jpg 640w, https://media.gq-magazine.co.uk/photos/67bf5404b26ca59a1044f4eb/master/w_960,c_limit/England%20rugby%20Twickenham.jpg 960w, https://media.gq-magazine.co.uk/photos/67bf5404b26ca59a1044f4eb/master/w_1280,c_limit/England%20rugby%20Twickenham.jpg 1280w, https://media.gq-magazine.co.uk/photos/67bf5404b26ca59a1044f4eb/master/w_1600,c_limit/England%20rugby%20Twickenham.jpg 1600w" sizes="100vw"/>GettyAs anyone who has picked up an Apple Pencil in the hope of instantly emulating Picasso will know, this tech is not a guaranteed ‘win mode’. In the case of England, it’s a tool for the intuition of people who’ve played and watched the game for a long time now – and sometimes gut feel says the vibes are off. At 2019’s World Cup final, England were the favourites against South Africa, having already beaten Australia and New Zealand on the bounce. “I was all giddy, ‘We're gonna beat them’, as most people thought,” says Lewis. “Caz just went, ‘Something doesn't feel quite right.’” Come full-time in Yokohama, Japan, a dejected England were collecting their runners-up medals.It’s a week on from our trip to Pennyhill Park, and Twickenham is in a familiar, anxiety-wrecked situation. England are leading 16-15 in the 80th minute, but Finn Russell is lining up a conversion kick to drag the brilliantly resilient Scots to that fifth historic win in a row. He steps back, exhales and swings the ball just wide of the left-hand post. There’s no time left in the game for a comeback and two Welshmen in the stands are breathing a sigh of blessed relief into their MacBooks. England have won two games in a row for the first time in a year and are genuine Six Nations contenders again. Whatever comes next, you can be sure it won’t be boring.'''
