["https://gq-magazine.co.uk/article/southport-riots"]
title = "The Untold Story of the Southport Riots | British GQ"
description = "Last summer, the murders of three children in Southport by Axel Rudakubana triggered a contagion of violence that spread throughout the country practically overnight. The speed and ease with which the riots took shape – propagated by angry men, distorted by social media falsehoods, and amplified by anti-immigrant opportunists – helps explain why this post-truth moment in the UK, the US, and beyond feels so dangerous."
full_description = 'PoliticsThe untold story of the Southport riotsLast summer, the murders of three children in Southport triggered a contagion of violence throughout the UK. The speed and anger with which the riots took shape – propagated by angry men, distorted by social media, and amplified by anti-immigrant opportunists – captured why this political moment feels so dangerous.By Sean Flynn4 March 2025Photo Illustrations by Alicia Tatone. Photographs clockwise from top left: Gary Calton/Redux (4); Hollie Adams/Reuters; Manon Cruz/Reuters; Simone J. Rudolphi/Getty Images (2); Jim Wood/Getty Images.One morning after the first terrible thing happened, Patrick Hurley was on Tithebarn Road near the corner of Hart Street, cradling a bouquet of lilies and pale-green chrysanthemums. The home secretary, Yvette Cooper, was in Southport as well, and she had her own bunch of flowers. She walked a half step ahead of Hurley as they crossed the street to a low, curved wall with a hedge on top, where a dozen or so news crews watched them lay their flowers among those already on the pavement in a makeshift monument. They stopped for a moment near the police cordon, reading notes others had left, whispering to each other. But they did not speak to the cameras because, really, there was little left to say.Twenty-four hours earlier, in a studio called the Hart Space, a 17-year-old boy with a kitchen knife attacked 13 people. Eleven of them were children enjoying the summer holidays. They were there to practise yoga and make bracelets and dance to Taylor Swift songs. Three girls, aged six, seven, and nine, were killed. There was no apparent motive, no obvious reason – how could there be to butcher children? – other than a disturbed spasm of horrific savagery.Hurley had been in London that morning, Monday, 29 July, which also happened to be the first day of his fourth week as the MP for Southport. He’d been elected just 25 days earlier in a Labour landslide that ended 14 years of Conservative rule; in fact, Hurley is the first Labour MP ever elected in Southport. “It doesn’t matter if you’ve been there for three weeks or 30 years,” he says – responding to a slaughter was unprecedented for an elected representative in these parts.He put out an anodyne statement of thoughts and prayers and a promise to “stand strong against this mindless violence” and then got on a train to Southport. “A sleepy little seaside town,” Hurley calls it, which is apt. “Not much excitement. In a nice way.”Hurley met police and council officials that evening, and in the morning he laid flowers with the home secretary while reporters quietly watched. The mood was sombre and subdued and unbearably sad.A few hours later, Hurley was back on Tithebarn Road. The Prime Minister, who’d been in that position for precisely as long as Hurley had been an MP, had come to add his own flowers to the growing pile. “But the atmosphere,” Hurley says, “had completely changed.”There were many more people, several holding up phones to film videos that would be posted to Facebook and TikTok and X. As Keir Starmer approached with a small wreath, two or three started to yell things at him. “How many more children have got to die on our streets, Prime Minister?” a big, bald fella said. “How many more children? Is it mine next?” Then he turned and asked no one in particular, “Is he going to stand up for our children?”Then the second terrible thing began to happen.“By the evening, we kept getting calls,” Ibrahim Hussein says. “We were told that social media was going berserk, that something’s not right. Something’s brewing. And that you need a lot of protection.”Hussein assumed there must be a misunderstanding. He’d lived in Southport for 20 years, and one thing he particularly enjoyed was the lack of things brewing. “A very nice, sleepy town,” he says. “Full of old people and retired people, and there is nothing happening here. Nothing. So when I decided to retire, I came here.”He used to run a mini-market in London, and is now the chairman of the Southport Mosque and Islamic Cultural Society Centre, which has been there even longer than him, 30 years. It’s in the middle of town, a short walk from the station and Lord Street. They – Hussein, the mosque, the people who worship there – are as much a part of Southport as Victoria Park or the lawnmower museum.“The murders happened about three minutes’, four minutes’ walk from here,” he says. Indeed, the corner where the police cordoned off Hart Street for the memorial is halfway between the mosque and the crime scene. “Obviously, we were all devastated, just like everyone else.”He expected to attend the vigils, to lay flowers at the memorial, to stand with the other clerics and mourners. He wanted to do those things, wanted to bring comfort to his community as best he could. But the night before, just hours after the murders, he started getting calls. “So we started to watch some of it and hear some of it, and we got a few more messages,” he says. “And this is on that very same evening.”Earlier on Monday afternoon, a neo-Nazi calling himself Stimpy – the Nazi flag and armband were clues – had created a channel on Telegram called Southport Wake Up. Within hours, someone posted a graphic of a bloody handprint beneath the words “Enough is enough.” Below, stacked in five lines of bold type, were: “PROTEST, Tuesday 30 July, 8pm, St Luke’s Road, Southport.”The mosque is at the corner of Sussex and St Luke’s roads. A second graphic showed a man in a grey balaclava with a hoodie pulled tight around his head. “No face, no case,” it read. “Protect your identity.”That struck Hussein, initially, as peculiar, possibly absurd: the mosque’s only connection to the murders of three little girls is that it happened to be in the same town. At that point, only hours after the attacks, authorities had not released the suspect’s name or any details other than that he was male and had a knife. Publicly, he was a cipher.Before there had even been time to grieve, those waves were being distorted into something else entirely: a rallying cry for a cause that had little to do with Southport and nothing at all to do with three dead little girls.Yet social media was full of certainty. By dusk, a writer on The European Conservative wrote on X that “a migrant stabbed numerous children at a holiday nursery.” The American right-wing commentator Andy Ngo, who wrote a book about Antifa’s plan to destroy the United States, reported the news straight to his 1.6 million followers – mass stabbing, suspect apprehended – but then added this odd context: “Last October, an illegal migrant stabbed an elderly Englishman to death in Hartlepool for Islam & Gaza.” Ngo did not explain why that was relevant. Accused rapist and alleged human trafficker Andrew Tate, who nonetheless has 10.5 million followers on X, began a three-and-a-half-minute rant with: “So an undocumented migrant decided to go into a Taylor Swift dance class today and stab six little girls.” Even one of the replies to Patrick Hurley’s statement included a screenshot from a fake news site that claimed the suspect was a teenager named Ali al-Shakati who’d arrived by boat and “was on an MI6 watch list and was known to Liverpool mental health services.”None of that was true.But it was out there, tumbling through the ether like vapour, then condensing in fat, oily drops on places like Southport Wake Up. Another graphic, two lines of type — “ISLAM ATTACKS AGAIN/HOW MANY MORE TIMES” – overlaid on a satellite map of Southport. The mosque was circled in red.“It didn’t sound like the Southport I know,” Hussein says now. “But you could tell that these messages were coming from outside of town. OK? You see, these are not locals, these are an organisation from somewhere that is planning to come and, you know, are determined to do some trouble.”It was understandable that such a monstrous crime would send shockwaves far outside the town where it was committed. But before there’d even been time to grieve, those first waves were bouncing and echoing and being distorted into something else entirely: a sort of rallying cry for a cause that had little to do with Southport and nothing at all to do with three dead little girls.Hussein puts his hands on his desk, slumps a little, as if he’s exhausted by things he cannot change. “All I could do was wait, really,” he says. “There was nothing else you could do.”The next day, Tuesday, Hussein checked in with the local police. The Home Office sent security. During midday prayers, he told the congregation: “There is a lot of trouble coming our way.” He skipped the vigil in the early evening so he wouldn’t be a distraction. Shortly before eight o’clock, he was in the courtyard, behind the low wall fronting the road, with the Home Office security and three young Muslim men.“At about eight o’clock, it started to build,” he says. “There were a couple of blokes standing on the other side looking over the fence, and then the two became five and the five became 50 and the 50 became 500. Then the abuse started and the chanting started, you know, the F-words and the C-words and all that.” Someone yelled, We want our country back! and the crowd picked up the chant.Then: Who the fuck is Allah? And the crowd joined that one too.Men – the mob was almost all men – advanced to the courtyard wall, moving as a single unit. They kicked at the brick base, pushed on the fencing. One panel went down, then a second, then the entire wall. Rioters grabbed loose bricks from the pavement, hurled them at police and windows. A man in a black T-shirt threw a brick, jumped on the bonnet of a white car, then went back for another chunk of broken wall.“We decided, obviously this is getting out of hand,” Hussein says. “So we went inside and locked the door. Unfortunately, it was a PVC door, you know, one of the plastic ones. Anyone can kick that and go in in no time at all.”Hussein and the rest of them, seven men in all, went to the second floor, to Hussein’s office. It’s small, cramped, but they could monitor the security cameras, see any threats coming. They locked themselves in.“It was a wooden door,” he says. “They can also break through it. But at least we’re all here. If we’re all in one place, perhaps we can defend ourselves somehow.”<img alt="Image may contain Art Collage Painting Person Car Transportation Vehicle and Adult" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c43a1205830e321f4a425a/master/w_1600%2Cc_limit/GQ_SouthportRiots_Secondary1_Revise2B.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67c43a1205830e321f4a425a/master/w_120,c_limit/GQ_SouthportRiots_Secondary1_Revise2B.jpg 120w, https://media.gq-magazine.co.uk/photos/67c43a1205830e321f4a425a/master/w_240,c_limit/GQ_SouthportRiots_Secondary1_Revise2B.jpg 240w, https://media.gq-magazine.co.uk/photos/67c43a1205830e321f4a425a/master/w_320,c_limit/GQ_SouthportRiots_Secondary1_Revise2B.jpg 320w, https://media.gq-magazine.co.uk/photos/67c43a1205830e321f4a425a/master/w_640,c_limit/GQ_SouthportRiots_Secondary1_Revise2B.jpg 640w, https://media.gq-magazine.co.uk/photos/67c43a1205830e321f4a425a/master/w_960,c_limit/GQ_SouthportRiots_Secondary1_Revise2B.jpg 960w, https://media.gq-magazine.co.uk/photos/67c43a1205830e321f4a425a/master/w_1280,c_limit/GQ_SouthportRiots_Secondary1_Revise2B.jpg 1280w, https://media.gq-magazine.co.uk/photos/67c43a1205830e321f4a425a/master/w_1600,c_limit/GQ_SouthportRiots_Secondary1_Revise2B.jpg 1600w" sizes="100vw"/>Photographs from top: Temilade Adelaja/Reuters; Gary Calton/Redux (2).Norman Wallis learned about the stabbings within an hour. He was standing at the entrance to Southport Pleasureland, the amusement park he owns – log flume, a big, swinging pirate ship – when a frantic lady scrambled up to him. “Close the gates,” she said. “You’ve got to close all the gates. There’s a madman stabbing people in town!”The shock was almost numbing. The grief, he knew, must be unfathomable. Did he know any of the families? If not, then he surely knew someone who did. Almost 95,000 people live in Southport, but the place has always felt smaller, tighter. In a curious way, it was an intensely personal crime even among strangers. Yet it was, of course, a very public crime, in a country, that has not yet, unlike the US, dulled itself to the killing of children. Within an hour, emails were pinging the office inbox, people cancelling their bookings for Pleasureland. Most tourists don’t want to holiday in a place where they fear they might be randomly slashed to death.These weren’t people from Southport. They almost looked like a military unit. Of men. Big men. and on the other side, it was completely different. It was local people, with kids there as well, looking to see what was going on.This was disastrous. Southport has always been a tourist town, and August has always been its most lucrative month. Doctors in the sooty cities used to send their patients to convalesce in the salty Irish Sea. In 1860, after iron pilings were driven into the sand, a pier – the second longest in the country – opened. Pleasureland opened just along the beach in 1922, and it’s been there in one form or another ever since, except for 2006, when the owner shut it down and Wallis bought the scraps and rebuilt everything. It’s only open from spring to autumn, but still draws about half a million tourists yearly. Neither Wallis nor Southport could afford to lose half of the season.Wallis didn’t know what was being said online because he doesn’t follow social media. But the next day, Tuesday, there was a gathering on Lord Street, in the middle of town. “There were lots of flowers, and they were doing a ceremony for the kids. And then some people noticed that there were some guys that were drinking and not part…” He’s searching for the right word. “They were out of place,” he says. “And next thing, that early evening, there was smoke at the mosque.”The town, part of it, was on fire, clouds of black smoke rising into the evening air. Wallis went to have a look. He was shocked. St Luke’s Road was impassable, clogged with police in riot gear and people he didn’t recognise. “These weren’t people from Southport,” he says. “They almost looked like a military unit. Of men. Big men.” A police van was on fire, orange flames curling around the chassis, dissolving into the smoke he’d seen from a distance. Wallis turned round, went round the block, came from the opposite direction. “And on the other side it was completely different. It was local people, with kids there as well, looking to see what was going on. Everyone was, like, spectating this thing.” He heard people talking, too, wondering where those big men on the other side came from.Rioters had started another fire, a steel box filled with donated clothing directly below Hussein’s office, and the smoke poured in through an open window that he couldn’t close because every time he '
