title = "Premier Inn Mattress 2.0 review 2025: Is it worth it?  | British GQ"
description = "Checking us in for the sleep upgrade of the year, Premier Inn's 2.0 mattress is an unexpected winner"
full_description = '''ShoppingPremier Inn's 2.0 mattress is the merch drop that'll save your sleepChecking us in for the sleep upgrade of the year, Premier Inn's 2.0 mattress is an unexpected winnerBy David Levesley26 February 2025All products are independently selected by our editors. If you buy something, we may earn an affiliate commission.About ten years ago, it feels like we experienced a new economy in mattresses: new start-ups selling rolled up, light mattresses that turned an otherwise deeply mercenary purchase into something requiring a bit more discernment.Just like everyone else, I got one of these very sexy mattresses during the height of their powers. I don’t regret the decision either – my Simba mattress was the best mattress I’d ever had and, to be honest, I think there’d have been a lot more arguments between me and my partner without such an incredibly comfy place to sleep every night. But six or so years in, due to our own failure to flip it as much as we should, our Simba was beginning to sag in the middle and seemed to be doing as much harm as it once did good. So where do you go now that the great age of the modern mattress start-up has cooled, and they’re just part of the firmament with the other big names?We decided to take a punt on, perhaps, a peculiar if familiar name: Premier Inn. I’ve stayed in a lot of Premier Inns in my time - don’t hold that against me - and while my sleep has never been bad in them I’ve never craved one of their mattresses the way I’ve craved, say, the SoulCycle candles or Kerridge’s Bar and Grill’s pickle ketchup. It didn’t strike me as a natural merch drop, but I couldn’t deny that their Mattress 2.0 looked incredibly comfy. So I thought: why not? And lo and behold: I couldn’t be happier with my new mattress.<img loading="lazy" alt="Image may contain: Furniture, Mattress, and Bed" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67aa0c5d0c41758a0acad310/3:4/w_748%2Cc_limit/PremierInnmattressreview_Premiereinn2.jpg" srcSet="https://media.gq-magazine.co.uk/photos/67aa0c5d0c41758a0acad310/3:4/w_120,c_limit/PremierInnmattressreview_Premiereinn2.jpg 120w, https://media.gq-magazine.co.uk/photos/67aa0c5d0c41758a0acad310/3:4/w_240,c_limit/PremierInnmattressreview_Premiereinn2.jpg 240w, https://media.gq-magazine.co.uk/photos/67aa0c5d0c41758a0acad310/3:4/w_320,c_limit/PremierInnmattressreview_Premiereinn2.jpg 320w, https://media.gq-magazine.co.uk/photos/67aa0c5d0c41758a0acad310/3:4/w_640,c_limit/PremierInnmattressreview_Premiereinn2.jpg 640w" sizes="100vw"/>Premier Inn 2.0 Mattress£609 Premier Inn At HomeThe SpecsThe Premier Inn Mattress 2.0 isn’t doing anything too crazy, but it does pride itself on four features; a surface that temperature regulates, support for sleepers from edge to edge (meaning the entire area is optimised for sleep rather than pockets), an energy-giving gel layer that supports “free movement” - someone alert UKIP – and an “ultra comfy pillowtop layer”.I am but an everyman when it comes to sleep, so the exact technicalities of these features are normally something I only look into once I stumble across a problem. In this case, I've found none. It's worth pointing out the support across the mattress surface. Although still brand new, it is a much sturdier mattress than our last one was, and does feel like it provides an even sleeping experience across its entire surface area. Temperature regulation hasn’t been a huge priority in the coldest winter known to man, but the mattress has definitely been both comfortable and energising, so those layers must be doing something right.How it fits in the spaceFor anyone else who went to Eve, Emma, Simba et al for their last mattress, the 2.0 is a very different beast: it doesn’t come rolled up, so you will need help getting it on your bed frame.It’s also much, much thicker - this means that, depending on your current bedframe, you might find yourself suddenly at a very different altitude in the bedroom, which might have an impact on how you’re currently using your bedside tables or just how you navigate waking up. It took a few days to get used to being so much higher up than our old, relatively thin, Simba. That being said, it seems the gel layer and ultra comfy pillowtop layer have done wonders for our lumbar: the lower back pains that began to plague us towards the end of our last mattress feel like a thing of the past already.Is it worth the price tag?At £799 for the King, the Premier Inn Mattress 2.0 isn’t a massive saving on trendier brands. However, it is undeniable that, even after a few weeks on the beast, me and my partner are both sleeping phenomenally with very few aches and pains. We have been ill for much of January - so how much of this is causation or correlation is hard to tell – but we’ve been incredibly happy with our sleep every night, and the mattress definitely feels much sturdier for two hirsute bears to roll around on.If you’re looking for a switch up, I’d heavily recommend emulating every wedding weekend hotel stay you’ve had - apparently, Premier Inn holds the secret to a perfect night’s slumber.Shop here'''
