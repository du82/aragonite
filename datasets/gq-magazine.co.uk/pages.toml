title = "Oscars 2025: all of the best-dressed men from the red carpet | British GQ"
description = "The biggest night in Hollywood also happens to be a pretty consequential one for fashion, too"
full_description = '''FashionOscars 2025: all of the best-dressed men from the red carpetThe biggest night in Hollywood also happens to be a pretty consequential one for fashion, tooBy The Editors of GQ2 March 2025ROBYN BECK/Getty ImagesIt’s the big one folks. The best-dressed men at the Oscars 2025 have landed, and here lies the culmination of countless hours from Hollywood stylists and their fashion teams.In the hotly contended best actor category, Adrien Brody and Timothée Chalamet have been battling it out. At the Golden Globes it went to Brody, and last week’s SAG Awards saw Chalamet top off a stellar press run for A Complete Unknown with a win. Sebastian Stan, Ralph Fiennes, and Colman Domingo are also nominated in the category – so no notes menswear is guaranteed.From always-appreciated Hollywood classicism, to another ceremonial summit for the Hollywood brooch fellowship, the best-dressed men at the Oscars 2025 delivered a predictably killer assembly. Scroll on for all the biggest and best looks from the night.Timothée Chalamet<img alt="Oscars 2025 all of the bestdressed men from the red carpet" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c4e621a0c57cf7bd22628d/master/w_1600%2Cc_limit/2202910193" srcSet="https://media.gq-magazine.co.uk/photos/67c4e621a0c57cf7bd22628d/master/w_120,c_limit/2202910193 120w, https://media.gq-magazine.co.uk/photos/67c4e621a0c57cf7bd22628d/master/w_240,c_limit/2202910193 240w, https://media.gq-magazine.co.uk/photos/67c4e621a0c57cf7bd22628d/master/w_320,c_limit/2202910193 320w, https://media.gq-magazine.co.uk/photos/67c4e621a0c57cf7bd22628d/master/w_640,c_limit/2202910193 640w, https://media.gq-magazine.co.uk/photos/67c4e621a0c57cf7bd22628d/master/w_960,c_limit/2202910193 960w, https://media.gq-magazine.co.uk/photos/67c4e621a0c57cf7bd22628d/master/w_1280,c_limit/2202910193 1280w, https://media.gq-magazine.co.uk/photos/67c4e621a0c57cf7bd22628d/master/w_1600,c_limit/2202910193 1600w" sizes="100vw"/>Monica Schipper/Getty ImagesThe Hollywood prince that was promised, Timothée Chalamet once again cemented himself as chief rule-breaker of the red carpet. For the Oscars, that meant a zesty lemon Givenchy suit and wait... are they... jeans?Sebastian Stan<img alt="Oscars 2025 all of the bestdressed men from the red carpet" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c4e7cba0c57cf7bd22628f/master/w_1600%2Cc_limit/2202911608" srcSet="https://media.gq-magazine.co.uk/photos/67c4e7cba0c57cf7bd22628f/master/w_120,c_limit/2202911608 120w, https://media.gq-magazine.co.uk/photos/67c4e7cba0c57cf7bd22628f/master/w_240,c_limit/2202911608 240w, https://media.gq-magazine.co.uk/photos/67c4e7cba0c57cf7bd22628f/master/w_320,c_limit/2202911608 320w, https://media.gq-magazine.co.uk/photos/67c4e7cba0c57cf7bd22628f/master/w_640,c_limit/2202911608 640w, https://media.gq-magazine.co.uk/photos/67c4e7cba0c57cf7bd22628f/master/w_960,c_limit/2202911608 960w, https://media.gq-magazine.co.uk/photos/67c4e7cba0c57cf7bd22628f/master/w_1280,c_limit/2202911608 1280w, https://media.gq-magazine.co.uk/photos/67c4e7cba0c57cf7bd22628f/master/w_1600,c_limit/2202911608 1600w" sizes="100vw"/>Frazer HarrisonSebastian Stan's old school tux is the sort of fit that takes you for a night at the opera, then darts at a dive bar straight after until 4am. Get yourself a suit that does both.Adrien Brody<img alt="Oscars 2025 all of the bestdressed men from the red carpet" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c4e822881994b16719e146/master/w_1600%2Cc_limit/2202911751" srcSet="https://media.gq-magazine.co.uk/photos/67c4e822881994b16719e146/master/w_120,c_limit/2202911751 120w, https://media.gq-magazine.co.uk/photos/67c4e822881994b16719e146/master/w_240,c_limit/2202911751 240w, https://media.gq-magazine.co.uk/photos/67c4e822881994b16719e146/master/w_320,c_limit/2202911751 320w, https://media.gq-magazine.co.uk/photos/67c4e822881994b16719e146/master/w_640,c_limit/2202911751 640w, https://media.gq-magazine.co.uk/photos/67c4e822881994b16719e146/master/w_960,c_limit/2202911751 960w, https://media.gq-magazine.co.uk/photos/67c4e822881994b16719e146/master/w_1280,c_limit/2202911751 1280w, https://media.gq-magazine.co.uk/photos/67c4e822881994b16719e146/master/w_1600,c_limit/2202911751 1600w" sizes="100vw"/>Frazer HarrisonThe Brutalist's Adrien Brody pulled up in his most noblest form. The biggest, brightest brooch of the night will do that for any guy, as will unimpeachable tailoring from Giorgio Armani.Andrew Garfield<img alt="Oscars 2025 all of the bestdressed men from the red carpet" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c4f08a881994b16719e14c/master/w_1600%2Cc_limit/2202916757" srcSet="https://media.gq-magazine.co.uk/photos/67c4f08a881994b16719e14c/master/w_120,c_limit/2202916757 120w, https://media.gq-magazine.co.uk/photos/67c4f08a881994b16719e14c/master/w_240,c_limit/2202916757 240w, https://media.gq-magazine.co.uk/photos/67c4f08a881994b16719e14c/master/w_320,c_limit/2202916757 320w, https://media.gq-magazine.co.uk/photos/67c4f08a881994b16719e14c/master/w_640,c_limit/2202916757 640w, https://media.gq-magazine.co.uk/photos/67c4f08a881994b16719e14c/master/w_960,c_limit/2202916757 960w, https://media.gq-magazine.co.uk/photos/67c4f08a881994b16719e14c/master/w_1280,c_limit/2202916757 1280w, https://media.gq-magazine.co.uk/photos/67c4f08a881994b16719e14c/master/w_1600,c_limit/2202916757 1600w" sizes="100vw"/>Savion Washington/Getty ImagesNot everyone can balance 'Oscars red carpet fit' and 'Italian casino-owner dining with the high rollers.' But then, not everyone is Andrew Garfield in a silk espresso brown Gucci suit.Jeff Goldblum<img alt="Oscars 2025 all of the bestdressed men from the red carpet" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c4ce15881994b16719e13a/master/w_1600%2Cc_limit/2202334281" srcSet="https://media.gq-magazine.co.uk/photos/67c4ce15881994b16719e13a/master/w_120,c_limit/2202334281 120w, https://media.gq-magazine.co.uk/photos/67c4ce15881994b16719e13a/master/w_240,c_limit/2202334281 240w, https://media.gq-magazine.co.uk/photos/67c4ce15881994b16719e13a/master/w_320,c_limit/2202334281 320w, https://media.gq-magazine.co.uk/photos/67c4ce15881994b16719e13a/master/w_640,c_limit/2202334281 640w, https://media.gq-magazine.co.uk/photos/67c4ce15881994b16719e13a/master/w_960,c_limit/2202334281 960w, https://media.gq-magazine.co.uk/photos/67c4ce15881994b16719e13a/master/w_1280,c_limit/2202334281 1280w, https://media.gq-magazine.co.uk/photos/67c4ce15881994b16719e13a/master/w_1600,c_limit/2202334281 1600w" sizes="100vw"/>ROBYN BECK/Getty ImagesIt's not a red carpet without Jeff Goldblum wearing something delightfully and deliciously OTT. The Wicked star paired a cream suit, floral patterned vest, purple scarf, boutonnière and green tinted glasses, as only Goldblum can.Colman Domingo<img alt="Oscars 2025 all of the bestdressed men from the red carpet" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c4ecf4881994b16719e14a/master/w_1600%2Cc_limit/2202916448" srcSet="https://media.gq-magazine.co.uk/photos/67c4ecf4881994b16719e14a/master/w_120,c_limit/2202916448 120w, https://media.gq-magazine.co.uk/photos/67c4ecf4881994b16719e14a/master/w_240,c_limit/2202916448 240w, https://media.gq-magazine.co.uk/photos/67c4ecf4881994b16719e14a/master/w_320,c_limit/2202916448 320w, https://media.gq-magazine.co.uk/photos/67c4ecf4881994b16719e14a/master/w_640,c_limit/2202916448 640w, https://media.gq-magazine.co.uk/photos/67c4ecf4881994b16719e14a/master/w_960,c_limit/2202916448 960w, https://media.gq-magazine.co.uk/photos/67c4ecf4881994b16719e14a/master/w_1280,c_limit/2202916448 1280w, https://media.gq-magazine.co.uk/photos/67c4ecf4881994b16719e14a/master/w_1600,c_limit/2202916448 1600w" sizes="100vw"/>Kevin Mazur/Getty ImagesSing Sing star Colman Domingo is seeing red. In a wrap-style jacket featuring contrasting black lapels, Domingo went red on red in custom Valentino. The accessories — brooch, stacked bracelets, a pair of shades — bring it home.Ralph Fiennes<img alt="Oscars 2025 all of the bestdressed men from the red carpet" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c4f3639cc1cbc81ec0c042/master/w_1600%2Cc_limit/2202377475" srcSet="https://media.gq-magazine.co.uk/photos/67c4f3639cc1cbc81ec0c042/master/w_120,c_limit/2202377475 120w, https://media.gq-magazine.co.uk/photos/67c4f3639cc1cbc81ec0c042/master/w_240,c_limit/2202377475 240w, https://media.gq-magazine.co.uk/photos/67c4f3639cc1cbc81ec0c042/master/w_320,c_limit/2202377475 320w, https://media.gq-magazine.co.uk/photos/67c4f3639cc1cbc81ec0c042/master/w_640,c_limit/2202377475 640w, https://media.gq-magazine.co.uk/photos/67c4f3639cc1cbc81ec0c042/master/w_960,c_limit/2202377475 960w, https://media.gq-magazine.co.uk/photos/67c4f3639cc1cbc81ec0c042/master/w_1280,c_limit/2202377475 1280w, https://media.gq-magazine.co.uk/photos/67c4f3639cc1cbc81ec0c042/master/w_1600,c_limit/2202377475 1600w" sizes="100vw"/>JC Olivera/Getty ImagesThe ultra fine white edge on Ralph Fiennes' black bowtie is all the detail he needs to add another level to his clean black tux.Sterling K. Brown<img alt="Oscars 2025 all of the bestdressed men from the red carpet" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c4f41eb84eb678c3437f62/master/w_1600%2Cc_limit/2202920506" srcSet="https://media.gq-magazine.co.uk/photos/67c4f41eb84eb678c3437f62/master/w_120,c_limit/2202920506 120w, https://media.gq-magazine.co.uk/photos/67c4f41eb84eb678c3437f62/master/w_240,c_limit/2202920506 240w, https://media.gq-magazine.co.uk/photos/67c4f41eb84eb678c3437f62/master/w_320,c_limit/2202920506 320w, https://media.gq-magazine.co.uk/photos/67c4f41eb84eb678c3437f62/master/w_640,c_limit/2202920506 640w, https://media.gq-magazine.co.uk/photos/67c4f41eb84eb678c3437f62/master/w_960,c_limit/2202920506 960w, https://media.gq-magazine.co.uk/photos/67c4f41eb84eb678c3437f62/master/w_1280,c_limit/2202920506 1280w, https://media.gq-magazine.co.uk/photos/67c4f41eb84eb678c3437f62/master/w_1600,c_limit/2202920506 1600w" sizes="100vw"/>Jeff KravitzWhite tuxedos don't come more classic than this dime on Sterling K. Brown. The tiny white gold brooch on his lapel is the perfect touch.Kieran Culkin and Jazz Charton<img alt="Oscars 2025 all of the bestdressed men from the red carpet" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c4eb1d881994b16719e148/master/w_1600%2Cc_limit/2202913570" srcSet="https://media.gq-magazine.co.uk/photos/67c4eb1d881994b16719e148/master/w_120,c_limit/2202913570 120w, https://media.gq-magazine.co.uk/photos/67c4eb1d881994b16719e148/master/w_240,c_limit/2202913570 240w, https://media.gq-magazine.co.uk/photos/67c4eb1d881994b16719e148/master/w_320,c_limit/2202913570 320w, https://media.gq-magazine.co.uk/photos/67c4eb1d881994b16719e148/master/w_640,c_limit/2202913570 640w, https://media.gq-magazine.co.uk/photos/67c4eb1d881994b16719e148/master/w_960,c_limit/2202913570 960w, https://media.gq-magazine.co.uk/photos/67c4eb1d881994b16719e148/master/w_1280,c_limit/2202913570 1280w, https://media.gq-magazine.co.uk/photos/67c4eb1d881994b16719e148/master/w_1600,c_limit/2202913570 1600w" sizes="100vw"/>Monica Schipper/Getty ImagesAnother win for the all-black union, Kieran Culkin makes peak black tie look like the chillest thing in the world in Zegna.Jeremy Strong<img alt="Oscars 2025 all of the bestdressed men from the red carpet" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c4e9b3e3b5c0c8b64f94b7/master/w_1600%2Cc_limit/2202913297" srcSet="https://media.gq-magazine.co.uk/photos/67c4e9b3e3b5c0c8b64f94b7/master/w_120,c_limit/2202913297 120w, https://media.gq-magazine.co.uk/photos/67c4e9b3e3b5c0c8b64f94b7/master/w_240,c_limit/2202913297 240w, https://media.gq-magazine.co.uk/photos/67c4e9b3e3b5c0c8b64f94b7/master/w_320,c_limit/2202913297 320w, https://media.gq-magazine.co.uk/photos/67c4e9b3e3b5c0c8b64f94b7/master/w_640,c_limit/2202913297 640w, https://media.gq-magazine.co.uk/photos/67c4e9b3e3b5c0c8b64f94b7/master/w_960,c_limit/2202913297 960w, https://media.gq-magazine.co.uk/photos/67c4e9b3e3b5c0c8b64f94b7/master/w_1280,c_limit/2202913297 1280w, https://media.gq-magazine.co.uk/photos/67c4e9b3e3b5c0c8b64f94b7/master/w_1600,c_limit/2202913297 1600w" sizes="100vw"/>Monica Schipper/Getty ImagesYes, going for Loro Piana is a pretty Kendall Roy move. For Jeremy Strong though, it was less off-duty tech bro and more Hollywood titan thanks to silky champagnes throughout.Willem Dafoe<img alt="Oscars 2025 all of the bestdressed men from the red carpet" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c4e281f0ce5bdd7a9aa0fc/master/w_1600%2Cc_limit/2202907862" srcSet="https://media.gq-magazine.co.uk/photos/67c4e281f0ce5bdd7a9aa0fc/master/w_120,c_limit/2202907862 120w, https://media.gq-magazine.co.uk/photos/67c4e281f0ce5bdd7a9aa0fc/master/w_240,c_limit/2202907862 240w, https://media.gq-magazine.co.uk/photos/67c4e281f0ce5bdd7a9aa0fc/master/w_320,c_limit/2202907862 320w, https://media.gq-magazine.co.uk/photos/67c4e281f0ce5bdd7a9aa0fc/master/w_640,c_limit/2202907862 640w, https://media.gq-magazine.co.uk/photos/67c4e281f0ce5bdd7a9aa0fc/master/w_960,c_limit/2202907862 960w, https://media.gq-magazine.co.uk/photos/67c4e281f0ce5bdd7a9aa0fc/master/w_1280,c_limit/2202907862 1280w, https://media.gq-magazine.co.uk/photos/67c4e281f0ce5bdd7a9aa0fc/master/w_1600,c_limit/2202907862 1600w" sizes="100vw"/>Frazer HarrisonThe dark lord has risen. The night has begun. See here for Willem Dafoe in another silken, pitch black suit that works every single time.Samuel L. Jackson<img alt="Oscars 2025 all of the bestdressed men from the red carpet" class="ResponsiveImageContainer-eybHBd fptoWY responsive-image__image" src="https://media.gq-magazine.co.uk/photos/67c4f173a0c57cf7bd226295/master/w_1600%2Cc_limit/2202918909" srcSet="https://media.gq-magazine.co.uk/photos/67c4f173a0c57cf7bd226295/master/w_120,c_limit/2202918909 120w, https://media.gq-magazine.co.uk/photos/67c4f173a0c57cf7bd226295/master/w_240,c_limit/2202918909 240w, https://media.gq-magazine.co.uk/photos/67c4f173a0c57cf7bd226295/master/w_320,c_limit/2202918909 320w, https://media.gq-magazine.co.uk/photos/67c4f173a0c57cf7bd226295/master/w_640,c_limit/2202918909 640w, https://media.gq-magazine.co.uk/photos/67c4f173a0c57cf7bd226295/master/w_960,c_limit/2202918909 960w, https://media.gq-magazin'''
