["https://graalvm.org/community/advisory-board"]
title = "GraalVM Project Advisory Board"
description = "GraalVM is an advanced JDK with ahead-of-time Native Image compilation."
full_description = "GraalVM Community Community Meetup Why GraalVM? Advisory Board Internship Program Publications Contributors Code of Conduct GraalVM Open Source Support FAQs GraalVM Project Advisory Board We are announcing the establishment of the GraalVM Project Advisory Board — an advisory committee, composed of key project contributors and partners in the ecosystem with a shared goal of driving the GraalVM project forward. Such organizations can nominate their Representative for the Board. The Representative will act as the main contact point for all project-related matters associated with their company. The Advisory Board Goals Discuss community engagement and contributor interaction; Provide cumulative feedback from the community and partner ecosystem; Discuss ways to drive project awareness and adoption. The Board will meet at least every six months via video call and once per year in person. Board meetings may include additional attendees contributing to specific topics of interest. A summary of the discussions will be published on the project website. Advisory Board Members Aleksei Voitylov, BellSoft. Works on bringing musl libc support to GraalVM and enhancing GraalVM on ARM platforms. Brian Clozel, Broadcom. Works on Spring Framework, Spring GraphQL, and Spring Boot. Bruno Caballero, Microdoc. Works on GraalVM integrations in the embedded space. Johan Vos, Gluon. Works on the JavaFX and mobile/embedded platform support for GraalVM Native Image. Kevin Menard, Shopify. Contributes to TruffleRuby – GraalVM Ruby implementation. Max Rydahl Andersen, Red Hat. Develops Quarkus – a Kubernetes Native Java stack tailored for OpenJDK HotSpot and GraalVM, crafted from the best-of-breed Java libraries and standards. Michael Simons, Neo4j. Works on the Neo4j integration with GraalVM to support polyglot dynamic languages for user-defined procedures. Paul Hohensee, Amazon. Interested in GraalVM Community Edition, GraalVM Native Image, and AWS Lambda on GraalVM. Sandra Ahlgrimm, Microsoft. Interested in GraalVM Native Image, particularly for running Java in the cloud. San-Hong Li, Alibaba. Contributes to the project and share their experience with the community. Thomas Wuerthinger, Oracle. Vice President of GraalVM Development at Oracle. New members If your organization would like to join the GraalVM project advisory board, please let us know. We are open to new members that align with the board’s goals and mission. Meeting notes Meeting notes are published after each meeting within five days. See the previous notes below. September 2024 Meeting In-person meeting in Zurich April 2024 Meeting Some of the topics discussed: Project updates CE releases and community backports Governance Open pull requests Graal Vulnerability Group View full meeting notes → September 2023 Meeting In-person meeting in Zurich January 2023 Meeting Some of the topics discussed: Project updates Release cadence change Open PRs that require attention Project governance, committer and reviewer roles ParallelGC update from BellSoft Project Leyden and Native Image View full meeting notes → September 2022 Meeting In-person meeting in Zurich May 2022 Meeting Some of the topics discussed: Project updates, recent and upcoming releases Open PRs that require attention Project roles Project Leyden and Native Image View full meeting notes → February 2022 Meeting Some of the topics discussed: Project updates, 22.0 & 22.1 releases Java 17 support in previous releases ARM support New GC implementations and improvements Project Loom support View full meeting notes → November 2021 Meeting Some of the topics discussed: Project updates, 21.3 & 22.0 releases New community survey going live Open PRs that require attention JVMCI support in different versions of JDK View full meeting notes → August 2021 Meeting Some of the topics discussed: Project updates New organization joined: BellSoft Community contributions and project roles Monitoring in Native Image: JFR and other tools Native build tools Performance improvements Java versions support: 8/11/17 View full meeting notes → May 2021 Meeting Some of the topics discussed: Project updates 21.1 and 21.2 releases Native Image memory usage in Java 8/11/11+ Memory usage during compilation Plans for M1 builds CI testing View full meeting notes → February 2021 Meeting Some of the topics discussed: GraalVM Community Survey results 21.0 release and Java on Truffle Project roadmap, upcoming features Java versions support in GraalVM RISC-V, SPARC, PowerPC support CI automation View full meeting notes → November 2020 Meeting Some of the topics discussed: Release schedule and project roadmap GraalVM Developer survey Platform support GraalVM and OpenJDK Autovectorization mx, build instructions View full meeting notes → August 2020 Meeting Some of the topics discussed: Project updates and upcoming release; Security collaboration group update; Release process and supported platforms; Ecosystem updates; Advisory Board work evaluation; Contributing and CI. View full meeting notes → May 2020 Meeting Some of the topics discussed: Project updates and upcoming release; Security collaboration group: draft charter and further steps; Release process and backporting; Release roadmap updates; Ecosystem updates, project Leyden; Possibility of adding committer/reviewer roles to the project. View full meeting notes → February 2020 Meeting Some of the topics discussed: The goals of the Advisory Board; Community contributions and ways to support contributors; Testing and build process; Possibility to create a security collaboration group; Enhancement requests. View full meeting notes →"
