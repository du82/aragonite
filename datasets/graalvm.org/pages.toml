full_description = '''var sidebar = document.currentScript.parentElement; $(document).ready(function(){ var header = $('.header').height(); var invisibleBlock; $("#content-wrapper h1, #content-wrapper h2").each(function() { invisibleBlock = $(this).before("<div class='anchor' id="+ $(this).attr("id") +"></div>"); }); $(window).scroll(function() { var lastitem = null; $("#content-wrapper h1, #content-wrapper h2").each(function() { var heading = $(this); var position = (heading.position().top - heading.height()) - $(window).scrollTop(); var listitem = $(sidebar).find("li").filter(function() { return $(this).find("a").attr("href") == "#" + heading.attr("id"); }); listitem.removeClass("toc-bullets-focused"); if (position <= 0) { lastitem = listitem; } }); if (lastitem != null) lastitem.addClass("toc-bullets-focused"); }); }); Version GraalVM for JDK 23 (Latest) GraalVM for JDK 24 (Early Access) GraalVM for JDK 21 GraalVM for JDK 17 Archives Dev Build Getting Started var scriptElement = document.currentScript; var div = $(scriptElement.parentElement); $(window).on("load", function() { $("#content-wrapper h2").each(function() { var li = $("<li></li>", { class: "toc-bullets-sub" }); var a = $("<a></a>", { href: "#" + $(this).attr("id") }); a.text($(this).text().replace('#', '')); li.append(a); div.append(li); }); }); Getting Started with Native Image Reference Manuals GraalVM as a Platform Security Guide Home Latest Getting Started with Oracle GraalVM Oracle GraalVM is an advanced JDK with ahead-of-time Native Image compilation. Here you can find information about how to install Oracle GraalVM and run basic applications with it. If you are new to Oracle GraalVM, we recommend starting with the GraalVM Overview, where you will find information about GraalVM’s benefits, distributions, certified platforms, available features, and licensing. If you have Oracle GraalVM already installed and have experience using it, you can skip this page and proceed to the in-depth reference manuals. Installing # Installation steps for your specific platform: Oracle Linux Linux macOS Windows Running an Application # Oracle GraalVM includes the Java Development Kit (JDK), the just-in-time compiler (the Graal compiler), Native Image, and other familiar Java tools. You can use the GraalVM JDK just like any other JDK in your IDE, so having installed Oracle GraalVM, you can run any Java application unmodified. The java launcher runs the JVM with Graal as the last-tier compiler. Check the installed Java version: java -version Using GraalVM Native Image you can compile Java bytecode into a platform-specific, self-contained, native executable to achieve faster startup and a smaller footprint for your application. Compile this HelloWorld.java application to bytecode and then build a native executable: public class HelloWorld { public static void main(String[] args) { System.out.println("Hello, World!"); } } javac HelloWorld.java native-image HelloWorld The last command generates an executable file named helloworld in the current working directory. Invoking it runs the natively-compiled code of the HelloWorld class as follows: ./helloworld Hello, World! Note: For compilation, native-image depends on the local toolchain. Make sure your system meets the prerequisites. What to Read Next # New Users # Continue to Native Image basics to educate yourself about the technology. For users who are familiar with GraalVM Native Image but may have little experience using it, proceed to User Guides. For more information on the compiler, see the Graal Compiler. Larger Java examples can be found in the GraalVM Demos repository on GitHub. Advanced Users # Developers who are more experienced with GraalVM or want to do more with GraalVM can proceed directly to Reference Manuals for in-depth documentation. You can find information on GraalVM’s security model in the Security Guide, and rich API documentation in the Oracle GraalVM Java API Reference. Oracle Cloud Infrastructure Users # Oracle Cloud Infrastructure users who are considering Oracle GraalVM for their cloud workloads are invited to read Oracle GraalVM on OCI. This page focuses on using Oracle GraalVM with an Oracle Cloud Infrastructure Compute instance. We also recommend checking the GraalVM Team Blog.'''
