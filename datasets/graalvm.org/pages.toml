full_description = "GraalVM Community Mascot The GraalVM mascot is an open-source creation. This means that our broad community of contributors, teams, and other enthusiasts are welcome to use the mascot in any context. On this page, you will find files corresponding to all illustrations of the mascot. The library will be regularly updated, so we encourage you to visit it periodically for new additions to the mascot's story. Basic Illustrations Basic View #1 ⬇ png ⬇ eps ⬇ svg ⬇ full package* *Files with layers, such as *.eps, provide the ability to change the mascot's face and hand position easily in a few clicks Basic View #2 ⬇ png ⬇ eps ⬇ svg ⬇ full package* *Files with layers, such as *.eps, provide the ability to change Mascot's face and hand position easily in a few clicks Mascot Gallery Holding a Graal ⬇ png ⬇ svg Drinking Coffee ⬇ png ⬇ svg Reading a Book ⬇ png ⬇ svg Making an Announcement ⬇ png ⬇ svg The Cleaner ⬇ png ⬇ svg The Rock Star ⬇ png ⬇ svg The Jet Pack ⬇ png ⬇ svg The Debugger ⬇ png ⬇ svg Guidelines for Use For detailed usage information, read our guidelines: GraalVM Mascot Usage Guide"
