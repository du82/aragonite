title = "Reachability Metadata"
description = "GraalVM is an advanced JDK with ahead-of-time Native Image compilation."
full_description = '''var sidebar = document.currentScript.parentElement; $(document).ready(function(){ var header = $('.header').height(); var invisibleBlock; $("#content-wrapper h1, #content-wrapper h2").each(function() { invisibleBlock = $(this).before("<div class='anchor' id="+ $(this).attr("id") +"></div>"); }); $(window).scroll(function() { var lastitem = null; $("#content-wrapper h1, #content-wrapper h2").each(function() { var heading = $(this); var position = (heading.position().top - heading.height()) - $(window).scrollTop(); var listitem = $(sidebar).find("li").filter(function() { return $(this).find("a").attr("href") == "#" + heading.attr("id"); }); listitem.removeClass("toc-bullets-focused"); if (position <= 0) { lastitem = listitem; } }); if (lastitem != null) lastitem.addClass("toc-bullets-focused"); }); }); Version GraalVM for JDK 23 (Latest) GraalVM for JDK 24 (Early Access) GraalVM for JDK 21 GraalVM for JDK 17 Archives Dev Build Getting Started with Native Image Guides Native Image Basics Build Overview Reachability Metadata Compatibility Guide Collect Metadata with the Tracing Agent Experimental Agent Options Optimizations and Performance Debugging and Diagnostics Dynamic Features Interoperability with Native Code Workshops and Labs Home Latest Reference Manual Native Image Reachability Metadata The dynamic language features of the JVM (for example, reflection and resource handling) compute the dynamically-accessed program elements such as fields, methods, or resource URLs at run time. On HotSpot this is possible because all class files and resources are available at run time and can be loaded by the runtime. Availability of all classes and resources, and their loading at run time, comes with an extra overhead in memory and startup time. To make native binaries small, the native-image builder performs static analysis at build time to determine only the necessary program elements that are needed for the correctness of the application. Small binaries allow fast application startup and low memory footprint, however they come at a cost: determining dynamically-accessed application elements via static analysis is infeasible as reachability of those elements depends on data that is available only at run time. To ensure inclusion of necessary dynamically-accessed elements into the native binary, the native-image builder requires reachability metadata (hereinafter referred to as metadata). Providing the builder with correct and exhaustive reachability metadata guarantees application correctness and ensures compatibility with third-party libraries at runtime. Metadata can be provided to the native-image builder in the following ways: By computing metadata in code when the native binary is built and storing required elements into the initial heap of the native binary. By providing the reachability-metadata.json file(s) stored in the META-INF/native-image/<groupId>/<artifactId>/ directory on the classpath. For more information about how to collect metadata for your application automatically, see Collecting Metadata Automatically. For more advanced use cases, where classpath scanning or build-time initialization is needed, by using the Native Image Feature API. Note: Native Image is migrating to the more user-friendly implementation of reachability metadata that shows problems early on and allows easy debugging. To enable the new user-friendly reachability-metadata mode for your application, pass the option --exact-reachability-metadata at build time. To enable the user-friendly mode only for concrete packages, pass --exact-reachability-metadata=<comma-separated-list-of-packages>. To get an overview of all places in your code where missing registrations occur, without committing to the exact behavior, you can pass -XX:MissingRegistrationReportingMode=Warn when starting the application. To detect places where the application accidentally ignores a missing registration error (with catch (Throwable t) blocks), pass -XX:MissingRegistrationReportingMode=Exit when starting the application. The application will then unconditionally print the error message with the stack trace and exit immediately. This behavior is ideal for running application tests to guarantee all metadata is included. The user-friendly implementation for reflection will become the default in future releases of GraalVM so the timely adoption is important to avoid project breakage. Table of Contents # Computing Metadata in Code Specifying Metadata with JSON Metadata Types Reflection (Including Dynamic Proxies) Java Native Interface Resources Resource Bundles Serialization Sample Reachability Metadata Defining Classes at Run Time Computing Metadata in Code # Computing metadata in code can be achieved in two ways: By providing constant arguments to functions that dynamically access elements of the JVM. See, for example, Class#forName in the following code: class ReflectiveAccess { public Class<Foo> fetchFoo() throws ClassNotFoundException { return Class.forName("Foo"); } } Here, Class.forName("Foo") is evaluated into a constant at build time. When the native binary is built, this value is stored in its initial heap. If the class Foo does not exist, the call to Class#forName will be transformed into throw ClassNotFoundException("Foo"). The constant is defined as: A literal (for example, "Foo" or 1). Access to a static field that is initialized at build time. Access to an effectively final variable. Defining an array that whose lenght is constant, and all values are constant. Simple computations on other constants (for example, "F" + "oo", or an indexing into an array). When passing constant arrays, the following approaches to declare and populate an array are equivalent from the point of view of the native-image builder: Class<?>[] params0 = new Class<?>[]{String.class, int.class}; Integer.class.getMethod("parseInt", params0); Class<?>[] params1 = new Class<?>[2]; params1[0] = Class.forName("java.lang.String"); params1[1] = int.class; Integer.class.getMethod("parseInt", params1); Class<?>[] params2 = {String.class, int.class}; Integer.class.getMethod("parseInt", params2); Note that Native Image currently aggressively computes constants, and therefore it is not possible to specify exactly what is a constant at build time. By initializing classes at build time and storing dynamically accessed elements into the initial heap of the native executable. This way of providing metadata is suited for cases when specifying metadata with constants or in JSON is not possible. This is necessary in cases when: The user code needs to generate new class bytecode. The user code needs to traverse the classpath to compute the dynamically accessed program elements necessary for the application. In the following example: class InitializedAtBuildTime { private static Class<?> aClass; static { try { aClass = Class.forName(readFile("class.txt")); } catch (ClassNotFoundException e) { throw RuntimeException(e); } } public Class<?> fetchFoo() { return aClass; } } The dynamically accessed elements will be included into the native executable’s heap only if that part of the heap is reachable through an enclosing method (for example, InitializedAtBuildTime#fetchFoo) or a static field (for example, InitializedAtBuildTime.aClass). Specifying Metadata with JSON # All metadata specified in the reachability-metadata.json file that is located in any of the classpath entries at META-INF/native-image/<groupId>/<artifactId>/. The JSON schema for the reachability metadata is defined in reachability-metadata-schema-v1.0.0.json. A sample reachability-metadata.json file can be found in the sample section. The reachability-metadata.json configuration contains a single object with one field for each type of metadata. Each field in the top-level object contains an array of metadata entries: { "reflection":[], "resources":[], "bundles":[], "serialization":[], "jni":[] } For example, Java reflection metadata is specified under reflection, and an example entry looks like: { "reflection": [ { "type": "Foo" } ] } Conditional Metadata Entries # Each entry in JSON-based metadata should be conditional to avoid unnecessary growth of the native binary size. A conditional entry is specified by adding a condition field to the entry in the following way: { "condition": { "typeReached": "<fully-qualified-class-name>" }, <metadata-entry> } A metadata entry with a typeReached condition is considered available at run time, only when the specified fully-qualified type is reached at run time. Before that, all dynamic accesses to the element represented with the metadata-entry will behave as if the metadata-entry does not exist. This means that those dynamic accesses will throw a missing-registration error. A type is reached at run time, right before the class-initialization routine starts for that type (class or interface), or any of the type’s subtypes are reached. For "typeReached": "ConditionType" that guards a metadata entry in the following example, the type is considered reached: class SuperType { static { // ConditionType reached (subtype reached) => metadata entry available } } class ConditionType extends SuperType { static { // ConditionType reached (before static initializer) => metadata entry available } static ConditionType singleton() { // ConditionType reached (already initialized) => metadata entry available } } public class App { public static void main(String[] args) { // ConditionType not reached => metadata entry not available ConditionType.class; // ConditionType not reached (ConditionType.class doesn't start class initialization) => metadata entry not available ConditionType.singleton(); // ConditionType reached (already initialized) => metadata entry available } } A type is also reached, if it is marked as initialize-at-build-time or any of its subtypes are marked as initialize-at-build-time and they exist on the classpath. Array types are never marked as reached and as such cannot be used in conditions. A conditional metadata entry is included into the image when the fully-qualified type is reachable at build time. This entry affects the image size, and it will be available at run time only when the condition is reached at run time. You can find more examples of the metadata files in the GraalVM Reachability Metadata repository. Metadata Types # Native Image accepts the following types of reachability metadata: Java reflection (the java.lang.reflect.* API) enables Java code to examine its own classes, methods, fields, and their properties at run time. JNI allows native code to access classes, methods, fields and their properties at run time. Resources allow arbitrary files present on the classpath to be dynamically accessed in the application. Resource Bundles Java localization support (java.util.ResourceBundle) that enables Java code to load L10N resources. Serialization enables writing (and reading) Java objects to (and from) streams. (Experimental) Predefined Classes provide support for dynamically generated classes. Reflection # For all methods in this section Native Image will compute reachability at build time given that all the call arguments are constant. Providing constant arguments in code is a preferred way to provide metadata as it requires no duplication of information in external JSON files. Reflection in Java starts with java.lang.Class that allows fetching further reflective elements such as methods and fields. The class can be fetched reflectively via the following static functions on java.lang.Class: java.lang.Class forName(java.lang.String) throws java.lang.ClassNotFoundException java.lang.Class forName(java.lang.String, boolean, java.lang.ClassLoader) throws java.lang.ClassNotFoundException java.lang.Class forName(java.lang.Module, java.lang.String) java.lang.Class arrayType() - requires metadata for the array type. The classes can be also fetched reflectively loading a class from a name with java.lang.ClassLoader#loadClass(String). To provide metadata for the calls that fetch a Class reflectively, the following entry must be added to the reflection array in reachability-metadata.json: { "type": "FullyQualifiedReflectivelyAccessedType" } For proxy classes, the java.lang.Class is fetched with the following methods on java.lang.reflect.Proxy: java.lang.Class getProxyClass(java.lang.ClassLoader, java.lang.Class[]) throws java.lang.IllegalArgumentException java.lang.Object newProxyInstance(java.lang.ClassLoader, java.lang.Class[], java.lang.reflect.InvocationHandler) Metadata, for proxy classes, is in the form an ordered collection of interfaces that defines a proxy: { "type": { "proxy": ["FullyQualifiedInterface1", "...", "FullyQualifiedInterfaceN"] } } Invocation of methods above without the provided metadata will result in throwing MissingReflectionRegistrationError which extends java.lang.Error and should not be handled. Note that even if a type does not exist on the classpath, the methods above will throw a MissingReflectionRegistrationError. The following methods on java.lang.Class will throw a MissingRegistrationError if the metadata is not provided for a given type: Constructor getConstructor(Class[]) throws NoSuchMethodException,SecurityException Constructor getDeclaredConstructor(Class[]) throws NoSuchMethodException,SecurityException Constructor[] getConstructors() throws SecurityException Constructor[] getDeclaredConstructors() throws SecurityException Method getMethod(String,Class[]) throws NoSuchMethodException,SecurityException Method getDeclaredMethod(String,Class[]) throws NoSuchMethodException,SecurityException Method[] getMethods() throws SecurityException Method[] getDeclaredMethods() throws SecurityException Field getField(String) throws NoSuchFieldException,SecurityException Field getDeclaredField(String) throws NoSuchFieldException,SecurityException Field[] getFields() throws SecurityException Field[] getDeclaredFields() throws SecurityException RecordComponent[] getRecordComponents() Class[] getPermittedSubclasses() Object[] getSigners() Class[] getNestMembers() Class[] getClasses() Class[] getDeclaredClasses() throws SecurityException Furthermore, all reflective lookups via java.lang.invoke.MethodHandles.Lookup will also require metadata for the type to be present, or they will throw MissingReflectionRegistrationError. Note that for lambda-proxy classes, metadata can not be provided. This is a known issue that will be addressed in the future releases of GraalVM. Reflective Method Invocation # To reflectively invoke methods, the method signature must be added to the type metadata: { "type": "TypeWhoseMethodsAreInvoked", "methods": [ {"name": "<methodName1>", "parameterTypes": ["<param-type1>", "<param-typeI>", "<param-typeN>"]}, {"name": "<methodName2>", "parameterTypes": ["<param-type1>", "<param-typeI>", "<param-typeN>"]} ] } As a convenience, one can allow method invocation for groups of methods by adding the following in reachability-metadata.json: { "type": "TypeWhos'''
