["https://graalvm.org/community/meetup"]
title = "Community Meetup"
description = "GraalVM is an advanced JDK with ahead-of-time Native Image compilation."
full_description = "GraalVM Community Summit September 19-20, 2024, Zurich, Switzerland Over the past few years, the GraalVM project has shown significant growth, largely thanks to the invaluable feedback and collaboration within the community. To facilitate it further, every year we organize GraalVM Community Summit. This event brings together our partners and members of GraalVM community to discuss the project status and collaborate on the direction and roadmap. This year it will take place in Zurich, Switzerland, on September 19-20. Format It is a two-day event with presentations and working group sessions. It will include presentations on the GraalVM roadmap, its place in the Java ecosystem, recent and upcoming changes. Then, we will proceed with an unconference style agenda where participants propose topics and vote on them. If you want to prepare a presentation, let us know, and we will allocate a presentation slot. We will also have breakout rooms for separate conversations and ad-hoc consultations. Some of the topics we plan to cover: How can we help the community more easily adopt GraalVM, and in particular Native Image? What would be the most useful directions that GraalVM can take to be beneficial for users? What are the biggest pain points in using GraalVM and/or features you'd most like to see? What changes would improve developer experience? This will be the fourth time we organize such a community event, and it has been very successful in terms of getting community feedback and increasing cooperation. It also has proved to be useful for collaboration beyond GraalVM - participants get a chance to talk with framework teams, library maintainers, vendors, and other members of the Java ecosystem. Logistics Location: The Circle, building 32, Zurich, Switzerland, Oracle Switzerland office Dates: 19-20 September, 2024 We will start at 9am. Lunch will be provided, and we will have dinner together on the 19th. We will finish up by 5pm on the 20th. We will also have a city tour on the evening of 18th for those who arrive the day before. How to Participate To participate, please send an email to graalvm-maintainers_ww_grp@oracle.com, describing your involvement in the project. Please note that due to the limited space, the preference will be given to the most active GraalVM contributors and community members and those with a strong potential for future contributions."
