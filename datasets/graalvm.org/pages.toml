full_description = '''var sidebar = document.currentScript.parentElement; $(document).ready(function(){ var header = $('.header').height(); var invisibleBlock; $("#content-wrapper h1, #content-wrapper h2").each(function() { invisibleBlock = $(this).before("<div class='anchor' id="+ $(this).attr("id") +"></div>"); }); $(window).scroll(function() { var lastitem = null; $("#content-wrapper h1, #content-wrapper h2").each(function() { var heading = $(this); var position = (heading.position().top - heading.height()) - $(window).scrollTop(); var listitem = $(sidebar).find("li").filter(function() { return $(this).find("a").attr("href") == "#" + heading.attr("id"); }); listitem.removeClass("toc-bullets-focused"); if (position <= 0) { lastitem = listitem; } }); if (lastitem != null) lastitem.addClass("toc-bullets-focused"); }); }); Version GraalVM for JDK 23 (Latest) GraalVM for JDK 24 (Early Access) GraalVM for JDK 21 GraalVM for JDK 17 Archives Dev Build GraalVM as a Java Virtual Machine Graal Compiler var scriptElement = document.currentScript; var div = $(scriptElement.parentElement); $(window).on("load", function() { $("#content-wrapper h2").each(function() { var li = $("<li></li>", { class: "toc-bullets-sub toc-bullets-sub-3" }); var a = $("<a></a>", { href: "#" + $(this).attr("id") }); a.text($(this).text().replace('#', '')); li.append(a); div.append(li); }); }); Graal JIT Compiler Configuration Graal JIT Compiler Operations Manual Home Latest Reference Manual Java Graal Compiler The Graal compiler is a dynamic compiler, written in Java, that transforms bytecode into machine code. The Graal just-in-time (JIT) compiler is integrated with the Java HotSpot Virtual Machine and GraalVM. See Java Virtual Machine Guide and the section GraalVM as a Virtual Machine for more information. (The open source code of the Graal JIT compiler is available on GitHub.) Compiler Advantages # The Graal JIT compiler provides optimized performance for applications running on a Java Virtual Machine (JVM) through unique approaches to code analysis and optimization. It includes multiple optimization algorithms (called “Phases”), such as aggressive inlining, polymorphic inlining, and others. The Graal compiler can bring performance advantages for highly-abstracted programs. For example, it includes a partial-escape-analysis optimization that can remove the costly allocations of certain objects. See the value PartialEscapeAnalysis in the CEOptimization enum in the GraalVM GitHub repository for more information. The optimization determines when a new object is accessible outside a compilation unit and only allocates it on paths that “escape” the compilation unit (for example, if the object is passed as a parameter, stored in a field, or returned from a method). This approach can greatly improve the performance of an application by reducing the number of heap allocations. Code that uses more modern Java features such as Streams or Lambdas will see greater improvements in performance as this type of code involves a significant number of such non- or partially-escaping objects. Code bound by characteristics such as I/O or memory allocations that cannot be removed by the compiler will see less improvement. For more information on performance tuning, refer to Graal JIT Compiler Configuration. Graph Compilation # To run guest programming languages (namely JavaScript, Python, and Ruby) in the same runtime as the host JVM-based language, the compiler works with a language-independent intermediate graph representation between the source language and the machine code to be generated. (For more information on language interoperability, see Interoperability.) The graph can represent similar statements of different languages in the same way, such as “if” statements or loops, which makes it possible to mix languages in the same application. The Graal compiler can then perform language-independent optimization and generate machine code on this graph. Diagnostic Data # If an uncaught exception is thrown by the compiler, the compilation is typically discarded and execution continues. The Graal compiler can instead produce diagnostic data (such as immediate representation graphs) that can be submitted along with a bug report. This is enabled with the -Djdk.graal.CompilationFailureAction=Diagnose option. The default location of the diagnostics output is in the graal_dumps/ directory under the current working directory of the process but can be changed with the -Djdk.graal.DumpPath option. During the JVM shutdown, the location of the archive containing the diagnostic data is printed to the console. Furthermore, diagnostic data can be produced for any compilation performed by the Graal compiler with the -Djdk.graal.Dump option. This will produce diagnostic data for every method compiled by the compiler. To refine the set of methods for which diagnostic data is produced, use the -Djdk.graal.MethodFilter=<class>.<method> option. For example, -Djdk.graal.MethodFilter=java.lang.String.*,HashMap.get will produce diagnostic data only for methods in the java.lang.String class as well as methods named get in a class whose non-qualified name is HashMap. Related Documentation # Graal JIT Compiler Operations Manual Graal JIT Compiler Configuration'''
