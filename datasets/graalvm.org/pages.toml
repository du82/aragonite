full_description = '''var sidebar = document.currentScript.parentElement; $(document).ready(function(){ var header = $('.header').height(); var invisibleBlock; $("#content-wrapper h1, #content-wrapper h2").each(function() { invisibleBlock = $(this).before("<div class='anchor' id="+ $(this).attr("id") +"></div>"); }); $(window).scroll(function() { var lastitem = null; $("#content-wrapper h1, #content-wrapper h2").each(function() { var heading = $(this); var position = (heading.position().top - heading.height()) - $(window).scrollTop(); var listitem = $(sidebar).find("li").filter(function() { return $(this).find("a").attr("href") == "#" + heading.attr("id"); }); listitem.removeClass("toc-bullets-focused"); if (position <= 0) { lastitem = listitem; } }); if (lastitem != null) lastitem.addClass("toc-bullets-focused"); }); }); Version GraalVM for JDK 23 (Latest) GraalVM for JDK 24 (Early Access) GraalVM for JDK 21 GraalVM for JDK 17 Archives Dev Build Getting Started with Native Image Guides Native Image Basics Build Overview Reachability Metadata Optimizations and Performance Debugging and Diagnostics Dynamic Features Interoperability with Native Code Workshops and Labs var scriptElement = document.currentScript; var div = $(scriptElement.parentElement); $(window).on("load", function() { $("#content-wrapper h2").each(function() { var li = $("<li></li>", { class: "toc-bullets-sub" }); var a = $("<a></a>", { href: "#" + $(this).attr("id") }); a.text($(this).text().replace('#', '')); li.append(a); div.append(li); }); }); Home Latest Reference Manual Native Image Interactive Labs and Workshops Interactive Labs # Consider running interactive workshops in Oracle Cloud Infrastructure to get some practical experience. The interactive cloud platform provides you with a temporary account for the time you run a lab with required cloud resources (a virtual machine, Oracle Linux, storage, and so on). This means you can try Native Image without downloading any additional software to your computer. Go to Luna Labs and search for “Native Image”. The following labs are available: GraalVM Native Image Quick Start: This lab is for developers new to Native Image who are keen to start building cloud native Java applications. GraalVM, Reflection and Native Image: This lab shows how to preconfigure the native-image builder when reflection is used, and make your Java application compatible with ahead-of-time compilation using Native Image. GraalVM Native Image, Spring and Containerisation: This lab shows you how to package a Spring Boot application into a native executable; containerise it; shrink the footprint even more by creating small a Distroless container Image. Optimize Cloud Native Java Apps with Oracle GraalVM PGO: This lab shows how to run a Java Microbenchmark Harness (JMH) benchmark as a native executable, built with GraalVM Native Image, and then optimize it for higher throughput using Profile-Guided Optimization (PGO). OCI MySQL, Vault, Micronaut, GraalVM Native Image: In this lab, you will learn how to build a portable cloud-native Java application with Micronaut, GraalVM Native Image and MySQL Database service, and Secrets in Vault on Oracle Cloud Infrastructure. GraalVM Native Build Tools, for Maven: This lab shows you how to use the GraalVM Native Build Tools to easily build a native executable of your application using Maven. It is aimed at developers with the knowledge of Java. Build Cloud Native Java Applications with Micronaut and GraalVM Native Image: The workshop features several labs that walk you through the steps to get going with Micronaut, GraalVM, and Oracle Cloud Infrastructure services. GraalVM Native Image Bootcamp: This workshop covers how GraalVM Native Image works, what it can do, when to use it, and how to tune and debug applications. You will also look at containerisation options and deployment to cloud platforms including Oracle Cloud Infrastructure. Workshops # Have a look at GraalVM Workshops and Tutorials collection on GitHub. There you can find the workshops intended to work on your own device (laptop, server). Each workshop begins with prerequisites that you need to have installed. This repository is continually updated with new workshops. Check-in regularly to keep up to date.'''
