title = "GraalPy Package Compatibility"
description = "GraalVM is an advanced JDK with ahead-of-time Native Image compilation."
full_description = '''const show_percentages = true; const dbs = {}; var module_query = ''; const load_db = function (graalpyVersion) { return new Promise(function (resolve, reject) { const xhr = new XMLHttpRequest(); const url = `/compatibility/module_results/python-module-testing-${graalpyVersion}.csv`; xhr.open('GET', url); xhr.overrideMimeType('text/plain'); xhr.onload = function () { if (this.status === 200) { resolve(this.responseText); } else { reject(this.statusText); } }; xhr.onerror = function () { reject(url); }; xhr.send(); }); }; let pageNumber = 0; let database; const getRowsPerPage = function () { return parseInt($('#rowsPerPage').val()); } const updatePagination = function (reset) { if (reset) { pageNumber = 0; } $('#pagination-previous').attr('disabled', pageNumber == 0); const rowsPerPage = getRowsPerPage(); const count = $('#dataTable tbody tr:not(.dataTable-filtered-out)').length; let pageText; if (count < rowsPerPage) { pageText = `1-${count}`; pageNumber = 0; } else { const start = pageNumber * rowsPerPage; const end = start + rowsPerPage; $('#pagination-next').attr('disabled', end >= count); pageText = `${start}-${Math.min(end, count)}` if (!reset) { let numberOfRowsToSkip = start let numberOfVisibleRows = 0; const rows = $('#dataTable tbody tr'); rows.each(function () { if (!$(this).hasClass('dataTable-filtered-out')) { if (numberOfRowsToSkip > 0) { $(this).hide(); numberOfRowsToSkip--; } else { if (numberOfVisibleRows < rowsPerPage) { $(this).show(); numberOfVisibleRows++; } else { $(this).hide(); } } } }); } } $('#pagination-label').text(`${pageText} of ${count}`) } const toStatisticsText = function (part, total) { return `${part} (${Math.round(part / total * 100 * 100) / 100}%)` } const updateStatistics = function (count, countCompatible, countUntested, countIncompatible, countNotSupported) { var offset = 0; var svg = `<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"> <g transform="rotate(-90)" transform-origin="80 80">`; const drawOne = function(name, size, color) { svg += `<circle r="64" cx="80" cy="80" fill="none" pathLength="${count}" stroke="${color}" stroke-width="32" stroke-dasharray="0 ${offset} ${size} ${count - offset - size}"> <title>${name}: ${toStatisticsText(size, count)}</title> </circle> `; offset += size; } drawOne('Compatible', countCompatible, '#13A97C'); drawOne('Untested', countUntested, '#76D1FF'); drawOne('Incompatible', countIncompatible, '#C84D4D'); drawOne('Unsupported', countNotSupported, '#D7D7D7'); svg += `</g></svg>`; var chart = document.getElementById('pie-chart'); chart.innerHTML = svg; $('#pycomp-stats-compatible').text(toStatisticsText(countCompatible, count)); $('#pycomp-stats-untested').text(toStatisticsText(countUntested, count)); $('#pycomp-stats-incompatible').text(toStatisticsText(countIncompatible, count)); $('#pycomp-stats-not-supported').text(toStatisticsText(countNotSupported, count)); } const updatePageData = function () { const params = new URLSearchParams(window.location.search); const graalpyModuleValue = params.get('version') || 'v241'; load_db(graalpyModuleValue).then(function (db_contents) { database = new DB("python", db_contents); const rowsPerPage = getRowsPerPage(); let count = 0; let countCompatible = 0; let countUntested = 0; let countIncompatible = 0; let countNotSupported = 0; $('#dataTable tbody').empty(); for (let package in database.db) { const versions = database.db[package] versions_loop: for (let version in versions) { if (version.startsWith('~')) { continue; } const info = versions[version]; switch (info.test_status) { case 0: countCompatible++; break; case 1: countUntested++; break; case 2: countIncompatible++; break; case 3: countNotSupported++; break; default: console.log(`Unknown test_status: ${info.test_status} for package ${info.name}`); continue versions_loop; } const styling = count++ < rowsPerPage ? '' : ' style="display: none;"'; $('#dataTable tbody').append(` <tr${styling}> <td class="dataTable-name">${info.name}</td> <td>${info.version}</td> <td>${info.pass_percentage}</td> <td><a href="https://pypi.org/project/${info.name}/" target="_blank">${info.name} on pypi.org</td> </tr>`); } } updateStatistics(count, countCompatible, countUntested, countIncompatible, countNotSupported); updatePagination(true); }); } $(document).ready(function () { updatePageData(); $('#graalpy__search-field').on('input', function () { const searchTerms = this.value.toLowerCase().split(','); let numberOfVisibleRows = 0; const rowsPerPage = getRowsPerPage(); const rows = $('#dataTable tbody tr'); rows.each(function () { const rowText = $(this).find('.dataTable-name').first().text().toLowerCase(); if (searchTerms.some(term => (searchTerms.length <= 1 || term !== '') && rowText.includes(term))) { $(this).removeClass('dataTable-filtered-out'); if (numberOfVisibleRows < rowsPerPage) { $(this).show(); numberOfVisibleRows++; } else { $(this).hide(); } } else { $(this).addClass('dataTable-filtered-out'); $(this).hide(); } }); updatePagination(true); }); $('#add-requirements-btn').on('change', function (e) { e.stopPropagation(); e.preventDefault(); const file = this.files[0]; const fileReader = new FileReader(); fileReader.onloadend = function (e) { const contents = e.target.result; const searchTerms = []; for (const line of contents.split('\n')) { const trimmedLine = line.trim(); const pythonPackageName = trimmedLine.match(/^[a-zA-Z0-9]+/); if (pythonPackageName !== null) { searchTerms.push(pythonPackageName); } } const searchField = $('#graalpy__search-field'); searchField.val(searchTerms.join(',')); searchField.trigger('input').change(); } fileReader.readAsText(file); }); $('#rowsPerPage').on('input', function () { const rowsPerPage = parseInt(this.value); let numberOfVisibleRows = 0; const rows = $('#dataTable tbody tr'); rows.each(function () { if (numberOfVisibleRows < rowsPerPage && !$(this).hasClass('dataTable-filtered-out')) { $(this).show(); numberOfVisibleRows++; } else { $(this).hide(); } }); updatePagination(true); }); $('#pagination-previous').on('click', function () { pageNumber--; updatePagination(false); }); $('#pagination-next').on('click', function () { pageNumber++; updatePagination(false); }); /* top-level version switcher */ $(".graalpy-item").click(function () { $(this).addClass("graalpy-active").siblings().removeClass("graalpy-active"); const graalpyModuleValue = $(".graalpy-item.graalpy-module.graalpy-active").attr("data-filter"); window.history.pushState("", window.location.title, `?version=${graalpyModuleValue}`); updatePageData(); }); function setFilters() { const params = new URLSearchParams(window.location.search); const graalpyModuleValue = params.get('version') || 'v241'; const moduleFilterElement = $(`.graalpy-module[data-filter=${graalpyModuleValue}]`); moduleFilterElement.addClass("graalpy-active").siblings().removeClass("graalpy-active"); } setFilters(); }); GraalPy: Package Compatibility GraalPy 24.1 GraalPy 24.0 GraalPy 23.1 GraalPy 23.0 GraalPy 22.3 To ensure GraalPy is compatible with common Python packages, the GraalPy team conducts compatibility testing to verify the presence and correct functioning of the top 500 packages on PyPI plus some more that are of special interest to us, including libraries and frameworks such as NumPy, Pandas, and Django. Compatibility testing ensures that developers can leverage GraalPy's powerful capabilities in their existing applications. It also enables developers to use GraalPy to create more efficient and productive applications in the areas of machine learning, data analysis, and web development using their familiar Python toolsets. Compatible: loading... Currently Untested: loading... Currently Incompatible: loading... Not Supported: loading... Python Packages Filter by requirements.txt Download data Python Packages Name Version Test Level % Package URL Rows per page: 25 50 100 < >'''
