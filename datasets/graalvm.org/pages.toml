full_description = "Brand Resources GraalVM images and usage guidance for events, social media, online mentions, and other possible use cases GraalVM Logo and Icon Downloads GraalVM Logo ⬇ png ⬇ eps ⬇ svg ⬇ full package* *Includes black and white, reverse, RGB, and various formats GraalVM Logo with an Icon ⬇ png ⬇ eps ⬇ svg ⬇ full package* *Includes black and white, reverse, rgb, and various formats GraalVM Icon ⬇ png ⬇ eps ⬇ svg ⬇ full package* *Includes black and white, reverse, rgb, and various formats Guidelines for Use For detailed usage information, read our guidelines: Logo and icon style guide Use the logo you need as displayed on the graalvm.org website. You may scale it to fit your placement, but please avoid changing colors, design, or altering the graphics in any way. When placing the logo on dark backgrounds, please use the version with a white background. Third Party Usage Guidelines for Oracle Trademarks Colors The GraalVM logo and icon must never be reproduced in any colors other than those specified below. Meet the GraalVM Mascot Learn more about the GraalVM mascot. Download illustrations and see usage guidelines. Learn More"
