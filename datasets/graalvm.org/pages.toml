full_description = "GraalVM Community Community Meetup Why GraalVM? Advisory Board Internship Program Publications Contributors Code of Conduct GraalVM Open Source Support FAQs GraalVM Community The GraalVM project embraces an open and inclusive community. We welcome users and contributors alike. Also, we support projects that extend the platform with new tools, languages or embeddings. Stay Connected Subscribe to low traffic graalvm-announce@oss.oracle.com for important news about GraalVM. Follow @graalvm on Twitter and use the #GraalVM hashtag to tweet about the project or to see what others are tweeting. Community Support We provide free community support via public channels and always appreciate your feedback or questions. Join the conversation at our Slack channels to directly connect with the GraalVM team. Subscribe and post to graalvm-users@oss.oracle.com for GraalVM usability questions. Create GitHub issues for bug reports, questions or requests for enhancements. Report a security vulnerability to secalert_us@oracle.com. For additional information see Reporting Vulnerabilities guide. Contribute to GraalVM GraalVM welcomes contributors to the core platform and projects that extend the platform. There have already been significant contributions from both industry and academia. Please let us know about such efforts that we can support to grow the GraalVM community together. To help to provide immediate feedback to GraalVM developers, there are nightly GraalVM builds available. They are built from the main branch on a nightly basis. Learn how to become a GraalVM contributor. Subscribe and post to graalvm-dev@oss.oracle.com for questions related to working with the sources or extending the GraalVM ecosystem by creating new languages, tools or embeddings."
