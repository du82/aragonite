["https://www.graalvm.org/latest/reference-manual/native-image/debugging-and-diagnostics/InspectTool"]
title = "Native Image Inspect Tool"
description = "GraalVM is an advanced JDK with ahead-of-time Native Image compilation."
full_description = '''var sidebar = document.currentScript.parentElement; $(document).ready(function(){ var header = $('.header').height(); var invisibleBlock; $("#content-wrapper h1, #content-wrapper h2").each(function() { invisibleBlock = $(this).before("<div class='anchor' id="+ $(this).attr("id") +"></div>"); }); $(window).scroll(function() { var lastitem = null; $("#content-wrapper h1, #content-wrapper h2").each(function() { var heading = $(this); var position = (heading.position().top - heading.height()) - $(window).scrollTop(); var listitem = $(sidebar).find("li").filter(function() { return $(this).find("a").attr("href") == "#" + heading.attr("id"); }); listitem.removeClass("toc-bullets-focused"); if (position <= 0) { lastitem = listitem; } }); if (lastitem != null) lastitem.addClass("toc-bullets-focused"); }); }); Version GraalVM for JDK 23 (Latest) GraalVM for JDK 24 (Early Access) GraalVM for JDK 21 GraalVM for JDK 17 Archives Dev Build Getting Started with Native Image Guides Native Image Basics Build Overview Reachability Metadata Optimizations and Performance Debugging and Diagnostics Debug Info Feature Inspect Tool var scriptElement = document.currentScript; var div = $(scriptElement.parentElement); $(window).on("load", function() { $("#content-wrapper h2").each(function() { var li = $("<li></li>", { class: "toc-bullets-sub toc-bullets-sub-3" }); var a = $("<a></a>", { href: "#" + $(this).attr("id") }); a.text($(this).text().replace('#', '')); li.append(a); div.append(li); }); }); JDK Flight Recorder Native Memory Tracking Linux Perf Profiler Support Points-to Analysis Reports Dynamic Features Interoperability with Native Code Workshops and Labs Home Latest Reference Manual Native Image Debugging And Diagnostics Native Image Inspect Tool The Native Image Inspect Tool extracts embedded Software Bill of Materials (SBOM) from native executables. The functionality for extracting class-level metadata is now deprecated. Extracting Embedded SBOM # Native Image can embed a SBOM at build time to detect any libraries that may be susceptible to known security vulnerabilities. Native Image provides the --enable-sbom option to embed an SBOM into a native executable (only available in Oracle GraalVM). The Native Image Inspect Tool can extract the compressed SBOM using the optional --sbom parameter, as shown in the command: $JAVA_HOME/bin/native-image-inspect --sbom <path_to_binary>. Extracting Class-Level Metadata (Deprecated) # The extraction of class-level metadata using native-image-inspect is deprecated. In GraalVM for JDK 24, a deprecation warning is printed to stderr, and this functionality will be removed in GraalVM for JDK 25. Please migrate to using class-level SBOMs instead by passing --enable-sbom=class-level,export to the native-image builder, which generates an SBOM containing the same kind of class-level metadata information. Native Image provides the Inspect Tool to list all classes, fields, and methods included in a native executable or a native shared library. Run the command $JAVA_HOME/bin/native-image-inspect <path_to_binary> to list classes, methods, fields, and constructors in the JSON format that validates against the JSON schema defined in native-image-inspect-schema-v0.2.0.json (only available in Oracle GraalVM). The native-image builder, by default, includes metadata in the native executable which then enables the Inspect Tool to list the included methods. The amount of data included is fairly minimal compared to the overall image size, however you can set the -H:-IncludeMethodData option to disable the metadata emission. Images compiled with this option will not be able to be inspected by the tool. Software Bill of Materials (SBOM) # Native Image can embed a Software Bill of Materials (SBOM) at build time to detect any libraries that may be susceptible to known security vulnerabilities. Native Image provides the --enable-sbom option to embed an SBOM into a native executable (only available in Oracle GraalVM). The tool is able to extract the compressed SBOM using an optional --sbom parameter accessible through $JAVA_HOME/bin/native-image-inspect --sbom <path_to_binary>. Further Reading # Debugging and Diagnostics'''
