full_description = "Build faster, smaller, leaner applications An advanced JDK with ahead-of-time Native Image compilation Download Get Started Announcement Announcing GraalVM for JDK 23! 🚀 New features, smaller executables, new garbage collection options, and GraalPy and GraalWasm now ready for production! Learn More Features Low Resource Usage Native executables use only a fraction of memory and CPU resources required by a JVM, which improves utilization and reduces costs. Improved Security Native executables contain only the classes, methods, and fields that your application needs, which reduces attack surface area. Fast Startup Native executables compiled ahead of time start up instantly and require no warmup to run at peak performance. Compact Packaging Native executables are small and offer a range of linking options that make them easy to deploy in minimal container images. Supported by Frameworks Popular frameworks such as Spring Boot, Micronaut, Helidon, and Quarkus provide first-class support for GraalVM. Supported by Leading Cloud Platforms SDKs from leading cloud platforms such as AWS, Microsoft Azure, GCP, and Oracle Cloud Infrastructure integrate and support GraalVM."
