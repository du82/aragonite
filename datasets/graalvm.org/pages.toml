full_description = '''var sidebar = document.currentScript.parentElement; $(document).ready(function(){ var header = $('.header').height(); var invisibleBlock; $("#content-wrapper h1, #content-wrapper h2").each(function() { invisibleBlock = $(this).before("<div class='anchor' id="+ $(this).attr("id") +"></div>"); }); $(window).scroll(function() { var lastitem = null; $("#content-wrapper h1, #content-wrapper h2").each(function() { var heading = $(this); var position = (heading.position().top - heading.height()) - $(window).scrollTop(); var listitem = $(sidebar).find("li").filter(function() { return $(this).find("a").attr("href") == "#" + heading.attr("id"); }); listitem.removeClass("toc-bullets-focused"); if (position <= 0) { lastitem = listitem; } }); if (lastitem != null) lastitem.addClass("toc-bullets-focused"); }); }); Version GraalVM for JDK 23 (Latest) GraalVM for JDK 24 (Early Access) GraalVM for JDK 21 GraalVM for JDK 17 Archives Dev Build Getting Started Getting Started with Native Image Reference Manuals GraalVM as a Java Virtual Machine Graal Languages Embedding Languages var scriptElement = document.currentScript; var div = $(scriptElement.parentElement); $(window).on("load", function() { $("#content-wrapper h2").each(function() { var li = $("<li></li>", { class: "toc-bullets-sub toc-bullets-sub-3" }); var a = $("<a></a>", { href: "#" + $(this).attr("id") }); a.text($(this).text().replace('#', '')); li.append(a); div.append(li); }); }); Polyglot Programming Tools for Graal Languages GraalVM as a Platform Security Guide Home Latest Reference Manual Embedding Languages Dependency Setup Compile and Run a Polyglot Application Define Guest Language Functions as Java Values Access Guest Languages Directly from Java Access Java from Guest Languages Lookup Java Types from Guest Languages Computed Arrays Using Polyglot Proxies Host Access Runtime Optimization Support Build Native Executables from Polyglot Applications Code Caching Across Multiple Contexts Polyglot Isolates Embed Guest Languages in Java Build a Shell for Many Languages Step Through with Execution Listeners Setting the Heap Size Compatibility with JSR-223 ScriptEngine The GraalVM Polyglot API lets you embed and run code from guest languages in Java host applications. Throughout this section, you will learn how to create a host application in Java that runs on GraalVM and directly calls a guest language. You can use the tabs beneath each code example to choose between JavaScript, R, Ruby, and Python. Note: The usage description for polyglot embeddings was revised with GraalVM for JDK 21 and Polyglot API version 23.1.0. If you are still using Polyglot API version older than 23.1.0, ensure the correct version of the documentation is displayed. More information on the change can be found in the release notes. Dependency Setup # Since Polyglot API version 23.1.0, all necessary artifacts can be downloaded directly from Maven Central. Artifacts relevant to embedders can be found in the Maven dependency group org.graalvm.polyglot. See the polyglot embedding demonstration on GitHub for a complete runnable example. Here is an example Maven dependency setup that you can put into your project: <dependency> <groupId>org.graalvm.polyglot</groupId> <artifactId>polyglot</artifactId> <version>${graalvm.polyglot.version}</version> </dependency> <dependency> <groupId>org.graalvm.polyglot</groupId> <!-- Select a language: js, ruby, python, java, llvm, wasm, languages--> <artifactId>js</artifactId> <version>${graalvm.polyglot.version}</version> <type>pom</type> </dependency> <!-- Add additional languages if needed --> <dependency> <groupId>org.graalvm.polyglot</groupId> <!-- Select a tool: profiler, inspect, coverage, dap, tools --> <artifactId>profiler</artifactId> <version>${graalvm.polyglot.version}</version> <type>pom</type> </dependency> The pom type is a requirement for language or tool dependencies. Language and tool dependencies use the GraalVM Free Terms and Conditions (GFTC) license. To use community-licensed versions instead, add the -community suffix to each artifact (for example, js-community). To access polyglot isolate artifacts, use the -isolate suffix instead (for example, js-isolate). The artifacts languages and tools include all available languages and tools as dependencies. This artifact might grow or shrink between major releases. We recommend selecting only the needed language(s) for a production deployment. Additionally, your module-info.java file should require org.graalvm.polyglot when using Java modules: module com.mycompany.app { requires org.graalvm.polyglot; } Whether your configuration can run with a Truffle runtime optimization depends on the GraalVM JDK you use. For further details, refer to the Runtime Compilation section. We recommend configuring polyglot embeddings using modules and the module path whenever possible. Be aware that using org.graalvm.polyglot from the class path instead will enable access to unsafe APIs for all libraries on the class path. If the application is not yet modularized, hybrid use of the class path and module path is possible. For example: $java -classpath=lib --module-path=lib/polyglot --add-modules=org.graalvm.polyglot ... In this example, lib/polyglot directory should contain all polyglot and language JAR files. To access polyglot classes from the class path, you must also specify the --add-modules=org.graalvm.polyglot JVM option. If you are using GraalVM Native Image, polyglot modules on the class path will be automatically upgraded to the module path. While we do support creating single uber JAR files from polyglot libraries, for example, using the Maven Assembly plugin, but we do not recommend it. Also note that uber JAR files are not supported when creating native binaries with GraalVM Native Image. Compile and Run a Polyglot Application # GraalVM can run polyglot applications written in any language implemented with the Truffle language implementation framework. These languages are henceforth referenced as guest languages. Complete the steps in this section to create a sample polyglot application that runs on GraalVM and demonstrates programming language interoperability. Create a new Java project using Maven. Clone the polyglot-embedding-demo repository: git clone https://github.com/graalvm/polyglot-embedding-demo.git Insert the example code into the Main class. Update the Maven pom.xml dependency configuration to include the languages to run as described in the previous section. Download and install GraalVM by setting the value of the JAVA_HOME environment variable to the location of a GraalVM JDK. Run mvn package exec:exec to build and execute the sample code. You now have a polyglot application that consists of a Java host application and guest language code, running on GraalVM. You can use this application with other code examples to demonstrate more advanced capabilities of the GraalVM Polyglot API. Define Guest Language Functions as Java Values # Polyglot applications let you take values from one programming language and use them with other languages. Use the code example in this section with your polyglot application to show how the Polyglot API can return JavaScript, Python, or Ruby functions as Java values. // COMPILE-CMD: javac {file} // RUN-CMD: java -ea {file} import org.graalvm.polyglot.*; public class function_js { public static void main(String[] args) { // BEGIN-SNIPPET try (Context context = Context.create()) { Value function = context.eval("js", "x => x+1"); assert function.canExecute(); int x = function.execute(41).asInt(); assert x == 42; } // END-SNIPPET } } var beginPattern = "BEGIN-SNIPPET"; var endPattern = "END-SNIPPET"; var parent = document.currentScript.parentElement; $(parent).find("figure > pre > code").each(function() { var lines = this.textContent.split("\n"); var snippets = []; var part = ""; for(var line of lines) { if (line.includes(endPattern)) { snippets.push(part); part = ""; } part += line + "\n"; if (line.includes(beginPattern)) { snippets.push(part); part = ""; } } snippets.push(part); parent._snippets = snippets; this.textContent = snippets.filter(function (_, index) { return index & 1; }).join("\n"); }); // COMPILE-CMD: javac {file} // RUN-CMD: java -ea {file} import org.graalvm.polyglot.*; public class function_python { public static void main(String[] args) { // BEGIN-SNIPPET try (Context context = Context.create()) { Value function = context.eval("python", "lambda x: x + 1"); assert function.canExecute(); int x = function.execute(41).asInt(); assert x == 42; } // END-SNIPPET } } var beginPattern = "BEGIN-SNIPPET"; var endPattern = "END-SNIPPET"; var parent = document.currentScript.parentElement; $(parent).find("figure > pre > code").each(function() { var lines = this.textContent.split("\n"); var snippets = []; var part = ""; for(var line of lines) { if (line.includes(endPattern)) { snippets.push(part); part = ""; } part += line + "\n"; if (line.includes(beginPattern)) { snippets.push(part); part = ""; } } snippets.push(part); parent._snippets = snippets; this.textContent = snippets.filter(function (_, index) { return index & 1; }).join("\n"); }); // COMPILE-CMD: javac {file} // RUN-CMD: java -ea {file} import org.graalvm.polyglot.*; public class function_ruby { public static void main(String[] args) { // BEGIN-SNIPPET try (Context context = Context.create()) { Value function = context.eval("ruby", "proc { |x| x + 1 }"); assert function.canExecute(); int x = function.execute(41).asInt(); assert x == 42; } // END-SNIPPET } } var beginPattern = "BEGIN-SNIPPET"; var endPattern = "END-SNIPPET"; var parent = document.currentScript.parentElement; $(parent).find("figure > pre > code").each(function() { var lines = this.textContent.split("\n"); var snippets = []; var part = ""; for(var line of lines) { if (line.includes(endPattern)) { snippets.push(part); part = ""; } part += line + "\n"; if (line.includes(beginPattern)) { snippets.push(part); part = ""; } } snippets.push(part); parent._snippets = snippets; this.textContent = snippets.filter(function (_, index) { return index & 1; }).join("\n"); }); JavaScript Python Ruby In this code: Value function is a Java value that refers to a function. The eval call parses the script and returns the guest language function. The first assertion checks that the value returned by the code snippet can be executed. The execute call executes the function with the argument 41. The asInt call converts the result to a Java int. The second assertion verifies that the result was incremented by one as expected. Access Guest Languages Directly from Java # Polyglot applications can readily access most language types and are not limited to functions. Host languages, such as Java, can directly access guest language values embedded in the polyglot application. Use the code example in this section with your polyglot application to show how the Polyglot API can access objects, numbers, strings, and arrays. // COMPILE-CMD: javac {file} // RUN-CMD: java -ea {file} import org.graalvm.polyglot.*; public class access_js_from_java { public static void main(String[] args) { // BEGIN-SNIPPET try (Context context = Context.create()) { Value result = context.eval("js", "({ " + "id : 42, " + "text : '42', " + "arr : [1,42,3] " + "})"); assert result.hasMembers(); int id = result.getMember("id").asInt(); assert id == 42; String text = result.getMember("text").asString(); assert text.equals("42"); Value array = result.getMember("arr"); assert array.hasArrayElements(); assert array.getArraySize() == 3; assert array.getArrayElement(1).asInt() == 42; } // END-SNIPPET } } var beginPattern = "BEGIN-SNIPPET"; var endPattern = "END-SNIPPET"; var parent = document.currentScript.parentElement; $(parent).find("figure > pre > code").each(function() { var lines = this.textContent.split("\n"); var snippets = []; var part = ""; for(var line of lines) { if (line.includes(endPattern)) { snippets.push(part); part = ""; } part += line + "\n"; if (line.includes(beginPattern)) { snippets.push(part); part = ""; } } snippets.push(part); parent._snippets = snippets; this.textContent = snippets.filter(function (_, index) { return index & 1; }).join("\n"); }); // COMPILE-CMD: javac {file} // RUN-CMD: java -ea {file} import org.graalvm.polyglot.*; public class access_python_from_java { public static void main(String[] args) { // BEGIN-SNIPPET try (Context context = Context.create()) { Value result = context.eval("python", "type('obj', (object,), {" + "'id' : 42, " + "'text': '42', " + "'arr' : [1,42,3]" + "})()"); assert result.hasMembers(); int id = result.getMember("id").asInt(); assert id == 42; String text = result.getMember("text").asString(); assert text.equals("42"); Value array = result.getMember("arr"); assert array.hasArrayElements(); assert array.getArraySize() == 3; assert array.getArrayElement(1).asInt() == 42; } // END-SNIPPET } } var beginPattern = "BEGIN-SNIPPET"; var endPattern = "END-SNIPPET"; var parent = document.currentScript.parentElement; $(parent).find("figure > pre > code").each(function() { var lines = this.textContent.split("\n"); var snippets = []; var part = ""; for(var line of lines) { if (line.includes(endPattern)) { snippets.push(part); part = ""; } part += line + "\n"; if (line.includes(beginPattern)) { snippets.push(part); part = ""; } } snippets.push(part); parent._snippets = snippets; this.textContent = snippets.filter(function (_, index) { return index & 1; }).join("\n"); }); // COMPILE-CMD: javac {file} // RUN-CMD: java -ea {file} import org.graalvm.polyglot.*; public class access_ruby_from_java { public static void main(String[] args) { // BEGIN-SNIPPET try (Context context = Context.create()) { Value result = context.eval("ruby", "o = Struct.new(:id, :text, :arr).new(" + "42, " + "'42', " + "[1,42,3] " + ")"); assert result.hasMembers(); int id = result.getMember("id").asInt(); assert id == 42; String text = result.getMember("text").asString(); assert text.equals("42"); Value array = result.getMember("arr"); assert array.hasArrayElements(); assert array.getArraySize() == 3; assert array.getArrayElement(1).asInt() == 42; } // END-SNIPPET } } var beginPattern = "BEGIN-SNIPPET"; var endPattern = "END-SNIPPET"; var parent = document.currentScript.parentElement; $(parent).find("figure > pre > code").each(function() { var lines = this.textContent.split("\n"); var snippets = []; var part = ""; for(var line of lines) { if (line.includes(endPattern)) { snippets.push(part); part = ""; } part += line + "\n"; if (line.includes(beginPattern)) { snippets.push(part); part = ""; } } snippets.push(part); parent._snippets = snippets; this.textContent = snippets.filter(function (_, index) { return index & 1; }).join("\n"); }); JavaScript Python Ruby In this code: Value result is an Object that contains three members: a number named id, a string named text, and an array named arr. The first assertion verifies that the return value can contain members, which indicates that the v'''
