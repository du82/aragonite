title = "Debug Info Feature"
description = "GraalVM is an advanced JDK with ahead-of-time Native Image compilation."
full_description = '''var sidebar = document.currentScript.parentElement; $(document).ready(function(){ var header = $('.header').height(); var invisibleBlock; $("#content-wrapper h1, #content-wrapper h2").each(function() { invisibleBlock = $(this).before("<div class='anchor' id="+ $(this).attr("id") +"></div>"); }); $(window).scroll(function() { var lastitem = null; $("#content-wrapper h1, #content-wrapper h2").each(function() { var heading = $(this); var position = (heading.position().top - heading.height()) - $(window).scrollTop(); var listitem = $(sidebar).find("li").filter(function() { return $(this).find("a").attr("href") == "#" + heading.attr("id"); }); listitem.removeClass("toc-bullets-focused"); if (position <= 0) { lastitem = listitem; } }); if (lastitem != null) lastitem.addClass("toc-bullets-focused"); }); }); Version GraalVM for JDK 23 (Latest) GraalVM for JDK 24 (Early Access) GraalVM for JDK 21 GraalVM for JDK 17 Archives Dev Build Getting Started with Native Image Guides Native Image Basics Build Overview Reachability Metadata Optimizations and Performance Debugging and Diagnostics Debug Info Feature var scriptElement = document.currentScript; var div = $(scriptElement.parentElement); $(window).on("load", function() { $("#content-wrapper h2").each(function() { var li = $("<li></li>", { class: "toc-bullets-sub toc-bullets-sub-3" }); var a = $("<a></a>", { href: "#" + $(this).attr("id") }); a.text($(this).text().replace('#', '')); li.append(a); div.append(li); }); }); Inspect Tool JDK Flight Recorder Native Memory Tracking Linux Perf Profiler Support Points-to Analysis Reports Dynamic Features Interoperability with Native Code Workshops and Labs Home Latest Reference Manual Native Image Debugging And Diagnostics Debug Info Feature Table of Contents # Introduction Source File Caching Special Considerations for Debugging Java from GDB Identifying Source Code Location Configuring Source Paths in GNU Debugger Checking Debug Info on Linux Debugging with Isolates Debugging Helper Methods Special Considerations for using perf and valgrind Introduction # To build a native executable with debug information, provide the -g command-line option for javac when compiling the application, and then to the native-image builder: javac -g Hello.java native-image -g Hello This enables source-level debugging, and the debugger (GDB) then correlates machine instructions with specific source lines in Java files. The resulting image will contain debug records in a format the GNU Debugger (GDB) understands. Additionally, you can pass -O0 to the builder which specifies that no compiler optimizations should be performed. Disabling all optimizations is not required, but in general it makes the debugging experience better. Debug information is not just useful to the debugger. It can also be used by the Linux performance profiling tools perf and valgrind to correlate execution statistics such as CPU utilization or cache misses with specific, named Java methods and even link them to individual lines of Java code in the original Java source file. By default, debug info will only include details of some of the values of parameters and local variables. This means that the debugger will report many parameters and local variables as being undefined. If you pass -O0 to the builder then full debug information will be included. If you want more parameter and local variable information to be included when employing higher levels of optimization (-O1 or, the default, -O2) you need to pass an extra command line flag to the native-image command: native-image -g -H:+SourceLevelDebug Hello Enabling debuginfo with flag -g does not make any difference to how a generated native image is compiled and does not affect how fast it executes nor how much memory it uses at runtime. However, it can significantly increase the size of the generated image on disk. Enabling full parameter and local variable information by passing flag -H:+SourceLevelDebug can cause a program to be compiled slightly differently and for some applications this can slow down execution. The basic perf report command, which displays a histogram showing percentage execution time in each Java method, only requires passing flags -g and -H:+SourceLevelDebug to the native-image command. However, more sophisticated uses of perf (for example, perf annotate) and use of valgrind requires debug info to be supplemented with linkage symbols identifying compiled Java methods. Java method symbols are omitted from the generated native image by default but they can be retained achieved by passing one extra flag to the native-image command native-image -g -H:+SourceLevelDebug -H:-DeleteLocalSymbols Hello Use of this flag will result in a small increase in the size of the resulting image file. Note: Native Image debugging currently works on Linux with initial support for macOS. The feature is experimental. Note: Debug info support for perf and valgrind on Linux is an experimental feature. Source File Caching # The -g option also enables caching of sources for any JDK runtime classes, GraalVM classes, and application classes which can be located when generating a native executable. By default, the cache is created alongside the generated binary in a subdirectory named sources. If a target directory for the native executable is specified using option -H:Path=... then the cache is also relocated under that same target. Use a command line option to provide an alternative path to sources and to configure source file search path roots for the debugger. Files in the cache are located in a directory hierarchy that matches the file path information included in the debug records of the native executable. The source cache should contain all the files needed to debug the generated binary and nothing more. This local cache provides a convenient way of making just the necessary sources available to the debugger or IDE when debugging a native executable. The implementation tries to be smart about locating source files. It uses the current JAVA_HOME to locate the JDK src.zip when searching for JDK runtime sources. It also uses entries on the class path to suggest locations for GraalVM source files and application source files (see below for precise details of the scheme used to identify source locations). However, source layouts do vary and it may not be possible to find all sources. Hence, users can specify the location of source files explicitly on the command line using option DebugInfoSourceSearchPath: javac --source-path apps/greeter/src \ -d apps/greeter/classes org/my/greeter/*Greeter.java javac -cp apps/greeter/classes \ --source-path apps/hello/src \ -d apps/hello/classes org/my/hello/Hello.java native-image -g \ -H:DebugInfoSourceSearchPath=apps/hello/src \ -H:DebugInfoSourceSearchPath=apps/greeter/src \ -cp apps/hello/classes:apps/greeter/classes org.my.hello.Hello The DebugInfoSourceSearchPath option can be repeated as many times as required to notify all the target source locations. The value passed to this option can be either an absolute or relative path. It can identify either a directory, a source JAR file, or a source ZIP file. It is also possible to specify several source roots at once using a comma separator: native-image -g \ -H:DebugInfoSourceSearchPath=apps/hello/target/hello-sources.jar,apps/greeter/target/greeter-sources.jar \ -cp apps/target/hello.jar:apps/target/greeter.jar \ org.my.Hello By default, the cache of application, GraalVM, and JDK sources is created in a directory named sources. The DebugInfoSourceCacheRoot option can be used to specify an alternative path, which can be absolute or relative. In the latter case the path is interpreted relative to the target directory for the generated executable specified via option -H:Path (which defaults to the current working directory). As an example, the following variant of the previous command specifies an absolute temporary directory path constructed using the current process id: SOURCE_CACHE_ROOT=/tmp/$$/sources native-image -g \ -H:DebugInfoSourceCacheRoot=$SOURCE_CACHE_ROOT \ -H:DebugInfoSourceSearchPath=apps/hello/target/hello-sources.jar,apps/greeter/target/greeter-sources.jar \ -cp apps/target/hello.jar:apps/target/greeter.jar \ org.my.Hello The resulting cache directory will be something like /tmp/1272696/sources. If the source cache path includes a directory that does not yet exist, it will be created during population of the cache. Note that in all the examples above the DebugInfoSourceSearchPath options are actually redundant. In the first case, the class path entries for apps/hello/classes/ and apps/greeter/classes/ will be used to derive the default search roots apps/hello/src/ and apps/greeter/src/. In the second case, the class path entries for apps/target/hello.jar and apps/target/greeter.jar will be used to derive the default search roots apps/target/hello-sources.jar and apps/target/greeter-sources.jar. Supported Features # The currently supported features include: break points configured by file and line, or by method name single stepping by line including both into and over function calls stack backtraces (not including frames detailing inlined code) printing of primitive values structured (field by field) printing of Java objects casting/printing objects at different levels of generality access through object networks via path expressions reference by name to methods and static field data reference by name to values bound to parameter and local vars reference by name to class constants Note that single stepping within a compiled method includes file and line number info for inlined code, including inlined GraalVM methods. So, GDB may switch files even though you are still in the same compiled method. Special considerations for debugging Java from GDB # GDB does not currently include support for Java debugging. In consequence, debug capability has been implemented by generating debug info that models the Java program as an equivalent C++ program. Java class, array and interface references are actually pointers to records that contain the relevant field/array data. In the corresponding C++ model the Java name is used to label the underlying C++ (class/struct) layout types and Java references appear as pointers. So, for example in the DWARF debug info model java.lang.String identifies a C++ class. This class layout type declares the expected fields like hash of type int and value of type byte[] and methods like String(byte[]), charAt(int), etc. However, the copy constructor which appears in Java as String(String) appears in gdb with the signature String(java.lang.String *). The C++ layout class inherits fields and methods from class (layout) type java.lang.Object using C++ public inheritance. The latter in turn inherits standard oop (ordinary object pointer) header fields from a special struct class named _objhdr which includes up to two fields (depending on the VM configuration). The first field is called hub and its type is java.lang.Class * that is, it is a pointer to the object’s class. The second field (optional) is called idHash and has type int. It stores an identity hashcode for the object. The ptype command can be used to print details of a specific type. Note that the Java type name must be specified in quotes because to escape the embedded . characters. (gdb) ptype 'java.lang.String' type = class java.lang.String : public java.lang.Object { private: byte [] *value; int hash; byte coder; public: void String(byte [] *); void String(char [] *); void String(byte [] *, java.lang.String *); . . . char charAt(int); . . . java.lang.String * concat(java.lang.String *); . . . } The ptype command can also be used to identify the static type of a Java data value. The current example session is for a simple hello world program. Main method Hello.main is passed a single parameter args whose Java type is String[]. If the debugger is stopped at entry to main we can use ptype to print the type of args. (gdb) ptype args type = class java.lang.String[] : public java.lang.Object { public: int len; java.lang.String *data[0]; } * There are a few details worth highlighting here. Firstly, the debugger sees a Java array reference as a pointer type, as it does every Java object reference. Secondly, the pointer points to a structure, actually a C++ class, that models the layout of the Java array using an integer length field and a data field whose type is a C++ array embedded into the block of memory that models the array object. Elements of the array data field are references to the base type, in this case pointers to java.lang.String. The data array has a nominal length of 0. However, the block of memory allocated for the String[] object actually includes enough space to hold the number of pointers determined by the value of field len. Finally, notice that the C++ class java.lang.String[] inherits from the C++ class java.lang.Object. So, an array is still also an object. In particular, as we will see when we print the object contents, this means that every array also includes the object header fields that all Java objects share. The print command can be used to display the object reference as a memory address. (gdb) print args $1 = (java.lang.String[] *) 0x7ffff7c01130 It can also be used to print the contents of the object field by field. This is achieved by dereferencing the pointer using the * operator. (gdb) print *args $2 = { <java.lang.Object> = { <_objhdr> = { hub = 0xaa90f0, idHash = 0 }, <No data fields>}, members of java.lang.String[]: len = 1, data = 0x7ffff7c01140 } The array object contains embedded fields inherited from class _objhdr via parent class Object. _objhdr is a synthetic type added to the deubg info to model fields that are present at the start of all objects. They include hub which is a reference to the object’s class and hashId a unique numeric hash code. Clearly, the debugger knows the type (java.lang.String[]) and location in memory (0x7ffff7c010b8) of local variable args. It also knows about the layout of the fields embedded in the referenced object. This means it is possible to use the C++ . and -> operators in debugger commands to traverse the underlying object data structures. (gdb) print args->data[0] $3 = (java.lang.String *) 0x7ffff7c01160 (gdb) print *args->data[0] $4 = { <java.lang.Object> = { <_objhdr> = { hub = 0xaa3350 }, <No data fields>}, members of java.lang.String: value = 0x7ffff7c01180, hash = 0, coder = 0 '\000' } (gdb) print *args->data[0]->value $5 = { <java.lang.Object> = { <_objhdr> = { hub = 0xaa3068, idHash = 0 }, <No data fields>}, members of byte []: len = 6, data = 0x7ffff7c01190 "Andrew" } Returning to the hub field in the object header it was mentioned before that this is actually a reference to the object’s class. This is actually an instance of Java type java.lang.Class. Note that the field is typed by gdb using a pointer to the underlying C++ class (layout) type. (gdb) print args->hub $6 = (ja'''
