full_description = "GraalVM Release Calendar GraalVM for JDK 23 GraalVM for JDK 22 GraalVM for JDK 21 GraalVM for JDK 20 GraalVM for JDK 17 GraalVM 22.3.x GraalVM 22.2.x GraalVM 22.1.x GraalVM 22.0.x GraalVM 21.3.x GraalVM 21.2.x GraalVM 21.1.x GraalVM 21.0.x GraalVM 20.3.x GraalVM 20.2.x GraalVM 20.1.x GraalVM 20.0.x GraalVM 19.3.x GraalVM Release Calendar GraalVM aligns with the six-month JDK release cadence and uses the JDK numbering scheme (for example, “GraalVM for JDK 21.0.3”). Feature Release There are two feature releases per year to support the latest JDK version. A new feature release supersedes all previous releases. Critical Patch Update (CPU) Critical Patch Updates (CPU) for Oracle GraalVM and GraalVM Community Edition follow the schedule for all Oracle CPU and OpenJDK CPU releases respectively. Critical Patch Updates are released on the third Tuesday of January, April, July, and October. All active releases receive patch updates. Long-Term-Support (LTS) Release Oracle GraalVM for JDK 21 is the current long-term support (LTS) release and will receive free updates under the GraalVM Free Terms and Conditions (GFTC) including License for Early Adopter Versions license until one full year after the subsequent LTS release, which is JDK 25. Oracle also provides customers of Oracle GraalVM and Oracle GraalVM Enterprise Edition with Oracle Premier Support. Planned Releases Date Type Oracle GraalVM GraalVM Community Edition Graal Languages March 18, 2025 Feature 24 24 24.2.0 April 15, 2025 CPU 17.0.15, 21.0.7, 24.0.1 24.0.1 24.2.1 July 15, 2025 CPU 17.0.16, 21.0.8, 24.0.2 24.0.2 24.2.2 September 16, 2025 Feature (LTS) 25 25 25.0.0 October 21, 2025 CPU 17.0.17, 21.0.9, 25.0.1 25.0.1 25.0.1 January 20, 2026 CPU 17.0.18, 21.0.10, 25.0.2 25.0.2 25.0.2 March 17, 2026 Feature 26 26 26.0.0 Previous Releases Date Type Oracle GraalVM GraalVM Community Edition Graal Languages January 21, 2025 CPU 17.0.14, 21.0.6, 23.0.2 23.0.2 24.1.2 October 15, 2024 CPU 17.0.13, 21.0.5, 