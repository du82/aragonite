full_description = "GraalVM Community Community Meetup Why GraalVM? Advisory Board Internship Program Publications Contributors Code of Conduct GraalVM Open Source Support FAQs Academic Publications This page describes various presentations and publications related to the Graal compiler and Truffle that were published by Oracle Labs and its academic collaborators. Truffle GraalVM provides the Truffle framework for implementing a managed language in Java, improving language performance while enabling integration with other Truffle languages and providing tooling support – all of that by just implementing an abstract syntax tree (AST) interpreter in Java. Truffle applies AST specialization during interpretation, which enables partial evaluation to create highly optimized native code without the need to write a compiler specifically for a language. The Java VM contributes high-performance garbage collection, threads, and parallelism support. Oracle Labs and external research groups have implemented a variety of programming languages on top of Truffle, including JavaScript, Python, Ruby, R, Smalltalk, and others. Several of them already exceed the best implementation of that language that existed before. We recommend watching a presentation on Dynamic Metacompilation with Truffle by Christian Humer, and checking academic publications on Truffle, of your interest, listed on this page. You can also find the extensive Truffle documentation on the website. Graal Compiler The Graal compiler is an optimizing dynamic compiler written in Java. Because it is highly configurable and extensible, it delivers excellent peak performance on many benchmarks for a diverse set of managed languages including Java and JavaScript. This brings compiler research to a new level: researchers can evaluate new compiler optimizations immediately on many languages. If you are a language implementer who is curious how modern VMs like the Java HotSpot VM optimizes your code, you can find answers to that in the presentation by Doug Simon Looking at the GraalVM compiler. The presentation covers the following topics: How to build a GraalVM distribution from the sources Ways the compiler uses Java language features to simplify the development: annotations, unit tests, and benchmarks for individual compiler optimizations What main classes one should look at the GraalVM project Compilation wrappers and so on Find below also the academic publications on the compiler of your interest, or see the Graal compiler documentation on the website. Academic Publications 2024 Matteo Oldani, William Blair, Lukas Stadler, Zbynek Slajchrt, Matthias Neugschwandtner Binsweep: Reliably Restricting Untrusted Instruction Streams with Static Binary Analysis and Control-Flow Integrity In Proceedings of the ACM Cloud Computing Security Workshop (CCSW’24) Florian Huemer, David Leopoldseder, Aleksandar Prokopec, Raphael Mosaner, Hanspeter Moessenboeck Taking a Closer Look: An Outlier-Driven Approach to Compilation-Time Optimization In Proceedings of the ECOOP 2024 Doctoral Symposium Andrej Pecimuth, David Leopoldseder, Petr Tuma Accurate Compilation Replay via Remote JIT Compilation Poster presented at the 21st International Conference on Managed Programming Languages and Runtimes (MPLR 2024) Christoph Blumschein, Fabio Niephaus, Codrut Stancu, Christian Wimmer, Jens Lincke, Robert Hirschfeld Finding Cuts in Static Analysis Graphs to Debloat Software In Proceedings of the ACM SIGSOFT International Symposium on Software Testing and Analysis Ivan Ristovic, Milan Cugurovic, Strahinja Stanojevic, Marko Spasic, Vesna Marinkovic, Milena Vujosevic Janicic Efficient control-flow graph traversal In Proceedings of YU INFO 2024s Christian Wimmer, Codrut Stancu, David Kozak, Thomas Wuerthinger Scaling Type-Based Points-to Analysis with Saturation In Proceedings of PLDI 2024 Milan Cugurovic, Milena Vujosevic Janicic, Vojin Jovanovic, Thomas Wuerthinger GraalSP: Polyglot, Efficient, and Robust Machine Lea