full_description = "Frameworks Ready for Native Image The following frameworks are compatible with GraalVM Native Image. For more details, see their project launchers. Project Launcher Learn More Project Launcher Reachability Metadata Project Launcher Project Launcher Reachability Metadata Libraries and Frameworks Tested with Native Image The following table lists libraries and frameworks from the Java ecosystem that are tested with GraalVM Native Image. To ensure your application is compatible with any of these libraries, use the latest version of the Native Build Tools. Each item in the table is annotated with a test level, as follows: Tested (★★): The library or framework is continuously tested by its maintainers. (This is the best test level.) Community-tested (★): The library or framework is continuously tested as part of the GraalVM Reachability Metadata Repository or some other community-driven project. If you would like to add your library and framework to this list, open a pull request and add an entry to this file according to this schema. Libraries and Frameworks Tested with Native Image Name Version Test Level ch.qos.logback.contrib:logback-jackson ⩾ 0.1.5 ★1) ch.qos.logback.contrib:logback-json-classic ⩾ 0.1.5 ★1) ch.qos.logback:logback-classic ⩾ 1.2.11 ★1) com.datastax.oss:java-driver-core ⩾ 4.1.5 ★ com.ecwid.consul:consul-api ⩾ 1.4.5 ★1) com.fasterxml.jackson.core:jackson-databind ⩾ 2.15.2 ★1) com.github.ben-manes.caffeine:caffeine ⩾ 2.9.3 ★1) com.github.ladutsko:isbn-core ⩾ 1.2.0 ★★ com.github.luben:zstd-jni ⩾ 1.5.2-5 ★1) com.google.protobuf:protobuf-java-util ⩾ 3.21.12 ★1) com.graphql-java:graphql-java ⩾ 19.2 ★1) com.graphql-java:graphql-java-extended-validation ⩾ 19.1 ★1) com.h2database:h2 ⩾ 2.1.210 ★1) com.hazelcast:hazelcast ⩾ 5.2.1 ★1) com.hexagonkt:core ⩾ 3.0.0 ★★ com.hexagonkt:handlers ⩾ 3.0.0 ★★ com.hexagonkt:http ⩾ 3.0.0 ★★ com.hexagonkt:http_client ⩾ 3.0.0 ★★ com.hexagonkt:http_client_jetty ⩾ 3.0.0 ★★ com.hexagonkt:http_client_jetty_ws ⩾ 3.