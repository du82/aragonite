["https://graalvm.org/release-notes/21_3"]
title = "21.3.3.1"
description = "GraalVM is an advanced JDK with ahead-of-time Native Image compilation."
full_description = "GraalVM Release Calendar GraalVM for JDK 23 GraalVM for JDK 22 GraalVM for JDK 21 GraalVM for JDK 20 GraalVM for JDK 17 GraalVM 22.3.x GraalVM 22.2.x GraalVM 22.1.x GraalVM 22.0.x GraalVM 21.3.x GraalVM 21.2.x GraalVM 21.1.x GraalVM 21.0.x GraalVM 20.3.x GraalVM 20.2.x GraalVM 20.1.x GraalVM 20.0.x GraalVM 19.3.x 21.3.3.1 (2022-09-20) This is a patch release for the GraalVM 21.3.3 branch which includes the following: Platform updates: 11.0.16.1 for Java 11-based GraalVM 17.0.4.1 for Java 17-based GraalVM Prevent the Truffle file system sandbox from checking host files while parsing paths using alternative file system providers. The hashCode() and equals() methods of InsightFilter are corrected and context management is fixed. Corrected the depth in insight heap dumps: it does not apply to primitives and is applied to variables, not the frame. Fixed the PolyglotFunction to not treat null argument as zero arguments. 21.3.3 (2022-07-26) This is July 2022 Critical Patch Update (CPU) for GraalVM Community Edition. It is a full distribution and supersedes the previous release of GraalVM Community Edition 21.3.x. It is based on OpenJDK CPU and includes all the OpenJDK security fixes released as part of that CPU, and platform updates. Updated the OpenJDK release on which GraalVM Community Edition is built to: 11.0.16 for Java 11-based GraalVM Community. See OpenJDK 11.0.16 Updates 17.0.4 for Java 17-based GraalVM Community. See OpenJDK 17 Updates 21.3.2 (2022-04-26) This is April 2022 Critical Patch Update (CPU) for GraalVM Community Edition. It is a full distribution and supersedes the previous release of GraalVM Community Edition 21.3.x. It is based on OpenJDK CPU and includes all the OpenJDK security fixes released as part of that CPU, and platform updates. Updated the OpenJDK release on which GraalVM Community Edition is built to: 11.0.15 for Java 11-based GraalVM Community. See OpenJDK 11.0.15 Updates 17.0.3 for Java 17-based GraalVM Community. See OpenJDK 17 Updates 21.3.1 (2022-01-18) This is January 2022 Critical Patch Update (CPU) for GraalVM Community Edition. It is a full distribution and supersedes the previous release of GraalVM Community Edition 21.3.x. It is based on OpenJDK CPU and includes all the OpenJDK security fixes released as part of that CPU, and platform updates. The OpenJDK release that GraalVM Community Edition is built on was updated to: 11.0.14 for Java 11-based GraalVM Community. See OpenJDK 11.0.14 Updates 17.0.2 for Java 17-based GraalVM Community. See OpenJDK 17 Updates Removed support for JDK versions 12, 13, 14, 15, and 16. Updated Node.js to version 14.18.1. 21.3.0 (2021-10-19) Java and Compiler Updates Platform Updates Native Image Polyglot Runtime Java on Truffle JavaScript Ruby Python R LLVM Runtime WebAssembly Tools Polyglot Embedding Truffle Language and Tool Implementations Platform Updates Java 17 support: The GraalVM distributions based on Oracle Java 17 and OpenJDK 17 are available for download. As of this release and further, there will be GraalVM Community distributions based on OpenJDK 11 and 17 only (no distributions based on OpenJDK 8). The 21.3 release line will be the last one to contain GraalVM Enterprise based on Oracle JDK 8. 22.x and further will only contain distributions based on Oracle Java 11 and 17. The OpenJDK release that GraalVM Community Edition is built on was updated to: 11.0.13 for Java 11-based GraalVM Community. See OpenJDK 11.0.13 Updates 17.0.1 for Java 17-based GraalVM Community. See OpenJDK 17 Updates The Oracle JDK release that GraalVM Enterprise Edition is built on was updated to: 8u311 for Java 8-based GraalVM Enterprise. See Java SE 8 release notes 11.0.13 for Java 11-based GraalVM Enterprise. See Java SE 11 release notes 17.0.1 for Java 17-based GraalVM Enterprise. See Java SE 17 release notes Java and Compiler Updates Improved the Strip Mining optimization for non-counted loops (only available in GraalVM Enterprise), which includes: Enabled Strip Mining for non-counted loops by default. Improved counted loop detection for inequality checked loops. Now more uncounted loops are converted to counted loops, becoming subject to further optimization such as vectorization and partial unrolling. This extra optimization adds to better performance. Take this loop as an example: for (int i = start; i != end; i++){ // body } The compiler cannot statically prove that start < end and so this loop may have to overflow i before it terminates. The compiler now inserts a start < end check before the loop. If this check fails, the compiled code will deoptimize and the next time it is compiled, the check will be omitted and the loop will be treated as uncounted. Added a new Infeasible Path Correlation optimization to eliminate infeasible paths (only available in GraalVM Enterprise). Have a look at this snippet: class A { ... } class B extends A { ... } if (x > 5) { if (y instanceof A) { throw Error(); } } loop { int foo = <expensive computation>; if (x > 10) { if (y instanceof B) { bar(foo); } } } The bar(foo) call will only be executed if x > 10 && y instanceof B. However, that condition implies x > 5 && y instanceof A which means throw Error() will be executed. That is, the call to bar can never actually be executed. The Graal compiler now recognizes this and eliminates both the call to bar as well as the computation of foo if it is only used as an argument to bar. This optimization is enabled by default and can be disabled with -Dgraal.InfeasiblePathCorrelation=false. Implemented support for Constant Blinding to defend against JIT spraying attacks. In a JIT spraying attack, an attacker uses the JIT compiler to inject machine instructions in executable memory by using operations with immediate values. Given an existing memory corruption vulnerability, the attacker can then redirect control flow to the injected code. (Only available in GraalVM Enterprise.) The constant blinding phase encrypts user supplied constants in the code with a randomly generated key, so that the attacker cannot rely on the immediate value being present in executable memory: mov reg, $0xF5952C xor reg, $0xABCDEF // reg = 0x5E58C3 Constant Blinding is an experimental feature disabled by default. Enable it with -Dgraal.BlindConstants=true. Configure with -Dgraal.MinimumBlindedConstantSize the size of constants (in bytes) above which constant blinding will be applied. Improved the SIMD (Single Instruction Multiple Data) vectorization optimization for sequential code (only available in GraalVM Enterprise): SIMD Vectorization and Partial Loop Unrolling can now be enabled at the same time. It is no longer necessary to specify -Dgraal.PartialUnroll=false to maximize the benefit achieved from SIMD Vectorization. This optimization is now enabled by default. SIMD Vectorization can now create groups of operations which do not completely fill a vector register. This increases the number of acceleration opportunities SIMD Vectorization is able to realize and so improves overall throughput performance. Improved grouping and pattern matching in SIMD Vectorization to increase the number of SIMD opportunities the optimization can find and successfully exploit. Added a new optimization that prevents inlining from negatively impacting register allocation and code size for certain caller/callee combinations. This can improve performance because fewer values may be existing concurrently in a program. (Only available in GraalVM Enterprise.) Added compiler intrinsics for following methods in both JVM and Native Image mode: Math.signum, Math.copySign, Reference.refersTo and PhantomReference.refersTo. The way intrinsics operate is to replace a native method with direct machine code. Thus intrinsification of the above Java methods removes the overhead of native calls, which is considerable and improves the overall performance. For example, intrinsifying Reference.refersTo and PhantomReference.refersTo fixed the performance regression reported in this GitHub issue. A full list of compiler changes in GraalVM Community Edition can be found in the compiler changelog. Native Image Improved the Native Image configuration: configuration file entries that are necessary at image build time for Reflection, JNI, class path resources, and Dynamic Proxy objects, can now be conditional based on the reachability of a class. This allows a more precise configuration, which can reduce the size of a native image. See the documentation and find there an example for a conditional reflection configuration. Improved gathering the reflection metadata by the native-image builder: Native Image now distinguishes between queried and invoked reflection methods. Calling Class.getDeclaredMethods (and all the other variants to look up methods and constructors) now returns all reachable methods for all classes. Previously, only methods that were explicitly registered for reflective invocation were returned. This new feature allows significant reduction of the manual reflection configuration: only methods that need to be invoked via Method.invoke, or methods that would not be seen as reachable based on reachability, need to be registered manually. This distinction between queried and invoked reflection methods reduces the filesize of a native image. Added several new optimizations to reduce the image size as well as the image build time for large applications. This has been an ongoing effort for several releases. The following table shows the image size and image build time for Spring petclinic-jdbc, a well-known large application. The numbers are measured on a developer laptop with Linux, AMD64, JDK 11, GraalVM Enterprise, spring-native 0.10.3: GraalVM Version Image Build Time Image Size GraalVM 21.1 170 sec. 138 MByte GraalVM 21.2 163 sec. 133 MByte GraalVM 21.3 133 sec. 119 MByte Added initial support for the Java Platform Module System: The native-image builder now accepts the module-related arguments known from the java launcher like -m, -p, and --add-opens. When such a module-related argument is used, the image generator itself is used as a module too. This is a major change in how the image generator works, and development is still ongoing to support more aspects of the module system. Please provide feedback and bug reports when you try out this new feature. Changed the way the compiler is looked up when creating static, musl-based native images to use the musl toolchain from musl.cc. The musl toolchain greatly simplifies the creation of static native images. Using a toolchain also ensures minimum changes will be needed on users’ side to create a dynamically linked musl based image. See the documentation. Added a new policy for the Serial GC reducing the memory footprint of applications at run time. The new policy enables survivor spaces for the young generation, a feature that has been present in the codebase for a while but was not enabled by default. In addition, a full GC no longer scans the whole image heap for root pointers, but only parts of the image heap that have been written to. The new policy is not enabled by default (this is planned for the next release) but can be enabled using -H:InitialCollectionPolicy=Adaptive. Please test the new policy and report any regressions so that they can be addressed before the next release. Improved the precision of the static analysis: small methods are now inlined before the static analysis. This improves constant folding and reduces surprises. For example, previously code that accessed a static final field directly was optimized differently from code that accessed a static final field via an accessor method: void foo() { if (MyConfiguration.WINDOWS) { // The static analysis does not see this code as reachable on non-Windows platforms. } } static boolean isWindows() { return MyConfiguration.WINDOWS; } void bar() { if (isWindows()) { // The static analysis marked this code as reachable because the method invocation prevented constant folding before the static analysis. With method inlining before static analysis enabled now, this code is no longer seen as reachable on non-Windows platforms. } } Arguments to the native image generator can now be passed in a separate file that is provided with the @argument option. This is a necessary workaround for platforms like Windows where the length of the command line is limited. Root certificates can now be configured at image run time. Previously, the root certificates present at image build time were the only root certificates available at run time. See the documentation for details, and to find a list of system properties that are now read at run time to configure the root certificates. Crash dumps, which are printed when segfault or fatal VM errors happen, now include more details to aid diagnostics. Also, the beginning of the image heap is now protected memory so that null pointer accesses produce a segfault instead of accessing random memory. Internal VM errors, where an illegal virtual method table entry is accessed, produce a better crash dump. On Linux, the processor count reported at run time now takes limitations set via cpuset into account. Improved Dwarf debug info generation now includes information about inlined methods (contributed by Red Hat). JDK Flight Recorder (JFR) support is now also available for JDK 17 based GraalVM (contributed by Red Hat). Polyglot Runtime Improved stability and performance of the experimental engine caching feature. See the documentation for more details. (Only available in GraalVM Enterprise.) Improved builtin CPU sampler tool usability with all polyglot languages (see --cpusampler option). Increased precision of the sampling output by using the new guest language safepoint mechanism. The sampling output now shows inlined methods in addition to compilation units by default. Simplified the default sampling histogram output and added the --cpusampler.ShowTiers option to show time spent in each optimization tier. Added the SVG flamegraph output format to the CPUSampler. To enable it, use option --cpusampler.OutputFormat=flamegraph. Java on Truffle Added Java 17 guest and host support. Enabled support using interop buffer-like object as byte[] in Java on Truffle. See “buffer elements” in the Interop API javadoc. Added support for buffer interop messages to the explicit Interop API. The Polyglot API is not enabled by default anymore. When needed, contexts should be created with the java.Polyglot option set to true. The HotSwap API is not auto-enabled by debugging anymore. When needed, contexts should be created with the java.HotSwapAPI option set to true. Added optimization to avoid illegal reflective access warnings with the host Java 11 or higher. The project changelog is available on GitHub. JavaScript Updated Node.js to version 14.17.6. Implemented the Error Cause proposal. It is available behind the experimental option --js.error-cause. Implemented the Import Assertions proposal. It is available behind the e"
