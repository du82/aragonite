title = "GraalVM for JDK 21"
description = "GraalVM is an advanced JDK with ahead-of-time Native Image compilation."
full_description = "GraalVM Release Calendar GraalVM for JDK 23 GraalVM for JDK 22 GraalVM for JDK 21 GraalVM for JDK 20 GraalVM for JDK 17 GraalVM 22.3.x GraalVM 22.2.x GraalVM 22.1.x GraalVM 22.0.x GraalVM 21.3.x GraalVM 21.2.x GraalVM 21.1.x GraalVM 21.0.x GraalVM 20.3.x GraalVM 20.2.x GraalVM 20.1.x GraalVM 20.0.x GraalVM 19.3.x GraalVM for JDK 21.0.2 (2024-01-16) This is the January 2024 Critical Patch Update (CPU) for GraalVM Community Edition. It is based on the OpenJDK CPU and includes all the OpenJDK security fixes released as part of that CPU, platform updates, and some GraalVM bug fixes. It is a full distribution and supersedes the previous release of GraalVM Community Edition for JDK 21. Updated GraalVM Community Edition for JDK 21.0.1 to 21.0.2+13. See the OpenJDK 21 Updates. Version compatibility: Truffle languages and other components version 23.1.2 are designed for use with GraalVM for JDK 21.0.2. Compiler fixes: Rearranged binary arithmetic operations that may be re-associated for loop invariants and constants. Fixed Sulong benchmarks failing because of compilation failures. Improved the AArch64 architecture support: allowed BranchOp to emit FarBranch; made AArch64 HotSpot null constant code generation more generic. Ensured Guards Anchor to CaptureStateBegin. The compiler now checks stamps before casting in IntegerLessThanNode. HeapImpl.dirtyAllReferencesOf must be no-op for the Epsilon garbage collector. Simplified the ValueAnchorNode implementation. Removed explicit null check exceptions during generation of checkcast and instanceof. Native Image fixes: Updated OS detection code to recognize Windows 11 and Windows Server 2022. Added an option that allows VM operations to exceed the max heap size. Fixed a problem with -XX:+PrintGCSummary if assertions are enabled. Fixed crashes during isolate teardown. Native Image now ignores crashed threads. Improved the OutOfMemoryError messages. Native Image now reports consistent values when memory usage is queried via MemoryPoolMXBean. Introduced the --disable-debuginfo-stripping argument for the mx tool. Fixed handling native-image JSON properties stored in the wrong location. Added a fix to prevent System.console().readPassword failures. Improved mangling of primitive types in BFD name mangler#7423. Fixed the native-image --bundle-create,container command failing if a driver is an image. Made the initialization cycle break in NIO/cgroups code. Fixed a transient guarantee failure in PointsToAnalysisMethod.getContextInsensitiveVirtualInvoke. Improved the JFR support: switched to PlatformThreads.getCurrentThreadOrNull() instead of Thread.currentThread(); fixed race condition in JVM.commit(long). Ensured DeoptTargets are generated for methods requiring FrameInformation. Now the Native Image builder uses synchronized data structures for reachability handlers registration. Added an async-signal-safe way to dump crash logs. Added an option to artificially increase the header size. Fixed stack walking heuristic used for the Native Image crash log. Fixed joinThreadUnmanaged on Windows. Used the vendor version for __svm_version_info. Made the builder use ThreadLocal for AccessControlContext stack. Fixed class-path order when MANIFEST files include “Class-Path” attributes. Added support for execution of bootstrap methods at image run time, and support “constant dynamic” execution at image run time. Native Image now prints crash log when exception handling fails. Fixed clinit simulation for arraycopy with null values. Included signers in the native executable only if registered. Do not use the shadow heap for fields annotated with @Unknown*Field. Truffle framework fixes: Handle json-23.1.0.jar native-image.properties stored in the wrong location. Upgraded the JSON parser library, org.json, to version 20231013. Fixed regression in spawning an Espresso context on platforms where it runs on Sulong. Fixed handling unlinked types in runtime compilation. Disabled the class-path isolation by default. Added polyglot version checks for unchained. Added assertion triggers check that fails and throws an exception. Tools: Added the mandatory experimental property debuggerId and handle GET of the /json/list path. Javascript: Updated the expected Node.js structure after the update to version 18.18.2. Prevent automatic leave of an explicitly entered context during close called from a host call. LLVM: Initializing LLVM fails if built with Xcode 15. Regression in the Sulong library loading when IO access is denied. Java on Truffle (Espresso): Removed the need for a foreign field in EspressoForeignList. Added missing Espresso artifacts on Maven. Fixed ToEspresso collection type nodes not handling Espresso objects. Fixed type converter combination for foreign exceptions and custom type converters. Python: Fixed Python JVM standalones only working on GraalVM Community Edition. WebAssembly: File system access from GraalWasm. TRegex: Added OracleDB flavor. GraalVM integration: Fixed a list of deployed artifacts. Lambda without a target invoke. GraalVM for JDK 21.0.1 (2023-10-24) This is the October 2023 Critical Patch Update (CPU) for GraalVM Community Edition. It is based on the OpenJDK CPU and includes all the OpenJDK security fixes released as part of that CPU, platform updates, and some GraalVM bug fixes. It is a full distribution and supersedes the previous release of GraalVM Community Edition for JDK 21. Updated GraalVM Community Edition for JDK 21 to 21.0.1+12. See the OpenJDK 21 Updates. Version compatibility: Truffle languages and other components version 23.1.1 are designed for use with GraalVM for JDK 21.0.1. Compiler fixes: Changed constant blinding to use RuntimeRandomness for ahead-of-time compilation. Added FarBranch support for BranchOp for the AArch64 architecture. Native Image fixes: Fixed process crashing when uncommitting unused memory. Added CEntryPointError if the stack boundaries cannot be determined. Removed no longer needed JDK-specific Java Flight Recorder code. Fixed an occasional crash using ProcessBuilder on macOS. GraalVM for JDK 21 (2023-09-19) Platform and Distributions Removed Functionality Java and Compiler Native Image Polyglot Embedding JavaScript and Node.js Java on Truffle Python Ruby WebAssembly LLVM Truffle Language and Tool Implementations Platform and Distributions Released GraalVM Community Edition for JDK 21 based on OpenJDK 21. See OpenJDK 21 Updates. Released Oracle GraalVM for JDK 21 based on Oracle JDK 21. See Java SE 21 Release Notes. Released language runtimes as standalone distributions, therefore there are no language launchers in the GraalVM JDK. Two standalone language runtime options are available for both Oracle GraalVM and GraalVM Community Edition: a Native Image compiled native launcher or a JVM-based runtime (included). To distinguish between the GraalVM editions, the GraalVM Community Edition version has the suffix -community in the name, for example: graaljs-community-<version>-<os>-<arch>.tar.gz. To distinguish between the runtime mode, a JVM standalone type has the -jvm suffix in a name. Standalone distributions are available on GitHub, in corresponding language repositories. Learn more here. Removed Functionality Removed GraalVM Updater, gu, used to extend GraalVM installations with GraalVM language runtimes and other components by modifying the installation directory. As part of the alignment with OpenJDK, modifying JDK installations is not common. To continue using the GraalVM language runtime(s) and other components, use language standalones or specify them as Maven or Gradle dependencies in your project. For more information, see Polyglot Embedding updates and the GitHub issue #6855. Removed the option --language:<language> (to enable a specific language runtime at build time) and some macro options. See below for more details. Java and Compiler Implemented initial optimization of Java Vector API (JEP 338) operations. Load, store, basic arithmetic, reduce, compare, and blend operations are transformed to efficient machine instructions where possible. It is enabled by default and can be disabled with -Dgraal.OptimizeVectorAPI=false. This optimization is not available in GraalVM Community Edition and not yet available in GraalVM Native Image. Coverage of more operations and Native Image support are planned for the future. This optimization is experimental. Implemented all intrinsics prior to JDK 21 on both AMD64 and AArch64 architectures for the Graal compiler. We have also ported various HotSpot assembly stubs into Java, including all of the SHA message digest stubs and part of the BigInteger arithmetic computation stubs. This allows Native Image to benefit from these high performance assembly codes. Users can enable backward-edge CFI in the Graal compiler by setting the -XX:UseBranchProtectionHotSpot option. Whether the user provides standard or PAC-RET protection, the Graal compiler will automatically enable backward-edge CFI when running on the AArch64 architecture. Before a function returns, the Graal compiler issues an authentication instruction that checks the integrity of the signed return address. If this integrity check fails, the authentication instruction stamps the higher bits of the corrupted address reserved for the pointer authentication code (PAC) to invalidate the pointer. When the function returns to the corrupted pointer, then the OS will raise a SIGSEGV signal, since the corrupted pointer now refers to an invalid (for example, unmapped) address. Even if an adversary has full control over the stored return address, the authentication instruction takes away control by resetting whatever the adversary provides to a random point high up in the process address space. Learn more about UseBranchProtection here. The following JDK 21 features are not available: JEP 439 Generational ZGC Native Image New Features Users can now use G1 Garbage Collector on the Linux AArch64 architecture to build efficient native executables with large heaps and minimal pause times (not available in GraalVM Community Edition). Previously, it was only available for Linux AMD64. To enable it, pass the option --gc=G1 to the native-image builder. Learn more about Memory Management in Native Image. Introduced a new class initialization approach that will become the default in the future: all classes are now allowed to be used and initialized at build time, regardless of the class initialization configuration. For classes that are configured as --initialize-at-run-time this means that they will appear as uninitialized again at run time. To enable the new approach, pass the --strict-image-heap flag to Native Image. For more information and implementation details, take a look at the proposal #4684. Note that there is a known issue when a build that does not satisfy the new policy would fail with the following error: Boolean option value can be only + or -. This will be resolved in a patch release on October 24, 2023 and we will share more details on the new policy and best practices in the upcoming blog post. Improved the reporting of missing metadata by throwing MissingReflectionRegistrationError when attempting to create a Proxy class without having it registered at build time, instead of VMError. Added optimization level 3 to the native-image builder for the best peak performance (not available in GraalVM Community Edition). This new level includes optimizations that previously were part of optimization level 2 and that work best together with Profile-Guided Optimizations. As a result, the compilation time when building with the default -O2 is significantly reduced. Also, the --pgo option automatically enables -O3. Added experimental support for foreign down calls (OpenJDK project Panama) in Native Image. Please test it and provide feedback. Support for upcalls is planned for the future. Added the option --parallelism to control how many threads are used by the Native Image build process. The minimal number is 2. This option is useful for build environments with constrained resources. Also, starting from this release, the build output will print out the memory and thread limits of the build process, for example: Build resources: - 13.24GB of memory (42.7% of 31.00GB system memory, determined at start) - 16 thread(s) (100.0% of 16 available processor(s), determined at start) Added the option --color[=WHEN] to color the build output. Replace WHEN with always, never, or auto. This API option supersedes the experimental option -H:+BuildOutputColorful. Introduced a new option -H:±UnlockExperimentalVMOptions to explicitly unlock access to experimental options, the majority of hosted options (starting with -H:), in Native Image. If access is not explicitly requested, an attempt to use any experimental option will fail the build with an actionable error message in this release. Also, to help users understand which dependencies requested these options, active experimental options will be listed as part of the build output alongside their origin. In the next release, this warning will be turned into a build failure. Meanwhile, the community is encouraged to open issues if certain experimental options should be promoted to public API and marked as stable. For more information, see GitHub issue #7105. The following JDK 21 features are not available: JEP 439 Generational ZGC JEP 442 Foreign Function & Memory API (Third Preview) JEP 448 Vector API (Sixth Incubator) Debugging and Monitoring Improvements Improved the monitoring experience: added support for the Java Flight Recording ThreadCPULoad event. (Together with BellSoft.) Added support for -XX:+HeapDumpOnOutOfMemoryError. (Together with Red Hat.) See a complete list of updates in the changelog. Refactoring GraalVM SDK The GraalVM SDK is split into four fine-grained modules. The use of the graalvm-sdk module is now deprecated. Note that all GraalVM APIs remain compatible in this release. The following new modules are available: org.graalvm.nativeimage: The public API of Native Image for advanced use cases. org.graalvm.polyglot: A library that allows to embed polyglot language implementations in Java. org.graalvm.word: A low-level library for machine-word-sized values in Java. org.graalvm.collections: A collections library for GraalVM components. Update your Maven and module dependencies accordingly. If you previously used the GraalVM SDK for Native Image via: <dependency> <groupId>org.graalvm.sdk</groupId> <artifactId>graal-sdk</artifactId> <version>23.1.0</version> </dependency> Now you use: <dependency> <groupId>org.graalvm.sdk</groupId> <artifactId>nativeimage</artifactId> <version>23.1.0</version> </dependency> Polyglot embedders can now use: <dependency> <groupId>org.graalvm.polyglot</groupId> <artifactId>polyglot</artifactId> <version>23.1.0</version> </dependency> For more details, see Polyglot Embedding updates. Find a complete list of updates in the GraalVM SDK changelog. Polyglot Embedding Turned all Gra"
