full_description = '''Download Oracle GraalVM Java 23 Java 17 Java 21 Java 23 Choose a platform Linux x64 Linux AArch64 macOS x64 macOS M1/AArch64 Windows x64 Download License Change for Oracle GraalVM for JDK 17 Critical Patch Updates (CPU) CPU releases of GraalVM for JDK 17.0.13 and later are released under the GraalVM OTN license and are available for download here. Updates for Oracle GraalVM for JDK 21 and JDK 23 continue to be available under the GraalVM Free Terms and Conditions license. GitHub Actions Container Images SDKMAN! Script-friendly URLs Paketo Buildpack - uses: graalvm/setup-graalvm@v1 with: java-version: '23.0.2' distribution: 'graalvm' github-token: ${{ secrets.GITHUB_TOKEN }} The GitHub Action for GraalVM makes it easy to set up GraalVM inside GitHub Actions workflows. You can use this to create automated pipelines that build, test, and deploy your applications, both with the high-performance GraalVM JIT compiler and Native Image. # GraalVM JDK with Native Image docker pull container-registry.oracle.com/graalvm/native-image:23 # GraalVM JDK without Native Image docker pull container-registry.oracle.com/graalvm/jdk:23 Oracle Container Registry provides two different kinds of container images of GraalVM. Use the "native-image" container image to turn your application into a native executable. If you do not intend to use Native Image, we also provide a smaller "jdk" container image without the Native Image feature and its dependencies. Note that for JIT deployments, we recommend jpackage and jlink for packaging. Both container images can be used for this. sdk install java 23.0.2-graal SDKMAN! is a popular tool that helps you install and switch between JDKs, including GraalVM. # Download with wget wget https://download.oracle.com/graalvm/23/latest/graalvm-jdk-23_linux-x64_bin.tar.gz # Download with curl curl https://download.oracle.com/graalvm/23/latest/graalvm-jdk-23_linux-x64_bin.tar.gz # Download from archive curl https://download.oracle.com/graalvm/23/archive/graalvm-jdk-23_linux-x64_bin.tar.gz Script-friendly URLs enable you to download GraalVM from a command line, or automatically in your script and Dockerfile by using a download URL to deliver the latest release. You can also use an archive URL to download a specific version of GraalVM. (Append .sha256 to the URL to download its corresponding checksum.) pack build applications/native-image \ -b paketo-buildpacks/oracle \ -b urn:cnb:builder:paketo-buildpacks/java-native-image \ --builder paketobuildpacks/builder-jammy-tiny \ --env BP_MAVEN_ACTIVE_PROFILES=native Paketo Buildpacks help you transform your application into a lightweight and production-ready container image containing a native executable built with GraalVM Native Image. Click here for more information on how to build your Spring Boot applications with GraalVM and buildpacks. Oracle GraalVM is free to use in production and free to redistribute, at no cost, under the GraalVM Free Terms and Conditions. Installation Options Current Releases Early Access Builds Archived Releases GraalVM Community Edition Read More Get Started Release Notes Oracle GraalVM License Quick References'''
