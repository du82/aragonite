["https://graalvm.org/release-notes/release-candidates"]
title = "GraalVM Release Candidates"
description = "GraalVM is an advanced JDK with ahead-of-time Native Image compilation."
full_description = 'GraalVM Release Calendar GraalVM for JDK 23 GraalVM for JDK 22 GraalVM for JDK 21 GraalVM for JDK 20 GraalVM for JDK 17 GraalVM 22.3.x GraalVM 22.2.x GraalVM 22.1.x GraalVM 22.0.x GraalVM 21.3.x GraalVM 21.2.x GraalVM 21.1.x GraalVM 21.0.x GraalVM 20.3.x GraalVM 20.2.x GraalVM 20.1.x GraalVM 20.0.x GraalVM 19.3.x GraalVM Release Candidates 1.0-RC16 (2019-04-23) Java We addressed several benchmarks that had slower performance when running with the GraalVM compiler built as a native library, also known as libgraal, a mode selected as the default in the last release candidate. We fixed an issue causing a delay when shutting down the virtual machine process at the end of the execution of an application (see #1140). Native Image We improved the structure of the org.graalvm.nativeimage API: classes that can only be used during image generation are now in the package org.graalvm.nativeimage.hosted, to clearly separate them from the classes that can be used at image run time. In order to stay backwards compatible, the original classes are still present, but marked as deprecated. They will be deleted in the next release candidate, so please update to the new classes. We fixed several bugs that were reported on GitHub, including an issue with the logging framework which materialized as an error that no instances of java.util.logging.SimpleFormatter are allowed in the image heap. As a result, native images work now correctly with Helidon, a Java framework designed for writing microservices which recently announced their support for GraalVM native images: Helidon flies faster with GraalVM. Ruby A complete changelog for the Ruby component is available on GitHub. The highlights include: Rounding modes have been implemented or improved for Float, Rational, BigDecimal classes (see #1509). Added a pure-Ruby implementation of Foreign Function Interface (FFI) which passes almost all Ruby FFI specs (see #1529). The KeyError raised from ENV#fetch and Hash#fetch now matches MRI’s message formatting (see #1633). JavaScript A complete changelog for the JavaScript component is available on GitHub. The highlights include: Loading JavaScript source code from URLs is now guarded by the js.load-from-url command line option and prohibited by default. R A complete changelog for the R component is available on GitHub. The highlights include: Allow parsing any letter in identifiers including, e.g., Japanese, with lexer starting from 1.0-RC16, which matches GNU-R behavior. Python Improved startup time of the graalpython native launcher. LLVM Runtime The lli launcher now starts with the locale set to C. 1.0-RC15 (2019-04-05) Java By default, libgraal is now used when running the java launcher or when using the --jvm mode for the language launchers. The libgraal library is a version of the GraalVM compiler pre-compiled by native-image. In addition to improving startup time, libgraal completely prevents the GraalVM compiler from interfering with the heap usage and profiles of application code. It has execution properties similar to other native HotSpot compilers such as C1 and C2. JavaScript Enabled Polyglot builtin based on Context.Builder.allowPolyglotAccess(). Added rest and spread properties support for foreign objects. For example, this spread syntax is now supported: var arr1 = [0, 1, 2]; var arr2 = [3, 4, 5]; arr1 = [...arr1, ...arr2]; // arr1 is now [0, 1, 2, 3, 4, 5] To see a complete list of changes, please refer to the project changelog. R New Features Implemented gzcon builtin for URL connections. Changes Truffle interoperability API converts double values to int values if they fit in the integer range. Bug Fixes R incorrectly allowed Java interoperability when not started with --jvm. Starting from 1.0-RC15, --jvm flag is again necessary to enable interoperability with Java. A complete project changelog is available on GitHub. Ruby An extensive list of changes is available on GitHub. Here is a short list of the most notable ones: Changes Our experimental JRuby-compatible Java interop has been removed – use Polyglot and Java instead. Process.clock_getres has been implemented. debug, profile, profiler, which were already marked as unsupported, have been removed. Bug Fixes autoload :C, "path"; require "path" now correctly triggers the autoload. The shell standard library can now be require-d. Compatibility Improved compatibility with MRI’s Float#to_s formatting #1626. Added support for the base keyword argument to Dir.{[], glob}. Python Changes Migrated to the new Truffle libraries for interoperability support. Added support for importing Java classes from the java namespace using normal Python import syntax, e.g., from java.util import ArrayList. Implemented PEP 487 and PEP 560 to make the typing module work. More details can be found in the project changelog on GitHub. LLVM Interpreter Added a preliminary support for bitcode produced by LLVM 8. Native Image Based on the feedback and bug reports, we improved the agent that traces reflection and JNI usage on the JavaHotSpot VM. We also changed the implementation language of the agent from C to Java. The agent is now a Native Image itself. The native-image-maven-plugin now supports multiline buildArgs and boolean parameter skip (skip image building if true). API changes for GraalVM integrators (SDK + Truffle) This version of GraalVM includes a major revision of the Truffle Interoperability APIs. Most existing APIs for Truffle Interoperability were deprecated. The compatibility layer may cause significant performance reduction for interoperability calls. Please see the Interop Migration Guide for an overview and individual @deprecated javadoc tags for guidance. We added Truffle Library API that allows language implementations to use polymorphic dispatch for receiver types with support for implementation specific caching/profiling with support for uncached dispatch. Please see the Truffle Library Tutorial for further details. The numerous changes were introduced to the GraalVM SDK Polyglot API as well: Renamed Graal SDK to GraalVM SDK. Experimental options now require --experimental-options on the command line to be passed to the GraalVM language launchers, or Context.Builder#allowExperimentalOptions and Engine.Builder#allowExperimentalOptions to be set in other scenarios. For example, to diagnose the memory allocations of a JavaScript application with --memtracer profiling tool, you should prepend --experimental-options option: js --experimental-options --memtracer program.js. Added a possibility to set an encoding in Source builder. Added a new API for target type mappings using the new HostAccess API. We summarized all Truffle and SDK changes between GraalVM versions in separate changelogs: GraalVM SDK changelog GraalVM Truffle changelog Tools Chrome Inspector Object Preview feature added for GraalVM implementation of JavaScript. Implemented a Custom Preview experimental feature for all languages supported by GraalVM. Ideal Graph Visualizer (IGV) Starting with 1.0-RC15 version of GraalVM, Ideal Graph Visualizer will be provided as standalone download from Oracle Technology Network Downloads page. It is not part of GraalVM Community or Enterprise editions. 1.0-RC14 (2019-03-18) Introducing --vm.<option> We introduced a uniform --vm.<option> which allows to pass options in a uniform way, without knowing which VM mode (--jvm, or --native) will be used. It replaces --jvm.<option> and --native.<option> command line options, e.g., the option to configure the maximum amount of memory used for the heap --jvm.Xmx=5G becomes --vm.Xmx=5G. This applies to all languages. Java libgraal This is the first release to include a prebuilt libgraal shared library. This shared library is produced by the native-image and contains a pre-compiled version of the GraalVM compiler. In addition to improving startup, libgraal completely avoids interfering with the heap usage and profiling of the application code. That is, it has execution properties similar to other native HotSpot compilers such as C1 and C2. To try it out, add -XX:+UseJVMCINativeLibrary to your java command line. Note that this is still a work in progress and we are focusing on improving its stability and ensuring it does not compromise peak performance. Default Failure Behavior The default behavior has changed for a failure (i.e., uncaught exception) during the compilation. These are now silently ignored and nothing is printed to the console. To get the old behavior of a message being printed to the console and for collecting diagnostics about the failure, you now need to specify -Dgraal.CompilationFailureAction=Diagnose option. Native Images New Features We introduced a tracing agent for the Java HotSpot VM that records usages of reflection and JNI that can then be converted to configuration files for the native image generator. This simplifies the process of getting new applications working as native images. For details, see the documentation. We improved support for the java.util.logging API. See the GitHub docs for details. The javax.script.ScriptEngine API is now supported. Please note that the Nashorn JavaScript engine does not work in native images and is therefore always excluded. However, Truffle based language implementations such as the GraalVM JavaScript engine are available when, e.g., the native image is built with the option --language:js. Implemented the Class.getSimpleName method for the native images (see 1020). Bugfixes Fixed an NPE during native image generation at accessing annotations metadata on the classes opened for reflection (see 1048). Fixed createTempFile() providing non-default file system and failing (see 1035). Fixed a segfault due to incorrect socket address length value (see 1025). JavaScript HTML-like Comments We added support for HTML-like comments. var s = "Introducing html-like comments"; alert(s); <!-- this is a comment --> Changes Renamed the option js.experimental-array-prototype to js.experimental-foreign-object-prototype. More details can be found in the project changelog on GitHub. R The GraalVM implementation of R in this release comes with various bug fixes and improvements. Error Propagation According to the R semantics, errors are handled immediately at the point where they are raised. However, in language embedding or polyglot scenarios, it is more useful to have the errors propagate out of the R scope, so that they can be handled correctly. We changed the behavior of FastR in this regard so that now R errors are propagated. Note that this only happens if this is possible without causing unexpected side effect in R code, i.e., if there are no options(error = ...) or on.exit(...) handlers on the stack. Experimental Options All specific options (NOT those GNU-R compatible like --save) are experimental except for --R.PrintErrorStacktracesToFile, which is an option that enables logging of FastR internal errors for bug reporting purposes. Experimental options can be unlocked using --experimental-options or with ContextBuilder#allowExperimentalOptions. To see a complete list of changes, please refer to the project changelog. Ruby This version of GraalVM features new methods implementations and other updates for Ruby implementation. New Features Implemented Dir.children and Dir#children, String#delete_prefix, #delete_suffix and related methods. Changes -Xlog= has been removed. Use --log.level= instead. -J flag has been removed. Use --vm.* instead. -J-cp lib.jar and similar have been removed. You should use --vm.cp=lib.jar or --vm.classpath=lib.jar instead. The -X option now works as in MRI. An extensive list of changes is available on GitHub. Python Python 3.7.0 The standard library was updated to Python 3.7.0 from 3.6.5. Changes Defined a subset of the graalpython launcher options as “stable”. All other options are subject to change and need to be unlocked explicitly on the command line. Added the support for -I flag to ignore the user environment and not add the working directory to sys.path. More details can be found in the project changelog on GitHub. LLVM Runtime Various bug fixes. API Changes for GraalVM Integrators (SDK + Truffle) New Features Added Context.Builder#allowExperimentalOptions to control whether experimental options can be passed to a Context. Added Engine.Builder#allowExperimentalOptions to control whether experimental instrument and engine options can be passed. The @Option annotation can now specify the stability of an option. Added engine bound TruffleLogger for instruments. The engine bound logger can be used by threads executing without any context. Changes Multiple deprecated elements were removed from the Truffle language implementation framework, i.e., TruffleException.isTimeout, EventBinding.getFilter etc.. We summarized GraalVM Truffle and GraalVM SDK changes between GraalVM versions in the separate changelogs: GraalVM SDK changelog GraalVM Truffle changelog 1.0-RC13 (2019-03-05) Tools Ideal Graph Visualizer With GraalVM 1.0-RC13 release, there has been a significant change to the Ideal Graph Visualizer developer tool. The default behavior of the Dgraal.Dump option has changed in that IGV dumps are now written to the local file system by default. To get the old behavior of dumping straight to an IGV instance listening on 127.0.0.1:4445, you need to add -Dgraal.PrintGraph=Network option. If a network connection cannot be opened, dumping falls back to file system dumping. Graal VisualVM Another developer tool, Graal VisualVM, now allows Heap monitoring of native-image processes. This functionality is available with Oracle GraalVM. R R specific command line options are now passed as –R.PrintErrorStackTracesToFile=true instead of using JVM properties (–jvm.R:+PrintErrorStackTracesToFile). You can view available options with --help:languages. Optional post installation script, configure_fastr, also regenerates etc/Renviron and etc/ldpaths files according to the target system. R vectors are not writeable from other languages, because this would violate the R language semantics. A list of changes to GraalVM implementation of R is available on GitHub. JavaScript Node.js updated from 10.15.0 to version 10.15.2. Made JavaScript and Java interoperability available in native images. Note that you have to configure the accessible classes and methods at native image build time. Node.js Worker class should be used instead of deprecated experimental Java.Worker API now. A deprecated NashornJavaInterop mode was removed. More details can be found in the project changelog on GitHub. LLVM Runtime Added the support for embedded bitcode in Mach-O files. We support bitcode in the __bitcode section of Mach-O object files, as well as bitcode files in an embedded xar archive in the __bundle section of executables or dylibs. For example, on OS X, you can compile your code with clang -fembed-bitcode -flto hello.c -o hello, creating a native executable with embedded bitcode. You can then run it natively (.'
