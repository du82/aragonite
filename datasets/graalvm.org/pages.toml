full_description = "All PackagesPolyglotNative Image LibGraal extensionsNative ImageCollectionsWord Package Description com.oracle.svm.core.annotate This package contains annotations that configure the substitution mechanism of GraalVM Native Image. org.graalvm.collections The GraalVM SDK collections package contains memory efficient data structures. org.graalvm.home The GraalVM SDK home API allows query home paths for the GraalVM, its languages and its tools. org.graalvm.nativeimage The GraalVM SDK Native Image API allows to customize the native image generation, i.e., the ahead-of-time compilation of Java code to standalone executables. org.graalvm.nativeimage.c This package and its sub-packages provide a fast and lightweight interface between Java code and C code. org.graalvm.nativeimage.c.constant This package provides parts of the Java / C interface that are related to C constants. org.graalvm.nativeimage.c.function This package provides parts of the Java / C interface that are related to C functions. org.graalvm.nativeimage.c.struct This package provides parts of the Java / C interface that are related to C structures. org.graalvm.nativeimage.c.type This package provides parts of the Java / C interface that are related to standard C pointer types, as well as utility functions to convert between Java types and C types. org.graalvm.nativeimage.hosted The GraalVM SDK Native Image API allows to customize the native image generation, i.e., the ahead-of-time compilation of Java code to standalone executables: Features allow clients to intercept the native image generation and run custom initialization code at various stages. RuntimeClassInitialization is used to configure when classes are initialized. RuntimeReflection to register classes, methods, and fields for reflection at run time. org.graalvm.nativeimage.libgraal Extensions to the GraalVM SDK Native Image API to customize building libgraal. org.graalvm.nativeimage.libgraal.hosted Extensions to the GraalVM SDK Native Image API to customize building libgraal. org.graalvm.options The GraalVM SDK options package contains reusable collection classes for options. org.graalvm.polyglot The GraalVM SDK polyglot API allows to embed Graal languages in Java applications. org.graalvm.polyglot.io Input/Output support for the GraalVM SDK polyglot API. org.graalvm.polyglot.management The management package provides tools that monitor and instrument the behavior of guest language programs. org.graalvm.polyglot.proxy The GraalVM SDK proxy interfaces allow to mimic guest language objects, arrays, executables, primitives and native objects in Graal languages. org.graalvm.word This package provides a low-level mechanism to use machine-word-sized values in Java."
