["https://gradle.org/whats-new/gradle-9"]
title = "Gradle | What's coming up in Gradle 9.0"
description = "New features in Gradle 9.0 since version 8.0."
full_description = "What's coming up in Gradle 9.0 Gradle 9.0 is the next major Gradle Build Tool release we are currently working on. The target release date for the public release of Gradle 9.0 is the second quarter of 2025. Soon, we plan to ship the first milestone and release candidate builds. Stay tuned! Scope Our focus remains on improving build comprehensibility and scalability. As outlined on our public roadmap, the key initiatives include: Delivering clean and actionable reporting Promoting Configuration Cache as the preferred way of execution Incubating status of Isolated Projects Upgrading to Kotlin 2 and the K2 compiler Provider API Migration to make APIs for Kotlin DSL and Groovy DSL consistent We also plan to increase the minimum required Java version to 17. Overview In September 2024, Louis Jacomet has presented the current state and the plans for Gradle 9.0 and beyond. Watch the recording: Timeline The target release date for the public release of Gradle 9.0 is the second quarter of 2025. The first milestone release and the release candidates are planned for early 2025. Learn More You can find more details in the Road to Gradle 9 blog post by Louis Jacomet. For a more detailed overview, including demos, see the Devoxx Belgium presentation by Louis and Alex Semin (video)."
