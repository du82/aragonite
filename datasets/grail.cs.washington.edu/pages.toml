title = "Multi-View Stereo for Community Photo Collections"
full_description = '''The Google Tech Talk "Navigating the World's Photographs" by Steve Seitz, Noah Snavely, and Michael Goesele gives a good overview over our current work on community photo collections (including multi-view stereo reconstruction). View a video of the talk on Google Video or download the video in Flash Video (FLV) format (114 MB) or AVI format (141 MB). NewScientist.com ran a story on this work on October 29th, 2007. Have a look at the article "Holiday snapshots used to model the world in 3D" by Will Knight that explains the basic ideas behind the paper. The following datasets we reconstructed using the proposed multi-view stereo technique. Models were trimmed using standard mesh processing operations to remove spurious geometry introduced by the Poisson reconstuction approach. reconstruction based on 56 images from Flickr captured by 8 photographers large image of the rendered model reconstruction based on 653 images from Flickr captured by 313 photographers large image of the rendered model templeFull reconstruction based on 312 images from the test set (0.42 mm accuracy, 98.2% completeness)'''
