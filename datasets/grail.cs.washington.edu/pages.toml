["https://grail.cs.washington.edu/projects/totalmoving"]
title = "Total Moving Face Reconstruction"
full_description = "Total Moving Face Reconstruction ECCV 2014 Supasorn Suwajanakorn, Ira Kemelmacher-Shlizerman, Steven M. Seitz Abstract We present an approach that takes a single video of a person's face and reconstructs a high detail 3D shape for each video frame. We target videos taken under uncontrolled and uncalibrated imaging conditions, such as youtube videos of celebrities. In the heart of this work is a new dense 3D flow estimation method coupled with shape from shading. Unlike related works we do not assume availability of a blend shape model, nor require the person to participate in a training/capturing process. Instead we leverage the large amounts of photos that are available per individual in personal or internet photo collections. We show results for a variety of video sequences that include various lighting conditions, head poses, and facial expressions. Publication Paper, Supplementary_Material To be presented at European Conference on Computer Vision (ECCV), 2014. Results Last modified: document.write(document.lastModified);"
