["https://grail.cs.washington.edu/projects/carpentrycompiler"]
title = "Carpentry Compiler"
full_description = "Chenming Wu (Tsinghua and University of Washington) Haisen Zhao (University of Washington) Chandrakana Nandi (University of Washington) Jeffrey I. Lipton (University of Washington) Zachary Tatlock (University of Washington) Adriana Schulz (University of Washington) Our carpentry compiler converts high-level geometric designs made by users to low-level fabrication instructions that can be directly followed to manufacture parts. The compiler performs multi-objective optimization on the low-level instructions to generate Pareto-optimal candidates. Dec. 2019: The source codes will be publicly available on Github Repository around the end of Janurary, thanks for your interest! Traditional manufacturing workflows strongly decouple design and fabrication phases. As a result, fabrication-related objectives such as manufacturing time and precision are difficult to optimize in the design space, and vice versa. This paper presents HL-HELM, a high-level, domain-specific language for expressing abstract, parametric fabrication plans; it also intro-duces LL-HELM, a low-level language for expressing concrete fabrication plans that take into account the physical constraints of available manufacturing processes. We present a new compiler that supports the real-time, unoptimized translation of high-level, geometric fabrication operations into concrete, tool-specific fabrication instructions; this gives users immediate feedback on the physical feasibility of plans as they design them. HELM offers novel optimizations to improve accuracy and reduce fabrication time as well as material costs. Finally, optimized low-level plans can be interpreted as step-by-step instructions for users to actually fabricate a physical product. We provide a variety of example fabrication plans in the carpentry domain that are designed using our high-level language, show how the compiler translates and optimizes these plans to generate concrete low-level instructions, and present the final physical products fabricated in wood."
year_published = 2025
