title = "Automated Generation of Interactive 3D Exploded View Diagrams"
full_description = "We present a system for creating and viewing interactive exploded views of complex 3D models. In our approach, a 3D input model is organized into an explosion graph that encodes how parts explode with respect to each other. We present an automatic method for computing explosion graphs that takes into account part hierarchies in the input models and handles common classes of interlocking parts. Our system also includes an interface that allows users to interactively explore our exploded views using both direct controls and higher-level interaction modes. Exploded view diagram generated by our system. Our system instruments 3D models to enable interactive exploded views. This illustration of a turbine model was automatically computed to expose the user-selected target part labeled in red."
