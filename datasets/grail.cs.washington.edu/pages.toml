title = "VripPack: Volumetric Range Image Processing Package"
full_description = "VripPack is a package for volumetrically merging a set of range images. Developed as part of the project to build a 3D fax machine, it is based on a new approach to surface reconstruction from range images (see Brian Curless and Marc Levoy , A Volumetric Method for Building Complex Models from Range Images, Proceedings of SIGGRAPH96). VripPack is being made available for research and commercial use, free of charge, as described at the bottom of this web page. A closely related software package is Volfill, our diffusion-based hole filler for large polygon meshes. Note that VripPack is designed for merging but not aligning range images. We also distribute the Scanalyze package which does have an alignment feature. If you have any questions, problems, concerns, or suggestions about the vrippack software, send mail to: This software is covered by the Stanford Computer Graphics Laboratory's General Software License. This license is royalty-free, nonexclusive, and nontransferable. Click here to view its terms and conditions. In modification of these terms and conditions, you may distribute or sell derivatives of this software without accounting to Stanford or the developers, and without payment of royalties to Stanford or the developers. However, title and copyright to the software and documentation remains with Stanford, and you must acknowledge the contribution of Stanford in any derivatives, as detailed in the license."
