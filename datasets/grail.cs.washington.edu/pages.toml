["http://grail.cs.washington.edu/data/scans"]
title = "GRAIL: Arm Scan Data"
full_description = '''Software and code for reading ply files can be found on the page for the Stanford scanning repository. These scans were taken with a Cyberware whole body scanner, and combined with the Vrip package. (Some scans show a seam from where my alignment wasn't quite right.) These scans were used in the paper "Articulated Body Deformation from Range Scan Data," by Brett Allen, Brian Curless, and Zoran Popović, presented at SIGGRAPH 2002. Please be sure to acknowledge the University of Washington Graphics and Imaging Laboratory when using this data. You are welcome to use the data for research purposes. It is not to be used for commercial purposes, nor should it appear in a product for sale without our permission. The scans have been cropped to include just the shoulder, arm and hand (and the plastic tube held in the hand). Each scan is around 80K triangles. Prior to scanning, 48 markers were placed on the arm using costume makeup. We have picked out the 3D position of each of these markers, and you can download them in arm-markers.zip.'''
