["https://granneman.com/personal/bio"]
title = "Bio | Scott Granneman"
description = "Who I am & what I’ve done."
full_description = "Scott Granneman is an author, Adjunct Professor, & partner in a technology firm. Scott has written seven books — Don’t Click on the Blue E!: Switching to Firefox, Hacking Knoppix, Linux Phrasebook, Podcasting with Audacity, Google Apps Deciphered, Mac OS X Snow Leopard for Power Users, & Linux Phrasebook: Second Edition — and contributed to several more. In addition, he was a columnist for SecurityFocus, The Open Source Weblog, and Linux Magazine. As an educator, Scott has taught people of all ages — from pre-teens to senior citizens — on a wide range of topics covering everything from technology to literary representations of Hell. He is currently an Adjunct Professor at Washington University in St. Louis, where he has taught courses such as Web Development; The Politics of Encryption: Snowden, Surveillance, & the 4th Amendment; Technology & the Law; Using Everyday Technology; From Blogs to Wikis; Technology for Managers; & Technology in Our Changing Society. He also teaches at Webster University, where he has taught courses such as Web Development, Introduction to Interactive Digital Media, Getting More From Your Mac, & Your Digital Toolbox: Software, Tips, & Tricks for Web Developers (& Other Creatives). As a Principal of WebSanity, he works with businesses and non-profits to plan, develop, & host websites using a robust open source Content Management System. In particular, he manages the firm's UNIX-based server environment, writes all the documentation, & works closely with other partners on the company's software and systems. Clients have included the Saint Louis Zoo, seven affiliates of the American Civil Liberties Union, Anheuser-Busch, PostNET/Pulitzer Technologies, the Stanford University Alumni Center, Habitat for Humanity, United States Arbitration & Mediation Midwest Inc., Washington University School of Law, & Fontbonne University, to name just a few. Scott earned his Bachelor of Arts in English and Education & his Masters in English degrees from Washington University in St. Louis. His background as a private school English teacher & Technology Coordinator has proven invaluable to his ability to clearly communicate to his present audiences. A longer, complete CV is available. In addition, you can also read student evaluations to find out what others have said about me. Education Washington University in St. Louis Masters in English, 1991 Washington University in St. Louis Bachelor of Arts, 1989 Majors in English & Education, Minor in History Professional History All employment is in St. Louis, Missouri, unless otherwise indicated. 2013– Adjunct Professor, Interactive Digital Media Courses on Web development Adjunct Professor, Computer Science Courses on Web development Webster University 2004–2007 Columnist, Linux Magazine 2003–2007 Columnist, SecurityFocus 2002– Adjunct Professor, Communications & Journalism Courses on technology, society, law, & Web developement Washington University in St. Louis 2005– Partner WebSanity 2001-2005 Senior Consultant, Internet Services Bryan Consulting 1999-2001 President & Chief Application Officer Atisma Technologies, Inc. 1998-1999 Internet Specialist SSE 1997-1998 Partner November Learning 1997-2002 Teacher Courses in Web Design & Linux St. Louis Community College 1996-1997 Business Development Manager Habanero Computing Solutions 1993-1996 Teacher Missouri Scholars Academy Columbia, Missouri 1989-1996 English Teacher, 9th & 12th grades Technology Coordinator & Webmaster Crossroads School St. Louis, Missouri Consulting Helping organizations harness the power of Internet-related technologies by developing new ways to utilize the Internet's remarkable communication, sales, & service opportunities. A partial list of clients is available. Publications Books & articles on the Internet, open source software, computer security, education, & more. Presentations Workshops and presentations to schools, conferences, businesses, technical groups, & media. See resumé below for the complete list. Honors 2003– Co-manager Central West End Linux Users Group 2002-2003 Vice President St. Louis Unix Users Group 1993, ’94, ’96 Teacher Appreciation Award Missouri Scholars Academy Awarded for “excellence in teaching and … contribution to students’ lives” 1995 Outstanding Teacher Award University of Chicago Awarded to “Outstanding and Inspiring High School Teachers” 1993 Teacher Appreciation Award Willamette University Cited as “high school teacher who contributed the most” Summer 1992 NEH Summer Seminar for School Teachers University of Pennsylvania Fully funded member of 6-week course 1992-1995 Member, Phi Alpha Theta Washington University in St. Louis chapter of National History Honorary"
year_published = 2025
