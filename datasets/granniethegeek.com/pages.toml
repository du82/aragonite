full_description = "Monthly Archives: October 2013 Review: Picture Collage Maker 3 For Mac Has All The Bells And Whistles. Oct 31 Posted by GrannieTheGeek I am a bit of an easy target when it comes to Picture Collage Apps. At my stage in life, photo preservation, scrapbooking, photo books, framing etc. – you name it – have become a wonderful way to pass the time and to relive and permanently capture the memories of days gone by. Events do come and go but can be easily evoked through the creative photo imaging process. But, the saying, “A Picture Is Worth A Thousand Words”, becomes even more powerful when you combine a number of pictures into one beautiful collage. Or two or three or more! Enter the newly updated Picture Collage Maker 3 For Mac. Read the rest of this entry → 48.485760 -81.317013 __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67a74ae4b1995', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in App, Photography, Reviews, Video Leave a comment Tags: Collages, Mac, Photography, Picture Collage Maker 3 Apple October 22nd iPad Event Will Be Live Streamed On Apple TV And The Internet Oct 22 Posted by GrannieTheGeek In 90 minutes, Apple honchos will take to the stage at the Yerba Buena center in California, A high degree of fanfare and hoopla has surrounded this particular Apple Event and justifiably so. A new line of iPads, a MacBook Pro refresh, a new line of really, really, really Smart Covers, an upgrade to the Apple TV unit and more have hit the the rumour mill over the past few weeks. And to add to the anticipation and excitement engulfing this event, Apple has announced that live streaming will be available via Apple TV and the Official Apple website. That’s pretty huge if you ask me! There was none of this when Apple launched the iPhone 5C and 5S in September. Could this be the start of something big – something revolutionary even? It could be! Here is the quick link, courtesy of TechCrunch: “For visitors on the web, the event will go live at the Apple Events section of its homepage when it starts in just a few hours. So to recap, you’ll need the following to tune in: Safari on the Mac or iOS An Apple TV gen 2 or 3, with the Apple Events channel that arrives special and automatically when things like this go down.” I will be adding updates right here in this blog topic, so refresh often and tune in for my impressions. It’s going to be an exciting day. Read the rest of this entry → __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67a74ae4b3066', { sectionId: '370373', format: 'inread' }); }); Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Apple, Apple Products, IPad Leave a comment Tags: Apple Events, IPad, IPad Mini, San Francisco, Smart Covers, Yerba Buena Center Apple Still Has “A Lot To Cover” At The Scheduled October 22nd Event. Oct 15 Posted by GrannieTheGeek The invitations have gone out to the media! Let the countdown begin. According to AllThingsD, our reliable, go-to source for all things Apple, Apple has sent invitations out for their highly touted iPad and more event on October 22nd in the Yerba Buena Center For The Arts. Read the rest of this entry → 48.485766 -81.316897 Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Apple, Apple Products, IPad Leave a comment Tags: Apple, iMac, IPad, IPad Mini, Macbook Pro"
