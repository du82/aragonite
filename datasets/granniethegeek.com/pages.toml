full_description = "Monthly Archives: November 2011 The Apple Stores: A Playground For The Apple Geeks And So Much More Nov 22 Posted by GrannieTheGeek What a vision Steve Job had when he created The Apple Stores! His child-like sense of wonder led him to believe that these stores would be a phenomenal branding tool for Apple. Even though business experts and the Apple Board were blatantly skeptical of their success, Steve Jobs remained undaunted and forged ahead. Through his detailed and innovative design, Steve Jobs created a playground for Apple enthusiasts around the world, a place where one could learn, interact, develop, work, shop or just chill with people who shared the same enthusiasm about Apple Products. Article: Former Apple Store Chief: No One Came To Genius Bars In Early Years I don’t live anywhere near an Apple Store. It’s very sad here! However, the first store I visit when traveling to a major center in the USA or Canada is The Apple Store. Clothes are not a priority for me. Gadgets are, specifically Apple gadgets and devices. Yes, I am a senior citizen but, with the time I have left here on Earth, I want to fully embrace the advances in technology. It is important to me and it energizes me knowing that I am living at a time when the innovation process is so alive and prolific. But even more important, I want to enjoy the looks on my grandchildren’s faces when I show them the newest IPad/IPhone/Apple TV and in a couple of years, Apple’s rumored Television Steve Jobs’ playful yet passionate nature has allowed people of all ages to take full advantage of his creations. I sometimes get frustrated when people my age say they don’t understand “computer stuff”. They don’t realize that Apple has created products so that the “computer stuff” is less intimidating. It is fun, creative, colorful, imaginative. It takes you to places you could never have imagined. And there is no better place to realize this fact than to experience the jubilant and helpful atmosphere of The Apple Store. The Apple employees have received rigorous training and are ready and willing to take you on an Apple adventure. Like it’s founder, Steve Jobs, they are not there to earn a fast buck nor do they pressure you to buy, Buy, BUY! The employees work without commission and are ingrained with a highly defined passion and work ethic. I have met the most wonderful people in Apple Stores – both employees and customers. The enthusiasm that permeates this signature Apple environment is contagious. Like being at a playground. Have you had exceptional experiences in an Apple Store? Please share them with us via the comments section. Videos accepted. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67b76fc4db7af', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Apple, Apple Store, Shopping, Steve Jobs, Technology 4 Comments Steve Jobs Cried Lots Of Rivers In His Quest For Perfection Nov 21 Posted by GrannieTheGeek Perfection comes at a high price. Steve Jobs learned this. Walt Disney learned this. In fact, some of the most brilliant minds throughout history made enormous sacrifices to innovate products that would change the course of history. And most died relatively early in their tumultuous, yet legendary creative careers. According to Steve Jobs’ authorized biography by Walter Isaacson, the late co-founder of Apple Inc. was extremely, extremely emotional when things did not go his way. However, his tearful episodes seemed to occur when he sensed he was losing control of the reins. His tears were those of frustration – frustration that people could not envision what he could or that those around him would not push themselves to achieve absolute perfection in their design projects. For Steve Jobs was the epitome of a control freak and, while driven by demons and, at times, a lack of personal identity, he felt that the only way to make a difference was to obsess over the finest of details. Excellence, after all, is in the details and Steve Jobs was the personification of this very fact. And, to that end, it did pay off. Apple became an overwhelming success because of his obsessive attention to detail combined with his magical thought process. However, the price he paid was extremely high. His health faltered and often times became a nagging inconvenience in his life. Apple became his focus and, because of this, he literally sacrificed his life so that we could become the joyous recipients of his creations and he, a legend to be remembered throughout time. His authorized auto-biography by Walter Isaacson was a long but necessary read. At times, it was heart-wrenching. I became physically exhausted by mentally going through the paces that Steve Jobs set for himself. Yet, to his absolute credit, he never forsake his family. Yes, there were some incidents when he was younger and more rebellious, but, in his heart, his family remained foremost in his mind. Especially in the final stages of his life. Will we ever see another like him in our lifetime? Not likely. There is only one Steve Jobs. But, I am hoping that his journey to create a technological empire against insurmountable odds will provide encouragement and inspiration to a new breed of developers. As Steve Jobs himself said during his Stanford University speech, our time here is limited. Truer words were never spoken. No one really knows or can fully appreciate the opportunities awaiting us, so it is important not to day-dream one’s life away. As the song, featured below, goes, when times are tough, you must “pick yourself up, dust yourself off and start all over again.”. I know – it’s a bit of a cheesy message but the words ring true. And, during the rocky years, Steve Jobs certainly did not waste time feeling sorry for himself. He continued to move forward. Were you inspired by Steve Jobs autobiography? Are you traveling his road or hope to do so? Drop by the comments section and share. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67b76fc4dd9c2', { sectionId: '370373', format: 'inread' }); }); Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Apple, Apple Products, Steve Jobs, Technology 3 Comments A Charlie Brown Christmas For The iPad/IPhone/IPod Touch Takes You On a Magical Journey Nov 19 Posted by GrannieTheGeek A couple of nights ago, I was feeling the Christmas spirit and decided to spend $6.99 for the A Charlie Brown Christmas IPad App. And a better way to blow seven bucks I have yet to encounter! This classic Charlie Brown tale magically comes alive via the wonders of Apple technology and Loud Crow Interactive. It is a brilliantly conceived interactive book, resplendent with animated features and personal involvement. Produced by Loud Crow Interactive, creators of PopOut! The Tale Of Peter Rabbit and PopOut! The Night Before Christmas, this Charlie Brown classic takes on a beautiful and meaningful experience when viewed on the IPad. It is also available for the IPhone and IPod Touch but, truth be told, one will more fully appreciate this interactive storybook when viewed on a larger screen. And, for all the non-Apple consumers, this storybook is also available on Android and Amazon devices. We all grew up with this storybook and now you can share this seasonal tale with your children and grandchildren in a new and meaningful way. This book offers so much: one can play Schroeder’s piano, finger paint with the gang, go carolling with the Peanuts choir, and participate in the Spectacular Super-Colossal Neighborhood Christmas Lights and Display Contest to unlock decorations for your very own Charlie Brown Christmas Tree! Check out the trailer below and empty that spare change in your pocket to purchase this book. You will immediately be thankful that you did! And your children will enjoy many hours reveling in the glow of this beautiful story. App Store Link Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Books, IPad Apps, IPhone Apps, IPod, Technology 2 Comments Tags: Charlie Brown Christmas, Loud Crow Interactive Inc."
