full_description = "Monthly Archives: October 2011 A Halloween Treat For Techno Geeks Oct 31 Posted by GrannieTheGeek Are you watching scary movies now or stuffing Halloween grab bags for the kiddies? Well, take a break and enjoy this animated spectacular from KJ92058 on YouTube.Com. This video has already received well over four million hits on YouTube. Amazing stuff! I always marvel at the creative genius that exists among us. It really makes the world an exciting place in which to live. Enjoy the Halloween Electric Light Show below. And, if you have links to other Halloween spectacles, please visit the comments and add your links. Happy Halloween everyone! __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3eff377717', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Technology 1 Comment Tags: Halloween Steve Jobs and Walt Disney: Like Two Peas In An IPod Oct 24 Posted by GrannieTheGeek Steve Jobs’ untimely passing 18 days ago has resonated strongly across the Internet. Countless articles have been written, a million plus condolence messages have been voiced on the Apple site and now, on the eve of the release of Steve Jobs’ biography, revelations of his final days are starting to surface. However, what has captured my attention more than all the leaks and spills pouring forth from Steve’s biography is how similar his path was to that of the late Walt Disney. Read the rest of this entry → __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3eff378cdc', { sectionId: '370373', format: 'inread' }); }); Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Apple, Steve Jobs, Technology 2 Comments Tags: Steve Jobs, Walt Disney Apple Executives Aware Of Steve Jobs’ Condition Prior To IPhone 4S Launch Oct 8 Posted by GrannieTheGeek When Steve Jobs’ passing was reported at approximately 8:00 P.M. on Wednesday, October 5th, I immediately added a blog topic about this very sad event in technological history. And, at the time, I mentioned that Steve Jobs’ imminent death perhaps contributed to the subdued presentation of the IPhone 4S on October 4th. Well, it looks that this was indeed the case. According to 9to5mac.com, Apple did contact the police to make them aware of Steve Jobs’ worsening condition. They did so in order to ensure privacy for his family in the event of his death. Perhaps the naysayers will think twice before voicing their negative comments in the future. Didn’t they stop to think that this might be a very difficult transition for Tim Cook and his team? And indeed it was! Their mentor, colleague and friend was dying. Dying! And still they managed to put on a brave face and present their newest product which, by the way, was approved by Steve Jobs himself in the face of death. Look at that photo(above) – that chair was left vacant in Steve’s honor. He will always be the heart and soul of Apple and his vision will continue to inspire men and women of all ages. He truly fought the good fight. God Bless Mr. Steve. IThank You and feel privileged to have lived during the Steve Jobs era. Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Apple, Shopping, Steve Jobs, Technology Leave a comment Tags: iPhone 4S, Steve Jobs Steve Jobs 2005 Stanford University Commencement Speech Oct 6 Posted by GrannieTheGeek This video featured below should be required listening for everyone. Steve Jobs’ message is powerful and his words are timeless. What a passionate and brilliant man. Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Apple, Steve Jobs, Technology Leave a comment Tags: Apple, Steve Jobs Apple’s The Great Steve Jobs Has Died Oct 6 Posted by GrannieTheGeek There is no easy way to say this. The phenomenal innovator and genius behind Apple, Steve Jobs, has died on Wednesday, October 5th, 2011 at the age of 56-years-old. How he will be missed! And yet, what a legacy he has left in his demise. Technology was revolutionized because of one Steve Jobs. This is indisputable. He was prolific in his approach to Apple and it’s products and we are the benefactors of his incredible insight and creativity. Yesterday, the IPhone 4S was released via a very subdued presentation by Apple’s new CEO, Tim Cook. Many people on Twitter were commenting on the lack of charisma from a marketing standpoint of Tim Cook and his company. However, this muted presentation ran deeper. I am sure that the executives at Apple knew that Mr. Jobs was indeed dying and were understandably upset and distracted by the news. My heart and my prayers are with his family at this very difficult time. R.I.P. Mr. Steve Jobs. And thank you for changing and rocking all of our worlds. Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Apple, Technology 3 Comments"
