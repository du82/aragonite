title = "March | 2012 | GrannieTheGeek.Com"
description = "3 posts published by GrannieTheGeek during March 2012"
full_description = "Monthly Archives: March 2012 Pour A Large Cup Of Coffee. CNN Acquires Mashable.Com Mar 14 Posted by GrannieTheGeek Well, here is your “wake me up” story of the day. According to TheSocialMediaToday.Com, CNN acquired the enormously successful Social Media Site, Mashable.Com for $200 million smackers. That’s a lot of travel and enjoy money. Here is the background: Mashable (Mashable Inc.) is a Scottish news website and Internet news blog founded by Pete Cashmore.The website’s primary focus is social media news, but also covers news and developments in mobile, entertainment, online video, business, web development, technology, memes and gadgets. Mashable was launched by Pete Cashmore from his home in Aberdeen, Scotland in July 2005. With a reported 50+ million monthly pageviews and an Alexa ranking under 250, Mashable ranks as one of the world’s largest websites. Time Magazine noted Mashable as one the 25 best blogs in 2009,and has been described as “one stop shop” for social media. As of March 2012, it has over 2,775,000 Twitter followers and over 838,400 fans on Facebook. I really have to start working harder on my site. Congratulations to the folks at Mashable.Com, particularly founder Pete Cashmore. Your hard work and dedication have been amply rewarded. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f0398aba2', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Social Media, Technology 2 Comments Tags: CNN, Mashable.Com Steve Jobs Vendetta Against Google Slowly Coming To Fruition Mar 6 Posted by GrannieTheGeek Steve Jobs must be wielding some powerful stick up in Heaven. This article from BusinessInsider.Com made me giggle. It just goes to show that you can’t mess with Stevie Boy. First reported by Bloomberg.Com, both articles state that Google Inc. and Motorola Mobility Holdings Inc. must disclose information about the development of Google’s Android operating system. As many already know and as BusinessInsider.Com did reiterate, Steve Jobs did state that Android was “grand theft” of iOS and said, “I will spend my last dying breath if I need to, and I will spend every penny of Apple’s $40 billion in the bank, to right this wrong.” And so, Apple is closer to gaining it’s monopoly over the smartphone market. When will these companies ever learn? Focus on what you do best. Google is an exceptional search engine that has expanded into areas which speak to its strengths in the Internet-based services. Whether it be Google Docs, Google Chrome, video sharing site YouTube.Com, photo-sharing site Picasa.Com, Google has cemented its technological presence and longevity. However, they clearly crossed the line when they blatantly stole ideas from Apple via the development of their Android platforms. And, now they must pay the piper. It will be interesting to see how this plays out in the end but somehow I sense that Apple will win the day here. This is a monumental step for Apple and, for the time being, the ball is clearly in their court. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3f0398c27c', { sectionId: '370373', format: 'inread' }); }); Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Apple, Steve Jobs, Technology 1 Comment Tags: Android, Google An IPad In The Right Hands Can Save Your Life Mar 5 Posted by GrannieTheGeek This is why you should always carry your IPad with you. It is literally becoming a way of life. According to this article from Tuaw.Com, quick thinking Mayo Clinic doctors used an IPad on the spot to assess a patient’s cardiac event. Here is what Tuaw.Com had to say: As reported in the Post-Bulletin newspaper, 48-year-old Andy McMonigle was working out with his cycling club at the clinic’s Dan Abraham Healthy Living Center when he began to feel intense pressure in his arm. McMonigle has a history of heart trouble, so he immediately went to the locker room and asked a man for help. That man was Mayo Clinic internal medicine resident Dr. Daniel Leuders, who stayed by the side of McMonigle and yelled loudly for assistance. Two other Mayo residents (brothers Daniel and Christopher DeSimone) were literally just around the corner, so when they arrived Leuders reached into his backpack and pulled out his iPad. Within seconds, Leuders was connected to the Mayo’s electronic medical record system, where he was able to pull up McMonigle’s medical history. The history showed that McMonigle had a heart stent installed after a previous heart attack four years ago, which made the physicians suspect that he was suffering from a blockage in the stent. When an ambulance crew arrived, Leuders and the other physicians held the iPad record of McMonigle’s previous EKG alongside the strip chart that was being printed in real time. What they saw further confirmed their suspicions about the blockage. The physicians made a choice based on the EKG records that probably saved McMonigle’s life. Rather than wait upwards of three hours to run a blood test to verify the clotting, the doctors rushed McMonigle to the cardiac catheterization lab where a team (alerted by activating an emergency code) was waiting. They removed the clot from his artery, which was about 90 percent blocked. Within three days, McMonigle was released from the hospital and after four more days, he was working out again at the Healthy Living Center. This is an amazing story. It truly accentuates the fact that owning and carrying an IPad on a daily basis will become a way of life for all. It’s only a matter of time and vision. Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Apple, Apple Products, IPad, Technology Leave a comment Tags: Mayo Clinic"
