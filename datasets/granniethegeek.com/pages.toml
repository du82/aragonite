title = "August | 2012 | GrannieTheGeek.Com"
description = "5 posts published by GrannieTheGeek during August 2012"
full_description = "Monthly Archives: August 2012 When One Door Closes Another Opens As Apple Genius Ad Director Moves On Aug 24 Posted by GrannieTheGeek Well, here’s something! According to a news release culled from the tech media site, IPhoneInCanada.Ca, the film director responsible for the now-obsolete Apple Genius ads, Scott Trattner, has resigned. And, it gets even juicer and more intriguing. In the wake of his resignation, he hopped on over to advertising company 72andSunny to work for the Discovery Channel, Hewlett-Packard, Nike, and Samsung. Yes, you read that correctly – Apple frenemy – Samsung. Is that why the ads were pulled off the television and Internet? It’s like a “cart and horse” thing here. Did Scott Trattner leave Apple because of the poorly received Genius Ads or did Apple yank them off the air in the wake of his new job offer from 72andSunny? I know the ads received lukewarm reviews and all that (well, not from me), but it seemed like such a radical move on the part of Apple to succumb to media pressure. One would think that the richest company in history would have more confidence in their abilities and innovative vision. Who has answers or theories out there? I am in a conspiracy theory kind of mood. Humor me! In the meantime, where is that Apple Tech Toy? __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67a74dcf3db15', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Apple, Technology Leave a comment Tags: Advertising, Apple, Genius, iPhoneInCanada.Ca, Samsung, Scott Trattner Here Mini Mini Mini Mini Mini! My Grandchildren Can’t Wait To Meet You Aug 17 Posted by GrannieTheGeek Well, if all the rumors are true and Apple does release their iPad Mini on September 12th, then my Christmas shopping is a done deal. Oh yes, each of my 3.5 grandchildren are under the age of 6, yet, when they come and visit me, they can’t wait to get their hands on their favorite toy – my iPad. Well, I am done fighting with them. Sometimes, you just have to see the writing on the wall and understand where this whole technology craze is taking us and embrace it. And, truth be told, I have been the biggest instigator in terms of turning my grandchildren into full-fledged geeks. Between the iPad and the AirPlay feature on my Apple TV 3 Unit, the day breezes by. We explore the latest educational apps, stream videos to Apple TV via AirPlay and then wind down while watching iTunes-purchased musical theatre films on Apple TV. But, nature-lovers, do not be alarmed. In between geeking time, I do make sure that these kiddies have outside time, where they can release their pent-up energy and act like energetic and fun-loving kids. It’s all about the balance, correct? But balance can mean so many things – like having a one-hour camp-out in the back yard tent with an iPad in hand to pass the time. Plus a walkie-talkie so we can fully communicate with the kids at all times. Talk about mixing the past with the present? It doesn’t get better than this. So, Apple Mini – or whatever your name shall be – you shall be a huge success. Personally, the new iPad is perfect for me, but, for the children, the Mini is the way to go. It’s lighter, more compact and small little fingers and keen little eyes can maneuver those shrunken apps with proficiency and dexterity. So, if all goes as planned, I will be finished shopping for Christmas in September. How about you? __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67a74dcf3efd7', { sectionId: '370373', format: 'inread' }); }); Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Apple, Apple Products, IPad, Shopping, Technology Leave a comment Tags: Christmas, Grandchildren, IPad Mini [Promo Codes] Comic Creator Halftone By Juicy Bits Is Starbucks Pick Of The Week Aug 10 Posted by GrannieTheGeek The great comic creator App, Halftone, is this week’s Starbucks Pick Of The Week. And, if you don’t live near a Starbucks store, I have three promo codes available- on a first-come, first-served basis – at the end of this article with some polite stipulations. 🙂 Read the rest of this entry → Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in App, Apple, IPad Apps, IPhone Apps, Photography 5 Comments Tags: Halftone, Juicy Bits, Starbucks WordPress.Com Issues A Spanking New Update For The IPad Aug 9 Posted by GrannieTheGeek WordPress.Com just issued a 3.1 update for the iPad and it’s a biggie. Considering that it came packed with features, it downloaded at a lightening pace. After I had a quick look around and wrapped my head around the new format, the article yiu are now reading enjoyed the benefits of this new and much-needed update. Here is what you will enjoy when you press the update button in the iOS iPad App store: I cannot tell you how thrilled I am to be able to access my entire site and dashboard from within the App. No more logging in through Safari – what a drag that was! Andthe new and improved Stats Page is excellent news as is the Quick Photo option that was only available in the iPhone App. Great work, WordPress. This new update makes me want to sit and blog all weekend. With this new interface experience, blogging really can move at a brisk pace and certainly be more efficient. Thank you to the fine folks at WordPress.Com for their tireless efforts in making the mobile blogging experience an easy and productive one. Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in App, Apple, iOS, IPad Leave a comment Tags: Wordpress.Com Bye Bye Apple Genius Ads! I Shall Miss You! Aug 9 Posted by GrannieTheGeek What is going on at Apple? And why is there a lack of humor and child-lack wonder in the tech blogosphere? The now infamous Apple Genius commercials which were aired during the opening of the Olympics have mysteriously disappeared. Why? Because they weren’t pretentious enough, I guess. The Apple fanboys and girls thought they were childish, immature, unrelatable, misleading – oh, just pick a negative word and add it here. You know? Whatever!! I thought they captured the fun-like atmosphere of the Apple Store experience. That wonderful, non-intimidating, carefree environment that made everyone of every age and geek level comfortable. Apple should not have succumbed to the media pressure and pulled these ads off the network. They have a history of never yielding to public demand so why now? Just because a few, albeit noteworthy, tech journalists went all negative and embarrassed over these ads do not necessarily make them correct in their thinking. Apple commercials need to be innovative – yes – but also relevant. Apple needs to attract a core audience beyond the “Oh look at me, I have the latest Apple device” mentality. There are millions upon millions of people out there still walking the fine line between Android and Apple. They have no idea which step to take next. Well, with these commercials, they were warmly invited to step and move in the direction of the Apple Stores to, you know, browse and hang-out and explore. Potentially to buy! And, if you have an Apple project that is giving you problems, then the Apple Genius or staff members are more than willing to help. That’s all these commercials were saying! Nothing more. Nothing less. And the tech world had to smash and bash them. Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Apple, Apple Products, Geeks, Shopping, Steve Jobs, Technology 2 Comments Tags: Ads, Apple, Genius ← Older Posts"
