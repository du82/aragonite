full_description = "Monthly Archives: November 2012 Apple Aggressively Getting Rid Of The Baggage As Another One Bites The Dust. Nov 27 Posted by GrannieTheGeek Sounds to me like some head honchos became complacent without Steve Jobs around to keep them in line. Well – surprise! He left the right people in charge who are not afraid to delete anyone who can’t assume responsibility for and professionalism in their work at Apple Inc. There must be a lot of feathers flying behind the walls of the Cupertino based office. First Scott Forstall and now this. According to iPhoneInCanada.Ca and Bloomberg.Com, who quoted an unnamed source, this is what happened: Apple Inc. has fired the manager responsible for its troubled mapping software, seeking to win back the trust of users disappointed after the program debuted in September, according to people familiar with the move. Richard Williamson, who oversaw the mapping team, was fired by Senior Vice President Eddy Cue, said the people, who asked not to be named because the information wasn’t yet public. Cue, who took over last month as part of a management shakeup, is seeking advice from outside mapping-technology experts and prodding digital maps provider TomTom NV (TOM2) to fix landmark and navigation data it shares with Apple. I tried to find a picture of the dude but a bishop keeps popping up over at Google images. Don’t think that’s him. In light of all this firing and rehiring, Apple has now entered a major transitional phase – the post-Steve Jobs era and the beginning of the Tim Cook era. And, like it or not, he is making his mark. I like this man – he is classy, yet shrewd and not afraid to implement monumental changes to the Apple Ecosystem. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f06a94224', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Apple, Steve Jobs, Technology 3 Comments Tags: Eddy Cue, Maps, Richard Williamson"
