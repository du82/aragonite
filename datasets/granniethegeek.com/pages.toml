full_description = "Apple Issues An Update To Fix That Scary FaceTime Issue Feb 7 Posted by GrannieTheGeek Just in time for Valentine’s Day, Apple has finally woven an update this mfox that scary, lurking glitch that invaded Group FaceTime a couple of weeks ago. The software updates — iOS 12.1.4 and macOS Mojave 10.14.3 – are ready to be installed and downloaded in your Settings App on your iOS devices or in the App Store on your Mac. Apple issued this statement: “Today’s software update fixes the security bug in Group FaceTime. We again apologize to our customers and we thank them for their patience,” an Apple spokesperson said in a statement. “In addition to addressing the bug that was reported, our team conducted a thorough security audit of the FaceTime service and made additional updates to both the FaceTime app and server to improve security” Via CNN.Com To install the software updates on iOS devices, go to Settings -> General -> Software Updates and tap “Download and Install.” On a Mac, open the App Store and go to the Updates section. And if you disabled FaceTime, you’ll have to turn it back on in Settings to resume using the feature. So, all is safe now. No more eavesdropping! FaceTime is now open for business. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c2a4dd57588', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Apple, FaceTime, iOS 1 Comment Tags: Apple, FaceTime, iOS 12.1.4, Mac, Software Update Apple Event Is Set To Introduce Some BlockBuster Products On September 12th’ Sep 12 Posted by GrannieTheGeek It’s September! Yes. It is! And for Apple fans, this means another Apple Event is upon us. And this one promises to be a doozy! On Tuesday, September 12th, Apple will reveal some major new products at the spanking brand new and very posh Steve Jobs Theatre. I cannot wait to see this gorgeous theatre. It sounds pretty amazing. So it is only fitting that the product revelations match the aura and opulence of this new theatre, named after Apple co-founder, Steve Jobs. Read the rest of this entry → __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c2a4dd59aed', { sectionId: '370373', format: 'inread' }); }); Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Apple, Apple Products, Apple TV, Apple Watch, IPhone, Technology Leave a comment Tags: Apple, Apple Event, Steve Jobs Theatre Amazon To Purchase Organic Food Chain Whole Foods For $13.7 Billion. Jun 16 Posted by GrannieTheGeek In a developing story just posted by CNN Money, retail giant Amazon has snagged a deal to purchase Whole Foods for $13.7 billion. Wow. That’s a lot of moola. I knew it was expensive to eat healthy these days but this still is a substantial monetary deal for Whole Foods. Now you can browse Amazon and eat healthy food as well. No excuses now for junk food when the real stuff is sitting in front of your nose, ready to be accessed with a click of your finger. And, if you’re an Amazon Prime member, you can have your groceries in a day or two. So, does this mean that the existing brick and mortar stores are closing or is this a deal to boost its online presence? Stay tuned. More information via CNN to come… Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Amazon Leave a comment Tags: Amazon, Food, Whole Foods Gizmodo Discovers Security Breach At Trump Estates May 23 Posted by GrannieTheGeek Recently, a handful of Gizmodo Tech Journalists went for a leisurely boat ride, skirting the perimeter of Donald Trump’s Mar-A-Lago estate. They weren’t looking for the President or his entourage. Please! They had better things to do. Read the rest of this entry → Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Politics, Technology Leave a comment Tags: Donald Trump, Gizmodo, Mar-A-Lago Musical.ly with Kyra Jun 11 Posted by GrannieTheGeek Hi I’m Kyra and I am Grannie The Geek’s granddaughter and I am addicted to Musical.ly!!! If you want to download it, you can do so HERE. I will be starting a little segment called Musical.ly with Kyra. Hope you enjoy! 👍🏻😃🙂. Check back every so often for more MWK (Musical.ly With Kyra) and see ya through the Screen! Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in IPhone Apps, Music, Technology 1 Comment Tags: Musical.ly, Musical.ly With Kyra ← Older Posts"
