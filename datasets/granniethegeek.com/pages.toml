title = "Airport Utility and Time Machine 7.6.1 Nightmare Morphs Into Sweet Dreams | GrannieTheGeek.Com"
description = "It's official. You can't geek and babysit grandchildren at the same time. All was fine with my Time Machine/Time Capsule set-up - until Airport Utility's 7.6.1 update. Then, it malfunctioned, leaving me in a state of digital confusion. What to do? What. To. Do? Update: I also updated Time Capsule's firmware to 7.6.1. Plus, I…"
full_description = '''← I Downloaded Lion To My IMac And Lived To Tell About It The Type A – pple Approach To Detail. Apple’s Obsession With Perfection → Airport Utility and Time Machine 7.6.1 Nightmare Morphs Into Sweet Dreams Feb 5 Posted by GrannieTheGeek It’s official. You can’t geek and babysit grandchildren at the same time. All was fine with my Time Machine/Time Capsule set-up – until Airport Utility’s 7.6.1 update. Then, it malfunctioned, leaving me in a state of digital confusion. What to do? What. To. Do? Update: I also updated Time Capsule’s firmware to 7.6.1. Plus, I was in grandmother mode here and really couldn’t multi-task with a toddler running around the house. So, this was the problem. After I updated Airport Utility and Time Capsule, the annoying amber light on my Time Capsule started to flash and flash. What the…? Plus, my grandson was vying for my attention, So, basically, all hell was breaking lose in my house. So, I forged on. I had some supper (at least I think I did) and, later that evening, I strolled to the Apple support forums, already rampant with geeks who were experiencing the same problem. The popular suggestion was obvious – simply reset the Time Capsule. So, after a couple of reset attempts, I did get the Time Capsule up and running, smoothly backing up my data via Time Machine. However, this time around, I configured the Time Capsule to act as an extension of my regular wireless network. Previous to this, I was using it solely for Time Machine back-ups. So, something was wrong – the amber light was still flashing! Honestly. When would this end? I toyed with the idea of calling in a tech person but the idea of someone else in my house after a marathon few days of babysitting one of my grandsons was too much to bear. Plus I didn’t need a patronizing look from a tech coming to rescue a senior citizen in distress. Plus plus – I needed something to blog about! So, for extra precaution, I hooked up the Time Capsule to my server’s router – just to cover all the bases, so to speak. Previous to this, it was performing exceptionally well via my wi-fi, but I wanted the security of a wired set-up until I figured out the reason for the flashing amber light. However, upon doing this, I was receiving messages via Airport Utility that I was not connected to the Internet, didn’t have a valid IP etc., yet, at the same time, all was running smoothly in terms of my Internet and Time Machine back-ups. So, I detached the Ethernet from my Time Machine(I don’t know why. I just did.), i think, at the time, I thought it was plugged into the wrong slot on the back of Time Machine. Who knows? I was grasping at straws here. I then plugged it back in and, when I checked Airport Utility this time, I received an error message that frantically had me searching the help menu in Airport Utility. Apparently, my Time Capsule needed to be configured for bridge mode. What’s bridge mode? Time to find out! I strolled over to the Apple Support Forums to see if this bridge thing was indeed a good thing or not – but not before I checked on the status of my Time Machine back-ups. All was still fine. Good! Apparently, Time Capsule, when attached to another router, can act as a bridge, if you are not using the Time Capsule as your main base station or router. So, I care.fu.lly. followed the instructions and activated bridge mode for my Time Capsule and voila! A steady, strong and glowing green light appeared on my Time Capsule! Problem solved! Now I know why green is my favorite color. It’s the color of nature and money and all good things, the most important being digital harmony. For the younger geeks this may not have been a biggie, but for little ‘ole senior me, it was. So stop laughing. In the near future, I will be vacationing in the vicinity of an Apple Store where I know I will be spending a great deal of my time. One is never to old to learn and I want to learn from the best. I should just camp-out in front of the store. What could go wrong? The Food Court is just upstairs and boasts a Starbucks, so what could be finer? You know, Apple should just bite the bullet and build iHotels for the truly geeky people in the universe. Or better yet – a retirement home for senior geeks such as myself. Can you imagine? An iHome for golden geeks! One can only dream. So, anyone else have problems with their Time Machine after the Airport Utility update? Did I miss something? Share your thoughts in the comments section. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67b76d6deb927', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67b76d6deb976', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Related Posted on February 5, 2012, in Apple, Apple Products, External Storage, Technology and tagged Time Capsule, Time Machine. Bookmark the permalink. 16 Comments. ← I Downloaded Lion To My IMac And Lived To Tell About It The Type A – pple Approach To Detail. Apple’s Obsession With Perfection → Leave a comment Comments 16 lars | May 4, 2012 at 3:57 pm just wanted to let you know that i had the same problem and spent quite some time googling solutions – it was your bridge mode that sorted it out for me in the end. a big thank you from brussels, belgium! lars Reply GrannieTheGeek | May 4, 2012 at 4:28 pm Glad to be of assistance. Took me all day but finally figured it out. Thanks for stopping by. 🙂 Reply Phil | July 8, 2012 at 4:40 am Well… I was ready to follow the same instructions and put it on Bridge Mode, when I clicked on the base station icon in the Airport utility and read it’s “summary”. That side dialogue box showed that my Apple ID wasn’t correct. So before I changed any setting, I just decided to enter my correct Apple ID and password. VOILA!! The same solid green evoking nature, money and all good things, fired up on my base station and subsequently on my Airport Utility window. Oh! The joy of green! So, just wanted to share this also possible solution for the annoying amber light. Reply GrannieTheGeek | July 8, 2012 at 1:01 pm Phil – thank you so much. Another solution! Yay! I never thought of that. Is your Time Capsule connected to your regular router as well? Reply Same as above | December 13, 2012 at 2:17 am I couldn’t use bridge mode…. but loved your story! Our Telus Optik TV commands total control over our router… Telus router… and I was told by our Telus techie that our TC needed to be ethernetly sp? connected to our Telus router, and bridge mode was not an option. Reply GrannieTheGeek | December 13, 2012 at 6:36 pm Same as Above – yes bridge mode is tricky. And truth be told, since I wrote this article, I have had two issues with TC working properly. I did get it going again but will probably have someone look it over after the holidays. Thanks for stopping by. Glad you enjoyed my story. 🙂 Reply compare bank accounts | January 13, 2013 at 2:21 pm My partner and I absolutely love your blog and find almost all of your post’s to be just what I’m looking for. Does one offer guest writers to write content to suit your needs? I wouldn’t mind composing a post or elaborating on some of the subjects you write related to here. Again, awesome site! Reply sofware | January 2, 2015 at 10:52 am It’s awesome to visit this website and reading the views of all friends concerning this article, while I am also eager of getting knowledge. Reply The Pirate Bay | January 4, 2015 at 4:22 pm “It could suffered those UUSee adjustable certain revenue have been type, to ascertain a varied structure, in adition to craigslist ad income, augment treasure-introduced active options, Huge Web coffeehouse provider alongside the lines. On the main section from the search engine, you can look for movie files, music files, and also other types of files quickly from file sharing sites across the World Wide Web. Therefore the app sits somewhere between a really useful app plus much more of a novelty. Reply seo firm sacramento | April 26, 2015 at 11:16 pm Hey! I know this is kiknd of off topic bbut I was wonderin iff you knew where I could locate a capthha ppugin for my comment form? I’m using the same blog platform as yours and I’m having difficulty fiknding one? Thannks a lot! Reply working from home jobs chicago | November 25, 2015 at 4:45 pm All you want is a working pc, an web connection, and a consumer identify and password to register. Reply movie times san diego | November 27, 2015 at 8:03 am Thanks Rebecca – Generally it is simply enjoyable to curl up and have some alone time with a few great movies. Reply Jordan c. | November 29, 2015 at 2:44 pm Search engine optimization is usually often referred to as Search engine optimization, google search positioning and show off engine promotion. Targeting a keyphrase only because it sounds just right is a big no. ) many computer users prefer a search engine that doesn’t collect that personal data about them. Reply Laurie | January 2, 2016 at 9:52 pm I am regular reader, how are you everybody? This post posted at this website is in fact nice. Reply business model canvas wikipedia | April 1, 2016 at 2:16 pm You bought the e-book to discover ways to open a Recycling Business and that is what we promised you our e-book would supply. Reply mintywebs | June 4, 2016 at 4:43 pm It will be helpful for individuals who are already employed for his or her career improvement. Reply Please add your comments. They are important for the development of this blogging community Cancel reply Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'''
