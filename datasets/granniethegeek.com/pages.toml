full_description = "Monthly Archives: September 2012 Genius iPhone Tip Of The Day Courtesy Of TheNextWeb.Com Sep 29 Posted by GrannieTheGeek Featured Image Credit: Justin Sullivan / Getty Images Darn! I wish I had thought of this! But, thank heavens someone did! Of course, everyone knows about the FindMyiPhone App. And if you don’t, here is a link. However, TheNextWeb.Com came up with a brilliant way to speed up the process if, in fact, you do lose your iPhone. Now, we have to assume here that anyone that finds your iPhone is a Good Samaritan and will heed the instructions set forth by TheNextWeb.Com. In a nutshell, you access your Notes App, start a new note, add pertinent information that would allow someone to contact you if they find your iPhone, then save the note to the lock screen on your iPhone. An email address should be enough or a business phone number. I would NOT feel comfortable adding my home phone number. You could, though, add a family member’s mobile phone number – that would be another alternative. However, in iOS 6, you can enable Lost Mode – which is an advanced alternative to the above suggestion. Here is the video below: __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f064c17ae', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Apple, Apple Products, IPhone, Quick Tips 12 Comments Tags: FindMyiPhone, Lost Mode, TheNextWeb.Com The Apple Store Dancing Machine – Trevor Moran – Appears On The X Factor Sep 27 Posted by GrannieTheGeek Apple Store dancing machine, Trevor Moran, made a surprise albeit dramatic appearance on The X Factor Wednesday evening. However, just before he was to audition in front of Simon Cowell, Britney Spears, Demi Lovato and LA Reid, young Trevor collapsed, totally unconscious. The kid did not look good at all and it worried me. And we were left hanging until Thursday’s show To Apple Geeks everywhere, this talented and vivacious boy is an icon – a symbol of the fun-loving atmosphere that one enjoys during visits to the Apple Store. I sang Trevor’s praises back in May. He captured my attention not only because of his connection to the Apple Stores but also for his innate musicality. But not to worry everyone, Trevor is alive and well and tweeting on Twitter. Trevor Moran (@TrevorMoran) 2012-09-26 10:08 PM Okay, I guess I’ll be on tomorrow! Stay tuned 🙂 Tune in to The X Factor tomorrow night to see what happens. That kid is so darn cute. I hope he advances further into the competition. Apple could sponsor him (wink, wink!) . __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3f064c4acb', { sectionId: '370373', format: 'inread' }); }); Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Apple, Apple Store, Geeks, The X Factor, Video 2 Comments Tags: Trevor Moran IPhone 5 And Earpods Commercials – A Breath Of Simplicity Sep 22 Posted by GrannieTheGeek After losing its footing with the notorious debut of the Genius commercials during the 2012 Summer Olympics, Apple has finally stepped back – or forward, depending on your point of view – to familiar territory. On the heels of the launch of the hugely anticipated iPhone 5, Apple has released four clean and precise commercials hailing the beauty of both the iPhone 5 and their newly designed listening device, the EarPods. Suffice it to say that these commercials are perfectly Apple, first-class all the way and “to the point”. However, I loved the Genius commercials. I think the detractors were reading far too much into the nutty humorous aspect behind them and raising controversies and theories that just weren’t there. They were fully aimed at another market – the baby boomers and older who have fully embraced Apple and its products. Walk into any Apple Store and you will be astounded with the higher end age range of the consumers looking for advice. Apple’s customer service is exceptional and ground-breaking. It goes above and beyond the call of duty. When I visited an Apple Store this past March, one employee told me that he helped a customer write an e-book from start to finish. I was astounded. Where else are you going to receive help like this for a mere $99.00 ( the yearly cost of a One-To-One Membership)? At any rate, these commercials, below, are very well constructed and on point. Let me know what you think. Cheese Physics Thumbs Ears Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Apple, Apple Products, IPhone, Technology 4 Comments Tags: Advertising, EarPods, Genius Commericals IPhone 5 Launch Starts Today. Sep 21 Posted by GrannieTheGeek Picture And News Source: CultOfMac.Com Okay, for those of you who live in a cave or whatever, I thought I should inform you that the iPhone 5 has enjoyed a mega release today – September 21, 2012. The photo above this article, courtesy of iPhoneInCanada.Ca via CultOfMac.Com is a keeper. Although this is a picture from the FEDEX facility, it gives you an idea of what both FEDEX and UPS have had to contend with in order to meet the delivery requirements sent forth from Apple Inc. If you look closely enough, the vast majority of these packages are iPhone 5s. Wait, I think I see a couple of iPad Minis there. Ha – just messing with you! The parcel carriers were explicitly informed not to deliver any iPhones until September 21st, causing a bit of a backlog – albeit a well-organized one – for the delivery personnel. What looks like chaos in this picture is a well – coordinated system in progress. Many of the people on my Twitter feed have received their iPhone 5 in timely fashion, posting pictures of their personal unboxing experience and overall impressions. Due to a technical glitch over at Telus, I will not receive mine for another week – even though I placed my order well before the 4:00 P.M. deadline on September 14th. If someone over at Telus Mobility reads this, perhaps they can intervene on my behalf? I blogged about the glories of Telus – throw me a crumb! So, did you receive your iPhone 5? If so, post pictures, videos and/or first impressions in the comments section below. And, yes, I know the mapping is a mess, but it will get better. But, that’s another article. Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Apple, Apple Products, IPhone, Technology Leave a comment Tags: FEDEX, IPhone 5, Telus, Twitter, UPS It’s A HAppy Kind Of Day for iOS 6 Customers Sep 19 Posted by GrannieTheGeek Oh my goodness. Stop the updates. Seriously. Who can keep up? I barely had time to blow dry my hair. And yet, all of these new iOS 6 features are making me do the HAppy Dance here. Groan – I know, pretty lame joke but aren’t you sad you didn’t think of it first? What a day! After successfully downloading iOS 6 to my iPad and iPhone, I was also greeted with the task of updating a ton of my favourite Apps – like iMovie, iPhoto, iPages, iPages, iBank, Keynote and many, many more. Now, to be honest, I haven’t had time to try all of them but suffice it to say that, at first glance, all appear to be super efficient and silky smooth. Many of the Apps come with tons of new features to complement the sophistication of iOS 6. And, for Facebook lovers – all bzillion of you – there is Facebook integration everywhere you look. Just hold your finger on a photo or tap a share button in an App and watch the magic begin. And let’s not forget Siri status updates for Facebook. Very, very nice. And, when you visit the iOS App Store, check out the beauty of the new layout. It makes you want to shell out more money – everything old looks new again. And the icing on the cake? Mountain Lion issued a huge update as well. Check it out! Is it long enough for you? The only downside is that Maps is a bit of a mess. The navigation system works well enough, I suppose, but no 3D is happening at my end. I suspect that the rendering of 3D images is dependant on your location but still, all in all, I was disappointed. Everything in time and circumstance. Geeks must be patient but sometimes it’s hard. So, have you downloaded iOS 6 and updated your Apps? Is it all you were expecting? More? Less? Please share. Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Apple, Geeks, iOS, IPad Apps, IPhone Apps, Mountain Lion, Technology Leave a comment Tags: Facebook ← Older Posts"
