full_description = "Monthly Archives: August 2011 Steve Jobs Resigns As CEO Of Apple While Former CEO, Tim Cook, Steps Up To The Plate Aug 25 Posted by GrannieTheGeek This just in from CNN. Steve Jobs has resigned as Chief Executive Officer Of Apple, with former CEO Tim Cook stepping in to secure his position. Steve Jobs will, however, stay on as Chairman. All day, I had this eerie feeling that something was up with Steve Jobs. I couldn’t shake off the feeling, so I went out and purchased some Apple products. It still didn’t do the trick. But to come home and see this CNN news bulletin was very unsettling. We all knew this day would come but I am sure we were also hoping beyond hope that this genius of a man would defeat the odds and remain with Apple for many years. In his resignation letter to Apple, Mr. Jobs stated: “I have always said if there ever came a day when I could no longer meet my duties and expectations as Apple’s CEO, I would be the first to let you know. Unfortunately, that day has come,” wrote Jobs, who has been on medical leave since January. Cook has been filling in as the company’s leader. “I believe Apple’s brightest and most innovative days are ahead of it. And I look forward to watching and contributing to its success in a new role,” Jobs wrote in his resignation letter. “I have made some of the best friends of my life at Apple, and I thank you all for the many years of being able to work alongside you.” Naturally, with his announcement, Apple shares dropped 5%. CNN went on to report Apple’s reaction to the news: “Steve’s extraordinary vision and leadership saved Apple and guided it to its position as the world’s most innovative and valuable technology company,” board member Art Levinson said. “In his new role as chairman of the board, Steve will continue to serve Apple with his unique insights, creativity and inspiration.” Steve Jobs was diagnosed with treatable pancreatic cancer in 2004 and has been battling the disease with the same level of determination and professionalism that made him a visionary in the field of technology. Do you think Apple will be able to carry on without him? Do you worry that the creative innovations synonymous with Apple will decrease without his powerful presence? Source: CNN.Com __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3efe93ce36', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Apple, Technology 3 Comments Tags: Steve Jobs, Tim Cook A Review Of Arcana Studio’s Interactive Mobile 3D App, The Gwaii Aug 16 Posted by GrannieTheGeek IPad specific interactive books and learning material for children of all ages are evolving at a rapid pace. With each new release, the interactive ingredients of the content push the envelope further and further, challenging the imaginations of both the publishers and the consumers. An example of this is the recent release of Arcana Studios’ 3D comic, The Gwaii. Read the rest of this entry → __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3efe9407ac', { sectionId: '370373', format: 'inread' }); }); Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Books, IPad Apps 2 Comments Tags: 3D, Arcana Studios, Books, Comics, Interactive, MoBaD Media, The Gwaii A Review Of Jack And The Beanstalk Interactive Storybook App Aug 5 Posted by GrannieTheGeek Developers are barely skimming the surface when it comes to producing stellar IPad Apps for children. There aren’t too many that have that “wow” factor. But, every day new apps surface and I discover some old gems as well. Read the rest of this entry → Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in App, Books, IPad Apps, IPhone Apps 4 Comments Tags: Ayars Animation The Search For The Perfect External Drive For My IMac Aug 5 Posted by GrannieTheGeek The other day, my external drive died. Kaput! Finished! Whatever! It was a two-year-old Lacie product and I was using it for my Time Machine backup. Here is the full story. Read the rest of this entry → Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Apple Products, External Storage, Lion, Shopping, Technology Leave a comment Tags: G-Technology, Lacie"
