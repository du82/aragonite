title = "Troubleshooting The Placement Of The Audio Clip In The IMovie IPad App | GrannieTheGeek.Com"
description = "You don't need to take computer classes to find your way around Apple devices - although it does make the process a quicker one. However, if you are semi-retired, as I am, with a ton of time on your hands to fiddle with your devices, you can easily problem-solve a technical issue or two. Recently,…"
full_description = '''← To IPad Or Not To IPad: That Is The Question Saturday Video Tutorial: A Look-See At The IMovie App For The IPad → Troubleshooting The Placement Of The Audio Clip In The IMovie IPad App Apr 19 Posted by GrannieTheGeek You don’t need to take computer classes to find your way around Apple devices – although it does make the process a quicker one. However, if you are semi-retired, as I am, with a ton of time on your hands to fiddle with your devices, you can easily problem-solve a technical issue or two. Recently, when I was working on a family-themed video, I ran across a nagging and frustrating glitch in the IMovie App. When I tried to insert audio of any kind, particular from my ITunes library, the music immediately snapped to the front of the video. And, unlike IMovie on the Mac, this audio clip could not be moved to a preferred placement in your video. It was frustrating – I found it impossible to edit the length of the music backwards and forwards. Then, I turned off the loop music function, selected the video clip and two yellow handles appeared. However, only the back handle ( the one on the right) was editable; the handle on the left would not budge. So the music could be re-positioned from the back and not the front? Strange. I then split the clip where I wanted the music to begin, thinking that if I selected that clip before adding the audio clip, the music would place itself below the beginning of that clip. No again! The music gabbed the entire video. Well, this was a nightmare! So off I went to the Apple Store and posed my problem. However, six days later the creative team gave up and sent the problem to Cupertino. Did I find a glitch? Well, sort of. Not one to give up easily, I continued to play around with the video, exploring every option and this is what I think is a pretty good work around until Apple addresses this issue. The Fix: Once again, I split my video in two, but this time, I decided to add the music twice – one to the first clip and the other to the second. But, at first this did not work. The audio insisted on attaching itself to both video clips, I had to grab the back handle of the audio clip and move it all the way forward to the end of the first clip. Then, because I didn’t want to hear the audio in this first clip, I double clicked the audio clip to bring up the audio features and turned down the volume all the way to the left. Alternatively, one could also just set the audio to the “off”position. So, although the music was there, one could not hear it. Now I was left with the second clip minus the audio. Because this is where I wanted the music to originally start, would adding the audio a second time ignore the first clip with the silent audio track and jump to the second? One way to find out! Just do it! I selected my song from the ITunes library and, wonder of wonders, it grabbed the beginning of the second clip. Praise the Lord, Hallelujah! Then I adjusted the audio level for the music on the second clip, making sure that the music was at an appropriate audio level to compliment the people speaking in the video. And, that was that! Looking at the written word, it all seems so simple and usually these problems are. However, it took a while to get past what I could easily do on my Mac where one can just move the audio to the correct placement. Hopefully, Apple will issue an update to address this technical issue in the IMovie App. If one can shorten the video from the back end, one should be able to move the front end to any point in the movie. It should just work, right? __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3f04692a77', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f04692ac5', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Related Posted on April 19, 2012, in Apple, Apple Products, How-To Articles, IPad, IPad Apps, ITunes, Technology and tagged IMovie. Bookmark the permalink. 27 Comments. ← To IPad Or Not To IPad: That Is The Question Saturday Video Tutorial: A Look-See At The IMovie App For The IPad → Leave a comment Trackbacks 2 Comments 25 Mary | May 3, 2012 at 10:26 am Thank you so much, it solved the exact same problem I was having. Reply GrannieTheGeek | May 3, 2012 at 12:52 pm You are most welcome, Mary! Reply Rene | September 13, 2012 at 7:15 pm Thank you! Thank you! I am using iPads with students in the classroom and we wouldn’t have figured this out without you! Reply GrannieTheGeek | September 14, 2012 at 2:55 am You’re welcome! You’re welcome! I love to problem solve and usually don’t take “no” for an answer. This time, it worked! Thank you for stopping by and good luck to you and your students with your iPad – iMovie projects. Reply AG | December 5, 2012 at 12:46 pm Very many thanks for this. I too was struggling to move the audio. The help button tells you you can do it simply!!! Well as we know you can’t. Let’s hope it gets fixed by Apple soon. AG Reply GrannieTheGeek | December 5, 2012 at 2:51 pm AG – my pleasure. It is an annoying oversight on Apple’s part. Hopefully, it will be rectified soon. Thank you for stopping by. 🙂 Reply Mary V | January 17, 2013 at 6:33 pm Had exact problem today. Thought it was me!! Very grateful!! Reply GrannieTheGeek | January 21, 2013 at 4:36 am Thank you Mary!! Glad the article helped. It is frustrating so was happy to discover this “fix”. Reply SSS | February 10, 2013 at 9:42 am Thanks so much! We were struggling with the same thing… Great workaround. Now if Apple will just come up with a proper fix rather than the ‘workaround’ for the imovie app… Reply GrannieTheGeek | February 18, 2013 at 11:34 pm Yes SSS I so agree. They recently updated iMovie for iOS but still didn’t fix this particular problem. Maybe they are content with the GTG fix. :). Seriously though, this should not be a hard element to fix and refine. Strange. Glad it helped you out! Reply Iric Mawhirter | March 8, 2013 at 3:08 am This is a lifesaver! Much thanks! Reply GrannieTheGeek | March 8, 2013 at 7:32 pm Iric- you are most welcome. 🙂 Reply MrSpock | August 13, 2013 at 6:41 pm Thank you! Was looking for this. Have you find any other easier to handle video editing app for music? Reply GrannieTheGeek | August 13, 2013 at 6:54 pm MrSpock – do you mean on the iPad iMovie App? No, this is the only workaround but it is quite easy once you get the hang of it. I a, surprised Apple doesn’t address this issue and fix it once and for all. Reply Jens | October 11, 2013 at 7:42 pm 1 1/2 Year later… Ios 7,’still Not fixed… Really a Problem… 🙂 Reply GrannieTheGeek | October 15, 2013 at 6:22 pm Jens – it is unforgivable really. Maybe they think my “fix” is good enough. 🙂 Reply Jim Randolph | October 22, 2013 at 3:45 pm You are my hero. I am an elementary school librarian and use an ipad mini for our morning news show. It’s been bugging me all year that I couldn’t add a music clip at the end and now I can. Thank you so much. Reply GrannieTheGeek | October 25, 2013 at 5:03 pm Thank you so much Jim!! I think Apple was supposed to fix it with the recent iOS 7 update , but when I tried to position the music clip, it still grabbed the front end of the video. I was in a hurry so maybe I was doing something wrong. 🙂 Reply Shannon | November 15, 2013 at 3:43 pm Thank you so much! My students are making silent movies in iMovie and I was having serious problems helping them edit their music clips. This helped so much! Reply GrannieTheGeek | November 16, 2013 at 8:10 pm Shannon – you are most welcome. Apple supposedly fixed this problem with their recent update but I still couldn’t position the audio clip. Strange. This “fix” works so I am glad that it assisted you and your students. 🙂 Reply Jeremy | November 19, 2013 at 4:22 am In version 2.0 that was just released, if you move the audio to the foreground you can position it where you want. GrannieTheGeek | November 19, 2013 at 2:25 pm Thanks for the info Jeremy. I was fiddling around quickly and wondering why it didn’t work as advertised. Too bad you have to add that extra step of moving it to the foreground. Strange. Joseph | June 21, 2014 at 4:35 pm It is working the way it is meant to work. Antsy audio file 60 seconds or longer is considered background music and background music is meant to start at the beginning of the project. Solution – edit the music file first and cut it down to under 60 seconds – it will then be seen by imovie as a sound effect and can be placed anywhere. Reply GrannieTheGeek | October 7, 2014 at 3:36 am But that is not what people want. They want to be able to place their music clip wherever they desire, regardless of length. I believe that Apple has finally fixed the problem. Reply Anon | November 29, 2017 at 4:36 am You said “I believe that Apple has finally fixed the problem.” I am still having this problem in 2017. Why can’t I move an audio clip to a later point in the video? Tell me how Apple has fixed this? Reply Pingback: Saturday Video Tutorial: A Look-See At The IMovie App For The IPad « GrannieTheGeek.Com Pingback: iMovie « SpesPad Please add your comments. They are important for the development of this blogging community Cancel reply Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'''
