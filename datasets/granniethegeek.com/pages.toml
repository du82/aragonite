description = "5 posts published by GrannieTheGeek during June 2012"
full_description = "Monthly Archives: June 2012 iOS 6 Cry Babies: Get. A. Grip! Jun 15 Posted by GrannieTheGeek I was wondering how long it would take before people would start trashing Apple’s exciting technological announcements at the WWDC 2012. Although it appears that everyone is drooling over the new MacBook Pro with Retina Display, the iOS 6 upgrade, scheduled for release in October 2012, didn’t fare quite so well. Developers were given the opportunity to download the BETA release of iOS 6 and, since then, the complaints have been pouring in. The mapping isn’t perfect, Siri isn’t working as advertised, blah, blah, blah! Just cry me a river, already! It’s in BETA people. Meaning – not ready for prime time. If it were, everyone would be able to download iOS 6. Apple just can’t win, can it? Do you really think they are sloppy enough to push an inferior product or upgrade? Yes, it’s not going to be perfect, but, last time I checked neither are you. Technological advances improve over time, trial and error. It’s the nature of the beast. It learns as we learn, especially when it comes to something as mind-blowing as Siri. It matures as we do, the technological brain becoming more refined and succinct with each passing day, month and year. I honestly cannot take the whining anymore. If you can do better, then start your own company. Prove to all that you are better and wiser than the people at Apple Inc. Then maybe, just maybe, I will take you seriously. Until then – talk is cheap, cheap, cheap! __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f05737a10', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Apple, iOS, Technology 2 Comments Tags: Beta, IOS 6, WWDC 2012 It’s Going To Be A Long, Tedious Road To October’s New iPhone Launch Jun 13 Posted by GrannieTheGeek What is it – June 13th today? That means we have just four months or so until Apple releases it’s new IPhone. It may as well be four years! The media is swirling with reports about what this IPhone will look like, sound like, smell like, talk like. I’m no better – I jumped on this nutty bandwagon with the rest of the geeks! However, I stand by my recent article: this phone is going to be revolutionary, much like it’s predecessor, the IPhone 4. But will it look like this? Or this? Or, well, this? We need to chill people! Don’t go all Gizmodo on me and break the law trying to get your fingers on a prototype. If you do, there are worse things than jail. Apple will ban you for life, forcing you to use Android products and Google search no matter how irrelevant they become in the future. That’s solitary isolation in tech terms and you don’t want to go there. Are you salivating at the prospect of this new IPhone? What secrets will it unlock? Will the “point-and-shoot” cameras finally be obsolete? Or close to? Comment away geekers! __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3f05738f0c', { sectionId: '370373', format: 'inread' }); }); Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Apple, IPhone, Technology Leave a comment With iOS 6 And More – The New IPhone Is Going To Be Phenomenal! Jun 12 Posted by GrannieTheGeek The announcement of the iOS 6 upgrade at 2012 WWDC had all the markings of Steve Jobs’ enormous influence. The sad news: he wasn’t here to live and breathe the ongoing phenomenal product releases that he so impeccably envisioned. Thankfully, he nurtured a remarkably gifted Apple team with the noticeably improved charismatic presence of Tim Cook at the helm. On Monday, June 11th, 2012, Tim Cook and his team of engineering magicians walked us through the jaw-dropping breakthroughs at Apple. A newly-improved and powerful MacBook Air A monster computer via the new MacBook Pro with Retina Display, the best ever built according to product designer, Jon Ives An OS X upgrade – Mountain Lion with over 200 new features – scheduled for purchase in July 2012 from the MacApp Store at a measly $19.99 And the crème de la crème – iOS 6 upgrade – scheduled for release in the Fall of 2012 and available for the IPhone 3G, IPhone 4, IPhone 4S, IPad 2nd and 3rd generation, IPod 4th generation. Update: Some features, such as Mapping, Siri, Flyover, will be limited to the IPhone 4S and new IPad. Read the fine print or just buy the new IPhone in October. 🙂 All this and Apple has yet to mention the upcoming new IPhone release this Fall. But, with yesterday’s breakthrough announcements, one can only imagine how powerful this new IPhone is destined to be. This Phone will obviously come shipped and ready to impress via iOS 6 installation. But, what else can we expect? What else? What else indeed! Expect a revolutionary new camera that will put an end to the point-and-shoot cameras once and for all. We know that the late Steve Jobs wanted to revolutionize the Photo Industry and, according to all reports, this new IPhone was the last project he worked on before his untimely death. And if you think the IPhone 4S had record sales, just you wait Henry Higgins, just you wait! This Phone is going to shatter all previous sales records and become the best-selling product of all-time. So, connect the dots – this camera is going to be awesome. And, with the evolution and continued refinement of the Photo Apps, why in heavens name would one want to buy a $2000 camera? I designed stellar Apple photo books and calendars for my grandchildren comprised of IPhone pictures only and the photos were remarkable. Granted, some were clearer than others, but that was my fault rather than the fault of the camera itself. If you want to see a cool voodoo concept for the new iPhone, check out this video below. It will make you drool like a teething baby. It may not happen in Fall 2012, but it is not far into the future. Not by a long-shot. Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Apple, iOS, IPhone, Photography, Steve Jobs, Technology 1 Comment Tags: Tim Cook WWDC Coverage Via Mashable.Com. What Just Happened? Jun 11 Posted by GrannieTheGeek First of all, I would like to thank the incredible team at Mashable.Com for today’s outstanding live coverage of the WWDC 2012. All the information and pictures you see in this article are attributed to Mashable.Com. However, I would urge you to head on over to Mashable’s site for a more comprehensive look at the amazing technological advances awaiting us via Apple in the coming months. This is truly the stuff of magic and dreams and, Steve Jobs, thank you for making this superior level of innovation possible in our lives. Tim Cook and his team assembled a great presentation today, June 11th 2012. Here is how it went down: Read the rest of this entry → Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Apple, ICloud, iOS, IPhone, Mountain Lion, Technology Leave a comment Tags: Mashable WWDC Begins In Thirty Minutes. iOS 6, Mountain Lion And Lots Of Surprises Ahead Jun 11 Posted by GrannieTheGeek Well, it is finally here. The much-anticipated 2012 Apple World Wide Developers’ Conference is set to begin in a 30 minutes at 1:00 Eastern (10:00 AM Pacific and 6:00 PM UK) at the Moscone Center in San Francisco, California. In addition to the unveiling of the enticing little technological treats awaiting us via the iOS 6 update, there has been much speculation regarding the other announcements to be made by Apple on this fine Monday, June 11, 2012. Will Apple announce its strengthening partnership with Facebook by deeply integrating Facebook accessibility into the iOS interface? What’s happening with Mountain Lion? Will Siri be introduced into the IPad and Mac systems? What about Apple HDTV? What about this? What about that? Well, soon all speculation and hear-say will be laid to rest – thank heavens! But, mark my words, after all is said and done, it will never be enough for some tech geeks who refuse to be satisfied with the new product announcements. Why is it never enough? I still can’t get over the fact that I can AirPlay my IPad or IPhone content on my TV with the touch of a finger. It’s magical! Just be happy that we live in an Apple-dominated world and enjoy the ride. It’s going to be a long one and it doesn’t end today. It is merely beginning. Live Stream Links: Mashable.Com Macworld.Com MacLife.Com Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Apple, iOS, Mountain Lion, Steve Jobs, Technology Leave a comment Tags: IOS 6, Tim Cook, WWDC"
