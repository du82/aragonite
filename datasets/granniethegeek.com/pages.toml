title = "May | 2012 | GrannieTheGeek.Com"
description = "2 posts published by GrannieTheGeek during May 2012"
full_description = "Monthly Archives: May 2012 New Feature Of Photo Stream: Catching Technologically-Challenged Criminals. May 24 Posted by GrannieTheGeek I wonder if the late Steve Jobs and/or the team at Apple had any idea that some people’s technologically-challenged bent would come back to haunt them via ICloud and one of its most frequented services, Photo Stream? According to Tuaw.Com, a guy who works on a Disney cruise ship stole someone’s IPhone and then proceeded to take his own pictures. But the fun is just beginning. The original owner, Katy McCaffrey, started to see these same pictures appear on her Photo Stream album located on her computer and, surprisingly enough, on her Facebook page. Yes, the culprit didn’t disable the Photo Stream option on the phone nor did he realize that uploading these pictures to Facebook would automatically access the original owner’s Facebook page. He even named the page “Stolen IPhone Adventures”. The captions, written by owner, Katy McCaffrey, are just hilarious. I think there should be a rule out there: no stealing iDevices unless you sign up for OneToOne training at the Apple Store. This is the best story ever! It’s my feel good story going into the weekend. Needless to say, this person is no longer working for Disney. But, you already knew that, didn’t you? __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67c3f0523db41', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Apple, IPhone, Technology Leave a comment Tags: Photo Stream Trevor Moran: He May Be A Geek But He’s A Dancing Geek. May 20 Posted by GrannieTheGeek This kid is so adorable. His name is Trevor Moran and he has risen to fame via his fantastic dancing YouTube videos. This kid has spunk, I tell ya! And talent as well. He lines his body up so well with the camera – it is a lesson in creative spontaneity. The kid has some neat moves and great facial expression. I loved his slow-mo choreography at around the 2:20 mark. Very neat! While he was dancing, I was watching the people in the background. Too much fun! One guy, to Trevor’s left, looked up and then resumed his discussion with an Apple employee. Like this was no big deal. Like this happens every day – which it probably does. And then there was the statuesque glamor girl who provided back-up choreography. She’s gorgeous. Sign her up as a model – she could make big money. For the record, this is the quietest Apple Store I have ever seen. Usually, I need an oxygen mask when I visit the Apple Store – there are so many people one can barely breathe. In fact, it’s usually wall-to-wall people. it was cool to see some Apple Employees join in the fun – that’s what this store is all about, after all, innovation and excitement and, most of all, pure, unadulterated fun. As I was watching Trevor it got me thinking: “Who are his parents”? “How do you spawn a creative, cool , uninhibited kid like Trevor”? “In six years, will my granddaughter be doing this”? If so, I will be right there front and center, cheering her on! I love kids like Trevor – they embrace life and have little care for what people think or say about them or anybody else. Steve Jobs must be smiling now. He wanted his Apple Stores to be similar to a Disney-like adventure and, sure enough, it looks like he dream is unfolding as it should. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67c3f0523fa4d', { sectionId: '370373', format: 'inread' }); }); Geek this:EmailFacebookTwitterLinkedInPrintPinterestLike Loading... Posted in Apple Store, Shopping, Technology, Video 1 Comment Tags: Dancing, Trevor Moran"
