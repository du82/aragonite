full_description = 'Ginny Tapley Takemori Ginny Tapley Takemori has translated fiction by more than a dozen early modern and contemporary Japanese writers. Her translation of Sayaka Murata’s Akutagawa prizewinning novel Convenience Store Woman was one of the New Yorker’s best books of 2018, Foyle’s Book of the Year 2018, and was shortlisted for the Indies Choice Award and Best Translated Book Award. Sayaka Murata’s Earthlings (October 2020) has already been named one of Time’s ‘must-read’ books of 2020. Her translation of Kyoko Nakajima’s Naoki prizewinning The Little House was published in February 2019, and Things Remembered and Things Forgotten a short-story collection by the same author, co-translated with Ian MacDonald, is due out in spring 2021). Coming soon - April 2025 Vanishing World Ginny Tapley Takemori Amane is ten years old when she discovers she’s not like everyone else. Her school friends were all conceived the normal way, by artificial insemination, and raised in the normal way, by parents in ‘clean’, sexless marriages. But Amane’s parents committed the ultimate taboo: they fell in love, had sex and procreated. As Amane grows up and enters adulthood, she does her best to fit in and live her life like the rest of society: cultivating intense relationships with anime characters, and limiting herself to extra-marital sex, as is the norm. Still, she can’t help questioning what sex and marriage are for. But when Amane and her husband hear about Eden, an experimental town where residents are selected at random to be artificially inseminated en masse (including men who are fitted with artificial wombs), the family unit does not exist and children are raised collectively and anonymously, they decide to try living there. But can this bold experiment build the brave new world Amane desires, or will it push her to breaking point? £16.99 Pre-Order Hive <img class="outside_sales__arrow" alt="arrow" src="https://granta.com/wp-content/themes/granta/img/gr_link_arrow.svg" />Foyles <img class="outside_sales__arrow" alt="arrow" src="https://granta.com/wp-content/themes/granta/img/gr_link_arrow.svg" />Waterstones <img class="outside_sales__arrow" alt="arrow" src="https://granta.com/wp-content/themes/granta/img/gr_link_arrow.svg" />Amazon <img class="outside_sales__arrow" alt="arrow" src="https://granta.com/wp-content/themes/granta/img/gr_link_arrow.svg" />Blackwells <img class="outside_sales__arrow" alt="arrow" src="https://granta.com/wp-content/themes/granta/img/gr_link_arrow.svg" />Bookshop.org <img class="outside_sales__arrow" alt="arrow" src="https://granta.com/wp-content/themes/granta/img/gr_link_arrow.svg" /> Publications Books Life Ceremony Ginny Tapley Takemori £8.99 Fiction In Translation Earthlings Ginny Tapley Takemori £8.99 Fiction In Translation Convenience Store Woman Ginny Tapley Takemori £8.99 Ginny Tapley Takemori on Granta.com Fiction | The Online Edition Fiction | The Online Edition Earthlings Sayaka Murata An excerpt from Earthlings, translated from the Japanese by Ginny Tapley Takemori. Fiction | The Online Edition Fiction | The Online Edition Faith Sayaka Murata ‘Hey, Nagaoka, wanna start a new cult with me?’ New fiction by Sayaka Murata, translated from the Japanese by Ginny Tapley Takemori. Art & Photography | Issue 144 Art & Photography | Issue 144 Chameleon Tomoko Sawada & Sayaka Murata ‘If Sawada can transform herself without limit, maybe I can too.’ Sayaka Murata introduces Tomoko Sawada’s photographs, translated from the Japanese by Ginny Tapley Takemori. Fiction | Issue 144 Fiction | Issue 144 You Okay for Time? Kaori Fujino ‘She wants to talk, she wants to unburden herself, but there’s nothing left so all she can do is cry.’ Translated by Ginny Tapley Takemori. Fiction | Issue 127 Fiction | Issue 127 A Clean Marriage Sayaka Murata ‘Frequency of sex since marriage: zero.’ Sayaka Murata on a sexless marriage and the ‘Clean Breeder’ technique for pleasureless reproduction.'
