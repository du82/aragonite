full_description = "Granta has a storied history of finding and publishing under-represented voices, and providing young writers with a platform where they can be discovered by agents, publishers, and, most importantly, you – the reader. Few literary magazines are able to thrive without external funding and Granta is no different. Income from subscriptions and advertising covers only a part of our costs. We are a not-for-profit organisation, run by the Granta Trust, and we have long relied on the generosity of individuals and organisations to provide the support that allows us to continue publishing this exceptional literary quarterly. By giving to the Granta Trust you will help us to continue publishing new writers, commissioning journalists to reinvent the art of reportage, and developing a more diverse and sustainable literary landscape. All donations of £1,000 or over will be acknowledged in the magazine unless you have chosen to remain anonymous. To discuss a donation or for further information please contact [email protected]. Thank you for your support. One-time donation Monthly donation £ 25 £ 100 £ 500 £ 1000 Enter custom amount Amount should be greater than 0 Your name Field is required Your email Field is required Card details Give now Gift Aid Through the Government’s Gift Aid scheme, Granta Trust can claim an additional 25p for every £1 you donate. So, if you are a UK taxpayer, you can increase the value of your donations to us by 25%, at no extra cost to yourself. Simply fill in your details here. For US Supporters We want to make it as simple as possible for supporters based in the US to donate. You can make tax-deductible contributions to the American Friends of Granta Trust at Myriad USA. Because Myriad USA is a public charity, within the meaning of Sections 501(c)(3) and 509(a)(1) of the IRC, donors may claim the maximum tax benefits allowed by US tax law for their contributions. If you wish to support us in this way, here is how to proceed: • Gifts by credit card: Visit every.org/granta-trust/ • Gifts by check: Address your check to Myriad USA, write American Friends Of Granta Trust in the memo section of the check, and send it to Myriad USA at 551 Fifth Avenue, Suite 2400, New York, NY 10176 • Gifts by wire transfer or to contribute in other ways: Contact Myriad USA via email at [email protected] or phone (212) 713-7660"
