description = "‘Question: ‘What do a Trabant and a condom have in common?’ Answer: ‘Both decrease the pleasure of the ride.’’ Durs Grünbein introduces photography by Martin Roemers."
full_description = '''Have a Good Trip with Trabant Martin Roemers & Durs Grünbein Translated by Karen Leeder Art & Photography Granta 165 23rd November 2023 facebook-with-circle Created with Sketch. twitter-with-circle Created with Sketch. mail-with-circle Created with Sketch. if (window.innerWidth <= 600) { var aj_dim = 514841; } else { var aj_dim = '514840,514841'; }; aj_server = 'https://litbreaker.nui.media/pipeline/'; aj_tagver = '1.0'; aj_zone = 'litbreaker'; aj_adspot = '519067'; aj_page = '0'; aj_ch = ''; aj_kw = ''; aj_pv = true; aj_click = ''; ‘My unchristian forbears: for their whole lives / had got along without God,’ I once wrote. But not without a car, you might add. When the Nazis dreamed up the ‘people’s car’ – the Volkswagen – and encouraged Germans to invest their savings into its production with the promise of ownership, my grandfather made the contribution out of his first pay packet. He never saw the money again. The war not only consumed millions of lives, but also the credit of all those small savers. In the aftermath of 1945, one of the illusions that continued to circulate uninhibited in occupied Germany was the hope of owning a car. It was a driving force, quite a literal one, behind the economic miracle in the West. In East Germany (GDR), the Trabant – the Communist people’s car – occupied a more peculiar place in people’s imaginations. It was born in 1957, in the shadow of the successful brands from the West – Mercedes, BMW, Porsche. A home-grown commodity that endured no competition, it was at the same time stymied by arrested development. The Trabant was an isolated invention, a one-off, that outlasted the state that produced it, just like East Germany’s iconic traffic-light men, the Ampelmännchen. In the global imagination today, Trabants are Ampelmännchen on four wheels: fetish objects from a past with no future. The Trabant was produced in the state-owned car factory VEB Sachsenring Automobilwerke Zwickau in Saxony. It was poorly equipped with a small two-stroke engine. The special oil-and-gas mixture it required resulted in blue smoke exhaust. The true innovation of the Trabant was its body, made from a polymer called Duroplast. This was definitely a step into the future. Metal was in short supply in the GDR: the state enlisted the pharmaceutical industry to supply car production with high-strength reinforced plastics. The classic model series was the Trabant 601 (26 hp), which was produced from 1964 onward. More than 2 million of them rolled off the assembly line until 1990. It was never enough; demand far exceeded output. Automobile deprivation was a constant source of resentment among the population, who saw their dream of mobility, even within the narrow confines of the ‘socialist camp’, disappointed. <img class="img-fluid" src="https://granta.com/wp-content/uploads/2024/03/Granta-1-adverts_Banner_970x250.jpg" alt="Subscribe to Granta" width="1108" height="476" /> <img class="article-subscribe-padloack" src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" alt="Subscribe to Granta today" /> To read this in full, take out a subscription to Granta. Over forty years of new writing at your fingertips – subscribe now. <img class="article-subscribe-padloackunlocked" src="https://granta.com/wp-content/themes/granta/img/open-lock.png" alt="Login to your account" /> Sign in to Granta.com. Art & Photography Granta 165 23rd November 2023 facebook-with-circle Created with Sketch. twitter-with-circle Created with Sketch. mail-with-circle Created with Sketch. if (window.innerWidth <= 600) { var aj_dim = 514841; } else { var aj_dim = '514840,514841'; }; aj_server = 'https://litbreaker.nui.media/pipeline/'; aj_tagver = '1.0'; aj_zone = 'litbreaker'; aj_adspot = '519067'; aj_page = '0'; aj_ch = ''; aj_kw = ''; aj_pv = true; aj_click = ''; Martin Roemers Martin Roemers is a Dutch artist and photographer. His books, exhibitions and projects include Kabul, The Never-Ending War, The Eyes of War, Metropolis and Relics of the Cold War. He is the recipient of two World Press Photo awards and received the Stipend for Established Artists of the Mondriaan Fund in 2021. More about the author → Durs Grünbein Durs Grünbein is Professor for Poetics and Aesthetics at the Kunstakademie Düsseldorf. His next book in English, to be published later this year, is Psyche Running: Selected Poems, 2005–2022. More about the author → Translated by Karen Leeder Karen Leeder is a writer, critic and the Schwarz-Taylor Chair of German Language and Literature at the University of Oxford. She has translated a number of German writers into English and won the Schlegel-Tieck Prize in 2021 for her translation of Durs Grünbein’s Porcelain. Her next Grünbein volume, Psyche Running, will appear in December 2023. More about the translator → More on Granta.com Art & Photography | Issue 170 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock" alt="padlock"/> Events Ashore An-My Lê ‘Designed to face down conventional enemies, it hasn’t won a war since 1991.’ An-My Lê photographs the United States military, introduced by Granta. Fiction | Issue 169 Working Girls A. Jiang ‘I tried to work out how many elements I would have plugged if I retired at sixty, and soon I was fatigued before a simple subtraction.’Fiction by A. Jiang. Essays & Memoir | Issue 169 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock" alt="padlock"/> Adrift in the South Xiao Hai ‘Finally! I thought. Now I get to work in a big factory. I was fifteen and a half years old. I was a child laborer.’Xiao Hai on coming of age in the factories of Shenzhen, translated by Tony Hao. Poetry | Issue 169 Birds Zheng Xiaoqiong ‘in the Huangma Mountains, everything rots readily’ A poem by Zheng Xiaoqiong, translated by Eleanor Goodman. Essays & Memoir | Issue 165 From Zanzibar to Marbach Abdulrazak Gurnah ‘The tragedies inflicted on the people of East Africa as a result of European rivalries are belittled and forgotten.’ Abdulrazak Gurnah on German East Africa. Fiction | The Online Edition Oxblood Tom Benn ‘Some nights he hurt her which made her glad; she never let him know because the pain was brief and rare and felt like penance.’An extract from Oxblood by Tom Benn.'''
