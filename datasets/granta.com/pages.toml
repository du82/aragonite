description = "Find out about upcoming Granta Books and Granta magazine events here."
full_description = '<img aria-hidden decoding="async" src="https://litbreaker.nui.media/pipeline/517985/0/vc?z=litbreaker&#038;dim=514838,514839&#038;kw=&#038;click=" width="" height="" alt="" border="0"> Join us on Weds 4 May in London to launch Granta 159: What Do You See? with readings and discussions from contributors Jason Allen-Paisant, William Atkins, Rebecca Sollom and Saba Sams. Tickets free but essential. Join us on 17 February at 6.30 pm at CCA Goldsmiths, London to mark the publication of new issue Granta 158: In the Family with Moses McKenzie, Will Rees, Fran Lock and Lewis Khan. Tickets free but essential, click here to book. On 18 November, we launch Granta 157: Should We Have Stayed at Home? New Travel Writing. Join contributors Eliane Brum, Francisco Cantú, Sinéad Gleeson, Kate Harris, Emmanuel Iduma and Jessica J. Lee and guest editor William Atkins at this online event. Online on Monday 29 November, 5x15 hosts Granta contributors Jason Allen-Paisant, Bathsheba Demuth, Taran N. Khan and Ben Mauk as they describe four extraordinary journeys, and reflect on the meaning of travel in 2021. Chaired by guest editor William Atkins. At the Manchester Literature Festival on 14 October, join Valerie Miles, Cristina Morales and Mateo García Elizondo at a discussion of Granta 155: Best of Young Spanish-Language Novelists 2. Hosted by Mariana Casale. Instituto Cervantes, the University of Cambridge and Granta invite you to join us on Tuesday 12 October at 5 p.m. to discuss the next generation of Spanish-language novelists. With contributors Cristina Morales, Carlos Fonseca and Mateo García Elizondo. At the Cheltenham Literature Festival on 13 October, join Valerie Miles, Cristina Morales and Mateo García Elizondo at a discussion of Granta 155: Best of Young Spanish-Language Novelists 2. Chaired by translator Daniel Hahn. Instituto Cervantes, UCL and Granta invite you to join us on Monday 11 October at 6.30 p.m. in London to discuss the next generation of Spanish-language novelists. With contributors Cristina Morales, Carlos Fonseca and Mateo García Elizondo, introduced by editor Valerie Miles.'
