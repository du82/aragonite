["https://granta.com/contributor/raymond-carver"]
title = "Raymond Carver | Granta Magazine"
description = "Raymond Carver (1938-1988), an American poet and short story writer, was instrumental in the revitalization of the short story in the 1980s. His collections of short stories include Will You Please Be Quiet, Please (1976), What We Talk About When We Talk About Love (1981) and Cathedral (1983), all published by Harvill in the UK and Vintage in the US."
full_description = '''Raymond Carver Raymond Carver (1938–1988) was an American poet and short-story writer. His works include Will You Please Be Quiet, Please?, What We Talk About When We Talk About Love and Cathedral, which was a finalist for the 1984 Pulitzer Prize for Fiction. His work has been translated into more than twenty languages. Raymond Carver on Granta.com Fiction | Issue 68 Fiction | Issue 68 Call If You Need Me Raymond Carver ‘She watched me as I wrote out a cheque for the three months’ rent. Later, back at the motel, in bed, she lay with her hand on her forehead and said, “I envy your wife.”’ Fiction by Raymond Carver. Essays & Memoir | Issue 68 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Essays & Memoir | Issue 68 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Friendship Raymond Carver ‘But when I look again at this picture that was taken three years ago in London, after a fiction reading, my heart moves, and I'm nearly fooled into thinking that friendship is a permanent thing.’ Poetry | Issue 68 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Poetry | Issue 68 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> What the Doctor Said Raymond Carver ‘He said are you a religious man do you kneel down / in forest groves and let yourself ask for help.’ Fiction | Issue 21 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Fiction | Issue 21 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Menudo Raymond Carver ‘Vicky says I’m crazy. She said worse things too last night. But who could blame her?’ Essays & Memoir | Issue 21 Essays & Memoir | Issue 21 Where he was: Memories of my Father Raymond Carver ‘June was summer nights and days, graduations, my wedding anniversary, the birthday of one of my children. June wasn't a month your father died in.’ Fiction | Issue 21 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Fiction | Issue 21 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> The Cabin Raymond Carver ‘Yell defiance until his chest hurt, at the hawks that circled and circled over the meadow.’ Fiction | Issue 8 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Fiction | Issue 8 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> The Compartment Raymond Carver ‘How would he act when he saw the boy at the station?’ Fiction | Issue 4 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Fiction | Issue 4 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Vitamins Raymond Carver ‘I worked a few hours a night for the hospital. It was a nothing job. I did some work, signed the card for eight hours, went drinking with the nurses.’'''
