for the Indies Choice Award and Best Translated Book Award. Sayaka Murata’s Earthlings (October 2020) has already been named one of Time’s ‘must-read’ books of 2020. Her translation of Kyoko Nakajima’s Naoki prizewinning The Little House was published in February 2019, and Things Remembered and Things Forgotten a short-story collection by the same author, co-translated with Ian MacDonald, is due out in spring 2021). More about the translator → I loved this book! It easily converted me to being an alien. A radical, hilarious, heartbreaking look at the crap we have all internalized in order to fit in and survive Elif Batuman £8.99 Buy Now More on Granta.com Fiction | The Online Edition Faith Sayaka Murata ‘Hey, Nagaoka, wanna start a new cult with me?’ New fiction by Sayaka Murata, translated from the Japanese by Ginny Tapley Takemori. Art & Photography | Issue 144 Chameleon Tomoko Sawada & Sayaka Murata ‘If Sawada can transform herself without limit, maybe I can too.’ Sayaka Murata introduces Tomoko Sawada’s'''
