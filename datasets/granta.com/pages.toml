full_description = '''Issues ← Back to all issues Granta 127: Japan Spring 2014 Everyone knows this country and no one knows it. Here are twenty new Japans by its writers and artists, and by residents and visitors and neighbours. A special issue of Granta, published simultaneously in Japanese and English. £14.99 Buy Now subscribe From this Issue Art & Photography|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Art & Photography|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Primal Mountain Yuji Hamada ‘In March 2011, the Great East Japan Earthquake occurred.’ Fiction|Granta 127 Fiction|Granta 127 A Clean Marriage Sayaka Murata ‘Frequency of sex since marriage: zero.’ Sayaka Murata on a sexless marriage and the ‘Clean Breeder’ technique for pleasureless reproduction. Fiction|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Fiction|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Breakfast Toshiki Okada ‘If I had known she were heading for Tokyo then, and if I had known she thought of Tokyo as a city of zombies, I would have wanted to know, of course, whether she saw me that way, too.’ Fiction|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Fiction|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Variations on a Theme by Mister Donut David Mitchell ‘But what if he answers in Martian? I’ll die.’ Essays & Memoir|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Essays & Memoir|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Linked Ruth Ozeki ‘old poems, like polished stones, / tumbled words to break my teeth on.’ Fiction|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Fiction|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Things Remembered and Things Forgotten Kyoko Nakajima It was something Takashi remembered but Masaru had forgotten. Fiction|Granta 127 Fiction|Granta 127 Final Fantasy III Tao Lin ‘On the F train to Manhattan I emailed a friend in the UK. I said I couldn’t write my essay about Japan.’ Essays & Memoir|Granta 127 Essays & Memoir|Granta 127 Blue Moon Hiromi Kawakami ‘Rather than death itself, it is the disappearance of traces that seems unbearable and sad. The disappearance of all signs that I existed.’ Poetry|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Poetry|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> The Japanese Firefly Squid Kimiko Hahn ‘nothing like an ancient corridor where a / woman is stripped of resistance.’ Fiction|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Fiction|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Spider Lilies Hiroko Oyamada ‘The breeze smelled of many things: autumn and earth, the green of the countryside, face powder and old age.’ Art & Photography|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Art & Photography|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Out of Ark Yumiko Utsu ‘How long has it been since Noah and his passengers set off in their vessel?’ Essays & Memoir|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Essays & Memoir|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> The Beauty of the Package Pico Iyer ‘You can throw yourself into any fantasy, she (and her country) might have been saying, so long as you don’t mistake it for real life.’ Fiction|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Fiction|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Pig Skin Andrés Felipe Solano ‘A perfect impostor.’ Essays & Memoir|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Essays & Memoir|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Printable Toh EnJoe ‘Which is scarier: that the past could actually change or that you could just think it did?’ Fiction|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Fiction|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> After the War, Before the War David Peace ‘At last, at last. His first steps, on Chinese soil.’ Art & Photography|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Art & Photography|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> From Site Daisuke Yokota ‘The photograph we are left with and the memory of that time do not progress along the same time axes.’ Essays & Memoir|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Essays & Memoir|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Scavengers Adam Johnson ‘I was dying to buy something, anything that would help my wife and children understand the profound surrealism and warped reality I’d experienced on my research trip to North Korea.’ Fiction|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Fiction|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> The Dogs Yukiko Motoya ‘I once lived with a whole lot of dogs.’ Essays & Memoir|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Essays & Memoir|Granta 127<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Arrival Gates Rebecca Solnit ‘It was like trying to go back to before the earthquake, to before knowledge.’ Fiction|Granta 127 Fiction|Granta 127 Pink Tomoyuki Hoshino ‘Spinning makes all that is illusory fall away.’ Translated from the Japanese by Brian Bergstrom. The Online Edition Fiction|The Online Edition Fiction|The Online Edition Bad Seeds Masatsugu Ono ‘Evil, she told herself. That was the name of the flower.’ Essays & Memoir|The Online Edition Essays & Memoir|The Online Edition Sasayama Nadifa Mohamed ‘It was in one of those listless summers after graduation that I found myself in the small Japanese town of Sasayama.’ Art & Photography|The Online Edition Art & Photography|The Online Edition Rainbow Taisuke Koyama & Ivan Vartanian ‘I now see Melting Rainbows as a self-referential project to parse the universe which we inhabit.’ Fiction|The Online Edition Fiction|The Online Edition Smartening Up Aoko Matsuda ‘‘Let’s become monsters together,’ she said, looking straight into my eyes.’ In Conversation|The Online Edition In Conversation|The Online Edition Motoyuki Shibata | Interview Motoyuki Shibata & Fran Bigman ‘I always think the borderline between reality and non-reality, or fantasy, is much thinner in Japanese fiction than in American or British fiction.’ Fiction|The Online Edition Fiction|The Online Edition Bucket of Eels Mitsuyo Kakuta ‘I was gazing into my empty bowl and realizing how little time it takes to eat when you’re not carrying on a conversation.’ Poetry|The Online Edition Poetry|The Online Edition Three Poems Sakutarō Hagiwara ‘What I do not have is Everything: / how is it that I won’t bear this neediness?’ Essays & Memoir|The Online Edition Essays & Memoir|The Online Edition Three Japanese Books Samantha Harvey, Phil Klay & Tao Lin ‘Each word is a snowflake falling, and with each paragraph the snow settles deeper.’ In Conversation|The Online Edition In Conversation|The Online Edition David Peace and Kyoko Nakajima in Conversation Kyoko Nakajima & David Peace ‘When we talk about history, the dangers of embellishment, fabrication and wilful distortion are ever-present’ In Conversation|The Online Edition In Conversation|The Online Edition Hiromi Kawakami | Podcast Hiromi Kawakami, Anne Meadows & Asa Yoneda ‘Looking back, I never was aware of feeling that close to death, but actually if you think about it, just living every day there is a very small but definitely existing chance of death, whatever you're doing, wherever you are.’ Fiction|The Online Edition Fiction|The Online Edition Harmonica Hare Yoko Ogawa Everyone knows this country and no one knows it. Here are twenty new Japans by... Essays & Memoir|The Online Edition Essays & Memoir|The Online Edition Toh EnJoe | First Sentence Toh EnJoe ‘I think that the thing called thought can be viewed as rooted in the very real phenomenon of neurons firing.’ Fiction|The Online Edition Fiction|The Online Edition The Bees that Disappeared Keiichiro Hirano ‘It was during this period that I got to know K, one of the local mailmen.’ Essays & Memoir|The Online Edition Essays & Memoir|The Online Edition The Casualties Katie Kitamura ‘The following are some of the Japanese players who also appeared in the major leagues during the Age of Ichiro.’ Poetry|The Online Edition Poetry|The Online Edition Silver Threads Greg Alan Brownderville & Zach Savich ‘Time trapped me in this canyon, this dark jar — / jabbed holes in the sky to spare me light and air.’ Essays & Memoir|The Online Edition Essays & Memoir|The Online Edition The Power of a Grandmother Named Tranquilina Valerie Miles 'Never underestimate the power of a grandmother to leave her mark on coming generations, or the taste of her cooking to cause an epiphany big enough to give the world a shiver.' Fiction|The Online Edition Fiction|The Online Edition Filling Up With Sugar Yuten Sawanishi ‘The vagina was the first part of her mother’s body that turned to sugar.’ Essays & Memoir|The Online Edition Essays & Memoir|The Online Edition Maruti 800 Rana 