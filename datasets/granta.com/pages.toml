full_description = '''Granta publishes award-winning writing. Here you can keep up to date with all the latest news about our authors. Prizes Granta publishes award-winning writing. Here you can keep up to date with all the latest news about our authors. <img aria-hidden decoding="async" src="https://litbreaker.nui.media/pipeline/517985/0/vc?z=litbreaker&#038;dim=514838,514839&#038;kw=&#038;click=" width="" height="" alt="" border="0"> Granta publishes award-winning writing. Here you can keep up to date with all the latest news about our authors. Jerwood Foundation has awarded a grant of £15,820 to Granta Trust, allowing Granta magazine to commission the work of early-career UK photographers. Kairos by Jenny Erpenbeck (tr. Michael Hofmann) is on the shortlist for the International Booker Prize. Though the Bodies Fall by Noel O'Regan is on the shortlist for the James Tait Black Prize for Fiction. The Glutton by A. K. Blakemore and Biography of X by Catherine Lacey have both made the shortlist of the Swansea University Dylan Thomas Prize. Our Share of Night, Life Ceremony, When I Sing, Mountains Dance and I'm A Fan have all made the longlist for the Nota Bene Prize (formerly the Bloggers' Book Prize). When I Sing, Mountains Dance by Irene Sola (trans. Mara Faye Lethem) and Chilean Poet by Alejandro Zambra (trans. Megan McDowell) are both shortlisted for the Oxford-Weidenfeld Translation Prize. Our Share of Night by Mariana Enriquez (trans. Megan McDowell) is shortlisted for The Kitschies Red Tentacle award, awarded to speculative, sci-fi and fantasy novels. Anthony Anaxagorou has won the RSL Ondaatje Prize for his collection Heritage Aesthetics. The prize is awarded to an outstanding work of fiction, non-fiction or poetry that best evokes the spirit of a place. Heritage Aesthetics by Anthony Anaxagorou is on the shortlist for the Anglo-Hellenic League Runciman Award, given annually to a book about Greece. Constructing a Nervous System by Margo Jefferson is the overall and non-fiction category winner of this year's Rathbones Folio Prize.'''
