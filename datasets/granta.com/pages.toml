full_description = 'Kathryn Scanlan Kathryn Scanlan is the author of The Dominant Animal, Kick the Latch and Aug 9—Fog, a new edition of which will be published this year by Book Works in the UK. Image © Melanie Schiff Kathryn Scanlan on Granta.com Fiction | Issue 170 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Fiction | Issue 170 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> The First Person Kathryn Scanlan ‘I picked up a dry leaf, and when the caterpillar climbed aboard, I carried the leaf to the safety of the grass and set it down at the base of a tree.’Fiction by Kathryn Scanlan. Fiction | The Online Edition Fiction | The Online Edition Kick the Latch Kathryn Scanlan ‘You live at the track, your life is full.’An excerpt from Kathryn Scanlan’s new work of fiction, Kick the Latch. Fiction | The Online Edition Fiction | The Online Edition A Page Pounded Clean Kathryn Scanlan ‘There was no shriek, no gore, but the tail – it looked electrically charged.’ A story by Kathryn Scanlan. Fiction | The Online Edition Fiction | The Online Edition A Stiff Flame from the Neck Kathryn Scanlan ‘I gripped her and struck the wheel on her neck, but I couldn’t get it to spark.’ A story by Kathryn Scanlan. Fiction | Issue 156 Fiction | Issue 156 A Place I’d Go To Kathryn Scanlan ‘They were very old and had to be carried down the hall to the examination room and lifted onto and off the scale like sacks of tender, bruisable fruit.’ A story by Kathryn Scanlan. Fiction | The Online Edition Fiction | The Online Edition Fable Kathryn Scanlan ‘The girl’s curiosity often led her into troublesome situations, but she considered it part of the pact her soul had made in order to gain entrance to the world, and did not worry much over what befell her.’ New fiction from Kathryn Scanlan. In Conversation | The Online Edition In Conversation | The Online Edition In Conversation Kathryn Scanlan & Kate Zambreno ‘When a day is not structured by appointments, meetings, driving to work, taking lunch, driving home, shopping (i.e. capitalism), its soft, loose (wild?) shapelessness becomes apparent.’ Fiction | The Online Edition Fiction | The Online Edition The Marriage Finger Kathryn Scanlan ‘On the marriage finger was a gold ring topped with a big prong-set stone.’ New fiction by Kathryn Scanlan. Essays & Memoir | The Online Edition Essays & Memoir | The Online Edition The Best Book of 1943: Two Serious Ladies by Jane Bowles Kathryn Scanlan Kathryn Scanlan on the best book of 1943: Two Serious Ladies by Jane Bowles. Essays & Memoir | The Online Edition Essays & Memoir | The Online Edition Kathryn Scanlan | Notes on Craft Kathryn Scanlan ‘I try to write a sentence as unbudging and fully itself as some object sitting on a shelf in my office.’ Fiction | The Online Edition Fiction | The Online Edition The Poker Kathryn Scanlan ‘I looked back and there was something wrong about his hand – how it cupped her bottom, how it probed.’'
