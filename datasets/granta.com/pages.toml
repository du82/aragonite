full_description = 'J.M. Coetzee John Maxwell Coetzee was born in Cape Town, South Africa, on 9 February, 1940. An author and academic, Coetzee began writing fiction in 1969. His first novel, Dusklands, was published in South Africa in 1974. He is the first author to win the Booker Prize twice, for The Life and Times of Michael K in 1983 and Disgrace in 1999. In 2003 he was awarded the Nobel Prize in Literature. His most recent novel is Diary of a Bad Year (2007); his autobiography, Summertime, was published in 2009. He lives in Adelaide. Photograph © MALBA Buenos Aires J.M. Coetzee on Granta.com Fiction | Issue 168 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Fiction | Issue 168 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> The Museum Guard J.M. Coetzee ‘Do they strike people as a strange couple? He does not know, does not care.’Fiction by J.M. Coetzee. Fiction | Issue 168 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Fiction | Issue 168 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Youth J.M. Coetzee ‘There are two, perhaps three places in the world where life can be lived at its fullest intensity’ Fiction | Issue 168 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Fiction | Issue 168 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Make Him Sing J.M. Coetzee ‘He expects astonishment and sympathy; instead he gets mirth.’ Essays & Memoir | Issue 168 Essays & Memoir | Issue 168 Meat Country J.M. Coetzee ‘It is eccentric not to eat meat in the United States, doubly so in Texas.’'
