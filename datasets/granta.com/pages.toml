title = "Granta 170: Winners | Granta"
description = "Exploring a world ruled by competition and conflict, Granta 170: Winners, returns to sports writing...."
full_description = 'Issues ← Back to all issues Granta 170: Winners Winter 2025 Exploring a world ruled by competition and conflict, Granta 170: Winners, returns to sports writing. Featuring essays by Nico Walker, Declan Ryan, Clare Bucknell and Owen Hatherley on the Isle of Wight. Fiction by Caryl Churchill, Mircea Cărtărescu, Kathryn Scanlan, Edward Salem, Benjamin Nugent and K Patrick. As well as photography by An-My Lê, Myriam Boulos, Tereza Červeňová and Prarthna Singh (introduced by Snigdha Poonam). Image © Getty, Defensive back Deion Sanders poses with his 1988 Jim Thorpe Award at Doak Campbell Stadium, Florida State University £14.99 Buy Now subscribe From this Issue Essays & Memoir|Granta 170 Essays & Memoir|Granta 170 Introduction Thomas Meaney ‘Everybody knows a game is not worth watching unless the players are trying to win.’ Thomas Meaney introduces the issue. Fiction|Granta 170 Fiction|Granta 170 A Good Day Caryl Churchill ‘I suddenly had one of those I can’t find words for it one of those moments of joy I suppose it is.’ Fiction by Caryl Churchill. Essays & Memoir|Granta 170<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Essays & Memoir|Granta 170<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Real Tennis Clare Bucknell ‘Real tennis players like to say that theirs is the only proper racket sport because the rest aren’t difficult enough.’ Clare Bucknell on a historical form of tennis. Art & Photography|Granta 170<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Art & Photography|Granta 170<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Events Ashore An-My Lê ‘Designed to face down conventional enemies, it hasn’t won a war since 1991.’ An-My Lê photographs the United States military, introduced by Granta. Essays & Memoir|Granta 170<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Essays & Memoir|Granta 170<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Mucker Play Nico Walker ‘When you said so loudly that you were the best, that you were worth the top dollar, then not just every game but every play became important.’ Nico Walker on the rise and fall of American football, from Jim Thorpe to Deion Sanders. Fiction|Granta 170<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Fiction|Granta 170<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Round One Benjamin Nugent ‘On the day the doctors extracted the eggs from her ovaries, he would have to go into a room in the hospital and produce.’ Fiction by Benjamin Nugent. Art & Photography|Granta 170<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Art & Photography|Granta 170<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> England’s Other Island Owen Hatherley & Tereza Červeňová ‘A Victorian summer utopia perpetually falling into dereliction and desuetude.’ Owen Hatherley on the Isle of Wight, with photography by Tereza Červeňová. Fiction|Granta 170 Fiction|Granta 170 Appendix K Patrick ‘The appendix appeared. Half of it already distended, deep maroon, a twisted and flashing smile.’Fiction by K Patrick. Fiction|Granta 170<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Fiction|Granta 170<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Troubadour Edward Salem ‘There were always too many white activists and upper-class European NGO workers, foreign queers and queer adjacents who were there for the anecdote, hoping to bed a native before their visa ended.’Fiction by Edward Salem. Art & Photography|Granta 170 Art & Photography|Granta 170 Bombed in Beirut Myriam Boulos ‘What to do as a photographer in a war where even simple family portraits have become trophies?’Myriam Boulos photographs displaced workers in Beirut. Essays & Memoir|Granta 170 Essays & Memoir|Granta 170 The Hurt Business Declan Ryan ‘Honour, or anything approaching it, sits vanishingly low on the priority list.’Declan Ryan on boxing and the fight between Anthony Joshua and Daniel Dubois. Fiction|Granta 170<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Fiction|Granta 170<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> The First Person Kathryn Scanlan ‘I picked up a dry leaf, and when the caterpillar climbed aboard, I carried the leaf to the safety of the grass and set it down at the base of a tree.’Fiction by Kathryn Scanlan. Art & Photography|Granta 170<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Art & Photography|Granta 170<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Champion Prarthna Singh & Snigdha Poonam ‘As Prarthna took photographs, I stood in the doorway watching the school-age girls with taut muscles and intense focus lock in bouts across the length of the hall.’Snigdha Poonam on wrestling and the photography of Prarthna Singh. Fiction|Granta 170 Fiction|Granta 170 The Dance Mircea Cărtărescu ‘In the center of the palace was the Exit, blocked by a ferocious guardian, whom none could pass.’Fiction by Mircea Cărtărescu, translated by Sean Cotter. The Online Edition Podcasts|The Online Edition Podcasts|The Online Edition Podcast | Declan Ryan Declan Ryan ‘Some of these bigger characters, Muhammad Ali or Lennox Lewis, they can become these mythologic, mythological characters, or these godlike figures.’Declan Ryan on contemporary boxing. var nav = document.querySelectorAll("[title=magazine]") for(i = 0; i < nav.length; i++){ nav[i].classList.add("--script-nav-active") }'
