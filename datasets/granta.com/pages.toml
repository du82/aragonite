["https://granta.com/faith-sayaka-murata"]
title = "Faith | Sayaka Murata | Granta"
description = "‘Hey, Nagaoka, wanna start a new cult with me?’ New fiction by Sayaka Murata, translated from the Japanese by Ginny Tapley Takemori."
full_description = "Faith Sayaka Murata Translated by Ginny Tapley Takemori ‘Hey, Nagaoka, wanna start a new cult with me?’ It was Sunday afternoon, and the Saizeriya in the shopping mall by the station was packed with families having lunch. I shrugged and took a sip from my third caffè latte. ‘That’s a bit vague, isn’t it? What exactly are you trying to rope me into?’ Ishige lowered his voice and leaned in closer. ‘No, no, I’m not trying to rope you into anything. I’m proposing that you and I should start a new business in the form of a cult.’ I gave an exaggerated sigh and resisted the urge to burst out laughing. Everyone had exchanged curious glances when Ishige turned up to the class reunion last week. We often held these parties, but it was the first time he’d ever come to one, and nobody knew who on earth had invited him. I myself rarely attended them before circumstances forced me to move back in with my parents, and maybe that was why he’d singled me out. The first thing that occurred to me when he sat down next to me, pestering me for my LINE ID and insisting we meet up for tea, was that he had to be selling something. I didn’t know whether it was a pyramid scheme or a religion or what, but I was certain that he wasn’t just trying to pick me up. I only agreed to meet him at Saizeriya on my precious day off because I already had an appointment for nose-hair whitening at an ear and nose beauty salon near the station. I might as well, I thought. Plus, Ishige was stupid, so even if he did try to sell me something I wasn’t going to fall for it. And if he was trying to sell me something, that meant he had already fallen for whatever it was. I was curious to know what he had been taken in by. I thought it could make for a good laugh at the next afternoon tea gathering at Asami’s place. I’d even imagined how I’d make fun of him. Hey, you know what? Remember Ishige turning up to that party? He’d been pestering me over LINE ever since, so in the end I thought I might as well hear him out. And then he did the hard sell on me! Crazy, isn’t it? Hilarious! So when Ishige came out with this idea, it was perfectly within the realm of expectation, although it hadn’t occurred to me that he might be pushing a scam cult that he hadn’t actually fallen for. ‘I’ve been looking into it. Spiritual stuff seems to be popular among women, right? We could make a killing starting a cult like that!’ ‘You must be joking!’ I shot back. Despite my refusal, Ishige looked happy. He leaned in closer and spread some ludicrous papers out on the table. ‘It’ll work, I’m telling you. I’ve put a lot of time into this. Here, look at this data. You see, it’s no good joining an existing cult, you have to start one yourself. If all goes well, profits will balloon to this level within a year. It’s such a good opportunity I thought I should invite others to join me too. It came to me suddenly at that party. You always were different from the others, Nagaoka, even in junior high. You were smart, and didn’t hang around with other kids much. That sort of charisma is absolute essential in this business.’ ‘Flattering someone’s talents like that is a textbook approach, isn’t it? Anyone can see through that. If you’re so crap at the hard sell now, Ishige, how do you expect to fool anyone once you get the business started?’ Ishige looked a bit put out, but went on undaunted, ‘Yeah, well, it probably was out of a textbook. But it’s true. Even she said so.’ ‘She?’ ‘Oh look, here she comes now.’ Oh, so that’s his tactic, I thought, steeling myself. He’d shown no sign of calling anyone else by the time I was on my third caffè latte, so I’d let my guard down. Before coming, I’d already thought that if Ishige was going to do the hard sell on me, he’d likely bring along whoever had done it to him. He was stupid, but it was possible that his accomplice would be a smooth talker and a formidable opponent. I’d therefore deliberately ignored the waitress’s offer of a comfortable seat in the interior and had taken a seat beside the busy self-service drinks bar close to the exit, where I sat with my bag on my lap and without even taking off my hat, ready to make my escape at a moment’s notice. ‘Hello, Nagaoka.’ The person who turned up was someone I knew, which threw me. It was Saikawa, who had been in the same year as me in junior high, although we’d only been in the same class once and had hardly even spoken with each other. She’d been well behaved and hard-working. She hadn’t stood out at all, but was smart and trustworthy – just the type of girl the class teacher loved. I glared at Ishige. ‘You’re not trying to rope Saikawa into this weird scheme too, are you?’ Saikawa was the sort of girl who did all her chores meticulously, whether it was her turn for class duty or cleaning or class rep or collecting work sheets. Just watching her do this I used to think she was losing out for being so earnest. And I’d sensed with revulsion that there were people out there who would prey on her right into adulthood. ‘Oh, didn’t I tell you? We were an item during college,’ Ishige said, somewhat boastfully. I couldn’t hide my surprise. ‘What? You two?’ ‘We went to the same university, you see. We dated for a couple of years. But after graduating, she got involved in a pyramid scam selling water purifiers. And so I split up with her.’ Saikawa hung her head in shame as Ishige went glibly on and on. ‘It’s true, I’m embarrassed to admit,’ she said. Already petite, she now sat hunched over, which made her whole body even smaller. She held her thin right wrist with her left hand, gripping it tightly as though punishing herself. ‘And actually I cut off all contact. It was only when I thought of starting this business that it occurred to me that since Saikawa was dumb enough to fall for one scam, I could pick her brains about how it works. But I mean, really, water filters! Does anyone get taken in by that sort of thing these days? I laughed my head off at the time, I really did.’ Somehow I felt offended by this. ‘Look, you don’t have to put it like that. After all, she must’ve ended up getting involved because there was something to it. It’s not on to trash her like that, is it?’ Apparently neither Ishige nor Saikawa had expected anything like this from me. They both peered at me, baffled. ‘Eh? We’re planning to dupe idiots in the same way, aren’t we? What are you saying, Nagaoka?’ I was lost for words. ‘I did check the law on this.’ Saikawa said, as if coming to my rescue. ‘If you deliberately deceive someone, it’s fraud. But if you truly believe in it, and don’t have malicious intentions, there is a grey zone. I guess that’s what you mean, isn’t it, Nagaoka?’ ‘Well, yeah, but . . . anyway, in that case all the victim can do is cry themselves to sleep. They won’t get back any of the money they pump into some invisible entity,’ I murmured in a low voice. ‘Hey Nagaoka, you seem to know quite a bit about it, don’t you?’ Ishige cried in delight. ‘A friend of mine once got taken in by something like this, so I read up about it.’ ‘Well I never! So you’re something of an authority then. Glad I brought you in, Nagaoka. Very reassuring, eh, Saikawa?’ Ishige guffawed, and thumped Saikawa on the back. As if startled by the sudden shock, Saikawa’s left hand let go of her right wrist. The skin looked even whiter than normal, like a plastic doll’s. I still hadn’t managed to turn them down by the time I had to leave for my nostril-whitening appointment, and it was decided that Saikawa would give me a lift. ‘I’m sorry for taking advantage of your offer when I could easily walk.’ ‘It’s perfectly fine, Ms Nagaoka. It so happens that I have an errand to run in the shopping center, in any case.’ Saikawa kept mixing ultra-polite language into her speech, as if she was finding it hard to judge the distance between us when we were meeting after so long. ‘You really don’t have to speak so formally, you know,’ I told her. ‘We were classmates, after all.’ ‘Oh, right. Lately I’ve only been seeing colleagues at work, so I’ve just got into the habit.’ Seeing Saikawa laugh so shyly, it vaguely occurred to me that maybe she didn’t have any friends. I’d been the same before I moved back home and reconnected with Asami and the others, with no friends or anyone to talk to other than work colleagues and the staff in the convenience store next to where I lived. I’d come here today intending to have fun ridiculing Ishige, but now all I could think about was Saikawa in the driver’s seat beside me. Having witnessed Ishige being so contemptuous of her, I almost felt ashamed for having wanted to laugh at him. ‘Look, I haven’t made up my mind to join yet, you know,’ I said reluctantly, thinking it would be horrible if I found myself roped in any further. ‘I see.’ She gave a wry smile. ‘I must say that someone like you shouldn’t be involved in persuading people to join a scam cult, much less one that we’re starting from scratch.’ ‘What prompted you to get involved?’ With a little smile, she replied, ‘Um, well . . . It’s for revenge.’ ‘What do you mean?’ ‘You know, when I was selling those water filters, I really did believe in what I was doing. I believed they were the best water filters in the world, and that they would make everyone healthy and happy. But as it happened, all my friends distanced themselves from me and I got up to my ears in debt, and ended up causing trouble for my parents.’ ‘So isn’t that sort of . . . um . . . whatcha call it . . . brainwashing, I guess? Won’t it be traumatic for you? Don’t you want to get away from all that sort of thing?’ ‘Yes, I suppose that would be the normal thing to do. Having sold those water filters is a black stain on my past, and it’s a taboo subject even among my friends who know about it now. But maybe because of that . . . well, when Ishige got in touch with me on Facebook after so long about this plan of his, I thought to myself, this is an opportunity to get my revenge.’ Revenge for what? Did she mean that because she’d been ripped off so badly last time, this time she’d make the money back? ‘Oh, this is it, isn’t it? Ear and Nose Beauty Clinic. It was just an ordinary ear, nose and throat clinic before.’ ‘I guess it was, yes.’ ‘So they do nostril whitening now! I had no idea.’ ‘Yeah. Seems it’s the norm abroad.’ I undid my seat belt and opened the car door. ‘Thanks for the lift!’ ‘You’re very welcome, Ms Nagaoka.’ ‘Saikawa, you really don’t need to be so formal with me, you know.’ ‘Oh, I did it again, did I?’ she said, putting her hand over her mouth, embarrassed. ‘I’ll work on it for next time.’ As I closed the door, Saikawa slowly bowed her head at me. When I reached the clinic, I turned to see that her light blue car was still there? She must have been making sure I was okay before driving off. * ‘What, really? No way! That’s hilarious, Miki!’ Asami roared with laughter when I told her about what had happened, and hugged her child close. About a year ago, when I posted on Facebook that I was moving back to my parents’ place for a while, there had been hardly any response. Asami had been the only one to leave a comment. She had married and had bought a condo next to her parents’ place, and sometimes she invited me along to the tea parties she held there. I hadn’t been close to her other friends at school, and there were times when I couldn’t keep up with them, but the vibe was good and they would laugh about everything. Still, they liked it better when I had an interesting story for them. I’d been feeling awkward about not having thought of an amusing topic of conversation, and on the spur of the moment I ended up telling them about Ishige. He’d never been popular with girls, even back in school, and they all laughed uproariously at his plans to start a scam cult. I was relieved when everyone laughed, and felt that my place in the party had been assured for a little longer. ‘It’s not like it’s that easy to start a scam cult, is it? Who on earth would be taken in by Ishige?’ ‘I’m surprised that Saikawa’s involved in it too. I wonder why? Maybe she’s short of money?’ Suddenly I couldn’t laugh any more. I’d only intended to talk about Ishige, and hadn’t planned on mentioning Saikawa. But then everyone got excited and began demanding, ‘Miki, why on earth didn’t you turn him down right away and get the hell out of there?’ I was scared they’d all think I was stupid enough to be taken in by his sweet talk, and so on impulse I’d mentioned her. ‘Yes, exactly! If it hadn’t been for Saikawa, then I’d have been out of there like a shot! It’s just that I was concerned for her. Normally I’d never have listened to Ishige talking such rubbish for a moment longer,’ I said by way of excuse. Everyone nodded. ‘Yeah, I get what you mean. Saikawa always was quite timid. I’d hate for her to be taken in by Ishige.’ ‘Come to think of it, I had a really weird phone call from her a while back.’ Asami’s close friend Mayu, who was drinking non-alcoholic wine, suddenly looked up. ‘It’s not like we were friends or anything in school, but we were in the same club and lived in the same area, so we often walked together and talked a bit. But we hadn’t been in touch at all after leaving school. Then out of the blue, I guess it must have been about the time I started working, she called me at my parents’ place.’ ‘Uh-oh, that in itself would be enough to make anyone suspicious,’ Keiko laughed as she stuck her fork into her cake. ‘There was no way I was going to meet up with her – I knew right away it was something dodgy. And she gave me some spiel about a water filter –’ ‘A water filter! How lame is that?’ Everyone burst out laughing, but the most I could manage was an ambiguous expression. ‘Well, it’s in her nature . . . it’s her fate to be taken in by that sort of thing.’ ‘What do you mean, in her nature?’ I asked seriously. Asami frowned, a bit put out. ‘Look, people who get taken in by that sort of thing always have some kind of hidden aspiration, like deep down they’re frustrated with their lives, or maybe they’re hoping to make easy money without having to work. They get taken in because they’re foolish. They’re stupid, to put it bluntly.’ ‘Seriously? I’d been feeling a bit sorry for her, but maybe she’s been that sort of person all along. There’s no hope for her, I guess. Best leave her alone.’ ‘Too right. Might be catching.’ I wanted to defend Saikawa, but I couldn’t find the words. After all, I myself had been using almost exactly the same words to make fun of Ishige a few moments ago. ‘Wow, Asami, that plate’s a Ron Babarontic, isn’t it?’ Mika suddenly whooped in delight at the sight of a dish of fruit Asami had placed on the table. It was earth-coloured with a cord pattern, reminiscent of prehistoric Jōmon pottery. ‘How cool is that? Even a flat dish from this series costs about half-a-million yen, doesn’t it?’ ‘It really livens up a dining table, doesn’t it! I wish I could afford Ron Babarontic too.’ ‘What’s a Ron Babaro"
