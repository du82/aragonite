["https://granta.com/explore"]
title = "Granta | The Home of New Writing"
description = "From Nobel laureates to debut novelists, international translations to investigative journalists, Granta publishes the best new literary writing and art."
full_description = '''Explore Sort by: Date of publication (newest first) Date of publication (oldest first) Name of title (alphabetical) Name of author (alphabetical) Issue 170 Podcast | Declan Ryan Declan Ryan ‘Some of these bigger characters, Muhammad Ali or Lennox Lewis, they can become these mythologic, mythological characters, or these godlike figures.’Declan Ryan on contemporary boxing. Issue 170 Introduction Thomas Meaney ‘Everybody knows a game is not worth watching unless the players are trying to win.’ Thomas Meaney introduces the issue. if (window.innerWidth <= 600) { var aj_dim = 514841; } else { var aj_dim = '514840,514841'; }; aj_server = 'https://litbreaker.nui.media/pipeline/'; aj_tagver = '1.0'; aj_zone = 'litbreaker'; aj_adspot = '519067'; aj_page = '0'; aj_ch = ''; aj_kw = ''; aj_pv = true; aj_click = ''; Issue 170 A Good Day Caryl Churchill ‘I suddenly had one of those I can’t find words for it one of those moments of joy I suppose it is.’ Fiction by Caryl Churchill. Issue 170 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="explore-result__subscribe-padlock" alt="padlock"> Real Tennis Clare Bucknell ‘Real tennis players like to say that theirs is the only proper racket sport because the rest aren’t difficult enough.’ Clare Bucknell on a historical form of tennis. Issue 170 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="explore-result__subscribe-padlock" alt="padlock"> Events Ashore An-My Lê ‘Designed to face down conventional enemies, it hasn’t won a war since 1991.’ An-My Lê photographs the United States military, introduced by Granta. Issue 170 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="explore-result__subscribe-padlock" alt="padlock"> Mucker Play Nico Walker ‘When you said so loudly that you were the best, that you were worth the top dollar, then not just every game but every play became important.’ Nico Walker on the rise and fall of American football, from Jim Thorpe to Deion Sanders. Issue 170 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="explore-result__subscribe-padlock" alt="padlock"> Round One Benjamin Nugent ‘On the day the doctors extracted the eggs from her ovaries, he would have to go into a room in the hospital and produce.’ Fiction by Benjamin Nugent. Issue 170 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="explore-result__subscribe-padlock" alt="padlock"> England’s Other Island Owen Hatherley & Tereza Červeňová ‘A Victorian summer utopia perpetually falling into dereliction and desuetude.’ Owen Hatherley on the Isle of Wight, with photography by Tereza Červeňová. Issue 170 Appendix K Patrick ‘The appendix appeared. Half of it already distended, deep maroon, a twisted and flashing smile.’Fiction by K Patrick. Issue 170 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="explore-result__subscribe-padlock" alt="padlock"> Troubadour Edward Salem ‘There were always too many white activists and upper-class European NGO workers, foreign queers and queer adjacents who were there for the anecdote, hoping to bed a native before their visa ended.’Fiction by Edward Salem. Issue 170 Bombed in Beirut Myriam Boulos ‘What to do as a photographer in a war where even simple family portraits have become trophies?’Myriam Boulos photographs displaced workers in Beirut. Issue 170 The Hurt Business Declan Ryan ‘Honour, or anything approaching it, sits vanishingly low on the priority list.’Declan Ryan on boxing and the fight between Anthony Joshua and Daniel Dubois. Issue 170 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="explore-result__subscribe-padlock" alt="padlock"> The First Person Kathryn Scanlan ‘I picked up a dry leaf, and when the caterpillar climbed aboard, I carried the leaf to the safety of the grass and set it down at the base of a tree.’Fiction by Kathryn Scanlan. Issue 170 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="explore-result__subscribe-padlock" alt="padlock"> Champion Prarthna Singh & Snigdha Poonam ‘As Prarthna took photographs, I stood in the doorway watching the school-age girls with taut muscles and intense focus lock in bouts across the length of the hall.’Snigdha Poonam on wrestling and the photography of Prarthna Singh. 12345Next→'''
