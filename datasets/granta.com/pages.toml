["https://granta.com/knives"]
title = "Knives | Louise Erdrich | Granta Magazine"
description = "‘It is time, now, for Karl to break down with his confession that I am a slow-burning fuse in his loins. A hair trigger. I am a name he cannot silence. A dream that never burst.’ Fiction by Louise Erdrich."
full_description = "Knives Louise Erdrich if (window.innerWidth <= 600) { var aj_dim = 514841; } else { var aj_dim = '514840,514841'; }; aj_server = 'https://litbreaker.nui.media/pipeline/'; aj_tagver = '1.0'; aj_zone = 'litbreaker'; aj_adspot = '519067'; aj_page = '0'; aj_ch = ''; aj_kw = ''; aj_pv = true; aj_click = ''; He is fine-boned, slick, agreeable, and dressed to kill in his sharp black suit, winey vest, knotted brown tie. His hair is oiled. His lips are fevered and red as two buds. For a long while he stands there, eyeing me, before he opens his mouth. ‘You’re not pretty,’ are the first words he speaks. And I, who have never bit off my words even to a customer, am surprised into a wounded silence, although I don’t look in the mirror for pleasure, but only to take stock of the night’s damage. I work for Mary, who learned the butcher’s trade and keeps a rundown shop on the edge of Argus, a town in which I’ve found no hope of marriage. I get along with men. I work right beside them in the cutting room and keep a long tally of the card debts they owe me. But this is not romance. In the novels I read at night, I experience with no satisfaction the veiled look, the guarded approach, the hungers I’ve come to live with in my thirties. I get heavier each year that no one sweeps me off my feet, so that now I outweigh most men. And perhaps I am too much like them, too strong and imposing when I square my shoulders, and used to taking control. I am standing on a stool, changing the prices I chalk above the counter each week on a piece of slate. Blutwurst. Swedish sausage. Center-cut chops. Steak. I keep writing and do not give him the satisfaction of an answer. He stands below me, waiting. He has the patience of a cat with women. When I finish, there is nothing left for me to do but climb down. ‘But pretty’s not the only thing,’ the man continues smoothly, as though all my silence has not come between. I cut him off. ‘Tell me what you want,’ I say. ‘I’m closing shop.’ ‘I bet you never thought I’d come back,’ he says. He steps close to the glass counter full of meats. I can see, through the false, bright glare inside the case, his dumbell-lifting chest. His sharp, thick hands. Even above the white pepper and sawdust of the shop, I can smell the wildroot, tobacco, penetrating breath-mint. ‘I never saw you the first time,’ I tell him. ‘I’m closing.’ ‘Look here,’ he says, ‘Mary . . .’ ‘I’m not Mary.’ He goes rigid, puts his hand to the back of his skull, pats the hair in place thoughtfully. ‘Who are you then?’ ‘Celestine,’ I say, ‘as if it’s any of your business.’ I have to ring out the register, secure the doors, set the alarm on the safe before I can walk home. Around that time of early evening the light floods through the thick block-glass windows, a golden light that softens the shelves and barrels. Dusk is always my time, that special air of shifting shapes, and it occurs to me that, even though he says I am not pretty, perhaps in the dusk I am impossible to resist. Perhaps there is something about me, like he says. ‘Adare. Karl Adare.’ He introduces himself without my asking. He crosses his arms on the counter, leans over, and deliberately smiles at my reaction. His teeth are small, shiny, mother-of-pearl. ‘This is something,’ I say. ‘Mary’s brother.’ ‘She ever talk about me?’ ‘No,’ I have to answer, ‘and she’s out on a delivery right now. She won’t be back for a couple of hours.’ ‘But you’re here.’ I guess my mouth drops a little. Me knowing who he is has only slightly diverted what seems like his firm intentions, which are what? I can’t read him. I turn away from him and make myself busy with the till, but I am fumbling. I turn to look at Karl. His eyes are burning holes and he tries to look right through me if he can. This is, indeed, the way men behave in the world of romance. Except that he is slightly smaller than me, and also Mary’s brother. And then there is his irritating refrain. ‘Pretty’s not everything,’ he says to me again. ‘You’re built . . .’ He stops, trying to hide his confusion. But his neck reddens and I think maybe he is no more experienced at this than I. ‘If you curled the ends at least,’ he says, attempting to recover, ‘if you cut your hair. Or maybe it’s the apron.’ I always wear a long white butcher’s apron, starched and swaddled around my middle with thick straps. Right now, I take it off, whip it around me, and toss it on the radiator. I decide I will best him at his game, as I have studied it in private, have thought it out. ‘All right,’ I say, walking around the counter. ‘Here I am.’ Because of the market visit I am wearing a navy-blue dress edged in white. I have a bow at my waist, black shoes, and a silver necklace. I have always thought I looked impressive in this outfit, not to be taken lightly. Sure enough, his eyes widen. He looks stricken and suddenly uncertain of the next move, which I see is mine to make. ‘Follow me,’ I say, ‘I’ll put a pot of coffee on the stove.’ It is Mary’s stove, of course, but she will not be back for several hours. He does not follow me directly, but lights a cigarette. He smokes the heavy kind, not my brand any more. The smoke curls from his lips. ‘You married?’ he asks. ‘No,’ I say. He drops the cigarette on the floor, crushes it out with his foot, and then picks it up and says, ‘Where shall I put this?’ I point at an ashtray in the hall, and he drops the butt in. Then, as we walk back to Mary’s kitchen, I see that he is carrying a black case I have not noticed before. We are at the door of the kitchen. It is dark. I have my hand on the light switch and am going to turn on the fluorescent ring, when he comes up behind me, puts his hands on my shoulders, and kisses the back of my neck. ‘Get away from me,’ I say, not expecting this so soon. First the glances, the adoration, the many conversations must happen. ‘How come?’ he asks. ‘This is what you want.’ His voice shakes. Neither one of us is in control. I shrug his hands off. ‘What I want.’ I repeat this stupidly. Love stories always end here. I never had a mother to tell me what came next. He steps in front of me and hugs me to himself, draws my face down to his face. I am supposed to taste a burning sweetness on his lips, but his mouth is hard as metal. I lunge from his grip, but he comes right with me. I lose my balance. He is fighting me for the upper hand, straining down with all his might, but I am more than equal to his weightlifting arms and thrashing legs. I could throw him to the side, I know, but I grow curious. There is the smell of corn mash, something Mary has dropped that morning. That’s what I notice even when it happens and we are together, rolling over, clasped, bumping into the legs of the table. I move by instinct, lurching under him. We’re held in my mind as in a glass, and I see my own face, amused, embarrassed, and relieved. It is not so complicated, not even as painful, as I feared, and it doesn’t last long either. He sighs when it is over, his breath hot and hollow in my ear. ‘I don’t believe this happened,’ he says to himself. That is, oddly, when I lash out against his presence. He is so heavy that I think I might scream in his face. I push a chest, a dead weight, and then I heave him over so he sprawls in the dark away from me, so I can breathe. We smooth our clothing and hair back so carefully, in the dark, that when we finally turn the light on and blink at the place where we find ourselves, it is as though nothing has happened. We are standing up, looking anyplace but at each other. ‘How about that coffee?’ he says. I turn to the stove. And then, when I turn around again with the coffee-pot, I see that he is unlatching a complicated series of brass fittings that unfold his suitcase into a large stand-up display. He is absorbed, one-minded, not too different from the way he was down on the floor. The case is lined in scarlet velvet. Knives gleam in the plush. Each rests in a fitted compartment, the tips capped so as not to pierce the cloth, the bone handles tied with small strips of pigskin leather. I sit down. I ask what he is doing but he does not answer, only turns and eyes me significantly. He holds out a knife and a small rectangle of dark wood. ‘You can slice,’ he begins, ‘through wood, even plaster, with our serrated edge. Or . . .’ he produces a pale dinner roll from his pocket, ‘the softest bread.’ He proceeds to demonstrate, sawing the end off the block of balsa wood with little difficulty, then delicately wiggling the knife through the roll so it falls apart in transparent, perfect ovals. ‘You could never butter those,’ I hear myself say, ‘they’d fall apart.’ ‘It’s just as good with soft-skinned vegetables,’ he says to the air. ‘Fruits. Fish fillets.’ He is testing the edge of the knife. ‘Feel,’ he says, holding the blade toward me. I ignore him. One thing I know is knives and his are cheap-john, not worth half the price of the fancy case. He keeps on with his demonstration, slicing bits of cloth, a very ripe tomato, and a box of ice cream from Mary’s freezer. He shows each knife, one after the other, explaining its usefulness. He shows me the knife sharpener and sharpens all Mary’s knives on its wheels. The last thing he does is take out a pair of utility shears. He snips the air with them as he speaks. ‘Got a penny?’ he asks. Mary keeps her small change in a glass jar on the windowsill. I take out a penny and lay it on the table. And then, in the kitchen glare, Karl takes his scissors and cuts the penny into a spiral. So, I think, this is what happens after the burning kiss, when the music roars. Imagine. The lovers are trapped together in a deserted mansion. His lips descend. She touches his magnificent thews. ‘Cut anything,’ he says, putting the spiral beside my hand. He begins another. I watch the tension in his fingers, the slow frown of enjoyment. He puts another perfect spiral beside the first. And then, since he looks as though he might keep on going, cutting all the pennies in the jar, I decide that I now have seen what love is about. ‘Pack up and go,’ I tell him. But he only smiles and bites his lip, concentrating on the penny that uncoils in his hands. He will not budge. I can sit here watching the man and his knives, or call the police. But neither of these seems like a suitable ending. ‘I’ll take it,’ I say, pointing at the smallest knife. In one motion he unlatches a vegetable parer from its velvet niche and sets it between us on the table. I dump a dollar in change from the penny-ante jar. He snaps the case shut. I handle my knife. It is razor sharp, good for cutting the eyes from potatoes. But he is gone by the time I have formed the next thought. In my stories, they return as a matter of course. So does Karl. There is something about me he has to follow. He doesn’t know what it is and I can’t tell him either, but not two weeks go by before he breezes back into town, still without ever having seen his sister. I see my brother Russell all the time. I live with him. Russell looks outside one morning and sees Adare straddling the chubstone walk to our house. ‘It’s a noodle,’ says Russell. I glance out the window over his shoulder, and see Karl. ‘I’ve got business with him,’ I say. ‘Answer the door then,’ Russell says. ‘I’ll get lost.’ He walks out the back door with his tools. The bell rings twice. I open the front door and lean out. ‘I can’t use any,’ I say. The smile falls off his face. He is confused a moment, then shocked. I see that he has come to my house by accident. Maybe he thought that he would never see me again. His face is what decides me that he has another think coming. I am standing there in layers of flimsy clothing with a hammer in my hand. I can tell it makes him nervous when I ask him in, but he thinks so much of himself that he can’t back down. I pull a chair out, still dangling the hammer, and he sits. I go into the kitchen and fetch him a glass of the lemonade I have been smashing the ice for. I half expect him to sneak out, but when I return he is still sitting there, the suitcase humbly at his feet, an oily black fedora on his knees. ‘So, so,’ I say, taking a chair beside him. He has no answer to my comment. As he sips on the lemonade, however, he glances around, and seems slowly to recover his salesman’s confidence. ‘How’s the paring knife holding out?’ he asks. I just laugh. ‘The blade snapped off the handle,’ I say. ‘Your knives are duck-bait.’ He keeps his composure somehow, and slowly takes in the living-room with his stare. When my ceramics, books, typewriter, pillows and ashtrays are all added up, he turns to the suitcase with a squint. ‘You live here by yourself?’ he asks. ‘With my brother.’ ‘Oh.’ I fill his lemonade glass again from my pitcher. It is time, now, for Karl to break down with his confession that I am a slow-burning fuse in his loins. A hair trigger. I am a name he cannot silence. A dream that never burst. ‘Oh well . . .’ he says. ‘What’s that supposed to mean?’ I ask. ‘Nothing.’ We sit there for a while collecting dust until the silence and absence of Russell from the house grows very evident. And then, putting down our glasses, we walk up the stairs. At the door to my room, I take the hat from his hand. I hang it on my doorknob and beckon him in. And this time, I have been there before. I’ve had two weeks to figure out the missing areas of books. He is shocked by what I’ve learned. It is like his mind darkens. Where before there was shuffling and silence, now there are cries. Where before we were hidden, now the shocking glare. I pull the blinds up. What we do is well worth a second look, even if there are only the squirrels in the box-elders. He falls right off the bed once, shaking the whole house. And when he gets up he is spent, in pain because of an aching back. He just lays there. ‘You could stay on for supper,’ I finally offer, because he doesn’t seem likely to go. ‘I will.’ And then he is looking at me with his eyes in a different way, as if he cannot figure the sum of me. As if I am too much for him to compass. I get nervous. ‘I’ll fix the soup now,’ I say. ‘Don’t go.’ His hand is on my arm, the polished fingernails clutching. I cannot help but look down and compare it with my own. I have the hands of a woman who has handled too many knives, deep-nicked and marked with lines, toughened from spice and brine, gouged, even missing a tip and nail. ‘I’ll go if I want,’ I say. ‘Don’t I live here?’ And I get up, throwing a house-coat and sweater over myself. I go downstairs and start a dinner on the stove. Presently, I hear him come down, feel him behind me in the doorway, those black eyes in a skin white as veal. ‘Pull up a chair,’ I say. He settles himself heavily and drinks down the highball I give him. When I cook, what goes into my soup is what’s there. Expect the unexpected, Russell always says. Butter beans and barley. A bowl of fried rice. Frozen oxtails. All this goes into my pot. ‘Godalmighty,’ says Russel"
