0.jpg" class="recommended-reads__item__image wp-post-image" alt="" decoding="async" /> Doing the Work ‘Every part of you would swell, including your eyeballs, and no matter how much water you drank, you were always dehydrated.’ Junot Díaz on working for a steel mill. <img aria-hidden decoding="async" src="https://litbreaker.nui.media/pipeline/665458/0/vc?z=litbreaker&amp;dim=514841&amp;kw=&amp;click=" alt="" width="300" height="250" border="0" /> Please check your email to confirm your subscription to our newsletter. Subscribe to the Granta newsletters Subscribe Emily Berry Emily Berry is the author of three poetry books published by Faber: Unexhausted Time (2022), Stranger, Baby (2017) and Dear Boy (2013). Her lyric essay, 'The Secret Country of Her Mind' appears in the artist's book Many Nights (2021) by Jacqui Kenny. More about the author →'''
