["https://granta.com/submissions"]
title = "Granta | The Home of New Writing"
description = "Find out how to submit to Granta Magazine here. Granta accepts submissions of non-fiction, fiction and poetry in several windows every year."
full_description = 'Granta is committed to championing new voices and is open to unsolicited submissions of fiction and non-fiction. We consider all submissions for both print and online publication. We charge a fee of £3.50 for full-length prose submissions, equivalent to printing and postage. You can claim the costs of submission to Granta against any new subscription to the magazine. During every opening period, we offer 200 free submissions to authors on low incomes. If you are a low-income writer and would like to apply for free entry, please read our guidelines for low-income entry below. We are committed to offering a home to writing by those who are marginalised or underrepresented. We welcome submissions by writers of colour; writers who are working class or on low incomes; writers who are queer, transgender, non-binary and gender-nonconforming; writers with disabilities; as well as any writer who feels that they or their story are underrepresented. Guidelines We will be open for non-fiction and fiction submissions during the following periods in 2025: 1 March – 31 March 1 June – 30 June 1 September – 30 September 1 December – 31 December We are currently closed for poetry submissions but we aim to re-open soon. Submissions can be made from 10 a.m. UK time on the opening day until midnight UK time on the closing day. Please submit only one complete story or essay at a time. You can submit once in each genre but please do not send multiple submissions of a single genre. All submissions will be considered for both our print and online editions, unless you specifically state otherwise in your cover letter. We only publish original material, i.e. first-ever publication. We cannot run a piece that has already appeared on the web or elsewhere in print. We can, however, publish an original translation if the work has previously appeared in another language, but never before in English. We have no set maximum length or minimum length, though most of our submissions are between 3,000-6,000 words. Please include a cover letter stating where your work has been published before, if relevant. Please do not submit academic essays or reviews. Granta Books does not accept unsolicited book proposals. Please do not submit book manuscripts. Please only submit work written in English. Please use double-spacing for prose. For poetry, please use whatever spacing best represents your work. If you are a low-income writer and would like to apply for free entry, please click through to this page for low-income entry guidelines. Please note that we are not in a position to comment on your work. We receive a significant number of submissions every day, many of which may be unsuitable for Granta, however well written. If you are waiting to hear back about a previous submission, please rest assured that we are still reading and you will receive a response as soon as possible. If you have a question that is not answered by the above, please refer to our frequently asked questions page. We encourage to all who submit that they read recent issues of Granta to familiarise themselves with material the magazine has published. Subscriptions are available here. <img aria-hidden decoding="async" class="alignnone wp-image-11264 nolazy" src="https://granta.com/wp-content/uploads/2015/01/Self-for-site1.jpg" alt="Self for site" width="460" height="188" srcset="https://granta.com/wp-content/uploads/2015/01/Self-for-site1.jpg 429w, https://granta.com/wp-content/uploads/2015/01/Self-for-site1-200x82.jpg 200w, https://granta.com/wp-content/uploads/2015/01/Self-for-site1-397x162.jpg 397w, https://granta.com/wp-content/uploads/2015/01/Self-for-site1-300x122.jpg 300w" sizes="(max-width: 460px) 100vw, 460px" /> If you are ready to submit your work, please visit our online submission system.'
