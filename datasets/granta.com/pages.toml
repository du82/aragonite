full_description = 'Sayaka Murata One of the most celebrated of the new generation of Japanese writers, Sayaka Murata has won not only the prestigious Akutagawa Prize, but the Gunzo, Noma, and Mishima Yukio Prizes as well. Her story, ‘A Clean Marriage’, was featured in Granta 127 Japan. She is 36-years-old and works part-time in a convenience store. Coming soon - April 2025 Vanishing World Sayaka Murata Amane is ten years old when she discovers she’s not like everyone else. Her school friends were all conceived the normal way, by artificial insemination, and raised in the normal way, by parents in ‘clean’, sexless marriages. But Amane’s parents committed the ultimate taboo: they fell in love, had sex and procreated. As Amane grows up and enters adulthood, she does her best to fit in and live her life like the rest of society: cultivating intense relationships with anime characters, and limiting herself to extra-marital sex, as is the norm. Still, she can’t help questioning what sex and marriage are for. But when Amane and her husband hear about Eden, an experimental town where residents are selected at random to be artificially inseminated en masse (including men who are fitted with artificial wombs), the family unit does not exist and children are raised collectively and anonymously, they decide to try living there. But can this bold experiment build the brave new world Amane desires, or will it push her to breaking point? £16.99 Pre-Order Hive <img class="outside_sales__arrow" alt="arrow" src="https://granta.com/wp-content/themes/granta/img/gr_link_arrow.svg" />Foyles <img class="outside_sales__arrow" alt="arrow" src="https://granta.com/wp-content/themes/granta/img/gr_link_arrow.svg" />Waterstones <img class="outside_sales__arrow" alt="arrow" src="https://granta.com/wp-content/themes/granta/img/gr_link_arrow.svg" />Amazon <img class="outside_sales__arrow" alt="arrow" src="https://granta.com/wp-content/themes/granta/img/gr_link_arrow.svg" />Blackwells <img class="o