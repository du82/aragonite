title = "Granta | The Home of New Writing"
description = "Whenever a job vacancy arises at Granta we will post details on this page. In..."
full_description = "Whenever a job vacancy arises at Granta we will post details on this page. In addition, we usually advertise in the Bookseller and occasionally in the Guardian. Unfortunately, due to the high number of enquiries we receive, we cannot respond to speculative applications. Financial Controller (Maternity Cover) We are looking to appoint a driven, highly organised Financial Controller for a fixed term maternity cover of up to 13 months with an ideal start date of late May 2025. This role will include the responsibility of managing all aspects of financial reporting and management accounting, maintaining strong financial controls and supporting the senior leadership team with key financial insights. This role is hands on and ideal for someone who enjoys managing both day to day financial processes and strategic financial planning. The Financial Controller (Maternity Cover) reports to the Managing Director of Granta Publications. Key duties and responsibilities include: – Preparation of regular management accounts, including all underlying journals and reconciliations, for both Granta Publications and Granta Trust – Presentation of the results to managing directors at the monthly finance meetings – Preparation for the annual audit and taking the lead dealing with the auditors – Overseeing transactional processing and managing the finance assistant – Business planning, including preparation and presentation of annual budgets, monitoring of performance against budgets and variance analysis – Cash flow management to ensure sufficient funds are available to carry out Granta’s activities as well as managing relationships with banks and our business owner – Assisting with the production of bi-annual author royalty statements and payment of royalties due – Leading the finance related HR duties including payroll, pensions, HR contracts, insurance policies and employee benefits – Managing the Granta IT department employee and having regular meetings with the office manager in order to assist on finance related office duties Required qualities and skills: • A university degree and a recognised professional accounting qualification • Experience in a publishing house would be desirable, but is not essential • Minimum of three years’ post qualification experience • Excellent attention to detail • Strong communication and team-working skills, with the ability to build good relations, both internally and externally • A self-starter, capable of working independently • Capable of rapid and accurate turn around on a high workload and multiple tasks. Granta offers a blend of home and office working, with three days in the office, two of which must be Tuesday and Thursday. Granta is committed to employing a diverse workforce, and we welcome applications from people of all backgrounds and with different kinds of life experience. We encourage those who are under-represented within the industry to consider applying for a role at our company. Salary: £65,000-£70,000 based on experience To apply, please send a CV and covering letter to [email protected]. The closing date for applications is 24 Feb 2025."
