full_description = '''Christmas in Bavaria Jan Bogaerts Art & Photography Granta 34 14th November 1990 facebook-with-circle Created with Sketch. twitter-with-circle Created with Sketch. mail-with-circle Created with Sketch. if (window.innerWidth <= 600) { var aj_dim = 514841; } else { var aj_dim = '514840,514841'; }; aj_server = 'https://litbreaker.nui.media/pipeline/'; aj_tagver = '1.0'; aj_zone = 'litbreaker'; aj_adspot = '519067'; aj_page = '0'; aj_ch = ''; aj_kw = ''; aj_pv = true; aj_click = ''; Bergtesgaden was, for some time, the home town of both Adolf Hitler and Dieter Eckhardt, the father of national socialism. It is a small place in Bavaria not far from the Austrian border. I did not live through the last war, but I was interested in seeing if there was something about this particular place that could have created two such men. <img class="img-fluid" src="https://granta.com/wp-content/uploads/2024/03/Granta-1-adverts_Banner_970x250.jpg" alt="Subscribe to Granta" width="1108" height="476" /> <img class="article-subscribe-padloack" src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" alt="Subscribe to Granta today" /> To read this in full, take out a subscription to Granta. Over forty years of new writing at your fingertips – subscribe now. <img class="article-subscribe-padloackunlocked" src="https://granta.com/wp-content/themes/granta/img/open-lock.png" alt="Login to your account" /> Sign in to Granta.com. Art & Photography Granta 34 14th November 1990 facebook-with-circle Created with Sketch. twitter-with-circle Created with Sketch. mail-with-circle Created with Sketch. if (window.innerWidth <= 600) { var aj_dim = 514841; } else { var aj_dim = '514840,514841'; }; aj_server = 'https://litbreaker.nui.media/pipeline/'; aj_tagver = '1.0'; aj_zone = 'litbreaker'; aj_adspot = '519067'; aj_page = '0'; aj_ch = ''; aj_kw = ''; aj_pv = true; aj_click = ''; Jan Bogaerts Jan Bogaerts lives in the Netherlands; he is currently working on a photographic