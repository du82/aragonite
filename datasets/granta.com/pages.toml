description = "The team at Granta works to alleviate pressure on the environment in the following ways:..."
full_description = "The team at Granta works to alleviate pressure on the environment in the following ways: Sustainable Packaging We store and reuse the packaging we receive to minimise our consumption of new material. We use 100% recyclable packaging when sending out products and we aim to eliminate single-use plastics wherever possible. We minimise the amount of packaging we use per product. In-office Practice We use low-energy LED lighting and keep lights and other electronic appliances switched off whenever they are not in use to reduce electricity consumption. We use recycled paper whenever possible and minimise the amount that we print. We use eco-friendly cleaning products. We strive to communicate digitally whenever this is feasible, reducing letters, invoices, and advertisements transmitted on paper. We use local suppliers for office equipment to minimise transport and delivery. We recycle old IT equipment. All staff use sustainable travel options (walking, cycling, taking public transport) to commute to the office, and our work-from-home strategy minimises the amount of necessary travel. Our cycle-to-work scheme encourages staff to commute by bicycle. We use FSC-certified materials to produce our books. Charity Books We donate old and damaged books to charities and schools rather than recycling them. If you are an organisation seeking book donations, please contact: [email protected] External Relations We work closely with companies that have their own established green policies: CPI: prints our books. Click here for further information on CPI’s sustainability practices. Air Business ~ stores and supplies our magazine issues: Click here to see their Sustainability Report. Our Green Granta Books We publish and support the voices of those who advocate for the protection of the environment and bring attention to the current climate crisis: Birnam Wood by Eleanor Catton Sarn Helen by Tom Bullough A Trillion Trees by Fred Pearce The Planet Remade by Oliver Morton Choked by Beth Gardiner Handmade by Siri Helle Grounding by Lula Ellender Wild Maps by Mike Higgins Wild Child by Patrick Barkham The Wild Places by Robert Macfarlane"
