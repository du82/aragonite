full_description = '''To stay up to date with our latest releases, follow Granta Books on facebook Created with Sketch. Facebook, twitter Created with Sketch. Twitter and instagram Created with Sketch. Instagram. Winner of the 2024 Nobel Prize in Literature The Vegetarian Han Kang WINNER OF THE 2024 NOBEL PRIZE IN LITERATURE ’Sensual, provocative and violent...an extraordinary experience’ - Guardian Yeong-hye and her husband are ordinary people - dutiful wife and mild-mannered office worker. One day, prompted by grotesque recurring nightmares, Yeong-hye decides to become a vegetarian. But in South Korea, where vegetarianism is almost unheard-of and societal mores are strictly obeyed, it is a shocking act of subversion. Yeong-hye’s passive rebellion rapidly manifests in ever more bizarre and frightening forms, from sexual sadism to attempted suicide, and in increasingly erotic and unhinged artworks, as all the while she spirals further into her fantasies... Disturbing and beautiful by turns, The Vegetarian is a revelatory novel about modern day South Korea; a tale of shame, desire and our faltering attempts to understand others. £8.99 Buy Now Hive <img class="outside_sales__arrow" alt="arrow" src="https://granta.com/wp-content/themes/granta/img/gr_link_arrow.svg" />Amazon <img class="outside_sales__arrow" alt="arrow" src="https://granta.com/wp-content/themes/granta/img/gr_link_arrow.svg" />Blackwells <img class="outside_sales__arrow" alt="arrow" src="https://granta.com/wp-content/themes/granta/img/gr_link_arrow.svg" /> Fiction In Translation The Vegetarian Han Kang £8.99 Fiction In Translation Human Acts Han Kang £9.99 Fiction In Translation The White Book Han Kang £9.99 Latest Releases View all → Books Beartooth Callan Wink £14.99 Books Under a Metal Sky Philip Marsden £20.00 Books Under the Eye of the Big Bird Hiromi Kawakami £14.99 Books And the Walls Became the World All Around Johanna Ekström,Sigrid Rausing £16.99 Books In Writing Hattie Crisell £16.99 Books Sug