description = "K Patrick is a poet and fiction writer based in Scotland.Their debut novel, Mrs S,..."
full_description = 'K Patrick K Patrick is a poet and fiction writer based in Scotland.Their debut novel, Mrs S, was published in 2023, and their poetry collection, Three Births, in 2024. Publications Three Births K Patrick An interrogation of the erotic and romantic becomes refracted, as though through a prism, towards beings, lovers, states, objects, landscapes, systems, in K Patrick’s ground-breaking debut book of poems. These are notes towards a contemporary queer experience that emerge from the body, dodging and playing with logic to create a brand new poetics. Patrick’s subversive and distinct poetic manoeuvres through a marriage and a subsequent divorce, nature writing and 20th Century literary figures with agility, delicacy, candour, and humour. By turns both innovative and empathetic, Three Births documents the absurdity of obsessive desires, giving room to states of flux and flow in the body, relationships, ecology and place. George Michael, the history of inches, the ache that lives behind a ‘rigid seam’: a high-wire linguistic utopia is put forward in Patrick’s easy-going, cool and ironic tone, which zaps with syntactic-synaptic wildness. Three Births culminates in the subtle but powerful message that we should be able to inhabit the body we want to inhabit and love freely within this. £12.99 Buy Now K Patrick on Granta.com Fiction | Issue 170 Fiction | Issue 170 Appendix K Patrick ‘The appendix appeared. Half of it already distended, deep maroon, a twisted and flashing smile.’Fiction by K Patrick. In Conversation | The Online Edition In Conversation | The Online Edition In Conversation Robert Gluck & K Patrick ‘Desire charges the landscape with physical upheaval. We become water, weather. And why not? Why describe a character by the hat she is wearing instead of her experience of orgasm?’Robert Glück and K Patrick on writing desire. Poetry | Issue 166 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Poetry | Issue 166 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> David Attenborough K Patrick ‘Motherhood is this chapter, / we all love a mother, / disastrous as it is.’Poetry by K Patrick. Poetry | The Online Edition Poetry | The Online Edition Blood comedy K Patrick ‘Stopping has become a mutual desire. The things we want to stop. Mostly sounds of other people.’ A poem by K Patrick. Fiction | Issue 163 Fiction | Issue 163 Mrs S K Patrick ‘Without waiting for me she removes her white shirt. Each button a piece of my own spine, undone.’An extract from Mrs S by K Patrick. Poetry | Issue 161 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Poetry | Issue 161 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> George K Patrick ‘Like the way George / Michael filled his jeans. Mothers like a man who can / fill his jeans.’ A poem by K Patrick. Essays & Memoir | The Online Edition Essays & Memoir | The Online Edition Notes on Craft K Patrick ‘I don’t know anything except my own body. When writing poetry, that’s the only place I can start from.’ K Patrick on writing the queer body.'
