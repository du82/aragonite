["https://granta.com/events-ashore"]
title = "Events Ashore | An-My Lê | Granta"
description = "‘Designed to face down conventional enemies, it hasn’t won a war since 1991.’ An-My Lê photographs the United States military."
full_description = '''Events Ashore An-My Lê Art & Photography Granta 170 27th February 2025 facebook-with-circle Created with Sketch. twitter-with-circle Created with Sketch. mail-with-circle Created with Sketch. if (window.innerWidth <= 600) { var aj_dim = 514841; } else { var aj_dim = '514840,514841'; }; aj_server = 'https://litbreaker.nui.media/pipeline/'; aj_tagver = '1.0'; aj_zone = 'litbreaker'; aj_adspot = '519067'; aj_page = '0'; aj_ch = ''; aj_kw = ''; aj_pv = true; aj_click = ''; For nine years, the photographer An-My Lê tracked her prey: the United States military. Designed to face down conventional enemies, it hasn’t won a war since 1991. Still, it remains the most visually impressive fighting force in the world. Lê’s photographs possess a disarming lucidity, but with a twist that makes peculiar demands on the viewer. Her images from Events Ashore allow the pristine idealism of the military recruits to sit alongside the acknowledgment of the extraordinary violence her subjects have been trained to inflict. <img class="img-fluid" src="https://granta.com/wp-content/uploads/2024/03/Granta-1-adverts_Banner_970x250.jpg" alt="Subscribe to Granta" width="1108" height="476" /> <img class="article-subscribe-padloack" src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" alt="Subscribe to Granta today" /> To read this in full, take out a subscription to Granta. Over forty years of new writing at your fingertips – subscribe now. <img class="article-subscribe-padloackunlocked" src="https://granta.com/wp-content/themes/granta/img/open-lock.png" alt="Login to your account" /> Sign in to Granta.com. Art & Photography Granta 170 27th February 2025 facebook-with-circle Created with Sketch. twitter-with-circle Created with Sketch. mail-with-circle Created with Sketch. if (window.innerWidth <= 600) { var aj_dim = 514841; } else { var aj_dim = '514840,514841'; }; aj_server = 'https://litbreaker.nui.media/pipeline/'; aj_tagver = '1.0'; aj_zone = 'litbreaker'; aj_adspot = '519067'; aj_page = '0'; aj_ch = ''; aj_kw = ''; aj_pv = true; aj_click = ''; An-My Lê An-My Lê is a photographer primarily based in New York. Her work often addresses the impact of war on culture and the environment, and has been exhibited in the Whitney Biennial, the Metropolitan Museum of Art and the Tate Modern. More about the author → More on Granta.com Podcasts | Issue 170 Podcast | Declan Ryan Declan Ryan ‘Some of these bigger characters, Muhammad Ali or Lennox Lewis, they can become these mythologic, mythological characters, or these godlike figures.’Declan Ryan on contemporary boxing. Essays & Memoir | Issue 170 Introduction Thomas Meaney ‘Everybody knows a game is not worth watching unless the players are trying to win.’ Thomas Meaney introduces the issue. Fiction | Issue 170 A Good Day Caryl Churchill ‘I suddenly had one of those I can’t find words for it one of those moments of joy I suppose it is.’ Fiction by Caryl Churchill. Essays & Memoir | Issue 170 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock" alt="padlock"/> Real Tennis Clare Bucknell ‘Real tennis players like to say that theirs is the only proper racket sport because the rest aren’t difficult enough.’ Clare Bucknell on a historical form of tennis. Essays & Memoir | Issue 170 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock" alt="padlock"/> Mucker Play Nico Walker ‘When you said so loudly that you were the best, that you were worth the top dollar, then not just every game but every play became important.’ Nico Walker on the rise and fall of American football, from Jim Thorpe to Deion Sanders. Essays & Memoir | Issue 137 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock" alt="padlock"/> Diary of a Gulag Prison Guard Ivan Chistyakov ‘Freedom, even with hunger and cold, is still precious and irreplaceable.’'''
