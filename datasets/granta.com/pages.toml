["https://granta.com/amazon-adventure"]
title = "Amazon Adventure | Redmond O’Hanlon | Granta Magazine"
description = "‘I thought that a four-month journey in the country between the Orinoco River in Venezuela and the Amazon in Brazil would pose no particular problem.’"
full_description = '''Amazon Adventure Redmond O’Hanlon ‘Having spent two months travelling in the primary rain forests of Borneo, I thought that a four-month journey in the country between the Orinoco River in Venezuela and the Amazon in Brazil would pose no particular problem.’ Having spent two months travelling in the primary rainforests of Borneo, I thought that a four-month journey in the country between the Orinoco River in Venezuela and the Amazon in Brazil would pose no particular problem. I reread my nineteenth-century heroes: the seven volumes of Alexander von Humboldt’s Personal narrative of travels to the equinoctial regions of the New Continent during the years 1799–1804 (1814–29); William H. Edwards’s A Voyage up the River Amazon (1847); Alfred Russel Wallace’s A Narrative of Travels on the Amazon and Rio Negro (1853); Henry Walter Bates’s The Naturalist on the River Amazons (1863) and Richard Spruce’s Notes of a Botanist on the Amazon and Andes (1908). There are no leeches that go for you in the Amazon jungles, an absence which would represent, I felt, a great improvement on life in Borneo. But then there are many of the same amoebic and bacillary dysenteries, yellow and black water and dengue fevers, malaria, cholera, typhoid, rabies, hepatitis and tuberculosis – plus one or two very special extras. <img class="img-fluid" src="https://granta.com/wp-content/uploads/2024/03/Granta-1-adverts_Banner_970x250.jpg" alt="Subscribe to Granta" width="1108" height="476" /> <img class="article-subscribe-padloack" src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" alt="Subscribe to Granta today" /> To read this in full, take out a subscription to Granta. Over forty years of new writing at your fingertips – subscribe now. <img class="article-subscribe-padloackunlocked" src="https://granta.com/wp-content/themes/granta/img/open-lock.png" alt="Login to your account" /> Sign in to Granta.com. Essays & Memoir The Online Edition 1st December 1986 facebook-with-circle Created with Sketch. twitter-with-circle Created with Sketch. mail-with-circle Created with Sketch. Essays & Memoir The Online Edition 1st December 1986 facebook-with-circle Created with Sketch. twitter-with-circle Created with Sketch. mail-with-circle Created with Sketch. if (window.innerWidth <= 600) { var aj_dim = 514841; } else { var aj_dim = '514840,514841'; }; aj_server = 'https://litbreaker.nui.media/pipeline/'; aj_tagver = '1.0'; aj_zone = 'litbreaker'; aj_adspot = '519067'; aj_page = '0'; aj_ch = ''; aj_kw = ''; aj_pv = true; aj_click = ''; Doing the Work <img width="100" height="100" src="https://granta.com/wp-content/uploads/2024/10/grudova_doing-the-work-100x100.jpg" class="recommended-reads__item__image wp-post-image" alt="" decoding="async" /> Doing the Work ‘I think there should be a National Service of Hospitality. The best way to see the true face of humanity is to serve it a plate of chips.’ Camilla Grudova on bad-mannered customers. <img width="100" height="100" src="https://granta.com/wp-content/uploads/2024/10/blakemore-doing-the-work-100x100.jpg" class="recommended-reads__item__image wp-post-image" alt="" decoding="async" /> Doing the Work ‘Anyone who has ever worked night shifts will understand the vertiginous feeling that comes with staring down the day from the wrong end.’ A.K. Blakemore on working nights. <img width="100" height="100" src="https://granta.com/wp-content/uploads/2024/10/newman-header-100x100.png" class="recommended-reads__item__image wp-post-image" alt="" decoding="async" /> Doing the Work ‘I was constantly reading job ads, trying to find my holy grail – a job I could stand to do, and someone foolish enough to hire me.’ Sandra Newman on learning how to play professional blackjack. <img width="100" height="100" src="https://granta.com/wp-content/uploads/2024/10/Emily-Berry_-DtW-image-100x100.jpg" class="recommended-reads__item__image wp-post-image" alt="" decoding="async" /> Doing the Work ‘I loved being a receptionist. What I loved about it was playing the part of being a receptionist.’ Emily Berry on being a temporary office worker. <img width="100" height="100" src="https://granta.com/wp-content/uploads/2024/11/Diaz-100x100.jpg" class="recommended-reads__item__image wp-post-image" alt="" decoding="async" /> Doing the Work ‘Every part of you would swell, including your eyeballs, and no matter how much water you drank, you were always dehydrated.’ Junot Díaz on working for a steel mill. <img aria-hidden decoding="async" src="https://litbreaker.nui.media/pipeline/665458/0/vc?z=litbreaker&amp;dim=514841&amp;kw=&amp;click=" alt="" width="300" height="250" border="0" /> Please check your email to confirm your subscription to our newsletter. Subscribe to the Granta newsletters Subscribe Redmond O’Hanlon Redmond O’Hanlon is the author of Into the Heart of Borneo and In Trouble Again. More about the author →'''
