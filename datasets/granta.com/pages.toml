ibutor_related_padlock" alt="padlock"> Christmas in Bavaria Jan Bogaerts ‘Bergtesgaden was, for some time, the home town of both Adolf Hitler and Dieter Eckhardt, the father of national socialism.’ Fiction|Granta 34<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Fiction|Granta 34<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> The Great Santa Geoffrey Wolff ‘The Great Santa, like circumstance itself, blew hot and cold; He was all caprice, chance, crapshoot.’ Fiction|Granta 34<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Fiction|Granta 34<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> I’m a Mad Dog Biting Myself for Sympathy Louise Erdrich ‘I had never seen a child this little before, so small that it was not a child yet.’ Essays & Memoir|Granta 34 Essays & Memoir|Granta 34 Boys in Zinc Svetlana Alexievich ‘I was trying to present a history of feelings, not the history of the war itself.’ Fiction|Granta 34 Fiction|Granta 34 War Memories Peregrine Hodson ‘I said I thought it was difficult to judge the actions of war in peace because war and peace are different worlds.’ Essays & Memoir|Granta 34<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Essays & Memoir|Granta 34<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> An Egyptian in Baghdad Amitav Ghosh ‘It was exactly three weeks since Saddam Hussein had invaded Kuwait, and miraculously, Abu-Ali, the old shopkeeper, was on his feet.’ Art & Photography|Granta 34<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Art & Photography|Granta 34<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> The Suburbs of Cairo Fouad Elkoury Fouad Elkoury’s photographs of life in Cairo’s suburbs. Fiction|Granta 34 Fiction|Granta 34 Time’s Arrow (Part Two) Martin Amis ‘Nine nights later we woke up in the small hours and lay there coldly. “Shtib,” he grunted.’ Essays & Memoir|Granta 34<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> Essays & Memoir|Granta 34<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock single-contributor_related_padlock" alt="padlock"> In Soweto Jeremy Harding ‘Now, in the first light of the liberation, Soweto was opaque and murderous.’ var nav = document.querySelectorAll("[title=magazine]") for(i = 0; i < nav.length; i++){ nav[i].classList.add("--script-nav-active") }'
