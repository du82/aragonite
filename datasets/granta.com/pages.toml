description = "Granta is a literary magazine founded in 1889. Read the best new fiction, poetry, photography, and essays by famous authors, Nobel winners and new voices."
full_description = '''New Writing on Granta.com Essays & Memoir|Issue 170<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock three_quarter_carousel_padlock" alt="padlock"/> Mucker Play Nico Walker ‘When you said so loudly that you were the best, that you were worth the top dollar, then not just every game but every play became important.’ Nico Walker on the rise and fall of American football, from Jim Thorpe to Deion Sanders. Essays & Memoir|Issue 170<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock three_quarter_carousel_padlock" alt="padlock"/> Real Tennis Clare Bucknell ‘Real tennis players like to say that theirs is the only proper racket sport because the rest aren’t difficult enough.’ Clare Bucknell on a historical form of tennis. Fiction|Issue 170<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock three_quarter_carousel_padlock" alt="padlock"/> Troubadour Edward Salem ‘There were always too many white activists and upper-class European NGO workers, foreign queers and queer adjacents who were there for the anecdote, hoping to bed a native before their visa ended.’ Fiction by Edward Salem. Fiction|Issue 170<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock three_quarter_carousel_padlock" alt="padlock"/> The First Person Kathryn Scanlan ‘I picked up a dry leaf, and when the caterpillar climbed aboard, I carried the leaf to the safety of the grass and set it down at the base of a tree.’ Fiction by Kathryn Scanlan. Art & Photography|Issue 170<img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock three_quarter_carousel_padlock" alt="padlock"/> Events Ashore An-My Lê ‘Designed to face down conventional enemies, it hasn’t won a war since 1991.’ An-My Lê photographs the United States military, introduced by Granta. Granta 170: Winners Fiction | Issue 170 A Good Day Caryl Churchill ‘I suddenly had one of those I can’t find words for it one of those moments of joy I suppose it is.’ Fiction by Caryl Churchill. Essays & Memoir | Issue 170 The Hurt Business Declan Ryan ‘Honour, or anything approaching it, sits vanishingly low on the priority list.’Declan Ryan on boxing and the fight between Anthony Joshua and Daniel Dubois. <img aria-hidden decoding="async" src="https://litbreaker.nui.media/pipeline/664368/0/vc?z=litbreaker&dim=514841&kw=&click=" alt="" width="300" height="250" border="0" /> Fiction | Issue 170 Appendix K Patrick ‘The appendix appeared. Half of it already distended, deep maroon, a twisted and flashing smile.’Fiction by K Patrick. Fiction | Issue 170 The Dance Mircea Cărtărescu ‘In the center of the palace was the Exit, blocked by a ferocious guardian, whom none could pass.’Fiction by Mircea Cărtărescu, translated by Sean Cotter. Art & Photography | Issue 170 Bombed in Beirut Myriam Boulos ‘What to do as a photographer in a war where even simple family portraits have become trophies?’Myriam Boulos photographs displaced workers in Beirut. The Vegetarian Han Kang, translated by Deborah Smith Winner of the 2024 Nobel Prize in Literature Yeong-hye and her husband are ordinary people. He is an office worker with moderate ambitions and mild manners; she is an uninspired but dutiful wife. The acceptable flatline of their marriage is interrupted when Yeong-hye, seeking a more ‘plant-like’ existence, decides to become a vegetarian, prompted by grotesque recurring nightmares. In South Korea, where vegetarianism is almost unheard-of and societal mores are strictly obeyed, Yeong-hye’s decision is a shocking act of subversion. Her passive rebellion manifests in ever more bizarre and frightening forms, leading her bland husband to self-justified acts of sexual sadism. Fraught, disturbing and beautiful, The Vegetarian is a novel about modern day South Korea, but also a novel about shame, desire and our faltering attempts to understand others, from one imprisoned body to another. £8.99 Buy Now Hive <img class="outside_sales__arrow" alt="arrow" src="https://granta.com/wp-content/themes/granta/img/gr_link_arrow.svg" />Amazon <img class="outside_sales__arrow" alt="arrow" src="https://granta.com/wp-content/themes/granta/img/gr_link_arrow.svg" />Blackwells <img class="outside_sales__arrow" alt="arrow" src="https://granta.com/wp-content/themes/granta/img/gr_link_arrow.svg" /> From the Archive Fiction | Issue 68 Call If You Need Me Raymond Carver ‘She watched me as I wrote out a cheque for the three months’ rent. Later, back at the motel, in bed, she lay with her hand on her forehead and said, “I envy your wife.”’ Fiction by Raymond Carver. Fiction | Issue 19 Knives Louise Erdrich ‘It is time, now, for Karl to break down with his confession that I am a slow-burning fuse in his loins. A hair trigger. I am a name he cannot silence. A dream that never burst.’ Fiction by Louise Erdrich. Fiction | Issue 127 A Clean Marriage Sayaka Murata ‘Frequency of sex since marriage: zero.’ Sayaka Murata on a sexless marriage and the ‘Clean Breeder’ technique for pleasureless reproduction. Highlights From Granta Books View all → Books Julia Sandra Newman £18.99 Books Study for Obedience Sarah Bernstein £9.99 Books Blackouts Justin Torres £14.99 Books The Glutton A. K. Blakemore £14.99 Books The Dimensions of a Cave Greg Jackson £18.99 Books An Ordinary Youth Walter Kempowski £18.99 Books Nature's Calendar Kiera Chapman,Rowan Jaines,Lulah Ellender,Rebecca Warren £14.99 Books Every Drop Is a Man's Nightmare Megan Kamalei Kakimoto £12.99 Books The Lights Ben Lerner £12.99 Books Though the Bodies Fall Noel O'Regan £12.99 Books Birnam Wood Eleanor Catton £20.00 Books I'm a Fan Sheena Patel £8.99 View All Recommended Reading Fiction | Issue 168 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock" alt="padlock"/> The Museum Guard J.M. Coetzee ‘Do they strike people as a strange couple? He does not know, does not care.’Fiction by J.M. Coetzee. Essays & Memoir | Issue 167 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock" alt="padlock"/> Where the Language Changes Bathsheba Demuth ‘I am on the hunt for the Russian Empire, or what traces might still exist of its colonial enterprise.’Bathsheba Demuth travels the Yukon river, following the history of the fur trade and the Nulato massacre. <img aria-hidden decoding="async" src="https://litbreaker.nui.media/pipeline/665458/0/vc?z=litbreaker&dim=514841&kw=&click=" alt="" width="300" height="250" border="0" /> Art & Photography | Issue 165 <img src="https://granta.com/wp-content/themes/granta/img/closed-lock.png" class="padlock" alt="padlock"/> Have a Good Trip with Trabant Martin Roemers & Durs Grünbein ‘Question: ‘What do a Trabant and a condom have in common?’ Answer: ‘Both decrease the pleasure of the ride.’’Durs Grünbein introduces photography by Martin Roemers. Essays & Memoir | Issue 166 Lifetimes of the Soviet Union Yuri Slezkine ‘Bolshevism, like most millenarian movements, proved a one-generation phenomenon.’Yuri Slezkine on Soviet history and the generational arc of revolution. Please check your email to confirm your subscription to our newsletter. Subscribe to the Granta newsletters Subscribe News, Prizes and Events Prize When I Sing, Mountains Dance and Chilean Poet Shortlisted for Oxford-Weidenfeld Translation Prize When I Sing, Mountains Dance by Irene Sola (trans. Mara Faye Lethem) and Chilean Poet by Alejandro Zambra (trans. Megan McDowell) are both shortlisted for the Oxford-Weidenfeld Translation Prize. Prize Our Share of Night Shortlisted for The Kitschies Our Share of Night by Mariana Enriquez (trans. Megan McDowell) is shortlisted for The Kitschies Red Tentacle award, awarded to speculative, sci-fi and fantasy novels. Prize I’m A Fan Wins a British Book Award I'm A Fan by Sheena Patel wins the Book of the Year: Discover Award at the British Book Awards.'''
