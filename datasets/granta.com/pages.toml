["https://granta.com/lifetimes-of-the-soviet-union"]
title = "Lifetimes of the Soviet Union | Yuri Slezkine | Granta"
description = "‘Sects and revolutions are staffed by young people.’ Yuri Slezkine on Soviet history, generational divides and the life cycle of a revolution."
full_description = "Lifetimes of the Soviet Union Yuri Slezkine if (window.innerWidth <= 600) { var aj_dim = 514841; } else { var aj_dim = '514840,514841'; }; aj_server = 'https://litbreaker.nui.media/pipeline/'; aj_tagver = '1.0'; aj_zone = 'litbreaker'; aj_adspot = '519067'; aj_page = '0'; aj_ch = ''; aj_kw = ''; aj_pv = true; aj_click = ''; The Soviet Union lasted one human lifetime. It was born in 1917 and died in 1991, at the age of seventy-four. The difficult Civil-War childhood was followed by precocious ‘construction-of-socialism’ adolescence, Great-Patriotic-War youth, ‘postwar-reconstruction’ maturity, Khrushchev-Thaw midlife crisis, and ‘period-of-stagnation’ dotage culminating in a series of colds, frenzied CPR attempts, and death ‘after a protracted illness’. Such an obituary works as a metaphor and a draft of a biography. It seems to make sense because the Bolshevik ‘party of a new type’ was not an organization seeking power within a particular state but a faith-based group radically opposed to a corrupt world, devoted to ‘the abandoned and the persecuted’, composed of voluntary members who had undergone a personal conversion, and dedicated to the total and immediate destruction of the ‘old world’ of suffering and injustice. It was, by most definitions, an apocalyptic sect awaiting an all-consuming revolutionary Armageddon followed by the millennial reign of Communist brotherhood as the overcoming of the futility and contingency of human existence. Most apocalyptic sects do not survive the failure of the doomsday prophecy. Most sects of any description do not survive the transformation of an exclusive community of fraternal converts into a complex society of hereditary members. Most sects, in other words, never become churches. The Bolsheviks built an enormous Potemkin temple but failed to transcend their sectarian origins and expired along with the last true believer. This story has a nice shape to it but it doesn’t work as an outline of Soviet history. The ‘Old Bolsheviks’ who built the Soviet state did not live long enough to grow old. The last Bolshevik who died in the top job was not a true believer. The founders’ successors came in two mutually hostile cohorts. The tale of the Soviet state consists of three generations. The original Bolsheviks were born in the 1880s and 90s and converted to socialist millenarianism as schoolchildren, seminarians, and college students. Their cause was the working class as universal redeemer; their parents were provincial clerks, clergymen, teachers, and doctors. The movement’s center lay at the empire’s periphery: between 1907 and 1917 the share of ethnic Russians among exiled revolutionaries (43.4 percent) was about equal to their share in the population; the proportion of Georgians and Armenians was twice as high; Poles, three times; Jews, four times; and Latvians, eight times (8.2 percent of exiles compared to 1.2 percent of population). The only condition for joining underground revolutionary circles was unconditional faith in the coming Armageddon and a readiness for self-discipline and self-sacrifice. The main activities were reading (socialist texts as well as ‘treasures of world literature’) and, as one gained in revolutionary consciousness, ‘propaganda and agitation’. As in most apocalyptic sects, the core members were young men who abandoned their families in order to form a band of brothers around a charismatic leader (Lenin’s nickname was the Old Man). Women made up a small proportion of the membership and played auxiliary roles as debate audiences, prison liaisons, model martyrs, ‘technical workers’, and writers’ muses. At the turn of the twentieth century, ‘student’ was a synonym for ‘revolutionary’, but, according to most revolutionaries, the real university was the prison. Unfree spaces were filled with free time, and most inmates spent days and months reading books and taking notes. The education of a revolutionary was completed in Siberian exile, which combined banishment to hell with a chance to create a sacred community of true believers. Present-day suffering was a guarantee of future happiness. One such student revolutionary was Aleksandr Arosev, a prominent Kazan Bolshevik and the son of a merchant, who associated the victory of Bolshevism with the transformation of the world into a fraternal sect. Communism was the kingdom of universal friendship. His closest friend was his high-school classmate, a fellow sectarian and amateur violinist by the name of Scriabin. The prophecy came true on Easter Monday, 1917, when Lenin rode into Petrograd on a train and declared that the time had come, the prophecy had been fulfilled, and the present generation would not pass away until all these things had happened. Sects and revolutions are staffed by young people. When Babylon fell, Arosev and his friend Scriabin, who had recently changed his name to ‘Molotov’ (‘hammer’) were twenty-seven. The Old Man was forty-seven. Arosev became one of the leaders of the Bolshevik military insurrection in Moscow and a prominent proletarian writer. Molotov emerged as one of the leading Bolsheviks in the capital. They were almost as young as the world they were ushering in. ‘The great uprising of the human mass in the name of humanity,’ wrote Arosev, ‘began simply and without hesitation – exactly the way the old books describe the creation of the world.’ For the next three years, the top Bolsheviks moved around continuously from one front of Armageddon to another and one assignment to the next. Some were accompanied by their permanent female comrades, most had short-term liaisons with nurses, secretaries, cryptographers, and propaganda department typists. Time flew so fast it was always about to end. According to the era’s most popular song, ‘Our locomotive is rushing full speed ahead, next stop Communism.’ The ‘last and decisive battle’ was won but the new world failed to materialize. War Communism was followed by the New Economic Policy, introduced by Lenin as a temporary retreat, opposed by many Bolsheviks as a betrayal of the revolution, and followed by a period of melancholy analogous to ‘the Great Disappointment’ suffered by American millenarians when the world failed to come to an end on 22 October 1844. Thousands of believers, as one of them put it, ‘wept and wept, until the day dawned’. The postponement of the Millennium coincided with the death of the Prophet. Trotsky could not attend Lenin’s funeral because of a mysterious nervous illness. A public prosecutor who could not stop weeping for several months was treated for ‘traumatic neurosis’. In 1927, 1,300 Bolshevik functionaries stayed at the Lenin Rest Home No. 1 outside Moscow. Six were found to be healthy; 65 percent of the rest were diagnosed with various forms of emotional distress (described as ‘neurasthenia’, ‘psycho-neurasthenia’, ‘psychosis’, and ‘nervous exhaustion’). The surviving Old Bolsheviks, now top government officials in their thirties and forties, moved into the Kremlin and several downtown-Moscow hotels that had been converted into dormitories known as Houses of Soviets and settled into a self-doubting communal domesticity – visiting each other’s rooms, smoking cheap tobacco, drinking strong tea, arguing about the timing of the second coming, and weeping. And weeping. There were two ways of reviving the revolution. One was rejuvenation through love, which seemed to require intergenerational romance. The great Party theoretician, Nikolai Bukharin, married the daughter of one of his oldest friends (after taking her away from the son of another old friend). The head of the Party’s Jewish Section, Semen Dimanshtein, married his adopted daughter. The chairman of the Military Board of the Soviet Supreme Court, Valentin Trifonov, married the daughter of his own wife. One day, he moved out of the mother’s room and into the daughter’s. They all continued to share the same apartment. One of the offspring of the new union was the writer Yuri Trifonov, who would devote his work to the question of how the revolution had devoured its parents. He was born in 1925, the lowest point in the history of the Soviet Great Disappointment and the highest in number of births among Bolshevik officials. Arosev married and had three daughters, but his wife soon left him for another Party official, who had left his wife and three children in order to be with her. Arosev was sent to Prague as Soviet ambassador to Czechoslovakia and soon married his eldest daughter’s dance teacher, a young German Jewish woman named Gertrude, whom he called Gera and whom his daughters loved to hate. The other way to rescue the revolution was to fulfill its promise by having the workers inherit the world. The intellectuals who had instituted the ‘dictatorship of the proletariat’ were committed to the cause of their own obsolescence through class-based affirmative action. The key to overcoming the rot of the New Economic Policy was streamlined mass education and the preferential promotion of the ‘socially close’. There were, roughly speaking, two main groups of beneficiaries (known as vydvizhentsy, or ‘promotees’): the children of workers and peasants, who became prominent in industrial management and regional Party apparatus, and Jews from the old Pale of Settlement (the only members of the literate classes not compromised by service to the tsarist state), who came to dominate the cultural, intellectual, and professional elites. In the 1920s the Old Bolsheviks produced two sets of heirs: the ones they selected as young men with ‘healthy social roots’ and promoted to positions of ever greater responsibility with the goal of eventual supreme leadership, and the ones they conceived in guilty midlife passion in the Houses of Soviets. Both were products of the Great Disappointment. And then the day dawned. In 1927, Stalin launched his ‘Revolution from Above’, also known as the ‘Era of the First Five-Year Plans’. Its purpose was to bring about the fulfillment of the original prophecy by adding an industrial ‘base’ to the already solid political ‘superstructure’. Industrialization was to be accompanied by its presumed consequences: the abolition of private property, the destruction of class enemies, and the definitive self-realization of the proletariat. The weeping ended. The Left Oppositionists repented, the Right Oppositionists surrendered, and the rejuvenated Old Bolsheviks set about building, purging, and collectivizing. Valentin Trifonov returned from diplomatic postings in China and Finland to become chairman of the Main Committee on Foreign Concessions; and Aleksandr Arosev began to draft a revolutionary epic, the last volume of which was devoted to ‘the economic building of socialism under [Stalin’s] direction and the falling off of the de facto alien elements’. The Old Bolsheviks’ official successors, born in the first decade of the twentieth century and promoted through Soviet colleges’ ‘workers’ departments’, got married, joined the Party, and stopped being workers. Nikolai Podgornyi, born in 1904 to a metalworker of peasant origin in Karlivka, Ukraine, graduated from the Kiev Institute of Food Industry; Leonid Brezhnev, born in 1906 to a metalworker of peasant origin in Kamianske, Ukraine, graduated from the Kamianske Institute of Metallurgy; and Aleksei Kosygin, born in 1906 to a metalworker of peasant origin in St Petersburg, then the empire’s capital, graduated from the Leningrad Textile Institute. All became engineers, ‘Red Directors’, and, for the rest of their lives, ‘people of the First Five-Year Plan’. By 1934, the Stalin Revolution had been largely completed. Life, according to Comrade Stalin, had become ‘merrier’; the age, according to thousands of posters, was one of ‘happy childhood’; the country, according to Isaac Babel, had been ‘gripped by a powerful feeling of pure, physical joy’. The Old Bolsheviks settled down and moved into their new permanent homes (in old imperial buildings or in new houses built for the purpose). Most of the men were in their forties and early fifties (Trifonov turned forty-six, Arosev forty-four), most of their wives were in their thirties, most of their children were between five and twelve, and most of their maids (each family had one) were young girls from the famine-gripped farms their masters had recently collectivized. Family life in Old Bolshevik homes tended toward the nineteenth-century Russian model as represented in ‘Golden Age’ Russian literature (which, unlike most of its West European counterparts, was aristocratic, not bourgeois): the remote, admired, feared, and usually absent father; the less remote, less admired, less feared, and frequently absent mother; the more or less pitied German governess; the more or less dreaded piano teacher; and the beloved peasant nanny, who did most of the child-rearing until it was time to start reading the books their fathers would select for them. Most of those books came from the same nineteenth-century canon – as did their children’s own lives, complete with Christmas midnight magic, now called New Year’s; swimming and berry-picking at country estates, now called dachas; regular trips to Black Sea palaces, now called rest homes; and an intense cult of love, friendship, book-reading, letter-writing, and diary-keeping. Every girl was Natasha Rostova from War and Peace, and every boy was Prince Andrei. The children of the revolutionaries were happy dwellers in the land of happy childhood. They respected their seniors, loved their country, and looked forward to improving themselves for the sake of socialism and to building socialism as a means of self-improvement. They were children of the revolution because they were their fathers’ children, because they were born after the revolution, and because they were proud of their paternity and determined to carry on what was at once their father’s ‘profession’, their country’s mission, and History’s secret purpose. Born in the 1920s, they came of age along with socialist realism, and the heart of socialist realism, according to Bukharin’s speech at the First Writers’ Congress in 1934, was romanticism. ‘The soul’ of ‘most of the young people of that time’, wrote one of them many years later, was ‘romantic’ – romantic in the sense of being exalted, vibrant, hopeful, and vulnerable, and Romantic in the sense of seeking transcendence in the here and now. The fathers’ generation had been shaped by the expectation of the apocalypse; the children’s generation was ‘religious’ about the heavenly city they inhabited. The fathers’ friends and lovers were fellow sectarians who shared their faith; the children’s friends and lovers were unique individuals whom they loved for reasons they never tired of discussing but were never supposed to exhaust. The fathers’ ‘classical’ reading was tempered by Symbolism and disciplined by the study of Marx, Lenin, and economics. The children were bored by modernism, entirely innocent of econom"
