title = "» Contributor Bios"
full_description = "Contributors Jonathan Abrams is a staff writer for Grantland. His book, Boys Among Men: How the Prep-to-Pro Generation Redefined the NBA and Sparked a Basketball Revolution, is due out in March. @ JPdabrams Most recently: Ball in the Family Holly Anderson is a staff writer at Grantland. @ HollyAnderson Most recently: Blades of Glory Katie Baker is a staff writer at Grantland. @ katiebakes Most recently: The Sun Is Rising in Buffalo Bill Barnwell is a staff writer for Grantland. @ billbarnwell Most recently: NFL Week 8 Picks: The Weight of the Interim Label Amos Barshad has written for New York Magazine, Spin, GQ, XXL, and the Arkansas Times. He is a staff writer for Grantland. @ AmosBarshad Most recently: We Went There: Blur Finally Makes It to Madison Square Garden Rafe Bartholomew is an editor at Grantland and author of Pacific Rims: Beermen Ballin’ in Flip-Flops and the Philippines’ Unlikely Love Affair with Basketball. @ rafeboogs Most recently: ‘The Ropes’ Podcast: Steve Farhood on Floyd Mayweather’s Legacy, and a Mayweather-Berto Preview Michael Baumann is a Grantland contributor and author of the book Philadelphia Phenoms: The Most Amazing Athletes to Play in the City of Brotherly Love. @ mj_baumann Most recently: Citi Field Psyops: How the Mets Can Beat Yordano Ventura Matt Borcas is a contributing writer for Grantland. @ mattborcas Most recently: Miami’s Man: Building the Ultimate Coach for The U Chris B. Brown is a contributing writer for Grantland and the editor of the website Smart Football. His latest book is The Art of Smart Football. @ smartfootball Most recently: Football 101: Why Power Running Works Rembert Browne is a staff writer for Grantland. @ rembert Most recently: Rembert Explains Sisqo’s ‘Unleash the Dragon’ Danny Chau is an assistant editor at Grantland. @ dannychau Most recently: NBA Overnight: The Divergent Nights of Stephen Curry and Anthony Davis Jason Concepcion is a staff writer for Grantland and coauthor of We’ll Always Have Linsanity. @ netw3rk Most recently: Can ‘Halo’ Make the Leap Into the E-sports Future? Jordan Ritter Conn is a staff writer for Grantland. He wrote The Defender: Manute Bol’s Journey from Sudan to the NBA and Back Again, a multimedia e-book published by The Atavist. @ jordanconn Most recently: Schoolboy Chris Connelly is the Editor-in-Chief of Grantland. @ ChrisConnelly Most recently: ‘Grantland Pop Culture Podcast’: Aaron Sorkin on ‘Steve Jobs’ Bryan Curtis is a staff writer for Grantland. @ curtisbeast Most recently: Meme People: The Meaning of College Football Viral Fan Shots Jason Gallagher is the founder of Ballerball.com and the cowriter of The Lockout: A Musical. @ jga41agher Most recently: The Second-Annual NBA Video Music Awards Corban Goble is a writer and editor living in Brooklyn. @ corbangoble Most recently: Dusty in the Wind: The Sad Saga of Dusty Coleman, Kansas City’s Modern-Day Moonlight Graham Kirk Goldsberry is a professor and Grantland staff writer. @ kirkgoldsberry Most recently: Russell, the Creator Andy Greenwald is a staff writer for Grantland. @ andygreenwald Most recently: The State of Scary TV: ‘The Returned’ and ‘Ash vs Evil Dead’ Join ‘The Walking Dead’ in Offering High-Quality Horror Mark Harris is the author of Pictures at a Revolution: Five Movies and the Birth of the New Hollywood and Five Came Back: A Story of Hollywood and the Second World War. @ MarkHarrisNYC Most recently: The New York Film Festival Grapples With the Death of an Icon David Hill lives in Brooklyn. His writing has appeared in McSweeney’s and the New York Times. He writes sketch comedy at the Upright Citizens Brigade theater. @ davehill77 Most recently: The Weight of Guilt Matt Hinton is a staff writer at Grantland. @ MattRHinton Most recently: Taking Stock of the College Football Landscape at the Midseason Mark Steven Hyden is a staff writer for Grantland. His first book, Your Favorite Band is Killing Me, will be released in May. @ Steven_Hyden Most recently: In Praise of Beach Slang, 2015’s Best, Most Sincere Rock Band David Jacoby is an ESPN producer who somehow became a writer and editor for Grantland. @ djacoby Most recently: Lowbrow Highlights: Bromance Blossoms on ‘The Bachelorette’ Rany Jazayerli runs the Rany on the Royals website. He is one of the founders of Baseball Prospectus, and works as a dermatologist in suburban Chicago. @ jazayerli Most recently: The 15 Biggest Plays in Baseball History Christina Kahrl covers baseball for ESPN.com. She is also on the board of directors of GLAAD. @ ChristinaKahrl Most recently: The Meaning of Caitlyn Jenner Jonah Keri is a staff writer for Grantland. His book The Extra 2%: How Wall Street Strategies Took a Major League Baseball Team From Worst to First is a New York Times best seller. The paperback edition of his new book, Up, Up, and Away, on the history of the Montreal Expos, is now available. @ jonahkeri Most recently: World Series Wrap: Cueto’s Game 2 Gem Chuck Klosterman is a contributing editor at Grantland and the author of eight books. The latest is I Wear the Black Hat. @ CKlosterman Most recently: Moses Malone: 1955–2015 Molly Lambert is a staff writer for Grantland. @ mollylambert Most recently: Who Was Missing From Taylor Swift’s Miami Squad? Ben Lindbergh is a staff writer at Grantland. @ BenLindbergh Most recently: World Series Weekend: Five Questions for Three (or Two) Royals-Mets Games Mark Lisanti is an editor at Grantland. @ marklisanti Most recently: ‘Fear the Walking Dead’ Recap: Six Telltale Signs That You Can No Longer Ignore the Imminent Zombie Apocalypse Zach Lowe is a staff writer for Grantland. @ ZachLowe_NBA Most recently: ‘The Lowe Post’ Podcast: Howard Beck on Pursuing Kevin Durant John Lopez is a Grantland contributor and a writer/filmmaker living in Los Angeles. @ jedgarlopez Most recently: Weekend Box Office Winners & Losers: Bill Murray, Vin Diesel, Steve Jobs, and Jem All Go Down in Spectacular Flames David Shoemaker , also known as “The Masked Man,” is the author of the The Squared Circle: Life, Death, and Pro Wrestling. @ AKATheMaskedMan Most recently: (W)WE Need a Hero: John Cena Is Gone. Who’s Up Next? Robert Mays is a staff writer at Grantland. @ robertmays Most recently: Spirit of St. Louis: Todd Gurley Is Giving the Rams a Chance to Take Flight Riley McAtee is an assistant editor at Grantland. @ Riley_McAtee Most recently: Ducks, Hunted: Can a Soft Schedule Keep Oregon’s Playoff Hopes Alive? Sean McIndoe ’s work can be found at Down Goes Brown. When he’s not writing, he makes hockey jokes on Twitter at @downgoesbrown. @ DownGoesBrown Most recently: NHL Grab Bag: Let’s Get Spooky Mike L. Goodman is a staff writer for Grantland. @ TheM_L_G Most recently: No Messi, No Problem: Neymar Becomes a Superstar Ryan O’Hanlon is a general editor at Grantland. @ rwohan Most recently: Three More Flagrant But True Premier League Statements Alex Pappademas is a staff writer for Grantland. @ PAPPADEMAS Most recently: Brand Echh: Sandra Bullock and Billy Bob Thornton Can’t Save the Lame ‘Our Brand Is Crisis’ Graham Parker writes the Designated Player column for Grantland. He is the chief soccer writer for the Guardian US and an editor at Howler. @ KidWeil Most recently: Re-Born in the U.S.A.: Manchester City’s Newest Club Tries to Find Its Voice in New York Brian Phillips is a staff writer for Grantland. @ runofplay Most recently: 50 Scenes That Do Not Appear in the Fox ‘X-Files’ Revival Charles P. Pierce is a staff writer for Grantland and the author of Idiot America. He writes regularly for Esquire, is the lead writer for Esquire.com’s Politics blog, and is a frequent guest on NPR. Most recently: The Legacy of the NFL Sin-Eaters Jalen Rose is an ESPN/ABC analyst and executive producer of Fab Five, the highest-rated documentary in ESPN history. Keep up with him at JalenRose.com and JRLADetroit.com. @ jalenrose Most recently: ‘Story Time With Jalen Rose’: Jalen Rose Shouldn’t Be Alive Dave Schilling is a general editor at Grantland. @ dave_schilling Most recently: We Went There: Towns and Russell Debut, But Kobe Takes the Spotlight Shea Serrano is a staff writer for Grantland. His latest book, The Rap Year Book: The Most Important Rap Song From Every Year Since 1979, Discussed, Debated and Deconstructed, is a New York Times best seller and is available everywhere. @ SheaSerrano Most recently: The Vin Diesel Character Matrix Andrew Sharp is a staff editor at Grantland. @ andrewsharp Most recently: NBA Stock Watch: Buy the Bulls, Sell Van Gundy, and Other Bits of Investment Advice Louisa Thomas is a Grantland staff writer and editor. @ louisahthomas Most recently: An Ode to the Marathoner Mark Titus is the founder and author of the blog Club Trillion. His book, Don’t Put Me In, Coach, chronicles his career as a walk-on benchwarmer for the Ohio State basketball team and is on sale now. @ clubtrillion Most recently: Duke’s Defense: The Real Difference in the NCAA Title Game Top Stories The Weight of the Interim Label by Bill Barnwell World Series Preview: Five Questions for Games Three and Four by Ben Lindbergh 50 Scenes That Do Not Appear in the ‘X-Files’ Revival by Brian Phillips Click here to watch ‘Jalen & Jacoby,’ Grantland Features, and video podcasts! Top Stories The Weight of the Interim Label by Bill Barnwell World Series Preview: Five Questions for Games Three and Four by Ben Lindbergh 50 Scenes That Do Not Appear in the ‘X-Files’ Revival by Brian Phillips Click here to watch ‘Jalen & Jacoby,’ Grantland Features, and video podcasts! Most Popular Features The Triangle Hollywood Prospectus"
