title = "CS148: Introduction to Computer Graphics and Imaging, Summer 2010"
full_description = "Image input and output devices such as cameras and displays, graphics hardware and software, input technologies and interactive techniques, typography and page layout, light and color representations, exposure and tone reproduction, image processing and compression, sampling, aliasing and antialiasing, two- and three-dimensional geometry, modeling techniques including curves and surfaces, reflection models and illumination algorithms, basic methods of animation, and information visualization. Required: Shirley and Marschner, Fundamentals of Computer Graphics, 3rd ed. (in a pinch 2nd ed. is ok) Optional: - Shreiner et al., The OpenGL Programming Guide, 6th ed. (7th ed. also ok) - Angel, OpenGL: A Primer, 3rd ed. - ... or any other decent OpenGL programming guide that covers shaders (GLSL) Stanford students have free online access to the 2nd ed. of Shirley and Marschner and the 7th ed. of Shreiner et al. Other books which you are encouraged to consult (get the latest edition you can find): - Foley, van Dam, Feiner and Hughes, Computer Graphics: Principles and Practice in C - Hearn and Baker, Computer Graphics, C Version - Angel, Interactive Computer Graphics: A Top-Down Approach with OpenGL Assignments will be due at Midnight (23:59:59 PDT) on the scheduled date. This class has no late days, and a 10% penalty per day late will be enforced."
