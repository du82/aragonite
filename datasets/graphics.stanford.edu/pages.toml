["http://graphics.stanford.edu/courses/cs468-12-spring"]
title = "CS468: Geometry Processing Algorithms Home Page"
full_description = "Announcements General Info Course Staff Resources Schedule & Assignments Announcements 03/26/12: Welcome to the course! Please sign up with Piazza. General Information Times & Places MW 9:30 - 10:45, Clark S361 (behind Peet's) Objectives Recent advances in 3D digital geometry processing have created a plenitude of novel concepts for the mathematical representation and interactive manipulation of geometric models. This course covers some of the latest developments in geometric representations, modeling and processing. Topics include: Surface modeling based on triangle meshes Mesh generation Mesh fairing and simplification Parameterization and remeshing Subdivision schemes Shape matching and correspondence Mesh editing and deformation Programming exercises will help translate theoretical concepts to practical applications. A code framework will be provided that allows to experiment with various algorithms without having to bother about software infrastructure. There will be 5 modest programming assignments, and no final exam. Prerequisites Introduction to Computer Graphics, experience with C++ programming. Some background in geometry or computational geometry is helpful, but not necessary. Resources OpenMesh: OpenMesh web page OpenMesh documentation Mesh manipulation: MeshLab Graphite Models: AIM@SHAPE Repository Princeton Segmentation Database (82M) Course Staff Name Email Phone Office Hours Mirela Ben-Chen mirela-at-stanford-dot-edu 725-8818 TBA Acknowledgements The course staff would like to thank the Stanford Computer Forum for their support. Many of the lectures are based on previous versions of this class given by various people (Craig Gotsman, Alla Sheffer, Mark Pauly, Mario Botsch, Bruno Lévy, and others). We would like to thank all of them for agreeing to share their resources."
