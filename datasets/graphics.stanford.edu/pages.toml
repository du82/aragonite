["https://graphics.stanford.edu/courses"]
title = "Courses in Graphics"
full_description = "The interwoven histories of science and Western art from the Renaissance to the 19th century. Emphasis is on the revolutions in science and mathematics that have inspired parallel revolutions in the visual arts (e.g., Brunelleschi's invention of linear perspective, Newton's discoveries in geometric optics, and the theories of color vision proposed by Goethe, Young, Helmholtz, etc.). The scientific principles behind image making, including a brief survey of digital image synthesis (a.k.a. computer graphics). However, this is not a course in computer graphics. No programming experience is required. Intended primarily for freshmen and sophmores, with preference given to freshmen. Enrollment limited. Satisfies GER:DB-EngrAppSci. Introductory Computer Graphics and Imaging Topics: Image input and output devices such as cameras and displays, graphics hardware and software, input technologies and interactive techniques, typography and page layout, light and color representations, exposure and tone reproduction, image composition and imaging models, digital signal processing, sampling, aliasing and antialiasing, compression, two- and three-dimensional geometry and transformations, modeling techniques including curves and surfaces, reflection models and illumination algorithms, and basic methods of animation. Programming assignments using C++ and OpenGL. GER:DB-EngrAppSci Algorithms and data structures deadling with the representation and manipulation of physical objects and entities in the computer. Computational structures for shape and motion, shape fitting and matching, triangulations and other spatial subdivisions, and low-dimensional search and optimization. Examples relevant to computer graphics, computer vision, robotics and geometric computation emphasizing algorithmic paradigms applicable to multidimensional data. Scientific, artistic, and computing aspects of digital photography. Topics: lenses and optics, light and sensors, optical effects in nature, perspective and depth of field, sampling and noise, the camera as a computing platform, image processing and editing, history of photography, computational photography. Coursework is written assignments, exams, and photography assignments. Enrolled students will be given free access to Photoshop during the course. Counts as a CS elective in the Graphics Track. Also satisfies GER:DB-EngrAppSci."
