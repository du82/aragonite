["http://graphics.stanford.edu/courses/cs348b-competition"]
title = "cs348b rendering competition"
full_description = "In 2002, the lab used for this course consisted of 30 PCs running Linux - 15 equipped with 730MHz PIIIs and 256 MB RAM, and 15 with 1000MHz PIIIs and 512 MB RAM. The software available for the course has included a simple interactive modeler and a scene composing package which reads in objects designed in the modeler and allows interactive manipulation of viewing and lighting parameters, object position and scale in 3-space, and surface parameters such as color and shininess. The scene composer was built atop SGI's Inventor software, a 3-D graphics toolkit written in C++. Since moving to the Linux platform, software provided has included lrt, a ray tracer developed by Greg Humphreys and Matt Pharr, and freeware modeling packages like Moonlight 3D Atelier."
