["http://graphics.stanford.edu/courses/cs348b-competition/cs348b-00"]
title = "cs348b-00 rendering competition"
full_description = "Tanya and Victor won first prize in the rendering competition this year for their outstanding picture of a lizard on a leaf. The lizard and leaf were modeled in 3D Studio Max using NURBs. Many people had a hard time distinguishing the photograph from the rendering during the competition. The scene uses a mixture of some very nice rendering techniques. They implemented depth of field to give the background the proper blur. They also implemented procedural and textural bump mapping. The textural bump mapping was used to give the leaves a more natural look. The procedural bump mapping used a novel two pass algorithm. The first pass was to determine the location of the centers of the bumps based on user specified pitch and the three-dimensional distance between points sampled on the same object in the image. The second pass was to find the closest bump center for the hit point and then to bend the surface normal at that point to match the normal of the corresponding point on a sphere. The zoomed in results are quite nice. Brad and Jeremy won second prize for their renderings of an hour glass as lit from several different natural environments, based on techniques for capturing and displaying high dynamic range images by Paul Debevec. The rendered images show the hourglass as lit from a Eucalyptus Grove, St. Peters Basilica, and the 2213 Vine Street Kitchen. Not only did Brad and Jeremy produce some outstanding images, they also built several tools for debugging the rendering process. Amongst the tools they created were a progressive rendering window, a checkpointing mechanism for long rendering runs, and a graphical debugger. We expect to see these tools show up in next years class. Greg and Yu Ping earned an honorable mention for thier excellent lighter scene. They implemented CSG, solid procedural texturing, bump mapping, plus some volume rendering techniques for the flame. The CSG allowed them to make a very convincing lighter model. The flame was treated as a volume light source, which was implemented in a manner similar to area light sources."
