["http://graphics.stanford.edu/courses/cs448a-99-fall"]
title = "Syllabus"
full_description = "We are designing and experimenting with multi-device, multi-user environments based on a new architecture that makes it easy to create and add new display and input devices, to move work of all kinds from one computing device to another, and to support and facilitate group interactions. In the same way that today's standard operating systems make it feasible to write single-workstation software that makes use of multiple devices and networked resources, we are constructing a higher level operating system for the world of ubiquitous computing. The interactive room (located in Gates B23) is a testbed for combining multiple devices in an integrated environment. The emphasis in the research is on developing an appropriate infrastructure that can support a wide variety of configurations, and on developing interaction methods that are appropriate for a multi-person, multi-device setting. It is equipped with several large wall-based displays (rear-projection SmartBoards and a front-projection surface), a bottom-projected table, and a variety of servers and additional devices (which will change as the project develops). It incorporates a unified event architecture that supports applications in using multiple devices and displays, and will have a room-context database that supports the task and project aspects of the work. The goal of this course is to explore what new applications are possible within interactive workplaces, and what new technologies need to be developed to enable these applications. We will begin with a series of background lectures on the basics of Interactive WorkSpaces, including their history, new input and output technologies to support table, wall and room environments, computer-supported cooperative work (CSCW) systems, and system technologies for building these environments. There will also be 3-4 guest lectures from industry, and discussion and debates on controversial topics of interest. Students will form into a small number of project teams each building a working application in the Interactive Workspace laboratory."
