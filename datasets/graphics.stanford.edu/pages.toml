["https://graphics.stanford.edu/data/mich"]
title = "The Digital Michelangelo Project Archive of 3D Models"
full_description = 'Recent improvements in laser rangefinder technology, together with algorithms developed in our research group for processing range data, allow us to accurately digitize the external shape and reflectance of many physical objects. As a demonstration of this technology, a team of 30 faculty, staff, and students from Stanford University and the University of Washington spent the 1998-99 academic year in Italy digitizing the sculptures and architecture of Michelangelo. During our year abroad, we also scanned all 1,163 extant fragments of the Forma Urbis Romae, a giant marble map of ancient Rome. One of the original aims of this digitization project was to create an archive of unusually large and detailed 3D scanned models for use by computer scientists, artists, art historians, and archeologists. However, as we have reported in our papers and talks, building these 3D models has proven more difficult than we expected. Part of the difficulty lies in the large size of our datasets - more than a billion range samples for the David. Another difficulty, discussed in our 2000 SIGGRAPH paper, was the challenge of deploying into the field a mechanical scanner that was accurate to 1/4mm accuracy over a working volume of 5 meters - a "geometric dynamic range" of 20,000:1. As a result, our scans are slightly warped - about 1mm for each 200mm of travel along the surface, or about 0.5%. To date we have produced a good model of St. Matthew at 0.29mm and decent models of the David at 1mm and 2mm (but see note immediately below). Our models of the other statues we scanned are distinctly inferior to these. In some cases, the raw data itself is relatively poor, such as our scan of the highly polished statue of Night. Although our archive is incomplete, we have decided to make our models and our entire corpus of raw range data available to the scholarly community, with the hope it will spur other researchers to address the problems we have faced. Undoubtedly, these efforts will lead to new solutions for these problems. If they also lead to better models of these statues, we would be happy to incorporate these models into our archive, with suitable credit given.'
