["https://graphics.stanford.edu/gamma.html"]
title = """
Graphics Lab
About gamma correction"""
full_description = '''Who is responsible for applying gamma correction? If you are viewing these images on a Mac or Silicon Graphics (SGI) workstation (the latter is now obsolete), the operating system applies gamma correction for you by loading a colormap into the display hardware that recomputes pixel values on their way to the monitor using the second formula given above. In this case, our older images will look fine to you. If you are viewing these images on a Windows PC, then you must configure your video card, browser, or external image viewer application to apply gamma correction (see below for instructions). If your system cannot be configured to apply gamma correction, then you must download our images and correct them yourself, e.g. by applying the second formula in software. If you do none of these things, then our older images will look too dark to you. How do I know if my system is applying gamma correction? Look at the two images above. The left image is not gamma corrected. It looks fine on an SGI, but too dark on a PC. In particular, on a PC the sky in the upper-right corner looks inky, almost as dark as the trees. The right image has been gamma corrected to 1.7. It looks fine on a PC, but washed out on an SGI - so washed out that you can see noise from this early-model digital camera in the black jackets. On a Mac, the story is somewhere between these two extremes. How do I configure my system to apply gamma correction? If you have configured your browser to launch an external viewer like "xv" to display your images, you can ask it to apply gamma correction for you. For example, if your browser is Netscape Communicator (or more recently, Mozilla's Firefox), your image viewer is xv, and the gamma of your display monitor is 2.0, then you can ask xv to apply gamma correction as it displays an image by changing the invoking command in Netscape to "image/*; xv -gamma 2.0 %s". To find out the gamma of your monitor, look at the hardware specifications that you threw away on the day you unpacked the monitor. Some operating systems and programs provide an interactive utility to help you determine your monitor's gamma, typically by asking you to change the brightness of a gray patch until it matches an adjacent checkerboard of black and white squares that, if you squint to blur the checkerboard pattern, simulates a 50% gray. As mentioned earlier, most monitors have a gamma between 1.7 and 2.7. Fortunately, as monitors are replaced by LCDs, the world is slowly converging on a monitor gamma of 2.5.'''
year_published = 2025
clearnet = "https://graphics.stanford.edu/gamma.html"
category = "SitesList"
