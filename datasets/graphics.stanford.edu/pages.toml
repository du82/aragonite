["http://graphics.stanford.edu/courses/cs468-08-fall"]
title = "CS468-Fall 2008"
full_description = 'This seminar will touch upon the use of ideas from metric geometry for tackling the problem of Matching/Comparison of Shapes under invariances. We will cover different ideas of Mikhail Gromov that have proved extremely useful in the context of this applied problem. The central idea is to consider shapes as metric spaces (or measure metric spaces) and, then, use one of various notions of distance between metric spaces to obtain a measure of dissimilarity between shapes. The choice of the metric with which one augments the shapes encodes the degree of invariance one obtains from the dissimilarity measure. The main example in this family of notions of dissimilarity between shapes is the Gromov-Hausdorff distance. We will start by reviewing the main approaches in the literature. Then we will discuss the requisite theoretical background from Metric Geometry and cover details about the numerical computation of Gromov-Hausdorff distances. [BBI] "A Course in Metric Geometry", by Burago-Burago-Ivanov, AMS Graduate Studies in Mathematics Volume 33 [Villani] "Topics in Optimal Transportation", by Cedric Villani, AMS Graduate Studies in Mathematics Volume 58 [MS05] "A theoretical and computational framework for the isometry invariant recognition of point cloud data", by F.Memoli and G. Sapiro. Foundations of Computational Mathematics, 2005. [BBK06] "Efficient Computation of Isometry Invariant Distances between Surfaces", by Bronstein, Bronstein and Kimmel. SIAM 2006. [BK] "Which point configurations are determined by their distribution of pairwise distances ", M. Boutin and G. Kemper, 2006. [BK-1] "On reconstructing n-point configurations based on distrbutions of distances or areas ", M. Boutin and G. Kemper, 2003. Systematically Accelerating the Fracture Simulation Workflow using Shape Matching Techniques [Presentation]'
