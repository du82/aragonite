["http://graphics.stanford.edu/courses/cs348b-competition/cs348b-98"]
title = "cs348b-98 rendering competition"
full_description = '''1998 was the year of the vices. Smoking, drinking, and gambling won the top three places respectively. The cigarette tip was modelled as a large number of concentric tobacco rings perturbed by a Gaussian noise function. The smoke is modelled by a cone perturbed by a 3D turbulence function, and the cone itself is distorted to cling to the surface of the cigarette before dissipating upwards. The caustics are rasterized onto a cylindrial "caustic map" which surrounds the object, which can be indexed when drawing the object itself. When this mapping is properly computed the caustics do not inappropriately appear on flat, horizontal surfaces pointing away from the water, such as the pedestal of the cat sculpture. The semi-diffuse (glossy) reflections are anisotropic. Patti, Kuan-loong, and Seth's second scene was a completely algorithmically generated fractal mountain. (Although this does not fall under the heading of real world object, their primary scene does.) The first image shows the mountain from the side. The second is a bird's eye view of the entire scene, for a better view of the rivers. In the author's own (edited) words: "The fractal mountain is modeled as a polyset created from a heightfield. A diffuse and specular texture map are algorithmically generated from the heightfield data to provide the same effect as a volume-based texture. The color scheme of the mountain was based on both height and noise to simulate rock strata. Snow is algorithmically grown on the mountain using a probability density function which takes into account the height of the point and its slope. High or flat areas are likely to have snow, while low or steep mountain faces are not. Rivers are also algorithmically grown. Rivers begin at randomly chosen nucleation points and follow the path of steepest decent to the sea. The river will pool in valleys until it climbs the walls. A corresponding specular map is also generated to add reflective properties to the snow and water but not to the mountain itself."'''
year_published = 2025
