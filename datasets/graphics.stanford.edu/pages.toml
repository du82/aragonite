["http://graphics.stanford.edu/courses/cs348b-competition/cs348b-97"]
title = "cs348b-97 rendering competition"
full_description = '''Bennett and Faisal won the hotly contested '97 rendering competition with this rendering of a Colorado license plate. To model the license plate, they wrote a simple program to generate a curved rectangular mesh, which approximated the bend in the original plate. They used a scanned image of the original plate to generate texture, bump, transparency, and specularity maps for the plate. Finally, they applied environment mapping to get more interesting reflections, and area light sources to generate the soft shadows. Note the patterns in the specular term of the two stickers, the crosshatch scratches in the right sticker, and the bump map for the raised white lettering, which extends slightly beyond the paint. Both Bennett and Faisal have lived in Fort Collins. Eng-Shien, Jeremy, and Li-Wei captured second place with their modeling of natural scenes. The tree model was generated by a program they wrote that was based on Eric Haines' SPD code, with some additional randomization. The trunk and branches were modeled as cone segments, while the leaves were modeled as spheres, with texture and trim mapping. The single leaf used texture, bump, transparency, and trim maps to define its appearance. The scenes were initially inspired by the M.C. Escher engravings "Three Worlds" and "Dewdrop". The lake was bump-mapped. The first picture has a fractal mountain in the background, and two pictures demonstrate depth of field effects. All of the pictures use environment mapping, which can especially be seen in the reflections off the dewdrop. Ryan and Syndney received one of four honorable mentions for their renderings of cocktail glasses and a jigger. In addition to their carefully shaped cocktail glasses, they modeled the wine with a constant density volumetric function (computed from the length of the ray passing through the wine). They used a stack to store refraction indices for each ray, so that they could get refraction through the glass (1.5), water (1.33), and ice (1.25). The marble table was generated with a perlin noise function, while the checkered table used texture maps to modify specularity and shininess. The entire scene was environment-mapped, and you can see the reflections in the glasses and the jigger.'''
