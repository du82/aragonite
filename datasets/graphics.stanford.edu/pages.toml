["http://graphics.stanford.edu/courses/ba-colloquium"]
title = """
CS 528 -- Broad Area Colloquium for Artificial Intelligence,
Geometry, Graphics, Robotics, and Computer Vision"""
full_description = '''This colloquium is intended to bring established and senior researchers from the fields of AI, Geometry, Graphics, Robotics, and Computer Vision , to discuss and explain broad considerations and high-level tasks that the relevant communities are addressing. The talks are intended to create awareness and interest for all of the members of these communities, hopefully bridging the gaps and creating collaborations. Serafim Batzoglou, Ron Fedkiw, Richard Fikes, Leo Guibas, Pat Hanrahan, Oussama Khatib, Daphne Koller, Jean-Claude Latombe, Marc Levoy, Andrew Ng, Chris Manning, Deborah McGuinness, Ken Salisbury, Yoav Shoham and Sebastian Thrun Time: Weekly on Mondays, 4:15pm until 5:30pm. Location: Hewlett (TCSeq) 200 Information: Send email to bac-coordinators@cs.stanford.edu Weekly Announcements: Register to the colloquium list by sending an email to majordomo@lists.stanford.edu with a blank subject line and "subscribe broad-area-cs-colloquium" as your message. Faculty Coordinator: Serafim Batzoglou April 9 Jonathan Shewchuk Isosurface Stuffing: Fast Tetrahedral Meshes with Good Dihedral Angles April 16 No seminar; instead you should attend the talk by Scott Aaronson from 4:15-5:15pm in Packard 101 April 23 Jana Kosecka Visual localization and modeling of urban environments April 30 Marc Pollefeys Visual 3D modeling of real-world objects, scenes and events from videos May 7 Steve Seitz Navigating the World's Photographs May 14 Jay McClelland Development and Disintegration of Conceptual Knowledge: A case study in Mind, Brain, and Computation May 21 Mike Montemerlo The DARPA Grand Challenges: From Desert to Urban Autonomous Driving June 4 Lydia Kavraki Motion Planning for Physical Systems Students who intend to attend the seminar for credit may wish to sign up for CS528, a one unit course. If a student misses more than one seminar, he cannot receive credit. There is no way to "make up" a missed seminar. A cancelled seminar does not count towards your attendance. If you plan to take the class, you should sign up on Axess and subscribe to the colloquium mailing list to receive announcements about upcoming speakers. In addition, you should subscribe to the CS 528 mailing list to receive class-related announcements.'''
