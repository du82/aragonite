["https://graphics.stanford.edu/projects/mich"]
title = "The Digital Michelangelo Project"
full_description = 'Recent improvements in laser rangefinder technology, together with algorithms developed at Stanford for combining multiple range and color images, allow us to reliably and accurately digitize the external shape and surface characteristics of many physical objects. Examples include machine parts, cultural artifacts, and design models for the manufacturing, moviemaking, and video game industries. As an application of this technology, a team of 30 faculty, staff, and students from Stanford University and the University of Washington spent the 1998-99 academic year in Italy scanning the sculptures and architecture of Michelangelo. As a side project, we also scanned 1,163 fragments of the Forma Urbis Romae, a giant marble map of ancient Rome. We are currently back in the United States processing the data we acquired. Our goal is to produce a set of 3D computer models - one for each statue, architectural setting, and map fragment we scanned - and to make these models available to scholars worldwide. The motivations behind this project are to advance the technology of 3D scanning, to place this technology in the service of the humanities, and to create a long-term digital archive of some important cultural artifacts. Our sponsors are Stanford University, Interval Research Corporation and the Paul G. Allen Foundation for the Arts. Our collaborators, a mix of computer scientists and art historians, include the Italian museums and institutions whose names are listed below. Since 1992 Professor Marc Levoy and his students have been investigating methods for digitizing the shape of three-dimensional objects using laser scanners. Our early efforts in this area were optimistically called the "project to build a 3D fax machine". In 1996, we digitized a small buddha statuette and emailed the computer model from Palo Alto to a fabrication facility in Los Angeles where an accurate replica was made, thus demonstrating at least the feasibility of building such a machine. Ours was not the only research group working on 3D digitization. By 1996 a group at the National Research Council of Canada was regularly scanning museum and heritage artifacts. However, nobody had digitized a large statue with enough precision to serve as a primary resource for scientific work, and nobody had tried to digitize a large and coherent collection of statuary. Hence the impetus for the Digital Michelangelo Project.'
