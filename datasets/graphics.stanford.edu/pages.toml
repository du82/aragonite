["https://graphics.stanford.edu/projects/forma-urbis"]
title = "Digital Forma Urbis Romae Project"
full_description = "The Forma Urbis Romae, also known as the Severan Marble Plan, is a giant marble map of ancient Rome. Measuring 60 feet wide by 45 feet high and dating to the reign of Septimius Severus (circa 200 A.D.), it is probably the single most important document on ancient Roman topography. Unfortunately, the map lies in fragments - 1,186 of them, and these fragments cover only a fraction of the original map surface. Piecing this jigsaw puzzle together has been one of the great unsolved problems of classical archaeology. The fragments of the Forma Urbis present many clues to the would-be puzzle solver: the pattern of surface incisions, the 2D (and 3D) shapes of the border surfaces, the thickness and physical characteristics of the fragments, the direction of marble veining, matches to excavations in the modern city, and so on. Unfortunately, finding new fits among the fragments is difficult because they are large, heavy, and numerous. We believe that the best hope for piecing the map together lies in using computer shape matching algorithms to search for matches among the fractured side surfaces of the fragments. In order to test this idea, we need 3D geometric models of every fragment of the map. To obtain this data, during June of 1999 a team of faculty and students from Stanford University spent a month in Rome digitizing the shape and surface appearance of every known fragment of the map using laser scanners and digital color cameras. Our raw data consists of 8 billion polygons and 6 thousand color images, occupying 40 gigabytes. The goals of the Digital Forma Urbis Romae Project are threefold: to assemble our raw range and color data into a set of 3D (polygon mesh) models and high-resolution (mosaiced) photographs - one for each of the 1,186 fragments of the map, to develop new shape matching algorithms that are suitable for finding fits between 3D models whose surfaces are defined by polygon meshes, and to use these algorithms to try solving the puzzle of the Forma Urbis Romae. Whether or not we succeed in solving the puzzle, one of the tangible results of this project will be a web-accessible relational database giving descriptions and bibliographic information about each fragment and including links to our 3D models and photographs."
year_published = 2025
clearnet = "https://graphics.stanford.edu/projects/forma-urbis"
