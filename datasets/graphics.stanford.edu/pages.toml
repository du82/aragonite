["https://graphics.stanford.edu/lab_directions.html"]
title = "Directions for getting to our laboratory"
full_description = '''Visitor parking is available in a parking structure at the corner of Campus Drive and Roth Way, one block north of Gates. The structure includes "A" and "C" permit parking, as well as pay parking. If you park in an A or C lot, and we have offered to provide parking for you, then come to our lab, and we will give you a one-day permit to place on your dashboard. Most parking restrictions are weekday-only and end at 4:00 pm. When you approach the building, the main entrance is on Serra Street. It says "William Gates, Computer Science" above the door. This entrance leads directly to the lobby and elevators. You may also use the east entrance, on the Palm Drive side, opposite the biology building (Gilbert Hall). It says "Engineering Venture Fund Laboratories." From here, the lobby and elevators are to your left, and the nearest staircase is to your right. However, do not enter the building via the multiple double doors lining the bulbous protrusion on the east side of the building. They lead only downstairs to the classrooms. The graphics laboratory is in wing 3B, i.e. on the 3rd floor, to the left (but not behind you) as you exit the elevators. As you enter the wing, the hallway splits to the left and right, around the laboratory. For Marc Levoy's and Pat Hanrahan's offices, take the left split. For the conference room (392), take the right split. Here is a postscript map of the third floor; however, the room labeling is obsolete. Marc Levoy is in room 366, 725-4089, or 5-4089 from a campus phone. Pat Hanrahan is in room 370, 723-8530. Our admins are Monica Niemiec, mniemiec at graphics.stanford.edu, (650)725-9494, and Jillian Hess, jrhess at stanford.edu (650)723-3118, both in room 368.'''
