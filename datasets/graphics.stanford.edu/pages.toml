["http://graphics.stanford.edu/courses/cs348b-competition/cs348b-01"]
title = "CS 348b Spring 2001 Rendering Competition"
full_description = "These images were created for the rendering competition in Pat Hanrahan's CS 348b class: Image Synthesis Techniques in the Spring quarter of 2001. Greg Humphreys was the TA, so he created this page. On top of all this, they modified their renderer to generate lightfields, and wrote a standalone lightfield viewer to adjust the viewpoint and depth of field after rendering. Did I mention they implemented a tilt/shift lens model to more accurately capture the perspective distortion in the original picture? Since they really hadn't done much, they also implemented a message-passing based parallel version of their renderer using MPI, which came in handy when rendering their 3.5MB of RIB input (along with 12 MB of texture)."
