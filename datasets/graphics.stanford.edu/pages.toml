["http://graphics.stanford.edu/courses/cs348b-competition/cs348b-96"]
title = "cs348b-96 rendering competition"
full_description = '''Lucas and Szymon won the '96 rendering competition with two scenes that showcased their rendering effects. The first was a simulation of a growing Amethyst crystal. The crystal was modeled as a set of approximately 450 transparent, intersecting polyhedra. Each of these is generated from one of two "blueprints", then scaled, rotated, sheared, and translated randomly. Mechanisms were added to the code to make the distribution of locations and sizes somewhat more aesthetically pleasing than if they were purely random. The color and opacity of the crystal were varied using a 3D Perlin turbulence function. Impurities in the crystal were simulated using random walks through the volume. The scene was then rendered using a combination of conventional ray tracing and volume rendering. The last technique was used to accumulate color and opacity only when a ray intersected the crystal geometry. The dollar bill and coins use scanned textures to modulate both color and shading. The geometry of the dollar is a rectangular height grid, tesselated with triangles. The height field was modeled as a fractal and smoothed to make it look a little more continuous. Notice that shadows due to the dollar bill are soft; the effect was achieved using a distribution ray tracer that modeled area light sources and penumbrae. Bump maps were used for all the coins. These were created using an interesting artifact of our graphics lab scanner. In the winners' words: "Our program took advantage of the fact that this scanner has three separate light sources for the three colors, so that there would be a red or green shift in the scanned color of bumps, depending on the tilt of the surface. We started by scanning a coin, rotating it 90 degrees, and scanning it again. Then we used xv to rotate/crop the images so that they were aligned. The first image gave us the information for the horizontal tilt of the normal, and the second image gave us the vertical tilt. Our program would take the difference between red and green in each image, and normalize it so that the average value was 127. It would output a single bumpmap image, where the red component controlled horizontal rotation, and the green component controlled vertical rotation of the normal."'''
year_published = 2025
clearnet = "http://graphics.stanford.edu/courses/cs348b-competition/cs348b-96"
