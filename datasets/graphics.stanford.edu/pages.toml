["http://graphics.stanford.edu/courses/cs468-06-winter"]
title = "CS 468 -- Geometric Algorithms Seminar -- Winter 2005-06"
full_description = "General note: The topic this quarter is geometric approximation algorithms. The intention is to really go into the details of the arguments. In many of these works, the proof techniques are at least as interesting and important as the results themselves. These techniques recur through many different works and, once understood, can be used in our own research. Sariel Har-Peled, Yusu Wang: Shape Fitting with Outliers. SIAM J. Comput. 33(2): 269-285 (2004). PDF file for this paper. Sanjeev Arora: Polynomial Time Approximation Schemes for Euclidean Traveling Salesman and other Geometric Problems. J. ACM 45(5): 753-782 (1998). PDF file for this paper. Stavros G. Kolliopoulos, Satish Rao: A Nearly Linear-Time Approximation Scheme for the Euclidean k-median Problem. ESA 1999: 378-389. PDF file for this paper. Mihai Badoiu, Sariel Har-Peled, Piotr Indyk: Approximate clustering via core-sets. STOC 2002: 250-257. PDF file for this paper. Sariel Har-Peled, Akash Kushal: Smaller coresets for k-median and k-means clustering. Symposium on Computational Geometry 2005: 126-134. PDF file for this paper. For optional material and context, see also Amit Kumar, Yogish Sabharwal, Sandeep Sen: Linear Time Algorithms for Clustering Problems in Any Dimensions. ICALP 2005: 1374-1385. PDF file for this paper."
