["http://graphics.stanford.edu/courses/cs348b-competition/cs348b-95"]
title = "cs348b-95 rendering competition"
full_description = '''The bridge, neck, sides, and bottom of the guitar were created in a similar manner. The fretboard was modeled by a combination of a texture map, reflection map, and bump map derived from scannings of the actual fretboard. The strings are modeled by small parallelepipeds with interpolated normals. The are partially reflective and partially refractive, mocking the material properties of nylon strings. The mirror on the left has that annoying blurring effect found on all mirrors (though I exaggerate the effect). Because mirrors are just a layer of silver on the back of a piece of glass, there is a small amount of reflection of the top layer of the glass. I model this as a surface phenomenon. For those interested in the artwork, the paintings are, from left to right, Magritte's "Chateau des Pyrenees", DaVinci's "Mona Lisa", Seurat's "Sunday Afternoon on the Grande Jatte", Dali's "Persistence of Memory", and Vermeer's "The Concert". In the sphere you can make out Escher's "Dewdrop".'''
