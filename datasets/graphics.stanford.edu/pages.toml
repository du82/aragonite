["http://graphics.stanford.edu/courses/cs348b-competition/cs348b-99"]
title = "cs348b-98 rendering competition"
full_description = '''"We implemented texture mapping using SGI RGB files as input. Textures are supported to modulate the diffuse, ambient, emissive, specular, transparency, shininess, and bump mapping. We created a physical simulation of cloth as a stand alone modeling tool written using OpenInventor. A simple keyboard user interface allows the user to blow bursts of wind at a sheet suspended from a number of points. ... The cloth is modeled as a grid of masses, each connected to its four immediate neighbors by a spring. Also, second neighbors are connected by a weak spring in order to simulate rigidity, so the cloth is not completely flexible. A set of suspension points on one side of the cloth are not allowed to acquire velocity, all other points are updated according to newtonian physics. We implemented fractal terrains using the "diamond-square" method invented by Gavin Miller. A very good informal description of the method can be found at: http://www.gameprogrammer.com/fractal.html We implemented simple trees by recursively extending branches out from a trunk segment. The trees are modeled in OpenInventor using Cylinders at the branch segments. Each branch can divide into two sub-branches, each having smaller diameter and length. We implemented a simple tool in OpenInventor to allow us to generate a camera motion for animation. It allows the user to specify a set of key frame positions for the camera. Frame counts are specified between key frames. The in-betweens are filled in by linearly interpolating between camera positions." "I implemented a variety of procedural solid textures. These textures use noise functions to alter many different surface properties, including the ambient and diffuse colors, transparency, reflection coefficient, and surface normal. The textures are based on the noise functions of Perlin (Siggraph 1985, pp. 287-296) and Worley (Siggraph 1996, pp. 291-294). The sky texture in both images uses fractal Perlin noise to modulate the ambient color. The ocean water and cliff face are both bump mapped based on the fractal version of Worley's F1 function. The marble texture on the columns is created by using Perlin noise to modulate the phase of a sine wave. The colored mosaic pattern is created using Worley's functions. F2-F1 is used to define the gaps between stones, while each stone is colored based on the identity of the nearest feature point. F1 is used to bump map the stones, giving them a rounded appearance. The leaves climbing up the columns are created by using the F2 function. The dolphin was modeled by hand using Pixels3D on the Macintosh, based on photographs of bottlenosed dolphins. The splash consists of 300 tiny spheres. I wrote a Matlab script to generate the points according to a reasonable, radially symmetric distribution, and output them as an Inventor file. The water in the pool was generated by adding together various sine waves, plus a small amount of random noise, to create a hightfield."'''
year_published = 2025
