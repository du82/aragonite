["http://graphics.stanford.edu/~levoy"]
title = "Marc Levoy's Home Page"
full_description = "div.retired-note { BORDER: 1px solid #333; PADDING-LEFT: 10mm; PADDING-RIGHT: 5mm; PADDING-BOTTOM: 3mm; PADDING-TOP: 3mm; WIDTH: 13.0in; FLOAT: center; BOX-SHADOW: 6px 6px 6px #444; BACKGROUND-IMAGE: linear-gradient(180deg, #fff, #ddd 40%, #ccc); max-width: 920px; } Marc Levoy is the VMware Founders Professor of Computer Science (Emeritus) at Stanford University and a Vice President and Fellow at Adobe. In previous lives he worked on computer-assisted cartoon animation (1970s), volume rendering (1980s), 3D scanning (1990s), light field imaging (2000s), and computational photography (2010s). At Stanford he taught computer graphics, digital photography, and the science of art. At Google he launched Street View, co-designed the library book scanner, and led the team that created HDR+, Portrait Mode, and Night Sight for Pixel smartphones. These phones won DPReview's Innovation of the Year (2017 and 2018) and Smartphone Camera of the Year (2019), and Mobile World Congress's Disruptive Innovation Award (2019). Levoy's awards include Cornell University's Charles Goodwin Sands Medal for best undergraduate thesis (1976) and the ACM SIGGRAPH Computer Graphics Achievement Award (1996). He is an ACM Fellow (2007) and member of the National Academy of Engineering (2022). I love teaching. After becoming full-time at Google, and finding people there who wanted to know more about photography, I decided to teach a revised but nearly full version of my Stanford course CS 178 (Digital Photography) at Google. These lectures were recorded and edited to remove proprietary material, at which point Google permitted me to make them public. Here is a link to this course, which I called Lectures on Digital Photography. I also uploaded the lecture videos as a YouTube playlist, where to my surprise they went viral in September 2016. A Googler made a word cloud (at left) algorithmically from the comments on those videos and sent it to me as a gift. In a word cloud the size of each word is proportional to the number of times it appears in the text being processed by the algorithm. It's one of the nicest gifts I have ever received. For several years my research focused on making cameras programmable. One concrete outcome of this project was our Frankencamera architecture, published in this SIGGRAPH 2010 paper and commercialized in Android's Camera2/HAL3 APIs. To help me understand the challenges of building photographic applications for a mobile platform, I tried writing an iPhone app myself. The result was SynthCam. By capturing, tracking, aligning, and blending a sequence of video frames, the app made the near-pinhole aperture on an iPhone camera act like the large aperture of a single-lens-reflex (SLR) camera. This includes the SLR's shallow depth of field and resistance to noise in low light. The app launched in January 2011, and seeing it appear in the App Store was a thrill. I originally charged $0.99, but eventually made it free. Here are a few of my favorite reviews of the app: MIT Technology Review, WiReD, The Economist. Unfortunately, with my growing involvement at Google I stopped maintaining the app, and it stopped working with iOS 11. That said, SynthCam's ability to SeeInTheDark inspired the development of Night Sight, described in more detail below under My Google career. In 1999 the National Academies published Funding a Revolution: Government Support for Computing Research. This landmark study, sometimes called the Brooks-Sutherland report, argued that research in computer science often takes 15 years to pay off. The iconic illustration from that report is reproduced at right. In 1996 Pat Hanrahan and I begin working on light fields and synthetic focusing, supported by the National Science Foundation. In 2005 Ren Ng, a PhD student in our lab, worked out an optical design that allowed dense light fields to be captured using a handheld camera. This design enabled everyday photographs to be refocused after they are captured. I worked on this technology alongside Ren in the Stanford Graphics Laboratory, and later applied it to microscopy, but the key ideas behind the light field camera were his. (Ren's doctoral dissertation, titled Digital Light Field Photography, received the 2006 ACM Doctoral Dissertation Award.) In the same year Ren started a company called Refocus Imaging to commercialize this technology. In 2011 that company, renamed Lytro, announced its first camera. So 15 years from initial idea to first product. An exciting ride, but a long wait. At left is the Lytro 1 camera, and below it the first picture I took using the camera, refocused after capture at a near distance, then a far distance. Unfortunately, aside from being refocusable Lytro cameras didn't take great pictures, and refocusability wasn't a strong enough differenting feature to drive consumer demand, so the product (and the follow-on Lytro Illum camera) weren't successful. Eventually, portrait modes on mobile cameras provided similar refocusing and shallow depth of field, but without sacrificing spatial resolution as microlens-based light field cameras do. While the synthetically defocused pictures produced by mobile cameras are not physically correct, it's hard to tell the difference. BTW, Ren Ng is now a professor in EECS at UC Berkeley. What do the two images at left have in common? In the mid-1990s, three students in my lab (Andrew Beers, Brian Freyburger, and Apostolos Lerios) left the PhD program to co-found Invisalign. The company's genesis is described in this Interesting Engineering article, from which the upper image at left was taken. Initially they planned to use 3D laser scanning (3rd image from left above). They later pivoted to taking a mold of your teeth, slicing the mold finely using a milling machine, and photographing each slice to build a 3D model. (They may have since pivoted to another technology.) This gave me an idea - why not slice everyday objects thinly, photograph each slice, and volume render the resulting stack of images? As an experiment, I glued together blocks of wood (lower image at left), sliced the block thinly using Invisalign's milling machine, and photographed each slice. Here's a grayscale video of the resulting image stack. The objects at lower right are pine cones embedded in resin. Isn't it interesting how wood grain changes shape over depth? Watch the knots move around in this block of maple. Knots are twigs from an early stage of tree growth, which eventually become embedded in the thickening branch from which they sprang. My plan was to volume render this and other natural objects (marble veining?), and write a book (or create a web site) of visualizations. I would call the book Volumegraphica (or Volumegraphia, inspired by Robert Hooke's 1665 book Micrographia, which contains beautiful drawings of what he could see through a microscope). An early attempt at volume rendering that block of maple is shown at right. Click on it for a video; you can clearly see the twig buried inside the block. Unfortunately, I never found time to puruse this sabbatical-type project, becoming involved instead in multi-camera arrays and light field microscopy (see images above). I also found it challenging to fix natural objects so they don't fall apart in the milling machine, especially if they contain cavities (like conch shells). For more details, see this slide deck. And for some related projects that use 3D medical imaging technologies instead of physical slicing, see the Visible Human Project, or this stunning volume rendering of a mouse tail from Resolution Sciences."
