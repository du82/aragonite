["http://graphics.stanford.edu/courses/cs468-10-fall"]
title = "CS468: Geometry Processing Algorithms Home Page"
full_description = "Announcements General Info Course Staff Resources Schedule & Assignments Announcements 09/22/10: Welcome to the course! 09/22/10: Homework 1 is available here. The due date is 10/6, midnight. If you have questions, please ask them on the forum. General Information Times & Places MW 2:15 - 3:30, Gates 300 Objectives Recent advances in 3D digital geometry processing have created a plenitude of novel concepts for the mathematical representation and interactive manipulation of geometric models. This course covers some of the latest developments in geometric representations, modeling and processing. Topics include: Surface modeling based on triangle meshes Mesh generation Mesh fairing and simplification Parameterization and remeshing Subdivision schemes Mesh editing and deformation Programming exercises will help translate theoretical concepts to practical applications. A code framework will be provided that allows to experiment with various algorithms without having to bother about software infrastructure. There will be 5 modest programming assignments, and no final exam. Prerequisites Introduction to Computer Graphics, experience with C++ programming. Some background in geometry or computational geometry is helpful, but not necessary. Resources OpenMesh: OpenMesh web page OpenMesh documentation Mesh manipulation: MeshLab Graphite Models: AIM@SHAPE Repository Princeton Segmentation Database (82M) Course Staff Name Email Phone Office Hours Mirela Ben-Chen mirela-at-stanford-dot-edu 725-8818 TBA Andy Lai Lin ydna-at-stanford-dot-edu"
