full_description = "The colloquium started on Thursday, April 2nd, 1998, and met on a weekly basis at 4:15 on Thursdays in Gates 104. Apr 2 John Craig (Adept Technology) Geometric Algorithms in AdeptRAPID Apr 9 Jitendra Malik (U.C.Berkeley) Computational Mechanisms Of Visual Grouping Apr 16 Ben Kuipers (U Texas at Austin) Exploration and Reasoning in Large-Scale and Visual Spaces Apr 23 John McCarthy (Stanford U) From Where AI Is Now to Human-Level AI Apr 30 Christos Papadimitriou (U.C.Berkeley) Topological Reasoning In Two Dimensions May 7 Fausto Giunchiglia (IRST, Trento Italy) Model Checking Multiagent Systems May 8 Special Additional Colloquium: (11am, Gates B12) Tom Dean (Brown University) Exploiting Structure in Solving Planning Problems May 14 Judea Pearl (UCLA) From Bayesian Networks to Actions, Causes, and Counterfactuals May 21 Michael Lowry, Jeffrey Van Baalen, Klaus Havelund Automated Software Engineering Research at NASA Ames May 28 Kenneth Salisbury (MIT) Touching and Being Touched: Robot Hands, Arms and Haptic Interfaces Top Fall 1998 The AIRV colloquium began on Wednesday, October 7, 1998, and met on an approximately BI-WEEKLY basis at 4:15 on Wednesdays in Gates B12. The colloquium was interleaved with the Geometry-Graphics-Robotics-Vision (GGRV) seminar for the autumn quarter. (GGRV) Wed Oct 7 Marshall Bern (Xerox PARC) Surface Reconstruction by Voronoi Filtering (AIRV) Wed Oct 14 Russ Altman (Stanford U) AI in medicine: The spectrum of challenges from managed care to molecular medicine (AIRV) Wed Oct 21 Erik Sandewall (Linköping University) Reasoning about the Actions of an Intelligent UAV (GGRV) Wed Oct 28 Ken Goldberg (USC) Trap Design for Vibratory Bowl Feeders (GGRV) Wed Nov 4 David Forsyth (UC Berkeley) Finding People and Animals in Large Collections of Images (AIRV) Wed Nov 11 Daniel Lehmann (Hebrew University, Israel) Nonmonotonic Logics and Semantics (GGRV) Wed Nov 18 Ramin Zabih (Cornell U) Fast Graph Algorithms for Bayesian Computer Visi