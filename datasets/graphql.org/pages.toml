full_description = "BlogProgrammableWeb: GraphQL Moving to Neutral, Open-Source FoundationProgrammableWeb: GraphQL Moving to Neutral, Open-Source FoundationNovember 8, 2017 by ProgrammableWebin the newsGraphQL will now have its own foundation: the GraphQL Foundation. Although GraphQL was initially incubated by Facebook, GraphQL is now utilized heavily by a diverse set of companies including major tech giants (e.g. Twitter, Airbnb, Shopify, etc.). Accordingly, it makes sense that the data query language move to a neutral, open source home. Like many open source projects, the GraphQL Foundation will be hosted by the Linux Foundation. Linux will implement an open governance model similar to many collaborations overseen by Linux. The exact details of the model, and future plans continue to be a work in progress. The current founding members include Airbnb, Apollo, Coursera, Elementl, Facebook, GitHub, Hasura, Prisma, Shopify and Twitter. Read More"
