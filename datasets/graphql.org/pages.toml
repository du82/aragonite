full_description = "BlogCopilot Travel Joins the GraphQL FoundationCopilot Travel Joins the GraphQL FoundationMarch 12, 2024 by Jory BursonblogWe’re thrilled to announce that Copilot Travel is now a General Member of the GraphQL Foundation. This partnership underscores our shared commitment to driving innovation and collaboration within the GraphQL ecosystem. With Copilot Travel’s expertise in leveraging cutting-edge technologies to enhance the travel experience, their involvement will undoubtedly enrich our community. Together, we anticipate active participation in working groups, contributions to open-source projects, and collaborative efforts to advance GraphQL adoption across various industries. At the GraphQL Foundation, we recognize the transformative power of collaboration in shaping the future of technology. With Copilot Travel on board, we’re excited to embark on this journey of exploration and innovation, unlocking new possibilities for GraphQL in the connected travel industry. Check out our Landscape to learn more about our Member organizations and how other companies leverage GraphQL: https://landscape.graphql.org/"
