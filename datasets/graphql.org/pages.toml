title = "eWeek: GraphQL API Specification Moving Forward with Independent Foundation | GraphQL"
full_description = "BlogeWeek: GraphQL API Specification Moving Forward with Independent FoundationeWeek: GraphQL API Specification Moving Forward with Independent FoundationNovember 6, 2018 by eweekin the newsThe Linux Foundation announced on Nov. 6 that it is forming a new foundation to support the open source GraphQL specification, which enables a new generation of APIs. For nearly two decades, REST (Representational State Transfer) has been one of the primary approaches for enabling APIs that help to connect and extend applications and web services. REST however has multiple limitations, which is where GraphQL steps into the picture, finding wide adoption by large web properties. GraphQL was created in 2012 by Facebook and became open source in 2015. The move to create a new vendor-neutral independent foundation under the Linux Foundation will serve to help further advance the development of GraphQL. Read more"
