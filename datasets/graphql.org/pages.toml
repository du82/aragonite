description = "Join the official GraphQL Conference by the GraphQL Foundation in Amsterdam, Netherlands, from September 8-10, 2025. Discover the future of GraphQL with leading experts, workshops, and networking opportunities."
full_description = '''GraphQLConf 2025September 08-10, 2025|Amsterdam, NetherlandsCelebrating 10 Years of GraphQL. Three transformative days of expert insights and innovation to shape the next decade of APIs together!Get TicketsSponsorsSilver↗Why Sponsor?Connect with the global GraphQL community and showcase your brand to industry leaders and decision-makers.Brand VisibilityShowcase your brand to thousands of GraphQL enthusiasts and decision-makers.Lead GenerationConnect with potential customers and partners in the GraphQL ecosystem.Thought LeadershipPosition your company as a leader in the GraphQL space.Talent AcquisitionMeet and recruit top GraphQL developers and engineers.Product FeedbackGather valuable feedback from the GraphQL community.Community ImpactSupport and shape the future of GraphQL technology.Download ProspectusCall for ProposalsPutting on an amazing conference depends on great content, which is where you come in! Join other GraphQL leaders and community members as a presenter by submitting to our Call for Proposals (CFP) and sharing your experience across a wide range of topics. Please click through all of the tabs below before submitting a proposal.For any questions regarding the CFP process, please email cfp@linuxfoundation.org.Submit a ProposalPlease be aware that the Linux Foundation uses Sessionize for CFP submissions. Sessionize is a cloud-based event content management software designed to be intuitive and user-friendly. If you need guidance, please review how to submit your session for an event to see step-by-step instructions and helpful screenshots.DatesTopicsTypesNotesDates to RememberCFP Opens: Tuesday, 4 FebruaryCFP Close: Sunday, 4 May at 23:59 CEST (UTC+2)CFP Notifications: Monday, 9 JuneSchedule Announced: Wednesday, 11 JuneSlides due date: Friday, 5 SeptemberEvent Dates: Monday, 8 September - Wednesday, 10 September, 2024RegisterJoin a diverse community of GraphQL developers, architects, and enthusiasts while experiencing premium content and networking opportunities in a vendor-neutral environment. We never sell attendee lists or contact information, nor do we authorize others to do so. If you receive an email claiming to sell an attendee list for a Linux Foundation event, please forward it to events@linuxfoundation.org.SpeakersYou should have received a registration link in your acceptance email. If you did not, please contact cfp@linuxfoundation.org for more details.SponsorsA registration link was shared in an email to your company's sponsorship contact. Please reach out to your company’s sponsorship contact if you need to register as a Sponsor. For further questions, please email graphql_events@linuxfoundation.org.MediaIf you are a member of the media interested in attending this event and have not received a complimentary access code to attend, contact us at graphql_events@linuxfoundation.org.RatesThe registraion deadlines is 23:59 on the respective date.Early BirdThrough 13 July$599Standard14 July - 31 August$799Late1 September - 10 September$899Get TicketsVenueConferencePakhuis De Zwijger Piet Heinkade 179, 1019 HC Amsterdam, NetherlandsHow to get to the venue?Public TransportationTake tram 26 from Amsterdam Central Station to the "Rietlandpark" stop. The venue is a 5-minute walk from there.Airport InformationAmsterdam Airport Schiphol is about 20 km from the venue. Take a direct train to Amsterdam Central Station, then follow the public transportation instructions.Parking at venueLimited parking is available at the venue. We recommend using public transportation when possible. Learn more about parking at Pakhuis de Zwijger. If you require an accessible parking spot, park at Vriesseveem 4 or Withoedenveem 16 where you can park if you have a Disability Parking Card.Hotel InformationThe Linux Foundation has not contracted rooms at these properties and cannot guarantee rates or availability.Mövenpick Hotel Amsterdam City CentrePiet Heinkade 11 1019 BR Amsterdam, Netherlands Phone: +31 20 519 1200Inntel Hotels Amsterdam LandmarkVOC-kade 600 1018 LG Amsterdam, Netherlands Phone: +31 20 227 2550DoubleTree by Hilton Amsterdam Central StationOosterdoksstraat 4 1011 DK Amsterdam, Netherlands Phone: +31 20 530 0800FrequentlyAsked QuestionsYou can find much more information on our Resources page.When will speakers and the agenda be announced?Stay tuned to our social media channels and website for updates on speakers and the agenda.Can I sponsor the event?Yes! We offer various sponsorship packages. See this section for more information.Are there group discounts for teams?If you have a group of 5 or more people, you can receive a 10% discount on all passes. All pass types must be the same, and all registrations must be processed under one group registration and must be paid with the same credit card. To create a group, select “Add Another Person” to your registration. When 5 or more people are added the 10% discount will be automatically applied. registration@linuxfoundation.org for any questions.What is the refund and cancellation policy?If you must cancel for any reason, please sign back into your registration, click the “Register/Modify” button and select “Unregister.” If you need further assistance, please contact registration@linuxfoundation.org.Refunds will only be issued for cancellations received two weeks prior to the event start date, including bulk ticket request refunds, and will appear as a credit on the card's statement 7-10 business days after cancellation. Individual refund requests for late cancellations due to sickness or emergency will be considered on a case by case basis - registration@linuxfoundation.org.Refunds can only be issued on the card the original payment was made.Can I transfer my registration?If you are unable to attend, you may substitute another attendee in lieu of cancellation. To substitute an attendee, sign back into your registration, click the “Register/Modify”, and select “Transfer Registration” on your confirmation page.Can I get certificate of attendance?You can download your Certificate of Attendance directly from your LFX dashboard by navigating to the "Past Events" section in the LF Events column. Please Note: We verify attendance through the registration system, and certificates will only be available for download after the event is completed.How do I request a visa letter?You must be registered for the event before requesting a visa letter. Please note: it can take up to an hour for our registration system and visa letter system to sync. Request a visa letter.Where can I find health and safety information for the event?Your well-being is our top priority. We continuously update our health and safety guidelines based on local regulations. Information about food allergies, medical resources, emergency contacts, and safety services can be found on this page.What accessibility and onsite resources are available?We are committed to providing a comfortable and accessible experience for all attendees. Onsite resources include a private nursing room, venue accessibility support, reserved seating, a quiet room, communication and pronoun stickers, all-gender restrooms, first aid assistance, and a process for handling harassment reports. For full details on these resources, please visit this page.Looking for more?Checkout our Resources page.Cannot find the answer to your question?You are welcome to email us graphql_events@linuxfoundation.org.'''
