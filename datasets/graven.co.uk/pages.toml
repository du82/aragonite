["https://graven.co.uk/graven-celebrates-being-part-of-award-winning-team-as-statkraft-takes-home-bco-scottish-design-award"]
title = "Graven celebrates being part of award-winning team as Statkraft takes home BCO Scottish Design Award | Graven"
full_description = "Graven celebrates being part of award-winning team as Statkraft takes home BCO Scottish Design Award A project with innovation and sustainability at its heart has taken home a prestigious award at this year’s British Council for Offices (BCO) Scottish Awards in Glasgow. Europe’s largest renewable energy producer, Statkraft, commissioned Graven to design their first dedicated office in Scotland and, alongside a talented project team, delivered a vibrant, fun and sustainable space in the historic Garment Factory building in Glasgow’s Merchant City. Designed by Graven, Statkraft has created a welcoming space for collaboration, bringing the outdoors inside, with sustainability at its core. Representing Statkraft’s values and Norwegian heritage, the judges were impressed that they had incorporated reclaimed, recycled and upcycled elements throughout, whilst respecting the existing characteristics of the existing building. The feedback from the Statkraft team has been immensely positive and should act as a catalyst for the company’s continued growth in Scotland and beyond. The project will now compete at the BCO National Awards on 8th October 2024. The award closely follows Graven’s Robin Ellis winning the BCO NextGen Rising Star Scotland award. Robin is Graven’s sustainability champion, a talented architectural designer who has been a key part of Graven’s sustainability team deepening the studio’s expertise of the lifecycle impacts of materials, sustainable processes, and products. Graven Director, Kirsty Lang, said: “To be recognised for our work on this fantastic project is testament to both Graven’s talented team and Statkraft, a fully engaged client with high aspirations and sustainable values. “Sustainability was at the heart of this project. At Graven, we feel a responsibility to reuse, recycle and upcycle materials and make flexible future proof spaces that work really hard and this project is a prime example of creating a new, vibrant working environment with recycled materials, in a historic building in Glasgow’s city centre with a great sense of community. “There was a good energy and great collaboration across the project team, led by Workplace Scotland. We look forward to the BCO National Awards in October!” Iain Robertson, Head of Statkraft Scotland, added: “The team at Graven embraced the brief and captured it perfectly, consulting with us closely throughout the entire process. They have created an office that has set a new benchmark for Statkraft, loved by all who work here. The award is just recognition for Graven’s creativity, and for the entire project team.” Project Team: Workplace Scotland, CBA Chartered Quantity Surveyors, Ashwood Scotland, Civic Engineers, Troup Bywaters + Anders, Harvey McLean Custom Joinery, KDR Projects and Glasgow PlantMama."
