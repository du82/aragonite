["https://graven.co.uk/portfolios/friends-of-glasgow-royal-infirmary-glasgow"]
title = "Friends of Glasgow Royal Infirmary, Glasgow | Graven"
full_description = "Friends of Glasgow Royal Infirmary, Glasgow We were thrilled to help Friends of Glasgow Royal Infirmary create their brand identity, showcasing the hospital’s impact on medicine and the city of Glasgow. Glasgow Royal Infirmary has always played an important role in medical innovation and sits proudly in the Glasgow City Innovation District. We used this opportunity to create a logo that highlighted the hospital’s role in innovative medicine, focusing on the healing plants and flowers that have a connection to medicine and, at times, the city of Glasgow. The design was inspired by St.John Wort St. John’s Wort (SJW) is an herbaceous medical plant. Since ancient times, SJW has been used to treat different kinds of mental and physical diseases and, for its antiseptic, anti-inflammatory and antibacterial properties. Sphagnum moss Sphagnum moss was one that was used right up untilWWII, which had been used for centuries before. This was a very spongy moss which would be used to pack wounds. Due to the absorbent quality, it was excellent for soaking up the blood of wounded soldiers. Not only that, the moss has a natural antiseptic quality, meaning it would kill off any bacteria present in the wound. Dryopteris oreades (Male Fern) Male fern is used to treat nosebleeds, heavy menstrual bleeding, wounds, and tumors. It is also used to expel worms, typically tapeworms, from the intestines. Some veterinarians use male fern to treat worms in animals. Honey Raw honey has been used as a folk remedy throughout history and has a variety of health benefits and medical uses. It’s even used in some hospitals as a treatment for wounds. Many of these health benefits are specific to raw, or unpasteurized, honey. Rod of Asclepius The Rod of Asclepius takes its name from the Greek god Asclepius, a deity associated with healing and medicinal arts in Greek mythology. Client Friends of Glasgow Royal Infirmary Scope of Services Brand identity Location Glasgow Photography"
year_published = 2025
