["https://graven.co.uk/chivas-brothers-kilmalid-wins-at-bco-regional-awards-2023"]
title = "Chivas Brothers Kilmalid wins at BCO Regional Awards 2023 | Graven"
full_description = "Chivas Brothers Kilmalid wins at BCO Regional Awards 2023 Many thanks to Chivas Brothers for hosting our fantastic project team at the British Council for Offices (BCO) Regional Awards 2023. What a great day and brilliant result. The British Council for Offices’ (BCO) mission is to research, develop and communicate best practice in all aspects of the office sector. It delivers this by providing a forum for the discussion and debate of relevant issues. We are so pleased with Chivas Brothers Pernod Ricard‘s win for ‘Refurbishment/Recycled Workplace’ and with their commitment to sustainability and investment in their production team environments, uniting the campus and promoting conviviality. Great to see such high calibre projects across all categories too, congratulations to all the entries! Learn more about our role in the project here."
