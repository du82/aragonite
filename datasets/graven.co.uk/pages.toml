["https://graven.co.uk/access-design-thinking-to-supercharge-your-business"]
title = "Access Design Thinking to Supercharge Your Business | Graven"
full_description = "Access Design Thinking to Supercharge Your Business If you’re looking to supercharge your business, encourage collaboration, generate ideas for new products or services, define and overcome challenges, or drive innovation, Design Thinking is the approach you need. Design Thinking is the process used by designers, architects and creative professionals. It is a productive way to address challenges, to help you and your team to develop new skills and knowledge, to overcome obstacles and unlock innovation. Spreng Thomson and Graven have been appointed to the framework for the Glasgow Business Growth Programme (GBGP) enabling businesses across the city to apply for funds to learn about Design Thinking and apply this to address their challenges. The GBGP, funded by the UK Shared Prosperity Fund and delivered by the City’s Business Growth Team aims to help SMEs in Glasgow by helping them to access a network of expert consultancy support. Graven and Spreng Thomson have combined their international design and communication skills to develop a Design Thinking approach that suits businesses and organisations at all scales. Throughout the Design Thinking process clients are able to call on the combined expertise of Graven and Spreng Thomson to test their thinking and ideas through the robust lens of Design Thinking. Businesses can also be supported to implement their ideas using Graven and Spreng Thomson’s experience including in brand creation, graphic and website, packaging and interior design including retail, workplace and leisure environments as well as communication and social media strategies. Design Thinking consultancy support will be delivered by Professor Janice Kirkpatrick OBE, founder and Creative Director of international design studio, Graven and Lesley Thomson, founder and Managing Director of Spreng Thomson. Learn more about Graven and how we can help you here."
