["https://graven.co.uk/portfolios/blythswood-square-hotel-glasgow-2"]
title = "Blythswood Square Hotel, Glasgow | Graven"
full_description = "Blythswood Square Hotel, Glasgow Having first worked on the Blythswood Hotel back in 2007, Graven was thrilled to work on the re-design of Kimpton’s Blythswood Square Hotel’s penthouse suite, as well as their new Bo & Birdy restaurant space in the heart of Glasgow city centre. Blythswood Square Hotel, Glasgow’s five star hotel, offers a special experience with their penthouse, which stretches over 1,850 sq. ft. (spanning the size of a good sized family home). The two bedroom penthouse has an outdoor terrace with great views across the city, as well as full kitchen, bar and dining room. The master suite is luxurious with a dressing room and full marble bathroom (including a bespoke steam room and sunken bath with integrated TV). Bo & Birdy at the Blythswood has opened to rave reviews, under the guidance of Head Chef Gillian Matthews. Bo & Birdy is a modern brasserie re-imagined through a traditional Scottish lens. Graven’s refurbishment is quietly elegant. The new island bar is Glasgow’s best spot for cocktails, and the best place to be seen with rock stars and celebrities. Client Kimpton Scope of Services Interior Design Location Glasgow, Scotland Photography © Renzo Mazzolini Photography"
