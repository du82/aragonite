title = "3 St Andrew Square, Edinburgh | Graven"
full_description = "3 St Andrew Square, Edinburgh 3 St Andrew Square by Standard Life Investments is one of Edinburgh’s most desirable new residential developments. Graven provided full interior design services to transform the handsome former commercial building into five premium loft apartments as well as creating the visual brand and all marketing material. The visual brand and design responds to the building’s architectural features, commercial history, mercantile character (a 1926 extension to the R W Forsyth department store) and compliments our refined industrial design of the five huge apartments. The premium litho-printed brochure targets the intended corporate let market with photography highlighting the remarkable views and location. Graven created the visual brand, brochure, website and provided all copywriting, plans and elevations as well as directing the creation of CGI visuals and commissioned photography. Client Standard Life Investments Scope of Services Visual brand, interior design, environmental branding, brochure, website, copywriting, CGI visuals, photography direction Location Edinburgh Photography © Graven © Photography by Broad Daylight © CGI visuals by Soluis Save Save Save Save Save"
