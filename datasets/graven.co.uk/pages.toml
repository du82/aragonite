["https://graven.co.uk/portfolios/arm-holdings-glasgow"]
title = "Arm Holdings, Glasgow | Graven"
full_description = "Arm Holdings, Glasgow Arm Holdings is an international tech company that recently acquired a Glasgow based technology firm specialising in creating connected platforms and the Internet of Things. With an aspiration to grow the business to around 250 people in Glasgow, Arm acquired a 2500 sq m at St Vincent Plaza and engaged Graven to create a workplace that would help to attract the best people to join them. We created an internal architecture that delivers a flexible and efficient workplace. There is a huge choice of places to work, to meet and to socialise. Whilst every business needs some formal spaces, our experience is that informal and social spaces are much more important in giving a workplace its character and connecting people to each other. Many of the techniques that we use now in our design of offices were in fact honed in the design of bars and clubs in our early years. Arm is agile and shareable, and there are no enclosed private offices for senior staff. This personifies the idea of the space being collaborative, open and modern. Client Arm Holdings Scope of Services Internal design and architecture Location Glasgow, Scotland Photography © Renzo Mazzolini Photography"
