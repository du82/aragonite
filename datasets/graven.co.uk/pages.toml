["https://graven.co.uk/graven-clients-featured-in-list-of-scotlands-coolest-city-centre-hotels"]
title = "Graven clients featured in list of Scotland’s coolest city centre hotels | Graven"
full_description = "Graven clients featured in list of Scotland’s coolest city centre hotels As part of The Herald’s list of the ten coolest places to stay in the country, we’re pleased to see two of our projects included, The Kimpton Blythswood Square Hotel in Glasgow and Hotel Indigo in Dundee. Having first worked on the Blythswood Hotel back in 2007, Graven has relished the continuity of updating and upgrading the hotel for over fifteen years – the creation of the penthouse suite and the bar and restaurant being particular highlights. For Hotel Indigo, we combined Dundee’s industrial and more recent creative stories to give us a local angle that avoids the obvious interpretations of the city’s past. The public areas are open and flexible, with polished concrete floors and exposed original fabric. We collected unusual and appropriate artefacts to enliven the space (farm equipment to computer games), and created opportunities for ongoing curation. Congratulations to IHG who own both of the brands. You can find out more about the full list here. Find out more about these projects and others here."
