["https://graven.co.uk/diamonds-and-thrills-debuts-in-london-as-rox-opens-in-historic-battersea-power-station"]
title = "‘Diamonds and Thrills’ debuts in London as ROX opens in historic Battersea Power Station | Graven"
full_description = "‘Diamonds and Thrills’ debuts in London as ROX opens in historic Battersea Power Station In its heyday Battersea Power Station supplied London with over one fifth of its electricity. Now, redesigned as a luxurious destination this landmark is sparkling once again as it welcomes ROX first London store. ROX, founded in 2002 by entrepreneurs Grant Mitchell and Kyron Keogh, is the UK’s most exciting independent jewellery retailer with stores in Glasgow, Edinburgh, Aberdeen, Leeds, Newcastle, Liverpool and now the UK’s capital, London. Graven is proud to have been part of the ROX journey from the outset, from the early days of the Build My Brand™ process which played a part in creating their now iconic brand and strapline ‘Diamonds and Thrills’ to designing the full experiential retail interior and fitting out all ROX stores across the UK, including this latest venture, which brings ROX signature shopping experience to one of the most exciting and luxurious developments in the country. After decades of sitting derelict, Battersea Power Station is now London’s newest and most exciting urban regeneration project. The building that once produced the energy that enabled people to eat, drink, shop and play is now energising a new generation seeking the most luxurious experiences. Graven co-founder and Director, Ross Hunter, said this about the project; “The growth of ROX across the UK is a source of great pride for the Graven team. We’re thrilled to have played a pivotal role in the ROX journey, including designing the interiors and completing the full fit out for their new store in the incredibly exciting Battersea Power Station. “Graven has played a role in major urban regeneration projects over many years and to be involved in one of this size and stature, both economically and for the London, was a real joy.” Professor Janice Kirkpatrick OBE, Graven co-founder and Creative Director, added; “Battersea Power Station is a transformative regeneration project that will not only change the landscape of this part of the city, but bring substantial social and economic benefits to the wider community. “ROX joins an impressive list of businesses choosing Battersea. At Graven, we’re delighted to help shape how ROX delivers its unique customer experience in a new market and a great new place. “For large scale and expansion projects to seamlessly combine to deliver high quality experiences, all aspects of the process must to come together and be delivered with effort, passion and care. Graven’s work with ROX continues to focus on bespoke high specification fixtures and finishes, luxurious fabrics and an operationally functional layout providing the perfect backdrop for their jewellery and watch collections. We are excited to see how London enjoys the thrilling ROX experience.” Battersea Power Station, London."
