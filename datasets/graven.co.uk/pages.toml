["https://graven.co.uk/about"]
title = "About | Graven"
full_description = "We design beautiful spaces, places and ideas. Graven is an independent design studio owned and run by designers. Founded in 1986 our studio works in over thirty countries with both global brands and ambitious start-ups. We understand how businesses operate and how brands strategically help them grow. In addition to the traditional hand skills of drawing and making we also use state-of-the-art immersive 3D visualisation to inhabit, test and fine-tune projects before they are built—it’s also a great tool for engaging with stakeholders. Our ‘create and automate’ approach quickly and cost-effectively maximises our experience by using the best software to prototype and deliver production packages. We have the in-house skills, knowledge and talent to ensure good projects become really great, including by designing bespoke furnishings, textiles and floor and wall coverings. We’re also known for being good people to work with and we can support your team wherever you are. Sectors Banking & Finance Construction Culture Education Food & Drink Health Hotels, Hospitality & Leisure Luxury Not-for-profit Place Making & Social spaces Professional Services Property Public & Civic (not Government & Local Authority) Restaurants, Cafes, Clubs & Bars Retail Technology Transport Sport Visual brands, Digital, Print & Packaging Workplace Services Animation BuildMyBrand – process – brand modelling – brand auditing – workshops – masterclasses Design strategy Design thinking Digital Engagement & brief building Exhibition Furniture Graphic design & illustration Interior Packaging Publications Place-making Printed textiles Product Service design Signs & way finding Social spaces Verbal branding Visual branding & logotypes Workplace Wall & floor coverings"
