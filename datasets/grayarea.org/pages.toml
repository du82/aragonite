description = "HAPPENING SOON Join live interactive courses, either online or in-person, with access to hands-on instruction and real-time feedback. LEARN AT YOUR OWN PACE Get online audit access to recordings of courses so you can view and listen from home on your own schedule.   Program Highlights Creative Code Intensive Our Creative Code Intensive is a […]"
full_description = "LEARN AT GRAY AREA Our educational programs at Gray Area build 21st century STEAM skills through creative expression, problem solving, and critical engagement with technology. VIEW UPCOMING CLASSES HAPPENING SOON Join live interactive courses, either online or in-person, with access to hands-on instruction and real-time feedback. 5/05/25 Ambient Music Making with Ableton Live – 2025 This 2-day long hands-on workshop will look at the generative and aleatoric composition techniques from... ENROLL TODAY 4/08/25 Creative Code Intensive The Creative Code Intensive is a 12-week in-person course at Gray Area / Grand Theater... ENROLL TODAY 4/05/25 Introduction to Open Source Contribution with the p5.js Editor Introduction to Open Source Contribution with the p5.js Editor is a hands-on workshop designed for... ENROLL TODAY 3/10/25 Modular Synthesizer Workshop With VCV Rack 2 – 2025 A practical and fun introduction to modular sound synthesis and electronic sound creation using VCV... ENROLL TODAY LEARN AT YOUR OWN PACE Get online audit access to recordings of courses so you can view and listen from home on your own schedule. Course Category: Ongoing 1/25/25 TouchDesigner 101 Intensive: Creating Interactive Installations and Generative Art An introductory class on TouchDesigner centered around building an interactive art installation and methods for... 1/07/25 Andrew McLuhan Teaches Understanding Media Intensive: Part Two Understanding Media Intensive: Part Two is a 13-part look at the second part of media... 4/15/24 Andrew McLuhan Teaches Understanding Media Intensive Part One: Tools for Engagement Understanding Media Intensive Part One: Tools for Engagement is a 10-week long intensive look at... 5/10/22 Everything But The Art: The Business of Creativity From portfolio development to grant writing and everything in between, this course helps creatives unpack... 10/26/21 Unity for Artists Learn the basics of Unity in an engaging and approachable way and discover why game... Browse our full course & workshop catalog Program Highlights Creative Code Intensive Our Creative Code Intensive is a newly redesigned 12-week in-person course in creative technology, offering a comprehensive introduction to foundational and advanced tools for programming digital media. In an interdisciplinary environment of artists, designers, engineers, and other creative professionals, participants will create studio projects and discuss work in group critiques, culminating in an exhibition of work in a public showcase. Learn More DWeb for Creators Coming soon! Decentralized Web (DWeb) for Creators is an 8-week online course that empowers next-generation artists, archivists, gallerists, curators, and others with the knowledge and tools necessary for exploring the decentralized web. Participants engage with technologies like blockchain, examine case studies in curation, and apply decolonial approaches to world building as they envision the future of DWeb technologies. This course was developed with support for the Filecoin Foundation for the Distributed Web. Responsible Technology Design Intensive Returning Fall 2025! In this interdisciplinary online intensive course, award-winning critical designer, researcher, and artist Caroline Sinders will lead students in understanding human rights-centered design. Throughout the course, students will ideate and design technology-mediated products with these concepts and principles in mind and examine the use of UX and design tools in activism. GET INVOLVED TEACH A CLASS! TAKE A CLASS! OUR COMMUNITY IMPACT For the 12 weeks, I could learn a lot of skills of making immersive art. I’ve took some classes about coding ever in college, yet immersive is my first class that I really excited! Its kinda bootcamp for creative coding so sometimes it was not easy for me but it was really stimulus. Also, the instructor and classmate are very friendly and talented! Hope we can keep in touch and collaborate in future.Nao KondoThis immersive perfectly combined art and engineering and was easily one of the best learning experiences I’ve ever had. The teachers were patient and great at explaining concepts, technologies, and creative strategies – better than some of the professors I’ve had in undergrad. The critique and feedback I received in class helped push my work to another level. Take this course. It will only help you grow as an artist and as an engineer!Ella OrdonaI’m a former creative code immersive scholarship recipient. The skills I’ve developed through Gray Area have helped me grow as an artist and make a living as a creative technologist. Thanks for the important work you do.Peter RiganoI am amazed by the work going on at Gray Area, and am glad I found it in the online COVID-19 world. There is nothing like it near me that I am aware of. I also enjoyed the book club event with Youngblood.Meredith SwardGray Area is an essential cultural organization, consciously evolving both the arts and the world we find ourselves in.Angela MelkisethianGalvanize was amazing and my first time at Gray Area. I can’t wait to check out your other events. Merrill GarbusCommunity. Culture. Advocacy. Gratitude.Marissa UnderwoodSeeing the program outline of the Immersive was like seeing a wish list of things I hoped to learn, so when the opportunity presented itself to apply and enroll, I took it.Kaii Tu STAY UP-TO-DATE WITH GRAY AREA LEARN EXPERIENCES Email Address First Name Last Name"
