["https://grayarea.org/about/code-of-conduct"]
title = "Code of Conduct - Gray Area"
full_description = "Gray Area is committed to providing a friendly, safe and welcoming environment for all, regardless of gender identity and expression, sexual orientation, disability, personal appearance, body size, race, ethnicity, age, religion, or nationality. All participants and audience are expected to treat other speakers, staff, and audience with respect. All participants should be mindful of their speech and behaviors both in person and online to ensure an inclusive and welcoming environment for all. • Violence: threats of violence or violent language directed against another person. • Discriminatory language: sexist, racist, homophobic, transphobic, ableist, or otherwise discriminatory jokes and language. • Inappropriate materials: posting or displaying sexually explicit or violent material. • Personal insults: particularly those related to gender, sexual orientation, race, religion, or disability. • Inappropriate photography or recording. • Inappropriate physical contact: you should have someone’s consent before touching them. • Unwelcome sexual attention: sexualized comments or jokes; inappropriate touching, groping, and unwelcomed sexual advances. • Excessive profanity. • Sustained disruption: of community events, including talks and presentations. Gray Area reserves the right to revoke attendance for anyone who does not comply with staff requests, at our discretion. If an individual is found in violation of the Code of Conduct during an event, they may be asked to leave and will not receive a refund. If you experience or witness harassment or threatening behavior, please find the nearest Gray Area Staff member immediately. We are always available to contact local law enforcement, provide escorts, or otherwise assist those experiencing harassment to feel safe for the duration of the conference. We value your attendance. Thank you for joining us at Gray Area and for helping us create a positive and inclusive atmosphere. We believe that everyone has the right to feel safe, respected, and welcomed. Together, we can cultivate a community that upholds these values and fosters creativity and connection. If you have any questions or concerns, don't hesitate to reach out to [email protected]."
