["https://grayarea.org/event/crl-synth-sessions-february-2025"]
title = "Creative Resource Library Synth Session Music Theory for All Part 1: Rhythm - Gray Area"
full_description = "Gray Area, ZERO1, and Crowbar Corner are proud to present Synth Sessions, a free hands-on workshop and group jam open to all levels to expand your sonic horizons. Every month, participants learn about a new synthesis topic (drones, sequencing, sound design, etc.), then collaborate on a group jam that will propel the workshop sounds into the beyond! Participants are encouraged to bring their own electronic instrument or use one from the Creative Resource Library (limited availability). Participants can also preview the instruments available from the Library and sign up to borrow one after the session. We have full modular systems, desktop synths and drum machines and a selection of Macbooks, iPads, midi controllers, and audio interfaces. The workshop begins promptly at 6pm, followed by group jam time beginning at 7pm. There will be time at the end of the workshop for general questions and advice about synthesis. Please arrive in time to set up your instrument(s) before the jam begins. Ryan Smith presents the first part of Music Theory for All, a workshop series about the fundamentals of music theory covering rhythm, harmony, and melody. Learn the concepts and language of music in a concise, practical manner. In Part 1 — Rhythm, we'll figure out how to count music, time signatures, accents, swing and polyrhythm and put them into practice. Our usual community jam will follow, along with the chance to check out some of the new additions to the Creative Resource Library. A long time touring musician with the band Caribou, Ryan also produces futuristic techno music under the moniker Taraval, makes modular ambient music in the live electronic duo Bathing, and has a long running collaboration with Jeremy Greenspan of the Junior Boys, both producing experimental electronic music and running the label Geej. He produced a collaborative performance of a 1973 graphics score by avant-garde composer Frank McCarty called Tactus Tempus, a controlled improvisational process for 9 audio visual performers live at Gray Area. He is an expert level user of Ableton and Max For Live, VCV Rack (virtual modular synthesis environment), numerous hardware instruments and an accomplished guitar player."
