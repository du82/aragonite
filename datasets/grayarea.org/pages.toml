["https://grayarea.org/event/beyond-play-a-french-american-community-event-on-the-future-of-video-games"]
title = "Beyond Play: A French-American Community Event on the Future of Video Games - Villa Albertine"
description = "Organized by Villa Albertine in partnership with La Région Occitanie, Gray Area, CNC, and Institut français, this exclusive event will bring together industry leaders, creatives, and professionals for an evening of insightful discussions, networking, and artistic exploration. Taking place on March 16, 2025, from 5:00 PM to 8:00 PM at Gray Area in the Mission..."
full_description = '''Beyond Play: A French-American Community Event on the Future of Video Games Conference Gray Area 2665 Mission St San Francisco, CA 94110 March 16, 2025 | 5pm - 8pm Register San Francisco’s Gray Area will soon host Beyond Play, the first-ever French-American community event dedicated to fostering collaboration, reflection, and artistic dialogue in the video game industry. Organized by Villa Albertine in partnership with La Région Occitanie, Gray Area, CNC, and Institut français, this exclusive event will bring together industry leaders, creatives, and professionals for an evening of insightful discussions, networking, and artistic exploration. Taking place on March 16, 2025, from 5:00 PM to 8:00 PM at Gray Area in the Mission District of San Francisco, Beyond Play aims to engage the American professional community and gaming enthusiasts in meaningful exchanges. Attendees must RSVP. Please use the registration button to the left to RSVP. The event will kick off with an Intellectual Property Marketplace, offering a unique opportunity for American publishers to meet with five leading French studios from the Game Changer delegation. This session will facilitate transatlantic collaboration and open doors for new business opportunities. Following the marketplace, a series of expert-led discussions will highlight the dynamic interplay between France and the United States in the gaming sector. The first panel will explore the global appeal of both industries, delving into economic incentives such as tax credits, technological advancements, and the evolving relationship between the two gaming powerhouses. The second panel will focus on the significance of art, artificial intelligence, and impact-driven games, examining how video games transcend entertainment to shape storytelling, social change, and cultural expression. Program Schedule: 5:00 PM – 6:00 PM – French-American Panels: Panel 1: A Deep Dive into the French and U.S. Bond in the Gaming Industry – Exploring tax credits, regional incentives, and the cultural and technological exchanges shaping the global gaming landscape. Panel 2: The Importance of Art, AI, and Impact in Video Games – Examining the role of art and AI in gaming, from storytelling and design to social impact and community engagement. 6:00 PM – 6:10 PM – Presentation of The Siren by artist Mélanie Courtinat, recipient of the French Immersion Grant 6:10 PM – 8:00 PM – Cocktail and networking session As a special highlight, The Siren, an innovative video game installation by French artist Mélanie Courtinat, will be presented. This immersive work challenges traditional gaming conventions, inviting audiences to reflect on their engagement with digital art and interactive experiences. Beyond Play is part of the Game Changer program, an initiative developed by Villa Albertine in collaboration with the Institut Français, La Région Occitanie, and Games for Change. This program provides representatives from five selected French studios with a 10-day immersion in the American gaming industry, covering topics such as artificial intelligence, fundraising, adaptation, marketing, press relations, impact games, community engagement, legal contracts, and pitching. During their stay from March 11 to 19, 2025, the selected representatives will participate in exclusive workshops and masterclasses led by U.S. gaming experts. They will also visit major industry players such as Riot Games, Ubisoft, Survios, Twitch, PlayStation, and CAA. The program includes two key networking events: a reception at the French Consulate in Los Angeles on March 13 and Beyond Play in San Francisco on March 16, coinciding with the Game Developers Conference (GDC). Delegates will also receive accreditation and access to the GDC, ensuring unparalleled exposure to the American gaming ecosystem. Gray Area, the venue for Beyond Play, is a nonprofit cultural incubator in San Francisco dedicated to fostering interdisciplinary collaboration. Since 2008, it has established itself as a unique hub for critically engaging with technology and culture, empowering creative practitioners to drive social impact through groundbreaking work. With an emphasis on cross-cultural exchange, technological innovation, and artistic exploration, Beyond Play promises to be a landmark event for professionals and creatives looking to shape the future of the gaming industry. RSVP here to secure your spot at this exclusive symposium. The Game France label, supported by the CNC, promotes the French video game ecosystem at home and abroad and connects French studios with international stakeholders. Game France is the gateway for video games companies and professionals who want to set up, invest in or work with France. In partnership with La Région Occitanie The Région Occitanie, a cradle of artistic creation in video games, aims to establish itself as a major player on the European stage. Proud of its companies that produce iconic titles, the Région Occitanie is a partner of the Game Changer program by Villa Albertine, which aims to showcase its talents internationally. Gray Area Foundation for the Arts Gray Area is a nonprofit in San Francisco applying creativity for positive social impact. “We use digital tools to create art and design projects that benefit society. We test and scale projects with high impact potential, teach digital tools to support artists and technologists, and inspire our community by promoting meaningful new work. We apply the promise and inspiration of digital art to a broader social context. Our programs are transforming cities into creative outlets, applying technology to solve problems, and shaping how art is created and consumed in the digital era.” Learn more Centre national du cinéma et de l’image animée (CNC) Created in 1946, the Centre national du cinéma et de l’image animée (CNC) is a public administrative organization, set up as a separate and financially independent entity which comes under the authority of the French ministry of culture and communication. Its principal missions are : support for the film, broadcast, video, video games, immersive productions and technical industries; promotion of film and television for distribution to all audiences and preservation and development of the film heritage. Learn more Institut français The Institut français is responsible for France’s international cultural program. Supervised by both the Ministry for Europe and Foreign Affairs and by the Ministry of Culture, it promotes French culture abroad through cultural exchange initiatives. Operating in a space where the arts, intellectual exchange, cultural and social innovation, and linguistic partnerships interact and intersect, it is also responsible for promoting the French language and the sharing of works, artists, and ideas all over the world. The Institut français is one of Villa Albertine’s main French partners. Read More Related content All disciplines All cities Announcing the Game Changer Jury Panel Audiovisual Videogames Visual Arts SF U.S. Premiere of Mélanie Courtinat’s “The Siren” New Media LA SF Game Changer: The New Program for French Video Game Studios See all articles Sign up to receive exclusive news and updates Newsletters Highlights from Villa Albertine Music Newsletter New Media Newsletter Performing Arts Newsletter Books & Ideas New York Newsletter Film & TV New York Newsletter Art & Design New York Newsletter Museum & Heritage New York Newsletter Atlanta Newsletter Boston Newsletter Chicago Newsletter Houston Newsletter Los Angeles Newsletter Villa Albertine San Francisco Washington DC Newsletter Submit Email(Required) Submit /* <![CDATA[ */ gform.initializeOnLoaded( function() {gformInitSpinner( 1, 'https://villa-albertine.org/wp-content/themes/villa-albertine/resources/images/svg/spinner.svg', true );jQuery('#gform_ajax_frame_1').on('load',function(){var contents = jQuery(this).contents().find('*').html();var is_postback = contents.indexOf('G