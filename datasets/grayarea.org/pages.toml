["https://grayarea.org/services/live-stream"]
title = "Live Streaming - Gray Area"
description = "Gray Area's Grand Theater is the premiere San Francisco wedding, holiday party, concert, show and event venue. It has modern day sound, lighting and visual capabilities."
full_description = "Located in the heart of the Mission District, Gray Area is the perfect location to produce your next online event. High quality live streaming is complex, but our team will make your next production simple, safe, and high-quality. The historic Grand Theater provides an exceptional space to livestream your next event, and perfect for filming online panels, conferences, and performances. • 7,000 square feet • 4k Blackmagic cameras • 15’ x 28’ Projection screen • Epson PRO L1505U Laser Projector • Seamless backdrops – White/Black/Green • RGB lighting • Gigabit fiber internet Studio A is an intimate space with our base live streaming equipment package, and perfect for webinars, podcasts, and interviews. • 400 square feet • 50” monitor • Single camera • Confidence monitor • LED lighting • Natural light Need a team to run your virtual event? We’ve got the expertise and equipment to tell your stories anytime, from anywhere. Ask our team about filming on location from your venue, or how we can produce your live stream event remotely or on-site. From pre-production, post-production, to syndicated streaming across multiple platforms, we've got you covered. • On-location videography • Virtual event and webinar management • Support hosting a virtual conference, panel, or performance Gray Area is proud to offer a community rentals program to support organizations with nonprofit status, to leverage our space for community support during these challenging times. Benefits of the community rentals program include listing on the Gray Area website, digital marketing, discounted gear, and rental fees. 1) to serve the local Mission District community 2) to elevate and organize around issues of social justice 3) to support, or increase visibility of, underserved communities 4) to advance under-supported fields in the arts and/or in technology Past program recipients include: Mission Cultural Center, El Tecolote, Let's Take Action, Dawson Dance SF, CounterPulse, CCA, BAVC, and more."
