["https://grayarea.org/event/introducing-bay-area-glam-organizations-to-the-decentralized-web-and-storage"]
title = "Virtual Webinar Introducing Bay Area GLAM Organizations to the Decentralized Web and Storage - Gray Area"
full_description = "Discover how decentralized storage can transform the preservation and accessibility of cultural assets in this engaging workshop series for Galleries, Libraries, Archives, and Museums (GLAM). Hosted by Gray Area in collaboration with TechSoup, this event connects cultural organizations with cutting-edge tools and knowledge to empower their work in the digital age. Online: Introduction to Decentralized Storage Dive deeper into the practical applications of decentralized storage, including Filecoin training and opportunities for collaboration. Date: Monday, March 3. 4-6 pm pacific In-Person: Hands-On Implementation Workshop Dive deeper into the practical applications of decentralized storage, including Filecoin training and opportunities for collaboration. Date: Sunday, March 9, 1-4 pm pacific Register: https://events.techsoup.org/e/mgmfgj/ This in-person workshop is for anyone new to digital preservation or looking to enhance their strategies. No technical background is required—just a commitment to data sovereignty and protecting your organization's valuable digital resources. Filecoin Foundation for the Decentralized Web (FFDW) is a 501(c)(3) non-profit whose mission is to ensure the permanent preservation of humanity’s most important information by stewarding the development of open-source software and open protocols for decentralized data storage and retrieval networks. TechSoup is a nonprofit that equips changemakers with transformative technology solutions and skills that they need to improve lives globally and locally. As a Gray Area Member you get special access to events, behind-the-scenes content and more. Gray Area is a dedicated family of supporters who believe in the power of creative action to catalyze social transformation. Join as a member today to provide sustaining support for our globally unique arts, education, research, and incubation programs."
