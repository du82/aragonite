["https://grayarea.org/services/venue-rental"]
title = "Venue Rental - Gray Area"
description = "Gray Area's Grand Theater is the premiere San Francisco wedding, holiday party, concert, show and event venue. It has modern day sound, lighting and visual capabilities."
full_description = "Making up the entire ground floor, the Grand Theater Rental is an excellent option for exhibits and large performances. With large windows facing lively Mission Street, the lobby is an unparalleled space for hosting a spectrum of events. It is ideal for small functions, pop up retail and showcases. Including the main stage, lobby, and bar, the Half Theater Rental is perfect for performances, small conferences, and special events. The classroom is equipped with a 85” screen and small soundsystem, making it perfect for smaller meetings and workshops. Looking for a distinctive venue for your next event? Gray Area provides more than just a rental—it’s a cultural experience. Our theater features permanent interactive art by renowned artist Rafael Lozano-Hemmer and a gallery with rotating exhibitions by local and international artists. Hosting your event here means immersing your guests in the creative ecosystem of the Bay Area. Gray Area is located in the historic Grand Theater, built in 1940. We offer modern sound, light, and visual capabilities, fiber internet, and full bar packages. The 10,000 square foot San Francisco landmark is a versatile venue available for performances, conferences, and exhibitions. Gray Area is proud to offer a community rentals program to organizations with nonprofit 501(c)3 status to leverage our space for community support and social good. Events or organizations that qualify for this program must satisfy one or more of the following program goals: 1) to serve the local Mission District community 2) to elevate and organize around issues of social justice 3) to support, or increase visibility of, underserved communities 4) to advance under-supported fields in the arts and/or in technology Benefits of the community rentals program include listing on the Gray Area website, digital marketing, and discounted gear and rental fees. Past program recipients include: Mission Cultural Center, El Tecolote, Let's Take Action, Dawson Dance SF, CounterPulse, CCA, BAVC, and more."
