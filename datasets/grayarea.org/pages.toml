["https://grayarea.org/learn/our-approach"]
title = "Our Approach - Gray Area"
description = "THE FUTURE IS CREATIVE On Gray Area Learn, artist educators teach responsible creativity to students, teachers, industry professionals, and organizations. Our courses equip learners with artistic tool sets that engender values to support a sustainable, equitable, and humanized society. We underlie the socio-cultural power of artists as distinctly trained in a complex set of technical […]"
full_description = "Empowering communities through value-driven digital creativity GET IN TOUCHTHE FUTURE IS CREATIVE On Gray Area Learn, artist educators teach responsible creativity to students, teachers, industry professionals, and organizations. Our courses equip learners with artistic tool sets that engender values to support a sustainable, equitable, and humanized society.We underlie the socio-cultural power of artists as distinctly trained in a complex set of technical tools, distinct ways of thinking, and deep societal awareness. And we amplify artists’ aptitudes in order to take a leading role in shaping a workforce that is more equitable, accountable and responsible for our collective future.A TOTAL LEARNING EXPERIENCE Gray area Learn offers a full educational cycle by engaging our communities with a “lifestyle” – a full range of cultural activities, creating a positive feedback loop from audience inspiration to community leadership. Our public events programming draws audiences into our year round education offerings, and then their projects can enter our incubator to refine and scale. After completing our programs, community members often return to teach and exhibit their works, inspiring audiences anew. Lead Inspire the next generation of creators through teaching and mentorship. Showcase Demo your work to the public for concept feedback, technology testing, and engagement. Incubate Develop a project with peer support, mentorship, and workshop facilities. Inspire Attend Gray Area’s virtual or place-based events to be inspired to learn about art, science, and technology. Educate Learn creative technology skills by enrolling in a workshop or immersive education cycle. LATEST FROM OUR BLOG LATEST FROM OUR BLOG 9/14/22 The Creative Code of SPECULATIVE BIOLOGIES By Leia Chang, edited by Chris Weir Read more 10/20/21 Wade Wallerstein on Curating Gray Area Festival 2021 For our 7th edition, Gray Area Festival presents Worlding Protocol — a survey of interdisciplinary creators drawing upon indigenous knowl... Read more 5/19/21 Announcing the Grand Creative Resource Library May 19, 2021 — Over the past half century, the Grand Theater on Mission Street has been home to a cinema, a dollar store, and now an ecle... Read more STAY UP-TO-DATE WITH GRAY AREA LEARN EXPERIENCES Email Address First Name Last Name"
