["https://grayarea.org/about/mission"]
title = "Mission - Gray Area"
full_description = "We use digital tools to create art and design projects that benefit society. We test and scale projects with high impact potential, teach digital tools to support artists and technologists, and inspire our community by promoting meaningful new work. We apply the promise and inspiration of digital art to a broader social context. Our programs are transforming cities into creative outlets, applying technology to solve problems, and shaping how art is created and consumed in the digital era. Gray Area is San Francisco's premier cultural hub catalyzing creative action for social transformation – applying antidisciplinary practice towards some of the most complex challenges facing our world. For over a decade we’ve generated platforms that enable creators of diverse backgrounds and perspectives who defy categorization to transcend boundaries within deep artistic collaboration. Through public events, education, and incubation, we engage art directly with the critical issues facing our rapidly unfolding reality. Our mission prioritizes cultivating, sustaining, and amplifying a diverse creative community. We elevate underrepresented voices through thoughtful curation of performers, speakers, and artists. Over 50% of artists in our most impactful programs amplify historically underrepresented communities. Gray Area has developed an engagement model creating a positive feedback loop from audience inspiration to community leadership. Our public events programming draws audiences into our year round education offerings, and then their projects can enter our incubator to refine and scale. After completing our programs, artists often return to teach and perform, inspiring an audience anew. Gray Area hosts and produces over 100 public events per year. Our events programming seeks to inspire, educate, and facilitate antidisciplinary engagement around important and challenging topics such as technology and society, the environment, and social justice. We demonstrate the value of art as a necessary tool for thinking critically."
