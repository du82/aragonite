["https://grayarea.org/create/creative-resource-library"]
title = "Creative Resource Library - Gray Area"
full_description = "The Creative Resource Library is a lending library for electronic musical instruments and sound tools modeled on a public library, open and free to all. We also offer regular, free music education workshops, events and community jams which you can be kept informed of by signing up to Gray Area’s mailing list. Its aim, like a public library, is to provide access to tools and information to all, promote musical and sound learning and exploration, and connect other music enthusiasts and sound explorers to a wider community. The Creative Resource Library is open bi-weekly on Wednesdays 5-6pm for borrowing and returning at Gray Area 2665 Mission St, San Francisco. Browse the catalogue of items below, and use the ‘Request Equipment’ form linked above to enter your details and request your selected item and the date you wish to begin borrowing. We will reply via email to confirm your request and you can come pick up your item. All items are due back two weeks from the date of borrowing, Wednesdays 5-6pm. The catalogue of items is ever growing, containing synthesizers (modular and desktop), drum machines, midi controllers, FX, laptops, audio interfaces, Ipads and Macbooks. In short, everything you might need to explore electronic music making, sound design or adding audio to your art project. The items are all portable and in protective cases and include power supplies. A portable, polyphonic FM synth. Explore bells, zaps, drones alien bird calls, and sharp percussion with this hands on playable FM synth. Aciiiiiieeeed! A fully analog replica of the famous Roland 303 Acid bassline synth, including the iconic sequencer and filter with enhanced connectivity. Analog multi-mode filter and distortion under digital control from Elektron. Use it to process other synths, drum machines, guitars, or your voice thru several flavours of distortion and filtering. Portable, powerful and hands on Analog and Digital drum machine/synthesizer from Korg. Classic and modern drum programming and sound design in a fun hands on box."
