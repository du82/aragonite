title = "For Teams - Gray Area"
description = "Upskill organizational creative thinking Gain access to world class training and development programs custom-tailored for your organization.Whether it be a projection-mapped sculpture, an animated-gif selfie or a monument in augmented reality: we provide a point of entry no matter your skill set. Immersive Learning with Emerging Technologies Our classes integrate the latest immersive platforms in […]"
full_description = "ADVANCING RESPONSIBLE CREATIVITY FOR ORGANIZATIONS We train teams to build bridges between technology, creativity, and social responsibility through collaborative hands-on classes and workshops. Get in TouchUpskill organizational creative thinking Gain access to world class training and development programs custom-tailored for your organization.Whether it be a projection-mapped sculpture, an animated-gif selfie or a monument in augmented reality: we provide a point of entry no matter your skill set.Immersive Learning with Emerging Technologies Our classes integrate the latest immersive platforms in online learning environments including virtual reality, augmented reality, gamification, and wearables for teaching through hands-on interaction.Blended Learning: Virtual & In-Person In addition to online learning programs we host in-person group meetings, 1:1s with dedicated instructors, and community-wide events to complement ongoing learning programs. UNLOCKING CREATIVITY THROUGH OPEN SOURCE Mad MapperMadMapper is an advanced tool for video and light mapping. Adapted for various fields, such as architectural video projection, art installation, stage design and live show, MadMapper software made possible hundreds of projects around the globe by an incredibly active user community of creators looking for a fast, powerful and user-friendly mapping softwareThree.jsA web framework for building virtual reality experiences. Works on Vive, Rift, Daydream, GearVR, or desktop.Unity and Unreal EngineWe use both Unity and Unreal Engine to build high-quality 3D and 2D games and experience, then deploy them across mobile, desktop, VR/AR consoles or the web. Works on Vive, Rift, Daydream, and GearVRArduinoArduino is an open-source electronics platform based on easy-to-use hardware and software. Arduino boards are able to read inputs – light on a sensor, a finger on a button, or a Twitter message – and turn it into an output – activating a motor, turning on an LED, publishing something online.Node.jsA powerful Javascript-based framework used to develop web applications like video streaming sites and more. It can also be used in conjunction with Arduino to connect objects to the web (IOT).p5.jsA web-based Javascript library for creating graphic and interactive experiences, based on the core principles of Processing. Contains animation, sound, and video capabilities.ProcessingA coding language for the electronic arts, new media art, and visual design communities to teach non-programmers the fundamentals of computer programming in a visual context. Team Workshops Highlights 9/14/20 Augmented Reality Workshop with Artivive at Gray Area Festival 7/23/20 BitRate Series: Making Interactive Music Apps with Magenta.js Workshop 6/19/19 Creating Kaleidoscopes with TouchDesigner Browse our full course & workshop catalog Get in touch TRUSTED BY THE WORLD'S LEADING INSTITUTIONS & BUSINESSES TESTIMONIALS For the 12 weeks, I could learn a lot of skills of making immersive art. I’ve took some classes about coding ever in college, yet immersive is my first class that I really excited! Its kinda bootcamp for creative coding so sometimes it was not easy for me but it was really stimulus. Also, the instructor and classmate are very friendly and talented! Hope we can keep in touch and collaborate in future.Nao KondoThis immersive perfectly combined art and engineering and was easily one of the best learning experiences I’ve ever had. The teachers were patient and great at explaining concepts, technologies, and creative strategies – better than some of the professors I’ve had in undergrad. The critique and feedback I received in class helped push my work to another level. Take this course. It will only help you grow as an artist and as an engineer!Ella OrdonaI’m a former creative code immersive scholarship recipient. The skills I’ve developed through Gray Area have helped me grow as an artist and make a living as a creative technologist. Thanks for