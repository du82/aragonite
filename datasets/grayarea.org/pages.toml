["https://grayarea.org/event/modular-synthesizer-workshop-with-vcv-rack-2-2025"]
title = "Modular Synthesizer Workshop With VCV Rack 2 - 2025 - Gray Area"
description = "A practical and fun introduction to modular sound synthesis and electronic sound creation using VCV Rack. Learn to create a ‘patch’ to produce electronic sound and leave with the tools for limitless sound creation."
full_description = "Modular Synthesizer Workshop With VCV Rack 2 – 2025 This hands-on 2-day workshop is a practical introduction to modular sound synthesis and electronic sound creation using VCV Rack 2, a Eurorack simulator for Mac/Windows/Linux. Learn to create a ‘patch’ to produce electronic sound and leave with the tools for limitless sound creation.Previously the preserve of wealthy and patient music makers tangled up with wires in giant blinking boxes, the joy of creating sounds on a modular synth is now accessible on your laptop via the free virtual modular synthesizer VCV Rack 2. Whether you are an experienced sound creator or curious music fan, modular synthesis with VCV Rack 2 offers virtually limitless audio creation tools and sonic experimentation.ENROLLCourse Logistics Dates: Monday, March 10 & Wednesday, March 12, 2025 Times: 6-9PM PST Cost: $200 for two-day workshopWe also offer Diversity Scholarships. Apply by March 1, 2024. FormatIn-Person Workshop Experience Level: Beginner to intermediate. Previous experience working with music and sound creation tools is helpful but not necessary. Requirements:Bring a PC/Mac or Linux Laptop and headphones compatible with your Laptop.Install VCV Rack 2 prior to arriving to workshop. Download here. Additional Information:• No Refunds or Exchanges.• View our FAQ here.• Contact [email protected] with any questions. Workshop Outline We’ll cover everything you need to patch and compose with modular synths over two days. We’ll move from basic technique to hands on applications in your own creative musical context. Day 1 • Brief history of modular synthesis, terms and techniques with A/V materials and short demonstration on physical hardware • Introduction to VCV Rack 2 virtual modular, module browser, connecting to your laptop’s audio output • Making your first sounds by building a basic VCO VCF VCA patch in VCV Rack • Expanding the sonic possibilities of a basic patch with Gates, Envelopes, LFO, Sequencers, and other specialized modules • Understanding building block modules: VCO, VCA, VCF, LFO, Scope, Audio Interface • Saving and recalling and sharing your patches Day 2 • Further expansion of patching techniques using Noise, Random, Quantizer modules • Building percussive drum machine patches using multiple voices and modules • Building generative and ambient patches • Sharing patches and refining students patches with one on one guidance from the instructorENROLL About TechnologiesVCV Rack 2 is a free open-source virtual modular synthesizer that runs on Mac, Windows and Linux. Multiple modules can be connected to synthesize a sound. By default the software contains several VCOs, LFOs, mixers, and other standard synthesizer modules, however more can be added as plugins through the VCV Rack 2 website.—Become a Gray Area Member for early access to our workshops, and 20% off.Gray Area Members enjoy extraordinary access to our interdisciplinary arts & education programs, while supporting our mission to catalyze creative action for social transformation. Get free admission, exclusive content, and more!JOIN TODAY Instructor(s) Ryan Smith Musician -Producer - DJ - Label Manager A long time touring musician with the band Caribou, Ryan also produces futuristic techno music under the moniker Taraval, makes modular ambient music in the live electronic duo Bathing, and has a long running collaboration with Jeremy Greenspan of the Junior Boys, both producing experimental electronic music and running the label Geej. He produced a collaborative performance of a 1973 graphics score by avant-garde composer Frank McCarty called Tactus Tempus, a controlled improvisational process for 9 audio visual performers live at Gray Area. He is an expert level user of Ableton and Max For Live, VCV Rack (virtual modular synthesis environment), numerous hardware instruments and an accomplished guitar player. TouchDesigner 101 Intensive: Creating Interactive Installations and Generative Art Ambient Music Making with Ableton Live – 2025 Course Schedule This two-day workshop takes place in the form of two 3-hour sessions over the course of two days. Dates: Monday March 10 & Wednesday March 12, 2025 Times: 6-9PM Scholarship Application Deadline: Saturday, March 1, 2025 Experience Level: Beginner to Intermediate Instructor(s) Ryan Smith Musician -Producer - DJ - Label Manager"
