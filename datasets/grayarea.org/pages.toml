["https://grayarea.org/event/gray-v-with-jerod-s-rivera-elias-agogo-cat-lauigan-and-kahj-versaam"]
title = "GRAY/V with Jerod S. Rivera, Elias FS, and Kahj & Versâam - Gray Area"
full_description = "For this session, Jerod S. Rivera will take us into his richly textured ambient soundscapes processed through modular synthesizers and vintage electronics. Elias FS will combine ethereal electronics with atmospheric alto saxophone. Jerod and Elias will also bring their previous collaborative efforts to Gray Area’s stage, joined by multidisciplinary artist Cat Lauigan offering lyrical incantations. Rounding out the evening will be Kahj and Versâam, long-time collaborators who layer poetic verse over hypnotic beats. Jerod S. Rivera is a musician based in Oakland, California, with a focus on modular synthesis and electronics. With a background in drums and experimental composition, Rivera approaches his work in a do-it-yourself mentality and is completely self-taught. In 2021, Rivera self-released his debut full-length album, Virgo, which was held to critical acclaim. During the pandemic, Rivera teamed up with Daniel Letson, aka DJML/Motoko & Myers, and formed Later Version. In 2023, Later Version partnered with Third Place Records in London to release the Swim Domain EP. Entering 2025, Rivera embarks on a new chapter with his work, self-releasing his sophomore album, Dot Dash. In Dot Dash, Rivera takes his sound a step further, adding new methods of working and collaboration. The lead single, “Seamstress Clock,” features the poetry of Cat Lauigan, the Buchla 200e, and various vintage synth textural motifs. The track draws inspiration from Robert Ashley, Cosey Fanni Tutti, and Jay Clayton. Elias FS (fka Elias Agogo) is a German-born artist, producer, and DJ living in Oakland, CA. He uses various electronics and the alto saxophone to shape intuitive longform live sets touching on ambient and abstract electronic soundscapes. Growing up in Southern Germany, Elias started exploring music through rhythm from an early age. The relocation to Montreal and eventually Oakland, set free a new energy and space for experimentation within his sonic journey. Long-time interests in ambient and dance music in a broader sense combined with the introduction to the alto saxophone, created a new framework for his latest work."
