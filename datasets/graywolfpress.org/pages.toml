["https://graywolfpress.org/books/not-river"]
title = "Not a River | Graywolf Press"
description = "It’s not a river, it’s this river."
full_description = "Breadcrumb Home Books Not a River Book Title Not a River Subtitle A Novel Author 1 Selva Almada; Translated from the Spanish by Annie McDermott Cover Image download cover image Shortlisted for the 2024 International Booker Prize Body It’s not a river, it’s this river. A hot, motionless afternoon. Enero and El Negro are fishing with Tilo, their dead friend’s teenage son. After hours of struggling with a hooked stingray, Enero aims his revolver into the water and shoots it. They hang the ray’s enormous corpse from a tree at their campsite and let it go to rot, drawing the attention of some local islanders and igniting a long-simmering fury toward outsiders and their carelessness. It’s only the two sisters—the teenage nieces of one of the locals, Aguirre—with their hair black as cowbird feathers and giving off the scent of green grass, who are curious about the trio and invite them to a dance. But the girls are not quite as they seem. As night approaches and tensions rise, Enero and El Negro return to the charged memories of their friend who years ago drowned in this same river. As uneasy and saturated as a prophetic dream, Not a River is another extraordinary novel by Selva Almada about masculinity, guilt, and irrepressible desire, written in a style that is spare and timeless. Share Title List Price $16.00 Purchase at Purchase at: Bookshop IndieBound Barnes & Noble Amazon ISBN ISBN 978-1-64445-285-1 Format Format Paperback Publication Date Publication Date 5/7/24 Subject Subject Fiction Pages Pages 104 Trim Size Trim Size 5.5 x 8.25 Keynote A novel that conjures a river thick and dark as ink, teeming with life, memory, and ghosts About the Author Credit: Agustina Fernández Selva Almada is the author of Brickmakers, Dead Girls, and The Wind That Lays Waste. She is considered one of the most potent literary voices in Argentina and Latin America. More by author Annie McDermott is the translator of a dozen books from Spanish and Portuguese. She was awarded the Premio Valle Inclán and her translation of Brickmakers by Selva Almada was shortlisted for the Warwick Prize for Women in Translation. More by author Praise “Told with the hallucinatory atmosphere of a dream, this astonishing, stark novel doesn’t turn away from the hypnotic and disturbing effects of violence. Not a River plunges us straight into the depths of its silences, bracingly so—the longer the quiet goes, the more terrible the rupture.”—Manuel Muñoz“A virtuoso literary work. . . . Flashbacks and side scenes deepen the story which curls and twines like a thrusting tropical vine through the past, roping in sisters, wives, old lovers, boyhood adventures, and jealousies.”—Annie Proulx“Now with her third novel, Not a River, Almada accentuates the power and allure of nature in a story that synthesizes many of the themes that she has long explored in her writing. . . . The result is her most accomplished work to date, a luxurious wisp of a novel that never wastes a word, in a vital and tender English-language translation once again by McDermott.”—Cory Oldweiler, Southwest Review“In this potent novella from Argentine writer Almada (Brickmakers), the killing of a stingray sets off a series of fateful events along an unnamed South American river. . . . Like a dream, this otherworldly tale lingers in the reader’s mind.”—Publishers Weekly Featured Titles Out Stealing Horses Per Petterson, Anne Born 3 Sections Vijay Seshadri The Dragons, the Giant, the Women Wayétu Moore This Mournable Body Tsitsi Dangarembga View All Books"
