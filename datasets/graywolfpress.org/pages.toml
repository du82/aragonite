["https://www.graywolfpress.org/books/notes-no-mans-land"]
title = "Notes from No Man's Land | Graywolf Press"
description = "Acclaimed for its frank and fascinating investigation of racial identity, and reissued on its ten-year anniversary, Notes from No Man’s Land begins with a series of lynchings, ends with a list of apologies, and in an unsettling new coda revisits a litany of murders that no one seems capable of solving."
full_description = "Breadcrumb Home Books Notes from No Man's Land Book Title Notes from No Man's Land Subtitle American Essays Author 1 Eula Biss Cover Image download cover image Winner of the 2010 National Book Critics Circle Award in Criticism Winner of the Graywolf Press Nonfiction Prize Body Acclaimed for its frank and fascinating investigation of racial identity, and reissued on its ten-year anniversary, Notes from No Man’s Land begins with a series of lynchings, ends with a list of apologies, and in an unsettling new coda revisits a litany of murders that no one seems capable of solving. Eula Biss explores race in America through the experiences chronicled in these essays—teaching in a Harlem school on the morning of 9/11, reporting from an African American newspaper in San Diego, watching the aftermath of Hurricane Katrina from a college town in Iowa, and rereading Laura Ingalls Wilder in the Rogers Park neighborhood of Chicago. What she reveals is how families, schools, communities, and our country participate in preserving white privilege. Notes from No Man’s Land is an essential portrait of America that established Biss as one of the most distinctive and inventive essayists of our time. “Two of the qualities that make Eula Biss’s essays in Notes from No Man’s Land compelling and beautiful are precision and independence—independence from orthodoxies of the right and left and the conventions of literary essays and their displays of sensibility and sensitivity. . . . She’s important to this moment, important to the opening up of what essays can be, important for setting a standard of integrity and insight, and she’s also a joy to read.”—Rebecca Solnit Share Title List Price $16.00 Purchase at Purchase at: Bookshop IndieBound Barnes & Noble Amazon ISBN ISBN 978-1-55597-823-5 Format Format Paperback Publication Date Publication Date 11/6/18 Subject Subject Literary Collections Pages Pages 256 Trim Size Trim Size 5.5 x 8.25 Keynote A reissue of Eula Biss’s groundbreaking essay collection, winner of the National Book Critics Circle Award About the Author Eula Biss is the author of On Immunity: An Inoculation, Notes from No Man’s Land, winner of the National Book Critics Circle Award in criticism, and The Balloonists. Her essays have appeared in the Believer, Harper’s, and the New York Times.http://www.eulabiss.net/ More by author Praise “[Notes from No Man’s Land] is a beautiful exercise in consciousness; in bringing both intelligence and experience to bear on a subject that has implications for the way one behaves in the world.”—Los Angeles Times“Graywolf Press has reissued Biss’ penetrating essay collection—a wise and welcome decision. In a moment when geography seems to have a stranglehold on political sensibilities, Notes from No Man’s Land delivers nuanced regional dispatches from New York, California and the Midwest.”—Los Angeles Times“Eula Biss’ Notes From No Man’s Land is the most accomplished book of essays anyone has written or published so far in the 21st century.”—Salon“Biss’ pairings of ideas, like those of most original thinkers, have the knack of seeming brilliant and obvious at the same time. . . . Forceful, beautiful essays.”—NPR Featured Titles Look Solmaz Sharif In the Dream House Carmen Maria Machado This Mournable Body Tsitsi Dangarembga Out Stealing Horses Per Petterson, Anne Born View All Books"
