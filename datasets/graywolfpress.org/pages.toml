["https://graywolfpress.org/support-graywolf"]
title = "Support Graywolf | Graywolf Press"
full_description = "Title Support Graywolf Subtitle Please join us in changing the literary culture by giving a contribution to Graywolf Press today. Make a gift Support independent publishing and risk-taking books Galley Club Become a sustaining member and get pre-publication books Editor Circle Join our leadership giving circle with a gift of $1,000 or more Widgets ☰In This Section Why Support Graywolf Ways to Support Why Support Graywolf Graywolf’s critically acclaimed books and authors are changing the conversation about culture and the literary arts in the United States today.Graywolf Press is one of the nation’s leading nonprofit publishers of poetry, fiction, literary nonfiction, and work in translation. We are dedicated to discovering and championing visionary literature by local, national, and international authors. As some of the worst aspects of our commercial and political life degrade language, there is a hunger for literature that elevates it. Graywolf books engage with many pressing issues of our time—including racism, gender equity, climate change, immigration, and war.Right: Students at South High School in Minneapolis holding donated copies of New Poets of Native Nations. Below: Author Claudia Rankine, former board chair Margaret Telfer, and supporter Jay Cowles at the Graywolf Literary Gala in 2019, photo by Rick Orndorf. About 35 to 40 percent of our revenue is contributed, which allows us to take on writers and manuscripts that are not obviously commercial, but that have great artistic and cultural potential. Thank You to Our Supporters In 2022, we reached 660,000 readers with our 640 titles in print, and millions more through events, classrooms, and media platforms. If you believe, as we do, that new and diverse voices are vital to a healthy society and that great books add meaning to our lives, we ask you to ensure the future of Graywolf’s world-class publishing program with a gift today. Donate Graywolf is an important literary standard-bearer, doing as much as anyone in the English language to advance the shapes, content, and forms of writing. MPLS.St.Paul Magazine Ways to Support Donor-Advised Funds Graywolf welcomes grant recommendations from your Fidelity Charitable, Schwab Charitable, or BNY Mellon Charitable donor-advised fund. [ more + ] Click here to make a grant recommendation to Graywolf from one of the participating donor-advised funds through DAF Direct. Graywolf Galley Club Join our sneak-peek membership program and get access to pre-publication titles. [ more + ] Galleys are promotional tools—they are bound like books but not yet proofread for final publication, and they allow us to start sharing a title and building buzz months in advance of publication. For $15 per month, you can support Graywolf and receive six pre-publication galleys and finished books, as well as swag, special communications from our editorial and publishing team, invitations to Graywolf events taking place in your area, and more! You’ll also receive an exclusive Graywolf Galley Club tote bag upon joining. Contact us at galleyclub@graywolfpress.org with questions. Join the Galley Club Leadership Circles Donors who give leadership contributions of $1,000 or more become part of our Author and Editor Circles. [ more + ] Graywolf’s most generous supporters are members of the Author Circle (gifts of $2,500 and above) and Editor Circle (gifts of $1,000 to $2,499). Members of our lead donor circles receive invitations to exclusive events, complimentary books, and unique access to the world of independent publishing. Contact Development Officer Josh Ostergaard at ostergaard@graywolfpress.org to learn more. Planned Giving Planned giving is a way to support Graywolf’s authors and books into the future. [ more + ] Planned gifts to Graywolf can be made through your will, trust, retirement plan, IRA, life insurance policy, or other financial vehicle. Simply designate Graywolf as a beneficiary, or leave a charitable bequest. Anyone who gives a planned gift to Graywolf joins the Perpetua Circle. The Perpetua Circle is named after Graywolf’s house font, a typeface that is intrinsic to the identity of the Press. Planned gifts can be simple, flexible, versatile, and offer tax relief. Planned giving is for everyone. You don’t need to be a certain age, or have a certain income level. You can structure the gift to leave a specific item or amount of money, make the gift contingent on certain events, or leave a percentage of your estate to Graywolf. Because you are not actually making a gift until after your lifetime, you can change your mind or restructure your gift at any time. If your estate is subject to estate tax, your gift qualifies for an estate tax charitable deduction for the gift’s full value. For beneficiary designations Legal name: Graywolf Press Phone: (651) 641-0077 EIN: 91-1257237 When you inform Graywolf of your decision, we can arrange for your gift to be stewarded according to your wishes, and we can discuss how best to recognize you for your generosity. Fill out a planned giving intent form and return it to the Graywolf office to let us know about your intentions. Contact us at (651) 641-0077 or plannedgiving@graywolfpress.org for more information. Stock Gifts Making a contribution through a gift of stock is easy and cost-effective. [ more + ] Gifting stock can result in a gift that costs just pennies on the dollar. Stocks held for more than twelve months offer a two-fold tax savings. You avoid paying capital gains tax on the increase in value of your stock, and you receive a tax deduction for the full fair market value of the stock on the date of the gift. Stock may be gifted/transferred to Graywolf Press through the following contact: John Schonberg, Financial Advisor Stonebridge Capital Advisors Stock Transferred to: Charles Schwab & Co. PO Box 982603 El Paso, TX 79998-2603 DTC Clearing 0164, Code 40 Client Name: Graywolf Press Client Account Number: 7208-6423 Graywolf Press EIN: 91-1257237 Contact Senior Development Officer Josh Ostergaard at ostergaard@graywolfpress.org with questions. To publish a book, to intentionally make words memorable and durable, is precious and unique—a holy act. We are so grateful for the process and the people who make it possible at Graywolf. That is why we have left Graywolf in our will, so that other readers may experience the work of this fine independent press for many years to come. Ann Bitter and Lyn Parker, Founding Members of the Perpetua Circle"
