full_description = "Widgets Publishing Voices for the Twenty-First Century photo credit Jenna Bascom Graywolf Press publishes risk-taking, visionary writers who transform culture through literature. More About Graywolf Support Our Mission A virtuoso literary work. . . . Flashbacks and side scenes deepen the story which curls and twines like a thrusting tropical vine through the past, roping in sisters, wives, old lovers, boyhood adventures, and jealousies. Annie Proulx NEW FROM GRAYWOLF Optional Practical Training Shubha Sunder Primordial Mai Der Vang Origin Stories Corinna Vallianatos The Dissenters Youssef Rakha Modern Poetry Diane Seuss Taiwan Travelogue Shuang-zi Yang, Lin King Season of the Swamp Yuri Herrera, Lisa Dillman We're Alone Edwidge Danticat An Image of My Name Enters America Lucy Ives Bluff Danez Smith Jellyfish Have No Ears Adele Rosenfeld, Jeffrey Zuckerman The Long Run Stacey D'Erasmo View all Books In the News Graywolf Press Partners with Letras Latinas on New Latinx Anthology Graywolf Press is partnering with Letras Latinas to publish a new anthology of Latinx poetry. We Come from Everything: Poetry for the 21st Century will gather twenty-five poets who have not yet published more than one full-length… Read full story » GRAYWOLF PRESS CELEBRATES FIFTY YEARS OF PUBLISHING Graywolf Press is proud to announce a series of anniversary events throughout 2024, taking place in New York City, Minneapolis, San Francisco, Chicago, and Tucson. Read full story » Citizen in the Classroom Claudia Rankine's groundbreaking Citizen: An American Lyric and other books have inspired programming and sparked conversations in schools, universities, and communities across the country. (Photo credit: DP Jolly.) LEARN MORE HERE Graywolf gave my story a chance when few others would. It's an honor and a privilege to join the roster of this world-class press, committed to disrupting the canon by taking wild, unpopular, beautiful chances. Wayétu Moore"
