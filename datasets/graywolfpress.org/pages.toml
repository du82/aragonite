["https://graywolfpress.org/books/optional-practical-training"]
title = "Optional Practical Training | Graywolf Press"
description = "Told as a series of conversations, Optional Practical Training follows Pavitra, a young Indian woman who came to the US for college from Bangalore, India, and graduates in 2006 with a degree in physics. Her student visa grants her an extra twelve months in the country for work experience—a period known as Optional Practical Training—so she takes a position as a math and physics teacher at a private high school near Cambridge, Massachusetts."
full_description = "Breadcrumb Home Books Optional Practical Training Book Title Optional Practical Training Subtitle A Novel Author 1 Shubha Sunder Cover Image download cover image “The novel coheres into a crystalline portrait of a woman straddling cultures and expectations while attempting to discover who she is. It’s a knockout.”—Publishers Weekly, starred review Body Told as a series of conversations, Optional Practical Training follows Pavitra, a young Indian woman who came to the US for college from Bangalore, India, and graduates in 2006 with a degree in physics. Her student visa grants her an extra twelve months in the country for work experience—a period known as Optional Practical Training—so she takes a position as a math and physics teacher at a private high school near Cambridge, Massachusetts. What Pavitra really wants, though, is the time and space to finish a novel—to diverge from what’s expected of her within her family of white-collar professionals and to build a life as a writer. Navigating her year of OPT—looking for a room to rent, starting her job—she finds that each person she encounters expects something from her too. As her landlord, colleagues, students, parents of her students, friends of her family, and neighbors talk to and at her, they shape her understanding of race, immigration, privilege, and herself. Throughout the book, Pavitra seems to speak very rarely; and yet, as she responds to the assumptions, insights, projections, and observations of those around her, a subtle and sophisticated portrait emerges of a young woman and aspiring artist defining a place for herself in the world. Share Title List Price $17.00 Purchase at Purchase at: Bookshop IndieBound Barnes & Noble Amazon ISBN ISBN 978-1-64445-324-7 Format Format Paperback Publication Date Publication Date 3/4/25 Subject Subject Fiction Pages Pages 256 Trim Size Trim Size 5.5 x 8.25 Keynote An elegantly inventive debut novel that offers a sharp new take on the immigrant story in post-9/11 America About the Author Credit: Chris McIntosh Shubha Sunder is the author of Boomtown Girl, a story collection set in her hometown of Bangalore, India, that won the 2021 St. Lawrence Book Award. She lives in Boston, Massachusetts, with her family. More by author Upcoming Events Shubha Sunder reading and in conversation with Neema Avashia about OPTIONAL PRACTICAL TRAINING at Brookline Booksmith Date: Friday, March 7, 2025 at 7:00pm Location: Brookline Booksmith in Brookline, MAview map Optional Practical Training will be available for purchase from Brookline Booksmith. RSVP here!Event Details Shubha Sunder reading and in conversation with Mark Haber about OPTIONAL PRACTICAL TRAINING at Magers & Quinn Date: Wednesday, March 12, 2025 at 7:00pm Location: Magers & Quinn in Minneapolis, MNview map Copies of Optional Practical Training will be available for purchase from Magers & Quinn. Free and open to the public. Register here!Event Details Shubha Sunder reading and in conversation with Koye Oyedeji about OPTIONAL PRACTICAL TRAINING at Politics & Prose (Conn Ave) Date: Wednesday, March 19, 2025 at 7:00pm Location: Politics & Prose in Washington, DCview map Free and open to the public. Copies of Optional Practical Training will be available for purchase from Politics & Prose. Click here for details.Event Details Shubha Sunder reading and in conversation with E. C. Osondu about OPTIONAL PRACTICAL TRAINING at Riffraff Bookstore Date: Sunday, March 23, 2025 at 6:00pm Location: Riffraff Bookstore in Providence, RIview map Copies of Optional Practical Training will be available for purchase from Riffraff Bookstore. Shubha Sunder reading and in conversation with Aria Aber and Kate Folk about OPTIONAL PRACTICAL TRAINING at the Center for Fiction Date: Friday, April 4, 2025 at 6:00pm Location: Center for Fiction in Brooklyn, NYview map Registration required ($5 community ticket / $15 supporter ticket / free livestream). Click here to register. Copies of Optional Practical Training will be available for purchase from the Center for Fiction.Event Details Shubha Sunder reading and in conversation with Michelle Min Sterling about OPTIONAL PRACTICAL TRAINING at Harvard Book Store Date: Thursday, May 1, 2025 at 7:00pm Location: Harvard Book Store in Cambridge, MAview map Free and open to the public. Copies of Optional Practical Training will be available for purchase from Harvard Book Store. Click here for details.Event Details [more events with author+] [less events with author–] Praise “Quietly subversive, this is an immigration narrative to undermine the various reductionist immigration narratives of our moment.”—Jonathan Frey, The Millions“Gloriously inquisitive about an immigrant's peculiar position, at times delightfully combative, at other times wrenchingly gentle, Optional Practical Training is a novel that is always true to itself.”—Megha Majumdar “Optional Practical Training is as sharp, bright, and subtle as a blade hidden up a sleeve. Before you know it, it has sliced clear through the ether of absurdity that is immigrant life.”—Namwali Serpell “A rich and blazingly layered portrait of a young woman fighting to not only be an artist, but fighting to discover a true sense of herself in a world that has so many ideas about how her life should be. This is a beautiful, and beautifully intimate, quest of a book.”—Paul Yoon Featured Titles Out Stealing Horses Per Petterson, Anne Born Look Solmaz Sharif Everything Under Daisy Johnson The Empathy Exams Leslie Jamison View All Books"
