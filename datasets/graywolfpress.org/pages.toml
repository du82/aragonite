title = "Jobs and Internships | Graywolf Press"
description = "Considered one of the nation’s leading independent, nonprofit literary publishers, Graywolf Press publishes books that foster new thinking about what it means to live in the world today. From its headquarters in Minneapolis, Minnesota, Graywolf publishes an annual list of thirty to thirty-five new titles and organizes around two hundred local and national events featuring its authors each year."
full_description = "Title Jobs and Internships Body Considered one of the nation’s leading independent, nonprofit literary publishers, Graywolf Press publishes books that foster new thinking about what it means to live in the world today. From its headquarters in Minneapolis, Minnesota, Graywolf publishes an annual list of thirty to thirty-five new titles and organizes around two hundred local and national events featuring its authors each year. Widgets ☰In This Section Now Hiring Major Gifts Officer Internships and Fellowships Now Hiring Major Gifts Officer Position Summary We are hiring a Major Gifts Officer as a versatile and adaptive senior member of Graywolf Press’s growing development department. Along with being open to candidates based in the Twin Cities area of Minnesota, we encourage development professionals based in New York City who have knowledge of the contemporary literary industry to apply for this position.The Major Gifts Officer will be a frontline solicitor of sizeable contributed income from individuals, comfortable managing an active portfolio of donors and finding new prospects. This position also plays a key role in Graywolf’s fundraising events, as well as contributing to other activities undertaken by the development department.The Major Gifts Officer will report to the Executive Director and forms a nexus of collaboration with the ED and the Director of Strategic Initiatives. In addition to the roles outlined below, the successful applicant will be able to adjust as organizational needs change or evolve.Reports to: Executive Director & PublisherWorks closely with: Director of Strategic Initiatives and development staffDepending on experience, the salary for this position ranges from $70,000 to $90,000. [ more + ] Compensation includes paid time off; health and dental insurance, as well as short-term disability, long-term disability, and life insurance with all employee premiums paid 100 percent by Graywolf; paid parental leave; and a fully subsidized transit pass. Graywolf employees are eligible for retirement benefits after one year of service. Ideal start date for this position is late January or February 2024. Strategy Play a key role in creating and implementing Graywolf’s development initiatives and programs in support of the organization’s 2024–2028 strategic plan.Assess and strengthen the effectiveness of Graywolf’s fundraising systems and procedures. [ more + ] Contribute to the management of systems for donor tracking and management. Collaborate with entire development team to ensure that results are reconciled with organizational budget and accountant’s records, and other related tasks. Fundraising Solicit contributions from individuals, foundations, and corporations, including major-donor drives, sponsorships, planned giving, and the annual fund, taking responsibility for fundraising results. With colleagues, develop a pipeline to identify, cultivate, and solicit donors in several key markets (Twin Cities, New York, California, and other regions emerging as important to Graywolf). This includes building new relationships with potential supporters and helping Graywolf enhance relationships with existing donors to stimulate near-and-long-term growth in the annual fund. [ more + ] Work with development team to coordinate letter-writing, website, and email campaigns, and other communications with donors.Collaborate with development team on grant processes, providing support with research, proposals, submission, and reporting as needed. Events Lead the development team’s strategy for ongoing local and national small-scale cultivation events, coordinating these efforts with the Development and Events Assistant and across Graywolf as a whole.Play key role in executing Graywolf’s signature annual galas, partnering when relevant with experts familiar with target cities and internally with the Development and Events Assistant. [ more + ] * Required Experience, Skills, Knowledge, and Abilities At least 3 years of experience working in a development or fundraising capacity for a nonprofit organization, or equivalent experience.Demonstrated success achieving significant major gift results.Excellent written and verbal communication skills.Experience leading live events. [ more + ] Strong organizational skills, keen attention to details, the ability to prioritize tasks and meet deadlines, and the ability to accomplish tasks with a high degree of autonomy.High level of comfort with Mac OS and Microsoft Office suite and other basic office technology.Previous experience working with contact databases and data entry.Ability to work collaboratively and flexibly with our small staff, board of directors, and as part of a team. Physical Demands Must be able to perform the essential duties of the position with or without reasonable accommodation.Remain in a stationary position for extended period of time.Move about inside office to access files and office equipment.Operate a computer and other office equipment. This position will be based in Minneapolis or New York City. Travel for Graywolf donor events and meetings to cities within the United States is expected several times a year, for two to three nights at a time. The Major Gifts Officer will work to expand Graywolf’s donor networks on the East Coast, in the Bay Area, and other key regions, resulting in additional opportunities for travel. [ more + ] * To Apply To apply, please upload the materials requested below via Submittable Applications will be accepted up to the initial deadline of 11:59 PM PST on Friday, January 10, with further applications possibly accepted on a rolling basis until the position is filled. Any questions about the position can be directed to oneil@graywolfpress.org. No phone calls please. All applicants will be notified via Submittable as soon as the position is filled. [ more + ] Please submit the following application materials via Submittable:· Cover letter · Resume Graywolf Press is an equal opportunity employer committed to diversity. We welcome and encourage applicants of all races, ethnicities, gender and sexual identities, and disability statuses. To request an accommodation in the hiring process, please email access@graywolfpress.org. Internships and Fellowships There are no fellowship or internship openings at Graywolf Press at this time.Graywolf is currently administering editorial internships in partnership with the University of Minnesota.We recently completed our 2023-2024 session of the Citizen Literary Fellowship. The Citizen Literary Fellowship is grounded in our belief that while diversity in the books and authors we publish is vital, it is equally important that the people publishing these books reflect that diversity. The fellowship is intended to attract candidates who otherwise would face barriers to beginning a career in publishing, and to therefore increase the diversity and inclusivity of the industry. Throughout the year, the fellow receives active coaching and encouragement from the whole Graywolf team. Our hope is that this fellowship will serve as a doorway to a successful career in publishing or a related literary field."
year_published = 2025
