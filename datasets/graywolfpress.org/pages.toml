["https://graywolfpress.org/books/origin-stories"]
title = "Origin Stories | Graywolf Press"
description = "The stories in Origin Stories take as their subject the sources of love, marriage, motherhood, friendship, artistic ambition, restiveness, and shame. Their narrators perceive more than is explicable, want more than they have, and contend with the bounty and frugality of their relationships. In “This Isn’t the Actual Sea,” a woman considers that her friend’s failure and sudden success have given her the material she needs to write something of her own, if she’s willing to risk the friendship to do so."
full_description = '''Breadcrumb Home Books Origin Stories Book Title Origin Stories Subtitle Stories Author 1 Corinna Vallianatos Cover Image download cover image “These dark, devastating stories are love meditations, each offering a secret lesson on how to navigate our new world as woman, daughter, mother, artist. Page-turners each one, full of power, brilliance, and racing energy.”—Deb Olin Unferth Body The stories in Origin Stories take as their subject the sources of love, marriage, motherhood, friendship, artistic ambition, restiveness, and shame. Their narrators perceive more than is explicable, want more than they have, and contend with the bounty and frugality of their relationships. In “This Isn’t the Actual Sea,” a woman considers that her friend’s failure and sudden success have given her the material she needs to write something of her own, if she’s willing to risk the friendship to do so. “The Artist’s Wife” describes, in a painting stowed in a bowling alley broom closet, the chasm between seeing and being seen. “Dogwood” is a piece of lyric reportage on beauty, family, and survival whose sections range from the narrator’s childhood to her son’s new adulthood. And “Origin Story” acts as an accounting of the many different states where a woman and her husband have lived, and what it is they’ve been searching for. In this keen, meditative collection set in Southern California and Virginia, Corinna Vallianatos dramatizes the bonds of mother and child, the self-destruction of young womanhood, the thrill and bewilderment of friendship, and the power of place.Origin Stories is filled with humor, longing, beauty, and belief. Share Title List Price $17.00 Purchase at Purchase at: Bookshop IndieBound Barnes & Noble Amazon ISBN ISBN 978-1-64445-321-6 Format Format Paperback Publication Date Publication Date 2/4/25 Subject Subject Fiction Pages Pages 192 Trim Size Trim Size 5.5 x 8.25 Keynote “Corinna Vallianatos can make an entire soul come shining out of the smallest phrase.”―Kevin Brockmeier About the Author Credit: Photographer Credit / Ellen Reyes Corinna Vallianatos is the author of The Beforeland and My Escapee, winner of the Grace Paley Prize for Short Fiction. Her work has appeared in The Best American Short Stories 2023, McSweeney’s, and elsewhere. She lives in Virginia. More by author Upcoming Events Corinna Vallianatos (ORIGIN STORIES) reading and in conversation with Eric Puchner (DREAM STATE) at Politics and Prose Date: Friday, April 25, 2025 at 7:00pm Location: Politics & Prose in Washington, DCview map This event is free and open to the public. [more events with author+] [less events with author–] Praise "This book is so good, so full of wisdom and inventive turns of phrase and perfectly insightful observation, so ruthlessly attuned to the thrilling dark heart of things, that I started to feel envious and a bit spooked and began underlining sentences on every page. . . . One of the best new collections I've read in years."—Eric Puchner“All I ever want to read is writing that is precise, surprising, and funny; Origin Stories has all of those qualities, and more. Corinna Vallianatos’s elegant, agile stories spark with inquiry and insight into what goes on between people, and inside ourselves.”—Rachel Khong“In graceful, steely prose, Origin Stories conveys Vallianatos’s unique understanding of interpersonal relationships. . . . The strength of her protagonists’ resolve and the ways in which they contend with crises are enchanting, disturbing, and provocative in turn. A superb collection.”—Camille Bordas“Vallianatos shines in this wide-ranging collection.”–Publishers Weekly Featured Titles I Am Not Sidney Poitier Percival Everett Look Solmaz Sharif American Journal Tracy K. Smith Erasure Percival Everett View All Books'''
