["https://graywolfpress.org/privacy-rights"]
title = "Privacy Rights | Graywolf Press"
description = "Graywolf Press recognizes the importance of privacy to visitors to our website, and we want every user (you) to know how we collect and use information about you when you visit our site. This privacy policy explains what type of information is collected when you visit www.graywolfpress.org, and how we may use that information."
full_description = "Breadcrumb Home Privacy Title Privacy Rights Body Graywolf Press recognizes the importance of privacy to visitors to our website, and we want every user (you) to know how we collect and use information about you when you visit our site. This privacy policy explains what type of information is collected when you visit www.graywolfpress.org, and how we may use that information. The Information We Gather Like virtually all other web servers, our web server automatically creates log files for each visitor who accesses our sites. The access logs do not record a visitor's name, address, phone number, credit card number(s), or any other personally identifying information. Rather, these log files may contain some or all of the following information: The date of the visit The time and length of the visit The path taken through the site, including links (such as buy or donate links) that are clicked The browser/device being used We use this information to aid the technical administration of the site, to report to our grantors about the size of our audience, and to learn how to better serve our web visitors. If you buy a Graywolf book after following a link on our website to another retailer, we receive a percentage of that sale through an affiliate program. This site uses cookies to collect some or all of the above information. Generally, the information we collect does not identify you personally; however, if you do not wish to receive cookies, you may set your browser to reject cookies or to alert you when a cookie is placed on your computer. You are not required to accept cookies when you visit this site. We do not collect personally identifying information from our website unless you choose to provide that information to us. Visitors under the age of 13 must obtain permission from their parents or guardians before sending any personally identifying information to Graywolf Press. Name and Contact Information Graywolf Press may ask visitors (you) to provide certain personal information when you: sign up for an e-newsletter list, request information, or make a donation. We tell you whether a specific piece of information is required at the time it is requested. This information may be used by Graywolf Press to verify your identity, contact you for additional information or administrative purposes, and fulfill your request. If you sign up for our e-newsletter, you may receive e-mail regarding our books, author events, and website; otherwise, we will contact you only if necessary for the purposes above. Unless explicitly stated otherwise at the time of submission, the personally identifying information you provide will not be sold, shared, or used for purposes other than listed above. You may contact us at any time to request removal from our mailing list or supporter database. Credit Card Information You must be 18 to engage in money-related transactions on the Graywolf Press website. When you do so, you may be asked for a credit card number. All financial transactions take place only on secure servers hosted by CardPointe/Salsa Labs, and electronic communication of credit card information is sent only in a secured or encrypted format. Your credit card information is considered completely confidential. CardPointe/Salsa Labs is compliant with the Data Security Standard as prescribed by the Payment Card Industry. Consent Your use of the Graywolf Press website constitutes consent to any policy then in effect. This policy is effective June 1, 2018. Contact If you have any questions about this privacy policy or any practices on the Graywolf Press website, please email us at wolves@graywolfpress.org, or call (651) 641-0077."
