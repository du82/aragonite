["https://graywolfpress.org/books/modern-poetry-0"]
title = "Modern Poetry | Graywolf Press"
description = "Diane Seuss’s signature voice—audacious in its honesty, virtuosic in its artistry, outsider in its attitude—has become one of the most original in contemporary poetry. Her latest collection takes its title, Modern Poetry, from the first textbook Seuss encountered as a child and the first poetry course she took in college, as an enrapt but ill-equipped student, one who felt poetry was beyond her reach."
full_description = "Breadcrumb Home Books Modern Poetry Book Title Modern Poetry Subtitle Poems Author 1 Diane Seuss Cover Image download cover image “These irreverent, pulsing, and defiant poems are full of dangerous good sense.”—Publishers Weekly, starred review Poem Excerpt If you are like me, to learn of the gods you must beg, borrow, or steal. Eavesdrop, as gossip is sagacity, a word I learned from Emily Dickinson. Don’t underestimate direct experience. Ants know earth. Dragonflies know air. A cobbled mind is not fatal. You have to be willing to self-educate at a moment’s notice, and to be caught in your ignorance by people who will use it against you. You will mispronounce words in front of a crowd. It cannot be avoided. But your poems, with all of their deficiencies, products of lifelong observation and asymmetric knowledge, will be your own. —from “My Education” Body Diane Seuss’s signature voice—audacious in its honesty, virtuosic in its artistry, outsider in its attitude—has become one of the most original in contemporary poetry. Her latest collection takes its title, Modern Poetry, from the first textbook Seuss encountered as a child and the first poetry course she took in college, as an enrapt but ill-equipped student, one who felt poetry was beyond her reach. Many of the poems make use of the forms and terms of musical and poetic craft—ballad, fugue, aria, refrain, coda—and contend with the works of writers overrepresented in textbooks and anthologies and those too often underrepresented. Seuss provides a moving account of her picaresque years and their uncertainties, and in the process, she enters the realm between Modernism and Romanticism, between romance and objectivity, with Keats as ghost, lover, and interlocutor. In poems of rangy curiosity, sharp humor, and illuminating self-scrutiny, Modern Poetry investigates our time’s deep isolation and divisiveness and asks: What can poetry be now? Do poems still have the capacity to mean? “It seems wrong / to curl now within the confines / of a poem,” Seuss writes. “You can’t hide / from what you made / inside what you made.” What she finds there, finally, is a surprising but unmistakable love. Share Title List Price $17.00 Purchase at Purchase at: Bookshop IndieBound Barnes & Noble Amazon ISBN ISBN 978-1-64445-318-6 Format Format Paperback Publication Date Publication Date 11/19/24 Subject Subject Poetry Pages Pages 128 Trim Size Trim Size 6 x 9 Keynote Now in paperback, the extraordinary latest collection by Pulitzer Prize–winner Diane Seuss About the Author Credit: Gabrielle Montesanti Diane Seuss is the author of six books of poetry, including Modern Poetry; frank: sonnets, winner of the Pulitzer Prize, the National Book Critics Circle Award, the Los Angeles Times Book Prize, and the PEN/Voelcker Prize; Still Life With Two Dead Peacocks and a Girl, a finalist for the National Book Critics Circle Award and the Los Angeles Times Book Prize; and Four-Legged Girl, a finalist for the Pulitzer Prize. She was a 2020 Guggenheim Fellow, and in 2021 she received the John Updike Award from the American Academy of Arts and Letters. She lives in Michigan. More by author Praise Finalist for the 2024 National Book Award for Poetry Winner of the 2024 Heartland Booksellers Award for Poetry A New York Times Book Review Notable Book of 2024 A New Yorker Essential Read of 2024 A Library Journal, Literary Hub, and Electric Literature Best Poetry Collection of 2024“Modern Poetry does not disappoint in its embodiment of punk spirit; even as Seuss embarks on the essentially academic task of uncovering the fate of modern poetry, she summons the great lyric poets of the past.”—Juliette Jeffers, Interview Magazine “Here at the bedside of this dying world, Diane Seuss is one of the exemplars of our modern poetry, and Modern Poetry is a resounding, enduring and yes, beautiful companion.”—Mandana Chaffa, Chicago Review of Books“Seuss, in turning outsider consciousness into high art, posits poetry as a living thing, inextricable from the roots of existence and an authentic life.”—Virginia Konchan, Harriet Books Featured Titles Life on Mars Tracy K. Smith The Dragons, the Giant, the Women Wayétu Moore Don't Call Us Dead Danez Smith American Journal Tracy K. Smith View All Books"
