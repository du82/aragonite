["https://graywolfpress.org/books/season-swamp"]
title = "Season of the Swamp | Graywolf Press"
description = "New Orleans, 1853. A young exile named Benito Juárez disembarks at a fetid port city at the edge of a swamp. Years later, he will become the first indigenous head of state in the postcolonial Americas, but now he is as anonymous and invisible as any other migrant to the roiling and alluring city of New Orleans."
full_description = "Breadcrumb Home Books Season of the Swamp Book Title Season of the Swamp Subtitle A Novel Author 1 Yuri Herrera; Translated from the Spanish by Lisa Dillman Cover Image download cover image Finalist for the 2024 Los Angeles Times Prize for Fiction Body New Orleans, 1853. A young exile named Benito Juárez disembarks at a fetid port city at the edge of a swamp. Years later, he will become the first indigenous head of state in the postcolonial Americas, but now he is as anonymous and invisible as any other migrant to the roiling and alluring city of New Orleans. Accompanied by a small group of fellow exiles who plot their return and hoped-for victory over the Mexican dictatorship, Juárez immerses himself in the city, which absorbs him like a sponge. He and his compatriots work odd jobs, suffer through the heat of a southern summer, fall victim to the cons and confusions of a strange young nation, succumb to the hallucinations of yellow fever, and fall in love with the music and food all around them. But unavoidable, too, is the grotesque traffic in human beings they witness as they try to shape their future. Though the historical archive is silent about the eighteen months Juárez spent in New Orleans, Yuri Herrera imagines how Juárez’s time there prepared him for what was to come. With the extraordinary linguistic play and love of popular forms that have characterized all of Herrera’s fiction, Season of the Swamp is a magnificent work of speculative history, a love letter to the city of New Orleans and its polyglot culture, and a cautionary statement that informs our understanding of the world we live in. Share Title List Price $26.00 Purchase at Purchase at: Bookshop IndieBound Barnes & Noble Amazon ISBN ISBN 978-1-64445-307-0 Format Format Hardcover Publication Date Publication Date 10/1/24 Subject Subject Fiction Pages Pages 160 Trim Size Trim Size 5.5 x 8.25 Keynote A major new novel set in nineteenth-century New Orleans by the author of Signs Preceding the End of the World About the Author Credit: Tori Bush Born in Actopan, Mexico, Yuri Herrera is the author of three novels, including Signs Preceding the End of the World, as well as the collection Ten Planets, which was a finalist for the Ursula K. Le Guin Prize. He teaches at Tulane University in New Orleans. More by author Lisa Dillman lives in Decatur, Georgia, where she translates Spanish-language fiction and teaches at Emory University. Her recent translations include National Book Award finalist Abyss by Pilar Quintana and Ten Planets by Yuri Herrera. More by author Praise “Virtuosic. . . . The Juárez that Herrera conjures with his muscular prose — translated with bravura by Lisa Dillman . . . is above all a pair of eyes and ears. He’s an observer alive to the world, endowed with the foreigner’s curiosity and the subaltern’s ironic skepticism.”—Nicolás Medina Mora, The New York Times Book Review“Richly imagined, profusely written.”—Sam Sacks, The Wall Street Journal“Told in Herrera’s typically sparkling, form-exploding language, this one is screaming ‘modern epic.’”—Brittany Allen, Literary Hub“Mesmerizing . . . as glorious and messy as the best New Orleans gumbo. . . . It’s a triumph.”—Publishers Weekly, starred review Featured Titles The Time of the Doves Merce Rodoreda The Argonauts Maggie Nelson Life on Mars Tracy K. Smith The Dragons, the Giant, the Women Wayétu Moore View All Books"
