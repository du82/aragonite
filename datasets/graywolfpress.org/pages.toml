["https://graywolfpress.org/about-us/board-and-staff"]
title = "Board and Staff | Graywolf Press"
description = "Our Board of Directors has between twenty and twenty-five members and provides fiduciary oversight of Graywolf’s operations. We have awarded Board Emeritus status to former board members who have made a significant impact in the history of the press. The National Council is an informed advisory group of donors and friends across the country who support Graywolf’s efforts on a local basis, especially in the Bay Area, Boston, Chicago, New York, Portland (Oregon), the Twin Cities, and Washington, DC."
full_description = "Banner Title Board and Staff Body Our Board of Directors has between twenty and twenty-five members and provides fiduciary oversight of Graywolf’s operations. We have awarded Board Emeritus status to former board members who have made a significant impact in the history of the press. The National Council is an informed advisory group of donors and friends across the country who support Graywolf’s efforts on a local basis, especially in the Bay Area, Boston, Chicago, New York, Portland (Oregon), the Twin Cities, and Washington, DC.Contact UsJobs and Internships Widgets ☰In This Section Staff Board of Directors Board Emeritus Publisher Emerita National Council Staff Carmen Giménez, Director and Publisher, serves as Graywolf’s executive director. She oversees all departments and works closely with our board of directors and staff to set the strategic direction. Marisa Atkinson, Director of Marketing and Engagement, oversees the marketing and publicity department and the campaigns for our books, and is responsible for event programming strategy.Mattan Comay, Sales and Operations Manager, manages reprints and award submissions, monitors book sales, acts as rights assistant, and processes Graywolf’s accounts payable.Katie Dublinski, Associate Publisher, oversees book production and art direction, handles subsidiary rights, and occasionally acquires fiction and nonfiction titles; serves as interim director overseeing organizational strategy and staff. Camryn Hay, Development and Events Assistant, supports the Development team in events and fundraising initiatives. Yuka Igarashi, Executive Editor, acquires fiction and nonfiction titles.Claire Laine, Director of Publicity, oversees media and press initiatives for our books and organization.Anni Liu, Editor, acquires fiction and nonfiction and supports the editorial director.Caelan Ernest Nardone, Publicist, manages publicity campaigns, marketing initiatives, and author tour events.Ethan Nosowsky, Editorial Director, is responsible for shaping Graywolf’s prose lists; he acquires fiction and nonfiction titles.Casey O’Neil, Sales and Operations Director, oversees Graywolf's sales and retail marketing strategy; coordinates HR and finance with Graywolf staff and board of directors.Josh Ostergaard, Director of Strategic Initiatives, works closely with the board of directors, National Council, and other major donors and stakeholders, while helping set and implement organizational strategy.Jeff Shotts, Executive Editor and Director of Poetry, is responsible for Graywolf’s poetry list; he also acquires literary nonfiction and criticism titles.Nirali Sheth, Associate Publicist, leads media outreach, author tour planning, and social media strategy for select titles, also provides general and administrative support to the marketing and publicity department.Veronica Silva, Marketing and Sales Associate, works with our distributor (Farrar, Straus & Giroux), our sales representatives, and booksellers around the country to ensure Graywolf books are well represented in the marketplace.Brittany Torres Rivera, Assistant Editor, works closely on the prose and poetry lists in support of the director and publisher and director of poetry.Troy Wilderson, Editorial and Administrative Assistant, provides key in-office coordination for Graywolf and supports the editorial team as a whole. There hasn't been a single moment in my nearly five years with Graywolf when I haven't been treated with absolute respect, by people who are clearly superb at their jobs. J. Robert Lennon Board of Directors Aimee Lagos (Chair), Stefanie Adams, Ramona Advani, Elizabeth Bailey (National Council co-chair), Art Berman, Sheila Berube, Jeff Brockmann, Patrick Clifford, Betsy Doyle, Laurie Hahn Ganser, Brett Goldblatt, Thea Goodman (National Council co-chair), Chris Kirwan, Ruth Ellen Kocher, Lenesa Leana, Ed McConaghay, Mike Meyer, Alexis Racciatti, Willie Reyelts, Kathleen Smith, Elena Sparling, Amanda Zweerink Board Emeritus Marilynn Alcott, Betsy Atwater, Ann Bitter, Page Knudsen Cowles, Sally Dixon, Colin Hamilton, Diane Herman, Katherine Murphy, Mary Polta, Bruno Quinson, Gail See, Kay Sexton, Margaret Telfer, Melinda Ward, John Wheelihan, Margaret Wurtele Publisher Emerita Fiona McCrae National Council Elizabeth Bailey (Co-chair), Thea Goodman (Co-chair), Melchora Alexander, Catherine Allan, Susan Anderson, Trish F. Anderson, Betsy Atwater, Peter Blackstock, Carol Bemis, Ann Bookman, Marion Brown, Kelsey Cerovac, Edwin Cohen, Page Knudsen Cowles, Tobey Forney, Paul Griffiths, Tyneisha Harris, John Michael Hemsley, Patsy Hicks, Cecily Hines, Bob Huseby, Jim Hoecker, Barbara Holmes, Misha Inniss-Thompson, Mark Jensen, Georgia Murphy Johnson, Jacqueline Jones LaMon, Jeffrey Leak, Lisa Lucas, Chris LaVictoire Mahai, Monica MacMillan, Maura Rainey McCormack, Zachary McMillan, Elise Paschen, Shahina Piyarali, Susan Ritz, Marita Rivero, Paula Roe, Sushma Sheth, Stephanie Stebich, Louise Steinman, Kathryn B. Swintek, Kate Tabner, Margaret Telfer, Nancy Temple, Diane Thormodsgard, Sam Ubl, Glyn Vincent, Kristin Walrod, Susan Watson, Tappan Wilder, Shirley Zanton"
year_published = 2025
clearnet = "https://graywolfpress.org/about-us/board-and-staff"
