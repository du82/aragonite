["https://graywolfpress.org/books/image-my-name-enters-america"]
title = "An Image of My Name Enters America | Graywolf Press"
description = "Again, today, if I must choose between love and memory, I choose memory."
full_description = "Breadcrumb Home Books An Image of My Name Enters America Book Title An Image of My Name Enters America Subtitle Essays Author 1 Lucy Ives Cover Image download cover image A Vulture Best Book of 2024 Body Again, today, if I must choose between love and memory, I choose memory. What would you risk to know yourself? Which stories are you willing to follow to the bitter end, revise, or, possibly, begin all over? In this collection of five interrelated essays, Lucy Ives explores identity, national fantasy, and history. She examines events and records from her own life—a childhood obsession with My Little Pony, papers and notebooks from college, an unwitting inculcation into the myth of romantic love, and the birth of her son—to excavate larger aspects of the past that have been suppressed or ignored. With bracing insight and extraordinary range, she weaves new stories about herself, her family, our country, and our culture. She connects postmodern irony to eighteenth-century cults, Cold War musicals to a great uncle’s suicide to the settlement of the American West, museum period rooms to the origins of her last name to the Assyrian genocide, and the sci-fi novel The Three-Body Problem to the development of modern obstetrics. Here Ives retrieves shadowy sites of pain and fear and, with her boundless imagination, attentiveness, and wit, transforms them into narratives of repair and possibility. Share Title List Price $20.00 Purchase at Purchase at: Bookshop IndieBound Barnes & Noble Amazon ISBN ISBN 978-1-64445-311-7 Format Format Paperback Publication Date Publication Date 10/15/24 Subject Subject Literary Collections Pages Pages 336 Trim Size Trim Size 5.5 x 8.25 Keynote From a “brilliant, one-of-a-kind maestro” (Booklist), a vibrant tapestry of memoir, research, and criticism About the Author Credit: Will Matsuda Lucy Ives is the author of three novels: Impossible Views of the World; Loudermilk: Or, The Real Poet; Or, The Origin of the World; and Life Is Everywhere. She is the 2023–2025 Bonderman Assistant Professor of the Practice in Literary Arts at Brown University. More by author Praise “Part criticism, part personal essay, part intellectual jubilation, An Image of My Name Enters America is the most inventive and exciting work of nonfiction this year.”—Maris Kreizman, Vulture’s Best Books of 2024“This is the kind of book you want to read aloud to people you love, to assign, to give as a present—but don’t loan this one; you might not get it back.”—Alexander Chee“From the expansive mind of novelist, poet, and critic Lucy Ives, stylish, sweeping essays that consider the lure of period rooms, Alanis Morissette, Heidegger, and more.”—Vanity Fair“I tore through the poet, art critic, and novelist Lucy Ives’s essay collection with glee. . . . By revealing the ideology behind an object (whether it’s a film or antique furniture), she patiently dismantles our fantasies about America and ourselves. It’s painful to let go of these delusions; it’s also the only way to go on. . . . In the aftermath, at least we can cling to her voice—lively, cathartic, and undeniably charming.”—Celine Nguyen, The Believer Featured Titles Her Body and Other Parties Carmen Maria Machado This Mournable Body Tsitsi Dangarembga Out Stealing Horses Per Petterson, Anne Born Life on Mars Tracy K. Smith View All Books"
