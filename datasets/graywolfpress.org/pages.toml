title = "Primordial | Graywolf Press"
description = "Mai Der Vang’s poetry—lyrically insistent and visually compelling—constitutes a groundbreaking investigation into the collective trauma and resilience experienced by Hmong people and communities, the ongoing cultural and environmental repercussions of the war in Vietnam, the lives of refugees afterward, and the postmemory carried by their descendants. Primordial is a crucial turn to the ecological and generational impact of violence, a powerful and rousing meditation on climate, origin, and fate."
full_description = "Breadcrumb Home Books Primordial Book Title Primordial Subtitle Poems Author 1 Mai Der Vang Cover Image download cover image “The saola morphs in purpose and presence across these poems, as Mai Der Vang continues to forge an ecopoetics that embodies intricate intersections of war, colonialism, environment, and refuge. . . . These are poems of survival.”—Rebecca Morgan Frank, Literary Hub Poem Excerpt I come to you as the animal who wants to be found, a bowl for a place to fit your nested head. I swear not to rush the life where you come back to dream. I’ll wake and wait all night if that’s what the sleeping takes. —from “Animal” Body Mai Der Vang’s poetry—lyrically insistent and visually compelling—constitutes a groundbreaking investigation into the collective trauma and resilience experienced by Hmong people and communities, the ongoing cultural and environmental repercussions of the war in Vietnam, the lives of refugees afterward, and the postmemory carried by their descendants. Primordial is a crucial turn to the ecological and generational impact of violence, a powerful and rousing meditation on climate, origin, and fate. With profound and attentive care, Vang addresses the plight of the saola, an extremely rare and critically endangered animal native to the Annamite Mountains in Laos and Vietnam. The saola looks like an antelope, with two long horns, and is related to wild cattle, though the saola has been placed in a genus of its own. Remarkably, the saola has only been known to the outside world since 1992, and sightings are so rare that it has now been more than a decade since the last known image of one was captured in a camera trap photo in 2013.Primordial examines the saola’s relationship to Hmong refugee identity and cosmology and a shared sense of exile, precarity, privacy, and survival. Can a war-torn landscape and memory provide sanctuary, and what are the consequences for our climate, our origins, our ability to belong to a homeland? Written during a difficult pregnancy and postpartum period, Vang’s poems are urgent stays against extinction. Share Title List Price $18.00 Purchase at Purchase at: Bookshop IndieBound Barnes & Noble Amazon ISBN ISBN 978-1-64445-326-1 Format Format Paperback Publication Date Publication Date 3/4/25 Subject Subject Poetry Pages Pages 176 Trim Size Trim Size 7 x 9 Keynote Pulitzer Prize finalist Mai Der Vang’s “lyrical interventions strike powerful notes of lamentation and rage” (The New Yorker) About the Author Mai Der Vang is the author of Yellow Rain, a finalist for the 2022 Pulitzer Prize in Poetry, and Afterland, winner of the First Book Award of the Academy of American Poets. The recipient of a Lannan Literary Fellowship, her poetry has appeared in Tin House, the American Poetry Review, and Poetry, among other journals and anthologies. She teaches in the MFA Program in Creative Writing at Fresno State.http://maidervang.com/ More by author Upcoming Events Mai Der Vang reading and in conversation with Chaun Webster about PRIMORDIAL at East Side Freedom Library Date: Thursday, March 6, 2025 at 7:00pm Location: East Side Freedom Library in St. Paul, MNview map LOCATION: East Side Freedom Library. Copies of Primordial will be available for purchase from Subtext Books. Free and open to the public. Click here for details.Event Details Mai Der Vang reading from and discussing PRIMORDIAL at UW-Madison Center for Southeast Asian Studies' Friday Forum Lecture Series Date: Friday, March 7, 2025 at 12:00pm Location: UW-Madison Center for Southeast Asian Studies in Madison, WIview map Free and open to the public. Click here for details.Event Details Mai Der Vang reading and in conversation with William Robichaud about PRIMORDIAL at Arcadia Books Date: Friday, March 7, 2025 at 7:00pm Location: Arcadia Books - Spring Green in Spring Green, WIview map Copies of Primordial will be available for purchase from Arcadia Books. Mai Der Vang reading from PRIMORDIAL for the Diasporic Vietnamese Artists Network Reading Series at Medicine for Nightmares Date: Saturday, March 15, 2025 at 7:00pm Location: Medicine for Nightmares in San Francisco, CAview map Mai Der Vang reading and in conversation with Monica Sok about PRIMORDIAL at McNally Jackson Seaport, co-presented by Asian American Writers' Workshop Date: Tuesday, April 22, 2025 at 6:30pm Location: McNally Jackson Seaport in New York, NYview map Copies of Primordial will be available for purchase from McNally Jackson. RSVP required. Reserve your spot.Event Details Mai Der Vang reading and in conversation with Jane Wong about PRIMORDIAL at Elliott Bay Book Company Date: Wednesday, May 7, 2025 at 7:00pm Location: Elliott Bay Book Co in Seattle, WAview map Copies of Primordial will be available for purchase from Elliott Bay Book Company. Stay tuned for details! [more events with author+] [less events with author–] Praise “There’s a way to set a line to remind a reader: poetry is incantation’s medium. Mai Der Vang’s Primordial, then, is a deep spell compendium composed of insistent repetition near graven in its gravity. Vang makes smoke out of LIGHT, planets with LANGUAGE, existence against erasure, and names from secrets, which is to say: this is remarkable poetry set to transfix.”—Douglas Kearney “Relational, vulnerable, and elegantly woven, Vang’s poems animate the endangered saola alongside the resilience of the Hmong people, juxtaposing the origins of life with the legacies we leave behind. . . . This book is a reminder that our survival is intertwined with the natural world at large, and a call to protect both.”—Hoa Nguyen Featured Titles Everything Under Daisy Johnson I Am Not Sidney Poitier Percival Everett Milkman Anna Burns Don't Let Me Be Lonely Claudia Rankine View All Books"
