title = "Submissions | Graywolf Press"
description = "Our editors are looking for high quality literary fiction, nonfiction, and poetry that combine a distinct voice with a distinct vision. Our editors seek out and solicit promising work from authors that they encounter in the pages of magazines, at writing conferences, and in other venues.There are no scheduled prize reading periods at Graywolf Press at this time. We recently concluded our open submission period for poetry in translation."
full_description = '''Title Submissions Subtitle Graywolf Press publishes about 30 books annually, mostly poetry, memoirs, essays, novels, translations, and short stories. Body Our editors are looking for high quality literary fiction, nonfiction, and poetry that combine a distinct voice with a distinct vision. Our editors seek out and solicit promising work from authors that they encounter in the pages of magazines, at writing conferences, and in other venues.There are no scheduled prize reading periods at Graywolf Press at this time. We recently concluded our open submission period for poetry in translation. Widgets ☰In This Section Submission Guidelines Recommended Reading Craft of Writing More Information Poetry Graywolf Press partners with the Academy of American Poets and Cave Canem to publish and promote the work of new and emerging writers. [ more + ] Walt Whitman AwardThe Walt Whitman Award is a $5,000 first book publication prize given to an American poet. In addition to publication and promotion by Graywolf Press, the winner receives an all-expenses-paid six-week residency at the Civitella Ranieri Center in Umbria, Italy, and a trip to New York City to attend the American Poets Prizes ceremony. The Academy of American Poets purchases copies of the winning book to distribute to thousands of its members. For more information please visit the Academy of American Poets website. Cave Canem Poetry PrizeGraywolf Press is one of the publishers of the Cave Canem Poetry Prize, a first book award dedicated to the discovery of exceptional manuscripts by African American poets. Graywolf publishes every third winner of the prize. More information is available on the Cave Canem website. Nonfiction Agents may submit nonfiction submissions to the appropriate editor for consideration. [ more + ] * Fiction Agents may submit fiction submissions to the appropriate editor for consideration. [ more + ] * Recommended Reading Real Sofistikashun Tony Hoagland The Art of Mystery Maud Casey The Virtues of Poetry James Longenbach Thrill Me Benjamin Percy Close Calls with Nonsense Stephanie Burt The Next American Essay John D'Agata Don't Let Me Be Lonely Claudia Rankine 10th Anniversary Edition Notes from No Man's Land Eula Biss The Art of Subtext Charles Baxter If You Want to Write Brenda Ueland, Andrei Codrescu The Art of Description Mark Doty The Half-Known World Robert Boswell View All Books The Craft of Writing This collection of pieces on the craft of writing are contributed by Graywolf authors and staff members. Fiona McCrae on First Pages link pdf Mary Szybist on Visual Poetry link Jeff Shotts on the Art of Rejection link pdf Susan Steinberg on Punctuation link pdf Charles Baxter on the Request Moment link pdf Sarah Manguso on Connection link pdf Harryette Mullen on Starting a Tanka Diary link pdf Tom Sleigh on Haibun, Bashō, the Poet as Journalist as Poet link pdf Robert Boswell on Having Gravity and Having Weight link pdf Tony Hoagland on "Image Out of Sound" link pdf [ more + ]'''
