["https://graywolfpress.org/books/taiwan-travelogue"]
title = "Taiwan Travelogue | Graywolf Press"
description = "May 1938. The young novelist Aoyama Chizuko has sailed from her home in Nagasaki, Japan, and arrived in Taiwan. She’s been invited there by the Japanese government ruling the island, though she has no interest in their official banquets or imperialist agenda. Instead, Chizuko longs to experience real island life and to taste as much of its authentic cuisine as her famously monstrous appetite can bear."
full_description = "Breadcrumb Home Books Taiwan Travelogue Book Title Taiwan Travelogue Subtitle A Novel Author 1 Yáng Shuang-zi; Translated from the Mandarin Chinese by Lin King Cover Image download cover image Winner of the 2024 National Book Award for Translated Literature Body May 1938. The young novelist Aoyama Chizuko has sailed from her home in Nagasaki, Japan, and arrived in Taiwan. She’s been invited there by the Japanese government ruling the island, though she has no interest in their official banquets or imperialist agenda. Instead, Chizuko longs to experience real island life and to taste as much of its authentic cuisine as her famously monstrous appetite can bear. Soon a Taiwanese woman—who is younger even than she is, and who shares the characters of her name—is hired as her interpreter and makes her dreams come true. The charming, erudite, meticulous Chizuru arranges Chizuko’s travels all over the Land of the South and also proves to be an exceptional cook. Over scenic train rides and braised pork rice, lively banter and winter melon tea, Chizuko grows infatuated with her companion and intent on drawing her closer. But something causes Chizuru to keep her distance. It’s only after a heartbreaking separation that Chizuko begins to grasp what the “something” is. Disguised as a translation of a rediscovered text by a Japanese writer, this novel was a sensation on its first publication in Mandarin Chinese in 2020 and won Taiwan’s highest literary honor, the Golden Tripod Award. Taiwan Travelogue unburies lost colonial histories and deftly reveals how power dynamics inflect our most intimate relationships. Share Title List Price $18.00 Purchase at Purchase at: Bookshop IndieBound Barnes & Noble Amazon ISBN ISBN 978-1-64445-315-5 Format Format Paperback Publication Date Publication Date 11/12/24 Subject Subject Fiction Pages Pages 320 Trim Size Trim Size 5.5 x 8.25 Keynote A bittersweet story of love between two women, nested in an artful exploration of language, history, and power About the Author Yáng Shuāng-zǐ is a writer of fiction, essays, manga and video game scripts, and literary criticism. Her works have been translated into Japanese and French. More by author Lin King’s writing and translations have appeared in Boston Review, Joyland, Asymptote, and Columbia Journal. More by author Praise “Beginning in a world as solid and stately as Jun’ichiro Tanizaki’sThe Makioka Sisters, this wise and wily novel deftly takes the reader down a rabbit hole as filled with longing and misunderstanding as Sarah Waters’s The Night Watch.”—Marie Mutsuki Mockett“Yáng Shuang-zi's writing is sweet and delicious on the surface, only to reveal it has real bite. There isn't a single sentence in this powerful metafictional journey through food, language, relationships, and translation that doesn't carry the weight of history.”—Bruna Dantas Lobato“A (fictional) Japanese writer explores the colorful and complex culinary, linguistic, and political dynamics that shaped life in 1930s Taiwan. . . . A moving account of friendship in the shadow of the Japanese Southern Expansion policy.”—Kirkus“Yáng offers rich reflections on colonialism and translation along with delightful depictions of Taiwanese delicacies.”—Publishers Weekly Featured Titles The Dragons, the Giant, the Women Wayétu Moore Citizen Claudia Rankine The Empathy Exams Leslie Jamison Don't Let Me Be Lonely Claudia Rankine View All Books"
