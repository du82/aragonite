["https://graywolfpress.org/books/dissenters"]
title = "The Dissenters | Graywolf Press"
description = "Certain as I’ve never been of anything in the world that you have a right or a duty to know, that you absolutely must know, I sail through the mouth of that river into the sea of her life."
full_description = "Breadcrumb Home Books The Dissenters Book Title The Dissenters Subtitle A Novel Author 1 Youssef Rakha Cover Image download cover image Named a most anticipated book of 2025 by Harper's Bazaar, Literary Hub, and The Millions Body Certain as I’ve never been of anything in the world that you have a right or a duty to know, that you absolutely must know, I sail through the mouth of that river into the sea of her life. Amna, Nimo, Mouna—these are all names for a single Egyptian woman whose life has mirrored that of her country. After her death in 2015, her son, Nour, ascends to the attic of their house where he glimpses her in a series of ever more immersive visions: Amna as a young woman forced into an arranged marriage in the 1950s, a coquettish student of French known to her confidants as Nimo, a self-made divorcee and a lover, a “pious mama” donning her hijab, and, finally, a feminist activist during the Arab Spring. Charged and renewed by these visions of a woman he has always known as Mouna, Nour begins a series of fevered letters to his sister—who has been estranged from Mouna and from Egypt for many years—in an attempt to reconcile what both siblings know about this mercurial woman, their country, and the possibility for true revolution after so much has failed. Hallucinatory, erotic, and stylish, The Dissenters is a transcendent portrait of a woman and an era that explodes our ideas of faith, gender roles, freedom, and political agency. Share Title List Price $17.00 Purchase at Purchase at: Bookshop IndieBound Barnes & Noble Amazon ISBN ISBN 978-1-64445-319-3 Format Format Paperback Publication Date Publication Date 2/4/25 Subject Subject Fiction Pages Pages 296 Trim Size Trim Size 5.5 x 8.25 Keynote A transgressive novel by an acclaimed writer that spans seventy years of Egyptian history About the Author Credit: Bassam El Zoghby Youssef Rakha is an Egyptian author of fiction and nonfiction working in Arabic and English. He is the author of The Book of the Sultan’s Seal, The Crocodiles, and Paulo, which was long-listed for the International Prize for Arabic Fiction and won the 2017 Sawiris Award. More by author Praise “At the heart of Rakha’s novel are the negotiations and renegotiations of the price of meaningful transformation, on personal as well as political fronts. The consonance between these unfoldings not only centers close kinship among the dissenters and with their country but also real grief over the relationships and futures lost in the tumult. The Dissenters immortalizes those fallen sons and daughters of Egypt, whose existences are words, lines, and pages in that ongoing love story of revolution.”—N. S. Ahmed, Bomb Magazine“Unflinching in the portrayal of women’s bodies mobilized in protest, The Dissenters is a complex novel about womanhood, political resistance, and personal history.”—Isabella Zhou, Foreword Reviews“Youssef Rakha is the rare writer who is actually paying attention and trying to make sense of the world while many are devolving into despair. The Dissenters creates a world outside the tinted windows of power, even if that means challenging the abyss.”—Yuri Herrera“A rewarding and sprawling portrait of modern Egypt as reflected through the life story of a complicated Egyptian woman. . . . Readers will be mesmerized.”—Publishers Weekly Featured Titles Grief Is the Thing with Feathers Max Porter The Empathy Exams Leslie Jamison I Am Not Sidney Poitier Percival Everett Everything Under Daisy Johnson View All Books"
