["https://graywolfpress.org/books/dragons-giant-women"]
title = "The Dragons, the Giant, the Women | Graywolf Press"
description = "When Wayétu Moore turns five years old, her father and grandmother throw her a big birthday party at their home in Monrovia, Liberia, but all she can think about is how much she misses her mother, who is working and studying in faraway New York. Before she gets the reunion her father promised her, war breaks out in Liberia. The family is forced to flee their home on foot, walking and hiding for three weeks until they arrive in the village of Lai."
full_description = "Breadcrumb Home Books The Dragons, the Giant, the Women Book Title The Dragons, the Giant, the Women Subtitle A Memoir Author 1 Wayétu Moore Cover Image download cover image “Immersive, exhilarating. . . . This memoir adds an essential voice to the genre of migrant literature, challenging false popular narratives that migration is optional, permanent and always results in a better life.”—The New York Times Book Review Body When Wayétu Moore turns five years old, her father and grandmother throw her a big birthday party at their home in Monrovia, Liberia, but all she can think about is how much she misses her mother, who is working and studying in faraway New York. Before she gets the reunion her father promised her, war breaks out in Liberia. The family is forced to flee their home on foot, walking and hiding for three weeks until they arrive in the village of Lai. Finally, a rebel soldier smuggles them across the border to Sierra Leone, reuniting the family and setting them off on yet another journey, this time to the United States. Spanning this harrowing journey in Moore’s early childhood, her years adjusting to life in Texas as a black woman and an immigrant, and her eventual return to Liberia, The Dragons, the Giant, the Women is a deeply moving story of the search for home in the midst of upheaval. Moore has a novelist’s eye for suspense and emotional depth, and this unforgettable memoir is full of imaginative, lyrical flights and lush prose. In capturing both the hazy magic and stark realities of what is becoming an increasingly pervasive experience, Moore shines a light on the great political and personal forces that continue to affect many migrants around the world, and calls us all to acknowledge the tenacious power of love and family. Share Title List Price $26.00 Purchase at Purchase at: Bookshop IndieBound Barnes & Noble Amazon ISBN ISBN 978-1-64445-031-4 Format Format Hardcover Publication Date Publication Date 6/2/20 Subject Subject Biography & Autobiography Pages Pages 264 Trim Size Trim Size 6 x 9 Keynote An engrossing memoir of escaping the First Liberian Civil War and building a life in the United States About the Author Credit: Ashleigh Staton Wayétu Moore is the author of the memoir The Dragons, the Giant, the Women and the novel She Would Be King. She is a graduate of Howard University, Columbia University, and the University of Southern California. https://www.wayetu.com/ More by author Praise “In her bruising new memoir, Moore describes the perilous journey as well as her experience of being a black immigrant living in the American South. Through it all, she threads an urgent narrative about the costs of survival and the strength of familial love.”—TIME“Formally dazzling yet coolly reflective prose makes for a refined memoir.”—Kirkus Reviews“Building to a thrumming crescendo, the pages almost fly past. Readers will be both enraptured and heartbroken by Moore’s intimate yet epic story of love for family and home.”—Publishers Weekly, starred review“Moore’s narrative style shines, weaving moments of lightness into a story of pain and conflict, family and war, loss and reunion.”—Library Journal, starred review Featured Titles American Journal Tracy K. Smith The Argonauts Maggie Nelson Don't Call Us Dead Danez Smith Don't Let Me Be Lonely Claudia Rankine View All Books"
