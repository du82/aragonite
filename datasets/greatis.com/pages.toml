full_description = "Print Suite .Net Print Components for .Net WinForms What is Print Suite .Net? Print Suite .Net is a set of components for easy printing texts, images and grids from your WinForms applications. Also Greatis Print Suite .Net offers the advanced DocumentDesigner component that allows creating complex print jobs from simple separated print content providers. What Print Suite .Net does? • Prints text, images and grids without manual coding. • Controls preview with advanced PreviewToolbar and PreviewStatusBar components. • Creates and prints complex documents using DocumentDesigner component. What is included into Print Suite .Net? Heart of Print Suite .Net is DocumentDesigner component, that controls all the printing processes. Document content is defined by provider components. Print Suite .Net offers the large set of base abstract providers and specialized providers that prints texts, images and grids. Of course, you can use your old print jobs, based on standard PrintDocument with special DocumentToProvider component. See complete list of included components... How it works? DocumentDesigner contains list of document sections in the Document property, each section has Page and Content lists. If you want to have something on each page of section (i.e. page numbers, headers, watermarks), add provider into Page list, and you'll see the printout of this provider on each page in the section. The content of document is defined by providers from Content list. So, for instance, if you want to print some text with some watermarks on each page, create document section in the DocumentDesigner, add WatermarkProvider into Page list and TextProvider into Content list of the added section. When you'll print this document, you'll see your printed text with some watermark graphics on each page - with no manual code. See more about architecture... See how to use it... See how it works... See more about internal calls sequence... What's about preview? DocumentDesigner has Preview property, that can point to standard PrintPrewiewControl. Just assign it, and you'll see all the printout in preview exactly like you see your printout created in standard PrintDocument. Even more. Print Suite .Net offers ready-to-use toolbar and status bar. Link them with DocumentDesigner and control your preview with easy. See screenshots... Something special? Yes, of course. The complete list of features is too large, so just an example. DocumentDesigner has draft mode, so if you want to see how your document will look on the paper, and you want to save the time and paper, you can activate draft mode and have from 4 to 100 page thumbnails on each printed page. See complete features list... Download free trial version Order Print Suite .Net right now!"
