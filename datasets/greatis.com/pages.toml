radeDownloaded, UpgradeReadyToInstall, UpgradeReadySetupInProgress, UpgradeSetupCompatBlock, UpgradeSetupRolledBack, UPgradeSetupFailed, UpgradeSetupComplete.More info:What is GWXConfigmanager.exe?What is GWXUX.EXE?What is GWXUXWORKER.EXE?How to upgrade to Windows 10 without using GWX?Download Microsoft Media Creation ToolThis tool has 2 options: setup a new system or upgrade current. How to easily remove GWX problem?I suggest you to remove GWX from Windows startup. I wrote a simple free utility to disable GWX scheduling tasks. It does not delete any files from your computer. No adware/spyware. Use it on your own risk!Download GWX Stopper. Free. No adware. No spyware.Download GWX Stopper'
