full_description = "Conway's Game of Life for .Net Conway's Game of Life .Net application and control for Visual Studio The Game of Life was invented by John Conway (as you might have gathered). The game is played on a field of cells, each of which has eight neighbors (adjacent cells). A cell is either occupied (by an organism) or not. The rules for deriving a generation from the previous one are these: Death If an occupied cell has 0, 1, 4, 5, 6, 7, or 8 occupied neighbors, the organism dies (0, 1 neighbors: of loneliness; 4 thru 8: of overcrowding). Survival If an occupied cell has two or three neighbors, the organism survives to the next generation. Birth If an unoccupied cell has three occupied neighbors, it becomes occupied. Greatis Software presents control that realizes this great algorithm. You will see life of a new civilization directly on your computer! It is very beautiful and entertaining! See the screenshot of the Conway's Game of Life application: Control is fully customizable. You can change the field size, cell size, all colors and other settings. See the Options' dialog screenshot: Read more detailed information about Conway's Game of Life on Wikipedia, download Conway's Game of Life .NET for free and enjoy!"
