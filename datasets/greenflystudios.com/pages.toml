title = "Yardmaster: Rule The Rails! iPhone/iPad App"
description = "Greenfly Studios was commissioned by Crash Games to handle the digital port of the successfully Kickstarter funded game Yardmaster"
full_description = '''Client: Crash Games Platforms: iPhone, iPod Touch, iPad Available Here: www.AppStore.com/YardmasterRuleTheRails Greenfly Studios was commissioned by Crash Games to handle the digital port of the successfully Kickstarter funded game Yardmaster. Yardmaster is an interesting new take on Uno mechanics and presents a new matching experience with plenty of strategy. We thoroughly enjoyed working with Patrick Nickell from Crash Games, the game designers Steven Aramini / David Short and we look forward to working with them again. App Description The cargo is rolling into the yard and it’s up to you to organize and manage it, making sure everything is where it’s supposed to be and readying your train for departure. In Yardmaster, 1-5 players are racing to see who can load their train first while adhering to the connection rules (Railcars may only connect if they are the same type of cargo or the same number.) The first player to fully load their train becomes the Yardmaster! Will you rule the rails? var addthis_config = {"data_track_clickback":false,"data_track_addressbar":false,"data_track_textcopy":false,"ui_atversion":"300"}; var addthis_product = 'wpp-3.1';'''
