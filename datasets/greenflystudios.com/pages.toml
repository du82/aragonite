["https://www.greenflystudios.com/project/selfie-chaos"]
title = "#SelfieChaos » Greenfly Studios"
full_description = '''Images #SelfieChaos pokes fun at current society by observing modern online trends and contemporary social interaction. The game allows the player to see the game world through their mobile’s front-facing camera and they are able to use the sandbox environment to creatively express themselves through a combination of emergent gameplay and in-game goals. The resulting ‘selfie’ is then ranked through a fake in-game social media platform (similar to Facebook/Instagram) in which the AI likes and shares the photo/vine which in turn increases points and follower count. The game is a reflection on current societal trends and the desire to be liked, the obsession with increasing follower counts and the over-the-top nature of the most viral images. The game is a reflection on current societal trends and the desire to be liked, the obsession with increasing follower counts and the over-the-top nature of the most viral images. Features Score ‘likes’ based on on-screen visual action Open sandbox environments including L.A., London and Tokyo Increase followers by capturing explosive and crazy selfie’s and vines Videos Demonstration Video var addthis_config = {"data_track_clickback":false,"data_track_addressbar":false,"data_track_textcopy":false,"ui_atversion":"300"}; var addthis_product = 'wpp-3.1';'''
