description = "Greenfly was commissioned by Infrared 5 to help develop 'Shell Squad Adventures' for Hatch, an app spanning across tablets, interactive whiteboards and PC"
full_description = '''Client: Hatch / Infrared5 Platforms: Tablet, PC and Interactive Whiteboard Following on from the development of the Rainbow Loom project, Infrared 5 once again contracted us to contribute to the Shell Squad Adventures app they had been developing for Hatch. As the app had to be playable on tablets, desktop and custom displays (such as interactive whiteboards and tables), Unity3D was a perfect choice to handle the multiple platforms. App Description Access the award winning iStartSmart® Elite Learning System now on the iPad! Shell Squad Adventures by Hatch is a free app created exclusively for children ages 3 – 5 years and is part of the iStartSmart Elite Learning System by Hatch. Shell Squad Adventures helps children build foundational literacy and math skills in English and Spanish while developing empathy and self-esteem. Progress monitoring data on individual child and classroom performance is automatically transferred over to the Hatch Report Management System (RMS) online. var addthis_config = {"data_track_clickback":false,"data_track_addressbar":false,"data_track_textcopy":false,"ui_atversion":"300"}; var addthis_product = 'wpp-3.1';'''
