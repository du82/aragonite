. Infrared 5 contacted us to develop an app that could take a given picture, break it down into the available loom colours and produce an easy to understanding weaving print-out. Using the new Unity UI features, the app […] Read More Drop That Candy: Halloween Sale. 65% Off! Posted by Greenfly Studios on Oct 28, 2014 in News | No Comments Booo! Halloween is almost upon us! Get your candy fix with 80 tricky puzzles and a special Halloween-themed world. As a special treat, get 65% off ‘Drop That Candy’ for a limited time only. The Drop That Candy App is available for £0.69/$0.99 from the App Store on iPhone and iPod touch or at www.AppStore.com/DropThatCandy. The […] Read More ← Older entries"
