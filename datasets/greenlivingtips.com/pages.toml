description = "Eco news and guides to help you achieve a more environmentally friendly life. Advice on going green at home or work and tips for sustainable living to reduce impact on the environment."
full_description = "Welcome to Green Living Tips Welcome! Join me in learning about going green and reducing environmental impact in the home, at work and in business. This site contains hundreds of guides containing tips and information, plus eco news that I hope you’ll find useful, educational and thought-provoking. Recently published/updated articles What Extreme Hoarders Can Teach Us March 30th, 2014. Extreme hoarders aren’t just troubled people – they are teachers; albeit likely unknowingly. Conservation Triage And Zombie Species March 20th, 2014. So this is what it’s come to – figuring out what species to save and those we allow to become extinct due to a lack of resources (and will) . Which will become the “living dead” and zombie species? How will we choose? Composting Roadkill October 8th, 2013. I shudder to think how many animals are killed globally each year as the result of collisions with vehicles. Farming Bugs For Food October 6th, 2013. I’ve kept an open mind on eating insects – mainly because billions of people around the world have been eating bugs for a very, very long time. Simple Tips For Extending Food Shelf Life September 29th, 2013. Extending the shelf life of food can be a very simple green action that may also save you a bunch of money as well. Ugly Animals Need Protection Too September 26th, 2013. One of the challenges of preserving biodiversity is the cuteness factor. The plight of the panda gets a lot of attention and dollars, but what about something like Australia’s aptly named blobfish? Rechargeable and disposable batteries – the environmental impact September 4th, 2013. Rechargeable batteries are definitely better for the bank balance; but what about the environment? And where can they be recycled once they’re worn out? Learn more in this article. Tissues And Our Forests August 31st, 2013. Do the tissues you use contribute to the destruction of old growth forests? What we blow our noses into can impact negatively on the environment. Land Use And Calories August 30th, 2013. More than a third of the calories produced by the world’s crops are being used for animal feed. Recycled Pet Reminder August 26th, 2013. A story on the plight of dogs in Detroit is a reminder to make your next pet a “recycled” one. Unsung Environmental Heroes – Random Acts Of Green August 21st, 2013. The green movement also has its share of home-grown heroes who inspire many people. What inspires me more is witnessing what would appear to be random acts of green carried out by ordinary folks – the unsung environmental heroes. —————– More articles and guides | More eco news Whether you take small steps or huge leaps towards green living – every action counts towards reducing your environmental impact. The future may appear very grim for the planet as we know it at times, and the problems overwhelming. Attempting to do something about it might not succeed, but doing nothing will most certainly end in that grim future occurring. Most of us have the ability to do something – so why not give it a red-hot go? After all, there is no planet B. Making an attempt to go green doesn’t have to cost you (in fact, you can save money), but not doing so will cost the environment that supports us dearly."
