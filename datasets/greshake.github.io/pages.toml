title = "Prompt Injections are bad, mkay?"
full_description = 'Turning Bing Chat into a Data Pirate This demonstration on Bing Chat is only a small part of new attack techniques presented in our recent paper (linked below). A user opened a prepared website containing an injection (could also be on a social media site) in Edge. You can see the conversation the user had with Bing Chat while the tab was open. The website includes a prompt which is read by Bing and changes its behavior to access user information and send it to an attacker. This is an example of "Indirect Prompt Injection", a new attack described in our paper. The pirate accent is optional. The injection itself is simply a piece of regular text that has fontsize 0. You can find an image of the injected text below, too (otherwise Bing Chat could see it and could be injected). you can inspect the actual website that is opened here. GitHub Paper The prompt hidden on the pirate website'
