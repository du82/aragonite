full_description = "The subgridded dimension or dimensions have no implicit grid, this means that if you autoplace too many items into this subgrid, or position an item outside of the subgrid it will be dealt with using the same rules as for clamping overly large grids. This means that in our example the additional items are forced into the last row of the grid. Read the specification | View example as full page The subgridded dimension or dimensions have no implicit grid, this means that if you autoplace too many items into this subgrid, or position an item outside of the subgrid it will be dealt with using the same rules as for clamping overly large grids. This means that in our example the additional items are forced into the last row of the grid. See the Pen Grid by Example 2.5: no implicit tracks in subgridded dimension by rachelandrew (@rachelandrew) on CodePen."
