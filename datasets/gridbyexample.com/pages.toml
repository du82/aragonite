["https://gridbyexample.com/examples/example37"]
title = "auto-fill vs. auto-fit"
full_description = "Demonstrating the difference between the auto-fill and auto-fit keywords. Spec here and you’ll need Chrome 55 or Firefox with Grid enabled to see the difference. In the first example we use the auto-fill keyword for repeat. We get as many tracks with a minimum of 200 pixels and maximum of 1fr as will fit in the container. In the second example we use the auto-fit keyword for repeat. We get as many tracks with a minimum of 200 pixels and maximum of 1fr as will fit in the container. After auto-placement any empty tracks are collapsed to 0. So our items can expand to take up the remaining space. Read the specification | View example as full page"
year_published = 2025
