["https://gridbyexample.com/news/2019/05/23/subgrid-in-nightly"]
title = "The subgrid feature is now in Firefox Nightly"
full_description = "May 23, 2019 Last night the release of Firefox Nightly included subgrid. So you can now try out all of the examples I have been creating for yourself. Here are some of the places you can go to look at the examples I have been putting together: My initial write-up of the feature in Smashing Magazine. The documentation for the feature on MDN. Examples on this site The recent talk I have been doing - the latest was yesterday at Codegarden - has slides and more demos. A post on my blog regarding one of the less obvious patterns subgrid will help us with. If you are looking at subgrid and find something which looks like a browser bug in Nightly - something where the specification says one thing and the browser is doing another - you can raise that over at Bugzilla. The main bug for implementation is here. If you look at the “Depends on” section you can see other issues already raised. If you find something new, raise a new issue. If you find something that is not in the specification but you think that it should be, or realise there is a problem building a certain pattern which seems like a subgrid use case, log that with the CSS Working Group as an issue on the spec itself. Head over to the Chrome bugtracker and star the bug there to show your interest in implementation. Don’t add “me too” type comments, just hit the star. By doing so you’ll get updates if any comments are made on progress. ⇦ Back to Blog listing"
