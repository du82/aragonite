["https://gridbyexample.com/patterns/header-asmany-footer"]
title = "Header, footer, centre panel containing as many items as fit"
full_description = "This is example shows a two column pattern, with header and footer. The centre panel contains a number of boxes. We want to have as many in each row as will fit, with the boxes lining up as rows and columns. This technique means we don’t need to use media queries, as with a flex layout grid does the job for us. The fallback uses Flexbox, we need to constrain the items in the flex layout in order to get the appearance of two-dimensional alignment. I am using minmax in two places in my grid definition. To create the column listing of tracks that are a minimum of 200 pixels and a maximum of 1fr. Also, when defining rows I want my rows to be a minimum of 100 pixels tall but expand to the height of whatever is put into them. So the rows have a max of auto. Techniques used to create this layout Minmax auto-fill and auto-fit Feature Queries Tips and techniques for fallback layouts can be found in my Grid Fallbacks and Overrides Cheatsheet."
