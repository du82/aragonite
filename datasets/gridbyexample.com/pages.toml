["https://gridbyexample.com/posts"]
title = "News and updates on CSS Grid Layout"
full_description = "Last night the release of Firefox Nightly included subgrid. So you can now try out all of the examples I have been creating for yourself. Back with an update with news of CSS Grid Level 2. Level 2 is mostly about the subgrid feature which was removed from Level 1 pending more discussions about how it should work. Subgrid is currently being implemented in Firefox, and I’ve been testing some early builds in order to be able to document the specification. I’ve not been very good at updating with bits of news since Grid shipped in browsers, however to complete the picture of browsers shipping Grid layout in 2017, Edge will ship their release to the public with the Windows update on October 17th, 2017. Yesterday the feature list for the Safari 10.1 release was posted, this release is now in Beta and includes Grid. The work to implement grid in Safari has been completed by the team at Igalia, who also implemented it in Blink. We should see Grid support out from behind flags in Firefox and Chrome by March next year. You can keep track of browser updates and news on my browsers page. However, we will still have old browsers to consider and new browsers that don’t yet support the new specification. As we start to create more complex layouts it is worth understanding how grid interacts with other layout methods. In the video today I take a look at how grid works when grid items or their children use position: absolute. The properties used to define the explicit grid are grid-template-columns, grid-template-rows, and grid-template-areas. These can be combined into the grid-template shorthand. If there is a string of text inside the element that has display: grid it will become a grid item, this anonymous item will participate in the grid layout but otherwise can’t be styled and will use the CSS of the parent. If grid items are being placed by auto-placement then they will be placed into empty cells on the grid, and not overlap each other. However you can position grid items into the same grid cells or allow them to overlap. Overlapping items can be controlled in terms of their stacking order using z-index."
year_published = 2025
clearnet = "https://gridbyexample.com/posts"
