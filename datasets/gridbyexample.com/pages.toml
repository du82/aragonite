["https://gridbyexample.com/learn/2016/12/13/learning-grid-day13"]
title = "Day 13: Grid Template Areas"
full_description = 'Dec 13, 2016 Earlier in this series we looked at how to lay out items using line numbers, and also named lines. There is another way to create layouts on your grid and that is to use the descriptive named grid areas method. To use template areas you first need to name the areas of your layout, using the grid-area property. header { grid-area: hd; } footer { grid-area: ft; } article { grid-area: main; } aside { grid-area: sidebar; } You then use the assigned names to describe your layout as the value of the grid-template-areas property. .grid { grid-template-columns: 2fr 4fr; grid-template-areas: "hd hd" "sidebar main" "sidebar ft"; } I demonstrate how to create a layout using grid-template-areas in this video from my video tutorial series. What is this? I’m sharing some tips to help you learn Grid Layout from the 1st of December until Christmas. Edited highlights from the things on this site and that I’ve posted elsewhere. Follow along! If you find this style of learning useful then you might enjoy my online CSS Layout Workshop. I’m also available for in-house training, workshops and consultancy or conference speaking. ⇦ Back to Blog listing'
