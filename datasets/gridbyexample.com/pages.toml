["https://gridbyexample.com/learn/2016/12/24/learning-grid-day24"]
title = "Day 24: Using Feature Queries"
full_description = "Dec 24, 2016 We should see Grid support out from behind flags in Firefox and Chrome by March next year. You can keep track of browser updates and news on my browsers page. However, we will still have old browsers to consider and new browsers that don’t yet support the new specification. CSS has come up with a solution for us in Feature Queries. If you have ever used Modernizr you will be familiar with the concept of detecting support for a feature and then writing CSS only if the feature is supported, Feature Queries are a native CSS way of doing that. Take a look at this in my video, which is part of my CSS Grid video tutorial series. You can also read more about Feature Queries in this article by Jen Simmons. What is this? I’m sharing some tips to help you learn Grid Layout from the 1st of December until Christmas. Edited highlights from the things on this site and that I’ve posted elsewhere. Follow along! If you find this style of learning useful then you might enjoy my online CSS Layout Workshop. I’m also available for in-house training, workshops and consultancy or conference speaking. ⇦ Back to Blog listing"
