["https://gridsome.org"]
title = "Modern Site Generator for Vue.js - Gridsome"
description = "Gridsome is a free & open source Vue.js-powered framework for building websites & apps that are fast by default 🚀."
full_description = '''Gridsome makes it easy for developers to build static generated websites & apps that are fast by default 🚀 Build websites with modern tools like Vue.js, GraphQL & all the power of Node.js & the JavaScript ecosystem. Develop locally and get instant hot-reloading for any code change. Gridsome builds ultra performance into every page by using the PRPL pattern. You get code splitting, asset optimization, progressive images, and link prefetching out of the box. Gridsome sites get almost perfect page speed scores by default. Gridsome generates static PWAs. Only critical HTML, CSS, and JavaScript get loaded first. The next pages are then prefetched so users can click around incredibly fast without page reloads, even when offline. The future of the web is JavaScript, APIs, and Markup - the Jamstack. Gridsome uses the power of blazing fast static site generation, JavaScript and APIs to create stunning modern web experiences. No servers. No databases. Only files. Deploy your entire site to a CDN and forget about it. A Gridsome site can handle thousands to millions of hits without breaking - and no expensive server costs. Gridsome sites load as static HTML before they hydrate into fully Vue.js-powered SPAs. This makes it possible for search engines to be able to crawl content and give better SEO ranking, and still have all the power of Vue.js. The modern web is decoupled and modular. Gridsome makes it painlessly easy to build Jamstack websites using data from multiple sources such as Content API's, Headless CMSs, and other web services. Infinite loading is an alternative strategy for loading additional nodes/content onto a page without the use of traditional pagination. Infinite loading instead loads the next batch of content when a user scrolls to the bottom of a web page. Posted 8. October 2019 by <img src="/assets/static/codybarr.6bfb9c4.029e659329e73437025b6b6896e30e31.jpg" class="author-image g-image g-image--loaded" width="60" alt="Cody Barr">Cody Barr - 3 min read Version 0.7 is finally here! Enjoy Vue Components in Markdown, new Schema API, File-based dynamic routing, better Template config, Custom App.vue, Shareable Network URL and more!'''
