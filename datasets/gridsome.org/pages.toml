["https://gridsome.org/blog/2018/10/10/say-hello-to-gridsome"]
title = "Say hello to Gridsome 👶🎉💚 - Gridsome"
description = "Gridsome is a free & open source Vue.js-powered framework for building websites & apps that are fast by default 🚀."
full_description = '''A new static site generator baby is born. It's highly inspired by Gatsby.js (React based) but built on top of Vue.js. We have been working on it for a year and will have a beta ready soon. You can expect this baby to grow up fast!There are so many Static Site Generators. Why another one? We think Gridsome is a missing piece to the Vue.js ecosystem. What Gatsby.js does for React.js is a game changer in how we build websites. React.js is excellent, but we think Vue.js is more approachable for most web designers and devs getting started with Jamstack. Gridsome is the Vue.js alternative to Gatsby. With Gridsome you get a universal GraphQL layer for all your connected data sources. It's like a single source of truth for your website data ready to be used in any page or components. Connect to any CMS or APIs like Google Spreadsheet, Airtable, Instagram Feed, local markdown files, etc. Here is an example on how to query posts from the GraphQL layer in a page: <template> <Layout> <h2>Latest blog posts</h2> <ul> <li v-for="edge in $page.allWordPressPost.edges" :key="edge.node._id"> {{ edge.node.title }} </li> </ul> </Layout> </template> <page-query> query { allWordPressPost (limit: 5) { edges { node { _id title } } } } </page-query> You don't need to know GraphQL or Vue to get started with Gridsome - It's a great way to get introduced to both. The GraphQL layer and all the data can be explored in a local GraphQL playground. The playground is usually located at https://localhost:8080/___explore when a Gridsome development project is running. Perfect scores on Google Lighthouse - automagically 💚 One of the main goals of Gridsome is to make a framework that lets you build websites that are optimized "out-of-the-box." It follows the PRPL-pattern by Google. You don't need to be a performance expert to make fast websites with Gridsome. Your site gets almost perfect scores on Google lighthouse out-of-the-box. These are some of the performance steps that Gridsome takes care of: Image compressing & lazy-loading ⚡️ CSS & JS minification ⚡️ Code-splitting ⚡️ HTML compressing ⚡️ Critical CSS (Plugin) ⚡️ Full PWA & Offline-support (plugin) ⚡️ A better way to build websites Gridsome is built for the Jamstack workflow - a new way to build websites that gives you better performance, higher security, cheaper hosting, and a better developer experience. Generate prerendered (static) pages at build time for SEO-purpose and add powerful dynamic functionality with APIs and Vue.js. We believe the SSGs / Jamstack trend is just getting started. When you have first started to make websites this way there is no way back. You feel almost "dirty" when going back to a traditional WordPress / CMS setup. Try running the new Chrome Lighthouse (Audit tab in Developer tools) on a WordPress site - It is impossible to get good scores even with the best caching plugins and hosting. With Gridsome you don't even need caching plugins. Website optimization is taken care of at build time. This is what we think is very exciting and is why we are building Gridsome. It is the perfect SPA & PWA front-end solution for any headless CMS or content APIs. Whats next In the next couple of months we're going to continue to improve the docs, create tutorials, add more source & transformer plugins and fix bugs. Contribute to Gridsome We're currently just two brothers working on this, so any contribution is very welcome. We're passionate about building a faster web and make website building fun again. You can also support us by giving a GitHub star ★ and spread the word :)'''
