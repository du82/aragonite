["https://gridstudio.cc"]
title = "Grid | Frame Studio - Every Classic Deserves To Be Framed"
description = "In this digital technology era today, some digital products will be brought back your memories. We select the precious collection of marvellous article, unfold and restore in a collage frame, turn them into a tale of smart phone generation with value of art, the best choice for your collection permanently."
full_description = "“For me, there is something indulgent about old technology. The efforts put in by every party who made every semiconductor work, gave every retro phone their unique story. Mobile phones were, are, and will always be an indispensable part of our lives. What I do is spice them up with a sprinkle of admiration. I hope these items from the good old days will bring reminiscence, astonishment and happiness to those who still appreciate them. They will also be a gentle reminder of this ever-evolving day and age.”-- Joe, industrial designer & handicraft artist We scout around the market seeking out old phones that are slowly disappearing or forgotten. Luckily, we’re still able to buy them off some people’s hands. We pick the ones that people are likely to remember, take them apart and clean with special care. We put them back together into different shapes according to our meticulous designs. The reassembled products are framed in polished and varnished natural wood. When old but gold tech meet all-natural derivatives, you get a wide range of carefully arranged and attached décor masterpieces. They are delicately packaged in handmade giftwraps, stamped, and now ready to grace the household of everyone who would like a piece of the olden times. Hands-on: GRID 4S turns a disassembled iPhone into decor for your home9to5mac | Jan 13,2021Gerahmtes iPhone: Diese Firma verwandelt alte Gadgets in Bildert3n.de | April 8, 2021機種変してもズッと一緒。昔のスマホ、バラして額装したら立派なアートになるよgizmodo.jp | Jan 14, 2021iPhone diventa un pezzo da museo con il kit GRIDmacitynet.it | Jan 16, 2021Este iPhone 3GS deconstruido y enmarcado también es una obra de arte que puedes colgar en tu salónapplesfera.com | March 22, 2021"
