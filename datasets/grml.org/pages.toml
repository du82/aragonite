["https://grml.org/changelogs/README-grml-2024.12"]
title = "Release Notes: Grml 2024.12 - codename Adventgrenze | Grml.org"
full_description = "Grml is a Debian based live system focusing on the needs of system administrators. The 2024.12 release provides fresh software packages from Debian trixie. As usual it also incorporates up to date hardware support and fixes known bugs from previous Grml releases. The following 8 relevant packages have been added (excluding e.g. lib*, fonts*, *-{base,bin,common,core,data}, {gcc,cpp}-*, perl*, python*, ruby* and kernel image): The following 17 Debian packages have been removed/replaced (excluding lib*, fonts*, *-{base,bin,common,core,data}, {gcc,cpp}-*, perl*, python*, ruby* and kernel image): Your comments, bug reports, patches, and suggestions will help fixing bugs and improving future releases. If you find a problem with the release, please check the known bugs list and report problems using information on grml.org/bugs/. We also welcome feature requests and any kind of constructive feedback. If you want to reach out to the Grml team, please visit our contact webpage. The Grml team is available also for commercial support and services. If you are interested in our consulting services, need a special feature in Grml or a custom branded Grml version with your company logo, please reach out to business (at) grml.org Many thanks in this release go to (alphabetically) András Korn, Antoine Beaupré, Christopher Bock, pasja, Patrick Schleizer and unknowndevQwQ for their contributions. To sign up for future Grml announcements, please subscribe to Grml’s announcement list or follow our blog. Grml is sponsored by several companies. For more information about our sponsors check out the Sponsors webpage. Our main sponsors are:"
