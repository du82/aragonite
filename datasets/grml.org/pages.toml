full_description = "If you want to be notified when a new Grml release is available, subscribe to the read-only Grml announce mailing list. If you want to participate in the user mailing list of Grml, please subscribe to the Grml user mailing list. Anyone can post to this mailing list, but if you are not already subscribed, your message will need moderator approval before being posted. This way we limit the amount of spam that makes it to the list. The Grml user mailing list is also available via NNTP on gmane.io. If you are interested in following the development of Grml, please join us on IRC (see below) and follow current changes on GitHub. You can look at individual repositories and subscribe to changes, issues, PRs, and so on there. Several Grml sub-projects (grml-debootstrap, grml-etc-core, grml2usb,…) have their own repository and issue tracking, see github.com/grml/ to get an overview. If you’re unsure where to report an issue though, feel free to use github.com/grml/grml/issues though. Grml is sponsored by several companies. For more information about our sponsors check out the Sponsors webpage. Our main sponsors are:"
