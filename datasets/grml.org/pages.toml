["https://grml.org/faq"]
title = "FAQ for Grml | Grml.org"
full_description = "Grml is a bootable live system (Live-CD) based on Debian. It is not necessary to install anything to a harddisk. Grml includes a collection of GNU/Linux software especially for system administrators. It specializes on administrative tasks like installation, deployment and system rescue. Since Grml release 2024.12, the grml32 flavour (for 32-bit x86 PCs) as well as the grml96 flavours no longer exist. A new naming convention was introduced to include the architecture and version information, being grml-$FLAVOUR-$VERSION-$ARCH. What was formerly known as grml64 is now known as grml-*-amd64. You will see, for example, grml-full-2024.12-amd64.iso, where amd64 indicates this ISO is for an 64-bit x86 PC. grml-small provides a reduced set of available software compared to grml-full, for example it doesn’t provide the X.org window system. It provides the same Linux kernel image as grml-full and is fully binary compatible. Choose the grml-small flavour if size - for whatever reason - really matters to you. Grml comes close to “argl” or “grrr” in English. People use this when they want to express their dissatisfaction with software (amongst other things). In Austria, Advent wreaths are called Adventkränze, and Adventgrenze is pronounced similarly; however, Grenze is the German word for border. where /dev/sdX is your USB device. Warning: all previously stored data on the USB device will be lost. On our wiki, you will find additional background information on booting from USB. On modern PCs, both dd and grml2usb just work. There are no default passwords - all accounts are locked by default for security reasons. Even local logins are not possible (unless you set a password or create new user accounts as root). You can create valid passwords using sudo passwd [username] from the shell individually. With the boot option ssh a password for the users root and grml is generated and SSH login is enabled. The default language of the Grml system is English (en_US.UTF-8). All other locales are removed by default."
year_published = 2025
clearnet = "https://grml.org/faq"
