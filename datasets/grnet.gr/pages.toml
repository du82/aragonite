full_description = "Το Εθνικό Δίκτυο Υποδομών Τεχνολογίας και Έρευνας (ΕΔΥΤΕ Α.Ε. – GRNET S.A.) είναι τεχνολογικός φορέας του Υπουργείου Ψηφιακής Διακυβέρνησης, που παρέχει δικτυακές και υπολογιστικές υπηρεσίες σε ακαδημαϊκά και ερευνητικά ιδρύματα, σε φορείς της εκπαίδευσης όλων των βαθμίδων και σε φορείς του δημόσιου, ευρύτερου δημόσιου και ιδιωτικού τομέα. Είναι υπεύθυνο για την προώθηση και διάδοση των εφαρμογών των δικτυακών και υπολογιστικών τεχνολογιών, την σύνταξη και υλοποίηση την εθνικής στρατηγικής για την ανάπτυξη των Ψηφιακών Δεξιοτήτων και για την προώθηση και υλοποίηση των στόχων του Ψηφιακού Μετασχηματισμού.Κατέχει κεντρικό ρόλο συντονιστή όλων των ψηφιακών υποδομών για την Παιδεία και την Έρευνα, αξιοποιώντας εμπειρία λειτουργίας, από το 1998, στους τομείς των προηγμένων υποδομών και υπηρεσιών δικτύου, υπολογιστικού νέφους και πληροφορικής και εξυπηρετεί σε καθημερινή βάση εκατοντάδες χιλιάδες χρήστες στους στρατηγικούς τομείς της Δημόσιας Διοίκησης, της Εκπαίδευσης, της Έρευνας, της Υγείας και του Πολιτισμού. Τελευταία Νέα 4 Μαρτίου, 2025 Αποτελέσματα αξιολόγησης υποψηφίων για τη σύναψη σύμβασης μίσθωσης έργου στο πλαίσιο του ευρωπαϊκού ανταγωνιστικού έργου «SmartAttica-AtHeNAI». 4 Μαρτίου, 2025 Αποτελέσματα αξιολόγησης υποψηφίων για τη σύναψη σύμβασης μίσθωσης έργου στο πλαίσιο του Υποέργου 1 «Ανάλυση, Ανάπτυξη και Τεχνική Υποστήριξη του Πληροφοριακού Συστήματος» της Πράξης «ΠΙΛΟΤΙΚΗ ΕΦΑΡΜΟΓΗ ΤΗΣ ΔΡΑΣΗΣ “ΝΤΑΝΤΑΔΕΣ ΤΗΣ ΓΕΙΤΟΝΙΑΣ”». 4 Μαρτίου, 2025 Γνωστοποίηση παράτασης καταληκτικής ημερομηνίας υποβολής προσφορών και διενέργειας του Ανοιχτού Διαγωνισμού άνω των ορίων για την «Προμήθεια εξοπλισμού για την ανάπτυξη ενός κβαντικά ασφαλούς δικτύου πολύ υψηλών ταχυτήτων μεταξύ 4 κυβερνητικών κόμβων του εθνικού δικτύου κβαντικών υποδομών HellasQCI». 27 Φεβρουαρίου, 2025 Ενημέρωση σχετικά με νεότερη παράταση του χρόνου υποβολής των προσφορών για τη Διακήρυξη Ανοιχτού Διαγωνισμού άνω των ορίων για την «Προμήθεια εξοπλισμού για την ανάπτυξη ενός κβαντικά ασ