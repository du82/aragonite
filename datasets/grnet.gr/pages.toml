title = "Προφίλ - GRNET Website"
description = "Τα cookies αυτής της κατηγορίας είναι απαραίτητα για την ορθή και αποτελεσματική λειτουργία της ιστοσελίδας"
full_description = "Εταιρικό Προφίλ Έντυπο Εταιρική Παρουσίαση ΕΔΥΤΕ Α.Ε Σύγχρονες Ψηφιακές Τεχνολογίες για τη Δημόσια Διοίκηση, την Εκπαίδευση, την Έρευνα, την Υγεία και τον Πολιτισμό Ο ρόλος της ΕΔΥΤΕ Το Εθνικό Δίκτυο Υποδομών Τεχνολογίας και Έρευνας (ΕΔΥΤΕ Α.Ε. – GRNET), φορέας του Υπουργείου Ψηφιακής Διακυβέρνησης, είναι ένας από τους μεγαλύτερους δημόσιους τεχνολογικούς φορείς της χώρας και λειτουργεί από το 1998. Παρέχει προηγμένες υποδομές και υπηρεσίες δικτύου, υπολογιστικού νέφους και πληροφορικής σε ακαδημαϊκά και ερευνητικά ιδρύματα, σε φορείς της εκπαίδευσης όλων των βαθμίδων και σε φορείς του δημόσιου, ευρύτερου δημόσιου και ιδιωτικού τομέα. Εξυπηρετεί σε καθημερινή βάση εκατοντάδες χιλιάδες χρήστες στους στρατηγικούς τομείς της Δημόσιας Διοίκησης, της Εκπαίδευσης, της Έρευνας, της Υγείας και του Πολιτισμού. Αποτελεί σύμβουλο του Υπουργείου Ψηφιακής Διακυβέρνησης σε θέματα σχεδιασμού και αναβάθμισης προηγμένων πληροφοριακών συστημάτων. Συνδράμει στην προώθηση και υλοποίηση των στρατηγικών στόχων του Υπουργείου Ψηφιακής Διακυβέρνησης, με εμπεριστατωμένες αναλύσεις, τεχνολογικές μελέτες, πρότυπες λύσεις και ειδική τεχνογνωσία σχεδιάζει και αναπτύσσει προηγμένα πληροφοριακά συστήματα και υποδομές για την επίτευξη του Ψηφιακού Μετασχηματισμού της χώρας. Έχει κεντρικό ρόλο συντονιστή όλων των ψηφιακών υποδομών για την Παιδεία και την Έρευνα. Συμβουλεύει και υποστηρίζει την Πολιτεία, με τον σχεδιασμό προηγμένων πληροφοριακών συστημάτων και υποδομών, τον σχεδιασμό, την ανάπτυξη και τη συντήρηση προηγμένων υπολογιστικών & δικτυακών υποδομών και υπηρεσιών, το πανελλήνιο δίκτυο οπτικών ινών, κέντρα δεδομένων, υπολογιστικό σύστημα υψηλών επιδόσεων (HPC-ARIS), λειτουργία του Εθνικού Κέντρου Ικανοτήτων -EuroCC-Greece HPC Hub, την λειτουργία, ανάπτυξη και προώθηση της Εθνικής Ακαδημίας Ψηφιακών Ικανοτήτων, συντονισμός του έργου ‘Κόμβος Καινοτομίας για την Ψηφιακή Διακυβέρνηση’ (DigiGov InnoHub), με στόχο την ένταξή του στους Ευρωπαϊκούς Κόμβους Ψηφιακής Καινοτομίας υποστηρίζοντας την καινοτομία σε Εθνικό και Ευρωπαϊκό επίπεδο. Επίσης συντονίζει και συμμετέχει σε έργα Ανοικτής Επιστήμης και συμμετέχει στη διαμόρφωση της εθνικής στρατηγικής για την Τεχνητή Νοημοσύνη. Επιπλέον, συντονίζει την Εθνική Υποδομή Κβαντικής Επικοινωνίας για την Ελλάδα (HellasQCI), στο πλαίσιο της ευρωπαϊκής πρωτοβουλίας EuroQCI για την ανάπτυξη ασφαλών επικοινωνιών πανευρωπαϊκά, προστατεύοντας ευαίσθητα δεδομένα και κρίσιμες υποδομές. Διεξάγει τεχνολογική Έρευνα και ανάπτυξη σε θέματα τηλεπικοινωνιακών δικτύων και υπολογιστικών υπηρεσιών. Υλοποιεί και διαχειρίζεται Εθνικά, Ευρωπαϊκά και Διεθνή Έργα. Παρέχει διεθνή δια-συνδεσιμότητα μέσω του πανευρωπαϊκού δικτύου GÉANT, και είναι το Εθνικό Δίκτυο για την Έρευνα και την Τεχνολογία (National Research and Education Network – NREN). Διαχειρίζεται το Greek Internet Exchange (GR-IX), εθνική υποδομή που διασυνδέει τις σημαντικότερες εταιρείες διαδικτύου που δραστηριοποιούνται στην Ελλάδα (π.χ. παρόχους υπηρεσιών Internet, cloud, hosting, VoIP κ.ά.). Η ΕΔΥΤΕ διαθέτει Διασύνδεση και Λειτουργία, Υποδομές και Υπηρεσίες Η ΕΔΥΤΕ καλύπτει τις ανάγκες διασύνδεσης και λειτουργίας υπολογιστικών συστημάτων και υπηρεσιών των Φορέων που εξυπηρετεί. Διαθέτει: Πανελλαδικό δίκτυο οπτικών ινών Υπολογιστικό σύστημα υψηλών επιδόσεων High Performance Computing (HPC-ARIS) Εθνικό Κέντρο Ικανοτήτων HPC To ελληνικό Internet Exchange GR-IX για τη διευκόλυνση της ανταλλαγής κίνησης διαδικτύου (IP) Υποδομές (6), κέντρα δεδομένων (data centers) Εθνική Ακαδημία Ψηφιακών Ικανοτήτων Υπηρεσίες Internet, cloud computing, high-performance computing, storage, ταυτοποίησης και εξουσιοδότησης, ασφάλειας, καθώς και υπηρεσίες ήχου, φωνής και βίντεο Υπηρεσίες διασύνδεσης Φορέων και παραρτημάτων αυτών σε Ελλάδα, Ευρώπη, και διεθνή δια-συνδεσιμότητα μέσω του Πανευρωπαϊκού δικτύου GÉANT. Κατάλογος Ψηφιακών Υπηρεσιών ΕΔΥΤΕ: https://grnet.gr/services-az/ Κατάλογος με Διεθνή, Ευρωπαϊκά, Εθνικά Έργα που συμμετέχει η ΕΔΥΤΕ: https://grnet.gr/projects Oι Φορείς και τα Ιδρύματα που εξυπηρετεί η ΕΔΥΤΕ Το δίκτυο GRNET της ΕΔΥΤΕ συνδέει και εξυπηρετεί Φορείς και Ιδρύματα: Πανεπιστήμια, Ανώτατες Εκκλησιαστικές Ακαδημίες (ΑΕΑ) Φορείς εκπαίδευσης όλων των βαθμίδων Το Πανελλήνιο Σχολικό Δίκτυο Μεγάλες Ερευνητικές υποδομές Ερευνητικά Κέντρα Φορείς Περιεχομένου Μουσεία, Βιβλιοθήκες και άλλοι Πολιτιστικοί φορείς Δημόσιες Νοσοκομειακές Μονάδες Φορείς Δημόσιας Διοίκησης Οι χρήστες των Υποδομών και Υπηρεσιών της ΕΔΥΤΕ Οι υποδομές και υπηρεσίες της ΕΔΥΤΕ- και το δίκτυο GRNET αξιοποιούνται καθημερινά από εκατοντάδες χιλιάδες χρήστες: Στελέχη της Ακαδημαϊκής και Ερευνητικής κοινότητας (καθηγητές, ερευνητές, διοικητικό και τεχνικό προσωπικό (Κέντρα Διαχείρισης Δικτύου NOC)) Φοιτητές/Σπουδαστές Προσωπικό Δημόσιων Νοσοκομειακών Μονάδων Προσωπικό Δημόσιας Διοίκησης Στελέχη Επιχειρήσεων Πολίτες Οφέλη για όλους Η ΕΔΥΤΕ προσφέρει ένα ολοκληρωμένο περιβάλλον τεχνολογιών αιχμής, πρότυπες λύσεις και ειδική τεχνογνωσία που συμβάλλουν: στον Ψηφιακό Μετασχηματισμό της Δημόσιας Διοίκησης και την αναβάθμιση της συνολικής εμπειρίας εξυπηρέτησης του πολίτη από το κράτος, στη δημιουργία νέων μοντέλων συνεργασίας μεταξύ των δημόσιων οργανισμών, των Ερευνητικών και Εκπαιδευτικών κοινοτήτων, των πολιτών και των επιχειρήσεων, στη βελτίωση της εκπαιδευτικής διαδικασίας και της εκπαιδευτικής εμπειρίας, στην ενδυνάμωση της ερευνητικής κοινότητας και στην ανάπτυξη του ερευνητικού έργου στη Χώρα, στην εξωστρέφεια της ελληνικής ερευνητικής και εκπαιδευτικής κοινότητας με την ισότιμη συμμετοχή της σε παγκόσμιες δράσεις ΤΠΕ, στον εκσυγχρονισμό του τομέα Υγείας και την αναβάθμιση της συνολικής εμπειρίας του πολίτη, στην εξοικονόμηση πολύτιμων πόρων για την ελληνική πολιτεία στους τομείς της Δημόσιας Διοίκησης, της Εκπαίδευσης, της Έρευνας, της Υγείας και του Πολιτισμού. Κάθετοι τομείς εξειδίκευσης ΕΔΥΤΕ Σύγχρονες Ψηφιακές Τεχνολογίες για τη Δημόσια Διοίκηση, την Εκπαίδευση, την Έρευνα, την Υγεία και τον Πολιτισμό Ψηφιακός Μετασχηματισμός της Δημόσιας Διοίκησης Η ΕΔΥΤΕ έχοντας θεσμικό ρόλο στον σχεδιασμό προηγμένων πληροφοριακών συστημάτων και υποδομών, αποτελεί σύμβουλο στην υλοποίηση των στόχων του Υπουργείου Ψηφιακής Διακυβέρνησης. Υιοθετεί, εξειδικεύει και υποστηρίζει την υλοποίηση των στόχων της Βίβλου Ψηφιακού Μετασχηματισμού για τον Δημόσιο Τομέα. Με την εμπειρία και την τεχνογνωσία που διαθέτει η ΕΔΥΤΕ, διεξάγει εμπεριστατωμένες αναλύσεις, μελέτες και παρέχει πρότυπες λύσεις για την επίτευξη της διαλειτουργικότητας των πληροφοριακών συστημάτων της Δημόσιας Διοίκησης, για τη βελτίωση των υφιστάμενων και τη δημιουργία νέων ψηφιακών υπηρεσιών προς όφελος των πολιτών. Παράλληλα, επενδύει στη συνεργασία με ομάδες από στελέχη με διαφορετική επιστημονική και επαγγελματική εξειδίκευση και εμπειρία, δραστηριοποιείται για την παραγωγή και εφαρμογή ευέλικτων μεθοδολογικών εργαλείων ανάλυσης, διοργανώνει εργαστήρια και hackathons, αναπτύσσει προδιαγραφές και υλοποιεί μεσοπρόθεσμες και βραχυπρόθεσμες δράσεις του Υπουργείου Ψηφιακής Διακυβέρνησης. Συμμετέχει ενεργά στη διαμόρφωση της Ενιαίας Ψηφιακής Πύλης, το gov.gr, ένα κεντρικό σημείο εισόδου και ψηφιακής εξυπηρέτησης πολιτών και επιχειρήσεων, όπου είναι συγκεντρωμένες όλες οι ψηφιακές λύσεις και όλα όσα πρέπει να γνωρίζουν όλοι οι (ψηφιακά) συναλλασσόμενοι με το Δημόσιο. Στο πλαίσιο του Ψηφιακού Μετασχηματισμού της χώρας, δημιουργήθηκε και η Εθνική Ακαδημία Ψηφιακών Ικανοτήτων, μια διαδικτυακή πύλη που έχει ως στόχο την πρόσβαση σε γνώση απαραίτητη για την ανάπτυξη των ψηφιακών δεξιοτήτων των πολιτών, τόσο σε προσωπικό όσο και σε επαγγελματικό επίπεδο. Η Πύλη συγκεντρώνει εκπαιδευτικά μαθήματα από αναγνωρισμένους εκπαιδευτικούς παρόχους σε ένα ευρύ φάσμα θεματικών και το οποίο προσφέρεται δωρεάν. Τις δράσεις ανάπτυξης και εμπλουτισμού του περιεχομένου της Πύλης διαχειρίζεται και συντονίζει η ΕΔΥΤΕ έχοντας αναλάβει επίσης το ρόλο της διάχυσης του εκπαιδευτικού της περιεχομένου προς αξιοποίηση από όλους τους πολίτες. Η ΕΔΥΤΕ, με τη δική της συνολική συμβολή και ενεργό ρόλο, παράγει υπεραξία που συντελεί στην ενδυνάμωση του ρόλου του Δημόσιου Τομέα στοχεύοντας στην καλύτερη εξυπηρέτηση των πολιτών και των επιχειρήσεων. Ψηφιακή καινοτομία στην Εκπαίδευση Η ΕΔΥΤΕ εισάγει νέες, εξελιγμένες μεθόδους στην εκπαιδευτική διαδικασία που αναβαθμίζουν την εμπειρία των φοιτητών, των μελών ΔΕΠ και του διοικητικού προσωπικού όλων των Πανεπιστημίων, ΑΕΑ και άλλων σχολών. Με τις ηλεκτρονικές υπηρεσίες που διαρκώς αναπτύσσει, προσφέρει σύγχρονες λύσεις σε τομείς όπως η εκπαίδευση, η πρακτική άσκηση, η φοιτητική μέριμνα, καθώς και εν γένει στην οργάνωση και υποστήριξη των εσωτερικών διαδικασιών των εκπαιδευτικών φορέων με τους οποίους συνεργάζεται. Παρέχει απρόσκοπτα ένα πλήθος σημαντικών υπολογιστικών και δικτυακών υπηρεσιών. Ενδεικτικά, κάποιες από τις υπηρεσίες που αναπτύχθηκαν και παρέχονται στην ακαδημαϊκή και ερευνητική κοινότητα αφορούν, τη διάθεση των ακαδημαϊκών συγγραμμάτων (ΕΥΔΟΞΟΣ), την εκλογή και εξέλιξη των καθηγητών των Πανεπιστημίων και ΑΕΑ της χώρας (ΑΠΕΛΛΑ), την υποστήριξη ενιαίας ακαδημαϊκής ταυτότητας σε μορφή πλαστικής ή έξυπνης κάρτας (ΑΚΑΔΗΜΑΪΚΗ ΤΑΥΤΟΤΗΤΑ), την υποστήριξη Πρακτικής Άσκησης Φοιτητών (ΑΤΛΑΣ), τη χορήγηση του στεγαστικού επιδόματος, τη δημιουργία δικτύου περιαγωγής ασύρματης πρόσβασης στο διαδίκτυο (eduroam), και τη διεξαγωγή εκλογικής διαδικασίας με ηλεκτρονική ψήφο για Πρυτανικές εκλογές, μονομελών οργάνων και Διευθυντών Κλινικών, Εργαστηρίων και Μουσείων μέσω της Ψηφιακής Κάλπης (ΖΕΥΣ), την υλοποίηση και λειτουργία συστήματος για άμεση, ζωντανή και διαδραστική πρόσβαση σε οπτικοακουστικό υλικό υψηλής πολιτιστικής και επιστημονικής αξίας (ΔΙΑΥΛΟΣ) και σύστημα για διαδικτυακές τηλεδιασκέψεις υψηλής ποιότητας και διαδραστικότητας (e:Presence). Παρέχει υποστήριξη σε κάθε επίπεδο: σε Κέντρα Διαχείρισης Δικτύου (NOC) και σε τελικούς χρήστες για την άμεση επίλυση θεμάτων και την καλύτερη εξυπηρέτηση όλων των χρηστών (https://grnet.gr/contact-us/support). Οι υποδομές και υπηρεσίες ΕΔΥΤΕ στον τομέα της Εκπαίδευσης: https://grnet.gr/education/ Τεχνολογίες αιχμής για την Έρευνα Η ΕΔΥΤΕ προσφέρει ένα ολοκληρωμένο τεχνολογικό περιβάλλον για την ανάπτυξη επιστημονικής έρευνας. Σε αυτό ενσωματώνονται και συνδυάζονται προηγμένες δικτυακές και υπολογιστικές υποδομές και υπηρεσίες που εξασφαλίζουν στους ερευνητές καινοτόμες τεχνικές και νέες δυνατότητες για την έρευνα που διεξάγουν. Η ασφαλής δικτύωση σε υπερ-υψηλές ταχύτητες, η διάθεση υπολογιστικών και αποθηκευτικών πόρων και υποδομών cloud computing, IaaS public cloud, πλατφόρμα διάθεσης εικονικών μηχανών (~okeanos) και πλατφόρμα υπολογιστικού συστήματος υψηλών επιδόσεων για την υποστήριξη πολύ απαιτητικών επιστημονικών εφαρμογών, high-performance computing (HPC-ARIS), υπηρεσίες διαχείρισης μεγάλων δεδομένων (big data), είναι ενδεικτικά, μερικές από τις υπηρεσίες που αναπτύχθηκαν και παρέχονται από την ΕΔΥΤΕ στον τομέα της έρευνας σε πολλαπλά επιστημονικά πεδία. Οι υποδομές και υπηρεσίες ΕΔΥΤΕ στον τομέα της Έρευνας: https://grnet.gr/research/ Νέες ψηφιακές δυνατότητες για την Υγεία Η ΕΔΥΤΕ παρέχει πρωτοποριακές για τα ελληνικά δεδομένα ψηφιακές υπηρεσίες και υποδομές σε νοσοκομειακές μονάδες, κέντρα αίματος και σε υπηρεσίες αιμοδοσίας. Συνδέει τα δημόσια νοσοκομεία στο διαδίκτυο σε υψηλές ταχύτητες (1 Gbps-10 Gbps), προσφέροντας σε αυτά ταχύτητα στην αποθήκευση, στην πρόσβαση και στην ανταλλαγή δεδομένων, και απευθείας υπερταχεία δικτυακή σύνδεση με τα πλέον πρωτοπόρα ερευνητικά κέντρα του κόσμου. Οι υποδομές και υπηρεσίες της ΕΔΥΤΕ στον συγκεκριμένο τομέα ενδεικτικά περιλαμβάνουν: δημιουργία νέου προηγμένου κέντρου δεδομένων για την Υγεία στο Πανεπιστήμιο Κρήτης, για την αποθήκευση και ανάκτηση ιατρικών απεικονιστικών δεδομένων με ταχύτητα και ασφάλεια, ανάπτυξη υπηρεσίας ασύρματης πρόσβασης wi-fi και δίκτυο περιαγωγής (roaming) (eduroam), υπηρεσία καταλόγου χρηστών νοσοκομείου για την ασφαλή πρόσβαση σε υπηρεσίες (ΑΑΙ-ΔΗΛΟΣ, DirectoryService), κεντρικές ηλεκτρονικές υπηρεσίες διαχείρισης εθνικού μητρώου εθελοντών αιμοδοτών και έκδοση ταυτότητας αιμοδοτών (ΕΜΑ) μέσα από σύγχρονες, αξιόπιστες και φιλικές διαδικασίες για τους αιμοδότες, τις υπηρεσίες αιμοδοσίας και τα κέντρα αίματος της χώρας, ανάπτυξη και διάθεση υπηρεσίας δια-δανεισμού ιατρικών άρθρων (ΔΙΑΔΟΣΙΣ), υπηρεσία εφεδρικής αποθήκευσης και απομακρυσμένης πρόσβασης απεικονιστικών δεδομένων (Harmoni). Οι παραπάνω δράσεις ΕΔΥΤΕ ενδυναμώνουν το επιστημονικό προσωπικό των νοσοκομείων για τη διεξαγωγή του ερευνητικού και ιατρικού τους έργου. Παράλληλα βελτιώνεται σημαντικά η συνολική εμπειρία του πολίτη και εξοικονομούνται πολύτιμοι πόροι για την ελληνική Πολιτεία. Οι υποδομές και υπηρεσίες ΕΔΥΤΕ στον τομέα της Υγείας: https://grnet.gr/health/ Πρόσβαση στον Πολιτισμό με σύγχρονες τεχνολογίες Η ΕΔΥΤΕ συνεργάζεται με σημαντικούς πολιτιστικούς και ερευνητικούς φορείς και μεταδίδει ζωντανά από το Διαδίκτυο μέσω της υπηρεσίας ΔΙΑΥΛΟΣ διαλέξεις, σεμινάρια, καλλιτεχνικά γεγονότα και άλλες εκδηλώσεις. Έτσι συνεισφέρει στην ανάπτυξη και διάδοση σύγχρονου εκπαιδευτικού, ερευνητικού και πολιτιστικού περιεχομένου, ανεξαρτήτως γεωγραφικών αποστάσεων, δωρεάν, για χιλιάδες χρήστες. Επιπλέον η ΕΔΥΤΕ παρέχει σε επιλεγμένους ιστορικούς και πολιτιστικούς χώρους υποδομή ασύρματης πρόσβασης στο διεθνές δίκτυο περιαγωγής eduroam για τους επισκέπτες φοιτητές, ερευνητές και καθηγητές από Ακαδημαϊκά Ιδρύματα όλου του κόσμου. ‘Έτσι διευκολύνει την πληροφόρηση σχετικά με τους χώρους επίσκεψης, με σύγχρονες φορητές συσκευές. Οι υποδομές και υπηρεσίες ΕΔΥΤΕ στον τομέα του Πολιτισμού: https://grnet.gr/culture/ Πράσινα Κέντρα Δεδομένων Ενεργειακά αποδοτικές υποδομές και πρακτικές για τη μείωση των εκπομπών αερίων του θερμοκηπίου Η ΕΔΥΤΕ υιοθετεί και εφαρμόζει «πράσινες» τεχνολογίες στη δικτυακή και υπολογιστική της υποδομή, με κύριο στόχο τη μείωση των ετήσιων εκπομπών αερίων του θερμοκηπίου. Για το σκοπό αυτό επιλέγει ενεργειακά αποδοτικό εξοπλισμό και αναπτύσσει εργαλεία παρακολούθησης της κατανάλωσης ενέργειας, σε πραγματικό χρόνο. Το «πράσινο» κέντρο δεδομένων της ΕΔΥΤΕ στον ποταμό Λούρο στην Ήπειρο επιτυγχάνει πρωτοφανή για τα ελληνικά δεδομένα ενεργειακή απόδοση, καθώς η λειτουργία του στηρίζεται αποκλειστικά σε ανανεώσιμες πηγές ενέργειας. Για το σύστημα κλιματισμού και την ψύξη των συστημάτων πληροφορικής χρησιμοποιείται νερό από το ποτάμι, λύση που υλοποιείται για πρώτη φορά στην Ελλάδα. Επιπλέον, η ΕΔΥΤΕ έχει εγκαταστήσει μεγάλο κέντρο δεδομένων που εξυπηρετεί τις ανάγκες των νοσοκομείων όλης της χώρας σε κτίριο που της παραχώρησε το Παν. Κρήτης στην Κνωσό Ηρακλείου. Προχώρησε σε παρεμβάσεις εξοικονόμησης ηλεκτρικής ενέργειας και παραγωγής ΑΠΕ, ενταγμένες σε μια ευρύτερη στρατηγική εξοικονόμησης ενέργειας και περιβαλλοντικής ευαισθητοποίησης της ακαδημαϊκής κοινότητας και του ευρύτερου δημόσιου τομέα. Εγκαταστάθηκε φωτοβολταϊκό σύστημα 100 ΚWp με ενεργειακό συμψηφισμό στο δίκτυο χαμηλής τάσης (net metering). Με το έργο «Αναβάθμιση του ενεργειακού αποτυπώματος Πανεπιστημίου Κρήτης και Εθνικού Κέντρου Δεδομένων Υγείας» το Πανεπιστήμιο Κρήτης σε συνεργασία με την ΕΔΥΤΕ προχωράει σ"
