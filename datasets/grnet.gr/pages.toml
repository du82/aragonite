["https://grnet.gr/2025/02/25/%ce%b4%ce%b9%ce%b1%ce%ba%ce%ae%cf%81%cf%85%ce%be%ce%b7-%ce%b1%ce%bd%ce%bf%ce%b9%cf%87%cf%84%ce%bf%cf%8d-%ce%b4%ce%b9%ce%b1%ce%b3%cf%89%ce%bd%ce%b9%cf%83%ce%bc%ce%bf%cf%8d-%ce%ba%ce%ac%cf%84%cf%89"]
title = "Διακήρυξη ανοιχτού διαγωνισμού κάτω των ορίων για τη «Δημοσιότητα του έργου» του έργου: SUB2. Ψηφιακή εκπαίδευση και ενδυνάμωση των ηλικιωμένων και των ατόμων με αναπηρία». - GRNET Website"
description = "Αντικείμενο του διαγωνισμού αποτελεί ειδικότερα η υλοποίηση υπηρεσιών ευαισθητοποίησης του ευρύτερου κοινού, καθώς και στοχευμένων ομάδων για την ισότιμη πρόσβαση των Ατόμων με Αναπηρία και των Ηλικιωμένων στα προγράμματα εκπαίδευσης και ψηφιακής ενδυνάμωσης του έργου. Συγκεκριμένα περιλαμβάνει: Επικοινωνιακή Στρατηγική και Σχέδιο Δράσεων Επικοινωνίας. Σχεδιασμός και παραγωγή έντυπου, ηλεκτρονικού, οπτικοακουστικού και λοιπού προωθητικού και ενημερωτικού υλικού."
full_description = "BY admin IN Διαγωνισμοί 25 Φεβρουαρίου, 2025 No comment 0  Αντικείμενο του διαγωνισμού αποτελεί ειδικότερα η υλοποίηση υπηρεσιών ευαισθητοποίησης του ευρύτερου κοινού, καθώς και στοχευμένων ομάδων για την ισότιμη πρόσβαση των Ατόμων με Αναπηρία και των Ηλικιωμένων στα προγράμματα εκπαίδευσης και ψηφιακής ενδυνάμωσης του έργου. Συγκεκριμένα περιλαμβάνει: Επικοινωνιακή Στρατηγική και Σχέδιο Δράσεων Επικοινωνίας. Σχεδιασμός και παραγωγή έντυπου, ηλεκτρονικού, οπτικοακουστικού και λοιπού προωθητικού και ενημερωτικού υλικού. Ενέργειες προβολής και δημοσιότητας σε ΜΜΕ, σε δημόσιους χώρους, στα μέσα κοινωνικής δικτύωσης και στο διαδίκτυο. Διοργάνωση εκδηλώσεων. Στο πλαίσιο σχεδιασμού και υλοποίησης του έργου δημοσιότητας θα διασφαλιστεί ότι όλες οι δράσεις δημοσιότητας και ενημέρωσης θα είναι προσβάσιμες στα άτομα με αναπηρία. Η διάρκεια της Σύμβασης ορίζεται σε οκτώ (8) μήνες από την υπογραφή της, και σε κάθε περίπτωση προ της 31ης/12/2025. Η εκτιμώμενη αξία της Σύμβασης ανέρχεται στο συνολικό ποσό των 223.200,00€, συμπεριλαμβανομένου Φ.Π.Α.[ποσό χωρίς Φ.Π.Α. 180.000,00 € + ΦΠΑ (24%) 43.200,00 €]. Φορέας χρηματοδότησης της παρούσας Διακήρυξης είναι το Υπουργείο Κοινωνικής Συνοχής και Οικογένειας, Κωδ. ΣΑΤΑ ΤΑ093. Η δαπάνη για την εν λόγω Σύμβαση που χρηματοδοτείται από το Υπουργείο Κοινωνικής Συνοχής και Οικογένειας βαρύνει τον προϋπολογισμό 2025 του φορέα με σχετική πίστωση. Η Σύμβαση υλοποιείται στο πλαίσιο του Εθνικού Σχεδίου Ανάκαμψης και Ανθεκτικότητας «Ελλάδα 2.0» με τη χρηματοδότηση της Ευρωπαϊκής Ένωσης – NextGeneration EU και περιλαμβάνεται στο υποέργο 5 «Προμήθεια Ηλεκτρονικού Εξοπλισμού Κόμβων Ψηφιακής Ενδυνάμωσης» του έργου «SUB2. Ψηφιακή εκπαίδευση και ενδυνάμωση των ηλικιωμένων και των ατόμων με αναπηρία», το οποίο έχει ενταχθεί στο Ταμείο Ανάκαμψης και Ανθεκτικότητας, στη Δράση με ID «16922 – Κοινωνική ενσωμάτωση ευάλωτων ομάδων», με βάση την απόφαση ένταξης με αρ. πρωτ. 142567 ΕΞ 2024/03-10-2024 και ΑΔΑ: 9ΚΜΕΗ-ΞΟΞ απόφαση ένταξης και έχει λάβει κωδικό ΟΠΣ ΤΑ 5223341. Η παρούσα σύμβαση χρηματοδοτείται από Πιστώσεις του Ταμείου Ανάκαμψης και Ανθεκτικότητας και του Προγράμματος Δημοσίων Επενδύσεων (ΣΑΤΑ ΤΑ093, αριθ. ενάριθ. έργου 2024ΤΑ09300020). Η Σύμβαση θα ανατεθεί με το κριτήριο της πλέον συμφέρουσα από οικονομική άποψη προσφορά βάσει της βέλτιστης σχέσης ποιότητας – τιμής. Οι προσφορές υποβάλλονται από τους ενδιαφερόμενους ηλεκτρονικά, μέσω της διαδικτυακής πύλης www.promitheus.gov.gr του ΕΣΗΔΗΣ. Η καταληκτική ημερομηνία παραλαβής των προσφορών είναι η Δευτέρα, 17/03/2025 και ώρα 12:00. Το τεύχος Διακήρυξης του διαγωνισμού είναι διαθέσιμο εδώ. Share: "
