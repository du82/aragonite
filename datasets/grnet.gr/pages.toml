title = "Διακήρυξη Ανοικτού Διεθνούς Ηλεκτρονικού Διαγωνισμού άνω των ορίων για τη σύναψη Σύμβασης με αντικείμενο την «Προμήθεια Ηλεκτρονικού Εξοπλισμού Κόμβων Ψηφιακής Ενδυνάμωσης» - GRNET Website"
description = "Αντικείμενο του Διαγωνισμού είναι η «Προμήθεια Ηλεκτρονικού Εξοπλισμού Κόμβων Ψηφιακής Ενδυνάμωσης» με στόχο τη δημιουργία της απαραίτητης πληροφοριακής υποδομής σε 120 Κόμβους Ψηφιακής Ενδυνάμωσης Ηλικιωμένων και 80 Κόμβους Ψηφιακής Ενδυνάμωσης Ατόμων με Αναπηρία για την υλοποίηση των προγραμμάτων ψηφιακής εκπαίδευσης και ενδυνάμωσης των ηλικιωμένων και ατόμων με αναπηρία αντίστοιχα. Η πληροφοριακή υποδομή περιλαμβάνει τις ακόλουθες"
full_description = "BY admin IN Διαγωνισμοί 13 Φεβρουαρίου, 2025 No comment 0  Αντικείμενο του Διαγωνισμού είναι η «Προμήθεια Ηλεκτρονικού Εξοπλισμού Κόμβων Ψηφιακής Ενδυνάμωσης» με στόχο τη δημιουργία της απαραίτητης πληροφοριακής υποδομής σε 120 Κόμβους Ψηφιακής Ενδυνάμωσης Ηλικιωμένων και 80 Κόμβους Ψηφιακής Ενδυνάμωσης Ατόμων με Αναπηρία για την υλοποίηση των προγραμμάτων ψηφιακής εκπαίδευσης και ενδυνάμωσης των ηλικιωμένων και ατόμων με αναπηρία αντίστοιχα. Η πληροφοριακή υποδομή περιλαμβάνει τις ακόλουθες προμήθειες – υπηρεσίες: Προμήθεια και τοποθέτηση πληροφοριακής υποδομής σε 120 Κόμβους Ψηφιακής Ενδυνάμωσης Ηλικιωμένων και 80 Κόμβους Ψηφιακής Ενδυνάμωσης Ατόμων με Αναπηρία Ο ηλεκτρονικός εξοπλισμός για κάθε Κόμβο Ψηφιακής Ενδυνάμωσης Ηλικιωμένων περιλαμβάνει: 1 Φορητό Υπολογιστή με λειτουργικό Windows 11 με ασύρματο usb optical ποντίκι 1 Βιντεοπροβολέα 1 Οθόνη Προβολής 1 Έγχρωμο Πολυμηχάνημα τεχνολογίας Inkjet 15 Tablet με λειτουργικό Android Λογισμικά Ανοικτού Κώδικα για εφαρμογές γραφείου για το Φορητό Υπολογιστή και τα Tablet Ο ηλεκτρονικός εξοπλισμός για κάθε Κόμβο Ψηφιακής Ενδυνάμωσης Ατόμων με Αναπηρία περιλαμβάνει: 3 Φορητούς Υπολογιστές με λειτουργικό Windows 11 με ασύρματο usb optical ποντίκι 1 Βιντεοπροβολέα 1 Οθόνη Προβολής 1 Έγχρωμο Πολυμηχάνημα τεχνολογίας Inkjet 13 Tablet με λειτουργικό Android Λογισμικά Ανοικτού Κώδικα για εφαρμογές γραφείου για τους Φορητούς Υπολογιστές και τα Tablet Λογισμικά για άτομα με οπτική αναπηρία για τους Φορητούς Υπολογιστές και τα Tablet Η διάρκεια της Σύμβασης ορίζεται σε πέντε (5) μήνες από την υπογραφή της. Η διάρκεια της εγγύησης καλής λειτουργίας εξοπλισμού ορίζεται σε τουλάχιστον τρία (3) έτη από την επιτυχή ολοκλήρωση της ΦΑΣΗΣ–3: Παράδοση Έργου. Ο συνολικός προϋπολογισμός του έργου (συμπεριλαμβανομένου Φ.Π.Α.) ανέρχεται στο ποσό των 1.388.304,00€ [1.119.600,00€ + Φ.Π.Α. (24%): 268.704,00€]. Φορέας χρηματοδότησης της παρούσας Διακήρυξης είναι το Υπουργείο Κοινωνικής Συνοχής και Οικογένειας, ΣΑΤΑ093. Η δαπάνη για την εν λόγω Σύμβαση βαρύνει τον προϋπολογισμό 2025 του φορέα με σχετική πίστωση. Η Σύμβαση υλοποιείται στο πλαίσιο του Εθνικού Σχεδίου Ανάκαμψης και Ανθεκτικότητας «Ελλάδα 2.0» με τη χρηματοδότηση της Ευρωπαϊκής Ένωσης – NextGeneration EU και περιλαμβάνεται στο υποέργο 5 «Προμήθεια Ηλεκτρονικού Εξοπλισμού Κόμβων Ψηφιακής Ενδυνάμωσης» του έργου «SUB2. Ψηφιακή εκπαίδευση και ενδυνάμωση των ηλικιωμένων και των ατόμων με αναπηρία», το οποίο έχει ενταχθεί στο Ταμείο Ανάκαμψης και Ανθεκτικότητας, στη Δράση με ID «16922 – Κοινωνική ενσωμάτωση ευάλωτων ομάδων», με βάση την απόφαση ένταξης με αρ. πρωτ. 142567 ΕΞ 2024/03-10-2024 και ΑΔΑ: 9ΚΜΕΗ-ΞΟΞ απόφαση ένταξης και έχει λάβει κωδικό ΟΠΣ ΤΑ 5223341. Η παρούσα σύμβαση χρηματοδοτείται από Πιστώσεις του Ταμείου Ανάκαμψης και Ανθεκτικότητας και του Προγράμματος Δημοσίων Επενδύσεων (ΣΑΤΑ ΤΑ093, ενάριθ. έργου 2024ΤΑ09300020). Η Σύμβαση θα ανατεθεί με το κριτήριο της πλέον συμφέρουσα από οικονομική άποψη προσφορά, βάσει τιμής. Οι προσφορές υποβάλλονται από τους ενδιαφερόμενους ηλεκτρονικά, μέσω της διαδικτυακής πύληςwww.promitheus.gov.gr του ΕΣΗΔΗΣ. Η καταληκτική ημερομηνία παραλαβής των προσφορών είναι 18.03.2025 και ώρα 13:00. Το τεύχος Διακήρυξης του διαγωνισμού είναι διαθέσιμο εδώ. Share: "
