title = "DIVA – Boosting innovative DIgitech Value chains for Agrofood, forestry and environment - GRNET Website"
description = "Περιγραφή Το έργο “Boosting innovative DIgitech Value chains for Agrofood, forestry and environment” επικεντρώνεται στην προώθηση της καινοτομίας στον αγροδιατροφικό τομέα και στο περιβάλλον. To DIVA στοχεύει στην επίτευξη ευρείας χρήσης ψηφιακών τεχνολογιών στην αγροτική πρακτική. Εστιάζει σε ψηφιακές αγορές, μεγάλα δεδομένα (big data) και υπολογιστικά νέφη, ρομποτική και τεχνητή νοημοσύνη, IoT καθώς και σε ηλεκτρονικές όπως και διατάξεις φωτονικής. Ο ρόλος του ΕΔΕΤ στο έργο, επικεντρώνεται στη δημιουργία μητρώου επιδεικτικών εγκαταστάσεων που θα φιλοξενήσουν πιλοτικές εφαρμογές που θα επιλεγούν για χρηματοδότηση μέσω ανοιχτής πρόσκλησης."
