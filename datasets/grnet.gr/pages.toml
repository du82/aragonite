full_description = "BY admin IN Προσκλήσεις για συνεργάτες 5 Φεβρουαρίου, 2025 No comment 0  Η ΕΔΥΤΕ Α.Ε. στο πλαίσιο της εκτέλεσης του ως άνω έργου, προτίθεται να αναθέσει μετά από αξιολόγηση/συνέντευξη και βαθμολόγηση των υποψηφίων τις προαναφερόμενες στον ανώτερο πίνακα συμβάσεις μίσθωσης έργου ήτοι: Μια (1) σύμβαση μίσθωσης έργου με αντικείμενο τον Σχεδιασμό πολυμέσων για ψηφιακή ασύγχρονη εκπαίδευση, μέγιστης διάρκειας έως 31/10/2025. Τρεις (3) συμβάσεις μίσθωσης έργου με αντικείμενο την ανάπτυξη διαδραστικού περιεχομένου για E-Learning πλατφόρμα, μέγιστης διάρκειας έως 31/10/2025. Δυο (2) συμβάσεις μίσθωσης έργου με αντικείμενο την ανάπτυξη διαδραστικού περιεχομένου για E-Learning πλατφόρμα, μέγιστης διάρκειας έως 31/10/2025. όπως περιγράφεται αναλυτικότερα στη σχετική πρόσκληση εκδήλωσης ενδιαφέροντος, η οποία περιέχεται εδώ Οι αιτήσεις συμμετοχής στη διαγωνιστική διαδικασία και οι πλήρεις φάκελοι βιογραφικών στοιχείων υποβάλλονται στην ΕΔΥΤΕ Α.Ε. Λ. Κηφισίας 7, 115 23, Αθήνα, υπόψη Τμήματος Ανθρώπινου Δυναμικού, e-mail: hr@admin.grnet.gr τηλ. 210-7474490, το αργότερο μέχρι την 14η Φεβρουαρίου 2025 και ώρα 15:00. Οι υποψήφιοι μπορούν να υποβάλουν αίτηση μόνο για ένα από τα ως άνω αντικείμενα υπηρεσιών, με ποινή αποκλεισμού. Στην περίπτωση ταχυδρομικής αποστολής το εμπρόθεσμο κρίνεται με βάση την ημερομηνία παραλαβής του φακέλου που δεν μπορεί να είναι μετά την 14η Φεβρουαρίου 2025 και ώρα 15:00. Ηλεκτρονικές αιτήσεις δεν θα γίνονται αποδεκτές. Share: "
