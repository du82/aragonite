title = "Κανονισμός Χρήσης ΕΔΥΤΕ - GRNET Website"
description = "Περιορισμός ευθύνης – Ανωτέρα Βία Σε περίπτωση επελεύσεως γεγονότων «ανωτέρας βίας», στην έννοια της οποίας συμπεριλαμβάνονται και περιστατικά, τα οποία σαφώς και αποδεδειγμένα βρίσκονται υπεράνω του ελέγχου και της ευθύνης της ΕΔΥΤΕ ΑΕ, η τελευταία δεν φέρει καμία ευθύνη αποζημίωσης για την μη δυνατότητα παροχής προχωρημένων και υψηλής ποιότητας υπηρεσιών δικτύωσης και πρόσβασης στο Διαδίκτυο"
full_description = "Σκοπός και παρεχόμενες υπηρεσίες Το Εθνικό Δίκτυο Υποδομών Τεχνολογίας και Έρευνας – ΕΔΥΤΕ είναι το Δημόσιο Ελληνικό Ακαδημαϊκό και Ερευνητικό Δίκτυο. Σκοπός του ΕΔΥΤΕ είναι η παροχή στους φορείς δημόσιας πανεπιστημιακής εκπαίδευσης (Πανεπιστήμια και ΤΕΙ), στους Ερευνητικούς Οργανισμούς και σε λοιπούς φορείς (εφεξής θα αναφέρονται ως «φορείς του ΕΔΥΤΕ») προχωρημένων και υψηλής ποιότητας υπηρεσιών μεταξύ τους δικτύωσης και πρόσβασης στο Διαδίκτυο (Internet). Αποτελεί ένα μη εμπορικό δημόσιο εθνικό δίκτυο κορμού, με σημεία παρουσίας σε κύριες Ελληνικές πόλεις, όπου βρίσκονται εγκατεστημένοι οι φορείς του ΕΔΥΤΕ. Με τον όρο «μη εμπορικό» εννοείται πως η παροχή των υπηρεσιών του ΕΔΥΤΕ δεν γίνεται με γνώμονα την εμπορική δραστηριότητα και την ευρύτερη «Αγορά», αλλά με στόχο: την προώθηση της εκπαίδευσης, της έρευνας και της τεχνολογίας, τη χρήση των υπηρεσιών του ΕΔΥΤΕ από τους προαναφερόμενους φορείς για ερευνητικούς ή/και εκπαιδευτικούς σκοπούς Οι δραστηριότητες της ΕΔΥΤΕ Α.Ε. της επιτρέπουν να χρηματοδοτεί τα έξοδα ανάπτυξης, συντήρησης και λειτουργίας του δικτύου και υπηρεσιών καθώς και τη δημιουργία αποθεματικού για μελλοντικές αναβαθμίσεις των παρεχόμενων υπηρεσιών. Οι υπηρεσίες που προσφέρονται στους φορείς του ΕΔΥΤΕ περιλαμβάνουν μεταξύ άλλων: Πλήρη Διασύνδεση Ίντερνετ (ΙΡ v4 και ΙΡ v6): Υπηρεσίες διασύνδεσης και βελτιστοποίησης δικτύου κορμού και πρόσβασης (δρομολόγηση)με όλα τα Ελληνικά και διεθνή δίκτυα Ίντερνετ (IP) χωρίς κανένα περιορισμό και για όλες τις νόμιμες υπηρεσίες τωρινές ή μελλοντικές όπως αυτοί κρίνουν σωστό και βέλτιστο χωρίς το ΕΔΥΤΕ να γνωρίζει ή να φέρει οποιαδήποτε ευθύνη για το περιεχόμενο της μεταδιδόμενης πληροφορίας. Εγγυημένη ποιότητα υπηρεσίας – QoS σύμφωνα με τις απαιτήσεις των φορέων, τις δυνατότητες του δικτύου κορμού και των διασυνδεδεμένων φορέων, και τις παρεχόμενες υπηρεσίες από το Πανευρωπαϊκό Ερευνητικό Δίκτυο GÉANT Υπηρεσίες εφαρμογών (διαχείριση εξυπηρετητών, εφεδρεία ηλεκτρονικού ταχυδρομείου, ηλεκτρονικές ειδήσεις, αναμετάδοση τηλεοπτικών προγραμμάτων, υπηρεσία ονοματολογίας, κεντρική υπηρεσία συγχρονισμού-NTP) Υπηρεσίες πληροφοριακής υποστήριξης- υπηρεσίες καταλόγου,υπηρεσίες Κεντρικής Υποδομής Πιστοποίησης, Υπηρεσίες Κεντρικής Υποδομής Ταυτοποίησης Χρηστών (AAI), καθώς και υπηρεσίες συνεργατικών εργαλείων web για την διαχείριση τους. Υπηρεσίες πληροφόρησης / υποστήριξης χρηστών (helpdesk), παροχή αρωγής σε μικρούς φορείς, σύστημα εξυπηρέτησης αιτημάτων (ticketing), υπηρεσίες αντιμετώπισης συμβάντων που θέτουν σε κίνδυνο την ασφάλεια των υπολογιστών (CERT ή CSIRT). Yπηρεσία Φοιτητικού DSL (ΦDSL) Υπηρεσία Multicast Υπηρεσία μετάδοσης φωνής, διεπιλογική τηλεφωνία μέσω δικτύου (σε συνεργασία με το GUnet), τηλε-διάσκεψης με χρήση MCU, τηλεδιάσκεψης με εικόνα και ήχο υψηλής ανάλυσης, και μετάδοσης ροών δεδομένων (RTS) κάθε μορφής Υπηρεσίες εγγυημένης χωρητικότητας (Bandwidth-On-Demand), υπηρεσία μεταγόμενων κυκλωμάτων μέσω DWDM ή SDH για φορείς που συνδέονται στο DWDM του ΕΔΥΤΕ-3 από και προς άλλους φορείς του ΕΔΥΤΕ καθώς από και προς όμορα δίκτυα όπως το GÉANT και το Internet2. Στο πλαίσιο των σκοπών της η ΕΔΥΤΕ δέχεται να λειτουργεί και ως πλατφόρμα εφαρμογής νέων ή πειραματικών τεχνολογιών, με τον όρο βέβαια να μην επηρεάζεται η παροχή των βασικών υπηρεσιών «παραγωγής» του Συνδεόμενα δίκτυα Α. Στο ΕΔΥΤΕ συνδέονται τα δίκτυα που ανήκουν στους φορείς του ΕΔΥΤΕ: απευθείας όλα τα εσωτερικά δίκτυα των φορέων της δημόσιας πανεπιστημιακής εκπαίδευσης (Πανεπιστήμια και ΤΕΙ) όλα τα σχολεία της πρωτοβάθμιας και δευτεροβάθμιας εκπαίδευσης μέσω του Πανελλήνιου Σχολικού Δικτύου πρόσβασης. όλα τα Ερευνητικά Ιδρύματα, καθώς και Οργανισμοί και Κέντρα του ευρύτερου Δημόσιου Τομέα, εποπτευόμενα ή μη εποπτευόμενα από τη ΓΓΕΤ η Γενική Γραμματεία Έρευνας και Τεχνολογίας ορισμένα Υπουργεία και Δημόσιοι Οργανισμοί άμεσα σχετιζόμενοι με τα παραπάνω, όπως για παράδειγμα τα Υπουργεία Παιδείας, Εθνικής Οικονομίας και Ανάπτυξης, και η Βουλή των Ελλήνων. Β. Το ΕΔΥΤΕ διατηρεί το δικαίωμα να παρέχει/δέχεται περιορισμένες υπηρεσίες και σε/από άλλα δίκτυα, με τον όρο η παροχή των υπηρεσιών αυτών να μην παραβιάζει τον μη εμπορικό χαρακτήρα του και να αποβαίνει σε άμεσο όφελος των συνδεδεμένων δικτύων. Υπό την έννοια αυτή: παρέχει στην ευρύτερη ελληνική δικτυακή κοινότητα υπηρεσία διασύνδεσης δικτύων Internet, εγκαθιστώντας και συντηρώντας Κόμβους Διασύνδεσης Δικτύων Internet. παρέχει περιορισμένη διασύνδεση προς τμήματα Έρευνας και Ανάπτυξης ή τμήματα εκπαίδευσης άλλων φορέων δέχεται περιορισμένη διασύνδεση με σκοπό την προσφορά προς την ελληνική ακαδημαϊκή-ερευνητική κοινότητα περιεχομένου και υπηρεσιών σχετικού με τις ανάγκες της. Αυτό μπορεί να γίνει με οποιοδήποτε τρόπο κριθεί προσφορότερο είτε μέσω κόμβου Διασύνδεσης είτε μέσω φορέα του ΕΔΥΤΕ. Σε περίπτωση διαπίστωσης παραβίασης κάποιων από τους παραπάνω θεμελιώδεις κανόνες, το ΕΔΥΤΕ έχει δικαίωμα, μετά από κατάλληλη επίσημη προειδοποίηση, να αναστείλει τη σύνδεση του παραβαίνοντος δικτύου μέχρι αυτό να συμμορφωθεί. Κανόνες χρήσης ΕΔΥΤΕ 1. Για τη σύνδεσή του, κάθε φορέας του ΕΔΥΤΕ αποδέχεται την εγκατάσταση ενός μεταγωγέα πρόσβασης στον κεντρικό του κόμβο, στον οποίο θα καταλήγει η οπτική ίνα πρόσβασης (ή άλλη σύνδεση) προερχόμενη από τον πλησιέστερο κόμβο του δικτύου του ΕΔΥΤΕ. Την ευθύνη διαχείρισης του μεταγωγέα πρόσβασης την έχει το κατανεμημένο κέντρο διαχείρισης δικτύου του ΕΔΥΤΕ σε συνεργασία με το κέντρο ή τον υπεύθυνο διαχείρισης του φορέα. 2. Οι χρήστες των υπηρεσιών του ΕΔΥΤΕ οφείλουν να τηρούν τους γραπτούς και άγραφους – εθιμικούς κανόνες που διέπουν τη χρήση του Διαδικτύου (πχ. «netiquette») και γενικότερα των δικτύων τηλεφωνίας και υπολογιστών. Έτσι, διαμέσου του ΕΔΥΤΕ δεν επιτρέπεται μεταξύ άλλων: Η προσπάθεια παραβίασης (επιτυχής ή όχι) της ασφάλειας (security) υπολογιστικών συστημάτων του ΕΔΥΤΕ, των συνδεόμενων φορέων – δικτύων του και τρίτων δικτύων, είτε αυτή η προσπάθεια συνδέεται είτε δεν συνδέεται με απώλεια δεδομένων. Η προσπάθεια παραβίασης (επιτυχής ή όχι) του προσωπικού απόρρητου χρηστών διαμέσου του ΕΔΥΤΕ Η επίθεση (επιτυχής ή όχι) με σκοπό την άρνηση παροχής υπηρεσίας (denial-of-service attacks) του ΕΔΥΤΕ, των συνδεόμενων φορέων – δικτύων του και τρίτων δικτύων Η υπερφόρτωση και η μη λελογισμένη χρήση των υπολογιστικών και δικτυακών πόρων του ΕΔΥΤΕ ή άλλων δικτύων H αποστολή μαζικού ηλεκτρονικού ταχυδρομείου χωρίς κάτι τέτοιο να ζητηθεί από τους παραλήπτες (E-Mail spam) Η χρήση των δικτυακών πόρων και των υπολογιστικών συστημάτων που οδηγεί σε κίνδυνο για την εθνική ασφάλεια και τις σχέσεις της χώρας με τρίτες χώρες. Η χρήση των δικτυακών πόρων και των υπολογιστικών συστημάτων για παράνομες δραστηριότητες. Η χρήση των δικτυακών πόρων για παραβίαση (με παραγωγή, δημοσίευση ή διακίνηση υλικού) των πνευματικών δικαιωμάτων (copyrights) των δικαιούχων. 3. Η ακαδημαϊκή – ερευνητική, μη εμπορική φύση του ΕΔΥΤΕ σημαίνει ότι επιτρέπεται η παροχή δωρεάν υπηρεσιών προς όφελος κυρίως της Ελληνικής Ακαδημαϊκής – Ερευνητικής κοινότητας και ως αποτέλεσμα όλου του Διαδικτύου. Ταυτόχρονα σημαίνει ότι: δεν επιτρέπεται να διακινείται πάνω από το ΕΔΥΤΕ πληροφορία της οποίας τόσο ο αποστολέας όσο και ο παραλήπτης είναι εμπορικοί φορείς ή δίκτυα που δεν ανήκουν στα προαναφερόμενα ή στα αντίστοιχά τους στο εξωτερικό. δεν επιτρέπεται η άσκηση εμπορικών δραστηριοτήτων μέσω του ΕΔΥΤΕ. Στις δραστηριότητες αυτές περιλαμβάνεται η πώληση αγαθών ή υπηρεσιών, η υπεκμίσθωση χωρητικότητας και η διαφήμιση, από τα συνδεδεμένα δίκτυα ή από τρίτους. Εξαιρείται η αγορά αγαθών μέσω του Διαδικτύου από χρήστες των συνδεδεμένων στο ΕΔΥΤΕ δικτύων. δεν επιτρέπεται η χρήση του ΕΔΥΤΕ για άλλους σκοπούς πέρα των ερευνητικών και εκπαιδευτικών όπως προαναφέρθηκαν. Σε περίπτωση μη συμμόρφωσης με τα ανωτέρω το ΕΔΥΤΕ έχει δικαίωμα, μετά από κατάλληλη επίσημη προειδοποίηση, να αναστείλει τη σύνδεση του παραβαίνοντος φορέα του ΕΔΥΤΕ έως ότου συμμορφωθεί. Οι συνδεόμενοι φορείς του ΕΔΥΤΕ οφείλουν να θεσπίσουν δικές τους εσωτερικές επιτρεπτές πολιτικές χρήσης συμβατές με αυτήν του ΕΔΥΤΕ. Περιορισμός ευθύνης – Ανωτέρα Βία Σε περίπτωση επελεύσεως γεγονότων «ανωτέρας βίας», στην έννοια της οποίας συμπεριλαμβάνονται και περιστατικά, τα οποία σαφώς και αποδεδειγμένα βρίσκονται υπεράνω του ελέγχου και της ευθύνης της ΕΔΥΤΕ ΑΕ, η τελευταία δεν φέρει καμία ευθύνη αποζημίωσης για την μη δυνατότητα παροχής προχωρημένων και υψηλής ποιότητας υπηρεσιών δικτύωσης και πρόσβασης στο Διαδίκτυο (Internet) στους φορείς του ΕΔΥΤΕ. Η μη εκπλήρωση των υποχρεώσεων παροχής των εν λόγω υπηρεσιών κατά τη διάρκεια της ως άνω αναστολής , δεν δημιουργεί δικαίωμα ή αξίωση υπέρ ή κατά των ως άνω φορέων ούτε των επιμέρους χρηστών του ΕΔΥΤΕ. Όλοι ανεξαιρέτως οι όροι του παρόντος Κανονισμού χρήσης ΕΔΥΤΕ και οι εξ αυτών/ σχέσεις υπόκεινται στην κείμενη νομοθεσία του κράτους αρμόδια δε Δικαστήρια για την επίλυση των τυχόν διαφόρων είναι αυτά της πόλης των Αθηνών. Share: "
