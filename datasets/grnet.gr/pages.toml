title = "Συγχρηματοδοτούμενα έργα ΕΣΠΑ 2014-2020 - GRNET Website"
description = "Τα cookies αυτής της κατηγορίας είναι απαραίτητα για την ορθή και αποτελεσματική λειτουργία της ιστοσελίδας"
full_description = "Το Εθνικό Δίκτυο Υποδομών Τεχνολογίας και Έρευνας (ΕΔΥΤΕ Α.Ε. – GRNET), φορέας του Υπουργείου Ψηφιακής Διακυβέρνησης, υλοποιεί τα παρακάτω έργα και πράξεις με συγχρηματοδότησή από Ευρωπαϊκά Διαρθρωτικά και Επενδυτικά Ταμεία (ΕΔΕΤ) και Εθνικούς Πόρους: ΔΙΚΤΥΝΝΑ – Αναβάθμιση του Ενεργειακού Αποτυπώματος Πανεπιστημίου Κρήτης και Εθνικού Κέντρου Δεδομένων Υγείας ΕΔΥΤΕ Α.Ε. ΧΡΗΜΑΤΟΔΟΤΗΣΗ: ΕΣΠΑ 2014-2020 ΗΦΑΙΣΤΟΣ – Εκσυγχρονισμός των δικτυακών υποδομών του συνόλου των φορέων της ακαδημαϊκής και ερευνητικής κοινότητας της χώρας ΧΡΗΜΑΤΟΔΟΤΗΣΗ: Μεταρρύθμιση Δημόσιου Τομέα / ΕΣΠΑ 2014-2020 Μαχάων – Παροχή προηγμένων δικτυακών-υπολογιστικών υπηρεσιών σε Νοσοκομειακές Μονάδες σε περιβάλλον υπολογιστικού νέφους ΧΡΗΜΑΤΟΔΟΤΗΣΗ: Μεταρρύθμιση Δημόσιου Τομέα / ΕΣΠΑ 2014-2020 Εθνικό Μητρώο Αιμοδοτών – Εθνικό πληροφοριακό σύστημα διαχείρισης του Μητρώου Εθελοντών Αιμοδοτών ΧΡΗΜΑΤΟΔΟΤΗΣΗ: Ε.Π. Μεταρρύθμιση Δημόσιου Τομέα / ΕΠΑνΕΚ ΕΥΔΟΞΟΣ – Επέκταση των ηλεκτρονικών υπηρεσιών για τη διαχείριση της διανομής των συγγραμμάτων ΧΡΗΜΑΤΟΔΟΤΗΣΗ: Ε.Π. Μεταρρύθμιση Δημόσιου Τομέα – ΕΣΠΑ 2014-2020 ΑΠΕΛΛΑ – Επέκταση της ηλεκτρονικής υπηρεσίας για την ολοκληρωμένη διαχείριση νέων θέσεων διδακτικού προσωπικού των Α.Ε.Ι. με την ενσωμάτωση του προσωπικού των Ερευνητικών Κέντρων ΧΡΗΜΑΤΟΔΟΤΗΣΗ: Ε.Π. Μεταρρύθμιση Δημόσιου Τομέα – ΕΣΠΑ 2014-2020 ΑΤΛΑΣ – Επέκταση των κεντρικών ηλεκτρονικών υπηρεσιών της πρακτικής άσκησης των φοιτητών της τριτοβάθμιας εκπαίδευσης ΧΡΗΜΑΤΟΔΟΤΗΣΗ: Ε.Π. Μεταρρύθμιση Δημόσιου Τομέα – ΕΣΠΑ 2014-2020 Ακαδημαϊκή Ταυτότητα – Επέκταση της ηλεκτρονικής υπηρεσίας απόκτησης ακαδημαϊκής ταυτότητας ΧΡΗΜΑΤΟΔΟΤΗΣΗ: Ε.Π. Μεταρρύθμιση Δημόσιου Τομέα – ΕΣΠΑ 2014-2020 Φοιτητικό Στεγαστικό επίδομα – Επέκταση της ολοκληρωμένης υπηρεσίας διαχείρισης αιτήσεων για τη χορήγηση στεγαστικού επιδόματος στους φοιτητές της τριτοβάθμιας εκπαίδευσης ΧΡΗΜΑΤΟΔΟΤΗΣΗ: Ε.Π. Μεταρρύθμιση Δημόσιου Τομέα – ΕΣΠΑ 2014-2020 ELIXIR-GR H ελληνική ερευνητική υποδομή για τη διαχείριση και ανάλυση δεδομένων στις βιοεπιστήμες ΧΡΗΜΑΤΟΔΟΤΗΣΗ: ΕΠΑνΕΚ / ΕΣΠΑ 2014-2020 HELIX – Εθνικές ψηφιακές υποδομές για την Έρευνα ΧΡΗΜΑΤΟΔΟΤΗΣΗ: ΕΠΑνΕΚ / ΕΣΠΑ 2014-2020 Υποστήριξη της διαδικασίας εμπλουτισμού του MITOS (Εθνικό Μητρώο Διοικητικών Διαδικασιών) και επέκταση της λειτουργικότητας του ΧΡΗΜΑΤΟΔΟΤΗΣΗ: Μεταρρύθμιση Δημόσιου Τομέα / ΕΣΠΑ 2014-2020, ΠΔΕ Share: "
