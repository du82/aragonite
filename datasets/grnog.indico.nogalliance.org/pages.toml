["https://grnog.indico.nogalliance.org/event/4/timetable"]
title = "vGRNOG 12  (24 June 2021) · GRNOG (Indico)"
description = "welcome and logistics"
full_description = "Streaming Telemetry has been on the rise for quite some time but is it ready for the production? Let's take a peek through the journey so far, in our quest to rid ourselves from SNMP In this presentation, we provide an introduction to SCION. SCION stands for Scalability, Control and Isolation on Next-Generation Networks, and is being developed at ETH Zurich, a university in Switzerland, and its spin-off company Anapaya Systems. The goal of SCION is to provide a secure, stable and transparent internet, achieved through secure inter-domain routing and path-aware networking. The presenter works at SIDN Labs, where he works within the context of the 2STiC programme. The 2STiC programme is a collaboration between AMS-IX, NDIX, NLnet Labs, SIDN Labs, SURF, TU Delft, the University of Amsterdam and the University of Twente. Within this programme we are looking at emerging internet architectures, such as SCION, RINA and NDN, as well as programmable networks. The last international submarine cable to land in Mainland Greece did so in 2003. Almost 20 years after this, the IONIAN Submarine cable will be laid, connecting Preveza in Greece to Crotone in Italy with an unrepeated high fiber count system. This will then be extended in both countries with a terrestrial fiber ring reaching Athens and Thessaloniki in Greece and Milan and Rome in Italy. Overall it will be the most robust and performant international route with a maximum capacity of up to 360 Tbps with current transmission technology. The presentation provides an automation process walkthrough that aims at updating, compiling and pushing BGP filters to routers using existing tools and components."
year_published = 2021
