["https://grnog.indico.nogalliance.org/event/3/timetable"]
title = "vGRNOG 11  (15 April 2021) · GRNOG (Indico)"
description = """
The story behind a recent blogpost of ours: https://engineering.skroutz.gr/blog/uncovering-a-24-year-old-bug-in-the-linux-kernel/
I will try to cover the aspects not covered extensively in the blogpost, i.e. the interaction with the Linux kernel community, the availability of tools and how it has impacted kernel debugging over time, etc. Additionally, I will comment on the responses to the post itself, demonstrating why this bug may have remained uncovered for 24 years."""
full_description = "The story behind a recent blogpost of ours: https://engineering.skroutz.gr/blog/uncovering-a-24-year-old-bug-in-the-linux-kernel/ I will try to cover the aspects not covered extensively in the blogpost, i.e. the interaction with the Linux kernel community, the availability of tools and how it has impacted kernel debugging over time, etc. Additionally, I will comment on the responses to the post itself, demonstrating why this bug may have remained uncovered for 24 years. In this presentation, we discuss recent segment routing innovations, in particular Flex-Algo and BGP Classful Transport (BGP-CT). These provide a way of extending the Seamless MPLS paradigm to allow inter-domain transport according to a variety of cost-functions, such as minimum latency or minimum monetary cost. An introduction to a new and novel routing protocol for the datacenter; Routing in Fat Trees or in short RIFT. In this presentation we will dive into what challenges RIFT solves over the use of OSPF, IS-IS and BGP in the datacenter. I will also give an update on the status of the work in IETF and point out to some implementations. This presentation describes recent enhancements to popular IP OAM tools (PING and TRACEROUTE) as described in RFC 8335 and RFC 5837."
year_published = 2021
