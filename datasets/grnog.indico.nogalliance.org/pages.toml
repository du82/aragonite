["https://grnog.indico.nogalliance.org/event/2/timetable"]
title = "vGRNOG 10  (24 September 2020) · GRNOG (Indico)"
description = "Welcome to vGRNOG10"
full_description = "Presentation of the new management network implemented at AMS-IX with Dell/Pluribus switches in fabric deployment Automation is the key for simplifying network operations from provisioning to day-to-day management. Where manual processes require resources to scale linearly with the network, automation tools amplify the work of each network operations engineer. Simultaneously, the programmatic operation of the network means that it is faster to provision new policies and services in the network. We present a privacy-aware schema that is suitable for distributing the contents of Authoritative DNS Server zones to third parties (Recursive DNS Servers, scrubbing services), without disclosing sensitive information. Our schema aims at defending against DNS attacks efficiently, closer to their sources. It is based on the space, time and privacy-aware properties of Cuckoo Filters to map Authoritative DNS Server names efficiently, while enabling rapid name updates for large zones. The feasibility of our schema is tested within our laboratory testbed for various DNS zones. Our work was published in the Proceedings of ACM/IRTF Applied Networking Research Workshop 2020 (ANRW 2020) under the title “Enabling Privacy-Aware Zone Exchanges Among Authoritative and Recursive DNS Servers”."
year_published = 2020
clearnet = "https://grnog.indico.nogalliance.org/event/2/timetable"
tags = ["among", "ams-ix", "arista", "authentication", "authoritative", "cloud", "ctrl", "embracing", "enabling", "exchanges"]
language = "en"
internal-references = ["none"]
external-references = ["agencytrust.com", "cloud.grnog.gr", "cosmote.gr", "diavlos.grnet.gr", "eventbrite.com", "flexoptix.net", "gamma.app", "getindico.io", "gin.ntt.net", "goo.gl", "grnet.gr", "grnog.gr", "lamdahellix.com", "learn.getindico.io", "nlg.gr", "nogalliance.org", "ripe.net", "synapsecom.gr", "top.host", "wordpress.org"]

["https://grnog.indico.nogalliance.org/event/4/page/8-privacy-policy"]
title = "vGRNOG 12  (24 June 2021): Privacy Policy · GRNOG (Indico)"
full_description = "GRNOG (Greek Network Operators Group) is a community of professionals that are involved in the design, implementation, provisioning and operation of Greek Internet services, networks and infrastructure. It is an informal group of people with no legal substance currently. All of our tools are hosted by third party providers, eg the Global NOG Alliance (web site, mailing list, user management etc) and eventbrite (event registration). Some infrastructure (eg email alias, DNS) is hosted at GRNET. Please check the privacy notice of each of those providers to see what data are processed by them. Most of our tools are hosted by the Global NOG Alliance. Its private policy can be found here. The registrations are currently handled by eventbrite.com, privacy policy here. Our mailing lists / aliases are currently hosted in infrastructures of GRNET. The right to access – You have the right to request GRNOG for copies of your personal data. We will give this on best effort basis. The right to rectification – You can self provision any of your personal information you believe is inaccurate. The right to restrict processing – You have the right to request that GRNOG restricts the processing of your personal data, under certain conditions. Please bear in mind that this causes administrative overhead and the group works as a volunteer effort. The right to object to processing – You have the right to object to GRNOG’s processing of your personal data (eg photos / recordings during events). If you make a request, we have one month to respond to you. If you would like to exercise any of these rights, please contact the board using the email: board AT grnog DOT gr. Cookies are text files placed on your computer to collect standard Internet log information and visitor behavior information. When you visit our website, we may collect information from you automatically through cookies or similar technology For further information, visit allaboutcookies.org. GRNOG utilizes web hosting of the Global NOG Alliance that provide the tools and infrastructure for our site. Read the relevant privacy policy here."
year_published = 2021
year_updated = 2021
clearnet = "https://grnog.indico.nogalliance.org/event/4/page/8-privacy-policy"
