full_description = "Mbira sensors in the news Sep 12, 2018 Thanks to a number of news and professional organizations that featured our mbira sensors, including: An episode of the BBC World Service program “Science in Action,” in which host Roland Pease interviewed us about our mbira sensors. An episode of the Scientific American podcast “60-Second Science” by Christopher Intagliata. The National Science Foundation featured our mbira sensors in their “4 Awesome Discoveries You Probably Didn’t Hear About This Week” program. “A sensor inspired by an African thumb piano could root out bogus medicines,” a story by Maria Temming in Science News. “This simple musical instrument can detect poison,” an article by David Grossman in Popular Mechanics. “Musical instrument goes flat in presence of adulterated medicine,” a writeup by Chris Lee on Ars Technica. “Sounding a sour note can save people from a sour stomach (or worse),” a post by Roger Cheng on Hackaday “Musical instrument turned into liquid density sensor,” a news item by Emma Stoye in the Royal Society of Chemistry’s Chemistry World. “Modern version of ancient musical instrument detects poisons,” a story by Ben Coxworth in New Atlas. “Sensors that are literally ‘music to one’s ears,’” a press release and video by the American Chemical Society. “Musical sensor shows bad medicine plays false note,” an excellent story by Holly Ober on the UC Riverside homepage."
