["https://groverlab.org/research/2010-01-01-cell-growth.html"]
title = "Using buoyant mass to measure the growth of single cells"
description = "Michel Godin, Francisco Feijo Delgado, Sungmin Son, William H. Grover, Andrea K. Bryan, Amit Tzur, Paul Jorgensen, Kris Payer, Alan D. Grossman, Marc W. Kirs..."
full_description = "Using buoyant mass to measure the growth of single cells Jan 1, 2010 Michel Godin, Francisco Feijo Delgado, Sungmin Son, William H. Grover, Andrea K. Bryan, Amit Tzur, Paul Jorgensen, Kris Payer, Alan D. Grossman, Marc W. Kirschner, and Scott R. Manalis, Nature Methods 7, 387-390 (2010). PDF We used a suspended microchannel resonator (SMR) combined with picoliter-scale microfluidic control to measure buoyant mass and determine the “instantaneous” growth rates of individual cells. The SMR measures mass with femtogram precision, allowing rapid determination of the growth rate in a fraction of a complete cell cycle. We found that for individual cells of Bacillus subtilis, Escherichia coli, Saccharomyces cerevisiae and mouse lymphoblasts, heavier cells grew faster than lighter cells."
