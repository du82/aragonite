["https://groverlab.org/news/2018/04/01/csu.html"]
title = "Dr. Grover's investigation into the fictitious 'California South University' featured in the media"
description = "Dr. Grover’s investigation into the ficitious “California South University” has been featured in a number of stories in the media, including:      “Oh-oh Can..."
full_description = "Dr. Grover's investigation into the fictitious 'California South University' featured in the media Apr 1, 2018 Dr. Grover’s investigation into the ficitious “California South University” has been featured in a number of stories in the media, including: “Oh-oh Canada: Baffling fake university mangles our culture” by Tom Spears in the Ottawa Citizen. “Down the Rabbit Hole With Alireza Heidari” by Derek Lowe in the Nature Translational Medicine blog In the Pipeline. “Fake California university copies U of A’s history” by Nathan Fung in the University of Alberta’s student newspaper, The Gateway. “No, that’s not our website”, a blog post on the University of Alberta homepage. “A fictitious online university has stolen the identity of the University of Alberta” by Marty Klinkenberg in the Globe and Mail newspaper. “University of Alberta’s identity stolen by fake California institution” by Anna McMillan for CBC News. “Fake California university borrows University of Alberta history, campus” by Janet French in the Edmonton Journal newspaper. Dr. Grover was interviewed about his investigation on CBC Radio Edmonton. Dr. Grover was also interviewed about his investigation on CBC Radio Calgary. “Fake School California South University Is The University Of Alberta’s Evil Twin” by Sima Shakeri in the Huffington Post. “Fake University Pretended to Be University of Alberta” by Grade Bird in Inside Higher Ed. As of July 2018, the “California South University” website has been taken down. You can see what it used to look like on the Internet Archive’s Wayback Machine."
year_published = 2018
clearnet = "https://groverlab.org/news/2018/04/01/csu.html"
