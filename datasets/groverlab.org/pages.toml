["http://groverlab.org/hnbfpr"]
title = "Grover Lab"
description = "Grover Lab<br> Department of Bioengineering<br> University of California, Riverside<br> Riverside, CA 92521"
full_description = "My oldest son makes custom Lego sets, and he ships the sets using the Post Office’s Priority Mail service. On the off chance that you’ve never used it before, Priority Mail uses four different standard boxes, each with a different size and shape. Not surprisingly, the four boxes have different shipping prices, with the smallest one the cheapest at $10 and the largest one the most expensive at $25. But perhaps more interestingly, the four boxes all have the same maximum weight: 70 pounds. It’s not hard to imagine putting 70 pounds of stuff in the largest box. At 12 inches by 12 inches by 6 inches, its volume is half a cubic foot. Filled with concrete, it would weigh about 75 pounds and would place you squarely in violation of the Priority Mail rules and regulations. But what about the smallest box? With an interior of just 8 5/8 by 5 3/8 by 1 5/8 inches, the smallest box is pretty tiny, about the size of “three stacked DVD cases” as the post office website helpfully suggests. How heavy could “three DVD cases” be? Is there any danger of exceeding the 70 pound limit? Back in college I got interested in Knoxville history, so it wasn’t long before I learned about James Agee. Agee was Knoxville’s greatest writer, his reputation only eclipsed by Cormac McCarthy’s stardom. Agee’s most famous work, A Death in the Family, was published after his death and earned him a posthumous Pulitzer Prize. Set in Knoxville in 1915, it tells the story of a boy whose father was killed in a car crash. The book was based on events in Agee’s own childhood in Knoxville, including his own father’s death when Agee was only six years old. Not long ago, 3D printers were so expensive and rare that the idea of having a 3D printer at home seemed like science fiction. But today I have a 3D printer in my garage. You can also find 3D printers at my son’s middle school, my public library, and in the homes of some of my bioengineering students at the University of California, Riverside, who are currently using their own 3D printers to build class projects while our campus is temporarily closed."
year_published = 2025
