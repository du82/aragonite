["https://groverlab.org"]
title = "Grover Lab"
description = "Grover Lab<br> Department of Bioengineering<br> University of California, Riverside<br> Riverside, CA 92521"
full_description = '''We're passionate about developing instruments. Some of these instruments measure the fundamental physical properties (like mass, volume, density, freezing point, and melting point) of particles, organisms, and other samples. Other instruments we're working on can sort samples based on these properties. Since every thing has these physical properties, our techniques can be applied in a wide variety of different fields, including medical diagnostics, materials science, toxicology, and many others. We also create tools that accelerate the process of developing new instruments. From software that designs microfluidic chips automatically, to improved tools for simulating microfluidics, and even "building blocks" that can be snapped together to build functional instruments, we look forward to the day when any scientist can build the tools they need quickly, easily, and inexpensively. Finally, we also believe in the importance of engineering in science education, and we develop educational tools that help students include engineering practices in their science classes. Shane Hoang’s work on using pneumatic logic to control biomedical devices (like the laboratory blood shaker/rocker shown here) was published in Annals of Biomedical Engineering! Special thanks to our coauthors Mabel Shehada, Konstantinos Karydis, and Philip Brisk. Shane Hoang’s work on using pneumatic logic to calculate parity bits and detect errors in air-powered systems was published in Device! Special thanks to our coauthors Mabel Shehada, Zinal Patel, Minh-Huy Tran, Konstantinos Karydis, and Philip Brisk. With their random multicolored patterns, each of these chocolate candies is unique. So what’s that good for? In a new paper out today in Scientific Reports, we show that these “CandyCodes” could help in the fight against counterfeit medications. Shane Hoang’s paper “A pneumatic random-access memory for controlling soft robots” was published in PLOS ONE. Shane developed a “pneumatic RAM chip,” a pneumatic logic circuit capable of controlling pneumatic soft robots. By dramatically reducing the amount of electronic hardware required to control soft robots, the pneumatic RAM can accelerate the spread of soft robotic technologies to a wide range of important application areas.'''
