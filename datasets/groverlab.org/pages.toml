["https://groverlab.org/people"]
title = "Grover Lab"
description = "Grover Lab<br> Department of Bioengineering<br> University of California, Riverside<br> Riverside, CA 92521"
full_description = "Dr. Grover is an Associate Professor in the Department of Bioengineering at the University of California, Riverside. Prior to joining UCR, Dr. Grover received his postdoctoral training in the Biological Engineering Division at Massachusetts Institute of Technology. In Prof. Scott Manalis’ group at MIT, Dr. Grover used the group’s microfluidic mass sensors to make the first precision measurements of the density of single living cells. Dr. Grover obtained his Ph.D. in Chemistry at the University of California, Berkeley. In Prof. Richard Mathies’ group at UC Berkeley, Dr. Grover developed microfluidic “processors” that bridged the chemical, biological, and computational sciences. A native of Tennessee, Dr. Grover received his B.S. in Chemistry at the University of Tennessee, Knoxville. Huy is an undergraduate student in the Department of Bioengineering at the University of California, Riverside. His current involvement in the Grover Lab has been designing, fabricating, and testing microfluidic devices that contribute to the control and function of soft robots. Additionally, he is interested in three other areas of microfluidics: organ-on-a chip, flow chemistry, and acoustofluidics. In the very distant future, he hopes to be a Professor of Bioengineering and perform his own research in one or all of his interested areas of microfluidics. Raymond is a PhD student in the Department of Bioengineering at UCR. He obtained his B.S. in Chemical Biology at the University of California, Berkeley in 2014. During his undergraduate and post-baccalaureate studies, he spent two years in Prof. Angelica Stacy’s lab at UCB where he characterized the process for production of flexible porous aluminum oxide and worked concurrently in Prof. Shuvo Roy’s group at UCSF where he investigated the immunoprotection of pancreatic islets using silicon nanopore membranes. He received his M.S. in Bioengineering at UCR in 2017. For his thesis work in Prof. Victor G. J. Rodger’s group, Raymond studied the separation of proteins using electrically conductive ultrafiltration membranes. His current research interests revolve around tailoring transport characteristics to develop tools for therapeutic and industrial applications."
