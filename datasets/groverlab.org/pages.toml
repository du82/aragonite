full_description = 'The Density Spectrum Ordinary matter (ruling out things like neutron stars) has densities in the range from nearly zero (for gases) to almost 23 g/mL (for osmium and iridium, the densest elements). And if you draw a number line from zero to 23 g/mL, like this: you can visualize the range of all possible densities—the “density spectrum,” if you will. Every thing in the world lives somewhere on the density spectrum. For example, water lives at 1 g/mL: diamonds can be found at 3.51 g/mL: and silver and gold live at 10.49 g/mL and 19.32 g/mL, respectively: Back in 2011 I had the idea to create a density spectrum that includes the densities of all the elements, along with some common chemical compounds and even some living cells. But I quickly realized that you’d need an enormous number line to be able to see tiny (but measurable!) differences in density. For example, you can’t see the difference between isopropanol (0.786 g/mL) and ethanol (0.789 g/mL) on this line: but you can easily measure this 0.003 g/mL difference. If you zoom in on the spectrum, you can see the difference between ethanol and isopropanol, but you can no longer appreciate the (now relatively enormous) full range over which these small density differences matter. So I decided to create a density spectrum that operates on multiple scales at once. On the bottom is the full density spectrum, from zero to 23 g/mL. A sliding window on the spectrum allows you to zoom in by a factor of 10 on that spectrum; the closeup is shown on the next row up. Another sliding window on that spectrum zooms in another factor of 10 (or a factor of 100 from the full spectrum). And yet another sliding window zooms in another factor of 10 (or a factor of 1000 from the full spectrum), allowing you to finally see tiny but measurable differences in the density of substances, cells, and other objects. I wrote this density spectrum viewer in 2011 using Processing and ported it to this website in 2017 using Proce