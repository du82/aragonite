["https://groverlab.org/research/2015-01-01-3d-tox.html"]
title = "Assessing and Reducing the Toxicity of 3D-Printed Parts"
description = "Shirin Mesbah Oskui, Graciel Diamante, Chunyang Liao, Wei Shi, Jay Gan, Daniel Schlenk, and William H. Grover, Environmental Science and Technology Letters 3..."
full_description = "Assessing and Reducing the Toxicity of 3D-Printed Parts Jan 1, 2015 Shirin Mesbah Oskui, Graciel Diamante, Chunyang Liao, Wei Shi, Jay Gan, Daniel Schlenk, and William H. Grover, Environmental Science and Technology Letters 3 (1): 1–6. PDF 3D printing is gaining popularity by providing a tool for fast, cost-effective, and highly customizable fabrication. However, little is known about the toxicity of 3D-printed objects. In this work, we assess the toxicity of printed parts from two main classes of commercial 3D printers, fused deposition modeling and stereolithography. We assessed the toxicity of these 3D-printed parts using zebrafish (Danio rerio), a widely used model organism in aquatic toxicology. Zebrafish embryos were exposed to 3D-printed parts and monitored for rates of survival, hatching, and developmental abnormalities. We found that parts from both types of printers were measurably toxic to zebrafish embryos, with STL-printed parts significantly more toxic than FDM-printed parts. We also developed a simple post-printing treatment (exposure to ultraviolet light) that largely mitigates the toxicity of the STL-printed parts. Our results call attention to the need for strategies for the safe disposal of 3D-printed parts and printer waste materials."
year_published = 2015
