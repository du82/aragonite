["https://groverlab.org/education"]
title = "Grover Lab"
description = "Grover Lab<br> Department of Bioengineering<br> University of California, Riverside<br> Riverside, CA 92521"
full_description = "The Technology Evolutionary Components Center at the University of California, Riverside works to provide students with hands-on experience engineering solutions to real-world problems, thereby preparing them for careers in the modern workforce. Problems like climate change, disease, and hunger are difficult to tackle in part because they require multidisciplinary solutions. To help students work on these problems, we are developing the MEC system, a library of interdisciplinary “building blocks” that can be clicked together to create functional research instruments for a wide variety of different applications. In the TEC Center, students use MECs to build, test, refine, and share tools for supporting real-world research in important fields like alternative fuels production, drug discovery, and toxicology. Since the TEC Center was founded in 2015, over 50 UC Riverside undergraduates have received an immersive training experience in the Center. We are on the threshold of an explosion in the popularity of 3D printers. As the original patents on 3D printing expire, the market is being flooded with low-cost 3D printers, and the number of inexpensive 3D printers sold per year is doubling every year. As 3D printers grow less expensive, they are becoming increasingly popular in libraries, schools, and homes; even toy 3D printers for children are now available. However, the popularity of 3D printers has blinded us to their potential risks. The undeniable “coolness” of 3D printing distracts us from the reality that 3D printers are like tiny factories; the materials they use and waste they generate can be hazardous to our health and the environment. But unlike factories, 3D printers are largely unregulated and are being welcomed into our schools and homes. Anechoic plays a user-selected sound from your phone’s speaker, then uses your phone’s microphone to measure how much of the sound is reflected back to the phone. When your phone is passed in front of an object, the sound bouncing off of the object can be detected by Anechoic, and in some cases the rough shape of the object can be discerned in the signal plotted on the app (similar to medical ultrasound)."
year_published = 2025
