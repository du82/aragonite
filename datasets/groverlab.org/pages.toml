["https://groverlab.org/research/2016-06-21-mec.html"]
title = 'MECs: "Building Blocks" for Creating Biological and Chemical Instruments'
description = "Douglas A. Hill, Lindsey E. Anderson, Casey J. Hill, Afshin Mostaghim, Victor G. J. Rodgers, and William H. Grover.  PLOS ONE 11 (7): e0158706.  PDFThe devel..."
full_description = 'MECs: "Building Blocks" for Creating Biological and Chemical Instruments Jun 21, 2016 Douglas A. Hill, Lindsey E. Anderson, Casey J. Hill, Afshin Mostaghim, Victor G. J. Rodgers, and William H. Grover. PLOS ONE 11 (7): e0158706. PDF The development of new biological and chemical instruments for research and diagnostic applications is often slowed by the cost, specialization, and custom nature of these instruments. New instruments are built from components that are drawn from a host of different disciplines and not designed to integrate together, and once built, an instrument typically performs a limited number of tasks and cannot be easily adapted for new applications. Consequently, the process of inventing new instruments is very inefficient, especially for researchers or clinicians in resource-limited settings. To improve this situation, we propose that a family of standardized multidisciplinary components is needed, a set of “building blocks” that perform a wide array of different tasks and are designed to integrate together. Using these components, scientists, engineers, and clinicians would be able to build custom instruments for their own unique needs quickly and easily. In this work we present the foundation of this set of components, a system we call Multifluidic Evolutionary Components (MECs). “Multifluidic” conveys the wide range of fluid volumes MECs operate upon (from nanoliters to milliliters and beyond); “multi” also reflects the multiple disciplines supported by the system (not only fluidics but also electronics, optics, and mechanics). “Evolutionary” refers to the design principles that enable the library of MEC parts to easily grow and adapt to new applications. Each MEC “building block” performs a fundamental function that is commonly found in biological or chemical instruments, functions like valving, pumping, mixing, controlling, and sensing. Each MEC also has a unique symbol linked to a physical definition, which enables instruments to be designed rapidly and efficiently using schematics. As a proof-of-concept, we use MECs to build a variety of instruments, including a fluidic routing and mixing system capable of manipulating fluid volumes over five orders of magnitude, an acid-base titration instrument suitable for use in schools, and a bioreactor suitable for maintaining and analyzing cell cultures in research and diagnostic applications. These are the first of many instruments that can be built by researchers, clinicians, and students using the MEC system.'
