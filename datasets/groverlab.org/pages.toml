["https://groverlab.org/research/2018-09-12-mbira.html"]
title = "Musical instruments as sensors"
description = "Heran C. Bhakta, Vamsi K. Choday, and William H. Grover.  ACS Omega 3 (9), 11026-11032 (2018).The frequencies of notes made by a musical instrument are deter..."
full_description = "Musical instruments as sensors Sep 12, 2018 Heran C. Bhakta, Vamsi K. Choday, and William H. Grover. ACS Omega 3 (9), 11026-11032 (2018). The frequencies of notes made by a musical instrument are determined by the physical properties of the instrument. Consequently, by measuring the frequency of a note, one can infer information about the instrument’s physical properties. In this work, we show that by modifying a musical instrument to contain a sample and analyzing the instrument’s pitch, we can make precision measurements of the physical properties of the sample. We used the mbira, a 3000-year-old African musical instrument that consists of metal tines attached to a wooden board; these tines are plucked to play musical notes. By replacing the mbira’s tines with bent steel tubing, filling the tubing with a sample, using a smartphone to record the sound while plucking the tubing, and measuring the frequency of the sound using a free software tool on our website, we can measure the density of the sample with a resolution of about 0.012 g/mL. Unlike existing tools for measuring density, the mbira sensor can be made and used by virtually anyone in the world. To demonstrate the mbira sensor’s capabilities, we used it to successfully distinguish diethylene glycol and glycerol, two similar chemicals that are sometimes mistaken for each other in pharmaceutical manufacturing (leading to hundreds of deaths). We also show that consumers could use mbira sensors to detect counterfeit and adulterated medications (which represent around 10% of all medications in low- and middle-income countries). We expect that many other musical instruments can function as sensors and find important and lifesaving applications."
year_published = 2018
clearnet = "https://groverlab.org/research/2018-09-12-mbira.html"
