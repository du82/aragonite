arking a …Read moregRPC with REST and Open APIsMonday, May 09, 2016 in BlogOur guest post today comes from Brandon Phillips of CoreOS. CoreOS builds open source projects and products for Linux Containers. Their flagship product for consensus and discovery etcd and their container engine rkt are early adopters of gRPC. One …Read moregRPC - now with easy installationMonday, April 04, 2016 in BlogToday we are happy to provide an update that significantly simplifies the getting started experience for gRPC. For most languages, the gRPC runtime can now be installed in a single step via native package managers such as npm for Node.js, gem for …Read moreGoogle Cloud PubSub - with the power of gRPC!Thursday, March 24, 2016 in BlogGoogle Cloud PubSub is Google’s scalable real-time messaging service that lets users send and receive messages between independent applications. It’s an important part of Google Cloud Platform’s big data offering, and is used by …Read morePosts in 2015gRPC releases Beta, opening door for use in production environmentsMonday, October 26, 2015 in BlogThe gRPC team is excited to announce the immediate availability of gRPC Beta. This release marks an important point in API stability and going forward most API changes are expected to be additive in nature. This milestone opens the door for gRPC use …Read more«««23456»»»"
