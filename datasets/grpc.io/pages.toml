["https://grpc.io/blog/hello-pancakes"]
title = "Dear gRPC | gRPC"
description = """
Dear gRPC,
We messed up. We are so sorry that we missed your birthday this year. Last year we celebrated with cake and fanfare, but this year we dropped the ball. Please don’t think that we love you any less.
You’re 4 now and that’s a big milestone! You’re part of so much amazing technology at companies like Salesforce, Netflix, Spotify, Fanatics, and of course, Google. In fact just this week the biggest API Google has went production-ready with gRPC."""
full_description = "RSS Dear gRPCBy April Nassi | Friday, March 08, 2019Dear gRPC,We messed up. We are so sorry that we missed your birthday this year. Last year we celebrated with cake and fanfare, but this year we dropped the ball. Please don’t think that we love you any less.You’re 4 now and that’s a big milestone! You’re part of so much amazing technology at companies like Salesforce, Netflix, Spotify, Fanatics, and of course, Google. In fact just this week the biggest API Google has went production-ready with gRPC.We’re proud of you, gRPC, and we’re going to make this up to you. For starters - we got you a puppy! He’s an adorable Golden Retriever and his name is PanCakes. He loves to run back and forth with toys, packets, or messages. He’s super active and no matter how much we train him, we just can’t get him to REST. PanCakes is going to be your best friend, and ambassador.Even though it’s a bit late, we still want to throw you a party, gRPC. Our friends at CNCF have planned a big event for you on March 21, and there’s going to be lots of people there! They’ll be sharing stories about the cool things they’ve built, and meeting new people. It’s an entire day all about you, and everyone there is going to learn so much. There will be other puppies who can play with PanCakes! Some of the amazing dogs from Canine Companions for Independence will be there to greet conference attendees and share how they help their humans live a more independent life.We are so excited to see what this year holds for you, gRPC!~ gRPC Maintainers←PreviousNext→ View page source Edit this page Create child page Create documentation issue Create project issue"
