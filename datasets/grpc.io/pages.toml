["https://grpc.io/docs/languages/go/alts"]
title = "ALTS authentication | Go | gRPC"
description = "An overview of gRPC authentication in Go using Application Layer Transport Security (ALTS)."
full_description = 'DocsLanguagesGoALTSALTS authenticationAn overview of gRPC authentication in Go using Application Layer Transport Security (ALTS).ContentsOverviewgRPC Client with ALTS Transport Security ProtocolgRPC Server with ALTS Transport Security ProtocolServer AuthorizationClient AuthorizationALTS authenticationAn overview of gRPC authentication in Go using Application Layer Transport Security (ALTS).OverviewApplication Layer Transport Security (ALTS) is a mutual authentication and transport encryption system developed by Google. It is used for securing RPC communications within Google’s infrastructure. ALTS is similar to mutual TLS but has been designed and optimized to meet the needs of Google’s production environments. For more information, take a look at the ALTS whitepaper.ALTS in gRPC has the following features:Create gRPC servers & clients with ALTS as the transport security protocol.ALTS connections are end-to-end protected with privacy and integrity.Applications can access peer information such as the peer service account.Client authorization and server authorization support.Minimal code changes to enable ALTS.gRPC users can configure their applications to use ALTS as a transport security protocol with few lines of code.Note that ALTS is fully functional if the application runs on Compute Engine or Google Kubernetes Engine (GKE).gRPC Client with ALTS Transport Security ProtocolgRPC clients can use ALTS credentials to connect to servers, as illustrated in the following code excerpt:import ( "google.golang.org/grpc" "google.golang.org/grpc/credentials/alts" ) altsTC := alts.NewClientCreds(alts.DefaultClientOptions()) conn, err := grpc.NewClient(serverAddr, grpc.WithTransportCredentials(altsTC)) gRPC Server with ALTS Transport Security ProtocolgRPC servers can use ALTS credentials to allow clients to connect to them, as illustrated next:import ( "google.golang.org/grpc" "google.golang.org/grpc/credentials/alts" ) altsTC := alts.NewServerCreds(alts.DefaultServerOptions()) server := grpc.NewServer(grpc.Creds(altsTC)) Server AuthorizationgRPC has built-in server authorization support using ALTS. A gRPC client using ALTS can set the expected server service accounts prior to establishing a connection. Then, at the end of the handshake, server authorization guarantees that the server identity matches one of the service accounts specified by the client. Otherwise, the connection fails.import ( "google.golang.org/grpc" "google.golang.org/grpc/credentials/alts" ) clientOpts := alts.DefaultClientOptions() clientOpts.TargetServiceAccounts = []string{expectedServerSA} altsTC := alts.NewClientCreds(clientOpts) conn, err := grpc.NewClient(serverAddr, grpc.WithTransportCredentials(altsTC)) Client AuthorizationOn a successful connection, the peer information (e.g., client’s service account) is stored in the AltsContext. gRPC provides a utility library for client authorization check. Assuming that the server knows the expected client identity (e.g., foo@iam.gserviceaccount.com), it can run the following example codes to authorize the incoming RPC.import ( "google.golang.org/grpc" "google.golang.org/grpc/credentials/alts" ) err := alts.ClientAuthorizationCheck(ctx, []string{"foo@iam.gserviceaccount.com"}) Last modified May 21, 2024: Update Go documentation to use NewClient instead of Dial (#1295) (708f7a1) View page source Edit this page Create child page Create documentation issue Create project issue'
year_published = 2024
year_updated = 2024
