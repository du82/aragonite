ortPackageIsVersion6 = true SupportPackageIsVersion7 = true SupportPackageIsVersion8 = true SupportPackageIsVersion9 = true ) The SupportPackageIsVersion variables are referenced from generated protocol buffer files to ensure compatibility with the gRPC version used. The latest support package version is 9. Older versions are kept for compatibility. These constants should not be referenced from any other code. View Source const Version = "1.71.0" Version is the current grpc version. Variables ¶ View Source var ( // ErrClientConnClosing indicates that the operation is illegal because // the ClientConn is closing. // // Deprecated: this error should not be relied upon by users; use the status // code of Canceled instead. ErrClientConnClosing = status.Error(codes.Canceled, "grpc: the client connection is closing") // PickFirstBalancerName is the name of the pick_first balancer. PickFirstBalancerName = pickfirst.Name ) View Source var DefaultBackoffConfig = BackoffConfig{ MaxDelay: 120 * time.Second, } DefaultBackoffConfig uses values specified for backoff in https://github.com/grpc/grpc/blob/master/doc/connection-backoff.md. Deprecated: use ConnectParams instead. Will be supported throughout 1.x. View Source var EnableTracing bool EnableTracing controls whether to trace RPCs using the golang.org/x/net/trace package. This should only be set before any RPCs are sent or received by this program. View Source var ErrClientConnTimeout = errors.New("grpc: timed out when dialing") ErrClientConnTimeout indicates that the ClientConn cannot establish the underlying connections within the specified timeout. Deprecated: This error is never returned by grpc and should not be referenced by users. View Source var ErrServerStopped = errors.New("grpc: the server has been stopped") ErrServerStopped indicates that the operation is now illegal because of the server being stopped. Functions ¶ func ClientSupportedCompressors ¶ added in v1.54.0 func ClientSupportedCompressors(ctx context.Cont