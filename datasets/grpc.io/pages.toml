["https://grpc.io/docs/guides/opentelemetry-metrics"]
title = "OpenTelemetry Metrics | gRPC"
description = "OpenTelemetry Metrics available in gRPC"
full_description = "DocsGuidesOpenTelemetry MetricsOpenTelemetry MetricsOpenTelemetry Metrics available in gRPCContentsOverviewBackgroundInstrumentsPer-Call MetricsClient Per-Call InstrumentsClient Per-Attempt InstrumentsServer InstrumentsLB Policy InstrumentsWeighted Round Robin LB Policy InstrumentsPick First LB Policy InstrumentsXdsClient InstrumentsLabels/AttributesFAQQ. How do I get throughput or QPS (queries per second)?Q. How do I get error rate for RPCs?Language examplesAdditional ResourcesOpenTelemetry MetricsOpenTelemetry Metrics available in gRPCOverviewgRPC provides support for an OpenTelemetry plugin that provides metrics that can help you -Troubleshoot your systemIterate on improving system performanceSetup continuous monitoring and alerting.BackgroundOpenTelemetry is an observability framework to create and manage telemetry data. gRPC previously provided observability support through OpenCensus which has been sunsetted in the favor of OpenTelemetry.InstrumentsThe gRPC OpenTelemetry plugin accepts a MeterProvider and depends on the OpenTelemetry API to create a Meter that identifies the gRPC library being used, for example, grpc-c++ at version 1.57.1. The following listed instruments are created using this meter. Users should employ the OpenTelemetry SDK to customize the views exported by OpenTelemetry.More and more gRPC components are being instrumented for observability. Currently, we have the following components instrumented -Per-call (stable, on by default) : Observe RPCs themselves (for example, latency.)Client Per-Call : Observe a client callClient Per-Attempt : Observe attempts for a client call, since a call can have multiple attempts due to retry or hedging.Server : Observe a call received at the server.LB Policy : Observe various load-balancing policiesWeighted Round Robin (experimental)Pick-First (experimental)XdsClient (experimental)NOTE Some instruments are off by default and need to be explicitly enabled from the gRPC OpenTelemetry plugin API. Experimental metrics are always off by default. (Reference C++ API)Per-Call MetricsClient Per-Call InstrumentsNameTypeUnitLabels (required)Descriptiongrpc.client.call.durationHistogramsgrpc.method, grpc.target , grpc.statusThis metric aims to measure the end-to-end time the gRPC library takes to complete an RPC from the application’s perspective.Refer A66: OpenTelemetry Metrics for details.Client Per-Attempt InstrumentsNameTypeUnitLabels (disposition)Descriptiongrpc.client.attempt.startedCounter{attempt}grpc.method (required), grpc.target (required)The total number of RPC attempts started, including those that have not completed.grpc.client.attempt.durationHistogramsgrpc.method (required), grpc.target (required), grpc.status (required), grpc.lb.locality (optional)End-to-end time taken to complete an RPC attempt including the time it takes to pick a subchannel.grpc.client.attempt.sent_total_compressed_message_sizeHistogramBygrpc.method (required), grpc.target (required), grpc.status (required), grpc.lb.locality (optional)Total bytes (compressed but not encrypted) sent across all request messages (metadata excluded) per RPC attempt; does not include grpc or transport framing bytes.grpc.client.attempt.rcvd_total_compressed_message_sizeHistogramBygrpc.method (required), grpc.target (required), grpc.status (required), grpc.lb.locality (optional)Total bytes (compressed but not encrypted) received across all response messages (metadata excluded) per RPC attempt; does not include grpc or transport framing bytes.Refer A66: OpenTelemetry Metrics for details.Server InstrumentsNameTypeUnitLabels (required)Descriptiongrpc.server.call.startedCounter{call}grpc.methodThe total number of RPCs started, including those that have not completed.grpc.server.call.sent_total_compressed_message_sizeHistogramBygrpc.method, grpc.statusTotal bytes (compressed but not encrypted) sent across all response messages (metadata excluded) per RPC; does not include grpc or transport framing bytes.grpc.server.call.rcvd_total_compressed_message_sizeHistogramBygrpc.method, grpc.statusTotal bytes (compressed but not encrypted) received across all request messages (metadata excluded) per RPC; does not include grpc or transport framing bytes.grpc.server.call.durationHistogramsgrpc.method, grpc.statusThis metric aims to measure the end2end time an RPC takes from the server transport’s (HTTP2/ inproc) perspective.Refer A66: OpenTelemetry Metrics for details.LB Policy InstrumentsWeighted Round Robin LB Policy InstrumentsNameTypeUnitLabels (disposition)Descriptiongrpc.lb.wrr.rr_fallbackCounter{update}grpc.target (required), grpc.lb.locality (optional)EXPERIMENTAL: Number of scheduler updates in which there were not enough endpoints with valid weight, which caused the WRR policy to fall back to RR behavior.grpc.lb.wrr.endpoint_weight_not_yet_usableCounter{endpoint}grpc.target (required), grpc.lb.locality (optional)EXPERIMENTAL: Number of endpoints from each scheduler update that don’t yet have usable weight information (i.e., either the load report has not yet been received, or it is within the blackout period).grpc.lb.wrr.endpoint_weight_staleCounter{endpoint}grpc.target (required), grpc.lb.locality (optional)EXPERIMENTAL: Number of endpoints from each scheduler update whose latest weight is older than the expiration period.grpc.lb.wrr.endpoint_weightsHistogram{weight}grpc.target (required), grpc.lb.locality (optional)EXPERIMENTAL: Weight of an endpoint recorded every scheduler update.Refer A78: gRPC OTel Metrics for WRR, Pick First, and XdsClient for details.Pick First LB Policy InstrumentsNameTypeUnitLabels (required)Descriptiongrpc.lb.pick_first.disconnectionsCounter{disconnection}grpc.targetEXPERIMENTAL: Number of times the selected subchannel becomes disconnected.grpc.lb.pick_first.connection_attempts_succeededCounter{attempt}grpc.targetEXPERIMENTAL: Number of successful connection attempts.grpc.lb.pick_first.connection_attempts_failedCounter{attempt}grpc.targetEXPERIMENTAL: Number of failed connection attempts.Refer A78: gRPC OTel Metrics for WRR, Pick First, and XdsClient for details.XdsClient InstrumentsNameTypeUnitLabels (required)Descriptiongrpc.xds_client.connectedGauge{bool}grpc.target, grpc.xds.serverEXPERIMENTAL: Whether or not the xDS client currently has a working ADS stream to the xDS server.grpc.xds_client.server_failureCounter{failure}grpc.target, grpc.xds.serverEXPERIMENTAL: A counter of xDS servers going from healthy to unhealthy.grpc.xds_client.resource_updates_validCounter{resource}grpc.target, grpc.xds.server, grpc.xds.resource_typeEXPERIMENTAL: A counter of resources received that were considered valid, even if unchanged.grpc.xds_client.resource_updates_invalidCounter{resource}grpc.target, grpc.xds.server, grpc.xds.resource_typeEXPERIMENTAL: A counter of resources received that were considered invalid.grpc.xds_client.resourcesGauge{resource}grpc.target, grpc.xds.authority, grpc.xds.cache_state, grpc.xds.resource_typeEXPERIMENTAL: Number of xDS resources.Refer A78: gRPC OTel Metrics for WRR, Pick First, and XdsClient for details.Labels/AttributesWith a recorded measurement for an instrument, gRPC might provide some additional information as attributes or labels. For example, grpc.client.attempt.started has the labels grpc.method and grpc.target along with each measurement that tell us the method and the target associated with the RPC attempt being observed.NOTE Some attributes are marked as optional on the instruments. These need to be explicitly enabled from the gRPC OpenTelemetry Plugin API. (Reference C++ API)NameDescriptiongrpc.methodFull gRPC method name, including package, service and method, e.g. “google.bigtable.v2.Bigtable/CheckAndMutateRow”.grpc.statusgRPC server status code received, e.g. “OK”, “CANCELLED”, “DEADLINE_EXCEEDED”.grpc.targetCanonicalized target URI used when creating gRPC Channel, e.g. “dns:///pubsub.googleapis.com:443”, “xds:///helloworld-gke:8000”.grpc.lb.localityThe locality to which the traffic is being sent.grpc.xds.serverFor clients, indicates the target of the gRPC channel in which the XdsClient is used. For servers, will be the string “#server”.grpc.xds.authorityThe xDS authority. The value will be “#old” for old-style non-xdstp resource names.grpc.xds.cache_stateIndicates the cache state of an xDS resource (“requested”, “does_not_exist”, “acked”, “nacked”, “nacked_but_cached”).grpc.xds.resource_typexDS resource type, such as “envoy.config.listener.v3.Listener”.FAQQ. How do I get throughput or QPS (queries per second)?Use a count aggregation on the latency histogram metrics - grpc.client.attempt.duration / grpc.client.call.duration (for clients) or grpc.server.call.duration (for servers).Q. How do I get error rate for RPCs?Error counts can be calculated by using a filter grpc.status != OK value on the latency histogram metrics grpc.client.attempt.duration / grpc.client.call.duration (for clients) or grpc.server.call.duration (for servers).Language examplesLanguageExampleC++C++ ExampleGoGo ExampleJavaJava ExamplePythonPython ExampleAdditional ResourcesA66: OpenTelemetry MetricsA78: gRPC OTel Metrics for WRR, Pick First, and XdsClientA79: Non-per-call Metrics ArchitectureLast modified January 24, 2025: OTel Metrics: Update youtube video link (#1406) (e4f45b9) View page source Edit this page Create child page Create documentation issue Create project issue"
