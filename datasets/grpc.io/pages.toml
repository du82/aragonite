title = "Highlights in gRPConf 2024:Customer Showcase, Developer Engagement, Birds of Feathers Discussions and more. | gRPC"
description = "We loved hosting gRPConf 2024 this summer in Sunnyvale, California. Thank you to hundreds of developers from Netflix, Apple, Turso, Microsoft, Cisco, Coinbase, LinkedIn, Datadog, Mercari, Aspect Build, Signeen, Authzed, Reboot.dev, to name a few, who joined our special event. We were overwhelmed by the various topics and advanced use cases around the gRPC ecosystem. If you missed the opportunity to join in person, here are the video recordings that highlight the presentations during the day:"
full_description = "RSS Highlights in gRPConf 2024:Customer Showcase, Developer Engagement, Birds of Feathers Discussions and more.Monday, November 25, 2024We loved hosting gRPConf 2024 this summer in Sunnyvale, California. Thank you to hundreds of developers from Netflix, Apple, Turso, Microsoft, Cisco, Coinbase, LinkedIn, Datadog, Mercari, Aspect Build, Signeen, Authzed, Reboot.dev, to name a few, who joined our special event. We were overwhelmed by the various topics and advanced use cases around the gRPC ecosystem. If you missed the opportunity to join in person, here are the video recordings that highlight the presentations during the day:[gRPConf 2024 Keynote] Welcome! | Kevin Nilson, Google[gRPConf 2024 Keynote] State of gRPC | Abhishek Kumar, Google[gRPConf 2024 Keynote] Overview of gRPC | Ivy Zhuang, Google[gRPConf 2024 Keynote] Industry Trends and gRPC | Muninder Sambi & Anoop Vetteth, GoogleTen Years of gRPC | Jung-Yu (Gina) Yeh & Richard Belleville, GoogleReducing gRPC Call Volume Through Caching and Batching | Benjamin Fedorka, NetflixBuilding a New gRPC Library in Swift | George Barnett, ApplegRPC Rust | Doug Fawley, Google, and Lucio Franco, TursoHow Low Can You Go? A Dive into gRPC and ttRPC | Archana Choudhary & Sudipta Pandit, MicrosoftDynamic Policy Enforcement for Privacy Techniques in Microservice Architectures | Rami Haddad, CiscoLoad Balancing in gRPC | Easwar Swaminathan, GoogleEnhancing gRPC micro-services | Holly Casaletto and Yucong Sun, CoinbasegRPC and AI | Eric Anderson & Yuexin Li, GoogleHigh Performance Service Meshes with gRPC Proxyless | Jung-Yu (Gina) Yeh & Arvind Bright, GoogleManaging Protocol Buffers at Scale | Richard Belleville & Terry Wilson, GoogleRethinking Data Flow in gRPC-Go: | Ricardo Fernández Alvarado & Easwar Swaminathan, GoogleDos and Don’ts: Designing an xDS Backend for the LinkedIn Scale | Paul Chesnais, LinkedInAdapting our xDS control plane for proxyless gRPC | Antoine Tollenaere, DatadoggRPC APIs under One Roof: Mastering gRPC Federation for Efficient BFFs | Shuhei Kitagawa, MercariA Deep Dive into Advanced TLS | Andrey Ermolov & Gregory Cooke, GooglePowering Cisco ThousandEyes high-performant data streams w/ gRPC & OpenTelem. | Vitaly Kumov, CiscoBuilding Monorepo gRPC Services with Bazel | Alex Eagle, Aspect BuildgRPC Metadata Limits: The Good, the Bad, and the Ugly | Alisha Nanda, GoogleFortifying gRPC Microservices: Beyond JWT with mTLS and SPIFFE | Mehrdad Afshari, SigneengRPC Performance and Testing: a Maintainer Perspective | Ashley Zhang & Adam Heller, GoogleBuilding SpiceDB: a gRPC-first database | Jimmy Zelinskie, authzedEnabling Distributed Transactions Across Microservices using gRPC | Benjamin Hindman, reboot.devSubsetting in gRPC: How we implemented it at Datadog | Sergey Matyukevich, DatadogWe received a wealth of feedbacks from everyone throughout the day which has helped us shape our future roadmap. Stay tuned to gRPC on many platforms for new releases, announcements and events:gRPC YouTube ChannelgRPC Meetup GroupWebsiteBlogGitHubGoogle Group ForumTwitter←PreviousNext→ View page source Edit this page Create child page Create documentation issue Create project issue"
