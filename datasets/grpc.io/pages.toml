["https://grpc.io/docs/languages/cpp/alts"]
title = "ALTS authentication | C++ | gRPC"
description = "An overview of gRPC authentication in C++ using Application Layer Transport Security (ALTS)."
full_description = 'DocsLanguagesC++ALTSALTS authenticationAn overview of gRPC authentication in C++ using Application Layer Transport Security (ALTS).ContentsOverviewgRPC Client with ALTS Transport Security ProtocolgRPC Server with ALTS Transport Security ProtocolServer AuthorizationClient AuthorizationALTS authenticationAn overview of gRPC authentication in C++ using Application Layer Transport Security (ALTS).OverviewApplication Layer Transport Security (ALTS) is a mutual authentication and transport encryption system developed by Google. It is used for securing RPC communications within Google’s infrastructure. ALTS is similar to mutual TLS but has been designed and optimized to meet the needs of Google’s production environments. For more information, take a look at the ALTS whitepaper.ALTS in gRPC has the following features:Create gRPC servers & clients with ALTS as the transport security protocol.ALTS connections are end-to-end protected with privacy and integrity.Applications can access peer information such as the peer service account.Client authorization and server authorization support.Minimal code changes to enable ALTS.gRPC users can configure their applications to use ALTS as a transport security protocol with few lines of code.Note that ALTS is fully functional if the application runs on Compute Engine or Google Kubernetes Engine (GKE).gRPC Client with ALTS Transport Security ProtocolgRPC clients can use ALTS credentials to connect to servers, as illustrated in the following code excerpt:#include <grpcpp/grpcpp.h> #include <grpcpp/security/credentials.h> using grpc::experimental::AltsCredentials; using grpc::experimental::AltsCredentialsOptions; auto creds = AltsCredentials(AltsCredentialsOptions()); std::shared_ptr<grpc::Channel> channel = CreateChannel(server_address, creds); gRPC Server with ALTS Transport Security ProtocolgRPC servers can use ALTS credentials to allow clients to connect to them, as illustrated next:#include <grpcpp/security/server_credentials.h> #include <grpcpp/server.h> #include <grpcpp/server_builder.h> using grpc::experimental::AltsServerCredentials; using grpc::experimental::AltsServerCredentialsOptions; grpc::ServerBuilder builder; builder.RegisterService(&service); auto creds = AltsServerCredentials(AltsServerCredentialsOptions()); builder.AddListeningPort("[::]:<port>", creds); std::unique_ptr<Server> server(builder.BuildAndStart()); Server AuthorizationgRPC has built-in server authorization support using ALTS. A gRPC client using ALTS can set the expected server service accounts prior to establishing a connection. Then, at the end of the handshake, server authorization guarantees that the server identity matches one of the service accounts specified by the client. Otherwise, the connection fails.#include <grpcpp/grpcpp.h> #include <grpcpp/security/credentials.h> using grpc::experimental::AltsCredentials; using grpc::experimental::AltsCredentialsOptions; AltsCredentialsOptions opts; opts.target_service_accounts.push_back("expected_server_service_account1"); opts.target_service_accounts.push_back("expected_server_service_account2"); auto creds = AltsCredentials(opts); std::shared_ptr<grpc::Channel> channel = CreateChannel(server_address, creds); Client AuthorizationOn a successful connection, the peer information (e.g., client’s service account) is stored in the AltsContext. gRPC provides a utility library for client authorization check. Assuming that the server knows the expected client identity (e.g., foo@iam.gserviceaccount.com), it can run the following example codes to authorize the incoming RPC.#include <grpcpp/server_context.h> #include <grpcpp/security/alts_util.h> grpc::ServerContext* context; grpc::Status status = experimental::AltsClientAuthzCheck( context->auth_context(), {"foo@iam.gserviceaccount.com"}); Last modified August 11, 2021: Trim trailing whitespace from descriptions (#822) (88d84d6) View page source Edit this page Create child page Create documentation issue Create project issue'
