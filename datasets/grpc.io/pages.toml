["https://grpc.io/blog/bazel-rules-protobuf"]
title = "Building gRPC services with bazel and rules_protobuf | gRPC"
description = """
gRPC makes it easier to build high-performance
microservices by providing generated service entrypoints in a variety
of different languages.  Bazel complements these
efforts with a capable and fast polyglot build environment.
rules_protobuf extends
bazel and makes it easier develop gRPC services."""
full_description = '''RSS Building gRPC services with bazel and rules_protobufBy Paul Cody Johnston (PubRef.org) | Thursday, October 13, 2016Contents1.1: Package Structure1.2: Targets1.3: Target Pattern Syntax1.4: External Dependencies: Workspace Rules1.4.1: Workspace Rules that require a pre-existing WORKSPACE1.4.2: Workspace Rules that autogenerate a WORKSPACE file for you1.4.3: Workspace Rules that accept a BUILD file as an argument1.5: Bazel Summary1.6: rules_protobuf2.1: Services2.2: Compiled Programs2.3: Protobuf Definitions2.4: Build the grpc_greetertimer example application.2.4.1: Create the Project Layout2.4.2: The WORKSPACE2.4.3: The GreeterTimer Server2.4.4: The GreeterTimer Client2.4.5: Generate the go protobuf+gRPC code2.4.6: Generate the java protobuf libraries2.4.7: Run it!2.5: SummarygRPC makes it easier to build high-performance microservices by providing generated service entrypoints in a variety of different languages. Bazel complements these efforts with a capable and fast polyglot build environment.rules_protobuf extends bazel and makes it easier develop gRPC services.It does this by:Building protoc (the protocol buffer compiler) and all the necessary protoc-gen-* plugins.Building the protobuf and gRPC libraries required for gRPC-related code to compile.Abstracting away protoc plugin invocation (you don’t have to necessarily learn or remember how to call protoc).Regenerating and recompiling outputs when protobuf source files change.In this post I’ll provide background about how bazel works (Part 1) and how to get started building gRPC services with rules_protobuf (Part 2). If you’re already a bazel aficionado, you can skip directly to Part 2.To best follow along, install bazel and clone the rules_protobuf repository:git clone https://github.com/pubref/rules_protobuf cd rules_protobuf ~/rules_protobuf$ Great. Let’s get started!1: About BazelBazel is Google’s open-source version of their internal build tool called “Blaze”. Blaze originated from the challenges of managing a large monorepo with code written in a variety of languages. Blaze was the inspiration for other capable and fast build tools including Pants and Buck. Bazel is conceptually simple but there are some core concepts & terminology to understand:Bazel command: a function that does some type of work when called from the command line. Common ones include bazel build (compile a libary), bazel run (run a binary executable), bazel test (execute tests), and bazel query (tell me something about the build dependency graph). See all with bazel help.Build phases: the three stages (loading, analysis, and execution) that bazel goes through when calling a bazel command.The WORKSPACE file: a required file that defines the project root. It is primarily used to declare external dependencies (external workspaces).BUILD files: the presence of a BUILD file in a directory defines it as a package. BUILD files contain rules that define targets which can be selected using the target pattern syntax. Rules are written in a python-like language called skylark. Syklark has stronger deterministic guarantees than python but is intentionally minimal, excluding language features such as recursion, classes, and lambdas.1.1: Package StructureTo illustrate these concepts, let’s look at the package structure of the rules_protobuf examples subdirectory. Let’s look at the file tree, showing only those folder having a BUILD file:tree -P 'BUILD|WORKSPACE' -I 'third_party|bzl' examples/ . ├── BUILD ├── WORKSPACE └── examples ├── helloworld │ ├── cpp │ │ └── BUILD │ ├── go │ │ ├── client │ │ │ └── BUILD │ │ ├── greeter_test │ │ │ └── BUILD │ │ └── server │ │ └── BUILD │ ├── grpc_gateway │ │ └── BUILD │ ├── java │ │ └── org │ │ └── pubref │ │ └── rules_protobuf │ │ └── examples │ │ └── helloworld │ │ ├── client │ │ │ └── BUILD │ │ └── server │ │ └── BUILD │ └── proto │ └── BUILD └── proto └── BUILD 1.2: TargetsTo get a list of targets within the examples/ folder, use a query. This says “Ok bazel, show me all the callable targets in all packages within the examples folder, and say what kind of thing it is in addition to its path label”:~/rules_protobuf$ bazel query //examples/... --output label_kind | sort | column -t cc_binary rule //examples/helloworld/cpp:client cc_binary rule //examples/helloworld/cpp:server cc_library rule //examples/helloworld/cpp:clientlib cc_library rule //examples/helloworld/proto:cpp cc_library rule //examples/proto:cpp cc_proto_compile rule //examples/helloworld/proto:cpp.pb cc_proto_compile rule //examples/proto:cpp.pb cc_test rule //examples/helloworld/cpp:test filegroup rule //examples/helloworld/proto:protos filegroup rule //examples/proto:protos go_binary rule //examples/helloworld/go/client:client go_binary rule //examples/helloworld/go/server:server go_library rule //examples/helloworld/go/server:greeter go_library rule //examples/helloworld/grpc_gateway:gateway go_library rule //examples/helloworld/proto:go go_library rule //examples/proto:go_default_library go_proto_compile rule //examples/helloworld/proto:go.pb go_proto_compile rule //examples/proto:go_default_library.pb go_test rule //examples/helloworld/go/greeter_test:greeter_test go_test rule //examples/helloworld/grpc_gateway:greeter_test grpc_gateway_proto_compile rule //examples/helloworld/grpc_gateway:gateway.pb java_binary rule //examples/helloworld/java/org/pubref/rules_protobuf/examples/helloworld/client:netty java_binary rule //examples/helloworld/java/org/pubref/rules_protobuf/examples/helloworld/server:netty java_library rule //examples/helloworld/java/org/pubref/rules_protobuf/examples/helloworld/client:client java_library rule //examples/helloworld/java/org/pubref/rules_protobuf/examples/helloworld/server:server java_library rule //examples/helloworld/proto:java java_library rule //examples/proto:java java_proto_compile rule //examples/helloworld/proto:java.pb java_proto_compile rule //examples/proto:java.pb js_proto_compile rule //examples/helloworld/proto:js js_proto_compile rule //examples/proto:js py_proto_compile rule //examples/helloworld/proto:py.pb ruby_proto_compile rule //examples/proto:rb.pb We’re not limited to targets in our own workspace. As it turns out, the Google Protobuf repo is named as an external repository (more on this later) and we can also address targets in that workspace in the same way. Here’s a partial list:~/rules_protobuf$ bazel query @com_github_google_protobuf//... --output label_kind | sort | column -t cc_binary rule @com_github_google_protobuf//:protoc cc_library rule @com_github_google_protobuf//:protobuf cc_library rule @com_github_google_protobuf//:protobuf_lite cc_library rule @com_github_google_protobuf//:protoc_lib cc_library rule @com_github_google_protobuf//util/python:python_headers filegroup rule @com_github_google_protobuf//:well_known_protos java_library rule @com_github_google_protobuf//:protobuf_java objc_library rule @com_github_google_protobuf//:protobuf_objc py_library rule @com_github_google_protobuf//:protobuf_python ... This is possible because the protobuf team provides a BUILD file at the root of their repository. Thanks Protobuf team! Later we’ll learn how to “inject” our own BUILD files into repositories that don’t already have one.Inspecting the list above, we see a cc_binary rule named protoc. If we bazel run that target, bazel will clone the protobuf repo, build all the dependent libraries, build a pristine executable binary from source, and call it (pass command line arguments to binary rules after the double-dash):~/rules_protobuf$ bazel run @com_github_google_protobuf//:protoc -- --help Usage: /private/var/tmp/_bazel_pcj/63330772b4917b139280caef8bb81867/execroot/rules_protobuf/bazel-out/local-fastbuild/bin/external/com_github_google_protobuf/protoc [OPTION] PROTO_FILES Parse PROTO_FILES and generate output based on the options given: -IPATH, --proto_path=PATH Specify the directory in which to search for imports. May be specified multiple times; directories will be searched in order. If not given, the current working directory is used. --version Show version info and exit. -h, --help Show this text and exit. ... As we’ll see in a moment, we name the protobuf external dependency with a specific commit ID so there’s no ambiguity about which protoc version we’re using. In this way you can vendor in tools with your project with reliable, repeable, secure precision without bloating your repository by checking in binaries, resorting to git submodules, or similar hacks. Very clean!Note: the gRPC repository also has a BUILD file: $ bazel query @com_github_grpc_grpc//... --output label_kind1.3: Target Pattern SyntaxWith those examples under our belt, let’s examine the target syntax a bit more. When I first started working with bazel I found the target-pattern syntax somewhat intimidating. It’s actually not too bad. Here’s a closer look:The @ (at-sign) selects an external workspace. These are established by workspace rules that bind a name to something fetched over the network (or your filesystem).The // (double-slash) selects the workspace root.The : (colon) selects a target (rule or file) within a package. Recall that a package is established by the presence of a BUILD file in a subfolder of the workspace.The / (single-slash) selects a folder within a workspace or package.A common source of confusion is that the mere presence of a BUILD file defines that filesystem subtree as a package and therefore one must always account for that. For example, if there exists a file qux.js in foo/bar/baz/ and there exists a BUILD file in baz/ also, the file is selected with foo/bar/baz:qux.js and not foo/bar/baz/quz.jsCommon shortcut: if there exists a rule having the same name as the package, this is the implied target and can be omitted. For example, there is a :jar target in the //jar package in the external workspace com_google_guava_guava, so the following are eqivalent:deps = ["@com_google_guava_guava//jar:jar"] deps = ["@com_google_guava_guava//jar"] 1.4: External Dependencies: Workspace RulesMany large organizations check-in in all the required tools, compilers, linkers, etc to guarantee correct, repeatable builds. With external workspaces, one can effectively accomplish the same thing without bloating your repository.Note: the bazel convention is to use a fully-namespaced identifier for external dependency names (replacing special chars with underscore). For example, the remote repository URL is https://github.com/google/protobuf.git. This is simplified to the workspace identifier com_github_google_protobuf. Similarly, by convention the jar artifact io.grpc:grpc-netty:jar:1.0.0-pre1 becomes io_grpc_grpc_netty.1.4.1: Workspace Rules that require a pre-existing WORKSPACEThese rules assume that the remote resource or URL contains a WORKSPACE file at the top of the file tree and BUILD files that define rule targets. These are referred to as bazel repositories.git_repository: external bazel dependency from a git repository. The rule requires commit (or tag).http_archive: an external zip or tar.gz dependency from a URL. It is highly recommended to name a sha265 for security.Note: although you don’t interact directly with the bazel execution_root, you can peek at what these external dependencies look like when unpacked at $(bazel info execution_root)/external/WORKSPACE_NAME.1.4.2: Workspace Rules that autogenerate a WORKSPACE file for youThe implementation of these repository rules contain logic to autogenerate a WORKSPACE file and BUILD file(s) to make resources available. As always, it is recommended to provide a known sha265 for security to prevent a malicious agent from slipping in tainted code via a compromised network.http_jar: external jar from a URL. The jar file is available as a java_library dependency as @WORKSPACE_NAME//jar.maven_jar: external jar from a URL. The jar file is available as a java_library dependency as @WORKSPACE_NAME//jar.http_file: external file from a URL. The resource is available as a filegroup via @WORKSPACE_NAME//file.For example, we can peek at the generated BUILD file for the maven_jar guava dependency via:~/rules_protobuf$ cat $(bazel info execution_root)/external/com_google_guava_guava/jar/BUILD # DO NOT EDIT: automatically generated BUILD file for maven_jar rule com_google_guava_guava java_import( name = 'jar', jars = ['guava-19.0.jar'], visibility = ['//visibility:public'] ) filegroup( name = 'file', srcs = ['guava-19.0.jar'], visibility = ['//visibility:public'] ) Note: the external workspace directory won’t exist until you actually need it, so you’ll have to have built a target that requires it, such as bazel build examples/helloworld/java/org/pubref/rules_protobuf/examples/helloworld/client1.4.3: Workspace Rules that accept a BUILD file as an argumentIf a repository has no BUILD file(s), you can put one into its filesystem root to adapt the external resource into bazel’s worldview and make those resources available to your project.For example, consider Mark Adler’s zlib library. To start, let’s learn what depends on this code. This query says “Ok bazel, for all targets in examples, find all dependencies (a transitive closure set), then tell me which ones depend on the zlib target in the root package of the external workspace com_github_madler_zlib.” Bazel reports this reverse dependency set. We request the output in graphviz format and pipe this to dot to generate the figure:~/rules_protobuf$ bazel query "rdeps(deps(//examples/...), @com_github_madler_zlib//:zlib)" \ --output graph | dot -Tpng -O So we can see that all grpc-related C code ultimately depends on this library. But, there is no BUILD file in Mark’s repo… where did it come from?By using the variant workspace rule new_git_repository, we can provide our own BUILD file (which defines the cc_library target) as follows:new_git_repository( name = "com_github_madler_zlib", remote = "https://github.com/madler/zlib", tag: "v1.2.8", build_file: "//bzl:build_file/com_github_madler_zlib.BUILD", ) This new_* family of workspace rules keeps your repository lean and allows you to vendor in pretty much any type of network-available resource. Awesome!new_git_repositorynew_local_repositorynew_http_archiveYou can also write your own repository rules that have custom logic to pull resources from the net and bind it into bazel’s view of the universe.1.5: Bazel SummaryWhen presented with a command and a target-pattern, bazel goes through the following three phases:Loading: Read the WORKSPACE and required BUILD files. Generate a dependency graph.Analysis: for all nodes in the graph, which nodes are actually required for this build? Do we have all the necessary resources available?Execution: execute each required node in the dependency graph and generate outputs.Hopefully you now have enough conceptual knowledge of bazel to be productive.1.6: rules_protobufrules_protobuf is an extension to bazel that takes care of:Building the protocol buffer compiler protoc,Downloadi'''
