title = "Health Checking | gRPC"
description = "Explains how gRPC servers expose a health checking service and how client can be configured to automatically check the health of the server it is connecting to."
full_description = 'DocsGuidesHealth CheckingHealth CheckingExplains how gRPC servers expose a health checking service and how client can be configured to automatically check the health of the server it is connecting to.ContentsOverviewThe Server Side Health ServiceEnabling Client Health CheckingLanguage SupportHealth CheckingExplains how gRPC servers expose a health checking service and how client can be configured to automatically check the health of the server it is connecting to.OverviewgRPC specifies a standard service API (health/v1) for performing health check calls against gRPC servers. An implementation of this service is provided, but you are responsible for updating the health status of your services.On the client side you can have the client automatically communicate with the health services of your backends. This allows the client to avoid services that are considered unhealthy.The Server Side Health ServiceThe health check service on a gRPC server supports two modes of operation:Unary calls to the Check rpc endpointUseful for centralized monitoring or load balancing solutions, but does not scale to support a fleet of gRPC client constantly making health checksStreaming health updates by using the Watch rpc endpointUsed by the client side health check feature in gRPC clientsEnabling the health check service on your server involves the following steps:Use the provided health check library to create a health check serviceAdd the health check service to your server.Notify the health check library when the health of one of your services changes.NOT_SERVING if your service cannot accept requests at the momentSERVING if your service is open for businessIf you don’t care about the health of individual services, you can use an empty string ("") to represent the health of your whole server.Make sure you inform the health check library about server shutdown so that it can notify all the connected clients.The exact details vary by language, see the Language Support section below.Enabling Client Health CheckingA gRPC client can be configured to perform health checks against the servers it connects to by modifying the service config of the channel. E.g. to monitor the health of the foo service you would use (in JSON format):{ "healthCheckConfig": { "serviceName": "foo" } } Note that if your server reports health for the empty string ("") service, signifying the health of the whole server, you can also use an empty string here.Enabling health checking changes some behavior around calling a server:The client will additionally call the Watch RPC on the health check service when a connection is establishedIf the call fails, retries will be made (with exponential backoff), unless the call fails with the status UNIMPLEMENTED, in which case health checking will be disabled.Requests won’t be sent until the health check service sends a healthy status for the service being calledIf a healthy service becomes unhealthy the client will no longer send requests for that serviceThe calls will resume if the service later becomes healthySome load balancing policies can choose to disable health checking if the feature does not make sense with the policy (e.g. pick_first does this)More specifically, the state of the subchannel (that represents the physical connection to the server) goes through these states based on the health of the service it is connecting to.stateDiagram-v2 [*] --> IDLE IDLE --> CONNECTING : Connection requested CONNECTING --> READY : Health check#colon;\nSERVING CONNECTING --> TRANSIENT_FAILURE : Health check#colon;\nNOT_SERVING\nor call fails READY --> TRANSIENT_FAILURE : Health check#colon;\nNOT_SERVING READY --> IDLE : Connection breaks\nor times out TRANSIENT_FAILURE --> READY : Health check#colon;\nSERVING note right of TRANSIENT_FAILURE : Allows the load balancer to choose\nanother, working subchannel Again, the specifics on how to enable client side health checking varies by language, see the examples in the Language Support section.Language SupportLanguageExampleJavaJava exampleGoGo examplePythonPython exampleC++C++ exampleLast modified May 20, 2024: Add link to C++ health checking example (#1289) (571730d) View page source Edit this page Create child page Create documentation issue Create project issue'
year_published = 2024
year_updated = 2024
clearnet = "https://grpc.io/docs/guides/health-checking"
