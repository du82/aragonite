full_description = "DocsGuidesGuidesTask-oriented walkthroughs of common use casesThe documentation covers the following techniques:AuthenticationAn overview of gRPC authentication, including built-in auth mechanisms, and how to plug in your own authentication systems.BenchmarkinggRPC is designed to support high-performance open-source RPCs in many languages. This page describes performance benchmarking tools, scenarios considered by tests, and the testing infrastructure.CancellationExplains how and when to cancel RPCs.CompressionHow to compress the data sent over the wire while using gRPC.Custom Backend MetricsA mechanism in the gRPC library that allows users to inject custom metrics at the gRPC server and consume at gRPC clients to make your custom load balancing algorithms.Custom Load Balancing PoliciesExplains how custom load balancing policies can help optimize load balancing under unique circumstances.Custom Name ResolutionExplains standard name resolution, the custom name resolver interface, and how to write an implementation.DeadlinesExplains how deadlines can be used to effectively deal with unreliable backends.DebuggingExplains the debugging process of gRPC applications using grpcdebugError handlingHow gRPC deals with errors, and gRPC error codes.Flow ControlExplains what flow control is and how you can manually control it.Graceful ShutdownExplains how to gracefully shut down a gRPC server to avoid causing RPC failures for connected clients.Health CheckingExplains how gRPC servers expose a health checking service and how client can be configured to automatically check the health of the server it is connecting to.InterceptorsExplains how interceptors can be used for implementing generic behavior that applies to many RPC methods.KeepaliveHow to use HTTP/2 PING-based keepalives in gRPC.MetadataExplains what metadata is, how it is transmitted, and what it is used for.OpenTelemetry MetricsOpenTelemetry Metrics available in gRPCPerformance Best PracticesA user guide of both general and language-specific best practices to improve performance.ReflectionExplains how reflection can be used to improve the transparency and interpretability of RPCs.Request HedgingExplains what request hedging is and how you can configure it.RetrygRPC takes the stress out of failures! Get fine-grained retry control and detailed insights with OpenCensus and OpenTelemetry support.Service ConfigHow the service config can be used by service owners to control client behavior.Status CodesExplains the status codes used in gRPC.Wait-for-ReadyExplains how to configure RPCs to wait for the server to be ready before sending the request.Last modified November 12, 2024: Embed YouTube videos in different webpages (#1380) (196f408) View page source Edit this page Create child page Create documentation issue Create project issue"
