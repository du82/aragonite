["https://grpc.io/docs/guides/keepalive"]
title = "Keepalive | gRPC"
description = "How to use HTTP/2 PING-based keepalives in gRPC."
full_description = "DocsGuidesKeepaliveKeepaliveHow to use HTTP/2 PING-based keepalives in gRPC.ContentsOverviewBackgroundHow configuring keepalive affects a callCommon situations where keepalives can be usefulKeepalive configuration specificationLanguage guides and examplesAdditional ResourcesKeepaliveHow to use HTTP/2 PING-based keepalives in gRPC.OverviewHTTP/2 PING-based keepalives are a way to keep an HTTP/2 connection alive even when there is no data being transferred. This is done by periodically sending a PING frame to the other end of the connection. HTTP/2 keepalives can improve performance and reliability of HTTP/2 connections, but it is important to configure the keepalive interval carefully.NoteThere is a related but separate concern called [Health Checking]. Health checking allows a server to signal whether a service is healthy while keepalive is only about the connection.BackgroundTCP keepalive is a well-known method of maintaining connections and detecting broken connections. When TCP keepalive was enabled, either side of the connection can send redundant packets. Once ACKed by the other side, the connection will be considered as good. If no ACK is received after repeated attempts, the connection is deemed broken.Unlike TCP keepalive, gRPC uses HTTP/2 which provides a mandatory PING frame which can be used to estimate round-trip time, bandwidth-delay product, or test the connection. The interval and retry in TCP keepalive don’t quite apply to PING because the transport is reliable, so they’re replaced with timeout (equivalent to interval * retry) in gRPC PING-based keepalive implementation.NoteIt’s not required for service owners to support keepalive. Client authors must coordinate with service owners for whether a particular client-side setting is acceptable. Service owners decide what they are willing to support, including whether they are willing to receive keepalives at all (If the service does not support keepalive, the first few keepalive pings will be ignored, and the server will eventually send a GOAWAY message with debug data equal to the ASCII code for too_many_pings).How configuring keepalive affects a callKeepalive is less likely to be triggered for unary RPCs with quick replies. Keepalive is primarily triggered when there is a long-lived RPC, which will fail if the keepalive check fails and the connection is closed.For streaming RPCs, if the connection is closed, any in-progress RPCs will fail. If a call is streaming data, the stream will also be closed and any data that has not yet been sent will be lost.WarningTo avoid DDoSing, it’s important to take caution when setting the keepalive configurations. Thus, it is recommended to avoid enabling keepalive without calls and for clients to avoid configuring their keepalive much below one minute.Common situations where keepalives can be usefulgRPC HTTP/2 keepalives can be useful in a variety of situations, including but not limited to:When sending data over a long-lived connection which might be considered as idle by proxy or load balancers.When the network is less reliable (For example, mobile applications).When using a connection after a long period of inactivity.Keepalive configuration specificationOptionsAvailabilityDescriptionClient DefaultServer DefaultKEEPALIVE_TIMEClient and ServerThe interval in milliseconds between PING frames.INT_MAX (Disabled)7200000 (2 hours)KEEPALIVE_TIMEOUTClient and ServerThe timeout in milliseconds for a PING frame to be acknowledged. If sender does not receive an acknowledgment within this time, it will close the connection.20000 (20 seconds)20000 (20 seconds)KEEPALIVE_WITHOUT_CALLSClientIs it permissible to send keepalive pings from the client without any outstanding streams.0 (false)N/APERMIT_KEEPALIVE_WITHOUT_CALLSServerIs it permissible to send keepalive pings from the client without any outstanding streams.N/A0 (false)PERMIT_KEEPALIVE_TIMEServerMinimum allowed time between a server receiving successive ping frames without sending any data/header frame.N/A300000 (5 minutes)MAX_CONNECTION_IDLEServerMaximum time that a channel may have no outstanding rpcs, after which the server will close the connection.N/AINT_MAX (Infinite)MAX_CONNECTION_AGEServerMaximum time that a channel may exist.N/AINT_MAX (Infinite)MAX_CONNECTION_AGE_GRACEServerGrace period after the channel reaches its max age.N/AINT_MAX (Infinite)NoteSome languages may provide additional options, please refer to language examples and additional resource for more details.Language guides and examplesLanguageExampleDocumentationC++C++ ExampleC++ DocumentationGoGo ExampleGo DocumentationJavaJava ExampleJava DocumentationPythonPython ExamplePython DocumentationAdditional ResourcesgRFC for Client-side KeepalivegRFC for Server-side Connection ManagementUsing gRPC for Long-lived and Streaming RPCsLast modified October 9, 2024: Add gRPC Keepalive Youtube video link (#1370) (79b65fd) View page source Edit this page Create child page Create documentation issue Create project issue"
