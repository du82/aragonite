["https://grrrr.org/page/2"]
title = "grrrr.org – Page 2 – Thomas Grill — sound art and research"
full_description = "For the mdw magazine special topic “Artificial intelligence”, i was invited to contribute an article introducing our new artistic research project Spirits in Complexity (FWF AR-821). Spirits in Complexity: Making Kin with Experimental Music Systems On the last weekend of September 2024, the third OTTOsonics Festival will once again host and present diverse immersive sound works and performances with and by national and international artists. This year the program specifically sheds light on live, multi-instrumental acts amplified by the OTTOsonics multichannel systems. My composition mas voz is about strolling while listening and the identities of the surroundings, anecdotal memories and one’s own personality, which enter into a sonic/vocal conversation. The piece is performed live and has site-specific components that are adapted to the environment of each performance. The composition was made possible by the Austrian State Scholarship for Composition of the BMKOES. September 28, 18:00Alter Bauhof, Rodlstraße 19, 4100 Ottensheim In the context of our artistic research project “Spirits in Complexity”, we conduct a musical performance involving black box electronic music systems that have each been created/selected by one team member, but are played by another team member, unaware of the inner workings. The technologies involved as non-human partners are vintage analog systems, physical modelling systems and AI-driven synthesis based on a sample corpus. The fact that one of the players knows more about the instrument than the actual player shall give rise to interesting dynamics of musical anticipation. Performers: Thomas Grill, Angélica Castelló, Patrik Lechner, Marco Döttlinger Friday 27.9. 18hLigeti Hall @ MumuthLichtenfelsgasse 14, 8010 Graz The Speculative Sound Synthesis Symposium brings together sound artists, computer music composers and performers that are dedicated to critical, speculative approaches situated at the intersection of art and technology. It addresses practices that question, challenge, criticize, deconstruct, recompose, reformulate, shift, dislocate, endanger or reject established standards in sound synthesis and (music) technology. The symposium takes place 26.–28.9. in Graz, Austria as part of the artistic research project Speculative Sound Synthesis, funded by the Austrian Science Fund (FWF) within the program for Arts-based research PEEK (AR 713-G). It is hosted by the Institute of Electronic Music and Acoustics (IEM) at the University of Music and Performing Arts Graz (KUG). More information on the project can be found here."
