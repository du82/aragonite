title = "Announcement – grrrr.org"
full_description = "NAMES – The space between us Clara Iannotta echo from afar (ii), for six musicians and electronics (2022)Rojin Sharafi SÀNG, for ensemble and video (2024, commissioned by NAMES)Thomas Grill Blueprinting, performed environment for ensemble and live-electronics (2024)Marco Döttlinger points of no return, for 7 performers, mini-synthesizers and live-visuals (2024) Monday, 17.02.2025, 20.00MUMUTH – György-Ligeti-Saal, Graz NAMES (New Art and Music Ensemble Salzburg):Anna Lindenbaum violinLeo Morello celloMarina Iglesias flutesMarco Sala clarinetsMatthias Leboucher piano/keyboardsAlexander Bauer e-organ/keyboardsŠpela Mastnak percussionMarco Döttlinger live-electronics, live-visuals NAMES – The space between us #1 Clara Iannotta echo from afar (ii), for six musicians and electronics (2022)Rojin Sharafi SÀNG, for ensemble and video (2024, commissioned by NAMES)Thomas Grill Blueprinting, performed environment for ensemble and live-electronics (2024)Marco Döttlinger points of no return, for 7 performers, mini-synthesizers and live-visuals (2024) Saturday, 15.02.2025, 19:30Toihaus theater, Salzburg NAMES (New Art and Music Ensemble Salzburg):Anna Lindenbaum violinLeo Morello celloMarina Iglesias flutesMarco Sala clarinetsMatthias Leboucher piano/keyboardsAlexander Bauer e-organ/keyboardsŠpela Mastnak percussionMarco Döttlinger live-electronics, live-visuals For the series “Sound Art: Kunst zum Hören” at Austrian public radio ORF Ö1, 11 composers – students and teachers – of the Certificate Program in Electroacoustic and Experimental Music have created a composition, one building on just the final snippet of a previous one. Dieses Projekt wird von den Studierenden und Lehrenden des Lehrgangs für elektroakustische und experimentelle Musik (ELAK) durchgeführt. Im Rahmen dieses Prozesses erstellt jede KomponistIn eine 4-minütige Klangkomposition. Die nächsten KomponistInnen erhalten lediglich die letzten 30 Sekunden der vorherigen Arbeit, um darauf basierend ihre eigene Komposition zu entwickeln.Auf diese Weise entsteht eine unerwartete und überraschende Kollektive Klanglandschaft – eine surrealistische Collage, ein seltsames Wesen, das aus den kreativen Ideen und verschiedenen Stilen der 11 Teilnehmenden geformt wird. Participants are: Angélica Castelló, Finnian Treherne, Markus Sepperer, Marija Jociute, Bo Leitner, Miriam Jochmann, Moritz Kolmbauer, Thomas Grill, Kasho Chualan, Philipp Kleinwort, Ellen Preuss ORF Ö1, January 9 2025 23:03, on air and also streamed online."
