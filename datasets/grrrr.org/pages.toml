["https://grrrr.org/arts/projects/wcon"]
title = "World construction (2013 ff) – grrrr.org"
full_description = "The series “world construction” orbits around field recordings, that is, snapshots of the sounding world, which are set aside and revisited only after a longer period. The loss of immediate context leads to the discovery of new features, to a more “objective” assessment of the recordings. Diverse tools and media, be they electronic, instrumental, sculptural or architectural, are used to construe a new sonic experience based on the perception of the sound material. To date, the following variations on the concept have been made: Variation corner passing, premiered April 18, 2013 at the Kunstraum Niederösterreich in Vienna, Austria. Variation duoddaris, premiered July 26 and 27, 2013 at Kilpisjärvi, Finland. Variation empty vessel, premiered October 11, 2013 at The May Space, New Orleans, USA. Variation empty vessel, from a distance, premiered October 25, 2014 as part of the BAMBOULA/NOLA sound art exhibition, Prospect P3+ Biennale satellite program, Tulane University, New Orleans, USA. Variation jars of sound, premiered September 10, 2015 as part of the Schmiede festival, Hallein, Austria. Variation hear-here-there (for Augustina), premiered November 20, 2015 as part of Augustina träumt – in progressius exhibition project at G.A.S station, Berlin, Germany."
