["https://grrrr.org/tag/talk"]
title = "Talk – grrrr.org"
full_description = "Improvisation in Word, Thought, and Action Program:Thursday, December 5, 7pm: On ResearchCharlotta Ruth: Question SpaceThomas Grill: Dirty SpacesFriday, December 6, 7pm: On New MusicOlivia De Prato: Improvisation Inspired by the Environment and Field RecordingsDaniel Riegler: The Sound of Studio DanSaturday, December 7, 7pm: On PedagogyMaria Gstättner: Opening, Holding and Letting Go of SpacesPeter Herbert: How Did I Learn/Study and Possibly Teach (Can One??) Free Improv Thomas Grill: Dirty SpacesImprovisation, ultimately, is about having trust: in partners, in communication, in processes, in the environment and one’s own ability to deal with it all. For me, there is a irresolvable personal conflict between being drawn to unpredictable situations and the feeling of doubt–of being ill-prepared or overwhelmed.In my concept of improvisation, openness regarding place and space is fundamental–for my imagination, for taking a position and a perspective, for developing a form of communication. Noises in all forms are invited to join in. @ EchoraumSechshauserstraße 66, 1150 Wien At this year’s Austrian Composers Day, the “meeting place for composers, songwriters and interested people”, I am going to hold the keynote talk „Intelligente Kunst versus künstliche Intelligenz“ (“intelligent arts vs. artificial intelligence”). So-called artificial intelligence is currently on everyone’s lips, and its potential and dangers are widely discussed. The presentation aims to provide a concise introduction to the basics to enable a better understanding of this complex technology and its far-reaching implications. On the other hand, current developments in the field of music are presented and an overview of ethical and artistic-practical aspects is given. May 13, 2023, 10:00mdw – University of Music and Performings Arts ViennaHaydn-Saal Rotting sounds – Digitality and materiality Most of today’s media output, be it audio or video, is produced and stored in the digital domain. Although digital data are adorned by the myth of lossless transmission and migration, everyday experience does prove the existence of degradation and, ultimately, data loss in various forms. This pertains to the physical nature of storage media and playback devices as well as to media formats and software in the context of their technological infrastructure. The ongoing multi-year project of artistic research “Rotting sounds” strives to elaborate on the causes, mechanisms and effects of such deterioration, specifically in the context of digital audio.In this talk, I will focus on the material nature of the digital and its implications. I will illustrate this with concrete artistic works that have been created in the course of research. Time: November 2nd 2021, 15:00 CETLocation: https://kth-se.zoom.us/j/61230315241"
