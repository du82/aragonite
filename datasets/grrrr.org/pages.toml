["https://grrrr.org/about"]
title = "About – grrrr.org"
full_description = "Dr.phil. Thomas Grill, MA, born 1972 in Austria. Individual bachelor and master studies of Interactive Electronic Instruments at the University of Music and Performing Arts, Vienna. Doctoral degree in Composition and Music Theory at the University of Music and Performing Arts, Graz. Artistic and scientific research in fields of media arts, electroacoustic systems, sound perception, analysis and modeling, and machine learning. Development of commercial and open-source software, electronic instruments and interactive media systems. Conception and realization of multi-media installations and live electronics in the context of contemporary music. Publications, lectures and workshops at international institutions and conferences. Artistic work in most varied fields of audible and trans-media art, ranging from interactive and net-based audiovisual installation and photography to instrumental composition and electro-acoustic group improvisation. Numerous presentations of own compositions and installations at international festivals. Regular appearances as interpreter of composed contemporary music, as well as performer of structural and free improvisation. Ongoing cooperation with renowned artists in the fields of music, poetry, theater, dance and video. Works published on CD and DVD. Currently researching and teaching at the University of Music and Performing Arts Vienna. Head of the Certificate Program in Electroacoustic and Experimental Music (ELAK). Vice head of the Artistic Research Center (ARC). Curriculum vitae (PDF format) including list of publications available in English and German, or as a shorter formal CV (English)."
