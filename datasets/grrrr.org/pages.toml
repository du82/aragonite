["https://grrrr.org/category/documentation"]
title = "Documentation – grrrr.org"
full_description = "The ÆSR sound projection laboratory lab is a funded infrastructure project in order to establish a mobile and modular sound projection system for spatial acoustic design. In the context of musical composition, performance and installation art, it enables work with different projection strategies, such as beamforming, wave field synthesis and ambisonics. With students of the Certificate Program in Electroacoustic and Experimental Music we build 50 liter wedge-shaped loudspeaker cabinets, housing 12″ coaxial FaitalPro drivers. I was invited to take part in a panel discussion together with Reni Hofmüller, Christina Kubisch and Fränk Zimmer, presented by Susanna Niedermayr (ORF Ö1 Zeit-Ton) and hosted by esc medien kunst labor. The festival theme “Hidden sounds” was illuminated from different directions, in my case in the context of the rotting sounds project and the acousmatic composition noise shaping i have presented at the festival the day before. The Rotting sounds project took part in this year’s European Researchers’ Night, showcasing a broad range of research projects at the University of Applied Arts Vienna. From our ongoing research, we presented a couple of exemplary positions, such as Tobias Leibetseder’s “Fragments”, Almut Schilling’s and Till Bovermann’s “CD-R(ot)”, a part of Almut’s “The Carrier” installation, Till’s take on “Data Forensics”, as well as Thomas Grill’s “Mutual understanding” and “Reference Tone”. My installation Mutual understanding was selected for the AI x Music festival, part of this year’s Ars electronica festival, taking place at the monastery of St. Florian. The objects had a great outside location in the Garden of the Sommerrefektorium, even if the weather was partly rainy. The installation could withstand the humid weather. A report on my residence in Gmunden, Upper Austria, supported by the Kunstsammlung OÖ can now be found at http://www.diekunstsammlung.at/1040.htm. This morning, i did a hydrophone recording from the bridge between Landschloss and Seeschloss Ort in a water depth of about five meters. The two microphones were three meters apart, loosely hanging from the bridge. Any idea what the chirping at 4:10 could be? Recorded with Aquarian Audio H2a-XLR hydrophones on a Sound devices Mixpre-6 recorder. /data/arts/2017-air-gmunden/20170811-steg.ogg"
year_published = 2025
clearnet = "https://grrrr.org/category/documentation"
