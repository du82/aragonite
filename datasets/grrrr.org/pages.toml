["https://grrrr.org/tag/electroacoustic-music"]
title = "Electroacoustic music – grrrr.org"
full_description = "with loudspeaker orchestras from Belgium, Fribourg, Vienna and the Chuchchepati Orchestra with Bernhard Zitz, Thomas Grill, Katharina Klement, Dimitri Coppe, Patrick Kessler, Elvin Brandhi, Jocelyn Raphanel, Aurélie Emery, Elischa Heller, Ellen Preuss, Fabian Lanzmaier, Luz Gonzalez, Jonas Hammerer, Emanuel Hohl, Remy Rufer, Miriam Jochmann Raus aus dem Januarloch, rein in den Lautsprecherwald! Gemeinsam mit dem Chuchchepati Orchestra laden wir die Lautsprecherorchester Belgien und Fribourg sowie das ELAK Wien zum zweiten Gipfeltreffen der Lautsprecherorchester ein. Während vier Tagen wird das Palace zum akustischen Objekt umgestaltet: Die unzähligen Lautsprecher der jeweiligen Lautsprecherorchester werden verkabelt, im Raum verortet und auf ihre Eigenheiten geprüft. Mit historischen akusmatischen Konzerten, Echtzeit-Kompositionen von Gastmusiker*innen, Konzerten, installativen Stücken und Vorträgen über akusmatische Musik öffnet das ehemalige Kino seine Türen für ein zweitägiges Festival. Wir können euch versprechen: so viele eingesetzte Lautsprecher auf so kleinem Raum gab es wohl selten. Herzlich willkommen im Kabelsalat! @ PalaceBlumenbergplatz, St. Gallen10.+11.1.2025 Aloïs Yang & Andreas Trobollowitsch / Rojin Sharafi / Thomas Grill @ Hidden Dome Thomas Grill gibt mit Noise Shaping einen Einblick in das Forschungsprojekt rotting sounds, das sich mit der Vergänglichkeit von digitalem Klang im sozialen, technologischen und zeitlichen Kontext beschäftigt. Ein zentraler Forschungsgegenstand ist die Repräsentation von Klang als 1-bit-Datenstrom, der die Brücke zwischen digitalen und analogen Signalen schlägt. Der Begriff Noise Shaping steht dabei für den voluminösen Rauschhintergrund, der als Träger der darin verborgenen Klänge verwendet wird. Aloïs Yang and Andreas Trobollowitsch spannen mechanisch erzeugte Klänge in ein komplexes digitales Feedback-System ein; found objects kommen ebenso zum Einsatz wie natürliche Substanzen und performative Raumvermessungen. Und Rojin Sharafi, die ursprünglich aus dem Iran kommt und seit einigen Jahren in Österreich lebt, widmet sich in ihrem Stück der „kulturellen Hegemonie, kulturellen Hybridität und dem kulturellen Überleben“, jenen Stimmen also, die im Kampf um die kulturelle Vorherrschaft gezielt unterdrückt werden. Für ein immersives Klangerlebnis bei Hidden Dome sorgt die 50-Kanal Ambisonics Audioanlage des Dom im Berg, für die die drei Auftragswerke konzipiert wurden. October 8, 19:30pmDom im Berg, Schloßbergplatz, A-8010 Graz"
