["https://grrrr.org/category/uncategorized"]
title = "Uncategorized – grrrr.org"
full_description = "In Science Notes, we explore the wonderful and amazing world of sounds and noises. In five short contributions, writers, artists and scientists tell stories of their sonic explorations at the interface of science and society. ProgramKathrin Passig: International sneezing noisesNelly Ritz: Jurassic Zirp – How the age of the dinosaurs really soundedFriederike Potengowski: Sound journey to the beginnings of musicThomas Grill: Spirits in ComplexityKatharina Kropshofer: Sound of SilenceFelix Hahn: Where there is noise, settle down quietly…Moritz Simon Geist: Mad Science (sound performance) Klang und Krach – Wien 21.11.2024, Wien | WUK20:00 Uhr | Einlass: 19:30 | Eintritt frei On the occasion of the centenary of György Ligeti’s birth, the House of Music Hungary launches a series of educational and lecture programmes in cooperation with the music academies of Berlin, Vienna and Budapest, as well as Collegium Hungaricums. The nine artists participating in the program will write a new electroacoustic work by studying György Ligeti’s compositional methods and applying them, which will be presented at key venues in the three cities. The Ligeti 100.101 project invites participants to research the composer’s oeuvre through a creative process, where a deep understanding of his methods, thoughts and metaphors provides inspiration for the creation of new pieces performed by an ensemble of electronic musicians. Returning to technology and working with Ligeti’s ideas using computers, analogue/digital synthesizers, and algorithmic processes more than five decades after he abandoned electronic devices is an attempt to imagine what would happen if composers had access to faster and better technology. On the other hand, it is also an experiment to see how far 21st century technological/musical tools can extend his ideas. The project involves 2 students (and/or alumni) together with their mentors from each three universities (UdK-Berlin, Mdw-Vienna, LFZE-Budapest). Participants meet online and in person to share knowledge and ideas about Ligeti’s compositional techniques, the workflows of the creative process and the performative relationships of the pieces to be composed and realized during the project. As a closing event presenting the results of the program, three concerts – one per city – will take place between October 2023 and February 2024. PARTNERS House of Music Hungary, Liszt Academy, Universität der Künste Berlin (Sound Studies and Sonic Arts), Collegium Hungaricum Berlin, Universität für Musik und darstellende Kunst Wien, Collegium Hungaricum Wien, CTM Festival DATES Vienna: November 25, 2023 @ KlangtheaterBudapest: December 5, 2023 @ House of Music HungaryBerlin: January 31, 2024 @ Berlin Open Lab Mentors:Szigetvári Andrea (LFZE-Budapest)Gryllus Samu, Thomas Grill (MDW, Wien)Boris Hegenbart, Jan Thoben (UdK, Berlin) Participants:Máthé Ágnes, Lovász Ákos (LFZE-Budapest)Miriam Jochmann, Georg Volkert (MDW, Wien)Daria Redkina, Victor Burton (UdK, Berlin)"
