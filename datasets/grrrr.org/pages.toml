["https://grrrr.org/tag/research"]
title = "Research – grrrr.org"
full_description = "Improvisation in Word, Thought, and Action Program:Thursday, December 5, 7pm: On ResearchCharlotta Ruth: Question SpaceThomas Grill: Dirty SpacesFriday, December 6, 7pm: On New MusicOlivia De Prato: Improvisation Inspired by the Environment and Field RecordingsDaniel Riegler: The Sound of Studio DanSaturday, December 7, 7pm: On PedagogyMaria Gstättner: Opening, Holding and Letting Go of SpacesPeter Herbert: How Did I Learn/Study and Possibly Teach (Can One??) Free Improv Thomas Grill: Dirty SpacesImprovisation, ultimately, is about having trust: in partners, in communication, in processes, in the environment and one’s own ability to deal with it all. For me, there is a irresolvable personal conflict between being drawn to unpredictable situations and the feeling of doubt–of being ill-prepared or overwhelmed.In my concept of improvisation, openness regarding place and space is fundamental–for my imagination, for taking a position and a perspective, for developing a form of communication. Noises in all forms are invited to join in. @ EchoraumSechshauserstraße 66, 1150 Wien Radio ORF Ö1 Sound Art: Zeit-Ton features our research project Spirits in Complexity in their series “Der Wert der Arbeit” (the value of work): “Wenn Instrumente zu Mitspielern werden – Kreative Arbeitsteilung im Bereich der elektronischen Musik” Im Bereich der elektronischen Musik betrachten die Musiker:innen ihre Instrumente oft als Mitspieler, die aktiv am musikalischen Entstehungsprozess mitwirken. Dabei wird den diversen elektronischen Gerätschaften gerne eine Eigenwilligkeit zugeschrieben, der man derzeit in dem künstlerischen Forschungsprojekt “Spirits in Complexity – Making kin with experimental music systems”, eine Kooperation zwischen der mdw (Artistic Research Center) und der Johannes Kepler Universität Linz (Institute of Computational Perception), auf die Spur zu kommen versucht. 8. November 2024, 23:03, Ö1 Sound Art: Zeit-Ton In the context of the Spirits in Complexity artistic research research project, we conduct a three-day workshop with internal and public sessions.A substantial part of the research project deals with complex algorithmic technology, such as AI. Our cooperation partners at KTH, André Holzapfel and Bob Sturm have acquired very substantial expertise in this field with their projects in the last years, especially regarding questions of ethics.Further guests from the science domain are Ulrike Kuchner (University of Nottingham) and Jan Schlüter (Johannes Kepler University Linz).As invited artists, we have Bonnie Jones and Anna Lindenbaum (NAMES ensemble). In our sessions, we would like to highlight the following points: “Making kin” as in human interfacing with complex music systems, especially abstract (AI) models / multimodal aspects (i.e., apart from text / LLM). E.g., prompt engineering. Aspects of “identity” in AI technology (architecture, training data, data curation, persona design, “cleaning”, etc.), in order to shed some light on the “spirits” notion / vs. statistics/computation. A closer look into various “magic strategies” in the practice with AI, e.g. adversarial attacks, but potentially also others (“tricks of the trade”), unorthodox/subversive approaches Public program:Thu 7.11. 17:30–19:30 @ mdw Klangtheater – Short presentations of current project state (Thomas Grill, Angélica Castelló, Patrik Lechner, Hui Ye, Arthur Flexer, Marco Döttlinger)Thu 7.11. 20:00–21:30 @ mdw Klangtheater – Concert with the Black Box Music quartet and BonnieJonesFri 8.11. 19:00–22:00 @ Cafe am Heumarkt – Concert with Der Küchenchef mit Der Onkel Klein / Ye Hui / Marco Döttlinger + Anna Lindenbaum, with installations by Patrik Lechner and Angélica Castelló"
