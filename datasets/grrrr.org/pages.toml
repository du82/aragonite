["https://grrrr.org/research"]
title = "Research – grrrr.org"
full_description = "The analysis and extension of the human sensory and expressive capabilities as well as their abstraction and reinterpretation using theoretical considerations, artistic strategies and technological means are in the focal point of my research and development activities. I firmly believe in the success of non-conformist and non-incremental approaches in science. To this effect, problem-solving in scientific domains can be informed by the appraisal of failure and “illogical” creative processes involving lateral thinking, to potentially overcome functional fixedness, or to uncover shared and tacit knowledge. Fundamental research as well as cutting-edge applied research and development go together hand in hand. Areas within Artificial Intelligence, as Machine Listening and Machine Learning, including Deep Neural Networks, and areas of perception psychology and interaction research merge with media informatics and practical artistic application for the development of music software and electronic instruments. The cooperation with local and international experts in arts and science and the continuous exchange in expert forums as academic conferences, publications and informal platforms goes as a matter of course. We are not students of some subject matter, but students of problems. And problems may cut right across the borders of any subject matter or discipline. (Karl Popper, 1963) → Scientific publications → Research projects → Software"
