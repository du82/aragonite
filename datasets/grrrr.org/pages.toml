["https://grrrr.org/drthesis-2012"]
title = "Perceptually informed organization of textural sounds – grrrr.org"
full_description = "My dissertation in the field of Sound and Music Computing was supervised by Gerhard Eckel (Institute of Electronic Music and Acoustics, University of Music and Performing Arts Graz, Austria) and Gerhard Widmer (Department of Computational Perception, Johannes Kepler University Linz, Austria). The bulk of the work was done at the Austrian Research Institute for Artificial Intelligence (OFAI), in the context of two funded research projects: “Towards automatic annotation of electro-acoustic music” and “Audiominer – Mathematical signal analysis and modeling for manipulation of sound objects”. Additional funding came from the Univision:2 initiative by the University of Music and Performing Arts Vienna, Austria and CO-ME-DI-A (partnering institution: Institute of Electronic Music and Acoustics, University of Music and Performing Arts Graz). The topics explored in the thesis have largely been inspired by artistic projects developed in parallel, which qualifies the work as practice-led. Grill T.: Perceptually informed organization of textural sounds, Doctoral thesis, University for Music and Performing Arts Graz, Austria, June 2012 Abstract in English: This thesis researches practice-motivated organization of digital audio in the context of sound-based music, including modeling, structuring, characterization, and visualization. It is based on two main keystones: first, the perceptual orientation of those techniques, and second, the focus on textural sound material. I propose a model for the compact representation of textural sound, incorporating psychoacoustically informed timbral and micro-temporal aspects. A simple distance function supports the application of algorithms for search and retrieval, and clustering and classification. This technique is demonstrated in the context of an artistic audiovisual installation. Utilizing this model, I explore structure discovery in digital audio, covering segmentation into slices of coherent content and semi-automatic identification of representative sound materials. These techniques are useful for quickly surveying audio data, or for preprocessing musical material. The method is evaluated against examples of music annotation for two well-known works of electroacoustic music. A central topic of the thesis is the inquiry into perceptually meaningful descriptions of textural sounds. The repertory grid interview technique has been used to elicit bipolar personal constructs representing relevant characteristics. A subsequent large-scale online survey has been conducted to refine and evaluate those descriptions. Building on these findings, I have developed computable audio descriptors capable of measuring the most significant of the previously elicited perceptual qualities. The descriptors have been tuned using results of the previous survey to match human perception targeting either for individual accuracy or for mutual independence. Finally, I propose a visualization strategy for textural sounds described by the same perceptual qualities. The intuitive, map-like appearance is appropriate for screen-based sound browsing interfaces. Its suitability has been verified through another large-scale online survey. A prototype online sound browser application has been developed for the purpose of illustration. Abstract in German: Diese Dissertation untersucht die praxisorientierte Organisation von digitalen Klängen in klangbasierter (sound-based) Musik, in Bezug auf Modellierung, Strukturierung, Charakterisierung und Visualisierung. Sie basiert auf zwei Grundpfeilern: einerseits der Wahrnehmungsorientierung dieser Techniken, und andererseits dem Fokus auf texturhaftem Klangmaterial. Zunächst schlage ich eine Methode für die kompakte Modellierung von Texturklängen vor, die psychoakustisch informierte spektrale als auch mikro-zeitliche Aspekte berücksichtigt. Ein einfaches Distanzmaß unterstützt die Anwendung von Algorithmen für Suche und Retrieval, sowie Clustering und Klassifikation. Die Methode wird im künstlerischen Kontext als Bestandteil einer audiovisuellen Installation demonstriert. Unter Verwendung dieses Modells untersuche ich Verfahren zur Strukturerkennung in digitalem Klang, konkret die Segmentierung in Stücke kohärenten Inhalts und die halb-automatische Erkennung von repräsentativen Klangmaterialen. Diese Techniken sind nützlich, um sich schnell einen Überblick über Audiodaten verschaffen zu können, oder auch zur Aufbereitung von musikalischem Material. Die Verfahren werden im Vergleich mit zwei beispielhaften Annotationen von bekannten Werken elektroakustischer Musik erprobt. Die Ermittlung von wahrnehmungsorientierten Beschreibungen texturhafter Klänge bildet ein zentrales Thema der Arbeit. Die Repertory Grid Interviewtechnik wurde eingesetzt, um bipolare persönliche Konstrukte ausfindig zu machen, die verschiedene relevante Klangeigenschaften bezeichnen. Anschließend wurden diese Beschreibungen mit Hilfe einer groß angelegten Online-Umfrage weiter verfeinert und evaluiert. Aufbauend auf diesen Ergebnissen wurden berechenbare Audio-Deskriptoren entwickelt, welche die signifikantesten der zuvor ermittelten Beschreibungen abbilden. Um der menschlichen Wahrnehmung zu entsprechen, wurden diese Deskriptoren mit Hilfe von Ergebnissen der vorigen Umfrage optimiert, mit einem Fokus entweder auf individuelle Genauigkeit, oder auf Trennschärfe zwischen verschiedenen Qualitäten. Schließlich stelle ich eine Visualisierungsstrategie für Texturklänge vor, die durch die selben wahrnehmungsorientierten Qualitäten gelenkt wird. Die intuitive, landkartenartige Darstellung eignet sich zum Erkunden von einzelnen Klängen und Klangsammlungen mit Hilfe von bildschirmbasierten Browser-Interfaces. Ihre Tauglichkeit wurde durch eine weitere groß angelegte Online-Umfrage belegt. Zur weiteren Veranschaulichung wurde ein prototypischer Online-Klang-Browser entwickelt. The main chapters of the thesis are derived from individual published research papers: Grill, T. (2010). Re-texturing the sonic environment. In Proceedings of the 5th Audio Mostly Conference (AM ’10), pp. 6:1–6:7, New York, NY, USA. Klien, V., Grill, T., and Flexer, A. (2012). On automated annotation of acousmatic music. Journal of New Music Research, Volume 41, Issue 2, pp. 153-173. Grill, T., Flexer, A., and Cunningham, S. (2011). Identification of perceptual qualities in textural sounds using the repertory grid method. In Proceedings of the 6th Audio Mostly Conference (AM ’11), pp. 67–74, New York, NY, USA. Grill, T. (2012). Constructing high-level perceptual audio descriptors for textural sounds. In Proceedings of the 9th Sound and Music Computing Conference (SMC 2012), pp. 486-493, Copenhagen, Denmark. Grill, T. and Flexer, A. (2012). Visualization of perceptual qualities in textural sounds. In Proceedings of the International Computer Music Conference (ICMC 2012), pp. 589–596, Ljubljana, Slovenia. The implementation of the algorithms used methods detailed in two additional joint papers: Velasco, G. A., Holighaus, N., Dörfler, M., and Grill, T. (2011). Constructing an invertible Constant-Q transform with nonstationary Gabor frames. In Proceedings of the 14th International Conference on Digital Audio Effects (DAFx 11), pp. 93–99, Paris, France. Holighaus, N., Dörfler, M., Velasco, G. A., and Grill, T. (2012). A framework for invertible, real-time constant-Q transforms., IEEE Transactions on Audio, Speech and Language Processing, Volume 21, Issue 4, pp. 775-785, 2013."
