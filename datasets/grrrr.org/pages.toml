["https://grrrr.org/arts"]
title = "Arts – grrrr.org"
full_description = "The sensual interaction of humans with their environment, the relationship between nature and artifact and their gradual entanglement are central themes of Grill’s artistic work. Electroacoustic and multimedia compositions, as well as the formulation of a characteristic sonic language within “musicking” and improvisation represent approaches using audible media; interventions and installations integrating visual media and sculptural elements extend the sensory spectrum. Additional focus is on research-oriented projects in cooperation with artists of most varied disciplines – by constituting frontier crossings these stimulate the continuous questioning and widening of the own perception and methodology. Performance activities as an interpreter on drums and electronic instruments in composed contemporary music and in structural and free improvisation. Numerous public appearances, premieres of new pieces. (Founding) member of a number of fixed ensembles such as the Vienna Noise Orchestra, X-String-Quartett, UNO Ensemble, Fruitmarket Gallery, Low Frequency Orchestra, los autodisparadores, gxg. Instrumentalist in many ad-hoc constellations. Cooperation with composers and musicians of most varied stylistic orientations, among those are members of the Vienna symphonic orchestra, the Vienna radio symphony orchestra and Klangforum to also Trio Exklusiv, Polwechsel and Fuckhead — Katharina Klement, Wolfgang Mitterer, Burkhard Stangl, Volkmar Klien, Hannes Löschel, Manon Liu Winter, Wolfgang Reisinger, Thomas Lehn, Christian Wolfarth, Lucia Mense, Robyn Schulkowsky, Didi Bruckmayr, Gerald Preinfalk, Andreas Lindenbaum, Angélica Castelló, Maja Osojnik and many others. Interaction with dance, poetry, experimental theater, film and real-time video, as well as urban und rural environment. → Artistic projects → Publications, CDs, DVDs → Audio and video excerpts"
