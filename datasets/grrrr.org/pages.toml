["https://grrrr.org/tag/machine-perception"]
title = "Machine Perception – grrrr.org"
full_description = "Radio ORF Ö1 Sound Art: Zeit-Ton features our research project Spirits in Complexity in their series “Der Wert der Arbeit” (the value of work): “Wenn Instrumente zu Mitspielern werden – Kreative Arbeitsteilung im Bereich der elektronischen Musik” Im Bereich der elektronischen Musik betrachten die Musiker:innen ihre Instrumente oft als Mitspieler, die aktiv am musikalischen Entstehungsprozess mitwirken. Dabei wird den diversen elektronischen Gerätschaften gerne eine Eigenwilligkeit zugeschrieben, der man derzeit in dem künstlerischen Forschungsprojekt “Spirits in Complexity – Making kin with experimental music systems”, eine Kooperation zwischen der mdw (Artistic Research Center) und der Johannes Kepler Universität Linz (Institute of Computational Perception), auf die Spur zu kommen versucht. 8. November 2024, 23:03, Ö1 Sound Art: Zeit-Ton KLANGMANIFESTE More than networks – Knotenpunkte in der Klangkunst In der Überzeugung, dass Kunst niemals im luftleeren Raum entsteht, sondern immer ein synergetischer Prozess aus unzähligen Einflüssen, Anknüpfungen an Bestehendes und Nicht-Eigenes ist, widmen wir die Klangmanifeste 2024 dem Thema der Knotenpunkte in der Klangkunst: den flüchtigen und festen Verbindungen und deren Manifestationen – zwischen Mensch und Mensch, zwischen Mensch und Material, zwischen Mensch und Maschine usf. Wir stellen zwischenmenschliche Kollaborationen in der Klangkunst der Kooperation zwischen Mensch und Maschine gegenüber und miteinander in Verbindung. Day 3 – 17. April:19:30 Digital Doppelgänger | Ivar Roban Križić20:30 Dirty spaces – Entangling | Thomas Grill & Ivar Roban Križićanschließend: Talk mit den Künstlern Die Performance „Entangling“ arbeitet mit akustischen Feedbacks und mittels eines AI-Widerparts, der sich aus konkretem Klangmaterial aus Field recordings speist. Die Domänen durchdringen einander und verschränken den Raum der Aufführung und die externen Räume, aus denen die Field Recordings stammen. Die AI-Komponente ist ein samplebasierter Synthesizer, der zuhört und sich einbringt, bisweilen imitierend, bisweilen kontrastierend, oder auch disruptiv. Aus dem Wechselspiel entsteht ein komplexes Netzwerk aus klanglich-inhaltlichen Assoziationen, das während der Performance mit und gegen den AI-Gegenspieler entwickelt wird."
