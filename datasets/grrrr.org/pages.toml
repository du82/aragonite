["https://grrrr.org/lfo"]
title = "Low Frequency Orchestra – grrrr.org"
full_description = "Free and structural improvisation Angélica Castelló – recorders, devices Maja Osojnik – recorders, voice, electronics Matija Schellander – double bass Thomas Grill – digital sounds Alfred Reiter – sound engineering until 2010 also with: Herwig Neugebauer – double bass Mathias Koch – drums Releases: Low Frequency Orchestra plays Robert Lettner: Das Spiel vom Kommen und Gehen (2011, DVD) Low Frequency Orchestra & Wolfgang Mitterer: MOLE (2010, CD) V/A HOTEL PUPIK 99-09 (2010, 2 CD) Low Frequency Orchestra: S (2008, CD) V/A unerhört III (2006, CD) More at lfo.at or bandcamp. Low Frequency Orchestra, 2011 The Low Frequency Orchestra was formed in Vienna by Angelica Castello (recorders, devices), Thomas Grill (digital sounds), Maja Osojnik (recorders, voice, electronics) and Matija Schellander (double bass) who form the core of the ensemble. They have been joined by semi-permanent members Mathias Koch (drums) and Herwig Neugebauer (double bass) and have performed with guests including Martin Siewert (e-guitar, electronics), George Cremaschi (double bass), Susanna Gartmayer (bass clarinet), Bernhard Breuer (drums) and Michaela Grill (video). Sound design of all shows is supervised by Alfred Reiter. The ensemble has played many shows of free non-idiomatic improvised music under the title “CUT” – the only rule being that the music should have the structural quality of compositions with an emphasis on rapidly changing sections. The CD “S” is a documentation of this concept. It has been recorded in a series of four live-recording sessions at the Echoraum Vienna in 2006 and released by Einklang Records in 2008. Low Frequency Orchestra at Echoraum, 2006 (photo by Catherine Ludwig) In 2006 the Low Frequency Orchestra also collaborated with the media artist Martin Pichlmair to create an interpretation of artist Robert Lettner’s graphic scores “Das Spiel vom Kommen und Gehen” (“The Coming and Going Show“). The scores consist of carefully arranged colored strips that have emerged as a byproduct of one of Robert Lettners works of art in 1982. The piece has been released by the University of Applied Arts Vienna in a hand numbered limited edition DVD with an extensive booklet and triple-channel video in 2011. A collaboration with Wolfgang Mitterer playing organ started in 2007 with a live recording at the Radiokulturhaus Vienna. This recording served as a framework for the eponymous main piece of the CD “Mole” (chmafu nocords, 2010). During several rounds at the recording studio the different parts were examined, distilled, equilibrated and, through overdubbing, enriched with new instrumental sound material. Emulating scalpel and stethoscope, the musical structures were investigated, acoustic layers revealed and new perspectives developed. In this way, bit by bit, a newly shaped sculpture emerged. The main piece is introduced by five electro-acoustic miniatures, designed by five different members of the Low Frequency Orchestra. These are meant to clarify the individual approaches of the instrumentalists and, as an exposition, emphasize significant facets of the various voices weaved into the ensemble sound that follows. In 2011 the Low Frequency Orchestra will be featured on an upcoming CD with compositions by Maja Osojnik, named “Songs from Mortagapenija”. For recordings of this project the ensemble has been joined by Maria Gstättner on bassoon, Michael-Bruckner Weinhuber on guitar and Burkhard Stangl on guitar and vibraphone. New things often emerge through a quivering aggregation of people, who, while aware of their attraction, are yet incapable of defining it. The utopian potential hidden in this coalescence can – in the case of (improvising) musicians – only be tapped by gathering, unwrapping the instruments and starting to play. A kind of „improvisation without history“: The emerging sound configurations can become the „urtext“ of a new ensemble and thereby constitute the beginning of a new musical entity. Whenever the Low Frequency Orchestra, which was founded in 2003, enters the stage, a fascinating journey through the orbit of sounds begins. Here you meet an ensemble that forms a musical organism precisely through the emphasis on individuality and its transcendence, engaging the listener with an organic music created in the collective. The Low Frequency Orchestra, living up to its name, pays ribute to low sounds with noble honor. Four notedly bass instruments – 2 Paetzold contrabass recorders, 2 double-basses – define the dark, melodious terrain. The two flutists Angélica Castelló and Maja Osojnik, both originally at home with Renaissance and Baroque music, play an exceptionally unique role. They are committed (fortunately they are not alone in this endeavor) to blast recorders out of their often ascribed contexts as instruments for preschoolers or with an early music pathos, instead exploring the multifarious potential of this instrument, thereby integrating it into contemporary music forms. Unwanted, unloved, and unsuitable for classical music, recorders seem to be experiencing a new prime in contemporary music and improvisation. (This can also serve to show the proximity of early music and art music of the 20th and 21st century. It is not a coincidence that one of the two best contemporary lute players, Paul Odette, originally mauled the electric guitar.) The two double-basses, mastered with virtuosity by Matija Schellander and Herwig Neugebauer, prove themselves to be congenial partners to the low flutes. Through the subtle utilization of percussion (Matthias Koch) and intricate use of electronics (Thomas Grill), together with an occasional insertion of high flutes, the deep sounds are mirrored dialectically from time to time, the high frequencies pointing intuitively to their deep siblings. The deepness unlocks by integrating the high tones. In spite of the complexity, there is always an etherealness; despite the fragility of the single elements, a striking coherence emerges. All these components, not least the vibrancy of their stage performance, pronounce the Low Frequency Orchestra one of the most remarkable and noteworthy improvisation ensembles in the country. Franco Evangelisti and his composition-improvisation group, „Nuova Consonanza“, dreamt of an improvisation-based, highly artificial art music created in an egalitarian manner. The Low Frequency Orchestra realizes this in the most elegant way. Burkhard Stangl, August 2005 (Translation to English by Lea Rennert)"
