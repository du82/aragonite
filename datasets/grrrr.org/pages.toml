["https://grrrr.org/2024/10/26/spirits-in-complexity-workshop-nov-2024"]
title = "Spirits in Complexity Workshop, November 7–9 – grrrr.org"
full_description = "In the context of the Spirits in Complexity artistic research research project, we conduct a three-day workshop with internal and public sessions.A substantial part of the research project deals with complex algorithmic technology, such as AI. Our cooperation partners at KTH, André Holzapfel and Bob Sturm have acquired very substantial expertise in this field with their projects in the last years, especially regarding questions of ethics.Further guests from the science domain are Ulrike Kuchner (University of Nottingham) and Jan Schlüter (Johannes Kepler University Linz).As invited artists, we have Bonnie Jones and Anna Lindenbaum (NAMES ensemble). In our sessions, we would like to highlight the following points: “Making kin” as in human interfacing with complex music systems, especially abstract (AI) models / multimodal aspects (i.e., apart from text / LLM). E.g., prompt engineering. Aspects of “identity” in AI technology (architecture, training data, data curation, persona design, “cleaning”, etc.), in order to shed some light on the “spirits” notion / vs. statistics/computation. A closer look into various “magic strategies” in the practice with AI, e.g. adversarial attacks, but potentially also others (“tricks of the trade”), unorthodox/subversive approaches Public program:Thu 7.11. 17:30–19:30 @ mdw Klangtheater – Short presentations of current project state (Thomas Grill, Angélica Castelló, Patrik Lechner, Hui Ye, Arthur Flexer, Marco Döttlinger)Thu 7.11. 20:00–21:30 @ mdw Klangtheater – Concert with the Black Box Music quartet and BonnieJonesFri 8.11. 19:00–22:00 @ Cafe am Heumarkt – Concert with Der Küchenchef mit Der Onkel Klein / Ye Hui / Marco Döttlinger + Anna Lindenbaum, with installations by Patrik Lechner and Angélica Castelló"
year_published = 2025
