["https://grrrr.org/study-interactive_electronic_instruments"]
title = "Individual study of Interactive electronic instruments – grrrr.org"
full_description = "The Austrian university system bears a really interesting, but hardly known feature: The possibility to design one’s personal, so called individual study. With considerable practical experience in arts and sciences and the will to finally achieve an academic grade I was unhappy with the prospect of attending a university study not fully in the line with my interests. Hence I decided to design my own study of “Interactive electronic instruments”, hosted by the University of Music and Performing Arts Vienna. In order to conform to the Bologna process I had to design separate bachelor and master studies. The bachelor and master studies combined courses in the domains of media informatics (at the Technical University Vienna), mathematics, physics and electronics (at Johannes-Kepler University Linz/Austria), artificial intelligence and cognitive science (at the Medical University Vienna), media arts (at the University of Applied Arts, Vienna) and computer music, electronic media and sound engineering (at the University of Music and Performing Arts Vienna). Because of having attended many of the courses prior to formally inscribing my individual studies I was able to underrun the nominal study duration of 6+4 semesters considerably. I finally graduated with the bachelor theses “Elektromagnetische Kammermusik” and “Zur Gestaltung des elektronischen Teils der Komposition ‘granular’ von Katharina Klement”, and with my master thesis “Two-dimensional gesture mapping for interactive real-time electronic music instruments”, in addition to six musical works. As information on this kind of study is sparse, I’m happy to disclose the several documents necessary for the application process: the description and detailed curriculum of the bachelor study, as well as the description and detailed curriculum of the subsequent master study (all in German). Be aware that many of the courses listed in my curricula may not be existent any longer."
