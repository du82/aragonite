title = "Acousmatic – grrrr.org"
full_description = "with loudspeaker orchestras from Belgium, Fribourg, Vienna and the Chuchchepati Orchestra with Bernhard Zitz, Thomas Grill, Katharina Klement, Dimitri Coppe, Patrick Kessler, Elvin Brandhi, Jocelyn Raphanel, Aurélie Emery, Elischa Heller, Ellen Preuss, Fabian Lanzmaier, Luz Gonzalez, Jonas Hammerer, Emanuel Hohl, Remy Rufer, Miriam Jochmann Raus aus dem Januarloch, rein in den Lautsprecherwald! Gemeinsam mit dem Chuchchepati Orchestra laden wir die Lautsprecherorchester Belgien und Fribourg sowie das ELAK Wien zum zweiten Gipfeltreffen der Lautsprecherorchester ein. Während vier Tagen wird das Palace zum akustischen Objekt umgestaltet: Die unzähligen Lautsprecher der jeweiligen Lautsprecherorchester werden verkabelt, im Raum verortet und auf ihre Eigenheiten geprüft. Mit historischen akusmatischen Konzerten, Echtzeit-Kompositionen von Gastmusiker*innen, Konzerten, installativen Stücken und Vorträgen über akusmatische Musik öffnet das ehemalige Kino seine Türen für ein zweitägiges Festival. Wir können euch versprechen: so viele eingesetzte Lautsprecher auf so kleinem Raum gab es wohl selten. Herzlich willkommen im Kabelsalat! @ PalaceBlumenbergplatz, St. Gallen10.+11.1.2025 My acousmatic composition Points of View will be presented at the electroacoustic project, a concert series specifically for loudspeaker music. Check out the full program. TAUSEND.FARBEN.KLANG II mini festival October 8-10, 2011 at 9pm Prechtlsaal, TU Wien, Eingang Resselpark Karlsplatz 13, 1040 Wien/Austria"
