["https://grrrr.org/tag/improvisation"]
title = "Improvisation – grrrr.org"
full_description = "Improvisation in Word, Thought, and Action Program:Thursday, December 5, 7pm: On ResearchCharlotta Ruth: Question SpaceThomas Grill: Dirty SpacesFriday, December 6, 7pm: On New MusicOlivia De Prato: Improvisation Inspired by the Environment and Field RecordingsDaniel Riegler: The Sound of Studio DanSaturday, December 7, 7pm: On PedagogyMaria Gstättner: Opening, Holding and Letting Go of SpacesPeter Herbert: How Did I Learn/Study and Possibly Teach (Can One??) Free Improv Thomas Grill: Dirty SpacesImprovisation, ultimately, is about having trust: in partners, in communication, in processes, in the environment and one’s own ability to deal with it all. For me, there is a irresolvable personal conflict between being drawn to unpredictable situations and the feeling of doubt–of being ill-prepared or overwhelmed.In my concept of improvisation, openness regarding place and space is fundamental–for my imagination, for taking a position and a perspective, for developing a form of communication. Noises in all forms are invited to join in. @ EchoraumSechshauserstraße 66, 1150 Wien For many years, the Institut 5haus association has been organizing the “Noche de los Muertos” in collaboration with echoraum. This event is inspired by the Mexican tradition of inviting our deceased friends to celebrate life, death and the transition between the two with us. Of course, our “Noche de los Muertos” also includes an altar and the most experimental and eclectic music and sounds. Lineup:Samo Kutin & Pascal BattusLucie Vítková / Luc Vitk: Moonwalker (2024)Low Frequency Orchestra: Angélica Castelló (recorders, devices), Thomas Grill (digital sounds), Maja Osojnik (recorders, voice, electronics) and Matija Schellander (double bass) with guests Christian Reiner (voice), Daniel Lercher (bass clarinet), Sara Zlanabitnig (flute) Noche de Werner Freitag, 1. November 2024 · 18:00 Uhr@ EchoraumSechshauserstraße 66, 1150 Wien On the last weekend of September 2024, the third OTTOsonics Festival will once again host and present diverse immersive sound works and performances with and by national and international artists. This year the program specifically sheds light on live, multi-instrumental acts amplified by the OTTOsonics multichannel systems. My composition mas voz is about strolling while listening and the identities of the surroundings, anecdotal memories and one’s own personality, which enter into a sonic/vocal conversation. The piece is performed live and has site-specific components that are adapted to the environment of each performance. The composition was made possible by the Austrian State Scholarship for Composition of the BMKOES. September 28, 18:00Alter Bauhof, Rodlstraße 19, 4100 Ottensheim"
