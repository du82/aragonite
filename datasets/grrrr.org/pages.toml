["https://grrrr.org/research/software"]
title = "Software – grrrr.org"
full_description = "Extension packages (external objects and libraries) for Pure Data and Max/MSP flext – C++ development layer for Pure Data and Max The software library flext represents a uniform programming interface for the popular modular real-time audio systems Max and Pure Data. Flext supports the development of extensions (plug-ins) for those systems, independent of the underlying operating system, be it Windows, MacOS or linux. Facilitated by its open-source-ness flext is being used internationally, and has also been commercially licensed by renowned institutions. The systems antescofo (Music representations team/IRCAM), Sound Design Toolkit SDT (Università di Verona), Soundspotter (Dartmouth), mootcher (freesound.org/Universitat Pompeu Fabra) and many more are based on flext. xsample – Extended sample objects for Pure Data and Max This library for Max and Pure Data bundles very efficient objects for convenient recording and playback of sampled sounds. It represents a popular fundament for loop-based and granular-synthesis software instruments. py/pyext – Python scripting objects for Pure Data and Max This library enables embedding the omnipresent universal programming language Python in the framework of Max and Pure Data. This way many tasks that are difficult to implement in those systems can be realized much more efficiently. Python features a multitude of extension modules of all kinds that can now also be used within Max and Pure Data. VASP modular – Vector assembling signal processor for Pure Data and Max This extensive compilation of sound-processing objects enables the (within the Max and Pure Data environments) unusual but often desirable non-realtime handling of audio data – comparable to the CDP (Composers Desktop Project) – for algorithmic composition and complex spectral and granular sound processing tasks. pool – Hierarchical data storage for Pure Data and Max The hierarchical data base object pool enables easy and efficient management of varied data items. vst~ – VST plugin host for Pure Data This extension object enables the use of effect and instrument plug-ins adhering to the widely used VST standard within Pure Data. dyn~ – Dynamic object management for Pure Data This extension object implements convenient management of dynamical program structures for Pure Data. absattr – Patcher attributes for Pure Data This extension object implements easy handling of patcher arguments (Jitter-style attributes) for Pure Data. clk – Syncable clocking objects for Pure Data and Max This library implements a number of objects for highly precise and persistently stable timing, e.g. for the control of long-lasting sound installations or other complex time-related processes. hr – High resolution math library for Pure Data and Max This library implements a large set of mathematical operations (both for messages and signals) with emulated double floating-point precision. zconf – Zeroconfig networking objects for Pure Data and Max This library implements the registration and browsing of services in local networks. The constitution of network connections (e.g. for the transmission of control data using Open Sound Control) becomes thus much more convenient and robust. constantq~ – Constant-Q spectral analysis This object spectrally analyzes an audio stream for defined frequency bands. It can be seen as an optimized implementation of a band pass filterbank. wmangle – Managing OS windows for Pure Data and Max This extension object allows manipulation of arbitrary operating system windows (e.g. 3rd party plugin or patcher windows) from within the Pure Data or Max environment. It is not actively maintained any longer, but still widely used. idelay~ – Interpolating delay line for Pure Data and Max The functionality of this extension object can also be implemented using native objects of the Pure Data and Max systems. Hence its use is not encouraged – its source code can, however, serve as an example for flext-based audio externals. Various other software publications UPP – Universal Polyphonic Player for Pure Data NSGT – Non-stationary Gabor (and Constant-Q) transform module for Python cq2midi – Polyphonic MIDI notes from audio for Pure Data purehuff – A puristic Huffman encoding module for Python Repositories Repository for binaries of the above packages Subversion source code repository Github source code repository Donations Please donate any small or large amount to encourage maintenance and further development. I’m even happier about examples of artwork done by the use of my software. Some 3rd party projects using my software Richard Thomas: Electro-acoustic Tools (EAT): High-Level Abstractions for Audio Manipulation and Spatialisation, Proceedings of the 4th Pure Data convention, Weimar, 2011. Ivica Ico Bukvic et al.: munger1~ resp. DISIS_munger~ Spencer Russell: gendy~ Constance G. Baltera, Sara B. Smith, Judy A. Franklin: Probabilistic Interactive Installations, FLAIRS Conference 2007: pp.553-558 Edgar J. Berdahl, Nelson Lee and Julius O. Smith III: REALSIMPLE – STK for Pd Percussa.com Audiocubes Casal, D P, and D Morelli: Remembering the Future: An Overview of Co-Evolution in Musical Improvisation, in Proceedings of International Computer Music Conference, 1 (2007) 200-206 Nicolas Montgermont: msd Jorn Lemon / freesound.org: Mootcher Francois-Eudes Chanfrault: fe.cda Rodrigo F. Cádiz and Gary S. Kendall: Fuzzy Logic Control Tool Kit: Real-time Fuzzy Control for Max/MSP and Pd, Proceedings of the 2006 International Computer Music Conference, New Orleans, LA, 2006. Daniel Pressnitzer and Dan Gnansia: The Audition library for Pure Data: a platform for real-time auditory modelling Stefano Delle Monache et al: Sound Design Toolkit (SDT) Loïc Reboursière et al.: Multimodal Guitar: A Toolbox For Augmented Guitar Performances, Proceedings of the 2010 Conference on New Interfaces for Musical Expression (NIME 2010), Sydney, Australia, 2010 Franklin, J. A. and Last, J., 2006, Emitting Grains of Learning with PD, Proceedings of the Tenth Biennial Symposium on Arts and Technology, March 2006 vinylcontrol~ for Pure Data and Max/MSP Chikashi Miyama: leap motion"
