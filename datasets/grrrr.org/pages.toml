["https://grrrr.org/bird_audio_detection-qmul-2017"]
title = "QMUL Bird Audio Detection Challenge – Winning Submission – grrrr.org"
full_description = "As announced today, my proposal for the Bird Audio Detection Challenge has been identified as the highest scoring solution. The challenge has been organized by the Machine Listening Lab at the Queen Mary University of London. A substantial amount of human-annotated examples was published, allowing the training and tuning of the methods. Contestants had to submit predictions (any birds present or not?) for a large set of audio recordings, each 10 seconds long, originating from a potentially different source than the training data. A typical noisy recording. Are there any birds present?(c) by Dan Stowell and Warblr users, see warblrb10k_public dataset http://grrrr.org/wp-content/uploads/f61e561a-4891-4075-9ef3.mp3 My approach uses deep learning with a modest-sized convolutional neural network (4 convolutional layers with pooling, 2 dense layers, in total about 370k weights), various signal pre-processing techniques (silence/noise trimming, data augmentation by shifting the spectra in time and frequency) and bagging (averaging the predictions of multiple differently initialized models) to improve quality, and pseudo-labeling which helps the classifier to adapt to new conditions. The code can be found at our git repository. At OFAI, we have researched deep learning techniques in machine listening for some years. The special difficulty in this challenge were the greatly varying audio quality of the recordings, the high rate of doubtful annotations and the unknown nature of the evaluation data. The six leading methods came to lie within one percent (at 88-89%) of the performance measure, the area under ROC. In practice, these approaches perform equivalently, with all of them using deep learning techniques. I had reached the 88% mark after only a few days of development, and from that day on could only marginally improve the results. Since all the top submissions are so close together, i suspect this to be a kind of glass ceiling, imposed by the various imperfections of the underlying dataset. I’d like to thank my colleague Jan Schlüter for the fruitful discussions and his hawk eye to find a final bug. The research is supported by the Vienna Science and Technology Fund (WWTF) in the course of our SALSA project. Computing power was kindly donated by Nvidia Corporation. Scores of my submissions to the QMUL Bird Audio Detection challenge."
