["https://grrrr.org/teaching/courses"]
title = "Regular university courses – grrrr.org"
full_description = "Currently running: University of Music and Performing Arts Vienna, Certificate Program in Electroacoustic and Experimental Music — Elektroakustische und experimentelle Musik (electroacoustic and experimental music) 5/6 Lecture and seminar (2 credit hours). Central artistic subject. Relations among material, tools, syntax, form Advanced topics pertaining to music creation: perception, embodiment, context Repertoire of electroacoustic and experimental music Literature review Study trips and guest lectures University of Music and Performing Arts Vienna, Certificate Program in Electroacoustic and Experimental Music — Praktikum Komposition (composition lab) 5/6 Lab (1 credit hour). Central artistic subject. Individual project work Discoursive approach regarding technical or aesthetic preconceptions, fostering new formal and sonic solutions. University of Music and Performing Arts Vienna, Certificate Program in Electroacoustic and Experimental Music — Praktikum Studiotechnik (studio technics lab) 3/4 Lab (1 credit hour). Central artistic subject. Individual project work Special topics of digital audio processing: Algorithmics, embedded computing, technical solutions for installations and performance University of Music and Performing Arts Vienna, Doctor Artium Program — Theory and Practice of Artistic Research 1/2 Lecture/Seminar (2 credit hours). Compulsory subject. This course provides orientation regarding approaches, issues, objectives and methods in artistic research. Subsequently, students will be able to situate their own project in relation to ongoing discourses, and to question their own goals and methods in the context of artistic research in a critical and well-informed way. They will have an overview of current discourses on gender, diversity and intersectionality and apply them to generate relevant and critical artistic research. In order for the qualifications profile of the graduates to be able to attain the necessary competence in relation to gender and diversity, this course will include team teaching with gender studies experts. University of Music and Performing Arts Vienna, Doctor Artium Program — Artistic Research Laboratory 1/2 Seminar/Lab (3 credit hours). Compulsory subject. The laboratories are intended to give all doctoral candidates the opportunity to exchange information about the current status of their research work, to discuss it and cooperate with each other. The content-related analysis in a dialogue between lecturers and students contributes towards an objectivisation of reflection, and contextualises the participants’ own research work. Past: University of Applied Arts Vienna — Ton, Klang und akustische Gestaltung (sound, noise and acoustic design) I/II Seminar and project work (3 credit hours)Compulsory optional subject for the study Media design – trans-media arts and TransArts – trans-disciplinary art. Basics of acoustics and perception Technological basics: Equipment and tools, recording and editing (Cubase, Logic, Ableton Live), interactive systems (Pure Data, Max/MSP), sensorics (arduino) Basics of musical creation: Notation systems, compositorial strategies, staging of sound in space Repertoire of experimental and electroacoustic music Study trips and guest lectures Project work University of Applied Arts Vienna — Digitale Performance (digital performance) I/II Seminar and one-to-one-lessons (2 credit hours)Compulsory optional subject for the study Media design – trans-media arts and TransArts – trans-disciplinary art. Conception and realization of interactive media instruments and installations Interactive systems, high/low tech, the interface between analog and digital Repertoire of experimental media art Active participation in concerts and exhibitions, supervision of diploma projects University of Music and Performing Arts Vienna — Programmieren für Musiker (programming for musicians) I/II Seminar and project work (2 credit hours)Elective course for the diploma study 