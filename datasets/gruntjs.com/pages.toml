["https://gruntjs.com/api/grunt.fail"]
title = "grunt.fail - Grunt: The JavaScript Task Runner"
full_description = "grunt.failFor when something goes horribly wrong. See the fail lib source for more information. The fail API If something explodes (or is about to explode) inside a task, it can force Grunt to abort. See the exit codes documentation for a list of all built-in Grunt exit codes. Note that any method marked with a ☃ (unicode snowman) is also available directly on the grunt object. Just so you know. See the API main page for more usage information. grunt.fail.warn ☃ Display a warning and abort Grunt immediately. Grunt will continue processing tasks if the --force command-line option was specified. The error argument can be a string message or an error object. grunt.fail.warn(error [, errorcode]) If --stack is specified on the command-line and an error object was specified, a stack trace will be logged. This method is also available as grunt.warn. grunt.fail.fatal ☃ Display a warning and abort Grunt immediately. The error argument can be a string message or an error object. grunt.fail.fatal(error [, errorcode]) If --stack is specified on the command-line and an error object was specified, a stack trace will be logged. A beep is emitted on fatal unless the --no-color option is specified. This method is also available as grunt.fatal. Found an error in the documentation? File an issue.APIgruntgrunt.configgrunt.eventgrunt.failgrunt.filegrunt.loggrunt.optiongrunt.taskgrunt.templategrunt.utilOtherInside TasksExit Codes"
