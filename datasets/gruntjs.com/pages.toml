title = "Documentation - Grunt: The JavaScript Task Runner"
full_description = "DocumentationWelcome to the Grunt documentation page. Here you can find helpful resources, links, and information to start using Grunt. The first step to perform to use the tool is to install it on your machine. Getting started If you're new to Grunt's world, we suggest to learn more about our CLI and what actions you need to complete to use Grunt in your project. The best resource for that is our Getting started guide. If you already know what Grunt is and how it works, the next step is to familiarize yourself with the creation of a Gruntfile. A Gruntfile contains the configuration of the tasks you wish to employ. If you are curious to know how it looks like, you can check out our sample. Advanced Once mastered all the basic concepts you might want to create your own Grunt tasks. Our step-by-step guide and the API documentation page will help you in achieving this goal. Grunt helps you ship better projects by automating many tasks. If you feel grateful and want to give something back, the project is always on the outlook for new contributors. To see how you can help, take a look at the Contributing page. Help and support Do you feel lost? We got you covered. Our dedicated F.A.Q. page should give the answers you need. If you can't find what you're looking for, you can search for more support in our Help Resources page. In addition, our community will try to assist you in our #grunt channel on irc.freenode.net. Where to go next? Here's a summary of the documentation pages you can find on this website: Documentation Getting Started Configuring Tasks Sample Gruntfile Creating Tasks Creating Plugins Using the CLI Advanced API Installing Grunt Frequently Asked Questions Project Scaffolding Found an error in the documentation? File an issue.DocumentationGetting StartedConfiguring TasksSample GruntfileCreating TasksCreating PluginsUsing the CLIAdvancedAPIInstalling GruntFrequently Asked QuestionsProject ScaffoldingCommunitySupportHelp ResourcesWho uses 