["https://gruntjs.com/blog/2013-02-18-grunt-0.4.0-released"]
title = "Grunt 0.4.0 released - Grunt: The JavaScript Task Runner"
full_description = "Grunt 0.4.0 releasedPosted on February 18, 2013As of this morning, Grunt v0.4 final is available on npm! For a lengthy writeup on the release, please see @tkellen's article on the Bocoup blog. The Biggest Stuff Grunt no longer ships with built in tasks. They've been extracted into officially maintained, standalone plugins under the grunt-contrib namespace. See the plugin listing on our website for more details. Grunt no longer ships with a binary. In order to get the grunt command, install grunt-cli globally with npm install -g grunt-cli. This package will run any version of Grunt (including 0.3x) after it's been installed locally to your project. The Future Grunt v0.5 will ship with support for a new plugin format called node-task. It defines a stateless, promise-based, event emitting API that doesn't depend on Grunt. It has a real-live spec, and the Grunt team is working with the front-end developer community in the hopes that compliant modules will be compatible with every task runner under the sun. Grunt on If you'd like to know more about Grunt, please read our Getting Started Guide, and check out all of the ways you can configure your tasks, too. Blog Grunt 1.4.0 released Grunt 1.2.0 released Grunt 1.1.0 released Grunt CLI 1.3.0 released Grunt 1.0.0 released Grunt 1.0.0 rc1 released Grunt 0.4.5 released Grunt 0.4.4 released Grunt 0.4.3 released Grunt 0.4.2 released Grunt 0.4.1 released Grunt 0.4.0 released Updating plugins to Grunt 0.4"
