["https://gruntjs.com/project-scaffolding"]
title = "Project Scaffolding - Grunt: The JavaScript Task Runner"
full_description = '''Project Scaffoldinggrunt-init Grunt-init is a scaffolding tool used to automate project creation. It will build an entire directory structure based on current environment and answers to some questions. The exact files and contents created depend on the template chosen along with the answers to the questions asked. Note: This standalone utility used to be built-in to Grunt as the "init" task. See the Grunt Upgrading from 0.3 to 0.4 guide for more information about this change. Installation In order to use grunt-init, you'll want to install it globally. npm install -g grunt-init This will put the grunt-init command in your system path, allowing it to be run from anywhere. Notes: You may need to use sudo or run your command shell as Administrator to do this. Usage Get program help and a listing of available templates with grunt-init --help Create a project based around an available template with grunt-init TEMPLATE Create a project based around a arbitrarily-located template with grunt-init /path/to/TEMPLATE Note that most templates generate their files in the current directory, so be sure to change to a new directory first if you don't want to overwrite existing files. Installing templates Once templates are installed into your ~/.grunt-init/ directory (%USERPROFILE%\.grunt-init\ on Windows) they will be available for use via grunt-init. It's recommended that you use git to clone a template into that directory. For example, the grunt-init-jquery template can be installed like so: git clone https://github.com/gruntjs/grunt-init-jquery.git ~/.grunt-init/jquery Note: if you want to make the template available locally as "foobarbaz" you could specify ~/.grunt-init/foobarbaz while cloning. Grunt-init will use the actual template directory name as it exists inside of the ~/.grunt-init/ directory. A few grunt-init templates are maintained officially: grunt-init-commonjs - Create a commonjs module, including Nodeunit unit tests. (sample "generated" repo | creation transcript) grunt-init-gruntfile - Create a basic Gruntfile. (sample "generated" repo | creation transcript) grunt-init-gruntplugin - Create a Grunt plugin, including Nodeunit unit tests. (sample "generated" repo | creation transcript) grunt-init-jquery - Create a jQuery plugin, including QUnit unit tests. (sample "generated" repo | creation transcript) grunt-init-node - Create a Node.js module, including Nodeunit unit tests. (sample "generated" repo | creation transcript) Custom templates You can create and use custom templates. Your template must follow the same structure as the aforementioned templates. A sample template named my-template would follow this general file structure: my-template/template.js - the main template file. my-template/rename.json - template-specific rename rules, processed as templates. my-template/root/ - files to be copied into the target location. Assuming these files exist at /path/to/my-template, the command grunt-init /path/to/my-template would be used to process the template. Multiple uniquely-named templates may exist in the same directory. Additionally, if you place this custom template in your ~/.grunt-init/ directory (%USERPROFILE%\.grunt-init\ on Windows) it will be automatically available to be used with just grunt-init my-template. Copying files As long as a template uses the init.filesToCopy and init.copyAndProcess methods, any files in the root/ subdirectory will be copied to the current directory when the init template is run. Note that all copied files will be processed as templates, with any {% %} template being processed against the collected props data object, unless the noProcess option is set. See the jquery template for an example. Renaming or excluding template files The rename.json describes sourcepath to destpath rename mappings. The sourcepath must be the path of the file-to-be-copied relative to the root/ folder, but the destpath value can contain {% %} templates, describing what the destination path will be. If false is specified as a destpath the file will not be copied. Also, glob patterns are supported for srcpath. Specifying default prompt answers Each init prompt either has a default value hard-coded or it looks at the current environment to attempt to determine that default value. If you want to override a particular prompt's default value, you can do so in the optional OS X or Linux ~/.grunt-init/defaults.json or Windows %USERPROFILE%\.grunt-init\defaults.json file. For example, my defaults.json file looks like this, because I want to use a slightly different name than the default name, I want to exclude my email address, and I want to specify an author URL automatically. { "author_name": "\"Cowboy\" Ben Alman", "author_email": "none", "author_url": "http://benalman.com/" } Note: until all the built-in prompts have been documented, you can find their names and default values in the source code. Defining an init template exports.description This brief template description will be displayed along with the template name when the user runs grunt init or grunt-init to display a list of all available init templates. exports.description = descriptionString; exports.notes If specified, this optional extended description will be displayed before any prompts are displayed. This is a good place to give the user a little help explaining naming conventions, which prompts may be required or optional, etc. exports.notes = notesString; exports.warnOn If this optional (but recommended) wildcard pattern or array of wildcard patterns is matched, Grunt will abort with a warning that the user can override with --force. This is very useful in cases where the init template could potentially override existing files. exports.warnOn = wildcardPattern; While the most common value will be '*', matching any file or directory, the minimatch wildcard pattern syntax used allows for a lot of flexibility. For example: exports.warnOn = 'Gruntfile.js'; // Warn on a Gruntfile.js file. exports.warnOn = '*.js'; // Warn on any .js file. exports.warnOn = '*'; // Warn on any non-dotfile or non-dotdir. exports.warnOn = '.*'; // Warn on any dotfile or dotdir. exports.warnOn = '{.*,*}'; // Warn on any file or dir (dot or non-dot). exports.warnOn = '!*/**'; // Warn on any file (ignoring dirs). exports.warnOn = '*.{png,gif,jpg}'; // Warn on any image file. // This is another way of writing the last example. exports.warnOn = ['*.png', '*.gif', '*.jpg']; exports.template While the exports properties are defined outside this function, all the actual init code is specified inside. Three arguments are passed into this function. The grunt argument is a reference to grunt, containing all the grunt methods and libs. The init argument is an object containing methods and properties specific to this init template. The done argument is a function that must be called when the init template is done executing. exports.template = function(grunt, init, done) { // See the "Inside an init template" section. }; Inside an init template init.addLicenseFiles Add properly-named license files to the files object. var files = {}; var licenses = ['MIT']; init.addLicenseFiles(files, licenses); // files === {'LICENSE-MIT': 'licenses/LICENSE-MIT'} init.availableLicenses Return an array of available licenses. var licenses = init.availableLicenses(); // licenses === [ 'Apache-2.0', 'GPL-2.0', 'MIT', 'MPL-2.0' ] init.copy Given an absolute or relative source path, and an optional relative destination path, copy a file, optionally processing it through the passed callback. init.copy(srcpath[, destpath], options) init.copyAndProcess Iterate over all files in the passed object, copying the source file to the destination, processing the contents. init.copyAndProcess(files, props[, options]) init.defaults User-specified default init values from defaults.json. init.defaults init.destpath Absolute destination file path. init.destpath() init.expand Same as grunt.file.expand. Return a unique array of all file or directory paths that match the given wildcard pattern(s). This method accepts either comma separated wildcard patterns or an array of wildcard patterns. Paths matching patterns that begin with ! will be excluded from the returned array. Patterns are processed in order, so inclusion and exclusion order is significant. init.expand([options, ] patterns) init.filesToCopy Return an object containing files to copy with their absolute source path and relative destination path, renamed (or omitted) according to rules in rename.json (if it exists). var files = init.filesToCopy(props); /* files === { '.gitignore': 'template/root/.gitignore', '.jshintrc': 'template/root/.jshintrc', 'Gruntfile.js': 'template/root/Gruntfile.js', 'README.md': 'template/root/README.md', 'test/test_test.js': 'template/root/test/name_test.js' } */ init.getFile Get a single task file path. init.getFile(filepath[, ...]) init.getTemplates Returns an object of all the available templates. init.getTemplates() init.initSearchDirs Initialize the directories to search for init templates. template is the location of a template. Will also include ~/.grunt-init/ and the core init tasks within grunt-init. init.initSearchDirs([filename]) init.process Start up the process to begin prompting for input. init.process(options, prompts, done) init.process({}, [ // Prompt for these values init.prompt('name'), init.prompt('description'), init.prompt('version') ], function(err, props) { // All finished, do something with the properties }); init.prompt Prompt a user for a value. init.prompt(name[, default]) init.prompts An object of all the prompts. var prompts = init.prompts; init.readDefaults Read JSON defaults from task files (if they exist), merging them into one data object. init.readDefaults(filepath[, ...]) init.renames The rename rules for the template. var renames = init.renames; // renames === { 'test/name_test.js': 'test/{%= name %}_test.js' } init.searchDirs An array of directories to search for templates in. var dirs = init.searchDirs; /* dirs === [ '/Users/shama/.grunt-init', '/usr/local/lib/node_modules/grunt-init/templates' ] */ init.srcpath Search init template paths for filename and return an absolute path. init.srcpath(filepath[, ...]) init.userDir Returns the absolute path to the user's template directory. var dir = init.userDir(); // dir === '/Users/shama/.grunt-init' init.writePackageJSON Save a package.json file in the destination directory. The callback can be used to post-process properties to add/remove/whatever. init.writePackageJSON(filename, props[, callback]) Built-in prompts author_email Author's email address to use in the package.json. Will attempt to find a default value from the user's git config. author_name Author's full name to use in the package.json and copyright notices. Will attempt to find a default value from the user's git config. author_url A public URL to the author's website to use in the package.json. bin A relative path from the project root for a cli script. bugs A public URL to the project's issues tracker. Will default to the GitHub issue tracker if the project has a GitHub repository. description A description of the project. Used in the package.json and README files. grunt_version A valid semantic version range descriptor of Grunt the project requires. homepage A public URL to the project's home page. Will default to the GitHub URL if a GitHub repository. jquery_version If a jQuery project, the version of jQuery the project requires. Must be a valid semantic version range descriptor. licenses The license(s) for the project. Multiple licenses are separated by spaces. The licenses built-in are: MIT, MPL-2.0, GPL-2.0, and Apache-2.0. Defaults to MIT. Add custom licenses with init.addLicenseFiles. main The primary entry point of the project. Defaults to the project name within the lib folder. name The name of the project. Will be used heavily throughout the project template. Defaults to the current working directory. node_version The version of Node.js the project requires. Must be a valid semantic version range descriptor. npm_test The command to run tests on your project. Defaults to grunt. repository Project's git repository. Defaults to a guess of a GitHub URL. title A human readable project name. Defaults to the actual project name altered to be more human readable. version The version of the project. Defaults to the first valid semantic version, 0.1.0. Found an error in the documentation? File an issue.DocumentationGetting StartedConfiguring TasksSample GruntfileCreating TasksCreating PluginsUsing the CLIAdvancedAPIInstalling GruntFrequently Asked QuestionsProject ScaffoldingCommunitySupportHelp ResourcesWho uses GruntBuilt with Grunt BadgeContributingDevelopment TeamMigration guidesUpgrading from 0.3 to 0.4Upgrading from 0.4 to 1.0'''
year_published = 2025
clearnet = "https://gruntjs.com/project-scaffolding"
