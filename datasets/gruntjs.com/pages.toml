["https://gruntjs.com/blog/2020-07-03-grunt-1.2.0-released"]
title = "Grunt 1.2.0 released - Grunt: The JavaScript Task Runner"
full_description = "Grunt 1.2.0 releasedPosted on July 03, 2020The Grunt team is pleased to announce the release of Grunt 1.2.0. This release is made possible by @vladikoff and contributors: philz - https://github.com/philz Brian Lim - https://github.com/bhldev micellius - https://github.com/micellius and more! Here are the changes: Allow usage of grunt plugins that are located in any location that is visible to Node.js and NPM, instead of node_modules directly inside package that have a dev dependency to these plugins. (PR: https://github.com/gruntjs/grunt/pull/1677) Removed coffeescript from dependencies. To ease transition, if coffeescript is still around, Grunt will attempt to load it. If it is not, and the user loads a CoffeeScript file, Grunt will print a useful error indicating that the coffeescript package should be installed as a dev dependency. This is considerably more user-friendly than dropping the require entirely, but doing so is feasible with the latest grunt-cli as users may simply use grunt --require coffeescript/register. (PR: https://github.com/gruntjs/grunt/pull/1675) Exposes Grunt Option keys for ease of use. (PR: https://github.com/gruntjs/grunt/pull/1570) Avoiding infinite loop on very long command names. (PR: https://github.com/gruntjs/grunt/pull/1697) Dependency updates are also included. You can find Grunt on npm and GitHub. Blog Grunt 1.4.0 released Grunt 1.2.0 released Grunt 1.1.0 released Grunt CLI 1.3.0 released Grunt 1.0.0 released Grunt 1.0.0 rc1 released Grunt 0.4.5 released Grunt 0.4.4 released Grunt 0.4.3 released Grunt 0.4.2 released Grunt 0.4.1 released Grunt 0.4.0 released Updating plugins to Grunt 0.4"
