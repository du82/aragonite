["https://gruntjs.com/blog/2013-03-13-grunt-0.4.1-released"]
title = "Grunt 0.4.1 released - Grunt: The JavaScript Task Runner"
full_description = "Grunt 0.4.1 releasedPosted on March 13, 2013Grunt 0.4.1 is now available from npm. This patch release fixes a number of minor issues that cropped up with the recent release of Node.js v0.10.0, most notably due to changes in the path API. If you want to use the latest version of Node.js in your projects, you should probably update Grunt to ~0.4.1 in the package.json file for those projects. Either way, Grunt still works with Node.js v0.8.x, so you don't need to update if you haven't upgraded to Node.js v0.10.0. In addition to the Node.js v0.10.0 changes, we used this opportunity to fix a number of other small issues, like properly handling multibyte I/O when spawning child processes and ensuring the Gruntfile name is case-insensitive. For a complete list of changes, see the v0.4.0 - v0.4.1 changelog. Blog Grunt 1.4.0 released Grunt 1.2.0 released Grunt 1.1.0 released Grunt CLI 1.3.0 released Grunt 1.0.0 released Grunt 1.0.0 rc1 released Grunt 0.4.5 released Grunt 0.4.4 released Grunt 0.4.3 released Grunt 0.4.2 released Grunt 0.4.1 released Grunt 0.4.0 released Updating plugins to Grunt 0.4"
