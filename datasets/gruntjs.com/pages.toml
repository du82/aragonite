full_description = '''Built with Grunt BadgeDo you use Grunt in a project and want to proudly display that in your project README or on your project website? Now you can with the "Built with Grunt" badge! Using the Badge Just copy the following Markdown code snippet and paste it right underneath the headline in your project README. You can also put it on your project website homepage or footer. [![Built with Grunt](https://gruntjs.com/builtwith.svg)](https://gruntjs.com/) If you need an HTML version, we've got you covered. <a href="https://gruntjs.com/"> <img src="https://gruntjs.com/builtwith.svg" alt="Built with Grunt"> </a> For example... As you can see, the "Built with Grunt" badge is modern, stylish, and has been designed to fit nicely next to all your project's other mini-badges. You can put it first, last, or anywhere in the middle. Have fun! Shout-outs Let us know if you are using the "Built with Grunt" badge by tweeting at @gruntjs. Found an error in the documentation? File an issue.DocumentationGetting StartedConfiguring TasksSample GruntfileCreating TasksCreating PluginsUsing the CLIAdvancedAPIInstalling GruntFrequently Asked QuestionsProject ScaffoldingCommunitySupportHelp ResourcesWho uses GruntBuilt with Grunt BadgeContributingDevelopment TeamMigration guidesUpgrading from 0.3 to 0.4Upgrading from 0.4 to 1.0'''
