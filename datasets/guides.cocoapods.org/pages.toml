["https://guides.cocoapods.org/syntax/podspec.html"]
title = "CocoaPods Guides - Podspec Syntax Reference <span>v1.16.1</span>"
description = "The Dependency Manager for iOS & Mac projects."
full_description = '''SpecificationRoot specificationname Rversion Rswift_versions cocoapods_version authors Rsocial_media_url license Rhomepage Rreadme changelog source Rsummary Rdescription screenshots documentation_url prepare_command static_framework deprecated deprecated_in_favor_of Platformplatform deployment_target Build settingsdependency info_plist requires_arc frameworks weak_frameworks libraries compiler_flags pod_target_xcconfig user_target_xcconfig prefix_header_contents prefix_header_file module_name header_dir header_mappings_dir script_phases File patternssource_files public_header_files project_header_files private_header_files vendored_frameworks vendored_libraries on_demand_resources resource_bundles resources exclude_files preserve_paths module_map Subspecssubspec requires_app_host app_host_name scheme test_spec app_spec default_subspecs Multi-Platform supportios osx macos tvos visionos watchos » Single PageSpecificationA specification describes a version of Pod library. It includes details about where the source should be fetched from, what files to use, the build settings to apply, and other general metadata such as its name, version, and description. A stub specification file can be generated by the pod spec create command. The specification DSL provides great flexibility and dynamism. Moreover, the DSL adopts the convention over configuration and thus it can be very simple: Pod::Spec.new do |spec| spec.name = 'Reachability' spec.version = '3.1.0' spec.license = { :type => 'BSD' } spec.homepage = 'https://github.com/tonymillion/Reachability' spec.authors = { 'Tony Million' => '[email protected]' } spec.summary = 'ARC and GCD Compatible Reachability Class for iOS and OS X.' spec.source = { :git => 'https://github.com/tonymillion/Reachability.git', :tag => 'v3.1.0' } spec.source_files = 'Reachability.{h,m}' spec.framework = 'SystemConfiguration' end Or it can be quite detailed: Pod::Spec.new do |spec| spec.name = 'Reachability' spec.version = '3.1.0' spec.license = { :type => 'BSD' } spec.homepage = 'https://github.com/tonymillion/Reachability' spec.authors = { 'Tony Million' => '[email protected]' } spec.summary = 'ARC and GCD Compatible Reachability Class for iOS and OS X.' spec.source = { :git => 'https://github.com/tonymillion/Reachability.git', :tag => 'v3.1.0' } spec.module_name = 'Rich' spec.swift_version = '4.0' spec.ios.deployment_target = '9.0' spec.osx.deployment_target = '10.10' spec.source_files = 'Reachability/common/*.swift' spec.ios.source_files = 'Reachability/ios/*.swift', 'Reachability/extensions/*.swift' spec.osx.source_files = 'Reachability/osx/*.swift' spec.framework = 'SystemConfiguration' spec.ios.framework = 'UIKit' spec.osx.framework = 'AppKit' spec.dependency 'SomeOtherPod' end Root specificationA ‘root’ specification stores the information about the specific version of a library. The attributes in this group can only be written to on the ‘root’ specification, not on the ‘sub-specifications’. The attributes listed in this group are the only one which are required by a podspec. The attributes of the other groups are offered to refine the podspec and follow a convention over configuration approach. A root specification can describe these attributes either directly of through ‘sub-specifications’. namerequiredThe name of the Pod. Examples:spec.name = 'AFNetworking' versionrequiredThe version of the Pod. CocoaPods follows semantic versioning. Examples:spec.version = '0.0.1' swift_versionsThe versions of Swift that the specification supports. A version of '4' will be treated as '4.0' by CocoaPods and not '4.1' or '4.2'. Note The Swift compiler mostly accepts major versions and sometimes will honor minor versions. While CocoaPods allows specifying a minor or patch version it might not be honored fully by the Swift compiler. Examples:spec.swift_versions = ['3.0'] spec.swift_versions = ['3.0', '4.0', '4.2'] spec.swift_version = '3.0' spec.swift_version = '3.0', '4.0' cocoapods_versionThe version of CocoaPods that the specification supports. Examples:spec.cocoapods_version = '>= 0.36' authorsrequiredThe name and email addresses of the library maintainers, not the Podspec maintainer. Examples:spec.author = 'Darth Vader' spec.authors = 'Darth Vader', 'Wookiee' spec.authors = { 'Darth Vader' => '[email protected]', 'Wookiee' => '[email protected]' } social_media_urlThe URL for the social media contact of the Pod, CocoaPods web services can use this. For example, the @CocoaPodsFeed notifications will include the Twitter handle (shortening the description) if the URL is relative to Twitter. This does not necessarily have to be a Twitter URL, but only those are included in the Twitter @CocoaPodsFeed notifications. Examples:spec.social_media_url = 'https://twitter.com/cocoapods' spec.social_media_url = 'https://groups.google.com/forum/#!forum/cocoapods' licenserequiredThe license of the Pod. Unless the source contains a file named LICENSE.* or LICENCE.*, the path of the license file or the integral text of the notice commonly used for the license type must be specified. If a license file is specified, it either must be without a file extensions or be one of txt, md, or markdown. This information is used by CocoaPods to generate acknowledgement files (markdown and plist) which can be used in the acknowledgements section of the final application. Examples:spec.license = 'MIT' spec.license = { :type => 'MIT', :file => 'MIT-LICENSE.txt' } spec.license = { :type => 'MIT', :text => <<-LICENSE Copyright 2012 Permission is granted to... LICENSE } Supported Keys::type :file :text homepagerequiredThe URL of the homepage of the Pod. Examples:spec.homepage = 'http://www.example.com' readmeThe URL for the README markdown file for this pod version. Examples:spec.readme = 'https://www.example.com/Pod-1.5-README.md' changelogThe URL for the CHANGELOG markdown file for this pod version. Examples:spec.changelog = 'https://www.example.com/Pod-1.5-CHANGELOG.md' sourcerequiredThe location from where the library should be retrieved. Examples:Specifying a Git source with a tag. This is how most OSS Podspecs work.spec.source = { :git => 'https://github.com/AFNetworking/AFNetworking.git', :tag => spec.version.to_s } Using a tag prefixed with 'v' and submodules.spec.source = { :git => 'https://github.com/typhoon-framework/Typhoon.git', :tag => "v#{spec.version}", :submodules => true } Using Subversion with a tag.spec.source = { :svn => 'http://svn.code.sf.net/p/polyclipping/code', :tag => '4.8.8' } Using Mercurial with the same revision as the spec's semantic version string.spec.source = { :hg => 'https://bitbucket.org/dcutting/hyperbek', :revision => "#{s.version}" } Using HTTP to download a compressed file of the code. It supports zip, tgz, bz2, txz and tar.spec.source = { :http => 'http://dev.wechatapp.com/download/sdk/WeChat_SDK_iOS_en.zip' } Using HTTP to download a file using a hash to verify the download. It supports sha1 and sha256.spec.source = { :http => 'http://dev.wechatapp.com/download/sdk/WeChat_SDK_iOS_en.zip', :sha1 => '7e21857fe11a511f472cfd7cfa2d979bd7ab7d96' } Supported Keys::git => :tag, :branch, :commit, :submodules :svn => :folder, :tag, :revision :hg => :revision :http => :flatten, :type, :sha256, :sha1, :headers summaryrequiredA short (maximum 140 characters) description of the Pod. The description should be short, yet informative. It represents the tag line of the Pod and there is no need to specify that a Pod is a library (they always are). The summary is expected to be properly capitalised and containing the correct punctuation. Examples:spec.summary = 'Computes the meaning of life.' descriptionA description of the Pod more detailed than the summary. Examples:spec.description = <<-DESC Computes the meaning of life. Features: 1. Is self aware ... 42. Likes candies. DESC screenshotsA list of URLs to images showcasing the Pod. Intended for UI oriented libraries. CocoaPods recommends the usage of the gif format. Examples:spec.screenshot = 'http://dl.dropbox.com/u/378729/MBProgressHUD/1.png' spec.screenshots = [ 'http://dl.dropbox.com/u/378729/MBProgressHUD/1.png', 'http://dl.dropbox.com/u/378729/MBProgressHUD/2.png' ] documentation_urlAn optional URL for the documentation of the Pod which will be honoured by CocoaPods web properties. Leaving it blank will default to a CocoaDocs generated URL for your library. Examples:spec.documentation_url = 'http://www.example.com/docs.html' prepare_commandA bash script that will be executed after the Pod is downloaded. This command can be used to create, delete and modify any file downloaded and will be ran before any paths for other file attributes of the specification are collected. This command is executed before the Pod is cleaned and before the Pods project is created. The working directory is the root of the Pod. If the pod is installed with the :path option this command will not be executed. Examples:spec.prepare_command = 'ruby build_files.rb' spec.prepare_command = <<-CMD sed -i 's/MyNameSpacedHeader/Header/g' ./**/*.h sed -i 's/MyNameOtherSpacedHeader/OtherHeader/g' ./**/*.h CMD static_frameworkIndicates, that if use_frameworks! is specified, the pod should include a static library framework. Examples:spec.static_framework = true deprecatedWhether the library has been deprecated. Examples:spec.deprecated = true deprecated_in_favor_ofThe name of the Pod that this one has been deprecated in favor of. Examples:spec.deprecated_in_favor_of = 'NewMoreAwesomePod' PlatformA specification should indicate the platform and the correspondent deployment targets on which the library is supported. If not defined in a subspec the attributes of this group inherit the value of the parent. platformThe platform on which this Pod is supported. Leaving this blank means the Pod is supported on all platforms. When supporting multiple platforms you should use deployment_target below instead. Examples:spec.platform = :osx, '10.8' spec.platform = :ios spec.platform = :osx deployment_targetThe minimum deployment targets of the supported platforms. As opposed to the platform attribute, the deployment_target attribute allows to specify multiple platforms on which this pod is supported — specifying a different deployment target for each. Examples:spec.ios.deployment_target = '6.0' spec.osx.deployment_target = '10.8' Build settingsIn this group are listed the attributes related to the configuration of the build environment that should be used to build the library. If not defined in a subspec the attributes of this group inherit the value of the parent. dependencyAny dependency on other Pods or to a ‘sub-specification’. Dependencies can specify versions requirements. The use of the optimistic version indicator ~> is recommended because it provides good control over the version without being too restrictive. For example, ~> 1.0.1 is equivalent to >= 1.0.1 combined with < 1.1. Similarly, ~> 1.0 will match 1.0, 1.0.1, 1.1, but will not upgrade to 2.0. Pods with overly restrictive dependencies limit their compatibility with other Pods. Examples:spec.dependency 'AFNetworking', '~> 1.0' spec.dependency 'AFNetworking', '~> 1.0', :configurations => ['Debug'] spec.dependency 'AFNetworking', '~> 1.0', :configurations => :debug spec.dependency 'RestKit/CoreData', '~> 0.20.0' spec.ios.dependency 'MBProgressHUD', '~> 0.5' info_plistmulti-platformKey-Value pairs to add to the generated Info.plist. The values will be merged with the default values that CocoaPods generates, overriding any duplicates. For library specs, the values will be merged into the generated Info.plist for libraries that are integrated using frameworks. It will have no effect for static libraries. Subspecs (other than app and test specs) are not supported. For app specs, the values will be merged into the application host's Info.plist. For test specs, the values will be merged into the test bundle's Info.plist. Examples:spec.info_plist = { 'CFBundleIdentifier' => 'com.myorg.MyLib', 'MY_VAR' => 'SOME_VALUE' } requires_arcmulti-platformrequires_arc allows you to specify which source_files use ARC. This can either be the files which support ARC, or true to indicate all of the source_files use ARC. Files which do not use ARC will have the -fno-objc-arc compiler flag. The default value of this attribute is true. Defaults to:spec.requires_arc = true Examples:spec.requires_arc = false spec.requires_arc = 'Classes/Arc' spec.requires_arc = ['Classes/*ARC.m', 'Classes/ARC.mm'] frameworksmulti-platformA list of system frameworks that the user’s target needs to link against. Examples:spec.ios.framework = 'CFNetwork' spec.frameworks = 'QuartzCore', 'CoreData' weak_frameworksmulti-platformA list of frameworks that the user’s target needs to weakly link against. Examples:spec.weak_framework = 'Twitter' spec.weak_frameworks = 'Twitter', 'SafariServices' librariesmulti-platformA list of system libraries that the user’s target (application) needs to link against. Examples:spec.ios.library = 'xml2' spec.libraries = 'xml2', 'z' compiler_flagsmulti-platformA list of flags which should be passed to the compiler. Examples:spec.compiler_flags = '-DOS_OBJECT_USE_OBJC=0', '-Wno-format' pod_target_xcconfigmulti-platformAny flag to add to the final private pod target xcconfig file. Examples:spec.pod_target_xcconfig = { 'OTHER_LDFLAGS' => '-lObjC' } user_target_xcconfigmulti-platformSpecifies flags to add to the final aggregate target xcconfig file, which propagates to non-overridden and inheriting build settings to the integrated user targets. This attribute is not recommended as Pods should not pollute the build settings of the user project and this can cause conflicts. Multiple definitions for build settings that take multiple values will be merged. The user is warned on conflicting definitions for custom build settings and build settings that take only one value. Typically clang compiler flags or precompiler macro definitions go in here if they are required when importing the pod in the user target. Note that, this influences not only the compiler view of the public interface of your pod, but also all other integrated pods alongside to yours. You should always prefer pod_target_xcconfig, which can contain the same settings, but only influence the toolchain when compiling your pod target. Examples:spec.user_target_xcconfig = { 'MY_SUBSPEC' => 'YES' } prefix_header_contentsmulti-platformAny content to inject in the prefix header of the pod project. This attribute is not recommended as Pods should not pollute the prefix header of other libraries or of the user project. Examples:spec.prefix_header_contents = '#import <UIKit/UIKit.h>' spec.prefix_header_contents = '#import <UIKit/UIKit.h>', '#import <Foundation/Foundation.h>' prefix_header_filemulti-platformA path to a prefix header file to inject in the prefix header of the pod project. false indicates that the default CocoaPods prefix header should not be generated. true is the default and indicates that the def'''
