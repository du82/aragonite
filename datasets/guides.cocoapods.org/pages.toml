title = "CocoaPods Guides - Contributing"
description = "The Dependency Manager for iOS & Mac projects."
full_description = "CocoaPods is a project that relies on people working on it in their spare time, it is partially funded by the employers of core team members but a lot of the work is done by the users of CocoaPods.We want to encourage people to help out, and so we've wrote about up the process of working on the CocoaPods project. Whilst this is not all-encompassing, it provides a great start.How to ContributeCocoaPods is fully open-sourced, so it depends on community contributions to get better. If you're looking to start working on CocoaPods, this is the place to start.Core ComponentsThese are the core components that make up the CocoaPods gem.Setting up for DevelopmentIf you're looking to contribute to the CocoaPods project through feature additions or bug fixes, follow these instructions on setting up your development environment.Release ProcessThis describes how the CocoaPods team deal with the release process.Ticket handlingThe easiest way to contribute is to help us handling the tickets. CocoaPods is a project from Dimitris Koutsogiorgas, Danielle Lancashire, Eric Amorde, Orta Therox, Paul Beusterien, Samuel Giddins, and The CocoaPods Dev Team with contributions from many, many others.Lovingly sponsored byArtsy, Button, Capital One, CircleCI, Discontinuity, Emerge Tools, Fingertips, Google, Heroku, jsDelivr, Realm, PSPDFKit, RubyMotion, Sauspiel, Slack, SoundCloud, Stripe, Square, and Technology Astronauts. SupportGitHub RepoWeb Properties Status@CocoaPodsMailing ListCocoaPods Dev TeamPodfile DocsumentationLegal / Conduct"
