full_description = "If you want to release some of your own code to the world, or are interesting in having your own repository of podspecs for internal use, this is what you're looking for. Here you can find out about making your own Podspecs, creating a private repo and understand what we consider to be the best practices for libraries. Making a CocoaPodInstructions for creating and maintaining a CocoaPod.Using Pod Lib CreateThe guide for getting a CocoaPod up and running quickly.Getting setup with TrunkInstructions for creating a CocoaPods user accountQuality IndexesIncreasing your CocoaPod's Search RankDevelopment PodsHow to reference a local checkout of a Pod's repository while working on modifications to it.Private PodsHow to setup a private Podspec repo for maintaining internal libraries.Specs and the Specs RepoLearn about creating Podspec's and the Spec repo. CocoaPods is a project from Dimitris Koutsogiorgas, Danielle Lancashire, Eric Amorde, Orta Therox, Paul Beusterien, Samuel Giddins, and The CocoaPods Dev Team with contributions from many, many others.Lovingly sponsored byArtsy, Button, Capital One, CircleCI, Discontinuity, Emerge Tools, Fingertips, Google, Heroku, jsDelivr, Realm, PSPDFKit, RubyMotion, Sauspiel, Slack, SoundCloud, Stripe, Square, and Technology Astronauts. SupportGitHub RepoWeb Properties Status@CocoaPodsMailing ListCocoaPods Dev TeamPodfile DocsumentationLegal / Conduct"
