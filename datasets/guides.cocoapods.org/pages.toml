["http://guides.cocoapods.org/terminal/commands.html"]
title = "CocoaPods Guides - Command-line Reference"
description = "The Dependency Manager for iOS & Mac projects."
full_description = "CommandsInstallationinit install update outdated deintegrate Environmentenv Browsesearch list try Specificationsspec create spec lint spec cat spec which spec edit Trunktrunk add-owner trunk info trunk me trunk push trunk register trunk remove-owner trunk deprecate trunk delete Reposrepo add repo add-cdn repo update repo lint repo list repo remove repo push setup Librarieslib create lib lint IPCipc repl ipc spec ipc podfile ipc podfile-json ipc list ipc update-search-index Pluginsplugins list plugins search plugins installed plugins create plugins publish Cachecache list cache clean Commandspod CocoaPods, the Cocoa library package manager. InstallationThe commands listed in this group provide support for installing and integrating the dependencies specified in a Podfile.Following is presented the basic workflow for integrating CocoaPods in a user project.$ touch Podfile $ vim Podfile $ pod install$ open *.xcworkspace$ vim podfile $ pod install$ pod outdated$ pod updateCommandspod initpod installpod updatepod outdatedpod deintegrateEnvironmentpod envBrowsepod searchpod listpod trySpecificationspod spec createpod spec lintpod spec catpod spec whichpod spec editTrunkpod trunk add-ownerpod trunk infopod trunk mepod trunk pushpod trunk registerpod trunk remove-ownerpod trunk deprecatepod trunk deleteRepospod repo addpod repo add-cdnpod repo updatepod repo lintpod repo listpod repo removepod repo pushpod setupLibrariespod lib createpod lib lintIPCpod ipc replpod ipc specpod ipc podfilepod ipc podfile-jsonpod ipc listpod ipc update-search-indexPluginspod plugins listpod plugins searchpod plugins installedpod plugins createpod plugins publishCachepod cache listpod cache cleanpod initpod init XCODEPROJCreates a Podfile for the current directory if none currently exists. If an XCODEPROJ project file is specified or if there is only a single project file in the current directory, targets will be automatically generated based on targets defined in the project. It is possible to specify a list of dependencies which will be used by the template in the Podfile.default (normal targets) Podfile.test (test targets) files which should be stored in the /Users/eamorde/.cocoapods/templates folder. Inherited options:--allow-rootAllows CocoaPods to run as root. --silentShow nothing. --versionShow the version of the tool. --verboseShow more debugging information. --no-ansiShow output without ANSI codes. --helpShow help banner of specified command. pod installpod install Downloads all dependencies defined in Podfile and creates an Xcode Pods library project in ./Pods. The Xcode project file should be specified in your Podfile like this: project `path/to/XcodeProject.xcodeproj` If no project is specified, then a search for an Xcode project will be made. If more than one Xcode project is found, the command will raise an error. This will configure the project to reference the Pods static library, add a build configuration file, and add a post build script to copy Pod resources. This may return one of several error codes if it encounters problems. * 1 Generic error code * 31 Spec not found (i.e out-of-date source repos, mistyped Pod name etc...) Options:--repo-updateForce running pod repo update before install. --deploymentDisallow any changes to the Podfile or the Podfile.lock during installation. --clean-installIgnore the contents of the project cache and force a full pod installation. This only applies to projects that have enabled incremental installation. --project-directory=/project/dir/The path to the root of the project directory. Inherited options:--allow-rootAllows CocoaPods to run as root. --silentShow nothing. --versionShow the version of the tool. --verboseShow more debugging information. --no-ansiShow output without ANSI codes. --helpShow help banner of specified command. pod updatepod update [POD_NAMES ...]Updates the Pods identified by the specified POD_NAMES, which is a space-delimited list of pod names. If no POD_NAMES