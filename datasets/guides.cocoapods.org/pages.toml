["https://guides.cocoapods.org/contributing/components.html"]
title = "CocoaPods Guides - Core Components"
description = "The Dependency Manager for iOS & Mac projects."
full_description = "<What are the main components? To ensure that CocoaPods has a clean and easily accessible code-base we split the work among a collection of ruby gems. These work together to bring the pod command to life. <CocoaPods The CocoaPods gem which includes the command line support and the installer. This handles all of the user interactions for CocoaPods. <Cocoapods-Core The CocoaPods-Core gem provides support to work with the models of CocoaPods, for example the Podspecs or the Podfile. <Xcodeproj The Xcodeproj gem lets you create and modify Xcode projects from Ruby. Script boring management tasks or build Xcode-friendly libraries. Also includes support for Xcode workspaces (.xcworkspace) and configuration files (.xcconfig). <Cocoapods-Downloader The Cocoapods-downloader gem is a small library that provides downloaders for various source control types (HTTP/SVN/Git/Mercurial). It can deal with tags, commits, revisions, branches, extracting files from zips and almost anything these source control system would use. <CLAide The CLAide gem is a simple command line parser, which provides an API that allows you to quickly create a full featured command-line interface. <Molinillo The Molinillo gem is a generic dependency resolution algorithm, used in CocoaPods, Bundler and RubyGems. CocoaPods is a project from Dimitris Koutsogiorgas, Danielle Lancashire, Eric Amorde, Orta Therox, Paul Beusterien, Samuel Giddins, and The CocoaPods Dev Team with contributions from many, many others. Lovingly sponsored by Artsy, Button, Capital One, CircleCI, Discontinuity, Emerge Tools, Fingertips, Google, Heroku, jsDelivr, Realm, PSPDFKit, RubyMotion, Sauspiel, Slack, SoundCloud, Stripe, Square, and Technology Astronauts. Support GitHub Repo Web Properties Status @CocoaPods Mailing List CocoaPods Dev Team Podfile Docsumentation Legal / Conduct"
