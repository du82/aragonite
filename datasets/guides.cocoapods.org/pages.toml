title = "CocoaPods Guides - Development Pods"
description = "The Dependency Manager for iOS & Mac projects."
full_description = "If you yourself are the author of a Pod and you develop it in concert with an app, you often find yourself wanting to make changes to the Pod while it is installed into the app, to be able to try out your changes right there. Since CocoaPods assumes it has sole control of the Pods it checks out, you should not change the CocoaPod directly, as that would mean that CocoaPods might discard your changes and you could lose your changes on a thoughtless pod update. Instead, install your pod as a development pod. Where you usually refer to your (non-development) Pod as CocoaPods is a project from Dimitris Koutsogiorgas, Danielle Lancashire, Eric Amorde, Orta Therox, Paul Beusterien, Samuel Giddins, and The CocoaPods Dev Team with contributions from many, many others.Lovingly sponsored byArtsy, Button, Capital One, CircleCI, Discontinuity, Emerge Tools, Fingertips, Google, Heroku, jsDelivr, Realm, PSPDFKit, RubyMotion, Sauspiel, Slack, SoundCloud, Stripe, Square, and Technology Astronauts. SupportGitHub RepoWeb Properties Status@CocoaPodsMailing ListCocoaPods Dev TeamPodfile DocsumentationLegal / Conduct"
