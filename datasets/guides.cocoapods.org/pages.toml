full_description = "<The Problem You need to write an SDK that is closed source, but you'd like to use dependencies. Due to the limitations of the process runtime, you can only have one version of a dependency in an app. If your closed-source SDK happens to include the same dependencies as another then your SDK consumers are not going to have a good time. <The answer CocoaPods Packager is a pod command that takes a Podspec and generates the resulting framework or static library for you. It has techniques for embedding its dependencies safely and uses a Podspec as the source of truth for all your settings. bundle exec pod package ORStackView.podspec To find out more, check out cocoapods/cocoapods-packager. CocoaPods is a project from Dimitris Koutsogiorgas, Danielle Lancashire, Eric Amorde, Orta Therox, Paul Beusterien, Samuel Giddins, and The CocoaPods Dev Team with contributions from many, many others. Lovingly sponsored by Artsy, Button, Capital One, CircleCI, Discontinuity, Emerge Tools, Fingertips, Google, Heroku, jsDelivr, Realm, PSPDFKit, RubyMotion, Sauspiel, Slack, SoundCloud, Stripe, Square, and Technology Astronauts. Support GitHub Repo Web Properties Status @CocoaPods Mailing List CocoaPods Dev Team Podfile Docsumentation Legal / Conduct"
