en NAME (or Git URL), install its dependencies if needed and opens its demo project. If a Git URL is provided the head of the repo is used. If a Git URL is specified, then a --podspec_name can be provided, if the podspec name is different than the git repo for some reason. Options:--podspec_name=[name]The name of the podspec file within the Git Repository. --no-repo-updateSkip running pod repo update before install. Inherited options:--allow-rootAllows CocoaPods to run as root. --silentShow nothing. --versionShow the version of the tool. --verboseShow more debugging information. --no-ansiShow output without ANSI codes. --helpShow help banner of specified command. pod spec createpod spec create [NAME|https://github.com/USER/REPO]Creates a PodSpec, in the current working dir, called NAME.podspec. If a GitHub url is passed the spec is prepopulated. Inherited options:--allow-rootAllows CocoaPods to run as root. --silentShow nothing. --verboseShow more debugging information. --no-ansiShow output without ANSI codes. --helpShow help banner of specified command. pod spec lintpod spec lint [NAME.podspec|DIRECTORY|http://PATH/NAME.podspec ...]Validates NAME.podspec. If a DIRECTORY is provided, it validates the podspec files found, including subfolders. In case the argument is omitted, it defaults to the current working dir. Options:--quickLint skips checks that would require to download and build the spec. --allow-warningsLint validates even if warnings are present. --subspec=NAMELint validates only the given subspec. --no-subspecsLint skips validation of subspecs. --no-cleanLint leaves the build directory intact for inspection. --fail-fastLint stops on the first failing platform or subspec. --use-librariesLint uses static libraries to install the spec. --use-modular-headersLint uses modular headers during installation. --use-static-frameworksLint uses static frameworks during installation. --sources=https://cdn.cocoapods.org/The sources from which to pull dependent pods (defaults to https://cdn.cocoapods.org/). Multiple sources must be comma-delimited. --platforms=ios,macosLint against specific platforms (defaults to all platforms supported by the podspec). Multiple platforms must be comma-delimited. --privateLint skips checks that apply only to public specs. --swift-version=VERSIONThe SWIFT_VERSION that should be used to lint the spec. This takes precedence over the Swift versions specified by the spec or a .swift-version file. --skip-import-validationLint skips validating that the pod can be imported. --skip-testsLint skips building and running tests during validation. --test-specs=test-spec1,test-spec2,etcList of test specs to run. --analyzeValidate with the Xcode Static Analysis tool. --configuration=CONFIGURATIONBuild using the given configuration (defaults to Release). --validation-dirThe directory to use for validation. If none is specified a temporary directory will be used.. Inherited options:--allow-rootAllows CocoaPods to run as root. --silentShow nothing. --verboseShow more debugging information. --no-ansiShow output without ANSI codes. --helpShow help banner of specified command. pod spec catpod spec cat [QUERY]Prints the content of the podspec(s) whose name matches QUERY to standard output. Options:--regexInterpret the QUERY as a regular expression. --show-allPick from all versions of the given podspec. --versionPrint a specific version of the given podspec. Inherited options:--allow-rootAllows CocoaPods to run as root. --silentShow nothing. --verboseShow more debugging information. --no-ansiShow output without ANSI codes. --helpShow help banner of specified command. pod spec whichpod spec which [QUERY]Prints the path of the .podspec file(s) whose name matches QUERY Options:--regexInterpret the QUERY as a regular expression. --show-allPrint all versions of the given podspec. --versionPrint a specific version of the given podspec. Inherited options:--allow-rootAllows CocoaPods to run as root. --silentShow nothing. --verboseShow more debugging information. --no-ansiShow output without ANSI codes. --helpShow help banner of specified command. pod spec editpod spec edit [QUERY]Opens the podspec matching QUERY to be edited. Options:--regexInterpret the QUERY as a regular expression. --show-allPick from all versions of the given podspec. Inherited options:--allow-rootAllows CocoaPods to run as root. --silentShow nothing. --verboseShow more debugging information. --no-ansiShow output without ANSI codes. --helpShow help banner of specified command. pod trunk add-ownerAvailable since v0.33.0.pod trunk add-owner POD OWNER-EMAILAdds the registered user with specified OWNER-EMAIL as an owner of the given POD. An ‘owner’ is a registered user whom is allowed to make changes to a pod, such as pushing new versions and adding and removing other ‘owners’. Inherited options:--allow-rootAllows CocoaPods to run as root. --silentShow nothing. --verboseShow more debugging information. --no-ansiShow output without ANSI codes. --helpShow help banner of specified command. pod trunk infoAvailable since v0.33.0.pod trunk info NAMEReturns information about a Pod. Inherited options:--allow-rootAllows CocoaPods to run as root. --silentShow nothing. --verboseShow more debugging information. --no-ansiShow output without ANSI codes. --helpShow help banner of specified command. pod trunk meAvailable since v0.33.0.pod trunk me Includes information about your registration, followed by all your sessions. These are your current session, other valid sessions, unverified sessions, and expired sessions. Inherited options:--allow-rootAllows CocoaPods to run as root. --silentShow nothing. --verboseShow more debugging information. --no-ansiShow output without ANSI codes. --helpShow help banner of specified command. pod trunk pushAvailable since v0.33.0.pod trunk push [PATH]Publish the podspec at PATH to make it available to all users of the ‘trunk’ spec-repo. If PATH is not provided, defaults to the current directory. Before pushing the podspec to cocoapods.org, this will perform a local lint of the podspec, including a build of the library. However, it remains your responsibility to ensure that the published podspec will actually work for your users. Thus it is recommended that you first try to use the podspec to integrate the library into your demo and/or real application. If this is the first time you publish a spec for this pod, you will automatically be registered as the ‘owner’ of this pod. (Note that ‘owner’ in this case implies a person that is allowed to publish new versions and add other ‘owners’, not necessarily the library author.) Options:--allow-warningsAllows push even if there are lint warnings. --use-librariesLinter uses static libraries to install the spec. --use-modular-headersLint uses modular headers during installation. --swift-version=VERSIONThe SWIFT_VERSION that should be used to lint the spec. This takes precedence over a .swift-version file.. --skip-import-validationLint skips validating that the pod "
