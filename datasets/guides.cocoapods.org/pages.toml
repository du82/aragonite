["http://guides.cocoapods.org/plugins/environment-vars.html"]
title = "CocoaPods Guides - Keeping Secrets"
description = "The Dependency Manager for iOS & Mac projects."
full_description = "<The Problem You want to keep secrets like API access tokens outside of your source code. This is considered a good engineering practice in general (least privilege) and you may want to have different environments like staging and production. <The answer CocoaPods Keys adds a few commands, and uses the installation hooks: bundle exec pod keys set ARKeyName value - lets you store a value in your computer's keychain bundle exec pod keys get ARKeyName - prints out the value from your computer's keychain Then inside your Podfile, add the plugin section. Noting the name of the project, the target to attach the pod to, and the keys that you want to use: plugin 'cocoapods-keys', project: 'Artsy', target: 'Artsy', keys: [ 'ArtsyAPIClientSecret', # Auth for the Artsy API 'ArtsyAPIClientKey', # 'ArtsyFacebookAppID', # Supporting FB Login ] When you run bundle exec pod install, CocoaPods Keys will add a new Pod that has all of of your keys embedded inside it. To find out more, check out orta/cocoapods-keys. plugin 'cocoapods-keys', project: 'Artsy', target: 'Artsy', keys: [ 'ArtsyAPIClientSecret', # Auth for the Artsy API 'ArtsyAPIClientKey', # 'ArtsyFacebookAppID', # Supporting FB Login ] CocoaPods is a project from Dimitris Koutsogiorgas, Danielle Lancashire, Eric Amorde, Orta Therox, Paul Beusterien, Samuel Giddins, and The CocoaPods Dev Team with contributions from many, many others. Lovingly sponsored by Artsy, Button, Capital One, CircleCI, Discontinuity, Emerge Tools, Fingertips, Google, Heroku, jsDelivr, Realm, PSPDFKit, RubyMotion, Sauspiel, Slack, SoundCloud, Stripe, Square, and Technology Astronauts. Support GitHub Repo Web Properties Status @CocoaPods Mailing List CocoaPods Dev Team Podfile Docsumentation Legal / Conduct"
