["https://www.gunet.gr/el/%cf%85%cf%80%ce%b7%cf%81%ce%b5%cf%83%ce%af%ce%b1-uauth"]
title = "Υπηρεσία uAuth – GUnet"
full_description = "Υπηρεσία uAuth Η υπηρεσία uAuth αποτελεί έναν ολοκληρωμένο μηχανισμό πιστοποίησης πολλαπλού παράγοντα (MFA) με χρήση push notifications σε συνδεδέμενη συσκευή του χρήστη. Αποτελείται από τα ακόλουθα συστατικά στοιχεία: Βάση δεδομένων της υπηρεσίας για την αποθήκευση των συνδεδεμένων συσκευώνΟλοκληρωμένο σύστημα διαχείρισης και πιστοποίησης MFA βασισμένο στο λογισμικό PrivacyIDEAΟλοκλήρωση της υπηρεσίας με την υπηρεσία SSOΕφαρμογή Android/iOS uAuth για την λήψη και αποδοχή push notifications από την υπηρεσία στην προσωπική συσκευή του χρήστη Τα βασικά πλεονεκτήματα που προσφέρει η υπηρεσία είναι: Μηδενικό κόστος (σε αντίθεση με την πιστοποίηση MFA μέσω SMS OTP)Ολοκληρωμένη υπηρεσία διαχείρισης συσκευώνΑυξημένη ασφάλεια καθώς ο χρήστης διασυνδέει συγκεκριμένη συσκευή στην υπηρεσία (σε αντίθεση με συστήματα Time-OTP όπως το GAuth όπου η πρόσβαση στο αρχικό QR code συνεπάγεται τη δυνατότητα πιστοποίησης) Η υπηρεσία διασυνδέεται με την υπηρεσία uSIEM για την παρακολούθηση της χρήσης και των logs των βασικών λειτουργιών. Για επικοινωνία σχετικά με την υπηρεσία τα μέλη της GUNet μπορούν να απευθύνονται στη διεύθυνση email identity@gunet.gr"
