title = "Newsletter – Σελίδα 3 – GUnet"
full_description = "SoCraTest – Δελτίο Ενημέρωσης 1 Date: 19 Μαΐου, 2021 Author: Pantelis Balaouras Μάιος 2021 Αγαπητοί φίλοι, συνεργάτες, Είμαστε στην ευχάριστη θέση να ανακοινώσουμε ότι η GUnet είναι εταίρος στην ανάπτυξη του Ευρωπαϊκού έργου SoCrATest (www.socratest.eu). Το SoCrATest – Soft Skills & Creativity Assessment and Testing for Volunteers in Times of Crisis είναι μια Erasmus+ Στρατηγική Συνεργασία (Κεντρική Δράση 227 – Partnerships for Creativity) που αναπτύχθηκε χάρη στη συγχρηματοδότηση από την Ευρωπαϊκή Επιτροπή – Πρόγραμμα Erasmus+ (Ιταλικός Οργανισμός). Ο γενικός στόχος του έργου SoCrATest είναι να παράσχει στους οργανισμούς που απασχολούν εθελοντές υποστήριξη και καθοδήγηση για την εφαρμογή εσωτερικών συστημάτων αναγνώρισης ήπιων δεξιοτήτων και δυναμικού δημιουργικότητας, προκειμένου να ενδυναμωθούν οι εθελοντές για την ανάπτυξη των δεξιοτήτων και των ικανοτήτων τους που ενισχύουν τη δημιουργικότητα και την ευελιξία σε εργασιακά περιβάλλοντα που χαρακτηρίζονται από ταχύτητα, αβεβαιότητα, πολυπλοκότητα και ασάφεια. Δείτε περισσότερα στο Δελτίο Ενημέρωσης 1. FENICE – Δελτίο Ενημέρωσης 1, Μάιος 2021 Date: 14 Μαΐου, 2021 Author: Pantelis Balaouras Γνωρίζετε ότι, το 2019, στην 74η σύνοδο της Γενικής Συνέλευσης των Hνωμένων Εθνών, το 2021 ανακηρύχθηκε Διεθνές Έτος Δημιουργικής Οικονομίας για την Αειφόρο Ανάπτυξη (IYCESD2021); Ταυτόχρονα, το 2021 -μια εποχή πανδημίας- αμφισβητεί τη βιωσιμότητα της ίδιας της δημιουργικής οικονομίας. Για την ανθεκτικότητα και τη βιωσιμότητα του τομέα απαιτούνται συντονισμένες ενέργειες όλων των ενδιαφερομένων. Για να αξιολογηθούν οι θετικές επιπτώσεις των Πολιτιστικών και Δημιουργικών Βιομηχανιών στις τοπικές και περιφερειακές οικονομίες και να προσδιοριστούν οι προοπτικές ανάπτυξης, πέντε αναγνωρισμένα ακαδημαϊκά και ερευνητικά ιδρύματα εγκαινίασαν το πρόγραμμα Erasmus+ FENICE: Προώθηση της επιχειρηματικότητας και της καινοτομίας στις πολιτιστικές και δημιουργικές βιομηχανίες (ΠΔΒ) μέσω της διεπιστημονικής εκπαίδευσης. Για περισσότερα δείτε εδώ."
