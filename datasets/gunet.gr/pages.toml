full_description = "ML&S Date: 14 Μαρτίου, 2019 Author: Pantelis Balaouras Αντικείμενο: To έργο Money & Life Skills – Financial Capability Made Easy στοχεύει στην βελτίωση των δεξιοτήτων για την διαχείριση χρημάτων και ζωής και απευθύνεται σε νέους που είτε είναι άνεργοι είτε εργάζονται με εισόδημα χαμηλότερο από τον μέσο όρο της ΕΕ. Οι δραστηριότητες του έργου περιλαμβάνουν –την ανάπτυξη Κατευθυντήριων Γραμμών (Οδηγίες), –την παραγωγή εκπαιδευτικού υλικού, –την ανάπτυξη ψηφιακής πλατφόρμας για την εκπαίδευση καθώς και εφαρμογή για κινητές συσκευές. Ο ρόλος της GUnet: Yπηρεσία φιλοξενίας του υλικού βασισμένη στο Open eClass, υπηρεσία τηλεσυνεργασίας, ανάπτυξη mobile εφαρμογής. Έναρξη: 30/12/2018, Διάρκεια 2 έτη Προϋπολογισμός GUnet: 43.290 € Χρηματοδότηση: Erasmus+ SKIVRE Date: 1 Φεβρουαρίου, 2019 Author: Pantelis Balaouras Αντικείμενο: To έργο Skills Development for the Valorisation of European Religious Heritage (SKIVRE) στοχεύει στην βελτίωση των δεξιοτήτων για την ανάπτυξη και προώθηση προϊόντων που παράγονται στα μοναστήρια της Ευρώπης. Οι δραστηριότητες του έργου περιλαμβάνουν –την ανάπτυξη σχήματος εκπαίδευσης, –την ανάπτυξη ψηφιακής πλατφόρμας για την εκπαίδευση, –την σύνταξη ενός εγχειριδίου για το εμπόριο μοναστηριακών προϊόντων, κ.α Ο ρόλος της GUnet: –Yπηρεσία φιλοξενίας του υλικού βασισμένη στο pen eClass, υπηρεσία τηλεσυνεργασίας, ανάπτυξη mobile εφαρμογής. Έναρξη: 1/9/2018, Διάρκεια 2 έτη Προϋπολογισμός GUnet: 38.050 € Ιστότοπος: www.skivre.eu Κατεβάστε το Ενημερωτικό φυλλάδιο. Χρηματοδότηση: Erasmus+"
