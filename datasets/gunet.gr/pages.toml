title = "Αναπτυξιακά Έργα/Δράσεις – Σελίδα 3 – GUnet"
full_description = "Κεντρικό Μητρώο Ελληνικών Ανοικτών Μαθημάτων Date: 16 Μαρτίου, 2016 Author: tio Περίοδος: 1/2013 – 10/2015 Χρηματοδότηση: ΕΣΠΑ. Επιχειρησιακό Πρόγραμμα «Εκπαίδευση και Δια Βίου Μάθηση» Το έργο «Κεντρικό Μητρώο Ελληνικών Ανοικτών Μαθημάτων» στοχεύει στην οριζόντια υποστήριξη των Ανώτατων Εκπαιδευτικών Ιδρυμάτων (ΑΕΙ) σχετικά με τις δράσεις ανάπτυξης ψηφιακών, ανοικτών μαθημάτων, διαθέσιμων δωρεάν, τόσο στους φοιτητές/σπουδαστές, όσο και στο ευρύ κοινό. Continue reading… Youth Counseling against Radicalization an Holistic Approach to support Vulnerable Adolescents (YCARe) Date: 21 Δεκεμβρίου, 2015 Author: tio Περίοδος: 1/12/2015 – 30/11/2017 Χρηματοδότηση: Ευρωπαϊκή Ένωση – Erasmus+ Αντικείμενο: Συμβουλευτική Νεολαίας κατά της ριζοσπαστικοποίησης: (YCARE), Ανάπτυξη υλικού ευαισθητοποίησης όσο αφορά στην ριζοσπαστικοποίηση και στις σχετικές ανάγκες των επαγγελματιών και των ενδιαφερόμενων φορέων στον τομέα της συμβουλευτικής της νεολαίας. Ακολουθείται μια ολιστική προσέγγιση για την υποστήριξη των ευάλωτων εφήβων. Continue reading… Ψηφιακές Υπηρεσίες Ακαδημαϊκών Ιδρυμάτων – Οριζόντια Δράση Date: 16 Μαρτίου, 2015 Author: tio Περίοδος: 9/2012 – 9/2015 Χρηματοδότηση: ΕΣΠΑ. Επιχειρησιακό Πρόγραμμα «Εκπαίδευση και Δια Βίου Μάθηση» Το έργο αφορά στην ανάπτυξη μιας σειράς οριζόντιων υπηρεσιών που θα καλύπτουν τις ανάγκες των ιδρυμάτων της Τριτοβάθμιας Εκπαίδευσης και του Υπουργείου Παιδείας. Πιο συγκεκριμένα στα πλαίσια του έργου θα αναπτυχθούν οι ακόλουθες υπηρεσίες-πληροφοριακά συστήματα: Ανάπτυξη Πληροφοριακού Συστήματος Επιχειρηματικής Ευφυΐας (ΒΙ) (Υποέργο 1) Το σύστημα Επιχειρηματικής Ευφυΐας, πέραν της αναβάθμισης της επιχειρησιακής ικανότητας των ιδρυμάτων της Γ’ θμιας θα αποτελέσει το σημείο αναφοράς για την καταγραφή και παρακολούθηση σημαντικών δεικτών λειτουργίας των Παν/μιων και ΤΕΙ της χώρας κατά τρόπο που αυτοί να είναι άμεσα διαθέσιμοι στους αρμόδιους φορείς αλλά και σε όλους τους πολίτες. Continue reading…"
