title = "Αναπτυξιακά Έργα/Δράσεις – Σελίδα 5 – GUnet"
full_description = "Προηγμένες Υπηρεσίες Δικτύου Κορμού για την Ακαδημαϊκή κοινότητα (ΕΠ ΚτΠ/Γ΄ΚΠΣ) Date: 16 Μαρτίου, 2002 Author: tio Περίοδος: 12/2002 – 6/2003 Χρηματοδότηση: Υπουργείο Παιδείας – Ευρωπαϊκή Ένωση, Γ΄ ΚΠΣ Το έργο αποσκοπούσε στην αναβάθμιση του δικτύου κορμού του Ακαδημαϊκού Δικτύου, προκειμένου να ανταποκριθεί στις αυξημένες ανάγκες των εκπαιδευτικών ιδρυμάτων της χώρας. Η αναβάθμιση σε γραμμές τεχνολογίας SDH ταχυτήτων 34-155 Mbps αποτελούσε προϋπόθεση για τη χρήση προηγμένων πρωτοκόλλων στο Διαδίκτυο με έμφαση στην υποστήριξη εφαρμογών πολυμέσων (τηλε-εκπαίδευση, τηλε-ιατρική, τηλε-εργασία, κτλ.), στην υποστήριξη υπερ-υπολογιστικών κέντρων, ηλεκτρονικών βιβλιοθηκών και εργαστηρίων, την περαιτέρω ανάπτυξη των προηγμένων τηλεματικών υπηρεσιών και την αξιοποίηση του λογισμικού περιεχομένου στην Γ’ θμια. Continue reading… Προηγμένες Τηλεματικές Υπηρεσίες για τους Φορείς του «Ακαδημαϊκού Διαδικτύου (GUnet)» Date: 28 Δεκεμβρίου, 2001 Author: tio Περίοδος: 9/1996 – 12/2000 Χρηματοδότηση: Υπουργείο Παιδείας – Ευρωπαϊκή Ένωση, Γ΄ ΚΠΣ Το παρόν έργο αποτελεί τη συνέχεια του έργου «Ακαδημαϊκό Διαδίκτυο-GUnet: Δίκτυο Πρόσβασης & Υπηρεσίες Κορμού για την Εκπαίδευση» που χρηματοδοτήθηκε με πόρους του Β’ ΚΠΣ (ΕΠΕΑΕΚ). Αξιοποιώντας, τόσο την εμπειρία του παρελθόντος, όσο και το έμψυχο δυναμικό των Ιδρυμάτων-μελών (όλα τα Ελληνικά ΑΕΙ και ΤΕΙ) της αστικής μη κερδοσκοπικής εταιρείας «Ακαδημαϊκό Διαδίκτυο» (GUnet), θα υλοποιηθούν προηγμένες τηλεματικές υπηρεσίες οριζόντιου χαρακτήρα, καθώς και ψηφιακό περιεχόμενο, με στόχο την κάλυψη των αναγκών ενημέρωσης και χρήσης προηγμένων εφαρμογών από τους χρήστες των Ακαδημαϊκών Ιδρυμάτων. Continue reading…"
