full_description = "Centaur – Ενημερωτικό Δελτίο 2 Date: 10 Ιουνίου, 2022 Author: Pantelis Balaouras 10 Ιουνίου 2022 Η πορεία του ΈργουΗ υλοποίηση του έργου CENTAUR προχωράει ομαλά και σε πλήρη ευθυγράμμιση μετα πρότυπα ποιότητας που είχαν τεθεί κατά τα πρώτα στάδια ανάπτυξής του. Έχονταςολοκληρώσει επιτυχώς το πρώτο παραδοτέο, το οποίο είναι ο προσδιορισμός των αναγκών, οιαπαιτήσεις των χρηστών και το πλαίσιο ανάπτυξης ασκήσεων, όλοι οι εταίροι έχουν επικεντρωθείστην ανάπτυξη των υπόλοιπων παραδοτέων του έργου. Για περισσότερα κατεβάστε το Ενημερωτικό Δελτίο από εδώ. Posted in: Newsletter. Last Modified: 17 Μαρτίου, 2023"
