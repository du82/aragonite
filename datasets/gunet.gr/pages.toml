["https://www.gunet.gr/el/fenice-%ce%b4%ce%b5%ce%bb%cf%84%ce%af%ce%bf-%cf%84%cf%8d%cf%80%ce%bf%cf%85-2-%ce%b1%cf%80%cf%81%ce%af%ce%bb%ce%b9%ce%bf%cf%82-2023"]
title = "FENICE | Δελτίο Τύπου 2 |  Απρίλιος 2023 – GUnet"
full_description = "FENICE | Δελτίο Τύπου 2 | Απρίλιος 2023 Date: 29 Απριλίου, 2023 Author: Pantelis Balaouras ΕΝΤΑΤΙΚΟ ΕΚΠΑΙΔΕΥΤΙΚΟ ΠΡΟΓΡΑΜΜΑ ΕΙΣΑΓΕΙ ΝΕΟΥΣ ΑΠΟ 5 ΧΩΡΕΣ ΣΤΙΣ ΠΟΛΥΠΛΟΚΟΤΗΤΕΣ ΤΗΣ ΕΠΙΧΕΙΡΗΜΑΤΙΚΟΤΗΤΑΣ ΚΑΙ ΤΗΣ ΔΙΟΙΚΗΣΗΣ ΔΗΜΙΟΥΡΓΙΚΩΝ ΕΠΙΧΕΙΡΗΣΕΩΝ Ένα εντατικό πρόγραμμα κατάρτισης με τίτλο «Διαχείριση και Επιχειρηματικότητα στις Πολιτιστικές και Δημιουργικές Βιομηχανίες» φιλοξενήθηκε από το Πανεπιστήμιο Διοίκησης της Βάρνας στη Βουλγαρία (Varna University of Management, Bulgaria) μεταξύ 24 και 28 Απριλίου 2023. 15 φοιτητές και 7 καθηγητές από 5 χώρες – Βουλγαρία, Ελλάδα, Πορτογαλία, Σερβία και Ρουμανία – συμμετείχαν στην εκδήλωση. Η εστίαση αυτής της διεπιστημονικής κατάρτισης ήταν στις ιδιαιτερότητες των κλάδων του πολιτισμού και της δημιουργικότητας και οι εκπαιδευόμενοι απέκτησαν τις γνώσεις και τις δεξιότητες για να ξεκινήσουν τη δική τους επιχείρηση και να διαχειριστούν αποτελεσματικά ένα δημιουργικό επιχειρηματικό εγχείρημα. Οι θεματικές παρουσιάσεις εισήγαγαν τις βασικές έννοιες για τις τέχνες και τη δημιουργικότητα, την καινοτομία, τη δημιουργία και τη χρηματοδότηση επιχειρήσεων, καθώς και λεπτομέρειες σχετικά με τη δημιουργία συνεργασιών/συμπράξεων, τη διαχείριση ομάδων και τις αλλαγές. Οι πρακτικές δραστηριότητες περιλάμβαναν ασκήσεις με στόχο την απελευθέρωση της δημιουργικότητας και των κινήτρων, τη συζήτηση περιπτωσιολογικών μελετών και την επίλυση προβλημάτων από μία πραγματική επιχειρηματική πρακτική. Οι επισκέψεις σε τοπικά πολιτιστικά ιδρύματα προκάλεσαν τους συμμετέχοντες να αναπτύξουν τις δικές τους ιδέες για μια λειτουργική επιχείρηση. Η κατάρτιση αυτή έκανε πράξη και επαλήθευσε την αποτελεσματικότητα των αποτελεσμάτων που αναπτύχθηκαν στο πλαίσιο του έργου «FENICE: Προώθηση της Επιχειρηματικότητας και της Καινοτομίας στις Πολιτιστικές και Δημιουργικές Βιομηχανίες (ΠΔΒ) μέσω της Διεπιστημονικής Εκπαίδευσης», το οποίο υποστηρίχθηκε από το πρόγραμμα Erasmus+. Στο πλαίσιο του έργου εκπονήθηκαν 4 μαθήματα για εκπαιδεύσεις διάρκειας 30 και 15 ωρών που αποτελούνται από αναλυτικά προγράμματα και εκπαιδευτικό υλικό. Αυτά θα μπορούσαν να ενσωματωθούν σε προγράμματα σπουδών τριτοβάθμιας εκπαίδευσης, καθώς και επαγγελματικής εκπαίδευσης στον τομέα των Οικονομικών και Επιχειρηματικών σπουδών καθώς και στις Τέχνες και τις Ανθρωπιστικές Επιστήμες, προσαρμόζοντάς τα στις ανάγκες των μαθητών και των επαγγελματιών αντίστοιχα. Τα θέματα και τα περιεχόμενα αναπτύχθηκαν από μια διεθνή διεπιστημονική ομάδα εμπειρογνωμόνων και ερευνητών, καλύπτοντας τις διαφορετικές προοπτικές και τις πολύπλευρες πτυχές των Πολιτιστικών και Δημιουργικών βιομηχανιών. Τα αναλυτικά προγράμματα και το εκπαιδευτικό υλικό έχουν δημοσιευθεί σε ηλεκτρονική πλατφόρμα ανοιχτής πρόσβασης, δίνοντας τη δυνατότητα σε όλους τους ενδιαφερόμενους φορείς – ιδίως τα ιδρύματα τριτοβάθμιας εκπαίδευσης και τις σχολές επαγγελματικής κατάρτισης – να τα εφαρμόσουν στην πρακτική τους. Επιπλέον, το έργο FENICE προσφέρει ένα μοντέλο συνεργασίας μεταξύ ιδρυμάτων τριτοβάθμιας εκπαίδευσης και επιχειρήσεων για την προώθηση της δημιουργίας επιχειρήσεων στους κλάδους του πολιτισμού και της δημιουργικότητας μέσω φυτωρίων, νεοφυών επιχειρήσεων και της επιχειρηματικότητας. Το μοντέλο περιγράφει εφικτές εναλλακτικές συνεργασίες/συμπράξεις που μπορούν να εφαρμοστούν τόσο σε ιδιωτικά όσο και σε δημόσια ιδρύματα τριτοβάθμιας εκπαίδευσης. Περισσότερες πληροφορίες για το έργο και τα προϊόντα του μπορείτε να βρείτε στη σελίδα του έργου στη διεύθυνση fenice-project.eu και training.fenice-project.eu. Posted in: Ανακοινώσεις, Υλικό επικοινωνίας. Last Modified: 8 Ιουνίου, 2023"
