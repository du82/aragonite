["https://www.gunet.gr/el/crisiss-nl3"]
title = "CRISISS, Δελτίο Ενημέρωσης 3, Νοέμβριος 2022 – GUnet"
full_description = "CRISISS, Δελτίο Ενημέρωσης 3, Νοέμβριος 2022 Date: 10 Νοεμβρίου, 2022 Author: Pantelis Balaouras ΕΝΑ ΕΥΡΩΠΑΪΚΟ ΕΡΓΟ ΒΟΗΘΑ ΤΟΥΣ ΕΘΕΛΟΝΤΕΣ ΝΑ ΕΠΙΚΥΡΩΣΟΥΝ ΤΙΣ ΔΕΞΙΟΤΗΤΕΣ ΤΟΥΣ ΠΟΥ ΑΠΟΚΤΗΣΑΝ ΜΕ ΤΟΝ ΕΘΕΛΟΝΤΙΣΜΟ Σε περιόδους κρίσης, οι εθελοντές αποκτούν ήπιες δεξιότητες όπως ομαδικό πνεύμα, κριτική ικανότητα, επικοινωνιακές και διαπολιτισμικές δεξιότητες, ικανότητα διαχείρισης άγχους, πειθαρχία και αυτοπεποίθηση, κ.α. Κατά τη διάρκεια των τελευταίων κρίσεων, όπως της μεταναστευτικής κρίσης και της κρίσης της πανδημίας του COVID-19, ο εθελοντισμός αποδείχθηκε ένα αποτελεσματικό άτυπο περιβάλλον απόκτησης και ενίσχυσης των ήπιων κοινωνικών δεξιοτήτων (soft skills), οι οποίες μπορούν στη συνέχεια να χρησιμοποιηθούν και ως ένα πρόσθετο προσόν σε οποιοδήποτε επαγγελματικό περιβάλλον. Το Ευρωπαϊκό έργο CRISISS υποστηρίζει όλους εκείνους τους οργανισμούς εθελοντισμού που επιθυμούν να δίνουν τη δυνατότητα στους εθελοντές τους να καταγράφουν τις νεοαποκτηθείσες δεξιότητες παρέχοντας ένα εργαλείο για να αναγνωρίσουν τις ήπιες δεξιότητες που αποκτήθηκαν μέσω της εθελοντικής εργασίας και να τις καταγράψουν ως μέρος της προσωπικής ανάπτυξης. Δείτε περισσότερα εδώ. Posted in: Newsletter. Last Modified: 28 Δεκεμβρίου, 2022"
