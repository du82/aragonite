["https://www.gunet.gr/el/centaur-3"]
title = "Centaur – Ενημερωτικό Δελτίο – GUnet"
full_description = "Centaur – Ενημερωτικό Δελτίο Date: 2 Νοεμβρίου, 2022 Author: Pantelis Balaouras Noέμβριος 2022 3η δια ζώσης συνάντηση των εταίρωνΕίμαστε στην ευχάριστη θέση να ανακοινώσουμε ότι η 3η δια ζώσης συνάντηση των εταίρων πραγματοποιήθηκε στο Μόναχο της Γερμανίας, στις 3-4 Νοεμβρίου 2022. Σε αυτή τη διήμερη συνάντηση, εκπρόσωποι όλων των συμμετεχόντων οργανισμών είχαν τη δυνατότητα να συζητήσουν σχετικά με την πρόοδο του έργου, να διευκρινίσουν ζητήματα διαχείρισης του έργου καθώς και ζητήματα οικονομικής διαχείρισης, να αξιολογήσουν τα μέχρι τώρα αποτελέσματα, να θέσουν τις επόμενες ενέργειες και δραστηριότητες, και να οριστικοποιήσουν τις ημερομηνίες για τις επερχόμενες εκδηλώσεις (πολλαπλασιαστικές δράσεις και τελική συνάντηση). Με τις καλύτερες αναμνήσεις στις αποσκευές τους, όλοι οι εταίροι ανανέωσαν το ραντεβού τους για την τελική συνάντηση στην Αθήνα, στις 20-21 Φεβρουαρίου 2023. Κατεβάστε το Ενημερωτικό Δελτίο από εδώ. Posted in: Newsletter. Last Modified: 17 Μαρτίου, 2023"
