["https://www.gunet.gr/el/category/%cf%84%ce%b1-%ce%bd%ce%ad%ce%b1-%ce%bc%ce%b1%cf%82/newslettergr/page/2"]
title = "Newsletter – Σελίδα 2 – GUnet"
full_description = "CRISISS, Δελτίο Ενημέρωσης 2, Απρίλιος 2022 Date: 5 Απριλίου, 2022 Author: Pantelis Balaouras Αντικείμενο του έργου CRISISS Μέσα σε λίγες εβδομάδες, η κρίση του COVID – 19 οδήγησε τον τομέα της εθελοντικής εργασίας σε αλλαγές που για χρόνια φαινόντουσαν αδιανόητες και οι οποίες μετέτρεψαν τρέχουσες εξελίξεις που που παρήγαγαν ανησυχία προς το αντίθετο, έδωσαν ελπίδα. Παρόλο που δεν είναι διαθέσιμα δεδομένα κατά τη σύνταξη αυτής της πρότασης έργου, είναι ήδη δυνατό να πούμε με βεβαιότητα: Η εθελοντική εργασία και η συναφής ανάληψη ευθύνης από την κοινωνία των πολιτών έχουν αποκτήσει μια εντελώς νέα εκτίμηση.Τα εργαλεία που αναπτύχθηκαν για το σκοπό αυτό (όπως πλατφόρμες για την τοποθέτηση εθελοντών) αναπτύχθηκαν, ενεργοποιήθηκαν και χρησιμοποιήθηκαν ουσιαστικά “εν μία νυκτί” χάρη στις ψηφιακές τεχνολογίες. Οι άνθρωποι δεν είναι μόνο εθελοντές για την ευημερία των γειτόνων τους, αλλά επίσης συνδιαλέγονται με άτομα που δεν μπορούν να φύγουν από το σπίτι ή αναλάβουν υπηρεσίες αγορών. Αναλαμβάνουν επίσης δραστηριότητες που δεν έχουν καμία σχέση με την πραγματική τους εργασία: Εκείνοι που επηρεάζονται από το μειωμένο ωράριο εργασίας ή την έλλειψη παραγγελιών και εργασίας εμπλέκονται επίσης ως εθελοντές σε περιοχές εκτός του επαγγέλματός τους όπου απαιτείται επειγόντως υποστήριξη: στη φροντίδα, στη γεωργία ή σε η οικονομία της κινητικότητας. Δείτε περισσότερα για τους στόχους και τα εργαλεία που αναπτύσσει το έργο εδώ."
