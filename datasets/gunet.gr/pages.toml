title = "Υπηρεσία uGuest – GUnet"
full_description = "Υπηρεσία uGuest Η υπηρεσία προσωρινών λογαριασμών uGuest προσφέρει στα μέλη της GUNet ένα web περιβάλλον (προσβάσιμο τόσο από desktop, όσο και από κινητά) το οποίο αξιοποιεί την υποδομή IDM/SSO του GUNet και επιτρέπει τη δημιουργία απλών guest λογαριασμών και λογαριασμών εκδηλώσεων από χρήστες των ιδρυμάτων μέσω εύχρηστων διαδικασιών. Οι διαχειριστές των ιδρυμάτων έχουν τη δυνατότητα ορισμού πλήθους μεταβλητών όπως των κατηγοριών χρηστών που θα έχουν πρόσβαση στο εργαλείο και το πόσες μέρες θα διατηρούνται ενεργοί οι κωδικοί κτλ. Η λήξη των κωδικών γίνεται αυτοματοποιημένα από την υπηρεσία IDM. Το εργαλείο διασυνδέεται με υπηρεσίες E-Mail και SMS για την αποστολή στοιχείων των λογαριασμών. Παράλληλα, η υπηρεσία RADIUS που παρέχει το GUNet διαλειτουργεί με τη νέα υπηρεσία και υπάρχει η δυνατότητα ορισμού ξεχωριστού VLAN και named ACL για τους λογαριασμούς που δημιουργεί η υπηρεσία προκειμένου να είναι περισσότερο απομονωμένη και ελεγχόμενη η πρόσβαση τους στο διαδίκτυο. Τα logs της υπηρεσίας είναι διαθέσιμα στους διαχειριστές μέσω της υπηρεσίας uSIEM. Οι διαχειριστές της υπηρεσίας έχουν πρόσβαση σε επιπλέον δυνατότητες οι οποίες περιλαμβάνουν: Περιβάλλον διαχειριστή με πρόσβαση στο σύνολο των λογαριασμών χρηστών που δημιουργεί η υπηρεσίαΔυνατότητα δημιουργίας μακροπρόθεσμων λογαριασμών με ημερομηνία λήξης μέχρι και ένα έτος για χρήση από περιπτώσεις χρηστών που δεν έχουν καταχώριση στις τυπικές πηγές λογαριασμών (μισθοδοσία, ΕΛΚΕ κτλ)Cron jobs για την εκτέλεση ενεργειών για συγκεκριμένους χρήστες (πχ αλλαγή password, αυτοματοποιημένη ανανέωση λογαριασμού) Για επικοινωνία σχετικά με την υπηρεσία τα μέλη της GUNet μπορούν να απευθύνονται στη διεύθυνση email radius@gunet.gr Ακολουθούν τυπικά screenshots της υπηρεσίας:"
