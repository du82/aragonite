title = "Καταχωρητής Domains .gr – GUnet"
full_description = "Καταχωρητής Domains .gr Η αστική μη κερδοσκοπική εταιρία GUnet έχει συμπεριληφθεί στον κατάλογο των εξουσιοδοτημένων από την ΕΕΤΤ Καταχωρητών όσο αφορά στη διαχείριση Ονομάτων Χώρου (domain name) με κατάληξη .gr. Ανανέωση υπάρχοντος Ονόματος Χώρου Μεταβίβαση υπάρχοντος Ονόματος Χώρου Αλλαγή Καταχωρητή Καταχώρηση νέου Ονόματος Χώρου Τιμολογιακή Πολιτική για Ονόματα Χώρου .gr Η τιμολογιακή πολιτική της GUnet όσο αφορά τα Ελληνικά Ονόματα Χώρου έχει ως εξής: Αλλαγή καταχωρητή: Χωρίς κόστος Πανεπιστήμια μέλη της εταιρείας: Χωρίς κόστος Ερευνητικά Ινστιτούτα και Ερευνητικοί φορείς : 20 Ευρώ + ΦΠΑ για 2 έτη Λοιποί : 44 Ευρώ + ΦΠΑ (εκχωρήσεις, μεταβιβάσεις) και 29,30 + ΦΠΑ (ανανεώσεις) για 2 έτη Καταχωρήσεις και ανανεώσεις ονομάτων χώρου δύο (2) χαρακτήρων με κατάληξη .gr: 550 Ευρώ + ΦΠΑ για 2 έτη Τρόποι εξόφλησης Με μετρητά στη Γραμματεία της Εταιρείας, (Κέντρο Λειτουργίας και Διαχείρισης Δικτύου Πανεπιστημίου Αθηνών, Πανεπιστημιούπολη, Κτήριο Τμήματος Πληροφορικής, Εργάσιμες μέρες και ώρες). Με κατάθεση στον Τραπεζικό Λογαριασμό GR4202602860000140200029927 Eurobank/Ergasias Το καταθετήριο θα πρέπει αναγράφει την αιτιολογία (π.χ Καταχώρηση Ονόματος Χώρου xxxxxx.gr) και την επωνυμία της εταιρίας ή το όνομα του ιδιώτη, έτσι όπως ακριβώς θα τιμολογηθεί Σημαντικές πληροφορίες Ένας από τους πιο κοινούς λόγους απόρριψης κάποια αίτησης είναι η ελλιπής συμπλήρωσή της (πχ. πεδίο “Σύντομη περιγραφή”). H χρονική προτεραιότητα των αιτήσεων που υποβάλλουν οι καταχωρούμενοι διασφαλίζεται μόνο με την πρωτοκόλληση των αιτήσεων από το Μητρώο και όχι με την υποβολή τους στον Καταχωρητή Το προσωπικό της GUnet διαβιβάζει τις αιτήσεις προς το Μητρώο, αν όλες οι προϋποθέσεις πληρούνται, το συντομότερο δυνατό και σε κάθε περίπτωση νωρίτερα από το μέγιστο επιτρεπόμενο χρονικό διάστημα που προβλέπει η ΕΕΤΤ. H GUnet υποχρεούται να υποβάλει στην ΕΕΤΤ έκθεση για κάθε όνομα για το οποίο κρίνει ότι εμπίπτει σε κάποιον από τους απόλυτους λόγους μη Εκχώρησης σύμφωνα με το άρθρο 5 της απόφασης 268/73 της ΕΕΤΤ. Για οποιαδήποτε άλλη πληροφορία επικοινωνήστε με το domains (at) gunet (dot) gr."
