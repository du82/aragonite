title = "SOCRATEST – GUnet"
full_description = "SOCRATEST Date: 3 Μαΐου, 2021 Author: Pantelis Balaouras Soft Skills & Creativity Assessment and Testing for Volunteers in Times of Crisis 14 Μαίου 2021 Το 2020, η πανδημία Covid-19 οδήγησε σε πρωτοφανείς προκλήσεις όχι μόνο στην υγειονομική περίθαλψη και την οικονομία, αλλά και στο επίπεδο των ανθρώπινων γνωστικών, συμπεριφορικών και επιχειρησιακών δεξιοτήτων. Αυτή η «νέα κανονικότητα» μπορεί να περιγραφεί με το ακρωνύμιο ΤΑΠΑ: ταχύτητα, αβεβαιότητα, πολυπλοκότητα και ασάφεια. Σε αυτόν τον κόσμο των συνεχών, απρόβλεπτων και εκτεταμένων αλλαγών, απαιτούνται νέοι τρόποι σκέψης και νέες ατομικές και οργανωτικές δεξιότητες για την αντιμετώπιση αυτών των προκλήσεων. Η κρίση του Corona οδήγησε επίσης, ιδιαίτερα σε περιόδους αποκλεισμού και σε περιοχές που πλήττονται περισσότερο από την πανδημία, σε εξελίξεις στον τομέα της εθελοντικής εργασίας που για χρόνια φαίνονταν αδιανόητες: Η εθελοντική εργασία και η συνακόλουθη ανάληψη ευθύνης στην κοινωνία των πολιτών έχουν αποκτήσει μια εντελώς νέα εκτίμηση. Οι άνθρωποι όχι μόνο προσφέρονται εθελοντικά για την ευημερία των γειτόνων τους, ή προσφέρουν αλληλεπίδραση με ανθρώπους που δεν μπορούν να φύγουν από το σπίτι ή να αναλάβουν υπηρεσίες αγορών. Αναλαμβάνουν επίσης δραστηριότητες που δεν έχουν καμία σχέση με την πραγματική τους δουλειά όπου απαιτείται επειγόντως υποστήριξη: στη φροντίδα, στη γεωργία, στην οικονομία κινητικότητας ή στον δημιουργικό τομέα που πλήττεται οικονομικά και οικονομικά από την πανδημία Covid-19. Ανεξάρτητα από το πόσο διαφορετικοί είναι οι εθελοντές ως προς το επαγγελματικό τους υπόβαθρο, έχουν ένα κοινό: Ο εθελοντισμός είναι ένας τρόπος απόκτησης νέων δεξιοτήτων όπως το ομαδικό πνεύμα, η γνωστική ενσυναίσθηση, οι δεξιότητες επικοινωνίας, η διαπολιτισμική επάρκεια, η διαχείριση άγχους, η πειθαρχία, και η αυτοπεποίθηση. Ο εθελοντισμός είναι ένα αποτελεσματικό περιβάλλον μάθησης, ειδικά για εκείνους τους ανθρώπους που έπρεπε να συνειδητοποιήσουν ότι η επαγγελματική τους δραστηριότητα δεν έχει σε καμία περίπτωση συστηματική σχέση όσον αφορά τη διαχείριση κρίσεων. Για να είμαστε ακριβείς, ο εθελοντισμός είναι μια μεγάλη ευκαιρία, δηλαδή η απόκτηση και η επικύρωση ήπιων δεξιοτήτων και στη συνέχεια η δυνατότητά τους να τις χρησιμοποιήσουν σε μεταγενέστερα επαγγελματικά περιβάλλοντα ως πρόσθετα προσόντα. Ωστόσο, πώς μπορεί ένας εθελοντής να αναγνωρίσει και να επικυρώσει αυτές τις νέες δεξιότητες; Πώς μπορεί ένας εργοδότης να γνωρίζει ότι οι δημιουργικές και πολιτισμικές δεξιότητες μπορούν να αποτελέσουν προστιθέμενη αξία σε καταστάσεις άγχους ή για τη δημιουργία ομάδων ή για διαπολιτισμικά καθήκοντα; Κατά συνέπεια, είναι απολύτως θεμελιώδες να επικυρώσουμε σωστά αυτές τις «ήπιες δεξιότητες», δηλαδή τις νέες προσωπικές ικανότητες. Οι “ήπιες δεξιότητες” μπορούν να κάνουν τη διαφορά στην επαγγελματική ζωή και μπορούν να εξοπλίσουν τους νέους και τους ενήλικες ώστε να βρουν δημιουργικές και καινοτόμες λύσεις για την αντιμετώπιση πρωτοφανών κινδύνων, κοινωνικών προκλήσεων καθώς και για να αποκαλύψουν ευκαιρίες που μπορούν να απαιτηθούν σε ένα κρίσιμο πλαίσιο. Ως εκ τούτου, ο γενικός στόχος του έργου SOCRATEST είναι να παράσχει στους οργανισμούς που απασχολούν εθελοντές υποστήριξη και καθοδήγηση για την εφαρμογή εσωτερικών συστημάτων αναγνώρισης ήπιων δεξιοτήτων και δυναμικού δημιουργικότητας, προκειμένου να ενδυναμωθούν οι εθελοντές για την ανάπτυξη των δεξιοτήτων και των ικανοτήτων τους που ενισχύουν τη δημιουργικότητα και την ευελιξία σε εργασιακά περιβάλλοντα που χαρακτηρίζονται από ταχύτητα, αβεβαιότητα, πολυπλοκότητα και ασάφεια. Για την επίτευξη του στόχου αυτού, οι ειδικοί στόχοι είναι: η δημιουργία εργαλείων για την αναγνώριση και την αξιολόγηση των ήπιων δεξιοτήτων και της δημιουργικότητας, προκειμένου να υποστηριχθούν οι εθελοντές προς την αναγνώριση και την επικύρωση των δικών τους ήπιων δεξιοτήτων,η αύξηση της ευαισθητοποίησης για τη σημασία των ήπιων δεξιοτήτων στην επαγγελματική ζωή και η αναγνώριση των άτυπων και μη τυπικών ικανοτήτων μέσω της συγκέντρωσης αποδεικτικών στοιχείωνη ανάπτυξη εργαλείων αυτοπροώθησης που θα βοηθούν τους εθελοντές στην προώθηση των ήπιων δεξιοτήτων τους που έχουν αποκτήσει στον εθελοντισμό και θα παρέχουν τα μέσα που χρειάζονται για την αποτελεσματική παρουσίαση και αξιοποίηση των ήπιων δεξιοτήτων τους・η διάθεση του υλικού διαδικτυακά μέσω μιας πολύγλωσσης και διαδραστικής ηλεκτρονικής πλατφόρμας και εφαρμογών για κινητά τηλέφωνα για έξυπνα τηλέφωνα, όπου τμήμα του υλικού θα είναι επίσης διαθέσιμα ως podcasts ή θα μπορούν να ενεργοποιηθούν από έξυπνους οικιακούς βοηθούς φωνής όπως η Alexa ή η Siri. Το SOCRATEST στοχεύει σε χώρες της ΕΕ που υποφέρουν περισσότερο από την πανδημία, μεταξύ των οποίων η Ιταλία, η Πορτογαλία, η Αυστρία και η Ελλάδα. Η διακρατική συνεργασία θα επωφεληθεί από τις διάφορες εμπειρίες και ικανότητες της σύμπραξης που αποτελείται από κοινωνικούς εταίρους, ιδρύματα που εργάζονται με εθελοντές, οργανώσεις που εργάζονται με άτομα με αναπηρίες, ενώσεις του δημιουργικού και πολιτιστικού τομέα, ινστιτούτα εκπαίδευσης ενηλίκων, κέντρα κοινωνικής έρευνας και εμπειρογνώμονες ΤΠΕ για την ανάπτυξη ανοιχτών εκπαιδευτικών πόρων (ΟΑΕ). Οι κύριες ομάδες-στόχοι του έργου μας είναι οργανώσεις που απασχολούν εθελοντές στην καθημερινή τους εργασία. Η δευτερεύουσα ομάδα-στόχος είναι οι ίδιοι οι εθελοντές που θα είναι σε θέση να χρησιμοποιήσουν τα εργαλεία αξιολόγησης και προώθησης και για τους οποίους η οπτικοποίηση, η τεκμηρίωση και η αναγνώριση των τυπικά, μη τυπικά και ανεπίσημα αποκτηθεισών ήπιων δεξιοτήτων και δυνατοτήτων δημιουργικότητας θα τους παρέχει ευκαιρίες για την προσωπική, κοινωνικοεκπαιδευτική και επαγγελματική τους ανάπτυξη. Ιστότοπος έργου: https://socratest.eu/ Posted in: Αναπτυξιακά Έργα/Δράσεις. Last Modified: 18 Απριλίου, 2022"
