title = "ENTER EdTech – GUnet"
full_description = "ENTER EdTech Date: 1 Μαρτίου, 2021 Author: Pantelis Balaouras ENTER_EdTech: Entering the EdTech Entrepreneurship World Περιγραφή Το σύστημα διδασκαλίας και μάθησης του 21ου αιώνα εξελίσσεται για να ανταποκριθεί στις παγκόσμιες προκλήσεις της οικονομικής ανταγωνιστικότητας, στην ανάγκη για μεγαλύτερη εστίαση στην εκπαιδευτική ισότητα και στη ζήτηση για αποτελεσματικές εκπαιδευτικές λύσεις και βελτιωμένη απόδοση των επενδύσεων. Ωστόσο, η εκπαίδευση είναι ένας απρόβλεπτος κλάδος. Αν κάποιος ξεκινά μια εταιρία στο χώρο της εκπαιδευτικής τεχνολογίας (EdTech) πρέπει να είναι προετοιμασμένος για τις συγκεκριμένες προκλήσεις που θα αντιμετωπίσει, ενώ προσπαθεί να εισέλθει σε αυτήν την αγορά. Ταυτόχρονα, η βιομηχανία EdTech έχει εκραγεί σε τεράστιο βαθμό, ο ανταγωνισμός είναι τεράστιος και για να ξεχωρίσει κάποιος πρέπει να είναι μοναδικός με πολλούς τρόπους. Παρ ‘όλα αυτά, το ευρωπαϊκό οικοσύστημα επιχειρηματικότητας EdTech χρειάζεται μεγάλη υποστήριξη, δεδομένου ότι είναι λιγότερο προηγμένο από αυτό στις ΗΠΑ ή την Κίνα. Το πρόγραμμα ENTER βρίσκεται στην πρώτη γραμμή αυτής της πρόκλησης, βελτιώνοντας την ποιότητα της επιχειρηματικής εκπαίδευσης γύρω από το EdTech, συγκεντρώνοντας ακαδημαϊκούς και βιομηχανικούς συνεργάτες με επιχειρηματική εμπειρία και με εξειδίκευση στις εκπαιδευτικές τεχνολογίες και τις παιδαγωγικές μάθησης, με στόχο να ενδυναμώσει προπτυχιακούς και μεταπτυχιακούς φοιτητές, μέλη ΔΕΠ, ερευνητές, εκπαιδευτικούς καθώς και αποφοίτους πανεπιστημίου να γίνουν επιχειρηματίες του EdTech. Θα δημιουργηθεί ένα καινοτόμο πρόγραμμα σπουδών και ένα σύνολο συμπληρωματικών υπηρεσιών, όπως ένα δίκτυο έμπειρων συμβούλων και των κόμβων καινοτομίας μάθησης, για να βοηθήσει το κοινό-στόχο να βελτιώσει τις επιχειρηματικές δεξιότητές τους, μέσω της αναγνώρισης επιχειρηματικών ευκαιριών και της επικύρωσης των επιχειρηματικών υποθέσεων τους στον χώρο EdTech. Απώτερος στόχος του ENTER είναι η βελτίωση: α) των δεξιοτήτων και τις γνώσεων των νέων επιχειρηματιών που ενδιαφέρονται για την αγορά EdTech, χρησιμοποιώντας βέλτιστες πρακτικές από την παιδαγωγική, την τεχνολογία και την επιχειρηματικότητα, β) της ποιότητα των καινοτόμων και επιδραστικών προϊόντων EdTech και, τελικά, c) του αριθμού των νέων επιχειρήσεων EdTech στην Ευρώπη που αναπτύσσονται εκθετικά, προς όφελος διαφορετικών εκπαιδευόμενων και οργανισμών που αντιμετωπίζουν πραγματικές ανάγκες μάθησης/διδασκαλίας και την οικονομία της ΕΕ γενικότερα. Το ακρωνύμιο ENTER (Enter Acronym) προέρχεται από τις λέξεις Entering the EdTech entrepreneurial world. Ιστοσελίδα: https://www.enteredtech.eu Posted in: Αναπτυξιακά Έργα/Δράσεις. Last Modified: 19 Σεπτεμβρίου, 2021"
