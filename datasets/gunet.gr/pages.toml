title = "Πολιτική Ποιότητας – GUnet"
full_description = "Πολιτική Ποιότητας Η εταιρεία βασιζόμενη στην πείρα και την τεχνογνωσία που διαθέτει, στοχεύει στη συνεχή βελτίωση των υπηρεσιών της ιδιαίτερα στη διαχείριση συγχρηματοδοτούμενων έργων επενδύοντας σε έμπειρο και εξειδικευμένο προσωπικό, τηρώντας την ισχύουσα νομοθεσία, με επίκεντρο πάντα την πλήρη ικανοποίηση των υφιστάμενων αλλά και μελλοντικών αναγκών και απαιτήσεων των πελατών και λοιπών ενδιαφερόμενων μερών της. Για το λόγο αυτό, η εταιρεία εγκατέστησε ένα Σύστημα Διαχείρισης Ποιότητας στις υπηρεσίες διαχείρισης συγχρηματοδοτούμενων έργων που είναι σύμφωνο με τις απαιτήσεις του ISO 9001:2015 και δεσμεύεται στην τήρηση συγκεκριμένων διεργασιών, ουσιαστική επικοινωνία με τους πελάτες της, συνεχή βελτίωση των παρεχόμενων υπηρεσιών, εκπαίδευση του ανθρώπινου δυναμικού, παρακολούθηση της ροής υπηρεσιών που παρέχει και την ελαχιστοποίηση των παραπόνων των πελατών της και λοιπών ενδιαφερόμενων μερών, προβαίνοντας στις κατάλληλες διορθωτικές ενέργειες. Η συμβολή των ενδιαφερόμενων μερών της εταιρείας, αναφορικά με την ποιότητα, είναι απαραίτητη και αναγνωρίζεται ότι η ικανοποίηση και η βελτίωση των στόχων που έχουν τεθεί μπορεί να επιτευχθεί μόνο με συνεχή προσπάθεια και τη διαρκή βελτίωση του ίδιου του Συστήματος Διαχείρισης Ποιότητας. Η GUnet δίνει μεγάλη σημασία στην υποστήριξη του Συστήματος Διαχείρισης Ποιότητας και στο να εξασφαλίζει τις απαραίτητες γνώσεις στο προσωπικό, αξιοποιώντας τις δεξιότητες και τις ικανότητες του. Η GUnet παρακινεί και υποστηρίζει την επικοινωνία, τη συμμετοχή και τη δημιουργικότητα γιατί η παροχή ποιοτικών υπηρεσιών και η επιτυχής λειτουργία της εταιρείας βασίζεται στους ανθρώπους της. Η Διοίκηση"
