title = "CRISISS, Δελτίο Τύπου, Απρίλιος 2021 – GUnet"
full_description = "CRISISS, Δελτίο Τύπου, Απρίλιος 2021 Date: 2 Απριλίου, 2021 Author: Pantelis Balaouras CRISSIS – Soft Skills Assessment and Competence Validation for Volunteers in Transnational Crisis Ευκαιρίες από την πανδημία CRISISS – το έργο καταγράφει και αξιολογεί κοινωνικές ικανότητες σε εθελοντές Στην πανδημία Covid 19, άνθρωποι σε όλη την Ευρώπη έχουν δεσμευτεί να προσφέρουν εθελοντικά, σε μεγάλη κλίμακα, τη βοήθεια τους σε γείτονες και σε άτομα που έχουν ανάγκη. Ο εθελοντισμός και η ανάληψη ευθύνης στην κοινωνία των πολιτών γνώρισαν μια απολύτως νέα αποδοχή. Το Ευρωπαϊκό έργο CRISISS στοχεύει στην καταγραφή και την αξιολόγηση των κοινωνικών δεξιοτήτων που αποκτήθηκαν από εθελοντές για να τις καταστήσουν ορατές και χρησιμοποιήσιμες ως ειδικές ικανότητες. Οι άνθρωποι αφοσιώνονται στην ευημερία των γειτόνων τους, παρέχουν υπηρεσίες αγορών για ηλικιωμένους και άτομα με ειδικές ανάγκες που δεν μπορούν να βγουν από τα σπίτια τους ή αναλαμβάνουν κάποιες καθημερινές δραστηριότητες για αυτούς. Ειδικά στην αρχή της πανδημίας, ανέλαβαν καθήκοντα που δεν είχαν καμία σχέση με το πραγματικό τους επάγγελμα ή την κατάρτιση, π.χ. στον τομέα της φροντίδας και της γεωργίας. Όσο διαφορετικό και αν είναι το επαγγελματικό υπόβαθρο των εθελοντών, έχουν ένα κοινό στοιχείο: Ο εθελοντισμός σε περιόδους πανδημίας αποδεικνύεται να είναι μία ευκαιρία για την αντιμετώπιση της μειωμένης απασχόλησης και της απώλειας εισοδήματος, μία ευκαιρία να είναι κάποιος κοινωνικά δραστήριος και να αισθάνεται μέρος της κοινωνίας των πολιτών. Οι εθελοντές αποκτούν «κοινωνικές» δεξιότητες, τις λεγόμενες «ήπιες δεξιότητες», όπως ομαδικό πνεύμα, δεξιότητες επικοινωνίας, διαπολιτισμική ικανότητα, διαχείριση στρες, πειθαρχία και αυτοπεποίθηση. Ο εθελοντισμός αποδεικνύεται ότι είναι ένα αποτελεσματικό μαθησιακό περιβάλλον. «Στην πραγματικότητα, ο εθελοντισμός είναι μια μεγάλη ευκαιρία για απόκτηση «κοινωνικών» δεξιοτήτων για να μπορέσετε να τις χρησιμοποιήσετε ως πρόσθετο προσόν σε οποιοδήποτε επαγγελματικό περιβάλλον», αναφέρει ο Δρ. Παντελής Μπαλαούρας από το Ακαδημαϊκό Διαδίκτυο (GUnet), ο οποίος είναι επικεφαλής του Ευρωπαϊκού προγράμματος CRISISS στην Ελλάδα. Το Έργο «CRISISS – Αξιολόγηση ήπιων, μη τεχνικών, δεξιοτήτων (soft skills) και επικύρωση ικανοτήτων για εθελοντές σε διακρατική κρίση» θα αναπτύξει ένα εκπαιδευτικό πρόγραμμα έως το φθινόπωρο του 2024 για να βοηθήσει τους εθελοντές να κατανοήσουν τις «ήπιες, μη τεχνικές» δεξιότητές τους που αποκτήθηκαν μέσα στην πανδημία. Ήπιες δεξιότητες ως πρόσθετο επαγγελματικό προσόν Αλλά πώς μπορούν οι εθελοντές να αναγνωρίσουν αυτές τις νέες δεξιότητες; Πώς μπορούν οι εργοδότες να ενημερωθούν για αυτές τις δεξιότητες ως προστιθέμενη αξία για ομαδική εργασία, καταστάσεις άγχους ή διαπολιτισμικές εργασίες; Αυτό είναι δυνατό μόνο εάν επιβεβαιωθούν αυτές οι νέες προσωπικές ικανότητες. Επειδή είναι οι «ήπιες δεξιότητες» που μπορούν να κάνουν τη διαφορά στην επαγγελματική ζωή. Ως εκ τούτου, ο πρωταρχικός στόχος του έργου CRISISS είναι να παρέχει υποστήριξη σε οργανισμούς που απασχολούν εθελοντές, να βοηθήσουν τους εθελοντές να αναγνωρίσουν και να εκτιμήσουν τις ήπιες δεξιότητές τους που πρόσφατα απέκτησαν. Για το σκοπό αυτό, το CRISISS αναπτύσσει εργαλεία για την αναγνώριση και την επικύρωση των ήπιων δεξιοτήτων που σχετίζονται άμεσα με τη διαχείριση πανδημιών. Αυτές οι ικανότητες πρέπει να τεκμηριώνονται με τέτοιο τρόπο ώστε, για παράδειγμα, να είναι κατανοητές και ευαπόδεικτες για τους εργοδότες. «Η κοινωνική δέσμευση στην πανδημία θα πρέπει επομένως να προσφέρει προστιθέμενη αξία για τους εθελοντές στην αγορά εργασίας», αναφέρει ο κ. Μπαλαούρας, ο οποίος συνεργάζεται με συναδέλφους από 7 Ευρωπαϊκά ιδρύματα για την ανάπτυξη ενός προγράμματος συλλογής και τεκμηρίωσης για εθελοντές. Συμμετέχουν, εθελοντικοί οργανισμοί, ιδρύματα ΑΜΕΑ, οργανισμοί νεολαίας και οικογενειακής συμβουλευτικής, κοινωνικοί εταίροι, ιδρύματα εκπαίδευσης ενηλίκων, κέντρα κοινωνικής έρευνας και εμπειρογνώμονες στην ανάπτυξη ψηφιακών εκπαιδευτικών πόρων. “Με αυτό, θέλουμε να προσφέρουμε σε οργανισμούς που απασχολούν εθελοντές στην καθημερινή τους εργασία, μια ευκαιρία να προσφέρουν στα άτομα που έχουν ‘δεσμευθεί’ μία προστιθέμενη αξία από αυτή την κοινωνική τους δέσμευση”, αναφέρει ο κ. Μπαλαούρας. Οι εθελοντές μπορούν να χρησιμοποιήσουν τα εργαλεία επικύρωσης για να οπτικοποιήσουν, να τεκμηριώσουν και να αναγνωρίσουν τις κοινωνικές ικανότητες στον τομέα του εθελοντισμού κατά τη διάρκεια της πανδημίας, προκειμένου να βελτιώσουν τις ευκαιρίες σταδιοδρομίας και την προσωπική τους ανάπτυξη. Περισσότερες πληροφορίες: Δρ. Παντελής Μπαλαούρας p.balaouras [at] gunet.gr Posted in: Υλικό επικοινωνίας. Last Modified: 17 Σεπτεμβρίου, 2021"
