["https://www.gunet.gr/el/crisiss-pr2"]
title = "CRISISS Δελτίου Τύπου 2, Δεκέμβριος 2022 – GUnet"
full_description = "CRISISS Δελτίου Τύπου 2, Δεκέμβριος 2022 Date: 21 Δεκεμβρίου, 2022 Author: Pantelis Balaouras Το ευρωπαϊκό έργο CRISISS – Αξιολόγηση κοινωνικών δεξιοτήτων και Επικύρωση ικανοτήτων για Εθελοντές σε Διεθνική Κρίση ολοκληρώνεται στο τέλος του Δεκεμβρίου 2022. Το έργο ανέπτυξε ένα σύνολο εργαλείων που απευθύνονται σε εθελόντριες και εθελοντές καθώς και σε οργανισμούς που τις/τους απασχολούν. Το κύριο εργαλείο που παρέχεται είναι το εργαλείο αυτοαξιολόγησης (CRISISS Soft-Skills Self-Assessment Tool) των ήπιων, μη τεχνικών, κοινωνικών δεξιοτήτων που αποκτούν ή ενισχύουν οι εθελοντές κατά την συμμετοχή τους σε εθελοντικά προγράμματα. Είναι διαθέσιμο στον σύνδεσμο εδώ. To εν λόγω εργαλείο παρέχει στις εθελόντριες και τους εθελοντές τη δυνατότητα να αναγνωρίζουν και καταγράφουν τις νεοαποκτηθείσες δεξιότητες τους ως μέρος της προσωπικής τους ανάπτυξης. Επιπλέον της αναγνώρισης των δεξιοτήτων, τo Εργαλείο παρέχει, δωρεάν, σε έναν/μία εθελοντή/εθελόντρια ένα πιστοποιητικό το οποίο αποτελεί ένα είδος «αυτό-αξιολόγησης» των ήπιων δεξιοτήτων του/της και το οποίο μπορεί να ενσωματωθεί στα έγγραφα της αίτησης κάλυψης μιας θέσης εργασίας. To δεύτερο εργαλείο είναι το εργαλείο αυτοπροώθησης για εθελοντική συμμετοχή που έχει σκοπό να δώσει στους εθελοντές μια πληθώρα ιδεών για το πώς να χρησιμοποιήσουν τις δεξιότητες που έχουν αποκτήσει σε κρίσεις και να παράσχει πρόσβαση μέσω ψηφιακών πηγών σε άλλα εργαλεία που χρησιμοποιούνται ήδη σε όλη την Ευρώπη. Είναι διαθέσιμο εδώ. Επιπλέον, των δύο εργαλείων, έχει αναπτυχθεί μία πολυμεσική βιβλιοθήκη όπου εξηγούνται οι κύριες ήπιες κοινωνικές δεξιότητες. Οι επεξηγήσεις είναι διαθέσιμες τόσο σε ηχητική μορφή όσο και σε μορφή κειμένου. Οι τελευταίες, συμπεριλαμβάνονται ως σύνδεσμοι στα αποτελέσματα που εξάγει το εργαλείο αυτοαξιολόγησης. Τέλος, έχουν αναπτυχθεί δύο εφαρμογές. Η πρώτη είναι μία Mobile App και η δεύτερη μία εφαρμογή Alexa η οποία μπορεί να αξιοποιηθεί από συσκευές που υποστηρίζουν το Alexa. Συνδεθείτε στην πλατφόρμα https://tools.crisiss.eu για να επισκεφτείτε τα εργαλεία, την πολυμεσική βιβλιοθήκη και κατεβάσετε τις εφαρμογές. Μάθετε περισσότερα παρακολουθώντας το βίντεο της σχετικής εκδήλωσης στο σύνδεσμο εδώ. Website: www.crisiss.eu, https://tools.crisiss.eu Posted in: Υλικό επικοινωνίας. Last Modified: 28 Δεκεμβρίου, 2022"
