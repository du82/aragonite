title = "The European Heart Project – GUnet"
full_description = "The European Heart Project Date: 7 Απριλίου, 2021 Author: Pantelis Balaouras Από την 1/9/2020 η ΔΔΕ Ανατ. Αττικής μαζί με το Ακαδημαϊκό Διαδίκτυο (GUnet) συμμετέχουν ως εταίροι στο έργο με τίτλο: “EU HEART: The European Heart Project – Strengthening democratic values on the basis of basic human needs”. Το έργο υλοποιείται με συγχρηματοδότηση από το πρόγραμμα «Erasmus +» της Ευρωπαϊκής Ένωσης και ανήκει στην κατηγορία για τις Στρατηγικές Συμπράξεις για την Ανάπτυξη Καινοτομίας στον Τομέα της Σχολικής Εκπαίδευσης (ΚΑ2), με τη συμμετοχή και από άλλες χώρες όπως η Αυστρία, η Γαλλία και η Σουηδία. Σύντομη Περιγραφή Το έργο στοχεύει στην ευαισθητοποίηση των πολιτών στα πλαίσια της Ευρωπαϊκής Ένωσης, την κοινωνική, πολιτιστική και ιστορική της κληρονομιά, επιτρέποντας στους ανθρώπους να αναπτύξουν μια προσωπική και συναισθηματική σχέση με τις ευρωπαϊκές αξίες ώστε να αντιμετωπίσουν και να ξεπεράσουν τις μεγάλες κοινωνικές προκλήσεις της εποχής μας. Έχει παρατηρηθεί ότι τα φαινόμενα της οικονομικής κρίσης και της αύξησης των δεξιών λαϊκιστικών τάσεων στα κράτη μέλη της Ένωσης, απειλούν όλο και περισσότερο την εμπέδωση των κοινών αξιών της ΕΕ, την αρχή της ενότητας και της διαφορετικότητας, καθώς και την κοινωνική, πολιτιστική και ιστορική κληρονομιά της. Μελέτες δείχνουν ότι οι ακροδεξιές εξτρεμιστικές συμπεριφορές δεν εμφανίζονται μόνο σε κοινωνικές ομάδες με ελλιπή εκπαίδευση, αλλά επηρεάζουν το σύνολό της κοινωνία. Το έργο EU Heart εστιάζει σε βασικές ανάγκες θέτοντας ως σημείο έναρξης το επίπεδο της ισότητας όλων των ανθρώπων. Το έργο μέσα από τη συμμετοχή σε αυτό των μαθητών, των δασκάλων και των καθηγητών θα καλλιεργήσει θα αναπτύξει μια ενσυναισθητική προσέγγιση στους εμπλεκόμενους, τόσο για τον εαυτό τους, όσο και για τους άλλους και ταυτόχρονα να αποκτήσουν μια κρίσιμη απόσταση από τη συναισθηματική τύπου ρητορική. Οι αξίες και τα επιτεύγματα της δημοκρατίας μας γίνονται αντιληπτά υπό το νέο φως και κατανοούνται όχι μόνο με το νου αλλά και με την καρδιά. Η εμπλοκή και η συμμετοχή της κοινωνίας των πολιτών, μέσα από τις δομές της εκπαίδευσης εδραιώνεται από τον ενθουσιασμό για τις κοινές αξίες, η σημασία των οποίων γίνεται προσωπική μέριμνα. Στα πλαίσια του έργου θα παραχθεί εκπαιδευτικό υλικό, όπου μαθητές και δάσκαλοι μαθαίνουν ποιες εσωτερικές-προσωπικές διαδικασίες οδηγούν σε στρατηγικές δράσης και πώς μπορούν να σχεδιαστούν σε ένα ευεργετικό, μέλλον προσανατολισμένο στη δημόσια ευημερία. Οι μαθητές που θα συμμετέχουν στο έργο ή θα αξιοποιήσουν το υλικό αυτό στο μέλλον εκπαιδεύονται σε βασικούς άξονες, όπως: Κοινωνικές και διαπολιτισμικές ικανότητες, συμμετοχή σε διάλογο με άλλους στο επίπεδο των βασικών αναγκών.Αυτο-ενσυναίσθηση και ρύθμιση συναισθημάτων.Να κάνουν τη διάκριση ανάμεσα στις προσαρμοστικές και μη προσαρμοστικές στρατηγικές.Να αναπτύσσουν προσαρμοστικές και λειτουργικές στρατηγικές.Κριτική σκέψη και ικανότητα στη χρήση των μέσων ενημέρωσης.Συμμετοχή στο πολιτικό γίγνεσθαι. Στα οφέλη που αναμείνουμε συγκαταλέγονται τα ακόλουθα: Ενσωμάτωση μέσω της ενίσχυσης των κοινών αξίων και την αίσθηση του ανήκειν των μαθητών και των εκπαιδευτικών.Μείωση της ετοιμότητας για χρήση βίας μέσω του προβληματισμού σχετικά με τις ανάγκες και τις στρατηγικές κάποιου.Μείωση της ευαισθησίας των νέων σε χειραγώγηση, προπαγάνδα και ψεύτικες ειδήσεις.Ενεργοποίηση των νέων στην ενεργό δημοκρατική συμμετοχή.Περισσότεροι νέοι να κατανοούν «από την καρδιά» το πλαίσιο της Ευρωπαϊκής Ένωσης, ιδίως όσον αφορά τις κοινές αξίες της ΕΕ. Πιο αναλυτικά, το έργο πρόκειται να αναπτύξει τις ακόλουθες δράσεις – άξονες: Υλικό εργασίας (IO1): «Ανθρώπινες ανάγκες, προσαρμοστικές και μη προσαρμοστικές στρατηγικές για την εκπλήρωσή τους».Με βάση τις πέντε ανάγκες του William Glasser και τα στοιχεία της μη βίας επικοινωνίας του Marshall Rosenberg, θα αναπτυχθεί μια βιωματική ιδέα για να εξερευνήσει τις ανάγκες του εαυτού μας, αλλά και τις ανάγκες των άλλων. Οι μαθητές θα μάθουν να διακρίνουν μεταξύ προσαρμοστικών και μη προσαρμοστικών στρατηγικών για να καλύψουν τις δικές τους ανάγκες.Ταινίες μικρού μήκους (IO2).Οι ταινίες μικρού μήκους, θα παραχθούν από μαθητές και αφορούν σημαντικά ιστορικά επεισόδια στο δρόμο προς τη δημοκρατία, επιτρέποντας τους να μπουν στις προοπτικές διαφορετικών ανθρώπων και να δουν με συμπάθεια τα κίνητρα, τις ανάγκες και τις επιλογές τους.Επιτραπέζιο παιχνίδι «Ενεργός πολίτης».Με αυτό το συνεργατικό παιχνίδι εμπλουτισμένο με διαδραστικά διαδικτυακά στοιχεία, οι μαθητές θα αντικατοπτρίζουν τις δικές τους βασικές ανάγκες και θα κατανοούν τα κίνητρα / βασικές ανάγκες των άλλων. Με βιωματικό τρόπο αναπτύσσουν και καλλιεργούν τις ικανότητες τους για ανεκτική και ειρηνική συνύπαρξη, καθώς και ενεργή συμμετοχή σε δημοκρατικές διαδικασίες.Οδηγός (IO4) για την χρήση του εκπαιδευτικού υλικού στο σχολείο.Τέσσερις διαδικτυακές ενότητες για εκπαιδευτικούς, προγραμματισμένες σε εικονικό μαθησιακό περιβάλλον, περιγράφουν τη χρήση του εκπαιδευτικού υλικού με ζωντανό και πρακτικό τρόπο, για να δείξουν πιθανές εφαρμογές στην τάξη, και παρουσιάζουν τις περαιτέρω δυνατότητες ζωντανής δημοκρατίας μέσα στη σχολική κουλτούρα.Διαδικτυακή πλατφόρμα και κινητή εφαρμογή.Η πλατφόρμα θα χρησιμοποιηθεί ως εικονικό περιβάλλον μάθησης. Οι χρήστες θα μπορούν να βρουν τους εκπαιδευτικούς πόρους και τις ηλεκτρονικές ενότητες, να συμμετέχουν σε μαθησιακές δραστηριότητες και να επικοινωνούν με άλλους χρήστες. Το υλικό μπορεί θα να χρησιμοποιηθεί από τα σχολεία σε εκπαιδευτικά αντικείμενα όπως η ιστορία, η κοινωνιολογία, οι ξένες γλώσσες, οι τέχνες, η ηθική, τα θρησκευτικά, η ψυχολογία και η φιλοσοφία. Μπορούν επίσης να χρησιμοποιηθούν σε διεπιστημονικά προγράμματα και εργαστήρια για τη δημοκρατία, τα ανθρώπινα δικαιώματα, την ανάπτυξη της προσωπικότητας, την ανάπτυξη των κοινωνικών δεξιοτήτων κ.α. Posted in: Αναπτυξιακά Έργα/Δράσεις, Υλικό επικοινωνίας. Last Modified: 17 Σεπτεμβρίου, 2021"
