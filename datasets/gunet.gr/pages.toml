["https://www.gunet.gr/el/%ce%b4%ce%b5%ce%bb%cf%84%ce%af%ce%bf-%cf%84%cf%8d%cf%80%ce%bf%cf%85-%ce%b3%ce%b9%ce%b1-%cf%84%ce%bf-%ce%ad%cf%81%ce%b3%ce%bf-smart-patients-%ce%b9%ce%bf%cf%8d%ce%bd%ce%b9%ce%bf%cf%82-2017"]
title = "Δελτίο τύπου για το έργο Smart Patients, Ιούνιος 2017 – GUnet"
full_description = "Δελτίο τύπου για το έργο Smart Patients, Ιούνιος 2017 Date: 17 Ιουνίου, 2017 Author: Pantelis Balaouras Press release No1 – Ιούνιος 2017 Έξυπνοι ασθενείς Ολιστική ενδυνάμωση των πολιτών προκειμένου να γίνουν ειδικοί στην υγεία τους Link: https://smart-patients.eu Ένα σημαντικό θέμα που συμπεριλαμβάνεται και στη «Στρατηγική για την υγεία» της Ευρωπαϊκής Ένωσης είναι «η ενδυνάμωση των πολιτών – η τοποθέτηση, δηλαδή, των ασθενών στην καρδιά του συστήματος και η ενθάρρυνσή τους ώστε να εμπλακούν ενεργά στη διαχείριση των αναγκών της υγείας τους». H προληπτική φροντίδα δεν πρέπει να μένει μόνο στο επίπεδο γιατρού και νοσοκομείου αλλά οι πολίτες θα πρέπει να έχουν τη δυνατότητα να αποτελούν «έξυπνους ασθενείς». Ως «έξυπνο ασθενή» θεωρούμε κάποιον που έχει ενεργό ρόλο στην υγεία του, μία θεώρηση που είναι σύμφωνη με τον ορισμό της Παγκόσμιας Οργάνωσης Υγείας (ΠΟΥ) από το 1948: «Η υγεία είναι μια κατάσταση πλήρους σωματικής, ψυχικής και κοινωνικής ευεξίας και όχι απλώς η απουσία ασθένειας ή αναπηρίας». Για να γίνει κάποιος έξυπνος ασθενής πρέπει να εκπαιδευτεί. Η αντίστοιχη εκπαιδευτική διαδικασία στην οποία βασίζεται το έργο είναι η ενδυνάμωση. Για το σκοπό αυτό, απαιτείται μια ολιστική προσέγγιση που περιλαμβάνει πτυχές όχι μόνο από την ιατρική, αλλά και από την κοινωνιολογία και την ψυχολογία. Οι έξυπνοι ασθενείς κατανοούν τη δική τους συμβολή στην ανάκαμψη ως απαραίτητο συμπλήρωμα και όχι ανταγωνιστικά προς τα επιτεύγματα της ιατρικής. Θέλουν επίσης να ζήσουν μια ζωή που αποτρέπει να γίνουν ένας ασθενής. Κατανοούν ότι η υγεία δεν μπορεί να διατηρηθεί μόνο με ιατρική παρέμβαση, αλλά εξαρτάται επίσης από τον τρόπο ζωής, καθώς και από κοινωνικούς και περιβαλλοντικούς παράγοντες. Οι στόχοι του έργου «Έξυπνοι Ασθενείς» είναι η ενδυνάμωση των πολιτών ώστε να γίνουν «έξυπνοι ασθενείς» μέσω της ανάπτυξης της απαραίτητης αυτοπεποίθησης και των κατάλληλων δεξιοτήτων επικοινωνίας και αλληλοεπίδρασης με τους επαγγελματίες του τομέα της υγείας, η υποστήριξή τους προκειμένου να ανιχνεύουν προβλήματα υγείας σε αρχικό στάδιο και η κατανόηση του ρόλου τους – η συμμετοχή στη ανάρρωση ως απαραίτητο συμπλήρωμα και όχι ανταγωνιστικά με τα επιτεύγματά της ιατρικής. Tα αποτελέσματα του έργου είναι εφαρμογές διαδικτύου και κινητών, βασικά εργαλεία με συστάσεις, συμβουλές και οδηγίες για την ατομική πρόληψη και φροντίδα, την ενδυνάμωση και τη συμμετοχή στη διαδικασία της ανάρρωσης και την αποδοχή μιας νέας οπτικής για τη ζωή. Η ευρωπαϊκή διάσταση του έργου επιτυγχάνεται με το γεγονός ότι η εταιρική σχέση εκτείνεται από τη Βορειοδυτική (Ιρλανδία) μέσω της Νοτιοδυτικής (Πορτογαλίας) και της Κεντρικής Ευρώπης προς την Ανατολή (Ελλάδα). Σε έναν παγκοσμιοποιημένο κόσμο, το έργο θα αναπτύξει διακρατικές βέλτιστες πρακτικές και θα τις προσαρμόσει σε τοπικές λύσεις στα οκτώ ευρωπαϊκά κράτη της εταιρικής σχέσης και πέραν αυτής. Η σύμπραξη περιλαμβάνει μια πολυεπιστημονική ομάδα από οργανώσεις υγείας, εμπειρογνώμονες εκπαίδευσης και παιδαγωγικής καθώς και ειδικούς ΤΠΕ και πολυμέσων. Ένα σημαντικό ορόσημο στην αρχή του έργου ήταν η Έκθεση Καταγραφής και Αξιολόγησης Αναγκών η οποία είχε ως στόχο την ανάλυση κενών και χρησίμευσε ως βάση για την ανάπτυξη του εκπαιδευτικού υλικού. Η έκθεση αποκάλυψε ότι τα θέματα υγείας είναι υψίστης σημασίας για τους πολίτες και ενδιαφέρονται να κάνουν πράγματα ώστε να διατηρήσουν ή βελτιώσουν την υγεία τους. Υπάρχει επίσης μια καλά εδραιωμένη κουλτούρα στην αναζήτηση ιατρικών πληροφοριών στο Διαδίκτυο και οι πολίτες χρησιμοποιούν καθημερινά υπολογιστές, κινητές συσκευές και διαδίκτυο. Από την άλλη πλευρά, η ανάλυση αποκάλυψε ένα χαμηλό επίπεδο γραμματισμού σε θέματα υγείας, μη ικανοποιητική επικοινωνία μεταξύ ιατρών και ασθενών, χαμηλή αντίληψη για την αξιοπιστία των ιατρικών ιστότοπων και εφαρμογών, περιορισμένο ποσοστό γιατρών που ενημερώνουν τους πολίτες μέσω του διαδικτύου και ότι οι σημερινοί ιστότοποι είναι σχεδόν αποκλειστικά στα αγγλικά και ενημερωτικοί (παθητικός ο ρόλος των ασθενών) και παρουσιάζονται σε στατική μορφή. Οι ευκαιρίες του έργου είναι η παράδοση του ενημερωτικού υλικού για την υγεία μέσω του κινητού τηλεφώνου και εφαρμογών σε αυτό σε άτομα χωρίς πρόσβαση στον υπολογιστή. Οι πληροφορίες που θα είναι διαθέσιμες σε διάφορες ευρωπαϊκές γλώσσες για τους μετανάστες και τους πρόσφυγες, καθώς και σε γλώσσες των μεταναστών και των προσφύγων, θα μπορούσαν να βοηθήσουν τους πολίτες να αποκτήσουν καλύτερη παιδεία για την υγεία. Θα μπορούσε να βελτιώσει την επικοινωνία μεταξύ γιατρών και ασθενών (π.χ. μέσω πανεπιστημιακών μαθημάτων κατά τη διάρκεια ιατρικών σπουδών) και με πολίτες πριν γίνουν ασθενείς. Ευκαιρία είναι επίσης η δημιουργία ενός ενδιαφέρουμενου, απλού, σύντομου και διαδραστικού εργαλείου το οποίο θα ανταποκρίνεται στις ανάγκες της υγείας των πολιτών και θα τους ενεργοποιεί και θα επικεντρώνεται στην πρόληψη, την ενδυνάμωση και τη συμμετοχή. Posted in: Υλικό επικοινωνίας. Last Modified: 17 Ιουλίου, 2018"
