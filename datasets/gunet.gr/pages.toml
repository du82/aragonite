title = "Υπηρεσία RADIUS – GUnet"
full_description = "Υπηρεσία RADIUS Η GUNet παρέχει στα μέλη της ολοκληρωμένη υπηρεσία RADIUS για την εξυπηρέτηση Wi-Fi συνδέσεων, χρήση της υπηρεσίας Eduroam και πιστοποίηση τρίτων υπηρεσιών (VPΝ κτλ). Βασικά στοιχεία της υπηρεσίας είναι: Υπηρεσία SP για τη σύνδεση Wi-Fi χρηστών στις εγκαταστάσεις του ιδρύματοςΥπηρεσία SP για την εξυπηρέτηση τρίτων υπηρεσιών (VPN, login σε δικτυακές συσκευές κτλ)Υπηρεσία IdP για την πιστοποίηση των συνδέσεων μέσω των SP αλλά και συνδέσεων χρηστών του ιδρύματος σε Wi-Fi Eduroam hotspots άλλων ιδρυμάτων και φορέων που συμμετέχουν στο δίκτυο EduroamΔιασύνδεση των logs της υπηρεσίας με την υπηρεσία uSIEM της GUNet για την επισκόπηση συνδέσεων των χρηστώνΔιαλειτουργικότητα με την υπηρεσία uGuest της GUNet και επιπλέον δυνατότητες (ενεργοποίηση συγκεκριμένων VLANs και ACLs για την κατηγορία αυτή χρηστών). Η GUNet προσφέρει: Την εγκατάσταση, διαχείριση και παρακολούθηση της υπηρεσίας σε εικονική μηχανή της GUNet ή του ίδιου του ιδρύματοςΤη δημιουργία και διαχείριση CAT profile για τη σύνδεση χρηστών στην υπηρεσία EduroamΤην επικοινωνία με την ΕΔΥΤΕ και Geant σε σχέση με τη συμμετοχή του ιδρύματος στην υπηρεσία EduroamΤη διασύνδεση της υπηρεσίας με τις υπηρεσίες IDM και uSIEM. Για επικοινωνία για θέματα της υπηρεσίας μπορείτε να επικοινωνείτε στη διεύθυνση email radius@gunet.gr Παράδειγμα RADIUS dashboard στην υπηρεσία uSIEM:"
