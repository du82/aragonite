title = "Newsletter – Σελίδα 4 – GUnet"
full_description = "Smart Patients, Newsletter #2 Date: 17 Ιανουαρίου, 2018 Author: Pantelis Balaouras Έξυπνοι ασθενείς: Ολιστική ενδυνάμωση των πολιτών προκειμένου να γίνουν ειδικοί στην υγεία τους Καλώς ήρθατε στην πλατφόρμα κατάρτισης Smart Patients! Οι στόχοι του έργου «Έξυπνοι Ασθενείς» είναι η ενδυνάμωση των πολιτών ώστε να γίνουν «έξυπνοι ασθενείς» μέσω της ανάπτυξης της απαραίτητης αυτοπεποίθησης και των κατάλληλων δεξιοτήτων επικοινωνίας και αλληλοεπίδρασης με τους επαγγελματίες του τομέα της υγείας, η υποστήριξή τους προκειμένου να ανιχνεύουν προβλήματα υγείας σε αρχικό στάδιο και η κατανόηση του ρόλου τους – η συμμετοχή στη ανάρρωση ως απαραίτητο συμπλήρωμα και όχι ανταγωνιστικά με τα επιτεύγματά της ιατρικής. Κατεβάστε το Δελτίο Ενημέρωσης: SP-Newsletter2 – GR Smart Patients, Newsletter #1 Date: 17 Μαΐου, 2017 Author: Pantelis Balaouras Ενημερωτικό Δελτίο #1 Έξυπνοι ασθενείς: Ολιστική ενδυνάμωση των πολιτών προκειμένου να γίνουν ειδικοί στην υγεία τους Link: https://smart-patients.eu Ένα σημαντικό θέμα που συμπεριλαμβάνεται και στη «Στρατηγική για την υγεία» της Ευρωπαϊκής Ένωσης είναι «η ενδυνάμωση των πολιτών – η τοποθέτηση, δηλαδή, των ασθενών στην καρδιά του συστήματος και η ενθάρρυνσή τους ώστε να εμπλακούν ενεργά στη διαχείριση των αναγκών της υγείας τους». H προληπτική φροντίδα δεν πρέπει να μένει μόνο στο επίπεδο γιατρού και νοσοκομείου αλλά οι πολίτες θα πρέπει να έχουν τη δυνατότητα να αποτελούν «έξυπνους ασθενείς». Ως «έξυπνο ασθενή» θεωρούμε κάποιον που έχει ενεργό ρόλο στην υγεία του, μία θεώρηση που είναι σύμφωνη με τον ορισμό της Παγκόσμιας Οργάνωσης Υγείας (ΠΟΥ) από το 1948: «Η υγεία είναι μια κατάσταση πλήρους σωματικής, ψυχικής και κοινωνικής ευεξίας και όχι απλώς η απουσία ασθένειας ή αναπηρίας». Continue reading…"
