title = "Προφίλ – Ιστορικό – GUnet"
full_description = "Προφίλ – Ιστορικό Το Ακαδημαϊκό Διαδίκτυο και οι στόχοι του Το «Ακαδημαϊκό Διαδίκτυο» (GUnet) είναι αστική εταιρεία μη κερδοσκοπικού χαρακτήρα, η οποία ιδρύθηκε στις 12 Σεπτεμβρίου 2000. Εδρεύει στην Αθήνα και μέλη της είναι όλα τα Πανεπιστήμια της χώρας . Οι στόχοι του Ακαδημαϊκού Διαδικτύου προσδιορίζονται από τις ευρύτερες δικτυακές ανάγκες και επιδιώξεις της ακαδημαϊκής κοινότητας της χώρας στο πλαίσιο της Κοινωνίας της Πληροφορίας, με σκοπό την εξυπηρέτηση της έρευνας και της εκπαίδευσης. Ειδικότερα, μεταξύ των στόχων του Ακαδημαϊκού Διαδικτύου περιλαμβάνονται: O σχεδιασμός και η υλοποίηση οριζόντιων δράσεων για την συντονισμένη ανάπτυξη, προαγωγή, υποστήριξη και διαχείριση των ψηφιακών υποδομών και υπηρεσιών των ανωτάτων εκπαιδευτικών ιδρυμάτων της χώρας, συμπεριλαμβανόμενων αυτών που αφορούν τα δίκτυα, τα πληροφοριακά συστήματα, την ηλεκτρονική μάθηση και το ψηφιακό εκπαιδευτικό περιεχόμενο Η διεξαγωγή έρευνας και η συμμετοχή σε έργα έρευνας, ανάπτυξης, εκπαίδευσης και κατάρτισης σχετικά με τις τεχνολογίες πληροφορικής και επικοινωνιών (ΤΠΕ) και τις ψηφιακές υπηρεσίες και εφαρμογές και σε αντίστοιχα προγράμματα χρηματοδοτούμενα από το Υπουργείο Παιδείας και Θρησκευμάτων, την Ευρωπαϊκή Ένωση και αλλού Η ανάπτυξη συνεργασιών και η από κοινού ανάληψη δράσεων και έργων ΤΠΕ με φορείς του δημόσιου και του ιδιωτικού τομέα στην Ελλάδα και το εξωτερικό Η παροχή υπηρεσιών σχετικών με τις τεχνολογίες πληροφορικής και επικοινωνιών (ΤΠΕ) και τις ψηφιακές υπηρεσίες και εφαρμογές στα μέλη της και σε οποιοδήποτε τρίτο Η αστική μη κερδοσκοπική εταιρεία «Ακαδημαϊκό Διαδίκτυο» (GUnet) δημιουργήθηκε από όλα τα ιδρύματα της τριτοβάθμιας εκπαίδευσης. Επομένως, έχει τη δυνατότητα να βασίζεται και να χρησιμοποιεί την εμπειρία και την τεχνογνωσία των ομάδων των Κέντρων Διαχείρισης Δικτύων όλων των ιδρυμάτων. Στο παρελθόν, οι ομάδες αυτές έχουν υλοποιήσει με επιτυχία σημαντικό αριθμό έργων, προμηθειών και μελετών, ενώ συμμετέχουν ενεργά στις διαδικασίες για τον καθορισμό και την εκτέλεση των δράσεων της GUnet."
