full_description = "Πρόσκληση Εκδήλωσης Ενδιαφέροντος Date: 8 Σεπτεμβρίου, 2023 Author: Spiros Bolis για Υποβολή Προτάσεων προς σύναψη ως 10 συμβάσεων μίσθωσης έργου ιδιωτικού δικαίου ή συμβάσεων εργασίας ορισμένου χρόνου Η GUnet στο πλαίσιο της υλοποίησης με ίδια μέσα του Υποέργου 1 «Σχεδιασμός/ανάπτυξη υλοποίηση της υπηρεσίας eDiplomas» της Πράξης «Αναβάθμιση και βελτίωση των ηλεκτρονικών υπηρεσιών Τριτοβάθμιας Εκπαίδευσης» με κωδικό ΟΠΣ (MIS) 5149207 (το οποίο έχει ενταχθεί στο Ε.Π. «Μεταρρύθμιση Δημοσίου Τομέα 2014-2020» και συγχρηματοδοτείται από το Ευρωπαϊκό Ταμείο Περιφερειακής Ανάπτυξης) ανακοινώνει την πρόσκληση εκδήλωσης ενδιαφέροντος για την υποβολή προτάσεων για τη σύναψη σύμβασης μίσθωσης έργου ή συμβάσεων εργασίας ορισμένου με 9 Εξωτερικούς Συνεργάτες, οι οποίοι θα απασχοληθούν στο έργο «Αναβάθμιση και βελτίωση των ηλεκτρονικών υπηρεσιών Τριτοβάθμιας Εκπαίδευσης» με κωδικό ΟΠΣ (MIS) 5149207, για την κάλυψη των αναγκών του και καλεί τους ενδιαφερόμενους που διαθέτουν τις απαιτούμενες γνώσεις και εμπειρία να υποβάλουν Προτάσεις σύμφωνα με την παρούσα Πρόσκληση. Η πρόσκληση αφορά: 3 Back- end Developers 4 Front- end Developers 1 Μηχανικό DevOps 2 Τεχνικούς για την εξυπηρέτηση προσωπικού Λήξη προθεσμία υποβολής υποψηφιοτήτων 18/9/2023, 15:00 Πρόσκληση prosklisi-prosopikoy-v4-1Download Posted in: Προκηρύξεις προσωπικού. Last Modified: 8 Σεπτεμβρίου, 2023"
