["https://www.gunet.gr/el/mig-dhl"]
title = "MIG-DHL – GUnet"
full_description = "MIG-DHL Date: 2 Απριλίου, 2021 Author: Pantelis Balaouras MIG-DHL DEVELOPMENT OF A TRAINING PROGRAM FOR IMPROVING DIGITAL HEALTH LITERACY OF MIGRANTS Οι μετανάστες είναι ευάλωτοι σε σοβαρές ανισότητες στην υγεία, με πολλούς από αυτούς να αντιμετωπίζουν σοβαρά προβλήματα υγείας. Η πρόσβαση στις κοινωνικές υπηρεσίες και στις υπηρεσίες υγείας αποτελεί ένα πρωταρχικό δείκτη του επιπέδου ολοκλήρωσης (www.migranthealth.eu). Αυτοί οι κίνδυνοι για την υγεία απαιτούν αποτελεσματικές στρατηγικές για την ενδυνάμωση των μεταναστών ώστε να αναγνωρίζουν, να ελαχιστοποιούν και να ανταποκρίνονται αποτελεσματικά σε πιθανά προβλήματα υγείας στη χώρα υποδοχής (www.ncbi.nlm.nih.gov/pubmed/18387773). Ο Ψηφιακός Γραμματισμός για την Υγεία (ΨΓΥ) (Digital Health Literacy -DHL) είναι η ικανότητα αναζήτησης, εύρεσης, κατανόησης και αξιολόγησης πληροφοριών υγείας από ηλεκτρονικές πηγές και εφαρμογής των γνώσεων που αποκτήθηκαν για την αντιμετώπιση ή την επίλυση ενός προβλήματος υγείας (Digital Health Literacy, WHO). Οι ψηφιακά εγγράμματοι για την Υγεία πολίτες έχουν την δυνατότητα να διαδραματίζουν πιο ενεργό ρόλο στην αυτοδιαχείριση της υγείας τους, με αποτέλεσμα τη βελτιωμένη πρόληψη, την προσήλωση σε έναν πιο υγιεινό τρόπο ζωής και καλύτερα αποτελέσματα για την υγεία (H2020 IC-Health). Ο ΨΓΥ περιλαμβάνει την ανάπτυξη κατάλληλων ψηφιακών δεξιοτήτων υγείας, όπως: δεξιότητες χρήσης, δεξιότητες πλοήγησης, αναζήτηση πληροφοριών, αξιολόγηση αξιοπιστίας, καθορισμός συνάφειας, προσθήκη περιεχομένου, προστασία της ιδιωτικής ζωής (Van der Vaart & Drossaert.2017). Το έργο MIG-DHL ξεκινά με κύριο στόχο την αύξηση των ικανοτήτων (στάσεις, γνώσεις, δεξιότητες) των μεταναστών για τη βελτίωση το Ψηφιακό Γραμματισμό για την Υγεία. Το έργο έχει τους εξής συγκεκριμένους στόχους: Να ευαισθητοποιήσει τους μετανάστες για τη σημασία του ψηφιακού γραμματισμού για την υγεία.Να αναπτυχθούν ψηφιακές δεξιότητες υγείας στον πληθυσμό των μεταναστών και να τους δοθεί η δυνατότητα να διαδραματίσουν πιο ενεργό ρόλο στην αυτοδιαχείριση της υγείας τους, ενισχύοντας τις πτυχές που σχετίζονται με την πρόληψη και τη θεραπεία του COVID-19 και άλλων παρόμοιων καταστάσεων.Να εκπαιδεύσει τους επαγγελματίες υγείας ώστε να μπορούν να υποστηρίξουν τον πληθυσμό των μεταναστών.Να συμμετάσχουν και να εκπαιδεύσουν τους ίδιους τους μετανάστες ώστε να μπορούν να υποστηρίζουν νέους μετανάστες. Μέσω της εκτέλεσης αυτού του Έργου θα αναπτυχθούν τα ακόλουθα: Μεθοδολογικός Οδηγός (IO1), ο οποίος θα συμπεριλαμβάνει την άμεση συμμετοχή Τελικών Χρηστών, με κύριο στόχο τον καθορισμό των βασικών περιεχομένων, των μεθοδολογιών και των εργαλείων που απαιτούνται για τη δημιουργία και τη βελτίωση των κρίσιμων ικανοτήτων του πληθυσμού των Μεταναστών (συμπεριλαμβανομένου των νεοεισερχομένων) και επαγγελματίες υγείας σχετικά με την αύξηση του ψηφιακού γραμματισμού για την υγεία.Εκπαιδευτικό Υλικό (I.O.2) που απευθύνεται στους μετανάστες (συμπεριλαμβανομένων των νεοεισερχόμενων μεταναστών) και στους επαγγελματίες υγείας σχετικά με την αύξηση του ψηφιακού γραμματισμού για την υγεία.Σχεδιασμός Δραστηριοτήτων Πρακτικής Κατάρτισης (I.O.3). Θα αποτελέσουν τον πυρήνα του Προγράμματος Εκπαίδευσης και θα ενισχύσουν την πρακτική εκπαίδευση των μεταναστών και των Επαγγελματιών Υγείας για την αύξηση του Ψηφιακού Γραμματισμού Υγείας, συμπεριλαμβανομένης της βέλτιστης εκμετάλλευσης των προαναφερθέντων Εκπαιδευτικών Υλικών μέσω δραστηριοτήτων προσανατολισμένων σε συγκεκριμένες ανάγκες των εκπαιδευομένων.Ανάπτυξη μιας διαδραστικής πλατφόρμας ηλεκτρονικής εκπαίδευσης και εφαρμογής για κινητά (I.O.4), για την υποστήριξη της εφαρμογής της εκπαιδευτικής μεθοδολογίας, συμπεριλαμβανομένου του εκπαιδευτικού υλικού, του χώρου εργασίας και της σύνδεσης με τα ισχύοντα εργαλεία ΤΠΕ. Ιστοσελίδα: https://mig-dhl.eu Posted in: Αναπτυξιακά Έργα/Δράσεις. Last Modified: 17 Σεπτεμβρίου, 2021"
