title = "CENTAUR – GUnet"
full_description = "CENTAUR Date: 2 Απριλίου, 2021 Author: Pantelis Balaouras Supporting, mobilizing and empowering creative and cultural industry entrepreneurs and educators towards social change Για να προστατευτούν από την ταχεία εξάπλωση του ιού, όλες οι χώρες σε όλο τον κόσμο έχουν υιοθετήσει προστατευτικά μέτρα, μερικά από τα οποία είναι δραστικά και περιορίζουν σοβαρά την ελευθερία των πολιτών για μετακίνηση. Ως αποτέλεσμα, οι πολιτιστικές και ψυχαγωγικές εγκαταστάσεις, τα σχολεία, τα κέντρα ημερήσιας φροντίδας και τα πανεπιστήμια ήταν κλειστά, όπως και πολλά καταστήματα που δεν εξυπηρετούσαν τις ανάγκες της καθημερινής ζωής. Ολόκληρη η παγκόσμια οικονομία δεν θα γλιτώσει από τις συνέπειες της νόσου Covid-19. Η ανεργία θα αυξηθεί αναπόφευκτα επίσης, γεγονός που δεν αποτελεί μόνο μεγάλη απώλεια σε ατομικό επίπεδο, αλλά ασκεί επίσης πρόσθετη πίεση στην οικονομία. Για παράδειγμα, η συμβουλευτική εταιρεία McKinsey εκτιμά ότι κατά τη διάρκεια της πανδημίας θα μπορούσαν να χαθούν περίπου 59 εκατομμύρια θέσεις εργασίας. Στις χώρες της ΕΕ αυτό θα αντιστοιχούσε σε ποσοστό ανεργίας 7,6%. Αυτό θα επηρέαζε ιδιαίτερα τον τομέα της χονδρικής και λιανικής, τα εστιατόρια, την τουριστική βιομηχανία, καθώς και τις τέχνες (μουσική, τέχνες του θεάματος) και τον τομέα της ψυχαγωγίας. Το έργο επικεντρώνεται σε βασικούς παράγοντες του δημιουργικού τομέα, ως εκ τούτου, στοχεύει: α) στήριξη, κινητοποίηση και ενδυνάμωση των επιχειρηματιών (οργανισμών και ατόμων) που δραστηριοποιούνται στον δημιουργικό τομέα και στην πολιτιστική παράδοση της ΕΕ, για την ανάπτυξη διαδικτυακής συνεργασίας και βιώσιμων δικτύων για την ανταλλαγή των γνώσεων τους με εκπαιδευτές και ενήλικες εκπαιδευόμενους· β) υποστήριξη, κινητοποίηση και ενδυνάμωση των εκπαιδευτών ώστε να χρησιμοποιούν την διαδικτυακή συνεργασία και εργαλεία για την αύξηση της ευαισθητοποίησης σχετικά με τα οφέλη της διδασκαλίας και των δημιουργικών δραστηριοτήτων, ιδίως στην πολιτιστική παράδοση της ΕΕ, συμπεριλαμβανομένων της μουσικής και των παραστατικών τεχνών・ γ) αύξηση του ενδιαφέροντος και προσφορά δεξιοτήτων στους ενήλικες, ανάπτυξη της δημιουργικότητάς τους με εποικοδομητικούς τρόπους και στήριξη της ένταξης, ιδίως των μεταναστών και άλλων περιθωριοποιημένων ομάδων. Έτσι, οι ομάδες-στόχοι είναι επιχειρηματίες (οργανισμοί και άτομα), που δραστηριοποιούνται στον δημιουργικό τομέα, εκπαιδευτικοί και ενήλικες. Τα προγραμματισμένα Πνευματικά Αποτελέσματα (IOs) είναι τα ακόλουθα: IO1 Προσδιορισμός αναγκών και απαιτήσεων των ομάδων στόχων.IO2 Online eLearning και πλατφόρμα δικτύωσης που περιέχουν τα επόμενα IOs.IO3 Κατευθυντήριες γραμμές για εκπαιδευτές στην εκπαίδευση ενηλίκων και εκπαιδευτές: ένα εγχειρίδιο που θα επικεντρώνεται στη δημιουργικότητα και τη χρήση των τεχνών σε διάφορα περιβάλλοντα, και ως ένταξη στην προώθηση δραστηριοτήτων, τη χρήση με τους μετανάστες και τις περιθωριοποιημένες ομάδες, και στην ενσωμάτωση με τους πρόσφατους πολύπλοκους κανονισμούς της ΕΕ για τα δεδομένα και τα πνευματικά δικαιώματα.ΙΟ4 Εργαλείο αυτοαξιολόγησης: Ένα διαδικτυακό ερωτηματολόγιο, το οποίο θα βοηθήσει στον εντοπισμό και την αξιολόγηση της δημιουργικής δύναμης, των ενδιαφερόντων, των προκλήσεων και της προηγούμενης εμπειρίας των ενηλίκων. Αυτό το εργαλείο θα διευκολύνει τη χρήση της πλατφόρμας από τις ομάδες-στόχους, προτείνοντας τις σωστές ασκήσεις, εργαλεία και δημιουργικούς χώρους για κάθε χρήστη από μια δεξαμενή (συλλογή) πρακτικών και ασκήσεων.IO5 Συλλογή πρακτικών και ασκήσεων: Θα δημιουργηθεί μια συλλογή πρακτικών, πολιτισμικά ευαίσθητων και εύκολων στην εφαρμογή πρακτικών και ασκήσεων μεγάλης ποικιλίας, που θα μπορεί να χρησιμοποιηθεί για την ευαισθητοποίηση σχετικά με τα οφέλη της δημιουργικότητας και την ανάπτυξη της δημιουργικότητας με τη βοήθεια εμπειρογνωμόνων στον τομέα αυτό με μέχρι στιγμής υποχρησιμοποιούμενες γνώσεις σε αυτόν συνδέονται μέσω του δικτυακού τόπου.IO6 Ελκυστικά ευέλικτα εργαλεία: ένα σύνολο ελκυστικών ευέλικτων εργαλείων που βασίζονται σε σύγχρονο γραφικό περιβάλλον χρήστη, όπως anime και / ή Avatars που θα εφαρμόσει συγκεκριμένες ασκήσεις. Απευθύνεται στους εκπαιδευόμενους χρησιμοποιώντας την οπτικοακουστική γλώσσα με την οποία είναι εξοικειωμένοι με στόχο την αύξηση του επιπέδου της εμπλοκής. Το έργο, είναι καινοτόμο, πρώτα απ ‘όλα, για να κάνει χρήση της προσέγγισης gamification και τα πολλαπλά οφέλη για τις ομάδες που αντιμετωπίζουν ιδιαίτερα την παρούσα κατάσταση πανδημίες που σχετίζονται. Με την εισαγωγή ελκυστικών χαρακτηριστικών της βιομηχανίας τυχερών παιχνιδιών (κονκάρδες, επιτεύγματα, avatars, anime) το έργο θα είναι ελκυστικό για τις ομάδες-στόχους του, δίνοντας μια αίσθηση του σκοπού, της προόδου, της επίτευξης και της οριστικότητας. Θα διευκολύνει όλες τις ομάδες-στόχους να «επιστρέψουν» στην πλατφόρμα και να ολοκληρώσουν την εκπαίδευση. Δεύτερον, η πλατφόρμα θα είναι καινοτόμος για τη στόχευση δύο αλληλένδετων ομάδων-στόχων ταυτόχρονα: α. να προσφέρουν νέους ορίζοντες ευκαιριών σε όσους απασχολούνται σε δημιουργικά επαγγέλματα και τέχνες στη δύσκολη περίοδο της COVID, β. να εκπαιδεύσουν τους εκπαιδευτές στην εκπαίδευση ενηλίκων σχετικά με τον τρόπο συνεργασίας με τις ομάδες αυτές, να αυξήσουν αποτελεσματικά και αποτελεσματικά τη δημιουργικότητα στους ενήλικες-πελάτες τους και να συμβάλουν στην ένταξη και ένταξη στον πολιτισμό της ΕΕ και ταυτόχρονα να ενισχύσουν μια πολύ ευρεία και κριτική ικανότητα των ενηλίκων εκπαιδευομένων. Posted in: Αναπτυξιακά Έργα/Δράσεις. Last Modified: 17 Σεπτεμβρίου, 2021"
