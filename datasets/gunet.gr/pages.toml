full_description = "Ημερίδα ενημέρωσης στο πλαίσιο του έργου YCARE (15/12/2017) Date: 18 Ιανουαρίου, 2016 Author: tio Ημερίδα «Συμβουλευτική νέων για την αντιμετώπιση της ριζοσπαστικοποίησης στην Ευρώπη (YCARE)» Ημερομηνία: Παρασκευή, 15 Δεκεμβρίου 2017 Ώρα: 09:30 π.μ. Τόπος: Πολιτιστικό Κέντρο «Κωστής Παλαμάς» Ακαδημίας 48 και Σίνα, Αθήνα Περιγραφή εκδήλωσης: Ημερίδα ενημέρωσης για τα αποτελέσματα του έργου «Συμβουλευτική νέων για την αντιμετώπιση της ριζοσπαστικοποίησης στην Ευρώπη» (Youth Councelling Against Ragicalisation in Europe – YCARE) που υλοποιήθηκε στο πλαίσιο του προγράμματος ERASMUS+. Χρήσιμοι σύνδεσμοι: 1. Ηλεκτρονική φόρμα εγγραφής 2.Πρόγραμμα ημερίδας YCARE 3. Ενημερωτικό Φυλλάδιο 4. Ιστότοπος έργου 5. Online εργαλειοθήκη Posted in: Ανακοινώσεις. Last Modified: 1 Δεκεμβρίου, 2017"
