["https://www.gunet.gr/el/gunet-toolkit"]
title = "GUNet Toolkit – GUnet"
full_description = "GUNet Toolkit Η GUNet στα πλαίσια της ανάπτυξης των υπηρεσιών της έχει δημιουργήσει σειρά χρήσιμων εργαλείων τα οποία κάνει διαθέσιμα στα μέλη της για τη διευκόλυνση ανάπτυξης και διαχείρισης υπηρεσιών και εικονικών μηχανών. Το toolkit της GUNet περιλαμβάνει: Just enough OS (JeOS) ISO image builder (Docker) για τη δημιουργία ISO image βασισμένο σε Debian Linux (εκδόσεις 11 & 12) για την παραγωγή εικονικών μηχανών (VM) προς χρήση ως εξυπηρετητών υπηρεσιών.Packer templates repo για την άμεση δημιουργία VMs από το JeOS ISO για μία ποικιλία από πλατφόρμες (πχ VirtualBox).Docker image για τη διαχείριση πιστοποιητικών εξυπηρετητών και των αιτημάτων τους αλλά και στη διευκόλυνση συμμετρικής κρυπτογραφίας.Puppeteer Docker image για την εύκολη συγγραφή puppeteer tests με σκοπό τον έλεγχο καλής λειτουργίας web σελίδων και ιστοτόπων (regression tests κοκ). Το image της GUNet περιέχει επιπλέον συναρτήσεις για τη διευκόλυνση βασικών λειτουργιών αλλά και τη διασύνδεση με την υπηρεσία SSO.SimpleIdentity Docker images suite που αποτελεί σουίτα με τα βασικά συστατικά στοιχεία του GUNet IDM (LDAP, SSO, SSO clients). Η σουίτα μπορεί να αξιοποιηθεί από τα ιδρύματα και τρίτους στην ανάπτυξη εφαρμογών και για τον έλεγχο καλής λειτουργίας της πιστοποίησης. Τα βασικά συστατικά στοιχεία είναι:Το Docker image simple-ldap με απλό OpenLDAP ο οποίος περιέχει δοκιμαστικά δεδομένα βασισμένα στο σχήμα δεδομένων της GUNet.To Docker image simple-cas το οποίο περιέχει πλήρως λειτουργικό SSO CAS με ενεργοποιημένα τα βασικότερα πρωτόκολλα πιστοποίησης όπως CAS, SAML, OpenID Connect, GAuth. Ο CAS server μπορεί να διαλειτουργήσει με το simple-ldap image για την παροχή δοκιμαστικής πιστοποίησης.Το PHP Cas-Tester Docker image και repo με reference PHP κώδικα για διασύνδεση με την υπηρεσία SSO (πρωτόκολλο CAS) και πιστοποίηση χρηστών.Το Docker image simple-saml-sp με δοκιμαστικό SAML SP βασισμένο στην πλατφόρμα SimpleSAMLPHPΤο docker image simple-oidc-tester με δοκιμαστικό OpenID Connect SP."
