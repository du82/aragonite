["https://www.gunet.gr/el/category/%cf%84%ce%b1-%ce%bd%ce%ad%ce%b1-%ce%bc%ce%b1%cf%82/newslettergr"]
title = "Newsletter – GUnet"
full_description = "European Heart | Δελτίο Ενημέρωσης 6, Αύγουστος 2023 Date: 30 Αυγούστου, 2023 Author: Pantelis Balaouras Στο έργο European Heart, το εκπαιδευτικό υλικό αναπτύχθηκε για χρήση στη δευτεροβάθμια εκπαίδευση και μπορεί να εφαρμοστεί στην Κοινωνική και Πολιτική Αγωγή, στα μαθήματα ιστορίας και ηθικής, στην πολιτική εκπαίδευση και σε διεπιστημονικά έργα. Αυτό το έργο θα ολοκληρωθεί πλέον με επιτυχία τον Αύγουστο του 2023. Καθόλη τη διάρκεια του έργου European (09/2020 – 08/2023), οι μαθητές μαθαίνουν να αναπτύσσουν μια σχέση ενσυναίσθησης με τον εαυτό τους και τους άλλους χρησι\u0002μοποιώντας μια συναισθηματική\u0002ενσυναισθητική προσέγγιση, ενώ κερδί\u0002ζουν μια κριτική απόσταση από τη συ\u0002ναισθηματική ρητορική.Με την ολοκλήρωση του έργου, όλα τα προϊόντα του είναι διαθέσιμα στην εκπαιδευτική πλατφόρμα που αποτελεί ένα εικονικό περιβάλλον μάθησης στο σύνδεσμο: https://training.europeanheart.eu/ Αυτά τα αποτελέσματα μπορούν επίσης να χρησιμοποιηθούν μέσω της εφαρμογής για κινητά Android: European Heart. Οι ενδιαφερόμενοι θα βρουν σε αυτό το διαδικτυακό περιβάλλον εκπαιδευτικό υλικό για θέματα βασικών αναγκών, ενσυναίσθησης και δημοκρατίας με μορφή φυλλαδίων καιβιβλίων εργασίας, το ομαδικό παιχνίδι «Active Citizen Team Game», διαδραστικές παρουσιάσεις PowerPoint, μια διαδικτυακή παρουσίαση για εργασία στην τάξη, καθώς και διασκεδαστικές ευκαιρίες για επανάληψη με τη μορφή quizzes. Όλο το εκπαιδευτικό υλικό είναι διαθέσιμο στα Αγγλικά, Γερμανικά, Γαλλικά και Ελληνικά και περιλαμβάνει: 1.Την «Εργαλειοθήκη Ανάγκες και Στρατηγικές για Μαθητές» ηλικία 13-16 που εξοικειώνει τους νέους με τις πέντε βασικές ανάγκες σύμφωνα με τον William Glasser και καταδεικνύει ότι όλοι οι άνθρωποι έχουν τις ίδιες βασικές ανάγκες (download). 2.Τα βιβλία εργασιών «Μαθαίνοντας από την Ιστορία»(LINK) που αναπτύχθηκαν από εκπαιδευτικούς ιστορίας. Πέντε διαφορετικά ιστορικά επεισόδια καλούν τους μαθητές να βιώσουν την ιστορία και να μπουν στο ρόλο των ενεργών προσώπων. 3.Τέσσερα από τα ιστορικά επεισόδια ζωντανεύουν ως ταινίες μικρού μήκους που αναπτύχθηκαν και παρήχθησαν από μαθητές. Αυτές οι ταινίες μικρού μήκους μπορούν να χρησιμοποιηθούν σε συνδυασμό με τα επεισόδια ή ανεξάρτητα από το βιβλίο εργασίας. 4.Το ομαδικό επιτραπέζιο παιχνίδι Active Citizen Team Game (LINK) επιτρέπει την ανάπτυξη λύσεων για σημαντικά ερωτήματα του μέλλοντός μας σε τέσσερα επίπεδα. Επιπλέον, περιλαμβάνονται οι πίνακες και οι κάρτες για το παιχνίδι ACT καθώς και ένας οδηγός για μαθητές και ένα εγχειρίδιο για δασκάλους που μπορούν να εκτυπωθούν. 5.Ο Οδηγός για Εκπαιδευτικούς (LINK) παρέχει μια συμπυκνωμένη επισκόπηση των βασικών εννοιών του έργου, ευκαιρίες αναστοχασμού για τους εκπαιδευτικούς σχετικά με τις δικές τους ανάγκες στο επάγγελμα του εκπαιδευτικού, περιγραφές όλων των εκπαιδευτικών υλικών, ένα φυλλάδιο για τη δημοκρατική σχολική κουλτούρα και περαιτέρω πρακτικές εφαρμογές του εκπαιδευτικού υλικού του έργου. Δείτε περισσότερα στο Δελτίο Ενημέρωσης 6, εδώ."
