title = "GUnet – Greek Universities Network"
full_description = "Αρχική Σελίδα Το Ακαδημαϊκό Διαδίκτυο και οι στόχοι του Το «Ακαδημαϊκό Διαδίκτυο» (GUnet) είναι μία αστική εταιρεία μη κερδοσκοπικού χαρακτήρα με μέλη όλα τα ακαδημαϊκά ιδρύματα (25 Πανεπιστήμια). Αποτελεί ένα δίκτυο συνεργασίας των ΑΕΙ και των στελεχών τους προκειμένου να καταγράφονται οι κοινές ανάγκες, σχεδιάζονται και υλοποιούνται κοινές λύσεις μέσω οικονομίας κλίμακας και να πραγματοποιείται ανταλλαγή και διάχυση τεχνογνωσίας. Οι στόχοι του Ακαδημαϊκού Διαδικτύου προσδιορίζονται από τις ευρύτερες δικτυακές ανάγκες και επιδιώξεις της ακαδημαϊκής κοινότητας της χώρας στο πλαίσιο της Κοινωνίας της Πληροφορίας, με σκοπό την εξυπηρέτηση της έρευνας και της εκπαίδευσης. Oι υπηρεσίες που παρέχει απευθύνονται προς τα μέλη της, τους ακαδημαϊκούς χρήστες αλλά και το ευρύ κοινό. Πλατφόρμες Τηλεκπαίδευσης Υπηρεσίες προς κοινό Πύλη Αναζήτησης Ανοικτών Μαθημάτων Ελεύθερη Φιλοξενία Μαθημάτων Ανοικτά Μαθήματα της GUnet Πολυμεσικό Υλικό από δράσεις της GUnet Υπηρεσίες προς ακαδημαϊκούς χρήστες Uniway: Πύλη Kινητής Eπικοινωνίας για τους Φοιτητές Ζωντανή μετάδοση LiveStream Φιλοξενία μαθημάτων GUnet eClass Υπηρεσίες προς ιδρύματα/μέλη Αρχή Πιστοποίησης των Ακαδημαϊκών Ιδρυμάτων – HARICA Σύστημα Διαχείρισης Ηλεκτρονικών Ταυτοτήτων (IDM) Πλατφόρμα Ελέγχου Ποιότητας Δεδομένων Μητρώων (Identify) Τηλεφωνία μέσω Διαδικτύου – VoIP Καταχωρητής Domains .gr Κέντρο Υποστήριξης η-Μάθησης και Πολυμέσων – KYMA Υπηρεσίες Αποστολής και Λήψης Σύντομων Μηνυμάτων (SMS) WebΑnalytics"
