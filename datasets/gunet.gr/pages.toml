title = "Πολιτική Απορρήτου – GUnet"
full_description = "Πολιτική Απορρήτου Η Πολιτική Απορρήτου διέπει τις διαδικασίες με τις οποίες η εταιρία “Ακαδημαϊκό Διαδίκτυο GUnet” συλλέγει, χρησιμοποιεί, διαχειρίζεται ή μοιράζεται πληροφορίες και προσωπικά δεδομένα από τους Χρήστες που επισκέπτονται τον Ιστοχώρο της εταιρίας https://www.gunet.gr ή τους σχετικούς Ιστοχώρους των Υπηρεσιών που η εταιρία παρέχει. Προσωπικές Πληροφορίες Μπορούμε να συλλέξουμε προσωπικές πληροφορίες ταυτοποίησης από τους Χρήστες που επισκέπτονται τον Ιστοχώρο μας ή χρησιμοποιούν τις Υπηρεσίες μας, όταν οι επισκέπτες επιλέξουν να συμπληρώσουν μία φόρμα, ή να απαντήσουν σε μια έρευνα σε σχέση με άλλες δραστηριότητες, Υπηρεσίες, Λειτουργίες ή πόρους που διατίθενται από τον Ιστοχώρο μας ή τις Υπηρεσίες που παρέχουμε. Μπορεί να ζητηθεί από τους Χρήστες κατά περίπτωση, όνομα, διεύθυνση ηλεκτρονικού ταχυδρομείου ή αριθμός τηλεφώνου. Ωστόσο, οι Χρήστες μπορούν να επισκεφθούν τον Ιστοχώρο μας ανώνυμα. Μπορεί κατά περίπτωση να συλλέγουμε προσωπικές πληροφορίες από τους χρήστες μόνο εάν μας τις υποβάλουν οικειοθελώς. Οι Χρήστες μπορούν πάντα να αρνηθούν να παρέχουν πληροφορίες σχετικά με ορισμένες δραστηριότητες που σχετίζονται με τον Ιστοχώρο της GUnet ή με τις Υπηρεσίες της. Μη Προσωπικές Πληροφορίες ταυτοποίησης Μπορούμε να συλλέξουμε μη προσωπικές πληροφορίες ταυτοποίησης σχετικά με τους χρήστες όταν αλληλεπιδρούν με τον Ιστοχώρο μας ή με τις Υπηρεσίες μας. Οι μη προσωπικές πληροφορίες ενδέχεται να περιλαμβάνουν το πρόγραμμα περιήγησης (browser), τον τύπο του υπολογιστή και τεχνικές πληροφορίες σχετικά με την επίσκεψη του Χρήστη. Cookies των προγραμμάτων περιήγησης Ο Ιστοχώρος της εταιρίας και οι σχετικοί Ιστοχώροι των Υπηρεσιών που παρέχει, μπορεί να χρησιμοποιεί “cookies” για να βελτιώσουν την εμπειρία πλοήγησης του Χρήστη. Το πρόγραμμα περιήγησης του χρήστη αποθηκεύει τα cookies στον σκληρό δίσκο του υπολογιστή του, για την αποθήκευση πληροφοριών σχετικά με την πλοήγησή του στον Ιστοχώρο και μερικές φορές για την παρακολούθηση πληροφοριών σχετικά με αυτά. Ο Χρήστης μπορεί να επιλέξει να ορίσει στο πρόγραμμα περιήγησης ιστού να αρνηθεί τα cookies ή να τον ειδοποιεί κατά την αποστολή των cookies. Αν τυχόν επιλέξει να μην παραλάβει cookies, τότε η εμπειρία πλοήγησης στον Ιστοχώρο του Ακαδημαϊκού Διαδικτύου και των Υπηρεσιών του, πιθανώς να υποβαθμιστεί και να μην μπορούν να δουν κάποιο τμήμα από το περιεχόμενο. Πως χρησιμοποιούμε τις συλλεγόμενες πληροφορίες Η GUnet ενδέχεται να συλλέξει και να χρησιμοποιήσει τις προσωπικές πληροφορίες των Χρηστών για τους ακόλουθους σκοπούς: Για να επισκεφθείτε και να χρησιμοποιήσετε τον Ιστοχώρο και της Υπηρεσίες μας Μπορεί να χρειάζονται για την σωστή εμφάνιση των πληροφοριών σας στις ιστοσελίδες του Ιστοχώρου και των Υπηρεσιών. Για τη βελτίωση της εξυπηρέτησης πελατών Οι πληροφορίες που παρέχετε μας βοηθούν να ανταποκριθούμε πιο αποδοτικά στις ανάγκες εξυπηρέτησης και υποστήριξης των Χρηστών. Προσαρμογή της εμπειρίας των Χρηστών Μπορούμε να χρησιμοποιήσουμε αυτές τις πληροφορίες για προσωποποιημένη εμπειρία πλοήγησης στον Ιστοχώρο και τις παρεχόμενες Υπηρεσίες. Για την αποστολή περιοδικών μηνυμάτων ηλεκτρονικού ταχυδρομείου Μπορούμε να χρησιμοποιήσουμε τη διεύθυνση ηλεκτρονικού ταχυδρομείου για να χρησιμοποιηθεί σε σχετικές απαντήσεις στα ερωτήματά σας, τις ερωτήσεις σας ή/και σε άλλα αιτήματα. Πως προστατεύουμε τα Προσωπικά Δεδομένα Υιοθετούμε και εφαρμόζουμε κατάλληλες πρακτικές συλλογής, αποθήκευσης και επεξεργασίας δεδομένων και τα απαιτούμενα μέτρα ασφαλείας για την προστασία από μη εξουσιοδοτημένη πρόσβαση, τροποποίηση, αποκάλυψη ή καταστροφή των προσωπικών σας πληροφοριών, του ονόματος χρήστη, του κωδικού πρόσβασης, των πληροφοριών συναλλαγών και των δεδομένων που είναι αποθηκευμένα στον Ιστοχώρο μας και στα πληροφοριακά συστήματα των Υπηρεσιών μας. Κοινή χρήση των προσωπικών σας πληροφοριών Δεν εμπορευόμαστε καθ’ οποιοδήποτε τρόπο προσωπικές πληροφορίες και δεδομένα με κανένα ιδιώτη ή φορέα. Διατηρούμε όμως το δικαίωμα να μοιραστούμε συγκεντρωτικές δημογραφικές πληροφορίες, που δεν συνδέονται με ουδεμία προσωπική πληροφορία ή δεδομένο που σχετίζεται με Χρήστες ή επισκέπτες του Ιστοχώρου και των Υπηρεσιών μας, με αξιόπιστους συνεργαζόμενους φορείς ή εταιρίες. Ηλεκτρονικά ενημερωτικά δελτία Αποστέλλονται, αν ο Χρήστης αποφασίσει να συμμετάσχει σε κάποια λίστα αλληλογραφίας, που περιλαμβάνει νέα της εταιρίας, ενημερώσεις, πληροφορίες σχετικά με προϊόντα ή υπηρεσίες κλπ. Αν σε οποιαδήποτε χρονική στιγμή ο Χρήστης επιθυμεί να διαγραφεί από κάποια λίστα αλληλογραφίας και να μην λαμβάνει μελλοντικά μηνύματα ηλεκτρονικού ταχυδρομείου, βρίσκει τις σχετικές λεπτομερείς οδηγίες διαγραφής στο κάτω μέρος κάθε σχετικού email, ενώ μπορεί και να επικοινωνήσετε μαζί μας μέσω της ιστοσελίδας μας. Διαδικτυακοί τόποι τρίτων Οι χρήστες μπορούν να βρουν διαφήμιση ή άλλο περιεχόμενο στους συνεργάτες, τους προμηθευτές, τους διαφημιζόμενους, τους χορηγούς, τους δικαιοπαρόχους και άλλα τρίτα μέρη που ίσως να επισκεφθούν αν επιλέξουν κάποιο σύνδεσμο του Ιστοχώρου του Ακαδημαϊκού Διαδικτύου και των Υπηρεσιών του. Δεν ελέγχουμε το περιεχόμενο ή τους συνδέσμους που εμφανίζονται σε αυτούς τους ιστοχώρους, ενώ η GUnet δεν μπορεί να θεωρηθεί υπεύθυνη για κανένα λόγο για κάποιον Ιστοχώρο τρίτου. Επιπλέον, οι συγκεκριμένοι ιστοχώροι ή υπηρεσίες, συμπεριλαμβανομένου του περιεχομένου και των συνδέσμων τους, μπορεί να αλλάζουν διαρκώς. Αυτοί οι ιστοχώροι τρίτων και οι υπηρεσίες ενδέχεται να έχουν τις δικές τους πολιτικές απορρήτου και τις πολιτικές εξυπηρέτησης πελατών. Περιήγηση και αλληλεπίδραση σε οποιονδήποτε άλλο ιστοχώρο, συμπεριλαμβανομένων ιστοχώρων που έχουν σύνδεσμους προς τον Ιστοχώρο της GUnet και των Υπηρεσιών της, υπόκεινται στους όρους και τις πολιτικές του εκάστοτε συγκεκριμένου Ιστοχώρου τρίτου. Αλλαγές σε αυτήν την πολιτική απορρήτου Η GUnet έχει τη διακριτική ευχέρεια να ενημερώνει ανά πάσα στιγμή αυτή την Πολιτική Απορρήτου. Πέρα από τη σχετική αλλαγή στη σχετική ιστοσελίδα του Ιστοχώρου μας, συνήθως ενημερώνουμε σχετικά και με μήνυμα ηλεκτρονικού ταχυδρομείου. Ενθαρρύνουμε τους χρήστες να ελέγχουν συχνά αυτήν τη σελίδα για τυχόν αλλαγές ώστε να ενημερώνονται σχετικά με τον τρόπο με τον οποίο προστατεύουμε τις προσωπικές πληροφορίες που συλλέγουμε. Είναι δική σας ευθύνη να επανεξετάζετε περιοδικά αυτή την πολιτική απορρήτου και να γνωρίζετε τις τροποποιήσεις. Αποδοχή των Ανωτέρω Όρων Χρησιμοποιώντας αυτόν τον Ιστοχώρο, δηλώνετε ότι αποδέχεστε αυτήν την πολιτική. Εάν δεν συμφωνείτε με αυτήν την πολιτική, παρακαλείσθε να μην χρησιμοποιήσετε τον Ιστοχώρο μας και τις προσφερόμενες Υπηρεσίες. Η συνέχιση της χρήσης του Ιστοχώρου και των Υπηρεσιών της εταιρίας “Ελληνικό Διαδίκτυο GUnet”, μετά την καταχώριση των αλλαγών αυτής της πολιτικής και την σχετική ενημέρωση των Χρηστών, υποθέτει ότι αποδέχονται τις εκάστοτε αλλαγές της πολιτικής. UAuth Εφαρμογή Η εφαρμογή UAuth διατηρεί δεδομένα που αφορούν το rolled-out token, το οποίο κοινοποιείται μέσω ενός QR κωδικού κατά την εγκατάσταση του. Αυτές οι πληροφορίες μπορεί να περιλαμβάνουν το όνομα χρήστη, τη διεύθυνση email, το όνομα ή το επώνυμο. Η εφαρμογή δεν αποστέλλει κανένα δεδομένο σε εξωτερικές τοποθεσίες. Για την εφαρμογή είναι απαραίτητη η πρόσβαση στο διαδίκτυο. Χρησιμοποιείται αποκλειστικά κατά την εγκατάσταση και χρήση των push tokens. Κατά τη χρήση ενός push token, εμπλέκονται είτε η υπηρεσία Google Firebase είτε η υπηρεσία Apple Notification. Μαζί με ένα cryptographic challenge, αποστέλεται και ο σειριακός αριθμός του token, αυτός ο αριθμός μπορεί να θεωρηθεί ως προσωπική αναγνωρίσιμη πληροφορία. Η εφαρμογή χρησιμοποιεί την κάμερα για τη σάρωση QR κωδικών, αλλά δεν διατηρεί καμία εικόνα που έχει ληφθεί από την κάμερα κατά τη διάρκεια αυτής της διαδικασίας. Επικοινωνία Αν έχετε οποιεσδήποτε ερωτήσεις σχετικά με αυτήν την Πολιτική Απορρήτου, επικοινωνήστε μαζί μας. Το παρόν έγγραφο ενημερώθηκε τελευταία φορά στις 11 Απριλίου 2023"
