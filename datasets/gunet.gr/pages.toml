title = "GUnet – Greek Universities Network"
full_description = "Home Page The Greek Universities Network and its objectives The Greek Universities Network (Gunet) is a non-profit company with members all 25 public universities in Greece. GUnet’s mission is to promote, facilitate and coordinate the deployment of advanced information and communication technologies, services, and applications in the Greek academic community, as well as to support the digital transformation of higher education institutions (HEIs) in Greece. GUnet’s mission includes the coordination of initiatives that advance the e-governance in education and research, the design and development of application platforms for HEIs, and the delivery of digital services for education that run at national level. In its role as central service provider, and through its participation in several EU and national R&D projects, GUnet has developed strong expertise in the areas of data governance, identity management, trust services provision, and advanced e-learning systems. Also, through its national service hub, it provides the data linkages and connection services between the Greek HEIs and the rest of the world. e-learning platforms Public Services Greek Open Cources Portal Online Courses Free Hosting Open Courses by GUnet Multimedia Material from GUnet’s activities Services for Academic Users Uniway: Mobile application for students Live Streaming (LiveStream) Online Courses Hosting (GUnet eClass) Services for HEI Members Hellenic Academic & Research Institutions Certification Authority (HARICA) Identity Management System Collaborative Data Cleansing Platform for Registers (Identify) Telephony via Internet – VoIP Domain Name Registrar (domains .gr) Support Center for e-learning and Multimedia Production SMS Aggregator WebΑnalytics"
