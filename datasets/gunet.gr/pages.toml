title = "FENICE |  Δελτίο Τύπου 1 | Μάιος 2021 – GUnet"
full_description = "FENICE | Δελτίο Τύπου 1 | Μάιος 2021 Date: 14 Μαΐου, 2021 Author: Pantelis Balaouras Ακαδημαϊκή Εταιρική Σχέση για την Ανάπτυξη των Δεξιοτήτων για τις Πολιτιστικές και Δημιουργικές Βιομηχανίες (ΠΔΒ) Οι κλάδοι του πολιτισμού και της δημιουργικότητας (Π&Δ) αναγνωρίζονται στην Ευρώπη για την ταχεία απορρόφηση νέων γνώσεων, καινοτόμων διαδικασιών, μοντέλων και τεχνολογιών. Αποτελούν σημαντική ενίσχυση των καινοτομιών σε πολλούς άλλους τομείς. Οι ΠΔΒ χρειάζονται πραγματική αλληλεπίδραση μεταξύ των διαφόρων τομέων έρευνας και μελετών κατά τρόπο ώστε η εκπαίδευση όχι μόνο να ενθαρρύνει μια νέα νοοτροπία προσανατολισμένη προς την αξιοποίηση της δημιουργικής οικονομίας, αλλά και να προωθήσει την καλύτερη κατανόηση των ΠΔΒ ως “φάρους” μιας κοινωνίας χωρίς αποκλεισμούς βασισμένης στη γνώση. Ωστόσο, οι ΠΔΒ καθορίζονται σε περιφερειακό επίπεδο, ευημερούν από τους τοπικούς πόρους και δίνουν αξία στις κοινότητες δημιουργώντας θέσεις εργασίας σε περιφερειακό και τοπικό επίπεδο. Ταυτόχρονα, οι ΠΔΒ συγκαταλέγονται μεταξύ των πλέον επηρεαζόμενων τομέων από την πανδημία και η ανάκαμψη και η βιωσιμότητά τους χρειάζονται τις συντονισμένες ενέργειες όλων των ενδιαφερομένων. Για να αξιολογηθούν οι θετικές επιπτώσεις των ΠΔΒ στις τοπικές και περιφερειακές οικονομίες και να προσδιοριστούν οι αναπτυξιακές προοπτικές, πέντε αναγνωρισμένα ακαδημαϊκά και ερευνητικά ιδρύματα εγκαινίασαν το Πρόγραμμα Erasmus+ με την ονομασία FENICE: Προώθηση της επιχειρηματικότητας και της καινοτομίας στις πολιτιστικές και δημιουργικές βιομηχανίες (ΠΔΒ) μέσω της διεπιστημονικής εκπαίδευσης. Είμαστε τοτο Varna University of Management (Βουλγαρία), το Ακαδημαϊκό Διαδίκτυο GUnet (Ελλάδα), το Universitatea Nationala De Arte (Ρουμανία), το Universidade Portucalense (Πορτογαλία) και το Univerzitet Novom Sadu (Δημοκρατία της Σερβίας). Το έργο FENICE επιδιώκει να ενισχύσει την ποιότητα και τη συνάφεια της επιχειρηματικής και καλλιτεχνικής εκπαίδευσης για τις ΠΔΒ εστιάζοντας στις μη τεχνολογικές καινοτομίες που δημιουργούνται στο πλαίσιο της δημιουργικής οικονομίας στις χώρες και τις περιφέρειές μας. Θα το επιτύχουμε μέσω – ανταλλαγή έρευνας και βέλτιστων πρακτικών στον τομέα της διαχείρισης και της επιχειρηματικότητας για τις ΠΔΒ με σκοπό την προσαρμογή της εκπαίδευσης στις ανάγκες δεξιοτήτων της δημιουργικής οικονομίας, στην καινοτομία και στην αξία της βιωσιμότητας, – τη συνδυασμένη γονιμοποίηση μεταξύ επιχειρήσεων/οικονομικών, τεχνών, πολιτιστικής κληρονομιάς, ΤΠΕ και μελετών στον τομέα των μέσων ενημέρωσης και την ανάπτυξη καινοτόμων προγραμμάτων σπουδών σε αυτή τη βάση· – ανάπτυξη εταιρικής σχέσης ακαδημαϊκής-επιχειρηματικής δραστηριότητας για την προώθηση της επώασης, της δημιουργίας νέων επιχειρήσεων και της επιχειρηματικότητας σε ΠΔΒ στις τοπικές κοινότητες. Το FENICE λειτουργεί από τον Νοέμβριο του 2020 έως τον Οκτώβριο του 2022. Ακολουθήστε την εργασία μας στην ιστοσελίδα μας www.fenice-project.eu και μέσω facebook https://www.facebook.com/ProjectFENICE Κατεβάστε το Δελτίου Τύπου από εδώ. Posted in: Υλικό επικοινωνίας. Last Modified: 19 Μαΐου, 2021"
year_published = 2021
year_updated = 2021
