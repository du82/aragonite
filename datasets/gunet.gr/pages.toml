["https://www.gunet.gr/el/centaur-4"]
title = "Centaur – Ενημερωτικό Δελτίο 4 – GUnet"
full_description = "Centaur – Ενημερωτικό Δελτίο 4 Date: 15 Φεβρουαρίου, 2023 Author: Pantelis Balaouras Φεβρουάριος 2023 Τα τελευταία νέα του έργου CENTAUR Καθώς το έργο ολοκληρώνεται σύντομα, η κοινοπραξία του CENTAUR εντείνει τις προσπάθειές της ώστε να διασφαλίσει όχι μόνο την υψηλή ποιότητα των αποτελεσμάτων του έργου αλλά και την ευρεία διάδοσή του στην κοινότητα, σε τοπικό, εθνικό και Ευρωπαϊκό επίπεδο. Για αυτό τον λόγο, έχουν προγραμματιστεί πολλαπλές εκδηλώσεις που θα πραγματοποιηθούν κατά την τρέχουσα περίοδο. Έχουν ήδη πραγματοποιηθεί εκδηλώσεις στην Αυστρία, την Κύπρο και την Ισλανδία, ενώ αναμένονται και στις υπόλοιπες χώρες που συμμετέχουν στο έργο (Γερμανία, Ελλάδα). Σκοπός αυτών των ενημερωτικών και επιμορφωτικών εκδηλώσεων είναι η προβολή του έργου σε μέλη των ομάδων-στόχων καθώς και σε ενδιαφερόμενους φορείς. Οι συμμετέχοντες θα έχουν την ευκαιρία να ενημερωθούν σχετικά με το έργο και τις λειτουργίες της ηλεκτρονικής πλατφόρμας, καθώς και να συμμετάσχουν σε διάφορες διαδραστικές δραστηριότητες. Επιπρόσθετα, θα πραγματοποιηθεί στην Ελλάδα, στις 20-21 Φεβρουαρίου 2023, η τελευταία συνάντηση των εταίρων, κατά την οποία θα έχουν την ευκαιρία να συναντηθούν δια ζώσης και να συζητήσουν τα τρέχοντα ζητήματα αναφορικά με την υλοποίηση του έργου, καθώς επίσης και να αξιολογήσουν τη συνολική πρόοδό του. Κατεβάστε το Ενημερωτικό Δελτίο από εδώ. Posted in: Newsletter. Last Modified: 17 Μαρτίου, 2023"
