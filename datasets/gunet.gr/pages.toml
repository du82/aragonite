title = "Υπηρεσία Κεντρικής Ταυτοποίησης SSO – GUnet"
full_description = "Υπηρεσία Κεντρικής Ταυτοποίησης SSO Η Υπηρεσία Κεντρικής Πιστοποίησης (SSO) παρέχεται από την GUnet στα ιδρύματα για την ταυτοποίηση των χρηστών του ιδρύματος. Μέσω αυτής οι χρήστες μπορούν να πραγματοποιήσουν σύνδεση σε εξουσιοδοτημένες υπηρεσίες του ιδρύματος με τον μοναδικό ακαδημαϊκό τους λογαριασμό. Η υπηρεσία SSO διαλειτουργεί με ένα από τα παρακάτω πρωτόκολλα ταυτοποίησης: CAS OAuth2 SAML Open ID Connect (OIDC) Μαζί με την υπηρεσία παρέχονται και 3 τρόποι ταυτοποίησης πολλαπλού παράγοντα (MFA): Push Notification σε συνδεδεμένη συσκευή μέσω της εφαρμογής UAuth Time-based One-Time Password μέσω Google Authenticator SMS Το SSO συνδέεται με το uSIEM ώστε οι διαχειριστές των ιδρυμάτων να πραγματοποιούν επισκόπηση και ανάλυση των logs της υπηρεσίας. Για επικοινωνία σχετικά με την υπηρεσία τα μέλη της GUNet μπορούν να απευθύνονται στη διεύθυνση email identity@gunet.gr Ακολουθούν τυπικά screenshots της υπηρεσίας:"
