["https://www.gunet.gr/el/mobile-money"]
title = "Έργο Mobile Money – GUnet"
full_description = "Έργο Mobile Money Date: 15 Απριλίου, 2024 Author: Pantelis Balaouras Ένα σημαντικό έργο Erasmus+ ξεκίνησε στο τέλος του 2023, με στόχο την αύξηση των δεξιοτήτων και των ικανοτήτων των ηλικιωμένων στη χρήση λύσεων κινητού χρήματος. Η Asociatia Four Change, σε συνεργασία με τις εταιρείες Zavod IZRIIS (Σλοβενία), E-SENIORS (Γαλλία), Ακαδημαϊκό Διαδίκτυο – GUnet (Ελλάδα), Asociatia Niciodată Singur – Prietenii Vârstnicilor (Ρουμανία) και Fundació Gesmed (Ισπανία), υπέβαλε αίτηση και ανέπτυξε το έργο MOBILE MONEY στο πλαίσιο του προγράμματος Erasmus+, KA220-ADU – Συμπράξεις συνεργασίας στην εκπαίδευση ενηλίκων. Το MOBILE MONEY στοχεύει στη βελτίωση των δεξιοτήτων των ηλικιωμένων στη χρήση λύσεων διαχείρισης χρημάτων μέσω έξυπνων κινητών συσκευών. Το έργο θα αναπτύξει μια μεθοδολογία κατάρτισης με τη χρήση τεχνικών μάθησης με πράξη με μια παιγνιώδη προσέγγιση για την παροχή κατάρτισης σε ένα ασφαλές και φιλικό προς το χρήστη περιβάλλον προσομοίωσης. Η προσέγγιση αυτή αποσκοπεί στην αντιμετώπιση των ανησυχιών και των δισταγμών, επιτρέποντας στους ηλικιωμένους να χρησιμοποιούν με αυτοπεποίθηση λύσεις με την χρήση του έξυπνου κινητού τους στην καθημερινή τους ζωή. Με περίπου 90 εκατομμύρια άτομα ηλικίας 65 ετών και άνω στην ΕΕ-27, και ο αριθμός αυτός αναμένεται να αυξηθεί σημαντικά στο μέλλον, η ανάγκη για ψηφιακές λύσεις χωρίς αποκλεισμούς είναι πιο επιτακτική από ποτέ. Το MOBILE MONEY στοχεύει στην αύξηση της οικονομικής ένταξης και του ψηφιακού αλφαβητισμού των ηλικιωμένων πολιτών. Το έργο MOBILE MONEY αποσκοπεί στην επίτευξη των ακόλουθων στόχων: Ενίσχυση της ψηφιακής ετοιμότητας, ανθεκτικότητας και ικανότητας: Η πρωτοβουλία θα επικεντρωθεί στην ανάπτυξη ψηφιακών δεξιοτήτων και ικανοτήτων μεταξύ των ηλικιωμένων για τη χρήση τεχνολογιών κινητής τηλεφωνίας στη διαχείριση χρημάτων και τη διενέργεια συναλλαγών. Περιλαμβάνει τη δημιουργία ενός εξειδικευμένου “Εκπαιδευτικού Εργαλείου Διαχείρισης Χρημάτων μέσω κινητών συσκευών” για την προώθηση της άμεσης απόκτησης δεξιοτήτων και της ανεξαρτησίας. Προώθηση της ένταξης και της ποικιλομορφίας: Το έργο δίνει προτεραιότητα στην κοινωνική ένταξη των ηλικιωμένων με την αύξηση της αυτονομίας και των ψηφιακών δεξιοτήτων τους, επιτρέποντας την καλύτερη επικοινωνία με την οικογένεια και τους φίλους και βελτιώνοντας την πρόσβαση σε αγαθά και υπηρεσίες. Βελτίωση της πρόσβασης σε ευκαιρίες μάθησης υψηλής ποιότητας: Το MOBILE MONEY σχεδιάζει μια ευέλικτη μεθοδολογία κατάρτισης προσαρμοσμένη στις ανάγκες των ηλικιωμένων, αξιοποιώντας ευκαιρίες πρακτικής κατάρτισης, ψηφιακής και μικτής μάθησης. Με έμφαση στην ενεργό γήρανση, τις ψηφιακές δεξιότητες και τις οικονομικές και χρηματοπιστωτικές υποθέσεις, το έργο MOBILE MONEY επιδιώκει να ενισχύσει την κοινωνική ένταξη, την ευημερία και την πρόσβαση των ηλικιωμένων σε αγαθά και υπηρεσίες. Μάθετε περισσότερα στην ιστοθέση του έργου: elderlymobilemoney.eu Posted in: Αναπτυξιακά Έργα/Δράσεις. Last Modified: 15 Απριλίου, 2024"
