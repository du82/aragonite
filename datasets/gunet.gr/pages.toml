title = "WBS – GUnet"
full_description = "WBS Date: 14 Ιουνίου, 2019 Author: Pantelis Balaouras Αντικείμενο: To έργο Workplace Basic Skills (WBS) Training for Low-Skilled Migrants απευθύνεται σε μετανάστες με χαμηλό επίπεδο κοινωνικών δεξιοτήτων καθώς και δεξιοτήτων στην αριθμητική, γραφή προκειμένου να τις βελτιώσουν. Οι δραστηριότητες του έργου περιλαμβάνουν –την ανάπτυξη Κατευθυντήριων Γραμμών (Οδηγίες) για εκπαιδευτές, –την παραγωγή εκπαιδευτικού υλικού, –την ανάπτυξη ψηφιακής πλατφόρμας για την εκπαίδευση καθώς και εφαρμογή για κινητές συσκευές. Ο ρόλος της GUnet: Yπηρεσία φιλοξενίας του υλικού βασισμένη στο Open eClass, υπηρεσία τηλεσυνεργασίας, ανάπτυξη mobile εφαρμογής. Έναρξη: 1/11/2018, Διάρκεια 2 έτη Προϋπολογισμός GUnet: 43.810 € Χρηματοδότηση: Erasmus+ Posted in: Αναπτυξιακά Έργα/Δράσεις. Last Modified: 14 Ιουνίου, 2019"
