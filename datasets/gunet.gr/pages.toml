["https://www.gunet.gr/el/crisiss"]
title = "CRISISS – GUnet"
full_description = "CRISISS Date: 2 Απριλίου, 2021 Author: Pantelis Balaouras Αντικείμενο του έργου CRISISS CRISSIS – Soft Skills Assessment and Competence Validation for Volunteers in Transnational Crisis Μέσα σε λίγες εβδομάδες, η κρίση του COVID – 19 οδήγησε τον τομέα της εθελοντικής εργασίας σε αλλαγές που για χρόνια φαινόντουσαν αδιανόητες και οι οποίες μετέτρεψαν τρέχουσες εξελίξεις που που παρήγαγαν ανησυχία προς το αντίθετο, έδωσαν ελπίδα. Παρόλο που δεν είναι διαθέσιμα δεδομένα κατά τη σύνταξη αυτής της πρότασης έργου, είναι ήδη δυνατό να πούμε με βεβαιότητα: Η εθελοντική εργασία και η συναφής ανάληψη ευθύνης από την κοινωνία των πολιτών έχουν αποκτήσει μια εντελώς νέα εκτίμηση.Τα εργαλεία που αναπτύχθηκαν για το σκοπό αυτό (όπως πλατφόρμες για την τοποθέτηση εθελοντών) αναπτύχθηκαν, ενεργοποιήθηκαν και χρησιμοποιήθηκαν ουσιαστικά “εν μία νυκτί” χάρη στις ψηφιακές τεχνολογίες. Οι άνθρωποι δεν είναι μόνο εθελοντές για την ευημερία των γειτόνων τους, αλλά επίσης συνδιαλέγονται με άτομα που δεν μπορούν να φύγουν από το σπίτι ή αναλάβουν υπηρεσίες αγορών. Αναλαμβάνουν επίσης δραστηριότητες που δεν έχουν καμία σχέση με την πραγματική τους εργασία: Εκείνοι που επηρεάζονται από το μειωμένο ωράριο εργασίας ή την έλλειψη παραγγελιών και εργασίας εμπλέκονται επίσης ως εθελοντές σε περιοχές εκτός του επαγγέλματός τους όπου απαιτείται επειγόντως υποστήριξη: στη φροντίδα, στη γεωργία ή σε η οικονομία της κινητικότητας. Ανεξάρτητα από το πόσο διαφορετικό είναι το επαγγελματικό υπόβαθρο των εθελοντών, έχουν ένα κοινό: Ο εθελοντισμός σε περιόδους πανδημίας είναι μια ευκαιρία να καταπολεμηθεί προληπτικά η περιορισμένη απασχόληση και η απώλεια εισοδήματος, να είναι κοινωνικά δραστήριος και να αισθάνεται ότι ανήκει στην κοινωνία των πολιτών. Εξίσου σημαντικό, είναι επίσης ένας τρόπος να αποκτήσετε νέες μη-τεχνικές δεξιότητες (soft skills) όπως ομαδικό πνεύμα, κρίσιμες ικανότητες, δεξιότητες επικοινωνίας, διαπολιτισμική ικανότητα, διαχείριση στρες, πειθαρχία και αυτοπεποίθηση. Ο εθελοντισμός είναι ένα αποτελεσματικό μαθησιακό περιβάλλον, ειδικά για εκείνους τους ανθρώπους που έπρεπε να συνειδητοποιήσουν ότι η επαγγελματική τους δραστηριότητα δεν είναι καθόλου συστημικά σχετική όσον αφορά τη διαχείριση κρίσεων. Ακριβώς μιλώντας, ο εθελοντισμός είναι μια μεγάλη ευκαιρία, δηλαδή η απόκτηση και η επικύρωση των μαλακών δεξιοτήτων και, στη συνέχεια, η δυνατότητα χρήσης του σε οποιοδήποτε επαγγελματικό περιβάλλον ως πρόσθετο προσόν. Ωστόσο, πώς μπορεί ένας εθελοντής να αναγνωρίσει και να επικυρώσει αυτές τις νέες δεξιότητες; Πώς μπορεί ένας εργοδότης να αναγνωρίζει αυτές τις δεξιότητες ως προστιθέμενη αξία για τη δημιουργία ομάδων, διαχείριση πιεστικών καταστάσεων ή διαπολιτισμικών εργασιών; Κατά συνέπεια, είναι απολύτως θεμελιώδες να επικυρώνονται σωστά αυτές οι «μη τεχνικές δεξιότητες», δηλαδή ως νέες προσωπικές ικανότητες. Αν και η διατύπωση υποδηλώνει διαφορετικά, είναι οι «μη τεχνικές δεξιότητες» που μπορούν να κάνουν τη διαφορά στην επαγγελματική ζωή. Επομένως, ο γενικός στόχος του έργου CRISISS είναι να παρέχει σε οργανισμούς που απασχολούν εθελοντές υποστήριξη και καθοδήγηση για την εφαρμογή εσωτερικών συστημάτων αναγνώρισης των μη τεχνικών δεξιοτήτων, προκειμένου να δοθεί η δυνατότητα στους εθελοντές να αναγνωρίσουν και να εκτιμήσουν την ανάπτυξή τους σε αυτές. Για την επίτευξη αυτού του γενικού στόχου, οι συγκεκριμένοι επιμέρους στόχοι είναι Να δημιουργήσουν εργαλεία αναγνώρισης μη τεχνικών δεξιοτήτων (soft skills) (IO1) και εργαλεία αξιολόγησης (IO2), προκειμένου να βοηθήσουν τους εθελοντές να αναγνωρίσουν και να επικυρώσουν τις δικές τους δεξιότητες, να αυξήσουν την ευαισθητοποίηση σχετικά με τη σημασία των μη-τεχνικών δεξιοτήτων στην επαγγελματική ζωή και να αναγνωρίσουν άτυπες και μη επίσημες ικανότητες μέσω συγκέντρωσης αποδεικτικών στοιχείων.Να επεξεργαστούν εργαλεία αυτοπροώθησης (IO3) που θα βοηθήσουν τους εθελοντές να προωθήσουν τις μη-τεχνικές δεξιότητές τους που έχουν αποκτήσει στον εθελοντισμό και να παράσχουν τα μέσα που πρέπει να χρησιμοποιήσουν για την παρουσίαση και την αξιοποίηση των δεξιοτήτων τους με αποτελεσματικό τρόπο.Αυτά τα υλικά θα είναι διαθέσιμα σε μια πολύγλωσση και διαδραστική ηλεκτρονική πλατφόρμα (IO4) και μέσω εφαρμογής για κινητά για έξυπνα τηλέφωνα (IO4).Η διακρατική συνεργασία θα επωφεληθεί από τις διάφορες εμπειρίες και ικανότητες της ομάδας έργου σχέσης που αποτελείται από 7 ιδρύματα που εργάζονται με εθελοντές, οργανισμούς που εργάζονται με άτομα με αναπηρίες, οργανισμούς παροχής συμβουλών για νέους και οικογένειες, κοινωνικούς εταίρους, ινστιτούτα εκπαίδευσης ενηλίκων, κέντρα κοινωνικής έρευνας και εμπειρογνώμονες ΤΠΕ για την ανάπτυξη ανοικτών εκπαιδευτικών πόρων (OER). Οι κύριες ομάδες-στόχοι για το πρόγραμμά μας είναι οργανισμοί που απασχολούν εθελοντές στην καθημερινή τους εργασία. Η δευτερεύουσα ομάδα-στόχος είναι οι εθελοντές που θα μπορούν να χρησιμοποιήσουν τα εργαλεία αξιολόγησης και προώθησης και για τους οποίους η οπτικοποίηση, η τεκμηρίωση και η αναγνώριση των τυπικών, μη-τυπικών και ανεπίσημων μη-τεχνικών δεξιοτήτων στον τομέα του εθελοντισμού κατά τη διάρκεια της πανδημίας και κρίσεων θα αυξήσουν τις ευκαιρίες καριέρας τους καθώς και την προσωπική τους ανάπτυξη. Posted in: Αναπτυξιακά Έργα/Δράσεις. Last Modified: 17 Σεπτεμβρίου, 2021"
