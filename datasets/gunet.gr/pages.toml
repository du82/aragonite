title = "Δελτίο τύπου για το έργο Smart Patiens, Ιούνιος 2018 – GUnet"
full_description = "Δελτίο τύπου για το έργο Smart Patiens, Ιούνιος 2018 Date: 17 Ιουνίου, 2018 Author: Pantelis Balaouras Press release No2, Ιούνιος 2018 Έξυπνοι ασθενείς Ολιστική ενδυνάμωση των πολιτών προκειμένου να γίνουν ειδικοί στην υγεία τους Link: https://smart-patients.eu Για να γίνει κάποιος έξυπνος ασθενής πρέπει να εκπαιδευτεί. Η αντίστοιχη εκπαιδευτική διαδικασία στην οποία βασίζεται το έργο είναι η ενδυνάμωση. Για το σκοπό αυτό, απαιτείται μια ολιστική προσέγγιση που περιλαμβάνει πτυχές όχι μόνο από την ιατρική, αλλά και από την κοινωνιολογία και την ψυχολογία. Οι έξυπνοι ασθενείς κατανοούν τη δική τους συμβολή στην ανάκαμψη ως απαραίτητο συμπλήρωμα και όχι ανταγωνιστικά προς τα επιτεύγματα της ιατρικής. Θέλουν επίσης να ζήσουν μια ζωή που αποτρέπει να γίνουν ένας ασθενής. Κατανοούν ότι η υγεία δεν μπορεί να διατηρηθεί μόνο με ιατρική παρέμβαση, αλλά εξαρτάται επίσης από τον τρόπο ζωής, καθώς και από κοινωνικούς και περιβαλλοντικούς παράγοντες. Οι στόχοι του έργου «Έξυπνοι Ασθενείς» είναι η ενδυνάμωση των πολιτών ώστε να γίνουν «έξυπνοι ασθενείς» μέσω της ανάπτυξης της απαραίτητης αυτοπεποίθησης και των κατάλληλων δεξιοτήτων επικοινωνίας και αλληλοεπίδρασης με τους επαγγελματίες του τομέα της υγείας, η υποστήριξή τους προκειμένου να ανιχνεύουν προβλήματα υγείας σε αρχικό στάδιο και να συμμετέχουν στη διαδικασία της θεραπείας και της ίασης. Οι κύριοι στόχοι συνοψίζονται στο σύνθημα του έργου: Πρόληψη – Ενδυνάμωση – Συμμετοχή. Σχεδιάσαμε τρεις θεματικές ενότητες οι οποίες εστιάζουν στην ενδυνάμωση σας ώστε να αναπτύξετε την αυτοπεποίθηση και τις ικανότητές σας στη προαγωγή της υγεία σας και στη συμμετοχή σας, ως ενημερωμένος πολίτης, στο ιατροφαρμακευτικό σύστημα. Τα μαθήματα «Έξυπνοι Ασθενείς» παρέχουν ένα εύρος ευαισθητοποίησης, εκπαίδευσης και υλικού που θα ενδυναμώσουν τους πολίτες σε σημαντικά θέματα υγείας. Κάθε θεματική ενότητα αποτελείται από μια σειρά από ενότητες τις οποίες μπορεί κάποιος να ολοκληρώσει ως αυτόνομες μαθησιακές εμπειρίες. H εφαρμογή Smart Patients για κινητές συσκευές αναπτύχθηκε για να διευκολύνει την πρόσβαση στις ενότητες που είναι διαθέσιμες στο Διαδίκτυο όποτε και από όπου ο πολίτης της χρειάζεστε. Η εφαρμογή είναι διαθέσιμη για Android phones και tablets. Στο έργο “Έξυπνοι Ασθενείς” συμμετέχει μια διεπιστημονική ομάδα από κοινωνικούς, ιατρικούς και ερευνητικούς οργανισμούς, ειδικοί στον τομέα της μάθησης και της εκπαίδευσης των μέσων ενημέρωσης καθώς και εμπειρογνώμονες ΤΠΕ που επιθυμούν να ανταποκριθούν στις απαιτήσεις των ασθενών. Η κοινοπραξία των εταίρων διαθέτει όλες τις δεξιότητες που απαιτούνται για την υποστήριξη της επιτυχούς ανάπτυξης, υλοποίησης και διάδοσης του έργου. Η συνεργασία των εταίρων σε αυτό το σχέδιο λαμβάνει υπόψη την κοινωνική και πολιτιστική ποικιλομορφία των συμμετεχουσών χωρών και εξασφαλίζει επίσης την πρακτικότητα και τη σκοπιμότητα των αποτελεσμάτων. Οι συνεργάτες επικοινωνούν και διαδίδουν το έργο και τα αποτελέσματά του στο εκτεταμένο δίκτυο τους μέσω διαπροσωπικών επαφών, μέσων ενημέρωσης και διαδικτυακών δραστηριοτήτων. Διαθέτουν, επίσης, ένα ευρύ δίκτυο ενδιαφερομένων, συντελεστών και υπευθύνων χάραξης πολιτικής που στοχεύουν για την περαιτέρω αξιοποίηση των αποτελεσμάτων του έργου. Η εκμετάλλευση και η βιωσιμότητα θεωρείται ότι θα διαρκέσουν για μεγάλο χρονικό διάστημα μετά το τέλος του έργου καθώς το διαδικτυακό υλικό θα είναι διαθέσιμο μέχρι το 2023. Posted in: Υλικό επικοινωνίας. Last Modified: 17 Ιουλίου, 2018"
