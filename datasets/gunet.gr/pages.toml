["https://www.gunet.gr/el/smart-patients"]
title = "Ημερίδα “Έξυπνοι Ασθενείς” – GUnet"
full_description = "Ημερίδα “Έξυπνοι Ασθενείς” Date: 15 Νοεμβρίου, 2018 Author: Pantelis Balaouras Ημερίδα «Έξυπνοι Ασθενείς (Smart Patients)» Ημερομηνία: Παρασκευή, 23 Νοεμβρίου 2018 Ώρα: 09:30 π.μ. Τόπος: Πολιτιστικό Κέντρο «Κωστής Παλαμάς» Ακαδημίας 48 και Σίνα, Αθήνα Περιγραφή εκδήλωσης: Ημερίδα ενημέρωσης για τα αποτελέσματα του ευρωπαϊκού έργου «Έξυπνοι ασθενείς: Ολιστική ενδυνάμωση των πολιτών προκειμένου να γίνουν ειδικοί στην υγεία τους» (Smart Patients Holistic Empowerment of Citizens to Become Expert in Their Own Health) που υλοποιήθηκε στο πλαίσιο του προγράμματος ERASMUS+. Το εκπαιδευτικό υλικό είναι διαθέσιμο επίσης στα αραβικά και Pashto προκειμένου να χρησιμοποιηθεί από πρόσφυγες, μετανάστες και αιτούντες άσυλο. H κύρια ιδέα είναι η ενδυνάμωση του πολίτη, μέσω της εκπαίδευσης, ώστε να γίνει, όταν χρειαστεί, «έξυπνος ασθενής». Αναλυτικότερα, οι στόχοι του έργου είναι η υποστήριξη της μετατροπής του δυνητικού «ασθενή» σε «έξυπνο ασθενή», μέσω της ανάπτυξης της απαραίτητης αυτοπεποίθησης και των κατάλληλων δεξιοτήτων επικοινωνίας και αλληλοεπίδρασης με τους επαγγελματίες υγείας, η ευαισθητοποίηση των πολιτών προκειμένου να ανιχνεύουν προβλήματα υγείας σε αρχικό στάδιο καθώς και η κατανόηση του ρόλου τους – συμμετοχή στη ανάρρωση ως απαραίτητο συμπλήρωμα και όχι ανταγωνιστικά με τα επιτεύγματά της ιατρικής. Για την ευαισθητοποίηση και εκπαίδευση έχουν αναπτυχθεί 15 ενότητες ομαδοποιημένες σε 3 θεματικές ενότητες: 1. Πρόληψη, 2. Ενδυνάμωση ασθενούς, 3. Συμμετοχή ασθενούς. Χρήσιμοι σύνδεσμοι: 1. Ηλεκτρονική φόρμα εγγραφής 2.Πρόγραμμα ημερίδας 3. Ενημερωτικό Φυλλάδιο 4. Ιστότοπος έργου 5. Online εργαλειοθήκη 6. Newsletter Posted in: Ανακοινώσεις. Last Modified: 19 Νοεμβρίου, 2018"
year_published = 2018
year_updated = 2018
