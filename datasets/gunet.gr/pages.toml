["https://www.gunet.gr/el/fenice"]
title = "FENICE – GUnet"
full_description = "FENICE Date: 15 Ιανουαρίου, 2021 Author: Pantelis Balaouras Οι πολιτιστικές και δημιουργικές βιομηχανίες (ΠΔΒ) αναγνωρίζονται ως έξυπνοι, βιώσιμοι και χωρίς αποκλεισμούς μοχλοί ανάπτυξης για την Ευρώπη. Εκτός από τη συμβολή στην οικονομική ανάπτυξη, προάγουν την κοινωνική συνοχή, καλλιεργούν καινοτομίες και δημιουργούν θέσεις εργασίας σε τοπικό και περιφερειακό επίπεδο, παρά τις προκλήσεις που αντιμετωπίζουν οι ευρωπαϊκές οικονομίες μετά από περιοριστικούς δημόσιους προϋπολογισμούς μετά την κρίση. Οι μη τεχνολογικές καινοτομίες γεφυρώνουν αποτελεσματικότερα τις προτεραιότητες της κοινωνικής και οικονομικής ανάπτυξης.Ωστόσο, η εκπαίδευση και η κατάρτιση των επιχειρήσεων και των τεχνών δεν αντικατοπτρίζουν επαρκώς αυτήν την τάση, ειδικά στις χώρες της Νότιας και Ανατολικής Ευρώπης. Οι απαραίτητες τομεακές δεξιότητες των ΠΔΒ αναφέρονται στη διαχείριση της γνώσης και της δημιουργικότητας και αλλάζουν γρήγορα. Το έργο FENICE βασίζεται στη λογική ότι για τους ΠΔΒ προκειμένου να διατηρήσουν τον κοινωνικό τους αντίκτυπο, χρειάζονται διεπιστημονική και σχετική επαγγελματική εκπαίδευση που βασίζεται σε θέματα από επιχειρήσεις, διαχείριση, επιχειρηματικότητα, πληροφορική, μέσα ενημέρωσης και άλλα, εκτός από τον πολιτισμό και τις τέχνες.Αυτό το έργο είναι μια πρωτοβουλία συνεργασίας που περιλαμβάνει τέσσερα ιδρύματα τριτοβάθμιας εκπαίδευσης με διαφορετικά προφίλ και ένα δίκτυο πανεπιστημίων. Ο FENICE έχει το γενικό στόχο να προωθήσει τη συνεργασία, την καινοτομία και την ανταλλαγή ορθών πρακτικών μεταξύ των ενδιαφερομένων οργανώσεων από 5 χώρες του Προγράμματος (Βουλγαρία, Ελλάδα, Ρουμανία, Πορτογαλία και Σερβία) στη βελτίωση της ποιότητας και της συνάφειας της επιχειρηματικής εκπαίδευσης για τους ΠΔΒ, ενισχύοντας το καινοτόμο δυναμικό τους και κοινωνικό αντίκτυπο.Οι συγκεκριμένοι στόχοι του έργου είναι: να υποστηρίξει την έρευνα και την ανταλλαγή βέλτιστων πρακτικών στον τομέα της διαχείρισης και της επιχειρηματικότητας για τους ΠΔΒ για την προσαρμογή της εκπαίδευσης στις ανάγκες δεξιοτήτων της δημιουργικής οικονομίας, την καινοτομία και την αξία της αειφορίαςνα ξεκινήσει η διασταυρούμενη γονιμοποίηση μεταξύ επιχειρήσεων / οικονομικών, τεχνών, κληρονομιάς, πληροφορικής και μελετών για την ανάπτυξη καινοτόμων προγραμμάτων σπουδών που ενσωματώνουν πλήρως τα θέματα της καινοτομίας και της διαχείρισης αλλαγών, διατομεακή συνεργασία, πολιτιστική συν-δημιουργία, δημιουργικές τεχνολογίες και πολιτιστική επιχειρηματικότητα το διδακτικό / εκπαιδευτικό υλικόνα αναπτυχθεί ένα μοντέλο εταιρικής σχέσης των Πανεπιστημίων με την αγορά για την προώθηση της επώασης, των νεοσύστατων επιχειρήσεων και της επιχειρηματικότητας σε ΠΔΒ, συμπεριλαμβανομένης της συμβουλευτικής σταδιοδρομίας / επαγγελματικών οδών για παραδοσιακά και μη παραδοσιακοί μαθητέςνα συμβάλει στη δημιουργία λειτουργικών δημιουργικών συνεργασιών μεταξύ ΑΕΙ, επιχειρήσεων και δημόσιων αρχών για τη διατήρηση της καινοτομίας και των επιπτώσεων της δημιουργικής οικονομίαςνα μεγιστοποιηθεί ο αντίκτυπος των ολοκληρωμένων καινοτόμων προγραμμάτων σπουδών με πρωτοβουλίες επίδειξης, πιλοτικές εκπαιδεύσεις και την ανάπτυξη μιας πιλοτικής πλατφόρμας ηλεκτρονικής μάθησης για την κατάρτιση στη διαχείριση και την επιχειρηματικότητα για τους ΠΔΒ Η κύρια ομάδα-στόχος είναι πανεπιστημιακά τμήματα και οι φοιτητές στους τομείς των ΠΔΒ, των τεχνών, των μέσων μαζικής ενημέρωσης, του τουρισμού, της διαχείρισης και της επιχειρηματικότητας. Μια δευτερεύουσα ομάδα-στόχος είναι ανεξάρτητοι ερευνητές, καλλιτέχνες, επιχειρηματίες και διευθυντές σε ΠΔΒ που θα είναι σε θέση να βελτιώσουν τις γνώσεις, τις δεξιότητες και τις ικανότητές τους σχετικά με τη διαχείριση των ΠΔΒ μέσω της πλατφόρμας ηλεκτρονικής μάθησης με διαδικτυακά μαθήματα και τη βάση δεδομένων περιπτωσιολογικών μελετών.Οι δραστηριότητες του έργου περιλαμβάνουν την ανάπτυξη πνευματικών αποτελεσμάτων, διακρατικές συναντήσεις έργων, δραστηριότητες αειφορίας, δραστηριότητες διάδοσης, ένα διεθνές πρόγραμμα σπουδών και δραστηριότητες αξιολόγησης. Τα κύρια αποτελέσματα και αποτελέσματα του έργου είναι: Μία βάση δεδομένων ορθών πρακτικών και χάρτης πορείας για την επιχειρηματικότητα και την καινοτομία στους ΠΔΒ.Προγράμματα μαθημάτων «Διοίκηση και Επιχειρηματικότητα σε ΠΔΒ»Διδακτικό / εκπαιδευτικό υλικό για μαθήματα «Διοίκηση και Επιχειρηματικότητα σε ΠΔΒ»Μία πλατφόρμα ηλεκτρονικής μάθησης με διαδικτυακά μαθήματα κατάρτισης στη διαχείριση και επιχειρηματικότητα σε ΠΔΒ σχετικά με μη τεχνολογικές καινοτομίες‘Ένα μοντέλο για την εταιρική σχέση Πανεπιστημίων – αγοράς για την προώθηση της επώασης, των νεοσύστατων επιχειρήσεων και της επιχειρηματικότητας σε ΠΔΒ, συμπεριλαμβανομένης της συμβουλευτικής σταδιοδρομίας / επαγγελματικών διαδρομών για παραδοσιακούς και μη παραδοσιακούς μαθητές5 συνέδρια δημιουργικών συνεργασιών σε εθνικό επίπεδο στις 5 χώρες του έργουΔιεθνές πρόγραμμα εντατικής μελέτης και εθνικές πιλοτικές εκπαιδευτικές συνεδρίες5 ομάδες εστίασης με ακαδημαϊκούς, πολιτιστικούς επιχειρηματίες, ΜΜΕ σε ΠΔΒ, ΜΚΟ και έναν εκπρόσωπο τοπικών δημόσιων αρχών σε κάθε χώρα του έργουομότιμη καθοδήγηση για ιδέες εκκίνησης σε ΠΔΒ Ο προβλεπόμενος μακροπρόθεσμος αντίκτυπος του έργου είναι: να επιβεβαιώσει εκ νέου την αξιοπιστία των ΠΔΒ ως καινοτόμων, χωρίς αποκλεισμούς και βιώσιμων τομέωννα συμβάλει στην ανάπτυξη διεπιστημονικών εκπαιδευτικών προγραμμάτων που ανταποκρίνονται στις τρέχουσες και μελλοντικές ανάγκες δεξιοτήτων των ΠΔΒ και αυξάνουν τη θετική επίδραση στις άλλες βιομηχανίες και την κοινωνίανα συμβάλει στη δημιουργία πανεπιστημιακών δημιουργικών συνεργασιών με συμμετοχή επιχειρήσεων και δημόσιων αρχών, την υποστήριξη των ΠΔΒ εντός των κοινοτήτων και των περιφερειώννα διευκολύνει τη μεταφορά γνώσεων και ικανοτήτων στη διαχείριση των ΚΠΕ μεταξύ των ευρωπαϊκών εκπαιδευτικών ιδρυμάτων και περιφερειών Ακολουθήστε την εργασία μας στην ιστοσελίδα μας www.fenice-project.eu και μέσω facebook https://www.facebook.com/ProjectFENICE Posted in: Αναπτυξιακά Έργα/Δράσεις. Last Modified: 19 Μαΐου, 2021"
