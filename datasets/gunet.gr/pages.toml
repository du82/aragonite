["https://www.gunet.gr/el/%cf%80%cf%81%ce%bf%cf%83%cf%84%ce%b1%cf%83%ce%af%ce%b1-%cf%80%cf%81%ce%bf%cf%83%cf%89%cf%80%ce%b9%ce%ba%cf%8e%ce%bd-%ce%b4%ce%b5%ce%b4%ce%bf%ce%bc%ce%ad%ce%bd%cf%89%ce%bd"]
title = "Προστασία Προσωπικών Δεδομένων – GUnet"
full_description = "Προστασία Προσωπικών Δεδομένων Ενημέρωση του GUnet για την Προστασία των Προσωπικών Δεδομένων σύμφωνα με τον Κανονισμό (ΕΕ) 2016/679 και τη σχετική ελληνική νομοθεσία Από την 25.5.2018 εφαρμόζεται ο Γενικός Κανονισμός Προστασίας Δεδομένων (ΕΕ) 2016/679, γνωστός και ως ΓΚΠΔ, με τον οποίον ενισχύεται το πλαίσιο της προστασίας των υποκειμένων των δεδομένων όσον αφορά την επεξεργασία δεδομένων προσωπικού χαρακτήρα στην Ευρωπαϊκή Ένωση. Το GUnet με σεβασμό στα προσωπικά δεδομένα συμμορφώνεται με τον ΓΚΠΔ στο πλαίσιο της δραστηριότητας και του σκοπού του και λαμβάνει τα προβλεπόμενα τεχνικά και οργανωτικά μέτρα για την αποτελεσματική προστασία των προσωπικών δεδομένων, κατά τα προβλεπόμενα στον ΓΚΠΔ και την ελληνική νομοθεσία κατ΄ επέκταση. Υπεύθυνος Επεξεργασίας – Στοιχεία επικοινωνίας Το GUnet είναι υπεύθυνος επεξεργασίας με τα εξής στοιχεία επικοινωνίας: Διεύθυνση Έδρας: Κέντρο Λειτουργίας & Διαχείρισης Δικτύου GUnet, Παν/πολη Ιλίσια Τηλέφωνο: 210 7275611 E – mail: dpo@gunet.gr Ποια προσωπικά μου δεδομένα συλλέγονται και πώς; Τα προσωπικά δεδομένα τα οποία συλλέγει και επεξεργάζεται το GUnet είναι μόνο αυτά που είναι απαραίτητα για τον εκάστοτε συγκεκριμένο και σαφώς ορισμένο σκοπό και τη συγκεκριμένη νομική βάση. Στο πλαίσιο αυτό, η επεξεργασία που λαμβάνει χώρα αφορά τα προσωπικά δεδομένα που παρέχετε στο GUnet σε πραγματικό διαδραστικό χρόνο όταν χρησιμοποιείτε τους επίσημους διαδικτυακούς μας τόπους, τις υπηρεσίες μας ή αλληλεπιδράτε μαζί μας, για παράδειγμα συμπληρώνοντας μια αίτηση ή κάνοντας την εγγραφή σας. Σε όσες από τις περιπτώσεις η επεξεργασία θεμελιώνεται στη λήψη συγκατάθεσης, το GUnet ακολουθεί τις προβλεπόμενες από το Νόμο διαδικασίες για τη λήψη αυτής. Για ποιους σκοπούς γίνεται η επεξεργασία και ποια η νομική της βάση; Τα προσωπικά δεδομένα συλλέγονται σύμφωνα με τον ΓΚΠΔ και την ισχύουσα νομοθεσία, είτε με την έναρξη της σχέσης σας με το GUnet είτε και μεταγενέστερα και αποτελούν αντικείμενο επεξεργασίας με νομική βάση: Τη συγκατάθεσή σας, όταν απαιτείται Την εκτέλεση μιας μεταξύ μας σύμβασης Την εκπλήρωση των νομικών μας υποχρεώσεων Τη διαφύλαξη ζωτικού συμφέροντος Την εκπλήρωση καθήκοντος για το δημόσιο συμφέρον Τη διαφύλαξη έννομου συμφέροντός μας Το GUnet μπορεί να επεξεργαστεί τα προσωπικά σας δεδομένα, για τους ακόλουθους σκοπούς ανά νομική βάση: Με τη συγκατάθεσή σας Για ταυτοποίηση και επικοινωνία μαζί σας Για την εκπλήρωση της συμβατικής υποχρέωσης σε περίπτωση σύναψης σύμβασης με το GUnet ή κατά την προσυμβατική διαδικασία Για την επικοινωνία κατά την προσυμβατική διαδικασία ή κατά την εκτέλεση της σύμβασης Για την εκπλήρωση των νομικών μας υποχρεώσεων Για την εκπλήρωση των υποχρεώσεών μας, που επιβάλλονται από την ισχύουσα νομοθεσία, για το προσωπικό μας. Για την εκπλήρωση των υποχρεώσεών μας σύμφωνα με την ισχύουσα νομοθεσία για την κοινοποίηση σε Δημόσιες Αρχές (Εποπτικές, Ανεξάρτητες, κλπ.). Για τη διαφύλαξη ζωτικού συμφέροντος Για την εκπλήρωση καθήκοντος για το δημόσιο συμφέρον Για λόγους έννομου συμφέροντός μας, ως: Για την ανάπτυξη και βελτίωση των παρεχόμενων υπηρεσιών μας μέσα από τις δραστηριότητες και τα ενδιαφέροντά σας. Για τη διαχείριση των παραπόνων σας. Για τη διαχείριση κινδύνων από την αθέτηση των υποχρεώσεων που πηγάζουν από χορηγητικές συμβάσεις. Για την προστασία και ασφάλεια των συστημάτων πληροφορικής. Ποιοι είναι οι αποδέκτες των προσωπικών μου δεδομένων; Πρόσβαση στα προσωπικά σας δεδομένα έχει το προσωπικό του GUnet, στα πλαίσια της εκτέλεσης των καθηκόντων που τους ανέθεσε το GUnet ως υπεύθυνος επεξεργασίας. Το GUnet είναι υποχρεωμένο ή δικαιούται να κοινοποιεί τα προσωπικά σας δεδομένα σε διάφορους τρίτους αποδέκτες όπως: Δημόσιους φορείς Ανεξάρτητες αρχές υπό τον όρο της τήρησης σε κάθε περίπτωση του απορρήτου και του καθήκοντος εμπιστευτικότητας και εχεμύθειας. Πόσο χρόνο διατηρούνται τα δεδομένα μου; Το GUnet διατηρεί τα προσωπικά σας δεδομένα για χρονικό διάστημα που καθορίζεται από το ισχύον ανά περίπτωση νομικό και κανονιστικό πλαίσιο. Πως προστατεύονται τα δεδομένα μου; Στο GUnet εργαζόμαστε καθημερινά για να εξασφαλίσουμε ότι τα προσωπικά δεδομένα που λαμβάνουμε: Υποβάλλονται σε σύννομη και θεμιτή επεξεργασία με διαφανή τρόπο σε σχέση με το υποκείμενο των δεδομένων. Συλλέγονται αποκλειστικά για συγκεκριμένους και νόμιμους σκοπούς. Είναι επαρκή, σχετίζονται με το σκοπό για τον οποίο τα συλλέγουμε και περιορίζονται στα απαραίτητα. Είναι ακριβή και ενημερωμένα. Διατηρούνται αποκλειστικά εντός του καθορισμένου χρονικού πλαισίου και όχι περισσότερο. Τίθενται σε επεξεργασία με τέτοιο τρόπο ώστε να εξασφαλίζεται η απαραίτητη προστασία τους. Ποια είναι τα δικαιώματά μου; Το υποκείμενο των δεδομένων έχει τα ακόλουθα δικαιώματα: Το δικαίωμα πρόσβασης Μπορείτε ανά πάσα στιγμή να ενημερωθείτε από εμάς για τα προσωπικά σας δεδομένα που διατηρούμε, και να έχετε πρόσβαση σε αυτά. Το δικαίωμα στη διόρθωση δεδομένων Έχετε τη δυνατότητα να απευθυνθείτε σε εμάς για να διορθώσουμε τα δεδομένα που είναι ανακριβή ή ελλιπή. Το «δικαίωμα στη λήθη» Εφόσον δεν μας υποχρεώνει κάποιο νομοθετικό πλαίσιο να διατηρήσουμε τα δεδομένα που διατηρούμε και σχετίζονται με εσάς, μπορείτε να μας ζητήσετε να τα διαγράψουμε. Το δικαίωμα στη φορητότητα των δεδομένων Μπορείτε να μας ζητήσετε να διαβιβάσουμε τα δεδομένα σας σε άλλο φορέα. Το δικαίωμα στην εναντίωση και στον περιορισμό της επεξεργασίας Σε περίπτωση που διαφωνείτε με τον τρόπο που επεξεργαζόμαστε τα προσωπικά σας δεδομένα μπορείτε να αιτηθείτε τη διακοπή ή τον περιορισμό της επεξεργασίας. Το δικαίωμα άρσης συγκατάθεσης Έχετε το δικαίωμα να αποσύρετε τη συγκατάθεσή σας στην επεξεργασία των δεδομένων σας ανά πάσα στιγμή. Το GUnet θα καταβάλει κάθε προσπάθεια να απαντήσει στο αίτημα που θα υποβάλλετε χωρίς καθυστέρηση και σε κάθε περίπτωση εντός μηνός από την παραλαβή του. Η εν λόγω προθεσμία παρατείνεται για δύο ακόμα μήνες, εφόσον είναι απαραίτητο λαμβάνοντας υπόψη την πολυπλοκότητα του αιτήματος και το πλήθος των αιτημάτων. Το GUnet θα σας ενημερώσει για την εν λόγω παράταση εντός μηνός από την παραλαβή του αιτήματος, καθώς και για τους λόγους της καθυστέρησης. Εάν έχετε υποβάλει το αίτημα με ηλεκτρονικά μέσα, η ενημέρωση παρέχεται, εάν είναι δυνατόν, με ηλεκτρονικά μέσα, εκτός εάν εσείς ζητήσετε κάτι διαφορετικό. Εφόσον το GUnet ικανοποιήσει αίτημά σας α) για περιορισμό επεξεργασίας των δεδομένων σας ή β) για άρνηση επεξεργασίας των δεδομένων σας ή γ) για διαγραφή των δεδομένων σας από τα αρχεία του GUnet και εφόσον αυτά είναι απαραίτητα για την κατάρτιση ή τη συνέχιση και εκτέλεση σύμβασης, τότε αυτό συνεπάγεται αυτοδίκαια είτε την καταγγελία από εσάς της αντίστοιχης σύμβασης ή τη μη δυνατότητα επεξεργασίας του σχετικού σας αιτήματος. Το GUnet έχει σε κάθε περίπτωση δικαίωμα να αρνηθεί την ικανοποίηση του αιτήματός σας για περιορισμό της επεξεργασίας ή διαγραφή των προσωπικών σας δεδομένων, εάν η επεξεργασία αυτή είναι απαραίτητη για τη θεμελίωση, άσκηση ή υποστήριξη νόμιμων δικαιωμάτων του ή την εκπλήρωση υποχρεώσεών του. Οι ανωτέρω υπηρεσίες παρέχονται δωρεάν. Σε περίπτωση, ωστόσο, που τα αιτήματά σας είναι προδήλως αβάσιμα, υπερβολικά ή επαναλαμβανόμενα, το GUnet δύναται είτε να επιβάλει εύλογο τέλος, ενημερώνοντάς σας σχετικά, είτε να αρνηθεί να ανταποκριθεί σε αυτά. Για να ασκήσετε τα δικαιώματά σαςπαρακαλώ συμπληρώστε την Φόρμα Υποβολής Αιτήματος Ανάκληση της συγκατάθεσης Έχετε το δικαίωμα να ανακαλέσετε τη συγκατάθεσή σας ανά πάσα στιγμή. Η ανάκληση της συγκατάθεσης σας δε θίγει τη νομιμότητα της επεξεργασίας που βασίστηκε σε αυτή και έγινε πριν της ανάκλησής της. Υπεύθυνος Προστασίας Δεδομένων Υπεύθυνος προστασίας προσωπικών δεδομένων είναι η κα Αναστασία Πετσινάρη με τα εξής στοιχεία επικοινωνίας: Ακαδημαϊκό Διαδίκτυο (GUnet), Κέντρο Λειτουργίας & Διαχείρισης Δικτύου ΕΚΠΑ, Παν/πολη Ιλίσια. Τηλ: 210 7275611 Email: dpo@gunet.gr Αρχή Προστασίας Δεδομένων Προσωπικού Χαρακτήρα Έχετε δικαίωμα να υποβάλλετε καταγγελία στην Αρχή Προστασίας Δεδομένων Προσωπικού Χαρακτήρα (www.dpa.gr), η οποία είναι η αρμόδια εποπτική αρχή για την προστασία των θεμελιωδών δικαιωμάτων και ελευθεριών των φυσικών προσώπων έναντι της επεξεργασίας των προσωπικών τους δεδομένων του, εφόσον θεωρείτε ότι προσβάλλονται τα δικαιώματά σας με οποιοδήποτε τρόπο."
