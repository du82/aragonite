["https://www.gunet.gr/el/sse"]
title = "SSE – GUnet"
full_description = "SSE Date: 26 Οκτωβρίου, 2019 Author: Pantelis Balaouras Αντικείμενο έργου Senior Social Entrepreneurship Οι ηλικιωμένοι στην Ευρωπαϊκή Ένωση θα αποτελούν το ένα τρίτο του συνολικού πληθυσμού σε λίγο περισσότερο από μια δεκαετία. Είναι μια ομάδα ανθρώπων που φιλοδοξούν να συνεχίσουν να συνεισφέρουν με την προσωπική και επαγγελματική τους εμπειρία στην οικοδόμηση μιας κοινωνίας χωρίς αποκλεισμούς, που γερνούν ενεργά αλλά χρειάζονται τις απαραίτητες δεξιότητες για να ζήσουν πλήρως στην κοινωνία της πληροφορίας. Οι συνθήκες, η εμπειρία και οι κοινωνικοί δεσμοί τους καθιστούν ιδιαίτερα κατάλληλους για την έναρξη ή τη διατήρηση έργων κοινωνικής επιχειρηματικότητας που διαρθρώνουν τις κοινότητες, εκμεταλλεύονται την εμπειρία της ομάδας και τις δεσμεύουν ενεργά στο μέλλον των κοινωνιών. Έτσι, ο γενικός στόχος του έργου SSE είναι η ευαισθητοποίηση σχετικά με τα οφέλη της κοινωνικής επιχειρηματικότητας για τους ηλικιωμένους, ιδίως για τις γυναίκες, καθώς το ποσοστό οικονομικής συμμετοχής είναι σχεδόν το μισό από αυτό των ανδρών στην ΕΕ. Οι συγκεκριμένοι στόχοι είναι: – Να ευαισθητοποιήσει για τη σημασία των κοινωνικών επιχειρήσεων και να παρακινήσει τους ηλικιωμένους να ακολουθήσουν αυτήν την πορεία – Να αναπτύξει ένα πακέτο εκπαιδευτικών κυρίως πόρων για την κοινωνική επιχειρηματικότητα των ηλικιωμένων – Να σχεδιάσει διαδραστικά διαδικτυακά μαθήματα κατάρτισης Αυτό το έργο περιλαμβάνει κοινότητες, εκπαιδευτές εκπαίδευσης ενηλίκων, οργανισμούς ανθρώπινου δυναμικού και ηλικιωμένους που έχουν κίνητρα να συνεισφέρουν την εμπειρία τους και να ενεργούν ως μέντορες. Οι συνεργαζόμενοι οργανισμοί έχουν εκτεταμένη εμπειρία στην κοινωνική έρευνα και ως εκπαιδευτικοί πάροχοι και θα υλοποιήσουν αυτό το έργο κατά την περίοδο 2019-2021. ΑΠΟΤΕΛΕΣΜΑΤΑ • Διαδραστικά Διαδικτυακά Μαθήματα για την Κατάρτιση στην Κοινωνική Επιχειρηματικότητα με στόχο τα κενά γνώσεων σχετικά με τις δεξιότητες επιχειρηματικότητας για όσους έχουν περάσει την επαγγελματική τους ζωή ως εργαζόμενοι. • Διαδικτυακή πλατφόρμα κοινωνικής επιχειρηματικότητας: διαδικτυακά εργαλεία και διαδικτυακά διαδραστικά εργαλεία • Ολοκληρωμένη εφαρμογή για smartphone και κινητές συσκευές. Ιστότοπος: www.senior-social.uma.es Posted in: Αναπτυξιακά Έργα/Δράσεις. Last Modified: 26 Οκτωβρίου, 2020"
