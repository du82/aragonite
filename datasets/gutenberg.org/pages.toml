["https://gutenberg.org/about/contact_information.html"]
title = "Contact Information | Project Gutenberg"
description = "Project Gutenberg is a library of free eBooks."
full_description = "General help. Requests for information about Project Gutenberg eBooks or the Project Gutenberg Web pages. Errata within eBooks. To report an error within an eBook (such as a missing word or typo), please be sure to include the eBook number or specific filename or download link you used. Error reports are easiest to handle when they clearly indicate the context in which an error was found. Note that since Project Gutenberg includes many old titles, it is common for unusual spelling or arcane word uses to be used. If possible, check a printed source to verify whether an error exists, before reporting it. Messages to the errata list generate an automatic response that your report was received, within a few minutes. Any errata/bug/typo report is welcome! There is additional guidance in the FAQ on how to prepare errata reports so they are easiest for the Project Gutenberg team to handle. Start with this guidance on how to report typos. Catalog metadata errors. Report an error in the online catalog (such as a misspelled author name). There is no automated response, but typically your message is handled within a few days. For licensing questions, permissions and other such inquiries, the answer is probably in our Permission How-To. Please don’t send email without first checking the How-To. See cand.pglaf.org before reporting potential misuse of copyrighted materials. Responses are typically sent within two days. Contact the CEO of the Project Gutenberg Literary Archive Foundation, Dr. Gregory Newby. If you don’t get a response within a few days, please first check your spam filters & similar for a response. Resend your message, if no response is received within a few days. If you need to send printed mail, please consider instead scanning and emailing to the appropriate address above. But if you really need to send something physical, send to this address: There is a monthly email newsletter, also some discussion lists for discussions among volunteers (gutvol-d is the only list that still has occasional activity)."
