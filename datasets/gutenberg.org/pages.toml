full_description = "Choose among free epub and Kindle eBooks, download them or read them online. You will find the world’s great literature here, with focus on older works for which U.S. copyright has expired. Thousands of volunteers digitized and diligently proofread the eBooks, for you to enjoy. No fee or registration! Everything from Project Gutenberg is gratis, libre, and completely without cost to readers. If you find Project Gutenberg useful, please consider a small donation to help Project Gutenberg digitize more books, maintain its online presence, and improve Project Gutenberg programs and offerings. Other ways to help include digitizing, proofreading and formatting, or reporting errors. No special apps needed! Project Gutenberg eBooks require no special apps to read, just the regular Web browsers or eBook readers that are included with computers and mobile devices. There have been reports of sites that charge fees for custom apps, or for the same eBooks that are freely available from Project Gutenberg. Some of the apps might have worthwhile features, but none are required to enjoy Project Gutenberg eBooks. 50 years of eBooks 1971-2021. In 2021, Project Gutenberg celebrated the first eBook for reading enjoyment and unlimited free redistribution. This eBook was created on July 4, 1971 by Project Gutenberg’s founder, Michael S. Hart. Read more about this lasting innovation. Project Gutenberg is grateful to all volunteers who helped to reach this milestone anniversary. Project Gutenberg offers a vibrant and growing collection of the world’s great literature. Read, enjoy, and share! Audio books are a great way to enjoy and share literature. Project Gutenberg no longer adds new audio books to the collection, and suggests these audio book resources. These audio books are all freely available and in the public domain in the US. They may be easily played back on computers, tablets, mobile phones, and other devices. They may be shared non-commercially, without limitation except in countries where the printed source is still copyrighted. All of the sources listed below are digitizations of texts from Project Gutenberg."
