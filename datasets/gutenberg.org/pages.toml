description = "Project Gutenberg is a library of free eBooks."
full_description = "Project Gutenberg is happy to be a part of other organizations’ efforts. On these pages, we list some of our affiliates. In addition, we are aware of some products or services which seek to promote the distribution of free or low-cost literature, or which otherwise distribute Project Gutenberg eBooks. As a general rule the works of authors who died before 1955 are in the public domain in Australia. Works by George Orwell (died 1950), Virginia Woolf (died 1941), and James Joyce (died 1941), just to name a few authors, are in the public domain in Australia. Of course, works which are in the public domain in Australia may remain copyrighted in other Countries, even for several decades. People may not download, or read online, such works if they are in a country where they are still under copyright. That still leaves a lot of readers out there to enjoy etexts of some of the greatest literary works of the twentieth century. Project Gutenberg of Australia also provides a list all of the Project Gutenberg etexts (from both the US and Australian Collections) which were written by Australians or which relate (although loosely) to Australia, and has an extensive collection of books by and about the land and sea explorers who opened up the continent to white settlement. Project Gutenberg of Canada specializes in Canadiana literature in English and French, in the public domain in Canada. help proofread through Distributed Proofreaders of Canada. Projekt Gutenberg-DE. German literature. This was the second site to ask Michael Hart to use the Project Gutenberg name and concept, for German-language content. Currently run by a for-profit organization (Hille + Partner GbR), PG-DE provides free eBooks via their Web site, as well as selling eBooks on CD or DVD. For more information about PG-DE, read this German Wikipedia article. PG-DE runs their own Distributed Proofreaders site for content they distribute, but claims copyright on their work. The content from the central Distributed Proofreaders does not have such restrictions, and is intended for unlimited redistribution."
