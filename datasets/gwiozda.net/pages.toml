description = "Christian Gwiozda - Thesis - Generative Music with Visual Elements"
full_description = "Thesis - Generative Music with Visual ElementsThis project was part of my bachelor thesis (2012) at the design department at Hochschule Trier. A musical composition is created by arranging visual elements on the surface. Those elements can be moved, combined and divided. The shape and position is then mapped to different acoustic attributes. Hardware and software are both custom build. The table is based on a system with IR leds and the software was build with Processing and the reacTIVision framework. Audio was connect via PureData and OSC. PolyWaveSynth was used as synthesizer patch.code, interaction, processing, puredata, reactivision, sound / 2012Code on Github"
