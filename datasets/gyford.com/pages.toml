["https://gyford.com/phil/writing/2025/02/23/weeknotes"]
title = "w/e 2025-02-23 (Phil Gyford’s website)"
description = "Desk organising, DVDs, 1995, social media, and ‘Star Wars: Skeleton Crew’."
full_description = "w/e 2025-02-23 2025-02-23 18:11 Permalink At home this week, on Wednesday seeing Mary off on her trip to Finland, snow-shoeing. Of the four subsequent days, three have been filled with strong winds and pouring rain, punctuated with a single wonderfully Spring-like day of sunshine and gentle breeze. Silly weather. § This week I especially enjoyed the NTS Early Bird Show with Pam & Thelma Cappello. The Vietnamese National Song and Dance Ensemble, Einstürzende Neubaten, and Dido, together at last! It shouldn’t have worked but it was a great start to the day. NTS Latest · THE EARLY BIRD SHOW W/ PAM & Thelma Cappello 200225 § I spent an afternoon organising my desk, which involved planning the cabling on top of the desk, taking everything off, turning the desktop over, screwing three of these Pamo cable management trays to the underside with the usual DIY stress that I was about to irretrievably mess everything up, putting the desktop back, and then wiring everything together again, stuffing cables, adapters, hard drives, hubs, and more cables into those trays like they’re society’s most shameful secrets to be hidden away in order to present a pretty but deceiving surface. The underside of the desk with three trays attached Those trays were more sturdy than I expected – it’s hard to tell these days whether an unheard-of brand is a randomly generated drop-shipper or An Actual Thing but Pamo are An Actual German Thing. (Although those trays aren’t listed on their site; I guess they’re selling off an old line on Amazon?) Now my desk is nice and clear of (most) cables, free of distraction, the perfect location to Get Useful Things Done with a clear mind and avoid distractions. § So I spent too much time this week finishing the re-organising of my TV/movie files and then ripping and saving the couple of dozen DVDs I own. I stopped buying them years ago when I realised I never watched them. Maybe if the movies are on a hard drive, served with Plex, then I might watch them or, at least, they’ll last longer than the DVDs on which they’re stored? (One already refused to play although I could rip it.) Who knows. I don’t want to work out whether I’ve spent longer doing all this than I have watching anything on the DVDs over the years. I ripped the DVDs using MakeMKV, converted those files to individual MP4s using Handbrake (ensuring commentary audio tracks and subtitles were included), occasionally split single big files into separate ones using Lossless Cut, laboriously matched up all these files with the Special Features in the DVD menus, and finally named and filed the files correctly. Certainly beats doing any of the many other things that might be of any use to anyone in the world. § I think I’m quite a nostalgic person but I never go back to read past diaries, letters, etc., and very rarely look through old photos. But this week – for reasons that may become apparent in a future post – I skimmed through the many pages of diary I wrote in 1995. I was surprised how interesting I found it (not that it would be to anyone else). Most of the events I had no memory of, and those I did were slightly different, or prompted thoughts then that I’d forgotten since. It was also pleasing to realise I was happier than I’d assumed from this distance (not constantly, but enough to mention occasionally). Three things I re-learned: I received a postcard of Normski from John Peel I briefly met David Carson I was the last of my friends to find regular work Maybe I’m the first to stop too. A successful career [non-ironic]. § The social media I’m currently using and, generalising wildly, how I think of them: 🦋 Bluesky: Friends being angry, annoyed and upset at the world 🦣 Mastodon: Friends doing interesting things, sometimes a bit geeky 🦆 Slack: A few private groups of friends being nice 🗑️ Garbage Day’s Discord: All of the above, but strangers 📷 Instagram: Friends sharing their lives 🔵 Flickr: Mary and a few friends sharing their lives 🅟 Pixelfed: Like Instagram if I only knew two people using it This is my experience of them all of course; everyone’s filter bubbles are different. The above makes me think I should stop reading Bluesky: it’s no fun. I don’t read social media for news and my Bluesky is mostly that, each headline with an aggrieved comment. I still have a Twitter/X account and every few weeks I pop in out of morbid curiosity about which people I follow are still posting: fewer and fewer but still some. The most benefit-of-the-doubt I can currently muster is that their need for attention is greater than their dislike of fascists. § We gave up on watching any Star Wars some time ago – except for maybe another Andor season – but after reading a column by Andrew Male in Sight & Sound in which he raved about Star Wars: Skeleton Crew, we gave that a go. He said: … the show is both fun and funny, and devoid of the stodgy salmagundi of pseudo-important exposition that defined both Ahsoka and The Acolyte. … It’s the most excited this writer has been about a new Star Wars adventure since 1977. He was right! It was a lot of fun. I guess it’s “for kids” but in a way that, say, 1980s blockbusters featuring children are – still well-made and enjoyable for adults. The children weren’t annoying and the whole thing romps along without the weight of self-importance, just like those early Star Wars movies. § That is it. May this be the last of the wind and rain for a bit. By Phil Gyford on Phil Gyford’s website TagsAndrew MaleDVDsNTSPlexsocial mediaStar WarsStar Wars: Skeleton Crewweeknotes ← Older Post a comment Name Email address Will not be displayed. URL (optional) e.g. Your personal website, Twitter URL, etc. Comment Allowed HTML tags: blockquote, strong, ul, ol, pre, code, li, a, em. URLs will be turned into links. Post comment"
