full_description = "ooh.directory An organised collection of hundreds of blogs, to help people find good blogs that interest them. The Diary of Samuel Pepys A ten-year project to post the 17th century diaries online. It continues with readers’ annotations, an encyclopedia, maps, and more. @SamuelPepys Quotes from Samuel Pepys’ diaries in real time, as if he’s posting now. Over 70,000 followers on Twitter (RIP), and 5,000 on Mastodon. Today’s Guardian An easy-to-read edition of the Guardian or Observer newspapers. Read more about the idea from 2010. Crazy Walls A blog cataloguing the walls in movies, TV shows, games and comics that feature red string, photos, maps, cuttings, etc. Our Incredible Journey A blog recording the moments when start-ups are bought by larger companies, close down their service, and thank their users. Hiragana and Katakana quiz A simple quiz for practising knowledge of Japanese characters. Originally from 2003, updated since. Django Ditto Apps for the Django web framework, for copying your data from Flickr, Twitter, Last.fm and Pinboard. Read more. Django Spectator Apps for the Django web framework for tracking book reading and event going. Read more. Whit Stillman The unofficial website for the film director. Started in 2001, now edited by Chris Angerman. Foursquare Feeds Python script to generate a .ics calendar feed from your Foursquare/Swarm checkins. Read more. Dead or archived projects Septivium A short-lived blog, from 2010-2013, that was “an attempt to create a reading list of the very best books about everything”. Twelescreen From 2013, a single-page, one-tweet-at-a-time Twitter display, shown here with a 1984-esque theme. Read more. Pretend Office A company-wide email list that got out of hand. Read more. Overmorgen A weblog about future studies and futures-related trends, running from 1999 to 2009. Byliner Running from 2000 for over eight years, a site where users could track writers and be alerted when they published new articles. Read more. Haddock Directory A directory of links posted to a mailing list from 1997 to 2007. Read more. City of London councillors data Scraping data about City of London councillors and making it explorable using Datasette. Read more."
