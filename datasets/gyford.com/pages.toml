full_description = "Club Wired names from 1995 2025-02-19 19:23 Permalink Going through old papers I found a hand-written list of some of the people I met on Club Wired, the chat room started by HotWired. So why not put them online? The list’s probably from 1995. Club Wired was accessed via telnet at chat.hotwired.com:2428. Here’s HotWired’s intro to the service from the time. I wrote a few words about each person to help me remember age, location, real name, birthday, occupation/college, etc. but haven’t repeated them here just because I’m way more careful about personal info than we were in those days. I was fabius. prairiewind napkin lilfloater merps eperales truthgirl joine coon kjersti hedonism leia brid jdoll smurfer patrickx blazen dharber falicia cottontail slloyd trish kwarwick miriya stryk dpenrice jenniferm diesel8 lorikete mpnelson zoeex hollydaze jhendrikson fifi jaimi sagola yarol clannad mediale kleaver ajmani majorite pollyjean By Phil Gyford on Phil Gyford’s website Tags1995Club WiredHotWiredWired ← OlderNewer → Post a comment Name Email address Will not be displayed. URL (optional) e.g. Your personal website, Twitter URL, etc. Comment Allowed HTML tags: blockquote, strong, ul, ol, pre, code, li, a, em. URLs will be turned into links. Post comment"
