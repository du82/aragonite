title = "Blogroll (Phil Gyford’s website)"
full_description = "Here are some of the blogs and newsletters I follow, divided into the following categories (the first two have a blurry boundary): Personal blogs Topic-based blogs Newsletters Occasionally I add new things, and mention them in Blogroll Keepers posts. § 1. Personal blogs Aegir Alexandra Deschamps-Sonsino Alice Bartlett Book Two (James Bridle) Giles Turnbull Infovore (Tom Armitage) Interconnected (Matt Webb) James A. Reeves Kellan Elliott-McCrea Laura James Live Laugh Blog (Jenn Schiffer) Mary Loosemore Matthew Sheret MetaGrrrl (Dinah Sanders) Nadia Asparouhova Noisy Decent Graphics (Ben Terrett) Petafloptimism (Matt Jones) Robin Sloan Russell Davies Simon Willison Style Deficit Tom Armitage Tom Stuart Warren Ellis Ltd A Whole Lotta Nothing (Matt Haughey) § 2. Topic-based blogs Music Disquiet (Marc Weidenbaum) Ethan Hein (music education) GreilMarcus.net How NOT to write about music (Everett True) Sweeping the Nation Photography GroundZeroArt (Kirk Tuck) The Online Darkroom (Bruce Robbins) The Online Photographer (Mike Johnston) Thom Hogan – News/Views The Wandering Lensman (Dennis A. Mook) Making websites Adactio (Jeremy Keith; the web) Adam Johson (Django, Git, etc.) Daily Developer Tips (Chris Ferdinandi; JavaScript) James Bennett (Django) Mat Segal (Django) Everything Book of Joe Kottke.org (Jason Kottke) Sippey.com (Michael Sippey) Things Magazine Other topics The Beauty of Transport (Daniel Wright; transport infrastructure design) Chaplin-Keaton-Lloyd film locations (and more) (silent movies in LA) Cheese and Biscuits (mainly London restaurants) Die, Workwear! (men’s clothing) Dirty Feed (old UK TV comedy) Electric Flapjack Guitars (Michael Dales; making electric guitars) Everyday Commentary (knives, torches, pens) FIRE v London (personal finance) Granola Shotgun (US urbanism, property, etc.) Handprinted (printmaking) Martin Truefitt-Baker (linocut printing) maya.land (the web) Monevator (UK personal finance) Monty Don’s Tips and Advice (gardening) New Escapologist (escaping work, consumerism, and anxiety) Orson Cart (making horse-drawn carriages) New Aesthetic (James Bridle) One Terabyte of Kilobyte Age (internet history) The Ranty Highwayman (road design and transport) The Rosenrot (Gracia Ventus; fashion) § 3. Email newsletters Afternoon Slow (Russell Davies) All My Stars (Joanne McNeil; internet, science fiction) B3TA Ben Brown Buckslip (culture, given the internet) Construction Physics (Brian Potter; infrastructure, industrial technology) Converge (Guy Moorhouse; design and creativity) Culture: An Owner’s Manual (W. David Marx) Cool Mail, Jenn (Jenn Schiffer) Did Someone Say Emoji? (Jennifer Daniel; emoji) Garbage Day (Ryan Broderick; the internet) Griefbacon (Helena Fitzgerald; “long, weird essays”) Greil Marcus / Letter in the Ether (music) The Imperfections (Oliver Burkeman; productivity, happiness) The London Minute (Michael Macleod; London news) Money Stuff (Matt Levine; US finance) Monomythical (Nadia Asparouhova; living life online) Robin Sloan’s main and lab newsletters Ridgeline and Roden (Craig Mod; walking, photography) Scope of Work (engineering, manufacturing, infrastructure) Things I Have Enjoyed & Things I Have Learnt (Alby)"
