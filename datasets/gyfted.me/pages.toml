 (EU) 2016/679 of the European Parliament and of the Council of 27 April 2016 on the protection of natural persons with regard to the processing of personal data and on the free movement of such data, and repealing Directive 95/46/EC (General Data Protection Regulation);Platformthe website located at www.gyfted.me through which we communicate with Clients and Users and provide Services;Privacy Policythis document which constitutes the fulfillment of information obligations towards you within the meaning of Articles 13 and 14 of the GDPR;Representativea natural person logging in to the Platform on behalf of a Client who is a legal entity or an organization without legal personality;ServicesThe services we provide consist of conducting psychometric assessments, storing their results, as well as making these results available to the User in accordance with the User's instructions;Usernatural person, who voluntarily provides to the Controller his/hers Data in order to have Human’s Services delivered or enters Data as part of using the ServiceYouYou, and hence the person whose Data we process in accordance with the Privacy PolicyIntroductionYour privacy and the security of your Data is a priority for us. We take it very seriously. We make every effort to ensure that our Users' Data are processed in accordance with the applicable provisions of law.The Privacy Policy informs you how we process the Data of the Users of the Services, in particular:Who is the controller of your Data?What Data do we process and is the processing of this Data necessary due to the services we provide electronically?For what purpose and on what basis do we process Data?How long do we process the Data?What rights do our Users have as Data subjects?With whom do we share the Data?How can you contact us?The Privacy Policy also constitutes the fulfillment of the information obligations referred to in Articles 13 and 14 of the GDPR.Information of the Controller and the ServicesData Controller is a provider of a tool in the form of the Platform, through which You can carry out psychometric assessment in the form of traditional psychical evaluations or analysis of Your digital footprints. If You want, You may share Your results with other Users or Clients on the Platform. You may also send anyone a direct link to any of Your individual psychical evaluations. Clients may use results of Your evaluations during their recruitment process or to assess Your capabilities needed for Your work performance. You may find more detailed information about this in our Terms and Conditions..What does it mean to be a Controller?The Controller decides on the purposes and means of Your Data processing. The Controller is also responsible for the security of Your Data.User’s Data. Purposes and legal basis of User’s Data processingWe collect Users Data:when You set up an account on the Platform(In this situation, we collect Data from you in the form of your email address and the alias you use to activate your account on the Platform and send you your evaluation results.)when You carry out psychometric assessments(While performing psychological evaluations we collect Data coming from your direct answers to the questions asked. Depending on the type of assessment, we use them as a basis for psychometric analysis of your personality traits, motivation or for evaluation of your competences.)when You order us to analyse Your digital footprints(At your request, we analyze how you use certain websites. In this case, the Data comes from websites to which you have given us access or from information publicly available on the Internet. Data is processed only for the purpose of providing the Services and providing you with the assessment result.)Scope of Data Processed in the Analysis of the Results of Individual psychical evaluation.As part of the analysis of the results of your psychometric assessment, we analyze Data relating to your character traits or skills, depending on the assessment conducted.Scope of Data necessary for analysis of your digital footprints.For analyzing your digital footprints we download Data at Your consent from the website You have given us explicitly access to or from publicly accessible information, such as content of your posts or Internet activities. Analyzed information has been made public by You on or originate from your online activities and usage of the various sites.Purposes of Data processing.It is necessary for You to provide Data for the purposes of provision of the following services:assessment of your personality traits and Your motivation;assessing of Your competence levels;psychographic analysis of Your social media and Your digital footprints;giving You recommendations concerning Your personal and professional development.Legal basis of Data processing.The legal basis for the processing of the Data is your consent to the processing of the Data which you have knowingly given pursuant to Article 6(1)(a) of the GDPR.Clients and Representatives Data processingWe collect Data from our Clients and Representatives:when You as a natural person or Representative set up Client account and provide Data in it(When You set up a Client account we collect from You such Data as Your e-mail address and Your chosen alias. They are necessary to provide services to You).when You calibrate the Platform in order to get correct recommendations concerning Users being job candidates.(In order to optimize the Service, we need to obtain information from you regarding the context of your organization's operations and Data from you or a person in a supervisory position within your organization. This allows us to correctly match the psychological profiles of the candidates with the needs and nature of your organization's business.)Purposes of Data processingWe process Clients and Representatives Data in order to provide the following services:setting up an account and entering into an agreement;juxtaposing the psychological profiles of the recruitment participants with the Client's model of operations, taking into account the psychological characteristics of the people managing the Client's business;providing assessment results to Clients;Providing Data is necessary to perform a Service.Legal basis of Data processingFor a Client being a natural person legal basis of Data processing is article 9 (1) (b) of the GDPR, because Data processing is necessary to performance of the agreement;A Representative legal basis of Data processing is article 6 (1) (f) of the GDPR, because Data is being processed on the basis of legitimate interest of the Controller, which is provision Services for the Client he/she represents.Data of Platform UsersWe collect Data of Platform visitors:When You consent for use of cookie files.(Some cookies used by the Platform collect Data to a limited extent. You can find more information about cookies in the Cookie Policy.)When You contact Us.(We collect Data in order to respond to your inquiries when you contact us via email "
