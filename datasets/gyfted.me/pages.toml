rwx{padding-left:24px;padding-right:24px;}}@media (min-width:1280px){.css-1u2lrwx{max-width:1280px;}}Hire using behavioral, psychometric and cognitive assessmentsRank of ValuesRank the most empirically validated universal values that your team and individuals believe in. Discover who wants what and align your team for cultural fit.Learning AgilityTest anyone’s adaptability and learning inclination to get a sense of their growth mindset.Work StrengthsDiscover and measure character and personality strengths to figure out role fit, promotion plans and improve internal talent mobility.Schedule Consultation Bet on meritocracy to improve performance and team diversityStack rank candidates based on objective criteria for each role, candidates preferences and your preferences, for each recruiting project. Use the best preference and personality tests for the workplace that bring forth candidates who ‘fit’ both your culture and role, and can be culture additive to your organization.Objective hiringRemove hiring biasEliminate signals that lead you to make biased decisions.Hiring based on meritLook for merit, quality and “fit”. Run recruiting the right way. Quality methods & toolsHire pre-vetted applicants using proprietary assessments.For Founders and People leaders focused on culture and meritScreen applicants holisticallyScreen for team culture preferences, personality traits, and ability - in line with MEI principles. Easily evaluate applicants to save time on CVs and interviews, identify who to interview first, who could be a great fit for your remote work setup based on shared values and cultural preferenceResearch shows that people self-select into occupations depending on their preferences, that certain personalities “fit” certain types of work better, and that cognitive ability is extremely important in complex work (such as in tech).Schedule a consultation Measure cognitive abilityWe test for abstract reasoning ability (a key factor in hiring for any roles with tech companies) in order to help you discover high potential, motivated candidates capable of performing at the highest level. Ideal for MEI-first companies.Candidate-first assessmentsWe design candidate-oriented assessments (that’s how we built our product from day 1), not ‘big brother’ tools, in order to give people a smooth experience where Gyfted provides them with feedback and personal development accounts on our platform.Remote mode filtersFilter your applicants for skills, time-zone, geography, region, salary and work eligibility. Sort applicants by role fit and overall fit relevant to the role, your needs and distributed team setup. Avoid wasting time on candidates that clearly don’t line up with your remote setup.Robust culture measuresDiscover your remote team culture in terms of the leading methodology for uncovering organizational culture - Hofstede’s cultural dimensions. Get insights into who to hire from a culture add point of view. Because we all perform differently in various distributed work environments, hiring skills first only doesn’t work. The remote culture you’re hiring for will impact your performance and team dynamics.Remove biases and improve retentionSimilarity biasWe tend to search for people similar to us to avoid conflict. It easily leads to the forming of “yes-men” teams which are not the most creative or high performing this wayGender biasStereotyping based on gender is very pervasive among humans and this is a major bias that influences suboptimal decision-making in recruitment.Halo effectInvolves making snap judgments someone on the basis of a trait, for example someone worked at Instagram = “must be great”Horn effectsMaking a snap judgment based on a single negative trait, for instance when a candidate mentions one wrong thing and can be boxed out by seen as a villainQuality data and UX to improve your hiringMeasure and match candidates to fit you and your team. Select based on skills, experience, personality and culture fit. Make faster hiring decisions with better results.Quality UX & quality toolsDiscover culture fit/add, role fit, soft competencies and cognitive ability in your candidates using quality assessments in a vectorized database. We do not parse CVs for keyword matching and we quantify data into indexes to eliminate structural bias.Avoid information biasWe do not present or collect data on age, gender, race, minority status, or photos that impact all people’s decision-making through first impression bias. We focus on candidates, quality data, design to improve your outcomes and save you time.Our assessments are designed by top scientistsOur tools are developed by psychologists, psychometricians and cognitive scientistswith research experience from institutions like these:Hire for Merit, Excellence and IntelligenceSchedule Consultation Frequently asked questionsWhat is MEI?.css-a0y2e3{height:0;overflow:hidden;-webkit-transition:height 300ms cubic-bezier(0.4, 0, 0.2, 1) 0ms;transition:height 300ms cubic-bezier(0.4, 0, 0.2, 1) 0ms;visibility:hidden;}.css-hboir5{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;width:100%;}.css-8atqhb{width:100%;}MEI stands for Merit, Excellence and Intelligence. Alex Wang, the founder of Scale.ai, introduced the concept of MEI as a hiring strategy at his company. This approach prioritizes merit-based recruitment, which Wang credits for Scale AI's success. He contends that this method attracts and retains top talent while fostering a culture of excellence. MEI is described as an objective hiring practice that avoids biases associated with demographic factors. Wang advocates for evaluating individuals based on their personal qualities, abilities, expertise, and work ethic. Proponents argue that this merit-focused approach naturally results in a diverse workforce without sacrificing performance standards.How can unconscious bias affect interviewing candidates?.css-a0y2e3{height:0;overflow:hidden;-webkit-transition:height 300ms cubic-bezier(0.4, 0, 0.2, 1) 0ms;transition:height 300ms cubic-bezier(0.4, 0, 0.2, 1) 0ms;visibility:hidden;}.css-hboir5{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;width:100%;}.css-8atqhb{width:100%;}Biases can lead to unfair evaluations and missed opportunities to hire qualified candidates. Awareness, structured interview processes, as well as the use of standardized testing/assessments can help mitigate these effects. Unconscious bias can affect interviewing candidates this way:1. First impressions: snap judgments based on appearance or mannerisms.2. Similarity bias: favoring candidates similar to the interviewer.3. Stereotyping: making assumptions based on gender, race, age, or background.4. Halo/horn effect: letting one positive or negative trait influence overall perception.5. Confirmation bias: seeking information that confirms preexisting beliefs about a candidate.6. Name bias: judging candidates based on their names.7. Affinity bias: connecting more with candidates who share similar interests or experiences.How to limit unconscious bias?.css-a0y2e3{height:0;overflow:hidden;-webkit-transition:height 300ms cubic-bezier(0.4, 0, 0.2, 1) 0ms;transition:height 300ms cubic-bezier(0.4, 0, 0.2, 1) 0ms;visibility:hidden;}.css-hboir5{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;width:100%;}.css-8atqhb{width:100%;}Companies are increasingly implementing strategies to combat unconscious bias in their hiring processes. Many organizations now use standardized assessments that focus on job-relevant skills and abilities, reducing the impact of subjective judgments. These assessments are often designed and validated to ensure fairness across different demographic groups. Additionally, companies are leveraging data analytics to monitor and address potential biases in their hiring outcomes, regularly reviewing metrics to identify any disparities. Structured interview processes have also become more common, where all candidates are asked the same set of predetermined questions in the same order, and responses are evaluated against consistent criteria. This approach helps to ensure that each candidate is assessed on the same factors, minimizing the influence of personal biases. Some companies also implement blind resume reviews, removing identifying information that could trigger unconscious biases. By combining these methods, organizations aim to create a more equitable and merit-based hiring process that identifies the best candidates regardless of background..css-5avhib{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;width:100%;box-sizing:border-box;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink:0;position:static;background-color:#0070F0;color:#fff;box-shadow:none;background-color:#FFFFFF;}.css-1826v95{background-color:#fff;color:rgba(0, 0, 0, 0.87);-webkit-transition:box-shadow 300ms cubic-bezier(0.4, 0, 0.2, 1) "
