ms-flex-pack:start;-webkit-justify-content:flex-start;justify-content:flex-start;-webkit-align-items:center;-webkit-box-align:center;-ms-flex-align:center;align-items:center;position:relative;-webkit-text-decoration:none;text-decoration:none;width:100%;box-sizing:border-box;text-align:left;padding-top:8px;padding-bottom:8px;padding-left:16px;padding-right:16px;}.css-16em699.Mui-focusVisible{background-color:rgba(0, 0, 0, 0.12);}.css-16em699.Mui-selected{background-color:rgba(0, 112, 240, 0.08);}.css-16em699.Mui-selected.Mui-focusVisible{background-color:rgba(0, 112, 240, 0.2);}.css-16em699.Mui-disabled{opacity:0.38;}Free AssessmentsPricingFor IndividualsB2B Sign Up Log in Candidate screening that filters AIPredict potential, save time and filter out AI applicantsGyfted's work style and ability assessment eliminates your guesswork. Predict potential and merit in a sea of CVs, while dealing with fake AI applicants.Schedule consultation Candidate Screening Software that eliminates fake AI applicantsYou do not pay per applicant or per test - check out our pricing and features.Stop paying per assessment! Use assessments at any stage of the recruitment cycleUnlimited tests, so you can assess candidates flexiblyUnlimited candidates to test all applicants without extra costs.css-1u2lrwx{width:100%;margin-left:auto;box-sizing:border-box;margin-right:auto;display:block;padding-left:16px;padding-right:16px;max-width:1140px!important;padding-left:0!important;padding-right:0!important;}@media (min-width:600px){.css-1u2lrwx{padding-left:24px;padding-right:24px;}}@media (min-width:1280px){.css-1u2lrwx{max-width:1280px;}}Used by teams inside growth startups and brands in the US & EuropeUse automated screening to save time evaluating applicantsSee Pricing Options How it worksTalent screeningTalent screening must involve personality screening. This is because personality determines our preferences and behaviors. Research shows that people self-select over time into certain occupations depending on their personality, and certain personalities “fit” certain types of roles better. This matters for startups and large organizations alike.Get started Cognitive ability measuresWe test for cognitive ability and/or basic data analytics ability in order to help you get motivated, high potential applicants.Culture fit assessmentsCandidate culture fit assessments based on shared values and preferences can help you figure out who could be a great fit for your team and organization. You can easily evaluate job candidates to identify who to hire more easily using Gyfted.Powerful applicants filtersFilter your applicants by skills, past industries, salary, location. Sort applicants by culture fit specific to your needs, overall fit relevant to the role and to your needs.Objective candidate ranking and selectionAssess candidates anywhere in your hiring funnel. We enable you to see a stacked-ranking of candidates powered by powerful filters and search. Our system learns your preferences when you create your role and when you select applicants, so you can make better hiring decisions.Team culture measuresMeasure your team culture to get insights into who to hire from a culture fit and culture add point of view. Because we all perform differently in various environments, hiring skills first can fail. The organizational culture you’re hiring for culture fit and diversity at the same time, in order to drive performance, as well as well-being.ATS IntegrationsApplicant tracking software helps you manage your recruitment chaos. We integrated with your ATS to ease your life and serve full applicant reports. We provide standard ATS integrations with these common applicant tracking systems - Lever, Greenhouse, Ashby and TeamTailor at the moment. For other ones - just ask us..css-1u2lrwx{width:100%;margin-left:auto;box-sizing:border-box;margin-right:auto;display:block;padding-left:16px;padding-right:16px;max-width:1140px!important;padding-left:0!important;padding-right:0!important;}@media (min-width:600px){.css-1u2lrwx{padding-left:24px;padding-right:24px;}}@media (min-width:1280px){.css-1u2lrwx{max-width:1280px;}}How Gyfted’s applicant screening process worksGyfted combines cultural fit assessments with candidate soft skills and ability testing to give you the best solution to hire for culture fit and for potential.1You create a role that you want to hire for by giving us just the basics that matter, and your character plus culture fit preferences in a short assessment designed for hiring managers.2Upon creating the role you get a unique link. Assessment takers get two or more assessments to fill out through one unique link that you share with them.3Users are asked to select behaviors and preference statements that are most like them. Statements and words are associated with personality traits, values and dimensions relevant for workplace behavior.4Ability or data analytics tests (if included) help us determine the overall fit of applicants. In order to protect candidate privacy we do not show the results of these specific tests.5High quality data helps us inform metrics that improve your decision-making while cutting down on your unconscious and conscious biases.6You can easily improve your HR selection strategies using our assessment platform that easily integrates with your ATS.Schedule Consultation Our Experts1. Blaze Mrozinski, CPO - SWPS, London School of Economics2. Alina Shabatov, Sr Psychometrician - Bar-Ilan, Cambridge Frequently asked questionsIs Gyfted's candidate screening platform free?.css-a0y2e3{height:0;overflow:hidden;-webkit-transition:height 300ms cubic-bezier(0.4, 0, 0.2, 1) 0ms;transition:height 300ms cubic-bezier(0.4, 0, 0.2, 1) 0ms;visibility:hidden;}.css-hboir5{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;width:100%;}.css-8atqhb{width:100%;}Yes, try out our free software - there is a free trial for you to try before you buy! 🎉 Check out our pricing page for more details.How to identify the right candidate for a job?.css-a0y2e3{height:0;overflow:hidden;-webkit-transition:height 300ms cubic-bezier(0.4, 0, 0.2, 1) 0ms;transition:height 300ms cubic-bezier(0.4, 0, 0.2, 1) 0ms;visibility:hidden;}.css-hboir5{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;width:100%;}.css-8atqhb{width:100%;}Identifying the right candidate for a job begins, above all, with your job specification. You need to know the skills, traits and motivations of the person you want to hire. You should be aware of your culture and what it takes for your team to perform. You should be aware of what each job requires. This is all extremely hard to figure out, and there's almost no one in any organization that has the answer to all these needs for every role on every team. It's an interdisciplinary, complex and changing need on top of it that depends on culture, market, geography, organization size, product, customer needs, technology, business cycles and so forth. However, what research shows is key are things like cognitive ability, personality traits, integrity, motivations, culture fit, interests and preferences, as well as quality processes and methods for screening applicants, eg. so you can deal with social desirability, uncoscious bias, and cheating in recruiting, that enable you to receive objective data in order to make your talent acquisition cost less and be more effective. It's part art, and part science, and both are best dealt with using structured hiring methods, psychometric tools, machine learning and a design and pricing that incentivizes you and your recruitment software provider to play on the same team.How to screen applicants effectively?.css-a0y2e3{height:0;overflow:hidden;-webkit-transition:height 300ms cubic-bezier(0.4, 0, 0.2, 1) 0ms;transition:height 300ms cubic-bezier(0.4, 0, 0.2, 1) 0ms;visibility:hidden;}.css-hboir5{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;width:100%;}.css-8atqhb{width:100%;}Effective candidate screening should be done at the top of your hiring funnel, namely at the moment of application. The problem with doing this is that almost all test providers charge you per test. At Gyfted we do not, in order to enable you to screen applicants upfront for desirable traits and culture fit, as well as abilities. Effective screening should also be done in ways that measure what matters for the job and organizational fit: personality assessments, motivational tests, cognitive ability tests, cultural assessments, team culture tests, hiring manager preference assessments, detailed job specifications, skills tests all should - in an ideal scenario - be done by every applicant. The huge second problem with this nowadays is that candidates are required to go through assessments for each single application. This prolongs the recruitment process, creates a tough candidate experience, and takes candidates on never-ending recruitment marathons (followed by numerous unstructured, biased interview marathons) that are a time sink for them and for you. This is an enormous time, financial and resource burden for all organizations. Turnover on top of this amplifies these costs, which is a big problem with business-process outsourcing and services outsourcing via BPOs and SSCs for example. Recruiting is the most inefficient, resource-wasting endeavor in organizations today and it must change. This is what we're up to at Gyfted, and screening applicants effectively takes place using our state of the art psychometrics, machine learning, workflow automation, ease of use in a single solution so you can save time while gaining insights into pre-vetted applicants all across the board.How to hire for startup culture fit?.css-a0y2e3{height:0;overflow:hidden;-webkit-transition:height 300ms cubic-bezier(0.4, 0, 0.2, 1) 0ms;transition:height 300ms cubic-bezier(0.4, 0, 0.2, 1) 0ms;visibility:hidden;}.css-hboir5{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;width:100%;}.css-8atqhb{width:100%;}Tech companies and startups face very dynamic competition for talent and market dynamics. Hiring for culture fit first is a great strategy to help you develop the glue that will lower turnover and improve performance, satisfaction and motivation in your team to power through the tough days and challenges that never end. You have to know what sort of culture fits you and your team and product. To learn more about how to become a culture-first organization and why culture fit matters, check out our article on this topic "What is culture fit".Why is hiring for culture fit important?.css-a0y2e3{height:0;overflow:hidden;-webkit-transition:height 300ms cubic-bezier(0.4, 0, 0.2, 1) 0ms;transition:height 300ms cubic-bezier(0.4, 0, 0.2, 1) 0ms;visibility:hidden;}.css-hboir5{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;width:100%;}.css-8atqhb{width:100%;}Team culture matters because it is the glue that binds people together outside of making money'''
