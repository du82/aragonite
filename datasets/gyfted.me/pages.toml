kets and driving growth in the financial ecosystem.CooperationGyfted successfully supports their shared service centres in Gdynia (1300+ FTEs). During our cooperation, we matched them with 5 talented candidates for really specific and difficult roles of: Data Analyst, Senior Gas Market Analyst, Coal Market Research, LNG Analyst, Power Market Research Analyst. Candidates were required to have experience with Data analysis with Python, SQL, Excel, analytical skills and ability to face clients’ problems worldwide and possess excellent English communication skills. To deliver top 5 talents, we have screened over 250 candidates, and invited 47 for a final interview. Using Gyfted screening solution, we were able to save up to 60% of time wasted on manual candidate reviewing. That means one recruiter is capable to manage this work flow..css-1u2lrwx{width:100%;margin-left:auto;box-sizing:border-box;margin-right:auto;display:block;padding-left:16px;padding-right:16px;max-width:1140px!important;padding-left:0!important;padding-right:0!important;}@media (min-width:600px){.css-1u2lrwx{padding-left:24px;padding-right:24px;}}@media (min-width:1280px){.css-1u2lrwx{max-width:1280px;}}Related customer storiesIntiaroThe team at Intiaro used Gyfted to quickly recruit Customer Success, Design and Engineering talent that fits their team’s culture.EPAMEPAM’s collaborated with Gyfted to deliver rapid screening solutions for talent development across the enterprise globally to facilitate seamless team development around cultural fit, in line with EPAM’s values.QuotebeamQuotebeam’s founders leveraged Gyfted’s recruitment expertise to discover and hrie cross-border, remote talent in Poland, Central Europe, and strengthen their core startup team..css-5avhib{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;width:100%;box-sizing:border-box;-webkit-flex-shrink:0;-ms-flex-negative:0;flex-shrink: