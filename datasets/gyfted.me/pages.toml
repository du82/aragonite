health care, public policy, business, technology, architecture, even acting and film!We come to work and bring our best, we strive to move fast and thoughtfully. We make work something to be enjoyed. We know that diversity and inclusion matter, but we also know that ultimately it is diversity of thought and backgrounds that breeds unbridled innovation and performance. And despite our differences throughout, we have common core values..css-1u2lrwx{width:100%;margin-left:auto;box-sizing:border-box;margin-right:auto;display:block;padding-left:16px;padding-right:16px;max-width:1140px!important;padding-left:0!important;padding-right:0!important;}@media (min-width:600px){.css-1u2lrwx{padding-left:24px;padding-right:24px;}}@media (min-width:1280px){.css-1u2lrwx{max-width:1280px;}}Our valuesTransparencyWe value honesty, openness, accountablility, and straightforward communication.OwnershipWe are all owners of our product, and identify ourselves with what we’re building.DesignWe use a user-centered approach when building Gyfted product following best design practices.DataWe follow a data-driven approach and we are aware of the risks related to operating on big data.Customer LoveWe care about our customers’ feedback, thus building the product people will love to use.PrivacyProtecting our users identity is yet another of our core values. We will always stand on their side!.css-1u2lrwx{width:100%;margin-left:auto;box-sizing:border-box;margin-right:auto;display:block;padding-left:16px;padding-right:16px;max-width:1140px!important;padding-left:0!important;padding-right:0!important;}@media (min-width:600px){.css-1u2lrwx{padding-left:24px;padding-right:24px;}}@media (min-width:1280px){.css-1u2lrwx{max-width:1280px;}}Our TeamWe specialize in software engineering, data science, psychometrics, psychology, AI, cognitive science, machine learning, online assessment tools for recruitment, neuroscience, product design, public policy, recruiting, digital footprints, big data, organizational design, behavior design, economics.Adam SzeferCo-founder, Senior Software EngineerComputer Science, King's College LondonSoftware engineer with an ownership and entrepreneurial mindset. Plays piano and saxophone. Used to be a professional runner (4th place in Poland). Executed multiple business ideas applying ML in real estate and transportation. He is a former Financial Software Developer @ Bloomberg’s BAS Infrastructure & FX teams. Graduated from King’s College London, wrote a graduation thesis on ML-based Lane Merge Coordination Model for connected vehicles with the use of 5th Generation Mobile Network.Alina OshynaSenior Psychometrician @ PsyTech LabsPsychology & Statistics, Dnepropetrovsk National UniversityAlina has great experience in the assessments industry. She studied Psychology at Oles Honchar National University and Social Sciences at the Bar-Ilan University in Israel. She has 5 kids, an entrepreneurial spirit and is passionate about revision and innovation in psychometrics.BlazejCo-founder, Chief Product OfficerPhD, SWPSBłażej leads our psychometrics work and is a Lecturer at SWPS in stats, math and psychometrics. He also runs the experimental research lab at SWPS, has a rich background in psychological research in academia and with private companies, also around experience design and data visualization. Avid marathon runner!Kacper LubiszewskiSoftware DeveloperElectrical Engineering, Warsaw University of TechnologyEngineering student at the Warsaw University of Technology (PW). Worked with Flower Co (YC) startup in SV and on freelance projects. He loves creating complex backend software suited for rapidly changing environments. He hopes to create a channel with educational content suited for NodeJS beginners sometime in the future.MariuszSenior Software DeveloperPsychology, SWPSA self-taught front-end developer and social psychologist who studied at SWPS. Mariusz is our first employee at Gyfted and has held out with us through this early ride (!), and is an avid wine connoisseur and proud new dad!Marta KaczyńskaTalent Operations PartnerPhotography, EAFPassionate freelance photographer with significant Recruiting & Talent, Assistant and Office Manager experience, in the past in Poland and Ireland with companies small and large. She loves to travel, winter sports and long walks with her cute dog Dalmatian. Happy mother of two.Robert KowalskiCo-founderMBA, Stanford GSBA mission-driven, creative, rebellious optimist with experience in pre-seed to growth startup in Silicon Valley, finance and policy. Grew enterprise sales at OpenGov, built the EU’s first p2p election matching app over a decade ago, worked on labor, tax and R&D reforms for the former President of Poland. He’s also worked on and is passionate about bitcoin. Stanford GSB and London School of Economics graduate.AdvisersCurrent and past advisers to our companyMichal KosinskiAdviser @ Stanford GSBPsychometrics PhD, CambridgeMichal is a world leading computational psychologist and specializes in analyzing job-person fit personality traits for job performance, preferences, organizational behavior - basically measuring humans using cutting-edge computational methods and AI. Former Deputy Director at the Cambridge Psychometrics Centre, Researcher at Microsoft’s ML Group, Postdoc at Stanford’s Computer Science Department. Cambridge PhD, SWPS. He has co-authored Modern Psychometrics, is among the Top 1% of the Highly Cited Researchers. He was behind the first article warning against Cambridge Analytica, which you can learn more in Steven Levy's book Facebook: The Inside Story, and has been featured in documentaries alongside Elon Musk and other entrepreneurs and scientists.KyleDesigner @ ex-Stella AIHuman Computer Interaction, StanfordMatt DrelaMarketer @ LSEBSc, ex-CodeWise GMPeter StruppSerial Founder @ ex-Randstad CEOMBA, Harvard Business SchoolExpertsCurrent & past experts (alumni)Ada LemkaUX/UI DesignerArchitecture, Gdańsk University of TechnologyAn architect with years in concept & construction design and interior design experience. She studied Architecture at the Lublin University of Technology, Gdansk University of Technology and VIA University College in Denmark. Self-taught passionate UX/UI Designer who loves traveling, plants, people and good coffee!Aleksandra PrzegendzaUX/UI DesignerMusic, SWPSUX design and Product Design student at SWPS with a background in desktop publishing. She’s also got a degree from Wrocław University in Communication Design, Cultural Anthropology, and Musicology. She is always looking for something new and willing to explore and learn unfamiliar and different things. Ola is passionate about contemporary music, opera and rope skipping.Kamil SieniawskiSenior Software EngineerComputer Science, Poznań University of TechnologyKamil is a full-stack/back end developer with cool experiences in developing microservices, distributed computing, GCP and Typescript. Kamil got his CS degree from the Poznan University of Technology.Olena NikolenkoCognitive Scientist @ SamsungCognitive Science, University of WarsawPostgraduate student in Data Visualization at the Warsaw University of Technology and MSc in Cognitive Science at the University of Warsaw. While working as Laboratory Assistant in the Polish Academy of Science, Olena has been into neuroscience and cognitive functions research, and now decided to switch to a more technical role. Big fan of statistics and Nassim Nicolas Taleb.Jan JastrzębskiCognitive Scientist @ Jagiellonian UniversityCognitive Science PhD, Jagiellonian UniversityPsychometrician mainly focused on cognitive assessments. He got his PhD in Psychology at Jagiellonian University, where he conducts research in cognitive psychology, currently trying to train people's intelligence. PhD from Uniwersytet Jagielloński.Magda ZenaSenior Psychometrician @ Spark WavePsychology & Mathematics PhD, SWPSShe has experience in research and psychometrics with startups and enterprises in academic, media, business and clinical environments. She’s worked for institutions like SWPS, University of Warsaw, Collegium Civitas, the London School of Economics, World Bank, Orange, McKinsey, BNP Paribas, Phillips, papers, radio and television. In her free time she plays the piano and dances. PhD from SWPS and LSE.Maciej StolarczykSenior IT Recruiter @ Infotree Global SolutionsMedia, University of WestministerSenior IT Recruiter and Actor/Filmmaker who has won several film awards. He studied Contemporary Media (first class) at University of Westminster and Acting in Machulski’s Acting School. Dog dad and cinephil.Martyna PłomeckaPsychometrician @ ETH ZurichPhD, University of ZurichPhD student in Neuroscience & Psychology at ETH Zurich and did Applied Mathematics at the University of Warsaw. She’s done cool work as a Researcher in the Brain Imaging Lab at Nencki Institute, Instructor for Women in Big Data, and TA at ETH in Big Data Science in Psychology and Cognitive Neuroscience, and worked in pharma research i"
