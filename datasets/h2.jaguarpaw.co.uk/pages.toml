["https://h2.jaguarpaw.co.uk/posts/ghc-8.10-9.6-experience-report"]
title = "ghc-8.10-9.6-experience-report"
full_description = "At work (Groq) we recently upgraded the version of GHC that we use from 8.10 to 9.6, along with many of the Haskell packages we depend on. Some of the changes to GHC and the packages we depend on were “breaking changes”, that is, changes which forced us to change our own code in response. This document details all such changes that we had to make to our own code. Hopefully it serves as a measure of the effort required to keep up with breaking changes in the Haskell ecosystem, encourages library and compiler maintainers to avoid making breaking changes where reasonable, and where breaking changes are made, to make them in a way that allows forward-compatible mitigations rather than breaking fixes. I distinguish two kinds of behavior-preserving changes that are required in response to an upgrade which contains breaking changes: “forward-compatible mitigations” and “breaking fixes”. Foward-compatible mitigations are those changes that can be made to the codebase before the upgrade such that no further changes need to be made at the same time as the upgrade. For example, suppose that library “mylibrary” version 1 exports functionOld, which is deprecated, and functionNew which is identical except it is not deprecated. Further suppose that mylibrary version 2 removes functionOld. A forward-compatible mitigation would be to replace uses of functionOld with functionNew. Subsequently, the code works equally well with mylibrary version 1 and with mylibrary version 2, so no change needs to be made at the same time as the upgrade of mylibrary from version 1 to version 2. By contrast, breaking fixes are those changes that only work after an upgrade. For example, suppose that library “anotherlibrary” version 1 exports anotherFunction :: A -> B -> C, and anotherlibrary version 2 exports anotherFunction :: B -> A -> C, which is identical except that the argument order is switched. A breaking fix would be to replace all uses of anotherFunction by flip anotherFunction. Breaking fixes complicate an upgrade because they can’t be made before or after the upgrade but must be made at exactly the same time."
author = ""
year_published = 2025
clearnet = "https://h2.jaguarpaw.co.uk/posts/ghc-8.10-9.6-experience-report"
