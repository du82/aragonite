["https://h2.jaguarpaw.co.uk/posts/accidentally-exponential"]
title = "accidentally-exponential"
full_description = "I accidentally introduced exponential run time into a compiler I was writing and did not realise for over three years. Once upon a time I was writing an AST to represent expressions in a programming language. In reality the language was SQL, but for the sake accessibility let’s pretend it was a simple arithmetic language that allows us to write zero, one, and (non-empty) sums and products. The reason why Zero has an argument will be explained in due course. First, let’s implement wrapper functions to provide a nice API and write an example expression. We expect the example expression to evaluate to 2 * 2, i.e. 4. Let’s write an evaluator and check. The evaluator will be recursive on the structure of terms of type Expr. We are good functional programmers so we will write a data type and general fold function to encapsulate the recursion pattern. They basically write themselves, given the definition of Expr. Now I’ll explain the reason for the argument to the Zero constructor. The backend that we are targeting doesn’t have a very good concept of Zero! We can happily send One to it but sending Zero is quite tricky. In reality the backend is SQL and it’s not terribly straightforward to generically represent an empty query in SQL. Instead of dealing with that problem directly, my approach was to give Expr a type parameter. Then expressions of type Expr () can contain Zero and expressions of type Expr Void cannot. Expressions that might contain Zero need to have it removed before the query is sent to the backend. The following function removes all occurrences of Zero from an expression. If the expression itself was actually zero it returns Nothing, otherwise it returns a Just. Because the type parameter in the return type is polymorphic we have a static guarantee that the result doesn’t contain any Zeros! is valid, so let’s use that instead. After all, more polymorphism gives fewer places for bugs to hide, right? removeZero calculates the correct result but regrettably it has exponential run time! How can this be? The point of expressing removeZero in terms of a fold function was to make it brainlessly simple to write it efficiently and correctly."
