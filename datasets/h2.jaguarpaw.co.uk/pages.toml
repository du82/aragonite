["https://h2.jaguarpaw.co.uk/posts/bluefin-versus-oop"]
title = "bluefin-versus-oop"
full_description = "In “OOP is not that bad, actually”, Ömer Sinan Ağacan describes a task that he says “mainstream statically-typed OOP languages do well”. He defines OOP [object oriented programming] as statically-typed programming with classes, inheritance, subtyping and virtual calls. Ultimately I interpret the article not as advocating for OOP, but rather as advocating for programming against well-defined interfaces that can be instantiated with a variety of implementations. I’m strongly in support. However, I think the task is better solved by Haskell, a statically-typed functional language, than by an OOP language (as Ömer defines it). In particular, I don’t see inheritance and subtyping as particularly valuable for this task. We start with a basic logger interface. In Haskell an interface is a type, here Logger. This is like the Logger type that Ömer defined, except using the Eff type from my effect system Bluefin instead of IO. (Most of what I say in this article will apply equally well to IO or Eff and I’ll explain at the end why I think Eff is better.) Then we need a bit of ceremony to define a Handle instance and the log function that we define in terms of the Handle implementation. (This is in principle derivable using Template Haskell or Generics but I haven’t implemented that in Bluefin yet. Mea culpa. I’m including this boilerplate in the article to be honest and explicit.) Then immediately we can define a function, exampleWithLogger, which uses the Logger interface. It prints some messages to stdout (using putStrLn) and logs some messages to the Logger (using log). Having such a function is not useful until we have a way to instantiate the Logger interface. Here’s one: it prints log messages to stdout. (useImplIn and effIO io are Bluefin incantations. The same code using IO instead of Eff wouldn’t have them.) I can instantiate the Logger interface and use it to run the example, like this: Another example that Ömer uses is a logger which only logs above a certain severity. Bluefin can do that too! Ömer suggested that the minimum severity logger should be created afresh, but I actually think it’s better to take an existing logger and wrap it into a minimum severity logger. That sounds more useful, more object-oriented, and in any case more interesting, so let’s do it: withLogAboveSeverityLogger creates a logger that logs to an existing Logger (passed in as an argument), but only when the severity is above some minimum severity."
