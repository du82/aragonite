["https://h2.jaguarpaw.co.uk/posts/git-survival-guide"]
title = "git-survival-guide"
full_description = "It is my most used git command. I run it after almost every other git operation to maintain a clear understanding of the current repository state. If you only want to see the topology of the tree instead of every commit then add --simplify-by-decoration. (You might like to read Ian Miell’s “git log – The Good Parts”.) (or -N). I don’t use git add because it adds the file to the staging area. I don’t want to bother with the staging area. The latter will interactively rebase the collection of patches <from>..<to> onto <target> (<from> is exclusive, <to> inclusive). It’s always a reasonable idea to rebase interactively so at least you can see the list of commits that will be rebased. It might turn out you got some of the arguments wrong and then you can bail out early (by deleting all the text from the interactive rebase instruction file, saving it, and closing the editor). There are many, many guides on the web about “how to split a git commit”. All the ones that I have seen give some version of the “Splitting Commits” recipe from the git rebase man page. That recipe is fiddly for a non-expert and one can easily find oneself in a confused state. On the other hand the recipe can easily be made robust and packaged in a script that gives the user helpful hints and can’t fail – so that’s what I did! By default git status shows untracked, unignored files. I don’t need to ignore files because I use git commit --patch. On the other hand I don’t want to see untracked, unignored files in git status. Instead I use git status -uno which supresses display of untracked files. (in git commit --patch, git checkout --patch, git stash --patch, etc.) interactive.singleKey=true requires the Perl module Term::ReadKey. On Debian this is available in the libterm-readkey-perl package. I never use the staging area. It is a piece of mutable state and I’d rather remove it from my mental model. You do not need to touch the staging area if you use git commit --patch. (Apparently empirical research has validated the hypothesis that the staging area is a major pain point for users in practice.)"
