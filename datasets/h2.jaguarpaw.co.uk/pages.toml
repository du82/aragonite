["https://h2.jaguarpaw.co.uk/posts/extensible-effects-interleaving"]
title = "extensible-effects-interleaving"
full_description = "In their paper “Extensible Effects”, Kiselyov, Sabry and Swords (KSS) introduce an effect system for Haskell that is an alternative to the classical monad transformers approach. There is a Haskell library of the same name implementing the ideas of the paper. Dan Doel noted in a recent article that this is one of many papers which investigate effects and their associated handlers, in large part aiming to move from what is seen to be the “static” approach of monad transformers, to the supposedly more “dynamic” approach of algebraic effects. Dan’s article is a defence of the classical monad transformers approach, and he argues convincingly “that the staticness [of monad transformers] can actually be a useful property, that certain ways of harnessing it can make the confusing constructions less so, and … that algebraic effects perhaps aren’t so different from what we are already using”. KSS give two examples where they claim their approach is superior to monad transformers. The first is that it is awkward to combine exceptions with non-determinism. However, Dan implements a simple alternative to catchError and ensures that the exception handler removes from the set of effects. In this way he efficiently disposes with the supposed awkwardess. The second objection of KSS is that a certain interleaving of a read effect with coroutines is impossible to achieve with monad transformers. In this article I will demonstrate that contrary to KSS’s assertion, this interleaving is possible with monad transformers, and moreover straightforward. catchError from the mtl runs a monad transformer stack that contains an “exception raising” layer and handles any exceptions with a handler that can potentially rethrow them. The definition has the following signature The monad m is the same in the argument and return value, thus any exceptions that are rethrown are rethrown at exactly the same level of the stack. As KSS note, this does result in a particular inflexibility when mixing effects."
