["https://h2.jaguarpaw.co.uk/posts/bluefin-plucking-constraints"]
title = "bluefin-plucking-constraints"
full_description = "One of the promises of strongly-typed, pure functional programming is to “make invalid states unrepresentable”. We can broaden the slogan to “make invalid behaviours unrepresentable”. Indeed, that’s one of the purposes of effect systems in Haskell: to circumscribe an operation’s range of observable behaviours. Typically, effect systems provide a way of “handling” effects, that is, removing effects from the range of observable behaviours. Matt Parsons calls the technique for handling effects in the “MTL effect system” “plucking constraints”. The Bluefin effect system, like MTL, uses a system of constraints to track effects and allows effects to be handled, reducing the range of observable behaviours. Let’s have a look at how that works, after first looking at how it works in transformers and MTL, for comparison. The possible behaviour of such an operation is “manipulating an Int state, eventually terminating with a () unless a String exception was thrown”. So far so good. But the story gets even better: we can handle effects, to reduce the range of valid behaviour. For example, we could choose to handle the exception by adding the length of the thrown String to the Int state, as follows: Then handleLengthTrans operTrans :: State Int (). We have reduced the range of possible behaviour to “manipulate an Int state but do not (observably) throw an exception” (despite the fact that the implementation uses an exception). Typically, however, we don’t want to write concrete monad transformer stacks. One alternative is MTL-style constraints, for example: Exactly the same implementation as handleLengthTrans works for this MTL-style function too, although the type is an MTL-style one. Then handleLengthMTL operMTL :: MonadState Int m => m (). Again, the possible behaviour is “manipulate an Int state but do not (observably) throw an exception”. How does this business with MonadError and MonadState work to allow us to handle an effect? Well, that’s the technique that Matt calls “plucking constraints”. Let’s consider the two types involved, renaming the type variable in operMTL from m to m' to avoid confusion."
