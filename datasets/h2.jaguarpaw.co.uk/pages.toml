title = "exists"
full_description = 'In Haskell we can use Rank2Types or RankNTypes to pass arguments which contain universally quantified parameters, for example We can also make datatypes that contain existential variables, that means we know they have some type, but we don’t know which. Why can’t we do this? Well, the reason that we can manipulate forall is that it desugars directly into something in the polymorphic lambda calculus (System F). The type (modulo desugaring of the typeclass contexts). Here /\ is a higher-level lambda, and its use means that the caller of the argument (i.e. the body of showBoth) gets to choose to instantiate the a to possibly many different types and use that function at all of them. On the other hand, there is nothing for exists to directly desugar to. We would like the type where the {...} notation indicates a dependent sum. However, there is no such construction available in Haskell’s Core intermediate language. I certainly recall seeing these dependent products in some presentations of polymorphic lambda calculus so perhaps there is no impediment to them in principle.'
