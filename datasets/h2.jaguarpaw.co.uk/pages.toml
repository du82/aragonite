["https://h2.jaguarpaw.co.uk/posts/ai-doom-posterity"]
title = "ai-doom-posterity"
full_description = "the more I look at the LLM revolution the more worried I am that we should be counting in months rather than years As bad as climate change is, AI is likely to get us first I think - we may only have 2-5 years (vs 20-50 with climate). We need to slam the brakes on AGI development now. If we go back to things like the bio weapons or cyber [attacks], you can have really very dangerous threats to humans that could kill many humans – not all humans – simply from where we would expect models to be in two years’ time. The top scientists at the biggest AI firms believe that they can make artificial intelligence a billion times more powerful than today’s most advanced models, creating “something like a god” within five years AGI will absolutely be achieved in AT MOST 3 years. Probably less. I guarantee. And it will be able to write any imaginable software faster than the fastest human dev team in the world could, for pennies. These next three years might be the last few years that I work. … I stand at the edge of a technological development that seems likely, should it arrive, to end employment as I know it. Yudkowsky can’t make predictions about what the trajectory to AI doom will look like because one can only know the end state not the trajectory, yet he claims that the trajectory in the last two decades is evidence that we’re converging on the end state."
