["https://h2.jaguarpaw.co.uk/posts/bluefin-prevents-handles-leaking"]
title = "bluefin-prevents-handles-leaking"
full_description = "Haskell’s System.IO.withFile has a nice resource safety property. It also has a problem which its Bluefin equivalent fixes. Let’s have a look. It allows us to open a file by its path, and then interact with it in the “body” of the withFile using its “file handle” (of type System.IO.Handle). When the body has finished withFile will automatically close the file, releasing its Handle. File handles are a scarce resource so it’s important to release them promptly. withFile saves us work by taking care of that for us automatically. Here’s an example Even better, withFile is “bracketed”. That means that it releases its Handle even when the body it terminated by an exception: But all is not good. Nothing stops us leaking the handle from withFile and attempting to access it after it has been closed. For example, the following code errors out at run time: Bluefin’s version of withFile doesn’t suffer from the same problem. If we try to write code that leaks the handle from withFile we get a type error. The type of the handle that Bluefin’s withFile provides to its body is Handle e (that’s a Bluefin.System.IO.Handle), i.e. it is tagged with the Bluefin effect type e. The forall that binds e prevents us from smuggling the handle out as part of r, the return type of the block. This technique is an augmented version of the one used by runST to avoid leaking STRefs."
