title = "git-rebase-conflicts"
full_description = "This article is about git rebase conflicts. A similar article with slightly different technical details could be written for git merge conflicts. I use “merge” as a non-technical term for combining the content of two different repository states, not to refer to git mergeing specifically. When a git rebase conflict occurs you will be presented with a conflict region (or “hunk”) that shows why the rebased commit couldn’t be applied to the base branch. To resolve a rebase conflict, your task is to apply the logically-intended (i.e. semantic) change of the rebased commit to the base branch. Some merge tools (for example Emacs SMerge) offer you the option to “keep their changes” or “keep our changes”. This is almost always wrong. The whole point of merging (remember, I’m using that word in the non-technical sense, not to refer to git mergeing specifically) is to combine two conflicting things, not to choose one over the other. By choosing one you ignore a change in the other that may be required by other parts of the same commit (parts that may not see because they merged without conflict!). The existence of a conflict means that the patches could not be merged textually. However, the aim is actually to merge them semantically. Merge tools are rarely (perhaps never) clever enough to be able to perform semantic merges so they settle for textual merges. In the cases where textual merges are not possible the task is left to human ingenuity. Key takeaway: the aim is to apply the logical (i.e. semantic) content of the rebased commit to the base branch. Resolving a rebase conflict requires understanding the logically intended (semantic) change of the rebased commit and applying it manually to the base branch. Here is the procedure to follow. The details will be explained by way of example later. Use the diff3 conflict style option because it shows important information in the conflict markers that would otherwise be absent. Either look at the difference between the middle hunk section and the bottom hunk section of the marked conflict, or"
