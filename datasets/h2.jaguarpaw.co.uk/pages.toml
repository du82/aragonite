["https://h2.jaguarpaw.co.uk/posts/automatic-differentiation-worked-examples"]
title = "automatic-differentiation-worked-examples"
full_description = "This article demonstrates how to perform source transformations on a program to generate forward mode and reverse mode derivative programs (automatic differentiation, or “AD”). My aim is to write the shortest possible article that communicates all the essential features of a source-to-source AD system with a particular focus on making the reverse mode transformation clear. The goal of brevity means that a lot of possible commentary has been omitted. If you find this makes some part of the article hard to understand then please contact me and I’ll do my best to clarify. In particular this article contains hardly any mathematical content at all. I hope that the reader who is familiar with multivariate calculus will be able to obtain an intuitive understanding of how AD relates to mathematical techniques he or she is already familiar with. A more in-depth description of the relationship will have to wait for another article. Let’s consider the following pseudocode program that performs some elementary arithmetic through a sequence of assignment statements. x and y are not defined in the program so I’m going to informally consider them to be “inputs”; v is not used anywhere so I’m going to consider it to be the “output”. (I won’t burden the article by formalising these notions here.) We’ll do a small amount of preparation to our original program which will preserve its behaviour and get it into a form in which it is straightforward to apply the automatic differentiation (AD) algorithms. It is possible to apply AD algorithms without doing these transformations first but then the AD algorithms would have to do equivalent operations implicitly. Doing these transformations first is a kind of separation of concerns. Let’s use prefix functions instead of infix operators. Infix operators are more familiar for arithmetic but the AD algorithms will be clearer to present if we use prefix functions. Additionally I want every function to have exactly one argument (although that argument may be a tuple). Single-argument style will make the reverse mode transformation much clearer (although it does not make any difference for forward mode). For example, x1 + x2 would become add (x1, x2). Our program becomes"
