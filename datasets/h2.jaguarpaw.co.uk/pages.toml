["https://h2.jaguarpaw.co.uk/posts/bells-theorem-made-simpler"]
title = "bells-theorem-made-simpler"
full_description = '''Bell’s theorem is a mathematical result which proves that quantum physics is incompatible with what are called “local hidden-variable theories”. John Stewart Bell came up with a mathematical inequality that “local hidden-variable theories” must satisfy, yet it was subsequently demonstrated by experiment that quantum systems can violate the inequality. One philosophical interpretation is that the physical world is non-local: actions in one part of the physical universe can instantaneously affect other parts of the universe. Einstein called this “spooky action at a distance”. A first undergraduate course in quantum mechanics is enough to understand Bell’s theorem but nonetheless I found the standard treatments completely incomprehensible, not mathematically incomprehensible but incomprehensible in their meaning. I struggled to internalise the meaning of the inequality or why it should be surprising that it could be violated. This article presents the treatment that I find most accessible. I hope you find it as fascinating as I do! We will look at the CHSH inequality because it is slightly more general than Bell’s original inequality. It states that if there are physical observables \(a\), \(b\), \(a'\) and \(b'\), each of which can take on only values \(-1\) or \(+1\), then \[ |E(a, b) - E(a, b’) + E(a’, b) + E(a’, b’)| \leq 2 \] where each \(E(x, y)\) is called the “quantum correlation” between an observation \(x\) and an observation \(y\). “Quantum correlation” sounds mysterious but it’s just the expectation of the product of \(x\) and \(y\): \[ E(x, y) = \mathbb{E}(xy) \] It is of little benefit that the definition of “quantum correlation” is technically simple. I still have no intuition about it! The CHSH inequality is equally mysterious. I have no intuition about whether it is something that could be violated or not. I have much more intuition about probabilities than “quantum correlations”. Luckily the “quantum correlation” can be rewritten simply in terms of probabilities. After doing so the CHSH inequality will become very natural! We start by observing that, because \(x\) and \(y\) can take on only values \(+1\) and \(-1\), \[ E(x, y) = \mathbb{E}(xy) = \mathbb{P}(x = y) - \mathbb{P}(x \ne y) = 1 - 2\mathbb{P}(x \ne y) \] so we can rewrite the CHSH inequality as \[ |1 - 2\mathbb{P}(a \ne b) - 1 + 2\mathbb{P}(a \ne b’) + 1 - 2\mathbb{P}(a’ \ne b) + 1 - 2\mathbb{P}(a’ \ne b’)| \leq 2 \] and after some algebra we conclude that \[ \mathbb{P}(a \ne b’) \leq \mathbb{P}(a \ne b) + \mathbb{P}(a’ \ne b) + \mathbb{P}(a’ \ne b’) \]'''
