full_description = "Oleg suggested to me the following example which shows how easily one can abstract the client in the Extensible Effects framework: The same result can be achieved with the MTL, but the CoT type needs a MonadFunctor instance so that we can use hoist. I don’t know if CoT as implemented via ContT can be given such an instance. As such I implemened my own version like this The reimplementation is remarkably similar to the original with just some hoists added. Running it gives exactly the result desired Note: Later Oleg pointed out to me that the definition of th above only works on transformer stacks two deep, where the second is ReaderT. It seems to me that any more deeply nested stack can be converted to one where the ReaderT occurs at the second layer, using, for example However, this introduces a lot more awkwardness which Extensible Effects doesn’t have, the latter being designed exactly to avoid this kind of thing. So perhaps this is a good example to demonstrate exactly what problem it is that Extensible Effects solves. The concept of MFunctor and its method hoist seem to play a crucial role here. In the case of a free monad I would guess that the MFunctor instance comes for free, i.e. free monads always support hoist. This seems to be a crucial missing element from the MTL to allow effects to work with each other in a generic manner. I need to think about this more …"
