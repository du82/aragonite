title = "git-rebase-conflicts-display"
full_description = "In the article Resolving git rebase conflicts I explain a procedure for resolving git rebase conflicts. It requires understanding the logical (semantic) intent of the rebased commit and applying it to the current state of the base branch. There are two ways we can better understand the logical intent of the rebased commit. Firstly, we could try looking at the (diff3-style) conflict hunk. For example it might look as follows. The intent of the rebased commit is to transform the middle hunk section into the bottom hunk section, in this case to remove foo3(). Secondly, we could look at the output of git show REBASE_HEAD. This gives us a “unified diff” that may be easier to read. It will look something like the following. The downside is that we will see all of the rebased commit, not just the conflicting parts. Can we combine the best of both? Rebase conflict markers would be more helpful displayed in a different form. We need to see exactly two things: the diff of the rebased commit at the conflict location and the context of the target branch. From the examples in the prior article, where we had Unfortunately we cannot patch this into git ourselves because the conflict style choices is hard-coded into git. Nonetheless, an editor plugin or even text-to-text processor could rewrite the diff3 style into the “context plus diff style” I propose. I have written a demo in Haskell."
