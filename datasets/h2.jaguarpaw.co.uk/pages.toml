["https://h2.jaguarpaw.co.uk/posts/foldl-traverses-state-foldr-traverses-anything"]
title = "foldl-traverses-state-foldr-traverses-anything"
full_description = "Avi Press gave an excellent talk at Scale By the Bay 2023 about difficulties using Haskell at a startup. He mentions that even experienced Haskellers don’t always know how to use fundamental parts of the language. In particular, In this article I’ll deduce a firm rule that allows you to make the correct choice. I will stick to the versions of these functions that operate on lists; their generalization to Foldable warrants a separate article. In summary, the answer is We’ll work with the traditional definitions of foldl and foldr, given below. The implementations in base are more complicated, for performance reasons, but the reasoning in this article applies to them too. Ostensibly, the difference between foldl and foldr is the that former “associates a binary operation to the left” and the latter “associates a binary operation to the right”, as follows. Those are indeed descriptions of the calculated results, but that distinction is not particularly important. If we only care about the result then it’s easy enough to convert between foldl and foldr, as shown below. The important difference is how they calculate the result; the conversion below does not preserve behaviour. For example, foldl (-) 0 calculates a sequence of subtractions in constant space1; foldr (flip (-)) 0 uses O(n) space. So what is the precise difference between how the two folds calculate their results? Consider this: suppose we didn’t have foldl, we only had traverse for State. Nonetheless, we could recover foldl! (In fact we only need traverse_, a weaker form of traverse, and in these examples we’ll use for_ = flip traverse_ for syntactic convenience.) The example below shows how. It converts a function that performs for_ (restricted to State) into a function that performs foldl. And not only can we get foldl from for_ (restricted to State), we can get for_ (restricted to State) from foldl. They are equivalent! Importantly, they are equivalent in both result and performance characteristics."
