["https://h2.jaguarpaw.co.uk/posts/flexport-ceo-wrong-bottleneck"]
title = "flexport-ceo-wrong-bottleneck"
full_description = "I recently read Eliyahu Goldratt’s The Goal, a “business novel” about how to increase capacity in a manufacturing plant, whose lessons can be applied more widely, to logistics and beyond. Over the last few days, themes from the book have been playing out in public, particularly on Twitter, as a consequence of the gridlock at California’s Los Angeles and Long Beach ports. The CEO (Ryan Petersen) of Flexport (a freight forwarding and customs brokerage startup) has tweeted voluminously about the logistical “bottlenecks” he has discovered on a couple of intelligence-gathering expeditions, firstly to talk to dock workers and secondly to observe dock operations from the water. “Bottlenecks” (or “constraints”) are exactly what The Goal is about. Given that I’ve read a book and I have critical thinking capacities I deem myself suitably qualified to critique the CEO of a billion-dollar logistics company. Let’s go! [Disclaimer: I don’t know anything about operations at Flexport. I don’t know whether Petersen has taken the right or wrong actions or decisions regarding his business and California’s ports. On the other hand I am convinced the way that he explained the situation on Twitter doesn’t make sense. That’s what this article is about.] In the first thread (about talking to the dock workers) Petersen explains that, although the docks have started operating 24/7, trucks are not arriving 24/7 to take away offloaded containers. In the second thread (describing how he observed dock operations from the water) he claims that What’s his rationale for the claim that the bottleneck is yard space? Well, it seems that there are currently a lot more imports from China than exports to China so the trucks that took full containers from the port are bringing back empty ones. Apparently you can’t get empty containers off your dockyard by loading them onto ships because shipping companies are not being paid enough to take empty containers or because it’s dangerous to carry empty containers. Stacks of empty containers are building up at ports leaving too little space for ships to be unloaded. The problem compounds when truckers bringing empty containers back to the port find no space to leave them, so they can’t exchange their container for a full one, so full containers stay at the port. An overload of containers is jamming up port operations, empty containers cannot be removed by ship nor can full containers be removed by truck!"
