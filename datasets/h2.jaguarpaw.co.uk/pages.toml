["https://h2.jaguarpaw.co.uk/posts/bluefin-streams-finalize-promptly"]
title = "bluefin-streams-finalize-promptly"
full_description = "The pipes and conduit streaming abstractions have a problem: despite having special-purpose bracketing operations they don’t finalize promptly in the presence of exceptions. Bluefin, by contrast, has two benefits: it can bracket its streams with general-purpose operations, and those brackets finalize promptly. What does “finalize promptly” mean? And why is it a problem to not finalize promptly? Read on to find out. When we have acquired, and have been using, a scarce resource (for example a file handle) we need to “finalize it promptly”, that is, “release” or “clean it up” as soon as possible after we no longer need it, so that it can be reused. If a program component is guaranteed to promptly finalize the resources it holds it is sometimes called “resource safe”. One element of the Haskell ecosystem that provides a form of prompt finalization is Control.Exception.bracket. The type and intended usage of bracket are: When the bracket call executes the resource is firstly acquired and then secondly used (the part of the program that uses the resource is often called “the body”) . Thirdly, the resource is released once the body finishes, regardless of whether the body finished normally or by throwing an uncaught exception. Below, bracketExample brackets the usage of a file handle. It opens a file, throws an exception if the file is too big, and then subsequently closes the file. (When it opens and closes the file it also prints a message to tell us that it is doing so.) If the body terminates with an exception then the file is also closed, as desired (and the exception is rethrown from bracket). Bracketing of resources is a very useful, general concept. Streaming abstractions like those provided by pipes, conduit and Bluefin need to support prompt finalization, through some form of bracketing, because we want to be able to implement streaming computations that hold resources. For example, we might want to implement a producer that yields all lines from a file. To be resource safe, that producer must close the handle to the file when it terminates, either normally or through an exception."
