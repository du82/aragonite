["https://h2.jaguarpaw.co.uk/posts/behaviour-changes-flag-day"]
title = "behaviour-changes-flag-day"
full_description = "At work (Groq) we recently upgraded the version of GHC that we use from 8.10 to 9.6, along with many of the Haskell packages we depend on. I wrote about the changes to our code that this required in “Upgrading from GHC 8.10 to GHC 9.6 – an experience report”. That article touches on the risks associated with being forced to make many changes at once: if a problem occurs it can be hard to diagnose and it can be hard to fix. After that article was written I discovered that such a problem, albeit a benign one, had occurred. The present article explains the situation. We use Nix’s nixpkgs to provide GHC and Haskell packages. Consequently, we upgraded GHC and our Haskell packages at exactly the same time by upgrading to a later version of nixpkgs, specifically all in the same commit to our source code repository. I’m not familiar with Nix or nixpkgs so I can’t explain exactly why we followed the approach of upgrading GHC and all packages at the same time but it was deemed to be the most straightforward of a variety of different options. Regardless, that means we experienced a “flag day”. Paraphrasing Wikipedia’s definition and elaboration: A flag day is a change which requires a complete conversion of a sizable body of software. The change is large and expensive, and—in the event of failure—similarly difficult and expensive to reverse. The situation may arise if there are limitations on backward compatibility and forward compatibility among system components, which then requires that updates be performed almost simultaneously (during a “flag day cutover”). This contrasts with the method of gradually phased-in upgrades, which avoids the disruption of service caused by en masse upgrades. In the language of my previous article, a “flag day cutover” is required when incorporating a large number of “breaking fixes”. By contrast, “forward compatible mitigations” can be made as “gradually phased-in upgrades”. We experienced a “failure” of a sort after our flag day, albeit a benign one, specifically the failure of a golden test, that is, a test that checks for exact equality of the output of a particular function or program. Golden tests often over-specify behaviour and that was the case here too: the output artifact under test was a program for Groq’s LPU1, and although the binary contents of the program file differed before and after flag day, it produced the same results, so the test was too strict."
