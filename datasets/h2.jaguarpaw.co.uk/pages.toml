["https://h2.jaguarpaw.co.uk/posts/data-map-strict-map-not-strict-map"]
title = "data-map-strict-map-not-strict-map"
full_description = "Summary: I was surprised when I learned that Data.Map.Strict.Map is not strict. Its laziness has serious consequences for attempts at space leak free programming in Haskell. The Haskell containers package has a module called Data.Map which provides an associative container type. That module just re-exports Data.Map.Lazy so it is a lazy associative container type. What does the word “lazy” mean here? Have a look at this example: We started with an empty map, inserted the entry undefined under the key 0, and then deleted the entry under key 0. The result was an empty map. We call this data structure “lazy” because its operations do not evaluate the entries it contains. Instead the entries are left as unevaluated thunks until some consumer evaluates them. (The tree structure of the map and the keys of the map are not lazy, however.) We know the map does not evaluate its entries because if it did we would have seen an exception when it came to evaluate undefined. The strict map ensures that the entries are always kept evaluated (when the map itself is). We see that it tried to evaluate undefined and thus raised an exception. The strict version is useful for avoiding space leaks when making many adjustments to a map. It avoids the entries becoming unevaluated thunks, growing in size. For example, this function has a space leak: If we want to make a larger data type that contains an associative map and that has many modifications performed to it over the lifetime of a program should we should use a strict map like this It’s a trick question! Suppose I diligently chose the first option but my colleague who was using my data type comes to me and says “I have a space leak when using MyData”. How could that be?! Data.Map.Strict.Map is not a strict map. It is the same type as Data.Map.Lazy.Map! We saw strict behaviour above because Data.Map.Strict is a strict interface to a lazy map. It does not itself provide a strict map. The documentation is explicit about this"
