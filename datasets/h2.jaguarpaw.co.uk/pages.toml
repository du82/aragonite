["https://h2.jaguarpaw.co.uk/posts/hascallstack-domain-errors"]
title = "hascallstack-domain-errors"
full_description = "HasCallStack is a feature in Haskell’s compiler, GHC, that is frequently used to annotate exceptions with the call stack at the point in the program from which they were thrown. For example, I can define an exception type that, as well as a message, contains a CallStack: The feature makes debugging easier by allowing the origin of of an exception to be discovered. But it is useful for more than just exceptions: it is also useful for error messages in domain specific languages. In this article we’ll look at an example of such a use case. At Groq, one of the things we use Haskell for is to provide an embedded domain specific assembly language (an “assembly EDSL”) for our novel chip, the “LPU”. The assembly language allows us to define a program, which consists of a sequence of instructions to run on each processor on the chip and a collection of data values (called “constants”) that are loaded alongside the program to particular addresses in the chip’s memory. Let’s have a look at how we can implement part of this in Haskell, restricting ourselves, for simplicity, to specifying the constant values and addresses. For the purposes of this article, we’ll say that a memory address (Address) is an Int, and a constant value placed at an address (Data) is a list of Word8 of length 8 (i.e. a list of 8 bytes). In practice we would probably use newtype or data definitions but to keep things simple in this article we’ll just use type synonyms. Let’s see how we can arrange that. Firstly, we’ll need an Assembly monad. Here I’m using Bluefin for the implementation. The implementation is roughly equivalent to a Writer [Constant] monad (from the transformers library) or a Stream (Of Constant) monad (from the streaming library). (For the monad instance, see the appendix.) Then what should the function constant do? It should yield the arguments we give it into the stream, so that when we run the stream we pick them up. For the assembly stage, let’s collect the constants together and put them in a Map (from the containers library) keyed by Address:"
