["https://h2.jaguarpaw.co.uk/posts/functional-looping"]
title = "functional-looping"
full_description = "Explicit looping is commonplace in imperative programming languages. For example, this is how I might write a loop in Python. There are a couple of small differences between the Python version and the Haskell version, and two bigger ones. The small ones are that in the Haskell version we explicitly continue by naming myLoop whereas the Python version explicitly breaks instead, and naturally the Haskell version explicitly passes the state for the next iteration. The two bigger differences make the Haskell version clumsier. Firstly we have to name myLoop and call it explicitly. Secondly the initial state (0) is passed in far from the definition of myLoop. How can we fix this? Let’s define a genereric looping combinator, loop. To make my loop less clumsy I want to avoid naming myLoop and I want to pass the initial state in to loop directly. This suggests I want to write something like but what can I pass as the second argument to body? It needs to be something that takes the updated state and continues with the loop. But that’s just flip loop body! So I can define Note that flip loop body state = body (flip loop body) state so flip loop body = body (flip loop body). If we write fix f = f (fix f) then loop = flip fix. N.B. fix is normally written as fix f = let x = f x in x for efficiency."
