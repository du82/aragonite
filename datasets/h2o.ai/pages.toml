description = "End-to-end GenAI platform built for air-gapped, on-premises or cloud VPC deployments. Own every part of the stack--own your data and your prompts."
full_description = "H2O.ai Brings Its Flagship H2O World Event to New York Launches H2O Agentic AI to Converge Generative and Predictive AI, and H2O Multi-Agent Platform Validated on Dell AI Factory with NVIDIA for Enterprise Deployment November 21, 2024 09:00 AM Eastern Standard Time MOUNTAIN VIEW, Calif.--(BUSINESS WIRE)--H2O.ai, the leader in open-source generative AI and the most accurate predictive AI platform, continues its world tour of democratizing Generative AI to major cities around the world. The event will be held on November 21, 2024, at the NASDAQ building on 151 West 42nd Street #4th floor, New York, NY 1003,6 and has attracted 200+ business leaders and data science users across financial services, banking, telco, insurance, and healthcare. Event highlights and speakers include: Keynote by Sri Ambati, CEO and founder of H2O.ai, and Rob Parish, senior director of data & AI solutions at Dell, to unveil the launch of H2O.ai on Dell AI Factory with NVIDIA AT&T Generative AI use cases“Driving Telco Innovation: Distilling Large Models into Economical Small Language Models.”Text-to-SQL: Fine-tuning for Enhanced Query Generation. New product announcements on:H2O Agentic AI by Dr. Arno Candel, Jon McKinney, and Achraf Merzouki.Model Validation for Generative AI by Dr. Agus Sudjianto and Srinivas Neppalli. AI for Finance Panel with Dr. Yu Yu, director of data science at BlackRock, Krish Swamy, CDAO at Citizens, Kiran Yalavarthy, head of enterprise model risk management at Wells Fargo, and Dr. Rafic Fah, chief model risk officer at First Third Bank. Moderated by Dr. Agus Sudjianto, SVP of risk & technology at H2O.ai. Dr. Tanya Berger-Wolf, member of the US National Committee, will give a talk on “AI for Nature: From Science to Impact.” Hands-on technical workshopsAI agents, LLM chains, and real-world applications that combine generative and predictive AI. Followed by “Kernel Internal: deployment architecture for H2O.ai on Dell AI Factory with NVIDIA infrastructure”H2O Generative AI model evaluation covering LLM model validation, embedding, and explainability, eval metric and RAG, human eval robustness testing, and perturbation. AI Solutions Panel: “Evolution, Challenges and the Human Element” with panelists from PricewaterhouseCoopers, Deloitte, EY, and the UN International Computing. Moderated by Dr. Ashrith Barthur. Fireside chat with Deepesh Chandra, CIO at Montefiore Einstein, and Sri Ambati, founder and CEO, H2O.ai. KGMs Panel: “The Minds Behind the Models: Insights from Kaggle Grandmasters on the Future of AI and Data Science.” Moderated by Dr. Arno Candel, Chief Technology Officer at H2O.ai H2O AI 100 Awards Ceremony to honor 2024 winners Registration for H2O GenAI World New York is limited; passes are available at https://www.eventbrite.com/e/h2o-genai-world-ny-tickets-999628133657 Please visit H2O.ai YouTube or Slideshare for on-demand content from past events and talks. In the last year, sold-out H2O World events have been held in Washington, D.C., Atlanta, New York, London, Singapore, Sydney, and San Francisco, attended by thousands representing over 30 countries and every industry. For more information about H2O GenAI World NY, access the agenda https://h2o.ai/content/dam/h2o/en/marketing/documents/2024/AGENDA-H2oGenAIWorld-NY24_FINAL.pdf About H2O.ai Founded in 2012, H2O.ai is at the forefront of the AI movement to democratize Generative AI. H2O.ai’s open-source Generative AI and Enterprise h2oGPTe, combined with Document AI and the award-winning autoML Driverless AI, have transformed more than 20,000 global organizations, and over half of the Fortune 500, including AT&T, Commonwealth Bank of Australia, Chipotle, Singtel, Workday, Progressive Insurance, and AES. H2O.ai partners include Dell, Deloitte, Ernst & Young (EY), PricewaterhouseCoopers (PwC), NVIDIA, Snowflake, AWS, Google Cloud Platform (GCP) and Microsoft Azure. H2O.ai’s AI for Good program supports nonprofit groups, foundations, and communities in advancing education, healthcare, and environmental conservation. With a vibrant community of 2 million data scientists worldwide, H2O.ai aims to co-create valuable AI applications for all users. H2O.ai has raised $256 million from investors, including Commonwealth Bank, Nvidia, Goldman Sachs, Wells Fargo, Capital One, Nexus Ventures and New York Life. Contacts Media Contact Betty Candel VP Marketing betty.candel@h2o.ai"
