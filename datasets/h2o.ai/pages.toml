["https://h2o.ai/company/team/board-of-directors"]
title = "Meet the H2O.ai Board of Directors"
description = "End-to-end GenAI platform built for air-gapped, on-premises or cloud VPC deployments. Own every part of the stack--own your data and your prompts."
full_description = "H2O.ai Board of Directors H2O.ai is guided by a Board of Directors composed of seasoned industry leaders with broad experience in key areas of focus and diverse business experience. AB Periasamy CEO & Co-Founder at Minio AB Periasamy | CEO & Co-Founder at Minio Follow AB on Twitter Andrew McMullan PhD, Chief Data and Analytics Officer at Commonwealth Bank of Australia Andrew McMullan | PhD, Chief Data and Analytics Officer at Commonwealth Bank of Australia Prior to joining CBA, Andrew was Director of Customer Analytics & Decisioning at Royal Bank of Scotland, where he was accountable for the delivery of Data, Analytics, Customer Decisioning, Customer Contact, Pricing Strategy and Customer Value Management for the Retail Bank and Small Business portfolio for all brands within RBS. Earlier in his career, Andrew worked in Academia as a lecturer in Mathematics and Statistics, before leading the Rating and LGD methodology team for several years at UBS Investment Bank. The CAO leads the Data & Decision Science team who are responsible for leading the delivery of world-class data, analytics and technology capabilities to improve the financial well-being of our customers and communities. The core functions include: Customer Engagement Engine (design and delivery of all customer contact strategies, across all systems and all channels), Data Office and Data Science and Advanced Modelling (all AI, Machine Learning, Deep Learning, Adaptive Modelling and Advanced Analytics). Basil Darwish Managing Director Strategic Investments at Wells Fargo Basil Darwish | Managing Director Strategic Investments at Wells Fargo Basil serves as a Managing Director, Strategic Investments at Wells Fargo. Basil focuses his investments on financial technology, Big Data Analytics, Machine Learning and enterprise software infrastructure. Prior to Wells Fargo, Basil was senior vice president at Citi’s growth ventures and innovation group where he focused on venture investments and innovation across the US and, prior to that, in Asia out of Singapore. Prior to that, Basil spent several years in the technology industry in various roles across the value chain, from semiconductor product engineering and system-level integration at Analog Devices Inc and as a digital design engineer at Chinook Communications, a tech startup that emerged out of MIT. Basil holds an MBA from the Wharton School of Business with a double major in finance and entrepreneurial management, an MS in Electrical Engineering from Tufts University focused on semiconductor design, and a BSc in EE from the University of Jordan. Jade Mandel Managing Director, Venture Capital and Growth Equity Jade Mandel | Managing Director, Venture Capital and Growth Equity Jade is a Vice President on the Goldman Sachs Growth Equity Team, where she focuses on Fintech and Enterprise Software venture and growth equity investments. Prior to her current role, Jade worked on the Goldman Sachs Principal Strategic Investments team in Hong Kong, where she covered the team’s India and South East Asia strategic investments and portfolio companies. Jade previously worked on Goldman Sachs’ internal strategy and M&A team evaluating strategic acquisition opportunities for the firm. In addition to H2O.ai, she also serves on the board of Nav and is a board observer for Second Measure. Jade holds a BA from Cornell University’s Arts & Sciences College with a degree in Economics and Asian Studies. Jishnu Bhattacharjee Managing Director at Nexus Venture Partners Jishnu Bhattacharjee | Managing Director at Nexus Venture Partners Jishnu brings to Nexus several years of operating and investing expertise in hi-technology start-ups. He has invested in enterprise technology, mobile, and technology-enabled services companies and is interested in a wide range of start-ups. Jishnu’s current board involvements include Druva, Helpshift, H2O.ai, Rancher Labs, Postman, Blueshift, Kaltura, and a variety of other companies. His investments also include Mezi (acquired by American Express), Arkin (acquired by VMware), Cloud.com (acquired by Citrix), Gluster (acquired by Red Hat), and Elastic Box (acquired by CenturyLink). Before joining the VC industry, Jishnu held engineering management and product management roles at a communication systems start-up, Scintera Networks and a leading circuits and systems company, Maxim Integrated Products. Jishnu has an MBA from the Stanford Graduate School of Business, where he ran the Venture Capital Club and co-led GSB Principal Investing Conference. Jishnu also holds an MS degree in electrical engineering from Georgia Institute of Technology and a BTech from IIT Kharagpur and is an inventor on more than a dozen US patents. Michael Marks Founding Managing Partner at Celesta Michael Marks | Founding Managing Partner at Celesta Michael Marks is a founding managing partner at Celesta Capital, where he co-leads the firm. Michael is also a co-founder of Katerra, Inc., a construction technology company, and was its chairman and CEO from 2015 to 2020. Previously, from 2007 to 2019, he was a founding partner at Riverwood Capital Management, a private equity fund specializing in rapidly growing private companies in North America and emerging markets. He was a partner and senior advisor at Kohlberg Kravis Roberts & Co. (KKR) in 2006 and 2007. Before KKR, he spent 13 years as Chairman and CEO of Flextronics International Ltd. and built the company into one of the largest technology companies in the world. Sri Ambati Founder & Chief Executive Officer Sri Ambati | Founder & Chief Executive Officer Sri Ambati is the founder and CEO of H2O.ai. A product visionary who has assembled world-class teams throughout his career, Sri founded H2O.ai in 2012 with a mission to democratize AI for anyone, anywhere, creating a movement of the world’s top data scientists, physicists, academics and technologists at more than 20,000 organizations worldwide. Sri also regularly partners with global business leaders to fund AI projects designed to solve compelling business, environmental and societal challenges. Most recently, Sri led the initiative o2forindia.org, sourcing O2 concentrators for more than 200 public health organizations in Tier 2 cities and rural communities in India during the Delta wave of the COVID-19 pandemic, helping to save thousands of lives. His strong “AI for Good” ethos for the responsible and fair use of AI to make the world a better place drives H2O.ai’s business model and corporate direction. A sought-after speaker and thought-leader, Sri has presented at industry events including Ai4, Money2020, Red Hat Summit and more, is a frequent university guest speaker, and has been featured in publications including The Wall Street Journal, CNBC, IDG and the World Economic Forum and has been named a Datanami Person to Watch. Before founding H2O.ai, Sri co-founded Platfora, a big data analytics company (acquired by Workday) and was director of engineering at DataStax and Azul Systems. His academic background includes sabbaticals focused on Theoretical Neuroscience at Stanford University and U.C. Berkeley, and he holds a master’s degree in Math and Computer Science from the University of Memphis. Sri is inspired by his two daughters and genius. Join our AI Movement Join the Team Come join us to change the world in a meaningful way! Careers Become a Partner Learn how to become part of the H2O.ai partner network. Learn More"
