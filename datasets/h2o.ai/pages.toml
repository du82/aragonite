["https://h2o.ai/blog/2013/building-a-tb-scale-math-platform-uberconf-2013-denver"]
title = "Building A TB-Scale Math Platform @ Uberconf 2013, Denver | H2O.ai"
description = "End-to-end GenAI platform built for air-gapped, on-premises or cloud VPC deployments. Own every part of the stack--own your data and your prompts."
full_description = "End-to-end GenAI platform built for air-gapped, on-premises or cloud VPC deployments. Own every part of the stack--own your data and your prompts. Connect any LLM/embedding model, fully scalable w/K8s, includes guardrails, summarization, cost controls, and customization options. Evaluation framework with automated testing, human calibration, bias detection, explainability, and failure analysis to boost compliance and risk control. No-code fine-tuning for custom enterprise-grade LLMs. Train scalable SLMs for cheaper, more efficient NLP use cases. Develop, deploy and share safe and trusted applications for your organization with use cases across enterprise, public sector, and more. Choose to deploy on-premise and airgapped, self hosted on VPC, or fully hosted and managed by H2O.ai. Learn how CBA is boosting AI capabilities to generate better customer and community outcomes, at greater pace and scale. Learn now IFFCO-Tokio uses the H2O AI Cloud to save over $1M annually by transforming their fraud prediction processes H2O.ai is recognized as a Visionary in 2024 Gartner® Magic Quadrant™ for Cloud AI Developer Services Building A TB-Scale Math Platform Datasets have gotten to PB-scale, but the modeling you can do has been limited to a single-node (e.g. R, SAS) or stuck inside the database or takes hours on Hadoop-like technologies. We have built a simple clustering package, and are using it to do distributed analytics on the sum of all ram in a cluster. This talk focuses on how the clustering technology, plus a Java-based vector math API, is being used to build full algorithms like GLM/GLMNET, Random Forest and K-means. These algorithms are complex multi-pass programs and traditional distributed programming models expose the distributed boundaries making the algorithms hard to reason about. We have a basic JDK for doing at-scale math, we can run most Plain Olde Java in (distributed) inner loops, communicate via a K/V store with exact Java Memory Model consistency (not lazy consistency). Adding more cpus makes these algorithms run faster, and adding more ram allows larger datasets. We are bringing back Moore’s Law! Cliff will be presenting."
