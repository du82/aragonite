full_description = "End-to-end GenAI platform built for air-gapped, on-premises or cloud VPC deployments. Own every part of the stack--own your data and your prompts. Connect any LLM/embedding model, fully scalable w/K8s, includes guardrails, summarization, cost controls, and customization options. Evaluation framework with automated testing, human calibration, bias detection, explainability, and failure analysis to boost compliance and risk control. No-code fine-tuning for custom enterprise-grade LLMs. Train scalable SLMs for cheaper, more efficient NLP use cases. Develop, deploy and share safe and trusted applications for your organization with use cases across enterprise, public sector, and more. Choose to deploy on-premise and airgapped, self hosted on VPC, or fully hosted and managed by H2O.ai. Learn how CBA is boosting AI capabilities to generate better customer and community outcomes, at greater pace and scale. Learn now IFFCO-Tokio uses the H2O AI Cloud to save over $1M annually by transforming their fraud prediction processes H2O.ai is recognized as a Visionary in 2024 Gartner® Magic Quadrant™ for Cloud AI Developer Services Join us and Yelp for a chat on Machine Learning, and make sure not to miss Sri’s lightning talk on Distributed Gradient Boosting! Main Talk: Machine Learning for Relevance and Serendipity Speaker: Aria Haghighi (Prismatic ) Abstract: Careful use of well-designed machine learning systems can transform products by providing highly personalized user experiences. Unlike hand-tuned or heuristic-based personalization systems, machine learning allows for the use of millions of different potential indicators when making a decision, and is robust to many types of noise. In this talk, I will discuss our deeply-integrated use of machine learning and natural language processing for content discovery at Prismatic. Our real-time personalization engine is designed to give our users not just the content they expect, but also a healthy dose of targeted serendipity, all based on relevance models learned from users’ interactions with the site. We use sophisticated machine learning techniques for topical classification of stories, to determine story similarity, make topic suggestions, rate the value of different social connections, and ultimately to determine the relevance of a particular story for a particular user. I will go into detail describing our personalized relevance model, starting with a description of our problem formulation, then discussing feature design, model design, evaluation metrics, and our experimental setup which allows quick offline prototyping without forcing users into the role of guinea pig. Our model’s combination of social cues, topical classification, publisher information, and analysis of the user’s prior interactions produces highly-relevant and often delightfully serendipitous content for our users to consume. Lightning Talk: Distributed Gradient Boosting Speaker: SriSatish Ambati (0xdata ) Abstract: Boosting is a simple yet powerful technique for learning algorithms. We present a distributed gradient boosting algorithm that’s accessible from R and a simple API for roll-your-own Distributed Machine Learning Algorithm for Big Data. Tentative Schedule: 6:30-7:00 – socializing 7:00-7:20 – lightning talk 7:20-8:30 – main presentation 8:30-9:00 – socializing"
