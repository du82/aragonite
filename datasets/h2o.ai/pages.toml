["https://h2o.ai/blog/2013/api-distributed-analytics"]
title = "An API For Distributed Analytics | H2O.ai"
description = "End-to-end GenAI platform built for air-gapped, on-premises or cloud VPC deployments. Own every part of the stack--own your data and your prompts."
full_description = "End-to-end GenAI platform built for air-gapped, on-premises or cloud VPC deployments. Own every part of the stack--own your data and your prompts. Connect any LLM/embedding model, fully scalable w/K8s, includes guardrails, summarization, cost controls, and customization options. Evaluation framework with automated testing, human calibration, bias detection, explainability, and failure analysis to boost compliance and risk control. No-code fine-tuning for custom enterprise-grade LLMs. Train scalable SLMs for cheaper, more efficient NLP use cases. Develop, deploy and share safe and trusted applications for your organization with use cases across enterprise, public sector, and more. Choose to deploy on-premise and airgapped, self hosted on VPC, or fully hosted and managed by H2O.ai. Learn how CBA is boosting AI capabilities to generate better customer and community outcomes, at greater pace and scale. Learn now IFFCO-Tokio uses the H2O AI Cloud to save over $1M annually by transforming their fraud prediction processes H2O.ai is recognized as a Visionary in 2024 Gartner® Magic Quadrant™ for Cloud AI Developer Services Automatic data placement: It’s a hard problem, and its been hard for a long time – but technology is changing: networks are fast relative to the size of memory. You can move a significant fraction of memory in a cluster in relatively little time. “Disk is the new tape”: we want to do work in-memory for that 1000x speedup over disk, but this requires loading memory into one of many little slices in the cluster – which implies data-placement. Start with random placement – while it’s never perfect, it’s also rarely “perfectly wrong” – you get consistent decent access patterns. Then add local caching to catch the hot common read blocks, and local caching of hot or streaming writes. For H2O, this is one of the reasons for our K/V store; we get full JMM semantics, exact consistency, but also raw speed: 150ns for a cache-hitting read or write. Typically a cache miss is a few msec (1 network hop there and back). Map/Reduce: It’s a simple paradigm shown to scale well. Much of Big Data involves some kind of structure (log files, bit/byte streams, up to well organized SQL/Hive/DB files). Map is very generic, and allows an arbitrary function on a unit of work/data to be easily scaled. Reduce brings Big down to Small in a logarithmic number of steps. Together, they handle a lot of problems. Key to making this work: simplicity in the API. Map converts an A to a B, and Reduce combines two B’s into one B – for any arbitrary A and B. No resource management, no counting Map or Reduce slots, no shuffle, no keys. Just a nice clean Map and Reduce. For H2O this means: Map reads your data directly (type A) and produces results in a Plain-Olde Java POJO’s (type B) – which is also the Map’s “this” pointer. Results returned directly in “this”. “This is Not Your Father’s Map Reduce” Correct By Default: No multi-threaded access questions. Synchronization, if needed, is provided already. No figuring out sharding or data placement; replication (caching) will happen as-needed. NO resource management, other than Xmx (Java heap size). Like sync, resource management is notoriously hard to get right so don’t require people to do it. For 0xdata, this means we use very fine grained parallelism (no Map is too small, Doug Lea Fork/Join), and very fine-grained Reduces (so all Big Data shrinks as rapidly as possible). Fast By Default: Use of the default Map/Reduce API will produce programs that run in parallel & distributed across the cluster, at memory bandwidth speeds for both reads and writes. Other clustered / parallel paradigms are available but are not guaranteed to go fast. The API has a simple obvious design, and all calls have a “cost model” associated with them (these calls are guaranteed fast, these calls are only fast in these situations, these calls will work but may be slow, etc. For 0xdata, code that accesses any number of columns at once (e.g. a single row) – but independent rows – will run at memory bandwidth speeds. Same for writing any number of columns, including writing subsets (filtering) on rows. Reductions will happen every so many Maps in a Log-tree fashion. All filter results are guaranteed to be strongly ordered as well (despite the distributed & parallel execution). Easy / Multiple APIs – Not all APIs are for all users! Java & Map/Reduce are good for Java programmers – but people do math in R, Python and a host of other tools. For 0xdata, we are a team of language implementers as well as mathematicians and systems’ engineers. We have implemented a generic REST/JSON API and can drive this API from R, python, bash, and Excel – with the ability to add more clients easily. From inside the JVM, we can drive the system using Scala, or a simple REPL with an R-like syntax."
