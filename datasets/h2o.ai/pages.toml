full_description = "Cirrascale Cloud Services Delivers Automated Machine Learning Solutions with H2O Driverless AI and IBM Power Systems The company’s deep learning and HPC cloud platform now supports the H2O.ai Driverless AI software solution on IBM Power Systems to deliver AI driven services to transform businesses. Dallas, Texas – Supercomputing 2018 – November 13, 2018 – Cirrascale® Cloud Services, a premier provider of multi-GPU deep learning cloud solutions, today announced the availability of H2O Driverless AI, the automatic machine learning platform, running on the IBM Power Systems AC922 server on Cirrascale Cloud Services’ deep learning and HPC cloud platform. “We are excited to continue to build out our AI Ecosystem partnerships by adding the H2O Driverless AI platform to our list of enterprise offerings,” said Mike LaPan, vice president, Cirrascale Cloud Services. “Deploying this solution on our current IBM Power Systems cloud service results in customers being able to create and test thousands of model iterations in minutes.” H2O Driverless AI employs the techniques of expert data scientists in an easy to use application that helps scale your data science efforts. Through the intuitive Graphical User Interface data scientists can perform advanced analytics on their data more efficiently and get to their desired results more quickly. Cirrascale deploys H2O Driverless AI software in its cloud onto IBM Power Systems servers. H2O Driverless AI on the IBM POWER9-based AC922 server allows for faster data ingest and accelerates machine learning insights by up to 5X thanks to POWER9’s industry-leading I/O technology. Overall, these optimizations accelerate enterprise workloads such as predictive maintenance, operational intelligence, security, fraud, auditing and more. “AI is transforming businesses and business applications. H2O.ai is building a very strong ecosystem to deliver rich AI-first applications in the cloud,” said Sri Ambati, CEO and founder of H2O.ai. “With our partnership with Cirrascale Cloud Services and IBM Power, customers can experience world-class AI with ease and cost effectively.” “With the explosive growth of AI, customers need powerful AI tools to meet their growing user demands,” said Sumit Gupta, Vice President of AI and HPC for IBM Cognitive Systems. “We’re proud to partner with H2O and Cirrascale Cloud Services to continue to provide the right tools for accelerating machine learning to solve today’s most prevalent business problems.” Cirrascale Cloud Services is offering a one week free trial of H2O Driverless AI on IBM Power Systems for qualifying companies. To sign up, interested parties should go to http://H2O.cirrascale.com and complete the trial form for consideration or call (888) 942-3800 for additional information. About Cirrascale Cloud Services Cirrascale Cloud Services is a premier provider of public and private dedicated, multi-GPU cloud solutions enabling deep learning. The company offers cloud-based solutions for large-scale deep learning operators, service providers, as well as HPC users. To learn more about Cirrascale Cloud Services and its unique dedicated, multi-GPU cloud solutions, please visit http://www.cirrascale.com or call (888) 942-3800. About H2O.ai H2O.ai is the open source leader in AI. Its mission is to democratize AI for everyone. H2O.ai is transforming the use of AI with software with its category-creating visionary open source machine learning platform, H2O. More than 14,000 companies use open-source H2O in mission-critical use cases for Finance, Insurance, Healthcare, Retail, Telco, Sales and Marketing. H2O Driverless AI uses AI to do AI in order to provide an easier, faster and effective means of implementing data science. In February 2018, Gartner named H2O.ai as a Leader in the 2018 Magic Quadrant for Data Science and Machine Learning Platforms. H2O.ai partners with leading technology companies such as NVIDIA, IBM, AWS, Microsoft Azure, Google Cloud Platform and Cirrascale Cloud Services, and is proud of its growing customer base which includes Progressive Insurance, Walgreens and PayPal. For more information and to learn more about how H2O.ai is driving an AI Transformation for businesses with intelligence, visit www.h2o.ai. Cirrascale Cloud Services, Cirrascale and the Cirrascale logo are trademarks or registered trademarks of Cirrascale Cloud Services LLC. H2O and Driverless AI are trademarks or registered trademarks of H2O.ai. IBM, IBM PowerAI and IBM Power Systems are trademarks or registered trademarks of IBM. All other names or marks are property of their respective owners."
