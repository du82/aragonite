nts occur, we will make reasonable efforts to notify you before your information becomes subject to different privacy and security policies and practices. Legal Obligations: We may share any Personal Information that we collect with third parties in conjunction with any of the activities set forth under “Meeting Legal Requirements and Enforcing Legal Terms” in the “Our Commercial or Business Purposes for Collecting Personal Data” section above. Data that is Not Personal Information: We may create aggregated, de-identified or anonymized data from the Personal Information we collect, including by removing information that makes the data personally identifiable to a particular user. We may use such aggregated, de-identified or anonymized data and share it with third parties for our lawful business purposes, including to analyze, build and improve the Services and promote our business, provided that we will not share such data in a manner that could identify you. How long we keep your personal information We retain information as long as it is necessary to provide the Services to you and our Clients, subject to any legal obligations to further retain such information. We may also retain information to comply with the law, prevent fraud, collect fees, resolve disputes, troubleshoot problems, assist with investigations, enforce our Terms of Service and take other actions permitted by law. The information we retain will be handled in accordance with this Privacy Policy. Information connected to you that is no longer necessary and relevant to provide our Services may be de-identified or aggregated with other non-personal data to provide insights which are commercially valuable to H2O, such as statistics of the use of the Services. Children’s Personal Information As noted in the Terms of Use, we do not knowingly collect or solicit Personal Information about users under 18 years of age; if you are a user under the age of 18, please do not attempt to register for or otherwise use the Services or send us any Personal Information. If we learn we have collected Personal Information from a user under 18 years of age, we will delete that information as quickly as possible. If you believe that a child under 18 years of age may have provided Personal Information to us, please contact us at privacy@h2o.ai. PRIVACY INFORMATION FOR CALIFORNIA RESIDENTS If you are a California resident, California law requires us to provide you with some additional information regarding how we collect, use, and share your “personal information” (as defined in the California Consumer Privacy Act (“CCPA”)). Please note that we may process Personal Information of our Clients’ end users or employees in connection with our provision of certain services to our Clients. If we are processing your Personal Information as a service provider, you should contact the entity that collected your Personal Information in the first instance to address your rights with respect to such data. If there are any conflicts betwe"
