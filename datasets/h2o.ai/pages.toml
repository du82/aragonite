["https://h2o.ai/company/team/leadership-team"]
title = "Meet the H2O.ai Leadership Team"
description = "H2O.ai's leadership team brings together over a century of experience in artificial intelligence, machine learning, data science, and cloud computing."
full_description = '''H2O.ai Leadership H2O's leadership team brings deep expertise across multiple industry sectors including banking, finance, healthcare, insurance, software services, supercomputing, and deep technology. Sri Ambati Founder & Chief Executive Officer Sri Ambati | Founder & Chief Executive Officer Sri Ambati is the founder and CEO of H2O.ai. A product visionary who has assembled world-class teams throughout his career, Sri founded H2O.ai in 2012 with a mission to democratize AI for anyone, anywhere, creating a movement of the world’s top data scientists, physicists, academics and technologists at more than 20,000 organizations worldwide. Sri also regularly partners with global business leaders to fund AI projects designed to solve compelling business, environmental and societal challenges. Most recently, Sri led the initiative o2forindia.org, sourcing O2 concentrators for more than 200 public health organizations in Tier 2 cities and rural communities in India during the Delta wave of the COVID-19 pandemic, helping to save thousands of lives. His strong “AI for Good” ethos for the responsible and fair use of AI to make the world a better place drives H2O.ai’s business model and corporate direction. A sought-after speaker and thought-leader, Sri has presented at industry events including Ai4, Money2020, Red Hat Summit and more, is a frequent university guest speaker, and has been featured in publications including The Wall Street Journal, CNBC, IDG and the World Economic Forum and has been named a Datanami Person to Watch. Before founding H2O.ai, Sri co-founded Platfora, a big data analytics company (acquired by Workday) and was director of engineering at DataStax and Azul Systems. His academic background includes sabbaticals focused on Theoretical Neuroscience at Stanford University and U.C. Berkeley, and he holds a master’s degree in Math and Computer Science from the University of Memphis. Arno Candel Chief Technology Officer Arno Candel | Chief Technology Officer Arno Candel is the Chief Technology Officer at H2O.ai, where he has been the main committer of the industry-leading machine learning and data science platforms H2O-3 and H2O Driverless AI since joining the company in 2014. Previously, he spent a decade in supercomputing at ETH and Stanford Linear Accelerator Center and collaborated with CERN on next-generation particle accelerators. Arno holds a PhD and Masters summa cum laude in Physics from ETH Zurich, Switzerland. Arno was named "2014 Big Data All-Star" by Fortune Magazine and featured in ETH GLOBE in 2015 and WIRED in 2017. Connect with him on Twitter @ArnoCandel. Prithvi Prabhu Chief Technologist, Applications Prithvi Prabhu | Chief Technologist, Applications Prithvi is Chief of Technology, Applications at H2O.ai. Prithvi leads the design and development of "Q", H2O.ai's high scale exploratory data analysis and analytical application development platform. Prithvi has been with H2O.ai since its early days and has been responsible for several products including Driverless AI (our flagship automatic machine learning platform), Steam (distributed cluster management, model management and deployment for H2O), H2O.js (Javascript transpiler for H2O's distributed runtime), Play (on-demand cloud provisioning system for H2O), Flow (a hybrid GUI/REPL/Notebook for H2O) and Lightning (statistical graphics for H2O). In the past, Prithvi was an early engineer at Platfora, where he was responsible for the high performance interactive data visualization engine. Before that, he founded Plot.io, a browser-based visual analytics environment (acquired by Platfora). Delphine Bernard Chief Financial Officer Delphine Bernard | Chief Financial Officer Delphine Bernard is an accomplished Chief Financial Officer and seasoned board member, specializing in guiding hypergrowth technology companies from startup to public entity. She brings extensive experience across both startup and public company landscapes. Most recently, she served as CFO at Branded, an e-commerce aggregator, where she drove growth, enhanced profitability, and led multiple funding rounds. Her career includes impactful roles at notable companies such as Microsoft, Mars, and Skype. Before that, as Global Head of Finance Operations of Uber, Delphine played a pivotal role in preparing the company for its IPO, strengthening compliance, and optimizing operational efficiency. Bernard’s leadership spanned global teams, establishing her as a true international leader. Business Transformation Agus Sudjianto Senior Vice President, Risk and Technology for Enterprise Services Agus Sudjianto | Senior Vice President, Risk and Technology for Enterprise Services Dr. Agus Sudjianto is the Senior Vice President, Risk and Technology for Enterprise at H2O.ai. He brings over two decades of experience in the financial services industry, with leadership roles in risk management, analytics, and modeling at Wells Fargo and Bank of America. Agus is renowned for pioneering PiML (Python Interpretable Machine Learning), a set of methods and tools for creating interpretable and understandable machine learning models. He has championed the adoption of PiML in the industry, open-sourcing it to democratize models for ensuring reliability, resilience, and fairness in high-risk applications.At H2O.ai, Agus focuses on developing H2O Eval products to address AI safety, reliability, and compliance, with a focus on Generative AI applications in banking and model risk management. Agus holds a PhD in Engineering from Wayne State University and a Master’s degree from MIT. Venkatesh Yadav VP, AI Applications and Delivery Venkatesh Yadav | VP, AI Applications and Delivery Venkatesh is a software engineering leader with a focus on building great teams that deliver products and functionality to solve customer use cases. Venkatesh has worked at Adobe Systems, where he held a number of positions in the software engineering and leadership space including his latest role as Sr. Manager with a primary focus on master data management and data science. Prior to Adobe Systems Venkatesh has worked in various engineering roles in companies like Philips, HP and IBM. Venkatesh holds a Bachelor of Commerce degree from Mumbai University India. David Epperson CISO David Epperson | CISO Betty Candel Vice President, GTM Betty Candel | Vice President, GTM Betty is the vice president of marketing at H2O.ai. She brings more than 20 years of experience leading GTM and product marketing at companies including Bolt Payments, DigitalOcean and Gemalto. Dina Lyon VP, Corporate Marketing Dina Lyon | VP, Corporate Marketing Dina Lyon is a marketing leader with over 13 years of experience in high-growth startups and venture capital. She has built and scaled marketing functions from the ground up at firms like Cohen Circle, Earnest Analytics, and Noogata, specializing in brand development, executive thought leadership, media relations, and content strategy. Dina excels at driving visibility and engagement for data-driven businesses. She holds a B.A. from Middlebury College and lives in Brooklyn, NY. Operations Jeff Gambera Vice President, Development Operations Jeff Gambera | Vice President, Development Operations Alicia Nequist Head of Global People Alicia Nequist | Head of Global People Technology Michal Malohlava Senior Vice President, Engineering Michal Malohlava | Senior Vice President, Engineering Michal Malahlava has been the vice president of engineering at H2O.ai since 2013. He has also worked as chief architect of platforms at H2O.ai since 2017. Michal holds a PhD from Charles University in Prague and a postdoctoral degree from Purdue University. During his studies he was interested in the construction of various software systems using model-driven methods and domain-specific languages. He participated in the design and development of various systems including SOFA and Fractal component systems or jPapabench control systems. Tom Kraljevic Vice President, Customer Engineering Tom Kraljevic | Vice President, Customer Engineering Tom is VP of Customer and Pre-Sales Engineering at H2O & key to the magic of engineering & customer happiness. A quintessential team member – Tom is an extraordinary blend of technical genius, customer focus and management by example. Before joining H2O, Tom was Co-founder & CTO at Luminix, where he and the team developed a cutting-edge offline mobile application for Salesforce users. This involved a healthy blend of focusing on the user-experience along with a deep-dive in various technologies. Prior to Luminix, Tom was a Principal Engineer at Azul Systems, where he worked in both the JVM and System Software teams. Tom served as the technical leader for the distributed management application team, appliance security and tools for distributed debugging. Tom’s experience at systems and chip startup companies involved straddling the hardware-software boundary. Tom led pre-silicon verification infrastructure development for a terabit networking switch fabric chipset at Abrizio (acquired by PMC-Sierra). He also developed architectural CPU simulators, debuggers and toolchains at Chromatic Research (acquired by ATI). Tom got his start in technology at Intel, spending internships and co-ops in both the Portland (MD6) and Santa Clara (MD7) microprocessor design groups. A lesser-known fact about Tom: Finding the now-famous Pentium floating-point divide (FDIV) bug while at Intel using the testing harness and methodology he developed (several months before it was independently discovered outside Intel, and subsequently gained worldwide attention). Tom has an MS degree in Electrical Engineering from the University of Illinois (at Urbana-Champaign), and a BSE degree in Computer Engineering from the University of Michigan (at Ann Arbor). Michelle Tanco Head of Product Michelle Tanco | Head of Product As the Head of Product at H2O.ai, Michelle Tanco’s primary focus lies in delivering a seamless user experience across machine learning applications. With a strong dedication to math and computer science, she is enthusiastic about leveraging these disciplines to address real-world challenges. Before joining H2O, she served as a Senior Data Science Consultant at Teradata, working on high-impact analytics projects to tackle business issues across various industries. Michelle holds a B.A. in Mathematics and Computer Science from Ursinus College. In her downtime, she enjoys spending quality time with her family and expressing her creativity by playing the bass and ukulele. Join our AI Movement Join the Team Come join us to change the world in a meaningful way! Careers Become a Partner Learn how to become part of the H2O.ai partner network. Learn More'''
