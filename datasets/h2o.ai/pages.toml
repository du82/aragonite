full_description = "End-to-end GenAI platform built for air-gapped, on-premises or cloud VPC deployments. Own every part of the stack--own your data and your prompts. Connect any LLM/embedding model, fully scalable w/K8s, includes guardrails, summarization, cost controls, and customization options. Evaluation framework with automated testing, human calibration, bias detection, explainability, and failure analysis to boost compliance and risk control. No-code fine-tuning for custom enterprise-grade LLMs. Train scalable SLMs for cheaper, more efficient NLP use cases. Develop, deploy and share safe and trusted applications for your organization with use cases across enterprise, public sector, and more. Choose to deploy on-premise and airgapped, self hosted on VPC, or fully hosted and managed by H2O.ai. Learn how CBA is boosting AI capabilities to generate better customer and community outcomes, at greater pace and scale. Learn now IFFCO-Tokio uses the H2O AI Cloud to save over $1M annually by transforming their fraud prediction processes H2O.ai is recognized as a Visionary in 2024 Gartner® Magic Quadrant™ for Cloud AI Developer Services Since we've been fooling around with the MNIST data set quite a bit lately (Spence is using it in benchmarking), I've been following the leaderboard and methods for the ongoing Kaggle competition around the same data. It's really amazing to see what people come up with. But of course, the purpose of H2O is entirely that one need not devote days on end to finding clever tricks with limited generalizability to other predictive problems. So while Spence benchmarks speed, I made short work of a submission that let H2O do all of the heavy lifting, to get a sense of how we're doing on predictive power for real. In the time it took me to grab take-out and coffee H2O built a a model of 500 trees (on our server with 20g memory. It would take a bit longer on my computer with an allocation of less memory), generating a submission with less than 5% prediction error – all in all, not a bad lunch break."
