["https://h2o.ai/company/press-releases/bluedata-and-h2o-ai-partner-to-accelerate-ai-deployments"]
title = "BlueData and H2O.ai Partner to Accelerate AI Deployments"
description = "End-to-end GenAI platform built for air-gapped, on-premises or cloud VPC deployments. Own every part of the stack--own your data and your prompts."
full_description = "BlueData and H2O.ai Partner to Accelerate AI Deployments H2O and H2O Driverless AI on BlueData Ensure Faster Time-to-Value with Machine Learning London — November 13, 2018 — BlueData®, provider of the leading container-based software platform for AI and Big Data workloads, and H2O.ai, the open source leader in AI, today announced a partnership to accelerate AI and machine learning (ML) deployments. The collaboration includes integration of H2O.ai’s full suite of products – including open source H2O-3, H2O Sparkling Water for machine learning with Spark, and the automated H2O Driverless AI – with the container-based BlueData EPIC™ software platform. The result is a powerful combination to help customers rapidly deploy and scale their AI / ML environments, while ensuring enterprise-grade security and performance. BlueData and H2O.ai share many joint customers across multiple industries – including industry-leading organizations like Barclays, Citi, GM Financial, Optum, Macy’s, Seattle Children’s, and SCL Health. They use AI / ML for a variety of applications ranging from fraud detection and credit risk analysis, to genomics research and precision medicine, to improved customer experience, and more. The BlueData-H2O.ai partnership will enable these and other enterprise customers to realize the full potential of AI / ML, helping them to make mission-critical business decisions and deliver data-driven innovation. “Our mission is to democratize AI by putting automatic machine learning in hands of data scientists and engineers,” said Sri Ambati, CEO and founder of H2O.ai. “BlueData has built container-based innovations that provide secure on-demand access to distributed H2O environments and accelerating adoption across the enterprise. Together we can make it faster, cheaper, and easier for our customers to monetize their data.” The combination of BlueData with H2O.ai represents a game-changing solution for large-scale AI / ML deployments in the enterprise. Now these organization can get up and running quickly with distributed H2O machine learning environments at scale, in a multi-tenant architecture with a shared pool of resources for improved efficiency and reduced costs. They can operationalize their machine learning pipelines and deliver faster time-to-value for their AI initiatives — while ensuring security and high performance. With the BlueData EPIC software platform, data science teams can instantly spin up multi-node clusters for H2O Flow, Sparkling Water, and Driverless AI running on containers – whether on-premises, in the public cloud, or in a hybrid model. Through its App Store, BlueData EPIC provides pre-tested and pre-integrated Docker container images for distributed H2O environments. In just a few mouse clicks, users can have on-demand access to H2O’s best-in-class machine learning capabilities – using GPUs and/or CPUs for their containerized compute clusters. BlueData also offers a data connector to enable compute / storage separation for H2O. With BlueData, different containerized compute clusters for different workloads (including Spark, Kafka, Tensorflow, and/or H2O) can share access to a common data lake. This separation enables H2O users to easily connect their compute cluster to the data they need for large-scale distributed machine learning, while providing the ability to scale and optimize compute resources independent from data storage. The result is improved flexibility and resource utilization, along with reduced costs by eliminating data duplication and reusing existing storage investments. “Artificial intelligence and machine learning are at the top of the priority list for just about every CIO and CDO in every industry,” said Kumar Sreekanti, co-founder and CEO of BlueData. “Our partnership with H2O.ai will help these organizations to deliver faster time-to-value for their AI / ML initiatives across a wide range of use cases for business innovation and competitive differentiation. Working with H2O.ai, we can help simplify the deployment of advanced AI / ML technology and make it more readily accessible for teams of data scientists, engineers, and developers across the enterprise.” BlueData and H2O.ai will be at the Big Data LDN event this week in London, November 13-14. H2O.ai’s CEO and founder, Sri Ambati, will be giving a keynote presentation; BlueData will be giving a presentation in the AI Lab Theater. BlueData is also a silver sponsor at the event and attendees can view a demo of H2O machine learning running on the BlueData EPIC software platform at their stand (number 430). Supporting Resources BlueData + H2O.ai blog post: Distributed Machine Learning with H2O on Containers Video of BlueData session at H2O AI World London: https://youtu.be/dLfYjbWo9IA About BlueData Software, Inc. BlueData is transforming how enterprises deploy AI, Machine Learning, and Big Data Analytics. The BlueData EPIC™ software platform uses Docker container technology to make it easier, faster, and more cost-effective for enterprises to innovate with AI and Big Data technologies – either on-premises, in the cloud, or in a hybrid architecture. With BlueData, they can spin up containerized environments within minutes, providing data scientists with on-demand access to the applications, data, and infrastructure they need. Based in Santa Clara, California, BlueData was founded by VMware veterans and its investors including Amplify Partners, Atlantic Bridge, Dell Technologies Capital, Ignition Partners, and Intel Capital. To learn more about BlueData, visit www.bluedata.com or follow @bluedata. About H2O.ai H2O.ai is the open source leader in AI with a mission is to democratize AI for everyone. H2O.ai is transforming the use of AI with software with its category-creating visionary open source machine learning platform, H2O. More than 14,000 companies use open-source H2O in mission-critical use cases for Finance, Insurance, Healthcare, Retail, Telco, Sales and Marketing. H2O Driverless AI uses AI to do AI in order to provide an easier, faster and cost-effective means of implementing data science. In February 2018, Gartner named H2O.ai, as a Leader in the 2018 Magic Quadrant for Data Science and Machine Learning Platforms. H2O.ai partners with leading technology companies such as NVIDIA, IBM, AWS, Microsoft Azure and Google Cloud Platform and is proud of its growing customer base which includes Progressive Insurance, Walgreens and PayPal. For more information and to learn more about how H2O.ai is driving an AI Transformation for businesses with intelligence, visit www.h2o.ai. Press Contacts BlueData: Jordan Tewell, 10Fold 415.800.5379 bluedata@10Fold.com H2O.ai: Erika Kamholz, Bhava Communications 949.282.8560 press@h2o.ai"
