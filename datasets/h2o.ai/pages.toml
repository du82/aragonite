full_description = "H2O Privacy Policy Last Updated: June 20, 2022 H2O.ai, Inc. (“H2O”) knows that you care about how your personal information is used and shared, and we take your privacy seriously. Please read the following to learn more about our privacy practices (“Privacy Policy”). By using or accessing the H2O services, including our our SaaS-based data-processing services, or visiting www.h2o.ai, (collectively, the “Services”) in any manner you acknowledge that you accept the practices and policies outlined in this Privacy Policy, and you hereby consent that we will collect, use and share your information as described in this Privacy Policy. If you have a disability, you may access this Privacy Policy in an alternative format by contacting privacy@h2o.ai. CALIFORNIA RESIDENTS: If you are a California resident, please see the “PRIVACY INFORMATION FOR CALIFORNIA RESIDENTS” section below. European Union (EU), European Economic Area (EEA) and Switzerland Residents: If you are based in one of these jurisdictions, please see the “PRIVACY INFORMATION FOR EU, EAA, and SWITZERLAND RESIDENTS” section below. What Does This Privacy Policy Cover? This Privacy Policy covers H2O’s treatment of personally identifiable information (“Personal Information”) that H2O gathers when you access or use the Services and through other means such as our and our partner’s events, sales and marketing activities. “Personal Information” means any information that identifies or relates to a particular individual and also includes information referred to as “personal data” or “personal information” under applicable data privacy laws, rules or regulations. This Privacy Policy does not cover use of information by third parties we do not control. What Personal Information Does H2O Collect? We collect the following types of information from our end users: Information You Provide to Us: We collect any information you provide in relation to the Services. You provide information to us when you: search for, subscribe to, or purchase the Servicescreate or administer your H2O account (and you might have more than one account if you have used more than one email address when using the Services)register for or attend an H2O eventcommunicate with us by phone, email, or otherwisecomplete a questionnaire, a support ticket, or other information requestpost on H2O websites or participate in community featuresemploy notification services Depending on your use of the Services, you might supply us with such information as: your name, email address, physical address, phone number, and other similar contact informationpayment information, including credit card and bank account informationinformation about your locationinformation about your organization and your contacts, such as colleagues or people within your organizationusernames, aliases, roles, and other authentication and security credential informationcontent of feedback, testimonials, inquiries, support tickets, and any phone conversations, chat sessions and emails with or to usyour image (still, video, and in some cases 3-D), voice, and other identifiers that are personal to you when you attend an H2O event or use certain Servicesinformation regarding identity, including government-issued identification information Automatic Information: We automatically collect certain types of information when you interact with H2O Services. We collect information automatically when you: visit, interact with, or use the Services (including when you use your computer or other device to interact with the Services)download content from usopen emails or click on links in emails from usinteract or communicate with us (such as when you attend an H2O event or when you request customer support) Examples of the information we automatically collect include: network and connection information, such as the internet protocol (IP) address used to connect your computer or other device to the Internet and information about your Internet service providercomputer and device information, such as device, application, or browser type and version, browser plug-in type and version, operating system, or time zone settingthe location of your device or computerauthentication and security credential informationcontent interaction information, such as content downloads, streams, and playback details, including duration and number of simultaneous streams and downloadsService metrics, such as Service usage, occurrences of technical errors, diagnostic reports, your settings preferences, backup information, API calls, and other logsThe full Uniform Resource Locators (URL) clickstream to, through, and from our website (including date and time) and the Services, content you viewed or search for, page response times, download errors, and page interaction information (such as scrolling, clicks, and mouse-overs) Information from Other Sources: We might collect information about you from other sources, including service providers, partners, and publicly available sources. Examples of information we receive from other sources include: marketing, sales generation, and recruitment information, including your name, email address, physical address, phone number, and other similar contact informationsubscription, purchase, support, or other information about your interactions with products and services offered by us, our affiliates, or third partiessearch results and links, including paid listings (such as Sponsored Links) credit history information from credit bureaus Cookies We use cookies, pixels, and other similar technologies (collectively, “cookies”) to recognize your browser or device, learn more about your interests, provide you with essential features and services, and for additional purposes including: Recognizing you when you sign in to use our Services. This allows us to provide you with recommendations, display personalized content, and provide other customized features and services.Keeping track of your specified preferences. This allows us to honor your likes and dislikes, such as your language and configuration preferences.Conducting research and diagnostics to improve our Services.Preventing fraudulent activity.Improving security.Delivering content relevant to your interests on H2O sitesThis allows us to measure and analyze the performance of our Services. Some H2O cookies are deleted at the end of your browsing session, while others persist between sessions. Essential H2O cookies remain on your device for up to 365 days from your last visit to our site. Other H2O cookies remain on your device for up to 365 days from their last use. For more information on our cookie use and to manage your preferences, please visit our Cookie Preferences here. We may serve advertisements, and also allow third-party ad networks, including third-party ad servers, ad agencies, ad technology vendors and research firms, to serve advertisements through the Services. These advertisements may be targeted to users who fit certain general profile categories or display certain preferences or behaviors (“Interest-Based Ads”). Information for Interest-Based Ads (including Personal Information) may be provided to us by you, or derived from the usage patterns of particular users on the Services and/or services of third parties. Such information may be gathered through tracking users’ activities across time and unaffiliated properties, including when you leave the Services. To accomplish this, we or our service providers may deliver Cookies, including a file (known as a “web beacon”) from an ad network to you through the Services. Web beacons allow ad networks to provide anonymized, aggregated auditing, research and reporting for us and for advertisers. Web beacons also enable ad networks to serve targeted advertisements to you when you visit other websites. Web beacons allow ad networks to view, edit or set their own Cookies on your browser, just as if you had requested a web page from their site. Our Commercial or Business Purposes for Collecting Personal Information Providing, Customizing and Improving the ServicesCreating and managing your account or other user profilesProcessing orders or other transactions; billingProviding you with the products, services or information you requestMeeting or fulfilling the reason you provided the information to usProviding support and assistance for the ServicesImproving the Services, including testing, research, internal analytics and product developmentPersonalizing the Services, website content and communications based on your preferences.Doing fraud protection, security and debugging.Carrying out other business purposes stated when collecting your Personal Information or as otherwise set forth in applicable data privacy laws, such as the California Consumer Privacy Act (the “CCPA”). Marketing the ServicesMarketing and selling the Services.Showing you advertisements, including interest-based or online behavioral advertising. Corresponding with YouResponding to correspondence that we receive from you, contacting you when necessary or requested, and sending you information about H2O or the ServicesSending emails and other communications according to your preferences or that display content that we think will interest you Meeting Legal Requirements and Enforcing Legal TermsFulfilling our legal obligations under applicable law, regulation, court order or other legal process, such as preventing, detecting and investigating security incidents and potentially illegal or prohibited activitiesProtecting the rights, property or safety of you, H2O or another partyEnforcing any agreements with youResponding to claims that any posting or other content violates third-party rightsResolving disputes We will not collect additional categories of Personal Information or use the Personal Information we collected for materially different, unrelated or incompatible purposes without providing you notice. How does H2O use and share Personal Information