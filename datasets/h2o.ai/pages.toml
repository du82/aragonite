["https://h2o.ai/blog/2013/data-science-is-not-rocket-science"]
title = "Data Science is NOT Rocket Science | H2O.ai"
description = "End-to-end GenAI platform built for air-gapped, on-premises or cloud VPC deployments. Own every part of the stack--own your data and your prompts."
full_description = "End-to-end GenAI platform built for air-gapped, on-premises or cloud VPC deployments. Own every part of the stack--own your data and your prompts. Connect any LLM/embedding model, fully scalable w/K8s, includes guardrails, summarization, cost controls, and customization options. Evaluation framework with automated testing, human calibration, bias detection, explainability, and failure analysis to boost compliance and risk control. No-code fine-tuning for custom enterprise-grade LLMs. Train scalable SLMs for cheaper, more efficient NLP use cases. Develop, deploy and share safe and trusted applications for your organization with use cases across enterprise, public sector, and more. Choose to deploy on-premise and airgapped, self hosted on VPC, or fully hosted and managed by H2O.ai. Learn how CBA is boosting AI capabilities to generate better customer and community outcomes, at greater pace and scale. Learn now IFFCO-Tokio uses the H2O AI Cloud to save over $1M annually by transforming their fraud prediction processes H2O.ai is recognized as a Visionary in 2024 Gartner® Magic Quadrant™ for Cloud AI Developer Services Finding myself at 0x is a lot less like starting fresh in a new profession and more like choosing cultural expatriation – it is a whole new (beautiful) world. On my first day everyone spoke what I was relatively sure should be English, but it felt like they were actually speaking in their own dialect (which I’ve come to think of as Hexperanto). While the language barrier and nerd-up culture is intimidating, it’s not impossible. In fact, the infinite possibility comes across in a philosophy that Sri is fond of paraphrasing as “data science is not rocket science.” It’s not impossible, but it is a science. Just like physics, data science is how we derive functions that describe the world around us. Not everyone is going to question the world around them – but if they do, the challenge should lie in finding the answer, not being intimidated by asking the questions. So that’s my job here for now – to help ask questions. Because data science is not rocket science; this isn’t impossible. It’s aspirational. For me that means being able to talk about an approach to the world in language that makes intuitive sense to the curious, whether they’re rocket scientists, data scientists, social scientists, or just cultural expats (like me). It’s my goal to be rigorous, but not exclusionary. There is a good chance that from time to time I miss the mark (or get things wrong). When that happens, I would like to do better, so send me your questions to Irene [at] 0xdata.com"
