full_description = "Responsible Machine Learning Actionable Strategies for Mitigating Risks & Driving Adoption Get Report Now Overview What is Responsible AI? Explainable AI and the pursuit of using technology and statistical methods to explain Machine Learning models, quickly became a much larger question. Best practices in applying AI is not just a statistical question, but a people and process question as well, which forms the key elements of Responsible AI. In order to achieve maximum transparency and understanding of AI, it is imperative to address and understand the full view of models and their impact. There are six categories that comprise the most critical themes in Responsible AI: Explainable AI, Interpretable Machine Learning technology, Ethical AI, Secure AI, Human-Centered AI, and Compliance. The Importance of Responsibility The last few years have brought to light many failed cases of companies deploying AI without adequately considering or analyzing the risk of their models. In order to mitigate the risks of models overfitting, perpetuating historical human bias, or failing to adapt to data drift (among others), AI deployers should consider our core themes of Responsible AI: Explainable AI (XAI): The ability to explain a model after it has been developedInterpretable Machine Learning: Transparent model architectures and increasing how intuitive and understandable ML models can beEthical AI: Sociological fairness in machine learning predictions (i.e., whether one category of person is being weighted unequally)Secure AI: Debugging and deploying ML models with similar counter-measures against insider and cyber threats as would be seen in traditional softwareHuman-Centered AI: User interactions with AI and ML systemsCompliance: Making sure your AI systems meet the relevant regulatory requirements whether that’s with GDPR, CCPA, FCRA, ECOA or other regulations We’ve written a primer blog on key terms and ideas in Responsible AI to help define a list of critical industry terminology as we view them at H2O.ai with respect to our research and products. Read The Blog An Introduction to Machine Learning Interpretability Second Edition Download this book to learn to make the most of recent and disruptive breakthroughs in debugging, explainability, fairness, and interpretability techniques for machine learning. In this report you’ll find: Definitions and examples Social and Commercial Motivations for Machine Learning A Machine Learning Interpretability Taxonomy for Applied Practitioners Common Interpretability Techniques Limitations and Precautions Testing Interpretability and Fairness Machine Learning Interpretability in Action Get The Book Our Most Current Thoughts & Resources on Responsible AI Other Themes & Commonalities For Cross-Industry AI Read the Paper White Papers Machine Learning: Considerations for Fairly and Transparently… Read the White Paper Blog Brief Perspective on Key Terms and Ideas in Responsible AI Read the Blog Webinar Key Terms and Ideas in Responsible AI Watch the Webinar Other Responsible AI Overview Read Now Blog Summary of a Responsible Machine Learning Workflow Read the Blog Webinar Towards Responsible AI Watch the Webinar Other A Responsible Machine Learning Workflow with Focus on… Read the Paper Other Proposed Guidelines for the Responsible Use of… Read the Paper Blog Mitigating Bias in AI/ML with Disparate Impact Analysis Read the Blog"
