["https://h2o.ai/platform/ai-cloud/key-features-datasheet"]
title = "Key Features of The H2O AI Cloud | H2O.ai"
description = "End-to-end GenAI platform built for air-gapped, on-premises or cloud VPC deployments. Own every part of the stack--own your data and your prompts."
full_description = 'Key Features of H2O AI Cloud The H2O AI Cloud solves complex business problems and accelerates the discovery of new ideas with results you can understand and trust. Our comprehensive automated machine learning (autoML) capabilities transform how AI is created and consumed. We have built AI to do AI, making it easier and faster to use, while still maintaining expert levels of accuracy, speed and transparency. We deliver on our mission to democratize AI by moving people from idea to impact with the confidence to make, operate and innovate with AI on the H2O AI Cloud. Download the Datasheet Agility and transparency around the creation and use of AI solutions ensure a cycle of continuous learning and innovation. Enhanced cross-team collaboration improves the overall quality of results, as well as the effectiveness of responses to evolving circumstances and new insights. Personas Make Operate Innovate Request Demo Data Scientists Advanced autoML capabilities encompass the entire data science lifecycle, optimizing workflows to increase both the quantity and quality of data science projects delivered to business stakeholders. Robust features for machine learning interpretability and operations give you seamless control over the entire explainability pipeline, resulting in higher accuracy, increased transparency and faster response times to changing circumstances. Developers Automatic conversion of deployment artifacts from Python/R to Java/C++ simplifies the handoff of projects between data science teams and developers, and provides seamless integration of AI capabilities into existing solutions. Our open-source, low code development framework provides flexibility to work with all major libraries and frameworks and accelerates the creation of new AI applications. Machine Learning Engineers Guarantee that deployed models are operating as intended with comprehensive model monitoring features designed to support both H2O.ai and third party models. The H2O AI Cloud’s comprehensive model management capabilities are accessible through a visual interface or an API. DevOps and IT Professionals The H2O AI Cloud provides high performance computing with full NVIDIA RAPIDS integration. Easily scale workloads with support for the unprecedented compute and network acceleration of Ampere-based NVIDIA GPUs and latest CUDA runtime. Monitor system usage and provide metrics for resource monitoring and autoscaling of multi-node clusters through our platform performance API. Business Users The AI AppStore makes it easy and intuitive for business users to find and access AI applications that are custom built to meet your unique business needs. These solutions are powered by robust machine learning models and provide real-time insights for data driven decisions. Make. H2O.ai built AI to do AI. With industry-leading automated machine learning (autoML), the H2O AI Cloud gives users more accuracy, speed and transparency throughout the entire machine learning lifecycle, including in the development and deployment of AI applications. Feature Transformation Automatically visualize and address data quality issues with advanced feature engineering that transforms your data into an optimal modeling dataset. Data Intelligence Data visualization Visually display interesting statistical properties of your dataset and expose unexpected data quality issues like outliers, correlations or missing values. Automatic data insights Visual and text descriptions for automatically detected trends and insights including topics in text, correlations, and outliers. Pre-processing transformers Automatically include custom data preparation as part of your final deployed machine learning pipeline. Dataset splitting Save time and improve validation with a variety of built-in splitting techniques, including splitting randomly, by time, with stratification and with full customization via live code. Missing value handling Produce higher accuracy and better generalization with end to end support for missing values in all parts of the machine learning pipeline. Outlier detection Expose issues or irregularities in data with better accuracy delivered through various proprietary algorithms. Feature Engineering Automated feature engineering Increase accuracy and ROI with our proprietary feature engineering that automatically extracts non-trivial statistical information from your data. Feature encoding Convert mixed data types (numeric, categorical, text, image, date/time, etc.) in a single dataset for use by machine learning algorithms. Feature transformation recipes Apply your domain knowledge to refine automated feature engineering outputs with fully customizable Python recipes. Per-Feature Controls Disable feature engineering and feature selection for certain columns in your dataset, and pass them as-is to the model to satisfy your compliance requirements. Automated validation and cross validation Improve accuracy, robustness and generalization with a multitude of proprietary validation techniques, statistical methods and moving windows. Feature Store Data pipeline and integrations Consistent and unified storage for features and feature metadata allow data scientists to have access to the latest, best features. Categorization and search Metadata on the available feature sets allows users to find the features they need for each dataset. Projects and tags allow users to identify features which are commonly used together to improve their model. Governance and access management Versioned features ensure that a model trained on a specific combination of features will always lead to the same results. Machine Learning Quickly create and test highly accurate and robust models with state-of-the-art automated machine learning that spans the entire data science lifecycle and can process a variety of data types within a single dataset. Automated Machine Learning (autoML) AutoML is pervasive across the entire H2O AI Cloud. Powering everything from feature transformation to model selection, monitoring and deployment, robust autoML capabilities are the engine behind our ability to deliver AI that does AI. Automated feature selection (dimensionality reduction) Reduce model complexity, produce faster inference time and better model interpretability with a multitude of proprietary feature selection techniques that automatically select the most predictive features for your dataset. Automatic Feature Engineering Increase accuracy and ROI with our proprietary grandmaster-level feature engineering that automatically extracts predictive statistical information from your data for highest accuracy and for gaining actionable insights into the causal nature of the data. Hyperparameter Autotuning Increase accuracy, ROI and time savings with optimization across all components of the machine learning modeling pipeline delivered through a mix of our proprietary, genetic algorithm, Monte Carlo, Particle Swarm and Bayesian methods. Champion/Challenger model selection Speed up testing and validation with autoML that finds the best combination of features and models and automatic selection of the best machine learning model to fit your dataset. Model ensembling Multiple levels of both fully automatic and easily customizable ensembling to increase accuracy and ROI. Automatic label assignment Reduce error rates and save time with automatic labeling that predicts the class for every scored record, in addition to returning the per-class probabilities. Automated model documentation Provide insight into the machine learning process with automatically generated documentation that describes the experiment process, model tuning results, variable importance, model importance, model performance and detailed settings for reproducibility Machine learning interpretability (MLI) AutoML powers a robust MLI toolkit to include explanations, visualizations and customizations. Model validation Assess model robustness and mitigate risks in production by obtaining a holistic view of the models and preventing failures on new data. Unsupervised automatic machine learning Immediately get new insights on your unlabeled data with unsupervised techniques such as clustering to automatically group topics, outlier detection to identify irregularities in your data, and dimensionality reduction to reduce model overfitting and complexity. Wide dataset handling Handle datasets with millions of columns with GPU acceleration. Imbalanced dataset handling Improve the accuracy in imbalanced use cases with access to special, proprietary algorithms which emphasize accuracy of rare classes over the more frequent but less valuable classes. Model leaderboards Speed up model development, model selection and model validation with automatic leaderboards comparing best-of-breed autoML modeling approaches. Time Series Forecasting Easily fit and solve forecasting problems with unique feature engineering and autoML capabilities specifically designed to handle time series data. Diagnostics Automatically show model performance across groups and how predictions were generated with the ability to build forecasts across many categories (individuals skus, product hierarchy, etc.). Leaderboard for forecasting Save time getting an optimized forecasting model with a new leaderboard mode specific to time series experiments. Automatically design and run multiple experiments with varying amounts of pairs (train-test gap, forecast horizon, etc.) to help with model selection. Time series machine learning interpretability Time series models work with various MLI explainers, including Sensitivity Analysis, Disparate Impact Analysis, Partial Dependence/Individual Conditional Expectation, Naïve and Kernel Shapley, Surrogate Models and all feature importance techniques. Natural Language Processing (NLP) Extract insights from unstructured text data to discover trends, create more accurate and relevant information retrieval and create personalized recommendations. Text preprocessing Remove noise from text and improve downstream NLP tasks by creating a pipeline of preprocessing techniques like stop word removal, stemming/ lemmatization, emoji extraction and more. Text classification Tag and categorize similar terms and concepts with a range of supported algorithms from simplistic TFIDF to state-of-the-art BERT transformers. Topic clustering Gain insights for emerging trends and early detection of rising problems by automatically extracting relationships in text, with the option to fine tune clusters with human feedback to improve model accuracy. Named Entity Recognition (NER) Categorize terms into common groupings such as people, places, organizations, dates, currency and more. Sentiment analysis Detect trends in perspectives regarding specific topics such as products and services by identifying positive, negative and neutral connotations. NLP machine learning interpretability Understand how token importance varies between classes with newly added multinomial support. Understand the impact of tokens on outcomes with LOCO (leave one covariate out) 2.0 and Vectorizer + Linear Model (VLM). Calculate the average outcome of a model when a text token is included versus not included with Partial Dependence for Text Tokens. Select between TF-IDF or the newly added Vectorizer + Linear Model (VLM) when it comes to generating tokens for Surrogate models. Computer Vision Use image data for modeling with the ability to combine additional data types with your image data to include text, tabular and audio data. Image processing Recognize objects in images and categorize them with high accuracy using all the latest convolutional neural networks (CNNs) out of the box with GPU accelerated training. Video processing Input videos are automatically transformed into a set of frames, which are then handled using image processing capabilities. Audio processing Input audio data is automatically transformed into MEL-spectrograms, which are then handled using image processing capabilities. Explanations for computer vision models Understand what part of an image or video led to a specific prediction using techniques such as Grad-CAM Explainable AI Easily understand the ‘why’ behind model predictions to build better models and provide explanations of model output at a global level (across a set of predictions) or at a local level (for an individual prediction) White Box Models Generalized Linear Models (GLM) GLMs are an extension of traditional linear models. They are highly explainable models with the flexibility of the model structure unifying the typical regression methods (such as linear regression and logistic regression for binary classification). Generalized Additive Models (GAM) A GAM is a Generalized Linear Model (GLM) in which the linear predictor depends on predictor variables and smooth functions of predictor variables. Generalized Additive Models with two-way interaction terms (GA2M) GA2M is an extension of GAM which selects the most important interactions between features and includes functions of those pairs of features in the model." Explainable neural networks (XNN) These neural networks consist of numerous subnetworks, each of which learns an interpretable function of the original features. Rulefit This algorithm fits a tree ensemble to the data, builds a rule ensemble by traversing each tree, evaluates the rules on the data to build a rule feature set, and fits a sparse linear model (LASSO) to the rule feature set joined with the original feature set. Available in Driverless AI by default. Skopes Rules This algorithm learns a simple set of rules for performing classification. Decision tree and linear model combination This model segments the data using a decision tree and then fits a GLM to the data at each leaf node. Interpretability Methods Partial Dependence Plot (PDP) Plot that shows how a column affects predictions at a global level, with the ability for users to explore columns and how they affect predictions. Feature importance Calculate which features are important for the model’s decision making, both naive and with transformed features. Shapley reason codes Provide model explainability at a record level for non-linear models for global and individual records. Surrogate Decision Trees Identify the driving factors of a complex model’s predictions in a very simple, visual and straightforward ways. Leave One Covariate Out (LOCO) Identify features that are important to the Surrogate Random Forest predictions from an aggregated or row level view. Individual Conditional Expectation (ICE) Plot that shows how a column affects predictions at an individual level, with the ability to drill down to any row of choice and compare/contrast with average partial dependence. k-LIME reason codes Generate novel reason codes at a record level, subsets of the dataset or at an aggregated level for the entire dataset. Bias Detection Disparate Impact Analysis Identify areas in your data where a model shows b'
