title = "Hey good looking; Visualization and Data Mining 1 | H2O.ai"
description = "End-to-end GenAI platform built for air-gapped, on-premises or cloud VPC deployments. Own every part of the stack--own your data and your prompts."
full_description = "End-to-end GenAI platform built for air-gapped, on-premises or cloud VPC deployments. Own every part of the stack--own your data and your prompts. Connect any LLM/embedding model, fully scalable w/K8s, includes guardrails, summarization, cost controls, and customization options. Evaluation framework with automated testing, human calibration, bias detection, explainability, and failure analysis to boost compliance and risk control. No-code fine-tuning for custom enterprise-grade LLMs. Train scalable SLMs for cheaper, more efficient NLP use cases. Develop, deploy and share safe and trusted applications for your organization with use cases across enterprise, public sector, and more. Choose to deploy on-premise and airgapped, self hosted on VPC, or fully hosted and managed by H2O.ai. Learn how CBA is boosting AI capabilities to generate better customer and community outcomes, at greater pace and scale. Learn now IFFCO-Tokio uses the H2O AI Cloud to save over $1M annually by transforming their fraud prediction processes H2O.ai is recognized as a Visionary in 2024 Gartner® Magic Quadrant™ for Cloud AI Developer Services I recently came across an article by Shaw et al, in Decision Support Systems (1). The article discussed the importance of data mining and information management to good customer relationship management in increasingly competitive markets. A key point of the paper that I agree with is the importance of heuristics in data mining, particularly in markets where domain specific information is critical to data interpretation. Slick, beautiful graphic presentations of results get a lot of love. The tools used for data mining get less attention, but are pretty important to analysts. Instead of the traditional list and review of tools, I’ve taken the 1million observation Movielens data set, and produced some visualizations that are meant to just ask some basic questions of the data, as part of a first pass in the exploratory process. This is just the start in a series of posts. Over the next couple of weeks I hope to cover some of the most useful (and straightforward) tools in ggplot2 and lattice to analyze the Movielens data produced by Group Lens. There are other tools out there, but these are two of the most common, and the examples here should be easy to reproduce."
