full_description = "H2O.ai brings AutoML to Equifax Ignite with Driverless AI Integration will enable users of Equifax Ignite to easily build and deploy machine learning models MOUNTAIN VIEW, Calif. – October 8, 2020 – H2O.ai, the open source leader in artificial intelligence (AI) and machine learning (ML), today announced the availability of H2O AutoML and Driverless AI within Equifax Ignite®. H2O is a leading open-source AI platform, and its Driverless AI is a leading automatic machine learning (AutoML) platform that will enable users of Equifax Ignite to easily build and deploy machine learning models. H2O Driverless AI automates time-consuming machine learning workflows with automatic feature engineering, model tuning, and model selection to achieve the highest predictive accuracy within the shortest amount of time. Equifax Ignite allows users to create analytical insights via end-to-end Equifax solutions or through modular microservices that support their existing technology platforms and workflows. “For years, our customers in financial services, retail, and healthcare have been leveraging Equifax differentiated data with H2O machine learning, and it was only a matter of time before we integrated best-in-class H2O AutoML and Driverless AI into the Equifax environment,” said Sri Ambati, CEO of H2O.ai. “The Equifax Ignite customer community can now leverage these industry-leading solutions to make better predictions and better adapt in today’s fast-changing business climate.” H2O is a fully open-source, distributed in-memory machine learning platform with linear scalability. It supports the most widely used statistical and machine learning algorithms including gradient boosted machines, generalized linear models, deep learning and more. “Over the years, our data science experts have harnessed the power of artificial intelligence for insightful and transparent client experiences,” said Prasanna Dhore, Chief Data & Analytics Officer at Equifax. “Helping businesses apply machine learning with technical sophistication and ease is a goal we share with H2O.ai, and we’re excited to make their Driverless AI available to our Ignite community.” H2O Driverless AI can ingest data from a variety of data sets and can be deployed everywhere, including all cloud and on-premise environments. About H2O.ai H2O.ai is the open source leader in AI and automatic machine learning with a mission to democratize AI for everyone. H2O.ai is transforming the use of AI to empower every company to be an AI company in financial services, insurance, healthcare, telco, retail, pharmaceuticals and marketing. More than 20,000 companies and quarter million data scientists trust H2O to do their data science and machine learning. H2O Driverless AI, an award-winning and industry-leading automatic machine learning platform for the enterprise, is helping data scientists across the world in every industry be more productive and deploy models in a faster, easier, and cheaper way. H2O.ai has been recognized as a Visionary in the 2020 Magic Quadrant for Cloud AI Developer Services. Learn more at www.H2O.ai About Equifax Inc. At Equifax (NYSE: EFX), we believe knowledge drives progress. As a global data, analytics, and technology company, we play an essential role in the global economy by helping financial institutions, companies, employees, and government agencies make critical decisions with greater confidence. Our unique blend of differentiated data, analytics, and cloud technology drives insights to power decisions to move people forward. Headquartered in Atlanta and supported by more than 11,000 employees worldwide, Equifax operates or has investments in 25 countries in North America, Central and South America, Europe, and the Asia Pacific region. For more information, visit Equifax.com H2O.ai Media Contact: Russ Castronovo press@h2o.ai 408-391-9632"
