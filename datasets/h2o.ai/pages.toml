ere [4] . This methodology was previously shown to produce very low error rates when predicting on the test data (less than one-tenth of one percent in all cases). Tests were performed on an Amazon EC2 instance. Since individual runs in EC2 can experience variability, each configuration was run 10 times. The graphs in the “Speed” section below show box plots for each configuration (each box represents 10 runs)."
