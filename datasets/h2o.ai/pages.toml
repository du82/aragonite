full_description = "End-to-end GenAI platform built for air-gapped, on-premises or cloud VPC deployments. Own every part of the stack--own your data and your prompts. Connect any LLM/embedding model, fully scalable w/K8s, includes guardrails, summarization, cost controls, and customization options. Evaluation framework with automated testing, human calibration, bias detection, explainability, and failure analysis to boost compliance and risk control. No-code fine-tuning for custom enterprise-grade LLMs. Train scalable SLMs for cheaper, more efficient NLP use cases. Develop, deploy and share safe and trusted applications for your organization with use cases across enterprise, public sector, and more. Choose to deploy on-premise and airgapped, self hosted on VPC, or fully hosted and managed by H2O.ai. Learn how CBA is boosting AI capabilities to generate better customer and community outcomes, at greater pace and scale. Learn now IFFCO-Tokio uses the H2O AI Cloud to save over $1M annually by transforming their fraud prediction processes H2O.ai is recognized as a Visionary in 2024 Gartner® Magic Quadrant™ for Cloud AI Developer Services In this double header we present a practitioners close view of the science and an engineer’s close view of design and implementation of distributed algorithm. Day in the Life of a Data Scientist – Chris Pouliot In this session, Netflix analytical leader Chris Pouliot shares his experience building a large team of data scientists at Netflix and what a typical day in life of a Data Scientist looks like. From extracting and exploring data to posing good questions around them and matching them with the right algorithms, Chris goes through the lifecycle of data science in practice. Chris built a central, horizontal team for the company that spans across all business verticals. Chris shares insights and stories, covering pitfalls and successes and impact they have at Netflix. Distributed Generalized Linear Modeling (GLM) – Tomas Nykodym In this session, 0xdata engineers, Tomas Nykodym & Cliff Click explain how to build a Distributed GLM (Logistic, Poisson Regression .) Generalized_linear_model is the most popular tool at the hand of a good datascientist. A couple of very powerful mathematical approaches such as Stephen Boyd’s ADMM and Generalized Gradients are analyzed along with implementation choices. Live Demo and performance comparisons between the two approaches and on applications on Big Data will be presented."
