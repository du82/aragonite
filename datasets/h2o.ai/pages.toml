full_description = '''H2O.ai Makers Our people are our gold. Aakash Nain Aakash Nain Self-taught Data Scientist with a keen interest in Deep Learning. In absolute love with Python, Computer Vision, and open-source. Maintainer of the TensorFlow addons package, contribute to TensorFlow and Keras. Always open to discuss Computer Vision and API designs for machine learning frameworks. Achraf Merzouki Achraf Merzouki Computer engineer and maker, Achraf likes working with new technologies, designing and creating new products, also likes building automation to streamline the software development process. On his free time Achraf paints on canvas and play basketball. Adam Valenta Adam Valenta Hello, my name is Adam Valenta. I am a Software Engineer at H2o.ai. Recently, I have obtained a master's degree in Data Science from the Czech Technical University. I have started to cooperate with H2O.ai in my last year at university to create my master theses aimed at Anomaly detection using Extended Isolation Forest under the supervision of Veronika Maurerová from H2O.ai. Our successful cooperation leads me to the company. I also have a bachelor's degree in Software Engineering, and I would love to connect those two fields at the H2O by creating brilliant software for data scientists. Before H2O.ai, besides my studies, I worked as a half-time Java Developer for a mid-size company where we supplied IT services for various European businesses. In my spare time, I like to do something complementary to working at the office. I am always up for all kinds of sports. Currently, it is jogging. I want to attend Army Run in the Czech Republic next year. I am also interested in cooking, homebrewing, motorbikes, traveling, and taking care of our summer house with my family. Finally, if I am too lazy, I am a big fan of good movies, TV shows, or computer games. Akshaya Ganesan Akshaya Ganesan Akshaya is a Chartered Accountant and Cost accountant from Chennai, India. Prior to H2O she used to work for Ernst & Young. She has close to 8 years of experience in the Audit and Finance domain. Aman Kalia Aman Kalia Aman is based out of Bangalore, India and will be joining from Cloudera. He has experience with Linux, Hadoop, Security, etc. Aman is an avid biker and loves to travel. In his free time he also likes playing Cricket, Badminton, and Table tennis. Ana Castro Ana Castro Ana is a Data Science Evangelists for H2O.ai. Before H2O.ai, she worked as an Evangelist for Hortonworks(Cloudera). She holds a B.S. in Electrical Engineering and is currently pursuing a Master in Statistics with a concentration in Machine Learning at San Jose State University. When not at H2O.ai or school, she can be found in Fresno working with farmers to identify ML solutions for their agricultural challenges. Anmol Bal Anmol Bal Anmol has a operations and build/test background. In the past he has worked with small digital agency and a global marketing and advertising company. Anmol likes being the in-between person with operations, QA and engineers. He loves learning new things and always tries to expand his knowledge of everything. In his spare time Anmol likes to go on adventures and work on anything with two wheels bicycles and motorcycles. Arno Candel Arno Candel Arno Candel is the Chief Technology Officer at H2O.ai, where he has been the main committer of the industry-leading machine learning and data science platforms H2O-3 and H2O Driverless AI since joining the company in 2014. Previously, he spent a decade in supercomputing at ETH and Stanford Linear Accelerator Center and collaborated with CERN on next-generation particle accelerators. Arno holds a PhD and Masters summa cum laude in Physics from ETH Zurich, Switzerland. Arno was named "2014 Big Data All-Star" by Fortune Magazine and featured in ETH GLOBE in 2015 and WIRED in 2017. Connect with him on Twitter @ArnoCandel. Ashrith Barthur Ashrith Barthur Ashrith is the security scientist designing anomalous detection algorithms at H2O. He recently graduated from the Center of Education and Research in Information Assurance and Security (CERIAS) at Purdue University with a PhD in Information security. He is specialized in anomaly detection on networks under the guidance of Dr. William S. Cleveland. He tries to break into anything that has an operating system, sometimes into things that don’t. He has been christened as “The Only Human Network Packet Sniffer” by his advisors. When he is not working he swims and bikes long distances. Ben Scheiner Ben Scheiner Ben is a Senior Software Engineer based in Portland, Oregon. He has extensive experience developing web apps at scale, creating interactive dashboards, and building human-robot interfaces. Ben is passionate about open source software and user-driven design. His hobbies include Ultimate Frisbee, improv, and adventures in the Pacific Northwest. Betty Candel Betty Candel Betty is the vice president of marketing at H2O.ai. She brings more than 20 years of experience leading GTM and product marketing at companies including Bolt Payments, DigitalOcean and Gemalto. Branden Murray Branden Murray Bruna Smith Bruna Smith Bruna is a Field Marketing Manager for Latin America at H2O.ai. She is a passionate professional with 10 years of experience, ranging from Internal/Corporate Communication to Marketing and Social Media. Prior to joining H2O.ai, Bruna worked as a Senior Communication Analyst for several years at the largest telco in Brazil and one of the top 3 in Latin America. Bruna holds a Master’s Degree in Strategic Communication at the University of San Francisco (USF) and a Bachelor’s Degree in Social Communication at PUC-Rio. Cody Harris Cody Harris Daniela Ramos S Daniela Ramos S Daniela is an illustrator and visual designer with experience in Branding, Product Packaging Design, Illustration, Print Collateral, Motion Graphics, and more. She has previously worked for Costa Rican companies such as Britt (a leading worldwide coffee house and retail store) where she gained extensive experience in product packaging design. From beautiful Costa Rica, Pura Vida, Daniela earned her B.A. in Fine Arts with an emphasis in Graphic Design at the Universidad de Costa Rica. When she is not drawing or designing, Daniela enjoys spending time with her family and friends. Dmitry Gordeev Dmitry Gordeev I am a Senior Data Scientist at H2O.ai and a Kaggle Competitions Grandmaster (https://www.kaggle.com/dott1718) with a record of winning multiple competitions and reaching top 5 overall ranking. I graduated with honours from the the Moscow State University with a degree in Data Mining and have more than 10 years of experience of machine learning applications in banking risk management and insurance. On Kaggle I am focusing on wide range of topics and problems, holding gold medals in classic machine learning, as well as natural language processing, deep learning and time series competitions. In my spare time I enjoy doing sports, like football, hiking, archery, as well as occasionally playing video games and watching movies. You can find me on LinkedIn (https://www.linkedin.com/in/dmitry-gordeev-50116023/) and follow me on Twitter (https://twitter.com/dott1718) Dulaj Atapattu Dulaj Atapattu Dulaj is a Full Stack Engineer at H2O. He has good experience in building end to end e-commerce solutions with modern technologies. Passionate coder and a DevOps also. Likes to watch movies in his free time and enjoys travelling too. Edgar Orendain Edgar Orendain A Software Engineer, Edgar studied Computer Science at UC Berkeley. Before H2O, Edgar was a Lead Software Engineer building high-performance microservices in Scala. He engineered data pipelines at Hortonworks and was the architect of the company's new generation of data platform environments for the desktop. When not glued to one of his machines, he can be found volunteering, playing board games or D&D, or on a mission to find the best nachos in town. Fatih Ozturk Fatih Ozturk atih graduated from Boğaziçi University, Turkey in 2017 and obtained his BSc degree studying Industrial Engineering. Prior to H2O, he worked in a startup and leveraged machine learning algorithms mostly for insurance related projects. He joined his first Kaggle competition on Sep,2017 and while improving his Data Science skills he also reached Competition Grand Master title on Oct,2019. Besides Data Science and Kaggling, he loves traveling, shooting photos and videos, and also editing them. Gabriela Onufrakova Gabriela Onufrakova Office Manager Greg Fousas Greg Fousas Greg is a data scientist with work experience that spans more than 20 projects, 15 brands, 5 industries and 5 countries and still counting! You could call him “the multi-tool” and please do, as he’s desperate for this nickname to catch on. He studied Production Engineering and Management, he has a MSc in Operational Research from the University of Edinburgh and studied a bit of Cognitive Science. Recently he completed a self driving car nanodegree. Greg also runs an amateur online Python course entitled “your 10 minutes of Python per day” and is happy to be able to call Scotland home. Due to an injury, this is the first time -since his toddler years- that Greg is not playing basketball. He’s channeling all this extra energy into his work projects. So beware! Guanshuo Xu Guanshuo Xu Guanshuo Xu is now a Data Scientist at H2O.ai. He is a Kaggle Competitions Grandmaster. In his Kaggle profile (https://www.kaggle.com/wowfattie), you can find more information about his current and past Kaggle competition achievements. Guanshuo also holds a PhD in Electrical Engineering focused on machine learning based image forensics and steganalysis. His methods for real-world image tampering detection and localization won the second place in the First IEEE Image Forensics Challenge. And his architectural design of deep neural networks outperformed traditional feature-based methods for the first time in image steganalysis. Hemen Kapadia Hemen Kapadia Hemen is a senior solution architect in the customer success team. He focuses on providing technical solutions for customer’s problems using H2O.ai’s products. Additionally, he also works on adding customer requested features to the Driverless AI product. Before joining H2O, Hemen was working for customers like Adobe and HP in various software development and solution/project delivery positions. Hemen completed his Bachelors in Computer Engineering from University of Mumbai. Hemen has a passion for creating tools and believes in sharing them with larger community, Getbhavcopy (www.getbhavcopy.com) is one of the tools widely adopted in India for downloading daily data from Indian stock exchanges for technical analysis. During his free time Hemen enjoys spending time with his family, mostly cooking something special on weekends and spending time reviewing his daughter’s school homework while keeping himself informed of the latest in the field of technology. Hasith Perera Hasith Perera I’m a Senior DevOps Engineer from Sri Lanka. Prior to joining H2O.ai, I have worked in Sysco Labs which is the technology arm of a global food service company called Sysco based in the USA. I earned my B.Sc. Degree in Electronics and Telecommunication Engineering from the University of Moratuwa. I’m interested in Cloud technologies & Process automation stuff while learning new things. I love to spend my leisure time with family members and friends, Go on trips with them and also I like to enjoy watching cricket matches and music. Jakub Hava Jakub Hava Jakub (or “Kuba” as we call him) completed his Bachelor’s Degree in Computer Science and Master’s Degree in Software Systems at Charles University in Prague. As a bachelor’s thesis, Kuba wrote a small platform for distributed computing of any types of tasks. During his master’s degree studies, he developed a cluster monitoring tool for JVM based languages which makes debugging and reasoning the performance of distributed systems easier using a concept called distributed stack traces. Kuba enjoys dealing with problems and learning new programming languages. At H2O.ai, Kuba works on Sparkling Water. Aside from programming, Kuba enjoys exploring new cultures and bouldering. He’s also a big fan of tea preparation and the associated ceremony. Jan Gamec Jan Gamec Jan Sýkora Jan Sýkora Jan is a Software Engineer at H2O.ai. His main focus is on back-end development. He has experience with graph database development, big data processing and web application development in multiple domains such as banking, healthcare or pharmacy. Jan has studied informatics at Czech Technical University in Prague where he graduated from Web and Software Engineering with Master's degree. Jan has also spent one year abroad in the US where he worked and studied. In his spare time Jan likes to do sports, traveling and explaining to non-Czech speaking people why "Jan" and "Honza" are the same names but different at the same time. Joby Joy Joby Joy Jon Mckinney Jon Mckinney Jorge Luis Hernandez Villapol Jorge Luis Hernandez Villapol Jorge Luis Hernandez Villapol, is a Software Engineer and Data Scientist at H2O. He comes from an Electronics Engineering background where the passion and excitement from the Mechatronics and Robotics field led him to AI and Intelligent Systems. He has a M.S. in Electrical Engineering from UNT and a Bachelor’s Degree in Electronics Engineering from the Simon Bolivar University (USB) in Caracas, Venezuela. Like many engineers, Jorge loves challenges and groundbreaking problems to solve. He also enjoys watching and traveling to sports events (F1, Soccer, Tennis) and the casual gaming sessions. Josephine Wang Josephine Wang Josephine Wang is the Head of Customer Experience at H2O, makers of H2O, the open source math and machine learning engine for big data. Josephine has 20 plus years experience and success in sales and customer relationship building. She is responsible for all new business development and management of client services for H2O. Prior to H2O, Josephine held key roles at Teradata and SAS where she acquired her passion for analytics and big data. Previously, Josephine specialized in corporate governance and risk management at ISS and SunGard. She began her career in private client services at Bear Stearns and Co. in New York and holds a BS in Finance from the University of Delaware. Justin Bell Justin Bell Justin will be assisting in leading the migration of our marketing website (H2O.ai) onto a newer web platform called Adobe Experience Manager (AEM). He is joining us from Digital On Six, a digital agency and Adobe Implementation Partner specializing in enterprise web development. Justin has always lived in the Niagara Falls and Toronto area, as well as earning his HBSc in Computer Science and Mathematics at the University of Toronto. As passionate as he is about all things Toronto, including the sports teams, he has not forgotten his roots and will always identify as the '''
