full_description = "Meet our Kaggle Grandmasters Expertise from around the world helping our customers At H2O.ai we are incredibly proud that 24 of the world’s 400+ total Kaggle Grandmasters call H2O home, including three Kaggle Grandmasters who have made it to world #1. Branden Murray Branden Murray Grandmaster Competitions Branden’s focus is on applying machine learning to a wide variety of problems. He works on the machine learning and data science behind H2O.ai’s award-winning applications in collaboration with PwC. Branden graduated from San Diego State University with a B.S. in Finance. Before joining H2O he did business intelligence reporting and analytics in the home warranty industry. Follow me Dmitry Gordeev Dmitry Gordeev Grandmaster Competitions Dmitry’s focus areas are machine learning, as well as natural language processing, deep learning and time series competitions. Dmitry graduated with honours from Moscow State University with a degree in Data Mining and has 10+ years of experience with machine learning applications in banking risk management and insurance. Follow me Fatih Ozturk Fatih Ozturk Grandmaster Competitions Fatih’s focus areas are structured datasets, feature engineering, ML modeling and validating. Fatih graduated from Boğaziçi University, Turkey in 2017 and obtained his BSc degree studying Industrial Engineering. He worked in a startup and leveraged machine learning algorithms mostly for insurance related projects. Follow me Gabor Fodor Gabor Fodor Grandmaster Competitions Discussions Gabor’s focus areas are feature engineering, machine learning, time-series forecasting and audio classification. Gabor holds two master's degrees in Mathematics and Computer Science from Budapest University of Technology and Economics. He has ten years of experience in data analysis and data science. Follow me Mark Landry Mark Landry Grandmaster Competitions Mark has provided data science support on several H2O.ai products as well as led the data science behind the award-winning applications in collaboration with PwC. Mark's prior experience includes data science, business intelligence, and data warehousing roles within health care, hospitality, and manufacturing companies. Follow me Philipp Singer Philipp Singer Grandmaster Competitions Discussions Philipp loves utilizing his passion and skills in machine learning, statistics, and data science in order to enable data-driven decision making and he is always eager to delve into new bleeding-edge fields and technologies. His top area of focus is deep learning and its applications to areas such as computer vision. Philipp obtained a Ph.D. in computer science with honors at the Technical University of Graz where he also finished his Master’s in Software Development and Business Management. He has been published in seminal conferences and journals, and has year-long experience in applied machine learning. Follow me Shaikat Galib Shaikat Galib Grandmaster Competitions Shaikat’s focus areas are detection, classification, segmentation on 2D and 3D images and natural language processing. Shaikat has both a Masters Degree and a PhD in Nuclear Engineering from Missouri University. Follow me Rohan Rao Rohan Rao Grandmaster Discussions Notebooks Competitions Datasets Rohan enjoys architecting machine learning solutions particularly within the personalization and recommendations space through user-facing products and constantly aims to simplify user experience with various technologies. Rohan completed his MSc in Applied Statistics from IIT-Bombay. He has 7+ years of experience building machine learning products and solutions across various industries. Follow me Shivam Bansal Shivam Bansal Grandmaster Notebooks Discussions Datasets Shivam enjoys working on end-to-end real-world customer business problems using data science principles. He brings a strong blend of technical and business skills with a practical and solution-driven approach. He likes supporting various functions within the company which includes - engineering, data science, pre-sales, and customer success Shivam is a 3x Kaggle Grandmaster and a 5 times winner of Kaggle’s Analytics and Data Science for Good Competitions. He is also the winner of several other offline and online competitions. He holds a master's degree from the National University of Singapore and was selected as the Valedictorian. He has extensive cross-industry and hands-on experience in building data science products and applications. Follow me Pascal Pfeiffer Pascal Pfeiffer Grandmaster Competitions Pascal's focus is the application of machine learning techniques to unstructured data in the areas of computer vision, natural language processing, and audio. Pascal holds a Ph.D. in electrical engineering. He has previously worked in the automotive industry, specializing in the field of automated driving. Follow me Marcos Conde Marcos Conde Grandmaster Notebooks Discussions Marcos does research on Deep Learning and Computer Vision, his current research interests include generative models, mobile AI, image-video restoration, and enhancement. He loves to solve real-world problems using this knowledge. Marcos is a Ph.D. Student in the field of Computer vision and Deep learning in Germany. He joined Kaggle in 2019, a year after, he was ranked among the top-50 competitors worldwide and double Grandmaster. He especially enjoys research competitions related to medicine or the natural environment. He also enjoys reading about history, hiking, and watching movies and anime. Follow me Guanshuo Xu Guanshuo Xu Grandmaster Competitions Guanshuo’s focus areas are neural networks, image forensics and steganalysis. Guanshuo holds a PhD in Electrical Engineering focused on machine learning based image forensics and steganalysis. Follow me Kim Montgomery Kim Montgomery Grandmaster Competitions Kim’s focus areas are interpretable/explainable machine learning and addressing bias in machine learning. She’s an expert in feature engineering, a skill she has applied to a variety of fields. Kim has a Ph.D. in applied mathematics, with a background in both predictive modeling and differential equations. She has 20+ years of experience in mathematical modeling. Follow me Mathias Müller Mathias Müller Grandmaster Competitions Mathias’s focus areas are automatic machine learning for time series. Mathias holds MSc in Computer Science with a focus in AI and ML from Humboldt University of Berlin. Follow me Marios Michailidis Marios Michailidis Grandmaster Discussions Competitions Mario’s focus areas are acquisition, retention, recommendations, uplift, fraud detection, and portfolio optimization. Marios holds a BSc in Accounting Finance from the University of Macedonia in Greece and an MSc in Risk Management from the University of Southampton. He obtained his PhD in Machine Learning from the University College London (UCL) with a focus on ensemble modelling. Follow me Laura Fink Laura Fink Grandmaster Notebooks Laura holds a master’s degree in physics from the LMU Munich with a focus biophysics and nonlinear dynamical systems. She previously worked as the Head of Data Science at Micromata to build up the data science team of the company and to help their customers to make data-driven decisions. Laura is actively contributing to Kaggle as a Notebooks Grandmaster. She enjoys sharing detailed exploratory analyses with the community and participating in computer vision and tabular data competitions. Follow me Ryan Chesler Ryan Chesler Grandmaster Discussions Ryan’s focus is robustly solving real world problems of any type. He puts an emphasis on deep error analysis, understanding weaknesses of models and how to eliminate them. Ryan completed his BS in Business Entrepreneurship at Arizona State University. He has been an active member of the San Diego data science community for several years and organizes the San Diego Machine Learning meetup sharing knowledge and teaching newcomers to the field. He has earned gold and silver medals in competitions tackling problems ranging from natural language processing, indoor localization, computer vision, satellite imagery, audio detection, motion prediction of self-driving cars and tabular. Ryan enjoys discussing technical problems, sharing insights and reached a peak of 12th on the Kaggle discussion rankings. Follow me Kaggle is a crowd-sourced platform to attract, nurture, train, and challenge data scientists from all over the world to solve data science, machine learning, and predictive analytics problems. Kaggle allows users to find and publish data sets, explore and build models in a web-based data-science environment, work with other data scientists and machine learning engineers, and enter competitions to solve data science challenges. H2O.ai is hiring. Explore all current job openings."
