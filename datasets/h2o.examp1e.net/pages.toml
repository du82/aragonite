["https://h2o.examp1e.net/configure/access_control.html"]
title = "Access Control - Configure - H2O - the optimized HTTP server"
description = "the optimized HTTP/1.x, HTTP/2, HTTP/3 server"
full_description = "Starting from version 2.1, H2O comes with a DSL-like mruby library which makes it easy to write access control list (ACL). An ACL handler is built by calling ACL methods, which can be used like directives. ACL methods can only be used in acl block. Each ACL method adds a filter to the handler, which checks whether the request matches the provided condition or not. Every ACL method can be accompanied by a condition block, which should return boolean value. The filter defined by the method that first matched the accompanying condition gets applied (e.g. response 403 Forbidden, redirect to somewhere). If a condition block is omitted, all requests matches. If none of the conditions matches the request, the handler returns 399 and the request will be delegated to the next handler. Adds a filter which delegates the request to the next handler if the request matches the provided condition. Adds a filter which applies the provided handler (callable object) if the request matches the provided condition. In a condition block, you can use helpful methods which return particular properties of the request as string values. Matching methods can only be used in a condition block of the ACL methods. For example, both of the following examples violate the restrictions above, so the server will refuse to start up. You can match an IP address against predefined list of address blocks using a script named trie_addr.rb. This library currently supports only IPv4 addresses. TrieAddr#match? returns false when it receives an invalid IPv4 address (including an IPv6 address) as an argument.."
