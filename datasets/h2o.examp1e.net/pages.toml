["https://h2o.examp1e.net/configure/headers_directives.html"]
title = "Headers Directives - Configure - H2O - the optimized HTTP server"
description = "the optimized HTTP/1.x, HTTP/2, HTTP/3 server"
full_description = "This document describes the following configuration directives as well as when they are applied. All the directives accept one header field (specified by a YAML scalar), or multiple header fields (specified by a YAML sequence). Adds a new header line to the response headers, regardless if a header with the same name already exists. Adds a new header line, or appends the value to the existing header with the same name, separated by ,. The following example sets the must-revalidate attribute of the Cache-Control header when and only when the attribute is not yet being set. Starting from v2.3, it is possible to specify the timing when the headers directives is applied. All of the header directives can take either of the following two forms. If the value is final, the header directive is only applied to final (i.e. non-1xx) response. If the value is early, it's only applied to 1xx informational responses. If all is set, it's applied to both of final and 1xx responses."
