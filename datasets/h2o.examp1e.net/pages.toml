["https://h2o.examp1e.net/configure/http3_directives.html"]
title = "HTTP/3 - Configure - H2O - the optimized HTTP server"
description = "the optimized HTTP/1.x, HTTP/2, HTTP/3 server"
full_description = "HTTP/3 uses QUIC as the transport protocol. A listen directive with a type attribute set to quic instructs the standalone server to bind to a UDP port on which QUIC packets will be sent and received. The binding must have an ssl attribute, as QUIC uses TLS/1.3 as the handshake protocol. The example below setups a server that listens to both TCP port 443 and UDP port 443 using the same certificate and private key. First listen directive binds the server to TCP port 443 with specified credentials, marking that directive as an YAML alias called &listen_ssl. Then, it reuses (YAML merge) the first listen directive, adding type: quic to create a UDP port 443 binding for accepting QUIC connections. To fine tune the behavior of QUIC, the quic attribute should be used in place of the type attribute specifying quic. The quic attribute accepts following parameters. Also, properties such as congestion controller and initial congestion window can be tuned using the top-level attribute of listen. Aside from QUIC-level properties, configuration directives listed below are provided for tuning HTTP/3 behavior. When a graceful shutdown of h2o is initiated, h2o at first sends a GOAWAY frame indicating the clients that it is initiating shutdown, then after one second, starts rejecting new HTTP requests (a.k.a. half-closed state). This directive controls how long h2o should wait for the peer to close the QUIC connection in this half-closed state, before exitting. If set to zero, this timeout is disabled. h2o will not shut down until all QUIC connections are closed by the clients or times out. Unlike idle timeout of HTTP/1 and HTTP/2, this value should be small because it is faster to re-establish a new connection using 0-RTT than migrating to a different port due to NAT rebinding."
year_published = 2025
clearnet = "https://h2o.examp1e.net/configure/http3_directives.html"
