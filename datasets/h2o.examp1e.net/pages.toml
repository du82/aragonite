title = "Install - H2O - the optimized HTTP server"
description = "the optimized HTTP/1.x, HTTP/2, HTTP/3 server"
full_description = "As of April 2023, we have ceased to release versions. Rather, the each commit to master branch is considered stable and ready for general use except for the features marked as experimental. Additional softwares may be required for using certain features. As an example, to build the mruby handler, bison and ruby have to be installed. Start the installed server using the example configuration to confirm that it actually works (note: without the use of -m option the server runs as a foreground process; press Ctrl-C to stop). The example configuration starts a server that listens to port 8080 (HTTP) and port 8081 (HTTPS). Try to access the ports using the protocols respectively (note: when accessing via HTTPS it is likely that you would see hostname mismatch errors reported by the web browsers). Thanks to others, H2O is provided as a binary package on some environments. Up-to-date versions of H2O might be found at the following locations."
