["https://h2o.examp1e.net/configure/reproxy_directives.html"]
title = "Reproxy Directives - Configure - H2O - the optimized HTTP server"
description = "the optimized HTTP/1.x, HTTP/2, HTTP/3 server"
full_description = "A boolean flag (ON or OFF) indicating if the server should recognize the X-Reproxy-URL header sent from upstream servers. If H2O recognizes the header, it fetches the contents of the resource specified by the header, and sends the contents as the response to the client. If the status code associated with the X-Reproxy-URL header is 307 or 308, then the method of the original request is used to obtain the specified resource. Otherwise, the request method is changed to GET. For example, an upstream server may send an URL pointing to a large image using the X-Reproxy-URL header stored on a distributed file system, and let H2O fetch and return the content to the client, instead of fetching the image by itself. Doing so would reduce the load on the application server."
year_published = 2025
