["https://h2o.examp1e.net/configure/dos_detection.html"]
title = "Using DoS Detection - Configure - H2O - the optimized HTTP server"
description = "the optimized HTTP/1.x, HTTP/2, HTTP/3 server"
full_description = '''Starting from version 2.1, H2O comes with a mruby script named dos_detector.rb that implements DoS Detection feature. The script provides a Rack handler that detects HTTP flooding attacks based on the client's IP address. Below example uses the mruby script to detect DoS attacks. The default detecting strategy is simply counting requests within configured period. If the count exceeds configured threshold, the handler returns a 403 Forbidden response. Otherwise, the handler returns a 399 response, and the request is delegated internally to the next handler. In the example above, the handler countup the requests within 10 seconds for each IP address, and when the count exceeds 100, it returns a 403 Forbidden response for the request and marks the client as "Banned" for 300 seconds. While marked as "Banned", the handler returns a 403 Forbidden to all requests from the same IP address. The algorithm to detect DoS attacks. You can write and pass your own strategies if needed. The default strategy is DoSDetector.CountingStrategy which takes the following parameters: The callback which is called by the handler with detecting result. You can define your own callback to return arbitrary response, set response headers, etc. The default callback returns 403 Forbidden if DoS detected, otherwise delegate the request to the next handler. If set true, the handler uses X-HTTP-Forwarded-For header to get client's IP address if the header exists. The default value is true. The capacity of the LRU cache which preserves client's IP address and associated request count. The default value is 128.'''
year_published = 2025
clearnet = "https://h2o.examp1e.net/configure/dos_detection.html"
