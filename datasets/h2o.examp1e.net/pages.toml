external-references = ["aws.amazon.com", "blog.kazuhooku.com", "dena.com", "en.wikipedia.org", "gist.github.com", "github.com", "haproxy.org", "iana.org", "imperialviolet.org", "intel.com", "iovisor.github.io", "kernel.org", "linux-ip.net", "nghttp2.org", "radar.oreilly.com", "rfc-editor.org", "slideshare.net", "tools.ietf.org", "varnish-cache.org", "w3c.github.io"]

["https://h2o.examp1e.net/configure/file_directives.html"]
title = "File Directives - Configure - H2O - the optimized HTTP server"
description = "the optimized HTTP/1.x, HTTP/2, HTTP/3 server"
full_description = "This document describes the configuration directives of the file handler - a handler that for serving static files. Two directives: file.dir and file.file are used to define the mapping. Other directives modify the behavior of the mappings defined by the two. The directive accepts a mapping containing configuration directives that can be used at the extension level, together with a property named extension specifying a extension (starting with .) or a sequence of extensions to which the directives should be applied. If all the files (including those without extensions) shall be mapped, this property must be set to default. Only one handler must exist within the directives. A boolean flag (OFF, or ON) specifying whether or not to send the directory listing in case none of the index files exist. Specifies the names of the files that should be served when the client sends a request against the directory. The sequence of filenames are searched from left to right, and the first file that existed is sent to the client. It is also possible to set certain attributes for a MIME type. The example below maps .css files to text/css type, setting is_compressible flag to ON and priority to highest. The priority attribute affects how the HTTP/2 protocol implementation handles the request. For detail, please refer to the HTTP/2 directives listed in the see also section below. By default, mime-types for CSS and JavaScript files are the only ones that are given highest priority. If set to ON, the handler looks for a file with .br or .gz appended and sends the file, if the client is capable of transparently decoding a brotli or gzip-encoded response. For example, if a client requests a file named index.html with Accept-Encoding: gzip header and if index.html.gz exists, the .gz file is sent as a response together with a Content-Encoding: gzip response header. Starting from version 2.2, gunzip is also supported. If set, the handler acts identical to when the value was set to ON. In addition, the handler will send an uncompressed response by dynamically decompressing the .gz file if the client and the server failed to agree on using a pre-compressed file as the response and if a non-compressed file was not found. The option is useful when conserving disk space is important; it is possible to remove the uncompressed files in place for gzipped ones."
year_published = 2025
clearnet = "https://h2o.examp1e.net/configure/file_directives.html"
