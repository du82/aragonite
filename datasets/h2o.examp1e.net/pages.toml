["https://h2o.examp1e.net/configure/proxy_directives.html"]
title = "Proxy Directives - Configure - H2O - the optimized HTTP server"
description = "the optimized HTTP/1.x, HTTP/2, HTTP/3 server"
full_description = "Proxy module is the proxy implementation for H2O - it implements a reverse HTTP proxy and a CONNECT proxy. A reverse HTTP proxy is setup using the proxy.reverse.url directive. A CONNECT proxy is setup using the proxy.connect directive. When acting as a reverse HTTP proxy, following request headers are added and forwarded to the backend server: By default, all requests to the backend server are sent using HTTP/1.1. Use of HTTP/2 and HTTP/3 to backend servers is considered experimental; their use can be controlled via directives proxy.http2.ratio and proxy.http3.ratio. When more than one backend is declared, the load is distributed among the backends using the strategy specified by the balancer property. Currently we support round-robin (the default) and least-conn as the value of the property. The strategies are applied when establishing a new connection becomes necessary (i.e. when no pooled connections exist). For the round-robin balancer, weight is respected in this way: each backend would be selected exactly weight times before next backend would be selected, except when the backend is not accessable. For least-conn balancer, weight is respected in this way: the selected backend should have the minimum value of (request count) / (weight). H2O will try to reconnect to different backends (in the order determined by the load balancing strategy) until it successfully establishes a connection. It returns an error when it fails to connect to all of the backends. In addition to TCP/IP over IPv4 and IPv6, the proxy handler can also connect to an HTTP server listening to a Unix socket. Path to the unix socket should be surrounded by square brackets, and prefixed with unix: (e.g. http://[unix:/path/to/socket]/path). Each element of the access control list starts with either + or - followed by an wildcard (*) or an IP address with an optional netmask and an optional port number. When a CONNECT request is received and the name resolution of the connect target is complete, the access control list is searched from top to bottom. If the first entry that contains a matching address (and optionally the port number) starts with a +, the request is accepted and a tunnel is established. If the entry starts with a -, the request is rejected."
year_published = 2025
clearnet = "https://h2o.examp1e.net/configure/proxy_directives.html"
