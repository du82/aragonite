full_description = "New Year, New Job Jan 7, 2019 work consulting suggest edit GitHub had about 50 employees when I joined back in December 2011. Seven years later, it blew past 950 people and Microsoft acquired it for $7.5 Billion. What would you say if I told you it could have been way more valuable than that? Read More Increase your giving by 50% for free Dec 28, 2018 personal charity suggest edit What if I told you there’s a way you can increase your giving by up to 50% or more (depending on your tax bracket) at no cost to you? For every dollar you put in, you’d have $1.50 to give to a charity of your choice? Interested? Read on then. Read More Phil Haack is no longer a GitHubber Dec 18, 2018 personal work suggest edit It used to be a tradition at GitHub to announce new hires with a blog post with the pattern, “So and so is a GitHubber.” Each post would be accompanied by an image. Read More Steal My Blog Design Dec 11, 2018 jekyll design meta suggest edit A name like Haack does not make me destined to win awards as an outstanding designer. I’ve come to grips with that. I’m not terrible, mind you. I’d say my skill level is somewhere in the ballpark of slightly above Geocities and closely approaching the aesthetics of Craigslist, on a good day. Read More An adventure in CSS with column lists Dec 3, 2018 css design suggest edit Sit back and relax as I regale you with a harrowing account of trying to do something straightforward with CSS. Ha! Straightforward. How silly was I to think that. As they say, Read More The Problem of Package Manager Trust Nov 28, 2018 nuget security suggest edit UPDATE April 3, 2019 Several years after I wrote this post, NuGet added a package signing feature. I wrote a blog post that takes a close look at the feature. Read More Land that first programming job Nov 15, 2018 community mentoring software career hiring suggest edit How does a person land their first job as a developer these days? Read More Caribbean Developer's Conference Nov 2, 2018 community conferences software suggest edit Picture a developer’s conference held at a resort on a tropical island. What comes to mind? An endless supply of Piña Coladas? Sand abrasions in all the dark crevices of your body? Or perhaps, if you’re a developer, you imagine sitting on the beach, staring out at the ocean as a nice respite between sessions. Read More Abolish Performance Reviews Jul 11, 2018 work management diversity suggest edit Who doesn’t love the smell of performance reviews in the morning? A smell welcomed by employees and managers alike with joy and delight. An efficient ritual that is fair and definitely motivates everyone to improve. A ritual that no one doubts is worth the investment of time and energy. Read More Comments for Jekyll Blogs Jun 24, 2018 jekyll blogging serverless suggest edit If you are a long time reader of my blog, you might notice something different starting today. No, the content hasn’t gotten any better. What’s new is the comment system. Read More Scientist.NET 2.0 Release Jun 5, 2018 github csharp dotnet scientist refactoring suggest edit I have some big news! Scientist.NET 2.0 is now available on NuGet. Read More PR information at your fingertips Mar 15, 2018 github visualstudio code-review suggest edit The Information Industry Association adopted the motto “Putting Information at Your Fingertips” way back in the hazy days of the 1970s. However it was during a 1990 Comdex keynote (you can watch a scratchy VHS recording of it on YouTube), when a relatively young Bill Gates articulated a vision to bring that idea to reality. Read More Analyzing GitHub Issue Comment Sentiment With Azure Jan 27, 2018 serverless github ai suggest edit Developers are real passionate about their semi-colons; or lack thereof. Comment threads on GitHub can get a bit…testy…on this topic. What’s a beleaguered1 repository maintainer to do when an issue comment thread gets out of hand? Read More Incentive Pay Does Not Work Jan 15, 2018 compensation career management motivation suggest edit In The Case Against Pay for Performance, I argued against increasing pay based on performance reviews. Checkmate. Case closed. Or so I thought. Like many bloggers, I suffer from delusions of grandeur that millions ponder every word I write, are enlightened by insight, and then compelled to action. Read More The Impact of our Work Jan 1, 2018 personal career suggest edit There was once a time I regretted not attending a school with a more rigorous engineering program. I would tell myself, I should have gone to an institution like Stanford which has a strong CS program and ties to the bay area tech scene. I’d be further ahead in my career hobnobbing with VCs showering me with champagne and hundred dollar bills. Read More Work hard and love yourself Dec 29, 2017 personal health suggest edit Not to stereotype tech folks, but, I’ll do it anyways. Most of us could stand to get in better physical shape. I know, that’s about as surprising as a cryptocurrency crash. Read More 2017 - Darkest timeline Dec 27, 2017 personal suggest edit This year felt a lot like living in the darkest timeline and an episode of Black Mirror at the same time. Read More Git Coin Project Maintainer Consensus Protocol Oct 22, 2017 git math humor oss shell aliases suggest edit A recent wry tweet by @bcrypt really tickled my funny bone: Read More Why do managers go bad? Oct 7, 2017 leadership management motivation suggest edit In Endless Immensity of the Sea I wrote about a leadership style that encourages intrinsic motivation. Many people I talk to don’t work in such an environment. Even those who work in places that promote the ideals of autonomy and intrinsic motivation often find that over time, things change for the worse. Why does this happen? Read More Endless Immensity of the Sea Aug 30, 2017 leadership management motivation suggest edit There’s this quote about leadership that resonates with me. Read More « Prev 1 2 3 4 5 ... 103 Next » Phil Haack haacked haacked @haacked@hachyderm.io rss You've been Haacked is a blog about Technology, Software, Management, and Open Source. It's full of good stuff."
