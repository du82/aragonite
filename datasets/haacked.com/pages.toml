["https://haacked.com/archive/2022/09/30/ef-core-collection-pitfalls"]
title = "Pitfalls with eager loading of collections in EF Core | You’ve Been Haacked"
description = "Eager loading of collections can come with pitfalls when it’s not clear if the collection has been loaded or not. This post shows one such pitfall and one approach to working around it."
full_description = '''Pitfalls with eager loading of collections in EF Core Sep 30, 2022 aspnetcore efcore suggest edit When using an ORM with a web app, lazy loading will almost certainly result in hidden N+1 queries. Eager loading is a great way to avoid this, but has its own pitfalls. In particular, for each query, you need to be careful about what you include in the query. If you include too much, you can end up with a lot of data that you don’t need. If you include too little, you can end up with confusing logic. For example, deep in your application code, it may not be clear if a navigation collection has been loaded yet or not. This can lead to unexpected behavior. I know it’s boring lazy to use the example of a blog post to illustrate this concept in a blog post, but it’s a well understood domain and it’s what’s often used in EF Core’s own documentation. So bear with me. Here’s one approach that you might take (with some properties omitted for brevity): public class Post { public int Id { get; set; } public IList<Author> Authors { get; set; } public IList<Comment> Comments { get; set; } } In our hypothetical web app, every page that displays a blog post will need to display the post’s authors, but only some of them will display comments. One approach we could take is to always load both collections: // For the individual post page. public async Task<Post?> GetPostAsync(int id) { return await _context.Posts .Include(p => p.Authors) .Include(p => p.Comments) .FirstOrDefaultAsync(p => p.Id == id); } // For the home page. public async Task<List<Post>> GetPostsAsync() { return await _context.Posts .Include(p => p.Authors) .Include(p => p.Comments) .ToListAsync(); } This is a simple approach, but not really scalable. The method to get all posts is loading all the comments for every post even though they’re not needed. On my blog, this wouldn’t be a problem. But this can get expensive if the blog is very popular and millions of people post long-winded comments on it. Let’s improve this: // For the home page. public async Task<List<Post?>> GetPostsAsync() { return await _context.Posts .Include(p => p.Authors) .ToListAsync(); } Better, but now we expose another problem. Suppose deep in our app logic, we get passed a Post instance and we want to show the comment count, but we’re not sure which query it came from. Notice that post.Comments is non-nullable. So I should safely be able to reference post.Comments.Count as far as the compiler is concerned. But that’ll throw a NullReferenceException if the query that loaded the Post didn’t include comments. One solution is to make the collection nullable. public class Post { public int Id { get; set; } public IList<Author> Authors { get; set; } // We always load this, so it's non-nullable. public IList<Comment>? Comments { get; set; } // We don't always load this, so it's nullable. } Then we’d check for null before accessing the collection. Something like this: public async Task<int> GetCommentCountAsync(Post post) { if (post.Comments is null) { await _dbContext.Entry(post).Collection(p => p.Comments).LoadAsync(); } return post.Comments!.Count; } Yes, nullable collections suck, but in this case, it makes sense because it communicates an important distinction between the collection being empty vs the collection not being loaded. So we’re in the clear, right? Well, no. It’s possible for post.Comments to be non-null, but not be fully loaded. Suppose, for some reason, earlier in the same request with the same DbContext we load a comment like this: var comment = await _dbContext.Comments.FirstOrDefaultAsync(c => c.Id == id); // comment.PostId just happens to be the same as post.Id. And this comment belongs to the same post that we’re trying to get the comment count for. It turns out that even though we haven’t explicitely included or loaded post.Comments, it will be a non-null collection with one entry, the comment. Why? When using eager-loading with EF Core, it has an automatic-fixup feature: Entity Framework Core will automatically fix-up navigation properties to any other entities that were previously loaded into the context instance. So even if you don’t explicitly include the data for a navigation property, the property may still be populated if some or all of the related entities were previously loaded. Since a Comment associated with the Post is already loaded in the DbContext, the Post’s Comments collection will be non-null and contain that comment. This is a bit of a gotcha, that we ran into with Abbot in local development recently, so it’s not just a hypothetical case. Here’s how I ended up fixing it: public async Task<int> GetCommentCountAsync(Post post) { if (post.Comments is null || !_dbContext.Entry(post).Collection(p => p.Comments).IsLoaded) { await _dbContext.Entry(post).Collection(p => p.Comments).LoadAsync(); } return post.Comments!.Count; } The call to _dbContext.Entry(post).Collection(p => p.Comments).IsLoaded tells us if the collection is fully loaded or not. Automatic fix-up does not set IsLoaded to true for the collection. I left the null check as an optimization, but it’s not strictly necessary. UPDATE: On Twitter, https://twitter.com/RichardDeeming noted that LoadAsync checks IsLoaded internally, so the null check and the IsLoaded check is unnecessary. Thus we’re left with: public async Task<int> GetCommentCountAsync(Post post) { await _dbContext.Entry(post).Collection(p => p.Comments).LoadAsync(); return post.Comments!.Count; } Since we can’t rely on the nullability of the collection to tell us if it’s fully loaded or not, I don’t think it makes sense to even use nullable collections. Which brings us back to the first approach: public class Post { public int Id { get; set; } public IList<Author> Authors { get; set; } public IList<Comment> Comments { get; set; } } I think it would be interesting if the type system could somehow express this distinction. For example, if the entity is returned from a query that includes the collection, then the collection is non-nullable and fully loaded. If the entity is returned from a query that doesn’t include the collection, then the collection is nullable and not fully loaded. I’m not sure how to do this in C#, but it would be interesting to explore. Found a typo or mistake in the post? suggest edit Comments Leave response Remember me 5 responses Joel • October 6th, 2022 Thanks! Why doesn’t the Count method and other enumerating methods automatically load the data if itvs not loaded? haacked • October 6th, 2022 @Joel, I’m using EF Core and defined my collection property as an IList<T> which is populated with a List<T>. List<T> is a standard .NET collection and doesn’t know anything about EF so it wouldn’t be able to load the collection. In theory, I could create a custom collection type that does all that, but I’m not a fan of implicit database queries. I’d rather be explicit about when my code calls the database. It’s too easy to run into problems and N+1 issues otherwise. Joel • October 6th, 2022 @haacked. Thank you. I’ve never used EF so I’m not familiar with it. I would have expected the ORM to populate the IList with a type that does the implicit query like you describe, not just a standard List. But I agree that hidden database queries like that should be avoided. Chris • May 9th, 2023 Could be a little trickier to plumb in to return from EF / your repo but perhaps something like a discriminated union could satisfy the last statement by encoding the loaded-ness in the type system. So in C# you’d have something like: public OneOf<IList<Comment>, IList<Comment>?>Comments { get; set; } (see https://github.com/mcintyre321/OneOf for an implementation of OneOf) The gist is you’re returning a thing that contains both of the specified types, but one is always null. So if you included the collection in your query, you’d return <IList, null>, and otherwise you'd return <null, IList?>. The OneOf class also has code that abstracts away the messy "if the first one has a value, do this, if the second has a value do the other". Callers can then do things like: Comments.Switch( x => DoSomethingWithFullyLoadedComments(x), x => DoSomethingWithPartiallyLoadedComments(x)) Or, if you like old fashioned if statements, if(Comments.IsT0) DoSomethingWithFullyLoadedComments(x); else DoSomethingWithPartiallyLoadedComments(x); (See also https://haacked.com/archive/2013/11/08/death-to-the-if-statement.aspx/ - OneOf abstracts away if and case statements) Dave • December 18th, 2024 I wish there was a good solution for this. It should “explode” (throw) if I try to access a collection that I haven’t included (when not lazy loading). This is a case where a runtime exception would actually be an improvement over the default. Just silently giving an empty collection is really frustrating and I can’t seem to find a good alternative.'''
