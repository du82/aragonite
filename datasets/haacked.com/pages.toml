["https://haacked.com/archive/2022/10/12/calculating-mrr-with-stripe-and-csharp"]
title = "Calculating MRR with Stripe and C# | You’ve Been Haacked"
description = "Monthly Recurring Revenue is an important indicator for the health of your business. Here’s how to calculate it using the Stripe API and C#."
full_description = '''Calculating MRR with Stripe and C# Oct 12, 2022 stripe abbot suggest edit Over here at A Serious Business, Inc. we’re very serious about security. One principle that’s important to us is what we call the Principle of Least Exposure (not to be confused with the similar Principle of Least Privilege). In simple terms, the principle is: You can’t expose what you don’t have. For example, our product Abbot doesn’t store or accept credit card payment info directly. Instead, we use a trusted third party, Stripe, to handle that for us. Stripe can be a bit tricky to get started with, but that complexity reflects the inherent complexity of accepting payments. Fortunately, they supply some great tools and documentation to help you get started. Also, their support is top quality. Every time I contact them, they’re quick to respond and helpful. And before you ask, no, they’re not paying me to say that. But in the interest of full disclosure, they did send me a Stripe t-shirt. I’m wearing it right now. It’s very comfortable. Calculating MRR One of the most important metrics for any SaaS business is Monthly Recurring Revenue (MRR). It’s a simple concept: how much money are you making every month? It’s a great indicator of the health of your business. If your MRR is growing, you’re doing well. If it’s shrinking, you’re not. MRR is forward looking, which is why you don’t want to sum up invoices. Instead, you want to look at all the subscriptions you have and sum up the amount of money you’re expecting to receive from them in the next month. For yearly subscriptions, you’ll want to pro-rate the yearly amount to get the monthly amount. Fortunately, Stripe has a nice dashboard where you can see your MRR. I’m not supposed to share ours, but we’re all friends here right?! Unfortunately, it can take some time to reflect recent purchases. In our case, we wanted to display the MRR in an internal dashboard and I could not find a way to grab the MRR that Stripe calculates from the Stripe API. If there is a way and I just missed it, I hope someone will let me know in the comments. So naturally I wrote some code to do this. As with most .NET code, it starts with installing a NuGet package. > dotnet add package Stripe.net Then I wrote some methods to calculate the MRR. If you want to jump to the full code listing, check out this gist. The following walks through each step. The first step is to calculate the MRR for a single subscription. There’s two important things to consider here. First, we need to normalize subscriptions to monthly. For example, for an annual subscription, you need to divide by 12 to get the monthly revenue amount. For days and weeks, I just picked 30 and 4 respectively. I’m not sure what the standard value should be here, but we don’t offer daily or weekly subscriptions so it’s not important to me. I just include it here for completeness. The second important thing is to consider the item quantity. My first attempt at this code neglected the item quantity and I ended up underreporting our MRR. public static decimal CalculateSubscriptionMonthlyRevenue(Subscription subscription) { decimal revenue = 0; foreach (var item in subscription.Items) { var multiplier = item.Plan.Interval switch { "day" => 30M, "week" => 4M, "month" => 1M, "year" => 1M / 12M, _ => throw new UnreachableException($"Unexpected plan interval: {item.Plan.Interval}.") }; revenue += multiplier * item.Quantity * item.Price.UnitAmountDecimal.GetValueOrDefault(); } return revenue / 100M; // The UnitAmount is in cents. } Next we calculate the MRR for a customer. In theory, a customer can have multiple subscriptions, so we handle that. More importantly, if your customer has a discount due to a coupon, you want to apply that discount to the calculation. However, for a one-time amount off discount, you can pretty much ignore it for the purposes of MRR as it’s forward looking. public static decimal CalculateCustomerMonthlyRevenue(Customer customer) { var subscriptions = customer.Subscriptions; var revenue = 0M; foreach (var subscription in subscriptions) { revenue += CalculateSubscriptionMonthlyRevenue(subscription); } // Apply the coupon, if any. We only look at % off coupons. // We can ignore the amount off discount. That's a one time discount and doesn't affect ongoing MRR. if (customer.Discount is { Coupon.PercentOff: { } percentOff }) { revenue *= 1 - percentOff / 100M; } return revenue; } And finally, we put it all together by grabbing all of the active subscriptions. public static async Task<decimal> CalculateMonthlyRecurringRevenue() { string? lastId = null; var customerClient = new CustomerService(); decimal revenue = 0M; bool hasMore = true; while (hasMore) { var customers = await customerClient.ListAsync( new CustomerListOptions { Limit = 100, /* Max Limit is 100 */ Expand = new List<string> { "data.subscriptions" }, StartingAfter = lastId }); revenue += customers.Sum(CalculateCustomerMonthlyRevenue); hasMore = customers.HasMore; if (hasMore) { lastId = customers.LastOrDefault()?.Id; if (lastId is null) { throw new InvalidOperationException("API reports more customers but no last id was returned."); } } } return revenue; } The code here is a bit tricky because the Stripe APIs only let you grab 100 customers at a time. And since we always want to prepare for success, we need to handle the case where there are more than 100 customers. So we loop through the customers, grabbing 100 at a time, until we get to the end. Conclusion I hope this helps you use Stripe to calculate your MRR. If you have improvements to the code, feel free to comment on the gist with the full code listing. Found a typo or mistake in the post? suggest edit Comments Leave response Remember me 2 responses Sean Killeen • October 12th, 2022 Is this different than Stripe Metrics export? https://stripe.com/docs/billing/subscriptions/view-metrics#metrics-export The metrics export includes MRR per subscriber per month and MRR roll-forward, active subscriber roll-forward, etc. Regardless, this is a great walkthrough! And I agree, Stripe support is awesome. Sol • October 12th, 2022 Does your code handle the scenario where a user purchases something on an already started yearly subscription in the middle of the service period? E.g. in our own setup, a user can purchase extra seats on their yearly volume license subscription. The expiration for these seats are cotermed to the volume license expiration, thus the price is of course reduced because they’re not covering a full period, and thus the MRR is obviously not 1/12, but rather the remaining period, e.g. 1/6 if purchased half-way through the period. Also, I think it would be beneficial to have code that supports point-in-time calculations of MRR, such that development of MRR over time can be calculated/plotted. It’s an interesting topic, calculating MRR. Currently, doing a lot of that. It’s also interesting when you have a mix of currencies. Are there other key metrics that you look at/calculate in your SaaS?'''
