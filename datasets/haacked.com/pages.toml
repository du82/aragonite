full_description = "TIP: Row by Row operations without cursors Mar 18, 2004 code sql suggest edit In general, cursors suck ass! Ok, that’s a bit extreme, but I have a long and ugly history with cursors. Let me diverge here and tell you a true story. Read More U.S. Minority Groups on Rise by 2050 Mar 17, 2004 news suggest edit Being of mixed heritageI have both bases covered. For now, I can claim my caucasian-ness and reap all the benefits of being the dominant sub-culture. But once minorities surpass caucasians, I can switch to Read More Be sure to ask Snoop Mar 16, 2004 humor suggest edit Cause his shiznit be fo real, know what I’m sayin’. Enter yo trickass URL and he’ll tranlate that shizzle. Read More Orkut is .NET Mar 14, 2004 dotnet suggest edit Proving the whole 6 degrees of separation thing, I finally received an invitation to Orkut. The thing that struck me was when highlighting a button I noticed this in the status bar: Read More Meeting the Lender Today Mar 14, 2004 personal suggest edit We’re meeting the lender today to make the final preparations for the big loan. I thought college was expensive, but this is on a whole ‘nother level. For you out there who don’t live in California, I’m basically buying a small 1000 sq ft 2 bedroom 2.5 bathroom condo townhouse for probably the amount you could buy a mansion in Kentucky, or a four bedroom house in Seattle. This market is crazy, but we’re not ready to leave L.A. just yet. So it’s love it or buy it. Read More Burning Man Mar 14, 2004 burningman suggest edit I can almost smell the smoky embers. Burning Man tickets have already gone on sale. I tried to buy them in the mad rush when they first came online at a discounted price to no avail. Their servers basically decided to go on a vacation with the overload of requests. I had a vision of one of them Japanese subway cars where they have to shove people inside. Read More Very neat video Mar 13, 2004 humor suggest edit Neat Video of a backwards car…. Read More Update: What to do if you win the lottery. Mar 12, 2004 personal suggest edit Ok, this post has been effectively deleted. Apparently the link I posted is no longer up. :( Read More The architect of the fashion world Mar 12, 2004 personal suggest edit With the news that we are about to be home owners, Kyle’s comment was Read More We're homeowners!!! Mar 11, 2004 personal suggest edit We got it. Now what!? Read More The Neopoleon Guide to Hollywood Aliens Mar 11, 2004 humor suggest edit This is a hilarious guide to distinguishing aliens from humans. Here’s an excerpt. Read the rest at Neopoleon.com. Read More Advice on making a condo offer Mar 11, 2004 tips suggest edit At least this advice worked for us. Read More What would you do if you won the lottery? Mar 9, 2004 interesting personal suggest edit I was thinking about this question after reading an article in a magazine about setting goals. The article had four steps for setting goals, and six steps for meeting them. Included were your usual tips for visualizing your goal, writing it down, and making a plan of action to meet the goal. Read More We're making an offer. Mar 8, 2004 personal suggest edit We found a place we like and we’re making an offer. Wish us luck. Read More The Excorcist in 30 Seconds. Mar 6, 2004 humor suggest edit The Excorcist In 30 seconds is one of the funniest flash animations I’ve seen in a while. Read More Longhorn RSS Aggregator Mar 5, 2004 rss suggest edit I’ve seen the future and it is good. Adam Kinney has a demo Rss Aggregator for Longhorn at his site, http://www.adamkinney.com/. It’s very barebones right now, but you can just see the potential for how beautiful this will and does look. What struck me was how nice the text of a blog entry looked in the text window. Nice work adam! Read More I'm finally legit! Mar 5, 2004 personal suggest edit I received my business cards today. Now I can enter all those raffles at the local eateries. Read More Godzilla To Retire (for now) Mar 5, 2004 news suggest edit Will they be giving him a gold watch? Read More Do NOT watch this while on psychedelics Mar 5, 2004 drugs suggest edit The psychedelics are unnecessary. http://www.badgerbadgerbadger.com/ Read More An Intro to Rss Reading Mar 5, 2004 rss suggest edit Ok ok, I am in love with reading RSS and that has a lot to do with my geekiness. But I found an article on Slate (decidedly non geeky) that does a better job explaining the benefits of using an RSS Reader. One thing I learned is that there’s an RSS Reader for Mac OS X. Read the article. Read More « Prev 1 ... 96 97 98 99 100 ... 103 Next » Phil Haack haacked haacked @haacked@hachyderm.io rss You've been Haacked is a blog about Technology, Software, Management, and Open Source. It's full of good stuff."
