title = "This Was My First Computer | You’ve Been Haacked"
description = "You've been Haacked is a blog about Technology, Software, Management, and Open Source. It's full of good stuff."
full_description = '''This Was My First Computer Jun 6, 2005 personal tech suggest edit Via Rory’s post here, I’ve discovered the Obsolete Technology Website. The fact that this site evokes nostalgia only reinforces two facts about me, that I am a total geek and I’m getting old. I love the write-up of my very first computer (which I still own and have laying around here somewhere). The gray/silver color scheme was fetching for the original TRS-80 Model I computer, but it just doesn’t work on the Color Computer - it has to be one of the ugliest computers ever. Ahhh yeah! Later, when several of my friends were riding the Commodore 64 wave, I jumped one step ahead with my second computer, the Commodore 128 (one-piece model). In sense, this wasn’t a step ahead at all as the Commodore 128 was just a glorified Commodore 64 with a nicer looking case. Just about nobody jumped at the chance to write software that took advantage of the C128 Mode or the CP/M mode. I pretty much spent most of the time using it in C64 mode. My third, and last computer before switching over to the Wintel universe, was every geek boy’s wet dream at the time, the Amiga 500. Unfortunately the site doesn’t have a write-up of the Amiga 500 specifically, but you can read up on the Amiga 2000 which came out the same year. Ahhh memories… UPDATE 2013-06-24: Turns out I still have that TRS-80! Found a typo or mistake in the post? suggest edit Comments Leave response Remember me 82 responses Greg • June 6th, 2005 This was my family's first computer. My dad chose it because he wrote computer programs and for him this was the purist way to do it at home. Because my sister and I complained all the time, he purchased TI Logo, but it was nothing compared to the Apple IIe version. Some things I remember:1. Dad programmed games for us and saved them to tape. No disk drive for us, we had a Radio Shack tape recorder that could record his programs. Loading my favorite game, Jungle Jim (a poor knockoff of Pitfall programmed in TI Extended Basic) took nearly 15 minutes to load. And we get mad now when a webpage takes more than a second to load.2. Parsec was the best game available on the TI. It was like Wing Commander for the Flock of Seagulls.3. The TI joystick was terrible. IT would often stick so we had to pause the game to pull out the connector and blow on the interface. My sister learned to play Munch Man (Pac Man, except you shat out a chain to fill in the maze instead of eating power pellets) by only turning left since our joystick often didn't go right.4. We bought a 13 inch color portable TV to use as a monitor which I suppose was overkill becaise the TI only supported 16 colors.5. We entered a whole new world of computing when we bought the 32k memory expansion card. Sweet!6. One thing people oftern forget, the TI was portable. You could plug it into any TV and it only weighed about 8 pounds. It was just a pain carrying the tape recorder around.7. We replaced the TI with a 25 Mhz 386 SX with 1 mb of RAM and a 40 mb harddrive. My dad proudly said, "Son, this is more storage space then you'll ever need!" Ahh, the good old days! Spiridon • June 6th, 2005 Mmm, I missed out on all the C64 stuff and Amiga systems.I hardly remember my first computer, it was a XT cpu but I cant remember the clock speed, same as RAM memmory, but it had a 20MB hard disk, and I had like 50 games on it as well, also the main thing I did on it, play games.Yeah, and now I have 600 GB in my system+server and still not enough :P mike • June 8th, 2005 I also had a CoCo for first computer at home. Before that I had to put the phone receiver into a portable coupler and dial into local university's computers.Those cartridges were a life saver so did not have to wait to load stuff from CASSETTE! We had a subscription to some "magazine" that sent us a new cassette each month with a bunch of programs on it. It was fun having to Fast Forward to a certain counter to get to a specific program to load. astrid • June 9th, 2005 Wow! Happy, frustrating days! I initially was taught on one of these. Christ they were slow. I was taught by a really BORING computer teacher with brown socks, brown sandals, brown beard and boring brown car. All I can remember was how slow and complicated it was just to start writing a document. But I persevered despite the fact he kept talking gobbledegook and sending us home with big handouts covered in code commands in 6 point type.That was in 1985. By 1986 (I think!) I discovered Apple Mac and I never looked back. In fact, I am using one now. chris • June 29th, 2005 My first computer was a Commodore VIC 20 (1985). My friends all had 64's, which made mine look like a real turd. I had a cassette drive, color tv monitor, and 1 game cartridge--Mission:Impossible. I never solved the game. I could get all the way through it to the last scene with the bomb, and no matter what combination I tried, it always blew up!! I sort of miss those "text-only" games. You really had to concentrate and take good notes. Since then I've picked up an Amiga 500, Amiga 2000 (sucked worse than the 500) and a Commodore Colt from thrift stores. The Commodore's graphics subsystem was FAR superior to the IBM. I don't know what happened there. I still have the monitor. Nchantim • November 6th, 2006 First computer I ownded was a Timex Sinclair 2068. I went from TRASH-80 (4K) to Sinclair ZX-81 to ZX-Spectrum to BBC Model B before my parents bought me the T/S 2068. My first hardware mod - I put a Spectrum ROM in the 2068! I was another 6 years before I got a "real" pc - A Bleading Edge with a dedicated monitor and two floppies! Of course, I swapped the 8088 with an NEC V-20. It had 512K, a 1200bps modem, and ran MS-DOS! aakash • March 5th, 2009 This was mine - http://www.vintage-computer.com/ibmpcat.shtml Rolf Ackermann • August 8th, 2011 My first computer was a Sinclair ZX-81 hurcane • August 8th, 2011 Our 1982 Christmas present was a 16K ECB CoCo. I tore right through the two learning manuals that came with it, and that fueled my passion to become a programmer. I still think those two books were one of the best resources for beginners of the day to get started with procedural programming. Stuart • August 8th, 2011 My fist was a CoCo just like the gray beauty shown in the post. My sister and I would take turns dictating lines of code from a magazine to get really "fun" games to do things like guess random numbers.My dad bought us a chess game, but we had to return it to Radio Shack. We had the CoCo connected to a B&W TV (remember them?) and you couldn't tell which pieces were which!My parents made a lot of financial sacrifices to get me into computers as a kid. Now I write software for medical devices. I will always be grateful for their gifts of computer "toys." Neal • August 8th, 2011 ZX81 - Classic 1981 kdupont • August 8th, 2011 Atari 400.... Joel Davis • August 8th, 2011 My 48 KB TRS-80 wasn't fast enough, so I bought a speedup kit from some engineer in UTAH. Instead of 1.78 Mhz, it ran at about 5. Ran some basic programs on it and an original PC. The elapsed times were almost equal! Listing a program on it was like watching a flash. Fabrizio • August 8th, 2011 First was a C=64 with a brown expernal floppy disk (5 1/4 ") reader and the more common tape reader, some day after buying the C=64 I bought a Sinclair ZX Spectrum, since a friend of mine has one and he would have shared the C16 tapes... ;-) I still remember some of the exadecimal codes for the equivalent assembly lanuage instructions (remember LDA,LDX,LDY,BCC,... and READ-DATA, PEEK and POKE? And the Turbo loader - maybe Rambo was one of the first games having the turbo loader...)After that a Sinclair QL (resold some day after I bought...), an Amiga 500 (equipped with a 20MB - 20 Mega Bytes - external HD!!!), an Amiga 1200, an Amiga 4000/030, a Macintosh 5200, a Compaq Pentium 166, a Macintosh 6300, A Packard Bell PIII 650, a PowerPC G3 (gray) an IBM ThinkPad R50e, an IBM ThinkPad R500 (the last one). Some year ago, My nostalgia push me to buy an old Macintosh Classic too...I still miss my Amiga 4000/030 (Nebulus Game and Tower of Babel, real games I mean! Not like the ones my kids are playing today!...)Best regards to all. Jim • August 8th, 2011 Victor 9000 Christopher King • August 8th, 2011 VIC 20 register512 • August 8th, 2011 My first computer was an IBM 360/50, with 256KB of memory, and about 60MB in on-line disc space and 6 tape drives. It filled a fairly large room in the basement of the Theatre Arts Annex at Dalhousie University. I was 15 at the time, and had to learn to use a Model 029 keypunch so that I could get my programs into a form that the system could read. My first programming language was FORTRAN IV.In my final year at high school, I used a PDP-8/L (with FOCAL) and an HP 2110 (with BASIC). Bob Ammerman • August 8th, 2011 My first computer was a Northstar Horizon. Following that was a Ferguson Big Board system that I built myself. Jooky • August 8th, 2011 My first computer was dial-up terminal that printed on thermal paper. My dad worked for Xerox in Texas and would bring it home occasionally. You could play Chess, Zork, or Star Trek. Second computer was a Timex Sinclair and lasted about two days before I returned it. Then off to college with and Apple 2C, an Amiga 1000, and then finally a PC. It became obvious during College that the PC had taken over and thats what I would ultimately be working with. My favorite was the Amiga. It was so far ahead of its time and some would argue that it's still not obsolete. Bob C • August 8th, 2011 1. Timex Sinclair w/tape drive2. Commodore 64 2-Floppies, 300 Baud Modem, Joystick & Printer3. Packard Bell 486sx With 2x CD ROM Drive & 4 MB RAM 170 MB Hard Drive morondeguise • August 8th, 2011 PHILIPS VideoPAC Brent • August 8th, 2011 The TRS-80 was my first computer too. I still have mine at home in the closet - along with games, joysticks, tape drive etc. I had the 16k model. :) Brainjar • August 8th, 2011 My first home computer was glorious TI 99-4A Texas Instruments excellent home computer. Pure Basic without shortcuts ... (VIC 20 & Commodore 64 style). Execution time 1 second for statement, but all screen pixel reacheable .... I was twenty years old .... and I spended several nights learning programming ... This now is history. Antonio • August 8th, 2011 My first "hand-on" computer was a little bit more than a calculator, the HP-9810 at the high school's Electronics laboratory in 1981... Later on, the school purchased a Commodore PET 8032 and an Apple II, on these computers I started coding. As a Christmas gift, my father purchased a C=64 with floppy disk: that was amazing to me.To date my daughter, as long as other "native digital" can hardly believe that at the times we didn't have the Internet... dogboi • August 8th, 2011 TI 99/4a, then a Commodore 64, then a Commodore Amiga 500. Ah yes, those were the days. Rogelio • August 8th, 2011 Started with a TRS-80 Model I at school and soon with a 16k CoCo 1 (while learning Motorola 68xx programming). Honed my skills on those until I was able to purchase my own, the CoCo's little brother: the MC-10; by the mid 80's I had added a 64k CoCo. Did a minor stint with the TI99/4A and the VIC20 but the 6809 uP had my soul already; tried the IBM PC only to get back to a CoCo 3. Still have all the noted machines setup and running (plus other additions over the years: C64, ST1040, VIC20, Mac SE, Apple IIc...) Chaluta • August 8th, 2011 Commodore 64, with the floppy drive the size of a small toaster oven, tape backup and all the works. Still have it in my closet back at my moms :) Steve Furniss • August 8th, 2011 Commodore PET (Personal Electronic Transactor for those who do not know) - 8k RAM, Cassette tape storage. Excellent computer for its day. I wrote plenty of programs in BASIC and machine language. Then Apple II, then IBM PC... Prune • August 8th, 2011 Newbear 77-68: a kit computer based on the motorola 6800 with 256 bytes of RAM (yes bytes, not even kilobytes).I/O was 2 rows of 8 switches, one row for the address and one for the data input, and a row of 8 leds for data out, with a loudspeake across one of the LEDs for audio out. Amazing what could be done with such a set-up. Later I took the memory up to 16 k, added a cassette recorder for program storage and then added a Creed teleprinter for IO (fiddling those switches got a bit tedious). Next steps included a 5 1/4" floppy drive and an adapted B&W television with a Newbear graphics card, and a digital keyboard. It's all still gathering dust in the attic. Alexander DiMauro • August 8th, 2011 Here was my first, at the tender age of 10: Texas Instruments TI-99/4A Kervin Gomez • August 8th, 2011 My first computer was an Atari 130XE.Developed several programs in BASIC and Assembler. Renee Cousins • August 8th, 2011 My first computer was a TI1000 -- it drove the graphics to my 9-inch B&W "monitor" using the 3.58MHz Z80 CPU, meaning little was left for actual CPU use. I graduated to a VIC20, a CBM64, then my first "real" computer, an Amiga 500. Stuck with Amiga until their demise with my heavily non-stock Amiga 1200 and then switched to Mac. Avoided using Windows until the XP era.Anyone who says that their first computer was an XT or higher, or complains about the tiny 20MB hard drive they had to suffer with, looses extreme geek cred. Seriously. Nunya • August 8th, 2011 And Microsoft was there...... Chris Olson • August 8th, 2011 My first computer was this one: http://oldcomputers.net/osborne.htmlAh, the memories! I had so much fun programming that thing, but not lugging it around! 92K floppies! Two of them!Chris Jack McGuire • August 8th, 2011 You aren't that old. My first computer was a Univac 1108. The terminal was a telex teletype with punched paper tape. Bob Price • August 8th, 2011 Intel iPDS100 with 5-1/4 Floppy, external second floppy drive, 8080 ICE pod, 8051 ICE pod...I still have it William Balthrop • August 8th, 2011 My first computer was built from a kit in 1978. My second computer was a TI99/4. That led to becoming the Senior Technical Editor at 99'er magazine, and then Home Computer Magazine. I wrote a lot of the programs people typed into those little boxes every month. I got a chance to play with the PCjr a few months before it was release down at IBM - Boca Raton, FL. Steve Keller • August 8th, 2011 My first was a Adam by Colicovision. Still have it as something to show others at times. The only thing I don't have is the Black & White 13 inch tv that I used as a monitor. It got me through nursing training many moons ago. LOL Chipper • August 8th, 2011 First was a Vic-20 with tape drive. Later I owned several C-64s and C-128s (set up a BBS on them too) and a TRS-80 Model 100, all before jumping on the IBM-PC bandwagon. Stephen • August 8th, 2011 IBM 1440: 10 millesecond cycle time; around 20 cycles to a typical instruction. 12k of memory. Oh, and even though it was in Germany, it had builtin instructi'''
