title = "Async Disposables The Easy Way | You’ve Been Haacked"
description = "Sometimes you want to ensure that an async method at the end of a block of code no matter what. We can use IAsyncDisposable for that. This post covers a nice helper class for creating ad-hoc IAsyncDisposables"
full_description = '''Async Disposables The Easy Way Dec 10, 2021 abbot csharp suggest edit In the System.Reactive.Disposables namespace (part of Reactive Extensions), there’s a small and useful Disposable class. It has a Create method that takes in an Action and returns an IDisposable instance. When that instance is disposed, the action is called. It’s a nice way of creating an ad-hoc IDisposable. I use them often for creating a scope in code where something should happen at the end of the scope. Here’s an exceedingly trivial example: Console.WriteLine("Working on it..."); using var scope = Disposable.Create( () => Console.WriteLine("Done!")) { // Do stuff. } // scope is disposed and Working on it... is printed to console As trivial as it is, it’s still a little cleaner than the longer form: Console.WriteLine("Working on it..."); try { // Do stuff. } finally { Console.WriteLine("Done!") } It is real handy when implementing a method that returns an IDisposable. Rather than creating a custom class that inherits IDisposable, you can return Disposable.Create. Here’s the code for Disposable we use in Abbot. using System; using System.Threading; namespace Serious; /// <summary> /// Provides a set of static methods for creating Disposables. /// This is based off of /// https://docs.microsoft.com/en-us/previous-versions/dotnet/reactive-extensions/hh229792(v=vs.103) /// </summary> public static class Disposable { /// <summary> /// Creates the disposable that invokes the specified action when disposed. /// </summary> /// <param name="onDispose">The action to run during IDisposable.Dispose.</param> /// <returns>The disposable object that runs the given action upon disposal.</returns> public static IDisposable Create(Action onDispose) => new ActionDisposable(onDispose); class ActionDisposable : IDisposable { volatile Action? _onDispose; public ActionDisposable(Action onDispose) { _onDispose = onDispose; } public void Dispose() { Interlocked.Exchange(ref _onDispose, null)?.Invoke(); } } } What about Async methods? A limitation of IDisposable is that the Dispose method is not async. Suppose you need to make a web request at the end of the scope. You don’t want to use Dispose.Create for that. Fortunately, C# 8.0 introduced the IAsyncDisposable interface for these kind of scenarios. So naturally, I wrote an async analog to Disposable called AsyncDisposable. Yes, I’m good at naming things. Here’s an example of where we use it. When someone issues a command to Abbot in chat, we want Abbot to add a reaction to the user’s message to let the user know Abbot is working on it. When Abbot responds, we remove the reaction. So the code looks something like this (simplified). await AddReactionAsync(message, "robot_face"); await using var scope = AsyncDisposable.Create(async () => RemoveReactionAsync(message, "robot_face")) { // Handle the incoming message } // The reaction is removed here. It makes the code so much cleaner this way. If you try Abbot today, you won’t see this functionality yet because Slack takes 4-6 weeks (or longer) to approve new permissions. We’re waiting with fingers crossed and bated breaths. Here’s the code for AsyncDisposable. using System; using System.Threading; using System.Threading.Tasks; namespace Serious.Tasks; /// <summary> /// Helper class for creating an asynchronous scope. /// A scope is simply a using block that calls an async method /// at the end of the block by returning an <see cref="IAsyncDisposable"/>. /// This is the same concept as /// the <see cref="Disposable.Create"/> method. /// </summary> public static class AsyncDisposable { /// <summary> /// Creates an <see cref="IAsyncDisposable"/> that calls /// the specified method asynchronously at the end /// of the scope upon disposal. /// </summary> /// <param name="onDispose">The method to call at the end of the scope.</param> /// <returns>An <see cref="IAsyncDisposable"/> that represents the scope.</returns> public static IAsyncDisposable Create(Func<ValueTask> onDispose) { return new AsyncScope(onDispose); } class AsyncScope : IAsyncDisposable { Func<ValueTask>? _onDispose; public AsyncScope(Func<ValueTask> onDispose) { _onDispose = onDispose; } public ValueTask DisposeAsync() { return Interlocked.Exchange(ref _onDispose, null)?.Invoke() ?? ValueTask.CompletedTask; } } } I hope you find this useful in your own projects. UPDATE: 2021-12-11 Based on Johaness comment, I made Dispose idempotent. Found a typo or mistake in the post? suggest edit Comments Leave response Remember me 6 responses Johannes • December 11th, 2021 Thanks for sharing. I sometimes find it useful that Rx’s disposables are always idempotent - every call to Dispose except the first one is a no-op (see https://github.com/dotnet/reactive/blob/118476bec440f5ae2a916f8ca2010422a9935c5a/Rx.NET/Source/src/System.Reactive/Disposables/AnonymousDisposable.cs#L37). Also, is there a reason that AddReactionAsync doesn’t return an IAsyncDisposable right away? I find it good practice that when doing something I get back something to undo it. So undoing is basically not possible without doing it. And there’s no need to lookup the undo action. Haacked • December 11th, 2021 @ Johannes thanks for the feedback! I updated the post. Also, is there a reason that AddReactionAsync doesn’t return an IAsyncDisposable right away? Well in our actual code, it returns an object the represents whether or not the operation succeeded, Task. So I don't think I can make that also an `IAsyncDisposable`. I'll probably end up writing a ReactionScope class later that knows how to add and then remove the same reaction. Sebazzz • December 12th, 2021 Must be noted that if you make the disposable a struct, and don’t hide it behind the IDisposable interface, you can save an allocation! Paul • December 13th, 2021 I think the code: await using var scope = AsyncDisposable.Create(async () => RemoveReactionAsync(message, “robot_face”)) Should actually be: await using var scope = AsyncDisposable.Create(async () => await RemoveReactionAsync(message, “robot_face”)) Alois Kraus • December 28th, 2021 I am not sure if this idempotent version is always right. If you are truly async/await you have no races, then there is no point in expecting more callers to the wrapper. But if you are into multithreading then the Dispose/Async calls are flawed. If you e.g. close a file in your dispose method you would expect that other threads can ensure by calling dispose on your wrapper that the file is closed, and it is safe to reopen it. With your version you return early on the second call while the first dispose call can still be running. In some places in RX this might be ok but you should be prepared for embarrasing bugs if multiple threads expect true idempotency. Christof • December 30th, 2021 Is it not necessary to catch a potential exception in AsynDispose and return the proposer task?'''
