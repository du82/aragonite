r 6th, 2010 @Jonas: Installing the extension also adds an "Add Package Reference..." option in VS2010. (Phil mentions it in passing above but doesn't really explain much about it. It's there, though.) You can use either the PowerShell approach or the GUI-style depending on your mood. Keith J. Farmer • October 6th, 2010 Excellent!Need to add NuPack to the VS Extension Manager feed. :)By any chance does NuPack currently add support for adding packages to the machine itself, outside the context of VS or the like, or could it be extended to do so? I'm thinking akin to WebPI or Windows Update.Does it have update- or rename-package facilities? Perhaps optionally alasing a package (eg, to deal with new Magic Unicorn drops that require some work to transition)? Eric Falsken • October 6th, 2010 How do I contribute a package to the library? haacked • October 6th, 2010 @Chris Upgrade your reflector to 6.5. See the FAQ and list of Known Issues.@Paul if someone adds a package for it, sure. We don't yet have a way to dis'''
