["https://haacked.com/archive/2024/12/10/chutes-and-ladder"]
title = "Career Chutes and Ladder | You’ve Been Haacked"
description = "Sometimes stepping off the career ladder is the best move you can make."
full_description = "Career Chutes and Ladder Dec 10, 2024 career suggest edit The career ladder is a comforting fiction we’re sold as we embark on our careers: Start as Junior, climb to Senior, then Principal, Director, and VP. One day, you defeat the final boss and receive a key to the executive bathroom and and join the C-suite. You’ve made it! If you’re lucky, your company supports a tall Individual Contributor (IC) ladder. But often, the next rung swaps your hoodie for a power shirt, suspenders, and management duties. My first job followed this script: developer to team lead to Senior Manager. I was hustling up that ladder. But life isn’t linear. Careers are more like Chutes and Ladders (which the Brits know as Snakes and Ladders, but that messes up my metaphor). Lucky breaks shoot you up; surprises send you sliding down. Those chutes? Not failures. Opportunities. Take my journey. I took a chute from my first job back to an IC role at my second. Climbed back up into management. Took a chute to Microsoft as a Senior Program Manager. Then came another chute: GitHub. I started as a developer, became a manager, then Director of Engineering. After that, I co-founded a startup, took the CTO title, but spent most of my time writing code. It looked like the classic ladder climb, but in startups, titles are smoke and mirrors. So it only counted as a step up if we succeeded. Spoiler: we didn’t. Ladders Are Overrated Ladders are narrow and rigid. Titles—while shiny—hide what matters: the work. They’re bumper stickers for your career. Nice for signaling, but they don’t tell the whole story. As Director, I mentored teams and focused on broad initiatives. But over time, I started to miss the tech. The longer I stayed out of writing production code, the more disconnected I felt. As a CTO, I got back to coding and loved it. When the startup failed, I promised myself at least a year off to reflect before jumping into something new. Growth on the Slide Over a year later, I’ve been thinking about my next move. It turns out nobody will pay me to be a man of leisure. Conventional wisdom (and ego) says aim higher: VP of Software Development or CTO at an established company. The irony of big titles is they mean more power at work, but less power over your time. For me, my recent life circumstances make time autonomy among my top priorities. Sure, big titles pay well, but maximizing income isn’t my goal. Here’s what I realized: By my own definition, I’ve succeeded. I’ve been part of great teams, built great products, and helped grow companies. I have nothing left to prove. I don’t need a lofty title or a giant paycheck (but I wouldn’t turn one down either). So, once again, I’m setting aside my pride and stepping off the ladder. Next year on January 6th I start a new IC role. Details to come, but I’m thrilled to be back in the trenches, building and learning. It’s a place that treats its employees like adults and gives me the autonomy to structure my day as I see fit. This isn’t about rejecting leadership. It’s about recalibrating. Leadership is broad. It’s guiding organizations or leading by example. I think it’s healthy—even advantageous—to bounce between IC and management roles over the course of a career. Life changes. I might return to management someday. Or not. The point is to stay open to what fits now. Your Move If you’re staring at a chute, wondering if stepping off the ladder will hurt you, consider this: maybe it’s not a setback. Maybe it’s a shortcut to what you really want. Careers aren’t about perfect titles. They’re about collecting experiences, relationships, and skills that shape you. Sometimes, the most important moves don’t look like progress—until you’re somewhere unexpected, doing work that matters. Spin the dial. Take the slide. Even in Chutes and Ladders, the winner isn’t who climbs highest. It’s who enjoys the game. At least, that’s what I told my friends when they beat me. Found a typo or mistake in the post? suggest edit Comments Leave response Remember me 2 responses Abdu • December 12th, 2024 Congratulations Phil. You tried the different experiences and roles and you will be back to what you like the most. Titles are not everything. Bob Reselman • December 16th, 2024 As Robert Sapolsky reports about baboons, the higher a baboon goes up in the hierarchy, the more stressful life becomes: https://www.psychiatrypodcast.com/psychiatry-psychotherapy-podcast/episode-195-robert-sapolsky-baboons-stress-research-connection-and-determinism"
