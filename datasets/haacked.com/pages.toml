full_description = "Build an ASP.NET Core Update Panel with Vanilla JavaScript in Four Easy Steps Nov 20, 2019 aspnet js suggest edit Sometimes you just need to submit a form and update a portion of your web page without a lot of fuss and muss. Today, you have a lot of options for dynamically updating the DOM based on changes made on the server. You could use React, Vue, Angular, SignalR, and Blazor. Read More The Bot That Helps You Merge Aug 26, 2019 git semantic suggest edit Developer tools that understand code semantics have a lot of potential. They have potential to make developers more productive and reduce the friction and drudgery of our craft. But it can be difficult to put these tools to use in practice. Many of them require a steep learning curve to use. It would be nice if we could automate the benefits of some of these tools. You can see where I’m going with this. Read More Global Query Filters for Interfaces Jul 29, 2019 data ef suggest edit UPDATE: At the bottom is an update that works for EF Core 5.0.2 and above that doesn’t rely on internal interfaces. Read More Should You Flow External Claims On Every Login? Jul 17, 2019 aspnet security suggest edit In my last post, I showed how to flow claims from an external identity provider (also referred to as a login provider) to your application. My post walks through how to bring over the claims every time the user logs in. But why would I want to do this? Read More Flow External Claims to the Main Identity Jul 16, 2019 aspnet security suggest edit I love it when a website lets me use my Google, GitHub, or Facebook account to log in. Chances are, I’m already logged into those sites, so it’s one click to log into a new site. This is a great experience for users. It reduces the friction to registration and loggin in to your site. They’re less likely to clam up. Read More Deploying ASP.NET Core From A Zip File on Azure Jul 12, 2019 aspnet azure suggest edit Azure has a neat feature that runs Azure Functions from a package file (aka a zip file). This same feature also applies to Azure Web Apps, though you wouldn’t know it from the documentation. The Run from Package docs only mention Azure Functions. The GitHub issue that announced the feature makes it clear this also applies to Web Apps. Read More When Git Resolves Changes It Shouldn't Jun 24, 2019 git semantic suggest edit When you merge two branches, there may be conflicting changes between the branches. Git can often resolve these differences without intervention. For example, when each branch has changes to different files or lines of code. Read More Banish Merge Conflicts With Semantic Merge Jun 17, 2019 git semantic suggest edit Raise your hand if you enjoy merge conflicts. I’ll go out on a limb and guess that nobody has a hand up. If you do have your hand up - first, you look silly right now. I can’t see you. And second, you’re being contrarian. Nobody likes merge conflicts. They’re a hassle. Read More Package Manager Security Jun 11, 2019 nuget security oss suggest edit It happened again. A group of hackers targeted another cryptocurrency wallet via a malicious NPM package. The good news is that this attempt was foiled. Read More Discuss amongst yourselves on GitHub Jun 10, 2019 github oss tip suggest edit When I ran the Client Apps team at GitHub, I wrote a weekly “newsletter” to the team. I named it the CACAW which stood for Completely Awesome Client Apps Weekly. The name gave me an excuse to highlight each letter with a crow themed image. Read More Suggesting Changes on GitHub Jun 3, 2019 github oss tip suggest edit When you see a small bug or error in a repository, a common refrain is to submit a pull request to fix it. To submit a pull request with a correction is an act of kindness to the maintainers. It allows the maintainers to review the change and accept it with a click. Read More GitHub for Dummies May 30, 2019 github oss books suggest edit Millions of years ago, Zach Holman gave a great talk about How GitHub uses GitHub to build GitHub. The talk focused a lot on GitHub’s approach to coordinating work on github.com, the software. Read More Maintainer burnout and package security May 28, 2019 nuget security oss suggest edit I ended my last post on package security through fingerprints with this ominous note… Read More Write Every Day May 24, 2019 personal meta suggest edit My head is crammed with ideas just jostling to see the light of day. I imagine them pounding the inside of my cranium screaming LET US OUT!. And in response, I say the same thing I always say. Not yet. It’s counter productive. Read More Better Security Through Package Fingerprints May 13, 2019 nuget security oss suggest edit It seemed like an innocuous enough update. Someone yanked bootstrap-sass ruby gem version 3.2.0.2 and published 3.2.0.3. Ruby gems more or less follows the SemVer versioning scheme (albeit with an extra version number). An increment of the patch number communicates that this release should be a safe bug fix update. The command, bundle update --patch, should be safe as it updates to the next patch version which should be safe. Read More Package Author Identity through Social Proofs May 10, 2019 nuget security oss suggest edit In my post on Why NuGet Package Signing Is Not Yet For Me I noted… Read More Why NuGet Package Signing Is Not (Yet) for Me Apr 3, 2019 nuget security oss suggest edit Strap in for a rollicking exploration of the NuGet package signing feature. What is the feature and what is it good for? And does it live up to its purpose? Yes, my friends, I know how to party. Read More Managing Risk Feb 19, 2019 work consulting management suggest edit Every project risks failure to some degree or other. There’s the risk of delivering late. The risk of not being able to deliver at all. Or the risk that when you do deliver, it solves the wrong problem. It’s a risky business, but not the kind with Tom Cruise lip-synching in his underwear. When you work on a project, it’s important to be aware of and manage risk. There are several good tools for doing this. Read More Include my Git Aliases Feb 14, 2019 git aliases suggest edit I’m a big fan of Git aliases as a means of improving your developer workflow when using Git. They are great for automating common tasks. They also can help make sense of the byzantine set of options Git has. Read More SemVer's New Maintainers Feb 11, 2019 semver suggest edit For several years now, I’ve been the maintainer of the SemVer specification. It’s been an honor and privilege to be in this position. But I’ll be honest, it’s also an enormous responsibility and a big pain in the ass. This is why I’m happy to say that I am stepping down as the maintainer of SemVer and passing the torch to a team of maintainers better suited to direct its future. Now the pain (and honor, don’t forget the honor) can be distributed among multiple people, and not focused on just one. Read More « Prev 1 2 3 4 5 ... 103 Next » Phil Haack haacked haacked @haacked@hachyderm.io rss You've been Haacked is a blog about Technology, Software, Management, and Open Source. It's full of good stuff."
