full_description = '''Set up a smoking Git shell on Windows Oct 29, 2015 git github shell suggest edit GitHub Desktop, the application formerly known as GitHub for Windows, is a streamlined GUI that makes it easy to contribute to repositories on GitHub. Read More The Meaning of Work Oct 21, 2015 work management motivation suggest edit The TED Radio Hour podcast has an amazing episode entitled “The Meaning of Work”. It consists of four segments that cover various aspects of finding meaning and motivation at work. You should definitely listen to it, but I’ll provide a brief summary here of some points I found interesting. Read More Moneyball of Hiring Sep 8, 2015 hiring diversity management suggest edit The shaman squatted next to the entrails on the ground and stared intently at the pattern formed by the splatter. There was something there, but confirmation was needed. Turning away from the decomposing remains, the shaman consulted the dregs of a cup of tea, searching the shifting patterns of the swirling tea leaves for corroboration. There it was. A decision could be made. “Yes, this person will be successful here. We should hire this person.” Read More A better 404 page and redirects with GitHub Pages Jul 28, 2015 github jekyll suggest edit A while back I migrated my blog to Jekyll and GitHub Pages. I worked hard to preserve my existing URLs. Read More The Open Sourcing of the GitHub Extension for Visual Studio Jul 20, 2015 github git oss suggest edit Writing extensions to Visual Studio is really hard. As in turn your hair gray hard. In fact, I now have gray hairs and I didn’t when I started the GitHub Extension for Visual Studio project (true story). Read More Tupac and HoloLens are not Holograms Jul 12, 2015 science suggest edit This past week I learned a new party trick. I can turn a holographic researcher beet red by simply referencing Tupac’s Hologram. It’s not because they identify strongly with East Coast hip-hop. Rather, it has to do with calling it a hologram in the first place. Read More Git Alias To Migrate Commits To A Branch Jun 29, 2015 github git aliases suggest edit Show of hands if this ever happens to you. After a long day of fighting fires at work, you settle into your favorite chair to unwind and write code. Your fingers fly over the keyboard punctuating your code with semi-colons or parentheses or whatever is appropriate. Read More The Getting Better Moment Jun 15, 2015 career suggest edit The beads of sweat gathered on my forehead were oddly juxtaposed against the cool temperature of the air conditioned room. But there they were, caused by the heat of the CTO’s anger. I made a sloppy mistake and now sat in his office wondering if I was about to lose my job. My first full-time job. I recently found some archival footage of this moment. Read More Puerto Rico May 14, 2015 conferences travel personal suggest edit This past week I had the great pleasure to speak in Puerto Rico at their TechSummit conference. Read More GitHub Inside Your Visual Studio Apr 30, 2015 github visualstudio suggest edit I heard you liked GitHub, so today my team put GitHub inside of your Visual Studio. This has been a unique collaboration with the Visual Studio team. In this post, I’ll walk you through installation and the features. I’ll then talk a bit about the background for how this came to be. Read More Download all your NuGet Package Licenses Mar 28, 2015 oss nuget licensing suggest edit The other day I was discussing the open source dependencies we had in a project with a lawyer. Forgetting my IANAL (I am not a lawyer) status, I made some bold statement regarding our legal obligations, or lack thereof, with respect to the licenses. Read More Management Bullshit Mar 25, 2015 management suggest edit A lot of the advice you see about management is bullshit. For example, I recently read some post, probably on some pretentious site like medium.com, about how you shouldn’t send emails late at night if you’re a manager because it sends the wrong message to your people. It creates the impression that your people should be working all the time and destroys the idea of work-life balance. Read More The Fringe of .NET Mar 10, 2015 conferences dotnet oss suggest edit Unless you live in a cave, you are probably aware of the large leaps forward Microsoft and .NET has made in the open source community. Read More The Inevitability of Failure and Importance of Repair Feb 7, 2015 management suggest edit I’m often amazed at the Sisyphean lengths people will go to try and prevent failure, yet prepare so little for its inevitability. Ed Catmull, president of Pixar, noted the following in his book Creativity Inc. Read More Unwrap MEF composition exceptions Dec 9, 2014 csharp suggest edit There are times when the Managed Extensibility Framework (aka MEF, the close relative of “Meh”) cannot compose a part. In those cases it’ll shrug (¯\(ツ)/¯) and then take a dump on your runtime execution by throwing a CompositionException. Read More Git and GitHub Resources Dec 3, 2014 git github suggest edit Learning Git and GitHub can be daunting if you’re new to it. I recently gave a small presentation where I pretty much firehosed a group of people about Git and GitHub for one hour. I felt bad that I could only really scratch the surface. Read More Unit tests that require the STA Thread Nov 20, 2014 csharp tdd suggest edit If you’ve ever written a unit test that instantiates a WPF control, you might have run into one of the following errors: Read More Avoid async void methods Nov 11, 2014 csharp concurrency suggest edit Repeat after me, “Avoid async void!” (Now say that ten times fast!) Ha ha ha. You sound funny. Read More Classic Manhattan Oct 25, 2014 personal suggest edit For most of my life, I was a man without a drink. Read More Podcasts Sep 8, 2014 podcast suggest edit I love to communicate through the written word because it offers me a chance to really consider what I say, and then rewrite it, and then rewrite it again. And in the end, I still don’t communicate as clearly and eloquently as I would like. Read More « Prev 1 ... 6 7 8 9 10 ... 103 Next » Phil Haack haacked haacked @haacked@hachyderm.io rss You've been Haacked is a blog about Technology, Software, Management, and Open Source. It's full of good stuff.'''
