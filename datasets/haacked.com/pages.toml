description = "You’ve been Haacked is a blog about Technology, Software, Management, and Open Source. It’s full of good stuff."
full_description = "Trying Medium Aug 16, 2017 personal blogging meta suggest edit I started my first blog at haack.org some time in the year 2000. You can still see pieces of it in the Internet Archive Wayback machine. Read More The Moment Aug 16, 2017 personal suggest edit Twin Falls lies around a forty minute drive east of Bellevue, Washington. From the trail head, the path leads to views of three separate waterfalls. Yes, three. “Twin Falls” has a nicer ring to it than “Triplet falls.” Read More Auditing ASP.NET MVC Actions Aug 10, 2017 aspnetmvc security suggest edit Phil Haack is writing a blog post about ASP.NET MVC? What is this, 2011? Read More GitHub Beyond Your Browser May 16, 2017 github xplat tools suggest edit One of my goals at GitHub is to make GitHub more approachable to developers. If you use GitHub, I want you to have tools that complement the way you work and help you to be more effective. In some cases that’s integrating directly in your Editor or IDE of choice. In other cases, it’s offering tools that work side-by-side with your existing tools. Read More On .NET and Other Things Feb 14, 2017 github dotnet aspnet microsoft suggest edit Yesterday was the 15th anniversary of .NET’s debut to the world. And Visual Studio was first released twenty years ago! In a recent episode of On .NET, I went to the Channel 9 studios to talk a bit about the history of .NET, my work at GitHub, and challenges to .NET’s future success among other random diversions. Read More Git Alias to browse Jan 4, 2017 git aliases suggest edit Happy New Year! I hope you make the most of this year. To help you out, I have a tiny little Git alias that might save you a few seconds here and there. Read More The Hard Skills Oct 12, 2016 management suggest edit On Tuesday, November 8, 2016 I’ll be giving a talk entitled “Social Coding for Effective Teams and Products” at QCon SF as part of the “Soft Skills” track. If you happen to be in San Francisco at that time, come check it out. Read More Scientist.NET 1.0 released! Sep 29, 2016 github csharp dotnet scientist suggest edit In the beginning of the year I announced a .NET Port of GitHub’s Scientist library. Since then I and several contributors from the community (kudos to them all!) have been hard at work getting this library to 1.0 status. Ok, maybe not that hard considering how long it’s taken. This has been a side project labor of love for me and the others. Read More Working at GitHub Sep 6, 2016 management github hiring suggest edit I’m coming on five years at GitHub (in December) and I thought I’d write a bit about what I’ve been up to lately and the fact that several of my teams are hiring. Five years passes by so quickly, right? I still get emails for feature requests on ASP.NET MVC. I always reply that the team would be happy to implement all of the suggestions and to just check the repository in a week’s time. I’m sure the team loves me for that. Read More Cruising Aug 24, 2016 management personal suggest edit Last week my family and I went on a cruise to Alaska with four other families and we didn’t die. Not that we should expect to die on a cruise, but being confined with a bunch of kids on a giant hunk of steel has a way of making one consider one’s mortality. Read More Building an Atom Package in ES6 May 11, 2016 nuget suggest edit The tagline for the Atom text editor is “A hackable text editor for the 21st Century”. As a Haack, this is a goal I can get behind. Read More A Billion Is Cool May 11, 2016 nuget suggest edit Yesterday, the NuGet team announced that NuGet.org reached one billion package downloads! Read More Thank You For Your Pull Request Apr 28, 2016 code-review github suggest edit As an open source maintainer, it’s important to recognize and show appreciation for contributions, especially external contributions. Read More A Subtle Case Sensitivity Gotcha with Regular Expressions Feb 29, 2016 regex suggest edit Some people, when confronted with a problem, think “I know, I’ll use regular expressions.” Now they have two problems. - Jamie Zawinski Read More Pitfalls of Unlimited Vacations Feb 18, 2016 management vacation culture suggest edit Vacation, All I ever wanted Vacation, Had to get away Vacation, Meant to be spent alone Lyrics by The Go Go’s Read More Semver Deep Links Jan 20, 2016 semver suggest edit A long time request of http://semver.org/ (just shy of five years!) is to be able to link to specific headings and clauses of the Semver specification. For example, want to win that argument about PATCH version increments? Link to that section directly. Read More A .NET port of Scientist Jan 20, 2016 github csharp dotnet scientist suggest edit Over on the GitHub Engineering blog my co-worker Jesse Toth published a fascinating post about the Ruby library named Scientist we use at GitHub to help us run experiments comparing new code against the existing production code. Read More Try it and I'll kill you Jan 1, 2016 personal suggest edit I have a big problem as a dad. Read More A haackedy 2015 Dec 31, 2015 personal meta suggest edit I planned to skip the tried and true year in review post because who reads such drivel anyways, amirite? They feel like one big exercise in vanity. Read More To String or to string Dec 16, 2015 csharp design code suggest edit Like many developers, I have many strong opinions about things that really do not matter. Even worse, I have the vanity to believe other developers want to read about it. Read More « Prev 1 2 3 4 5 ... 103 Next » Phil Haack haacked haacked @haacked@hachyderm.io rss You've been Haacked is a blog about Technology, Software, Management, and Open Source. It's full of good stuff."
