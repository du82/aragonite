full_description = "Henrique Dias (Photo) mail@hacdias.com PGP keyHenrique is a software engineer who cares about the web, decentralization, identity, user agency, and making impactful tools for developers and users.Hi 👋, I’m Henrique, a Portuguese 🇵🇹 guy living in The Netherlands 🇳🇱. I’m a software engineer 🛠 who cares about the web, decentralization, identity, user agency, and making impactful tools for developers and users. In my spare time, I enjoy cycling, taking photographs, programming, or a nice cup of coffee or tea. Welcome to my Internet peninsula!🪴 Freshly Planted ⇢Elizabeth Pillow 2025-02-14Eurostar to London 2025-02-13Optimistic Wrist 2025-02-12Recently in January '25 2025-01-31Running 2025-01-23Year in Music '24 2025-01-03Year in Popcorn '24 2025-01-01Year in Review '24 2024-12-31🎞️ Freshly Captured ⇢🌟 Favourite WritingsProcedural Map Generation With Noise 2023-06-24The Magic of Fractal Snowflakes 2021-02-15Back to the Web of the 90s 2020-05-31First Attempt at Pixel Art 2019-04-18📸 Favourite Captures"
