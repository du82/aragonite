["https://hacdias.com/2025/01/03/year-in-music"]
title = "Year in Music '24 - Henrique Dias"
description = "Similarly to previous years, it’s time to share my musical habits throughout 2024. Around a month ago, I published my Spotify Wrapped 🎁, but, as usual, I don’t trust it completely. If they’re sharing it before the end of the year, how can it successfully show the statistics for the whole year? Here I am again, with my (almost) complete data from Last.fm."
full_description = "Year in Music '24Published on 3 January 2025PermalinkAuthored by Henrique Dias (Photo)img.cute-listener{max-width:100px;margin-top:0;margin-right:1rem} Similarly to previous years, it’s time to share my musical habits throughout 2024. Around a month ago, I published my Spotify Wrapped 🎁, but, as usual, I don’t trust it completely. If they’re sharing it before the end of the year, how can it successfully show the statistics for the whole year? Here I am again, with my (almost) complete data from Last.fm.📊 StatisticsJust like in previous years, let’s start with some quick statistics: in 2024, I scrobbled 17 491 times, with an average of 48 scrobbles per day. In total, I listened to 40 days, 15 hours of music. I listed to the most music on Mondays, and peaked on early afternoon. That’s quite similar to last year.According to Last.fm, I’ve listened to less music than in the previous year. This was also the case last year, and I still think that the reason I mentioned last year is still what explains it: we’ve got a vinyl player, and we listen quite a lot on it. And I usually don’t track those. Also, my partner sometimes plays music on his Spotify at home, so that doesn’t get tracked for me either.🎤 ArtistsMy top artists list changed a bit this year, but not in the sense that there were new artists. The change mostly regards the order of the artists on said list. In any case, my top 10 includes 4 Dutch-speaking artists: Merol, Bente, Lola Cedès and Froukje. If we look further, there’s even more.The other positions are occupied by artists that have consistently been in my top most listened artists in the past years, including Marina and Lady Gaga. Marina had been the first in previous years, and it seems like she’s back.Top 50 ArtistsArtistScrobblesMarina905 scrobblesMerol678 scrobblesLady Gaga656 scrobblesBente627 scrobblesLola Cedès543 scrobblesFroukje534 scrobblesChristiaan Bloo501 scrobblesBillie Eilish445 scrobblesDua Lipa443 scrobblesAllie X356 s