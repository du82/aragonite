t possible to attend all of them unfortunately. On the positive side, we managed to always sell the tickets 🎟️.Overall, it was a nice “musical year” 🎵, and it seems that my musical taste is quite stable over the past years. And the presence of Dutch music too! In general, I keep hovering around the pop genre. Let’s see what 2025 will bring!🏷️ Tags Year in Music💬 Reply E-Mail, Mastodon, Bluesky, Webmentions"
