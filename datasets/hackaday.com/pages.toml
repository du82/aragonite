full_description = "Lorem Ipsum 36? Dolor Sit Amet Keyboard! 10 Comments by: Kristina Panos February 6, 2025 Title: Copy Short Link: Copy You know, it’s a tale as old as custom mechanical keyboards. [penkia] couldn’t find any PCBs with 36 keys and Gateron low-profile switch footprints, so they made their own and called it the LoremIpsum36. Isn’t it lovely? This baby runs on an RP2040, which sits flush as can be in a cutout in the PCB. This maneuver, along with the LP switches in hard-to-find SK-33 sockets results in quite the thin board. [penkia] says that despite using a 3 mm tray for added rigidity, the entire thing is thinner than the Nuphy Air60 v2, which is just over half an inch (13.9 mm) thick. For keycaps, [penkia] has used both XVX profile and FKcaps’ LPF. And yeah, that area in the middle is crying out for something; maybe a trackball or something similar. But [penkia] is satisfied with it as-is for the first version, so we are, too. Do you like 36-key boards, but prefer curves? Check out the Lapa keyboard, which doubles as a mouse. Posted in Peripherals Hacks, Raspberry PiTagged Gateron LP switches, low-profile, monoblock split, raspberry pi, rp2040, split keyboard strawberrymortallyb0bcea48e7 says: February 6, 2025 at 4:15 am Might as well go split colemak if you put this much effort in. Report comment Reply Sykobee says: February 6, 2025 at 5:36 am I love the cute tiny keyboards but the reality is the combo-keys required to use them are a real pain, which is just my opinion of course – i’m sure if you can put the time in to get used to it then it is good. Report comment Reply BT says: February 6, 2025 at 5:45 am I’m the opposite, I use a max fat Sun workstation keyboard with extra keys for cut, copy, paste, save etc Report comment Reply Greg A says: February 6, 2025 at 8:10 am yeah i can see the argument for chording if you’re making like a truly portable pocket keyboard (like the twiddler) but for desktop use…i really don’t see the appeal. i mean i guess i do see the appeal. if you want to make something “radically different”, then throwing out the practical rules that make every other keyboard look the same is a good first step…just make something impractical :) Report comment Reply"
