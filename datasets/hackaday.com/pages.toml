title = "Piano Gets An Arduino Implant | Hackaday"
description = "[Paul] likes his piano, but he doesn’t know how to play it. The obvious answer: program an Arduino to do it. Some aluminum extrusion and solenoids later, and it was working. Well, perhaps not…"
full_description = "Piano Gets An Arduino Implant 4 Comments by: Al Williams February 16, 2025 Title: Copy Short Link: Copy [Paul] likes his piano, but he doesn’t know how to play it. The obvious answer: program an Arduino to do it. Some aluminum extrusion and solenoids later, and it was working. Well, perhaps not quite that easy — making music on a piano is more than just pushing the keys. You have to push multiple keys together and control the power behind each strike to make the music sound natural. The project is massive since he chose to put solenoids over each key. Honestly, we might have been tempted to model ten fingers and move the solenoids around in two groups of five. True, the way it is, it can play things that would not be humanly possible, but ten solenoids, ten drivers, and two motors might have been a little easier and cheaper. The results, however, speak for themselves. He did have one problem with the first play, though. The solenoids have a noticeable click when they actuate. The answer turned out to be orthodontic rubber bands installed on the solenoids. We aren’t sure we would have thought of that. Player pianos, of course, are nothing new. And, yes, you can even make one with a 555. If a piano isn’t your thing, maybe try a xylophone instead. Posted in Arduino Hacks, Musical HacksTagged piano, solenoid jbx says: February 16, 2025 at 6:54 am “ten solenoids, ten drivers, and two motors might have been a little easier and cheaper” No, you need ten motors to move each solenoid independently, like the fingers on each hand – but no finger play piano like a solenoid ! Report comment Reply AZdave says: February 16, 2025 at 10:39 am Yeah, that was a pretty obvious mistake. Not sure what Al Williams was thinking. Report comment Reply Dan says: February 16, 2025 at 11:37 am Ah, the lovely clack of solenoids… with some piano in the background. Until someone invents a silent solenoid, this is not the way to put an instrument under software control. Report comment Reply"
