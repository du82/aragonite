full_description = "Plastic On The Mind: Assessing The Risks From Micro- And Nanoplastics February 12, 2025 by Maya Posch 41 Comments Perhaps one of the clearest indications of the Anthropocene may be the presence of plastic. Starting with the commercialization of Bakelite in 1907 by Leo Baekeland, plastics have taken the world by storm. Courtesy of being easy to mold into any imaginable shape along with a wide range of properties that depend on the exact polymer used, it’s hard to imagine modern-day society without plastics. Yet as the saying goes, there never is a free lunch. In the case of plastics it would appear that the exact same properties that make them so desirable also risk them becoming a hazard to not just our environment, but also to ourselves. With plastics degrading mostly into ever smaller pieces once released into the environment, they eventually become small enough to hitch a ride from our food into our bloodstream and from there into our organs, including our brain as evidenced by a recent study. Multiple studies have indicated that this bioaccumulation of plastics might be harmful, raising the question about how to mitigate and prevent both the ingestion of microplastics as well as producing them in the first place. Continue reading “Plastic On The Mind: Assessing The Risks From Micro- And Nanoplastics” → Posted in Current Events, Featured, Interest, Original Art, Science, SliderTagged microplastics How Magnetic Fonts Twisted Up Numbers And Saved Banking Forever February 10, 2025 by Lewin Day 47 Comments If you’ve ever looked at the bottom of a bank check, you probably glanced over some strangely formed numbers? If you’re a fan of science fiction or retro computers, you’ve probably spotted the same figures on any number of books from the 1980s. They’re mostly readable, but they’re chunky and thin in places you don’t expect. Those oddball numerals didn’t come from just anywhere—they were a very carefully crafted invention to speed processing in the banking system. These special fonts were created to be readable both by humans and machines—us with our eyes, and the computers with magnetic sensors. Let’s explore the enigmatic characters built for Magnetic Ink Character Recognition (MICR). Continue reading “How Magnetic Fonts Twisted Up Numbers And Saved Banking Forever” → Posted in Featured, Interest, Original Art, SliderTagged banking, check, checks, cheques, cmc-7, e-13b, finance, financial system"
