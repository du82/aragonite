full_description = "How Do We Deal With Microplastics In The Ocean? February 6, 2025 by Lewin Day 49 Comments Like the lead paint and asbestos of decades past, microplastics are the new awful contaminant that we really ought to do something about. They’re particularly abundant in the aquatic environment, and that’s not a good thing. While we’ve all seen heartbreaking photos of beaches strewn with water bottles and fishing nets, it’s the invisible threat that keeps environmentalists up at night. We’re talking about microplastics – those tiny fragments that are quietly infiltrating every corner of our oceans. We’ve dumped billions of tons of plastic waste into our environment, and all that waste breaks down into increasingly smaller particles that never truly disappear. Now, scientists are turning to an unexpected solution to clean up this pollution with the aid of seashells and plants. Continue reading “How Do We Deal With Microplastics In The Ocean?” → Posted in Current Events, Featured, Science, SliderTagged cellulose, chitin, foam, microplastics, ocean, plastic, science Reinforcing Plastic Polymers With Cellulose And Other Natural Fibers September 9, 2024 by Maya Posch 10 Comments While plastics are very useful on their own, they can be much stronger when reinforced and mixed with a range of fibers. Not surprisingly, this includes the thermoplastic polymers which are commonly used with FDM 3D printing, such as polylactic acid (PLA) and polyamide (PA, also known as nylon). Although the most well-known fibers used for this purpose are probably glass fiber (GF) and carbon fiber (CF), these come with a range of issues, including their high abrasiveness when printing and potential carcinogenic properties in the case of carbon fiber. So what other reinforcing fiber options are there? As it turns out, cellulose is one of these, along with basalt. The former has received a lot of attention currently, as the addition of cellulose and similar elements to thermopolymers such as PLA can create so-called biocomposites that create plastics without the brittleness of PLA, while also being made fully out of plant-based materials. Regardless of the chosen composite, the goal is to enhance the properties of the base polymer matrix with the reinforcement material. Is cellulose the best material here? Continue reading “Reinforcing Plastic Polymers With Cellulose And Other Natural Fibers” → Posted in Current Events, Featured, Interest, News, SliderTagged 3d printer filament, cellulose, composite filament, FDM"
