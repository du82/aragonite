title = "Finance | Hackaday"
full_description = "How Magnetic Fonts Twisted Up Numbers And Saved Banking Forever February 10, 2025 by Lewin Day 47 Comments If you’ve ever looked at the bottom of a bank check, you probably glanced over some strangely formed numbers? If you’re a fan of science fiction or retro computers, you’ve probably spotted the same figures on any number of books from the 1980s. They’re mostly readable, but they’re chunky and thin in places you don’t expect. Those oddball numerals didn’t come from just anywhere—they were a very carefully crafted invention to speed processing in the banking system. These special fonts were created to be readable both by humans and machines—us with our eyes, and the computers with magnetic sensors. Let’s explore the enigmatic characters built for Magnetic Ink Character Recognition (MICR). Continue reading “How Magnetic Fonts Twisted Up Numbers And Saved Banking Forever” → Posted in Featured, Interest, Original Art, SliderTagged banking, check, checks, cheques, cmc-7, e-13b, finance, financial system Buy A Piece Of The Pi? November 30, 2021 by Jenny List 62 Comments The various companies and organisations that supply our community have achieved differing levels of success, with some staying as kitchen-table operations and others reaching the giddy heights of multinational commerce. Perhaps none has risen so far as Raspberry Pi though, as there are reports that the developer of single board computers might be seeking a £400m listing on the London Stock Exchange some time next year. The news is that they have sought the advice of investment bankers over the possibility of a float, seeking to secure further investment to further develop their product portfolio. We’re not investment advisers here at Hackaday so we’re not going to suggest whether or not to bet your shirt on Pi shares, instead our interest lies in what this might mean for their family of products. It’s an inevitable process for any start-up that achieves major success that it will over time progress from being directed by vision to being directed by commerce, and perhaps a listing could be the culmination of this process. It’s fair to say that we tinkerers probably represent less of a market than education or industry to the Pi folks, so how might we win or lose when the suits take the helm? Continue reading “Buy A Piece Of The Pi?” → Posted in Raspberry PiTagged finance, raspberry pi, stock market"
