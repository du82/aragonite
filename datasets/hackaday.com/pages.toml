title = "Curious Claim Of Conversion Of Aluminium Into Transparent Aluminium Oxide | Hackaday"
description = "Sometimes you come across a purported scientific paper that makes you do a triple-check, just to be sure that you didn’t overlook something, as maybe the claims do make sense after all. Such …"
full_description = "Curious Claim Of Conversion Of Aluminium Into Transparent Aluminium Oxide 12 Comments by: Maya Posch February 15, 2025 Title: Copy Short Link: Copy Sometimes you come across a purported scientific paper that makes you do a triple-check, just to be sure that you didn’t overlook something, as maybe the claims do make sense after all. Such is the case with a recent publication in the Langmuir journal by [Budlayan] and colleagues titled Droplet-Scale Conversion of Aluminum into Transparent Aluminum Oxide by Low-Voltage Anodization in an Electrowetting System. Breaking down the claims made and putting them alongside the PR piece on the [Ateneo De Manila] university site, we start off with a material called ‘transparent aluminium oxide’ (TAlOx), which only brings to mind aluminium oxynitride, a material which we have covered previously. Aluminium oxynitride is a ceramic consisting of aluminium, oxygen and nitrogen that’s created in a rather elaborate process with high pressures. In the paper, however, we are talking about a localized conversion of regular aluminium metal into ‘transparent aluminium oxide’ under the influence of the anodization process. The electrowetting element simply means overcoming the surface tension of the liquid acid and does not otherwise matter. Effectively this process would create local spots of more aluminium oxide, which is… probably good for something? Combined with the rather suspicious artefacts in the summary image raising so many red flags that rather than the ‘cool breakthrough’ folder we’ll be filing this one under ‘spat out by ChatGPT’ instead, not unlike a certain rat-centric paper that made the rounds about a year ago. Posted in ScienceTagged aluminium CH says: February 15, 2025 at 10:46 pm Perhaps ChatGPT watched too many star trek movies… Scottie and the mouse was quite amusing. Report comment Reply Iain says: February 15, 2025 at 11:11 pm I’ll agree that the cover image looks a bit odd, but I don’t think the chemistry is too weird. They are turning a 100 nm film of aluminium (so about the same thickness as gold leaf) into its (hydr)oxide, which is transparent. It’s not turning a large chunk of aluminium transparent, or into some nitride (which is never mentioned in the paper?), just a thin layer on a glass slide. Report comment Reply"
