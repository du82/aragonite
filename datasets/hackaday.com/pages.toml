full_description = "How Magnetic Fonts Twisted Up Numbers And Saved Banking Forever February 10, 2025 by Lewin Day 47 Comments If you’ve ever looked at the bottom of a bank check, you probably glanced over some strangely formed numbers? If you’re a fan of science fiction or retro computers, you’ve probably spotted the same figures on any number of books from the 1980s. They’re mostly readable, but they’re chunky and thin in places you don’t expect. Those oddball numerals didn’t come from just anywhere—they were a very carefully crafted invention to speed processing in the banking system. These special fonts were created to be readable both by humans and machines—us with our eyes, and the computers with magnetic sensors. Let’s explore the enigmatic characters built for Magnetic Ink Character Recognition (MICR). Continue reading “How Magnetic Fonts Twisted Up Numbers And Saved Banking Forever” → Posted in Featured, Interest, Original Art, SliderTagged banking, check, checks, cheques, cmc-7, e-13b, finance, financial system"
