title = "Logo | Hackaday"
full_description = "A Nine-Year-Old’s Z80 Drawing Program March 16, 2024 by Al Williams 23 Comments Full disclosure: [Óscar] isn’t nine now, but he was in 1988 when he wrote LOCS, a drawing program in Z80 assembly modeled after Logo. You can see a demo of the system in the video below. You might wonder why you’d want to study a three-decade-old program written for a CPU by a nine-year-old almost five decades ago. Well, honestly, we aren’t sure either. But it did get us thinking. Kids today are computer savvy and have hardware that would seem to be alien tech in 1988. How many of them could duplicate this feat? Now, how many could do it in assembly language? LOCS had a few simple commands and was sort of a stripped-down scripting language. The BORRA command clears the screen. TORTUGA centers the turtle. PT (pone tortuga) moves the turtle to any spot on the screen. Then SM, AM, DM, and IM move the turtle up, down, right, and left. Probably helps if you speak a little Spanish. The program fits on three pages of handwritten code. When was the last time you wrote code on paper? [Óscar] revisits the program to run it on an MSX. The original program was under 500 bytes but adding the code for MSX balloons it to 589 bytes. Gotta love assembly language. You could argue that LOCS isn’t a language because it doesn’t have variables, expressions, or looping. [Óscar] retorts that HTML doesn’t have those things either, and yet some call it a language. Honestly, if a 9-year-old can create this, we think they can call it anything they want to! By 1990, he’d graduated to full-blown games. If turtle graphics are too abstract for you, try a Big Trak. Continue reading “A Nine-Year-Old’s Z80 Drawing Program” → Posted in Retrocomputing, Software HacksTagged assembly language, logo, z80 Hackaday Links: February 25, 2024 February 25, 2024 by Dan Maloney 15 Comments When all else fails, blame it on the cloud? It seems like that’s the script for just about every outage that makes the news lately, like the Wyze camera outage this week that kept people from seeing feeds from their cameras for several hours. The outage went so far that some users’ cameras weren’t even showing up in the Wyze app, and there were even reports that some people were seeing thumbnails for cameras they don’t own. That’s troubling, of course, and Wyze seems to have taken action on that quickly by disabling a tab on the app that would potentially have let people tap into camera feeds they had no business seeing. Still, it looks like curiosity got the better of some users, with 1,500 tapping through when notified of motion events and seeing other people walking around inside unknown houses. The problem was resolved quickly, with blame laid on an “AWS partner” even though there were no known AWS issues at the time of the outage. We’ve said it before and we’ll say it again: security cameras, especially mission-critical ones, have no business being connected with anything but Ethernet or coax, and exposing them to the cloud is a really, really bad idea. Continue reading “Hackaday Links: February 25, 2024” → Posted in Hackaday Columns, Hackaday links, SliderTagged airline, Artemis, AWS, camera, cloud, cybertruck, eclipse, flood, fording, hackaday links, iphone, logo, nasa, outage, rice, wiring harness, worm, Wyze"
