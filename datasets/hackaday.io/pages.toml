description = '''
Lighting Up the Workshop for a Techno Party – CZ Jak Rozzářit Dílnu Na Techno Párty [https://content.instructables.com/FMQ/UE2X/M6Z2DEHD/FMQUE2XM6Z2DEHD.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxMTo0OTo0Ny4w]
https://content.instructables.com/FY1/EUW5/M6Z2CRIT/FY1EUW5M6Z2CRIT.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAwODoxNDoxNC4wLighting Up the Workshop for a Techno Party – CZ Jak Rozzářit Dílnu Na Techno Párty


For the upcoming New Year's Eve techno party, a technical modification was carried out in our workshop. Its aim was to achieve a permanent, reliable, and functional technical base for this type of event, with an emphasis on self-implementation and cost optimization. The project mainly includes the installation and configuration of a lighting system.

The foundation of the technical solution is a completely DMX-controlled lighting system that combines various types of lighting and non-lighting effects. The control software QLights Controller is used for controlling and programming the lights. The visual aspect of the event is further enhanced by a set of CRT televisions with video projection from VHS tapes. The following text describes the work process of creating a permanent lighting system

Now, let’s dive into the full process in Czech!

Pro nadcházející silvestrovskou techno párty byla v dílně provedena technická úprava. Jejím cílem bylo dosáhnout stálého spolehlivého afunkčního technického zázemí pro tento typ akcí s důrazem na vlastní realizaci a optimalizaci nákladů. Projekt zahrnuje hlavně instalaci a konfiguraci světelného systému.

Základem technického řešení je kompletně DMX řízený světelný systém, který kombinuje různé typy světelných i nesvětelných efektů. Pro řízení a programování světel je využíván řídící software Q Lights Controller. Vizuální stránku akce navíc doplňuje sestava CRT televizí s video projekcí z VHS kazet. Následující text popisuje postup prací na vytváření stálého světelného systému.


