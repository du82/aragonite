full_description = '''Details Course Overview: This course will cover how to develop interactive artworks, installations, and experiences based on sensor input. The course will start by guiding students in designing single input and output projects then expand into creating multi-sensory experiences using light and sound. Along the way, students will view examples of modern interactive art projects by some of the world's best new technology artists built using the same techniques and equipment they will be learning throughout the program. Students will learn how to control output such as sound, LEDs, and motors based on sensor input using the Circuit Playground and C++. Students will master using the onboard sensors of the Circuit Playground (microphone, capacitive touch, accelerometer, light sensor) and we will also discuss how to extend capacitive touch through the use of materials such as conductive fabric, paint and thread to make wearable projects. We will learn about other sources of input such as biosensors, BCI, computer vision, and environmental sensors although we will not be applying these directly in the course. Students will learn state machine diagramming and how to develop an interactivity matrix which can help them plan and program their installations. This course is suitable for beginners as well as advanced makers who are interested in expanding their toolkit to include professional-quality interactive artwork or room-scale immersive environments.Playlist to the Interactive Media Art Series: https://www.youtube.com/playlist?list=PL_tws4AXg7atZKYsTAhOmGK9WzcU_igEe Suggested Equipment: Circuit Playground Express Small Alligator Clip Test Lead (set of 12) USB A/Micro Cable - 2mMicro servoSmall Alligator Clip to Male Jumper Wire Bundle - 12 Pieces About the Instructor: Mirabelle Jones is a creative technologist, researcher, and educator from Oakland, California and currently living in Copenhagen, Denmark. Recently, they served as a Senior Designer / Developer for Meow Wolf's interactive technology team with a specialization in interactive storytelling, sensors, soft circuits, responsive lighting and sound, 3D modeling and printed sculpture, and computer vision. They have taught workshops at B4B3L4B, Gray Area, Catch, and Codame and are a frequent speaker, guest lecturer, and resident artist at some of the top universities and arts institutions in the United States including: Syracuse University, the School of the Arts Institute Chicago, Rhode Island School of Design, Maryland Institute College of the Arts, the University of Illinois Urbana-Champaign, the University of Kentucky, the University of Wisconsin-Madison, the University of North Carolina at Chapel Hill, Mills College, and more. MirabelleJones.com Components 1 × Circuit Playground Express https://www.adafruit.com/product/2599#buy-one-give-one 1 × Small Alligator Clip Test Lead (set of 12) https://www.adafruit.com/product/1008 1 × USB A/Micro Cable - 2m *this might come with the Circuit Playground - check before ordering https://www.adafruit.com/product/2185 1 × Micro servo https://www.adafruit.com/product/169 1 × Small Alligator Clip to Male Jumper Wire Bundle - 12 Pieces https://www.adafruit.com/product/3255 View all 6 components Course Classes Collapse Course Sign Up mirabellejones • 08/24/2020 at 06:56 • 0 comments You can sign up for this course at the following link: https://www.eventbrite.com/e/hackaday-u-interactive-media-art-with-light-and-sensors-tickets-115767601011You can elect to sign up for just a class, or the whole series! Each class is beginner friendly, but you will get a complete understanding of the subject matter from attending all classes. Equipment Options: Express Pack & Black Girls Code Promo mirabellejones • 08/25/2020 at 06:32 • 0 comments Hi Students! Our first class will be in just a couple weeks! If you haven't signed up, please visit the Eventbrite link and select which days you'd like to attend: https://www.eventbrite.com/e/hackaday-u-interactive-media-art-with-light-and-sensors-tickets-115767601011If you haven't purchased equipment yet, Adafruit and Digikey are running a promotion where if you buy the Circuit Playground Express using the following link, they will donate one to Black Girls Code: https://www.adafruit.com/product/2599 AND if you're planning to take the course with a friend (your partner, your kiddo, your pal), OR you're a busy maker and know you'll want spare gear, I recommend purchasing the Circuit Playground Express Advanced Pack which will include everything you'll need for class PLUS conductive thread, needs, copper tape, sewable neopixel, and other materials which will allow you to experiment even more and make wearables / soft circuits! You can purchase it from Adafruit at: https://www.adafruit.com/product/2769 Class 1: Speaker & Capacitive Touch mirabellejones • 09/23/2020 at 15:54 • 0 comments In this class, we'll introduce you to the Circuit Playground Express. We'll walk through the installation steps, then write our first sketches! We'll learn how to use the onboard speaker to make our own songs. We'll also learn how to use library examples and a bit of C++ including for loops. We'll conclude by learning capacitive touch sensing and explore how to use our alligator clips to extend our capacitive touch circuits. Link to slides for this class: http://www.mirabellejones.com/hackaday-sensors/ Link to Github source files: https://github.com/mirabellej/HackadayU_sensors Class 2: LEDs, Temp, Light, and Sound Sensing mirabellejones • 09/23/2020 at 15:59 • 0 comments In this class, we'll learn how to use LEDs to make light-responsive projects! Using the powerful FastLED library, we'll explore how to make colorful animations with moving light. We'll also learn how to use the sound sensor, light sensor, and temperature sensor to make our lighting and sound interactive. We'll talk more about inputs and outputs and go further with our ideas for interactive designs. Link to slides for this class: http://www.mirabellejones.com/hackaday-sensors/Link to Github source files: https://github.com/mirabellej/HackadayU_sensors Class 3: Servos, Buttons, Switches, Accelerometer mirabellejones • 09/23/2020 at 16:04 • 0 comments In this class, we'll learn how to create non-blocking programs so we can have multiple inputs and outputs going at the same time. We'll learn how to use servos to create projects with moving parts and learn how to use the buttons and slide switch for control. We'll learn how to use the accelerometer to detect motion and taps! We'll conclude by discussing how we can plan our interactivity using flowcharts and pseudocode. Link to slides for this class: http://www.mirabellejones.com/hackaday-sensors/ Link to Github source files: https://github.com/mirabellej/HackadayU_sensors View all 5 course classes Enjoy this course? Share This course was created on 08/06/2020 and last updated 4 years ago. Discussions Log In/Sign up to comment Become a Hackaday.io Member Create an account to leave a comment. Already have an account? Log In. Sign up with Github Sign up with X OR Sign up promoshorts0001 wrote 09/25/2023 at 11:50 • point Nice course, it will help me in <a href="https://divorceor.com/">about divorce law</a> Are you sure? yes | no Tauno Erik wrote 06/07/2022 at 14:27 • point All videos have been removed? Are you sure? yes | no Richard Hogben wrote 06/07/2022 at 17:46 • point I'll try and see if this was a mistake. Are you sure? yes | no Tauno Erik wrote 06/07/2022 at 18:16 • point I think these should be the same videos that are on this list: https://www.youtube.com/playlist?list=PL_tws4AXg7atZKYsTAhOmGK9WzcU_igEe Are you sure? yes | no Richard Hogben wrote 06/07/2022 at 18:28 • point Ok thanks, I'm asking a channel admin to check permissions. Are you sure? yes | no Richard Hogben wrote 06/07/2022 at 18:46 • point Should be viewable now. Are you sure? yes | no Adam Moussa wrote 09/20/2020 at 22:59 • point how do we ask question