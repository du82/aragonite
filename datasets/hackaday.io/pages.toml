full_description = "2021 Hackaday Prize Overview Main Website :: Official Rules :: FAQ Dream Team Grants :: Mentor Sessions Rethink, Refresh, Rebuild This year, we are asking you all to rethink and refresh familiar concepts across multiple facets of hardware. How can we communicate more effectively through different display technologies? How can supportive tech expand its reach and also bring new potential engineers into the fold? What defines a robot? In 2021, we’re challenging the open source hardware community to answer these questions with their unique and capable designs. Schedule Launch 5/18/2021 Challenge 1: Rethink Displays 5/18/2021 - 6/14/2021 Challenge 2: Refresh Work-From-Home Life 6/14/2021 - 7/19/2021 Challenge 3: Reimagine Supportive Tech 7/19/2021 - 8/23/2021 Challenge 4: Redefine Robots 8/23/2021 - 9/27/2021 Challenge 5: Reactivate Wildcard 9/27/2021 - 10/27/2021 Finalists Close 11/7/2021 Winners Announced on or around 11/19/2021 Prizes: Grand Prize - $25,000 + Supplyframe DesignLab Residency Second Place - $15,000 Third Place - $10,000 Fourth Place - $5,000 Fifth Place - $3,000 Top 10 Finalists from each challenge - $500 The Hackaday Prize is in its 8th Year: Our History In 2014, we launched The Hackaday Prize to our smart, talented, enthusiastic community of engineers, scientists, designers and creatives everywhere. Over 600 projects were created, and the winner, SatNOGS, now has a foundation where they are continuing the work they started here. In 2015, we challenged the Hackaday community to use their superpowers again. The results told the story of nearly 900 Hackaday Prize entrants using their unique skills to make big changes in peoples' lives. 2015's Hackaday Prize winner, the Eyedrivomatic, directly impacted those living with limited mobility. In 2016, we had nearly 1,100 entries, and the Hackaday Prize winner was Dtto, a search and rescue robot. It's also an open source project that continues its journey at the Supplyframe Design Lab. In 2017, the winner of the Hackaday Prize was Alex Williams, with an underwater explorer robot. Alex continued the work on his project at the Supplyframe Design Lab. In 2018, the winner was Dexter, a 5-axis robotically controlled arm with insane precision. Dexter is now a product and a fledgling business located in Las Vegas, NV. In 2019, FieldKit won the grand prize, and has continued to push the boundaries of open source environmental sensing with their organization Conservify. Last year in 2020, The Byte, took the grand prize home with an open-source, mouth-actuated input device for people with physical challenges. It is now time to start the 2021 Hackaday Prize. In keeping with the incredible hardware community, we hope to activate the next generation of innovative open source hardware solutions. Thank you to our Sponsors:"
