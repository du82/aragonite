Achtung!!! Vor dem Beginn von Arbeiten an oder dem Betrieb von elektrischen Geräten wird eine elektrische Risikobewertung durchgeführt. Diese legt fest, wie die Arbeit oder der Betrieb durchgeführt wird und welche Maßnahmen zur Gewährleistung der Sicherheit getroffen werden. Nur Personen mit entsprechender elektrischer Qualifikation dürfen an oder in der Nähe von elektrischen Geräten arbeiten. Persönliche Schutzausrüstungen, Werkzeuge, Geräte und Arbeitsmittel, die für Arbeiten an elektrischen Anlagen verwendet werden, müssen stets in einwandfreiem Zustand sein, gemäß den Anweisungen des Herstellers verwendet werden und für diese Verwendung geeignet sein.

Pozor!!! : Před zahájením jakékoliv práce na elektrickém zařízení nebo jeho obsluhou, je provedeno hodnocení elektrického rizika. Podle něj je stanoveno, jakým způsobem je práce nebo obsluha vykonávána a jaká opatření jsou pro zajištění bezpečnosti provedena. Činnosti na elektrických zařízeních nebo v jejich blízkosti mohou vykonávat pouze osoby s odpovídající elektrotechnickou kvalifikací. Osobní ochranné prostředky, nářadí, přístroje a pracovní pomůcky, které se používají při činnostech na elektrických zařízeních, jsou vždy v řádném stavu, jsou používány v souladu s návodem od výrobce a jsou pro takové použití vhodné.

Jako zdroj informací jsem používal Internet. Při nastavování světel jsem používal dokumentaci k programu Q Lights Controller+ [https://www.qlcplus.org/]. Použil jsem video návod na DIY keychain DMX tester for lighting technicians [https://www.youtube.com/watch?v=skwUNRp-Rrk], základní dílenské postupy z knihy Strojírenské technologie, M. Hluchý. Celý můj postup je popsán v první části dokumentace.


STEP 1: KABELÁŽ DMX SÍTĚ A VIDEA

Kabeláž DMX Sítě a Videa [https://content.instructables.com/FJ1/MWBA/M6Z2CU86/FJ1MWBAM6Z2CU86.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxMDoxMTo0My4w]
Kabeláž DMX Sítě a Videa [https://content.instructables.com/FWK/5EV1/M6Z2CU8G/FWK5EV1M6Z2CU8G.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxMDoxMjozMi4w]
https://content.instructables.com/FYK/PZCI/M6Z2CU8L/FYKPZCIM6Z2CU8L.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxMDoxMjo0My4wKabeláž DMX Sítě a Videa


Bylo nutné rozvést přes dílnu vedení DMX a audio signálů. Na to byly příhodně použity "ekonomické" kabely ze špulky. Tyto kabely jsou vhodné pouze pro statické instalace, sice jsou velice nekvalitní, ale nehrozí jim velké namáhání nebo poškození. Pro připojení videosignálu do CRT televizí byly využity recyklované koaxiální kabely. Kvalitní nové koaxiální kabely a konektory jsou drahé, proto bylo využito stávajících zásob. Postup zahrnoval proměření délekv místnosti, proměření délek kabelů, zkrácení na požadovanou délku a osazení XLR konektory pro audio a světelnou techniku.

Byly vytvořeny pasivní DMX rozbočovače. Ty byly použity u LED party spotů, protože integrovaný prostup obsahuje zesilovač linky a ten dělal problémy v DMX síti. DMX linka se ráda zaruší. Proto je vypozorované, které prvky sítě musí být vždy zapojené až na konci linky. Například generátor kouře a stroboskop. (dříve i LED spoty)


STEP 2: DIY ZKOUŠEČKA DMX SÍTĚ

DIY Zkoušečka DMX Sítě [https://content.instructables.com/F0X/YH46/M6Z2CUP2/F0XYH46M6Z2CUP2.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxMDo0ODo1OC4w]
DIY Zkoušečka DMX Sítě [https://content.instructables.com/F87/LX2B/M6Z2CUPC/F87LX2BM6Z2CUPC.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxMDo0OToyMy4w]

Pro diagnostiku DMX sítě a lokalizaci potenciálních problémů se signálem byla vyrobena jednoduchá DMX zkoušečka. Zkoušečka je konstruována podle dostupného návodu na internetu (DIY keychain DMX tester for lighting technicians). Konstrukce využívá dvě LED diody pro indikaci přítomnosti DMX signálu.


STEP 3: DMX TERMINÁTOR

DMX Terminátor [https://content.instructables.com/FTB/NCNE/M767KD96/FTBNCNEM767KD96.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNiAwNTowMDoxOS4w]

Pro zajištění impedance DMX linky a eliminaci odrazů signálu byl na konec DMX řetězce instalován DMX terminátor. Terminátor je tvořen XLR konektorem s připájeným rezistorem 120 Ohmů.


STEP 4: OPRAVA JUNIOR SKENERU

Oprava Junior Skeneru [https://content.instructables.com/F76/MFUF/M6Z2CUQE/F76MFUFM6Z2CUQE.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxMDo1MDo1NS4w]
Oprava Junior Skeneru [https://content.instructables.com/F6A/W48R/M6Z2CUQR/F6AW48RM6Z2CUQR.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxMDo1MToxMS4w]

Oprava Junior Skeneru [https://content.instructables.com/F6H/ZDE3/M6Z2CURK/F6HZDE3M6Z2CURK.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxMDo1MToyOC4w]

Při testování DMX sítě byla zkoušečkou detekována nestabilita signálu za Junior skenerem. Předběžná diagnóza předpokládala problém s DMX čipem nebo konektory. Detailní kontrolou bylo zjištěno mechanické poškození DMX konektoru v důsledku dřívějšího pozapomenutého pádu skeneru. Deska tištěného spoje DMX konektorů vykazovala mikropraskliny v okolí pinů.Oprava spočívala v propájení spojů na desce. Tímto zásahem byla odstraněna závada a stabilita DMX signálu byla zpět.


STEP 5: VYLEPŠENÍ DMX SPÍNACÍHO MODULU

Vylepšení DMX Spínacího Modulu [https://content.instructables.com/FTN/8LLP/M6Z2CUZN/FTN8LLPM6Z2CUZN.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxMTowODoyOS4w]
Vylepšení DMX Spínacího Modulu [https://content.instructables.com/FHR/0S0V/M6Z2CV08/FHR0S0VM6Z2CV08.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxMTowODozOC4w]

Dalším prvkem světelné instalace, který prošel úpravou, byl podomácku vyrobený DMX switchbox. Tento switchbox je osmi-kanálový spínací modul využívající triaky pro spínání a rozpínání elektrického obvodu v zásuvkách. Původní verze switchboxu nepodporovala dálkové DMX řízení. Ovládání bylo možné pouze přes počítač pomocí speciálního programu LPT LED Efekt a připojení přes paralelní port, nebo manuálním kabelovým ovladačem. Záměrem úpravy byla integrace DMX řízení do switchboxu pro použití v nové světelné síti.


STEP 6: PŘIDÁNÍ RC ČLÁNKU

Přidání RC Článku [https://content.instructables.com/FUZ/TQP8/M6Z2CUYL/FUZTQP8M6Z2CUYL.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxMTowNzo0Mi4w]
Přidání RC Článku [https://content.instructables.com/FRM/ME6A/M6Z2CUZ3/FRMME6AM6Z2CUZ3.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxMTowODowMy4w]
Přidání RC Článku [https://content.instructables.com/F54/W04P/M6Z2CVM6/F54W04PM6Z2CVM6.png?auto=webp&frame=1&fit=bounds&md=MjAyNS0wMi0xMCAxMToxMTozOS4w]


První úprava však spočívala v integraci RC členů. Cílem integrace RC členů je ochrana spínacích triaků před rušením a potenciálním spálením. RC člen je tvořen rezistorem 100 Ohmů a fóliovým kondenzátorem 100uF, zapojenými mezi fázový a nulový vodič. Schéma zapojení RC členů a schéma tištěného spoje switchboxu jsem vytvořil pro lepší orientaci v zapojení. Provedení úpravy vyžadovalo pájení. Přidáním RC členů se však objevil nežádoucí efekt v podobě tzv. pronikajícího proudu. Tento proud způsoboval nechtěné rozsvěcování a spínání spotřebičů s nízkým odběrem proudu, jako například cívky relé, slabé motory, LED trubice nebo spotřebiče se spínanými zdroji. Tento problém byl řešen přidáním svitkového kondenzátoru o kapacitě 1uF a pracovním napětí 400V.Kondenzátor byl zapojen paralelně k síťovému napájení, přímo před spotřebič s nízkým odběrem. Funkcí kondenzátoru je "pohlcení" nežádoucího proudu. Alternativní řešení, využívající sériově předřazené topných odporů pro "spotřebování" pronikajícího proudu, se ukázalo jako neefektivní.


STEP 7: VÝROBA KRYTU PRO DMX ŘÍDÍCÍ DESTIČKU

Výroba Krytu Pro DMX Řídící Destičku [https://content.instructables.com/FS1/SNXO/M6Z2DA8Z/FS1SNXOM6Z2DA8Z.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxMTo0MjoxMC4w]
Výroba Krytu Pro DMX Řídící Destičku [https://content.instructables.com/FLW/YISC/M6Z2DAKW/FLWYISCM6Z2DAKW.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxMTo0MjoyNi4w]



Dalším krokem byla integrace dálkového DMX ovládání. Z Číny jsem objednal DMX 16 Channel decoder for RGB LED pásky [https://www.aliexpress.com/item/32882232520.html?spm=a2g0o.order_list.order_list_main.91.2d6c1802NqcxOJ]. Koupil jsem pouze tu kontrolní menší destičku za 700Kč. Větší relé desku bych nevyužil. Musel jsem vyrobit ochrannou krabičku pro řídící destičku. Výroba ochranné krabičky byla rozdělena do několika fází zahrnujících návrh a 3D tisk krabičky, mechanickou úpravu, výrobu krytky a propojení pomocí sběrnice se switchboxem.

Návrh krabičky byl zpracován v 3D modelovacím programu Inventor. Základem pro návrh se stal ruční výkres s rozměry a kótami. Na základě tohoto nákresu byl vytvořen detailní 3D model, který zahrnoval prostor pro destičku, potřebné díry pro konektory a prvky pro uchycení desky. Hotový 3D model byl exportován do formátu STL a připraven pro 3D tisk v programu PrusaSlicer.

Po vytištění bylo potřeba provést mechanické úpravy.Díry pro distanční sloupky byly zkalibrovány vrtákem a následně opatřeny závitem strojním závitníkem M3. Pro DMX výstupní konektor byl v krabičce vybroušen a dořezán specifický otvor, který zohledňuje tvar aretační packy konektoru.Přesný otvor zajistil pevné a spolehlivé zapojení konektoru.Pro víko krabičky byl vytvořen jednoduchý 2D návrh v Inventoru, který byl následně vypálen do průhledného plexiskla na laseru.Plexisklové víko plní ochrannou funkci a zároveň umožňuje vizuální kontrolu elektronických komponent uvnitř krabičky.


STEP 8: INTEGRACE DMX OVLÁDÁNÍ DO SWITCHBOXU

Integrace DMX Ovládání Do Switchboxu [https://content.instructables.com/FUX/MAI9/M6Z2DCC8/FUXMAI9M6Z2DCC8.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxMTo0NTowMi4w]
Integrace DMX Ovládání Do Switchboxu [https://content.instructables.com/FHF/DCE7/M6Z2DCOF/FHFDCE7M6Z2DCOF.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxMTo0NToyOS4w]
Integrace DMX Ovládání Do Switchboxu [https://content.instructables.com/FF8/HZM0/M6Z2DCFO/FF8HZM0M6Z2DCFO.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxMTo0NTowOC4w]

Řídící destičku napájí 12V stejnosměrný zdroj. Propojení switchboxu s destičkou bylo realizováno pomocí spájené propojky, která rozvádí metrix pinů na originální sběrnicový konektor. Pro praktické zavěšení řídící krabičky byla tato doplněna o plechový držák.

Po dokončení montáže byla provedena důkladná zkouška funkčnosti ovládání switchboxu. Test potvrdil správnou komunikaci s DMX protokolem a bezproblémové spínání jednotlivých zásuvek pomocí ovládacího pultu. Tímto krokem byla dokončena integrace DMX ovládání.


STEP 9: INTEGRACE TECHNICKÝCH SVĚTEL DO DMX OVLÁDÁNÍ

Integrace Technických Světel Do DMX Ovládání [https://content.instructables.com/FAH/75XJ/M6Z2DJJ9/FAH75XJM6Z2DJJ9.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxMjozMjowOC4w]
Integrace Technických Světel Do DMX Ovládání [https://content.instructables.com/FLF/QIXD/M6Z2DJK9/FLFQIXDM6Z2DJK9.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxMjozMjoxNC4w]
Integrace Technických Světel Do DMX Ovládání [https://content.instructables.com/FRI/OQ54/M6Z2DJL8/FRIOQ54M6Z2DJL8.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxMjozMjoxNy4w]


Dalším krokem se stala integrace schodišťového spínače do DMX ovládacího systému. Cílem této úpravy bylo umožnit centrální zhasínání a rozsvícení technického osvětlení v dílně prostřednictvím DMX pultu. Osvětlení v dílně bylo rozvedeno do dvou spínačů zapojenými jako schodišťový spínač. Jeden z těchto spínačů je umístěný v rohu místnosti u zazděných dveří, protože se nepoužívá, byl vybrán pro integraci do DMX systému.

Ke spínači byla přidána krabička s relé. Původně bylo zvoleno speciální bistabilní relé Finder s cívkou na 250V. Toto relé původně sloužilo pro systém dálkového vypínání světel přes ovladač. Proto obsahuje bistabilní funkci, která umožňuje ovládat relé krátkým impulzem. Po instalaci bistabilního relé se však projevily problémy s jeho přílišnou citlivostí na rušení. Proud pronikající přes RC člen ve switchboxu, způsoboval nechtěné sepnutí relé. Pro potlačení citlivosti bistabilního relé byl paralelně k cívce relé přidán kondenzátor o kapacitě 1uF a pracovním napětí 400V.

Během instalace relé stanice bylo nezbytné dočasné odpojení jističe okruhu světel, což způsobilo dočasný blackout v dílně. Vypnutí jističe okruhu světel totiž odstavilo i stykač, který je předřazen novým rozvodům v dílně. Rozvaděč je zapojen takto komplexně kvůli původnímu systému, který umožňoval vypnutí většiny okruhů v dílně pomocí spínače u dveří a stykače. Toto řešení vypínání hlavních okruhů mělo původně sloužit k úspoře energie, avšak v praxi se neosvědčilo, kvůli časté záměně vypínačů světel s vypínačem okruhů a následným komplikacím.

Pro zvýšení spolehlivosti ovládání a eliminaci problémů s citlivostí bistabilního relé bylo toto relé nahrazeno běžným relé na DIN lištu. Běžné relé se ukázalo jako méně náchylné na rušivý proud a zajistilo spolehlivější spínání. I u tohoto relé byl preventivně předřazen svitkový kondenzátor 400V 1uF pro potlačení případného rušení.

Integrací relé stanice a úpravou schodišťového spínače bylo dosaženo plnohodnotného DMX ovládání hlavního osvětlení v dílně. Toto vylepšení je bezpečnostním prvkem a zvyšuje komfort obsluze.


STEP 10: OVLÁDÁNÍ MOTORU DISKO KOULE

Ovládání Motoru Disko Koule [https://content.instructables.com/FHW/MYBL/M6Z2DK22/FHWMYBLM6Z2DK22.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxMjozODo1MS4w]
Ovládání Motoru Disko Koule [https://content.instructables.com/FES/DHEL/M6Z2DK05/FESDHELM6Z2DK05.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxMjozODowMC4w]

Pro autentickou atmosféru je klíčová rotace disko koule. Ta byla nově nainstalována na polici do středu místnosti a je výrazným prvkem. Její rotace rozptyluje světlo pin spotu a vytváří disco efekt.

K roztočení slouží klasický motorek na 230V podobný tomu z mikrovlnné trouby. Je připojen přímo do switchboxu pro ovládání točení. Pro eliminaci pronikajícího proudu byl do svorkovnice motorku přidán kondenzátor.


STEP 11: PŘIDÁNÍ NEONOVÝCH TRUBIC

Přidání Neonových Trubic [https://content.instructables.com/FYN/3INE/M6Z2DLH8/FYN3INEM6Z2DLH8.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxMjo1MjowNS4w]
Přidání Neonových Trubic [https://content.instructables.com/FS2/5U3H/M6Z2DLIH/FS25U3HM6Z2DLIH.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxMjo1MjowOS4w]
Přidání Neonových Trubic [https://content.instructables.com/F73/JVM2/M6Z2DLJR/F73JVM2M6Z2DLJR.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxMjo1MjoxMS4w]

Pro doplnění světelného repertoáru byly integrovány i neonové trubice. Záměrem bylo obohacení světelné show o specifický vzhled a barvu neonů a možnost vytvářet dynamické efekty s jejich problikáváním nebo krátkodobým rozsvěcováním. Neonová světla přinášejí do prostoru dílny charakteristickou neonovou záři a dotvářejí tak atmosféru párty s retro nádechem.

Integrace neonů do DMX switchboxu umožňuje dálkové ovládání jejich zapínání a vypínání pomocí DMX signálu. To otvírá možnosti pro programování různých světelných scén a efektů s využitím neonů. Zapojení neonů do switchboxu je realizováno standardním způsobem. Každý neon je připojen do samostatné zásuvky switchboxu, což umožňuje ovládání každého neonového světla zvlášť. Každý neon potřebuje trafo nebo zdroj. Neonová světla se z bezpečnostních důvodů nezapojují do dimmru (stmívače).


STEP 12: PŘIDÁNÍ UV TRUBIC

Přidání UV Trubic [https://content.instructables.com/FYV/U473/M6Z2DMU9/FYVU473M6Z2DMU9.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxMzowMDo1MC4w]

Inspirace přišla od Gemini AI textového modelu, který navrhl přidání UV osvětlení. Tento nápad se ukázal jako velmi inspirativní, zejména s ohledem na fakt, že v dílně se již několik kusů UV trubic nacházelo. Tyto UV trubice byly nalezeny za knihovnou, zabalené ve stretch fólii a čekající na své znovuobjevení a použití.

UV světlo se ukázalo jako sympatický a zajímavý efekt, který dokáže rozzářit určité předměty a materiály a vytvořit specifickou atmosféru. Například staré fosforové zobrazovače, různé plasty, uranové sklo a nebo Tonic v nápojích.

Pro realizaci UV osvětlení byly vybrány dvě UV zářivky. Ty byly jednoduše zavěšeny na háčky za stávající zářivky uprostřed místnosti. Instalace byla rychlá a nenáročná, s využitím stávající infrastruktury dílenského osvětlení. Pro napájení UV trubic byl využit jeden společný kabel, který byl sveden do Switchboxu.


STEP 13: ROZŠÍŘENÍ ROZVADĚČE

Rozšíření Rozvaděče [https://content.instructables.com/FR7/EGS6/M6Z2DOCS/FR7EGS6M6Z2DOCS.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxMzowOToyNC4w]
Rozšíření Rozvaděče [https://content.instructables.com/FYR/P37A/M73COQZC/FYRP37AM73COQZC.png?auto=webp&frame=1&fit=bounds&md=MjAyNS0wMi0xMyAwOToyOTozOS4w]
Rozšíření Rozvaděče [https://content.instructables.com/FM3/FPB3/M73COSS5/FM3FPB3M73COSS5.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMyAwOTo0Mzo0My4w]

V průběhu rozšiřování světelné instalace se ukázala potřeba navýšení počtu dostupných zásuvek pro napájení světel a dalších komponent scénického osvětlení.Stávající kapacita zásuvek v dílně se stala nedostatečnou pro plánované rozšíření světelného parku o neony, UV trubice a další efekty. Proto bylo rozhodnuto rozšířit stávající rozvaděč o dodatečné zásuvky s vlastními jističi.

Pro rozšíření rozvaděče byly zakoupeny tři jističe Kanlux B16 v obchodě Hornbach. Montáž zásuvek a jističů do rozvaděče probíhala podle standardních elektroinstalačních postupů. Zásuvky byly upevněny na DIN lištu uvnitř rozvaděče a zapojeny do nově přidaných jističů. Do zásuvek byly připojeny prodlužovací kabely zezadu dírou v rozvaděči.

Výhodou tohoto řešení je i možnost jednoduchého vypnutí a zapnutí celého eventového osvětlení dílny pomocí jističů v rozvaděči. Toto centralizované ovládání napájení zvyšuje bezpečnost a komfort obsluhy během příprav i párty.


STEP 14: PŘIDÁNÍ LED PARTY SPOTŮ:

Přidání LED Party Spotů: [https://content.instructables.com/FVW/84BJ/M6Z2DR7J/FVW84BJM6Z2DR7J.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxNDoyMDo1MC4w]
Přidání LED Party Spotů: [https://content.instructables.com/FUC/Y46R/M6Z2DR8Y/FUCY46RM6Z2DR8Y.png?auto=webp&frame=1&fit=bounds&md=MjAyNS0wMi0xMCAxNDoyMDo1NC4w]

LED Party Spoty představují barevné reflektory, které jsou ideální pro vytváření dynamických světelných scén a efektů. LED spoty byly umístěny na obou stranách dílny pro zajištění rovnoměrného pokrytí prostoru barevým světlem. Do otvoru v regálové vzpěře police byl namontován kus závitové tyče. Na konec závitové tyče byl následně našroubován pravý LED spot. Na straně levé byla pro upevnění LED spotu využita objímka přimontovaná k trubkám topení, které prochází podél celé stěny dílny. Na objímku byl následně upevněn LED spot.


STEP 15: PŘIDÁNÍ LED PÁSKU

Přidání LED Pásku [https://content.instructables.com/FJS/EWF3/M6Z2DP1R/FJSEWF3M6Z2DP1R.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxMzoxNjoxNS4w]
Přidání LED Pásku [https://content.instructables.com/FBT/EPGH/M6Z2DP4J/FBTEPGHM6Z2DP4J.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxMzoxNzozMy4w]

LED pásek byl upevněn na polici pomocí zip pásků a plastových kotev. Na pásku umíme zobrazit různé animace, barvy a proklady. Na pásku je dobře vidět omezení datového toku DMX linky, rychle se na něm projeví nedostatečný datový tok linkou. To usnadňuje identifikaci a lokalizaci poruch. Ovládací box na rohu police obsahuje Raspberry Pi Pico a zdroj. Raspberry Pi Pico řídí driver DMX linky a ovládá RGB LED pásek.


STEP 16: PŘIDÁNÍ 6-KANÁLOVÉHO DIMMERU

Přidání 6-Kanálového Dimmeru [https://content.instructables.com/FQC/6OCC/M6Z2DQ0E/FQC6OCCM6Z2DQ0E.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMCAxMzo1MDoxMy4w]

Pro možnost ovládání intenzity vybraných světelných prvků byl přidán 6-kanálový DMX dimmer.Dimmer umožňuje plynulou regulaci jasu světel, na rozdíl od switchboxu, který pouze spíná a rozpíná napájení. Dimmer byl pověšen v řídícím koutku. Pro zavěšení dimmeru byly do jeho krytu závitem opatřeny otvory a zašroubovány šroubky s háčky z drátu.

Do nově přidaného dimmeru byly zapojeny následující světelné prvky:

 1. Dva divadelní reflektory - visící nad DJejem
 2. Dvě červené lampičky - drobné světelné prvky na levé straně dílny
 3. LED svítící hadice - schovaná v kabelovém žlabu
 4. Blinder - lze regulovat jas světla směrem na publikum

Důležité je, že do dimmeru nebyly zapojeny klasické neony. Důvodem je potenciální riziko poškození neonových trubic při pouštění na nízký výkon. Neony jsou optimalizovány pro provoz na plný výkon a regulace jasu dimmerem by mohla vést k jejich nežádoucímu blikání, zkracování životnosti nebo i poškození.'''
full_description = '''For the upcoming New Year's Eve techno party, a technical modification was carried out in our workshop. Its aim was to achieve a permanent, reliable, and functional technical base for this type of event, with an emphasis on self-implementation and cost optimization. The project mainly includes the installation and configuration of a lighting system.The foundation of the technical solution is a completely DMX-controlled lighting system that combines various types of lighting and non-lighting effects. The control software QLights Controller is used for controlling and programming the lights. The visual aspect of the event is further enhanced by a set of CRT televisions with video projection from VHS tapes. The following text describes the work process of creating a permanent lighting systemNow, let’s dive into the full process in Czech!Pro nadcházející silvestrovskou techno párty byla v dílně provedena technická úprava. Jejím cílem bylo dosáhnout stálého spolehlivého afunkčního technického zázemí pro tento typ akcí s důrazem na vlastní realizaci a optimalizaci nákladů. Projekt zahrnuje hlavně instalaci a konfiguraci světelného systému.Základem technického řešení je kompletně DMX řízený světelný systém, který kombinuje různé typy světelných i nesvětelných efektů. Pro řízení a programování světel je využíván řídící software Q Lights Controller. Vizuální stránku akce navíc doplňuje sestava CRT televizí s video projekcí z VHS kazet. Následující text popisuje postup prací na vytváření stálého světelného systému.Supplies Attention!!! : Before starting any work on or operating electrical equipment, an electrical risk assessment is carried out. This determines how the work or operation is carried out and what measures are taken to ensure safety. Only persons with appropriate electrical qualifications may work on or near electrical equipment. The personal protective equipment, tools, appliances and work equipment used for work on electrical equipment shall always be in proper condition, used in accordance with the manufacturer's instructions and suitable for such use.Achtung!!! Vor dem Beginn von Arbeiten an oder dem Betrieb von elektrischen Geräten wird eine elektrische Risikobewertung durchgeführt. Diese legt fest, wie die Arbeit oder der Betrieb durchgeführt wird und welche Maßnahmen zur Gewährleistung der Sicherheit getroffen werden. Nur Personen mit entsprechender elektrischer Qualifikation dürfen an oder in der Nähe von elektrischen Geräten arbeiten. Persönliche Schutzausrüstungen, Werkzeuge, Geräte und Arbeitsmittel, die für Arbeiten an elektrischen Anlagen verwendet werden, müssen stets in einwandfreiem Zustand sein, gemäß den Anweisungen des Herstellers verwendet werden und für diese Verwendung geeignet sein.Pozor!!! : Před zahájením jakékoliv práce na elektrickém zařízení nebo jeho obsluhou, je provedeno hodnocení elektrického rizika. Podle něj je stanoveno, jakým způsobem je práce nebo obsluha vykonávána a jaká opatření jsou pro zajištění bezpečnosti provedena. Činnosti na elektrických zařízeních nebo v jejich blízkosti mohou vykonávat pouze osoby s odpovídající elektrotechnickou kvalifikací. Osobní ochranné prostředky, nářadí, přístroje a pracovní pomůcky, které se používají při činnostech na elektrických zařízeních, jsou vždy v řádném stavu, jsou používány v souladu s návodem od výrobce a jsou pro takové použití vhodné.Jako zdroj informací jsem používal Internet. Při nastavování světel jsem používal dokumentaci k programu Q Lights Controller+. Použil jsem video návod na DIY keychain DMX tester for lighting technicians, základní dílenské postupy z knihy Strojírenské technologie, M. Hluchý. Celý můj postup je popsán v první části dokumentace.Step 1: Kabeláž DMX Sítě a Videa Bylo nutné rozvést přes dílnu vedení DMX a audio signálů. Na to byly příhodně použity "ekonomické" kabely ze špulky. Tyto kabely jsou vhodné pouze pro statické instalace, sice jsou velice nekvalitní, ale nehrozí jim velké namáhání nebo poškození. Pro připojení videosignálu do CRT televizí byly využity recyklované koaxiální kabely. Kvalitní nové koaxiální kabely a konektory jsou drahé, proto bylo využito stávajících zásob. Postup zahrnoval proměření délekv místnosti, proměření délek kabelů, zkrácení na požadovanou délku a osazení XLR konektory pro audio a světelnou techniku.Byly vytvořeny pasivní DMX rozbočovače. Ty byly použity u LED party spotů, protože integrovaný prostup obsahuje zesilovač linky a ten dělal problémy v DMX síti. DMX linka se ráda zaruší. Proto je vypozorované, které prvky sítě musí být vždy zapojené až na konci linky. Například generátor kouře a stroboskop. (dříve i LED spoty)Step 2: DIY Zkoušečka DMX Sítě Pro diagnostiku DMX sítě a lokalizaci potenciálních problémů se signálem byla vyrobena jednoduchá DMX zkoušečka. Zkoušečka je konstruována podle dostupného návodu na internetu (DIY keychain DMX tester for lighting technicians). Konstrukce využívá dvě LED diody pro indikaci přítomnosti DMX signálu.Step 3: DMX Terminátor Pro zajištění impedance DMX linky a eliminaci odrazů signálu byl na konec DMX řetězce instalován DMX terminátor. Terminátor je tvořen XLR konektorem s připájeným rezistorem 120 Ohmů.Step 4: Oprava Junior Skeneru Při testování DMX sítě byla zkoušečkou detekována nestabilita signálu za Junior skenerem. Předběžná diagnóza předpokládala problém s DMX čipem nebo konektory. Detailní kontrolou bylo zjištěno mechanické poškození DMX konektoru v důsledku dřívějšího pozapomenutého pádu skeneru. Deska tištěného spoje DMX konektorů vykazovala mikropraskliny v okolí pinů.Oprava spočívala v propájení spojů na desce. Tímto zásahem byla odstraněna závada a stabilita DMX signálu byla zpět.Step 5: Vylepšení DMX Spínacího Modulu Dalším prvkem světelné instalace, který prošel úpravou, byl podomácku vyrobený DMX switchbox. Tento switchbox je osmi-kanálový spínací modul využívající triaky pro spínání a rozpínání elektrického obvodu v zásuvkách. Původní verze switchboxu nepodporovala dálkové DMX řízení. Ovládání bylo možné pouze přes počítač pomocí speciálního programu LPT LED Efekt a připojení přes paralelní port, nebo manuálním kabelovým ovladačem. Záměrem úpravy byla integrace DMX řízení do switchboxu pro použití v nové světelné síti.Step 6: Přidání RC Článku První úprava však spočívala v integraci RC členů. Cílem integrace RC členů je ochrana spínacích triaků před rušením a potenciálním spálením. RC člen je tvořen rezistorem 100 Ohmů a fóliovým kondenzátorem 100uF, zapojenými mezi fázový a nulový vodič. Schéma zapojení RC členů a schéma tištěného spoje switchboxu jsem vytvořil pro lepší orientaci v zapojení. Provedení úpravy vyžadovalo pájení. Přidáním RC členů se však objevil nežádoucí efekt v podobě tzv. pronikajícího proudu. Tento proud způsoboval nechtěné rozsvěcování a spínání spotřebičů s nízkým odběrem proudu, jako například cívky relé, slabé motory, LED trubice nebo spotřebiče se spínanými zdroji. Tento problém byl řešen přidáním svitkového kondenzátoru o kapacitě 1uF a pracovním napětí 400V.Kondenzátor byl zapojen paralelně k síťovému napájení, přímo před spotřebič s nízkým odběrem. Funkcí kondenzátoru je "pohlcení" nežádoucího proudu. Alternativní řešení, využívající sériově předřazené topných odporů pro "spotřebování" pronikajícího proudu, se ukázalo jako neefektivní.Step 7: Výroba Krytu Pro DMX Řídící Destičku Dalším krokem byla integrace dálkového DMX ovládání. Z Číny jsem objednal DMX 16 Channel decoder for RGB LED pásky. Koupil jsem pouze tu kontrolní menší destičku za 700Kč. Větší relé desku bych nevyužil. Musel jsem vyrobit ochrannou krabičku pro řídící destičku. Výroba ochranné krabičky byla rozdělena do několika fází zahrnujících návrh a 3D tisk krabičky, mechanickou úpravu, výrobu krytky a propojení pomocí sběrnice se switchboxem.Návrh krabičky byl zpracován v 3D modelovacím programu Inventor. Základem pro návrh se stal ruční výkres s rozměry a kótami. Na základě tohoto nákresu byl vytvořen detailní 3D model, který zahrnoval prostor pro destičku, potřebné díry pro konektory a prvky pro uchycení desky. Hotový 3D model byl exportován do formátu STL a připraven pro 3D tisk v programu PrusaSlicer. Po vytištění bylo potřeba provést mechanické úpravy.Díry pro distanční sloupky byly zkalibrovány vrtákem a následně opatřeny závitem strojním závitníkem M3. Pro DMX výstupní konektor byl v krabičce vybroušen a dořezán specifický otvor, který zohledňuje tvar aretační packy konektoru.Přesný otvor zajistil pevné a spolehlivé zapojení konektoru.Pro víko krabičky byl vytvořen jednoduchý 2D návrh v Inventoru, který byl následně vypálen do průhledného plexiskla na laseru.Plexisklové víko plní ochrannou funkci a zároveň umožňuje vizuální kontrolu elektronických komponent uvnitř krabičky.Step 8: Integrace DMX Ovládání Do Switchboxu Řídící destičku napájí 12V stejnosměrný zdroj. Propojení switchboxu s destičkou bylo realizováno pomocí spájené propojky, která rozvádí metrix pinů na originální sběrnicový konektor. Pro praktické zavěšení řídící krabičky byla tato doplněna o plechový držák.Po dokončení montáže byla provedena důkladná zkouška funkčnosti ovládání switchboxu. Test potvrdil správnou komunikaci s DMX protokolem a bezproblémové spínání jednotlivých zásuvek pomocí ovládacího pultu. Tímto krokem byla dokončena integrace DMX ovládání.Step 9: Integrace Technických Světel Do DMX Ovládání Dalším krokem se stala integrace schodišťového spínače do DMX ovládacího systému. Cílem této úpravy bylo umožnit centrální zhasínání a rozsvícení technického osvětlení v dílně prostřednictvím DMX pultu. Osvětlení v dílně bylo rozvedeno do dvou spínačů zapojenými jako schodišťový spínač. Jeden z těchto spínačů je umístěný v rohu místnosti u zazděných dveří, protože se nepoužívá, byl vybrán pro integraci do DMX systému.Ke spínači byla přidána krabička s relé. Původně bylo zvoleno speciální bistabilní relé Finder s cívkou na 250V. Toto relé původně sloužilo pro systém dálkového vypínání světel přes ovladač. Proto obsahuje bistabilní funkci, která umožňuje ovládat relé krátkým impulzem. Po instalaci bistabilního relé se však projevily problémy s jeho přílišnou citlivostí na rušení. Proud pronikající přes RC člen ve switchboxu, způsoboval nechtěné sepnutí relé. Pro potlačení citlivosti bistabilního relé byl paralelně k cívce relé přidán kondenzátor o kapacitě 1uF a pracovním napětí 400V.Během instalace relé stanice bylo nezbytné dočasné odpojení jističe okruhu světel, což způsobilo dočasný blackout v dílně. Vypnutí jističe okruhu světel totiž odstavilo i stykač, který je předřazen novým rozvodům v dílně. Rozvaděč je zapojen takto komplexně kvůli původnímu systému, který umožňoval vypnutí většiny okruhů v dílně pomocí spínače u dveří a stykače. Toto řešení vypínání hlavních okruhů mělo původně sloužit k úspoře energie, avšak v praxi se neosvědčilo, kvůli časté záměně vypínačů světel s vypínačem okruhů a následným komplikacím.Pro zvýšení spolehlivosti ovládání a eliminaci problémů s citlivostí bistabilního relé bylo toto relé nahrazeno běžným relé na DIN lištu. Běžné relé se ukázalo jako méně náchylné na rušivý proud a zajistilo spolehlivější spínání. I u tohoto relé byl preventivně předřazen svitkový kondenzátor 400V 1uF pro potlačení případného rušení.Integrací relé stanice a úpravou schodišťového spínače bylo dosaženo plnohodnotného DMX ovládání hlavního osvětlení v dílně. Toto vylepšení je bezpečnostním prvkem a zvyšuje komfort obsluze.Step 10: Ovládání Motoru Disko Koule Pro autentickou atmosféru je klíčová rotace disko koule. Ta byla nově nainstalována na polici do středu místnosti a je výrazným prvkem. Její rotace rozptyluje světlo pin spotu a vytváří disco efekt.K roztočení slouží klasický motorek na 230V podobný tomu z mikrovlnné trouby. Je připojen přímo do switchboxu pro ovládání točení. Pro eliminaci pronikajícího proudu byl do svorkovnice motorku přidán kondenzátor.Step 11: Přidání Neonových Trubic Pro doplnění světelného repertoáru byly integrovány i neonové trubice. Záměrem bylo obohacení světelné show o specifický vzhled a barvu neonů a možnost vytvářet dynamické efekty s jejich problikáváním nebo krátkodobým rozsvěcováním. Neonová světla přinášejí do prostoru dílny charakteristickou neonovou záři a dotvářejí tak atmosféru párty s retro nádechem.Integrace neonů do DMX switchboxu umožňuje dálkové ovládání jejich zapínání a vypínání pomocí DMX signálu. To otvírá možnosti pro programování různých světelných scén a efektů s využitím neonů. Zapojení neonů do switchboxu je realizováno standardním způsobem. Každý neon je připojen do samostatné zásuvky switchboxu, což umožňuje ovládání každého neonového světla zvlášť. Každý neon potřebuje trafo nebo zdroj. Neonová světla se z bezpečnostních důvodů nezapojují do dimmru (stmívače).Step 12: Přidání UV Trubic Inspirace přišla od Gemini AI textového modelu, který navrhl přidání UV osvětlení. Tento nápad se ukázal jako velmi inspirativní, zejména s ohledem na fakt, že v dílně se již několik kusů UV trubic nacházelo. Tyto UV trubice byly nalezeny za knihovnou, zabalené ve stretch fólii a čekající na své znovuobjevení a použití.UV světlo se ukázalo jako sympatický a zajímavý efekt, který dokáže rozzářit určité předměty a materiály a vytvořit specifickou atmosféru. Například staré fosforové zobrazovače, různé plasty, uranové sklo a nebo Tonic v nápojích.Pro realizaci UV osvětlení byly vybrány dvě UV zářivky. Ty byly jednoduše zavěšeny na háčky za stávající zářivky uprostřed místnosti. Instalace byla rychlá a nenáročná, s využitím stávající infrastruktury dílenského osvětlení. Pro napájení UV trubic byl využit jeden společný kabel, který byl sveden do Switchboxu.Step 13: Rozšíření Rozvaděče V průběhu rozšiřování světelné instalace se ukázala potřeba navýšení počtu dostupných zásuvek pro napájení světel a dalších komponent scénického osvětlení.Stávající kapacita zásuvek v dílně se stala nedostatečnou pro plánované rozšíření světelného parku o neony, UV trubice a další efekty. Proto bylo rozhodnuto rozšířit stávající rozvaděč o dodatečné zásuvky s vlastními jističi.Pro rozšíření rozvaděče byly zakoupeny tři jističe Kanlux B16 v obchodě Hornbach. Montáž zásuvek a jističů do rozvaděče probíhala podle standardních elektroinstalačních postupů. Zásuvky byly upevněny na DIN lištu uvnitř rozvaděče a zapojeny do nově přidaných jističů. Do zásuvek byly připojeny prodlužovací kabely zezadu dírou v rozvaděči.Výhodou tohoto řešení je i možnost jednoduchého vypnutí a zapnutí celého eventového osvětlení dílny pomocí jističů v rozvaděči. Toto centralizované ovládání napájení zvyšuje bezpečnost a komfort obsluhy během příprav i párty.Step 14: Přidání LED Party Spotů: LED Party Spoty představují barevné reflektory, které jsou ideální pro vytváření dynamických světelných scén a efektů. LED spoty byly umístěny na obou stranách dílny pro zajištění rovnoměrného pokrytí prostoru barevým světlem. Do otvoru v regálové vzpěře police byl namontován kus závitové tyče. Na konec závitové tyče byl následně našroubován pravý LED sp'''
