full_description = "Hackaday.io - Capture & Log Mobile App Richard Hogben • 06/10/2019 at 20:19 • 28 comments Keep your existing Hackaday.io projects up-to-date with your mobile device and this companion app. Capture photos of your hardware projects, caption them, and log your project progress. How it works Take a project photo, crop and rotate if needed.Write a caption for your log.Select an existing project including private projects.Title and create a new log.Or choose an existing log to append to.Review and post your project update. Get started Keeping regular logs of your ongoing hardware projects is the best way to take advantage of the community support and broad visibility provided by the Hackaday.io platform. Use this app alongside your existing Hackaday.io account. Don’t have an account? Sign up at Hackaday.io. The app is available for iOS and Android: Android download link iPhone download link Logging in Your existing Hackaday.io email and password are required to login. If you signed up with Twitter or Github these options are available at the bottom of the login screen. If you have forgotten your password you can create a new password here. Photos and editing On the photo capture screen you can take a new photo or access the photo gallery in the top right. Rotating and crop tools appear after a photo has been captured. Posting to a project log Choose from an existing public or private project. Then select from an existing log or create and title a new log. New projects can be created here. Logging out From the home screen, click on your avatar in the top right to open the user menu. The menu contains a logout link as well as other options. Feedback For general app feedback or questions you can comment below or on the Hackaday.io feedback page. Hacklet 113 - New Robots Adam Fabio • 09/29/2016 at 16:16 • 1 comment I start each day checking out the new and updated projects over on Hackaday.io. Each day one can find all manner of projects – from satellites to machine vision to rockets. One type of project which is always present are robots- robot arms, educational ‘bots, autonomous robots, and mobile robots. This week’s Hackaday.io had a few great robot projects show up on the “new and updated” page, so I’m using the Hacklet to take a closer look.We start with [Jack Qiao] and Autonomous home robot that does things. [Jack] is building a robot that can navigate his home. He’s learned that just creating a robot that can get itself from point A to point B in the average home is a daunting task. To make this happen, he’s using the Simultaneous Localization and Mapping (SLAM) algorithm. He’s implementing SLAM with the help of Robotic Operating System (ROS). The robot started out as a test mule tethered to a laptop. It’s evolved to a wooden base with a mini ITX motherboard. Mapping data comes in through a Kinect V2, which will soon be upgraded to a Neato XV-11 LIDAR system.Next up is [Tyler Spadgenske] with TyroBot. TyroBot is a walking robot with some lofty goals, including walking a mile in a straight line without falling down. [Tyler’s] inspiration comes from robots such as Bob the Biped and Zowi. So far, TyroBot consists of legs and feet printed in PLA. [Tyler] is going to use a 32 bit processor for [TyroBot’s] brain, and wants to avoid the Arduino IDE at any cost (including writing his own IDE from scratch). This project is just getting started, so head on over to theproject page and watch TyroBot’s progress!Next is [Mike Rigsby] with Little Friend. Little Friend is a companion robot. [Mike] found that robots spend more time charging batteries than interacting. This wouldn’t do for a companion robot. His solution was to do away with batteries all together. Little Friend is powered by super capacitors. An 8 minute charge will keep this little bot going for 75 minutes. An Arduino with a motor shield controls Little Friend’s DC drive motors, as well as two animated eyes. If you can’t tell, [Mike] used a tomato as his inspiration. This keeps Little Friend in the cute zone, far away from the uncanny valley.Finally we have the walking robot king, [Radomir Dopieralski], with Logicoma-kun. For the uninitiated, a Logicoma is a robot tank (or “logistics robot”) from the Ghost in the Shell series. [Radomir] decided to bring these cartoon tanks to life – at least in miniature. The bulk of Logicoma-kun is built carefully cut and sculpted acrylic sheet. Movement is via popular 9 gram servos found all over the internet. [Radomir] recently wrote an update outlining his new brain for Logicoma-kun. An Arduino Pro Mini will handle servo control. The main computer will be an ESP8266 running Micropython. I can’t wait to see this little ‘bot take its first steps.If you want more robotic goodness, check out our brand new mobile robot list! Did I miss your project? Don’t be shy, just drop me a message on Hackaday.io. That’s it for this week’s Hacklet, As always, see you next week. Same hack time, same hack channel, bringing you the best of Hackaday.io! Hacklet 112 - Skateboard Projects Adam Fabio • 09/29/2016 at 16:15 • 1 comment Skateboarding is a sport that was born of hacking. The identity of the person who first nailed roller skate wheels to a board with a milk crate box is lost to history. Those crate scooters were a staple of the 1940’s and 1950’s neighborhoods. Everyone built their own scooter, so the designs evolved. Eventually the milk crates disappeared. At some point, surfers realized that they could use these wheeled boards to surf the concrete jungle. Things just took off from there. Skateboarding is now a multi-billion dollar industry, but at its heart there are still hackers trying out new designs. This week’s Hacklet is all about skateboarding projects.We start with [brian.rundle] and Electric Longboard. [Brian] built his board using trucks and mechanical parts from a DIY skateboard online shop. The motor is a brushless outrunner R/C plane motor from HobbyKing. Batteries are of the LiPo variety. An Arduino Nano provides the PWM signal which drives the Electronic Speed Control (ESC). Throttle control is via RF link using the popular Nordic Semi NRF2401. [Brian] is focusing on building a safe skateboard. He designed it to carry two batteries, though only one is in use at a time. Rather than use a switch, he’s created a fool-proof system with arming plugs and jumpers. Each battery has its own arming plug. There is one jumper, so only one battery can be connected to the board at a time.Next up is [suiram21] with Longboard Brake. Downhill longboarding can be a dangerous sport. Running downhill at 40MPH or more with no brakes makes for quite an adrenaline rush. [suiram21] loves longboarding but wanted the safety of having a brake if and when he needed it. He started with a Onda board, which is a longboard with large diameter wheels. He 3D printed brackets for a cable actuated braking system. The brake is activated by stepping on a lever at the rear of the board. A lever presses a bicycle brake pad into the inside edge of the tire. This brings the board to a gentle stop. [suiram21] is thinking of adding a second brake to the other wheel to increase braking authority.Next we have [edbraun] with Skateboard Speedometer by inventED. [edbraun] wanted to know how fast he was going. A GPS would work, but GPS signals are often blocked in cities. A more accurate way to gather speed data is directly from the wheels. Two tiny magnet plugs are placed in holes drilled in the wheel. A hall effect sensor detects the magnets and passes this data on to an Arduino Pro Mini. Once the speed is calculated, it’s sent to a Bluetooth radio. [edbraun’s] Android phone receives the data and displays current speed and total distance traveled. The speedometer and its slick 3D printed case almost hide between the trucks and the board itself. Nice work [edbraun]!Finally we have Hackaday alum [Josh Marsh] and EV Commuter Longboard. [Josh] uses an electric longboard for his daily commute. His project is an excellent overview and tutorial on building an electric skateboard from scratch. Like many others, [Josh] utilizes R/C Airplane brushless motors and speed controllers. An Arduino or similar microcontroller is all you need to drive these devices. For batteries, [Josh] loves LiPo packs. Long form six cell affairs provide 22.2 Volts with a capacity of 5000 mAh or more. Plenty of power for carving your way to work!If you want to see more skateboard projects, check out our new skateboard projects list! If I missed your project, don’t be shy, just drop me a message on Hackaday.io. That’s it for this week’s Hacklet. As always, see you next week. Same hack time, same hack channel, bringing you the best of Hackaday.io! HACKLET 111 – ADVANCED MICROSCOPY PROJECTS Adam Fabio • 09/29/2016 at 16:14 • 0 comments Last week on the Hacklet we covered optical microscopy projects. Those are the familiar scopes that many of us have at work or even at home on our benches. These are scopes that you typically can use with your eye, or an unmodified camera. This week we’re taking a look at more extreme ways of making small things look big. Electron streams and the forces of a single atom can be used to create incredibly magnified images. So let’s jump right in and check out the best advanced microscopy projects on Hackaday.io!We start with [andreas.betz] and BluBEAM – a scanning laser microscope. [Andreas] aims to create a scanning confocal microscope. The diffraction limitis the law of the land for standard optical microscopes. While you can’t break the law, you can find ways around it. Confocal microscopy is one technique used quite a bit in medicine and industry. Confocal scopes are generally very expensive, well outside the budget of the average hacker. [Andreas] hopes to break that barrier by creating a scanning confocal microscope using parts from a Playstation 3 BluRay optical drive. Optical drives use voice coils to maintain focus. [Andreas] had to create a custom PCB with a voice coil driver to operate the PS3 optics assembly. He also needed to drive the laser. BluBeam is still very much a work in progress, so keep an eye on it!Next up is [MatthiasR.] with DIY Scanning tunneling microscope. Open atmosphere scanning tunneling microscopes are popular on Hackaday.io. I covered [Dan Berard’s] creation in Hacklet 103. Inspired by Dan, [Matthias] is building his own STM.Environmental vibration is a huge problem with high magnification microscopes. [Matthias] is combating this by building a vibration isolation platform using extruded aluminum. He’s currently working on the STM preamplifier, which amplifies and converts the nano amp STM values to voltages which can be read by a digital to analog converter. [Matthias] is using the venerable Analog ADA4530 for this task. With an input bias of 20 femtoamps (!) it should be up to the task.Next we have [Jerry Biehler] with Hitachi S-450 Scanning Electron Microscope. Scanning electron microscopes have to be the top of the microscopy food chain. Jerry got his hands on a 1980’s vintage Hitachi SEM which was no longer working. The problem turned out to be a dodgy repair made years earlier with electrical tape. Fast forward a couple of years of use, and [Jerry] has done quite a lot to his old machine. He’s learned how to make his own filaments from tungsten wire. The slow oil diffusion vacuum pump has been replaced with a turbomolecular pump. The SEM now resides in [Jerry’s] living room, which keeps it at a relatively constant temperature.Finally, we have [beniroquai] with Holoscope – Superresolution Holographic Microscope. Holoscope is a device which increases the resolution of a standard camera by using the physical properties of light to its advantage. Precise tiny shifts of the object being magnified cause minute changes in a reflected image, which is captured by a Raspberry Pi camera. The Pi can then reconstruct a higher resolution image using the phase data. [Beniroquai] has put a lot of time into this project, even sacrificing an expensive Sony connected camera to the ESD gods. I’m following along with this one. I can’t wait to see [beniroquai’s] first few images.If you want to see more advanced microscopy projects, check out our new advanced microscope projects list! If I missed your project, don’t be shy, just drop me a message on Hackaday.io. That’s it for this week’s Hacklet. As always, see you next week. Same hack time, same hack channel, bringing you the best of Hackaday.io! HACKLET 110 – OPTICAL MICROSCOPY PROJECTS Adam Fabio • 08/22/2016 at 04:19 • 0 comments Humans have always wanted to make small things bigger. To see that which is unseen with the naked eye. The inventor of the original microscope happened sometime in the 1600’s, though the inventor is still contested. Some say it was Cornelis Drebbel, while others say Hans Lippershey. Galileo Galilei’s compound microscope is probably the most well-known ancient magnifier. Regardless of who created the device, hackers, makers, engineers, and scientists have used microscopes to study mysteries of biology, geology, electronics, and just about anything else you can imagine.This is a fitting topic for this week’s Hacklet at is aligns well with the Citizen Scientist challenge round of the Hackaday Prize which began on Monday. Making quality microscopes more widely available is one of many great starting ideas for an entry. Let’s take a look at some of the best microscopy projects on Hackaday.io!We start with [J. Kha] and Armed Microscope. [J. Kha] was one of the backers of the original uArm over at Kickstarter. He also does quite a bit of work with electronics. After fighting with a cheap USB microscope, he realized he had the perfect platform to control it. Microscopes usually are stationary, with the object being viewed moved on a stage. [J. Kha] turned things upside down by mounting the microscope on his uArm. An Arduino Yun controls the system. The Yun also allows him to stream the microscope’s video over the internet using the mjpg-streamer library. [J. Kha] did have some power issues at first, but he’s got his regulators all sorted out now.Next we have [andyhull] with Adding a light touch to a “classic” microscope. A lucky dumpster find netted [Andy] a pile of old broken microscopes. From this he was able to build a working classic stereo scope. This was a Gillet & Sibert stereo compound scope. Like most microscopes of its time, the old GS used standard incandescent or halogen lights for illumination. The old bulbs were long gone, and would have been a pain to replace. [Andy] switched his scope over to LED illumination. He ended up using a commercially available LED “bulb” designed to replace type 1157 automotive tail light bulbs. This type of LED is designed to run on 12 volt power which simplifies the wiring. The small LED flashlight in a custom mount also provides a bit of help for opaque subjects.Next up is [Andre Maia Chagas] with Flypi – cheap microscope/experimental setup. Flyp"
