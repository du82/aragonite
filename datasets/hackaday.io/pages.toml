full_description = "2023 Hackaday Prize Overview Main Website :: Official Rules :: FAQ 10 Years of Innovation For ten years, the Hackaday Prize has offered a chance for the open source hardware community and the electronics industry to step into real global issues and engineer designs that make an impact. For this 10-year milestone, we are challenging our open source community of engineers, designers, scientists, and hackers with a set of challenges that call back to some of the most impactful themes our community has addressed over the last decade. Schedule Launch 3/25/2023 Challenge 1: Re-engineering Education 3/25/2023 - 4/25/2023 Challenge 2: Assistive Tech 4/25/2023 - 5/30/2023 Challenge 3: Green Hacks 5/30/2023 - 7/4/2023 Challenge 4: Gearing Up 7/4/2023 -8/8/2023 Challenge 5: Save the World Wildcard 8/8/2023 - 9/12/2023 Finals 9/26/2023 - 10/10/2023 Winners Announced on or around 11/4/2023 Prizes: First Place - $50,000 + Supplyframe DesignLab Residency Second Place - $20,000 Third Place - $15,000 Fourth Place - $10,000 Fifth Place - $5,000 Sixth Place - $5,000 Protolabs Manufacturing Grant Top 50 Finalists - $500 The Hackaday Prize is in its 10th Year: Our History In 2014, we launched The Hackaday Prize to our smart, talented, enthusiastic community of engineers, scientists, designers and creatives everywhere. Over 600 projects were created, and the winner, SatNOGS, now has a foundation where they are continuing the work they started here. In 2015, we challenged the Hackaday community to use their superpowers again. The results told the story of nearly 900 Hackaday Prize entrants using their unique skills to make big changes in peoples' lives. 2015's Hackaday Prize winner, the Eyedrivomatic, directly impacted those living with limited mobility. In 2016, we had nearly 1,100 entries, and the Hackaday Prize winner was Dtto, a search and rescue robot. It's also an open source project that continues its journey at the Supplyframe Design Lab. In 2017, the winner of the Hackaday Prize was Alex Williams, with an underwater explorer robot. Alex continued the work on his project at the Supplyframe Design Lab. In 2018, the winner was Dexter, a 5-axis robotically controlled arm with insane precision. Dexter is now a product and a fledgling business located in Las Vegas, NV. In 2019, FieldKit won the grand prize, and has continued to push the boundaries of open source environmental sensing with their organization Conservify. In 2020, The Byte, took the grand prize home with an open-source, mouth-actuated input device for people with physical challenges. In 2021, FlowIO Platform, took the grand prize home with an open-source, miniature, modular pneumatics toolkit for control & sensing of Soft Robots and Programmable Materials. Last year in 2022, 3D Printed Portable Wind Turbine, took the grand prize a diminutive turbine could be perfect for the developing world or off-grid applications. It is now time to start the 2023 Hackaday Prize. In keeping with the incredible hardware community, we hope to activate the next generation of innovative open source hardware solutions. Thank you to our Sponsors: and our Green Hacks Challenge Sponsor:"
