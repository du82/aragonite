full_description = "FFair is a force feedback system designed to bring realistic control forces to flight simulators. It enhances the experience in X-Plane and Microsoft Flight Simulator (MSFS) by replicating the forces pilots feel in real aircraft. Key Features Realistic Force Feedback – Simulates aerodynamic forces, control stiffness, and external influences based on real-time flight dynamics.Based on a Teensy 4.1 microcontroller, enabling ultra-fast computations for force control, closed-loop processing, and PID algorithms for autopilot following.Integrated display, either on the main unit or a remote gauge, allowing full calibration directly from the control unit without the need for external software.Customisable Hardware – The system supports multiple types of motor drivers and encoders, allowing users to choose motors based on the size and power required for their setup.Recognised as a Standard Joystick – Windows detects FFair as a regular joystick , ensuring broad compatibility with simulators and applications.Multi-Axis Support – Designed for yokes, joysticks, and rudder pedals, allowing full cockpit integration.Adjustable Control Feel – Fine-tune resistance, damping, and feedback intensity to match different aircraft types.Simulator Integration – Works with X-Plane via the FlightSim Controls plugin and with MSFS using the registered version of FSUIPC. How It Works The system processes real-time flight data from the simulator and applies corresponding forces to the controls. This allows the user to feel:Autocalibration on startup.Control resistance that changes with airspeed.Turbulence and weather effects affecting the aircraftRPM, Ground, Stall effects..Trim and autopilot interactions directly on the yoke or joystick. Trim the aircraft like the real thing. With its flexible hardware compatibility, FFair allows users to build a system tailored to their needs, whether for small desktop controls or full-scale cockpit installations.Cessna 172 dual yokes working with X-Plane. Piper comanche dual yokes working with MSFS. Rudder pedals with force feedback:"
