full_description = '''Respectfully asking for guidance. Hi. I am 100% green to this website and so, haven't devoured all the content... yet. BUT, I thought, since we're fellow Canadians, I'd see if I could fast track my progress with a question to your group. I'm creating a Blade Runner inspired pop-up and we want to create a prop that can be "hacked". We became enamoured with an idea of using a dongle of some sort after coming across and article about a hacker conference in Europe where they did something similar. Basically where we are at is, create a VidPhon (a prop from the movie Blade Runner) in which you need to insert some type of dongle to interrupt a video playing in a loop. Once interrupted, you are presented with a command line type environment. Using some clues and such that we provide the guest, they need to enter an alphanumeric code to override a video playing on our multi-screen "pillar"... literally a big pillar with 4 to 6 monitors playing the same video. Once they correctly enter the alphanumeric code, it "takes over" the pillar video feed and plays a "replicant revolt" message. Once the revolt video is done, everything resets. I know... a lot of info, but just wondering if (A) anyone has any thoughts on doing this or doing it way better and (B) if anyone can point us in the right direction to start framing up the hardware/software solution. I appreciate any experience you can provide me. Thank you. Come checkout our World Create Day event!https://hackaday.io/event/21112-world-create-day-super-happy-hacker-house-vhs'''
