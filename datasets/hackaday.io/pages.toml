/lib/firmware/iwlwifi-ty-a0-gf-a0-73.ucode
/lib/firmware/iwlwifi-ty-a0-gf-a0-74.ucode
/lib/firmware/iwlwifi-ty-a0-gf-a0-77.ucode
/lib/firmware/iwlwifi-ty-a0-gf-a0-78.ucode
