STEP 37: PŘÍPRAVA VENKOVNÍHO OSVĚTLENÍ

Příprava Venkovního Osvětlení [https://content.instructables.com/FAG/CTUD/M70HSTXR/FAGCTUDM70HSTXR.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMSAwODo1OTo1OC4w]
Příprava Venkovního Osvětlení [https://content.instructables.com/FD2/X8OA/M70HSTZZ/FD2X8OAM70HSTZZ.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMSAwOTowMDowNS4w]


Příprava venkovního osvětlení zahrnovala natažení prodlužovacích kabelů z dílny do venkovního prostoru.Stávající venkovní osvětlení (uliční lampa) byla dočasně deaktivována. Deaktivace lampy byla provedena zakrytím světelného senzoru LED diodou.LED pásek jsme rozvinuli a upevnili na hasičský žebřík.Stroboskopická žárovka byla umístěna ve venkovním prostoru.Reflektor u zázemí byl překryt želatinovým filtrem (brindákem) pro změnu barvy světla na červenou.Logo dílny bylo umístěno na stojan na konci uličky.


STEP 38: PROPAGACE PÁRTY

Propagace Párty [https://content.instructables.com/FU5/W68M/M70HT081/FU5W68MM70HT081.png?auto=webp&frame=1&fit=bounds&md=MjAyNS0wMi0xMSAwOTo0MDozMS4w]
Propagace Párty [https://content.instructables.com/F99/58U7/M70HT0AF/F9958U7M70HT0AF.png?auto=webp&frame=1&fit=bounds&md=MjAyNS0wMi0xMSAwOTo0MDozMy4w]


Klíčovým faktorem úspěchu akce je efektivní propagace. Propagace párty je zásadní pro oslovení návštěvníků. Název párty, její datum a výstižné propagační materiály byly vytvořeny s cílem zaujmout a přitáhnout co největší počet účastníků.Propagace byla zaměřena na online kanály a sociální sítě s cílem oslovit relevantní komunitu a informovat o konání této akce. Pracujeme se sítěmi Facebook a Instagram. Zveme naše přátele, ale párty je mířena a otevřena všem.


STEP 39: ZÁVĚR

Závěr [https://content.instructables.com/F2M/6ZBQ/M70HSZXR/F2M6ZBQM70HSZXR.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMSAwOToyNjozMC4w]

Příprava techno párty představuje rozsáhlý objem práce, který kombinuje prvky osvětlovací a zvukové techniky.Vlastní realizace projektu umožnila vytvořit unikátní technické zázemí pro akci. DMX řízený světelný systém, využití CRT televizí pro video projekci a příprava ozvučení a zázemí jsou klíčové komponenty, které přispěly k vytvoření této akce.

Důraz je kladen na kreativní přístup využití dostupných zdrojů. Výsledkem je funkční a zajímavá technická instalace, připravená pro nadcházející párty a eventy.Tento projekt dokumentuje možnosti vlastní tvorby a inspiruje k podobným výtvorům v oblasti kulturních a společenských akcí.

