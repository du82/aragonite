Příprava Ozvučení a DJ Pultu [https://content.instructables.com/FKF/PRZ2/M70HSXS1/FKFPRZ2M70HSXS1.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMSAwOToxNjoyMC4w]
Příprava Ozvučení a DJ Pultu [https://content.instructables.com/FI8/E4B8/M70HSXW8/FI8E4B8M70HSXW8.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMSAwOToxNjozOS4w]


Příprava ozvučení zahrnovala rozmístění zvukového systému v prostoru dílny.Basové reproduktory byly umístěny na podlahu.Pro vyvýšení DJ pultu a vytvoření pracovního prostoru pro DJ byly využity palety, na kterých byla položena deska stolu.Středo-výškové reproduktory byly umístěny na repro stojany. Následně proběhlo propojení všech komponent ozvučení a zapojení do zesilovačů. Následovala zvuková zkouška techniky.


STEP 35: PROMÍTÁNÍ DIAPOZITIVŮ V ZÁZEMÍ

Promítání Diapozitivů V Zázemí [https://content.instructables.com/FYS/G5AY/M70HSX8N/FYSG5AYM70HSX8N.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMSAwOToxMjowMy4w]
Promítání Diapozitivů V Zázemí [https://content.instructables.com/FDE/B8DO/M70HSXDL/FDEB8DOM70HSXDL.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMSAwOToxMzoxMy4w]
Promítání Diapozitivů V Zázemí [https://content.instructables.com/F8R/JJIN/M70HSXB3/F8RJJINM70HSXB3.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMSAwOToxMzoxMC4w]


V zázemí pro lidi byl umístěn projektor s diapozitivy.Projekce diapozitivů byla směřována na stěnu nad regály.Obsah promítaných diapozitivů byl vybrán s ohledem na celkovou atmosféru akce. Kvůli tomuto detailu byl vyroben speciální spínací systém který každou minutu otočí karuselem. Byl použit signál z centrálního elektro času. Tento impuls sepne relé a to pootočí disk diapozitivů


