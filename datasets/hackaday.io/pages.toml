The adaptation approach for PCIe Wi-Fi modules is consistent. If other Wi-Fi modules are involved, this method can also serve as a reference for implementation.'''
full_description = '''In the era of ubiquitous connectivity, wireless communication technology is an essential part of embedded systems. Wi-Fi modules, as a crucial link between devices and networks, require high performance and compatibility. Intel's AX210NGW Wi-Fi 6E module, a high-performance wireless network adapter, supports the latest Wi-Fi 6E standard and Bluetooth 5.3, offering excellent transmission speeds and compatibility, thus providing strong support for wireless connectivity in embedded systems. AX210NGW Wi-Fi 6E Module To meet the demand for high-performance embedded control applications, this article details how to adapt the AX210NGW Wi-Fi 6E module (hereinafter “the module”) on the Forlinx Embedded OK3576-C development board, enabling developers to quickly start and utilize its performance advantages. Note: The Bluetooth function of the Wi-Fi module has not been adapted. This article only covers Wi-Fi adaptation. OK3576-C Development Board Interface Diagram First, Wi-Fi module should be connected to the Forlinx OK3576-C development board. The Wi-Fi module uses an M.2 Key A + E interface, while the OK3576-C board lacks this interface. An M.2 to PCIe dual-band wireless network card adapter can be used for conversion. Go to the kernel directory to start configuration: forlinx@ubuntu20:~/3576$ cd kernel-6.1/ forlinx@ubuntu20:~/3576/kernel-6.1$ make menuconfig ARCH=arm64 Select in the following order: Location: -> Device Drivers -> Network device support (NETDEVICES [=y]) -> Wireless LAN (WLAN [=y]) -> Intel devices (WLAN_VENDOR_INTEL [=y]) -> Intel Wireless WiFi Next Gen AGN-Wireless-N/Advanced-N/Ultimate-N (iwlwifi) (IWLWIFI [=m]) -> Intel Wireless WiFi MVM Firmware support (IWLMVM [=m]) Start to compile: forlinx@ubuntu20:~/3576/kernel-6.1$ export CROSS_COMPILE=/home/forlinx/3576/prebuilts/gcc/linux-x86/aarch64/gcc-arm-10.3-2021.07-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu- forlinx@ubuntu20:~/3576/kernel-6.1$ export PATH=$PATH:/home/forlinx/3576/prebuilts/gcc/linux-x86/aarch64/gcc-arm-10.3-2021.07-x86_64-aarch64-none-linux-gnu/bin/ forlinx@ubuntu20:~/3576/kernel-6.1$ make ARCH=arm64 rk3576-evb1-v10-linux.img Finally, copy the compiled module to the OK3576-C development board. Here, copy the module to the/root directory. Enter the kernel source path： (1) drivers/net/wireless/intel/iwlwifi/iwlwifi.ko (2) drivers/net/wireless/intel/iwlwifi/mvm/iwlmvm.ko In addition, copy the Wi-Fi firmware and STA scripts to the/root directory for backup. root@rk3576-buildroot:/root# ls firmware.zip fltest_wifi.sh iwlmvm.ko iwlwifi.ko STA scripts can refer to the following contents, such as creating scripts by yourself, and remember to add executable permissions. #!/bin/sh cnt1=`ps aux | grep hostapd | grep -v grep | wc -l` if [ "$cnt1" != "0" ];then killall hostapd > /dev/null fi ifconfig uap0 down function usage() { echo "Usage: -i-s-p" echo "eg: ./wifi.sh -i mlan0 -s bjforlinx -p 12345678 " echo "eg: ./wifi.sh -i mlan0 -s bjforlinx -p NONE " echo " -i : mlan0 or mlan1" echo " -s : wifi ssid" echo " -p : wifi password or NONE" } function parse_args() { while true; do case "$1" in -i ) wifi=$2;echo wifi $wifi;shift 2 ;; -s ) ssid=$2;echo ssid $ssid;shift 2 ;; -p ) pasw=$2;echo pasw $pasw;shift 2 ;; -h ) usage; exit 1 ;; * ) break ;; esac done } if [ $# != 6 ] then usage; exit 1; fi parse_args $@ if [ -e /etc/wpa_supplicant.conf ] then rm /etc/wpa_supplicant.conf fi echo \#PSK/TKIP >> /etc/wpa_supplicant.conf echo ctrl_interface=/var/run/wpa_supplicant >>/etc/wpa_supplicant.conf echo ctrl_interface_group=0 >>/etc/wpa_supplicant.conf echo update_config=1 >>/etc/wpa_supplicant.conf echo network={ >>/etc/wpa_supplicant.conf echo ssid=\"$ssid\" >>/etc/wpa_supplicant.conf echo scan_ssid=1 >>/etc/wpa_supplicant.conf if [ $pasw == NONE ] then echo key_mgmt=NONE >>/etc/wpa_supplicant.conf else echo psk=\"$pasw\" >>/etc/wpa_supplicant.conf echo key_mgmt=WPA-EAP WPA-PSK IEEE8021X NONE >>/etc/wpa_supplicant.conf # echo group=CCMP TKIP WEP104 WEP40 >>/etc/wpa_supplicant.conf fi echo } >>/etc/wpa_supplicant.conf ifconfig -a|grep mlan0 |grep -v grep > /dev/null if [ $? -eq 0 ] then ifconfig mlan0 down > /dev/null fi ifconfig -a|grep mlan1 |grep -v grep > /dev/null if [ $? -eq 0 ] then ifconfig mlan1 down > /dev/null fi ifconfig -a|grep eth0 |grep -v grep > /dev/null if [ $? -eq 0 ] then ifconfig eth0 down > /dev/null fi ifconfig -a|grep eth1 |grep -v grep > /dev/null if [ $? -eq 0 ] then ifconfig eth1 down > /dev/null fi ifconfig -a|grep usb0 |grep -v grep > /dev/null if [ $? -eq 0 ] then ifconfig usb0 down > /dev/null fi ps -fe|grep wpa_supplicant |grep -v grep > /dev/null if [ $? -eq 0 ] then kill -9 $(pidof wpa_supplicant) fi sleep 1 ifconfig $wifi up > /dev/null sleep 1 (wpa_supplicant -Dnl80211,wext -i$wifi -c/etc/wpa_supplicant.conf >/dev/null) & echo "waiting..." sleep 3 wpa_cli -i$wifi status |grep COMPLETED |grep -v grep >/dev/null if [ $? -eq 0 ] then dhcpcd -i $wifi echo "Finshed!" else echo "try to connect again..." sleep 3 wpa_cli -i$wifi status |grep COMPLETED |grep -v grep >/dev/null if [ $? -eq 0 ] then dhcpcd -i $wifi echo "nameserver 114.114.114.114" > /etc/resolv.conf echo "Finshed!" else echo "************************************************" echo "connect faild,please check the passward and ssid" kill -9 $(pidof wpa_supplicant) exit 1 fi fi Next, the firmware needs to be deployed to the /lib/firmware path of the board. root@rk3576-buildroot:/root# unzip firmware.zip -d /lib/ root@rk3576-buildroot:/root# ls /lib/firmware/iwlwifi-ty-a0-gf-a0* /lib/firmware/iwlwifi-ty-a0-gf-a0-59.ucode /lib/firmware/iwlwifi-ty-a0-gf-a0-66.ucode /lib/firmware/iwlwifi-ty-a0-gf-a0-71.ucode /lib/firmware/iwlwifi-ty-a0-gf-a0-72.ucode /lib/firmware/iwlwifi-ty-a0-gf-a0-73.ucode /lib/firmware/iwlwifi-ty-a0-gf-a0-74.ucode /lib/firmware/iwlwifi-ty-a0-gf-a0-77.ucode /lib/firmware/iwlwifi-ty-a0-gf-a0-78.ucode /lib/firmware/iwlwifi-ty-a0-gf-a0-79.ucode /lib/firmware/iwlwifi-ty-a0-gf-a0-81.ucode /lib/firm