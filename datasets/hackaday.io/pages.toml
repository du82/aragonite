["https://hackaday.io/page/399307"]
title = "Minerva Sewing Machine Renovation - CZ Renovace Šicího Stroje Minerva | kompresor.naradi | Hackaday.io"
description = '''
Minerva Sewing Machine Renovation - CZ Renovace Šicího Stroje Minerva [https://content.instructables.com/F5W/P9KV/M70HTBKJ/F5WP9KVM70HTBKJ.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMSAxMjoxMzoyMy4w]




For upcoming projects with textiles, I chose to renovate an old Minerva sewing machine as a project. This particular machine has a family history and has been stored in the attic for many years. The main reason for its unusabilitywas the missing power table. The original table was once "confiscated" by an uncle at a time when tables made from old sewing machine bases were in vogue. Unfortunately, the sewing machine itself was thrown away by my uncle. After a few years, I decided to repair the machine so I could use it to stitch fabric for projects.

Now, let’s dive into the full process in Czech!

Pro nadcházející projekty s textilem jsem si vybral jako projekt renovaci starého šicího stroje Minerva. Tento konkrétní stroj má rodinnou historii a byl dlouhá léta uschován na půdě. Hlavním důvodem jeho nepoužitelnosti byl chybějící stůl s pohonem. Původní stůl kdysi "zabavil" strýc v době, kdy byly v módě stoly ze starých podstavců šicích strojů. Samotný šicí stroj strýc odložil. Po několika letech jsem se rozhodl, že stroj opravím, abych ho mohl používat k sešívání látek pro různé projekty.


SUPPLIES

Čerpal jsem z videí od autora Hefesto Design [https://www.youtube.com/@hefestodesign] a autorky Sewing Machine Rehab [https://www.youtube.com/@SewingMachineRehab]. Oba se zabývají stejným šicím strojem jako mám já. Autorka z kanálu Sewing Machine Rehab [https://www.youtube.com/@SewingMachineRehab] dokonce ukazuje renovaci motorů k šicím strojům. Základní dílenské postupy jsem čerpal z knihy Strojírenské technologie, M. Hluchý. Celý můj postup je popsán také v druhé části dokumentace.


STEP 1: ZKOUMÁNÍ STÁVAJÍCÍHO STAVU

Zkoumání Stávajícího Stavu [https://content.instructables.com/FTE/Z76V/M74S49LR/FTEZ76VM74S49LR.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwNjowMjowNi4w]
Zkoumání Stávajícího Stavu [https://content.instructables.com/FRS/75CO/M74S49LW/FRS75COM74S49LW.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwNjowMjoxMi4w]
Zkoumání Stávajícího Stavu [https://content.instructables.com/F8B/3VYT/M74S4AAD/F8B3VYTM74S4AAD.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwNjoyMDo1NS4w]
Zkoumání Stávajícího Stavu [https://content.instructables.com/F45/BKQK/M74S4H4W/F45BKQKM74S4H4W.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwOTo0Mzo1Mi4w]

Po přivezení stroje z půdy bylo prvním úkolem zjistit jeho stávající stav. Neznal jsem stav vnitřního mechanismu ani kompletnosti stroje. První vizuální kontrola potvrdila, že mechanika stroje je pohyblivá. Stroj byl sice mírně "zatuhlý" vlivem dlouhého nepoužívání, ale bylo mi zřejmé, že tento problém vyřeší dobré promazání stroje.

Základním bodem úspěchu byla kompletnost stroje. Kromě chybějícího stolu a pohonu se zdálo, že stroji nic důležitého nechybí. Absence zásadních komponent, jako například člunku, by mohla renovaci výrazně zkomplikovat. V případě nedostatku méně důležitých dílů, například nějakého táhla, bych byl schopen díl nahradit vlastní výrobou nebo improvizací. Ovšem u absence složitých a specifických součástek, by to znamenalo shánění náhradního dílu, což by bylo velice složité a časově náročné. Naštěstí stroj byl kompletní, což výrazně zvýšilo šance na úspěšné zprovoznění.


STEP 2: PŘÍPRAVA DŘEVĚNÉHO RÁMU

Příprava Dřevěného Rámu [https://content.instructables.com/FKO/1NJ8/M74S49NA/FKO1NJ8M74S49NA.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwNjowNDozMi4w]
Příprava Dřevěného Rámu [https://content.instructables.com/FDF/YL3X/M74S49UN/FDFYL3XM74S49UN.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwNjoxMjo0MS4w]
https://content.instructables.com/FMM/EE1Y/M74S49UV/FMMEE1YM74S49UV.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwNjoxMjo1My4wPříprava Dřevěného Rámu
Příprava Dřevěného Rámu [https://content.instructables.com/FDH/4M7R/M74S49VE/FDH4M7RM74S49VE.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwNjoxMzowOS4w]
Příprava Dřevěného Rámu [https://content.instructables.com/F2B/ASK6/M74S49VR/F2BASK6M74S49VR.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwNjoxMzoyNi4w]

Po přezkoušení a promazání stroje jsem se rozhodl, že pro stroj vytvořím novou základnu v podobě dřevěného rámu. Dřevěný rám jsem zvolil z několika důvodů:

 1. Náhrada chybějícího stolu - stabilní a pevná základna pro šicí stroj.
 2. Pohon elektromotorem namísto šlapání. Pohon motorem zvyšuje komfort a efektivitu práce se strojem.
 3. Snaha o minimalizaci prostorových nároků. Kompaktní rozměry jsou důležité pro skladování stroje.

Později jsem během hledání na internetu zjistil, že podobná úprava šicích strojů (montáž na dřevěný rám s motorový pohonem) je poměrně běžná a osvědčená. Pro konstrukci rámu bylo potřeba naměřit klíčové rozměry stroje. Nejnáročnější byla na změření výška rámu, která musela odpovídat potřebné hloubce pro schování celého spodního mechanismu stroje. Kromě výšky byla naměřena i délka a šířka rámu tak, aby stroj stabilně seděl na rámu .

Jako materiál pro rám jsem vybral klasickou střešní lať o rozměrech 40 x 60 mm. Tato lať byla rozměrově vyhovující a dostatečně pevná pro daný účel. Lať jsem nařezal na potřebné délky podle naměřených rozměrů. Rám jsem poté vyvrtal a sešrouboval pomocí osmi vrutů.


STEP 3: ÚPRAVA RÁMU PRO MONTÁŽ STROJE

Úprava Rámu Pro Montáž Stroje [https://content.instructables.com/FUX/R2L5/M74S4A1R/FUXR2L5M74S4A1R.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwNjoxNzozMi4w]
Úprava Rámu Pro Montáž Stroje [https://content.instructables.com/FJS/B9V9/M74S4A26/FJSB9V9M74S4A26.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwNjoxNzozOC4w]
Úprava Rámu Pro Montáž Stroje [https://content.instructables.com/FQ1/SCWN/M74S4A2M/FQ1SCWNM74S4A2M.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwNjoxNzo0Mi4w]


Úprava Rámu Pro Montáž Stroje [https://content.instructables.com/FE4/5ED3/M74S4A3L/FE45ED3M74S4A3L.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwNjoxNzo1My4w]
Úprava Rámu Pro Montáž Stroje [https://content.instructables.com/FV1/XV90/M74S4A44/FV1XV90M74S4A44.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwNjoxODowNi4w]

Pro správné usazení šicího stroje na dřevěný rám bylo potřeba do rámu vyfrézovát drážky pro montážní ucha stroje. Původně jsem uvažoval o použití frézky pro přesné vyfrézování drážek. Nicméně pro jednodušší a rychlejší realizaci jsem zvolil alternativní metodu s použitím kovových korunek na dělání děr větších průměrů do dřeva.

Kovovou korunkou o vhodném průměru jsem odvrtal drážku o hloubce přibližně 2 cm v místech, kde se nacházejí montážní ucha podstavy stroje. Po odvrtání obvodu drážky jsem půlměsíček dřeva uvnitř drážky odštípl dlátem. Někde jsem odštípnutí provedl pouze dobře mířenou ranou kladiva na hranu půlměsíce. Tato "primitivní" metoda se ukázala jako dostatečně přesná a rychlá.


STEP 4: LAKOVÁNÍ DŘEVĚNÉHO RÁMU

Lakování Dřevěného Rámu [https://content.instructables.com/FHN/YC53/M74S4A85/FHNYC53M74S4A85.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwNjoyMDoyOS4w]
Lakování Dřevěného Rámu [https://content.instructables.com/FRB/CIJQ/M74S4A8S/FRBCIJQM74S4A8S.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwNjoyMDozMi4w]
Lakování Dřevěného Rámu [https://content.instructables.com/FP2/PU6E/M74S4A9I/FP2PU6EM74S4A9I.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwNjoyMDozNi4w]


Po vytvoření drážek byl dřevěný rám dokončen estetickými úpravami.

 1. Dřevěný rám jsem důkladně očistil od pilin a nečistot.
 2. Povrch rámu jsem zabrousil jemným brusným papírem pro hladký povrch.
 3. Rám jsem nalakoval průhledným lakem ve spreji. Průhledný lak chrání dřevo a zároveň zachovává jeho přírodní vzhled. Lak ve spreji zajišťuje rovnoměrné nanesení a rychlé schnutí.


STEP 5: REVIZE MOTORU

Revize Motoru [https://content.instructables.com/FH3/1LL5/M74S4GHC/FH31LL5M74S4GHC.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwOTo0MjoxMi4w]
Revize Motoru [https://content.instructables.com/F2D/7TP4/M74S4GJ5/F2D7TP4M74S4GJ5.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwOTo0MjoxNS4w]
Revize Motoru [https://content.instructables.com/FCO/EXG2/M74S4GKZ/FCOEXG2M74S4GKZ.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwOTo0MjoyMS4w]

Revize Motoru [https://content.instructables.com/F2T/SRFW/M74S4GMU/F2TSRFWM74S4GMU.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwOTo0MjoyNC4w]
Revize Motoru [https://content.instructables.com/FYI/S8ZG/M74S4GOQ/FYIS8ZGM74S4GOQ.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwOTo0MjozMS4w]
Revize Motoru [https://content.instructables.com/FLZ/2QBT/M74S4GQN/FLZ2QBTM74S4GQN.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwOTo0MjozMy4w]

Revize Motoru [https://content.instructables.com/FY3/GM7C/M74S4GYL/FY3GM7CM74S4GYL.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwOTo0MzowNC4w]
Revize Motoru [https://content.instructables.com/FTM/V40D/M74S4H0N/FTMV40DM74S4H0N.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwOTo0MzowNi4w]
Revize Motoru [https://content.instructables.com/F85/I64N/M74S4H2Q/F85I64NM74S4H2Q.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwOTo0MzoxMy4w]

Pro pohon stroje jsem využil starý motor pro šicí stroj, který jsem nalezl na půdě. Kromě motoru se mi podařilo získat i pedál. Díky tomu byly základní komponenty pro motorizaci stroje na světě. Revize motoru odhalila jeho znečištění a opotřebení. Motor byl plný nečistot a vyžadoval důkladné očištění. Pro řádnou revizi byl motor kompletně rozebrán. Všechny komponenty motoru byly pečlivě vyčištěny, včetně kluzných ložisek.

Během revize se ukázalo nerovnoměrné opotřebení komutátoru motoru. Komutátor jsem proto zbrousil jemným smirkovým papírem pro vyrovnání povrchu. Dalším problémem byla velká opotřebovanost uhlíků motoru. Opotřebované uhlíky jsem si zapsal na nákupní seznam pro pozdější výměnu.

Během práce na motoru došlo k nešťastné nehodě - ke ztrátě pružinové podložky. Při manipulaci spadla podložka na zem a nenávratně se ztratila v nepřehledném prostředí dílny. I přes usilovné hledání se původní podložku nepodařilo najít. Už jsem začínal "bědovat" nad ztrátou drobné, ale důležité součástky. Naštěstí kolega Filip poradil, kde by se dala pružinka zakoupit a navíc si vzpomněl, že sám má stejný motor. Kolega Filip velkoryse věnoval svůj motor pro renovační projekt. Později se sice v zásobě podložek našla kompatibilní náhrada, ale darovaný motor byl v lepší kondici a s menším opotřebením. Původní, méně vhodný motor, jsem proto zkompletoval a "poslal zpět na půdu" jako rezervní díl. Ze starého, méně vhodného motoru, jsem přece jen využil dvě komponenty - řemínek a přírubu motoru. Tyto díly se ukázaly jako rozdílné oproti darovanému motoru a byly proto převzaty pro další použití.


STEP 6: REVIZE PEDÁLU K MOTORU

Revize Pedálu K Motoru [https://content.instructables.com/FUA/UPE0/M74S4G73/FUAUPE0M74S4G73.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwOTo0MToyOC4w]
Revize Pedálu K Motoru [https://content.instructables.com/F7J/A7ZW/M74S4G8Q/F7JA7ZWM74S4G8Q.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwOTo0MTozMS4w]
Revize Pedálu K Motoru [https://content.instructables.com/F2W/6QRS/M74S4GAE/F2W6QRSM74S4GAE.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwOTo0MTozOC4w]




Po revizi motoru se moje pozornost zaměřila na pedál. Pedál vykazoval problém ovládání otáček motoru. Po stisknutí pedálu se stroj rozbíhal příliš rychle a pedál se sám nevracel do výchozí polohy. Rozebrání pedálu odhalilo příčinu problémů. Uvnitř pedálu byly nalezeny dva "válce" a "táhlo", které na válce tlačilo, ale nezdálo se, že by je táhlo zpět. Očividně v mechanismu pedálu chyběla pružinka, která by zajišťovala návrat pedálu do výchozí polohy. V zásobě pružinek byla nalezena vhodná pružinka, která byla do pedálu následně instalována. Přidání pružinky vyřešilo problém s nevracejícím se pedálem a umožnilo plynulé ovládání rychlosti šicího stroje.


STEP 7: MONTÁŽ MOTORU NA ŠICÍ STROJ

Montáž Motoru Na Šicí Stroj [https://content.instructables.com/FST/NNGI/M74S4FZG/FSTNNGIM74S4FZG.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwOTo0MDozOC4w]
Montáž Motoru Na Šicí Stroj [https://content.instructables.com/FMD/B2FD/M74S4G0X/FMDB2FDM74S4G0X.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwOTo0MDo0Ni4w]
Montáž Motoru Na Šicí Stroj [https://content.instructables.com/FMH/9H0X/M74S4G2F/FMH9H0XM74S4G2F.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwOTo0MDo0OS4w]


Montáž Motoru Na Šicí Stroj [https://content.instructables.com/FOO/BO6N/M74S4G3Y/FOOBO6NM74S4G3Y.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwOTo0MDo1NS4w]
Montáž Motoru Na Šicí Stroj [https://content.instructables.com/FVU/YDVT/M74S4G5I/FVUYDVTM74S4G5I.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwOTo0MTowNy4w]

Během montáže motoru na šicí stroj se ukázala prozíravost konstruktérů starých šicích strojů. S radostí bylo zjištěno, že konstrukce stroje pamatuje i na možnost přidání motoru. Na stroji byly připraveny díry pro montáž motoru. Do nich bylo třeba pouze vytvořit závit. Vyřezání závitů se podařilo úspěšně u spodní díry. U horní díry se však objevil problém kvůli překážejícímu hnacímu kolu stroje. Po zvážení byl učiněn závěr, že pro stabilní upevnění motoru bude dostačovat i jeden upevňovací šroub. Rozhodnutí se ukázalo jako funkční. Po vyřezání závitů byly ze stroje odstraněny vzniklé špony. Celý stroj byl následně ze spodu a zevnitř důkladně promazán pro zajištění hladkého chodu mechanismu.


STEP 8: ČIŠTĚNÍ ČLUNKU

Čištění Člunku [https://content.instructables.com/F8A/TKCT/M74S4FV7/F8ATKCTM74S4FV7.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwOTo0MDoxMS4w]
Čištění Člunku [https://content.instructables.com/F21/68DU/M74S4FWL/F2168DUM74S4FWL.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwOTo0MDoxNC4w]

Člunek šicího stroje byl po vyjmutí ze stroje viditelně znečištěný a "omšelý". Pro zlepšení vzhledu byl člunek vyleštěn ve stolní vrtačce pomocí leštícího kotouče a pasty. Leštění člunku nemá přímý vliv na funkčnost stroje, ale vyleštěný člunek se mi více líbil.


STEP 9: NÁKUP POTŘEBNÉHO VYBAVENÍ

Nákup Potřebného Vybavení [https://content.instructables.com/F01/04U5/M74S4FOI/F0104U5M74S4FOI.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwOTozOTozMy4w]
Nákup Potřebného Vybavení [https://content.instructables.com/F8Y/JFKK/M74S4FR5/F8YJFKKM74S4FR5.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwOTozOTo1MC4w]

Pro zahájení šicích testů bylo potřeba dokoupit základní vybavení - nitě a špulky do člunku. Komponenty sada nití, špulek a sada jehel byla zakoupena ve specializovaném obchodě "Látky Mráz". Při nákupu špulek do člunku nastala chyba - nebyly změřeny rozměry původních špulek. Výsledkem bylo, že polovina zakoupených špulek do člunku "nepasovala" a bylo potřeba dokoupit správný rozměr.


STEP 10: ŘEŠENÍ PROBLÉMU S NAVÍJENÍM ŠPULEK

Řešení Problému S Navíjením Špulek [https://content.instructables.com/FIH/YX82/M74S4FN9/FIHYX82M74S4FN9.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwOTozOToxNC4w]
Řešení Problému S Navíjením Špulek [https://content.instructables.com/F7W/HBSW/M74S4H95/F7WHBSWM74S4H95.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwOTo0NDo0MC4w]

Poslední překážkou před dokončením renovace byl mechanismus pro navíjení špulek. Při testování se ukázalo, že "zpuchřelá guma" je nefunkční. Původní, zničený gumový kroužek jsem nahradil novým gumovým těsněním vhodných rozměrů. I přes výměnu gumového kroužku však mechanismus navíjení špulek nefunguje optimálně. Pro pohodlnější a spolehlivější navíjení špulek do člunku raději používám aku vrtačku.


STEP 11: PRVNÍ ŠICÍ TESTY

První Šicí Testy [https://content.instructables.com/FHQ/YKN8/M74S4FJO/FHQYKN8M74S4FJO.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwOTozODozOC4w]
První Šicí Testy [https://content.instructables.com/FPX/KGNK/M74S4FM0/FPXKGNKM74S4FM0.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwOTozODo1OC4w]
První Šicí Testy [https://content.instructables.com/FJR/OGWN/M74S4FKT/FJROGWNM74S4FKT.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwOTozODo0My4w]

Moje první testy šití nebyly nic moc. Na kusu hadru jsem si vyzkoušel zapošívání a šití. Vyzkoušel jsem si, jak stroj unáší látku a jak je mu třeba pomoci. Vyzkoušel jsem si práci koordinace šití s ručním přehazováním směru šití. Zkoušel jsem vyšívat znaky a písmena do hadru. Nakonec jsem si z gumové stuhy sešil popruh na krabičku.


STEP 12: ZÁVĚR

Závěr [https://content.instructables.com/FGW/Y32L/M74S4FHJ/FGWY32LM74S4FHJ.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwOTozODoyMy4w]
Závěr [https://content.instructables.com/FBL/7RL0/M74S4FIL/FBL7RL0M74S4FIL.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xNCAwOTozODozMS4w]

Takto jsem završil svoji práci na renovaci šicího stroje Minerva. Stroj je nyní plně funkční a připravený na další projekty. Renovace starého stroje mi přinesla nejen funkční nástroj, ale i radost z obnovení staré technologie a uspokojení z vlastnoručně vykonané práce.'''
full_description = 'For upcoming projects with textiles, I chose to renovate an old Minerva sewing machine as a project. This particular machine has a family history and has been stored in the attic for many years. The main reason for its unusabilitywas the missing power table. The original table was once "confiscated" by an uncle at a time when tables made from old sewing machine bases were in vogue. Unfortunately, the sewing machine itself was thrown away by my uncle. After a few years, I decided to repair the machine so I could use it to stitch fabric for projects.Now, let’s dive into the full process in Czech!Pro nadcházející projekty s textilem jsem si vybral jako projekt renovaci starého šicího stroje Minerva. Tento konkrétní stroj má rodinnou historii a byl dlouhá léta uschován na půdě. Hlavním důvodem jeho nepoužitelnosti byl chybějící stůl s pohonem. Původní stůl kdysi "zabavil" strýc v době, kdy byly v módě stoly ze starých podstavců šicích strojů. Samotný šicí stroj strýc odložil. Po několika letech jsem se rozhodl, že stroj opravím, abych ho mohl používat k sešívání látek pro různé projekty.SuppliesČerpal jsem z videí od autora Hefesto Design a autorky Sewing Machine Rehab. Oba se zabývají stejným šicím strojem jako mám já. Autorka z kanálu Sewing Machine Rehab dokonce ukazuje renovaci motorů k šicím strojům. Základní dílenské postupy jsem čerpal z knihy Strojírenské technologie, M. Hluchý. Celý můj postup je popsán také v druhé části dokumentace.Step 1: Zkoumání Stávajícího Stavu Po přivezení stroje z půdy bylo prvním úkolem zjistit jeho stávající stav. Neznal jsem stav vnitřního mechanismu ani kompletnosti stroje. První vizuální kontrola potvrdila, že mechanika stroje je pohyblivá. Stroj byl sice mírně "zatuhlý" vlivem dlouhého nepoužívání, ale bylo mi zřejmé, že tento problém vyřeší dobré promazání stroje.Základním bodem úspěchu byla kompletnost stroje. Kromě chybějícího stolu a pohonu se zdálo, že stroji nic důležitého nechybí. Absence zásadních komponent, jako například člunku, by mohla renovaci výrazně zkomplikovat. V případě nedostatku méně důležitých dílů, například nějakého táhla, bych byl schopen díl nahradit vlastní výrobou nebo improvizací. Ovšem u absence složitých a specifických součástek, by to znamenalo shánění náhradního dílu, což by bylo velice složité a časově náročné. Naštěstí stroj byl kompletní, což výrazně zvýšilo šance na úspěšné zprovoznění.Step 2: Příprava Dřevěného Rámu Po přezkoušení a promazání stroje jsem se rozhodl, že pro stroj vytvořím novou základnu v podobě dřevěného rámu. Dřevěný rám jsem zvolil z několika důvodů:Náhrada chybějícího stolu - stabilní a pevná základna pro šicí stroj.Pohon elektromotorem namísto šlapání. Pohon motorem zvyšuje komfort a efektivitu práce se strojem.Snaha o minimalizaci prostorových nároků. Kompaktní rozměry jsou důležité pro skladování stroje.Později jsem během hledání na internetu zjistil, že podobná úprava šicích strojů (montáž na dřevěný rám s motorový pohonem) je poměrně běžná a osvědčená. Pro konstrukci rámu bylo potřeba naměřit klíčové rozměry stroje. Nejnáročnější byla na změření výška rámu, která musela odpovídat potřebné hloubce pro schování celého spodního mechanismu stroje. Kromě výšky byla naměřena i délka a šířka rámu tak, aby stroj stabilně seděl na rámu .Jako materiál pro rám jsem vybral klasickou střešní lať o rozměrech 40 x 60 mm. Tato lať byla rozměrově vyhovující a dostatečně pevná pro daný účel. Lať jsem nařezal na potřebné délky podle naměřených rozměrů. Rám jsem poté vyvrtal a sešrouboval pomocí osmi vrutů.Step 3: Úprava Rámu Pro Montáž Stroje Pro správné usazení šicího stroje na dřevěný rám bylo potřeba do rámu vyfrézovát drážky pro montážní ucha stroje. Původně jsem uvažoval o použití frézky pro přesné vyfrézování drážek. Nicméně pro jednodušší a rychlejší realizaci jsem zvolil alternativní metodu s použitím kovových korunek na dělání děr větších průměrů do dřeva.Kovovou korunkou o vhodném průměru jsem odvrtal drážku o hloubce přibližně 2 cm v místech, kde se nacházejí montážní ucha podstavy stroje. Po odvrtání obvodu drážky jsem půlměsíček dřeva uvnitř drážky odštípl dlátem. Někde jsem odštípnutí provedl pouze dobře mířenou ranou kladiva na hranu půlměsíce. Tato "primitivní" metoda se ukázala jako dostatečně přesná a rychlá.Step 4: Lakování Dřevěného Rámu Po vytvoření drážek byl dřevěný rám dokončen estetickými úpravami.Dřevěný rám jsem důkladně očistil od pilin a nečistot.Povrch rámu jsem zabrousil jemným brusným papírem pro hladký povrch.Rám jsem nalakoval průhledným lakem ve spreji. Průhledný lak chrání dřevo a zároveň zachovává jeho přírodní vzhled. Lak ve spreji zajišťuje rovnoměrné nanesení a rychlé schnutí.Step 5: Revize Motoru Pro pohon stroje jsem využil starý motor pro šicí stroj, který jsem nalezl na půdě. Kromě motoru se mi podařilo získat i pedál. Díky tomu byly základní komponenty pro motorizaci stroje na světě. Revize motoru odhalila jeho znečištění a opotřebení. Motor byl plný nečistot a vyžadoval důkladné očištění. Pro řádnou revizi byl motor kompletně rozebrán. Všechny komponenty motoru byly pečlivě vyčištěny, včetně kluzných ložisek.Během revize se ukázalo nerovnoměrné opotřebení komutátoru motoru. Komutátor jsem proto zbrousil jemným smirkovým papírem pro vyrovnání povrchu. Dalším problémem byla velká opotřebovanost uhlíků motoru. Opotřebované uhlíky jsem si zapsal na nákupní seznam pro pozdější výměnu.Během práce na motoru došlo k nešťastné nehodě - ke ztrátě pružinové podložky. Při manipulaci spadla podložka na zem a nenávratně se ztratila v nepřehledném prostředí dílny. I přes usilovné hledání se původní podložku nepodařilo najít. Už jsem začínal "bědovat" nad ztrátou drobné, ale důležité součástky. Naštěstí kolega Filip poradil, kde by se dala pružinka zakoupit a navíc si vzpomněl, že sám má stejný motor. Kolega Filip velkoryse věnoval svůj motor pro renovační projekt. Později se sice v zásobě podložek našla kompatibilní náhrada, ale darovaný motor byl v lepší kondici a s menším opotřebením. Původní, méně vhodný motor, jsem proto zkompletoval a "poslal zpět na půdu" jako rezervní díl. Ze starého, méně vhodného motoru, jsem přece jen využil dvě komponenty - řemínek a přírubu motoru. Tyto díly se ukázaly jako rozdílné oproti darovanému motoru a byly proto převzaty pro další použití.Step 6: Revize Pedálu K Motoru Po revizi motoru se moje pozornost zaměřila na pedál. Pedál vykazoval problém ovládání otáček motoru. Po stisknutí pedálu se stroj rozbíhal příliš rychle a pedál se sám nevracel do výchozí polohy. Rozebrání pedálu odhalilo příčinu problémů. Uvnitř pedálu byly nalezeny dva "válce" a "táhlo", které na válce tlačilo, ale nezdálo se, že by je táhlo zpět. Očividně v mechanismu pedálu chyběla pružinka, která by zajišťovala návrat pedálu do výchozí polohy. V zásobě pružinek byla nalezena vhodná pružinka, která byla do pedálu následně instalována. Přidání pružinky vyřešilo problém s nevracejícím se pedálem a umožnilo plynulé ovládání rychlosti šicího stroje.Step 7: Montáž Motoru Na Šicí Stroj Během montáže motoru na šicí stroj se ukázala prozíravost konstruktérů starých šicích strojů. S radostí bylo zjištěno, že konstrukce stroje pamatuje i na možnost přidání motoru. Na stroji byly připraveny díry pro montáž motoru. Do nich bylo třeba pouze vytvořit závit. Vyřezání závitů se podařilo úspěšně u spodní díry. U horní díry se však objevil problém kvůli překážejícímu hnacímu kolu stroje. Po zvážení byl učiněn závěr, že pro stabilní upevnění motoru bude dostačovat i jeden upevňovací šroub. Rozhodnutí se ukázalo jako funkční. Po vyřezání závitů byly ze stroje odstraněny vzniklé špony. Celý stroj byl následně ze spodu a zevnitř důkladně promazán pro zajištění hladkého chodu mechanismu.Step 8: Čištění Člunku Člunek šicího stroje byl po vyjmutí ze stroje viditelně znečištěný a "omšelý". Pro zlepšení vzhledu byl člunek vyleštěn ve stolní vrtačce pomocí leštícího kotouče a pasty. Leštění člunku nemá přímý vliv na funkčnost stroje, ale vyleštěný člunek se mi více líbil.Step 9: Nákup Potřebného Vybavení Pro zahájení šicích testů bylo potřeba dokoupit základní vybavení - nitě a špulky do člunku. Komponenty sada nití, špulek a sada jehel byla zakoupena ve specializovaném obchodě "Látky Mráz". Při nákupu špulek do člunku nastala chyba - nebyly změřeny rozměry původních špulek. Výsledkem bylo, že polovina zakoupených špulek do člunku "nepasovala" a bylo potřeba dokoupit správný rozměr.Step 10: Řešení Problému S Navíjením Špulek Poslední překážkou před dokončením renovace byl mechanismus pro navíjení špulek. Při testování se ukázalo, že "zpuchřelá guma" je nefunkční. Původní, zničený gumový kroužek jsem nahradil novým gumovým těsněním vhodných rozměrů. I přes výměnu gumového kroužku však mechanismus navíjení špulek nefunguje optimálně. Pro pohodlnější a spolehlivější navíjení špulek do člunku raději používám aku vrtačku.Step 11: První Šicí Testy Moje první testy šití nebyly nic moc. Na kusu hadru jsem si vyzkoušel zapošívání a šití. Vyzkoušel jsem si, jak stroj unáší látku a jak je mu třeba pomoci. Vyzkoušel jsem si práci koordinace šití s ručním přehazováním směru šití. Zkoušel jsem vyšívat znaky a písmena do hadru. Nakonec jsem si z gumové stuhy sešil popruh na krabičku.Step 12: Závěr Takto jsem završil svoji práci na renovaci šicího stroje Minerva. Stroj je nyní plně funkční a připravený na další projekty. Renovace starého stroje mi přinesla nejen funkční nástroj, ale i radost z obnovení staré technologie a uspokojení z vlastnoručně vykonané práce. Like Share'
