full_description = "Details Welcome to Prototyping in Mechanical Engineering! Tickets to this course I'll give you a toolkit to think about the world as a mechanical engineer does, and I'll impart some of my knowledge from years of prototyping and mechanical system design. I'll throw in some anecdotes from my past, including cocktail robots, nanotechnology, and other hilarious subjects. This course is aimed at technical people, and I'll teach with an assumption that you already know basic physics, chemistry, and algebra. The pace of the class will be extremely quick; we have a lot to cover in a very short amount of time and this class is really meant as an overview of decades of my experience. Materials: You won't need anything special to participate in the course, but I do recommend taking notes, since we'll be moving very quickly. In week 3, I'll give a list of the twelve tools I think are most critical to engineering, but you won't need those to take the class (just to implement it on your own stuff!). About me: Will Fischer is a serial entrepreneur, mechanical engineer, and patent agent with more than a decade of engineering experience in medical devices, material science, nanotechnology, semiconductor, robotics, and furniture. He has a BS and MME from Rice University and an MBA from University of Chicago's Booth School of Business and resides in Berlin, Germany where he teaches classes on machining, manufacturing, and business and consults as a prototyping engineer and business strategist. His hobby has been building cocktail robots and his team has won 3 First Prizes at the San Francisco Cocktail Robotics Grand Challenge for their robots N.E.Bree-8 and The Blaster. He is currently working on his 6th cocktail robot in Berlin. Files Hackaday Class 5.pdf These are the slides from the fifth lecture: Motion, Gearing, and Actuation Adobe Portable Document Format - 3.69 MB - 03/15/2021 at 23:10 Preview Hackaday Class 4.pdf These are the slides from the fourth lecture: Fluids and Thermodynamics Adobe Portable Document Format - 5.84 MB - 03/15/2021 at 23:09 Preview Hackaday Class 3.pdf These are the slides from the third lecture: Fabrication and Machining Adobe Portable Document Format - 4.73 MB - 02/11/2021 at 08:02 Preview Hackaday Class 2.pdf These are the slides from the second lecture: Materials (and how to select them) Adobe Portable Document Format - 10.74 MB - 02/08/2021 at 13:46 Preview Hackaday Class 1.pdf These are the slides from the first lecture: Introduction and How to Read a Schematic Drawing Adobe Portable Document Format - 5.31 MB - 02/08/2021 at 13:45 Preview Course Classes Collapse Class 1: Introduction to Prototyping, Schematics, and Drawings Will Fischer • 12/23/2020 at 11:27 • 0 comments This is our intro class, and I'll talk about my background, why engineers prototype, and I'll finish with important information on how to read and think about schematic drawings and buying parts from vendors. IntroductionWho I am and my backgroundHow I tend to workCourse introWhat is Mechanical Engineering?What to expect to learnPaceWhy prototype?Move quicklyLearn from your prototypesDrawingsWhy drawings are importantHow to read a drawingThings to keep in mind when creating a drawingInspection Image used in Quiz 1 Class 1 Video: Class 2: Materials and Material Selection Will Fischer • 12/23/2020 at 11:31 • 0 comments This class will be a lightning quick overview of material science, an important facet of mechanical engineering Class 2 - Materials Why materials are importantConsiderations in selectionTypes of materials MetalsAluminumSteelOthersPlastics / PolymersCheap plastics‘Designer’ plasticsElastomersCeramicsComposites/OtherWoodCarbon fiber / fiberglassOther Class 2 Video: Class 3: Fabrication, Tools, and the Machine Shop Will Fischer • 12/23/2020 at 11:34 • 0 comments This course will cover methods of conventional fabrication and will include a list of twelve essential tools to own. Plus, we'll talk about how to use your machine shop (or how to select a good one). Types of fabrication AdditiveSubtractive CuttingGrindingOthersWeldingWill’s List of Twelve Tools To OwnHow to design for the machine shop Class 3 Video: Class 4: Fluids Will Fischer • 12/23/2020 at 11:38 • 0 comments In another speedy overview, we'll discuss some of the knowledge necessary to design fluid systems. Will include anecdotes from my background in cocktail robotics and practical design criteria to help you build your own piping, pumping, and valving systems. Definition of a ‘fluid’PipingPressure vessel designPumping systemsValves Class 4 Video: Class 5: Motion, Gears, and Actuation Will Fischer • 12/23/2020 at 11:42 • 0 comments The class you've all been waiting for: how stuff moves. We'll cover some of the math of actuation, as well as an overview of the different parts you can use to move things around. I'll get into how each different system works so that you can understand the theory behind selecting things. Because movement is at the core of mechanical engineering, we have to build up to this! Introduction to motionThe math of motionGearing systemsSpursBevelsWormsDifferentialTransmissionsClutchesActuationLinear actuationSolenoidsPneumatics/hydraulicsElectrical linear actuatorsRotary actuationStandard DC motorsServos Steppers Class 5 Video: Weekly Quizzes Lutetium • 01/26/2021 at 00:08 • 0 comments Week 1 - Quiz 1 Week 2 - Quiz 2 Week 3 - Quiz 3 Week 4 - Quiz 4 Week 5 - Quiz 5 View all 6 course classes Participants (1) Enjoy this course? Share This course was created on 12/23/2020 and last updated 9 months ago. Discussions Log In/Sign up to comment Become a Hackaday.io Member Create an account to leave a comment. Already have an account? Log In. Sign up with Github Sign up with X OR Sign up Bowwerreinaldoson4 wrote 05/28/2022 at 11:36 • point Wow, really amazing course. As you have designed the course in a very explanatory way. Is there any course related to web designing so that I could get it and make our https://golfwatchcenter.com/best-golf-gps-watch-for-ladies/ a brand. Because I have started this project since 2020 and still working on it. Are you sure? yes | no tiydaresto wrote 03/29/2021 at 17:30 • point wawa Are you sure? yes | no Narashiman wrote 03/27/2021 at 12:01 • point Really brilliant course. Thanks Will. Looking forward to learn more from you. Are you sure? yes | no var pageIndex = 0;"
