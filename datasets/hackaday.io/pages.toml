full_description = "The system receives real-time data from the simulators and renders it in a clear and functional interface, closely replicating the appearance and behavior of the original device. This project is ideal for sim enthusiasts looking to improve their cockpit setup with accurate, custom-built instrumentation. It is especially useful in advanced add-ons that replicate the different EGT and CHT temperatures for each cylinder. The functions and user interaction are closely replicated, providing an almost 1:1 experience with the real device.Real docs: https://www.insightavionics.com/bestg4.htmThe system is currently working with MSFS, using a Lua script and FSUIPC to interface with the A2A Piper Comanche. I plan to add a setup option to select between 4 or 6 cylinders and define minimum and maximum values for the analyzed parameters. By editing the Lua script, it can be adapted to work with any aircraft in MSFS. Additionally, by changing the Teensy 4.0 firmware, it can be made compatible with X-Plane, using the Flight Sim Controls plugin."
