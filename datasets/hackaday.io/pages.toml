sed in other systems, while DNSmasq is chosen here. Here's a brief comparison of the two services: （1）udhcpd A DHCP server from the BusyBox toolkit. Assigns dynamic IP addresses, subnet masks, gateways, etc., to local network devices. Does not include DNS forwarding or other network services. （2）DNSmasq A lightweight DNS forwarder and DHCP server. ① Forwards DNS queries to upstream servers and caches results to improve response times. ② As a DHCP server, its functionality is similar to udhcpd (not repeated here). Primarily used in small networks (e.g., home networks, small offices, routers) due to its ease of configuration and management. In contrast, udhcpd is better suited for embedded systems or resource-constrained environments. After the introduction of extended knowledge, the AP mode is opened: root@rk3576-buildroot:/root# fltest_hostapd.sh [ 6470.256308] wlp1s0: deauthenticating from ee:b9:70:81:7d:88 by local choice (Reason: 3=DEAUTH_LEAVING) killall: hostapd: no process killed Stopping dnsmasq: FAIL Starting dnsmasq: OK [ 6471.641533] IPv6: ADDRCONF(NETDEV_CHANGE): wlp1s0: link becomes ready wlp1s0: interface state UNINITIALIZED->ENABLED wlp1s0: AP-ENABLED root@rk3576-buildroot:/root# ifconfig wlp1s0 wlp1s0 Link encap:Ethernet HWaddr 4C:49:6C:F0:99:7A inet addr:192.168.2.1 Bcast:192.168.2.255 Mask:255.255.255.0 UP BROADCAST RUNNING MULTICAST MTU:1500 Metric:1 RX packets:50382 errors:0 dropped:2982 overruns:0 frame:0 TX packets:261 errors:0 dropped:0 overruns:0 carrier:0 collisions:0 txqueuelen:1000 RX bytes:4291281 (4.0 MiB) TX bytes:27170 (26.5 KiB) The following is the hot spot to use mobile phone to connect to the embedded OK3576-C development board. root@rk3576-buildroot:/root# ping 192.168.2.225 PING 192.168.2.225 (192.168.2.225) 56(84) bytes of data. 64 bytes from 192.168.2.225: icmp_seq=1 ttl=64 time=142 ms 64 bytes from 192.168.2.225: icmp_seq=2 ttl=64 time=60.1 ms 64 bytes from 192.168.2.225: icmp_seq=3 ttl=64 time=88.2 ms 64 bytes from 192.168.2.225: icmp_seq=4 ttl=64 time=110 ms 64 bytes from 192.168.2.225: icmp_seq=5 ttl=64 time=69.9 ms ^C --- 192.168.2.225 ping statistics --- 5 packets transmitted, 5 received, 0% packet loss, time 4004ms At this point, the new AX210NGW Wi-Fi 6E module has been successfully adapted. The adaptation approach for PCIe Wi-Fi modules is consistent. If other Wi-Fi modules are involved, this method can also serve as a reference for implementation. Like Share'''
