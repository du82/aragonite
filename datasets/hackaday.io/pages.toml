Pro zajištění příjemného a bezpečného prostředí pro návštěvníky párty je klíčový úklid a příprava zázemí. V prostorách pracovny kolegy bude proveden důkladný úklid. Úklid zahrnuje odstranění nepořádku, přípravu stolů a židlí pro posezení a celkové zpřehlednění prostoru. Dále bude zajištěno topení v místnosti, aby byl prostor komfortní i v chladnějším počasí.Bezpečnost návštěvníků je prioritou, proto budou minimalizována potenciální rizika v prostoru. Součástí přípravy je i nasvícení prostoru pracovny a příprava CRT gaming koutku pro zábavu návštěvníků. Nahoře na pochoze bylo technické zázemí s ledem, kávovarem a našimi osobními zásobami.


STEP 33: ÚKLID A PŘÍPRAVA DÍLNY

Úklid a Příprava Dílny [https://content.instructables.com/FXJ/1NDI/M70HSYO9/FXJ1NDIM70HSYO9.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMSAwOToyMDowMS4w]
Úklid a Příprava Dílny [https://content.instructables.com/FFT/Q39Y/M70HSYQH/FFTQ39YM70HSYQH.jpg?auto=webp&frame=1&width=1024&height=1024&fit=bounds&md=MjAyNS0wMi0xMSAwOToyMDoxMy4w]

Dílna, jako hlavní prostor konání párty, vyžaduje specifickou přípravu a úklid.Pracovní stůl v dílně byl uklizen a zbaven veškerých nepotřebných věcí a nářadí. Cílem je také minimalizovat riziko zcizení předmětů během akce a vytvořit čistý prostor. Z dílny byly odklizeny předměty, které by mohly svádět ke krádeži. Běžný odpad byl vymeten a odstraněn.Přebytečný nábytek, například židle, byly vyneseny z dílny, aby se uvolnil prostor pro návštěvníky.Zásuvky ponku a šuplíkové skříně byly uzamčeny, kvůli zvýšení bezpečnosti a zamezení nechtěné manipulaci s obsahem.


