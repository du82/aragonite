full_description = 'Step 17: Umístění Stroboskopu a Blinderu Byl přimontován stroboskop a blinder. Byly situovány přibližně doprostřed místnosti. Pro jejich upevnění bylo využito zavěšené police a ocelového čtvercového dutého profilu. Z ocelového profilu bylo vyrobeno rameno, které bylo připevněno k polici. Stroboskop byl k ramenu přišroubován. Pro zvýšení bezpečnosti a zamezení pádu stroboskopu bylo přidáno ocelové lanko jako bezpečnostní prvek. Stroboskop disponuje zabudovaným ovládáním přes DMX protokol. Nad stroboskop byl přichycen blinder, ten je pouze zapojen dole do dimmru.Step 18: Přidání Větráku Do SwitchboxuPři rekapitulaci příprav techniky se ukázala možnost zapojení větráku v rohu místnosti do Switchboxu. Toto řešení výrazně zjednodušuje obsluhu větráku během příprav i během párty a umožňuje rychlé reakce na aktuální potřeby ventilace dílny. Potřeba efektivní cirkulace vzduchu v dílně je dána několika faktory. Při větším počtu návštěvníků se v dílně rychle zvyšuje teplota a klesá kvalita vzduchu. Kromě lidského tepla přispívá k ohřívání vzduchu i provoz elektroniky, včetně LED světel, zesilovačů, lednice a dalších zařízení. Cirkulace vzduchu pomocí větráku pomáhá udržovat příjemnou teplotu a zajišťuje dostatečný přísun čerstvého vzduchu v dílně i při plné obsazenosti párty. V neposlední řadě větrák napomáhá i k efektivnějšímu šíření mlhy z mlhovače po celém prostoru dílny, čímž se zvyšuje vizuální efekt mlžné clony.Step 19: Přidání MultipáruNa žádost DJů vystupujících na párty bylo doplněno vybavení pro kamerový záznam jejich vystoupení. Kamera byla již dříve nainstalována a propojena přes HDMI s monitorem pro osvětlovače. Tento monitor umožňuje osvětlovači vizuální kontrolu scény a lepší cílení světelných efektů na vystupující DJe. Pro zajištění kvalitního záznamu vystoupení se ukázala potřeba přenést i audio signál přímo z mixážního pultu do počítače, na kterém bude probíhat záznam videa.Pro přenos audio signálu byl využit 12 metrový ethernetový kabel (FTP - Foiled Twisted Pair) jako tzv. "multipár". Přináší potenciál přenášet více signálů najednou a dostupnost náhradních párů vodičů pro případné budoucí rozšíření systému. Po ethernetovém kabelu je možné poslat audio signál z mixážního pultu zpět do počítače, kde bude synchronizován s video záznamem z kamery. Kromě audio signálu jsou v FTP kabelu k dispozici další dva volné páry vodičů, které lze v budoucnu využít například pro přidání mikrofonu od DJ stolu nebo pro další účely.Pro zajištění správné funkce audio přenosu po ethernetovém kabelu je nezbytné použít symetrizační členy. Symetrizace signálu pomocí balunů je důležitá pro potlačení rušení a zajištění kvalitního přenosu audio signálu po delším ethernetovém kabelu. Symetrizační členy byly vyrobeny podomácku ze dvou transformátorů s poměrem 1:1. Transformátory 1:1 slouží k symetrizaci a desymetrizaci audio signálu a zajišťují impedanční přizpůsobení mezi mixážním pultem, ethernetovým kabelem a počítačem. Symetrické vedení audia je odolnější proti rušení a umožňuje kvalitní přenos zvuku.Step 20: Nastavování Světel Přes Program QLights ControllerNastavení světelného pultu v programu QLights Controller se ukázalo jako časově náročné. Proces nastavování ovládacího rozhraní zabral téměř tři dny intenzivní práce. Nastavení LED pásku a Junior skeneru bylo z větší části převzato ze starších konfigurací, což urychlilo proces, ale i tak vyžadovalo důkladnou kontrolu a drobné úpravy.QLights Controller je mnou představován jako "primitivní" neplacený program s omezenými funkcemi pro kopírování při nastavování a také s omezenými funkcemi automatizace světelných efektů. Většina úkonů musí být prováděna manuálně "naklikáním", což výrazně prodlužuje čas potřebný pro kompletní nastavení světelného pultu. I přes svou jednoduchost QLights Controller poskytuje s rezervou dostatečné nástroje pro vytvoření funkčního a přehledného ovládacího rozhraní světel.Step 21: Přidání Fixtures a DMX Adres Prvním krokem bylo přidání všech ovladatelných světelných prvků v dílně do záložky "Fixtures". Pro každý světelný prvek (LED pásky, skenery, PAR reflektory, switchbox, dimmer, atd.) byl v programu definován nový "Fixture" s příslušnou/příslušnými DMX adresami. Adresy byly přiřazeny v souladu s fyzickým zapojením světel v DMX síti. Tento krok zajistil, že program QLights Controller "rozpoznal" všechna dostupná zařízení a umožnil jejich ovládání.Step 22: Přidávání Ovládacích Prvků Do Oken Dalším krokem bylo přidávání ovládacích prvků do jednotlivých oken virtuální konzole. Do oken byly postupně přidávány různé typy ovládacích prvků v závislosti na funkcích ovládaného zařízení. Mezi často používané ovládací prvky patřily:Tlačítka (Buttons): Pro spínání a rozpínání funkcí (např. "Strobo ON/OFF", "Kouř", jednotlivé barvy).Posuvníky (Sliders): Pro plynulou regulaci hodnot (např. "Dimmer", "Flash Rate", "Rychlost sekvence").Matice tlačítek/posuvníků (Button Matrix): Pro organizované seskupení více tlačítek/posuvníků (např. pro výběr barev nebo scén).Potenciometrické knoflíky (Rotary Knobs): Alternativa k posuvníkům pro regulaci hodnot (např. "Síla svitu", "Barvy světla", "Blikání", "Změna barvy", "Intenzita mlhy","gobo efekty").Rychlostní vytáčeč (Speed Dial): Pro rychlé nastavení rychlosti sekvencí nebo chaserů.XY Podložka (XY Pad): Pro intuitivní ovládání dvou parametrů najednou (např. pro ovládání pohybu u skeneru).Step 23: Nastavení Ovládání LED Pásku a Junior Skeneru Nejkomplexnější a nejnáročnější na nastavení je ovládání LED pásku a Junior skeneru. Při vytváření ovládaní LED pásku bylo čerpáno z již předpřipravené starší verze, ale pro lepší pochopení funkcí programu bylo vytvořeno znovu a lehce upraveno vzhledově. Stejný postup byl zvolen i u Junior skeneru, jehož ovládání bylo rovněž vytvořeno podle vzorového nastavení. LED panel i Junior skener vyžadovaly hodně času a práce, kvůli jejich velkému množství funcí a ovládacích parametrů.Step 24: Nastavení Ovládání Switchboxu Ovládání DMX Switchboxu bylo poměrně jednoduché a rychlé na nastavení. Do okna "Switchbox" byly přidány dva řádky po osmi tlačítkách. Horní řádek tlačítek byl nastaven do "On/Off" modu pro trvalé zapínání a vypínání jednotlivých zásuvek switchboxu. Dolní řádek tlačítek byl nastaven do "Bleskového" (Flash) modu pro krátkodobé sepnutí zásuvek po dobu držení tlačítka. Pro každé z osmi tlačítek v horním řádku bylo v záložce "Function" vytvořeno osm samostatných scén. Každá scéna (pojmenovaná "Switch ON 1" až "Switch ON 8") aktivuje příslušný kanál odpovídající dané zásuvce switchboxu. Po přiřazení scén k tlačítkům byly tlačítka přejmenována podle spotřebičů zapojených do jednotlivých zásuvek switchboxu pro snadnější identifikaci a ovládání. Kromě tlačítek byl do okna "Switchbox" přidán i "Rychlostní měnič" (Speed Dial) a "On/Off tlačítko" pro ovládání sekvence blikání neonů. Pro tyto dva ovládací prvky byla vytvořena sekvence (chaser), ve které se podle nastaveného času automaticky střídá rozsvěcení a zhasnutí jednotlivých neonů.Step 25: Nastavení Ovládání Dimmeru Ovládání 6-kanálového dimmeru bylo realizováno pomocí šesti posuvníků a dvou řádků tlačítek po šesti. Pro tlačítka bylo opět potřeba vytvořit šest scén. Každá scéna zajišťuje zapnutí příslušného dimmer kanálu na plný výkon. Posuvníkům byly přiřazeny příslušné dimmer kanály pro plynulou regulaci intenzity světla. Toto nastavení umožňuje intuitivní ovládání jasu šesti nezávislých světelných okruhů zapojených do dimmeru.Step 26: Nastavení Ovládání Stroboskopu Do okna "Strobo" byly přidány dvě tlačítka a dva posuvníky. První posuvník "Flash Rate" slouží k regulaci rychlosti stroboskopických záblesků. Druhý posuvník "Dimmer" ovládá intenzitu světelného výkonu stroboskopu. První tlačítko "Strobo ON" je nastaveno jako "bleskové tlačítko" (Flash). Po stisknutí tlačítka se stroboskop rozsvítí kontinuálním stroboskopickým efektem a po uvolnění tlačítka opět zhasne. Druhé tlačítko "One Shot" rovněž funguje jako "bleskové tlačítko". Po stisknutí tlačítka "One Shot" se aktivuje speciální sekvence (chaser), která simuluje jednorázový záblesk a poté rychlé zhasnutí stroboskopu. Délka blikání v modu "One Shot" je závislá na době držení tlačítka.Step 27: Nastavení Ovládání Mlhovače Do okna "Mlhovač" bylo přidáno pouze jedno tlačítko "Kouř" a jeden Potenciometrický knoflík. Tlačítko "Kouř" funguje v "bleskovém modu" a po stisknutí aktivuje kouř pokud je nahřátý, mlhovač je zapnutý na maximální výkon. Potenciometrický knoflík slouží k regulaci "Míry intenzity" mlžení. Tento knoflík ovládá kontinuální zakouřování prostorus nastavitelnou intenzitou mlhy.Step 28: Nastavení Ovládání LED PAR Reflektorů a Pin Spotu Pro Disko Kouli Ovládání LED PAR reflektorů a pin spotu pro disko kouli bylo navrženo stejně s ohledem na jejich podobnou funkcionalitu. Pro obě skupiny světel byla vytvořena vizuálně identická ovládací okna. Do každého okna bylo přidáno osm potenciometrických knoflíků a sedm tlačítek.Potenciometrické knoflíky slouží k ovládání následujících parametrů:Síla svitu (Brightness): Reguluje celkovou intenzitu světla.Barvy světla (Gobo): Ovládá výběr barev světla v "Gobo modu". Gobo mode zobrazuje malé okénko s náhledem vybrané barvy pro lepší vizuální zpětnou vazbu.RGBW kanály (4 knoflíky): Umožňují detailní nastavení barev pomocí hodnot červené (Red), zelené (Green), modré (Blue) a bílé (White) složky.Blikání (Strobe): Reguluje rychlost stroboskopického efektu LED PAR reflektorů a pin spotu.Změna barvy (Color Change): Ovládá automatickou změnu barev v různých modech (např. Color Jump, Color Fade).Druhý řádek obsahuje sedm tlačítek v "bleskovém modu (Flash)". Tato tlačítka jsou přednastavena pro rychlý výběr jednotlivých základních barev (např. červená, zelená, modrá, bílá, žlutá, azurová, fialová). Po stisknutí tlačítka se příslušný světelný prvek rozsvítí vybranou barvou a po uvolnění tlačítka se opět zhasne.Step 29: Náročné Testování a Ladění Nastavení LED Panelu a Junior Skeneru Hodně času a úsilí zabralo testování nastavení ovládacích prvků pro LED panel a Junior skener. Nastavení LED panelu s maticí LED diod a komplexní sekvencí animací bylo náročné na konfiguraci. U Junior skeneru bylo složité zejména nastavení pohybu a synchronizace s ostatními parametry světla. Ovládací rozhraní pro tyto zařízení obsahovalo velké množství ovládacích prvků a políček, což znesnadňovalo rychlé testování funkcí. Proces testování a ladění vyžadoval systematický přístup, trpělivost a prozkoumání všech ovládacích prvků a jejich vzájemných vazeb.www.qlcplus.orgPo dokončení nastavení celého ovládacího pultu v QLights Controller proběhla důkladná kontrolní prohlídka a závěrečné testování všech světelných prvků. Výsledkem náročného nastavování a testování se stal plně funkční ovládací pult, připravený pro použití během párty.Step 30: Použití CRT Televizí Pro Retro Vizuální EfektJednou ze specialit naší párty je použití starých CRT televizí jako dekorace a zdroje obrazového obsahu. V minulosti byly CRT televize na akcích zapojovány a video signál do nich byl posílán z počítače pomocí programu OBS Studio. OBS Studio umožňovalo flexibilní manipulaci s video obsahem a živé mixování obrazu pro televize. Nicméně, toto řešení vyžadovalo aktivní obsluhu počítače s OBS Studiem. To bylo náročné na organizaci a čas.Pro zjednodušení a automatizaci přehrávání video obsahu na CRT televizích byla zvažována alternativní možnost použití VHS kazet. Přehrávání video obsahu z VHS kazet odstraňuje nutnost aktivní manipulace s počítačem během akce. Předem vybraný obsah je možné nahrát na VHS kazety a ty poté během večera jednoduše prohazovat ve VHS přehrávači.Výhodou použití VHS kazet je i dostupnost velkého množství starých, nepoužitých 240 min kazet. Tyto kazety poskytují dostatek kapacity pro nahrání dlouhého video programu. Možnost přepisu VHS kazet umožňuje opakované použití a aktualizaci video obsahu pro různé akce.Při nahrávání video obsahu na VHS kazety je potřeba věnovat pozornost správnému nastavení obrazu v OBS Studiu. Důležité je vhodně roztáhnout video v tak, aby se na CRT televizi zobrazoval obraz bez deformace a byl tak zachovaný správný poměr stran. Nejlepší způsob pro srovnání poměru stran je vizuální kontrola kulatých objektů ve filmu.Step 31: Vymyšlený Obsah Pro CRT Televize Vymyšlení vhodného obsahu pro CRT televize se ukázalo jako příjemná, ale ne zcela jednoduchá úloha.Pro předchozí akce byly CRT televize využívány pro zobrazení jednoduchých barev, vzorů nebo krátkých videí v smyčce. Tato řešení však vyžadovala aktivní změnu obsahu během párty a mohla odvádět pozornost od hlavního dění.Pro DIY techno párty byl zvolen nový přístup - přehrávání předem vybraných videí bez nutnosti zásahu během akce.Pro zajištění dostatečné délky obsahu byla stanovena celková délka videí na 8 až 9 hodin. Původní myšlenka vysílat na každé televizi jiný obsah byla zamítnuta jako zbytečně komplikovaná a rozptylující. Místo toho bylo zvoleno jednotné video pro všechny CRT televize.Při výběru konkrétního obsahu byly zvažovány různé možnosti. Zpočátku se jako inspirace nabízely české seriály a pořady, například Česká soda, Nemocnice na kraji města, Hospoda nebo Četnické humoresky. Avšak po zvážení byly tyto seriály zamítnuty z důvodu potenciální monotónnosti obrazu bez zvuku a rizika nudného působení na párty atmosféru.Jako vhodnější varianta se ukázaly akční filmy, které i beze zvuku nabízejí dynamický a vizuálně zajímavý obsah. Pro usnadnění výběru z široké škály akčních filmů bylo rozhodnuto omezit výběr na filmy z jednoho konkrétního roku. Náhodně byl vybrán rok 1994 jako výchozí bod pro filmový maraton. Z filmů natočených v roce 1994 bylo dle žebříčků a osobních preferencí vybráno šest filmů s dostatečnou délkou pro celovečerní párty.Pro párty 31. 12. 2024 byly vybrány tyto filmy z roku 1994:Forrest GumpPulp Fiction: Historky z podsvětíPravdivé lžiBláznivá střela 33 a 1/3: Poslední trapasMaskaFlintstoneoviPro přípravu obsahu byly filmy staženy z torrentů a následně nahrány na VHS kazety pomocí VHS přehrávače. VHS kazety byly očíslovány od 1 do 3 pro snadnou orientaci a organizaci přehrávání během párty. V den akce bude stačit třikrát vložit kazetu do VHS přehrávače pro zajištění nepřetržitého filmového maratonu na CRT televizích po celou dobu párty. V případě úspěchu tohoto konceptu je možné v budoucnu jednoduše zopakovat tento postup s filmy z dalšího roku, například 1995.Step 32: Úklid a Příprava Zázemí U Kolegy Pro zajištění příjemného a bezpečného prostředí pro návštěvníky párty je klíčový úklid a příprava zázemí. V prostorách pracovny kolegy bude proveden důkladný úklid. Úklid zahrnuje odstranění nepořádku, přípravu stolů a židlí pro posezení a celkové zpřehlednění prostoru. Dále bude zajištěno topení v místnosti, aby byl prostor komfortní i v chladnějším počasí.Bezpečnost návštěvníků je prioritou, proto budou minimalizována potenciální rizika v prostoru. Součástí přípravy je i nasvícení prostoru pracovny a příprava CRT gaming koutku pro zábavu návštěvníků. Nahoře na pochoz'
