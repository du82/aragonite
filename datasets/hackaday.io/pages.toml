full_description = '''Details FAQ This course consists of 4 pre-recorded videos and 4 live office hours. More FAQ here. Classes are pre-recorded and will be released Tuesdays at 19:00 IST/9:30a EDT/ 6:30a PDT. Office Hours are Fridays at 20:30 IST/11:00a EDT/ 8a PDT. Link to calendar for easy timezone conversion. ABOUT THIS COURSE This “Introduction to KiCad and FreeCAD” course will consist of byte sized pre-recorded video tutorials which will walk you from schematic capture onward to PCB and enclosure design. In recent years, the line between hobbyist and professional has blurred. Hobbyists are designing and assembling circuit boards with grain sized components on multi-layer boards and dense parts placements. And thanks to rapid prototyping, modeling enclosures to house the electronics it pretty easy as well. To become a skilled hobbyist / professional, it is essential to have these design skills. But EDA and CAD tools have a very steep learning curve, and its not easy to get started unless you have a lot of guidance along the way. So, join in, and improve your engineering chops by becoming proficient in PCB and mechanical design. Why KiCad? KiCad is an amazing Open Source (free as in freedom!) program that allows you to design your own printed circuit board without arbitrary limitations on board size. KiCad offers an all-in-one solution: Full featured EDA suite, GNU GPL license Cross-platform - Linux, Windows, Mac OSX Large, dedicated support community. Extensive Documentation, FAQ's, Mailing List, Tutorials, IRC Why FreeCAD? FreeCAD is an open-source parametric 3D modeller made primarily to design real-life objects of any size. Parametric modelling allows you to easily modify your design by going back into your model history and changing its parameters. WHO IS THIS COURSE FOR ? This course is tailored for the electronic enthusiast who has just started off using KiCad or wants to switch to it from other tools. We will walk through a design from Schematic to Gerbers and answer your “how-to” questions. Later, we will have a quick introduction to FreeCAD, learning how to model an enclosure after importing a 3D model of the finished PCB. All you will need is a basic understanding of electronics and mechanical modelling. COURSE CONTENT Here’s how we will progress over the next four weeks. Week 1 : Essential KiCad links, discuss KiCad best practices, setup a project directory tree, do a schematic capture, understand symbol library management and create custom symbols Week 2 : Symbol<>Footprint association, essential PCBnew plugins, PCB layout, footprint library management and creating custom footprints, adding non-technical layers to help production and assembly Week 3 : Engineering/Manufacturing outputs - GERBERS, vector graphics, 3D CAD formats. BoM management, creating and adding graphics such as logos to the PCB Week 4 : Essential FreeCAD links, FreeCAD basics, essential workbenches, unifying KiCad and FreeCAD via the KiCad StepUp tools workbench, PCB import, simple enclosure design, Exporting for manufacturing PREREQUISITES On your Person, all you need installed is some basic electronics and engineering knowledge, and some drawing skills. On your computer, you will need to install the two programs, along with some add ons. KiCad ver 5.1.6 :https://www.kicad.org/download/KiCad Libraries : https://www.kicad.org/libraries/download/Schematic, Footprint, 3D models, TemplatesKiCad AddonsKiCad StepUp Tools : https://github.com/easyw/kicadStepUpMod/Interactive HTML BoM : https://github.com/openscopeproject/InteractiveHtmlBomFreeCAD ver 0.18.4 : https://www.freecadweb.org/downloads.php FreeCAD workbenches : KiCad StepUp Tools, Exploded Assembly, Fasteners, Manipulator, Sheet MetalTo activate Workbenches, go to TOOLS > ADDON MANAGER Course Classes Collapse KiCad + FreeCAD Class 1 Lutetium • 07/07/2020 at 16:54 • 0 comments Here is the link to watch Class 1. In this class, we cover: 00:00:32 - Schematic walk through00:03:28 - Project Manager overview00:05:05 - EEschema, toolbar review00:12:00 - Start schematic process00:13:20 - Place parts00:18:50 - Place wires / connections00:21:35 - Place Net labels00:45:00 - Hierarchy Sheets00:55:55 - ERC and Power Flags01:00:30 - Libraries - backup, create, edit parts01:09:55 - Wrap up Session I See you in the Office Hours Friday! KiCad + FreeCAD Class 1 NOTES Anool Mahidharia • 07/07/2020 at 18:47 • 2 comments Additional Notes for Session 1 : KiCad + FreeCAD GIT REPO Here's a link to my GIT repo for review. https://github.com/wyolum/HackadayU_KiCad_FreeCAD VIEW FOOTPRINT IN SCHEMATIC LIBRARY BROWSER In EEschema Library Browser, if you see only the schematic symbol but not the footprint, check this setting : PREFERENCES > PREFERENCES > Eeschema > Show footprint previews in library browser (check) USE REPETITION FOR SPEED If you have a bunch of repetitive actions to be done, such as placing incremental net labels, or the same length of wire connected to a succession of pins on an IC, then Set up Repetition parameters in PREFERENCES > PREFERENCES > EEschemaSet Horizontal pitch of repeated itemsSet Vertical pitch of repeated itemsPlace the first item (net label, wire etc).Hit the “Insert” key and the item you placed will be repeated according to the parameters set in Preferences. If it’s a Net Label, it will also increment each time you “Insert”.Here’s a short video showing how it works. BUSES We looked at a super simple example of how busses can be used, it wasn’t exactly an appropriate use of the feature, since the same result can be achieved just by using Net Labels. But for example, if you have a more complex circuit, where there is a 16-bit data bus on a micro-controller labelled PD0..PD15, that needs to be connected to a memory device with 8 pins labelled ADR0..ADR7 and the other 8 pins labelled DAT8..DAT15, then the BUS feature solves the problem. Add wire stubs and bus entries on the first device (use the repetition feature to speed things up).Add wire stubs and bus entries on the second deviceAdd net labels on the first device – PD0 to PD15Add net labels to the second device – ADR0 to ADR7 and DAT8 to DAT15Draw a bus that connects all of these pinsAdd a net label near the first device – PD[0..15]Add a net label near the second device – ADR[0..7]Add a third label near the second device – DAT[8..15] The pins then get connected like so : PD0 > ADR0 PD1 > ADR1 ..... PD7 > ADR7 PD8 > DAT8 PD9 > DAT9 ..... PD15 > DAT15 Here's a screenshot of how that looks IGNORE SCHEMATIC SYMBOL If you'd like to add a symbol on the schematic which should not be placed on the PCB, then add a "hashtag" to it's REFERENCE (example - #U4 instead of U4, and it will not be put on the PCB)This can be used to show where off-board parts such as a Motor, Fan, Solenoid etc connect to a screw-connector on the board, for example. KiCad CHEAT SHEET Handy KiCad cheat sheet for reference, in several languageshttps://github.com/KiCad/kicad-doc/tree/master/src/cheatsheetAnd here's the link to the KiCad forum if you'd like to give feedback to the authorhttps://forum.kicad.info/t/cheatsheet-for-kicad/5247 KiCad + FreeCAD Class 2 Anool Mahidharia • 07/13/2020 at 19:12 • 0 comments Here is the link to watch Class 2. In this class, we cover : 00:00:00 - Session II Overview and Session I review00:04:15 - Bitmap to Component converter00:09:40 - Symbol - Footprint association00:15:20 - Create footprint library and import/add custom footprints00:17:50 - Netlist Export00:18:50 - PCBnew Toolbar review, layer manager, page, board and grid settings 00:25:10 - Netlist / Parts Import00:28:00 - Parts - move, rotate, flip, place00:34:10 - Board outline / Edge cuts00:43:00 - Routing / Track layout00:43:40 - Net classes setup00:53:45 - Zone / Pour / Fill01:02:45 - 3D View01:03:05 - Silk and Fab Layer cleanup01:10:15 - ERCSee you in Office Hours on Friday - note the revised time - at 20:30 IST / 11:00am EDT / 8:00 am PDT. Link to calendar for easy timezone conversion.I've updated the Git repo to reflect what we've covered in Session 2.If you have any questions, please let me know here. KiCad + FreeCAD Class 3 Lutetium • 07/20/2020 at 19:10 • 0 comments Here is the link to watch Class 3. In this class, we cover: 00:00 Intro 02:20 Dimensions, Origin offsets05:30 Interactive Routing06:55 Modify edge cuts10:15 Archive footprints in custom library and swap references16:15 Keepout Areas, Exposed zones23:45 Plugins31:20 Interactive BoM33:20 Plotting - Gerbers, Position files and PDF's39:45 GerbView42:30 Export - STEP and VRML46:30 Create custom footprint and add to project library55:20 Back import57:00 Add 3D model for custom footprint59:55 Interactive Routing - Advanced features KiCad + FreeCAD Class 2 Q&A Anool Mahidharia • 07/21/2020 at 20:15 • 0 comments Class 2 Office Hours Q&A:Here are the Questions (and answers) from the Class 2 Office Hours Q&A What exactly is this project that we’re designing? What might it be able to do?Functionally, not very specific. I had to choose something where I could demonstrate as many features as possible. Having said that, this drives the RGB LED’s, so it can be used as a Badge, or a trinket. I’m not covering the programming, but loading the Arduino bootloader, and then running the NeoPixel demos should get it to light upDoing some Googling, I found these couple of projects (there’s likely many more) that use the ATtiny85/WS2812B combo.https://www.instructables.com/id/Use-a-1-ATTiny-to-drive-addressable-RGB-LEDs/https://www.electromaker.io/blog/article/programming-ws2812b-leds-with-attiny85-23 Was there a reason to place the Neopixels closer to the edge of the board instead of the mounting holes? I would think that placing the mounting holes closer to the corners would be preferable.The plan is that when we make the enclosure in FreeCAD, the main circuit board (area within the mounting holes) can be enclosed, while the part with the RGB LED’s can stick out / be exposed. If in-case, my logo size or the layer is wrong, how do I change those parameters?There’s no easy way, other than going back to Bitmap to Component converter, and regenerating the symbol / footprint all over again. I’m pretty bad with electronics. I notice that between the end of Class 1 and the start of Class 2, the schematic has changed, which is throwing me off, because I don’t know the missing steps that got from version 1 to version 2. Specifically, I now see a box around the connectors at the end of the LED chain. But, more importantly, when I was watching you assign footprints, you have a “5V” (J4) that I do not have…UPDATED: I’m guessing you customized the connectors to add boxes around them. And changed the power supply, changing the female connector to male, and adding a female connector between the end of the Class 1 and the beginning of Class 2. Yes, sorry about that confusion. Anyhow, I’m posting my project files on Github, so you can clone that repo, and compare.https://github.com/wyolum/HackadayU_KiCad_FreeCAD My default in Board setup is quite different from yours. (I’ve never used it before, so this is what it installed with): ClearncTrack WidthVia SizeVia DrilluVia SizeuVia DrilldPair WidthdPair Gap0.2 mm0.25 mm0.8 mm0.4 mm0.3 mm0.1 mm0.2 mm0.25 mm UPDATED: I did not know mil as an imperial unit. I see now that the above values are the metric equivalents -- or close to -- the mils shown in your defaults. Try changing the project “Units” to INCH instead of MM. In Schematic/PCBnew, the second and third toolbar icons toggle between these two.Then, in PCBnew > BOARD SETUP > DESIGN RULES > NET CLASSES , you can set it up. I’m posting my project files on Github, so you can clone that repo, and compare.https://github.com/wyolum/HackadayU_KiCad_FreeCAD In Board Setup, when you are changing the widths of the routing, I see you have /A1, /A2, /A3, /D1, and /D2. Mine does not have those labeled that way. When / how did that happen?I wanted to show how the BUS function works, so I made some changes to make that clear and renamed the nets. Actually, I made some more changes, so best to clone my version from the repo (see link above) and let me know if you need help to replicate my version. My SPI PROG footprint is “backwards” with pins 1, 3, and 5 at the top. I hope the right thing to do was to mirror it in the Footprint Editor, save as tiny_blinky, update the Symbol Fields in Eeschema, and change the footprint in Pcbnew… It now looks like yours…Ummm, Prolly. Did you try ROTATE / MIRROR / FLIP (X/Y) options within Schematic itself ? Maybe if you share a screenshot, we can sort it out. KiCad + FreeCAD Class 3 Q&A Anool Mahidharia • 07/24/2020 at 17:48 • 0 comments Class 3 When setting the origins, how close is “close enough”? The center of my board, mathematically is 1.4375 inches by 0.8 inches. However, the closest I could get seemed to be 1.4350 (or 1.4400) inches by 0.8 inches. (ubuntourist)Set your Grid Size to 25 mil instead of 50 milORBlock Select All (make sure to enable all layers first) > Secondary click > Move Exactly (hotkey ctrl + M) , set X coordinate to -0.0375 > OKThis’ll move the board to X=1.4 and Y = 0.8 Racing to finish… Still 15 minutes left in the video. I see your Oshpark display of your part is much more detailed than mine… I mean, the detail that I see in the files that I’ve zipped up and submitted gets lost in translation… (ubuntourist)Well, WYSIWYG, Ah, gotcha. I know what that is. I ran into this error last week, and have a temporary fix until OSHpark fixes it. If your edge cuts layer line thickness is less than 4 mil, OSHpark render fails. If the line thickness is 4 mil or more, it works.Make sure your Board Edge Cuts layer graphics thickness is at least 4 mil or more.Go to EDIT > Edit Text and Graphics Properties, (see image below) I am getting an error while creating the step file. It says “Unable to create STEP file. Check that the board has a valid outline and models.”......... I have already drawn it three times...any tips to avoid the error in the future or any idea how I can debug the current edge cut of the board?Error is what it says - the board outline has a discontinuity. Sometimes, if the discontinuity is large enough, KiCad will complain when you try 3D view.If discontinuity is very minute, 3D will work, but STEP will failFix your Edge Cuts layer graphics to fix this. There should not be any discontinuities in the outline. This usually occurs if you have set a very fine grid size (such as 1 mil instead of 10 mil), and the end points of two consecutive elements do not line up and are not coincident. In my KiCAD installation, my right-side toolbar doesn’t show all the functionalities like in the video. How can I adjust the toolbars. I faced this problem both in Eschema and PcbNew. I searched online but didn’t find anything.(Aditya) Can you post a screenshot ? What parts are you missing ? Looks like ICON scaling issue. KiCad > PCBnew > Preferences > Common > User Interface > Icon Scale Also, when we do the pcb page setup,'''
