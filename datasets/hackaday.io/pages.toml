full_description = '''Details UPDATE: Check out the latest updates: ***April 2021 Customized quantum learning experienceNew community-written book *** Nov. 2020 Class of 2020 had finished. I learned a lot by teaching the class on Sunday since March and digesting complex ideas into drawings. Hope you enjoyed it as much as I did. All the recordings can be found here. We also have a cartoon "textbook" which can be found in 13 markets on Amazon. Search for ASIN : B08HGLPZXP Quantum Computing & Some Physics See you in future classes! *** We discussed a new topic for 30 mins every week. The topic is based on my comics of the week below in the log. You can also follow progress of the drawings on my website, LinkedIn, Twitter, Instagram and YouTube. Hackaday is adding the classes gradually to their channel here: Intro to Quantum Computing playlist You can send questions and requests in the comments section below. I'll address them in the comics, in the comments or during the class. Past recordings are in the description of the slides under the "Files" areas. *** Quantum computing has been a hot topic since the past couple of years, especially with recent progress made in industry. However, there hasn't been enough materials to lead hobbyists into the subject, as most books and papers are written for professional academics and media articles are technically shallow. These hobbyists include scientists, engineers, developers and hackers who are highly technical but may not have a background in quantum computing. Even with a PhD in Applied Physics who studied quantum properties of materials, I did not know how quantum computers worked. As I started learning the subject, I realize that one does not need a degree in physics to understand quantum computing. All they need is some necessary math and physics foundations. This subject can be taught in a straightforward way at the right level. Once people know what goes into quantum computing, they will be able to dig deeper and demystify the subject. As I've been teaching our employees at Microsoft, I've built up a series of systematic materials from basic concepts to algorithms to hardware systems, and a tutorial on Q# (Q-sharp) - a domain-specific programming language used for expressing quantum algorithms. Typically we took a few months to go through all the basic concepts. Every class was followed by a few Q# exercises. But it is do-able for a 2-hour workshop, such as the one at Hackaday Supercon. On November 15, 2019, I gave a workshop on a hands-on introduction to Quantum Computing at Supercon. Here are the slides for everyone. It might felt like a lot to people who encountered the concepts for the first time. But if they go back to the slides now, they'll be able to recall and digest at their own pace. The workshop was also on high demand. We didn't have enough space for more people. So anyone who missed it can take a look at the slides which hopefully can give them directions to study further. Please feel free to post any questions and discussions in this project page. And any mistakes to correct in the slides. I'll try to answer them here. Enjoy! *** About the instructor: Dr. Kitty Yeung, Sr. Quantum Architect at Microsoft Quantum Systems; Producer of MS Learn quantum modules and the Quantum Learning website with customized learning materials; Creator of comic series Quantum Computing through Comics; Lecturer at HackadayU and Microsoft Reactor on Introduction to Quantum Computing; Founder & Designer of sustainable and STEAM fashion brand, Art by Physicist; Creative Technologist & Lead of the Fashion Hack at Microsoft; Public Speaker on quantum computing and fashion tech. Harvard University 15′ Applied Physics; University of Cambridge 10′ Natural Sciences – Physical. Files Slides Nov 1.pdf Session 25: Quantum Error Correction by Dr. Michael Beverland Recording: https://youtu.be/5zFpLLaVmAs Adobe Portable Document Format - 1.89 MB - 11/01/2020 at 20:51 Preview qcvv_Chris.pdf Session 24: Quantum Tomography by Prof. Chris Ferrie Recording: https://youtu.be/utH6YcaoGTE Adobe Portable Document Format - 887.31 kB - 10/19/2020 at 15:17 Preview Slides Oct 18.pdf Session 24: Quantum Tomography by Prof. Chris Ferrie Recording: https://youtu.be/utH6YcaoGTE Adobe Portable Document Format - 1.02 MB - 10/19/2020 at 15:18 Preview qml_maria.pdf Session 23: Quantum Machine Learning by Dr. Maria Schuld Recording: https://youtu.be/DGNc0gmtumE Adobe Portable Document Format - 3.57 MB - 10/13/2020 at 09:47 Preview Slides Oct 11.pdf Session 23: Quantum Machine Learning by Dr. Maria Schuld Recording: https://youtu.be/DGNc0gmtumE Adobe Portable Document Format - 778.06 kB - 10/11/2020 at 19:44 Preview View all 32 files Course Classes Collapse Comics: Quantum Computing & some Physics artbyphysicistkitty • 03/22/2020 at 13:06 • 0 comments In the mist of the COVID-19 pandemic, I am bummed that I don't have a 3D printer and my sewing machine is still to be shipped from SF to my new home in Germany, with no supplies to join the PPE making :( But to contribute, in addition to donating to non-profits, I want to provide some support to people staying at home, with what I can do the best. Every Sunday and Wednesday, I'll post a comic about quantum computing and some physics concepts. Watch out here for updates. I'll also post on Twitter, LinkedIn, Instagram and possibly other media. I hope this can be of help for people spending time to learn new things. It will certainly be an exciting challenge for me as well. Feel free to share the contents and discuss in the comments. Also let me know any questions and topics you'd like me to draw. Pages 5 & 6 artbyphysicistkitty • 03/25/2020 at 21:21 • 0 comments First Wednesday update. More to come to explain these various concepts.For interested readers, Wikipedia articles on binary systems, early computers and Ada Lovelace are very good backgrounds. Pages 7 & 8 artbyphysicistkitty • 03/29/2020 at 14:20 • 0 comments (First Sunday update) The contrast between "amplitude" Vs "probability" is very important, which helps build intuition to interpret measurements - will be explained later. Pages 9 & 10 artbyphysicistkitty • 04/01/2020 at 14:28 • 1 comment Emphasizing a bit more on amplitude. What's coming up is very exciting. Pages 11 & 12 artbyphysicistkitty • 04/05/2020 at 13:23 • 0 comments Quantum mechanics explained with interference. With all the possibilities in our world, we are just observing the events that are the most likely, resulted from interference! I should probably make some additional pages on complex numbers. But will prioritize the next few topics that are more urgent. Page 13 & 14 artbyphysicistkitty • 04/08/2020 at 14:30 • 0 comments Since there's been so much confusion on this entanglement, I'll show what it is NOT. Pages 15 & 16 artbyphysicistkitty • 04/12/2020 at 14:10 • 0 comments We won't delve into decoherence any time soon. If you are interested to learn more about it, just take a search online. We will next lean how to control and manipulate qubits. Pages 17 & 18 artbyphysicistkitty • 04/15/2020 at 14:14 • 0 comments This week, we will start talking about how to manipulate qubits to build quantum algorithms. Pages 19 & 20 artbyphysicistkitty • 04/19/2020 at 14:09 • 0 comments While an infinite number of gates can be used to change a state (and move it around on the Bloch Sphere), some gates are special cases that are commonly used in algorithms. Pages 21 & 22 artbyphysicistkitty • 04/22/2020 at 14:16 • 0 comments A couple build-ups for what's to come: using the gates to construct algorithms, and using Q# quantum programming language for large numbers of qubits (when the circuit representation doesn't scale). View all 44 course classes Build Instructions Collapse 1 Hackaday classes every weekend Sunday weekly class at 11:30am PDT. Join Microsoft Teams Meeting. For phone options: +1 323-849-4874 United States, Los Angeles (Toll) Conference ID: 636 979 670# We will discuss a new topic for 30 mins every week. The topic will be based on my comics of the week. 2 Upcoming webinar Microsoft //Build developer conference. Quantum sessions will include several exciting announcements for learners. Register and attend for free. Follow Twitter @MSFTQuantum @docsmsft Harnessing the problem-solving power of quantum computing webinar - 7 May 2020 https://note.microsoft.com/MSR-Quantum-Computing-Registration-Live 3 New quantum developments that may interest you Check out this Superposition game by my colleague Sarah Marshall: https://www.sarahmarshall.name/blog/the-many-worlds-of-schroedingers-cat.html And a 15 min interview on Quantum Machine Learning and Azure Quantum with Alex Bocharov, Principal Researcher at Microsoft Quantum Systems group and Chris Granade, Senior Research Software Development Engineer, by Vadim Karpusenko, Cloud Developer Advocate at Microsoft : https://channel9.msdn.com/Shows/AI-Show/Quantum-Machine-Learning-and-Azure-Quantum View all 5 instructions Enjoy this course? Share This course was created on 11/19/2019 and last updated 9 months ago. Discussions Log In/Sign up to comment Become a Hackaday.io Member Create an account to leave a comment. Already have an account? Log In. Sign up with Github Sign up with X OR Sign up Hanaki Onu wrote 02/19/2024 at 14:06 • point Is there a specific website that lets you use this data - other than Hackaday? I was thinking that scratch would, but it does not. also, I love how easy she makes it to understand. Are you sure? yes | no newblicious wrote 10/13/2020 at 21:50 • point I love the illustrations Are you sure? yes | no artbyphysicistkitty wrote 10/20/2020 at 12:50 • point Thank you so much! Are you sure? yes | no Davide wrote 09/08/2020 at 12:36 • point Hi Kitty, I was reviewing class #5/ comic #23 (teleportation) and I can’t figure out why, when Alice entangles her new qubit |A'> to the previously entangled pair |A> |B>, she firstly applied the CNOT gate then secondly the Hadamard gate: that is the reverse order of gates to obtain entanglement, isn’t it? May you please elaborate on this step a bit more? Are you sure? yes | no artbyphysicistkitty wrote 09/08/2020 at 17:00 • point Great question, Davide. The best way to see it would be to go through the math at each step. What happens if you reverse CNOT and H? Would it work for some states? |A'> in general is a superposition state of |0> and |1>. What happens if you apply a H gate? Another place to look is jumping to Session 13: Teleportation + codingRecording: https://youtu.be/nPJeI-J5934 and try coding the circuit with Q#. Are you sure? yes | no Barry Burd wrote 07/02/2020 at 20:26 • point My question is about the Basic Gates kata, Task 2.3. Two-qubit gate - 3. I can do it by thinking intuitively about what gates do, but I don't want to rely on intuitions. I'm looking for a way to do it using only matrices (maybe by writing down the matrix for the multi-qubit transformation that I want to achieve, and factoring that matrix into the matrices for basic gates). Is there a way to do something like this? Are you sure? yes | no artbyphysicistkitty wrote 07/03/2020 at 10:11 • point Hi Barry, for sure, you can express all quantum gates as matrices and qubits as vectors. For this question, you can write down the CNOT matrices and control and target qubits. Are you sure? yes | no Barry Burd wrote 07/04/2020 at 01:59 • point I have no doubt that I can express a sequence of basic gate operations with matrices. My question is, are there mathematical tools to find a sequence of operations to go from an arbitrary start state to a desired target state. The basic gates H, CNOT, and Phase45 are universal -- so is there a method to determine which of them to apply? Are you sure? yes | no artbyphysicistkitty wrote 07/05/2020 at 14:18 • point Interesting thought. We can use the arbitrary general matrices that are described by each qubit's angles and then calculate what the angles are. Then we will find out which universal gates they are. We can calculate manually or express in a generic tool like Mathematica or MatLab. 2x2 matrix would be easy but as the matrices grow bigger, it can get messy. Are you sure? yes | no syscomax wrote 06/24/2020 at 06:11 • point Enjoyed reading the article above , really explains everything in detail,the article is very interesting and effective.Thank you and good luck for the upcoming articles https://www.syscomax.com/ Are you sure? yes | no artbyphysicistkitty wrote 07/03/2020 at 10:07 • point Thank you. Are you sure? yes | no Ramkumar wrote 06/20/2020 at 08:50 • point Hi, I'm currently in class 3 where you explain quantum entanglement. Say, there are 3 quantum particles in entanglement. Is this ( 1 ∕√2 | 000> + 1 /√2 | 111> ) the only possible configuration. I guess they can be entangled in any possible ways.If yes, consider the state ( 1 ∕√2 | 010> + 1 ∕√2 | 011> ). Here if we observe the first two particles, the third particle's state cannot be determined. On the other hand, it is enough to observe only third particle. Is this valid entanglement? Are you sure? yes | no artbyphysicistkitty wrote 06/20/2020 at 14:24 • point Hi, thanks for asking. We can entangle them in many different ways. ( 1 ∕√2 | 000> + 1 /√2 | 111> ) is a maximally entangled state. The amplitude in front of each term can also be different. The example you gave does not have the three qubits entangled though. When we measure the third qubit (or any qubit), we still won't know what the other two qubits are. It is not different from writing 1 ∕√2 | 01>(|0>+|1>) then we can see the first two qubits are not correlated with the last qubit. Whereas in the case of ( 1 ∕√2 | 000> + 1 /√2 | 111> ) we cannot write them as separate qubits. Are you sure? yes | no Ramkumar wrote 06/21/2020 at 04:30 • point Now I understood the correlation part. Thank you for the clear explanation. Are you sure? yes | no mulder-48 wrote 06/10/2020 at 12:13 • point Found the first on the YouTube channel. Thanks Are you sure? yes | no artbyphysicistkitty wrote 06/11/2020 at 13:32 • point Thank you :) Are you sure? yes | no mulder-48 wrote 06/10/2020 at 09:02 • point Hi, Sorry to asked but I can not find the link for the first recorded session, Supercon quantum computing workshop share_Kitty Yeung.pdf. Thanks Are you sure? yes | no Hirmay Sandesara wrote 07/20/2020 at 05:53 • point Here's the link adress, https://youtu.be/ZShBy-vAUAc Are you sure? yes | no olivialsn wrote 06/09/2020 at 06:03 • point there is superposition like 1/2(|00⟩+𝑖|01⟩−|10⟩−𝑖|11⟩), how to understand when there is imaginary part? for |01⟩, i^2 = -1, does it have a negative probability to appear? or we only consider the real part, so the probability of |01⟩ and |11⟩ is 0? Are you sure? yes | no artbyphysicistkitty wrote 06/11/2020 at 12:59 • point Great that you are asking about this! Thank you. I have not mentioned this part in order to reduce the math for beginners. We cannot have negative probability. In fact, it should be the modulus | i |'''
