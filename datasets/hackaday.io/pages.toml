["https://hackaday.io/project/144350"]
title = "Hacking Wearables for Mental Health and More | Hackaday.io"
description = "I hack generic fitness trackers and use them as a platform for prototyping wearables such as the &quot;Tingle&quot; at the Child Mind Institute MATTER Lab. The Tingle is used to monitor and alleviate body-focused repetitive behaviors (BFRBs). The Tingle has completed a pilot study to establish basic functionality and is now in active use as part of a feasibility study. I&apos;m open sourcing the Tingle prototype and my use of hacked fitness trackers as a prototyping platform. Although the fitness trackers I hack are wrist-based, I&apos;ve built all sorts of devices with them. In addition to basic tutorials, I&apos;ve built three demo projects to publicize and open source this platform: a stomach acid-powered smartpill, an intraoral respiration monitor and an EEG headset. I&apos;ve made everything completely Arduino compatible for your convenience. Full fitness tracker hacking documentation + tutorials and code for gesture recognition, neural network training, and Web Bluetooth."
full_description = 'The "Tingle" is a wearable device designed to combat body-focused repetitive behaviors (BFRBs), especially trichotillomania (compulsive hair pulling) and excoriation (compulsive skin picking). Prevalence of body-focused repetitive behaviors (BFRBs) Body-focused repetitive behaviors (BFRBs), symptoms of Obsessive Compulsive Disorder (OCD) and other conditions involving compulsions (e.g., Autism Spectrum Disorder) involve compulsively causing physical injury and/or damaging one’s physical appearance. These are among the most poorly understood symptoms; they are often misdiagnosed and undertreated. BFRBs include hitting oneself, biting, pulling out hair, skin picking and cutting, as well less severe but damaging behaviors such as nail biting, thumb sucking, and nose picking. These symptoms affect at least 5% of the population; hair pulling alone affects 1%, or about 3 million people in the US. BRFBs are highly comorbid. Studies have shown that as many as 70% of those with one BRFB will have another co-occurring BRFB. While often impairing, affecting medical health and/or disfiguring, these symptoms are frequently reported but often not observed in clinical settings. This makes diagnosis, as well as treatment planning and monitoring, exceedingly difficult. To avoid pain and disfigurement, it is imperative to identify a reliable means to automatically identify and monitor BFRBs, especially outside the clinic setting. Clinicians need data on BFRB frequency and timing for the purposes of diagnosis, treatment planning and monitoring while patients need immediate, real-time feedback to make behavioral therapies more effective. The “Tingle” device To address this previously unmet clinical need, I have created a wrist-worn device called the “Tingle” that can monitor and record BFRBs while also providing real-time (haptic) feedback (on the wrist) to the individual with BFRBs when they occur. The Tingle is well-positioned to address the tremendous unmet need in the care of individuals with BFRBs and other damaging and impairing compulsive behaviors. The Tingle will revolutionize the diagnosis and treatment of at least 5% of the population affected by these severe symptoms by using a convenient, automated, unobtrusive, and inexpensive device that both records behaviors for clinical assessment and provides accurate, real-time feedback to the wearer in support of therapy.Hack Fitness Tracker Wearable Device Prototyping Platform Although the Tingle is my primary focus in the project, my reason for sharing it on Hackaday is to open source my extensive use of hacked fitness trackers as a wearable device prototyping platform. All are Arduino IDE compatible, completely hackable, use a fast ARM Cortex MCU and cost $20-40. For more information scroll to the bottom of this details section, see the related project log, view my other projects and check out the Hacked Fitness Tracker Wearable Device Prototyping Platform GitHub repository: https://github.com/curtpw/nRF5x-device-reverse-engineering Now back to Tingle. Tingle Basic Operation The fundamental operation of the Tingle is fairly intuitive: data is gathered from a variety of sensors, sensor data is applied to a statistical model to predict whether the device is in a targeted position relative to the body, and if the model determines a sufficient likelihood that the Tingle is on target a vibration motor is activated to alert the user. Although the user trained neural network feature is really cool and makes for an impressive demo, I have deactivated it for the feasibility study. This device is being developed for use by children, and the custom model... Read more »'
