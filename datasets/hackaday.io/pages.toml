title = "How to Use Cricut Explore Air 2: Create DIY Projects at Home | cricut design space | Hackaday.io"
description = """
Are you excited to express your creativity with the Cricut Explore Air 2 machine [https://explorenewmachine.com/]? This flexible cutting machine can make your crafting dreams come true. It cuts over 100+ various materials, like paper, cardboard, vinyl, and even leather.

https://explorenewmachine.com/ [https://explorenewmachine.com/]

Whether you’re a pro crafter or a beginner, this machine is perfect for bringing your ideas to life. This stepwise guide will walk you through ‘how to use Cricut Explore Air 2 [https://explorenewmachine.com/how-to-use-cricut-explore-air-2-create-diy-projects-at-home/]‘, download the Design Space app, and create your first project.

So, get ready to venture on a crafting adventure and discover the joy of DIY projects. Let’s dive in and explore the world of Cricut!


DOWNLOADING CRICUT DESIGN SPACE ON YOUR COMPUTER

The first thing to use the machine is to download the Cricut Design Space software. To download it, navigate to design.cricut.com from your Windows or Mac. If you already have a Cricut account, log in to the app after downloading it.

Cricut Design Space software for windows

If you want to download the software on your mobile device, either Android or iPhone, go to their Play Store/App Store and look for the app in the search bar. It will be a square icon with Cricut written at the center.

NOTE: You must have an account beforehand to use the app. If you don’t have one, you should create one on the sign-up page. Also, you don’t need a Bluetooth adapter to use the machine, as it comes with built-in Bluetooth. The earlier Explore series, such as the Explore One, required a Bluetooth adapter.


CONNECTING CRICUT MACHINE TO YOUR COMPUTER WITH USB

Although you can use your machine wirelessly, let’s examine how to use it through USB.

Step 1: First, place it on a clean and flat surface with 10-15 inches of space behind and front to let the cutting machine move freely.

Step 2: After that, you must plug in your Explore cutting machine.

Step 3: And then attach the USB cable and power adapter.

Step 4: Next, you need to turn on your Explore machine and your computer.

Step 5: Open the Cricut Design Space software discussed in the previous section and log in using your credentials.

Step 6: Within the app, select the Menu icon visible at the top and choose New Machine Setup. This will guide you through the installation, the first project you will make, and a greeting card.

Now, you are almost ready to use the machine. The next section will examine how to make a project on your machine. So, let’s get into that.


HOW TO USE CRICUT EXPLORE AIR 2: CREATING YOUR FIRST PROJECT

Now, let us walk through a project that can be made with the materials that came with the box of your machine. If this is your first project, don’t worry—it will be easy!

Step 1: From the “Cricut New Machine Setup,” you will see a design on your screen. If you don’t find it, head over to cricut.com/setup [https://explorenewmachine.com/how-to-use-cricut-explore-air-2-create-diy-projects-at-home/]. Then, find the Menu on the top side and click “New Machine Setup.”

Step 2: Prepare all the materials that came with the machine, such as cardstock, mat, paper, and pen. Remove the plastic film from your machine and keep it aside for future use.

Step 3: Afterward, you need to load the cardstock on the machine mat. The textured side should be facing up and lined up on the machine mat vertically. Make sure to line it up on the upper side, right below the Cricut logo.

Step 4: In the next step, you must insert your cutting mat into your Explore machine. Ensure that you load the machine mat as per the guidelines. You also need to take care that it is pressed against the roller while you press the “load/unload” buttons, which are located at the top of your cutting machine. The icon looks like a set of double arrows.

how to use Cricut Explore Air 2

Step 5: Now, you need to insert the pen in clamp A. To do that, you need to remove the cap and place it tip-down until the arrow on the pen disappears. After you are done with this, you can close the clamp.

how to use Cricut Explore Air 2 [https://explorenewmachine.com/how-to-use-cricut-explore-air-2-create-diy-projects-at-home/]

Step 6: Then, check the design on your screen and tap the Go button.

DIY Cricut Explore Project

Step 7: Next, you need to set the dial to cardstock on the machine.

Step 8: As soon as you are ready to make the necessary changes in the design, the preview “C” button on the machine will start flashing.

Step 9: Also, you will have to unload the machine mat. Once you complete the project, click on the load/unload button to take off the pen.

Step 10: Afterward, remember to put the machine mat face down on a flat surface and then curl the edge up toward you. It will be removed from the cutting mat, and as you take it off, keep curling it up to make it easier.

Step 11: Fold your paper card over, and then crease it in half. Place the same on your plain blue paper inside the card. You can glue this in place if you like.

how to use Cricut Explore Air 2

Hoorah, you have finished your first project. Pat yourself on the back and know that your journey in this crafting world has begun.

Cricut Explore Air 2


SUMMING UP

That concludes our guide on ‘how to use Cricut Explore Air 2 [https://explorenewmachine.com/]‘ for beginners. Reading the above blog should make you feel fairly comfortable working on a new project. Now, you know how to download the Design Space app, set up the machine, and use it properly. Plus, you can always return here for a quick refresher!


FAQS


HOW DO I ENABLE THE FAST MODE IN MY CRICUT EXPLORE AIR 2?

To enable Fast Mode on your machine, load your material onto the cutting mat and place it in the machine. Choose the proper material setting in the Cricut Design Space software, such as vinyl or cardstock. Then, seek the option to enable Fast Mode. After selecting it, click the blinking “C” button to cut. This mode allows your machine to cut and write up to two times faster, making it appropriate for certain materials.


WHAT CAN I MAKE WITH A CRICUT EXPLORE AIR 2?

It is an amazing and versatile cutting machine that allows users to make unique designs and projects. It has the ability to cut over 100 materials, like vinyl, cardstock, and iron-on, and even thicker materials, including wood. Its additional features, like writing and scoring capabilities, enable the creation of custom cards, labels, and stickers. This machine gives users access to thousands of designs through Cricut Design Space; users can easily make personalized items suited to their tastes.


CAN I USE CRICUT EXPLORE AIR 2 WITHOUT A COMPUTER?

Yes, one can use the machine without a desktop by pairing it to a smartphone via Bluetooth. The machine has built-in Bluetooth connectivity, which allows one to use the Cricut Design Space app on iOS or Android devices to design and send projects to the machine. However, some features may be limited compared to those of a computer.

Visit: install cricut design space app [https://explorenewmachine.com/] cricut.com setup mac [https://explorenewmachine.com/]

Source: https://explorenewmachine.com/how-to-use-cricut-explore-air-2-create-diy-projects-at-home/ [https://explorenewmachine.com/how-to-use-cricut-explore-air-2-create-diy-projects-at-home/]"""
full_description = "Are you excited to express your creativity with the Cricut Explore Air 2 machine? This flexible cutting machine can make your crafting dreams come true. It cuts over 100+ various materials, like paper, cardboard, vinyl, and even leather. Whether you’re a pro crafter or a beginner, this machine is perfect for bringing your ideas to life. This stepwise guide will walk you through ‘how to use Cricut Explore Air 2‘, download the Design Space app, and create your first project. So, get ready to venture on a crafting adventure and discover the joy of DIY projects. Let’s dive in and explore the world of Cricut! Downloading Cricut Design Space on Your Computer The first thing to use the machine is to download the Cricut Design Space software. To download it, navigate to design.cricut.com from your Windows or Mac. If you already have a Cricut account, log in to the app after downloading it. If you want to download the software on your mobile device, either Android or iPhone, go to their Play Store/App Store and look for the app in the search bar. It will be a square icon with Cricut written at the center. NOTE: You must have an account beforehand to use the app. If you don’t have one, you should create one on the sign-up page. Also, you don’t need a Bluetooth adapter to use the machine, as it comes with built-in Bluetooth. The earlier Explore series, such as the Explore One, required a Bluetooth adapter. Connecting Cricut Machine to Your Computer With USB Although you can use your machine wirelessly, let’s examine how to use it through USB. Step 1: First, place it on a clean and flat surface with 10-15 inches of space behind and front to let the cutting machine move freely. Step 2: After that, you must plug in your Explore cutting machine. Step 3: And then attach the USB cable and power adapter. Step 4: Next, you need to turn on your Explore machine and your computer. Step 5: Open the Cricut Design Space software discussed in the previous section and log in using your credentials. Step 6: Within the app, select the Menu icon visible at the top and choose New Machine Setup. This will guide you through the installation, the first project you will make, and a greeting card. Now, you are almost ready to use the machine. The next section will examine how to make a project on your machine. So, let’s get into that. How to Use Cricut Explore Air 2: Creating Your First Project Now, let us walk through a project that can be made with the materials that came with the box of your machine. If this is your first project, don’t worry—it will be easy! Step 1: From the “Cricut New Machine Setup,” you will see a design on your screen. If you don’t find it, head over to cricut.com/setup. Then, find the Menu on the top side and click “New Machine Setup.” Step 2: Prepare all the materials that came with the machine, such as cardstock, mat, paper, and pen. Remove the plastic film from your machine and keep it aside for future use. Step 3: Afterward, you need to load the cardstock on the machine mat. The textured side should be facing up and lined up on the machine mat vertically. Make sure to line it up on the upper side, right below the Cricut logo. Step 4: In the next step, you must insert your cutting mat into your Explore machine. Ensure that you load the machine mat as per the guidelines. You also need to take care that it is pressed against the roller while you press the “load/unload” buttons, which are located at the top of your cutting machine. The icon looks like a set of double arrows. Step 5: Now, you need to insert the pen in clamp A. To do that, you need to remove the cap and place it tip-down until the arrow on the pen disappears. After you are done with this, you can close the clamp. Step 6: Then, check the design on your screen and tap the Go button. Step 7: Next, you need to set the dial to cardstock on the machine. Step 8: As soon as you are ready to make the necessary changes in the design, the preview “C” button on the machine will start flashing. Step 9: Also, you will have to unload the machine mat. Once you complete the project, click on the load/unload button to take off the pen. Step 10: Afterward, remember to put the machine mat face down on a flat surface and then curl the edge up toward you. It will be removed from the cutting mat, and as you take it off, keep curling it up to make it easier. Step 11: Fold your paper card over, and then crease it in half. Place the same on your plain blue paper inside the card. You can glue this in place if you like. Hoorah, you have finished your first project. Pat yourself on the back and know that your journey in this crafting world has begun. Summing Up That concludes our guide on ‘how to use Cricut Explore Air 2‘ for beginners. Reading the above blog should make you feel fairly comfortable working on a new project. Now, you know how to download the Design Space app, set up the machine, and use it properly. Plus, you can always return here for a quick refresher! FAQs How do I enable the fast mode in my Cricut Explore Air 2? To enable Fast Mode on your machine, load your material onto the cutting mat and place it in the machine. Choose the proper material setting in the Cricut Design Space software, such as vinyl or cardstock. Then, seek the option to enable Fast Mode. After selecting it, click the blinking “C” button to cut. This mode allows your machine to cut and write up to two times faster, making it appropriate for certain materials. What can I make with a Cricut Explore Air 2? It is an amazing and versatile cutting machine that allows users to make unique designs and projects. It has the ability to cut over 100 materials, like vinyl, cardstock, and iron-on, and even thicker materials, including wood. Its additional features, like writing and scoring capabilities, enable the creation of custom cards, labels, and stickers. This machine gives users access to thousands of designs through Cricut Design Space; users can easily make personalized items suited to their tastes. Can I use Cricut Explore Air 2 without a computer? Yes, one can use the machine without a desktop by pairing it to a smartphone via Bluetooth. The machine has built-in Bluetooth connectivity, which allows one to use the Cricut Design Space app on iOS or Android devices to design and send projects to the machine. However, some features may be limited compared to those of a computer. Visit: install cricut design space app cricut.com setup mac Source: https://explorenewmachine.com/how-to-use-cricut-explore-air-2-create-diy-projects-at-home/ Like Share"
