title = "Hackage.Security.Client.Verify"
full_description = '''Safe HaskellSafe-InferredLanguageHaskell2010Hackage.Security.Client.VerifyContentsVerification monadSpecific resourcesRe-exportsSynopsisdata Verify arunVerify :: (Finaliser -> Finaliser) -> Verify a -> IO aacquire :: IO a -> (a -> IO ()) -> Verify aifVerified :: IO () -> Verify ()openTempFile :: FsRoot root => Path root -> String -> Verify (Path Absolute, Handle)liftIO :: MonadIO m => IO a -> m aVerification monaddata Verify a Source #Verification monadThe verification monad is similar to ResourceT in intent, in that we can register handlers to be run to release resources. Unlike ResourceT, however, we maintain _two_ handlers: a cleanup handler which is run whether or not verification succeeds, and a finalisation handler which is run only if verification succeeds.Cleanup handlers are registered using acquire, and are guaranteed to run just before the computation terminates (after the finalisation handler).The finalisation handlers are run only when verification succeeds, and can be registered with ifVerified. Finalisation can be used for instance to update the local cache (which should only happen if verification is successful).InstancesInstances details MonadIO Verify Source # Instance detailsDefined in Hackage.Security.Client.Verify MethodsliftIO :: IO a -> Verify a # Applicative Verify Source # Instance detailsDefined in Hackage.Security.Client.Verify Methodspure :: a -> Verify a #(<*>) :: Verify (a -> b) -> Verify a -> Verify b #liftA2 :: (a -> b -> c) -> Verify a -> Verify b -> Verify c #(*>) :: Verify a -> Verify b -> Verify b #(<*) :: Verify a -> Verify b -> Verify a # Functor Verify Source # Instance detailsDefined in Hackage.Security.Client.Verify Methodsfmap :: (a -> b) -> Verify a -> Verify b #(<$) :: a -> Verify b -> Verify a # Monad Verify Source # Instance detailsDefined in Hackage.Security.Client.Verify Methods(>>=) :: Verify a -> (a -> Verify b) -> Verify b #(>>) :: Verify a -> Verify b -> Verify b #return :: a -> Verify a #runVerify :: (Finaliser -> Finaliser) -> Verify a -> IO a Source #Run an action in the Verify monadacquire :: IO a -> (a -> IO ()) -> Verify a Source #Acquire a resource and register the corresponding cleanup handlerNOTE: Resource acquisition happens with exceptions masked. If it is important that the resource acquistion can be timed out (or receive other kinds of asynchronous exceptions), you will need to use an interruptible operation. See http://www.well-typed.com/blog/2014/08/asynchronous-exceptions/ for details.ifVerified :: IO () -> Verify () Source #Register an action to be run only if verification succeedsSpecific resourcesopenTempFile Source #Arguments:: FsRoot root => Path rootTemp directory-> StringTemplate-> Verify (Path Absolute, Handle) Create a short-lived temporary fileCreates the directory where the temp file should live if it does not exist.Re-exportsliftIO :: MonadIO m => IO a -> m a #Lift a computation from the IO monad. This allows us to run IO computations in any monadic stack, so long as it supports these kinds of operations (i.e. IO is the base monad for the stack).ExampleExpandimport Control.Monad.Trans.State -- from the "transformers" library printState :: Show s => StateT s IO () printState = do state <- get liftIO $ print stateHad we omitted liftIO, we would have ended up with this error:• Couldn't match type ‘IO’ with ‘StateT s IO’ Expected type: StateT s IO () Actual type: IO ()The important part here is the mismatch between StateT s IO () and IO ().Luckily, we know of a function that takes an IO a and returns an (m a): liftIO, enabling us to run the program and see the expected results:> evalStateT printState "hello" "hello" > evalStateT printState 3 3'''
