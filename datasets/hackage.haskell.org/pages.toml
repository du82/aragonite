title = "filepath: Library for manipulating FilePaths in a cross platform way."
description = "Library for manipulating FilePaths in a cross platform way."
full_description = '''filepath: Library for manipulating FilePaths in a cross platform way. [ bsd3, library, system ] [ Propose Tags ] [ Report a vulnerability ] This package provides functionality for manipulating FilePath values, and is shipped with GHC. It provides two variants for filepaths:legacy filepaths: type FilePath = Stringoperating system abstracted filepaths (OsPath): internally unpinned ShortByteString (platform-dependent encoding)It is recommended to use OsPath when possible, because it is more correct.For each variant there are three main modules:System.FilePath.Posix / System.OsPath.Posix manipulates POSIX/Linux style FilePath values (with / as the path separator).System.FilePath.Windows / System.OsPath.Windows manipulates Windows style FilePath values (with either \ or / as the path separator, and deals with drives).System.FilePath / System.OsPath for dealing with current platform-specific filepathsFor more powerful string manipulation of OsPath, you can use the os-string package (OsPath is a type synonym for OsString).An introduction into the new API can be found in this blog post. Code examples for the new API can be found here. [Skip to Readme] Modules[Index] [Quick Jump]SystemSystem.FilePathSystem.FilePath.PosixSystem.FilePath.WindowsSystem.OsPathSystem.OsPath.EncodingSystem.OsPath.InternalSystem.OsPath.PosixSystem.OsPath.Posix.InternalSystem.OsPath.TypesSystem.OsPath.WindowsSystem.OsPath.Windows.Internal FlagsManual FlagsNameDescriptionDefaultcpphsUse cpphs (fixes haddock source links)DisabledUse -f <flag> to enable a flag, or -f -<flag> to disable that flag. More info Downloadsfilepath-1.5.4.0.tar.gz [browse] (Cabal source package)Package description (as included in the package) Maintainer's Corner Package maintainers AustinSeipp, DuncanCoutts, HerbertValerioRiedel, IanLynagh, NeilMitchell, maerwald For package maintainers and hackage trustees edit package information Candidates 1.4.0.0, 1.4.99.0, 1.4.99.1, 1.4.99.2, 1.4.99.3, 1.4.99.5, 2.0.0