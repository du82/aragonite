full_description = '''hackage-security: Hackage security library [ bsd3, distribution, library ] [ Propose Tags ] [ Report a vulnerability ] The hackage security library provides both server and client utilities for securing the Hackage package server (http://hackage.haskell.org/). It is based on The Update Framework (http://theupdateframework.com/), a set of recommendations developed by security researchers at various universities in the US as well as developers on the Tor project (https://www.torproject.org/).The current implementation supports only index signing, thereby enabling untrusted mirrors. It does not yet provide facilities for author package signing.The library has two main entry points: Hackage.Security.Client is the main entry point for clients (the typical example being cabal), and Hackage.Security.Server is the main entry point for servers (the typical example being hackage-server).This is a beta release. Modules[Index]HackageSecurityHackage.Security.ClientHackage.Security.Client.FormatsHackage.Security.Client.RepositoryHackage.Security.Client.Repository.CacheHackage.Security.Client.Repository.HttpLibHackage.Security.Client.Repository.LocalHackage.Security.Client.Repository.RemoteHackage.Security.Client.VerifyHackage.Security.JSONKeyHackage.Security.Key.EnvHackage.Security.ServerTUFHackage.Security.TUF.FileMapHackage.Security.TrustedUtilHackage.Security.Util.CheckedHackage.Security.Util.IOHackage.Security.Util.LensHackage.Security.Util.PathHackage.Security.Util.PrettyHackage.Security.Util.SomeTextJSONText.JSON.Canonical FlagsAutomatic FlagsNameDescriptionDefaultbase48Are we using base 4.8 or later?Enableduse-network-uriAre we using network-uri?EnabledUse -f <flag> to enable a flag, or -f -<flag> to disable that flag. More info Downloadshackage-security-0.5.0.2.tar.gz [browse] (Cabal source package)Package description (revised from the package)Note: This package has metadata revisions in the cabal description newer than included in the tarball. To un