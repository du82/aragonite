title = "bytestring: Fast, compact, strict and lazy byte strings with a list interface"
description = """
Don't use bytestring's standard C routines
When this flag is true, bytestring will use pure Haskell variants (no C FFI)
of the internal functions. This is not recommended except in use cases that
cannot (or do not) depend on C, such as with GHC's JavaScript backend."""
full_description = '''bytestring: Fast, compact, strict and lazy byte strings with a list interface [ bsd3, data, library ] [ Propose Tags ] [ Report a vulnerability ] An efficient compact, immutable byte string type (both strict and lazy) suitable for binary or 8-bit character data.The ByteString type represents sequences of bytes or 8-bit characters. It is suitable for high performance use, both in terms of large data quantities, or high speed requirements. The ByteString functions follow the same style as Haskell's ordinary lists, so it is easy to convert code from using String to ByteString.Two ByteString variants are provided:Strict ByteStrings keep the string as a single large array. This makes them convenient for passing data between C and Haskell.Lazy ByteStrings use a lazy list of strict chunks which makes it suitable for I/O streaming tasks.The Char8 modules provide a character-based view of the same underlying ByteString types. This makes it convenient to handle mixed binary and 8-bit character content (which is common in many file formats and network protocols).The Builder module provides an efficient way to build up ByteStrings in an ad-hoc way by repeated concatenation. This is ideal for fast serialisation or pretty printing.There is also a ShortByteString type which has a lower memory overhead and can be converted to or from a ByteString. It is suitable for keeping many short strings in memory, especially long-term, without incurring any possible heap fragmentation costs.ByteStrings are not designed for Unicode. For Unicode strings you should use the Text type from the text package.These modules are intended to be imported qualified, to avoid name clashes with Prelude functions, e.g.import qualified Data.ByteString as BS [Skip to Readme] Modules[Index] [Quick Jump]DataData.ByteStringData.ByteString.BuilderData.ByteString.Builder.ExtraData.ByteString.Builder.InternalData.ByteString.Builder.PrimData.ByteString.Builder.Prim.InternalData.ByteString.Builder.RealFloatData.ByteString.Char8Data.ByteString.InternalData.ByteString.LazyData.ByteString.Lazy.Char8Data.ByteString.Lazy.InternalData.ByteString.ShortData.ByteString.Short.InternalData.ByteString.Unsafe FlagsManual FlagsNameDescriptionDefaultpure-haskellDon't use bytestring's standard C routines When this flag is true, bytestring will use pure Haskell variants (no C FFI) of the internal functions. This is not recommended except in use cases that cannot (or do not) depend on C, such as with GHC's JavaScript backend.DisabledUse -f <flag> to enable a flag, or -f -<flag> to disable that flag. More info Downloadsbytestring-0.12.2.0.tar.gz [browse] (Cabal source package)Package description (as included in the package) Maintainer's Corner Package maintainers BenGamari, DonaldStewart, DuncanCoutts, HerbertValerioRiedel, IanLynagh, SylvainHenry, Bodigrim, sjakobi, chessai, clyring For package maintainers and hackage trustees edit package information Candidates No Candidates Versions [RSS] 0.9, 0.9.0.1, 0.9.0.2, 0.9.0.3, 0.9.0.4, 0.9.1.0, 0.9.1.1, 0.9.1.2, 0.9.1.3, 0.9.1.4, 0.9.1.5, 0.9.1.6, 0.9.1.7, 0.9.1.8, 0.9.1.9, 0.9.1.10, 0.9.2.0, 0.9.2.1, 0.10.0.0, 0.10.0.1, 0.10.0.2, 0.10.2.0, 0.10.4.0, 0.10.4.1, 0.10.6.0, 0.10.8.0, 0.10.8.1, 0.10.8.2, 0.10.9.0, 0.10.10.0, 0.10.10.1, 0.10.12.0, 0.10.12.1, 0.11.0.0, 0.11.1.0, 0.11.2.0, 0.11.3.0, 0.11.3.1, 0.11.4.0, 0.11.5.0, 0.11.5.1, 0.11.5.2, 0.11.5.3, 0.11.5.4, 0.12.0.0, 0.12.0.1, 0.12.0.2, 0.12.1.0, 0.12.2.0 Change log Changelog.md Dependencies base (>=4.11 && <5), data-array-byte (>=0.1 && <0.2), deepseq, ghc-prim, template-haskell [details] Tested with ghc ==9.10.1, ghc ==9.8.2, ghc ==9.6.5, ghc ==9.4.8, ghc ==9.2.8, ghc ==9.0.2, ghc ==8.10.7, ghc ==8.8.4, ghc ==8.6.5, ghc ==8.4.4 License BSD-3-Clause Copyright Copyright (c) Don Stewart 2005-2009, (c) Duncan Coutts 2006-2015, (c) David Roundy 2003-2005, (c) Jasper Van der Jeugt 2010, (c) Simon Meier 2010-2013. Author Don Stewart, Duncan Coutts Maintainer Haskell Bytestring Team