file from the repository and make it available at a temporary locationUse the provided file length to protect against endless data attacks. (Repositories such as local repositories that are not susceptible to endless data attacks can safely ignore this argument.)Move the file from its temporary location to its permanent location if verification succeeds.NOTE: Calls to repGetRemote should _always_ be in the scope of repWithMirror.repGetCached :: CachedFile -> IO (Maybe (Path Absolute))Get a cached file (if available)repGetCachedRoot :: IO (Path Absolute)Get the cached rootThis is a separate method only because clients must ALWAYS have root information available.repClearCache :: IO ()Clear all cached dataIn particular, this should remove the snapshot and the timestamp. It would also be okay, but not required, to delete the index.repWithIndex :: forall a. (Handle -> IO a) -> IO aOpen the tarball for readingThis function has this shape so that:We can read multiple files from the tarball without having to open and close the handle each timeWe can close the handle immediately when done.repGetIndexIdx :: IO TarIndexRead the index indexrepLockCache :: IO () -> IO ()Lock the cache (during updates)repWithMirror :: forall a. Maybe [Mirror] -> IO a -> IO aMirror selectionThe purpose of repWithMirror is to scope mirror selection. The idea is that if we haverepWithMirror mirrorList $ someCallbackthen the repository may pick a mirror before calling someCallback, catch exceptions thrown by someCallback, and potentially try the callback again with a different mirror.The list of mirrors may be Nothing if we haven't yet downloaded the list of mirrors from the repository, or when our cached list of mirrors is invalid. Of course, if we did download it, then the list of mirrors may still be empty. In this case the repository must fall back to its primary download mechanism.Mirrors as currently defined (in terms of a "base URL") are inherently a HTTP (or related) concept, so in repository implementations such as the local-repo repWithMirrors is probably just an identity operation (see ignoreMirrors). Conversely, HTTP implementations of repositories may have other, out-of-band information (for example, coming from a cabal config file) that they may use to influence mirror selection.repLog :: LogMessage -> IO ()LoggingrepLayout :: RepoLayoutLayout of this repositoryrepIndexLayout :: IndexLayoutLayout of the indexSince the repository hosts the index, the layout of the index is not independent of the layout of the repository.repDescription :: StringDescription of the repository (used in the show instance)InstancesInstances details Show (Repository down) Source # Instance detailsDefined in Hackage.Security.Client.Repository MethodsshowsPrec :: Int -> Repository down -> ShowS #show :: Repository down -> String #showList :: [Repository down] -> ShowS #newtype AttemptNr Source #Are we requesting this information because of a previous validation error?Clients can take advantage of this to tell caches to revalidate files.ConstructorsAttemptNr Int InstancesInstances details Num AttemptNr Source # Instance detailsDefined in Hackage.Security.Client.Repository Methods(+) :: AttemptNr -> AttemptNr -> AttemptNr #(-) :: AttemptNr -> AttemptNr -> AttemptNr #(*) :: AttemptNr -> AttemptNr -> AttemptNr #negate :: AttemptNr -> AttemptNr #abs :: AttemptNr -> AttemptNr #signum :: AttemptNr -> AttemptNr #fromInteger :: Integer -> AttemptNr # Eq AttemptNr Source # Instance detailsDefined in Hackage.Security.Client.Repository Methods(==) :: AttemptNr -> AttemptNr -> Bool #(/=) :: AttemptNr -> AttemptNr -> Bool # Ord AttemptNr Source # Instance detailsDefined in Hackage.Security.Client.Repository Methodscompare :: AttemptNr -> AttemptNr -> Ordering #(<) :: AttemptNr -> AttemptNr -> Bool #(<=) :: AttemptNr -> AttemptNr -> Bool #(>) :: AttemptNr -> AttemptNr -> Bool #(>=) :: AttemptNr -> AttemptNr -> Bool #max :: AttemptNr -> AttemptNr -> AttemptNr #min :: AttemptNr -> AttemptNr -> AttemptNr #data LogMessage Source #Log messagesWe use a RemoteFile rather than a RepoPath here because we might not have a RepoPath for the file that we were trying to download (that is, for example if the server does not provide an uncompressed tarball, it doesn't make much sense to list the path to that non-existing uncompressed tarball).ConstructorsLogRootUpdatedRoot information was updatedThis message is issued when the root information is updated as part of the normal check for updates procedure. If the root information is updated because of a verification error WarningVerificationError is issued instead.LogVerificationError VerificationErrorA verification errorVerification errors can be temporary, and may be resolved later; hence these are just warnings. (Verification errors that cannot be resolved are thrown as exceptions.)forall fs typ. LogDownloading (RemoteFile fs typ)Download a file from a repositoryforall fs. LogUpdating (RemoteFile fs Binary)Incrementally updating a file from a repositoryLogSelectedMirror MirrorDescriptionSelected a particular mirrorforall fs. LogCannotUpdate (RemoteFile fs Binary) UpdateFailureUpdating a file failed (we will instead download it whole)LogMirrorFailed MirrorDescription SomeExceptionWe got an exception with a particular mirror (we will try with a different mirror if any are available)LogLockWait (Path Absolute)This log event is triggered before invoking a filesystem lock operation that may block for a significant amount of time; once the possibly blocking call completes successfully, LogLockWaitDone will be emitted.Since: 0.6.0LogLockWaitDone (Path Absolute)Denotes completion of the operation that advertised a LogLockWait eventSince: 0.6.0LogUnlock (Path Absolute)Denotes the filesystem lock previously acquired (signaled by LogLockWait) has been released.Since: 0.6.0InstancesInstances details Pretty LogMessage Source # Instance detailsDefined in Hackage.Security.Client.Repository Methodspretty :: LogMessage -> String Source #data UpdateFailure Source #Records why we are downloading a file rather than updating it.ConstructorsUpdateImpossibleUnsupportedServer does not support incremental downloadsUpdateImpossibleNoLocalCopyWe don't have a local copy of the file to updateUpdateFailedTwiceUpdate failed twiceIf we attempt an incremental update the first time, and it fails, we let it go round the loop, update local security information, and try again. But if an incremental update then fails _again_, we instead attempt a regular download.UpdateFailed SomeExceptionUpdate failed (for example: perhaps the local file got corrupted)InstancesInstances details Pretty UpdateFailure Source # Instance detailsDefined in Hackage.Security.Client.Repository Methodspretty :: UpdateFailure -> String Source #data SomeRemoteError :: Type where Source #Repository-specific exceptionsFor instance, for repositories using HTTP this might correspond to a 404; for local repositories this might correspond to file-not-found, etc.ConstructorsSomeRemoteErr'''
