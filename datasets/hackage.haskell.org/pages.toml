full_description = '''ed25519: Ed25519 cryptographic signatures [ cryptography, mit ] [ Propose Tags ] [ Report a vulnerability ] This package provides a simple, fast, self-contained copy of the Ed25519 public-key signature system with a clean interface. It also includes support for detached signatures, and thorough documentation on the design and implementation, including usage guidelines. [Skip to Readme] Modules[Index]CryptoSignCrypto.Sign.Ed25519 FlagsManual FlagsNameDescriptionDefaulttest-propertiesEnabledtest-hlintEnabledtest-doctestsEnabledno-donnaEnabledUse -f <flag> to enable a flag, or -f -<flag> to disable that flag. More info Downloadsed25519-0.0.5.0.tar.gz [browse] (Cabal source package)Package description (revised from the package)Note: This package has metadata revisions in the cabal description newer than included in the tarball. To unpack the package including the revisions, use 'cabal get'. Maintainer's Corner Package maintainers AustinSeipp, HerbertValerioRiedel For package maintainers and hackage trustees edit package information Candidates No Candidates Versions [RSS] 0.0.1.0, 0.0.2.0, 0.0.3.0, 0.0.4.0, 0.0.5.0 Change log CHANGELOG.md Dependencies base (>=4 && <5), bytestring (>=0.9 && <0.13), ghc-prim (>=0.1 && <1) [details] Tested with ghc ==9.12.1, ghc ==9.10.1, ghc ==9.8.4, ghc ==9.6.6, ghc ==9.4.8, ghc ==9.2.8, ghc ==9.0.2, ghc ==8.10.7, ghc ==8.8.4, ghc ==8.6.5, ghc ==8.4.4, ghc ==8.2.2, ghc ==8.0.2 License MIT Copyright Copyright (c) Austin Seipp 2013-2017 Author Austin Seipp Maintainer Austin Seipp <aseipp@pobox.com> Revised Revision 9 made by AndreasAbel at 2025-02-15T16:10:45Z Category Cryptography Home page https://github.com/thoughtpolice/hs-ed25519/ Bug tracker https://github.com/thoughtpolice/hs-ed25519/issues Source repo head: git clone https://github.com/thoughtpolice/hs-ed25519.git Uploaded by AustinSeipp at 2015-10-11T23:32:11Z Distributions Arch:0.0.5.0, Debian:0.0.5.0, Fedora:0.0.5.0, LTSHaskell:0.0.5.0, NixOS:0.0.5.0, Stackage:0.0.5.0, openSUSE:0.0.5.0 Reverse Dependencies 4 direct, 11 indirect [details] $('.revdepdetails').click(function(e) { e.preventDefault(); var html = '<div><b>Direct</b><br /><p><a href="/package/acme-everything">acme-everything</a>, <a href="/package/cachix">cachix</a>, <a href="/package/hackage-security">hackage-security</a>, <a href="/package/scuttlebutt-types">scuttlebutt-types</a></p></div><div><b>Indirect</b><br /><p><a href="/package/cabal-file">cabal-file</a>, <a href="/package/cabal-hoogle">cabal-hoogle</a>, <a href="/package/cabal-install">cabal-install</a>, <a href="/package/guardian">guardian</a>, <a href="/package/hackage-security-HTTP">hackage-security-HTTP</a>, <a href="/package/hix">hix</a>, <a href="/package/pantry">pantry</a>, <a href="/package/pantry-tmp">pantry-tmp</a>, <a href="/package/stack">stack</a>, <a href="/package/stack-lib">stack-lib</a>, <a href="/package/stack2nix">stack2nix</a></p></div><span style="font-size: small"> [<a href="/package/ed25519/reverse">details</a>]</span>' modal.open({ content: html}); }); Downloads 52359 total (376 in the last 30 days) Rating (no votes yet) [estimated by Bayesian average] Your Rating λ λ λ Status Docs uploaded by userLast success reported on 2016-06-26 [all 1 reports] Readme for ed25519-0.0.5.0 [back to package description] Minimal package for ed25519 signatures This package implements minimal bindings to the ed25519 signature scheme. It's designed to be small, with no dependencies, and fast. It also comes with extensive guidelines and detailed documentation. It should be relatively easy to both depend on directly with Cabal or even copy into any projects that need it directly. For full details (including notes on the underlying implementation), check out the docs. Installation It's just a cabal install away on Hackage: $ cabal install ed25519 Join in Be sure to read the contributing guidelines. File bugs in the GitHub issue tracker. Master git repository: git clone https://github.com/thoughtpolice/hs-ed25519.git There's also a BitBucket mirror: git clone https://bitbucket.org/thoughtpolice/hs-ed25519.git Authors See AUTHORS.txt. License MIT. See LICENSE.txt for terms of copyright and redistribution.'''
