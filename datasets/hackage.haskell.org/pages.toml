full_description = "Safe HaskellSafe-InferredLanguageHaskell2010Hackage.Security.Client.Repository.LocalDescriptionLocal repositorySynopsistype LocalRepo = Path Absolutedata LocalFile awithRepository :: LocalRepo -> Cache -> RepoLayout -> IndexLayout -> (LogMessage -> IO ()) -> (Repository LocalFile -> IO a) -> IO aDocumentationtype LocalRepo = Path Absolute Source #Location of the repositoryNote that we regard the local repository as immutable; we cache files just like we do for remote repositories.data LocalFile a Source #InstancesInstances details DownloadedFile LocalFile Source # Instance detailsDefined in Hackage.Security.Client.Repository.Local MethodsdownloadedVerify :: LocalFile a -> Trusted FileInfo -> IO Bool Source #downloadedRead :: LocalFile Metadata -> IO ByteString Source #downloadedCopyTo :: LocalFile a -> Path Absolute -> IO () Source #withRepository Source #Arguments:: LocalRepoLocation of local repository-> CacheLocation of local cache-> RepoLayoutRepository layout-> IndexLayoutIndex layout-> (LogMessage -> IO ())Logger-> (Repository LocalFile -> IO a)Callback-> IO a Initialize the repository (and cleanup resources afterwards)Like a remote repository, a local repository takes a RepoLayout as argument; but where the remote repository interprets this RepoLayout relative to a URL, the local repository interprets it relative to a local directory.It uses the same cache as the remote repository."
