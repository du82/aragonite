title = "Hackage.Security.Client.Repository.Remote"
full_description = 'Safe HaskellSafe-InferredLanguageHaskell2010Hackage.Security.Client.Repository.RemoteContentsTop-level APIFile sizesDescriptionAn implementation of Repository that talks to repositories over HTTP.This implementation is itself parameterized over a HttpClient, so that it it not tied to a specific library; for instance, HttpClient can be implemented with the HTTP library, the http-client libary, or others.It would also be possible to give _other_ Repository implementations that talk to repositories over HTTP, if you want to make other design decisions than we did here, in particular:We attempt to do incremental downloads of the index when possible.We reuse the Repository.Local to deal with the local cache.We download timestamp.json and snapshot.json together. This is implemented here because:One level down (HttpClient) we have no access to the local cacheOne level up (Repository API) would require _all_ Repositories to implement this optimization.SynopsiswithRepository :: HttpLib -> [URI] -> RepoOpts -> Cache -> RepoLayout -> IndexLayout -> (LogMessage -> IO ()) -> (Repository RemoteTemp -> IO a) -> IO adata RepoOpts = RepoOpts {repoAllowAdditionalMirrors :: Bool}defaultRepoOpts :: RepoOptsdata RemoteTemp :: Type -> Typedata FileSize= FileSizeExact Int54| FileSizeBound Int54fileSizeWithinBounds :: Int54 -> FileSize -> BoolTop-level APIwithRepository Source #Arguments:: HttpLibImplementation of the HTTP protocol-> [URI]"Out of band" list of mirrors-> RepoOptsRepository options-> CacheLocation of local cache-> RepoLayoutRepository layout-> IndexLayoutIndex layout-> (LogMessage -> IO ())Logger-> (Repository RemoteTemp -> IO a)Callback-> IO a Initialize the repository (and cleanup resources afterwards)We allow to specify multiple mirrors to initialize the repository. These are mirrors that can be found "out of band" (out of the scope of the TUF protocol), for example in a cabal.config file. The TUF protocol itself will specify that any of these mirrors can serve a mirrors.json file that itself contains mirrors; we consider these as _additional_ mirrors to the ones that are passed here.NOTE: The list of mirrors should be non-empty (and should typically include the primary server).TODO: In the future we could allow finer control over precisely which mirrors we use (which combination of the mirrors that are passed as arguments here and the mirrors that we get from mirrors.json) as well as indicating mirror preferences.data RepoOpts Source #Repository options with a reasonable defaultClients should use defaultRepositoryOpts and override required settings.ConstructorsRepoOpts FieldsrepoAllowAdditionalMirrors :: BoolAllow additional mirrors?If this is set to True (default), in addition to the (out-of-band) specified mirrors we will also use mirrors reported by those out-of-band mirrors (that is, mirrors.json).defaultRepoOpts :: RepoOpts Source #Default repository optionsdata RemoteTemp :: Type -> Type Source #InstancesInstances details DownloadedFile RemoteTemp Source # Instance detailsDefined in Hackage.Security.Client.Repository.Remote MethodsdownloadedVerify :: RemoteTemp a -> Trusted FileInfo -> IO Bool Source #downloadedRead :: RemoteTemp Metadata -> IO ByteString Source #downloadedCopyTo :: RemoteTemp a -> Path Absolute -> IO () Source # Pretty (RemoteTemp typ) Source # Instance detailsDefined in Hackage.Security.Client.Repository.Remote Methodspretty :: RemoteTemp typ -> String Source #File sizesdata FileSize Source #ConstructorsFileSizeExact Int54For most files we download we know the exact size beforehand (because this information comes from the snapshot or delegated info)FileSizeBound Int54For some files we might not know the size beforehand, but we might be able to provide an upper bound (timestamp, root info)InstancesInstances details Show FileSize Source # Instance detailsDefined in Hackage.Security.Client.Repository.Remote MethodsshowsPrec :: Int -> FileSize -> ShowS #show :: FileSize -> String #showList :: [FileSize] -> ShowS #fileSizeWithinBounds :: Int54 -> FileSize -> Bool Source #'
