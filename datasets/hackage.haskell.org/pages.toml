title = "Hackage.Security.Client.Repository.Cache"
full_description = "Safe HaskellSafe-InferredLanguageHaskell2010Hackage.Security.Client.Repository.CacheDescriptionThe files we cache from the repositoryBoth the Local and the Remote repositories make use of this module.Synopsisdata Cache = Cache {cacheRoot :: Path AbsolutecacheLayout :: CacheLayout}getCached :: Cache -> CachedFile -> IO (Maybe (Path Absolute))getCachedRoot :: Cache -> IO (Path Absolute)getCachedIndex :: Cache -> Format f -> IO (Maybe (Path Absolute))clearCache :: Cache -> IO ()withIndex :: Cache -> (Handle -> IO a) -> IO agetIndexIdx :: Cache -> IO TarIndexcacheRemoteFile :: forall down typ f. DownloadedFile down => Cache -> down typ -> Format f -> IsCached typ -> IO ()lockCache :: Cache -> IO () -> IO ()lockCacheWithLogger :: (LogMessage -> IO ()) -> Cache -> IO () -> IO ()Documentationdata Cache Source #Location and layout of the local cacheConstructorsCache FieldscacheRoot :: Path Absolute cacheLayout :: CacheLayout getCached :: Cache -> CachedFile -> IO (Maybe (Path Absolute)) Source #Get a cached file (if available)getCachedRoot :: Cache -> IO (Path Absolute) Source #Get the cached rootCalling getCachedRoot without root info available is a programmer error and will result in an unchecked exception. See requiresBootstrap.getCachedIndex :: Cache -> Format f -> IO (Maybe (Path Absolute)) Source #Get the cached index (if available)clearCache :: Cache -> IO () Source #Delete a previously downloaded remote filewithIndex :: Cache -> (Handle -> IO a) -> IO a Source #getIndexIdx :: Cache -> IO TarIndex Source #cacheRemoteFile :: forall down typ f. DownloadedFile down => Cache -> down typ -> Format f -> IsCached typ -> IO () Source #Cache a previously downloaded remote filelockCache :: Cache -> IO () -> IO () Source #Lock the cacheThis avoids two concurrent processes updating the cache at the same time, provided they both take the lock.lockCacheWithLogger :: (LogMessage -> IO ()) -> Cache -> IO () -> IO () Source #Variant of lockCache which emits LogMessages before and after a possibly blocking file-locking system callSince: 0.6.0"
