full_description = '''Browse and search packages <p>To view all packages, submit the form with an empty search query.</p> <form method="POST" action="/packages/noscript-search" enctype="multipart/form-data"> <input type=hidden name="_method" value="POST"> <input type=hidden name="_transform" value="form2json"> <div> <label> Sort direction: <select name="sortDirection=%s"> <option selected value=ascending>ascending</option> <option value=descending>descending</option> </select> </label> </div> <div> <label> Sort column: <select name="sortColumn=%s"> <option selected value=default>default</option> <option value=name>name</option> <option value=downloads>number of downloads</option> <option value=rating>rating</option> <option value=description>description</option> <option value=tags>tags</option> <option value=lastUpload>date of last upload</option> <option value=maintainers>maintainers</option> </select> </label> </div> <div> <label> Search query (leave empty to show all non-deprecated packages): <input name="searchQuery=%s" value=""> </label> </div> <div> <label>Page number (zero-indexed): <input type=number name="page=%n" min=0 value="0"> </label> </div> <input type=submit> </form> <!-- Elinks does not understand CSS, so it will show the full page. We add this warning such that users will not use the wrong form. The class attribute hides the notice for Firefox/Chrome users. --> <p class=javaScriptOnly>Please disregard the following form, it only works with JavaScript.</p> ▸ Advanced options Also show deprecated packages Last uploaded version younger than Only show packages with tag Rating greater than, or equal to2 Usage Apart from just writing words to search everywhere in package metadata, you can also use filters in the search query string input field above. Filters are surrounded by parentheses. All filters have to pass for every package shown in the result, that is, it is a logical conjunction. (downloads > 1000) Only show packages with more than 1000 downloads within the last 30 days. The download count is inexact because Hackage uses a content delivery network. (lastUpload < 2021-10-29) Only show packages for which the last upload was before (i.e. excluding) the given UTC date in the 'complete date' format as specified using ISO 8601. (lastUpload = 2021-10-29) Only show packages for which the last upload was within the 24 hours of the given UTC date. (maintainer:SimonMarlow) Only show packages for which the maintainers list includes the user name SimonMarlow. (tag:bsd3) Only show packages with the bsd3 tag. (not tag:network) Do not show packages with the network tag. The not operator can also be used with other filters. (ageOfLastUpload > 5d) Only show packages uploaded more than five days ago. (ageOfLastUpload > 4w) Only show packages uploaded more than four weeks ago. A week has seven days. (ageOfLastUpload < 1m) Only show packages last uploaded less than one month ago. A month is considered to have 30.437 days. (ageOfLastUpload < 2.5y) Only show packages last uploaded less than 2.5 years ago. A year is considered to be 365.25 days. (rating > 2.5) Only show packages with a rating of more than 2.5. The dot is the only accepted decimal separator. (rating /= 0) Only show packages with a rating unequal to zero. (deprecated:any) Do not filter out deprecated packages. This must be explicitly added if desired. (deprecated:true) Only show deprecated packages. (deprecated:false) Only show packages that are not deprecated. If no other deprecation filter is given, this filter is automatically added. (distro:Debian) Only show packages that are available in the Debian distribution. See the full list of available distributions. Name DLs Rating Description Tags Last U/L Reference Version Maintainers import { sort, submitSearch, toggleAdvanced, appendDeprecated, appendAgeOfLastUL, appendTag, appendRating, validateAgeOfLastUL, validateTag } from "/static/browse.js"; window.sort = sort; window.submitSearch = submitSearch; window.toggleAdvanced = toggleAdvanced; window.appendDeprecated = appendDeprecated; window.appendAgeOfLastUL = appendAgeOfLastUL; window.appendTag = appendTag; window.appendRating = appendRating; window.validateAgeOfLastUL = validateAgeOfLastUL; window.validateTag = validateTag; Alternatively, if you are looking for a particular function then try Hoogle.'''
