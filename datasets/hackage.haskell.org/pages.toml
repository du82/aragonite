full_description = '''hackage-security: Hackage security library [ bsd3, distribution, library ] [ Propose Tags ] [ Report a vulnerability ] The hackage security library provides both server and client utilities for securing the Hackage package server (https://hackage.haskell.org/). It is based on The Update Framework (https://theupdateframework.com/), a set of recommendations developed by security researchers at various universities in the US as well as developers on the Tor project (https://www.torproject.org/).The current implementation supports only index signing, thereby enabling untrusted mirrors. It does not yet provide facilities for author package signing.The library has two main entry points: Hackage.Security.Client is the main entry point for clients (the typical example being cabal), and Hackage.Security.Server is the main entry point for servers (the typical example being hackage-server). Modules[Index] [Quick Jump]HackageSecurityHackage.Security.ClientHackage.Security.Client.FormatsHackage.Security.Client.RepositoryHackage.Security.Client.Repository.CacheHackage.Security.Client.Repository.HttpLibHackage.Security.Client.Repository.LocalHackage.Security.Client.Repository.RemoteHackage.Security.Client.VerifyHackage.Security.JSONKeyHackage.Security.Key.EnvHackage.Security.ServerTUFHackage.Security.TUF.FileMapHackage.Security.TrustedUtilHackage.Security.Util.CheckedHackage.Security.Util.PathHackage.Security.Util.PrettyHackage.Security.Util.SomeTextJSONText.JSON.Canonical FlagsManual FlagsNameDescriptionDefaultlukkoUse lukko for file-locking, otherwise use GHC.IO.Handle.LockEnabledAutomatic FlagsNameDescriptionDefaultcabal-syntaxAre we using Cabal-syntax?DisabledUse -f <flag> to enable a flag, or -f -<flag> to disable that flag. More info Downloadshackage-security-0.6.2.6.tar.gz [browse] (Cabal source package)Package description (revised from the package)Note: This package has metadata revisions in the cabal description newer than included in the tarball. To