title = "Hackage.Security.Client.Repository.HttpLib"
full_description = '''Safe HaskellSafe-InferredLanguageHaskell2010Hackage.Security.Client.Repository.HttpLibContentsBody readerDescriptionAbstracting over HTTP librariesSynopsisdata HttpLib = HttpLib {httpGet :: forall a. Throws SomeRemoteError => [HttpRequestHeader] -> URI -> ([HttpResponseHeader] -> BodyReader -> IO a) -> IO ahttpGetRange :: forall a. Throws SomeRemoteError => [HttpRequestHeader] -> URI -> (Int, Int) -> (HttpStatus -> [HttpResponseHeader] -> BodyReader -> IO a) -> IO a}data HttpRequestHeader= HttpRequestMaxAge0| HttpRequestNoTransformdata HttpResponseHeader = HttpResponseAcceptRangesBytesdata HttpStatus= HttpStatus200OK| HttpStatus206PartialContentdata ProxyConfig a= ProxyConfigNone| ProxyConfigUse a| ProxyConfigAutotype BodyReader = IO ByteStringbodyReaderFromBS :: ByteString -> IO BodyReaderDocumentationdata HttpLib Source #Abstraction over HTTP clientsThis avoids insisting on a particular implementation (such as the HTTP package) and allows for other implementations (such as a conduit based one).NOTE: Library-specific exceptions MUST be wrapped in SomeRemoteError.ConstructorsHttpLib FieldshttpGet :: forall a. Throws SomeRemoteError => [HttpRequestHeader] -> URI -> ([HttpResponseHeader] -> BodyReader -> IO a) -> IO aDownload a filehttpGetRange :: forall a. Throws SomeRemoteError => [HttpRequestHeader] -> URI -> (Int, Int) -> (HttpStatus -> [HttpResponseHeader] -> BodyReader -> IO a) -> IO aDownload a byte rangeRange is starting and (exclusive) end offset in bytes.HTTP servers are normally expected to respond to a range request with a "206 Partial Content" response. However, servers can respond with a "200 OK" response, sending the entire file instead (for instance, this may happen for servers that don't actually support range requests, but for which we optimistically assumed they did). Implementations of HttpLib may accept such a response and inform the hackage-security library that the whole file is being returned; the security library can then decide to execute the BodyReader anyway (downloading the entire file) or abort the request and try something else. For this reason the security library must be informed whether the server returned the full file or the requested range.data HttpRequestHeader Source #Additional request headersSince different libraries represent headers differently, here we just abstract over the few request headers that we might want to setConstructorsHttpRequestMaxAge0Set Cache-Control: max-age=0HttpRequestNoTransformSet Cache-Control: no-transformInstancesInstances details Show HttpRequestHeader Source # Instance detailsDefined in Hackage.Security.Client.Repository.HttpLib MethodsshowsPrec :: Int -> HttpRequestHeader -> ShowS #show :: HttpRequestHeader -> String #showList :: [HttpRequestHeader] -> ShowS # Eq HttpRequestHeader Source # Instance detailsDefined in Hackage.Security.Client.Repository.HttpLib Methods(==) :: HttpRequestHeader -> HttpRequestHeader -> Bool #(/=) :: HttpRequestHeader -> HttpRequestHeader -> Bool # Ord HttpRequestHeader Source # Instance detailsDefined in Hackage.Security.Client.Repository.HttpLib Methodscompare :: HttpRequestHeader -> HttpRequestHeader -> Ordering #(<) :: HttpRequestHeader -> HttpRequestHeader -> Bool #(<=) :: HttpRequestHeader -> HttpRequestHeader -> Bool #(>) :: HttpRequestHeader -> HttpRequestHeader -> Bool #(>=) :: HttpRequestHeader -> HttpRequestHeader -> Bool #max :: HttpRequestHeader -> HttpRequestHeader -> HttpRequestHeader #min :: HttpRequestHeader -> HttpRequestHeader -> HttpRequestHeader #data HttpResponseHeader Source #Response headersSince different libraries represent headers differently, here we just abstract over the few response headers that we might want to know about.ConstructorsHttpResponseAcceptRangesBytesServer accepts byte-range requests (Accept-Ranges: bytes)InstancesInstances details Show HttpResponseHeader Source # Instance detailsDefined in Hackage.Security.Client.Repository.HttpLib MethodsshowsPrec :: Int -> HttpResponseHeader -> ShowS #show :: HttpResponseHeader -> String #showList :: [HttpResponseHeader] -> ShowS # Eq HttpResponseHeader Source # Instance detailsDefined in Hackage.Security.Client.Repository.HttpLib Methods(==) :: HttpResponseHeader -> HttpResponseHeader -> Bool #(/=) :: HttpResponseHeader -> HttpResponseHeader -> Bool # Ord HttpResponseHeader Source # Instance detailsDefined in Hackage.Security.Client.Repository.HttpLib Methodscompare :: HttpResponseHeader -> HttpResponseHeader -> Ordering #(<) :: HttpResponseHeader -> HttpResponseHeader -> Bool #(<=) :: HttpResponseHeader -> HttpResponseHeader -> Bool #(>) :: HttpResponseHeader -> HttpResponseHeader -> Bool #(>=) :: HttpResponseHeader -> HttpResponseHeader -> Bool #max :: HttpResponseHeader -> HttpResponseHeader -> HttpResponseHeader #min :: HttpResponseHeader -> HttpResponseHeader -> HttpResponseHeader #data HttpStatus Source #HTTP status codeConstructorsHttpStatus200OK200 OKHttpStatus206PartialContent206 Partial Contentdata ProxyConfig a Source #Proxy configurationAlthough actually setting the proxy is the purview of the initialization function for individual HttpLib implementations and therefore outside the scope of this module, we offer this ProxyConfiguration type here as a way to uniformly configure proxies across all HttpLibs.ConstructorsProxyConfigNoneDon't use a proxyProxyConfigUse aUse this specific proxyIndividual HTTP backends use their own types for specifying proxies.ProxyConfigAutoUse automatic proxy settingsWhat precisely automatic means is HttpLib specific, though typically it will involve looking at the HTTP_PROXY environment variable or the (Windows) registry.Body readertype BodyReader = IO ByteString Source #An IO action that represents an incoming response body coming from the server.The action gets a single chunk of data from the response body, or an empty bytestring if no more data is available.This definition is copied from the http-client package.bodyReaderFromBS :: ByteString -> IO BodyReader Source #Construct a Body reader from a lazy bytestringThis is appropriate if the lazy bytestring is constructed, say, by calling hGetContents on a network socket, and the chunks of the bytestring correspond to the chunks as they are returned from the OS network layer.If the lazy bytestring needs to be re-chunked this function is NOT suitable.'''
