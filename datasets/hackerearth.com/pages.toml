ge-specific/people-culture/values/big-icons/dont-be-asshole.svg" alt="Don’t be an asshole" /> Don’t be an asshole We pride ourselves for having a work culture that is helpful, fun and also treats everyone with respect. Leadership Behaviors: We are never an ‘asshole’ and ensure that no one around us is one We care for our people We are inclusive <img width="148" height="185" class="value-icon" src="https://media.hackerearth.com/hewordpress/wp-content/themes/hackerearth-child/assets/images/page-specific/people-culture/values/big-icons/hunger-for-excellence.svg" alt="Hunger for excellence" /> Hunger for excellence We love people that do the ordinary, extraordinarily and strive to be better than the last time, every single time. Leadership Behaviors: We are obsessed about constantly raising the bar of performance for ourselves We’re obsessed about the impact that we create with our efforts We always give, and also ask for honest, real-time feedback We have a strong bias towards action <img width="186" height="182" class="value-icon" src="https://media.hackerearth.com/hewordpress/wp-content/themes/hackerearth-child/assets/images/page-specific/people-culture/values/big-icons/disagree-and-commit.svg" alt="Disagree and commit" /> Disagree and commit We encourage people to speak up or disagree, but in instances where velocity is more important than consensus, we disagree, but commit. Leadership Behaviors: We do not shy away from any conflicts We make mistakes and learn from them <img width="212" height="105" class="value-icon" src="https://media.hackerearth.com/hewordpress/wp-content/themes/hackerearth-child/assets/images/page-specific/people-culture/values/big-icons/customer-obsession.svg" alt="Customer obsession" /> Customer Obsession Our clients' success is our success and we continuously take measures to empathise with our customers. Leadership Behaviors: We are obsessed with finding solutions for our customers We are obsessed with the customer experience We are obsessed