title = "Hacker Newsletter - The Hacker News Newsletter"
description = "A weekly newsletter of the best articles on startups, technology, programming, and more. All links are curated by hand from the popular Hacker News site."
full_description = "Since 2010, we've put out a weekly newsletter of the best articles on startups, technology, programming, and more. All links are curated by hand from Hacker News. Join 60,000+ other subscribers and don't miss another week. To see a preview, check out a recent issue. We hate spam even more than you do, you can unsubscribe at anytime. Hacker Newsletter makes it easy for me to catch up on big stories I missed during the week because I was too busy hacking on my startup. Like having a fastidious friend cull the best of HN for your weekly perusal – a great time saver, graced with a discerning eye for quality. I use it regularly. Writing a book is all-consuming, so I haven't had the time to check Hacker News all day. By checking out Hacker Newsletter, I know that the really important stuff won't slip through the cracks."
