dditionally, to improve users’ quality of experience (QoE) by considering network conditions, we included a model to estimate the most suitable decision for streaming policies, based on the analysis of historical data using linear regression modeling. Through simulations with a real-world dataset, we show the experimental as well as the performance of QoS system that our approach outperforms previously reported methods. The present work is expected to open an important avenue for future related research. A Compression Results <img alt="Fig. 15: Images resulting from compression with various µ" srcSet="https://hackernoon.imgix.net/images/fWZa4tUiBGemnqQfBGgCPf9594N2-pp83ynr.png?auto=format&amp;fit=max&amp;w=640 1x, https://hackernoon.imgix.net/images/fWZa4tUiBGemnqQfBGgCPf9594N2-pp83ynr.png?auto=format&amp;fit=max&amp;w=828 2x" src="https://hackernoon.imgix.net/images/fWZa4tUiBGemnqQfBGgCPf9594N2-pp83ynr.png?auto=format&amp;fit=max&amp;w=828" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="image-container undefined" loading="lazy"/> <img alt="Table 3: Compression size, PSNR, and compression ratio after the ICM compression phase" srcSet="https://hackernoon.imgix.net/images/fWZa4tUiBGemnqQfBGgCPf9594N2-qt93y87.png?auto=format&amp;fit=max&amp;w=640 1x, https://hackernoon.imgix.net/images/fWZa4tUiBGemnqQfBGgCPf9594N2-qt93y87.png?auto=format&amp;fit=max&amp;w=1080 2x" src="https://hackernoon.imgix.net/images/fWZa4tUiBGemnqQfBGgCPf9594N2-qt93y87.png?auto=format&amp;fit=max&amp;w=1080" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="image-container undefined" loading="lazy"/>