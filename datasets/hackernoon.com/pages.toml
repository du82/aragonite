;auto=format&amp;fit=max 2048w, https://hackernoon.imgix.net/images/e1vl3GX8BpXoAGI9qZJqAwLDK5h1-fi93c32.jpeg?w=100&amp;auto=format&amp;fit=max 3840w" src="https://hackernoon.imgix.net/images/e1vl3GX8BpXoAGI9qZJqAwLDK5h1-fi93c32.jpeg?w=100&amp;auto=format&amp;fit=max" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" class="profileImage " loading="lazy"/><img alt="0-item" srcSet="https://cdn.hackernoon.com/images/img-qw03r9v.png?auto=format&amp;fit=max&amp;w=16 1x, https://cdn.hackernoon.com/images/img-qw03r9v.png?auto=format&amp;fit=max&amp;w=32 2x" src="https://cdn.hackernoon.com/images/img-qw03r9v.png?auto=format&amp;fit=max&amp;w=32" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Rising card fees and chargebacks create unnecessary costs, while customers now expect instant, seamless payment experience. Pay-by-bank is the smarter alternative, and it’s growing impossible for businesses to ignore. Pay-by-bank is an account-to-account payment method powered by open banking. Banks securely share APIs with licensed providers, and users authorise payments directly through their bank’s interface. The payment flow bypasses card networks entirely. Some key advantages of pay-by-bank include speed, security, and customer-controlled consent. The UX is simpler, and costs are lower since card networks aren’t involved. Now, let’s look at the stats – in 2018, there were just 320,000 pay-by-bank payments in the UK. By 2024, that number exploded to 224 million. The UK leads Europe, with 13% of digitally active consumers and 18% of small businesses already on board. With the global market set to hit $164.8 billion by 2032, 2025 is the tipping point. Here’s why open banking is set to take off this year, and what will drive its rapid growth.Digital natives are redefining payments Many think that consumers are set in their payment methods, comfortable with cards and digital wallets, and don’t trust new technology. But this is changing with digital natives taking the central stage. In 2025, Gen Z is making up nearly 30% of the global workforce. This generation grew up with smartphones, they don’t just prefer digital-first solutions – they expect them. Take the success of challenger banks like Revolut in the UK. They exploded in popularity by offering fast, frictionless banking, unlike clunky legacy banks. It’s no surprise that 78% of millennials use mobile banking, and one-fourth have their primary bank account with a digital-only bank. Gen Z takes it even further. They spend over four hours a day on social media, research products online, and drive social commerce. They trust '''
