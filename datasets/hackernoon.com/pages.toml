full_description = '''7,485 reads 7,485 readsA Programmer's Guide to Game Design: The Major Ingredients You Should Know by Chenuli J.February 15th, 2025<img alt="Read on Terminal Reader" srcSet="https://hackernoon.imgix.net/computer.png?auto=format&amp;fit=max&amp;w=32 1x, https://hackernoon.imgix.net/computer.png?auto=format&amp;fit=max&amp;w=48 2x" src="https://hackernoon.imgix.net/computer.png?auto=format&amp;fit=max&amp;w=48" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/><img alt="Read this story w/o Javascript" data-tip="true" data-for="arweave-backup" srcSet="https://hackernoon.imgix.net/images/Lite%20Icon%20%4025px.png?auto=format&amp;fit=max&amp;w=32 1x, https://hackernoon.imgix.net/images/Lite%20Icon%20%4025px.png?auto=format&amp;fit=max&amp;w=48 2x" src="https://hackernoon.imgix.net/images/Lite%20Icon%20%4025px.png?auto=format&amp;fit=max&amp;w=48" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/><img alt="Open TLDR" srcSet="https://hackernoon.imgix.net/tl;dr-dark.png?auto=format&amp;fit=max&amp;w=64 1x, https://hackernoon.imgix.net/tl;dr-dark.png?auto=format&amp;fit=max&amp;w=128 2x" src="https://hackernoon.imgix.net/tl;dr-dark.png?auto=format&amp;fit=max&amp;w=128" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="tldr-logo" loading="lazy"/>Too Long; Didn't ReadSoftware developers spend their whole time with complicated problems, and they try to learn almost everything about algorithms, structures, frameworks, and blah-blah-Blah. While playing games and coffee have become stress-busters in our lives, why can't building games be the best one?<img alt="featured image - A Programmer&#x27;s Guide to Game Design: The Major Ingredients You Should Know" srcSet="https://hackernoon.imgix.net/images/IW0DX1dUHwU9EV8vodJDlqPZYcv1-ao035k2.png?auto=format&amp;fit=max&amp;w=1920 1x, https://hackernoon.imgix.net/images/IW0DX1dUHwU9EV8vodJDlqPZYcv1-ao035k2.png?auto=format&amp;fit=max&amp;w=3840 2x" src="https://hackernoon.imgix.net/images/IW0DX1dUHwU9EV8vodJDlqPZYcv1-ao035k2.png?auto=format&amp;fit=max&amp;w=3840" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="image-container feat" loading="lazy"/><img data-for="author-tooltip" data-tip="true" data-delay-hide="200" alt="Chenuli J. HackerNoon profile picture" href="/u/buzzpy" sizes="100vw" srcSet="https://hackernoon.imgix.net/images/IW0DX1dUHwU9EV8vodJDlqPZYcv1-zt832u9.png?w=100&amp;auto=format&amp;fit=max 640w, https://hackernoon.imgix.net/images/IW0DX1dUHwU9EV8vodJDlqPZYcv1-zt832u9.png?w=100&amp;auto=format&amp;fit=max 750w, https://hackernoon.imgix.net/images/IW0DX1dUHwU9EV8vodJDlqPZYcv1-zt832u9.png?w=100&amp;auto=format&amp;fit=max 828w, https://hackernoon.imgix.net/images/IW0DX1dUHwU9EV8vodJDlqPZYcv1-zt832u9.png?w=100&amp;auto=format&amp;fit=max 1080w, https://hackernoon.imgix.net/images/IW0DX1dUHwU9EV8vodJDlqPZYcv1-zt832u9.png?w=100&amp;auto=format&amp;fit=max 1200w, https://hackernoon.imgix.net/images/IW0DX1dUHwU9EV8vodJDlqPZYcv1-zt832u9.png?w=100&amp;auto=format&amp;fit=max 1920w, https://hackernoon.imgix.net/images/IW0DX1dUHwU9EV8vodJDlqPZYcv1-zt832u9.png?w=100&amp;auto=format&amp;fit=max 2048w, https://hackernoon.imgix.net/images/IW0DX1dUHwU9EV8vodJDlqPZYcv1-zt832u9.png?w=100&amp;auto=format&amp;fit=max 3840w" src="https://hackernoon.imgix.net/images/IW0DX1dUHwU9EV8vodJDlqPZYcv1-zt832u9.png?w=100&amp;auto=format&amp;fit=max" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" class="profileImage " loading="lazy"/>Software developers spend their whole time with complicated problems, and they try to learn almost everything about algorithms, structures, frameworks, and blah-blah-blah. While playing games and coffee have become stress-busters in our lives, why can't building games be the best one? You don’t have to subscribe to read this but it’s recommended - Subscribe to Programming and Doodles. Even though some people find game development insane, it’s easy for software developers because they have almost every skill needed: math, Programming, UX/UI, and the usual stuff. If a normal person takes 6 months to learn a Game Engine, the Developer will take a maximum of 3 months or less. Many people don’t know this, but I started my tech career as a game developer, although I later turned my back on game development and became a Python developer. And no lies, they were a few of the best years in my life. This article is dedicated to any developer who wants to try something new or exciting (which is game development, yes). Scroll down!Making Your First Game Software developers who are interested in game development have a remarkable head start. Programming skills are the core of game development. Even if you’re more comfortable with Swift or Ruby, which is not commonly used in game development, you can quickly pick up other Object-oriented programming languages that are much more commonly used for game development, like C# or C++, easier than anyone! If you're a Python lover, you will love to hear this: There are really good, AAA games made with Python such as Battlefield 2, EVE Online, Civilization IV, and more! <img alt="image.png" srcSet="https://substackcdn.com/image/fetch/w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa2fda11f-7cec-48d1-9c44-6df1b1192113_1440x900.jpeg?auto=format&amp;fit=max&amp;w=1920 1x, https://substackcdn.com/image/fetch/w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa2fda11f-7cec-48d1-9c44-6df1b1192113_1440x900.jpeg?auto=format&amp;fit=max&amp;w=3840 2x" src="https://substackcdn.com/image/fetch/w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa2fda11f-7cec-48d1-9c44-6df1b1192113_1440x900.jpeg?auto=format&amp;fit=max&amp;w=3840" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="image-container image.png" loading="lazy"/>Not only Python, but almost every commonly used Programming language has libraries that support making games. For example: Flutter has Flame, a game engine that supports Flutter language. Ruby has Gosu, a library that makes it easy to develop 2D games. Python has PyGame, a library that empowers you to create both 2D and 3D games. Phaser allows you to create games with JavaScript and HTML5. Start Small, Grow Big For every beginner, either a software engineer or a novice, I give one common piece of advice— Start as small as possible. It doesn't matter how small pieces of code it has or how messy it is, you've won the challenge! If you love simple 2D games, I would recommend that you make a Pong game. Pong features simple graphics (2 rectangles and a circle) you can create on your own, minimal sounds, and a game loop. If you want to learn about making multiplayer games, allow matches to occur between two human players over a network. If you want to learn about AI, allow the player to challenge the computer. And if you love 3D games like me, start with Cube Run. I haven't made it without a Game engine because, 3D becomes a bit harder with Python or others but with Unity, it's the best game I recommend to take a start. <img alt="My version of cube run. Beautiful, right?" srcSet="https://substackcdn.com/image/fetch/w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9e32aa23-1799-4597-8bfa-14f240b73562_1552x875.jpeg?auto=format&amp;fit=max&amp;w=1920 1x, https://substackcdn.com/image/fetch/w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9e32aa23-1799-4597-8bfa-14f240b73562_1552x875.jpeg?auto=format&amp;fit=max&amp;w=3840 2x" src="https://substackcdn.com/image/fetch/w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9e32aa23-1799-4597-8bfa-14f240b73562_1552x875.jpeg?auto=format&amp;fit=max&amp;w=3840" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="image-container image.png" loading="lazy"/>Major Ingredients of A Game If you make a cake without Sugar, no one will eat it. Except for diabetic people, of course, like my mom. The same goes for video games. It’s full of ingredients, some of which are required for every game and some of which are optional. I’ll introduce them briefly.1. Level Design In many games, the level itself is a challenge, trickier than the smartest AI enemies. Series like Tomb Raider also emphasize complex and challenging level design. While the advent of open-world games like GTA may make the level design seem less important than in bygone times, it’s worth noting that even open-world games have ‘levels’, such as a particular building, structure, or map area you must enter to achieve a goal. To reduce player feelings of being railroaded, levels will ideally have multiple possible paths through them. <img alt="A level I designed for a simple 3D car game (it’s a track if you can’t notice)" srcSet="https://substackcdn.com/image/fetch/w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb220b5e2-abe4-46d4-9671-f78b0b2135a5_1542x712.jpeg?auto=format&amp;fit=max&amp;w=1920 1x, https://substackcdn.com/image/fetch/w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb220b5e2-abe4-46d4-9671-f78b0b2135a5_1542x712.jpeg?auto=format&amp;fit=max&amp;w=3840 2x" src="https://substackcdn.com/image/fetch/w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb220b5e2-abe4-46d4-9671-f78b0b2135a5_1542x712.jpeg?auto=format&amp;fit=max&amp;w=3840" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="image-container image.png" loading="lazy"/>2. Lighting In games, you can’t really rely on natural light sources to illuminate your video game. (You don’t think there’s a sun inside a game engine, do you?) Every light source in a video game must be added by hand and light manipulation is incredibly important. Light can be used for all of the following: Controlling the player’s ability to see. In horror and survival games, light is a resource that must be carefully managed. Controlling a player’s ability to be seen. In games with an element of stealth, dark areas can provide cover while well-lit areas represent a difficult challenge. Setting the mood. The quality of light can be used to set the mood, with sunny and bright lighting associated with happy times and brooding light associated with dark times. Lighting the way. Light can be used to direct the player’s attention. The best-designed levels in video games often make clever use of light to guide the player in the right direction when they might otherwise be lost. <img alt="Call of Duty does a great job with lights, especially indoors." srcSet="https://substackcdn.com/image/fetch/w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F80454031-f975-4ce8-a0d7-97fe4f761c32_1280x720.jpeg?auto=format&amp;fit=max&amp;w=1920 1x, https://substackcdn.com/image/fetch/w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F80454031-f975-4ce8-a0d7-97fe4f761c32_1280x720.jpeg?auto=format&amp;fit=max&amp;w=3840 2x" src="https://substackcdn.com/image/fetch/w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F80454031-f975-4ce8-a0d7-97fe4f761c32_1280x720.jpeg?auto=format&amp;fit=max&amp;w=3840" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="image-container image.png" loading="lazy"/> 3. Game Art and Textures Game art is the medium through which the game world is presented to the player. In a sense, all the programming effort that goes into making video games is an attempt to turn game art into something that feels responsive and alive. Game art is an umbrella term that includes textures, 3D models, sprites, particle effects, and lighting. And yes, it’s a broad area, best to not cover it in this article. <img alt="Also, something I designed" srcSet="https://substackcdn.com/image/fetch/w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd279ff1d-9fcb-4640-b4c4-3dc8e521fb69_1535x863.jpeg?auto=format&amp;fit=max&amp;w=1920 1x, https://substackcdn.com/image/fetch/w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd279ff1d-9fcb-4640-b4c4-3dc8e521fb69_1535x863.jpeg?auto=format&amp;fit=max&amp;w=3840 2x" src="https://substackcdn.com/image/fetch/w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd279ff1d-9fcb-4640-b4c4-3dc8e521fb69_1535x863.jpeg?auto=format&amp;fit=max&amp;w=3840" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;disp'''
