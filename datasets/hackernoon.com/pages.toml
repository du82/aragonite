description = "Built for the future of the internet, Veera is designed to make Web3 intuitive, accessible, and rewarding."
full_description = 'Veera, a rapidly growing internet browser, is now available in over 100 countries, delivering a seamless browsing experience alongside one of the most comprehensive Web3 ecosystems. With over 4 million users and a monthly active base of 1 million+, Veera is positioning itself at the forefront of the evolving decentralized internet. Built for the future of the internet, Veera is designed to make Web3 intuitive, accessible, and rewarding. By combining decentralized applications (dApps), digital wallets, tokenized rewards, and secure browsing into a single interface, Veera eliminates the complexity that has historically hindered Web3 adoption. Since its launch, Veera has scaled 4mn users in less than a year, with a monthly active user base of 1Mn+, a daily active user base of 100k+, and an average time spent of over 13mins per day. With web3 usage growing every single day, Veera is set to be a game-changer in this fast-evolving ecosystem."We are super excited to take Veera to over 100 markets within the first year of launch. I’m super grateful to the team, our investors, and our user base for giving us this confidence. Our goal with Veera was to build a product that genuinely adds value to users’ lives. We have always been a gateway to the internet for our users—now, we’re also a comprehensive gateway to the world of Web3. We believe the future of the internet is decentralized, and Veera is designed to make that future accessible to everyone. We are conscious of the responsibility we have to provide the best possible experience to new users exploring web3 for the first time. And this is just the beginning. We have so much more in store for users across the world," said Arjun Ghose, Founder & CEO, Veera.“Veera isn’t just a browser; it’s a gateway to the decentralized world because it packs the power of a browser, crypto wallet, dapp store and immersive Web3 experiences into a single platform. Our mission is simple: empower users with a secure, privacy-focused, and rewarding Web3 experience. Our intuitive UX simplifies access to Web3 onboarding while preserving user autonomy, helping us shape the next era of the internet,” added Sukhdeep Bhogal, COO & CPO, Veera.Veera was envisioned as a Web3-native challenger browser by Arjun Ghose (former investor at Falcon Edge/Alpha Wave and McKinsey), Aditya Julka (serial entrepreneur, Founder of Paddle8, and entrepreneur-in-residence at Harvard Business School), and Kanu Gupta (founding leadership of Goldman Sachs in India, serial investor). Backed by leading investors including CMCC, 6th Man Ventures, Folius Ventures, Reflexive Ventures, Sfermion, Ayon Capital, COG Network, and iSeed Ventures, Veera is shaping the future of decentralized browsing and digital experiences.The company’s roadmap includes an upcoming iOS launch, further chain abstraction & support, referrals, single click swaps, etc., further strengthening Veera’s position as the definitive Web3 SuperApp for users worldwide.Website: https://veera.com/Product Video - https://youtu.be/VAtEevBYuHc'
