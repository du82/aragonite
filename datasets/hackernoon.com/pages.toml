mg data-tip="true" data-for="tldr-mention-MATIC" alt="Mention Thumbnail" srcSet="https://s2.coinmarketcap.com/static/img/coins/64x64/3890.png?auto=format&amp;fit=max&amp;w=32 1x, https://s2.coinmarketcap.com/static/img/coins/64x64/3890.png?auto=format&amp;fit=max&amp;w=64 2x" src="https://s2.coinmarketcap.com/static/img/coins/64x64/3890.png?auto=format&amp;fit=max&amp;w=64" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:contain" class="img" loading="lazy"/><img alt="featured image - $3 Million in Seed Funding for Web3 Founders Announced By Necto Labs" srcSet="https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-co93j57.gif.webp?auto=format&amp;fit=max&amp;w=640 1x, https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-co93j57.gif.webp?auto=format&amp;fit=max&amp;w=1080 2x" src="https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-co93j57.gif.webp?auto=format&amp;fit=max&amp;w=1080" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="image-container feat" loading="lazy"/><img data-for="author-tooltip" data-tip="true" data-delay-hide="200" alt="Mysterium VPN HackerNoon profile picture" href="/u/mysteriumvpn" sizes="100vw" srcSet="https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-ao83fmf.png?w=100&amp;auto=format&amp;fit=max 640w, https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-ao83fmf.png?w=100&amp;auto=format&amp;fit=max 750w, https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-ao83fmf.png?w=100&amp;auto=format&amp;fit=max 828w, https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-ao83fmf.png?w=100&amp;auto=format&amp;fit=max 1080w, https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-ao83fmf.png?w=100&amp;auto=format&amp;fit=max 1200w, https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-ao83fmf.png?w=100&amp;auto=format&amp;fit=max 1920w, https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-ao83fmf.png?w=100&amp;auto=format&amp;fit=max 2048w, https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-ao83fmf.png?w=100&amp;auto=format&amp;fit=max 3840w" src="https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-ao83fmf.png?w=100&amp;auto=format&amp;fit=max" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" class="profileImage " loading="lazy"/>Start building some cool sh*t <img alt="" srcSet="https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-via3jsi.jpeg?auto=format&amp;fit=max&amp;w=1920 1x, https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-via3jsi.jpeg?auto=format&amp;fit=max&amp;w=3840 2x" src="https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-via3jsi.jpeg?auto=format&amp;fit=max&amp;w=3840" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="image-container undefined" loading="lazy"/> If you’re a developer or entrepreneur, you’re no doubt curious (or possibly sick of hearing) about the wave of Web3 innovation that is taking over the internet.Web3, also referred to as the decentralized web, is the next era of the internet. It rewires things on both an infrastructural and social level. It provides more autonomy and shared value for all online users - not just internet giants who rule the digital world.The growth of the dWeb space over the past few years has been unimaginable. The decentralised applications (dapps) market is projected to reach $368.25 billion by 2027, while the Total Value Locked in decentralised finance has increased 7 times year-over-year, at once point surpassing $100 billion.<img alt="" srcSet="https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-vg93jjb.jpeg?auto=format&amp;fit=max&amp;w=1920 1x, https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-vg93jjb.jpeg?auto=format&amp;fit=max&amp;w=3840 2x" src="https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-vg93jjb.jpeg?auto=format&amp;fit=max&amp;w=3840" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="image-container undefined" loading="lazy"/>There are many builders, networks and ecosystems piecing the Web3 puzzle together. These projects are taking on the mammoth challenge of undoing decades of exploitative centralisation and corporatisation.At Mysterium, we’ve spent years building a new protocol from scratch, powered by a decentralised peer-to-peer network on Ethereum and Polygon, made up of tens of thousands of nodes worldwide. (You can run a node yourself - join the network here.)It’s infrastructure for this re-imagination of the web - a network powerful enough to act as a building block for developers and entrepreneurs all pioneering a more private and ethical internet.<img alt="" srcSet="https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-8ua3k9m.jpeg?auto=format&amp;fit=max&amp;w=1920 1x, https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-8ua3k9m.jpeg?auto=format&amp;fit=max&amp;w=3840 2x" src="https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-8ua3k9m.jpeg?auto=format&amp;fit=max&amp;w=3840" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="image-container undefined" loading="lazy"/>But bringing this new web to life is a collective mission, so we invite you to join us. We have open-sauce ingredients and infrastructure, so you can build new projects and…Bring something new to the Web3 table with Necto Labs 🔺🧬Necto Labs is a new open-source innovation lab driven by R&D, venture funding and strategic collaborations to build a better web for all.Led by Mysterium, the Lab is dedicating $3 million in seed funding to developers and entrepreneurs who want to build encrypted and uncensorable products and services on the network.<img alt="" srcSet="https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-4uf3kdi.gif.webp?auto=format&amp;fit=max&amp;w=640 1x, https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-4uf3kdi.gif.webp?auto=format&amp;fit=max&amp;w=1080 2x" src="https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-4uf3kdi.gif.webp?auto=format&amp;fit=max&amp;w=1080" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="image-container undefined" loading="lazy"/>And we know that being a developer and being an entrepreneur doesn’t always go hand in hand.That’s why we’ve created a 12-week incubator program that you can also join.<img alt="" srcSet="https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-j4b3kw1.jpeg?auto=format&amp;fit=max&amp;w=1920 1x, https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-j4b3kw1.jpeg?auto=format&amp;fit=max&amp;w=3840 2x" src="https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-j4b3kw1.jpeg?auto=format&amp;fit=max&amp;w=3840" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="image-container undefined" loading="lazy"/>Through the program, you get to work with an in-house team of technical mentors, product marketers, UX designers and business development consultants.You can also tap into a network of industry experts and leading organizations, as well as a community of fellow Web3 builders.Every project will automatically be considered for follow-on funding opportunities, so you can scale your idea beyond the seed stage.Whether you have a brand new project that needs a go-to-market plan, or a well-developed idea that needs a workable MVP and paying customers, we’re open to it. The Lab is looking for all kinds of ideas. You can get crazy creative, so long as there is a meaningful application of the protocol or exit node network, and it contributes to the borderless and accessible web.<img alt="" srcSet="https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-vea3jp7.jpeg?auto=format&amp;fit=max&amp;w=1920 1x, https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-vea3jp7.jpeg?auto=format&amp;fit=max&amp;w=3840 2x" src="https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-vea3jp7.jpeg?auto=format&amp;fit=max&amp;w=3840" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="image-container undefined" loading="lazy"/>We also encourage teams to build solutions for social impact. We want to make sure resources are being used to solve real-world problems and create shared value for communities in need. Teams can collaborate with any relevant organisation to create tools or services that champion digital rights.Learn more about the seed program in our DOCS, including technical and commercial criteria. (You can also check out the list of ideas for inspo further below.)Throw your ideas at us!Apply for funding here, or register your interest here.Catch you in the Nectosystem 🖖<img alt="" srcSet="https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-pxc3k0d.jpeg?auto=format&amp;fit=max&amp;w=1920 1x, https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-pxc3k0d.jpeg?auto=format&amp;fit=max&amp;w=3840 2x" src="https://hackernoon.imgix.net/images/UZ7S6ZAAsSOmbqh7hwrKcRaWL4l2-pxc3k0d.jpeg?auto=format&amp;fit=max&amp;w=3840" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%"'''
