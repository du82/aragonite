tom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="image-container feat" loading="lazy"/><img data-for="author-tooltip" data-tip="true" data-delay-hide="200" alt="ZEX MEDIA HackerNoon profile picture" href="/u/zexprwire" sizes="100vw" srcSet="https://hackernoon.imgix.net/images/iRbOHPwIo2hED0rACW3cailrVtl2-yg93x02.png?w=100&amp;auto=format&amp;fit=max 640w, https://hackernoon.imgix.net/images/iRbOHPwIo2hED0rACW3cailrVtl2-yg93x02.png?w=100&amp;auto=format&amp;fit=max 750w, https://hackernoon.imgix.net/images/iRbOHPwIo2hED0rACW3cailrVtl2-yg93x02.png?w=100&amp;auto=format&amp;fit=max 828w, https://hackernoon.imgix.net/images/iRbOHPwIo2hED0rACW3cailrVtl2-yg93x02.png?w=100&amp;auto=format&amp;fit=max 1080w, https://hackernoon.imgix.net/images/iRbOHPwIo2hED0rACW3cailrVtl2-yg93x02.png?w=100&amp;auto=format&amp;fit=max 1200w, https://hackernoon.imgix.net/images/iRbOHPwIo2hED0rACW3cailrVtl2-yg93x02.png?w=100&amp;auto=format&amp;fit=max 1920w, https://hackernoon.imgix.net/images/iRbOHPwIo2hED0rACW3cailrVtl2-yg93x02.png?w=100&amp;auto=format&amp;fit=max 2048w, https://hackernoon.imgix.net/images/iRbOHPwIo2hED0rACW3cailrVtl2-yg93x02.png?w=100&amp;auto=format&amp;fit=max 3840w" src="https://hackernoon.imgix.net/images/iRbOHPwIo2hED0rACW3cailrVtl2-yg93x02.png?w=100&amp;auto=format&amp;fit=max" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" class="profileImage " loading="lazy"/><img alt="0-item" srcSet="https://cdn.hackernoon.com/images/img-8e03r4z.png?auto=format&amp;fit=max&amp;w=16 1x, https://cdn.hackernoon.com/images/img-8e03r4z.png?auto=format&amp;fit=max&amp;w=32 2x" src="https://cdn.hackernoon.com/images/img-8e03r4z.png?auto=format&amp;fit=max&amp;w=32" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>急速に成長しているインターネット ブラウザーである Veera は、現在 100 か国以上で利用でき、最も包括的な Web3 エコシステムの 1 つと連携してシームレスなブラウジング エクスペリエンスを提供しています。400 万人を超えるユーザーと 100 万人を超える月間アクティブ ユーザーを擁する Veera は、進化する分散型インターネットの最前線に立っています。 インターネットの未来のために構築された Veera は、Web3 を直感的でアクセスしやすく、報酬が得られるものにするように設計されています。分散型アプリケーション (dApps)、デジタル ウォレット、トークン化された報酬、安全なブラウジングを 1 つのインターフェイスに組み合わせることで、Veera はこれまで Web3 の採用を妨げてきた複雑さを排除します。発売以来、Veera は 1 年足らずで 400 万人のユーザーを獲得し、月間アクティブ ユーザー ベースは 100 万人以上、1 日のアクティブ ユーザー ベースは 10 万人以上、平均使用時間は 1 日あたり 13 分を超えています。Web3 の使用量は毎日増加しており、Veera はこの急速に進化するエコシステムでゲームチェンジャーとなるでしょう。 <img alt="" srcSet="https://hackernoon.imgix.net/images/iRbOHPwIo2hED0rACW3cailrVtl2-2025-02-28T23:51:55.552Z-xvsr4ngshr9l3o6ud33pbbq4?auto=format&amp;fit=max&amp;w=1920 1x, https://hackernoon.imgix.net/images/iRbOHPwIo2hED0rACW3cailrVtl2-2025-02-28T23:51:55.552Z-xvsr4ngshr9l3o6ud33pbbq4?auto=format&amp;fit=max&amp;w=3840 2x" src="https://hackernoon.imgix.net/images/iRbOHPwIo2hED0rACW3cailrVtl2-2025-02-28T23:51:55.552Z-xvsr4ngshr9l3o6ud33pbbq4?auto=format&amp;fit=max&amp;w=3840" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="image-container undefined" loading="lazy"/> 「発売後 1 年以内に Veera を 100 以上の市場に展開できることを大変嬉しく思っています。この自信を与えてくれたチーム、投資家、ユーザー ベースに大変感謝しています。Veera の目標は、ユーザーの生活に真に価値を付加する製品を構築することでした。私たちは常にユーザーにとってインターネットへのゲートウェイであり続けてきましたが、今では Web3 の世界への包括的なゲートウェイでもあります。インターネットの未来は分散化されていると信じており、Veera は誰もがその未来にアクセスできるように設計されているのです。」 「私たちは、初めて Web3 を体験する新規ユーザーに可能な限り最高の体験を提供する責任を認識しています。そして、これはほんの始まりに過ぎません。私たちは世界中のユーザーのために、さらに多くのことを用意しています」と Veera の創設者兼 CEO である Arjun Ghose 氏は述べています。 「Veera は単なるブラウザではありません。ブラウザ、暗号通貨ウォレット、dapp ストア、没入型 Web3 エクスペリエンスのパワーを 1 つのプラットフォームに詰め込んだ、分散型世界へのゲートウェイです。私たちの使命はシンプルです。安全でプライバシーを重視し、やりがいのある Web3 エクスペリエンスでユーザーを支援することです。直感的な UX により、Web3 オンボーディングへのアクセスが簡素化されるとともに、ユーザーの自律性が維持され、インターネットの次の時代を形作るのに役立ちます」と Veera の COO 兼 CPO、Sukhdeep Bhogal 氏は付け加えました。 Veera は、Arjun Ghose (Falcon Edge/Alpha Wave および McKinsey の元投資家)、Aditya Julka (連続起業家、Paddle8 の創設者、ハーバード ビジネス スクールの起業家)、Kanu Gupta (インドのゴールドマン サックスの創設リーダー、連続投資家) によって Web3 ネイティブのチャレンジャー ブラウザーとして構想されました。CMCC、6th Man Ventures、Folius Ventures、Reflexive Ventures、Sfermion、Ayon Capital、COG Network、iSeed Ventures などの大手投資家の支援を受け、Veera は分散型ブラウジングとデジタル エクスペリエンスの未来を形作っています。 同社のロードマップには、今後の iOS のリリース、さらなるチェーンの抽象化とサポート、紹介、シングルクリックスワップなどが含まれており、世界中のユーザーにとっての決定的な Web3 スーパーアプリとしての Veera の地位をさらに強化します。 ウェブサイト: https://veera.com/製品ビデオ - <img alt="Miro-Leaders" sizes="100vw" srcSet="https://hackernoon.imgix.net/images/img-ql53l5p.png?auto=format&amp;fit=max&amp;w=640 640w, https://hackernoon.imgix.net/images/img-ql53l5p.png?aut'
