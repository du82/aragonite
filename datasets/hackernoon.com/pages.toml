ttps://hackernoon.imgix.net/avatars/robot-b2.png?w=100&amp;auto=format&amp;fit=max 1920w, https://hackernoon.imgix.net/avatars/robot-b2.png?w=100&amp;auto=format&amp;fit=max 2048w, https://hackernoon.imgix.net/avatars/robot-b2.png?w=100&amp;auto=format&amp;fit=max 3840w" src="https://hackernoon.imgix.net/avatars/robot-b2.png?w=100&amp;auto=format&amp;fit=max" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:cover" class="profileImage " loading="lazy"/><img alt="0-item" srcSet="https://cdn.hackernoon.com/images/img-5p03rto.png?auto=format&amp;fit=max&amp;w=16 1x, https://cdn.hackernoon.com/images/img-5p03rto.png?auto=format&amp;fit=max&amp;w=32 2x" src="https://cdn.hackernoon.com/images/img-5p03rto.png?auto=format&amp;fit=max&amp;w=32" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/><img alt="1-item" srcSet="https://cdn.hackernoon.com/images/img-w003rvs.png?auto=format&amp;fit=max&amp;w=16 1x, https://cdn.hackernoon.com/images/img-w003rvs.png?auto=format&amp;fit=max&amp;w=32 2x" src="https://cdn.hackernoon.com/images/img-w003rvs.png?auto=format&amp;fit=max&amp;w=32" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" loading="lazy"/>Adobe Experience Manager's Oak repository is like a bustling warehouse: over time, unused data (old checkpoints, orphaned nodes) piles up, slowing performance and eating disk space. While Adobe's official documentation explains the what and why of Offline Revision Cleanup (ORC), the how often leaves DevOps executing repetitive tasks. With this in mind, I’ll share how a simple Bash script can transform this critical-but-tedious process into a one-command operation - safely, efficiently, and with zero manual checklists. <img alt="Let automation handle the heavy lifting while you focus on something else! ☕📈" srcSet="https://hackernoon.imgix.net/images/null-68032at.png?auto=format&amp;fit=max&amp;w=1920 1x, https://hackernoon.imgix.net/images/null-68032at.png?auto=format&amp;fit=max&amp;w=3840 2x" src="https://hackernoon.imgix.net/images/null-68032at.png?auto=format&amp;fit=max&amp;w=3840" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="image-container undefined" loading="lazy"/> Why Bash Script Outperforms Manual Cleanup in AEM Oak The script isn’t just a wrapper around oak-run.jar. It’s a safety-first automation tool designed for real-world enterprise environments. Here’s what makes it stand out: Pre-Flight Checks: It verifies dependencies (java, lsof), validates paths, and ensures AEM is offline. Interactive Prompts (with an --yes override): No accidental runs. Atomic Operations: Each checkpoint removal and compaction step is isolated. If one fails, the script exits cleanly. Color-Coded Logging: Spot issues at a glance with red errors and green success states. # Sample Log Output [INFO] [2023-10-15 14:30:00] Starting offline revision cleanup process [ERROR] [2023-10-15 14:30:05] Oak command failed: checkpoints segmentstore Script Architecture Let’s dissect the critical components: 1. Argument Parsing & Validation The script enforces strict input rules. Try passing an invalid port like 99999? It’ll block you. Forget the AEM directory? A friendly error appears. # Validate port range if [[ ! "$PORT" =~ ^[0-9]+$ ]] || [ "$PORT" -lt 1 ] || [ "$PORT" -gt 65535 ]; then log_message "ERROR" "Invalid port number: $PORT" exit 1 fi 2. The Oak Command Engine The run_oak_command function handles all interactions with oak-run.jar, including error trapping. Notice the -Dtar.memoryMapped=true flag, a performance tweak for large repositories: By allowing memory-mapped file access, it reduces I/O overhead during compaction. run_oak_command() { java -Dtar.memoryMapped=true -jar "$OAK_RUN" "$@" if [ $? -ne 0 ]; then log_message "ERROR" "Oak command failed: $@" exit 1 fi } 3. Safety Nets You’ll Appreciate at 2 AM Port collision prevention: Script exits if AEM is still up, avoiding data corruption. Input validation: Rejects non-existent paths or invalid ports up front. User prompts: Optional confirmations at each critical stage (unless --yes is set) How to Run The Bash Script Prerequisites: AEM instance fully stopped oak-run.jar version matching your AEM/Oak deployment Backup of crx-quickstart (yes, really!) 2. Execute the Script:./aem-orc-cleanup.sh -d /opt/aem/author -o ./oak-run-1.42.0.jar --yes What Happens Next: Segmentstore compaction Datastore compaction Logs written to stdout Troubleshooting Cheat Sheet Problem: Script fails with "AEM is still running" Fix: # Find AEM pid among lingering Java processes ps aux | grep java | grep -v grep | awk '{print $2}' # Kill AEM process kill -9 AEM_PID Problem: oak command failedduring compactionFix: Check Oak/AEM version compatibility Ensure adequate disk space (2x repository size) Test with --debug for verbose logging Problem: Script fails with Permission denied”Fix:chmod +x aem-orc-cleanup.sh and ensure the user has read/write access to AEM directories. Customizations for Power Users While the base script works out of the box, its real value shines when tailored to your team's workflow. Here's how to transform it into a production-ready powerhouse: 1. Enhanced Monitoring & Analytics Add a pre-compaction disk usage snapshot to quantify your ROI: # Capture before/after metrics DISK_USAGE_PRE=$(du -sh $CQ_REPO_PATH | awk '{print $1}') # ... run compaction ... DISK_USAGE_POST=$(du -sh $CQ_REPO_PATH | awk '{print $1}') log_message "INFO" "Disk reclaimed: $DISK_USAGE_PRE → $DISK_USAGE_POST" 2. Intelligent Alerting Replace passive logging with proactive notifications. For example, trigger a Slack alert on failure: if [ $? -ne 0 ]; then curl -X POST -H 'Content-type: application/json' \ --data "{\"text\":\"🚨 AEM ORC failed on $(hostname)\"}" \ https://hooks.slack.com/services/YOUR_WEBHOOK fi 3. Dynamic Retry Logic Oak compaction can fail due to transient I/O issues. Add resilience with exponential backoff: MAX_RETRIES=3 RETRY_DELAY=60 # seconds for ((i=1; i<=$MAX_RETRIES; i++)); do run_oak_command "compact" "$store" if [ $? -eq 0 ]; then break fi sleep $(($RETRY_DELAY * $i)) done What’s your killer customization? Please share it in the comments.Final Thoughts: Elevating Maintenance from Chore to Strategic Advantage Let’s face it: tasks like Offline Revision Cleanup rarely make the highlight reel of a developer’s day. They’re the unsung, unglamorous chores that keep systems alive. But the truth is how you handle these tasks defines the reliability of your AEM ecosystem. This script isn’t just about avoiding OutOfDiskSpaceErrors or shaving seconds off query times. It’s about operational maturity. By automating ORC, you’re not just solving a problem, you’re institutionalizing consistency. You’re replacing tribal knowledge (“How did we do this last time?”) with version-controlled, auditable code. For DevOps teams, the payoff is twofold: Risk Reduction: No more “fat-finger” mistakes during manual compaction. Scalability: Apply the same script across dev, stage, and prod environments with predictable results. What’s Next? Grab the script, tweak it for your team’s alerting/logging stack, and run it in a staging environment. Measure the before/after: Disk space reclaimed? Startup times improved? Share the metrics with leadership — it’s a win they’ll understand. Bonus points: Integrate it into your CI/CD pipeline as a post-deployment health check. IMHO the future of AEM ops isn’t about working harder — it’s about scripting smarter. Now, go turn those maintenance windows into something more exciting. (Or at least, something that doesn’t keep you up at night.) What’s your automation success story? Drop a comment below — I’d love to hear how you’re taming AEM’s complexity. #!/bin/bash # ============================================================================= # AEM Offline Revision Cleanup Script # ============================================================================= # Purpose: Performs maintenance operations on Adobe Experience Manager's Oak # repository, including checkpoint management and compaction. # # Source: https://experienceleague.adobe.com/en/docs/experience-manager-65/content/implementing/deploying/deploying/revision-cleanup#how-to-run-offline-revision-cleanup # # Version: 1.0.0 # Author: Giuseppe Baglio '''
