title = "Careers | HackerOne"
description = "All tech has bugs which can be removed safely if we work together. Join a security-conscious team with thousands of friendly hackers who are eager to help."
full_description = "HackerOne Careers Help build a safer internet. Join our mission to make world-class security accessible to everyone, and work with some of the top security-minded teams and organizations in the world. View open positions Image Image Come work with us! HackerOne is a global team with hubs in eight locations, united by our mission to empower the world to build a safer internet. Our Flexible Work philosophy acknowledges the importance of fostering connections and community while providing the flexibility that allows us to perform at our best. At HackerOne, flexible work and meaningful collaboration drive our business forward and nurture our well-being. By striking this delicate balance, we create a welcoming and inclusive culture that sets us apart. Culture & Talent HackerOne’s culture results from our people, values, and strong mission. We set out to create a workplace where everyone is valued and heard. Learn more about our culture on the HackerOne Culture and Talent Blog.Visit our blog Mission-driven hiring Our mission is why we come to work every day. We look for candidates who have the same passion for that mission. We are committed to hiring a diverse population of top talent and supporting employee development so they can achieve their career goals. Diversity, Equity & Inclusion HackerOne is committed to creating an inclusive culture because diverse teams increase creativity, belonging, and performance. Building those teams takes intention. At HackerOne, we believe our employees, or Hackeronies, should reflect our global presence. Our five core values We recognize that our mission is bigger than us, and therefore we lead with integrity at all times. As a team, we believe that transparency builds trust, so we default to disclosure in our communications. Each individual executes with excellence, creating an environment of greater alignment and autonomy. We win as a team and respect all people.Learn more about HackerOne’s values here. Pay equity review Our compensation program is built upon the philosophy of ensuring and maintaining internal equity and leveraging local market data to remain competitive. We have a system that bases pay on the internal value and scope of the job, and draws from external job market data to maintain local market competitiveness. This allows us to compensate employees with similar job duties and performance with little deviation while accounting for other factors, such as their experience level, location, and tenure. Image Employee Benefits Keeping our employees healthy and wise is important for a better work experience. We offer benefits and resources to help you prioritize your well-being because we know that happy and healthy employees are engaged employees.Comprehensive medical coverage options that best fit you and your loved ones.Generous time off policy and leave programs for you to recharge and care for yourself and your family.Compensation packages that let you share in HackerOne’s long-term success.Retirement plans.Paid maternity, paternity, and family caregiver leave.Parent-friendly arrangements for return to work. Don't see that perfect match on the current job board? We invite you to join our HackerOne Talent Community! Review our recruitment privacy notice."
year_published = 2025
