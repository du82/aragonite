["https://hackthissite.org/info/about"]
title = "Hack This Site"
description = "HackThisSite.org is a free, safe and legal training ground for hackers to test and expand their ethical hacking skills with challenges, CTFs, and more."
full_description = "Hack This Site is a free training ground for users to test and expand their hacking skills. Our community is dedicated to facilitating an open learning environment by providing a series of hacking challenges, articles, resources, and discussion of the latest happenings in hacker culture. We are an online movement of artists, activists, hackers and anarchists who are organizing to create new worlds. This guide is an introduction to the site, community, philosophy and project organization. This project is entirely what you make of it. We encourage people to take an active role in the development of this community and to copy and redistribute this guide on their own. We believe everyone should have free access to all information. Hacking should not be a privileged skill - everyone should have the opportunity to learn about computer security in the age of technology. We seek to facilitate a free and open training ground where people can test and expand their skills in a legal and realistic environment. Considering that several of the hacking challenges are simulated web defacements, the question of the ethics of hacking is repeatedly brought up. We like to consider hacking itself to be a tool, a skill which in itself is neutral, a means without end. It can be used for good (for the benefit of all) or bad (mindless destruction or theft). We do not encourage negative use of the information we provide. We are more concerned with the greater risks of not distributing this information and are ready to accept the consequences. Unlike many wargame and security sites, HackThisSite is a community where all users can contribute and participate in the development of the site. We are an open society that encourages active participation, and we have set up a number of ways people can become involved. In addition, we have a very active IRC network, forums, and an open publishing system where people can submit articles and external resources to the site. We are a friendly atmosphere where we help people who ask intelligent questions. Join us and participate in very lively and passionate debates about technology and worldly events. There is no social hierarchy; we are all equal. HTS is what you make of it!"
author = "HackThisSite.org Staff"
year_published = 2025
