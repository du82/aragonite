full_description = "If your company is looking for a place to advertise your product, service, or website, this is it. We serve over 5,000+ unique visitors per day and over 2.5 million page views per month. We have a simple, flat-rate banner program where you are allowed unlimited clicks and banner impressions for a simple, never-changing flat rate. Our current banner size, the main banner at the top of the page, is an IAB-standard 468x60 pixel size (Please note, other 358x52 visible at the top of the page are a legacy banner size that is no longer offered). For a flat rate of $99.95 per month, this space can be equally shared with our other advertisers. We will not flood this space with advertising so you will be assured that your banner will be seen. With your campaign, you are given full access and documentation to your own advertising control panel where you can view statistics, change banners, and modify your advertising campaign settings. You also have the option of receiving weekly reports of your statistics. You can target your clients based on weekday, time, date, IP, domain, language, browser, and many other variables. If you are interested in advertising with us, or require more information for your decision, or if you simply would like to discuss other options or have a question, please email advertising@hackthissite.org and we can get back to you as soon as possible. Payments can be made easily and instantly via our billing portal (which utilizes the PayPal payment gateway) and account setup will generally be same-day. Make the right choice; advertise with HackThisSite.org! Please, keep in mind, your advertisements and donations pay for server hosting costs and other HackThisSite.org projects only. The staff do not receive any compensation whatsoever for their work. Our funds are stored in a community PayPal account for site projects and hosting costs. The more money we pull in means that we have to ask for less money and can even provide more to our users as we can afford faster servers and such. Again, money given to this organization in any form compensates the community not the staff."
