full_description = '''We are receiving reports of mail silently going undelivered for Microsoft users (MSN, Hotmail, Live, etc.). Our mail returns proper 200 codes when destined for Microsoft, and we are reportedly within their compliance requirements. Be advised, registering requires email confirmation, and Microsoft users may experience difficulty. We would recommend those users either contact Microsoft email support, or use another email provider. Our new policy is to encourage passphrases, that is whole sentences in lieu of garbled and obfuscated short words. It is for this reason that passphrases must be at least 15 characters. While this sounds absurdly complex, consider that the sentence, " A short sentence. ", is 18 characters. (Please do not use our example passphrase as your own. That's just unwise.) You are far more likely to remember that short sentence than you are a garbled mess of letters and numbers. You can use anything from a very short sentence to a full tweet, but remember it is case-sensitive! Thanks for registering and welcome to HackThisSite.org! We have sent a confirmation email to the address you provided. Please click on the URL provided within this email within the next 24 hours, or your registration will be forfeit. We hope that you enjoy your time here and that you use this community as a resource and not as a crutch. We hope that you will learn something from this experience and from our vast databases of knowledge and we also hope that you will repay us somehow for providing you with that knowledge. ;) HackThisSite.org is advertisement and user donation supported. Also, we seriously recommend that all users use either Mozilla Firefox or Google Chrome as their primary browser. They are faster, more secure, more standards compliant, and officially supported by us here at HackThisSite.org.'''
author = "HackThisSite.org Staff"
