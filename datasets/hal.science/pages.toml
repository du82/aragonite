["https://hal.science/hal-00250273v1"]
title = "Le français parlé à Marseille : exemple d'un locuteur PFC.  - Archive ouverte HAL"
description = "Cet article propose, à partir d'un échantillon de conversation d'un locuteur Marseillais, de documenter les aspects linguistiques majeurs (aux niveaux thématique, lexical, syntaxique, phonologique, phonétique et prosodique) propres à la variété de français parlé dans la région marseillaise. <BR />Ce travail se situe dans une perspective plus générale au bulletin PFC, qui est celle de la didactique de l'oral et de la variation langagière, et s'adresse plus particulièrement aux enseignants de français langue étrangère et seconde, en fournissant des informations sur la diversité du français parlé dans sa diversité."
full_description = "× × × Loading... × $(document).ready(function() { }); Article Dans Une Revue Bulletin PFC (Phonologie du Français Contemporain) Année : 2007 Le français parlé à Marseille : exemple d'un locuteur PFC. Annelise Coquillon (1) Afficher plus de détails 1 LPL - Laboratoire Parole et Langage Annelise Coquillon Fonction : Auteur correspondant PersonId : 846782 Connectez-vous pour contacter l'auteur Laboratoire Parole et Langage Réduire la vue détaillée Résumé fr Cet article propose, à partir d'un échantillon de conversation d'un locuteur Marseillais, de documenter les aspects linguistiques majeurs (aux niveaux thématique, lexical, syntaxique, phonologique, phonétique et prosodique) propres à la variété de français parlé dans la région marseillaise. Ce travail se situe dans une perspective plus générale au bulletin PFC, qui est celle de la didactique de l'oral et de la variation langagière, et s'adresse plus particulièrement aux enseignants de français langue étrangère et seconde, en fournissant des informations sur la diversité du français parlé dans sa diversité. Mots clés fr variété de français parlé à Marseille particularités lexicales syntaxiques phonologiques phonétiques et prosodiques enseignement et apprentissage du français (FLE/FLS) Domaines Linguistique Liste complète des métadonnées Fichiers et aperçu Fichier principal Coquillon.pdf (376) Télécharger le fichier Origine Fichiers produits par l'(les) auteur(s) Cnrs : Umr6057 Laboratoire Parole Et Langage : Connectez-vous pour contacter le contributeur https://hal.science/hal-00250273 Soumis le : lundi 11 février 2008-15:06:18 Dernière modification le : vendredi 5 juillet 2024-15:06:03 Archivage à long terme le : lundi 17 mai 2010-20:09:30 Télécharger pour visualiser Dates et versions hal-00250273 , version 1 (11-02-2008) Identifiants HAL Id : hal-00250273 , version 1 Citer Annelise Coquillon. Le français parlé à Marseille : exemple d'un locuteur PFC.. Bulletin PFC (Phonologie du Français Contemp