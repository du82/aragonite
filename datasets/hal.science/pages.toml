description = '''La greffe d'organes est source de dilemmes moraux lies à la distorsion entre la demande des patients et l'offre de greffons disponibles. En contexte de pénurie, la justice au sens de "l'égalité" se trouve concurrencée par la justice au sens de "l'équité", qui réclame une distribution rationnelle des ressources rares. Dans les affaires humaines en général, lorsqu'il faut établir des priorités, les plus méritants sont généralement privilégiés. Le mérite peut-il figurer parmi les critères de selection des candidats en attente de greffon ?'''
full_description = '''× × × Loading... × $(document).ready(function() { }); Article Dans Une Revue Soins Année : 2018 Transplantation, should patients have to be worthy of their donated organ? Transplantation, faut-il mériter son greffon ? en fr Pierre Le Coz (1) Afficher plus de détails 1 ADES - Anthropologie bio-culturelle, Droit, Ethique et Santé Pierre Le Coz Fonction : Auteur PersonId : 16168 IdHAL : pierre-le-coz IdRef : 079587518 Anthropologie bio-culturelle, Droit, Ethique et Santé CV Réduire la vue détaillée Résumé en fr Organ transplantation is a source of moral dilemmas resulting from the imbalance between the demand and the availability of organs. In a context of shortage, justice in the sense of ‘equality’ competes with justice in the sense of ‘equity’, which demands a rational distribution of rare resources. In human affairs in general, when priorities need to be established, the most worthy are generally favoured. Can worthiness feature among the selection criteria of candidates awaiting a transplant? La greffe d'organes est source de dilemmes moraux lies à la distorsion entre la demande des patients et l'offre de greffons disponibles. En contexte de pénurie, la justice au sens de "l'égalité" se trouve concurrencée par la justice au sens de "l'équité", qui réclame une distribution rationnelle des ressources rares. Dans les affaires humaines en général, lorsqu'il faut établir des priorités, les plus méritants sont généralement privilégiés. Le mérite peut-il figurer parmi les critères de selection des candidats en attente de greffon ? Mots clés en fr donation ethics professional ethics transplant transplantation worthiness mérite transplantation utilitarisme ethique déontologie don greffe Domaines Sciences du Vivant [q-bio] Ethique Liste complète des métadonnées Caroline Dubois : Connectez-vous pour contacter le contributeur https://hal.science/hal-01849375 Soumis le : jeudi 26 juillet 2018-10:14:32 Dernière modification le : mardi 23 janvier 2024-13:00:10 Consulter le texte intégral Dates et versions hal-01849375 , version 1 (26-07-2018) Licence Paternité Identifiants HAL Id : hal-01849375 , version 1 DOI : 10.1016/j.soin.2018.04.011 Citer Pierre Le Coz. Transplantation, faut-il mériter son greffon ?. Soins, 2018, 63 (826), pp.35-38. ⟨10.1016/j.soin.2018.04.011⟩. ⟨hal-01849375⟩ Exporter BibTeX XML-TEI Dublin Core DC Terms EndNote DataCite Collections CNRS UNIV-AMU ETHIQUE ANTHROPO-MARSEILLE 113 Consultations 0 Téléchargements Altmetric Partager More $(function () { linkifyElem ('.linkify'); });'''
