full_description = 'Category: How it Was Posts about how things were in Plugin Review land. Plugins: How Not To Report One day, we got a weird email from Dexter (not his real name). Am I allowed to release my POC in an hour? It was reported and my report was given n/a. No one is taking any notice to it so I assume it is safe to share and help others. That was, literally, the first email we got. We replied and asked “What PoC?” (PoC means “Proof of Concept” in this case, and it’s expected that if you report an issue, you explain how you found it and how to reproduce it as … proof … of the concept of the issue). We stressed that we had not received any other emails from him, so could he please explain. We also mentioned that asking for a reply in an hour is not acceptable for anyone, especially when you don’t know what time-zone people are in. The rest of the email was the boilerplate “Here’s how you file a security report for WP and here’s how you do it for a plugin.” My Bad, I was Helping Dexter… You see my actions as wrong. Sorry. I was trying to help. Has been a few weeks. Not making excuses but now you explained I understand, on the other side of the fence things are not as clear as that. I also have a thing where if I do not write things down I will eventually forget them. This is extra tough as I try not to keep information of vulnerabilities. However, it is my intent to do right. Believe it or not but, you are one of the only people who actually try to help educate me. Even though you did not have to. I was trying to get a CVE but I do not know the relevance of the issue. I originally thought it was WordPress then was told about plugins. The website owner is unresponsive. Trust me, I submit about 500 reports a day. They always unresponsive. I am not sure if you still want me to communicate with you or if you prefer me to leave you alone. Thank you for reducing my ignorance, either way. While I’m sure he submits a lot of reports, this was (again) the first time he’d ever emailed Plugins. And notice that he still isn’t saying anything about this report? So we asked again, what freakin PoC?!?! (nicely) and he replied in four emails with screenshots and this was the PoC: It is for thishttps://developer.wordpress.org/plugins/javascript/ajax/ https://codex.wordpress.org/AJAX_in_Plugins It was not on wordpress.org. Since the issue is down to the php code, I am not sure who is responsible for it. None of that is a PoC, for the record. That email looks like a comment about a security issue with WordPress, right? But via the screenshot of the webpage (not a link, he sent a fucking screenshot!), I was able to figure out this was from a CVE about the Ajax Load More plugin and looking at the CVE … it was already closed. Per [URL], the issue is resolved. This means there’s nothing for you to report, unless you’ve found something else. And if you have, you need to unpack what’s in your head and tell us what you found. If you’re just telling us that the vuldb site reported on an issue, then please make sure their site is NOT saying the issue was resolved. We don’t need to know about those, as they’ve already been handled. Oh and there was no issue with the codex, it was just documentation. Dexter replied “One of the targets I tested on says they are using version 5.1.9.” and frankly that sucks but it’s not our responsibility. The plugin was fixed, the fix was released, and if some dingleberries didn’t update, that’s on them. He then claimed the fix wasn’t in the 5.3.1 version. You know, the version known to be vulnerable? Yeah, it didn’t have the fix. The next version has the fix. As documented. If a PoC Falls in the Forest… Next, Dexter sent a report and here’s what his PoC looked like:  Not a joke. The text file was just that. We asked if he sent the wrong file or it was encrypted, and he claimed we were idiots for not understanding that. Again, we asked him to give us an actual proof of concept, where he walked through how he found the bug and identified it. Instead, he linked to more and more sites that had been hacked, as if that proved anything. Since he’d linked to sites with the parameters used to ‘hack,’ I was able to track down the actual plugin with the issue and … drum roll … it was already fixed! Two years ago. So Dexter decided to ‘prove’ it was a problem by finding people with the old versions of the plugins (bear in mind, every single plugin he reported had already been fixed) and attacking their sites and crashing them. That’s how someone sues your ass, by the way. NEVER ever try to test a hack on someone else’s site! Besides being bad-form, if you break the wrong site you can find yourself at the bad end of a legal mess. Proof of Concept Means You PROVE how it works We tried to explain again: The issue is you handed us an incomplete PoC without the explanations and expected US to do the hours of work to try and guess what you meant. Just by looking at that URL: example.com/wp-admin/admin-ajax.php?action=formcraft3_get&URL=http://127.0.0.1:8080 We see how it says formcraft3_get — That means a specific plugin is required to even make this possible. That issue has already been resolved and was confirmed here: https://wpscan.com/vulnerability/b5303e63-d640-4178-9237-d0f524b13d47 If you’re not testing the latest versions of WP (which you already mentioned) and the plugin, then it is an invalid report. If you are not updating WP and the plugins, of course you have a high risk of vulnerabilities, but it’s incorrect to claim these are ‘new’ (other people have already reported), and since they have all been fixed then you just have to update your site. Since literally every single report you claim to be an issue has been fixed, we have nothing to do here. He replied ‘okay’ but then kept attacking sites to prove it. After he replied this: I don’t know what you have to do but I am convinced something needs to be done. I am genuinely trying to help you. You just have to accept that you may be wrong here and need to do something about it. There are a vast amount of people looking to use the exploit. You have not advised your customers from any of the links you showed. No offence but, your work around sucks too. It is like you do not assume an attack will do any recon. I gave up, and flagged him as ‘quarantined’ which is where we put people who are well meaning, but cannot be helped. He’s right in that people are looking to attack sites, but if the fix is available and people don’t use it, the only think the plugins team might be able to do would be force an upgrade. We only do those under exceptional circumstances, which none of these were. Dexter’s still running around, being a serial ‘hacker,’ and I’ve no doubt one day he’ll really get himself into trouble. 26 March, 2024 Plugins: WordPress Owns The World A self-proclaimed security expert came to Slack one day to complain about plugin security. The summary of Kareen’s complaint (not her real name) was she firmly believes that WordPress and WordPress.org are responsible for preventing brute force attacks on users. Now, I’ve said this a lot. Brute force attacks are best protected a layer above your website, with a firewall. Preferably the firewall is something the host does. But Kareen also claimed she had proof about issues with specific plugins, hence my involvement. She came to Slack because she’d posted in the forums about security issues and was asked to please come to Slack and talk instead. That’s the norm. Like a great number of people, she took umbrage at that and ranted about the FBI and Dark Ops and Mitinick (remember him!?) and … well. Yeah. Why NOT In Forums? Why don’t we want people to talk about security in the forums? The answer is simple: They’re public. If you post about a security issue, in public, instead of privately contacting the people involved, you are increasing the risk. Hackers (or rather, kiddie scripters) scan the WordPress.org forums for evidence of security issues and use that to blast everyone and try to hack sites for lulz. And they will get on the hacks before the plugin (or whatever) devs can get a fix out. So, to be responsible and reasonable, you privately contact the developers, give them some reasonable time to fix things, and everyone wins. There are some notable shitheads who refuse to do that. As my buddy Jan says, “We’ll keep shooting the employees until moral improves.” The Right Place and Time I redirected Kareen to where to report security issues for Core and Plugins. I foolishly assumed that would be enough. Kareen emailed Plugins with a couple word docs, one of which was a complaint about the forum moderators (which was ignored) and the other was about how brute force attacks happened on websites, and people were hunting for plugins she didn’t even have on her site. I call that ‘Tuesday.’ My sites are hit like that every day of the year. They look for plugins and themes I don’t use. It’s a carpet bomb in the hopes of finding someone vulnerable. But still, I try to always give people the benefit of the doubt, so I read her other document in full and found her ‘proof’ of hacking. 123.456.78.90 - - [DAY/MON/YEAR:00:46:22 -0500] "GET /wp-content/plugins/easy-wp-smtp/ HTTP/1.1" 404 118611 "-" "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_10_1) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/39.0.2171.95 Safari/537.36" And how is that proof? She said it was because she didn’t have easy-wp-smtp installed. The reality? That proves nothing. Script Kiddies regularly attempt attacks on your site without checking if you have a plugin (or theme) first, because it’s easier to just try the attack. If it works, they’re in! If it doesn’t, they move on. If they checked first, our myriad tools would spot them sooner, which they don’t want. Now, some of those calls were interesting and were doing GET /index.php?token=5db0b95680eb8fd776410fe5a37135a5 which made me curious. They were aiming for specific tokens, but there are thousands of plugins that use that param. Oh and I liked this one too: [DAY MON 01 17:29:07.773011 2020][client 123.456.78.90:65409] [client 123.456.78.90] Access denied with code 403 [hostname "www.[redacted].com"] [uri "/register/{{=+data.profileurl+}}"] [unique_id "X@Znsw5Azi2b-mCnSbIgDAAAAAc"], referer: https://www.[redacted].com/register/%7B%7B=+data.profileurl+%7D%7D Again, we’re clearly seeing a blanket attack on plugins and themes the site didn’t have. The Calls Are Coming From Inside The House I scrubbed the IPs in this post, but I did go and check the real ones. They were all Digital Ocean and Amazon Cloud stuff. Those services are regularly used by assholes who build scripts and use the services to hunt down sites with vulnerable code. Sucks, but it’s normal. Kareen didn’t like that but she also didn’t belabor the point and left us alone after we explained it wasn’t something Plugins could help with because she couldn’t give us the name of a single plugin except easy-wp-smtp, which had actually fixed a vulnerability a couple months prior. Kareen went on to rage about how she was going to talk to the FBI (again) and made a couple legal claims. A number of people tried to calm her down, but in the end we told her that her account was suspended because we really really couldn’t help her, and she was screaming into the void. There really is a limit before you have to cut people off. It’s a waste of time. And Then … Later on, though, she filed a complaint: My account was suspended without proper or professional communication,and while defaming me as “trashing a plugin,” AFTER the network of thesame location as the hosted plugin was running brute force loginattacks 24/7 on my network. Wanna guess that network? Digital Ocean. Yeah. That’s like saying “Someone in NYC peed on my leg, therefore ALL PEOPLE FROM NYC ARE LEG PEE-ERS!” What someone does on their own hosting is, in no way, WordPress.org’s fault. If the code to brute force was found in a plugin hosted on .org, then yeah, we can do something, but it won’t stop the attacks. Needless to say, we didn’t reply. There was no point. 12 March, 2024 Plugins: Not Your Circus, Not Your Gold Mine My friend Andrea M. once told me “Not my circus, not my monkeys” about a problem that was outside her purview, and I liked it so much, I kept using it. I’m sure someone else came up with it, but that’s where I learned it. Perry (not his real name) had a big problem understanding when something wasn’t his business, as well as when to accept the L. Authors and Managers and Committers Perry had an interesting history. He started out by emailing Plugins to complain about the language used on WordPress.org plugin pages. Specifically, he didn’t like that the pages say “Plugin Author” and thought it should be “Plugin Manager” and his reason? Being authorized to commit code and release versions does not make a committer an author. Now, the plugin team didn’t agree. As Otto would say “If you’re not capable of writing the code, then you should not have access to change it for the users.” Perry … […] Moreover, the authorship claim that you are forcing on your benefactors kills inspiration. You are not allowed to impose your own rules on people committed to make WordPress usable. We’re not your slaves, not your servants, not your employees. We’re forced to contribute because WordPress is the only game in town, and most people are likely to not want to publish otherwise. I’m asking you nothing but to be consistent: […] In response you sent me lies. And added insult over injury. […] There was a bit of a laugh held over ‘slaves’ and Plugins sent back that (a) we’re not going to change it and (b) if you really want to die on that mountain, here’s a link to META TRAC where you can open a ticket. Perry sent back links to academic discourse about authorship and concluded: After reading these articles, you’ll be able to understand that a maintenance programmer is not an author. As it happens, performing maintenance programming on code, where authorship is conferred by … wait for it … writing code means the person is, in fact, an author. This was something men'
