full_description = '''Tag: hugo Cookie Consent on Hugo Hugo is my favourite static site generator. I use it on a site I originally created in 1996 (yes, FLF is about to be 30!). Over the last 6 months, I’ve been totally overhauling the site from top to bottom, and one of the long-term goals I had was to add in Cookie Consent. Hugo Has Privacy Mode One of the nice things about Hugo is they have a built in handler for Privacy Mode. I have everything set to respect Do Not Track and use PrivacyMode whenever possible. It lightens my load a lot. Built Into Hinode: CookieYes The site makes use of Hinode, which has built in support for cookie consent… Kind of. They use the CookieYes service, which I get but I hate. I don’t want to offload things to a service. In fact, part of the reason I moved of WordPress and onto Hugo for the site was GDPR. I care deeply about privacy. People have a right to privacy, and to opt in to tracking. A huge part of that is to minimize the amount of data from your own websites that are sent around to other people and saved on your own server/services! Obviously I need to know some things. I need to know how many mobile users there are so I can make it better. I need to know what pages have high traffic so I can expand them. If everyone is going to a recap page only to try and find a gallery, then I need to make those more prominent. In other words, I need Analytics. And the best analytics? Still Google. Sigh. Alternatively: CookieConsent I did my research. I checked a lot of services (free and pay), I looked into solutions people have implemented for Hugo, and then I thought there has to be a simple tool for this. There is. CookieConsent. CookieConsent is a free, open-source (MIT) mini-library, which allows you to manage scripts — and consequently cookies — in full GDPR fashion. It is written in vanilla js and can be integrated in any web platform/framework. And yes, you can integrate with Hugo. How to Add CookieConsent to Hugo First, download it. I have node set up to handle a lot of things, so I went with the easy route: npm i vanilla-cookieconsent@3.1.0 Next, I have to add the dist files to my site. I added in a command to my package.json: "build:cookie": "cp node_modules/vanilla-cookieconsent/dist/cookieconsent.css static/css/cookieconsent.css && cp node_modules/vanilla-cookieconsent/dist/cookieconsent.umd.js static/js/cookieconsent.umd.js", If you’re familiar with Hinode, may notice I’m not using the suggested way to integrate JS. If I was doing this in pure Hinode, I’d be copying the files to assets/js/critical/functional/ instead of my static folder. I tried. It errors out: Error: error building site: EXECUTE-AS-TEMPLATE: failed to transform "/js/critical.bundle-functional.js" (text/javascript): failed to parse Resource "/js/critical.bundle-functional.js" as Template:: template: /js/critical.bundle-functional.js:210: function "revisionMessage" not defined I didn’t feel like debugging the whole mess. Anyway, once you get those files in, you need to make another special js file. This file is your configuration or initialization file. And if you look at the configuration directions, it’s a little lacking. Instead of that, go look at their Google Example! This gives you everything you need to comply with Google Tag Manager Consent Mode, which matters to me. I copied that into /static/js/cookieconsent-init.js and customized it. Like, I don’t have ads so I left that out. Add Your JS and CSS I already have a customized header (/layouts/partials/head/head.html) for unrelated reasons, but if you don’t, copy the one from Hinode core over and add in this above the call for the SEO file: <link rel="stylesheet" href="/css/cookieconsent.css"> Then you’ll want to edit /layouts/partials/templates/script.html and add in this at the bottom: <script type="module" src="/js/cookieconsent-init.js"></script> Since your init file contains the call to the main consent code, you’re good to go! The Output When you visit the site, you’ll see this: Screenshot Now there’s a typo in this one, it should say “That means if you click “Reject” right now, you won’t get any Google Analytics cookies.” I fixed it before I pushed anything to production. But I made sure to specify that so people know right away. If you click on manage preferences, you’ll get the expanded version: Screenshot The language is dry as the desert because it’s to meet Google’s specifics. As for ‘strictly necessary cookies’? At this time we have NO necessary cookies. This option is here as a placeholder in case we have to add any later. We’ll notify you if that happens. And how will I notify them? By using Revision Management. 28 February, 2025 Small Hugo, Big Images In working on my Hugo powered gallery, I ran into some interesting issues, one of which was from my theme. I use a Bootstrap powered theme called Hinode. And Hinode is incredibly powerful, but it’s also very complicated and confusing, as Hugo’s documentation is still in the alpha stage. It’s like the early days of other web apps, which means a lot of what I’m trying to do is trial and error. Don’t ask me when I learned about errorf, okay? My primary issues are all about images, sizing and filing them. Image Sizes When you make a gallery, logically you want to save the large image as the zoom in, right? Click to embiggen. The problem is, in Hinode, you can load an image in a few ways: Use the standard old img tag Call the default Hugo shortcode of {{< figure >}} Call a Hinode shortcode of {{< image >}} Use a partial Now, that last one is a little weird, but basically you can’t us a shortcode inside a theme file. While WordPress has a do_shortcode() method, you use partial calls in Hugo. And you have to know not only the exact file, but if your theme even uses partials! Some don’t, and you’re left reconstructing the whole thing. Hinode has the shortcodes in partials and I love them for it! To call an image using the partial, it looks like this: {{- partial "assets/image.html" (dict "url" $imgsrc "ratio" "1x1" "wrapper" "mx-auto" "title" $title) -}} That call will generate webp versions of my image, saved to static image folder (which is a post of its own), and have the source sets so it’s handy and responsive. What it isn’t is resized. Meaning if I used that code, I would end up with the actual huge ass image used. Now, imagine I have a gallery with 30 images. That’s 30 big ass images. Not good. Not good for speed, not good for anyone. I ended up making my own version of assets/image.html (called lightbox-image.html) and in there I have this code: {{ with resources.Get $imagefile }} {{ $image = .Fill "250x250" }} {{ $imagesrc = $image.RelPermalink }} {{ end }} If the file is local, which is what that get call is doing, it uses the file ($imagefile is the ‘path’ to the file) to make a 250×250 sized version and then grabs that new permalink to use. {{ if $imagefile }} <img src="{{ $imagesrc }}" class="img-fluid img-lightbox" alt="{{ $title }}" data-toggle="lightbox" data-gallery="gallery" data-src="{{ $imagefile }}"> {{ end }} Boom! This skips over all the responsive resizing, but then again I don’t need that when I’m making a gallery, do I? Remote Image Sizes Now let’s add in a wrinkle. What if it’s a remote image? What if I passed a URL of a remote image? For this, you need to know that on build, that Hinode code will download the image locally. Local images load faster. I can’t use the same get, I need the remote get, but now I have a new issue! Where are the images saved? In the img folder. No subfolders, the one folder. And I have hundreds of images to add. Mathematically speaking, you can put about four billion files in a folder before it’s an issue for the computers. But if you’ve ever tried to find a specific file to check in a folder that large, you’ve seriously reconsidered your career trajectory. And practically speaking, the more files, the slower the processing. Anyone else remember when GoDaddy announced a maximum of 1024 files in a folder on their shared hosting? While I question the long term efficacy of that, I do try to limit my files. I know that using the get/remote get calls with tack on a randomized name at the end, but I’d like them to be organized. Since I’m calling all my files from my assets server (assets.example.com), I can organize them there and replicate that in my build. And my method to do that is as follows: {{ if eq $image "" }} {{- $imageurl = . | absURL -}} {{- $imagesrc = . | absURL -}} {{ $dir := (urls.Parse $imageurl).Path }} {{ with resources.GetRemote $imageurl | resources.Copy $dir }} {{ with .Err }} {{ warnf "%s" . }} {{ else }} {{ $image = . }} {{ $imageurl = $image.Permalink }} {{ $image = $image.Fill "250x250" }} {{ $imagesrc = $image.RelPermalink }} {{ end }} {{ end }} {{ end }} I know that shit is weird. It pairs off the earlier code. If you don’t create the image variable, then you know the image wasn’t local. So I started by getting the image url from ‘this’ (that’s what the period is) as an absolute url. Then I used the path of the url to generate my local folder path! When I use the Copy command with the pipe, it will automatically use that as the destination. Conclusion You can totally make images that are resized in Hugo. While I wish that was easier to do, most people aren’t as worried as I am about storing the images on their repository, so it’s less of an issue. Also galleries on Hugo are fairly rare. I’m starting some work now with Hinode for better gallery-esque support, and we’ll see where that goes. Maybe I’ll get a patch in there! 21 October, 2024 Hugo and a Lot of Images One issue with Hugo is that the way I’m deploying it is via Github actions, which means every time I want to update, the site has to be totally rebuilt. Now the primary flaw with that process is that when Hugo builds a lot of images, it takes a lot of time. About 8 minutes. The reason Hugo takes this long is that every time it runs its builds, it regenerates all the images and resizes them. This is not a bad thing, since Hugo smartly caches everything in the /resources/_gen/ folder, which is not sync’d to Github, and when you run builds locally it doesn’t take half as long. Now, this speed is about the same whether the images are locally (as in, stored in the repository) or remote (which is where mine are located – assets.example.com), because regardless it has to build the resized images. This only runs on a build, since it’s only needed for a build. Once the content is on the server, it’s unnecessary. The obvious solution to solve my speed issues would be to include the folder in Github, only I don’t want to store any images on Github if I can help it (legal reasons, if there’s a DMCA its easier to nuke them from my own storage). The less obvious solution is how we got here. The Basic Solution Here’s your overview: Checkout the repo Install Hugo Run the repo installer (all the dependancies etc) Copy the files from ‘wherever’ to the Git resource Run the build (which will use what’s in the resource folder to speed it up) Copy the resources folder content back down to the server This would allow me to have a ‘source of truth’ and update it as I push code. The Setup To start with, I had to decide where to upload the content. The folder is (right now) about 500 megs, and that’s only going to get bigger. Thankfully I have a big VPS and I was previous hosting around 30 gigs there, so I’m pretty sure this will be okay. But the ‘where’ specifics needed a little more than that. I went with a subdomain like secretplace.example.com and in there is a folder called /resources/_gen/ Next, how do I want to upload to for starters? I went with only uploading the static CSS files because my plan involves pushing things back down after I re-run the build. Then comes the downloading. Did you know that there’s nearly no documentation about how to rsync from a remote source to your Github Action instance? It doesn’t help that the words are all pretty generic, and search engines think “Oh you want to know about rsync and a Github Action? You must want to sync from your action to your server!” No, thank you, I wanted the opposite. While there’s a nifty wrapper for syncing over SSH for Github, it only works one way. In order to do it the other way, you have to understand the actual issue that action is solving. The SSH-sync isn’t solving rsync at all, that’s baked in to the action image (assuming you’re using ubuntu…). No, what the action solves is the mishegas of adding in your SSH details (the key, the known hosts, etc). I could use that action to copy back down to the server, but if you’re going to have to solve the issue once, you may as well use it all the time. Once that’s solved, the easy part begins. Your Actions Once we’ve understood where we’re going, we can start to get there. I’ve set this up in my ci.yml, which runs on everything except production, and it’s a requirement for a PR to pass it before it can be merged into production. I could skip it (as admin) but I try very hard not to, so I can always confirm my code will actually push and not error when I run it. name: 'Preflight Checks' on: push: branches: - '!production' # excludes production. concurrency: group: ${{ github.ref }}-ci cancel-in-progress: true jobs: preflight-checks: runs-on: ubuntu-latest steps: - name: Do a git checkout including submodules uses: actions/checkout@v4 with: submodules: true - name: Install SSH Key uses: shimataro/ssh-key-action@v2 with: key: ${{ secrets.SERVER_SSH_KEY }} known_hosts: unnecessary - name: Adding Known Hosts run: ssh-keyscan -H ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts - name: Setup Hugo uses: peaceiris/actions-hugo@v3 with: hugo-version: 'latest' extended: true - name: Setup Node and Install uses: actions/setup-node@v4 with: node-version-file: '.nvmrc' cache: 'npm' - name: Install Dependencies run: npm install && npm run mod:update - name: Lint run: npm run lint - name: Make Resources Folder locally run: mkdir resources - name: Download resources from server run: rsync -rlgoDzvc -i ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:/home/${{ secrets.REMOTE_USER }}/${{ secrets.HUGO_RESOURCES_URL }}/ resources/ - name: Test site run: npm run tests - name: Copy back down all the regenerated resources run: rsync -rlgoDzvc -i --delete resources/ ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:/home/${{ secrets.REMOTE_USER }}/${{ secrets.HUGO_RESOURCES_URL }}/ Obviously this is geared towards Hugo. My command npm run tests is a home-grown command that runs a build and then some tests on said build. It’s separate from the linting, which comes with my theme. Because it’s running a build, this is where I can make use of my pre-built resources. You may notice I set known_hosts to ‘unnecessary’ — this is a lie. They’re totally needed but I had a devil of a time making it work at all, so I followed the advice from Zell, who had a similar headache, and put in the ssh-keyscan command. When I '''
