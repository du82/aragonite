title = "gutenberg Archives - Page 3 of 3 - Half-Elf on Tech"
full_description = '''Tag: gutenberg A Sample Block: Spoilers Before I jump into this, I have to say .. this post was not written in Gutenberg. Sadly the plugin I use for code display, when I need it to be colored and easy to read, isn’t yet Gutenberg friendly. And, worse IMO, there’s a bug that causes multiline shortcodes to be smashed into one line, which makes a code block unusable. My two fixes are either the plugin I use be updated (which is beyond my skills at the moment) or I find a new plugin (looking). Or I wait. Anyway. Let’s make a simple block that you can’t edit! There are Four Files Needed spoilers.php – This is the main PHP file spoilers/index.js – This is the code spoilers/editor.css – This formats what you see on the editor spoilers/style.css – This formats what you see on the front end The last two aren’t required but I use them to make things pretty. The PHP The PHP file will need to be included in your code however you want to do it. I have a file called _blocks.php which includes all my Gutenblocks. In turn, it is included in my plugin’s main file. function lp_spoilers_block_init() { $dir = dirname( __FILE__ ); $index_js = 'spoilers/index.js'; wp_register_script( 'spoilers-block-editor', plugins_url( $index_js, __FILE__ ), array( 'wp-blocks', 'wp-i18n', 'wp-element' ), filemtime( "$dir/$index_js" ) ); $editor_css = 'spoilers/editor.css'; wp_register_style( 'spoilers-block-editor', plugins_url( $editor_css, __FILE__ ), array( 'wp-blocks' ), filemtime( "$dir/$editor_css" ) ); $style_css = 'spoilers/style.css'; wp_register_style( 'spoilers-block', plugins_url( $style_css, __FILE__ ), array( 'wp-blocks' ), filemtime( "$dir/$style_css" ) ); register_block_type( 'library/spoilers', array( 'editor_script' => 'spoilers-block-editor', 'editor_style' => 'spoilers-block-editor', 'style' => 'spoilers-block', ) ); } add_action( 'init', 'lp_spoilers_block_init' ); The JS Here’s the weird stuff. And I’m going to be honest here … I don’t understand all of this yet. But I picked this very simple example because it lets you see what’s going on in a concrete way. ( function( wp ) { var registerBlockType = wp.blocks.registerBlockType; var el = wp.element.createElement; var __ = wp.i18n.__; registerBlockType( 'library/spoilers', { title: __( 'Spoiler Warning' ), icon: 'vault', category: 'widgets', supportHTML: false, edit: function( props ) { return el( 'div', { className: props.className }, __( 'Warning: This post contains spoilers!' ) ); }, save: function() { return el( 'div', { className: 'alert alert-danger'}, __( 'Warning: This post contains spoilers!' ) ); } } ); } )( window.wp ); The CSS There are two CSS files. editor.css .wp-block-library-spoilers { border: 1px dotted #f00; background-color: pink; font-weight: bold; } style.css .wp-block-library-spoilers { font-weight: bold; } Back in the js there was a bit that looked like this: { className: props.className }, That’s what tells it to use these. In addition, I use this to call some theme specific code: { className: 'alert alert-danger'}, The Output On the editor, I see this: I included the block icon so you could see the little vault I used to indicate the block. On the front end, everyone sees this: What’s Next? Making it editable, of course! 8 May, 2018 When You Need Blocks There are a lot of cases where you don’t need a custom block. My spoiler block (from last week) is a great example of that: But. What about when you want to have that spoiler have choices? Now you’re outside the shared content block territory and into the confusing land of Gutenberg plugins. Blocks Are Not Simple I’m the sort of person who abhors boilerplate plugins. I just do. I feel that they divorce you from understanding what the code is and does, and how it all plays together. The more you rely on them, the less you can debug when it goes sideways. Oh, and it will. It always does. But. Gutenberg requires a lot more Javascript than I happen to be good at. Or rather, it requires new﻿ Javascript. Which is why I did exactly what I did the first time I ever made any plugin. I went and found one that did mostly what I wanted, and I edited it. Whaaaaat? It’s true. And I want everyone to take a moment and realize this is a perfectly normal, okay, thing! In fact, I would like to see Hello Dolly converted to include a Gutenblock because learning by example is a valid, tried and true, way to teach someone how things come together. What Examples Are Good? Okay so where is a good place to start? Modular WP: How to Build Custom Gutenberg Blocks Pantheon: Converting a Shortcode to a Gutenberg Block WordPress Gutenberg Examples WP-CLI Scaffold Block Command﻿ That’s enough to get you started, I think. I went with WP-CLI since I like it and I’m used to it. Of course, it came with a small problem. In order to make a block via wp-cli, you have﻿ to put the code in a plugin (or a theme). Well fine. I did that to scaffold it and then I moved it to where I was developing. Most people aren’t so particular. Is It Hard? Not really. Once you get used to editing the js file instead of PHP, it’s just like hacking any other plugin. Start with the simple thing. Make a block that just does one thing and isn’t editable. My one tip is that when you call your blocks, make sure to wrap it in a check if the function exists: if ( function_exists( 'register_block_type' ) ) { include_once( dirname( __FILE__ ) . '/spoilers.php' ); } Otherwise there’s a chance that a non-Gutensite will die on you. Good luck and happy Gutenberging! 3 May, 2018 You Don’t Need a Block Like a great many people, I recognize the need to learn the new world with Gutenberg and adapt my code as well as my writing to the platform. But, like a great many people, I recognized my coding ability might not quite﻿ be up to snuff with the javascript required for blocks. But then I asked myself something important. And you should ask yourself this, before you lament about how much work you have ahead. Do I need a new block? What’s a Block Anyway? The concept of ‘block’ writing is one people who use Scrivner may be familiar with. Or maybe if you’ve ever been a part of a writer’s room, breaking down a season of a TV show. The idea is that each index card is it’s own entity.’ Or rather, in the case of WordPress, each paragraph is it’s own entity. This means you can move the paragraphs around, which for paragraphs makes little sense. But for layout? Oh it makes a great deal more sense. A block is, literally, a block you move around until your page looks the way you want it to. Awesome. Why Don’t We Need Them? Actually the question should be when don’t we need them? Obviously we need blocks. That won’t change. But by default WordPress has quite a number of blocks out of the … block. And that begs the question of when and why do we need to make new﻿ ones? This is a question many developers who have shortcode plugins will be asking themselves, and the realization I stumbled across at WordCamp San Diego is that … a lot of developers don’t need to make new blocks! Because a lot of shortcodes aren’t actually going to be all that necessary in the future. Let’s use an example of something common… Example Shortcode: Spoilers Let’s say you have a WordPress site and it sometimes talks about spoilers. Today in WordPress an easy way to put a warning at the top of every page would be with a shortcode that looks like [spoilers] or if you’re feeling puckish, [spoilers warning="OMG SPIDERS!!!"]﻿ Those would output a simple paragraph that warned people about spoilers. Right away, I thought “Oh, that would be a nice, easy sort of thing to turn into a block.” It’s just a direct output of some code: <div class="alert alert-danger" role="alert"><strong>' . $warning . '</strong></div> But then I thought …. What if I don’t? Enter Shared Blocks Shared Blocks, formerly called reusable blocks, are blocks of content defined by each site, specific to the site, that are .. well .. reusable. You don’t need to know how to code to make them, either. Which means you don’t need a developer to do this. Start by just making a new block with the content: Warning: ﻿This post contains spoilers! That’s easy. But what we want is to apply color to it. And that can be done in a number of ways. The easiest would be to use the advanced section in the block editor and add an additional CSS Class of, in this case, alerts. But that isn’t the only way…. Because I can also make this: Whaaat? Total game changer! Gutenberg Blocks Are Editable In every single Gutenberg block you can change text and color to suit your needs. I edited that particular block and said I wanted the background to be one color, the next another, and I wanted the size to be Large. I’m aware the large size doesn’t show properly… I also told it how I wanted the block alightment to look: Okay, But Reusing? Don’t worry, I didn’t forget. When you hover over a block there are three vertical icons on the right indicating a menu. Click on the menu and you get options and one is to convert it to a shared block. Click on that, give it the name you want, and you’ve created a block! The share icon in the lower right is how you know. And now, when you go to enter a new block, you click on the plus button on the left, click on ‘Shared,’ and you have this: What’s Missing? Right away you’ll notice you can’t edit the shared block without editing it for everyone. So if you made it “Aaaaaahhh! Spiders!!!!!” everything would change. And that’s not great for everyone. But for a lot of people who just want a simple, repeatable, notice or signature, this is just fine. It won’t spare you having to convert some of your shortcodes to blocks, but it may make life easier for people who don’t want to have to use them in the first place. And that, I think, is a win. 26 April, 2018 ←Previous Page 1 2 3'''
year_published = 2018
year_updated = 2018
