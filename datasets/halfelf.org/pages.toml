full_description = "Privacy Policy Last Updated: 18 May 2018﻿ By using this website, you agree to the terms of service. You are welcome to use, reuse, and extend the data here for no fees. Terms of Use The following terms and conditions govern all use of this site, the content, services, and products including, but not limited to, the content on the blog. All services are offered subject to the acceptance of visitors, without modification, of the terms and conditions listed. By accessing and using this website, visitors accept and agree to be bound by the terms and provision of this agreement. In addition, when using this site, visitors shall be subject to any posted guidelines or rules applicable to such Services, which may be posted and modified over time. All such guidelines or rules are hereby incorporated by reference into the TOS. ANY PARTICIPATION IN THIS SITE WILL CONSTITUTE ACCEPTANCE OF THIS AGREEMENT. IF YOU DO NOT AGREE TO ABIDE BY THE ABOVE, PLEASE DO NOT USE THIS SITE. Liability of Information. This site and its services are offered for informational purposes only; this site shall not be responsible or liable for the accuracy, usefulness or availability of any information transmitted or made available via the site, and shall not be responsible or liable for any error or omissions in that information. Ownership of Subject Matter. This site claims ownership of all original content. All reasonable efforts are made to properly credit and attribute non-original content. DMCA and Copyright Infringement. By law all claimants are required to inform this site, and allow time for a reasonable response, before filing legal action regarding any claims to content found within this site. Complaints can be emailed webmaster@ipstenu.org – someone will reply within 30 business days. Note that per US law, by removing questioned data this site is protected from further legal action in most situations. Advertisements and Compensation. This site makes use affiliate links to promote products used, such as the webhost, themes, and plugins. Responsibility of Contributors. Visitors are responsible for their own comments and any content provides is of their own free will. Web Traffic. This site uses two third party services, Google and Jetpack Analytics, to measure audience and usage. Data and Privacy. Data is collected from all visitors, via 3rd party services. Visitors who engage directly with this site (such as leaving comments) will have more information collected as they provide it. For details, please continue reading. Protection of Information. This site takes all measures reasonably necessary to protect against the unauthorized access, use, alteration, or destruction of potentially personally-identifying and personally-identifying information. Data Collection Like most website operators, this site collects non-personally-identifying information of the sort that web browsers and servers typically make available, such as the browser type, language preference, referring site, and the date and time of each visitor request. This site also collects potentially personally-identifying information like Internet Protocol (IP) addresses. This information is not used to identify visitors, however, and does not disclose such information, other than under the same circumstances that it uses and discloses personally-identifying information, as described below. Comments: ﻿When visitors leave comments on the website, the collected data shown in the comments form, as well as the visitor’s IP address and browser user agent string are saved in order to help spam detection and monitor visitor abuse. Cookies: Visitors who leave a comment on this site may opt in to saving their name, email address, and website in cookies. These are for convenience so that they do not have to fill in your details again when they leave another comment. These cookies will last for one year (365 days). See also: Cookie Policy Mailing Lists: Visitors who chose to register for a double-opt-in email list will receive emails when new content on the site is published. This service is provided by Automattic (via Jetpack) and is subject to Automattic’s Privacy Policy. If visitors do not wish to be tracked then they should not register for an email subscription. Aggregated Statistics: ﻿This site collects and may share statistics about the behavior of visitors to its websites. For instance, it may reveal how many visits a particular page got. Personal information will not be revealed to the public. 3rd Party Services Third party vendors are used to provide additional services, such as spam protection, ads, and analytics. These vendors often use cookies to serve content (such as ads) based on a user’s prior visits to this website or other websites, as well as track visits. Visitors may opt out of these vendor’s use of cookies for personalized advertising by visiting www.aboutads.info or directly with the vendor via their website. The following services are used: Akismet Google Analytics and Adsense Gravatar Jetpack Analytics﻿ In addition, articles on this site may include embedded content (e.g. videos, images, articles, etc.). Embedded content from other websites behaves in the exact same way as if the visitor has visited the other website. These websites may collect data, use cookies, embed additional third-party tracking, and monitor interaction with that embedded content, including tracking interaction with the embedded content if a visitor has an account and are logged in to that website. Data Usage The purpose in collecting information is to better understand how visitors use this site. Retention: If a visitor leaves a comment, the comment and its metadata are retained indefinitely. This is so future comments can be recognized and approved automatically instead of holding them in a moderation queue. 3rd Party services retain data per their terms. Requisition: Visitors who have left comments on this website or contacted the site via a contact form may request to receive an export file of the personal data held, including any data provided directly. Visitors can also request that we delete any personal data held. This does not include any data kept for administrative, legal, or security purposes. Requests for data and it’s deletion may be sent to webmaster@ipstenu.org Policy Changes Although most changes are likely to be minor, this Policy may change from time to time, and in our sole discretion. Visitors are encouraged to frequently check this page for any changes. Any continued use of this site after any change will constitute acceptance of such change."
