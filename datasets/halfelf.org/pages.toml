full_description = "Tag: wordpress Plugins: Not Your Circus, Not Your Gold Mine My friend Andrea M. once told me “Not my circus, not my monkeys” about a problem that was outside her purview, and I liked it so much, I kept using it. I’m sure someone else came up with it, but that’s where I learned it. Perry (not his real name) had a big problem understanding when something wasn’t his business, as well as when to accept the L. Authors and Managers and Committers Perry had an interesting history. He started out by emailing Plugins to complain about the language used on WordPress.org plugin pages. Specifically, he didn’t like that the pages say “Plugin Author” and thought it should be “Plugin Manager” and his reason? Being authorized to commit code and release versions does not make a committer an author. Now, the plugin team didn’t agree. As Otto would say “If you’re not capable of writing the code, then you should not have access to change it for the users.” Perry … […] Moreover, the authorship claim that you are forcing on your benefactors kills inspiration. You are not allowed to impose your own rules on people committed to make WordPress usable. We’re not your slaves, not your servants, not your employees. We’re forced to contribute because WordPress is the only game in town, and most people are likely to not want to publish otherwise. I’m asking you nothing but to be consistent: […] In response you sent me lies. And added insult over injury. […] There was a bit of a laugh held over ‘slaves’ and Plugins sent back that (a) we’re not going to change it and (b) if you really want to die on that mountain, here’s a link to META TRAC where you can open a ticket. Perry sent back links to academic discourse about authorship and concluded: After reading these articles, you’ll be able to understand that a maintenance programmer is not an author. As it happens, performing maintenance programming on code, where authorship is conferred by … wait for it … writing code means the person is, in fact, an author. This was something mentioned in those links. All plugins said was basically “Thanks but no, here’s Meta trac, knock yourself out.” Perry replied with some legal brouhaha, and pity was taken asking “Dude, do you want to file a legal complaint or a request to edit?” He apparently missed the links to meta in the previous two emails, but then said Meta was broken. Turned out his browser was so out of date, it was banned by WordPress.org to prevent bots. But that seemed to mollify him. On to the Circus! Two years later… Oh wait, no, there were a couple more weird moments. In one, he was upset someone used his real name on the forums. That was totally fair and we did clean it up for him, but pointed out that you have to give the forum moderators time. We’re all volunteers, after all. Finally we get to the story. It began with him asking us to merge accounts. In general, that gets you a finger waggle and a talking to about why multiple accounts are stupid with you’re one person, but this one went off the deep end real fast. He realized that having two accounts that shared code might make him run afoul of taking code without credit (i.e. copyright violations). I was happy for that level of self-awareness and honesty! And he was right! That is a part of why two accounts is stupid. But … Perry went on to explain that he used to be a part of a plugin (fake name “Gold Mining”, I’m watching Gold Rush right now) and left that project due to ‘ethical reasons.’ Sure, I get that. I’ve done the same. I rage quit using a plugin when I learned the creator was angry WordPress had an ‘all female’ release (nb: That should have been an under-represented persons release, and they corrected the name in the second one, but that first one had a bad name). Perry’s email was mammoth and included layers and layers of quotes. Here’s what you need to know: Perry happened to be a support rep (not a developer) on “Gold Mining.” He emailed the people who actually owned the code to complain about how they ran things, and said he was going to work on other projects neener neener. The owner of the “Gold Mining” plugin accepted the resignation with a no-take-backies addition of “And if you aren’t quitting, you’re fired.” Perry accepted this, with a bit of vitriol . Perry emailed plugins to explain he was both AlsoPerry AND Perry, and his plugin was a legit fork and had code he write, he wasn’t stealing, but he was still helping out in the “Gold Mining” forum. Obviously his fork was closed because of confusion of above. If you’re wondering about the surprise of “his plugin was closed,” so was I. I looked into it and a reply was sent: Plugins literally does not give a shit about that interpersonal drama that happens in a group outside to WordPress.org (we do care if it’s people following others home to harass, but this was clearly not the case). Plugins has now documented he was both people, though, for his and our protection. If he really was fired/quit/left the “Gold Mining” project, walk the fuck away from their forums. His plugin was closed because he broke his email on his alt account and it bounced, which he actually knew! He replied with “Oh, I thought I was banned because of (all the reasons above) and not what you said.” And it went on for a long time … Okay? Who gives a shit. He could just say “That explains it, I’ll fix my email.” But no, no, it’s gotta be Dickensian. 1200+ words. Plugins closed that rant email without reply. But you’re getting the idea here right? Every. Single. Email is this long. Important note: See how plugins said to stop helping the plugin? Yeah, remember that. It’s important later. Oh and he never fixed his email so his plugin remained closed. Stop Poking the Bear Another 18 months or so have passed. I’d forgotten about this whole mess because, after all, I was processing hundreds of tickets a day, and anything that wasn’t active within a week fell out of my head. But also I kind of assumed he’d properly realized “I owe Gold Mining nothing!” and moved on. Oh. I can delude myself sometimes. Otto calls me an optimist. Perry emails and asks if we can transfer his version of the plugin from AlsoPerry to Perry and reopen. And I started to think “Sure, why not” and read the rest of his long email, which explained he was still helping out in the original “Gold Mining” forum and answering PRs on their GitHub! I wish I’d never taken psychedelics, I’d never drunk coffee and cocoa, I’d made no mistakes, and I’d always got at least one verse of the Bible each day. I would be very sad if I never had cocoa or coffee again, but to each their own. Plugins Team checked out the plugin, saw it was a 100% copy (not a fork) and explained that no, Perry, you cannot have it back unless you make it a real fork. Perry explained he didn’t have the technical chops to do that but we should let him have his own version anyway. The answer was no. So then he asked if he could have the original “Gold Mining” plugin, which the original authors (who were not him!) had closed on their own a few months before. Oh and he felt like a failure because it was closed. Our reply? No, you cannot have someone else’s plugin without their permission. Sometimes we’ll hand it over, but in this case it was patently clear the original owners didn’t want Perry to have it. The plugin was closed by the owner, we always respect that. “Gold Mining” was not Perry’s plugin. It never was. He never committed code, he never wrote a single fucking line. It was. Not. His. There was nothing Perry had done that was a ‘fail’ (except continuing to help in a place he knew he wasn’t wanted, and that was really only a ‘fail’ because he was hurting himself). Three days of emails followed. There was a weird claim that the original owners were asking Perry to support, and we asked if that was really the case. If so, we would go hit them with a fish on Perry’s behalf, because that’s abusive. But it transpired that no, no one had asked Perry to do anything at all, he just felt obligated. See I was stressing that we wanted to protect Perry. Right now, though, we had to protect him from himself, and he really kept hitting himself. The Catholic Guilt on this guy was massive and I couldn’t figure out how to get him to understand that the plugin was not his, and he needed to walk away for his own sanity. Perry replied with a Catholic Guilt ridden EPIC length email with quotes from emails years past which boils down to: The Original Owner was doing this from revenge (‘this’ being leaving Perry’s access as a support rep – I removed him to settle that matter). People still used the plugin (… yes? That happens). Perry was obligated to help those people (FFS NO, how many times do we have to tell him this?). Perry didn’t even know he was still a support rep until we told him in December when we had removed him. Plugin closures can be reversed (yes, but not by someone who quit/was fired, buddy). “So everything I do for [Gold Mining] now is both a sacrifice and a punishment.” (… God is in the tub). Plugins repeated “Walk. The fuck. Away.” It’s Monkeys All The Way Down A lot more emails followed. Like a lot, a lot. Perry kept arguing he had commit access and, in fact, I found out he did have access … five years ago. His access had been removed at least three years ago (we didn’t track plugin access being removed at the time). He also argued his removal was a mistake. Since all the devs were removed a day before the plugin was closed (by the owner, remember), we told him no, it was not. Clearly the owner knew what he was doing. Perry sent a lot more bible quotes. Finally he got an ultimatum. Perry was not permitted to host any plugin even remotely related to “Gold Mining” Perry was not permitted to post in the original “Gold Mining” plugin forums If he attempted either of the two, he would be banned. And that, my friends, is when it ended. He didn’t reply to that ultimatum, but at least he stopped emailing us daily. 28 February, 2024 Piracy and the GPL Sé and I go back a while, so when she asked me if I’d like to come on WPwatercooler and talk about Piracy and the GPL, I said sure! I’m including the video at the end so you can see the whole conversation but … What got me interested was that she didn’t ask me about what I thought she would! The Hill I Die On Is Theft I always get people pissed off when I say this, but you absolutely 100%, without question, can steal GPL code if you mess with copyright law. I even went and asked ChatGPT for some fun: It would be considered unethical and potentially illegal to take GPL-licensed code and release it as your own work. The GPL requires you to respect copyright laws and the rights of the original authors. By claiming GPL-licensed code as your own without proper attribution or acknowledgment of the original authors, you would be violating both the terms of the GPL and copyright law. The GPL allows you to use, modify, and distribute the code, but it also requires that you maintain the integrity of the original license and give appropriate credit to the original authors. Failure to do so could lead to legal consequences, including potential copyright infringement claims. It’s essential to adhere to the principles of open source licensing and respect the contributions of others in the software development community. I expected the chat to be about that. It wasn’t. It was about the lovely grey area I spent a decade and a half in. Piracy is/n’t Theft The crux of Sé’s question was this: Is it piracy to get a copy of a premium plugin (one you have to buy to get) from someone else. The initial answer is ‘yes’ but then Sé laid out some amazing nuance. She’d already bought the code before She couldn’t buy the upgrade because the devs are in Russia (and sanctions) There was a workaround to pay an intermediary, but she felt it was sketchy She intended to migrate off the plugin, but needed the latest version to do so Someone she knew offered to give her a copy of the latest version Now, I worked for a bank before WP, and I can tell you that her workaround is what you do when you launder money. And if you did use that workaround, you run the risk of ending up on the FBIs sniff-list and they do not have any sense of humor about ignorance of the law. So now, would I still call it piracy? Actually … yes. I would. But it’s small scale and not actually a huge issue and really depends on the intent of the person who gave it to her, and what Sé did with it in the end. The Scale of Piracy There’s a constant battle going on between consumers and corporations. I’ll use an example close to my heart. The TV show Willow was a fun fantasy romp with silly flashbacks and messy magic. It wasn’t perfect, it wasn’t the greatest thing ever, but it was fun. Shortly after it got mid-to-low reviews, it was removed from streaming. There is no way to watch the TV series, except for piracy. Is it piracy if I had managed to download the videos beforehand and kept them for my own entertainment? Yes. Yes it would be. The same as how all of our mix tapes were technically piracy. Mixtape artists have been arrested under RICO charges for that! But the reality is that no one was going to waste time and kick in your door for making a mixtape and giving it to your sweetheart. They didn’t really care that much about it (and in some cases, like The Grateful Dead, encouraged it). It was incredibly hard to make money off mix tapes. I made copies of a CD I had bought in high school for friends, never sold ’em. Then came the internet and suddenly I could copy that CD into files and send them across the world! And you know what? People did. Suddenly the scale of what could be done with a pirated copy of a CD had skyrocketed. Obscure Monetization I pause here to quote from Cory Doctorow’s interview back in 2010, when he was asked why does he give all his books away for free? I give away all of my books. [The publisher] Tim O’Reilly once said that the problem for artists isn’t piracy – it’s obscurity. I think that’s true. A lot of people have commented: “You can’t eat page views, so how does being well-known help you earn a living as a writer?” It’s true; however, it’s very hard to monetise fame, but impossible to monetise obscurity. It doesn’t really matter how great your work is; if no one’s ever heard of it, you’ll never make any money from it. That’s not to say that if everyone’s heard of it, you’ll make a fortune, but it is a necessary precursor that your work be well-known to earn you a living. As far as I can tell, these themes apply very widely, across all media. As a practical matter, we live in the 21st century and anything anybody wants to copy they will be able to copy. If you are building a business model that says that people can only copy things with your permission, your business is going to fail because whether or not you like it, people will be able to copy your product without your permission. The question is: what are you going to"
