title = "Shortcodes vs Blocks - Half-Elf on Tech"
description = "Thinking about blocks vs shortcodes and what's coming next."
full_description = 'Shortcodes vs Blocks Written by Ipstenu (Mika Epstein) in How It Works One of the things that Gutenberg changes for everyone is the concept of shortcodes not being absolutely necessary anymore. Shortcodes Today One of the nice things about WordPress is that we can use shortcodes to insert dynamic content into our posts. For example, I could use [ copyright ] and have it echo © 2025. And when you have inline dynamism, that works great. One of the other cool things you can do is to have an embed like [ embed height="400" width="600"]...[/embed ] to embed a video: Yes, you could just paste in the video URL, but this is a demonstration of a shortcode as a sort of block. And speaking of blocks… Blocks Tomorrow In Gutenberg (which this post was written with), you can keep using in-line shortcodes and even add a shortcode as a block: To a degree, that works well. But there are other options with Gutenberg. Sidebar Edits First, you can see this in a normal paragraph block. Adding options to the sidebar: This allows you to edit the various options on the right sidebar and, thus, change the customizable aspects of the block. For many shortcodes, you can keep that interface and have everything be perfectly functional. Have a block that shows user information? Put a dropdown for the users on the sidebar, and so on. Inline Edits The other options is an integrated block. For example, here’s my example of a review block, with text fields and dropdowns to allow you to edit in situ. In my opinion, this is a more fluid interface, as you can see example what you’re doing and what it’s going to look like. How Will You Use The Future? There are still hurdles to overcome with Gutenberg, but as we step forward, we’re getting a better look at an integrated editor that gives you a lot of that desired ‘What you see is what you get’ experience. gutenberg wordpress ←Gutenberg Spoiler Blocks Redux Selective DeGutenberging→ More posts Cookie Consent on Hugo 28 February, 2025 Replacing the W in Your Admin Bar 14 February, 2025 Editor Sidebar Madness and Gutenberg 11 December, 2024 Small Hugo, Big Images 21 October, 2024'
