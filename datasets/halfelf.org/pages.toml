title = "Harassment by Way2Enjoy - 2019 - Half-Elf on Tech"
description = "January In January Mr. Tiwari resumed emailing with a new story. Now he had a day job in service/manual labor (from 10am to 10pm) and had learned some humbling things. He also claimed to be fiscally responsible for his hitherto unmentioned 8 siblings (previously only a sister who was getting married was mentioned), his mother […]"
full_description = "Harassment by Way2Enjoy – 2019 The Saga of Harassment by Way2Enjoy: Home | 2018 | 2019 | 2020 | 2021 | 2022 | 2023 | 2024 | 2025(Last Updated 12 January 2025) Table of Contents January Contacting the US Congress and Senate Further Blocks Cessation of Communication by Plugins Charity Work DreamHost Threat to “damage you maximum” February March Another Delivery Twitter Another New Plugin and Bribes Threats Again Quitting April Cease & Desist May – June Another New Account Legal Notice August – October November December January In January Mr. Tiwari resumed emailing with a new story. Now he had a day job in service/manual labor (from 10am to 10pm) and had learned some humbling things. He also claimed to be fiscally responsible for his hitherto unmentioned 8 siblings (previously only a sister who was getting married was mentioned), his mother was dying because of the stress, his ex wasn’t talking to him, and he needed a loan from Mrs. Epstein for $10,000 USD. Unsolicited advice on how to run LezWatch.TV also persisted and new protections were put in place. Contacting the US Congress and Senate Next Mr. Tiwari emailed Alexandria Ocasio-Cortez (the US Representative from New York) for help, claiming he was a law-abiding citizen who needed help having his plugins restored. He went on to email multiple unrelated third-parties, including the NY Times and informed the Plugins team: I tend to bring wordpress.org for hearing under Congress and do whatever you want and remember as of now I am following legal route only. If you tend to damage my reputation, I have also plenty of ways to handle your arrogance. He raised the bar with ‘legal threats’ and claims that he would bring WordPress up to Congress for this. After cc’ing the plugins team on 14 separate such emails, he informed he would keep emailing them, but stopped cc’ing. His emails, which were all very similar in tone, expressed the following: That Mrs. Epstein can transfer ownership of any and all plugins to herself That there is no ‘law’ that permits a plugin to be closed if the violation was in another plugin That there is no ‘law’ that permits a website to moderate content That it is against the law to not permit someone to edit their own content That it is a conflict of interest to allow someone who has their own plugins to govern others Requests to meet in person (should Mr. Wood or Mrs. Epstein come to India) persisted, as did requests for video chat. All were ignored and blocked. Further Blocks Mr. Tiwari continued to cyberstalk Mrs. Epstein on Twitter, following her and emailing regarding various tweets under the mistaken assumption they were about him. When she tracked down his new twitter account and blocked it, she also reported it for harassment (which as the harassment was outside Twitter, there was nothing they would do). He retaliated by making three new emails with mail.com and blasting the plugins email. Again this behavior was reported to mail.com. He also rage-deleted the twitter account, however Mrs. Epstein had to do another purge of all possibly suspect accounts who followed her. In the course of those emails, Mr. Tiwari claimed he’d tried to call Mr. Mullenweg, ‘threatened’ to tell his former employees to email en masse to complain, and asked if the plugins team wanted him to go to jail. I am giving your email address to my guys as they are forcing me to email you again and again and i am unable to give them proper reason for removing them. Again, Mrs. Epstein never provided her personal email addresses. There were implications of how Mrs. Epstein’s life would end in suicide or murder: Now you thinks that you twitter friends will get fun with your tweet but very very few will come forward when you will be in problem. and we will be one of them. Anytime you need help. Now you dont need but time is very powerful noone knows what will happen Saddam Hussain never thought that he can be hanged Hitler never thought he has to commit suicide Gadaffi never thought that he will be killed by rebels TIME IS MORE POWERFUL THAN ANYONE ELSE YOU THINK YOU CAN HARM US, YES YOU ARE RIGHT BUT THIS IS YOUR TIME AND WHEN OUR TIME WILL COME WE WILL NOT BEHAVE LIKE YOU. WE WILL BEHAVE LIKE MATUTRED PERSON YOU ARE BEHAVING LIKE KID. Mr. Wood replied and repeated that all anyone wanted was for him to leave them alone. This was, again, untenable to Mr. Tiwari. Cessation of Communication by Plugins As of January 17th 2019, it was determined there would be no further attempts to reason with Mr. Tiwari and all emails would be filed and/or blocked. There would be no replies to his email, and all email would be filed and ignored. Prior to this Mr. Wood had been, occasionally, asking him to stop. Around this time, mail.com banned the IP used to create the harassing email addresses. The company cautioned that Mr. Tiwari would just use another IP, which he did in order to make more emails, which were in turn reported. The next day he moved to protonmail, presumably because mail.com banned him. This was reported to ProtonMail.com however based on their entire raison d’etre, this was determined as unlikely to bear fruit. ProtonMail never replied, however emails from Mr. Tiwari via their services soon after ceased. Following that, Mr. Tiwari continued to email, though at a slower rate for no discernable reason. He continued to argue that because of Donald Trump, they should be permitted back, but also now asking if they could reproduce HalfElf.org posts on their site (there is already a license – https://halfelf.org/get/license/ – which says not for commercial sites, which Way2Enjoy.com would be). With yet another new email account, he explained how he found a way around the blocks to SMS his ex fiance: i sent sms to my fiancee through some online website as she has blocked me in whatsapp, call and sms through regular means and requested her to unblock in whatsapp. she unblocked. then i said hi, she replied hi. then she asked ur plugin issue solved?? i said no again blocked This later established a pattern of harassment with multiple people. In addition, he took photos of unsuspecting people on his transit, sending them to Plugins and claiming they were ‘aflicted with the transgender condition’ and resorted to begging for money. It’s assumed he did this because of Mrs. Epstein’s work with documenting queer television media. Charity Work Starting January 23, following another ‘threat’ to purchase a domain with the intent of ‘helping’ Mrs. Epstein’s personal project (LezWatch.TV), Mr. Tiwari turned to self-proclaimed charity. His initial claims that he was unable to worship at a temple until he was allowed back in the directory led him to believe that the correct solution was to donate blankets to the poor and homeless. While he misunderstood the size of the United States, he also read the initial lack of response to his proposal (re the blankets) as ‘laughing’ at him, because it got to -22 in the US that week. He also accused her of murder: If We are harasser as per your logic then you are murdere as you have killed livelihood of severals. […] So if we are harasser you are murderer and curse of 50 people is always with you for wrongdoing and remember when you drive, you can control your driving ut who is coming from behind or front and what is his status whether he is fully drunk, driving after boss firing, or wife firing or anything and how cool or distur he is not known to you but everything knows to god. You have disrespect the Lord Balaji and Lord Shiva, You will get hardest punishment in coming days. I have visited 15 times to Lord Balaji and know his power well and soon you will realise. The chosen charity work was to deliver blankets, though he made sure to stress how much of a hardship this was for him. Earlier claims by Mr. Tiwari included that his own physical condition was poor, and his leg and back prevented him from laboring. Also that he had no money to survive and help his family. Mr. Tiwari provided video ‘proof’ of his actions that did not prove much of anything at all. Following that, he decided god would tell him when to stop donating, and thanked us for the opportunity. He insisted this had nothing to do with his request to be unbanned, however he emailed immediately after saying if Plugins un-banned him, he would have more money to give away. DreamHost The very next day (24-Jan) Mr. Tiwari both accused Mrs. Epstein of murder, cursed her again, and then sent an email implying he’d mailed her a ‘Sorry’ card from Hallmark. Later that morning he attempted to contact her via DreamHost’s company chat and ticket system, at which point Mrs. Epstein escalated to her internal legal team. In reviewing those logs, it became evident he claimed to have physically mailed a card to the DreamHost offices. This drastically altered the credibility of any threats made. Emails continued to plugins after this, a variety of love songs and an attempt to frame Mrs. Epstein as being the one who is doggedly pursuing vengeance. In those emails, Mr. Tiwari made the following claims: That because few people (i.e. forum moderators) saw his misbehaviour, it’s okay and doesn’t count. That the fault is on WordPress.org for punishing the misbehaviour of an 18-year old employee who, unsupervised, used his account. That Mrs. Epstein wanted him to get 1-star reviews. That being banned is forcing him (and his company) to become criminals. That none of Mrs. Epstein’s friends would ever tell her she was making mistakes. That being banned prohibits him from attending prayer at his chosen temple. That Mrs. Epstein is physically ugly due to her lack of forgiveness. Precautions were taken at the DreamHost offices and systems. Threat to “damage you maximum” On January 25th, Mr. Tiwari claimed Mrs. Epstein had reduced his plugin ‘active user’ count to zero by editing the database. Mrs. Epstein has no database access on WordPress.org, and at best she could edit the values in WordPress, but they would re-set after 4 hours or so which would be pointless. However closed plugins no longer display user count as part of an attempt to prevent abuse by developers. This course of action was over the line, according to Mr. Tiwari, and he threatened to harm Mrs. Epstein’s reputation: I will damage maximum and you will be responsible as i begged like anything for 65 days and unethically you changed my active install count for both plugin to zero and you will be loser. The name you have made in 15-20 years time you are ruining with your anger. The deadline to restore his plugins was given as Wednesday, January 30, 2019 3:27:25 PM. On Tuesday the 29th, he walked back on this threat, however he also blamed the Polar Vortex on Mrs. Epstein, and the wrath of his god. February Beginning February, full details of each email to Plugins were no longer being recorded unless they were of significance. The gist remained the same: Mr. Tiwari was sorry, he begged for one more/a second chance, his mother was sad, we have destroyed his life. This is also when Mrs. Epstein’s father passed away unexpectedly. Mid-month Mr. Tiwari announced his former fiancee was getting married to someone else, and the wedding would be on Feb 27th. On Feb 23rd, he asked to come to America and meet Mrs. Epstein for 15 minutes in March. The likelihood of him acquiring a Visa was determined to be low based on his economic situation and intent, as the U.S. State Department was enforcing stricter visa requirements at that time. Around this time, Mr. Tiwari brought to light the fact that he used to compensate reviewers with free credits. That was another guideline violation (such behavior is considered to be bribery and it is prohibited to compensate people for reviews). Starting in October of 2018, he explained that he had offered 1000 credits for a review, which explained why he had such a strange number for such an ill used plugin. In accordance with WordPress.org guidelines, all reviews were closed and removed. As of February 27th, he claimed that he would come to the United States immediately if he was unbanned. The implication is that if he was unbanned, he would be able to stop his ex-fiance’s wedding to someone else, and thus marry her. Following that he would come to Los Angeles to “touching ur feet (this is the way we respect our elders/gurus) and seek ur kindness on us” – This was reported to DreamHost, as the only LA location Way2Enjoy might know for Mrs. Epstein would be the LA offices. Again, the email was not replied to. On average, 20 separate emails were received each day throughout the month. March On Friday, March 1, Mrs. Epstein took her account private for a few days and used the time to block all suspect accounts going back to 2016. Starting with when she went private on the 1st, emails ceased. There was an email wherein Mr. Tiwari said he wanted to follow her on Twitter: respected madam, i m least interested in following u i am doing so because i need ur blessing back. Please unban or allow to publish new plugins so that i get something to engage myslef. now my only work is to please u so i keep thinking everything possible which can help me convince u. now my fiancee is also not there so now i am more alone Then he sent a final email with a photo of three children, saying these mysterious children (who had never been mentioned before or since) would be unable to attend school. On March 7th he created a new user account on WordPress and resubmitted his optimizer plugin. The account was banned and the plugin rejected without comment. Subsequently, he emailed 9 times, offering to send flowers to her office as well as come to America on April 11th, to meet with Mrs. Epstein. None of these emails were replied to, however as he was using a new gmail account, Gmail’s guidelines were checked. Per Google’s Gmail guidelines: Don’t create or use multiple accounts to abuse Google policies, bypass Gmail account limitations, circumvent filters, or otherwise subvert restrictions placed on your account. (For example, if you’ve been blocked by another user or have had your Gmail account disabled due to abuse, don’t create a replacement account that engages in similar activity.) This meant a second account like that was a clear violation of Gmail’s guidelines, and was reported. Another Delivery On March 8th, Mr. Tiwari claimed he was sending flowers to Mrs. Epstein. It was presumed he meant her office, since he did not (and does not) have her home address. The appropriate people at DreamHost were notified, since while it was unlikely to be true, it was better to be safe. His claim: However i have chosen this. You will be receiving this on Monday. i have chosen one dozen rainbow roses so that atleast one rose u like andpardon us (Link) Then Mr. Tiwari claimed he was going to come to the US on April 11th. Here is my flight for USA but i wont get visa untill u allow to meet u. if u would have accepted apology through SKYPE or email that would be great but i"
