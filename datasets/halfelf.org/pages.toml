description = "As Mrs. Epstein left Twitter at the end of 2022, Mr. Tiwari had been silent on most WordPress matters for a few months. He did begin the year complaining to people who liked Tumblr, repeating the disinformation that Tumblr was for porn. February On the 18th of February, the postponed (pre pandemic) WordCamp Asia finally […]"
full_description = "Harassment by Way2Enjoy – 2023 The Saga of Harassment by Way2Enjoy: Home | 2018 | 2019 | 2020 | 2021 | 2022 | 2023 | 2024 | 2025(Last Updated 12 January 2025) As Mrs. Epstein left Twitter at the end of 2022, Mr. Tiwari had been silent on most WordPress matters for a few months. He did begin the year complaining to people who liked Tumblr, repeating the disinformation that Tumblr was for porn. Table of Contents February March April May June – December February On the 18th of February, the postponed (pre pandemic) WordCamp Asia finally took place. Per usual, Matt’s appearance was heralded by asking people for AMA (ask me anything) questions for his talk. Mr. Tiwari replied twice: While Mr. Tiwari claims to have had recent rejections of plugins, to the best knowledge of the team, there have been no new submissions from him. This suggests that, even if he did submit, the rejections were solely on the merit of his submission. His second tweet was a follow up: “Sort of stubborn kid” indeed. But, more or less, relatively quiet. March In March, Mrs. Epstein announced her impending departure from the plugin team, and this apparently was unnoticed by Mr. Tiwari as he concentrated on #wp20: His followup reply was less pointed at plugins: Who has created this logo?? If u would have paid someone 5$ at fiverr they would have created much better logo. I know u guys don’t take feedback positively so its ur wish but ask anyone. The logo u r showing any 1st standard kid will create better. April In April, most of Mr. Tiwari’s complaints were over things like an exploding birthday cake and being banned by WhatsApp. As evidence in the screenshot, Mr. Tiwari again says he was given “no reason” for his ban. For some reason, he has also begun DMing people. May WordPress turned 20 on May 27th. As part of the pre-birthday celebration, Automattic tweeted On the 27th itself, he went on a tirade of single replies to WordPress’ birthday post: June – December In between posting praise to Mr. Mullenweg for his travels, Mr. Tiwari also posted complaints: Again, he demonstrates a confusion about what is WordPress.org and what is WordPress.com. He also shared unsolicited (and weird) advice. At some point, he told Google he had a ‘fix’ for a massive security bug in Google Maps. That tweet was ignored."
