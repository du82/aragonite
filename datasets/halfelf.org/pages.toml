full_description = "Author: Ipstenu (Mika Epstein) Plugins: Stealing The Butt (vulgar) Note: This post contains foul and abusive language. Alex (fake name) is a weird one. Alex submitted a plugin and their email was sending auto-replies, so we flagged them for that. Their plugin was also missing a readme and they failed to escape code. Three annoying but small issues. That was March. No reply came, so they got auto-rejected in June. We Made Changes A couple more months pass and Alex has ‘made changes’ and replied: We made some changes to the code but our plugin is identical to a competitor that is approved in your community which doesn’t make much sense to these changes since the other one was approved. Now, I will admit, I missed the ‘identical’ the first time but for what it’s worth, that is incorrect. The competitor escapes the line in question. But more to the point, Alex had a hell of a time replying to emails. We’d send, it’d auto-reply, we’d ask them to fix it. On and on. Finally they got their head out of their ass and explained it was Brazilian law to have that autoreply … for customers. Ah! Well we (Plugins) ain’t the customer, this is a DEV relationship, please change the email and off we go. Except … they then tell us they copied the code and rebranded it and they said we probably can’t host the code. Can You Steal Open Source? People hate that I call it theft. Suck it up, butter cups. If you take someone else’s code, put your name on it and make no other technical changes, and present it as your own original work, you stole it. I will die on that hill. Now if you take their code, alter it, add new features, improve it, re-design it to use modern PHP practices, convert it to React, etc? Hey! You forked it! Congratulations! Slap a copyright addition to it, crediting the originals, and we’ll host your code! But no, it’s easier to take someone’s work and claim it’s your own, and when you do that, I hate you. You stole their work. You lied about it being your original work. Fix It and Improve It Anyway, Plugins agrees “You’re right, we cannot host copied code” but we did not reject the plugin since there are ways around that (see above). We also pointed out they had to fix the security issue. ok thanks, I don’t intend to put my plugin available for download in this shit library. […] fuck man, you need to learn a lot to get along with people and even learn to read. That’s not to mention talking, which is something you don’t really do. Okay, let’s try to explain– Wait, another email? I didn’t steal anyone’s code, I’m not a thief, if you consider yourself your personal problem. Learn to read and talk to people, you don’t know if you want to talk. I repeat, you are a disgrace to the wordpress community. Okay well lets– What? AGAIN!? In less than 60 seconds!?! About their code, you idiot I downloaded it now and took this screenshot to send to you. Dumb, don’t bother if you want to download the plugin itself before saying false things and accusing people of what they don’t know. Fuck you man you are very dumb and again we are ashamed to have you representing the community. There was no screenshot. But if there was, it would have pointed to the original, which was escaped. Badly, but it was escaped (they used esc_attr instead of esc_url, which was a different matter). But at that point, three emails in under 2 minutes, he’s lost his blob. So the reply was “We wish you the best of luck, but we will not host your code.” and then into the auto-bin, but not before he got in one more: Fuck your ass, I’m not asking you to host my codes. You idiot, human garbage. Learn to talk to people you fucking nerd You first. How to Fork Like an Adult If you see a WordPress plugin you like that’s been abandoned (or just went in a stupid direction you hate), I strongly urge you to fork it. And the steps are really simple. Copy the version of the plugin you like Rename it and add your name as an author (add!) Make technical changes to the code – this can be a whole refactor to Namespaces and React, or adding in a feature that you cannot do in another way (caveat: If you can make an add-on plugin that does the feature, you’re better off doing that) Build a check so that your new version and the original being active at the same time won’t crash a site Update the readme to explain you have forked it from the original and list all the changes Update the copyright and add yourself on to it That’s really it. People often miss step 4, but they only really fight about steps 3 and 5. The other thing, if you’re called out on making a copy of a plugin, just fess up. There’s nearly always a way through that, but it has to start with you being honest. And yeah, I know how much someone hates hearing that their 100% copy of someone else’s work is theft, but I have never found another way that sufficiently slammed the idea into their heads about how much damage they’re causing and how much they’re hurting someone else. Taking someone’s work without credit hurts them. It devalues their work and elevates yours unfairly. It also takes away their recognition which will only hurt them if they later use their work to try and get a job. This is one of the huge risks with AI, since it wasn’t built to credit (I would find it so cool if it did). So please, be honest when you copy code. 9 April, 2024 Plugins: How Not To Report One day, we got a weird email from Dexter (not his real name). Am I allowed to release my POC in an hour? It was reported and my report was given n/a. No one is taking any notice to it so I assume it is safe to share and help others. That was, literally, the first email we got. We replied and asked “What PoC?” (PoC means “Proof of Concept” in this case, and it’s expected that if you report an issue, you explain how you found it and how to reproduce it as … proof … of the concept of the issue). We stressed that we had not received any other emails from him, so could he please explain. We also mentioned that asking for a reply in an hour is not acceptable for anyone, especially when you don’t know what time-zone people are in. The rest of the email was the boilerplate “Here’s how you file a security report for WP and here’s how you do it for a plugin.” My Bad, I was Helping Dexter… You see my actions as wrong. Sorry. I was trying to help. Has been a few weeks. Not making excuses but now you explained I understand, on the other side of the fence things are not as clear as that. I also have a thing where if I do not write things down I will eventually forget them. This is extra tough as I try not to keep information of vulnerabilities. However, it is my intent to do right. Believe it or not but, you are one of the only people who actually try to help educate me. Even though you did not have to. I was trying to get a CVE but I do not know the relevance of the issue. I originally thought it was WordPress then was told about plugins. The website owner is unresponsive. Trust me, I submit about 500 reports a day. They always unresponsive. I am not sure if you still want me to communicate with you or if you prefer me to leave you alone. Thank you for reducing my ignorance, either way. While I’m sure he submits a lot of reports, this was (again) the first time he’d ever emailed Plugins. And notice that he still isn’t saying anything about this report? So we asked again, what freakin PoC?!?! (nicely) and he replied in four emails with screenshots and this was the PoC: It is for thishttps://developer.wordpress.org/plugins/javascript/ajax/ https://codex.wordpress.org/AJAX_in_Plugins It was not on wordpress.org. Since the issue is down to the php code, I am not sure who is responsible for it. None of that is a PoC, for the record. That email looks like a comment about a security issue with WordPress, right? But via the screenshot of the webpage (not a link, he sent a fucking screenshot!), I was able to figure out this was from a CVE about the Ajax Load More plugin and looking at the CVE … it was already closed. Per [URL], the issue is resolved. This means there’s nothing for you to report, unless you’ve found something else. And if you have, you need to unpack what’s in your head and tell us what you found. If you’re just telling us that the vuldb site reported on an issue, then please make sure their site is NOT saying the issue was resolved. We don’t need to know about those, as they’ve already been handled. Oh and there was no issue with the codex, it was just documentation. Dexter replied “One of the targets I tested on says they are using version 5.1.9.” and frankly that sucks but it’s not our responsibility. The plugin was fixed, the fix was released, and if some dingleberries didn’t update, that’s on them. He then claimed the fix wasn’t in the 5.3.1 version. You know, the version known to be vulnerable? Yeah, it didn’t have the fix. The next version has the fix. As documented. If a PoC Falls in the Forest… Next, Dexter sent a report and here’s what his PoC looked like:  Not a joke. The text file was just that. We asked if he sent the wrong file or it was encrypted, and he claimed we were idiots for not understanding that. Again, we asked him to give us an actual proof of concept, where he walked through how he found the bug and identified it. Instead, he linked to more and more sites that had been hacked, as if that proved anything. Since he’d linked to sites with the parameters used to ‘hack,’ I was able to track down the actual plugin with the issue and … drum roll … it was already fixed! Two years ago. So Dexter decided to ‘prove’ it was a problem by finding people with the old versions of the plugins (bear in mind, every single plugin he reported had already been fixed) and attacking their sites and crashing them. That’s how someone sues your ass, by the way. NEVER ever try to test a hack on someone else’s site! Besides being bad-form, if you break the wrong site you can find yourself at the bad end of a legal mess. Proof of Concept Means You PROVE how it works We tried to explain again: The issue is you handed us an incomplete PoC without the explanations and expected US to do the hours of work to try and guess what you meant. Just by looking at that URL: example.com/wp-admin/admin-ajax.php?action=formcraft3_get&URL=http://127.0.0.1:8080 We see how it says formcraft3_get — That means a specific plugin is required to even make this possible. That issue has already been resolved and was confirmed here: https://wpscan.com/vulnerability/b5303e63-d640-4178-9237-d0f524b13d47 If you’re not testing the latest versions of WP (which you already mentioned) and the plugin, then it is an invalid report. If you are not updating WP and the plugins, of course you have a high risk of vulnerabilities, but it’s incorrect to claim these are ‘new’ (other people have already reported), and since they have all been fixed then you just have to update your site. Since literally every single report you claim to be an issue has been fixed, we have nothing to do here. He replied ‘okay’ but then kept attacking sites to prove it. After he replied this: I don’t know what you have to do but I am convinced something needs to be done. I am genuinely trying to help you. You just have to accept that you may be wrong here and need to do something about it. There are a vast amount of people looking to use the exploit. You have not advised your customers from any of the links you showed. No offence but, your work around sucks too. It is like you do not assume an attack will do any recon. I gave up, and flagged him as ‘quarantined’ which is where we put people who are well meaning, but cannot be helped. He’s right in that people are looking to attack sites, but if the fix is available and people don’t use it, the only think the plugins team might be able to do would be force an upgrade. We only do those under exceptional circumstances, which none of these were. Dexter’s still running around, being a serial ‘hacker,’ and I’ve no doubt one day he’ll really get himself into trouble. 26 March, 2024 Plugins: WordPress Owns The World A self-proclaimed security expert came to Slack one day to complain about plugin security. The summary of Kareen’s complaint (not her real name) was she firmly believes that WordPress and WordPress.org are responsible for preventing brute force attacks on users. Now, I’ve said this a lot. Brute force attacks are best protected a layer above your website, with a firewall. Preferably the firewall is something the host does. But Kareen also claimed she had proof about issues with specific plugins, hence my involvement. She came to Slack because she’d posted in the forums about security issues and was asked to please come to Slack and talk instead. That’s the norm. Like a great number of people, she took umbrage at that and ranted about the FBI and Dark Ops and Mitinick (remember him!?) and … well. Yeah. Why NOT In Forums? Why don’t we want people to talk about security in the forums? The answer is simple: They’re public. If you post about a security issue, in public, instead of privately contacting the people involved, you are increasing the risk. Hackers (or rather, kiddie scripters) scan the WordPress.org forums for evidence of security issues and use that to blast everyone and try to hack sites for lulz. And they will get on the hacks before the plugin (or whatever) devs can get a fix out. So, to be responsible and reasonable, you privately contact the developers, give them some reasonable time to fix things, and everyone wins. There are some notable shitheads who refuse to do that. As my buddy Jan says, “We’ll keep shooting the employees until moral improves.” The Right Place and Time I redirected Kareen to where to report security issues for Core and Plugins. I foolishly assumed that would be enough. Kareen emailed Plugins with a couple word docs, one of which was a complaint about the forum moderators (which was ignored) and the other was about how brute force attacks happened on websites, and people were hunting for plugins she didn’t even have on her site. I call that ‘Tuesday.’ My sites are hit like tha"
