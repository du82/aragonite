title = "Harassment by Way2Enjoy - 2024 - Half-Elf on Tech"
description = "After spending most of 2023 complaining about other things, Tiwari decided to again bring up his grievances with WordPress. January Tiwari continued to keep his attacks to Mullenweg directly (likely because Epstein has not been active on Twitter since 2022 and as such is not a target for his outrage). When Mullenweg posted about his […]"
full_description = "Harassment by Way2Enjoy – 2024 The Saga of Harassment by Way2Enjoy: Home | 2018 | 2019 | 2020 | 2021 | 2022 | 2023 | 2024 | 2025(Last Updated 12 January 2025) After spending most of 2023 complaining about other things, Tiwari decided to again bring up his grievances with WordPress. Table of Contents January February-March April May June September October December January Tiwari continued to keep his attacks to Mullenweg directly (likely because Epstein has not been active on Twitter since 2022 and as such is not a target for his outrage). When Mullenweg posted about his book reading, Tiwari accused him of not reading books at all and of ignoring the ones Tiwari sent him: He also accused WordPress and Mullenweg of not being ‘open source’ because they ban people from their platform: February-March Sometime in early February, Tiwari set his account private on Twitter. At this point, it means he is screaming into the void, since only people who follow him would be able to see those posts. As of 12 February only 8 people followed him, and none are members of the community whom he enjoys maligning. By early March, Tiwari set his account public again on Twitter. Most of his WordPress related tweets were about how he’s been banned/harassed for five years. However, he also replied to unrelated posts. For example, when Automattic was dealing with the fallout of their pending AI sale, he replied to them to complain about being harassed. While he certainly has been banned, he has not been ‘harassed’ as no one has made any attempt to cause him further harm. April In early April, Mullenweg posted about the upcoming Solar Eclipse. Tiwari took the opportunity to accuse Mullenweg of child pornography (likely referring to Mullenweg’s ownership of Tumblr), and claiming that Epstein was somehow the underlying cause there of. To the best of her knowledge, Epstein has never reported nor filed a complaint to Tumblr about pornography, child or otherwise. He went on to compare Mullenweg to Sam Bankman-Fried. But none of that prevented him from both congratulating Mullenweg on the acquisition of Beeper, and simultaneously requesting he be un-banned from Automattic (who does not actually have the authority to do so): Screenshot Tiwari also began a pattern of posting and then deleting tweets. Shortly after any “offending” posts are added to this document, they vanish from his timeline. Be that as it may, Tweets are never really fully deleted, and so evidence remains of his threats. Besides the fact that Africa is not a nation but a continent, this threat is baseless as there is no evidence Mullenweg is involved in any form of illegal pornographic activity. He would not be held liable personally even if Tumblr was found to be hosting porn, as Tumblr is not owned by an individual but a company. At best, Automattic would be liable, however they have a grace period to act on illegal content once it’s discovered. Next Tiwari said he would escalate to “all countries” if his plugin was not reinstated. There is no global law that would support this. If there were, Epstein would have used it to sue Tiwari for his continued action. By mid month, Twiari claimed to have had a plugin published on WordPress.org, and the appropriate persons began an investigation. He later deleted the tweet. May In the end of May, Tiwari complained that the Competition Commission of India, New Delhi, had ruled WordPress did not have a monopoly. Per his claim, he was told to use other software: Their decision for case no 01/2023 says it’s not monopoly and advises us to develop for joomla drupal cms which hardly has 1 lakh site compared to wordpress 3 crore plus sites. here is screenshot of wordpress founder own admission where he says they have 43% of whole Internet While WordPress has a 63% market share, that is only of known CMS’s. That does not translate to “most websites use WordPress” and makes one reflect on the definitions of “monopoly”: Exclusive control by one group of the means of producing or selling a commodity or service. A company, group, or individual having exclusive control over a commercial activity. A commodity or service so controlled. The closest you might get is the first item, but the WordPress Foundation has no control over who uses WordPress which would make it a stretch to argue monopoly. In reviewing the case (which is public and found on the CCI website and saved here for posterity), Tiwari actually sued Automattic, making a number of erroneous claims such as: Automattic is the “parent company” of WordPress.org (Automattic does not own WordPress.org) He was banned without explanation (he was warned many times, and informed directly of his banishment and why it happened) His closed plugin reviews were removed to promote ‘their’ product, Jetpack (since Epstein has never worked for Automattic, this cannot be true) The CCI properly saw through his claims, and item 19 points out: 19. In relation to the Informant’s allegations, the OP has submitted detailed chronology of events leading to banning of Plugins of the Informant. Based on the information provided by the OP, which has not been contested by the Informant, it is noted that the Informant has repeatedly violated multiple guidelines of the wordpress.org despite being warned multiple times. Thus, the plugins of the Informant seems to be banned from the WordPress Plugin Directory due to his persistent misconduct contrary to the guidelines. These guidelines also do not appear to be unfair or unreasonable and are meant for maintaining quality of service and protecting interest of both developers and users. Accordingly, the Commission is of the view that WordPress.org is justified in taking appropriate action against any developer found non-compliant with the prescribed standards and regulations. It is also noted that guidelines have not been applied in a discriminatory manner and around 35 developers including the Informant have been permanently banned from WordPress.org for repeated violation of the Guidelines. Therefore, the conduct of the Opposite Party does not appear to be either unfair or discriminatory. COMPETITION COMMISSION OF INDIACase No. 01 of 2023 Since then, Tiwari took to Twitter to complain about this injustice, it is clear he intended to contest this ruling. Most of his complaints are along the lines of how it’s criminal that the CCI did not find Automattic to have a monopoly. To that end, he remains flatly wrong. In fact, the CCI noted that while Automattic Inc. was dominant, Tiwari’s repeated violations of wordpress.org’s community guidelines by the justified the removal of plugins and the ban. In other words, monopoly or not, Tiwari was facing the consequences of his own actions. Just because someone has a monopoly doesn’t meant you get a free pass to break their rules and still use their service. June Tiwari spent the rest of May, and went into June, constantly misunderstanding his own ruling, and arguing that the matter was that the CCI said WordPress wasn’t a monopoly. His lack of reading comprehension became more evident when he arbitrarily misquoted the India Supreme Court: Screenshot of Tweet – 03 June That case happens to be about someone who smashed voting machines (among other things) and it’s a hell of a lot more complicated that ‘You broke the guidelines over and over and still won’t stop.’ Still. He persisted and claimed he would have his case with the Supreme Court ‘soon,’ however the Supreme Court of India has no upcoming cases by Mr. Tiwari. September For most of the summer, Tiwari continued demonstrating his blatant misunderstanding of his own legal case. He posted multiple times about the CCI’s corruption, arguing that his case’s merit lies in WordPress’s state of being a (likely) monopoly, and not the reality of his own behavior having consequences. At some point he accused Epstein of stalking his Twitter and privatized his Twitter account for a time. In reality, Epstein has not used, nor been on, Twitter since it was purchased by Elon Musk. At the end of WordCamp US 2024, Matt Mullenweg made a controversial statement about WP Engine in his Q&A which was poorly received. Mullenweg doubled down on his statements, posting on WordPress.org instead of his own site. When Mullenweg tweeted a link, Tiwari replied: As previously mentioned, Epstein is not active on Twitter, and as one cannot read a tweet without being logged in, that is wildly incorrect. He subsequently took to replying dozens of times on Reddit to the kerfluffle. Screenshot Epstein does, in fact, make regular use of Reddit. As the situation between WP Engine and Mullenweg continued to worsen, Tiwari replied to dozens of posts by Mullenweg and others in the community, disagreeing with Mullenweg’s actions to block all WP Engine hosted sites from accessing Wordpress.org: Tiwari’s language quickly escalated: October The WPEngine/Mullenweg kerfuffle continued through October. Mr. Tiwari’s approach moved to accusing Mr. Mullenweg of being bipolar, and reaching out to all those who were working on alternatives to the plugin/theme repository on WordPress.org. Interestingly, the kind of treatment from Mr. Tiwari varied. In October, it appeared to be split evenly between male and female developers. Male developers were granted grace and time to respond, female were not. No known nonbinary or genderfluid developers have been involved in the fracas to date. December After months of merely alluding to Mrs. Epstein, in late December Mr. Tiwari again included here (and Mr. Wood) in his attacks. Following posts by WordPress leaders Karim Marruchi and Joost de Valk, Mr .Tiwari started to reply to suggestions of new governance with remarks cautioning people to not hire or include Mr. Wood or Mrs. Epstein. As evidenced in this series of posts, Mr. Tiwari’s representation of the facts omits crucial details."
