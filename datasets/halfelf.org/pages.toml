["https://halfelf.org/2015/hugo"]
title = "Hugo - Half-Elf on Tech"
description = "There's no app quite like Hugo. Where ever you go, I go. So Bye, bye, birdie!"
full_description = 'Hugo Written by Ipstenu (Mika Epstein) in How It Works I’ve been playing with Jekyll a lot. After WordCamp US, I started toying with the idea of a JSON powered Jekyll site, where WordPress output its posts as JSON and Jekyll pulled in the posts and converted them. This ran into many snags. It wouldn’t be ‘dynamic’ for one, but the biggest issue is that Jekyll’s JSON reading ability was terrible. It didn’t like the complex JSON that WordPress put out. That sent me hunting down other things like Hugo. Unlike Jekyll and it’s use of Liquid, Hugo uses Go (hence the Go in the name you see). Installation (on a Mac) is easy. brew install hugo Done. It’s harder on my server, but still easier than Jekyll, which started to become a ‘thing’ as I worked through all this. Using Hugo is remarkably similar to Jekyll except that it works faster and a little more smoothly. The site builds incredibly fast and it dynamically refreshes. So if I edit a post, the page refreshes itself. This let me tweak my theme and posts and sort out the new language incredibly fast. Edit a file, boom, I see what’s wrong. It’s about as logical as Jekyll too, so it took me one DayQuil addled afternoon to sort out how to make things work. The Basics The basic are simple. You have a basic structure like this: ▸ archetypes/ ▸ content/ ▸ data/ ▸ layouts/ ▸ static/ ▸ themes/ config.toml The config file is what you think it is. Your posts go in content and the html-ized version shows up a public folder that gets created on the fly. The data folder is for your static data like a .json file or a .yaml. Independant to your theme, you can put css and js in the static folder, and layouts in the layout folder. Ditto archetypes, which are post-types. So if you know you’re always going to have a post type of ‘musician’ and you want it to have special headers, then you can have an archetype called musician.md with all that pre-filled in. Then when you want to make a new entry for Clifford: $ hugo new musician/clifford.md You can also have those in your theme if you wanted, but generally I use the same theme and separate projects. At this point, I was impressed enough to be swayed from Jekyll. I’m not going to explain how to write a post, since it’s just markdown and a header, just like Jekyll or GitHub Pages. Building Your Site The commands are basic. Running $ hugo server will build your demo server. Of course, you’ll want to post your drafts, so you need to add the param --buildDrafts … Oh and you want a theme … $ hugo server --theme=utility-pro --buildDrafts That’s silly, right? Why do I have to define all that? Thankfully I can edit my config.toml file: baseurl = "http://example.com/videos" languageCode = "en-us" title = "My Super cool Video Library" theme = "utility-pro" buildDrafts = "true" [params] Subtitle = "Videos about cats, collected from the internet." Now every time I run the command ‘hugo’ it will build my drafts with my theme! $ hugo 45 of 45 drafts rendered 0 future content 45 pages created 42 paginator pages created 14 tags created 3 categories created in 254 ms That’s incredible fast seeing as it built everything. Of course the other site I have is a great many more pages. Theming Since I’d already mastered Jekyll theming, this was trivial. Go and Liquid are weirdly similar and most of it was transposing. There’s not much to say here except that there’s a Twenty Fourteen Theme for Hugo and it’s pretty much what you expect. For WordPressers, it’s a good place to start. Shortcodes The neat thing is that Hugo has shortcodes! They’re not like WordPress ones, but you can see the similarity between WordPress and Hugo. [video mp4="video.mp4" flv="video.flv"] vs. {{< video mp4="video.mp4" flv="video.flv" >}} Sadly there’s no oEmbed. And I had to write the shortcode on my own, but again, if you know the basics of logic all this stuff is easy. Here’s the magic behind the shortcode: <video class="video-js" width="{{ if .Get "width" }}{{ .Get "width" }}{{ else }}640{{ end }}" height="{{ if .Get "height" }}{{ .Get "height" }}{{ else }}385{{ end }}" controls> {{ if .Get "mp4" }}<source src="{{ .Get "mp4" }}" type="video/mp4">{{ end }} {{ if .Get "ogg" }}<source src="{{ .Get "ogg" }}" type="video/ogg">{{ end }} {{ if .Get "webm" }}<source src="{{ .Get "webm" }}" type="video/webm">{{ end }} Your browser does not support the video tag. </video> Once you look at it, it’s remarkably like WordPress. Only I don’t need a plugin. Everything in /layouts/shortcodes/ are like mu-plugins. And So? And so Hugo won enough of my attention that I’m going to keep playing with it and see what’s next. golang hugo jekyll static site ←Mailbag: Why did you ask that at the Town Hall? Deploying with Hugo→ Comments 7 responses to “Hugo” 14 December, 2015 John Turner Hugo is awesome and fast! Been playing with it myself. I’ve been experimenting with using WP as the backend to push out blog post and have Hugo generate the site. The cool thing is static host like Netlify can auto pull from a Github repo when it changes and auto build a site with something like Hugo. 14 December, 2015 Denise So Hugo is used for creating a static website that is dynamically updated by WordPress? 14 December, 2015 Ipstenu (Mika Epstein) @Denise: That’s my end goal. Right now it’s just for making a static site. Step 1 – Learn Hugo Step 2 – Learn JSON moar better Step 3 – … Step 4 – WP powered Hugo Site! 14 December, 2015 Max @Ipstenu (Mika Epstein): very interesting goal… I’ve thought of how cool something like this would be more than a few times… good luck, let us know how it goes =) 14 December, 2015 Denise Can I ask why this would be preferable to a pure WordPress website? 14 December, 2015 Ipstenu (Mika Epstein) @Denise: A loaded question. I’m tempted to ask “Why does everything have to be WordPress?” The real answer is “Because I don’t want to use WordPress for this.” Or maybe it’s “Because I want to learn something new and stretch my brain.” Or… maybe because “Why not?” I am not now, nor have I ever been, a WordPress only person. Mostly? Not even close. I use the right tools for the job. In this case, I had a site one person updates, rarely, that needs no special plugins or fancy things, and I wanted it to be safe and secure if I ignored it for a year. No updates. No security worries save the server itself. And it’s fast. Sure, I could do WordPress, and on the back-back end I would like to use WP to generate the JSON with content that I then pull into Hugo. But from a front end perspective, why not? Users don’t give a rats ass what powers a site as long as it’s fast and works 🙂 15 December, 2015 Denise I really love to hear your thoughts on this. It give me a sense of where the technology is right now and where it may be going. Thanks so much for the insight. I appreciate it even though I lean more towards design, so the thought of doing anything as tech as you are doing makes me shudder. More posts Cookie Consent on Hugo 28 February, 2025 Replacing the W in Your Admin Bar 14 February, 2025 Editor Sidebar Madness and Gutenberg 11 December, 2024 Small Hugo, Big Images 21 October, 2024'
