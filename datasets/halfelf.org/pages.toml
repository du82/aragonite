title = "Ipstenu (Mika Epstein), Author at Half-Elf on Tech - Page 2 of 184"
full_description = "Author: Ipstenu (Mika Epstein) Why NOT WordPress? There’s a website I’ve been running since 1996. Yes, I know, I’m an Internet Old. 1996. That’s 7 years before WordPress was a thing. So it’s not surprising this site was (at one point) moved from ‘something else’ to WordPress. Actually a lot of something-elses over the nearly 30 years of its existence. I moved it over to WP around 2005 (WordPress 1.5) and pretty much left it there for years. Now it’s different. Now the site is 100% powered by Hugo. Why Did I Stop Using WordPress? To understand this decision, you have to keep in mind that the site had been three parts for about 20 years. The Blog, where announcements were made, etc, powered by WordPress The Image Gallery, which had … images (about 20 Gigs), powered by netPhotoGraphics The Wiki/Library, which is the documentation, powered by Hugo Well, this year I got a nasty-gram and was forced to shut down the gallery. The simple truth was yes, the gallery included images that legally I didn’t have the right to use. No excuses. But the company involved was kind enough to work out a partial situation. I’m still in the middle of moving what images I can keep into a new home, but while that’s going on, I had a chance to sit down and face reality. The gallery, you see, was the biggest feature of the site. Next was the Wiki/Library, and the blog was pretty much just announcements. There was a forum, it was removed ages ago. There was BuddyPress, ditto. People management just isn’t fun. There was also the matter of cross linked data. Oh my, did a lot of images appear on the blog and the gallery. I was going to have to purge the old blog posts en masse anyway, so at that point, I asked myself that big question. Do I want to move the library to WP, or the blog to Hugo? Consider the following: I was going to have to manually curate nearly 30 years of blog posts (took a few thousand down to about 50) I already had a running Hugo site and was familiar with it (it has over 1600 files) If I ported to WP, I would have to rebuild my data setup for how the data is output Importing blog posts as text only is incredibly easy With that in mind, it seemed obvious. Hugo. What’s Different with Hugo? Obviously I lose the ability to write a blog post and press publish. I have to add a new file, manually link it to my new image, and push to GitHub, where it’s auto-deployed to the site in question. The process for any data is basically this: Create a branch on my GitHub Repo Add the new content Merge the branch into Production At that point a GitHub action takes over. Beyond that, however, there are some things you take for granted with WP. Like the ease of a mailing list with Jetpack. Now, I did export my Jetpack subscribers and I’m working on a solution there, but yeah, that was a big hit. There’s also the matter of auto-deploying content to socials. But… honestly that’s been pretty much shit-and-miss lately, what with Facebook and Twitter being what they are. But all the ‘easy’ stuff? Well Hugo has RSS Feeds, it can process images as it builds (though that will cause your deployments to take longer), it’s open source, and best of all? The output is static HTML. Go ahead, try and hack that. How Hard Was It? Honestly, it took me about 3 days to pick a new theme, apply it, move my basic content over, and start rebuilding the blog. Migrating blog posts took me about 3 weeks. The hardest part was realizing I was going to have to write some complex Hugo Mod code to include my gallery with lightbox code, but I banged that out in an evening. There were frustrating moments. The Hugo community is significantly smaller than WordPress (I mean, whose isn’t?) and some of the code is a little on the ‘understood’ level (by which I mean things aren’t always spelled out, they assume you know what they’re talking about). In a way, it’s like using WordPress back in 2006 all over again, and look at where that’s taken me! I’m very happy with the result. I picked a ‘fancy’ theme, called Hinode, and it came with Dark Mode built in. I ported over my custom code for recaps (I have a whole star rating system) and started building out topical small galleries where I could. If I was a newbie to the web world? This would have been impossible. Then again, a lot of the work I’m doing in WP would be impossible for a newbie. About the only tool I’ve used where I think it’d be easier would be … Maybe MediaWiki? But only because you can build templates from the editor backend. Even with Full Site Editing, WordPress would have been a bear and a half. Historical Notes The ‘Library’ was once on MediaWiki because I had this idea to be a public repository anyone could edit. Only I kept getting attacked by spammers, so I turned off registration. Then I had to apply all sorts of plugins, only MediaWiki didn’t allow you to self-update like WordPress, and I had to write scripts and it was just a pain. I rebuilt it all as Hugo about 6 years ago, and I really enjoyed it. GoLang is not something I’m familiar with, and sometimes the language drives me to drink, but so does PHP. The Gallery used to be a home-grown SHTML setup, which then moved to a now defunct project, Gallery, and then to ZenPhoto, and finally to NetPhotoGraphics after ZenPhoto decided to be more than just a photo library. NetPhotoGraphics is hella fun to use, and I even built an embed tool for it, so you could paste a link into WP. I did that with Hugo as well, and I’ll probably port that back to the new site sooner or later. It Is Sad Though Basically this site has been a part of my dev growth from day one. I wouldn’t be working in WordPress were it not for this site, and I owe it a lot. Moving to Hugo is the end of an era, and it is a bit sad. But at the same time, I feel like I’m now in even more control over everything, and I’m making a leaner, faster, website every day. I have no regrets for the steps I’ve taken on the way, and none about this move. It’s nice to not have to worry about updates all the time. After all, what’s on the site is just HTML. I do miss being able to schedule posts though… 13 August, 2024 Plugins: If I Did It… Joe Co. (not their real name) had a bad day. It started when we emailed them this: Your plugins have been closed and your account on WordPress.org is suspended indefinitely for egregious guideline violations. Normally we send out warning notices to encourage developers to correct behaviour, however in certain cases there are events that cause us to have to take extreme action. We received a notice that you had been demanding users edit their reviews and comments in order to receive a refund from your product. Your employee fake@example.com said this: > Please kindly delete all the comment on Wordpress.org,>> After that, we will accept your refund request via PayPal And then they would provide links to screenshots of what to remove. There’s an ugly word for asking people to modify reviews for a reward: bribery. However asking users to modify a review and delete comments to get a refund is called EXTORTION […] If you’ve been reading for a while, you know how much I hate bribery and extortion. Time for Proof Joe Co. emailed back It’s not a nice day today for our company to receive your email on ouraccount suspension, but we understand your concern to protect Org’s pluginsdirectory. We respect that! However, in case like this, you did receive the feedback from one side andI believe that you should take times to reviceved the feedback from ourcompany also. And we want you to know that maybe you should protect us andour company from UNFAIR COMPETIOR. Yes we internally thinks that this is among our Competitor doingsomething to get our Copies of Products and Try to Down us from theDirectory, here is the reason and proof: Now, I can’t list the rest of that for reasons regarding anonymity, but I can summarize the proof: A PDF of their internal chat client with the person who they felt probably complained (it wasn’t that person) A PDF where the same person refused to let Joe Co. log into their site (reasonable!) An admission they handled it badly When I opened the first PDF I started laughing. Wanna know what it says? The kicker? That arrow and red box is from the PDF Joe Co. sent. Right there, they are agreeing they told the user that they would only give him a refund if he deleted the reviews. They were not spam, either, the person left one, single, solitary review. Who was wrong? Both Joe Co. and their user were in the wrong here. The user knew damn well they weren’t getting a refund, and in fact I told him he was being silly for complaining that there was no refund when the terms he agreed to say no refunds. Joe Co. should have stuck by their guns and not suggested that would give a refund at all. Of course, what Joe Co. did after that made it so much worse… Sockpuppets. Sockpuppets everywhere. 100% of their reviews on one plugin were faked. My buddy who cleans that up sobbed into his coffee and I think that was when he wrote a ‘close all’ script. Then they made two more accounts and resubmitted plugins and did it all again. So while I will grant you that the user was an idiot, Joe Co. was worse. Do You Refund? Regardless of if you provide refunds or not, the lesson here is “stick to your guns” folks. If the policy is “No Refunds” then suck it up, buttercup. If the policy is to provide a refund within X days, then you do that. If the company has no refund policy, then don’t buy from them, because you will get jerked around. 18 June, 2024 Plugins: It’s the Wild Wild West The email subject was really funny to me. PLEASE, save from the lawlessness!!! They’re guidelines but sure. Yogi Bear here (whose real username implied he was smarter than everyone) went on to complain that developers ignore him and forum mods removed his posts complaining about said developers. At WordPress.Org forums there is chaos and lawlessness from some moderators and deception from developers!!!I work about month on improving and problem resolving and translation of huge plugin [redacted] but after I send my work to developer – they just start to ignore me and did not fulfill their promises! I create thread at forum about it, but some idiot arbitrariness moderator [redacted] just delete my thread with my asking for a help! It’s like if police will just kill people that turned to them for help!!! It’s a total absurd!!! A little hyperbolic, but sure, I get the annoyance. All Mods are Bad Mods Taking a look, it was clear what happened. Yogi Bear here had made a forum post about “WARNING! Deception from developers!” The plugin in question offered free premium versions of their plugin in return for help making translations. In so far as bribery goes, I considered this to be a decent trade. The offer only existed on their website, you had to go find it, and it was a very clear “Work for us and be rewarded.” It didn’t, at the time, violate any guidelines. Yogi Bear made a translation and sent it in. Then he spent weeks finding every security bug he could on the plugin and sent that in. But after I sent it – developers just stop answer to my letters (already about month) without any explanations and apology. […] Therefore I WARNING all who want to translate [redacted] or negotiate with developers of [redacted] also known as [redacted] – all your work can be just taken without any promised gratitude!!! Dont work with [redacted] and [redacted] developers – they are deceivers!!! Ugh. While I will concede that ghosting someone with good intentions is a dick move, there was no contract between Yogi Bear and them, so while they should publicly credit him, they don’t have to. Also they didn’t use most of his fixes (I learned that much later). One of the forum Mods replied that you don’t have to submit a translation to them directly (which is true). What that Mod didn’t know was that Yogi Bear was looking for the compensation that comes when your translation via WP.org is accepted. Thing is … Yogi Bear’s translation was accepted (and he was rewarded). But still he saw three major issues: The translated country list, on the English page, was in … English The plugin used too many similar phrases (“Please confirm” vs “Are you sure?”) Due to 2, there’s too much reworking to do here Issue one was just someone not understanding what he was looking at. The second I agree is annoying, but honesty if that creates number three, then … don’t volunteer. The plugin dev replied that they 100% had sent him the reward, but did not agree to his ‘extra’ conditions. This devolved into a “Yes I did!” “No you did not!” shouting match. Yogi Bear had screenshots saying he didn’t get anything (no attachments), Plugin had screenshots with links to where he could download (and his replies). After a back and forth, the Mods sighed and closed the thread. Shortly thereafter, Yogi Bear complained to Plugin Review. As Expected, It Escalated Well. Looking into it, it was obvious Yogi Bear had been asked to stop calling people names (everyone was a liar or a cheat). The Mods had warned him, twice, so Plugins pointed out he was the one breaking rules at that point. However! Plugins was happy to listen to this complaint if he had actual evidence of a violation to the forum or plugin guidelines. so fucking tide of all of you – idiots, irresponsible scums, liars, lazybones, etc… Are you an idiot? I repeat – ARE YOU AN IDIOT? Because obvious answer is – yes, you are an idiot for sure, I have to explain to you what you can’t understand with your stupid mind… 1) Where you find that I ignored any requests form moderators?! It’s a total LIE! I don’t receive any requests, just my threads was deleted now by idiot [Mod 1] and previously by the same kind of arrogant idiot [Mod 2]. You cannot blame me that I ignore something because I don’t get any request at all!!! 2) What do you think – for what purpose WORDPRESS PLUGINS SUPPORT FORUM are exist?! I don’t even talk about super low level of help at those forums by your team and mass closing not resolved questions… but particularly at this situation – It’s most obvious function of especially your forum is to WARN OTHERS about some developer dishonest and deception behavior at their forum part! It’s most obvious action to ask WP.org community to help! It’s most obvious action to ask moderator FOR HELP! 3) Publishing all this at my personal blog will not give any results. You must smarten up and grow up and take responsibility of such conflicts resolving, of WP users protection, etc – BUT NOT TO brainless delete their asking of help for sure!!! 4) Just read deleted thread – there are full of EVIDENCE – I help to [plugin] with more than 100!! Bug resolving, some fundamental problems resolving, many suggestions of improvements, etc – it’s a HUGE and respectable work that just was taken by dishonest developers! If it’s a normally for you, if you don’t feel that WP.org PLUGINS SUPPORT FORUM M_U_S_T protect users from dishonest develo"
