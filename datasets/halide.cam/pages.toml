["https://halide.cam"]
title = "Halide — The best pro camera for iPhone and iPad"
description = "The most powerful camera for iPhone and iPad."
full_description = "Meet Halide for iPad. Packed with all the powerful features of Halide for iPhone and a few special ones for better photography on big screens. Enjoy the brand-new, completely custom iPad interface and features like Pro View to get a scaled-down, unobstructed view of your shot with plenty of space for your Pro tools and readouts. Always up to date — now with iOS 18 Lock Screen Capture. Halide packs intuitive gestures, gorgeous details, and effortless ease of use. New in Mark II: Edge gestures for mode switching. Tactile Touch enables and disables focus and exposure aids as you need them. Designed with three new, custom typefaces. Check for accurate exposures with the new extended dynamic range (XDR) 14-bit color zebras and waveforms. Use your ideal histogram with large and small displays featuring monochrome and color options. Perfect manual focus with automatic enhanced focus peaking and a new focus loupe. That's why Halide lets you pick your processing — even between shots. Choose from iPhone's default image processing, or reduced processing, or choose Process Zero: a single-shot RAW capture mode that gives you beautiful film-like shots with minimal processing and zero AI right out of the camera. The new Image Lab lets you re-develop the shot later for different exposures, or you can edit your photo in an image editor with huge flexibility — because Halide saves raw sensor data along with your shot. Halide was designed with our favorite object in mind: the delightfully tactile and beautiful film camera, without compromising on the flexibility and power of mobile photography. Gestures are modeled after the intuitive manipulation of dials: swiping up and down for exposure, and left and right for focus. The interface is simple and free of clutter, letting you focus on your artistic process. We pay homage to the design heritage of more than a century of camera design with completely custom typefaces and typography throughout based on etched type on camera bodies and lenses."
year_published = 2025
