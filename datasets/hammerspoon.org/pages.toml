["https://hammerspoon.org/go"]
title = "Getting Started"
description = "Staggeringly powerful macOS desktop automation with Lua. Making the runtime, funtime."
full_description = "Hammerspoon is a desktop automation tool for macOS. It bridges various system level APIs into a Lua scripting engine, allowing you to have powerful effects on your system by writing Lua scripts. Lua is a simple programming language. If you have never programmed in Lua before, you may want to run through Learn Lua in Y minutes before you begin. All good programming tutorials start with a Hello World example of some kind, so we will use Hammerspoon’s ability to bind keyboard hotkeys to demonstrate saying Hello World with a simple notification. Then save the file, click on the Hammerspoon menubar icon and choose Reload Config. You should now find that pressing ⌘+⌥+ctrl+W will display a Hello World notification on your screen. What is happening here is that we’re telling Hammerspoon to bind an anonymous function to a particular hotkey. The hotkey is specified by a table of modifier keys (⌘, ⌥ and ctrl in this case) and a normal key (W). An anonymous function is simply one that doesn’t have a name. We could have defined the alert function separately with a name and passed that name to hs.hotkey.bind(), but Lua makes it easy to define the functions inline. While hs.alert is useful, you might prefer to use the macOS native notifications instead, which you can do by simply modifying the previous example to: The official website with the listing of Spoons is https://www.hammerspoon.org/Spoons/ and the official repository is https://github.com/Hammerspoon/Spoons. For this example we’ll use the “AClock” Spoon. To install it, please download the zip file from our Spoon repository, uncompress the zip and double click the AClock.spoon file. Hammerspoon will then remove it from your Downloads folder as it installs. Installing a Spoon doesn’t mean it’s going to run by default, so we’ll now add some configuration to load and use this Spoon: One of the most immediately useful things you can do with Hammerspoon is to manipulate the windows on your screen. We’ll start off with a simple example and build up to something more complicated."
year_published = 2025
clearnet = "https://hammerspoon.org/go"
