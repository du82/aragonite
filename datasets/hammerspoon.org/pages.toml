title = "Hammerspoon Spoons Docs"
full_description = "Automatically set to 0 the volume of all output audio devices except Bluetooth devices when Mac goes to sleep. List advertised services on your network that match defined templates and provide a list for the user to access them. This spoon addresses a limitation within the hs.hotkey module that allows the creation of hotkeys bound to specific left or right keyboard modifiers while leaving the other side free. Allows scrolling by holding down the middle mouse button and dragging it, the same as it works on Windows. With this script you will be able to move the window in halves and in corners using your keyboard and mainly using arrows. You would also be able to resize them by thirds, quarters, or halves. Connect, disconnect, or toggle connection to/from a personal hotspot. Optionally kills/opens a list of apps on connect/disconnect respectively. Adds a hotkey to reload the hammerspoon configuration, and a pathwatcher to automatically reload on changes. Trigger or prevent screen saver/sleep by moving your mouse pointer to specified hot corners on your screen."
