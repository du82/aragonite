["https://hammerspoon.org"]
title = "Hammerspoon"
description = "Staggeringly powerful macOS desktop automation with Lua. Making the runtime, funtime."
full_description = "This is a tool for powerful automation of macOS. At its core, Hammerspoon is just a bridge between the operating system and a Lua scripting engine. What gives Hammerspoon its power is a set of extensions that expose specific pieces of system functionality, to the user. You can write Lua code that interacts with macOS APIs for applications, windows, mouse pointers, filesystem objects, audio devices, batteries, screens, low-level keyboard/mouse events, clipboards, location services, wifi, and more. If you want to explore the options Hammerspoon offers, check out the Getting Started Guide and the full API documentation as well as the already pre-made plugins called Spoons. Typically you would write a configuration file in Lua that connects events to actions. You might want to bind a keyboard shortcut to a series of window operations, or an applescript. You might want to run a series of commands when your wifi interface connects to your home network. You might want to display an alert when your battery drops below a certain percentage. You might want to do something crazy like have iTunes automatically start playing when your Mac detects you are in Paris. If you are using an older Mac which is not running a recent version of macOS, please consult our Release Notes for a version which is compatible with your system. Out of the box, Hammerspoon does nothing. You will need to create a Lua script in ~/.hammerspoon/init.lua using our APIs and standard Lua APIs. If you are new to Hammerspoon, read the Getting Started Guide with reference to the full API documentation. More extensions will always be a huge benefit to Hammerspoon. They can either be pure Lua scripts that offer useful helper functions, or you can write Objective-C extensions to expose new areas of system functionality to users. For more information, see the contribution guidelines on GitHub."
year_published = 2025
clearnet = "https://hammerspoon.org"
