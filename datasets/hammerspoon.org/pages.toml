["https://hammerspoon.org/docs/index.html"]
title = "Hammerspoon Docs"
full_description = "This module allows you to access the accessibility objects of running applications, their windows, menus, and other user interface elements that support the OS X accessibility API. This submodule allows hs.axuielement to support using AXTextMarker and AXTextMarkerRange objects as parameters for parameterized Accessibility attributes with applications that support them. This submodule allows you to create observers for accessibility elements and be notified when they trigger notifications. Not all notifications are supported by all elements and not all elements support notifications, so some trial and error will be necessary, but for compliant applications, this can allow your code to be notified when an application's user interface changes in some way. A sub module to hs.canvas which provides support for basic matrix manipulations which can be used as the values for transformation attributes in the hs.canvas module. Various features/facilities for developers who are working on Hammerspoon itself, or writing extensions for it. It is extremely unlikely that you should need any part of this extension, in a normal user configuration. Provides access to the system color lists and a wider variety of ways to represent color within Hammerspoon. Support functions for the CGILua compatibility module for including and translating Lua template pages into Lua code for execution within the Hammerspoon environment to provide dynamic content for http requests. Support functions for the CGILua compatibility module for encoding and decoding URL components in accordance with RFC 3986. Provides Hammerspoon with the ability to create both local and remote message ports for inter-process communication. Convert between key-strings and key-codes. Also provides functionality for querying and changing keyboard layouts. Converts between GPS coordinates and more user friendly representations like an address or points of interest. Send messages via iMessage and SMS Relay (note, SMS Relay requires OS X 10.10 and an established SMS Relay pairing between your Mac and an iPhone running iOS8)"
year_published = 2025
clearnet = "https://hammerspoon.org/docs/index.html"
