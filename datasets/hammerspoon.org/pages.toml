title = "Hammerspoon"
description = "Staggeringly powerful macOS desktop automation with Lua. Making the runtime, funtime."
full_description = "This release comes after 100 releases of 0.9, and just two months shy of Hammerspoon’s 10th birthday. 0.9.67 was a decent sized release, but since we’ve had to immediately do two brownbag releases to fix crash bugs, you might not see the release notes for 0.9.67. They’re worth reading, so you can find them here Fixed: 0.9.68 fixed a memory leak in hs.application, but the fix caused some crashes, so it has been reverted We are currently focusing very hard on a small set of very strange crashes in Hammerspoon. If Hammerspoon crashes for you, please reach out to us via GitHub, or IRC, or email and send us your config. At the moment we have extra Lua debugging enabled, which will trigger more crashes, but also produces better logs for us to fix the bugs. Apologies for the inconvenience this is causing, but it’s making Hammerspoon better in the long run! We are currently focusing very hard on a small set of very strange crashes in Hammerspoon. If Hammerspoon crashes for you, please reach out to us via GitHub, or IRC, or email and send us your config. At the moment we have extra Lua debugging enabled, which will trigger more crashes, but also produces better logs for us to fix the bugs. Apologies for the inconvenience this is causing, but it’s making Hammerspoon better in the long run! We are currently focusing very hard on a small set of very strange crashes in Hammerspoon. If Hammerspoon crashes for you, please reach out to us via GitHub, or IRC, or email and send us your config. At the moment we have extra Lua debugging enabled, which will trigger more crashes, but also produces better logs for us to fix the bugs. Apologies for the inconvenience this is causing, but it’s making Hammerspoon better in the long run! We are currently focusing very hard on a small set of very strange crashes in Hammerspoon. If Hammerspoon crashes for you, please reach out to us via GitHub, or IRC, or email and send us your config. We have not yet been able to reproduce the crashes, and are very keen to do so!"
