full_description = 'Impressum und Datenschutz hamnetdb.net ist eine private Homepage ohne gewerblichen Hintergrund. Der Betrieb der dieser Seite dient dem Hobby Amateurfunk und erfolgt aus technischem Interesse. Ein weiter gehender (kommerzieller) Nutzen besteht nicht und ist auch nicht geplant. Betreiber der Website hamnetdb.net wird gemeinsam betreut und betrieben von Lucas Speckbacher OE2LSP, Jann Traschewski DG8NGN und Flori Radlherr DL8MBT Verantwortlich: Florian Radlherr Milchstraße 12 D-82256 Fürstenfeldbruck Kontakt: Urheberrechte Die Inhalte der Website hamnetdb.net sind gemäß CC BY-NC-SA gestaltet. Inhalte dürfen also nur nichtkommerziell und unter gleichen Bedinungungen mit Quellenangabe genutzt und weitergegeben werden. Links auf diese Website und deren Unterseiten sind generell gestattet und auch erwünscht. Haftungsausschluss Die Website hamnetdb.net wurde mit größter Sorgfalt erstellt. Dennoch wird keine Gewähr für die Richtigkeit und Vollständigkeit der enthaltenen Informationen übernommen. Jegliche Haftung für Schäden, die direkt oder indirekt aus der Benutzung dieser Website entstehen, wird ausgeschlossen, soweit diese nicht auf Vorsatz oder grober Fahrlässigkeit beruhen. Unsere Seite enthält Links zu anderen Webseiten, für deren Inhalt wir keine Verantwortung übernehmen können. Bei Bekanntwerden von Rechtsverletzungen verlinkter Seiten werden wir derartige Links umgehend entfernen. Datenschutz Wir (siehe oben) fühlen uns für den Schutz persönlicher Daten im Zusammenhang mit unserer Website hamnetdb.net verantwortlich. Inhalte der Hamnet-Datenbank Die Hamnet-DB ist ist ein Informationsmedium, das den Planungs- und Realisierungszustand des Amateurfunk-Datennetzes HAMNET für jedermann einsehbar dokumentieren soll. Zur Dokumentation von Verantwortlichkeiten und Zuständigkeiten werden ggf. Amateurfunk-Rufzeichen von Personen dargestellt. Sollte jemand dieser Darstellung nicht zustimmen, bitten wir um einen formlosen Hinweis. Wir werden diese Information dann ggf. berichtigen oder löschen. Webserver-Logfiles Für den störungsfreien Serverbetrieb unserer Website ist es erforderlich, in den Server-Logfiles von jedem Besucher folgende Daten zu erfassen: URL der besuchten Seite Uhrzeit zum Zeitpunkt des Zugriffes Menge der gesendeten Daten in Bytes Quelle oder Verweis woher die Seite aufgerufen wurde (Referer) Der verwendete Browser in Form des übermittelten User-Agents Das verwendete Betriebssystem in Form des übermittelten User-Agents Die verwendete IP-Adresse Die erhobenen Daten dienen lediglich statistischen Auswertungen und zur Verbesserung unserer Website. Wir behalten uns allerdings vor, die Server-Logfiles nachträglich zu überprüfen, sollten konkrete Anhaltspunkte auf eine rechtswidrige Nutzung hinweisen. Nach einer Speicherfrist von 7 Tagen werden diese Daten vom Server gelöscht. Rechtsgrundlage für die vorübergehende Speicherung der Daten und der Logfiles ist Art.6 Abs.1 DSGVO. Eine Übermittlung dieser Daten an Dritte findet nicht statt. Cookies Unsere Website verwendet keine sogenannten Tracking-Cookies, die eine Nachverfolgung des Nutzers ermöglichen. Login: Hamnet-Administratoren erhalten ggf. die Möglichkeit, sich am System anzumelden. Dies steht nur einem geschlossenen Nutzerkreis zur Verfügung und wird deshalb gesondert beschrieben. Inhalte von Drittanbietern Für die Darstellung der Funktion "Map" setzen wir OpenStreetMap und einen Teil der Google Maps API ein. Das bedeutet konkret, dass bei Aufruf dieser Funktionen die IP-Adresse des Besuchers an OpenStreetMap und Google weitergegeben wird, um die Inhalte an den Besucher auszuliefern. Für die Kartendarstellung gilt die Datenschutzerklärung von OpenStreetMap und Google. Kontaktdaten Zur Korrespondenz mit unseren Besuchern stellen wir eine Kontaktmöglichkeit per E-Mail zur Verfügung (siehe oben). Um auf ankommende Mails angemessen reagieren zu können, ist es erforderlich diese samt Kontaktdaten in unserem E-Mail-Programm zu speichern. Wir werden Inhalte und Konktaktdaten ausschließlich zu deren Beantwortung verwenden und ohne explizite Zustimmung des Absenders nicht an Dritte weitergeben. Wir werden selbstverständlich jedem Wunsch entsprechen, an uns gesendete Mails und die dazugehörigen Kontaktdaten aus unserem Maileingang zu löschen. Sollten Einwände gegen Veröffentlichungen auf dieser Website bestehen, so bitten wir explizit um eine Kontaktaufnahme auf direktem Weg. Es ist uns ein ausdrückliches Anliegen, derlei ggf. rasch, einvernehmlich und ohne finanzielle Aufwendungen zugunsten Dritter zu lösen.'
