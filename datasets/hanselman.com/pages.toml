title = "Do I sleep? - Scott Hanselman's Blog"
description = "Strangely today two separate (and presumably unrelated) bloggers questioned ..."
full_description = '''Do I sleep? July 14, 2006 Comment on this post [10] Posted in Musings Sponsored By Strangely today two separate (and presumably unrelated) bloggers questioned whether or not I sleep. David Suruyange posted on it and Ryan Rinaldi did also, albeit in passing. However, I must say, I do have quite a fondness for Nancy Kress' Beggars in Spain (Wikipedia). "The book deals with the issues of genetic modification to unborn babies and problems that may arrive within society from such technologies. Specifically, the book examines a genetic modification that renders the babies capable of never having to sleep. This allows the babies, as they grow, the chance to accomplish much more with their freed up time as well as a collection of secondary genetic traits. The books charts the reactions of society to the 'Sleepless' from the viewpoint of the 'Sleepless' group as they struggle to find a place in society and battle against the prejudices they face. The book's protagonist, Leisha Camden, is a sleepless person who comes from an extremely rich family and whose life is paralleled and compared to that of her twin who is born without the genetic modification for sleeplessness." One sure could get a lot done if they didn't sleep. Do you sleep? In other news, Scott Bellware (my personal Evil Spock) has proceeded to register Hanselmetric.com and is (very likely) proceding to build a (top secret) Froogle search populated entirely by things I've got in my house. Here is his exceedingly thoughful business strategy: "What the world needs now is love sweet love, and a website that aggregates the Hanselman product testimonials scattered around all the various websites so that we can plan our future purchases accordingly. Googling "scott hanselman testimonial" simply isn't accurate enough when arriving up the end of the month with a couple extra bucks in my pocket and a burning desire to spend . Dammit, I want to know what other products satisfy the Hanselmetric that I haven't been made aware of, and until I do, I just feel sort of empty inside. The Hanselmetric represents the pinnacle of an aspect of contemporary cultural evolution, and I just don't want to be left behind." Madness! Hm...maybe we can make some kind of cooperative crossover affiliate work. Let's focus first on getting me on Oprah. Or at least some kind of local cable network or QVC. Give me a call ScottB! ;) About Scott Scott Hanselman is a former professor, former Chief Architect in finance, now speaker, consultant, father, diabetic, and Microsoft employee. He is a failed stand-up comic, a cornrower, and a book author. About Newsletter Hosting By Comment on this post [10] Share on BlueSky or use the Permalink and post anywhere! July 14, 2006 15:05 While there would be seemingly obvious advantage to the workalohics of the world, most people could never deal without a certain ammount of complete down-time.As a person who has been diagnosed with hypernychthemeral syndrome (http://en.wikipedia.org/wiki/Non-24-hour_sleep-wake_syndrome), I can atest that after a certain point, the human mind starts to find boredom in every task imaginable -- after being awake for 35 hours straight (a normal for me), I tend to become easily distracted for very brief periods of time (until I become distracted by something else). If I hit this point after midnight, I tend to turn to MTV, since the three to four minute long music videos keep me continually distracted on one focal point, the TV, until I fall asleep.P.S. If anyone knows any researchers associated with the American Academy of Sleep Medicine, could you gently suggest that they do a study to check us IT folk for a higher rate of circadian rhythm disorders? My gut tells me we tend towards them for some reason. Alex Lyman July 14, 2006 18:00 I find that I either sleep, or I get stuff done. :) Especially with a wife and two kids 2 and under. Usually I get stuff done until I can't take it anymore, then I sleep.And shame on you, Scott, for getting me so excited about PowerShell! It kept me up until 4:30 this morning! :)http://www.aaronlerch.com/blog/2006/07/newsgator-powershell-provider-is.html Aaron Lerch July 14, 2006 19:38 You still didn't answer the question... Jason July 14, 2006 20:15 I was laughing my butt off reading ScottB's post. :) tod July 14, 2006 21:04 Want more time to do more stuff. Can you sleep less?http://www.stevepavlina.com/blog/2005/05/how-to-become-an-early-riser/http://www.stevepavlina.com/blog/2005/10/polyphasic-sleep. Good? Abdu July 15, 2006 11:12 No kidding... three devs in our shop were debating this issue just the other day (whether or not Scott actually sleeps). I believe the outcome was 2 votes no, 1 abstention. :) Zack July 15, 2006 13:16 Zack - That's hilarious. I slept once, but it wasn't very productive. ;) Scott Hanselman July 16, 2006 11:07 Manual trackback - sleep question Sam Gentile July 16, 2006 11:08 Whoops home page not long enough http://codebetter.com/blogs/sam.gentile/archive/2006/07/15/147406.aspx Sam Gentile July 16, 2006 11:10 > Specifically, the book examines a genetic modification that renders the babies capable of never having to sleep. Oh my God, I'd go out of my mind! Heather is already going full tilt from 7AM - 10PM Sam Gentile Comments are closed.'''
