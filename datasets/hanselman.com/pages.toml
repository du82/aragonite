full_description = "I've been fortunate to speak to nearly a half-million people all over the world over the last 25 years, to groups as small as 10 and as large as 25,000. I've spoken to non-developers on topics like Personal Productivity, Mentorship and Sponsorship, Diversity in Teams, Diabetes and Open Source, Technical Startup plans, Blogging, Effective Social Media, and personal Brand Management. I've presented to developers on topics like large-scale system architecture, cloud computing, .NET, JavaScript and more. I've also partipated and led panels at conferences like SXSW. Feel free to contact me to speak at your conference or corporate event. Feel free check out videos of me speaking. I’m only interested in speaking at conferences with an enforced Code of Conduct in place. Examples CoCs are used at Pycon and JSConf. I speak at conferences that are actively working towards improving diversity amongst both attendees and speakers and I avoid manels. Do read about putting on diverse and inclusive conferences. I also have a video on Pluralsight that will teach you how to be a better technical speaker! SpeakingHacks.com. You can watch dozens of videos of me speaking on my blog. Feel free to contact me if you'd like me to speak at your company! Disclaimer: The opinions expressed herein are my own personal opinions and do not represent my employer’s view in any way."
