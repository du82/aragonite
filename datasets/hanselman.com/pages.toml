title = "Scott Hanselman - Coder, Blogger, Teacher, Speaker, Author"
description = "Scott Hanselman is a programmer, teacher, speaker, technologist, podcaster, writer, inclusion advocate and more."
full_description = "My name is Scott Hanselman. I'm a programmer, teacher, and speaker. I work out of my home office in Portland, Oregon for Microsoft as the Vice President of Developer Community. I work on .NET, Open Source, and the Azure Cloud Developer Experience, but this site, its content and opinions are my own. I blog about technology, culture, gadgets, inclusion, code, the web, where we're going and where we've been. I'm excited about community, social equity, media, entrepreneurship and above all, the open web. I would love it if you would subscribe to my blog's RSS feed, or you can get my blog delivered to you via email. If you just want to email me, go ahead send an email to scott@hanselman.com but be nice and make sure you Googled around a bit before you do. ;) Before Microsoft, I was the Chief Architect at Corillian Corporation, now a part of Checkfree, for 6+ years. Previously, I worked as a Principal Consultant at STEP Technology, speaking, writing, consulting, and very much not getting rich during Web 1.0, although I worked on a bunch of web sites you have heard of. I worked at Intel, Nike, and consulted all over the world. I've also been an Adjunct Professor at OIT, teaching C# and Web Services. I created the first PalmPilot Diabetes Management System in 1998 and sold it to a healthcare company some years later. I am an early adopter, it seems. I ran Tweak Computer Support BBS, with some success, a very long time ago. I was a FidoNet node. I have nice teeth and love cheese amongst other things. I like Tools, and I've co-written some books. I'm diabetic. I like studying Amharic and Zulu/Ndebele and listening to African Music as well as other music. I enjoy Black Hair as a hobby and can both braid and cornrow, although more recently focusing on starting and maintaining locs. I have a podcast. I hack on hardware and waste time. I do Open Source. I have a large forefive-head. I am good at Excel and keep my resume mostly up to date for no reason. We speak Sign Language to my son and my wife speaks Ndebele. I have a great family and have had great teachers and a fantastic wedding with a great Cake Topper. I don't sleep too much. I write a lot. I'm trying to raise $50,000 for Diabetes research."
