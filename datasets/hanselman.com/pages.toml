["http://www.hanselman.com/blog/FiveThingsYouSeriouslyDidntKnowAboutMe.aspx"]
title = "Five Things You (Seriously) Didn't Know About Me - Scott Hanselman's Blog"
description = "I hate (lowercase 'h') these viral questionnaires, but somehow this one is ..."
full_description = '''Five Things You (Seriously) Didn't Know About Me January 04, 2007 Comment on this post [18] Posted in Musings Sponsored By I hate (lowercase 'h') these viral questionnaires, but somehow this one is slightly more compelling and I've already seen a number of interesting responses out there. I was "tagged" by Phil Haack, so I am apparently honor-bound to respond. Here's my "Five Things You (Seriously) Didn't Know About Me" in no particular order. In my sophomore year in school, while studying Software Engineering, there was a term where I got straight "D's." I was sleeping in class, not showing up, not doing my work. I'd lost weight and was 145lbs on a 5'11" frame (that's unhealthy, for you folks using the metric system. I was diagnosed with Type 1 diabetes shortly after, the month before my 21st birthday. I'm a bit of a fashionisto. I know all the girls on America's Next Top Model, and can name 95% of the models in any fashion magazine (Vogue, etc) even the obscure ones. I find myself watching FashionTV a little bit too much and I can put together a fine looking outfit for just about any body type for under $100. I took my niece to "Forever 20" - a local boutique - and come up with a series of coordinated separates that included a black pin-stripe capri pant, tank top and tweedy shrug (not a bolero) that she could add to her existing collection to make at least five different ensembles. That said, I buy all my clothes at Old Navy so I'm kind of an average dresser, but I could look nice if prompted. I've never had a cavity. My teeth are pristine. Well, kinda. My paternal grandmother had no adult permanent teeth. She kept her baby teeth into high-school and was eventually fitted with fake teeth. My dad was born with only half his permanent teeth, and has had partial dentures for years, now a bridge. Fortunately my Mom was blessed with like 45 teeth (way more then you're supposed to have) and had many pulled to have the right amount. All that combined, along with Fluoride treatments for decades have given me super-teeth. Until last year, when I had a "preemptive filling" when the dentist said, "Well that's not a cavity, but we might as well fill the pits to prevent one in the future." So, my record has been broken, even though I like to think my teeth are still nice. I also wonder what would have happen if I'd continued my short lived comedy career (punctuated by a series of brutal open-mikes) and actually got a sitcom or movie. I look at guys like Zach Braff and Ryan Reynolds and I can't help but think that they have my career. I totally should have been on Two Guys, a Girl, and Pizza Place, and it would have rocked. I even sent a proposal to the folks at Saturday Night Live that they do a night hosted by a Complete Unknown (me). I still think it'd be better than the crap they are currently putting out. So, if you want to cast me as the lead in your movie, now's the time. I'll go fast. I have never drank nor have I smoked weed or tried any illicit whatnot in my life. I don't know what beer tastes like, and I've only smelled wine. I never got around to it in my teen years, and once I was diagnosed diabetic, I figured since I was on such a roll, why break my tea-totaling streak? I don't understand the compulsion to get "plastered" as the frats are wont to do and I don't go on wine tasting expeditions. However, I have been known to eat a half-pound of Tillamook Medium Cheddar Cheese in one sitting. There's others you don't know, like politics and religion, but I'll avoid those as this is a primarily technical blog. Now, I'm supposed to "tag" five other people who are supposed to answer the same question with a post of their own. Here's my five: Greg Hughes, Patrick Cauldwell, Daniel (kzu) Cazzulino, John Lam and Sam Ruby. About Scott Scott Hanselman is a former professor, former Chief Architect in finance, now speaker, consultant, father, diabetic, and Microsoft employee. He is a failed stand-up comic, a cornrower, and a book author. About Newsletter Hosting By Comment on this post [18] Share on BlueSky or use the Permalink and post anywhere! January 04, 2007 4:55 Well Scott,A couple things...1. It is a Fraternity not a Frat. There is a rather dirty song to educate the uninformed but I will refrain.2. As your beer, whiskey and gin swilling cousin I can let you know that all taste great and are less filling. I also find myself quite funny and a total ladies man while under the influence! Others I've been told do not. 3. Your Paternal Great Grandfather James Cormack never drank. He took an oath and held fast to his word. I do believe that Uncle Glen McCarty spiked the punch on a Christmas, leaving Grandpa Jim a bit woozy. I think he gets a pass on that one. 4. Fashion runs deep in the Hanselman family. I buy all my clothes at Nordstrom and love the shows you like too. I'm forever letting Tina know what her friends need help with. I like the British What not to Wear show. 5. I have near perfect teeth too.Jack Jack Hanselman January 04, 2007 5:38 Bizzare, but good to know Scott. However the fashion thing is a bit disturbing. I mean, do you and Rory have long discussions about face cream as well? I'm beginning to wonder... Bil Simser January 04, 2007 5:51 We could start a straight eye for the straight girl show with you.As for getting "plastered", anything that makes you puke and forget the previous night out naturally makes no sense. However, there is something to be said for the social lubicrant qualities of the "right amount" of liquor. Just enough to get you buzzed. Unless you're an angry drunk. Then you shouldn't drink. Me, I'm a happy drunk. haacked@gmail.com (Haacked) January 04, 2007 8:12 Hey Scott - Just an FYI: As an avid reader of your blog, I'd be interested in your political and religious orientations even though this is just a technical blog. Your post on personal subjects all the time and they're quite interesting.Jeff Jeff January 04, 2007 12:29 Five Things That (Seriously) Made Me Loose My Respect For Scott Hanselman!But I'll keep on reading your blog when you continue to write about the technical stuff :) Torbjørn January 04, 2007 13:26 Oh man, you don't drink!? *Now* I know why you're successful and I'm not! AndyToo January 04, 2007 20:42 I have read a bunch of these 5 things email in the last couple of weeks but this is by far my favorite! I just never picture the tech nerd Scott Hanselman being so into fashion ;) Luke January 04, 2007 22:04 Scott, this is not just entertaining, but uplifting. You've given me the courage to come out... I'm a Ph.D. who loves America's Next Top Model. Whew! I feel better now. Quinn January 04, 2007 23:56 So basically you're a freak. Kidding of course. Scott January 05, 2007 0:29 So wise, yet so naive about addictions and compulsive behavior. John A. Davis January 05, 2007 5:34 I read your blogs and enjoy the technical content, however; this blog entry was quite amusing and laughed a few times. I loved how Jack H. was quick to keep you honest! I now I have nothing to be shy about now. My secrets are much tamer than yours! (this is good).ps. I like the British Beatles black tight pants too. David January 05, 2007 20:05 Didn't drink as a teen? Just wait until Z becomes a teenager himself. That's when you'll pick up drinking. :) Brian Windheim January 05, 2007 21:20 Number 2 doesn't surprise me at all - I remember you always having fashion advice in high school. Here I've been complaining for years about needing a gay best friend to teach me how to dress, I should have just taken a day trip down to Portland & had you give me some pointers. *grin* Jerry Ann January 05, 2007 22:43 Here's my Five Things. Sam Ruby January 06, 2007 2:48 Half a pound?!? MEDIUM?!?PAH!Talk to me when it's a FULL pound of EXTRA SHARP!Not that I am proud of that.... vern January 06, 2007 11:35 I was totally following you until you got to the Tillamook. Ugh. West Coast cheese is nothing compared to what comes out of Wisconsin, Minnesota or Iowa (in that order). If you want some good cheese check out http://www.maytagdairyfarms.com. Throw that on a good burger and you will know what good cheese truly is. Allen January 09, 2007 0:17 It's great to hear of another tea-totaler. Being from "Brew City" I get harassed quite a bit about my choices. I've even requested not to work at Miller, one of the largest .NET shops in town (I'm sure my employer loves that one). However, I wouldn't mind working at a cheese factory. Brian January 10, 2007 10:21 LMAODude. You dress ok but I'm laughing with Michelle about your whole shopping experience. Having been exposed to your dry wit for a few years I can safely say I laughed harder at your fashion prowess. You probably chose the right career.Ty Ty Button Comments are closed.'''
