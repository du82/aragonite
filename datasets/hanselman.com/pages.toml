description = "Scott Hanselman is a programmer, teacher, speaker, technologist, podcaster, writer, inclusion advocate and more."
full_description = '''The Hanselminutes Podcast is "Fresh Air" for developers. Scott interviews movers and shakers in technology in this commute-time show. Nearly 1000 episodes spanning almost 20 years, from Michio Kaku to Paul Lutus, Ward Cunningham to Kimberly Bryant, Hanselminutes is technology talk radio guaranteed not to waste your time. Scott and Mark Learn To is a video podcast with Microsoft Azure CTO Mark Russinovich where each week with learn a new thing! Azure Friday is a video podcast, with a few 10-15 min episodes released each week. I sit down with the actual developers of the Azure Cloud as they teach me what I need to know to be an effective developer. We'll talk VMs, Web Sites, Cloud Architecture, open-source, architecture and more. This Developer's Life is Rob Conery and Scott Hanselman's homage to This American Life, from the point of view of a programmer. What's it feel like to get fired? To hit a home run? To succeed and to fail. Meticulously edited and lovingly created, This Developer's Life isn't just for developers, but also those that love them. Now archived, Ratchet and the Geek was a bridge between pop culture, social media, and technology. Scott Hanselman and Luvvie Ajayi talk TV (like Scandal!), gadgets, social media, current events, and give tips on the best sites, tools and products to make your life better. Disclaimer: The opinions expressed herein are my own personal opinions and do not represent my employer’s view in any way.'''
