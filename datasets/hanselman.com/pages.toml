["http://www.hanselman.com/blog/MrsMayfieldHillMyFifthGradeTeacher.aspx"]
title = "Mrs. Mayfield-Hill, my fifth grade teacher - Scott Hanselman's Blog"
description = "Marianne Mayfield is my fifth-grade teacher and the reason I'm in computers ..."
full_description = '''Mrs. Mayfield-Hill, my fifth grade teacher August 15, 2004 Comment on this post [3] Posted in Speaking Sponsored By Marianne Mayfield is my fifth-grade teacher and the reason I'm in computers today. She was at my wedding, at graduations, at family events. Twenty years later and we are still close.When I was young, she recognized that I was "at risk for trouble" and sat down with my family in order to find a way to get me back on track. She saw that I was transfixed by the Apple II in our classroom and set it up so we could sneak the computer out of the school as long as it was back by Sunday Night and noone noticed.She taught me to think before speaking (still working on that one.)She taught me that using one's gifts for good is a responsibility as much as it is a privilege.She taught me how to speak publicly.She taught me how to be polite and slow down (still working on that one.)She taught me what's important in life is people.I continue to wish her all the best in her fight with cancer. If anyone's going to beat it, it will be her.Thank you. About Scott Scott Hanselman is a former professor, former Chief Architect in finance, now speaker, consultant, father, diabetic, and Microsoft employee. He is a failed stand-up comic, a cornrower, and a book author. About Newsletter Hosting By Comment on this post [3] Share on BlueSky or use the Permalink and post anywhere! August 17, 2004 0:09 Let me be the first to say that I can think of at least two such mentors that helped to steer myself in good direction and out of trouble. While in high school, it had everything to do with Jocelyn Tuthil my ninth grade english teacher and Professor William Lazerath my first computer teacher.This powerfully moving Scott, I also believe she'll make it. Matthew Klump August 19, 2004 22:43 Scott,Marianne Mayfield made the world a better place. I am glad she stood up for you, and therefore gave you the chance to be a better person in the long run. I am grateful for that, I like what I read here on this blog. Thanks for sharing...With Respect and Admiration,David David Wilkinson August 25, 2004 1:27 Scott,Please pass along our best wishes to Mrs. Mayfield-Hill in her continuing battle with cancer. I am a 6 year liver cancer survivor myself, and know it can be done!You were extremely fortunate to have her there for you when you were younger, and she is indeed fortunate to have you (and no doubt other former students) there for her now and in the future.What a great story!Doug Douglas Reilly Comments are closed.'''
