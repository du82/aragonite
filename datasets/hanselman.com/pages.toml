full_description = '''Just exactly HOW powerful is Google? Just WHAT can you find? March 05, 2003 Comment on this post [0] Posted in Web Services | Africa Sponsored By A lot of people comment on the top of the my wife and my Wedding Cake. It has myself (wire-rim glasses, goatee, traditional Scotish Kilt and Sporin) and my wife (with Traditional African Kente Cloth designs and a matching flower arrangement.) They say, "How ever did you find a cake topper like that?" and I say "I googled for 'Scottish Interracial Cake Topper' and well, the rest is history." What kills me is, they usually assume I'm kidding. About Scott Scott Hanselman is a former professor, former Chief Architect in finance, now speaker, consultant, father, diabetic, and Microsoft employee. He is a failed stand-up comic, a cornrower, and a book author. About Newsletter Hosting By Comment on this post [0] Share on BlueSky or use the Permalink and post anywhere! Comments are closed.'''
