full_description = "This newsletter is not going to sell you anything. It is only for fun, is low traffic, and I will NEVER sell your email address. I use Substack to send emails. I sometimes use affiliate links for stuff I like, which pays me in taco money but not quit my job money. .center-wrapper { position: relative; } .center-content { display: flex; align-items: center; justify-content: center; height: 100%; flex-direction: column; } Disclaimer: The opinions expressed herein are my own personal opinions and do not represent my employer's view in any way. I'm a teacher. I speak all over to whoever will listen. I have written code that you've used. I've been blogging for over a decade and podcasting for about half that. I speak, code, write, empower, promote, braid, learn and listen - usually not in that order. More about me."
