["https://hardware.slashdot.org/story/25/02/25/2144252/framework-moves-into-desktops-2-in-1-laptops"]
title = "Framework Moves Into Desktops, 2-In-1 Laptops - Slashdot"
description = 'At its "Second Gen" event today, Framework detailed three new computers: an updated Framework Laptop 13 with AMD Ryzen AI 300, a 4.5-liter Mini-ITX desktop powered by Ryzen AI Max, and a colorful, convertible Framework Laptop 12 designed with students in mind. The latter is defined by Framework as a...'
full_description = '''176544981 story Framework Moves Into Desktops, 2-In-1 Laptops (tomshardware.com) 57 Posted by BeauHD on Tuesday February 25, 2025 @05:10PM from the new-and-shiny dept. At its "Second Gen" event today, Framework detailed three new computers: an updated Framework Laptop 13 with AMD Ryzen AI 300, a 4.5-liter Mini-ITX desktop powered by Ryzen AI Max, and a colorful, convertible Framework Laptop 12 designed with students in mind. The latter is defined by Framework as a "defining product." Tom's Hardware reports: Framework Desktop: The Framework Desktop is a 4.5L Mini-ITX machine using AMD's Ryzen AI Max "Strix Halo" chips with Radeon 8060S graphics. While this is a mobile chip, Framework says putting it in a desktop chassis gets it to 120W sustained power and 140W boost "while staying quiet and cool." Framework says this should allow 1440p gaming on intense titles, as well as workstation-class projects and local AI. [...] The base model, with a Ryzen AI Max 385 and 32GB of RAM, starts at $1,099, while the top-end machine with a Ryzen AI Max+ 395 with 128GB of RAM begins at $1,999. Framework is only doing "DIY" editions here, so you'll have to get your own storage drive and bring your own operating system (the company is calling it "the easiest PC you'll ever build"). The mainboard on its own will be available from $799. Pre-orders are open now, and Framework expects to ship sometime in Q3. Framework Laptop 12: The Laptop 12 is designed to bring the flexibility from the Laptop 12 but make it smaller, cheaper, and in more colors (with an optional stylus to match). These machines are made of ABS plastic molded in thermoplastic polyurethane, all around a metal frame. Framework says that it's "our easiest product ever to repair," but that more information on that will come closer to its launch in mid-2025. I'm really looking forward to this repair guide. It comes in five colorways: lavender, sage, gray, black, and bubblegum. The laptop will come with 13th Gen Intel Core i3 and i5 processors, which aren't the latest, but better than entry-level junk. You'll get up to 48GB of RAM, 2TB of storage, and Wi-Fi 6E. It has a 1920 x 1200 touch screen that the company claims will surpass 400 nits of brightness. There's no pricing information yet, and Framework says there's more to share on pricing and specs later in the year. Pre-orders will open in April ahead of the mid-year launch. Framework Laptop 13: The Framework Laptop 13 is getting a significant refresh with AMD Ryzen AI 300 Series. It doesn't look all that different on the outside, with a 13.5-inch design that largely resembles the one from way back in 2021. But there are new features. Beyond the processors, the Framework Laptop 3 is getting bumped up to Wi-Fi 7 and is getting a new thermal system, a "next-generation" keyboard, and new colorways for the Expansion Cards and bezels (though I still don't know why you would want a bezel in anything other than black). [...] The new Framework Laptop 13 with AMD Ryzen AI 300 starts at $899 for a DIY Edition without storage or an OS, and $1,099 for a pre-built model. If you're buying the mainboard to put in an old system, that's $449. (Framework is keeping the Ryzen 7040 systems around starting at $749). No word for now on any new Intel models. ← You may like to read: → Google, Qualcomm Will Support 8 Years of Android Updates America's Used EV Price Crash Keeps Getting Deeper Is 8GB of RAM Enough For a Mac? California Is Grappling With a Growing Problem: Too Much Solar Will Hurricanes Prompt More Purchases of Electric Cars? Acer To Raise US Laptop Prices 10% After Tariffs Warner Bros Discovery Slashes Gaming Business, Closing Three Studios'''
