["https://hardware.slashdot.org/poll/2120"]
title = "Slashdot Poll | Maximum Items You've Powered From a ..."
full_description = "The Fine Print: The following comments are owned by whoever posted them. We are not responsible for them in any way. In the uk a standard ring main can carry 30 amps at 230 volts if your running a power strip then the plug is rated at 13 amps roughly a 3kw load. Cookers Showers immersion heaters have dedicated wiring. You have to be careful though. Because we use a very large ring main you could easily exceed that with a few electric heaters. Also some people do stupid things like spurs-off-spurs or wiring into the lighting ring. But yeah, generally speaking our sockets are pretty much the best in the world IMHO. They are very safe and the plugs sit in the solidly. You can run a hell of a lot of stuff off them too. Yep. APC 5500VA rackmount UPS on an L6-30 receptacle with 2x 20-port step down transformers powering a couple racks of 2RU graphics servers and video extension equipment. but to be fair while a single 240v30A will hold the load i use 2 with 2x3000VA units - each box has redundant supplies so each on both UPS's.. works great.. and was worth it a couple of weeks ago when a UPS bit the dust. That's only nominally 240V. Many circuits that are called 240V are actually 208V split phase, i.e. the voltage between two phases of a three phase, 120V phase to ground circuit. Since the voltage ratings are usually given +/- 10%, a device that's designed for 220-230V can use either 240V or 208V. And electric ranges often draw more than 30A. More powerful modern ones can be 40A for single oven or 50A for dual oven models. When you upgrade from an inkjet to a real printer like a laserprinter, watch out! You'll be drawing about 2 orders of magnitude more juice while the fusor heats up. It all depends on how much and how you use it. If you were to print only some single sheet documents the inktjet is probably cheaper, because otherwise the printer would have to heat up for each print (smaller cartridges would also be cheaper) . If you have to print 50 pages at once once a week (and let the printer be off in between) the laser is cheaper. Everything boils down to how you use it."
year_published = 2025
