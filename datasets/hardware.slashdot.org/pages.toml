["https://hardware.slashdot.org/story/25/02/27/0149218/german-startup-wins-accolade-for-its-fusion-reactor-design"]
title = "German Startup Wins Accolade For Its Fusion Reactor Design - Slashdot"
description = '''A German nuclear fusion startup called Proxima Fusion has unveiled its "Stellaris" fusion power plant designed to operate reliably and continuously without the instabilities of tokamaks. It's backed by $65 million in funding, with plans to build a fully operational fusion reactor by 2031. TechCrunch...'''
full_description = '''176554881 story German Startup Wins Accolade For Its Fusion Reactor Design (techcrunch.com) 78 Posted by BeauHD on Thursday February 27, 2025 @02:00AM from the powering-the-future dept. A German nuclear fusion startup called Proxima Fusion has unveiled its "Stellaris" fusion power plant designed to operate reliably and continuously without the instabilities of tokamaks. It's backed by $65 million in funding, with plans to build a fully operational fusion reactor by 2031. TechCrunch reports: Tokamaks and stellarators are types of fusion reactors that use electromagnets to contain fusion plasma. Tokamaks rely on external magnets and an induced plasma current but are known for instability. Stellarators, by contrast, use only external magnets, which, in theory, enable better stability and continuous operation. However, according to Dr. Francesco Sciortino, co-founder and CEO of Proxima Fusion, Proxima's "Stellaris" design is the first peer-reviewed fusion power plant concept that demonstrates it can operate reliably and continuously, without the instabilities and disruptions seen in tokamaks and other approaches. Proxima published its findings in Fusion Engineering and Design, choosing to share this information publicly to support open-source science. "Our American friends can see it. Our Chinese friends can see it. Our claim is that we can execute on this faster than anyone else, and we do that by creating a framework for integrated physics, engineering, and economics. So we're not a science project anymore," Sciortino told TechCrunch over a call. "We started out as a group of founders saying it's going to take us two years to get to the Stellaris design ... We actually finished after one year. So we've accelerated by a year," he added. ← You may like to read: → Tokyo Is Turning To a 4-Day Workweek To Shed 'World's Oldest Population' Title America's Used EV Price Crash Keeps Getting Deeper Is 8GB of RAM Enough For a Mac? California Is Grappling With a Growing Problem: Too Much Solar Will Hurricanes Prompt More Purchases of Electric Cars? Acer To Raise US Laptop Prices 10% After Tariffs Jensen Huang: AI Has To Do '100 Times More' Computation Now Than When ChatGPT Was Released'''
