title = "Slashdot Poll | How often do you listen to ..."
full_description = '''The Fine Print: The following comments are owned by whoever posted them. We are not responsible for them in any way. I suspect the point is that we all have the ability to listen to emergency alerts when necessary and cars are a good focal point for the large portion of the US population who own one. Not that anyone really listens to AM radio regularly. Down here in TX AM is infested with shitty evangelical noise 100% of the time. I haven't turned on my car radio function *at all* in 10 years, the local stations were always playing the same shitty playlist of whatever the music industry is pushing today and that gets old I've been licensed since 2002 and I could probably count on one hand the number of times I've met fellow hams that are younger than I am. Be careful talking about it in public and making it seem not cool, or else you risk making it the next retro-fad like LPs. "My parents and grandparents think it's not cool? Oh, I am so there!" I'm too cheap to buy a HF Transmitter, but I do have a shortwave radio and an SDR just to listen to the other bands, I think the thing I hear the most of are preachers. But many of them duplicated on multiple bands. Yeah, I remember when I got my first HF transceiver, I was excited that I would be able to listen to shortwave. All I ever managed to hear were preachers, conspiracy theorists, and Radio Havana Cuba. The last one freaked me out, because they'd do English language broadcasts, and I can remember two announcers, one male, one female, with perfect midwest American accents. That was years ago now, but I imagine their English language broadcasts are still like that. I used to keep a 2m/70cm transceiver in my car, with dreams of eventually installing a HF rig. I've been away from the hobby now for several years though, although I still have and maintain my license. As for learning, it's really not that complicated, especially is someone has a basic electrical engineering background. I'm very bad in a classroom environment, so simple book learning was good enough for me to get my General-class. The ARRL manuals are pretty good, but for my money, the books by Gordon West a'''
