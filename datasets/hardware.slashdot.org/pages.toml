title = "Fast New 3D Printing Technique Shines Holograms into Resin - Slashdot"
description = 'Can a new 3D-printing technique shorten 3D printing times to just seconds?    A team of researchers in Europe has modified Tomographic Volumetric Additive Manufacturing, which can "create entire objects in one shot by shining light patterns into liquid resin," according to the 3D Printing Industry b...'
full_description = '''176584221 story Fast New 3D Printing Technique Shines Holograms into Resin (3dprintingindustry.com) 13 Posted by EditorDavid on Sunday March 02, 2025 @11:34AM from the fresh-prints dept. Can a new 3D-printing technique shorten 3D printing times to just seconds? A team of researchers in Europe has modified Tomographic Volumetric Additive Manufacturing, which can "create entire objects in one shot by shining light patterns into liquid resin," according to the 3D Printing Industry blog. (The liquid resin then solidifies when the light intensity is high enough...) While this approach can fabricate support-free, micro-scale parts within tens of seconds, it is "highly inefficient." This is because under 1% of the encoded light reaches the resin vial. Conventional TVAM can also lead to unwanted distortions and poor resolution due to light blurring and projection artifacts. To address these limitations, the researchers developed HoloVAM, a new technique that uses a 3D hologram instead of conventional volumetric light projections. This approach reportedly boosts light efficiency by 20 times, resulting in faster and more accurate 3D printing. According to their paper, published in Nature Communications, HoloVAM successfully fabricated several millimeter-scale objects in under 60 seconds with fine details as small as 31 micrometers... They believe this new approach offers value for medical bioprinting applications, thanks to HoloVAM's use of "self-healing beams." These can generate and retain their shape when passing through materials, which is particularly valuable when 3D printing with cell-laden bio-resins and hydrogels. Thanks to Slashdot reader BizarreVR for sharing the news. ← You may like to read: → First Petawatt Electron Beam Arrives, Ready To Rip Apart Matter and Space America's Used EV Price Crash Keeps Getting Deeper Is 8GB of RAM Enough For a Mac? California Is Grappling With a Growing Problem: Too Much Solar Will Hurricanes Prompt More Purchases of Electric Cars? Acer To Raise US Laptop Prices 10% After Tariffs Submission: New Holographic TVAM 3D Printing Method Accelerates Production (function($){ $('.js_disp_only').show(); $('a.jshandle_related').on('click', '', function(e) { e.preventDefault(); var url = $(this).data('goto-url'); window.location = url }); })($j); Ask Slashdot: Would You Accept a Free Ride Into Space?'''
