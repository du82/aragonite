["https://hardware.slashdot.org/poll/1453/at-what-gas-price-would-you-telecommute"]
title = "Slashdot Poll | US Gasoline Prices Spur Telework ..."
full_description = '''The Fine Print: The following comments are owned by whoever posted them. We are not responsible for them in any way. Because realistically the federal government should only be involved in those things that nearly everyone agrees it should be involved in, otherwise leave it up to local That was the thought behind the 9th and 10th Amendments which sought to limit the rights and powers of the federal government to a small, and explicit, set of duties and, in doing so, prevent the runaway abuse of government by the established gentry such as they had in England. We're so far away from that now that nothing short of a revolution of monumental proportions could ever set the record straight. ...that would be bad for the USA. We have our own problems. We don't need to add more problems and make eve Such high prices in Europe does not hurt the European standard of living because many Europeans use public transportation; bus and trains are relatively cheap to ride. In the USA, many Americans refuse to use public transportation due to class snobbery. In my neck of the woods, about 80% of the passengers on the bus is either impoverished Americans (from ghetto neighborhoods) or illegal aliens from Mexico. The occupancy of the buses is about 50% during most of the day. Meanwhile, the freeways are packed with late-model cars driven by the wealthier class. Frankly, even if gas prices increased to $10 per gallon in the USA, Americans would not necessarily experience a decline in their standard of living -- if they use public transportation. It is cheap although it may be slighly inconvenient because you must time your life according to the bus or train schedule. Note that American politicians never compare European gas prices to American gas prices. The politicians just tell Americans what they want to hear: "Gas at $3.50 is too expensive. We Americans are a sad, pathetic victim of the greedy oil companies. We should force them to lower gas prices back to $1.50 per gallon so we can enjoy your monster SUV."'''
