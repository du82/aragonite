title = "Microsoft Trims More CPUs From Windows 11 Compatibility List - Slashdot"
description = "Microsoft has updated its CPU compatibility list for Windows 11 24H2, excluding pre-11th-generation Intel processors for OEMs building new PCs. The Register reports:  Windows 11 24H2 has been available to customers for months, yet Microsoft felt compelled in its February update to confirm that build..."
full_description = '''176426005 story Microsoft Trims More CPUs From Windows 11 Compatibility List (theregister.com) 95 Posted by BeauHD on Monday February 24, 2025 @08:40PM from the PSA-to-OEMs dept. Microsoft has updated its CPU compatibility list for Windows 11 24H2, excluding pre-11th-generation Intel processors for OEMs building new PCs. The Register reports: Windows 11 24H2 has been available to customers for months, yet Microsoft felt compelled in its February update to confirm that builders, specifically, must use Intel's 11th-generation or later silicon when building brand new PCs to run its most recent OS iteration. "These processors meet the design principles around security, reliability, and the minimum system requirements for Windows 11," Microsoft says. Intel's 11th-generation chips arrived in 2020 and were discontinued last year. It would be surprising, if not unheard of, for OEMs to build machines with unsupported chips. Intel has already transitioned many pre-11th generation chips to "a legacy software support model," so Microsoft's decision to omit the chips from the OEM list is understandable. However, this could be seen as a creeping problem. Chips made earlier than that were present very recently, in the list of supported Intel processors for Windows 11 22H2 and 23H2. This new OEM list may add to worries of some users looking at the general hardware compatibility specs for Windows 11 and wondering if the latest information means that even the slightly newer hardware in their org's fleet will soon no longer meet the requirements of Microsoft's flagship operating system. It's a good question, and the answer -- currently -- appears to be that those "old" CPUs are still suitable. Microsoft has a list of hardware compatibility requirements that customers can check, and they have not changed much since the outcry when they were first published. ← You may like to read: → Google's AI Previews Erode the Internet, Edtech Company Says In Lawsuit America's Used EV Price Crash Keeps Getting Deeper Is 8GB of RAM Enough For a Mac? California Is Grappling With a Growing Problem: Too Much Solar Will Hurricanes Prompt More Purchases of Electric Cars? Acer To Raise US Laptop Prices 10% After Tariffs VPN Providers Consider Exiting France Over 'Dangerous' Blocking Demands'''
