full_description = "176249615 comment Comment Re:Open Source activism is now a thing :o (Score 0) 68 by sfcat on Friday February 14, 2025 @03:00PM (#65166983) Attached to: Lead Asahi Linux Developer Quits Days After Leaving Kernel Maintainer Role Activist is just what we call immature people now...OK. 176036393 comment Comment Re: EGGROLL TIME (Score 1) 50 by sfcat on Friday January 24, 2025 @06:17PM (#65116543) Attached to: Chinese Fusion Reactor Maintains Steady State For Almost 18 Minutes Its so cute that you believe the numbers the CCP puts out. It also means that none of us have to listen to you. What are you, 6 years old? 176036377 comment Comment Re:Nice, if true. (Score 1) 50 by sfcat on Friday January 24, 2025 @06:14PM (#65116531) Attached to: Chinese Fusion Reactor Maintains Steady State For Almost 18 Minutes We would be lucky to be able to make something that extracts 1% of the energy from this reactor That's because its heat is 1000000C. At 300C we can extract over 50% (up to 60% for a very efficient plant). But that's because we have materials that can handle 300C but there is nothing we know of that can handle 1000000C. I have no idea where you got the 25% number from, that's about half what it is in practice. For a fusion reactor however, we have no idea but achieving 1% would be a miracle. Most fission reactors make 2x the heat as electricity. 2GW of heat and 1GW of power is a pretty standard size for a powerplant. 175950921 submission Submission + - 750 MW PG&E Battery On Fire in California (apnews.com) Submitted by sfcat on Friday January 17, 2025 @02:40AM sfcat writes: Hundreds of people were ordered to evacuate and part of Highway 1 in Northern California was closed when a major fire erupted Thursday afternoon at one of the world’s largest battery storage plants.As the fire sent up towering flames and black smoke and showed no sign of easing by Thursday night, about 1,500 people were instructed to leave Moss Landing and the Elkhorn Slough area, The Mercury News reported.The Moss Landing Power Plant, located about 77 miles (about 124 kilometers) south of San Francisco, is owned by Texas-company Vistra Energy and contains tens of thousands of lithium batteries. The batteries are important for storing electricity from such renewable energy sources as solar energy, but if they go up in flames the blazes can be extremely difficult to put out.“There’s no way to sugar coat it. This is a disaster, is what it is,” Monterey County Supervisor Glenn Church told KSBW-TV. But he said he did not expect the fire to spread beyond the concrete building it was enclosed in."
