full_description = '''173607386 story AI Needs So Much Electricity That Tech Companies Are Getting Into Energy Business (sherwood.news) 50 Posted by msmash on Monday April 22, 2024 @11:01AM from the adjacent-race-begins dept. An anonymous reader shares a report: To accommodate tech companies' pivots to artificial intelligence, tech companies are increasingly investing in ways to power AI's immense electricity needs. Most recently, OpenAI CEO Sam Altman invested in Exowatt, a company using solar power to feed data centers, according to the Wall Street Journal. That's on the heals of OpenAI partner, Microsoft, working on getting approval for nuclear energy to help power its AI operations. Last year Amazon, which is a major investor in AI company Anthropic, said it invested in more than 100 renewable energy projects, making it the "world's largest corporate purchaser of renewable energy for the fourth year in a row." ← You may like to read: → Russian Court Sentences Meta Spokesperson To Six Years in Absentia, Calls Meta 'Extremist Organisation' America's Used EV Price Crash Keeps Getting Deeper Is 8GB of RAM Enough For a Mac? California Is Grappling With a Growing Problem: Too Much Solar Will Hurricanes Prompt More Purchases of Electric Cars? Acer To Raise US Laptop Prices 10% After Tariffs Biden Marks Earth Day by Announcing $7 Billion in Solar Power Grants'''
