title = "jjslash - Slashdot User"
full_description = "176616339 submission Submission + - TCL overtakes LG to become second-largest premium TV brand (techspot.com) Submitted by jjslash on Tuesday March 04, 2025 @05:21PM jjslash writes: TCL has emerged as a dominant force in the premium TV market, surpassing LG in global shipments and solidifying its position as a key competitor to Samsung. According to Counterpoint Research, TCL’s premium TV shipments more than doubled year-on-year in Q4 2024, capturing 20% of the market, while LG’s share fell to 19%. TechSpot reports:You'd be forgiven for thinking TCL is behind LG when it comes to premium TV shipments. TCL, known for its affordable yet high-quality 4K, QLED, and Mini-LED TVs, shipped more than twice as many premium TVs YoY in Q4 2024. It captured 20% of global premium TV shipments. That puts it ahead of LG, which held a 19% share. The two companies' shipment figures have gone in opposite directions since Q4 2023, when LG held a 26% share and TCL was on 12%. 176616301 submission Submission + - Nvidia RTX 5070 Reviewed: Overpromised, Underdelivered... 1 Submitted by jjslash on Tuesday March 04, 2025 @05:16PM jjslash writes: Nvidia’s RTX 5070 was initially hyped as delivering RTX 4090-level performance for just $550, based on claims made by CEO Jensen Huang during his CES keynote. However, excitement faded when it was revealed that Nvidia’s marketing relied on multi-frame generation, making the performance comparison entirely misleading. TechSpot's review opened with a single head to head test comparing those two GPUs, the results are astounding:In reality, the RTX 4090 is, on average, 63% faster than the RTX 5070 across our 16-game sample at 1440p. But the deception gets even worse when we turn to ray tracing, as there are cases where the RTX 5070 doesn't work at all due to its much more limited 12GB VRAM buffer. The review concludes saying that the RTX 5070 offers little excitement, as it’s essentially a slightly cheaper RTX 4070 Super. While it can sometimes rival the RTX 4070 Ti Super, its 12GB of VRAM limits its competitiveness."
