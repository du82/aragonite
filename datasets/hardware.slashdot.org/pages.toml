full_description = '''176545803 story A Major Blackout Hits Chile, Leaving Millions Without Power (apnews.com) 27 Posted by BeauHD on Tuesday February 25, 2025 @07:20PM from the back-to-the-Stone-Age dept. A massive blackout has hit Chile, leaving millions without power and disrupting transportation, businesses, and essential services across 14 of the country's 16 regions. The Associated Press reports: The National Electrical Coordinator, Chile's grid operator, said a disruption had occurred in a high-voltage transmission line that carries power from the Atacama Desert of northern Chile to the capital of Santiago in the country's central valley. It did not say what actually caused the disruption that pushed much of the country's power grid into shutdown, from the northernmost Chilean port of Arica to the southern Los Lagos agricultural region. Interior Minister Carolina Toha said hospitals, prisons and government buildings were switching on backup generators to keep essential equipment operating. In a press conference, Toha urged the public to stay calm and said officials were racing to put the grid back in operation and restore electric service across the country of some 19 million people. "It's affecting the entire electrical system of the country," she said of the breakdown in the 500-kV backbone transmission line. Toha said if all areas didn't return to normal by sunset the government would take emergency measures to avert a crisis. [...] Videos on social media from all over Chile, a long ribbon of a country stretching 4,300 kilometers (over 2,600 miles) along the southern Pacific coast, showed chaos at intersections with no functioning traffic lights, people having to use their mobile phones as torches in the underground metro and police dispatched to help evacuate office buildings. ← You may like to read: → DoorDash Paying Drivers $17 Million For Stolen Tips America's Used EV Price Crash Keeps Getting Deeper Is 8GB of RAM Enough For a Mac? California Is Grappling With a Growing Problem: Too Much Solar Will Hurricanes Prompt More Purchases of Electric Cars? Acer To Raise US Laptop Prices 10% After Tariffs Denmark To Ban Mobile Phones In Schools and After-School Clubs'''
