full_description = "176546101 story World's First Front-Flippin' Humanoid Robot (newatlas.com) 23 Posted by BeauHD on Tuesday February 25, 2025 @08:40PM from the showing-off dept. Chinese robotics company Zhongqing Robotics (also known as Engine AI) posted a video of what is claimed to be the world's first humanoid robot front flip. New Atlas reports: Ten years ago, this kind of stuff simply did not exist. And now you can buy your very own open-source PM01 robot for US$13,700, according to EngineAI's website. Its specs aren't bad: 5-DoF (degrees of freedom) in each arm and six per leg. That's 23-DoF in body movement in total. The bot also boasts 221 lb-ft of torque (300 Nm), which seems like quite a punch when the little guy is only 4.5 ft (138 cm) tall and weighs 88 lb (40kg). You can watch the video here. ← You may like to read: → Denmark To Ban Mobile Phones In Schools and After-School Clubs America's Used EV Price Crash Keeps Getting Deeper Is 8GB of RAM Enough For a Mac? California Is Grappling With a Growing Problem: Too Much Solar Will Hurricanes Prompt More Purchases of Electric Cars? Acer To Raise US Laptop Prices 10% After Tariffs To Identify Suspect In Idaho Killings, FBI Used Restricted Consumer DNA Data"
