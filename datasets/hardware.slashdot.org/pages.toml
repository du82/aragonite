["https://hardware.slashdot.org/poll/3269/do-stories-about-bitcoin-cause-you-to-feel-anger"]
title = "Slashdot Poll | Do stories about Bitcoin cause you ..."
full_description = '''The Fine Print: The following comments are owned by whoever posted them. We are not responsible for them in any way. But I feel more sadness than anger. Bugs me to watch suckers getting exploited by their human natures. Did you know that you can train monkeys to gamble? And that young chimps will gamble for bigger stakes than the older ones? * Yes* No* Not as much as CowboyNeal* More than CowboyNeal* Ask CowboyNeal [how I feel]* I [feel the same way] as CowboyNeal However we're already deep into fantasy-based economics, especially as regards stock prices and the related market caps. On that side, I think a transaction fee for every trade would be a really good thing and might create some pressure for normalization... As a general solution, I think economics needs to be reconsidered. My own version would be ekronomics based on time >> money. (Talk about imaginary values... The vast majority of fiat currency doesn't exist either. Somebody actually has made physical bitcoins before though, see the casascias coin. You can print the Bitcoin hash. There's intrinsic value there (and it is worth more than the paper it is printed on). All fiat currencies are backed by their governments. Who is backing bitcoin exactly? Money launderers and criminals is the answer generally to that. Government backing only means as much as you trust the particular government with your stored value to properly manage its central bank. Cryptocurrency trust is only on the actual protocols involved, and whether you trust that they will work as designed. I feel a bit of regret that I didn't run up some bitcoins when it was the early days, but it is what it is. In the short term. I had the same answer over ten years ago. In the long term it could work out as profitable... but you can't know that for sure. Nit-pick, this doesn't change the spirit or meaning of your post, but I would posit that there isn't a such thing as "fake" money as long as people are using it for trade. Historically everything from notches on wood (tally sticks) to salt and pepper has been used as currency. Money is just a commodity that is used for intermediary trade. The idea being that if you had to barter your services as a software developer'''
