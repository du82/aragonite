description = "Fabled RepairTuber and right-to-repair crusader Louis Rossmann accuses Brother of implementing forced firmware updates that block third-party ink cartridges and remove older firmware versions from support portals. These updates also prevent color calibration with aftermarket ink, rendering cheaper c..."
full_description = '''176616075 story Brother Accused of Locking Down Third-Party Printer Ink Cartridges Via Forced Firmware Updates (tomshardware.com) 89 Posted by BeauHD on Tuesday March 04, 2025 @06:00PM from the anti-consumer dept. Fabled RepairTuber and right-to-repair crusader Louis Rossmann accuses Brother of implementing forced firmware updates that block third-party ink cartridges and remove older firmware versions from support portals. These updates also prevent color calibration with aftermarket ink, rendering cheaper cartridges unusable. Tom's Hardware reports: As mentioned in the intro, Rossmann has seen two big issues emerge for Brother printer users with recent firmware updates. Firstly, models that used to work with aftermarket ink, might refuse to work with the same cartridges in place post-update. Brother doesn't always warn about such updates, so Rossmann says that it is important to keep your printer offline, if possible. Moreover, he reckons it is best to keep your printers offline, and "I highly suggest that you turn off your updates," in light of these anti-consumer updates. Another anti-consumer problem Rossmann highlights affects color devices. He cites reports from a Brother MFP user who noticed color calibration didn't work with aftermarket inks post-update. They used to work, and if the update doesn't allow the printer to calibrate with this aftermarket ink the cheaper carts become basically unusable. Making matters worse, and an aspect of this tale which seems particularly dastardly, Rossmann says that older printer firmware is usually removed from websites. This means users can't roll back when they discover the unwanted new 'features' post-update. While he admittedly can't do much about these printer industry machinations, Rossmann says it feels important to document these changes which show that property rights for individuals are disappearing. Additional info about Brother's issues are available on Rossmann's wiki. ← You may like to 