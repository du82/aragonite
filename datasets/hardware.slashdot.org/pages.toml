["https://hardware.slashdot.org/poll/1419/better-cpus-in-2008"]
title = "Slashdot Poll | AMD's Barcelona to Outpace Intel by ..."
full_description = "The Fine Print: The following comments are owned by whoever posted them. We are not responsible for them in any way. Not true. I have a top of the line computer from 3.5 years ago, and it cannot play high def trailers. Combine this with lots of flash video, video conferencing, etc. and you have various cpu needs that need to be met. It is hard for me to believe too, but flash and quicktime are pushing the needs of people's hardware. This is an indication that the code sucks. You should be able to play almost anything with a processor rated as 3000+ or better. I am sure that you can find some unrealistic 1080p/MPEG4 cont That's why we're constantly hearing about the performance advantages of Penryn. If anything, AMD has been a bit quieter than Intel. Compare the references on the Wikipedia pages for Barcelona and Penryn if you want evidence. Selling's about kissing ass and pushing off whatever it is you're selling on whoever has a wallet, no matter what their needs. Ok, at the retail level maybe not so much. But any sales job that pays close to 6 figures, yep. Yeah, I'll pass. And I'll be doing what I want when I leave work at 4:3 Be a power saver. When Intel came out with Centrino, I bought one almost at launch. When AMD came out with Winchester, the Athlon 64 that made the gigantic leap in price/performance/watt, I bought two. When nVidia started making lower-clocked GPUs that didn't need a fan and wiped the floor with ATI in price/performance/watt, I bought three over 3 years (6200, 7600, and now, 8500) (that was the main reason - the other one being ATI's shitty drivers for Linux). Now, I'm looking at a new ultraportable, and AM And I assume there's a strong correlation between power and noise. Most people's homes are quiet enough for a loud machine to really call attention to itself. What's really relevant to me is the performance per dollar ... not just dollar of CPU cost, but also dollar of whole system cost (including software, if that goes above zero), and dollar of energy cost (including the cost of shoving waste energy out the back door in seasons I does me no good to keep it indoors)."
