full_description = "176623007 story Apple Refreshes MacBook Air With M4 Chip, Lower Pricing (apple.com) Posted by msmash on Wednesday March 05, 2025 @11:00AM from the speeds-and-feeds dept. Apple has refreshed its MacBook Air lineup with the M4 processor, adding a new sky blue color option and reducing prices across the board. The 13-inch model now starts at $999, while the 15-inch begins at $1,199. Both models are available to order immediately and will ship on March 12. The updated MacBook Airs feature the same thin design as previous generations but now include the 12-megapixel Center Stage webcam found in current MacBook Pro models. Both variants come with the M4 chip, aligning them with Apple's recent Mac Mini, iMac, and MacBook Pro refreshes. Base configurations include an M4 with a 10-core CPU and 8-core GPU, 16GB of unified memory, and 256GB of storage. Customers can upgrade to a 10-core GPU (matching the base 14-inch MacBook Pro), 32GB of RAM, and up to 2TB of storage. A significant technical improvement is the support for two external 6K displays while keeping the laptop's lid open, addressing a limitation of previous Air models. 176622307 story Google Urges DOJ To Reverse Course on Breaking Up Company (yahoo.com) 15 Posted by msmash on Wednesday March 05, 2025 @10:00AM from the how-about-that dept. Google is urging officials at President Donald Trump's Justice Department to back away from a push to break up the search engine company, citing national security concerns, Bloomberg reported Wednesday, citing sources familiar with the discussions. From the report: Representatives for the Alphabet unit asked the government in a meeting last week to take a less aggressive stance as the US looks to end what a judge ruled to be an illegal online search monopoly, said the people, who asked not to be identified discussing the private deliberations. The Biden administration in November had called for Google to sell its Chrome web browser and make other changes to its business including an end to billions of dollars in exclusivity payments to companies including Apple. Although Google has previously pushed back on the Biden-era plan, the recent discussions may preview aspects of the company's approach to the case as it continues under the Trump administration. A federal judge is set to rule on how Google must change its practices following hearings scheduled for next month. Both sides are due to file their final proposals to the judge on Friday."
