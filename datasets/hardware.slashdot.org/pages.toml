["https://hardware.slashdot.org/story/24/04/17/2324242/is-8gb-of-ram-enough-for-a-mac"]
title = "Is 8GB of RAM Enough For a Mac? - Slashdot"
description = '''Apple is doubling down on 8GB of RAM for many of its entry-level Macs, claiming that it's "suitable for many tasks," including browsing, video streaming and even "light" video and image editing. As of this writing, all MacBook Air laptops, the Mac Mini, and the MacBook Pro 14 all start with a base c...'''
full_description = '''173565514 story Is 8GB of RAM Enough For a Mac? (pcgamer.com) 465 Posted by BeauHD on Thursday April 18, 2024 @05:00AM from the classic-Apple dept. Apple is doubling down on 8GB of RAM for many of its entry-level Macs, claiming that it's "suitable for many tasks," including browsing, video streaming and even "light" video and image editing. As of this writing, all MacBook Air laptops, the Mac Mini, and the MacBook Pro 14 all start with a base configuration of 8GB RAM -- which can't be upgraded at a later date since the RAM is soldered onto the motherboard. "That might have been OK were it not for the fact that Apple charges a ridiculous $200 to upgrade any of those machines from 8GB to 16GB," notes PC Gamer's Jeremy Laird. Even if an 8GB Mac does some of the previously stated tasks tolerably well, Laird argues that "8GB still isn't acceptable." From the report: That's because a Mac with 8GB can easily run out of memory just browsing the web. That's particularly true with Chrome, which just so happens to be the most popular browser around. Regular Chrome users will know what a memory hog Chrome can be. Right now, I have about 15 tabs open, which is actually pretty low for me. Often, my tab count can blow well past 50 in multiple windows. Handily, Chrome shows you memory usage if you mouse-over a given tab. And three of my current tabs are chewing up over 500MB each. So, that's 1.5GB for just three Chrome tabs. Add a couple more, plus MacOS's underlying memory footprint for just being up and running and you're bang out of RAM. Overall, I'm using 12.5GB of memory and the only application I have open is Chrome. Oh, and did I mention I'm typing this on a 16GB MacBook Air? I used to have an 8GB Apple silicon Air and to be frank it was a nightmare, constantly running out of memory just browsing the web. That's the point most observers miss. The usual narrative is that 8GB isn't good enough for serious workflows. It isn't but that completely misses the more important point. 8GB isn't even enough for browsing the web. ← You may like to read: → Sweden Becomes 38th Country To Sign NASA's Artemis Accords For Moon Exploration America's Used EV Price Crash Keeps Getting Deeper California Is Grappling With a Growing Problem: Too Much Solar Will Hurricanes Prompt More Purchases of Electric Cars? Acer To Raise US Laptop Prices 10% After Tariffs Can Heat Pumps Still Save the Planet from Climate Change? Inside Amazon's Secret Operation To Gather Intel on Rivals'''
