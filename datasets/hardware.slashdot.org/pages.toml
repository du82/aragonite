["https://hardware.slashdot.org/poll/1431/comcast-ceo-shows-off-superfast-modem"]
title = "Slashdot Poll | Comcast CEO Shows Off Superfast Modem ..."
full_description = '''The Fine Print: The following comments are owned by whoever posted them. We are not responsible for them in any way. See, the problem is that here in the U.S., we're not accustomed to metric measurements and notation. Megabits, kilobytes, these things mean nothing to us. Therefore, I propose the U.S. instate a new standard of measurement in accordance with our SI units. There will be 3 bits in a byte, 5,280 bits in a kilobyte, and 43,560 square bits (or 4,840 square bytes) in a megabyte. I think we can all agree that this is much more logical. I always thought the trend was towards faster, newer, better, but apparently getting 100 millibits per second is the new goal! Err, wait, is Verizon filling in for zonk? That one physical cable going to your home has hundreds of channels, each with a different carrier frequency. DOCSIS 3.0 bonds several of those channels together so that they appear as a single channel to the user. Analog channels are about to die at least out here in Southern California they have been in preparing to open those spectrum for bandwidth, HDTV and VOD, although OTA will still be available it seems like you are now gonna have to get a box for each television for digital. Actually, as I understand it, the cable companies will continue to provide the analog channels they do now... at least, the same ones that are currently broadcast Over the Air. If you get TV programming from your cable company, you're What I don't get is the "bonds together four cable lines" bit. Does that mean you need to lay 3 more wires alongside the current one, or can this be done with the same physical cable that we already have? If it requires burying more cables, then it would be foolish to not bury a fiber optic cable. They really meant "channels" not physical cables; apparently you can take the equivalent of 4 analog TV channels and assign them for data use, and bond them together to make one much-faster connection. However, the I don't think the upload speed of DOCSIS 3.0 will come anywhere near the download speed, so your site-to-site will be measured by your maximum upload speed only, which was carefully not mentioned in the article.'''
