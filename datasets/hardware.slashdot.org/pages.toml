full_description = '''176617507 story China May Be Ready to Use Nuclear Fusion for Power by 2050 (yahoo.com) 26 Posted by BeauHD on Wednesday March 05, 2025 @02:00AM from the what-to-expect dept. China plans to commercialize nuclear fusion for emissions-free power generation by 2050, with its first operational project expected around 2050 after a demonstration phase starting in 2045. Bloomberg reports: China National Nuclear Corp. (CNNC) last year formed an industry alliance and set up a new national fusion company, the China Fusion Corp. It has attracted about 1.75 billion yuan ($240 million) in investment from CNNC and Zhejiang Zheneng Electric Power Co. for cutting-edge tokamak devices, which use magnetic fields to confine and control superheated plasma to produce power without emissions or significant radioactive waste. CNNC also plans to scale up production of its homegrown designs for regular nuclear fission reactors and small modular reactors over the next five years, the company's Vice General Manager Xin Feng said at the briefing. China is set to leapfrog the US and France as the owner of the world's biggest reactor fleet by 2030. About 10 new reactors have been approved every year since power shortages emerged in 2022 and the country is expected to keep up that pace through 2030 to meet climate goals, CNNC said on Friday. 176616075 story Brother Accused of Locking Down Third-Party Printer Ink Cartridges Via Forced Firmware Updates (tomshardware.com) 89 Posted by BeauHD on Tuesday March 04, 2025 @06:00PM from the anti-consumer dept. Fabled RepairTuber and right-to-repair crusader Louis Rossmann accuses Brother of implementing forced firmware updates that block third-party ink cartridges and remove older firmware versions from support portals. These updates also prevent color calibration with aftermarket ink, rendering cheaper cartridges unusable. Tom's Hardware reports: As mentioned in the intro, Rossmann has seen two big issues emerge for Brother printer users with recent firmware updates. Firstly, models that used to work with aftermarket ink, might refuse to work with the same cartridges in place post-update. Brother doesn't always warn about such updates, so Rossmann says that it is important to keep your printer offline, if possible. Moreover, he reckons it is best to keep your printers offline, and "I highly suggest that you turn off your updates," in light of these anti-consumer updates. Another anti-consumer problem Rossmann highlights affects color devices. He cites reports from a Brother MFP user who noticed color calibration didn't work with aftermarket inks post-update. They used to work, and if the update doesn't allow the printer to calibrate with this aftermarket ink the cheaper carts become basically unusable. Making matters worse, and an aspect of this tale which seems particularly dastardly, Rossmann says that older printer firmware is usually removed from websites. This means users can't roll back when they discover the unwanted new 'features' post-update. While he admittedly can't do much about these printer industry machinations, Rossmann says it feels important to document these changes which show that property rights for individuals are disappearing. Additional info about Brother's issues are available on Rossmann's wiki.'''
