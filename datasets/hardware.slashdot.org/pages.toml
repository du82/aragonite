full_description = "176617507 story China May Be Ready to Use Nuclear Fusion for Power by 2050 (yahoo.com) 26 Posted by BeauHD on Wednesday March 05, 2025 @02:00AM from the what-to-expect dept. China plans to commercialize nuclear fusion for emissions-free power generation by 2050, with its first operational project expected around 2050 after a demonstration phase starting in 2045. Bloomberg reports: China National Nuclear Corp. (CNNC) last year formed an industry alliance and set up a new national fusion company, the China Fusion Corp. It has attracted about 1.75 billion yuan ($240 million) in investment from CNNC and Zhejiang Zheneng Electric Power Co. for cutting-edge tokamak devices, which use magnetic fields to confine and control superheated plasma to produce power without emissions or significant radioactive waste. CNNC also plans to scale up production of its homegrown designs for regular nuclear fission reactors and small modular reactors over the next five years, the company's Vice General Manager Xin Feng said at the briefing. China is set to leapfrog the US and France as the owner of the world's biggest reactor fleet by 2030. About 10 new reactors have been approved every year since power shortages emerged in 2022 and the country is expected to keep up that pace through 2030 to meet climate goals, CNNC said on Friday. ← You may like to read: → Users Report Emotional Bonds With Startlingly Realistic AI Voice Demo America's Used EV Price Crash Keeps Getting Deeper Is 8GB of RAM Enough For a Mac? California Is Grappling With a Growing Problem: Too Much Solar Will Hurricanes Prompt More Purchases of Electric Cars? Acer To Raise US Laptop Prices 10% After Tariffs World's First 'Synthetic Biological Intelligence' Runs On Living Human Cells"
