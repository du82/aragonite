["https://hardware.slashdot.org/story/25/01/17/2135226/fire-erupts-at-huge-battery-plant-in-california"]
title = "Fire Erupts At Huge Battery Plant In California - Slashdot"
description = "Longtime Slashdot reader sfcat shares a report from the Associated Press: Hundreds of people were ordered to evacuate and part of Highway 1 in Northern California was closed when a major fire erupted Thursday afternoon at one of the world's largest battery storage plants. As the fire sent up towerin..."
full_description = '''175962205 story Fire Erupts At Huge Battery Plant In California (gpb.org) 113 Posted by BeauHD on Friday January 17, 2025 @04:40PM from the can't-catch-a-break dept. Longtime Slashdot reader sfcat shares a report from the Associated Press: Hundreds of people were ordered to evacuate and part of Highway 1 in Northern California was closed when a major fire erupted Thursday afternoon at one of the world's largest battery storage plants. As the fire sent up towering flames and black smoke and showed no sign of easing by Thursday night, about 1,500 people were instructed to leave Moss Landing and the Elkhorn Slough area, The Mercury News reported. The Moss Landing Power Plant, located about 77 miles (about 124 kilometers) south of San Francisco, is owned by Texas-company Vistra Energy and contains tens of thousands of lithium batteries. The batteries are important for storing electricity from such renewable energy sources as solar energy, but if they go up in flames the blazes can be extremely difficult to put out. "There's no way to sugar coat it. This is a disaster, is what it is," Monterey County Supervisor Glenn Church told KSBW-TV. But he said he did not expect the fire to spread beyond the concrete building it was enclosed in. According to reports, the fire originated in the 300-megawatt Phase I section of the 750-megawatt facility, located on the site of a retired PG&E natural gas plant. It's unclear what caused the fire, but officials said a full investigation will begin after it's out. Thankfully, everyone at the site was evacuated safely. Videos and images of the fire can be found here. ← Related Links → Microsoft-OpenAI Partnership Raises Antitrust Concerns, FTC Says Submission: 750 MW PG&E Battery On Fire in CaliforniaCalifornia's Battery Plant Fire Sparks Call for Investigation, New RegulationsLithium Batteries Reignited Tuesday at the Moss Landing Power Plant Fire Site (function($){ $('.js_disp_only').show(); $('a.jshandle_related').on('click', '', function(e) { e.preventDefault(); var url = $(this).data('goto-url'); window.location = url }); })($j); Russian Disinformation Campaigns Eluded Meta's Efforts To Block Them'''
