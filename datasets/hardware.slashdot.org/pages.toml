["https://hardware.slashdot.org/story/24/09/02/0117259/green-energy-from-storage-batteries-are-replacing-fossil-fuels-in-california---and-texas"]
title = "Green Energy from Storage Batteries are Replacing Fossil Fuels in California - and Texas - Slashdot"
description = "1.9 million solar panels began operating this year in California &mdash; at a Mortenson facility with 120,000 installed batteries that give it a storage capacity of 3,280 megawatts.  An article in El Pais notes that this helped California pass 10,000 megawatts of photovoltaic storage in April ..."
full_description = '''174893704 story Green Energy from Storage Batteries are Replacing Fossil Fuels in California - and Texas (elpais.com) 152 Posted by EditorDavid on Sunday September 01, 2024 @09:09PM from the going-green dept. 1.9 million solar panels began operating this year in California — at a Mortenson facility with 120,000 installed batteries that give it a storage capacity of 3,280 megawatts. An article in El Pais notes that this helped California pass 10,000 megawatts of photovoltaic storage in April — enough to meet 20% of demand — for the first time ever. (In 2019, the state had just 770 megawatts of storage capacity.) Mark Rothleder, the vice president of the independent grid operator, California ISO (CAISO), said earlier this year that they will add another 1,134 megawatts in the first eight months of 2024. This is growth on top of the leap made last year. "In 2023 alone, the ISO successfully onboarded 5,660 megawatts of new power to the grid," Rothleder said at a conference in San Diego... Renewable production was enough to supply the grid on 40 out of 48 days this spring, compared to seven days in the whole of last year. Lithium batteries appear to be undercutting the use of fossil fuels. Gas accounts for 40% of California's grid. However, its use in April registered its lowest proportion in seven years. "The data clearly shows that batteries are displacing natural gas when solar generation is ramping up and down each day in CAISO," notes an analysis by Grid Status, a firm specializing in energy issues. Natural gas was king on the grid in April 2021, 2022 and 2023. CAISO was sending between 9,000 and 10,000 megawatts produced from gas to the grid once solar ran out. Last April, however, it amounted to only 5,000 megawatts... [California's goal: run on 100% renewable energy by 2045.] Arizona and Georgia have followed California's lead. But it is Texas, the other major U.S. giant in this industry, that is snapping at its heels. At the end of April, batteries supplied 4% of the grid's electricity, enough to power several million homes. Batteries are beginning to look like an alternative to a system heavily dependent on gas and coal. ← Related Links → Python, JavaScript, Java: ZDNet Calculates The Most Popular Programming Languages California Exceeds 100% of Energy Demand With Renewables Over a Record 30 DaysCalifornia Is Grappling With a Growing Problem: Too Much SolarBattery-Powered California Faces Lower Blackout Risk This SummerCalifornia's Grid Survives Heat Wave Thanks to Massive Battery StorageUS Grid Adds Batteries At 10x the Rate of Natural Gas In First Half of 2024What's Holding Back America's Move to Electric Cars? (function($){ $('.js_disp_only').show(); $('a.jshandle_related').on('click', '', function(e) { e.preventDefault(); var url = $(this).data('goto-url'); window.location = url }); })($j); Shrinkwrap 'Contract' Found At Costco On... Collagen Peptides'''
