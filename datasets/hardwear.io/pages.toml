["https://hardwear.io/privacy-policy"]
title = "Privacy Policy | hardwear.io | Hardware Security Conference & Training"
description = "Privacy Policy | hardwear.io | Hardware Security Conference & Training"
full_description = "Payatu BV and Hardwear Inc are committed to ensuring the security and protection of the personal information that we process, and to provide a compliant and consistent approach to data protection. We have always had a robust and effective data protection program in place which complies with existing law and abides by the data protection principles. However, we recognise our obligations in updating and expanding this program to meet the demands of the GDPR. Payatu BV and Hardwear Inc are dedicated to safeguarding the personal information under our remit and in developing a data protection regime that is effective, fit for purpose and demonstrates an understanding of, and appreciation for the new Regulation. Our preparation and objectives for GDPR compliance have been summarised in this statement and include the development and implementation of new data protection roles, policies, procedures, controls and measures to ensure maximum and ongoing compliance. Hardwear.io – Hardware Security Training and Conference, Netherlands and Hardwear.io – Hardware Security Training and Conference, USA are organized and managed by Payatu BV (based in The Netherlands) and Hardwear Inc (based in the United States). In addition to the policies and procedures mentioned above that ensure individuals can enforce their data protection rights, we provide easy to access information via our website, of an individual’s right to access any personal information that Payatu BV and Hardwear Inc process about them and to request information about: Payatu BV and Hardwear Inc takes the privacy and security of individuals and their personal information very seriously and take every reasonable measure and precaution to protect and secure the personal data that we process. We have robust information security policies and procedures in place to protect personal information from unauthorized access, alteration, disclosure or destruction and have several layers of security measures includes (Information Security Access Policy and Password Policy)"
