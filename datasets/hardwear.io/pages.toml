["https://hardwear.io/usa-2025/cfp.php"]
title = "Call for Papers | hardwear.io | USA 2025"
description = "hardwear.io USA 2025 - Hardware Security Conference & Training is seeking innovative research on attacks or mitigation on any hardware. Submit your research paper."
full_description = '''Hardwear.io is a platform for the hardware and security community where researchers showcase and discuss their innovative research on attacking and defending hardware. We happily open doors for researchers and hackers around the world working on the next Big Thing in security – if you've done interesting offence/defence research on any hardware and want to share it to the security community, it's time to submit your research paper! We are interested in new and cutting edge security work that has previously not been published. Some security topics for your reference including (but not limited to): Type: A deep knowledge technical track that includes new research, vulnerabilities, zero days or exploits. And by new we really mean new i.e. if your research or talk has been published/showcased (partially or entirely) before, it will fall under current research category even though there are enhancements/changes to the original research.** Type: Comprises known security issues, research presented/published elsewhere, case studies, twist to an existing research, vulnerability, exploit or research-in-progress.** Type: Comprises open source security tools, exploits, hardware etc. This is an excellent opportunity for the original authors to showcase their work to the world.** Some of you might wonder what format (number of pages, single/double-column, blind/single-blind, etc.) you should stick to when submitting your research or tool. Well, as we are not an academic conference and we do not publish your research in any academic journals (ieee, acm, springer, open source, etc.), we don’t have a strict format for the submissions. One can actually submit their research without a full-fledged research paper: if they prefer to just describe the research details under "Full Technical details" in the form, that is also sufficient. Of course, you can also upload your work in the format of a paper: whatever is more convenient for you, works for us. After submission, all research will be subject to review by our review board. The reviewers will not know the names/affiliations of the authors.'''
year_published = 2024
