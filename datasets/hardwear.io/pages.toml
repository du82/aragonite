full_description = "Do you want to build a strategic relationship with us?For sponsorship contact [email protected] and for community partnership contact [email protected] Since 2015, eShard has been providing independent security assessment services, lab equipment and esDynamic, a software platform dedicated to physical attacks on chips (Side Channel Attacks, Power and Clock Glitching, Electromagnetic Fault Injection, Laser Fault Injection, Photonic Emission) as long as extensive knowledge and know-how on the matter. eShard also offers a binary analysis platform esReverse combining static and dynamic tools to offer all-in-one reverse capabilities to expert teams. Somerset Recon, Inc. is a full-service computer security consulting firm. We provide security analysis, training, consulting, incident response, and penetration testing services to a wide variety of industries. Our team is composed of world-class security professionals with experience in hardware and software reverse-engineering, code auditing, malware analysis, embedded systems and hardware side-channel analysis. Contact us today to find out how we can help with your specific security needs."
