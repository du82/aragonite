["https://hardwear.io/code-of-conduct"]
title = "Code of Conduct | hardwear.io | Hardware Security Conference & Training"
description = "Code of Conduct | hardwear.io | Hardware Security Conference & Training"
full_description = "Participants asked to stop any unacceptable or harassing behaviour are expected to comply immediately. We reserve the right to respond to unacceptable behavior and harassment in the manner we deem appropriate, including but not limited to expulsion without refund and referral to the relevant authorities. If you have experienced or witnessed an incident that violates the Code of Conduct, please contact us at [email protected] hardwear.io is open to the public, and we do not restrict attendees ( including hardwaer.io staff, volunteers, sponsors, and media ) from taking photos or videos at our events. By attending our events, you acknowledge that you are in a public space and that attendees ( including hardwear.io staff, volunteers, sponsors, and media ) may capture your image in photos and videos. Nevertheless, hardwear.io encourages event attendees to exercise common sense and good judgment, and respect the wishes of other attendees who do not wish to be photographed at the Events. The organizers reserves the right to use images taken at the conference with your photograph and / or likeness in future marketing materials. Remember: The hardwear.io is a place to learn, share, and discuss hardware and security. And as a community we can create a great experience for everyone participating."
