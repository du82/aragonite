["https://hardwear.io/testimonials"]
title = "Testimonials | hardwear.io | Hardware Security Conference & Training"
description = "Testimonials | hardwear.io | Hardware Security Conference & Training"
full_description = '"The growth of the events (conferences, trainings, webinars) dedicated to hardware security demonstrates a positive impact on the communities which are brought together (academics, hacking scene, infosec professionals…) and I have always been very thankful to the Hardwear.io team for making all this possible.All these years, I have been participating as a speaker or an attendee and Hardwear.io (especially the NL conference) is an event I wait for and I cannot miss. The lineups are always amazing, and as a hardware and radio security enthusiast, I am interested in 100% of the talks, which is kind of unusual in other events. More importantly, I met people which are both among the best in their technical fields and very kind and open minded persons. The spirit and the scale of the event gives the opportunity to reach people and the time to exchange views." "This was a very information-dense training, quite challenging. Multiple new concepts in play simultaneously. Despite that, everything was introduced well, the materials were easy to work with, and there was no hard requirement to successfully follow everything on the spot. This allowed the room to get hands-on without undue pressure. Learned a ton, thank you so much!" "In my opinion, Hardwear.IO is truly a unique event for the hardware security community. It combines hands-on experience with cutting-edge research in an informal and open-minded atmosphere like no other event with a strong focus on hardware security. The mix of excellent research talks on applied research, hands-on trainings and various hacking contests with a clear focus on hardware and embedded firmware security characterizes this event. Hardwear.IO thus addresses a wide range of interested parties, curious students and researchers to professionals." "Over all the years the hardwaer.io stayed true to their name and not only delivered a top quality conference, but also had the best quality T-shirts with various creative designs featuring the iconic Hardwear Bug we all are hunting for. Stay up with the good work and we are looking forward to next year."'
