["https://hardwear.io"]
title = "hardwear.io | Hardware Security Conference & Training | Netherlands, Germany & USA"
description = "Embedded security conference & training platform for Semiconductor, IoT, ICS/SCADA, Telecom, Automobile, Healthcare industry held in the Netherlands, Germany & USA."
full_description = "Hardwear.io Security Conference is a platform for hardware and security community where researchers showcase and discuss their innovative research on attacking and defending hardware. In the past couple of months our goal was to knuckle down and build a physical event where we can meet again and hang out in a safe & welcoming environment. And we did it! We managed to pull it off, and (dare we say?) our Netherlands event was incredible. Building on this success, Hardwear.io Netherlands returns as a physical conference in Santa Clara Marriott, USA between 27th May - 31st May 2025. 27th May - 31st May: fasten your seatbelts for intensive in-person trainings, top-notch hardware-security talks, professional networking, stimulating CTFs and a challenging HardPwn. Mark your calendars and get ready. All these years, I have been participating as a speaker or an attendee and Hardwear.io (especially the NL conference) is an event I wait for and I cannot miss. The lineups are always amazing, and as a hardware and radio security enthusiast, I am interested in 100% of the talks, which is kind of unusual in other events. More importantly, I met people who are both among the best in their technical fields and very kind and open minded persons. The spirit and the scale of the event gives the opportunity to reach people and the time to exchange views. Over the years, hardwear.io has become the cool place to learn and practice hardware security. Not only a fantastic conference, it’s also some hands-on training, interesting webinars and challenging CTFs. Hardware security has a conference, and it’s hardwear.io! I have 20+ years of experience in ASIC development and testing, and took the course IC Reverse Engineering & Code Dump by Olivier Thomas to get an insight in doing my previous work, but in reverse. It was clear from the first day of the course that Olivier is very experienced and knows what he is doing, and he proved to be an excellent tutor. In the four days of the course, Olivier also provided lots of useful tips and hints of many common pitfalls that I can’t see that I would have learned from someone that didn’t have the experience that Olivier has. I would have happily spent another four days soaking in even more of all the details."
