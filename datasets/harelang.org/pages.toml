full_description = '''Who is Hare? .people { display: grid; grid-template-columns: 1fr 1fr; margin-top: 1rem; gap: 8px; @media(max-width: 1000px) { grid-template-columns: 1fr; } } .person { border: 1px solid #888; border-radius: 3px; padding: 1rem; display: grid; grid: "header header" auto "image body" 1fr / auto 1fr; gap: 8px; } .person h4 { margin: 0; grid-area: header; } .person img { grid-area: image; margin: 0; width: 128px; height: 128px; max-width: none; } .person dl { grid-area: body; display: block; margin: 0; } .specialization { font-weight: normal; float: right; } Hare is built for people, by people. Who are those people? Global maintainers Bor Grošelj Simić Email bgs@turminal.net Location Ljubljana Drew DeVault Email sir@cmpwn.com Website drewdevault.com Location Amsterdam Ember Sawady Email ecs@d2evs.net Website ecs.d2evs.net Location Boston Sebastian Email sebastian@sebsite.pw Website sebsite.pw Location The Internet Subsystem maintainers Armin Preiml Cryptography Email apreiml@strohwolke.at Website denkmaschine.at Location Austria Bor Grošelj Simić Mathematical library Email bgs@turminal.net Location Ljubljana Byron Torres Date/time support Email b@torresjrjr.com Website torresjrjr.com Location London Conrad Hoffmann DNS support Email ch@bitfehler.net Website bitfehler.net Location Berlin Lorenz (xha) OpenBSD support Email me@xha.li Website xha.li Location Germany Mallory AdamsNetBSD support Email malloryadams@fastmail.com Vlad-Stefan Harbuz Regular expressions Email vlad@vladh.net Website vladh.net Location Edinburgh Willow Barraco AArch64 support Email contact@willowbarraco.fr Website willowbarraco.fr Location Cyber Space, or France Hare contributors Over 100 people have contributed to Hare, with contributions both large and small. It's more than just the people you see here — it's a thriving community that works thanks only to everyone's combined efforts.'''
