["https://harelang.org/blog/2024-02-01-debugging-features"]
title = "New debugging features coming to Hare"
full_description = '''New debugging features coming to Hare February 1, 2024 by Drew DeVault We just merged a series of patches for Hare that adds a number of nice features for debugging Hare programs. I want to introduce these features to you, and share a bit about what’s going on that makes them possible. Let’s look at some kinds of problems which invoke these new debugging features. Let’s start with a simple case: your program has an assertion failure. You get a pretty backtrace now:1 $ hare run main.ha Abort: How does math work /home/sircmpwn/sources/hare/main.ha:2:43 main+0x56 [0x802e7cd] | assert(1 == 0, "How does math work"); ^ /home/sircmpwn/sources/hare/rt/+linux/start.ha:13:13 rt::start_ha+0xe [0x8003901] | main(); ^ /home/sircmpwn/sources/hare/rt/+linux/platformstart-libc.ha:8:17 rt::start_linux+0x3a [0x8003ae8] | start_ha(); ^ Aborted We also detect a variety of other situations and print more useful information and a nice backtrace. Here’s another example: stack overflow. $ hare run main.ha Stack overflow (address not mapped to object) at address 0x7ffe4c920ff8 /home/sircmpwn/sources/hare/main.ha:2:13 main+0x9 [0x802e6f6] | main(); ^ /home/sircmpwn/sources/hare/main.ha:2:13 main+0x9 [0x802e6f6] (already shown) /home/sircmpwn/sources/hare/main.ha:2:13 main+0x9 [0x802e6f6] (already shown) /home/sircmpwn/sources/hare/main.ha:2:13 main+0x9 [0x802e6f6] (already shown) /home/sircmpwn/sources/hare/main.ha:2:13 main+0x9 [0x802e6f6] (already shown) /home/sircmpwn/sources/hare/main.ha:2:13 main+0x9 [0x802e6f6] (already shown) /home/sircmpwn/sources/hare/main.ha:2:13 main+0x9 [0x802e6f6] (already shown) /home/sircmpwn/sources/hare/main.ha:2:13 main+0x9 [0x802e6f6] (already shown) /home/sircmpwn/sources/hare/main.ha:2:13 main+0x9 [0x802e6f6] (already shown) /home/sircmpwn/sources/hare/main.ha:2:13 main+0x9 [0x802e6f6] (already shown) /home/sircmpwn/sources/hare/main.ha:2:13 main+0x9 [0x802e6f6] (already shown) /home/sircmpwn/sources/hare/main.ha:2:13 main+0x9 [0x802e6f6] (already shown) /home/sircmpwn/sources/hare/main.ha:2:13 main+0x9 [0x802e6f6] (already shown) /home/sircmpwn/sources/hare/main.ha:2:13 main+0x9 [0x802e6f6] (already shown) /home/sircmpwn/sources/hare/main.ha:2:13 main+0x9 [0x802e6f6] (already shown) /home/sircmpwn/sources/hare/main.ha:2:13 main+0x9 [0x802e6f6] (already shown) (523572 additional frames omitted) /home/sircmpwn/sources/hare/main.ha:2:13 main+0x9 [0x802e6f6] (already shown) /home/sircmpwn/sources/hare/main.ha:2:13 main+0x9 [0x802e6f6] (already shown) /home/sircmpwn/sources/hare/main.ha:2:13 main+0x9 [0x802e6f6] (already shown) /home/sircmpwn/sources/hare/main.ha:2:13 main+0x9 [0x802e6f6] (already shown) /home/sircmpwn/sources/hare/main.ha:2:13 main+0x9 [0x802e6f6] (already shown) /home/sircmpwn/sources/hare/main.ha:2:13 main+0x9 [0x802e6f6] (already shown) /home/sircmpwn/sources/hare/main.ha:2:13 main+0x9 [0x802e6f6] (already shown) /home/sircmpwn/sources/hare/main.ha:2:13 main+0x9 [0x802e6f6] (already shown) /home/sircmpwn/sources/hare/main.ha:2:13 main+0x9 [0x802e6f6] (already shown) /home/sircmpwn/sources/hare/main.ha:2:13 main+0x9 [0x802e6f6] (already shown) /home/sircmpwn/sources/hare/main.ha:2:13 main+0x9 [0x802e6f6] (already shown) /home/sircmpwn/sources/hare/main.ha:2:13 main+0x9 [0x802e6f6] (already shown) /home/sircmpwn/sources/hare/main.ha:2:13 main+0x9 [0x802e6f6] (already shown) /home/sircmpwn/sources/hare/rt/+linux/start.ha:13:13 rt::start_ha+0xe [0x8003901] | main(); ^ /home/sircmpwn/sources/hare/rt/+linux/platformstart-libc.ha:8:17 rt::start_linux+0x3a [0x8003ae8] | start_ha(); ^ Aborted We also have signal handlers for a number of other situations, including segfaults, arithmetic exceptions, bus errors, and more, which provide a similar backtrace and add useful details about the specific nature of the problem. For instance, consider the following (exceptionally stupid) Hare code: export fn main() void = { let x: *int = &main: *int; *x = 1337; }; This causes a segfault because “main” is executable, but not writable. We now print a handy error message when you run this program, which distinguishes it from other kinds of segfaults like a null pointer dereference: Illegal pointer access (invalid permissions for mapped object) at address 0x802e6fd These features also help you make better use of Ember’s improved memory allocator, which checks for a number of common memory errors and aborts should they occur. Consider the double free bug: export fn main() void = { let x: *int = alloc(42); free(x); free(x); }; Previously, running this program gave the following error: Abort: rt/malloc.ha:185:15: tried to get metadata for already-freed pointer (double free?) This is better than blindly thrashing the heap and moving on, but it doesn’t give you much information about the cause of the error. If you wanted more, you’d have to dump core and fire up gdb. It’s much easier to see where the error comes from now: Abort: tried to get metadata for already-freed pointer (double free?) /home/sircmpwn/sources/hare/rt/malloc.ha:185:18 rt::getmeta+0x7f [0x80015ec] | assert(m.sz & 0b1 == 0, ^ /home/sircmpwn/sources/hare/rt/malloc.ha:133:32 rt::free+0x3c [0x8001753] | yield getmeta(p); ^ /home/sircmpwn/sources/hare/main.ha:4:15 main+0x4f [0x802e73c] | free(x); ^ /home/sircmpwn/sources/hare/rt/+linux/start.ha:13:13 rt::start_ha+0xe [0x8003901] | main(); ^ /home/sircmpwn/sources/hare/rt/+linux/platformstart-libc.ha:8:17 rt::start_linux+0x3a [0x8003ae8] | start_ha(); ^ Aborted Some of the tools used to provide this information, such as walking call frames, are available for users in the new debug module. In the future, we’ll expand the runtime debugging support in a few interesting ways: Rigging the allocator more closely into debug Recording stack traces on malloc/free and providing valgrind-like histories for each pointer Switching to an “emergency” mode which ensures that the debug support code can proceed in error cases, such as by evicting file descriptors and setting up a new heap Expanding DWARF support for a more complete debugging experience Runtime configuration of debug information via environment variables; for instance you might configure the segfault handler to dump /proc/self/maps to stderr Update your local copy of Hare to get access to all of these goodies! Under the hood So, how does all of this work? Let’s take a look at a few key areas: Hooking up internal error sources Hooking up terminating signals Walking call frames Mapping addresses with symbol names Mapping addresses with file names & line numbers Hooking into abort() This one is the easiest. When you use abort() in Hare, it generates a function call rt::abort. Same if you use assert() and the condition is false – it ends up in rt::abort. This also happens on a number of internal conditions that cause an abort, such as an array-out-of-bounds problem. rt::abort looks like this: export @symbol("rt.abort") fn _abort( path: *str, line: u64, col: u64, msg: str, ) never = { platform_abort(path, line, col, msg); }; // See harec:include/gen.h const reasons: [_]str = [ "slice or array access out of bounds", // 0 "type assertion failed", // 1 "out of memory", // 2 "static insert/append exceeds slice capacity", // 3 "execution reached unreachable code (compiler bug)", // 4 "slice allocation capacity smaller than initializer", // 5 "assertion failed", // 6 "error occurred", // 7 ]; export fn abort_fixed(path: *str, line: u64, col: u64, i: u64) void = { platform_abort(path, line, col, reasons[i]); }; The “platform_abort” function is defined by your target (e.g. Linux, OpenBSD, whatever) and does some platform-specific functionality to process the abort, i.e. write details to stderr and raise SIGABRT. This was easy to make pluggable. Here’s the new version: // Signature for abort handler function. export type abort_handler = fn( path: *str, line: u64, col: u64, msg: str, ) never; let handle_abort: *abort_handler = &platform_abort; // Sets a new global runtime abort handler. export fn onabort(handler: *abort_handler) void = { handle_abort = handler; }; export @symbol("rt.abort") fn _abort( path: *str, line: u64, col: u64, msg: str, ) never = { handle_abort(path, line, col, msg); }; Now debug can register its own abort handler when it’s linked into a program: @init fn init_abort() void = { rt::onabort(&debug_abort); }; // Note: take care not to get into an abort loop when working on this code fn debug_abort( path: *str, line: u64, col: u64, msg: str, ) never = { // we'll get to this part later }; You can also see one of the unique constraints of the new debug module here: it’s quite important that it never raises an abort during the abort handler. To this extent we have no assertions – be it assert(), error assertions (!), the “as” operator, etc – without carefully checking that they will not cause an abort loop. Handling signals The next kind of case we need to hook into is so-called “terminating” signals, the most obvious of which is SIGTERM – but we aren’t handling that particular signal. Instead, we’re interested in signals that crash the program: SIGBUS: bus error (bad memory access) SIGFPE: arithmetic exception (e.g. divide by zero) SIGILL: illegal instruction (e.g. using ldgdt from user mode on x86_64) SIGSEGV: the infamous segfault We can set up a signal handler to handle all of these cases much like any other signal. However, there is one case to consider carefully: what if a SIGSEGV occurs because of a stack overflow? We will not be able to run the signal handler in this case. Unix has an answer: sigaltstack. This allows the kernel to switch the stack pointer over to an alternate stack when executing a signal handler, which neatly eliminates this issue. We start by setting up a static 64 KiB memory reservation in the debug module, then use it to set up an alternate stack and our signal handler: // altstack.s let altstack: [ALTSTACK_SIZE]uintptr; // 16 KiB, sync with altstack.s def ALTSTACK_SIZE: size = 16384; @init fn init_overflow() void = { rt::sigaltstack(&rt::stack_t { ss_sp = &altstack, ss_flags = 0, ss_size = ALTSTACK_SIZE, }, null)!; signal::handle(sig::SEGV, &signal_handler, signal::flag::ONSTACK); signal::handle(sig::FPE, &signal_handler, signal::flag::ONSTACK); signal::handle(sig::BUS, &signal_handler, signal::flag::ONSTACK); signal::handle(sig::ILL, &signal_handler, signal::flag::ONSTACK); }; fn signal_handler(sig: sig, info: *signal::siginfo, uctx: *opaque) void = { // ... }; Good – now we’ll safely end up here when the program would otherwise crash. Next, we’re going to do something that few readers will have ever done in their signal handler: we’re going to open up this mysterious ucontext_t parameter. This parameter is opaque per POSIX but it’s a (well hidden) part of the stable userspace ABI on all Unix platform we support, and it contains the state – registers – of our program when the signal occurred. Since it will naturally be platform-specific, the signal handler relegates the work to unpack it to platform-specific code elsewhere in debug. We’re going to extract the instruction pointer, stack pointer, and stack frame. fn signal_handler(sig: sig, info: *signal::siginfo, uctx: *opaque) void = { const ip = uctx_ip(uctx); const sp = uctx_sp(uctx); let frame = uctx_frame(uctx); // ... This data structure varies both by platform and CPU architecture, so let’s narrow in and just look at the structure for x86_64 Linux: export type ucontext = struct { uc_flags: u64, uc_link: *ucontext, uc_stack: stack_t, uc_mcontext: sigcontext, uc_sigmask: sigset, }; export type sigcontext = struct { r8: u64, r9: u64, r10: u64, r11: u64, r12: u64, r13: u64, r14: u64, r15: u64, di: u64, si: u64, bp: u64, bx: u64, dx: u64, ax: u64, cx: u64, sp: u64, ip: u64, flags: u64, cs: u16, gs: u16, fs: u16, ss: u16, err: u64, trapno: u64, oldmask: u64, cr2: u64, fpstate: u64, reserved1: [8]u64, }; Mysteries revealed! rip is the instruction pointer, rsp is the stack pointer, and bp is the frame pointer – we’ll cover frame pointers later. The platform-specific helper functions just grab these for us. The rest of the signal handler here is pretty straightforward: switch (sig) { case sig::SEGV => const is_overflow = addr & ~0xFFFF == sp & ~0xFFFF; fmt::errorfln("{} ({}) at address 0x{:x}", if (is_overflow) "Stack overflow" else "Illegal pointer access", errcode_str(sig, info.code), addr): void; case sig::BUS => fmt::errorfln("Bus error ({}) at address 0x{:x}", errcode_str(sig, info.code), addr): void; case sig::FPE => // addr is the location of the faulting instruction, construct // an additional synethetic stack frame let copy = frame; frame = mkframe(&copy, addr); fmt::errorfln("Arithmetic exception ({})", errcode_str(sig, info.code)): void; case => void; }; const self = match (image::self()) { case let img: image::image => yield img; case => halt(); }; defer image::close(&self); backtrace(&self, frame); halt(); One or two points of note here: we distinguish a stack overflow from other segfaults by looking to see if the faulting address (via siginfo) is close to the stack. Arithmetic exceptions put the faulting address in this field, so we construct a new stackframe to pass along to the backtrace to include the error site. Walking call frames The next point of interest is the code to examine the call stack and print a backtrace. With Hare, this is relatively simple: we use frame pointers. The way this works is by constructing a linked list of call frames on the stack, and storing the head in the frame pointer register (%rbp on x86_64). Each Hare function call begins with the following code to achieve this (on x86_64): .globl main main: pushq %rbp movq %rsp, %rbp // ... Other languages (e.g. C) don’t use the frame pointer, freeing it up for bigger and better things (like storing locals or temporaries). On such platforms unwinding the stack is much more complicated; Hare keeps it simple and so we can implement stack unwinding fairly easily: fn getfp() *stackframe; // Details for a stack frame. Contents are architecture-specific. export type stackframe = struct { fp: nullable *stackframe, ip: uintptr, }; // Returns the caller's stack frame. Call [[next]] to walk the stack. export fn walk() stackframe = *getfp(); // Returns the next stack frame walking the stack. export fn next(frame: stackframe) (stackframe | void) = { match (frame.fp) { case null => return; case let next: *stackframe => if (next.fp == null) { return; }; return *next; }; }; // Return the program counter address for the given stack frame. export fn frame_pc(frame: stackframe) uintptr = frame.ip; The getfp function is implemented in a separate assembly file: .global debug.getfp debug.getfp: endbr64 movq %rbp,%rax ret Equipped with this support code, walking stack frames is easy: const frame = debug::walk(); for (true) { fmt::printfln("pc: {:x}", debug::frame_pc(frame))!; match (debug::next(frame)) { case let next: debug::stackframe => frame = next; case void => break; }; }; …at least, if all you want is '''
