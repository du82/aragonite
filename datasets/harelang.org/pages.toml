title = "Implementing an SSH agent in Hare"
full_description = '''Implementing an SSH agent in Hare May 9, 2022 by Drew DeVault In the process of writing an SSH agent for Himitsu, I needed to implement many SSH primitives from the ground up in Hare, now available via hare-ssh. Today, I’m going to show you how it works! Important: This blog post deals with cryptography-related code. The code you’re going to see today is incomplete, unaudited, and largely hasn’t even seen any code review. Let me begin with a quote from the “crypto” module’s documentation in the Hare standard library: Cryptography is a difficult, high-risk domain of programming. The life and well-being of your users may depend on your ability to implement cryptographic applications with due care. Please carefully read all of the documentation, double-check your work, and seek second opinions and independent review of your code. Our documentation and API design aims to prevent easy mistakes from being made, but it is no substitute for a good background in applied cryptography. Do your due diligence before repurposing anything you see here. Decoding SSH private keys Technically, you do not need to deal with OpenSSH private keys when implementing an SSH agent. However, my particular use-case includes dealing with this format, so I started here. Unlike much of SSH, the OpenSSH private key format (i.e. the format of the file at ~/.ssh/id_ed25519) is, well, private. It’s not documented and I had to get most of the details from reverse-engineering the OpenSSH C code. The main area of interest is sshkey.c. I’ll spare you from reading it yourself and just explain how it works. First of all, let’s just consider what an SSH private key looks like: -----BEGIN OPENSSH PRIVATE KEY----- b3BlbnNzaC1rZXktdjEAAAAACmFlczI1Ni1jdHIAAAAGYmNyeXB0AAAAGAAAABDTIm/zSI 7zeHAs4rIXaOD1AAAAEAAAAAEAAAAzAAAAC3NzaC1lZDI1NTE5AAAAIE7qq/pMk9VrRupn 9j4/tNHclJnKgJAE1pfUecRNT1fAAAAAoEcx6mnJmFlYXx1eYztw6SZ5yuL6T1LWfj+bpg 7zNQBoqJW1j+Q17PUMtXj9wDDOQx+6OE7JT/RrK3Vltp4oXmFI4FgsYbE9RbNXSC2xvLaX fplmx+eAOir9UTZGTIbOGy1cVho8LzDLLo4WiGYbpxtIvkJE72f0YdTm8RrNVkLlAy7ayV uFcoq1JBrjIAa7UtqIr9SG8b76ALJZb9jPc3A= -----END OPENSSH PRIVATE KEY----- We can immediately tell that this is a PEM file (RFC 7468). The first step to read this file was to implement a decoder for the PEM format, which has been on our to-do list for a while now, and is also needed for many other use-cases. Similar to many other formats provided in the standard library, you can call pem::newdecoder to create a PEM decoder for an arbitrary I/O source, returning the decoder state on the stack. We can then call pem::next to find the next PEM header (-----BEGIN...), which returns a decoder for that specific PEM blob (this design accommodates PEM files which have several PEM segments concatenated together, or intersperse other data in the file alongside the PEM bits. This is common for other PEM use-cases). With this secondary decoder, we can simply read from it like any other I/O source and it decodes the base64-encoded data and returns it to us as bytes. Based on this, we can examine the contents of this key with a simple program. use encoding::hex; use encoding::pem; use fmt; use io; use os; export fn main() void = { const dec = pem::newdecoder(os::stdin); defer pem::finish(&dec); for (true) { const reader = match (pem::next(&dec)) { case let reader: (str, pem::pemdecoder) => yield reader; case io::EOF => break; }; const name = reader.0, stream = reader.1; defer io::close(&stream)!; fmt::printfln("PEM data '{}':", name)!; const bytes = io::drain(&stream)!; defer free(bytes); hex::dump(os::stdout, bytes)!; }; }; Running this program on our sample key yields the following: PEM data 'OPENSSH PRIVATE KEY': 00000000 6f 70 65 6e 73 73 68 2d 6b 65 79 2d 76 31 00 00 |openssh-key-v1..| 00000010 00 00 0a 61 65 73 32 35 36 2d 63 74 72 00 00 00 |...aes256-ctr...| 00000020 06 62 63 72 79 70 74 00 00 00 18 00 00 00 10 d3 |.bcrypt.........| 00000030 22 6f f3 48 8e f3 78 70 2c e2 b2 17 68 e0 f5 00 |"o.H..xp,...h...| 00000040 00 00 10 00 00 00 01 00 00 00 33 00 00 00 0b 73 |..........3....s| 00000050 73 68 2d 65 64 32 35 35 31 39 00 00 00 20 4e ea |sh-ed25519... N.| 00000060 ab fa 4c 93 d5 6b 46 ea 67 f6 3e 3f b4 d1 dc 94 |..L..kF.g.>?....| 00000070 99 ca 80 90 04 d6 97 d4 79 c4 4d 4f 57 c0 00 00 |........y.MOW...| 00000080 00 a0 47 31 ea 69 c9 98 59 58 5f 1d 5e 63 3b 70 |..G1.i..YX_.^c;p| 00000090 e9 26 79 ca e2 fa 4f 52 d6 7e 3f 9b a6 0e f3 35 |.&y...OR.~?....5| 000000a0 00 68 a8 95 b5 8f e4 35 ec f5 0c b5 78 fd c0 30 |.h.....5....x..0| 000000b0 ce 43 1f ba 38 4e c9 4f f4 6b 2b 75 65 b6 9e 28 |.C..8N.O.k+ue..(| 000000c0 5e 61 48 e0 58 2c 61 b1 3d 45 b3 57 48 2d b1 bc |^aH.X,a.=E.WH-..| 000000d0 b6 97 7e 99 66 c7 e7 80 3a 2a fd 51 36 46 4c 86 |..~.f...:*.Q6FL.| 000000e0 ce 1b 2d 5c 56 1a 3c 2f 30 cb 2e 8e 16 88 66 1b |..-\V.</0.....f.| 000000f0 a7 1b 48 be 42 44 ef 67 f4 61 d4 e6 f1 1a cd 56 |..H.BD.g.a.....V| 00000100 42 e5 03 2e da c9 5b 85 72 8a b5 24 1a e3 20 06 |B.....[.r..$.. .| 00000110 bb 52 da 88 af d4 86 f1 be fa 00 b2 59 6f d8 cf |.R..........Yo..| 00000120 73 70 |sp| OpenSSH private keys begin with a magic string, “openssh-key-v1\0”, which we can see here. Following this are a number of binary encoded fields which are represented in a manner similar to the SSH wire protocol, most often as strings prefixed by their length, encoded as a 32-bit big-endian integer. In order, the fields present here are: Cipher name (aes256-ctr) KDF name (bcrypt) KDF data Public key data Private key data (plus padding) We parse this information like so: export type sshprivkey = struct { cipher: str, kdfname: str, kdf: []u8, pubkey: []u8, privkey: []u8, }; export fn decodesshprivate(in: io::handle) (sshprivkey | error) = { const pem = pem::newdecoder(in); const dec = match (pem::next(&pem)?) { case io::EOF => return invalid; case let dec: (str, pem::pemdecoder) => if (dec.0 != "OPENSSH PRIVATE KEY") { return invalid; }; yield dec.1; }; let magicbuf: [15]u8 = [0...]; match (io::readall(&dec, magicbuf)?) { case size => void; case io::EOF => return invalid; }; if (!bytes::equal(magicbuf, strings::toutf8(magic))) { return invalid; }; let key = sshprivkey { ... }; key.cipher = readstr(&dec)?; key.kdfname = readstr(&dec)?; key.kdf = readslice(&dec)?; let buf: [4]u8 = [0...]; match (io::readall(&dec, buf)?) { case size => void; case io::EOF => return invalid; }; const nkey = endian::begetu32(buf); if (nkey != 1) { // OpenSSH currently hard-codes the number of keys to 1 return invalid; }; key.pubkey = readslice(&dec)?; key.privkey = readslice(&dec)?; // Add padding bytes append(key.privkey, io::drain(&dec)?...); return key; }; However, to get at the actual private key — so that we can do cryptographic operations with it — we first have to decrypt this inner data. Those three fields — cipher name, KDF name, and KDF data — are our hint. In essence, this data is encrypted by OpenSSH by using a variant of bcrypt as a key derivation function, which turns your password (plus a salt) into a symmetric encryption key. Then it uses AES 256 in CTR mode with this symmetric key to encrypt the private key data. With the benefit of hindsight, I might question these primitives, but that’s what they use so we’ll have to work with it. Prior to starting this work, Hare already had support for AES and CTR, though they gained some upgrades during the course of this work, since using an interface for real-world code is the best way to evaluate its design. This leaves us to implement bcrypt. bcrypt is a password hashing algorithm invented by OpenBSD based on the Blowfish cipher, and it is pretty badly designed. However, Blowfish was fairly straightforward to implement. I’ll spare you the details, but here’s the documentation and implementation for your consideration. I also implemented the standard bcrypt hash at crypto::bcrypt, whose implementation is here (for now). This isn’t especially relevant for us, however, since OpenSSH uses a modified form of bcrypt as a key derivation function. The implementation the bcrypt KDF in Hare is fairly straightforward. To write it, I referenced OpenSSH portable’s vendored OpenBSD implementation at openbsd-compat/bcrypt_pbkdf.c, as well as the Go implementation in golang.org/x/crypto. Then, with these primitives done, we can implement the actual key decryption. First, not all keys are encrypted with a passphrase, so a simple function tells us if this step is required: // Returns true if this private key is encrypted with a passphrase. export fn isencrypted(key: *sshprivkey) bool = { return key.kdfname != "none"; }; The “decrypt” function is used to perform the actual decryption. It begins by finding the symmetric key, like so: export fn decrypt(key: *sshprivkey, pass: []u8) (void | error) = { assert(isencrypted(key)); const cipher = getcipher(key.cipher)?; let ckey: []u8 = alloc([0...], cipher.keylen + cipher.ivlen); defer { bytes::zero(ckey); free(ckey); }; let kdfbuf = bufio::fixed(key.kdf, io::mode::READ); switch (key.kdfname) { case "bcrypt" => const salt = readslice(&kdfbuf)?; defer free(salt); const rounds = readu32(&kdfbuf)?; bcrypt_pbkdf(ckey, pass, salt, rounds); case => return badcipher; }; The “KDF data” field I mentioned earlier uses a format private to each KDF mode, though at the present time the only supported KDF is this bcrypt one. In this case, it serves as the salt. The “getcipher” function returns some data from a static table of supported ciphers, which provides us with the required size of the cipher’s key and IV parameters. We allocate sufficient space to store these, create a bufio reader from the KDF field, read out the salt and hashing rounds, and hand all of this over to the bcrypt function to produce our symmetric key (and I/V) in the “ckey” variable. We may then use these parameters to decrypt the private key area. let secretbuf = bufio::fixed(key.privkey, io::mode::READ); const cipher = cipher.init(&secretbuf, ckey[..cipher.keylen], ckey[cipher.keylen..]); defer cipher_free(cipher); let buf: []u8 = alloc([0...], len(key.privkey)); defer free(buf); io::readall(cipher, buf)!; const a = endian::begetu32(buf[..4]); const b = endian::begetu32(buf[4..8]); if (a != b) { return badpass; }; key.privkey[..] = buf[..]; free(key.kdf); free(key.kdfname); free(key.cipher); key.kdfname = strings::dup("none"); key.cipher = strings::dup("none"); key.kdf = []; }; The “cipher.init” function is an abstraction that allows us to support more ciphers in the future. For this particular cipher mode, it’s implemented fairly simply: type aes256ctr = struct { st: cipher::ctr_stream, block: aes::ct64_block, buf: [aes::CTR_BUFSIZE]u8, }; fn aes256ctr_init(handle: io::handle, key: []u8, iv: []u8) *io::stream = { let state = alloc(aes256ctr { block = aes::ct64(), ... }); aes::ct64_init(&state.block, key); state.st = cipher::ctr(handle, &state.block, iv, state.buf); return state; }; Within this private key data section, once decrypted, are several fields. First is a random 32-bit integer which is written twice — comparing that these are equal to one another allows us to verify the user’s password. Once verified, we overwrite the private data field in the key structure with the decrypted data, and update the cipher and KDF information to indicate that the key is unencrypted. We could decrypt it directly into the existing private key buffer, without allocating a second buffer, but this would overwrite the encrypted data with garbage if the password was wrong — you’d have to decode the key all over again if the user wants to try again. So, what does this private key blob look like once decrypted? The hare-ssh repository includes a little program at cmd/sshkey which dumps all of the information stored in an SSH key, and it provides us with this peek at the private data: 00000000 fb 15 e6 16 fb 15 e6 16 00 00 00 0b 73 73 68 2d |............ssh-| 00000010 65 64 32 35 35 31 39 00 00 00 20 4e ea ab fa 4c |ed25519... N...L| 00000020 93 d5 6b 46 ea 67 f6 3e 3f b4 d1 dc 94 99 ca 80 |..kF.g.>?.......| 00000030 90 04 d6 97 d4 79 c4 4d 4f 57 c0 00 00 00 40 17 |.....y.MOW....@.| 00000040 bf 87 74 0b 2a 74 d5 29 d0 14 10 3f 04 5d 88 c6 |..t.*t.)...?.]..| 00000050 32 fa 21 9c e9 97 b0 5a e7 7e 5c 02 72 35 72 4e |2.!....Z.~\.r5rN| 00000060 ea ab fa 4c 93 d5 6b 46 ea 67 f6 3e 3f b4 d1 dc |...L..kF.g.>?...| 00000070 94 99 ca 80 90 04 d6 97 d4 79 c4 4d 4f 57 c0 00 |.........y.MOW..| 00000080 00 00 0e 73 69 72 63 6d 70 77 6e 40 74 61 69 67 |...sircmpwn@taig| 00000090 61 01 02 03 04 05 06 07 08 09 0a 0b 0c 0d 0e 0f |a...............| We can see upfront these two 32-bit verification numbers I mentioned, and following this are several fields in a similar format to earlier — length-prefixed strings. The fields are: Key type (“ssh-ed25519” in this case) Public key (in a format specific to each key type) Private key (in a format specific to each key type) Comment Padding up to the cipher’s block size (16) This is a little bit weird in my opinion — the public key field is redundant with the unencrypted data in this file, and the comment field is probably not so secret as to demand encryption. I think these are just consequences of the file format being private to OpenSSH’s implementation; not much thought has gone into it and implementation details (like the ability to call the same “dump private key” function here as OpenSSH uses elsewhere) have probably leaked through. We can decode this data with the following Hare code: export fn decodeprivate(src: *sshprivkey) (key | error) = { assert(!isencrypted(src)); const buf = bufio::fixed(src.privkey, io::mode::READ); let verify: [8]u8 = [0...]; io::read(&buf, verify)!; const a = endian::begetu32(verify[..4]); const b = endian::begetu32(verify[4..8]); if (a != b) { return badpass; }; const keytype = readstr(&buf)?; defer free(keytype); switch (keytype) { case "ssh-ed25519" => let key = ed25519key { ... }; decode_ed25519_sk(&key, &buf)?; return key; case => // TODO: Support additional key types return badcipher; }; }; // An ed25519 key pair. export type ed25519key = struct { pkey: ed25519::publickey, skey: ed25519::privatekey, comment: str, }; fn decode_ed25519_pk(key: *ed25519key, buf: io::handle) (void | error) = { const l = readu32(buf)?; if (l != ed25519::PUBLICKEYSZ) { return invalid; }; io::readall(buf, key.pkey)?; }; fn decode_ed25519_sk(key: *ed25519key, buf: io::handle) (void | error) = { decode_ed25519_pk(key, buf)?; const l = readu32(buf)?; if (l != ed25519::PRIVATEKEYSZ) { return invalid; }; io::readall(buf, key.skey)?; // Sanity check const pkey = ed25519::skey_getpublic(&key.skey); if (!bytes::equal(pkey, key.pkey)) { return invalid; }; key.comment = readstr(buf)?; }; Fairly straightforward! Finally, we have extracted the actual private key from the file. For this SSH key, in base64, the cryptographic keys are: Public key: Tuqr+kyT1WtG6mf2Pj+00dyUmcqAkATWl9R5xE1PV8A= Private key: F7+HdAsqdNUp0BQQPwRdiMYy+iGc6ZewWud+XAJyNXJO6qv6TJPVa0bqZ/Y+P7TR3JSZyoCQBNaX1HnETU9XwA== Signing and verification w'''
