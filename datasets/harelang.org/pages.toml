full_description = "Community resources We have a small community, but we’re happy to talk to you. Community members in all community spaces and beyond are expected to act in accordance with the Code of conduct. Contents Code of conduct Hare evangelism Mailing lists Note All mailing lists require the use of plain-text email. hare-announce All Hare users are encouraged to subscribe to the hare-announce mailing list to receive important updates regarding changes to the Hare language, release announcements, and security advisories. Archives Subscribe (mailto:) hare-users The hare-users mailing list is used for end-user support, questions, and general discussion of Hare. Archives Subscribe (mailto:) Post (mailto:) hare-dev Development discussion takes place on hare-dev, as well as patches for the Hare toolchain and standard and extended libraries. Archives Subscribe (mailto:) Post (mailto:) hare-rfc Larger changes proposed for the Hare programming language are discussed using the RFC process on hare-rfc. Archives Subscribe (mailto:) Post (mailto:) IRC channels We meet for real-time chat on libera.chat in various channels: #hare: Questions and general discussion about Hare. #hare-dev: Discussion about Hare development. #hare-soc: Social channel, for light off-topic discussion. Fediverse We have a community-maintained presence on the Fediverse supernetwork at @hare@fosstodon.org. Follow us from any Fediverse server for Hare news and updates."
