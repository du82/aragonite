["http://harmful.cat-v.org/economics"]
title = "Economics"
full_description = "Economics Economics is a field that is just as often ridiculed, over-simplified, or most often outright ignored. Despite this economic principles underline every aspect of our world, and the general lack of understanding of this principles is the cause of many of the problems that ail mankind. In issues of economic policy often (alleged) intentions are given more importance than real consequences, and the generated incentives are ignored. Here are some of the most misunderstood and harmful economic ideas: Subsidies Minimum wage Rent controls Intellectual property Antitrust laws Economics in Quotes By Milton Friedman: ‘If an exchange between two parties is voluntary, it will not take place unless both believe they will benefit from it. Most economic fallacies derive from the neglect of this simple insight, from the tendency to assume that there is a fixed pie, that one party can only gain at the expense of another.’ ‘A major source of objection to a free economy is precisely that it … gives people what they want instead of what a particular group thinks they ought to want. Underlying most arguments against the free market is a lack of belief in freedom itself.’ ‘One of the great mistakes is to judge policies and programmes by their intentions rather than their results.’ See also the rest of the cat-v.org quotes about economics compilation. External Links Articles: Our small business and the era of Yet Bigger Government - How government affects the running of small business. By Philip Greenspun. Blogs: Johan Norberg - A Swedish writer devoted to globalization and individual liberty Library of Economics and Liberty The Commons Blog - Markets protecting the environment. Other sites: Free to Choose Media - The wisdom of Milton Friedman"
