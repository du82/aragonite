full_description = "Abusing Science Science is one of the most beautiful and awe inspiring accomplishments of mankind, but many people seem to be in denial about the power and clarity that science brings to our understanding of the world, and insist taking us all back into the dark ages. If that was not bad enough, ridiculous and stupid things are said and done in the name of Science again and again, either out of interest to push a certain agenda or out of pure ignorance and ineptitude. Economics - Economics is such a widely ignored, manipulated and abused field that it justifies its own whole section. Global warming scaremongering - Environmental scaremongering is a problem in general, but it is specially annoying when a real problem exists and it makes any rational/scientific discussion of the subject impossible. Links Bad Science by Ben Goldacre - A great site about crackpot science. James Randi Educational Foundation - Randi rocks Skeptic’s Dictionary - A wonderful resource for anyone that doesn’t like to live in a delusion."
