title = "Why Trees, by Hannah Gold"
description = "Timeless stories from our 175-year archive handpicked to speak to the news of the day."
full_description = "March 2025 Issue [Story] Why Trees Download PDF Adjust Share by Hannah Gold, Paintings by Dror Cohen for Harper’s Magazine A ten-minute coffee break was called on set, time Laura used to continue her keen, proprietary staking out of those lives she might still be permitted to lead, and those which were no longer possible. She saw the assistant in her puffer coat handing steaming coffees to the crew, indicating that filming would soon begin. Then her more threatening significance, only somewhat obscured by the bulky outerwear: thin wrists emerged from the sleeves, chin-length hair dyed crimson poured from the hood along with a face that was young and patient, ringing with good cheer. Laura, a few weeks away from turning thirty, could not be quite that young again, but she could still wait patiently for the professional milestones that would one day accrue to her, be gracious and charming on her way up, even feign laughter at her co-workers’ compulsively genial remarks before they all headed out for the weekend. Although these co-workers, if you could even call them that, were always rotating in and out of the short-lived gigs that she was also rotating through, and so they hardly seemed worth the trouble. She’d held down odd jobs for so many years that the cycle had congealed into a routine. On Tuesdays, Wednesdays, and Thursdays she wrote ad copy, usually at home with little oversight; the work always took less time than they gave her to complete it. For years she’d written copy for movie posters and viral campaigns (lines like “This Christmas, payback won’t be cheap” and “Love happens when you least expect it”), although for the past few months she’d been reassigned from theatrical releases to the concession stand. Coca-Cola had hired the firm for some contract work and her boss was throwing just about everyone at it. Between these thrillingly lucrative hours of corporate idling, she doctored treatments for other people’s immature attempts at TV pilots or films—students and other amateurs whose hopes outmatched their talents. This she did less for the pay (which was pitiful) than for the vague notion that industry contacts would materialize bearing funds and distribution for one of her own screenplays, several of which inched along in the evening hours—and there they remained. It seemed to Laura that her scripts had begun to grow frail in the dark. Yet still she counted on their eventual unveiling, and on the grandest possible platform: the silver screen. First the festivals, then New York and L.A., then the world would bear witness to her childhood fears, her daily passions and frustrations, her minutely observed existence, all tastefully packaged within, for instance, a buddy comedy or an interplanetary embezzlement plot. Laura showed these developing screenplays to only one person, her boyfriend, Mark. They’d met shortly after she’d moved to the city, when she was a year out of college and he was beginning a doctorate in psychiatry. Seven years had passed since then, and he still handed back her works in progress gingerly spotted with black pen on sheets printed out on the campus where he lectured once a week. It stoked her delicate sense of accomplishment that, although he was five years older than her, Mark had been attending school throughout their relationship and was only just now venturing into what she conceived of as the “real world,” where she had held court—or at least held down jobs—all these years. “Finally we’re both doctors,” she’d say to him with a one-sided smile like a fake nudge in the ribs. And yet certain dynamics between them eluded her. Like that all this time, there’d been this other world, the intimate sphere of their relationship, in which she had been the one getting her papers graded. Mark made every effort to bestow praise on Laura’s work, encouraging her to go forth boldly and gather collaborators for her drafts in the public forum, the marketplace of ideas, social media. “Sometimes it’s good to be pushy!” he would say. But neither of them was. Between them flowed acceptance, calm, and the unspoken expectation of a tomorrow. Also, on any given evening, about a mile and a half of foot traffic. They lived in separate studio apartments, two subway stops away from each other, which Mark insisted suited him fine. He had asked to move in with her once, but that was years ago. Laura said it was for his sake as well as hers that they lived apart. Her habit of working late into the night might inconvenience him, leave him sleepless, or worse: whatever injury she inflicted upon him could one day be dumped by way of the transitive property onto his patients, whom she pictured as blank, hapless individuals standing in the streets, staring at the sky with enormous cow’s eyes, waiting for anvils to drop onto their heads. They were the ones disasters struck. She was the one who made every effort to forestall a bad result. She was careful with money and steadfast in her creative practice. The desk in which she kept her drafts was a wobbly wooden antique, a fully biodegradable item she’d acquired for next to nothing. The actors with fresh cigarettes burning began to descend from their trailers, drawing closer to the set like a swarm of lightning bugs. The crew was keeping warm in a smoke shop. The scene would take place outside on the snow-covered street, as well as in a bar down the block. It would be a short film in color, “but it should feel black-and-white, like a paperback novel,” insisted the director, who typically shot fashion campaigns in studios and shifted uneasily in the real snow. Laura rolled her eyes from behind the foggy glass panel of the storefront window. The idea the director had proposed to Laura, once they’d been put in touch by a photography student of his at Parsons for whom Laura had done a bit of writing, was to shoot the film from the vantage point of an inhuman and ubiquitous force. Something heaven-sent or heaven-bound, which he referred to as “fate.” It was Laura’s job to transform the director’s abstract vision into a storyline that audiences could digest. Not only to write the script, but to communicate its subtleties to the actors and ensure they didn’t get too creative with improvisations. But the director hadn’t been making any of this easy for her. “A divine force caresses the mortal world,” he had told Laura over Zoom the previous month. (The plot concerned two young strangers who venture out on an awkward first date one snowy Brooklyn night.) He spoke slightly warped English with a mild Parisian accent. “It’s on account of this divine force, this fate,” continued the director, “that I don’t film the faces of the two young people falling in love at all. I used to be obsessed with faces, but now I’m completely over them. Recently, at my day work, I was experimenting with asking the models to close their eyes or cover their faces with a visually arresting object, such as a vase of flowers or a lockbox. Of course, the clients all hate this. They say, ‘Pierre, please focus.’ They say, ‘The point is not to observe a beautiful young girl holding a pink grapefruit in front of her head, the point is to sell vegan-leather harnesses to wealthy twenty-year-olds.’ I am developing early-onset arthritis from clenching my fists all day. So I will make my own films. You see?” The assistant approached Laura, holding a hot coffee between two mittens. “No, thanks,” said Laura. “I’m one of those horrible tea drinkers.” “Oh yeah, I heard about you guys on the news,” said the assistant. “Real sick individuals. But, no, this one’s mine.” The assistant wasn’t as compliant and bubbly as Laura had assumed moments earlier. In fact, her deadpan tone and lackadaisical manner were a lot like Laura’s. “We’re a presumptuous lot, us tea drinkers, but helpful. Can I help you with something?” “Just wanted to say hi. I’m Sophie. It’s my first time working with this director, and everyone else here.” “I’m pretty sure it’s his first film,” said Laura, nodding at the director, who was smoking a cigarette while munching on a snowball. “And it could be a one-time thing, if you know what I mean.” “Right, I gather. Anyway, he wouldn’t want me back—I screwed up his coffee order earlier.” Laura inwardly smirked at the characteristic self-doubt of a woman some eight years her junior. “Nobody remembers a thing like that.” “I’ll remember it,” Sophie shot back, unfazed by the hint of condescension, if she’d even picked up on it. “He asked for cold coffee. Cold, not iced. He said it should ‘retain the memory of having once been warm.’ ” “Jesus.” “Yeah. I panicked and added two sugars. But, oh well. I hear he’ll be turning fifty soon.” “Mon dieu. You wouldn’t know it to look at him. He’s creased, yet boyish.” “Here I thought he was just vain. You’re Laura, right?” “I am. Have we met?” “That actor guy Dorian pointed you out,” said Sophie, not bothering to scan for him. “He said he doesn’t know anyone here either, except you. I realized talking to him that you and I have a friend in common.” Laura highly doubted this. She had only a few friends and was a micro-generation older than this woman, which surely meant something in the real world. “Terry McNaught,” said Sophie. “Excuse me?” “Terry McNaught.” “Afraid I don’t know such a person.” “I’m not wrong about this. You’re dating Psychiatrist Mark who lives on Halsey Street with the dog with the thyroid issue.” “Yes.” “And you’re close with Terry McNaught.” “No.” “Terry and I worked together on the student-debt-abolition campaign like a million years ago.” “That’s cool. But I don’t know this person, so . . . let’s leave it,” Laura suggested, with faux kindness. “You’re mistaken.” A conspiratorial comprehension dawned on Sophie’s pristine forehead. Laura did not like it one bit. “Okay,” said Sophie. “It’s early in the relationship. I get it. I never open up about anything unless I feel like it. My family doesn’t even know I drink coffee.” “And the only thing you know about me is that I drink tea. I’ve been with Mark for seven years. It’s this Terry McNaught character I know nothing about.” That last comment seemed to send Sophie reeling. She leaned forward and the pace of her words quickened. Laura, absorbed by this sudden change, also bent closer. From a distance the two women in their big coats could almost be mistaken for a single, lurking animal. Then a gasp. And another. In almost no time Sophie and Laura had managed to untie one knot, only to find a tighter and far more perplexing one at its center. It astounded Laura to learn that Mark was seeing another woman, whose name also happened to be Laura. The affair had been under way for at least two months. Laura had never liked the way she looked. It had pained her to discover, in middle school, that she did not quite look like anyone else, though it was a pain she hardly registered since it was her conscious wish to be original in everything she did. At twenty-nine, a voyage through her Instagram suggestions would sometimes show her, on other women, her own eyes, nose, or skin tone. Less often her figure and hair. Once isolated, these attributes were difficult for her to picture in concert with one another. She was always flicking the incomplete image of herself away, as if too much dirt had settled here, now there. This was the regular, self-reproachful state of affairs. But in the days following Sophie’s revelations she had discovered several new ways in which she did not recognize herself. At first—feeling nothing, yet watching a wall of pain approach against which her psyche might splatter—Laura reasoned that it was necessary to discuss the affair with Mark at his and her earliest convenience. She could even indicate over text that their meeting was “urgent” or “urgent haha.” But then she found that she was incapable of sending such a text. She wanted only to run through the streets waving a flag behind her so white and senseless it blocked out the scenery, the sky. She let the weekend go by without contacting him. Then, momentarily caught in the ladderlike lines of a crosswalk, she realized she had forgotten what Mark looked like, and the sound of his voice. It didn’t matter much, in any case. He was more of a cause than a person, some way of life that had mattered and sustained her, but was lost, or about to be. How rapidly the rising generation had imposed itself upon her! Yesterday she had been young. Then she was inside his apartment, standing in his doorway. “It’s eleven o’clock,” he said—his robe on, his feet bare. “All right,” she said. “I can see how a thing like that would happen.” “A thing like what? I’ve been texting you since Tuesday. I was worried.” “And that makes it what day now?” “It’s Wednesday,” said Mark. He was a man of average height with a little round belly and delicate snub nose. The bone structure in his face was all hidden and he smiled easily, which made him look trustworthy. His curly brown hair was thinning on top in the shape of a muddy footprint. None of which Laura could see clearly, because the apartment was dimly lit. Mark had been asleep. “The day after Tuesday.” “It’s almost Thursday.” “But I didn’t come here to enumerate the days of the week, Mark. No. I have serious questions to ask you. Like: where’s the fucking fucking fucking fucking—” Mark stared at her with his mouth open, as if he had been interrupted. But he hadn’t been interrupted. Perhaps, thought Laura, he meant to show her that she’d interrupted years of his life, that all this time he’d been standing around trying without success to yawn just once. “Laura, what’s wrong?” “I know what you know I know! And I feel like a petitioner standing in your doorway like this.” “All right, yeah, come in. Take a seat.” They settled onto the lumpy gray sofa in the living-room portion of his studio apartment. He began by telling her a story. At the hospital in the real world where Mark worked four days a week, the nurses had gone on strike. Hospital administrators had warned the staff against becoming discouraged or speaking with reporters at this challenging moment. They urged professional neutrality. Mark didn’t like to be reminded that sickness and death turned a profit. It made him feel ashamed. So when the reporter reached out, he responded. He was off the record, and the reporter wasn’t intrigued by what he had to say, since she’d heard it all before. But she listened. Her name was Terry McNaught. She told him, also off the record, that if he wanted to “plug” into “the movement,” perhaps in a way that wouldn’t put his new job in jeopardy, he could stop by a potluck her friend was organizing later that week. Terry wouldn’t be there, but she could place him on the email thread. Fifteen days later, he rose early to cook a vegetarian chili that traveled with him to the hospital in a little plastic pail that had once contained pickles. Later, it sat, cold and condensing, in his lap on the train to Bay Ridge. When he push"
