full_description = "The Evening Star, ca. 1830, a painting by Caspar David Friedrich, whose work is on view through May 11 at the Metropolitan Museum of Art. Courtesy Freies Deutsches Hochstift, Frankfurter Goethe Museum, Frankfurt am Main (IV-1950-007) A spread from Afropean: A Journal, by Johny Pitts, which was published in November by MO?REL. Courtesy the artist and MO?REL Self-Portrait ‘en plein air’ 4, a painting by Adrian Ghenie, whose work is included in the exhibition TO LIVE IS TO FLY, which is on view through April 5 at Tim Van Laere Gallery, in Antwerp, Belgium. Courtesy the artist and Tim Van Laere Gallery “Untitled (Zabriskie Point) Death Valley, California, 2021,” a photograph by Victoria Sambunaris, whose book Transformation of a Landscape, was published in November by Radius Books. Courtesy the artist “That our species has the power to destroy life on earth but not to contain wildfires in California should give us pause as we consider what our ingenuity and determination can do in the face of a violent planet. The ocean and atmosphere are simply too vast and complex for our minds to finely conceptualize or our tools to fully contain. Our powers are great but narrow, the world far bigger than we imagine.” “An unexpectedly excellent magazine that stands out amid a homogenized media landscape.” —the New York Times From Upton Sinclair to Barbara Ehrenreich, Harper’s has been home to America’s most daring journalists."
