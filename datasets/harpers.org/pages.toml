["https://harpers.org/archive/2023/10/the-spy-cusk"]
title = "The Spy, by Rachel Cusk"
description = "A weekly email taking aim at the relentless absurdity of the 24-hour news cycle."
full_description = "October 2023 Issue [Essay] The Spy On seeing without being seen by Rachel Cusk, Intrusive Thought, by Lenz Geerk © The artist. Courtesy the artist and Roberts Projects, Los Angeles [Essay] The Spy On seeing without being seen by Rachel Cusk, Adjust Share Not long ago our mother died, or at least her body did—the rest of her remained obstinately alive. She took a considerable time to die and outlasted the nurses’ predictions by many days, so that those of us who had been summoned to her bedside had to depart and return to our lives. No one cried at her death, though among the congregation at the funeral there were some outbursts of shocked weeping, as though at the sight of death being surprised in the act of stealing from life. It was the entrance of the coffin, rather than the death itself, that constituted the violence of this act. The coffin was shocking, and this must always be the case, whether or not one disliked being confined to the facts as much as our mother had. The body inside the coffin was entirely factual. She had never seemed to take much notice of her body: it had been her vehicle, that was all. But its authority, it turned out, had been absolute. For a while afterward there was a feeling of lightness—a feeling almost of freedom. The violence of death had the appearance of a strange generosity. A capital sum had been returned to the living: we on the side of life had been in some way increased. But in fact an unease remained, which grew and which was our mother’s impenetrable bequest to us. There ought to have been a feeling not of freedom but of loss. If there was loss, then it was of something we had never had. We were free simply from the conundrum of this double loss. It was noted that at the funeral we had remained unmoved. It was a day of extreme, almost frightening heat, like the day of Meursault’s mother’s funeral at the beginning of Camus’s The Stranger. Meursault’s seeming indifference that day was also noted: it later became a central piece of evidence in his trial and conviction as a heartless killer. Was our indifference likewise a philosophical refutation of the social contract? Had we too run the risk of being arrested and convicted for the failure to adhere to cultural and moral narratives? Months later, at dawn on the ninth floor of a hotel in The Hague, standing before a view of astonishing ugliness, it became evident that our mother was accompanying us in a way she had not when she was alive. Far below people scurried across the concrete spaces in the cold gray morning. A violent wind was blowing. It shook the power lines and the leafless trees. It rattled the hoardings outside the shop fronts. It upended the litter bins and sent their contents whirling madly into the air. The mother of the filmmaker E did not know who her son was: his name, which had become widely known, was not in fact his real name. He had assumed it so that she should not discover what he did. While she lived she knew nothing of his illustrious career, and even after she died he maintained this alias and the habits of secrecy and disguise that came with it. His films were naturalistic and poetic, and his mother might not have found much in them to disapprove of, but he would not have been able to create them in the guise of himself. Yet what was perhaps most unusual about them was that they were always instantly recognizable as his. His style, so uninterfering, drew attention to itself without meaning to. He rarely, for instance, showed his characters in close-up, believing that this was not how human beings saw one another. His films had no particular aesthetic. They often took place in public spaces, and his characters seemed barely to notice that they were being watched. They wore ordinary clothes and rarely looked at the camera. They were absorbed in their own lives. For those accustomed to the camera’s penetration of social and physical boundaries and the strange authority of its prying eye, this absence of what might be called leadership was noticeable. People were often baffled or even angered by his films. They expected a storyteller to demonstrate his mastery and control by resolving the confusion and ambiguity of reality, not deepening it. Even the more radical filmmakers among E’s contemporaries at least gained respect through the boldness and assertiveness of their artistic vision. E’s family lived in a large house in a bourgeois country town, and this is where E had spent his childhood. There were two sons, of whom E was the elder, a position that entailed the maximum exposure to the parents and their customs and beliefs. Like the figurehead on the bow of a boat, E had received first the impact of their natures, to which the momentum of youth imparted a continuous quality of violence. This violence was societal rather than personal, for his parents were people of strict conventionality and religion. Later he saw himself as a door between them and the whole notion of inner life, and his discovery that this door could be kept shut was both relieving and fateful. His younger brother used the existence of that door to free himself from certain inhibitions and constraints. Later he claimed to have been greatly marked by the parental regime, and it was in his ability to make this claim that the difference between him and E lay. E left the town as soon as he could, going away to study and then working as a teacher. He had thought that he would find sympathy among children. His own childhood appeared to qualify him for that sphere, as though this were his expertise. His ambition, so long held that it had more the character of an assumption, was to be a writer, and it had seemed to him that teaching would naturally fit with that goal. But in fact there could have been nothing worse than to encumber himself with the obligation to form and control children. One day he simply abandoned his post, telling no one except his brother, and for many years afterward his parents continued to believe that he was a schoolteacher. The brother lived in the city now, where he was distinguishing himself in academic and philosophical circles. E met his brother’s friends and associates, clever young men who played indefatigably with language, like athletes. Their sport was to take a precept that had functioned eternally as a pillar of reality and demolish it: reality did not generally, as a consequence, come tumbling down, but one’s sense of its solidity and familiarity was altered. Obtuse with innocence, blinkered by a lifetime of dissimulation before authority, E was slow to realize that many of these men—including his brother—were homosexual. The brother talked openly, even obsessively, about the privations of his childhood and the deformation of body and mind that was the result of having had to conceal his true nature. He wrote philosophical articles advocating for the sexual liberation of children and published them under his own name. E did not discuss these articles with his brother, and was generally silent in the company of his brother’s friends. He hid from their upending of conventionality much as he had always hidden from its enforcement. He had found an apartment of his own in the city. Alone for the first time in his life, he looked out the window day after day at the rooftops and sky and considered what he would do. The view from our window is of rooftops and sky, and of other top-floor windows set at angles determined by the pattern of the streets below. The emptiness between the buildings is thus shaped according to the same pattern. This elevated world, with its streets of air, seems to suspend the humans who live up here in another element: the windows are a kind of lens through which they become representational. The building opposite has a little round window in its mansard roof, and sometimes the face of a small girl appears there. When she notices that she is being perceived she waves, as though from one boat to another. Often people open their windows and lean out, looking down and around. Being seen while seeing, they are doubly illuminated by the light of perception. At sunrise, across the void in the quiet of morning, a man appears on the balcony opposite to smoke, the lower half of his body wrapped in a towel. He is young and bronze-chested. He lights his cigarette and looks at his phone while the pink light fills all the windows behind him. His freedom in that moment seems absolute. At night, when the lights are on, the scenes playing high up in the windows are framed by emptiness, like the paintings of Edward Hopper. They are paintings of people in rooms, together or alone, seen through windows or across spaces by an eye that seems larger and more omniscient than a human eye. It could be the eye of a god, or equally that of an animal or a child. Hopper was interested in the theater and in stage sets: another explanation for his lines of perception, so frequently bizarre, comes when one imagines that one is viewing these scenes from a seat in the stalls or the gallery. His human figures have a theatrical quality. In the recurrence of their own lives they seem to exist outside time. Some of that quality is present in the view from our window, not because the people are consciously enacting themselves, but because perception itself—the pure perception that involves no interaction, no subjectivity—reveals the pathos of identity. Does it help us to be seen, even when we don’t know we are? A mother is continually seen by her children, whether or not she credits them with a point of view. From the beginning they are amassing images of her, of her body in all its angles and positions and moods. Her body becomes the known point from which they broach all that is unknown. They see her mainly when she is paying them no attention; when her attention comes it is seismic, as though an actor had suddenly turned and addressed a member of the audience. They see her when she thinks she is alone, despite the fact that they are there. These witnesses of her that have grown out of her can startle or displease her with the independence—the non-bias—of their observations. They are not extensions of her own will and consciousness, and in this way they inform her that she cannot control what is known about her and does not entirely know herself, that they know more about her than she does about them, since they have not yet become themselves. Yet her power to wound them is limitless. She had had many pregnancies, and had become steadily debilitated by excess weight and sedentary habits. She seemed to want and welcome debility: perhaps it was a way of drawing attention to the site of contention that was her body. Her personality, so dominant, was clad in the statement of its own ultimate disempowerment. She offered her flesh as another person might offer their beauty. This flesh was a sort of outcome, the result of all the things that had been done to her body during her life, whether by herself or others. Inexorably, year by year, she lost her shape. Her formlessness became a sort of challenge to the notion of form itself and to conformity. She discovered that she could use this non-conformity to control what people expected her to do and therefore what they were able to do themselves. In this sense her formlessness was the active counterpart to her beauty. When she had possessed beauty, her management of outcomes had been far less successful. In formlessness she discovered power, and also the freedom from limitation. She laid claim to all kinds of maladies, had unnecessary operations, and took all the drugs the doctors were willing to prescribe her; she insisted on using a wheelchair, and eventually refused to walk at all. When she said she had cancer no one believed her: it is possible she didn’t believe it herself. But finally, one day, a doctor confirmed it. He told her she would shortly die, and her response to this news at first was as to the fulfillment of a fantasy of attention or importance, as though she had at last been offered the starring role she had always felt was destined for her. The encounter with reality, deferred for so long, avoided by so many ruses and fictions, proved in the end hard to recognize. She mistook death for a compliment, and when finally she realized that this dark stranger was not a prince but an assassin, she struggled vainly to get away. She tried to walk: the news reached us that after all these years of half-voluntary paralysis she was attempting to get out of her wheelchair and walk. It seemed she thought that she could simply stop playing, stop pretending—that she could reverse her will and take refuge in reality. But for her there was no longer any reality: she had long since broken her contract with it. She had allowed it to decay all around her, in her pursuit of limitlessness. Some weeks after she died she entered our dream, walking through it without seeming to see it or know she was there. She was giant and doll-like, an inflated, unclothed figure moving robotically forward as though in a trance. The people in the dream moved out of the way to let her pass. She saw nothing and nobody, walking mechanically past them and away, walking naked out of the dream as she had walked into it, as though her fate was to walk and walk in this monstrous fashion for eternity. When she passed us she showed no recognition. We looked at her face and felt a leap of consternation and pity. It was her true face, the one we had never seen but had somehow known about and imagined since childhood. It wore an expression of unspeakable unhappiness. Alone in the city for days at a time, E worked on a novel. It concerned the lives of people in a bourgeois country town over the course of one summer, people paralyzed by the disconnection between their inner and outer lives and by the difficulty of locating authenticity in their own feelings. They lived in a comfortable household and spent their time on pleasant summer activities, but their glimpses of the moral and natural beauty of the world only made their attempts to relate to one another seem ugly and false. The coupling instinct, with its flirtations and ellipses and adherence to the narrative framework of romance, felt burdensome and constraining, like an artificial limb. Yet in fact it was this marriage of instinct and narrative that would eventually drive them into social conformity. The youthful truth of their feelings, along with their bonds to nature and spirituality, would be lost. A publisher bought the novel, which came out under an assumed name. E had made up this name midway through his writing process, when it became clear to him that he was unable to write freely as himself. The prospect of being identified with his own actions plunged him into the same dilemma as that of his characters: the loss of an internal truth through the construction of external identity. There was shame and inhibition, too, at the idea of the people who "
