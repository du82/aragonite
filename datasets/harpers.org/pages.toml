["https://harpers.org/archive/2025/03/new-world-symphonies-matthew-sherrill-future-of-music"]
title = "New World Symphonies, by Matthew Sherrill"
description = "Timeless stories from our 175-year archive handpicked to speak to the news of the day."
full_description = "March 2025 Issue [Miscellany] New World Symphonies Download PDF Adjust Share Listening for the future of music by Matthew Sherrill, Illustrations by Toma Vagner Jean-François Laporte stood on the stage of a Georgia Tech auditorium, manning the helm of what could have been a device of extraterrestrial origin. What looked to be a keyboard stand had been outfitted with an audience-facing drumhead at either end, between which lay a hopelessly tangled nest of tubes, knobs, and cables. In the center of the contraption, a PVC pipe hung down and curled under itself like a great proboscis. Jean-François—a bald, fifty-five-year-old Québécois in a slim-fitting black T-shirt and Coke-bottle glasses—was perched imposingly above it all, looking not unlike a futuristic aviator piloting a giant, cybernetic wasp. Gravely serious, Jean-François began flicking at the taut latex drumheads, pulling at valves, and tweaking dials. The machine responded with a series of chirps and squeaks, then a sequence of electronic pops, some anguished ululations, the squeal of a deflating balloon, and finally, a low-register woodwind hum. After a few noisy minutes, everything fell silent; the performance was over. The handful of people scattered throughout the auditorium offered applause. A few nodded and scribbled notes. The Babel Table, as he’d named it, was one of ten finalists in the 2024 Guthman Musical Instrument Competition, an annual event held to identify and promote the “newest and greatest ideas in music.” The Babel Table’s competitors, scattered around the stage, consisted of a number of other newly designed instruments, only a few of which—to the amateur’s eye, at least—were recognizable as instruments in the first place, their appearances ranging from a small, unassuming wooden box to what could have been mistaken for a military-grade rocket launcher. Judging the Guthman were three former contenders: Bosko Kante, a Grammy Award–winning musician featured on earworms by Dua Lipa, Kanye West, and Big Boi; Kelly Snook, an ex-NASA scientist turned something called “data sonification researcher”; and Andrew McPherson, the head of the venerable-sounding Augmented Instruments Laboratory at Imperial College London. All three were Guthman royalty, having been conferred prizes in previous competitions—Kante for his ElectroSpit Talkbox (about which no less a luminary than T-Pain himself concluded, “This is fucking cool!”), Snook for her MiMU Gloves (employed most notably by the two-time Grammy winner Imogen Heap), and McPherson for his magnetic resonator piano (seemingly just a cool contrivance with neither commercial potential nor pop-star endorsement). This trio would hear live demos, fiddle with the instruments, and interrogate their inventors before declaring a winner. For the grand finale, contestants would be paired with local musicians and given a few hours to plan—or plan to improvise—a brief performance for whatever audience existed in Atlanta for this sort of thing. Georgia Tech branded it the “jam session of the future.” Jean-François has a distinguished résumé for an avant-garde composer, earning accolades across the Great White North. He grew up in Montreal aspiring to be a housebuilder, but then lucked into an exchange program and traveled to Kinshasa, in what was then Zaire, a land he thought of as the “capital of music in Africa.” He returned to Canada several months later with a reinvigorated sense of creative possibility and the idea that his skill as a builder, with “material passing through my hands,” might help him construct a music career. In 1997, he released “Mantra,” his most renowned—and most Canadian—composition, a twenty-odd-minute recording of a compressor cooling a hockey rink. I dug it up on YouTube, and found it reminiscent of listening to breaking waves on an old CB radio. Dusted magazine called it a “deeply moving piece of mechanical mysticism, like a lawnmower on acid.” It’s “kind of a classic,” he told me. The Babel Table was a defiantly acoustic instrument, generating its sound through the manipulation of compressed air. Given Jean-François’s training as a civil engineer and builder, the instrument’s mechanics made a certain amount of sense; I imagined it as a kind of sonically resonant HVAC system. It was originally made for a stage show devised to teach children about marine life, and Jean-François had bestowed lighthearted nicknames on the Babel Table’s various sounds and controls. The chirps were the product of his “Insects,” tiny metal pipes covered with latex membranes; the agitated ululations stemmed from a different vibrating membrane that Jean-François called the “Diva.” When the entire machine was brought into service, it sounded sometimes like the din of heavy machinery, sometimes like a chorus of jungle fauna. It’s no insult to Jean-François’s ingenuity to admit that it was difficult to imagine the Babel Table as the harbinger of a new aural reality, forging a bold, uncharted path into the musical hinterlands—or really, to imagine it doing much beyond soundtracking a lesson for schoolchildren about jellyfish or phytoplankton. But that’s an almost impossible standard, to be fair: How many genuinely new instruments, over the past century, over the past two centuries, have attained an enduring place in musical culture anyway, let alone popular musical culture, which, to my mind at any rate, has struggled to evolve much at all over the past few decades? And at a moment when more or less any sound, any effect, is already at our digital fingertips, doesn’t the likelihood that any particular new instrument might hold the key to our musical future grow vanishingly small? In such a world, who needs new instruments? To dub the Guthman the “jam session of the future” was, in this sense, almost laughably quixotic. And yet, the promise that I might descry that future—that I might, decades from now, be able to smugly and persistently remind my children that I was there the night the now-ubiquitous Babel Table was first introduced to the public’s collective ear—was difficult to resist. If this was indeed the “jam session of the future,” I wanted to be there for the jamming. In 1841, Adolphe Sax brought a newly invented instrument to the Brussels Industrial Exhibition. By then, the prolific Belgian tinkerer had already made a lasting contribution to the history of musical tech with his fundamental revision of the bass clarinet. (“Compared with this instrument,” remarked the conductor François-Antoine Habeneck, “the old clarinet is a monstrosity.”) Sax was also working on a whole suite of saxhorns, the nineteenth-century ancestors of modern-day flügelhorns and euphoniums. But despite it all, Sax had grown bitter that he had as yet been unable to place first at any of the previous exhibitions he had attended; he was hoping that this would finally be his breakthrough. Unfortunately for Sax, when he carelessly left his instrument unattended, a still-unidentified rival is suspected of kicking it angrily across the room, mangling it so badly that Sax was forced to withdraw it from competition. This, according to not completely unfounded historical conjecture, was the first saxophone. Along with the sousaphone and the steel drum, the saxophone is one of only a few acoustic instruments invented over the past two centuries to have enjoyed any sort of broad popularity, at least in Western music. (The sax, importantly, still lacks an official role in the standard symphony orchestra.) Subsequent innovations, of course, have largely been of the electronic variety. Chief among them have been the electric guitar and the synthesizer, innovations that, whatever their monumental impact, are nevertheless what are known as “augmented” instruments—technical modifications of recognizable, traditional predecessors.1 Other recent arrivals, like the sampler or the drum machine, have been more radically disruptive, dispensing with inherited notions of performance entirely and transforming the act of playing into something more akin to coding. McPherson, the professor from Imperial College London, suggested that some of the most significant instruments of our era might be things we wouldn’t typically conceive of as such: the digital audio workstation—think Ableton, Pro Tools—or even the modern recording studio. All of which is to say that, with the nature of instruments having grown so abstract, and our available sonic palette having expanded so broadly as to be functionally infinite, the wholesale invention of an instrument has become an increasingly tricky business, if not a totally anachronistic-seeming one. And yet the Guthman has been going strong since 2009, when what was formerly a fusty piano competition endowed by the Georgia Tech alumnus Richard Guthman transformed into a showcase for instrument inventors, in a bid to tie the school’s music program to its international high-tech reputation. New instruments, the organizers decided, would be judged according to three criteria, by which entries are still evaluated. First, musicality: How creatively do the gestures involved in playing the instrument relate to the sound? How rich is the sound itself? Second, design: How elegant does the instrument look? And lastly, engineering: How well—and how cleverly—is the instrument constructed? A chief motivating idea behind the competition was that newly conceived instruments need a live audience if they are to have any hope of breaking through to popular consciousness. Jason Freeman, the former chair of Georgia Tech’s music school and one of the original forces behind the Guthman’s overhaul, recalled the example of Robert Moog, whose pioneering synthesizer had been used in studio settings for years before a version of his invention first appeared onstage. It wasn’t until audiences saw it being played with their own eyes that his synth took off commercially. Freeman sees many new instruments as being trapped in Moog-like stasis; the Guthman offers them a chance to break free. In the years since its revamp, the Guthman has attracted an impressive roster of judges, from the Seventies downtown doyenne Laurie Anderson to the cerebral turntablist DJ Spooky and the magnificently coiffed jazz-fusion guitar god Pat Metheny.2 The names of past winners and finalists, on the other hand, are a bit less familiar, at least to anyone lacking a comprehensive knowledge of the more obscure corners of contemporary musical arcana. A short but exemplary list: Keith Baxter, an engineer and patent lawyer who took first place in 2023 for his Zen Flute, a MIDI controller whose pitch is manipulated by the shape of the performer’s mouth and which Baxter likens to a “mouth theremin.” Úlfur Hansson, the Icelandic inventor of the 2021 winner, the Segulharpa, a wooden, disk-shaped electromagnetic harp that resembles a Viking shield and is played by means of touch sensors embedded in the wood itself. Subhraag Singh, a musician who in 2017 won with the Infinitone, a saxophonelike woodwind capable of playing microtones by use of a set of trombonelike slides. He has since debuted a set of helpful synthesizer plug-ins to mimic the instrument; its website claims that it offers a “wormhole to music light-years ahead.” Dániel Váczi and Tóbiás Terebessy, a pair of Hungarian inventors whose Glissotar—a woodwind operated by magnetized ribbon rather than keys or holes, thus allowing for uninterrupted glissando—took home first prize in 2022 and now retails for about $3,000 via Saxophones Ltd. Leon Gruenbaum, an experimental New York–based composer who was awarded third place in 2011 for the Samchillian Tip Tip Tip Cheeepeeeee, a modified ergonomic keyboard whose keys correspond to musical intervals rather than tones. In the years since, Gruenbaum has used the Samchillian in a variety of musical projects, one of which was described by the late great critic Greg Tate as “stochastically Krunk.” To be clear, I love this stuff. But even the most dedicated, socially maladjusted experimental music fanatic would be forgiven for lacking familiarity with these instruments. Neither does it seem a stretch to say that none of them have meaningfully altered the trajectory of modern music. And yet the Guthman has produced some undeniable mainstream successes, of a sort. The OP-1 synthesizer, a 2014 Guthman finalist, has been used by Thom Yorke, Diplo, and Animal Collective, while Ryan Gosling can be seen wailing mercilessly on the Seaboard Grand keyboard, a descendant of another finalist, in the film La La Land.3 Even the Samchillian Tip Tip Tip Cheeepeeeee has had a brush with modest fame, having been featured on three solo albums by the Living Colour guitarist Vernon Reid. But many of these past victorious instruments, while often exceedingly clever or even awe-inspiring from a technical standpoint, were nevertheless based firmly in established traditions of instrument engineering. The origins of the basic keyboard many of them riffed on lie with the hydraulis, or Greek water organ of the third century bc, and is thought to have assumed its modern seven-white-keys-five-black-keys form in 1361. The six-string guitar—another popular template for Guthman entrants—dates to 1779. Much of the “augmented” variety, less of the ex nihilo new. So while winning the Guthman might garner a bit of press, even the kind that could result in a big-screen, Gosling-adjacent appearance (no small deal, to be sure), the variations on keyboards or guitars that tend to dominate the Guthman don’t seem likely to herald a wholesale musical sea change any time soon. Aspiring young musicians aren’t exactly lining up to take Infinitone lessons, as far as I know, and I didn’t happen to notice any Segulharpae the last time I wandered into a Guitar Center. But this didn’t necessarily mean that I wouldn’t behold some kind of complete upending of the musical world as we know it. After all, who could have foreseen the coming of the saxhorns? On Friday, the opening day of the competition, the inventors had set up shop onstage at the Ferst Center for the Arts, in preparation for their demos and subsequent critical interrogations. It turned out that Jean-François, who had been assigned a slot in the far right corner, was something of an outlier as the only acoustic entrant. Among his electronic competitors was Thomas, a foppish, rail-thin twentysomething with a penchant for provocatively unbuttoned silk shirts, and who spoke nonchalantly about Gaussian functions, Faraday’s law of induction, and something called the hysteresis curve. His entry, the Lorentz Violin, which resembled a compound hunting bow, was effectively a reimagined Hammond organ—producing sound with a series of rotating gear-shaped “tonewheels.” It was a brilliant device, but one that had difficulty swiftly or cleanly navigating between discrete notes. “It does its best to get there on time,” Thomas said. “But sometimes it misses.” Standing nearby was Max Addae, a flattop"
