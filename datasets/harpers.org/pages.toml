["https://harpers.org/category/weekly-review"]
title = "Weekly Review Archives | Harper's Magazine"
description = "A weekly email taking aim at the relentless absurdity of the 24-hour news cycle."
full_description = "Zelensky took his leave of the White House early, without reaching a peace agreement, and White House officials tucked into a lunch of rosemary roasted chicken and crème brûlée that had been prepared for Trump’s affronted Ukrainian visitors. Read More The Trump Administration fired the only locksmith at Yosemite National Park, who holds all of the park keys, which are sometimes used to help rescue visitors locked in park bathrooms. Read More “He who saves his Country does not violate any Law,” wrote the president on social media, a sentiment expressed by the Norwegian mass murderer Anders Behring Breivik that has been attributed to the French imperial dictator Napoleon Bonaparte. Read More Lithuania reported that it is maintaining a stable supply of power after disconnecting its energy grid from Russia and Belarus, and Sri Lanka said that its entire population of 22 million people was cut off from power by a monkey who broke into a power station. Read More A man at Quantico was photographed painting over a mural bearing the words Integrity, Cooperativeness, Stability, Diversity, Respect. Read More Two Sumatran corpse flowers, Sydney’s Putricia and New York City’s Smelliot, bloomed on either side of the globe, luring in thousands of visitors as they released an odor variously described as redolent of “briny, dead fish,” “hot garbage,” and “poo.” Read More On Inauguration Day, Joe Biden announced pardons for his family members in the final twenty minutes of his presidency, and Donald Trump pardoned roughly 1,500 people involved in the January 6 riot in the first hours of his. Read More A man in Maryland was arrested outside a Catholic church after dropping an onion in the aisle on his way to the altar, pouring whisky in the holy water, and throwing tangerines at the congregant who escorted him out of the mass. Read More In Texas, a school district removed the Bible from classrooms under a new law banning sexually explicit or vulgar books. Read More"
