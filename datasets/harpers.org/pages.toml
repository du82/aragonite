["https://harpers.org/archive/2025/01/the-ghosts-in-the-machine-liz-pelly-spotify-musicians"]
title = "The Ghosts in the Machine, by Liz Pelly"
description = "Timeless stories from our 175-year archive handpicked to speak to the news of the day."
full_description = "January 2025 Issue [Report] The Ghosts in the Machine Download PDF Adjust Share Spotify’s plot against musicians by Liz Pelly, Illustrations by Yoshi Sodeoka Listen to an audio version of this article. I first heard about ghost artists in the summer of 2017. At the time, I was new to the music-streaming beat. I had been researching the influence of major labels on Spotify playlists since the previous year, and my first report had just been published. Within a few days, the owner of an independent record label in New York dropped me a line to let me know about a mysterious phenomenon that was “in the air” and of growing concern to those in the indie music scene: Spotify, the rumor had it, was filling its most popular playlists with stock music attributed to pseudonymous musicians—variously called ghost or fake artists—presumably in an effort to reduce its royalty payouts. Some even speculated that Spotify might be making the tracks itself. At a time when playlists created by the company were becoming crucial sources of revenue for independent artists and labels, this was a troubling allegation. At first, it sounded to me like a conspiracy theory. Surely, I thought, these artists were just DIY hustlers trying to game the system. But the tips kept coming. Over the next few months, I received more notes from readers, musicians, and label owners about the so-called fake-artist issue than about anything else. One digital strategist at an independent record label worried that the problem could soon grow more insidious. “So far it’s happening within a genre that mostly affects artists at labels like the one I work for, or Kranky, or Constellation,” the strategist said, referring to two long-running indie labels.* “But I doubt that it’ll be unique to our corner of the music world for long.” By July, the story had burst into public view, after a Vulture article resurfaced a year-old item from the trade press claiming that Spotify was filling some of its popular and relaxing mood playlists—such as those for “jazz,” “chill,” and “peaceful piano” music—with cheap fake-artist offerings created by the company. A Spotify spokesperson, in turn, told the music press that these reports were “categorically untrue, full stop”: the company was not creating its own fake-artist tracks. But while Spotify may not have created them, it stopped short of denying that it had added them to its playlists. The spokesperson’s rebuttal only stoked the interest of the media, and by the end of the summer, articles on the matter appeared from NPR and the Guardian, among other outlets. Journalists scrutinized the music of some of the artists they suspected to be fake and speculated about how they had become so popular on Spotify. Before the year was out, the music writer David Turner had used analytics data to illustrate how Spotify’s “Ambient Chill” playlist had largely been wiped of well-known artists like Brian Eno, Bibio, and Jon Hopkins, whose music was replaced by tracks from Epidemic Sound, a Swedish company that offers a subscription-based library of production music—the kind of stock material often used in the background of advertisements, TV programs, and assorted video content. For years, I referred to the names that would pop up on these playlists simply as “mystery viral artists.” Such artists often had millions of streams on Spotify and pride of place on the company’s own mood-themed playlists, which were compiled by a team of in-house curators. And they often had Spotify’s verified-artist badge. But they were clearly fake. Their “labels” were frequently listed as stock-music companies like Epidemic, and their profiles included generic, possibly AI-generated imagery, often with no artist biographies or links to websites. Google searches came up empty. In the years following that initial salvo of negative press, other controversies served as useful distractions for Spotify: the company’s 2019 move into podcasting and eventual $250 million deal with Joe Rogan, for example, and its 2020 introduction of Discovery Mode, a program through which musicians or labels accept a lower royalty rate in exchange for algorithmic promotion. The fake-artist saga faded into the background, another of Spotify’s unresolved scandals as the company increasingly came under fire and musicians grew more emboldened to speak out against it with each passing year. Then, in 2022, an investigation by the Swedish daily Dagens Nyheter revived the allegations. By comparing streaming data against documents retrieved from the Swedish copyright collection society STIM, the newspaper revealed that around twenty songwriters were behind the work of more than five hundred “artists,” and that thousands of their tracks were on Spotify and had been streamed millions of times. Around this time, I decided to dig into the story of Spotify’s ghost artists in earnest, and the following summer, I made a visit to the DN offices in Sweden. The paper’s technology editor, Linus Larsson, showed me the Spotify page of an artist called Ekfat. Since 2019, a handful of tracks had been released under this moniker, mostly via the stock-music company Firefly Entertainment, and appeared on official Spotify playlists like “Lo-Fi House” and “Chill Instrumental Beats.” One of the tracks had more than three million streams; at the time of this writing, the number has surpassed four million. Larsson was amused by the elaborate artist bio, which he read aloud. It described Ekfat as a classically trained Icelandic beat maker who graduated from the “Reykjavik music conservatory,” joined the “legendary Smekkleysa Lo-Fi Rockers crew” in 2017, and released music only on limited-edition cassettes until 2019. “Completely made up,” Larsson said. “This is probably the most absurd example, because they really tried to make him into the coolest music producer that you can find.” Besides the journalists at DN, no one in Sweden wanted to talk about the fake artists. In Stockholm, I visited the address listed for one of the ghost labels and knocked on the door—no luck. I met someone who knew a guy who maybe ran one of the production companies, but he didn’t want to talk. A local businessman would reveal only that he worked in the “functional music space,” and clammed up as soon as I told him about my investigation. Even with the new reporting, there was still much missing from the bigger picture: Why, exactly, were the tracks getting added to these hugely popular Spotify playlists? We knew that the ghost artists were linked to certain production companies, and that those companies were pumping out an exorbitant number of tracks, but what was their relationship to Spotify? For more than a year, I devoted myself to answering these questions. I spoke with former employees, reviewed internal Spotify records and company Slack messages, and interviewed and corresponded with numerous musicians. What I uncovered was an elaborate internal program. Spotify, I discovered, not only has partnerships with a web of production companies, which, as one former employee put it, provide Spotify with “music we benefited from financially,” but also a team of employees working to seed these tracks on playlists across the platform. In doing so, they are effectively working to grow the percentage of total streams of music that is cheaper for the platform. The program’s name: Perfect Fit Content (PFC). The PFC program raises troubling prospects for working musicians. Some face the possibility of losing out on crucial income by having their tracks passed over for playlist placement or replaced in favor of PFC; others, who record PFC music themselves, must often give up control of certain royalty rights that, if a track becomes popular, could be highly lucrative. But it also raises worrying questions for all of us who listen to music. It puts forth an image of a future in which—as streaming services push music further into the background, and normalize anonymous, low-cost playlist filler—the relationship between listener and artist might be severed completely. How had it come to this? Spotify, after all, did not start out aiming to shape users’ listening behavior. In fact, in the early days, the user’s experience on the platform centered on the search bar. Listeners needed to know what they were looking for. The company’s CEO, Daniel Ek, is said to have been averse to the idea of an overly curated service. When the platform launched in Europe, in 2008, it positioned itself as a way to access music that was “better than piracy,” like a fully stocked iTunes library but accessed over the internet, all of it available via a monthly subscription. The emphasis was on providing entry to “A World of Music,” as an early ad campaign emphasized, with the tagline “Instant, simple and free.” Users could make their own playlists or listen to those made by others. Like many other tech companies in the twenty-first century, Spotify spent its first decade claiming to disrupt an archaic industry, scaling up as quickly as possible, and attracting venture capitalists to an unproven business model. In its search for growth and profitability, Spotify reinvented itself repeatedly: as a social-networking platform in 2010, as an app marketplace in 2011, and by the end of 2012, as a hub for what it called “music for every moment,” supplying recommendations for specific moods, activities, and times of day. Spotify made its move into curation the next year, hiring a staff of editors to compile in-house playlists. In 2014, the company was increasing its investment in algorithmic personalization technology. This innovation was intended, as Spotify put it, to “level the playing field” for artists by minimizing the power of major labels, radio stations, and other old-school gatekeepers; in their place, it claimed, would be a system that simply rewarded tracks that streamed well. By the mid-2010s, the service was actively recasting itself as a neutral platform, a data-driven meritocracy that was rewriting the rules of the music business with its playlists and algorithms. From the January 2025 issue Download PDF googletag.cmd.push( function () { googletag.display( 'div-gpt-ad-1680871268361-0' ); } ); googletag.cmd.push( function () { googletag.display( 'div-gpt-ad-1680012038080-0' ); } ); From the Archive Timeless stories from our 175-year archive handpicked to speak to the news of the day. Email address Sign Up Got it! Thanks for signing up! In reality, Spotify was subject to the outsized influence of the major-label oligopoly of Sony, Universal, and Warner, which together owned a 17 percent stake in the company when it launched. The companies, which controlled roughly 70 percent of the market for recorded music, held considerable negotiating power from the start. For these major labels, the rise of Spotify would soon pay off. By the mid-2010s, streaming had cemented itself as the most important source of revenue for the majors, which were raking in cash from Spotify’s millions of paying subscribers after more than a decade of declining revenue. But while Ek’s company was paying labels and publishers a lot of money—some 70 percent of its revenue—it had yet to turn a profit itself, something shareholders would soon demand. In theory, Spotify had any number of options: raising subscription rates, cutting costs by downsizing operations, or finding ways to attract new subscribers. According to a source close to the company, Spotify’s own internal research showed that many users were not coming to the platform to listen to specific artists or albums; they just needed something to serve as a soundtrack for their days, like a study playlist or maybe a dinner soundtrack. In the lean-back listening environment that streaming had helped champion, listeners often weren’t even aware of what song or artist they were hearing. As a result, the thinking seemed to be: Why pay full-price royalties if users were only half listening? It was likely from this reasoning that the Perfect Fit Content program was created. After at least a year of piloting, PFC was presented to Spotify editors in 2017 as one of the company’s new bets to achieve profitability. According to a former employee, just a few months later, a new column appeared on the dashboard editors used to monitor internal playlists. The dashboard was where editors could view various stats: plays, likes, skip rates, saves. And now, right at the top of the page, editors could see how successfully each playlist embraced “music commissioned to fit a certain playlist/mood with improved margins,” as PFC was described internally. Editors were soon encouraged by higher-ups, with increasing persistence, to add PFC songs to certain playlists. “Initially, they would give us links to stuff, like, ‘Oh, it’s no pressure for you to add it, but if you can, that would be great,’ ” the former employee recalled. “Then it became more aggressive, like, ‘Oh, this is the style of music in your playlist, if you try it and it works, then why not?’ ” Another former playlist editor told me that employees were concerned that the company wasn’t being transparent with users about the origin of this material. Still another former editor told me that he didn’t know where the music was coming from, though he was aware that adding it to his playlists was important for the company. “Maybe I should have asked more questions,” he told me, “but I was just kind of like, ‘Okay, how do I mix this music with artists that I like and not have them stand out?’ ” Some employees felt that those responsible for pushing the PFC strategy did not understand the musical traditions that were being affected by it. These higher-ups were well versed in the business of major-label hitmaking, but not necessarily in the cultures or histories of genres like jazz, classical, ambient, and lo-fi hip-hop—music that tended to do well on playlists for relaxing, sleeping, or focusing. One of my sources told me that the attitude was “if the metrics went up, then let’s just keep replacing more and more, because if the user doesn’t notice, then it’s fine.” Trying to share concerns about the program internally was challenging. “Some of us really didn’t feel good about what was happening,” a former employee told me. “We didn’t like that it was these two guys that normally write pop songs replacing swaths of artists across the board. It’s just not fair. But it was like trying to stop a train that was already leaving.” Eventually, it became clear internally that many of the playlist editors—whom Spotify had touted in the press as music lovers with encyclopedic knowledge—were uninterested in participating in the scheme. The company started to bring on editors who seemed less bothered by the PFC model. These new editors looked after mood and activity playlists, and worked on playlists and programs that other editors didn’t want to take part in anymore. (Spotify denies that staffers were encouraged to add PFC to pl"
