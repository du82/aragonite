["https://harpers.org/about/faq"]
title = "Frequently Asked Questions | Harper's Magazine"
description = "How do I log in to the Harper’s website? We’ve upgraded the log in system at harpers.org. Everyone who subscribed before March 15, 2023, will need to reset their passwords to access the archives. You will not be asked to enter payment information at any point in this process. In addition to being easier to […]"
full_description = "Frequently Asked Questions How do I log in to the Harper’s website? We’ve upgraded the log in system at harpers.org. Everyone who subscribed before March 15, 2023, will need to reset their passwords to access the archives. You will not be asked to enter payment information at any point in this process. In addition to being easier to use and more secure, this new system will allow you to log in to our customer service page and our archives at the same time. Note: the below images are screenshots; you will not be able to log in by clicking on them. First, click the sign in button. After that, you’ll be prompted to enter your log in information for harpers.org. You’ll also have the option to log in using your Google, Apple, or Facebook account. After that, you’ll be told you need to reset your password. An email will be sent to the email address you just entered. You’ll then need to choose a new password. If you use your Google, Facebook, or Apple account, you won’t receive a password reset email; you will be immediately taken to the site. However, if that Google/Facebook/Apple account’s email isn’t associated with your Harper’s subscription, you’ll have to connect them. Click the “connect subscription” button that appears beneath your name in the pop-up. You should then be able to find your account by using one of the methods displayed in the image below. On desktop, return to harpers.org by clicking the return to site button. On mobile, click on the H logo in the left hand corner of your screen. If you experience problems, please email [email protected] and let us know exactly what error you’re encountering. Please note that we are unable to provide phone support for Harpers.org. We generally respond to email inquiries within twenty-four hours, and often sooner. I forgot my password. How do I reset it? Click the sign in link at the top of any page on harpers.org, then click the forgot password? link beneath the email and password fields, highlighted below. You an also go to our account management page and click on the chat support option. You can also contact customer service at [email protected] or 1-800-444-4653 Why am I getting a message saying my subscription is expired even though I just purchased or renewed my subscription? Where’s my Harper’s? How do I change my mailing address? Who do I contact about a billing problem? I’m a subscriber. How do I create a login to access the Harper’s archive? How do I find out or change which email address I use to log in to the site? I forgot my password. How do I reset it? How do I find my account number? Why won’t your PDFs download? I subscribe through Zinio. Why won’t the site accept my email address? Who do I contact about missing archive pages? Who do I contact about reprint rights? How do I get copies of an image or story from the old Harper’s Weekly? Why did I receive spam from you? What is your privacy policy? Cancellation Policy Why am I getting an “expired” error when I try to sign in, even though I just purchased or renewed my subscription? (back ?) This error occurs when you have an older subscription under the same address. Please email [email protected] and let us know which email address is returning the error. We should be able to fix the problem within one business day; in the meantime, let us know if there’s a particular article you need and we’ll send you the PDF. Where’s my Harper’s? (back ?) Once you’ve subscribed, you can use your account information to log in to harpers.org and instantly access the latest issue, as well as our entire archive, which stretches back to 1850. It normally takes six to eight weeks for the first print issue of a new subscription to arrive, and can take up to twelve weeks outside of the United States. If you’ve been waiting longer than that, you can report a missing issue by going to our subscription management page. After signing in, you will be automatically directed to the Account Summary page. On the right hand side of the screen, click the Actions button. In the dropdown menu, click Missed/Damaged Issue, then fill out the form. You can also contact customer service at [email protected] or 1-800-444-4653. How do I change my mailing address? (back ?) Log in to your subscriber account. After signing in, click on the Update Info link. Who do I contact about a billing problem? (back ?) Sign in to customer care and contact customer service at [email protected] or 1-800-444-4653. How do I create a login to access the Harper’s archive? (back ?) If you’ve provided us with an email address and password, you can log in by clicking the sign in link at the top left hand side of any page on harpers.org. If you haven’t yet provided us with an email address and password, you create a login by following these steps: 1. Log in to your subscriber account using your mailing address or your subscriber number (after the letters PRS on your mailing label). 2. Select Email/Password information. 3. Add an email address and password, then save your changes. 4. Sign in by clicking on the sign in link at the top left hand corner of harpers.org, then enter your username and password into the box. All passwords are case sensitive. If you experience problems, please email [email protected] and let us know exactly what error you’re encountering. How do I find out or change my email address or password? (back ?) Go to our account management page and click on the chat support option. You can also sign in by using your subscriber number (after the letters PRS on your mailing label). I forgot my password. How do I reset it? (back ?) Reset your password by signing in to your account with your email address and zip code or subscriber number (after the letters PRS on your mailing label). Click on chat support for immediate help. You can also contact customer service at [email protected] or 1-800-444-4653 How do I find out my account number? (back ?) Your account number is the ten-digit number shown after the letters PRS on your mailing label. Why won’t your PDFs download? (back ?) If you’re signed in and nothing (or an error message) is appearing in the PDF viewer beneath the title and byline of the article, please email [email protected] with the URL for the story and we’ll fix the link. If you’re clicking on the link on the right hand side of the screen and nothing is happening, chances are the problem relates to your browser’s handling of PDF files. Try right-clicking the link and selecting save as. I subscribe through Zinio. Why won’t the site accept my email address? (back ?) Zinio is a third-party vendor, separate from Harper’s Magazine. In order to access the archive, you must subscribe to the print version of Harper’s. Who do I contact about missing archive pages? (back ?) Please email [email protected]. Who do I contact about reprint rights? (back ?) Please email Virginia L. Navarro at [email protected]. How do I get copies of an image or story from the old Harper’s Weekly? (back ?) Harper’s Magazine does not have copies of Harper’s Weekly. We suggest trying harpweek.com. Why did I receive spam from you? (back ?) Harper’s Magazine subscriptions are managed by a company called CDS Fulfillment, which operates buysub.com. Any email that asks you to visit buysub.com or w1.buysub.com originates from Harper’s. If you received any other email asking for money that appears to originate from harpers.org, it used a spoofed “FROM” address. It is quite easy for any spammer to fake an originating address and, while we regret that digital mountebanks can abuse our domain name in this fashion, nothing can be done to stop them. Examining the header of the mail file will make it clear that this email at no point passed through our servers. Harper’s Magazine has a strict policy for contacting our subscribers via email and follows it carefully. What is your privacy policy? (back ?) What is your cancellation policy? (back ?) Your order is protected by our money-back guarantee. You can cancel your subscription at any time, and receive a full refund on the rest of your subscription. You may cancel any time by logging into our customer service page or by contacting our Customer Care team at [email protected] or 1-800-444-4653."
