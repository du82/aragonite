full_description = "Rain in the city, a painting by Louis Fratino, whose monograph Louis Fratino was published in May by Magic Hour Press. Fratino’s work is on view through November at the Venice Biennale, in Italy. “1365-03 Kyoto City, Kyoto Prefecture,” a photograph by Yoko Ikeda, whose book Contrepoint was published by IBASHO and the(M) éditions. Ikeda’s work was on view last month as part of the exhibition All That’s Fit, at The Fulcrum, in Los Angeles. “East MLK Blvd., Austin, Texas, 2021” and “Praying Cowboy, Gladewater, Texas, 2021,” photographs by Rahim Fortune from his book Hardtack, which was published in April by Loose Joints. Meridian, a mixed-media artwork (oil, acrylic, acrylic polymer, archival paper, ink, aluminum, Dibond, and wood) by Sarah Sze, whose work was on view last month at Victoria Miro, in Venice, Italy. “An unexpectedly excellent magazine that stands out amid a homogenized media landscape.” —the New York Times"
