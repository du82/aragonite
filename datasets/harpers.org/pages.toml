["https://harpers.org/archive/2025/02/high-and-dry-sobriety-transcendence-bonnaroo-barrett-swanson"]
title = "High and Dry, by Barrett Swanson"
description = "Timeless stories from our 175-year archive handpicked to speak to the news of the day."
full_description = "February 2025 Issue [Folio] High and Dry Download PDF Adjust Share Sobriety and transcendence at Bonnaroo by Barrett Swanson, Illustration by Micha Huigen Listen to an audio version of this article. chapter 1 good clean fun It’s dusk on the first night of Bonnaroo, and the lotus-eaters are all around us. There are candy flippers in white Moon Boots with impressively lacquered eyelashes, and a portly man with a Gandalf beard who’s magnanimously handing out shot glasses. There are hemp-studded undergraduates whose eyes are pinwheeling from whippets, and a cluster of pixie-winged teenagers who are piggishly snorting Percocet. In the bathroom, dealers do brisk business in various illicit substances, and they bark out their wares the way stadium vendors call out “Hot dogs!” or “Peanuts!” Twice I’ve been offered Molly and tabs of LSD, and a throuple I meet in the bathroom is shilling for the upcoming orgy. Over at the Sparkle City Disco show, a coven of drunken zoomers—many of whom, mind you, were born after 9/11—are all shimmying jubilantly to songs by Donna Summer, pointing stoically to the ground and then triumphantly up at the ceiling, looking rather a lot like latter-day John Travoltas. In the midst of all this bedlam, somewhere past the Sanctuary of Self Love and the Planet Roo pavilion, I and about two dozen other festivalgoers sit beneath a vinyl tent and talk about how to stay sober. At the moment, we are congregated in an oval of elderly metal folding chairs and are all sitting congruently in pensive, supplicant postures—with hunched shoulders and elbows on knees, our fingers steepled contemplatively and pressed against our lips. Even though the sartorial efforts in this tent are either Phish Fan or Rave Siren (think space buns for the women, think tie-dye for the men), our expressions nevertheless betray a mortal kind of seriousness, particularly as we train our gazes upon the speaker who recounts their addiction. “I feel so good right now I could probably cry,” one addict says. “And I don’t like crying, because that’s pretty much all I did my first whole year of sobriety.” This is Hillary, a young therapist with corn-silk hair who hails from rural Tennessee. Earlier this morning, Hillary told me that her marathon of sobbing only ever relented when a friend sketched for her a cartoon of a Mohawked angelfish, which for unclear reasons made her lose her shit, and whatever unbudging darkness that had taken residence inside her was swiftly and summarily lifted. This is why, on her leg, she’s got the friend’s doodle as a diminutive tattoo, a constant bodily reminder of the depth of her addiction. “You know, right around that point at, like, one-thirty today, when we were setting up camp,” another addict, named Brian, says, “I was coming to the end of my rope, and I just needed to sit back and take a breath and remember that I’m not supposed to be here today—because I’m actually supposed to be dead. So every day that I wake up clean and sober and doing what my higher power has in store for me is a grateful day. I joined this festival community back in 2013, and the saving grace of my life has been going to these festivals and working these sober tables. And back in 2020, when it wasn’t there because of the pandemic, I would try streaming live concerts just to get that connection. But it didn’t work, because for me it’s not just the music. It’s being with all of you. It’s giving back to something that gave me so much when I came in and when I desperately needed a fellowship. And so even though it’s rough some days—and goddamnit, it is rough some days—I’m here, and I’m still alive, and I’m living my best life.” However heart-tugging I find this soliloquy, I must confess that it’s difficult to square Brian’s earnestness with the debauchery occurring all around him. After all, in the distance I glimpse a troika of young women, who are all wearing neon-pink halters and who have teased their hair to Wynonna Juddish proportions, brandishing a handle of vodka and fieldstripping a water bong with seriously impressive adroitness. But perhaps Brian’s serenity in the face of these theatrics is owing to the fact that, earlier this morning, he and I joined the Soberoo encampment, the bone-dry haven at the Bonnaroo Music and Arts Festival, the four-day concert in Manchester, Tennessee, an event otherwise known for its anything-goes spirit and Dionysian revelry. Apart from camping together in a labyrinth of tents, Soberoovians—as the local argot has it—hold a quartet of daily twelve-step-style meetings, although they claim no official affiliation with Al-Anon, NA, or AA. Since 2002, this assortment of music lovers has vowed to remain sober for the duration of the festival, and while they cater mostly to veterans of the recovery community, the group also functions as a makeshift relief effort, an asylum for those regular Bonnaroovians whom the week of hallucinogenic indulgence will bring to a genuine rock bottom. At tonight’s meeting, after the last addict gives their “share,” we stand and clasp hands to deliver the Serenity Prayer, which is a fairly common practice for concluding a twelve-step session. The intimate physical proximity of this causes everyone to issue apologies—for clammy hands and lackluster deodorant, the unavoidable byproducts of this merciless Tennessee summer. After the meeting, a few of the Soberoovians hold a frazzled caucus for the rest of the evening’s agenda. After all, it’s only 9 pm, and the night still teems with weird neon traceries and the eerie Dopplering roar of crowds at nearby concerts. “Sean, what you doing, bro?” an addict named Dylan asks. (Though we’ve only just met, Dylan will end up being my Virgil throughout the weekend.) “I’m going to pass out. I just feel fried after setting up camp. I just feel, like, dangerously stupid,” Sean says. “I’m trying to decide between the Dirty Circus and a shower,” Dylan says. “Come on,” says one Soberoovian named Cayleigh, a sixteen-year-old who’s attending Bonnaroo with her mother. “Be real: Sexy cowboys or a hot shower?” (Later, I’m told the Dirty Circus has western themes, apparently.) “It’s gonna be a cold shower, bro,” Dylan says. “If anything, I’m gonna take a cold-ass shower.” “Okay, but I mean come on,” Cayleigh says. “Think about it … sexy cowboys. They show their butt cheeks and everything. It’s in the House of Yes.” “I’ll admit that the House of Yes does sound pretty cool,” Dylan says. “It sounds consensual, I guess,” Sean says. I’ll be the first to acknowledge that this picture of addicts and alcoholics—who are right now swaddled in loads of garish tie-dye and who have abruptly started grooving to the song “Pony” by the artist Ginuwine—runs counter to the joyless caricatures of this demographic that have become dominant at this time: the catacombic meeting spaces in dank church basements, the drooling hagiography of Mr. Bill Wilson, to say nothing of the pain and self-abnegation involved in relentlessly declaring your powerlessness. And yet these joyfully teetotaling people are the vanguard of a newly popular movement, an avant-garde of abstinent revelers who have eschewed the shroud of embarrassed anonymity and who insist it’s possible, even without intoxicants, to have the kind of cut-loose, notional fun that can be both ecstatic and life-altering. Soberoo turns out to be one of many recovery communities that have popped up at recent festivals—there’s Soberchella at Coachella and Anonymous Village at Burning Man—but it has its earliest precursor with something called the Wharf Rats, a squadron of Grateful Dead fans who started assembling at shows in the early 1980s, abstaining from various substances while jamming to the music they loved. (I don’t mean to seem cruel, but I rather innocently assumed that intoxication was pretty much a prerequisite to actually liking this music.) Kindred associations have sprouted up among other fandoms—Phish followers have the Phellowship, for instance—but good old Camp Soberoo was the first official organization, the first group of teetotalers to garner festival endorsement. And yet for all their lucid assurances of gaiety and merriment, I myself remain not so easily convinced. As someone who’s been sober for the past eleven years, I’ve largely jettisoned any hope for experiences that are Dionysian. What this looks like in practice—I am embarrassed to admit—is a life that I’ve described to friends as lamentably geriatric. When I stopped drinking at the age of twenty-six, I was somehow teleported into the regimens of my own eventual senescence, watching as friends gloried in their youthfulness and experimented with psychedelics while I’d kill weekends at the library with the dusty tomes of the Romantics. On weekends I’d fall asleep sometime before 10 pm—usually in front of Seinfeld reruns or episodes of 60 Minutes—only to wake in the morning to a bombardment of drunken texts. Invariably these would be accompanied with froggy-lidded selfies—pictures of sozzled friends—clearly taken amid the glitz of a nightclub or the murk of some faddish establishment. Gradually, my life became sumptuary and monastic, but this was more or less a survival tactic, since my own bouts of addiction had, throughout my twenties, left me with a contrail of two suicide attempts. Better for me to stick to a wholesome life program, maintaining a safe perimeter around bars and hazardous revelers. Part of the reason I have come to Tennessee, then, is to understand how former addicts and alcoholics could live their lives this way, rolling the dice with their sobriety in a Boschian festival environment. After twelve hours here, I’m worried this will be a doomed spiritual adventure, as if I were some overconfident NoFapper who heads to the Playboy Mansion, promising himself nothing more than a chaste, innocent weekend. Could I possibly make it to Sunday night while maintaining my sobriety? And what did these Soberoovians actually wish to gain here? “Well, do you think you’ll have fun this weekend?” Dylan asks me. He’s loitering outside my tent while I change into a new T-shirt (every night this week will feature Dantean levels of humidity, and by Sunday my tent will house a moraine of deeply fragrant laundry). “Jury’s still out. You guys are gonna have to show me a good time.” “Oh, you’re definitely gonna have a good time,” another Soberoovian, named Jonathan, says. On his head is a bucket hat rife with mushrooms and aliens, psychedelic motifs that on a sober person are more or less the sartorial equivalent of a priest dressed as a dominatrix. “I would venture to say,” says Lexa, who’s rummaging through her luggage in search of butterfly pasties.* “No, I would wager a million dollars that in the end you’re going to have the experience of a lifetime.” chapter 2 raising spirits Beyond my principal inducement for attending Bonnaroo—i.e., determining whether such an experience could be meaningfully endured while sober—I was also interested in the broader appeal of these festivals, namely as kilns for political utopianism and catwalks for self-expression. Overnight camps like Bonnaroo—and with it, places like Coachella, Burning Man, Electric Forest, etc.—turn out to promise more than just a safe, welcoming sanctuary for unbridled libertine carousing. Instead, what they offer is much more fundamental, a cleansing of perception, a wholesale spiritual rejuvenation. The obvious precursors here are the tent-meeting revivals of the Second Great Awakening, where scores of flagging believers tramped to God-haunted countrysides to take part in massive outdoor spectacles, ones meant not only to enlist newly ensorcelled congregants but also to perform CPR upon those scores of toilworn Christians who’d grown disenchanted after the Enlightenment. If the comparison between a music festival and a tent-meeting revival strikes you as harebrained or overextended, then consider the following statements of these various Bonnaroo artists, who themselves have noticed a similar spiritual resemblance. During a concert in 2018, Childish Gambino told the members of his audience that “this is not a concert. This is fucking church.” Or consider the press conference where Phil Lesh, the late member of the Grateful Dead, when asked about the emergence of music festivals, said this: “In the nineteenth century, they had town camp meetings. Whole towns would go to camp out, play music, and pray . . . that’s kind of what this has become. . . .” Of course, sites of “collective effervescence,” as the sociologist Émile Durkheim calls them, don’t always make good on their glittering, resuscitative offers. Since at least the 1990s, scholars of festival culture have tended to fall within two interpretative camps: those who view places like Bonnaroo as theaters for civic engagement and those who see them as nothing more than vacuous, neoliberal escape hatches, chances for overworked Americans to don pasties or banana hammocks in a limply misguided gesture of pseudorevolutionary catharsis. The 2022 festival was happening at a moment when the country’s spiritual energies (wellness, life hacking) had been concentrated increasingly in the precincts of “New Sobriety.” Bar menus in every major American city were annotated with craft mocktails spiked with adaptogens, and YouTube swamis like Andrew Huberman were proclaiming that alcohol was a poison that hampered cognitive performance. While a casual onlooker could be forgiven for rolling the Soberoovians into this lifestyle fad, it quickly became clear to me that there was a marked difference between their commitment to temperance and the whims of New Sobriety. Many of these latter trend hoppers were what’s known, in twelve-step parlance, as “California sober,” a dig at those who attempt a more “nuanced” approach to abstinence, one that does not prohibit, say, the nibbling of THC gummies or the occasional cerebral cleansing of an ayahuasca ceremony. They were responsible for corny observances like Dry January (and its chastened rebrand, Damp January), as well as a spate of books about “mindful” drinking, as though the national substance-abuse crisis could be cured with rounds of belly breathing. They were everywhere at Bonnaroo, happily slurping cans of Liquid Death, their faces dewy with the glow of self-actualization. Unlike the Soberoovians, few of these fashionably abstinent revelers would deign to identify themselves as addicts or alcoholics. Indeed, the altars at which they worshipped were not the sedulous moral inventories found in twelve-step recovery, but the mosh pits of “conscious clubbing” and the ecstasies of morning raves. Sobriety, much like the festival itself, had become a hotbed for catharsis—or a misguided crack at transcendence. The cultural historian Barbara Ehrenreich contended that the existence of mass festivals can be a tonic for grievous states of melancholia and widespread disenchantment. The “black gall” and depress"
