full_description = "To Leave a Place/Memory, a painting by Dominique Fung, whose work was on view in December at Massimo De Carlo, in London. The Wait of the World, a drawing by Michael Andrew Booker, whose work is on view this month at Art Galleries at Black Studies (AGBS) at the University of Texas at Austin. “Hounds at the tree, Lochsa River valley, 1992,” by Barbara Bosworth, from her monograph One Star and a Dark Voyage, which was published in 2021 by TIS Books. Bosworth’s work is on view this month at the Cleveland Museum of Art. Piscando Espárragos Tres and Piscando Espárragos Uno, mixed-media artworks (acrylic, charcoal, simple leaf, and matte gel on produce box) by Narsiso Martinez, whose work is on view this month at Buffalo AKG Art Museum, in New York, and was on view in February with Charlie James Gallery at Material Art Fair, in Mexico City. “An unexpectedly excellent magazine that stands out amid a homogenized media landscape.” —the New York Times"
