title = "Prayer for a Just War, by Greg Jackson"
description = "Timeless stories from our 175-year archive handpicked to speak to the news of the day."
full_description = "June 2021 Issue [Essay] Prayer for a Just War Finding meaning in the climate fight by Greg Jackson, The Bobcat Fire burns in the San Gabriel Mountains above Los Angeles, September 17, 2020. All photographs by Kevin Cooley for Harper’s Magazine © The artist/Redux [Essay] Prayer for a Just War Finding meaning in the climate fight by Greg Jackson, Adjust Share When I first drafted this essay, almost two years ago, California was on fire. A few months later, Australia ignited. Then the coronavirus hit. By the time I sat down to rewrite the essay last fall, California was on fire again, with three of the four largest wildfires in state history raging simultaneously. The sky above San Francisco turned an unearthly, apocalyptic orange. Sunlight could no longer penetrate the ash, photovoltaic panels stopped working, and the air-quality index in many places exceeded the most polluted cities in Asia, where millions of children have irreversible lung damage. People living in California, Oregon, and Washington State found themselves trapped in their homes. Houses, subdivisions, and entire towns lay in charred ruins. Those who could do so moved their families to safer areas, much as people had done in the early days of the pandemic. As far away as the East Coast, smoke from the fires marred the air, and from where I watched, north of New York City, the evening sun vanished in the haze before it touched the horizon. Like a spinning wheel that becomes a uniform blur, the relentless pace of unfolding catastrophe is turning into a fixed calendar of disaster that in many places will soon become as regular as the seasons. “Day turns to night as smoke extinguishes all light in the horrifying minutes before the red glow announces the imminence of the inferno,” wrote the Australian novelist Richard Flanagan during the 2019–20 bushfire season. In California, too, the images and stories seemed to belong less to peacetime than to war, and indeed this metaphor has become commonplace in our rhetoric about the climate threat. Al Gore, writing in the New York Times, put it starkly: This is our generation’s life-or-death challenge. It is Thermopylae, Agincourt, Trafalgar, Lexington and Concord, Dunkirk, Pearl Harbor, the Battle of the Bulge, Midway and Sept. 11. Similar martial rhetoric weaves through many of today’s decarbonization narratives, from David Wallace-Wells’s The Uninhabitable Earth to Saul Griffith’s Rewiring America, and it gives John Kerry’s climate-crisis coalition, World War Zero, its name. But for all the rhetoric of war, the shape of the metaphor remains fuzzy. If it is simply meant to justify a certain scale of government response—a warlike reallocation of industry, logistical capacity, and spending—it mistakes the true implication of the metaphor and the source of its power. For as the coronavirus has taught us, the credibility of a threat and our sense of responsibility to protect ourselves and others against it can change our behavior in ways we might have thought impossible. What distinguishes a “just” war—that is, a necessary and nonelective war, fought for survival or defense—is that it involves everyone; it is fought by the country, not only the government and not only those who bear arms in combat. It is a source of meaning in addition to anguish. From the June 2021 issue Download PDF googletag.cmd.push( function () { googletag.display( 'div-gpt-ad-1680871268361-0' ); } ); googletag.cmd.push( function () { googletag.display( 'div-gpt-ad-1680012038080-0' ); } ); From the Archive Timeless stories from our 175-year archive handpicked to speak to the news of the day. Email address Sign Up Got it! Thanks for signing up! Smoke from the August Complex Fire envelops San Francisco, September 9, 2020 To those who still harbor doubts about the justness of this war, who continue to question the scientific consensus on global warming and the ravages it promises, I ask only that you entertain, if there is a chance you are right, that there is also a chance you are wrong. Let us even say, for argument’s sake, that the virtual certainty of scientists were reduced to 50 percent confidence and the forecasted effects of climate violence were reduced in severity by 50 percent as well. That would still justify the most massive mobilization of human energy and resources the world has ever seen, because the likely outcome would still be far worse than any threat we have faced in the past. Of course, there are some who accept the seriousness of the threat but console themselves with the possibility that we might overcome it without serious disruption to our lives. The cost of solar power has fallen by more than 80 percent in the past decade and shows no sign of stopping. Wind power has followed suit. According to reports by the International Renewable Energy Agency and others, wind and solar are now the cheapest forms of energy in most cases, and there are already many places where building new wind and solar capacity is cheaper than continuing to run existing coal plants. Synergistic technologies, such as batteries and electric cars, have improved dramatically over the same period, and there has been progress on more intractable problems such as the decarbonization of air travel and the production of cement, glass, and steel. But for all the good news, we would be foolish to think technology alone will save us. The fossil-fuel industry will not disappear quietly. Subsidies will not unwind themselves. Legislation to transform our energy system will not enact itself. Politicians must be moved from complicity and intransigence. Minds must be changed. And most crucially, even if we manage in the coming decades to remake our global energy system, we will still need a new form of civic solidarity to deal with the ecological trials headed our way. That our species has the power to destroy life on earth but not to contain wildfires in California should give us pause as we consider what our ingenuity and determination can do in the face of a violent planet. We can split the atom, construct hydrogen bombs, and send humans to the moon, but that does not mean we can stop tidal waves, prevent ice sheets from melting, or cleanse toxic air. When it comes to arresting fast-moving pandemics, supplying drinking water to eight billion people, or managing refugee flows in the tens of millions, the sheer scale of these problems leaves little hope for after-the-fact technological fixes. The ocean and atmosphere are simply too vast and complex for our minds to finely conceptualize or our tools to fully contain. Our powers are great but narrow, the world far bigger than we imagine. This sounds grim and it sounds hard. Like you, I have encountered hundreds of versions of this story that cast our unhappy lot in the light of sacrifice and devastation. The crisis is real, and the stakes of inaction are indeed severe, but maybe, for all that, we have gotten the story backward. What if the challenge confronting us isn’t our greatest threat but our greatest opportunity, not a moment of self-denial and self-destruction, but of self-creation and self-discovery? What if, to be more precise, our greatest threat is also our greatest opportunity, because overcoming monumental challenges, when wisdom and heroism are possible, is the great gift of human life, the substance of our proudest moments, and the matter from which ur-meaning is built? The 2020 presidential election was only the latest milestone on the apparently endless highway of American division. Truth has taken on partisan gradations. Democratic institutions strain and buckle. Norms tremble in the fierce crosswinds of power. We cannot find a way to do even simple things most people agree on: bring down the cost of medications, regulate guns to prevent mass shootings, raise taxes on the rich, or overhaul out-of-date infrastructure. How can we be so far apart when we want so many of the same things? What has gotten so fouled up that vague symbolic fights obscure the irreducible communal basis of our prosperity and strength? Let me tell a different story about what has gone wrong. Our fundamental affliction is not the magnitude of our problems but our alienation from their manifest solutions. Our tools have never made us more powerful, yet we seem more powerless than ever to effect change. Our primary way of interacting with the world is through a screen, and our principal avenue to changing anything appears to be typing into or clicking on that screen. We are alienated from the earth, from our hands, and from one another. We appear to be part of an efficient system that has brought ever more and cheaper goods to market, but our skills have become specialized to the point of practical uselessness. Our ability to create and cultivate the goods that we rely on and enjoy has shriveled to almost nothing. There is a maddening abstraction to our reality, a virtuality to all life. We are told that we are hopelessly partisan and polarized—patriotic or traitorous, awake to truth or in thrall to lies—but above all we are separate: from one another despite our mutual dependency and from the material reality on which every aspect of our life depends. We are separate from the actions we might undertake, and undertake together, to solve the tangible problems before us, which do not care what brand name or party affiliation their solutions go by. We believe hate is endemic, that we are at one another’s throats, but we don’t know one another. We have never gotten close enough to shake hands, much less see that the throat we mean to grab has wrinkles like our own. We carry the burden of crushing loneliness, and find ourselves isolated from friend and imaginary foe alike. We are trapped in the virtual amber of our paralytic culture, where helplessness and impotence sit on the vine so long they ripen and rot into enmity, vitriol, and rage. It is a strange irony that climate change has, until recently, had a virtual quality of its own. This is the very essence of what has made it so difficult to combat. The same reason policy disagreements endure for years—that consequences don’t follow actions closely enough to establish irrefutable empirical links—is the same reason our society can recognize the danger posed by a warming planet and do nothing about it for decades. Though nearly every technology in our lives relies on truths (such as electrical or chemical properties) that we apprehend only indirectly, it is in our nature to have a complicated and problematic relationship with the reality—the truth—of our abstract knowledge. But now climate violence is emerging from the shadows. It is setting fire to forests we can see, scattering the air we breathe with ash, and filling city streets with water. It has begun marching on our offscreen terrain. The past few decades have been what the French call the drôle de guerre, the period after war is declared and before real fighting begins. Except, because what we confront with the climate crisis is war waged on a several-decade delay, the battle started long before the first shots were heard. The challenge of organizing ourselves around this crisis before its worst consequences reach us is no different from the challenge of reclaiming truth from the burning timbers of our smoldering virtual culture—of reknitting a fabric of shared purpose from shared interest. Climate change is the crisis of virtual insouciance stepping terrifyingly into the real. The more we insist on our separateness and exemption from nature, the more violently nature will educate us otherwise. Where reality gives way to fantasy, politics breaks down; and where politics breaks down, war, revolution, and violence rise up—so Carl von Clausewitz and John F. Kennedy each suggested. If we fail to see the truth of what lies after politics—not the absence of policy, but the presence, the certainty, of violence—we do not bring sufficient determination to the fight to redeem politics. The climate crisis lays this truth bare. Kevin Cooley’s son, Copernicus, with the Bobcat Fire burning in the distance, September 6, 2020 The aftermath of the Clyde Mountain Fire, near Mogo, Australia, January 20, 2020 Previous Next The blessings of war have been obscured by its horrors, no doubt rightly, but we mustn’t confuse the impulse to war for the impulse to violence. It is instead, as many have documented, the impulse to encompassing meaning: lives of purpose, actions of consequence, excitement, comradeship, and responsibility. In War Is a Force That Gives Us Meaning, the former war correspondent Chris Hedges notes that, for all its destruction and carnage, war “can give us what we long for in life.” It awakens us to the deadness of the everyday, of life without meaningful struggle and thus meaningful triumph. Even those who have experienced war’s brutality firsthand, he notes, often find themselves disillusioned afterward. Once again they were, as perhaps we all are, alone, no longer bound by that common sense of struggle, no longer given the opportunity to be noble, heroic, no longer sure what life was about or what it meant. Sebastian Junger reiterates this point in his book War, in which he chides our culture for lacking the courage to see “that one of the most traumatic things about combat is having to give it up.” Civilian life feels empty by comparison, he writes: When men say they miss combat, it’s not that they actually miss getting shot at—you’d have to be deranged—it’s that they miss being in a world where everything is important and nothing is taken for granted. They miss being in a world where human relations are entirely governed by whether you can trust the other person with your life. Junger wrote War after embedding with soldiers in Afghanistan’s Korengal Valley, one of the war’s deadliest fronts. He talks to soldiers on leave who were desperate to return to the fight. “I got to get back there,” one says. “Those are my boys.” The Army Research Branch has documented cases of wounded soldiers going AWOL to rejoin their units faster, Junger tells us. What keeps drawing “sane, good men” back to combat is not the killing, but “the other side of the equation: protecting. The defense of the tribe is an insanely compelling idea, and once you’ve been exposed to it, there’s almost nothing you’d rather do.” The flip side of this—removing people from meaningful involvement in the ongoing, communal struggle to live—may be as disaffecting as engagement is compelling. Combat brings latent desires to the surface, desires for purpose, intensity, solidarity, and belonging. These are the very needs that draw young people to tribes of violence and hate, whether neo-Nazi groups or the Islamic State. Gun culture, gang culture, and certain forms of religious fundamentalism traffic in the common intuition that violence is a person’s chief outlet for meaningful action. The persistence of mass shootings and religious massacres confirms that some people d"
