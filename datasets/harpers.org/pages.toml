full_description = '''Wendell Potter, a former health care executive, reveals the unified corporate effort against Medicare for All—and how those talking points are echoed by candidates and debate moderators Dana Frank, the author of The Long Honduran Night, discusses the parties who orchestrated the 2009 coup and the resistance that has risen to fight against them The Saudi-led coalition continues its brutal holding pattern of airstrikes, even in the face of the worst famine in one hundred years Trump wants to cut off Mexicans’ money? That’s what the Obama Administration already does to Somalis. "Looking at the detailed Russian timeline of what happened," says defense analyst Pierre Sprey, "I'd say the evidence looks pretty strong that the Turks were setting up an ambush." “We spent 36 million dollars on a building that was totally built, never used, and has been turned over to the Afghans. As far as we know, it’s empty.” The roots of the conflict in Yemen—a discussion between Washington Editor Andrew Cockburn and Sanaa-based political analyst Abdul-Ghani Al Iryani, with photographs by Alex Potter. Why John Kerry was bested by France and Israel in negotiations with Iran, and how the Obama Administration could get around the U.S. sanctions regime In the aftermath of Georgia’s presidential elections, questions emerge about Mikhail Saakashvili’s support for jihadist operations in southern Russia, and about what the United States knew “An unexpectedly excellent magazine that stands out amid a homogenized media landscape.” —the New York Times'''
