title = "The Painted Protest, by Dean Kissick"
description = "Timeless stories from our 175-year archive handpicked to speak to the news of the day."
full_description = "December 2024 Issue [Essay] The Painted Protest Download PDF Adjust Share How politics destroyed contemporary art by Dean Kissick, Illustrations by Franz Lang My mother lost both of her legs on the way to the Barbican Art Gallery. It was her day off, and she was going there to see an exhibition called Unravel: The Power and Politics of Textiles in Art. She had just arrived in London on a coach from Oxford and was run over by a bus outside Victoria Station. This was on a Friday morning in early May. The next day, in my apartment in Manhattan, I received an unexpected call—my mother never calls me—from a trauma ward in West London. “I’m in a lot of pain,” she said in a loud, anguished, slurring voice I hardly recognized, “but I’m in very good hands.” A few hours later, I was on a flight home. When I visited her in the hospital, Mom asked me whether the show was worth losing her legs for. “No,” I told her, though at that point, I hadn’t seen it. When I did, two weeks later, my answer proved correct. Unravel featured tapestries, quilts, needlework, sculptures, and installations by modern artists, the majority of whom were of historically marginalized identities. The curators proposed that textiles themselves had also been marginalized, having been gendered as feminine and regarded as “craft” rather than “fine art.” As a result, the exhibition’s introductory text argued, the more politically radical aspects of textile making had been obscured. “What does it mean to imagine a needle, a loom or a garment as a tool of resistance?” the text asked. Hanging from the ceiling above the entrance were Native American–style garments by Jeffrey Gibson, a painter and sculptor who also represented the United States in the country’s pavilion at this year’s Venice Biennale. Inspired by his Choctaw and Cherokee heritage, the pieces were adorned with rainbow-patterned patchworks printed with the phrases people like us, we play endlessly, and speak to me so that i can understand. Farther in, among other things, were a painted collage depicting a cheerful black woman in a bodega; small realist embroideries of drag and dyke marches in New York City; sculptures of cacti stitched from U.S. Border Patrol uniforms; and an image of a woman giving birth embroidered on blood-red silk, her vast womb radiating waves of energy. There were decorative knotted pieces, hand-stitched collages, abstract woven works suspended in air, and pillowy bundles of cloth. The gallery was broken up by a series of empty spaces. Shortly after it opened, Unravel began to come slowly undone as a number of pieces were withdrawn in protest of the Barbican’s decision not to host a London Review of Books lecture series that was scheduled to include “The Shoah After Gaza,” a talk by the writer Pankaj Mishra that he later published as an essay in the magazine. The disappearances began when two pieces by Loretta Pettway, an elderly quilter from Gee’s Bend, Alabama, were removed by their lenders, Lorenzo Legarda Leviste and Fahad Mayet. Another lender and four prominent artists followed suit. Some of them wrote open letters alleging that the museum was censoring pro-Palestinian speech. In the words of the Lebanese painter, embroiderer, and video artist Mounira Al Solh, “speakers who are raising their voices for justice are being canceled.” The Chilean poet and installation artist Cecilia Vicuña allowed her hanging woolen streamers to remain in the exhibition, but pinned a letter next to them declaring solidarity with her dissenting colleagues. Yee I-Lann—whose display of traditional Malaysian patterned mats with silhouettes of tables woven into them was meant to subvert the “power of the table,” apparently a symbol of Portuguese, British, and Dutch oppression—also declined to pull her artwork. Instead, she had a table (!) brought in from the Barbican’s administrative offices, on which was displayed a copy of the issue of the LRB in which Mishra’s essay was published. Pasted on the cover were two canary-yellow stickers displaying QR codes leading to an animated website with flashing boldface text by Leviste and Mayet that read: censorship at the barbican repression at the barbican racism at the barbican genocide at the barbican It was the most depressing exhibition I had ever seen at the gallery, hardly worth a visit, let alone losing one’s legs. While Unravel pretended to be politically radical—even revolutionary—it didn’t seem to stand for much beyond liberal orthodoxy and feel-good ambient diversity. It offered fantasies of resistance, but had little to offer in terms of genuine, substantive social change or artistic experimentation. The works were almost entirely produced with traditional methods and materials, in recognizable aesthetics, and might as well have dated from half a century ago, if not much earlier. Such retrospection was not limited to the Barbican. Just before my mother’s accident, I had gone to the sixtieth edition of the Venice Biennale, the longest-running regularly recurring survey of international art in the world. What I found there had been much the same: a nostalgic turn to history and a fascination with identity, rendered in familiar forms. This year’s Biennale, called Foreigners Everywhere, took four identities as its subjects—the queer artist; the outsider artist; the folk artist; the indigenous artist—and suggested that they were all foreigners because they were marginalized. It was a show of painted, handsewn, sculpted, photographed, and filmed portraits of such figures; naïve scenes of everyday life across the Global South, from Aboriginal Australia to the Brazilian and Colombian Amazon; and traditional pottery, wood carving, metal sculpture, and dyed fabric. There was a massive mural by a women’s collective from Bangalore; a contemporary dance interpretation of violence committed against Chinese migrants and queer people in the West by a millennial choreographer from Hong Kong; a text painting that read anonymous homosexual; and, on an outdoor patio, a bronze nude self-portrait of a transgender artist on a plinth that said, simply, woman. In fact, every major biennial I have visited over the past eight years—from Germany to Greece, Italy to the United States, Brazil to the United Arab Emirates—has taken as its themes the deep richness of identity and the rejection of the West. These biennials have embraced overlooked artists from the twentieth century and exhibited recycled junk, traditional craft, and folk art. Their press releases have heralded the reclamation of precolonial forms of knowledge like indigenous thought and magic. Only ten years ago, the art world was something very different: a globalized circuit of biennials and fairs that ran on the international trade of ideas and commodities. It was a space of spectacle and innovation, where artists tried out wildly different mediums and entertained radical ideas about what art could do and why. They were workshopping new cultural forms for a new millennium. Art was where experimentation happened, where people worked out what it felt like to be alive in this strange new century and how to give that feeling a form. Artists were researchers who were never expected to come to any conclusions. They had the freedom of absolute purposelessness. But as faith in the liberal order began to fall apart around 2016, this conception of art no longer seemed relevant. As concerns over identity, social issues, and inequalities intensified, there was a sense that the art world had grown frivolous and decadent, that the proliferation of forms and approaches over the decades had reached its limit. Art, which had previously been a way to produce discursive polyphony, aligned itself with the dominant social-justice discourses of the day, with works dressed up as protest and contextualized according to decolonial or queer theory, driven by a singular focus on identity. This turn was a consequence of the art world’s own exhaustion and overexpansion; here was a new direction for art, a belief system to follow that might restore some of its meaning and relevance, perhaps even a grand narrative and a purpose. The ambition to explore every facet of the present was quickly replaced by a devout commitment to questions of equity and accountability. There was a new answer to the question of what art should do: it should amplify the voices of the historically marginalized. What it shouldn’t do, it seemed, is be inventive or interesting. The philosopher and critic Arthur Danto believed that art ended in the Sixties. From the late nineteenth century onward, there had been a churning succession of modernist movements, each reacting against the last and proposing its own answers to fundamental questions about what art should be. By the end of the Sixties, however—following the convulsive leaps forward of Pop Art, with its erasure of the distinction between artworks and everyday objects, and conceptualism, with its dissolution of objects into ideas—there was nowhere left for modern art to go, Danto wrote: At first only mimesis was art, then several things were art but each tried to extinguish its competitors, and then, finally, it became apparent that there were no stylistic or philosophical constraints. There is no special way works of art have to be. . . . It is the end of the story. Like a Buddha that meditated too deeply and passed over enlightenment on the way to raving insanity, modern art had destroyed itself through excessive, nihilistic contemplation. There would still be art, Danto said, and it might even thrive, but the grand narrative of modernism was over. To Danto, the closing of this narrative of progress was what made the “contemporary” possible. As art would no longer respond to itself, and no longer had any constraints, other human activities could be drawn from the world into its hungry maw. Art was no longer moving forward. Individual artists were free to consume the present, swallow other cultural forms, and twist them into new experiences. Variety abounded: Cao Fei built a floating city in the virtual-reality world Second Life; Paola Pivi filled a Swiss Kunsthalle with three thousand cups of cappuccino and a leopard; Cai Guo-Qiang choreographed a fireworks display of a giant’s footprints running across the Beijing sky for the opening ceremony of the 2008 Summer Olympics; Wael Shawky filmed an adaptation of Amin Maalouf’s historical essay The Crusades Through Arab Eyes as a feature-length puppet cabaret epic; Philippe Parreno journeyed to Patagonia to tell two hours of rambling philosophical stories to a colony of penguins on the beach, taking only a single photograph as documentation; Carsten Höller kept a herd of reindeer in Berlin’s Hamburger Bahnhof, fed half of them fly agaric mushrooms, and built a toadstool-shaped hotel room in which overnight guests could help themselves to the deer’s potentially hallucinogenic urine. The art of the 1990s, 2000s, and early 2010s was pluralist in its intentions, forms, and subjects. Contemporary art took in such miscellaneous concerns as literature and poetry, avant-garde dance, theater, cinema, broadcast television, psychoanalysis, philosophy, history, politics, noise music, pornography, pole dancing, online abjection, ritual sacrifice, crucifixion, cannibalism, Thai cookouts, Zinedine Zidane playing a soccer match in Madrid, long-distance sailing, astronomy, industrial design, being a dog, biting people—everything. It could all be remade as art. The “contemporary” was eternally elusive, moving ever further away with artists in pursuit, an endless research project. In those days, it was possible to feel part of a vanguard and—because there was a mania in the art world and a level of self-belief that moneyed people felt obliged to encourage—receive the support and resources to attempt the grandest projects. Contemporary art was fundamentally optimistic; there was a conviction that making art was a good in itself, that pushing its boundaries was a worthwhile endeavor, and that great leaps forward in culture were still possible. Theorists, philosophers, poets, and writers were lured in from other fields. The art world was where you would find the broadest remit to do whatever you wanted. It was where you could find the most unusual and preposterous ideas—and open bars, sex, and glamour too. This was the art world that I was drawn to. Throughout my twenties, when I was studying art history and curation, interning at public and commercial galleries, and working at style magazines in London, art felt very important. It was moving fast—there was a constant flow of new artists and thinkers, and an obligation to keep up with them. Hans Ulrich Obrist, the preeminent Aughts super-curator, for whom I interned at London’s Serpentine Galleries in the summer of 2008, would always say that everything was “urgent”; it was urgent that the art crowd kept talking about art, urgent that they kept making it, and urgent that they kept seeing it. There were so many fascinating people to meet, so many ideas to explore, so many projects that needed to be realized—but so little time. Obrist used to host a series of salons, known as the Brutally Early Club, at cafés around London where writers and thinkers would gather to discuss their ideas at six-thirty in the morning. There was no time to rest. Obrist was known to his friends and colleagues as “Hurricane.” He circumnavigated the world relentlessly, meeting everyone he could and introducing them to one another, in person or over email on his two BlackBerries, insisting on the urgency of their conversation. If the role of the contemporary artist was to consume the world, Obrist believed the role of the curator was to connect it, to become the conduit through which all twenty-first-century creativity and thought might flow. In attempting this, he may well have lost parts of his mind, as one understandably will, getting too little sleep, passing through too many time zones too quickly, sending and receiving too many messages, hearing too many foolish ideas from too many crazy people. (At one point, he had small therapy magnets taped to his temples.) He almost destroyed himself, as a committed early-twenty-first-century citizen should, in an orgy of connectivity. Obrist’s frenzied devotion reflected his conviction that everything should be linked, his idealistic belief in the humanist possibilities of the internet and of globalization. He still dreamed that connectivity could bring everyone together, across borders and disciplines—that you could make friends with like-minded people around the world, bound by common interests. Art would be the gateway to every other form of culture and philosophy: a map of the present, a new universal language. In 2013, at Marco Polo Airport, waiting for the flight home to London from that year’s Biennale, my friends and I sat around on the floor discussing what the best life might be. The life of an artist, w"
