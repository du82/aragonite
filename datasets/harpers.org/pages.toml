["https://harpers.org/archive/2025/02/at-the-summit-world-economic-forum-davos-caitlin-doherty"]
title = "At the Summit, by Caitlín Doherty"
description = "Timeless stories from our 175-year archive handpicked to speak to the news of the day."
full_description = "February 2025 Issue [Letter from Switzerland] At the Summit Download PDF Adjust Share The last days of Davos by Caitlín Doherty, Collages by Mark Harris. Source images, clockwise from top left: the town of Davos © Olaf Protze/Alamy; world map, c. 1975 © Hum Images/Alamy; a ski jumper © akg-images/De Agostini/Biblioteca Ambrosiana; national flags at the Davos Congress Centre © Andreas Nägeli/Alamy; the World Economic Forum logo © World Economic Forum; a mountain peak © Makasana/iStockDavos; a meeting at the World Economic Forum © Ukraine Presidency/Ukrainian Presidential Press Office/Alamy Last January, along with all but three thousand members of the global population, I was not invited to attend the World Economic Forum. This was a disappointment, as I had hoped to cover the event for this magazine. I wanted to travel to Switzerland during those five early days of the year to see whether globalization was dying, dead, or might yet recover from the blow delivered to it by a concatenation of historical events: the rearmament of the world, the return to an age of state industrial strategies, and the reassertion of national borders in the aftermath of a pandemic that had locked each of us, for a while, in place. As the cradle of the doctrine that had governed the world economy for the past fifty years but was now, according to numerous reports, threatened by an apparently terminal “polycrisis,” the annual meeting of business and state leaders seemed to be the place to take globalization’s pulse. Locked out, I wondered whether it might be enough to spend the week of the conference in the small Alpine town with which the event had become synonymous: Davos. Davos is a Gemeinde, or township, in the Swiss canton of Graubünden, the easternmost and largest in the country, a region whose very heterogeneity mirrors that of the nation, earning it the nickname die kleine Schweiz (“little Switzerland”). Graubündners are renowned for their independence and resilience. The canton has long been at the very heart of Europe’s trade networks: its mountain passes facilitated the medieval exchange of English wool for Italian gold at the dawn of the Continent’s banking system. Its economy today is driven mostly by tourism (it is astonishingly beautiful), pastoral agriculture, and a mixture of biomedical research and chemical manufacturing. And Davos itself is a microcosm of this microcosm: a landscape of Burkean sublimity whose rarefied air brought tuberculosis patients to its slopes for decades before the development of streptomycin began to empty out the sanatoriums, which over time refashioned themselves as hotels. In the wake of this heyday, Davosians sought never to rely so heavily on a single source of income again. Davos epitomizes two vying images of Switzerland: that of the global financial hubs Zurich and Geneva, upon which international business and the world’s wealthy have long relied, and that of vertiginous dairy-farming landscapes, from which civic-minded cowherds descend from Alpine peaks to cast their votes in referenda before returning to their butter churns. Both nations exist. The vast sums of capital that flow through the former provide the financial basis for the localism of the latter, helping to preserve the image of a land unspoiled by the vampiric thirst of capitalism and the homogenizing cultural pressures of globalization. For decades, this “neutral,” unchanging national character has attracted a legion of global businesses and institutions that have headquartered themselves there. And for fifty years, alongside the ascendency of globalization, the country did experience an extraordinary period of political and economic stability. But lately even Switzerland has shown signs of increasing disturbance: the precise meaning of neutrality is up for grabs (ought it allow, for instance, the Swiss Army to participate in NATO defense exercises?); the country’s two largest banks have not so much merged as one has collapsed into the other; its decision to unpeg the franc from the euro has stymied trade; and its most recent federal election saw a nationalist far-right party grow its plurality in the National Council. It seemed increasingly likely, as the forum approached, that the fate of the disintegrating liberal order might be divinable from the town that had long been its epicenter. Were their fates entwined? There, in the local paper, printed alongside a letter from Klaus and Hilde Schwab, the WEF’s patriarch and its matriarch, praising Davos as a “place that naturally stimulates reflection, promotes dialogue, and supports the thorough, productive engagement that is essential to managing the challenges of our age,” was the headline is this the last davos wef? No one I spoke to before my trip, however, not even attendees of the previous year’s forum, could tell me whether I’d be able to visit the town during the conference without some sort of clearance. Inevitably, most reports of Davos’s character are made during the week of the forum, and thus, after a customary name-check of The Magic Mountain, employ a vocabulary situated somewhere between that of a Pentagon briefing and an ad for an all-inclusive ski vacation: “fortress” appears frequently, as do “sniper,” “checkpoint,” and “piano bar.” I read in the Times of India that nearly five thousand Swiss Army personnel were deployed to secure the area, and on the website of the Swiss Federal Office of Civil Aviation that air traffic for some fifty kilometers around the center of Davos would be restricted even to hang gliders. The night before the forum began, I met Michael, a Swiss friend, for dinner in Zurich. Now a Gymnasium teacher, he had been a teenage participant in the 2003 demonstrations against the WEF, at the height of the country’s anti-globalization movement, when the police had prevented him and fellow activists from demonstrating at the airport. I asked him how long he had been detained. Swallowing a bite of Zürcher Geschnetzeltes—veal simmered in cream sauce—he clarified: the cops hadn’t arrested him; they had just forced his group to return to the central train station. Then he’d had to wait a little while for a connection home to Bern. Security might have tightened somewhat since, I reasoned, but that such an episode constituted an act of civil disobedience within modern Swiss history was a calming thought. The next day, after receiving similar assurances on the midmorning Rhätische Bahn from a fellow passenger and kinesiologist named Cäcilia—who was dressed in a Graubünden Tracht-style duck-egg-blue frock and a small lace cap, and who was on her way, uninvited, to show off her traditional costume to WEF attendees—I alighted at Davos Platz without being shot. In the history of capitalism, 1971 was the pivotal year that Richard Nixon ended the U.S. dollar’s convertibility into gold, collapsing the postwar global monetary system and inaugurating an era of financial deregulation. In Switzerland, it was the year women won the right to vote in federal elections and the nation began to overturn constitutional provisions from the nineteenth century that had been designed to limit the incursion of “foreign” actors. And in the midst of this tumultuous moment of reform and liberalization—when financial instability was becoming a new norm that required economic “governance” at a global scale—1971 was the year Klaus Schwab hosted the first “Davos.” Schwab was born in Ravensburg, Germany, in 1938, to a German father and a Swiss mother. During the war, his father managed a factory that drew upon the forced labor of Nazi prisoners to produce military equipment. An engineer-cum-economist who studied in Switzerland, Schwab decamped, at age twenty-eight, for a sojourn at the Harvard Kennedy School of Government, where he found a mentor in Henry Kissinger. Upon his return, he oversaw a merger of Escher Wyss (the Swiss industrial company where his father had worked and that had supplied flamethrowers to the Third Reich) and the Sulzer Group (a diesel-engine manufacturer that had been blacklisted by the Allies during World War II for refusing to limit exports to the Axis powers). He thus turned to the obvious next project for a man of his professional expertise: writing an ethics manual for European businessmen. The first European Management Symposium, as the gathering was then called, was set up to promulgate his book’s philosophy of “stakeholder” capitalism. It was a moderate success, enough to be repeated the following year, as the world teetered from the “Nixon shock,” and then the next, when a band of Arab countries, retaliating against the United States’ decision to resupply the Israel Defense Forces, established an oil embargo on a slate of Western nations that spiked the price of American barrels by some 300 percent. It was in this year, 1973, that participants signed “The Davos Manifesto,” a clarion call for a new world order. The manifesto held that businesses not only were responsible for turning a profit, but also ought to, in the manner of governments, “assume the role of a trustee of the material universe for future generations.” It was therefore in the interest of society to ensure optimal conditions for the free market to flourish. By this point, the modern world—whose population had heretofore lived in distinct nations with their own economies, cultures, and customs—was merging into an increasingly integrated system, though one in which profit was still liable to be undermined by geopolitical scuffles. Schwab’s event was where wealthy businessmen were beginning to assemble to make sense of this development. “To cope with structural changes, genuine top executives must act as politicians,” he wrote in 1975. “That is to say as foreign affairs and not as domestic affairs politicians.” In the ensuing years, Schwab’s symposium enticed representatives from more and more countries and larger and larger companies. As Western markets spatialized in search of cheaper manufacturing conditions, Davos expanded to include delegates from new continents, too: Schwab invited Deng Xiaoping to the 1979 meeting, though the Chinese Communist Party’s vice chairman had the good sense to turn him down. (A growing Chinese presence has since become a staple of the event.) Driven by an inflated sense of his own prophetic powers, Schwab became increasingly interested in diplomacy as things took off at what eventually became the World Economic Forum. Early on, he endeavored to ease embargo-related tensions between the Arab world and the West by inviting several hundred business leaders from each side to Montreux for a few days. In 1988, he persuaded the Greek and Turkish governments that war was perhaps not in their immediate interest when there were trade deals to be struck. Over the next decade, he welcomed Helmut Kohl, Nelson Mandela, and Hillary Clinton to the Davos stage, while also making the occasional stab at bringing peace to the Middle East. The concepts of what would become cornerstones of the economic world order—the World Trade Organization and NAFTA—were said to have been developed at WEF-affiliated events. By 1998, when Lewis H. Lapham filed two reports on the WEF for this magazine, globalization and its political sister, Third Way politics, were at their acme. The new economically integrated system had wobbled but withstood its first major shock, the Asian financial crisis; the euro zone was a fait accompli, hovering on the calendrical horizon; and the electoral triumphs of figures such as Bill Clinton and Tony Blair meant that, in most major Western states, even governments no longer claimed to be in the business of government; instead, they were partners in “governance” with business. The global economy had been freed from the netting of politics—an antiquated pastime riddled with laws, parties, and voters—thereby enabling goods and capital to move freely toward new frontiers of profit opportunity for the betterment of all. Source images, clockwise from top left: Klaus Schwab © Markus Schreiber/AP Photo; map of Asia and Europe, c. 1975 © Hum Images/Alamy; a gold bar © fStop Images GmbH/Alamy; Henry Kissinger © Ian Dagnall Computing/Alamy; a gold coin © imageBROKER/GmbH & Co. KG/Alamy/Michael Weber By the turn of the millennium, optimism about this project had dimmed. Multinational corporations were reaping ever-greater windfalls, but there was little sign of the promised solutions to the lingering problems of hunger, poverty, environmental degradation, and the like. An assemblage of conspiracy-worthy material had begun to amass around the WEF. Keynote speeches by Kissinger, Bill Gates, and George Soros; Michael Jackson’s talking about “children’s rights” in an address at a spin-off event in Namibia; and the presence of such famous mediocrities as Bono and Lionel Richie and literary brownnosers like Paulo Coelho and, later, Ben Okri all gave the impression that a cabal of wealthy elites was gathering in the Swiss Alps to run the world according to their own design. An image of “Davos Man”—a term popularized by Samuel P. Huntington in 2004 that referred to members of a transnational upper class who sought to disentangle themselves from the nuisance of national borders, a class for whom being a citizen of the world meant the freedom to move wealth from one offshore account to another with ease, people who talked big but said little—was curdling; Davos Man had become a victim of his own success, too visible in the background of state and corporate handshake photos to hide from public criticism. A quarter of a century after Lapham’s visit, we no longer live in Schwab’s world. The rebounding consequences of U.S. foreign policy in the Middle East, the burst of the asset-price bubble, the re-eruption of continental European warfare, and the emergence of China as an economic threat to American hegemony (to name but a few developments) have (to use a term beloved of WEF attendees) “fractured” the world. Every year since roughly 2008, but with increased enthusiasm since the pandemic and the WEF’s misguided pivot to distributing degrowth lifestyle insights to the plebs (own nothing, eat bugs, etc.), the consensus from Davos seems to be that the party is over. And yet, as the editor of The Economist pointed out on a WEF podcast in 2020, the safest thing to assume about the Davos consensus is that it is wrong. Davos is an archetypal Swiss mountain town. With its smattering of church spires rising above a low skyline of blocky, pastel-colored condominiums and its pyramidal structure of councils (large, small, and school), for fifty-one weeks of the year it seems the very model of a self-contained Alpine community. But on the first day of the forum, as I made my way toward the Congress Centre (the cuboid wooden structure, opened in 1969, where the official meetings take place), signs of the command of global capital—however subtle—accumulated quickly. Droves of delegates arriving "
