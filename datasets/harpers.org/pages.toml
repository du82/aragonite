title = "A Good Company, by Justin Nobel"
description = "Timeless stories from our 175-year archive handpicked to speak to the news of the day."
full_description = "February 2025 Issue [Letter from Texas] A Good Company Download PDF Adjust Share Searching for my publisher’s radioactive oil waste by Justin Nobel, Illustrations by Giovanni Alberti. Source images courtesy the author Out in the country north of New York City, Karret and I cut a pathway through reeds and wildflowers, and one day drove to the end of it in an old Fleetwood Bounder, parked under a black oak tree, and moved in. This was in the summer of 2020. There was a major river nearby, mountains across the way, and a small town with a few stores. We had no electricity or running water, but the RV had a minibar, a coffee maker, and a DVD player; we set up an outdoor shower and hooked up solar panels. Karret worked at her atelier in a nearby town, and I worked on a book I had been writing for years about radioactive oil and gas waste. While my job as a journalist drew me toward the problems of industrialized society, here we tracked the sun and saw stars fall from the sky, and I biked the country roads at night under Cassiopeia, the spotlight moon, and even in pitch black, realizing that freedom meant having the privilege to take a risk and glide, through the dark, nearly blind. Then, one early August day in 2023, the material world intruded in the form of an email from my publisher. It read: Dear Simon & Schuster Author, I am delighted to announce that Paramount Global has agreed to a sale of Simon & Schuster to KKR, one of the world’s largest and most respected investment firms. Over the three years since the sale process initially began, we have had the privilege of meeting with numerous interested buyers. In the spring of 2023, we began a series of fascinating and stimulating conversations with members of KKR’s Media and Entertainment industry team about every aspect of our business, reflective of their keen interest in acquiring our company. All of us from Simon & Schuster who participated came away from those conversations impressed by KKR’s acumen, as well as their team’s desire to help our business grow and thrive in the future. I knew nothing about KKR, but I soon learned that it was a private-equity company headquartered in New York. It had significant assets in oil and gas, receiving a D rating on a climate-risk scorecard put out in 2022 by a financial-reform group, as well as investments in a pipeline going through land of the Wet’suwet’en, in British Columbia. The firm had connections to a nonprofit that had pushed Republican state treasurers to quash investments in renewables and promote oil and gas interests. And it had formed, in 2021, its own oil and gas exploration and production company called Crescent Energy, with assets in the Rocky Mountains and South Texas. Shortly after learning of the deal, I spoke with Lynn, a friend of mine who worked at a farm market. She told me how it was with organic food companies: Naked Juice, purchased in 2006 by PepsiCo; Annie’s, now part of General Mills; Kashi, owned by Kellogg; Honest Tea and Odwalla, both swallowed by Coca-Cola. I also mentioned the purchase to a friend of my sister’s, who used to work for WebMD. She told me that KKR bought it, things got worse, and then she left. That my book had ended up in the lap of the very thing I was investigating was stunning to me, but few others seemed surprised. I waited for Simon & Schuster’s high-profile authors to raise a word of complaint, but as far as I could see, none did. I monitored Stephen King’s social-media accounts, thinking that he, who had stood up to defend writers a few years earlier when Penguin Random House had attempted to purchase Simon & Schuster, might say something: crickets. In the absence of any prominent outrage, I wondered what responsibility fell to me. My book, Petroleum-238: Big Oil’s Dangerous Secret and the Grassroots Fight to Stop It, due to be published by Simon & Schuster the following spring, was the product of a seven-year investigation into the radioactivity brought to the surface by oil and gas development, and the various threats it posed to the industry’s workers, the public, and the environment. KKR’s purchase of Simon & Schuster meant that the book would be owned by a publishing house that was owned by a private-equity company that owned an oil and gas company. A few days after receiving the email, I spoke to my editor over the phone and told him I intended to pull the book. The decision came with that uncomfortable hollow feeling you get when you know you are making an irreversible choice. I would have to return to Simon & Schuster the $30,000 of the advance I had received. It also likely meant that fewer people would read the book, which threatened the impact I wanted it to have in the first place. I suppose I wanted proof, beyond climate-risk scorecards, that I had been right to sever ties with the company. I wanted to see the thing that I had reacted to up close. It just so happened that one of my sources, Sister Elizabeth Riebschlaeger, an eighty-eight-year-old nun, lived in Texas, near some of KKR’s Crescent Energy wells. I gave her a call. To be a writer is to want the world to care, and the first task is getting someone to print your words. What I didn’t realize when I started—when I chose to get degrees in earth and environmental science and journalism; when I wrote for small newspapers, then online literary journals, then bigger ones with printed pages—is that if you actually succeed, you can lose track of yourself. Soon enough, the writing becomes the life. “I’ve long been a great admirer of your work and would be absolutely thrilled to work with you on something,” read the message I received from Sean, who was an editor at a national magazine. This, I was learning, is how freelance journalism works. You anxiously send your stories out into the void, and editors find them, read them, and ask you to write bigger things for larger publications, ones that pay better but often have just a little less soul. You would be a fool to not take the opportunity, because in the end the words are what matter, and you want people to see them—and you need money. So, I wrote for Sean. A story about a Utah truck driver who hauled potatoes and built a telescope the size of his truck through which he could see the rings of planets, and another one about a rich Russian adventurer who crashed a helicopter into Arctic sea ice. There were freaky geniuses stuck on the outer edges of the earth, while the egotists ran the core. The former, I realized, were my people. But I couldn’t disregard the battle between earth and ego, and so I became interested in fracking. I had spent years covering rising seas, melting ice, and offshore spills, but the controversial drilling technique was new to me. To better understand it, I took a tour in 2018 through the Marcellus and the Utica, black-shale formations that underlie northern Appalachia and represent one of America’s booming natural-gas production zones. I met sick workers who had been doused with fracking waste, and a person who had lived for months in the treetops to block a natural-gas pipeline’s passage through a pristine forest. I learned about injection wells, where wastewater that gushes to the surface is shot back into the deep earth. I started working on my book when Tish O’Dell, an Ohio community organizer, told me that a company in the Cleveland area had made a liquid deicer out of radioactive oil and gas waste, though it was supposedly “Safe for Environment and Pets” and was being sold at Lowe’s for use on home driveways and patios. The U.S. oil and gas industry generates a trillion gallons of oil-field brine per year—put into barrels and laid end to end, it would reach to the moon and back nearly twenty-nine times. Brine can contain elevated levels of heavy metals like lead and arsenic, and often so much radium that, under certain Environmental Protection Agency guidelines, it would be classified as radioactive waste. A brine hauler I met named Richard had sneaked samples out of his truck and stashed them in his backyard shed. “Ten or fifteen years down the road, if I get sick,” he told me, “I want to be able to prove this.” Oil and gas waste can accumulate as a wildly radioactive sludge at the bottom of brine tanks and trucks, which can be mixed with coal ash or ground-up corn cobs in a dastardly attempt to cloak its toxicity. It can take the form of drilling waste, which in Oklahoma has been spread across farmland under the misguided belief that it’s good for crops and cows. Much of this waste arrives at facilities where workers attempt to treat and clean it, but often end up concentrating the radioactivity and becoming contaminated themselves. Jesse Lombardi, a former bank robber from Ohio who became a fracking-waste manager and later a whistleblower, joined me and a former Department of Energy scientist on a mission to scout out these treatment facilities. In West Virginia, we found a site more radioactive than 99 percent of the Chernobyl Exclusion Zone; we saw a mattress floating in a moat of radioactive water surrounded by discarded beer cans and condoms. “Man,” Jesse said. “We polluted the living fuck out of this place.” In 2019, some years after Sean had become an editor at Simon & Schuster, my agent sold him Petroleum-238. There were nights when I spun out on my bicycle into the dark, believing I had unearthed information that could bring the oil and gas industry to its knees and save the world from climate chaos. In these moments, I convinced myself I could go several months without sleeping to finish the book. Of course, I still had years of work ahead of me. But when I received that email from Simon & Schuster, I had to consider not just myself, but all the people whose stories I had brought home in my notebooks. The book had taken over, become its own planet, and I orbited around it like an obedient moon. Last February, I boarded a plane in New York City and four and a half hours later descended over a terrain of thorn scrub to touch down on the tarmac in San Antonio, a gateway to the Eagle Ford Shale, an oil- and gas-bearing geologic formation that slinks like a snake northeast from the Mexican border. This is the terrain that Sister Elizabeth knows best. She first helped me traverse it on a reporting trip in 2019; KKR’s Crescent Energy had acreage in places I hadn’t yet seen, in a remote western part of the formation, near the border. Sister Elizabeth and I had decided not just to locate the wells, but, as best as we could, to determine where the waste was ending up. This would be the proof I was looking for that Crescent Energy—meaning KKR, meaning Simon & Schuster—was marred by an ungodly liability. Proof that I hadn’t given up everything for nothing. “Driving White Nissan Rogue,” Sister Elizabeth texted me as I stepped out of the airport. She pulled up wearing a pair of black wraparound sunglasses and a headset fit for an air-traffic controller, which she used to take hands-free calls from her activist contacts flung far and wide across the great, petroleum-contaminated state of Texas. A small jeweled cross hung over her heart. Sister Elizabeth was born on the ninth day of the ninth month at nine minutes past nine in the morning in 1936. At eighteen, inspired by a Passionist priest she heard speak at a mission in Cuero, Texas, she was accepted as a candidate into the order of the Sisters of Charity of the Incarnate Word, who arrived in Galveston in 1866 from Lyon, France, to tend to those sick with cholera and yellow fever. Sister Elizabeth believes that we have a spiritual connection to the earth and a moral obligation to protect it. After the reforms of the Second Vatican Council enabled nuns like her to drop the habit, live in apartments rather than convents, and focus on social-justice issues beyond caring for the sick, poor, and elderly, Sister Elizabeth began to “understand the abuse of capitalism and the loss of spiritual values that had affected the economic systems of the West like a cancer,” as she once put it to me. When fracking came to South Texas, she recognized it as a point where the capitalist motor of America ran up against her commitment to the earth. She decided to observe the industry, learn about it, “and reflect on the environmental science and technology of fracking in the light of the gospel.” Sister Elizabeth has taken Russian petroleum engineers, a member of the German Green Party, college students, and journalists like myself on tours of the Eagle Ford, bringing her visitors to the sites of spills and explosions, and introducing them to affected residents. She also works to help those residents understand, and perhaps try to curtail, the toxic infrastructure of fracking. This is how she came to help the Eagle Ford community of Nordheim, population 350, fight a landfill for oil and gas waste. The development belonged to a company called Petro Waste, founded in 2014 by a young man in commercial real estate from Midland, Texas, named George Wommack. “I think the best advice I’d give to anyone young who’s looking to be successful in the industry,” Wommack once said, “is don’t worry about failure, because if you fall, you’re probably going to fall forward.” This sort of cowboy entrepreneurialism serves a critical role in dealing with—or at least attempting to deal with—oil and gas waste, as it has since the first successful commercial oil well was drilled in Titusville, Pennsylvania, in 1859. Although brine, sludge, and drilling waste have been copiously spilled and spread across the country since the nineteenth century, and although scientists have documented extensive amounts of contamination, a 1980 federal exemption legally defines oil and gas waste as nonhazardous. Figuring out what to do with it is now a multibillion-dollar industry. When I accompanied Sister Elizabeth to Nordheim in 2019, I met the Baumanns, a ranching family whose driveway ran along the southeast edge of the Petro Waste landfill. We spent time in their front yard peering through a chain-link fence, watching truck after truck dump piles of black waste, a material that could be confused for mulch you might purchase in a garden-supply store. We watched excavators move it around, and dust devils move it around again. In 2013, researchers in Texas found that living near drilling waste increases the risk of radiological exposure, whether from drinking toxic groundwater or eating contaminated vegetables and dairy products. Sister Elizabeth had spent years fighting with the community against the permits issued by Texas regulatory agencies, to no avail. To her, Wommack was not just a businessman. “He’s an exploiter of people, of land, of ranchers, of the environment,” I recall her saying as we relaxed with the Baumanns one day in the shade of a tree. That year, Wommack indeed fell forward when he sold Petro Waste to a subsidiary of Waste Management, a giant in the industry. The Bill and Melinda Gates Foundation Trust has ov"
