description = "Editorial Internships The internship will be conducted in person. All interns must be fully vaccinated in accordance with CDC guidelines before their first day of work. Harper’s Magazine is accepting applications from college students and graduates for its editorial internship program. Interns work on a full-time basis for three to five months. The position is […]"
full_description = "Internships Editorial Internships The internship will be conducted in person. All interns must be fully vaccinated in accordance with CDC guidelines before their first day of work. Harper’s Magazine is accepting applications from college students and graduates for its editorial internship program. Interns work on a full-time basis for three to five months. The position is unpaid, although Harper’s is able to provide unlimited MetroCards for transportation. Interns receive practical experience in critical reading and analysis, research, fact checking, and the general workings of a national magazine. Each intern works closely with an editor on one section of the magazine, takes part in the creation of the Harper’s Index, and is encouraged to read widely, generate ideas and approach problems creatively. Those interested in the program are invited to download the application [.docx] [.pdf]. The application schedule is as follows: Spring Summer Fall Term: Jan-May late May-mid Aug late Aug-Dec Application Deadline: Nov 22 Apr 8 Jul 1 Decision by: Dec 1 May 1 Aug 1 Art Internships Harper’s Magazine is accepting applications from college students and graduates for its art internship program. Art interns work on a part-time, unpaid basis for three to five months and receive practical experience in electronic page layout, color separation, art and photo research, working with freelancers, and the general workings of the art department of a national magazine. Interns are encouraged to generate ideas, view current exhibits at museums and galleries, read widely, and approach problems creatively. Those interested in the program are invited to download the application [.docx] [.pdf]. The application schedule is as follows: Spring Summer Fall Term: late Jan-May mid-June-Aug mid-Sept-Dec Application Deadline: Dec 15 May 15 July 15 Decision by: Jan 5 June 1 Aug 1"
