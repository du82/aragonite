["https://harpers.org/archive/2023/12/the-hofmann-wobble-wikipedia-and-the-problem-of-historical-memory"]
title = "The Hofmann Wobble, by Ben Lerner"
description = "A weekly email taking aim at the relentless absurdity of the 24-hour news cycle."
full_description = "December 2023 Issue [Experiment] The Hofmann Wobble Wikipedia and the problem of historical memory by Ben Lerner, Illustrations by Dima Kashtalyan [Experiment] The Hofmann Wobble Wikipedia and the problem of historical memory by Ben Lerner, Adjust Share At twenty-six, in 2006, the year before the iPhone launched, I found myself driving a red Subaru Outback—the color was technically “claret metallic,” the friend who’d lent me the car had told me, in case I ever wanted to touch up the paint—on Highway 12 in Utah. I was heading to the East Bay after a painful breakup in New York. I remember, wrongly, that I was listening to a book on tape, a work by a prominent linguist, as I moved through the alien landscape, jagged formations of red rock towering against a cloudless sky. Consider the metaphorical association of argument and war, the linguist says in my memory, the way we speak of “attacking” or “defending” our “position.” If we frame an argument metaphorically as armed conflict then we will think of our interlocutor as an enemy. But what would happen, the voice asked me as I gripped the wheel with both hands, tense from fifteen hours of continuous driving, having pulled over only for gas and Red Bull and granola bars and Camels since departing Omaha, where I’d napped and showered at the childhood home of a college friend—what would happen if we shifted the metaphorical frame and thought of argument as a kind of dance, as a series of steps undertaken with the goal of mutual expression, satisfaction, even pleasure? The wheel began to shake in my hands; the road had grown slick, as though with oil. I thought something was wrong with the car and I slowed down, then pulled over. There was no traffic; my solitude was total. I got out to look at the tires. It took me a few seconds to comprehend what I was seeing, what I was standing on. There were these very large, very black crickets everywhere, a dark sensate carpet covering the road, extending hundreds of yards into the distance on either side of me. I must already have crushed thousands of them. They were perfectly indifferent to my presence; without adjusting their pace, they moved over my shoes. If I’d had a smartphone, I would have protected myself by taking a video, establishing a frame. A slow black wave spilling over the highway and across the arid soil. My car was still on, the audiobook still playing: Here are three tools for identifying implicit metaphor. The mass of migrating insects, the sound of the voice in the empty car talking of inducers and concurrents over the engine noise—in my mind, this is where this story began. There was simply no contact between the language filling the car and the world to which it supposedly referred. It was as though I heard the recorded voice the way the crickets might, not through my ears, but through tympanal organs on my leg that vibrate in response to vibrating air. Or maybe I heard the voice in the car as mere stridulation, and the prominent linguist was the insect. Needless to say, all of these words are wrong. But as I stood there—dusk was falling, or dusk was rising from the ground, from the innumerable exoskeletons—the terms of my own life reached a point of total unintelligibility. It began with the crickets, although Wikipedia says that what I saw were not “true crickets,” but a kind of shield-backed katydid. The linguist had founded a think tank to bring his ideas about framing into progressive politics. You can’t argue effectively against something called “tax relief” from a left perspective because the metaphorical frame makes taxation an affliction. If a progressive assents to that frame—and so finds herself having to argue for “less relief,” more affliction—she has already lost. We have to generate new frames: taxation is patriotic investment. Let’s say that I, having looked for any excuse to flee Brooklyn, had moved to the East Bay for a “new-media fellowship” at the linguist’s institute. I rented the first apartment I looked at, a studio I couldn’t afford in the rear of a yellow Arts and Crafts building on Derby Street, half a mile from the Berkeley campus. My windows opened onto a back garden with lemon and magnolia trees. I went to the Ikea in Emeryville and then, praying nobody would steal my boxes, had a ten-minute consultation in downtown Oakland with a doctor my sister had recommended, so I could get my medical marijuana prescription. Back “home” in my apartment, I unloaded and assembled a coffee table, two chairs, and a queen-size bed. See the little hex key. I’m alarmed to recall I got my mattress for free off Craigslist from a floridly insane woman who was wearing a bathrobe over her sweatshirt and jeans. I did not get bedbugs, but that first night in my apartment I seemed to dream the woman’s dreams. A man was chasing me (but I wasn’t me) down Telegraph with a knife, yelling that the knife was mine, that he just wanted to return it to me. On my first day at the institute, a smiling man in his sixties named Anderson (I would never learn if this was his first or last name) who wore an i heart aruba baseball cap and thrice mentioned his PhD in cog sci introduced me to the “team” (the linguist wasn’t there; nobody from the board was there) and then showed me to my desk, which was basically a library carrel. That they placed their New Media Fellow in a ponderous wooden structure (not even a cubicle) that could have been from the nineteenth century allowed me to relax about how badly I’d exaggerated my “tech savvy” in my application. The office was otherwise nondescript. Beige carpet. We can decorate it with a framed Cézanne poster from an old show at SFMOMA, or a framed Hitchcock poster from an old show at the BAMPFA. Anderson waited with me while I booted up the Mac I’d been provided and he asked if I had any questions. I wasn’t sure if he was asking if I had questions about the computer or the nature of my position, so I said, No, not at the moment, assuming that someone was planning a proper orientation. But nobody came to orient me in this fiction, for this is a fiction about disorientation. When I stood to stretch my legs I saw (through the window that my carrel blocked) iridescent hummingbirds drinking at hanging purple flowers. Their wings make up to seventy edits to the air per second. Nobody came the next day or the next—save for Anderson, who asked how it was going, if I knew where the coffee was, if I understood the community rules for the refrigerator, if I wanted restaurant recommendations. To appear busy, I spent those first days reading everything on the institute’s website, every white paper and set of “thinking points,” every archived “email blast”—these are what I assumed the “team” was working on—and tried not to contact my love back East. I’d moved across the country to read a website. The first weeks passed like that—thinking points, hummingbirds, avocado rolls from Manpuku I’d eat on a bench in Willard Park, where a homeless man often asked me, smiling menacingly, “Who do you think you are, Pancho Villa?” Then let’s have the linguist return from Chicago, where he’d been lecturing, and we hold our first all-group meeting. How was I settling in? No, the linguist was a woman, and her black hair, streaked with gray, always gathered in a tight bun, seemed involved in her small body’s perfect posture, a kind of counterweight to her prodigious brain. She couldn’t have been five feet tall. She had glasses, transparent plastic frames long before they were fashionable, but never seemed to wear them; instead she was always using them to gesture, one temple extended to serve as a little pointer or baton, marking the musical emphases of her speech. It was hard to tell how well she could see without the glasses, if her squinting indicated she was thinking or straining to make out your features, and somehow this made her hard to see, as if those were my glasses she was holding, as if she were inventing me. I did an okay job talking about getting up to speed on the institute’s research (I’m particularly taken with the recent work around “tax relief”), its online presence, the lay of the land. I used some vocabulary from her books, but in a fashion that suggested I’d so thoroughly internalized her work that I was not aware of the homage I was paying it. I was performing like a person, but the periphery of my vision contracted just a little as I spoke, the crickets closing in. We are very hopeful that with your experience, Dr. Hofmann said, you can help us to figure out how best to leverage new technologies to get our message out. I did a lot of nodding. I wondered what she thought of as my relevant experience. Did “new technologies” mean anything more specific than the internet? “Settling in,” “up to speed,” “lay of the land,” dead metaphors; I vibrated in response to vibrating air. Perhaps at our group meeting the following month I would walk us through my plan. I need another character so let’s say my cousin introduced me over email to a woman named Tam who taught social studies at Berkeley High. Even as I walked to the coffee shop I wasn’t sure I’d go in. I actually liked the musical staff tattoo she had on her left bicep, how there weren’t any notes. She had her niece’s EKG around the other. We took a walk in the rose garden and got high and when she asked about my work I cracked her up by telling her the truth: I have no idea what I’m supposed to be doing. The Ikea bed frame I’d assembled with a hex key barely held. I had not been with anyone but the woman in Brooklyn in several years. And for the past year or so it was always shadowed with the impasse over kids. I saw my room through the eight eyes of the yellow garden spider whose large circular web was just outside my window when I came. I can tell you’ve been carrying a lot of pain, Tam said. I picture her as in a long-term open relationship with a woman who was in Bolivia doing fieldwork for her PhD. We were in bed one night in the third month of my fellowship, passing the vape balloon back and forth, real cats or raccoons setting off the fictional backyard motion lights at intervals, lighting up the foliage, the star-shaped flowers. She told me she’d had a funny experience in her summer-school class. A kid had clearly plagiarized his paper on Malcolm X. She googled the suspiciously coherent if not particularly well-written paragraphs and there they were, word for word, on Wikipedia, which was at that point relatively new. (New enough that I remembered that a lawyer friend had been absolutely scandalized to discover that a colleague had had it open on his desktop; he thought it was worse than porn, that the colleague should be fired.) Tam confronted the student in class about the plagiarism a day or two later and he denied it. So she walked him to the computer center and summoned the page to show him the passages. But they were gone. The kid’s smile, Tam said, made clear that he’d deleted or radically altered the text in question. Tam didn’t have any idea how to look at the edit history of the page so she just let it go. We laughed at his mixture of ingenuity, bravado, stupidity (wasn’t this more work than just writing a couple of boilerplate paragraphs?), and the strange mutability of sources now, with the dawn of open source. We went to sleep. An hour later I sat up, wide awake. I went to the coffee table and opened my laptop and googled Malcolm X. Of course the first hit was Wikipedia; it had become the first hit for everything. Contained in Tam’s story were several things I’d only half-known at the time: People, especially young people, had begun to go first to Wikipedia for any and all information. Wikipedia was apparently so easy to edit that a failing student in summer school could do it. And even pages on major historical figures were alterable, up for grabs, not just the entries on obscure athletes or operas. I spent an hour creating and editing a page for Elaine Hofmann, then made a page for her institute, adding links to Hofmann and the institute to a variety of other Wikipedia pages—I had no particular computer aptitude but the edits were easy enough to make. Then I turned my attention to “tax relief.” First and foremost I made it so that “tax relief” redirected you to a larger page called “tax loopholes.” I organized all the material in a way that emphasized—with various levels of subtlety—evasion, structural inequality, the patriotic importance of investing in the future. I added a slew of progressive sources from other websites. By dawn I was familiar with almost every aspect of the editorial interface and had some sense of how the talk pages—the pages behind the pages, where editors debate changes that they’ve made—functioned. When Tam, wearing one of my shirts, brought me coffee, I asked her to do me a big favor: I need her to assign the students an extra credit paper where they researched “tax relief” (her class had a unit on “government”). I explained why, probably making little sense. But she said she would and I asked her to show me anything that quoted Wikipedia or might be plagiarized from it. At the institute’s all-group meeting a week later I presented a PowerPoint. A couple of slides about Wikipedia becoming the world’s “largest clearinghouse for information,” its scale, its reach. A slide of the old “tax relief” entry. A slide of the new one. And then I showed them slides from the student papers, demonstrated the uptake: “according to Wikipedia, what is often described as ‘tax relief’ is actually a type of ‘tax evasion,’ in which . . . ”; I highlighted language I’d written (stoned, in my underwear) and put it beside unattributed language in a second paper about taxation as patriotic. I kept pausing, thinking somebody would say something; others kept looking at Hofmann, who’d put her glasses on, and whose personal page (before and after) I now pulled up to flatter her. In their stunned silence, birdsong was audible. Only I could hear the silence of the crickets. What we need, what I’m going to establish, is an ever-expanding phalanx of Wikipedia editors to create, reframe, and defend these pages, which are treated by more and more of the human population as both encyclopedia and news source. Of course, there will be challenges, complexities. But the fact that you have had, Dr. Hofmann, your groundbreaking insights into the importance of metaphorical framing at the precise moment when all existing frames are up for grabs at Wikipedia—well, I’ve been so excited about this project I’ve been finding it very hard to sleep. I walked home from the utter triumph of the PowerPoint to open my laptop and find most of my “tax relief” edits gone. Other editors found them biased, restored much of what I’d deleted or reshaped. This was one of the most obvious challenges: how could you make your edits stick? I clicked “talk” at the top of the entry to view the page where edits were debated. Whereas most online discussion qu"
