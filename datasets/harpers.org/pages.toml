title = "With Child, by Kiera Feldman"
description = "A weekly email taking aim at the relentless absurdity of the 24-hour news cycle."
full_description = "December 2016 Issue [Letter from South Dakota] With Child Download PDF Adjust Share The right to choose in Rapid City by Kiera Feldman, Ashley arrived for her prenatal appointment at Black Hills Obstetrics and Gynecology, in Rapid City, South Dakota, wearing a black zip-up hoodie and Converse sneakers.* To explain her absence from work that morning — a Tuesday in April 2015 — she had told a co-worker that she was having “female issues.” She was twenty-five years old and eight weeks pregnant. She had been separated from her husband, with whom she had a five-year-old son, for the better part of a year. The guy who’d gotten her pregnant was someone she’d met at the gym, and he’d made it abundantly clear that he wanted nothing more to do with her. Ashley found herself hoping that the doctor would discover some kind of fetal defect, so that her decision would be easier. She glanced across the waiting room at a television playing a birth-control ad and laughed darkly. “Jesus, Lord, it would be so nice if someone just pushed me down a flight of stairs.” Photographs from South Dakota by Lara Shipley In the exam room, she perched on the table with her feet crossed at the ankles, her blond hair brushing the back of her pink hospital gown. “I don’t know what’s available for me here,” she told her doctor, Katherine Degen, who sat facing her on a stool. “I figured nothing.” “Big, fat zero, unfortunately,” Degen said, making a 0 with her fingers. The last doctor who provided abortions in Rapid City retired in 1986, three years before Ashley was born. The baby was due in November, when Ashley, who was a nurse, hoped to be enrolled in a graduate program to become a nurse practitioner. Getting pregnant as a teenager had forced her to put that dream on hold, but she had thought that she was finally ready; she had even submitted her application shortly before the March 15 deadline. For the first time in her adult life, Ashley felt as if her plans were coming together. Then she missed her period. It would be too difficult to attend school as a single mother of two, Ashley knew. She had made an appointment for three weeks from now at the nearest abortion clinic, in Billings, Montana, 318 miles away. But just a week and a half ago, her husband had said he wanted to get back together and offered to raise the child as his own. Was it a sign that she was meant to continue the pregnancy? As a rule, Ashley approached her problems with resolve. She was capable and tough; she liked shooting guns and lifting weights. She kept track of her stats and checked off her goals as she achieved them one by one. Yet the dilemma before her had shaken her confidence. She leaned back and turned to watch the ultrasound screen. The black-and-white image danced. A sharp, fast thumping emerged from the machine. As Degen removed the wand, Ashley wiped the corner of her eye. “Whatever you want to do,” Degen told her, “we’re here for you.” She left the room. Ashley stood quietly in her orange socks, looking down at the sonogram she held in her hands. Later, I asked the doctor how often she saw patients who were considering an abortion. “Once a month, maybe,” Degen answered. “And how many don’t tell us?” She knew patients feared her and her colleagues’ disapproval. Very few of the women, she guessed, ever went through with the procedure. At eight weeks, four days pregnant, Ashley was still within the recommended ten-week window for mifepristone and misoprostol, pills that are taken in two doses to induce miscarriage. In some states, a medication abortion is easily obtained — even nurses can administer one. But Ashley’s doctor could not offer to write her a prescription, because Black Hills isn’t licensed as an abortion facility. South Dakota law requires facilities that provide abortions — including medication abortions — to obtain a special license from the Department of Health. Yet for patients like Ashley, the problem isn’t merely that the law makes it hard for doctors to perform the procedure; it is that few in Rapid City would be willing to. Physicians’ right to refuse is legally protected. Since 1973, the state has exempted medical professionals from any liability that might result from such a refusal, regardless of whether a woman is seeking an elective abortion or having a medical emergency. These and other laws make South Dakota among the most difficult places in the United States to end a pregnancy. Lawmakers tried to ban abortion in both 2006 and 2008. The first time, the proposed ban was absolute, except to save the life of the mother; the second time, it made exceptions for rape and incest. Proponents campaigned against “abortion as birth control.” Kate Looby, a former director of Planned Parenthood of South Dakota, remembered the censorious tone of the legislators: “Women, if you’re going to have sex, you’re going to have to deal with the consequences.” Voters rejected both bans by a margin of around 10 percent each time, but new restrictions have been introduced nearly every year since. In 2011, the state mandated a seventy-two-hour waiting period that requires women to make two separate trips to the clinic: first for an initial consultation, and then, three business days later, another for the procedure itself. Regulations compel doctors to tell women that “abortion will terminate the life of a whole, separate, unique, living human being,” that abortion is linked to suicide and depression, and that state funding may exist to cover the cost of prenatal care and childbirth. Women must be told the gestational age of the fetus and what it looks like. Also in 2011, legislators passed a bill that forces women to visit a crisis pregnancy center in addition to making the two trips to the clinic. C.P.C.’s, which are run by antiabortion groups, often discourage the use of contraceptives, and are known for such underhanded tactics as telling women that abortion is linked to breast cancer and infertility. That bill is currently stayed by a district court, but in March 2016, South Dakota passed two additional laws. One mandates that women receiving medication abortions be told — erroneously — that the procedure is reversible if they change their minds between the first and second doses. The other prohibits abortions at or beyond twenty weeks — meaning that a woman who discovers too late that she is carrying a nonviable fetus must wait for it either to expire in utero or to die after birth. Largely rural and sparsely inhabited, South Dakota has two main population centers: Rapid City, in the west, and Sioux Falls, in the east. They feel like separate states; each is in a different time zone. “West River,” as South Dakotans call the region Ashley comes from, west of the Missouri River, is the more conservative. The major industries are cattle ranching and mining. Most residents are religious — the assumption is that you’re a Christian. At Rapid City’s Rushmore Mall, Sunday services are held at Hills of Grace Fellowship, next door to MasterCuts and around the corner from Hot Topic. Things here tend to stay the same. Families can trace their roots back three or four generations. Some residents never leave their zip code. People living in Rapid City must travel farther to reach an abortion provider than residents of any other place in the nation. The lone abortion clinic in the state is the Planned Parenthood in Sioux Falls, 350 miles away, in South Dakota’s more progressive southeastern corner. I-90, the main thoroughfare between the two cities, is frequently closed during the winter because of snow and ice. A few years ago, when a blizzard hit, dead and bloated cattle lined the highway. All the Planned Parenthood doctors fly in from out of state, and patients are required to see the same person for both their appointments, so if a doctor’s plane is canceled or the highway is closed on any leg of the trip, the process has to begin all over again. “Most people make the trip on Monday and have their visit and turn around and drive right back,” explained the clinic manager. “And the same thing on Thursday.” Once South Dakota’s waiting-period law went into effect, the Red River Women’s Clinic, in Fargo, North Dakota, began seeing an increase in patients crossing the border. Red River is the only abortion provider in North Dakota, and in fact the same few doctors serve the whole region, flying from Minneapolis to Fargo, Sioux Falls, and a few other cities on a rotating schedule. The cost of the abortion, the cost of transportation, the cost of childcare, missed work, an overnight stay, a possible delay because of snow or ice — these are among the burdens women in South Dakota must bear when they seek a medical procedure that is now regulated unlike any other. But the law is not the only source of the pressure that women experience: the bounds of what is culturally acceptable are also narrowing. In Rapid City, even pro-choice activists seemed nervous when I spoke too frankly in public. “Watch the a-bombs,” one woman whispered to me in a restaurant. Ashley grew up in a former mining town in the Black Hills. Her high-school class, which graduated in 2008, had fewer than eighty students. Sex education was limited; the assumption was that kids would learn what they needed to know at home. Ashley’s family attended mass every Sunday, and her parents counseled abstinence until marriage. But students nonetheless tended to become sexually active in early high school. Ashley and her friends would get together for “cackling-hen talk,” as she called it, about what the guys were doing to impress them when they “went all the way.” She guessed that at least five girls in her class were pregnant before they turned twenty. In college, Ashley met Peter at a fraternity party, in a dark, smoke-filled basement. A year after they started dating, Ashley discovered she was pregnant. She was nineteen. Her sophomore year had barely begun. She and Peter got along well, but they weren’t in love. She had wanted to travel the world in her twenties, not start a family in her teens, yet the path seemed clear. “We’re definitely keeping it, right?” Peter said when Ashley broke the news. Both of them came from Christian families and they were raised to know right from wrong. It was 2009, the year after South Dakota’s second attempt to ban abortion. Ashley had seen the pro-life ads, read the op-eds by pro-life pediatricians, witnessed the heated demonstrations. The fervor helped reinforce what was acceptable and what wasn’t. At her wedding, she was twenty-one weeks pregnant. Ashley stayed in college, but pregnancy ended her career on the cross-country team and wrecked her athlete’s body. And while she loved being a parent, she sometimes felt that she had no life outside her roles as a wife and mother. These feelings began to change in 2013, when she took up weight lifting. On social media, she documented her changing body and growing sense of autonomy. In one video, she looks off into the distance, takes a deep breath, and deadlifts more than her body weight. Ashley considered herself an independent thinker; she believed that women who faced unwanted pregnancies should be able to do whatever best suited them. But now that she was pregnant again, none of her options seemed good. She already had one child, so pregnancy was not an abstraction; she couldn’t avoid imagining the fetus as the beginnings of a specific person rather than as a collection of cells. At the same time, she knew that if she kept the baby, her parents would be terribly disappointed in her. The child would be born out of wedlock, and Ashley worried they wouldn’t love it as much as her first. The “sperm donor,” as Ashley called him, was half black, and in all likelihood she would be the mother of a noticeably biracial baby in an overwhelmingly white city. Ashley knew that her husband wouldn’t be seen as the “real” dad — he was “as white as the day is long.” She imagined herself as the maid of honor at her sister’s wedding that fall, seven months pregnant with another man’s child. The logistics were yet another consideration. She would need to be gone for at least a day and a night. Who would watch Ashley’s son if not her parents? How could she explain needing to leave town on a Wednesday, the only day the Billings clinic could schedule her surgical abortion? Ashley’s close friends were mothers, and asking for their support — emotional or material — would be asking them to aid in what was, to them, a moral wrong. “They would say abortion is murder,” Ashley explained. “Or selfishness on the mom’s part. Like, ‘Well, you should’ve kept your legs shut, then.’ ” The obstacles encountered by women seeking abortions in South Dakota are not unique to that state. Five states — South Dakota, North Dakota, Missouri, Kentucky, and Mississippi — have just a single clinic left. Fourteen states demand waiting periods that necessitate two trips to the clinic. Nineteen ask abortion providers to have a relationship with a local hospital that includes admitting privileges (which are often denied, especially in conservative areas) or an emergency-transfer agreement. Twenty-one require clinics to make expensive, unnecessary upgrades that effectively transform them into mini-hospitals. A state can restrict a woman’s insurance from covering an abortion or force her to view a sonogram; it can require a teenager to seek permission from her parents. Stiff regulations have become the rule, not the exception. How did we get here? Most of the current restrictions owe their existence to a standard that was established by the Supreme Court in 1992, in Planned Parenthood v. Casey. Roe v. Wade, which legalized abortion in 1973, had prohibited states from impeding access to the procedure before fetal viability (now understood to be around twenty-four weeks). In a landmark shift, Casey established that the state had an “interest in potential life” from conception and could attempt to persuade women against abortion by expressing a “preference for childbirth.” The only laws that Casey forbade were those whose “purpose or effect is to place substantial obstacles in the path of a woman seeking an abortion.” The decision permitted legislation that claimed to serve women’s health. It allowed states to restrict abortion so long as the measures did not impose an “undue burden” on women. What that meant, exactly — what qualified a burden as undue — has been a political and legal point of contention ever since. After Casey, the antiabortion movement adopted an incremental strategy. Throughout the 1990s and into the 2000s, as federal rulings progressively narrowed the definition of “undue,” legislators successfully passed restrictions in state after state. In 2007, the Supreme Court upheld a Nebraska ban on so-called partial-birth abortions and reaffirmed the undue-burden standard. The ruling energized the antiabortion movement. When Republicans swept state legislatures and governor"
