full_description = "March 2025 Issue [Letter from Greece] The Ballad of Little Maria What really happened to a stranded five-year-old refugee? by Lauren Markham, Illustration by Simon Pemberton [Letter from Greece] The Ballad of Little Maria What really happened to a stranded five-year-old refugee? by Lauren Markham, Adjust Share Listen to an audio version of this article. The saga began in mid-July 2022, when Giorgos Christides, a Greek reporter for the German newsmagazine Der Spiegel, began messaging someone who claimed to be one of about forty migrants stranded on a small islet somewhere in the middle of the Evros River, which forms a border between Greece and Turkey. The group was composed of men, women, and children, most of them from Syria. They were apparently trying to cross into Greece in order to seek protection on European soil. Among them was a five-year-old named Maria, who was traveling with her parents; her twin, Maya; and three siblings, Hassan, Ayah, and Hanin. Some of the group members had reportedly ended up on the islet after the Greek authorities captured them on the mainland and forced them back into the river. Now they were stuck. It was brutally hot, and they had dwindling provisions and waning cell batteries. As close as they were to shore at certain points—less than the length of a soccer field—any attempt to swim across the river’s racing current could prove deadly. Please, they beseeched human-rights workers and journalists. They feared for their lives. Could someone help secure their rescue? In a country of more than ten million people, in which more than one million refugees had arrived since the start of 2015, migration had become one of Christides’s central beats. Over the previous few years, the Greek government had amassed a long track record of human-rights abuses against migrants. As a result, Christides frequently received messages from people in desperate circumstances. This time, he happened to be on vacation by the sea with his wife and kids, who wished he would put away his phone. Still, Christides felt a responsibility to reply. To the chagrin of his family, he began a lengthy correspondence with the group. In truth, if the refugees were indeed in Greece, only the authorities could have helped them to safety. The border region in which they were stranded was a heavily patrolled military zone; anyone who appeared to be helping a migrant reach Greece from Turkey could be charged with facilitating illegal entry, or abetting human smuggling. Besides, Christides was a journalist, not a humanitarian worker. All he could really do on the group’s behalf was reach out to officials and take to social media. “Greek authorities have their location,” he tweeted, “but as usual show no willingness to follow court orders. In a video call I had with a young girl from the group today, she took me through the Evros islet and begged for help.” Christides had come into his own as an international journalist during the post-2008 Greek debt crisis, amid a surge of extreme nationalism. Mass refugee arrivals to the country began soon after. By 2022, he had been writing for Der Spiegel for a decade and had won numerous awards. He’d reported critically on both the left-wing Syriza government and the center-right New Democracy regime that took its place. He had been widely criticized by readers across the political spectrum. “I might be naïve,” he told me, “but I love Greece, and I believe that better systems are possible and that it’s important to hold the government accountable.” It seemed likely that the Evros Thirty-eight, as the group would come to be known, were victims of what’s commonly called a “pushback.” In this practice, common in Greece, authorities remove groups of refugees, often violently, and force them back across the border—sometimes to their deaths. While such refoulement is prohibited under international law, thousands of pushbacks have been reported in the Aegean Sea, strandings just like the one in which the Evros Thirty-eight found themselves. Besides contacting Christides, members of the group got in touch with a number of humanitarian organizations, including the Greek Council for Refugees and HumanRights360, which in turn informed authorities and demanded the refugees’ rescue. On July 20, nearly a week after the Evros Thirty-eight were first documented on the islet, these NGOs appealed to the European Court of Human Rights, which swiftly ordered the Greek government to rescue them. Journalists and advocates worked to confirm their location via metadata from the images they shared, trying to determine whether they were messaging from Greece or from Turkish territory. On July 25, two witnesses were able to take an audio recording of the group from the Greek side of the river. Still, the Greek authorities claimed they couldn’t find them. Around this time, Christides posted a video. In it, the group spots a few men on the Greek side of the river, where a small boat has been pulled ashore. “I’m police! Police! I’m police!” one of the men yells. “Want the boat?” he asks. The refugees claimed that he later destroyed it and left it on the bank. They also said that masked men had come to the islet, beat the migrants, then transported them to the Greek mainland—but after several hours in detention, they were once more forced onto boats and taken to the Turkish side of the river. Eventually, the migrants said, Turkish authorities transported them to another nearby location. Several days later, they were back on the islet. By then, Christides and others had been sharing the stranded group’s photos and messages on Twitter nearly every day, along with their locations. “There is NO excuse,” he wrote on July 25, “for [Greek] authorities to fail to respect the European Court of Human Rights’ order and rescue these people.” It now seemed that practically everyone in Greece had heard of the Evros Thirty-eight. One corner of Twitter was aflame with indignity that the government could so wickedly leave people to die. The other, hardened by years of refugee arrivals and a rise in xenophobic right-wing politics, was equally and oppositely incensed: these refugees could have stayed in Turkey and avoided their fate had they not been so greedy for Europe. Days passed, and the group continued to send a deluge of dire messages to the people they thought could help them. “We are hungry and sick and insects have bitten our bodies,” one pleaded, and they sent photos of their wounds. Two of the group’s members had already drowned during the initial crossing, the refugees said. “My grandmother is crying and saying let me just die here,” a woman named Baidaa, who had become the group’s spokesperson, wrote to the organization Alarm Phone. “Why does no one want us? What is our fault, my friend, only because we are Syrians, we are rejected by everyone. Turkey deports us, and Greece beats us, deports us and is throwing us onto the islands. Our situation is miserable here. The situation here is tragic.” Then, on August 9, more than three weeks after they were first reported to be on the islet, Baidaa sent sobbing voice messages: Two sisters, nine-year-old Ayah and five-year-old Maria, had been stung by scorpions and fallen ill. The elder sister was still alive, but Maria had died in the night. They sent photos of her body laid out stiffly on the brittle grasses, slightly blue in the face, eyes shut, pants pulled down to expose the fatal wound. “I will never forgive this world,” Baidaa wrote to Alarm Phone. “Do you know the feeling of a father and mother when they lose a child . . . and their other child is fighting death in front of them?” Still on vacation, Christides took in the messages. “SOS in Evros,” he posted on Twitter. “A small girl of 5 reported dead, another in critical condition.” Der Spiegel published his article the next day. Like most national borders, the line dividing Greece and Turkey is relatively new. It was first conceived in Lausanne, Switzerland, in 1923, in the aftermath of the First World War. The border, as the Treaty of Lausanne defined it, would follow the median line between the main channel of the Evros River, which spills from the great Rila mountain range of Bulgaria, down through the hilly green borderlands of Greece and Turkey, and eventually into the northern Aegean. But the exact line wasn’t drawn by the countries until 1926; it took three years to determine the primary fork of the many-pronged waterway and to locate the exact middle of the river. Unlike a fence, a river moves. “The idea of a natural border is a misconception,” Stefanos Levidis, a research fellow at the organization Forensic Architecture, told me. The mutable nature of border landscapes can pose political problems—like trying to keep track of where the line even is. In 1864, for instance, flooding shifted the course of the Rio Grande at the U.S.-Mexico border so dramatically that hundreds of acres of Mexican land were suddenly on the U.S. side of the river; only after much argument did the States return the land to Mexico a century later. The Evros is likewise changing all the time; new islets form and old ones erode away, creating what Levidis described as a “zone of territorial confusion,” used by both Greece and Turkey to abandon asylum seekers such as the Evros Thirty-eight. This mutability can be of political use. When the Greek refugee crisis began in 2015, Syriza and the Greek people largely welcomed the migrants, who were arriving on inflatable boats and rickety fishing vessels from across the Mediterranean, numbering more than 850,000 in the first year. But over time, that welcoming spirit curdled. A crisis stays a crisis for only so long; the refugees landing in Greece morphed in the public imagination from innocents deserving of rescue into national nuisances. According to E.U. law, the country where a refugee first arrives is responsible for examining the asylum claim. Countries in Europe’s interior were effectively insulated from the surge, with countries on the southern perimeter, like Italy and Greece, serving as the de facto gateways to, and guardians of, Europe. Early on in the crisis, the Greek government began detaining refugees on five “hot spot” islands in the Aegean, where asylum seekers would remain until they were approved. Only then would they be allowed entry into the interior of Greece and, potentially, continue onward to other parts of Europe. Resources were stretched thin on these islands as it was, and refugees were spending years stuck in camps as they waited for their cases to progress. It didn’t take long for the once-sympathetic newcomers to be cast as invaders. By 2019, Syriza had failed to extricate Greece from its immense post-crash debt, and the New Democracy party swept local and national elections, installing Kyriakos Mitsotakis as prime minister. New Democracy had campaigned heavily on tough-on-border policies, and it has kept its promises while further stoking anti-migrant rhetoric. “Those who are not welcomed will be returned,” Mitsotakis said months after taking office in 2019. “We will permanently shut the door to illegal human traffickers, to those who want to enter although they are not entitled to asylum.” Since he took power, reports of pushbacks have dramatically increased—and early in his first term, the number of arrivals plummeted. (That period coincided with the pandemic, which also affected arrivals.) Polls make clear that New Democracy’s anti-migrant focus has resonated with a good portion of Greek society; the rest of Europe, the thinking goes, saddled them with not only generations of unpayable debt, but also an undue responsibility to manage migrants for the entire continent. The surge also deepened the country’s centuries-long rift with Turkey, from which most refugees entering Greece, including the Evros Thirty-eight, launched their boats. In February of 2020, Turkish president Recep Tayyip Erdogan flouted a long-standing agreement with Europe and opened its western borders, allowing thousands of people to attempt crossing in a matter of days. In response, Greece detained many new arrivals in prisonlike conditions and suspended their right to seek asylum. Authorities also used COVID restrictions to limit their freedoms, hemming them into the camps with limited services and preventing them from leaving. Then, in 2023, a migrant ship carrying some seven hundred and fifty people bound for Italy became stranded in waters off the coast of Pylos. The Hellenic Coast Guard first ignored the distress calls, and later, while allegedly trying to tow the vessel, caused the boat to tip, scattering those on deck into the sea and dooming the many stuck below. More than six hundred people drowned. This looked suspiciously like an effort to ensure that the people on the boat would not enter Greece. A bombshell investigation in 2020 made clear that authorities from Frontex, the European border and coast guard agency, not only knew about Greek pushbacks and did nothing to stop them, but even witnessed and effectively participated in the acts alongside their Greek counterparts. It was Christides who broke that story, co-authored with several other journalists, in October 2020. The article contributed to a widespread notion within Greece: European powers may rhetorically criticize the country for its human-rights abuses, but they tacitly welcome—and even occasionally partake in—illegal efforts to secure the border. “If Frontex not only turned a blind eye to abuses committed under its sight, or worse, directly took part in them,” said Eva Cossé of Human Rights Watch in response to the report, “it becomes every European Union member state’s responsibility.” Nearly two years later, the chief of Frontex, Fabrice Leggeri, was forced to resign, in part as a result of the revelations in Christides’s reporting. (The agency said that its new management aims to “increase transparency” and “uphold fundamental rights.”) But for the most part, Mitsotakis’s pushback regime has been met with little effective resistance. New Democracy was reelected in a landslide just weeks after those six hundred refugees died off Pylos. The party’s continued popularity has depended on two key ideas its members fomented within the Greek public: that Greece is taking on the bulk of responsibility compared with most other countries in Europe, and that many of the refugees coming over aren’t refugees at all, but opportunists. Many of these so-called refugees trying to enter Greece are liars, they suggest. And journalists and humanitarian workers are aiding and abetting those lies. “Maria is dead,” Christides wrote in Der Spiegel. “She died at Europe’s external borders in early August because Greek authorities denied her all help.” He outlined the whole saga: the Evros Thirty-eight’s weeks of begging for help, officials’ refusal to rescue them, and the reports of a deadly scorpion sting. Later, members of the group would e"
