full_description = "Classifieds Pricing and Sizes Why Advertise in Harvard Magazine's Classifieds Section?Exclusive Audience: Access Harvard University's alumni, faculty, and staff—an engaged readership with high purchasing power. Proven Success: Advertisers have rented properties, sold homes, grown businesses, and even found life partners. Long-Term Trust: Many advertisers have partnered with us for over 20 years due to quality leads and results. Support Independent Journalism: Advertising helps fund 1/3 of Harvard Magazine’s budget, ensuring editorial independence. Flexible Options: Choose from text or display ads, specialty sections like the Harvard Authors' Bookshelf, and online add-ons to fit your needs. Cost-Effective Exposure: Reach a targeted, loyal audience at competitive rates with discounts for frequency and Harvard alumni businesses. Issue Dates and DeadlinesPlain Text AdsClassified Display AdsHarvard Authors' BookshelfEducation & Enrichment ResourceTermsContact Information/Business HoursIssue Dates and DeadlinesHarvard Magazine is published bi-monthly (6X/year). 2025 Issues Deadline Publication DateJanuary-February November 15, 2024 January 1March-April January 15 March 1May-June March 14 May 1July-August May 15 July 1September-October July 15 September 1November-December September 15 November 1 Plain Text Ads 1-2 issues: $5.40 per word3 issues: $4.86 per word (save 10%)4-5 issues: $4.59 per word (save 15%)6 issues: $4.32 per word (save 20%)Add-ons:Crimson border: $65 Star icon: $40 Bolded crimson class year: $10 (Harvard class years verified) Website inclusion: $40Photo on website (not in print): $40Specifications: Minimum: 12 wordsPhone number = 1 word, Email/Website = 2 words, Abbreviations = the words they stand forFirst two words bolded free; extra bolding costs 2x the per-word rate.Submit:Use our online form or email your ad to classifieds@harvard.edu. Classified Display Ads 1-2 issues: $420 per column inch3 issues: $378 per column inch (save 10%)4-5 issues: $357 per column inch (save 15%)6 issues: $336 per column inch (save 20%)(Pricing differential for 1/2 page, 2/3 page, and full page classified display ads. Contact us for rates).Harvard Alumni Business Discount: 50% off display ads (not applicable to plain text ads).Website Inclusion: $40Camera-ready display ad specifications: Standard column width: 2.188 inchesMinimum column height: 1 inchFormat: The preferred format for classified display ads is high resolution (300 dpi) PDFs with fonts embedded or outlinedFonts: All text should be at least 6 pt minimum—or 8 pt minimum for white type knocked out of a colored background. Thin fonts should be avoided (at all sizes) when using white type knocked out of a colored background. Also, consider using serif fonts below 9pt which are more legible at tiny sizes.Images: Bright/light photos work the best. Image resolution should be 300 dpi (150 dpi min). Images taken from the web (72 dpi standard resolution) are not print-quality - it’s best to use originals when possible. Images should be converted CMYK (not RGB) for print. If we have to convert files to CMYK for you, please note, there could be a color shift and they may appear slightly darker. Canva files are not acceptable for print. If you submit a Canva file you will be charged a $70 fee for our designer to re-size and convert your file for print (if that’s possible).Submit camera-ready ads to: classifieds@harvard.edu. Harvard Magazine Design Service: $70/hour (1-hour minimum)Submit Your Request: Click here to fill out our design request formDesign Schedule: Design work is done on Tuesdays and Thursdays.Submit by Tuesday → First proof available Thursday.Submit by Thursday → First proof available Tuesday.Proofs & Revisions:1. You'll receive a first proof of your ad for review.2. You can approve your ad—or request edits or design changes.3. You’ll receive a final proof of your ad for review.4. Changes after the final proof is approved will incur an additional $70 fee.5. Changes may not be submitted after the materials deadline has passed. Harvard Authors' BookshelfThe Harvard Authors' Bookshelf appears in Harvard Magazine twice a year and is open to Harvard alumni, faculty, and staff. Eligibility is verified through Harvard University records.2025 Issues Deadline Publication DateMay-June March 13 May 1November-December September 12 November 1 Harvard Authors' Bookshelf Ads: $595/book per issueIncludes a full-color photo of your book’s front cover.Up to 8 lines of text, typically 35–50 words, featuring:Book titleYour name and Harvard affiliationBrief descriptive textAds may require editing for length or clarity. Discounts (e.g., frequency or network) are not available for this ad type.Submit Your Ad: Click here to submit your ad. A proof will be sent to you for approval. Education & Enrichment ResourceThe Education & Enrichment Resource section is published in Harvard Magazine 4X/year.2025 Issues Deadlines Publication DateJanuary-February November 15, 2024 January 1March-April January 15 March 1September-October July 15 September 1November-December September 15 November 1 Education & Enrichment Resource Ads:Formatted Text Ad $275Includes school/business name and website or phone in boldface, 6 lines of text, approximately 50 words depending on length. You will be contacted if your ad must be edited. Email your text to: classifieds@harvard.edu. A proof will be sent for your approvalDisplay Ad Options:1.5” (2.188” X 1.5”): $3851/12 page (2188” X 2.25”): $6851/6 page (horizontal: 4.563” X 2.25”, vertical: 2.188” X 4.75”): $1,3701/3 page (square: 4.563” X 4.75”, vertical: 2.188” X 9.625”): $2,740*For larger size options, please contact classifieds@harvard.eduDiscounts (e.g., frequency or network) are not available for this ad type. Camera-Ready Display Ad Specifications:Format: The preferred format for classified display ads is high resolution (300 dpi) PDFs with fonts embedded or outlinedFonts: All text should be at least 6 pt minimum—or 8 pt minimum for white type knocked out of a colored background. Thin fonts should be avoided (at all sizes) when using white type knocked out of a colored background. Also, consider using serif fonts below 9pt which are more legible at tiny sizes.Images: Bright/light photos work the best. Image resolution should be 300 dpi (150 dpi min). Images taken from the web (72 dpi standard resolution) are not print-quality - it’s best to use originals when possible. Images should be converted CMYK (not RGB) for print. If we have to convert files to CMYK for you, please note, there could be a color shift and they may appear slightly darker.Canva files are not acceptable for print. If you submit a Canva file you will be charged a $70 fee for our designer to re-size and convert your file for print (if that’s possible).Submit camera-ready ads to: classifieds@harvard.eduHarvard Magazine Design Service: $70/hour (1-hour minimum)Submit Your Request: Click here to fill out our design request formDesign Schedule: Design work is done on Tuesdays and Thursdays.Submit by Tuesday → First proof available Thursday.Submit by Thursday → First proof available Tuesday.Proofs & Revisions:1. You'll receive a first proof of your ad for review.2. You can approve your ad—or request edits or design changes.3. You’ll receive a final proof of your ad for review.4. Changes after the final proof is approved will incur an additional $70 fee.5. Changes may not be submitted after the materials deadline has passed. TERMS:Rates: Per issue and net.Positioning: No guarantees in the classifieds section.Ad Options: Choose print-only or web-only at the plain text or classified display ad rate.Payment: Pre-payment required via:Credit card: MC, Visa, Amex, Discover (Call 617-496-6686 or Skype: hmagclassifieds)U.S. check/money order: Mail to Harvard Magazine, Classifieds Dept., 7 Ware St., Cambridge, MA 02138.Policy: Ads are subject to publisher approval. Harvard Magazine reserves the right to decline or