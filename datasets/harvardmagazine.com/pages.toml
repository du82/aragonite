title = "Fixing Foreign Policy | Harvard Magazine"
description = "This essay is adapted from the 2005-2006 Maurine and Robert Rothschild Lecture, delivered on April 24 under the sponsorship of the Radcliffe..."
full_description = "Features Fixing Foreign Policy Overcoming bipartisan blindness about America's interests abroad July-August 2006 Illustration by Robert Neubecker const trinityScript = document.createElement('script'); trinityScript.setAttribute('fetchpriority', 'high'); trinityScript.src = 'https://trinitymedia.ai/player/trinity/2900016010/?pageURL=' + encodeURIComponent(window.location.href); document.currentScript.parentNode.insertBefore(trinityScript, document.currentScript); This essay is adapted from the 2005-2006 Maurine and Robert Rothschild Lecture, delivered on April 24 under the sponsorship of the Radcliffe Institute for Advanced Study. Can American foreign policy be fixed? Whether the alarms are caused by our plummeting global standing, our deadly war in Iraq, our democratization efforts (which have produced outcomes we don’t like), or our often seemingly self-defeating efforts to curb terrorism, most Americans are now prepared to acknowledge that the United States is in trouble abroad. Because of our current strategic, financial, and reputational predicament, much of what follows sounds directed at the Bush administration. But it is essential that we acknowledge the degree to which this administration has exposed and exacerbated structural fissures that were evident long before it took office. If the United States is to turn things around, it must identify the flaws in the conception and conduct of its foreign policy and fix what is fix able. Rather than leaving foreign policy to the “experts,” the rest of us must insist that our government play a role in the world that is more attentive to the values and long-term interests of its citizens. Influence and Isolation To begin, what is broken? First, the United States is nowhere near as powerful as it was five years ago, or as many within the Bush administration believe it to be. The disproportionate military and economic might that this country brought to bear in the 1990s lulled a lot of people into a false sense of security: we measured power on an old-fashioned, twentieth-century abacusaccording to gross domestic product, advantageous trade deficits, or unsurpassed military and technological supremacy. The memory of how the Cold War was allegedly won further fueled this idea. We outspent and outgunned the Soviet Union, the story went, and our freedoms won the affections of repressed peoples. But what we recognize now, as the Bush administration tries to exert American will around the world, is the degree to which the old power metrics are anachronistic. In thinking about power today, we would be better served thinking in terms of influence. And here other factors enter into the equation. The U.S. military budget exceeds that of the next 30 powers combined, and the U.S. economy trounces our nearest competitors. But our actual influence can be gauged only by our ability to get what we want. And in the post-9/11 world or the post-Iraq world, we must recognize that this influence stems from two variables that U.S. policymakers have thought far too little about: other people’s trust that the United States will use its power legitimately; and other people’s faith that the United States is capable of achieving what it puts its mind to. Once upon a time, before the bungled war in Iraq and the bungled response to Hurricane Katrina, the United States was largely seen as a “can-do” country. Whatever non-Americans thought about the morality of U.S. foreign policy, even in the wake of the defeats and indignities of Vietnam and Somalia, foreigners generally assumed that when the United States set out to do something, it would succeed. The Bush administration has undermined the traditional sources of U.S. powerby stretching our army and National Guard to their respective breaking points, and by borrowing colossal sums of money. But the failures of planning and execution in Iraq have done something else: they have made us look fallible and vulnerablean impression only compounded by our failure to assist our own during the hurricane. Second, the United States is more isolated internationally than it has ever been. Because of the sheer number and breadth of transnational challengesfrom failed states to loose fissile material to avian fluthe United States must be able to work with other countries in order to meet common challenges. Throughout our history, “America-firsters” like Joseph McCarthy and John Bricker have occasionally pushed the U.S. government to retreat from international institutions and even from international affairs. What makes today’s isolation markedly distinct from its predecessors is that, although it is directly caused by American decision-making, it is no longer the product of conscious choice. We thought we were strong enough militarily and economically to go it alone; but when we looked up, finally eager to step up United Nations involvement in Iraq, or to secure troop commitments for a peacekeeping force in Darfur, even our closest allies shied away. They had begun to question the utility of too close an association with Washington. In the 1990s, even as the Republican Congress pushed for a retreat from international engagement, if you were a human-rights advocate hoping to secure the release of a dissident imprisoned in China, there was only one capital city you would visit: Washington, D.C. If you wanted commercial patents on antiretroviral medicines loosened so that people suffering HIV/AIDS in sub-Saharan Africa might receive treatment, or if you wanted to argue for the deployment of UN peacekeepers to Rwanda or anywhere else, you’d have to come to Washington. And certainly if you believed NATO military intervention was needed to stop slaughter in the Balkans, you absolutely, positively had to come to Washington. What is most striking about the last five years is the extent to whichowing to the steady erosion of U.S. legitimacy and the steady increase in skepticism about our competencethe era of “one-stop shopping” is over. Yet even with the weakening of the “hyper-power,” other rich nations have not stepped into the vacuum to help carry the burden of global leadership. With U.S. influence weakened, who will raise a voice, and muster the resources, to help secure the global commons? With Russia and China prone to privilege sovereignty over human welfare, and European nations and other middle powers willing to commit money but rarely peacekeepers to tackle global threats, the early signs are not good. Consider Darfur. The United States described the horrors there as “genocide” and pushed for the deployment of an international force, but these initiatives were parodied by our foesand even by former friendsas emblematic of a U.S. desire to bash another Arab state. Few in the global court of public opinion believe that our initiatives are rooted in a regard for the people in Darfur who are suffering and dying. This is of course a convenient alibi for other countries, which have little economic or strategic incentive to get tough with Khartoum, but for the people of Darfur to get the bail-out they need, the United States will have to summon resources from other countries at a time when its summoning power is not what it was. The Accountability Deficit The third broken aspect of American foreign policy concerns accountability. Lamont University Professor Amartya Sen, a Nobel laureate in economics, has famously argued that no country with a free press has ever suffered a substantial famine. Civil and political rights, he has shown, are enabling rights that allow citizens to voice their objections to governments that sin; this, in turn, generally helps persuade those governments to play by minimum rules. Accountability performs a similar, crucial enabling function in the American system. The accountability deficit in the United States warrants extended discussion here, because the disappearance of checks and balances on U.S. foreign policy has had devastating effects. The obvious check of first resort should be the Congress. But when one party controls the White House, the Senate, and the House, that party gets to decide whenor whetherit wants to police itself. And when the country faces a threat to its national security, deference to the president is bound to be even more pronounced, making it even less likely that checks will be vigilantly asserted. The minority party has remarkably few institutional tools available to insist on oversight or to override the majority party’s prerogative. Senators from the minority party can hold press conferences and write op-eds, and when committee chairmen from the majority party deign to call hearings, they can use their seats on committees to grill administration officials. But who watches C-SPAN, anyway? Today, Democrats can appeal for a review of the Bush administration’s disastrous intelligence failures, but they can’t subpoena witnesses or demand access to documents. They can request personnel changes, but can’t make them happen. Ultimately, the majority party will decide just how much oversight it deems appropriate in “wartime.” Take torture: After the Abu Ghraib scandal first broke in April 2004, the Senate Armed Services Committee convened three days of hearings. It was here that Secretary of Defense Donald Rumsfeld testified. An additional hearing, a kind of update session, was held in September 2004. Since then, despite a steady stream of revelations about the existence of secret U.S. detention facilities, the “rendition” of terrorist suspects to countries notorious for practicing torture, and the murder and abuse of detainees by U.S. guards, there has been only one hearing in the entire U.S. Congress on American detention policies. Shockingly, neither the Senate Foreign Relations Committee nor the House International Affairs Committee has held a single public hearing on detention practices, even though Guantánamo and Abu Ghraib have had colossal bearing on U.S. “foreign relations.” But shouldn’t Democrats be able to find a way to take wrongdoers to task all by themselves? Poll data show that Americans believe Democrats have failed to perform this role. On Iraq, indeed, American voters often sound more frustrated with the Democrats’failure to devise a formula for getting us out of the war than they are with a Republican administration for dragging us into it. One factor behind Democrats’ muteness in Iraq is that so many of them29 Democrats in the Senate and 81 in the Housevoted to authorize the invasion. This included all the senators who held presidential ambitions andwith the lone exception of Paul Wellstoneall those who faced tight election races. There was dissent, but nobody in the Senate wanted to be this generation’s Sam Nunn: an up-and-comer whose presidential trajectory was said to have been thwarted by his vote against the Persian Gulf War in 1991. But how do we explain the quietness of the 21 Democrats in the Senate and 126 in the House of Representatives who voted against the war? Well, partly because even those who opposed the invasion do not want to be caricatured as disloyal to U.S. troops. Even so, many Democrats would have long since parted company with their Republican colleagues if, in the wake of the disastrous invasion, they had a satisfactory answer to the question of how to extract U.S. troops from Iraq without doing grave harm to U.S. interests and exacerbating the already deadly bloodbath in which Iraqis are embroiled. In expressing frustration with Democrats at present, many Americans are venting their frustration with the box the United States finds itself in. With no good options, the Iraq debate has been confined to the realm of the “least bad”hardly the stuff to inspire confidence in or enthusiasm for foreign policy, and hardly the stuff to offset Republicans’ traditional advantage on national security. Unfortunately, Iraq has infected discussions of national security more generally. If you are a Democrat and you start a conversation about the components of a progressive national-security platform, about how U.S. foreign policy should be fixed, it is likely you will be cut off within seconds: “That’s very interesting, but what the hell do we do about Iraq?” If you try to talk constructively about how to prevent future harmsoffering ideas about how to modify the Indian nuclear deal, how to deal with Iran’s nuclear ambitions, or how to re-engage North Koreayou’re greeted with, “Yeah, but how do we get out of Iraq?” Democrats must break out of this trap and fulfill their essential responsibilities as an opposition party in wartime, spelling out an alternative vision, and holding the executive branch accountable wherever they can. What about the press? Journalists were shaken like everyone else by 9/11 and its aftermath. In the runup to Iraq, the mainstream media gave the executive branch a pass. Among the 393 interviews on the nightly news broadcasts of the major networks in the two weeks before the war in Iraq, Fairness and Accuracy in Reporting found only three with people identified with organized antiwar efforts. Since the war began going badly wrong, some journalists have done groundbreaking work. 60 Minutes and Seymour Hersh of the New Yorker broke the Abu Ghraib scandal. James Risen and Eric Lichtblau of the New York Times revealed that the National Security Agency (NSA) was spying on us. Dana Priest of the Washington Post exposed U.S. secret prisons at undisclosed locations around the world the “black sites.” Indeed, investigative journalism, far more than congressional oversight, has belatedly sparked domestic debate about how our government balances liberty and security in the post-9/11 world. But less than a week after Dana Priest’s story broke last November 2, the Senate majority leader, Bill Frist, and the Speaker of the House, Dennis Hastert, sent a letter to the chairmen of the House and Senate Intelligence Committees, requesting a bicameral investigation. That’s a big deal: the Congress has conducted fewer than a half dozen such investigations in the entire history of the United States. The most recent was the 9/11 Commission, which was established over the White House’s persistent objections. But what did Frist and Hastert want to see investigated? Not the black sites, but Dana Priest and the leakers! The assault on leaks just launched by the administration could have a terrible chilling effect on the kind of journalism that has offered our democracy a window into policies that American citizens have every right to know about, to debate, and, perhaps, to reject. If better informed, would Americans in fact reject such policies? The ultimate source of accountability is, of course, the amorphous, oft-quoted, poorly understood, rarely consulted “American people.” A quick glance at the poll data is worrying: 61 percent of Americans believe that torture is justified under some circumstances. But we must put these numbers in context. With the exception of Joh"
