title = "Yo-Yo Ma's Journeys | Harvard Magazine"
description = "A warm, breezy day in July, and beneficent providence has set for me a sumptuous lunch overlooking God's own landscape near Tanglewood, on the..."
full_description = '''Features | 3.1.2000 Yo-Yo Ma's Journeys A warm, breezy day in July, and beneficent providence has set for me a sumptuous lunch overlooking God's own landscape near Tanglewood, on the... const trinityScript = document.createElement('script'); trinityScript.setAttribute('fetchpriority', 'high'); trinityScript.src = 'https://trinitymedia.ai/player/trinity/2900016010/?pageURL=' + encodeURIComponent(window.location.href); document.currentScript.parentNode.insertBefore(trinityScript, document.currentScript); A warm, breezy day in July, and beneficent providence has set for me a sumptuous lunch overlooking God's own landscape near Tanglewood, on the patio at Wheatleigh, the poshest hotel in the Berkshires. This is theoretically a business lunch. But never has duty been less stern, for my lunch date is the ineffable Yo-Yo Ma. Radiating sunshine, in Izod shirt, shorts, and boat shoes without socks, he bounces lovingly from the car valet who parks his red Mercedes to the owners, whom he hugs effusively, to the waiter who brings lunch, joking with him in French. Ordering roast potato soup, he says, "Didn't that used to be called vichysoisse?" Then tuna carpaccio. "I love the food here," he exclaims. "You just have to come here for dinner. Hey, can we talk about food instead of real life?" Deer are grazing at the bottom of the sloping lawn and a few yards away, a family of wild turkeys bobs along in unison. "Oh boy, supper!" he whoops. The soup arrives, adorned with a huge, gorgeous morel. He sleight-of-handedly spoons it into my dish. "I already had one," he lies. "Maybe it's the hills," he sighs contentedly, "but I get so calm and psyched when I get close to Tanglewood." Next summer Ma '76, D.Mus. '91, and his family--his wife Jill, son Nicholas, 16, and daughter Emily, 14, musicians all three--will be in their own Berkshire summer home in nearby Tyringham.Ma is at Tanglewood for chamber music with Emanuel Ax and for Strauss's Don Quixote with Seiji Ozawa leading an orchestra comprising young musicians from both the Tanglewood Music Center Orchestra and the Mahler Youth Orchestra of Europe. After our lunch, he is to do a master class at Tanglewood, then drive to a concert in Saratoga, New York. In a couple of days, he will be off to Weimar, Germany, where he and Daniel Barenboim are to inaugurate the West-Eastern pan Chamber Orchestra--50 young musicians from Israel, Egypt, Iraq, and other countries in the testy Middle East, where hatred and mistrust seem to be as indigenous as the rocks.Hate and mistrust, on the other hand, are utterly alien to Yo-Yo Ma. "It is so easy to be cynical," he cautions. "It's an accurate reflection of reality. It's much harder, it takes a philosophical point of view, to be optimistic. You have to work at it every day. One of the joys of working with children is that they are still unspoiled by cynicism." The nurturing of young talent is a priority for Ma. "I'm proud to say," he boasts a little, "that I knew Elmo before he became Tickle-me Elmo, the star. When he was starting the violin, I helped him learn a very difficult note." His appearances on Sesame Street, with Mister Rogers, and as a giant bespectacled gray bunny on Arthur, he says, are "the things I am most proud of; I love being invited into the world of children."His remarks call to mind an icy day in February, when he gave a master class at the Longy School of Music in Cambridge. In spite of absolutely no publicity, it was standing room only. "Is this awesome or what?" exclaimed one young ticket-taker. What was awesome as well was Ma's bounteous encouragement of the three young cellists, occasionally touching their shoulders, borrowing their instruments to illustrate a point, hopping into the audience to hear from a distance. Many of the students' questions involved stamina and endurance. "Go with the energy around you," he urged Lauren, who, having just played the prelude to the cello concerto of Eduoard Lalo, was concerned at how drained she felt. "I used to get very tired playing this movement," he reassured her. "Use the power of the orchestra to help you, that's the secret. Save a little, so you can give a little more."Ma's own colossal stamina has inevitably led to comparisons with great athletes. Conductor David Zinman, a frequent collaborator, says, "I see Tiger Woods as the Yo-Yo Ma of golf." (Others have called Michael Jordan the Yo-Yo Ma of basketball, Yo-Yo Ma the Wayne Gretzky of music, and so forth.) "On our last tour," says Zinman, "Yo-Yo tried to define energy for me. He said, 'You have to expend energy in order to produce energy. If you empty yourself, you're going to fill yourself even more.' Sometimes he sleeps; sometimes he doesn't. He's one of those people who can sleep on a dime. If he has 10 minutes before a concert, he can just zzzzzzz out, then throw some water on his face and be radiant."At that wintry master class, Longy director Victor Rosenbaum had introduced Ma as "our Cambridge neighbor, the most famous cellist of our time, and one of the most celebrated musicians of all time. The connections he makes between music and life imbue his music with humanity. At Harvard, he did many things with enthusiasm. Probably, at one time or another, he could have gone in several directions." Ma's riposte: "While I was at Harvard I tried to do many things; the reason I'm a cellist is that I could only do one."Rosenbaum was right, of course, on all counts. But at our midsummer lunch, Ma protests, "Come on, there are millions of things I can't do! Have you ever seen me on the dance floor?" About Harvard, his connectedness, and his "several directions," however, he is happy to expand...give or take the occasional elusive riff. "I think I am pushing the envelope--by the way, what does that mean? I know what it means to lick the envelope--in that I'm seeking to join, to connect things, that were not previously joined together: from Bach to the Kalahari to music along the Silk Road, to country fiddling and the tango."And yes, Harvard has everything to do with my trying to stretch boundaries," he says. "My Harvard experience informs my life to this day. As a kid, I had lived in different places, but still I was fairly protected. Harvard was the first place in my life where I was systematically introduced to different worlds and ways of thinking. I learned there how science and art are joined under philosophy."So much of what I do today is based on the first introductory courses I took," he explains. "You might say I'm still acting on some of the information I received then. My favorites? Fine Arts 13, with Seymour Slive. A course on Dostoevsky taught by Setchkarev, which I loved; I used to call people in the middle of the night to talk about Dostoevsky. 'Rice Paddies' [Soc Sci 11a and 11b] withConcerto ConnectionsCathy Barbash '74, an arts consultant and former manager of the Philadelphia Orchestra, was the manager of the Harvard-Radcliffe Orchestra in 1971, when Ma, still in high school, played Tchaikovsky's Variations on a Rococo Theme with the HRO. Her parents, Lillian and Maurice Barbash, were in the audience that night, and so smitten were they by the young cellist then and at his concerts through the years that they decided to celebrate their fortieth anniversary by commissioning a concerto for him. Ma chose for the composer his preceptor and friend Leon Kirchner. The result was Music for Cello and Orchestra, premiered in 1992 with the Philadelphia Orchestra under David Zinman, and later recorded by the same forces, together with two other Ma commissions, Richard Danielpour's Concerto for Cello and Orchestra, and Christopher Rouse's Violoncello Concerto. The recording, made against hilarious odds during Philadelphia's huge blizzard of January 1996, earned Ma a Grammy, one of 13 he has collected. Says conductor Zinman, that CD, Yo-Yo Ma Premieres, was "another victory for American music."Fairbank and Reischauer. German literature in translation with Dorrit Cohn. And then, of course, anthropology with Irv DeVore. My whole life was in a sense changed by that course." A few weeks earlier, I had spoken to Irven DeVore, Moore professor of biological anthropology. DeVore remembers Ma with fondness as a student in a forerunner of his Core course, Science B-29, "Human Behavioral Biology" (affectionately known to undergraduates as "Sex"). A music lover, DeVore had become familiar with the playing of the Puerto Rico-based cellist Pablo Casals while doing research on that island. One evening at Harvard, DeVore and his wife heard Ma play a concert at the Busch-Reisinger Museum: "Blew us away completely." The next morning, DeVore opened class by saying, "'I know that the prestige of this University tends to focus on the accomplishments of our athletes, who this year, bless them, are doing superbly. But I want to tell you that last night I heard a Harvard freshman play the cello, and his expertise puts any athlete in the shade, and far exceeds that of the acknowledged master of his field, Pablo Casals. That freshman is sitting right up there.' I pointed to Yo-Yo, and the poor guy turned purple."DeVore is one of the world's foremost authorities on the Ju/Wasi (the name means "the proper people"), a subgroup of the hunter-gatherers known as the Bushmen of the Kalahari, a desert region bordering Namibia and Botswana. The Bushmen became for young Ma a revelation, even something of an obsession, and the urge to visit them tugged at him for 20 years until he finally acted on it, in one of the quests we'll return to. "Was I an influence?" asks DeVore. "The only influence I had was playing some music and talking about the Kalahari, and he sucked that right up. Or perhaps it was just touching my garments."Ma laughs appreciatively when I repeat this to him. "Harvard got me going on all kinds of searches," he says. "And Harvard was also the first community where I lived with people who were not specialized music people. On the musical, intellectual, and social level, I lived with and was the audience. I played everything and everywhere: in the Holmes Hall living room, in the Currier House senior common room, Eliot House, Lowell House, the HRO, the Bach Society. Someone in class would say, 'I've written a piece; do you want to play in it?' Sure, why not? Or 'So-and-so needs someone to play in that musical,' or in the orchestra for the Gilbert and Sullivan. This was a real community. I am so glad I didn't opt for a music school."Often," he continues, "I meet young people getting really involved in music early. You know, the child-prodigy syndrome. Based on my own experience, I tell these kids and their parents: 'Remember that what you do between the ages of, say, 12 and 21 is creating your emotional bank account. You'll be withdrawing from that account the rest of your life, so make sure you put in stuff that really counts. If you do nothing but tour during those years, if you are center stage from concert hall to hotel to limo rides to the airport, that is what you will be withdrawing from because that is all you'll know.'" And competitions? He laughs. "Are you kidding? I lost every competition, except once when I was five. Today, I won't even be a judge. I'm against them." It was when he was five that Yo-Yo Ma, the archetypal child prodigy, played his first public concert, at the University of Paris. He played both the piano and cello, including the prelude to the second Bach suite for unaccompanied cello. Ma's father, Hiao-Tsiun Ma, a violinist and a professor at Nanjing University, had left China for Paris in 1936. His mother, Marina, a singer from Hong Kong and former student of Hiao-Tsiun's, emigrated to Paris in 1949, where she and Hiao-Tsiun were married. In 1955, Yo-Yo was born. Some years ago, he told interviewer David Blum that "Yo," which in Chinese means "friendship," was the generational character chosen for him and his sister, Yeou-Cheng '73, M.D. '77, now a violinist and pediatrician, who is four years older than he. "With me," he said, "they seem to have got lazy and been unable to think of anything else, so they added another Yo."His father, he says, "was the pedagogue of the family, very strict. I was born when he was 49, so he was an older parent, very old-world. He loved painting, and himself studied musicology, composition, and violin in Paris." Hiao-Tsiun tutored Yeou- Cheng and Yo-Yo in French and Chinese history, calligraphy, and, of course, music. Each day, Yo-Yo had to memorize two measures of Bach; by the time he was four he was already playing a Bach suite. He was sent to study with Michelle Lepinte; Yeou-Cheng was accepted for violin study with Arthur Grumiaux.At about this time, an important friend and advocate entered Ma's life in the amiable person of violinist Isaac Stern. "When Yo-Yo was about six," recalls Stern, "a good friend of mine, a luthier in Paris, Etienne Vatelot, said to me, 'You know, there's this young Chinese boy that you must hear.' I went to listen to him, six years old, and the cello was larger than he was. It was extraordinary. Not a professional setting, he was very much a student. His father was extremely careful about that." Stern was to be invaluable in helping the family get established when they immigrated to the United States.This move took place when Yo-Yo was seven. "After 27 years in Paris, my father brought our whole family over to the States. Not an easy thing. The reason was that he wanted to convince a brother of his not to move back to China." (Ma's mother currently lives in New York; his father died in 1991. His last request was that his son play the sarabande from the Bach fifth suite at his bedside.)"I went to several different schools in New York," says Ma: "Trent, L'Ecole Française, where my father got a position teaching music, and Trinity, a professional children's school." In 1962 his father founded the Children's Orchestra Society. Still operating under the direction of Ma's sister and her husband, Michael Dadap, it offers the students coaching, theory, and performance opportunities with celebrated soloists--like Yo-Yo Ma.In New York, Ma continued his cello studies with Janos Scholz. Soon, the ever-watchful Isaac Stern buttonholed his friend, the great American cellist Leonard Rose. "I said, 'Lenny, you have to teach this boy,' and Yo-Yo played for him, and of course he instantly took him. He studied with Lenny for many years in the Juilliard precollege program. Everybody noticed that extraordinary talent, not only his astonishing memory and his virtuosity, but his natural feel for being on stage, the way most people feel in their old clothes with a beer in their living room. The stage for him is the same thing as home. Anyway, he started to play publicly, and I suggested him to several conductors. They would engage him on the spot and re-engage him after the first concert."Shortly after arriving in this country, Yo-Yo and his sister had played at a fundraiser in Washin'''
