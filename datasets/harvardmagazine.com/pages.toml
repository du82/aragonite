["https://harvardmagazine.com/2025/03/harvard-fas-academic-concerns-trump-policies"]
title = "It’s Academic (and Other Harvard Concerns) | Harvard Magazine"
description = "The Faculty of Arts and Sciences focuses on class attendance, grades—and wider worries about “uncomfortable” threats to academia."
full_description = "University News | 3.5.2025 It’s Academic (and Other Harvard Concerns) The Faculty of Arts and Sciences focuses on class attendance, grades—and wider worries about “uncomfortable” threats to academia. by John S. Rosenberg John Harvard, and the Faculty of Arts and Sciences administrators who work behind him in University Hall, have plenty to think, and worry, about these days. | PHOTOGRAPH BY NIKO YAITANES/HARVARD MAGAZINE const trinityScript = document.createElement('script'); trinityScript.setAttribute('fetchpriority', 'high'); trinityScript.src = 'https://trinitymedia.ai/player/trinity/2900016010/?pageURL=' + encodeURIComponent(window.location.href); document.currentScript.parentNode.insertBefore(trinityScript, document.currentScript); A back-to-basics Faculty of Arts and Sciences (FAS) meeting on March 4 focused on core academic concerns: students’ obligation to attend and pay attention to their classes, and slightly more rigorous grading options for their required course work. Those deliberations preceded matters that likely loomed larger for most attendees, to be discussed during an in camera briefing with President Alan M. Garber (as provided for by the faculty’s new rules for its formal meetings).There is plenty to worry about, given the Trump Administration’s efforts to curtail federal reimbursements for the costs of research (and the associated, de facto suspension of new grantmaking); sweeping new federal guidance limiting diversity programs and policies; legislative proposals to significantly increase the tax on endowment income (by far Harvard’s largest source of operating revenue); and a U.S. Department of Justice investigation of this and nine other institutions for “incidents of antisemitism” (accompanied, the Crimson reports, by threats to sue the schools and choke off funding generally).The anodyne announcement of FAS’s Faculty Council meeting for February 26 posted on the Harvard Gazette noted that the matters discussed included “presentations on the University’s finances and on its public affairs”—surely an heroic understatement. The faculty as a whole and the president no doubt had lots to talk about in their March 4 meeting.Indeed, in her introductory remarks, FAS Dean Hopi Hoekstra told colleagues the current moment is “a time of uncomfortable uncertainty” amid executive orders affecting higher education, challenges to same in the courts, sweeping new guidance on diversity from the U.S. Department of Education, and more. “We need to prepare for significant financial challenges,” she continued, building “financial capacity” by finding ways to reduce expenses and enhance revenues. The faculty as a whole, she said, is already in a “structural deficit”—perhaps a reference to further declines in unrestricted reserves, continuing the trend reported last autumn in the fiscal year 2024 results. (Given that tuition and fees, once a principal source of unrestricted cash, are no longer growing after accounting for the costs of financial aid, and the Corporation’s decision to constrain the endowment distribution for this fiscal year, Hoekstra’s general remarks might be signaling something more significant. That is especially the case as FAS continues heavy capital spending on House renewal and other projects, and strives to keep up with peer institutions that are aggressively increasing financial aid.)The news on the evening of March 4 that the Trump administration is proposing to “stop work” on $51 million in existing contracts with Columbia, and to review all forms of federal support to that university, “in light of ongoing investigations for potential violations of Title VI of the Civil Rights Act” (i.e., even before findings that such violations of law in fact occurred), further darkened the fiscal and political context for Hoekstra’s remarks. There are indications that the “additional measures” being directed at Columbia are part of a wider set of actions that may well include Harvard, as the Trump administration pursues institutions that it feels have not stopped antisemitic acts on their campuses.Coming to ClassesThe recommendations of the Classroom Social Compact Committee (CSCC) to change some of the language in the Harvard College Handbook for Students, first presented at the previous FAS meeting (held February 4), met with support. The language is intended to underscore the importance of taking course work seriously; doing so in a spirit conducive to vigorous exchanges of views; and protecting the confidentiality of students’ participation in such exchanges. (See “‘Hard Truths’ about Harvard’s Classroom ‘Compact’” for a full report.)Because that matter was deemed substantive under FAS rules, a vote on the proposed legislation could not occur until the March 4 meeting. Introducing the subject for its second debate and voting, CSCC co-chair Maya Jasanoff, Coolidge professor of history, noted the external context and characterized the CSCC recommendation as an “ethical stand”: an important way of highlighting “the value of intellectual engagement and the pursuit of knowledge” at a time when that work is under considerable challenge. The CSCC final language for the faculty’s consideration reads as follows:A Harvard College education is defined by the pursuit of knowledge. The classroom forms the center of a Harvard College education, and students are expected to prioritize their coursework.Academic excellence requires students to participate in a thoughtful, candid, and free exchange of ideas. A successful classroom depends on student attendance, attentiveness, and active intellectual engagement. Students should approach learning with curiosity, intellectual openness, respect for new ideas and for other people’s perspectives. Students should expect regularly to encounter evidence, analysis, interpretations, and opinions that challenge their point of view. Student speech, assignments, and exams can be evaluated by instructors as factually incorrect or poorly argued, for example—but a student’s status in a course, including their grades, will not be affected by their political or ethical point of view.As a default, no member of a course—instructors or students—should post on social media (or share information that enables others to post) identifiable student classroom statements without written consent. Likewise, class participants should assume that, while they may discuss classroom conversations outside of class, they may not attribute ideas to a specific student without that student’s written consent. Confidentiality policies do not override Harvard’s Non-Discrimination, Anti-Bullying, & Other Professional Conduct Policies.The proposal was adopted by voice vote.Grading for Gen Ed, and BeyondNew proposals introduced for discussion today (and possible enactment at a subsequent FAS meeting) would send a further signal to undergraduates about taking their academic requirements seriously, in two ways:•The option to take one of the required four General Education courses pass/fail would be eliminated; beginning with the class of 2029, all four courses would be required to be letter-graded.•The option to take the required Quantitative Reasoning with Data (QRD) course pass/fail would be eliminated; it too would be mandatorily letter-graded beginning with the class matriculating this August.Data presented by the Standing Committee on General Education show that during the past five academic years, “the increase in undergraduate students taking General Education courses Pass/Fail has outpaced both the academic divisions and the College as a whole.” Although the number of College students taking courses pass/pail has increased only slightly from 3 percent to 4 percent, the proportion of those opting to take Gen Ed courses ungraded has nearly doubled, from 6 percent to 11 percent.The rationale for permitting a pass/fail election was to encourage students to explore intellectually. But the committee now concludes that “has not actually resulted in students exploring new academic areas in which they might feel less confident, and has ended up instead adversely impacting the overall learning experience for students in lectures, sections and labs.” Student members of the committee echoed these concerns. Faculty members who teach the courses (meant to be flagships of the College curriculum, important to students’ broadened undergraduate experience) “have voiced concerns about both absenteeism and disengagement in post-semester reflections, and some students have complained about these” effects in their course evaluations. The fact that a significant number of Gen Ed courses now have 20 percent or more of those enrolled opting for pass/fail status (and a few as many as 40 percent) was apparently significant enough to raise alarms.Presenting the proposal to the faculty, Gen Ed committee co-chair Fiery Cushman, professor of psychology, said students’ increasingly casual attitude toward some of their courses meant that rather than being the “crown jewel” of their education (as many professors teaching the classes perceive it), many undergraduates have come to see them as a set of requirements to be gotten out of the way as painlessly as possible. Even though faculty members sought to secure letter grading, he perceived an “externality” problem: the spread of pass/fail enrollment elsewhere put pressure on still more courses and instructors to be permissive.Accordingly, “To increase the rigor of General Education courses and the engagement of all enrolled students,” the committee unanimously decided in May 2024 to propose mandatory letter-grading for such classes. That proposal, endorsed by all but one of the 160 faculty members offering Gen Ed instruction, is the one brought forth on March 4. (For transitional purposes, students now enrolled—i.e., those through the class of 2028—are grandfathered under the old rules and may still elect to take one Gen Ed course pass/fail, with the instructor’s permission. And under the new rule, if adopted, any student exploring an intellectual interest by taking a course not for Gen Ed credit may still ask permission to enroll in that course on a pass/fail basis.)Comments from the floor were supportive, some strongly so. One faculty member said that among students opting for pass/fall status, “The amount of work they do drops precipitously.” That, another said, “does change the experience of Gen Ed courses for everybody.” Still another, a former Gen Ed committee co-chair (who met individually with each student requesting pass/fail status to determine the reasons for such requests), said it was “dispiriting” to find course evaluations containing remarks such as, “Why does she take it so seriously? It’s only a Gen Ed class.” Having decided to deny pass/fall status completely this academic year, she said, other students told her the result was “refreshing,” with no distraction from peers who were not taking the course seriously. The result, she said, was to “increase intellectual vitality,” consistent with the CSCC legislation and other FAS actions, and to refocus students’ “attention on the mission of this program”: to prepare them for grappling with the larger challenges they will face as future citizens, rather than simply deepening knowledge of a field through their concentration courses. “If students pay attention,” she said, “they will be rewarded.”The QRD requirement, enacted in 2019 alongside the current Gen Ed curriculum, also permitted students to elect pass/fail or satisfactory/unsatisfactory enrollment with permission (a deviation from the letter-graded Empirical and Mathematical Reasoning component of the prior Gen Ed program). In parallel with the proposal for all-letter-graded Gen Ed courses, the faculty also heard a proposal that the QRD course requirement be satisfied only with letter-grading. Professor of the practice in statistics Joseph K. Blitzstein presented the recommendation and noted its fit with the faculty’s interest in underscoring intellectual rigor, its rules on other required courses, and the pending Gen Ed proposal. As the QRD committee put it:In recent years, the Office for Undergraduate Education has been highlighting the importance of re-centering academics and increasing rigor in the classroom experience.…[R]equiring the QRD requirement to be fulfilled with a letter grade is in line with these goals. At present, the Harvard College writing requirement [Expository Writing] and language requirement must be completed with a letter grade, and a proposal to require letter grades for courses taken toward satisfying the General Education requirement is under consideration [as discussed above]. It would therefore be consistent with other College requirements if the QRD requirement were treated similarly.Those logistical equities aside, the QRD committee had interesting things to say about student preparation and the rigor of their education (emphases added):The multifaceted, interdisciplinary nature of the QRD requirement provides an additional reason that therequirement should be fulfilled with a letter grade. The QRD requires that a single course include mathematical, computational, and statistical methods, as well as exposure to critical thinking about data. In practice, as the QRD committee has observed…very few QRD-certified courses contain all three of these components to a significant extent. Anecdotally, faculty have expressed that incorporating these wide-ranging elements into a QRD class has become increasingly difficult as the level of overall quantitative readiness among admitted students to Harvard College has dropped in recent years.As a result of these factors, most QRD courses may have only minor exposure to one of the three methods. While this is acceptable—the committee does not expect a QRD course to comprise equally all three domains—it does have unique implications when considering grading basis. In many QRD courses, a student could easily skip all of the exercises pertaining to one or two of the methods, and still easily meet the bar for obtaining a passing or satisfactory grade. Requiring that the QRD requirement be fulfilled with a letter grade would remove this loophole and would help ensure that student learning is better aligned with the intent of the QRD requirement.…The committee does acknowledge that taking a QRD course for a letter grade might feel daunting to some [small share, estimated at 10 percent] of students. However, we also recognize that such students, who may be less quantitatively inclined, are the very individuals who arguably stand to gain the most from taking a single QRD class in a rigorous capacity, pushing them beyond their intellectual comfort zones and cultivating skills that they may not encounter elsewhere in their coursework. If we believe in the value of the QRD requirement for all students, then we aspire for all students to graduate having truly met that bar.Again, the new language, if adopted, will a"
