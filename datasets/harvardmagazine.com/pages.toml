["https://harvardmagazine.com/about/faq"]
title = "Frequently Asked Questions | Harvard Magazine"
full_description = '''Frequently Asked Questions Jump to Section:Contact | Subscriptions | Advertising | Classified Advertising | Archives | Fundraising | Emails | My Account | Directions | Policies ContactQ: How do I submit a letter to the editor?A: Harvard Magazine welcomes letters on its contents. Please send via e-mail to yourturn@harvard.edu. You may also send your letter via U.S. mail to "Letters," Harvard Magazine, 7 Ware Street, Cambridge MA 02138, or via fax to 617-495-0324. Letters may be edited to fit the available space.Q: How do I submit a class note?A: Use our class notes webform or send your note to classnotes@harvard.edu. You can also write to "The Classes," Harvard Magazine, 7 Ware Street, Cambridge MA 02138, or via fax to 617-495-0324. (Please note: We welcome wedding and birth announcements, but do not report engagements or pregnancies.)If you want your class note to appear only in the print edition and not on the website, please specify that in your submission. Announcements that appear on the website can be viewed only by registered users with a Harvard Magazine account. Print-edition deadlines are November 1 for the January-February issue, January 1 for March-April, March 1 for May-June, May 1 for July-August, July 1 for September-October, and September 1 for November-December.Q: Who is eligible to submit a class note?A: Harvard Magazine publishes news sent in by alumni and alumnae of Harvard and Radcliffe Colleges and their class secretaries, and news from alumni and alumnae of the Graduate School of Arts and Sciences. We also publish information from press releases about these alums that are sent to our office.Q: How do I submit an obituary?A: You can use our obituary webform or send an e-mail to obituaries@harvard.edu. You can also use U.S. mail ("Obituaries," Harvard Magazine, 7 Ware Street, Cambridge MA 02138), or fax 617-495-0324. Please specify "print only" if you do not wish the obituary to appear on the magazine website.Obituaries in Harvard Magazine are free of charge and written by the obituaries editor, Alexandra Grimm ’17. The information you provide will be used as a basis for the obituary, but not reprinted verbatim. Please include contact information in case we need clarification or further information. Our obituaries customarily include the following: (1) date and place of death; (2) a brief summary of career; (3) interests, passions, hobbies, publications, honors, military service, or other distinctions the alum would have liked to see mentioned; (4) the names of surviving spouse or partner, if any (including maiden name); and of children, parents, siblings, and grandparents.The magazine prints obituaries principally for alumni/ae of Harvard and Radcliffe Colleges, and for alumni/ae of the Graduate School of Arts and Sciences whose family or friends request a notice. Alumni of the professional schools alone (law, medicine, education, design, etc.) receive an edition of Harvard Magazine that does not include obituaries, so unless there is a specific reason for publishing an obituary for a professional school alum, families of those alumni will do better to submit obituaries to the alumni publications of the appropriate professional schools.Q: How can I submit information about my new book to Harvard Magazine?A: Please send information to john_rosenberg@harvard.edu. Review copies should be sent to the attention of John Rosenberg, Harvard Magazine, 7 Ware Street, Cambridge MA 02138. Please note the author's Harvard affiliation and class year if possible.During an average two-month period, the magazine receives several dozen to several score books by alumni/ae and faculty members from throughout Harvard. From those, we select, typically, eight to twelve titles, aiming for those that might be overlooked, that might have some particular Harvard content or angle, and that will, collectively, make an interesting mix of subjects, perspectives, etc. We then write up the columns or page that readers see. Thus we sort from what we have, try to serve readers, and prepare our coverage. The volume of material makes it impossible for us to guarantee coverage, and in fact we get to only a small minority of eligible titles. Those books we cannot cover that are written by graduates of the College or the Graduate School of Arts and Sciences are mentioned in our class notes; those by faculty or alumni/ae of other schools need to be submitted to those schools' separate alumni publications.Q: Can I write for Harvard Magazine?A: Harvard Magazine is an alumni publication for the graduates, faculty, and staff of Harvard University. Its contents are about the extended Harvard community—research, teaching, and the lives of community members. Accordingly, story ideas not strongly related to Harvard are unlikely to be right for the magazine. In addition to a small staff of writers and editors, who produce a significant proportion of the contents, we hire freelance writers for most sections, and assign illustrations and photography for each issue.To understand the magazine's mission and approach to serving its readers, the best guide is always the contents of recent issues, which are available online at this website. Note that as a bimonthly publication, we work with very long lead times: for feature articles, six months before the cover date is a typical minimum lead time, and much longer is not unusual; shorter pieces (Right Now and Montage articles) typically proceed more quickly. But submissions aimed at inclusion in an issue dated a month later are always too late, as the magazine is already in advanced stages of production by then.If you have a proposal for an article, please submit a query by email to john_rosenberg@harvard.edu, or mail it to John Rosenberg, Editor, Harvard Magazine, 7 Ware Street, Cambridge MA 02138. Telephone calls invariably require more detailed follow-up, so the editors strongly encourage beginning with a detailed written query.Such queries should explain the proposed subject and why it is of interest; outline the proposed treatment (who will be interviewed or what materials will be covered, at what likely length for the finished article, for what section if relevant, on what timeline, etc.); and, for writers not previously known to the editors, should be accompanied by samples of published work comparable in approach and scale to the idea being proposed. The magazine does not encourage simultaneous submissions elsewhere. The query mechanism is essential, because as a bimonthly magazine working much in advance of publication, we may already be working on the subject you wish to propose—so submitting a query is designed to protect you from the disappointment of submitting a finished article only to discover that it duplicates a piece already under way.The magazine's contents are principally journalistic. Faculty opinion pieces, published in "Forum," are exclusively assigned internally. Although the magazine occasionally uses personal essays or humor, such pieces are necessarily subject to evaluation of the executed piece and cannot be assigned on a guaranteed basis. Because of limited space and the constraints of readers' interest, the magazine does not generally have room to publish personal recollections about an individual's college experience, and does not seek remembrances about deceased individuals beyond those published in the obituary notices.The art director can review submissions of work by photographers and illustrators; direct portfolios by jennifer_carling@harvard.edu.Q: How do I contact a member of the Harvard Magazine staff?A: See a full list of magazine staff members, with e-mail addresses, here.Q: How do I contact someone who was mentioned in Harvard Magazine?A: The University closely protects the privacy of its students, and does not make their e-mail addresses available to those without a valid Harvard ID number. However, the public listings in the University directory do contain e-mail and phone number for many faculty members. If you can't find the faculty member you're looking for, a Web search of the person's name along with the word "Harvard" often turns up his or her Harvard faculty webpage.If you are looking for a Harvard graduate, the Harvard Alumni Association website allows alumni to send messages to other alumni. And if all else fails, try getting in touch with the author of the article; see our staff list for contact information.Back to topPrint Magazine Questions and SubscriptionsQ: How do I subscribe or renew my print subscription to Harvard Magazine?A: Use our print subscription webform or contact harvard_magazine@harvard.edu.Q: I am an alum who lives outside of the USA. How do I receive the print copy of Harvard Magazine?A: Alumni living outside of the USA have access to the PDF replica of the issue and have the option purchase a paid print subscription. Please use our print subscription webform or contact harvard_magazine@harvard.edu if you have any questions.Q: How do I give a gift print subscription to Harvard Magazine?A: Use our gift print subscription webform or contact harvard_magazine@harvard.edu. Q: How can I stop receiving duplicate print copies of Harvard Magazine?A: Please contact harvard_magazine@harvard.edu.Q: How can I cancel my print subscription or drop my name from Harvard Magazine's print mailing list?A: Please submit your request to harvard_magazine@harvard.edu.Q: How do I change my address for the print magazine?A: If you are an alumnus or alumna of Harvard University, send an e-mail to haa_alumnihelp@harvard.edu.If you have a paid print subscription to Harvard Magazine, please send your new address to harvard_magazine@harvard.edu.If you are a current or retired Harvard University faculty or staff member, contact the University benefits office at 617-496-4001 or benefits@harvard.edu.Q: My print copy of the magazine doesn't have class notes or obituaries. How can I receive these sections?A: Alumni and alumnae of the Harvard professional schools who wish to receive Harvard Magazine's class notes and obituaries sections should contact harvard_magazine@harvard.edu, who will verify their University affiliation(s) and then process their requests. Q: My print copy of the magazine does not contain the regional section, Harvard2. How can I receive that section?A: To save the magazine paper and postage costs, the regional section, Harvard2 is mailed only to readers living in New England. All articles in the section, however, are readily accessible on the magazine's website.Back to topAdvertisingQ: Are your rates gross or net?A: All print and digital rates posted are net.Q: Do you offer trade, nonprofit or HSBA discounts, or added value?A: Harvard Magazine does offer a variety of discounts to our print advertisers. Please feel free to contact us to learn more.Q: Is there a way to reach only those readers living in New England?A: Yes! Harvard Magazine's Harvard2 section is specifically designed to reach only our New England audience. We offer a separate rate card for this section.Q: Does my ad reach the same audience in print and online?A: Harvard Magazine's print product is the only way to reach all Harvard alumni in one place. Our digital products are available for anyone to read and enjoy.Q: How can I place a classified ad?A: Find the answers to some of the most frequently asked questions about classified advertising here—or click here to place your classified ad or call 617-496-6686.Q: Do you have an editorial calendar?A: Harvard Magazine covers news, research, and the alumni of Harvard who are making a difference in the world. Because new developments occur constantly, we do not have a concrete editorial calendar. We can, however, give you a general idea of what we might cover in our New England section, Harvard2, given the season. And we can provide you with more detailed information about a particular bi-monthly issue a month or two before it goes to press; please contact bob_fitta@harvard.edu to learn more.Q: When is the next deadline?A: Deadlines to reserve print advertising run 45 days in advance of the next bi-monthly issue (i.e. the space reservation deadline for the September-October issue is July 15). Click to downoad a media kit with a planning calendar.Back to topClassified AdvertisingFind the answers to some of the most frequently asked questions about classified advertising here.Back to topArchivesQ: How can I purchase a back issue?A: Please contact harvard_magazine@harvard.edu.Q: Which issues of Harvard Magazine are available online?A: The website has back issues dating from September-October 2001; you can access them at https://www.harvardmagazine.com/past-issues . PDFs of past issues and articles are no longer available.Q: What if I need something from an older issue?A: To locate articles from issues predating September-October 2001, e-mail archives@harvardmag.com or write to Archives Search, Harvard Magazine, 7 Ware Street, Cambridge MA 02138.Q: If I'm unable to find what I'm looking for, is anybody available to help?A: Phone Harvard Magazine at 617-495-5746, then press #4 and #1, to leave a message on the editorial department voice mail, which is checked each business day. A staff member will try to assist you within five business days (sooner, if possible).Q: Can I reprint an article, or portion of an article, that appeared in Harvard Magazine?A: In most cases, the magazine or the author hold copyright to article text, and the text (or portions thereof) cannot be reprinted without permission. Please send all inquiries about reproduction to permissions@harvardmag.com, telling us how many copies you need and how you will use them. (There is usually no fee for one-time educational use.) If the article is to be included in a book, please give print run, price, and publisher. If you have additional questions, call 617-495-5746.Q: Can I reprint a photograph or other image that appeared in Harvard Magazine?A: No, reproduction of images is not allowed. All rights for artwork that appear in the magazine and online belong to the artist. Harvard Magazine can provide you with contact information for the photographers and illustrators who contribute to the magazine; please call 617-495-5746.Back to topFundraisingQ: How is Harvard Magazine funded?A: Harvard Magazine raises two-thirds of its operating revenue from reader contributions and advertising; the remaining one-third is a subsidy from the University.Q: How is the money spent?A: The contributions from readers pay for author and artist fees, and for editing, designing, and preparing the contents of each issue for publication in print and online.Q: What is editorial independence? What is Harvard Magazine's relationship with Harvard University?A: The magazine was founded independently by alumni more than a century ago, and is published today by a separately incorporated nonprofit affiliate of Harvard University. We have excellent access to University news and news sources, but are written, e'''
