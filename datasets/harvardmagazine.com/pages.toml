description = "How Galileo’s geometric and military compass helped him calculate his own ascent"
full_description = "CAPTION TEXT HERE | Photograph © Collection of Historical Scientific Instruments, Harvard University Treasure Scientific Stardom How Galileo used a simple tool to shape his fame and fortune by Nina Pasquini March-April 2025 const trinityScript = document.createElement('script'); trinityScript.setAttribute('fetchpriority', 'high'); trinityScript.src = 'https://trinitymedia.ai/player/trinity/2900016010/?pageURL=' + encodeURIComponent(window.location.href); document.currentScript.parentNode.insertBefore(trinityScript, document.currentScript); Before Galileo Galilei turned his telescope skyward, he had already begun to burnish his reputation on the ground with another invention: a geometric and military compass. He began work on the device—known today as a sector, with two legs and a plumbline—in the 1590s. The concept already existed, but Galileo vastly improved the basic design by adding extra scales for greater precision and versatility. His version could be used by artillerymen to determine the cannon angles needed to hit certain targets; it could also be deployed quickly to calculate other proportional measurements, like cube roots and compound interest. Detail of the compass | Photograph © Collection of Historical Scientific Instruments, Harvard University His compass became “a tool of power,” says professor of the history of science Hannah Marcus: it turned Galileo into “one of the first celebrity scientists.” He sold roughly 100 of them; he also wrote and published a manual of sorts in 1606. But he left out key details, Marcus says: “You can’t really figure it all out from the manual.” So those who wanted to learn how to use the compass paid for private lessons—a side job that earned Galileo three times his salary as a mathematics professor at the University of Padua. Marcus summarizes: “He’s getting rich off of this thing.” Detail of the compass | Photograph © Collection of Historical Scientific Instruments, Harvard University The device also served to advance Galileo’s ambition. The compass shown—on display at Harvard’s Collection of Historical and Scientific Instruments, which Marcus directs—features the coat of arms of the Gonzaga family. In 1604, Galileo gifted this compass to Federico II Gonzaga, Duke of Mantua, likely in an attempt to curry favor and secure a court position. This act foreshadowed a similar one in 1610, when he presented his newly invented telescope to the Medici family—ultimately earning him the title of court philosopher and mathematician. “The big innovation here,” Marcus says, “is the way that he’s using this instrument, his own personal expertise, and [the medium of] print to manage his own fame and access to scientific knowledge.”The story of the compass illuminates a lesser-known chapter of Galileo’s life—and serves as a reminder that even history’s greatest minds understood the art of branding. Long before his name became synonymous with the heavens, Galileo was busy calculating his own ascent, one proportion at a time. Click here for the March-April 2025 issue table of contents Read more articles by Nina Pasquini Sub topics Science & Technology Social Sciences Humanities & Arts Museums & Collections Advertisement You might also like It’s Academic (and Other Harvard Concerns) The Faculty of Arts and Sciences focuses on class attendance, grades—and wider worries about “uncomfortable” threats to academia. Crypto—To Regulate or Not? The former director of Harvard’s fintech lab reflects on the future of digital assets. Caring for Your Heart Harvard panel on advances in cardiac risk assessment, diagnosis, and treatment Most popular Teen Grind Culture Teens need better strategies to cope with lives lived partly online. Social Media Use and Adult Depression A survey reveals suprising links between social media use and depression in adults. Caring for the Caregivers What it's like to look after a loved one with dementia Advertisement Explore More From Current Issue Right Now Is Gambling Becoming a Public Health Crisis? Responding to the explosive growth of online gambling and sports betting, a new report urges governments to regulate with public health in mind. Harvard Squared The New Boston Athenaeum Find “the joy of discovery and power of this unique place.” Features A Contentious Era for U.S. Higher Education President emeritus Neil L. Rudenstine on changes in the academy and society that made universities more contentious—and diminished support for humane learning"
