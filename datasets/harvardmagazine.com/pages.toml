full_description = "On the Cover: Illustration by Richard Mia Download PDF Issue Letters Cambridge 02138 Correspondence about caregiving, football, feminism, free speech, and more At Risk Severe threats to Harvard’s finances—and academic mission—in the new political landscape March-April 2025 On the Cover: Illustration by Richard Mia Download PDF Issue Features Safe Streets Working to curb road deaths by Max J. Krupnick Walter E. Fernald From enlightened care for the intellectually disabled, to eugenics, and back by Alex Green The Unruly Academy President emeritus Neil L. Rudenstine on changes in the academy and society that made universities more contentious—and diminished support for humane learning by Neil L. Rudenstine Making Schools Work Tom Kane deploys data to help improve education. by Nina Pasquini RIGHT NOW Harvard research and ideas Teen Grind Culture Teens need better strategies to cope with lives lived partly online. The Green Star State Cheap renewable energy could position Texas to become a major producer of clean hydrogen fuel. Governing Games of Chance Responding to the explosive growth of online gambling and sports betting, a new report urges governments to regulate with public health in mind. John Harvard's Journal University news Allston Ambitions Harvard presents its 10-year plan for institutional development in Allston. Arts and Engineering The deans of arts and humanities and the school of engineering and applied sciences share their plans and priorities. Yesterday’s News From the pages of the Harvard Alumni Bulletin and Harvard Magazine Daria Schneider A coach restores the luster to Harvard fencing. Faculty Room Facelift Reimagining an iconic space to reflect the Harvard community more comprehensively News in Brief President Garber’s private installation, settling antisemitism suits, challenging institutional neutrality, and more Montage Books, creative arts, performance, and more Harvard Sculptor Justin Peyser Probing the concepts of territory and sanctuary. On Unintended Consequences Essayist Edward Tenner on technology’s pitfalls Banned in Sparta Millennia-old Greek lyrics ring out again in twenty-first-century pop music. Leslie Jamison’s Many Selves The essayist on isolation, empathy, and selfhood Off the Shelf Artmaking under duress, designing the UN HQ, Booker White’s blues, and more Cruel and Unjust A legal scholar’s harsh assessment of the Supreme Court’s rulings on crime Harvard SquaredWhat to do in Boston, Cambridge, and beyond The New Old Boston Athenaeum Find “the joy of discovery and power of this unique place.” Birding, Dancing, Cooking… Celebrating the season with the Trustees Emerging Maine Artists Works by young artists at the Portland Museum of Art See past Harvard Squared content University People Harvardians far and wide Mitigating Global Threats U.S. Navy vice admiral on the frontlines at NATO Overseer and HAA Elected Director Slates This year’s governing board and alumni association candidates Music and Medicine Toussaint Miller explores the healing power of art. Harvard University’s 374th Commencement Excercises Commencement and Alumni Day schedules AI Anxiety The Undergraduate on the uneasy collision of technology and writing Defeating the Darkness After decades of mystery, a family reunion The College Pump Origin Stories An admissions odyssey, the search for “Casey,” and a Harvard legislative legacy Treasure Scientific Stardom How Galileo’s geometric and military compass helped him calculate his own ascent For Alumni The Classes Harvard alumni may sign in to view class notes and obituaries."
