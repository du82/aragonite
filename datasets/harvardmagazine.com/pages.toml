full_description = "Directions to 7 Ware Street View interactive Google mapDirections from:West of BostonSouth of BostonNorth of BostonNorthwest of BostonLogan Airportvia public transportationHarvard SquareBoston via Massachusetts AvenueParkingHarvard Magazine has one parking space available in the lot adjacent to our building. There are metered spaces on surrounding streets.From West of BostonTake the Massachusetts Turnpike (I-90) east to exit 18, Cambridge/Allston. This is a left exit. Bear right after the toll booth. Turn left after the lights but before the bridge onto Storrow Drive. Proceed about 1/2 mile to the Cambridge/Harvard Square exit. At the end of the ramp, turn right onto JFK Street. Continue following directions under Harvard Square.From South of BostonTake I-93 north to exit 26, Storrow Drive. Keep left on the exit ramp and take the underpass to Storrow Drive. Continue on Storrow Drive about 4 miles to the Cambridge/Harvard Square exit. Turn right onto JFK Street. Continue following directions under Harvard Square.From North of BostonTake I-93 south to exit 26, Storrow Drive. Keep left at the end of the ramp and take the underpass to Storrow Drive. Continue on Storrow Drive about 4 miles to the Cambridge/Harvard Square exit. Turn right onto JFK Street. Continue following directions under Harvard Square.From Northwest of BostonTake Route 2 East and follow until the highway ends. Bear right, but do not take the T garage exit. Continue through the lights, remaining on Route 2. You should pass the T station/garage on your right. Go over the bridge. At the rotary, continue on Route 2 East by taking the second exit. At the next rotary, take the first exit, and continue on Route 2. After the large intersection with Mt. Auburn Street, watch for signs to Memorial Drive. You will have to bear left to get onto Memorial Drive. At the first light, turn left onto JFK Street. Continue following directions under Harvard Square.From Logan AirportTake airport loop road to Sumner Tunnel exit. Go through tunnel, and exit to I-93 North. Continue following directions under From South of Boston.From Boston via Massachusetts AvenueFollow Massachusetts Avenue to Harvard Square. Continue following directions under Harvard Square. Note that the Out of Town newsstand will be on your left instead.Harvard SquareContinue through several sets of lights, and stay to the right as you are passing through Harvard Square. You should pass the Out of Town newsstand on your right. After the next light, the road will fork. Bear right and go through the tunnel. The road will fork again. Bear right, then take your third right onto Ware Street (after Starbucks.) Harvard Magazine is in a yellow wooden house on the right side of the street, 7 Ware Street. There is one parking space available in the lot next to the building. From Public TransportationTake the MBTA Subway Red Line to the Harvard Square station. Use the main exit, which is found at the far end of the platform (rear of outbound platform, front of inbound platform). Go upstairs and take a U-turn out of the exit. Walk up Massachusetts Avenue several blocks, against the traffic. At the fork where the wall surrounding Harvard Yard ends (Quincy Street Crossing), bear left onto Harvard Street. Ware Street will be the third street on the left, one street up from Prescott Street. Harvard Magazine is located at 7 Ware Street in a yellow house on the left."
