title = "A Contentious Era for U.S. Higher Education | Harvard Magazine"
description = "President emeritus Neil L. Rudenstine on changes in the academy and society that made universities more contentious—and diminished support for humane learning"
full_description = "Inside looking out: student protestor and Harvard police officer during the Mass Hall living-wage protest, April 25, 2001 | Photograph by Darren McCollester/Newsmaker/Getty Images Features The Unruly Academy On a contentious era for universities, and the struggle to sustain humane learning by Neil L. Rudenstine March-April 2025 const trinityScript = document.createElement('script'); trinityScript.setAttribute('fetchpriority', 'high'); trinityScript.src = 'https://trinitymedia.ai/player/trinity/2900016010/?pageURL=' + encodeURIComponent(window.location.href); document.currentScript.parentNode.insertBefore(trinityScript, document.currentScript); Neil L. Rudenstine, Our Contentious Universities: A Personal History, Copyright © 2025 The American Philosophical Society Press, excerpted with permission of the American Philosophical Society Press, c/o the University of Pennsylvania Press, www.pennpress.org. One fall day in 1967, Neil L. Rudenstine, Ph.D. ’64, a “recently minted assistant professor,” found himself walking by Mallinckrodt Hall, where a crowd of students had blocked the entry to impede the work of a Dow Chemical Company recruiter, on campus to interview job applicants. “I had never before seen a university disruption,” he writes, and was not much up to snuff on the emerging antiwar movement. But recognizing some of his graduate literature students among the protestors—and sensing a threat to the institution’s “fundamental values”—he stayed to debate with them. They ultimately disbanded, but foreshadowed many more, and far more disruptive, protests to come. Rudenstine, recognized for his role in that nonconfrontational outcome, began his own progress toward a life in administration (as dean of students and later provost at Princeton, his alma mater, and ultimately Harvard’s president from 1991 to 2001): a career that overlapped a tide of rising campus disruptions from those turbulent decades—beginning with Vietnam and extending through black and gay rights and representation, apartheid, and climate change—to the present confrontations over terrorism and war in the Middle East.Among many other virtues, his new memoir, Our Contentious Universities: A Personal History, is a sensible, calming account of the nature and implications of unruliness within the academy—its title a pitch-perfect example of Rudenstine’s careful diction, and very much of a piece with his worldview and character.It is no surprise that he mounts a vigorous, ringing reaffirmation of liberal arts, and of the humanities within the liberal arts. Perhaps more of a revelation, to those who don’t know Rudenstine’s academic leadership experiences well, is his perspective on the wider society and culture and their effects on universities. Also his institutionalism: on the differences, say, between a Princeton and a much larger university like Harvard.More broadly, he is astute in explaining why universities, places for ideas in contention, have become more contentious in the context of changes in society, and the parallel changes in the institutions themselves over time—their vastly expanded scope and scale, creating an increasingly complex and impersonal ethos—and the resulting challenges to leading such communities and sustaining their culture as places of learning.Two excerpts follow. The first, on the living-wage sit-in at the end of Rudenstine’s presidency, has valuable things to say about the nature of the Harvard community and the new era of protest that has been vastly magnified during the past couple of years (and about a modulated, academic way of responding to such demonstrations). The second presents broader reflections on what the evolution of higher education from liberal arts toward something much more instrumentalist has meant for universities and those they serve: what has been gained, and what lost—but perhaps not, one may hope, irretrievably. —The EditorsA New Age of ProtestsIn my eighth year as president—in 1999—a new issue (and what I began to believe was a new age) began to emerge among a number of students: the concept of a “living wage.” It was an issue that had already been raised and addressed…by several institutions. Moreover, in the Cambridge area, at least three townships had accepted the idea, and it seemed to many people that Harvard should adopt such a policy for its nonacademic workers.Part of the reason for the Harvard dispute arose from the fact that some of the less well-endowed professional schools had recently decided to “outsource” their janitorial services to private companies that could do the job less expensively….This helped to relieve the considerable budget pressures of some of the smaller underfunded schools. These actions (plus the fact that a committed group of students believed that Harvard paid many of its workers too little) led to a steady, growing, and more outspoken campaign on the living-wage issue.When I was asked my views, I said that the university should be seriously concerned about its pay scales, making certain that they were fair, but that I was not in favor of the concept of a “living wage” because it was…really impossible to define. In fact, the few local communities that had already endorsed the concept had arrived at completely different conclusions about the actual pay level that constituted such a wage. Some were noticeably lower (or higher) than others. That seemed completely irrational to me. If the issue were a minimum wage, that was eminently discussable, and if we were paying too little, we could find a way to raise the pay scale. Neil L. Rudenstine, plenty experienced in dealing with disruptions, onMay 25, 2000, upon announcing his planned retirement as Harvard’s president | Photograph by Jon Chase/Harvard Public Affairs and Communications My response was—I thought—a reasonable one, but it did not have any effect on those who were now publicly and more intensively committed to having Harvard adopt the new policy. Moreover, they demanded that the lowest-paid workers at Harvard should receive at least $10 per hour (which was a much more significant figure in the 1990s…). Most of our schools or units could well afford this (and paid it), but a few might face deficits if the new level went into immediate effect. Nevertheless, it was a reasonable—and definable—goal that we could at least address.The response of most of the university was revealing. I received hardly any letters or messages from faculty on the issue, although a large number of them later signed a full-page advertisement in the student newspaper, advocating adoption of the proposed new policy. Meanwhile, the main organized union on campus let it be quietly known to us that it would not support a student-led campaign: It had its own distinct agenda and concerns….I continued to feel confident, however, especially because so many Harvard workers were unionized, and we continued to have very good relations with the union leadership. Indeed, a survey of Harvard workers also revealed that more than 90 percent of them were already paid $10 or more per hour.Then, in the very last months of my final year as president, a group of students, led by Progressive Labor (and SDS) members, became more strident. One day they suddenly took advantage of our building’s open-door policy and entered en masse, taking over the ground-floor offices, setting up a “command-post,” and essentially filling most of Massachusetts Hall.I was taken totally off guard, and told our staff that we should continue with our work as much as possible. The students, however, were a different breed than I had known from my days at Princeton: This was mainly an angry and bold group and they paid…absolutely no attention to the plight of the Mass Hall secretaries, treating them rudely and impatiently. The irony of how they acted in the presence of “real” workers was not lost on us, and my assistant—Beverly Sullivan—quickly made her way through all our offices, warning the students to change their behavior. This actually had an effect, but did nothing else to alter the basic situation.Meanwhile, in part of the Yard (in front of our building), many students had begun to set up small tents, creating a kind of camp in support of their fellows inside. This complicated the entire situation, and the two groups communicated regularly by two-way radio. Food was brought to the protestors through our downstairs windows—something that we decided to allow.The entire action was far more organized, determined, and impervious than anything I had ever before encountered. I immediately convened all my senior staff, including the head of security. What were our alternatives?I began with two main points: We would not accept the idea of a “living wage,” and we would not call the police to break up the sit-in. The last thing I wanted was to emulate Grayson Kirk of Columbia [1968] or Nate Pusey of Harvard [1969] by having police batter students and throw the entire institution into turmoil…. That left us with two main options: Wait for the students to exit (because we were approaching the end of term, with exams and then graduation); or ask the courts to intervene, ordering the students to evacuate the building or be held in contempt.We did not come to a conclusion in our first session, but meanwhile the entire situation began to take on even greater proportions. The national leaders of two major unions flew to the university; the elected Cambridge City Council walked through Harvard Yard in a show of support for the students; and Senator Ted Kennedy made a statement, urging the students to continue, stating that Harvard should immediately adopt a living-wage policy.So the university had suddenly become a national target…: If Harvard changed course, that could help enormously to legitimize the living-wage policy, and other places would be pressed to follow suit. Our options…were suddenly much more complicated, with national union leaders and Ted Kennedy in the battle.I met with the labor leaders in a long, tense session. They were in one sense respectful, but there was no way that we could possibly agree. By this time, a few days had already passed. My senior staff and I had essentially reached the conclusion that we should wait until the sit-in eventually dissolved. Given the media interest, the national attention to the situation, the national union leaders, and the tent camp on the lawn, I was reluctant to bring in the courts, because there would almost certainly be riot police in attendance—with very unpredictable consequences. If even a few tent-camp students tried to interfere with the court officials or the police, the results could be disastrous. Meanwhile, some alumni and other hardliners were calling for police action and wondered why I did not forcefully move ahead.It turned out that the wait was very long, and stretched beyond one week into a second, and then beyond. Tempers flared on all sides, and several of us moved to offices outside the building to get our work done. The students showed no sign of being worried about their academic obligations, and I began to seriously doubt myself—wondering whether I had made a major mistake in not going to the courts. The tent camp outside grew larger and I made certain that our security guards would not attempt to physically remove or interfere with anyone who was there.… [W]hat had begun as a local sit-in was now a major public event.I decided not to change course, even though it was obvious that the students were far more committed and forceful than I had initially imagined. There was not much time before the end of term, however, and in spite of everyone’s growing frustration, it still seemed right to carry on as planned. I remembered that President Ed Levi of the University of Chicago had once waited out a 16-day sit-in, and that gave me a modicum of comfort!At that point, I was surprised to receive a phone call from Larry Summers, who had recently been elected to succeed me as president. Larry suggested that we should announce the creation of a faculty-led committee to study the entire living-wage issue over the course of the summer….This would provide a legitimate process to help resolve the issue, and I immediately agreed with him. The students would be given a form of victory, while I felt confident that a thorough examination of the issue would not lead—given the unpredictability of defining a “living wage”—to such a major shift in university policy. Outsourcing was a somewhat different issue, and could be dealt with on its own terms. But the living-wage matter…could now be addressed squarely in an orderly, probing way. Meanwhile, a superb committee was established, with University Professor Sid Verba, Tim Scanlon (from the philosophy department), Larry Katz from economics, and other equally thoughtful and exceptional people.Once the announcement of the planned committee was made public, the students felt victorious, leaving Massachusetts Hall to the cheers of their fellows outside. So my last sit-in ended almost exactly 30 years after my first one. That evening, Angelica [Rudenstine] and I were having a small dinner for some friends at home, and I arrived in good spirits. We had not called the police. We did not agree to the “living-wage” issue. There were no injured students. There would be an excellent committee in place.…The entire experience had in its way been harrowing, but the finale seemed to justify the “harrow,” despite the obvious difficulty of it all. Meanwhile, established disciplinary procedures would move ahead to hear the student cases.Looking back, I was struck again by the fact that the student protestors had remained steadfastly “detached.” They did not occupy any building related to the Faculty of Arts and Sciences but focused only on the president’s isolated domain. That in itself separated them from any direct relationship with (or influence from) their dean and his staff, quite apart from their teachers. In addition, they were…highly organized, with radio connections not only to other students but also to the media. In other words, they allowed themselves no real human contact that might influence them. No one in Massachusetts Hall, including myself, knew them personally. In all these ways, I felt once again that the scale of Harvard and the idiosyncratic nature of its structure made it difficult to try to build a university community or a unified single institution. If that were true in Cambridge, I thought, what must it be like at larger institutions—or at the “multiversities” described nearly four decades earlier by Clark Kerr [LL.D. ’58; first chancellor of Berkeley and then president of the University of California]?The sit-in was revealing in another way: It suggested that the future might involve…major societal problems (such as the wages of workers). A new era was awakening, and it was to be a time when various social issues would come into play—and into contention….Preserving Room for the "
