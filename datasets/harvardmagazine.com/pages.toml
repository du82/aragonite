 Billboards (open size 1800x450 >500kb, closed size is 1800x180 or shorter) with prior approval Accepted formats include third-party ad tags, HTML5, animated GIFs, plus all static formats such as GIF, JPEG, and PNG. File sizes should not exceed 400 KB without prior approval. Please remember to include your destination (click-through) URL and send all advertising materials to jennifer_beaumont@harvard.edu or call Jennifer Beaumont at 617-495-4268 with further questions. E-mail ads: For e-mail newsletters, we accept JPEG, GIF, and PNG formats. We do not accept animated GIFs or other Rich Media because it does not perform consistently across e-mail clients (Outlook, Apple Mail, Gmail, Yahoo, AOL, etc.). Materials may be forwarded to jennifer_beaumont@harvard.edu.'
