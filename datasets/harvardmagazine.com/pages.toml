full_description = '''Harvard Authors' Bookshelf Disclosure: Some of the links in this section are affiliate links. This means that, at zero cost to you, Harvard Magazine will earn an affiliate commission if you click through the link and finalize a purchase. Buy The Book The Leadership PIN Code Dr. Nashater Deu Solheim, HNI ’16 A unique and proven framework for negotiating and influencing in daily work. With 3 simple keys, you get what you need while also maintaining positive relationships. Buy The Book The Border Between Us Rudy Ruiz ’90, M.P.P. ’93 “Ruiz has written a poignant tale about an endearing underdog’s pursuit of the American Dream.”—Booklist. “A moving story of one family’s toil amid a cultural struggle, told with precision and authenticity.”—Kirkus. RudyRuiz.com. Buy The Book Valley of Shadows Rudy Ruiz ’90, M.P.P. ’93 “Ruiz’s engaging tale…is immersive and atmospheric. Ruiz deftly combines elements of romance, historical mystery, horror, and magical realism to deliver a richly satisfying adventure.”—ALA Booklist. RudyRuiz.com. Buy The Book Prologos Jonathan Bayliss ’47 Reviewers compare this groundbreaking novel to works of Sterne, Melville, Joyce, Broch, and Musil. Experimental, playful, richly detailed, serious fiction. Available in paper and electronic editions. www.drawbridgepress.com. Buy The Book The Upside of Inequality: How Good Intentions Undermine the Middle Class Edward Conard, M.B.A. ’82 Top Ten NY Times best-selling author Larry Summers: "A valuable contribution." www.EdwardConard.com. Available on Amazon, at local bookstores. Buy The Book Pericles and Aspasia: A Novel of Ancient Greece Yvonne Korshak ’58 “MUST-READ"—Publishers Weekly BookLife: “A stellar evocation of the golden age of Athens, rich with historical insight.” FINALIST Chaucer Award for Early Historical Fiction. Buy The Book The "Crime" of Francis Bacon Edgar Kemler, M.P.A. ’41 An informal biography of Francis Bacon, who was considered the father of the scientific method. It covers Bacon’s ascendance and fall from grace in the late 16th and early 17th centuries. The book is available on Amazon. Buy The Book Eva & Otto, Resistance, Refugees, and Love in the Time of Hitler Tom Pfister, J.D. ’73, and siblings Kathy and Peter True story about two Germans, one born Jewish, one born Catholic, whose courageous resistance against fascism was sustained by their enduring love. Buy The Book Einstein: The Man and His Mind Gary S. Berger ’64 Winner of multiple book awards. Deluxe edition visual biography captures the essence of the man whose thought and imagination transformed our understanding of the universe. An inspiring holiday gift. Buy The Book America's Fiscal Constitution: Its Triumph and Collapse Bill White ’76 A critically acclaimed history of how America limited use of debt to finance routine federal expenses, and how those limits quietly collapsed after 2000 and might yet be restored. Amazon. Buy The Book Revitalizing the World Trading System Alan Wm. Wolff ’63 One of Best Books of 2023-Economics. Financial Times. “The definitive guide to the past present and future of the multilateral trading system.”—Martin Wolf, Financial Times. Buy The Book Running Toward Fire: Following the Warrior Path Nate Boaz, M.B.A. ’06 Gripping memoir about a Marine's transformative journey through a labyrinth of war and its aftermath. Themes of courage, sacrifice, and individuation. BarstoolBallads.com and Amazon. Buy The Book The End of Meaning: Cultural Change in America Since 1945 William Sikes, M.Div. ’74, Ph.D. Chronicles the dramatic decline of experiences that give life meaning and ponders the significance of this loss for society - and our humanity. Available Wipf and Stock late April. Buy The Book Freddie’s Last Ride M.A. Whelan, Ph.D. ’72, M.D. “...An unbelievably detailed and compelling chronology...that moves from one vivid scene to the next....The book is about justice and injustice...by a doctor who is both authoritative and dogged.”—Allan Ropper, M.D. Amazon. Buy The Book The Woman in Green: A Novel Larry Lockridge, Ph.D. ’69 Deep dive into the Metafarcical. “Brilliantly skewers the pretensions of our modern dystopian age with devastating humor and inspired ranting.” Robert J. Mrazek. Artwork: Marcia Scanlon. Barnes & Noble, Amazon. Buy The Book Leadership Types Laura J. Barnard ’02 Shatters outdated stereotypes and helps elevate your authentic leadership, empowering you to rise up within your industry, change the paradigm around representation in leadership, and make the world a more equitable place. Buy The Book Gray Matters: A Biography of Brain Surgery Theodore H. Schwartz ’87, M.D. ’92 Experience what it’s like to hold the scalpel, extract a tumor, or fix a bullet hole—when every second can mean the difference between life or death. Buy The Book Radical Atlas of Ferguson, USA Patty Heyda, M.Arch. ’00 Just who are our cities built for? Over one hundred maps chart the systemic forces defining inequality in the built environment, seen through the lens of Ferguson, MO, since the 2014 uprising. Available at Belt Publishing & Amazon. Buy The Book Justice at Trial Jim Brosnahan, LL.B. ’59 A memoir of Jim’s 60 years of investigating and trying murders, presidential coverups, bank fraud, First Amendment cases, and Supreme Court arguments among other civil and criminal cases. Available on Amazon. Buy The Book Marching in Montgomery: A Memoir of the Civil Rights Movement John J. Hartman ’64 A personal memoir and a historical account of the author’s participation in the 1965 marches in Alabama for voting rights. On Amazon & IPBooks.net. Buy The Book Create the Future: Powerful Decision-Making Tools for Your Company and Yourself Rick Williams, M.B.A. ’77 Your leadership guide, including executive team exercises, for when you have an exciting opportunity or face a challenging threat and must get it right. Buy The Book The Qumran Con: A Dead Sea Scrolls Memoir Raphael Golb, J.D., Ph.D. ’96 The Dead Sea Scrolls and their scandals meet the First Amendment and the criminal justice system. The author took on a threatened establishment—and fought to stay out of Rikers Island. Buy The Book Surviving Your Doctor Frank M. Torti, M.D. ’73, M.P.H. ’74 Suddenly serious illness strikes you or your family. This book tells you how to get the best care: how to get an effective second opinion, size up doctors and hospitals, and avoid mistakes even the smartest people make. On Amazon. Buy The Book Stories From the Starting Line Tom Raffio ’78 with Ellen Raffio and Erika Alison Cohen Tom Raffio, President & CEO, Northeast Delta Dental, his wife Ellen, and Erika, all avid runners, share conversations with marathon winners, elite racers and everyday joggers. Buy The Book A View Near the Finish Line: Observations and Discussion Thoughts for Salons Dennis Joy Johnson, M.B.A. ’72 Passing the baton. My writing initially aimed for my grandchildren and then it morphed into social commentary and thoughts for discussion and debate. Buy The Book Time Awareness Works! Make Your Time Work for You Susan Riegler, Ed.M. ’93 Includes stories and tools to enhance the reader’s sense of time and reduce stress. Makes a great gift for students, graduates, harried friends, and retirees. https://amzn.to/46iWOGo Buy The Book My Quest for Wisdom at Harvard Divinity School Shenandoah Titus, MRPL ’24 A compelling, profound, and powerful short story! The author, a whistleblower attorney and Berkeley Law alumnus, also completed coursework at HLS. PDF copy: attorney.titus13@gmail.com. Buy The Book The Business of Secrets Fred Kinch, M.B.A. ’65 True adventures in selling cryptographic equipment worldwide during the Cold War, including traveling to combat zones, struggling to avoid sleeping in the streets of Cairo, and receiving unexpected visits from MI6 agents. Buy The Book How to Achieve a Perfectly Unintelligible Presentation E. Brad Thompson, M.D. ’60 This book, “…with a lot of quirks and charm…” (Jesup Library), takes a humorous, reverse psychological approach to help all speakers improve their talks. Amazon, Barnes & Noble. Buy The Book Exposing Bad Plastic Surgery and the Secret to Avoiding It Thomas J. Francel ’78 This book...will go a long way in curtailing bad plastic surgery. It belongs in the hands of anyone contemplating plastic surgery and on shelves of all practitioners."—Foad Nahai, M.D. Buy The Book Caravan of Specters Carlos García Saúl ’85Novel based on actual events. In 1898, the US conquers Puerto Rico to find thousands dying from a mysterious illness. Army physician Bailey Ashford races against time to conquer the pandemic before it devastates the island. Buy The Book Reading Between the Letters of the Gospels Mark C. Kiley, Ph.D. ’83 Drawing on Aratos, Vergil, and others, this study asks whether and how discrete Greek letters correctly ordered within a text comment on an explicit theme nearby. bit.ly/readingbtwn. Buy The Book Reflections: An Architect’s Memoir Charles Belson, M.Arch ’75 A delight to read. Emotionally engaging. Surpasses architect Howard Roark in Ayn Rand’s The Fountainhead for capturing the design ethos of one’s own era. At the Harvard Book Store. Buy The Book The Walking Otters Edward R. O'Malley ’71 Set in Detroit, eighth-grade classmates Cab and Julia are drawn together by the sudden death of Cab’s father. Street-smart Cab and sophisticated Julia explore worlds they never knew existed—poetry, art, sports, and murder. Buy The Book The Inner Light and World Religions: How Meditating Mystics Use Sleep as a Ladder to Trigger Ecstatic Visions Philip T. Nicholson, S.M. ’74 See a realistic video and learn more about this book at: bit.ly/inlightwr. Paper & e-book on Amazon. Buy The Book The Gitche Gumee Diaries: The Secrets of Velvet LeBlanc James Perry Hill, M.P.A. ’79 Last of a trilogy about a First American woman's spiritual and political journey to protect Lake Superior from an environmental calamity. On Amazon and Kindle. Buy The Book Softening the Blow: My Story Richard Alexander, M.B.A. ’64 Are you ready for the death of someone you love? Be with me when my crisis struck, and my meandering path toward recovery. This could help you. Amazon or e-mail rich@richalex.net. Buy The Book How the Harvard Business School Changed the Way We View Organizations Jay W. Lorsch, D.B.A. ’64 Invented by the scholars who launched Harvard Business School, this medical model will still cure companies today. Available on Amazon. Buy The Book Black Homeownership on Martha’s Vineyard: A History Richard Lewis Taylor, M.B.A. ’76, J.D. ’77 and Thomas Dresser The challenges, triumphs, and sense of community on Martha’s Vineyard that has endured with the arrival of Black homeowners in the 19th century. Buy The Book The Journey Home Foreword: Julia C. Davis ’73 Jeanne C. DeFazio A collection of memories from those who came into communion with God by accepting Jesus as Lord and Savior. These Christians share the uncensored version of their encounter with God. Buy The Book Home Sean Palfrey ’67, M.D. Former Faculty DeanFrom decades of experimental in-camera photography and “musings” raised by the images, Dr. Palfrey is publishing a series of six small books. Available on Amazon and in bookstores. Buy The Book Hell Lost Ann Bennett Spence (Bian An), A.M. ’69 For 500 years a Temple of Hell stood in Beijing; it was smashed during the Cultural Revolution. But 20 years earlier, Joe Bennett had captured images of its monsters. www.biananspence.com. Buy The Book Greenlight to Freedom Casey Lartigue, ALB ’89, Ed.M. ’91 and Songmi Han Songmi Han recounts her daring escape from North Korea to reunite with her mother. This memoir reveals the courage and resilience of a young woman defying a brutal regime. Buy The Book Answered Prayers: In Pursuit of a Useful Life Walter V.L. Eversley, Ph.D. ’76 This book encourages people to persevere in prayer. Other titles by the author are also available. On Amazon or write to Dr. Eversley at: 214 Lambeth Rd., Baltimore, MD 21218. Buy The Book The Rise of Constantine Greg Theokas, J.D./M.B.A. ’71 Striving to overcome his illegitimacy, Constantine shares his story. From humble beginnings to conquering the Mediterranean and expanding Christianity, his accomplishments were vast. Yet there was a dark side. On Amazon. Buy The Book Learning the Fine Art of Flying Solo Cheryl Klein, M.Div. ’84 None of us would ever choose to be alone, right? UU minister/counselor helps you find what you need to move forward when you find yourself facing life on your own. Available on Amazon. Buy The Book Collected Bequia Poems 1971-2021 Richard Dey ’73 “I felt as if I had been there!”—Bruce Bennett. “These poems are well-crafted and sensitive.”—The Caribbean Writer. Available at The Grolier Poetry Book Shop or rdeyop@gmail.com. Buy The Book Project Mayflower Richard A. Stone ’70“I love this book!” writes James Fallows ’70. True untold story of grand adventure to build and sail Mayflower II, the 1620 Pilgrim replica ship. Steven Ujifusa ’01 says: "… a triumphant tale...” Amazon, B&N, local bookstores. Buy The Book What We All Know, What We All Forget: The Arts, Nature, and the Human Spirit D. Sperry Finlayson, M.L.A. ’89 Aesthetics, not as a “science” or “theory,” but as available—to our delight—in actual lived experience. Available at dsperryfinlayson.com. Buy The Book Top Problems Facing Colleges: And What to Do Norman R. Smith, Ed.D. ’84 Third edition updated for 2024-2026. Focuses on challenges facing smaller, tuition-revenue-dependent colleges. Written for senior officers and trustees. Available from online retailers. Buy The Book From Bottom to Top Tier in a Decade Norman R. Smith, Ed.D. ’84 Updated second edition 2024. How New York’s Wagner College averted near-bankruptcy and evolved into a Top Tier institution. Book available from most ebook retailers. Buy The Book Building Culture Julian Rose ’06 Spanning generations and geographies, this collection of interviews with sixteen of the world’s most celebrated architects captures their reflections on the complex and fascinating process of creating inspiring museums for art. Buy The Book The Startup Game William H. Draper III, M.B.A. ’54Bill Draper has worked with top entrepreneurs for more than 50 years in fabled Silicon Valley. The Startup Game is an up-close look at how the world of venture capital and entrepreneurship works. Available on Amazon.com. Buy The Book Starting with Whitehead: Raising Children to Thrive in Treacherous Times Lynn Sargent De Jonghe ’64 This widely praised book invokes the philosophy of A.N. Whitehead, elaborating his helical learning, process involving romance, precision, and generalization. Buy The Book Dirty Science Bob Gebelein ’56 WINNER OF 4 BOOK AWARDS. Self-knowledge for academia: How dirty politics overpowers critical thinking and blocks academic freedom. Paperback, Kindle, and audiobook on Amazon.com. Buy The Book Happiness and Survival Bob Gebelein ’56 For personal happiness and survival of the species, e'''
