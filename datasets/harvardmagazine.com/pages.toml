title = "Academic Freedom and Free Speech | Harvard Magazine"
description = "Robert Post explains how they differ—and why it matters, especially now"
full_description = "Illustration by Paul Garland Features Academic Freedom and Free Speech Robert Post explains how they differ—and why it matters by Lincoln Caplan September-October 2024 const trinityScript = document.createElement('script'); trinityScript.setAttribute('fetchpriority', 'high'); trinityScript.src = 'https://trinitymedia.ai/player/trinity/2900016010/?pageURL=' + encodeURIComponent(window.location.href); document.currentScript.parentNode.insertBefore(trinityScript, document.currentScript); The upheaval on American campuses kindled by the Israel-Hamas war has had extreme consequences: resignations of presidents at leading universities, including Harvard; firings of other administrators; discontentment and disciplining of faculty and students; dismay and confusion among alumni; and high-profile, often prosecutorial, congressional hearings.Deepening this turmoil, two axioms prevail about free speech on campus: everyone knows what free speech is; and free speech is as indispensable there as everywhere else. For Robert C. Post, ’69, Ph.D. ’80, those are far-reaching misconceptions. His ideas reflect his precise and important understanding of academic freedom and freedom of speech.The essential freedoms, he explains, differ on campus and in the world at large. On campus, there is freedom to discover, develop, and distribute ideas in pursuit of knowledge and diffuse it in education. In the public sphere, there is freedom to debate and deliberate about ideas in expressing and responding to others’ opinions. The former is academic freedom, the latter freedom of speech. Speech has a very different purpose in each sphere, Post explains. Drawing on an exceptional combination of eminent legal scholarship, doctoral training in the humanities, and experience as an academic leader, he maintains that the purpose determines the nature of the freedom. Robert C. Post | Photograph by Stu Rosner In the university, the sphere of knowledge, truth-seeking speech is the essential tool. Because of the standards that guide each academic discipline, tenured scholars have the authority to veto the ideas and speech of untenured scholars and students if they don’t meet those standards. In this institutional sense, all that speech in search of truth is not equal.In the public sphere, however, all individual opinions count as valid contributions in shaping public opinion. John Rawls, Harvard’s great twentieth-century philosopher, said that in public debate, “there are no experts: a philosopher has no more authority than other citizens.” Under the Constitution’s Bill of Rights—the First Amendment’s clause protecting “the freedom of speech”—everyone’s speech about public affairs is equal. Post calls that “public discourse”—“the free flow of ideas in newspapers, in public squares, on debate stages, on theatrical stages, in art galleries and concert halls.”In the past generation, critics on the right and left have increasingly conflated these principles to argue that, in Post’s words, “universities have failed to protect freedom of expression.” That’s the most tenacious of the many controversies involving academic freedom. As Harvard proclaims in its “Free Speech Guidelines,” “Free speech is uniquely important to the University.”The strife is about the meanings of academic freedom and of free speech. Politics in general has sometimes bent both concepts to allow for freedom-flouting outcomes (purging as subversives Communists from faculties; prosecuting as traitors journalists who criticize the government). Muddling the principles is especially risky for universities today. Politics often treats universities like any other interest group that needs to be put in its place. Overreaction on social media to those interventions swells the impression that the comeuppance is due.Politics in the academy has made humility and openness to contrary ideas receding virtues there, too. Clashes can be knotty and nasty. But even in the academy, tensions between the freedoms are often talked about as free speech problems. Post quotes a former president of the University of California when in that office: “we have moved from freedom of speech on campuses to freedom from speech.” With clinical cool, Post writes: “The assumption is apparently that First Amendment protections attach to speech, and that speech occurs within universities.” So speech is an entitlement.He sees two major problems with this two-step logic. Because of their different purposes—one safeguarding self-government; the other protecting education and advancement of knowledge—those freedoms require “entirely different” frameworks of regulation and protection of speech. Extending free speech protection to all speech uttered in universities (part of what Justice David Souter, ’61, LL.B. ’66, LL.D. 2010, called “speech as such”) means extending protection to some speech that shouldn’t be protected. It’s “a fiction” that the Constitution does so, Post highlights, and “an abuse” of the First Amendment to claim that.Robert Post's Educational PathPost, now 76, finished his Harvard Ph.D. dissertation in 1980, in the history of American civilization. (The program changed its name to American studies in 2012.) His path to that point was indirect. Five years after completing college and entering graduate school, he had gone “to learn the lawyer’s profession” at Yale Law School, because he despaired about getting an academic position that would let him do scholarship, teach, and write literary criticism.His 580-page dissertation, “Studies in the Origins and Practice of the American Romance: Social Structure, Moral Reality, and Aesthetic Form,” explores “the possibilities of human value and significance,” through a study of novels by James Fenimore Cooper and by Nathaniel Hawthorne, reflecting Post’s “fascination with the sea-change that transformed American fiction in the years surrounding the Civil War.” By the time his dissertation was accepted, he was 32 and earning a reputation as an impressive, disciplined lawyer in Washington, D.C., for the renowned litigation firm of Williams & Connolly, where his main clients included The Washington Post. But the Harvard graduate program had kept his ties “with the academic world alive and viable,” and he saw a path for himself in the legal academy.His brilliance was an obvious factor: he had graduated summa cum laude and Phi Beta Kappa from the College; he was an exceptional graduate student and a dazzling Yale Law graduate; and he had completed prized clerkships with powerful liberals, David L. Bazelon on the U.S. Court of Appeals for the District of Columbia and William J. Brennan Jr., LL.B. ’31, LL.D. ’68, on the Supreme Court. Another factor was the premium that top law schools were putting on Ph.D.s in addition to J.D.s for young professors.What gives meaning to American lives? How do those lives reveal that meaning? What leads to what Post calls “human flourishing”? Those are overarching questions Post asks in law that he asked as a young scholar in the humanities. He focuses on social practices, or human habits, which reveal culture and give lives meaning, and on the relationship of those practices to social purposes. When purposes evolve, practices inevitably need to change.In legal scholarship, he pursues that meaning in law and legal norms, especially in the history of the Supreme Court and in constitutional law. For 20 years, he was a star constitutional law professor at what is now Berkeley School of Law, the University of California’s flagship law school. For 22 years, he has been a prized professor at Yale Law School—including eight years as its esteemed dean and, for the past eight, as a Sterling Professor, Yale’s highest academic honor.Post’s work draws on history, philosophy, political science, and sociology as well as law. What distinguishes his scholarship is how he puts that knowledge to use. Concentrating on culture, and how law and culture shape each other, his work in the law is a kind of anthropology–a study of humanity. But unlike classic anthropologists, describers of what is, Post is also a prescriber of what ought to be. He has used that approach to think through the protections needed to foster expression of opinion and production and diffusion of knowledge.Free Speech versus Academic FreedomFree speech shapes public opinion, or consensus, which, wrote Judge Learned Hand, A.B. 1893, LL.B. ’96, LL.D. 1939, “is the final source of government in a democratic state.” Democracy answers to public opinion: the First Amendment prohibits the government from telling people what to think or say, Post explains, to ensure that citizens “set the agenda for government action rather than the reverse.” The successful functioning of democracy, he expands, “requires that the speech of all persons be treated with toleration and equality.” Free speech is anti-majoritarian in its protection of all individuals, however marginalized or minor in number, from majority prejudice or oppression.But opinion is often the nemesis of knowledge. The university is not a democracy. Neither public opinion nor the government controls the development of knowledge. The successful production of knowledge “requires that speech be subject to a disciplinary authority that distinguishes good ideas from bad ones,” as Post puts it: disciplines require hierarchy. They “are grounded on the premise that some ideas are better than others; disciplinary communities claim the prerogative to discriminate between competent and incompetent work.”Teaching requires competence in a discipline, and the care of thoughtful instruction, he amplifies: “no competent teacher would permit a class to descend into name-calling and insults”; and “professors who bully, abuse, degrade, or demean their students risk being found professionally incompetent in achieving the university’s mission of education.”Post emphasizes that the First Amendment’s protections extend to academic freedom (the Supreme Court called it “of transcendent value” and “a special concern” of the amendment) because it serves a constitutional value. Post wrote, “Universities and university faculty are the unique and primary sites in modern American society for the creation and diffusion of disciplinary knowledge in the service of the public good.” They feed civilization. Preserving self-government requires preserving the people’s access to knowledge. Producing it requires freedoms that are the fundamentals of academic freedom: of research and publication; of teaching; and of a form of free speech, about matters related to the university (intramural) and matters of public concern (extramural). (The legal scholar David M. Rabban, in Academic Freedom: From Professional Norm to First Amendment Right, just published by Harvard University Press, presents what he calls “a theory of academic freedom as a distinctive subset of First Amendment law” through an exegesis on case law.)But “university professors do not have freedom of speech, as measured by the classic First Amendment tradition,” Post underscores: “If I am supposed to be teaching constitutional law, I can’t spend my classroom time talking about auto mechanics.” As he explains with the legal scholar Matthew W. Finkin as his coauthor of For the Common Good: Principles of American Academic Freedom, academic freedom “is not the freedom to speak or to teach just as one wishes. It is the freedom to pursue the scholarly profession, inside and outside the classroom, according to the norms and standards of that profession.”In 1915, the American Association of University Professors’ (AAUP) Declaration of Principles on Academic Freedom and Academic Tenure articulated the basis of American understanding of that freedom—to inquire and speculate, recognizing “no such thing as dangerous knowledge;” to train students “to think for themselves” and “to think intelligently;” and to speak with the independence of appointees, not the dependence of employees, about policies and practices of their academic institution or as citizens about public affairs. The main threats to academic freedom came from religion objecting to science; vested interests, like political backers and financial supporters, opposing teachings they spurned; and, most menacing, as the Declaration put it, “the tyranny of public opinion.”In that era, as Post and Finkin detail, the “raw political force” of legislatures sometimes curbed the autonomy of universities because of “political influences and popular prejudices” expressed in public opinion—as is happening aggressively today. Even “without the direct intervention of elected officials, public opinion powerfully influences the decisions of university administrators,” they write. Academic freedom is necessary to insulate faculty from public opinion, so they can pursue their scholarship “according to the norms of that profession.”Of course, there’s a lot of speech that almost everyone agrees the First Amendment doesn’t protect, even in universities. It doesn’t cover lewd, obscene, profane, and libelous speech, or “fighting words”: face-to-face insults that trigger a violent response or truly threaten to. A decade ago, Ronald K. L. Collins, editor of the newsletter “First Amendment News,” counted “at least 43 other additional types of unprotected expression,” from blackmail and bribery, to insider trading, perjury, plagiarism, and child pornography.To these categories, Post adds “vast stretches of ordinary verbal expression, as for example between dentists and their patients, between corporations and their shareholders, between product manufacturers and their customers,” including a lot of speech in the academy. It’s the rule, not the exception, that speech “may routinely be regulated,” writes Frederick Schauer, J.D. ’72, a prominent scholar and former Stanton professor of the First Amendment at the Harvard Kennedy School. Skirting regulation by extending protection to speech that doesn’t warrant it, as a result of focusing “on the freedom of individual speakers,” Post stresses, we lose sight of the speech that matters most to society and its “systemic function”—public discourse as the source of government.Extending protection that’s imperative for public discourse to “speech as such” mistakes the means for the end—speech instead of its purpose. It allows for “weaponizing the First Amendment,” Justice Elena Kagan, J.D. ’86, wrote in a Supreme Court dissent—as the journalist Adam Liptak reported in the New York Times, “to justify unlimited campaign spending, discrimination against gay couples, and attacks on the regulation of tobacco, pharmaceuticals, and guns.”His “very radical conclusion,” Post says, is that, in protecting the freedom of speech, “what we protect is not the speech.” It’s the social practices that produce public discourse and give individuals the confidence that they play a part in self-government. “When persons participate in the formation of public opinion,” he writes, “they are sov"
