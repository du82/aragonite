full_description = "Features The Marketplace of Perceptions Behavioral economics explains why we procrastinate, buy, borrow, and grab chocolate on the spur of the moment. by Craig Lambert March-April 2006 Professor of economics David Laibson, whose research explores the fundamental tension between “seizing available rewardsin the present, and being patient for rewards in the future.”Photograph by Stu Rosner const trinityScript = document.createElement('script'); trinityScript.setAttribute('fetchpriority', 'high'); trinityScript.src = 'https://trinitymedia.ai/player/trinity/2900016010/?pageURL=' + encodeURIComponent(window.location.href); document.currentScript.parentNode.insertBefore(trinityScript, document.currentScript); Sidebar: Neuroeconomics Games of Trust and Betrayal Like all revolutions in thought, this one began with anomalies, strange facts, odd observations that the prevailing wisdom could not explain. Casino gamblers, for instance, are willing to keep betting even while expecting to lose. People say they want to save for retirement, eat better, start exercising, quit smoking—and they mean it—but they do no such things. Victims who feel they’ve been treated poorly exact their revenge, though doing so hurts their own interests.Such perverse facts are a direct affront to the standard model of the human actor—Economic Man—that classical and neoclassical economics have used as a foundation for decades, if not centuries. Economic Man makes logical, rational, self-interested decisions that weigh costs against benefits and maximize value and profit to himself. Economic Man is an intelligent, analytic, selfish creature who has perfect self-regulation in pursuit of his future goals and is unswayed by bodily states and feelings. And Economic Man is a marvelously convenient pawn for building academic theories. But Economic Man has one fatal flaw: he does not exist.Sidebars• Neuroeconomics• Games of Trust and BetrayalWhen we turn to actual human beings, we find, instead of robot-like logic, all manner of irrational, self-sabotaging, and even altruistic behavior. This is such a routine observation that it has been made for centuries; indeed, Adam Smith “saw psychology as a part of decision-making,” says assistant professor of business administration Nava Ashraf. “He saw a conflict between the passions and the impartial spectator.”Nonetheless, neoclassical economics sidelined such psychological insights. As recently as 15 years ago, the sub-discipline called behavioral economics—the study of how real people actually make choices, which draws on insights from both psychology and economics—was a marginal, exotic endeavor. Today, behavioral economics is a young, robust, burgeoning sector in mainstream economics, and can claim a Nobel Prize, a critical mass of empirical research, and a history of upending the neoclassical theories that dominated the discipline for so long.Although behavioral economists teach at Stanford, Berkeley, Chicago, Princeton, MIT, and elsewhere, the subfield’s greatest concentration of scholars is at Harvard. “Harvard’s approach to economics has traditionally been somewhat more worldly and empirical than that of other universities,” says President Lawrence H. Summers, who earned his own economics doctorate at Harvard and identifies himself as a behavioral economist. “And if you are worldly and empirical, you are drawn to behavioral approaches.” Framing a New FieldTwo non-economists have won Nobel Prizes in economics. As early as the 1940s, Herbert Simon of Carnegie Mellon University put forward the concept of “bounded rationality,” arguing that rational thought alone did not explain human decision-making. Traditional economists disliked or ignored Simon’s research, and when he won the Nobel in 1978, many in the field were very unhappy about it.Then, in 1979, psychologists Daniel Kahneman, LL.D. ’04, of Princeton and Amos Tversky of Stanford published “Prospect Theory: An Analysis of Decision under Risk,” a breakthrough paper on how people handle uncertain rewards and risks. In the ensuing decades, it became one of the most widely cited papers in economics. The authors argued that the ways in which alternatives are framed—not simply their relative value—heavily influence the decisions people make. This was a seminal paper in behavioral economics; its rigorous equations pierced a core assumption of the standard model—that the actual value of alternatives was all that mattered, not the mode of their presentation (“framing”).Framing alternatives differently can, for example, change people’s preferences regarding risk. In a 1981 Science paper, “The Framing of Decisions and the Psychology of Choice,” Tversky and Kahneman presented an example. “Imagine that the U.S. is preparing for the outbreak of an unusual Asian disease which is expected to kill 600 people,” they wrote. “Two alternative programs to combat the disease have been proposed.” Choose Program A, and a projected 200 people will be saved. Choose Program B, and there is a one-third probability that 600 people will be saved, and a two-thirds probability that no one will be saved. The authors reported that 72 percent of respondents chose Program A, although the actual outcomes of the two programs are identical. Most subjects were risk averse, preferring the certain saving of 200 lives. The researchers then restated the problem: this time, with Program C, “400 people will die,” whereas with Program D, “there is a one-third probability that no one will die, and a two-thirds probability that 600 people will die.” This time, 78 percent chose Program D—again, despite identical outcomes. Respondents now preferred the risk-taking option. The difference was simply that the first problem phrased its options in terms of lives saved, and the second one as lives lost; people are more willing, apparently, to take risks to prevent lives being “lost” than to “save” lives. “Kahneman and Tversky started this revolution in economics,” says Straus professor of business administration Max Bazerman, who studies decision-making and negotiation at Harvard Business School. “That 1979 paper was written on the turf of economics, in the style of economists, and published in the toughest economic journal, Econometrica. The major points of prospect theory aren’t hard to state in words. The math was added for acceptance, and that was important.” In 2002, Kahneman received the Nobel Prize in economics along with Vernon Smith, Ph.D. ’55, of George Mason University, who was honored for work in experimental economics. (Tversky, Kahneman’s longtime collaborator, had died in 1996.)In the 1980s, Richard Thaler (then at Cornell, now of the University of Chicago Graduate School of Business) began importing such psychological insights into economics, writing a regular feature called “Anomalies” in the Journal of Economic Perspectives (later collected in his 1994 book, The Winner’s Curse). “Dick Thaler lived in an intellectual wilderness in the 1980s,” says professor of economics David Laibson, one of Harvard’s most prominent behavioral economists. “He championed these ideas that economists were deriding. But he stuck to it. Behavioral approaches were anathema in the 1980s, became popular in the 1990s, and now we’re a fad, with lots of grad students coming on board. It’s no longer an isolated band of beleaguered researchers fighting against the mainstream.”As with most movements, there were early adopters. “In the 1980s the best economists in the world were seeing the evidence and adopting it [behavioral economics],” Bazerman says. “Mediocre economists follow slowly—they continued to ignore it so they could continue doing their work undisturbed.”To be fair, the naysayers would have agreed that the rational model only approximates human cognition—“just as Newtonian physics is an approximation to Einstein’s physics,” Laibson explains. “Although there are differences, when walking along the surface of this planet, you’ll never encounter them. If I want to build a bridge, pass a car, or hit a baseball, Newtonian physics will suffice. But the psychologists said, ‘No, it’s not sufficient, we’re not just playing around at the margins, making small change. There are big behavioral regularities that include things like imperfect self-control and social preferences, as opposed to pure selfishness. We care about people outside our families and give up resources to help them—those affected by Hurricane Katrina, for example.”Much of the early work in behavioral economics was in finance, with many significant papers written by Jones professor of economics Andrei Shleifer. In financial markets, “The usual arguments in conventional economics are, ‘This [behavioral irrationality] can’t be true, because even if there are stupid, irrational people around, they are met in the marketplace by smart, rational people, and trading by these arbitrageurs corrects prices to rational levels,’” Shleifer explains. “For example, if people get unduly pessimistic about General Motors and dump GM shares on the market, these smart people will sweep in and buy them up as undervalued, and not much will happen to the price of GM shares.”But a 1990 paper Shleifer wrote with Summers, “The Noise Trader Approach to Finance,” argues against this “efficient market” model by noting that certain risk-related factors limit this arbitrage. At that time, for example, shares of Royal Dutch were selling at a different price in Amsterdam than shares of Shell in London, even though they were shares of the same company, Royal Dutch/Shell. Closed-end mutual funds (those with a fixed number of shares that trade on exchanges) sell at different prices than the value of their portfolios. “When the same thing sells at two different prices in different markets, forces of arbitrage and rationality are necessarily limited,” Shleifer says. “The forces of irrationality are likely to have a big impact on prices, even on a long-term basis. This is a theoretical attack on the central conventional premise.”Meanwhile, the Russell Sage Foundation, which devotes itself to research in the social sciences, consistently supported behavioral economics, even when it was in the intellectual wilderness. Current Sage president Eric Wanner, Ph.D. ’69, whose doctorate is in social psychology, was running a program in cognitive science at the Alfred P. Sloan Foundation in 1984 when Sloan started a behavioral economics program as an application of cognitive science to the study of economic decision-making. (“The field is misnamed—it should have been called cognitive economics,” says Wanner. “We weren’t brave enough.”) After Wanner became president of Russell Sage in 1986, the two institutions worked jointly to foster the new subfield. In the last 20 years, Sage has made well over 100 grants to behavioral economists; it also organizes a biennial summer institute that has drawn younger scholars like Laibson and professor of economics Sendhil Mullainathan. Princeton University Press and Russell Sage also co-publish a series of books in the field.Behavioral economics, then, is the hybrid offspring of economics and psychology. “We don’t have much to tell psychologists about how individuals make decisions or process information, but we have a lot to learn from them,” says Glimp professor of economics Edward Glaeser. “We do have a lot to say about how individuals come together in aggregations—markets, firms, political parties.” The Seductive Now-MomentA national chain of hamburger restaurants takes its name from Wimpy, Popeye’s portly friend with a voracious appetite but small exchequer, who made famous the line, “I’ll gladly pay you Tuesday for a hamburger today.” Wimpy nicely exemplifies the problems of “intertemporal choice” that intrigue behavioral economists like David Laibson. “There’s a fundamental tension, in humans and other animals, between seizing available rewards in the present, and being patient for rewards in the future,” he says. “It’s radically important. People very robustly want instant gratification right now, and want to be patient in the future. If you ask people, ‘Which do you want right now, fruit or chocolate?’ they say, ‘Chocolate!’ But if you ask, ‘Which one a week from now?’ they will say, ‘Fruit.’ Now we want chocolate, cigarettes, and a trashy movie. In the future, we want to eat fruit, to quit smoking, and to watch Bergman films.”Laibson can sketch a formal model that describes this dynamic. Consider a project like starting an exercise program, which entails, say, an immediate cost of six units of value, but will produce a delayed benefit of eight units. That’s a net gain of two units, “but it ignores the human tendency to devalue the future,” Laibson says. If future events have perhaps half the value of present ones, then the eight units become only four, and starting an exercise program today means a net loss of two units (six minus four). So we don’t want to start exercising today. On the other hand, starting tomorrow devalues both the cost and the benefit by half (to three and four units, respectively), resulting in a net gain of one unit from exercising. Hence, everyone is enthusiastic about going to the gym tomorrow.Broadly speaking, “People act irrationally in that they overly discount the future,” says Bazerman. “We do worse in life because we spend too much for what we want now at the expense of goodies we want in the future. People buy things they can’t afford on a credit card, and as a result they get to buy less over the course of their lifetimes.” Such problems should not arise, according to standard economic theory, which holds that “there shouldn’t be any disconnect between what I’m doing and what I want to be doing,” says Nava Ashraf.Luckily, Odysseus also confronts the problem posed by Wimpy—and Homer’s hero solves the dilemma. The goddess Circe informs Odysseus that his ship will pass the island of the Sirens, whose irresistible singing can lure sailors to steer toward them and onto rocks. The Sirens are a marvelous metaphor for human appetite, both in its seductions and its pitfalls. Circe advises Odysseus to prepare for temptations to come: he must order his crew to stopper their ears with wax, so they cannot hear the Sirens’ songs, but he may hear the Sirens’ beautiful voices without risk if he has his sailors lash him to a mast, and commands them to ignore his pleas for release until they have passed beyond danger. “Odysseus pre-commits himself by doing this,” Laibson explains. “Binding himself to the mast prevents his future self from countermanding the decision made by his present self.”Pre-commitments of this sort are one way of getting around not only the lure of temptation, but our tendency to procrastinate on matters that have an immediate cost but a future payoff, like dieting, exercise, and cleaning your office. Take 401(k) retirement plans, which not only let workers save and invest for retirement on a tax-deferred basis, but in ma"
