description = "Scholars’ perspectives on a pervasive new threat"
full_description = "Features Can Disinformation Be Stopped? Scholars’ perspectives on a pervasive new threat by Jacob Sweet July-August 2021 Joan DonovanPhotograph by Jim Harrison const trinityScript = document.createElement('script'); trinityScript.setAttribute('fetchpriority', 'high'); trinityScript.src = 'https://trinitymedia.ai/player/trinity/2900016010/?pageURL=' + encodeURIComponent(window.location.href); document.currentScript.parentNode.insertBefore(trinityScript, document.currentScript); “Stop the Steal” was first trotted out during the 2016 Republican primaries. As the Republican National Convention approached, Donald Trump’s campaign consultant Roger Stone coined the phrase, urging people to resist the allegedly corrupt “establishment” Republicans who wouldn’t let Trump win. When he prevailed, it became irrelevant. Stone brought the term back for the general election, but when Trump won again, the phrase lost steam.But on and after Election Day 2020, as the results appeared increasingly less favorable to the incumbent president, Joan Donovan, research director at the Harvard Kennedy School’s Shorenstein Center on Media, Politics, and Public Policy, watched a constellation of what she calls “disinformers” rally around the phrase again. In 24 hours, the most prominent “Stop the Steal” Facebook group—promoted across social media by outspoken conspiracy theorists, and algorithmically recommended to likely supporters by the site itself—attracted more than 300,000 members. She saw the online movement shift to the streets, with provocateurs like Alex Jones and Ali Alexander showing up at state capitols across the country, pressing representatives not to certify the election and riling up those who believed the process to be a sham.So when “Stop the Steal” turned violent on January 6, few were less surprised than Donovan. Hours before the Capitol was breached by protesters, she had tweeted a prediction: “Today we will witness the full break of the MAGA movement from representative politics. As you watch what unfolds in DC today, remember that activists are both inside and outside the Capitol.”By the end of the day, four had died, including a woman shot by a Capitol Police officer as she climbed through a shattered window. (One officer assaulted with chemical spray died the next day of natural causes, according to the Washington, D.C., chief medical examiner’s office.) The Capitol Police Union reported that nearly 140 officers were injured during the attack, and two died by suicide shortly after. The damage to the Capitol has cost tens of millions of dollars to repair; more than 400 people have been charged with federal crimes.“What we saw on January 6 was not a young people’s revolution. This was an artifact, or an outcome, of the design of Facebook,” Donovan says. “The time is now for realizing that of course, we can’t walk back in time and do something different. But we surely can insist the future of the internet isn’t like the present.”The “Algorithmic Economy”Misinformation is everywhere, an inherent part of communication that does not imply intent. Accidentally telling someone Independence Day falls on July 3 is misinformation. When misinformation becomes deliberate—deception on purpose—that’s disinformation.The purpose varies. Sometimes disinformation is spread for political or financial gain—convincing constituents that a rival candidate has a sordid history, or exploiting people’s interest in a made-up scandal to increase website traffic and sell merchandise. But often the reason is less clear: vague intentions to sow discord and muddy the waters around any given subject.For the past few years, Donovan has spent a couple hours each night listening to white-supremacist podcasts and videos. One of many scholars who are now focused on the origins and intensifying effects of disinformation, she’s found that this monitoring is one of the best ways to keep track of the country’s most prominent disinformation campaigns and blatant attempts at media manipulation. The sessions, she says, help her see a few months into the future.President Trump had told his followers well in advance that something big was going to happen on January 6. Even before the election took place, he primed supporters on Twitter and elsewhere to believe that a loss could be explained only by massive voter fraud. The more Donovan looked into related conspiracy theories, the more popped up on her social-media feeds. “In some instances, you have to go looking for it, it’s very specific,” she says. “But then what happens is that these algorithms will hook into it, particularly the YouTube algorithm, and they will keep trying to get you to watch more content about it.” Looking up “Giuliani” on YouTube, for example, led to an inundation of voter-fraud allegations promoted by Trump lawyer and adviser Rudolph Giuliani.Rudy Giuliani speaks to the press in support of conspiracy theories aimed at overturning the 2020 election results. Lawyer Sidney Powell is behind him.Photograph by Drew Angerer/Getty ImagesOne Giuliani favorite was the “Hammer and Scorecard” theory, a bogus claim that machines made by Dominion Voting Systems switched millions of votes from Trump to Biden. After bouncing around among far-right influencers, blogs, and social-media outlets, the theory reached the president himself. Just over a week after Election Day, he tweeted that Dominion had deleted millions of votes from his totals, flipping the election result. And then the theory was everywhere: recommended to people who liked similar content on social media, discussed by pro-Trump media like Fox News and Newsmax, and further amplified by mainstream media sources that discussed the information solely to discredit it.Although many scholars describe the current media and economic system as an “attention economy,” Donovan disagrees. “That gives far too much agency to the user,” she says. Instead, she calls the current system an “algorithmic economy,” in which individuals have ceded control of their attention to sites like Facebook, YouTube, and Twitter. “It may be the case that you have 500 friends on Facebook,” she says, “but Facebook is going to determine in what proportion you see different people based on different user profiles.” Someone who has clicked a YouTube video about how the COVID pandemic is a hoax is unlikely to be directed toward videos touting the efficacy of the Moderna vaccine; someone who “likes” all of Speaker of the House Nancy Pelosi’s tweets isn’t steered to those of Donald Trump Jr.It’s this algorithmic economy that Donovan believes fuels countless media-manipulation campaigns. Though influential conspiracy theories may seem to appear from nowhere, she and her team have analyzed some of the most prominent examples, parsing out where the disinformation came from, why, and how. Their analysis is bottom-up: from source, to spread, to potential mitigation.The first stage they look for is a manipulation campaign’s planning and origin, searching for signs that groups are discussing an idea that could be the center of a disinformation campaign. “The campaigns do tend to start from a spark of conversation,” Donovan says. “[It’s] somewhere where we’ve discovered a bunch of people…saying things like, ‘Wouldn’t it be great if everybody thought the upcoming vaccine had a microchip in it?’” Given the scale of the internet, Donovan and her colleagues tend to pay attention to this kind of online chatter only when it’s coming from groups that have previously seeded media-manipulation campaigns. They traced the beginning of the “Hammer and Scorecard” conspiracy to 2013, when a former intelligence contractor started spreading rumors about a deep-state supercomputer called Hammer that allowed him to hack databases and collect the information of millions of Americans. It was only in 2020, though, that the most recent iteration of the “Hammer and Scorecard” conspiracy was posted to The American Report, a self-published blog. It claimed that the same Scorecard software that allegedly helped Barack Obama steal the 2012 election was being applied anew to steal the 2020 election for his vice president, Joseph Biden.The next stage is seeding the campaign across social platforms and the internet. That’s when the discussion transforms from a conversation among a few people on a single platform, like Facebook or message-board site 4Chan, and spreads the ideas to other online spaces. Donovan and her team traced a quote from a Twitter user, @SongBird4Trump, who warned followers on October 29 that voting machines would transfer votes to Democrats, and tagged retired general (and, briefly, Trump administration National Security Advisor) Michael Flynn, Trump-supporting lawyer Sidney Powell, three of the president’s children, and staunch pro-Trump news organizations like One America News. The theory began popping up in more popular outlets, including Steve Bannon’s podcast, The War Room. Bannon discussed “Hammer and Scorecard” with Powell, who spread the theory further.But to Donovan, the third stage—when activists, politicians, journalists, and “industry” (companies seeking profit or a social-media boost from disinformation) begin to respond—is most important. It’s here that siloed information can break into mainstream discussions. When Lou Dobbs ’67 interviewed Powell on his Fox Business news show on November 6, she repeated the conspiracy’s central premise and introduced a spurious connection to Venezuela, spurring similar discussions on networks like One America Newsand Newsmax. Such coverage helps legitimize the conspiracy theory and provides a much wider audience, spurring more coverage, more online posts, and a more out-of-control online environment where disinformation flies unchecked. When Trump and his lawyers filed more than 60 lawsuits in an attempt to secure more electoral votes, their claims of election cheating made sense to supporters already alerted to similar allegations.The Mass Market for DisinformationNot all academics agree with the popular view of an internet-driven model of media-manipulation and disinformation campaigns. In 2020, Yochai Benkler, Berkman professor for entrepreneurial legal studies and faculty co-director of the Law School’s Berkman Klein Center for Internet and Society, and colleagues examined some of the most discussed stories about election fraud and traced what caused each spike in media attention. In a vast majority of cases, he found, a surge of coverage stemmed not from a social-media campaign, but rather from a mass-media story or President Trump himself. “In each case, very clearly beginning right after the first COVID relief bill, when Democrats tried to put in significant funding for mail-in voting, Trump and the GOP leadership began to release statements about voter fraud being a major issue,” Benkler says, “And then within hours to a day, social media circulates these messages.” When looking at media coverage of absentee-ballot disinformation in the 2020 election cycle, Benkler and his colleagues failed to see any coverage peaks “meaningfully driven by an online disinformation campaign.” Each one had an obvious elite-driven triggering event—a top-down narrative.Yochai BenklerPhotograph by Jessica Scranton“Technology is easy to blame, because you don’t have to seem political,” he says. “[Disinformation campaigns] didn’t happen on the right as opposed to on the left.…And therefore we have a neutral explanation to what happened.” The reality is quite different in Benkler’s view, driven by mass media and decades of media polarization that he traces back to the 1980s. “Starting with World War II and all the way through the end of the 1970s, you’ve got partisan media on the left and on the right, each of which is supported by primarily philanthropic efforts and user[s],” he says—like the conservative radio program Manion Forum and publications like The National Review and Human Events on the rightor Mother Jones and In These Times on the left. “What changes dramatically in the 1980s is televangelism becomes a big business,” he continues. By then, the Christian Broadcasting Network was publishing its own news and became the third-most-watched cable channel. But it was Rush Limbaugh who really re-invented the model, Benkler emphasizes: “That pushing of outrage and identity confirmation through hatred of the other…becomes big business. So there’s a big market segment that’s not getting what it wants from the mainstream media.” Fox News helped fill the gap in the 1990s, and within a decade, some studies showed that the channel’s coverage was worth a couple percentage points of additional turnout in national elections.“If you’re trying to understand what causes tens of millions of people to believe that Democrats stole the election,” says Yochai Benkler, “that’s not coming from social media.”When highly partisan news sites like Steve Bannon’s Breitbart appeared in 2007, 20 years had already been invested in an asymmetric system, with market dynamics on the left and right varying dramatically, Benkler continues. “[B]y the time market actors like Air America and NBC tried to go and essentially mirror talk radio and Fox for the left, the markets were not there. [Those efforts were] just not big enough and not excited enough about what they were offering.” These highly partisan market incentives produce much of the disinformation that most Americans see, he stresses—not the internet.“If you’re trying to understand what causes tens of millions of people to believe that Democrats stole the election,” Benkler amplifies, “or that Hillary Clinton runs a pedophilia ring out of a basement of a pizza parlor, that’s not coming from social media. That’s coming from Fox News and Sirius XM Radio, Bannon and Breitbart, Rush Limbaugh and Sean Hannity on radio.” After somebody like Limbaugh supplies a steady stream of outrage, and proves it’s enormously profitable, the audience keeps looking for similar programming. “So if you’re trying to come into the market, you’re going to come in with even more salt and sugar and fat, and the sellers of kale are going to do even worse,” Benkler says. “That’s essentially what happened in right-wing media, and that’s what happened to right-wing politicians.”How Deep the Damage?Arguments about the source and proliferation of disinformation will continue. Donovan doesn’t believe that mass media eclipses the internet in spreading damaging conspiracies. As a sociologist, she’s more interested in examining the texture of the culture than in pointing out which branch of media is truly dominant in the process. The ways of quantifying and studying the effects of cable news and radio are more established, “but there is no study in the world that can disambiguate that people were only watching Fox News or only listening to the radio and had no contact with social media,” she says. “The fact of the matter is repetition is what’s getting people sucked into t"
