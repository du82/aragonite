title = "Making Roads Safer for Pedestrians and Cyclists | Harvard Magazine"
description = "Working to curb road deaths"
full_description = "The Memorial Drive bike lane ends abruptly near the Boston University boathouse. Last September, an SUV driver fatally struck biker John Corcoran ’84 near this unsafe section. | Photograph by John Tlumacki/The Boston Globe via Getty Images Features Safe Streets Working to curb road deaths by Max J. Krupnick March-April 2025 const trinityScript = document.createElement('script'); trinityScript.setAttribute('fetchpriority', 'high'); trinityScript.src = 'https://trinitymedia.ai/player/trinity/2900016010/?pageURL=' + encodeURIComponent(window.location.href); document.currentScript.parentNode.insertBefore(trinityScript, document.currentScript); Sidebar: Remembering John Corcoran ’84 Autumn evenings, light off the Charles River glistens through Memorial Drive’s rusting trees. In the crisp breeze, cyclists navigate around pedestrians on the Dr. Paul Dudley White Bike Path. But last September 24, an SUV upended that tranquil scene, careening onto the sidewalk and killing cyclist John Corcoran ’84.In several ways, the crash that killed Corcoran represents the dangers plaguing American roadways. Insufficient separation between cars and people leads to fatal encounters. Large vehicles make crashes deadlier. And fractured governance slows improvements: although Memorial Drive traverses Cambridge, it is managed by the Commonwealth.America’s roads claim about 40,000 lives annually. These deaths have become routine, often eliciting little to no mention even in the local press. But some Harvard affiliates are sounding the alarm about American roads—and are applying their expertise to help make them safer for all.Speed KillsOn an unseasonably cool day this past August, a two-year-old boy toddled onto Boston’s Stanwood Street, a narrow neighborhood way lined on both sides with parked cars. A rideshare driver hit the child, whose blue-shirted body disappeared under the bumper, his hand flung upward. The driver slammed on the brakes; miraculously, the child survived.But it was not a miracle that saved him. Mere feet before hitting the child, the driver had slowed for a speed hump. Though Boston chief of streets Jascha Franklin-Hodge cannot say with certainty the speed bump saved the child’s life, the former Harvard Kennedy School (HKS) fellow is glad the hump was there. “Had that car been going faster,” he says, “there’s a very good chance that kid would not have lived.”Crashes, explains associate professor of surgery David Mooney, are “all kinetic energy.” Doubling a car’s speed quadruples its kinetic energy. “If you go just a little bit faster or a little bit slower, it’s a big difference,” he says. Only 10 percent of pedestrians die when struck by a vehicle traveling at 23 miles per hour—but a quarter die when the speed is 32 m.p.h., half at 42 m.p.h., and three-quarters at 50 m.p.h. Speed makes car-on-car and car-on-object collisions deadlier, too.Accordingly, safety-minded road planners look for every opportunity to reduce vehicle speed. One might think speed could be reduced simply by lowering the speed limit, but reality is more complex. Stanwood Street’s posted speed limit of 20 m.p.h. (a “slow zone”) was reinforced by tightly parked cars, people unloading a car’s trunk, and speed humps—all physically encouraging the rideshare driver to go slowly. Jeff Speck, M.Arch. ’93, studies urban roads like this one, helping cities design safe, walkable streets through his firm, Speck Dempsey. In an urban environment, he says, drivers choose their speed based not on the posted limit but on “what feels safe and responsive in that context.”But drivers and city officials often dislike the interventions that encourage slow speeds. Many local leaders desire “elbow room,” so a driver who is exceeding the speed limit by 5 to 10 m.p.h. can still proceed easily. Designing a road for a speed faster than its posted limit invites everyone to speed.“Giving drivers a feeling of safety... makes them more dangerous.”When working in cities, Speck aims for his roads to broadcast physically that drivers should travel slowly. He removes the yellow center line, which can reduce driven speeds by 7 m.p.h.; narrows lanes to 10 feet (shrunk from the highway-standard 12 feet or extra-wide 14 feet); and adds bike lanes, street trees, and curbside parking to make the street look narrow, causing drivers to exercise more caution. “Giving drivers a feeling of safety,” he says, “makes them more dangerous.”One method of combating collisions is a “road diet”—removing lanes. Reducing a four-lane road to three lanes (one in each direction and one for turning) can decrease both speeds and collisions, often without affecting carrying capacity, says Speck. That extra space can be used to add separated bike lanes, expand sidewalks, and improve crosswalk visibility, enhancing biker and pedestrian safety. These road diets can spark local opposition, especially when businesses abut the street (they worry about ease of parking). But once implemented, these designs tend to be popular (or at minimum unnoticeable). “Every city has some streets that have more lanes than they need,” he says.Such lane changes can be made simply and cheaply. Former secretary and CEO of the Massachusetts Department of Transportation (MassDOT) Jamey Tesler recalled the 2021 reduction of the Harvard Bridge from four lanes to two, which added separated bike lanes. “We started with cones and built that as a temporary installation,” says Tesler, a former HKS fellow. Once MassDOT saw that the new arrangement made bikers and drivers safer without increasing congestion, the department added flex posts and made the change permanent.Attacking the ArteriesCounterintuitively, the safest American roads are the fastest ones. Per vehicle mile traveled, interstate highways claim fewer lives than any other type of road. Separating cars from other road users, making lanes wide and turns smooth, and minimizing intersections lead to a safe driving environment. But according to Speck’s business partner, former Massachusetts assistant secretary of transportation Chris Dempsey, M.B.A. ’12, “A century of highway engineering has made us less safe, not safer, when it comes to local roads.”The most dangerous roads are arterials: the category between local roads and interstates. Though arterials move traffic at high speeds, most lack key features responsible for interstate safety. Frequent turnoffs into storefront parking lots make the left and right lanes hazardous. Abutting retail developments invite pedestrians. Bikers ride in the right lane or a painted bike lane, exposed to high-speed cars. Accordingly, arterials account for a majority of road deaths and about two-thirds of pedestrian deaths. Pedestrians cross Philadelphia’s Roosevelt Boulevard, an almost 14-mile maze of chaotic traffic patterns that passes through some of the city’s most diverse and impoverished neighborhoods. Some crossings are longer than a football field and take four light cycles to complete. | PHOTOGRAPH BY JULIO CORTEZ These roads can be especially hard to fix because they are frequently controlled by states rather than cities or counties. State-owned roads are often more dangerous than city-owned ones, says MIT Mobility Initiative senior fellow David Zipper, M.B.A ’07. In Vox, he wrote that two-thirds of crash deaths in the 101 largest metropolitan areas occur on state roads, even though states control only 14 percent of urban road miles nationwide. (State roads, points out Massachusetts state senator William Brownsberger ’78, J.D. ’83, tend to feature highway-like speeds and thus deadlier crashes.) States, Zipper argues, are generally slower to adopt safety interventions than cities and towns.Layout MattersAsphalt is the great connector, linking homes and schools, stores and theaters. In some locales, such as city centers, people have many ways to get around safely: bus, train, car, or foot. But arterial roads can usually be safely navigated only by car. Sprawling auto-oriented suburbs, which funnel people onto arterials, require more driving than denser layouts.The safest environment is one where “you can get to where you need to go without driving.”These additional daily miles add up quickly—and with them, the transit death toll. The safest environment is one where “you can get to where you need to go without driving,” says Graduate School of Design associate professor of urban planning Carole Voulgaris. “It’s not just the design of the street, but it’s the overall form of the cities.”As housing becomes more expensive, Americans have increasingly been pushed out of walkable cities and into suburbs designed around the automobile. For lower-income residents, navigating car-centric neighborhoods without the expensive protection of a private automobile can be fatal. In April 2010, for example, Raquel Nelson got off a Cobb Community Transit bus with her three children. Her Marietta, Georgia, apartment was on the opposite side of a four-lane 45 m.p.h. arterial, and the nearest crosswalk was a third of a mile away. So, Nelson and her kids crossed the road without one, pausing in the concrete median island, as many of her neighbors did. But her four-year-old son ran ahead, where he was struck and killed by an impaired driver. Nelson was convicted of vehicular homicide—despite the fact that she did not own a car. Zipper says that incident is “so emblematic of how messed up we are in this country when we think about road safety….You blame a bereaved, distraught mother, instead of recognizing this is an utter failure of roadway design.”Dangerous DriversBut sometimes targeting individuals can improve road safety. In the mid 1980s, Jay Winsten launched the Center for Health Communication at the Harvard School of Public Health. Soon after, WBZ-TV reporter Dennis Kauff was killed by a drunk driver. “The press corps had lost one of their own,” recalls Winsten. “They were enraged.” Channeling that anger, he convened 45 local journalists to discuss how the media could educate about drunk driving.Though the campaign began with local news media, Winsten soon looked to Hollywood. In the late 1980s, he persuaded television screenwriters to incorporate drunk-driving prevention into 160 primetime episodes. Characters were driven by (and served as) designated drivers, and bartenders confiscated drunk characters’ keys. He wanted the messaging to be positive—the designated driver is (literally) the life of the party—rather than the negative (“don’t drink and drive”). Such messaging seems to have resonated. After remaining constant throughout the mid ’80s, alcohol-related traffic fatalities fell by a quarter during the first four years of the campaign, a period when non-alcohol-related road deaths declined by only 5 percent. (And the progress has continued: whereas in 1993, 59 percent of young adults reported serving as a designated driver, by 2008, that figure rose to 72 percent. )Winsten’s latest target is distracted driving. Pedestrian deaths began to rise in 2009—two years after the iPhone’s debut. Now director of the Chan School’s Road Safety Initiative, he says drivers distracted by their devices stop looking left and right and just focus straight ahead. But in this fractured media market, he has struggled to share his message: encouraging empathy for all road users. “We haven’t moved the needle,” he says. “No one’s been able to break through.”Both pedestrians and drivers navigate the streets while distracted, but planner Chris Dempsey emphasizes that distracted driving is far worse than distracted walking. “When you make a mistake as a pedestrian, you are putting yourself in harm’s way,” he says. “When you make a mistake as a driver, you are putting other people in harm’s way. They are not the same.”Designing “Complete Streets”Roads have not always been the domain of the car. In the early days of driving, cars had to share space with other road users like horses, trams, and people. But as the automobile grew more popular, American cities cleared the chaos, essentially granting cars exclusive use of streets. That did not make roads safer. By 1934, more than 30,000 Americans were dying on roads annually.During his tenure as U.S. Secretary of Transportation in the Obama administration, HKS Bloomberg professor of the practice of public leadership Anthony Foxx wanted to “hearken us back” to that era when “a street would be designed for any user who chose to access that street.” In 2014, he debuted the “Safer People Safer Streets” initiative, hoping to get localities to implement “complete streets” designed for drivers, bikers, and walkers. That program, with its focus on data collection, local-federal collaboration, and multimodality, laid the groundwork for the Department of Transportation’s present “Safe Systems” approach. That tactic, which then-U.S. Secretary of Transportation Pete Buttigieg ’04 debuted in 2022, encourages safer driver behavior, roads, vehicles, and speeds, alongside better post-crash care.Building safe, complete streets that tell drivers to proceed slowly and safely is hard work. Foxx noted that North Carolina, where he served as mayor of Charlotte, has about 80,000 lane miles of highway (a designation that does not just include interstate-style roads). “There isn’t enough cash coming through the door to fix all of these roads to a ‘complete street’ standard at one single time,” he says.Even with this balanced approach, MIT’s Zipper cautions against placing too much agency in drivers’ hands. Americans, he says, love to “blame individuals for what really are systemic and societal problems.” He recommends that safety advocates focus on highway engineers, construction companies, and policymakers, “separately from the road users, who are just going about their daily business. It’s not their job to build a safe system.”Emphasizing EnforcementAround Halloween, American drivers might encounter electronic highway signs reading, “HOCUS POCUS DRIVE WITH FOCUS.” While that punny message might not compel them to keep their hands off their phones, another type of sign might. This past April, Washington State’s King County debuted four “SmartSigns” that use infrared technology to check whether drivers are handling their phones. During the four-month pilot, activation of the signs did not result in citations. Instead, the signs simply flashed “Phone down” for texting drivers and “Slow down” for speeders. A SmartSign, produced by SaferStreet, flashes a message to a texting driver.| Photograph courtesy of Tim Hogan/SaferStreet Automated cameras can detect a wide range of driving infractions: speeding, running red lights, and blocking bus or bike lanes. But many states ban or restrict automated enforcement. Such was the case in Massachusetts until January 2025, when the legislature legalized cameras mounted on city and school buses. These cameras can ticket drivers for parking at a bus stop or passing a stopped school bus that has deployed its stop sign. Governor Maur"
