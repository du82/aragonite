full_description = '''Privacy Policy This page discloses the information-gathering and -dissemination practices for this website, harvardmagazine.com. Information Gathering and UsageWe collect and store e-mail addresses; however, we do not share or sell e-mail addresses or any other personally identifiable information about our Web visitors outside of Harvard—including those visitors who make donations through our site.Besides e-mail addresses, the information we may request on our Web forms includes: names, mailing addresses, telephone numbers, and descriptive information (such as one's Harvard affiliation and graduation year). We use this information to respond to specific requests, to personalize our communications, to communicate with subsets of our target audience, or to allow visitors to identify themselves when making use of such features as Cambridge 02138 (letters to the editor), website comments, and alumni class notes. If you do not wish to use our Web forms, please see our contact page for alternate ways to communicate with Harvard Magazine.Some members of Harvard Magazine's staff are authorized to cross-check information collected by this website against information stored in Harvard University databases (maintained elsewhere). Harvard Magazine does not retain external data; when we are authorized to access Harvard University data, we handle it very carefully, use it only for specific business purposes, and then discard it using secure means.Our Web server generates log files of the IP addresses of computers that access this website and of what files they access. These logs may be archived. We use cookies to maintain a user's identity between Web sessions. Our website uses Google Analytics tracking software. We use it to generate statistical reports and learn how people use our website. We share information about our Web traffic with business partners (such as advertisers), but these reports never contain personally identifiable information. Our website uses third-party ad-serving software to display its advertising. The software is provided by Google AdSense and Broad Street Advertising. Google AdSense uses cookies to identify unique visitors frequently tracking visitors across multiple websites.Our website uses third-party sharing tools (such as a tool that allows you to e-mail articles to friends by clicking links on our pages). Specifically, we use AddThis.com, which maintains its own privacy policy. This website may contain links to other websites. We are not responsible for the privacy practices or the content of other websites. Mediavine Programmatic Advertising (Ver 1.1)The Website works with Mediavine to manage third-party interest-based advertising appearing on the Website. Mediavine serves content and advertisements when you visit the Website, which may use first and third-party cookies. A cookie is a small text file which is sent to your computer or mobile device (referred to in this policy as a “device”) by the web server so that a website can remember some information about your browsing activity on the Website.First party cookies are created by the website that you are visiting. A third-party cookie is frequently used in behavioral advertising and analytics and is created by a domain other than the website you are visiting. Third-party cookies, tags, pixels, beacons and other similar technologies (collectively, “Tags”) may be placed on the Website to monitor interaction with advertising content and to target and optimize advertising. Each internet browser has functionality so that you can block both first and third-party cookies and clear your browser’s cache. The "help" feature of the menu bar on most browsers will tell you how to stop accepting new cookies, how to receive notification of new cookies, how to disable existing cookies and how to clear your browser’s cache. For more information about cookies and how to disable them, you can consult the information at All About Cookies.Without cookies you may not be able to take full advantage of the Website content and features. Please note that rejecting cookies does not mean that you will no longer see ads when you visit our Site. In the event you opt-out, you will still see non-personalized advertisements on the Website.The Website collects the following data using a cookie when serving personalized ads:IP AddressOperating System typeOperating System versionDevice TypeLanguage of the websiteWeb browser typeEmail (in hashed form)Mediavine Partners (companies listed below with whom Mediavine shares data) may also use this data to link to other end user information the partner has independently collected to deliver targeted advertisements. Mediavine Partners may also separately collect data about end users from other sources, such as advertising IDs or pixels, and link that data to data collected from Mediavine publishers in order to provide interest-based advertising across your online experience, including devices, browsers and apps. This data includes usage data, cookie information, device information, information about interactions between users and advertisements and websites, geolocation data, traffic data, and information about a visitor’s referral source to a particular website. Mediavine Partners may also create unique IDs to create audience segments, which are used to provide targeted advertising.If you would like more information about this practice and to know your choices to opt-in or opt-out of this data collection, please visit National Advertising Initiative opt out page. You may also visit Digital Advertising Alliance website and Network Advertising Initiative website to learn more information about interest-based advertising. You may download the AppChoices app at Digital Advertising Alliance’s AppChoices app to opt out in connection with mobile apps, or use the platform controls on your mobile device to opt out.For specific information about Mediavine Partners, the data each collects and their data collection and privacy policies, please visit Mediavine Partners. Users Located in the European Economic AreaIf you are located in the European Union, Iceland, Liechtenstein or Norway (the "European Economic Area"), please click here for additional information about ways that Harvard Magazine may collect, use, and share information about you. SecurityHarvard Magazine has taken reasonable precautions to secure the personal information collected. The alumni notes and obituaries section of this site, for example, is password-protected to allow access to registered users only. Registration and subsequent access to class notes and obituaries is limited to members of the Harvard community.Systems that relay payment information are PCI-compliant. Contacting UsIf you have any questions about this privacy statement, the practices of this website, or your dealings with this website, please contact our webmaster (webmaster@harvardmag.com). Changes to this PolicyHarvard Magazine reserves the right to change this policy from time to time, without advance notice. We will update the effective date whenever this occurs. Effective DateThe effective date of this policy is February 14, 2014. Last updated: May 30, 2018'''
