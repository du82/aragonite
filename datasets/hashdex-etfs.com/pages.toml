full_description = '''Hashdex Nasdaq Crypto Index US ETF Invest now Prospectus The Fund, an exchange traded product, is not registered under the Investment Company Act of 1940 (the “1940 Act”), and therefore is not subject to the same regulations and protections as mutual funds or traditional ETFs registered under the 1940 Act. USD 21.74 NAV Pricing As of February 28, 2025 USD 21.78 Closing Price As of February 28, 2025 790,000 Shares Outstanding As of March 3, 2025 USD 17.18M Total Net Assets As of March 3, 2025 Investment objectiveThe investment objective is for changes in the Shares' NAV to reflect the daily changes of the price of the Nasdaq Crypto US Settlement Price Index (NCIUSS) (the "Index"), less expenses and liabilities of the Trust. The Hashdex Nasdaq Crypto Index US ETF provides market-cap weighted exposure to bitcoin (BTC) and ether (ETH) through a regulated exchange-traded product. The fund invests directly in bitcoin and ether and trades under "NCIQ." Its benchmark, the Nasdaq Crypto US Settlement Price™ Index, has a rules-based methodology that may include more assets in the future.1 1. The Nasdaq Crypto US Settlement Price Index has a daily closing value of the Nasdaq Crypto UST™ Index. The inclusion of any asset beyond bitcoin and ether in the fund is dependent on SEC approval. Composition Name Weight (%) Bitcoin - BTC 87.4 Ethereum - ETH 12.6 As of March 2, 2025 (Subject to change) Product Details Fund terms and key facts Trading Symbol NCIQCUSIP 41809Y 102Inception Date 02/13/2025Exchange Availability NasdaqBenchmark Index NCIUSS - Nasdaq Crypto US Settlement Price™ Index*Management Fee 0.25%**ISIN US41809Y1029Options Not currently available Service providers Administrator U.S. Bancorp Fund Services, LLCMarketing Agent Paralel Distributors LLCSponsor Hashdex Asset Management Ltd. The Fund is not a fund registered under the Investment Company Act of 1940, as amended (1940 Act), and is not subject to regulation under the 1940 Act, unlike most traditional ETFs and mutual funds.*The Index is Nasdaq Crypto US Settlement Price™ Index (NCIUSS). The Index is designed to provide investment funds with a mechanism to offer investors price exposure to certain crypto assets and it is calculated by CF Benchmarks Limited. One cannot invest invest directly in an index.**The Sponsor may waive all or a portion of the Management Fee for stated periods of time. The Sponsor has agreed to temporarily reduce its Management Fee to 0.25% per annum through December 31, 2025. After December 31, 2025, a 0.50% Management Fee will apply. The Management Fee compensates the Sponsor for managing the Trust’s business and affairs. Calculated daily based on the Trust’s NAV, the fee accrues daily and is paid monthly in cash directly to the Sponsor. Brokerage and commission cost and other fees remain applicable.Paralel Distributors LLC, Hashdex Asset Management Ltd., and U.S. Bancorp Fund Services LLC are not affiliated. Holdings As of March 3, 2025 Name Shares Price Weight BITCOIN 177.94 84,146.08 87.18% ETHEREUM 993.72 2,214.08 12.81% Cash & Other 12.99 1 - Download all the Holding details (Holdings are subject to change) Performance Monthly Quarterly As of February 28, 2025 1M 3M YTD 1Y Since inception NCIQ (Market Price) - - - - - NCIQ (NAV) - - - - - The performance data quoted represents past performance. Past performance does not guarantee future results. The investment return and principal value of an investment will fluctuate so that an investor’s shares, when sold or redeemed, may be worth more or less than their original cost. Current performance may be lower or higher than the performance data quoted. Returns less than one year are cumulative.The market price is the final price at which a security is traded on a given trading day. Net Asset Value (NAV) is value per share on a specific date or time.Because the Fund will invest primarily in Bitcoin and Ether, an investment in the Fund will subject the investor to the risks of the crypto asset market, and this could result in substantial fluctuations in the price of the Fund’s shares.Shares of the Fund are bought and sold at market price (not NAV) and are not individually redeemed from the Trust. Any applicable brokerage fees and commissions apply and will reduce returns. Historical Premium / Discount As of February 28, 2025 Daily Statistics As of February 28, 2025 NAV Market Price Difference Premium / Discount 30-Day Median Bid/Ask Spread 20-Day Avg/Volume 21.74 21.78 0.04 0.20% 0.16% 18,527 Premium / Discount Summary Table As of February 28, 2025 Q1 2025 2025 Days Traded at NAV 1 1 Days Traded at Premium 6 6 Days Traded at Discount 4 4 Premium / Discount As of February 28, 2025 View Year 2025 (Feb 13 - Dec 31) Documents'''
