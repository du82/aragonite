full_description = "AMAZING APIS ON ANY DATAConnector HubYou have data. We have connectors that let you effortlessly deliver incredible APIs on that data.See connectorsHasura data connectorsData connectors enable Hasura DDN to connect to an external data source and instantly get an amazing API. They translate incoming API requests into an efficient query that leverages the native strengths of the underlying data source. Connectors are built on the open Native Data Connector (NDC) specification, and anyone can build a custom connector to bring a new data source into a Hasura API. The Hasura Connector Hub lists all the official connectors included with Hasura DDN, and verified connectors contributed by the community.Let’s build a connectorFollow this step-by-step course to build your own data connector.Start buildingNative Data Connector specGet a detailed understanding of how connectors function.Read the specExplore our SDKsOur Rust, Go, Python, and Typescript SDKs make it easy to build a connector.Explore SDKsBrowse our connectorsAllAvailableComing SoonAvailable(MotherDuck) DuckDB (Turso) SQLite AlloyDB PostgreSQLApache Phoenix AWS Aurora PostgreSQLAzure Cosmos DB for NoSQLAzure Cosmos DB for PostgreSQLAzure Database for PostgreSQLBigQuery BigQuery Cassandra Citus PostgreSQLClickHouseCockroachDB PostgreSQLDatabricks Databricks DuckDuckAPI Elasticsearch GCP Cloud SQL PostgreSQLGraphQL HTTP MongoDB MySQL Neon PostgreSQLNodeJS Lambda OpenAPI Lambda Oracle PostgreSQL Prometheus Data Qdrant Data Redshift SingleStore Data Snowflake Snowflake SQL Server Storage Data Stripe Timescale PostgreSQLTrino YugabyteDB PostgreSQLComing SoonMariaDBWeaviateDynamoDBNeo4jIBM DB2Frequently Asked QuestionsWhy build a native data connector?How do I build my own connector?Are there SDKs and code examples to help build connectors?How do I publish my connector to the Hub?How can I contribute to the specification and SDKs?"
