title = "Work with us | Universal data access layer for next-gen apps and AI"
description = "The fastest and simplest way to build, run, govern, and evolve a high-quality API layer on all your data. Work with us!"
full_description = "At Hasura, we’re a globally distributed team solving some of the hardest problems in data access. As the amount of data in the world explodes and as the need for building products and applications becomes more urgent, we believe that making data available to developers in a way they love (GraphQL ❤️) will address the most fundamental bottlenecks in making them productive. At Hasura we’re building tools and technology, based on a strong open-source foundation and ethos, with a focus on building a sustainable project, community and business around Hasura. Apart from maintaining our flagship open-source graphql-engine, we contribute to and financially support various open-source projects and foundations. Imagine a world where developers can choose their favorite databases and services (or activate legacy sources they hate working with!). Where much-needed security, performance and compliance policies just work, and don’t slow down the path to go from idea to reality. And of course, we make all this happen with great people. We’re a team of mission-driven individuals, and we’re continuously working towards creating a productive and high-impact environment for ourselves! We obsess about our users and their business so we can craft solutions that exceed expectations and inspire delight. We cross all barriers to work together towards our common goals, maintaining individual accountability. We move fiercely fast to problem-solve without fear of failure, to make improvements on a concrete hypothesis (bet) with every action. Our team is spread across multiple countries, allowing for remote work or in-person collaboration at our office spaces in San Francisco and Bangalore. We believe in a flexible work model that considers individual preferences and promotes effective teamwork. We offer the second Friday of every month as a day off. This time allows our team members to engage in activities that rejuvenate and recharge them personally. We have equipment and learning budgets to ensure that our employees have the necessary tools and resources to succeed in their roles. We invest in their growth and development by facilitating access to relevant learning opportunities."
