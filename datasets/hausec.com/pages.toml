title = "April | 2019 | hausec"
description = "1 post published by Hausec during April 2019"
full_description = 'April 15, 2019September 8, 2019 by Hausec CypherDog Cheatsheet Infosec Leave a comment Bloodhound is a phenominal tool that should be in every pentester’s toolkit, as it literally graphs an attack plan, but that also means that it’s just as useful to the blue team. When I do pentests or risk assessments and show the client Bloodhound, they’re both AmazedConfused on how to use it The tool in itself isn’t confusing, it’s just there’s so much data and so much you can do, that it becomes overwhelming quickly, especially from a blue team perspective where there’s all these paths leading to a domain controller. Often times, I just wanted to list only the machines that allowed Unconstrained Delegation, or just the output of the node details for all domain admins to see when their passwords were changed last. Generating these metrics was a pain, because you’d have to click on a node, screenshot, paste into report, then click on the next node and so on. Luckily, @SadProcessor read my mind and probably other people’s as well, and developed CypherDog. Instantly, this made generating statistics so much easier. You want the node details of every DA? Easy. You want to list every computer that allows Unconstrained Delegation? Done. This is all done via Powershell and it’s extremely simple to use. I encourage you to watch SadProcessor’s talk at Troopers on using CypherDog as it’s a phenomenal talk. With that being said, I figured I’d publish some of my favorite commands for CypherDog. This is more geared towards the blue team, but obviously that means the red team could use it too. First, setting up CypherDog is easy. Once you have Bloodhound worked and have active data in it, download the repository for CypherDog here, then import the .ps1 file. Import-Module .\CypherDog2.1.ps1 Stop the neo4j service net stop neo4j Open the neo4j config file in your neo4j directory /conf/neo4j.conf and uncomment the line that says dbms.security.auth_enabled=false So that it can use the DB without authentication locally. Then start neo4j net start neo4j And you can now see the commands you can use with CypherDog via the command BloodHound Here’s a few of my most used commands. Purpose CommandList all members of the Domain Admins groupList Member ‘DOMAIN ADMINS@DOMAIN.LOCAL’ | ft name,description,pwdlastset,lastlogon,serviceprincipalnames,homedirectoryList all computers that allow Unconstrained Delegation, list only the name and Object IDNode Computer | where unconstraineddelegation -eq $true | select name,objectsidFind all groups with ‘admin’ in itNodeSearch Group admin | ft name,descriptionPath find from user to Domain Admins groupPath User Group BOB@DOMAIN.LOCAL ‘DOMAIN ADMINS@DOMAIN.LOCAL’Path find from user to computerPath User Computer BOB@DOMAIN.LOCAL ‘EXCHANGE@DOMAIN.LOCAL’See what groups an object is part ofEdge User USER@DOMAIN.LOCAL MemberOf GroupSee what computers a user can RDP toEdge User BOB@DOMAIN.LOCAL CanRDP ComputerSee what users can RDP into a computerEdgeR User CanRDP Computer DC01.DOMAIN.LOCALSee what users have GenericWrite on a computerEdgeR User GenericWrite Computer DC01.DOMAIN.LOCALSee what users have GenericWrite into a groupEdgeR User GenericWrite Group ‘DOMAIN ADMINS@DOMAIN.LOCAL’View all objects with SPNsNode User | where hasspn -eq $true | ft name,serviceprincipalnamesView all high value groups and their descriptionsHighValue Group | ft name, descriptionView all GPOs and their pathNode GPO | ft name,gpcpathSee all OUs that allow inheritanceNode OU | where blocksinheritance -eq $false | ft nameView all user’s email addressesNode User | ft displayname, name, email View all 2003 machines. Replace 2003 with xp, 7, 10, 2012, etc. for that OS.Node Computer | where operatingsystem -match 2003 | ft name,operatingsystemView all GPOs for a domain. Press enter when PS asks for a ‘key’.NodeSearch GPO | where name -match DOMAIN | ft name,descriptionView if a computer with a specific OS has logged on recently (Use first four digits from toady’s Unix Epoch time: http://epochconverter.com) Node Computer | where operatingsystem -match 2008 | where lastlogontimestamp -match 1566 This list is of course not comprehensive and will be updated regularly, but these are just some of the ones I use the most. I’m open to any suggestions, feel free to message me on Twitter @haus3c Credits: CypherD0g – @SadProcessor BloodHound – @SpecterOps, @CptJesus, @Wald0, & @harj0y'
