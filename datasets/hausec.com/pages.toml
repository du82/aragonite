ctober 26, 2021October 26, 2021 Attacking Azure, Azure AD, and Introducing PowerZure Over the past decade, Azure’s presence in businesses has grown significantly as new features and support were added to Azure. The purpose of this article is to cover three main points: Explain the components of Azure and how they fit into a modern IT environment. Explain how certain things within Azure can be leveraged from… by Hausec January 31, 2020July 9, 2020 AzureHound Cypher Cheatsheet List of Cypher queries to help analyze AzureHound data. Queries under ‘GUI’ are intended for the BloodHound GUI (Settings>Query Debug Mode). Queries under ‘Console’ are intended for the Neo4j console (usually located at http://localhost:7474). Download the ‘Custom Queries’ json file here: https://github.com/hausec/Bloodhound-Custom-Queries GUI Return All Azure Users that are part of the ‘Global Administrator’ Role… by Hausec November 23, 2020March 10, 2021 Share this:TwitterFacebookLike Loading..."
