cations and you can even create a custom action (might be interesting). Figure 11: List of services available that have actions in a logic app. Notice the scroll bar. One that particularly stood out was AzureAD. Figure 12: List of Azure AD actions available Unfortunately, there wasn’t any really juicy actions like adding a role to a user, but the ability to create a user was an interesting case for a backdoor and adding a user to a group could mean privilege escalation if certain permissions or roles are tied to that group. Figure 13: Example layout of a logic app. When that URL is visited, it creates an AAD group. The question then was “What privileges does this logic app action fire as?”. The answer is that logic apps use a connector. A connector is an API that hooks in an account to the logic app. Of the many services available, there’s many that have a connector, including Azure AD. The interesting part of this abuse was that when I logged into the connector, it persisted across accounts, meaning when I logged out and switched to another account, my original account was still logged into the connector on the logic app. Figure 14: The connector on the action of the logic app. The abuse then, is that you’re a Contributor over a logic app which is using a connector, then you can effectively use that connector account to perform any available actions, provided the connector account has the correct role to do those actions. Figure 15: ‘intern’ is a Contributor over the logic app, which ‘hausec’ is used as a connector account, meaning intern can use ‘hausec’s roles for any actions available. Due to the sheer amount of actions available in a logic app, I chose not to implement this abuse into PowerZure at this time, however you can enumerate if a connector is being used using the Get-LogicAppConnector function. PowerZure 2.0 I’m happy to announce that I’ve re-written all of PowerZure to follow more proper coding techniques, such as using approved PowerShell verbiage, returning objects, and removal of several wrapper-functions. One of the biggest changes was the removal of the Azure CLI module requirements, as PowerZure now only requires the Az PowerShell & AzAD module to reduce overhead for users. Some Azure AD functions have been converted to Graph API calls. Finally, all functions for PowerZure now contain ‘Azure’ after the verb, e.g. Get-AzureTargets or Get-AzureRole . If you haven’t already seen it, PowerZure now has a readthedocs page which can be viewed here: https://powerzure.readthedocs.io/en/latest/ which has an overview of each function, its syntax & parameters, and its output example. The aim is to make this much more easily adopted by people getting into Azure penetration testing & red teaming. With PowerZure 2.0, there’s some new functions being released with it: Get-AzureSQLDB — Lists any available SQL databases, their servers, and the administrative userAdd-AzureSPSecret — Adds a secret to a service principalGet-AzureIntuneScript — Lists the current Intune PowerShell scripts availableNew-AzureIntuneScript — Uploads a PowerShell script to Intune which will execute by default against all devicesGet-AzureLogicAppConnector — Lists any connectors being used for logic appsNew-AzureUser — Will create a user in AADSet-AzureElevatedPrivileges — Elevates a user’s privileges in AAD to User Access Administrator in Azure if that user is a Global Administrator As part of any upgrade, several old bugs were fixed and overall functionality has been greatly improved as well. My goal is to put any potential abuses for Azure & Azure AD into PowerZure, so as our research journey continues I’m sure there will be more to come. Special Thanks to @_wald0 for helping with some of the research mentioned here."
