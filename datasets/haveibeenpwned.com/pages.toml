["https://haveibeenpwned.com/About"]
title = "Have I Been Pwned: Who, what & why"
description = "Have I Been Pwned allows you to search across multiple data breaches to see if your email address or phone number has been compromised."
full_description = '''I'm Troy Hunt, a Microsoft Regional Director and Microsoft Most Valuable Professional, blogger at troyhunt.com, international speaker on information security and the creator of Have I Been Pwned. I've been writing software for the web since the mid-90s and since 2013, I've been running this website. I built HIBP as a free resource for anyone to quickly assess if they may have been put at risk due to an online account of theirs having been compromised or "pwned" in a data breach. I wanted to keep it dead simple to use and easily accessible to ensure it could be of maximum benefit to the community. Charlotte is both my wife and chief of all operational things at HIBP. She has a background in organising technology conferences, specifically the NDC "Norwegian Developers Conference", which she coordinated around the globe from 2013 until 2021 when she joined me at HIBP. She also has qualifications and experience in public relations and entrepreneurship studies. Charlotte manages all the day to day logistics of HIBP, everything from customer onboarding to legal and finances. She coordinates all non-technical aspects of the service and is also regularly the coalface of customer support queries. Stefán is a fellow Microsoft Most Valuable Professional, regular conference speaker and open source software contributor. He joined HIBP on a part time basis in 2023 after many years of building integrations with the service and making community contributions to the open source components of it. Today, Stefán helps maintain and optimise the codebase as well as the cloud infrastructure from his home in Iceland. He plays an invaluable role in keeping the service fast, reliable and sustainable and regularly shares those experiences in his speaking activities. This site came about after what was, at the time, the largest ever single breach of customer accounts — Adobe. I often did post-breach analysis of user credentials and kept finding the same accounts exposed over and over again, often with the same passwords which then put the victims at further risk of their other accounts being compromised.'''
year_published = 2025
