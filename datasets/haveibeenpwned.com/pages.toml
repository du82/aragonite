["https://haveibeenpwned.com/PwnedWebsites"]
title = "Have I Been Pwned: Pwned websites"
description = "Have I Been Pwned allows you to search across multiple data breaches to see if your email address or phone number has been compromised."
full_description = '''Here's an overview of the various breaches that have been consolidated into this Have I Been Pwned. These are accessible programmatically via the HIBP API and also via the RSS feed. In approximately March 2015, the free web hosting provider 000webhost suffered a major data breach that exposed almost 15 million customer records. The data was sold and traded before 000webhost was alerted in October. The breach included names, email addresses and plain text passwords. Breach date: 1 March 2015 Date added to HIBP: 26 October 2015 Compromised accounts: 14,936,670 Compromised data: Email addresses, IP addresses, Names, Passwords Permalink In March 2020, the stock photo site 123RF suffered a data breach which impacted over 8 million subscribers and was subsequently sold online. The breach included email, IP and physical addresses, names, phone numbers and passwords stored as MD5 hashes. The data was provided to HIBP by dehashed.com. Breach date: 22 March 2020 Date added to HIBP: 15 November 2020 Compromised accounts: 8,661,578 Compromised data: Email addresses, IP addresses, Names, Passwords, Phone numbers, Physical addresses, Usernames Permalink In approximately 2012, it's alleged that the Chinese email service known as 126 suffered a data breach that impacted 6.4 million subscribers. Whilst there is evidence that the data is legitimate, due to the difficulty of emphatically verifying the Chinese breach it has been flagged as "unverified". The data in the breach contains email addresses and plain text passwords. Read more about Chinese data breaches in Have I Been Pwned. Breach date: 1 January 2012 Date added to HIBP: 8 October 2016 Compromised accounts: 6,414,191 Compromised data: Email addresses, Passwords Permalink In April 2016, customer data obtained from the streaming app known as "17" appeared listed for sale on a Tor hidden service marketplace. The data contained over 4 million unique email addresses along with IP addresses, usernames and passwords stored as unsalted MD5 hashes.'''
