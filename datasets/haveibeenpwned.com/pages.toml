["https://haveibeenpwned.com/Donate"]
title = "Have I Been Pwned: Donate"
description = "Have I Been Pwned allows you to search across multiple data breaches to see if your email address or phone number has been compromised."
full_description = '''Many people love this service and have asked to donate. In all good conscience, I can't write about how awesome and cost-effective Azure is then ask for donations to fund it. Instead, it's enormously time consuming to run this service and the sacrifices required to do so are where the real cost is. If you want to kick in to help me cover those costs, that would be awesome! Choose what you'd like to donate from the items below then click the green "Donate" button next to it: It's ongoing work running this service and what's really great is ongoing support. Here's a sense of what goes into loading each and every data breach in the system: I have to locate the data online, get it downloaded (over Australian internet speeds...), process it into a readable format, verify it's legitimate, load it into the site, locate an icon and write a description of the incident then finally make it live and send notifications to subscribers. Things just work better with coffee! I like to take the kids to school then grab a cappuccino from my local on the way home before beginning the things that take mental energy. A lot of the work on this happens after hours when I should be relaxing on the couch. Help me make it so and I promise to keep off the devices for a bit! This site sends out tens of thousands of emails every month. For that volume and to ensure deliverability, I pay SendGrid each month. I often try and slip in an hour or two of work between getting the kids to bed and having dinner. You know what goes down real well at that time of day? Course you do! You know how the domain-wide search feature allows you to verify by email? Yeah, that ain't free, I have to buy access to an API which provides that info. Much of the work on this service happens on weekends which means giving up time with the kids. Let's show them a good time! A favourite routine after pushing out a major new feature is to sit back with a glass of fine American Whiskey whilst watching for any problems on the various monitoring services.'''
year_published = 2025
clearnet = "https://haveibeenpwned.com/Donate"
