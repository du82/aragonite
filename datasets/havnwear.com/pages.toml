 health & wellbeing.DescriptionThe lightweight WaveStopper™ Beanie is built with an inner 360º silver lining of WaveStopper™ fabric that blocks 99.7% EMF. As a lightweight version, it provides the ideal comfort and brain protection while sleeping, being inside, or during warmer days.WaveStopper™ certified: blocks 99% of EMFs (cell phone radiation, 4G, 5G, Wi-Fi, Bluetooth)UPF-50+: blocks 99% of harmful UV rays (UVAs and UVBs)Antimicrobial & anti-odorMaterial & CareComposition: WaveStopper™ inner layer: 100% pure silver fibers. Outer layer: 95% cotton, 5% Spandex.Certified with the OEKO-TEX® Standard 100, our materials are rigorously tested to be free from harmful substances, ensuring safety and quality in every thread. Our products do not contain any nanoparticles.To extend the life of HAVN products, wash on cold and delicate, using your regular detergent, and hang dry or low tumble. HAVN is designed to adapt to your body for the perfect fit after the first wash.Lab Verified ProtectionThis product is tested and certified using IEEE-299 and EN 62209-2 standards by leading independent laboratories. In addition, they are Antibacterial/Antimicrobial. See the full results here.Shipping & ReturnEnjoy free shipping on orders over $200, and free returns on all orders within 30 days of receipt using a hassle-free pre-paid label. US customers only.Price TransparencyYup. We know. It’s not cheap. So what makes HAVN more expensive than your average big bucks store garment?#1, the fabric. Our proprietary fabric uses over 40% of silver fibers and cost the same to produce as cashmere. This is not counting the R&D cost in order to make it soft and cozy.#2, the manufacturing. We care about making the most premium, high-quality clothing on the planet. To ensure this, we partnered with a factory that pays equitable wages, offers fair time-off, and is certified OEKO-TEX – the highest environmental rating. This commitment also means we pay a ~30% premium on manufacturing, a choice we proudly stand by.#3, the quality-control. You trust us with your long-term health. We take this seriously. That means that we have increased quality control to ensure every production batch is respecting our highest quality standards.All in, our cost of production is ~10x that of a normal, equivalent piece of clothing. Now, we could (maybe) do it without #2 and #3. But it wouldn't be right. It wouldn't be HAVN. Our commitment? With us, you will always get what you pay for.9,505 People Love Their Lightweight Beanie10/10 health is wealth"After 5 minutes, my brain felt an instant release. Best way to explain, enhances focus as well I would recommend wearing during studying, testing, driving, however this suits your life!"Jordan G. Verified BuyerBetter Sleep"I wear my beanie at night and have noticed that I sleep deeper and more restful." Kathryn M. Verified BuyerI am a fan"My daily routine starts with putting 3 pieces of WaveStopper clothes, boxer, shirt, and beanie or hat. The benefits are amazing, like good night sleep, keeps mind focused and sharp."Hailu S. Verified BuyerFaraday Beanie Review"Huge positive effect on sleep. Definitely blocks a frequency range of EM waves. Very much worth the price. Helps dampen aura's associated with epilepsy."Robert B. Verified BuyerMost versatile beanie ever!"I wear mine nearly every day. The beanie is comfortable as a sleep cap and kind on fine hair. It works in all kinds of weather. Best of all, I can insert it into many of the other hats I've neglected since discovering Lambs -- and voila! I have Faraday protection in all kinds of headgear! "Anne Verified BuyerLove this cap!"This cap is just what I was looking for! It is lightweight enough to wear while sleeping and is very comfortable. It stops the high pitched frequencies my ears tend to pick up from time to time, so I know it is working to protect my brain from EMF nasties."Helene B. Verified BuyerRadiation-Proof TechnologyYour browser does not support this video.LAB TESTED AND 