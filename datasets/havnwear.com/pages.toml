full_description = 'Your browser does not support this video.The science behind HAVNThe Science Behind HAVNHAVN’s special fabric-technology blocks external stressors from impacting your body. By doing so, it reduces the associated effects of oxidative stress, increases HRV, and supports your immune system. It’s the ultimate health-enhancing apparel.Current Page NavigationWearing HAVN Reduces Oxidative Stress Caused by External StressorsOxidative Stress 101Free radicals vs antioxidantsWhat is oxidative stress?The negative effects of oxidative stressOxidative stress factorsHow HAVN Mitigates Oxidative StressRadiation proof to block wireless radiationUPF-50 to block UV radiationPositive effects of mitigating wireless and UV radiationDocumented Positive Effects of Wearing HAVNIncreased HRV - Indicating Bodily Stress ImprovementWhat is the autonomic nervous system (ANS)?What is heart rate variability (HRV)Pre-studies show that wearing HAVN increases HRV by 18%Heart Rate VariabilityResting Heart RateWhy it mattersUser Reported Benefits of Wearing HAVNPositive Effects on Sleep, Fertility, and CognitionWearing HAVN Reduces Oxidative Stress Caused by External Stressors<img alt="" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" srcSet="https://res.cloudinary.com/lambs/image/upload/f_auto,w_640,q_auto,c_limit/img/pages/science/science-header-1.png 1x, https://res.cloudinary.com/lambs/image/upload/f_auto,w_1080,q_auto,c_limit/img/pages/science/science-header-1.png 2x" src="https://res.cloudinary.com/lambs/image/upload/f_auto,w_1080,q_auto,c_limit/img/pages/science/science-header-1.png"/>Oxidative Stress 101Free radicals vs antioxidantsFree radicals vs antioxidantsOxidative stress is an imbalance between reactive oxygen species (free radicals) and antioxidants. Free radicals are oxygen-containing molecules that are missing an electron.Atoms that are missing an electron are unstable. As such, free radicals are highly reactive and seek other atoms or molecules to steal an electron from to gain stability. By doing so, they create another free radical missing an electron. This process is called oxidation. Oxidation our bodies is normal and is kept in balanced by antioxidants.Antioxidants are molecules that can donate an electron without becoming free radicals themselves. By doing so, they are able to stabilize free radicals without becoming reactive themselves.What is oxidative stress?What is oxidative stress?Oxidative stress occurs when the number of free radicals outweigh the body’s ability to detoxify with antioxidants. The free radicals can damage the components of our cells, including DNA, proteins and lipids, and can cause disruption in our normal mechanisms of cellular signaling. Oxidative stress causes damage to our body’s cells and causes a wide range of diseases as well as causes symptoms of aging such as wrinkles.As a summary, oxidative stress occurs when there are more free radicals in the body than our antioxidants can counteract, and it is a damaging state for our tissues that can lead to a number of short term and long-term symptoms and diseases.The negative effects of oxidative stressDamage from oxidative stress is associated with the development of a number of modern diseases [1, 3], such as:The negative effects of oxidative stressLungs- Asthma [1]- Chronic Bronchitis [1]Kidneys- Glomerulonephritis [1]- Chronic renal failure [3, 64]Fertility- Infertility [28, 52]- Fetal development [67-69]Joints- Arthritis [1]- Rheumatism [5, 16, 63]Eyes [65, 66]- Cataract [1]- Retinal diseases [1]Skin- Premature aging [33-35, 55]- Skin Cancer [1]Multi-organs- Cancer [2-8]- Autoimmune [44, 45]- Diabetes [53]- Inflammation [16, 21]- Infection [1]Heart-Vessels [60-62]- Cardiovascular disease[10-12, 3, 48]- Arteriosclerosis [1]- Hypertension [1]- Ischemia [1]- Cardiomyopathy [1]- Heart failure [1]Brain- Alzheimer’s [14, 50]- Parkinson’s [51]- Chronic fatigue syndrome [46, 47]- Neurodegenerative diseases [49]- Depression [54]- Stroke [1]Oxidative stress factorsOxidative stress factorsOxidation is a process that naturally happens in our body as part of our immune system, and free radicals are naturally produced by inflammation or exercise.However, oxidative stress can happen when having an increased exposure to free radicals from the environment. Sources that can increase free radicals include:SmokingWireless radiation [38-40]UV [36, 37]PollutionAlcoholSome pesticides and toxic chemicals<img alt="" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" srcSet="https://res.cloudinary.com/lambs/image/upload/f_auto,w_384,q_auto,c_limit/img/pages/science/science-header-2.png 1x, https://res.cloudinary.com/lambs/image/upload/f_auto,w_750,q_auto,c_limit/img/pages/science/science-header-2.png 2x" src="https://res.cloudinary.com/lambs/image/upload/f_auto,w_750,q_auto,c_limit/img/pages/science/science-header-2.png"/>How HAVN Mitigates Oxidative StressHAVN mitigates the risk of oxidative stress by blocking external stressors responsible for triggering free radicals production in your body. The unique fabric-technology by HAVN is the world’s first fabric incorporated in everyday apparel that blocks the majority wireless radiation (cellphone, Wi-Fi, 4G, 5G, Bluetooth) and that is UPF50+ (blocking over 98% of harmful UV - vs 20% for normal apparel).Radiation proof to block wireless radiationRadiation proof to block wireless radiationDownload the report: MET Labs, Baltimore, USADownload the report: EMITECH, FranceDownload the report: MET Labs, Baltimore, USADownload the report: EMITECH, FranceWhat is wireless radiation?Wireless radiation, or EMF, is a continuous field produced by electrically charged objects such as your cellphones and Wi-Fi. EMF travels in a wave-like pattern at the speed of light and this propagation is called electromagnetic radiation.Some electromagnetic fields are produced naturally, like the low intensity EMF emitted by our body. However, tech-made EMF — those transmitted by cellphones and Wi-Fi — are unnatural and cause your body to react. They can cause short-term and long-term health risks.WaveStopper™ is the only scientifically proven solution that blocks 99% of wireless radiation from reaching your body. WaveStopper™ has been independently tested in two different ways to insure its full efficacy:By measuring its electromagnetic shielding according to the IEEE-299 standard.In a Human Model according to the EN 62209-2 standard. This is done using a ELI4 phantom filled with liquids simulating tissue (a physical and chemical replica of a human body) and measuring the Specific Absorption Rate with and without wearing WaveStopper™. This is particularly important as it represents real life conditions.Our tests have been done in top internationally renowned independent laboratories and confirmed that WaveStopper™ blocks over 99% of wireless radiation from traditional consumer devices (cellphone, Wi-Fi, Bluetooth).<img alt="Heatmap which shows significantly less radiation compared to the other image" loading="lazy" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:contain" sizes="100vw" srcSet="https://cdn.shopify.com/s/files/1/0023/1633/7241/files/radiation-with-lambs.png?v=1737772963&amp;width=640 640w, https://cdn.shopify.com/s/files/1/0023/1633/7241/files/radiation-with-lambs.png?v=1737772963&amp;width=750 750w, https://cdn.shopify.com/s/files/1/0023/1633/7241/files/radiation-with-lambs.png?v=1737772963&amp;width=828 828w, https://cdn.shopify.com/s/files/1/0023/1633/7241/files/radiation-with-lambs.png?v=1737772963&amp;width=1080 1080w, https://cdn.shopify.com/s/files/1/0023/1633/7241/files/radiation-with-lambs.png?v=1737772963&amp;width=1200 1200w, https://cdn.shopify.com/s/files/1/0023/1633/7241/files/radiation-with-lambs.png?v=1737772963&amp;width=1920 1920w, https://cdn.shopify.com/s/files/1/0023/1633/7241/files/radiation-with-lambs.png?v=1737772963&amp;width=2048 2048w, https://cdn.shopify.com/s/files/1/0023/1633/7241/files/radiation-with-lambs.png?v=1737772963&amp;width=3840 3840w" src="https://cdn.shopify.com/s/files/1/0023/1633/7241/files/radiation-with-lambs.png?v=1737772963&amp;width=3840"/>WITH HAVN<img alt="Heatmap which shows significantly more radiation compared to the other image" loading="lazy" decoding="async" data-nimg="responsive" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%;object-fit:contain" sizes="100vw" srcSet="https://cdn.shopify.com/s/files/1/0023/1633/7241/files/radiation-without-lambs.png?v=1737772916&amp;width=640 640w, https://cdn.shopify.com/s/files/1/0023/1633/7241/files/radiation-without-lambs.png?v=1737772916&amp;width=750 750w, https://cdn.shopify.com/s/files/1/0023/1633/7241/files/radiation-without-lambs.png?v=1737772916&amp;width=828 828w, https://cdn.shopify.com/s/files/1/0023/1633/7241/files/radiation-without-lambs.png?v=1737772916&amp;width=1080 1080w, https://cdn.shopify.com/s/files/1/0023/1633/7241/files/radiation-without-lambs.png?v=1737772916&amp;width=1200 1200w, https://cdn.shopify.com/s/files/1/0023/1633/7241/files/radiation-without-lambs.png?v=1737772916&amp;width=1920 1920w, https://cdn.shopify.com/s/files/1/0023/1633/7241/files/radiation-without-lambs.png?v=1737772916&amp;width=2048 2048w, https://cdn.shopify.com/s/files/1/0023/1633/7241/files/radiation-without-lambs.png?v=1737772916&amp;width=3840 3840w" src="https://cdn.shopify.com/s/files/1/0023/1633/7241/files/radiation-without-lambs.png?v=1737772916&amp;width=3840"/>WITHOUT HAVNFrequencyRadiation blocked700 MHz 99.99 %2.4 GHz 99.98 %5 GHz 99.95 %26 GHz 99.92 %40 GHz 99.86 %UPF-50 to block UV radiationUPF-50 to block UV radiationDownload the report: MET Labs, Baltimore, USADownload the report: MET Labs, Baltimore, USAWhat is ultraviolet radiation?Ultraviolet (UV) radiation is a form of non-ionizing radiation that is emitted by the sun. Just like EMFs, UV radiation causes oxidative damage of the cells. This is due to the release of inflammatory cytokines which in turn generates free radicals, or reactive oxygen species (ROS) that damages lipids, proteins and DNA. Ultraviolet Light Induced Generation of Reactive Oxygen SpeciesUV rays damage collagen fibers, resulting in photoaging, wrinkles, leathery skin, and skin cancer.WaveStopper™ Technology by HAVN underwent a UV protective properties test according to the AATCC 183-2020 testing method, and is rated UPF value of >50. This means that WaveStopper™ blocks over 98% of UV rays from penetrating your skin.UV radiation from the sun has been documented to damage DNA as well as create an increase in free radicals and oxidative stress.Regular garments do not block all of the sun’s harmful UVs. The standard rating for the sun protection of a garment is UPF (Ultraviolet Protection Factor), which represents the ratio of sunburn-causing UV measured without and with the protection of the fabric.The average UPF of a linen or cotton t-shirt is about 5, which means that it allows about ⅕ (or 20%) of UV to penetrate your skin.Test ItemResults (Dry)Results (Wet)T(UVA)AV ( % )0.860.40T(UVB)AV ( % )0.560.28Block (UVA)AV (%)99.1499.60Block (UVB)AV (%)99.4499.72UPFAV (%)163.16328.76UPF Value>50>50Test Condition: Temp 21.4˚C | C R.H. 65.1% | Wet Pick-up 140%Positive effects of mitigating wireless and UV radiationPositive effects of mitigating wireless and UV radiationBy blocking wireless + ultraviolet radiation and mitigating the associated oxidative stress, wearing HAVN can:PromoteImmune system [77]Healthy aging [33-35, 55]Healthy skin [31, 32]Memory, learning, and attention [58, 59]Cognition [20-23]Fertility [24-30, 41-43, 52]Testosterone production [56, 57]Gut health [70-72]Reduce the risk ofCancer [2-8, 39, 73]Neurodegenerative diseases [49], such as Alzheimer’s [14, 50], Parkinson’s[51]Heart disease [3, 10, 48]and hypertension [11, 12]Headaches [74, 75], brain fog [20-23]Behavioral problem [59]Diabetes [53]Skin Cancer [32]SunburnsDocumented Positive Effects of Wearing HAVN<img alt="" loading="lazy" decoding="async" data-nimg="intrinsic" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" srcSet="https://res.cloudinary.com/lambs/image/upload/f_auto,w_640,q_auto,c_limit/img/pages/science/science-header-3.png 1x, https://res.cloudinary.com/lambs/image/upload/f_auto,w_828,q_auto,c_limit/img/pages/science/science-header-3.png 2x" src="https://res.cloudinary.com/lambs/image/upload/f_auto,w_828,q_auto,c_limit/img/pages/science/science-header-3.png"/>Increased HRV - Indicating Bodily Stress ImprovementHeart Rate Variability (HRV) is a measure of our Autonomous Nervous System (ANS) that is widely accepted as one of the best, non-invasive measures of our body’s recovery and ability to perform. A high HRV is a good sign that the body is performing at a higher level.What is the autonomic nervous system (ANS)?What is the autonomic nervous system (ANS)?The autonomic nervous system (ANS) is a system that regulates our involuntary body’s functions including heart rate, digestion, respiration, blood pressure, sexual arousal, and pupillary response.The ANS is comprised of three branches; the sympathetic nervous system, the parasympathetic nervous system and the enteric nervous system [79]Because in most cases, the sympathetic nervous system and the parasympathetic nervous system have opposite effects on our body’s functions, they are considered to be in a balance with one system sometimes dominating over the other.Sympathetic Nervous SystemThe Sympathetic branch, when activated, promotes a “Fight or Flight” response. The body tenses up, speeds up and becomes more alert. It shuts off any function that is not necessary for survival until we escape the threat (whether it’s a wolf chasing us or a stressful meeting). Amongst the specific reactions [80, 81] are:Diverting blood-flow away from the Gastro Intestinal track and skinMuscle contractionIncrease in heart rate and contraction.Blood flow and oxygen exchange increase in the lungsContraction of urinary and intestinal sphinctersPupil dilatationParasympathetic Nervous SystemThe Parasympathetic branch has the opposite effect and counterbalances the Sympathetic branch.'
