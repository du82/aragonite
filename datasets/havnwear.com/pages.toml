isplayed on the Site are excluding taxes. Taxes and shipping rates are applied per order. The exact taxes and shipping rates depend on the country where your order is being delivered to.Free shipping cost for any order higher than USD (price after all forms of rebate, reduction or other advantages and excluding delivery costs).Prices are quoted in U.S. Dollars.The total price specified in the final checkout screen includes tax and shipping costs. If paying by credit card, the total amount for your entire order will be reflected on your statement in your local currency.If your local currency is different from the currency in which the prices are quoted, your bank will apply the exchange rate applicable per the date of purchase. Your bank may apply a different exchange rate, which is beyond our control.Right to reject an orderFulfillment of all orders on the Site is subject to availability. We explicitly reserve the right not to accept your order for any reason or to cancel one by written notice to you in the following situations, without being liable for any damage or costs other than repayment of any amount received from you in relation to the order you placed:– the product is not available anymore ;– your billing information is not correct or not verifiable;– we have reason to believe that you are a reseller;– there was an error in the price displayed on the Site;– we could not deliver to the address provided by you;– due to an Event Outside Our Control (see art. 10 below); or– in the event of misspelling, pricing or other errors or mistakes in the Site information.In the above-mentioned situations, HAVN will contact the Customer by email.Placing an order on the SiteFind the products you want, choose a color, a size and a pack before adding it to your shopping cart. Select a delivery address and a billing option. Please review your order before proceeding to checkout. Receive an online order acknowledgment.When you submit an order we will send you an email acknowledging receipt of your order. This does not mean that we have accepted your order. Our acceptance of the order takes place when the Products are shipped to you – we will send you an email confirming that the Products have been shipped (“Order Confirmation”).If we are unable to supply you with a Product, we will inform you of this in writing and will not process the order.PaymentCustomers can either pay their order by credit card (Visa, Mastercard or American Express) or Paypal.If you pay by credit card, we will deduct the amount due from your account as soon as your order leaves our warehouse. Payments can only be processed if the billing information can be verified. We retain title in any Product(s) until we have received full payment for such Product(s).The payment solution used by HAVN is 100% secure. The secure platform proposed on the online store is STRIPE. STRIPE platform complies with regulations concerning credit cards remote and online payments.DeliveryThe Products are delivered to the address provided by the Customer when ordering. The Customer must ensure that he provided accurate and complete information regarding the delivery address.HAVN delivers its Products in France and in most countries of the world. Details about delivery times indicated on the Site before placing an order are not binding. HAVN cannot be held responsible for consequences due to delayed delivery.Inspection upon deliveryUpon delivery, the Customer must inspect the packaging for damage. If it appears that the products are damaged, please do not accept the shipment.The customer must check the conformity of Products. In case of any anomaly concerning the Product, the customer must notify HAVN within 24 hours from receipt. After this period, HAVN disclaims any responsibility.Taxes and customs dutiesEach order that comes through the Site may be subject to the taxes and customs laws that are in place when the parcel reaches its destination. HAVN will not refund customs duties and sales taxes for orders sent to destinations outside the United States. All orders are shipped from the United States.Right of withdrawal, return and refund policyThe Customer has hundred (100) calendar days, beginning the day after receipt of a product by him or by a third party other than the carrier and indicated by the Customer, to cancel the Customer’s purchase without giving any reason and without penalty or any cost of return. These are taken care of by HAVN. At the end of this 100 days period, the Customer can no longer exercise his right of withdrawal.The Customer must return the cancelled items to HAVN no later than 100 days from the day on which he has notified his decision to cancel the order.The product shall be returned in its original packaging, unworn, in perfect condition along with the delivery receipt to the address provided by the customer service and following the instructions given by the customer service.Any Products that are damaged, incomplete, used, worn, washed, soiled or returned with a damaged original packaging will not be taken back or exchanged by HAVN. If the seal and/or the tags affixed to the Products are broken or removed, HAVN may also not take back the Products.The Customer shall use the Product Return Form, available on the Site, to follow the instructions and return the Product.On his firts order, the Customer has (30) calendar days, beginning the day after receipt of a product by him or by a third party other than the carrier and indicated by the Customer, to cancel the purchase without giving any reason. The Customer will have the right to keep the worn underwear and will be 100% refunded. This will be limited to one order per customer and only one pair per Customer. Refund policy. The Customer will only obtain a refund of the Products under this Article if he proves that the Product has been returned. The Customer shall therefore return the product in a way allowing the written proof of the date of return. HAVN will refund the price