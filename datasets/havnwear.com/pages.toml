 99% of EMFs (cell phone radiation, 4G, 5G, Wi-Fi, Bluetooth)UPF-50+: blocks 99% of harmful UV rays (UVAs and UVBs)Antimicrobial & anti-odorMaterials & CareWaveStopper™ Composition: 53% cotton, 42% pure silver fibers, 5% polyester.Certified with the OEKO-TEX® Standard 100, our materials are rigorously tested to be free from harmful substances, ensuring safety and quality in every thread. Our products do not contain any nanoparticles. We use high-quality polyester to bind cotton and silver fibers together, with minimal to no contact with your skin.To extend the life of HAVN products, wash on cold and delicate, using your regular detergent, and hang dry or low tumble. HAVN is designed to adapt to your body for the perfect fit after the first wash.Lab Verified ProtectionThis product is tested and certified using IEEE-299 and EN 62209-2 standards by leading independent laboratories. In addition, they are Antibacterial/Antimicrobial. See the full results here.Shipping & ReturnEnjoy free shipping on orders over $200, and free returns on all orders within 30 days of receipt using a hassle-free pre-paid label. US customers only.Price TransparencyYup. We know. It’s not cheap. So what makes HAVN more expensive than your average big bucks store garment?#1, the fabric. Our proprietary fabric uses over 40% of silver fibers and cost the same to produce as cashmere. This is not counting the R&D cost in order to make it soft and cozy.#2, the manufacturing. We care about making the most premium, high-quality clothing on the planet. To ensure this, we partnered with a factory that pays equitable wages, offers fair time-off, and is certified OEKO-TEX – the highest environmental rating. This commitment also means we pay a ~30% premium on manufacturing, a choice we proudly stand by.#3, the quality-control. You trust us with your long-term health. We take this seriously. That means that we have increased quality control to ensure every production batch is respecting our highest quality s