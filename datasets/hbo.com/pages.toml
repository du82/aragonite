 the Chimps Save the Chimps, situated on 150 acres in Florida, is one of the largest chimpanzee sanctuaries in the world. Its mission is to provide refuge and lifelong care to chimpanzees in need, including Tonka. To see how Tonka is thriving in his new home, click "Learn More." Learn MoreRainforest Trust Rainforest Trust saves chimpanzees in the wild in Africa — and other endangered wildlife globally — by permanently protecting their rainforest habitat. The nonprofit has secured homes for 10,000 threatened chimps across 12 countries. Learn MoreJane Goodall Institute The Jane Goodall Institute is a global community conservation organization that advances Dr. Jane Goodall’s work in protecting chimpanzees and inspiring people to conserve the natural world we all share. Learn More #footer-max-banner::before { content: ''; position: absolute; width: 100vw; height: 280px; z-index: -1; left: 0; background-size: cover; background-image: url('https://static.hbo.com/2024-10/241101-max-brand-quilt-cropped.jpg'); } #footer-max-banner { height: 280px; overflow: hidden; width: 100vw; color: white; } #footer-max-banner .btn { width: 120px; } #footer-max-banner a.btn:hover { background: #00F0FF; border-color: #000066; color: #000066; } @media screen and (min-width: 996px) { #footer-max-banner > .middle-column { width: 600px; } } @media screen and (min-width: 1400px) { #footer-max-banner::before { height: 300px; } #footer-max-banner { height: 300px; } } Stream all of HBO, plus hit series, movies, reality, and more. Sign Up Now ABOUTGET HBOHELPSHOPCAREERSHBO INSPIRESHOW TO WATCH MAXPrivacy PolicyTerms of UseAd ChoicesDo Not Sell My Personal Information© 2024 Home Box Office, Inc. All Rights Reserved.This website may contain mature content.'''
