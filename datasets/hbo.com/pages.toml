full_description = '''SERIESMOVIESNEW & LAST CHANCESCHEDULEFREE EPISODESMoreDocumentariesSpecialsSportsPodcastsMaxSIGN INSIGN UP FORSIGN INSIGN UP FORSERIESMOVIESNEW & LAST CHANCESCHEDULEFREE EPISODESMoreDocumentariesSpecialsSportsPodcastsMaxSIGN INSIGN UP FORSIGN INSIGN UP FORmax-styleEXPLOREAbout Season Season 1ALL EPISODES NOW STREAMING Chimp Crazy 1 Seasons | 4 Episodes | TV-MA Watch NowMAXFormer nurse-turned-exotic-animal-broker Tonia Haddix, who refers to herself as the “Dolly Parton of chimps,” spends her days caring for animals in captivity. However, her limitless love for one chimpanzee spins into a wild cat-and-mouse game with authorities and an animal rights group. Through the experiences of Tonia and other “chimp moms,” Chimp Crazy reveals the bonds between owners and their highly intelligent great ape pets, the risks humans take when they raise these animals as members of their family, and the risks to the welfare of the animals themselves. HBO Documentary Films presents Chimp Crazy, a Goode Films Production; director, Eric Goode; producers, Lissa Rivera, Evan Wise, Tim Moran, Adrienne Gits, Charles Divak, Doug Abel, James Liu, Carissa Ridgeway, and Dwayne Cunningham; executive producers, Jeremy McBride and Eric Goode. For HBO: executive producers, Nancy Abraham, Lisa Heller, and Tina Nguyen. more 1.Monkey LoveA 4-PART DOCUMENTARY SERIES ON CHIMP-HUMAN RELATIONSHIPS.2.Gone ApePETA launches a high-stakes investigation into the disappearance of former Hollywood chimp Tonka.3.Head ShotAs Alan Cumming doubles the existing reward for Tonka’s whereabouts, the filmmakers face an ethical dilemma.4.Fantasy IslandA 4-PART DOCUMENTARY SERIES ON CHIMP-HUMAN RELATIONSHIPS.The Official Podcast The official Chimp Crazy podcast, produced in partnership with Tooth and Claw, dives into surprising events in each episode of the docuseries, featuring behind-the-scenes insights from filmmakers and interviews with various primate experts. Listen NowConservation Resources Save the Chimps Save the Chimps, situated on 150 acres in Florida, is one of the largest chimpanzee sanctuaries in the world. Its mission is to provide refuge and lifelong care to chimpanzees in need, including Tonka. To see how Tonka is thriving in his new home, click "Learn More." Learn MoreRainforest Trust Rainforest Trust saves chimpanzees in the wild in Africa — and other endangered wildlife globally — by permanently protecting their rainforest habitat. The nonprofit has secured homes for 10,000 threatened chimps across 12 countries. Learn MoreJane Goodall Institute The Jane Goodall Institute is a global community conservation organization that advances Dr. Jane Goodall’s work in protecting chimpanzees and inspiring people to conserve the natural world we all share. Learn More #footer-max-banner::before { content: ''; position: absolute; width: 100vw; height: 280px; z-index: -1; left: 0; background-size: cover; background-image: url('https://static.hbo.com/2024-10/241101-max-brand-quilt-cropped.jpg'); } #footer-max-banner { height: 280px; overflow: hidden; width: 100vw; color: white; } #footer-max-banner .btn { width: 120px; } #footer-max-banner a.btn:hover { background: #00F0FF; border-color: #000066; color: #000066; } @media screen and (min-width: 996px) { #footer-max-banner > .middle-column { width: 600px; } } @media screen and (min-width: 1400px) { #footer-max-banner::before { height: 300px; } #footer-max-banner { height: 300px; } } Stream all of HBO, plus hit series, movies, reality, and more. Sign Up Now ABOUTGET HBOHELPSHOPCAREERSHBO INSPIRESHOW TO WATCH MAXPrivacy PolicyTerms of UseAd ChoicesDo Not Sell My Personal Information© 2024 Home Box Office, Inc. All Rights Reserved.This website may contain mature content.'''
