full_description = '''SERIESMOVIESNEW & LAST CHANCESCHEDULEFREE EPISODESMoreDocumentariesSpecialsSportsPodcastsMaxSIGN INSIGN UP FORSIGN INSIGN UP FORSERIESMOVIESNEW & LAST CHANCESCHEDULEFREE EPISODESMoreDocumentariesSpecialsSportsPodcastsMaxSIGN INSIGN UP FORSIGN INSIGN UP FORmax-style The Righteous Gemstones About Season Season-1Season-2Season-3The Righteous Gemstones | Season 1 | Episode 4Wicked Lips TV-MA | 35 MIN WATCH NOWMAXGideon learns more about the Gemstone enterprise. Kelvin does a "satanic sweep" for the daughter of wealthy church donors. 1.The Righteous GemstonesJesse Gemstone receives a video from blackmailers seeking to sully his reputation.2.Is This the Man Who Made the Earth TrembleJesse tasks his friends with getting surveillance footage that could explain the previous night's events.3.They Are Weak, But He Is StrongBaby Billy returns to the Gemstone ministry. Jesse tries to root out the identity of his blackmailers.4.Wicked LipsGideon learns more about the Gemstone enterprise. Kelvin does a "satanic sweep" for the daughter of wealthy church donors.5.InterludeIn 1989, young Jesse, Judy and Baby Billy each handle news that Aimee-Leigh is pregnant in their own way.6.Now the Sons of Eli Were Worthless MenJudy considers Baby Billy's offer to help guide her career. Jesse procures key evidence he hopes will lead to the blackmailers.7.And Yet One of You Is a DevilEli informs the Gemstone kids of their roles for their Easter service, as Judy's relationship with BJ falters.8.But the Righteous Will See Their FallJudy attempts to win back BJ. Kelvin has a crisis of faith.9.Better Is the End of a Thing Than Its BeginningEli questions his children's future in the Gemstone ministry, and Jesse struggles to keep his marriage together.ABOUTGET HBOHELPSHOPCAREERSHBO INSPIRESHOW TO WATCH MAXPrivacy PolicyTerms of UseAd ChoicesDo Not Sell My Personal Information© 2024 Home Box Office, Inc. All Rights Reserved.This website may contain mature content.'''
