["https://www.hbo.com/mind-over-murder"]
title = "Mind Over Murder | Watch the Docuseries on HBO | HBO.com"
description = "The 1985 murder of a local grandmother rocks the small town of Beatrice -- as does the exoneration of six individuals convicted of the crime."
full_description = '''SERIESMOVIESNEW & LAST CHANCESCHEDULEFREE EPISODESMoreDocumentariesSpecialsSportsPodcastsMaxSIGN INSIGN UP FORSIGN INSIGN UP FORSERIESMOVIESNEW & LAST CHANCESCHEDULEFREE EPISODESMoreDocumentariesSpecialsSportsPodcastsMaxSIGN INSIGN UP FORSIGN INSIGN UP FORmax-styleEXPLOREAbout SEASON Season 1ALL DOCUMENTARIES FULL SERIES AVAILABLE NOW Mind Over Murder 1 Season | 6 Episodes | TV-MA WATCH NOWMAXThe HBO Original six-part documentary series Mind Over Murder, directed by Nanfu Wang (HBO’s In the Same Breath) and produced by Vox Media Studios, chronicles the bizarre and psychologically complex story of six individuals who were convicted for the 1985 murder of a beloved 68- year-old grandmother, Helen Wilson, in Beatrice, Nebraska. Despite five of the individuals originally confessing to the crime, the “Beatrice Six” as they became known, were exonerated by DNA evidence in 2009, a turn of events which divided the rural town and incensed the family of Helen Wilson. As the filmmakers track the case from the murder, through investigation, trial, exoneration and two civil suits, shifting perspectives cloud the truth; a stranger-than-fiction tale emerges that raises salient questions about the reliability of confessions and memory in criminal cases. Directed by Nanfu Wang; executive producers, Marc Smerling, Nanfu Wang, Max Heckman, Chad Mumm, Mark W. Olsen. For HBO: executive producers, Nancy Abraham, Lisa Heller, and Sara Rodriguez. section:has(#becomes-max-on-page-banner) { background-image: none; } section:has(#becomes-max-on-page-banner) #page-band-column0 { align-items: unset !important; } #becomes-max-on-page-banner { color: #fff; } #becomes-max-on-page-banner::before { position: absolute; content: ''; width: 100vw; height: 540px; left: 0; z-index: -1; background-color:hsla(229,100%,45%,1); background-image: radial-gradient(at 37% 90%, hsla(184,100%,26%,0.32) 0px, transparent 50%), radial-gradient(at 87% 100%, hsla(239,100%,26%,0.7) 0px, transparent