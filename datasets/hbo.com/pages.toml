description = "Preparing to transition to Max from HBO Max? Learn how to get the app as an HBO subscriber, gain access as a new user, and more."
full_description = '''SERIESMOVIESNEW & LAST CHANCESCHEDULEFREE EPISODESMoreDocumentariesSpecialsSportsPodcastsMaxSIGN INSIGN UP FORSIGN INSIGN UP FORSERIESMOVIESNEW & LAST CHANCESCHEDULEFREE EPISODESMoreDocumentariesSpecialsSportsPodcastsMaxSIGN INSIGN UP FORSIGN INSIGN UP FORmax-styleEXPLOREAbout FAQs Contact Us Careers HBO Inspires How Do I Get Max as an HBO Subscriber? As you may have heard, Max—the enhanced service replacing HBO Max —will be the new streaming home for all of HBO (from Curb Your Enthusiasm to The Last Of Us). And that’s not all; it’ll also be your source for must-see real-world series, including reality and food shows. Naturally, you’ll want to take advantage of all the service has to offer. Here, learn how to get Max so you can start streaming crave-worthy series, award-winning films, and attention-grabbing specials ASAP. How do I sign up for HBO on Max? HBO Max subscribers If you’re a current HBO Max subscriber, you won’t need to sign up for Max. The HBO Max app will either automatically update to Max, or when you open HBO Max, you’ll be prompted to download the Max app. That’s it—happy streaming! HBO subscribers If you’re an HBO subscriber (i.e., you get HBO through your internet, mobile or TV provider), visit the Max Help Center to learn about accessing Max. section:has(#becomes-max-on-page-banner) { background-image: none; } section:has(#becomes-max-on-page-banner) #page-band-column0 { align-items: unset !important; } #becomes-max-on-page-banner { color: #fff; } #becomes-max-on-page-banner::before { position: absolute; content: ''; width: 100vw; height: 540px; left: 0; z-index: -1; background-color:hsla(229,100%,45%,1); background-image: radial-gradient(at 37% 90%, hsla(184,100%,26%,0.32) 0px, transparent 50%), radial-gradient(at 87% 100%, hsla(239,100%,26%,0.7) 0px, transparent 50%), radial-gradient(at 100% 95%, hsla(228,100%,26%,1) 0px, transparent 50%), radial-gradient(at 4% 6%, hsla(239,100%,26%,1) 0px, transparent 50%); } #becomes-max-