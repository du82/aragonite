["https://www.hbo.com/about/hbo-inspires/proud"]
title = "HBO Inspires | Proud"
description = "Discover the individuals and employee resource groups that inspire the culture of HBO."
full_description = '''SERIESMOVIESNEW & LAST CHANCESCHEDULEFREE EPISODESMoreDocumentariesSpecialsSportsPodcastsMaxSIGN INSIGN UP FORSIGN INSIGN UP FORSERIESMOVIESNEW & LAST CHANCESCHEDULEFREE EPISODESMoreDocumentariesSpecialsSportsPodcastsMaxSIGN INSIGN UP FORSIGN INSIGN UP FORmax-styleEXPLOREAbout HBO Inspires Black CreativityNuestras VoicesAt the heart of HBO is our passion for making a difference, and every day we are using our platform to educate, inspire thoughtful action and help make the world a better place. Thriving As Our Proudest, Queerest Selves #HumanByOrientation Watch on YouTube"No pride for some of us without liberation for all of us" - Marsha P. Johnson Elevating LGBTQ+ Voices TranshoodThe Legend of the UndergroundThe Out ListMama's BoyThe Trans ListWigNuclear FamilySpring Awakening: Those You've KnownLarry Kramer In Love and AngerNew on HBO The Stroll​A powerful history of transgender sex workers in New York's pre-gentrified Meatpacking District, and the movement to protect their rights.Rock Hudson: All That Heaven AllowedThis intimate portrait of actor Rock Hudson celebrates his enduring legacy as a cinema icon who helped change the public perception of AIDS.Taylor Mac's 24-Decade History of Popular MusicThis documentary captures Mac’s 24-hour marathon performance in New York, which reframes American history through popular songs from 1776 through 2016.John Early: Now More Than Ever​In his first HBO comedy special, John Early performs a unique blend of stand-up and music in the style of a gritty 1970s rock documentary.Resources For more information and support, please refer to these organizations. The Trevor Project is the world’s largest suicide prevention and crisis intervention organization for LGBTQ (lesbian, gay, bisexual, transgender, queer, and questioning) young people.Find Out MoreTrans and gender-expansive kids not only deserve to be recognized as their full selves, but doing so also results in improved mental, physical, and emotional health outcomes. The HRC Foundation will continue to advance transgender justice and not stop until all trans and gender-expansive children, youth, and adults do not simply survive but thrive.Find Out MorePFLAG is the first and largest organization for lesbian, gay, bisexual, transgender, and queer (LGBTQ+) people, their parents and families, and allies. PFLAG is committed to creating a world where diversity is celebrated and all people are respected, valued, and affirmed.Find Out MoreFamily Equality advances legal and lived equality for LGBTQ+ families, and for those who wish to form them, through building community, changing hearts and minds, and driving policy change. Family Equality believes every LGBTQ+ person should have the right and opportunity to form and sustain a loving family, regardless of who they are or where they live. Find Out MoreThe American Foundation for Suicide Prevention is dedicated to saving lives and bringing hope to those affected by suicide. AFSP creates a culture that’s smart about mental health through education and community programs, develops suicide prevention through research and advocacy, and provides support for those affected by suicide.Find Out MoreQueer Family Stories Inspired by Ry Russo-Young’s (Director, Nuclear Family) telling of her own family’s story — we sat down with three families to learn a bit about their journeys and showcase the spectrum of what a queer family can look like. Find Out MorePlay button link2:36The Jason and Karamo StoryFather and son, Karamo and Jason Brown, discuss the importance of love and communication in their family.Play button link1:47The Arlo and Jesse StoryFather daughter duo, Jesse and Arlo discuss letting go of fear to live your most authentic life.Play button link1:59The Lupita and Lori StoryWives and mothers, Lupita and Lori share what makes their fun, funny, silly family so special.On Being Black + Queer Dive in with Darnell Moore, Samson Ajewole, Michael R. Jackson, and Dr. Durryle Brooks in this NewFest Presents: I May Destroy You. Find Out MoreExplore Stories of Joy, Triumph, and Living Your Truth. Somebody SomewhereTrue BloodWe Are Who We AreGentleman JackThe Lady and the DaleIrma VepLookingExpanding The Narrative Culture Closeups for HBO's Transhood, The Lady and the Dale and Welcome to Chechnya. Play button link8:51TranshoodHear from Jay and Leena about why they wanted to be a part of the documentary and how to best support transgender youth.Dive DeeperPlay button link8:21The Lady and the DaleLawyer and transgender rights activist Chase Strangio speaks with The Lady and the Dale’s co-director Zackary Drucker and consulting producer Precious Brady-Davis about Liz Carmichael’s impact on today’s queer community.Dive DeeperPlay button link6:26Welcome to ChechnyaDirector David France and LGBTQ+ advocate Roxane Gay discuss how the documentary came to be and the importance of raising awareness around the LGBTQ+ cleansing campaign in Chechnya.Dive DeeperHBO Specials To discover the latest stand-ups and specials, visit HBO Specials. Jerrod Carmichael: RothanielJerrod Carmichael returns to HBO with his standup comedy special taped before a live audience at the legendary Blue Note Jazz Club in New York City.My Favorite Shapes by Julio TorresThis multimedia comedy show finds Torres exploring his favorite shapes, which are presented via an industrial conveyer belt and serve as a jumping-off point for fantastical stories, anecdotes and jokes.Tig Notaro: Boyish Girl InterruptedGrammy-nominated comedian Tig Notaro headlines and co-directs her first stand-up comedy special for HBO, produced by Funny or Die.Watch These HBO Fan Favorite Series EuphoriaWe're HereThe ComebackThe White LotusLos EspookysThe BabySex and The CityFAQs Billy on the Street runs around with a group of lesbians asking folks the important questions we need answers to. #footer-max-banner::before { content: ''; position: absolute; width: 100vw; height: 280px; z-index: -1; left: 0; background-s