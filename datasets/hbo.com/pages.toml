full_description = "SERIESMOVIESNEW & LAST CHANCESCHEDULEFREE EPISODESMoreDocumentariesSpecialsSportsPodcastsMaxSIGN INSIGN UP FORSIGN INSIGN UP FORSERIESMOVIESNEW & LAST CHANCESCHEDULEFREE EPISODESMoreDocumentariesSpecialsSportsPodcastsMaxSIGN INSIGN UP FORSIGN INSIGN UP FORmax-style Eastbound & Down About Season Season 1Season 2Season 3Season 4Eastbound & Down 4 Seasons | 29 Episodes | TV-MA WATCH NOWMAXDanny McBride is a former baseball star who is reduced to teaching Phys Ed at his old high school in this riotous HBO comedy series. more SEASONSSeason-1Season-2Season-3Season-4 SEASONSSeason-1Season-2Season-3Season-41.Chapter 1Burned out and broke, former big league pitcher Kenny Powers returns home to North Carolina to teach PE.2.Chapter 2To avoid selling his beloved jet ski, Kenny looks to score some extra cash as a spokesman for a car dealership.3.Chapter 3Kenny enlists the fawning Stevie to be his personal assistant. Dustin's wife Cassie offers to sell Kenny's baseball memorabilia on eBay.4.Chapter 4Kenny looks to rekindle an old flame at a barbecue hosted by April and Cutler. Stevie cuts a greatest hits DVD for Kenny.5.Chapter 5Kenny decides to give up his comeback dreams, but his resolve is tested by an arrogant car dealer and his new pet celebrity.6.Chapter 6Kenny says goodbye to his life as a schoolteacher -- and bids farewell to Dustin and his family -- after he's tendered a big league job offer.Chapter 7After settling a score with the baseball exec who screwed him, Kenny Powers heads to Mexico to start a new life and make a comeback with a hapless local team.Chapter 8Charros owner Sebastian Cisneros agrees to throw out all the stops in promoting Kenny Powers' return to organized baseball.Chapter 9Puzzled by the Mexican fans' lukewarm reception, Kenny starts a grassroots PR campaign to burnish his image. But it takes a vintage Powers flare-up to bring the fans to their feet.Chapter 10Kenny is warned by Roger about the perils of showboating. Later, he finds he has serious competition in his courtship of Vida.Chapter 11Kenny considers a new full-time life working in Mexico.Chapter 12Kenny settles his debt with Sebastian. Later, he settles a score with Aaron and Hector and bids adios to Vida.Chapter 13In the Season Two finale, Kenny confronts his future.Chapter 14Kenny enjoys a new lease on his baseball career as the closer for the minor league Myrtle Beach Mermen.Chapter 15Kenny heads north in search of April, and attempts to liberate Stevie from the perverse clutches of Ashley Schaeffer (Will Ferrell).Chapter 16Kenny is asked to mentor a Russian pitching phenom. Stevie heads to Myrtle Beach.Chapter 17Kenny blames baby Toby for his recent troubles and imposes himself on Shane's straight-laced family.Chapter 18Kenny tries to win back control of his team with a 4th of July bash and has some unannounced visitors.Chapter 19Kenny and Eduardo launch a plan to secure permanent childcare for Toby. Kenny embraces a new pitch.Chapter 20Kenny tries to win over Coach Banks and get back in the rotation, but many obstacles threaten to detour his pursuit of redemption.Chapter 21As Kenny adjusts to the new realities of his life, a twist of fate alters his future with the Mermen.Chapter 22Kenny Powers ponders a career move to escape the rat race and get back in the game.Chapter 23<div class='episode-body-left-aligned' style='text-align: left'><p>Written by <b>Carson Mell</b>, <b>Jody Hill and Danny McBride</b>; Directed by <b>Jody Hill</b></p><p>April finds Kenny in the yard, on drugs and digging a hole for his pool. Still high and dirty, he waits for Guy Young outside the studio and tells his old teammate that he's ready to get famous again. Guy decides to give Kenny a spot as a guest-host on his show, 'Sports Sesh,' and see how he does. Kenny turns to Stevie for support, but Stevie has enough trouble on his own, struggling to feed his four half-Mexican children. With no one to boost his confidence, Kenny's appearance on the show is a bust. Another host, Dontell, is particularly brutal towards him, and Kenny is embarrassed in front of the live studio audience and everyone watching at home.</p><p>Guy tells Kenny that he blew his chance – he was hoping that Kenny would step up to Dontell – but Kenny pleads for one last shot. Preparing for his next appearance, Kenny reconciles with Stevie and gets to work. One badass training montage later, he's ready. When Kenny faces a last minute bout of stage fright, April arrives and offers her support, telling Kenny to &quot;fuck shit up.&quot; This time when Dontell steps to Kenny, Kenny steps right back. Their verbal argument escalates with Kenny pushing Dontell. When the other hosts intervene, Dontell unleashes a tirade against them, Kenny, and the audience, before storming out. The show goes to commercial and the studio audience goes wild.</p></div>Chapter 24Kenny treats his family and friends to an overnight trip to a water park. A day of good clean fun gives way to an evening of debauchery.Chapter 25<div class='episode-body-left-aligned' style='text-align: left'><p>Written by <b>Justin Nowell</b>, <b>Jody Hill</b> and <b>Danny McBride</b>; Directed by <b>David Gordon Green</b></p><p>On 'Sports Sesh,' the guys run through an obstacle course and Jed makes the mistake of beating Guy Young. After the show, the other co-hosts tell Kenny they're all scared of upsetting Guy, who can be very petty and jealous. Unconcerned, Kenny bonds with Guy over lunch, and Guy invites him to participate in a dragon boat race for a charity of his choosing. Kenny enlists Stevie's help to find a charity on par with Guy's AIDS foundation. Shutting down Stevie's suggestion of the &quot;Save the Limp Dick&quot; foundation (a cause near to Stevie's heart), Kenny settles on the poor black kids at a nearby park.</p><p>April notices that Gene and Dixie have been throwing dinner parties without her and Kenny, so she shows up uninvited and angry. Dixie tells her she wasn't invited because Kenny punched Gene in the face at the water park. Covering for himself, Kenny makes up an elaborate lie about Gene having sex with another woman while Tel watched. While the couples fight, Kenny and April make their exit.</p><p>Kenny and April prepare to mingle with the elites at Guy Young's Asian-themed party. Surrounded by chanting monks and cake flown in from across the country, Guy tells Kenny how fed up he is with Jed. The day of the race, Kenny and Guy prepare to take on Dontell's team. In the middle of the competition, Jed is slowing the team down, and Guy asks Kenny to throw him out of the boat. Kenny is conflicted, but does as he's told, aiding the team to victory.</p></div>Chapter 26Guy asks Kenny to tone down his on-air antics. April gets Kenny to agree to undergo couples therapy.Chapter 27Kenny is rattled at work, Stevie botches a job and April is fed up.Chapter 28Kenny learns a Christmas lesson and Stevie tries to keep up appearances.Chapter 29<div class='episode-body-left-aligned' style='text-align: left'><P>Written by <STRONG>John Carcieri &amp; Jody Hill &amp; Danny McBride;</STRONG> Directed by<STRONG> Jody Hill</STRONG></P><P>Kenny enters his divorce proceedings and fires his team of lawyers. He asks April for one week to prove himself before she finalizes the paperwork.</P><P>On the set of 'Sports Sesh,' Kenny tries to make amends with the crew for his behavior during the Christmas special by firing his security guards. His apology is interrupted by Ronnie Thielman, the head of the network. Thielman, a Brit traveling with a 13-year-old boy he's been educating, saw Kenny's Christmas special and loved it. He offers to give Kenny his own show and make him the next Ellen DeGeneres.</P><P>Kenny visits Stevie in his home, where he's recovering from the accidental gunshot to his chin. Stevie, hopped up on painkillers, has some constructive criticism for Kenny's screenplay.</P><P>For Kenny's first show, Ronnie wants a teary interview with Guy Young. Kenny visits Guy in his home, where he finds the former host disheveled and performing to a pretend audience. Reaching out, Kenny offers one last shot at redemption, telling Guy it's &quot;because once upon a time, a dear friend gave me a chance when the rest of the world had counted me out.&quot;</P><P>After Kenny's son Toby performs in a school play, April tells Kenny she's not ready to have her heart broken again. She's moving with the kids to Santa Fe.</P><P>Before taping the inaugural 'Powers Hour,' Ronnie tells Kenny to &quot;crush Guy Young like a teenage hymen.&quot; It's not a show about redemption, it's a show about humiliation. When Kenny brings out Guy, the old host is showered with boos. When Guy attempts to come clean, Kenny reveals the true nature of the show -- but he refuses to play along with it. As the network executive looks on in horror, Kenny apologizes for his past behavior. &quot;I made a lot of my mistakes on my return to superstardom,&quot; he admits. &quot;I screwed a lot of pooches.&quot; Kenny declares that the dragon that is Kenny Powers will now retreat to his cave. When Ronnie comes after him, Kenny punches him in the face.</P><P>Kenny returns home to see his family off. As he hands over the signed divorce papers, he apologizes one last time. April stops him and kisses him. They move to Santa Fe together.</P><P>Reworking his screenplay, Kenny imagines directing the feature film about his life. He casts Alexander Skarsgard and Lindsay Lohan as his grown-up children. In his vision, April is shot and killed by muggers, leaving Kenny to wallow in a life of hardcore drug addiction before finally getting clean. He pictures himself moving to Africa and marrying a local woman. When he dies, Stevie and his children come to collect his ashes. Cut to black, and the audience goes apeshit.</P><P>In his Santa Fe home, Kenny finishes his screenplay, and joins April after a long day of writing.</P></div>ABOUTGET HBOHELPSHOPCAREERSHBO INSPIRESHOW TO WATCH MAXPrivacy PolicyTerms of UseAd ChoicesDo Not Sell My Personal Information© 2024 Home Box Office, Inc. All Rights Reserved.This website may contain mature content."
