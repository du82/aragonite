title = "The Righteous Gemstones | Official Website for the HBO Series | HBO.com"
description = "The official website for Danny McBride is the eldest child of a celebrity televangelist family behind a big-money megachurch. on HBO, featuring interviews, schedule information, behind the scenes exclusives, and more."
full_description = '''SERIESMOVIESNEW & LAST CHANCESCHEDULEFREE EPISODESMoreDocumentariesSpecialsSportsPodcastsMaxSIGN INSIGN UP FORSIGN INSIGN UP FORSERIESMOVIESNEW & LAST CHANCESCHEDULEFREE EPISODESMoreDocumentariesSpecialsSportsPodcastsMaxSIGN INSIGN UP FORSIGN INSIGN UP FORmax-styleEXPLOREAbout Season Season 1Season 2Season 3 SOCIAL FacebookInstagramG.O.D.D. SHOP Season 4 PREMIERES MARCH 9 AT 10 PM The Righteous Gemstones 3 Seasons | 27 Episodes | TV-MA WATCH NOWMAXFrom Danny McBride (Vice Principals, Eastbound & Down), this critically acclaimed comedy follows a world-famous televangelist family with a long tradition of deviance, greed, and charitable work. Despite constant bickering, Gemstone family ties run deep. In the fourth and final season, the family’s codependence is tested as they attempt to move forward without letting go of their storied past. Creator and writer, Danny McBride; directors, Danny McBride, Jody Hill, David Gordon Green, and Jonathan Watson; executive producers, Danny McBride, Jody Hill, David Gordon Green, Jonathan Watson, John Carcieri, Jeff Fradley, and Brandon James; producer, David Brightbill; consulting producers, Kevin Barnett, Edi Patterson, and Chris Pappas. Watch the First Episode for Free Start from the beginning and watch the first episode of The Righteous Gemstones for free. WATCH FOR FREESeason 3 Extras Play button link2:51Day in the Life Part 1Tony Cavalero ("Keefe Chambers") shows you how he spends his downtime on set.Play button link2:28Day in the Life Part 2Tony summons supernatural forces to end his behind-the-scenes tour.Play button link1:11The SystemAn in-world commercial advertising Amber’s newest venture: “The System”.Play button link0:38Monster TruckThis 2000s era in-world promo spotlights Jesse Gemstone and the immaculate Redeemer monster truck. section:has(#becomes-max-on-page-banner) { background-image: none; } section:has(#becomes-max-on-page-banner) #page-band-column0 { align-items: unset !important; } #becomes-max-on-page-banner { color: #fff; } #becomes-max-on-page-banner::before { position: absolute; content: ''; width: 100vw; height: 540px; left: 0; z-index: -1; background-color:hsla(229,100%,45%,1); background-image: radial-gradient(at 37% 90%, hsla(184,100%,26%,0.32) 0px, transparent 50%), radial-gradient(at 87% 100%, hsla(239,100%,26%,0.7) 0px, transparent 50%), radial-gradient(at 100% 95%, hsla(228,100%,26%,1) 0px, transparent 50%), radial-gradient(at 4% 6%, hsla(239,100%,26%,1) 0px, transparent 50%); } #becomes-max-on-page-banner>div[class*="col"]:first-of-type img { border: 1px solid rgb(3, 118, 242); border-radius: 0.3rem; box-shadow: rgb(0 51 255 / 20%) 30px 30px 60px, rgb(0 240 255/ 30%) -30px -30px 60px; background-image: radial-gradient(rgba(0, 43, 231, 0.5), rgb(0, 0, 102,) 175%); } #becomes-max-on-page-banner .max-svg-logo { max-width: 220px; } #becomes-max-on-page-banner a.btn { position: relative; z-index: 1; } #becomes-max-on-page-banner a.btn:hover { background: #00F0FF; border-color: #000066; color: #000066; } @media screen and (min-width: 500px) { #becomes-max-on-page-banner::before { height: 600px; } } @media screen and (min-width: 768px) { #becomes-max-on-page-banner::before { height: 700px; } } @media screen and (min-width: 992px) { #becomes-max-on-page-banner::before { height: 350px; } } @media screen and (min-width: 1200px) { #becomes-max-on-page-banner::before { height: 450px; } } It's All Here Sign Up Now SEASONSSeason-1Season-2Season-3 SEASONSSeason-1Season-2Season-31.The Righteous GemstonesJesse Gemstone receives a video from blackmailers seeking to sully his reputation.2.Is This the Man Who Made the Earth TrembleJesse tasks his friends with getting surveillance footage that could explain the previous night's events.3.They Are Weak, But He Is StrongBaby Billy returns to the Gemstone ministry. Jesse tries to root out the identity of his blackmailers.4.Wicked LipsGideon learns more about the Gemstone enterprise. Kelvin does a "satanic sweep" for the daughter of wealthy church donors.5.InterludeIn 1989, young Jesse, Judy and Baby Billy each handle news that Aimee-Leigh is pregnant in their own way.6.Now the Sons of Eli Were Worthless MenJudy considers Baby Billy's offer to help guide her career. Jesse procures key evidence he hopes will lead to the blackmailers.7.And Yet One of You Is a DevilEli informs the Gemstone kids of their roles for their Easter service, as Judy's relationship with BJ falters.8.But the Righteous Will See Their FallJudy attempts to win back BJ. Kelvin has a crisis of faith.9.Better Is the End of a Thing Than Its BeginningEli questions his children's future in the Gemstone ministry, and Jesse struggles to keep his marriage together.I Speak in the Tongues of Men and AngelsJesse clashes with Eli over the future of the Gemstone empire.After I Leave, Savage Wolves Will ComeEli fends off a big-city reporter sitting on long-held secrets.For He Is a Liar and the Father of LiesAfter noticing a change in Eli’s behavior, the Gemstone siblings dig deeper into their father’s mysterious past.As to How They Might Destroy HimFather-son tensions reach an all-time high as the entire Gemstone family gathers for BJ’s baptism.Interlude IIChristmas, 1993. While Eli considers a tempting offer from an old friend, Baby Billy crashes the Gemstones' celebrations.Never Avenge Yourselves, But Leave It to the WrathAfter surviving a brutal attack, Jesse takes the fight for his family’s future into his own hands.And Infants Shall Rule Over ThemThe Gemstones hatch a plan to smite their enemies.The Prayer of a Righteous ManWhile the Gemstones consider the new status quo, Baby Billy connects with a figure from his past.I Will Tell of All Your DeedsWhile the Gemstones celebrate the launch of Zion’s Landing, Baby Billy faces a chance to embrace fatherhood.For I Know the Plans I Have for YouIn the wake of their father's semi-retirement, Jesse, Judy and Kelvin must deal with dwindling attendance – and donations. Later, Eli is visited by another figure from his past.But Esau Ran To Meet HimEli does his best to smooth over relations with the Montgomery boys after a visit to their doomsday prepper compound. Back at the Salvation Center, the siblings face off against the Board of Ministers.For Their Nakedness Is Your Own NakednessTired of life in the lap of luxury, Baby Billy pursues a new vocation as gameshow host. The Gemstones host a cousins' night for Karl and Chuck.I Have Not Come To Bring Peace, But a SwordWhile Jesse prepares for his initiation into a prestigious secret society, Judy fends off unwanted attention, and Kelvin handles rumors about Keefe. Later, Baby Billy makes an impossible promise.Interlude III2000. After a Y2K doomsday fails to materialize, Eli and Aimee-Leigh find themselves flooded with criticism from their congregants…and the Montgomerys. Later, the arrival of Jesse’s girlfriend Amber throws an already fragile Judy for a loop.For Out of the Heart Come Evil ThoughtsThreatened with blackmail, Judy turns to Amber for advice, while Jesse goads BJ into a long-simmering fight. As a despondent Kelvin tackles life without Keefe, Baby Billy works on bringing Jesse's miracle to life… for a price.Burn For Burn, Wound For Wound, Stripe For StripeAfter decades of animosity, tensions between the Montgomerys and the Gemstones finally come to a head. As Eli faces an impossible decision, Jesse, Judy, and Kelvin prepare to meet their maker.I Will Take You by The Hand and Keep YouThe Gemstone siblings reconnect with their loved ones…and each other. As the Montgomery militia fractures from within, Chuck weighs his options, while Peter hatches a new plan.Wonders That Cannot Be Fathomed, Miracles That Cannot Be CountedThe siblings compete in an all-out biblical brawl – until a stroke of divine intervention forever alters the fate of the Gemstone family.Season 1 Extras Play button link2:04A Very Gemstone Blooper ReelGet an uncensored look at all the breaks, jokes and on-set mischief that didn't make it into Season 1.Play button link1:36Meet the GemstonesSeries creator Danny McBride and stars John Goodman, Adam Devine and Edi Patterson break down the Gemstone family dynamic.Play button link0:44The Gemstone Salvation CenterJoin the Gemstone family for a Sunday service you'll never forget.Play button link1:36A Day in the Life of a GemstoneGo behind the scenes of The Righteous Gemstones on set with Adam Devine.Season 2 Extras Play button link2:49The Blessed BloopersPraise be to Season 2’s funniest outtakes and bloopers.Play button link1:00Baby Billy’s Elixir PromoGet a closer look at Baby Billy’s latest money-making scheme.Play button link1:35God Squad WorkoutGet swole with the Lord. And Keefe.Play button link2:28A Day In The Life On Set with Edi PattersonEdi Patterson gives a glimpse of her glamorous life on set. Bring cash.Play button link1:13Kelvin’s God SquadFriendship. Brotherhood. Transcendence. Do you have what it takes to join?Play button link1:27Merry Christmas From The GemstonesSit back and watch a holiday greeting from the Gemstones siblings.You May Also Like Vice PrincipalsEastbound & DownBarryLos Espookys #footer-max-banner::before { content: ''; position: absolute; width: 100vw; height: 280px; z-index: -1; left: 0; background-size: cover; background-image: url('https://static.hbo.com/2024-10/241101-max-brand-quilt-cropped.jpg'); } #footer-max-banner { height: 280px; overflow: hidden; width: 100vw; color: white; } #footer-max-banner .btn { width: 120px; } #footer-max-banner a.btn:hover { background: #00F0FF; border-color: #000066; color: #000066; } @media screen and (min-width: 996px) { #footer-max-banner > .middle-column { width: 600px; } } @media screen and (min-width: 1400px) { #footer-max-banner::before { height: 300px; } #footer-max-banner { height: 300px; } } Stream all of HBO, plus hit series, movies, reality, and more. Sign Up Now ABOUTGET HBOHELPSHOPCAREERSHBO INSPIRESHOW TO WATCH MAXPrivacy PolicyTerms of UseAd ChoicesDo 