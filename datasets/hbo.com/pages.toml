title = "Documentary Movies | Watch on HBO | Stream on HBO Max"
description = "HBO is home to a wide variety of documentary films. Browse our full collection today. Stream all documentary movies now on HBO Max."
full_description = '''SERIESMOVIESNEW & LAST CHANCESCHEDULEFREE EPISODESMoreDocumentariesSpecialsSportsPodcastsMaxSIGN INSIGN UP FORSIGN INSIGN UP FORSERIESMOVIESNEW & LAST CHANCESCHEDULEFREE EPISODESMoreDocumentariesSpecialsSportsPodcastsMaxSIGN INSIGN UP FORSIGN INSIGN UP FORmax-style Movies EXPLOREFeatured Movies Documentaries Specials All Movies GENRES Action MoviesComedy MoviesCrime MoviesDocumentary MoviesDrama MoviesRomance MoviesDocumentary Movies HBO is home to a wide variety of documentary films. Browse our full collection today. 1000% Me: Growing Up MixedMultiracial children and their families share the joys and struggles of growing up mixed in the Bay Area.12th & DelawareA look at the abortion debate through a Florida town where a clinic and a pro-life outfit stand on opposite sides of an intersection.15 Minutes of ShameMonica Lewinsky and filmmaker Max Joseph (Catfish) examine the human price of public shaming and cyber-harassment.3 1/2 Minutes, Ten BulletsThis film examines the 2012 murder in Florida of an unarmed African-American teen and the trial of his white shooter.38 at the GardenJeremy Lin's extraordinary rise to NBA stardom in 2012 and the lasting impact of "Linsanity" is explored in this timely documentary.4 Little GirlsSpike Lee's documentary about the 1963 Birmingham church bombing that killed four young girls.40 Years a PrisonerThis film chronicles a 1978 Philadelphia shootout and the subsequent fight to release nine convicted members of the group, MOVE.5 American Handguns - 5 American KidsDisturbing look at the stories of five handguns that killed five children -- and how their deaths might have been prevented.50 Children: The Rescue Mission of Mr. & Mrs. KrausThe courageous journey of Gilbert and Eleanor Kraus to save 50 Jewish children from the Nazis is chronicled in this inspiring film.537 VotesThis documentary looks back at the wildly contested 2000 presidential election which came down to 537 votes.A Choice of Weapons: Inspired by Gordon ParksThis documentary explores the power of images in advancing racial, economic and social equality as seen through the work of photographer Gordon Parks.A Dangerous SonThis film focuses on three families with a child who has a serious mental illness and the struggles of each to find appropriate treatment.A Forbidden OrangeMalcom McDowell narrates this eye-opening documentary charting the groundbreaking 1975 premiere in Spain of Stanley Kubrick’s A Clockwork Orange.A Girl in the River: The Price of ForgivenessThe extraordinary story of a young Pakistani woman who survived an attempted "honor" killing by her father and uncle.A Good Job: Stories of the FDNYAcclaimed actor and FDNY veteran Steve Buscemi looks at what it's like to work as a New York City firefighter.A Revolution on CanvasSara Nodjoumi investigates the disappearance of more than 100 "treasonous" paintings by her father, Iranian artist Nickzad Nodjoumi.A Tree of Life: The Pittsburgh Synagogue ShootingThis documentary looks at one of the deadliest antisemitic attacks in American history at the Tree of Life Synagogue in Pittsburgh, Pennsylvania.Abortion: Desperate ChoicesAn intense, thought-provoking look at the human side of one of the most explosive moral and political issues of our time.Abortion: Stories Women TellA thought-provoking look at the issue of abortion today, told through the stories of the women involved on all sides.About Face: Supermodels Then and NowIconic former supermodels look back at their careers and the changing world of fashion in this unique video portrait.AddictionThis documentary features insights from experts on trends and treatments in the ongoing battle against drug and alcohol abuse.AdrienneA celebration of the life and work of actor and filmmaker Adrienne Shelly who was murdered in 2006.After the BiteA 2018 shark attack forces the coastal community of Cape Cod to examine changes in the natural world and how its residents must adapt.After Truth: Disinformation and the Cost of Fake NewsThis eye-opening documentary examines the rising phenomenon of “fake news” in the US and its impact in the age of social media.AgnelliBiographical portrait of Gianni Agnelli, the legendary Italian industrialist, playboy and fashion trendsetter.aka Mr. ChowDiscover the vibrant and varied life of Michael Chow, the famed actor, artist and restaurateur who triumphed over trauma, loss and prejudice.Alabama SnakeA chilling southern gothic tale of a woman who accused her preacher husband of trying to kill her -- by rattlesnake bite.Albert Brooks: Defending My LifeAlbert Brooks opens up about his life and career in this intimate conversation with his lifelong friend Rob Reiner.Ali & Cavett: The Tale of the TapesThe courage and charisma of boxing legend Muhammad Ali are witnessed through the bond he formed with television host Dick Cavett.Alive Day Memories: Home From IraqFirst-person stories of ten Alive Day heroes -- soldiers who survived near-fatal wounds while serving in Iraq -- as told to James Gandolfini.All That BreathesFollow the "kite brothers" as they devote their lives to the quixotic effort of protecting the majestic black kite in New Delhi, India.All the Beauty and the BloodshedFrom Oscar-winning filmmaker Laura Poitras (Citizenfour) comes this epic emotional story about renowned artist and activist Nan Goldin.Alternate Endings: Six New Ways to Die in AmericaTouching film that explores the innovative ways Americans are approaching end of life.American PainA true crime exposé chronicling the rise and fall of Chris and Jeff George, identical twins believed to be America's most prolific opioid kingpins.Americans in BedTen American couples -- captured in the comfort of their own beds -- openly discuss romance, sex, trust and love in candid interviews.An American Bombing: The Road to April 19thAn exploration of the rise of antigovernment sentiment and homegrown terrorism through the lens of the 1995 Oklahoma City bombing.An Apology to ElephantsThis documentary short explores our history with elephants and the problems that arise when they are brought to live in captivity.And Just Like That... The DocumentaryA deep immersion into the work behind And Just Like That... following the return of Sex and the City’s most iconic characters and dedicated crew.Andre the GiantThe life and career of Andre the Giant, one of the most beloved legends in WWE history, is chronicled in this documentary.Any One of UsMountain biker Paul Basagoitia's recovery from a devastating spinal cord injury is chronicled in this documentary.Arthur Miller: WriterAn intimate portrait of legendary playwright Arthur Miller as told from the unique perspective of his daughter, Rebecca.At the Heart of Gold: Inside the USA Gymnastics ScandalThis hard-hitting documentary chronicles the lives affected by the Larry Nassar sexual-abuse criminal case that shook the sports world.Autism: The SequelThis follow-up to the Emmy-winning "AUTISM: The Musical" follows five young adults on the spectrum as they navigate their early 20s.Babe RuthThis engaging documentary explores the life and legend of the famed New York Yankees slugger.Baby GodA haunting examination of Dr. Quincy Fortier, a fertility specialist who used his own sperm to impregnate an untold number of women.Baghdad ERLife and death at the 86th Combat Support Hospital -- the U.S. Army's premier medical facility in Iraq.Baltimore Rising (2017)A compelling look at the struggles of police and activists to hold Baltimore together following the 2015 death of the Freddie Gray.BAMA RUSHA fascinating look into the long-held tradition of sorority recruitment at the University of Alabama.Beanie ManiaAn eye-opening deep-dive into the world of Beanie Babies and the frenzy they created.Becoming Mike NicholsFilmmaking legend Mike Nichols opens up about his storied career in this intimate documentary shot just four months prior to his death.Becoming Warren Buffett (2017)This fascinating documentary traces the remarkable life, career and credo of billionaire investor Warren Buffett.Being Mary Tyler MooreThe life and storied six-decade career of screen icon Mary Tyler Moore are explored in this documentary.Belichick & Saban: The Art of CoachingLegendary football coaches Bill Belichick and Nick Saban open up in this documentary that looks at their four-decade-long friendship.Best of EnemiesA look back at the debates between liberal author Gore Vidal and conservative intellectual William F. Buckley amid the 1968 election.Between the World and MeArtists and activists weave a tapestry of the African-American experience in this special about growing up in inner-city Baltimore.Beware the SlendermanObsessed 12-year-old girls stab a friend to appease the mythical entity "Slenderman."Billie Jean King: Portrait of a PioneerA profile of the remarkable life and career of tennis legend Billie Jean King, both on and off the court.Black Art: In the Absence of LightA look at the indelible contributions of some of the foremost African American artists in today's contemporary art world.Bleed OutA son's video diary of his mother's long ordeal following hip replacement surgery underscores the problems of American health care today.Boy InterruptedA filmmaker-mother's heartbreaking film about the suicide of her 15-year-old son.Brandy Hellville & The Cult of Fast FashionA searing look at the toxic culture of teen brand Brandy Melville and the global ramifications of fast fashion.Brave New Voices 2010The excitement and poetry of the Brave New Voices 2010 National Slam team championships is captured in this special.Breslin and Hamill: Deadline ArtistsAn in-depth profile of iconic New York City journalists Jimmy Breslin and Pete Hamill.BS HighThis eye-opening documentary chronicles the Bishop Sycamore High School football scandal and the team's infamous head coach, Roy Johnson.Bully. Coward. Victim. The Story of Roy CohnThis film explores infamous attorney Roy Cohn's rise to power and how his influence continues to rule today.Burning Ojai: Our Fire StoryA look back at the December 2017 wildfire that devastated communities across Ventura County, California.Call Me Miss CleoAn eye-opening documentary chronicling the rise, fall and reinvention of controversial and revered television psychic Miss Cleo.Camilo: El primer Tour de Mi Vida​Follow Camilo's first world tour, "Mis Manos" 2021, as the acclaimed Colombian singer and songwriter meets his devoted fans in person.Capturing the FriedmansA riveting look at a family's disintegration amidst the turmoil of the father and youngest son being charged with child molestation.Caro Comes OutCuban American writer Caro Hernandez is on a mission: to come out as gay to her entire Cuban family, most of whom reside in Miami.Celebrity HablaSee what celebrated Latino actors, newsmakers and a music legend have to say about being Latino in the U.S.Celebrity Habla 2See what celebrated Latino actors, newsmakers and a musical legend have to say about being Latino in the U.S.Chernobyl: The Lost Tapes​A revealing account of the 1986 Chernobyl nuclear disaster and Ukraine's resilience told through newly discovered archival footage.ChowchillaThe 1976 Chowchilla abduction is the strangest mass kidnapping in history.Citizen U.S.A.: A 50 State Road TripAlexandra Pelosi criss-crosses the U.S. to meet new Americans in this illuminating look at the naturalization process in America.City Dump: The Story of the 1951 CCNY Basketball ScandalThis documentary examines one of the darkest and saddest chapters in sports history: the CCNY basketball team game-fixing scandal.Class Action ParkWelcome to Action Park, the notorious 1980s New Jersey water park that long ago entered the realm of myth.Class DivideA look at the effects of gentrification in West Chelsea, NYC, where affluent kids share a street with people from public-housing projects.Clínica De MigrantesFilmmaker Maxim Pozdorovkin shines a light on Puentes de Salud, a Philadelphia health-care clinic serving undocumented immigrants.ComaThis film follows a year in the lives of four patients at JFK Medical Center's Center for Head Injuries as they emerge from comas.Covid Diaries NYCThis film chronicles the lives of five young filmmakers whose families were on the frontlines during the first wave of the Coronavirus.Crazy, Not Insane​A provocative look at the minds of serial killers through the lens of renowned psychiatrist Dorothy Otnow Lewis.Crisis Hotline: Veterans Press 1Counselors at the Veterans' Crisis Line open up about providing phone support to troubled military veterans.Dangerous PlayA documentary that sheds light on the influence of Colombian drug cartels on soccer in the days leading up to the 1989 Copa Libertadores championship.Daniel​First-time filmmaker and adventurer Daniel Northcott chronicles his search for connection and meaning while visiting 42 countries.Dark Light: The Art of Blind PhotographersThis film explores the artistry and innovation of blind photographers Pete Eckert, Bruce Hall and Henry Butler.David Bowie: The Last Five YearsExperience the evolving genius of rock icon David Bowie in this documentary that chronicles the last five years of his life.David Holmes: The Boy Who LivedA coming-of-age documentary of Daniel Radcliffe and his stunt double David Holmes, whose close friendship endures a life-changing accident.David McCullough: Painting With WordsAuthor and historian David McCullough welcomes viewers into his public and private worlds in this documentary.Dear RiderThis film chronicles the life and vision of snowboarding pioneer Jake Burton Carpenter, who propelled the sport into a global phenomenon.Diagnosis Bipolar: Five Families Search for AnswersFive families reveal the struggles, hopes and fears that arise from raising kids with Bipolar Mood Disorder.Diana, Our Mother: Her Life and LegacyNearly 20 years after the death of Princess Diana, her sons and heirs, Prince William and Prince Harry, look back on her life and work.Diego MaradonaHBO Sports presents the extraordinary story of Argentinian soccer legend Diego Maradona.Dionne Warwick: Don't Make MeLegendary singer Dionne Warwick charts the highs and lows of her storied six-decade career with help from her friends, family and fellow artists.Dirty Driving: Thundercars of IndianaA look at the local obsession with auto racing in the struggling town of Anderson, Indiana.Don't Divorce Me! Kids' Rules for Parents on DivorceA group of children, ages 5 to 9, share their advice for parents to help kids adjust and cope when families go through a divorce.Donyale Luna: SupermodelInside the life and groundbreaking career of Donyale Luna, the first Black model to grace the cover of both Harper's Bazaar and Vogue.Dope Sick LoveTwo drug-addicted couples eke out a bare-bones existence on the streets of New York in this startlingly candid documentary.El espiritu de la salsaThis documentary follows 10 people from all over NYC as they learn the rich art of salsa dancing from celebrated instructor Tomas '''
