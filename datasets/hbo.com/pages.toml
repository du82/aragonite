description = "The official website for Succession on HBO, featuring interviews, schedule information, behind the scenes exclusives, and more!"
full_description = '''SERIESMOVIESNEW & LAST CHANCESCHEDULEFREE EPISODESMoreDocumentariesSpecialsSportsPodcastsMaxSIGN INSIGN UP FORSIGN INSIGN UP FORSERIESMOVIESNEW & LAST CHANCESCHEDULEFREE EPISODESMoreDocumentariesSpecialsSportsPodcastsMaxSIGN INSIGN UP FORSIGN INSIGN UP FORmax-styleEXPLOREAbout Season Season 1Season 2Season 3Season 4Podcast Shop FULL SERIES AVAILABLE NOW | Winner of 13 emmys | 2023 EMMY NOMINEE Succession 4 Seasons | 39 Episodes | TV-MA WATCH NOWMAXThe sale of media conglomerate Waystar Royco to tech visionary Lukas Matsson moves ever closer. The prospect of this seismic sale provokes existential angst and familial division among the Roys as they anticipate what their lives will look like once the deal is complete. A power struggle ensues as the family weighs up a future where their cultural and political weight is severely curtailed. Winner of 13 Emmys, including Outstanding Drama Series (2022, 2020). Power, politics, money...it's all in the family in this award-winning, provocative, funny series about a highly dysfunctional dynasty. Watch the First Episode for Free Start from the beginning and watch the first episode of Succession for free. Watch For FreeHow to Stream Succession All episodes of Succession are available to stream on Max, the home of HBO. If you were an HBO Max subscriber, you’ll automatically get access to Max (and all your favorite shows). When you go to open the HBO Max app, it will either automatically transition to Max or prompt you to download the new app. Traditional HBO subscribers also get access to Max. Simply use your HBO account details to set up a Max account. And if you’re a new subscriber, head to Max.com to sign up. Learn more about Max here. section:has(#becomes-max-on-page-banner) { background-image: none; } section:has(#becomes-max-on-page-banner) #page-band-column0 { align-items: unset !important; } #becomes-max-on-page-banner { color: #fff; } #becomes-max-on-page-banner::before { position: absolute; content: