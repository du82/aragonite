full_description = '''SERIESMOVIESNEW & LAST CHANCESCHEDULEFREE EPISODESMoreDocumentariesSpecialsSportsPodcastsMaxSIGN INSIGN UP FORSIGN INSIGN UP FORSERIESMOVIESNEW & LAST CHANCESCHEDULEFREE EPISODESMoreDocumentariesSpecialsSportsPodcastsMaxSIGN INSIGN UP FORSIGN INSIGN UP FORmax-styleEXPLOREAbout Season Season 1 Resources Safe HorizonNational Domestic Violence HotlineNO MORENational Alliance to End Sexual ViolenceJoyful Heart FoundationNational Center for Victims of CrimePodcast Investigation Timeline AVAILABLE NOW I'll Be Gone in the Dark 1 Season | 7 Episodes | TV-MA Watch NowMAX A six-part documentary series based on the book of the same name, I’ll Be Gone in the Dark explores writer Michelle McNamara’s investigation into the dark world of the violent predator she dubbed "The Golden State Killer," the man who terrorized California in the 1970s and 80s and is responsible for 50 home-invasion rapes and 13 murders. Directed by Academy Award nominee and Emmy-winning director Liz Garbus (HBO’s Who Killed Garrett Phillips, Nothing Left Unsaid: Gloria Vanderbilt & Anderson Cooper) and produced by Elizabeth Wolff, Kate Barry, Myles Kane and Josh Koury, the series is a detective story told in McNamara’s own words, through exclusive original recordings and excerpts from her book read by actor Amy Ryan. Drawing on extensive archival footage and police files as well as exclusive new interviews with detectives, survivors and family members of the killer, the series weaves together a picture of a complex and flawed investigation that challenged police for decades. The series is also a journey into the soul of McNamara, whose True Crime Diaries blog and years of relentless determination for justice for the victims helped keep the case alive and in the public eye, and who tragically died of an accidental overdose while writing her book. A meditation on obsession and loss, I’ll Be Gone in the Dark chronicles the unrelenting path of a mysterious killer and the fierce determination of one woman to bring the case to light. more section:has(#becomes-max-on-page-banner) { background-image: none; } section:has(#becomes-max-on-page-banner) #page-band-column0 { align-items: unset !important; } #becomes-max-on-page-banner { color: #fff; } #becomes-max-on-page-banner::before { position: absolute; content: ''; width: 100vw; height: 540px; left: 0; z-index: -1; background-color:hsla(229,100%,45%,1); background-image: radial-gradient(at 37% 90%, hsla(184,100%,26%,0.32) 0px, transparent 50%), radial-gradient(at 87% 100%, hsla(239,100%,26%,0.7) 0px, transparent 50%), radial-gradient(at 100% 95%, hsla(228,100%,26%,1) 0px, transparent 50%), radial-gradient(at 4% 6%, hsla(239,100%,26%,1) 0px, transparent 50%); } #becomes-max-on-page-banner>div[class*="col"]:first-of-type img { border: 1px solid rgb(3, 118, 242); border-radius: 0.3rem; box-shadow: rgb(0 51 255 / 20%) 30px 30px 60px, rgb(0 240 255/ 30%) -30px -30px 60px; background-image: radial-gradient(rgba(0, 43, 231, 0.5), rgb(0, 0, 102,) 175%); } #becomes-max-on-page-banner .max-svg-logo { max-width: 220px; } #becomes-max-on-page-banner a.btn { position: relative; z-index: 1; } #becomes-max-on-page-banner a.btn:hover { background: #00F0FF; border-color: #000066; color: #000066; } @media screen and (min-width: 500px) { #becomes-max-on-page-banner::before { height: 600px; } } @media screen and (min-width: 768px) { #becomes-max-on-page-banner::before { height: 700px; } } @media screen and (min-width: 992px) { #becomes-max-on-page-banner::before { height: 350px; } } @media screen and (min-width: 1200px) { #becomes-max-on-page-banner::before { height: 450px; } } It's All Here Sign Up Now Dive Deeper into the Case Investigation TimelineFollow the investigation that led to the capture of the Golden State Killer with The Atlantic's companion timeline.Find Out MorePlay button link1:47The Kathy Lombardo CaseA follow-up to the 2020 docuseries, this special episode sheds new light on the 1984 murder of Kathy Lombardo — the case which sparked Michelle McNamara’s interest in cold cases.The Official Podcast Go deeper into the story after every episode with Nancy Miller and special guests. Listen Now 1.Murder HabitWriter Michelle McNamara finds a new obsession in a California cold case she dubs the "Golden State Killer."2.Reign of TerrorMichelle reflects on the murder case that sparked her interest in true crime.3.Rat in a MazeThe brutal predator moves south, where he commits yet more gruesome murders. Michelle struggles to inject her own story into her book.4.The MotherlodeAfter gaining access to a treasure trove of case files in the OC Sheriff's Department's EAR/ONS room, Michelle struggles with work-life balance.5.Monsters Recede but Never VanishAs Michelle's loved ones mourn her sudden death, her work to unmask the Golden State Killer lives on.6.Walk Into the LightFormer police officer Joe DeAngelo is arrested, leaving Michelle's fellow citizen detectives to connect the dots. Chilling facts materialize.7.Show Us Your FaceGolden State Killer survivors and victims’ family members reconvene for Joseph DeAngelo’s sentencing hearing in August 2020.You May Also Like There's Something Wrong With Aunt DianeBeware the SlendermanMommy Dead and DearestThe Jinx: The Life and Deaths of Robert Durst #footer-max-banner::before { content: ''; position: absolute; width: 100vw; height: 280px; z-index: -1; left: 0; background-size: cover; background-image: url('https://static.hbo.com/2024-10/241101-max-brand-quilt-cropped.jpg'); } #footer-max-banner { height: 280px; overflow: hidden; width: 100vw; color: white; } #footer-max-banner .btn { width: 120px; } #footer-max-banner a.btn:hover { background: #00F0FF; border-color: #000066; color: #000066; } @media screen and (min-width: 996px) { #footer-max-banner > .middle-column { width: 600px; } } @media screen and (min-width: 1400px) { #footer-max-banner::before { height: 300px; } #footer-max-banner { height: 300px; } } Stream all of HBO, plus hit se