ston: Roots, Rampage & ReckoningThe complex history of race-based hostilities in Boston is explored against the backdrop of a notorious 1989 crime.Mommy Dead and DearestA firsthand look at the true crime story of Dee Dee Blanchard and her daughter, Gypsy Rose.I'll Be Gone in the DarkThis six-part documentary series is based on Michelle McNamara's account of the 1970s and 1980s serial killer dubbed the "Golden State Killer."Crazy, Not Insane​A provocative look at the minds of serial killers through the lens of renowned psychiatrist Dorothy Otnow Lewis.There's Something Wrong With Aunt DianeAn exploration of the mystery surrounding the tragic 2009 wrong-way crash that killed a mother and seven others on New York's Taconic State Parkway.The Inventor: Out for Blood in Silicon ValleyAn inside look at Theranos and its founder Elizabeth Holmes, whose ambition spawned one of the biggest frauds in Silicon Valley.Mind Over MurderThe story of six individuals convicted, and later exonerated, for a 1985 murder in Beatrice, Nebraska, is revealed in this docuseries. section:has(#becomes-max-on-page-banner) { background-image: none; } section:has(#becomes-max-on-page-banner) #page-band-column0 { align-items: unset !important; } #becomes-max-on-page-banner { color: #fff; } #becomes-max-on-page-banner::before { position: absolute; content: ''; width: 100vw; height: 540px; left: 0; z-index: -1; background-color:hsla(229,100%,45%,1); background-image: radial-gradient(at 37% 90%, hsla(184,100%,26%,0.32) 0px, transparent 50%), radial-gradient(at 87% 100%, hsla(239,100%,26%,0.7) 0px, transparent 50%), radial-gradient(at 100% 95%, hsla(228,100%,26%,1) 0px, transparent 50%), radial-gradient(at 4% 6%, hsla(239,100%,26%,1) 0px, transparent 50%); } #becomes-max-on-page-banner>div[class*="col"]:first-of-type img { border: 1px solid rgb(3, 118, 242); border-radius: 0.3rem; box-shadow: rgb(0 51 255 / 20%) 30px 30px 60px, rgb(0 240 255/ 30%) -30px -30px 60px; background-image: radial-gradient(rgba