 Yasmin and Jackie's trip to Berlin. Robert woos a recent grad. Gus weighs a job offer.Short to the Point of PainWhen a group of online traders attempts to short squeeze FastAide, Harper questions the future of her working relationship with Bloom.Lone Wolf and CubNow certain that New York will take over the London office, Harper, Eric and Rishi join forces to pitch themselves to rival banks.JerusalemAs Harper, Eric, Danny and Rishi chase a life-changing opportunity, Yasmin reconsiders the path she imagined for herself.Il Mattino Ha L’Oro in BoccaAs Pierpoint preps for an IPO, Yasmin tries to defy assumptions, Robert mismanages Lumi’s CEO, and Harper plots to get back in the game.Smoke and MirrorsFollowing a bumpy IPO launch, Eric scrambles to maintain control over the floor. Meanwhile, Harper forms a new work alliance, Robert suffers a devastating loss, and Yasmin’s ingenuity wins Henry’s attention.ItEric, Yasmin, and Robert head to the COP Climate Conference in Switzerland to display Pierpoint’s confidence in pivoting to ethical investing. But when Harper pulls a stunt that disrupts the status quo, market support for Lumi becomes threatened.White MischiefAmid multiple crises in his personal life, Rishi takes a massive gamble that could threaten his position on the desk.Company ManAfter being summoned by a government select committee, Robert worries he’s become a pawn in a much larger battle between very powerful entities. Meanwhile, Sweetpea shares a theory with Eric that could mark the beginning of the end for Pierpoint.Nikki Beach, or: So Many Ways to LoseInvigorated by LeviathanAlpha’s success, Harper pitches an idea to Petra that finds them visiting London’s top financial institutions – including Pierpoint. Later, Yasmin leans on Harper when her world is upended by catastrophic news.Useful IdiotWhen disaster strikes during Pierpoint’s 150th anniversary celebration, Eric is summoned to the executive boardroom, while Rishi, Sweetpea, and Anraj try to save their own skins on the trading floor.Infinite LargesseAfter a long night, Eric and Pierpoint’s executives find a solution that could bring new changes – and consequences – for the firm. Meanwhile, Yasmin and Robert pay a fated visit to the countryside, and Harper’s career ambitions lead her to a crossroads.You May Also Like BettyBig Little LiesEuphoriaInsecureSuccession #footer-max-banner::before { content: ''; position: absolute; width: 100vw; height: 280px; z-index: -1; left: 0; background-size: cover; background-image: url('https://static.hbo.com/2024-10/241101-max-brand-quilt-cropped.jpg'); } #footer-max-banner { height: 280px; overflow: hidden; width: 100vw; color: white; } #footer-max-banner .btn { width: 120px; } #footer-max-banner a.btn:hover { background: #00F0FF; border-color: #000066; color: #000066; } @media screen and (min-width: 996px) { #footer-max-banner > .middle-column { width: 600px; } } @media screen and (min-width: 1400px) { #footer-max-banner::before { height: 300px; } #footer-max-banner { height: 300px; } } Stream all of HBO, plus hit series, movies, reality, and more. Sign Up Now ABOUTGET HBOHELPSHOPCAREERSHBO INSPIRESHOW TO WATCH MAXPrivacy PolicyTerms of UseAd ChoicesDo Not Sell My Personal Information© 2024 Home Box Office, Inc. All Rights Reserved.This website may contain mature content.'''
