major podcast platforms. Listen NowMaking Succession Play button link2:00Director Adam McKay Goes Behind the ScenesExecutive producer and director Adam McKay (The Big Short) and Jesse Armstrong discuss Succession's timely and topical themes.Play button link1:21Living the One Percent Life With the Succession CastBrian Cox, Sarah Snook and executive producer Adam McKay describe their portrayal of Manhattan's upper crust.Play button link3:02Castles and Cityscapes: The Locations of SuccessionThe cast and crew break down how each set piece helps benefit the season's story.Play button link2:20Women of SuccessionSarah Snook, Hiam Abass and J. Smith-Cameron explain why their characters stand out among the men.Play button link2:00The Roy Family's Drive to SucceedThe relentless ambition pulsing through Succession's ensemble will only be satisfied by winning - at any cost.Play button link2:00Understanding Power in SuccessionThe cast and crew explain how the Roy family's power and wealth drive the relationships between its members. SEASONSSeason-1Season-2Season-3Season-4 SEASONSSeason-1Season-2Season-3Season-41.CelebrationMedia magnate Logan Roy shocks his family with a stunning announcement on his 80th birthday.2.Sh*t Show at The F**k FactoryLogan's incapacitation sets off a heated succession debate among his children.3.LifeboatsKendall is confronted with a debt crisis at Waystar. Shiv bristles at Marcia's influence on Logan.4.Sad Sack Wasp TrapThe family attends an annual company gala overseen by Connor and highlighted by a surprise announcement.5.I Went to MarketKendall begins to plot a vote of no confidence against Logan. Tom questions his prenup and recruits Greg for a clandestine task.6.Which Side Are You On?Roman and Kendall attempt to sway the board, while Shiv explores her options in D.C.7.AusterlitzThe Roys gather for a family therapy session. Kendall finds his sobriety tested. Shiv considers joining the team of a divisive candidate.8.PragueTom has a bachelor party to remember. Kendall and Roman eye new business opportunities.9.Pre-NuptialThe Roys assemble at an English castle for Shiv and Tom's wedding. Kendall's plans are fast-tracked.10.Nobody Is Ever MissingLogan finds himself in crisis mode as news of a hostile takeover breaks. Kendall eyes an escape outlet.The Summer PalaceKendall tries to make amends with his dad. Logan receives stark advice from his banker.VaulterRoman and Kendall compete to "fix" Vaulter in their own unique ways. Greg wonders if ATN is the right fit. Shiv brings Tom in the loop.HuntingLogan makes an unpopular decision to acquire a rival news company. Connor's presidential announcement video irks the Roys.Safe RoomRoman starts a management training program with the "normals" in the Parks division.Tern HavenLogan tries to keep his family in line as they woo the owners of a venerable news media brand. Kendall makes his case to Naomi Pierce.ArgestesLogan's deal with the Pierces is threatened. Kendall, Shiv and Roman differ on damage control strategies.ReturnA trip to the UK finds the Roy kids negotiating with their mother. Logan turns to Rhea for advice.DundeeLogan reflects on his past and future upon returning to his hometown of Dundee, Scotland. Shiv conspires to take down Rhea.DCLogan, Kendall, Gerri and Tom testify before Congress. Shiv is candid with a key witness. Roman’s business pitch takes a scary turn.This Is Not for TearsLogan weighs whether a member of the family or a top lieutenant will need to be sacrificed to salvage the company's tarnished reputation. Roman shares his hesitations about a new source of financing, as Kendall suggests a familiar alternative.SecessionFollowing his bombshell presser, a righteous Kendall scrambles to find a base of operations, while Logan's team searches for safe harbor.Mass in Time of WarKendall tries to get his siblings, as well as Stewy and Sandi, on his side. Fearing his legal situation, Greg asks Ewan for help.The DisruptionWith the DOJ at the door, Logan summons his arsenal, while Tom makes a potentially life changing offer.Lion in the MeadowLogan and Kendall have their first meeting together with Josh, a major investor worried about their family feud.Retired Janitors of IdahoKendall and the Waystar team find themselves working together at the annual shareholders' meeting, where Logan's health takes a turn.What It TakesLogan and team head to Virginia for a conservative political conference, where Roman finds out surprising news about his mother.Too Much BirthdayAt Kendall's lavish birthday bash, Shiv and Roman try to arrange a meeting with Lukas Matsson, a tech mogul who recently snubbed Logan.ChiantishireAt a luxe family wedding in Italy, Roman airs suspicions, Gerri draws a line, and the Waystar team grows concerned about rogue tweets.All The Bells SayMatsson's vision for the GoJo-Waystar relationship leads Shiv and Roman to manage the fallout, while Logan weighs his options.The MunstersAs Kendall, Shiv and Roman hone their pitch for potential investors in LA, a call from Tom shifts the siblings' focus towards one of their dad's long-coveted companies. Back in NY, Greg's uninvited plus-one raises questions at Logan's birthday party.RehearsalWhile Kendall, Shiv, and Roman consider an aggressive play on the Matsson deal, Connor tries to make the most of his rehearsal dinner.Connor's WeddingWhile Logan doles out an unsavory task ahead of his trip to meet Matsson, Connor fixates on minutia at his wedding.Honeymoon StatesAs Roman, Kendall and Shiv navigate a misstep with Matsson, the Waystar team discusses a pivotal recommendation to the board ahead of the GoJo sale. Angling for position, Kendall seeks support from Stewy and Hugo.Kill ListAfter being summoned to Norway for a GoJo team-building retreat, Waystar’s old guard grows increasingly concerned over the trip’s true purpose. When Matsson makes a play for ATN, Shiv, Kendall and Roman consider whether to fight for Logan’s crown jewel.Living+Ahead of Investor Day, Shiv weighs a proposal from Matsson, while Kendall and Roman each try to match Logan’s volatile leadership style.Tailgate PartyHoping to work the angles, Kendall and Roman ask Shiv to invite a campaign insider to Logan’s pre-election day party.America DecidesOn election night, Tom tries to manage an increasingly chaotic newsroom, while Kendall, Shiv and Roman spar over the consequences of the result -- for themselves, the company and the country.Church and StateAs the family girds themselves for an emotional funeral, Kendall finds himself at odds with Rava ... and inopportune news from Jess. Later, Shiv tries to reposition herself within a new political landscape, as Kendall rallies supporters to his side.With Open EyesAhead of the final board vote on the Waystar-GoJo deal, Kendall and Shiv try to shore up their opposing interests … and get a fix on the whereabouts of a physically and emotionally bruised Roman.You May Also Like Six Feet UnderVeepThe SopranosThe Wizard of Lies #footer-max-banner::before { content: ''; position: absolute; width: 100vw; height: 280px; z-index: -1; left: 0; background-size: cover; background-image: url('https://static.hbo.com/2024-10/241101-max-brand-quilt-cropped.jpg'); } #footer-max-banner { height: 280px; overflow: hidden; width: 100vw; color: white; } #footer-max-banner .btn { width: 120px; } #footer-max-banner a.btn:hover { background: #00F0FF; border-color: #000066; color: #000066; } @media screen and (min-width: 996px) { #footer-max-banner > .middle-column { width: 600px; } } @media screen and (min-width: 1400px) { #footer-max-banner::before { height: 300px; } #footer-max-banner { height: 300px; } } Stream all of HBO, plus hit series, movies, reality, and more. Sign Up Now ABOUTGET HBOHELPSHOPCAREERSHBO INSPIRESHOW TO WATCH MAXPrivacy PolicyTerms of UseAd ChoicesDo Not Sell My Personal Information© 2024 Home Box Office, Inc. All Rights Reserved.This website may contain mature content.'''
