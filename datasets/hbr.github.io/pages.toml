["https://hbr.github.io/Lambda-Calculus/computability/text.html"]
title = "Limits of Computability in Lambda Calculus"
full_description = "We explore the limits of computability, i.e. the question: Are there functions which cannot be computed? At the turn of the 19th/20th century there was a great optimism regarding this question. Most of the mathematicians thought that every mathematical function must be computable, every mathematical question has to be decidable. The famous german mathematician David Hilbert formulated a program (today called Hilbert’s program) to ground all mathematics on axioms and formal proofs and prove that such a system is free of inconsistencies. In such a formal system it should be possible to prove or disprove all mathematical statements. He expressed his belief with his famous sentence This optimism had not been restricted to mathematics. It had been present in all science and technology. The Eiffel tower has been build for the world exposition in 1889. A 324 m high steel building representing the power of technology. Albert Einstein published 1905 his theory of relativity and in 1915 his theory of general relativity. Both theories had been verified by various experiments. The Wright brothers invented and flew the first airplane in 1903. But let’s go back to mathematics. In 1901 Bertrand Russel discovered a paradox in naive set theory. It has been customary to talk about the set of all sets. Bertrand Russel found out that this leads to the paradoxical Does this unversal set contain itself? If yes, it contains itself and therefore cannot be in the set. If no, it does not contain itself and therefore must contain itself. In order to avoid such paradoxes which lead to contradictions, Whitehead and Russel published in 1910, 1912 and 1913 the famous Principia Mathematica which provided a foundation for mathematics free of paradoxes. The young viennese mathematician Kurt Goedel invented a technique called Goedel Numbering. He used this technique to formulate a sentence similar to Russel’s paradox as a mathematical statement about natural numbers. Such a statement can be expressed in the formalism of Principia Mathematica and therefore can be injected into Principia Mathematica like a Trojan horse. In his famous incompleteness theorem (1931) Goedel demonstrated that paradoxical statements can be injected into all formalisms which are powerful enough to express basic arithmetics."
author = "Helmut Brandl"
year_published = 2025
clearnet = "https://hbr.github.io/Lambda-Calculus/computability/text.html"
