["https://hbr.github.io/Lambda-Calculus/lambda2/lambda.html"]
title = "Programming with Lambda Calculus"
full_description = 'Abstract An introduction into lambda calculus emphasizing the use of lambda calculus as a programming language. An introduction into lambda calculus emphasizing the use of lambda calculus as a programming language. This is the reason why Alonzo Church (1936) invented the lambda calculus. He wanted to explore the limits of computability and decidability. If you want to prove that something is undecidable you need a clear definition what you mean by computable or decidable. Lambda calculus is the proper tool. It is fun. In lambda calculus we don’t care about execution. We just express functions. And as you will see: We can express arbitrarily complex and interesting functions. No matter if their execution would last longer than the universe exists. We can learn a lot about computation. In lambda calculus we can express iteration, recursion, arbitrary data structures by using only variables, functions and function applications. In the following I do not expect any prior knowledge. The reader should have some experience with programming. Many texts on lambda calculus use a lot of math. The goal usually is not to do programming in lambda calculus, only to demonstrate its computational power. In this text we use lambda calculus as a programming language. We build first simple functions and step by step compose the simple functions to more complex functions. At the end, the same goal is achieved: Demonstrate the expressive power of lambda calculus. But I hope that leaving out math notation makes the topic more accessible. Feel free to post any question, comment, remark or discusion as a github issue on https://github.com/hbr/Lambda-Calculus/issues In lambda calculus everything is a function. A lambda term is either a variable, a function application or a function abstraction. The bound variable is meaningful only within the body. We can change the name of the bound variable arbitrarily as long as we change it consistently within the body. What can we do with a function? We can apply it to an argument and get (\ x := e) a. This term is called a reducible expression (short redex). As the name says, this expression can be reduced or we can compute the result of the function applied to the argument.'
author = "Helmut Brandl"
year_published = 2025
clearnet = "https://hbr.github.io/Lambda-Calculus/lambda2/lambda.html"
