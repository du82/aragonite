["https://hbr.github.io/Programming/redblack/doc/redblack.html"]
title = "Introduction to Red Black Trees"
full_description = "An algorithm for insertion and deletion in a red black tree in a functional setting is described. The description provides evidence for the correctness of the algorithm. A red black tree is not a trivial data structure. If you read the wikipedia article, you have the impression, that insertion and deletion are really very complicated, because there are many cases to distinguish. Especially deletion seems to be mind bending. In this article we describe an algorithm which reduces the necessary case analysis to a minimum. We try to make the cases as orthogonal as possible, to make them comprehensible. A red black tree is either an empty tree or a node with a color, a left child, an info element and a right child. Insertion and deletion is always done at the bottom. We insert a node by replacing an empty tree with a singleton red node. We delete a node by replacing a singleton node (i.e. a node with two empty children) with an empty node. Because the empty tree is considered black, a singleton red node does not violate the invariant. It has two empty black children. If h is the black height of a red black tree, then the maximal height of the tree is 2 * h + 1. E.g. a singleton red node has black height 0 but height 1. Insertion and deletion might create a violation of the invariant. Inserting a singleton red node below a red node might create a red violation because there are two red nodes in a row. Deleting a black node might create a black violation, because its sibling has a black height of one and the empty node has a black height of zero. A red black tree is sorted. If we want to insert an info element into a tree, we search for it following the order relation of the info element. There are two possiblilities. The second case is problematic, because we want to insert a red node below a red parent. We know that the grandparent must be black. We could swap the colors of the parent and the grandparent, creating a new red violation. This can bubble up until we reach two black nodes in a row."
author = "Helmut Brandl"
year_published = 2025
clearnet = "https://hbr.github.io/Programming/redblack/doc/redblack.html"
