["https://hbr.org/2025/01/parents-are-minimizing-work-relationships-to-make-time-for-childcare"]
title = "Parents Are Minimizing Work Relationships to Make Time for Childcare"
description = "Employees with children have to make calculated decisions about who they interact with, and when, in order to both produce high-quality work and make time for caregiving. Research shows they tend to do this by avoiding interactions, like turning down invites to lunch; hiding from coworkers by working at home or even sneaking off to the bathroom at a time when everyone else is in a work meeting; organizing interactions strategically by booking meetings back-to-back so that they can promptly end an earlier meeting; and focusing interactions by coming to meetings with set agendas and redirecting conversation from talk of non-work activities. These strategies work, but they can come at a cost: some parents do not feel they have many close friends at work, do not feel a sense of belonging, and are out of the loop on workplace gossip. This can have professional and team ramifications, which both managers and parents can remedy in different ways."
full_description = "Balancing work and familyParents Are Minimizing Work Relationships to Make Time for Childcare by Vanessa M. Conzon and Ruthanne HuisingJanuary 2, 2025Jessica Peterson/Getty ImagesPostPostShareSaveBuy CopiesPrintSummary. Leer en españolLer em portuguêsPostPostShareSaveBuy CopiesPrintJenna is stressed. She has to perform some research for a client report, write up part of the report, and leave the office by 5 PM so she can pick up her son from after-school care. Working furiously, she feels she is finally hitting her stride when Seth — her colleague who sits on the same floor — stops by her office to say hi and ask how her weekend was. Jenna smiles and, politely but curtly, states that she had a good weekend. She does not return the question, and Seth leaves. As soon as he exits, she quickly returns to the report.Read more on Balancing work and family or related topics Time management, Work-life balance, Working parents, Collaboration and teams, Employee engagement, Work environments, Managing people, Professional networks and Interpersonal communicationVanessa M. Conzon is an assistant professor of management and organization at Boston College, Carroll School of Management (conzon@bc.edu). Her research focuses on the intersections between work, autonomy, and diversity. She received her Ph.D. from MIT Sloan School of Management.RHRuthanne Huising studies professions and expertise in the contexts of technological, organizational, and institutional change. She is a Professor of Management at ESSEC Business School.PostPostShareSaveBuy CopiesPrintRead more on Balancing work and family or related topics Time management, Work-life balance, Working parents, Collaboration and teams, Employee engagement, Work environments, Managing people, Professional networks and Interpersonal communication"
