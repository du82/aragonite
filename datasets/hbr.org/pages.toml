["https://hbr.org/2025/02/research-to-retain-employees-promote-them-before-the-job-market-heats-up"]
title = "Research: To Retain Employees, Promote Them Before the Job Market Heats Up"
description = "Labor markets regularly swing from firm-friendly to job seeker–friendly, causing organizations to fluctuate greatly in terms of the number of employees at hand to meet customers’ needs. But is there a way employers can future-proof their workforce, encouraging talent to stay when jobs are plentiful? Drawing on turnover data for over 11,000 managers from 2018 to 2023 (including pre-pandemic, pandemic, and “Great Resignation” labor shifts), researchers found that promoting employees during employer-friendly labor markets reduces the likelihood that these employees will quit later when the job market shifts in their favor. They offer suggestions for companies looking to increase talent retention rates and make their workforce more resilient to market changes."
full_description = "Economic cycles and trendsResearch: To Retain Employees, Promote Them Before the Job Market Heats Up by Chase Thiel, Anthony C. Klotz, Jay H. Hardy III, Carter Gibson and Andrew BarsaFebruary 20, 2025master1305/Getty ImagesPostPostShareSaveBuy CopiesPrintSummary. Leer en españolLer em portuguêsPostPostShareSaveBuy CopiesPrintFor a moment, let’s flash back to 2020: a year when disruptions triggered by the Covid-19 pandemic forced many firms to freeze hiring or lay off workers, creating a labor market in which those looking for work far outstripped open positions. One year later, as the pandemic eased and the economy reopened, firms found themselves in the opposite situation, struggling to fill an excess of open roles. This economic shift helped catapult the Great Resignation, a period lasting from 2021 to 2023 when well over 100 million U.S. workers, finding the market in their favor, quit their jobs, often in pursuit of higher salaries or better benefits.Read more on Economic cycles and trends or related topics Managing people, Talent management, Employee retention and Hiring and recruitmentChase Thiel , Ph.D., is the Rile Chair of Leadership and a Full Professor of Management at the University of Wyoming. His research focuses on workplace ethics and leadership, examining the causes of unethical behavior, methods to foster ethical practices, and the role of ethical leadership.AKAnthony C. Klotz is an Associate Professor of Organizational Behavior at UCL School of Management in London. His research focuses on understanding employees’ relationships with work, through the lenses of resignations, citizenship behavior, and biophilic design.JIJay H. Hardy III is a Stirek Professor of Management and Associate Dean of Research in the College of Business at Oregon State University. His research focuses on how organizations can improve hiring, retention, and employee development. His work has been published in top academic journals and has directly influenced the talent management practices at several Fortune 50 companies.CGCarter Gibson , Ph.D., is Principal Scientist at HireVue, where he works on projects requiring expertise in test construction, validation, and the identification of high-potential talent. His applied research on withdrawal behaviors across the employee lifecycle, including pre-hire dropout, new-hire ghosting, and early turnover has been published in leading academic journals.ABAndrew Barsa , M.S., is a Senior IO Psychology Consultant at HireVue. His primary focus is working with the world’s largest employers to develop, validate, and ensure the effectiveness of large-scale pre-employment assessments. His expertise is demonstrating ROI and efficiency gains in hiring.PostPostShareSaveBuy CopiesPrintRead more on Economic cycles and trends or related topics Managing people, Talent management, Employee retention and Hiring and recruitment"
