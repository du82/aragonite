["https://hbr.org/2011/07/are-you-a-collaborative-leader"]
title = "Are You a Collaborative Leader?"
description = "Reprint: R1107D Social media and technologies have put connectivity on steroids and made collaboration more integral to business than ever. But without the right leadership, collaboration can go astray. Employees who try to collaborate on everything may wind up stuck in endless meetings, struggling to reach agreement. On the other side of the coin, executives who came of age during the heyday of “command and control” management can have trouble adjusting their style to fit the new realities. In their research on top-performing CEOs, Insead professors Ibarra and Hansen have examined what it takes to be a collaborative leader. They’ve found that it requires connecting people and ideas outside an organization to those inside it, leveraging diverse talent, modeling collaborative behavior at the top, and showing a strong hand to keep teams from getting mired in debate. In this article, they describe tactics that executives from Akamai, GE, Reckitt Benckiser, and other firms use in those four areas and how they foster high-performance collaborative cultures in their organizations."
full_description = "LeadershipAre You a Collaborative Leader? by Herminia Ibarra and Morten T. HansenFrom the Magazine (July–August 2011)PostPostShareSaveBuy CopiesPrintSummary. Leer en españolLer em portuguêsPostPostShareSaveBuy CopiesPrintWatching his employees use a new social technology, Marc Benioff, the CEO of Salesforce.com, had an epiphany. His company had developed Chatter, a Facebook inspired application for companies that allows users to keep track of their colleagues and customers and share information and ideas. The employees had been trying it out internally, not just within their own work groups but across the entire organization. As Benioff read the Chatter posts, he realized that many of the people who had critical customer knowledge and were adding the most value were not even known to the management team.Read more on Leadership or related topics Diversity and inclusion, Collaboration and teams and Leading teamsA version of this article appeared in the July–August 2011 issue of Harvard Business Review.HIHerminia Ibarra is the Charles Handy Professor of Organisational Behaviour at London Business School and the author of Act Like a Leader, Think Like a Leader, revised edition (Harvard Business Review Press, 2023), and Working Identity (Harvard Business Review Press, 2023).@HerminiaIbarraMHMorten T. Hansen is a professor at the University of California, Berkeley, and a faculty member at Apple University, Apple. He is the author of Great at Work and Collaboration and coauthor of Great by Choice. He was named one of the top management thinkers in the world by the Thinkers50 in 2019.@MortentHansenPostPostShareSaveBuy CopiesPrintRead more on Leadership or related topics Diversity and inclusion, Collaboration and teams and Leading teams"
year_published = 2011
year_updated = 2022
