["https://hbr.org/2025/02/how-bmw-started-auditing-emissions-across-its-supply-chain"]
title = "How BMW Started Auditing Emissions Across Its Supply Chain"
description = "Many organizations in the private and non-profit sectors have now piloted versions of the E-liability algorithm, providing increasing momentum for its use as a global emissions accounting standard. An important question amongst companies adopting this approach is what to do when one or more key suppliers lack the capacity to calculate the emissions embedded in the products they supply. This article shows how the Bavarian automaking behemoth BMW managed this challenge as it started to roll out the approach, and there are valuable lessons to learn from BMW’s experience for other companies seeking to be first-movers in building a competitive emissions-advantage in the carbon economy."
full_description = "Climate changeHow BMW Started Auditing Emissions Across Its Supply Chain by Karthik Ramanna and Lauren HollowayFebruary 26, 2025picture alliance/Getty ImagesPostPostShareSaveBuy CopiesPrintSummary. Leer en españolLer em portuguêsPostPostShareSaveBuy CopiesPrintIn the United States, Europe, and elsewhere, policymakers have noticed that producers’ carbon emissions differ in different parts of the world—and politicians are increasingly crafting regulations based on that variance. Examples include: import tariffs dependent on products’ embedded emissions, such as the E.U.’s Carbon Border Adjustment Mechanism or the U.S.’s Foreign Pollution Fee Act; mandatory carbon labelling for certain high-profile, high-emissions products such as in the E.U.’s Battery Regulation; and public procurement rules that favor low-emissions products.Read more on Climate change or related topics Environmental sustainability and AccountingKarthik Ramanna is a professor of business and public policy at University of Oxford’s Blavatnik School of Government and was previously a professor and the Marvin Bower Fellow at Harvard Business School. He coauthored the McKinsey Award–winning HBR article “Accounting for Climate Change” (November–December 2021) and is author of The Age of Outrage: How to Lead in a Polarized World. He is cofounder and principal investigator of the E-liability Institute, a global not-for-profit advancing the urgent accounting upgrade needed to drive green innovation.LHLauren Holloway is Chief of Staff at the E-Liability Institute, a not-for-profit learning organization focused on advancing rigorous emissions-accounting practices.PostPostShareSaveBuy CopiesPrintRead more on Climate change or related topics Environmental sustainability and Accounting"
