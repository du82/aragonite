["https://hbr.org/2025/02/how-ageism-is-undermining-ai-implementation"]
title = "How Ageism Is Undermining AI Implementation"
description = "Companies often assume that older workers are less adept at adapting to new technologies. As leaders look to bring new AI tools onboard, many believe that younger workers will be better able to integrate these tools into their work. A recent survey suggests this view may be unfounded. When hiring managers—many of whom held this view—were asked to assess the job performance of the midcareer and older workers whom they already employ, 89% reported that these individuals performed as well if not better than younger peers. Midcareer and older workers offer unique strengths when it comes to working with AI. For companies that want to drive AI adoption, these workers are an essential asset that can’t be overlooked."
full_description = "AI and machine learningHow Ageism Is Undermining AI Implementation by Mona Mourshed and Anika HeavenerFebruary 25, 2025Illustration by Ricardo Toma&#769;sPostPostShareSaveBuy CopiesPrintSummary. Leer en españolLer em portuguêsPostPostShareSaveBuy CopiesPrintEmployers are currently making two big assumptions. First, that AI tools such as generative AI and AI agents are going to remake how we work. And second, that midcareer and older workers aren’t suited to adapt to these technologies. While we’ll have to wait and see how the first assumption shakes out, we know right now that the second is wrong. And unless it’s challenged, both workers and employers will lose out.Read more on AI and machine learning or related topics Technology and analytics, Human resource management and Digital transformationMMMona Mourshed is the founding CEO of Generation: You Employed.AHAnika Heavener is the Vice President of Innovation and Investments at The Scan Foundation.PostPostShareSaveBuy CopiesPrintRead more on AI and machine learning or related topics Technology and analytics, Human resource management and Digital transformation"
