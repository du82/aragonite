["https://hbr.org/2021/04/how-20th-century-black-business-leaders-envisioned-a-more-just-capitalism"]
title = "How 20th-Century Black Business Leaders Envisioned a More Just Capitalism"
description = "In the early 20th century, the US saw what’s been called a golden age of Black business and of Black business thinkers, one that has been elided in traditional business history taught in classrooms and leadership trainings. In this highly segregated era, leaders like Charles Clinton Spaulding and Maggie Lena Walker created and ran successful regional, national, and international corporations that employed and served the Black community in unique ways. The authors, two business historians, describe these leaders and show the ways in which the theme of social support runs throughout their work. The authors argue that leaders in today’s world have a lot to learn from this “cooperative advantage” as they seek a more sustainable, stakeholder-based form of capitalism."
full_description = "Business historyHow 20th-Century Black Business Leaders Envisioned a More Just Capitalism by Leon C. Prieto and Simone T.A. PhippsApril 7, 2021Maggie Lena Walker (left) and Charles Clinton Spaulding (right) HBR Staff/Archive Holdings Inc./Getty ImagesPostPostShareSaveBuy CopiesPrintSummary. Leer en españolLer em portuguêsPostPostShareSaveBuy CopiesPrintThink back over the pantheon of 20th-century corporate leaders and thinkers you learned about in business school and you’ll likely conjure up figures like Frederick Winslow Taylor, Peter Drucker, Jack Welch, or Clayton Christensen. It’s hardly a surprise that these canonical giants are largely male and white. What’s less well known is that the same century in the U.S. saw a golden age of Black business and Black business thinkers. Deeply rooted systemic prejudices meant that these individuals and their thinking were omitted from most textbooks, leadership workshops, and from public consciousness. It’s past time to incorporate their work into what we know of business history, not only because it is the ethical thing to do but because in our research as management historians, we’ve found that a more racially inclusive history of management is filled with profound advice about the role of business in society that is relevant for leaders today.Read more on Business history or related topics Corporate social responsibility, Marginalized groups, Race and CapitalismLPLeon C. Prieto (@leoncprieto) is an associate professor of management at Clayton State University and an associate research fellow at the Judge Business School’s Centre for Social Innovation at the University of Cambridge.SPSimone T.A. Phipps (@DrSimonePhipps) is an associate professor of management at Middle Georgia State University and an associate research fellow at the University of Cambridge Judge Business School’s Centre for Social Innovation. They are both members of the Thinkers50 Radar Class of 2021, and the authors of African American Management History: Insights on Gaining a Cooperative Advantage (Emerald Publishing, 2019).PostPostShareSaveBuy CopiesPrintRead more on Business history or related topics Corporate social responsibility, Marginalized groups, Race and Capitalism"
year_published = 2021
clearnet = "https://hbr.org/2021/04/how-20th-century-black-business-leaders-envisioned-a-more-just-capitalism"
