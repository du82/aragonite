["https://hbr.org/2025/02/everyone-deserves-a-season-to-step-back"]
title = "Everyone Deserves a Season to Step Back"
description = "When people need a short break from work — due to an emergency such as an illness or caregiving demands or an opportunity such as taking part in a play or an athletic tournament — too often they’re either forced to push through or step away from their job duties entirely. There may be a better, third option, however: a “season of stepping back.” This is a time-limited adjustment in work duties codesigned by the employee, their team and manager, and HR, which comes at no cost to the person’s career prospects when they are ready to reengage. While such arrangements are rare, they bring many long-term benefits to both employees and organizations, including continued engagement and improved retention. More companies should consider using seasons of stepping back as part of their talent strategy."
full_description = "Matt CarlsonPersonal growth and transformationThe Big Idea Series/The Power of Time OffEveryone Deserves a Season to Step BackEasing up on your work duties for a limited time can give you the energy you’ll need to flourish later. by Christina WallaceFebruary 4, 2025The Big Idea Series / The Power of Time Off01The Case for Sabbaticals — and How to Take a Successful One02A Guide to Taking Better Breaks at Work03Everyone Deserves a Season to Step Back04When Employees Take Sabbaticals, Organizations BenefitSummary. PostPostShareSaveBuy CopiesPrintThe generally accepted framework for working at a job is either you do it or you don’t. The expectation is that, if you’re working, you’re fully committed. All in. Giving it 110%, as the saying goes. Or else you’re taking a full leave of absence to manage an illness, for example, or to take a sabbatical.Read more on Personal growth and transformation or related topics Personal purpose and values, Burnout, Career planning, Time-off policies and Talent managementChristina Wallace is a self-described “human Venn diagram” who has built a career at the intersection of business, technology, and the arts. She is a senior lecturer of entrepreneurial management at Harvard Business School, a Broadway producer through Nothing Ventured Productions, the author of The Portfolio Life (Balance, 2023), and a coauthor of New to Big (Crown Currency, 2019).@cmwallaPostPostShareSaveBuy CopiesPrintThe Big Idea Series / The Power of Time Off01The Case for Sabbaticals — and How to Take a Successful One02A Guide to Taking Better Breaks at Work03Everyone Deserves a Season to Step Back04When Employees Take Sabbaticals, Organizations BenefitRead more on Personal growth and transformation or related topics Personal purpose and values, Burnout, Career planning, Time-off policies and Talent management"
