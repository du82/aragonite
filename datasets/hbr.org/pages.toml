["https://hbr.org/2024/12/is-ai-the-right-tool-to-solve-that-problem"]
title = "Is AI the Right Tool to Solve That Problem?"
description = "While AI has the potential to solve major problems, organizations embarking on such journeys of often encounter obstacles. They include a dearth of high-quality data; too many possible solutions; the lack of a clear, measurable objective; and difficulty in identifying whether a proposed solutions is “good.” In tackling these issues, Google DeepMind, Alphabet’s AI lab that is striving to solve extremely challenging real-world problems, has come up with solutions that can benefit others. And it also offers guidance in choosing which opportunities to pursue after potential projects have overcome those hurdles."
full_description = "AI and machine learningIs AI the Right Tool to Solve That Problem? by Paolo Cervini, Chiara Farronato, Pushmeet Kohli and Marshall W. Van AlstyneDecember 18, 2024seb_ra/Getty ImagesPostPostShareSaveBuy CopiesPrintSummary. Leer en españolLer em portuguêsPostPostShareSaveBuy CopiesPrintArtificial intelligence has witnessed a remarkable surge, captivating researchers, product teams, and end users alike with its transformative potential. But despite its recent popularity, AI is only successful in solving problems with very specific features. In this article, we offer guidance to help organizations identify the right problems to address with AI, to find solutions when the context does not perfectly align with what AI is best at solving, and, after potential projects have overcome those hurdles, to choose those that can offer the largest benefits for business or for broader society.Read more on AI and machine learning or related topic Product managementPaolo Cervini is a strategic advisor on AI, sustainability, and business innovation. Previously, he was content coordinator at HBR Italia.Chiara Farronato is the Glenn and Mary Jane Creamer Associate Professor of Business Administration at Harvard Business School and co-principal investigator at the Platform Lab at Harvard’s Digital Design Institute (D^3). She is also a fellow at the National Bureau of Economic Research and the Center for Economic Policy Research.Pushmeet Kohli is the vice president of science and strategic efforts at Google DeepMind, where he leads AI for Science research efforts such as AlphaFold, a breakthrough AI system for predicting the 3D structures of proteins, and SynthID, a state-of-the-art method for watermarking and detecting AI-generated content.Marshall W. Van Alstyne is the Allen & Kelli Questrom Professor at Boston University, a digital fellow at the MIT Initiative on the Digital Economy, and a visiting scholar at the Harvard Berkman-Klein Center.@InfoEconPostPostShareSaveBuy CopiesPrintRead more on AI and machine learning or related topic Product management"
