["https://hbr.org/2024/06/how-retailers-became-ad-platforms"]
title = "How Retailers Became Ad Platforms"
description = "Major retailers are today, most notably Amazon, are creating and operating their own advertising platforms — and they’re making millions doing it. McKinsey estimates that by 2026, retail media will add $1.3 trillion to enterprise values in the U.S. alone, with profit margins between 50% and 70%. In this article, the authors introduce readers to the main kinds of retail media, discuss three strategic challenges that they present, and provide guidance for effectively managing those challenges."
full_description = "Sales and marketingHow Retailers Became Ad Platforms by Sebastian Gabel, Duncan Simester and Artem TimoshenkoJune 17, 2024HBR Staff/Artur Debat/fotograzia/Getty ImagesPostPostShareSaveBuy CopiesPrintSummary. Leer en españolLer em portuguêsPostPostShareSaveBuy CopiesPrintA rapidly growing number of major retailers are today creating and operating their own advertising platforms — a phenomenon widely referred to as retail media. Nobody has had more success in the space than Amazon, which in 2023 earned $46.9 billion from advertising, comprised primarily of sponsored ads on its site. This figure exceeds the annual global revenue of Coca-Cola and makes Amazon the third-largest advertising platform in the United States, behind only Google and Facebook.Read more on Sales and marketing or related topics Advertising, Marketing and SalesSGSebastian Gabel is an assistant professor of marketing at Erasmus University. His research focuses on developing deep learning for targeting applications in retailing. Prior to his academic career, Sebastian co-founded a retail-media services company that was sold to the Schwarz global retail group.DSDuncan Simester is the NTU Professor of Marketing at the MIT Sloan School of Management. His research focuses on marketing strategy, go-to-market strategies, and the use of artificial intelligence and experiments to improve business decisions. He regularly consults with companies on these topics.ATArtem Timoshenko is an assistant professor of marketing at the Kellogg School of Management, at Northwestern University. His research focuses on applications of AI to marketing analytics and customer insights.PostPostShareSaveBuy CopiesPrintRead more on Sales and marketing or related topics Advertising, Marketing and Sales"
