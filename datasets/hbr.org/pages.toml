["https://hbr.org/2024/12/why-your-finance-team-should-help-make-big-ai-decisions"]
title = "Why Your Finance Team Should Help Make Big AI Decisions"
description = "The companies that succeed with AI aren’t necessarily those with the most advanced models or the largest data sets — they’re the ones that bring together diverse expertise to make the smartest decisions. Finance, with its ability to ascertain value, ensure accountability, and provide an objective perspective, plays an indispensable role in making AI investments truly pay off. By involving finance teams early and often, companies can transform AI from an exciting possibility into a reliable growth engine — one that delivers both top-line expansion and operational excellence."
full_description = "AI and machine learningWhy Your Finance Team Should Help Make Big AI Decisions by Jason McDannold, Hoyoung Pak and Paula WalworthDecember 19, 2024Jorg Greuel/Getty ImagesPostPostShareSaveBuy CopiesPrintSummary. Leer en españolLer em portuguêsPostPostShareSaveBuy CopiesPrintCompanies have adopted artificial intelligence with almost unheard-of speed, but there remains a significant gap between enthusiasm and results. In a recent survey of 750 executives (150 in tech, 600 in other industries), a strong majority (65%) told us they believe they have an advanced understanding of AI and its benefits, and 18% said they have a cutting-edge understanding. But only 6% claim to have a cutting-edge ability to derive value and P&L impact from the technologies.Read more on AI and machine learning or related topics Finance and investing and Generative AIJason McDannold is a partner and managing director at AlixPartners, where he is the co-lead of the Americas Private Equity and Investors practice.Hoyoung Pak is a partner and managing director at AlixPartners, and is the Global Co-leader of the firm’s AI and Data Practice.Paula Walworth is a partner at AlixPartners, where she teams with companies to drive operational transformations and topline growth based upon technology investments.PostPostShareSaveBuy CopiesPrintRead more on AI and machine learning or related topics Finance and investing and Generative AI"
