["https://hbr.org/2025/02/how-to-give-yourself-more-space-to-think"]
title = "How to Give Yourself More Space to Think"
description = "Professionals today are focused on doing mode — achieving goals and checking items off of to-do lists to satisfy their managers and companies. But better relationships, bigger-picture strategic and creative thinking, and personal well-being and satisfaction rely on pausing from doing mode and entering into spacious mode . To do this amidst daily pressures, people should recognize that they first need to give themselves permission to pause, adopt practices to train their minds to be more spacious, build a safe space for pausing around them, and keep the company of those who help them enter spacious mode."
full_description = "Mental healthHow to Give Yourself More Space to Think by Megan Reitz and John HigginsFebruary 6, 2025MirageC/Getty ImagesPostPostShareSaveBuy CopiesPrintSummary. Leer en españolLer em portuguêsPostPostShareSaveBuy CopiesPrintWe live in a work world obsessed with what we in our research call doing mode — setting goals, forming to-do lists, and checking items off, busily. We talk incessantly about short-term, tangible targets that are easy to measure in our jobs, and our managers tacitly and explicitly encourage us to pay most if not all of our attention to them. And to be sure, “getting stuff done” is necessary for corporate survival.Read more on Mental health or related topics Burnout, Stress management, Creativity, Managing up, Time management, Managing yourself and Personal resilienceMegan Reitz is an associate fellow at Saïd Business School, University of Oxford, and adjunct professor of leadership and dialogue at Hult International Business School. She is the author of Dialogue in Organizations (2015) and the coauthor of Mind Time (2018), Speak Up (2019), and the second edition of Speak Out, Listen Up (2024). Follow her on LinkedIn or meganreitz.com.John Higgins is a researcher, author, and coach. He is a research fellow at GameShift and the director of research at The Right Conversation. John has worked in close collaboration with Megan Reitz for over a decade, and their latest book is Speak Out, Listen Up (2024). PostPostShareSaveBuy CopiesPrintRead more on Mental health or related topics Burnout, Stress management, Creativity, Managing up, Time management, Managing yourself and Personal resilience"
