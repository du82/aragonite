["https://hbr.org/2025/02/how-to-assess-the-new-legal-risks-of-your-dei-policies"]
title = "How to Assess the New Legal Risks of Your DEI Policies"
description = "While legal battles over DEI are currently being fought in the U.S. courts, the Trump administration has signaled its intention to make noncompliance with its executive orders so punitive that leaders are understandably and urgently looking for guidance on how to pursue their lawful, fair, and business-driven DEI initiatives. This article takes a look at some of the most common corporate DEI programs and assesses their level of legal and regulatory risk, as well as the research on their effectiveness. The good news is that the most effective programs are also the programs that carry the lowest legal risk."
full_description = "Diversity and inclusionHow to Assess the New Legal Risks of Your DEI Policies by Joan C. Williams, Laura J. Maechtlen and Jamie DolkasFebruary 27, 2025Illustration by Helena Pallare&#769;sPostPostShareSaveBuy CopiesPrintSummary. Leer en españolLer em portuguêsPostPostShareSaveBuy CopiesPrintWith a series of executive orders, the Trump administration has put a target on corporate diversity, equity, and inclusion policies. As of this writing, key portions have been enjoined by a federal court. Yet the administration has signaled its intention to make noncompliance so punitive that many companies still are scrambling to review their DEI programs and practices for EO compliance.Read more on Diversity and inclusion or related topics Gender, Marginalized groups, Race, Workplace discrimination and Cognitive biasJoan C. Williams is director of the Equality Action Center and author of Bias Interrupted: Creating Inclusion for Real and for Good (HBR Press) and Outclassed: How the Left Lost the Middle Class and How to Win Them Back (forthcoming, May 2025, St. Martin’s).Laura J. Maechtlen is a partner with Seyfarth Shaw LLP, chair of the labor and employment department, and has been involved in leading and advising on lawful inclusion initiatives for over a decade.Jamie Dolkas is Equality Action Center’s SVP of strategy and research and adjunct law professor at the University of California, College of the Law, San Francisco. She leads EAC’s strategy and leadership programming.PostPostShareSaveBuy CopiesPrintRead more on Diversity and inclusion or related topics Gender, Marginalized groups, Race, Workplace discrimination and Cognitive bias"
