["https://hbr.org/2024/09/research-how-to-delegate-decision-making-strategically"]
title = "Research: How to Delegate Decision-Making Strategically"
description = "Delegating work can help free up managers’ time and energy while empowering their employees to take on meaningful tasks. Yet, previous research has shown that delegating decision-making can cause employees to feel overly burdened. In a new paper, researchers examine the negative impact that handing over choice responsibility can have on delegator-delegate relationships. They offer research-backed solutions for delegating decisions more fairly in order to offset some of delegation’s negative interpersonal consequences."
full_description = "Collaboration and teamsResearch: How to Delegate Decision-Making Strategically by Hayley Blunden and Mary SteffelSeptember 10, 2024Erik Isakson/Getty ImagesPostPostShareSaveBuy CopiesPrintSummary. Leer en españolLer em portuguêsPostPostShareSaveBuy CopiesPrintEffective delegation is critical to managerial success: delegating properly can help empower employees, and those who delegate can increase their earnings. Delegation can also be a way for managers to give employees experience and control, especially when they delegate decision-making responsibilities, which allow employees to exhibit agency over important stakes. Yet, some of our recent research has shown that employees can view delegated decision-making as a burden that they would prefer to avoid.Read more on Collaboration and teams or related topics Leadership and managing people, Delegating, Managing employees and Management skillsHayley Blunden is an assistant professor of management at the Kogod School of Business at American University. Her research focuses on how leaders can make workplace interaction more productive.MSMary Steffel is an associate professor of marketing at D’Amore-McKim School of Business, Northeastern University. Her research focuses on examining when we call upon others to help us make decisions, how we navigate making decisions for others, and how we can support others in making better decisions. See her faculty page here.PostPostShareSaveBuy CopiesPrintRead more on Collaboration and teams or related topics Leadership and managing people, Delegating, Managing employees and Management skills"
