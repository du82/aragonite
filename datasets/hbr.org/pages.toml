["https://hbr.org/2024/09/a-workaholics-guide-to-reclaiming-your-life"]
title = "A Workaholic’s Guide to Reclaiming Your Life"
description = "Workaholism is when work dominates your thoughts and your activities, to the detriment of other aspects of your life, including but not limited to your relationships and your health. In this article, Malissa Clark presents depictions of workaholism and equips readers with six coping strategies to break the cycle. Through mechanisms such as redefining what is and is not urgent, fixing the workaholic clock, and embracing rest and recovery, workaholics can unlearn toxic behaviors and reclaim their time and lives."
full_description = "Carl GodfreyPersonal growth and transformationThe Big Idea Series/Overcoming OverworkA Workaholic’s Guide to Reclaiming Your LifeSix strategies for finding better balance. by Malissa ClarkSeptember 10, 2024The Big Idea Series / Overcoming Overwork01A Workaholic’s Guide to Reclaiming Your Life02“You’re More Than a Success Machine”03Confessions from 1,000 Workaholics04How Companies Can End a Culture of OverworkSummary. PostPostShareSaveBuy CopiesPrintMy daughter, Alex, was born three years into my PhD program, smack in the middle of midterms. I was at a coffee shop, scrambling to complete a take-home exam, when my contractions started. I told myself I would continue until they were consistent, which bought me several more hours, until the pain was unbearable. I reluctantly stopped working and headed home (and shortly thereafter to the hospital).Read more on Personal growth and transformation or related topics Time management, Delegating, Burnout, Sleep, Stress management and Mental healthMalissa Clark is an associate professor of industrial and organizational psychology at the University of Georgia, where she leads the Healthy Work Lab. She is one of the world’s leading scholars on workaholism, overwork, burnout, and employee well-being. In addition to serving as an expert consultant to organizations on these issues, Clark and her work have been featured in outlets including the New York Times, CNBC, the BBC, Time, Business Insider, Forbes, Bloomberg, and others.PostPostShareSaveBuy CopiesPrintThe Big Idea Series / Overcoming Overwork01A Workaholic’s Guide to Reclaiming Your Life02“You’re More Than a Success Machine”03Confessions from 1,000 Workaholics04How Companies Can End a Culture of OverworkRead more on Personal growth and transformation or related topics Time management, Delegating, Burnout, Sleep, Stress management and Mental health"
