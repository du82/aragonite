["https://hbr.org/2021/02/when-you-lose-your-job-and-its-your-whole-identity"]
title = "When You Lose Your Job — and It’s Your Whole Identity"
description = "We can be deeply committed to and engaged in our work, as well as find meaning and positive affirmation in it. Yet, we are more than our jobs. Losing your job doesn’t have to mean losing who you are. The author offers six strategies for regaining — and even redefining — your sense of who you are after a job loss."
full_description = "Career transitionsWhen You Lose Your Job — and It’s Your Whole Identity by Rebecca ZuckerFebruary 17, 2021Eric Chuang/Getty ImagesPostPostShareSaveBuy CopiesPrintSummary. Leer en españolLer em portuguêsPostPostShareSaveBuy CopiesPrintWork provides us with more than a paycheck. It gives us recognition, status, belonging, self-esteem, and reinforcement of our self-concept. Research also shows that having a strong work identity (defined as how important your job is to who you are) can be tied to your wellbeing.Read more on Career transitions or related topic Job searchRebecca Zucker is an executive coach and a founding partner at Next Step Partners, a leadership development firm. Her clients have included Amazon, Clorox, Morrison Foerster, Norwest Venture Partners, The James Irvine Foundation, and high-growth technology companies like DocuSign and Dropbox. You can follow her on LinkedIn.PostPostShareSaveBuy CopiesPrintRead more on Career transitions or related topic Job search"
