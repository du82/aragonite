["https://hbr.org/2025/02/5-signs-a-remote-worker-is-burning-out"]
title = "5 Signs a Remote Worker Is Burning Out"
description = "Although organizations and managers have a strong incentive to combat burnout, it is often difficult to detect — especially in remote workers. Fortunately, there are effective strategies managers can use to improve their ability to identify burnout signs in their teams, even when they lack frequent physical proximity to their team members. Indeed, by paying more attention to both behavioral and communication cues, managers can significantly improve their ability to assess employee burnout even in virtual or digital meetings. This article discusses five things managers should be doing to identify burnout in remote employees, as well as what to do if you spot the signs."
full_description = "Employee engagement5 Signs a Remote Worker Is Burning Out by Tomas Chamorro-PremuzicFebruary 3, 2025Justin Paget/Getty ImagesPostPostShareSaveBuy CopiesPrintSummary. Leer en españolLer em portuguêsPostPostShareSaveBuy CopiesPrintAccording to Gallup, three in four U.S. workers can be expected to experience burnout at some point in their careers. By some estimates, nearly one in two workers regularly experience it.Read more on Employee engagement or related topics Employee retention, Remote work, Burnout and Managing employeesTomas Chamorro-Premuzic is the chief innovation officer at ManpowerGroup, a professor of business psychology at University College London and at Columbia University, a cofounder of deepersignals.com, and an associate at Harvard’s Entrepreneurial Finance Lab. He is the author of Why Do So Many Incompetent Men Become Leaders? (and How to Fix It) (Harvard Business Review Press, 2019), upon which his TEDx talk was based. His latest book is I, Human: AI, Automation, and the Quest to Reclaim What Makes Us Unique, (Harvard Business Review Press, 2023).@drtcpPostPostShareSaveBuy CopiesPrintRead more on Employee engagement or related topics Employee retention, Remote work, Burnout and Managing employees"
