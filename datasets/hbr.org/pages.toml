["https://hbr.org/2025/02/ais-growing-waste-problem-and-how-to-solve-it"]
title = "AI’s Growing Waste Problem—and How to Solve It"
description = "While AI has come under scrutiny for energy use, a less discussed but equally concerning trend is the growth in resource use and electronic waste from computing and data center infrastructure. Circular economy principles can help mitigate negative environmental and social impact from the AI boom. Companies need to think about how they can use equipment and materials longer, differently, again, and less."
full_description = "Generative AIAI’s Growing Waste Problem—and How to Solve It by Samsurin Welch, Khaled Soufani and Eva MoralesFebruary 28, 2025VCG/Getty ImagesPostPostShareSaveBuy CopiesPrintSummary. Leer en españolLer em portuguêsPostPostShareSaveBuy CopiesPrintOne of the pitches for investing heavily in AI—especially resource-intensive versions such as large language models (LLMs)—is the argument that these powerful technologies have the potential to help solve sustainability and climate challenges. They can help optimize renewable energy systems, predict weather, and even discover new materials. At the heart of this argument, however, is a paradox: while it’s true that AI has the potential to advance sustainability, its environmental impact could negate much of its benefits.Read more on Generative AI or related topics AI and machine learning, Environmental sustainability, Climate change and Technology and analyticsSWSamsurin Welch is a Research Associate at the Circular Economy Centre at Judge Business School, University of Cambridge. He is also COO of HyveGeo.KSKhaled Soufani is a senior faculty in Management Practice (Economics) at the Judge Business School at the University of Cambridge. He is also the director of the Executive MBA Program and the Middle East Research Center and the Circular Economy Research Initiative.EMEva Morales is the Chief Strategy Officer at HyveGeo.PostPostShareSaveBuy CopiesPrintRead more on Generative AI or related topics AI and machine learning, Environmental sustainability, Climate change and Technology and analytics"
