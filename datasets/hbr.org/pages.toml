["https://hbr.org/2025/01/what-comes-after-dei"]
title = "What Comes After DEI"
description = "While backlash to DEI has challenged how many companies and practitioners approach creating more equitable workplaces, fewer have considered whether DEI work itself has room to improve. A new framework, built around the core outcomes of fairness, access, inclusion, and representation (FAIR) that DEI was supposed to achieve for all, offers a new direction. Instead of the performative, individual-centered, isolated, and zero-sum methods of the current mainstream approach, DEI work must evolve to become outcomes-based, systems-focused, coalition-driven, and win-win. And by emphasizing fairness in policies, broad accessibility, inclusive cultures, and trust-based representation, organizations can better address the needs of all employees and create meaningful, lasting change."
full_description = "Diversity and inclusionWhat Comes After DEIHow a new framework built around fairness, access, inclusion, and representation can succeed where DEI has failed. by Lily ZhengJanuary 23, 2025Illustration by Michelle D&#8217;UrbanoSummary. Leer en españolLer em portuguêsPostPostShareSaveBuy CopiesPrintThe need for more inclusive workplaces for all is undeniable — 91% of workers have experienced discrimination related to race, gender, disability, age, or body size, and 94% of workers care about feeling a sense of belonging at work. But anti-DEI rhetoric and backlash has sunk support for diversity, equity, and inclusion (DEI) to a low of only 52% of American workers.Read more on Diversity and inclusion or related topics Business and society, Marginalized groups, Workplace discrimination and Social and global issuesLily Zheng is a strategist, consultant, and author who works with leaders to build fair, accessible, inclusive, and representative organizations. They are the author of the forthcoming Fixing Fairness: 4 Tenets to Transform Diversity Backlash into Progress for All.PostPostShareSaveBuy CopiesPrintRead more on Diversity and inclusion or related topics Business and society, Marginalized groups, Workplace discrimination and Social and global issues"
