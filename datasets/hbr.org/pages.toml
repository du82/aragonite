title = "The CEO of e.l.f. Beauty on Maintaining a Startup Culture While Scaling"
description = "Even as it has become a major player in the beauty industry, e.l.f. continues to operate like a startup, driven by its vision, mission, and values, acting as one nonhierarchical, passionate, high-performance team, and constantly exploring how to move further and faster than the competition."
full_description = "Scaling entrepreneurial venturesThe CEO of e.l.f. Beauty on Maintaining a Startup Culture While Scaling by Tarang AminFrom the Magazine (January–February 2025)Kelsey McClellanPostPostShareSaveBuy CopiesPrintSummary. Leer en españolLer em portuguêsPostPostShareSaveBuy CopiesPrintIn 2024 e.l.f. Beauty became the company with the top-selling mass cosmetics brand in the United States, as measured by unit sales, surpassing all its legacy competitors. It was a big milestone, and in one of my weekly notes to our 500 team members, I congratulated everyone on reaching it. But we didn’t pause for a big celebration. Instead we immediately asked ourselves, How quickly can we get from number two to number one in dollar sales, as well?Read more on Scaling entrepreneurial ventures or related topics Organizational culture, Leadership vision, Entrepreneurship, Product development, Brand management, Start-ups and Retail and consumer goodsA version of this article appeared in the January–February 2025 issue of Harvard Business Review.TATarang Amin is the CEO of e.l.f. Beauty.PostPostShareSaveBuy CopiesPrintRead more on Scaling entrepreneurial ventures or related topics Organizational culture, Leadership vision, Entrepreneurship, Product development, Brand management, Start-ups and Retail and consumer goods"
