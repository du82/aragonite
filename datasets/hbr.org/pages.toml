["https://hbr.org/2025/02/how-to-protect-your-company-from-consultant-espionage"]
title = "How to Protect Your Company from Consultant Espionage"
description = "Leveraging external expertise is crucial for driving innovation, but it comes with the significant risk of information leakage. The authors’ research, which includes interviews, large-scale surveys, and industry data, reveals that while external collaboration can lead to groundbreaking innovations, it also exposes firms to the unintended loss of valuable knowledge. This phenomenon, known as “information leakage,” is particularly prevalent in process innovations, where legal safeguards often fall short. To manage this risk, firms must carefully assess the type of innovation, navigate the paradox of deep coordination, and design projects with robust monitoring systems. By striking the right balance between collaboration and protection, companies can harness external expertise without compromising their proprietary knowledge."
full_description = "InnovationHow to Protect Your Company from Consultant Espionage by Erik A. Mooi, Jan B. Heide and Elham GhazimatinFebruary 28, 2025Monalyn Gracia/Corbis/VCG/Getty ImagesPostPostShareSaveBuy CopiesPrintSummary. Leer en españolLer em portuguêsPostPostShareSaveBuy CopiesPrintInnovative projects are a team effort, but bringing in outside experts can feel like walking a tightrope: How do you harness their skills without handing over your best ideas? The nightmare scenario is partnering with a consultancy or agency to help launch an exciting innovation, only to see a suspiciously similar concept pop up in their work for another client. It’s a common fear—and a growing one. A European Commission study found that 20% of businesses faced attempted theft of confidential information, with nearly 40% believing the risk is on the rise. Our own survey of 230 construction firms showed that 79% feared their proprietary knowledge could be acquired and reused by a partner without their consent. This concern isn’t unique to construction—our follow-up survey across five different industries, including advertising, consulting, engineering, event management, and film making, found that nearly 75% of respondents were somewhat to extremely concerned about leakage risk.Read more on Innovation or related topic Intellectual propertyEMErik A. Mooi is professor of marketing at the University of Melbourne. His work focuses on marketing strategy and B2B marketing.JHJan B. Heide is the Michael Lehman Distinguished Chair in Business at the University of Wisconsin-Madison, and a professorial fellow at the University of Melbourne and Cambridge Judge Business School. His research focuses on marketing organization and strategy.EGElham Ghazimatin is an associate professor of marketing at the University of Stavanger and a senior lecturer in marketing at Monash University. Her research focuses on B2B marketing and the governance of temporary organizations.PostPostShareSaveBuy CopiesPrintRead more on Innovation or related topic Intellectual property"
year_published = 2025
