["https://hbr.org/2024/12/how-to-create-products-that-grow-with-their-users"]
title = "How to Create Products That Grow with Their Users"
description = "Planned obsolescence has generated reliable revenue streams, but at a devastating cost: mounting environmental waste, eroding customer trust, and missed opportunities for deeper customer relationships. As sustainability concerns grow and customer loyalty becomes increasingly vital, many executives are asking: How do we break free from planned obsolescence and design products that grow? The answer lies in understanding how innovative companies are already making this transition. Adobe’s Project Primrose offers a masterclass in PTG development, showing how organizations can evolve from disposable products to adaptive solutions that grow with customer needs."
full_description = "Design thinkingHow to Create Products That Grow with Their Users by Vijay Govindarajan, Daniel J. Finkenstadt and Tojin T. EapenDecember 18, 2024J Studios/Getty ImagesPostPostShareSaveBuy CopiesPrintSummary. Leer en españolLer em portuguêsPostPostShareSaveBuy CopiesPrintIn the past, companies have used “planned obsolescence,” deliberately designing products with limited lifespans so that customers would have to buy more. From light bulbs engineered to burn out after a specific number of hours to smartphones that slow down with new software updates, companies have mastered the art of creating products that need frequent replacement.Read more on Design thinking or related topics Product development, Consumer behavior and InnovationVijay Govindarajan is the Coxe Distinguished Professor at Dartmouth College’s Tuck School of Business, a Dartmouth-wide chair and the highest distinction awarded to Dartmouth faculty; a Faculty Partner in the Silicon Valley incubator Mach49; and Senior Advisor at the strategy consulting firm Acropolis Advisors. He is a New York Times and Wall Street Journal bestselling author. His latest book is Fusion Strategy: How Real-Time Data and AI Will Power the Industrial Future. His Harvard Business Review articles “Engineering Reverse Innovations” and “Stop the Innovation Wars” won McKinsey Awards for best article published in HBR. His HBR articles “How GE Is Disrupting Itself” and “The CEO’s Role in Business Model Reinvention” are HBR all-time top-50 bestsellers. Follow him on LinkedIn.@vgovindarajanDaniel J. Finkenstadt is a U.S. military officer, an academic researcher, and the principal of Wolf Stake Consulting. He is a coauthor of the books Supply Chain Immunity (2023) and Bioinspired Strategic Design (2024).Tojin T. Eapen is the founder of the Center for Creative Foresight, a senior fellow at the Conference Board, and an adviser at StratRocket.PostPostShareSaveBuy CopiesPrintRead more on Design thinking or related topics Product development, Consumer behavior and Innovation"
