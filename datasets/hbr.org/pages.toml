["https://hbr.org/2024/12/research-when-prototypes-dont-yield-useful-insights"]
title = "Research: When Prototypes Don’t Yield Useful Insights"
description = "The conventional way to test ideas — promoted by the lean startup and agile approaches to innovation — often falls short when the ecosystem in question is complex. A study of five entrepreneurial ventures over six years found that the winning firms turned conventional wisdom on its head: They avoided prototypes early. Instead, they searched more broadly and paradoxically learned more about the ecosystem. Then, when they had a clear idea of who their alpha customers were, they committed to building complete, customized products. And if it became clear that these customers aren’t viable after all, they walked away from them and repurposed their initial investments to develop new products for new customers."
full_description = "EntrepreneurshipResearch: When Prototypes Don’t Yield Useful Insights by Douglas Hannah and Shi-Ying LimDecember 5, 2024Henrik Sorensen/Getty ImagesPostPostShareSaveBuy CopiesPrintSummary. Leer en españolLer em portuguêsPostPostShareSaveBuy CopiesPrintAs the world has grown more complex, interconnected, and awash in data, firms are embedded in increasingly complex digital ecosystems. This new world opens new possibilities and new ways to create value. But it also means that turning ideas into reality — and even understanding what might be possible — requires working with a larger set of players and navigating a more complex landscape of interdependencies.Read more on Entrepreneurship or related topics Product development and InnovationDouglas Hannah is an assistant professor at the Boston University Questrom School of Business.Shi-Ying Lim is an assistant professor in the Department of Information Systems and Analytics at the National University of Singapore’s School of Computing.PostPostShareSaveBuy CopiesPrintRead more on Entrepreneurship or related topics Product development and Innovation"
year_published = 2024
