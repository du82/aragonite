["https://hbr.org/2025/02/how-to-get-hired-when-ai-does-the-screening"]
title = "How to Get Hired When AI Does the Screening"
description = "Companies are increasingly using generative AI tools for recruitment and hiring—think AI-assisted resume screens and AI-conducted interviews. Understanding how companies are leveraging AI for hiring is critical for landing your next job and can give you an edge in making sure your application gets to the top of the pile. Further, in your interviews, you’ll be able to position yourself not only as a capable professional, but one who’s eager to evolve your skillset along with AI. Here are five ways to prepare for an AI-based hiring process, from your resume to interviews."
full_description = "Career transitionsHow to Get Hired When AI Does the Screening by Marlo LyonsFebruary 19, 2025HBR Staff/UnsplashPostPostShareSaveBuy CopiesPrintSummary. Leer en españolLer em portuguêsPostPostShareSaveBuy CopiesPrintThe current job market is tight, and not just because of recent layoffs and stagnant hiring. AI and automation are changing the hiring landscape at all levels, and those on the hunt for a new opportunity can no longer ignore AI’s impact on their job search strategy.Read more on Career transitions or related topics Job interviews, Resumes and Cover lettersMarlo Lyons is a career, executive, and team coach, as well as the award-winning author of Wanted – A New Career: The Definitive Playbook for Transitioning to a New Career or Finding Your Dream Job. You can reach her at marlolyonscoaching.com.PostPostShareSaveBuy CopiesPrintRead more on Career transitions or related topics Job interviews, Resumes and Cover letters"
