["https://hbr.org/2025/02/ai-agents-are-changing-how-people-shop-heres-what-that-means-for-brands"]
title = "AI Agents Are Changing How People Shop. Here’s What That Means for Brands."
description = "The rapid adoption of AI agents has major implications for who captures value in consumer transactions—particularly who owns the end customer. In the pre-internet era, the balance of information between retailers and brands was relatively even: Retailers had access to granular, receipt-level data and brands could gather “sell-through” information across the broader market. With the rise of e-commerce, however, retailers gained access to customer-level data while brands typically didn’t gain access to significantly more data. With the advent of gen AI agents that assist consumers in their purchasing journeys, the balance of power will likely shift away from retailers and towards brands and AI-agents. That’s because AI agents will search for consumer goods more broadly, swiftly, and comprehensively than humans. To compete in this new environment, brands and retailers will have to embrace AI agent optimization (AAO), ensuring that their unique strengths—whether it’s product quality, innovation, or customer service—are clearly measurable and easily recognizable by these AI systems, and optimizing for the sources AI-agents will rely on."
full_description = "Generative AIAI Agents Are Changing How People Shop. Here’s What That Means for Brands. by Jur Gaarlandt, Wesley Korver, Nathan Furr and Andrew ShipilovFebruary 26, 2025Ezra Bailey/Getty ImagesPostPostShareSaveBuy CopiesPrintSummary. Leer en españolLer em portuguêsPostPostShareSaveBuy CopiesPrintAI agents—algorithms empowered to take action on a user’s behalf—are starting to fundamentally reshape the business and consumer landscapes. Case in point: Enough consumers are skipping Google and searching using ChatGPT, an AI agent that interprets questions and synthesizes search results, that some experts estimate it could replace Google in four years. For others, AI-agents are creating a new source of customer leads, independent of traditional SEO. No doubt the dominant players will fight back, but the rapid adoption of AI agents has much bigger implications for who captures value—particularly who owns the end customer, the holy grail of the digital age.Read more on Generative AI or related topics AI and machine learning, Sales and marketing, Brand management and Technology and analyticsJGJur Gaarlandt is the Partner Benelux at Artefact.WKWesley Korver is the Director of Data and Analytics at Artefact.Nathan Furr is a Professor of Strategy at INSEAD and a coauthor of five best-selling books, including The Upside of Uncertainty, The Innovator’s Method, Leading Transformation, Innovation Capital, and Nail It then Scale It.Andrew Shipilov is a John H. Loudon Chaired Professor of International Management at INSEAD. He is a coauthor of Network Advantage: How to Unlock Value From Your Alliances and Partnerships.PostPostShareSaveBuy CopiesPrintRead more on Generative AI or related topics AI and machine learning, Sales and marketing, Brand management and Technology and analytics"
year_published = 2025
clearnet = "https://hbr.org/2025/02/ai-agents-are-changing-how-people-shop-heres-what-that-means-for-brands"
