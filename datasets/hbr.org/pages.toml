["https://hbr.org/2024/10/why-marketers-are-spending-less-on-social-media"]
title = "Why Marketers Are Spending Less on Social Media"
description = "A bi-annual poll of U.S. marketing leaders found that social media investments have declined to their lowest level in seven years. An analysis of poll data suggests that lack of strategy fit, weak returns, and new competition from retail media may help explain this dip. Researchers leverage their findings to offer suggestions to marketers on how to overcome past strategy misalignment in order to continue to benefit from social media’s immediacy and pervasiveness, including through the use of Gen AI."
full_description = "Sales and marketingWhy Marketers Are Spending Less on Social Media by Christine Moorman and Koen PauwelsOctober 14, 2024Cavan Images/Getty ImagesPostPostShareSaveBuy CopiesPrintSummary. Leer en españolLer em portuguêsPostPostShareSaveBuy CopiesPrintIn June 2020, social media spending surged to 23% of marketing budgets when the pandemic forced consumers to stay home and marketers pivoted to digital channels for outreach. A new, heightened focus on social media accelerated the digitization of marketing so that by 2022, fully 57% of spending was dedicated to digital marketing. The recent adoption of new marketing technology (Martech) to automate processes and the use of AI to generate content have driven digitization further into business models.Read more on Sales and marketing or related topics Advertising, Marketing, Social marketing, Generative AI and Social mediaChristine Moorman is the T. Austin Finch, Sr. Professor of Business Administration, Fuqua School of Business, Duke University. She is founder and director of The CMO Survey.Koen Pauwels is the Associate Research Dean and Distinguished Professor of Marketing at Northeastern University and co-director of its Digital, Analytics, Technology and Automation (DATA) Initiative.PostPostShareSaveBuy CopiesPrintRead more on Sales and marketing or related topics Advertising, Marketing, Social marketing, Generative AI and Social media"
