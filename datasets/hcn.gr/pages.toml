["https://www.hcn.gr/el/faq-category/o-logariasmos-mou-hcn"]
title = "O λογαριασμός μου HCN Archives - HCN"
full_description = "Πότε θα έρθει ο πρώτος λογαριασμός και τι χρεώσεις θα έχει; Ύστερα από τη σύνδεσή σας στο δίκτυο της HCN, ο πρώτος λογαριασμός HCN θα σας έρθει στις αρχές του επόμενου μήνα. Θα περιλαμβάνει τα Τέλη Ενεργοποίησης και τυχόν λοιπές εφάπαξ χρεώσεις και τις χρεώσεις του πακέτου σας αναλογικά από την ημερομηνία σύνδεσής σας μέχρι και το τέλος του μήνα. Για όποια βοήθεια, μη διστάσετε να επικοινωνήσετε μαζί μας στο 2313 250000. Μπορώ να αλλάξω την ημερομηνία τιμολόγησης του λογαριασμού μου; Η HCN τιμολογεί πάντα στην ίδια ημέρα το πλήθος όλων των συνδρομητών της κι αυτή ορίζεται στο τέλος του εκάστοτε μήνα. Η γραμμή που ακολουθεί είναι postpaid, δηλαδή, δεν προτιμολογεί, αλλά αφότου κλείσει ο μήνας προχωράει και στην τιμολόγηση των υπηρεσιών των συνδρομητών της. Έτσι, δεν υπάρχει η δυνατότητα μεμονωμένης ημερομηνίας τιμολόγησης για κάποιον από τους συνδρομητές της HCN. Για όποια βοήθεια, μη διστάσετε να επικοινωνήσετε μαζί μας στο 2313 250000. Πώς μπορώ να πληρώσω το λογαριασμό μου; Μετρητά ή με κάρτα στα καταστήματα μας Θεσσαλονίκη 25ης Μαρτίου 112, 54249, Χαριλάου (Δευτέρα - Παρασκευή 09:00-21:00, Σάββατο 09:00-15:00) Λεωφόρος Στρατού 29, 54639, Φάληρο (Δευτέρα – Παρασκευή 09:00-21:00) Γεωργίου Μαύρου 12, 55134, Καλαμαριά (Δευτέρα – Παρασκευή 09:00-17:00) Ελευθερίου Βενιζέλου 79, 56121 Αμπελόκηποι (Δευτέρα – Παρασκευή 09:00-21:00) Κιλκίς Εθνικής Αντιστάσεως 1, 61100, Κιλκίς (Δευτέρα – Παρασκευή 09:00-21:00) Κατερίνη Ειρήνης 18, 60 100, Κατερίνη (Δευτέρα – Παρασκευή 09:00-21:00) Βέροια Ελευθερίου Βενιζέλου 41, 591 32, Βέροια (Δευτέρα – Παρασκευή 09:00-21:00) Μέσω Web banking Μπορείτε να εξοφλείτε τους λογαριασμούς σας μέσω της υπηρεσίας web banking των τραπεζών, με τη χρήση του RF Κωδικού Πληρωμής που αναγράφεται στην πρώτη σελίδα του λογαριασμού σας (Ενιαία Συναλλαγή Πληρωμής RF). Σημαντικές Πληροφορίες: Εάν παραλείψετε να εξοφλήσετε εμπρόθεσμα δύο λογαριασμούς και η σύνδεση σας έχει ήδη διακοπεί προσωρινά λόγω ληξιπρόθεσμων οφειλών, για άμεση επανασύνδεση των υπηρεσιών συστήνεται να τακτοποιήσετε την οφειλή σας σε κάποιο κατάστημα HCN ή να μας αποστείλετε το αποδεικτικό εξόφλησης και των δύο λογαριασμών με e-mail στο office@hcn.gr για την άρση φραγής. *Τυχόν τραπεζικά έξοδα επιβαρύνουν τον πελάτη"
