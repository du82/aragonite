title = "Η ιστορία των οπτικών ινών - HCN"
description = "Η ιστορία των οπτικών ινών ξεκινάει από το 1840 όταν ανακαλύφθηκε η δυνατότητα της καθοδήγησης του φωτός μέσω της διάθλασης, αρχικά από τους Ντάνιελ Κόλαντον και Ζακ Μπαμπινέ στο Παρίσι."
full_description = "Η ιστορία των οπτικών ινών ξεκινάει από το 1840 όταν ανακαλύφθηκε η δυνατότητα της καθοδήγησης του φωτός μέσω της διάθλασης, αρχικά από τους Ντάνιελ Κόλαντον και Ζακ Μπαμπινέ στο Παρίσι και αργότερα, από πειράματα του Ιρλανδού φυσικού Τζον Τιντάλ. • Το 1880, ο Γκράχαμ Μπελ δημιούργησε ένα οπτικό τηλεφωνικό σύστημα, το οποίο ονόμασε «φωτόφωνο». Τελικά, επικράτησε η άλλη του ανακάλυψη, η μετάδοση σημάτων μέσω του χαλκού και έτσι δημιουργήθηκε το τηλέφωνο. Γκράχαμ Μπελ • Το 1920, ο Τζον Λότζι Μπάιρντ πατεντάρισε την ιδέα να μεταδίδει τηλεοπτικές εικόνες μέσα από ακτίνες φωτός. • Το 1930, ο Χάινριχ Λαμ ήταν ο πρώτος που μετέδωσε μια εικόνα μέσα από μια δέσμη οπτικών ινών. • Το 1951, ο Χόγκλερ Μόελερ κατέθεσε στη Δανία την πατέντα μετάδοσης εικόνων μέσω οπτικών ινών, στην οποία πρότεινε την χρήση γυάλινων ή πλαστικών οπτικών ινών, αλλά απέτυχε εξαιτίας της πατέντας του Μπάιρντ που προϋπήρχε. • Το 1954, ο Ολλανδός επιστήμονας Αβραάμ Βαν Χέιλ και Βρετανός επιστήμονας Χάρολντ Χόπκινς έγραψαν χωριστά άρθρα για δέσμες απεικόνισης. Ο Χόπκινς ανέφερε σχετικά με τις δέσμες απεικόνισης μη γυμνών ινών, ενώ ο Βαν Χέιλ αναφέρθηκε σε απλές δέσμες επενδυμένων ινών. Κάλυψε μια γυμνή ίνα με διαφανή επένδυση χαμηλότερου δείκτη διάθλασης. Αυτό προστάτευσε την επιφάνεια ανάκλασης ινών από εξωτερική παραμόρφωση και μείωσε σημαντικά τις παρεμβολές μεταξύ των ινών. Εκείνη την εποχή, το μεγαλύτερο εμπόδιο για μια βιώσιμη χρήση οπτικών ινών ήταν η επίτευξη της χαμηλότερης απώλειας σήματος (φως). • Το 1961, ο Ελίας Σνίτζερ δημοσίευσε μια εργασία στην οποία περιέγραφε πώς κατεύθυνε μια ακτίνα λέιζερ, μέσα από μια λεπτή, γυάλινη οπτική ίνα. Η απώλεια φωτός όμως ήταν αρκετά μεγάλη για να χρησιμοποιηθεί η συγκεκριμένη τεχνολογία σε τηλεπικοινωνιακές εφαρμογές. • Το 1964, μια κρίσιμη (και θεωρητική) προδιαγραφή προσδιορίστηκε από τον Δρ. Κάο (ο οποίος βραβεύτηκε με βραβείο Νόμπελ Φυσικής) για συσκευές επικοινωνιών μεγάλης εμβέλειας . Η προδιαγραφή ήταν 10 ή 20 ντεσιμπέλ απώλειας φωτός ανά χιλιόμετρο, που καθιέρωσε το πρότυπο. Ο Κάο επεσήμανε επίσης την ανάγκη για μια καθαρότερη μορφή γυαλιού για τη μείωση της απώλειας φωτός. • Το 1970, μια ομάδα ερευνητών άρχισε να πειραματίζεται με τηγμένο πυρίτιο, ένα υλικό ικανό εξαιρετικής καθαρότητας με υψηλό σημείο τήξης και χαμηλό δείκτη διάθλασης. Οι ερευνητές του Corning Glass, Donald Keck, Robert Maurer και Peter Schultz, εφηύραν καλώδια οπτικών ινών ή “Optical Waveguide Fibers” ικανό να μεταφέρει 65.000 φορές περισσότερες πληροφορίες από το σύρμα χαλκού. Αυτό το καλώδιο επέτρεψε την αποκωδικοποίηση πληροφοριών που μεταφέρονται από ένα μοτίβο φωτεινών κυμάτων σε προορισμό ακόμη και χίλια μίλια μακριά. Η ομάδα είχε λύσει τα προβλήματα που παρουσίασε ο Δρ. Κάο! Donald Keck, Robert Maurer και Peter Schultz • Το 1977, γίνεται το πρώτο τηλεφώνημα μέσω δικτύου οπτικών ινών, στο Λονγκ Μπιτς της Καλιφόρνια. • Το 1988, τίθεται σε λειτουργία το πρώτο διατλαντικό, επικοινωνιακό οπτικό καλώδιο. Μέχρι το τέλος του αιώνα, περισσότερο από το 80% της παγκόσμιας κίνησης μεγάλων αποστάσεων στον κόσμο μεταφέρθηκε μέσω καλωδίων οπτικών ινών και 25 εκατομμυρίων χιλιομέτρων του καλωδίου. Καλώδια σχεδιασμένα από τους Maurer, Keck και Schultz έχουν εγκατασταθεί παγκοσμίως. Σήμερα, η HCN φέρνει την τεχνολογία των οπτικών ινών σε όλους σας μέσα από τα Fiber πακέτα, ώστε να απολαμβάνετε όλα τα προνόμια των υψηλών ταχυτήτων ίντερνετ. Έτσι, ο καθένας μπορεί να απολαμβάνει την αγαπημένη του σειρά στο Netflix, να παίζει παιχνίδια online, να κατεβάζει τα αγαπημένα του τραγούδια ή να παρακολουθεί βίντεο στο YouTube χωρίς διακοπές και με σταθερή ταχύτητα!"
