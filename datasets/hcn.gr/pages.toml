["https://www.hcn.gr/el/paketa/tilefonia/paketa-tilefonias-isdn-sip-trunk"]
title = "ISDN/SIP Trunk - HCN"
description = "Οι γραμμές ISDN/SIP Trunk δίνουν στην επιχείρησή σου καθαρή ποιότητα κλήσεων για έως και 8 τηλεφωνικές γραμμές."
full_description = "Οι γραμμές ISDN/SIP Trunk είναι το βασικό στοιχείο της επιχειρηματικής τηλεφωνίας εδώ και πολλά χρόνια. Δίνουν στην επιχείρησή σου καθαρή ποιότητα κλήσεων για έως και 8 τηλεφωνικές γραμμές. Αυτός ο τύπος γραμμής είναι κατάλληλος για μικρότερες επιχειρήσεις και γραφεία. Το ISDN/SIP Trunk είναι υπηρεσίες φωνής και δεδομένων υψηλής απόδοσης. Για την ενεργοποίηση της υπηρεσίας ISDN απαιτείται η καταβολή εφάπαξ ποσού ως εγγύηση χρήσης του επιπλέον απαραίτητου εξοπλισμού κι ως προπληρωμή των μηνών, σύμφωνα με το πάγιο που ορίζει κάθε μία από τις παρακάτω υπηρεσίες. Μετά το πέρας του ανάλογου χρονικού διαστήματος, θα ξεκινήσει η μηνιαία πάγια χρέωση έτσι όπως ορίζει κάθε μία από τις παρακάτω υπηρεσίες. Στο εκάστοτε τηλεφωνικό κανάλι μπορεί να χρησιμοποιηθεί πακέτο ομιλίας της HCN. Professional & enterprise custom fiber solutionsΕίμαστε σίγουροι πως κάθε επιχείρηση έχει τις δικές τις ανάγκες. Για αυτόν το λόγο, δημιουργήσαμε ένα σύντομο οδηγό, ώστε να δημιουργήσεις το πακέτο που πραγματικά ταιριάζει στη δική σου επιχείρηση.Οδηγός εύρεσης προγράμματος 2313 250 000 Η οπτική σύνδεση που ονειρεύεσαι, είναι μια κλήση μακριά."
