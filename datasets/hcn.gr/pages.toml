["https://www.hcn.gr/el/faq-category/internet"]
title = "Internet Archives - HCN"
full_description = "Πώς μπορώ να κάνω αλλαγή της υπάρχουσας καλωδίωσης; Οποιοσδήποτε πελάτης επιθυμεί να κάνει αλλαγή της εσωτερικής του καλωδίωσης μπορεί να απευθυνθεί γραπτώς στο office@hcn.gr. Στην περίπτωση αυτή, θα πρέπει να πραγματοποιηθεί νέο ραντεβού με το τεχνικό τμήμα της εταιρείας, ώστε να υπάρξει επίσκεψη των τεχνικών της και να ολοκληρωθεί το αίτημα για αλλαγής καλωδίωσης. Το εφάπαξ κόστος για το αίτημα αυτό, ανέρχεται στα 20,00€, τα οποία προστίθενται στον επόμενο λογαριασμό του συνδρομητή. Για όποια βοήθεια, μη διστάσετε να επικοινωνήσετε μαζί μας στο 2313 250000. Πώς μπορώ να αλλάξω πακέτο ίντερνετ; Εφόσον επιθυμείτε να μεταβείτε σε κάποιο μεγαλύτερο ή σε κάποιο υποδιέστερο πακέτο internet της HCN που ανήκουν στην ίδια κατηγορία internet, μπορείτε να αποστείλλετε το αίτημά σας γραπτώς στο office@hcn.gr και η αλλαγή θα γίνει ΔΩΡΕΑΝ. Για όποια βοήθεια, μη διστάσετε να επικοινωνήσετε μαζί μας στο 2313 250000. Ξέχασα τον κωδικό του wifi μου. Τι κάνω; Εάν δεν είχατε αλλάξει τον εργοστασιακό κωδικό του wifi σας, τότε μπορείτε εύκολα να τον ανακτήσετε, βρίσκοντάς τον κάτω από το modem σας. Εάν είχατε αλλάξει τον κωδικό του wifi σας και πλέον δεν το θυμάστε, θα πρέπει να προχωρήσετε σε εργοστασιακές ρυθμίσεις και έπειτα να ακολουθήσετε την διαδικασία όπως περιγράφτηκε προηγουμένους. Για όποια βοήθεια, μη διστάσετε να επικοινωνήσετε μαζί μας στο 2313 250000."
