["https://www.hcn.gr/el/blog-posts/optiki-ina-mechri-to-spiti"]
title = "Οπτική ίνα μέχρι το σπίτι - HCN"
description = "Με την τεχνολογία Fiber To The Home (FTTH) η οπτική ίνα τερματίζει στην οικία του συνδρομητή, σε ένα τερματικό σημείο τοποθετημένο σε κουτί στο εσωτερικό της οικίας."
full_description = "Με την τεχνολογία Fiber To The Home (FTTH) η οπτική ίνα τερματίζει στην οικία του συνδρομητή, δηλαδή σε ένα τερματικό σημείο τοποθετημένο σε κουτί στον στο εσωτερικό της οικίας. Οι αυξημένες ανάγκες που έφερε η πανδημία λόγω της τηλεργασίας και της τηλεκπαίδευσης αλλά και οι επιλογές ψυχαγωγίας μέσω διαδικτύου που αυξάνονται, οδηγούν καθημερινά τους Έλληνες συνδρομητές στην αναζήτηση πιο γρήγορων συνδέσεων. Το κυριότερο πλεονέκτημα της τεχνολογίας FTTH είναι ότι έχει τη δυνατότητα να προσφέρει πολύ υψηλότερες ταχύτητες και μεταφορά δεδομένων στο internet από ότι οι παραδοσιακές συνδέσεις ADSL που χρησιμοποιούν χαλκό. Για παράδειγμα ένα ζεύγος χαλκού μπορεί να μεταφέρει έως έξι τηλεφωνικές γραμμές. Ένα ζεύγος οπτικής ίνας μπορεί να μεταφέρει έως και 2.5 εκατομμύρια κλήσεις ταυτόχρονα. Πέραν των ταχυτήτων, όμως, το FTTH έχει και ορισμένα ακόμη πλεονεκτήματα, όπως είναι η «σταθερότητα» στη σύνδεση και η πολύ χαμηλή «καθυστέρηση», το αποκαλούμενο latency. Για εφαρμογές όπως είναι το online gaming, το χαμηλό latency ενδεχομένως να είναι σημαντικότερο ακόμη και από τις εξαιρετικά υψηλές ταχύτητες. Οι οπτικές ίνες έχουν απεριόριστο bandwidth γεγονός που εγκαθιστά τη συγκεκριμένη τεχνολογία FTTH “μελλοντικά ασφαλές” καθώς θα μπορεί να εξυπηρετεί τις ανάγκες των συνδρομητών για πολλά χρόνια ακόμα. Σε γενικές γραμμές, η αναβάθμιση σε FTTH από τις υφιστάμενες συνδέσεις μέχρι χαλκού είναι μία κίνηση που αξίζει να κάνει όποιος καταναλωτής επιθυμεί να έχει αξιόπιστη, γρήγορη και ποιοτική πρόσβαση στο διαδίκτυο. Για να είναι εφικτή η παροχή σύνδεσης FTTH, θα πρέπει ο πάροχος να έχει δημιουργήσει τη σχετική υποδομή και το δίκτυο οπτικών ινών να έχει φθάσει πολύ κοντά στα κτίρια, σχεδόν στην πόρτα των κτιρίων. Πιο συγκεκριμένα θα πρέπει να φθάσει μέχρι τα αποκαλούμενα ducts, τα οποία θα πρέπει να σημειωθεί ότι καθένα από αυτά χρησιμοποιείται για την εξυπηρέτηση πολλαπλών γειτονικών κτιρίων. Κατά κάποιον τρόπο, η λογική που ακολουθείται είναι αντίστοιχη με εκείνη του φυσικού αερίου. Ανάλογα με το σε πόσα ducts έχει φθάσει οπτική ίνα είναι και η κάλυψη στην οποία αναφέρονται οι πάροχοι. Δηλαδή, όταν ένας πάροχος υποστηρίζει ότι καλύπτει σε μία περιοχή 1000 νοικοκυριά σημαίνει ότι έχει φέρει οπτική ίνα σε τόσα ducts όσα και αυτά που εξυπηρετούν κτίρια με συνολικά 1000 νοικοκυριά. Όλα τα πακέτα της HCN είναι με την τεχνολογία της οπτικής ίνας μέχρι το σπίτι, ώστε να απολαμβάνεις τις υψηλότερες και σταθερότερες ταχύτητες που φτάνουν έως και 10 Gbps Download/10 Gbps Upload!"
author = "Elena Zirixidou"
year_published = 2022
year_updated = 2024
clearnet = "https://www.hcn.gr/el/blog-posts/optiki-ina-mechri-to-spiti"
