full_description = "Χωρίς δέσμευση συμβολαίου Οπτική ίνα μέσα στο χώρο σου Ιδιόκτητο δίκτυο οπτικών ινών Εγγυημένη ταχύτητα FTTH* *Η πραγματική ταχύτητα ταυτίζεται με την ονομαστική ταχύτητα του προγράμματος. iΠληροφορίες εξοπλισμού 16,00€ Τελική μηνιαία τιμή πακέτου *Το τέλος εγκατάστασης των 55€ περιλαμβάνει παροχή router 1Gb-port. Οι χρεώσεις του Τιμοκαταλόγου συμπεριλαμβάνουν το Τέλος Συνδρομητών Σταθερής Τηλεφωνίας του άρθρου 55 του Ν.4389/2016, το οποίο υπολογίζεται ως ποσοστό πέντε τοις εκατό (5%) επί των τιμών προ του Φόρου Προστιθέμενης Αξίας. Ο ΦΠΑ 24% συμπεριλαμβάνεται. Ενδιαφέρομαι Είδος WiFi Optical Router WiFi band Single Band Wireless Standards 802.11 b / 802.11 b / 802.11 g / 802.11 n Συχνότητα λειτουργίας 2.4 GHz Θύρες 1 x RJ45 10/100 (LAN), 1 x RJ45 10/100/1000 (LAN) Wireless Security WEP / WPA / WPA2 / WPA2 Mixed 2313 250 000 Η οπτική σύνδεση που ονειρεύεσαι, είναι μια κλήση μακριά."
