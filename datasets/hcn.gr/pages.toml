full_description = "Η HCN είναι δίπλα στα ΑμεΑ παρέχοντας τις οικονομικότερες τιμές σε Fiber πακέτα internet Έτσι τα πακέτα για τα ΑμεΑ διαμορφώνονται ως εξής: Πακέτο Χαρακτηριστικά Τιμή Flow Download & Upload: 120 Mbps 25,00€ 16,00€/μήνα Flow+ Download & Upload: 360 Mbps Απεριόριστα λεπτά προς σταθερά και 360 λεπτά προς κινητά 28,00€ 19,00€/μήνα Stellar Download & Upload: 600 Mbps Απεριόριστα λεπτά προς σταθερά και 600 λεπτά προς κινητά 38,00€ 28,00€/μήνα Sonic Download & Upload: 900 Mbps Απεριόριστα λεπτά προς σταθερά και 900 λεπτά προς κινητά 57,50€ 38,00€/μήνα Οι αναφερόμενες ταχύτητες αφορούν καλωδιακή σύνδεση και όχι ασύρματη. Το τέλος εγκατάστασης των 55€ περιλαμβάνει παροχή router 1Gbps port. Από προεπιλογή, με κάθε σύνδεση internet υπάρχει μια γραμμή τηλεφωνίας χωρίς επιπλέον χρεώσεις και απεριόριστες δωρεάν κλήσεις στο δίκτυο της HCN. Οι κλήσεις προς άλλα δίκτυα είναι 0.05€/λεπτό προς σταθερά και 0.0945€/λεπτό προς κινητά. Η σύνδεση καλωδιακής τηλεόρασης περιλαμβάνει ελεύθερα ψηφιακά και δορυφορικά κανάλια. Στις τιμές συμπεριλαμβάνεται ο ΦΠΑ. Ισχύουν όροι & προϋποθέσεις. Κάνε αίτηση τώρα Ενεργή προσφορά 27.06.2024Προσφορές Φοιτητική ζωή με τη σύνδεση που ονειρεύεσαι. Περισσότερα Ενεργή προσφορά 02.10.2024Προσφορές Βρήκες το συνεργείο μας; Ξεκλείδωσε έκπτωση για τη νέα σου σύνδεση με οπτική ίνα! Περισσότερα"
author = "Lab21"
year_published = 2024
year_updated = 2025
clearnet = "https://www.hcn.gr/el/prosfores/fiber-internet-amea"
