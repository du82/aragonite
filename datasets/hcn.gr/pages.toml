["https://www.hcn.gr/el/blog-posts/asfaleia-prostasia-sto-diadiktyo"]
title = "Ασφάλεια & Προστασία στο Διαδίκτυο - HCN"
description = "Πρακτικές και χρήσιμες οδηγίες για την ενίσχυση της ασφάλειας & προστασίας στο Διαδίκτυο κατά την περιήγηση ενός χρήστη στο ίντερνετ."
full_description = "Η ασφάλεια και η προστασία στο Διαδίκτυο είναι ένα θέμα που μας αφορά όλους. Η πιο απλή και χρήσιμη συμβουλή είναι η εξής: οι κανόνες ευγένειας και αυτοπροστασίας που ισχύουν στον φυσικό κόσμο (στην κανονική ζωή), ισχύουν και στον ψηφιακό κόσμο (στους υπολογιστές και το διαδίκτυο). Για αυτό τηρήστε στο διαδίκτυο τους κανόνες που τηρείτε και στην πραγματική ζωή. Επιπλέον, κάποιες πρακτικές και χρήσιμες οδηγίες για την ενίσχυση της ασφάλειας και της ιδιωτικότητας του χρήστη κατά την περιήγηση στο διαδίκτυο: 1. Εγκαταστήστε στον υπολογιστή σας λογισμικό antivirus και προστασία firewall και διατηρείτε τα ενημερωμένα. 2. Αποφύγετε τη χρήση αμφιλεγόμενων εφαρμογών. Χρησιμοποιείτε μόνο αυθεντικό λογισμικό και μην κάνετε λήψη εφαρμογών από άγνωστες πηγές. 3. Χρησιμοποιείτε σύνθετους κωδικούς πρόσβασης. Χρησιμοποιείτε έναν κωδικό πρόσβασης που είναι δύσκολο να μαντέψετε και να περιέχει συνδυασμό αριθμών, κεφαλαίων και πεζών γραμμάτων και συμβόλων. Το ιδανικό μήκος των κωδικών πρόσβασής σας πρέπει να είναι περίπου 10-12 χαρακτήρες. Αποφύγετε τη χρήση προσωπικών δεδομένων, κοινών λέξεων που γράφονται προς τα πίσω και ακολουθιών χαρακτήρων και αριθμών ως κωδικό πρόσβασης. 4. Χρησιμοποιείτε αυθεντικοποίηση 2 παραγόντων (2-factor authentication), όπου υποστηρίζεται. Η μέθοδος αυτή παρέχει δύο επίπεδα μέτρων ασφαλείας, οπότε εάν ένας εισβολέας μπορεί να μαντέψει με ακρίβεια τον κωδικό πρόσβασής σας, υπάρχει ακόμη ένα επιπλέον μέτρο ασφαλείας για να διασφαλιστεί ότι δεν θα παραβιαστεί ο λογαριασμός σας. 5. Λαμβάνετε τακτικά αντίγραφα ασφαλείας των δεδομένων σας σε εξωτερικούς σκληρούς δίσκους ή στο Cloud για να διατηρήσετε τα δεδομένα σας αποθηκευμένα με ασφάλεια. 6. Πλοηγηθείτε στο Internet με ασφάλεια. Αποφύγετε ιστοσελίδες που είναι περισσότερο πιθανό να είναι μολυσμένες. Στον browser που χρησιμοποιείτε προσέξτε τα παρακάτω: • να έχετε εγκατεστημένη πάντα την τελευταία έκδοση, • να ρυθμίσετε ώστε να λαμβάνει ενημερώσεις αυτόματα, • να μην επιλέγετε την αποθήκευση των κωδικών πρόσβασης στον browser, • να ενισχύσετε τις ρυθμίσεις ιδιωτικότητας (privacy settings). 7. Πλοηγηθείτε με ιδιαίτερη προσοχή όταν συνδέεστε σε δημόσια Wi-Fi hotspots. Σε αυτά οι προσωπικές σας πληροφορίες συχνά μπορούν πιο εύκολα να υποκλαπούν. 8. Βεβαιωθείτε ότι κάθε ιστοσελίδα μέσω της οποίας αποστέλλετε προσωπικές πληροφορίες (κωδικοί πρόσβασης, αριθμό πιστωτικής κάρτας κ.α.) λειτουργεί με το πρωτόκολλο https. Αυτό σημαίνει ότι: • η διεύθυνση αρχίζει με “https://” και • αριστερά του “https://” υπάρχει ένα μικρό λουκέτο, που δηλώνει ότι η σύνδεση είναι ασφαλής και ότι η ιστοσελίδα διαθέτει ισχύον πιστοποιητικό (valid certificate). 9. Προσέξτε τα παραπλανητικά emails (phishing emails). Σε εισερχόμενο email που φαίνεται ύποπτο (π.χ. το όνομα του αποστολέα είναι άγνωστο, το περιεχόμενο εμφανίζει μία αίσθηση «επείγοντος», το email του αποστολέα δεν δείχνει νόμιμο) μην ανοίξετε το επισυναπτόμενο αρχείο και μην επισκεφθείτε το σύνδεσμο (link) που εμφανίζεται στο κείμενο του email, καθώς αποτελούν τους συνηθέστερους τρόπους να μολυνθεί ο υπολογιστής σας με κακόβουλο λογισμικό. 10. Δώστε ιδιαίτερη προσοχή στο είδος των πληροφοριών της προσωπικής και επαγγελματικής σας ζωής που αναρτάτε στα κοινωνικά δίκτυα."
author = "Elena Zirixidou"
year_published = 2022
year_updated = 2024
