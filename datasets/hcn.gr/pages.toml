["https://www.hcn.gr/el/politiki-cookies"]
title = "Πολιτική Cookies - HCN"
description = "Τελευταία ενημέρωση: 03-Οκτ-2024 Τι είναι τα cookies; Αυτή η Πολιτική των cookies εξηγεί τί είναι τα cookies και πώς χρησιμοποιούνται, τα είδη των cookies που χρησιμοποιούμε πχ, τις πληροφορίες που συλλέγουμε με τη χρήση των cookies και τον τρόπο που αξιοποιούνται αυτές οι πληροφορίες, αλλά και τον τρόπο διαχείρισης των ρυθμίσεων των cookies. Τα cookies […]"
full_description = "Τελευταία ενημέρωση: 03-Οκτ-2024 Τι είναι τα cookies; Αυτή η Πολιτική των cookies εξηγεί τί είναι τα cookies και πώς χρησιμοποιούνται, τα είδη των cookies που χρησιμοποιούμε πχ, τις πληροφορίες που συλλέγουμε με τη χρήση των cookies και τον τρόπο που αξιοποιούνται αυτές οι πληροφορίες, αλλά και τον τρόπο διαχείρισης των ρυθμίσεων των cookies. Τα cookies είναι μικρά αρχεία κειμένων που χρησιμοποιούνται για την αρχειοθέτηση μικρού μέρους πληροφοριών. Αποθηκεύονται στη συσκευή σας όταν ο ιστότοπος φορτώνεται στο πρόγραμμα περιήγησής σας. Αυτά τα cookies μας βοηθούν στη σωστή λειτουργία του ιστότοπου, στη μεγιστοποίηση της ασφάλειας, στην παροχή καλύτερης εμπειρίας χρήσης, αλλά και στην κατανόηση της λειτουργίας του ιστότοπου και στην ανάλυση του τρόπου λειτουργίας και τις ανάγκες βελτίωσης. Πώς χρησιμοποιούνται τα cookies; Όπως οι περισσότερες διαδικτυακές υπηρεσίες, ο ιστότοπός μας χρησιμοποιεί cookies πρώτου και τρίτου μέρους για διάφορους σκοπούς. Τα cookies πρώτου μέρους είναι ως επί το πλείστον απαραίτητα για τη σωστή λειτουργία του ιστότοπου και δεν συλλέγουν κανένα από τα προσωπικά σας δεδομένα. Τα cookies τρίτου μέρους που χρησιμοποιούνται στον ιστότοπό μας χρησιμεύουν κυρίως για την κατανόηση του τρόπου λειτουργίας του ιστότοπου, του τρόπου με τον οποίο αλληλεπιδράτε με τον ιστότοπό μας, τη διατήρηση της ασφάλειας των υπηρεσιών μας, την παροχή διαφημίσεων που είναι σχετικές με εσάς, και εν γένει την παροχή μιας καλύτερης και βελτιωμένης εμπειρίας χρήστη και τη διευκόλυνση των μελλοντικών αλληλεπιδράσεών σας με τον ιστότοπό μας. Είδη των cookies που χρησιμοποιούμε Διαχείριση προτιμήσεων cookies Ρυθμίσεις Cookie Μπορείτε να αλλάξετε τις προτιμήσεις σας για τα cookies ανά πάσα στιγμή κάνοντας κλικ στο παραπάνω κουμπί. Αυτό θα σας επιτρέψει να επισκεφθείτε εκ νέου το μήνυμα συγκατάθεσης για τα cookies και να αλλάξετε τις προτιμήσεις σας ή να ακυρώσετε τη συγκατάθεσή σας αμέσως. Επιπλέον, τα διάφορα προγράμματα περιήγησης παρέχουν διαφορετικές μεθόδους για τον αποκλεισμό και τη διαγραφή των cookies που χρησιμοποιούνται από ιστότοπους. Μπορείτε να αλλάξετε τις ρυθμίσεις του προγράμματος περιήγησής σας για να μπλοκάρετε/διαγράψετε τα cookies. Παρακάτω παρατίθενται οι σύνδεσμοι προς τα έγγραφα υποστήριξης σχετικά με τον τρόπο διαχείρισης και διαγραφής των cookies από τα κυριότερα προγράμματα περιήγησης στο διαδίκτυο. Chrome: https://support.google.com/accounts/answer/32050 Safari: https://support.apple.com/en-in/guide/safari/sfri11471/mac Firefox: https://support.mozilla.org/en-US/kb/clear-cookies-and-site-data-firefox?redirectslug=delete-cookies-remove-info-websites-stored&redirectlocale=en-US Internet Explorer: https://support.microsoft.com/en-us/topic/how-to-delete-cookie-files-in-internet-explorer-bca9446f-d873-78de-77ba-d42645fa52fc Εάν χρησιμοποιείτε οποιοδήποτε άλλο πρόγραμμα περιήγησης στο διαδίκτυο, παρακαλούμε επισκεφθείτε τα επίσημα έγγραφα υποστήριξης του προγράμματος περιήγησής σας."
year_published = 2025
year_updated = 2024
