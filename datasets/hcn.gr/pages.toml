title = "Metaverse & Οπτικές Ίνες - HCN"
description = "Τι είναι το Metaverse; Και γιατί οι οπτικές ίνες παίζουν σημαντικό ρόλο στην επιτυχή δικτύωση του;"
full_description = "Τι είναι το Metaverse και γιατί οι οπτικές ίνες παίζουν σημαντικό ρόλο στην επιτυχή δικτύωση του; Από τότε που το διαδίκτυο έγινε μέρος της ζωής μας –και σχεδόν από την αρχή της κοινωνικής του εμφύτευσης– η έννοια του «εικονικού κόσμου» κυκλοφορεί στο μυαλό των θεωρητικών, των προγραμματιστών και των χρηστών. Είναι αλήθεια ότι ένα μεγάλο μέρος της ζωής μας είναι εδώ και καιρό στο διαδίκτυο και ότι περνάμε πολλές ώρες σερφάροντας σε αυτό. Αλλά η έννοια του μετασύμπαντος, δηλαδή μια προσομοίωση ή επέκταση του πραγματικού κόσμου σε ένα καθαρά ψηφιακό πλαίσιο, που θα άνοιγε την «τρίτη διάσταση» του διαδικτύου, είναι σχετικά νέα. Η τεχνολογική εξέλιξη των τελευταίων ετών, ωστόσο, καθώς και οι δυνατότητες και οι βελτιώσεις στην ποιότητα του δικτύου χάρη στις οπτικές ίνες και ορισμένες επιχειρηματικές κινήσεις κολοσσών όπως το Facebook –τώρα Meta– καθιστούν απαραίτητη την ανάλυση αυτής της έννοιας, την αξιολόγηση και τον ρόλο των παικτών στην αγορά τεχνολογίας, των χρηστών του Διαδικτύου και των χρηματοοικονομικών τομέων που θα μπορούσαν να επηρεαστούν από την ύπαρξη ενός ή περισσότερων metaverse στο εγγύς μέλλον. Τι είναι το Metaverse? Ο θεωρητικός ορισμός του μετασύμπαντος (Metaverse) είναι ακόμα πολύπλοκος, καθώς είναι ένα σύνολο ιδεών και εννοιών που βρίσκονται ακόμη υπό ανάπτυξη, που περιμένουν να βιωθούν μέσω συσκευών και πλατφορμών, πιθανώς συνδεδεμένων με τον πραγματικό κόσμο. Μια αρκετά ακριβής προσέγγιση, ωστόσο, υιοθετήθηκε πρόσφατα από τον επενδυτή Matthew Ball στο δοκίμιό του The Metaverse: What is, Where to Find it, Who Will Build It. Για τον Ball, κάθε μετασύμπαν πρέπει να έχει μια σειρά από χαρακτηριστικά, μεταξύ των οποίων είναι: 1. Επέκταση του φυσικού και εικονικού κόσμου 2. Ανάπτυξη μιας πλήρους οικονομίας 3. Διαλειτουργικότητα, δηλαδή, οι χρήστες μπορούν να μετακινούνται στο σύνολό τους –τα άβαταρ ή τις εικονικές τους προσωπικότητες, τα υπάρχοντά τους και τα ψηφιακά τους στοιχεία– μεταξύ του ενός μετασύμπαντος και του άλλου. Ίσως η πιο κοντινή εκδήλωση ενός μετασύμπαντος που μπορούμε να βρούμε σήμερα είναι τα βιντεοπαιχνίδια, τα οποία όχι μόνο πληρούν πολλά από τα χαρακτηριστικά που περιγράφει ο Ball, αλλά έχουν και άλλα καθοριστικά χαρακτηριστικά όπως: • Διαδραστικότητα: οι χρήστες μπορούν να επικοινωνούν μεταξύ τους. • Σωματικότητα: η αναπαράσταση του χρήστη μέσω ενός χαρακτήρα ή avatar, που έχει ορισμένους «φυσικούς» περιορισμούς και υπόκειται σε ορισμένους «κανόνες» εντός του ψηφιακού περιβάλλοντος: ύψος, βάρος, κινήσεις, συμπεριφορά κ.λπ. • Διατήρηση: η ικανότητα του μετασύμπαντος να συνεχίσει να λειτουργεί ανεξάρτητα από το αν ένας ή όλοι οι χρήστες του είναι συνδεδεμένοι ή εκτός σύνδεσης. Το metaverse θα φέρει επανάσταση σε κάθε κλάδο και λειτουργία. Από την υγειονομική περίθαλψη μέχρι τις πληρωμές, τα καταναλωτικά προϊόντα, την ψυχαγωγία και την ωριαία εργασία. Ο όγκος και η ταχύτητα μεταφοράς των δεδομένων που θα απαιτήσει η λειτουργία και η ύπαρξη μετασυμπάντων θα είναι αρκετά υψηλή. Η τεχνολογία της οπτικής ίνας είναι αυτή που προσφέρει μεγάλο και γρήγορο ρυθμό μεταφοράς δεδομένων και έτσι θα αποτελέσει βασικό “μέσο” για την είσοδό μας στο metaverse. Οι τρεις βασικοί τομείς για να είναι επιτυχής η δικτύωση του metaverse είναι το εύρος ζώνης, η καθυστέρηση και η αξιοπιστία: 1. Το εύρος ζώνης (bandwidth) θεωρείται συνήθως ως «ταχύτητα», αλλά στην πραγματικότητα είναι πόσα δεδομένα μπορούν να μεταδοθούν σε μια μονάδα χρόνου. Οι απαιτήσεις για το Metaverse είναι πολύ υψηλότερες από τις περισσότερες διαδικτυακές εφαρμογές και παιχνίδια, και πέρα από πολλές σύγχρονες συνδέσεις. Καθώς η πολυπλοκότητα και η σημασία της εικονικής πραγματικότητας μεγαλώνει, ο όγκος των δεδομένων που χρειάζεται να μεταδοθούν θα αυξάνεται. Αν θέλουμε να αλληλοεπιδράσουμε σε ένα μεγάλο, σε πραγματικό χρόνο, κοινόχρηστο και επίμονο εικονικό περιβάλλον, θα χρειαστεί να λάβουμε μια υπεραφθονία δεδομένων που μεταδίδονται στο cloud. Η ροή δεδομένων στο cloud είναι επίσης απαραίτητη εάν θέλουμε να μεταπηδούμε απρόσκοπτα μεταξύ διαφορετικών εικονικών κόσμων. 2. Η μεγαλύτερη πρόκληση στην εδραίωση του metaverse είναι η καθυστέρηση (latency). Η καθυστέρηση αναφέρεται στο χρόνο που χρειάζεται για να ταξιδέψουν τα δεδομένα από το ένα σημείο στο άλλο και να επιστρέψουν. Σε σύγκριση με το εύρος ζώνης δικτύου και την αξιοπιστία, η καθυστέρηση θεωρείται συνήθως ο λιγότερο σημαντικός παράγοντας. Αυτό συμβαίνει επειδή η περισσότερη κίνηση στο διαδίκτυο είναι μονόδρομη ή ασύγχρονη. Δεν έχει σημασία αν χρειάζονται 100 ms ή 200 ms ή ακόμα και καθυστερήσεις δύο δευτερολέπτων μεταξύ της αποστολής ενός μηνύματος WhatsApp. Επίσης, δεν έχει σημασία αν χρειάζονται 20 ms ή 150 ms ή 300 ms αφού κάνετε κλικ στο κουμπί παύσης του YouTube μέχρι να σταματήσει το βίντεο. Όταν παρακολουθείτε το Netflix, είναι πιο σημαντικό η ροή να παίζει συνεχώς παρά αμέσως. Ωστόσο, τα πιο καθηλωτικά διαδικτυακά παιχνίδια με πολλούς παίκτες απαιτούν χαμηλό latency. Αυτό οφείλεται στο γεγονός ότι το latency καθορίζει πόσο γρήγορα ένας παίκτης λαμβάνει πληροφορίες (π.χ. πού βρίσκεται ένας παίκτης, εάν έχει πεταχτεί μια χειροβομβίδα ή μια μπάλα ποδοσφαίρου) και πόσο γρήγορα μεταδίδεται η απάντησή του σε άλλους παίκτες. Η καθυστέρηση, με άλλα λόγια, καθορίζει αν θα κερδίσετε ή θα χάσετε, θα σκοτώσετε ή θα καταλήξετε να σκοτωθείτε. Αυτός είναι ο λόγος για τον οποίο τα περισσότερα σύγχρονα παιχνίδια παίζονται με 2–4x φορές τον μέσο ρυθμό καρέ του βίντεο (framerate) και γιατί υιοθετήσαμε γρήγορα αυτές τις αυξήσεις, ακόμη και αν αντιστεκόμαστε σε υψηλότερο ρυθμό καρέ για τα παραδοσιακά βίντεο, απαιτείται για την απόδοση. Το ανθρώπινο όριο για την καθυστέρηση είναι απίστευτα χαμηλό στα βιντεοπαιχνίδια, ειδικά σε σχέση με άλλα μέσα. Σκεφτείτε, για παράδειγμα, το παραδοσιακό βίντεο έναντι των βιντεοπαιχνιδιών. Ο μέσος άνθρωπος δεν παρατηρεί καν εάν ο ήχος δεν είναι συγχρονισμένος με το βίντεο, εκτός εάν φτάσει πολύ νωρίς, περισσότερο από 45 ms, ή καθυστερήσει περισσότερο από 125 ms (συνολικά 170 ms). Τα όρια αποδοχής είναι ακόμη μεγαλύτερα, νωρίς στα 90 ms και αργά 185 ms (275 ms). Με τα ψηφιακά κουμπιά, όπως ένα κουμπί παύσης του YouTube, πιστεύουμε ότι τα κλικ μας απέτυχαν μόνο εάν δε δούμε απόκριση μετά από 200–250 ms. Στα βιντεοπαιχνίδια, οι παίκτες απογοητεύονται στα 50 ms. Τα παιχνίδια δεν μπορούν να παιχτούν στα 150 ms. Το Subspace διαπιστώνει ότι κατά μέσο όρο, μια αύξηση ή μείωση 10 ms στην καθυστέρηση μειώνει ή αυξάνει τον εβδομαδιαίο χρόνο παιχνιδιού κατά 6%. Η κοινωνική φύση του metaverse και η επιθυμητή υψηλή απόδοση είναι αυτά που θα απαιτήσουν χαμηλό latency. Οι ελαφριές κινήσεις του προσώπου είναι απίστευτα σημαντικές για την ανθρώπινη συνομιλία – και είμαστε απίστευτα ευαίσθητοι σε ελαφρά λάθη και προβλήματα συγχρονισμού. 3. Η αξιοπιστία είναι αρκετά προφανής. Η ικανότητά μας να στραφούμε σε ένα εικονικό περιβάλλον, στην εικονική εργασία και εκπαίδευση εξαρτάται άμεσα από την αξιόπιστη ποιότητα των υπηρεσιών. Το Netflix κάνει ροή σε 1080p ή ακόμα και 4K τέλεια τις περισσότερες φορές! Ωστόσο, υπηρεσίες όπως το Netflix αξιοποιούν λύσεις αξιοπιστίας που δε λειτουργούν καλά για παιχνίδια ή εφαρμογές, ειδικά για το Metaverse. Οι μη ζωντανές υπηρεσίες βίντεο, όπως το Netflix, λαμβάνουν όλα τα αρχεία βίντεο ώρες έως μήνες προτού διατεθούν στο κοινό. Αυτό τους επιτρέπει να εκτελούν εκτεταμένη ανάλυση, ώστε να συρρικνώνονται (ή να «συμπιέζονται») μεγέθη αρχείων αναλύοντας δεδομένα για να προσδιορίσουν ποιες πληροφορίες μπορούν να απορριφθούν. Οι αλγόριθμοι του Netflix θα «παρακολουθήσουν» μια σκηνή με γαλάζιο ουρανό και θα αποφασίσουν ότι, αν πέσει η ταχύτητα του διαδικτύου ενός θεατή, 500 διαφορετικές αποχρώσεις του μπλε μπορούν να απλοποιηθούν σε 200, ή 50 ή 25. Τα αναλυτικά στοιχεία του streamer το κάνουν ακόμη και με βάση τα συμφραζόμενα – αναγνωρίζοντας ότι οι σκηνές διαλόγου μπορούν να δεχθούν περισσότερη συμπίεση από αυτές της δράσης με ταχύτερο ρυθμό. Πρόκειται για κωδικοποίηση πολλαπλών διελεύσεων (multipass encoding). Το Netflix προφορτώνει περιεχόμενο σε τοπικούς κόμβους και χρησιμοποιεί επίσης εφεδρικό εύρος ζώνης για να στείλει βίντεο στη συσκευή ενός χρήστη πριν αυτό χρειαστεί – επομένως, εάν υπάρξει προσωρινή πτώση στη συνδεσιμότητα ή αύξηση της καθυστέρησης, ο τελικός χρήστης δεν αντιμετωπίζει καμία αλλαγή. Αυτό δεν είναι δυνατό για βίντεο ή δεδομένα που δημιουργούνται ζωντανά, τα οποία πρέπει να φτάνουν πιο γρήγορα. Αυτός είναι ο λόγος για τον οποίο είναι πιο δύσκολο να κάνετε ροή 1 GB Stadia σε cloud παρά 1 GB Netflix. Έτσι, θα πρέπει να σκεφτούμε ότι το Metaverse αυξάνει τις απαιτήσεις για όλες τις πτυχές της δικτύωσης – καθυστέρηση, αξιοπιστία και εύρος ζώνης – σε αυτές των παιχνιδιών για πολλούς παίκτες. Δεν έχει σημασία πόσο ισχυρή είναι η συσκευή σας, εάν δεν μπορεί να λάβει όλες τις πληροφορίες που χρειάζεται εγκαίρως. Σε ένα μέλλον όπου το metaverse πρόκειται να γίνει ψηφιακή τάση, η ενίσχυση των οπτικών ινών είναι απαραίτητη για τη διασφάλιση ποιοτικών εικονικών εμπειριών. Δηλαδή, χαμηλές καθυστερήσεις για γρήγορους ρυθμούς μετάδοσης των δεδομένων, έτσι ώστε οι εικονικές αλληλεπιδράσεις να είναι όσο το δυνατόν πιο κοντά στην πραγματική ζωή, ώστε ο χρήστης να έχει την αίσθηση ότι συμβαίνουν σε πραγματικό χρόνο και έτσι ώστε οι ψηφιακές πλατφόρμες του “μετασύμπαντος” να μπορούν να διατηρήσουν τον τεράστιο όγκο δεδομένων που θα δημιουργήσουν οι χρήστες. Για παράδειγμα, εκατοντάδες avatars που παρακολουθούν μια εικονική συναυλία, κάνουν χειρονομίες και κινούνται στην αίθουσα συναυλιών. Με τη χρήση των οπτικών ινών στο metaverse εξασφαλίζεται η παροχή μόνιμων και σε πραγματικό χρόνο συνδέσεων υψηλού εύρους ζώνης και αποκεντρωμένης μετάδοσης δεδομένων."
