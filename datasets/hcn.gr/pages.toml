["https://www.hcn.gr/el/blog-posts/ti-einai-oi-optikes-ines"]
title = "Τι είναι οι οπτικές ίνες; - HCN"
description = "Οι οπτικές ίνες είναι πολύ λεπτά νήματα από πλαστικό ή γυαλί, με διάμετρο μικρότερη των 10 μικρομέτρων όπου από μέσα τους μεταδίδονται ψηφιακά δεδομένα υπό μορφή φωτός."
full_description = "Οι οπτικές ίνες είναι πολύ λεπτά νήματα από πλαστικό ή γυαλί, με διάμετρο μικρότερη των 10 μικρομέτρων όπου από μέσα τους μεταδίδονται ψηφιακά δεδομένα υπό μορφή φωτός. Συνήθως τις συναντάμε συγκεντρωμένες σε δέσμες, που σχηματίζουν τα λεγόμενα οπτικά καλώδια. Ένα καλώδιο οπτικών ινών περιέχει μέσα του δεκάδες ή και εκατοντάδες πολύ λεπτές τέτοιες οπτικές ίνες με διάμετρο μικρότερη και από μία τρίχα! Με τις ακτίνες λέιζερ ένα σήμα μπορεί να μεταδοθεί δια μέσου οπτικών ινών σε απόσταση μεγαλύτερη από 50 χιλιόμετρα. Οι οπτικές ίνες χρησιμοποιούνται κυρίως σε δίκτυα επικοινωνιών και επιτρέπουν τη μετάδοση φωτεινών σημάτων σε μεγαλύτερες αποστάσεις και σε υψηλότερη ταχύτητα μετάδοσης δεδομένων σε σχέση με άλλες μορφές μετάδοσης σημάτων, όπως ο χαλκός, ενώ η ταχύτητα μετάδοσης πλησιάζει αυτή με την οποία διαδίδεται το φως. Χρησιμοποιούνται αντί των μεταλλικών καλωδίων, διότι τα σήματα ταξιδεύουν μαζί τους με μικρότερη απώλεια και δεν επηρεάζονται από ηλεκτρομαγνητικές παρεμβολές. Υπάρχουν δύο είδη οπτικών ινών, ανάλογα με το αν υποστηρίζουν έναν ή πολλούς ρυθμούς μετάδοσης. Το πρώτο είδος αποτελούν οι απλού τύπου οπτικές ίνες, οι οποίες έχουν διαστάσεις μέχρι 10 μικρομέτρων. Τα κύματα φωτός ταξιδεύουν σε ευθεία γραμμή και μπορούμε να στείλουμε δεδομένα σε μεγάλες αποστάσεις. Το δεύτερο είδος ονομάζεται πολλαπλού τύπου και έχουν διαστάσεις από 50 − 100 μικρομέτρων, είναι πιο “χοντρές” από τις απλού τύπου, αλλά μπορούν να στείλουν ταυτόχρονα, σε ξεχωριστό μονοπάτι, πολλά κύματα φωτός. Το κάθε κύμα φωτός, εισέρχεται στην οπτική ίνα υπό ελαφρώς διαφορετική γωνία σε σχέση με τα άλλα, και ακολουθεί το δικό του μονοπάτι μέσα της, μέσω των διαδοχικών ανακλάσεων στο περίβλημα. Αυτό συμβαίνει παράλληλα με πολλά κύματα φωτός (όλα σε διαφορετική γωνία σε σχέση με τα άλλα) κι έτσι μπορούμε να στείλουμε ταυτόχρονα, τεράστιο όγκο δεδομένων. Στην πράξη χρησιμοποιούμε δέσμη οπτικών ινών. Αν οι ίνες αποτελούνταν μόνο από ένα υλικό, τότε το φως που “ταξιδεύει” στο εσωτερικό τους θα περνούσε, όταν θα έρχονταν σε επαφή, από την μια ίνα στην άλλη. Γι’ αυτό κάθε ίνα επικαλύπτεται με ένα λεπτό στρώμα υλικού. Επίσης στο σύστημα της γυάλινης ίνας τοποθετείται ένα περίβλημα που την προστατεύει και την κάνει πιο ανθεκτική σε μηχανικές καταπονήσεις. Κάθε οπτική ίνα αποτελείται από τα εξής τρία μέρη: 1. Την κεντρική γυάλινη κυλινδρική ίνα, που ονομάζεται πυρήνας και είναι το τμήμα στο οποίο διαδίδεται το φως. 2. Την επικάλυψη (απλή ή πολλαπλή), που είναι ένας ομόκεντρος με τον πυρήνα κύλινδρος. Έχει μικρότερο δείκτη διάθλασης από τον πυρήνα λόγω της διαφορετικότητας του υλικού από το οποίο είναι κατασκευασμένο, ώστε να κρατάει τα κύματα φωτός, με ολικές ανακλάσεις, μέσα στον πυρήνα και να συνεχίζουν το ταξίδι τους μέσω αυτού. Η επικάλυψη αυτή ονομάζεται μανδύας. 3. Το περίβλημα, που είναι ένα αδιαφανές πλαστικό. Στις οπτικές ίνες που απαρτίζουν ένα οπτικό καλώδιο, ουσιαστικά υπάρχει και ένα τέταρτο, εξωτερικό, στρώμα που είναι το έγχρωμο μελάνι που εφαρμόζεται για την αναγνώριση των ινών. Η δομή ενός καλωδίου οπτικών ινών είναι τέτοια, ώστε να αποτρέπει τις εξωτερικές φθορές, αλλά και την απώλεια σήματος, που θα προέκυπτε κατά τη διαρροή της φωτεινής ακτινοβολίας στο εξωτερικό του. Τα τμήματα ενός καλωδίου οπτικών ινών από το κέντρο προς το εξωτερικό του, είναι τα εξής: 1. Πυρήνας: Βρίσκεται στο κέντρο του καλωδίου. Αποτελείται από μία δέσμη οπτικών ινών, που αναλαμβάνουν τη μετάδοση των φωτεινών σημάτων. 2. Εσωτερική επένδυση: Είναι το υλικό που αντανακλά εσωτερικά το φως, εκμηδενίζοντας παράλληλα το ποσοστό διαφυγής του στο εξωτερικό του καλωδίου. 3. Εξωτερική επένδυση: Ανθεκτικό υλικό, που αποτελείται από καουτσούκ για μικρά καλώδια οικιακής χρήσης, ή από ατσάλι για μεγαλύτερα, που χρησιμοποιούνται σε εξωτερικό περιβάλλον. Προστατεύει το καλώδιο από ζημιές που θα προέκυπταν από τους διάφορους εξωτερικούς παράγοντες. Η δομή ενός δικτύου οπτικών ινών αποτελείται από τον πομπό, ένα μέσο μεταφοράς, τον ενισχυτή σήματος και τον δέκτη. Ο πομπός μετατρέπει το ψηφιακό σήμα σε φωτεινή πληροφορία και πραγματοποιεί την εκπομπή της. Βρίσκεται σε επαφή με το οπτικό καλώδιο και διαθέτει κατάλληλο φακό, ώστε να διοχετεύει το φως στο εσωτερικό του. Ως μέσο μεταφοράς χρησιμοποιείται το καλώδιο οπτικών ινών. Ο ενισχυτής σήματος, είναι απαραίτητος μόνο σε συνδέσεις μεγάλων αποστάσεων, επειδή παρατηρείται συχνά εξασθένιση του σήματος και αναλαμβάνει την ενίσχυση του σήματος σε τακτικά διαστήματα. Διαθέτει ειδικά κυκλώματα, τα οποία όταν λάβουν την εξασθενημένη φωτεινή πληροφορία, εκπέμπουν το σήμα εκ νέου, με πλήρη ισχύ. Τέλος ο δέκτης λαμβάνει το φωτεινό σήμα και το μετατρέπει ξανά στην αρχική του μορφή, δηλαδή σε ψηφιακά δεδομένα. Όπως και ο πομπός, βρίσκεται σε άμεση επαφή με το καλώδιο οπτικών ινών και χρησιμοποιεί φωτοδιόδους για να ανιχνεύσει το λαμβανόμενο σήμα. Τώρα που γνωρίζεις την πραγματική δύναμη των οπτικών ινών επέλεξε το Fiber πρόγραμμα της HCN που σου ταιριάζει και ξέχνα τις αργές και ασταθείς συνδέσεις!"
author = "Elena Zirixidou"
