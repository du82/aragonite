["https://www.hcn.gr/el/faq-category/tilefono"]
title = "Τηλέφωνο Archives - HCN"
full_description = "Μπορώ να μεταφέρω το νούμερο μου από άλλο πάροχο στην HCN; Ναι, μπορείτε. Εάν διατηρείτε τηλεφωνικό αριθμό σε κάποιον άλλο πάροχο, μπορείτε να το μεταφέρετε στο δίκτυο στης HCN εύκολα! Αρκεί ένας λογαριασμός τηλεφωνίας του παρόχου όπου βρίσκεται ο τηλεφωνικός αριθμός και μία φωτοτυπία ταυτότητας του ατόμου, στο οποίο είναι ο λογαριασμός. Η διαδικασία μεταφοράς του τηλεφωνικού αριθμού(φορητότητα) γίνεται ΔΩΡΕΑΝ. Μόλις ολοκληρωθεί η μεταφορά, εκπρόσωπός μας θα σας ενημερώσει για την επιτυχή διαδικασία φορητότητας του τηλεφωνικού σας αριθμού στο δίκτυο της HCN. Για όποια βοήθεια, μη διστάσετε να επικοινωνήσετε μαζί μας στο 2313 250000. Πώς μπορώ να βάλω πακέτο ομιλίας; Η προσθήκη του πακέτου ομιλίας μπορεί να υποβληθεί μόνο γραπτώς μέσω email στο office@hcn.gr ή σε κάποιο κατάστημα HCN. Η προσθήκη του πακέτου ομιλίας ολοκληρώνεται κι υλοποιείται την πρώτη του επόμενου μήνα. Για όποια βοήθεια, μη διστάσετε να επικοινωνήσετε μαζί μας στο 2313 250000. Πώς συνδέω το τηλέφωνό μου στο modem; Αφότου ενημερωθείτε από εκπρόσωπό μας πως εκδόθηκε ο τηλεφωνικός σας αριθμός ή ολοκληρώθηκε επιτυχώς η φορητότητα του τηλεφωνικού σας αριθμού, τότε θα πρέπει να συνδέσετε την τηλεφωνική σας συσκευή στο modem μας. Θα πρέπει να συνδεθεί στις θύρες line1 ή phone 1, ανάλογα με το modem που διαθέτετε, για να λειτουργήσει σωστά. Για όποια βοήθεια, μη διστάσετε να επικοινωνήσετε μαζί μας στο 2313 250000."
