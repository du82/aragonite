["https://www.hcn.gr/el/blog-posts/pagkosmio-rekor-gia-ti-grigoroteri-tachytita-internet"]
title = "Παγκόσμιο ρεκόρ για τη γρηγορότερη ταχύτητα ίντερνετ - HCN"
description = "Η Ιαπωνία κατέχει το παγκόσμιο ρεκόρ για τη γρηγορότερη ταχύτητα ίντερνετ! Δες με ποιον τρόπο τα κατάφερε!"
full_description = "Η Ιαπωνία κατέχει το παγκόσμιο ρεκόρ για τη γρηγορότερη ταχύτητα ίντερνετ! Είναι περίπου 7,6 εκατομμύρια φορές πιο γρήγορη από αυτή που πιθανώς έχετε στο σπίτι σας. Με αυτή την ταχύτητα θα μπορούσατε να κατεβάσετε σχεδόν 80.000 ταινίες σε μόλις ένα δευτερόλεπτο. Η ταχύτητα του διαδικτύου μετριέται συνήθως από το πόσα δεδομένα μπορούν να μεταδοθούν μεταξύ δύο συσκευών σε ένα δευτερόλεπτο. Το νέο ρεκόρ που σημειώθηκε το 2021 είναι 319 terabit ανά δευτερόλεπτο (Tb/s). Αυτό είναι διπλάσιο από το προηγούμενο παγκόσμιο ρεκόρ για τη γρηγορότερη ταχύτητα διαδικτύου και περίπου 7,6 εκατομμύρια φορές ταχύτερο από τη μέση ταχύτητα οικιακού διαδικτύου στις ΗΠΑ (42 megabits ανά δευτερόλεπτο). Για να σπάσουν το ρεκόρ για τη γρηγορότερη ταχύτητα διαδικτύου, ερευνητές στο Εθνικό Ινστιτούτο Τεχνολογίας Πληροφοριών και Επικοινωνιών της Ιαπωνίας ανέπτυξαν μια πειραματική οπτική ίνα με τέσσερις πυρήνες, αντί για έναν! Στη συνέχεια συνδύασαν την ίνα τους με ένα λέιζερ που εκτόξευε παλμούς σε διαφορετικά μήκη κύματος και τεχνικές πολλαπλής ενίσχυσης σήματος. Αυτό τους επέτρεψε να μεταδίδουν δεδομένα σε απόσταση μεγαλύτερη από 1.800 μίλια με ταχύτητα 319 Tb/s. Υπάρχει ένα μέρος του πειράματος που θα μπορούσε να έχει αντίκτυπο στη ζωή σας στο όχι και τόσο μακρινό μέλλον: η οπτική ίνα! Η ΗCN σας προσφέρει τις γρηγορότερες ταχύτητες στην Ελλάδα και είναι ο μόνος πάροχος ίντερνετ με τον οποίο μπορείς να ζήσεις το μέλλον, με ταχύτητες που φτάνουν μέχρι 10 Gbps! Ανακαλύψτε όλα τα πακέτα της HCN, ενός ιδιόκτητου δικτύου οπτικών ινών που εδρεύει στην Θεσσαλονίκη."
author = "Elena Zirixidou"
year_published = 2022
year_updated = 2024
