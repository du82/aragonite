title = "Μητρώο άρθρου 11 - HCN"
description = "Τι είναι το Μητρώο του άρθρου 11; Σύμφωνα με το Άρθρο 11 του Ν. 3471/2006, δεν επιτρέπεται να γίνει καμία επικοινωνία που στοχεύει σε εμπορική προώθηση ή πώληση προϊόντων ή υπηρεσιών χωρίς πρότερη και ρητή, συγκατάθεση του συνδρομητή. Πληροφορίες για συνδρομητές Οι συνδρομητές που επιθυμούν να καταχωρήσουν μία ή περισσότερες ενεργές τηλεφωνικές τους συνδέσεις στο […]"
full_description = "Τι είναι το Μητρώο του άρθρου 11; Σύμφωνα με το Άρθρο 11 του Ν. 3471/2006, δεν επιτρέπεται να γίνει καμία επικοινωνία που στοχεύει σε εμπορική προώθηση ή πώληση προϊόντων ή υπηρεσιών χωρίς πρότερη και ρητή, συγκατάθεση του συνδρομητή. Πληροφορίες για συνδρομητές Οι συνδρομητές που επιθυμούν να καταχωρήσουν μία ή περισσότερες ενεργές τηλεφωνικές τους συνδέσεις στο Μητρώο της HCN, μπορούν να υποβάλλουν αίτημα, συμπληρώνοντας και αποστέλλοντας τη σχετική αίτηση που θα βρείτε εδώ ή στο email office@hcn.gr. Οι εγγεγραμμένοι στο Μητρώο συνδρομητές δύνανται, επιπλέον, ανά πάσα στιγμή να διαγραφούν από αυτόν, ακολουθώντας την ανωτέρω διαδικασία και συμπληρώνοντας την αίτηση που βρίσκεται εδώ. Πώς χορηγείται το Μητρώο σε ενδιαφερόμενους τρίτους Κάθε νομικό/φυσικό πρόσωπο έχει τη δυνατότητα να αποκτήσει το Μητρώο –Άρθρο 11, δηλαδή να αποκτήσει την λίστα των αριθμών που έχουν ζητήσει να εξαιρεθούν από τηλεφωνικές κλήσεις για διαφημιστικούς / προωθητικούς σκοπούς. Η πρόσβαση στο Μητρώο έχει μέγιστη χρονική διάρκεια ισχύος τριάντα (30) ημέρες και για τη χορήγησή του οι ενδιαφερόμενοι πρέπει να αποστείλουν συμπληρωμένη και υπογεγραμμένη τη σχετική αίτηση από εδώ στο email: office@hcn.gr και να συμπεριλάβει τα απαιτούμενα δικαιολογητικά που αναγράφονται σε αυτήν και συγκεκριμένα το ΦΕΚ Εκπροσώπησης, φωτοαντίγραφο ΑΔΤ Νόμιμου Εκπροσώπου για νομικά πρόσωπα και φωτοαντίγραφο ΑΔΤ αιτούντος για φυσικά πρόσωπα."
