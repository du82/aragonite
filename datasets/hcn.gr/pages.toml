["https://www.hcn.gr/el/paketa/tilefonia/paketa-tilefonias-analog"]
title = "Analog - HCN"
description = "Τηλεφωνία με 1 ή 2 αναλογικές γραμμές. Δες τα analog πακέτα τηλεφωνίας της HCN και διάλεξε αυτό που σου ταιριάζει!"
full_description = "Τηλεφωνία με 1 ή 2 αναλογικές γραμμές. Με αυτή την επιλογή ο πελάτης μπορεί να έχει μέχρι 2 αναλογικές γραμμές + internet + TV. Οι θύρες τηλεφώνου στο μόντεμ είναι αναλογικές, οπότε ο πελάτης μπορεί να χρησιμοποιεί τυπικά αναλογικές τηλεφωνικές συσκευές. Η τεχνολογία που χρησιμοποιείται έχει παρόμοιες επιλογές με το ISDN αλλά όχι πανομοιότυπες. Η ποιότητα της φωνής είναι πολύ καλύτερη από τις αναλογικές γραμμές επειδή αυτή η τεχνολογία χρησιμοποιεί ξεχωριστό στρώμα (packet cable protocol), η ομιλία είναι σε πραγματικό χρόνο χωρίς buffering όπως η τυπική τηλεφωνία VOIP. Από προεπιλογή, με κάθε σύνδεση Internet υπάρχει μια γραμμή τηλεφωνίας χωρίς επιπλέον χρεώσεις και απεριόριστες δωρεάν κλήσεις στο δίκτυο της HCN. Οι κλήσεις προς άλλα δίκτυα είναι 0.05€/λεπτό προς σταθερά και 0.0945€/λεπτό προς κινητά. Επίσης υπάρχουν πακέτα λεπτών ομιλίας ή απεριόριστες κλήσεις το μήνα με πολύ οικονομικές τιμές. (βλ. παρακάτω) Τα δωρεάν λεπτά ομιλίας που παρέχονται στα παρακάτω πακέτα αφορούν εθνικές κλήσεις προς όλα τα εθνικά δίκτυα σταθερής και κινητής τηλεφωνίας. Εξαιρούνται οι σύντομοι κωδικοί. Professional & enterprise custom fiber solutionsΕίμαστε σίγουροι πως κάθε επιχείρηση έχει τις δικές τις ανάγκες. Για αυτόν το λόγο, δημιουργήσαμε έναν σύντομο οδηγό, ώστε να δημιουργήσεις το πακέτο που πραγματικά ταιριάζει στη δική σου επιχείρηση.Οδηγός εύρεσης προγράμματος"
