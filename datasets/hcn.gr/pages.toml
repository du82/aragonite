["https://www.hcn.gr/el/blog-posts/7-symvoules-agoras-diadiktyakon-paichnidion"]
title = "7 Συμβουλές Αγοράς Διαδικτυακών Παιχνιδιών - HCN"
description = "Πάνω από ένας στους δέκα gamers έχει πέσει θύμα κλοπής του ID του. 7 τρόποι για να είστε όσο το δυνατόν πιο ασφαλείς ενώ παίζετε διαδικτυακά."
full_description = "Πάνω από ένας στους δέκα gamers (12%, περίπου 179 εκατομμύρια παγκοσμίως) έχει πέσει θύμα κλοπής του ID του – η αξία των οποίων θα μπορούσε να αγγίζει τα 347 δισ. δολάρια παγκοσμίως. 7 τρόποι για να είστε όσο το δυνατόν πιο ασφαλείς ενώ παίζετε διαδικτυακά: 1. Αγορά από επίσημες πηγές Πάντα να αγοράζετε PC games είτε από γνωστές πλατφόρμες όπως το Steam και το GOG, είτε από επίσημους ιστότοπους προγραμματιστών. 2. Αποταμιεύστε έξυπνα Τα επίσημα καταστήματα προσφέρουν συχνά σημαντικές εκπτώσεις ή ακόμη και δωρεάν παιχνίδια. Ωστόσο, πολλές προσφορές μέσω email μπορεί να είναι απάτη – μεταβείτε στον ιστότοπο του προγραμματιστή ή του καταστήματος για να δείτε αν αναφέρεται η έκπτωση εκεί – αν όχι, δεν είναι πραγματική. 3. Ελέγξτε την πολιτική επιστροφής Πριν αγοράσετε, μάθετε τους κανόνες του καταστήματος για την επιστροφή ενός παιχνιδιού που δεν σας αρέσει ή που δεν λειτουργεί στον υπολογιστή σας. 4. Χρησιμοποιήστε μια ειδική κάρτα για online αγορές Αντί να συνδέσετε μια κάρτα με όλες τις αποταμιεύσεις σας, πάρτε μια χρεωστική κάρτα για online αγορές και συμπληρώστε την όπως απαιτείται. Με αυτόν τον τρόπο, εάν οι εισβολείς εισέλθουν σε έναν ιστότοπο που χρησιμοποιείτε, δεν θα κερδίσουν πολλά. 5. Χρησιμοποιήστε μια ασφαλή σύνδεση Συνιστούμε να συνδεθείτε σε διαδικτυακά καταστήματα μόνο από το σπίτι – έχοντας ασφαλίσει σωστά το οικιακό σας δίκτυο. 6. Προστατέψτε τους λογαριασμούς σας Προστατέψτε τον λογαριασμό σας στο Steam και το Battle.net και σε οποιαδήποτε προφίλ κοινωνικών δικτύων που χρησιμοποιείτε για να συνδεθείτε σε καταστήματα παιχνιδιών (αλλά μην χρησιμοποιείτε λογαριασμούς κοινωνικών δικτύων για να συνδεθείτε αλλού αν μπορείτε να το αποφύγετε). 7. Προστατέψτε τις συσκευές σας Οι υπολογιστές, τα smartphone και τα tablet που χρησιμοποιείτε για παιχνίδια χρειάζονται επίσης προστασία. Το Gaming Mode που θα βρείτε στις σύγχρονες λύσεις ασφαλείας ενεργοποιείται αυτόματα όταν παίζετε σε λειτουργία πλήρους οθόνης."
