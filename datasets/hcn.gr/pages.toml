["https://www.hcn.gr/el/ypostirixi/sychnes-erotiseis"]
title = "Συχνές Ερωτήσεις - HCN"
description = "Βρες απαντήσεις στις πιο συχνές ερωτήσεις σου σχετικά με την HCN. Λύσε κάθε σου απορία για τη σύνδεσή σου στην HCN και όχι μόνο!"
full_description = 'Υπάρχει συμβόλαιο δέσμευσης; Στην HCN ΔΕΝ ΥΠΑΡΧΟΥΝ ΣΥΜΒΟΛΑΙΑ!!! Η εταιρεία δεν "κρατάει" τους πελάτες της με ετήσια ή διετή συμβόλαια, καθώς δεν επιθυμεί να τους δεσμεύει. Οι πελάτες της HCN παραμένουν στο δίκτυό της κατά επιλογή κι έχουν το πλεονέκτημα αποχώρησης τέλος του εκάστοτε μήνα, ύστερα από επιστροφή του modem/router που τους έδωσε η εταιρεία κι εξόφληση τυχόν οφειλών. Για όποια βοήθεια, μη διστάσετε να επικοινωνήσετε μαζί μας στο 2313 250000. Μπορώ να συνδεθώ στο δίκτυο της HCN; Μπορείτε να ενημερωθείτε κατάλληλα για τη δυνατότητα σύνδεσής σας στο δίκτυο της HCN, καλώντας στο 2313 250000, όπου εκπρόσωπός μας θα ελέγξει τη διαθεσιμότητα δικτύου και τη δυνατότητα σύνδεσής σας. Διαφορετικά μπορείτε να στείλετε email στο office@hcn.gr , όπου εκπρόσωπός μας θα ελέγξει τη διαθεσιμότητα δικτύου και τη δυνατότητα σύνδεσής σας και θα σας απαντήσει στο email σας. Για όποια βοήθεια, μη διστάσετε να επικοινωνήσετε μαζί μας στο 2313 250000. Πώς μπορώ να κάνω αίτηση σύνδεσης στην HCN; Η αίτηση σύνδεσης στην HCN γίνεται μόνο γραπτώς κι όχι τηλεφωνικώς. Θα πρέπει να επισκεφθείτε ένα κατάστημα HCN με την ταυτότητά σας κι ένα λογαριασμό σταθερής τηλεφωνίας, εφόσον διαθέτετε τηλεφωνικό αριθμό σε άλλο πάροχο κι επιθυμείτε φορητότητα/μεταφορά του τηλεφωνικού αυτού αριθμού στο δίκτυό μας. Μπορείτε να συμπληρώσετε την αίτηση εκδήλωσης ενδιαφέροντος εδώ Διαφορετικά, μπορείτε να βρείτε την αίτησή μας στο site μας, στην καρτέλα "Όμιλος HCN", στη συνέχεια "Αιτήσεις & χρεώσεις", ως Αίτηση Εκδήλωσης Ενδιαφέροντος. Αφότου συμπληρώσετε την αίτηση την αποστέλλετε μέσω email, μαζί με μια φωτοτυπία ταυτότητας κι ένα λογαριασμό σταθερής τηλεφωνίας, εφόσον διαθέτετε τηλεφωνικό αριθμό σε άλλο πάροχο κι επιθυμείτε φορητότητα/μεταφορά του τηλεφωνικού αυτού αριθμού στο δίκτυό μας. Το email το αποστέλλετε στο office@hcn.gr για τη Θεσσαλονίκη, στο office_kilkis@hcn.gr για το Κιλκίς, στο office_katerini@hcn.gr για την Κατερίνη ή στο office_veroia@hcn.gr για την Βέροια. Εάν πρόκειται για εταιρική σύνδεση, απαραίτητη χρήζει η σφραγίδα της εταιρείας σας στο κατάλληλο πεδίο. Για οποιαδήποτε βοήθεια, μη διστάσετε να επικοινωνήσετε μαζί μας στο 2313 250000. Αίτηση Σύνδεσης'
