title = "Πολιτική Απορρήτου - HCN"
description = "1. Νομική βάση 1.1. Ο Γενικός Κανονισμός της ΕΕ για την Προστασία των Δεδομένων, ο νόμος περί προστασίας δεδομένων του 2000 και ο νόμος περί τροποποίησης της προστασίας δεδομένων 2018 υπηρετούν το δικαίωμα προστασίας των προσωπικών δεδομένων. Επεξεργαζόμαστε τα δεδομένα σας αποκλειστικά βάσει νομικών διατάξεων (ΓΚΠΔ,Νόμος 2472/1997, Νόμος 3471/2006). 2. Βασικές πληροφορίες 2.1. Τα στοιχεία […]"
full_description = "1. Νομική βάση 1.1. Ο Γενικός Κανονισμός της ΕΕ για την Προστασία των Δεδομένων, ο νόμος περί προστασίας δεδομένων του 2000 και ο νόμος περί τροποποίησης της προστασίας δεδομένων 2018 υπηρετούν το δικαίωμα προστασίας των προσωπικών δεδομένων. Επεξεργαζόμαστε τα δεδομένα σας αποκλειστικά βάσει νομικών διατάξεων (ΓΚΠΔ,Νόμος 2472/1997, Νόμος 3471/2006). 2. Βασικές πληροφορίες 2.1. Τα στοιχεία της εταιρείας είναι ΕΛΛΗΝΙΚΑ ΔΙΚΤΥΑ ΚΑΛΩΔΙΩΝ ΕΠΕ, που εδρεύει στην Πασσαλίδη 90-92, 55132 στην Καλαμαριά Θεσσαλονίκης. 2.2. Μπορείτε να επικοινωνήσετε με τον συντονιστή προστασίας των προσωπικών δεδομένων και της ιδιωτικής ζωής στο gdpr@hcn.gr 2.3. Είναι πολύ σημαντικό για εμάς να προστατεύουμε και να διατηρούμε ασφαλείς όλες τις προσωπικές πληροφορίες που μας εμπιστεύεστε. Σε αυτό το έγγραφο, θα μάθετε περισσότερα σχετικά με το πώς χρησιμοποιούμε και επεξεργαζόμαστε τα προσωπικά σας στοιχεία. 3. Σκοπός, νομική βάση, διάρκεια αποθήκευσης, επεξεργαστής και αποδέκτης δεδομένων 3.1. Απαιτούμε τα προσωπικά σας δεδομένα για την εκπλήρωση της σύμβασης, την επεξεργασία των παραγγελιών, την τιμολόγηση, τη διεκδίκηση συμβατικών απαιτήσεων, για σκοπούς εξυπηρέτησης πελατών και για διαφημιστικούς σκοπούς. Τα δεδομένα συλλέγονται, αποθηκεύονται, επεξεργάζονται και χρησιμοποιούνται για το σκοπό αυτό. 3.2. Η νομική βάση για την επεξεργασία των προσωπικών σας δεδομένων είναι αφενός η εκπλήρωση της σύμβασης, π.χ. Η πρόσβαση στο δίκτυο, η χρήση του δικτύου, η παράδοση ισχύος, τα νόμιμα συμφέροντα του υπεύθυνου επεξεργασίας, η εκπλήρωση των νομικών και συμβατικών υποχρεώσεών μας, καθώς και η συναίνεσή σας (για παράδειγμα, όλες οι φόρμες στην ιστοσελίδα της εταιρείας, το περιοδικό πελατών, τα cookies). Η μη παροχή δεδομένων μπορεί να έχει διαφορετικές συνέπειες. 3.3. Επιπλέον, επεξεργαζόμαστε δεδομένα που έχουμε λάβει νόμιμα από τον Δήμο Θεσσαλονίκης ή από την εταιρία μας ΕΛΛΗΝΙΚΑ ΔΙΚΤΥΑ ΚΑΛΩΔΙΩΝ ΕΠΕ στο πλαίσιο σχέσης επεξεργασίας συμβολαίων. Ανάλογα με τη σύμβαση, πρόκειται για βασικά προσωπικά δεδομένα όπως αναφέρονται παρακάτω. Επεξεργαζόμαστε τα προσωπικά σας στοιχεία όπως επώνυμο, όνομα, τίτλο, φύλο, χυδαίο όνομα, προσθήκη ονόματος, ημερομηνία γέννησης, διεύθυνση, αριθμός συστήματος, αριθμός συμβολαίου, ημερομηνία γέννησης, αριθμό ταυτότητας, τύπο ταυτότητας, δεδομένα κατανάλωσης, ηλεκτρονικό ταχυδρομείο, τηλέφωνο, συναφή προϊόντα. (από την έναρξη, την εκτέλεση μέχρι τη λήξη της σύμβασης) καθώς και σύμφωνα με τις υποχρεωτικές υποχρεώσεις αποθήκευσης και τεκμηρίωσης που απορρέουν από τον Νόμος 2472/1997, άρθρο 5. και Νόμου 3917/2011 καθώς και μέχρι το τέλος μιας πιθανής δικαστικής διαμάχης, των συνεχών περιόδων εγγύησης κλπ. Στην περίπτωση των αιτήσεων, τα βιογραφικά σημειώματα και οι εικόνες αποθηκεύονται επίσης για την απαιτούμενη από το νόμο ή συμφωνηθείσα διάρκεια. 3.4. Στο πλαίσιο της λειτουργίας των δικτυακών μας τόπων, προσλαμβάνουμε έναν αυστριακό επεξεργαστή ο οποίος μπορεί να αποκτήσει πρόσβαση στα προσωπικά σας δεδομένα κατά τη διάρκεια των δραστηριοτήτων του, αν χρειάζονται τα δεδομένα για να εκπληρώσουν τις αντίστοιχες επιδόσεις τους. Αυτές έχουν δεσμευτεί να συμμορφωθούν με τους ισχύοντες κανονισμούς προστασίας δεδομένων. Οι συμβάσεις επεξεργασίας συμβάσεων συνήφθησαν σύμφωνα με το άρθρο βάσει του άρθρου 82 παρ. 2 του ΚΦΕ. Μπορείτε να ζητήσετε περισσότερες πληροφορίες σχετικά με τους επίτροπους που μας έχουν αναθέσει στο gdpr@hcn.gr 4. Έντυπα Επικοινωνίας 4.1. Όλες οι πληροφορίες σας, συμπεριλαμβανομένων των προσωπικών δεδομένων από τα έντυπα μας, διαθέσιμα στη διεύθυνση http://www.hcn.gr/el/gdpr/, θα διαβιβαστούν σε εμάς, θα υποβληθούν σε επεξεργασία και θα αποθηκευτούν από εμάς μέσω του διακομιστή αλληλογραφίας του υπεύθυνου ιστοτόπου, προκειμένου να επεξεργαστούμε το αίτημά σας. Αυτά τα δεδομένα δεν θα συλλεχθούν ή δεν θα μοιραστούν χωρίς τη συγκατάθεσή σας. Χωρίς αυτά τα δεδομένα δεν μπορούμε να επεξεργαστούμε τα αιτήματά σας. 4.2. Η επεξεργασία των δεδομένων πραγματοποιείται βάσει των νομικών διατάξεων του Νόμου 2472/1997, άρθρο 5. και του Νόμου 3917/2011. 5. Cookies, άλλα εργαλεία παρακολούθησης και αναλύσεις ιστού [χρησιμοποιώντας εργαλεία ανάλυσης ιστού όπως το Google Analytics, eTracker κ.λπ.] 5.1. Τα cookies, άλλες τεχνολογίες παρακολούθησης καθώς και οι λειτουργίες της υπηρεσίας ανάλυσης ιστού Το Google Analytics μπορεί να χρησιμοποιηθεί στην πλατφόρμα μας με πολλούς διαφορετικούς τρόπους. Τα cookies είναι μικρές πληροφορίες κειμένου που επιτρέπουν την αναγνώριση του χρήστη και την ανάλυση της χρήσης των ιστοτόπων μας. Οι πληροφορίες που παράγονται από αυτό μεταδίδονται στο διακομιστή του παροχέα και αποθηκεύονται εκεί. Χρησιμεύουν για να κάνουν τον ιστοχώρο μας πιο φιλικό προς το χρήστη, αποτελεσματικό και ασφαλές συνολικά. Επιπλέον, τα cookies χρησιμοποιούνται για τη μέτρηση της συχνότητας των προβολών σελίδων και της γενικής πλοήγησης. Χρησιμοποιώντας τον ιστότοπό μας, συναινείτε στη ρύθμιση των cookies και χρησιμοποιώντας το Google Analytics. Μπορείτε να αρνηθείτε να δεχθείτε cookies στις ρυθμίσεις του προγράμματος περιήγησης. Πώς λειτουργεί αυτό λεπτομερώς, ανατρέξτε στις οδηγίες του κατασκευαστή του προγράμματος περιήγησης. Εάν αποφασίσετε κατά ορισμένων τεχνικών ή / και λειτουργικών cookies, η λειτουργία της ιστοσελίδας μας μπορεί να περιοριστεί. Ορισμένα cookies παραμένουν αποθηκευμένα στη συσκευή σας μέχρι να τα διαγράψετε. Περισσότερα στο http://www.hcn.gr/el/ruthmiseis-cookies/ 5.2. Η διεύθυνση IP σας θα ψευδονομάζεται πριν από την καταγραφή / αποθήκευση. Ως αποτέλεσμα, είναι δυνατόν μόνο ένας κατά προσέγγιση εντοπισμός. 5.3. Η σχέση με τον προμηθευτή διαδικτυακών αναλύσεων βασίζεται σε απόφαση επάρκειας της Ευρωπαϊκής Επιτροπής. 5.4. Η επεξεργασία δεδομένων γίνεται βάσει των νομικών διατάξεων Νόμου 2472/1997, άρθρο 5 (ειδικότερα της συγκατάθεσης). Δεδομένου ότι η ιδιωτικότητα των χρηστών μας είναι σημαντική για εμάς, τα δεδομένα χρήστη είναι κρυπτογραφημένα. 6. Συναίνεση και δικαίωμα υπαναχώρησης 6.1. Εάν η συγκατάθεσή σας για την επεξεργασία των δεδομένων σας είναι απαραίτητη, θα τα επεξεργαστούμε μόνο μετά από ρητή συγκατάθεσή σας. 6.2. Βασικά, δεν επεξεργαζόμαστε δεδομένα ανηλίκων και δεν είμαστε εξουσιοδοτημένοι να το πράξουμε. Υποβάλλοντας τη συγκατάθεσή σας, επιβεβαιώνετε ότι έχετε συμπληρώσει την ηλικία των 15 ετών ή ότι έχετε λάβει τη συγκατάθεση του νόμιμου εκπροσώπου σας. 6.3. Μπορείτε να ανακαλέσετε τη συγκατάθεσή σας ανά πάσα στιγμή στην ακόλουθη διεύθυνση ηλεκτρονικού ταχυδρομείου: gdpr@hcn.gr Σε μια τέτοια περίπτωση, τα δεδομένα που αποθηκεύθηκαν προηγουμένως για εσάς θα γίνουν ανώνυμα και στη συνέχεια θα χρησιμοποιηθούν μόνο για στατιστικούς σκοπούς χωρίς προσωπική αναφορά. Η ανάκληση της συγκατάθεσης δεν θίγει τη νομιμότητα της επεξεργασίας που πραγματοποιείται βάσει της συγκατάθεσης μέχρι την ανάκληση. 7. Ασφάλεια Δεδομένων 7.1. Η εταιρία μας ΕΛΛΗΝΙΚΑ ΔΙΚΤΥΑ ΚΑΛΩΔΙΩΝ ΕΠΕ και οι διασυνδεδεμένες εταιρείας με αυτήν χρησιμοποιούν τεχνικά και οργανωτικά μέτρα ασφαλείας για την προστασία των αποθηκευμένων προσωπικών δεδομένων από τυχαία ή εκ προθέσεως χειραγώγηση, απώλεια ή καταστροφή και κατά της πρόσβασης από μη εξουσιοδοτημένα άτομα. Τα μέτρα ασφαλείας μας βελτιώνονται συνεχώς σύμφωνα με την τεχνική πρόοδο. 8. Τα δικαιώματά σας 8.1. Έχετε το δικαίωμα ενημέρωσης του υπεύθυνου ατόμου στη διεύθυνση gdpr@hcn.gr ανά πάσα στιγμή σχετικά με τα σχετικά προσωπικά δεδομένα. Εφόσον δεν υπάρχει υποχρεωτική υποχρέωση διατήρησης (για παράδειγμα, τα τιμολόγια που έχουν εκδοθεί σύμφωνα με το νόμο σύμφωνα με το άρθρο 5 του ν. 2472/1997 μετά από 10 χρόνια), έχετε το δικαίωμα να διαγράψετε αυτά τα δεδομένα και να αντιταχθείτε στην επεξεργασία. Έχετε επίσης το δικαίωμα να διορθώσετε τα δεδομένα καθώς και να περιορίσετε την επεξεργασία, τη δυνατότητα μεταφοράς δεδομένων και την προσφυγή στην Ελληνική Αρχή Προστασίας Δεδομένων Προσωπικού Χαρακτήρα, Γραφεία: Κηφισίας 1-3, Τ.Κ. 115 23, Αθήνα, Τηλεφωνικό Κέντρο: +30-210 6475600, Email: contact@dpa.gr 8.2. Για τα δικαιώματά σας, επικοινωνήστε μαζί μας στο gdpr@hcn.gr ή γράψτε στη διεύθυνση: ΕΛΛΗΝΙΚΑ ΔΙΚΤΥΑ ΚΑΛΩΔΙΩΝ ΕΠΕ, υπόψη του. Συντονιστή Προστασίας Δεδομένων, Ι. Πασσαλίδη 90-92, 55132, Καλαμαριά, Θεσσαλονίκης"
