["https://headerfiles.com/2022/03/24/flags-fuertemente-tipadas"]
title = "Flags fuertemente tipadas"
description = "Exponemos una alternativa fuertemente tipada a las colecciones de banderas."
full_description = '''Header Files template<class Cpp, class Qt, class ... Y_Mas> Carlos Buchart Código Créditos Suscríbete (Telegram) Suscríbete (RSS) © 2024 Flags fuertemente tipadas Mar 24, 2022c++strong-typesflags Exponemos una alternativa fuertemente tipada a las colecciones de banderas. En muchos sistemas es frecuente tener que saber si determinada característica, opción, componente, etc. está habilitado o no. Para ello se suelen usar flags (banderas), definidas como constantes o enumeraciones, y vectores de booleanos o std::bitset. enum CompilationFlags { CompilationFlags_CrossCompilation, CompilationFlags_Debug, CompilationFlags_Count }; std::bitset<CompilationFlags_Count> compilation_flags; compilation_flags.set(CompilationFlags_Debug, true); El principal problema de estas soluciones es que se basan en convertir un identificador en un índice en el vector / bitset, lo que lleva a que no haya comprobación en tiempo de compilación de que la característica esté soportada. Por ejemplo, puede ocurrir un desbordamiento de buffer si el índice supera el tamaño máximo del contenedor, o un error de lógica si se consulta un flag no correspondiente a dicho conjunto (pero con el mismo valor numérico). Propuesta Una posible solución es definir las banderas como tipos booleanos fuertemente tipados y usarlos en una tupla. En este artículo extenderemos la sintaxis que propusimos en una entrega anterior (Argumentos expresivos 1): class Flag { bool m_value; public: Flag() = default; explicit Flag(bool value) noexcept : m_value{value} {} operator bool() const { return m_value; } }; #define FLAG(name) struct name : Flag { using Flag::Flag; } FLAG(CrossCompilation); FLAG(Debug); using CompilationFlags = std::tuple<CrossCompilation, Debug>; Así, podemos aprovechar el método std::get basado en tipos para consultar el estado de la bandera: CompilationFlags comp_flags; std::get<CrossCompilation>(comp_flags) = CrossCompilation{true}; // to set a value auto const cross_compilation = std::get<CrossCompilation>(comp_flags); // to get a value Ahora bien, esta sintaxis puede ser mejorada en varios aspectos; veamos cuáles son. Estado inicial de la bandera Lo primero es que no todas las banderas estarán en un estado off al inicio, por lo que podemos modificar el tipo Flag para considerar este escenario y dotarlas de un estado inicial explícito: template<bool default_value> class Flag { bool m_value{default_value}; public: Flag() = default; explicit Flag(bool value) noexcept : m_value{value} {} operator bool() const { return m_value; } }; #define FLAG(name, value) struct name : Flag<value> { using Flag::Flag; } FLAG(CrossCompilation, false); FLAG(Debug, true); Encapsulamiento Lo siguiente es dotar de una mejor interfaz a nuestra solución. Para ello definiremos una clase Flags que se hará cargo de dichas funciones. Veremos esta solución en conjunto con la siguiente mejora. Inicialización selectiva Aunque las banderas tengan un estado inicial, éste puede que no sea apropiado en algunos casos. Una solución podría ser tener un constructor que reciba todas las banderas, pero claramente no es la opción más limpia, especialmente si el conjunto es grande. En su lugar aprovecharemos el tipado fuerte de las banderas para poder definir un constructor más flexible. template<typename... Types> class Flags { public: Flags() = default; template<typename Flag, typename... Args> explicit Flags(Flag flag, Args&&... args) : Flags{args...} { std::get<Flag>(m_flags) = flag; } template<typename T> bool is_enabled() const noexcept { return std::get<T>(m_flags); } template<typename T> void set_enabled(T const& state) noexcept { std::get<T>(m_flags) = state; } private: std::tuple<Types...> m_flags; }; Ejemplo de uso using CompilationFlags = Flags<CrossCompilation, Debug>; CompilationFlags const compilation_flags{Debug{false}}; auto const is_debug = compilation_flags.is_enabled<Debug>(); El ejemplo completo puede conseguirse acá. Conclusiones Como se ha podido ver, el uso de tipos fuertemente tipados aumenta la expresividad del código, permiten soluciones máx flexibles y robustaz, y da una mayor cercanía entre la sintaxis y la semántica. Por otro lado, permiten sacar partido a una de mis características favoritas de C++: el compilador. Si algo se puede hacer en tiempo de compilación, ¿por qué hacerlo en tiempo de ejecución? Si un fallo se puede detectar cuando sólo nosotros (los desarrolladores) somos los afectados, ¿por qué dejar que el cliente sea el que lo descubra? De todo esto hablaremos en una entrega futura, mientras tanto, y como diría Sheldon Cooper: ¡diversión con banderas! Recomendado Que conste porqué construyo con constantes Introducción a Boost.Log Poniendo el foco en el foco Un cuadro de búsqueda simple y en tiempo real var disqus_config = function () { this.page.url = 'https://headerfiles.com/2022/03/24/flags-fuertemente-tipadas'; this.page.identifier = 'https://headerfiles.com/2022/03/24/flags-fuertemente-tipadas'; }; (function () { var d = document, s = d.createElement('script'); s.src = 'https://headerfiles.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); s.defer = true; s.async = true; (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a>'''
