["https://headerfiles.com/2019/03/31/efectos-colaterales-de-los-menus-contextuales-en-qt"]
title = "Efectos colaterales de los menús contextuales en Qt"
description = "Cuando se despliega un menú contextual en un widget de Qt, éste se apropia del mouse lo que evita que los otros widgets que han solicitado seguir continuamente el movimiento del cursor no reciban el evento mientras el menú contextual esté desplegado. En esta entrada explicamos cómo solucionar este problema."
full_description = '''Header Files template<class Cpp, class Qt, class ... Y_Mas> Carlos Buchart Código Créditos Suscríbete (Telegram) Suscríbete (RSS) © 2024 Efectos colaterales de los menús contextuales en Qt Mar 31, 2019c++qtmenus Cuando se despliega un menú contextual en un widget de Qt, éste se apropia del mouse lo que evita que los otros widgets que han solicitado seguir continuamente el movimiento del cursor no reciban el evento mientras el menú contextual esté desplegado. En esta entrada explicamos cómo solucionar este problema. Esta publicación es más bien corta y casi más a modo de para que no se me olvide que otra cosa, pero acá va. Cuando se despliega un menú contextual en un widget de Qt, éste se apropia del mouse (grabMouse) lo que evita que los otros widgets que han solicitado seguir continuamente el movimiento del cursor (QWidget::mouseTracking) no reciban el evento mientras el menú contextual esté desplegado. Como ejemplo práctico, imaginemos un widget que renderiza elementos gráficos propios, como un widget de OpenGL, y que mediante eventos MouseMove cambia el estado de los elementos que están debajo del cursor (como resaltar el elemento actual). Al desplegar el menú contextual para ese elemento, el widget deja de recibir el evento de MouseMove por lo que, si cuando se oculta el menú contextual el mouse está en otra posición, se tiene una incoherencia entre el elemento resaltado y el cursor, ya que la posición de éste no ha sido notificada al widget para actualizar el estado de la escena. Como solución, los menús tienen una señal QMenu::aboutToHide() que, como su nombre indica, se emite justo antes de ocultarse el menú, bien sea por seleccionar una entrada del menú o por desactivar el menú. Con esta señal se puede actualizar el estado de los elementos forzando un evento MouseMove con la posición actual del cursor. Ahora bien, este evento se emite antes de llamar al método asociado a la entrada del menú, por lo que si éste necesita del estado actual (por ejemplo, el elemento resaltado) debe tenerse este hecho en cuenta. Obviamente esto no aplica al caso de que el menú haya sido desactivado. Recomendado Traducciones en Qt Palíndromos 02022020 Que conste porqué construyo con constantes Correspondencia de monitores entre Qt y Windows var disqus_config = function () { this.page.url = 'https://headerfiles.com/2019/03/31/efectos-colaterales-de-los-menus-contextuales-en-qt/'; this.page.identifier = 'https://headerfiles.com/2019/03/31/efectos-colaterales-de-los-menus-contextuales-en-qt/'; }; (function () { var d = document, s = d.createElement('script'); s.src = 'https://headerfiles.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); s.defer = true; s.async = true; (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a>'''
