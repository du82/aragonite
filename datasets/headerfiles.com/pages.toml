["https://headerfiles.com/2020/01/17/automatizando-acciones-gracias-al-raii-parte-ii"]
title = "Automatizando acciones gracias al RAII (parte II)"
description = "En la entrada anterior estudiamos lo que es el RAII, cómo es una de las técnicas bases de C++11 y algunos ejemplos. En esta segunda parte comentaremos otros usos del RAII y cómo podemos hacer pequeños apaños mediante wrappers cuando el RAII no está disponible por la razón que sea."
full_description = '''Header Files template<class Cpp, class Qt, class ... Y_Mas> Carlos Buchart Código Créditos Suscríbete (Telegram) Suscríbete (RSS) © 2024 Automatizando acciones gracias al RAII (parte II) Jan 17, 2020c++raii En la entrada anterior estudiamos lo que es el RAII, cómo es una de las técnicas bases de C++11 y algunos ejemplos. En esta segunda parte comentaremos otros usos del RAII y cómo podemos hacer pequeños apaños mediante wrappers cuando el RAII no está disponible por la razón que sea. En la entrada anterior estudiamos lo que es el RAII, cómo es una de las técnicas bases de C++11 y algunos ejemplos. En esta segunda parte comentaremos otros usos del RAII y cómo podemos hacer pequeños apaños mediante wrappers cuando el RAII no está disponible por la razón que sea. Inicializaciones complejas Supongamos el siguiente código: class Database { Connection* m_connection = nullptr; public: bool init(const std::string& url) { m_connection = new Connection(url); if (!m_connection) { return false; } if (!m_connection->connect()) { delete m_connection; m_connection = nullptr; return false; } if (!m_connection->login()) { delete m_connection; m_connection = nullptr; return false; } return true; } }; (Como nota al margen, recordad que es legal hacer un delete sobre un puntero nulo.) Un problema de este código es que, como vimos anteriormente, tiene una gestión de fallos complicada, mucho código repetido por si ocurriese algo (hay que dejar el objeto en un estado coherente). Obviamente podríamos condensar los condicionales mediante un and pero a largo plazo eso no haría sino dificultar la lectura del código. Una opción sería usar excepciones, pero en caso de que la clase Connection no lanzase ninguna veamos qué puede hacer el RAII (y C++11) por nosotros: class Database { std::unique_ptr<Connection> m_connection; public: bool init(const std::string& url) { auto connection = std::make_unique<Connection>(url); if (!connection) { return false; } if (!connection->connect()) { return false; } if (!connection->login()) { return false; } // A partir de este punto ya no hay opción a fallos y podemos 'guardar' los cambios m_connection.swap(connection); return true; } }; Nos queda un código más limpio, directo, expresivo. Este método ya lo vimos en la entrada anterior aunque aplicado al caso de que necesitásemos devolver un objeto. Recordad que un std::unique_ptr<T> libera la memoria automáticamente al destruirse. El método swap intercambia los objetos de cada unique_ptr. RAII donde no hay RAII Algunas (¿muchas?) veces tenemos que trabajar con bibliotecas que tienen una API que no provee RAII de forma nativa. Una en particular pudiese ser la API de Windows y sus handles. Tomemos el caso de los mutex (documentación oficial acá), donde no existe el equivalente al std::lock_guard (RAII): HANDLE mutex = CreateMutex(NULL, FALSE, NULL); void foo() { WaitForSingleObject(mutex, INFINITE); // Sección crítica ReleaseMutex(mutex); } Es fácil intuir que usar mal el mutex no es muy difícil; por ejemplo, si hay varios puntos de salida y nos olvidamos el ReleaseMutex en alguno, gestión de excepciones, etc. Para solucionarlo, podemos programar nuestro propio lock_guard que habilite el RAII para nosotros: class LockGuard { HANDLE m_mutex; public: explicit LockGuard(HANDLE mutex) : m_mutex{mutex} { // Asumiendo siempre que queremos poner un timeout infinito WaitForSingleObject(mutex, INFINITE); } ~LockGuard() { ReleaseMutex(m_mutex); } } void foo() { LockGuard guard{mutex}; // Sección crítica } De igual forma podemos hacer clases individuales basadas en RAII para nuestras diferentes necesidades. En lo particular nunca me ha gustado eso de escribir código similar que difiere en pocas cosas, por lo que comparto una solución genérica que nos ahorrará el crear estas clases intermedias: #include <iostream> #include <functional> class RAII_Helper { public: explicit RAII_Helper(std::function<void(void)> on_finish) : m_finish_handler{std::move(on_finish)} { } explicit RAII_Helper(std::function<void(void)> on_start, std::function<void(void)> on_finish) : m_finish_handler{std::move(on_finish)} { if (on_start) on_start(); } RAII_Helper(const RAII_Helper&) = delete; RAII_Helper(const RAII_Helper&&) = delete; ~RAII_Helper() { if (m_finish_handler) m_finish_handler(); } private: const std::function<void(void)> m_finish_handler; }; int main() { RAII_Helper raii_saluda{[](){ std::cout << "Hola\n"; }, [](){ std::cout << "¡Adiós!\n"; }}; std::cout << "Esperando...\n"; } Hola Esperando... ¡Adiós! Código disponible en Coliru. Recomendado Convirtiendo cadenas a booleanos de forma expresiva Propiedades dinámicas de Qt y algunos usos en interfaces de usuario Pequeños trucos para los QDialogs Cómo llamar a una función una única vez var disqus_config = function () { this.page.url = 'https://headerfiles.com/2020/01/17/automatizando-acciones-gracias-al-raii-parte-ii/'; this.page.identifier = 'https://headerfiles.com/2020/01/17/automatizando-acciones-gracias-al-raii-parte-ii/'; }; (function () { var d = document, s = d.createElement('script'); s.src = 'https://headerfiles.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); s.defer = true; s.async = true; (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a>'''
