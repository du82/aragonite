["https://headerfiles.com/2020/01/27/devolviendo-cadenas-los-punteros-colgantes-de-babilonia"]
title = "Devolviendo cadenas, los punteros colgantes de Babilonia"
description = "Comentamos los problemas de memoria que pueden surgir al devolver cadenas del estilo C."
full_description = '''Header Files template<class Cpp, class Qt, class ... Y_Mas> Carlos Buchart Código Créditos Suscríbete (Telegram) Suscríbete (RSS) © 2024 Devolviendo cadenas, los punteros colgantes de Babilonia Jan 27, 2020c++pointersmemory Comentamos los problemas de memoria que pueden surgir al devolver cadenas del estilo C. En mis clases de Sistemas Operativos suelo dedicar un apartado a problemas de gestión de memoria, especialmente en el lado del programador: pérdidas de memoria (memory leaks), accesos fuera de límites (out-of-bound access), punteros colgantes (dangling pointers), entre otros. De los dos primeros ya hablaremos en otra ocasión, esta entrada versará sobre el último, los dangling pointers. Un puntero colgante es, básicamente, un puntero que contiene una dirección de memoria inválida (cuando digo puntero me refiero también, si aplica, a referencias a objetos). Una dirección inválida puede ser: una dirección basura, normalmente un puntero sin inicializar, un puntero a una zona de memoria que ya no nos pertenece, tal como puntero a un objeto destruido, en la captura de un lambda una referencia a un objeto que es destruido mientras el lambda sigue siendo utilizado, un puntero a una zona de memoria del proceso pero incorrectamente interpretada; similar al segundo caso pero donde una reserva posterior hizo que la dirección del puntero volviese a estar dentro de las reservas del proceso, pero, claro, ahora con otro significado. Cabe destacar que este último caso es raro, especialmente en aplicaciones de 64 bits, salvo que el puntero estuviese apuntando al stack. Sin entrar en detalle, podemos enumerar algunas soluciones o ayudas a estos problemas: usar std::unique_ptr, std::shared_ptr, std::weak_ptr para gestionar correctamente la propiedad del recurso, inicializar todas las variables (particularmente me gusta la nueva sintaxis de C++11 para variables miembro, ya que se ve cuáles no han sido inicializados, además de simplificar los constructores), no usar referencias por defecto en las captura de los lambdas, entre otros. Devolviendo cadenas como punteros a char En este artículo me gustaría comentar un caso un poco oculto de dangling pointer. Consideremos que tenemos una biblioteca que debe proveer una API usando únicamente PODs (plain old data) (ver al final del artículo un posible escenario para necesitar esta solución): class Dict { public: void setValue(const char* field_name, const char* value) { assert(field_name); assert(value); m_values[field_name] = value; } const char* getValue(const char* field_name) const { assert(field_name); if (const auto it = m_values.find(field_name); it != end(m_values)) return it.second.c_str(); // requiere C++17 return nullptr; } private: std::map<std::string, std::string> m_values; }; El método std::string::c_str devuelve el puntero a la cadena de caracteres (terminada en nulo). Este puntero se garantiza que es válido siempre y cuando no se efectúen operaciones que puedan modificar de alguna forma la cadena, ya que en ese caso la clase podría requerir reservar un nuevo bloque de memoria. Ahora, supongamos que la biblioteca debe proveer un mecanismo para serializar la clase en un JSON: class Dict { public: // ... const char* toJSON() const { std::string json = '{' + std::accumulate(begin(m_values), end(m_values), std::string{}, [](const std::string& s, const std::pair<std::string, std::string>& p) { const auto e = '\"' + p.first + "\":\"" + p.second + '\"'; if (s.empty()) return e; return s + ',' + e; }) + '}'; return json.c_str(); // < ??? } // ... }; En este caso, Dict::toJSON está devolviendo un puntero inválido, ya que el objeto local json es destruido al finalizar la ejecución de la función, y por lo tanto su memoria es liberada. Primera aproximación Una posible solución sería usar una variable estática o miembro, que no es destruida al terminar la función: class Dict { public: // ... const char* toJSON() const { static std::string json; json = '{' + std::accumulate(begin(m_values), end(m_values), std::string{}, [](const std::string& s, const std::pair<std::string, std::string>& p) { const auto e = '\"' + p.first + "\":\"" + p.second + '\"'; if (s.empty()) return e; return s + ',' + e; }) + '}'; return json.c_str(); } // ... }; En este caso ya no tendríamos el puntero inválido, pero sí una posible condición de carrera en caso de que el método fuese invocado de forma concurrente (lo mismo podría pasar si la cadena fuese miembro del objeto). Y no cambia mucho el escenario si protegiésemos el objeto para solucionar la condición de carrera, ya que sólo sería válido el último puntero devuelto. Solución usando un buffer por hilo La siguiente función resuelve el problema por completo, creando una pequeña lista circular por hilo en la que se almacena una copia de la cadena y devolviendo un puntero a dicha copia. const char *saveString(std::string str) { if (str.empty()) return ""; // no gastes espacio en el buffer circular thread_local std::array<std::string, 16> s_buffer; thread_local size_t s_next_string = s_buffer.size() - 1; s_next_string = (s_next_string + 1) % s_buffer.size(); s_buffer[s_next_string] = std::move(str); return s_buffer[s_next_string].c_str(); } const char *foo() { std::string bar; // ... return saveString(bar); } std::string foobar = foo(); Lo interesante de esta función es el uso de thread_local, un especificador de duración de almacenamiento similar a static pero que en lugar de establecer la destrucción de las variables al finalizar el proceso, éstas son destruidas al terminar el hilo. De esta forma garantizamos una lista circular por cada hilo. Una explicación más completa puede encontrarse acá. Como nota final, el número de elementos normalmente no debería ser muy elevado, ya que la misión de esta función es la de servir de puente, no de almacenamiento a largo plazo. Ejemplo completo Se puede ejecutar online en Coliru. #include <iostream> #include <cassert> #include <vector> #include <string> #include <map> #include <numeric> #include <thread> #include <mutex> #include <sstream> const char *saveString(std::string str) { if (str.empty()) return ""; // no gastes espacio en el buffer circular thread_local std::vector<std::string> s_buffer(16); thread_local size_t s_next_string = s_buffer.size() - 1; s_next_string = (s_next_string + 1) % s_buffer.size(); s_buffer[s_next_string] = std::move(str); return s_buffer[s_next_string].c_str(); } class Dict { public: void setValue(const char* field_name, const char* value) { assert(field_name); assert(value); m_values[field_name] = value; } const char* getValue(const char* field_name) const { assert(field_name); if (const auto it = m_values.find(field_name); it != end(m_values)) return it->second.c_str(); // requiere C++17 return nullptr; } const char* toJSON() const { std::string json = '{' + std::accumulate(begin(m_values), end(m_values), std::string{}, [](const std::string& s, const std::pair<std::string, std::string>& p) { const auto e = '\"' + p.first + "\":\"" + p.second + '\"'; if (s.empty()) return e; return s + ',' + e; }) + '}'; return saveString(json); } private: std::map<std::string, std::string> m_values; }; std::mutex cout_mutex; void print(Dict d) { std::stringstream ss; ss << std::this_thread::get_id(); d.setValue("id", ss.str().c_str()); const auto json = d.toJSON(); std::lock_guard lock(cout_mutex); std::cout << json << '\n'; } int main() { Dict d; d.setValue("firstname", "Carlos"); d.setValue("lastname", "Buchart"); d.setValue("website", "https://headerfiles.com"); std::vector<std::thread> threads(20); for (auto &t : threads) { t = std::thread{print, d}; } for (auto &t : threads) { t.join(); } } Actualización Un comentario que ha surgido a raíz del artículo es sobre por qué complicarse la vida devolviendo el puntero en lugar del std::string directamente y usar luego el método std::string::c_str en local. Aunque pueden haber distintos escenarios, el que motiva este artículo es la integración de módulos que usan runtimes distintos (normalmente uno estático y otro dinámico). Explicado brevemente, el problema es que cada runtime tiene sus propias estructuras de gestión de memoria, por lo que si un módulo reserva memoria en un runtime, ésta no puede ser liberada en otro runtime, ya que el segundo no conoce la reserva del primero (más información acá). Es por ello que las interfaces entre estos módulos no comunican objetos, para evitar que la construcción la realice un runtime y la destrucción otro. Recomendado Patrón factory basado en templates Inicialización en condicionales Argumentos expresivos (tipos fuertemente tipados, parte 2) Traducciones en Qt var disqus_config = function () { this.page.url = 'https://headerfiles.com/2020/01/27/devolviendo-cadenas-los-punteros-colgantes-de-babilonia/'; this.page.identifier = 'https://headerfiles.com/2020/01/27/devolviendo-cadenas-los-punteros-colgantes-de-babilonia/'; }; (function () { var d = document, s = d.createElement('script'); s.src = 'https://headerfiles.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); s.defer = true; s.async = true; (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a>'''
