["https://headerfiles.com/2021/04/07/huevos-de-pascua"]
title = "Huevos de Pascua"
description = "Un muy breve comentario sobre los huevos de Pascua, aunque no precisamente los de chocolate."
full_description = '''Header Files template<class Cpp, class Qt, class ... Y_Mas> Carlos Buchart Código Créditos Suscríbete (Telegram) Suscríbete (RSS) © 2024 Huevos de Pascua Apr 7, 2021 Un muy breve comentario sobre los huevos de Pascua, aunque no precisamente los de chocolate. Primero que nada, ¡feliz Pascua de Resurrección! Como viene siendo tradición desde hace muchísimos años, una de las actividades que realizan los pequeños en este domingo es la búsqueda de pequeños (o no tan pequeños) huevos de chocolate que han sido escondidos por diversos lugares, los llamados huevos de Pascua. De forma similar, los huevos de Pascua virtuales son mensajes, detalles o características ocultas en una aplicación, película, etc. El primer huevo de Pascua informático que se conoce está en el arcade Starship 1 (1977). Pulsando los botones de una forma específica aparecía un mensaje y el jugador ganaba 10 partidas gratis. Este huevo de Pascua tardó 30 años en ver la luz. El término huevo de Pascua fue acuñado por Steve Wright, director de desarrollo de Atari. Warren Robinett, programador de Atari, introdujo una función secreta en el videojuego Adventure (1979). Al pasar el personaje sobre un punto específico de la pantalla y siguiendo una secuencia de pasos, aparecía un mensaje que decía “Creado por Warren Robinett” (en ese entonces no se incluían los nombres de los programadores en los créditos). Tiempo después se animó a los desarrolladores a introducir más características ocultas de este tipo, y se les llamó huevos de Pascua porque estaban escondidos y los jugadores tenían que encontrarlos. Los huevos de Pascua no son exclusivos de los videojuegos. Por ejemplo (y aunque parezca que soy un dinosaurio) Microsoft Office 97 incluía un pequeño simulador de vuelo en Excel, y un pinball en Word, y hasta antes de Windows XP, el salvapantallas comenzaba a mostrar nombres de volcanes al escribir volcano. Apple es bien conocida por muchos guiños sutiles en el diseño de sus productos, aunque no pueden considerarse huevos de Pascua en su definición más pura. Dos de mis favoritos so el logo de la aplicación TextEdit con el mensaje del anuncio Here’s to the Crazy Ones, y el icono que usa para mostrar ordenadores Windows en red: El primer huevo de Pascua de Apple fue la inclusión de las firmas de todos los integrantes del equipo del Macintosh en su carcasa. Otro ejemplo más reciente es el de Mac OS X Mountain Lion (2012), en el que las aplicaciones descargadas tenían temporalmente la fecha 24 de enero de 1984 (lanzamiento del primer Macintosh). Google por su parte es muy dado a los huevos de Pascua, siendo mi favorito el coche de Mario Kart que lanzaron por el Día Internacional de Mario en el 2018 (10 de marzo, Mar10). Para cerrar, me gustaría añadir uno que introduje en las aplicaciones que desarrollé en STT (2DMA, 3DMA y iSen), y que ya algún usuario ha descubierto por su cuenta 😄. En la ficha de cliente de la BBDD se cambia el icono del cliente por una tarta si se abre la ficha del mismo el día de su cumpleaños. En https://eeggs.com es posible encontrar una gran listado de huevos de Pascua, ¿cuáles conocíais ya? var disqus_config = function () { this.page.url = 'https://headerfiles.com/2021/04/07/huevos-de-pascua'; this.page.identifier = 'https://headerfiles.com/2021/04/07/huevos-de-pascua'; }; (function () { var d = document, s = d.createElement('script'); s.src = 'https://headerfiles.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); s.defer = true; s.async = true; (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a>'''
