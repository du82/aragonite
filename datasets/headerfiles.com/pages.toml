title = "[Nano-post] Qt, moc y cabeceras precompiladas"
description = "Estudiaremos cómo solucionar un error de compilación en ficheros moc de Qt."
full_description = '''Header Files template<class Cpp, class Qt, class ... Y_Mas> Carlos Buchart Código Créditos Suscríbete (Telegram) Suscríbete (RSS) © 2024 [Nano-post] Qt, moc y cabeceras precompiladas Mar 15, 2020qtmoc Estudiaremos cómo solucionar un error de compilación en ficheros moc de Qt. Si vuestro proyecto Qt presenta las siguientes características (todas): usa cabeceras precompiladas (PCH, PreCompiled Headers), se compila en Visual Studio, y usa compilación basada en Qt / MSBuild podéis encontraros con que los ficheros generados por la herramienta de moc’ing de Qt (moc.exe) no compilan correctamente al no encontrar el fichero stdafx.h (o pch.h, o cualquiera sea el nombre de vuestro fichero de cabeceras precompiladas). Recordad que estos ficheros moc’eados los genera Qt para ficheros con extensión (normalmente) .h que incluyen una clase con la macro Q_OBJECT. Así, por ejemplo, se genera el fichero moc_Header.cpp para el fichero Header.h. Es posible solucionar este problema fácilmente entrando en la configuración de los ficheros de cabecera y forzar la inclusión del fichero de cabecera precompilado: Recomendado Usando tipografías propias en Qt Introducción a los QProxyStyle Signals y slots en Qt (parte II) Traducciones en Qt var disqus_config = function () { this.page.url = 'https://headerfiles.com/2020/03/15/qt-moc-cabeceras-precompiladas/'; this.page.identifier = 'https://headerfiles.com/2020/03/15/qt-moc-cabeceras-precompiladas/'; }; (function () { var d = document, s = d.createElement('script'); s.src = 'https://headerfiles.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); s.defer = true; s.async = true; (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a>'''
