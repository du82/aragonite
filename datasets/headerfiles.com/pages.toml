["https://headerfiles.com/2020/12/06/benchmarking-de-iteraciones-sobre-qmaps"]
title = "Benchmarking de iteraciones sobre QMaps"
description = "Comparamos el rendimiento entre los contenedores QMap y std::map."
full_description = '''Header Files template<class Cpp, class Qt, class ... Y_Mas> Carlos Buchart Código Créditos Suscríbete (Telegram) Suscríbete (RSS) © 2024 Benchmarking de iteraciones sobre QMaps Dec 6, 2020c++qtmapsbenchmarking Comparamos el rendimiento entre los contenedores QMap y std::map. Como usuario asiduo de Qt, el rendimiento de sus diferentes componentes resulta crítico. Hoy me gustaría comentar brevemente una pequeña comparativa que hice recientemente sobre las diversas formas de iterar sobre un QMap. Esta entrada es básicamente un estudio de rendimiento de las opciones presentadas hace ya un tiempo en esta otra. Estudio El estudio se ha realizado iterando sobre QMap<QString, int> de entre 100 y 1.000.000 de elementos, repitiendo 1000 veces. He utilizado los benchmark del módulo Qt::Test para facilitar el proceso. El código del estudio puede descargarse desde mi repositorio en GitHub. El entorno de pruebas es un i7 7700HQ con 16GB de RAM, ejecutando Windows 10 (20H2); el código fue compilado usando Visual Studio 17 y Qt 5.14.2 de 32 bits. Las distintas formas de iteración valoradas han sido las siguientes: Iteración directa sobre los valores for (const auto &value : map) { sum += value; } Iteración sobre las claves for (const auto &key : map.keys()) { sum += map[key]; } Usando los iteradores estándar de QMap for (auto it = map.begin(); it != map.end(); ++it) { sum += it.value(); } Convirtiendo a std::map for (const auto &it : map.toStdMap()) { sum += it.second; } Usando los iteradores keyValue presentes desde Qt 5.10 for (const auto it : ::qmap_wrapper{map}) { sum += it.second; } Resultados La siguiente gráfica muestra los resultados de las pruebas: Como era de esperarse, las opciones más ineficientes (y con diferencia) son las que iteran individualmente sobre las claves y luego realizan la consulta. Algo mejor se comporta la copia a un std::map, donde se nota que se recurre al iterador base del QMap, aunque claramente hay una penalización por copia y doble acceso. Los mejores resultados los reportan, más o menos en el mismo rango, el iterador estándar de QMap, el range-for por defecto, y nuestro qmap_wrapper, siendo entre uno y dos órdenes de magnitud más eficientes. Esto demuestra que el wrapper desarrollado es una alternativa perfectamente válida, que no sacrifica rendimiento y da mayor versatilidad y compatibilidad con código C++ estándar existente. Recomendado Flags fuertemente tipadas Me gusta el mueve mueve Atributo maybe_unused (C++17) Argumentos expresivos (booleanos fuertemente tipados) var disqus_config = function () { this.page.url = 'https://headerfiles.com/2020/12/06/benchmarking-de-iteraciones-sobre-qmaps/'; this.page.identifier = 'https://headerfiles.com/2020/12/06/benchmarking-de-iteraciones-sobre-qmaps/'; }; (function () { var d = document, s = d.createElement('script'); s.src = 'https://headerfiles.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); s.defer = true; s.async = true; (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a>'''
