["https://headerfiles.com/2020/12/30/bloqueando-senales-qt"]
title = "Bloqueando señales en Qt"
description = "Hay casos en los que no deseamos que el slot de un objeto sea llamado al emitirse una señal. Esta entrada explica una forma simple de solucionarlo."
full_description = '''Header Files template<class Cpp, class Qt, class ... Y_Mas> Carlos Buchart Código Créditos Suscríbete (Telegram) Suscríbete (RSS) © 2024 Bloqueando señales en Qt Dec 29, 2020c++qtsignal-slot Hay casos en los que no deseamos que el slot de un objeto sea llamado al emitirse una señal. Esta entrada explica una forma simple de solucionarlo. En entradas anteriores hemos visto cómo realizar una conexión entre una señal y un slot en Qt (1 y 2). Ahora bien, hay casos en los que no deseamos que el slot sea llamado al emitirse la señal, como por ejemplo si debemos actualizar programáticamente una propiedad de un widget en base a un cambio en el estado de nuestro modelo, pero hacerlo haría que el modelo volviese a cambiar ya que el widget ha emitido una señal de cambio. Para ello algunos widgets proveen dos señales diferentes para estos casos, una que se emite siempre que se cambia el valor (ya sea mediante acción directa del usuario con el widget, o bien programáticamente), y otra señal que se emite sólo cuando el cambio se genera desde el interfaz de usuario. En este caso, es fácil hacer la separación. Desafortunadamente, no todos los controles nos dan las mismas facilidades. Por ejemplo, los sliders sólo proporcionan la señal valueChanged, que se genera tanto al cambiar el valor del slider programáticamente como al hacerlo por interfaz de usuario. En estos casos, es fácil caer en una cascada recursiva de llamadas, en una serie de acciones duplicadas (con el respectivo impacto en el rendimiento) o, para evitar esto último, en un diseño poco elegante y legible, en el que dar un valor al slider implica implícitamente ejecutar una serie de acciones (en el slot). Esto último puede ser peligroso si la conexión ejecuta el slot de forma asíncrona, lo que lleva a un código más oscuro y críptico, con truquillos (chapuzas) tales como actualizar manualmente el bucle de eventos con el fin de que dicho slot se ejecute. Pues bien, una forma de evitar esto es desconectando temporalmente al widget para que dicha señal no ejecute ningún slot. Desafortunadamente esto no siempre es sencillo por varias razones: hay que volver a conectar las señales (que pueden ser varias, y con varios slots cada una), puede que haya señales que sólo se conectan bajo determinadas circunstancias (por lo que tendríamos que duplicar la lógica de conexión, y extraerla a una función, de nuevo, no siempre es posible), o tendríamos que guardar las conexiones y estar activándolas y desactivándolas cada vez. Todo esto suena muy complicado para algo tan simple. ¿Y si hubiera una forma de hacer el cambio de estado sin que se emitiese ninguna señal, y ahorrarnos tanto lío? ¡Pues resulta que la hay! Es el método blockSignals que todo QObject tiene. Basta con activar el bloqueo antes de cambiar el estado, y desactivarlo al finalizar: ui.slider->blockSignals(true); ui.slider->setValue(0); ui.slider->blockSignals(false); // call here the slot, if necessary Este método tiene la sencillez y expresividad que buscábamos: es rápido, no necesita que almacenemos listas de conexiones, ni que tengamos que modificar nuestro código en varios sitios si conectamos una nueva señal del widget, ni tener que hacer peripecias con el bucle de eventos, a la vez que deja muy patente lo que estamos haciendo. Por contraparte, esta técnica obviamente tiene la desventaja de que bloquea todas las señales (actualmente no hay forma de bloquear una señal en concreto), pero en el tipo de escenario que hemos comentado no suele ser un problema. A partir de Qt 5.3 está disponible la clase QSignalBlocker, que facilita este proceso mediante el uso del RAII, a la vez que garantiza que las señales son restauradas incluso ante una excepción. Para el que quiera profundizar un poco más sobre el tema, le recomiendo esta pregunta de Stack Overflow donde explican y discuten estas soluciones. Recomendado Coexistencia de múltiples Q*Application Iterando sobre QMaps Signals y slots en Qt (parte I) Palíndromos 02022020 var disqus_config = function () { this.page.url = 'https://headerfiles.com/2020/12/30/bloqueando-senales-qt/'; this.page.identifier = 'https://headerfiles.com/2020/12/30/bloqueando-senales-qt/'; }; (function () { var d = document, s = d.createElement('script'); s.src = 'https://headerfiles.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); s.defer = true; s.async = true; (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a>'''
