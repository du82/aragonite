full_description = "Header Files template<class Cpp, class Qt, class ... Y_Mas> Carlos Buchart Código Créditos Suscríbete (Telegram) Suscríbete (RSS) © 2024 posts [Nano-post] Qt, moc y cabeceras precompiladas Mar 15, 2020 qtmoc Estudiaremos cómo solucionar un error de compilación en ficheros moc de Qt. Convirtiendo cadenas a booleanos de forma expresiva Mar 11, 2020 c++expressivenessclean-code Detallamos algunas posibles mejoras en la expresividad del código al transformar cadenas de texto a booleanos. Poniendo el foco en el foco Mar 7, 2020 c++qtguifocus Formas de alterar el comportamiento de nuestros controles cuando reciben el foco. Navegando rápidamente por el código (parte I) Feb 23, 2020 ide En esta serie de dos entregas comentaré cómo navego por el código con el que trabajo. Se trata de un conjunto de herramientas, pasos, técnicas que me ayudan a leer el código, a inspeccionarlo, a tenerlo a la mano, a no perderme en los cambios que hago. No son métodos para escribir mejor código (ni temas de formato, ni organización, ni nomenclatura). Son ayudas para leer y navegar por código ya existente. Propiedades dinámicas de Qt y algunos usos en interfaces de usuario Feb 9, 2020 c++qtproperties ¿Cómo podemos añadir propiedades nuevas a los objetos de Qt y qué beneficios nos trae? Palíndromos 02022020 Feb 2, 2020 c++algorithms Hoy dedicaremos un artículo básico sobre cómo comprobar si un texto es palíndromo o no. Es un buen ejercicio cuando se comienza a programar y he querido dedicar unas líneas al mismo con algunas soluciones. Devolviendo cadenas, los punteros colgantes de Babilonia Jan 27, 2020 c++pointersmemory Comentamos los problemas de memoria que pueden surgir al devolver cadenas del estilo C. Automatizando acciones gracias al RAII (parte II) Jan 17, 2020 c++raii En la entrada anterior estudiamos lo que es el RAII, cómo es una de las técnicas bases de C++11 y algunos ejemplos. En esta segunda parte comentaremos otros usos del RAII y cómo podemos hacer pequeños apaños mediante wrappers cuando el RAII no está disponible por la razón que sea. Automatizando acciones gracias al RAII (parte I) Jan 13, 2020 c++raii Uno de los aspectos que más me gusta de C++ es el RAII (Resource Acquisition Is Initialization). Introducida por Bjarne Stroustrup, esta técnica hace uso de los constructores y destructores para la correcta gestión de recursos. Benchmarking sencillo y cuasi-automático de funciones Jan 8, 2020 c++benchmarking Cómo medir tiempos de ejecución de una forma sencilla. Pequeños trucos para los QDialogs Jul 24, 2019 c++qtdialogs Detallamos diversos trucos para mejorar nuestros diálogos en Qt, tales como QMessageBox personalizados, flags y múltiples valores de retorno. Un cuadro de búsqueda simple y en tiempo real Jun 13, 2019 c++qtsearch Presentamos una implementación rápida y sencilla de un cuadro de búsqueda genñerico en Qt. Signals y slots en Qt (parte II) May 14, 2019 c++qtsignal-slot Presentamos la nueva sintaxis de Qt 5 y sus ventajas, y resolvemos los principales problemas que nos podemos encontrar. Signals y slots en Qt (parte I) Apr 26, 2019 c++qtsignal-slot Al hablar de Qt vienen inmediatamente a la cabeza dos palabras, signals y slots, un mecanismo de comunicación muy similar al patrón observador, especialmente en lo referente a interfaces gráficas. Coexistencia de múltiples Q*Application Apr 7, 2019 c++qtqapplication Estudiamos las consecuencias de instanciar QApplication múltiples veces y las consideraciones a tener en cuenta. Efectos colaterales de los menús contextuales en Qt Mar 31, 2019 c++qtmenus Cuando se despliega un menú contextual en un widget de Qt, éste se apropia del mouse lo que evita que los otros widgets que han solicitado seguir continuamente el movimiento del cursor no reciban el evento mientras el menú contextual esté desplegado. En esta entrada explicamos cómo solucionar este problema. ⏮ 3 / 4 ⏭"
