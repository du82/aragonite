["https://headerfiles.com/2019/03/12/intuicion-y-openssl-exportando-claves-rsa"]
title = "Intuición y OpenSSL: exportando claves RSA"
description = "Pocas cosas hay menos intuitivas en este mundo que el exportar las claves RSA privada y pública en OpenSSL. Veamos cómo hacerlo correctamente."
full_description = '''Header Files template<class Cpp, class Qt, class ... Y_Mas> Carlos Buchart Código Créditos Suscríbete (Telegram) Suscríbete (RSS) © 2024 Intuición y OpenSSL: exportando claves RSA Mar 12, 2019copenssl Pocas cosas hay menos intuitivas en este mundo que el exportar las claves RSA privada y pública en OpenSSL. Veamos cómo hacerlo correctamente. Pocas cosas hay menos intuitivas en este mundo que el exportar las claves RSA privada y pública en OpenSSL. De entrada uno piensa que las funciones a utilizar son PEM_write_bio_RSAPrivateKey y PEM_write_bio_RSAPublicKey. Todo compila, las salidas son coherentes y parece que todo va bien, pero pronto uno descubre no hay manera de hacer que el programa no falle al usar la clave pública. La solución es tan sencilla como utilizar, en su lugar, la función PEM_write_bio_RSA_PUBKEY. Enlaces relacionados PEM_write_bio_RSA_PUBKEY() vs PEM_write_bio_RSAPublicKey() How to read an RSA public key from a its PEM format string using the OpenSSL API? Recomendado Breve introducción al uso de RSA con OpenSSL var disqus_config = function () { this.page.url = 'https://headerfiles.com/2019/03/12/intuicion-y-openssl-exportando-claves-rsa/'; this.page.identifier = 'https://headerfiles.com/2019/03/12/intuicion-y-openssl-exportando-claves-rsa/'; }; (function () { var d = document, s = d.createElement('script'); s.src = 'https://headerfiles.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); s.defer = true; s.async = true; (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a>'''
