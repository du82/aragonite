["https://headerfiles.com/2021/07/06/expressive-args-2"]
title = "Argumentos expresivos (tipos fuertemente tipados, parte 2)"
description = "En esta segunda entre generalizamos para más tipos de datos la solución propuesta anteriormente."
full_description = '''Header Files template<class Cpp, class Qt, class ... Y_Mas> Carlos Buchart Código Créditos Suscríbete (Telegram) Suscríbete (RSS) © 2024 Argumentos expresivos (tipos fuertemente tipados, parte 2) Jul 6, 2021c++clean-codestrong-typesexpressiveness En esta segunda entre generalizamos para más tipos de datos la solución propuesta anteriormente. Se suele decir que lo más difícil de la programación no es escribir código, es leerlo. Y los que hemos trabajado con bases de código de varios lustros de edad lo sabemos muy bien: funciones que tenemos que leer durante un par de horas para saber qué hacen, cómo lo hacen, sus precondiciones, sus casos borde, sus efectos colaterales. Muchas veces tenemos que pasar por largas sesiones de depuración paso a paso y refactorización para descifrar ese método que otro (¿nosotros?) escribió hace años (¿meses? ¿semanas?). Para más información sobre el trabajo con código legado recomiendo esta lectura. La mejor forma de resolver este problema es evitarlo: escribir código que no sólo ha de ser ejectuado por un ordenador sino que ha de ser leído por un ser humano. La expresividad del código es un tema que desde hace unos años me viene apasionando más y más, ya que muchas veces con muy poco esfuerzo es posible mejorar la calidad, legibilidad y mantenibilidad del código drásticamente. Y casi siempre sin añadir overhead a nuestro proyecto. En esta entrega extenderemos lo expuesto a comienzos de año a más tipos de datos de una forma muy sencilla. Argumentos booleanos expresivos Para refrescar, comentábamos que podíamos crear un tipo booleano con un propósito específico, que no fuera convertible implícitamente, y por lo tanto de forma oculta a nuestros ojos: struct TrueFalse { const bool value; explicit TrueFalse(bool value) : value{value} {} explicit TrueFalse(int value) = delete; explicit TrueFalse(const void* value) = delete; explicit TrueFalse(double value) = delete; operator bool() const { return value; } }; #define DEF_TRUE_FALSE(name) struct name : TrueFalse { using TrueFalse::TrueFalse; } DEF_TRUE_FALSE(ReadOnly); Generalización Basándonos en esta solución es posible generalizar parte de la clase para soportar cualquier tipo de dato (aprovecharemos de extender algunas funcionalidades y de mejorar el código) template<typename T> class StrongType { T value; public: explicit StrongType(T value) noexcept : value{value} {} StrongType(const StrongType &other) noexcept : value{other.value} {} StrongType(StrongType &&other) noexcept : value{std::move(other.value)} {} StrongType<T> &operator=(const StrongType &other) { value = other.value; return *this; } StrongType<T> &operator=(StrongType &&other) { value = std::move(other.value); return *this; } operator T() const { return value; } }; #define DEF_STRONG_TYPE(name, Type) class name : public StrongType<Type> { using StrongType::StrongType; } #define DEF_TRUE_FALSE(name) DEF_STRONG_TYPE(name, bool) Por último, podemos extender esta funcionalidad aún más definiendo un literal de usuario para construir el tipo de dato. Es importante tener en cuenta las limitaciones de este operador respecto a los tipos de datos soportados, ya que es probable que tengamos que forzar un casting si nuestro tipo de datos usa valores con menor rango. DEF_STRONG_TYPE(Kilometers, long double); inline Kilometers operator""_km(long double value) { return Kilometers{value}; } const auto distance = 42.0_km; Podéis encontrar el ejemplo completo y ejecutable en Coliru. Recomendado Signals y slots en Qt (parte II) Ajuste dinámico de imágenes en QLabels Cómo llamar a una función una única vez Documentar, sí, ¿pero dónde? var disqus_config = function () { this.page.url = 'https://headerfiles.com/2021/07/06/expressive-args-2/'; this.page.identifier = 'https://headerfiles.com/2021/07/06/expressive-args-2/'; }; (function () { var d = document, s = d.createElement('script'); s.src = 'https://headerfiles.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); s.defer = true; s.async = true; (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a>'''
