["https://headerfiles.com/2019/03/13/usando-tipografias-propias-en-qt"]
title = "Usando tipografías propias en Qt"
description = "En esta entrada comentamos cómo añadir ficheros de fuentes en nuestros proyectos Qt."
full_description = '''Header Files template<class Cpp, class Qt, class ... Y_Mas> Carlos Buchart Código Créditos Suscríbete (Telegram) Suscríbete (RSS) © 2024 Usando tipografías propias en Qt Mar 13, 2019c++qtfonts En esta entrada comentamos cómo añadir ficheros de fuentes en nuestros proyectos Qt. El dar un toque de distinción a nuestras aplicaciones puede pasar por utilizar tipografías que no son estándares, o que sólo vienen incluidas con instalaciones de determinados programas que no podemos asumir estén siempre presentes (ejemplo típico, MS Office, suites de Adobe…). Registrando las tipografías La opción más conveniente es la de incluirlas con nuestra aplicación (no hablaré de licencias ni nada parecido, asumo que todo está en orden). Para esto se pueden bien copiar junto al ejecutable, o incluir en un fichero de recursos (QRC). En cualquier de ambos casos habrá que registrar las fuentes antes de poder utilizarlas, especialmente si deseamos usarlas desde hojas de estilos. // Para una tipografía incluida en el fichero de recursos QFontDatabase::addApplicationFont(":/fonts/arialn.ttf"); // Si está distribuida con nuestro ejecutable QFontDatabase::addApplicationFont("../resources/fonts/arialnb.ttf"); Esto podemos hacerlo en nuestra función main(), justo después de instanciar la aplicación (QApplication) por ejemplo. A partir de ese momento podremos utilizar las fuentes por su nombre como si se tratase de otra fuente del sistema. La contraparte de esto es que debemos mantener actualizada esta lista de tipografías con las incluidas en los recursos, y bien puede pasar que esa lista sea modificada por otra persona del equipo (por ejemplo, diseñadores), lo que implicaría una constante comunicación con el desarrollador encargado (¿nosotros?) para que la aplicación cargue correctamente todos los recursos. Con el siguiente fragmento de código cargamos todas las tipografías contenidas dentro de un directorio dado de forma completamente automática: // Sustituir ":/fonts/" por el directorio correspondiente QDirIterator fonts_it(":/fonts/", QDir::Files); while (fonts_it.hasNext()) { QFontDatabase::addApplicationFont(fonts_it.next()); } Diferencias entre fuentes en el fichero de recursos y ficheros normales Recordad que en Qt las rutas que empiezan por : pertenecen al sistema de ficheros virtual de recursos, pero de eso hablaremos más en otro momento. Por otro lado, si las tipografías están en un directorio que se distribuye con la aplicación, podemos utilizar QApplication::applicationDirPath para asegurarnos de que la ruta que pongamos no se ve modificada por el directorio actual de trabajo: const auto fonts_dir = qApp->applicationDirPath() + "/../resources/fonts/"; QFontDatabase::addApplicationFont(fonts_dir + "arialnb.ttf"); Recomendado Argumentos expresivos (booleanos fuertemente tipados) Benchmarking sencillo y cuasi-automático de funciones Máxima resolución de webcam en OpenCV Iterando sobre QMaps var disqus_config = function () { this.page.url = 'https://headerfiles.com/2019/03/13/usando-tipografias-propias-en-qt/'; this.page.identifier = 'https://headerfiles.com/2019/03/13/usando-tipografias-propias-en-qt/'; }; (function () { var d = document, s = d.createElement('script'); s.src = 'https://headerfiles.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); s.defer = true; s.async = true; (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a>'''
