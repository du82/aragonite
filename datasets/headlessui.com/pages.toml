["https://headlessui.com/v1/vue/menu"]
title = "Menu (Dropdown) - Headless UI"
description = "Completely unstyled, fully accessible UI components, designed to integrate beautifully with Tailwind CSS."
full_description = '''Menu (Dropdown) Menus offer an easy way to build custom, accessible dropdown components with robust support for keyboard navigation. PreviewCodeCopyCopied! InstallationTo get started, install Headless UI via npm.Please note that this library only supports Vue 3.npm install @headlessui/vueBasic exampleMenu Buttons are built using the Menu, MenuButton, MenuItems, and MenuItem components.The MenuButton will automatically open/close the MenuItems when clicked, and when the menu is open, the list of items receives focus and is automatically navigable via the keyboard.<template> <Menu> <MenuButton>More</MenuButton> <MenuItems> <MenuItem v-slot="{ active }"> <a :class='{ "bg-blue-500": active }' href="/account-settings"> Account settings </a> </MenuItem> <MenuItem v-slot="{ active }"> <a :class='{ "bg-blue-500": active }' href="/account-settings"> Documentation </a> </MenuItem> <MenuItem disabled> <span class="opacity-75">Invite a friend (coming soon!)</span> </MenuItem> </MenuItems> </Menu> </template> <script setup> import { Menu, MenuButton, MenuItems, MenuItem } from '@headlessui/vue' </script>Styling different statesHeadless UI keeps track of a lot of state about each component, like which listbox option is currently selected, whether a popover is open or closed, or which item in a menu is currently active via the keyboard.But because the components are headless and completely unstyled out of the box, you can't see this information in your UI until you provide the styles you want for each state yourself.Using slotsEach component exposes information about its current state via slot props that you can use to conditionally apply different styles or render different content.For example, the MenuItem component exposes an active state, which tells you if the item is currently focused via the mouse or keyboard.<template> <Menu> <MenuButton>Options</MenuButton> <MenuItems> <!-- Use the `active` state to conditionally style the active item. --> <MenuItem v-for="link in links" :key="link.href" as="template" v-slot="{ active }" > <a :href="link.href" :class="{ 'bg-blue-500 text-white': active, 'bg-white text-black': !active }" > {{ link.label }} </a> </MenuItem> </MenuItems> </Menu> </template> <script setup> import { Menu, MenuButton, MenuItems, MenuItem } from '@headlessui/vue' const links = [ { href: '/account-settings', label: 'Account settings' }, { href: '/support', label: 'Support' }, { href: '/license', label: 'License' }, { href: '/sign-out', label: 'Sign out' }, ] </script> For a complete list of all the available slot props, see the component API documentation.Using data attributesEach component also exposes information about its current state via a data-headlessui-state attribute that you can use to conditionally apply different styles.When any of the states in the slot prop API are true, they will be listed in this attribute as space-separated strings so you can target them with a CSS attribute selector in the form [attr~=value].For example, here's what the MenuItems component with some child MenuItem components renders when the menu is open and the second item is active:<!-- Rendered `MenuItems` --> <ul data-headlessui-state="open"> <li data-headlessui-state="">Account settings</li> <li data-headlessui-state="active">Support</li> <li data-headlessui-state="">License</li> </ul>If you are using Tailwind CSS, you can use the @headlessui/tailwindcss plugin to target this attribute with modifiers like ui-open:* and ui-active:*:<template> <Menu> <MenuButton>Options</MenuButton> <MenuItems> <!-- Use the `active` state to conditionally style the active item. --> <MenuItem v-for="link in links" :key="link.href" :href="link.href" as="a" class="ui-active:bg-blue-500 ui-active:text-white ui-not-active:bg-white ui-not-active:text-black" > {{ link.label }} </MenuItem> </MenuItems> </Menu> </template> <script setup> import { Menu, MenuButton, MenuItems, MenuItem } from '@headlessui/vue' const links = [ { href: '/account-settings', label: 'Account settings' }, { href: '/support', label: 'Support' }, { href: '/license', label: 'License' }, { href: '/sign-out', label: 'Sign out' }, ] </script> Showing/hiding the menuBy default, your MenuItems instance will be shown/hidden automatically based on the internal open state tracked within the Menu component itself.<template> <Menu> <MenuButton>More</MenuButton> <!-- By default, the `MenuItems` will automatically show/hide when the `MenuButton` is pressed. --> <MenuItems> <MenuItem><!-- ... --></MenuItem> <!-- ... --> </MenuItems> </Menu> </template> <script setup> import { Menu, MenuButton, MenuItems, MenuItem } from '@headlessui/vue' </script>If you'd rather handle this yourself (perhaps because you need to add an extra wrapper element for one reason or another), you can add a static prop to the MenuItems instance to tell it to always render, and inspect the open slot prop provided by the Menu to control which element is shown/hidden yourself.<template> <Menu v-slot="{ open }"> <MenuButton>More</MenuButton> <div v-show="open"> <!-- Using the `static` prop, the `MenuItems` are always rendered and the `open` state is ignored. --> <MenuItems static> <MenuItem><!-- ... --></MenuItem> <!-- ... --> </MenuItems> </div> </Menu> </template> <script setup> import { Menu, MenuButton, MenuItems, MenuItem } from '@headlessui/vue' </script> Closing menus manuallyThe menu will already close by default, however it can happen that 3rd party Link components use event.preventDefault(), which prevents the default behaviour and therefore won't close the menu.The Menu and MenuItem expose a close() slot prop which you can use to imperatively close the menu:<template> <Menu> <MenuButton>Terms</MenuButton> <MenuItems> <MenuItem v-slot="{ close }"> <MyCustomLink href="/" @click="close">Read and accept</MyCustomLink> </MenuItem> </MenuItems> </Menu> </template> <script setup> import { Menu, MenuButton, MenuItems, MenuItem } from '@headlessui/vue' import { MyCustomLink } from './MyCustomLink' </script> Disabling an itemUse the disabled prop to disable a MenuItem. This will make it unselectable via keyboard navigation, and it will be skipped when pressing the up/down arrows.<template> <Menu> <MenuButton>More</MenuButton> <MenuItems> <!-- ... --> <!-- This item will be skipped by keyboard navigation. --> <MenuItem disabled> <span class="opacity-75">Invite a friend (coming soon!)</span> </MenuItem> </MenuItems> </Menu> </template> <script setup> import { Menu, MenuButton, MenuItems, MenuItem } from '@headlessui/vue' </script> TransitionsTo animate the opening/closing of the menu panel, you can use Vue's built-in <transition> component. All you need to do is wrap your MenuItems instance in a <transition>, and the transition will be applied automatically.<template> <Menu> <MenuButton>More</MenuButton> <!-- Use Vue's built-in `transition` element to add transitions. --> <transition enter-active-class="transition duration-100 ease-out" enter-from-class="transform scale-95 opacity-0" enter-to-class="transform scale-100 opacity-100" leave-active-class="transition duration-75 ease-out" leave-from-class="transform scale-100 opacity-100" leave-to-class="transform scale-95 opacity-0" > <MenuItems> <MenuItem><!-- ... --></MenuItem> <!-- ... --> </MenuItems> </transition> </Menu> </template> <script setup> import { Menu, MenuButton, MenuItems, MenuItem } from '@headlessui/vue' </script> If you'd like to coordinate multiple transitions for different children of your Menu, check out the Transition component included in Headless UI.Rendering additional contentThe accessibility semantics of role="menu" are fairly strict and any children of a Menu that are not MenuItem components will be automatically hidden from assistive technology to make sure the menu works the way screen reader users expect.For this reason, rendering any children other than MenuItem components is discouraged as that content will be inaccessible to people using assistive technology.If you want to build a dropdown with more flexible content, consider using Popover instead.Rendering as different elementsBy default, the Menu and its subcomponents each render a default element that is sensible for that component.For example, MenuButton renders a button by default, and MenuItems renders a div. By contrast, Menu and MenuItem do not render an element, and instead render their children directly by default.This is easy to change using the as prop, which exists on every component.<template> <!-- Render a `div` instead of no wrapper element --> <Menu as="div"> <MenuButton>More</MenuButton> <!-- Render a `section` instead of a `div` --> <MenuItems as="section"> <MenuItem v-slot="{ active }"> <a :class='{ "bg-blue-500": active }' href="/account-settings"> Account settings </a> </MenuItem> <!-- ... --> </MenuItems> </Menu> </template> <script setup> import { Menu, MenuButton, MenuItems, MenuItem } from '@headlessui/vue' </script> To tell an element to render its children directly with no wrapper element, use as="template".<template> <Menu> <!-- Render no wrapper, instead pass in a `button` manually. --> <MenuButton as="template"> <button>More</button> </MenuButton> <MenuItems> <MenuItem v-slot="{ active }"> <a :class='{ "bg-blue-500": active }' href="/account-settings"> Account settings </a> </MenuItem> <!-- ... --> </MenuItems> </Menu> </template> <script setup> import { Menu, MenuButton, MenuItems, MenuItem } from '@headlessui/vue' </script> This is important if you are using an interactive element like an <a> tag inside the MenuItem. If the MenuItem had an as="div", then the props provided by Headless UI would be forwarded to the div instead of the a, which means that you can't go to the URL provided by the <a> tag anymore via your keyboard.Accessibility notesFocus managementClicking the MenuButton toggles the menu and focuses the MenuItems component. Focus is trapped within the open menu until Escape is pressed or the user clicks outside the menu. Closing the menu returns focus to the MenuButton.Mouse interactionClicking a MenuButton toggles the menu. Clicking anywhere outside of an open menu will close that menu.Keyboard interaction CommandDescriptionEnter or Space when MenuButton is focusedOpens menu and focuses first non-disabled itemArrowDown or ArrowUp when MenuButton is focusedOpens menu and focuses first/last non-disabled itemEsc when menu is openCloses any open MenusArrowDown or ArrowUp when menu is openFocuses previous/next non-disabled itemHome or PageUp when menu is openFocuses first non-disabled itemEnd or PageDown when menu is openFocuses last non-disabled itemEnter or Space when menu is openActivates/clicks the current menu itemA–Z or a–z when menu is openFocuses first item that matches keyboard input OtherAll relevant ARIA attributes are automatically managed.For a full reference on all accessibility features implemented in Menu, see the ARIA spec on Menu Buttons.When to use a MenuMenus are best for UI elements that resemble things like the menus you'd find in the title bar of most operating systems. They have specific accessibility semantics, and their content should be restricted to a list of links or buttons. Focus is trapped in an open menu, so you cannot Tab through the content or away from the menu. Instead, the arrow keys navigate through a Menu's items.Here's when you might use other similar components from Headless UI: <Popover />. Popovers are general-purpose floating menus. They appear near the button that triggers them, and you can put arbitrary markup in them like images or non-clickable content. The Tab key navigates the contents of a Popover like it would any other normal markup. They're great for building header nav items with expandable content and flyout panels. <Disclosure />. Disclosures are useful for elements that expand to reveal additional information, like a toggleable FAQ section. They are typically rendered inline and reflow the document when they're shown or hidden. <Dialog />. Dialogs are meant to grab the user's full attention. They typically render a floating panel in the center of the screen, and use a backdrop to dim the rest of the application's contents. They also capture focus and prevent tabbing away from the Dialog's contents until the Dialog is dismissed. Component APIMenu PropDefaultDescriptionastemplateString | ComponentThe element or component the Menu should render as. Slot PropDescriptionopenBooleanWhether or not the Menu is open.close() => voidCloses the menu and refocuses MenuButton. MenuButton PropDefaultDescriptionasbuttonString | ComponentThe element or component the MenuButton should render as. Slot PropDescriptionopenBooleanWhether or not the Menu is open. MenuItems PropDefaultDescriptionasdivString | ComponentThe element or component the MenuItems should render as.staticfalseBooleanWhether the element should ignore the internally managed open/closed state.Note: static and unmount can not be used at the same time. You will get a TypeScript error if you try to do it.unmounttrueBooleanWhether the element should be unmounted or hidden based on the open/closed state.Note: static and unmount can not be used at the same time. You will get a TypeScript error if you try to do it. Slot PropDescriptionopenBooleanWhether or not the Menu is open. MenuItem PropDefaultDescriptionastemplateString | ComponentThe element or component the MenuItem should render as.disabledfalseBooleanWhether or not the item should be disabled for keyboard navigation and ARIA purposes. Slot PropDescriptionactiveBooleanWhether or not the item is the active/focused item in the list.disabledBooleanWhether or not the item is the disabled for keyboard navigation and ARIA purposes.close() => voidCloses the menu and refocuses MenuButton.Styled examplesIf you're interested in predesigned component examples using Headless UI and Tailwind CSS, check out Tailwind UI — a collection of beautifully designed and expertly crafted components built by us.It's a great way to support our work on open-source projects like this and makes it possible for us to improve them and keep them well-maintained.Explore more predesigned examples→'''
