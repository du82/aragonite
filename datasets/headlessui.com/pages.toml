description = "Completely unstyled, fully accessible UI components, designed to integrate beautifully with Tailwind CSS."
full_description = '''ReactVueComponentsDropdown MenuDisclosureDialogPopoverTabsTransitionFormsButtonCheckboxComboboxFieldsetInputListboxRadio GroupSelectSwitchTextareaListbox Listboxes are a great foundation for building custom, accessible select menus for your app, complete with robust support for keyboard navigation. PreviewCode InstallationTo get started, install Headless UI via npm:npm install @headlessui/reactBasic exampleListboxes are built using the Listbox, ListboxButton, ListboxSelectedOption, ListboxOptions, and ListboxOption components.The ListboxButton will automatically open/close the ListboxOptions when clicked, and when the listbox is open, the list of options receives focus and is automatically navigable via the keyboard.import { Listbox, ListboxButton, ListboxOption, ListboxOptions } from '@headlessui/react' import { useState } from 'react' const people = [ { id: 1, name: 'Durward Reynolds' }, { id: 2, name: 'Kenton Towne' }, { id: 3, name: 'Therese Wunsch' }, { id: 4, name: 'Benedict Kessler' }, { id: 5, name: 'Katelyn Rohan' }, ] function Example() { const [selectedPerson, setSelectedPerson] = useState(people[0]) return ( <Listbox value={selectedPerson} onChange={setSelectedPerson}> <ListboxButton>{selectedPerson.name}</ListboxButton> <ListboxOptions anchor="bottom"> {people.map((person) => ( <ListboxOption key={person.id} value={person} className="data-[focus]:bg-blue-100"> {person.name} </ListboxOption> ))} </ListboxOptions> </Listbox> ) }StylingHeadless UI keeps track of a lot of state about each component, like which listbox option is currently selected, whether a popover is open or closed, or which item in a menu is currently focused via the keyboard.But because the components are headless and completely unstyled out of the box, you can't see this information in your UI until you provide the styles you want for each state yourself.Using data attributesThe easiest way to style the different states of a Headless UI component is using the data-* attributes that each component exposes.For example, the ListboxOption component exposes a data-focus attribute, which tells you if the option is currently focused via the mouse or keyboard, and a data-selected attribute, which tells you if that option matches the current value of the Listbox.<!-- Rendered `ListboxOption` --> <div data-focus data-selected>Arlene Mccoy</div>Use the CSS attribute selector to conditionally apply styles based on the presence of these data attributes. If you're using Tailwind CSS, the data attribute modifier makes this easy:import { Listbox, ListboxButton, ListboxOption, ListboxOptions } from '@headlessui/react' import { CheckIcon } from '@heroicons/react/20/solid' import { useState } from 'react' const people = [ { id: 1, name: 'Durward Reynolds' }, { id: 2, name: 'Kenton Towne' }, { id: 3, name: 'Therese Wunsch' }, { id: 4, name: 'Benedict Kessler' }, { id: 5, name: 'Katelyn Rohan' }, ] function Example() { const [selectedPerson, setSelectedPerson] = useState(people[0]) return ( <Listbox value={selectedPerson} onChange={setSelectedPerson}> <ListboxButton>{selectedPerson.name}</ListboxButton> <ListboxOptions anchor="bottom"> {people.map((person) => ( <ListboxOption key={person.id} value={person} className="group flex gap-2 bg-white data-[focus]:bg-blue-100"> <CheckIcon className="invisible size-5 group-data-[selected]:visible" /> {person.name} </ListboxOption> ))} </ListboxOptions> </Listbox> ) } See the component API for a list of all the available data attributes.Using render propsEach component also exposes information about its current state via render props that you can use to conditionally apply different styles or render different content.For example, the ListboxOption component exposes a focus state, which tells you if the option is currently focused via the mouse or keyboard, and a selected state, which tells you if that option matches the current value of the Listbox.import { Listbox, ListboxButton, ListboxOption, ListboxOptions } from '@headlessui/react' import { CheckIcon } from '@heroicons/react/20/solid' import clsx from 'clsx' import { Fragment, useState } from 'react' const people = [ { id: 1, name: 'Durward Reynolds' }, { id: 2, name: 'Kenton Towne' }, { id: 3, name: 'Therese Wunsch' }, { id: 4, name: 'Benedict Kessler' }, { id: 5, name: 'Katelyn Rohan' }, ] function Example() { const [selectedPerson, setSelectedPerson] = useState(people[0]) return ( <Listbox value={selectedPerson} onChange={setSelectedPerson}> <ListboxButton>{selectedPerson.name}</ListboxButton> <ListboxOptions anchor="bottom"> {people.map((person) => ( <ListboxOption key={person.id} value={person} as={Fragment}> {({ focus, selected }) => ( <div className={clsx('flex gap-2', focus && 'bg-blue-100')}> <CheckIcon className={clsx('size-5', !selected && 'invisible')} /> {person.name} </div> )} </ListboxOption> ))} </ListboxOptions> </Listbox> ) } See the component API for a list of all the available render props.ExamplesAdding a labelWrap a Label and Listbox with the Field component to automatically associate them using a generated ID:import { Field, Label, Listbox, ListboxButton, ListboxOption, ListboxOptions } from '@headlessui/react' import { useState } from 'react' const people = [ { id: 1, name: 'Durward Reynolds' }, { id: 2, name: 'Kenton Towne' }, { id: 3, name: 'Therese Wunsch' }, { id: 4, name: 'Benedict Kessler' }, { id: 5, name: 'Katelyn Rohan' }, ] function Example() { const [selectedPerson, setSelectedPerson] = useState(people[0]) return ( <Field> <Label>Assignee:</Label> <Listbox value={selectedPerson} onChange={setSelectedPerson}> <ListboxButton>{selectedPerson.name}</ListboxButton> <ListboxOptions anchor="bottom"> {people.map((person) => ( <ListboxOption key={person.id} value={person} className="data-[focus]:bg-blue-100"> {person.name} </ListboxOption> ))} </ListboxOptions> </Listbox> </Field> ) } Adding a descriptionUse the Description component within a Field to automatically associate it with a Listbox using the aria-describedby attribute:import { Description, Field, Label, Listbox, ListboxButton, ListboxOption, ListboxOptions } from '@headlessui/react' import { useState } from 'react' const people = [ { id: 1, name: 'Durward Reynolds' }, { id: 2, name: 'Kenton Towne' }, { id: 3, name: 'Therese Wunsch' }, { id: 4, name: 'Benedict Kessler' }, { id: 5, name: 'Katelyn Rohan' }, ] function Example() { const [selectedPerson, setSelectedPerson] = useState(people[0]) return ( <Field> <Label>Assignee:</Label> <Description>This person will have full access to this project.</Description> <Listbox value={selectedPerson} onChange={setSelectedPerson}> <ListboxButton>{selectedPerson.name}</ListboxButton> <ListboxOptions anchor="bottom"> {people.map((person) => ( <ListboxOption key={person.id} value={person} className="data-[focus]:bg-blue-100"> {person.name} </ListboxOption> ))} </ListboxOptions> </Listbox> </Field> ) } Disabling a listboxAdd the disabled prop to the Field component to disable a Listbox and its associated Label and Description:import { Description, Field, Label, Listbox, ListboxButton, ListboxOption, ListboxOptions } from '@headlessui/react' import { useState } from 'react' const people = [ { id: 1, name: 'Durward Reynolds' }, { id: 2, name: 'Kenton Towne' }, { id: 3, name: 'Therese Wunsch' }, { id: 4, name: 'Benedict Kessler' }, { id: 5, name: 'Katelyn Rohan' }, ] function Example() { const [selectedPerson, setSelectedPerson] = useState(people[0]) return ( <Field disabled> <Label>Assignee:</Label> <Description>This person will have full access to this project.</Description> <Listbox value={selectedPerson} onChange={setSelectedPerson}> <ListboxButton>{selectedPerson.name}</ListboxButton> <ListboxOptions anchor="bottom"> {people.map((person) => ( <ListboxOption key={person.id} value={person} className="data-[focus]:bg-blue-100"> {person.name} </ListboxOption> ))} </ListboxOptions> </Listbox> </Field> ) } You can also disable a listbox outside of a Field by adding the disabled prop directly to the Listbox itself.Disabling a listbox optionUse the disabled prop to disable a ListboxOption and prevent it from being selected:import { Listbox, ListboxButton, ListboxOption, ListboxOptions } from '@headlessui/react' import { useState } from 'react' const people = [ { id: 1, name: 'Durward Reynolds', available: true }, { id: 2, name: 'Kenton Towne', available: true }, { id: 3, name: 'Therese Wunsch', available: true }, { id: 4, name: 'Benedict Kessler', available: false }, { id: 5, name: 'Katelyn Rohan', available: true }, ] function Example() { const [selectedPerson, setSelectedPerson] = useState(people[0]) return ( <Listbox value={selectedPerson} onChange={setSelectedPerson}> <ListboxButton>{selectedPerson.name}</ListboxButton> <ListboxOptions anchor="bottom"> {people.map((person) => ( <ListboxOption key={person.id} value={person} disabled={!person.available} className="data-[focus]:bg-blue-100 data-[disabled]:opacity-50" > {person.name} </ListboxOption> ))} </ListboxOptions> </Listbox> ) } Using with HTML formsIf you add the name prop to your Listbox, a hidden input element will be rendered and kept in sync with the listbox state.import { Field, Label, Listbox, ListboxButton, ListboxOption, ListboxOptions } from '@headlessui/react' import { useState } from 'react' const people = [ { id: 1, name: 'Durward Reynolds' }, { id: 2, name: 'Kenton Towne' }, { id: 3, name: 'Therese Wunsch' }, { id: 4, name: 'Benedict Kessler' }, { id: 5, name: 'Katelyn Rohan' }, ] function Example() { const [selectedPerson, setSelectedPerson] = useState(people[0]) return ( <form action="/projects/1" method="post"> <Field> <Label>Assignee:</Label> <Listbox name="assignee" value={selectedPerson} onChange={setSelectedPerson}> <ListboxButton>{selectedPerson.name}</ListboxButton> <ListboxOptions anchor="bottom"> {people.map((person) => ( <ListboxOption key={person.id} value={person} className="data-[focus]:bg-blue-100"> {person.name} </ListboxOption> ))} </ListboxOptions> </Listbox> </Field> <button>Submit</button> </form> ) } This lets you use a listbox inside a native HTML <form> and make traditional form submissions as if your listbox was a native HTML form control.Basic values like strings will be rendered as a single hidden input containing that value, but complex values like objects will be encoded into multiple inputs using a square bracket notation for the names:<!-- Rendered hidden inputs --> <input type="hidden" name="assignee[id]" value="1" /> <input type="hidden" name="assignee[name]" value="Durward Reynolds" />Using as uncontrolledIf you omit the value prop, Headless UI will track its state internally for you, allowing you to use it as an uncontrolled component.When uncontrolled, use the defaultValue prop to provide an initial value to the Listbox.import { Field, Label, Listbox, ListboxButton, ListboxOption, ListboxOptions } from '@headlessui/react' const people = [ { id: 1, name: 'Durward Reynolds' }, { id: 2, name: 'Kenton Towne' }, { id: 3, name: 'Therese Wunsch' }, { id: 4, name: 'Benedict Kessler' }, { id: 5, name: 'Katelyn Rohan' }, ] function Example() { return ( <form action="/projects/1" method="post"> <Field> <Label>Assignee:</Label> <Listbox name="assignee" defaultValue={people[0]}> <ListboxButton>{({ value }) => value.name}</ListboxButton> <ListboxOptions anchor="bottom"> {people.map((person) => ( <ListboxOption key={person.id} value={person} className="data-[focus]:bg-blue-100"> {person.name} </ListboxOption> ))} </ListboxOptions> </Listbox> </Field> <button>Submit</button> </form> ) } This can simplify your code when using the listbox with HTML forms or with form APIs that collect their state using FormData instead of tracking it using React state.Any onChange prop you provide will still be called when the component's value changes in case you need to run any side effects, but you won't need to use it to track the component's state yourself.Setting the dropdown widthThe ListboxOptions dropdown has no width set by default, but you can add one using CSS:import { Listbox, ListboxButton, ListboxOption, ListboxOptions } from '@headlessui/react' import { useState } from 'react' const people = [ { id: 1, name: 'Durward Reynolds' }, { id: 2, name: 'Kenton Towne' }, { id: 3, name: 'Therese Wunsch' }, { id: 4, name: 'Benedict Kessler' }, { id: 5, name: 'Katelyn Rohan' }, ] function Example() { const [selectedPerson, setSelectedPerson] = useState(people[0]) return ( <Listbox value={selectedPerson} onChange={setSelectedPerson}> <ListboxButton>{selectedPerson.name}</ListboxButton> <ListboxOptions anchor="bottom" className="w-52"> {people.map((person) => ( <ListboxOption key={person.id} value={person} className="data-[focus]:bg-blue-100"> {person.name} </ListboxOption> ))} </ListboxOptions> </Listbox> ) } If you'd like the dropdown width to match the ListboxButton width, use the --button-width CSS variable that's exposed on the ListboxOptions element:import { Listbox, ListboxButton, ListboxOption, ListboxOptions } from '@headlessui/react' import { useState } from 'react' const people = [ { id: 1, name: 'Durward Reynolds' }, { id: 2, name: 'Kenton Towne' }, { id: 3, name: 'Therese Wunsch' }, { id: 4, name: 'Benedict Kessler' }, { id: 5, name: 'Katelyn Rohan' }, ] function Example() { const [selectedPerson, setSelectedPerson] = useState(people[0]) return ( <Listbox value={selectedPerson} onChange={setSelectedPerson}> <ListboxButton>{selectedPerson.name}</ListboxButton> <ListboxOptions anchor="bottom" className="w-[var(--button-width)]"> {people.map((person) => ( <ListboxOption key={person.id} value={person} className="data-[focus]:bg-blue-100"> {person.name} </ListboxOption> ))} </ListboxOptions> </Listbox> ) } Positioning the dropdownAdd the anchor prop to the ListboxOptions to automatically position the dropdown relative to the ListboxButton:import { Listbox, ListboxButton, ListboxOption, ListboxOptions } from '@headlessui/react' import { useState } from 'react' const people = [ { id: 1, name: 'Durward Reynolds' }, { id: 2, name: 'Kenton Towne' }, { id: 3, name: 'Therese Wunsch' }, { id: 4, name: 'Benedict Kessler' }, { id: 5, name: 'Katelyn Rohan' }, ] function Example() { const [selectedPerson, setSelectedPerson] = useState(people[0]) return ( <Listbox value={selectedPerson} onChange={setSelectedPerson}> <ListboxButton>{selectedPerson.name}</ListboxButton> <ListboxOptions anchor="bottom start"> {people.map((person) => ( <ListboxOption key={person.id} value={person} className="data-[focus]:bg-blue-100"> {person.name} </ListboxOption> ))} </ListboxOptions> </Listbox> ) } Use the values top, right, bottom, or left to center the dropdown along the appropriate edge, or combine it with start or end to align the dropdown to a specific corner, such as top start or bottom end.To control the gap between the button and the dropdown, use the --anchor-gap CSS variable:import { Listbox, ListboxButton, ListboxOption, ListboxOptions } from '@headlessui/react' import { useState }'''
