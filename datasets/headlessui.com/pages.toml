title = "Select - Headless UI"
description = "Completely unstyled, fully accessible UI components, designed to integrate beautifully with Tailwind CSS."
full_description = '''ReactVueComponentsDropdown MenuDisclosureDialogPopoverTabsTransitionFormsButtonCheckboxComboboxFieldsetInputListboxRadio GroupSelectSwitchTextareaSelect A light wrapper around the native select element that handles tedious accessibility concerns and provides more opinionated states for things like hover and focus. PreviewCode InstallationTo get started, install Headless UI via npm:npm install @headlessui/reactBasic exampleSelect controls are built using the Select component:import { Select } from '@headlessui/react' function Example() { return ( <Select name="status" aria-label="Project status"> <option value="active">Active</option> <option value="paused">Paused</option> <option value="delayed">Delayed</option> <option value="canceled">Canceled</option> </Select> ) }You can pass any props to a Select that you'd normally pass to the native select element.StylingHeadless UI keeps track of a lot of state about each component, like whether or not a select is focused, whether a popover is open or closed, or which item in a menu is currently focused via the keyboard.But because the components are headless and completely unstyled out of the box, you can't see this information in your UI until you provide the styles you want for each state yourself.Using data attributesThe easiest way to style the different states of a Headless UI component is using the data-* attributes that each component exposes.For example, the Select component exposes a data-focus attribute, which tells you if the select is currently focused via keyboard, and a data-hover attribute, which tells you if the select is currently being hovered by the mouse.<!-- Rendered `Select` --> <select name="status" data-focus data-hover> <option value="active">Active</option> <option value="paused">Paused</option> <option value="delayed">Delayed</option> <option value="canceled">Canceled</option> </select>Use the CSS attribute selector to conditionally apply styles based on the presence of these data attributes. If you're using Tailwind CSS, the data attribute modifier makes this easy:import { Select } from '@headlessui/react' function Example() { return ( <Select name="status" className="border data-[hover]:shadow data-[focus]:bg-blue-100" aria-label="Project status"> <option value="active">Active</option> <option value="paused">Paused</option> <option value="delayed">Delayed</option> <option value="canceled">Canceled</option> </Select> ) } See the component API for a list of all the available data attributes.Using render propsEach component also exposes information about its current state via render props that you can use to conditionally apply different styles or render different content.For example, the Select component exposes a focus state, which tells you if the select is currently focused via the keyboard, and a hover state, which tells you if the select is currently being hovered by the mouse.import { Select } from '@headlessui/react' import clsx from 'clsx' import { Fragment } from 'react' function Example() { return ( <Select name="status" as={Fragment}> {({ focus, hover }) => ( <select className={clsx('border', focus && 'bg-blue-100', hover && 'shadow')} aria-label="Project status"> <option value="active">Active</option> <option value="paused">Paused</option> <option value="delayed">Delayed</option> <option value="canceled">Canceled</option> </select> )} </Select> ) } See the component API for a list of all the available render props.ExamplesAdding a labelWrap a Label and Select with the Field component to automatically associate them using a generated ID:import { Field, Label, Select } from '@headlessui/react' function Example() { return ( <Field> <Label>Project status</Label> <Select name="status"> <option value="active">Active</option> <option value="paused">Paused</option> <option value="delayed">Delayed</option> <option value="canceled">Canceled</option> </Select> </Field> ) } Adding a descriptionUse the Description component within a Field to automatically associate it with a Select using the aria-describedby attribute:import { Description, Field, Label, Select } from '@headlessui/react' function Example() { return ( <Field> <Label>Project status</Label> <Description>This will be visible to clients on the project.</Description> <Select name="status"> <option value="active">Active</option> <option value="paused">Paused</option> <option value="delayed">Delayed</option> <option value="canceled">Canceled</option> </Select> </Field> ) } Disabling a selectAdd the disabled prop to the Field component to disable a Select and its associated Label and Description:import { Description, Field, Label, Select } from '@headlessui/react' function Example() { return ( <Field disabled> <Label className="data-[disabled]:opacity-50">Project status</Label> <Description className="data-[disabled]:opacity-50">This will be visible to clients on the project.</Description> <Select name="status" className="data-[disabled]:bg-gray-100"> <option value="active">Active</option> <option value="paused">Paused</option> <option value="delayed">Delayed</option> <option value="canceled">Canceled</option> </Select> </Field> ) } You can also disable a select outside of a Field by adding the disabled prop directly to the Select itself.Component APISelectA thin wrapper around the native select element. PropDefaultDescriptionasselectString | ComponentThe element or component the select should render as.invalidfalseBooleanWhether or not the select is invalid.disabledfalseBooleanWhether or not the select is disabled.autoFocusfalseBooleanWhether or not the select should receive focus when first rendered. Data AttributeRender PropDescriptiondata-invalidinvalidBooleanWhether or not the select is invalid.data-disableddisabledBooleanWhether or not the select is disabled.data-focusfocusBooleanWhether or not the select is focused.data-hoverhoverBooleanWhether or not the select is hovered.data-activeactiveBooleanWhether or not the select is in an active or pressed state.data-autofocusautofocusBooleanWhether or not the autoFocus prop was set to true. Field Groups a Label, Description, and form control together.PropDefaultDescriptionasdivString | ComponentThe element or component the field should render as.disabledfalseBooleanWhether or not the field is disabled.Data AttributeRender PropDescriptiondata-disableddisabledBooleanWhether or not the field is disabled. Label The Label component labels a form control.PropDefaultDescriptionaslabelString | ComponentThe element or component the label should render as.passivefalseBooleanWhen true, clicking the label won't focus the associated form control.Data AttributeRender PropDescriptiondata-disableddisabledBooleanWhether or not the parent Field is disabled. Description The Description component describes a form control.PropDefaultDescriptionaspString | ComponentThe element or component the description should render as.Data AttributeRender PropDescriptiondata-disableddisabledBooleanWhether or not the parent Field is disabled. Styled examplesIf you're interested in predesigned Tailwind CSS select menu examples, check out Tailwind Plus — a collection of beautifully designed and expertly crafted components built by us.It's a great way to support our work on open-source projects like this and makes it possible for us to improve them and keep them well-maintained.Explore more predesigned examples →On this pageInstallationBasic exampleStylingUsing data attributesUsing render propsExamplesAdding a labelAdding a descriptionDisabling a selectComponent APISelectFieldLabelDescriptionStyled examples'''
