title = "Transition - Headless UI"
description = "Completely unstyled, fully accessible UI components, designed to integrate beautifully with Tailwind CSS."
full_description = '''ReactVueComponentsDropdown MenuDisclosureDialogPopoverTabsTransitionFormsButtonCheckboxComboboxFieldsetInputListboxRadio GroupSelectSwitchTextareaTransition Control the transition styles of conditionally rendered elements, including nested child transitions, using CSS classes. PreviewCode InstallationTo get started, install Headless UI via npm:npm install @headlessui/reactBasic exampleTo transition a conditionally rendered element, wrap it in the Transition component and use the show prop to indicate whether it is open or closed.Then, use native CSS transition styles to apply an animation, specifying the element's closed styles by targeting the data-closed attribute that the Transition component exposes.import { Transition } from '@headlessui/react' import { useState } from 'react' function Example() { const [open, setOpen] = useState(false) return ( <> <button onClick={() => setOpen((open) => !open)}>Toggle</button> <Transition show={open}> <div className="transition duration-300 ease-in data-[closed]:opacity-0">I will fade in and out</div> </Transition> </> ) }Styles defined with the data-closed attribute will be used as the starting point when transitioning in as well as the ending point when transitioning out.For more complex transitions, you can also use the data-enter, data-leave, and data-transition attributes to apply styles at the different stages of the transition.ExamplesDifferent enter/leave transitionsUse the data-enter and data-leave attributes to apply different transition styles when entering and leaving:import { Transition } from '@headlessui/react' import clsx from 'clsx' import { useState } from 'react' function Example() { const [open, setOpen] = useState(false) return ( <div className="relative"> <button onClick={() => setOpen((open) => !open)}>Toggle</button> <Transition show={open}> <div className={clsx([ // Base styles 'absolute w-48 border transition ease-in-out', // Shared closed styles 'data-[closed]:opacity-0', // Entering styles 'data-[enter]:duration-100 data-[enter]:data-[closed]:-translate-x-full', // Leaving styles 'data-[leave]:duration-300 data-[leave]:data-[closed]:translate-x-full', ])} > I will enter from the left and leave to the right </div> </Transition> </div> ) }This example combines the data-enter and data-closed attributes to specify the starting point of the enter transition, and combines the data-leave and data-closed attributes to specify the ending point of the leave transition.It also uses the data-enter and data-leave attributes to specify different enter and leave durations.Coordinating multiple transitionsSometimes you need to transition multiple elements with different animations but all based on the same state. For example, say the user clicks a button to open a sidebar that slides over the screen, and you also need to fade-in a backdrop at the same time.You can do this by wrapping the related elements with a parent Transition component, and wrapping each child that needs its own transition styles with a TransitionChild component, which will automatically communicate with the parent Transition and inherit the parent's open state.import { Transition, TransitionChild } from '@headlessui/react' import { useState } from 'react' function Example() { const [open, setOpen] = useState(false) return ( <> <button onClick={() => setOpen(true)}>Open</button> {/* The `show` prop controls all nested `TransitionChild` components. */} <Transition show={open}> {/* Backdrop */} <TransitionChild> <div className="fixed inset-0 bg-black/30 transition duration-300 data-[closed]:opacity-0" onClick={() => setOpen(false)} /> </TransitionChild> {/* Slide-in sidebar */} <TransitionChild> <div className="fixed inset-y-0 left-0 w-64 bg-white transition duration-300 data-[closed]:-translate-x-full"> {/* ... */} </div> </TransitionChild> </Transition> </> ) } The TransitionChild component has the exact same API as the Transition component, but with no show prop, since the show value is controlled by the parent.Parent Transition components will always automatically wait for all children to finish transitioning before unmounting, so you don't need to manage any of that timing yourself.Transitioning on initial mountIf you want an element to transition the very first time it's rendered, set the appear prop to true.This is useful if you want something to transition in on initial page load, or when its parent is conditionally rendered.import { Transition } from '@headlessui/react' import { useState } from 'react' function Example() { const [open, setOpen] = useState(true) return ( <> <button onClick={() => setOpen((open) => !open)}>Toggle</button> <Transition show={open} appear={true}> <div className="transition duration-300 ease-in data-[closed]:opacity-0">I will fade in on initial render</div> </Transition> </> ) } Component APITransition PropDefaultDescriptionasFragmentString | ComponentThe element or component the transition should render as.show—BooleanWhether the children should be shown or hidden.appearfalseBooleanWhether the transition should run on initial mount.unmounttrueBooleanWhether the element should be unmounted or hidden based on the show state.beforeEnter—() => voidCallback which is called before we start the enter transition.afterEnter—() => voidCallback which is called after we finished the enter transition.beforeLeave—() => voidCallback which is called before we start the leave transition.afterLeave—() => voidCallback which is called after we finished the leave transition. TransitionChild PropDefaultDescriptionasFragmentString | ComponentThe element or component the transition child should render as.appearfalseBooleanWhether the transition should run on initial mount.unmounttrueBooleanWhether the element should be unmounted or hidden based on the show state.beforeEnter—() => voidCallback which is called before we start the enter transition.afterEnter—() => voidCallback which is called after we finished the enter transition.beforeLeave—() => voidCallback which is called before we start the leave transition.afterLeave—() => voidCallback which is called after we finished the leave transition. Data attributes AttributeDescriptiondata-closedPresent before transitioning in, and when transitioning out.data-enterPresent when transitioning in.data-leavePresent when transitioning out.data-transitionPresent when transitioning in or out. Styled examplesIf you're interested in predesigned Tailwind CSS component examples using Headless UI, check out Tailwind Plus — a collection of beautifully designed and expertly crafted components built by us.It's a great way to support our work on open-source projects like this and makes it possible for us to improve them and keep them well-maintained.Explore more predesigned examples →On this pageInstallationBasic exampleExamplesDifferent enter/leave transitionsCoordinating multiple transitionsTransitioning on initial mountComponent APITransitionTransitionChildData attributesStyled examples'''
