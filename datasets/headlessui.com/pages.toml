["https://headlessui.com/react/fieldset"]
title = "Fieldset - Headless UI"
description = "Completely unstyled, fully accessible UI components, designed to integrate beautifully with Tailwind CSS."
full_description = '''ReactVueComponentsDropdown MenuDisclosureDialogPopoverTabsTransitionFormsButtonCheckboxComboboxFieldsetInputListboxRadio GroupSelectSwitchTextareaFieldset Group a set of form controls together with these fully accessible but much easier-to-style versions of the native fieldset and legend elements. PreviewCode InstallationTo get started, install Headless UI via npm:npm install @headlessui/reactBasic exampleUse the Fieldset and Legend components to group a set of form controls together with a title:import { Field, Fieldset, Input, Label, Legend, Select, Textarea } from '@headlessui/react' function Example() { return ( <Fieldset className="space-y-8"> <Legend className="text-lg font-bold">Shipping details</Legend> <Field> <Label className="block">Street address</Label> <Input className="mt-1 block" name="address" /> </Field> <Field> <Label className="block">Country</Label> <Select className="mt-1 block" name="country"> <option>Canada</option> <option>Mexico</option> <option>United States</option> </Select> </Field> <Field> <Label className="block">Delivery notes</Label> <Textarea className="mt-1 block" name="notes" /> </Field> </Fieldset> ) }Since the native HTML <legend> element is difficult to style, the Legend component is rendered as a <div>. The <Fieldset> component uses the native <fieldset> component.StylingHeadless UI keeps track of a lot of state about each component, like whether or not a fieldset is disabled, whether a popover is open or closed, or which item in a menu is currently focused via the keyboard.But because the components are headless and completely unstyled out of the box, you can't see this information in your UI until you provide the styles you want for each state yourself.Using data attributesThe easiest way to style the different states of a Headless UI component is using the data-* attributes that each component exposes.For example, both the Fieldset and Legend components expose a data-disabled attribute, which tells you if the fieldset is currently disabled.<!-- Rendered `Fieldset` and `Legend` --> <fieldset aria-labelledby="..." disabled data-disabled> <div id="..." data-disabled>Shipping details</div> <!-- ... --> </fieldset>Use the CSS attribute selector to conditionally apply styles based on the presence of these data attributes. If you're using Tailwind CSS, the data attribute modifier makes this easy:import { Fieldset, Legend } from '@headlessui/react' function Example() { return ( <Fieldset disabled className="space-y-8 data-[disabled]:opacity-50"> <Legend className="text-lg font-bold">Shipping details</Legend> {/* ... */} </Fieldset> ) } See the component API for a list of all the available data attributes.Using render propsEach component also exposes information about its current state via render props that you can use to conditionally apply different styles or render different content.For example, both the Fieldset and Legend components expose a disabled state, which tells you if the fieldset is currently disabled.import { Fieldset, Legend } from '@headlessui/react' import clsx from 'clsx' import { Fragment } from 'react' function Example() { return ( <Fieldset disabled as={Fragment}> {({ disabled }) => ( <div className={clsx('space-y-8', disabled && 'opacity-50')}> <Legend className="text-lg font-bold">Shipping details</Legend> {/* ... */} </div> )} </Fieldset> ) } See the component API for a list of all the available render props.ExamplesDisabling a fieldsetAdd the disabled prop to a Fieldset component to disable the entire fieldset:import { Fieldset, Legend } from '@headlessui/react' function Example() { return ( <Fieldset disabled> <Legend>Shipping details</Legend> {/* ... */} </Fieldset> ) } Component APIFieldsetGroup a set of form controls together with a title. PropDefaultDescriptionasfieldsetString | ComponentThe element or component the fieldset should render as.disabledfalseBooleanUse this to disable all form controls in the fieldset. Data AttributeRender PropDescriptiondata-disableddisabledBooleanWhether or not the fieldset is disabled. LegendThe title for a Fieldset. PropDefaultDescriptionasdivString | ComponentThe element or component the legend should render as. Data AttributeRender PropDescriptiondata-disableddisabledBooleanWhether or not the legend is disabled. Styled examplesIf you're interested in predesigned Tailwind CSS form layout examples, check out Tailwind Plus — a collection of beautifully designed and expertly crafted components built by us.It's a great way to support our work on open-source projects like this and makes it possible for us to improve them and keep them well-maintained.Explore more predesigned examples →On this pageInstallationBasic exampleStylingUsing data attributesUsing render propsExamplesDisabling a fieldsetComponent APIFieldsetLegendStyled examples'''
year_published = 2025
