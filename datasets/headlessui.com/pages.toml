["https://headlessui.com/react/checkbox"]
title = "Checkbox - Headless UI"
description = "Completely unstyled, fully accessible UI components, designed to integrate beautifully with Tailwind CSS."
full_description = '''ReactVueComponentsDropdown MenuDisclosureDialogPopoverTabsTransitionFormsButtonCheckboxComboboxFieldsetInputListboxRadio GroupSelectSwitchTextareaCheckbox Checkboxes provide the same functionality as native HTML checkboxes, without any of the styling, giving you a clean slate to design them however you'd like. PreviewCode InstallationTo get started, install Headless UI via npm:npm install @headlessui/reactBasic exampleCheckboxes are built using the Checkbox component. You can toggle your checkbox by clicking directly on the component, or by pressing the spacebar while it's focused.Toggling the checkbox calls the onChange function with the new checked value.import { Checkbox } from '@headlessui/react' import { useState } from 'react' function Example() { const [enabled, setEnabled] = useState(false) return ( <Checkbox checked={enabled} onChange={setEnabled} className="group block size-4 rounded border bg-white data-[checked]:bg-blue-500" > {/* Checkmark icon */} <svg className="stroke-white opacity-0 group-data-[checked]:opacity-100" viewBox="0 0 14 14" fill="none"> <path d="M3 8L6 11L11 3.5" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round" /> </svg> </Checkbox> ) }StylingHeadless UI keeps track of a lot of state about each component, like whether or not a checkbox is checked, whether a popover is open or closed, or which item in a menu is currently focused via the keyboard.But because the components are headless and completely unstyled out of the box, you can't see this information in your UI until you provide the styles you want for each state yourself.Using data attributesThe easiest way to style the different states of a Headless UI component is using the data-* attributes that each component exposes.For example, the Checkbox component exposes a data-checked attribute, which tells you if the checkbox is currently checked, and a data-disabled attribute, which tells you if the checkbox is currently disabled.<!-- Rendered `Checkbox` --> <span role="checkbox" data-checked data-disabled> <!-- ... --> </span>Use the CSS attribute selector to conditionally apply styles based on the presence of these data attributes. If you're using Tailwind CSS, the data attribute modifier makes this easy:import { Checkbox } from '@headlessui/react' import { useState } from 'react' function Example() { const [enabled, setEnabled] = useState(false) return ( <Checkbox checked={enabled} onChange={setEnabled} className="group block size-4 rounded border bg-white data-[checked]:bg-blue-500 data-[disabled]:cursor-not-allowed data-[disabled]:opacity-50 data-[checked]:data-[disabled]:bg-gray-500" > <svg className="stroke-white opacity-0 group-data-[checked]:opacity-100" viewBox="0 0 14 14" fill="none"> <path d="M3 8L6 11L11 3.5" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round" /> </svg> </Checkbox> ) } See the component API for a list of all the available data attributes.Using render propsEach component also exposes information about its current state via render props that you can use to conditionally apply different styles or render different content.For example, the Checkbox component exposes a checked state, which tells you if the checkbox is currently checked, and a disabled state, which tells you if the checkbox is currently disabled.import { Checkbox } from '@headlessui/react' import clsx from 'clsx' import { Fragment, useState } from 'react' function Example() { const [enabled, setEnabled] = useState(false) return ( <Checkbox checked={enabled} onChange={setEnabled} as={Fragment}> {({ checked, disabled }) => ( <span className={clsx( 'block size-4 rounded border', !checked && 'bg-white', checked && !disabled && 'bg-blue-500', checked && disabled && 'bg-gray-500', disabled && 'cursor-not-allowed opacity-50' )} > <svg className={clsx('stroke-white', checked ? 'opacity-100' : 'opacity-0')} viewBox="0 0 14 14" fill="none"> <path d="M3 8L6 11L11 3.5" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round" /> </svg> </span> )} </Checkbox> ) } See the component API for a list of all the available render props.ExamplesAdding a labelWrap a Label and Checkbox with the Field component to automatically associate them using a generated ID:import { useState } from 'react' import { Checkbox, Field, Label } from '@headlessui/react' function Example() { const [enabled, setEnabled] = useState(false) return ( <Field className="flex items-center gap-2"> <Checkbox checked={enabled} onChange={setEnabled} className="group block size-4 rounded border bg-white data-[checked]:bg-blue-500" > <svg className="stroke-white opacity-0 group-data-[checked]:opacity-100" viewBox="0 0 14 14" fill="none"> <path d="M3 8L6 11L11 3.5" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round" /> </svg> </Checkbox> <Label>Enable beta features</Label> </Field> ) } By default, clicking the Label will toggle the Checkbox, just like labels do for native HTML checkboxes. If you'd like to make the Label non-clickable, you can add a passive prop to the Label component:<Label passive>Enable beta features</Label>Adding a descriptionUse the Description component within a Field to automatically associate it with a Checkbox using the aria-describedby attribute:import { Checkbox, Description, Field, Label } from '@headlessui/react' import { useState } from 'react' function Example() { const [enabled, setEnabled] = useState(false) return ( <Field> <Label>Enable beta features</Label> <Description>This will give you early access to new features we're developing.</Description> <Checkbox checked={enabled} onChange={setEnabled} className="group block size-4 rounded border bg-white data-[checked]:bg-blue-500" > <svg className="stroke-white opacity-0 group-data-[checked]:opacity-100" viewBox="0 0 14 14" fill="none"> <path d="M3 8L6 11L11 3.5" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round" /> </svg> </Checkbox> </Field> ) } Disabling a checkboxAdd the disabled prop to the Field component to disable a Checkbox and its associated Label and Description:import { Checkbox, Description, Field, Label } from '@headlessui/react' import { useState } from 'react' function Example() { const [enabled, setEnabled] = useState(false) return ( <Field disabled> <Label className="data-[disabled]:opacity-50">Enable beta features</Label> <Description className="data-[disabled]:opacity-50"> This will give you early access to new features we're developing. </Description> <Checkbox checked={enabled} onChange={setEnabled} className="group block size-4 rounded border bg-white data-[checked]:bg-blue-500 data-[disabled]:cursor-not-allowed data-[disabled]:opacity-50 data-[checked]:data-[disabled]:bg-gray-500" > <svg className="stroke-white opacity-0 group-data-[checked]:opacity-100" viewBox="0 0 14 14" fill="none"> <path d="M3 8L6 11L11 3.5" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round" /> </svg> </Checkbox> </Field> ) } You can also disable a checkbox outside of a Field by adding the disabled prop directly to the Checkbox itself.Using with HTML formsIf you add the name prop to your Checkbox, a hidden input element will be rendered and kept in sync with the checkbox state.import { Checkbox } from '@headlessui/react' import { useState } from 'react' function Example() { const [enabled, setEnabled] = useState(false) return ( <form action="/accounts" method="post"> <Checkbox checked={enabled} onChange={setEnabled} name="terms-of-service" className="group block size-4 rounded border bg-white data-[checked]:bg-blue-500" > <svg className="stroke-white opacity-0 group-data-[checked]:opacity-100" viewBox="0 0 14 14" fill="none"> <path d="M3 8L6 11L11 3.5" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round" /> </svg> </Checkbox> <button>Submit</button> </form> ) } This lets you use a checkbox inside a native HTML <form> and make traditional form submissions as if your checkbox was a native HTML form control.By default, the value will be on when the checkbox is checked, and not present when the checkbox is unchecked.<!-- Rendered hidden input --> <input type="hidden" name="terms-of-service" value="on" />You can customize the value if needed by using the value prop:import { Checkbox } from '@headlessui/react' import { useState } from 'react' function Example() { const [enabled, setEnabled] = useState(false) return ( <form action="/accounts" method="post"> <Checkbox checked={enabled} onChange={setEnabled} name="terms-of-service" value="accept" className="group block size-4 rounded border bg-white data-[checked]:bg-blue-500" > <svg className="stroke-white opacity-0 group-data-[checked]:opacity-100" viewBox="0 0 14 14" fill="none"> <path d="M3 8L6 11L11 3.5" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round" /> </svg> </Checkbox> <button>Submit</button> </form> ) } The hidden input will then use your custom value when the checkbox is checked:<!-- Rendered hidden input --> <input type="hidden" name="terms-of-service" value="accept" />Basic values like strings will be rendered as a single hidden input containing that value, but complex values like objects will be encoded into multiple inputs using a square bracket notation for the names.Using as uncontrolledIf you omit the checked prop, Headless UI will track its state internally for you, allowing you to use it as an uncontrolled component.When uncontrolled, you can check the Checkbox by default using the defaultChecked prop.import { Checkbox } from '@headlessui/react' function Example() { return ( <form action="/accounts" method="post"> <Checkbox defaultChecked={true} name="terms-of-service" className="group block size-4 rounded border bg-white data-[checked]:bg-blue-500" > <svg className="stroke-white opacity-0 group-data-[checked]:opacity-100" viewBox="0 0 14 14" fill="none"> <path d="M3 8L6 11L11 3.5" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round" /> </svg> </Checkbox> <button>Submit</button> </form> ) } This can simplify your code when using the checkbox with HTML forms or with form APIs that collect their state using FormData instead of tracking it using React state.Any onChange prop you provide will still be called when the component's value changes in case you need to run any side effects, but you won't need to use it to track the component's state yourself.Adding transitionsBecause checkboxes are typically always rendered to the DOM (rather than being mounted/unmounted like other components), simple CSS transitions are often enough to animate your checkbox:import { Checkbox } from '@headlessui/react' import { useState } from 'react' function Example() { const [enabled, setEnabled] = useState(false) return ( <Checkbox checked={enabled} onChange={setEnabled} className="group block size-4 rounded border bg-white transition data-[checked]:bg-blue-500" > <svg className="stroke-white opacity-0 transition group-data-[checked]:opacity-100" viewBox="0 0 14 14" fill="none" > <path d="M3 8L6 11L11 3.5" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round" /> </svg> </Checkbox> ) } Because they're renderless, Headless UI components also compose well with other animation libraries in the React ecosystem like Framer Motion and React Spring.Rendering as different elementThe Checkbox component renders a span by default. Use the as prop to render the component as a different element or as your own custom component.import { Checkbox } from '@headlessui/react' import { useState } from 'react' function Example() { const [enabled, setEnabled] = useState(false) return ( <Checkbox as="div" checked={enabled} onChange={setEnabled} className="group block size-4 rounded border bg-white data-[checked]:bg-blue-500" > <svg className="stroke-white opacity-0 group-data-[checked]:opacity-100" viewBox="0 0 14 14" fill="none"> <path d="M3 8L6 11L11 3.5" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round" /> </svg> </Checkbox> ) } Keyboard interaction CommandDescriptionSpacewhen a Checkbox is focusedToggles the CheckboxEnterwhen a Checkbox is focusedSubmit the parent form if it exists Component APICheckbox PropDefaultDescriptionasspanString | ComponentThe element or component the checkbox should render as.checked—BooleanWhether or not the checkbox is checked.defaultChecked—TThe default checked value when using as an uncontrolled component.onChange—(value: Boolean) => voidThe function to call when the checkbox is toggled.indeterminate—BooleanWhether or not the checkbox is indeterminate.disabledfalseBooleanWhether or not the checkbox is disabled.autoFocusfalseBooleanWhether or not the checkbox should receive focus when first rendered.name—StringThe name used when using the checkbox inside a form.form—StringThe id of the form that the checkbox belongs to.If name is provided but form is not, the checkbox will add its state to the nearest ancestor form element.value—StringThe value used when using this component inside a form, if it is checked. Data AttributeRender PropDescriptiondata-checkedcheckedBooleanWhether or not the checkbox is checked.data-indeterminateindeterminateBooleanWhether or not the checkbox is indeterminate.data-disableddisabledBooleanWhether or not the checkbox is disabled.data-focusfocusBooleanWhether or not the checkbox is focused.data-hoverhoverBooleanWhether or not the checkbox is hovered.data-activeactiveBooleanWhether or not the checkbox is in an active or pressed state.data-autofocusautofocusBooleanWhether or not the autoFocus prop was set to true.data-changingchangingBooleanWhether or not the checked state is currently changing.When the checked state changes, changing will be true for two animation frames, allowing you to fine-tune transitions. Field Groups a Label, Description, and form control together.PropDefaultDescriptionasdivString | ComponentThe element or component the field should render as.disabledfalseBooleanWhether or not the field is disabled.Data AttributeRender PropDescriptiondata-disableddisabledBooleanWhether or not the field is disabled. Label The Label component labels a form control.PropDefaultDescriptionaslabelString | ComponentThe element or component the label should render as.passivefalseBooleanWhen true, clicking the label won't focus the associated form control.Data AttributeRender PropDescriptiondata-disableddisabledBooleanWhether or not the parent Field is disabled. Description The Description component describes a form control.PropDefaultDescriptionaspString | ComponentThe element or component the description should render as.Data AttributeRender PropDescriptiondata-disableddisabledBooleanWhether or not the parent Field is disabled. Styled examplesIf you're interested in predesigned Tailwind CSS checkbox component examples, check out Tailwind Plus — a collection of beautifully designed and expertly crafted components built by us.It's a great way to support our work on open-source projects like this and makes it possible for us to improve them and keep them well-maintained.Explore more predesigned examples →On this pageInstallationBasic exampleStylingUsing data'''
