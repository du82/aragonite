["https://headspace.com/cookie-policy"]
title = "Headspace Cookie Policy"
description = "Headspace’s cookie policy overview."
full_description = "Yes. Headspace uses cookies and other similar technologies to ensure everyone who uses the website has the best possible experience. A cookie is a small text file that is placed on your hard drive by a web page server. Cookies contain information that can later be read by a web server in the domain that issued the cookie to you. You can find out more about each cookie by viewing our current cookie list below. We update this list every six months, so there may be additional cookies not yet listed. Web beacons, tags, and scripts may be used on the website or in emails to help us to deliver cookies, count visits, understand usage and advertising campaign effectiveness, and determine whether an email has been opened and clicked on. We may receive reports based on the use of these technologies by our service/analytics providers on an individual and aggregated basis. When you visit our website, we may place a number of cookies in your browser. These are first-party cookies, and they allow us to hold session information as you navigate within the site. For example, we use cookies on our website to understand visitor and user preferences, improve their experience, and track and analyze usage, navigational, and other statistical information. You can control the use of cookies at the individual browser level. If you choose not to activate cookies or to later disable them, you can still visit our website, but your ability to use some features may be limited. You can generally activate or later deactivate the use of cookies through your web browser. Find your browser below to learn more about how to manage your cookie settings. If you want to learn more about cookies or how to control, disable, or delete them, please visit http://www.aboutcookies.org for detailed guidance. In addition, certain third party advertising networks, including Google, allow users to opt out of or customize preferences associated with your internet browsing. To learn more about this feature from Google, click here."
