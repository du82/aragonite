["http://www.hellomuller.com"]
title = "helloMuller — Designing Fiction & Branding Stories"
description = "helloMuller, a branding agency in London. Designing Fiction & Branding Stories: branding that makes a lasting impact for the worlds most influential brands, storytellers and innovators."
full_description = "When Marvel initiated an ambitious relaunch of their X-Men franchise in 2019, they required a new creative direction that touched on every aspect of the line, signalling a new Dawn of X. Building on a new “X” brand mark a comprehensive publication program was developed that included bespoke typography, logos, book and cover design—resulting in increased brand awareness and engagement through a unified brand system built in the language of X. People have the tattoos to prove it. A modern, timeless identity for the upcoming game & platform Everywhere created by Leslie Benzies (ex Rockstar North, GTA franchise) and his new studio Build A Rocket Boy. Built on a flexible design system the identity, bespoke typography and motion language was built around an iconic symbol and logo that represents Everywhere — giving the game a unique identity that cuts through the noise. Time For A New World. My Domestika course captures my full creative process — from that initial idea to the final design. I teach not just my way of working; but the creative approach and the thinking behind my work. From the X-Men rebrand and my work on numerous comics I show how to translate powerful stories into memorable brand identities with a unique narrative spin using Adobe Illustrator and InDesign. A dynamic and future-proof visual identity for creative agency & content studio IHEARTCOMIX (IHC). With roots in music, pop and visual culture the company is known for staging immersive events and creating original IP — from film activations to fan-favourite Amazon programming. Evolving their brand, the new identity reflects the fun, excitement and engagement they bring to fans. Article for Google Fonts Knowledge that shows designers how they can go from font to logo. Imagining a speculative future Moon mission as its subject, the article is a deep dive into the creative process of developing a visual identity starting from existing typefaces in the Google Fonts library—from sketch, type selection, and design to the creation and application of the final logo."
year_published = 2025
