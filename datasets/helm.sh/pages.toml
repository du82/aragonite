full_description = "The package manager for KubernetesHelm is the best way to find, share, and use software built for Kubernetes. Helm helps you manage Kubernetes applications — Helm Charts help you define, install, and upgrade even the most complex Kubernetes application.Charts are easy to create, version, share, and publish — so start using Helm and stop the copy-and-paste.Helm is a graduated project in the CNCF and is maintained by the Helm community.Learn more:Helm ArchitectureQuick Start GuideVideo: An Introduction to Helm"
