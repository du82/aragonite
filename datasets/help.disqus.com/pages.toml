["https://help.disqus.com/en/articles/1717117-how-to-edit-your-data-sharing-settings"]
title = "How to Edit Your Data Sharing Settings | Disqus"
full_description = '''CommenterSharing settings can be adjusted on the Data Sharing Settings page. This page is also available via the Privacy link at the bottom of every commenting embed. Alternatively, you can opt out by turning on your browser's "Do Not Track" (DNT) setting and Disqus will recognize these requests.​ Note that Disqus does not recognize the DNT requests in Safari 7, but you can still opt out using the primary method on the Data Sharing Settings page PublisherForums can disable data tracking for their forum via the Tracking setting on their forum's Settings > Advanced page. We continue to strive to make Disqus the best way to participate in rich, relevant discussion experiences across the web, while ensuring trust, safety and control are always top of mind. For more information on Privacy see our Privacy Policy.'''
