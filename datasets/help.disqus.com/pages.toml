["https://help.disqus.com/en/articles/1717130-abusive-behavior-policy"]
title = "Abusive Behavior Policy | Disqus"
full_description = "Engaging in targeted abuse or harassment on Disqus is a violation of the Basic Rules and Terms of Service. We want to foster a positive and diverse community for rich discussions. It’s our responsibility to cultivate an environment for communities and discussions to thrive and for users to feel safe when participating. To that end, we’ve established this policy to help us evaluate abusive behavior in its various forms.​ We do not condone and can take action on the following types of abusive behavior including but not limited to:targeted harassment or encouraging others to do sothreat of violence or inciting itself-harm or suicideimpersonating someone in a misleading or deceptive mannerposting personally identifiable informationimproper use or breaking Disqus in such a way that it negatively hurts the experience for othersposting illegal content such as copyrighted material or child pornographyAll types of content is tolerated as long as it does not violate the Disqus Basic Rules and Terms of Service. Additionally, we do not mediate content or intervene in disputes between users.​ As Disqus doesn't provide moderation, nor do we know the ins and outs of each community, the site moderators are the people you should contact to report abusive behavior that isn’t covered by the Basic Rules. Learn more about how moderation works on Disqus.How we enforce against abusive accountsWe review flagged user reports and will act to enforce the Basic Rules and Terms of Service when we find they have been broken. Actions vary depending on the severity of the violation(s) and may include but not limited to:removal of content (e.g. comments, discussions)warning the user of the violationresetting the user's profile to defaultglobal banning accounts or communitiesReporting abusive behavior to DisqusIf you've become the target of abusive activity or are seeing it take place in a discussion or profile powered by Disqus, there are a few things you can do to raise awareness of the issue to the right people, and hopefully, find a resolution. For instructions about how to report abusive behavior, read this article."
