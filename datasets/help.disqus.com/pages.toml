["https://help.disqus.com/en/articles/1717292-how-to-report-threats-of-suicide-or-self-harm"]
title = "How to report threats of suicide or self-harm | Disqus"
full_description = 'If you encounter a direct threat of suicide or self-harm on Disqus, please contact local law enforcement as soon as possible. ​ You can submit reports of suicidal content to Disqus by flagging the user for "Threat - posted directly threatening content" by following: https://help.disqus.com/customer/en/portal/articles/1774987-user-flagging​ After we have evaluated a report of self-harm or suicide, Disqus will contact the reported user privately via email to provide them with online resources where they can seek help. ​ You can also make use of the following online and prevention resources:​ Crisis Text Line http://www.crisistextline.org/Live Chats: http://www.crisischat.org (2pm-2am ET) or https://imalive.orgUnited States: National Suicide Prevention Lifeline at 1.800.273.TALK (8255) or http://www.suicidepreventionlifeline.org/Worldwide: Befrienders: http://www.befrienders.org'
year_published = 2025
