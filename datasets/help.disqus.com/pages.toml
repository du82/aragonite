["https://help.disqus.com/en/articles/1717110-comments-pricing-and-plans"]
title = "Comments Pricing and Plans | Disqus"
full_description = "Disqus Comments is supported by a tiered pricing model based on feature set and site traffic. From personal blogs to media-giant, we’ve got you covered!​Please note that each plan has limits of eligibility based on pageviews and the number of sites in the Organization. If your subscription tier is not updated after crossing the pageview or site count threshold, you'll receive a warning and ads may run on your site. ​Disqus Comments does not include access to Disqus Polls, which require a separate subscription. Our Polls Pricing and Plans may be found here. BasicGet all of the core Disqus features including: Comments plug-in, advanced spam filtering, moderation tools, basic analytics, configurable ads, and more. Free, ads-supported with a Top ads placement required.​​Note: Sites that cannot run ads (due to adult content or other restrictions) may not be eligible for the Basic plan, and will be required to run an ads-free subscription to remain on the Disqus network. Mobile friendlyOptimized and designed for desktop, tablet, or mobile. SEO optimizedImprove the visibility of your site in organic search results. Export/Import commentsBring in your old comments or have the ability to take your Disqus comments with you with our import and export tools. 1,000 API requests per hourGather supplemental data and see many different points of data relating to comments on any site. Multi-language supportDisqus currently supports over 65 languages, including Spanish, French, and Russian. Social account loginAllow your audience to log in using Facebook, Twitter, and Google. Cross-site web and email notificationsInstant activity notifications via web and email to pull readers back in. Embeddable commentsPackage up notable comments and display them directly within your site content. Robust moderation toolsAutomated Moderation Rules, Pre-moderation controls, Banning, email moderation notifications, and more. Community supportSearch using our knowledge base and get help from community experts in real-time discussions on Discuss Disqus. PlusGet everything in Disqus Basic and the option to turn ads on and off. Available to organizations containing up to 3 sites and a combined monthly pageview total listed below: ​up to 100,000 monthly pageviews $12 per month, or $132 per year ($11/month with annual billing enabled)​up to 350,000 monthly pageviews $20 per month, or $216 per year ($18/month with annual billing enabled)​up to 900,000 monthly pageviews$35 per month, or $372 per year ($31/month with annual billing enabled) Ads optionalChoose whether you would like to display ads with Disqus. Direct SupportEmail support with our friendly Customer Success team to ask questions and provide feedback. ProGet everything in Disqus Plus and all of the additional features listed below. Available to organizations containing up to 20 sites and a combined monthly pageview total listed below: up to 1,000,000 monthly pageviews$115 per month, or $1260 per year ($105/month with annual billing enabled)up to 2,500,000 monthly pageviews$140 per month, or $1,500 per year ($125/month with annual billing enabled)up to 5,000,000 monthly pageviews$180 per month, or $1,920 per year ($160/month with annual billing enabled) Shadow BanningDiscretely remove troublesome users from your community without their knowledge. TimeoutsGive users a chance to correct their behavior with temporary bans with the option to provide feedback. Advanced analyticsUncover insights about your audience including top performing stories by engagement, the growth of your community over time, and your most engaged readers. Additional API accessUtilize the Disqus API to build powerful integrations. Priority supportReceive prioritized email support from our friendly Customer Success team to ask questions and provide feedback. Branding and Style OptionsCustomize the look-and-feel of Disqus on your site including custom styling of the comment widget and the ability to remove Disqus branding. New Commenter Pre-ModerationAccounts new to your site can be set to Pending for a number of days specified, while not affecting your returning commenters. This can act as an additional guard against spam and unwanted behavior. Star RatingsAllow users to add a 1-5 star rating along with their comment. The ratings spread will be shown at the top of the thread. Custom ReactionsUpload custom images for a unique set of reactions. BadgesCreate custom badges to reward and recognize the commenters in your community. May be applied manually, or based on automated presets. Email SubscriptionsAllow users to opt into your newsletter through Disqus. BusinessGet everything in Pro, and more. Custom pricing. For enterprise companies and large publishers who want powerful tools and additional support. Single sign on (SSO)Allows users in your own database to comment without forcing them to register with Disqus.​​Contact us here for more info. Custom Pricing/Support1-on-1 account management that facilitates a closer business relationship with Disqus"
