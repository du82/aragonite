["https://help.disqus.com/en/articles/1886218-privacy-faq"]
title = "Privacy FAQ | Disqus"
full_description = "How do I delete my Disqus Account? ​You may delete your Disqus account by following the instructions found at this link: Delete My Disqus Account. Please note that when you delete your Disqus account, your comments will no longer visible to the public, but the operator / publisher of the website where you left a comment will still be able to view your previous comments. How can I unsubscribe from Disqus emails? You can unsubscribe from the emails Disqus sends you by clicking the unsubscribe link found in any email you receive from us. You can also unsubscribe or manage your emails subscription by clicking this link: Manage My Disqus Email Settings. Please note that unsubscribing from Disqus emails will unsubscribe you from Disqus notification emails and Disqus digest emails. You will still receive transactional emails necessary for the Disqus service to function; these include, but may not be limited to, emails confirming you created a new account, emails helping you reset your password etc. How do I reset my password? If you want to reset your password, please click here: Disqus Password Reset. What is Disqus doing to prepare for the General Data Protection Regulation (“GDPR”)? Disqus has been fully GDPR compliant since May 25, 2018, the ‘Effective Date’ of the GDPR. As part of our GDPR compliance program we have implemented new procedures to obtain your consent for the collection of your personal data both for processing by Disqus and, where applicable, third parties. If you are a publisher using the Disqus SaaS commenting platform, we require that you take all measures to be compliant with the GDPR as of the Effective Date. This means that you will need to implement a means to obtain consent from EU citizens for the collection of personal data on your website. For more information about the Disqus platform, please visit our Knowledge Base page by clicking here. If you are a publisher looking for support resources, please click here."
year_published = 2025
