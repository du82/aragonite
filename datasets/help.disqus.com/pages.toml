["https://help.disqus.com/en/articles/1717281-targeted-harassment-or-encouraging-others-to-do-so"]
title = "Targeted harassment or encouraging others to do so | Disqus"
full_description = "Hate speech and other forms of targeted and systematic harassment of people have no place on Disqus, nor do we tolerate communities dedicated to fostering harassing behavior.​ Factors that we examine when determining if conduct is considered to be targeted harassment include: if the primary purpose of the reported account is to bully or attack someone so that they no longer feel safe or welcome in the community.if the reported user is inciting others to harass another user.if the reported user is posting harassing content directed at a user using multiple accounts.You may find that some content on Disqus to be offensive, disrespectful, or that you disagree with. Disqus does not moderate or remove potentially offensive content unless there’s been a violation of the Basic Rules or Terms of Service.​ For more information on how we enforce against abusive accounts that violate the Basic Rules and reporting abuse to Disqus, read our Abusive Behavior Policy."
year_published = 2025
