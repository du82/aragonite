["https://help.disqus.com/en/articles/1717285-threat-of-harm"]
title = "Threat of Harm | Disqus"
full_description = "Do not post content containing threats of physical harm directed towards a specific person or group of individuals. Encouraging violence or attacking anyone based on their race, ethnicity, national origin, sex, gender, gender identity, sexual orientation, religious affiliation, disabilities, or diseases is simply NOT allowed. We carefully review reports of threats and consider many things when determining whether a threat is credible.​ ​ Contact local authorities if you feel a crime has been committed or is imminent.​ If you encounter a direct threat of suicide or self-harm on Disqus, please contact local law enforcement as soon as possible. Learn more about Disqus’ approach to self-harm and suicide threats."
