["https://help.disqus.com/en/articles/1717307-ads-free-subscription-payments-faq"]
title = "Ads-Free Subscription & Payments FAQ | Disqus"
full_description = '''Subscription PlansAre all sites required to run ads?For personal blogs, .edu sites, and non-profits, Disqus advertising is optional. If you are a small, non-commercial site, you are eligible for a free subscription to our Plus plan. How do I start a Subscription?To begin a subscription, you may navigate to your Subscription and Billing page, add your billing information, and then select the plan you'd like to subscribe to. Billing information must be added before you can initiate a trial of your subscription. ​If you are looking to remove ads, this can be completed from each site's Ads Settings page after you've subscribed. How long does the trial period last?The trial period lasts for the first 30 days after you subscribe to a plan. You can see how much time you have left in your trial from the Subscription and Billing tab on your Admin Settings page. ​You are granted 1 trial per plan, but if you click between plans before your 30 day trial is complete, you will forfeit the rest of your trial period for that plan. If you cancel at any point during your trial period, you will not be billed, and will be reverted to the Basic plan accordingly. What happens at the end of the trial?At the end of the 30-day trial period, billing will initiate and you will move from your trial period into your subscription. Subsequent billing will occur monthly or yearly, depending on what you've selected. When will my subscription start?Your subscription will start with the first bill you receive, 30 days after you select your plan and initiate your trial. All functionality provided in your selected plan will be available to you within your initial trial period. How does Disqus measure traffic for my site?Disqus measures traffic by the number of times the Disqus comment embed loads on your site, which happens on every page load where Disqus is enabled. Page loads that do not have the Disqus embed, such as homepages, do not count towards the traffic measured by Disqus. Do you offer an annual pricing option?Yes, annual pricing can save you 10%. Just visit Admin > Subscription & Billing to select "Switch to Yearly billing" for an active plan or toggle the "Billed Yearly" button when selecting a new plan subscription. How can I cancel my subscription?To cancel your subscription, please email our team at: cancellation@disqus.com. They will be able to assist with any issues and walk you through the cancellation procedure. Ad configuration and settingsWhat configuration options are available with ads?For publishers on our Basic Plan, an ad unit in the above-the-comments position, is included. Publishers can reach out to our team for questions specific to ads on their site. Additional positions and configurations are available for larger publishers that are part of our revenue share program. Why were ads activated on my site?The free version of Disqus is supported by advertising. Commercial sites on this version of Disqus will likely have some advertising. We email publishers before activating advertising. If no one at your organization received these emails, please reach out to us so that we can verify your contact information. Do I earn money from ads while using the Basic package?The Basic package does allow a site to use the Disqus service for free, but does not necessarily mean that they earn revenue from the ads being shown. You can visit this page for more information on earning revenue from your Disqus Ads.'''
year_published = 2025
