full_description = "DISQUS TERMSIf you create an account with Disqus, you agree to the User Terms of Service. If you are using Disqus comments on your website you are a “Publisher” and you also agree to the Publisher Terms of Service which follow the User Terms of Service below. DISQUS USER TERMS OF SERVICE.Disqus, Inc. (“Disqus”, “we”, “us” or “our”) offers an online public comment sharing platform where you may login and create profiles to participate in conversations with peers and enjoy an interactive experience. These Terms of Service (the “Terms”) govern your use of and access to our comment sharing platform, software and website (collectively the “Service”) by using the Service you understand and agree to be bound by these Terms. THESE TERMS CONTAIN A MANDATORY ARBITRATION OF DISPUTES PROVISION THAT REQUIRES THE USE OF ARBITRATION ON AN INDIVIDUAL BASIS TO RESOLVE DISPUTES, RATHER THAN JURY TRIALS OR CLASS ACTIONS, AND ALSO LIMITS THE REMEDIES AVAILABLE TO YOU IN THE EVENT OF A DISPUTE. Use of the Service. You may only access and use the Service if you agree to be bound by these Terms, are over the age of 13, and are not a person barred from receiving or using the Services under the laws of the applicable jurisdiction. If you are accepting these Terms and using the Service on behalf of a company, organization, government or other legal entity, you represent and warrant that you are authorized to do so. In the event you breach these Terms, or violate the Basic Rules of Disqus, Disqus may, in our sole discretion, revoke your rights to use the Service and terminate your account. License to Use the Service. Disqus grants you a non-exclusive, limited, non-transferable, revocable license to access and use the Service in accordance with the Terms and in the manner contemplated hereunder. Disqus reserves all rights not expressly granted herein in and to the Service and the Disqus Content (as defined below). Disqus reserves the right to revoke your license to use the Service at any time and for any reason. Disqus reserves the right to access, read, preserve, and disclose any information as we reasonably believe is necessary to (i) satisfy applicable law; (ii) enforce these Terms, including investigation of potential violations hereof; (iii) detect, prevent, or otherwise address fraud, security or other technical issues; (iv) respond to user support requests; (v) protect the rights, property or safety of Disqus; (vi) or as otherwise set forth in the Disqus Privacy Policy. Modifying or Discontinuing the Service. We are constantly changing and improving Service. We may, without prior notice to you, add or remove functionalities or features, and we may suspend or stop the Service altogether. Disqus Account. By creating a Disqus account, you agree to these Terms. When creating your account, you must provide accurate and complete information. You are solely responsible for the activity that occurs on your account, and you must keep your account password secure. We encourage you to use “strong” passwords (passwords that use a combination of upper and lowercase letters, numbers and symbols) with your account. You may never use another user’s account without permission. You must notify Disqus immediately of any breach of security or unauthorized use of your account. Disqus will not be liable for any losses caused by any unauthorized use of your account. You may control your User profile and how you interact with the Service by changing the settings in your profile settings. Privacy. The Disqus Privacy Policy describes how we use and process the information you provide to us when you use the Service. You understand that by using the Services you consent to the collection, use and disclosure of your information as set forth in our Privacy Policy. Content on the Services. You are responsible for your use of the Services and for any content you submit, post, display or otherwise make available on or through the Service (“User Content”), including that such User Content complies with applicable laws, rules, and regulations. You should only provide Content that you are comfortable sharing with others. Disqus takes no responsibility and assumes no liability for any User Content that you or any other User or third-party posts or sends over the Service. You shall be solely responsible for your User Content and the consequences of posting or publishing it, and you agree that we are only acting as a passive conduit for your online distribution and publication of your User Content. You understand and agree that you may be exposed to User Content that is inaccurate, objectionable, inappropriate for children, or otherwise unsuited to your purpose, and you agree that Disqus shall not be liable for any damages you allege to incur as a result of User Content. Any use of or reliance on User Content or materials posted via the Services or obtained by you through the Services is at your own risk. We do not endorse, support, represent or guarantee the completeness, truthfulness, accuracy, or reliability of any User Content or communications posted via the Services or endorse any opinions expressed via the Services. You understand that by using the Services, you may be exposed to User Content that might be offensive, harmful, inaccurate, inappropriate for children or otherwise inappropriate, or in some cases, postings that have been mislabeled or are otherwise deceptive. All User Content is the sole responsibility of the person who originated such User Content. We may not monitor or control the User Content posted via the Services and, we cannot take responsibility for such User Content. You agree that Disqus shall not be liable for any damages you incur as a result of User Content. Disqus respects the intellectual property rights of others and expects users of the Service to do the same. We reserve the right to remove User Content alleged to be infringing without prior notice, at our sole discretion and without liability to you. We will respond to notices of alleged copyright infringement that comply with applicable law and are properly provided to us as described below. By using the Service you represent and warrant that your User Content does not violate any applicable law or infringe any third party proprietary rights, including but not limited to, any Intellectual Property Rights. Copyright Infringement: Digital Millennium Copyright Act of 1998 (“DMCA”) If you believe that your copyrighted work has been copied in a way that constitutes copyright infringement under the DMCA and is accessible via the Service, please notify Disqus’ copyright agent at the contact information below. For your complaint to be valid under the DMCA, you must provide the following information in writing: An electronic or physical signature of a person authorized to act on behalf of the copyright owner;Identification of the copyrighted work that you claim has been infringed;Identification of the material that is claimed to be infringing and where it is located on the Service;Information reasonably sufficient to permit Disqus to contact you, such as your address, telephone number, and, e-mail address;A statement that you have a good faith belief that use of the material in the manner complained of is not authorized by the copyright owner, its agent, or law; andA statement, made under penalty of perjury, that the above information is accurate, and that you are the copyright owner or are authorized to act on behalf of the owner.DMCA Agent Contact Information: Disqus, Inc. Attn: DMCA Notice Disqus, Inc.3 Park Ave, 33rd floor New York, NY 10016 Email: dmca@disqus.com Please note that this procedure is exclusively for notifying Disqus and its affiliates that your copyrighted material has been infringed. In accordance with the DMCA and other applicable law, Disqus has adopted a policy of terminating, in appropriate circumstances, Users who are deemed to be repeat infringers. Disqus may also at its sole discretion limit access to the Service and/or terminate the accounts of any Users who infringe any intellectual property rights of others, whether or not there is any repeat infringement. UNDER FEDERAL LAW, IF YOU KNOWINGLY MISREPRESENT THAT ONLINE MATERIAL IS INFRINGING, YOU MAY BE SUBJECT TO CRIMINAL PROSECUTION FOR PERJURY AND CIVIL PENALTIES, INCLUDING MONETARY DAMAGES, COURT COSTS, AND ATTORNEYS’ FEES. Rights Regarding User Content. You retain your rights to any User Content (“User Content”). By submitting, posting or displaying any Content on the Service, you expressly grant, and you represent and warrant that you have all rights necessary to grant, Disqus a worldwide, royalty-free, non-exclusive, sublicensable, transferable, perpetual and irrevocable license to use, copy, reproduce, process, adapt, modify, publish, transmit, display, distribute, and make derivative works of such User Content in any and all media, technology or distribution methods (now known or later developed). This license authorizes Disqus to make your User Content available, to the rest of the world and to let others do the same. You agree that this license also includes the right for Disqus to provide, promote, and improve the Services and to make User Content submitted to or through the Services available to other companies, organizations or individuals for the syndication, broadcast, distribution, promotion, publication, or otherwise of such User Content on other media and services. Such use by Disqus or other companies, organizations or individuals may be made with no compensation paid to you with respect to your content. Disqus Content Disqus’ name, logo, designs, trademarks, trade dress, service marks, copyrights, patents or other intellectual property rights in Disqus’ software, images, text, graphics, illustrations, logos, APIs etc. (the “Disqus Content”) is the exclusive property of Disqus or its licensors. Except as explicitly provided herein, nothing in these Terms shall be deemed to create a license in or to Disqus Content, and you agree not to sell, license, rent, modify, distribute, copy, reproduce, transmit, publicly display, publicly perform, publish, adapt, edit or create derivative works from any Disqus Content. Use of the Disqus Content for any purpose not expressly permitted by these Terms is strictly prohibited. Feeds and API Disqus provides access to portions of its Service via RSS feeds and an API. For the purposes of these Terms, such access constitutes use of the Service. Disqus asks that you use these features respectfully, and as may be outlined in any documentation that we provide. You may not use these or any other features of the Service itself to allow the display of any portion of the Disqus database or reproduce, duplicate or copy any or all of the Disqus Service. Disqus reserves the right to change these features at any time and to disable access to the feeds and the API at any time for any reason or no reason. Service Rules Please review the Disqus Service Rules below, in consideration of the license to use the Services you agree to comply with the Service Rules which are part of these Terms and outline what is prohibited on the services. Please also note, Disqus comments often appear in websites and online communities not owned by Disqus, these websites and online communities may have their own rules about content and comments on their site, please respect the rules of the communities in which you are using Disqus to comment. Bullying; Harassment; Hate Speech. We do not allow bullying or hate speech on the Disqus platform. Hate speech attacks people based on “protected characteristics” which include race, ethnicity, sexual orientation, religious affiliation, sex, gender, gender identity or serious disability or disease. Bullying targets individuals with the intention of degrading or shaming them. Bullying is especially harmful to minors because they may be more vulnerable. Disqus prohibits bullying and hate speech and requires our users to respect each other and comment with the respect and sensitivity of others in mind. Trademark Rights and Rights of Publicity; Impersonation. Users are required to respect the intellectual property rights of others, and are prohibited from posting content that violates someone else’s copyright, trademark, or right of publicity. Additionally, users are prohibited from impersonating others in a manner that does or is intended to mislead or deceive others. Accounts portraying another person in a confusing or deceptive manner may be banned at Disqus’ discretion. Safety; Self-Harm. Users are prohibited from promoting or encouraging suicide or self-harm. When we receive reports that a person is threatening suicide or self-harm, we may take a number of steps to assist them, such as reaching out to that person and providing resources such as contact information for our mental health partners. Violence and Criminal Acts. Users are prohibited from promoting or publicizing violent crime, theft, or fraud. We also prohibit users from making credible threats of violence, serious physical harm, or death. This includes, but is not limited to, promoting, publicizing or threatening terrorist activity, organized hate crime, mass or serial murder, human trafficking, organized violence. Child sexual exploitation. Disqus prohibits content that sexually exploits or endangers children. If we become aware of apparent child exploitation, we will report it in compliance with applicable law. Inappropriate Content. Graphic media, including explicit violence, gore, and pornographic content are not allowed. Deceitful data collection; Malware Collecting or harvesting any personally identifiable information, including account names, from the Service; attempting to interfere with, to compromise the system integrity or security or to decipher any transmissions to or from the servers running the Service; (v) taking any action that imposes, or may impose at our sole discretion an unreasonable or disproportionately large load on our infrastructure; (vi) uploading data, viruses, worms, or other software agents through the Service accessing any content on the Service through any technology or means other than those provided or authorized by the Service; or (xiii) bypassing the measures we may use to prevent or restrict access to the Service, including without limitation features that prevent or restrict use or copying of any content or enforce limitations on use of the Service or the content therein. Spam. Users are prohibited from posting or sending Spam through the service. What constitutes Spam is constantly evolving. Generally, Spam means repeated actions that negatively impact others, such as repeatedly posting a comment with the intent to post a thread etc. The list of rules above is contently evolving. Disqus may update and revise these rules at any time, please review Disqus Basic Rules for more information. Disclaimers and Limitation of Liability THE SERVICE IS PROVIDED ON AN “A"
