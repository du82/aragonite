full_description = '''// Add a custom body class so we can target new layouts without affecting old layouts. Eventually remove this once everything has been updated. const locale = window.location.pathname.replace("/", "").replace("?", "/").split("/")[1]; if(locale == "en-us") { document.body.classList.add("figma-learn"); } Welcome to Figma Start your learning journey with beginner-friendly resources that will have you creating in no time. 1. Find your way around Get to know the basics of navigating Figma and FigJam files with these tours. 2. Discover your inner maker New to Figma or FigJam? These starter projects are the perfect way to get some hands-on experience in the editor. Figma for beginners Ready for more? Apply your new skills and design a social media mobile app and realistic prototype. 3. Expand your knowledge Dive into the core features of Figma and FigJam. Topics to explore next Fetching topics... Learning is better with multiplayer Join the growing community of Figma users to ask questions, share tips, and level up together. Couldn't find what you needed? Don’t worry, we’ve got more options for you. Forums Jam together with the Figma community. Best practice guides Make the most of Figma. Contact support Our support team is ready to assist.'''
