full_description = 'Attachments (2) Page History Page Information Resolved comments View in Hierarchy View Source Export to PDF Export to Word Pages Jira links SwOS <table class="aui"> <thead> <tr class="header"> <th class="search-result-title">Page Title</th> <th class="search-result-space">Space</th> <th class="search-result-date">Updated</th> </tr> </thead> </table> <p class="search-result-count">{0}</p> <tr class="search-result"> <td class="search-result-title"><a href="{1}" class="content-type-{2}"><span>{0}</span></a></td> <td class="search-result-space"><a class="space" href="/docs/display/{4}/" title="{3}">{3}</a></td> <td class="search-result-date"><span class="date" title="{6}">{5}</span></td> </tr> Created by Edgars P., last updated on Jul 28, 2022 1 minute read SwOS is an operating system designed specifically for administration of MikroTik switch products.SwOS is configurable from your web browser. It gives you all the basic functionality for a managed switch, plus more: allows to manage port-to-port forwarding, broadcast storm control, apply MAC filter, configure VLANs, mirror traffic, apply bandwidth limitation and even adjust some MAC and IP header fields. Search this documentation Search Page Tree Recently Updated Pages CRS3xx and CSS326-24G-2S+ series Manual Jan 27, 2025 • updated by Gļebs K. • view change CRS3xx and CSS326-24G-2S+ series Manual Aug 27, 2024 • updated by Edgars P. • view change CSS610 series Manual Nov 08, 2023 • updated by Edgars P. • view change GPEN21 series Manual Jun 13, 2023 • updated by Anonymous • view change CSS610 series Manual Jun 13, 2023 • updated by Anonymous • view change Show More swosswitchos Overview Content Tools'
