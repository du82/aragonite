["http://help.opera.com/en/latest/features"]
title = "Features - Opera Help"
description = "Ad blocker If you block ads, web pages will load faster and look cleaner. By blocking ads with Opera's built-in ad blocker, you also block the source of many tracking cookies. The ad blocker also stops cryptocurrency mining scripts. To block ads: Go to Settings. Under Block ads, turn on Block ads and surf the web up…"
full_description = "Features Ad blocker If you block ads, web pages will load faster and look cleaner. By blocking ads with Opera’s built-in ad blocker, you also block the source of many tracking cookies. The ad blocker also stops cryptocurrency mining scripts. To block ads: Go to Settings. Under Block ads, turn on Block ads and surf the web up to three times faster. You can also turn on ad blocker by going to the Easy Setup menu found on the right side of the toolbar. Click Manage Exceptions to set site-specific preferences. By default, a few sites are not blocked. On the right side of the combined address and search bar you can see a small badge . Click on the badge for more information, including the number of blocked ads and trackers, and a site-specific switch for unblocking ads or trackers. To stop cryptocurrency mining, or cryptojacking, from happening on your computer: Go to Settings. Under Block ads, click Manage Lists. Click the NoCoin (Cryptocurrency Mining Protection) checkbox. Read more about cryptocurrency mining and how we stop this practice here. Tracker blocker Opera’s tracker blocker feature blocks online tracking from analytic scripts, tracking pixels, and other methods of data collection. Removing trackers protects your privacy and data, as well as helps pages load faster. To block trackers: Go to Settings > Basic > Privacy protection. Enable Block trackers. Click Manage Exceptions to change site-specific preferences, or click Manage lists to change or add lists. You can also turn on the tracker blocker by going to the Easy Setup menu found to the right of the address bar. On the right side of the combined address and search bar you can see a small badge . Click on the badge for more information, including the number of blocked trackers and ads, and a site-specific switch for unblocking ads or trackers. VPN Normally, your browser connects directly to websites, allowing websites to identify your IP address and approximate location. With VPN, you connect to websites via a VPN (virtual private network) server. As a result, your apparent location changes to the location of the server. Before using the free and no-log VPN service in Opera, you need to enable it: In Opera, go to Settings. In the sidebar, click Advanced, then click Privacy & security. Under VPN, click Enable VPN. You will now see the VPN button on the left side of the combined address and search bar. Click this button to open the VPN pop-up window. Here you can turn on VPN. How to set up VPN Once you’ve turned on VPN, Opera will find the optimal virtual location for you, changing your IP address. Or, you can choose from one of the following VPN server locations on the drop-down menu: Europe Asia the Americas Learn how VPN and other Opera features protect your privacy and security. Bypass VPN for default search engines Using Opera’s VPN changes your virtual location while browsing. This influences your search results when using a search engine, such as Google. For example, if you intend to search for a nearby cafe while in Paris with VPN turned on, you may get attractive but inconvenient cafe recommendations in a faraway country. Bypass VPN for default search engines allows you to use default search engines to find web inquiries relevant to your actual location with protection in an https:// connection. The VPN service will resume when you navigate to a web page. If you wish to turn this off: Go to Settings. In the left sidebar, click Advanced, then click Privacy & security. Under VPN, turn off Bypass VPN for default search engines. This is not supported in Private Mode. How do VPNs work? When you use the internet and you don’t use VPN, you connect to your ISP (internet service provider) which connects to the internet. Websites you visit see your real IP address and location, and the data sent back and forth can be seen. When you use a VPN service like Opera’s built-in VPN, your client (your VPN software) encrypts your data and sends it through your ISP to a VPN server and finally to the page you’re viewing. This extra step disguises your location. Websites you visit do not see your IP address and location, but that of the VPN server your data goes through. Also, since your VPN client encrypts the data between you and the websites you visit, anyone looking can only see the encrypted data. VPN is a free service, and the amount of data you are allowed to transfer is unlimited. Read more about how VPN protects your security. Read more about VPN on the Opera blog. Paste Protection Paste Protection is a new feature that makes browsing safer. One potential security risk while browsing is the hijacking of your clipboard to replace a bank account number or crypto wallet identifier with a different one. Paste Protection protects you from this. When you copy sensitive data in Opera Browser, the data is monitored for changes for some time or until you paste the data. If the data is changed by an external application, a warning is displayed. How Paste Protection works When you copy an IBAN, credit card number or crypto wallet number, the Paste Protection icon appears to the right of your address bar along with a notification. For two minutes, or until you paste the data, your clipboard is monitored to ensure the number isn’t changed. If an external application uses the clipboard during that time, the Paste Protection icon displays a warning. You also receive a notification when the data is pasted. Currency converter Whenever you select a text corresponding to a monetary value, such as $30, 10.50 zł, ¥800, or 2.00 BTC, the search pop-up will convert it to your desired currency. For the currency converter to work properly, the corresponding currency symbol must be highlighted along with the numerical value. You can copy the converted value to your clipboard by hovering your pointer over the value and clicking the revealed Copy button. The currency converter uses your location at the time you installed Opera to determine your currency, but you can disable this function or change your currency on the settings page. To change your default currency, which all highlighted currencies will convert to: Go to Settings. Click Advanced on the left sidebar, and click Features. Under Search pop-up, select a currency from the dropdown menu. To disable the currency converter from the search pop-up tool, turn off On text selection, convert currency to. Here is the list of currencies which Opera can convert: AUD, $ – Australian Dollar BGN, лв – Bulgarian Lev BRL, R$ – Brazilian Real BYN – Belarusian Ruble CAD, $ – Canadian Dollar CHF – Swiss Franc CNY, ¥ – Chinese Yuan CZK, Kč – Czech Koruna DKK, kr – Danish Krone EGP, E£ – Egyptian Pound EUR, € – Euro GBP, £ – British Pound GEL, ლ, ₾ – Georgian Lari HKD, $ – Hong Kong Dollar HRK, kn – Croatian Kuna HUF – Hungarian Forint IDR, Rp – Indonesian Rupiah ILS, ₪ – Israeli New Shekel INR – Indian Rupee JPY, ¥ – Japanese Yen KZT, ₸ – Kazakhstani Tenge KRW, ₩ – South Korean Won MXN, $ – Mexican Peso MYR, RM – Malaysian Ringgit NOK, kr – Norwegian Krone NZD, $ – New Zealand Dollar PHP, ₱ – Philippine Peso PLN, zł – Polish Zloty RON, lei – Romanian Leu RUB, ₽ – Russian Ruble SEK, kr – Swedish Krona SGD, $ – Singapore Dollar THB, ฿ – Thai Baht TRY – Turkish Lira USD, $ – United States Dollar UAH, ₴ – Ukrainian Hryvnia ZAR, R – South African Rand Please note that currencies which share the $, kr, ¥, and the £ symbols will, by default, convert to the U.S. Dollar, Norwegian Krone, Japanese Yen, and the British Pound, respectively, if no other currency abbreviation is highlighted. The currency converter can convert these four cryptocurrencies: BTC – Bitcoin BTH – Bitcoin Cash ETH – Ethereum LTC – Litecoin Currency conversion is based on two reference rates reported either by the European Central Bank (ECB) using EURO as its base currency or the National Bank of Ukraine (NBU) using the Hryvnia as its base currency. The default currency converter option is set to the ECB. According to the ECB, its reference rates are updated on working days, excluding TARGET closing days (generally Saturdays, Sundays and certain holidays). The ECB’s reference rates are based on a regular daily concertation procedure between central banks across Europe. Learn more about the ECB’s policy and exchange rates. Reference rates using the NBU are updated in two groups, daily or monthly, according to the exchange rates of the Ukrainian Hryvnia against foreign currencies. Read more about NBU exchange rates. Rates are not verified by Opera and you should confirm current rates with your financial institution before engaging in any transaction. Unit converter In the same way as converting currencies, the search pop-up can convert between imperial and metric units of measurement, such as feet ⇄ meters, gallons ⇄ liters, pounds ⇄ grams, and so on. Celsius and Fahrenheit are also included. Whenever a unit of value in either imperial or metric form is highlighted, the corresponding converted value will appear in the search pop-up. For the unit converter to work properly, the corresponding unit symbol must be highlighted with the number. You can copy the converted value to your clipboard by hovering your pointer over the value and clicking the revealed Copy button. Here is the list of units which Opera can convert: lb ⇄ kg °F ⇄ °C oz ⇄ g mph ⇄ km/h mpg ⇄ l/100km gal ⇄ l qt ⇄ l fl ⇄ ml mi ⇄ km yd ⇄ m ft ⇄ m in ⇄ cm in ⇄ mm kW ⇄ hp lb ft ⇄ Nm Time zone converter When you come across an unfamiliar time, such as 18:30 KST, the search pop-up can adjust the time to your local time zone. For the time zone converter to work properly, the time zone abbreviation must be highlighted with the hour and minutes included (see the formats below). You may also highlight an accompanying date, such as 17-10-2017, in addition to the hour and time zone abbreviation, and the converter will adjust the date if necessary. You can copy the converted value to your clipboard by hovering your pointer over the value and clicking the revealed Copy button. The time zone converter uses your system’s location at the time you installed Opera to determine your local time zone. Here is the list of time zones which Opera can convert: PST / PDT: Pacific Standard / Daylight Time MST / MDT: Mountain Standard / Daylight Time CST / CDT: Central Standard / Daylight Time EST / EDT: Eastern Standard / Daylight Time AST / ADT: Atlantic Standard Time / Daylight Time NST / NDT: Newfoundland Standard Time / Daylight Time GMT: Greenwich Mean Time BST: British Summer Time MET: Middle Europe Time CET / CEST: Central Europe Time / Daylight (Summer) Time EET / EEST: Eastern Europe Time / Daylight (Summer) Time WET / WEST: Western Europe Time / Daylight (Summer) Time JST: Japan Standard Time KST: Korean Standard Time IST: Indian Standard Time MSK: Moscow Standard Time Search highlight The search pop-up tool is Opera’s utility belt that allows you to search or copy (or share if you’re on a Mac) the text you highlight on a web page. With just one click, your highlighted text opens a new tab and is queried by your default search engine. You can also copy the text to your clipboard to use later on. Battery saver Battery saver makes it possible to browse longer when your laptop is unplugged, as demonstrated in the following time-lapse performance test. The first time your laptop’s power cable is unplugged, the battery saver icon appears next to the search and address field, along with the tip: Save battery and browse longer! If you accept the offer, battery saver will activate every time your laptop is unplugged. If you have not previously enabled ad blocker, you are encouraged to do so; battery saver works better when you also block ads. If you click on the battery saver icon, a dialog appears with an on/off switch, a link to the battery saver options in Settings, and an estimate of the time remaining. You can later enable/disable battery saver, select when the feature will activate, and decide to always show the battery saver icon by going to Settings > Advanced > Features > Battery saver. So, how does battery saver work? The secret is that the browser avoids doing more work than it has to, reducing activity in background tabs, pausing plug-ins and animations, rescheduling JavaScript timers, and tuning video-playback parameters. If you’re playing online video games, you might want to switch it off. Read more about Opera’s battery saver feature. Video Popout Opera’s Video Popout feature allows you to watch videos from YouTube, Twitch, Vimeo—almost any video provider—while browsing in other tabs or even using different applications. Video Popout works seamlessly for video conferencing as well. When you visit another tab, the video call window (for example, Google Meet or the browser version of Zoom) remains open at the top of your screen, so you can always see who you’re talking to. How to use Video Popout in Opera When using Video Popout, your video will play in an adjustable, movable, floating window. You can drag the window to any part of your computer screen—or even to a second screen—as well as resize the video as you please. The window will float above other windows and applications, ensuring you can always keep an eye on the action. To detach a video from a webpage, just click the Video Popout button that appears in the top center of the video. Adjusting volume, pausing/playing, and advancing to the next video can all be done in the popout window. Player controls are conveniently located at the bottom of the window, allowing you to manage video playback without needing to have the host tab open. If you wish to quickly return to the tab playing the video, hover your mouse over the square icon with an arrow in the left upper corner and click Back to tab. Closing the Video Popout window does not stop video playback; the video continues playing in its host tab. You can also close the Video Popout by clicking the popout button again at the top of the video. To enable or disable the Video Popout and Videoconferencing Popout feature, go to: Settings (Alt+P) > Features > Video pop out or Videoconferencing pop out To make the feature automatically active, toggle on Automatically pop out videos when possible.You also have the option to adjust the window’s transparency. You can enable that option in settings if you wish: Make popout transparent. Music Player Music Player is available in the sidebar in the Opera browser. If you don’t see Music Player in the sidebar, click the three dots at the bottom of the sidebar, and select Player under Special Features. Listen to your favorite music from services like Apple Music, Spotify, YouTube Music, Deezer, and Tidal by clicking on Music Player in the sidebar; a simple panel will open up. Log into your existing accounts to enjoy your music, use your created playlists, and browse the web simultaneously. Music Player is detachable, so you can move it beyond the browser window. This flexibility lets you positi"
