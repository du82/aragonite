["https://help.opera.com/en/touch/connecting-devices-to-my-flow"]
title = "Connecting devices - Opera Touch - Opera Help"
description = "Learn how to connect Opera Touch for Android or iPhone to your Opera browser for computers with the encrypted My Flow feature."
full_description = "Connecting devices Connect your computer and phone with Flow Launching Opera Touch and Flow for the first time will take you through the connection process. If you wish to reconnect a phone or create a new connection, follow the steps below. To connect to Flow with a QR scan: From Opera Touch on your phone, tap and tap Settings. At the top, tap Connect a computer. Tap Scan QR Code (you may be asked to allow Opera Touch to access the camera). From your Opera browser for computers, open Flow in Opera’s sidebar and click Connect Your Phone or Reveal the QR code. Scan the revealed QR code with your phone. Your phone and computer will connect. Should you be unable to scan the provided QR code, you can manually enter a connection code to connect to Flow. To set up Flow with a connection code: From Opera Touch on your phone, tap and tap Settings. Tap Connect a computer. From your Opera browser for computers, open Flow in Opera’s sidebar and click Connect Your Phone or Reveal the QR code. Below the revealed QR code, click Manually enter connection code. On your phone, tap Scan QR Code (you may be asked to allow Opera Touch to access the camera). Tap Type the connection code and type in the code given from Opera for computers. Tap Enter. Your phone and computer will connect. If both methods fail to connect, refresh the Flow panel in your Opera computer browser to generate a new QR code or connection code. Disconnecting your phone from Flow Disconnecting your phone will prevent it from accessing content in Flow. The content will not be erased from Flow and will be available to other connected devices. Anything previously sent from the phone you wish to disconnect will remain in Flow. To disconnect your phone from Flow: Tap and tap Settings. Under Flow, tap Delete Flow. In the double-check prompt, tap Delete. If you wish to reconnect the device, repeat the connection process. Read more about using Flow."
year_published = 2025
year_updated = 2022
