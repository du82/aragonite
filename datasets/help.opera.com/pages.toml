["http://help.opera.com/en/latest/shortcuts"]
title = "Shortcuts - Opera Help"
description = "Command the browser with your mouse Opera's mouse gestures let you perform common browsing actions with quick, small mouse movements. To enable or disable mouse gestures: Go to Settings. Click Advanced in the left sidebar, and click Browser. Under Shortcuts, turn on or off Enable mouse gestures. Mouse gestures work by holding the right mouse button, moving…"
full_description = "Shortcuts Command the browser with your mouse Opera’s mouse gestures let you perform common browsing actions with quick, small mouse movements. To enable or disable mouse gestures: Go to Settings. Click Advanced in the left sidebar, and click Browser. Under Shortcuts, turn on or off Enable mouse gestures. Mouse gestures work by holding the right mouse button, moving the mouse a certain direction, then letting go of the button. With practice, navigating with the mouse can become fast and efficient. Note: Enabling mouse gestures while using a Magic Mouse or trackpad can cause unpredictable behavior. Navigate with mouse gestures The following mouse gestures work when clicking the empty space of pages. Action Gesture Go back one page Move left Go forward one page Move right Open a new tab Move down Reload the page Move up, then down Close current tab Move down, then right Follow links with mouse gestures The following mouse gestures work when clicking links on a page. Action Gesture Open a link in a background tab Move down, then up Open a link in a new tab Move down Open a link in a new window Shift ⇧ + Move down, holding shift Go backward and forward through a tab’s history with rocker gestures When you enable rocker gestures, you can navigate backwards and forwards through pages by rocking your fingers between the right and left mouse buttons. Simply click and hold one button, click the other, then release the first before releasing the second. With a little practice, you can speed through web pages with this gesture. To enable rocker gestures: Go to Settings. Click Advanced in the left sidebar, and click Browser. Under Shortcuts, turn on Enable rocker gestures. Rock right to left to navigate backward, and left to right to navigate forward. Note: Enabling rocker gestures while using a Magic Mouse or trackpad can cause unpredictable behavior. Navigate faster with keyboard shortcuts Opera allows you to customize keyboard shortcuts for most browsing actions. To customize your keyboard shortcuts: Go to Settings (Alt+P). Click Advanced in the left sidebar, and click Browser. Under Shortcuts, click Configure shortcuts. Hover your mouse over a command, and click Type a shortcut. Type your new shortcut. Here’s an overview of the available keyboard shortcuts and their default keyboard combinations: Command the browser Action Mac Windows/Linux Open Downloads page ⌘+J Ctrl+J Open Extensions page ⌘+Shift ⇧+E Ctrl+Shift ⇧+E Open History page ⌘+Shift ⇧+H Ctrl+H Open local file ⌘+O Ctrl+O Focus address bar ⌘+L Ctrl+L Open Preferences (Settings) page ⌘+, Alt+P Print current page ⌘+P Ctrl+P Quit Opera ⌘+Q Ctrl+Shift ⇧+X Save a page locally ⌘+S Ctrl+S Open help F1 Find text on the page Action Mac Windows/Linux Find on page ⌘+F Ctrl+F Find next ⌘+G Ctrl+G Find previous ⌘+Shift ⇧+G Ctrl+Shift ⇧+G Navigate pages Action Mac Windows/Linux Cycle forward through page elements Tab ⇥ Tab ⇥ Cycle back through page elements Shift ⇧+Tab ⇥ Shift ⇧+Tab ⇥ Go forward one page ⌘+→ Alt+→ Go back one page ⌘+← Alt+← Go to bottom of page ⌘+↓ End Go to top of page ⌘+↑ Home Page down Space Space Page up Shift ⇧+Space Shift ⇧+Space Reload the current page ⌘+R Ctrl+R View current page source ⌘+U Ctrl+U Control tabs and windows Action Mac Windows/Linux Close current tab ⌘+W Ctrl+W Close current window Alt+F4 Cycle forward through open tabs Ctrl+Tab ⇥ Ctrl+Tab ⇥ Cycle back through open tabs Shift ⇧+Ctrl+Tab ⇥ Shift ⇧+Ctrl+Tab ⇥ Cycle through open windows ⌘+` Alt+Tab ⇥ Minimize a window ⌘+M Windows+M Open new tab ⌘+T Ctrl+T Open new window ⌘+N Ctrl+N Open new private window ⌘+Shift ⇧+N Ctrl+Shift ⇧+N Reopen last closed tab ⌘+Shift ⇧+T Ctrl+Shift ⇧+T Toggle tab menu Ctrl+M Ctrl+M View previous active tab Ctrl+` Ctrl+` Manipulate text Action Mac Windows/Linux Copy ⌘+C Ctrl+C Cut ⌘+X Ctrl+X Paste ⌘+V Ctrl+V Select all ⌘+A Ctrl+A Undo ⌘+Z Ctrl+Z Redo ⌘+Shift ⇧+Z Ctrl+Shift ⇧+Z Zoom in and out Action Mac Windows/Linux Enter full-screen mode Ctrl+⌘+F F11 Zoom in ⌘++ Ctrl++ Zoom out ⌘+- Ctrl+- Reset zoom to 100% ⌘+0 Ctrl+0 Use and configure advanced keyboard shortcuts Single key and alternatively-configured shortcuts are available by enabling advanced keyboard shortcuts. To do this: Go to Settings. Click Advanced in the left sidebar, and click Browser. Under Shortcuts, turn on Enable advanced keyboard shortcuts. Action Mac Windows/Linux Cycle left through tabs 1 1 Cycle right through tabs 2 2 View previous tab Ctrl+` Find on page / / Go back one page Z Z Go forward one page X X Zoom in + 0 Zoom in more 8 8 Zoom out - 9 Zoom out more 7 7 Reset zoom to 100% 6 6 Edit or add new shortcuts You can set your own keyboard shortcuts. Go to Settings > Shortcuts > Configure shortcuts, and change existing shortcuts or create your own."
