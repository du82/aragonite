["https://help.opera.com/en/touch/aria-browser-ai"]
title = "Aria browser AI - Opera Help"
description = "Opera Browser for iOS includes Aria, our built-in browser AI. Aria can assist with diverse tasks, from web searches to generating text and images. With Voice Input, Aria lets you speak your queries instead of typing, which is convenient when you are on the go or need a hands-free operation. Aria’s ability to create images…"
full_description = "Aria browser AI Opera Browser for iOS includes Aria, our built-in browser AI. Aria can assist with diverse tasks, from web searches to generating text and images. With Voice Input, Aria lets you speak your queries instead of typing, which is convenient when you are on the go or need a hands-free operation. Aria’s ability to create images using Google’s Imagen2 model enables you to generate visuals simply by providing a prompt. To use Aria, tap on next to the search bar, and choose Aria browser AI. Later, press the Continue with Opera button, where you can sign in or log in to your Opera Account. Once set up, Aria is always available from this menu. For easy navigation, an Aria banner appears on pages when you follow a link from the AI chat. Tapping the banner will bring you directly back to your Aria AI conversation."
