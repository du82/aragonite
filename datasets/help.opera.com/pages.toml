title = "Home - Opera Touch - Opera Help"
description = "Learn all about the Home page in Opera Touch for Android and iPhone, where you can access your top sites and tabs recently opened on Opera for computers."
full_description = "Home The Home screen in Opera Touch has six elements: The Fast Action Button (FAB) is Opera Touch’s all-inclusive button, used to create new searches, open tabs, navigate web pages, and perform voice searches. The menu bar will navigate you to other screens in Opera Touch: My Flow, Home, History, and the overflow menu button. The search box allows you to search for anything or open a web page. Recent Tabs From Computer contains the three most recent tabs used on your Opera desktop browser. Your phone and computer must be connected via My Flow for this to be available. Top Sites shows the web pages you most often visit in Opera Touch. The more you visit a website, the higher it will rise in this section. You can scroll up and down to find your other favorite sites. Starred pages are shortcuts to your favorite web pages. They will remain on your Home screen until you delete them individually. Recent Tabs From Computer Recent Tabs From Computer is activated after connecting to My Flow. It contains the three most recent tabs opened from your Opera computer browser. Private tabs from your Opera computer browser will not be displayed here. If Opera Touch on your Android device is not connected to your Opera for computer browser, Recent Tabs From Computer will not be available in the home page. Top Sites Top Sites holds the web pages you visit most often in Opera Touch. The more you visit a website, the higher it will rise in this section. Conversely, less frequented sites will sink to a lower position. Popular websites are preloaded in this section when first using Opera Touch. You can hide this section of the home page in Settings. Deleting Top Sites If you wish to delete a site from the Home screen, tap and hold the site’s bubble to reveal a pop-up. Tap Remove to delete the site from the Home screen. You can remove all sites from this section by clearing your history. Go to clearing browser data to learn how to clear your history. Starred pages You can add shortcuts for specific web pages to your Home screen by pressing the in the menu while browsing. Starred pages will appear at the bottom of the Home screen, below Top Sites. Sites which you star will remain on the Home screen until you remove them individually. They will not be cleared when deleting your History. Returning to the Home screen while browsing Tap the FAB while browsing a web page to return to the Home screen."
