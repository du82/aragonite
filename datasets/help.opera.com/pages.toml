title = "FAQ - Opera Help"
full_description = "FAQ <style> #wpsm_accordion_21555 .wpsm_panel-heading{ padding:0px !important; } #wpsm_accordion_21555 .wpsm_panel-title { margin:0px !important; text-transform:none !important; line-height: 1 !important; } #wpsm_accordion_21555 .wpsm_panel-title a{ text-decoration:none; overflow:hidden; display:block; padding:0px; font-size: 18px !important; font-family: Open Sans !important; color:#000000 !important; border-bottom:0px !important; } #wpsm_accordion_21555 .wpsm_panel-title a:focus { outline: 0px !important; } #wpsm_accordion_21555 .wpsm_panel-title a:hover, #wpsm_accordion_21555 .wpsm_panel-title a:focus { color:#000000 !important; } #wpsm_accordion_21555 .acc-a{ color: #000000 !important; background-color:#e8e8e8 !important; border-color: #ddd; } #wpsm_accordion_21555 .wpsm_panel-default > .wpsm_panel-heading{ color: #000000 !important; background-color: #e8e8e8 !important; border-color: #e8e8e8 !important; border-top-left-radius: 0px; border-top-right-radius: 0px; } #wpsm_accordion_21555 .wpsm_panel-default { border:1px solid transparent !important; } #wpsm_accordion_21555 { margin-bottom: 20px; overflow: hidden; float: none; width: 100%; display: block; } #wpsm_accordion_21555 .ac_title_class{ display: block; padding-top: 12px; padding-bottom: 12px; padding-left: 15px; padding-right: 15px; } #wpsm_accordion_21555 .wpsm_panel { overflow:hidden; -webkit-box-shadow: 0 0px 0px rgba(0, 0, 0, .05); box-shadow: 0 0px 0px rgba(0, 0, 0, .05); border-radius: 4px; } #wpsm_accordion_21555 .wpsm_panel + .wpsm_panel { margin-top: 5px; } #wpsm_accordion_21555 .wpsm_panel-body{ background-color:#ffffff !important; color:#000000 !important; border-top-color: #e8e8e8 !important; font-size:16px !important; font-family: Open Sans !important; overflow: hidden; border: 2px solid #e8e8e8 !important; } #wpsm_accordion_21555 .ac_open_cl_icon{ background-color:#e8e8e8 !important; color: #000000 !important; float:right !important; padding-top: 12px !important; padding-bottom: 12px !important; line-height: 1.0 !important; padding-left: 15px !important; padding-right: 15px !important; display: inline-block !important; } How do I access settings? Either click the gear icon on your sidebar, click Settings in the menu, or use the keyboard shortcut Alt + P (⌘ + , on Mac). How do I customize Opera? Start with the Easy setup menu in the top-right of your browser. For more advanced customization options, go to Settings. Read more about customization or read more about Easy setup and the start page. How do I switch between dark and light themes? In the Easy setup menu , under Theme, click Light, Dark or System. Read more about customization. How do I change wallpapers in Opera? In the Easy setup menu , under Start Page, click Show wallpaper and choose one. Read more about customization. How do I get more wallpapers for Opera? Go to the Opera Addons store and select Wallpapers at the top. Read more about customization. How do I use an image as wallpaper in Opera? Right-click on an image (Ctrl + click on Mac) and select Use image as wallpaper. Read more about customization. How do I change my startup preferences in Opera? Go to Settings > Basic > On startup and select your preferences. Read more about customization. How do I clear my browsing history? From the menu (toolbar on Mac), select History > History. Hover over any entry and click the x that appears on the right to delete an item. To clear all browsing history, including cookies and more, click the Clear browsing data button on the top-right of the History page. Read more about clearing browsing data. How do I change how Opera handles cookies? Go to Settings > Privacy & Security and click Third-party cookies. Choose your preferences. Read more about cookies. How do I delete cookies in Opera? Go to Settings > Privacy & Security, click Clear browsing data and select Cookies and other site data. Read more about clearing browsing data. How do I delete cookies for individual websites? Go to Settings > Privacy & Security > Site settings. Under Recent activity, click View permissions and data stored across sites. Choose your interested website and expand it. From there you can delete cookies and site data for individual websites. How do I change JavaScript settings in Opera? Go to Settings > Privacy & Security > Site settings and under Content click JavaScript. Read more about web preferences. How do I manage my location sharing preferences in Opera? Go to Settings > Privacy & Security > Site settings and under Permissions click Location. Read more about security and privacy. How do I manage website access to my microphone? Go to Settings > Privacy & Security > Site settings and under Permissions click Microphone. Read more about web preferences. How do I manage website access to my MIDI (musical instrument digital interface) devices? Go to Settings > Privacy & Security > Site settings and under Permissions click MIDI devices. Read more about web preferences. How do I manage desktop notifications? Go to Settings > Privacy & Security > Site settings and under Permissions click Notifications. Read more about notifications. How do I disable push notifications? Go to Settings > Privacy & Security > Site settings > Notifications. In the bottom, under Allowed to send notifications, delete the sites you don’t want to receive push notifications from. Read more about notifications. How do I enable/disable Opera offering to save my passwords? Go to Settings > Privacy & Security. Under Autofill and passwords, choose Password Manager, and on the left side click Settings. Then turn on/off Offer to save passwords. Read more about passwords. How do I save my passwords in Opera? Opera will ask to save your passwords when you use them. If you don’t receive the offer, you may need to enable it by going to Settings > Privacy & Security. Under Autofill and passwords choose Password Manager, and on the left side click Settings. Now turn on Offer to save passwords. Read more about passwords. How do I remove my saved passwords in Opera? To remove an individual password, go to Settings > Privacy & Security > Password Manager, click the interested website, and click Delete. To remove all passwords, go to Settings > Privacy & Security and click Clear browsing data. In the pop-up window, click Advanced, select the Passwords and other sign-in data box, and click Clear data. How do I import/export saved passwords with a CSV file? In Opera, go to Settings > Privacy & Security > Password Manager. On the left side, click Settings, and click Download file to Export passwords. Save the file and transfer it to your new PC. Still in Opera, on the new computer, go to Settings > Privacy & Security > Password Manager. On the left side, click Settings, and click Select file to Import passwords. Find the saved CSV file and import it into the browser. How do I change pop-up settings in Opera? Go to Settings > Privacy & Security > Site settings and under Content click Pop-ups and redirects. Read more about web preferences. How do I manage HTTPS and SSL security certificates in Opera? Go to Settings > Privacy & security > Security and click Manage certificates. Read more about security and privacy. How do I opt out of online behavioral tracking? Go to Settings > Privacy & security > Third-party cookies and turn on Send a “Do Not Track” request with your browsing traffic. Read more about security and privacy. How do I make Opera my computer’s default browser? Go to Settings > Basic > Default browser and click Make default. How do I update Opera? Opera updates automatically. To manually check for an update, go to the menu and click Update & Recovery. You can read about what has been updated on Opera’s blog. How do I find out which version of Opera I am using? Go to opera:about/ or, in the menu, select Update & Recovery. How do I import bookmarks and other data from my old browser to Opera? Go to Setting > Basic > Synchronization and click Import bookmarks and settings. You can choose which browser you are importing from, as well as which data you want to import. Read more about customization. How do I enable Autofill in Opera? Go to Settings > Privacy & security > Autofill and passwords, select the category you would like autofilled and turn it on. Read more about web preferences. How do I add a credit card for Opera to use when automatically filling in forms? Go to Settings > Privacy & security > Autofill and passwords > Payment methods, and click Add. Read more about web preferences. How do I allow or block sites from accessing my camera? Go to Settings > Privacy & security > Privacy and security > Site settings and under Permissions click Camera. Choose if Sites can ask to use your camera (recommended) or Don't allow sites to use your camera. Read more about web preferences. How do I add bookmarks in Opera? To bookmark the current page while browsing, click the heart icon to the right side of the address and search bar, or right-click (Ctrl + click on Mac) and select Add to bookmarks. Read more about bookmarks. How do I change a bookmark’s image in Opera? While creating a bookmark, click the left and right arrows on the sides of the thumbnail to change the image. Once created, you can find your bookmarks in the bookmark manager. Read more about bookmarks. Where is the bookmark manager in Opera? Click the heart icon on the left sidebar to go to your bookmark manager. Alternatively, you can select Bookmarks > Bookmarks from the menu. Or just use the keyboard shortcut (Ctrl + Shift + B). Read more about bookmarks. How do I manage my bookmarks in Opera? In the bookmark manager, hover your mouse over a bookmark to view the options. Click the pen icon to edit your bookmark’s name or location. Click the x to move the bookmark to your trash folder. You can rearrange your bookmarks by dragging and dropping them on the page. Read more about bookmarks. How do I create a bookmarks folder? Go to the Bookmark manager and click the add folder button next to the Search bookmarks field. Read more about bookmarks. How do I restore a deleted bookmark? Go to the Bookmark manager and select Trash at the bottom of the bookmark manager’s sidebar. Hover your mouse over the item you wish to restore and click Undo delete. Bookmarks are restored to the Other bookmarks folder. Read more about bookmarks. How do I turn on the bookmarks bar in Opera? Go to Easy Setup and under Layout click Show bookmarks bar. Read more about bookmarks. How do I synchronize data across devices in Opera? To synchronize your data you need to have an Opera account and be logged in. Go to Settings > Synchronization > Advanced sync settings and click Sync everything. Read more about synchronization. How do I choose which data is synchronized in Opera? Go to Settings > Synchronization > Advanced sync settings and choose the data categories that you want to synchronize between devices. Read more about synchronization. How do I view and manage synced bookmarks? If you’ve chosen to synchronize your bookmarks, they can be viewed in your Bookmarks manager (Ctrl + Shift + B). To view, edit or remove Bookmarks on all your devices, click Other bookmarks on the sidebar. Read more about synchronization. How do I view and manage synced Speed Dials? If you’ve chosen to synchronize your Speed Dials, they can be viewed in your Bookmarks manager (Ctrl + Shift + B). To view, edit or remove Speed Dial entries on all your devices, click Other Speed Dials on the sidebar. Read more about synchronization. How do I view and manage synced history? Opera merges the history of each of your devices onto the history page. You can access your History page by clicking on the clock icon on your sidebar, or using the keyboard shortcut (Ctrl + H). Read more about synchronization. How do I view and manage synced passwords? Go to Settings > Privacy & security > Autofill and passwords > Password Manager. On Mac, your passwords are then stored in your computer’s Keychain. Read more about synchronization. How do I assign a master passphrase for encrypting synced data? Go to Settings > Synchronization > Advanced sync settings, expand Encryption options and select Encrypt all synchronized data with your own sync passphrase. Read more about synchronization. How do I view the tabs from synchronized devices? Select the Tabs button from the sidebar (it looks like a monitor). You must be signed into your Opera account. Read more about synchronization. How do I activate or deactivate the messengers in the sidebar? Go to Settings > Sidebar > Manage sidebar and select which messengers you want available in the sidebar. You can also right-click on the sidebar (Ctrl + click on Mac) to select Sidebar setup. Read more about integrated messengers. How do I enable or disable notification badges for messengers? Go to Settings > Sidebar > Manage sidebar and click Enable notification badges for messengers. Read more about integrated messengers. How do I mute messengers in my Opera browser? With one of your messengers open, you will see a menu in the top-left corner. Click on that menu to see a Mute option. Read more about integrated messengers. How do I pin messengers in my Opera browser? With one of your messengers open, you will find a pin icon in the top-right corner. Read more about integrated messengers. How do I log out of messengers in my Opera browser? With one of your messengers open, you will find a menu in the top-left corner. Click on that menu to see a Log out option. Read more about integrated messengers. What is Personal news in Opera? It is a collection of new and trending web content based on your selected region, language and preferences. Read more about personal news. How do I access my Personal news feed? Click on the newspaper icon in the left sidebar of the start page. Read more about personal news. How do I view content from another region in my Personal news? Go to Personal News > Top 50 and select a region/language from the dropdown menu. Read more about personal news. How do I add sources to my Personal news feed? Go to Personal news and click Add sources in the left panel. Read more about personal news. How do I set refresh intervals for my news feed? Go to Settings > Features > Personal news and select an interval from the Check my sources for new content dropdown menu. Read more about personal news. How do I turn on news on the start page? Go to Settings > Features > Start page and turn on Show news on start page. Read more about news on the start page. How do I take a screenshot with snapshot? On a webpage, either click the camera icon to the right of the search bar, or use the keyboard shortcut (Shift + Ctrl + 5) (⇧ + ⌘ + 2 on Mac). Adjust the frame and click Capture. Alternately, you can select Capture visible page, Capture full page or Save page as PDF at the top of the page. Read more about snapshot. How do I edit a screenshot in snapshot? After capturing a screenshot, you will be presented with editing tools — z"
