["https://help.opera.com/latest/crashes-and-issues"]
title = "Crashes and issues - Opera Help"
description = "Back up your Opera files It is recommended that you regularly back up your most important Opera files. Opera recommends backing up your files before upgrading as well. Locating your files is the first step. Go to About Opera, or go to opera:about/ to find the exact paths for your profile and data folders. Not all files…"
full_description = "Crashes and issues Back up your Opera files It is recommended that you regularly back up your most important Opera files. Opera recommends backing up your files before upgrading as well. Locating your files is the first step. Go to About Opera, or go to opera:about/ to find the exact paths for your profile and data folders. Not all files and folders listed below will be relevant for all users. Files to back up File name Description Bookmarks Your bookmarks’ metadata, such as name and location BookmarksExtras Your bookmarks’ associated thumbnail images Cookies Your cookies (may not be essential, but you’ll need to sign back in to web services if deleted) Current Session Data about your current browsing session including open tabs, location on the page, form data, etc. Extension Cookies Cookies associated with your installed extensions, such as location data for a weather extension Favicons Favicons associated with pages added to your bookmarks bar History Your browsing history Local State Your internal browser preferences, such as the last-seen version number and download location Login Data Your saved, encrypted passwords, readable only on the machine that created them Preferences Your current browsing preferences and information about your profile Visited Links The location of links you’ve already visited, used by Opera to display them as visited Web Data Your autofill and other data imported from IE7 Folders to back up Folder name Description Extension Rules A storage area for your extensions’ rules that need to be persisted Extension State A storage area for your extension’s states that need to be persisted Extensions Your installed extensions IndexedDB Data associated with sites you visit that use Mozilla’s IndexedDB API, a structured database indexing system Local Extension Settings A storage area where your installed extensions can store local data Local Storage A storage area where sites you visit, your extensions, and Opera can store local data Sync Data A storage area for synchronized browsing data (sync services should still work if deleted, but your Opera account may become unstable) Databases A storage area where sites you visit can store local data Themes_backup A storage area for your downloaded or manually-installed themes If Opera crashes There are a few steps you can take to help restore your Opera browser to working order. Even if the steps here help you, sending Opera a crashlog report, including details of what you were doing when Opera froze, helps us fix future browsers. This way we can help others that may experience the same problem. If Opera crashes, a dialog displays and asks if you want to send a report about the problem. The report includes technical details of the crash and any relevant comments you wish to include. This information helps make Opera even more stable and reliable. Provide some details about what you were doing with the browser when it crashed into the text field, then click Send Report. If restarting the browser application does not solve the problem, you may want to download and install a clean version. We recommend that you back up your Opera files before clean installing. To clean install Opera: Uninstall the Opera application from your computer. Delete your Opera profile data. Download the latest version of Opera. Install your new, clean version. If a clean install solves the issue, you can copy over your backed-up files into your new Opera profile. If this causes Opera to crash again, remove your browsing data. If Opera still crashes, submit a bug report. Compress your Opera profile folder using .zip, .rar, or 7zip, and send it along with your report. If you find the file that made Opera crash, specify this in the bug report. Note: Opera only uses the files you send to reproduce the issue. You may choose to remove files that contain sensitive data to protect your privacy; however, if removing these files resolves the crash, we will not be able to reproduce it and fix the problem. For more information, see our Privacy Statement. Report a problem Some websites and services may not function exactly as you would expect in Opera. This could be caused by website authors tailoring their services for one particular web browser. If a site is not displaying or behaving correctly in Opera, you can let us know about it. On Mac, from the menu, select Help > Report an Issue. On Windows or Linux, select O Menu > Help > Report an issue. Please specify how severe you think the problem is and add a comment detailing your experience. You may also use our bug report wizard to tell us about the issue. How to update your Opera browser Your Opera browser will automatically download an update when one becomes available. Relaunching your browser will complete the update. You can review what has been updated – bug fixes, improvements, and new features – on our blog. You can also manually check for an update. To do so: Open the Opera menu (the button on Windows and Linux, or Opera in the toolbar on Mac). Click Update & Recovery…. Click the Check for Update button. After the update downloads, click Update. When the update finishes, you will be asked to relaunch Opera. Your browser will relaunch in its updated version and according to your startup preference. The current browser version number is written at the top of the page. How to recover your Opera browser If you are experiencing issues with your Opera browser, it may be necessary to recover the browser to its default state. To recover your Opera browser: Click the O Menu button (Windows and Linux) or Opera (Mac) in the toolbar. Click Update & Recovery…. Click Recover…. Choose a recovery option, and click Recover. You have two recovery options: Keep my data and only reset Opera settings – This will revert your search engine to its default, remove pinned tabs, and reset browser settings. It will also disable all extensions and clear temporary data, such as cookies. Your bookmarks, history, and saved passwords will not be cleared. Reset my data and Opera – This will revert your search engine to its default, remove pinned tabs, and reset browser settings. It will also delete all extensions, bookmarks, history, saved passwords, and clear temporary data, such as cookies. Installing Opera on your computer with an offline installer Opera can be installed on your system at a later time with the offline installer package. The offline installer package can be stored on an USB drive, for example, for later installation. Having an offline installer package is helpful if your computer cannot connect to the Internet during the time of installation. To download and install Opera with the offline installer package: Go to https://www.opera.com/computer. Click the Download now button, or scroll down to choose a specific system download – Windows, Mac, or Linux. Download the installer file to your system or to a portable storage device. Move the file to the computer where you want to install Opera. Open the file and proceed with the installation."
