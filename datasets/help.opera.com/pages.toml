["https://help.opera.com/en/touch/download"]
title = "Download manager - Opera Touch - Opera Help"
description = "Keep track of your downloaded files in Opera Touch. Open files directly from the browser without having to search for them in your phone's file manager."
full_description = "Download manager All download files while using Opera Touch are found in the Download manager page. (This is only available for Opera Touch on Android at the moment.) The Downloads page is found in the overflow menu. Here you can view the status of current downloads and review your download history. You can open a file by tapping it in the Downloads page, eliminating the need to sort through your device’s file manager. To remove a file from the Download manager, tap and hold the file, and then tap the revealed x. Please note that removing a file from the Download manager will also remove it from your device’s internal storage."
