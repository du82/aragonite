["http://help.opera.com/en/latest/advanced"]
title = "Advanced - Opera Help"
description = "Developer tools Developer tools are used for developing and debugging local and remote web pages. These include a DOM view of web pages and a highlighting of elements. You can step through your JavaScript code, quickly inspect changes to your CSS styles, debug your creations, and study your application’s impact on network resources. Developer tools…"
full_description = "Advanced Developer tools Developer tools are used for developing and debugging local and remote web pages. These include a DOM view of web pages and a highlighting of elements. You can step through your JavaScript code, quickly inspect changes to your CSS styles, debug your creations, and study your application’s impact on network resources. Developer tools allow remote debugging, making it possible to debug web pages as seen on a mobile phone or a television from your desktop. The complete list of developer tools is too long to detail here. For more information, please review the developer tools user guide. For Mac users, to open developer tools, select View > Show Developer Menu. A new submenu called Developer will appear on the menu bar. To use the tools, select Developer > Developer Tools. For Windows and Linux users, to open developer tools, go to O Menu > Developer > Developer Tools. To close developer tools, click the X button in the upper-right corner of the developer tools window. Proxy settings A proxy server is a computer that can, for example: store local copies of pages for quick access, act as an interpreter between your browser and a special service, alter or monitor information exchange, or speed up web communication. To change your proxy server settings: Go to Settings. Click Advanced in the left sidebar, and click Browser. Under System, click Open your computer’s proxy settings. All traffic using the respective protocol will go through the proxy server you specify. To use a proxy, you need to specify: A protocol, such as HTTP A web address, such as proxy.example.org or 192.0.34.166 A port number, such as 5000 You can get this information from your internet service provider (ISP), the host of your proxy server, or the documentation that comes with your proxy software. You can specify whether you want the proxy used for even local servers by checking the Use proxy for local servers checkbox. If your internet provider requires automatic proxy, please enter the web address provided by your ISP. Experiments Opera allows you to test out experimental features, new capabilities, and alternative configurations for your browser. You can read about and enable experiments by navigating to opera:flags. Opera experiments are unstable and are not recommended for casual users. Enabling experimental features can compromise security and privacy and may delete data. If you choose to enable experimental features, you should proceed with caution on a properly backed-up computer. Playing premium media content on ARM on Mac devices If you are using a newer Mac device, you may experience an error when attempting to play premium videos or music, or you may get a message asking you to install additional software called Rosetta.You will see a pop-up prompt that allows you to launch the Rosetta installer directly. You can take action by clicking “Install Rosetta.” On your Mac, open Finder > Go > Go to Folder In the Go to folder input box, type: /System/Library/CoreServices In the resulting files, double-click the Rosetta 2 Installer Follow the instructions provided to complete the installation Restart Opera What is Rosetta?Rosetta is an application provided by Apple to improve compatibility with some of their new Mac devices. You can learn more about Rosetta on Apple’s developer website. Content Picks Content Picks is a content feed on your Start Page that displays curated articles, videos, and podcasts, designed to expand your range of reading topics, deliver positive, useful content, and save you from spending time searching. The content is carefully selected by the Opera editorial team from trusted sources like the New York Times, Washington Post, The New Yorker, and The Atlantic. Clicking on any content will take you to the original source website. When the feature is enabled, Content Picks are displayed on your Start Page, just below your Speed Dials. The content covers a wide range of topics, from health and wellness to personal finance and career development. The feed refreshes three times a day, with lighter content in the morning for starting the day, educational and professional topics during the day, and longer, heavier topics in the evening. The content is also enhanced by Opera’s browser AI, Aria. With the Smart Summary option, Aria gives you a quick summary of the content that can be read in under two minutes. You can also use the keyboard shortcut Ctrl+/ for Windows or Cmd+/ for Mac to open up Aria’s command line, letting you discuss the content or ask any questions without leaving the page. And when using Aria’s command line, just hit Tab to enter Page Context Mode. Any question you ask will be answered taking the page’s content into account. Currently, the feature can be enabled/disabled by going to opera://flags and searching for Content Picks. When the feature is enabled, it can also be disabled by clicking the gear icon next to it, or in Opera Browser Settings by toggling Show Content Picks. You can provide feedback by clicking the smiley face icon displayed in the Content Picks feature, giving a thumbs up or down, and optionally submitting a comment. Themes Themes allow you to customize your Opera Browser with an animated or static wallpaper, browser color schemes, and sound effects. Firstly, download Opera Developer. If you already have Opera Developer installed, you will automatically get the Classic Theme, with your previous wallpaper integrated. To set a new theme, open Easy Setup by clicking the three-bar icon to the right of your address bar. There you’ll find Your Themes section. Click the Choose Theme button to get to the Themes Gallery, where you can pick the Classic, Aurora, or Polar Winds theme. The Classic theme allows you to customize the interface’s color, select a wallpaper from Opera’s collection, or upload your own. To add your wallpaper, click on the + icon at the end of the wallpapers list and click Add your wallpaper. You can choose your color on a scale between cool to warm and calm to vibrant. The Classic theme works in light, dark, and system modes. The Aurora theme and the Polar Winds theme don’t have the option to set a wallpaper, like in the Classic theme. Both the Aurora and Polar Winds themes have their own visuals. You can choose to have it as a steady wallpaper or a flowing animation.* You can adjust the animation’s intensity on a scale from calm to active. To turn the animation on or off, click the Animated button. The Aurora theme works in dark mode. Aurora allows you to choose the main color between Borealis with red, pink, and purple shades or Australis with blue and green. The Polar Winds theme works in light mode. This theme allows you to adjust the color on a scale between pastel and saturated shades. This theme is the only one with keyboard and browser action sounds that can be enabled or disabled. After selecting and editing your theme, press the Set Theme button. Opera remembers the last ten themes you’ve configured, with the last three visible in Easy Setup. You can easily switch between the last ten saved themes by pressing Alt + Shift + T on Windows or Option + Shift + T on Mac. You can edit your current theme anytime by selecting the Edit Theme option in Easy Setup. Use the Reset button to revert to the default state of a chosen theme. * Animated wallpapers can affect your system’s performance. Disable this option if your system feels too slow."
