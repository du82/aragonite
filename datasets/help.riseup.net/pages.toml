["https://help.riseup.net/de/security"]
title = "Sicherheit - riseup.net"
full_description = "In Eile? Zu beschäftigt, Unterdrückung zu widerstehen, oder eine bessere Umgebung zu schaffen? Prima! Wir empfehlen, Du beginnst Deine Sicherheitsreise mit diesen einfachen Schritten, die wirklich alle machen können, um in ihrem digitalen Leben weniger angreifbar zu sein: Die Zunehmende Wichtigkeit von Information und Kommunikation brachte ein anderes Phänomen mit sich: die wachsende Überwachungsgesellschaft. Überwachung kann als ein Versuch der Mächtigen gesehen werden, ihre Dominanz durch Kontrolle der Kommunikation zu bewahren. Nationalstaaten reagieren auf neue Kommunikationstechnologie mit dem Aufbau von Infrastruktur, die einfach für totale soziale Kontrolle genutzt werden kann. Im Gegensatz zu vorherigen Kommunikationszeitaltern erfordert aktuelle Technologie, dass unsere Informationen entweder sicher genug sind um Regierungen zu frustrieren, oder sie ist komplett unsicher, sodass die weitreichende und detaillierte Überwachung der gesamten Bevölkerung möglich wird. Unternehmen haben herausgefunden, dass das Sammeln und Analysieren massiver Mengen privater Daten notwendig ist, um in einer informationsreichen Welt wettbewerbsfähig zu bleiben. Insbesondere wandelt sich fast jede Werbung in Richtung überwachungsbasierter Speicherung sozialen Verhaltens. Wenn Menschen von steigender Überwachung erfahren, sind sie zu Beginn meist überfordert. Einige entscheiden, dass es unmöglich ist, sicher zu sein, also ergeben sie sich selbst der ständigen Überwachung oder geben alle Arten digitaler Kommunikation auf. Bei Riseup glauben wir an einen dritten Weg: unser Ziel ist es, einen hohen Grad an Sicherheit für alle einfach verfügbar zu machen. Ein großer Teil des Kampfes gegen Überwachung findet durch legale Prozesse statt und wir freuen uns über alle, die auf diesem Gebiet arbeiten. Im Gegensatz dazu arbeitet Riseup mit Fokus auf Technologie. Wenn Gesetze ungerecht sind, glauben wir, dass eine eine neue technische Realität notwendig ist, um legale und politische Möglichkeiten zu verändern."
year_published = 2025
