["https://help.riseup.net/ca/email/settings/tor"]
title = "Onion Service configuration - riseup.net"
full_description = "Our Onion Services provide access to IMAP, POP3 and SMTP without leaving the Tor Network while also providing encryption. These are the settings for configuring those protocols in your e-mail client. How you connect those clients to the Tor Network it depends on the Software you use, please check their documentation for this. Note: It’s possible to use SSL/TLS with the Onion Service, for that you need to enable it and switch the Port to 993. But you will get warnings when the certificates change, this will happen frequently. Note: It’s possible to use SSL/TLS with the Onion Service, for that you need to enable it and switch the Port to 995. But you will get warnings when the certificates change, this will happen frequently. Note: It’s possible to use SSL/TLS with the Onion Service, for that you need to enable it and switch the Port to 465. But you will get warnings when the certificates change, this that will happen frequently."
