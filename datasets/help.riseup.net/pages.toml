["https://help.riseup.net/el/email"]
title = "Email - riseup.net"
full_description = "Καλωσήρθατε στη βοήθεια για email του riseup.net. Εδώ θα βρείτε πληροφορίες που αφορούν τους λογαριασμούς email σας στο riseup.net. Εάν δεν βρίσκετε αυτό που ψάχνετε μπορείτε να δημιουργήσετε ένα ticket βοήθειας. Όταν λάβετε μια απάντηση, θα σας παρακαλούσαμε να μας βοηθήσετε να κρατήσουμε αυτές τις σελίδες ενημερωμένες, προτείνοντας αλλαγές ή προσθήκες, που θα θέλατε να μοιραστείτε με άλλους χρήστες. Επισκεφθείτε το account.riseup.net. Από εκεί, μπορείτε να αλλάξετε τον κωδικό σας, να προσθέσετε email alias (προσωρινές εναλλακτικές διευθύνσεις), να ορίσετε email φίλτρα, να αλλάξετε τον αποθηκευτικό σας χώρο και να ζητήσετε βοήθεια. Διαγράφουμε αυτόματα τις πληροφορίες που μας δώσατε στην αίτηση για νέο λογαριασμό. Εξετάστε το ενδεχόμενο να αφαιρέσετε οποιαδήποτε αναγνωριστική πληροφορία από τις ρυθμίσεις του λογαριασμού σας, όπως το όνομά σας, ημερομηνία γέννησης, μυστική ερώτηση και εναλλακτικό email. Όμως, αν ξεχάσετε τον κωδικό σας και δεν υπάρχουν οι πληροφορίες αυτές (ή ξεχάσατε να τις αποθηκεύσετε ή το εναλλακτικό σας email δεν είναι πλέον προσβάσιμο), τότε θα χάσετε την πρόσβαση στον λογαριασμό σας. Το internet είναι γεμάτο από ανθρώπους που προσπαθούν να κλέψουν τον λογαριασμό email σας. Σε κάποια φάση, πιθανόν θα λάβετε ένα απατηλό email από κάποιον που θα παριστάνει ότι είναι από το riseup.net. Αυτά τα email θα ισχυρίζονται ότι πρέπει να κάνετε κάποια κίνηση για να διατηρήσετε τον λογαριασμό σας."
