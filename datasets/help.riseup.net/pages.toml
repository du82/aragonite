["https://help.riseup.net/en/email/settings/aliases"]
title = "Aliases and Forwarding - riseup.net"
full_description = "An alias is a different email address that, in different situations, can be used to send and receive emails without creating a new Riseup account. For example, if you need to use an email address when you sign up on a website, instead of using your normal email address, you can create an alias and use that instead. That way you will know if that site starts spamming you, and if you ever want to stop receiving emails from them, you can delete that alias. If you add a riseup.net alias to your account, mails sent to that address will be delivered to your account’s mailbox. For example, your account might be joe_hill@riseup.net, but you want to use the address maydaychicago@riseup.net as the contact address for an action. Emails sent to the maydaychicago@riseup.net alias will go to your joe_hill@riseup.net mailbox. If the alias you chose is available, the alias will appears in your list with “Send” and “Receive” tags. To remove an alias, click the trash button to the right of an alias. You will get a message saying “changes saved” and the alias will disappear from your list. If you use another client, like Thunderbird, you will need to set your “From” header to your alias. Your SMTP settings still need to use your regular email address for authentication. Riseup also allows registering aliases for other 3rd party domains. This is an advanced usage and we don’t recommend you try to do it if you are not familiar with advanced email internals. If you misconfigure your 3rd party alias, it is possible that you will lose mails sent to you. When you add a new 3rd party alias, you will need to confirm you have access to the email by clicking on a confirmation link sent to you by Riseup. If you do not get the email, check your Spam/Junk folder or click the “Resend Confirmation Email” button in the alias list. If you add an alias for a domain other than riseup.net, mails sent to that address will not automatically arrive in your riseup account. If you setup an email forward to your riseup.net address, this let you receive mails."
year_published = 2025
