["https://help.riseup.net/en/email/servers"]
title = "Email Servers - riseup.net"
full_description = "This page is technical information intended for administrators running mail servers that communicate with riseup. We have had to implement many layers of spam blocking. If you are the administrator of a mail server trying to relay messages to riseup users, here are some hints that will help ensure your mail is delivered. If you are a riseup user running an email server, it is possible to relay email via riseup, just configure your server to do authenticated SMTP to mail.riseup.net (like any other mail client). However, you will only be able to send mail for sender addresses that you have registered as aliases, and they are also subject to things like SPF records. Also make sure that mail to bare usernames gets directed somewhere, otherwise root@riseup.net will get your root email, etc. If you administer web servers (wordpress, drupal, etc) or other things that are configured to use SMTP to send you notifications/alerts/etc. we have no way of differentiating them from any other server on the internet and they will need to follow the above guidelines. What might be better is to configure them to use authenticated SMTP which bypasses many of the DNS/helo/RBL restrictions (but see the ‘relaying’ section above)."
