["https://help.riseup.net/el/security/resources/radical-servers"]
title = "Radical Servers - riseup.net"
full_description = "Here is a list of either anti-capitalist, anti-hierarchy, autonomous, feminist, or radical server projects. Some of them are revolutionary collectives which provide free or mutual aid services to radical and grassroots activists. Others are more focused on privacy or on decentralisation. None of them are focused on money. Riseup is not endorsing these projects, but is keeping a list for people to be able to choose! Please read carefully the terms of service of the projects, as some may be subject to law-enforcement or surveillance laws. Hackerspaces are community-operated physical places, where people can meet and work on their projects. This website is for Anyone and Everyone who wants to share their hackerspace stories and questions with the global hackerspaces community. HackThisSite.org is a free, safe and legal training ground for hackers to test and expand their ethical hacking skills with challenges, CTFs, and more. Active since 2003, we are more than just another hacker wargames site. We are a living, breathing community devoted to learning and sharing ethical hacking knowledge, technical hobbies, programming expertise, with many active projects in development. Join our IRC, Discord, and our forums where users can discuss hacking, network security, and more. Tune in to the hacker underground and get involved with the project! Tachanka is the idea of providing technical services to emancipatory projects and groups of political change. It is also the groups of people behind this idea. There are many overlapping collectives that help to maintain the projects, but Tachanka operates within many shared principles, forming a supportive network to enable shared aims. The collectives are international, seeking to enhance global solidarity. The foremost guiding principles of the Tachanka project are the Hallmarks of People’s Global Action and the Debian Social Contract. Take Back The Tech! is a global campaign that connects the issue of violence against women and information and communications technology (ICT). It aims to raise awareness on the way violence against women is occurring on ICT platforms such as the Internet and mobile phones, and to call for people to use ICT in activism to end violence against women. It was initiated by the Association for Progressive Communications (apc.org), Women’s Networking Support Programme, in 2006. Since then, the campaign has been taken up and organised by individuals, collectives and non-governmental organizations in at least 24 countries. More at Wikipedia"
year_published = 2025
