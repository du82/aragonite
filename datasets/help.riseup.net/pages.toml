["https://help.riseup.net/el/lists/list-admin/configuration/creating-lists"]
title = "Δημιουργία Λίστας - riseup.net"
description = "Πληροφορίες για τη δημιουργία λίστας"
full_description = "Πρέπει πρώτα να δημιουργήσετε έναν λογαριασμό λίστας και στη συνέχεια να συνδεθείτε στον ακόλουθο σύνδεσμο lists.riseup.net. Αφότου συνδεθείτε, επιλέξτε τον σύνδεσμο create list που βρίσκεται στην κορυφή της σελίδας. Είναι σημαντικό να θυμάστε ότι οι riseup.net λογαριασμοί e-mail είναι εντελώς ξεχωριστοί από τους riseup.net λογαριασμούς λίστας. Όταν συνδεθείτε στο lists.riseup.net, ορίστε την πλήρη διεύθυνση του ηλεκτρονικού σας ταχυδρομείου, από οποιονδήποτε πάροχo email. Δεν χρειάζεται να έχετε riseup.net λογαριασμό email για να φτιάξετε μια λίστα. Οποιοσδήποτε μπορεί να δημιουργήσει μια λίστα! Η μόνη απαίτηση είναι η λίστα να χρησιμοποιηθεί στην προσπάθεια για μια ριζοσπαστική κοινωνική αλλαγή. Εάν η λίστα δεν είναι προοδευτικής, ριζοσπαστικής ή επαναστατικής φύσεως, τότε δεν θα την δεχτούμε. Λίστες οι οποίες χρησιμοποιούνται ή προορίζονται κατά κύριο λόγο για χόμπυ, γενική εκπαίδευση, αθλήματα ή πνευματική άσκηση δεν θα εγκρίνονται. Επαναλαμβάνουμε, οι λίστες πρέπει να έχουν πολιτικό περιεχόμενο. Όταν δημιουργείτε μια λίστα, αναλαμβάνετε την ευθύνη της συντήρησης αυτής. Με το που ενεργοποιηθεί η λίστα σας, γρήγορα θα καταλάβετε ότι πρέπει να λάβετε τα κατάλληλα μέτρα για την αποφυγή της ανεπιθύμητης αλληλογραφίας (τόσο εμπορικής όσο και ακτιβίστικης χροιάς). Δείτε εδώ για τους όρους χρήσης λίστας."
