["https://help.riseup.net/de/email"]
title = "E-Mail - riseup.net"
full_description = "Falls du nicht findest, was du suchst, fülle ein Hilfe-Ticket aus. Sobald deine Frage beantwortet wurde, hilf uns bitte dabei, diese Seiten aktuell zu halten, indem du Änderungen oder Ergänzungen, die du mit anderen Benutzern teilen möchtest, an uns übermittelst. Besuche account settings. Dort kannst du dein Passwort ändern, E-Mail-Aliase hinzufügen, Filter einrichten, deinen Speicherplatz anpassen oder Hilfe anforden. Wir löschen automatisch die Informationen, die du uns als Teil deiner Registrierung übermittelt hast. Du solltest darüber nachdenken, sämtliche identifizierenden Informationen (Name, Geburtstag, Geheimfrage, alternative E-Mail) aus deinen Account-Einstellungen zu entfernen. Bedenke dabei aber, dass du eventuell keinen Zugriff auf deinen Account bekommst, wenn du dein Passwort vergisst und diese Informationen nicht vorhanden sind (oder du vergessen hast, was du in diese Felder eingetragen hast bzw. deine alternative E-Mail-Adresse nicht mehr erreichbar ist). Falls Du Dein Passwort vergisst, kannst Du nur Zugang mit einem Sicherheits-Kode wiedererlangen. Es gibt keinen anderen Weg, Riseup kann dir nicht helfen, wenn Du den Wiederherstellungs-Kode verlierst. Du musst ihn an einem sicheren Ort aufbewahren. Auf account.riseup.net kannst Du Dein Passwort ändern, den Wiederherstellungs-Kode ersetzen, E-Mail-Aliase hinzufügen, E-Mail-Filter einstellen, deinen Speicherplatz bestimmen, Deine Daten löschen, spezifische Passwörter für unsere Dienste definieren und nach Hilfe fragen. Im Internet wimmelt es von Personen, die versuchen, dein E-Mail-Konto zu übernehmen. Möglicherweise erhältst du eine gefälschte E-Mail von jemanden, die behauptet, im Namen von riseup.net zu handeln. In diesen E-Mails steht beispielsweise, dass du einige Aktionen ausführen sollst, um deinen Account zu behalten. Nachrichten in einigen speziellen Ordnern werden automatisch nach einer bestimmten Anzahl an Tagen gelöscht: Es hat verschiedene Gründe, dass wir nicht viel Speicherplatz für E-Mails bereitstellen. Wenn du mehr Platz benötigst, solltest du deine E-Mails mit einem E-Mail-Client abrufen (und serverseitig löschen lassen) oder deinen Speicherplatz unter account.riseup.net erhöhen. Weitere Informationen findest du unter Speicherplatz."
