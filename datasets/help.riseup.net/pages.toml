full_description = "Καλωσήρθατε στη σελίδα βοήθειας για τις mailing lists σας στο riseup.net! Εδώ θα βρείτε πληροφορίες σχετικά με τις mailing lists που φιλοξενούνται στη διαδικτυακή διεύθυνση lists.riseup.net. Αν χρειάζεστε βοήθεια για τον λογαριασμό email σας του riseup.net, τότε μεταβείτε στην σελίδα βοήθειας για τα Email. Εάν η ερώτησή σας δεν απαντάται παρακάτω μπορείτε να χρησιμοποιήσετε την πλατφόρμα : create a help ticket. Η παροχή της υπηρεσίας lists.riseup.net καθίσταται εφικτή μόνο μέσω των συνεισφορών σας. Για αυτό, αν επιθυμείτε να συνεχίσει να είναι σε λειτουργία, σας παρακαλούμε Συνεισφέρετε. Οι lists.riseup.net χρησιμοποιούν ελεύθερο λογισμικό, συμπεριλαμβανομένων του sympa mailing list manager, του apache webserver, του debian GNU/Linux operating system και της γλώσσας προγραμματισμού Perl."
