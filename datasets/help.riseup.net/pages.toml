["https://help.riseup.net/de/spenden"]
title = "Spendet - riseup.net"
full_description = "Riseup arbeitet pausenlos an der Erstellung alternativer Graswurzel-Technologien, um die Kommunikation von Menschen und Organisationen, die einen sozialen Wandel herbeiführen wollen, zu erleichtern. Die herkömmlichen Gratisangebote großer Firmen finanzieren sich üblicherweise durch die intensive Auswertung Deines Kommunikationsverhaltens. Riseup hingegen arbeitet auf Spendenbasis von Nutzer_innen wie Dir, denen es wichtig ist, demokratische Alternativen zu unterstützen. Für weitergehende Informationen über Riseup, kannst Du uns kennenlernen oder unsere Projekt-Übersicht ansehen. Riseup ist eine eingetragene unkommerzielle Organisation nach Abschnitt 501(c)(4) des „US Internal Revenue Code“. Spenden an riseup.net können nicht von der Steuer abgesetzt werden. Für von der US-Steuer absetzbare Spenden kannst Du unsere Schwesterorganisation Riseup Labs unterstützen. Falls Ihr eine große Mailingliste mit mehr als 100 Abonnent_innen oder viel Kommunikationsverkehr betreibt, erhöht sich der Spendenvorschlag um ein mehrfaches. Bitte erwägt, mehr zu spenden, falls Euch das möglich ist. Alles Geld, das nach Deckung unserer grundlegenden Ausgaben übrig ist, fließt zurück in den Ausbau unserer Dienste für weitere Nutzer_innen. Falls Du eine größere Spende geben willst (Danke!), überlege Dir bitte, uns Geld oder einen Scheck per Post zukommen zu lassen - Online-Bezahlsysteme kassieren ungefähr 3% des Gesamtbetrags. Alle finanziellen Entscheidungen des Riseup Kollektivs werden im Konsensverfahren durch die Kollektivmitglieder getroffen. Schicke Banknotenbündel, Schecks oder Zahlungsanweisungen (auszahlbar für “Riseup Networks“) an: Leider haben wir nicht die Kapazitäten, nach Erhalt Eurer Spende Dankesbriefe zu verschicken. Seid versichert, dass wir Euch unglaublich dankbar sind: Eure Unterstützung hält uns am Leben und macht all unsere harte Arbeit erst möglich. Wir schätzen sehr, wenn Du Dein Geld für das ausgibst, was Dir wirklich wichtig ist!"
year_published = 2025
