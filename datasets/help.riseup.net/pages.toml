["https://help.riseup.net/de/about-us"]
title = "Über uns - riseup.net"
full_description = "Können wir uns auf kommerzielle E-Mailanbieter für vertrauliche E-Mailkommunikation verlassen? Nicht nur dass sie regelmäßig unsere E-Mails nach bestimmten Inhalten scannen, sie folgen außerdem den Forderungen von Regierungen, die digitale Freiheit einzuschränken ohne klare Prinzipien zur Gewährleistung der Privatsphäre ihrer Nutzer*innen. Nicht zu reden von offensichtlichen kommerziellen Interessen der Unternehmen, die unseren Ansprüchen zuwiderlaufen. Die US-Regierung praktiziert umfassende Überwachung (“full pipe monitoring”) und soziale Netzwerkanalyse auf allen Kommunikationskanälen, wodurch sie in die Lage versetzt weden, eine detaillierte Karte sozialer Bewegungen und ihrer Organisationsweise zu erstellen. Darüber hinaus gibt es ihnen Informationen, welche Verbindungen zerstört werden müssen, um soziale Bewegungen zu stören. Wir glauben, es ist lebenswichtig, dass essentielle Kommunikationsinfrastruktur durch Bewegungsorganisationen und nicht Unternehmen oder Regierungen kontrolliert werden. Wir setzen uns dafür ein, E-Mail so sicher und privat wie möglich zu machen. Wir speichern keine IP-Adressen. (Die meisten Dienste speichern detaillierte Verbindungsdaten in ihren Logdateien. Wir speichern nur Informationen, mit denen sich unsere Nutzerinnen nicht identifzieren lassen.). Alle unsere Daten, E-Mail eingenommen, werden verschlüsselt gespeichert. Wir arbeiten hart daran, unsere Server sicher und gut geschützt gegenüber böswilligen Angriffen zu halten. Wir teilen keine Nutzerinnendaten mit irgendjemandem. Wir kämpfen aktiv gegen alle Versuche, uns mittels subpoena oder anderweitig zur Herausgabe von Nutzer*inneninformationen oder Logdateien zu zwingen. Wir werden ein- oder ausgehende E-Mails nicht lesen, durchsuchen oder verarbeiten, außer um euch mittels automatischer Skripte vor Viren und Spam zu schützen oder wenn ihr uns zur Fehlersuche dazu auffordert. Das Riseup-Kollektiv ist eine autonome Körperschaft in Seattle mit Mitgliedern auf der ganzen Welt. Unser Ziele sind, beim Aufbau einer freien Gesellschaft zu helfen, eine Welt ohne Gier und mit Meinungsfreiheit, eine Welt ohne Unterdrückung oder Hierarchie, in der Macht gleichmäßig verteilt ist. Um dazu beizutragen, übernehmen wir Verantwortung für Kommunikations- und Computerresourcen für Verbündete im Kampf gegen Kapitalismus und andere Arten der Unterdrückung."
year_published = 2025
