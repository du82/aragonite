["https://helpachild.in/Home/Home/OurImpactSub"]
title = "Help a Child By Somaiya|Educational Trust For Poor Students"
description = "Somaiya Trust runs a Help a Child program to help these students achieve their dreams.We help them to pursue higher education & get better future."
full_description = "Our Inspiration After passing her 10th Standard examinations, it seemed highly unlikely for Sujata Bisnal to continue her education as the lack of resources and hardships at home made her believe that she would either need to start working or get married to make ends meet. Until 2019, Sujata was working as a teacher with K.J. Somaiya English Medium School at Sameerwadi, Karnataka. The financial and moral support she received through Help A Child scholarship at the right time helped her change the path of her life. Learn more Higher Secondary Education Created A Huge Impact In Sujata’s life. Inspired by her, we knew that we wanted to continue doing our bit towards providing opportunities for quality and career oriented education. Addressing the Educational Crisis! Higher Secondary Education lays the foundation for career-based learning which empowers an individual to be independent Our aim is to reach out to those who need our help the most, to ensure that no one has to give up their education due to the lack of funds We believe that education is the best way to end the cycle of poverty, ensuring a better future Help A Child aims to provide accessibility to those students who want to break out of their current situation, dream bigger and achieve greater heights 4000 + Alumni 800 + Current Students 11000 + Scholarships 6000 + Students and the families impacted 200+ Village communities Upliftment Stories of Hope Ms. Deepa Kokantoor Deep’s father passed away when she was in 6th grade due to cardiac arrest. He was a weaver. After sudden death of her father, mother continued the weaving for very less income. Deepa’s elder brother discontinued his studies after 12th grade to support the family. Deepa approached Help A Child for higher studies after 10th grade. She was supported for Pre University course and Diploma in pharmacy. After completion of her pharmacy, she got selected for the position of Grameen Dak Sevak with Indian Post Office. Now she is taking care of her mother and a family. Learn more Ms. Vidya Teli Vidya comes from a challenging background. Her father is working as private car driver on daily-wages while mother as housekeeping as her father will be on sick most of the times. Younger sister is studying in high school. After completing her 12th standard in Science she approached Help A Child to support her further studies in Nursing. Vidya is now a successfully completed Science Graduation in Nursing and working as staff Nurse in private hospital at Pune. She supports her parents and her sibling education. Learn more Ms. Megha Magadumakar Megha is a very bright student. She scored 92 in 12th Science. Father sales sheep and goats and earns very less commission. Megha’s has two siblings, who are also studying in junior colleges. Help a child supported Megha for her Engineering in Information Technology. Now she is an independent woman. She is employed Principal Global Services Pvt. Ltd, as a Trainee Analysist in Pune. She now supports her family. Learn more Mr. Sagar Pagad Sagar’s father is a daily wage labourer who worked on a spinning mill and earned a meagre income which he used to support his family of five people. It was extremely difficult for him to support Sagar’s studies while his siblings were also studying. With a Help A Child scholarship, Sagar pursued his Engineering in Electronics and Communication. He jumped at the opportunity to work with Samsung Company at Noida as soft wear Engineer and taking care of his parents and education of his siblings. Learn more Ms. Girija Madharkhandi Girija’s father passed away before her birth, hence mother started working as daily wage labour. They stay in rented house as they don’t have their own property and pay Rs. 500/- per month rent. Girija supported with help a child scholarship for her Bachelors and Masters in commerce. After successful completion her masters, Girija is now working a faculty in one of the best Degree College and taking care of her mother and a family. Learn more Ms. Megha P. Dodamani Megha’s father passed away when she was in primary school due to ill health. Hence her older brother discontinued his studies after 12th grade and started working as daily wage labour to support the family. Megha’s mother is also a daily wage labour. Family stays in this shed prepared out of wood sheets. She approached Help A Child to pursue her masters in Social work. Megha is now a successful woman, she passed through all heralds and is working as councillor on contract basis with Govt. hospital. She now takes care of her mother and family. Learn more Mr. Satish Hiremath Satish lost his father when he was in high school due to cardiac arrest, while mother is working as daily wage labourer to support the household. Satish’s uncle and few members of his village supported his studies till 12th grade. When he wanted to pursue his higher studies in Electronics and Computer Engineering, he sought support from Help A Child. Now Satish is a successful man, he is working with “O” 9 Solutions Management India Pvt Ltd., Bangalore as an Engineer and takes care of her mother and a family. Learn more Ms. Gouri Kokatanur Gouri is from very poor family. Her parents are viewing on daily wages. The family stayed in a mud house. Gouri has five younger sister and grandparents. Hence it is very difficult for her father to support the higher studies of Gouri. Help a child supported pre- university education and Engineering in Computer Science. Gouri is now a successful woman, she passed through all heralds and is working as a Soft wear Engineer with Helloapps Technology Private Ltd., Bangalore. She now takes care of her family and further studies of her younger sisters. Learn more Ms. Chandravva Badiger Chandravva is from very poor family. Her father deceased when she was in primary school. Soon after death of her father, Chandravva’s elder brother discontinued his studies to support the family. Brother started working as a carpenter in a village making agricultural tools for fever income. Her mother is a daily wage labour. Student is also working with her mother on daily wages during holidays. Every day Chandravva travels 8km to reach her college by bicycle. Student was supported with Help A Child Scholarship for her Bachelor’s degree in Arts and in Education. Now Ms. Chandravva is a successful woman, she is appointed as high school teacher with Karnataka state Govt. by clearing competitive exams. Now she takes care of her mother and a family. Learn more Help this Students Achieve their Dreams Learn more How can you get involved? You can become a part of our initiative and help us in multiple ways Be it big or small, every act of kindness counts For thousands of disadvantaged children across India, only education can give them an opportunity to reach their full potential. Your involvement makes quality education accessible to build a brighter future! Donate Help A Child achieve their dreams. Be the wind beneath their wings Sponsor a student Take the first step to make a difference Become a volunteer Come join hands with us Make A Donation Now Payment Type One Time Recurring I Want To Donate For Purchase of Study Material Scholarships Fund Corpus Fund Administrative Expenses How Much Do You Want To Donate? ₹ $ DONATE NOW"
