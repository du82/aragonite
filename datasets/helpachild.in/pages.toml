["https://helpachild.in/Home/AboutUs"]
title = "About Us| Somaiya Help a Child Program"
description = "Somaiya Help a Child program - Founded in 2001 aim to help children complete their education.This program is in collaboration with Somaiya Grameen Vikas Kendra"
full_description = "Providing scholarships for higher education, enabling students to build a career for themselves Freeing the students and their families form unethical money lending practices Allowing students to concentrate only on their studies Help A Child was founded in 2001 through Somaiya Grameen Vikas Kendra, as a joint project of Somaiya Vidyavihar Trust and Godavari Biorefineries Ltd. A young girl, Sujata Bisnal had passed her 10th grade examination with flying colours but was unable to continue her education. Her father had left her when she was a year old, her uncle who had been supporting her education was injured and could no longer work, leaving her mother and aunt to support the family as daily wage labourers. Given this she had two options, to get married or start working herself. Moved by her story, Samir Somaiya, Chairman and Managing Director of Godavari Biorefineries Ltd offered to sponsor her further education and that’s how Sujata became the first student of the Help A Child to Study Project. Today, she proudly holds a Bachelor of Education and a Master of Arts degree. She was working as a teacher with K J Somaiya English Medium School at Sameerwadi, Karnataka till last year before finally deciding to get married. While we have come a long way, we know that there are many students like Sujata still out there without the means to continue their studies. We continuously find a way to reach out to all of them. At Help A Child, scholarships is just one aspect of what we provide. For making the student world-ready, we work on the following:"
author = "malcolm sheridan"
year_published = 2025
clearnet = "https://helpachild.in/Home/AboutUs"
