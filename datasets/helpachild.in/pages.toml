full_description = "Online application for Help A Child Scholarship For the Academic Year 2024-25 1Check Application Status CLOSED Check Application Status If you want to know your application status, please enter the Login ID or the Mobile Number entered during registration Acknowledgement No./Login ID Continue Instructions Instructions in Kannada | Marathi Please read all instructions carefully before filling Online Application. Last date for submission of online application is: Eligibility Students residing or studying in the operational areas of Godavari Biorefineries Ltd, Sameerwadi and Sakarwadi are eligible to apply. Karnataka: Villages/towns situated up to 40 kms from Sameerwadi Sugar factory in Rabakavi-Banahatti, Mudhol and Jamakhandi taulks in Bagalkot district, Mudalagi and Raybag taluks in Belgaum district students are eligible. Maharashtra: Villages/towns situated up to 20 kms from Sakarwadi factory in Kopargoan and Rahata taluks in Ahamednagar district students are eligible. Students that have passed 10th and above grades in the academic year 2023-24 are eligible to apply Meritorious students from BPL families are considered for scholarships. Minimum percentage of marks in the 2023-24 academic year’s annual/board/University exam should be more than 70% NEET/CET rank will also be considered for professional course along with 12 th grade marks. Details are as follows NEET / CET ranks I Preference I Preference I Preference NEET rank for MBBS / BAMS / MHMS etc. 50,000 70,000 80,000 CET rank for BE / B.Sc.(Agri) / Nursing / B. Parma etc. 25,000 35,000 45,000 CET rank for BE after Diploma 1,000 1,500 2,000 You can edit/change/add/delete any information till last date i.e. . Who are not eligible? Students studying out of our operational area (other than professional / PG courses) Coaching classes/competitive exams and distance educations students Students belonging to families above BPL status Married students Selection procedure Invite online applications from eligible students Scrutinise the application based on eligibility Qualifying exam: Conduct digital mode qualifying exam for 10 th grade passed out students of 2023-24 academic year. Student’s personal interviews Home visits to verify the actual economic status / surroundings Preference will be given to the students of single parents, orphans, daily wage labourers, small and marginalised farmers, weavers and pretty business Students who get admission in Govt. Colleges / Govt. quota Qualifying Exam details : The qualifying exam will be held on Smartphone. Hence everyone must carry fully charged good working condition smartphone. Candidate must bring hard copy of the Exam Hall ticket downloaded with online Candidates must select language for the exam carefully (Kannada / Marathi / English). Accordingly the selected language question paper will be sent directly to your smartphone in the exam hall. Student should report one hour early to get the exam instructions and mock test before the main exam. We are going to conduct the exam with the help of Offee tem, Mumbai. Hence you might receive emails / SMS from Offee team. So don’t ignore such mails / SMS. Qualifying exam will be conducted in Kannada / Marathi / English languages based on Karnataka / Maharashtra state syllabus Students who appeared and passed 10th grade exam in 2023-24 academic year are only eligible to write the qualifying exam Exam date, time and place: Area Date Time Place Karnataka students 07.07.2024 (Sunday) 9.30 a.m. K J Somaiya English Medium School, Sameerwdi Maharashtra students (Sakarwadi area) 13.07.2024 (Saturday) 2.00 p.m. Somaiya VidyaMandir School, Sakarwadi Mode of qualifying exam: Exam will be conducted in smartphone. Exam questions will be sent directly to your phone in the exam hall. Hence all students should bring properly working fully charged smartphone. For more information on qualifying exam, please read the details provided in the exam hall ticket by downloading the same. Genera