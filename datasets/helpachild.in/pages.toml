["https://helpachild.in/Home/OurVision"]
title = "Our Vision & Mission | Somaiya Help a Child"
description = "Somaiya education help trust: Our vision & Our mission aim to “We aim of an India where every child completes his or her education“"
full_description = "Vision & Mission Vision An India where every child completes his/ her education irrespective of their financial status. Mission To support ambitious and deserving students to complete their education, enabling them to break free from the cycle of poverty. Objectives To find the means to give financial support to the meritorious and deserving students who otherwise would be unable to pursue their scholastic goals Encourage girl students, in particular, to pursue higher education Provide all materials and assistance required for educational advancement To provide counselling, tutoring, mentoring, support and access to career opportunities upon completion of studies Effecting change on both village and national level by demonstrating the positive effects of higher education"
