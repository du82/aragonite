["https://helpachild.in/Home/Volunter"]
title = "Sign Up To Be a Volunteer | Somaiya Child Helping Trust"
description = "We are inviting Indian youth to be a part of our Volunteer program.Get NGO volunteer registration &play the important role of volunteers in NGO Child Helping Trust"
full_description = "As an organisation working towards the rights of young people to accesses higher education, we strongly believe that the youth of India can be one of our most powerful allies in awareness and fundraising. Young people have enormous potential to change the world around them by educating their peers, parents and teachers. Education should be a right rather than a privilege and by banding together, every deserving child can receive the same chance to access education irrespective of their financial capacity. It is possible to set up Friends of Help A Child awareness club within your school or college to focus on creating awareness or fundraising activities. Students can help out by organizing events on campus, collecting money or setting donation programme for other student and even their teachers. Help A Child is happy to provide any support and materials required as well as award certificates to students for their efforts."
author = "malcolm sheridan"
