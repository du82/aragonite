title = "Home - Connectively"
description = "The Connectively (HARO) platform is now closed. To find out more, click here. The New Home of HARO Join our community of journalists, content creators, PR pros, and subject matter experts to find opportunities for collaboration and brand growth. You'll find all of your favorite HARO features and some exciting new additions here. Submit queries"
full_description = '''The Connectively (HARO) platform is now closed. To find out more, click here. The New Home of HARO Join our community of journalists, content creators, PR pros, and subject matter experts to find opportunities for collaboration and brand growth. You’ll find all of your favorite HARO features and some exciting new additions here. Submit queries to find expert sources, explore and search a feed of queries from journalists, send pitches and track them within the app, and so much more. Who We Serve Journalists & Content CreatorsSubmit queries to find potential sources for your upcoming stories. Our diverse network of experts offer valuable insights and quotes to take your story to the next level. Subject Matter ExpertsBrowse through a feed of queries from journalists looking for experts like you. Highlight your expertise by creating a profile that reflects your unique background and qualifications. PR Professionals Find valuable media opportunities for your clients. Queries from journalists are posted real-time allowing you to pitch your clients any time of the day. Connectively has allowed our agency to look at relevant media opportunities for our clients in a more organized, viewable fashion. And I love being able to create expert profiles for each one of our agency’s clients.Eddie SotoPublic Relations Specialist, The Content FactoryWhat sets Connectively apart for me is its ease of use and flexibility, which are invaluable in my line of work as an SEO freelancer. I love that I can get into the page and sort through all the pitches, search for useful keywords, and check the deadline. The platform has been a game-changer in streamlining my daily tasks, allowing me to focus on what truly matters – delivering results for my clients.Alpana ChandSEO Manager, Sustridge Questions? We’re here to help. Contact Us A Cision Company #overlay { position: fixed; top: 0; left: 0; background: rgba(0, 0, 0, 0.6); z-index: 99999; height: 100%; width: 100%; } #overlay .modal { max-width: 600px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; width: 50%; border-radius: 0.625rem; box-shadow: 0 2px 10px 3px rgba(0, 0, 0, 0.2); } #overlay .modal .content h2 { font-size: 23px; letter-spacing: -2px; } #overlay .modal .content h2, #overlay .modal .content h3 { font-weight: 600; } #overlay .modal .content h2, #overlay .modal .content h3, #overlay .modal .content p { letter-spacing: -1px; } #overlay .modal .content { padding: 2rem; } #overlay .modal .content .description, #overlay .modal .content h2 { margin-bottom: 25px; } #overlay .modal .content #close-modal-btn { width: 100%; border: transparent; background-color: #00607f; border-radius: 0.2rem; color: white; cursor: pointer; font-size: 14px; padding: 12px 25px; text-decoration: none; transition: all 0.2s ease; } #overlay .modal .content #close-modal-btn:hover { background-color: rgb(0, 127, 168); color: #fff; } @media (max-width: 768px) { #overlay .modal { width: 90%; } } window.onload = function() { const isModalDisplayAllowed = () => { const lastClosedTimestamp = localStorage.getItem('modalLastClosed'); const currentTime = new Date().getTime(); // Get current time in milliseconds if (lastClosedTimestamp) { const thirtyDaysInMilliseconds = 30 * 24 * 60 * 60 * 1000; // 30 days const timePassed = currentTime - lastClosedTimestamp; return timePassed >= thirtyDaysInMilliseconds; } // If there's no timestamp, it means the modal has never been closed return true; }; const injectModal = () => { const modalHTML = ` <div id="overlay"> <div class="modal"> <div class="content"> <h2> HARO is now part of Connectively. You're in the right place! </h2> <div class="description"> <h3>Existing customer?</h3> <p> Log in to access the same HARO features and data via the ‘Sign In’ button on the top right of the page. If it's your first time logging in to Connectively, please sign up for an account via 'Join Now' in the navigation menu. </p> </div> <div class="description"> <h3>New customer?</h3> <p> You'll find information about Connectively under 'How It Works’ in the navigation menu. If you want to learn about the expected changes from HARO visit ‘FAQs’ in the footer menu. </p> </div> <button id="close-modal-btn"> Continue to Connectively.us </button> </div> </div> </div>`; document.body.insertAdjacentHTML('beforeend', modalHTML); // Attach event listener to the close button after injecting the modal document.getElementById("close-modal-btn").onclick = () => { document.getElementById("overlay").style.display = "none"; const currentTime = new Date().getTime(); // Get current time in milliseconds localStorage.setItem('modalLastClosed', currentTime.toString()); }; }; if (isModalDisplayAllowed()) { injectModal(); } };'''
year_published = 2022
year_updated = 2024
