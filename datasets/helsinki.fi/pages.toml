title = "University Man­age­ment | University of Helsinki"
description = "The Board is the supreme decision-making body of the University of Helsinki. The University of Helsinki is managed by the rector, vice-rectors and the heads and directors of units. The Chancellor is in charge of promoting science and scholarship and the university’s community relations, as well as overseeing the university’s interests and activities."
full_description = "University Man­age­ment The Board is the supreme decision-making body of the University of Helsinki. The University of Helsinki is managed by the rector, vice-rectors and the heads and directors of units. The Chancellor is in charge of promoting science and scholarship and the university’s community relations, as well as overseeing the university’s interests and activities. The rector manages the University’s operations and is responsible for the efficient, economic and effective completion of the University’s duties. The vice-rectors support the rector in the University’s management. According to the Universities Act, the Chancellor is in charge of promoting science and scholarship and the university’s community relations, as well as overseeing the university’s interests and activities. Back University management Rector, vice-rectors and unit management The Board Chancellor"
