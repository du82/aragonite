title = "Apply to Bachelor's Programme in Science | University of Helsinki"
description = "University of Helsinki offers one Bachelor's Programme in English, the Bachelor’s Programme in Science. The other undergraduate degrees are offered in Finnish and/or Swedish."
full_description = '''Apply to Bachelor's Programme in Science University of Helsinki offers one Bachelor's Programme in English, the Bachelor’s Programme in Science. The other undergraduate degrees are offered in Finnish and/or Swedish. For studies starting in autumn 2025, the application period for Admission Group 1 closed on 16 Jan 2025. Thanks to all the applicants! For Admission Group 2, the application will be open from 11–25 March 2025. To keep updated about future application dates and processes, subscribe to our Admissions Newsletter. Why Bach­el­or's Pro­gramme in Science The Bachelor's Programme in Science offers an interdisciplinary education that will enable you to work on the cutting edge of exciting basic research and application development in chemistry, computer and data science, mathematics and physics. The admitted students have the right, after completion of their BSc degree, to continue in one of the nine MSc programmes of the Faculty of Science at the University of Helsinki. When to ap­ply The Bachelor's Programme in Science has two application periods. The correct application period depends on your previous education. Please note that you cannot select a preferred application period, nor can you submit an application during both application periods. Have you completed, or will complete by summer 2025, one of the following diplomas? Finnish matriculation examination International Baccalaureate diploma European Baccalaureate diploma Reifeprüfung or Deutsches Internationales Abitur examination in Finland If yes, you are in admission group 2 and must submit your application during the application period between 11–25 March 2025 (the application period closes at 15.00 UTC+2). The admission is based on the matriculation examination or equivalent, or the required Open University studies. If not, you are in admission group 1 and must submit your application during the application period between 2 – 16 January 2025 (the application period closes at 15.00 UTC+2). The admission is based on the scores of SAT or ACT tests. If you apply based on secondary education, you cannot select the application period of your preference even if you have two certificates. For example, holders of the Finnish matriculation examination certificate must always apply during the application period for admission group 2. Check out the admission requirements and procedures more in detail at Studyinfo, the Finnish national application portal. Pre­pare your ap­plic­a­tion doc­u­ments in ad­vance When applying to the Bachelor’s Programme in Science, you have to submit all the required documents as instructed and within the deadlines. Ensure that the required educational documents are correctly certified and can be submitted as instructed by the University of Helsinki. If your educational documents require translations, use official translators. You need to meet the English language requirements. Find out how to prove your Eng­lish lan­guage skills. If you must apply in the Admission group 1 on 2 – 16 Jan 2025, you are ranked based on the total score for two SAT or ACT tests. Make sure to register for the test in time! Check the dates and deadlines for the tests on the College Board website and on the ACT website. Please take into consideration that it might take time to complete a language test or get your educational documents certified. Also, if you need to take SAT or ACT tests, you need to register for them before the application period starts. Therefore, it is highly recommended to start preparing your documents well in advance. How to ap­ply When the correct application period for you starts, you must submit your application online at the Finnish national application portal Studyinfo. Please note that the online application form is open and can be submitted only during the application periods. Read the application instructions at Studyinfo carefully. When on the programme page at Studyinfo.fi, click the "Read admission criteria" -button to check the admission requirements and other instructions for your application. Both application processes (admission group 1 and admission group 2) are separate from the Finnish national joint application admissions process. This means that, if you wish, you can apply for another study place also in the Finnish national joint application process for higher education in spring 2025. Then you may be offered more than one study place. However, you can only accept one study place leading to a higher education degree starting the same term. Complete your online application carefully. The application form is available at Studyinfo.fi only during the application period, on the bottom of the programme page. You can find the programme page at Studyinfo.fi. If you are liable to pay the application fee, it will be collected by the Finnish National Agency of Education in connection with filling out the application form. The fee must be paid or you must upload a document proving the exempted category. Otherwise, your application will not be processed. There are no application fee waivers. Once you have submitted your online application form, you will receive a confirmation email. Make sure that you have received the confirmation message within 24 hours of sending the application. If you didn’t receive the confirmation email, please contact the Admission Services by email. Remember to include the required application enclosures to your online application form at Studyinfo or submit them according to the instructions by the application deadline. An applicant who has not proven his or her eligibility by submitting the required enclosures as instructed cannot be admitted to the programme. You can access your online application form and related application enclosure requests at Studyinfo by logging in to My Studyinfo. Submit your application well in advance. The application period always ends at 15.00 Finnish time, which is also when the online application form at Studyinfo will close. As of 1 Jan 2025, non-EU/EEA citizens must pay an application fee when applying to programmes leading to a degree in higher education in Finland (excl. doctoral degrees and Erasmus Mundus programmes). The fee is a one-time national fee of 100 euros that covers all applications to studies beginning in the same academic term. The fee is not collected from applicants who have: a Finnish or EU citizenship, a residence card for a family member of an EU citizen in Finland, a European Union Blue Card, a continuous residence permit in Finland granted on grounds other than studies, a permanent Finnish residence permit, or a long-term resident’s EU residence permit. The Finnish National Agency of Education will collect the application fee in connection with filling out the application form at the Finnish national education portal Studyinfo. The fee must be paid or you must upload a document proving the exempted category. Otherwise your application will not be processed. Unfortunately, it is not possible to get an application fee waiver. The application fee does not guarantee that you will be offered admission to studies. Check the ad­mis­sion res­ults and ac­cept your study place If you applied to the Bachelor's Programme in Science, please read the guide for accepted and rejected applicants. The applicants are informed about the admission results by email to the address submitted on the application form. The admission results will also be available at the My Studyinfo service. Admission group 1: latest by 15 Apr 2025 Admission group 2 (certificate-based): latest by 30 May 2025 Admission group 2 (Open Uni route): latest by 3 Jul 2025 The letter with the admission results will also include information about how to accept the study place. If you are offered a study place, you must accept it no later than 10 July 2025 at 15.00 local Finnish time. If your admission was conditional, remember to submit the required documents by deadline. In addition to accepting the study place, you will also have to register as an attending or non-attending student. However, please remember the one place rule. If you are offered more than one study place, you may accept only one right to pursue studies leading to a higher education degree starting the same term. More information about the provision of one student place. Other useful links Back Apply to Bachelor's Programme in Science Required application enclosures Proving your English language skills Point tables Guide for accepted and rejected applicants'''
