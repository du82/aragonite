description = "The University of Helsinki is Finland’s largest and oldest academic institution. A community of 40,000 students and employees is diversely open, comprehensively quality conscious and joyfully serious. Internationalisation means many things for us. Together we create solutions that will shape the future of our planet and all of humanity."
