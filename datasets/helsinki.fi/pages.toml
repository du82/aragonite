["https://helsinki.fi/en/news/university-social-media"]
title = "University of Helsinki on social media | University of Helsinki"
description = "Research and learning belong to all. For that reason, the University of Helsinki communicates on social media about research, teaching, and events both big and small at the university. We talk about learning, Finnish education, and recent research. We offer research and knowledge as tools for decision making. Follow us on social media!"
full_description = "University of Helsinki on social media Research and learning belong to all. For that reason, the University of Helsinki communicates on social media about research, teaching, and events both big and small at the university. We talk about learning, Finnish education, and recent research. We offer research and knowledge as tools for decision making. Follow us on social media! University of Helsinki social media accounts and hashtags Facebook – University of Helsinki Follow our Facebook page to get the latest popularised news in science and research in the University from all fields. We also provide glimpses into the every-day goings-on at the University! Follow the University of Helsinki on Facebook! X (Twitter) – @helsinkiuni On X, we talk about science and research. We offer expertise and research-based knowledge to support decision making in current issues in society. Our researcher community is strong on X, and we support the impact of their communication efforts. Follow the University of Helsinki on X! Instagram – @universityofhelsinki On Instagram, we use photos and videos to open up a window into studying, teaching and research at our University. You can find the most interesting science news in our Story! Follow the University of Helsinki on Instagram! LinkedIn – University of Helsinki On LinkedIn, we share our researchers' thoughts about how society and life could be improved. We also talk about continuous learning and Finnish education. Follow the University of Helsinki on LinkedIn! YouTube – University of Helsinki Videos about events, reserach, teaching, learning and our researchers! Follow the University of Helsinki on YouTube! TikTok - Helsingin yliopisto Student life and everyday life at the University of Helsinki through the eyes of students. Follow the University of Helsinki on TikTok! Hashtags: join the discussion When talking about the University of Helsinki and the University community, we use these hashtags: #WeareHelsinkiUni #HelsinkiUni #HelsinginYliopisto #HelsingforsUniversitet #UniversityofHelsinki Faculties and other units on social media Faculty of Agriculture and ForestryFaculty of Social Sciences Faculty of Arts Faculty of Biological and Environmental Sciences Faculty of Educational Sciences Faculty of Law Faculty of Medicine Faculty of Pharmacy Faculty of Science Faculty of Theology Faculty of Veterinary Medicine National Library of Finland Open University Think Corner University Library Ruralia Institute Faculty of Agriculture and Forestry @AgriForHelsinki Faculty of Arts @HYhumtdk Faculty of Biological and Environmental Sciences @BioEnvHelsinki Faculty of Educational Sciences @EduSciHelsinki Faculty of Law @HelsinkiLaw Faculty of Medicine @HelsinkiUniMed Faculty of Science @KumpulaScience Faculty of Social Sciences @SocSciHelsinki Faculty of Theology @HelsinkiTheol Helsinki Institute of Life Science HiLIFE @HiLIFE_helsinki Helsinki Institute of Sustainability Science @HELSINKISUS Institute for Molecular Medicine Finland (FIMM), HiLIFE @FIMM_UH Institute of Biotechnology, HiLIFE @BiotechUH IT Center @IT_HelsinkiUni Life Sciences at University of Helsinki @LifeSciHelsinki National Library of Finland: @NatLibFi Neuroscience Center, HiLIFE @UH_Neuro Ruralia Institute @Ruralia_UH Open University @HYAvoin Swedish School of Social Science @sockom1943 Think Corner @Tiedekulma University Library @HULib. National Library of Finland Open University Swedish School of Social Science Think Corner Uni på svenska (about Swedish at the University) University Library National Library of Finland Open University National Library of Finland Open University Think Corner Social media guidelines for University staff The University’s guidelines for social media help establish its digital footprint in a safe and responsible manner. They include instructions, recommendations and information on: Opportunities for experts provided by social media Responsibilities and identity Legislation Challenging situations University practices, account credentials and services Tips for novice and experienced users of social media, supervisors and teacher-researchers Get to know the University of Helsinki social media guidelines! Social media chat rules The University of Helsinki's social media accounts are maintained by the University Communications. The conversations on the social media accounts are monitored during office hours. The University's channels encourage a factual discussion, where critical comments are welcome. When commenting, please follow good manners and respect the views of others. Comments that are based on disinformation or conspiracy theories, contain intimidation or racism, denigrate the dignity of others or call other people names in an offensive manner will be removed or hidden. Marketing messages and spam will also be removed. If a user repeatedly breaks these rules, their account may be blocked. You might also be interested in Back University on social media Social media guidelines"
