["https://helsinki.fi/en/about-us/archive-and-registration-services"]
title = "Archive and registration services | University of Helsinki"
description = "The University’s Archives and Registry, Arkki, is responsible for registering the University’s incoming and outgoing documents. It also serves as the permanent archive for the University’s documents and historical resources and provides information services related to the above documents."
full_description = "Archive and registration services The University’s Archives and Registry, Arkki, is responsible for registering the University’s incoming and outgoing documents. It also serves as the permanent archive for the University’s documents and historical resources and provides information services related to the above documents. Contact details Street address Registry: Main building, Yliopistonkatu 2 (by appointment only) Postal address: Archives and Registry, PO Box 3 (Fabianinkatu 33), 00014 University of Helsinki Contact us: registry@helsinki.fi Customer service phone numbers: 02941 22222 (Registry), 02941 22390 (Archives) Information services We provide information services relating to documents stored in the Archives and the University’s records management system. To ensure smooth service delivery, please send information requests via email to registry@helsinki.fi or call our customer service phone numbers. Email is preferred. When requesting information on confidential documents which can only be disclosed under certain conditions (taking into account the protection of personal data as well as the right-of-access principle), the person making the request must explain how he or she intends to use the information and must prove his or her identity. Requests concerning public documents need not be justified. In the case of extensive requests, the details of the delivery must be agreed in advance. To submit an information request, please complete and print the user commitment form (pdf) and send it to us. Our materials are available in a special reading room at the National Library of Finland and cannot be checked out. Official copies of degree diplomas can be requested from the relevant faculty or Student Services. Extracts from the official Finnish service record (nimikirjanote) up until 2009 can be requested from us. Finnish universities have not kept service records after 2009. Information requests related to applications for open positions should be sent to recruitment@helsinki.fi. For information on requests for rectification to the Academic Appeals Board, please see Legal protection of students. Registration and recording of documents The Registry receives and registers documents arriving at the University. In accordance with the right-of-access principle, the documents can be read in the Registry facilities. Please arrange a visit with the staff in advance. You can deliver documents to the Registry: Via email to registry@helsinki.fi In person By authorising another person to act on your behalf By post The sender is always responsible for documents sent by post. Please take deadlines into account. Documents must be sent to the Registry so that they arrive by the deadline. Electronic documents are not considered to have arrived if their sender cannot be established or the content cannot be opened. Please use a common file format, e.g., Word, Excel, PowerPoint, HTML or PDF. Data protection statements Archives The archival material must be preordered either via Arkki1640-system or by e-mail (registry@helsinki.fi). The research of archival material can be done at the National library Special Collections Reading Room, where the material will be delivered for reading. The delivery time for the material to the reading room is usually 1-2 workdays. In order to visit the Special Reading Room, you will need a national library card which you can either order in advance from the library or visit the National Library Rotunda information desk. The Special Reading Room is open Mon-Tue and Thu-Fri from 10 am – 5 pm, Wed from 10 am - 8 pm. Arkki1640 system The Arkki1640 system contains catalogue information on the archived material in the University of Helsinki Archives. The system also includes digitised documents, including the University of Helsinki annual reports from 1875 to 1994 and printed student catalogues from 1828 to 1916. The database is continuously supplemented and updated. You can browse for information either through the search form (Search) or the tree view (Browse).For instructions on the use of the system, please click on the link to the User Guide.You can submit feedback on the system by email to the Helsinki University Archives.Ordered materials are delivered to the special reading room of the National Library of Finland. Historical resources and registers Student registers are an important series of documents and used extensively in research. These registers contain basic information on all those who have studied (enrolled) at the University of Helsinki. No comprehensive information concerning the period of the Academy of Turku remains, but a database has been created with information on students from 1640 to 1852. Information on those studying between 1853 and 1899 is also available in a separate database. Student registers from 1900 to 1907 are PDF files. The 19th-century student catalogues and registers are interesting not only as sources of genealogical research, but also in terms of other cultural and educational history: they provide micro-historical information on the period of the ascendancy of Finnish culture as well as on several influential Finns. Official Government Directory The Official Government Directory includes basic information on approximately 40,000 public authorities and government employees, and provides a comprehensive and up-to-date overview of Finnish public administration. The book also presents the diplomatic corps and the official bodies of the European Union. In addition, it includes an extensive list of academic degrees and titles as well as Finnish and international medals and decorations. Contact us: valtiokalenteri@helsinki.fi"
year_published = 2025
