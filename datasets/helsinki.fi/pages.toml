["https://helsinki.fi/en/admissions-and-education/apply-bachelors-and-masters-programmes/apply-international-masters-programmes/how-apply"]
title = "How to apply to international master's programmes | University of Helsinki"
description = "Do you want to apply to an International Master’s Programme at the University of Helsinki? This quick guide gives you a general overview of the admissions schedule and the application process."
full_description = "How to apply to international master's programmes Do you want to apply to an International Master’s Programme at the University of Helsinki? This quick guide gives you a general overview of the admissions schedule and the application process. Master's admissions schedule 2 January 2025 at 8.00 (UTC +2): Application period starts and application form opens in Studyinfo. 16 January 2025 at 15.00 (UTC +2): Application period ends and application form closes. The application form cannot be modified after the deadline. 23 January 2025 at 15.00 (UTC +2): Deadline for uploading application documents to the application form. March-April 2025: Eligible applications are evaluated by the master's programmes. Interviews for those programmes that use interviews as part of the admission process. 30 April 2025: Admissions results are published at the end of April at the latest. 30 May 2025 at 15.00 (UTC +3): Deadline for conditionally admitted applicants to submit officially certified educational documents to the Admission Services. 10 July 2025 at 15.00 (UTC +3): Deadline for accepting the admission offer (study place). 5 August 2025 at 15.00 (UTC+3): Admission from the waiting list ends for those programmes that use a waiting list. 1 September 2025 at 15.00 (UTC+3): Deadline for conditionally admitted applicants with an incomplete degree to graduate and submit official proof of the awarded degree to the Admission Services. Deadline for paying the tuition fee for those students who are required to pay tuition fees. Deadline for registering for the academic year. August–September 2025: Studies begin and orientation week. A quick guide to the application process The international Master’s programmes at the University of Helsinki have only one application period per year. Please note that the online application form is available only during the application period. The application period for studies starting in autumn 2025 is from 2 Jan 2025 at 8:00 (UTC+2) to 16 Jan 2025 at 15:00 (UTC+2). To keep updated about the application dates and process, sign up for our Admissions Newsletter. The academic year always begins on 1 August. You can explore the list of our International Master's Programmes and visit their websites to learn more. The admission criteria for each programme are available on Studyinfo.fi. To be eligible to apply to a master’s programme, you must have completed a first- or second-cycle (bachelor's or master's or equivalent) degree. If you complete your degree only after the application period ends, you can still apply as long as you fulfil the other admission criteria. If you are offered a student place, it will be conditional and you must submit proof of your graduation by the date given in the admission criteria. Please note that each Master’s programme has its own criteria on what studies you must have completed previously. Your degree does not always necessarily be from the field of your prospective master’s programme, but you must have completed a sufficient amount of some relevant post-secondary level studies. You must also meet the degree programme-specific language requirements. Find out more about proving your language proficiency. The admission criteria and other programme-specific application information is available in the Finnish national education portal Studyinfo.fi. You can find a direct link on the programme websites or search for your prospective degree programme directly on Studyinfo.fi. When applying to an International Master’s Programme, you have to submit all the required attachmentsas instructed in the application instructions and admission criteria. You must also upload documents for studies completed in Finland, including at the University of Helsinki. Please note that if you do not submit the required attachments, your application will be rejected. During the application phase, it is enough to upload good quality copies of the required attachments to the application form. You do not need to submit officially certified documents during the application phase. If the documents describing your previous education are in a language other than English, Finnish or Swedish, you must also submit authorised translations into one of these languages in addition to the documents in the original language. Please take into consideration that it takes time to complete a language test, if necessary, and to obtain your educational documents. For this reason, it is highly recommended that you start preparing these matters well before the application period begins. The application to the International Master's Programmes must be submitted on Studyinfo.fi. The application period opens on 2 Jan 2025 at 8:00 (UTC+2) and end on 16 Jan 2025 at 15:00 (UTC+2). The application form must be submitted before the deadline. Late applications are not accepted. You cannot save the application as a draft, but you can to edit your submitted application up until the end of the application period. You can only fill in one application form. You can apply to max three Master's programmes with the same application form. If you are liable to pay the application fee, it will be collected by the Finnish National Agency of Education in connection with filling out the application form. The fee must be paid or you must upload a document proving the exempted category. Otherwise, your application will not be processed. There are no application fee waivers. If you are liable to pay tuition fees, you can apply for a scholarship at the same time when applying to an International Master’s Programme. There are no separate scholarship application forms. Information about tuition fees and the scholarship programme. Attach all the required attachments to the application form. You can supplement your application with the required attachments until 23 Jan 2025 at 15:00 (UTC+2) by uploading them to the application form on Studyinfo.fi. Late attachments are not accepted. Please upload only the required attachments. Do not upload any extra attachments. Attachments that are not required are not taken into account in the evaluation and slow down the processing of your application. After you have submitted your application and the required attachments, the application is processed as follows: Minimum requirementsAdmission Services checks that your application and its attachments meet the predetermined minimum eligibility requirements. Academic assessmentIf your application meets the predetermined minimum requirements, Admission Services will send it for assessment by the relevant degree programme. Admission resultsAdmission results for this application round will be published at the latest on 30 Apr 2025. Submitting officially certified documents if you have been conditionally admittedIf you are admitted, you must submit as officially certified or verified documents those educational documents that you uploaded to the application form when applying. The deadline for submitting the verified or officially certified documents is 30 May 2025 at 15:00 (UTC+2). Find out more in detail what happens after you have submitted your application. Good luck with the application process! Allow cookies to display content This content is retrieved from unitube.it.helsinki.fi. Functional cookies must be allowed to view this content. You can change your cookie settings via the cookie management link. You can also find the same link at the bottom of the site. If the content does not appear automatically after accepting cookies, please refresh the page. Change cookie settings Allow cookies to display content This content is retrieved from unitube.it.helsinki.fi. Functional cookies must be allowed to view this content. You can change your cookie settings via the cookie management link. You can also find the same link at the bottom of the site. If the content does not appear automatically after accepting cookies, please refresh the page. Change cookie settings Back Apply to International Master's programmes Explore our International Master's programmes How to apply Eligibility to apply Proving your English language skills Required application attachments After submitting your application Guide for accepted and rejected applicants Scoring per application number International Master's Programmes F.A.Q."
