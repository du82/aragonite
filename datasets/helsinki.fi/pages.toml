["https://helsinki.fi/en/news/war-ukraine"]
title = "The War in Ukraine – University of Helsinki guidelines | University of Helsinki"
description = "This page contains up-to-date information on the effects of the war in Ukraine on the University of Helsinki as well as University-level recommendations and instructions regarding the situation."
full_description = "The War in Ukraine – University of Helsinki guidelines This page contains up-to-date information on the effects of the war in Ukraine on the University of Helsinki as well as University-level recommendations and instructions regarding the situation. The University of Helsinki has condemned the military action by Russia and expressed its support for Ukraine and its university community. We have also expressed our support for Ukraine, together with other Finnish universities, through statements by Universities Finland and the European University Association. As a demonstration of support, we have illuminated buildings in the colours of the Ukrainian flag and raised the flag on our premises. One of the principles of the University of Helsinki is to promote international collaboration in research and higher education, and to support these efforts even in difficult circumstances. Russia’s indefensible military aggression in Ukraine has required exceptional measures, which include those taken in the collaboration between universities. The University of Helsinki is monitoring both national and EU-level sanctions, adapting our policies and processes accordingly. Together with other Finnish and international universities, the University of Helsinki strives to promote the end of military action in Ukraine, while supporting Ukrainian institutions and people. How the University of Helsinki is helping students and employees In the early stages of the crisis, the University reached out to its Ukrainian degree and exchange students as well as employees to offer support. Inclusivity continues to be one of the values of our University. Consequently, all members of the University community are treated in an equal and respectful manner regardless of their nationality. Equal rights apply to everyone, and everyone is entitled to the same services. The University of Helsinki will continue to support staff and students in these challenging circumstances. Staff can contact the occupational health services (link to Flamma), while students can find health-related information in the healthcare and wellbeing section of the Instructions website. The University of Helsinki may grant the right to complete non-degree studies to a person arriving in Finland whose degree studies have been suspended at a Ukrainian higher education institution because of the war. Such rights can also be granted for specific courses or study modules. However, they do not give the person the right to complete a degree at the University of Helsinki. The right to complete a degree can be applied for through regular application procedures. Applications for the right to complete non-degree studies will be processed until the end of 2024 without application periods. Related rights will be granted until 31 July 2025, and no fees will be charged for these studies. For further information on applying and the application form for non-degree studies for those fleeing the war in Ukraine, please see this page. In special cases, the University of Helsinki can offer special arrangements for tuition fee payments to students whose ability to pay has been seriously affected by the war in Ukraine. After being admitted, students must in such cases complete an electronic form. As a demonstration of support, citizens of Ukraine fleeing the war can study free of charge at the Open University of the University of Helsinki until spring 2026. The University of Helsinki and other universities across the globe offer jobs to researchers who have fled Ukraine. These are listed on an international website. In addition, Ukrainian researchers can register in the international Scholars at Risk network. The University supports the research conducted by researchers who have fled the war in Ukraine with a new funding model for salary costs. In the model, 40% of a researcher’s salary is covered by the University’s shared funds for one year. The remaining 60% of the salary is covered by the relevant unit’s own funding sources. Funds have been reserved for 20 researchers. The model can be used for the salary expenses of researchers on the second or third level of the University’s career path hierarchy who have arrived from Ukraine because of the war after 24 February 2022. Instead of implementing an application procedure for the salary support model, units can propose researchers who have arrived from Ukraine to be covered by the model by writing to the service address of their unit’s HR Services team. Donations by the University of Helsinki The crisis fund established by the University of Helsinki for students and researchers remains in operation. The fund supports the transition of researchers and students suffering from Russia’s attack on Ukraine to the University of Helsinki as well as those who are already here and are now facing financial difficulties. Read more about the fund or make a donation. The University of Helsinki has supported victims of the war in Ukraine with a donation of €50,000 to UNICEF. The donation was made from the profit generated by the University of Helsinki Funds. The University Pharmacy has also supported Ukraine in the humanitarian crisis by making two donations totalling €20,000 to those in need. The first donation was made through the Operation Hope group, while the second was made to the Finnish Red Cross Disaster Relief Fund. In addition, the University Pharmacy has closed its pharmacies and discontinued operations in Russia. University units have actively contributed to the protection of Ukrainian students and researchers by acquiring targeted external funding from, for example, the Kone Foundation, the Research Council of Finland and the Finnish National Agency for Education. Collaborative projects with Russia and Belarus For the time being, the University has suspended the promotion of all collaborative projects under development with Russia and Belarus. In accordance with the recommendations of the Ministry of Education and Culture, the University has frozen all institutional collaboration with Russian and Belarusian universities and other organisations. Members of the University community should take note of the fact that the European Commission has ordered the suspension of all RDI cooperation conducted with Russian organisations and coordinated by the Commission, as well as suspended all payments under current agreements to the same organisations. Members of the University community are asked to refrain from any interaction with government agencies of the Russian Federation. The University does not recruit individuals who have an affiliation with a Russian or Belarusian university, unless they give up their affiliation. The University does not recommend using persons currently working at Russian or Belarusian universities as scholarly assessors in recruitment processes or application processes for the title of docent, or to invite such persons to serve as opponents or preliminary examiners. Furthermore, the University does not recommend that its staff serve as assessors in similar assessment situations, or as opponents or preliminary examiners at universities operating in these countries. Travel to Russia or Belarus is not permitted, in addition to which the recommendation applies to events held over remote connections. University units and members of the University community are not to send invitations to researchers at Russian or Belarusian universities or research institutes. Researchers at the University are advised not to initiate new co-authored publications involving researchers affiliated with Russian or Belarusian universities or research institutes. No measures are required from researchers with regard to publications already in the publishing process. The University does not recommend contributions to refereeing research involving researchers affiliated with Russian or Belarusian universities or research institutes. Nor are contributions in any other role recommended to the assessment processes of publication series published in these countries. Ongoing processes need not be adjusted, but it should be noted that the payment of fees to Russian or Belarusian accounts is unlikely to be successful for the time being. The University is restricting access from Russia and Belarus to IT infrastructures as required by the regulations of the Council of Europe (EU 2022/328 and EU 2022/355). Consequently, the use of the University’s VPN service is restricted on the basis of geographical location. Travel to Ukraine, Belarus and Russia should be avoided in accordance with the recommendations of the Ministry for Foreign Affairs of Finland. See the website of the Finnish Immigration Service for information relating to the war in Ukraine. International conferences Researchers affiliated with Russian or Belarusian universities or research institutes should not be invited to conferences and events organised by the University or otherwise organised on University premises. Persons affiliated with Russian or Belarusian universities or research institutes should not be invited to speak at conferences. Affiliations with Russian or Belarusian universities or research institutes should not be indicated in conference attendee lists and related publications. This page was last updated on 21 December 2023. Are you looking for an expert regarding the war in Ukraine? Would you like to consult an expert about the war in Ukraine? Researchers at the University of Helsinki are monitoring the situation and developments in Ukraine and are ready to answer questions. Back News News and press releases War in Ukraine Think Corner Events Public examinations Unitube - videos and live streams Press and media services Newsletters University on social media"
year_published = 2025
