["https://helsinki.fi/en/admissions-and-education/apply-exchange-and-visiting-studies"]
title = "Apply for exchange and visiting studies | University of Helsinki"
description = "Are you considering a student exchange at the University of Helsinki or have you already been nominated by your home university? We look forward to welcoming you as one of the over 1000 exchange students we host each year! It's also possible to apply for a visiting student status if your home university does not have a valid agreement with us."
full_description = "Apply for exchange and visiting studies Are you considering a student exchange at the University of Helsinki or have you already been nominated by your home university? We look forward to welcoming you as one of the over 1000 exchange students we host each year! It's also possible to apply for a visiting student status if your home university does not have a valid agreement with us. Why study with us? See our page for international students to read more about why you should study with us. Besides facts and figures you find our students sharing their experiences with you. If interested, you can even chat with one of our degree students. I am more than grateful for my erasmus experience here. Helsinki will always be in my heart. It is such a beautiful and unique city! What can you study with us? Read more about what you can study with us on our page for international students. Information on specific courses taught in English can be found in our Instructions for students. How to ap­ply? You will find instructions on how to apply as an exchange / visiting student or for thesis research / practical stay in our instructions for exchange and visiting students. In our instructions you find also, among others, the application periods, academic year, and information on course selection and housing. Partner universities Information for our current mobility partner universities and for universities interested in cooperation can be found on our Mobility Partners site. Contact International Exchange Services and Education Cooperation unit International Exchange Services and Education Cooperation coordinates all mobility programs and provides support for international education project funding applications such as Erasmus+ Key Action 2 projects at the University of Helsinki. Email studentexchange@helsinki.fi (mobility partners, exchange and visiting student applicants) staffexchange@helsinki.fi (teacher and staff mobility) exchange-agreements@helsinki.fi (exchange agreements) educationprojects@helsinki.fi (international education cooperation projects) Phone Student exchange: +358 2941 22401 on weekdays between 12–14 Mailing address International Exchange Services and Education Cooperation, P.O. 53, 00014 University of Helsinki, Finland University of Helsinki on YouTube Back Admissions and education Search for programmes and courses Apply to bachelor's and master's programmes Apply to doctoral programmes For international students Open university Apply for exchange and visiting studies Continuous learning Education Apply to supplementary studies Contact admission and student services"
