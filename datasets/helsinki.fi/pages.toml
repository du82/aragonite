["https://helsinki.fi/en/about-us/people/university-services"]
title = "University Services | University of Helsinki"
description = "University services include administration, HR services, teaching and learning services, facilities and properties, financial services, operations management, research services, communications and community relations and administrative services."
full_description = "University Services University services include administration, HR services, teaching and learning services, facilities and properties, financial services, operations management, research services, communications and community relations and administrative services. University Services assists the international University community so that it can focus on research, teaching, studying and public engagement. University Services provides services in a user-oriented and resource-efficient manner to support the completion of the University’s core duties. University Services is headed by the director of administration, and its seven sectors and the Operations Management unit are responsible for the operations. Head of Administration The director of administration, who supports the rector in the management of general University administration, is responsible for the efficient, economical and effective functioning of the University’s administrative operations. HR services HR Services supports the University’s teaching and research by offering services to the leadership, supervisors and staff. We work particularly with the following issues: Development of management and supervisory work Recruitment, talent acquisition and orientation Development of skills and career paths Development of the University organisation and the University’s operational culture Support for the occupational wellbeing of staff Employer–employee cooperation and development of the University as an employer HR systems and processes HR Services has a staff of approximately 120 people. We work in central University-level services, the on-site services of faculties and other units, and Payroll Services. In central services, we develop HR services and processes at the University level. Our on-site services consist of six teams supporting and partnering with units in HR matters. Our Payroll Services are responsible for the University’s payroll management as well as advice on the whole lifecycle of employment. Find out about open opportunities and employment policies at the University Teach­ing and Learn­ing Services We are a unit of roughly 300 professionals operating in five separate service entities. We are responsible for the University’s educational planning, student and career guidance, educational technology, admissions services, mobility services for students and staff, the Student Register, counselling psychologist services, academic administration and support for Swedish-language education. In addition, we are involved in preparing and coordinating strategic decision-making related to university education. Teaching and Learning Services is headed by Director of Development Anu Haapala. Heads responsible for educational planning and student guidance Heads of academic affairs on the campuses: Johanna Harju (City Centre) Anu Holvikivi (City Centre) Christa Koski (City Centre) Mikko Vanhanen (City Centre) Anne Palo (Kumpula) Linnéa Lindh (Meilahti) Terhi Kemilä (Viikki) Maika Strömberg (Viikki) The Strategic Services for Teaching unit is headed by Päivi Pakkanen. The Head of Swedish Affairs is Harriet Lindeberg-Saapunki. Teaching and Learning Services The unit is headed by Kati Kettunen. Guidance coordination services Laura Teinilä International Exchange Services Minna Koutaniemi Service Development: Antero Aunesluoma Student Register Sari Zitting Admission advicing Karolina Kokko-Uusitalo Student admissions Anna-Liisa Kuusela Student admissions Riitta Heinsalo Services for Digital Education and Continuous Learning The unit is headed by Jaakko Kurhila. Continuous Learning: Jenni Krapu Educational Technology Services: Ulla Hemminki-Reijonen Support for Academic Administration: Petri Karttu Digivisio 2030: Pia Saarinen Fin­an­cial services The University of Helsinki’s Financial Services is responsible for the finances, funding and investments of the University of Helsinki, the University of Helsinki Funds, the University of Helsinki Group and the University of Helsinki Funds Group. We are a sector consisting of eight service units and approximately 160 specialists. We are responsible for the University’s accounting, including project accounts, accounts payable and receivable, financial systems, investments, Group finances and legal services as well as financial services for the leadership and various taxation-related tasks. We support the University leadership as well as unit and project leaders in financial decision-making relating to budgets, forecasts, reports, scenarios and other matters. Financial Services is headed by Chief Financial Officer Marjo Berglund. On-site services are headed by heads of fin­an­cial services Senja Kojonen (Viikki Campus) Niko Ossberg (Kumpula Campus) Outi Salonen (independent institutes and University Services) Jessica Vilenius (City Centre Campus, faculties) Sirpa Väisänen (Meilahti Campus and HiLIFE) The spe­cial­ist pro­ject fund­ing team is headed by Jaana Pukkinen Fin­an­cial services for the University lead­er­ship and pro­ject fund­ing team, heads of fin­an­cial services Marika Häggman Päivi Mäntysaari Cent­ral­ised fin­an­cial services Hanna-Katri Keski-Filppula (main accounting team and accounts receivable, including invoicing) Riitta Nikula (accounts payable) Jere Reinikainen (systems) Group fin­an­cial services Anders Ekholm (investments) Heidi Sandvall (Group financial services) Minna Kontro (Group legal affairs) University of Helsinki finances Facilities and properties The University of Helsinki’s Facilities and Properties sector is responsible for the facilities and properties owned and used by the University of Helsinki Group and for duties associated with the ownership, development and management of properties as well as for facility and property services. We support the University’s decision-making by preparing the University’s facilities programme, property development programme, investment plan and construction project plans. We support the University’s operations and their development by ensuring that the University has appropriate, high-quality research facilities as well as working and learning environments. In addition, we ensure the accessibility of facilities and, in accordance with the facilities programme, provide facilities that promote concentration, interaction and inclusivity. We guide, develop and coordinate the University’s facility security and overall security. We support the sustainability and responsibility goals outlined in the University’s strategic plan and develop on-campus ecological sustainability in the areas of circular economy, carbon neutrality and biodiversity. We foster the cultural and historical value of buildings and promote sustainable and high-quality architecture. We also lease facilities in buildings owned by the University of Helsinki Group to external companies. We provide facility and property services in cooperation with the University of Helsinki Property Services Ltd. Housing and accommodation services are provided by Unihome Ltd. Director of properties and facilities is Marita Rovamo. Op­er­a­tions Man­age­ment The Operations Management sector is responsible for supporting strategic planning as well as for operations management, quality management and knowledge production. We support the University leadership in decision-making and knowledge-based management, and coordinate the University’s regional activities. The director of the Operations Management sector is Jussi Karvinen, director of planning. Sup­port for Op­er­a­tions Man­age­ment and Qual­ity Man­age­ment The unit is responsible for preparing, implementing and monitoring the University’s strategic planning and operations management process. Quality management encompasses quality-related documentation, process descriptions, the development of lean operations and the auditing of the University’s quality assurance system. We coordinate the work of the University’s Board and management group as well as the University’s structural development. You can reach us by email at toiminnanohjaus@helsinki.fi. Markus Kajanto Anne Lepistö In­sti­tu­tional Research and Analysis The unit provides the following for knowledge production and knowledge-based management: The University’s annual and interim reports as well as key figures for strategic management Statistics on University operations Analyses of academic rankings Development of the University’s knowledge architecture and knowledge-based management Response services for information requests Matti Kajaste is the head of Institutional Research and Analysis. You can reach us by email at tiedontuotanto@helsinki.fi. Lahti University Cam­pus The Coordination Unit of the Lahti University Campus sees to the joint communications, services and lobbying of the University of Helsinki, LUT University and Aalto University in the Lahti region. The purpose is to bring together individuals, stakeholders and organisations, and create cooperative networks. The Coordination Unit communicates information about the operations of the three universities and organises various events. The unit is also responsible for the coordination and operations of the Päijät-Häme LUMA Centre. The secretary general of the Coordination Unit of the Lahti University Campus is Minna-Maija Salomaa. Mikkeli University Con­sor­tium The Coordination Unit of the Mikkeli University Consortium promotes cooperation between the University of Helsinki, LUT University and Aalto University in the Mikkeli University Consortium as well as their operating conditions, interaction and work with stakeholders in the region. The Coordination Unit is also responsible for organising joint events, training and communication, and developing science education. The secretary general of the Mikkeli University Consortium is Matti Malinen. Research Services University of Helsinki Research Services provides customer-oriented services that support the research of a high international standard conducted at the University of Helsinki, its researcher education, preconditions for research, as well as the impact and applicability of research. Our services are primarily targeted at researchers: We help researchers in obtaining research funding, assist them in project administration while the projects are ongoing, promote the application of research outcomes and business collaboration as well as provide assistance in preparing research agreements. We support laboratory activities by managing equipment maintenance and laboratory staff pools. In addition, we also support the academic leadership in planning and decision-making related to research activities and their development. Research Services is a unit composed of eight different service entities with a staff of approximately 140 specialists. Ritva Dammert is the director of development at Research Services. Research Fund­ing Services Research Funding Services supports researchers, research groups, research consortia and University units in applying for external research funding and in contract negotiations. We communicate funding opportunities, organise training, assist in the development of research plans as well as support and provide consultation together with the other teams and sectors of University Services throughout the application process. We also help at the launch stage of projects and in contract negotiations in cooperation with Legal Services. The campus advisors of Research Funding Services support the management of faculties and other academic units in strategic planning related to research funding. Jukka Reivinen is the head of Research Funding Services. Pro­ject Co­ordin­a­tion Support Project Coordination Support provides coordination support to high-profile research projects receiving external funding where funds can be allocated to administrative purposes. Project coordinators can Manage project reporting and other reports Monitor project finances and assist in HR matters Manage communications tasks and meeting arrangements Assist in applying for new funding Perform other duties related to project administration Sami Ojanen is the head of Services for Project Coordination. Laboratory Services Laboratory Services supports the University’s laboratories in a centralised manner. Our services include Laboratory equipment maintenance Development of processes related to procurement, implementing competitive tendering processes and the preparation of framework agreements Coordination of chemical and gas purchases, use of registers and the organisation of user training Monitoring and administration of official permits Coordination, development and operational support of laboratory staff pools Provision of guidelines on laboratory quality Pekka Joensuu is the head of Laboratory Services. Researcher Training Support Researcher Training Support supports the operations of doctoral schools and doctoral programmes, as well as the implementation of doctoral education in faculties and the University’s strategic projects. In cooperation with doctoral programmes, we prepare their curricula and teaching programmes. Together with doctoral schools, we develop and implement training in researcher skills, professional skills and research management. We provide expert services to develop and support the supervision of doctoral students. We are responsible for supporting the management of doctoral schools and doctoral programmes as well as preparing funding decisions related to doctoral education at the University (e.g., duties of doctoral students and travel grants) and ensuring their implementation. We coordinate and develop doctoral education services as a whole and provide services for doctoral students in collaboration with, among others, Teaching and Learning Services. Erkki Raulo is the head of Services for Doctoral Education. Research Man­age­ment Support Research Management Support supports the University and unit leadership in the strategic leadership of research and in improving the preconditions for research. We perform duties related to research assessment, preparation and presentation and manage the implementation of related decisions. Our unit is responsible for matters related to open and responsible science, research infrastructures and research ethics. We are also responsible for the coordination and monitoring of the University’s Centres of Excellence, Flagship Programmes, profile-building projects and the University’s own research grant applications. Anssi Mälkki is the head of Research Management Support University-level services and Johanna Kolhinen is the head of on-site services on campuses. International Affairs The team supports the University leadership and promotes the University’s strategic objectives for international engagement by coordinating extensive development projects across unit boundaries, strategic partnerships and networks (incl. LERU and UNA Europa). We participate in the strategic development of international activities and the related production of i"
