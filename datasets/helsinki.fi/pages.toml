["https://helsinki.fi/en/about-us/sustainability-and-responsibility"]
title = "Sustainability and responsibility | University of Helsinki"
description = "We promote sustainability and responsibility as well as equality and non-discrimination in all of our operations. We are Finland’s largest and oldest research university, with long-term research as our strength. We foster our history while actively working for a better future. We are contributing to the attainment of the Sustainable Development Goals of the UN through the power of knowledge – for the world."
full_description = 'Sustainability and responsibility Values and strategy guide our actions Our values and our strategy 2021–2030, "With the power of know­ledge – for the world", guide our choices and actions. In line with our strategy, we will cultivate our global responsibility and sustainable development by actively participating in international debates, projects and the drafting of research programmes and policies. As the knowledge generated by the University will support society in its path towards sustainability, we will be considered a knowledgeable and attractive partner. The goals of the UN’s 2030 Agenda will provide a framework for sustainable development and responsible action. CURRENT NEWS ON SUSTAINABILITY AND RESPONSIBILITY Sustainability and responsibility are broadly reflected in the University’s operations and research. Among other things, we examine society, equality and social structures as well as climate change and biodiversity. Read the current news on the University’s operations and our latest research. Back Sustainability and responsibility Leadership and monitoring of sustainability and responsibility efforts Sustainability research Sustainability in education Sustainable partnerships Sustainable and equal campus Take part in the promotion of sustainability Equality, diversity and accessibility Ethical Guidelines Contact persons for sustainability and responsibility at the University'
