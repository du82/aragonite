description = "The University of Helsinki has big ambitions that reach far beyond the borders of Finland. We strive to solve global challenges with the help of our groundbreaking basic research, high-quality education and a strong commitment to collaboration. Building partnerships with actors from all over the world is central to this goal and gaining global perspectives are key for our impact."
