["https://helsinki.fi/en/about-us/processing-data-university/data-protection"]
title = "Data protection | University of Helsinki"
description = "At the University of Helsinki, we value your privacy and your right to protect your personal data. Everyone has the right to know what data concerning them are being kept and how those data are processed. On this website, we collect data protection statements pertaining to the processing of personal data at the University of Helsinki."
full_description = "Data protection At the University of Helsinki, we value your privacy and your right to protect your personal data. Everyone has the right to know what data concerning them are being kept and how those data are processed. On this website, we collect data protection statements pertaining to the processing of personal data at the University of Helsinki. Information about cookies and the processing of personal information on our website can be found on the page website and cookies. For questions about data processing, contact details are available in the relevant data protection statement. The data protection officer of the University of Helsinki can be reached at tietosuoja@helsinki.fi. Studying and services related to studying Contact information for question about data processing hakijapalvelut@helsinki.fi Why do we process your personal data? The University of Helsinki processes the personal data of applicants to carry out procedures for admitting new students. When you apply for admission to the University, your personal data are processed for the following purposes: Provision of information on studies and admission Fulfilment of admission-related tasks Marketing communication related to scholarly research and the provision of education Proceedings related to any appeals and cases brought before the administrative court Other admission-related purposes Individual arrangements We process the personal data you provide to us so as to make individual arrangements related to entrance examinations. This processing is based on the information you provide in your application for individual arrangements and its attachment(s), such as a doctor’s certificate and/or other expert statements. Based on your consent, your data can also be used to plan other study-related individual arrangements if you are offered a place and accept it. What is the lawful basis for processing? The processing of personal data is based on the performance of a task carried out in the public interest or in the exercise of official authority, compliance with a legal obligation and, in certain cases, on consent. Relevant regulations: Universities Act (558/2009) and the decrees issued pursuant to it Government Decree on University Degrees and Professional Specialisation Programmes (794/2004), including amendments Act on the National Registers of Education Records, Qualifications and Degrees (884/2017), Chapter 5 General Data Protection Regulation (EU, 2016/679) and supplementary national legislation Act on the Openness of Government Activities (621/1999) Administrative Procedure Act (434/2003) Non-Discrimination Act (1325/2004) Act on Health Care Professionals (559/1994) What kind of personal data do we process? The University processes the following personal data: Identifying information (name, personal identity code, date of birth, application/applicant number) Background information (citizenship, gender, native language) Contact details (email, phone, postal address) Preferred application options Information related to applying to a degree programme Information based on the application and admission criteria Information on the applicant’s education, degrees and work experience Information on health issues affecting the applicant’s admission (yes/no) and, in the case of applications for specialist training in medicine, the number of sick days (if relevant for calculating work experience) Entrance examination answers Any motivation letters or tests associated with admission as well as recorded video interviews Information on admission results (entrance examination results and other information on admission, including scores) Information on acceptance of an offered place Consent or prohibition by the applicant on publishing their admission result Any other information related to admission Individual arrangements If you apply for individual arrangements, we will process not only the data mentioned above, but also the personal data you provide in your application and its attachments: Information about the applicant Description of the necessary arrangement and its justification Other considerations In addition, the attachments may include a copy of a doctor’s certificate. Applications for, and decisions on, individual arrangements are confidential and handled at the University by a specific group of staff. What are the sources for personal data? Information on applicants is collected from the following sources: The applicant The Studyinfo service, the SURE register of completed studies, the VIRTA student information system and the VTJ Population Information System International application and degree systems or services that deliver documents concerning the educational background of applicants Finnish and international organisers of language tests Finnish and international higher education institutions Online payment and registration services Assessors of applications and entrance examinations The JulkiTerhikki register of social welfare and healthcare professionals Information may also be derived or obtained through observations of the use of IT services and equipment provided by the University to the applicant, or information may be collected by the management and surveillance services used at the University (e.g., camera surveillance). Retention times Storage periods are based on current legislation and the University of Helsinki’s archiving plan. The following data are stored permanently: Admitted applicants: Learner ID and personal identity code or other equivalent identifying data Admitted applicants: information on the applicant’s right to study leading to a degree and information on acceptance of an offered place Decisions on appeals concerning admission In addition, other personal data concerning applicants may be stored permanently upon the decision of the National Archives of Finland. Storage periods of personal data not stored permanently: Entrance examination answers, six months Lists of scores, at least one year Unsuccessful applications, two years Successful applications, 10 years Lists of applicants, 10 years Appeals against admission decisions, 10 years Do we disclose your personal data to third parties? Personal data are disclosed to the following recipients: Registers of higher education institutions involved in Finnish and international joint programmes KOTA database of the Ministry of Education and Culture Internationalisation Services of the Finnish National Agency for Education Social Insurance Institution of Finland (Kela) National Supervisory Authority for Welfare and Health Valvira through the national data warehouse for higher education Employment authorities Register of Aliens of the Finnish Immigration Service Studyinfo service of the Finnish National Agency for Education TE Services (enquiries) In addition, the University may disclose the personal data of applicants For scientific research purposes in the public interest For the purpose of meeting obligations set by the Act on the Openness of Government Activities (621/1999) or other legislation When verifying the educational background and/or language skills of applicants, to language test organisers or organisations responsible for providing documents concerning the educational background of applicants With the consent of the applicant, contact details to parties outside the University for marketing communications and other specific purposes Information on individual arrangements is processed at the University only by those who implement individual arrangements for entrance examinations. We will not disclose your application data outside the University of Helsinki. In the case of cooperation related to entrance examinations with other universities, we may, if necessary, provide information on individual arrangements granted to you to the other universities involved in the cooperation. Do we transfer your data outside the EU/European Economic Area? Personal data may be transferred outside the EU, for example, when verifying the validity of certificates granted to an applicant outside the EU. The University exercises particular care if personal data are transferred outside the EU and the European Economic Area (EEA) to countries that do not ensure data protection in line with the General Data Protection Regulation (GDPR). Personal data are transferred outside the EU and EEA only when necessary, and the transfers are made in accordance with the requirements of the GDPR, for example, using the standard contractual clauses approved by the European Commission. Contact information for question about data processing registrar@helsinki.fi Why do we process your personal data? The University of Helsinki must process your personal data for purposes including the following: Student admissions Organisation of teaching and decisions concerning studies Student guidance Course registrations Restoration of completed studies, assessment and registration Preparation of degree diplomas In addition, the University can process your personal data for the following purposes: Development of teaching (e.g., with feedback collected from students) Scientific research the compilation of statistics and reportage Marketing communications related to studies The safety of students and other members of the University community, the physical safety of the study environment and the protection of data, or Other specific purposes What is the lawful basis for processing? The use of personal data is primarily based on legislation concerning the University of Helsinki and the organisations operating in the University community. In specific cases, the basis for processing data is consent given by the student. Therefore, the right of the University as the controller of the data file is based on A task carried out in the public interest or in the exercise of official authority vested in the controller Compliance with a legal obligation to which the controller is subject In certain cases, the performance of a contract or consent given by the data subject As a rule, the University has the right to process sensitive data as the controller of the data file in the following cases: When necessary for reasons of substantial public interest In certain cases when the data subject has given explicit consent to the processing of certain personal data Relevant regulations Universities Act (558/2009) Government Decree on University Degrees (794/2004) Act on national study and degree registers (Laki valtakunnallisista opinto- ja tutkintorekistereistä) (884/2017) EU General Data Protection Regulation (2016/679) and supplementing national regulations Personal Data Act (523/1999) and the Data Protection Act (XXX/2018), which will supersede the former Act on the Openness of Government Activities (621/1999) Regulations of the University of Helsinki Regulations on Degrees and the Protection of Students’ Rights at the University of Helsinki Decisions by the University and the rector concerning teaching and studying at the University of Helsinki Standing regulations of the University of Helsinki faculties What kind of personal data do we process? The University of Helsinki processes personal data from which you can be identified directly or indirectly. Direct identifiers include the personal identity code and student number. We will also process your name and contact details, in addition to which the University processes other information related to your studies from which a third party may identify you by connecting the details. The details most commonly processed in conjunction with studying and completed studies are the student’s name, student number and contact details, as well as details on the degrees pursued and the content of studies. Here are examples of the data processed by the University of Helsinki: Persons applying to study at the University (applicants), their basic details and application information Basic student details (e.g., student number, personal identity code, name and contact details) Students’ study rights Students’ term registrations Students’ completed studies, traineeships and theses/dissertations Teachers and related information on teaching Students’ registrations for teaching Students’ student feedback details Details related to students’ career and employment services and surveys Membership in the Student Union and its special status associations Data related to grants Data related to international student exchange Basic details on the staff involved in supporting students and teachers (e.g., name and work-related contact details) What are the sources for personal data? Some required personal details come from yourself, which makes you responsible for their validity. A right to study is personal. Thus, your personal details must be valid. Certain details have been collected from other parties, including: Details concerning the acceptance of a student place are gained from a national student admissions register (Act 884/2017) maintained by the Finnish National Agency for Education and from documents submitted by the student. The validity of name and contact details is verified from the Population Register Centre. Retention times The storage period for personal data stored in University of Helsinki systems and data processed manually is based on legislation in force and the archiving plan of the University of Helsinki. In observance of the legislation concerning universities (Sections 25 and 27 of act 884/2017), the University of Helsinki stores the following personal details related to teaching permanently: Student numbers and personal identity codes or equivalent identifiers Information on completed degrees and specialist training, as well as all completed studies and their grades Information on rights to complete studies leading to a degree and specialist training, as well as information on the acceptance of a student place and registration for studies leading to a degree and for specialist training. Information on storage periods for other data is available in the archiving plan of the University of Helsinki. Do we disclose your personal data to third parties? Personal data is primarily processed by the staff of Teaching and Learning Services and the teaching staff. In addition, personal data can be processed by the following units: IT Centre, HR Services, Financial Services, as well as Communications and Community Relations. The University of Helsinki may also use external parties to process personal data, such as businesses that provide system services and process personal data on behalf of the University of Helsinki on the basis of a mandate. The University of Helsinki discloses required student personal data to the following recipients, either through the national data warehouse for higher education or directly: Finnish Student Health Service Ministry of Culture and Education Internationalisation Services of the Finnish National Agency for Education Student admissions registers Study credit, degree "
year_published = 2025
clearnet = "https://helsinki.fi/en/about-us/processing-data-university/data-protection"
