["https://helsinki.fi/en/faculty-agriculture-and-forestry"]
title = "Faculty of Agriculture and Forestry | University of Helsinki"
description = "Research and education for a sustainable future"
full_description = "Faculty of Agriculture and Forestry News EVents Science-based perspectives and methods for meeting future challenges in agriculture, food production and forestry We are a nationally unique faculty with a high international standing. We produce new research-based knowledge and train experts of sustainable bioeconomy and related business operations for the needs of society and industry. Our research and education are focused on questions relating to the utilisation of renewable resources, agriculture and food, forests and materials, as well as waterways and water use. Our Faculty is located on Viikki Campus in Helsinki, which includes the Viikki Research Farm, a number of greenhouses and the Viikki Arboretum. The Ruralia Institute operates in Seinäjoki and Mikkeli. Hyytiälä Forest Station in Juupajoki specifically serves research and teaching related to forest and atmospheric sciences."
year_published = 2025
