["https://www.hempuli.com/gdpr.html"]
title = "Arvi Teikari"
full_description = '''Here's my privacy statement:You have the right to know what data has been stored regarding you, the right to see this data and have it sent to you if you want, the right to refuse from your personal data being collected, and the right to be "forgotten" so that all identifiable data stored regarding you is removed, along with other rights specified in the legislation. If you feel that Hempuli.com might have stored data regarding you, you can request to see all of it and/or ask for it to be removed by e-mailing mail@hempuli.com; do note that you need to provide me with proof that you're actually the person you claim to be, so for example send the e-mail from an address that matches the one you used when leaving a comment or such. If you wish to be forgotten, I'll delete said data in a week after receiving your request (including the request itself.) I promise I handle all the data I do get as securely as I can. Here's a list of all the potential things on or available from this website that have stored/store data from the users:- HostMonster, the company from whom I've bought this domain, has told me that the website itself is GDPR-compliant. There were some logging tools enabled, but they should be disabled now and the data stored in them removed.- I have a WordPress-based blog, it stores your nickname, e-mail address, comment, IP-address, website and a timestamp when used. Wordpress also needs cookies to be functional, as far as I know. I sometimes also embed imgur/Youtube or other services to my blog posts, so their policies may affect things when you browse the blog.- The website uses a MailChimp-powered form for subscribing to a newsletter. I've attempted to disable as many of MailChimp's in-built cookie/analytics features. If you subscribe to the newsletter, you acknowledge that your information will be transferred to Mailchimp for processing. Learn more about Mailchimp's privacy practices.- Some of my older games, namely Excavatorrr, CWOUN, Sticky and Paradise Fort, have online scoreboards that store the username, IP address, date & time of entry, in-game score and possibly some metadata about the run (such as items collected in the case of CWOUN) in an SQL database.- I used to have a public comment page on the website that stored the comment, IP address, e-mail address, nickname, homepage and date when used. This comment page is no longer around, but the comments are stored still.- I have a personal contact list of people I've worked with or with whom I might want to work in the future, gathered from e-mails, containing names, e-mail addresses, twitter handles and notes so that I remember who's who.- Environmental Station Alpha's website used Amazon's cloud services for hosting images. These are now locally hosted, with the change made on 4th of June, 2018.'''
