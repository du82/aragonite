["https://www.hempuli.com/blog/index.php"]
title = "Hempuliʼs blog"
description = "Posts about games and other things"
full_description = '''Monthly update: February 2025Posted on 2025-02-25 17:29 I got my cast off, yay! Returning to my normal schedule has still been an ongoing process, but I've gotten a bunch of gamedev done nonetheless. Unfortunately I've been feeling somewhat under the weather for the past several weeks, causing my productivity to fluctuate a bunch. Hopefully it'll pass soon. In any case, I managed to release 2 small things - firstly The Plumber Thing: Early Years, seen above, a small project inspired by AuthorBlues' judging of the Questionable Level Design Contest, a Super Mario World romhacking event. AuthorBlues' streams of the judging process have been a joy for years and I had an idea that I felt could've fit into the QLDC submissions. I also made a tiny one-day project, Baba Is Quiz, after doing a Valentine's Day personality quiz and being unhappy with the results. It's a very very silly thing and shouldn't be taken seriously. But can you find the secret ending? Play The Plumber Thing: Early Years Do Baba Is Quiz 2 Monthly update: January 2025Posted on 2025-02-09 13:27 I haven't really been able to do much gamedev with my thumb in a cast, but aside from playing all those Sokpop games I've gotten a bit of boardgame designing done. The design for this particular game, tentatively titled "9 minutes to terminus", isn't quite done, but I nevertheless entertained myself by creating assets for it in Inkscape and printing them at a local print shop. The results look pretty nice, I'd say! I suspect that the game won't be that amazing even once I'm happy with the rules, but it has served an important purpose in that it has helped me overcome my difficulties with designing boardgames for more than 2 players a bit. Regarding the fractured thumb: I got the Kirschner wire removed & my cast off last Tuesday, and met with a physiotherapist on Thursday on how to train my thumb to get back into action. It's still very much a work in progress, but at least the fracture has healed properly. I feel like I've lost most of my gamedev momentum during the recovery process, but I'll have to try to get back to it. Hopefully I'll manage to restart my weekly streams next week. Also in other news, a couple days ago I saw Vilma sleeping with her head resting on Fondue's butt: 2 1'''
