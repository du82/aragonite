["https://herbie.uwplse.org/doc/2.2/input.html"]
title = "Herbie Input Format"
full_description = "Herbie uses the FPCore format to specify an input program, and has extensive options for precisely describing its context. The Herbie web shell takes input in a subset of the math.js syntax. The web shell automatically checks for syntax errors, and provides a graphical user interface for specifying the input domain. The web shell converts the mathematical expression and input ranges into FPCore before sending it to Herbie. Herbie's command-line and batch-mode tools use FPCore format to describe mathematical expressions. FPCore looks like this: Each input is a variable name, like x, used in the expression. Properties are used to specify additional information about the expression's context. If name is specified, the function can be referenced in subsequent FPCore declarations in the file. The expression is written in prefix form, with every function call parenthesized, as in Lisp. For example, the formula for the hypotenuse of a triangle with legs a and b is: The semicolon (;) character introduces a line comment. We recommend the .fpcore file extension for Herbie input files. Herbie supports all functions from math.h with floating-point-only inputs and outputs. The best supported functions include: Herbie links against your computer's libm to evaluate these functions. So, each function has the same behavior in Herbie as in your code. You can instead use the racket precision if you instead want reproducible behavior. In both let and let*, each variable is bound to its value and can be used in the body. The difference between let and let* is what order the values are evaluated in: Internally, Herbie treats intermediate values only as a notational convenience, and inlines their values before improving the formula's accuracy. Using intermediate variables will therefore not produce a more accurate result or help Herbie run faster. In some cases, your input program is an approximation of some more complex mathematical expression. The :spec (for “specification”) lets you specify the more complex ideal case. Herbie will then try to modify the input program to make it more accurately evaluate the specification."
year_published = 2025
clearnet = "https://herbie.uwplse.org/doc/2.2/input.html"
