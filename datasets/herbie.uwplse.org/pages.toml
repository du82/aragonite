["https://herbie.uwplse.org/doc/latest/error.html"]
title = "What is Error?"
full_description = '''Herbie helps you identify and correct floating point error in your numeric programs. But what is floating point error, and how does Herbie measure it? When Herbie reports a "percentage accuracy" number like 92.3%, it's usually best to think of that as the percentage of floating-point inputs where the expression is reasonably accurate. The impact of this error on your application will depend a lot on which 7.7% of inputs are inaccurate, and what kind of error that is. You can find this out using the accuracy graph in Herbie reports. You can also use preconditions to restrict the inputs Herbie is considering. In mathematics, we work with real numbers, but on a computer, we typically use floating-point numbers. Because there are infinitely many real numbers, but only finitely many floating-point numbers, some real numbers can't be accurately represented. This means that every time you do an operation, the true result typically has to be rounded to a representable one. Take an extreme example: the code 1e100 + 1, which increments a huge number in IEEE 754 double-precision floating-point. There's an exact real-number answer, a one followed by 99 zeros and then another 1, but the closest floating-point value is the same as 1e100. Errors like this can cause problems. In the example above, the answers differ by one part per googol, which is pretty small. But the error can grow. For example, since 1e100 + 1 rounds to the same value as 1e100, the larger computation There are lots of ways to measure how much rounding error there is in a computation. Most people find the notions of absolute and relative error most intuitive, but Herbie internally uses a more complex notion called bits of error. The bits of error metric imagines you have a list of all of the possible floating-point numbers, from largest to smallest. In that list, compare the floating-point value you computed to the one closest to the true answer. If they are the same, that's called 0 bits of error; if they are one apart, that's called one bit of error; three apart is two bits of error; and so on.'''
year_published = 2025
clearnet = "https://herbie.uwplse.org/doc/latest/error.html"
