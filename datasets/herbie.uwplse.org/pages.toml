["https://herbie.uwplse.org/doc/latest/release-notes.html"]
title = "Herbie 2.1 Release Notes"
full_description = "The Herbie developers are excited to announce Herbie 2.1! This release focuses performance, both in the generated code and in the Herbie kernel itself. What is Herbie? Herbie automatically improves the accuracy of floating point expressions. This avoids the bugs, errors, and surprises that so often occur with floating point arithmetic. Visit the main page to learn more about Herbie. OOPSLA, ASPLOS, and POPL Reviewers, please do not read further, because some of the work described below is submitted for publication to these venues. Last year, Herbie 2.0 released pareto mode, in which Herbie generates multiple expressions with different speeds and accuracies. Herbie 2.1 now makes Herbie's generated code, especially at the highest-performance/lowest-accuracy level, dramatically better. Some features that contribute to these improvements: While Herbie's generated results are much better, these changes alone would make Herbie more than twice as slow. This leads to the second category of changes. Nearly every part of Herbie has been sped up, often significantly, meaning that Herbie 2.1 overall—despite the much faster generated code—is only 20% or so slower than Herbie 2.0. The most challenging improvement is a complete rewrite of Herbie's real evaluation system, Rival. Herbie 2.1 uses precision tuning to reduce the time and memory costs by approximately 40%, with the biggest impacts to the largest and slowest expressions. Moreover, Rival has been packaged for use in other projects. Two new features are in development and available in an undocumented alpha state in this release: platforms and explanations. Platforms allow Herbie to generate code specific to a given programming language, library, or hardware platform. Herbie can use platform-specific operators, cost models, and compilation styles, which leads to faster and more accurate code. We hope to clean up the platforms code and release it for real in Herbie 2.2. Explanations describe what floating-point errors Herbie found and what inputs they occur for. This should make Herbie easier to understand and a more valuable tool for learning about floating-point error."
year_published = 2025
clearnet = "https://herbie.uwplse.org/doc/latest/release-notes.html"
