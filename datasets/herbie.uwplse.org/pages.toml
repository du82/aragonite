["https://herbie.uwplse.org/doc/latest/api-endpoints.html"]
title = "Herbie HTTP API Endpoints"
full_description = '''The Herbie API allows applications to interface with Herbie using HTTP requests. The API is designed to be stateless: the order in which endpoints are called shouldn't matter. All the endpoints listed below respond to POST requests unless otherwise specified. A typical example of sending a POST request to a running Herbie server is: The sample endpoint allows the user to request a sample of points given the FPCore expression and a seed. Returns a collection of points and the exact evaluation of each point with the given spec. The results are returned through the "points" field and are represented by an array of point-exact pairs with the first value representing the point and the second value representing the exact evaluation; the exact value of point n is points[n][1]. Herbie calculates the "ground truth" by calculating the values with more precise numbers. This can be slow. The exacts endpoint allows the user to request the exact value of a set of points evaluated at a real number specification given as an FPCore expression. Returns a collection of points and the exact evaluation of each point with the given spec. The results are returned through the "points" field and are represented by an array of point-exact pairs with the first value representing the point and the second value representing the exact evaluation; the exact value of point n is points[n][1]. Herbie calculates the "ground truth" by calculating the values with more precise numbers. This can be slow. The calculate endpoint allows the user to request the evaluation of a set of points evaluated at a floating-point implementation given as an FPCore expression. Returns a collection of points and the evaluation of each point using the given FPCore as a floating-point implementation. The results are returned through the "points" field and are represented by an array of point-exact pairs with the first value representing the point and the second value representing the evaluated value; the evaluated value of point n is points[n][1].'''
year_published = 2025
clearnet = "https://herbie.uwplse.org/doc/latest/api-endpoints.html"
