["https://herbie.uwplse.org/doc/latest/options.html"]
title = "Herbie Command-line Options"
full_description = "The herbie command has subcommands and options that influence both its user interface and the quality of its output. There are a few different methods for interacting with Herbie, which we call tools. For example, Herbie can be run both interactively or in batch mode, and can generate output intended for the command line or for the web. Herbie provides four of these tools as subcommands: We recommend web which produces reports with lots of information about floating-point accuracy, including graphs of error versus input values and plots comparing cost and accuracy. This can help you understand whether Herbie's improvements matter for your use case. Use herbie tool --help to view available command-line options for a tool. This command also shows undocumented subcommands not listed on this page. These options can be set on any tool. Pass them after the tool name but before other arguments, like this: The web tool runs Herbie and connects to it from your browser. It has options to control the underlying web server. Herbie uses rewrite rules to change programs and improve accuracy. The --disable rules:group and --enable rules:group options turn rule sets on and off. In general, turning a ruleset on makes Herbie produce more accurate programs. These options change the types of transformations that Herbie uses to find candidate programs. We recommend sticking to the defaults. Each option can be turned off with the -o or --disable command-line flag and on with +o or --enable. Turning an option off typically results in less-accurate results, while turning a option on typically results in more confusing output expressions."
