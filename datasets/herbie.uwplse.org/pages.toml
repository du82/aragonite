["https://herbie.uwplse.org/doc/latest/plugins.html"]
title = "Herbie Plugins"
full_description = "Herbie plugins define new functions, add rewrite rules, and number representations. Users install plugins separately, and Herbie then automatically loads and uses them. This plugin uses the SoftPosit library, only supported on Linux. Even then is reported to misbehave on some machines. The plugin supports arithmetic operations, sqrt, and quires. Once softposit-herbie is installed, specify :precision posit16 to inform Herbie that it should assume the core's inputs and outputs are posit numbers. Other posit sizes (with 8 or 32 bits) and also quires (for 8, 16, and 32 bit posits) are available, but are poorly supported. The float-herbie plugin implements support for any IEEE-754 binary floating-point number. To install, check out the source code and run at the top-level directory of the repository. Once float-herbie is installed, specify :precision (float ex nb) to inform Herbie that it should assume the core's inputs and outputs are floating-point numbers with ex exponent bits and nb total bits (sign bit + mantissa bits + exponent bits). The fixedpoint-herbie plugin implements support for any fixed-point number. To install, check out the source code and run at the top-level directory of the repository. Once fixedpoint-herbie is installed, specify :precision (fixed nb sc) to inform Herbie that it should assume the core's inputs and outputs are signed fixed-point numbers with nb total bits and a scaling factor of 2sc (integer formats have a scaling factor of 20). This plugin also supports unsigned fixed-point numbers specified by :precision (ufixed nb sc) and provides simpler aliases for integer formats with :precision (integer nb) and :precision (uinteger nb). The following is a guide to creating a Herbie plugin. Plugins are considered experimental and may change considerably between releases. If you run into issues, please file a bug. Be sure to check out the built-in plugins in the Herbie repository before getting started. First Steps All plugins are implemented as Racket packages. The easiest way to initialize a new Racket package is to run"
