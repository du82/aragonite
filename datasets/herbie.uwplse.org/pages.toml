["https://herbie.uwplse.org/doc/latest/using-web.html"]
title = "Using Herbie from the Browser"
full_description = '''Herbie rewrites floating point expressions to make them more accurate. Herbie can be used from the command-line or from the browser; this page is about using Herbie from the browser. The Herbie web shell lets you interact with Herbie through your browser, featuring a convenient input format. The web shell is the friendliest and easiest way to use Herbie. Run the Herbie web shell with this command: You can type an input expressions in standard mathematical syntax. After typing in an expression, you will be asked to specify the range of values for each input variable that Herbie should consider when trying to improve the expression. Hit the "Improve with Herbie" button once you're done to run Herbie. The web shell can also automatically save the generated reports, and has many other options you might want to explore. This command generates a report from the input expressions in bench/tutorial.fpcore and saves the report in the directory output/. It's best if that directory doesn't exist before running this command, because otherwise Herbie may overwrite files in that directory. Occasionally you may also see Herbie emit warnings as shown above. All of Herbie's warnings are listed, with explanations, in the FAQ. The report Herbie generates is in HTML format so you'll need to start a web server. If you have Python installed, that's particularly convenient: Then go to localhost:8000 in your favorite browser. The report summarizes Herbie's results for all expression in your input file, and you can click on individual expressions to see Herbie's output for them. Batch report generation is the most informative way to run Herbie on a large collection of inputs. Like the web shell, it can be customized through command-line options, including parallelizing Herbie with multiple threads.'''
