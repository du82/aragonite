["http://www.herbstevenson.com/chapters/individual-intervention-chapter-6.php"]
title = "A Case Study: Individual Intervention | Chapter 6"
description = "Herb Stevenson is owner of Cleveland Consulting Group, LLC, a company dedicated to using innovative methods to help organizations and executives discover new ways of 'being' that lead to profound changes. Herb has designed and successfully led large system changes including the turnaround of nine failing financial institutions as well as supported executives in massive reorganization planning and implementation processes. He has supported executives seeking to enhance/change their focus or image, as well as how to return to industry from external coaching/consulting. Finally, he has supported individuals during their business start-up processes."
full_description = "To continue the work completed in the team intervention (Part IV of this book), one of the team members, the native American male, sought permission from the agency to continue the project as an individual. Permission was granted by the CEO and thee Board of Directors. The agency had been made aware of the incongruence between the internal and external cultural expressions of the organization. It had been made clear that the organization had developed and maintained “vanilla” marketing materials for fear of reprisal from government and grant funding sources for being “too black”. Seeking to continue the visioning process, the author was enlisted from the intervention team to assist the organization through the process. The task would be to create a culturally congruent vision statement, mission statement, and core values that are consistent and shared by each person throughout the organization including external marketing and other publicly available materials, The team intervention had revealed that the agency was constantly in motion. The organization’s culture is focused towards service of clients. As such, people moved in and out of meetings like a recycling water fountain. To accommodate this style of operation, meetings were loosely framed similar to open space technology. (Owen, 1997a; Owen, 1997b). During discussions with the officers, managers, and directors, it appeared that the traditional visioning process (Abrahams, 1995; Campbell, 1997; Carver, 1997; Johnson, 1999; Jones & Kahaner, 1995; Kouzes & Posner, 1995; Lewis, 1997; Nanus, 1992; Wall, Sobol, & Solum, 1992; ) was not congruent with the needs of the organization. Prior experience with traditional approaches to visioning had not resulted in culturally inclusive marketing materials. Furthermore, as the active founder of a spiritually-based, national, “rites of passage” program, it appeared to the author that an alternative approach would be more applicable. The author suggested the use of the spiritually based visioning process used by indigenous cultures (Brown, 1988, Deloria, 1996, Riddington, 1996, Foster, 1992) and by many religions (Ensley, 2000, Torrance, 1994). The CEO agreed that an alternative approach, one that is more spiritually based, might better serve the needs of the agency. Nonetheless, certain criteria are important to the successful development and implementation of a vision regardless of the approach."
year_published = 2025
