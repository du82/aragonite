["http://www.herbstevenson.com/chapters/team-intervention-chapter-4.php"]
title = "A Case Study: Team Intervention |  Chapter 4"
description = "Herb Stevenson is owner of Cleveland Consulting Group, LLC, a company dedicated to using innovative methods to help organizations and executives discover new ways of 'being' that lead to profound changes. Herb has designed and successfully led large system changes including the turnaround of nine failing financial institutions as well as supported executives in massive reorganization planning and implementation processes. He has supported executives seeking to enhance/change their focus or image, as well as how to return to industry from external coaching/consulting. Finally, he has supported individuals during their business start-up processes."
full_description = '''As part of the field project, a team of four consultants met for two days with organizational officers, directors, key staff persons, and a sampling of clients and service-users. The focus of the meeting was to assist the organization in the next step of its visioning process. Prior to this two-day meeting, a one-day retreat with an OD consultant had been held, where a one-page visioning statement had been prepared. Besides this visioning statement, the team had been provided various internal documents, including marketing brochures and strategic plans. The two days of meetings included 10 hours of team preparation and six hours of assessment and interaction with the client. The first day included five hours for team review of the provided written materials and determining how to enter the organization, a one-hour meeting with the President/CEO and Vice President of Operations, followed by a two-hour meeting with managers, staff, and local citizens using the organization's facilities. The second day involved five hours reviewing the prior day, developing themes, and determining how to manage the meeting with the organization, and a three-hour meeting of managers and three external Board members to discuss the findings and to further the dialogue. The team included three Caucasians (two female and one male) and one Native American male. No other races were represented on the team, although the client was an African-American organization predominantly serving an African American community. The team ranged in age from 48 to 62, and had approximately 100 years of consulting experience between them. The team's assignment was to meet with the client and to employ Gestalt techniques, referred to by some as the Gestalt Consulting Stance. The first day of consulting opened with a five-hour team assessment of the written materials to determine the current reality, or the organizational "what is." For the first hour, team members reviewed the written materials (active, directed awareness). During the second hour, team members noted what stood out (was figural) for them in the materials (open, undirected awareness). Some issues discovered from the materials that were figural for the group follow.'''
