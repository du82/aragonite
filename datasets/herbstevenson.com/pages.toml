["http://www.herbstevenson.com/chapters/gestalt-as-consulting-chapter-3.php"]
title = "Gestalt As Consulting: Part III"
description = "Herb Stevenson is owner of Cleveland Consulting Group, LLC, a company dedicated to using innovative methods to help organizations and executives discover new ways of 'being' that lead to profound changes. Herb has designed and successfully led large system changes including the turnaround of nine failing financial institutions as well as supported executives in massive reorganization planning and implementation processes. He has supported executives seeking to enhance/change their focus or image, as well as how to return to industry from external coaching/consulting. Finally, he has supported individuals during their business start-up processes."
full_description = "As Gestalt Theory continued to be applied, a distinction between Gestalt as therapy and Gestalt as organization development evolved from thinking at the Gestalt Institute of Cleveland1. During this evolutionary period, the core assumptions of each of the applications of Gestalt theory were formalized and compared. See below. This comparative distinction revealed the Gestalt thread that runs through both applications while indicating the differences. From this work, the Gestalt Institute of Cleveland developed two concepts that distinguish gestalt consulting from other forms of consulting. They are the unit of work and the gestalt consulting stance. Consistent with the distinctions made between Gestalt as therapy and Gestalt as consulting or organization development, the gestalt consulting stance became a method for distinguishing Gestalt theory from other forms of consulting. In the following pages, each of the ingredients of this approach to consulting is described. 2. Attend to your own experience (feelings, sensations, thoughts, etc.), and selectively share these experiences, thereby establishing your presence in doing so. 3. Focus on energy in the client system and the emergence, or lack of, themes or issues for which there is energy; and therein support mobilization of energy so that something happens. 4. Facilitate clear, meaningful, heightened contacts between members of the client system (and with you). 5. Help the client system to complete units of work and to achieve closure around unfinished business. The use of self as an instrument clearly distinguishes gestalt theory from other forms of intervention. In a nutshell, it is believed that the relationship between the Gestaltist and the client is essential to the process. To develop this relationship, the Gestaltist needs to be congruent. “An oversimplified definition of congruence is that one looks like one feels, says what one feels and means, and acts in accordance with what one says.” (Satir, 2000, pp. 21-22. ) The power of this “use of self” can be understood from the psychoanalytic principle “that the source of the consultant’s feelings is other people.” (Sher, 1999, 3) Hence, in reporting one’s internal experience, the Gestaltist is responding directly to the impact of client on oneself. Herein, the Gestaltist’s presence triggers figure/ground formations to move past unformed or fuzzy formation, thereby enabling thoughts that reside in the client’s “unthought known” (preconscious, rudimentary thoughts that the individual, group or organization is thinking, but won’t acknowledge publicly) to surface...The idea that thoughts are thought only when there is a container/receptacle to receive them, underlies the purpose of consultancy. Within the protected boundaries of the consultant-organization relationship, the Unthought Known, the vastness of unexpressed, but felt wishes and fears—the acts of becoming and the failures of being—are opened for discussion, exploration, and incorporation.” (Sher, 1999, 2; Bollas, 1989)"
