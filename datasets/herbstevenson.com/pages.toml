["http://www.herbstevenson.com/poetry2.php"]
title = "Poetry By Herb Stevenson | Page 2"
description = "Herb Stevenson is owner of Cleveland Consulting Group, LLC, a company dedicated to using innovative methods to help organizations and executives discover new ways of 'being' that lead to profound changes. Herb has designed and successfully led large system changes including the turnaround of nine failing financial institutions as well as supported executives in massive reorganization planning and implementation processes. He has supported executives seeking to enhance/change their focus or image, as well as how to return to industry from external coaching/consulting. Finally, he has supported individuals during their business start-up processes."
full_description = "Each morning I awake to see you waiting, patiently waiting, for me to open my eyes and remind me that you are always with me. When I look into the mirror, you stare back with black eyes gleaming like you know something that I don’t or something that I don’t want to know. When I get dressed, you remind me that some clothes are less safe than others or maybe that it is safer to wear these clothes, the same ones I wear every day to find comfort. When I walk into a large room of people or visit someplace new, you meet me at the door with arms wide open, squeezing the wind from my lungs and piercing my heart. When I leave the house you wait for me in the car or at the end of the drive riding on the front bumper watching my reactions to each sign, symbol, person or pebble. When I need to work you occasionally let me place you on the shelve or in a box, or under a rock to wait until I get done so that I can try to make a living. When I need to look normal you let me pretend that you are not here, now, so that I can seem calm or happy or alive and have conversation with others. When I need to feel safe, you seem to know just when and how much to leave me alone be it for a minute, or an hour or a month, yet you always come back. I wonder if I will ever not be with you, or if I will ever feel safe enough to not need you to know that I am alive, or if I will ever look into a mirror and just see my face The darkness feels terrifying as if it is stripping the skin from my body. It is tearing into the flesh of my emotions. It is tearing into the flesh of my emotions. It is tearing into the flesh of my emotions. “Who are you?” echoes in the distance as if thoughts, my thoughts, are bouncing off the walls of my mind. “What are you?” thunders between my ears as the agitation rises shooting bolts of heat through my burning veins. “What do you want?” deafens the senses as shrilling fear surges exploding any semblance of self into oblivion. “Who are you?” blisters each cell as if wanting, my wanting, is impossible to know yet must be voiced."
year_published = 2025
clearnet = "http://www.herbstevenson.com/poetry2.php"
