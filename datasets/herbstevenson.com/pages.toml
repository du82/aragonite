["http://www.herbstevenson.com/chapters/gestalt-cycle-of-experience-chapter-2.php"]
title = "Gestalt Cycle of Experience: Part II"
description = "Herb Stevenson is owner of Cleveland Consulting Group, LLC, a company dedicated to using innovative methods to help organizations and executives discover new ways of 'being' that lead to profound changes. Herb has designed and successfully led large system changes including the turnaround of nine failing financial institutions as well as supported executives in massive reorganization planning and implementation processes. He has supported executives seeking to enhance/change their focus or image, as well as how to return to industry from external coaching/consulting. Finally, he has supported individuals during their business start-up processes."
full_description = "In 1947, Perls introduced what would become the cycle of experience. He called it Organismic/World Metabolism as a description of the process underlying the achievement of internal balance. He believed that there exists an instinctive cycle which reflected the “cycle of the interdependency of organism and environment.” (Perls, 1969, 44; 69) This cycle was a self-regulating experiential cycle that maintained the internal equilibrium of each individual. Because self regulation for human beings involves some form of consciousness that includes moral regulation, the moral regulation, by it’s very nature, “must lead to the accumulation of unfinished situations in our system and to interruption of the organismic circle. (Perls, 1969, 45) Hence, we have an instinctual cycle that seeks to complete itself. However, through internal and/or outside influences, the completion of this cycle can be short-circuited, creating an incomplete cycle. This incomplete cycle, if necessary to return the organism to equilibrium, will continue to recycle until the original need is satisfied. Such situations result “in a ‘fixed Gestalt’ or ‘unfinished experience/situation’ which interferes with good contact with self, others, or the environment in the present.” (Clarkson, 2000, 7) b) An internal disturbance—a need which has gathered enough momentum to strive for gratification and which requires In the 1970's, the thinking by Bill Warner, Miriam Polster and Joseph Zinker at the Gestalt Institute of Cleveland expanded gestalt theory with the formulation of the contact cycle and then the awareness-excitement-contact cycle. In basic terms, the cycle evolved from trying to explain how contact occurred. Initially, it was believed that contact moves through eight stages: It was noted that the contact cycle was not time-bound, as the cycle may last only a moment, a minute, an hour, a year, or even a lifetime. The eight stages could occur in different sequences or sometimes condensed into simultaneity. Moreover, it was noted that the sequence of the cycle was a guideline and “not to be taken as a cut and dried order.” (176)"
year_published = 2025
