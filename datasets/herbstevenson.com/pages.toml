["http://www.herbstevenson.com/chapters/gestalt-principals-chapter-1.php"]
title = "Gestalt Principals: Chapter One"
description = "Herb Stevenson is owner of Cleveland Consulting Group, LLC, a company dedicated to using innovative methods to help organizations and executives discover new ways of 'being' that lead to profound changes. Herb has designed and successfully led large system changes including the turnaround of nine failing financial institutions as well as supported executives in massive reorganization planning and implementation processes. He has supported executives seeking to enhance/change their focus or image, as well as how to return to industry from external coaching/consulting. Finally, he has supported individuals during their business start-up processes."
full_description = '''Gestalt is a German word that does not easily translate into English. Its central meanings include form, shape, manner, aspect, kind, and character. These meanings were adapted in Gestalt psychological and psychotherapeutic theory to signify a pattern, a whole, a discernible configuration or constellation. However, for a description of the word, the essence, if you will, “three phenomena must be considered: a thing, its context or environment, and the relationship between them. We perceive something that constitutes a part of the reality of our world in terms of the context in which it occurs. For example, the color and texture of a rosebud in the context of a vase in a room are perceived differently from the same rosebud when its context is many other rosebuds on a bush in a garden.” Our response to the rosebud is quite different in the two contexts. “Although the rosebud is the focus, the gestalt of the rosebud depends on, and cannot be separated from, the environment in which it appears.1” (Kolb, Gorrell, & De Riet, 1989, p.1) Gestalt theory is best known for identifying and working with structural entities that are both different from and more than the sum of their parts. In keeping with Gestalt's original roots in psychology, where it was argued that perception is best understood as an organized pattern rather than separate parts, (Kohler, 1992) "[t]he aim of the Gestalt approach is for a person to discover, explore and experience his or her own shape, pattern and wholeness, . . . leading to the integration of all disparate parts." Through such discovery, the individual is helped to fulfill "the central human activity," which for Gestalt is "people's need to give meaning to their perceptions, their experience, and their existence" (Clarkson, 2000, pp. 1, 5). Gestalt is a theoretical and methodological adaptation of several philosophic and scientific schools and movements that either predate or are contemporaneous with its development. These contributory factors influenced Gestalt to varying degrees, but all nurtured Gestalt's distinctive focus on individuals' perceptions of and responses to their environment (i.e., not only the physical situation, but also interactions with other people) in the present moment. The following schools and movements are important for understanding Gestalt in both its original and expanded "therapeutic" applications: phenomenology, existentialism, holism, systems theory, and field theory.'''
year_published = 2025
clearnet = "http://www.herbstevenson.com/chapters/gestalt-principals-chapter-1.php"
