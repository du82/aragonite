["http://www.herbstevenson.com/about-herb-stevenson.php"]
title = "About Herb Stevenson"
description = "Herb Stevenson is owner of Cleveland Consulting Group, LLC, a company dedicated to using innovative methods to help organizations and executives discover new ways of 'being' that lead to profound changes. Herb has designed and successfully led large system changes including the turnaround of nine failing financial institutions as well as supported executives in massive reorganization planning and implementation processes. He has supported executives seeking to enhance/change their focus or image, as well as how to return to industry from external coaching/consulting. Finally, he has supported individuals during their business start-up processes."
full_description = "He has designed and successfully led large system changes including the turnaround of nine failing financial institutions as well as supported executives in massive reorganization planning and implementation processes. He has supported executives seeking to enhance/change their focus or image, as well as how to return to industry from external coaching/consulting. Finally, he has supported individuals during their business start-up processes. Herb has supported clients from small firms to the extremely large, such as Fannie Mae, Hewlett Packard, NASA, and the National Cooperative Bank. He has been a management consultant and executive coach for over twenty years and a business executive for over 25 years. For 15 years, he was Executive Vice President with Young & Associates, Inc., Kent, Ohio, a management consulting firm employing approximately 25 professional and staff personnel. While successfully completing nine failing bank turnarounds, he designed and implemented the current corporate structure; designed and implemented a national training program being used by over 10% of the banks in the country; designed and developed a national direct mail product division that created and sold video tape, computer software, and printed materials. Prior to consulting, he was a bank executive where he managed five offices and over seventy people. During his tenure within banking, he specialized in business start-up and rapid growth. Most recently, he has been providing diversity initiatives. He has published 26 banking books, with four revised editions, including Executive Management Guide to An Effective Board of Directors and The Board of Directors. He is listed in eight Who’s Who lists including Who's Who in Finance and Industry, Who’s Who in American Education, Who’s Who of Emerging Leaders, and Who's Who in American Law. Executive Development, Executive Coaching, Succession Planning, Whole/Large Scale Change, Diversity Management. Herb is the founder of Cleveland Consulting Group, a business consulting group that applys innovative methods to help organizations and executives discover new ways of “being” that lead to profound changes. We give an organization more life. Like you, we believe that your business is more than just a problem to be solved."
