["http://www.herbstevenson.com/chapters/interview-with-herb-stevenson-chapter-5.php"]
title = "An Interview With Herb Steveson: Chapter 5"
description = "Herb Stevenson is owner of Cleveland Consulting Group, LLC, a company dedicated to using innovative methods to help organizations and executives discover new ways of 'being' that lead to profound changes. Herb has designed and successfully led large system changes including the turnaround of nine failing financial institutions as well as supported executives in massive reorganization planning and implementation processes. He has supported executives seeking to enhance/change their focus or image, as well as how to return to industry from external coaching/consulting. Finally, he has supported individuals during their business start-up processes."
full_description = "So for me, it all depends what my intention is – what was the contract. Example: Most of my coaching is unusual, I have people fly in and meet with me for a day. That’s very unusual, most people won’t coach that way. But, I’m pretty adamant about it and I also make the price to their advantage because I can do in one day what usually takes people 6-8 months in coaching – they can do it over a period of time. So, by the time they pay for me to fly out to them and do all the other things, there’s no comparison. Where they can come in and in one concentrated period do a lot of work. So, most of my coaching work is that way and usually those who fly in are mostly consultants. Professionals in the field either internal or external, who are in a jam, they know they’re getting in their own way and they don’t know what to do about it. So, what I do is, I just sit and we work until we really get clear about what is happening and we build the ground. And, what ends up happening in those cases is that it is an awareness building process and so once they are aware what the problem is – what’s getting in their own way – they already know what to do to solve it. Now that’s generally what I do, that’s contracted in the work. If they, in the contractual part, want more than that, then instead of a compelling clarity, or compelling picture, they want more than that such as, I’ve had some come in saying they want to make a transition in their work, then we would build in an action plan after we got clarity of what’s getting in the way for them to move to where they want to go. Example: I have one who is an external that flew in quite a bit – or flew in for one day – and her process was to get clarity about her work because it was like killing her. She was beating herself to death. No matter what she did nothing was good enough, so we just unraveled all those pieces until she got clear about what the problem was. Actually it wasn’t the work, it was that she was doing work she didn’t like but she happened to be very good at it. And when she could acknowledge that, then we had to set up other things to support her to make transitions. She basically worked it out to switch to do only contract work – subcontract work – didn’t have to worry about marketing any more because she didn’t enjoy it. She made enough money to do what she really wants to do, which is what she’s doing now – she’s taking a year off. She was an exceptionally good fictional writer and she’s going to write a book. So, she’s actually made her dream come true and knows that if she needs to, at the end of the year, because she’s maintaining enough contact with her working relationships, that she can go back to doing it if she needs to. So, it depends on what was contracted up front."
year_published = 2025
