["http://www.herbstevenson.com/poetry3.php"]
title = "Poetry By Herb Stevenson | Page 2"
description = "Herb Stevenson is owner of Cleveland Consulting Group, LLC, a company dedicated to using innovative methods to help organizations and executives discover new ways of 'being' that lead to profound changes. Herb has designed and successfully led large system changes including the turnaround of nine failing financial institutions as well as supported executives in massive reorganization planning and implementation processes. He has supported executives seeking to enhance/change their focus or image, as well as how to return to industry from external coaching/consulting. Finally, he has supported individuals during their business start-up processes."
full_description = '''I hear you calling from some distant place far, far away as if you were only an echo or a shadow or maybe a fading memory. I return your call with haste only to watch the words fall to the ground before me, lifeless, yet, yearning to reach you. I call again and again and again but you do not hear as if I speak in a foreign tongue or in nonsensical words. I call to all my senses and plea for their help to find the way, the means, the very key to open the door. I call to the gods of love, life, and the pursuit of happiness for help in even the tiniest morsels, but they only smile. In desperation I call to my self as but a figment of my enlarged imagination letting go of the thought. Oh so softly I hear a whisper floating through the air like a cordial response to a formal invitation, "I'm glad you finally called". The leather bound boards snugly guard the family treasures mirthfully tarnished from years of painstakingly collecting stolen moments from time. "Mom" erupts from the embarrassment of an unveiling of the glistening, dimpled bottom of a new-born boy unknown by sight to outsiders till now. "Look at those chub cheeks" eulogizes the pubescent periods of spiritual awakenings contradicted and reflected in bodily changes while emotionally roving back and forth lost in time. "Well, I'll be" debunks the disbelief that this portrait somewhere, somehow ever existed let alone was possibly the same person, now, known. "Who's that" queries for an identification of the dark, leathery skinned individuals leaning on each other like old friends, but being just father and son. "Look at those ears" cuts the air with the surprise remembrance of the effects of serving a country which strips a personality and replaces it with a rifle, dark, cutting eyes, and razor reflexes. "Oh my god" precedes the guffaws of seeing a vaguely familiar face with long, curly hair shaped like a basketball surrounding a head in a burnished halo not quite finished. "What d'ja expect" tries to deflect the buried beliefs from a spiritual path walked by a strangely familiar person wearing worn leather sandals, torn tees and jeans, and a look too close for comfort.'''
year_published = 2025
clearnet = "http://www.herbstevenson.com/poetry3.php"
