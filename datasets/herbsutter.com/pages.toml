title = "December 2007 – Sutter’s Mill"
description = "5 posts published by Herb Sutter during December 2007"
full_description = 'Effective Concurrency: Use Lock Hierarchies to Avoid Deadlock The latest Effective Concurrency column, "Use Lock Hierarchies to Avoid Deadlock", just went live on DDJ’s site, and will also appear in the print magazine. From the article: … The only way to eliminate such a potential deadlock is to make sure that all mutexes ever held at the same time are acquired in a consistent order. But how can we ensure this in a way that will be both usable and correct? For example, we could try to figure out which groups of mutexes might ever be held at the same time, and then try to define pairwise ordering rules that cover each possible combination. But that approach by itself is prone to accidentally missing unexpected combinations of locks; and even if we did it perfectly, the result would still be at best "DAG spaghetti"—a directed acyclic graph (DAG) that nobody could comprehend as a whole. And every time we want to add a new mutex to the system, we would have to find a way fit it into the DAG without creating any cycles. We can do better by directly exploiting the knowledge we already have about the structure of the program to regularize the mess and make it understandable. … I hope you enjoy it. Finally, here are links to previous Effective Concurrency columns (based on the dates they hit the web, not the magazine print issue dates): July 2007 The Pillars of Concurrency August 2007 How Much Scalability Do You Have or Need? September 2007 Use Critical Sections (Preferably Locks) to Eliminate Races October 2007 Apply Critical Sections Consistently November 2007 Avoid Calling Unknown Code While Inside a Critical Section Herb Sutter Concurrency Leave a comment 2007-12-11 1 Minute Let’s Be Thoughtful Out There I knew Hanlon’s Razor: "Never attribute to malice that which can be adequately explained by stupidity." And the variants attributed to Heinlein, described on the same page as adding "… but don’t rule out malice." or "… but keep your eyes open." But I only just now came across Grey’s Law, which follows the flavor of Clarke’s Third Law: "Any sufficiently advanced incompetence is indistinguishable from malice." One example that irritates me too is focus-stealing popups. Grr, no, I didn’t mean that enter key to select "Reboot", I was just finishing a paragraph or writing a space. Please, Mr. Callous Software Developer, just leave me alone! I don’t care how important you think your application is — it’s never important enough to pop up on top without warning. No. Bad developer. Down. I said down. Stay. As a counterexample, I really like how Windows handles the "are you sure you want to run this application?" dialog. Not only does it not steal focus… even better, it ignores the first mouse click when it gets focus. That’s right, if the window is visible but not active, and you click on the "Run" button, it doesn’t also push Run — it merely makes the window active. Then if you hit Run again, it runs. Yes! Good developer! To paraphrase Hill Street Blues: Let’s be thoughtful out there. Herb Sutter C++ 2 Comments 2007-12-07 1 Minute'
