full_description = 'Plug for the Astoria Seminar If you enjoy C++, you should also enjoy the Astoria Seminar: Extraordinary C++ to be held on September 23-26, 2007 in Astoria, OR, USA. The event seems to have plenty of seats available, so you haven’t missed out (yet). Disclaimer: I have no affiliation with the event, and I won’t be speaking or attending. But I feel confident recommending it on the strength of its speakers, if you are interested in any of the topics. Summarizing both: Scott Meyers An Overview of TR1 C++ Callbacks for C APIs Andrei Alexandrescu Choose your Poison: Exceptions or Error Codes? Memory Allocation: Either Love It or Hate It. (Or Just Think It’s OK.) Dave Abrahams High Performance Generic Software Design (with Eric Niebler) C++ Metaprogramming Concepts and Frameworks Eric Niebler High Performance Generic Software Design (with Dave Abrahams) Domain-Specific Embedded Language Design with Boost.Proto Walter Bright Building Fast Lexers and Parsers Performance Tuning Your Application If any of the above topics gave a little tug at your heartstrings, or you want to rub shoulders with (and pick brains of) some really knowledgeable experts, I’m sure you won’t want to miss it. With Dave and Eric there (and Andrei, even though he claims to be speaking about other topics) it’s guaranteed to have a heavy dose of template- and metaprogramming-oriented material. P.S.: Walter, thanks again for Empire! It was the cause of some happily wasted hours in my undergrad years. Herb Sutter C++ 1 Comment 2007-08-31 1 Minute More Visual C++ Q&A: A New Compiler Front-End A few days ago, I blogged to answer to someone’s question about "where is Visual C++ going" by giving a number of resources and links, primarily about this year’s release now in public beta. But their real question was about "where is Visual C++ going beyond VC++ 2008," and in particular whether we will continue to invest in the C++ compilers and native libraries, support new native and managed facilities like XAML via C++, and so on. Now I can point to an answer that’s slightly more complete but also breaks some news: Our VP, Soma, blogged about this very topic this week. Here’s the key paragraph, some emphasis added: This team will be significantly increasing support for native development tools. Central to this work is investigating ways to make C++ developers far more efficient in understanding, updating and validating the quality of large native code bases. In fact, the team is already working on a front-end rewrite that will allow for a vastly improved IntelliSense experience. This same work should pave the way for future enhancements such as refactoring and advanced source code analysis. In addition, the team intends to update the native libraries to simplify the development of rich-client user interfaces and access to underlying Windows platform innovation. The team will also work to provide “friction-free” interop between native & managed code through enhancements to C++/CLI and IJW. From the comments section, Bill Dunlap from our VC++ group added some teasers, including (emphasis mine): MFC – we are working on a huge update to MFC that should knock your socks off. I can’t tell you too much right now, but this is closer than you might [think] <g>. The Visual C++ "front-end rewrite" Soma mentions is indeed well under way, and one of the big benefits will be that it will make the compiler much more flexible (dare I say "agile"?) for us to work with and add features, including C++0x features. We’ll be able to say more about the new compiler and report progress in the coming year or two as it turns into real product you can see and touch. [8:55am: updated to add Bill Dunlap’s comments and edit the last paragraph] Herb Sutter C++ 4 Comments 2007-08-11 2 Minutes'
