full_description = 'Effective Concurrency: Going Superlinear The latest Effective Concurrency column, "Going Superlinear", just went live on DDJ’s site, and will also appear in the print magazine. From the article: We spend most of our scalability lives inside a triangular box, shown in Figure 1. It reminds me of the early days of flight: We try to lift ourselves away from the rough ground of zero scalability and fly as close as possible to the cloud ceiling of linear speedup. Normally, the Holy Grail of parallel scalability is to linearly use P processors or cores to complete some work almost P times faster, up to some hopefully high number of cores before our code becomes bound on memory or I/O or something else that means diminishing returns for adding more cores. As Figure 1 illustrates, the traditional shape of our "success" curve lies inside the triangle. Sometimes, however, we can equip our performance plane with extra tools and safely break through the linear ceiling into the superlinear stratosphere. So the question is: "Under what circumstances can we use P cores to do work more than P times faster?" There are two main ways to enter that rarefied realm: Do disproportionately less work. Harness disproportionately more resources. This month and next, we’ll consider situations and techniques that fall into one or both of these categories. … I hope you enjoy it. Finally, here are links to previous Effective Concurrency columns (based on the dates they hit the web, not the magazine print issue dates): July 2007 The Pillars of Concurrency August 2007 How Much Scalability Do You Have or Need? September 2007 Use Critical Sections (Preferably Locks) to Eliminate Races October 2007 Apply Critical Sections Consistently November 2007 Avoid Calling Unknown Code While Inside a Critical Section December 2007 Use Lock Hierarchies to Avoid Deadlock January 2008 Break Amdahl’s Law! February 2008 Going Superlinear Herb Sutter Concurrency 2 Comments 2008-01-30 1 Minute What Not To Code At Stroustrup & Sutter on C++ this March, one of my sessions will be on "What Not To Code" (submission link). The premise is to try something new I haven’t done before: A session dedicated to making over code nominated by you, the public, in the few weeks before the talk. In return for your submission, here’s what I’ll do if your entry is selected: Full notes: Whether or not you attend the S&S event, I’ll send you the full talk handouts — not only for your submission, but for all selected submissions — as your thank-you for participating. Participation: If you’re there in the audience, you can participate in the makeover on stage (if you want to, your choice). Oh, and there might be an additional live prize. I’ll select as many of the submissions as I can, and analyze/critique/improve them during the session, including talking about tradeoffs and alternatives that can make the code clearer, faster, simpler, and/or safer. As the talk blurb concludes: … you will refresh your sense of elegance and beauty, not to mention old-fashioned performance and robustness and maintainability, so often lacking in the broken code littering today’s bleak postmodern corporate landscape. So if you’ve seen a friend’s or coworker’s (or your own) code that could use a makeover, please nominate it anytime here. Thanks! Herb Sutter C++ Leave a comment 2008-01-28 1 Minute'
