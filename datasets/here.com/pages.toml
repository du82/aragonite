  *必須項目です。弊社のプライバシーポリシーに基づき、お客様の情報を利用させていただく場合があります。"""
full_description = "スマートモビリティ 都市ネットワークを拡大し、シームレスなマルチモーダルMaaS を実現します お問い合わせ ホワイトペーパーをダウンロード MaaSに最適な高精度地図採用の最先端プラットフォームとツール ビジネスを進化させ、明日のスマートモビリティエコシステムを形成しましょう。MaaSに対応したインターモーダル移動を構築し、フリートの配置および管理を最適化します。 スマートモビリティのソリューション 位置情報テクノロジーにより、ビジネスの拡張、市場投入時間の短縮、コストの削減、サービス効率の向上を実現します。 最新のMaaS地図データでルート計画を改善 ユーザーの要望に応じたエンドツーエンドのアプリ内エクスペリエンスを提供し、 MaaS（Mobility as a Service）によるシームレスなモビリティサービスを実現します。 MaaS高精度地図採用のプラットフォームでデータの価値を最大化 お客様のニーズに基づいてサービスや製品を構築します。HEREのプラットフォームでHEREやサードパーティーのデータを活用し、データの価値を高めましょう。 MaaS によるスマートモビリティソリューションの構築 モビリティ運用 モビリティソリューションを最大化 カバレッジを拡張し、地域の交通網を補完。車両の正確なトラッキング、ポジショニング、配車により、効率的な車両管理を提供します。 関連製品： 効率的にフリートを管理し、ドライバーの安全も確保するHEREのテレマティクスサービス：HERE Fleet Telematics インターモーダル経路計画 MaaSでシームレスな通勤・通学をサポート 複数の乗り換えがある場合でも、目的地への移動を簡単に。公共交通機関を含めた移動方法を提案し、緊急時でも効率の良い駐車や移動を実現します。 関連製品： 徒歩、車、電車、自転車、トラックなどさまざまな交通手段を含むルートの検索を最適化：HERE Routing モビリティエコシステムへの参画 データの価値を最大化 HERE Marketplaceにおけるデータのカスタマイズやサードパーティーとのデータ交換で、サービスを拡張。MaaSに対応する新しいソリューションを構築します。データを収益化し、戦略的なビジネス判断に活用することで、よりスマートで効率的、かつ環境に優しい都市づくりを実現しましょう。 お客様事例 12.Mitsubishi_D Bookingcom SAP Verizon CityTech Ford Siemens 位置情報テクノロジーを活用し、バスの移動体験を改善 三菱商事とデザイニウムが、日本でのバスの移動体験を向上させるために位置情報をどのように活用しているかをご紹介します。 三菱商事とデザイニウム、公共交通機関の分野で協業 続きを読む 予約サービスをさらに便利に HEREとの提携で、Booking.comが外出中の利用者に利便性を提供した事例をご覧ください。 HERE WeGoの地図を利用している方であれば、数回のタップで予約が可能です。 Booking.com EMEA地域戦略的パートナーシップ担当ディレクター ビアンカ・ムッシ氏 ノウハウを共有してモビリティを改善 SAPとHEREが連携してMaaSを改善する事例をご覧ください。 HEREは地図・位置情報サービス分野において優れた実績を持っています。私たちはHEREから学んだことを、MaaS開発に生かすことができます。 SAP インダストリーソリューション担当マネージャー センタ・ベレー氏 今日の世界でナビゲーションを形成する VerizonとHEREは、画像による位置特定で、よりスムーズな乗車の実現を実証。その取り組みをご覧ください。 HERE TechnologiesとVerizonは、現実世界におけるスマートモビリティの課題を解決することで、都市内移動の既成概念を再定義しています。 効率性の高い都市づくり カーブサイド・マネジメントを改善するCity Tech CollaborativeとHEREの取り組みについてご覧ください。 HEREの映像分析と位置情報分析のおかげで、市の担当者がカーブサイド（道路の縁石側の空間）に存在するアセットを細かく把握できるようになりました。 City Tech Collaborative CEO ブレンナ・バーマン氏 100年の歴史を見直す 位置情報インテリジェンスを活用してトランスフォーメーションを推進するFordPassの取り組みについてご覧ください。 HEREとの提携により、欧州でリアルタイム交通情報を提供しています。 FordPass CPO ジェイミー・アリソン氏 市街地の交通流を改善 都市部でグリーンウェーブ（車を検知して信号を青に変え、交通流をスムーズにするシステム）を最適化するSiemens MobilityとHEREの取り組みをご覧ください。 HEREの車両プローブデータを、当社の信号データや検知データと組み合わせることにより、HEREの位置情報データを活用しています。この組み合わせは非常に強力です。 Siemens Mobility ITS Digital Labs データ分析・実装担当マネージャー デビッド・モントゴメリー氏 よくある質問 スマートモビリティとは？ スマートモビリティとは、交通・モビリティの新しいネットワークのことで、テクノロジーとモビリティを融合させ、日常生活やビジネスシーンにおける交通インフラをより快適にするものを指します。オンデマンドのカーシェアリングやライドシェアリングサービス、コネクテッドカー、MaaSなどが含まれ、スマートモビリティは環境汚染の減少や安全性の確保、交通渋滞の緩和が重要視される今、特にフリート業界において注目が集まっています。 モビリティソリューションとは？ モビリティ (mobility) とは「移動性」「動きやすさ」を意味する言葉です。車はもっとも身近な移動手段であることから、自動車業界で「モビリティ」という語をよく用いるようになりました。 移動への取り組みは、人や物を安全・確実に目的地へ運ぶことを目指して発展してきましたが、同時にさまざまな問題点も指摘されています。人や物流が都市部へ集中することにより深刻化する渋滞、それに伴う排ガスといった環境問題などが一例です。一方、地方では過疎化による輸送サービスの低下が深刻であり、交通弱者へのケアが急務となっています。 モビリティソリューション (mobility solution) とは、こうした問題点を改善していく各事業者の取り組みをいい、現在は自動車業界だけでなく鉄道会社やIT業界、金融業界までもが問題点を共有し、取り組みにあたっています。 MaaS (マース) とは？定義を教えて下さい。 MaaS (マース) は「Mobility as a Service」の略称で、日本語に直訳すると「サービスとしてのモビリティ（移動）」となります。これまでユーザーは、複数の交通サービスを利用する際、それぞれのサービスに個別にアクセスしなければならなかったところ、単一のアプリケーションで予約や決済などを一括に行えるようになるという、今までの交通サービスのあり方をテクノロジーによってより便利にする概念です。公共交通機関、カーシェアリング、バイクシェアリング、タクシー、レンタカー、リースなどの提供業者は、MaaSによって、顧客の要望に対応した多様な交通手段を提供することが可能になります。 なぜ高精度のMaaS地図が必要なのですか？ MaaS (Mobility as a Service） の事例には、スマートフォンのアプリを使い自動車や電車、飛行機など複数ある交通手段から最適なルートを検索し、乗車券の予約や利用料金の支払いまでを一括で行えるといったサービスが良く知られています。今後はさらに、自動運転やAIなどの新しいテクノロジーを組み合わせ、単に移動の手段にとどまらず、利用者の生活の一部となるようなサービスに広がっていくでしょう。 そうしたサービスの実現には、利用者が今どこにいて、どこに向かうのかといった正確な位置情報の把握が欠かせません。加えて、各交通事業者が保有する渋滞や配車管理、さらには自治体や企業が提供する観光スポットなどの情報を一カ所に集めることで、情報の価値は向上します。そうした情報のプラットフォームとして活躍するのがMaaS地図であり、 MaaSはどのような問題に対するソリューションですか？ MaaS（Mobility as a Service）のソリューションは、多様化する交通サービスの利用にともなう煩雑さを解消することから始まりました。公共交通機関なども含め、さまざなまな事業者が持つ情報を統合することにより、複数ある移動手段の中から目的地までの最適なルートを検索するといったサービスが実現しています。今後は、その情報網にタクシーやレンタカーなどを加え、あらゆる交通機関を横断して予約や料金の支払を一括で行うサービスへの発展に進むでしょう。 MaaSのソリューションは単に交通サービスの選択に限りません。クラウドなどを通じて配車情報を共有し効率化することで、渋滞の解消や排ガスの削減といった環境問題への取り組みも期待されています。また、AIや自動運転といった最先端のテクノロジーを組み合わせることで、特に地方部で問題となっている交通サービスの低下への歯止めや、さらには、医療や福祉サービスの充実といった街全体の住環境の向上を目指す構想にもつながるでしょう。 MaaS地図プラットフォームとは何ですか？ MaaS（Mobility as a Service）とは今までの交通サービスをテクノロジーを活用して利便性を向上させる概念であり、複数の交通サービスを連携し単一のアプリケーションで予約や決済を一括に行えるようにするといった取り組みが進んでいます。 また交通サービス間を行き交う利用者の行動を地図上で管理することにより人の流れが可視化され、マーケティング戦略や交通サービスの向上に役立ちます。 こうした情報を管理するのが地図プラットフォームであり、HEREの提供するオープンプラットフォームは位置情報に関連するサービスの素早い構築に貢献しています。 「HEREが再び1位に。Googleとの差を広げる。」- Omdia Location Platform Index、2020年6月 3年連続でOmdiaの位置情報プラットフォームインデックスでHEREが1位にランクインしている理由をご覧ください。 レポートをダウンロード お客様のビジネスのためにHEREができること プラットフォームのサービス内容： コネクテッドカー向け統合ソリューション 信頼できる地図コンテンツ 位置情報ベースビジネスの効率化を図るマーケットプレイス 弊社のサービス内容について詳しい情報をご希望の場合は、問い合わせフォームよりお客様サポートまでお気軽にご連絡ください。 *必須項目です。弊社のプライバシーポリシーに基づき、お客様の情報を利用させていただく場合があります。"
