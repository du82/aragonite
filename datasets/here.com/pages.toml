["https://here.com/learn/blog/february-2025-platform-release-notes"]
title = "February 2025 Platform Release Notes | HERE"
description = "IMPORTANT INFORMATIONHERE Map Attributes and HERE Route Matching will no longer be available to both new and existing customers on the Limited plan effective immediately, and will…"
full_description = '''Developer blog February 2025 Platform Release Notes Release notes 5 min read 11 February 2025 February 2025 Platform Release Notes IMPORTANT INFORMATIONHERE Map Attributes and HERE Route Matching will no longer be available to both new and existing customers on the Limited plan effective immediately, and will cease to be available on the Base plan starting Saturday, March 15, 2025. These location services will be available exclusively through the Enterprise plan.Deprecation of HERE SDK Android & iOS Lite EditionHERE is asking our Customers and Partners using HERE SDK Lite Edition to upgrade to HERE SDK Explore Edition by 15 December 2025, at no additional cost.HERE SDK Explore Edition includes all functionalities of HERE SDK Lite Edition and additionally offers improved map view features such as additional styles, realistic terrain, enhanced 3D elements, and better map customization tools while offering the same core search and routing features.There is no additional cost for using SDK Explore as licensing is the same. Customers with any special pricing will continue using SDK Explore under the same conditions.Please see the link to customer upgrade guides below. We anticipate this upgrade to be low effort. Customer upgrade guide (Android)Customer upgrade guide (iOS)For technical assistance, customer can raise a case via the support portal or e-mail hls.upgrade@here.com.No new features or functionality updates will be available for SDK Lite after 31 January 2025. Only critical bug fixes will be provided if a customer raises a request.Maps will still be updated during the deprecation period.15 December 2025 will mark the end of support and full product discontinuation. Customers are required to upgrade to SDK Explore before this time.For more information, check the HERE documentation. HERE SDK 4.21.2.0HERE SDK 4.21.2.0 for iOS, Android and Flutter is a minor release for the 4.21.2.0 code line that provides many bug fixes and improvements based on customer feedback, alongside the following new features:Search: Added enum 'CurrentType' that represents the type of electric current (ac or dc). Added PlaceFilter.Ev.currentType filter to retrieve EV charging stations by the current type. Map view: Added MapView.reinit() method to reinitialize a MapView when it was disposed due to the destruction of the shared SDKNativeEngine , for example, when new SDKOptions are needed at runtime. Map view: Added TileGeoBoundsCalculator API that allows users to compute the geodetic bounds of tiles for supported TilingScheme . Note that this is a beta release of this feature. Map view: Added HereMapController.pause() and HereMapController.resume() for pausing and resuming rendering on a Flutter HERE map widget.Map style update: Enriched the POI display on the map by implementing additional icons for various POI categories which previously used a more generic iconography. Routing: Removed the beta label from fromDefaultParameterConfiguration() method of TransitRouteOptions . It is now considered to be stable. Routing: Removed the beta label from optimizeWaypointsOrder field of RouteOptions . It is now considered to be stable. Routing: Removed the beta label from TrafficOnSpan , TrafficOnSection , and TrafficOnRoute structs. They are now considered to be stable. Navigation: Removed the beta label from SpeedBasedCameraBehavior class. It is now considered to be stable.Navigation: Added isDynamicFrameRateEnabled property to the VisualNavigator . This flag controls whether the VisualNavigator reduces the number of map updates, i.e., location indicator, camera and route polyline updates, whenever the the zoom level is low, with the intention to safe battery. It is enabled by default.Routing: Removed the beta label from returnToRoute() method of RoutingInterface . It is now considered to be stable. Routing: Removed the beta label from fromDefaultParameterConfiguration() and walkSpeedInMetersPerSecond field of PedestrianOptions . They are now considered to be stable. Introduced the PolylineSimplifier component to reduce the complexity of long GeoPolyline objects. This helps minimize their size and decrease rendering effort, improving performance. Routing: Removed the beta label from PaymentMethod enum. It is now considered to be stable. Routing: Removed the beta label from RouteHandle class. It is now considered to be stable.Navigation: Removed the beta labels from extrapolationEnabled field of VisualNavigator class. It is now considered to be stable.The latest supported Flutter version was raised from 3.24.1 to 3.27.2. The latest supported Dart version was updated accordingly from 3.5.1 to 3.6.1. The minimum supported Flutter version was raised from 3.22.3 to 3.24.5. The minimum supported Dart version was updated accordingly from 3.4.4 to 3.5.4. Other versions may also work but are not guaranteed to be supported. The HERE SDK plugin is now built with the minimum supported Flutter version 3.24.5 and Dart version 3.5.4.For more information, see the changelog for your HERE SDK edition and platform. Christo Mitov Share article: Christo Mitov Have your say /** * RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS. * LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables */ /* var disqus_config = function () { this.page.url = PAGE_URL; // Replace PAGE_URL with your page's canonical URL variable this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable }; */ var disqus_config = function () { this.language = "en"; }; (function() { // DON'T EDIT BELOW THIS LINE var d = document, s = d.createElement('script'); s.src = 'https://here-3.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a> Related articles Integrations Integrating HERE Maps API for JavaScript with OutSystems Sachin Jonda 13 Feb 25 Release notes February 2025 Platform Release Notes Christo Mitov 11 Feb 25 #BuiltWithHERE How Korem Combines HERE Traffic Data with Personalized DaaS to Deliver Value Mohini Todkari 05 Feb 25 Sign up for our newsletter Why sign up: Latest offers and discounts Tailored content delivered weekly Exclusive events One click to unsubscribe'''
