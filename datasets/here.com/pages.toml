title = "HERE Technologies and Iteris Partner to Create New Smart Mobility Solutions | HERE"
description = "HERE and Iteris (Nasdaq: ITI) today announced a multi-year agreement to integrate a broader suite of location-based services and user capabilities from HERE Technologies into Iteris’ Clea..."
full_description = 'Press Releases HERE Technologies and Iteris Partner to Create New Smart Mobility Solutions Chicago, IL 15 March 2023 Iteris to Integrate Additional HERE Technologies Capabilities into Iteris’ ClearMobility Platform Iteris and HERE will provide contextual awareness to solve dynamic, real-world traffic needs for public agencies via Iteris’ ClearMobility® Platform, using precise, enterprise-grade maps and real-world digital representation models. The new partnership agreement strengthens a nearly 10-year relationship between the two companies. CHICAGO, IL and AUSTIN, TX – March 15th, 2023 – HERE Technologies, the world’s leading location data and technology platform, and Iteris (Nasdaq: ITI), the world’s trusted technology ecosystem for smart mobility infrastructure management, today announced a multi-year agreement to integrate a broader suite of location-based services and user capabilities from HERE Technologies into Iteris’ ClearMobility® Platform, including HERE Traffic Products, HERE Maps and HERE platform services. The integration of the additional HERE Technologies’ components will enhance the dynamic contextual services of the ClearMobility Platform and enrich the insights of Iteris’ mobility intelligence application, ClearGuide®. As a result, map content and data provided by HERE and visualized through ClearGuide will provide actionable insights to various users, including transportation engineers, transportation planners, infrastructure operators, and roadway construction teams. “We are excited to reinforce and broaden our collaboration with HERE Technologies,” said Will Cousins, Senior Vice President and Chief Product Officer at Iteris. “As part of the new five-year agreement, we are expanding our emerging safety and mobility applications to help public agencies address the critical priorities of the National Roadway Safety Strategy and support federal, state and local officials who are ensuring roadways are both safer and less congested.” Currently, more than 50 government agencies, municipalities and commercial entities use ClearGuide to improve safety and mobility by turning large amounts of complex transportation data into insights for smart, data-driven operations and planning decisions. Iteris will display the HERE Map, including speed limits, lanes, and mile markers in ClearGuide, providing customers with high-quality map data. ClearGuide will also incorporate HERE Traffic products, including HERE Real-time Traffic and HERE Traffic Analytics data, to provide accurate traffic information. Further, Iteris may utilize HERE’s best-in-class platform services to allow a distinct path for ClearGuide to meet more customer requirements moving forward. “A key part of the HERE mission is to enable a digital representation of reality to radically improve the way the world moves, lives and interacts, and to help customers and developers power applications that can plan ahead, react with speed and increase road safety,” said Miranda Ashby-Annoon, Senior Director of Public Sector Sales at HERE. “We are excited that HERE will be able to provide ClearGuide users with greater access to high-quality HERE Map data and platform services, allowing them to improve planning, operations and the safety of their road networks.” The ClearGuide solution is a key component of Iteris’ ClearMobility Platform, the world’s most complete solution to monitor, visualize and optimize mobility infrastructure continuously. ClearMobility applies cloud computing, artificial intelligence, advanced sensors, advisory services and managed services to help ensure roads are safe, travel is efficient, and communities thrive. About Iteris, Inc. Iteris is the world’s trusted technology ecosystem for smart mobility infrastructure management. Delivered through Iteris’ ClearMobility Platform, our cloud-enabled end-to-end solutions monitor, visualize and optimize mobility infrastructure around the world, and help bridge legacy technology silos to unlock the future of transportation. That’s why more than 10,000 public agencies and private-sector enterprises focused on mobility rely on Iteris every day. Visit www.iteris.com for more information, and join the conversation on Twitter, LinkedIn and Facebook. About HERE Technologies HERE has been a pioneer in mapping and location technology for almost 40 years. Today, HERE’s location platform is recognized as the most complete in the industry, powering location-based products, services and custom maps for organizations and enterprises across the globe. From autonomous driving and seamless logistics to new mobility experiences, HERE allows its partners and customers to innovate while retaining control over their data and safeguarding privacy. Find out how HERE is moving the world forward at here.com. # # # For Iteris media and investment inquiries, please contact: Iteris Media Contact Breanna Wallace Tel: (949) 996-5348 Email: brwallace@iteris.com Iteris Investor Relations MKR Investor Relations, Inc. Todd Kehrli Tel: (213) 277-5550 Email: iti@mkr-group.com Iteris Forward Looking Statements This release may contain forward-looking statements, which speak only as of the date hereof and are based upon our current expectations and the information available to us at this time. Words such as "believes," "anticipates," "expects," "intends," "plans," "seeks," "estimates," "may," “should,” “will,” "can," and variations of these words or similar expressions are intended to identify forward-looking statements. These statements include, but are not limited to, statements about the agreement and the benefits and impacts of the solutions integrated into the ClearMobility Platform. Such statements are not guarantees of future performance and are subject to certain risks, uncertainties, and assumptions that are difficult to predict, and actual results could differ materially and adversely from those expressed in any forward-looking statements as a result of various factors. Important factors that may cause such a difference include, but are not limited to, our ability to provide our services and products in a cost-efficient manner; our ability to effectively introduce, market and gain broad acceptance of our new and existing product and service offerings; the potential impact of product and service offerings from competitors and other competitive pressures; challenges in the development of software-based solutions generally; and the impact of general economic, political and other conditions in the markets we address. Further information on Iteris, Inc., including additional risk factors that may affect our forward-looking statements, is contained in our Annual Report on Form 10-K, our Quarterly Reports on Form 10-Q, our Current Reports on Form 8-K, and our other SEC filings that are available through the SEC’s website (www.sec.gov). For HERE Technologies media and investment inquiries, please contact: Reed Findlay +1 703 966 6284 Reed.findlay@here.com Jordan Stark +1 312 316 4537 Jordan.stark@here.com'
