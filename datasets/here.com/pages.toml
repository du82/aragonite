["https://here.com/developer/rest-apis"]
title = "HERE REST APIs | Portable APIs for Maps, Routing and More | HERE"
description = "HERE REST APIs bring powerful location functionality into your app with platform-independent HTTP GET methods for maps, routing, geocoding, places, positioning, traffic, transit and more."
full_description = "HERE REST APIs Integrate powerful location features with a flexible and lightweight REST architecture Get started See documentation Enrich your apps with powerful location features Discover RESTful web services that serve different purposes – from insightful map rendering to precise geocoding and search as well as optimized and safe routing.Whether you’re providing truck routing for fleets or navigating users through the city with different transport modes, HERE REST APIs provide you with everything you need to put location at the heart of your app: rendering insightful maps, micro-point address and PoI search, comprehensive routing and more.Additional advanced location features include map attributes (access to premium features such as speed limits, traffic lights, dynamic EV PoI data and road curvature), EV charge-aware routing, matrix and isoline routing, waypoints sequencing, route matching, geofencing and more. Code samples See all Geocoding and search examples Enabling APIs and capabilities FeatureDescriptionVector Tile APIIntegrate client-side rendered vector tiles and customize the look and feel of the map by changing, removing or adding specific map properties or objects.Raster Tile APIRaster Tile API is a RESTful web service that allows to request map tile images with predefined styles for all regions in the world. It supports different map views, e.g., base, satellite and hybrid maps, day/night map schemes, multiple languages and geopolitical views. Raster Tile API is the successor to the Map Tile API and preserves its best features, while adding new map styles and datasets (e.g., Japan coverage).Map Image APIGet access to pre-rendered map images that are optimized for desktop and mobile devices. Add route polygons, POI labels and other objects on top of the map to give your users the insights they need.Geocoding and Search APIAccurately pinpoint geo-coordinates, addresses and Places/POIs on the map; explore a vast database of Places/POIs through one box search and get better suggestions with fewer strokes with autosuggest.Routing APIComplete complex journeys more efficiently with advanced routing algorithms including truck routing, large scale matrix routing and traffic-enabled routing. Get accurate ETAs and routing instructions in over 108 languages.Matrix Routing APICalculate routing matrices of travel times or distances for up to 10,000 origins and destinations. Consider various transportation options and modes for car, truck and pedestrian.Isoline Routing APIGenerate isolines polygons which represent the area of reach from a given point based on time, distance or energy consumption (fuel, electricity), for car (incl. EV), truck or pedestrian modes.Waypoints Sequencing APICalculate the optimal sequence of waypoints for a single vehicle, by time, distance or commercial value (pick-up along a route), for up to 200 waypoints, while taking into account parameters like vehicle type and historical traffic data.Route Matching APIAccurately match GPS traces to the HERE road network to deliver the most probable route a moving asset has been on, while also detecting illegal maneuvers.Map Attributes APIAccess to HERE premium map content, including height and slope values, curvature, speed limits, traffic lights, enhanced geometry/ ADAS, and more, which can be easily integrated into any application.Geofencing APIMonitor mobile assets in reference to a geographic area (e.g. polyline, polygons and points)​.Public Transit APIProvide the best public transit routes while highlighting walking directions to stops, pedestrian access points, station locations and transfer locations along the way.Intermodal Routing APIProvide a choice of routes that combine car, bike, taxi, pedestrian and public transit modes while taking into account several variables: real-time traffic, incidents, public transit timetables and other dynamic information.Traffic APIAdd real-world context to your application by integrating real-time and historical traffic information about accidents, congestion, construction and more.Positioning APIBuild applications that require location estimates based on radio network measurement data. Supported measurement data includes 2G, 3G, 4G, and WLAN measurements.Tracking APIStore and retrieve the location and user-defined telemetry of IoT devices for real-time and historical tracking and geofencing.Weather APIGet current weather reports or weather forecasts and check for severe weather alerts at a specific location. Connect with HERE developers Slack Join the community Our Slack Workspace LinkedIn Stay up to date HERE Developers Twitter Follow us for the latest updates See what's happening GitHub Check out our repositories See the projects Sign up for free Start building location-rich apps with HERE REST APIs. Get started See documentation"
