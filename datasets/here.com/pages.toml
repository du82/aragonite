pp. Flexible map (3DLM, layers, etc.) Customize the map view to suit your personal preferences and travel time. Choose between satellite view or plain map and select your preferred layers and map elements. Android Auto & Car Play Seamlessly connect your device with your car to interact with your phone's apps on your car's display. Right-to-left languages support Get full support for right-to-left languages like Arabic and Hebrew which are integrated in the app. Related products and services Unlock smart navigation Unlock smart navigation Enjoy stress-free journeys with smart routing across all transport modes, accurate traffic prediction, optimized fleet management and precise location tracking. HERE Routing Plan stress-free journeys. Discover our routing portfolio designed for various modes of transport. HERE Real-Time Traffic Help drivers predict traffic delays and calculate routes with more safety and accuracy. HERE Tour Planning Improve how you utilize your fleet with many-to-many route planning and customizable, en route optimization. HERE Tracking Streamline operations, reduce costs and improve end-to-end supply chain visibility, performance and resilience. Related documentation HERE WeGo Pro documentation View documentation Get in touch Find out how HERE WeGo Pro can provide you with a navigation experience, tailored for commercial vehicles. Contact us"
