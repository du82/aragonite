 answers to questions you may have about HERE cars, map data, and privacy What about street level imagery and privacy at HERE? We have a great respect for privacy and have built extensive features into our street level imagery technology to protect your privacy, in addition to giving careful consideration to the scope of our data collection.Our technology includes industry-leading automated software and advanced algorithms used to detect and blur faces and license plates to protect individual privacy. Images are published only after this blurring.Our focus is on key commercial areas, public roads and areas with high search or point-of-interest (POI) concentration.The images captured are the same types that tourists or city residents would take while exploring by bus, by car or on foot.We operate in accordance with each country's requirements and with the appropriate government officials and non-government privacy advocates to safeguard the privacy of citizens.HERE is responsible for the use of personal data. For more information about our privacy policy and how we collect and use personal data please visit www.here.com/privacy. How can I identify a vehicle and find more information? The vehicles will be clearly marked with our company name or logo. Drivers have brochures that provide details as to why we are collecting images and where questions and concerns can be addressed. How and when will street level images be created? The primary focus will be on public roads of commercial interest and areas with high concentration of points of interest (POIs). Street level images will be created using cameras mounted on clearly marked cars that will travel through selected areas. These images are recorded in the vehicles and are later transferred to a secure facility for image and privacy processing. Filming and location dates can be found above. What is the purpose of collecting street level imagery? The imagery is to be used for developing and improving HERE products/services and for internal use by HERE’s customers. How does street-level imagery affect privacy? As the cars travel through public roads they collect street-level imagery of its surroundings. That imagery inevitably includes not only the roads themselves, road signs, landmarks and the like but also persons and license plates of cars which we blur before publication. We operate our street-level imagery activities so that we comply with applicable laws governing the acquisition and publishing of imagery and in accordance with our privacy policy. What measures do you take to ensure that street level pictures don't violate the privacy of individuals? We use industry-leading, automated software and advanced algorithms to detect and blur portions of images that may raise privacy concerns, including faces and license plates. The automated software and advanced algorithms are based on years of research investments. How accurate is the blurring and how can I ask for blurring or removal of images after the blurred imagery has been made available to the public (if applicable)? Our internal testing has shown that the privacy algorithms and detection rates are among the best available in the industry. As with all automated approaches, there is a chance that some images may come through that should have been blurred. For those instances, after the blurred imagery has been made available to the public, we will provide internet-based services for individuals to identify and report concerns of any published images directly to us. Look for the reporting link where you saw the image. What happens if someone requests an image be removed after the blurred imagery has been made available to the public? Each removal request will be individually handled and promptly reviewed by a team of experts to ensure the appropriate response. Are you collecting Wi-Fi data? No. Who is the data controller? HERE Global B.V., Kennedyplein 222 -226, 5611 ZT Eindhoven, Netherlands.In matters pertaining to HERE’s privacy practices you may contact our Data Protection Officer at:HERE Global B.V.c/o PrivacyKennedyplein 222 -2265611 ZT EindhovenNetherlandsEmail: privacy@here.comWebform: https://legal.here.com/en-gb/here-data-subject-request Why does HERE want to know my location when I’m using wego.here.com? A green dot on the map shows your location.You can also explore near your location to see nearby places on the map. HERE doesn't store, save, send or process your location info in any other way.To learn more, check out our Privacy Policy. Someone has added my private information to the map. What can I do to remove it? If your private information appears on a place on HERE maps, you can report it to have it removed – just click on the Feedback link in the footer of the map.We'll investigate and remove the place from the map if necessary, in accordance with applicable law. It could take up some time, so please be patient.In some cases, please note that the entity using our maps may overlay their own content on top of the map. This could mean that the information you are concerned about might not even be held by us, but by the other entity. In such circumstances, we will ask you to contact that entity directly. Related Resources FAQs in Czech Download now (132.76 KB) FAQs in Hungarian Download now (72.01 KB) FAQs in German Download now (773.58 KB) FAQs in North Macedonian Download now (117.85 KB)"
