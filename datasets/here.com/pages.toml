title = "HERE WeGo | Maps & Navigation | Applications | HERE"
description = "Meet the new revamped HERE WeGo! The free navigation app now includes bike & car-sharing routes, walking directions, offline maps, and more. Available on iOS, Android & Huawei app stores."
full_description = '''HERE WeGo The personal navigation app that helps you find the best routes, avoid traffic jams and explore new places stress-free wherever you go, both online and offline. Contact us Discover the map app that makes your journeys stress-free HERE WeGo is a free mobile application and journey planner designed to support your travels, from simple commutes to complex multi-modal trips. With WeGo, you can plan and perform optimal routes effortlessly, using your preferred mode of transportation.Experience the navigation app that prioritizes your privacy and understands the importance of punctuality.By combining security and flexibility, WeGo ensures that your navigation experience meets your specific needs while keeping your data private and secure.Whether you're a frequent traveler, vacationer or daily commuter, you don't have to worry about losing your way ever again.From multi-stop guidance to dynamic estimated time of arrival (ETA) calculations that consider live traffic updates, every aspect of your journey is carefully considered. And don't worry about an internet connection. Thanks to the app's offline capability, you can navigate confidently with or without internet. Find on the App Store Download for iOS Get it on Google Play Download for Android Search in AppGallery Download for Huawei Search in Galaxy Store Download for Samsung Your advanced mapping solution for smooth travels Access the most advanced navigation app Discover seamless traveling support built on more than 30 years of experience. Get unparalleled data accuracy and reliability trusted by the largest enterprises across the globe. Enjoy more flexibility, privacy and accuracy Experience the real-time navigation that safeguards your privacy and gives you complete control over your data, with accurate ETA that make sure you are always on time. Navigate anywhere, even when offline Make travel planning easy with or without an internet connection. Explore new destinations worry-free using the WeGo offline map capability on all types of devices. The mobile map app you need to navigate the world effortlessly Experience seamless turn-by-turn guidance Get real-time updates on traffic conditions and dynamic ETA calculations, including intuitive maneuver prompts with voice commands in multiple languages. Leverage spatial 3D sound, lane assist and speed limit warnings for a stress-free and efficient navigation experience, both online and offline. Stay connected anywhere with offline mode No internet? No problem. With WeGo, you can download maps of countries and regions prior to your trip, ensuring access to navigation even without a network connection. Whether you're navigating remote areas or avoiding expensive roaming charges abroad, WeGo makes sure you can always explore with ease. Travel safe with global speed limit updates Stay informed with global speed limits displayed throughout your route. Set custom speed restrictions to match your vehicle's capabilities and receive warnings if you exceed them. Stay alert about speed cameras along the way (with varied availability) and enjoy accurate estimated times of arrival for a smooth journey. Enjoy accurate door-to-door travel support Planning your entire journey has never been easier. WeGo gives you a comprehensive view of your entire trip, including walking times from your starting point to your vehicle and from your parked spot to your destination. The app also remembers your parking location to provide accurate ETAs for a seamless commute. Additional Features Guidance assistance (lanes, road signs, etc.) Experience the height of safety with our detailed guidance assistance functions. Enjoy lane suggestions, speed limit notifications, road sign displays, safety camera alerts and more. Route planning Effortlessly plan your journey with multiple stops whether traveling for work or leisure. Discover the optimal route, edit it in real-time, easily adjust the order of stops and more. Rest areas Be in the know about the best rest stops en route. Whether it's a fuel station, hotel or restaurant, get information about distance and details for upcoming stops. Continuous availability Enjoy global map coverage for a safe journey anywhere. Download a regional, country or continental map to reach your destination even when offline. Multi-modality (all modes) Plan your journey your way whether you are traveling by car, bike, public transport or on foot. Collections Save all your favorite places in the app and organize them according to your preferences. In-app feedback Help us improve maps by sharing information about places, traffic, road signs and more. See your contributions reflected in the app. Flexible map (3DLM, layers, etc.) Customize the map view to suit your personal preferences and travel time. Choose between satellite view or plain map and select your preferred layers and map elements. Android Auto & Car Play Seamlessly connect your device with your car to interact with your phone's apps on your car's display. Right-to-left languages support Get full support for right-to-left languages like Arabic and Hebrew which are integrated in the app. Frequently asked questions What user data is HERE WeGo collecting and why? No personal user data is collected without the explicit user consent. You can withdraw your given consent at any moment if you wish to do so. HERE welcomes the users to share certain data in order to provide a better service, and offers users to consent to it. Even when consent is given, all collected data used in services is fully anonymized and can't be tracked back to individuals. Users can request the removal of all collected personal data in the app. We collect the following categories of information:Registration and contact detailsSome features may require the use of a HERE account, such as when you want to synchronize your Collections. You can also continue using other features of the service without signing in. When you sign up for a HERE account, we collect your name, email address, date of birth and country of residence. Once you are logged in with your HERE account, we automatically try to synchronize your recent searches and the collections associated with your HERE account. Location data and place informationThe service makes use of information about your actual location ("location data") and places ("place information"). Location data reveals where you currently are or where you have been. Location Data is based on available positioning methods, such as Assisted GPS. In many device models, the user interface of the Service identifies the use of positioning with an icon. Place information is general information pertaining to particular geographical locations (ie, a city of the location of a restaurant) which you provided to us in your Collections, for example. Unless otherwise stated, we use random identifiers in connection with your location data that do not identify you personally. When you start to use the service, the applicable service activates your selected positioning methods to retrieve your current location. The service may send your location data to HERE when you use location-enabled features of the service online, such as asking for information about nearby services or offerings, using search features, as well as when the service asks for new maps for new areas you previously navigated to. The location data may be collected when you use the traffic feature for service improvement purposes without identifying you personally. Place information may be sent to HERE, for example, when you synchronize your collections. How can I enable or disable traffic info? Turning on 'Traffic' allows the app to send HERE information about your ride (ie, your car's location, the directions of travel, etc). We combine this info with what other drivers have sent to provide you with better and faster routes. To turn traffic info on:Open the WeGo appSelect 'About, Legal and Notices'Select 'HERE Traffic'Turn it on You can also find this toggle by:Opening the WeGo appSelecting the layer icon on the bottom right cornerTurning on/off the 'Traffic' option How do I add stops to my route? To add stops to your route, you can follow two different paths. The first one is by using the initial route planner of WeGo before starting the navigation:Open the WeGo appSelect your final destinationCalculate your car, bike or pedestrian routeClick on the three lines icon on the right side of the starting point/destination fieldAdd one or more stops to your route and arrange them according to your preferencesStart your navigation with WeGo and go through all the stops you've added The second option is to add a stop to your route after the navigation has already started:Open the WeGo appEnter your destination and click on 'Directions'Start the navigation by clicking on the blue arrow of one of the alternative routesDrag the bottom navigation bar up to expand the menuThese options will become available: 'Search', 'Gas', 'Parking', 'Restaurants' and 'Toilets'See available waypoints by clicking on the relevant icon, or selecting 'Search' to add a specific addressYou can search for these places either along your route or at a destinationSelect your choice of waypoint from the list or map and click on 'Add stop'The stop is now added to your route I have an electric vehicle. How can HERE WeGo help me? HERE WeGo covers electric vehicles and shows the locations of charging points. To enable this function on your app:Open the WeGo app and drag the bottom bar up to expand the menuSelect 'Settings'Under 'General', select 'Fuel type'Under 'Fuel type', select 'Electric'Whenever you search for EV charging stations or try to get a waypoint while navigating (by selecting 'Charging', for example), the app will take into account that you have an electric vehicle and show you the relevant results You can also search for electric charging stations in WeGo and verify whether these points are available or occupied*.* Service is available for a limited amount of regions only. How can I download and use offline maps? To navigate offline, download the offline maps of the areas you wish to navigate:Launch the app and drag up the bottom bar to expand the menuUnder 'Your Maps', you'll see a 'Download maps' optionThe app will display information about your system storage (ie, how much free space you have for maps) and a button that says 'Download new maps'We group offline maps by continent to make them easier to find. Select the continent where your region of interest is located to search for the relevant mapsSelect the download icon to the right of the region's name and wait for the download to complete Before navigating offline, remember to tag the 'Use app offline' option located in the app's menu. What is the 'Rest Areas' feature in WeGo? How can use it for my navigation? Rest Areas are public facilities available on highways or motorways where drivers can take a break. You can usually find gas stations, restrooms and/or places to buy food in these areas.If you open the WeGo app, drag up the bottom bar and select 'Settings', you'll find a toggle switch for the 'Rest Areas' functionality. Once turned on, the app will start showing the rest areas available on your way (if any), especially when you're driving on highways.When the app shows the rest area icon, you can click on it and add it as a stop on your route. What is the 'Get door-to-door directions' feature? How can I use it? When the 'Door-to-door directions' feature is activated, WeGo will offer you a complete door-to-door navigation experience. This works by:Showing the walking section from your current location until your parked vehicleHaving an automatic handover from the pedestrian to the car navigationGuiding you throughout all the car navigationShowing you when to stop driving (and where to park)Guiding you to walk the final section to arrive at your destination (in case the destination is not reachable by car, for example) To activate this mode:Open the WeGo appSelect the final destination of your routeClick on 'Directions'Select 'Route preferences'Turn on the 'Get Door-to-door navigation' option Note: To use the feature, make sure you previously saved the location of your car. What should I do when I come across inaccurate and/or missing data on WeGo maps? We work hard to keep the maps as current as possible but as data constantly changes around the world, some of these changes can take a while before they show p in our maps. Please, use the 'Suggest an edit' option when you'd like to report issues about outdated POI information in our maps. If you'd like to report any other issue, please send an email to appsupport@here.com with more details or use the Map Creator tool. Find on the App Store Download for iOS Get it on Google Play Download for Android Search in AppGallery Download for Huawei Search in Galaxy Store Download for Samsung Related resources Blogpost 3 min read How HERE WeGo makes driving an electric vehicle easier HERE WeGo, which serves as an alternative to Google and Apple Maps, is an app people can use to plan their journeys, book hotel rooms, see parking availability at their destination, and much more. /learn/blog/here-wego-electric-vehicle Blogpost 3 min read HERE WeGo: now you can plan your holiday through our app A partnership with Booking.com allows users to book hotel rooms directly through the app. Visit any area you want to stay in, and the map will show which hotels have rooms available tonight. /learn/blog/here-wego-2023 Blogpost 3 min read HERE WeGo moves onwards and upwards HERE WeGo has incorporated feedback from users to improve and add new features – and help to refine the app is still needed.HERE WeGo, a navigation tool that serves as an alternative to Google Maps, has improved for the better thanks to user feedback. /learn/blog/here-wego-app-2022 Version update 4.13.200 New features:Change your sound preferences during guidance!Single tap for alerts only. Tap again to mute navigation (both alerts and voice) and tap once more for navigation with full sound on. Bug fixes:Android Auto stability improvedA problem of language mixture during guidance resolvedMany other improvements and bug fixes Get in touch Find out how HERE WeGo can provide you with a navigation experience that's tailored to your needs. Contact us'''
year_published = 2025
