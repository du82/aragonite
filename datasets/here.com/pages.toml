full_description = "Press Releases HERE and Murata Manufacturing join forces to tackle traffic woes in Jakarta, Indonesia Download now (83.13 KB) Yokohama, Singapore 6 December 2023 HERE map and traffic data are integrated with Murata’s traffic counter system to help city authorities in Indonesia’s capital city Jakarta to improve traffic management­HERE Technologies, the leading location data and technology platform, today announced that its partnership with Murata Manufacturing Co., Ltd. (Murata), a leader in advanced electronics design and manufacturing, is delivering city authorities in Jakarta, Indonesia unprecedented roadway congestion insights and capabilities to monitor, predict and address a variety of traffic-related challenges. Jakarta is notorious for traffic jams. According to the Jakarta Police traffic division, commuters lose an average of 30 minutes per trip to traffic congestion in 2022[1]. This amounts to an estimate of USD 4.5 billion in economic losses for the country in the last year[1]. The collaboration between HERE and Murata has paved the way for a smarter and more sustainable traffic management for the city of Jakarta. By integrating map and traffic data from HERE with Murata’s traffic counter system that uses LiDAR technology, city authorities in Jakarta now have unprecedented insights into traffic patterns – including real-time traffic data such as vehicle count, classification, flow direction and speed; peak traffic hours and popular travel routes – to monitor, predict, and proactively address a wide array of urban mobility challenges.The traffic management system is also capable of measuring environmental conditions such as predicting rain based on carbon dioxide and atmospheric pressure sensors to identify areas that could be/or are flooded or impassable. This allows for a better visualization and management of road traffic, including changing traffic light cycles depending on traffic conditions to reduce traffic bottlenecks in the city’s busiest corridors and minimise accidents. Hiroaki Tsumori, Project Manager of Traffic Counter Business, Murata Manufacturing Co., Ltd. said, “We are excited to collaborate with HERE on this digital transformation initiative to alleviate traffic congestion in Jakarta. Prior to this partnership, we were simply overlaying traffic data onto a digitized map. However, our partnership with HERE has paved the way for a smarter, data-driven traffic management solution that can now tackle a broader spectrum of transportation challenges in Indonesia’s capital.”Murata and HERE were able to build a traffic management model that not only analyzes traffic issues in Jakarta from various angles, but also provides commuters with efficient travel routes that avoid traffic congestions, reduce fuel consumption and in-turn lower carbon emissions.As the capabilities continue to evolve, city officials in Jakarta are looking to incorporate predictive analytics that leverages historical traffic data to proactively suggest optimal routes before a traffic congestion occurs. There are also plans to further integrate this system with Indonesia’s smart city initiatives, connecting it with traffic lights management and parking systems, as well as with public transportation networks. Takashi Eda, Country Manager for Japan at HERE Technologies said, “This strategic partnership between HERE and Murata reflects both companies’ commitment to transforming urban and smart mobility through technology. We are delighted to partner with Murata to provide insights and data that has proven valuable to enhancing traffic visualisation and management in Jakarta. Together with Murata, we look forward to taking this success beyond Indonesia and contributing to a more sustainable and efficient transportation system to more cities around the world.” Media contactHERE TechnologiesCamy Cheng+65 9088 4127Camy.cheng@here.com About HERE TechnologiesHERE has been a pioneer in mapping and location technology for almost 40 years. Today, HERE’s location platform is recognized as the most complete in the industry, powering location-based products, services and custom maps for organizations and enterprises across the globe. From autonomous driving and seamless logistics to new mobility experiences, HERE allows its partners and customers to innovate while retaining control over their data and safeguarding privacy. Find out how HERE is moving the world forward at here.com. More Press Releases See all Corporate 4 Mar 2025 Amsterdam HERE Technologies Holds Top Ranking in Counterpoint’s 2024 Location Platform Effectiveness Index Read more Corporate 4 Mar 2025 Amsterdam HERE Technologies belegt Spitzenplatz im Counterpoint Location Platform Effectiveness Index 2024 Read more Partners 12 Feb 2025 Las Vegas HERE und project44 weiten Zusammenarbeit für Lieferketten-Transparenz aus Read more"
