["https://here.com/learn/blog/leaders-in-logistics-summit-2025"]
title = "For smarter logistics, just add location intelligence | HERE"
description = "Bart Coppelmans, HERE’s Senior Director of Product Management breaks down how logistics businesses can stay ahead—from nailing last-mile delivery to harnessing AI and real-time data."
full_description = '''HERE360 news For smarter logistics, just add location intelligence Fleet Management Supply Chain 7 min read 05 March 2025 For smarter logistics, just add location intelligence Bart Coppelmans, HERE’s Senior Director of Product Management breaks down how logistics businesses can stay ahead—from nailing last-mile delivery to harnessing AI and real-time data. Ahead of next week’s Leaders in Logistics Summit in Berlin, HERE360 caught up with Bart Coppelmans, HERE’s Senior Director of Product Management, to get his take on the future of parcel delivery. His insights, rooted in game-changing tech like location intelligence, artificial intelligence (AI) and real-time data, are a goldmine for carriers, postal services, third-party logistics (3PLs) providers and retail logistics teams looking to stay competitive.A perfect blendFor delivery businesses, inefficient routes mean wasted fuel, higher costs and delayed shipments. That’s where smarter route planning makes a real difference. “Our optimization tools help companies handle complex delivery schedules with ease, ensuring their fleets operate as efficiently as possible,” said Coppelmans.HERE’s fleet solutions factor in real-world challenges—traffic conditions, time-sensitive deliveries and even local regulations—so businesses can stay on track. By leveraging advanced AI techniques, these solutions optimize route planning to identify the most efficient paths for every delivery. Whether companies use a mix of electric and traditional vehicles, the system makes it seamless to plan routes that consider EV range, charging needs and operational efficiency.“With more businesses adopting electric fleets, we make sure they can integrate seamlessly into daily operations,” Coppelmans explained.By optimizing routes, businesses cut costs, improve sustainability and keep deliveries running smoothly—ensuring every vehicle is used to its full potential. This not only boosts operational performance but also leads to faster, more reliable deliveries, improving customer satisfaction and fostering trust with every interaction. Read more: Unified maps that work as one, so fleets can too Mastering the last mile—and last meterWith parcel delivery volumes skyrocketing every year, the last mile remains a top priority for cutting costs and keeping customers happy. But Coppelmans pushed the conversation further, emphasizing the importance of last-meter precision—getting packages not just to the right address, but to the exact spot the customer wants them.“It’s not enough to deliver to an address,” he explained. “Precision means ensuring packages reach the exact unit in an apartment complex, the correct locker or a specified safe place.”This level of accuracy comes with its own challenges, like decoding sub-address details, finding the right entrance for multi-unit buildings and following special delivery instructions.“One big step forward here is micro-point addressing,” Coppelmans explained. “By tying sub-address data to main addresses, companies can plan with a level of accuracy they’ve never had before.”Coppelmans also highlighted how feedback loops and historical data can fine-tune operations. “Using location intelligence to spot patterns—like where drivers usually park or which building entrances they use most—can make a huge difference in efficiency,” he added. HERE and Kardinal have teamed up to help Omniva, the Baltic region’s biggest player in parcel lockers, tackle the eCommerce explosion. Omniva: taking parcel locker delivery to the next levelOmniva, the leading parcel locker provider in the Baltic region, has partnered with HERE and Kardinal to implement the TAO (Territory Analytics and Optimization) solution, enhancing its delivery network to meet the growing demands of eCommerce.Key benefits of the TAO solution:Optimized fleet management: Kardinal TAO analyzes historical data to determine the ideal fleet size and optimize delivery routes.Dynamic route planning: Integration with HERE Matrix Routing API helps adapt to real-time traffic conditions and fluctuations in parcel volume.Enhanced driver efficiency: Assigning drivers to consistent territories increases familiarity, reducing delivery times and improving performance.Scalability for future growth: The solution is designed to support Omniva’s expansion into Central Asia while accommodating rising demand from major eCommerce players.Improved cost control & productivity: By optimizing parcel locker locations and route planning, Omniva aims to reduce operational costs and boost overall efficiency.Read the full interview with Kardinal and Omniva. The AI advantageAI and real-time data are no longer just buzzwords—they’re the backbone of modern logistics. According to Coppelmans, while these technologies aren’t new, their applications are getting smarter and more critical to everyday operations. “AI is already built into so many logistics systems, helping companies plan better routes, optimize fleets and cut costs,” he said.One standout example is HERE’s integration of AI-driven tools for planning, routing and execution. “We’re exploring how AI can automatically pull insights from massive datasets—whether it’s finding the best parking spots or suggesting ways to handle unexpected delays,” Coppelmans shared.And it’s not just about planning. With the HERE AI Assistant recently showcased at CES, Coppelmans envisions integrating these tools directly into drivers’ workflows, especially for last-mile delivery. The goal? To create what he calls “consistency between planning, execution and analytics” in real time. Read more — Sustainability first: tech’s impact on driving style, stress and CO2 Sustainability firstSustainability was a recurring theme in Coppelmans’s vision for the future of logistics. He pointed to cities like London, where stricter vehicle access rules and emissions standards are pushing companies to rethink their fleets and operations.One key strategy is better route optimization. “Simply planning smarter routes reduces the number of vehicles needed, which cuts emissions and eases congestion,” said Coppelmans. He also highlighted the benefits of dynamic delivery windows and reusing fleets to minimize miles traveled.But for Coppelmans, the real challenge goes beyond electric vehicles or optimized routes. “Companies need to bake regulations—like restricted zones—directly into their planning systems,” he said. “Otherwise, they risk denied deliveries or hefty fines.”By tackling these issues now, businesses can align efficiency with sustainability goals for the long haul. Read more — The state of freight: why end-to-end visibility has become non-negotiable Looking ahead in logisticsWhen asked about the next big things in logistics, Coppelmans pointed to automation and generative AI as game-changers. “A lot of operations are still manual, but AI opens the door not just to automation, but to smarter decision-making across planning, dispatching and execution,” he said.Coppelmans' ultimate vision? For logistics companies to build systems that are as adaptable as they are efficient. “The winners will be the ones who adopt tools that make their business dynamic,” he concluded. “Whether it’s onboarding new drivers overnight or adjusting to unexpected changes, agility will be the defining strength.” Louis Boroditsky Managing Editor, HERE360 Share article: Louis Boroditsky Managing Editor, HERE360 Plan complex tours and route fleets Learn more Have your say /** * RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS. * LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables */ /* var disqus_config = function () { this.page.url = PAGE_URL; // Replace PAGE_URL with your page's canonical URL variable this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable }; */ var disqus_config = function () { this.language = "en"; }; (function() { // DON'T EDIT BELOW THIS LINE var d = document, s = d.createElement('script'); s.src = 'https://here-3.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a> Related articles Fleet Management Supply Chain For smarter logistics, just add location intelligence Louis Boroditsky 05 Mar 25 Supply Chain Logistics in focus: what is the difference between 3pl and 4pl? Maja Stefanovic 29 Aug 24 Supply Chain Towpaths of tomorrow: why rivers are the new highways Caroline Christie 22 Aug 24 Sign up for our newsletter Why sign up: Latest offers and discounts Tailored content delivered weekly Exclusive events One click to unsubscribe'''
