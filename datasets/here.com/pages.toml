title = "How Korem Combines HERE Traffic Data with Personalized DaaS to Deliver Value | HERE"
description = "For over 20 years, Korem has been a trusted HERE Technologies partner, leveraging HERE’s high-quality data to deliver powerful geospatial solutions. Since 1993, Korem has built…"
full_description = '''Developer blog How Korem Combines HERE Traffic Data with Personalized DaaS to Deliver Value #BuiltWithHERE 6 min read 05 February 2025 How Korem Combines HERE Traffic Data with Personalized DaaS to Deliver Value For over 20 years, Korem has been a trusted HERE Technologies partner, leveraging HERE’s high-quality data to deliver powerful geospatial solutions. Since 1993, Korem has built its reputation as a leader in geospatial data and technology. HERE's high-quality data, integrated with Korem’s expertise has been key to deliver cutting-edge geospatial solutions to clients.With it's personalized Data-as-a-Service (DaaS) offering, Korem simplifies the use of HERE Traffic Data, by transforming it into ready-to-use information. Korem’s DaaS model is designed to be flexible and agile, meeting customers’ unique needs. By leveraging cutting-edge geospatial technology and expertise from a dedicated team, Korem bridges the gap between the vast amount of data available and the actionable business insights needed to achieve faster time-to-value.Solving Big Data Challenges with KoremMany businesses often lack in-house expertise and financial resources to process and analyze large-scale, complex datasets. HERE Traffic Data, which collects billions of data points every day, requires advanced tools and expertise to achieve effective processing. Korem steps in with a team of geospatial experts and data scientists to handle the entire data processing pipeline, including standardization, trade area definition, both temporal and spatial aggregation, and delivery. This lets businesses focus on strategy while Korem takes care of the technical heavy lifting.By combining HERE Traffic Data with Korem’s DaaS offering, customers benefit from:High-quality, up-to-date data: Delivering freshly updated traffic data so clients can access the latest information that meets their requirements: daily, weekly, bi-weekly or monthly.Cost and time saving: Organizations avoid the complexities of data storage infrastructure, cloud processing costs and maintenance costs. With DaaS, they only pay for the data they use and can easily scale their solutions if needed.Accessibility and efficiency: Users can seamlessly access data anytime, from anywhere, fostering greater flexibility, enabling efficient collaboration in remote work environments. Use Case: How an Oil and Gas Leader Utilizes HERE Traffic Data via Korem’s Personalized DaaS OfferingOne of the largest oil and gas companies in North America works with Korem to analyze traffic patterns around its gas stations and convenience stores in Mexico. The goal? To better understand how vehicle flows — cars versus trucks — correlated with sales and site performance.The ChallengeThe client needed to analyze massive volumes of traffic data, broken down into highly granular time intervals (as short as five minutes), to get a clear picture of traffic flows near their locations. The average raw traffic data (car and trucks) for one day in Mexico weighs 2.8 to 4 gigabytes when uncompressed. Managing this scale of data internally wasn’t feasible.The SolutionKorem implemented a fully automated solution using HERE Traffic Data, hosted on the Azure Cloud. Weekly data updates were tailored to the client’s needs, with Korem validating results through pilot testing to ensure accuracy and a strong return on investment.Here’s how the process worked:Data Collection: At HERE, we take pride in acquiring high-quality probes from auto-grade connected and telematics-based vehicles to ensure accuracy. Our data is sourced from a highly diversified portfolio of over 170 providers, guaranteeing reliability. Using HERE’s extensive intellectual property portfolio in traffic modeling, we process the data to maintain our competitive edge.Quality Control (Trade Area Definition, Aggregation, and Normalization): Korem uses its own Trade Area Definition methodology for each of the client's sites and its competition. Temporal and spatial aggregations from HERE Traffic Data are then performed in a highly scalable cloud environment. Finally, Korem applies its normalization methodologies on the data, removing false negatives and positives to ensure accuracy. Data Compression: Korem compresses the data and converts it into a column-oriented, high-performance compression format like Parquet, to optimize Big Data processing.Data Delivery: Data is stored in optimal format directly on the client’s cloud-native platform, Snowflake in that case. Then, Korem uses the Azure Cloud platform, leveraging Databricks, Azure Data Factory and Snowflake to process, orchestrate and store the data. After more than a year of continuous delivery in form of Snowflake table, Korem has delivered over 1.2 billion rows (occurrences) of traffic data spanning six years (2017–2024).The ResultsWith Korem’s DaaS model and HERE Traffic Data, the client gained:Detailed Visibility: Insights into truck and car flows at each gas station across Mexico.Improved Sales Performance: A correlation between traffic patterns and site performance enabling strategic decisions.Operational Efficiency: An end-to-end automated solution eliminating the need for internal resource allocation. Bridging the Gap Between Data and DecisionsBy fully leveraging the potential of geospatial data, HERE and Korem’s customers can make informed, strategic decisions that drive business growth and optimize investments. Whether it's through enhanced site performance analysis or reliable demand forecasting, Korem’s Personalized DaaS offering proves to be a vital asset for businesses navigating the complexities of Big Data. Contact Korem’s experts today!Together, HERE and Korem are paving the way for smarter, data-driven decisions. Mohini Todkari Sr. Developer Evangelist Share article: Mohini Todkari Sr. Developer Evangelist Have your say /** * RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS. *