["https://here.com/jp/platform/location-services/geocoding-and-search"]
title = "Geocoding | ジオ・逆ジオコーディング API | HERE"
description = "HERE Geocoding & Search で住所を緯度経度座標に、またその逆 (逆ジオコーディング) に正確に変換し、高精度な位置情報を取得。詳細はこちら。"
full_description = "HERE Geocoding & Search Geocoding & Search ビジネスにおける時間削減に貢献する高精度かつ的確な位置情報コンテキスト お問い合わせ 高精度なジオコーディング (Geocoding) ・逆ジオコーディングAPIで検索を効率化 不正確なPOIデータ（施設情報）は、サービスの遅延や非効率化、顧客満足度の低下の原因につながります。 住所、POI情報に関する正確なジオコーディングを活用し、ビジネスを向上させます。 HERE Geocoding & Searchで住所を緯度経度座標に、または緯度経度座標を住所に置き換えること (逆ジオコーディング) により、高精度の位置情報を取得し、不正確な位置情報提供による混乱を最小限に抑えることが可能です。大規模なPOIデータのアーカイブで位置を検索し、エンドユーザーの幅広いニーズを満たすインフラストラクチャーを自由にカスタマイズできます。 最先端のジオコーディングAPIでアプリケーションをアップグレード 緯度・経度から住所、またその逆 (逆ジオコーディング) に正確に変換 弊社の地理情報システムでは、102か国以上の国や地域における4億ヶ所以上の検証済み住所やPOIデータを活用して、住所を緯度と経度へ、またはその逆に変換します (逆ジオコーディング)。 データの価値を向上 HERE Geocoding & Searchは、行政区画や郵便番号のエリアデータ、高精度な郵便番号情報など、非常に正確かつ的確な検索結果を活用し、品質レベルとPOI属性を適合させ、より多くの位置情報に関する知見を提供します。 検索をカスタマイズ 第三者データベースやロジックをHEREのジオコーディングサービスに追加し、お客様のニーズに合った検索にカスタマイズ、または強化することができます。保有する独自のPOIデータをHEREの地理情報システムに統合し、ビジネスに最適なランキングアルゴリズムを検索インフラストラクチャーに構築します。 関連製品： 情報（POI）データセットを単一の位置情報システムに統合可能：HERE Workspace HEREの最新POI、住所データベースにアクセス可能 RESTfulサービスとして利用でき、頻繁に更新されるHEREの位置情報、POI情報および住所のデータベースにアクセスできます。 構造化された住所あるいはフリーワードで住所を入力し、関連順または近い順にランク付けされた結果を取得できます。方位情報を使用して移動の方向を理解し、名称、カテゴリー、価格帯、連絡先などの情報をカバーするPlacesの豊富な属性を利用することが可能です。場所、住所、チェーンクエリ、カテゴリークエリーの入力を減らしてより優れた提案を取得することができます。 開発者向けのHEREの位置情報・地図関連APIに関する情報は、ディベロッパーページをご覧ください。 開発者のメリット リバースジオコーディング リバースジオコーディングサービスで、地理座標セットから特定地点の住所、ランドマーク、周辺情報を取得できます。 柔軟なインタラクション 場所やPOI情報のクリック機能を備えたジオ コーディングマッピングインターフェースで実際にその場にいるような夢中になれる体験を得ることができます。 ローカライズされた検索 ジオコーディングサービスを活用して住所フォーマットを変換。また、196か国においてフォーマットエラーを修正して位置を正確に特定します。 技術関連資料 HERE Geocoding & Searchの利用開始に必要な技術関連資料とコード例をご覧ください。 JS REST Android Lite Android Premium iOS Lite iOS Premium その他資料（英語） ジオコーディングとは何ですか？ ジオコーディングは住所や地名から緯度・経度を求めることです。 例えば目的地のマークを地図上に表示する際は、住所というある程度の広さを持った情報より、地球上の一点を定める座標である緯度・経度を利用した方が正確です。一方、日常の会話の中では、いくら正確な情報だからといっても数字の羅列である緯度、経度を伝えられてもイメージが湧きません。そこで、利用シーンに応じて、住所から緯度・経度に、もしくは緯度・経度から住所に変換できる仕組みが必要となります。後者が逆ジオコーディングです。 HEREの持つ地図情報サービスは、こうした変換を簡単に実装できる機能を提供しています。 ジオコーディングで出来ることは？ ジオコーディングは幅広い用途で活用されています。基本的には、特定の場所の住所などから緯度経度を調べることに使われますが、場所をより正確に特定することで、例えばサプライチェーンの不具合を最低限に抑え、ビジネス運営において常に最良の判断ができます。ジオコーディングはデータ管理や分析、位置情報分析などにも利用されています。 逆ジオコーディングとは？ 逆ジオコーディングはリバースジオコーディングとも呼ばれる技術で、既知の経度・緯度情報から住所を取得する方法です。 近年ではGPSレシーバーが小型化、高精度化したのに伴い、さまざまな電子機器に組み込まれ緯度・経度の位置情報を容易に取得できるようになりました。地図上のマークとして現在の位置が表示されるサービスが一般的ですが、馴染みのある住所で表示されると便利な場合もあります。そうした用途で活躍するのが逆ジオコーディングです。 HEREはそうした用途で活用できるジオコーディングデータベースとデータベースに容易にアクセスできるAPIを用意しています。 ジオコーディングサービスを選ぶポイントは何ですか？ 目的地までの最短ルートを計算する際には、ある程度の広さを持つ住所より地球上の一点を指し示す緯度・経度が便利であり、住所から正確な緯度・経度を求めるジオコーディングサービスが利用されます。 一方、駅やショッピングセンターなど住所がわからない場合でも場所を特定できなければ不便です。そこでPOI（Point of Interest）データと呼ばれる目的地とその緯度・経度情報を格納するデータベースが力を発揮します。データベースは「暮らし」「県庁」「東京都庁」というように階層構造で情報を管理し素早く目的地を見つけられるように構成されるものもあり、こうしたデータの充実がサービス選択のポイントです。 HEREは住所、POIデータに基づく正確なジオコーディング情報を提供するだけでなく、既に保有するPOIデータをHEREの地理情報システムに統合でき、柔軟なシステムの構築に貢献します。 ジオコーディングAPIとは何ですか？ ジオコーディングは住所から緯度・経度の情報を、逆ジオコーディングは緯度・経度情報から住所を取得する方法です。 こうした技術はアプリケーションの機能の一部として提供されることがほとんどです。アプリケーションの開発者はジオコーディングサービスを提供する会社の機能を利用してシステムを構築します。この機能がジオコーディングAPIです。 HEREのジオコーディングサービスは既に構築されたデータベースを追加してAPIによるジオコーディング、逆ジオコーディング検索と連携することができます。HEREのジオコーディングAPIは柔軟なシステムの構築をお手伝いします。 ご相談ください お客様の車両管理効率の向上を図ります。 お問い合わせ"
