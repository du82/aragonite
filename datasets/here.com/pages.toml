full_description = "Strategic Partners HERE & AWS partnership Rapid innovation enabled by location. Contact us HERE and AWS accelerate speed to market and time to value HERE Technologies and AWS are combining the strength of location technology with leading cloud and IT services to address location-related challenges in the supply chain and logistics industry worldwide.HERE, the world's leading location data and technology platform offers enterprise-grade map data with more detail, accuracy and flexibility to build better fleet management and supply chain solutions. AWS, a known leader in transportation and logistics delivers world-class infrastructure that shifts businesses to the data-driven cloud on a global scale. The security and stability of AWS servers give logistics companies the reliability they need to grow.Together, HERE and AWS power leading transportation and logistics applications, boosting shipment and asset visibility, optimizing first to last mile deliveries and creating next-generation supply chain solutions. .st0{fill:#383C45;} .st1{fill:#48DAD0;} .st2{fill:#F7981D;} We’re proud to offer an easy way for developers and companies to get started with HERE’s location services Tim Wagner GM of AWS Lambda, Amazon Web Services Inc. 2024 tech trends in transportation and logistics Gain insights into the advancements in real-time supply chain visibility and find out where there is still room for improvement. Download report ABI Whitepaper - Purchasing trends and criteria in fleet software Explore insights from 300+ T&L leaders on fleet management software, KPIs and their progress towards greater supply chain visibility. Conducted in partnership with ABI Research and Amazon Web Services (AWS), this white paper goes in depth on the key drivers and barriers to technology adoption, along with the capabilities T&L leaders want to see moving forward.Download the report and explore the findings. *Required field. We will use your information according to our privacy policy. HERE & AWS joint solutions HERE and Amazon Location Service With the integration of our location data we support enterprise customers and developers in use cases with precision and relevance at their core. Learn more HERE on AWS Marketplace Making it easy for developers to access enterprise-grade location intelligence and deploy natively on the AWS Cloud. Learn more HERE on AWS Serverless AWS serverless customers have access to market-leading location services from HERE, including Maps, Positioning, Traffic and much more. Learn more Customer stories powered by HERE & AWS Holcim Rastret Vodafone & Porsche Ford NIRA Dynamics Verizon Mercedes-Benz SameDay METRO.digital Holcim Holcim uses location to improve safety and sustainability Discover how the global leader in building materials and solutions created faster and more efficient concrete delivery.With HERE we have a partner on board who is able to provide mapping and navigation services across our global footprint.Philipp LeutigerChief Digital Officer, Holcim Download case study Rastret Now we can improve the delivery experience Read how HERE navigation tools enabled Rastret's software to plan smart routes and expand the pool of potential drivers for small and mid-size logistics companies.I am really impressed by the flexibility of HERE’s products. They save us a lot of work because they are ready-made solutions and we can focus on implementation.Miguel LoyaCTO, Rastret Download case study Vodafone & Porsche Vehicle-to-vehicle hazard warning HERE, Vodafone and Porsche partner on real-time warning system. If cars warn each other about hazards in real time, ­human lives can be saved Michael Reinartz Director of Innovation, Vodafone Germany Ford Giving drivers early warning of danger around the corner Together with Ford, we deliver a warning system to create awareness for upcoming road hazards. This is a significant step forward. Warnings are specific, relevant and tailored to try to help improve your specific journey Joerg Beyer Executive Director, Engineering, Ford, Europe Download case study NIRA Dynamics Creating the next level of mobility Watch how NIRA Dynamics utilizes the growing HERE ecosystem by reaching out to a larger audience. We can make use of the vast network of customers that HERE has from the beginning. Johan Brynas CPO, NIRA Dynamics Verizon Providing 5G-enabled collision avoidance Verizon's 5G Ultra Wideband capabilities, combined with HERE HD Live Map and Live Sense SDK, help warn vehicles about potential collisions. By harnessing the power of Verizon 5G Ultra Wideband and 5G Edge, along with HERE's proprietary 3D positioning algorithms, we are driving together toward a safer and more precise future. Laura Cochran Head of Product, Verizon Location Technology Mercedes-Benz Mercedes-Benz deploys HERE HD Live Map for DRIVE PILOT system HERE is among the world's first companies to provide an HD map for commercial production vehicles with Level 3 automated driving capabilities. This enables us to give our customers back one of the most precious things in life: time – combined with a luxurious driving experience. Georges Massing Vice President MBOS: Automated Driving, Powernet & Integration E/E, Mercedes-Benz AG Learn more SameDay SameDay HERE and SameDay leverage advanced on-demand tour planning to perform on-demand same- or next day last mile delivery planning. Download case study METRO.digital Automating tour planning for faster delivery Read about how HERE Tour Planning allowed METRO.digital to achieve operational efficiency, flexibility and continual business innovation to increase customer satisfaction by 13%, increase fleet planning automation by 37% and enable late orders.HERE offers the most comprehensive solution in the market, especially considering how many countries we operate in.Robert VilceaProduct Manager at METRO.digital Download case study Related resources eBooks Webinars Whitepaper Fleet software in 2024: buyer insights, needs, and pain points ABI Whitepaper - Purchasing trends and criteria in fleet software /solutions/fleet-management/purchasing-trends-and-criteria-in-fleet-software eBook 2024 tech trends in transportation & logistics Benchmarking AI adoption, sustainability and supply chain visibility /solutions/supply-chain/2024-logistics-tech-trends eBook Supply chain digitization and the journey forward ABI/AWS More than 300 supply chain leaders weigh in on the digitization journey. /solutions/supply-chain/supply-chain-digitization-and-the-journey-forward-ebook eBook Supply chain visibility: 5 questions AWS Only a fraction of companies believe they've reached total supply chain visibility. However, visibility improvements are easier to achieve than you may think. /solutions/supply-chain/5-questions-youre-probably-asking-ebook eBook Improving supply chain performance with the Law of Marginal Gains Supply chain businesses operate on fine margins. /solutions/supply-chain/improving-supply-chain-performance-ebook Webinar 27 June 2024 Insights into fleet software purchasing trends and criteria https://go.engage.here.com/here-insights-into-fleet-software-purchasing-trends-and-criteria-2024.html Webinar New technology trends and benchmarks for transportation and logistics 2024 https://go.engage.here.com/here-aws-onthemove-registration.html Webinar 24 May 2023 Accelerating supply chain transformation with cloud-based fleet planning https://go.engage.here.com/HERE-Partner-DirectBuy-SCB-AWS-CloudBasedFleet.html Webinar 12 April 2023 Building predictive supply chains through incremental gains https://go.engage.here.com/building-predictive-supply-chains-through-incremental-gains.html Webinar 10 May 2022 Data-driven predictive supply chains https://go.engage.here.com/WBN-20220510-3718-TL-SC-AWS_On-Demand-LP.html Webinar 27 Sept 2022 The future of supply chains: 2023 trends to know https://go.engage.here.com/the-future-of-supply-chains-2023-trends-to-know.html Webinar 1 Dec 2022 The ultimate way to build 