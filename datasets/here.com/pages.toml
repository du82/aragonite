title = "HERE CEO weighs in on live mapping, SDVs and AI | HERE"
description = "Discover HERE Technologies' CEO Mike Nefkens' vision for accessible mapping and the future of mobility in an exclusive interview with Automotive World."
full_description = '''HERE360 news HERE CEO weighs in on live mapping, SDVs and AI Connected Driving 2 min read 12 February 2025 HERE CEO weighs in on live mapping, SDVs and AI Advancements in-car mapping are poised to reshape the driving experience, with HERE leading the way. In a recent article on Automotive World, Mike Nefkens, CEO of HERE Technologies, outlined the company’s vision to make cutting-edge mapping technology accessible to all vehicles, not just premium models. This shift aims to bring smarter, more reliable navigation to everyday drivers, making advanced tools a standard feature rather than a luxury.“Our vision is to have an integrated map in every moving vehicle, even the most affordable,” he told Automotive World. “That marks a big change.”Mapping is no longer just about navigation—it’s becoming a key safety feature in the era of software-defined vehicles (SDVs). Modern maps are now playing a vital role in improving advanced driver assistance systems (ADAS) and automated driving. Artificial intelligence (AI) is driving this shift, turning static maps into dynamic tools that can be updated in near-real-time.One of the biggest challenges in creating live maps is keeping them up to date. Traditional maps often fall out of sync by the time cars hit the road. To tackle this, HERE is using AI technology, supported by AWS, to automatically detect and fix map errors. A live map demo showcased at CES 2025, in partnership with BMW, has proven the system’s potential.Nefkens sees 2025 as a turning point for the automotive industry, with carmakers making significant progress toward fully software-defined vehicles. While Chinese automakers have been quick to adopt streamlined systems, European manufacturers are now following suit, with HERE’s solutions playing a key role.Read the full article on Automotive World. HERE Technologies Share article: HERE Technologies HERE Map Data Get started for free Have your say /** * RECOMMENDED CONFIGURATION VARIABLES: EDIT AN