ious positions. Download full biography (65.96 KB) Robert Siegel Board Member Robert Siegel is a Lecturer in Management at the Stanford Graduate School of Business. He has led primary research and written cases on, among others, Google, Charles Schwab, Daimler, Stripe, Roblox, Target, C3.ai, Softbank, Tableau, PayPal, Medium, Autodesk, Zuora, and Michelin. Download full biography (109.35 KB) Sanjay Brahmawar Board Member Sanjay Brahmawar is a distinguished technology executive, who heads Software AG as CEO. With over two decades of international experience, he has extensive software and Internet of Things expertise and leads the organization with a strong entrepreneurial approach. Download full biography (72.66 KB) Takahiro Fukai Board Member Takahiro Fukai is General Manager of Industry Value Chain DX Department at Mitsubishi Corporation (MC). In this role, he spearheads the development and deployment of innovative digital services. Download full biography (108.1 KB) Yasutaka Tadakoshi Board Member Mr. Yasutaka Tadakoshi is the Vice President of the Industrial Infrastructure Group, Alliance Department, and R&D Market Strategy Division at Nippon Telegraph and Telephone Corporation (NTT). Download now (68.24 KB) Industry Advisory Board Ricky Hudi Founder & CEO, FMT/HERE Industry Advisory Board Chairman Ricky Hudi is a mobility technology pioneer with great passion for innovation and 30 years of experience in the automotive and related tech industry. After holding various roles at BMW AG and AUDI AG he took over in January 2009 as Executive Vice President Development Electrics/Electronics AUDI AG. Download full biography (44.85 KB) Patrick Cheng CEO, NavInfo As one of the founders of NavInfo, Patrick Cheng has experience in technology, marketing, sales and management through taking responsibility of various departments over the last 13 years. Download full biography (44.54 KB) Thomas Lantzsch Independent Thomas Lantzsch is former SVP and General Manager of the Interne