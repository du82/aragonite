title = "HEREの役員紹介 | CEO・経営陣｜HERE"
description = "HERE の経営陣をご紹介。位置情報テクノロジー分野において最先端のサービスを提供し続けるHERE のこれからのビジョンをこちらからご確認ください。"
full_description = "HERE Technologies グローバルのリーダーシップチームのご紹介 HERE経営陣紹介 HERE経営陣紹介 HEREスーパーバイザリー・ボード インダストリー・アドバイザリーボード HERE経営陣紹介 マイク・ネフケンス 最高経営責任者 テクノロジー、IT、ソフトウェア、クラウドサービス、IoT、オートモーティブの分野で数十年の経験とリーダーシップを発揮。2024年1月から、HEREのビジネス、戦略的方向性、人材、顧客エコシステムをリードします。 デニス・ドイル : 最高データ責任者 デニス・ドイルは、全社の複数の機能において、データソーシング、プライバシー、コンテンツ、ビジネスモデルなどを含む戦略＆データを統括しています。 アディール・マンズール 最高財務責任者 アディールは、2022年5月にHEREに入社し、大小さまざまなテクノロジー企業で財務の上級管理職を務めた豊富な経験を活かしています。CFOとして、同社の財務、会計、リスク管理、財務、IRの統括責任を担っています。 ワーナー・ブスケルモレン 上席副社長 兼 最高人事責任者 ヴェルナー・ブスケルモレンは、人事部門を率いています。20年以上の人事経験を生かし、人材や組織に関するシニアアドバイザーとして、グローバルで最高水準の職場という会社のビジョンと一致するように努めています。 ダマンディープ・コーチャル プラットフォーム・ファウンデーション担当上級副社長 ダマンディープ・コーチャルは、プラットフォーム・ファウンデーション担当上級副社長です。地図コンテンツの作成等を高度に自動化したマッピングシステムの開発・運用など、エンジニアリングを主導している。 デビッド・ケンザー 法務・コンプライアンス担当 デビッド・ケンザーは、HERE Technologiesの法務・コンプライアンス最高責任者であり、同社のすべての法務・規制関連事項を統括しています。 ジェイソン・ジェイムソン 最高顧客責任者 2021年6月に入社し、2023年11月に現職に就任。ビジネス・ソフトウェアおよびクラウド・ソリューションの分野で25年以上の経験を持ち、販売管理およびカスタマー・サクセスの推進に精通している。 HEREスーパーバイザリー・ボード ペッカ・アラ・ピエッティラ 取締役会長 ペッカ・アラ・ピエッティラ氏は、2021年2月よりHERE監査役会会長を務めています。Ala-Pietilä氏は、パッケージング企業Huhtamäkiとラーニング企業Sanomaの取締役会会長も兼任しています。 ライナー・フォイラー ボードメンバー BMWグループの企業投資担当上級副社長、ライナー・フォイラー博士。1998年にBMWグループに入社して以来、様々な戦略立案ポジションを経験し、中国におけるBMWグループの戦略的立ち上げに深く関与してきた。 アクセル・デュヴィッツ ボードメンバー アクセル・デュヴィッツ氏は、自動車業界において幅広い経験を持ち、現在はAudiグループのEVP兼税務・通関・M&A部門長を務めています。 アディーヌ・グラート ボードメンバー アディーヌ・グラート氏は、欧州の投資業界では著名で評価の高いプロフェッショナルです。インベスターAB社に13年間在籍し、EVPおよび執行役員を務めました。 アレクサンダー・ネディガー ボードメンバー ネディガー氏は、Mercedes-Benz Group AGのVP Corporate Developmentであり、M&A、Cooperation Management、及びReal Estateのグローバルな責任を担って、様々な役職を務めている。 ロバート・シーゲル ボードメンバー ロバート・シーゲル氏はスタンフォード大学経営大学院の講師で、様々な企業（Google、Box、Stripe、AngelList、23andMe、Lending Club、PayPal、など）の一次資料調査と事例の文章化をけん引しています。 サンジェイ・ブラーマワー ボードメンバー サンジェイ・ブラーマワーは、ソフトウェアAGのCEOを務める著名な技術系エグゼクティブです。 20年以上の国際的な経験を持ち、ソフトウェアとIoTに関する幅広い専門知識を持ち、強力な起業家的アプローチで組織を率いています。 深井 高広 ボードメンバー 三菱商事株式会社 産業DX部門 インダストリーDX部ゼネラルマネージャ。革新的なデジタルサービスの開発・展開の陣頭指揮を執っています。 インダストリー・アドバイザリーボード リッキー・フーディ FMT社創業者 兼 CEO HEREインダストリー・アドバイザリーボード ボード・チェアマン リッキー・フーディ氏は、自動車および関連技術産業で長年の経験を持ち、イノベーションに多大な貢献をしたモビリティ・テクノロジーのパイオニアです。2009年1月にAUDI AGの開発エレクトロニクス担当上級副社長に就任しました。 パトリック・チェン NavInfo最高経営責任者 パトリック・チェン氏は、NavInfoの創業者の一人として、この13年間、様々な部門の責任者を務め、テクノロジー、マーケティング、セールス、マネジメントの分野で経験を積んできました。 トーマス・ランツ インテルコーポレーション 上級副社長 兼 IoTグループゼネラルマネージャー ランツ氏 は、インテル コーポレーションの SVP 兼IoTグループのジェネラル・マネージャーです。IoT 市場セグメントにわたるインテル® アーキテクチャ・コンピューティング・ソリューションのワールドワイドな組織を率いています。 クラウディアス・ライフリッツ Allianz、Global Automotive取締役会メンバー 兼 最高経営責任者 クラウディアス・ライフリッツ博士は、ADAC保険グループの会長であり、2000万人以上の会員を持つ欧州最大のモビリティクラブであるADACのアシスタント活動も統括しています。また、戦略や事業開発も統括している。 イムラン・サイード NTTデータイノベーションおよびデジタルトランスフォーメーションアドバイザー サイード氏は、MITスローンマネジメントスクールの起業およびイノベーション学部に勤務しています。新しいビジネスモデルなど、大企業のグローバルイノベーションについて教鞭を執っています。 チャム・ゾン テンセント・ホールディングス副社長 兼 地図担当ゼネラルマネージャー ゾン氏は、テンセントMIGで、ブラウザ製品、地図プラットフォーム製品、スマートプラットフォーム製品の3部門を率いています。2009年初めにはブラウザプロジェクトを立ち上げ、携帯電話QQブラウザの基盤を生み出しました。 ステファン・デュラック BMW購買およびサプライヤーネットワークデジタル担当上級副社長 ステファン・デュラック氏は、カールスルーエ工科大学の電気工学課程を卒業後、1998年3月にBMWグループに入社しました。 トーマス・クロップフ ロバート・ボッシュGmbH 社長、コーポレート・セクター・リサーチ＆アドバンス・エンジニアリング担当 クロップフ教授は、2018年7月よりロバート・ボッシュGmbHのResearch and Advance engineeringのプレジデントを務めています。カールスルーエ工科大学でのアカデミックキャリアを継続し、1999年にボッシュに入社しました。 ジョルジュ・マッシング メルセデスベンツ株式会社 執行役員 MB.OS 自動運転、パワーネット＆E/E インテグレーション担当 マッシング氏は、メルセデス・ベンツ AGのMB.OS自動運転、パワーネット＆E/E統合担当バイスプレジデントです。これまでデジタルビークル＆モビリティ担当 バイスプレジデントとして従事しています。 リクレフ・シュミット・クラウゼン博士 上級副社長、CARIAD SE（フォルクスワーゲン・グループ）ドメイン・インテリジェント・コックピット＆ボディ担当 リクレフ・シュミット・クラウゼン博士は、CARIAD SE フォルクスワーゲン・グループ)の上級副社長で、ドメイン・インテリジェント・コックピット＆ボディを担当しています お役立ちリンク HEREについて 当社の業界、数々の受賞歴のあるソリューション、そして企業がHEREに期待する理由について、詳しくご紹介します。 パートナー グローバルネットワークのパートナーとして、どのようなリソースやサポートを提供しているか、詳しくはこちらをご覧ください。 はじめに 当社の業界、数々の受賞歴のあるソリューション、そして企業がHEREに期待する理由について、詳しくご紹介します。 お問い合わせ"
