["https://here.com/learn/blog/electric-vehicle-adoption-2024"]
title = "EV ambitions: what electric vehicle adoption looks like now | HERE"
description = "The rise and fall of EVs happened over a century ago. Will history repeat itself or are EVs here to stay this time?"
full_description = '''HERE360 news EV ambitions: what electric vehicle adoption looks like now Connected Driving 5 min read 15 March 2024 EV ambitions: what electric vehicle adoption looks like now Ambitious targets for EV adoption worldwide are making the future of transportation look promisingly electric, but will it last? Over the past two decades, we've witnessed a significant shift in the automotive landscape with the emergence and growth of electric vehicles (EVs). By 2030, one in seven vehicles on the road is expected to be an EV, and later-adopting countries are experiencing rapid growth in EV sales. But what we consider the dawn of EVs might not be entirely accurate. Because the rise of electric vehicles is not a recent phenomenon - it’s a comeback story.Which begs the question: why is global EV adoption gaining momentum only now? Read more — EV does it: can the U.S. meet charging infrastructure targets? Paving the wayWilliam Morrison, an American chemist and inventor, created the first successful EV in the late 19th century. And yet, despite their early introduction, EVs did not initially gain traction. This was mostly due to challenges such as limited range, slow speeds and high production costs. Cue the discovery of internal combustion engine (ICE) cars around 1860, and EVs became nothing more than a brief story of potential that didn’t survive the test drive.The modern narrative around electric vehicles is very different. EVs are now witnessing increased adoption rates worldwide, with the global market expanding and regions like China, Europe and the US taking charge.Today, electric vehicles are much more sophisticated than their ancestors, leveraging technology in every part. Advancements in battery technology, increased environmental consciousness and supportive government policies are a big factor in the sudden rise in EV adoption.For instance, lithium-air batteries represent an innovative EV-powering technology that can potentially offer a higher energy density than their more conventional lithium-ion counterparts, extending the mileage EVs can run on a single charge. But the biggest benefit it could introduce is mitigating one of the biggest hurdles in broad EV adoption - range anxiety.But apart from extending their range, lithium-air batteries are also supporting the road to more sustainable EV batteries through recycling, which makes these cars an even more attractive mobility solution for consumers. Read more — EV does it: how we can overcome range anxiety Running on fumesDespite the optimistic outlook, there are still significant barriers, namely range anxiety, that are slowing down the adoption of EVs. Affected by many factors, such as extreme heat and cold, it represents one of the biggest obstacles to widespread EV adoption.Challenges pile on. Even if it reaches the charging station in time, your EV might get there only to find more blockers. Availability and accessibility of charging stations, inadequate chargers or complicated payment systems are all factors that made charging anxiety another term that worries the electric car industry. And for a good reason. In the US alone, the lack of charging infrastructure accounts for one of the biggest barriers to EV adoption.Help is on the way. To tackle EV charging anxiety, the European Union is currently working on increasing the number of public charging points to meet the growing demand. Other substantial investments across the globe also aim to expand the EV charging infrastructure. Read more — EV does it: how AI will transform charging infrastructure Greening the commuteAnother benefit of cars that run on electricity is the reduced impact on the environment. Companies are turning to EVs for their fleets due to potential lower operating costs and a desire to meet sustainability targets. Fleets of electric buses and taxis are also being introduced in cities around the world, reducing emissions and improving air quality.The pursuit of more sustainable mobility solutions goes beyond passenger cars. Electric trucks are becoming increasingly popular in the USA, with several manufacturers announcing plans to produce electric versions of their popular models.Working smarterArtificial intelligence (AI) is another important driver of accelerated EV adoption, optimizing charging station locations, managing energy distribution and improving battery performance. AI can even reduce range anxiety by giving drivers real-time information on their vehicle's battery status and the nearest charging stations. And if that’s not enough, it can also help manage the load on the grid, preventing power outages due to high demand from EV charging. No turning backThe long journey of EVs from a niche aspiration in the late 19th century to one of the most exciting things that came out of the automotive industry is an inspiring one. Despite the challenges, the future of EVs looks promising, with continuous technological advancements, policy support and growing consumer awareness. EV adoption will only continue to rise, making the future of mobility a shade greener at every step. Maja Stefanovic Senior Writer Share article: Maja Stefanovic Senior Writer Steer the future of connected driving Learn more Have your say /** * RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS. * LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables */ /* var disqus_config = function () { this.page.url = PAGE_URL; // Replace PAGE_URL with your page's canonical URL variable this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable }; */ var disqus_config = function () { this.language = "en"; }; (function() { // DON'T EDIT BELOW THIS LINE var d = document, s = d.createElement('script'); s.src = 'https://here-3.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a> Related articles Connected Driving The triple disruption transforming cars: electric, connected and shared Louis Boroditsky 26 Feb 25 Connected Driving HERE CEO weighs in on live mapping, SDVs and AI HERE Technologies 12 Feb 25 Connected Driving Debate worth having: when does in-car entertainment cross the line? Rosie Gizauskas 31 Jan 25 Sign up for our newsletter Why sign up: Latest offers and discounts Tailored content delivered weekly Exclusive events One click to unsubscribe'''
