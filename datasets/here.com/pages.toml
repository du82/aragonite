description = "Enable dynamic route optimization, improve vehicle location insights, and develop advanced fleet solutions."
full_description = "Customer stories BMW 7 Series enables hands-free driving with HERE HD Live Map Discover how HERE HD Live Map provides highly precise data to help BMW achieve Level 2+ of automation. Contact us Challenge Overcoming mapping challenges in autonomous vehicle development As part of the challenge of advancing from automation Level 2 to Level 3, BMW needed the latest, accurate and up-to-date mapping data to further develop their self-driving vehicles. BMW needed access to reliable mapping data that could provide centimeter-level precision in real-time. Solution Enhancing the BMW autonomous driving technology With the HERE HD Live Map, the Highway Assistant function enables hands-free driving on interstates and highways, as long as drivers remain focused and ready to take over. The HERE platform also allows the vehicle's navigation system to display in real-time where the SAE Level 2+ function can be activated safely. As automated driving capabilities increase across vehicles, roadways and regions, the HERE HD Live Map will be integrated into additional BMW models. Impact Better efficiency, accuracy and freshness Industry milestone The first BMW series production vehicle with SAE Level 2+ automated functionalities and a maximum speed of 80 mph (130 km/h) brought BMW one step closer to bringing a highly automated solution to the market. Safer and more efficient driving BMW uses HERE Predictive Routing and Real-Time Traffic services in 70 countries to help drivers stay safe and save time with up-to-the-minute information on road conditions and incidents. More trust in automation Access to advanced mapping solutions enables BMW to not only react to situations on the road but also predict road events thanks to the shared safety load between a continuously refreshed map and vehicle sensors as a backup. .st0{fill:#FFFFFF;} A digital HD map is essential for highly automated driving. HERE HD Live Map is rich and reliable: it provides road geometry, route profile and traffic signs – all on a global scale. Dr. Nicolai Martin Senior Vice President Development Automated Driving, BMW Group BMW customer story Download to read the press release Download press release More about products & services Automated Driving Build assisted and automated driving systems that are more reliable, safe and comfortable across all levels of automation. HERE HD Live Map Build a safer autonomous driving system with our precise HD map data. More customer stories See all Mercedes-Benz deploys HERE HD Live Map for DRIVE PILOT system HERE Technologies, the leading location data and technology platform, today announced that its HD Live Map is an integral part of the new DRIVE PILOT from Mercedes-Benz. Learn more Giving drivers early warnings of danger around the corner Together with Ford, HERE delivered a warning system to create awareness for upcoming road hazards.This is a significant step forward. Warnings are specific, relevant and tailored to try to help improve your specific journey.Joerg BeyerExecutive Director, Engineering, Ford of Europe Learn more The next level of mobility NIRA Dynamics utilizes the growing HERE ecosystem to reach out to a larger audience.We can make use of the vast network of customers that HERE has from the beginning.Johan BrynasCPO, NIRA Dynamics Get in touch Let's talk about how our spatial intelligence solutions can support your automated driving solutions. Contact us"
