full_description = "About HERE Technologies We make a unified live map designed for every moving vehicle Play video 40+ years of experience in map-making and location technology 220m+ vehicles shipped with HERE maps data & solutions on board 6,400+ employees across 52 countries Our path Who we areHERE is the world’s leading mapping company. Forty years ago, we started with a digital map of San Francisco. Today, we set the standard for automotive-grade maps globally and partner to define the future of the software-defined vehicle. Our customers are leading automakers, logistics firms, mobility providers and technology brands. What we doWe deliver the world’s best unified map to our customers. A map with more precision, more flexibility and more control. A map that is powering the next generation of vehicle automation and safety, enabling innovation and efficiency, and driving sustainable growth across industries. Why we do itA great map doesn’t just mark a destination; it reveals the promise of a faster, safer and more efficient journey. Smarter routes unfold. Goods reach the right hands. Precious minutes are saved. Because a better map can make a better world. Read more Our purpose principles Rise to the challenge Welcoming debate, testing assumptions and exchanging ideas is how we achieve our best thinking and arrive at the brightest answers. Channel curiosity United by a deep desire to understand the world, we travel, seek and discover, staying open to new perspectives. Chart new frontiers We have the vision to see what doesn’t yet exist, the courage to do what's never been done and the grit to get there. Advance by listening Always learning while listening, we build close relationships and broaden our knowledge to help our people and customers go further. Earn trust at every turn We focus on details and protect our customers' information like our own, with a passion for precision and empathy in every action. Get in touch Learn how location technology can help sol