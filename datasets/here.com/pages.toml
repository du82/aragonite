title = "高精度 GNSS 位置情報サービス | 全球測位衛星システム | HERE"
description = "最先端の測位性能を持つ HERE の HD GNSS で、正確な車両位置管理や、位置情報を利用するアプリの精度改善を図りましょう。詳細はこちら。"
full_description = "HERE HD GNSS Positioning HD GNSS 測位 ユーザーに高精度な位置情報を提供する、クラウドベースのリアルタイムポジショニングシステム お問い合わせ 高精度なHERE HD GNSSで位置情報の測位を次のレベルへ 次世代のモバイルサービスにとって高精度な位置情報は必要不可欠です。しかし、これまではセンチメートル単位の測位を実現することは困難でした。 GPSは1970年代に登場して以来、人々の生活に大きな影響をもらたしてきました。しかしながら、車両位置情報管理などに利用されるGPSデバイスは、最高の条件下でも、3～10メートルの誤差が生じます。日常で使用する様々なデバイスの位置情報精度を数メートル、数センチメートルまで縮めることができれば、新たなビジネスチャンスの創出と、ユーザー体験の向上を図ることが可能です。 HERE HD GNSS Positioningは、ハードウェアを追加することなく、マスマーケット向けデバイスの測位性能を、 一般の衛星システムの測位性能と比較して、3〜4倍まで向上させることができます。 これは例えば、公園でジョギングする際により正確な現在地を把握したり、車線レベルの的確なナビゲーションにより、ドライバーを正しい高速道路の出口に案内することを可能にします。また他にも、ドローンをより正確に追跡したり、車両管理者が車両の追跡や位置情報管理を改善し、車両がたどったルートを正確に再現して走行後の分析に役立てることも可能です。 最先端のGNSSシステムで、センチメートル単位の高精度な位置測位を世界規模で実現 HEREの高精度なGNSSサービスで位置情報に圧倒的な正確性を HERE HD GNSSを利用すると、オープンスカイの受信環境下で、GNSS受信機を搭載したモバイルデバイス、IoTガジェット、その他アセットの位置をセンチメートル単位の精度で特定および追跡が可能です。 また、車の追跡にも最適です。 関連製品： ·高精度な地図データにアクセス可能：HERE Map Rendering 一貫した速さ HD GNSS搭載のモバイルアプリで、通信速度の遅延を低減し、ユーザーエクスペリエンスを向上させます。HERE HD GNSS Positioningで、複雑な位置情報を算出する所要時間を削減します。 グローバルなサービス アンカレッジから漳州まで、世界を網羅する位置情報ポジショニングシステムで、グローバルポジショニングの未来を切り開きます。GNSS信号受信およびインターネット接続環境さえあれば、HERE HD GNSSをすぐにご利用いただけます。 関連製品 最新の位置情報をもとに、世界規模で配送ルートを最適化：HERE Routing HERE HD GNSS Positioningはどのように提供されますか？ 弊社のGNSSサービスを利用することで、エンドユーザーは安全な (TLS) 接続を介して、HEREプラットフォームからストリーミングされるGNSS補正データを受信します。 エンドユーザーのデバイスにはポジショニングエンジン (PE) と呼ばれるソフトウェアが必要です。PEをすでに所有される場合は、APIでコレクションストリームのみをご提供いたします。PEのない場合は、パフォーマンスと信頼性の高い、高品質なHD GNSSリファレンスクライアントソフトウェアをご提供いたします。 開発者のメリット 機能性の向上 GNSSサービスは正確な測位技術で、バーチャルリアリティゲームやスポーツトラッカーといったアプリの性能を向上させます。 無駄な投資コストの削減 弊社のHD GNSSは既存のハードウェアやGNSSアンテナを内蔵する携帯電話を使用することでコストを削減します。 シンプルな統合 HERE HD GNSS Positioningは複数のサプライヤーを管理する煩雑さを軽減します。また、既存の車両位置情報デバイスとの互換性も担保しています。 HEREとソニーセミコンダクタソリューションズが高精度ポジショニングを実現 ソニーセミコンダクタソリューションズとの提携により、HERE HD GNSSポジショニングを同社のデュアルバンドLSIチップセットに統合しました。低消費電力を維持しながら1メートル以下の精度を提供するHERE HDポジショニングは、通常のGNSSの精度を3〜4倍向上させ、量販用デバイスでグローバルに利用可能です。 ケーススタディをダウンロード よくある質問 GNSSとGPSは何の略語ですか？ GNSSとGPSはいずれも、人工衛星により地上の位置情報を定める衛星測位システムです。GNSSはGlobal Navigation Satellite Systemの略語で、世界規模で自動的に地理空間の位置測位を実現する衛星ナビゲーションシステムを指す広義語です。GPSはGlobal Positioning Systemの略語で、アメリカ政府が所有するGNSSの一種を指す言葉です。 GNSSとGPSは日本語での正式名称は何と呼ばれますか？ GPSの日本語の正式名称は「全地球測位システム」です。また、GNSSの公式名称は「全球測位衛星システム」です。GNSSおよびGPSの略称表記は日本語でも英語でも同じです。 GNSS位置情報とは何ですか？ GNSSとは測位衛星を利用した全世界測位システムの総称です。 宇宙空間にはアメリカのGPSを始めロシアのGLONASS、EUのGalileo、日本のみちびきなど全世界測位システムを支えている測位衛星と呼ばれる人工衛星が数多く巡回しています。その中から最低4機の衛星との距離を求めることで、地球上の正確な一点（緯度・経度）が算出できます。こうして得た緯度や経度のことを位置情報と呼び、身近な例ではカーナビゲーション、ビジネスシーンでは動態管理といったさまざまなサービスに利用されています。 HEREはユーザーに高精度な位置情報を提供する、クラウドベースのリアルタイムポジショニングシステムを展開しています。 高精度位置測位と通常のGNSSの違いは何ですか？ GPSの名称で知られているGNSSは測位衛星を利用した全世界測位システムの総称です。 宇宙空間を巡回する測位衛星と地球上の観測点からの距離を計測することで緯度・経度を求めるGNSSですが、通常の利用方法では3から10メートルの誤差が生じます。こうした誤差を数センチメートルまで縮めたのが高精度位置測位です。GNSSから得た位置情報の精度が数センチメートルであれば、建物の出入り口なども正確に把握でき新たなビジネスチャンスにつながります。近年ではこの精度を利用し農機の自動運転などが実用化されています。 HEREのリアルタイムポジショニングシステムはハードウェアを追加することなく高精度位置測位を実現しています。 GNSSの活用例をいくつか教えてください。 自動車、ボート、船、建設機械、宇宙船などには、ナビゲーションの補助をするため、GNSSが搭載されている可能性があります。GNSSは、携帯電話、トラッカーデバイス、ウェアラブルなど、日常生活で使用される一般消費者向けデバイスを含め、様々な業界の専門的なデバイスにおいても幅広く採用されています。また、測量や地図作成といった業界でも データ送信に活用されています。 GNSS位置情報とは何ですか？ GNSSとは測位衛星を利用した全世界測位システムの総称です。 宇宙空間にはアメリカのGPSを始めロシアのGLONASS、EUのGalileo、日本のみちびきなど全世界測位システムを支えている測位衛星と呼ばれる人工衛星が数多く巡回しています。その中から最低4機の衛星との距離を求めることで、地球上の正確な一点（緯度・経度）が算出できます。こうして得た緯度や経度のことを位置情報と呼び、身近な例ではカーナビゲーション、ビジネスシーンでは動態管理といったさまざまなサービスに利用されています。 HEREはユーザーに高精度な位置情報を提供する、クラウドベースのリアルタイムポジショニングシステムを展開しています。 GNSSサービスには何がありますか？ GNSSは地球上の正確な位置情報を計測するシステムの総称であり、一般的にはGPSの名称で知られています。 GNSSから得た位置情報を使ったGNSSサービスにはさまざまなものがあり、カーナビゲーションはもっとも身近なサービスの一つです。ほかにも法人が所有する車両の管理（動態管理）や効率的な営業や配送のルート計画、物流現場での荷物のトラッキングなどにも活用されています。 近年では市街地での正確な位置情報を取得できるようになり、自動車の自動運転につながる高精度地図の提供などにも利用されるようになりました。 HEREのポジショニングシステムはさまざまなシステムと連携することで、ニーズに合った柔軟なサービスの構築をサポートします。 ご相談ください HERE HD GNSS Positioningをお客様のシステムに統合するサポートをします。 お問い合わせ"
