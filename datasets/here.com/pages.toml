["https://here.com/learn/blog/ev-index-2024-sbd-automotive-europe"]
title = "Europe’s EV adoption: some countries speed ahead, others stuck in the slow lane | HERE"
description = "Europe is charging ahead with a striking 115% boost in public electric vehicle (EV) charging capacity, outpacing the USA's 82% growth. Impressively, 24 European countries have…"
full_description = '''HERE360 news Europe’s EV adoption: some countries speed ahead, others stuck in the slow lane Connected Driving 6 min read 09 September 2024 Europe’s EV adoption: some countries speed ahead, others stuck in the slow lane While 24 European countries have reached an sufficient balance between electric vehicles on the road and public charging stations, our second annual HERE-SBD EV Index highlights ongoing contrasting trends across the continent. Europe is charging ahead with a striking 115% boost in public electric vehicle (EV) charging capacity, outpacing the USA's 82% growth. Impressively, 24 European countries have achieved a sufficient EV-to-public charger ratio, compared to just 4 US states.Despite Europe setting a strong example in the EV transition, challenges persist. Robert Fisher, a Principal at SBD Automotive — a global team focused on advancing the automotive industry — sat down with HERE360 to discuss this year’s insights. &nbsp;Denmark hits the markRanked sixth in 2023’s HERE-SBD EV Index, the Kingdom of Denmark has claimed this year’s crown. Just five years ago, Denmark was hesitant to embrace electrification, but its recent leap to the top signals a serious commitment by both the Danish government and its citizens to decarbonize their industries. “Denmark now has an incentive program that will save car buyers between €10,000 and €20,000 on their EV purchase,” said Fisher. The small Scandinavian nation also offers electricity rebates for charging EVs. As a result, Denmark achieved a notable 21% market share in 2023, although the fleet share remains at 5%. “In the last two years, their charging network has really accelerated. If you live in Copenhagen, you’ve got access to chargers everywhere in the city. And because it is a small country, even the more rural areas have charge points every 5km along the road network.”&nbsp;Norway vs the worldNorway, a longstanding leader in the EV revolution, has slipped from 1st to 2nd place in the HERE-SBD EV Index due to a slight decrease in public charger numbers. Nonetheless, Norway continues to set the standard globally for EV adoption, with almost half its vehicle fleet now electrified."Almost every new car sold in Norway is now electric," said Fisher. "They have accomplished this by initially offering incentives to encourage EV purchases, but now the approach has shifted predominantly to imposing taxes on those who opt for non-electric vehicles.“Essentially, the Norwegian government is saying that internal combustion engines (ICEs) are not an option anymore.”&nbsp;A bumpy autobahnWith nearly 1.5 million electric vehicles, Germany leads Europe in terms of EVs on the road. However, only 2.76% of total vehicles are electric, showing there's still a long way to go for a fully electric future.Recently, the German government stopped offering incentives for buying EVs, thinking the market could stand on its own and facing budget limitations. This move has slowed the growth of EV adoption and slightly reduced the percentage of electric vehicles in the fleet. Despite this, the number of charging stations per vehicle has increased a bit, thanks to continued investment in infrastructure, even as EV sales have cooled off.“With strong government and industry support, Germany’s charging network expansion has been impressive, with more than 8 terawatts of charging power available, making it the largest and most powerful national network charging in Europe,” said Fisher. “However, the country’s slowdown in EV adoption threatens the bottom line of the charge point operators, making for a difficult business climate in the near future.”&nbsp;Room for improvementAs the world increasingly embraces electric vehicles, some countries are seeing their scores drop, including Hungary, Czechia, Portugal, Spain, Croatia and the Netherlands.Ireland stands out as a particularly surprising case, falling behind in several critical areas.“Ireland is one region that is really off-target,” said Fisher. “Despite a relatively high number of EVs in their fleet, the chargers are very low-powered on average and there aren’t nearly enough of them on their roads.“This could be because the government isn’t supporting electrification through charging infrastructure, or because the business environment doesn’t exist for it. For Ireland to align their rating with countries with similar GDP like Norway and Switzerland, they need to double their current charging network.”&nbsp;Charged upThe latest HERE-SBD EV Index offers a clear snapshot of the electric vehicle scene in Europe, showing both impressive progress and some gaps between countries.Denmark's rise to the top spot highlights how strong incentives and solid infrastructure can quickly boost EV adoption, setting an example for others to follow. Even though Norway dropped to second place, it still leads in EV market share, proving that consistent government support is key to electrification. Read more — Entering the electric era: the state of EVs in America Germany, on the other hand, is at a crossroads, with its rapid infrastructure growth now facing challenges due to changing policies that have slowed down EV adoption. Ireland's situation points to the urgent need for better charging networks to keep up with its growing number of EVs.As Europe moves toward a greener era, expanding and improving charging infrastructure will be crucial. By learning from leaders like Denmark and adjusting to new market conditions, European countries can create a more consistent and electrified transport system, helping the continent transition to a low-carbon future.The state of global EV charging and the role of AITo explore further insights from this year's HERE-SBD EV Index, join us on October 24th for a free 60-minute webinar with Robert Fisher from SBD Automotive and Andrei Iordache from HERE.Register now Louis Boroditsky Managing Editor, HERE360 Share article: Louis Boroditsky Managing Editor, HERE360 HERE-SBD EV Index 2024 Download report Have your say /** * RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS. * LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables */ /* var disqus_config = function () { this.page.url = PAGE_URL; // Replace PAGE_URL with your page's canonical URL variable this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable }; */ var disqus_config = function () { this.language = "en"; }; (function() { // DON'T EDIT BELOW THIS LINE var d = document, s = d.createElement('script'); s.src = 'https://here-3.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a> Related articles Connected Driving The triple disruption transforming cars: electric, connected and shared Louis Boroditsky 26 Feb 25 Connected Driving HERE CEO weighs in on live mapping, SDVs and AI HERE Technologies 12 Feb 25 Connected Driving Debate worth having: when does in-car entertainment cross the line? Rosie Gizauskas 31 Jan 25 Sign up for our newsletter Why sign up: Latest offers and discounts Tailored content delivered weekly Exclusive events One click to unsubscribe'''
