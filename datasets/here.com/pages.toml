full_description = "コネクテッドドライビング 高精度地図データと位置情報インテリジェンスで自動運転車の未来を加速させる お問い合わせ 高精度地図データで、自動運転、ADAS、コネクテッドカーの未来を切り開く 信頼できるパートナーとして自動車業界で高く評価されるHEREは、高精度地図データおよび位置情報を中心とするオープンプラットフォームで、自動運転車など、未来のモビリティーに向けた独自のビジョンを描くお手伝いをします。 注: このソリューションは、日本では利用できない場合があります。詳しくは、HERE Japanの担当者にお尋ねいただくか、お問い合わせフォームからご連絡ください。 ワンストップショップ 位置情報テクノロジーにより、ビジネスの拡張、市場投入時間の短縮、コストの削減、サービス効率の向上を実現します。 世界的なカバレッジ ユーザーの要望に応じたエンドツーエンドのアプリ内エクスペリエンスを提供し、 MaaS（Mobility as a Service）によるシームレスなモビリティサービスを実現します。 プロによるサポート お客様のニーズに基づいてサービスや製品を構築します。HEREのプラットフォームでHEREやサードパーティーのデータを活用し、データの価値を高めましょう。 HEREの高精度地図データ活用分野: インフォテイメントシステム、ADAS、高度自動運転、スマートモビリティ コネクテッドカーの車載インフォテイメントシステム（IVIシステム） HERE のコネクテッドカー サービスで、直感的なナビゲーション ソリューションを開発できます。ドライバーは情報を探索しやすくなり、ワンランク上のカスタマー エクスペリエンスを実現します。 関連製品 iPhone・Android対応の位置情報アプリ開発SDK: HERE SDK 先進運転支援システム (ADAS) ADAS の機能を豊富な地図データとサービスによって強化し、顧客との信頼を築き上げます。 関連製品 GNSS (全球測位衛星システム) によるリアルタイムの高精度位置情報：HERE HD GNSS 高精度地図データによる高度な自動運転 HERE のコネクテッドカーサービスと自動車グレードの高精度地図で、自動運転の時代を先取りします。 関連製品 最新の高精度地図データ：HERE Map Rendering スマートモビリティ 世界で最も包括的なHEREの位置情報プラットフォームで、次世代のモビリティーソリューションを構築し、高まり続ける都市交通のニーズを満たしましょう。 関連製品 人の移動やモノの配送ルートを最適化：HERE Routing MaaSに最適なHEREの最新地図データ よくある質問 コネクテッドカーとは？ コネクテッドカーとは、インターネット接続を持つ車両のことで、通常、ワイヤレスローカルエリアネットワーク (無線LAN) を介して、車内外の他の機器とインターネットアクセスやデータを共有します。コネクテッドカーの技術は自動運転 (安全運転支援) や車載インフォテインメントなど、さまざまな機能に利用されています。 自動車に装備されるADASとは何ですか？ ADAS (エーダス) は先進運転支援システム (Advanced Driver Assistance System) の略称で、自動車運転におけるヒューマンエラーの要素を取り除き、安全性を高めるために設計された技術的機能のことです。ADASはカメラ·センサー·レーダー技術を駆使して、車両周辺の状況を把握しドライバーに情報を提供あるいは自動でアクションを起こします。ADASの構成要素として、クルーズコントロールや衝突被害軽減ブレーキ、車線逸脱防止支援システムやカーナビゲーションなどが挙げられます。高度なADASを実現するために正確な位置情報は必要不可欠であり、HEREのテクノロジーは未来のADASの技術革新をサポートします。 ADAS地図とは何ですか？ ADAS（先進運転支援システム）とは、自動車に取り付けられたさまざまなセンサーから収集する情報を解析することで周囲の状況を把握する技術です。ドライバーへの安全に関する注意喚起やハンドル、ブレーキ操作といったドライバーの支援に役立ち自動運転にも通じます。 自動運転を実現するためには自動車の周辺の状況の把握だけでなく速度制限や事故、工事情報といった交通規制情報などの管理も必要です。そうした情報を管理するのがADAS地図です。 HEREの車載ソリューションは自動車の自動運転をあらゆるレベルでサポートします。 ADAS地図のメリットは何ですか？ 自動車に取り付けられた各種センサーの情報によって周囲の状況を把握するADAS（先進運転支援システム）は自動車の自動運転を意識した技術です。ドライバーへ安全に関する注意喚起を行ったり、ブレーキ操作などの運転支援に期待されています。 しかしながらADASで使用するセンサーの範囲を超えて危険を察知することはできず、例えば見通しの悪いカーブの先の状況など、より詳細なドライバーのサポートを行うためには道路の状態を管理する地図が別途必要であり、それがADAS地図です。 ADAS地図はHEREの車載ソリューションの一つであり、ドライバーの安全な運転に貢献しています。 自動運転向け地図とは何ですか？ 自動運転向け地図とは、自動車の自動運転に必要な情報を管理する地図データです。自動車の周囲の状況はADAS（先進運転支援システム）と呼ばれるセンシング技術によって取得されますが、安全な自動運転にはそれだけでは不十分です。 信頼性の高い自動運転の実現には信号機や規制標識など道路の周辺にあるドライバーの走行を制限する情報を始め、車線といった路面の情報、また刻々と変化する規制や渋滞の情報との連携が必要です。 HEREはADASとドライバーの安全性向上に向けた自動運転向け地図で自動運転の実現をサポートします。 自動運転に必要な高精度地図とは何ですか？ 自動車を運転するドライバーは走行中、信号機や道路標識といったさまざまな情報を目視して車線の状況を判断しています。安全な自動車の自動運転を実現するには、普段ドライバーが目にするそうした情報が管理できる高精度地図が必要です。 自動運転に必要な高精度地図では、信号機や道路標識、区画線といった道路の上もしくは道路の周辺に存在する情報に加え、車線の中心線や勾配、カーブの曲がり具合など車線上に実在しない情報も管理されています。 HEREは世界の道路ネットワークをデジタル表現する高精度地図により自動運転を支えドライバーや歩行者の安全に貢献します。 「HEREが再び1位に。Googleとの差を広げる。」- Omdia Location Platform Index、2020年6月 3年連続でOmdiaの位置情報プラットフォームインデックスでHEREが1位にランクインしている理由をご覧ください。 レポートをダウンロード お客様のビジネスのためにHEREができること プラットフォームのサービス内容： コネクテッドカー向け統合ソリューション 信頼できる地図コンテンツ 位置情報ベースビジネスの効率化を図るマーケットプレイス 弊社のサービス内容について詳しい情報をご希望の場合は、問い合わせフォームよりお客様サポートまでお気軽にご連絡ください。 *必須項目です。弊社のプライバシーポリシーに基づき、お客様の情報を利用させていただく場合があります。"
