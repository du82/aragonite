["https://here.com/learn/blog/in-car-entertainment"]
title = "Debate worth having: when does in-car entertainment cross the line? | HERE"
description = "Discover the quirky features transforming EVs—from karaoke machines to gaming consoles and lie-flat beds. Are they harmless fun or potential safety hazards? HERE360 explores the pros and cons with industry experts."
full_description = '''HERE360 news Debate worth having: when does in-car entertainment cross the line? Connected Driving 7 min read 31 January 2025 Debate worth having: when does in-car entertainment cross the line? Electric vehicles (EVs) are transforming into entertainment hubs on wheels, packed with software-driven innovations. While these features showcase clever advancements, they also raise concerns about potential safety risks. Our experts weigh in. When does an electric vehicle (EV) become more than just a way to get from point A to point B? When it transforms into a karaoke lounge, a gaming console or even a cozy lie-flat bed. These fun and unexpected features are powered by software-defined vehicles (SDVs)—cars that use advanced software to go beyond driving and make every ride feel personal.These features are shaking up what we expect from cars and sparking big conversations. But are they clever ways to make EVs more appealing and fun, or are they distractions that raise safety concerns? HERE360 speaks to industry insiders to examine the pros and cons. Read more: Yes, APAC drivers are embracing smarter, safer driving tech – here’s why First-class featuresIn China, the country with the highest demand for EVs, sales competition is understandably fierce. The Guardian reports China has 76% of the share of the global EV market, and as a result car companies really need to stand out. This has led to a raft of even more out-there features, from Xpeng’s lie-flat double bed in the G9 SUV to premium EV brand Zeekr’s built-in hotpot for making the traditional Chinese cuisine in its MIX minivan. Yes, you heard right. But these kinds of maverick mod-cons aren’t just on offer in China. Have you ever wanted to perform karaoke in your car (or channel your inner James Corden)? Now you can, as Ford announced the inclusion of the Stingray karaoke system in its electric F-150 Lightning and Mustang Mach-E in September 2024, available to customers in the US, UK, Canada, Mexico and wider Europe. The company said the feature will roll out to other vehicles during 2025. “It’s an awesome way to spend time with family and friends,” read a press release from Ford. “Customers can enjoy this feature while parked and driving,” the press release confirmed, although it’s important to note when the car is being driven karaoke can only be accessed when the driver and front seat passenger are buckled in. Audi has also rolled out the Stingray system in its electric SUV range, reports Techradar. It seems that entertainment systems are a big focus in EVs, with Volkswagen AG now partnering with AirConsole to kit a selection of its VW models such as the ID.7 Tourer out with in-car gaming equipment. This feature turns the infotainment system into a gaming system, controlled by smartphone. This function is only available when the car is charging or at a standstill. Meanwhile, Sony Honda Mobility’s AFEELA EV, due out in 2026, includes integrated PlayStations for rear-seat passengers. Read more: How software-defined vehicles adapt to you Driven to distractionJohn Ellmore is the Editor of Electric Car Guide, a UK-based consumer website dedicated to arming EV purchasers with research, information and guidance. “I don’t necessarily think that a feature like karaoke is a good idea,” John told HERE360. “Providing the driver isn't distracted and the feature is being used while charging or parked, it’s fine. But for a driver to have any kind of distraction in the car, it’s going to impact their concentration and safety.” Indeed, the Stingray karaoke system can be used while a vehicle is moving.John said that aside from the issue of safety, he doesn’t think that the average British consumer will warm to such features. “The safety aspect is just one element of concern to me. I also don’t know if the UK market is ready for this—or actually wants it. I think that most customers in the UK really want better range, and better charging infrastructure when it comes to EVs. I think they’ll see through these kinds of features as gimmicks.”In terms of in-car gaming, John said that may just be further a drain on “precious battery”. “If your passengers want to play games in the car, it’d be better for them to use their Nintendo Switch,” he added. “EVs should focus on the important things—getting people from A to B.” Read more — Entering the electric era: could EV efficiency double? Recharging your batteriesTom Bloor is the Managing Director of evec, a UK company that specializes in providing affordable EV charging solutions. His view is that while many of these features can be seen as publicity stunts, they’re actually important in ensuring that drivers take proper breaks when driving. “The addition of these features represents so much more than a gimmick. Historically, features like games, fireplace apps for your car and Netflix have been added to support the shift in thinking required for consumers to switch to EVs. “Filling your car with petrol takes less than five minutes, but topping up your EV at a public service station can take 15 minutes to an hour and a half, depending on the power offered. At a fundamental level, these features offer drivers a fun, quirky activity while they charge. It’s worth noting that most of these features can only be used while the car is parked. They encourage drivers to slow down and enjoy themselves. "And, let’s not forget drivers should be taking a break every two hours for 15 minutes or more. It could be argued that these 'gimmicks' are actually improving road safety by presenting a shift in the way we refuel.” Tom said that in the uphill climb to net zero, these kinds of features also play a part in marketing EVs to the next generation of potential purchasers. “Some of these add-ons are gimmicky, but they’re also conversation starters. They create brand advocates from a super early stage—already converting the next stage of EV aficionados. Like any tech feature in a car, drivers must practice road safety while using them, but, in my opinion, their positives far outweigh their negatives.” John has a suggestion for an additional feature that he thinks customers would truly enhance their EV. “In terms of bonus features, what would be more useful than the likes of karaoke machines or gaming systems would be extras such as solar-powered roof panels that work really well. Some manufacturers include those already, but they’re not particularly powerful, and in my opinion, it'd be better if manufacturers focused on making ones that work better. Now that would be a real benefit to drivers.” Rosie Gizauskas Contributor Share article: Rosie Gizauskas Contributor Steer the future of connected driving Learn more Have your say /** * RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS. * LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables */ /* var disqus_config = function () { this.page.url = PAGE_URL; // Replace PAGE_URL with your page's canonical URL variable this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable }; */ var disqus_config = function () { this.language = "en"; }; (function() { // DON'T EDIT BELOW THIS LINE var d = document, s = d.createElement('script'); s.src = 'https://here-3.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a> Related articles Connected Driving The triple disruption transforming cars: electric, connected and shared Louis Boroditsky 26 Feb 25 Connected Driving HERE CEO weighs in on live mapping, SDVs and AI HERE Technologies 12 Feb 25 Connected Driving Debate worth having: when does in-car entertainment cross the line? Rosie Gizauskas 31 Jan 25 Sign up for our newsletter Why sign up: Latest offers and discounts Tailored content delivered weekly Exclusive events One click to unsubscribe'''
