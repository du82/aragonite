title = "Meet our Leaders | CEO & Management Team | Leadership | HERE"
description = "Discover the depth and breadth of our experience in location technology and our vision for the future. Get to know the management team and the board members at the helm of HERE Technologies."
full_description = "HERE Technologies Meet our global leadership team Leadership Team Leadership Team HERE Supervisory Board Leadership Team Mike Nefkens Chief Executive Officer Mike Nefkens is the Chief Executive Officer of HERE Technologies. He brings decades of experience and leadership across technology, IT, software, cloud services, IOT, and automotive. HERE CEO as of January 2024, he is responsible for leading HERE’s business, strategic direction, people, and customer ecosystem ahead. Download biography (60.65 KB) Denise Doyle EVP, Chief Product Officer Denise’s two-plus decades at HERE have demonstrated her deep business, strategic and commercial acumen working in senior executive roles. As CPO, her responsibilities include product and technology strategy, data acquisition, licensing, corporate strategy and development, security and privacy, IT, and sustainability. Download biography (61.55 KB) Adeel Manzoor EVP, Chief Operating & Financial Officer Adeel oversees HERE's financial organization, quality assurance, governance, procurement, legal and compliance. He plays a pivotal role in executing HERE's strategic plans and commitment to operational excellence. Adeel joined HERE in 2022 as CFO, bringing decades of senior finance leadership experience. Download biography (179.15 KB) Werner Buskermolen EVP, Chief Human Resources Officer Werner Buskermolen leads the Human Resources team at HERE Technologies. With more than 20 years of HR experience to draw upon, he acts as a senior advisor on all people-related and organizational matters to ensure the talent agenda aligns with the company’s vision in a best-in-class global, inclusive workplace. Download biography (111.55 KB) Damandeep Kochhar EVP, Chief Platform & Technology Officer Damandeep Kochhar is EVP, Chief Platform & Technology Officer at HERE Technologies. In his role, he leads the company’s core engineering activities, including the development and operation of our highly automated mapping system for crea