["https://here.com/learn/blog/ev-efficiency"]
title = "Entering the electric era: could EV efficiency double? | HERE"
description = "How the evolution of electric vehicles paves the way for higher performance, sustainability and economic gains."
full_description = '''HERE360 news Entering the electric era: could EV efficiency double? Connected Driving 5 min read 05 September 2024 Entering the electric era: could EV efficiency double? Electric vehicles are outperforming initial predictions, promising new standards of sustainable transportation. But can the industry keep up? Electric vehicles (EVs) are experiencing an exciting opportunity for innovation.With the potential to double their efficiency and achieve a 200 miles-per-gallon equivalent soon, EVs could lead to significant savings and relieve pressure on our power grids.A recent report by EPRI suggests this might happen as soon as 2050. Read more — EV ambitions: the new tech relieving range anxiety Range against the machineSuperior functionality is one of the biggest advantages EVs have over traditional vehicles, thanks to how they use energy. And they keep getting better every year.If we look at the evolution of EVs, they've made remarkable progress since they first hit the roads. Starting with the Toyota Prius, which in the early 2000s achieved 48 miles per gallon, today's average EV consumption can offer as much as 106 miles per gallon.The range-per-gallon ratio has truly skyrocketed.This advancement is possible because, unlike combustion engines that lose power to heat, EVs effectively convert about 85% of their battery energy into driving the wheels.But the journey to high efficiency isn't just about fine-tuning existing technologies. It involves high-strength steel and carbon fibers that provide lighter and safer vehicles with uncompromised performance by optimizing their energy expenditure.Then there's battery density. Packing more energy into batteries without adding weight means EVs can cover more miles on a single charge.A good example of such a vehicle is the Mercedes EQXX concept car, which in March of this year covered more than 1,010 km (627 miles) from Riyadh in Saudi Arabia to Dubai in the UAE, with an energy consumption of just 7.4 kWh/100 km (8.4 mi/kWh). Read more — Sustainability first: the most exciting advancements in green cars Greener planet, thicker walletDoubling EV efficiency can also lead to substantial economic gains, with potential savings in electricity costs that, by 2050, could go as high as US$200 billion per year. Not to mention the significant reduction in the carbon footprint.But it will take a village. Achieving this level of performance requires a collaborative approach that brings together automakers, policymakers and consumers. More specifically, it will rely heavily on new technological developments, consumers' readiness to adapt and businesses' incentive to innovate.Government policies and regulations will also need to evolve, supported by consumers who choose these vehicles to help catalyze the transition.Networking is everythingNo talk about the future of electric vehicle (EV) optimization can go without addressing the importance of charging infrastructure.Providing a robust network of charging stations is crucial for maximizing the convenience and accessibility of EVs. Range anxiety or the fear of running out of power without a charging station nearby is still one of the biggest barriers to widespread EV adoption.Overcoming this fear requires a strategic increase in fast-charging stations, especially in urban and rural areas, that can reassure consumers and make EVs a more viable option for everyday travel. Read more: Why megawatt charging is a game changer for electric trucks Charging growthEmerging technologies such as wireless and ultra-fast charging stations are great examples of groundbreaking steps the industry is taking toward a comprehensive charging landscape.Wireless charging, in particular, can eliminate the hassle of plugging in vehicles, making the charging process as seamless as parking.Ultra-fast charging stations are designed to deliver a lot of energy quickly, effectively reducing downtime for EV owners.In short, improving the charging infrastructure will have a positive knock-on effect that can boost EV adoption for years to come.Another factor that plays a big role in the evolution of EVs is the level of sustainability of the electricity that powers them. Transitioning toward renewable energy sources, such as solar, wind, and hydroelectric power can further reduce the environmental impact of EVs.And the greener the grid, the lower the carbon footprint associated with charging an EV will become, raising the eco-friendly appeal of EVs even higher.Sustaining progressAs we advance toward a future marked by innovative electric vehicles and green energy sources, the potential for economic and environmental benefits will become increasingly tangible.With collaboration across all sectors, the industry can realize the full potential of EV technology for a cleaner, more sustainable world. Maja Stefanovic Senior Writer Share article: Maja Stefanovic Senior Writer Electric Vehicles Learn more Have your say /** * RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS. * LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables */ /* var disqus_config = function () { this.page.url = PAGE_URL; // Replace PAGE_URL with your page's canonical URL variable this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable }; */ var disqus_config = function () { this.language = "en"; }; (function() { // DON'T EDIT BELOW THIS LINE var d = document, s = d.createElement('script'); s.src = 'https://here-3.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a> Related articles Connected Driving The triple disruption transforming cars: electric, connected and shared Louis Boroditsky 26 Feb 25 Connected Driving HERE CEO weighs in on live mapping, SDVs and AI HERE Technologies 12 Feb 25 Connected Driving Debate worth having: when does in-car entertainment cross the line? Rosie Gizauskas 31 Jan 25 Sign up for our newsletter Why sign up: Latest offers and discounts Tailored content delivered weekly Exclusive events One click to unsubscribe'''
