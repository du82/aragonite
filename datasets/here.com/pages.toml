["https://here.com/jp/platform/location-based-services/here-sdk"]
title = "位置情報 SDK | iPhone・Android 地図アプリ開発・作成 | HERE"
description = "HERE SDK は、高性能な地図作成、ルート作成、検索機能を備えた、モバイルアプリにも対応する総合的な位置情報SDKです。早速詳細をご覧ください。"
full_description = "HERE SDK 開発用SDK (位置情報) 信頼できるネイティブアプリ開発用SDK お問い合わせ 資料をダウンロード iPhoneやAndroidモバイル対応の地図アプリ作成に優れた包括的なSDK(位置情報) コンシューマーや企業は、無駄なく効率的な移動を実現する革新的な位置情報活用アプリを必要としています。 高精度のHEREの地図データを活用したHERE SDKで、iOSおよびAndroid対応の没入型アプリを構築し、差別化されたモバイル体験を提供できます。 HERE SDKは、マッピング、検索、ルート検索において標準を超える機能を搭載しており、モバイルアセットの位置情報をリアルタイムに可視化するほか、ルート計算、位置情報検索、ターン・バイ・ターンナビゲーションなどのオフライン機能も備えています。 アプリ作成における地図・ ナビゲーションの課題をSDK (高度な位置情報) で軽減 スマートナビゲーション HERE SDKは道路標識などの動的情報を活用し、的確なタイミングで直感的なナビゲーション情報を提供します。また、車、徒歩、トラックなど複数のモードをサポートしています。 関連製品： 交通情報対応の最新のルート検索APIで、いかなる車両の経路検索も最適化：HERE Tour Planning さまざまな地図アプリや組込型ソリューションに対応 HERE SDKが目指すのは位置情報を必要とするあらゆる組込型ソリューションや地図アプリへの適応です。二輪車を含めた車両向けソリューションでは、車載ナビやスマートフォンが起点となる一貫した顧客体験を提供するコンパニオンアプリの開発に対応します。また、モビリティソリューションを実現するiPhone、Android向け地図アプリ開発には、Flutterを使ったシングルコードでの実装でアプリ開発の工数削減に寄与します。 包括的なAPIの提供により位置情報を用いたアプリ開発者をサポート HERE SDKは地図アプリ開発のベースとなる位置情報APIにとどまらず、ルート探索やジオコーディングといったさまざまな機能を提供します。また、一元的に管理されるAPIには屋内地図の作成なども含まれ、iPhoneやAndroidにインストールされたアプリを使った屋内ルーティングへの拡張も可能であり、屋外、屋内を問わず位置情報を活用するアプリ開発に携わる全ての開発者を包括的にサポートします。 地図アプリによるターゲットの細かな状況に合わせたナビゲーション HERE SDKに含まれるルート探索やナビゲーション機能を提供する位置情報APIは乗用車やトラック、二輪車などの車両だけでなく歩行者に向けた地図アプリ開発にも力を発揮します。トラックの種類に応じた規制回避、積荷の荷下ろしが効率よく行えるルートの提案、二輪車の排気量に応じた高速道路利用、歩行者へは駅や駐車場から目的地までの最短での歩行ルート探索など、利用者の状況に適合した位置情報を利用するアプリ開発が可能です。 優れたオフライン機能 HERE SDKを利用することで、ユーザーはデータ接続がない場合でも、地図の閲覧や場所の確認、目的地への移動が可能です。HERE SDKの柔軟なユーザー体験により、業務で使用する場合でも、現場の方の作業を中断させることなく行えます。 高速なアップロードタイムおよびシームレスなユーザー体験 高度に圧縮されたデータフォーマットを用いることで、HEREはベクター地図のファイルサイズを最小限に抑えています。これにより、高速なアップロードタイムおよびシームレスなユーザー体験を実現します。HERE SDKによるデータ消費量の削減は、通信遅延の改善と、レスポンスタイムの向上を求めるビジネスには欠かせません。 直感的操作を可能にする優れたUI HERE SDK UI Kitは、モジュール化されたカスタマイズ可能なUIコンポーネントやコントロールにアクセスするため、位置情報ベースのアプリケーションにインタラクティブかつ直感的なユーザーインターフェースを提供できます。数行のコードを入力するだけで完全なUIを構築でき、アプリの開発時間と市場投入までの時間を短縮します。 ニーズに合わせたカスタマイズ 地図を最適なサイズに調整したいときや、重要なオブジェクトを強調して表示したいときなど、HERE SDK (位置情報) のカスタマイズ機能を使用すると、クリエイティブに問題を解決できます。建物、地形、道路など、ほとんどすべての地図上オブジェクトにおいて色、アイコンサイズ、幅、長さ、その他の属性を調整できます。 充実した機能 HERE SDKはiOSとAndroidに対応しています。Explore EditionとNavigate Editionがあり、タッチスクリーンデバイス向けに最適化されているため、様々なジェスチャーに適応します。 HERE Location ServicesおよびHERE Native APIと同一のセットに基づいて構築されており、クロスプラットフォーム開発をサポートするため、統一したコンセプトや用語を適切に使用しています。 HERE SDKのコンポーネント 地図のカスタマイゼーション 地図の重要なオブジェクトを色やアイコンを変更して表示を強調したり、建物や道路、土地といった地図上オブジェクトの属性を編集するツールを使用できます。 ナビゲーション 車のサイズや特性に応じて調整可能なターン・バイ・ターンナビゲーション機能を搭載。 オフライン データ接続がなくても地図の閲覧、場所の確認、目的地への移動を可能にするオフライン機能を提供します。 技術関連資料​​​​ 使用されているコードやビジュアルの例など、詳しい情報をご確認ください。 Android Explore Android Navigate iOS Explore iOS Navigate One-Pager資料 製品機能の詳細および、HERE SDKによる、お客様のモバイルニーズに合わせた新たな位置情報体験の強化についての詳細をご覧ください。 今すぐダウンロード よくある質問 HERE SDKの拡張機能について教えて下さい。 HERE SDKは、ジャストインタイムのナビゲーション、ユーザーインターフェースのテンプレート、モバイルや高度なフリートテレマティクス向けの動的警告エンジンなど、デバイスに合わせた幅広い機能を提供しています。さらに、HERE SDKにはオフラインモードがあり、データ接続がない環境でも地図やナビゲーションの利用が可能です。 位置情報、地図作成技術はどのような用途に活用できますか？ 位置情報データには幅広い用途があります。例えば、運送関連企業の場合、地図作成、位置情報技術を用いた移動データの記録、速度制限や費用対効果を勘案したルートの最適化、ドライバーの行動分析、さらには地域による問題（住所の座標変換など）の事前解決などを実現することが可能です。 どのように地図作成、位置情報技術をアプリ開発に活用できますか？ 位置情報技術は数多くの方法でアプリに活用できます。例えば、弊社のJavaScript用地図APIを使用して、豊富な機能でカスタマイズ可能な位置情報サービスやインタラクティブな地図を追加できます。HERE REST APIを使用すると、位置情報を統合してアプリケーションを充実させることが可能です。これらには天気予報、ルート検索、バッチジオコーディングなど、アプリユーザーへのよりきめ細やかで包括的なサービス提供を実現する機能が含まれます。また、HERE SDKでは、地図データやナビゲーションシステムだけでなく地図の拡大・縮小およびスクロール機能、オフライン機能といった、デバイス向けの最先端な位置情報技術を利用できます。 HEREの技術が市場において優れている点は何ですか？ Omdiaの位置情報プラットフォームインデックスレポートでは、3年連続で1位の位置情報プラットフォームに選ばれており、HEREは屋内地図、ジオコーディング、開発者エコシステムなどを含め、すべてのカテゴリーで他のプロバイダーをリードしています。​​HEREの位置情報オープンプラットフォームは、ビジネスニーズに応じて世界有数の位置情報技術を活用し、急速に変化する世界の需要に対応できるようにサポートします。 位置情報APIとは何ですか？ 近年では電子機器や車両といったあらゆるものの位置情報が容易に取得できるようになりました。またそれを使ったサービスなど位置情報の活用は人々が生活する上で必須となりつつあります。 こうした動きに伴い位置情報と関連する情報の連携も複雑化しサービスの開発コストが増大しています。そこで注目されるのが位置情報に関連するさまざまな情報を統合し、一貫した操作性によってアプリケーションに情報を提供するサービスです。また、それらのサービスとアプリケーションをつなげる機能を位置情報APIと呼びます。アプリケーションは位置情報APIを通じて統合された位置情報データベースにアクセス、必要な情報を取得します。 HEREは位置情報に関する情報を最大限に活用するさまざまなツールを提供し、アプリケーションの開発をサポートしています。 HERE SDKの利用を始める​ 動的な視覚的情報や音声情報、柔軟なオフライン機能、屋内外におけるシームレスなマッピングを使用して、優れたアプリケーションを開発することが可能です。 お問い合わせ"
