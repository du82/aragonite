full_description = "HEREの業務提携・パートナーネットワーク グローバルなビジネスアライアンスに参加したり、当社認定の戦略パートナーおよびネットワークメンバーと連携して、HEREの位置情報テクノロジーをソリューションに導入しましょう。 お問い合わせ HEREのネットワークの活用方法をご確認ください パートナーを見つける HEREのグローバルなパートナー ネットワークとのつながりを構築できるようお手伝いいたします。当社のパートナーは貴社の所在地や業界を問わず、新しい位置情報関連ソリューションの開発に必要となるサポートを現地で提供します。 当社のネットワークとつながる パートナーになる HEREの製品およびサービスの導入を検討している場合でも、その再販を検討している場合でも、HEREのパートナープログラムは貴社のビジネスの成長過程のあらゆる段階をサポートする適切なツールが揃っています。 パートナープログラムを見る (英語） HEREのパートナーが提供するもの 当社のグローバルパートナーが提供する幅広い専門知識をご活用いただけます。 独立系ソフトウェアベンダー ISVはHEREプラットフォームを活用して、多岐にわたるソフトウェア ソリューションをあらゆる業界に提供しています。 システム インテグレーター 当社のパートナーであるシステム インテグレーターが、位置情報関連のビジネスシステムを構築し、 最適な顧客エクスペリエンスを創出できるように支援しています。 付加価値のあるリセラー HEREのVARを通じて、特定の業界、ビジネス、市場のニーズに適応した最適な位置情報関連ソリューションを見つけることができます。 マネージド サービス プロバイダー 当社は主要なクラウド プラットフォームと連携することで、位置情報テクノロジーとエンタープライズ サービス間の相乗効果を促進しています。 ディストリビューター 地域の信頼できるディストリビューターが弊社に代わって現地パートナーのネットワークを管理し、弊社の事業拡大と市場ニーズへの適応を支援しています。 コンサルティング企業 カスタムのエンドツーエンド ソリューションについて、弊社のパートナーであるコンサルティング企業がさまざまな戦略的アドバイスを提供します。 HEREの重要な戦略パートナー 当社は世界でも最高水準の評価を獲得している業界リーダーと連携し、位置情報テクノロジーの未来を形にしています。 AWS 当社のエンドツーエンドの位置情報プラットフォームおよびプロフェッショナル サービスと、AWSのテクノロジーおよびアプリケーション プラットフォームの融合により、全世界の業界や企業で急速な革新が生み出されています。 三菱商事株式会社 三菱商事とHEREは協同で、サプライ チェーン、物流流通搬送ロジスティクス、小売およびスマート モビリティの分野で変革を促しています。両社は提携することでアジア太平洋地域における事業の拡大を目指しています。 NTT NTT (日本電信電話株式会社) とHEREは協業して、位置情報ベースのマーケティング サービスの変革に尽力しています。この戦略的な提携は、新世代の位置情報サービスおよびアプリケーションの提供を開始することを目的としています。 パートナーの成功事例 SAP Verizon Siemens Leogistics CraveInfotech Glympse Descrates2 AWS 専門知識を共有してモビリティを改善 SAPはHEREと協力して、サービスとしてのモビリティを改善しています。その方法をご覧ください。 HEREには位置情報を利用したサービスに関する豊富な経験があります。弊社はそこから学び、サービスとしてのモビリティの開発に生かしています。 SAP インダストリーソリューション担当マネージャー、Senta Belay氏 5G対応衝突回避システム Verizonの5G超広帯域無線機能とHEREのHD Live MapおよびLive Sense SDKを組み合わせて使用することで、車が衝突する可能性を警告することができます。その方法について説明します。 HERE TechnologiesとVerizonは、現実世界におけるアーバン モビリティの課題を解決することにより、都市内移動の既成概念に変革をもたらしています。 市街地の交通流を改善 都市部でグリーンウェーブ（車を検知して信号を青に変え、交通流をスムーズにするシステム）を最適化するSiemens MobilityとHEREの取り組みをご覧ください。 HEREの車両プローブデータを、当社の信号データや検知データと組み合わせることにより、HEREの位置情報データを活用しています。この組み合わせは非常に強力です。 Siemens Mobility ITS Digital Labs データ分析・実装担当マネージャー デビッド・モントゴメリー氏 ルート設定プランの最適化 HEREはLeogisticsがヤード管理およびルート設定プランの課題を解決できるよう支援しました。その方法を紹介します。 私たちがHEREとの継続的なパートナーシップで期待するのは、位置情報データについて何の作業もしなくてよいということです。HEREプラットフォームで直接検索するだけで、位置情報データを提示できるのです。 Leogistics CEO、Andre Käber 氏 ケース スタディをダウンロード 倉庫の混雑を防ぐ Crave InfoTechは、HEREのインドアマップ ソリューションを利用して大規模な倉庫のルート検索を最適化しています。その様子をご覧ください。 HERE Technologiesのインドアマップ ソリューションは非常に画期的です。コスト効率に優れ、実装も簡単なうえ、大規模な倉庫環境で想定されるほとんどのシナリオに対応しています。 Crave InfoTech、共同創業者兼 CEO、Shrikant Nistane 氏 ケーススタディをダウンロード CEOの取り組みをダウンロード カスタマー エクスペリエンスの向上 GlympseとHEREは、位置情報テクノロジーを活用した正確なETA(到着予測時間)とライブマップにより顧客の期待や要求事項を満たしています。その詳細をご覧ください。 HEREのおかげで、私たちは分析の真のリーダーと連携し、お客様の体験を向上させ続けるために必要なデータと情報を利用することができます。 Glympse 社 CEO、Chris Ruff 氏 ケース スタディをダウンロード ラストマイルの課題の克服 DescartesはHEREの位置情報データを使用して、顧客に対して正確かつリアルタイムのETA(到着予測時間）を提供しています。その方法をご紹介します。 HEREから提供されるようなデータがなければ、ソリューションとして現在のような成果を上げることはできていないでしょう。 Descartes System Groups、製品管理担当 EVP、Ken Wood 氏 ケース スタディをダウンロード 効率とスピードが求められるコンクリートの配送 LafargeHolcimはHEREの位置情報テクノロジーを利用して、コンクリートの配送という複雑かつ時間的制約の厳しい課題に対応しています。その様子をご覧ください。リアルタイムの可視化により、LafargeHolcimは極めて正確なルート検索とナビゲーションを実現しています。 HEREとの連携により、弊社はグローバルなフットプリントでマッピングとナビゲーション サービスを提供できるパートナーを獲得できています。 LafargeHolcim 最高デジタル責任者、Philipp Leutiger 氏 お問い合わせ パートナー ネットワークへの参加をご希望の場合や、当社のパートナー主導によるソリューションについて関心をお持ちの場合は、このフォームにご入力ください。 *必須項目です。弊社のプライバシーポリシーに基づき、お客様の情報を利用させていただく場合があります。"
