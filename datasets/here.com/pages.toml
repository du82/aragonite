["https://here.com/learn/blog/connected-rideshare-electric-vehicles"]
title = "The triple disruption transforming cars: electric, connected and shared | HERE"
description = "Discover how cars are evolving beyond transportation—becoming smarter, more accessible and redefining the way we drive and interact."
full_description = '''HERE360 news The triple disruption transforming cars: electric, connected and shared Connected Driving 4 min read 26 February 2025 The triple disruption transforming cars: electric, connected and shared Cars are no longer just vehicles—they’re becoming more advanced, intelligent and easier to access, reshaping how we drive, interact and own them in ways that impact us all. The automotive industry, once a symbol of might and innovation, is undergoing a transformation unlike anything it’s seen before. From the push for greener vehicles and smarter tech to the rise of car-sharing and subscription services, the way we think about cars is being turned upside down. But these shifts aren’t just challenges—they’re opportunities.For businesses, it’s a chance to reinvent. For policymakers, a moment to lead. And for consumers? It’s the dawn of a whole new driving experience. The road ahead is uncertain, but one thing’s clear: the future of cars is here, and it’s anything but ordinary. Read more: How close are we to self-driving taxis in Europe? Driving decarbonizationSwitching to electric vehicles (EVs) isn’t just a nice-to-have anymore—it’s becoming essential. Why? Because of growing environmental concerns, stricter government rules, modern consumer preferences and the simple fact that EVs are now more practical and affordable than ever.What makes this transition even more interesting is how it’s opening the door for new players in the car industry. Big, established companies are now up against startups bringing fresh ideas and new tech to the table. This competition is driving this change, but it’s also shaking things up, pushing traditional brands to adapt quickly or risk falling behind. Read more: The role of AI in the evolution of the automotive and logistics industries Connecting the dotsAlongside efforts to reduce carbon emissions, digitalization is steadily shaping the automotive industry. The latest car models are becoming more connected, featuring digital displays, improved connectivity and driver-assistance technologies that integrate them into the broader digital landscape.This shift not only improves the driving experience but also opens up new business opportunities, such as subscription services and remote software updates. Additionally, it supports the development of autonomous vehicles, which have the potential to enhance road safety and traffic management.Subscribing to the futureThe traditional idea of car ownership is evolving. New approaches, like ridesharing, car subscription services and leasing, are becoming more popular. These options appeal to a generation that prioritizes convenience and sustainability over owning a vehicle outright.Technology is playing a key role in making these models work. App-based platforms make it easy to access vehicles, while data-driven tools help manage fleets more efficiently. These advancements not only support the growth of alternative ownership but also encourage the adoption of related innovations, such as electric and digitally connected cars. Read more — Driving net-zero: HERE commits to eliminating greenhouse gas emissions Creating a ripple effectThe changes in the automotive industry are also influencing a wide range of other sectors that extends far beyond cars themselves.For example, the growing popularity of electric vehicles is driving demand for renewable energy and more advanced power grids. This has led to increased collaboration between car manufacturers and energy companies to ensure EVs can operate sustainably.At the same time, the lines between technology and automotive industries are blurring. Tech companies are playing a bigger role in areas like software development, cloud computing and artificial intelligence, which are becoming essential to modern vehicles.Cities are also adapting. Urban planners are rethinking infrastructure to support EV charging networks and prepare for the potential rise of autonomous ride-sharing services. These changes could lead to less traffic, cleaner air and more pedestrian-friendly urban spaces.Forging aheadThe move toward decarbonization, digitalization, and new ownership models isn’t just a passing phase—it’s the direction the industry is heading. This transformation also has the potential to influence other critical areas, such as energy and urban development.Navigating this evolving landscape will require bold thinking, cooperation and a focus on the future. For those ready to embrace the challenge, the journey ahead is filled with potential—and plenty of disruption. Louis Boroditsky Managing Editor, HERE360 Share article: Louis Boroditsky Managing Editor, HERE360 Optimize EV routing and charging Find out more Have your say /** * RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS. * LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables */ /* var disqus_config = function () { this.page.url = PAGE_URL; // Replace PAGE_URL with your page's canonical URL variable this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable }; */ var disqus_config = function () { this.language = "en"; }; (function() { // DON'T EDIT BELOW THIS LINE var d = document, s = d.createElement('script'); s.src = 'https://here-3.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a> Related articles Connected Driving The triple disruption transforming cars: electric, connected and shared Louis Boroditsky 26 Feb 25 Connected Driving HERE CEO weighs in on live mapping, SDVs and AI HERE Technologies 12 Feb 25 Connected Driving Debate worth having: when does in-car entertainment cross the line? Rosie Gizauskas 31 Jan 25 Sign up for our newsletter Why sign up: