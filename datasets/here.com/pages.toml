["https://here.com/jp/product/here-tour-planning"]
title = "ルート検索API | 最新交通情報対応の経路検索 API | HERE"
description = "HERE Tour Planningは、複数車両のルート検索を最適化するREST APIです。HEREのルート検索APIは車両ルート検索に関する様々な課題を解決します。HERE Tour Planningを利用すれば、稼働時間、積載量、コスト、最大所要時間及び距離、ドライバーの休憩時間などを考慮しながら、配送・サービス車両の運行計画を立てることが可能です。"
full_description = "HERE Tour Planning ルート検索API リアルタイム交通情報に基づいた、複数車両に対応するカスタマイズ可能なルート検索API​ お問い合わせ 資料をダウンロード HEREのルート検索APIで物流配送効率や車両使用率を向上 HERE Tour Planningは、複数車両のルート検索を最適化するREST APIです。HEREのルート検索APIは車両ルート検索に関する様々な課題を解決します。HERE Tour Planningを利用すれば、稼働時間、積載量、コスト、最大所要時間及び距離、ドライバーの休憩時間などを考慮しながら、配送・サービス車両の運行計画を立てることが可能です。 最新のルート検索APIで全車両の配送管理を最適化 車両の種類や積載量を考慮し、運用する全車両にコストや時間面で最適化されたルートを割り当て、使用率を最大化します。関連製品：HEREのテレマティクスサービスでフリートのルート管理を最適化：HERE Fleet Telematics 物流業務および車両の制約 定められた業務要件を車両の機能と結び付けて、業務時間やドライバーのシフトに基づきルート計画を最適化します。関連製品：最先端アルゴリズムでトラックなどの配送ルートを最適化：HERE Routing 交通情報対応のトラック向けルート作成API HERE Tour Planningでは、リアルタイムの交通情報を活用し、トラックの属性を考慮した大型車用の運行ルートを最適化します。関連製品:高度な地図作成やルート計画、位置情報検索を実現するSDK：HERE SDK 充実した機能を備えたルート検索API HERE Tour Planning APIは、HEREのルート検索、リアルタイム交通情報及び渋滞予測、トラック属性を活用し、運用中の全車両に対し最適化されたルート計画を提供します。自己完結型のヘッドレスなルート検索APIで、アウトプットをドライバーに送信、地図上への表示、シフトや費用を計画する際に使用できます。 開発者のメリット ステートレスな経路検索API お客様ご自身でユーザーデータを継続的に管理できますので、HEREのサーバーでルート計画のデータを保持することはありません。 再ルート計画 条件が変わった場合、ルート計画をインプットとして使用し、現在のルートを計画し直すことができます ユーザー設定が可能 車両のサイズ、種類、稼働時間、業務上の制約、シフトなどを設定することができます。 関連リソース 技術関連資料 開発者向けガイド HERE Tour Planningに関する資料およびリクエスト例（英語) One-Pager資料 HERE Tour Planningの特徴と機能をご確認ください。 今すぐダウンロード 関連コンテンツ お客様の全フリートに最適で効率的かつ、リアルタイムの交通状況に対応した移動経路を作成する方法をご覧ください。 定刻通りの到着 よくある質問 配送ルートの最適化とは？ 配送ルート用の地図を作成をする場合、プロセスが複雑になる場合があります。物流会社は、車両の種類、貨物の積載量、重量、特別な取り扱い要件など、数多くの異なる要素を考慮しなければなりません。配送ルートの最適化とは、HERE Tour Planningのように、最も早くかつ安全で効率のよいルートを構築するロケーションツールを指す用語です。 効率的なフリートマネジメントを実現する上で、なぜ最適化されたルート作成が重要になってくるのでしょうか？ 最適化されたルート作成は、フリートマネジメントにとって幅広いメリットをもたらします。最も重要なのは、フリートを最適な積載量で運行可能にし、その使用率を最大化することです。さらに、最適化されたルート作成により、適切な車両を割り当て、またそれぞれの車両の特性や操作パラメーターに基づいて最適なルートを選択できます。 ルートの最適化は事業計画において、どのようなメリットをもたらしますか？ HERE Tour Planningは様々な制約を考慮しながら、複数の経由地を時間通りかつコスト効率高く経由し、商用車にかかる費用を削減します。さらにルートの最適化により、使用するルートと車両台数のバランスを取りながら、車両費などの経費を最小限に抑えることも出来ます。 ルート検索APIとは何ですか？ ルート探索とは目的地までの経路や到着予想時刻を計算する機能です。 営業や配送といった業務で利用される車両にはさまざまな業務要件が課せられます。配送では荷受けできる時間が指定されるケースが多く到着時間が早ければ良いというわけではありません。指定された時間、場所に正確に到着するための最適なルート計画が必要となり、企業は自社の要件に合ったアプリケーションの開発が必要です。 そうした際に利用できるのがルート探索サービスであり、アプリケーションとサービスの接点がルート探索APIです。開発者はルート探索APIを利用することで、自社の要件に合ったシステムを短期間で構築できます。 HEREのルート探索APIは複数の車両のルート探索を最適化するツールを提供することで開発者をサポートしています。 経路検索APIはどのようなことに活用できますか？ 経路検索は目的地までの経路や到着予想時刻を計算する機能です。 カーナビゲーションがもっとも身近な例ですが、配送を担う企業にとっては、一般のカーナビゲーションで得られる情報だけでは不十分です。距離や時間だけでなく積載量なども考慮した配送コストの管理や、ドライバーの休憩時間などを考慮した車両の運行計画が必要となります。 こうした管理は企業によって異なることが多く企業の開発者の負担は増大します。そうした企業の開発コストを抑えるため車両情報の管理やルート計画アルゴリズムの提供を行うのが経路探索サービスです。開発者は経路探索APIを通じてサービスにアクセスしさまざまな機能を自社のアプリケーションに組み込めます。 HEREの経路検索サービスは車両の種類や積載量を考慮したルート計画の策定といった機能を通じ、企業の開発者を支援します。 ご相談ください HERE Tour Planningの利用開始方法など、お気軽にお問い合わせください お問い合わせ"
