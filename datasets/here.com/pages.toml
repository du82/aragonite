["https://here.com/learn/blog/science-based-targets-initiative"]
title = "Driving net-zero: HERE commits to eliminating greenhouse gas emissions | HERE"
description = "HERE's near-term and net-zero targets have been validated and approved by the Science Based Targets initiative."
full_description = '''HERE360 news Driving net-zero: HERE commits to eliminating greenhouse gas emissions 3 min read 29 September 2023 Driving net-zero: HERE commits to eliminating greenhouse gas emissions HERE's near-term and net-zero targets have been validated and approved by the Science Based Targets initiative. Earlier this year, the Intergovernmental Panel on Climate Change (IPCC) — the United Nations (UN) body for assessing the science related to climate change — published the final summary of its sixth assessment report.Dubbed a “code red for humanity" and an "atlas of human suffering" by UN Secretary-General António Guterres, the report reveals that while it is still possible to limit global temperature rise to 1.5°C (as set out in the Paris Agreement), we are dangerously close to that threshold.The report also contains signs of hope. There are many viable and efficient solutions for mitigating greenhouse gases (GHG) and adapting to climate change caused by humanity, and they are available now. "The 1.5 degree limit is achievable, but it will take a quantum leap in climate action." — António Guterres, UN Secretary-General To minimize the impact of global warming, GHG emissions must be halved by 2030 and net-zero must be achieved by 2050.The Science Based Targets initiative (SBTi) independently assesses companies' targets and helps businesses and organizations set and achieve these goals, including HERE. Over 6,000 leading companies and financial institutions have committed to science-based targets and we are excited to be one of them.Eric StuckeySenior Director, Strategy Operations, HEREOver the last few months, HERE has worked with SBTi to prove our dedication to rapid and deep emission cuts. We will be taking steps to move to renewable energy sources and transitioning to electric vehicles (EVs). We are also engaging suppliers to encourage transparency in reporting and the implementation of emissions reduction initiatives.Today, we are proud to announce that the SBTi has validated and approved our near-term and net-zero targets:Overall Net-Zero TargetHERE Technologies commits to reaching net-zero GHG emissions across the value chain by 2050.Near-Term TargetsHERE Technologies commits to reducing absolute scope 1 and 2 GHG emissions by 65% by 2030 from a 2019 base year. HERE Technologies also commits to reducing absolute scope 3 GHG emissions by 36% within the same timeframe.Long-Term TargetsHERE Technologies commits to reducing absolute scope 1, 2 and 3 GHG emissions by 90% by 2050 from a 2019 base year. Read more: How HERE is working toward a sustainable future for customers, partners and the planet Achieving SBTi validation demonstrates our net-zero commitment. HERE is proud to work with the Science Based Targets initiative to approve our emissions reduction goals. We will work together as one HERE team to implement emissions-savings initiatives.Brian JengHead of ESG, HEREAs part of the HERE 2022 Sustainability Report, we completed a comprehensive greenhouse gas inventory covering 2019 to 2022.This inventory — which is conducted annually — is a big step toward fostering further sustainable practices across the company and determining science-based emissions reduction targets. Louis Boroditsky Managing Editor, HERE360 Share article: Louis Boroditsky Managing Editor, HERE360 HERE Sustainability Report 2022 Download now Have your say /** * RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS. * LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables */ /* var disqus_config = function () { this.page.url = PAGE_URL; // Replace PAGE_URL with your page's canonical URL variable this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable }; */ var disqus_config = function () { this.language = "en"; }; (function() { // DON'T EDIT BELOW THIS LINE var d = document, s = d.createElement('script'); s.src = 'https://here-3.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a> Related articles We Are HERE How HERE helps upgrade emergency management at NAPSG InSPIRE Louis Boroditsky 21 May 24 We Are HERE How HERE is making positive strides in sustainability HERE Technologies 23 Apr 24 We Are HERE Women’s History Month 2024: speaking to trailblazing women in tech Rosie Gizauskas 22 Mar 24 Sign up for our newsletter Why sign up: Latest offers and discounts Tailored content delivered weekly Exclusive events One click to unsubscribe'''
