["https://here.com/learn/blog/logistics-transportation-trends-2024"]
title = "The logistics landscape in 2024 — resilience is crucial | HERE"
description = "Only 50 percent of T&L professionals say they use basic data analytics, new polling shows — and against a backdrop of rapid advancements in artificial intelligence, the…"
full_description = '''HERE360 news The logistics landscape in 2024 — resilience is crucial Fleet Management Supply Chain 4 min read 05 February 2024 The logistics landscape in 2024 — resilience is crucial To say that the transportation and logistics sector has had a bumpy ride over the last four years would be an understatement. Our new report reveals the reasons why Only 50 percent of T&L professionals say they use basic data analytics, new polling shows — and against a backdrop of rapid advancements in artificial intelligence, the pressure to curb carbon emissions and rising geopolitical tensions, building agile and resilient supply chains has never been more important.We recently surveyed, in part with Amazon Web Services (AWS), 900 people working in transportation and logistics across the United States, the United Kingdom and Germany, and captured the findings in our latest "On The Move" report. The goal? To help today's T&L businesses navigate the current opportunities and challenges when digitizing their operations, fleets and workflow.Visibility todayIncreasing visibility throughout the supply chain is at the top of every T&L to-do list, and with 3 out of 4 people surveyed reporting that their company is continuing to make progress in this area, this year is no different. Perhaps what is most surprising is that only a quarter of respondents say that their business has made significant headway, indicating just how much work is left to be done.Between air, land and sea, road-based operations provide the highest visibility. That said, the study also found that both middle and last-mile operations are vulnerable to a lot more variables that affect the estimated time of arrival (ETA), such as carrier pickup and drop-off times, traffic conditions, and route planning and optimization.Therefore, it makes sense that respondents from all three countries rank real-time tracking and route optimization as their most-valued supply chain solutions.Leveling up artificial intelligenceAlthough it seems like we are waking up every day to a new advancement in artificial intelligence (AI), the study reveals a stark contrast — only 50% of T&L businesses across Germany, the UK and the US use basic data analytics. Across the three countries, cost was cited as the top barrier to implementation, followed closely by potential disruption to existing services (12%) and lack of internal expertise (11%).While off-the-shelf technology solutions from external providers remain more appealing in all three countries, T&L organizations in Germany are more likely to build their applications in-house. Read more — Supply chain shifts: what's next for logistics in Asia Still, those surveyed highlighted a need for solutions that are reliable, easy to use, and integrate seamlessly without requiring costly overhauls or a ton of technical expertise.The top areas they want to improve with technology are fleet utilization, route planning, and tracking, according to 30% of all respondents.Bottom line — by investing in reliable, user-friendly solutions, T&L companies can reduce their costs and stay ahead of the competition.Sustainability first?Another startling statistic is that a majority of respondents state their organizations currently do not have sustainability goals, with 27 percent claiming they are still “under development."What's more — a total of 33 percent said their business lacks all sustainability goals, with no plans to develop them further.The good news is that environmental and operational resilience remain core topics within the global logistics industry in 2024.According to the American Transport Research Institute, the cost of running a truck has increased to US$2.251 per mile — an all-time high.Globally, only 16 percent of respondents use automated fleet tour planning in the back office and 40 percent use driver routing.By integrating automated fleet tour planning to support fleet operations, it's possible to plan optimized routes that minimize excess mileage, stop-start traffic and the doubling back on routes you've already taken, all directly saving the amount of fuel your vehicles consume.Better still, by analyzing traffic flow based on live and historical data, your drivers can dynamically avoid congestion hotspots, accidents and construction zones. Not only will this save fuel, but it will also give you and your customers more accurate ETAs, improving your customer satisfaction scores. Louis Boroditsky Managing Editor, HERE360 Share article: Louis Boroditsky Managing Editor, HERE360 2024 tech trends in transport and logistics Read the full report Have your say /** * RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS. * LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables */ /* var disqus_config = function () { this.page.url = PAGE_URL; // Replace PAGE_URL with your page's canonical URL variable this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable }; */ var disqus_config = function () { this.language = "en"; }; (function() { // DON'T EDIT BELOW THIS LINE var d = document, s = d.createElement('script'); s.src = 'https://here-3.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a> Related articles Supply Chain Logistics in focus: what is the difference between 3pl and 4pl? Maja Stefanovic 29 Aug 24 Supply Chain Towpaths of tomorrow: why rivers are the new highways Caroline Christie 22 Aug 24 Supply Chain The state of freight: what’s next for end-to-end logistics? Caroline Christie 05 Aug 24 Sign up for our newsletter Why sign up: Latest offers and discounts Tailored content delivered weekly Exclusive events One click to unsubscribe'''
