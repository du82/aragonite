["https://heremusic.fi/studio"]
title = "Studio | Heremusic"
description = """
HEREMUSIC

Artisti ja säveltäjä Maki Kolehmainen perusti yhdessä Jon Wesamaan kanssa helsinkirecords.com -nimisen levy-yhtiön vuonna 2000 ..."""
full_description = "StudioHEREMUSIC Artisti ja säveltäjä Maki Kolehmainen perusti yhdessä Jon Wesamaan kanssa helsinkirecords.com -nimisen levy-yhtiön vuonna 2000. ”HEREMUSIC” sijaitsee Helsingissä keskeisellä paikalla, hyvässä työympäristössä – jossa musiikinteon kaikki elementit kohtaavat. Kaikki samassa paikassa HEREMUSICin konsepti on yksinkertainen: se yhdistää huipputuotannon, laulunopetuksen, hittibiisit sekä inspiroivan työympäristön levy-yhtiö-toimintaan. Liikeidea on osoittautunut menestykseksi ─ tästä kertovat yli 50 TOP 10 -singleä, yli 30 kultalevyä sekä lukuisat platina- ja multiplatinalevyt. HEREMUSICin menestys on pysynyt hyvällä ja vakaalla pohjalla niin uusien artistien, levymyynnin kuin radiosoittojen saralla. ”Cherry Picking” HEREMUSIC on kiinnittänyt ja kehittänyt artisteja yhteistyössä suurten levy-yhtiöiden kanssa. Huippujen valikointi, ”Cherry Picking”, on osoittautunut tuottoisaksi niin HEREMUSICin kaltaisille itsenäisille levymerkeille kuin suurille levy-yhtiöillekin. Hyvänä esimerkkinä mainittakoon myös kansainvälisiä lavoja valloittava Robin. Arvostettu sävelpaja Myös muut levy-yhtiöt arvostavat HEREMUSICin uusia sävellyksiä ja tuotantopalveluja; asiakkaina ovat alan suurimmat ─ Universal, Warner ja Sony Music Finland. Levy-yhtiö on tuottanut musiikkia myös Idols- ja Popstars-formaatteihin. HEREMUSICin studiot koostuvat kahdesta tarkkaamosta ja erillisestä äänitystilasta. Kun toisessa tilassa äänitetään, voidaan toisessa samanaikaisesti editoida, sovittaa ja säveltää. Näin maksimoidaan tiloista saatava hyöty. Kansainvälistä yhteistyötä Heremusic on aktiivisesti mukana kansainvälisessä Musiikki tuotannossa. Yhtiö on tuottanut lukuisille isoille kansainvälisille artisteille musiikkia. Yhtiön omistajista mainittakoon mm Jörgen Elofsson jonka säveltämää musiikkia on mm. Agnetha Fälyskogille ( Abba), Celine Dionille ja Britney Spearsille muutamia mainittakoon. Mihin demot? Demoja voi lähettää HEREMUSICin Facebook-sivujen kautta.Heremusic facebookissa"
