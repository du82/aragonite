 core) easily outdo one x86 hyper-threading core (two threads per core).Efficiency at its finest Multiple parts of a traditional computer system are combined in a single chip (SoC). With this approach it is possible to save energy and increase the performance per watt, which then again decreases the costs for our customers. And because everything is so compact, there is also room for a higher number of cores. More computing power for less spendings The production costs of single-threading cores are slightly lower than the production costs of hyper-threading cores. And with SoC (system-on-a-chip), only a single chip is needed for a simpler and smaller system. Because of this, you can get way more compute cores than you would with other servers in the same price bracket on the market.'''
