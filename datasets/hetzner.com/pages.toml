tions to Western, Central, Southern, and Eastern Europe. Hetzner Cloud products in Ashburn, Virginia, and Hillsboro, Oregon, run on our own Hetzner servers in the data center parks of third parties in the USA. Ashburn is about a 45-minute drive from the US capital Washington, D.C.. Hillsboro is less than a 30-minute drive from Portland, the largest city in Oregon. Data security is our top priority. For this reason, we are the only ones in control over the usage of our Hetzner servers in the data centers in Ashburn and Hillsboro. At both locations, we provide AMD-based cloud servers and cloud features. The Ashburn location is in a region nicknamed "Data Center Alley", which is one of the most highly trafficked regions in North America. The Hillsboro location is in a region nicknamed "Silicon Forest", and is also already known for an exceptional network, making our proximity to both locations ideal. We operate Hetzner Cloud products in Singapore on Hetzner’s own servers in third-party data centers. With this first location in the Asia-Pacific region, we are expanding our offering and ensuring low latency for even more customers. Data security is our top priority. That’s why only we are using our own servers in Singapore. In Singapore our shared and dedicated VPS with AMD processors and cloud features are available. The location in the heart of Asia enables fast connections to important markets such as China, India and Japan. With a sophisticated network infrastructure and numerous international submarine cable connections, Singapore offers exceptionally high data speeds and excellent connectivity throughout the Asia-Pacific region. FEATURES Load Balancer Load Balancers let you scale your applications easily by automatically distributing traffic across your infrastructure. Handle common use-cases like TLS termination or create an internet-facing entry point to route traffic into your Hetzner Cloud Networks. Primary IPs Assign Primary IPs to your server to establish a connection to the internet. Or create a private-network-only cloud server by not adding any Primary IPs at all. You can change the selected network option at any time. Networks Let your servers communicate through a private network and setup complex network topologies. Ideal for running a Kubernetes cluster or a database server that should not be reachable publicly. Firewalls Our stateful Firewalls make it easy to secure your infrastructure at no additional cost. Define inbound and outbound rules to deny any unwanted traffic. Once configured, you can assign them to as many of your cloud servers as you like. Volumes Volumes offer highly available and reliable SSD storage for your cloud servers. You can expand each Volume to up to 10 TB at any time and you can connect them to your Hetzner cloud servers. 0.0440 0.0500 / GB per Month PERFORMANCE Ampere® Altra®, AMD EPYC™ 2nd Gen and Intel® Xeon® Gold processors together with speedy NVMe SSDs in a local RAID10 mean you’ll profit from high performance hardware. An'''
