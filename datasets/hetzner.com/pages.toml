full_description = "GEX SERVERS: Train and run AI models such as DeepSeek and Llama Dedicated GPU Servers YOUR HETZNER SERVER WITH GPU FOR EVERY AI PROJECT Overview Use-cases Feedback Tutorials Our GEX-line is powered by NVIDIA GPUs with CUDA technology and is perfect for AI workloads and machine learning. GEX44 for AI inference 184 205 00 00 max/mo. 0.2948 0.3285 /hr Order setup fee once 79.00 88.00 Product details GEX130 for AI training 838 931 00 00 max/mo. 1.3429 1.4919 /hr Configure setup fee once 0.00 0.00 Product details Get AI models and tools such as DeepSeek or Ollama running on our dedicated GPU servers and tag us on Hugging Face for a shout-out of your favorite Projects. Check out Hugging Face GEX44 CPU RAM Storage GPU Tensor Performance Intel® Core™ i5-13500 6 Performance Cores 8 Efficient Cores 64 GB DDR4 2x 1.92 TB (Gen3) Nvidia RTX™ 4000 SFF Ada Generation 306.8 TFLOPS GEX130 CPU RAM Storage GPU Tensor Performance Intel® Xeon® Gold 5412U 24 Cores 128 GB DDR5 ECC reg 2x 1.92 TB (Gen 4) NVIDIA RTX™ 6000 Ada Generation 1457.0 TFLOPS 100% Green Electricity GDPR compliant. Our GPU Servers are located in Germany. Find your perfect GPU server for your work with AI GEX130 – Maximum power for AI training When training AI, an artificial intelligence model like DeepSeek is fed with large data sets so that it can perform certain tasks. This is an iterative process in which the model is optimized by adjusting its parameters to deliver the best results. The GEX130 offers the performance required for such complex processes with the NVIDIA RTX™ 6000 of the Ada generation. 48 GB of graphics memory, 142 RT cores, 568 tensor cores and 18176 CUDA cores provide the enormous speed and performance required for working with massive data sets and complex calculations. This is particularly helpful when dealing with image and language processing, generative models and time series analyses. GEX44 – Highly efficient AI inference AI inference means using a trained AI model like Llama that analyzes new data and makes predictions or decisions based on it. The process is important for the practical application of AI systems, as learned knowledge is applied to new, unknown data. The GEX44 is optimized for such scenarios and delivers fast, accurate answers with minimal latency. By utilizing the 192 tensor cores in the Nvidia RTX ™ 4000 SFF Ada Generation GPU, it can accelerate demanding calculations and thus significantly increase efficiency. This is important for applications such as real-time image recognition, speech processing and complex data analysis. The RTX™ 4000 SFF Ada Generation is also particularly energy-efficient. With one ear directly to our product development Subscribe to our newsletter to get exclusive insights from Hetzner and learn all about new products and features. Subscribe to newsletter Selected AI use-cases NLP Multimodal Computer vision Natural Language Processing AI models from the field of NLP are designed to enable computers to capture human language in its full complexity. Artificial intelligence should understand, interpret and generate text and spoken words in a way that is natural and useful. Specific applications include speech recognition, translation, chatbots and the creation, analysis and classification of texts. Multimodal AI applications Multimodal AI models are able to understand, interpret and react to information from different types of data such as text, images, audio and video. This enables a more comprehensive and nuanced understanding of the data, similar to how humans process information from different sensory perceptions.Specific applications include AR and VR applications, text-to-image or text-to-video AI models and sentiment analysis of text and image data. Computer vision Computer vision is an area of artificial intelligence that deals with enabling computers to see and understand images and videos in a way that is similar to or even better than human perception. Specific applications include facial recognition, image segmentation and driver assistance systems. A wish comes true sometimes. What use-cases do you need a GPU server for? Tell us what you want to use a GPU server for. What field are we talking about? Choose field AI CAD 3D Modeling Video content Streaming Other Which GPU memory specs do you need? Choose specs more than 48GB 48GB 40GB 32GB 28GB 24GB 16GB 8GB Do you need Nvidia CUDA interface? yes no Which industry do you work in? (optional) Submit use-case Thank you for participating in our poll! Unfortunately, something went wrong.Please try again at a later time. Everything you need to kickstart your AI project Get AI models such as DeepSeek or Llama running on our dedicated GPU servers and tag us on Hugging Face for a shout-out of your favorite Projects. Running the AI chatbot DeepSeek with Ollama Tutorial Hosting an AI image generator with Stable Diffusion WebUI Tutorial Calling all our AI nerds out there! Share your knowledge and get Hetzner credits for each tutorial you write for our Community."
