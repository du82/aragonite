full_description = '''LOAD BALANCERS NEXT LEVEL APPLICATION SCALING HIGH AVAILABILITY AND PERFORMANCE Distribute traffic between multiple targets and avoid having a single point of failure. Homepage Cloud Load Balancers Cloud Overview Pricing Features FAQs Sign up document.addEventListener('DOMContentLoaded', function () { const route = ['/', '/de', '/de/'].includes(window.location.pathname) ? 'hetzner.com' : window.location.pathname $('.second-navbar-track-link').on('pointerdown', function () { const action = $(this).data('action') _paq.push(['trackEvent', 'CTA', action, route]) }) }) Overview Load Balancers let you scale your applications easily by automatically distributing traffic across your infrastructure. Handle common use-cases like TLS Termination or create an internet-facing entry point to route traffic into your Hetzner Cloud Networks. Pricing Only pay for what you use! With Hetzner Cloud Load Balancers, we only charge you for each hour your Load Balancer is running. If you no longer want to use Load Balancers, simply delete it. Germany Finland New Singapore USA LB11 5 5 39 99 max/mo. 0.0088 0.0098 /hr 5 5 39 99 max/mo. 0.0088 0.0098 /hr 5 5 39 99 max/mo. 0.0088 0.0098 /hr 5 5 39 99 max/mo. 0.0088 0.0098 /hr Services 5 Targets 25 SSL Certificates 10 Traffic incl. 1 TB 1 TB 20 TB Locations FSN 1 NBG 1 HEL 1 HIL ASH SIN LB21 16 18 40 49 max/mo. 0.0253 0.0296 /hr 16 18 40 49 max/mo. 0.0253 0.0296 /hr 16 18 40 49 max/mo. 0.0253 0.0296 /hr 16 18 40 49 max/mo. 0.0253 0.0296 /hr Services 15 Targets 75 SSL Certificates 25 Traffic incl. 2 TB 2 TB 20 TB Locations FSN 1 NBG 1 HEL 1 HIL ASH SIN LB31 32 36 90 99 max/mo. 0.0495 0.0593 /hr 32 36 90 99 max/mo. 0.0495 0.0593 /hr 32 36 90 99 max/mo. 0.0495 0.0593 /hr 32 36 90 99 max/mo. 0.0495 0.0593 /hr Services 30 Targets 150 SSL Certificates 50 Traffic incl. 3 TB 3 TB 20 TB Locations FSN 1 NBG 1 HEL 1 HIL ASH SIN Sign Up Features Dedicated Servers Leverage the power of Hetzner dedicated root servers and combine both the virtual and physical world within a Load Balancer. Protocols Our Load Balancers are capable of handling any TCP based traffic as well as HTTP and HTTPS. They speak HTTP/2 by default, depending on the client's capabilities. High availability We completely manage the Load Balancers for you. Using our highly optimised and automated system, we ensure that your Load Balancer is up and running. TLS Termination Free up CPU cycles from your nodes by offloading TLS(SSL) decryption to your Load Balancer. If security is your top concern, you can just pass the encrypted traffic through to your application servers. Health Checks Configurable active health checks make sure your application can sustain a server failure. Additionally, we perform passive health checks on every request to ensure that traffic is only routed to healthy targets. Private Networks Load Balancers work great together with Hetzner Cloud Networks. Improve your security by configuring your Load Balancer to act as the single point of entry into your infrastructure. Proxy Protocols The proxy protocol provides a convenient way to transport connection information such as a client's IP through to your servers. Fast (re)configuration Load Balancers are easy to configure and ready to go in a few seconds, just like your cloud server, and we apply any configuration changes you make almost instantly. Frequently Asked Questions Can I also use Hetzner dedicated root servers as a target? Yes, you can add Hetzner Cloud servers as well as Hetzner dedicated root servers as targets for a Load Balancer. How many Load Balancers can I create? Each customer has a default limit for the number of Cloud resources that we simultaneously provide. If you would like to increase your limit, you can send a request to our support team by opening a support ticket via Cloud Console. Our team will quickly review your request and, if everything is in order, they will increase your limit. What balancing algorithms can I use? You can currently choose between "Round Robin" and "Least connections", depending on your use case. What SSL/TLS certificates are supported? You can use any valid SSL/TLS certificate. Can I automate Hetzner Cloud Load Balancers? Yes! Have a look at our API Docs to get detailed information about what you can automate on the Load Balancers. Can Load Balancers be integrated with Kubernetes? Yes, we have an official cloud controller manager for Kubernetes available on GitHub. More FAQs'''
