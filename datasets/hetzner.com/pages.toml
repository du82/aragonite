ake down”) in accordance with Art. 6 para. 1 of the DSA (Digital Services Act). If we receive a report of illegal content or if we obtain knowledge of it by other means, we inform our customer about it and we request that the customer immediately remove the content and then write a response to us at Hetzner. The customer should tell us that they have removed the abuse and how, or if they believe the abuse report was in error, they should write a response with an explanation. We will provide the customer with a form they can use for these responses, and we will set a reasonable deadline for the response that is in accordance with legal regulations. The customer will either receive an automated or manual message with the form from our Abuse Team. After the deadline has passed and the customer has not yet sent a response to the Abuse Team, the customer will receive an automated reminder to do so. We (Hetzner’s Abuse Team) reserve the right to lock the customer’s IP address which via which the relevant content is accessible after the deadline has expired and after a member of the Abuse Team has performed a manual check of the relevant content. The IP lock will remain in place until the customer has removed the content and/or submitted a statement or an explanation to the Abuse Team. The legal basis for this process is Art.6 para. 1 DSA and point 8.4 of our Terms and Conditions (https://www.hetzner.com/legal/terms-and-conditions/). The customer can, at any time, submit a request to have the IP lock removed, and to confirm in writing that they have removed the relevant content or to provide an explanation for the content. The customer can submit an unlock request via their customer account. In order to help keep our network clean, we cooperate with a number of organizations that maintain blacklists. If one of our customers has an IP that becomes registered with a blacklist, our customer will receive an abuse message (as described above). We monitor automated metadata of sent packages to help identify and mitigate net scans and DDoS attacks. We check the metadata to see if the sent packages are suitable for their purpose (for enabling communication). If this does not appear to be the case, the customer will receive an abuse message (as described above).'''
