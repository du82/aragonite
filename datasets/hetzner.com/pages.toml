ssible to rent 1/3 and full racks. Have a look at the Hetzner Online Data Center Park Falkenstein. Our special service for you in Falkenstein: Charge your electric car for free. The Colocation Center is part of the ISO 27001 certified Hetzner Data Center Park Helsinki, Huurrekuja 10 in Tuusula, Finland. Tuusula is just a 30-minute drive from central Helsinki and a 15-minute drive from Helsinki-Vantaa International Airport. The Helsinki location is ideal for business opportunities in Scandinavia, Eastern Europe and Asia. On an area of 350 square meters, it is possible to rent 1/3 Racks and Rack Advanced. Our special service for you in Helsinki: Charge your electric car for free. Features Price Put your IT in safe hands and reduce your costs through an unrivaled cheap and transparent monthly price (plus a one-time setup fee) and monthly power charge based on consumption. Network Connections to central Internet exchanges, such as DE-CIX and AMS-IX as well as redundant connectivity to national and international carriers. All upstreams and peerings are integrated into the backbone via state-of-the-art routers from Juniper Networks. Guaranteed network availability of at least 99.9%. Climate control Direct free cooling ensures environmentally friendly cooling of the IT hardware. Air conditioning via the raised floor. Energy-efficient cold aisle containment for 1/3 Racks and Rack Advanced. Safety 24/7 access via a transponder key controlled security lock. Logging of access and setting permissions within the administration interface. High security standards and early fire detection throughout the data center park. Protected network through DDoS protection. Power supply Electricity capacity of 1200 kVA. Uninterruptible power supply (UPS) is guaranteed by a 15-minute battery capacity and emergency diesel generators. All UPS systems are designed redundantly. 100% renewable energy Hetzner Online uses electricity from renewable sources for the energy supply in the data center parks, using hydropower in Germany and hydropower and wind power in Finland. Support Qualified and multilingual technicians are 24/7 on-site to assist you in setup and maintenance when needed. There is also a lounge and workbenches. CERTIFICATION The Colocation Centers in Nuremberg, in Falkenstein/Vogtland and Helsinki are ISO 27001 certified and thus meet international safety standards. Scalability Flexible solutions for your expansion. Offers range from 1/3 Racks to full racks. Get in touch now Insight into the colocation function replaceThumbnail(e) { let thumbnail = ["maxresdefault", "maxres1", "hq720", "hqdefault"] let url = e.dataset.src let maxWidth = e.parentElement.clientWidth let maxHeight = e.parentElement.clientHeight function loadImageAndCheckResolution(src, i = 0) { const img = new Image() img.onload = function() { if (this.naturalWidth === 120 && this.naturalHeight === 90 && i < thumbnail.length - 1) { loadImageAndCheckResolution(url.replace(thumbnail[i], thumbnail[i + 1]), i + 1) } else { e.src = this.src e.width = e.clientWidth e.height = e.clientHeight } } img.src = src } loadImageAndCheckResolution(url) } After you click play, Youtube will load and play the video. To do this, your browser will create a direct connection to the Youtube servers. Therefore, Google's privacy policy . Play Video document.addEventListener("DOMContentLoaded", function() { const youtubeImages = [].slice.call(document.querySelectorAll('img.video-youtube')) youtubeImages.forEach(function(youtubeImage) { replaceThumbnail(youtubeImage) }) }) document.getElementById('youtube-accept-g439dAHlpo0').addEventListener('click', e => { e.preventDefault() let child = document.createElement('iframe') child.classList.add('video-youtube') child.src = 'https://www.youtube-nocookie.com/embed/g439dAHlpo0' let youtubeContainer = document.getElementById('youtube-container-g439dAHlpo0') youtubeContainer.parentNode.replaceChild(child, youtubeContainer) }) Frequently Asked Questions What is colocation and for whom is it useful? Colocation or server housing means that you can house your own server hardware at our data center parks and profit from the existing infrastructure. You benefit from the uninterruptible power supply and air conditioning, the fast redundant Internet connection, the security concept, DDoS protection and on-site customer support around the clock. With several data center locations in Germany and Finland, we can offer you geo-redundancy and thus even greater reliability. These services can be used by private users as well as small and large companies at a low cost. Thus, you relieve your IT department and can concentrate on your core business. How and when is access possible? As a customer, you have exclusive 24/7 access to your rack via your transponder. If it is the first time or just a temporary visit of an external technician, you can set appointments and access authorisation via the administration interface Robot. You then receive a generated password which is used for authentication with the on-site personnel, who will then hand over a transponder for the key controlled interlocking security doors to your rack. The visit is logged and footage is archived in the administration interface for inspection. How quickly do I gain access? Racks are usually available within one business day. Do you offer an installation service? Yes, we accept shipments of customer hardware, and can undertake the installation, e.g. servers, firewall, switch or NAS including LAN cabling. The price is based on the amount of effort.Likewise, hardware such as e.g. drives, power supplies, fans or RAM can be exchanged on behalf of the customer. Here also the price is based on the amount of effort. How are the electricity costs calculated? The electricity costs are based on consumption. For example: One Server with a constant 200 watt power usage costs:0,2 KW * 24h * 30 days * electricity price ( €0.40$0.44 / €0.22$0.24 ) = €57.60$63.36 / €31.68$34.56 per month) More FAQs'''
