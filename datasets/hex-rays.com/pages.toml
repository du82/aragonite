full_description = "CTF CTF challenge IDA’s Maze Chase A Alex Petrov • Aug 6, 2024 Back Copy link In the ancient palace, a daring thief steals from Madame de Maintenon and vanishes into the catacombs. With the help of a guard and an old sage, she learns of legendary items that could aid her pursuit. She must havigate the treachous maze, overcoming obstacles and solving puzzles to retrieve her stolen treasure. Her journey through the catacombs is fraught with challenges, but her determination to reclaim what is hers drives her onward. How to participate Fill in the registration form: https://share-eu1.hsforms.com/1Jqe0MPcjS86kEbPZtUwGTg2dgu4h Download the file provided in the registration form above. It is not mandatory, but we strongly suggest using IDA Pro, Home or Free to solve the challenge. Not an IDA user? Download IDA Free. Reverse-engineer the binary and get valuable instructions on how to solve the challenge. You will need to come to our booth #3003 and play a game on our GAMEPI20 device. Send the correct flag to marketing@hex-rays.com Prizes The quickest three of you to send the flag to the email above, will win a silver coin – a part of the retrieved treasure! Rules of the challenge The challenge is free and open to everyone attending Black Hat USA 2024; Participants must have a valid email address; Participants could use any tools to solve the challenge but we encourage using IDA; Any form of cheating will not be tolerated; We may use your personal informationm provided in the registration form, for the following purposes: We will use your contact information to send you announcements, news, articles, product information, and promotions; We may use third-party email marketing software, such as Hubspot, to facilitate our communication. Your information may be stored in and processed by such services for email marketing purposes. We will not share your personal information with third parties, other companies, or individuals, except as explicitly mentioned in these Rules; The organizers reserve the right to cancel, modify, or suspend the Challenge for any reason, including but not limited to unforeseen circumstances; Only one submission per player will be accepted; Submissions made after the deadline will not be considered; The winners will be contacted and will have to come and collect their prize at the Hex-Rays booth. We may share the names or nicknames of the winners on our website and/or our social networks, except in the cases where the participants have explicitly mentioned that they don’t want their names to be mentioned in our publicity; By participating in the “IDA’s Maze Chase,” you agree to these rules. Hex-Rays reserves the right to update or modify these terms as necessary. For any inquiries or issues related to the Challenge, please contact marketing@hex-rays.com Important Dates: CTF start date: 7 August 2024 Submission Deadline: 8 August 2024, 15:00 (Las Vegas Time Zone) Winners will be announced below and on our X and LinkedIn pages. Best of luck as you step into this thrilling adventure! $(document).ready(function() { $('.copy-link').click(function(event) { event.preventDefault(); $(this).find('span').text('Copied'); var tempElement = $('<textarea>') .css({ position: 'absolute', left: '-9999px', top: '0', opacity: '0', zIndex: '-999' }) .val(window.location.href) .appendTo('body') .select(); document.execCommand('copy'); tempElement.remove(); setTimeout(() => { $(this).find('span').text('Copy link'); }, 2000); }); });"
