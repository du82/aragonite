title = "Igor’s Tip of the Week #172: Type editing from pseudocode – Hex Rays"
description = "We already know that user-defined types such as structures and enums can be created and edited through the corresponding views, or the Local Types list. Ho"
full_description = "idapro shortcuts UI IDA Pro idatips hexrays Igor's tip of the week Igor’s Tip of the Week #172: Type editing from pseudocode I Igor Skochinsky • Jan 15, 2024 Back Copy link We already know that user-defined types such as structures and enums can be created and edited through the corresponding views, or the Local Types list. However, some small edits can be performed directly in the pseudocode view: structure fields can be renamed using the “Rename” action (shortcut N): you can also quickly retype them using the “Set type” action (Y): NB: the neighboring fields are automatically overwritten if the size of the field increases so use Undo to revert if necessary. These actions also work on stack variables because they behave like fields of the stack frame structure. If you prefer to use the free-form C syntax editor to see and edit the whole structure, you can quickly navigate to the type using the “Jump to local type” action from the context menu and then use “Edit” (Ctrl–E) on the type’s entry: See also: Igor’s tip of the week #99: Enums Igor’s tip of the week #42: Renaming and retyping in the decompiler Igor’s tip of the week #11: Quickly creating structures $(document).ready(function() { $('.copy-link').click(function(event) { event.preventDefault(); $(this).find('span').text('Copied'); var tempElement = $('<textarea>') .css({ position: 'absolute', left: '-9999px', top: '0', opacity: '0', zIndex: '-999' }) .val(window.location.href) .appendTo('body') .select(); document.execCommand('copy'); tempElement.remove(); setTimeout(() => { $(this).find('span').text('Copy link'); }, 2000); }); });"
