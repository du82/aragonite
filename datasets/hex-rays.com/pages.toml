["https://hex-rays.com/blog/unveiling-ida-pro-9-0-the-new-risc-v-decompiler-and-enhanced-disassembler-extensions"]
title = "Unveiling IDA Pro 9.0: The New RISC-V Decompiler and Enhanced Disassembler Extensions"
description = "Discover IDA Pro 9.0's new RISC-V decompiler and enhanced disassembler extensions, including support for the T-Head instruction set."
full_description = "IDA Pro c++ IDA 9.0 Unveiling IDA Pro 9.0: The New RISC-V Decompiler and Enhanced Disassembler Extensions A Alex Petrov • Sep 18, 2024 Back Copy link We’ve been asked numerous times the question – “When will IDA support a RISC-V decompilation?”. We are delighted to say that IDA 9.0 will include RISC-V Decompiler, and on top of that, the disassembler will support the T-Head instruction set for the XUANTIE-RV architecture. Why is it so important to have RISC-V in IDA? The answer is simple – because it is becoming more and more popular. In fact, RISC-V has established itself as a revolutionary architecture, offering an open-source, modular design built on the principles of reduced instruction set computing (RISC). Unlike some proprietary architectures, RISC-V is free to use, modify, and implement, making it a popular choice for hardware designers and engineers looking for flexibility. Its streamlined instruction set and load-store architecture ensure simplicity and efficiency, while optional extensions allow customization based on specific application needs. For reverse engineers, RISC-V presents a unique opportunity. With a fixed 32-bit instruction base, 31 general-purpose registers, and a program counter, it offers a clean and predictable structure for analysis. It is also important to highlight that RISC-V offers a robust Linux port, supporting both RV32 and RV64 architectures, allowing seamless integration with open-source development environments. This port includes essential components such as the Linux kernel, U-Boot bootloader, and GCC/LLVM toolchains, ensuring full system functionality on RISC-V hardware. There are many occasions when you would need to analyze such a binary: Security Audits: Finding vulnerabilities in RISC-V processors. IP Theft Investigation: Checking for unauthorized use of designs. Compatibility Checks: Ensuring hardware works with specific software. Performance Tuning: Optimizing the processor for custom applications. Hardware Modification: Modding processors for enhanced or altered functionality. Now, take a moment to explore the examples below. With the RISC-V decompiler, introduced in IDA 9.0, the analysis process is much more streamlined, intuitive, and accurate. Disassembled code containing T-Head instructions .text:00000000000029D6.text:00000000000029D6 # =============== S U B R O U T I N E =======================================.text:00000000000029D6.text:00000000000029D6.text:00000000000029D6 # __int64 __fastcall crc32_z(int, char *, unsigned __int64).text:00000000000029D6 # public crc32_z.text:00000000000029D6 crc32_z: # CODE XREF: j_crc32_z+8↑p.text:00000000000029D6 # DATA XREF: LOAD:0000000000000A50↑o ....text:00000000000029D6 beqz a1, loc_2CCA.text:00000000000029DA sext.w a0, a0.text:00000000000029DC not a0, a0.text:00000000000029E0 la a4, dword_A850.text:00000000000029E8.text:00000000000029E8 loc_29E8: # CODE XREF: crc32_z+AE↓j.text:00000000000029E8 beqz a2, loc_2A62.text:00000000000029EA andi a5, a1, 3.text:00000000000029EE bnez a5, loc_2A6C.text:00000000000029F0 mv a4, a1.text:00000000000029F2 add a7, a1, a2.text:00000000000029F6 li a6, 1Fh.text:00000000000029F8 la a5, dword_A850.text:0000000000002A00.text:0000000000002A00 loc_2A00: # CODE XREF: crc32_z+2B0↓j.text:0000000000002A00 sub a3, a7, a4.text:0000000000002A04 bltu a6, a3, loc_2A86.text:0000000000002A08 srli a5, a2, 5.text:0000000000002A0C slli a4, a5, 5.text:0000000000002A10 add a1, a1, a4.text:0000000000002A12 li a4, -20h.text:0000000000002A14 th.mula a2, a5, a4.text:0000000000002A18 li a7, 3.text:0000000000002A1A li a4, 0.text:0000000000002A1C la a3, dword_A850.text:0000000000002A24.text:0000000000002A24 loc_2A24: # CODE XREF: crc32_z+2F2↓j.text:0000000000002A24 sub a5, a2, a4.text:0000000000002A28 bltu a7, a5, loc_2C88.text:0000000000002A2C srli a5, a2, 2.text:0000000000002A30 li a4, -4.text:0000000000002A32 th.mula a2, a5, a4.text:0000000000002A36 th.addsl a1, a1, a5, 2.text:0000000000002A3A beqz a2, loc