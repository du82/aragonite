["https://hex-rays.com/blog/discourse-community-forum"]
title = "Welcome to Hex-Rays IDA Community Forum"
description = "Hex-Rays launches its Discourse Community Forum. Get company news, product updates, documentation, and more importantly, connect with the IDA community."
full_description = "News IDA Collaboration Discourse Welcome to Hex-Rays IDA Community Forum H Hex-Rays SA • Jan 22, 2025 Back Copy link It's been a long time coming and we're happy to say that we just launched our brand new Discourse community forum. If you’re familiar with our previous forum, you’ll know that while it was informative and useful, it was a closed system with limited discoverability and wasn’t able to have the type of active participation and engagement we all desired. Knowing that your input and the IDA community as a whole have so much to offer, we needed a more robust platform that would give us a way to connect and communicate in a more modern fashion. Enter Discourse. [Jump to Hex-Rays Discourse] What to Expect This new platform is designed to be your go-to spot for everything Hex-Rays. Whether you’re a seasoned pro or just getting started with our tools, Discourse is here to make your life easier. Here's a quick rundown of what you'll find: Company News & Announcements: Get all the latest updates about Hex-Rays, from new case studies to upcoming events and everything in between. Product Updates: We’ll keep you posted on new features, bug fixes, and other changes to our products. Documentation: Access detailed documentation to help you get the most out of our products. We’re talking guides, tutorials, tips and tricks, and so on. Discussions & Community: Have a question? Want to share a cool use case? The platform is set up for engaging informative discussions. Get answers from our team, and/or chat with fellow users who are just as passionate as you are and are ready to help. And Much More: We’re constantly working to improve, so stay tuned for additional content. Why Discourse? We chose Discourse because it's a platform that encourages thoughtful discussions, organized content, and community-driven collaboration. Plus, it’s pretty easy on the eyes (we know, we know—looks aren’t everything, but they don’t hurt either). Whether you’re browsing on a desktop or mobile, Discourse makes it simple to find what you need and interact with others. Get Involved Getting started is a breeze. Simply head over to Hex-Rays Community Forum, sign up, and dive into the discussions. Wherever you are in your IDA journey, our goal is to provide content that will help you feel more connected and get the most out of the product. Got feedback? We’d love to hear from you. We believe we have a great foundation to build off of, but this is your platform, so help us make it the best it can be. And who knows, you might even get a mention in a future update. If you have any questions, please visit our Support page to get in touch with the right team. $(document).ready(function() { $('.copy-link').click(function(event) { event.preventDefault(); $(this).find('span').text('Copied'); var tempElement = $('<textarea>') .css({ position: 'absolute', left: '-9999px', top: '0', opacity: '0', zIndex: '-999' }) .val(window.location.href) .appendTo('body') .select(); document.execCommand('copy'); tempElement.remove(); setTimeout(() => { $(this).find('span').text('Copy link'); }, 2000); }); });"
