["https://hex-rays.com/teams"]
title = "Teams"
description = "Make your team work together. On the same binary, synchronized across all devices."
full_description = "Ready to go with the Teams add-on? Add Teams to your IDA Pro subscription to enable cooperative work on your binaries Get Teams Teams is an add-on to our flagship IDA Pro that expands its functionality with collaborative features. The Teams server is the storage area that holds all the files and tracks modifications. This server is the central point for sharing progress across projects. The central storage server holds all the files and tracks modifications. Every time a contributor publishes changes through the server, the change is remembered. The Teams add-on enables team members to work together on the same project without the risk of losing data or multiple out-of-sync versions. Besides that, teammates can compare different revisions of the same file. With add-ons available for IDA Pro, there's no need to feel limited. As the complexity of your analysis grows, you are not constrained to the essential IDA functionalities. Want to keep your in-house knowledge confidential but still take advantage of Lumina's possibilities? Get the Private Lumina add-on and enable a self-hosted server for your authorized users."
