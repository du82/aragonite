full_description = "IDA Igor's tip of the week IDA 8.4 Service Pack 1 released A Alex Petrov • Mar 20, 2024 Back Copy link IDA 8.4 Service Pack 1 (SP1) is now live and ready to download. This release includes mainly bug fixes and refinements. How to request the new versions All new versions are free for users with an active support plan. Please use the “Help > Check for free update” menu item in IDA. It is also possible to configure automatic checks of new versions. Alternatively, you can submit your ida.key, and our servers will prepare new download links for all your licenses. Your request might take some time to be processed, especially shortly after the release. Please be patient. If you have not received anything within an hour or so, send us a message to support@hex-rays.com. Has your support plan expired? If your key is too old for a free update, you might still be eligible for a discounted upgrade. Support plans can be renewed online. Please upload your ida.key file to get the cart automatically filled with the correct product IDs. Release highlights and complete changelist $(document).ready(function() { $('.copy-link').click(function(event) { event.preventDefault(); $(this).find('span').text('Copied'); var tempElement = $('<textarea>') .css({ position: 'absolute', left: '-9999px', top: '0', opacity: '0', zIndex: '-999' }) .val(window.location.href) .appendTo('body') .select(); document.execCommand('copy'); tempElement.remove(); setTimeout(() => { $(this).find('span').text('Copy link'); }, 2000); }); });"
