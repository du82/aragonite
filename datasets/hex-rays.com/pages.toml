title = "Advanced IDA Python and C++ SDK"
description = "Advanced IDA Python and C++ SDK"
full_description = "Still have questions? We strive to produce fast, stable and robust software, and we are always there for any queries you may have. We aim to respond within 24 hours. Contact us We strive to produce fast, stable and robust software, and we are always there for any queries you may have. We aim to respond within 24 hours. There is a strong incentive for software developers to attack their own software for the purpose of hardening security. Disassembling a computer program can reveal a great deal about its behavior, but there are many ways to limit the usefulness of the raw disassembly. Modern vehicles are rolling software ecosystems. They are now more reliant on firmware running on microcontrollers instead of pure hardware like in the past. Discover Hex-Rays’ journey in revolutionizing binary analysis and supporting cybersecurity professionals worldwide. There is a strong incentive for software developers to attack their own software for the purpose of hardening security. Disassembling a computer program can reveal a great deal about its behavior, but there are many ways to limit the usefulness of the raw disassembly. Modern vehicles are rolling software ecosystems. They are now more reliant on firmware running on microcontrollers instead of pure hardware like in the past. Discover Hex-Rays’ journey in revolutionizing binary analysis and supporting cybersecurity professionals worldwide. This 2-day course is ideal for intermediate or advanced IDA users looking to further hone their IDA programming. This course focuses on writing file format loaders and processor modules to extend IDA's functionality. Participants will perform prototyping using IDAPython and then write a full-blown implementation for a custom executable image format and processor architecture using the native C++ SDK. Additionally, this course provides attendees with an open development session where they can ask deeper questions and/or focus on specific features or exercises of their choice directly with the trainer."
