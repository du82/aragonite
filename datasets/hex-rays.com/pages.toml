full_description = "Igor's tip of the week IDA 8.4: Qt 5.15.2 sources & build scripts G Geoffrey Czokow • Feb 26, 2024 Back Copy link A handful of our users have already requested information regarding the Qt 5.15.2 build, that is shipped with IDA 8.4. The Qt sources used by IDA are: based on Qt 5.15.2, to which the KDE Qt5 patch collection has been added, plus a few custom patches/fixes Rebuilding Qt from source In order to obtain compatible libs, the simplest way forward is to download the full archive – it contains the original 5.15.2 source + KDE patches + Hex-Rays patches go to the build/ directory type python3 build.py -h Note: on Windows, that command should be issued from a Visual Studio 2019 command prompt. $(document).ready(function() { $('.copy-link').click(function(event) { event.preventDefault(); $(this).find('span').text('Copied'); var tempElement = $('<textarea>') .css({ position: 'absolute', left: '-9999px', top: '0', opacity: '0', zIndex: '-999' }) .val(window.location.href) .appendTo('body') .select(); document.execCommand('copy'); tempElement.remove(); setTimeout(() => { $(this).find('span').text('Copy link'); }, 2000); }); });"
