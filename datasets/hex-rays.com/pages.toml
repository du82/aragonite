title = "Participate in our IDA Plugin Community Survey – Hex Rays"
description = "One reason for our success is the strong community that has emerged around our products. We are always excited and surprised to see what plugins and tools"
full_description = "Igor's tip of the week plugin repository Plugins Survey Participate in our IDA Plugin Community Survey A Alex Petrov • Jan 16, 2024 Back Copy link One reason for our success is the strong community that has emerged around our products. We are always excited and surprised to see what plugins and tools you’ve been building on top of IDA all those years. This year, we want to engage with all of you better. It starts with asking you a few questions we’ve compiled in this short survey. Do not hesitate to take part. Whether you are a seasoned plugin developer, a user, or just considering dipping your toes into the world of IDA plugins – we want to hear from you. This survey is your opportunity to share how you use plugins, what drives you to create them, and the challenges you face along the way. We are highly interested to learn more about your go-to resources for support and guidance. Your contribution will play a tremendous role in shaping the future development of the IDA Plugin environment and support, ensuring we align our efforts with your needs and expectations. It is all about your experience! Your feedback is more than just responses to us. It is the starting point for providing a more tailored and effective user experience. By completing the questionnaire, you’re contributing to a community of like-minded colleagues and influencing the tools and resources we develop to support your creative and technical endeavors. We expect you to be honest and tell us – what works, what doesn’t, and what you wish to see improved. The time is now. This is your chance to have your say and help us build a more supportive, innovative, and user-friendly environment. This survey will only take a few minutes of your time and is anonymous. You can be assured that we highly appreciate your time and efforts, and therefore, five of you who answered all questions and provided detailed feedback will have the chance to win an IDA Mug! The survey will conclude on 31 January 2024 and on 6 February 2024 we will pick and contact the winners. Thank you for your continued support and for helping us craft a better IDA plugin community! Take the Survey $(document).ready(function() { $('.copy-link').click(function(event) { event.preventDefault(); $(this).find('span').text('Copied'); var tempElement = $('<textarea>') .css({ position: 'absolute', left: '-9999px', top: '0', opacity: '0', zIndex: '-999' }) .val(window.location.href) .appendTo('body') .select(); document.execCommand('copy'); tempElement.remove(); setTimeout(() => { $(this).find('span').text('Copy link'); }, 2000); }); });"
