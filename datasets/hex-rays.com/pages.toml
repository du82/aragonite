title = "Account Manager, Mid-Market & SMB Sales"
description = "Become an Account Manager, Mid-Market & SMB Sales"
full_description = "There is a strong incentive for software developers to attack their own software for the purpose of hardening security. Disassembling a computer program can reveal a great deal about its behavior, but there are many ways to limit the usefulness of the raw disassembly. Modern vehicles are rolling software ecosystems. They are now more reliant on firmware running on microcontrollers instead of pure hardware like in the past. Discover Hex-Rays’ journey in revolutionizing binary analysis and supporting cybersecurity professionals worldwide. There is a strong incentive for software developers to attack their own software for the purpose of hardening security. Disassembling a computer program can reveal a great deal about its behavior, but there are many ways to limit the usefulness of the raw disassembly. Modern vehicles are rolling software ecosystems. They are now more reliant on firmware running on microcontrollers instead of pure hardware like in the past. Discover Hex-Rays’ journey in revolutionizing binary analysis and supporting cybersecurity professionals worldwide. Founded in 2005, Hex-Rays has built a unique market-leading reverse engineering software for IT security companies and government organizations. Hex-Rays’ flagship product IDA Pro allows cybersecurity professionals to translate a software’s binary code into a human-readable text to reveal and understand its original design, architecture, and logic. The main use cases of Hex-Rays’ technology are security audits, internal stress testing, bug bounty programs, investigating new virus samples, and identifying security concerns. We are looking for a dynamic and highly motivated Account Manager to join our Sales Team. The successful candidate will be responsible for managing our existing customers and identifying new revenue opportunities while ensuring customer satisfaction. This role requires strong analytical skills, excellent written and verbal communication skills, combined with a proactive and strategic approach to implement commercial initiatives and maximize opportunities with our existing customers."
