title = "Igor’s Tip of the Week #166: Dealing with “too big function” – Hex Rays"
description = "Occasionally you may run into the following error message: To ensure that the decompilation speed remains acceptable and does not block IDA, especially whe"
full_description = "idapro idatips hexrays Igor's tip of the week Igor’s Tip of the Week #166: Dealing with “too big function” I Igor Skochinsky • Nov 24, 2023 Back Copy link Occasionally you may run into the following error message: To ensure that the decompilation speed remains acceptable and does not block IDA, especially when using batch decompilation, by default the decompiler refuses to decompile the functions over 64 kilobytes (0x10000 bytes). But here we have function which is 3x as large: In such case you can manually increase the size to force the decompiler try decompile the function anyway. The limit can be increased temporarily or permanently. To change the limit for current database only, open the decompiler options (Edit > Plugins > Hex-Rays Decompiler, Options): Then change the setting in Analysis Options 3: To change the default for all new databases, edit the parameter MAX_FUNCSIZE in hexrays.cfg. Note that settings in the config file are only applied to new databases; for existing databases use the first approach. Hint: instead of editing hexrays.cfg in IDA’s installation, create a new file with only the changed settings in the user directory. This way the settings will persist if you upgrade your IDA version. See also: Failures and troubleshooting (Hex-Rays Decompiler User Manual) Igor’s tip of the week #82: Decompiler options: pseudocode formatting Igor’s tip of the week #83: Decompiler options: default radix Configuration (Hex-Rays Decompiler User Manual) $(document).ready(function() { $('.copy-link').click(function(event) { event.preventDefault(); $(this).find('span').text('Copied'); var tempElement = $('<textarea>') .css({ position: 'absolute', left: '-9999px', top: '0', opacity: '0', zIndex: '-999' }) .val(window.location.href) .appendTo('body') .select(); document.execCommand('copy'); tempElement.remove(); setTimeout(() => { $(this).find('span').text('Copy link'); }, 2000); }); });"
