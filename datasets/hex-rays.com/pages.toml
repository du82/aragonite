full_description = '''Back to home knowledge base Plans, Products & Features Online/Offline work Payments and purchasing Renewals Upgrades and downgrades Discounts Licenses and subscriptions Migration to subscription plans License management Plans, Products & Features IDA Pro IDA Home IDA Free Add-ons IDA Classroom Licenses limitations Online/Offline work My Hex-Rays account KYC Support and help Miscellaneous kbDom.whenReady(function() { document.querySelectorAll('.kb-category-menu svg').forEach(function(el) { el.addEventListener('click', function(e) { e.preventDefault(); var li = kbDom.closest('li', this); if (li) { li.classList.toggle('open'); } }); }) }) Does an IDA Pro Essential license connect to your cloud server when decompilers are not in use? No. However, if the user enabled automatic Lumina server usage, IDA might try to fetch metadata from lumina.hex-rays.com at the end of the analysis. This can be turned off in settings (or just not enabled when asked on the first run). IDA can perform periodic version update checks (once per week). They can be turned off in the Help > Check for free update... dialog. kbDom.whenReady(function() { var smoothScroll = new smoothAnchorsScrolling(); var articleSmoothScrolling = function() { function scrollToAnchor(state) { const anchorId = (state && state.anchorId) || null; if (!anchorId) { return; } var anchor = document.querySelector( '[id="' + anchorId.substring(1) + '"][data-hs-anchor="true"]' ); smoothScroll.scrollTo(anchor); } document .querySelectorAll('a[href^="#"][rel*="noopener"]') .forEach(function(link) { // Adding the handler to the click event on each anchor link link.addEventListener('click', function(e) { e.preventDefault(); var node = e.currentTarget; var targetAnchorId = decodeURI(node.hash); var state = { anchorId: targetAnchorId }; scrollToAnchor(state); history.pushState(state, null, node.href); }); }); window.addEventListener('popstate', function(e) { if (e.state !== undefined) { scrollToAnchor(e.state);