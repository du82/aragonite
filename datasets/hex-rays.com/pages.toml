title = "Introducing IDA 8.4: Key Features and Enhancements – Hex Rays"
description = "It is official! IDA 8.4 has now been released, and we are beyond excited to share the new features and improvements with you. This new version combines enh"
full_description = "IDA Teams IDA Pro Igor's tip of the week Introducing IDA 8.4: Key Features and Enhancements A Alex Petrov • Feb 16, 2024 Back Copy link It is official! IDA 8.4 has now been released, and we are beyond excited to share the new features and improvements with you. This new version combines enhanced support for a bunch of processors, Mach-O file improvements, some signature boosts, standard plugin updates, and a shiny new set of UI refinements that will make your analysis much more productive and convenient. Here is a brief overview of what awaits you in IDA 8.4: Unified type storage (ASMTIL) Support for common Apple-specific instructions and system registers commonly encountered in iOS and macOS software ARMv8.6-A support ARMv8-M support The Mach-O loader now offers fine-grained control over the selection of dyld shared cache modules and their dependencies The ARM32 decompiler supports hard-float ABI Debugger improvements Fresher icons, crisper look when zoom-in, and a crosshair effect in the minigraph view and that’s not all… See full updates here: https://hex-rays.com/products/ida/news/8_4/ How to request the new versions All new versions are free for users with an active support plan. Please use the “Help > Check for free update” menu item in IDA. It is also possible to configure automatic checks of new versions. Alternatively, you can submit your ida.key, and our servers will prepare new download links for all your licenses. Your request might take some time to be processed, especially shortly after the release. Please be patient. If you have not received anything within an hour or so, send us a message to support@hex-rays.com. Has your support plan expired? If your key is too old for a free update, you might still be eligible for a discounted upgrade. Support plans can be renewed online. Please upload your ida.key file to get the cart automatically filled with the correct product IDs. $(document).ready(function() { $('.copy-link').click(functio