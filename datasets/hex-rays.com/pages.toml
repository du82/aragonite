["https://hex-rays.com/blog/2025-training-schedule"]
title = "IDA Online Training: 2025 Dates Available"
description = "Discover the new features and improvements in IDA 9.0, enhancing your analysis and reversing experience."
full_description = "News IDA Pro Training IDA Online Training: 2025 Dates Available H Hex-Rays SA • Jan 13, 2025 Back Copy link Our 2025 IDA Online Training Schedule is live! First, we'd like to thank all the IDA users who participated in the range of training courses we had last year (over 100 participants!). Your engagement and feedback have helped us modify and improve our offerings. From registration to course materials, we've made changes for 2025, and we're excited to share them —see below. Our online training courses are geared towards all levels of users. Whether you are just starting, have been working with IDA for a while, or are considered an advanced user - we have something for you. >>> You can view the 2025 schedule by scrolling down or visiting our Training Page. All registrations are made through our Training Page. <<< Registration Updates Now you can register for more than one course at a time by selecting all the desired courses in our online registration form. Additionally, registration payment can be done via ACH/Wire or credit card. Please note that we are still required to adhere to our KYC verification process for training. (If you are an existing license holder or were in the past 3 years, we generally do not need to perform a check again.) Course Materials We've migrated all our course information and materials for registered attendees to a dedicated and private webpage for each course type. The goal is to give you a one-stop shop for all the materials you need and simplify accessibility while protecting privacy. More interactive and engaging exercises, like CTF challenges, will be integrated into our Advanced courses. Private Classes If your organization would like to hold private training online or in person, email training@hex-rays.com to discuss. We recommend a minimum of 5 people for online and 10 people for in person, but we are happy to discuss a customized plan for you. In-person Classes We will be hosting our first in-person Intermediate training in the Seattle, Washington, USA area in September this year. If you are interested in attending, drop us a note to receive more information. Discounts Early Bird registration is open! Use discount code EARLY2025 to receive 10% off. This offer expires on 21 February 2025 for courses taking place February - June 2025. For courses taking place September - December 2025, the offer expires on 3 September 2025. Opting to take more than one course this year? Make sure to take advantage of our multi-course discount by using discount code MULTI2025 to receive 10% off. Did you attend a course in 2024? Check your inbox to see what tier discount you qualify for. If you did not receive an email just let us know and we'll get you taken care of. If you have any questions, please don't hesitate to reach out to training@hex-rays.com. 2025 IDA Online Training Schedule Time Zone Online Course Start Date End Date Times New York Starter 27-Feb-2025 - 10am - 6pm ET New York Intermediate 9-Apr-2025 11-Apr-2025 10am - 6pm ET New York Advanced Malware 6-May-2025 - 10am - 6pm ET New York Advanced Decompiler 14-May-2025 15-May-2025 10am - 6pm ET 10am - 2pm ET New York Advanced Programming 21-May-2025 22-May-2025 10am - 6pm ET 10am - 2pm ET Paris Starter 10-Apr-2025 - 10am - 6pm ET Paris Intermediate 19-May-2025 21-May-2025 10am - 6pm CET Paris Advanced Malware 3-Jun-2025 - 10am - 6pm CET Paris Advanced Decompiler 11-Jun-2025 12-Jun-2025 10am - 6pm CET 10am - 2pm CET Paris Advanced Programming 18-Jun-2025 19-Jun-2025 10am - 6pm CET 10am - 2pm CET Paris Starter 10-Sep-2025 - 10am - 6pm ET Paris Intermediate 6-Oct-2025 8-Oct-2025 10am - 6pm ET Paris Advanced Malware 4-Nov-2025 - 10am - 6pm ET Paris Advanced Decompiler 12-Nov-2025 13-Nov-2025 10am - 6pm ET 10am - 2pm ET Paris Advanced Programming 19-Nov-2025 20-Nov-2025 10am - 6pm ET 10am - 2pm ET New York Starter 2-Oct-2025 - 10am - 6pm CET New York Intermediate 3-Nov-2025 5-Nov-2025 10am - 6pm CET New York Advanced Malware 2-Dec-2025 - 10am - 6pm CET New York Advanced Decompiler 10-Dec-2025 11-Dec-2025 10am - 6pm CET 10am - 2pm CET New York Advanced Programming 17-Dec-2025 18-Dec-2025 10am - 6pm CET 10am - 2pm CET $(document).ready(function() { $('.copy-link').click(function(event) { event.preventDefault(); $(this).find('span').text('Copied'); var tempElement = $('<textarea>') .css({ position: 'absolute', left: '-9999px', top: '0', opacity: '0', zIndex: '-999' }) .val(window.location.href) .appendTo('body') .select(); document.execCommand('copy'); tempElement.remove(); setTimeout(() => { $(this).find('span').text('Copy link'); }, 2000); }); });"
