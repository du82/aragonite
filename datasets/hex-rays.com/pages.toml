["https://hex-rays.com/blog/igors-tip-of-the-week-171-enums-as-structure-members"]
title = "Igor’s Tip of the Week #171: Enums as structure members – Hex Rays"
description = "We’ve seen how custom structures can be used to format data tables nicely, but sometimes you can improve your understanding even further with small adjustm"
full_description = "idapro shortcuts idatips Igor's tip of the week Igor’s Tip of the Week #171: Enums as structure members I Igor Skochinsky • Jan 5, 2024 Back Copy link We’ve seen how custom structures can be used to format data tables nicely, but sometimes you can improve your understanding even further with small adjustments. For example, in the structure we created, the first member (nMessage) is printed as a simple integer: If you know Win32 API well, you may recognize that these numbers correspond to window messages, but it would be nice to see the symbolic names instead of numbers without having to check MSDN or Windows headers every time. In fact, IDA already has this mapping in the standard type libraries, so we just need to use it for our structure member. It can be done pretty easily using the following steps: Open the Enums window (Shift+F10). Press Ins or use “Add Enum…” from the context menu. Either click Add standard enum by symbol name and pick one of the known messages (e.g. WM_COMMAND), or just type MACRO_WM in the Name field directly, then click OK. now go to AFX_MSGMAP_ENTRY in the Structures window on the first field, use Field type > Enum member… from the context menu, or the shortcut M. select MACRO_WMfrom the list. An automatic comment is added for the field: back in the listing, the numbers are replaced by the symbolic constants: See also: Igor’s tip of the week #99: Enums Igor’s Tip of the Week #125: Structure field representation Igor’s tip of the week #60: Type libraries $(document).ready(function() { $('.copy-link').click(function(event) { event.preventDefault(); $(this).find('span').text('Copied'); var tempElement = $('<textarea>') .css({ position: 'absolute', left: '-9999px', top: '0', opacity: '0', zIndex: '-999' }) .val(window.location.href) .appendTo('body') .select(); document.execCommand('copy'); tempElement.remove(); setTimeout(() => { $(this).find('span').text('Copy link'); }, 2000); }); });"
