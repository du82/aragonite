["https://hex-rays.com/lumina"]
title = "lumina"
description = "Private Lumina offers fast function recognition with full metadata control. Own your data, accelerate work, and improve disassembly efficiency with Private Lumina add-ons for IDA Pro."
full_description = '''Ready to go with Private Lumina add-on? Enable your own Private Lumina server for your entire user base Get Private Lumina Private Lumina provides for rapid function recognition, in the same way as the Hex-Rays Public Lumina feature does. However, Private Lumina keeps your in-house knowledge base available only to a group of users that you authorize. The Private Lumina feature comes in the form of add-ons to your IDA Pro subscriptions that can connect to a Private Lumina server that you operate yourself in your own infrastructure. All your IDA Pro instances that have the Private Lumina add-on enabled can connect to your own Private Lumina server. A Lumina server keeps track of metadata about some widely-recognizable functions, like their names, prototypes, or operand types. Additionally, Lumina allows you to "export" work that was previously done on another file to other projects. Hex-Rays offers both Public and Private Lumina servers. The Public Lumina maintained and operated by Hex-Rays, serves the entire IDA community. Alternatively, you can enable a self-hosted Private Lumina server. Your IDA instance exchanges function hash values and metadata with the Hex-Rays Lumina server, instead of entire byte patterns. When hash values provided by IDA match the Lumina knowledge base, your IDA instance downloads the function and applies it to the current IDA binary file database (IDB). Lumina is implemented as a hash-based lookup table, mapping byte patterns to metadata. For increased resilience, relocatable bits are masked out before hashing. The Lumina server performs lookups purely based on cryptographic digests, so (potentially sensitive) byte patterns are never transferred over the network. Any IDA Pro, IDA Home, or IDA Classroom user can send metadata to Hex-Rays' Public Lumina server. Any IDA Pro user with a Private Lumina add-on installed can send metadata to their Private Lumina server. A Lumina server stores the received metadata and makes it available to all IDA users connecting to that same Lumina server, either Private or Public.'''
year_published = 2025
