full_description = "IDA Igor's tip of the week IDA 8.0 Service Pack 1 released G Geoffrey Czokow • Aug 29, 2022 Back Copy link IDA Service Pack 1 (SP1) for IDA 8.0 is now available. This new release fixes a few issues that might have affected some users. How to request the new versions All new versions are free for users with an active support plan. Please use the “Help > Check for free update” menu item in IDA. It is also possible to configure automatic checks of new versions. Alternatively, you can submit your ida.key and our servers will prepare new download links for all your licenses. Your request might take some time to be processed, especially today after the release. Please be patient. In case of problems, do not hesitate to send us a message. Sometimes we need your help and cannot proceed without it. Just wait an hour or so, and if you do not hear from us, send a message to support@hex-rays.com. Has your support plan expired? If your key is too old for a free update, you might still be eligible for a discounted upgrade. Support plans can be renewed online. Please upload your ida.key file to get the cart automatically filled with the correct product IDs. Release highlights and complete changelist Get a quote $(document).ready(function() { $('.copy-link').click(function(event) { event.preventDefault(); $(this).find('span').text('Copied'); var tempElement = $('<textarea>') .css({ position: 'absolute', left: '-9999px', top: '0', opacity: '0', zIndex: '-999' }) .val(window.location.href) .appendTo('body') .select(); document.execCommand('copy'); tempElement.remove(); setTimeout(() => { $(this).find('span').text('Copy link'); }, 2000); }); });"
