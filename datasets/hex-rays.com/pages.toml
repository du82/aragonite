["https://hex-rays.com/blog/discover-ida-9.0-exciting-new-features-and-improvements"]
title = "Discover IDA 9.0: Exciting New Features and Improvements"
description = "Discover the new features and improvements in IDA 9.0, enhancing your analysis and reversing experience."
full_description = "News IDA 9.0 Discover IDA 9.0: Exciting New Features and Improvements A Alex Petrov • Oct 1, 2024 Back Copy link IDA 9.0 is here, loaded with a bunch of sleek improvements. This release is amplified with new disassemblers and decompilers, such as the RISC-V decompiler, the disassembler support of T-Head instruction set for the XUANTIE-RV architecture, the nanoMIPS decompiler and disassembler, and the Web Assembly (WASM) disassembler. We’ve also added headless processing with idalib, allowing the use of C++ and Python APIs outside IDA to form standalone applications. The time for analysis has been significantly reduced, thanks to our new FLIRT Manager, which lists all available signatures and allows the user to apply them tentatively, and the thousands of new FLIRT signatures available as separate downloads. Additionally, a significant advancement has been made with the C++ exceptions handling in the decompiler, giving the reverse engineers and malware analysts a powerful tool to unravel complex and obfuscated control flows. Finally, we've got a range of user interface refinements. For your convenience, we have highlighted the key features: Headless processing with idalib New RISC-V Decompiler and Disassembler Extensions WASM Disassembler and File Format Loader nanoMIPS support C++ Exceptions Support in the Decompiler IDAPython Improvements No more IDA32 UI Improvements FLIRT Updates Metadata Descriptors for Plugins Take a look at the full list of enhancements https://docs.hex-rays.com/release-notes/9_0 Users with active support: Download IDA 9.0! If you hold an active support license for IDA Pro 8.4 or IDA Teams 8.4, you're eligible to use IDA Pro 9.0 under subscription terms at no cost until the end of your support period. Steps to Get Started: Log in to the Customer Portal: Visit our new portal at my.hex-rays.com using the email address linked to your license. Follow the on-screen prompts to access your account. Request your IDA 9 key: In the license section, Request Your IDA Pro 9.0 Trial License Key. Note that you will have from that moment 2 keys: one for IDA 8.4 and a second one for IDA 9.0. Download IDA Pro 9.0: In the customer portal download center section, download the IDA Pro 9.0 installer. NEW: you have the flexibility to switch the OS at any time as long as your license remains under active support. Read the release notes. Important Updates to Be Aware Of: The IDB file format has been updated. Files saved with IDA 9.0 will not be accessible using IDA 8.4. The C++ SDK and IDAPython API have been revised. You may need to update your plugins. Check the porting guide here. If you are using IDA Teams 8.4, you must upgrade to IDA Pro 9.0 and install the new Teams add-on, available on the portal my.hex-rays.com.For users of floating licenses, a new License server is required. The Flexera server from IDA 8.4 will no longer work. The updated license server can also be downloaded via the portal my.hex-rays.com. Install IDA Pro 9.0, agree to the updated EULA, and start exploring the latest features and enhancements! If you experience any issues at any step, please don’t hesitate to contact our support team at support@hex-rays.com. We're here to assist you! What Happens After Your Support Period Ends? You can subscribe for continued access to IDA 9.x updates by contacting us at sales@hex-rays.com, OR If you choose not to subscribe, you can revert to IDA Pro 8.4 under perpetual license terms. While IDA Pro 8.4 will still receive critical bug fixes during your active support period, most new breakthrough features will be available only in the IDA Pro 9.x branch. IMPORTANT: If you do not subscribe within 1 month after your active support period ends, IDA Pro 9.0 will no longer allow you to save your work. Are you looking to subscribe to one of our new products before your current support period ends? Feel free to contact us at sales@hex-rays.com for a personalized quote and detailed information, including our updated terms and conditions. We're committed to ensuring a seamless transition to our latest product offerings and subscription plans. $(document).ready(function() { $('.copy-link').click(function(event) { event.preventDefault(); $(this).find('span').text('Copied'); var tempElement = $('<textarea>') .css({ position: 'absolute', left: '-9999px', top: '0', opacity: '0', zIndex: '-999' }) .val(window.location.href) .appendTo('body') .select(); document.execCommand('copy'); tempElement.remove(); setTimeout(() => { $(this).find('span').text('Copy link'); }, 2000); }); });"
