["https://hex-rays.com/blog/ida-8.5"]
title = "Releasing IDA 8.5: nanoMIPS, WASM, and More"
description = "Discover the new features and improvements in IDA 8.5, enhancing your analysis and reversing experience."
full_description = '''News IDA 8.5 Releasing IDA 8.5: nanoMIPS, WASM, and More H Hex-Rays SA • Feb 28, 2025 Back Copy link If you have a perpetual license with active support and have not yet started using IDA 9.0 or IDA 9.1, you can now download IDA 8.5 from our customer portal. Alternatively, please note that you can also download a free version of IDA 9.1 by requesting a license key from our customer portal, My Hex-Rays." IDA 8.5 brings a range of enhancements. This update introduces nanoMIPS support, along with a new WebAssembly (WASM) disassembler and loader. We've also refined the IDAPython API, and more. Read on for a closer look at what’s new. nanoMIPS support In IDA 8.5, the MIPS disassembler and decompiler now support nanoMIPS instructions. Since firmware compiled for nanoMIPS is often distributed in md1rom format, we’ve also added a md1rom file loader that parses and applies debug symbols when available. nanoMIPS support is included in the classic MIPS (HEXMIPS) decompiler, so if you already have the MIPS decompiler, you won’t need an additional decompiler. WebAssembly (WASM) Disassembler and File Format Loader With the shift toward client-side browser applications, we saw the need for a dedicated WebAssembly (WASM) disassembler. IDA 8.5 now includes WASM code embedded into its own binary file format as well as a loader that decodes the WASM file format. IDAPython Improvements The C++ SDK and IDAPython API have been revised. We've added several helpers to improve our API user experience. These new endpoints, among other things, streamline managing and operating on types. We also have a few other goodies to assist with accessibility and usage of our API: An updated Porting Guide which reflects recent API improvements New IDAPython examples, mainly for the Working with types category Revamped IDAPython reference documentation to improve cross-referencing Other Feature Enhancements Include: Deprecated IDA32 Metadata Descriptors for Plugins UI Improvements Bugfixes and More Full release notes and a complete list of bug fixes can be viewed here. Keep us in the loop! If you see something, say something. You can report bugs here: https://support.hex-rays.com Have ideas on how we can improve IDA? We want to know! Send us a note with your feedback directly to product@hex-rays.com, or post it on Discourse. Getting the 8.5 update If you have IDA 8.4 in active support you will still be able to download your hexlic key for IDA 8.5 in the "Licenses" tab of the MyHex-rays portal. Getting your hands on IDA 9.1 If you have a perpetual license in active support, you can download IDA 9.1 free of charge! To start using IDA 9.1 today you can access the installer in our new customer portal, My Hex-Rays. There you can request a license key for your free subscription. Please note that the license key for your free IDA 9.1 subscription will expire at the end of your active support period. You can find detailed instructions on how to upgrade to IDA 9 here. Support plan expired? No problem. You can purchase an updated license online here. You’ll see we’ve updated our product packages. If your previous plan doesn’t align with our new offerings, fear not, we’re here to help. We’ve been working with all our customers to ensure they get a plan that is the right fit (and price) for them. Just email us at sales@hex-rays.com. $(document).ready(function() { $('.copy-link').click(function(event) { event.preventDefault(); $(this).find('span').text('Copied'); var tempElement = $('<textarea>') .css({ position: 'absolute', left: '-9999px', top: '0', opacity: '0', zIndex: '-999' }) .val(window.location.href) .appendTo('body') .select(); document.execCommand('copy'); tempElement.remove(); setTimeout(() => { $(this).find('span').text('Copy link'); }, 2000); }); });'''
