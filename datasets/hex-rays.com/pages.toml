description = "Explore IDA Classroom licenses for universities and academic institutions. Get free core IDA functionalities and special pricing for IDA Pro. Apply now for educational license benefits."
full_description = "Teach your class with best-in-class software Academia and education providers can take advantage of the free IDA Classroom plan, or get IDA Pro with an attractive discount. Still have questions? Have subscription queries or other concerns? Let’s get you to the right place. Contact us Academia and education providers can take advantage of the free IDA Classroom plan, or get IDA Pro with an attractive discount. Classroom plans are ideal solutions for universities, engineering schools, professional trainers, and for-profit educational providers who want their students to be equipped with best-in-class reverse engineering software.Two types of Classroom plans are available: the free-of-charge IDA Classroom plan and the 70% Classroom discount on standard IDA Pro plans.Classroom plans can only be requested by educators. Individual students and/or researchers seeking access should contact their teaching staff. Educators must submit an application on behalf of their institution. The free-of-charge IDA Classroom licenses offer a robust version of the core IDA Pro features and are tailored to hardware platforms commonly used by students, i.e. Intel and ARM. Do you need the full power of IDA Pro for your classroom or education-related research work? If you are a recognized academic or trainer, you can apply for a substantial discount on your IDA Pro licenses, starting from 70% before volume discounts."
