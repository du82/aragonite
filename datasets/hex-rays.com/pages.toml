full_description = "idapro shortcuts idatips hexrays Igor's tip of the week Igor’s Tip of the Week #173: Navigating to types from pseudocode I Igor Skochinsky • Feb 2, 2024 Back Copy link Previously we’ve seen how to do small edits to types directly from the pseudocode view. While this is enough for minor edits, sometimes you still need to use the full editor. Of course, it is always possible to open Structures, Enums, or Local Types and look for your type there, but what if you have thousands of them? Fortunately, there are quicker options: If the current variable has a type defined in Local Types, you can use “Jump to local type…” from the context menu If the cursor is on a structure field, you can use “Jump to structure definition..” (or Z) to open the structure and jump directly to the field in question. Once you’re in either view, you can perform the necessary changes to the type before switching back to the decompiler. NB: to avoid slowdowns, the decompiler does not track changes performed outside of the pseudocode view, so you may need to press F5 to refresh it with new changes. See also: Igor’s Tip of the Week #172: Type editing from pseudocode Igor’s tip of the week #11: Quickly creating structures $(document).ready(function() { $('.copy-link').click(function(event) { event.preventDefault(); $(this).find('span').text('Copied'); var tempElement = $('<textarea>') .css({ position: 'absolute', left: '-9999px', top: '0', opacity: '0', zIndex: '-999' }) .val(window.location.href) .appendTo('body') .select(); document.execCommand('copy'); tempElement.remove(); setTimeout(() => { $(this).find('span').text('Copy link'); }, 2000); }); });"
