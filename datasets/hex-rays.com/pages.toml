["https://hex-rays.com/faqs/how-do-i-upgrade-to-ida-9"]
title = "How do I upgrade to IDA 9?"
description = "If you hold an active support license for IDA Pro 8.4 or IDA Teams 8.4, you're eligible to use IDA Pro 9.0 under subscription terms at no cost until the end of your support period. Steps to Get Starte"
full_description = '''Back to home knowledge base Licenses and subscriptions Migration to subscription plans Payments and purchasing KYC Renewals Upgrades and downgrades Discounts Licenses and subscriptions Migration to subscription plans License management Plans, Products & Features IDA Pro IDA Home IDA Free Add-ons IDA Classroom Licenses limitations Online/Offline work My Hex-Rays account Support and help Miscellaneous kbDom.whenReady(function() { document.querySelectorAll('.kb-category-menu svg').forEach(function(el) { el.addEventListener('click', function(e) { e.preventDefault(); var li = kbDom.closest('li', this); if (li) { li.classList.toggle('open'); } }); }) }) How do I upgrade to IDA 9? If you hold an active support license for IDA Pro 8.4 or IDA Teams 8.4, you're eligible to use IDA Pro 9.0 under subscription terms at no cost until the end of your support period. Steps to Get Started: Log in to the Customer Portal: Visit our new portal at my.hex-rays.com using the email address linked to your license. Follow the on-screen prompts to access your account. Request your IDA 9 free subscription: In the license section, Request Your IDA Pro 9.0 free subscription. Note that you will have from that moment 2 keys: one for IDA 8.4 and a second one for IDA 9.0. Download IDA Pro 9.0: In the customer portal download center section, download the IDA Pro 9.0 installer. NEW: you have the flexibility to switch the OS at any time as long as your license remains under active support. Read the release notes. Important Updates to Be Aware Of: The IDB file format has been updated. Files saved with IDA 9.0 will not be accessible using IDA 8.4. The C++ SDK and IDAPython API have been revised. You may need to update your plugins. Check the porting guide here. If you are using IDA Teams 8.4, you must upgrade to IDA Pro 9.0 and install the new Teams add-on, available on the portal my.hex-rays.com. For users of floating licenses, a new License server is required. The Flexera server from IDA 8.4 will no longer work. The updated license server can also be downloaded via the portal my.hex-rays.com. Install IDA Pro 9.0, agree to the updated EULA, and start exploring the latest features and enhancements! If you experience any issues at any step, please don’t hesitate to contact our support team at support@hex-rays.com. We're here to assist you! What Happens After Your Support Period Ends? You can subscribe for continued access to IDA 9.x updates by contacting us at sales@hex-rays.com, OR If you choose not to subscribe, you can revert to IDA Pro 8.4 under perpetual license terms. While IDA Pro 8.4 will still receive critical bug fixes during your active support period, most new breakthrough features will be available only in the IDA Pro 9.x branch. IMPORTANT: If you do not subscribe within 1 month after your active support period ends, IDA Pro 9.0 will no longer allow you to save your work. Are you looking to subscribe to one of our new products before your current support period ends? Feel free to contact us at sales@hex-rays.com for a personalized quote and detailed information, including our updated terms and conditions. We're committed to ensuring a seamless transition to our latest product offerings and subscription plans. kbDom.whenReady(function() { var smoothScroll = new smoothAnchorsScrolling(); var articleSmoothScrolling = function() { function scrollToAnchor(state) { const anchorId = (state && state.anchorId) || null; if (!anchorId) { return; } var anchor = document.querySelector( '[id="' + anchorId.substring(1) + '"][data-hs-anchor="true"]' ); smoothScroll.scrollTo(anchor); } document .querySelectorAll('a[href^="#"][rel*="noopener"]') .forEach(function(link) { // Adding the handler to the click event on each anchor link link.addEventListener('click', function(e) { e.preventDefault(); var node = e.currentTarget; var targetAnchorId = decodeURI(node.hash); var state = { anchorId: targetAnchorId }; scrollToAnchor(state); history.pushState(state, null, node.href); }); }); window.addEventListener('popstate', function(e) { if (e.state !== undefined) { scrollToAnchor(e.state); } }); (function() { var targetAnchorId = decodeURI(window.location.hash); var initialState = { anchorId: targetAnchorId, }; if (targetAnchorId) { setTimeout(function() { scrollToAnchor(initialState); }, 1); } history.pushState(initialState, null, ''); })(); }; window.addEventListener('load', function(e) { articleSmoothScrolling(); }); });'''
