full_description = '''Back to home knowledge base Licenses and subscriptions Payments and purchasing Renewals Upgrades and downgrades Discounts Licenses and subscriptions Migration to subscription plans License management Plans, Products & Features IDA Pro IDA Home IDA Free Add-ons IDA Classroom Licenses limitations Online/Offline work My Hex-Rays account KYC Support and help Miscellaneous kbDom.whenReady(function() { document.querySelectorAll('.kb-category-menu svg').forEach(function(el) { el.addEventListener('click', function(e) { e.preventDefault(); var li = kbDom.closest('li', this); if (li) { li.classList.toggle('open'); } }); }) }) What is Hex-Rays’ change of licensing model? Since October 1st, 2024, Hex-Rays has adopted a yearly subscription-based licensing model for all its products. This new model allows our customers to purchase yearly subscriptions for one or more products. In the past, IDA Pro products were offered under perpetual licensing terms, enabling customers to keep on using the product forever at no additional cost; however, without the right to product updates and support services unless annual support was purchased. This did not apply to IDA Home and IDA Teams, which were already exclusively available through a subscription-based licensing model. Under the subscription-based licensing model, all IDA Pro customers will have to renew their IDA Pro subscriptions annually if they wish to go on using the product. Not renewing the subscription on time will cause the product to stop working 30 days upon subscription expiry date. The 30 day period will be given by Hex-Rays as a commercial grace period. kbDom.whenReady(function() { var smoothScroll = new smoothAnchorsScrolling(); var articleSmoothScrolling = function() { function scrollToAnchor(state) { const anchorId = (state && state.anchorId) || null; if (!anchorId) { return; } var anchor = document.querySelector( '[id="' + anchorId.substring(1) + '"][data-hs-anchor="true"]' ); smoothScroll.scrollTo