["https://hex-rays.com/blog/ida-9.0-service-pack-1"]
title = "Product Update: IDA 9.0sp1 Release"
description = "Discover the new features and improvements in IDA 9.0, enhancing your analysis and reversing experience."
full_description = "News IDAPython IDA 9.0 FLIRT SDK Product Update: IDA 9.0sp1 Release H Hex-Rays SA • Dec 19, 2024 Back Copy link We are pleased to announce the release of the first IDA 9.0 Service Pack (sp1). This Service Pack focuses on bugfixes, along with IDAPython API and SDK enhancements that introduce new and simplified endpoints, and IDA Feeds improvements. Below is a summary and you can read the detailed release notes here. You can download the latest IDA installer from My Hex-Rays, our customer portal. IDAPython / SDK improvements We've added several helpers to improve our API user experience. These new endpoints, among other things, streamline managing and operating on types. You can review the complete change log here. We also have a few other goodies to assist with accessibility and usage of our API: An updated Porting Guide which reflects recent API improvements New IDAPython examples, mainly for the Working with types category Revamped IDAPython reference documentation to improve cross-referencing IDA Feeds IDA Feeds (aka FLIRT Signature Manager) was released with IDA 9.0. The tool is designed to simplify the application of new signatures through updatable libraries, known as IDA FLIRT Signature Bundles, shipped alongside other out-of-the-box IDA plugins. IDA FLIRT signature bundles are available as a separate download from My Hex-Rays as well. Read more about IDA Feeds and the recently updated signature bundles here. Improvements: We have streamlined the IDA Feeds plugin execution and resolved issues with loading when idalib could not be located or was not correctly installed. IDA Feeds can now run without explicitly installing idalib. Additionally, there are UI enhancements to make the plugin experience more intuitive. Review the IDA Feeds configuration and setup guide here, and the complete change log here. UI Improvements, Bugfixes and More UI and other improvements can be viewed here. A complete list of bugfixes can be viewed here. Getting the Service Pack update If you already purchased an IDA 9 subscription or are using the trial version, you can access the 9.0sp1 update in the Download Center of My Hex-Rays portal. Getting your hands on IDA 9 If you have a perpetual license in active support, you can download IDA 9 free of charge! To start using IDA 9 today you can access the installer in our new customer portal, My Hex-Rays. There you can request a license key for your free subscription. Please note that the license key for your free IDA 9 subscription will expire at the end of your active support period. You can find detailed instructions on how to upgrade to IDA 9 here. Support plan expired? No problem. You can purchase an updated license online here. You’ll see we’ve updated our product packages. If your previous plan doesn’t align with our new offerings, fear not, we’re here to help. We’ve been working with all our customers to ensure they get a plan that is the right fit (and price) for them. Just email us at sales@hex-rays.com. $(document).ready(function() { $('.copy-link').click(function(event) { event.preventDefault(); $(this).find('span').text('Copied'); var tempElement = $('<textarea>') .css({ position: 'absolute', left: '-9999px', top: '0', opacity: '0', zIndex: '-999' }) .val(window.location.href) .appendTo('body') .select(); document.execCommand('copy'); tempElement.remove(); setTimeout(() => { $(this).find('span').text('Copy link'); }, 2000); }); });"
