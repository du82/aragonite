["https://hex-rays.com/ida-pro-oem"]
title = "IDA Pro OEM"
description = "IDA Pro licensing for software sales and SaaS. Create and sell derivative works with IDA."
full_description = "We will be happy to listen to your requirements. Identifying the OEM licensing solution that best fits your needs, e.g. pay-per-use, pay-per-install, pay-per-instance, pay-per-vcore, white label, co-branded… We can also provide IDA libraries in a Saas fashion, hosted in our data centers, and managed by our teams, if that is what works best for you. Contact us Still have questions? Have subscription queries or other concerns? Let’s get you to the right place. Contact us The IDA Pro OEM License is tailored for companies looking to create derivative works based on IDA. This license is ideal if you want to, for instance: Identifying the OEM licensing solution that best fits your needs, e.g. pay-per-use, pay-per-install, pay-per-instance, pay-per-vcore, white label, co-branded… We can also provide IDA libraries in a Saas fashion, hosted in our data centers, and managed by our teams, if that is what works best for you. Our customer provides on-line software analysis services, which rely on IDA behind the scenes for disassembly and decompilation. The customer has built a back-end application that orchestrates threads running IDALIB Our customer sells an off-the-shelf malware analysis solution that embeds IDA as a library for enhanced function recognition, disassembly and decompilation. Our customer sends us a flow of suspicious files, which get disassembled and decompiled on the cloud. The results are fed into our customer AI cloud, which then provides human-readable threat intelligence reports."
