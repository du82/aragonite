full_description = '''Back to home knowledge base Plans, Products & Features IDA Classroom Payments and purchasing Renewals Upgrades and downgrades Discounts Licenses and subscriptions Migration to subscription plans License management Plans, Products & Features IDA Pro IDA Home IDA Free Add-ons IDA Classroom Licenses limitations Online/Offline work My Hex-Rays account KYC Support and help Miscellaneous kbDom.whenReady(function() { document.querySelectorAll('.kb-category-menu svg').forEach(function(el) { el.addEventListener('click', function(e) { e.preventDefault(); var li = kbDom.closest('li', this); if (li) { li.classList.toggle('open'); } }); }) }) Who qualifies for Classroom plans? PUBLIC ENROLLMENT: Classroom plans are exclusively available to academia, e.g., universities, technology institutes, engineering schools, and for-profit education providers, e.g., training centres, and certification platforms, that enroll students publicly. Private education providers, such as corporate training departments and military schools, are excluded from the Classroom program and advised to purchase IDA Pro plans instead. Classroom plans are not directly available to individual students and/or researchers. Students and/or researchers that wish to benefit from Classroom plans individually should contact their teaching staff for them to submit an application on behalf of the teaching institution. RELEVANT FIELDS of STUDY: In addition to, Classroom plans are only available to teaching staff for usage with their students during courses and/or research work that address disassembly, decompilation, debugging and/or de-obfuscation techniques, such as, but not limited to, cybersecurity, malware analysis, reverse engineering, program analysis, CPU design, compilers... COUNTRY LIMITATIONS: Classroom plans may be unavailable in some countries depending on guidance or rules and regulations provided by - amongst others - the UN Security Council, the U.S. Department of Commerce, the Council of the European Union or if Hex-Rays is not in a position to examine application documents provided in the language of the applying organization. For more information, inquire with sales@hex-rays.com kbDom.whenReady(function() { var smoothScroll = new smoothAnchorsScrolling(); var articleSmoothScrolling = function() { function scrollToAnchor(state) { const anchorId = (state && state.anchorId) || null; if (!anchorId) { return; } var anchor = document.querySelector( '[id="' + anchorId.substring(1) + '"][data-hs-anchor="true"]' ); smoothScroll.scrollTo(anchor); } document .querySelectorAll('a[href^="#"][rel*="noopener"]') .forEach(function(link) { // Adding the handler to the click event on each anchor link link.addEventListener('click', function(e) { e.preventDefault(); var node = e.currentTarget; var targetAnchorId = decodeURI(node.hash); var state = { anchorId: targetAnchorId }; scrollToAnchor(state); history.pushState(state, null, node.href); }); }); window.addEventListener('popstate', function(e) { if (e.state !== undefined) { scrollToAnchor(e.state); } }); (function() { var targetAnchorId = decodeURI(window.location.hash); var initialState = { anchorId: targetAnchorId, }; if (targetAnchorId) { setTimeout(function() { scrollToAnchor(initialState); }, 1); } history.pushState(initialState, null, ''); })(); }; window.addEventListener('load', function(e) { articleSmoothScrolling(); }); });'''
