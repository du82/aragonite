full_description = "Hex-Rays News Contest Annual Plugin Contest: 15 years of development J Justine Benjamin • Oct 24, 2024 Back Copy link The Hex-Rays plugin Contest was created by the experts behind IDA Pro 15 years ago (!). The annual plugin contest encourages the passionate community of IDA users to develop innovative and useful extensions for IDA and/or the Decompiler. This year we are excited to up the ante by increasing the cash prize amount for our winners. Now 1st place will receive $5,000, 2nd place will receive $2,500 and 3rd place will remain at $1,000. Submitting a plugin is simple. Create an innovative, interesting, and useful extension for IDA 8.4 or IDA 9.0 using C, C++, or Python and send it to contest@hex-rays.com. Submissions are due by 31 December 2024 at midnight (CET Europe). Winners will be announced in mid-January 2025. Visit our contest page for the full details. Are you submitting for the first time or a returning creator looking for inspiration? Check out previous years’ submissions and winners here (scroll to the bottom of the page). Good luck and our deepest thanks. The time and effort you put into these extensions is greatly appreciated! $(document).ready(function() { $('.copy-link').click(function(event) { event.preventDefault(); $(this).find('span').text('Copied'); var tempElement = $('<textarea>') .css({ position: 'absolute', left: '-9999px', top: '0', opacity: '0', zIndex: '-999' }) .val(window.location.href) .appendTo('body') .select(); document.execCommand('copy'); tempElement.remove(); setTimeout(() => { $(this).find('span').text('Copy link'); }, 2000); }); });"
