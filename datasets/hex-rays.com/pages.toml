["https://hex-rays.com/blog/2025-product-vision-and-goals"]
title = "2025 Product Vision & Goals"
description = "Explore Hex-Rays' 2025 product goals: IDA core upgrades, collaborative and community tools,  API enhancements, plugin goodies, FLIRT 2.0, & more."
full_description = "News IDA Decompilation Collaboration Plugins c++ FLIRT SDK Discourse 2025 Product Vision & Goals H Hex-Rays SA • Jan 29, 2025 Back Copy link We're excited to share our 2025 product vision, shaped by your invaluable feedback. This year, we're honing in on four focus areas. Read on to discover what's ahead, and keep the ideas coming—let us know what's working, what's not, and how we can take things to the next level together. 1 | Enhancing IDA Core Functionalities: Not Just a Facelift IDA is the backbone of what we do. It’s like the Swiss Army knife of reverse engineering, but even the best tools need sharpening now and then. This year, we’re focusing on improving its core functionalities to ensure it remains not just useful—but essential. Advanced Decompilation Improvements. We are planning to enhance decompiler support for “higher level” compiled languages like C++, Rust, and Golang. Remember our most recent addition of decompiling Microsoft Visual C++ exception handlers? We plan to surface similar efforts this year. Expanding Architecture Support. As CPU architectures evolve, so do we. Updates are coming for IDA’s disassembler that covers more extensions to current architectures, including non-mainstream chips like Tricore, RH850, TMS320, and NDS32, as well as common platforms like Intel, ARM, and PowerPC. And maybe—just maybe—a new decompiler for additional architectures. Interactive Decompiler. Today, decompilation is largely a one-shot process, translating machine code into (mostly) human-readable pseudocode. We’re creating a way for advanced users to interact with and customize intermediate decompilation steps, such as microcode generation, optimization, and CTree construction, directly within IDA. These efforts are part of a broader push to address tech debt, focusing on areas like data storage, threading models, and user experience. While this is a long-term initiative we’ve already begun work on, you’ll start seeing the benefits this year. 2 | Boosting Collaborative Features: Smarter, Seamless Teamwork Reverse engineering isn’t always a solo sport, so we’re introducing better collaborative features. Real-time collaboration and enhanced integration with IDA Teams will enable faster, more efficient teamwork. One highlight? Quicker synchronization cycles for Teams users, allowing you to share insights instantly and feel like you’re in the same room, even from miles apart. 3 | Empowering the Community: Plugins, and Discourse, and SDKs, oh my! We’re not just building tools for today’s problems—we’re laying the groundwork for a thriving, long-term ecosystem. That means empowering the community to innovate with us. Open-Source SDK: Down the road, our C++ SDK will be open-sourced on GitHub, complete with tagged releases and tons of example code to spy on/learn from. This will simplify life for plugin authors and foster more innovation. Plugin Repository & Enhanced Management Tools: We’re making it easier to customize and extend IDA’s capabilities with an improved plugin repository where discovery and management are a breeze. You’ll know when a plugin was last updated, which versions of IDA it’s compatible with, and more. Plus, in the future, we’re introducing a program to reward plugin creators who maintain compatibility with API updates. Simplified, Low-code API: We’re introducing a low-code API extension to make coding and scripting more accessible while keeping the current API fully supported. This extension will expose additional functions, classes, and entities that minimize the learning curve without disrupting the current API. (This was on our 2024 to-do list. And while we were unable to make the progress we aimed for, making this extension a reality is a top priority for 2025.) Discourse Online Community: We’ve launched a new platform for open dialogue, idea-sharing, and problem-solving. Expect updates on events, contests, and other happenings. You can join the conversation here. 4 | Broadening Our Scope: Going Beyond FLIRT & Lumina As we look forward, we want to create and enhance features that streamline your workflows and help you tackle challenges (or repetitive work) faster than ever. Two initiatives, in particular, have us excited: IDA Feeds Signature Bundles: Building on last year’s efforts, we’ll continue to expand and improve the set of signatures available to our users. We’ll also introduce an on-demand signature generation flow for custom configurations. FLIRT 2.0: To complement this expansion, we're revamping the underlying tech (FLIRT / Lumina) to make function matching faster and more accurate, while keeping false positives low. Shaping What’s Next for IDA—Together We’re dedicated to making our tools better, and we do that by listening to you. Feedback, ideas, even complaints (hey, we can take it)—we want to hear it all. Together, we’re going to keep pushing forward, improving, and building a product that works for you. So stay tuned for the updates, the improvements, and the occasional nerdy joke. Until then, we’ll be tackling the list above—one byte at a time. (Oh, look at that. We can cross the nerdy joke off the list already.) We want to hear from you! Let us know your thoughts by sending a direct message to product@hex-rays.com or share your ideas on our Discourse forum. Last year we had several feedback sessions with our Power Users that resulted in features and enhancements. $(document).ready(function() { $('.copy-link').click(function(event) { event.preventDefault(); $(this).find('span').text('Copied'); var tempElement = $('<textarea>') .css({ position: 'absolute', left: '-9999px', top: '0', opacity: '0', zIndex: '-999' }) .val(window.location.href) .appendTo('body') .select(); document.execCommand('copy'); tempElement.remove(); setTimeout(() => { $(this).find('span').text('Copy link'); }, 2000); }); });"
