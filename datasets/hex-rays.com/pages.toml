["https://hex-rays.com/blog/ida-9.1"]
title = "Introducing IDA 9.1: IDB Storage Optimizations, Processor Updates, and Time Travel Debugging"
description = "Discover the new features and improvements in IDA 9.1, enhancing your analysis and reverse engineering experience."
full_description = "News IDA Teams IDAPython debugger FLIRT IDA 9.1 Introducing IDA 9.1: IDB Storage Optimizations, Processor Updates, and Time Travel Debugging H Hex-Rays SA • Feb 28, 2025 Back Copy link We’re pumped to share the latest features and improvements in IDA 9.1. This release begins to tackle a number of our 2025 product goals like expanding architecture support for non-mainstream chips and boosting collaborative features, specifically quicker sync cycles within IDA Teams. Let’s dig in and see what’s new… IDA 9.1 Highlights Smaller, Faster, Better: IDB Compression with zstd IDA now uses zstd compression in IDB files. The higher compression results in smaller IDBs for faster saving and loading, especially when working with large databases. This also improves performance when working with remote storage or syncing with version control. Sharper Disassembly & Analysis: Processor Module Updates TMS320C6 – The compact (16-bit) encodings from TMS320C66x and TMS320C674x series are now disassembled. RISC-V & RH850 – Improved switch table recognition, broader relocation handling, and extended register tracking. TriCore – mfcr/mtcr instructions now use symbolic names for Core Special Function Registers (CSFRs) when known, making code easier to read. Debugger Updates: Time Travel, Intel Mixed Mode Debugging, and IPv6 Support Windbg Time Travel Debugging – You can now use Time Travel Debugging (TTD) with Windbg, allowing you to track and replay the execution of your code (requires an updated version of dbgeng.dll). Wow64 Process Debugging – You can now switch between 32-bit and 64-bit modes in Wow64 processes (aka Heaven’s Gate) - this can be debugged now. IPv6 Addresses – Our (debug) servers now speak both IPv4 and IPv6 (we hear you, sysadmins). Expanding Decompilation: Latest Updates for ARM64, PPC, and RISC-V We’ve made improvements for decompiler support across multiple architectures. These updates bring more precision and (hopefully) fewer headaches: ARM64 – Now supports ILP32 mode, making decompilation more accurate for systems like Apple’s watchOS. ARM64 – Displaying of symbolic system register names in pseudocode means better, more readable decompilation for OS-level applications. PPC – Support for EFP (Embedded Floating Point) extension instructions of the Signal Processing Engine (SPE), expanding your analysis capabilities. RISC-V – Added more intrinsics, reducing the number of __asm fragments in your pseudocode for a cleaner view. The decompiler now also handles Atomic Memory operation (AMO) instructions seamlessly. Smarter Versioning with IDA Teams Keeping your IDB versions in sync just got faster and more efficient. IDA Teams versioning functionality can now send and receive small binary delta files instead of whole IDBs, delivering faster version management operations and less network traffic by only sending what has changed. The delta files can also be stored on the Vault server, keeping down disk usage. Automated Rust Version Detection & FLIRT Signature Generation IDA now detects the Rust version of the loaded binary, enabling the automated creation of custom, version-specific FLIRT signatures. Bugfixes and More Check out the release notes with all the updates and bugfixes here. Keep us in the loop! If you see something, say something. You can report bugs here: https://support.hex-rays.com Have ideas on how we can improve IDA? We want to know! Send us a note with your feedback directly to product@hex-rays.com, or post it on Discourse. Getting the 9.1 update If you already purchased an IDA 9 subscription, you will see 9.1 in the Download Center of My Hex-Rays portal. Getting your hands on IDA 9.1 If you have a perpetual license in active support, you can download a trial version of IDA 9.1! To start using IDA 9 today you can access the installer in our new customer portal, My Hex-Rays. There you can request a license key for your free subscription. Please note that the license key for your free IDA 9.1 subscription will expire at the end of your active support period. You can find detailed instructions on how to upgrade to the IDA 9 series here. Support plan expired? No problem. You can purchase an updated license online here. You’ll see we’ve updated our product packages. If your previous plan doesn’t align with our new offerings, fear not, we’re here to help. We’ve been working with all our customers to ensure they get a plan that is the right fit (and price) for them. Just email us at sales@hex-rays.com. $(document).ready(function() { $('.copy-link').click(function(event) { event.preventDefault(); $(this).find('span').text('Copied'); var tempElement = $('<textarea>') .css({ position: 'absolute', left: '-9999px', top: '0', opacity: '0', zIndex: '-999' }) .val(window.location.href) .appendTo('body') .select(); document.execCommand('copy'); tempElement.remove(); setTimeout(() => { $(this).find('span').text('Copy link'); }, 2000); }); });"
