["https://hex.pm/blog/announcing-hex-core"]
title = "Announcing hex core | Hex"
description = "A package manager for the Erlang ecosystem"
full_description = "Today we are releasing the first version of hex_core, an Erlang library to interact with Hex.pm and other servers implementing Hex specifications. Before talking about hex_core, let’s ask a simple question: What is Hex? The short answer is, it’s a package manager for the Erlang ecosystem. The long answer is that by Hex we may mean a few different things: The goal of hex_core is to be the reference implementation of Hex specifications used by Hex clients and servers. After the initial release we plan to work with the community to integrate hex_core into their projects and respond to feedback. We will also be focused on releasing a minimal Hex server, built on top of hex_core, to be a starting point for people wanting to run Hex on their own infrastructure. Stay tuned!"
