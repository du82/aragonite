["https://hex.pm/policies/codeofconduct"]
title = "Code of Conduct | Hex"
description = "A package manager for the Erlang ecosystem"
full_description = "Hex exists to facilitate sharing code, by making it easy for Erlang ecosystem developers to publish and distribute packages. We believe that our mission is best served in an environment that is friendly, safe, and accepting; free from intimidation or harassment. Hex is the set of formats and APIs that makes up the specification of Hex. Hex.pm is an implementation of the Hex specifications, it is comprised of this website and associated HTTP API, the package repository including packages published to Hex.pm and the website hexdocs.pm. In this document Hex and Hex.pm is used interchangeably but it refers to Hex.pm. The goal of the Code of Conduct is to specify a baseline standard of behavior so that people with different social values and communication styles can talk about Hex effectively, productively, and respectfully, even in face of disagreements. The Code of Conduct also provides a mechanism for resolving conflicts in the community when they arise. We expect all members of the Hex community, including paid and unpaid agents, administrators, and users to abide by this Code of Conduct at all times in all Hex community venues, online and in person, and in one-on-one communications pertaining to Hex affairs. This policy covers the usage of the Hex registry, as well as the Hex website, and any other services offered by or on behalf of Hex (collectively, the “Service”). It also applies to behavior in the context of the Hex open source project communities, including but not limited to public GitHub repositories, IRC channels, discussion forums and mailing lists when they relate to the Service or Hex communities. This Code of Conduct is in addition to, and does not in any way nullify or invalidate, any other terms or conditions related to use of the Service. The definitions of various subjective terms such as “discriminatory”, “hateful”, or “confusing” will be decided at the sole discretion of the Hex team (support@hex.pm). We are committed to providing a friendly, safe, and welcoming environment for all. We ask that you please respect that people have differences of opinion regarding technical choices, and that every design or implementation choice carries a trade-off and numerous costs. There is seldom a single right answer. A difference of technology preferences is not a license to be rude."
year_published = 2025
clearnet = "https://hex.pm/policies/codeofconduct"
