["https://hex.pm/docs/publish"]
title = "Mix publish package | Hex"
description = "A package manager for the Erlang ecosystem"
full_description = "Publishing a package to Hex consists of registering a Hex user, adding metadata to the project’s mix.exs file, and finally submitting the package with a mix task. When registering a user, you will be prompted for a username, your email and a password. The email is used to confirm your identity during signup, as well as to contact you in case there is an issue with one of your packages. The email will never be shared with a third party. Once this step has been completed, check your email inbox for the confirmation email. Once you have followed the enclosed link, your account will be ready to use. Before publishing, you will have to choose the name of your package. Remember that packages published to Hex are public and can be accessed by anyone in the community. It is also the responsibility of the community to pick and encourage good package names. Here are some tips: The package is configured in the project function in the project’s mix.exs file. See below for an example file. First, make sure that the :version property is correct. All Hex packages are required to follow semantic versioning. While your package version is at major version “0”, any breaking changes should be indicated by incrementing the minor version. For example, 0.1.0 -> 0.2.0. Fill in the :description property. It should be a sentence, or a few sentences, describing the package. To improve the documentation generated by ExDoc, the following fields can also be supplied as part of the project function: A dependency defined with no SCM (:git or :path) will be automatically treated as a Hex dependency. See the Usage guide for more details. Only Hex packages may be used as dependencies of the package. It is not possible to upload packages with Git dependencies. Additionally, only production dependencies will be included, just like how Mix will only fetch production dependencies when fetching the dependencies of your dependencies. Dependencies will be treated as production dependencies when they are defined with no :only property or with only: :prod."
year_published = 2025
clearnet = "https://hex.pm/docs/publish"
tags = ["adding", "metadata", "mix.exs", "naming", "package", "publishing", "registering", "submitting", "user"]
language = "en"
