["https://hex.pm/blog/new-domain-for-build-artifacts"]
title = "New domain for build artifacts | Hex"
description = "A package manager for the Erlang ecosystem"
full_description = "The Hex team builds and hosts precompiled versions of Elixir, Erlang/OTP, and Hex itself. These are currently hosted on https://repo.hex.pm but will be moved to https://builds.hex.pm. (You can read more about the builds on https://github.com/hexpm/bob). The affected URLs are under https://repo.hex.pm/builds/ and https://repo.hex.pm/installs/, and will be moved to https://builds.hex.pm/builds/ https://builds.hex.pm/installs/ respectively. The transition period will be over 3 months with increasing “brownout” periods where repo.hex.pm will redirect to builds.hex.pm. After the 3 month period the redirect will become permanent. If you have tooling that uses builds from Hex, you should update it to use the new builds.hex.pm domain. If your download tool can follow HTTP redirects you will be unaffected by the change to the new domain, you can test if redirects are handled correctly by using the https://repo.hex.pm/redirect/builds URL. Elixir, setup-beam, and asdf-elixir have already been updated to use builds.hex.pm. Past versions of Elixir will continue to be able to install Hex since Elixir will follow redirects. Past versions of setup-beam did not follow redirects and will not work but if you use the tag v1 you will get automatic updates. Past versions of asdf-elixir also did not follow redirects and will stop working unless you update by running asdf plugin-update elixir. During the following dates and times there will be be temporary redirects from https://repo.hex.pm/builds/ to https://builds.hex.pm/builds/ and https://repo.hex.pm/installs/ to https://builds.hex.pm/installs/. The first month after this month there will be no redirects. The second month there will be two distinct hours of redirects each day separated by 12 hours. The third month there will be six hours of redirects each day. After that the redirect will be permanent."
year_published = 2023
year_updated = 2023
