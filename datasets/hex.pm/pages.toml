["https://hex.pm/policies/dispute"]
title = "Dispute policy | Hex"
description = "A package manager for the Erlang ecosystem"
full_description = "This document describes Hex’s policy regarding disputes around package, user, and organization names. Please contact support@hex.pm and explain why you wish the name should be removed. This process should only be used if you think the package violates our Code of Conduct or Terms of Service. If you wish to acquire an existing name find the emails of the package owners or users by going to the specific package or user page and find the emails to contact the original owners. Send an email to owner(s) explaining that you want to take over ownership of the name they control and why, make sure to CC support@hex.pm. Hopefully the owners will give you access to the name, but that might not always be the case. If the owners are unresponsive you will gain access to the name after 30 days if the Hex team agrees to your request. As with packages please contact the user or organization with a request for the name and CC support@hex.pm in the email. It is unlikely that we will transfer ownership of a user or organization name because it’s perfectly valid to have a user or organization without ever publishing packages so they do not apply to the abandoned or squatting policies. Additionally they may have private packages that are not visible to the outside, due to privacy concerns we cannot disclose if they have private packages. But in special circumstances we may consider transferring the ownership of the user or organization. If you believe a name infringes on your copyright or trademark please refer to our Copyright policy for information on how to report such abuse. Public email addresses may not always be available for users or organizations, in those cases email support@hex.pm directly if you wish to dispute a name. This is a living document and may be updated from time to time. Please refer to the git history for this document to view the changes."
year_published = 2025
clearnet = "https://hex.pm/policies/dispute"
