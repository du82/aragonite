["https://hex.pm/blog/hex-v20-released-with-new-version-solver"]
title = "Hex v20 released with new version solver | Hex"
description = "A package manager for the Erlang ecosystem"
full_description = "Hex 2.0 drops support for Elixir 1.0-1.4. Hex 1.0 will continue to be maintained but will only receive security updates. For more details see the release announcement for Hex 1.0. The biggest change in 2.0 is the introduction of our new version solver hex_solver. A version solver for a package manager needs to be able to find the latest versions of a set of compatible packages that do not violate the user specified version requirements of each package, it needs to finish in a reasonable amount of time, and if version solving failed it needs to display a clear message that explains why it failed. The current solver algorithm has been around since work begun on Hex in early 2014. Many improvements have been made to it since its introduction such as performance improvements and better error messages but the underlying algorithm has essentially been the same. Lately issues have been cropping up where the solver seemingly freezes (actually it isn’t freezing, just taking a very long to find a solution), the issue was becoming more and more common as the complexity and number of dependencies of Elixir projects have been growing along with the Hex registry becoming larger and larger. Version solving can be generalized to the boolean satisfiability problem so the time complexity is NP-complete, this means no known algorithm can solve it quickly for larger input sets. SAT solvers exists that can still solve for many inputs in a reasonable amount of time. The problem with SAT solver is that they are generalized and cannot use any optimizations for the specific problem domain of version solving, another issue is that there are usually many solutions that satisfy the version requirements but we expect the package manager to always the latest compatible versions. Finally SAT solvers cannot create an explanatory error message that explains why solving failed. With this in mind we chose to base our new solver on Natalie Weizenbaum’s PubGrub which in turn is based on Conflict-Driven Clause Learning . PubGrub is used in the Dart programming language package manager called pub."
year_published = 2022
clearnet = "https://hex.pm/blog/hex-v20-released-with-new-version-solver"
tags = ["eric", "meadows-jönsson", "next?", "october,", "released", "solver", "v2.0", "version", "what’s"]
