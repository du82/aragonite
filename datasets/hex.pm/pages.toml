["https://hex.pm/docs/rebar3-publish"]
title = "Rebar3 publish package | Hex"
description = "A package manager for the Erlang ecosystem"
full_description = "Erlang packages can be published through the rebar3 Hex plugin. It is suggested to place the entry in the global rebar3 config which should be made as ~/.config/rebar3/rebar.config. Publishing a package to Hex consists of registering a Hex user, adding metadata to the project’s .app.src file, and finally submitting the package with a rebar3 provider. When registering a user, you will be prompted for a username, your email and a password. The email is used to confirm your identity during signup, as well as to contact you in case there is an issue with one of your packages. The email will never be shared with a third party. Once this step has been completed, check your email inbox for the confirmation email. Once you have followed the enclosed link, your account will be ready to use. Before publishing, you will have to choose the name of your package. Remember that packages published to Hex are public and can be accessed by anyone in the community. It is also the responsibility of the community to pick and encourage good package names. Here are some tips: The package is configured in the src/<myapp>.app.src file. See below for an example file. While the dependencies of the application are in rebar.config, as seen below as well. First, make sure that the vsn property is correct. All Hex packages are required to follow semantic versioning. vsn and the app name are the only required properties. While your package version is at major version “0”, any breaking changes should be indicated by incrementing the minor version. For example, 0.1.0 -> 0.2.0. Then fill in the description property. It should be a sentence, or a few sentences, describing the package. The description is optional but highly recommended. A dependency defined with no SCM (git or hg) will be automatically treated as a Hex dependency. See the Usage guide for more details. Only Hex packages may be used as dependencies of the package. It is not possible to upload packages with Git dependencies. Additionally, only default dependencies will be included, just like how rebar3 will only fetch default dependencies when fetching the dependencies of your dependencies."
year_published = 2025
clearnet = "https://hex.pm/docs/rebar3-publish"
tags = ["adding", "metadata", "naming", "package", "publishing", "registering", "submitting", "user"]
