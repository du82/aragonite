["https://hex.pm"]
title = "Hex"
description = "A blazing fast JSON parser and generator in pure Elixir."
full_description = '''Specify your Mix dependencies as two-item tuples like {:plug, "~> 1.1.0"} in your dependency list, Elixir will ask if you want to install Hex if you haven't already. Download rebar3, put it in your PATH and give it executable permissions. Now you can specify Hex dependencies in your rebar.config like {deps, [telemetry]}. Fetch dependencies from Hex without creating an account. Hex is usable out of the box in Elixir with Mix and in Erlang with Rebar3. Check our FAQ for commonly asked questions. Create an account and follow the publishing guide. Your package will be immediately available to all Elixir and Erlang users and the documentation will be available on HexDocs. Publish private packages by creating an organization. Your private packages will get the same features as public packages such as fast dependency fetching, HexDocs, and run on the same reliable infrastructure that serves millions of packages daily. See our pricing page for more details. 5 128 362 downloads A blazing fast JSON parser and generator in pure Elixir. 1.4.4 published 221 days ago 4 445 043 downloads Dynamic dispatching library for metrics and instrumentations 1.3.0 published 194 days ago 4 060 600 downloads CA bundle adapted from Mozilla by https://certifi.io 2.14.0 published 13 days ago A Elixir library for parsing OPML content from URLs or direct XML content. Outputs programmer-fri... published 1 hour ago A pure functional finite state machine library for Elixir. Replika implements finite state machin... published 22 hours ago OpentelemetryReactiveCommons uses telemetry handlers to create OpenTelemetry spans. published 1 day ago A Elixir library for parsing OPML content from URLs or direct XML content. Outputs programmer-fri... 0.1.0 published 1 hour ago'''
