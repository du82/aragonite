["https://hex.pm/about"]
title = "About Hex | Hex"
description = "A package manager for the Erlang ecosystem"
full_description = '''Hex is a package manager for the BEAM ecosystem, any language that compiles to run on the BEAM VM, such as Elixir and Erlang, can be used to build Hex packages. Hex consists of the HTTP API, this website, the repository serving packages and indexes, HexDocs, the Mix build-tool integration, and other services. Many build tools support Hex packages including Mix for Elixir projects, Rebar and erlang.mk for Erlang projects. Hex's source code is licensed under the Apache 2 License and is maintained by the Hex core team. The team consists of three members: Eric Meadows-Jönsson, Todd Resudek, and Wojtek Mach. The core team maintains the code bases, infrastructure, and services required to run Hex. To report an issue in Hex or its services open an issue on the appropriate repository in the GitHub organization or on the hexpm repository. To get in direct contact with Hex core team email support@hex.pm. Security vulnerabilities should be disclosed to security@hex.pm. Hex was started as an open-source project early 2014, it is still an open-source project but today it is operated by the Swedish limited company "Six Colors AB". The company was founded in 2018 by the creator of Hex, Eric Meadows-Jönsson, Six Colors supports the development of Hex and operates all services required to run Hex. By charging for private packages we can fund free open-source development and run reliable services for both paying customers and the open-source community.'''
year_published = 2025
