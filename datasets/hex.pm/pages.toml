["https://hex.pm/docs/self-hosting"]
title = "Self-hosting | Hex"
description = "A package manager for the Erlang ecosystem"
full_description = "In this guide we’ll learn how to serve Hex packages on your own package repository. First, though, some background on what a Hex repository really is. A Hex deployment must follow the Hex specifications. https://hex.pm is powered by https://github.com/hexpm/hexpm and related services such as https://github.com/hexpm/hexdocs. While you can use these projects to run your own Hex infrastructure it is generally not recommended because they include many features and complexity not required by the average deployment. The Hex team also maintains a lower-level library, https://github.com/hexpm/hex_core, that you can use to build and interact with Hex services. Hex v0.21 introduced the mix hex.registry build task which provides an easy way to build a local registry. Let’s create an “acme” registry, generate a random private key, a public directory, and finally let’s build the registry: and that’s it! Now, all we need to do is start a HTTP server that exposes the public directory and we can point Hex clients to it. However, let’s add a package to our repository first. To publish a package you need to copy the tarball to public/tarballs and re-build the registry. You can build your own package (using mix hex.build) or simply use an existing one. Let’s do the latter: Now let’s test our repository. We can use the built-in server that ships with Erlang/OTP to serve the public directory: To use the package in your Mix project, add it as a dependency and set the :repo option to your repository name: Deploying to Amazon S3 (or similar cloud services) is probably the easiest way to have a reliable Hex repository. If you already have an S3 bucket, use e.g. AWS CLI to sync the contents of the public/ directory like this: Warning: Remember to sync only the public directory and not private_key.pem! And if you do want to sync your private key, remember to set appropriate bucket policy so it isn’t accidentally exposed. Your repository should now be available under an URL like: https://<bucket>.s3.<region>.amazonaws.com or however you configured your bucket."
year_published = 2025
