["https://hex.pm/blog/hex-v021-released"]
title = "Hex v021 released | Hex"
description = "A package manager for the Erlang ecosystem"
full_description = 'Hex v0.21 adds registry self-hosting, diff & dependencies improvements, mix hex.sponsor task, and more! Hex ships with a new mix hex.registry task to easily build a local Hex registry. See the new self-hosting guide for more information. The new release also brings many improvements to better understand and manage dependencies in your Mix projects. mix hex.outdated now makes it easy to see what changed in your dependencies between the versions you are using and the latest ones, it outputs a link which will show you a list of diffs: mix hex.package diff can now be used to diff the currently used version (in mix.lock) against an arbitrary version: Hex now makes it easy to find packages with sponsorships. Run the command below to find such dependencies in your current project and here is how the output might look like: If you want your project to be listed, add a "Sponsor" link in your mix.exs (or in rebar.config, etc): There are exceptions to the immutability rule, a package can be changed or unpublished within 60 minutes of the package version release or within 24 hours of initial release of the package. Now when attempting to re-publish an existing version, you’ll need to explicitly pass a --replace flag. Worth mentioning that there’s no re-publishing time window on Hex.pm Private Packages and so the --replace option is particularly useful there. The https://github.com/hexpm/hex repository now maintains a latest branch which means you can install Hex via: This is useful when you have problems (e.g. HTTP errors) with using the default installation method of running $ mix local.hex. Hex v0.21 brings many other improvements and bug fixes, for a full list of changes see the CHANGELOG. Thank you to all contributors who made that happen!'
year_published = 2021
