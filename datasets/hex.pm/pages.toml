["https://hex.pm/docs/faq"]
title = "FAQ | Hex"
description = "A package manager for the Erlang ecosystem"
full_description = "To report an issue in Hex or its services open an issue on the appropriate repository in the GitHub organization or on the hexpm repository. To get in direct contact with Hex core team email support@hex.pm. For security reasons, your username cannot be changed. However, if you would like to adopt a new username we recommend creating a new account. When you type a password to sign in, create an account, or change your password, we will check if the password you entered is considered weak according to HaveIBeenPwned. The password may be identified as weak even if you have never used that password before. This could be for a number of reason. When you run mix hex.publish [docs] the documentation is generated on your machine and then uploaded to Hex. Issues with documentation usually stem from the documentation generation. First verify that your documentation works locally by running mix docs and then opening the generated files locally, typically doc/index.html, also verify that there are no differences in letter casing since Hexdocs is case-sensitive but your machine may be case-insensitive. You can always republish old documentation with mix hex.publish docs to update it. Finally make sure you clear your browser cache to ensure you are viewing the latest version. The Hex repository is immutable, this means that in general you cannot remove or change an already published package. This restriction exists to ensure a stable and reliable ecosystem where depended on packages can’t suddenly disappear. There are exceptions to the immutability rule, a package can be changed or unpublished within 60 minutes of the package version release or within 24 hours of initial release of the package. Packages are unpublished with mix hex.publish --revert VERSION and republished by running mix hex.publish for the same version again. If you revert the last version, the package is deleted. Private packages can be modified and deleted at any time since those changes only affect the user’s own repository."
year_published = 2025
clearnet = "https://hex.pm/docs/faq"
