["https://hex.pm/policies/privacy"]
title = "Privacy Policy | Hex"
description = "A package manager for the Erlang ecosystem"
full_description = "We store information about access to and users on the hex.pm and hexdocs.pm website, the hex.pm API and repository. This data is stored in the US on Heroku and Amazon AWS servers. All requests to the hex.pm and hexdocs.pm websites are logged. The logs include information about the time the request was made and to which URL, the IP address it was from and browser user agent. The logged data is only available to hex.pm’s administrative team, but may be made available in aggregate and anonymized forms. The websites uses Google Analytics to monitor and analyze user behavior. This service provides hex.pm with information on users’ demographics, age, location, and interest categories, when such information is available. This information is not used to identify individual users, but can in some cases be very specific. You can learn more about the information gathered and retained by this service at the Google Analytics privacy policy. You can opt out of Google Analytics entirely with the Google Analytics opt-out browser addon. A cookie is a string of information that a website stores on a visitor’s computer, and that the visitor’s browser provides to the website each time the visitor returns. The websites uses cookies to help identify logged in users. Website visitors who do not wish to have cookies placed on their computers should not log in to the websites. A registered user is required to publish packages, to otherwise consume the API a user is not required. See the “User information” section below for more information about what user information is stored and is public. Packages published to hex.pm are public. Package metadata will be displayed on the hex.pm website and the full contents of the package will be available on the repository, as such care needs to be taken to not include private or confidential information in the package. Additionally, documentation that has been published to hex.pm will be displayed to the public on hexdocs.pm. Anything published to hex.pm should be seen as public immediately and forever, if credentials are accidentally published they should be changed immediately."
year_published = 2025
clearnet = "https://hex.pm/policies/privacy"
