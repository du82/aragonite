["https://hex.pm/docs/private"]
title = "Private packages | Hex"
description = "A package manager for the Erlang ecosystem"
full_description = 'With an organization you can publish and fetch private packages from Hex.pm and you can control exactly which users have access to the packages. To administer any organizations you are a member of go to the dashboard. Go to the sign up form to create an organization. The organization’s packages are namespaced under the organization’s repository. Only members of the organization have access to the repository’s packages, to get access in Mix you need to authorize the organization with the mix hex.organization task. Run the following command to do so: To run this command you need to have an authenticated user on your local machine, run $ mix hex.user register to register or $ mix hex.user auth to authenticate with an existing user. To publish a package simply to your organization add the --organization flag to the $ mix hex.publish --organization acme command. You can also configure a package to belong to a specific organization, add the organization: "acme" option to the package configuration: A private package can only depend on packages from its own repository and from the global "hexpm" repository where all public packages belong. You specify a package should be fetched from a specific organization’s repository with the :organization option on the dependency declaration, if this option is not included it is assumed the package belongs to the global repository. For example: You can generate repository authentication keys manually with the mix hex.organization key task. This can then be used to fetch packages on your CI servers without requiring manual authentication with username and password.'
year_published = 2025
