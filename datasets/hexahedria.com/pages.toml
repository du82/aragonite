full_description = "Squared 3.0 for Pebble Time Daniel D. Johnson • 2015-06-13 For a few years, I've had a Pebble, and I recently upgraded to a Pebble Time. So far I really like it: its more comfortable, it looks cooler, and it has a color display! However, my favorite watchface for Pebble (Squared by lastfuture) was only black-and-white, and it seemed like a waste to use a non-color watchface on my color Pebble. So, naturally, since the watchface was open-source and Pebble has great development tools, I was able to make a color version! I present, Squared 3.0: The code is available on GitHub, and you can download it from the Pebble App Store if you have a Pebble Time yourself. Enjoy! art clock Pebble time Uncategorized"
