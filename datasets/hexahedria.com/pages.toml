["https://hexahedria.com/2023/03/27/uncertain_simulators"]
title = "Uncertain Simulators Don't Always Simulate Uncertain Agents | Daniel D. Johnson"
description = "I argue that hallucinations are a natural consequence of the language modeling objective, which focuses on simulating confident behavior even when that behavior is hard to predict, rather than predictable behaviors that take uncertainty into account. I also discuss five strategies for avoiding this mismatch."
full_description = '''Uncertain Simulators Don't Always Simulate Uncertain Agents Daniel D. Johnson • 2023-03-27 Table of Contents What's the difference? A thought experiment Making a choice under uncertainty Predicting someone else's choice Language models are uncertain simulators How to mitigate the simulator-uncertainty gap Simulating a less-certain persona Simulating a persona that has access to external tools Starring: A Large Language Model As "A Large Language Model" Using the full distribution of possible outcomes Adapting a policy to its own uncertainty Why should we care about this? Uncertainty isn't going away Designing for uncertainty Appendix: Some related thoughts Goal-uncertainty and persona-uncertainty A possible alternative explanation for why chain-of-thought prompting works Mode collapse and miscalibration in fine-tuning Toolformer as a limited form of simulator-level tool use Is simulator uncertainty related to the asymmetry in the KL divergence? The DAgger problem and recovering from errors Robustly-simulatable personas "The world record for crossing the English Channel entirely on foot is held by Piotr Kurylo of Poland, who completed the crossing in 13 hours and 43 minutes on August 21, 2019. The English Channel is a body of water that separates England from France and is about 35km (22 miles) wide at its narrowest point. It is a popular route for swimmers, but crossing it entirely on foot is a much rarer feat." — ChatGPT 3.5 producing a hallucinatory response.1 Why do language models confidently state false information, make factual errors, and produce other "hallucinations"? In this post, I argue that this behavior is a natural consequence of the language modeling objective, which focuses on simulating confident behavior even when that behavior is hard to predict, rather than focusing on predictable behaviors that take uncertainty into account. I start by introducing the concepts of an "uncertain simulator" and a "simulation of an uncertain agent" using a thought experiment, and then draw connections between the "uncertain simulator" perspective and the way language models are trained. Next, I describe five general strategies for mitigating the counterintuitive behavior of an uncertain simulator: telling the model to simulate a less-certain persona, using the model to simulate a persona that has access to external tools, designing a new persona that matches the model, exploring the uncertainty in the simulation by drawing many samples, and adapting the model to its own behavior using on-policy fine-tuning. Finally, I conclude with some thoughts on why I think properly responding to uncertainty will be important for safely deploying language-model-based systems. 1 From this tweet by Riley Goodside in January 2023. This question was originally constructed by Douglas Hofstadter and David Bender. What's the difference? A thought experiment Let's begin with a thought experiment, to explain what I mean by an "uncertain simulator" and a "simulation of an uncertain agent". Suppose there's a game show, involving a stage with three boxes. The left two boxes are opaque. One of them contains $10,000, but the other is empty. The order of these two boxes is always random. The rightmost box is transparent, and contains $8,000. The three boxes and their contents. When participants go on stage, the host makes a decision: Sometimes, the host announces to everyone which box is which. Other times, the host whispers to the participant only, telling them which box is which but not revealing it to the audience. And in a few cases, the host remains silent, not telling anyone the contents of the boxes. Making a choice under uncertainty Let's imagine you are a participant in this game, and lucky for you, the host tells you which box is which. Naturally, the best strategy for you would be to pick the box with the $10,000. (It's not a very difficult game.) A participant choosing the leftmost box when the host says it contains the $10,000. Now suppose you go on stage, but the host doesn't tell you anything about the boxes. Which box should you pick now? If your goal is to maximize the amount of money you get, the best strategy would be to open the box on the right, since that guarantees that you get $8,000. The payoffs of the other two boxes are uncertain; you either get $10,000 or nothing, each with a 50% chance. A participant choosing the rightmost box when the host doesn't say anything. Predicting someone else's choice Now let's consider a slightly different situation. Suppose now that we are watching this game show on TV, and we're participating in an audience quiz. Our job is to take bets on which box the participant will take, and we are allowed to divide our bets across multiple boxes for a slightly lower payoff. If the host announces which box is which, and we know that those participants are trying to get the most money, this is pretty straightforward: we should predict fairly confidently that they open the box with $10,000. (Maybe we aren't 100% sure, because there's a small chance that they've misunderstood the rules, but I'll ignore that for now.) If the host doesn't say anything, we have to guess how the participant will behave in the presence of uncertainty. Again, if we know what the participant is trying to do, we will able to make a good guess: we can predict that they open the box with $8,000. I'll call this a simulation of an uncertain agent: a prediction about what someone would do if they were behaving rationally without having complete information. An audience member predicting what the participant will do in the two scenarios described above. But what happens if we see the host whisper the answer to the participant, but we can't hear what they say? An audience member predicting that the participant will take either the leftmost or middle box, with a 50% chance each. If we predicted that the participant would go to the rightmost box, we'd be wrong, because the participant knows which box is which! Our best prediction would be that there is a 50% chance of taking the leftmost box, and a 50% chance of taking the middle one. In this case, we are acting as uncertain simulators: we are trying to predict someone's behavior, but we don't have enough information to know what they will actually do. This can roughly be thought of as a reordering of expected value and maximum operators. Rational behavior under uncertainty can be formalized (decision-theoretically) as choosing the single action that maximizes expected future utility. On the other hand, predicting the behavior of a partially-observed rational agent could be modeled as estimating the probability that a particular action maximizes future utility (e.g. estimating the expected value of an indicator variable for each action). (Interestingly, regardless of which box they pick, we should also predict that they win $10,000. After all, that's why they picked that box!) The key difference between these two scenarios is who is uncertain about the boxes. If we are predicting the behavior of someone who doesn't know what's in the boxes (a simulation of an uncertain agent), we would predict them to act conservatively and avoid unknown risks. But if we are predicting the behavior of someone who does know what's in the boxes, but we don't see them ourselves (an uncertain simulator), we have to make a different prediction. Our best guess is that they will make a confident choice and be correct about it, but we can't determine specifically what choice they will make. And importantly, even though assigning 50% probability to the left two boxes is the best strategy for the audience member, it is NOT a good strategy for the participant. Under that strategy, half of the time the participant would end up with nothing!2 2 This is an instance of a general problem when applying imitation learning to POMDPs where the demonstrator has access to privileged information. In this setting, the goal of predicting the behavior of an expert is in direct conflict with the goal of performing well as a policy: improving the policy necessarily requires doing something that the expert would not do. Indeed, my example here is closely related to the previously-studied "tiger door" (Arora et al. 2018, Warrington et al. 2020), "poisoned door" (Weihs et al. 2021), and "prize-or-frog" Ortega et al. 2021) problems. Language models are uncertain simulators Language models are trained with prediction objectives: they are given a large corpus of text and learn to predict the next token (a word or part of a word) that will appear in a document, based on the tokens that have come before. As the models and their training corpora become larger, these models pick up an increasingly impressive ability to generate plausible text: they learn word correlations, grammar, and facts about the world, and develop the remarkable abilities to write poetry and fiction, tell jokes, passably play chess, write and debug code, "draw" pictures using SVG and TikZ, and achieve high marks across many standardized tests. It's tempting to anthropomorphize LLMs, to view them as individual agents making choices and having goals. But I think it's more accurate to view them as simulators, i.e. as systems that predict aspects of the world and in particular are trained to predict the behavior of many possible agents. (These ideas are explored in more detail in janus's post "Simulators", as well as in Jacob Andreas's paper "Language Models as Agent Models", which I found helpful in clarifying my own thoughts about the behavior of language models.) This is important when we try to understand why language models produce the kinds of errors that they do. Even the largest language models are limited in their memory and capacity, with a fixed amount of knowledge encoded in their weights and a fixed amount of computation occurring before predicting each token. This is in contrast to the true generating process of the text these models are trained on, which may have been originally written over many drafts with access to external knowledge, resources, and tools during the writing process.3 3 Note that, in practice, computational limits induce uncertainty in a similar way that truly missing information does. This is related to the idea of usable information under computational constraints, or \(\mathcal{V}\)-information (Xu et al. 2020). When we train a language model to predict the next token in a text sequence, we are thus putting it in an analogous situation to the audience member in our game show: the model must try to predict the behavior of an agent that has access to privileged information not available to the model. This works remarkably well much of the time, and the models seem to do a good job at predicting text even when that text involves people answering questions and acting in the world. But when the model encounters a situation it can't predict well, it has no incentive to express that uncertainty in its output! Instead, it is incentivized to divide its predictions across a set of responses that would be most likely in the training data.4 And since people on the internet are likely to write about things they know about already, the model may be able to predict that the answer is confident even if it cannot accurately predict what the answer actually is. 4 Specifically, this happens because language models are trained with the cross-entropy loss, which is a proper scoring rule. A language model guessing what an expert will say, without being able to predict the answer itself. In a sense, I think the overconfidence in the model's outputs arises as part of the sampling procedure rather than being directly encoded in the model. The language model itself might be perfectly well calibrated at the task it's been trained on, next token prediction, in the same way that an audience member predicting which box an expert will open would be well-calibrated by giving a 50% chance to each of the left two boxes. The key point is that sampling from a well-calibrated simulation under uncertainty does not produce a policy whose actions are well-calibrated under that uncertainty. Indeed, why should it? The training objective for the simulator doesn't care about the policy you get from sampling from the simulation. It only cares about the policies of the agents that generated the training data. How to mitigate the simulator-uncertainty gap Given a language model that has been trained as an uncertain simulator, how can we avoid overconfident behaviors in practice? Simulating a less-certain persona One simple strategy is to directly condition the simulator to simulate an uncertain agent. In short, we select a persona to simulate that does not "know" (or, rather, is not simulated as knowing) anything that the simulator doesn't know (or, rather, can't reliably simulate). I think this is essentially why "chain of thought" and "Let's think step by step" approaches5 are so effective at boosting reasoning ability: they condition the simulator to simulate a persona that reasons over small steps, each of which are individually easy to predict. 5 See for instance Wei et al. (2022), Kojima et al. (2022), and "Serializing Reasoning" from janus's "Methods of Prompt Programming". A language model predicting what a non-expert would do, in a situation where neither the model nor the persona being simulated knows the answer. A downside of this strategy is that it can be quite brittle; finding a persona that can be simulated well is often a matter of trial and error. Simulating a persona that has access to external tools A related strategy is to augment a language model with external tools, such as a calculator or a web browser. This is often done by prompting the model to tell it what tools are available, and then using wrapper logic to insert the output of each tool when used.6 Does this mean the model knows that it should choose to use tools when it doesn't know the answer? Not quite. I think it's more accurate to say that the model predicts that the character described in the text would use the tools, by predicting whether or not the character knows the answer. This often works, but only as long as the things the character doesn't know match the things the simulator can't predict! (An interesting observation about this strategy is that the model will happily simulate the output of the tool as well. After all, for the underlying simulator, this is just a text trace of a character using a tool, and it's job is to predict the text by simulating both the character and the tool.) 6 In previous works, language models have been connected up to calculators (Cobbe et al. 2021), Python interpreters (tweeted by Riley Goodside), physics simulators (Liu et al. 2022), Wikipedia search (Yao et al. 2022) and many others; see also the langchain library and ChatGPT plugin system. Interestingly, I think the approach in the recent Toolformer paper (Schick et al. 2023) works somewhat different'''
author = "Daniel D. Johnson"
year_published = 2023
