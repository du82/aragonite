["https://hexdocs.pm/mix/main/Mix.Tasks.Release.html"]
title = "mix release — Mix v1.19.0-dev"
full_description = '''Search documentation of Mix Settings mix release (Mix v1.19.0-dev) View Source Assembles a self-contained release for the current project:$ MIX_ENV=prod mix release $ MIX_ENV=prod mix release NAME Once a release is assembled, it can be packaged and deployed to a target, as long as the target runs on the same operating system (OS) distribution and version as the machine running the mix release command. Windows releases also require Microsoft Visual C++ Runtime.A release can be configured in your mix.exs file under the :releases key inside def project:def project do [ releases: [ demo: [ include_executables_for: [:unix], applications: [runtime_tools: :permanent] ], ... ] ] endYou can specify multiple releases where the key is the release name and the value is a keyword list with the release configuration. Releasing a certain name is done with:$ MIX_ENV=prod mix release demo If the given name does not exist, an error is raised.If mix release is invoked, without specifying a release name, and there are multiple releases configured, an error will be raised unless you set default_release: NAME at the root of your project configuration.If mix release is invoked and there are no releases configured, a release is assembled using the application name and default values. Why releases? Releases allow developers to precompile and package all of their code and the runtime into a single unit. The benefits of releases are:Code preloading. The VM has two mechanisms for loading code: interactive and embedded. By default, it runs in the interactive mode which dynamically loads modules when they are used for the first time. The first time your application calls Enum.map/2, the VM will find the Enum module and load it. There's a downside: when you start a new server in production, it may need to load many other modules, causing the first requests to have an unusual spike in response time. With releases, the system preloads all modules and guarantees your system is ready to handle requests after booting.Configuration and customization. Releases give developers fine grained control over system configuration and the VM flags used to start the system.Self-contained. A release does not require the source code to be included in your production artifacts. All of the code is precompiled and packaged. Releases do not even require Erlang or Elixir in your servers, as it includes the Erlang VM and its runtime by default. Furthermore, both Erlang and Elixir standard libraries are stripped to bring only the parts you are actually using.Multiple releases. You can assemble different releases with different configuration per application or even with different applications altogether.Management scripts. Releases come with scripts to start, restart, connect to the running system remotely, execute RPC calls, run as daemon, run as a Windows service, and more. Running the release Once a release is assembled, you can start it by calling bin/RELEASE_NAME start inside the release. In production, you would do:$ MIX_ENV=prod mix release $ _build/prod/rel/my_app/bin/my_app start bin/my_app start will start the system connected to the current standard input/output, where logs are also written to by default. This is the preferred way to run the system. Many tools, such as systemd, platforms as a service, such as Heroku, and many containers platforms, such as Docker, are capable of processing the standard input/output and redirecting the log contents elsewhere. Those tools and platforms also take care of restarting the system in case it crashes.You can also execute one-off commands, run the release as a daemon on Unix-like system, or install it as a service on Windows. We will take a look at those next. You can also list all available commands by invoking bin/RELEASE_NAME. One-off commands (eval and rpc) If you want to invoke specific modules and functions in your release, you can do so in two ways: using eval or rpc.$ bin/RELEASE_NAME eval "IO.puts(:hello)" $ bin/RELEASE_NAME rpc "IO.puts(:hello)" The eval command starts its own instance of the VM but without starting any of the applications in the release and without starting distribution. For example, if you need to do some prep work before running the actual system, like migrating your database, eval can be a good fit. Just keep in mind any application you may use during eval has to be explicitly started.You can start an application by calling Application.ensure_all_started/1. From Elixir v1.16, it is guaranteed the applications have been at least loaded. In earlier versions, if you needed to load applications but not start them, you also needed to call Application.load/1.Another way to run commands is with rpc, which will connect to the system currently running and instruct it to execute the given expression. This means you need to guarantee the system was already started and be careful with the instructions you are executing. You can also use remote to connect a remote IEx session to the system.Helper moduleAs you operate your system, you may find yourself running some piece of code as a one-off command quite often. You may consider creating a module to group these tasks:# lib/my_app/release_tasks.ex defmodule MyApp.ReleaseTasks do def eval_purge_stale_data() do # Eval commands needs to start the app before # Or Application.load(:my_app) if you can't start it Application.ensure_all_started(:my_app) # Code that purges stale data ... end def rpc_print_connected_users() do # Code that print users connected to the current running system ... end endIn the example above, we prefixed the function names with the command name used to execute them, but that is entirely optional.And to run them:$ bin/RELEASE_NAME eval "MyApp.ReleaseTasks.eval_purge_stale_data()" $ bin/RELEASE_NAME rpc "MyApp.ReleaseTasks.rpc_print_connected_users()" Daemon mode (Unix-like) You can run the release in daemon mode with the command:$ bin/RELEASE_NAME daemon In daemon mode, the system is started on the background via run_erl. You may also want to enable :heart in daemon mode so it automatically restarts the system in case of crashes. See the generated releases/RELEASE_VSN/env.sh file.The daemon will write all of its standard output to the "tmp/log/" directory in the release root. You can watch the log file by doing tail -f tmp/log/erlang.log.1 or similar. Once files get too large, the index suffix will be incremented. A developer can also attach to the standard input of the daemon by invoking "to_erl tmp/pipe/" from the release root. However, note that attaching to the system should be done with extreme care, since the usual commands for exiting an Elixir system, such as hitting Ctrl+C twice or Ctrl+\, will actually shut down the daemon. Therefore, using bin/RELEASE_NAME remote should be preferred, even in daemon mode.You can customize the tmp directory used both for logging and for piping in daemon mode by setting the RELEASE_TMP environment variable. See the "Customization" section. Services mode (Windows) While daemons are not available on Windows, it is possible to install a released system as a service on Windows with the help of erlsrv. This can be done by running:$ bin/RELEASE_NAME install Once installed, the service must be explicitly managed via the erlsrv executable, which is included in the erts-VSN/bin directory. The service is not started automatically after installing.For example, if you have a release named demo, you can install the service and then start it from the release root as follows:$ bin/demo install $ erts-VSN/bin/erlsrv.exe start demo_demo The name of the service is demo_demo because the name is built by concatenating the node name with the release name. Since Elixir automatically uses the same name for both, the service will be referenced as demo_demo.The install command must be executed as an administrator. bin/RELEASE_NAME commands The following commands are supported by bin/RELEASE_NAME:start Starts the system start_iex Starts the system with IEx attached daemon Starts the system as a daemon (Unix-like only) daemon_iex Starts the system as a daemon with IEx attached (Unix-like only) install Installs this system as a Windows service (Windows only) eval "EXPR" Executes the given expression on a new, non-booted system rpc "EXPR" Executes the given expression remotely on the running system remote Connects to the running system via a remote shell restart Restarts the running system via a remote command stop Stops the running system via a remote command pid Prints the operating system PID of the running system via a remote command version Prints the release name and version to be booted Deployments Requirements A release is built on a host, a machine which contains Erlang, Elixir, and any other dependencies needed to compile your application. A release is then deployed to a target, potentially the same machine as the host, but usually separate, and often there are many targets (either multiple instances, or the release is deployed to heterogeneous environments).To deploy straight from a host to a separate target, the following must be the same between the host and the target:Target architecture (for example, x86_64 or ARM)Target vendor + operating system (for example, Windows, Linux, or Darwin/macOS)Target ABI (for example, musl or gnu)This is often represented in the form of target triples, for example, x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl, x86_64-apple-darwin. If you are building on a MacBook (x86_64-apple-darwin) and trying to deploy to a typical Ubuntu machine (x86_64-unknown-linux-gnu), the release will not work. Instead you should build the release on a x86_64-unknown-linux-gnu host.Typically, different versions of Erlang VM and Elixir are available for different targets via package managers, precompiled artifacts, and similar. However, to deploy from a host to a separate target, you must also guarantee that any dependency with NIFs (Natively-Implemented Functions) are compiled for the same triplet. As we will see, this can be done in different ways, such as releasing on the target itself, or by using virtual machines or containers, usually as part of your release pipeline.In addition to matching the target triple, it is also important that the target has all of the system packages that your application will need at runtime. A common one is the need for OpenSSL when building an application that uses :crypto or :ssl, which is dynamically linked to the Erlang VM. Project dependencies containing NIFs (natively-implemented functions) may also dynamically link to system libraries, so check those accordingly.Of course, some operating systems and package managers can differ between versions, so if your goal is to have full compatibility between host and target, it is best to ensure the operating system and system package manager have the same versions on host and target. This may even be a requirement in some systems, especially so with package managers that try to create fully reproducible environments (Nix, Guix). Using matching host and target There are a couple of ways to guarantee that a release is built on a host with the same properties as the target. A simple option is to fetch the source, compile the code and assemble the release on the target itself. It would be something like this:$ git clone remote://path/to/my_app.git my_app_source $ cd my_app_source $ mix deps.get --only prod $ MIX_ENV=prod mix release $ _build/prod/rel/my_app/bin/my_app start If you prefer, you can also compile the release to a separate directory, so you can erase all source after the release is assembled:$ git clone remote://path/to/my_app.git my_app_source $ cd my_app_source $ mix deps.get --only prod $ MIX_ENV=prod mix release --path ../my_app_release $ cd ../my_app_release $ rm -rf ../my_app_source $ bin/my_app start However, this option can be expensive if you have multiple production nodes or if the release assembling process is a long one, as each node needs to individually assemble the release.You can automate this process in a couple different ways. One option is to make it part of your Continuous Integration (CI) / Continuous Deployment (CD) pipeline. When you have a CI/CD pipeline, it is common that the machines in your CI/CD pipeline run on the exact same target triple as your production servers (if they don't, they should). In this case, you can assemble the release at the end of your CI/CD pipeline by calling MIX_ENV=prod mix release and push the artifact to S3 or any other network storage. To perform the deployment, your production machines can fetch the deployment from the network storage and run bin/my_app start. Using images Another mechanism to automate deployments is to use images, such as Amazon Machine Images, or container platforms, such as Docker. For instance, you can use Docker to run locally a system with the exact same target triple as your production servers. Inside the container, you can invoke MIX_ENV=prod mix release and build a complete image and/or container with the operating system, all dependencies as well as the releases.However, when building such images on your machine, those technologies use emulation which may not interplay well with Erlang VM's JIT (just-in time) compiler. To address this, you can set this environment variable on your build stage:ENV ERL_AFLAGS "+JMsingle true" Shutting down Once a system is deployed, shutting down the system can be done by sending SIGINT/SIGTERM to the system, which is what most containers, platforms and tools do, or by explicitly invoking bin/RELEASE_NAME stop. Once the system receives the shutdown request, each application and their respective supervision trees will stop, one by one, in the opposite order that they were started. Customization There are a couple ways in which developers can customize the generated artifacts inside a release. Options The following options can be set inside your mix.exs on each release definition::applications - a keyword list with application names as keys and their mode as value. By default :applications includes the current application and all applications the current application depends on, recursively. You can include new applications or change the mode of existing ones by listing them here.The order of the applications given will be preserved as much as possible, with only :kernel, :stdlib, :sasl, and :elixir listed before the given application list. The supported values are::permanent (default) - the application is started and the node shuts down if the application terminates, regardless of reason:transient - the application is started and the node shuts down if the application terminates abnormally:temporary - the application is started and the node does not shut down if the application terminates:load - the application is only loaded:none - the application is part of the release but it is neither loaded nor startedIf you change the mode of an application, the mode will apply to all its child applicati'''
year_published = 2025
clearnet = "https://hexdocs.pm/mix/main/Mix.Tasks.Release.html"
