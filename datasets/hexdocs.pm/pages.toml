external-references = ["elixir-lang.org", "erlang.org", "github.com", "help.github.com", "hex.pm"]

["https://hexdocs.pm/elixir/main/Kernel.SpecialForms.html"]
title = "Kernel.SpecialForms — Elixir v1.19.0-dev"
description = """
Functions
  
      %struct{}
  
    Matches on or builds a struct.

      %{}
  
    Creates a map.

      &expr
  
    Capture operator. Captures or creates an anonymous function.

      left . right
  
    Dot operator. Defines a remote call, a call to an anonymous function, or an alias.

      __aliases__(args)
  
    Internal special form to hold aliases information.

      __block__(args)
  
    Internal special form for block expressions.

      __CALLER__
  
    Returns the current calling environment as a Macro.Env struct.

      __cursor__(args)
  
    Internal special form for cursor position.

      __DIR__
  
    Returns the absolute path of the directory of the current file as a binary.

      __ENV__
  
    Returns the current environment information as a Macro.Env struct.

      __MODULE__
  
    Returns the current module name as an atom or nil otherwise.

      __STACKTRACE__
  
    Returns the stacktrace for the currently handled exception.

      left :: right
  
    Type operator. Used by types and bitstrings to specify types.

      <<args>>
  
    Defines a new bitstring.

      left = right
  
    Match operator. Matches the value on the right against the pattern on the left.

      alias(module, opts)
  
    alias/2 is used to set up aliases, often useful with modules' names.

      case(condition, clauses)
  
    Matches the given expression against the given clauses.

      cond(clauses)
  
    Evaluates the expression corresponding to the first clause that
evaluates to a truthy value.

      fn(clauses)
  
    Defines an anonymous function.

      for(args)
  
    Comprehensions allow you to quickly build a data structure from
an enumerable or a bitstring.

      import(module, opts)
  
    Imports functions and macros from other modules.

      quote(opts, block)
  
    Gets the representation of any expression.

      receive(args)
  
    Checks if there is a message matching any of the given clauses in the current
process mailbox.

      require(module, opts)
  
    Requires a module in order to use its macros.

      super(args)
  
    Calls the overridden function when overriding it with Kernel.defoverridable/1.

      try(args)
  
    Evaluates the given expressions and handles any error, exit,
or throw that may have happened.

      unquote(expr)
  
    Unquotes the given expression inside a quoted expression.

      unquote_splicing(expr)
  
    Unquotes the given list expanding its arguments.

      with(args)
  
    Combine matching clauses.

      ^var
  
    Pin operator. Accesses an already bound variable in match clauses.

      {args}
  
    Creates a tuple."""
full_description = '''Search documentation of Elixir Settings Kernel.SpecialForms (Elixir v1.19.0-dev) View Source Special forms are the basic building blocks of Elixir, and therefore cannot be overridden by the developer.The Kernel.SpecialForms module consists solely of macros that can be invoked anywhere in Elixir code without the use of the Kernel.SpecialForms. prefix. This is possible because they all have been automatically imported, in the same fashion as the functions and macros from the Kernel module.These building blocks are defined in this module. Some of these special forms are lexical (such as alias/2 and case/2). The macros {}/1 and <<>>/1 are also special forms used to define tuple and binary data structures respectively.This module also documents macros that return information about Elixir's compilation environment, such as (__ENV__/0, __MODULE__/0, __DIR__/0, __STACKTRACE__/0, and __CALLER__/0).Additionally, it documents two special forms, __block__/1 and __aliases__/1, which are not intended to be called directly by the developer but they appear in quoted contents since they are essential in Elixir's constructs. Summary Functions %struct{} Matches on or builds a struct. %{} Creates a map. &expr Capture operator. Captures or creates an anonymous function. left . right Dot operator. Defines a remote call, a call to an anonymous function, or an alias. __aliases__(args) Internal special form to hold aliases information. __block__(args) Internal special form for block expressions. __CALLER__ Returns the current calling environment as a Macro.Env struct. __cursor__(args) Internal special form for cursor position. __DIR__ Returns the absolute path of the directory of the current file as a binary. __ENV__ Returns the current environment information as a Macro.Env struct. __MODULE__ Returns the current module name as an atom or nil otherwise. __STACKTRACE__ Returns the stacktrace for the currently handled exception. left :: right Type operator. Used by types and bitstrings to specify types. <<args>> Defines a new bitstring. left = right Match operator. Matches the value on the right against the pattern on the left. alias(module, opts) alias/2 is used to set up aliases, often useful with modules' names. case(condition, clauses) Matches the given expression against the given clauses. cond(clauses) Evaluates the expression corresponding to the first clause that evaluates to a truthy value. fn(clauses) Defines an anonymous function. for(args) Comprehensions allow you to quickly build a data structure from an enumerable or a bitstring. import(module, opts) Imports functions and macros from other modules. quote(opts, block) Gets the representation of any expression. receive(args) Checks if there is a message matching any of the given clauses in the current process mailbox. require(module, opts) Requires a module in order to use its macros. super(args) Calls the overridden function when overriding it with Kernel.defoverridable/1. try(args) Evaluates the given expressions and handles any error, exit, or throw that may have happened. unquote(expr) Unquotes the given expression inside a quoted expression. unquote_splicing(expr) Unquotes the given list expanding its arguments. with(args) Combine matching clauses. ^var Pin operator. Accesses an already bound variable in match clauses. {args} Creates a tuple. Functions %struct{} (macro) Matches on or builds a struct.A struct is a tagged map that allows developers to provide default values for keys, tags to be used in polymorphic dispatches and compile time assertions.Structs are usually defined with the Kernel.defstruct/1 macro:defmodule User do defstruct name: "john", age: 27 endNow a struct can be created as follows:%User{}Underneath a struct is a map with a :__struct__ key pointing to the User module, where the keys are validated at compile-time:%User{} == %{__struct__: User, name: "john", age: 27}The struct fields can be given when building the struct:%User{age: 31} #=> %{__struct__: User, name: "john", age: 31}Or also on pattern matching to extract values out:%User{age: age} = userThe advantage of structs is that they validate that the given keys are part of the defined struct. The example below will fail because there is no key :full_name in the User struct:%User{full_name: "john doe"}The map update syntax can also be used for updating structs:%{user | age: 28} Pattern matching on struct names Besides allowing pattern matching on struct fields, such as:%User{age: age} = userStructs also allow pattern matching on the struct name:%struct_name{} = user struct_name #=> UserYou can also assign the struct name to _ when you want to check if something is a struct but you are not interested in its name:%_{} = user %{} (macro) Creates a map.See the Map module for more information about maps, their syntax, and ways to access and manipulate them. AST representation Regardless of whether => or the keyword syntax is used, key-value pairs in maps are always represented internally as a list of two-element tuples for simplicity:iex> quote do ...> %{"a" => :b, c: :d} ...> end {:%{}, [], [{"a", :b}, {:c, :d}]} &expr (macro) Capture operator. Captures or creates an anonymous function. Capture The capture operator is most commonly used to capture a function with given name and arity from a module:iex> fun = &Kernel.is_atom/1 iex> fun.(:atom) true iex> fun.("string") falseIn the example above, we captured Kernel.is_atom/1 as an anonymous function and then invoked it.The capture operator can also be used to capture local functions, including private ones, and imported functions by omitting the module name:&local_function/1Note that &local_function/1 creates a local capture, but &__MODULE__.local_function/1 or &imported_function/1 create a remote capture. For more information, refer to the "Functions" section in the Erlang Reference Manual.Whether a capture is local or remote has implications when using hot code reloading: local captures dispatch to the version of the module that existed at the time they were created, while remote captures dispatch to the current version of the module.See also Function.capture/3. Anonymous functions The capture operator can also be used to partially apply functions, where &1, &2 and so on can be used as value placeholders. For example:iex> double = &(&1 * 2) iex> double.(2) 4In other words, &(&1 * 2) is equivalent to fn x -> x * 2 end.We can partially apply a remote function with placeholder:iex> take_five = &Enum.take(&1, 5) iex> take_five.(1..10) [1, 2, 3, 4, 5]Another example while using an imported or local function:iex> first_elem = &elem(&1, 0) iex> first_elem.({0, 1}) 0The & operator can be used with more complex expressions:iex> fun = &(&1 + &2 + &3) iex> fun.(1, 2, 3) 6As well as with lists and tuples:iex> fun = &{&1, &2} iex> fun.(1, 2) {1, 2} iex> fun = &[&1 | &2] iex> fun.(1, [2, 3]) [1, 2, 3]The only restrictions when creating anonymous functions is that at least one placeholder must be present, i.e. it must contain at least &1, and that block expressions are not supported:# No placeholder, fails to compile. &(:foo) # Block expression, fails to compile. &(&1; &2) left . right (macro) Dot operator. Defines a remote call, a call to an anonymous function, or an alias.The dot (.) in Elixir can be used for remote calls:iex> String.downcase("FOO") "foo"In this example above, we have used . to invoke downcase in the String module, passing "FOO" as argument.The dot may be used to invoke anonymous functions too:iex> (fn n -> n end).(7) 7in which case there is a function on the left hand side.We can also use the dot for creating aliases:iex> Hello.World Hello.WorldThis time, we have joined two aliases, defining the final alias Hello.World. Syntax The right side of . may be a word starting with an uppercase letter, which represents an alias, a word starting with lowercase or underscore, any valid language operator or any name wrapped in single- or double-quotes. Those are all valid examples:iex> Kernel.Sample Kernel.Sample iex> Kernel.length([1, 2, 3]) 3 iex> Kernel.+(1, 2) 3 iex> Kernel."+"(1, 2) 3Wrapping the function name in single- or double-quotes is always a remote call. Therefore Kernel."Foo" will attempt to call the function "Foo" and not return the alias Kernel.Foo. This is done by design as module names are more strict than function names.When the dot is used to invoke an anonymous function there is only one operand, but it is still written using a postfix notation:iex> negate = fn n -> -n end iex> negate.(7) -7 Quoted expression When . is used, the quoted expression may take two distinct forms. When the right side starts with a lowercase letter (or underscore):iex> quote do ...> String.downcase("FOO") ...> end {{:., [], [{:__aliases__, [alias: false], [:String]}, :downcase]}, [], ["FOO"]}Note that we have an inner tuple, containing the atom :. representing the dot as first element:{:., [], [{:__aliases__, [alias: false], [:String]}, :downcase]}This tuple follows the general quoted expression structure in Elixir, with the name as first argument, some keyword list as metadata as second, and the list of arguments as third. In this case, the arguments are the alias String and the atom :downcase. The second argument in a remote call is always an atom.In the case of calls to anonymous functions, the inner tuple with the dot special form has only one argument, reflecting the fact that the operator is unary:iex> quote do ...> negate.(0) ...> end {{:., [], [{:negate, [], __MODULE__}]}, [], [0]}When the right side is an alias (i.e. starts with uppercase), we get instead:iex> quote do ...> Hello.World ...> end {:__aliases__, [alias: false], [:Hello, :World]}We go into more details about aliases in the __aliases__/1 special form documentation. Unquoting We can also use unquote to generate a remote call in a quoted expression:iex> x = :downcase iex> quote do ...> String.unquote(x)("FOO") ...> end {{:., [], [{:__aliases__, [alias: false], [:String]}, :downcase]}, [], ["FOO"]}Similar to Kernel."FUNCTION_NAME", unquote(x) will always generate a remote call, independent of the value of x. To generate an alias via the quoted expression, one needs to rely on Module.concat/2:iex> x = Sample iex> quote do ...> Module.concat(String, unquote(x)) ...> end {{:., [], [{:__aliases__, [alias: false], [:Module]}, :concat]}, [], [{:__aliases__, [alias: false], [:String]}, Sample]} __aliases__(args) (macro) Internal special form to hold aliases information.It is usually compiled to an atom:iex> quote do ...> Foo.Bar ...> end {:__aliases__, [alias: false], [:Foo, :Bar]}Elixir represents Foo.Bar as __aliases__ so calls can be unambiguously identified by the operator :.. For example:iex> quote do ...> Foo.bar() ...> end {{:., [], [{:__aliases__, [alias: false], [:Foo]}, :bar]}, [], []}Whenever an expression iterator sees a :. as the tuple key, it can be sure that it represents a call and the second argument in the list is an atom.On the other hand, aliases hold some properties:The head element of aliases can be any term that must expand to an atom at compilation time.The tail elements of aliases are guaranteed to always be atoms.When the head element of aliases is the atom :Elixir, no expansion happens. __block__(args) (macro) Internal special form for block expressions.This is the special form used whenever we have a block of expressions in Elixir. This special form is private and should not be invoked directly:iex> quote do ...> 1 ...> 2 ...> 3 ...> end {:__block__, [], [1, 2, 3]} __CALLER__ (macro) Returns the current calling environment as a Macro.Env struct.In the environment you can access the filename, line numbers, set up aliases, the function and others. __cursor__(args) (macro) Internal special form for cursor position.This is the special form used whenever we need to represent the cursor position in Elixir's AST. See Code.Fragment for more information. __DIR__ (macro) Returns the absolute path of the directory of the current file as a binary.Although the directory can be accessed as Path.dirname(__ENV__.file), this macro is a convenient shortcut. __ENV__ (macro) Returns the current environment information as a Macro.Env struct.In the environment you can access the current filename, line numbers, set up aliases, the current function and others. __MODULE__ (macro) Returns the current module name as an atom or nil otherwise.Although the module can be accessed in the __ENV__/0, this macro is a convenient shortcut. __STACKTRACE__ (since 1.7.0) (macro) Returns the stacktrace for the currently handled exception.It is available only in the catch and rescue clauses of try/1 expressions.To retrieve the stacktrace of the current process, use Process.info(self(), :current_stacktrace) instead. left :: right (macro) Type operator. Used by types and bitstrings to specify types.This operator is used in two distinct occasions in Elixir. It is used in typespecs to specify the type of a variable, function or of a type itself:@type number :: integer | float @spec add(number, number) :: numberIt may also be used in bit strings to specify the type of a given bit segment:<<int::integer-little, rest::bits>> = bitsRead the documentation on the Typespecs page and <<>>/1 for more information on typespecs and bitstrings respectively. <<args>> (macro) Defines a new bitstring. Examples iex> <<1, 2, 3>> <<1, 2, 3>> Types A bitstring is made of many segments and each segment has a type. There are 9 types used in bitstrings:integerfloatbits (alias for bitstring)bitstringbinarybytes (alias for binary)utf8utf16utf32When no type is specified, the default is integer:iex> <<1, 2, 3>> <<1, 2, 3>>Elixir also accepts by default the segment to be a literal string which expands to integers:iex> <<0, "foo">> <<0, 102, 111, 111>>You can use one of utf8 (the default), utf16, and utf32 to control how the string is encoded:iex> <<"foo"::utf16>> <<0, 102, 0, 111, 0, 111>>Which is equivalent to writing:iex> <<?f::utf16, ?o::utf16, ?o::utf16>> <<0, 102, 0, 111, 0, 111>>At runtime, binaries need to be explicitly tagged as binary:iex> rest = "oo" iex> <<102, rest::binary>> "foo"Otherwise we get an ArgumentError when constructing the binary:rest = "oo" <<102, rest>> ** (ArgumentError) argument error Options Many options can be given by using - as separator. Order is arbitrary, so the following are all equivalent:<<102::integer-native, rest::binary>> <<102::native-integer, rest::binary>> <<102::unsigned-big-integer, rest::binary>> <<102::unsigned-big-integer-size(8), rest::binary>> <<102::unsigned-big-integer-8, rest::binary>> <<102::8-integer-big-unsigned, rest::binary>> <<102, rest::binary>> Unit and Size The length of the match is equal to the unit (a number of bits) times the size (the number of repeated segments of length unit).TypeDefault Unitinteger1 bitfloat1 bitbinary8 bitsSizes for types are a bit more nuanced. The default size for integers is 8.For floats, it is 64. For floats, size * unit must result in 16, 32, or 64, corr'''
year_published = 2025
