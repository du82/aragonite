["https://hexdocs.pm/elixir/main/optional-syntax.html"]
title = "Optional syntax sheet — Elixir v1.19.0-dev"
full_description = '''Search documentation of Elixir Settings Optional syntax sheet View Source In the previous chapters, we learned that the Elixir syntax allows developers to omit delimiters in a few occasions to make code more readable. For example, we learned that parentheses are optional:iex> length([1, 2, 3]) == length [1, 2, 3] trueand that do-end blocks are equivalent to keyword lists:# do-end blocks iex> if true do ...> :this ...> else ...> :that ...> end :this # keyword lists iex> if true, do: :this, else: :that :thisKeyword lists use Elixir's regular notation for separating arguments, where we separate each key-value pair with commas, and each key is followed by :. In the do-blocks, we get rid of the colons, the commas, and separate each keyword by a newline. They are useful exactly because they remove the verbosity when writing blocks of code. Most of the time, we use the block syntax, but it is good to know they are equivalent.Those conveniences, which we call here "optional syntax", allow the language syntax core to be small, without sacrificing the readability and expressiveness of your code. In this brief chapter, we will review the four rules provided by the language, using a short snippet as playground. Walk-through Take the following code:if variable? do Call.this() else Call.that() endNow let's remove the conveniences one by one:do-end blocks are equivalent to keywords:if variable?, do: Call.this(), else: Call.that()Keyword lists as last argument do not require square brackets, but let's add them:if variable?, [do: Call.this(), else: Call.that()]Keyword lists are the same as lists of two-element tuples:if variable?, [{:do, Call.this()}, {:else, Call.that()}]Finally, parentheses are optional on function calls, but let's add them:if(variable?, [{:do, Call.this()}, {:else, Call.that()}])That's it! Those four rules outline the optional syntax available in Elixir.To understand why these rules matter, we can briefly compare Elixir with many other programming languages. Most programming languages have several keywords for defining methods, functions, conditionals, loops, and so forth. Each of those keywords have their own syntax rules attached to them.However, in Elixir, none of these language features require special "keywords", instead they all build from this small set of rules. The other benefit is that developers can also extend the language in a way that is consistent with the language itself, since the constructs for designing and extending the language are the same. We further explore this topic in the "Meta-programming" guide.At the end of the day, those rules are what enables us to write:defmodule Math do def add(a, b) do a + b end endinstead of:defmodule(Math, [ {:do, def(add(a, b), [{:do, a + b}])} ])Whenever you have any questions, this quick walk-through has you covered.Finally, if you are concerned about when to apply these rules, it's worth noting that the Elixir formatter handles those concerns for you. Most Elixir developers use the mix format task to format their codebases according to a well-defined set of rules defined by the Elixir team and the community. For instance, mix format will always add parentheses to function calls unless explicitly configured not to do so. This helps to maintain consistency across all codebases within organizations and the wider community. ← Previous Page Writing documentation Next Page → Erlang libraries Search HexDocs Download ePub version Built using ExDoc (v0.37.2) for the Elixir programming language'''
year_published = 2025
clearnet = "https://hexdocs.pm/elixir/main/optional-syntax.html"
tags = ["blocks", "documentation", "elixir", "erlang", "language", "libraries", "lists", "optional", "rules", "sheet"]
language = "en"
internal-references = ["none"]
external-references = ["elixir-lang.org", "erlang.org", "github.com", "help.github.com", "hex.pm"]

["https://hexdocs.pm/hex/Mix.Tasks.Hex.Publish.html"]
title = "mix hex.publish — Hex v2.0.6"
full_description = '''Settings View Source mix hex.publish (Hex v2.0.6) Publishes a new version of the package.$ mix hex.publish The current authenticated user will be the package owner. Only package owners can publish the package, new owners can be added with the mix hex.owner task.Packages and documentation sizes are limited to 8mb compressed, and 64mb uncompressed. publishing-documentation Publishing documentation Documentation will be generated by running the mix docs task. ex_doc provides this task by default, but any library can be used. Or an alias can be used to extend the documentation generation. The expected result of the task is the generated documentation located in the doc/ directory with an index.html file.The documentation will be accessible at https://hexdocs.pm/my_package/1.0.0, https://hexdocs.pm/my_package will always redirect to the latest published version.Documentation will be built and published automatically. To publish a package without documentation run mix hex.publish package or to only publish documentation run mix hex.publish docs. reverting-a-package Reverting a package A new package can be reverted or updated within 24 hours of it's initial publish, a new version of an existing package can be reverted or updated within one hour. Documentation have no limitations on when it can be updated.To update the package simply run the mix hex.publish task again. To revert run mix hex.publish --revert VERSION or to only revert the documentation run mix hex.publish docs --revert VERSION.If the last version is reverted, the package is removed. command-line-options Command line options --organization ORGANIZATION - Set this for private packages belonging to an organization--yes - Publishes the package without any confirmation prompts--dry-run - Builds package and performs local checks without publishing, use mix hex.build --unpack to inspect package contents before publishing--replace - Allows overwriting an existing package version if it exists. Private packages can always be overwritten, public packages can only be overwritten within one hour after they were initially published.--revert VERSION - Revert given version. If the last version is reverted, the package is removed. configuration Configuration :app - Package name (required).:version - Package version (required).:deps - List of package dependencies (see Dependencies below).:description - Short description of the project.:package - Hex specific configuration (see Package configuration below). dependencies Dependencies Dependencies are defined in mix's dependency format. But instead of using :git or :path as the SCM :package is used.defp deps() do [ {:ecto, "~> 0.1.0"}, {:postgrex, "~> 0.3.0"}, {:cowboy, github: "extend/cowboy"} ] endAs can be seen Hex package dependencies works alongside git dependencies. Important to note is that non-Hex dependencies will not be used during dependency resolution and neither will they be listed as dependencies of the package. package-configuration Package configuration Additional metadata of the package can optionally be defined, but it is very recommended to do so.:name - Set this if the package name is not the same as the application name.:files - List of files and directories to include in the package, can include wildcards. Defaults to ["lib", "priv", ".formatter.exs", "mix.exs", "README*", "readme*", "LICENSE*", "license*", "CHANGELOG*", "changelog*", "src", "c_src", "Makefile*"].:exclude_patterns - List of patterns matching files and directories to exclude from the package.:licenses - List of licenses used by the package.:links - Map of links relevant to the package.:build_tools - List of build tools that can build the package. Hex will try to automatically detect the build tools based on the files in the package. If a rebar or rebar.config file is present Hex will mark it as able to build with rebar. This detection can be overridden by setting this field. Search HexDocs Download ePub version Built using ExDoc (v0.29.1) for the Elixir programming language'''
year_published = 2025
clearnet = "https://hexdocs.pm/hex/Mix.Tasks.Hex.Publish.html"
