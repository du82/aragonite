      definition()"""
full_description = '''Search documentation of Elixir Settings Module behaviour (Elixir v1.19.0-dev) View Source Provides functions to deal with modules during compilation time.It allows a developer to dynamically add, delete and register attributes, attach documentation and so forth.After a module is compiled, using many of the functions in this module will raise errors, since it is out of their scope to inspect runtime data. Most of the runtime data can be inspected via the __info__/1 function attached to each compiled module. Module attributes Each module can be decorated with one or more attributes. The following ones are currently defined by Elixir: @after_compile A hook that will be invoked right after the current module is compiled. Accepts a module or a {module, function_name}. See the "Compile callbacks" section below. @after_verify (since v1.14.0) A hook that will be invoked right after the current module is verified for undefined functions, deprecations, etc. Accepts a module or a {module, function_name}. See the "Compile callbacks" section below. @before_compile A hook that will be invoked before the module is compiled. Accepts a module or a {module, function_or_macro_name} tuple. See the "Compile callbacks" section below. @behaviour Note the British spelling!Behaviours can be referenced by modules to ensure they implement required specific function signatures defined by @callback.For example, you could specify a URI.Parser behaviour as follows:defmodule URI.Parser do @doc "Defines a default port" @callback default_port() :: integer @doc "Parses the given URL" @callback parse(uri_info :: URI.t()) :: URI.t() endAnd then a module may use it as:defmodule URI.HTTP do @behaviour URI.Parser def default_port(), do: 80 def parse(info), do: info endIf the behaviour changes or URI.HTTP does not implement one of the callbacks, a warning will be raised.For detailed documentation, see the behaviour typespec documentation. @impl (since v1.5.0) To aid in the correct implementation of behaviours, you may optionally declare @impl for implemented callbacks of a behaviour. This makes callbacks explicit and can help you to catch errors in your code. The compiler will warn in these cases:if you mark a function with @impl when that function is not a callback.if you don't mark a function with @impl when other functions are marked with @impl. If you mark one function with @impl, you must mark all other callbacks for that behaviour as @impl.@impl works on a per-context basis. If you generate a function through a macro and mark it with @impl, that won't affect the module where that function is generated in.@impl also helps with maintainability by making it clear to other developers that the function is implementing a callback.Using @impl, the example above can be rewritten as:defmodule URI.HTTP do @behaviour URI.Parser @impl true def default_port(), do: 80 @impl true def parse(info), do: info endYou may pass either false, true, or a specific behaviour to @impl.defmodule Foo do @behaviour Bar @behaviour Baz # Will warn if neither Bar nor Baz specify a callback named bar/0. @impl true def bar(), do: :ok # Will warn if Baz does not specify a callback named baz/0. @impl Baz def baz(), do: :ok endThe code is now more readable, as it is now clear which functions are part of your API and which ones are callback implementations. To reinforce this idea, @impl true automatically marks the function as @doc false, disabling documentation unless @doc is explicitly set. @compile Defines options for module compilation. This is used to configure both Elixir and Erlang compilers, as any other compilation pass added by external tools. For example:defmodule MyModule do @compile {:inline, my_fun: 1} def my_fun(arg) do to_string(arg) end endMultiple uses of @compile will accumulate instead of overriding previous ones. See the "Compile options" section below. @deprecated (since v1.6.0) Provides the deprecation reason for a function. For example:defmodule Keyword do @deprecated "Use Kernel.length/1 instead" def size(keyword) do length(keyword) end endThe Mix compiler automatically looks for calls to deprecated modules and emit warnings during compilation.Using the @deprecated attribute will also be reflected in the documentation of the given function and macro. You can choose between the @deprecated attribute and the documentation metadata to provide hard-deprecations (with warnings) and soft-deprecations (without warnings):This is a soft-deprecation as it simply annotates the documentation as deprecated:@doc deprecated: "Use Kernel.length/1 instead" def size(keyword)This is a hard-deprecation as it emits warnings and annotates the documentation as deprecated:@deprecated "Use Kernel.length/1 instead" def size(keyword)Currently @deprecated only supports functions and macros. However you can use the :deprecated key in the annotation metadata to annotate the docs of modules, types and callbacks too.We recommend using this feature with care, especially library authors. Deprecating code always pushes the burden towards library users. We also recommend for deprecated functionality to be maintained for long periods of time, even after deprecation, giving developers plenty of time to update (except for cases where keeping the deprecated API is undesired, such as in the presence of security issues). @doc and @typedoc Provides documentation for the entity that follows the attribute. @doc is to be used with a function, macro, callback, or macrocallback, while @typedoc with a type (public or opaque).Accepts one of these:a string (often a heredoc)false, which will make the entity invisible to documentation-extraction tools like ExDoca keyword list, since Elixir 1.7.0For example:defmodule MyModule do @typedoc "This type" @typedoc since: "1.1.0" @type t :: term @doc "Hello world" @doc since: "1.1.0" def hello do "world" end @doc """ Sums `a` to `b`. """ def sum(a, b) do a + b end endAs can be seen in the example above, since Elixir 1.7.0 @doc and @typedoc also accept a keyword list that serves as a way to provide arbitrary metadata about the entity. Tools like ExDoc and IEx may use this information to display annotations. A common use case is the :since key, which may be used to annotate in which version the function was introduced.As illustrated in the example, it is possible to use these attributes more than once before an entity. However, the compiler will warn if used twice with binaries as that replaces the documentation text from the preceding use. Multiple uses with keyword lists will merge the lists into one.Note that since the compiler also defines some additional metadata, there are a few reserved keys that will be ignored and warned if used. Currently these are: :opaque and :defaults.Once this module is compiled, this information becomes available via the Code.fetch_docs/1 function. @dialyzer Defines warnings to request or suppress when using :dialyzer.Accepts an atom, a tuple, or a list of atoms and tuples. For example:defmodule MyModule do @dialyzer {:nowarn_function, [my_fun: 1]} def my_fun(arg) do M.not_a_function(arg) end endFor the list of supported warnings, see :dialyzer module.Multiple uses of @dialyzer will accumulate instead of overriding previous ones. @external_resource Specifies an external resource for the current module.Sometimes a module embeds information from an external file. This attribute allows the module to annotate which external resources have been used.Tools may use this information to ensure the module is recompiled in case any of the external resources change, see for example: mix compile.elixir.The specified file path provided is interpreted as relative to the folder containing the project's mix.exs, which is the current working directory, not the file where @external_resource is declared.If the external resource does not exist, the module still has a dependency on it, causing the module to be recompiled as soon as the file is added.For more control over when a module is recompiled, see __mix_recompile__?/0. @file Changes the filename used in stacktraces for the function or macro that follows the attribute, such as:defmodule MyModule do @doc "Hello world" @file "hello.ex" def hello do "world" end endNote that this is only valid for exceptions/diagnostics that come from the definition inner scope (which includes its patterns and guards). For example:defmodule MyModule do # <---- module definition @file "hello.ex" defp unused(a) do # <---- function definition "world" # <---- function scope end @file "bye.ex" def unused(_), do: true endIf you run this code with the second "unused" definition commented, you will see that hello.ex is used as the stacktrace when reporting warnings, but if you uncomment it you'll see that the error will not mention bye.ex, because it's a module-level error rather than an expression-level error. @moduledoc Provides documentation for the current module.defmodule MyModule do @moduledoc """ A very useful module. """ @moduledoc authors: ["Alice", "Bob"] endAccepts a string (often a heredoc) or false where @moduledoc false will make the module invisible to documentation extraction tools like ExDoc.Similarly to @doc also accepts a keyword list to provide metadata about the module. For more details, see the documentation of @doc above.Once this module is compiled, this information becomes available via the Code.fetch_docs/1 function. @nifs (since v1.16.0) A list of functions and their arities which will be overridden by a native implementation (NIF).defmodule MyLibrary.MyModule do @nifs [foo: 1, bar: 2] def foo(arg1), do: :erlang.nif_error(:not_loaded) def bar(arg1, arg2), do: :erlang.nif_error(:not_loaded) endSee the Erlang documentation for more information: https://www.erlang.org/doc/man/erl_nif @on_definition A hook that will be invoked when each function or macro in the current module is defined. Useful when annotating functions.Accepts a module or a {module, function_name} tuple. The function must take 6 arguments:the module environmentthe kind of the function/macro: :def, :defp, :defmacro, or :defmacropthe function/macro namethe list of quoted argumentsthe list of quoted guardsthe quoted function bodyIf the function/macro being defined has multiple clauses, the hook will be called for each clause.Unlike other hooks, @on_definition will only invoke functions and never macros. This is to avoid @on_definition callbacks from redefining functions that have just been defined in favor of more explicit approaches.When just a module is provided, the function is assumed to be __on_definition__/6.Exampledefmodule Hooks do def on_def(_env, kind, name, args, guards, body) do IO.puts("Defining #{kind} named #{name} with args:") IO.inspect(args) IO.puts("and guards") IO.inspect(guards) IO.puts("and body") IO.puts(Macro.to_string(body)) end end defmodule MyModule do @on_definition {Hooks, :on_def} def hello(arg) when is_binary(arg) or is_list(arg) do "Hello" <> to_string(arg) end def hello(_) do :ok end end @on_load A hook that will be invoked whenever the module is loaded.Accepts the function name (as an atom) of a function in the current module. The function must have an arity of 0 (no arguments). If the function does not return :ok, the loading of the module will be aborted. For example:defmodule MyModule do @on_load :load_check def load_check do if some_condition() do :ok else :abort end end def some_condition do false end end @vsn Specify the module version. Accepts any valid Elixir value, for example:defmodule MyModule do @vsn "1.0" end Struct attributes @derive - derives an implementation for the given protocol for the struct defined in the current module@enforce_keys - ensures the given keys are always set when building the struct defined in the current moduleSee defstruct/1 for more information on building and using structs. Typespec attributes The following attributes are part of typespecs and are also built-in in Elixir:@type - defines a type to be used in @spec@typep - defines a private type to be used in @spec@opaque - defines an opaque type to be used in @spec@spec - provides a specification for a function@callback - provides a specification for a behaviour callback (and generates a behaviour_info/1 function in the module, see below)@macrocallback - provides a specification for a macro behaviour callback@optional_callbacks - specifies which behaviour callbacks and macro behaviour callbacks are optional@impl - declares an implementation of a callback function or macroFor detailed documentation, see the typespec documentation. Custom attributes In addition to the built-in attributes outlined above, custom attributes may also be added. Custom attributes are expressed using the @/1 operator followed by a valid variable name. The value given to the custom attribute must be a valid Elixir value:defmodule MyModule do @custom_attr [some: "stuff"] endFor more advanced options available when defining custom attributes, see register_attribute/3. Compile callbacks There are three compilation callbacks, invoked in this order: @before_compile, @after_compile, and @after_verify. They are described next. @before_compile A hook that will be invoked before the module is compiled. This is often used to change how the current module is being compiled.Accepts a module or a {module, function_or_macro_name} tuple. The function/macro must take one argument: the module environment. If it's a macro, its returned value will be injected at the end of the module definition before the compilation starts.When just a module is provided, the function/macro is assumed to be __before_compile__/1.Callbacks will run in the order they are registered. Any overridable definition will be made concrete before the first callback runs. A definition may be made overridable again in another before compile callback and it will be made concrete one last time after all callbacks run.Note: the callback function/macro must be placed in a separate module (because when the callback is invoked, the current module does not yet exist).Exampledefmodule A do defmacro __before_compile__(_env) do quote do def hello, do: "world" end end end defmodule B do @before_compile A end B.hello() #=> "world" @after_compile A hook that will be invoked right after the current module is compiled.Accepts a module or a {module, function_name} tuple. The function must take two arguments: the module environment and its bytecode. When just a module is provided, the function is assumed to be __after_compile__/2.Callbacks will run in the order they are registered.Module functions expecting not yet compiled modules (such as definitions_in/1) are still available at the time @after_compile is invoked.Exampledefmodule MyModule do @after_compile __MODULE__ def __after_compile__(env, _bytecode) do IO.inspect(env) end end @after_verify A hook that will be invoked right after the current module is verified for undefined functions, deprecations, etc. A module is always verified after it is compiled. In Mix pr'''
