["https://hexdocs.pm/ex_doc/Mix.Tasks.Docs.html"]
title = "mix docs — ExDoc v0.37.1"
full_description = '''Search documentation of ExDoc Settings mix docs (ExDoc v0.37.1) View Source Uses ExDoc to generate a static web page from the project documentation. Command line options --canonical, -n - Indicate the preferred URL with rel="canonical" link element, defaults to no canonical path--formatter, -f - Which formatters to use, html or epub. This option can be given more than once. By default, both html and epub are generated.--language - Specifies the language to annotate the EPUB output in valid BCP 47--open - open browser window pointed to the documentation--output, -o - Output directory for the generated docs, default: "doc"--proglang - Chooses the main programming language: elixir or erlang--warnings-as-errors - Exits with non-zero exit code if any warnings are foundThe command line options have higher precedence than the options specified in your mix.exs file below. Configuration ExDoc will automatically pull in information from your project, like the application and version. However, you may want to set :name, :source_url and :homepage_url to have a nicer output from ExDoc, for example:def project do [ app: :my_app, version: "0.1.0-dev", deps: deps(), # Docs name: "My App", source_url: "https://github.com/USER/PROJECT", homepage_url: "http://YOUR_PROJECT_HOMEPAGE", docs: [ main: "MyApp", # The main page in the docs favicon: "path/to/favicon.png", logo: "path/to/logo.png", extras: ["README.md"] ] ] endExDoc also allows configuration specific to the documentation to be set. The following options should be put under the :docs key in your project's main configuration. The :docs options should be a keyword list or a function returning a keyword list that will be lazily executed.:annotations_for_docs - a function that receives metadata and returns a list of annotations to be added to the signature. The metadata received will also contain :module, :name, :arity and :kind to help identify which entity is currently being processed.:api_reference - Whether to generate api-reference.html; default: true. If this is set to false, :main must also be set.:assets - A map of source => target directories that will be copied as is to the output path. It defaults to an empty map.:authors - List of authors for the generated docs or epub.:before_closing_body_tag - a function that takes as argument an atom specifying the formatter being used (:html or :epub) and returns a literal HTML string to be included just before the closing body tag (</body>). The atom given as argument can be used to include different content in both formats. Useful to inject custom assets, such as Javascript.:before_closing_head_tag - a function that takes as argument an atom specifying the formatter being used (:html or :epub) and returns a literal HTML string to be included just before the closing head tag (</head>). The atom given as argument can be used to include different content in both formats. Useful to inject custom assets, such as CSS stylesheets.:before_closing_footer_tag - a function that takes as argument an atom specifying the formatter being used (:html) and returns a literal HTML string to be included just before the closing footer tag (</footer>). This option only has effect on the html formatter. Useful if you want to inject an extra footer into the documentation.:canonical - String that defines the preferred URL with the rel="canonical" element; defaults to no canonical path.:cover - Path to the epub cover image (only PNG or JPEG accepted) The image size should be around 1600x2400. When specified, the cover will be placed under the "assets" directory in the output path under the name "cover" and the appropriate extension. This option has no effect when using the "html" formatter.:deps - A keyword list application names and their documentation URL. ExDoc will by default include all dependencies and assume they are hosted on HexDocs. This can be overridden by your own values. Example: [plug: "https://myserver/plug/"]:extra_section - String that defines the section title of the additional Markdown and plain text pages; default: "PAGES". Example: "GUIDES":extras - List of paths to additional Markdown (.md extension), Live Markdown (.livemd extension), Cheatsheets (.cheatmd extension) and plain text pages to add to the documentation. You can also specify keyword pairs to customize the generated filename, title and source file, and search content of each extra page; default: []. Example: ["README.md", "LICENSE", "CONTRIBUTING.md": [filename: "contributing", title: "Contributing", source: "CONTRIBUTING.mdx"]] See the Customizing Extras section for more.:favicon - Path to a favicon image file for the project. Must be PNG, JPEG or SVG. When specified, the image file will be placed in the output "assets" directory, named "favicon.EXTENSION". If using SVG, ensure appropriate width, height and viewBox attributes are present in order to ensure predictable sizing and cropping.:filter_modules - Include only modules that match the given value. The value can be a regex, a string (representing a regex), or a two-arity function that receives the module and its metadata and returns true if the module must be included. If a string or a regex is given, it will be matched against the complete module name (which includes the "Elixir." prefix for Elixir modules). If a module has @moduledoc false, then it is always excluded.:formatters - Formatter to use; default: ["html", "epub"], options: "html", "epub".:groups_for_extras, :groups_for_modules, :groups_for_docs, and :default_group_for_doc - See the "Groups" section:ignore_apps - Apps to be ignored when generating documentation in an umbrella project. Receives a list of atoms. Example: [:first_app, :second_app].:language - Identify the primary language of the documents, its value must be a valid BCP 47 language tag; default: "en":logo - Path to a logo image file for the project. Must be PNG, JPEG or SVG. When specified, the image file will be placed in the output "assets" directory, named "logo.EXTENSION". The image will be shown within a 48x48px area. If using SVG, ensure appropriate width, height and viewBox attributes are present in order to ensure predictable sizing and cropping.:main - Main page of the documentation. It may be a module or a generated page, like "Plug" or "api-reference"; default: "api-reference".:markdown_processor - The markdown processor to use, either module() or {module(), keyword()} to provide configuration options;:meta - A keyword list or a map to specify meta tag attributes:nest_modules_by_prefix - See the "Nesting" section:output - Output directory for the generated docs; default: "doc". May be overridden by command line argument.:redirects - A map or list of tuples, where the key is the path to redirect from and the value is the path to redirect to. The extension is omitted in both cases, i.e %{"old-readme" => "readme"}. See the "Changing documentation over time" section below for more.:skip_undefined_reference_warnings_on - ExDoc warns when it can't create a Mod.fun/arity reference in the current project docs e.g. because of a typo. This list controls where to skip the warnings, for a given module/function/callback/type (e.g.: ["Foo", "Bar.baz/0"]) or on a given file (e.g.: ["pages/deprecations.md"]). This option can also be a function from a reference string to a boolean (e.g.: &String.match?(&1, ~r/Foo/)); default is nothing to be skipped.:skip_code_autolink_to - Similar to :skip_undefined_reference_warnings_on, this option controls which terms will be skipped by ExDoc when building documentation. Useful for example if you want to highlight private modules or functions without warnings. This option can be a function from a term to a boolean (e.g.: &String.match?(&1, ~r/PrivateModule/)) or a list of terms (e.g.:["PrivateModule", "PrivateModule.func/1"]); default is nothing to be skipped.:source_beam - Path to the beam directory; default: mix's compile path.:source_ref - The branch/commit/tag used for source link inference; default: "main".:source_url_pattern - Public URL of the project for source links. This is derived automatically from the project's :source_url and :source_ref when using one of the supported public hosting services (currently GitHub, GitLab, or Bitbucket). If you are using one of those services with their default public hostname, you do not need to set this configuration.However, if using a different solution, or self-hosting, you will need to set this configuration variable to a pattern for source code links. The value must be a string or a function.If a string, then it should be the full URI to use for links with the following variables available for interpolation:%{path}: the path of a file in the repo%{line}: the line number in the fileFor GitLab/GitHub:https://mydomain.org/user_or_team/repo_name/blob/main/%{path}#L%{line}For Bitbucket:https://mydomain.org/user_or_team/repo_name/src/main/%{path}#cl-%{line}If a function, then it must be a function that takes two arguments, path and line, where path is either an relative path from the cwd, or an absolute path. The function must return the full URI as it should be placed in the documentation. Groups ExDoc content can be organized in groups. This is done via the :groups_for_extras and :groups_for_modules. For example, imagine you are storing extra guides in your documentation which are organized per directory. In the extras section you have:extras: [ "guides/introduction/foo.md", "guides/introduction/bar.md", ... "guides/advanced/baz.md", "guides/advanced/bat.md" ]You can have those grouped as follows:groups_for_extras: [ "Introduction": Path.wildcard("guides/introduction/*.md"), "Advanced": Path.wildcard("guides/advanced/*.md") ]Or via a regex:groups_for_extras: [ "Introduction": ~r"/introduction/", "Advanced": ~r"/advanced/" ]Similar can be done for modules:groups_for_modules: [ "Data types": [Atom, Regex, URI], "Collections": [Enum, MapSet, Stream] ]A regex or the string name of the module is also supported. Grouping functions, types, and callbacks Types, functions, and callbacks inside a module can also be organized in groups. By default, ExDoc respects the :group metadata field:@doc group: "Queries" def get_by(schema, fields)The function above will be automatically listed under the "Queries" section in the sidebar. The benefit of using :group is that it can also be used by tools such as IEx during autocompletion. These groups are then ordered alphabetically in the sidebar.It is also possible to tell ExDoc to either enrich the group metadata or lookup a different field via the :default_group_for_doc configuration. The default is:default_group_for_doc: fn metadata -> metadata[:group] endThe metadata received contains all of the documentation metadata, such as :group, but also :module, :name, :arity and :kind to help identify which entity is currently being processed. For example, projects like Nx have a custom function that converts "Queries" into "Function: Queries":default_group_for_doc: fn metadata -> if group = metadata[:group] do "Functions: #{group}" end endWhenever using the :group key, the groups will be ordered alphabetically. If you also want control over the group order, you can also use the :groups_for_docs which works similarly as the one for modules/extra pages.:groups_for_docs is a keyword list of group titles and filtering functions that receive the documentation metadata and must return a boolean. For example, imagine that you have an API client library with a large surface area for all the API endpoints you need to support. It would be helpful to group the functions with similar responsibilities together. In this case in your module you might have:defmodule APIClient do @doc section: :auth def refresh_token(params \\ []) @doc subject: :object def update_status(id, new_status) @doc permission: :grant def grant_privilege(resource, privilege) endAnd then in the configuration you can group these with:groups_for_docs: [ Authentication: & &1[:section] == :auth, Resource: & &1[:subject] == :object, Admin: & &1[:permission] in [:grant, :write] ]A function can belong to a single group only. The first group that matches will be the one used. In case no group is found in :groups_for_docs, the :default_group_for_doc callback is invoked. If it returns nil, it then falls back to the appropriate "Functions", "Types" or "Callbacks" section respectively. Meta-tags configuration It is also possible to configure some of ExDoc behaviour using meta tags. These meta tags can be inserted using before_closing_head_tag.exdoc:autocomplete - when set to "off", it disables autocompletion.exdoc:full-text-search-url - the URL to use when performing full text search. The search string will be appended to the URL as an encoded parameter. You could use this to bring a custom search engine to your documentation. It defaults to ExDoc's default search page. Nesting ExDoc also allows module names in the sidebar to appear nested under a given prefix. The :nest_modules_by_prefix expects a list of module names, such as [Foo.Bar, Bar.Baz]. In this case, a module named Foo.Bar.Baz will appear nested within Foo.Bar and only the name Baz will be shown in the sidebar. Note the Foo.Bar module itself is not affected.This option is mainly intended to improve the display of long module names in the sidebar, particularly when they are too long for the sidebar or when many modules share a long prefix. If you mean to group modules logically or call attention to them in the docs, you should probably use :groups_for_modules (which can be used in conjunction with :nest_modules_by_prefix). Changing documentation over time As your project grows, your documentation may very likely change, even structurally. There are a few important things to consider in this regard:Links to your extras will break if you change or move file names.Links to your modules, and mix tasks will change if you change their name.Links to functions are actually links to modules with anchor links. If you change the function name, the link does not break but will leave users at the top of the module's documentation.Because these docs are static files, the behavior of a missing page will depend on where they are hosted. In particular, hexdocs.pm will show a 404 page.You can improve the developer experience on everything but function names changing by using the redirects configuration. For example, if you changed the module MyApp.MyModule to MyApp.My.Module and the extra get-started.md to quickstart.md, you can setup the following redirects:redirects: %{ "MyApp.MyModule" => "MyApp.My.Module", "get-started" => "quickstart" } Customizing Extras :title - The title of the extra page. If not provided, the title will be inferred from the filename.:filename - The name of the generated file. If not provided, the filename will be inferred from the source file.:source - The source file of the extra page. This is useful if you want to customize the filename or title but keep the source file u'''
year_published = 2025
clearnet = "https://hexdocs.pm/ex_doc/Mix.Tasks.Docs.html"
