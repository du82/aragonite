      t()
  
    Abstract Syntax Tree (AST)"""
full_description = '''Search documentation of Elixir Settings Macro (Elixir v1.19.0-dev) View Source Functions for manipulating AST and implementing macros.Macros are compile-time constructs that receive Elixir's AST as input and return Elixir's AST as output.Many of the functions in this module exist precisely to work with Elixir AST, to traverse, query, and transform it.Let's see a simple example that shows the difference between functions and macros:defmodule Example do defmacro macro_inspect(value) do IO.inspect(value) value end def fun_inspect(value) do IO.inspect(value) value end endNow let's give it a try:import Example macro_inspect(1) #=> 1 #=> 1 fun_inspect(1) #=> 1 #=> 1So far they behave the same, as we are passing an integer as argument. But let's see what happens when we pass an expression:macro_inspect(1 + 2) #=> {:+, [line: 3], [1, 2]} #=> 3 fun_inspect(1 + 2) #=> 3 #=> 3The macro receives the representation of the code given as argument, while a function receives the result of the code given as argument. A macro must return a superset of the code representation. See input/0 and output/0 for more information.To learn more about Elixir's AST and how to build them programmatically, see quote/2.Evaluating codeThe functions in this module do not evaluate code. In fact, evaluating code from macros is often an anti-pattern. For code evaluation, see the Code module. Summary Types captured_remote_function() A captured remote function in the format of &Mod.fun/arity input() The inputs of a macro metadata() A keyword list of AST metadata. output() The output of a macro t() Abstract Syntax Tree (AST) Functions camelize(string) Converts the given string to CamelCase format. classify_atom(atom) Classifies an atom based on its possible AST placement. compile_apply(mod, fun, args, caller) Applies a mod, function, and args at compile-time in caller. dbg(code, options, env) Default backend for Kernel.dbg/2. decompose_call(ast) Decomposes a local or remote call into its remote part (when provided), function name and argument list. escape(expr, opts \\ []) Recursively escapes a value so it can be inserted into a syntax tree. expand(ast, env) Receives an AST node and expands it until it can no longer be expanded. expand_literals(ast, env) Expands all literals in ast with the given env. expand_literals(ast, acc, fun) Expands all literals in ast with the given acc and fun. expand_once(ast, env) Receives an AST node and expands it once. generate_arguments(amount, context) Generates AST nodes for a given number of required argument variables using Macro.var/2. generate_unique_arguments(amount, context) Generates AST nodes for a given number of required argument variables using Macro.unique_var/2. inspect_atom(source_format, atom, opts \\ []) Inspects atom according to different source formats. operator?(name, arity) Returns true if the given name and arity is an operator. path(ast, fun) Returns the path to the node in ast for which fun returns a truthy value. pipe(expr, call_args, position) Pipes expr into the call_args at the given position. postwalk(ast, fun) This function behaves like prewalk/2, but performs a depth-first, post-order traversal of quoted expressions. postwalk(ast, acc, fun) This functions behaves like prewalk/3, but performs a depth-first, post-order traversal of quoted expressions using an accumulator. postwalker(ast) Returns an enumerable that traverses the ast in depth-first, post-order traversal. prewalk(ast, fun) Performs a depth-first, pre-order traversal of quoted expressions. prewalk(ast, acc, fun) Performs a depth-first, pre-order traversal of quoted expressions using an accumulator. prewalker(ast) Returns an enumerable that traverses the ast in depth-first, pre-order traversal. quoted_literal?(term) Returns true if the given quoted expression represents a quoted literal. special_form?(name, arity) Returns true if the given name and arity is a special form. struct!(module, env) deprecated struct_info!(module, env) Extracts the struct information (equivalent to calling module.__info__(:struct)). to_string(tree) Converts the given expression AST to a string. to_string(tree, fun) deprecated Converts the given expression AST to a string. traverse(ast, acc, pre, post) Performs a depth-first traversal of quoted expressions using an accumulator. underscore(atom_or_string) Converts the given argument to a string with the underscore-slash format. unescape_string(string) Unescapes characters in a string. unescape_string(string, map) Unescapes characters in a string according to the given mapping. unique_var(var, context) Generates an AST node representing a unique variable given by the atoms var and context. unpipe(expr) Breaks a pipeline expression into a list. update_meta(quoted, fun) Applies the given function to the node metadata if it contains one. validate(expr) Validates the given expressions are valid quoted expressions. var(var, context) Generates an AST node representing the variable given by the atoms var and context. Types captured_remote_function() @type captured_remote_function() :: fun() A captured remote function in the format of &Mod.fun/arity input() @type input() :: input_expr() | {input(), input()} | [input()] | atom() | number() | binary() The inputs of a macro metadata() @type metadata() :: keyword() A keyword list of AST metadata.The metadata in Elixir AST is a keyword list of values. Any key can be used and different parts of the compiler may use different keys. For example, the AST received by a macro will always include the :line annotation, while the AST emitted by quote/2 will only have the :line annotation if the :line option is provided.The following metadata keys are public::context - Defines the context in which the AST was generated. For example, quote/2 will include the module calling quote/2 as the context. This is often used to distinguish regular code from code generated by a macro or by quote/2.:counter - The variable counter used for variable hygiene. In terms of the compiler, each variable is identified by the combination of either name and metadata[:counter], or name and context.:from_brackets - Used to determine whether a call to Access.get/3 is from bracket syntax.:from_interpolation - Used to determine whether a call to Kernel.to_string/1 is from interpolation.:generated - Whether the code should be considered as generated by the compiler or not. This means the compiler and tools like Dialyzer may not emit certain warnings.:if_undefined - How to expand a variable that is undefined. Set it to :apply if you want a variable to become a nullary call without warning or :raise:keep - Used by quote/2 with the option location: :keep to annotate the file and the line number of the quoted source.:line - The line number of the AST node. Note line information is discarded from quoted code but can be enabled back via the :line option.The following metadata keys are enabled by Code.string_to_quoted/2::assoc - contains metadata about the => operator location in a map key-value AST node (when :token_metadata is true). This entry appears on map key nodes only:closing - contains metadata about the closing pair, such as a } in a tuple or in a map, or such as the closing ) in a function call with parens (when :token_metadata is true). If the function call has a do-end block attached to it, its metadata is found under the :do and :end metadata:column - the column number of the AST node (when :columns is true). Note column information is always discarded from quoted code.:delimiter - contains the opening delimiter for sigils, strings, and charlists as a string (such as "{", "/", "'", and the like):do - contains metadata about the do location in a function call with do-end blocks (when :token_metadata is true):end - contains metadata about the end location in a function call with do-end blocks (when :token_metadata is true):end_of_expression - denotes when the end of expression effectively happens (when :token_metadata is true). This is only available for expressions inside "blocks of code", which are either direct children of a __block__ or the right side of ->. The last expression of the block does not have metadata if it is not followed by an end of line character (either a newline or ;). This entry may appear multiple times in the same metadata if the expression is surround by parens:format - set to :keyword when an atom is defined as a keyword. It may also be set to :atom to distinguish nil, false, and true:indentation - indentation of a sigil heredoc:parens - denotes a node was surrounded by parens for grouping. This entry may appear multiple times in the same metadata if multiple pairs are used for groupingThe following metadata keys are private::alias - Used for alias hygiene.:ambiguous_op - Used for improved error messages in the compiler.:imports - Used for import hygiene.:var - Used for improved error messages on undefined variables.Do not rely on them as they may change or be fully removed in future versions of the language. They are often used by quote/2 and the compiler to provide features like hygiene, better error messages, and so forth.If you introduce custom keys into the AST metadata, please make sure to prefix them with the name of your library or application, so that they will not conflict with keys that could potentially be introduced by the compiler in the future. output() @type output() :: output_expr() | {output(), output()} | [output()] | atom() | number() | binary() | captured_remote_function() | pid() The output of a macro t() @type t() :: input() Abstract Syntax Tree (AST) Functions camelize(string) @spec camelize(String.t()) :: String.t() Converts the given string to CamelCase format.This function was designed to camelize language identifiers/tokens, that's why it belongs to the Macro module. Do not use it as a general mechanism for camelizing strings as it does not support Unicode or characters that are not valid in Elixir identifiers. Examples iex> Macro.camelize("foo_bar") "FooBar" iex> Macro.camelize("foo/bar") "Foo.Bar"If uppercase characters are present, they are not modified in any way as a mechanism to preserve acronyms:iex> Macro.camelize("API.V1") "API.V1" iex> Macro.camelize("API_SPEC") "API_SPEC" classify_atom(atom) (since 1.14.0) @spec classify_atom(atom()) :: :alias | :identifier | :quoted | :unquoted Classifies an atom based on its possible AST placement.It returns one of the following atoms::alias - the atom represents an alias:identifier - the atom can be used as a variable or local function call (as well as be an unquoted atom):unquoted - the atom can be used in its unquoted form, includes operators and atoms with @ in them:quoted - all other atoms which can only be used in their quoted formMost operators are going to be :unquoted, such as :+, with some exceptions returning :quoted due to ambiguity, such as :"::". Use operator?/2 to check if a given atom is an operator. Examples iex> Macro.classify_atom(:foo) :identifier iex> Macro.classify_atom(Foo) :alias iex> Macro.classify_atom(:foo@bar) :unquoted iex> Macro.classify_atom(:+) :unquoted iex> Macro.classify_atom(:Foo) :unquoted iex> Macro.classify_atom(:"with spaces") :quoted compile_apply(mod, fun, args, caller) (since 1.16.0) Applies a mod, function, and args at compile-time in caller.This is used when you want to programmatically invoke a macro at compile-time. dbg(code, options, env) (since 1.14.0) @spec dbg(t(), t(), Macro.Env.t()) :: t() Default backend for Kernel.dbg/2.This function provides a default backend for Kernel.dbg/2. See the Kernel.dbg/2 documentation for more information.This function:prints information about the given envprints information about code and its returned value (using opts to inspect terms)returns the value returned by evaluating codeYou can call this function directly to build Kernel.dbg/2 backends that fall back to this function.This function raises if the context of the given env is :match or :guard. decompose_call(ast) @spec decompose_call(t()) :: {atom(), [t()]} | {t(), atom(), [t()]} | :error Decomposes a local or remote call into its remote part (when provided), function name and argument list.Returns :error when an invalid call syntax is provided. Examples iex> Macro.decompose_call(quote(do: foo)) {:foo, []} iex> Macro.decompose_call(quote(do: foo())) {:foo, []} iex> Macro.decompose_call(quote(do: foo(1, 2, 3))) {:foo, [1, 2, 3]} iex> Macro.decompose_call(quote(do: Elixir.M.foo(1, 2, 3))) {{:__aliases__, [], [:Elixir, :M]}, :foo, [1, 2, 3]} iex> Macro.decompose_call(quote(do: 42)) :error iex> Macro.decompose_call(quote(do: {:foo, [], []})) :error escape(expr, opts \\ []) @spec escape( term(), keyword() ) :: t() Recursively escapes a value so it can be inserted into a syntax tree. Examples iex> Macro.escape(:foo) :foo iex> Macro.escape({:a, :b, :c}) {:{}, [], [:a, :b, :c]} iex> Macro.escape({:unquote, [], [1]}, unquote: true) 1 Options :unquote - when true, this function leaves unquote/1 and unquote_splicing/1 expressions unescaped, effectively unquoting the contents on escape. This option is useful only when escaping ASTs which may have quoted fragments in them. Defaults to false.:prune_metadata - when true, removes most metadata from escaped AST nodes. Note this option changes the semantics of escaped code and it should only be used when escaping ASTs. Defaults to false.As an example for :prune_metadata, ExUnit stores the AST of every assertion, so when an assertion fails we can show code snippets to users. Without this option, each time the test module is compiled, we would get a different MD5 of the module bytecode, because the AST contains metadata, such as counters, specific to the compilation environment. By pruning the metadata, we ensure that the module is deterministic and reduce the amount of data ExUnit needs to keep around. Only the minimal amount of metadata is kept, such as :line, :no_parens and :delimiter. Comparison to quote/2 The escape/2 function is sometimes confused with quote/2, because the above examples behave the same with both. The key difference is best illustrated when the value to escape is stored in a variable.iex> Macro.escape({:a, :b, :c}) {:{}, [], [:a, :b, :c]} iex> quote do: {:a, :b, :c} {:{}, [], [:a, :b, :c]} iex> value = {:a, :b, :c} iex> Macro.escape(value) {:{}, [], [:a, :b, :c]} iex> quote do: value {:value, [], __MODULE__} iex> value = {:a, :b, :c} iex> quote do: unquote(value) ** (ArgumentError) tried to unquote invalid AST: {:a, :b, :c} Did you forget to escape term using Macro.escape/1?escape/2 is used to escape values (either directly passed or variable bound), while quote/2 produces syntax trees for expressions. expand(ast, env) @spec expand(input(), Macro.Env.t()) :: output() Receives an AST node and expands it until it can no longer be expanded.Note this function does not traverse the AST, only the root node is expanded.This function uses expand_once/2 under the hood. Check it out for more information and examples. ex'''
