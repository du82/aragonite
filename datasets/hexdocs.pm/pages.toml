title = "ExUnit.DocTest — ExUnit v1.19.0-dev"
description = '''
Functions
  
      doctest(module, opts \\ [])
  
    Generate test cases from module documentation.

      doctest_file(file, opts \\ [])
  
    Generate test cases from a markdown file.'''
full_description = '''Search documentation of ExUnit Settings ExUnit.DocTest (ExUnit v1.19.0-dev) View Source Extract test cases from the documentation.Doctests allow us to generate tests from code examples found in @moduledoc and @doc attributes. To do this, invoke the doctest/1 macro from within your test case and ensure your code examples are written according to the syntax and guidelines below. Syntax Every new test starts on a new line, with an iex> prefix. Multiline expressions can be used by prefixing subsequent lines with either ...> (recommended) or iex>.The expected result should start the line after the iex> and ...> line(s) and be terminated by a newline. Examples To run doctests include them in an ExUnit case with a doctest macro:defmodule MyModuleTest do use ExUnit.Case, async: true doctest MyModule endThe doctest macro loops through all functions and macros defined in MyModule, parsing their documentation in search of code examples.A very basic example is:iex> 1 + 1 2Expressions on multiple lines are also supported:iex> Enum.map([1, 2, 3], fn x -> ...> x * 2 ...> end) [2, 4, 6]Multiple results can be checked within the same test:iex> a = 1 1 iex> a + 1 2If you want to keep any two tests separate, add an empty line between them:iex> a = 1 1 iex> a + 1 # will fail with a `undefined variable "a"` error 2If you don't want to assert for every result in a doctest, you can omit the result. You can do so between expressions:iex> pid = spawn(fn -> :ok end) iex> is_pid(pid) trueAs well as at the end:iex> Mod.do_a_call_that_should_not_raise!(...)This is useful when the result is something variable (like a PID in the example above) or when the result is a complicated data structure and you don't want to show it all, but just parts of it or some of its properties.Similarly to IEx you can use numbers in your "prompts":iex(1)> [1 + 2, ...(1)> 3] [3, 3]This is useful in two cases:being able to refer to specific numbered scenarioscopy-pasting examples from an actual IEx sessionYou can also select or skip functions when calling doctest. See the documentation on the :except and :only options below for more information. Opaque types Some types' internal structures are kept hidden and instead show a user-friendly structure when inspected. The idiom in Elixir is to print those data types in the format #Name<...>. Because those values are treated as comments in Elixir code due to the leading # sign, they require special care when being used in doctests.Imagine you have a map that contains a DateTime and is printed as:%{datetime: #DateTime<2023-06-26 09:30:00+09:00 JST Asia/Tokyo>}If you try to match on such an expression, doctest will fail to compile. There are two ways to resolve this.The first is to rely on the fact that doctest can compare internal structures as long as they are at the root. So one could write:iex> map = %{datetime: DateTime.from_naive!(~N[2023-06-26T09:30:00], "Asia/Tokyo")} iex> map.datetime #DateTime<2023-06-26 09:30:00+09:00 JST Asia/Tokyo>Whenever a doctest starts with "#Name<", doctest will perform a string comparison. For example, the above test will perform the following match:inspect(map.datetime) == "#DateTime<2023-06-26 09:30:00+09:00 JST Asia/Tokyo>"You can also control doctest to use certain inspect options. See the documentation on the :inspect_opts option below.Alternatively, since doctest results are actually evaluated, you can have the DateTime building expression as the doctest result:iex> %{datetime: DateTime.from_naive!(~N[2023-06-26T09:30:00], "Asia/Tokyo")} %{datetime: DateTime.from_naive!(~N[2023-06-26T09:30:00], "Asia/Tokyo")}The downside of this approach is that the doctest result is not really what users would see in the terminal. Exceptions You can also showcase expressions raising an exception, for example:iex> raise "some error" ** (RuntimeError) some errorDoctest will look for a line starting with ** ( and it will parse it accordingly to extract the exception name and message. The exception parser will consider all following lines part of the exception message until there is an empty line or there is a new expression prefixed with iex>. Therefore, it is possible to match on multiline messages as long as there are no empty lines on the message itself.Asserting on the full exception message might not be possible because it is non-deterministic, or it might result in brittle tests if the exact message changes and gets more detailed. Since Elixir 1.19.0, doctests allow the use of an ellipsis (...) at the end of messages:iex> raise "some error in pid: #{inspect(self())}" ** (RuntimeError) some error in pid: ... iex> raise "some error in pid:\n#{inspect(self())}" ** (RuntimeError) some error in pid: ... When not to use doctest In general, doctests are not recommended when your code examples contain side effects. For example, if a doctest prints to standard output, doctest will not try to capture the output.Similarly, doctests do not run in any kind of sandbox. So any module defined in a code example is going to linger throughout the whole test suite run. Summary Functions doctest(module, opts \\ []) Generate test cases from module documentation. doctest_file(file, opts \\ []) Generate test cases from a markdown file. Functions doctest(module, opts \\ []) (macro) Generate test cases from module documentation.Calling doctest(Module) will generate tests for all doctests found in the module. Options :except - generates tests for all functions except those listed (list of {function, arity} tuples, and/or :moduledoc).:only - generates tests only for functions listed (list of {function, arity} tuples, and/or :moduledoc).:import - when true, one can test a function defined in the module without referring to the module name. However, this is not feasible when there is a clash with a module like Kernel. In these cases, :import should be set to false and Module.function(...) should be used instead.:tags - a list of tags to apply to all generated doctests.:inspect_opts - A keyword list with options for inspect/2 on opaque types. This is useful when inspection output on opaque types utilizes pretty printing and to keep the doctests more readable. Examples defmodule MyModuleTest do use ExUnit.Case doctest MyModule, except: [:moduledoc, trick_fun: 1] endThis macro is auto-imported with every ExUnit.Case. doctest_file(file, opts \\ []) (since 1.15.0) (macro) Generate test cases from a markdown file. Options :tags - a list of tags to apply to all generated doctests.:inspect_opts - A keyword list with options for inspect/2 on opaque types. This is useful when inspection output on opaque types utilizes pretty printing and to keep the doctests more readable. Examples defmodule ReadmeTest do use ExUnit.Case doctest_file "README.md" endThis macro is auto-imported with every ExUnit.Case. Search HexDocs Download ePub version Built using ExDoc (v0.37.1) for the Elixir programming language'''
year_published = 2025
clearnet = "https://hexdocs.pm/ex_unit/main/ExUnit.DocTest.html"
category = "SitesList"
tags = ["cases", "code", "doctest", "doctests", "documentation", "elixir", "error", "examples", "exception", "exceptions"]
language = "en"
