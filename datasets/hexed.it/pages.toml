["https://hexed.it/help/features.html"]
title = "HexEd.it - Feature Overview"
description = "A full list of features included in HexEd.it."
full_description = '''HexEd.it runs in any modern browser, that you usually have already installed - no matter if it is Mozilla Firefox 79+, Google Chrome 84+, Opera 70+, Apple Safari 14.1+, Microsoft Edge 84+ There is no need to download and install proprietary software or juggle with executables, that need to be copied to USB sticks or network drives to make them "portable". Anyhow, if you prefer an icon on your desktop or home screen, or if you want a more native look without the browsers UI, you can install HexEd.it as web-app in Google Chrome, Android and iOS. Beside that, HexEd.it is also available in the Microsoft Store. Because HexEd.it is web-based, you'll always use the latest version if you are connected to the internet. No need to manually install updates. Once HexEd.it has been automatically downloaded after the first visit, it can also be used without internet connection. The technology used here is called Service Workers. Local file processing: All file processing is done on your local computer. HexEd.it does not upload your data to the server. HexEd.it uses HTTPS, a very restrictive Content Security Policy (CSP) and Feature Policy, Subresource Integrity (SRI) and various other techniques to prevent cross-site scripting and man-in-the-middle attacks by ISPs, proxies and browser extensions. In contrast to installable software, browsers add an additional layer of security by limiting the ability of web apps. For example only files that you have explicitly selected can be read by HexEd.it; it's not possible to automatically overwrite files; or the interaction with the clipboard is restricted. A text representation is shown aside of the hex codes, and supports more than 50 different encodings, including EBCDIC, IBM437, IBM866, ISO-8859-1 to -16, KOI8-R/-U and many more. Here, you can enter data, select data, remove selections, insert data into files, delete binary data from files, save/load files. Modified data is highlighted. HexEd.it can process files up to several terabytes. Your files are not kept in memory. This means that the displayed data is read directly from your hard drive. It also means there is no delay in opening and editing large files.'''
author = "Jens Duttke"
year_published = 2025
clearnet = "https://hexed.it/help/features.html"
