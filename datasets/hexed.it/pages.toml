["https://hexed.it/help/contribute.html"]
title = "HexEd.it - Contribute"
description = "The answer to the question: How can I contribute to HexEd.it, the powerful online hex editor running in your web browser using HTML5/JS technology?"
full_description = "To make HexEd.it easier to use, and to learn for non-english speaking people, I need help of native speakers of other languages, like Arabic, Dansk, Hindi, Italian, Russian, Spanish, Swahili, Tagalog, Vietnamese etc., by translating HexEd.it into other languages. Beside that, since my native language is german, any help in proof-readers the english texts is appreciated. My to-do list is long, but sometimes I get emails from people with very cool ideas, which I wasn't even thinking about. If you have an idea for a new feature or how to improve an existing feature, I would be happy to get an email. HexEd.it is a one-man-project. There aren't any beta testers, nor do I have the resources to test every single function intensely, on all browsers and operating system, before every release. I'll try to do my best, but if you find a problem, please contact me with details about the problem, the browser and operating system you are using, to get that problem quickly fixed, for you and all other HexEd.it users. Help me to make HexEd.it better known. Write about it on your blog or website, share it on social media or where you want, talk about it on YouTube or in real life! More users means more contributors. More contributors means better software!"
