["https://hexed.it/help/index.html"]
title = "HexEd.it - User Manual"
description = "The table of contents of the user manual of HexEd.it, the powerful online hex editor running in your web browser using HTML5/JavaScript technology."
full_description = "Analyse and edit binary files wherever you want, on any operating system, whether on a desktop or smartphone, and without installing any software. All you need is a modern web browser (Mozilla Firefox 79+, Google Chrome 84+, Opera 70+, Apple Safari 14.1+, Microsoft Edge 84+). The complete file processing is done by your browser and HTML5 functionality. HexEd.it does not upload your data to the server. HexEd.it has a small memory footprint - it does not keep entire files in memory. Instead, it loads chunks of the file as required. This makes it possible to handle very large files even on low-RAM machines. HexEd.it has been tested on files as large as 150 GiB."
author = "Jens Duttke"
year_published = 2025
