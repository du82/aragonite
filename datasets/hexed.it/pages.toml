["https://hexed.it/help/changelog.html"]
title = "HexEd.it - Release Notes"
description = "A full list of all changes to HexEd.it, the powerful online hex editor running in your web browser using HTML5/JavaScript technology."
full_description = '''Thanks to the anonymous users who help translate HexEd.it into their language with the new "Translate" dialog! Thanks to the anonymous users who help translate HexEd.it into their language with the new "Translate" dialog! There were some downtimes in the past 2 days (3 hours in total; the first since a couple of years). This was due to some problems in a necessary move to another server at the hoster Uberspace. Since this new server is not well configured by the hoster, and I'm unable to adjust the configuration, I'm preparing a move to another hoster in the next days. * for performance reasons, the max. size of encoded data is 32 byte, which equals 28 byte (224 bit) of decoded data. If you have a use-case for larger numbers, please contact me. This is the largest code-base change in the history of HexEd.it, which makes the code easier to manage and allow me to implement new features faster. This should not have much impact in the usage of the editor. Anyhow, if you find any issues, please contact me. * right now, it works only in new versions of Chrome and Firefox, and only if HexEd.it has been fully loaded atleast once (a notification in the upper-right corner will be shown, as soon as HexEd.it has been fully cached) Big thanks to Marco Pontello for the permission to use the file format definitions and to link to the File Extension Seeker. Big thanks to Marco Pontello for the permission to use the file format definitions of his TrID - File Identifier project! Big thanks to Éric Larivière, who has implemented most of these features, and to Thomas Chmielowiec for the polish translations!'''
