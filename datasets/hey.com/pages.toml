["https://hey.com/accessibility"]
title = "HEY — HEY is for everyone"
description = "We’re working hard to make sure HEY is accessible to anyone who’d like to use it and in step with the latest web guidelines."
full_description = "We consider accessibility early and often. Every new feature is designed with accessibility in mind, and we aim to meet WCAG 2.1 level AA guidelines. We work directly with customers. These interviews help us validate our work and continuously improve the user experience. We scan new features for compliance. For this step, we use a browser extension like axe to make sure our desktop and mobile layouts meet the requirements. We check for visible focus indicators, so it’s always clear which element on a page is focused. We make sure headings are sequential, so they provide an accurate overview of the structure of each page. We check color contrast with the aim of passing WCAG 2.1 level AA. We hide decorative elements from assistive technology. Elements that are repetitive or purely decorative create excess verbosity for users of accessible tech. We provide a “skip to main content” link at the top of each page so people can quickly bypass repetitive navigation links. We test that everything works with keyboard navigation, making sure that a mouse isn’t required to perform any action throughout the app. We run automated accessibility checks as part of our system testing suite. Whenever a system test visits a page or clicks something on it, axe-core automatically scans the page to help guard against regressions. Done Bring screen reader users into our research and testing process. Done Conduct an accessibility audit and create a prioritized backlog. Done Dedicate >200 hours to fixing the most severe accessibility issues, making interactions consistent, and unifying components in order to make it easier for us to build accessible features going forward. Done Add support for non-visual announcements, such as confirming the success or failure of an action. Done Create an array of code level tools to aid how elements are described by assistive technology. Done Integrate axe-core into our build tools for automated page audits. To-do Work through our backlog of accessibility concerns. To-do Publish a voluntary product accessibility template. To-do Expand our user research program to include people with a broad range of abilities."
year_published = 2025
