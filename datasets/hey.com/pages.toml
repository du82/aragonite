["https://www.hey.com/the-hey-way"]
title = "HEY — The HEY Way"
description = "We have very strong opinions about email."
full_description = "So we redesigned it around an original, new philosophy called The HEY Way. Our motivations are revealed below. Email turned against you For years, email’s been considered a solved problem. But it’s not. Today, email is more cluttered than ever, more overwhelming than ever, more frustrating than ever. And it’s getting worse. Your email is full of other people’s demands on your time and attention. Fielding their communication becomes your obligation. And there hasn’t been a whole lot you can do about it. That’s a bad deal for you. In fact, email’s long been a lopsided deal. From anyone being able to email you without your consent, to marketers being able to track your behavior, to email providers selling ads against your inbox, it’s become you vs. them. It’s time to push back. You deserve control over who can email you. You deserve to read your email without a marketer looking over your shoulder. You deserve an ad-free Imbox. And you deserve a company, and a product, with interests aligned with yours. That’s us, that’s HEY. They let it slide The last time people got excited about email was sixteen years ago when Google introduced Gmail in 2004. Think about everything that’s changed in that time. Then think about email. It’s like it stood still, or even slipped back. Back then, Gmail was a fresh take. The other big players responded by updating their offerings, but then the market went cold. Excitement fizzled. Change came slowly, and mostly on the margins. Why fight massive incumbents like Google, Microsoft, Yahoo, Apple, and Verizon who command more than 80% of the global email market? Because they let email down. Email’s simply too fundamental — and too important — to accept the choices we’ve been given. Someone’s got to breathe new life, and bring new ideas to the table again. We’ve taken on that challenge. We’re fixated on improving email Modern email software is thick with features, but thin on philosophy. Everyone’s left to fend for themselves with no guiding principles. People just don’t know how to get better at email, and existing software isn’t helping. What’s missing is a fresh approach born from a different perspective. A completely new philosophy of email. HEY’s got it. With a novel design, integrated workflows, and a crisp point of view, HEY helps you solve email. HEY is available on the web, Mac, Windows, iOS, and Android. Use HEY, and follow The HEY Way, and you’re guaranteed to level-up. You’ll control your email, it won’t control you. You email every day — you might as well master it. Few things are as satisfying as finally cracking the code and getting good at something you’ve been struggling with forever. We’ll help you get there."
year_published = 2025
