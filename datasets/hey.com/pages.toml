title = "HEY — Before you begin, read me first"
description = "Some common questions people ask before switching to HEY for Domains."
full_description = "Below are some common questions people ask before switching to HEY for Domains. Please read, then click the button at the bottom to begin. Yes. Your current email will continue to work on whatever platform you’re currently on (Google, Outlook, etc), until you complete the clearly labeled, final step of pointing your MX records over to HEY. No surprises — you’re in control. Also, nothing changes with your website hosting or anything like that. The only thing that changes when you switch to HEY is that you host your email with HEY. Everything else stays the same. It should only take 10-20 minutes of your time, but you’ll have 30 days to get any co-workers set up, your DNS settings updated at your registrar, and everything ready to go before you press the final button and officially switch your email to HEY. If you aren’t familiar with TXT records, CNAMES, and MX records, we recommend Zooming, Skyping, or in-personing with someone technical who can help you out. It’s not hard, but if you’re unfamiliar it can feel daunting. Yes. Since you’ll be bringing your own domain, you can use the exact same email addresses as you do now. So, if you’re susan@domain.com today in Gmail or Office 365, you can be susan@domain.com when your email is hosted at HEY. No. Each HEY for Domains account can host a single domain. If you or your company has multiple domains, you’ll need to either set up multiple HEY accounts, or use a third party service like https://forwardemail.net which forwards emails from one domain to another. No. Your old email will stay where it is, it won’t be imported into HEY. Your current email provider will likely offer an export option so you can store it locally if you ever need it. Yes, everyone at your company will need to use HEY when you make the switch. Once you’ve made the switch, every co-worker will check, send, and receive email using HEY. They won’t be able to use Gmail, Outlook, or whatever else they’ve been using for email in the past. They can of course still use Google Docs, Google Calendar, etc — the only thing that changes when you switch to HEY is email."
