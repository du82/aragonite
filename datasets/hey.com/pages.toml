["https://hey.com/features/the-imbox"]
title = "HEY — The Imbox: It’s not a typo"
description = "Everyone hates their bloated inbox, so HEY has a focused Imbox instead. Your Imbox is where important, immediate emails go from people or services you care about. No random receipts, no “I rarely read these” newsletters, and no special offers crowding out the stuff you really care about."
full_description = "Everyone hates their bloated inbox, so HEY has a focused Imbox instead. Your Imbox is where important, immediate emails go from people or services you care about. No random receipts, no “I rarely read these” newsletters, and no special offers crowding out the stuff you really care about. What’s New For You and Previously Seen about? Your Imbox is automatically organized into two groupings. Emails you haven’t read yet are grouped at the top in the New For You section, and emails you’ve seen, sent, or read are grouped down in the Previously Seen section. This way the stuff you’ve seen never gets in the way of the stuff you haven’t. How do I put things in the Imbox? The Screener lets you choose where to file emails from that person. By default, clicking “yes” will land them in your Imbox. You can also move individual emails or all emails from someone to the Imbox after the fact. Where does my sent mail go? Any emails you send go down to the Previously Seen section at the bottom of the Imbox. Can I move emails out of the Imbox? Yes. You can move individual emails or all emails from a contact to The Feed or the Paper Trail instead. Just tap the avatar at the beginning of a row, and select “Move to The Feed” or “Move to Paper Trail” from the action menu that pops up."
