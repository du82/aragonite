["https://www.hey.com/domains/shared-threads"]
title = "HEY — Forwarding is backwards"
description = "Email forwarding was invented in 1978. And it’s been making a mess of email ever since. Time to move on. HEY for Domains Shared Threads are the modern answer."
full_description = "Email forwarding was invented in 1978. And it’s been making a mess of email ever since. Time to move on. Without HEY If you need to discuss an email with a co-worker, you have to start yet another thread. Nothing is in context, and it’s incredibly painful to catch someone else up on the entire story. With HEY Everyone from your team that you add to a thread can add private comments that only your team can see. Comments are woven into the thread alongside emails so that everyone always has complete context. If you need to catch someone up later, just add them to the thread and they’ll instantly have the entire story. So if I share a thread, I don’t have to forward? Correct. Instead of forwarding an email to someone — which is what you’d do with traditional email systems — you’d simply add that person to the thread with the “Collab → Share with…” feature in HEY and they’d instantly have complete access to the entire conversation, same as you. No messy indented emails, no recreating a conversation by piecing stuff back together backwards — just the whole conversion from top to bottom in one, simple column. Can I share a thread with someone outside of our company? No. Thread sharing is only available between co-workers within the same company that are using HEY for Domains. Can I still forward emails if I want to? Absolutely. Since thread sharing only works with people inside your own company, you may still have to forward a thread to someone on the outside. In that case, HEY supports email forwarding just like traditional email. What if I have more questions? Send us an email at support@hey.com and we’ll help you out."
