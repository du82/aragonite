title = "HEY — HEY World"
description = "Now blogging is as easy as emailing. Personal publishing gets the HEY treatment. Write something wonderful to the World Wide Web today at world@hey.com."
full_description = "Personal publishing gets the HEY treatment. Write something wonderful to the World Wide Web today at world@hey.com. Can I CC or BCC world@hey.com? No. World@hey.com needs to be the first and only address in the “to” field. Can I post if I don’t use HEY? No. HEY World is only available to HEY for You personal email customers. You need a @hey.com address to use HEY World. Does HEY World cost extra? No. HEY World is included with your HEY for You account. And HEY World only works with paid HEY accounts, not trials. Is HEY World available on trial accounts? No. HEY World only works with paid HEY accounts in good standing, not trials. Does HEY World work with HEY for Domains? No. Currently HEY World is only available on personal HEY for You accounts. We may introduce it on HEY for Domains accounts down the road, but we’re undecided at the moment. Do you have systems in place to deal with abuse? Yes. Every HEY World post is subject to our use restrictions policy. You can report violations to report@37signals.com. What if I have more questions? Send us an email at support@hey.com and we’ll help you out."
