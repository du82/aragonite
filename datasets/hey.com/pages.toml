["https://www.hey.com/security"]
title = "HEY — Serious security"
description = "Here’s an overview of our approach to ensure that your HEY account stays secure."
full_description = "Few things are as important to protect. Here’s an overview of our approach to ensure that your HEY account stays secure. You have everything to hide “Yeah, I mean email security is great and all, but I don’t really have anything to hide. My life is boring! Haha”, have you heard or thought that before? It’s easy to think tight security is something only celebrities or heads of state need to worry about. But it’s not. Security is for everyone, especially when it comes to email. Email is the skeleton key to the rest of your digital life. If someone gets access to your email, they quickly get access to everything else too. Your social media accounts. Maybe your online bank. Perhaps even your medical records. Most digital services have a way to reset the password that goes through your email address. And it’s not even just about your own security. If someone is able to send email masquerading as you, to the people you know, they can easily get even more insidious scams going. “Hey, grandma, I could really use a hand. The car broke down and we need $1,000. Can you help? Just send the money directly to Joe The Mechanic”. Besides, nobody’s life is so boring that they don’t have an embarrassing email. A receipt of a certain-something purchase. A doctor’s note with some results. Correspondence with a loved one. Having something to hide is not a crime, it’s a sign of a life lived. Guarding your privacy is not something to be ashamed of. HEY is built from the ground-up with privacy and security in mind. There are no fool-proof solutions when it comes to internet software, but we’ve really tried harder. So let’s talk specifics. 1. We require a second factor The foundation of computer security since primordial times has been the user name / password combination. But we’ve known for a long time now that it’s simply not good enough. People have a really hard time with passwords, so they tend to reuse them — even when they know that they’re not supposed to. It’s simply too hard to remember a bunch of strong, secure passwords. So people end up with the same password on Twitter as they use with their bank as they use with some perhaps slightly more sketchy community site. And then one of those sites invariably gets hacked, and now all those passwords are available on the dark web. You could have had a great password, but it doesn’t matter if it, along with 300 million other passwords, just got dumped for anyone to exploit. Now that great password will not just unlock the site you first used it on, but also every other site you reused it on. Your internet security is no better than the weakest site where you’ve used the same password. You can fix part of the problem by using a unique password for every single site, and the only sane way to do that is by using a password manager. We recommend 1Password, but there are lots of choices (Apple now even has one built in). Even so, protecting email with just a password is not enough. The big step up is two-factor authentication (known as 2FA). That’s when you combine something you know (a password) with something you have (a key, which is often times your phone). This means that even if someone guesses your password, they can’t get into your account. The thief also needs to get ahold of that second factor, the key, which commonly lives on your phone, which itself is typically protected by biometric security (face scanning or fingerprints). So that’s why HEY requires two-factor authentication for all paying customers. It’s a bit of a hassle to set up, and it comes with the risk that you could lose that “something you have” key, which requires a lengthy, annoying reset process. But given how important the security of your email is, it’s worth the hassle. HEY uses the industry standard TOTP protocol, which can be used by a slew of second-factor authentication apps. We recommend the Microsoft Authenticator, but you can use 1Password, LastPass, Authy, Google Authenticator, Duo, or any other key generator that supports TOTP. Just make sure you trust the vendor! On top of this, we also support WebAuthn (the newer U2F approach), which is the next level of security, after TOTP. This is the standard for hardware security keys, like Yubico Keys. That’s not required for HEY, but it’s a nice extra layer for those who really want to lock down."
