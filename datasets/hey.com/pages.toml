["https://www.hey.com/moving-from-gmail"]
title = "HEY — Moving from Gmail to HEY"
description = "Switching from Gmail to HEY may seem daunting, but it’s easier than you’d expect. Read on for detailed instructions, tips, and FAQs."
full_description = "Switching from Gmail to HEY may seem daunting, but it’s easier than you’d expect. And you don’t even need to ask your contacts to update your email address. We’ll show you how. Gmail lets you automatically forward any email to your @gmail.com address to another email address. So when someone emails you at youraddress@gmail.com, it’ll be sent right on to youraddress@hey.com. This way you’ll 1. never need to tell people to change your email address, and 2. never miss an email someone sends to your old Gmail address. Over time people can transition into emailing you at your new @hey.com address, but there’s no rush. First, click your avatar to head to your account settings › Forwarding & Sending › Connect an address › and enter your Gmail address. Next, Go to “Forwarding and POP/IMAP” in your Gmail account settings, and add your HEY email address. Gmail will send a verification email to your HEY address. Click the link in the verification email to confirm you own the HEY address. Then, head back over to Gmail’s forwarding settings, switch to the “Forward a copy of incoming mail to” option, then click the “Save Changes” button at the bottom of the page. You can also send emails in HEY using your Gmail address. To do so, click “Sign in to Google”. Select the two checkboxes for what HEY can access and then “Continue”. Done! Now any emails sent to your old Gmail address will come right into HEY as well. And you’ll be able to switch which email address you’re sending from by tapping on the “From” field when you write an email in HEY. You’ve probably collected a bunch of contacts over the years. It would be a loss if you couldn’t bring them with you. Good news, you can! HEY allows you to import all your contacts from Gmail. It just takes a few minutes. First, go to Google Contacts, select all the contacts you want to export, and choose “export” from the “three dots” menu in the toolbar. Next, pick the “vCard (for iOS Contacts)” option, then click “Export” to download a file of your contacts. Last, head over to the contacts importer in HEY, choose the file you exported from Google, then click the “Upload and import” button. Done! Now all your contacts are imported into HEY and Screened In. Note, depending on the number of contacts you’re importing, this step could take longer, but HEY will let you know when it’s all done."
