["https://hey.com/families"]
title = "HEY — Gather ’round"
description = "Now the whole family can get in on HEY email + calendar."
full_description = "With HEY for Families, you can add up to 4 additional people for just $179/year total. One person pays and invites everyone, but the accounts remain separate and private. To get started, sign up for HEY for You. Then, head over to Accounts & Settings › your account › Switch to HEY for Families on the web or desktop app. Next, invite your family members on the My Family screen. If they don’t already have a HEY account, no problem, we’ll send them an email that walks them through signing up for HEY and joining your plan. Now, the whole family can take advantage of HEY’s unique take on email + calendaring. You can share calendars with family members effortlessly, too. What if we have more than five people? We know some people have nuclear families with more than five people, making a five-person family plan not quite enough to fit everyone in. While we max out at five today, we may offer the ability to purchase additional discounted family slots down the road. Until then, you can always purchase additional seats at the full $99/year price. What if someone leaves the family? If anyone leaves the family, or would rather not be part of the family plan, they can leave with their entire account intact. Leaving the family plan doesn’t delete any emails, but the person who left will be on their own to begin paying for the account individually. Can family members see each other’s emails? Only if they send each other email! Every family member’s account is private. However, if someone’s a minor, their parent may have full legal access to their account according to local laws and regulations."
