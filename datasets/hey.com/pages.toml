["https://hey.com/flow"]
title = "HEY — Just let it flow"
description = "HEY helps you reclaim your time and attention by turning the idea that you need to touch every email you receive on its head."
full_description = "For years, email apps have encouraged us to clean up after ourselves — to archive or delete things as we go. HEY thinks that’s old school. Welcome to the new school. Eliminate the obligation In 2004, Gmail introduced archiving to email. In principle, keeping things clean by getting stuff out of your way sounds like a good idea. However, in practice, you had to do all the work. Now every email came with an obligation. Reading it — or simply ignoring it — wasn’t enough. You also had to delete it, archive it, or file it away. And if you didn’t, you’d be shamed by an unmanageable wall of email, a cluttered, uncontrollable inbox. Why have we put up with this for so long? Time’s on your side HEY takes a different approach. HEY says let it flow! Read it, reply to it, ignore it, whatever — then just move on. HEY eliminates the obligation to archive or delete, and saves you the hassle of constantly cleaning up after yourself. Let time do the busy work for you, you’ve already got enough on your plate. This is the modern way, modeled after social media newsfeeds. You don’t delete or archive a Tweet, a Facebook post, an Instagram photo, or a LinkedIn update after you see it. You just read it and move on. New stuff appears at the top, and the old stuff just gets pushed down over time. In HEY, you’ll see this modern Let It Flow philosophy at play in the Imbox, in The Feed, and in the Paper Trail. Here’s how…"
year_published = 2025
