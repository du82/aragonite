["https://www.hey.com/faqs"]
title = "HEY — Frequently asked questions about HEY"
description = "Got a question about HEY? You’ve come to the right place."
full_description = "Can it? Will it? Does it? Can I use my own custom domain with HEY? Is there a wait list for specific email addresses? Can my company host all our email on HEY? Does HEY have a calendar? Can I set up multiple @hey.com addresses? Will HEY work on my Android device? Privacy & Security How’s HEY’s security? Does HEY serve ads or sell my personal data? Why should I trust you with my email? Can you read my emails? What about encryption? What if I forget my password? Why does it say my backup email address isn’t verified? Import & Transition Do I need Gmail, Outlook, Apple, etc. to use HEY? Can I import my Gmail, Outlook, Apple email into HEY? Can I send-as Gmail if I have advanced protection on? Can I check my HEY email with my existing email app? Can I use HEY to check my other email accounts? Can I import my contacts into HEY? Trial, Cancellation, Export If I don’t like HEY, can I export my email and contacts? If I cancel, can I forward my @hey.com address elsewhere? If I cancel, does someone else get my @hey.com address? Can I use my own custom domain with HEY? Yes, and you have two options; 1. You can sign up for HEY for Domains and host your domain with us, or 2. Set up your personal account to send from an external address using SMTP. Is there a wait list for specific email addresses? There is not a wait list for specific addresses, primarily for privacy reasons. If you want something@hey.com, and it’s taken, you can try again another time. If someone’s on a trial, and they don’t end up paying, that address will be released back into the pool of available addresses approximately 90 days after their trial expires. But if someone is already using that address, and they’ve paid for a full year of HEY, it’s theirs forever and it’ll never be available again. Can my company host all our email on HEY? Yes. HEY for Domains includes custom domains, centralized user management, and tools that let you collaborate on email together. Does HEY have a calendar? Yes, and an incredibly innovative one. It’s all new for 2024. Check it out, it’s included for free with your HEY account. Can I set up multiple @hey.com addresses? Yes. You can link up multiple HEY accounts, and view them together without having to log in and out. If you want to view one account at a time, you can do that too. Learn more about linking accounts. Will HEY work on my Android device? HEY requires Android 10 or above. You’ll also need two more things 1) the latest version of Google Play Services and 2) Android System WebView 120+ or Chrome 120+ (depending on your device). Unfortunately, if your device’s manufacturer didn’t include these, you’ll likely run into technical difficulties that we won’t be able to support."
year_published = 2025
