["https://hey.com/new"]
title = "HEY — HEY, there’s new stuff!"
description = "We’re constantly making HEY better. Here are some of the notable features and improvements that we’ve made to HEY since it first launched."
full_description = "Here are some of the notable features and improvements that we’ve made to HEY since it first launched. Looking to clear out your Imbox and mark everything as seen? You can hover New For You to reveal a button to Mark all as seen. Search and autocomplete places and addresses as you type in the Location field for an event. Tap the clipboard icon to copy the address. Tap, hold & drag in your day timeline to create and position a new event. Release your finger to fill in the details. Tap, hold & drag in your day timeline to create and position a new event. Release your finger to fill in the details. The next time your Imbox piles up, power through it all with Power Through New. Knock out all your unread messages in one go with inline replies and quick actions. In the Week view, we improved screen reader navigation to make it easy to jump between weeks and to read all the elements in each day. We also made accessibility improvements to create and edit habits, review your tracked time recordings, and mark Sometime this week as completed in the Day view. Jump months or years with the always available month picker. It’s a fast and beautifully personalized — using your day backgrounds and titles — way to navigate in your HEY Calendar. Jump months or years with the always available month picker. It’s a fast and beautifully personalized — using your day backgrounds and titles — way to navigate in your HEY Calendar. Jot down reminders, take notes during a meeting, or simply reflect on the day — it’s your private space and it’s now available on your iPhone or iPad. Jot down reminders, take notes during a meeting, or simply reflect on the day — it’s your private space and it’s now available on your Android device. Give any email a prominent spot in your Imbox, without having to wait. Bubble Up an email now and float it to the top of your Imbox immediately. With Microsoft discontinuing support for SMTP basic authentication, we made the switch to OAuth2 authentication and API delivery. On a web browser, head to account settings › Forwarding & Sending › Edit › Sending setup › Sign in to Outlook › Accept."
