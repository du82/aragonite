["https://hey.com/none-of-their-business"]
title = "HEY — It’s none of their business"
description = "It’s our business to make your email none of their business."
full_description = "At HEY, our business model is as basic as it is boring: We charge our customers a fair price for our products. That’s it. We don’t take your personal data as payment, we don’t try to monetize your eyeballs, we don’t target you, and we don’t sell, broker, or barter ads. We don’t need to — and don’t want to — track you, spy on you, or enable others to either. It’s absolutely none of their business, and it’s none of ours either. Privacy is personal to us. We’ve been building software for the internet for twenty years. We’ve seen Google go from “Don’t Be Evil” to collecting, selling, and abusing personal data on an industrial scale. We’ve seen Facebook rise from The FaceBook to the pusher of algorithmically-engineered traps of attention and worse. The internet didn’t use to be like this, and it doesn’t have to be like that today either. But right now it just is. You have to defend yourself from these Big Tech giants, and the legion of companies following their nasty example. Collect It All has sunk into the ideology of the commercial internet, so most companies don’t even think about it. It’s just what they do. HEY doesn’t mine your emails for data. There are no big AI engines to feed. We don’t track what links you click, your interests, your location, nothing personal other than the most basic identifying information we need to call you a customer. Everything else is simply none of our business. And because you pay to use HEY, it doesn’t need to be. When you’re in the business of “free”, like Google, Facebook, and many others, you’re in the business of snooping. Collecting. Aggregating. Slicing. Dicing. Packaging. Do you really want to be used like that? As a resource to be mined? If you’re here, and curious about HEY, you probably don’t. Privacy used to be something exotic and niche. Today it’s going mainstream, but it’s still early. You can be early on this trend. You can be part of the change. Using HEY is standing up, not giving in. Your data is none of their business. Don’t give them what isn’t theirs. At HEY, we’ve got your back without looking over your shoulder."
