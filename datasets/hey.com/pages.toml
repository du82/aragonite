, or other forms of payment. Do you offer family plan pricing? Yes, we do! HEY for Families is specially priced at $179/year to share with up to four members of your family. Can I cancel at any time? Yes. If you’re still on the trial when you cancel, you can export your email and contacts so you can take them with you. If you’re a paying customer at the time of cancellation, you can export your email, contacts, and set up forwarding to another email address so you never lose any email sent to your cancelled @hey.com address."
