["https://hey.com/features/the-feed"]
title = "HEY — A love letter to newsletters"
description = "Newsletters are great, but they can get in the way of more important emails. So HEY has a separate, dedicated space where they can shine called The Feed. The Feed shows all of your newsletters — already open — with the newest at the top. Just scroll to read. It’s like a Twitter or Instagram feed, but for email."
full_description = "Newsletters are great, but they can get in the way of more important emails. So HEY has a separate, dedicated space where they can shine called The Feed. The Feed shows all of your newsletters — already open — with the newest at the top. Just scroll to read. It’s like a Twitter or Instagram feed, but for email. What does HEY consider a newsletter? HEY doesn’t decide, you do. HEY won’t move anything anywhere until you tell it to. With HEY, you’re always in control. How do I add something to The Feed? For every sender, you get to pick where their emails should go. Either The Imbox, The Feed, or the Paper Trail. Once you set that up, every new email that person/service sends will land in the proper place. Can I just move individual newsletters? Yes. From The Imbox, you can select any email (by clicking the avatar at the beginning of a row) and selecting “Move to The Feed”. Can I change my mind later? Absolutely. You can change where someone’s email lands whenever you’d like. HEY will move all existing emails from that contact to the new destination as well."
