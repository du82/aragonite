title = "HEY — Blocking email spies 24-7-365"
description = "Many companies track which emails you open, how often you open them, and even where you were when you opened them. It’s a massive invasion of your privacy. HEY blocks these trackers and tells you who’s spying on you."
full_description = "Many companies track which emails you open, how often you open them, and even where you were when you opened them. It’s a massive invasion of your privacy. HEY blocks these trackers and tells you who’s spying on you. Wait, what? Yeah — simply opening an email can tell the sender a whole bunch about you. What kind of phone or computer you own, when you read (or how often you re-read) their email, even your general physical location by getting your IP address. We think this is a gross invasion of your privacy, so we block email spy trackers. You can still read the emails, but they’ll never learn a thing about you. Read more about our aggressive stance against email spy tracking."
