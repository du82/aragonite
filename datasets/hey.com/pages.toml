["https://www.hey.com/features/send-as"]
title = "HEY — Send from an external email address using SMTP"
description = "Now you can send email from your @hey.com address plus external email addresses, domains hosted elsewhere, work accounts on other systems, etc."
full_description = "Now you can send email from your @hey.com address plus external email addresses, domains hosted elsewhere, work accounts on other systems, etc. Great! How do I turn this on? In your HEY account, click your avatar in the top-right corner to head to “Accounts & Settings”. Click your account, select “Forwarding & Sending”, and follow the simple step-by-step directions. Does this work with all email services or custom domains? Most, with a few key exceptions. We support the SMTP standard with basic username/password authentication. We also support OAuth2 for Gmail and Outlook accounts. SMTP… does that mean I can check external email accounts too? No — SMTP is an open standard protocol for sending email, it’s unrelated to checking email. Checking an external email account would require IMAP support, which HEY doesn’t offer. You can forward email in from external services to your own HEY account, but HEY doesn’t check/fetch email on external services (like Google, Outlook, Yahoo, iCloud, etc.)."
