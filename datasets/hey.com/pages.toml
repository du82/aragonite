["https://hey.com/apple"]
title = "HEY — Apple vs. HEY, antitrust, and monopoly"
description = "Apple deserves the antitrust scrutiny that they’re getting for their anti-competitive App Store policies."
full_description = "Apple vs. HEY Apple’s App Store policies are anti-competitive, and have been for years now. Our response News about Apple using their monopoly power to exert pressure on HEY and other developers: The Verge Spotify, Epic, Tile, Match, and more are rallying developers against Apple’s App Store policies Protocol A new email startup says Apple’s shaking it down for a cut of its subscriptions New York Times Is It Finally Hammer Time for Apple and Its App Store? WIRED Apple Threatens to Move Basecamp’s New Email App to Trash The Verge Hey.com exec says Apple is acting like ‘gangsters,’ rejecting App Store updates and demanding cut of sales and Apple’s App Store policies are bad, but its interpretation and enforcement are worse and Apple’s App Store fees are ‘highway robbery,’ says House antitrust committee chair EFF Apple’s Response to HEY Showcases What’s Most Broken About the Apple App Store Tech Crunch Apple doubles down on its right to profit from other businesses Daring Fireball Basecamp’s New App, Hey, Flagged in App Store Limbo for Not Using In-App Purchase and The Flimsiness of ‘Business vs. Consumer’ as a Justification for Apple’s Rejection of Hey From the App Store for Not Using In-App Purchases CNBC Why Apple’s App Store is under fire BBC Apple accused of ‘hostile’ app fee policies Business Insider Apple is facing rage and insurrection from developers over the commission it charges apps on the App Store Macworld Apple picks a fight with popular app developer Basecamp on eve of WWDC Forbes Apple To Basecamp’s Hey: Expect To Pay Us If You Want To Sell Privacy Axios EU’s Apple suit bares tech’s global antitrust threat 9to5Mac Hello, Goodbye: App Store rejects previously-approved ‘Hey’ email app from Basecamp Apple Insider Apple pressures email app ‘Hey’ to integrate in-app purchase option Visit the Coalition for App Fairness to learn more or get involved. The full story on Apple blocking updates to HEY for iOS until we give them a cut of our business: Wow. I’m literally stunned. Apple just doubled down on their rejection of HEY’s ability to provide bug fixes and new features, unless we submit to their outrageous demand of 15-30% of our revenue. Even worse: We’re told that unless we comply, they’ll REMOVE THE APP. DHH (@dhh) June 16, 2020 On the day the EU announced their investigation into Apple’s abusive App Store practices, HEY is subject to those very same capricious, exploitive, and inconsistent policies of shakedown. It’s clear they feel embolden to tighten the screws with no fear of regulatory consequences. DHH (@dhh) June 16, 2020 Like any good mafioso, they paid us a visit by phone. Stating that, firstly, that smashing our windows (by denying us the ability to fix bugs) was not a mistake. Then, without even as much of a curtesy euphemism, said they’d burn down our store (remove our app!), lest we paid up. DHH (@dhh) June 16, 2020 This is while @RepCicilline is literally preparing another hearing on big tech antitrust where @tim_cook might be asked to appear! While the DOJ is taking to witnesses of App Store abuses! While @vestager and her team is investigating. HOW BRAZEN CAN YOU GET?! DHH (@dhh) June 16, 2020 It’s clear that Apple feel like they’re now so far above the trifling concerns of antitrust law that even while under the scrutiny of regulators and justice departments on TWO CONTINENTS, they can still afford to tighten the screws. Gotta make that pivot to services pay!! DHH (@dhh) June 16, 2020 Apple has been capriciously, inconsistently, and in a few cases, cruelly, enforcing their App Store policies for YEARS. But most of the abuses were suffered by smaller developers without a platform and without recurse. Apple saw that it worked, and that it paid. Now moving up. DHH (@dhh) June 16, 2020 This is exactly the issue I gave testimony in front of congress earlier this year! We hadn’t yet launched HEY, but I said it worried me, what Apple might do, if you’re in direct competition with them. And now we know what they’d do. Attempt to crush us. https://t.co/HIBuzk1ilv DHH (@dhh) June 16, 2020 But while I’m sure Apple’s attempt to cut off the air supply to the likes of @spotify is board-room stuff, I think what we’re facing is simply the banality of bureaucracy. Apple has publicly pivoted to services for growth, so KPIs and quarterly targets trickle down. DHH (@dhh) June 16, 2020 And frankly, it’s hard to see what they have to fear. Who cares if Apple shakes down individual software developers for 30% of their revenue, by threatening to destroy their business? There has been zero consequences so far! Most such companies quietly cave or fail. We won’t. DHH (@dhh) June 16, 2020 There is no chance in bloody hell that we’re going to pay Apple’s ransom. I will burn this house down myself, before I let gangsters like that spin it for spoils. This is profoundly, perversely abusive and unfair. DHH (@dhh) June 16, 2020 Yesterday was such a happy day. We’ve worked so diligently for over two years to make HEY. The press and customer reactions were making me euphoric. To have Apple, of all companies, be the ones to piss in our puree, and ruin that moment, is just personally heartbreaking 💔😩 DHH (@dhh) June 16, 2020 I don’t think people understand. We did everything we were supposed to with the iOS app. Try downloading it (while you can?). You can’t sign up, because Apple says no. We don’t mention subscriptions. You can’t upgrade. You can’t access billing. We did all of it! Wasn’t enough. DHH (@dhh) June 16, 2020 We’ve been in the App Store with Basecamp for YEARS. We know the game. It was always rigged. It was always customer-hostile, deeply confusing, but the unstated lines were reasonably clear. Now Apple has altered the deal, and all we can do is prey they don’t alter it further. DHH (@dhh) June 16, 2020 *Pray, although, it does feel like we are prey for Apple’s pivot to services. The need to juice that trillion dot five dollar valuation by showing ever higher growth. DHH (@dhh) June 16, 2020 Here’s the rejection letter. I love how they frame their shakedown as “offer customers the option”. Not a single mention of the fact that Apple will take 15-30% of our business through this. THIS IS ALL JUST FOR THE CONSUMER GOOD, YOU SEE. pic.twitter.com/rzQbsfCHvs DHH (@dhh) June 16, 2020 But this is preposterously false and inconsistent. The Basecamp app has been in the App Store for YEARS offering access to a subscription bought elsewhere. The store is FULL of apps doing just that. Even other email apps! A few examples we compiled: pic.twitter.com/MYC1KF1Xfr DHH (@dhh) June 16, 2020 Apple sees no need to even justify these discrepancies, because this is what ultimate market power affords you. Apple’s review literally said on the phone, when we raised these objections: “We are not going to talk about other apps”. Abusive is case by case. DHH (@dhh) June 16, 2020 This certainly does not get any better by the fact that we’re technically competing with Apple head-on now. Apple sells email services as part of their iCloud bundle. So not only are they running the only shop in iPhone town, they’re also selling their own competing service. DHH (@dhh) June 16, 2020 Remember the Apple pirate flag? When being a pirate meant being a rebel? Countering the navy, the establishment? Now this flag is a better symbol for Apple plundering small, independent software developers. https://t.co/7q1jY2M67q DHH (@dhh) June 16, 2020 I hear from a little bird that March was the date for the new, extractive stance. The policy 3.1.1 didn’t change, but Apple apparently decided in March that it could be a growth opportunity to start enforcing it harshly. That’s why old apps haven’t been hit yet. Just fresh prey. DHH (@dhh) June 16, 2020 This is scary. Apple is doubling down on the threat to forcefully remove us from the App Store, unless we pay the ransom. If you think you might ever want to use HEY, you might want to download the app now. HOW IS THIS HAPPENING?! 😩💔😱 https://t.co/Ja8FaFjBZ8 DHH (@dhh) June 16, 2020 When I testified in front of @RepCicilline, @RepJoeNeguse, and @RepKenBuck earlier this year, specifically about Apple’s App Store abuses, I never thought I’d need to repeat my OBI-WAN KENOBI cry for help so soon. But here we are. Begging not to be squashed by Apple 🙏🙏 DHH (@dhh) June 16, 2020 We’ve invested millions of dollars, and years of effort, into building HEY. We’re already taking on Google’s stronghold of Gmail. Listen, I don’t mind a loop-sided fight, but we can’t run a business wrestling Google with one arm and Apple with the other. It’s just too much. DHH (@dhh) June 16, 2020"
