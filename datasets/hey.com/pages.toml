["https://www.hey.com/collections"]
title = "HEY — Collections"
description = "With Collections, unwieldy projects become manageable, sharing everything at once becomes possible, and what’s always been a big hassle, becomes no big deal."
full_description = "With Collections, unwieldy projects become manageable, sharing everything at once becomes possible, and what’s always been a big hassle, becomes no big deal. It quickly became a hard to follow mess. As time went on, and replies and threads piled up, it became increasingly difficult to loop other people in and bring them up to speed without forwarding a bunch of emails they had to read backwards. And then, when it was time to hand the project off to someone else, there was no good way to transfer everything over neatly at once. Nothing got easier, everything got harder. It was the pits. We wondered: Why is it so hard to run a project over email? It’s because email was built for short, single-thread discussions, not multiple threads with different people coming and going over time. But that’s exactly how many modern email conversations evolve, especially at work. So we decided to invent a new feature in HEY to make it all possible — and feel great. That’s where Collections come in. Without HEY You know the drill. You need to find that one file for that one project, and the hunt begins. Thread by thread, email by email, scrolling through replies until you find what you’re looking for. A huge waste of time. With HEY Collections do a simple, but incredibly useful thing; surface all the attachments from all the threads and put them at the top of the page. Everyone will always know where to look for the files they need. No hunting. No wasted time. No having to ask for someone to give you the file you need. Without HEY Normally if you need to discuss an ongoing email thread with a different set of people (or need a backchannel to just discuss something internally), you start up yet another email thread and add another layer of chaos to an already chaotic mess. Or you take the internal conversation off to another tool or product, splintering the truth in different places. Yuck. With HEY Anyone in your company with access to the Collection can add for-your-eyes-only, backchannel comments directly to the Collection. Everyone on the Collection will see them, but anyone outside your company will not. And since they’re added to the same timeline as the rest of the emails, everyone always has the full context in one place."
year_published = 2025
