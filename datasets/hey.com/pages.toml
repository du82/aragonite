onfried wow I just got my invite code… I cannot believe how smooth the UI is especially on mobile screen! More amazing is the quick loading of different pages — it’s like instant load. Great work @basecamp team. Imad Sabonji Didn’t expect my HEY invite today and it’s living nicely on my dock. Such a fantastic email experience. Happily support the great work @jasonfried @dhh and the entire @basecamp team! Caleb After using HEY for email for the past couple weeks. I just love it. Reply Later is awesome. Helps me focus. Jethrojones You have made a great product. It is so well designed. Take my money. Using Outlook for work after using HEY is like pulling teeth. The wisdom in design Finally, I got on HEY I must say the design looks flawless, enjoying it a lot so far. If somebody wants to “hey” me, you can do it — nikolay.tsanov@hey.com, surprised that somebody already took nikolay@hey.com. Thanks @dhh @jasonfried @jonasdowney and rest 🙏 Nikolay Tsanov Love, customer for life. I can only imagine what they will do from here ✨ Adelle Charles In the past 15 years, we have been heavy Gmail users. Call it early adopters. It was free and exciting. But this is a new era, and @jasonfried and @dhh just fixed email 🔥 We understand that there’s no such thing as free. You pay with your data! Stoked with the invitation🤙 guys! livethelifetv.eth HEY, this finally feels like email designed in 2020! 👏 Loving the onboarding experience, setting up forwarding now; annoying sellers shall not pass the screener! 🙅‍♀️ Thanks, @jasonfried @dhh & the rest of the @basecamp team! 🙏 Alja Isakovic I got my HEY invite while waiting for my first haircut in 5 months. Guess which one I’m more excited about?! Never thought I’d be excited to check my inbox when I get home! @jasonfried @dhh Peter Nguyen Just got my invite to try out @dhh and @jasonfried’s HEY. Someone had to change the way we think about email, and they nailed it! Oscar Peña @jasonfried I’m several minutes into “Take a tour of HEY” on YouTu