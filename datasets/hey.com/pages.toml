title = "HEY — Send massive files without using other apps"
description = "Sending big files via email is a hassle. You usually have to use Dropbox, yousendit, WeTransfer, or something like that. Nonsense. With HEY, just attach the file and we’ll send the recipient a direct link to download it."
full_description = "Sending big files via email is a hassle. You usually have to use Dropbox, yousendit, WeTransfer, or something like that. Nonsense. With HEY, just attach the file and we’ll send the recipient a direct link to download it. Does the other person have to have a HEY account too? Nope. It doesn’t matter what email service they use, they can still download any large files you send them as long as you use HEY to send the files. Does the download link expire? Nope. Someone can return to that email a year from now and still grab the file. It’s as if the file was actually attached to the email. Can I tell when they’ve downloaded the file? No, we don’t track downloads. We think tracking behavior is an invasion of people’s privacy, and we’re for privacy, not against it."
