full_description = "Dead Reckoning Dead Reckoning by Karen Perkins An historical adventure of piracy, love and revenge in the Caribbean in the seventeenth century. Leo is born in Spanish Panama in 1659. When he is twelve years old he witnesses the violent rape and murder of his mother by three of the Caribbean’s most feared pirates: Tarr, Blake and Hornigold, and swears revenge at all costs. Gabriella is trapped in an abusive marriage to a ruthless Dutch slave trader, who is in business with the same English cut-throats. She risks all to escape with her life. Leo and Gabriella meet aboard one of the most horrific ships in the Caribbean – a slaver – and join forces against their common enemy. They face a number of challenges as they battle not only the dangers of a life at sea, including storm, drowning, and being cast adrift in a crippled ship, but also repeated attacks by Blake and Hornigold. But their biggest threat proves to be each other. Can they reconcile their hearts in time for the fiercest battle in their quest of revenge, and survive the gallows? Dead Reckoning, the third book in the Valkyrie series was long-listed in the 2011 Mslexia Novel Competition and is a number one bestseller in UK Sea Adventures on Amazon (136,000 words; available as ebook and print) buy on amazon “The author shows a real grasp of all things pirate, and has clearly researched in depth about what life would have been like on board a ship for both the captain and crew of the Sound of Freedom. The setting and the characters feel right for the time period, and it is easy to switch off from modern life to tune into the story as it seems believable. It is easy to get to the heart of the people involved, and the author doesn’t concentrate on the main characters alone. The story is gritty and realistic, and as a result gives a more realistic account of how people would have behaved during that time.” —Sandra Scholes, www.loveromancepassion.com Share on social media:Click to share on Facebo