description = "Now and Then Stab by Anna Castle “Spring, 1593. An anonymous ballad calling for violence against foreign refugees is posted in the heart of London. The mayor offers one hundred crowns for the author’s name. Thomas Clarady wants that money and drags Francis Bacon in to help. At first it’s just a riddle to be solved.… Read More »Now and Then Stab"
full_description = "Now and Then Stab Now and Then Stab by Anna Castle “Spring, 1593. An anonymous ballad calling for violence against foreign refugees is posted in the heart of London. The mayor offers one hundred crowns for the author’s name. Thomas Clarady wants that money and drags Francis Bacon in to help. At first it’s just a riddle to be solved. Tom talks to poets, while Francis analyzes the verse. The search takes a dangerous turn when the authorities focus on two popular playmakers. One is cruelly tortured. Another is killed in dubious circumstances. The official story seems plausible, at first. But Tom doesn’t buy it. He refuses stop digging, uncovering a plot he should have left buried. Bacon and his team hazard their lives and reputations to find the truth. Whether justice can be obtained is another matter.” (Available as ebook and print) Buy on Amazon All other retailers Share on social media:Click to share on Facebook (Opens in new window)Click to share on Twitter (Opens in new window)Click to print (Opens in new window)Click to email a link to a friend (Opens in new window)MoreClick to share on Reddit (Opens in new window)"
