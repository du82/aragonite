["https://hfebooks.com/haunting-of-thores-cross"]
title = "The Haunting of Thores-Cross - Historical Fiction eBooks"
description = "The Haunting of Thores-Cross by Karen Perkins A haunting novel set in the North Yorkshire Moors about isolation, superstition and persecution. Thores-Cross follows the stories of Emma, a present day writer, and Jennet, an eighteenth century witch. Emma Moorcroft is still grieving after a late miscarriage and moves to her dream house at Thruscross Reservoir with… Read More »The Haunting of Thores-Cross"
full_description = "The Haunting of Thores-Cross The Haunting of Thores-Cross by Karen Perkins A haunting novel set in the North Yorkshire Moors about isolation, superstition and persecution. Thores-Cross follows the stories of Emma, a present day writer, and Jennet, an eighteenth century witch. Emma Moorcroft is still grieving after a late miscarriage and moves to her dream house at Thruscross Reservoir with her husband, Dave. Both Emma and Dave hope that moving into their new home signifies a fresh start, but life is not that simple. Emma has nightmares about the reservoir and the drowned village that lies beneath the water, and is further disturbed by the sound of church bells – from a church that no longer exists. Jennet is fifteen and lives in the isolated community of Thores-Cross, where life revolves about the sheep on which they depend. Following the sudden loss of both her parents, she is seduced by the local wool merchant, Richard Ramsgill. She becomes pregnant and is shunned not only by Ramsgill, but by the entire village. Lonely and embittered, Jennet’s problems escalate, leading to tragic consequences which continue to have an effect through the centuries. Emma becomes fixated on Jennet, neglecting herself, her beloved dogs and her husband to the point where her marriage may not survive. As Jennet and Emma’s lives become further entwined, Emma’s obsession deepens and she realises that the curse Jennet inflicted on the Ramsgill family over two hundred years ago is still claiming lives. Emma is the only one who can stop Jennet killing again, but will her efforts be enough? Silver Medal Winner, European fiction – 2015 Independent Publisher Book Awards #1 Bestseller British Horror#1 Bestseller Occult, Ghosts & Haunted Houses#1 Bestseller Gothic RomanceOver 100 5-STAR reviews on Amazon.com (75,000 words; available as ebook, print, and audiobook) buy on amazon “The writing is near flawless. Your voice is crisp and natural, carrying the reader into lives of the characters and the world you have created seamlessly.” — Lauren Grey, author of ‘Threads of Time’ “I love your historicals. They feel so real. I can already tell this one is excellent. The back and forth between Emma’s modern life and Jennet’s 18th century life is tantalizing.” —Laura Emmons, author of ‘Seeing Magic’ and ‘Healing Hands’ “A wonderful piece of writing.” — Lin Churchill, author of ‘Pride’ “Overall I can see this attracting readers of both contemporary and historical fiction. It seems that it will gravitate around characters and relationships so perhaps it may have more appeal to women. It was a pleasure to read, Karen and it’s setting up the connection between past and present very well” — Lesa Clarke, author of ‘The Glass House’ “Wow, I’ve never been into ghost stories before, but this is great!” – Lesley Taylor, author of ‘Heart-Brother’ and ‘Changeling’. “Startling but extremely accurate use of language . . . Very emotive and skilfully handled . . . I found your writing fluid and accurate but more importantly, completely enthralling.” — R.M.A., author of ‘The Snow Lily’ “This is terrific.” — Chris Bostic, author of ‘Game Changer’ and ‘Fugitives From Northwoods’ “As always, your writing is impressive and so is your knowledge of boats. You have clearly taken the time to research the area, the herbs and other various concepts within your book, and it shows and makes the story that much stronger throughout. I really enjoyed this book, truly, and I’m glad I had the opportunity to read it. Well done.” — Claire C Riley, author of ‘Limerence’ “I love the way you handle your characters and the way you blend them into the book from the word go but in such a clever way. I can see this has taken you some time to plan out as I can see the way you start a part of the story to know how that particular part is going to end. There is a really nice narrative here coupled with a brilliant flow and pace to it. You have done well and I like this a lot.” — Sean Connolly, author of British Army on the Rampage. (B.A.O.R) “Very well crafted… a fantastic read” — Annabel Watkinson, author of ‘The Year of Us’ “This is an excellent example of the timeslip genre. Both Jennet’s and Emma’s voices are realistic and representative of the two different timeframes. Each of the two life stories has a good hook, making both characters equally interesting. This promises to be a rattling good story.” — Lynne Jones author of The Beaumont Bequest Share on social media:Click to share on Facebook (Opens in new window)Click to share on Twitter (Opens in new window)Click to print (Opens in new window)Click to email a link to a friend (Opens in new window)MoreClick to share on Reddit (Opens in new window)"
