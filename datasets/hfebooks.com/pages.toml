title = "Privacy Policy - Historical Fiction eBooks"
description = "HFEBOOKS.COM PRIVACY POLICY This privacy policy discloses the privacy practices for the website hfebooks.com. This privacy policy applies solely to information collected by this website. It will notify you of the following: What personally identifiable information is collected from you through the website, how it is used and with whom it may be shared. What… Read More »Privacy Policy"
full_description = "HFEBOOKS.COM PRIVACY POLICY This privacy policy discloses the privacy practices for the website hfebooks.com. This privacy policy applies solely to information collected by this website. It will notify you of the following: What personally identifiable information is collected from you through the website, how it is used and with whom it may be shared. What choices are available to you regarding the use of your data. The security procedures in place to protect the misuse of your information. How you can correct any inaccuracies in the information. INFORMATION COLLECTION, USE, AND SHARING We don’t collect anything other than your email address and whatever information you voluntarily provide. We will never sell or rent this information to anyone. We don’t share it for free either. We will use your information to respond to you, if you ask for a response. We will not share your information with any third party. If you subscribe to our blog feed, you’ll receive a post at most once or twice a week. You can unsubscribe from the blog very easily at any time, using the usual methods. There’s an unsubscribe link in every emailed post or if you are using an RSS reader there will be instructions on how to unfollow this blog. Here’s what gets collected where: Blog: You supply your email address, which is kept. Blog comments: If you choose to comment and provide your name and email address, we don’t use this information for anything, especially not to harvest email addresses. Contact: If you send an email, we would only use that email to respond to you. SHARING INFORMATION We don’t sell anything from this website, so we don’t collect anything more sensitive than your email address, which you give voluntarily. There’s no place for you to log in, so no passwords are collected. If you want to buy one of our books, you can follow a link to a bookstore. Nothing about that link-following is recorded here. THIRD PARTY COOKIES Our site links to many bookstores, like Amazon and Kobo. Some of these sites may create a cookie telling them where you came from. We don’t create it or keep that information. Similarly, we have buttons to go to our social media sites, like Facebook. We don’t track your use of these buttons, but Facebook, Twitter, etc. might create a cookie saying that you got there via our website. LINKS This website contains links to other sites, like online bookstores. Please be aware that we are not responsible for the content or privacy practices of any other site. We encourage users to notice when they leave mlouisalocke.com and to read the privacy statements of any other site that collects personal information. UPDATES Our Privacy Policy may change from time to time and all updates will be posted on this page. If you feel that we am not abiding by this privacy policy, you should contact us immediately. Click Here for Contact Page"
