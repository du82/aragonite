full_description = "Tidewater Tidewater by Libbie Hawker In 1607, three ships arrive on the coast of Virginia to establish Jamestown Colony. One girl’s life—and the lives of her people—are changed forever. To Pocahontas and her people, the Tidewater is the rightful home of the Powhatan tribe. To England, it is Virginia Territory, fertile with promise, rich with silver and gold. As Jamestown struggles to take root, John Smith knows that the only hope for survival lies with the Powhatan people. He knows, too, that they would rather see the English starve than yield their homeland to invaders. In the midst of this conflict, Pocahontas, the daughter of the great chief, forges an unlikely friendship with Smith. Their bond preserves a wary peace—but control can rest only in one nation’s hands. When that peace is broken, Pocahontas must choose between power and servitude—between self and sacrifice—for the sake of her people and her land. (Word count 160,000; available in ebook, print, audiobook) Buy on Amazon Share on social media:Click to share on Facebook (Opens in new window)Click to share on Twitter (Opens in new window)Click to print (Opens in new window)Click to email a link to a friend (Opens in new window)MoreClick to share on Reddit (Opens in new window)"
