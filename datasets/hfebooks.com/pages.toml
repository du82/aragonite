full_description = "Interrupted Aria Interrupted Aria by Beverle Graves Myers Venice, 1731. Disaster strikes Tito’s opera premiere when the singer loses one beloved friend to poison and another to unjust accusation and arrest. Alarmed that the merchant-aristocrat who owns the theater is pressing the authorities to close the case, Tito races the executioner to find the real killer. The possible suspects could people the cast of one of his operas: a libertine nobleman and his spurned wife, a jealous soprano, an ambitious composer, and a patrician family bent on the theater’s ruin. With carnival gaiety swirling around him and rousing Venetian passions to an ominous crescendo, Tito finds that the most astonishing secrets lurk behind the masks of his friends and family.(94,000 words; available as ebook, print, and audiobook) buy on amazon “Ah! Opera in Venice! What could be more romantic and exciting?” —Sara Berger, Mysterious Women “In mystery as in music, excitement and pleasure come from brilliant variation, brilliantly controlled. Here it is.” —Jeanne M. Jacobson, The Drood Review Share on social media:Click to share on Facebook (Opens in new window)Click to share on Twitter (Opens in new window)Click to print (Opens in new window)Click to email a link to a friend (Opens in new window)MoreClick to share on Reddit (Opens in new window)"
