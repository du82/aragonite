description = "Ill Wind A Caribbean Pirate Adventure, a novella by Karen Perkins Gabriella Berryngton is an unhappy and oppressed fourteen-year-old girl living in the Massachusetts Bay Colony in 1683. She dreams of escaping her bitter, ambitious stepfather and sailing off into the unknown. Her dreams come true when her stepfather sells her into marriage. Aboard the… Read More »Ill Wind"
full_description = "Ill Wind Ill Wind A Caribbean Pirate Adventure, a novella by Karen Perkins Gabriella Berryngton is an unhappy and oppressed fourteen-year-old girl living in the Massachusetts Bay Colony in 1683. She dreams of escaping her bitter, ambitious stepfather and sailing off into the unknown. Her dreams come true when her stepfather sells her into marriage. Aboard the Freyja, she is hopeful that her new life in the Dutch West Indies will be an improvement—a hope that dies when she is given a slave, Klara, and a whip. She discovers that her soon-to-be father-in-law is a ruthless slave trader in league with pirates, and her fiancé is cold, unfriendly and disinterested in Gabriella. She is little more than a vessel to provide the next generation of van Eckens. Largely ignored and desperately unhappy, she and Klara develop a friendship which makes life bearable, at first. Once married, Gabriella’s life takes a turn for the worse and she descends into a world of horror and abuse until tensions finally explode. Life will never be the same and she has no choice but to take fate into her own hands. Ill Wind is the second book in the Valkyrie series and is a number one bestseller in UK Sea Adventures on Amazon (35,000 words; available as ebook and print) buy on amazon Share on social media:Click to share on Facebook (Opens in new window)Click to share on Twitter (Opens in new window)Click to print (Opens in new window)Click to email a link to a friend (Opens in new window)MoreClick to share on Reddit (Opens in new window)"
