["http://www.hick.org/~mmiller"]
title = "mmiller [at] hickorg"
full_description = "[ slides, video ] Trends, challenges, and strategic shifts in the software vulnerability mitigation landscape (BlueHat Israel 2019) [ slides ] Microsoft's strategy and technology improvements toward mitigating arbitrary native code execution (CanSecWest 2017), with David Weston. [ slides ] Modeling the exploitation and mitigation of memory safety vulnerabilities (Breakpoint 2012). [ slides ] Targeted taint driven fuzzing using software metrics (CanSecWest 2011), with Dustin Duran and David Weston. [ slides ] The Evolution of Microosft's Exploit Mitigations: Past, Present, and Future (CanSecWest 2009), with Tim Burrell. Using dual-mappings to evade automated unpackers (Oct, 2008) Automated unpackers such as Renovo, Saffron, and Pandora's Bochs attempt to dynamically unpack executables by detecting the execution of code from regions of virtual memory that have been written to. While this is an elegant method of detecting dynamic code execution, it is possible to evade these unpackers by dual-mapping physical pages to two distinct virtual address regions where one region is used as an editable mapping and the second region is used as an executable mapping. In this way, the editable mapping is written to during the unpacking process and the executable mapping is used to execute the unpacked code dynamically. This effectively evades automated unpackers which rely on detecting the execution of code from virtual addresses that have been written to. Modeling the trust boundaries created by securable objects (Jul, 2008) One of the most critical steps of any security review involves identifying the trust boundaries that an application is exposed to. While methodologies such as threat modeling can be used to help obtain this understanding from an application's design, it can be difficultcult to accurately map this understanding to an application's implementation. This difficultculty suggests that there is a need for techniques that can be used to gain a better understanding of the trust boundaries that exist within an application's implementation. To help address this problem, this paper describes a technique that can be used to model the trust boundaries that are created by securable objects on Windows. Dynamic instrumentation is used to generate object trace logs which describe the contexts in which securable objects are defned, used, and have their security descriptor updated. This information is used to identify the data flows that are permitted by the access rights granted to securable objects. It is then shown how these data flows can be analyzed to gain an understanding of the trust boundaries, threats, and potential elevation paths that exist within a given system."
