full_description = "Hi. I'm rixon. I'm just this hacker. No, I don't break into computer systems, install viruses, or steal your identity. I just investigate the world and its contents to understand how it all ticks. Here's my closet of clutter on the information superhighway (remember that buzzword?) Right away, here's an index of the crap I have here. If that's not good enough, you can get ahold of me on gmail (rixoff), or on twitter (@rixon). I'm just about everywhere, either as rixon, or rixoff if some yahoo got to the good username before I could. It is clear that I should learn to use this shit and stop making play pages. I think I'll pick up HTML and CSS pretty quick, (rather, RELEARN this shit,) but that look and feel is going to be the hard part. I'm not artsy. It takes an artsy-fartsy to make a nice page layout. This is emphasis and this is bold. This is emphasis.bold, and this is bold.uppercase. What do you think of that?"
