title = ":: Robert Hickman Biography::"
description = "Hickman Industries. The website of Robert Hickman."
full_description = "Robert Hickman�s installations and sculptures have been exhibited in solo and group shows at New York venues PS1, SculptureCenter, Exit Art, White Columns, Socrates Sculpture Park, Smack Mellon, and Saint Peters Church, among many others. His permanent public commissions are at 72nd Street and Broadway subway station in New York (Laced Canopy); Bryant Avenue pedestrian bridge, Hunts Point, Bronx (Silvered); Capital Community College, Hartford, CT; and Roosevelt Island Station, New York. Hickman recently completed a public art commission for the Woodhaven Select Bus Service street improvement project by the NYC Department of Cultural Affairs Percent for Art Program and DOT. He has been reviewed in publications such as Art News, Sculpture Magazine, Time Out, New York Magazine, The New York Times, The New York Post, New York Daily News, and The Miami Herald. Hickman�s work was recognized by many national and international awards, among them two CEC Artslink Project Grants and a New York City MASterwork Award for Best New Public Art from The Municipal Society of New York. He has been awarded residencies at Yaddo, the Hambidge Center, the Woodstock Byrdcliffe Guild, and the Vermont Studio Center. An Ohio native, Hickman is an Assistant Adjunct Professor at Hunter College, a Part-time Lecturer at The New School, and serves on the board of Smack Mellon. He lives and works in Brooklyn, and has ridden his bicycle across the USA five times."
