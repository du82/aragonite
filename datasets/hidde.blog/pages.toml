full_description = "Blog Posts about HTML, CSS, JavaScript, accessibility and browsers from the perspective of a curious front-end developer. All 224 of them. For shorter writings, follow @hdv@front-end.social (@hdv RSS). Categories books (10) events (47) front-end (25) industry (9) security (2) CSS (17) performance (1) Web Components (3) design systems (2) accessibility (44) elsewhere (3) personal (19) ethics (6) UX (1) ai (7) meta (6) primers (3) web platform (8) privacy (2) workflow (2) media (3) travel (1) sustainability (1) RSS (full) Blog roll Views on views on 28 February 2025 Web pages hold us back. What about views? What I got up to in 2024 on 29 December 2024 Some highlights from my 2024. Turn off AI features by default (to reduce their climate impact) on 30 November 2024 If users don't use a future that requires a lot of energy and water, that's wasteful. Making such features opt-in is the right thing to do. Trains are offices on 29 November 2024 Some thoughts on traveling by train The open web, MIDI and assistive tech: State of the Browser 2024 on 15 September 2024 My writeup of State of the Browser 2024. Comparing design systems to find the best qualities on 10 August 2024 It's not easy to build very good UI components. A global effort to try and find the best qualities of components would be a great opportunity to improve components everywhere. On authoring tools in EN 301 549 on 10 April 2024; last updated on 11 April 2024 Notes from discussions on 11.8, the part of EN 301 549 that is about authoring tools. On popover accessibility: what the browser does and doesn’t do on 21 March 2024 What does “built in accessibility” actually mean for browsers that support popover? Breadcrumbs, buttons and buy-in: Patterns Day 3 on 8 March 2024 My write-up of the third Patterns Day. “AI” and accessible front-end components: is the nuance generatable? on 1 March 2024 Are LLMs helpful tools to assist with making accessible front-end components? Let's find out. Sharing links on 12 January 2024 This blog has a new section where I share links to posts I read in other places. Clippy returned (as an unnecessary “AI”) on 6 January 2024 This week I used an “AI” feature that struck me as somewhat unnecessary. 2023 in review on 24 December 2023 Some highlights from my 2023. Answers to common (web) accessibility questions on 2 November 2023; last updated on 4 November 2023 Common questions I hear about web accesssibility with short, low on nuance answers. Ableist interactions on 16 September 2023 When someone called out lack of accessibility, they got ableist responses. This post has a collection of those responses and an explanation of why they're problematic. Co-organising Design Systems Week 2023 on 25 August 2023; last updated on 10 September 2023 Design systems come with a lot of promises. While those promises can be realised, that's not a given. And there's a lot to be said about process and how it works on the inside. During Design Systems Week, we'll get a peak into of the work of some very interesting teams. It's pretty rude of OpenAI to make their use of your content opt-out on 14 August 2023 OpenAI, the company that makes ChatGPT, now offers a way for websites to opt out of its crawler. By default, it will just use web content as it sees fit. How rude! “AI” content and user centered design on 28 July 2023; last updated on 31 July 2023 When organisations force LLM-output on users instead of paying people to create their content, they don't center users. Joining CSSWG on 21 July 2023 I'm joining the CSS Working Group as an Invited Expert. Positioning anchored popovers on 12 June 2023; last updated on 6 May 2024 Popovers are in the top layer, how can we position them relative to invokers that are not? Semantics and the popover attribute: which role to use when? on 16 May 2023; last updated on 30 April 2024 The popover attribute adds behaviour, but not a role. Which role should you use in combination with the popover attribute? Back to freelance on 10 May 2023 I have returned to working as an independent front-end / accessibility / devrel person. Neither artificial, nor intelligent on 30 March 2023 Large Language Models (LLMs) and tools based on them (like ChatGPT) are a popular topic among technologists today. I struggle with the optimism I see from businesses, the haphazard deployment of these systems and the seemingly ever-expanding boundaries of what we are prepared to call “artificially intelligent”. My ideal accessible components resource is holistic, well tested and easy to use on 8 March 2023 To improve accessibility of the web as it is today, I feel we dearly need accessibility guidance that is holistic, well tested and easy to use. 200 on 14 February 2023 A bit meta: this post is about how I blog and what I wrote about in the last while. Browser built-in search and ATAG A.3.5.1 on 27 January 2023 I wondered if Ctrl/⌘ + F in a browser can be a way to meet ATAG A.3.5.1 Data-informed flex-grow for illustration purposes on 13 January 2023 I had some fun creating illustrations using page count data as flex-grow values. 2022 in review on 26 December 2022 Some highlights from my 2022. Mostly on Mastodon on 12 December 2022 There are now even more reasons to use Mastodon over Twitter. ACT Rules CG published implementations on 5 December 2022 What is the ACT Rules CG and why is it great they published implementations? My experience at Modern Frontends Live on 19 November 2022 I spoke at an event that turned out to have some lies surrounding it, documenting this for future reference. Dialogs and popovers seem similar. How are they different? on 8 November 2022; last updated on 17 September 2024 A deep dive into the semantics, behaviours and characteristics of some of the most common user interface elements of websites today. Is this the last exodus from Twitter? on 6 November 2022 There have been reasons to leave Twitter since its inception. But it's increasingly compelling to post somewhere else. Do we need an Interop for assistive technologies? on 30 October 2022 Interop 2022 makes a great impact for web developers, should something like an accessibility-specific Interop exist? 2.4.11 Focus Appearance adds more complexity to WCAG than we should want on 24 September 2022 My worries about a proposed new WCAG Succes Criterion: 2.4.11 Focus Appearance. Better accessible names on 13 September 2022 Six tips on coming up with accessible names The last dConstruct on 10 September 2022 My writeup of the last dConstruct. What's new in WCAG 2.2? on 6 September 2022; last updated on 5 October 2023 WCAG 2.2 has officially reached “Candidate recommendation” status, meaning it is pretty close to becoming an official standard. What's new? Re: AI for content creation on 30 August 2022 Content that is created with the aid of machine learning lacks a human touch that is worth caring about. How I use Twitter on 19 August 2022 I like Twitter, but only with some modifications. Keyboard shortcuts need modifier keys on 5 August 2022 Keyboard shortcuts can make your website or app much more keyboard friendly. But they need modifier keys. Individual climate action: small steps matter on 28 July 2022 A response to other posts about climate action With :focus-visible, you can have focus styles when it makes sense on 21 July 2022 On why :focus-visible is more than a way to target keyboard users only. Two levels of customising <selectlist> on 4 July 2022; last updated on 16 August 2023 There will be two levels of customisation in selectmenu: via CSS or via replacing parts. Two talks about documentation on 1 July 2022 Some notes from two talks I saw recently about making better documentation. “That's not accessible!” and other statements about accessibility on 30 June 2022; last updated on 15 August 2024 Is the accessibiliy of a website a binary thing? It depends! How I built a dark mode toggle on 20 June 2022 I added a dark mode toggle to this site. This is how. ATAG: the standard for accessibility of content creation on 29 May 2022 A primer to ATAG, the accessibility standard that applies to tools that create web content. Accessibility from different perspectives on 22 May 2022 I've worked in web accessibility in various positions, this post is about how the accessibility-specialised developer's position can be difficult. More common accessibility issues that you can fix today on 16 May 2022 As a follow up to my previous post about common accessibility issues, I have written out five more issues that you could fix today. Test in many browsers on 12 May 2022 In which I explain why I feel it's still a great habit to test in many different browsers and browser engines. Action, inaction and ‘cancel culture’ on 6 May 2022 Some thoughts on banning certain content from communities versus not doing that. The URLs are new on 15 April 2022 I've updated the URL these posts live on. Common accessibility issues that you can fix today on 12 April 2022 Tips based on WebAIM’s “Million” survey. Photo blogging with Sanity and Eleventy on 23 March 2022 On how I built a photo blog with Sanity and Eleventy. Menlo Park on 26 February 2022 Curiosity and crossing disciplines can result in better products. Re: nuance in ARIA on 28 January 2022 A quick response to Dave Rupert’s post on HTML and ARIA. More to give than just the div: semantics and how to get them right on 23 January 2022 A write-up of my talk about semantics. Use Firefox with a dark theme without triggering dark themes on websites on 12 January 2022 A quick tip to make Firefox’s prefers-color-scheme implementation respect system colour preferences rather than browser theme colours. Boolean attributes in HTML and ARIA: what's the difference? on 12 January 2022 Some attributes in ARIA are boolean(-like). These attributes may seem a lot like boolean attributes in HTML, but there are some important differences to be aware of. Joining Sanity on 7 January 2022 I will start a new job. The web doesn’t have version numbers on 3 January 2022 I think there are lots of exciting uses for the web outside the realm of ‘web3’. Twitter needs manual language selection on 30 December 2021 Thoughts about auto-adding lang attributes. 2021 in review on 28 December 2021 Some highlights from my 2021. How many people with disabilities use our site? on 5 December 2021 Many ask ‘How many users with disabilities use our site?’ We probably don’t need to know, if we need to decide whether to improve web accessibility on our sites. The better version of digital life is real life, not ‘the metaverse’ on 4 December 2021 A look at Facebook’s new ideas through the lense of their current endeavors. Meeting “2.2.2 Pause, Stop, Hide” with prefers-reduced-motion on 3 December 2021 I’m a little torn on whether to see prefers-reduced-motion as a sufficient way to meet 2.2.2 Pause, Stop, Hide. My thoughts. In person on 16 November 2021 I experienced my first web conference during The Situation. Patterns on 2 November 2021 I attended a conversation with Cecilia Kang. These are some thoughts about An Ugly Truth and Facebook. Subsets and supersets of WCAG on 8 September 2021 Many use WCAG as a baseline to ensure web accessibility. In this post, I look at doing less and doing more than the standard. Trying out spicy sections on here on 17 August 2021 This week I had some fun adding the experimental spicy-sections custom element to this website. How AI is made matters, confirms “Atlas of AI” on 16 August 2021 My review of Atlas of AI. A case for accessibility statements in app stores on 3 August 2021 In which I argue app stores need fields for accessibility meta information. Solutionism on 28 June 2021 In which I talk about why fallbacks are good. Introducing: an Eleventy starter project for WCAG reports on 24 May 2021 I’ve released the code I use to generate WCAG conformance reports using the Eleventy static site generator. Here’s some context. 150 on 18 May 2021 This post is my 150th, so I decided to write about writing and look back at some of the posts. Criticism pushes the web forward on 8 May 2021 It may not be easy, but it is important to include perspectives outside your own. What's ‘normative’ in WCAG? on 27 April 2021 In which I go into the difference between normative and non-normative in WCAG. Queuing up on 25 April 2021 Meetings are better with queues. Here’s why. Accessible front-end components: claims vs reality on 2 April 2021 Not all ‘accessible components’ are created equal. Find out which will work best for our end users with this checklist. My typical day on 15 February 2021 My part in a blogging chain about daily life. It's easier when you do it earlier on 4 February 2021 Web accessibility becomes easier and cheaper, when you address it earlier. How I turned my Goodreads data into a self-hosted website with Eleventy on 4 January 2021 So that I could control what and how to display. 2020 in review on 17 December 2020 Some highlights from my 2020. Why it's good for users that HTML, CSS and JS are separate languages on 25 November 2020 A response to an idea to merge HTML, CSS and JavaScript into one language. When there is no content between headings on 5 September 2020 Why having no content between headings can be problematic. Equality, a reading list (2) on 16 July 2020 A list of books about inequality and race. Reply via email on 14 July 2020 I added a Reply via email link to my RSS feed. 22281 on 7 July 2020 My browser blocked 22281 trackers since July, 2019. How deployment services make client-side routing work on 27 June 2020 When we deploy a single page application with client-side routing, some server configuration is needed to make it work. Uncanny Valley on 12 March 2020 A review of Anna Wiener’s Uncanny Valley. Minimum Viable Data Collection on 9 March 2020 What if more website-owners used Minimum Viable Data Collection as their strategy for complying with privacy regulations? More accessible defaults, please! on 1 March 2020 Useful HTML elements like date inputs and <video> could make the web a much better place, if browser accessibility bugs in their implementations were prioritised. Could browsers fix more accessibility problems automatically? on 4 February 2020 Let’s explore which accessibility issues browsers could fix automatically! 2019 in review on 20 December 2019 A personal review of 2019. Tech vs society: a reading list on 3 December 2019 A list of books about technology and society. Breaking barriers with your CMS on 21 October 2019 A written version of my lighting talk “Breaking barriers with your CMS”. Notes from the Internet Health Report 2019 on 21 September 2019 My notes from reading the Internet Health Report 2019. Book review: Zed on 19 September 2019 A review of Joanna Kavenna’s novel Zed. Managing accessibility in open source CMSes: a write-up on 3 September 2019 Write-up of the Drupal and WordPress meetup. Equality: a reading list on 23 August 2019 A reading list about equality. Meaning without markup: Accessibility Ob"
