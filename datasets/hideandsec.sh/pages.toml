["https://hideandsec.sh/books/ctf/page/northsec-2021-badge-writeup"]
title = "NorthSec 2021 Badge Wr... | HideAndSec"
description = "To learn more about the badge itself and the development behind the scenes I would recommend watch..."
full_description = '''NorthSec 2021 Badge Writeup To learn more about the badge itself and the development behind the scenes I would recommend watching this YouTube video. Although NorthSec was remote for the second year in a row the badges still formed the bases of a CTF. However the badge's challenges were completely unrelated to the actual competitive CTF which was one of the highlights from the event as far as I was concerned. The badge itself hold 10 flags which is really impressive given the memory on the chip and the engineering behind it all. The different categories of the flag are trivia, general problem solving, and reverse engineering. All challenges are independent from each other, so you can look for flags in any order. The lore behind the badge follows the theme of the 2021 northsec: medieval This was also my first time doing any type of hardware hacking. Because of this I have to thank vicious, Padraignix, and Eric Hogue for giving me gentle hints without spoiling any of the fun. Padraignix and Eric have writeup's of their own. If there is something I explain poorly go check them out and their approach. Flag #1 / Intro The first flag is one of theose "warmup" flags. There is visibly a chest in the upper left hand side of the screen, visible upon booting up the game. This is our first flag FLAG-W3lc0m2NSECxx You submit the flags through the FLAGBOT on the official NorthSec Discord server and by some magic it syncs up to your badge. Flag #8 / Toms Hut Part 1 I spent a good 20 minutes talking to all the NPC's and going around the map. Eventually I walked into a house presumably owned by someone named Tom. Inside Tom's hut we are greeted with the following message I also remember seeing a house with a WiFi symbol on it. Once you enter that house you see the following: Unfortunately we're only allowed to toggle the WiFi on and off without any connection to any network being established. Thankfully this badge has a CLI feature that I used to connect to the WiFi using the serial connection. We'll use dmesg to see if the nsec badge is detected and sure enough it is! So we'll just connect to it using the screen command to connect to the GUI. Below we see what commands we've got to play with. Using the commands above we connected ourselves to our home WiFi Now when you go back to Tom's hut you're welcomed with the following message: So lets go ahead and get those files and see what Tom's got in store for us. We will start with the rc101 challenge then solve the rc102. The rc101.zip contains a .elf in a Tensilica Xtensa format. This will be a first for me because I've never touched Xtensa architecture. After a fair amount of googling I was able to find a Ghidra module that could read this type of format. With this module loaded, everything ran smoothly. So I went ahead and loaded up the app_main from this we can get a rough idea of whats happening. Its actually quite straight forward 0x400d2360 user supplied input 0x400d2381 makes a check to see input is whats expected 0x400d2386 if expected, succeed, then load flag in register 0x400d2390 if fail, jump to try_again The Verify function is is kinda long. Essentially our offset is the flag. Just from looking at this function there is a glaring pattern present. If you stare at it for 30 seconds you'll see that there is a jump of 0x4 each time which is then validating our user input (a1). The validation is being performed against values loaded in the a8 to a15 registers. So what we'll do is take the register values and build it back up sequentially one at a time... maybe there is a sick 1337 way to do it in Ghidra but I did in manually in a notepad. I'm sure there is a smarter quicker way to do this but this will have to do. This leaves you with 11a922186c46496eb1317c128b361720 which we'll submit to the challenge as user input to receive our flag. So the flag is: flag-REverSINg_xteNSA_is_NOt_that_HArd Flag #9 / Toms Hut Part 2 Its not over yet! We still have another reverse challenge to do. So after some light recon we're going to be dealing with more or less the same architecture. Lets jump in and look at our main. For a second I thought that I loaded the wrong app because the main looks exactly the same but the verify function is very different. The way I understand it is that something will move something from an offset of ctx to the register a9. So you are comparing a9 with the ascii of a8 before counting down to the next block just like before. Therefore we're going to move the asii value of a8 then compare both, if they're equal we jump to the next block, and if not it makes a jump, resets ctx and return from the function. This in my head is easier to understand then the previous challenge's verify function. move input from ctx to a9 a8 = 0x66 = f compare a9 with 0x66 if equal then move onto next block This leaves us with f219e6cdb1fa4a48b160d00d61118f93 which we'll submit to the challenge as user input to receive our flag. So the flag is: flag-this_is_a_big_huge_enormous_condition Flag #2 / Konami I'm actually impressed I thought of this one. After solving the first 3 flags I didn't really know what to solve next but there was a chest in the top left corner of the map that looked inaccessible. For a while I thought I needed to find a bug with the collision detection but then I remembered this was a video game! And EVERY video game has cheats!... Right? At first I tried the most popular "walking through walls cheats" but had no success with those. However when I googled the most popular cheat codes did I find success. Perhaps its because its the most popular one? But the Konami/Contra code opened the door on the first try. I'm not quite sure if a different cheat codes would have also worked but once entered a magical door will open! Just go through the door to the chest to receive the second flag! FLAG-UuDdLrLrBA0000 Flag #5 / Cyber Punk I kinda got this flag by accident. Right after getting flag #2 I randomly also got flag #4 and I was trying to figure out where it came from. I investigated by talking to the 10 or so NPC's scattered around the map to see if their text options had changed. Eventually I had to chase down the NPC with pink hair named "Punk_" (seen below). Personally this NPC (like the dog) never stopped walking and my fat fingers stumbled but eventually I got to his ass. When you talk to this absolute chad he's all about making you prove yourself to him. You need to be cool and have a lot of money, and be 1337... as seen below. Since I'm none of the above I walked away a little too quickly, hitting the down key and triggering the following. With that we get flag #5 I still don't know how I got flag #4 though... But we'll figure it out eventually. FLAG-KLJV490uhkEJF28 Flag #7 / 20:20 Vision Due to the reset button being at the back of the badge accidentally rebooted the game multiple time as it laid flat on my desk. In doing so I noticed the following message: So I started going through the alphabet tab-completing like a maniac and eventually it completed to the_sword_of_azeroth! (a world of warcraft reference) And with this we have the 7th flag FLAG-Cl1F0rFun&Pr0f1t Flag #6 / Le Lack Du Quack If you walk around the map you'll run into a pretty mean looking duck chilling in a pond. He doesn't say much besides quack. But I noticed that as soon as I started interacting with him that my CLI segfault. I connected to the CLI in a few different ways as seen below. minicom --device /dev/ttyUSB0 screen /dev/ttyUSB0 115200 tio /dev/ttyUSB0 picocom -b 115200 /dev/ttyUSB0 But they all left me with a similar shell. It appears that there was output before it segfaults we see it display "quickquickquick" which kinds sounds like "quack", the noise a duck would make. So I went ahead and piped this into a file. At first I though my terminal was broken but I kept getting the same weird output. I ended up installing a new VM but nothing changed. Its only when I decided properly check the end of those lines that I realize maybe there might be a message here... After removing all the gunk I was left with this nice poem. quackquackquickquack quickquickquack quickquack quackquickquackquick quackquickquack quickquick quackquack quickquack quackquickquick quickquickquack quackquickquackquick quackquickquack quack quackquackquack quackquackquick quick quack quackquickquickquick quickquackquick quick quickquack quackquickquick quickquickquack quickquickquick quick quack quickquickquickquick quickquick quickquickquick quickquickquackquick quickquackquickquick quickquack quackquackquick quackquickquickquick quackquick quickquickquickquack quackquackquickquick quackquickquack quickquack quickquackquack quackquack quickquickquick quackquickquackquack quickquickquick Now there are only two words present quick and quack and some spaces. So maybe the spaces before the newlines are a fluke and they're not suppose to exist. If they are then I'm thinking morse code could be a solution. Also maybe also we can turn the 0's and 1's into text. Now when I was talking to some of the NPC's one of them really triggered me by what he said... Everyone knows that PHP never left, and will never be die. So I wrote a little script in PHP to get us the output in 0's and 1's and later the morse code. <?php $data = "" ; $data = str_replace( "quick" , "0" , $data); $data = str_replace( "quack" , "1" ,$data); echo $data = str_replace( " " , "." ,$data); ?> This left us with two combinations: 1101001011010101001101100001101010111111100110000100011000010000100000000000100100011101000100001110010101011110001011000 0010110100101010110010011110010101000000011001111011100111101111011111111111011011100010111011110001101010100001110100111 This didn't really amount to much and cyber-chef sent me the following sms. Its at this point that I realized that perhaps my gut feeling was right and went ahead to confirm my initial suspicion. The new lines did act as spaces after all. Morse code needs spaces so I made some tweaks to my robust PHP code and obtained the following message as seen below: "QUACK IM A DUCK TO GET BREAD USE THIS FLAG BNVZKAWMSYS" so the flag is therefore FLAGBNVZKAWMSYS Flag #3 / A Fisherman's Downfall It at around this time that I start feeling like I'm going to have to swim in the deep end of the pool. Again I have no real hardware reversing experience. One thing I do want to do is extract all the textures from the application and see if I can reconstruct the map. But before we get to that there is a female NPC which gives us our next hint to a flag. Whats important to note is that the NPC's don't ask questions they all speak in funny infosec anecdotes. At this point I thought that I needed to render the other side of the shore and that maybe a flag was printed on it. In case it isn't obvious as far as I know the shore isn't visible / inaccessible by our character. Also we cant swim. I was a little stumped at this point so I had to ask for a light hint. After some light googling I fell on this GitHub which looked to be exactly what I was looking for. As can be seen below I had a lot of issues in dumping the flash. It didn't seem to matter what I ran or how I ran it... For the next several hours I kept failing and nothing was working. Some progress was made along the way however. We know that the firmware is ~16M thanks to the function above. Then I just started playing around, lowering the Baud rate, switching cables and USB ports which proved to have its successes but no cigar. At this point it seemed like dumping the whole firmware was impossible. I spend roughly 4h on this trying different techniques but nothing worked. Mentally I was here: I started asking around on discord. The general consensus was that the CH340 chip wasn't the most reliable when it came to this type of thing. Thats when a hero named Padraignix came to my aid. He told me that he had a very similar experience and only got a full dump on his ~40th attempt. So not all hope was lot. After harping on discord for a while longer another hero appeared named vicious who laid down some general tips. But it seems like I could reliably grab around 2MB of the firmware. So lets just try and get 1MB and be happy... And after all that struggle we got a flag?!?! FLAG-JTAGPower0verwhelming Turns out this is just a bonus flag. Which makes sense because we're on the fisherman woman quest-line. Since I want to parse the textures I was able to find a open source tool that should get the job done. So first we'll list all of the available partition. The only partition that really interests me is storage and perhaps factory. So lets use the same tool with the help of some flags to Lets just use binwalk because that's the next logical thing to do really, lets hope there are a sufficient amount of images within. At this point I thought that maybe I could get the firmware from the github? Since this is northsec and we're past the end of the CTF they should have open sourced it. I was right, but the thing I didn't expect to see was the full map of the game!!! And we can see in the bottom right corner that there is a chest! Now... listen... I know this is kind of "cheating" since this wasn't available during the actual CTF... but hey I cant dump the whole firmware to solve it the indented way (so far). Anyways from this image I think that we should be able to go out of bounds either at the bottom right of the map near the stone wall, or at the top right near the trees. After some messing around I was right and you can go out of bounds right around here: After going out of bounds you keep going down and start mashing ENTER and you'll open the chest. So the flag is FLAG-MfoAkJu0TtD36 Now that was kinda cheating so I will also solve it the intended way. Since I wasn't able to dump the firmware myself ill yoink it from the GitHub. Now that we have the firmware we will replete the previous steps. We'll start of by seeing what partitions we're dealing with and our output should be the same as before. Now we have another binary file but I don't really know how to read it / what it really is so like any hacker we'll just fuck around and find out. Binwalk to the rescue! Alright so lets just extract the images and see if we could have figured this out "cheating" ... Wait so they're corrupted? At this point I wasn't quite sure what to do... so I went back to cheating a.k.a looking a'''
