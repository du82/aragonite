en installieren, allerdings kannst du es nur auf 5 Geräten – oder im Falle unseres Abos für Familie und Freunde auf 10 Geräten – gleichzeitig ausführen. Zumindest solange all diese Installationen mit demselben Konto verknüpft sind. Wieso ist die Protokollierungsrichtlinie so wichtig? Einigen Leuten mag Sie vielleicht unwichtig erscheinen, für andere Leute ist sie wiederum enorm wichtig. Man könnte sagen, dass die Protokollierungsrichtlinie einen symbolischen Charakter hat: Die Tatsache, dass sich ein VPN dazu verpflichtet, so wenig wie möglich zu protokollieren, zeigt, wie sehr es deine Privatsphäre schätzt und wie erst es sich mit dem Schutz deiner Daten auseinandersetzt. Vielen Leuten mag es vielleicht egal sein, dass ihr VPN die genauen Zeiten protokolliert, wann es aktiviert bzw. deaktiviert wird, wir hoffen aber, dass unsere Ablehnung einer selbst so banalen Protokollierung zeigt, wie gewissenhaft wir auch an den Schutz von Daten herangehen, die schon eher als vertraulich angesehen werden. In Anbetracht der Tatsache, dass die Minimierung der Protokollierung unsererseits mit einem nicht unerheblichen Zeit- und Kostenaufwand verbunden ist, liegt für uns der Mehrwert dieser Untermauerung unseres Engagements für den Schutz deiner Privatsphäre in der Veranschaulichung unserer Prinzipien und in der Aufwertung unseres Marketings. Unsere Protokollierungsrichtlinie ist ein Beweis dafür, dass wir meinen, was wir sagen, und sagen, was wir meinen. Doch unsere ablehnende Haltung gegenüber der Datenprotokollierung hat ebenso einen praktischen Nutzen für unsere Anwender: Im Falle einer Kompromittierung unserer Datenbanken im Zuge eines illegalen Hackerangriffs oder einer legalen polizeilichen Anordnung, ist die Menge der Daten, die auf diese Weise gewonnen werden können, so verschwindend gering und bedeutungslos, dass weder die entsprechenden Hacker noch die Polizei damit etwas anfangen könnten. Auf diese Weise können wir unser Versprechen, deine Privatsphäre unabhängig davon zu schützen, welchen Aktivitäten du im Internet nachgehst, auch dann einhalten, wenn wir mit den Behörden zusammenarbeiten müssen, wozu wir als juristische Person verpflichtet sind. Was hat es mit diesem Esel auf sich? Nun, das ist Jack, unser Maskottchen, und leider ist Jack ein kleiner Besserwisser. HMA steht übrigens für „Hide My Ass“, wobei wir diese Bezeichnung früher häufiger und offenkundiger verwendet haben, bevor uns klar geworden ist, dass die Tatsache, dass der Name nicht nur als „Verstecke meinen Esel“ sondern auch als „Verstecke meinen Arsch“ verstanden werden kann, dem Image unserer Marke möglicherweise eher schadet, als dass es ihm zuträglich wäre. Diese Zweideutigkeit des englischen Wortes „Ass“ und die Tatsache, dass wir Leuten den Allerwertesten retten, indem wir Ihre Identität verbergen, ist übrigens einer der Gründe, wieso wir uns für uns damals überhaupt für einen Esel als Maskottchen entschieden haben. Das Wortspiel hört da allerdings noch nicht auf, denn unser damals 16 Jahre alter Gründer war ein Bursche namens Jack Cator. Und dreimal darfst du raten, wie man einen männlichen Esel auf Englisch noch nennt. Ganz genau: „Jack“. Und auch wenn wir uns jetzt nur noch HMA nennen, werden wir ein solch vielschichtiges Wortspiel nicht einfach so aufgeben. Von daher ist Jack immer noch bei uns. Du wirst ihm in unseren Social-Media-Konten, unseren E-Mails, unseren Werbeanzeigen und natürlich auch auf unserer Webseite über den Weg laufen. Wir sind überzeugt, dass er dir mit der Zeit ebenso wie uns ans Herz wachsen wird, sei es wegen seines Charmes, oder weil du am Stockholm-Syndrom erkrankst. Und offen gesagt geht für uns beides in Ordnung."
