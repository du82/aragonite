description = "HMA VPN is officially No-Log VPN. But what does that mean? And what do we log? We’ve got the answers right here."
full_description = '''HMA is an audited No-Log VPN: What's that mean? With HMA’s no logging policy, we can better protect your privacy and anonymity. But this is only the first step in our goal of being the ultimate champions of online privacy. Get HMA VPN 30-day money-back guarantee Things we’ll never log The anonymous data we need Things we’ll never log With our no-logging policy, you can use HMA VPN knowing that we’ll never collect, record, or see: Your original IP address, which could be used to identify you. This means when you use HMA VPN, you’re anonymous even to us. Any of your DNS queries. We’ll have no way to know what websites you visit, nor will anyone else. We rely on our own secure, zero-log DNS servers so your queries are also protected from exposure to 3rd parties. Your activity, which includes sites you log into, services you try, apps you have running, streams you’re watching… basically anything you do online. How much data you’ve transferred. When you were connected: we don’t collect timestamps of your connections. The anonymous data we need Sadly, VPNs aren’t magic. In order to function, there’s some anonymous data we have to temporarily collect: The day you connect and general time (morning or evening). This makes possible troubleshooting and customer service. The amount of data transmitted, rounded to the hundredth Mb. This helps with network capacity and server improvements. We have no idea what the data actually is. All of this data is only stored for 35 days, at which point it’s deleted permanently. “We worked [with HMA] to help fortify the security and, most importantly, the privacy of their VPN client software for their growing global client base." Audited for your pleasure We know it’s not enough to simply say we’re not logging your data — so we put our money where our mouth was and hired independent cyber-risk consultant firm VerSprite to audit our VPN. With their help, we’re proud to announce we earned their best possible rating: “low risk user privacy impact”. In a word, they’re calling us the cream of the crop. #ver-figure .container {padding-bottom:0;} You might be wondering… Why does the logging policy matter? If you’re asking that, you’re probably not our target audience. In short, our logging policy is our effort to be as transparent as possible in what we need from you, and what we don’t. Without it, you wouldn’t know what we’re up to, and it’d be that much harder to trust us with your data, wouldn’t it? How does HMA handle third-party tracking? Well, that’s where things get a little more complicated: For our desktop product, we use absolutely no third-party tools (which is more than most of our competitors can say). For our Chrome and Firefox extensions, we use Google Analytics to better understand how people use our products for the sake of improving them. We use a lot of data safeguards to avoid receiving any identifying info, though. For iOS and Android, we use three data analytics tools: Google Firebase, Google Fabric Crashlytics, and Appsflyer. Google Firebase helps us better understand how people use our products. Normally it provides identifying data, but we’ve opted out of receiving it and use our own anonymizing identifiers instead. You can opt-out of handing over this anonymous data in your application settings. Google Fabric Crashlytics helps us identify issues with app stability and performance. You can’t opt out of this one, but it doesn’t contain any personal data in it whatsoever. Appsflyer helps us know which ads worked or not. Gotta help our marketing teams do their jobs, right? But you can opt out in your application settings. What about billing information? Third parties are responsible for handling our checkout process, and they have their own privacy policies. You can see who we’re working with in your confirmation email, but they’re all PCI-compliant and can’t use your information for anything other than facilitating your payment. It’s worth noting that sometimes, they’ll share your billing data with us — including your name, address, email address, your subscription, and payment information — for resolving issues and detecting fraud. We’ll keep it in our database for as long as you’re subscribed, and then ten more years, as the law requires. It’s possible we’ll need to keep it longer, though. We don’t see or store your credit card information, though. What if I want to read more boring legal stuff? Oh boy we’re so glad you asked! There are some other services that we provide, like free proxy, browser extensions, or our famous IP checker tool, that we don’t talk about here. But if you want to see absolutely everything, check out our privacy policy, cookie policy, and our GDPR compliance page. We made it all really clear there. It’ll bore you half to death. Why is HMA the best VPN for online privacy? Smart Kill Switch Kill Switch makes sure no data leaks if your connection to a VPN server drops. Split-Tunneling You can choose which applications go through HMA VPN, while everything else connects to the web normally. Privacy for all your devices Install HMA on Windows, Mac, Android, Android TV and iOS. Try HMA VPN risk-free with our 30-day money-back guarantee 1100+ servers in 290+ locations worldwide 20 Gbps connection speeds Servers for streaming & P2P connections Lightning Connect, Split-Tunneling, Kill Switch, & more! For Unlimited installs with 5 simultaneous connections 1 month plan 1 month plan Regular PriceCAN$15.99 /MO Regular PriceCAN$15.99 Regular PriceCAN$15.99billed at once Buy now Buy now 12 month plan Save Offer Price60% 12 month plan Offer PriceCAN$6.39 /MO Save Offer Price60% Regular PriceCAN$191.88 Offer PriceCAN$76.68billed at once Buy now Buy now Best Deal 36 month plan Save Offer Price73% 36 month plan Offer PriceCAN$4.29 /MO Save Offer Price73% Regular PriceCAN$575.64 Offer PriceCAN$154.44billed at once Buy now Buy now 30-day money-back guarantee Accepted payment methods: Haven't found the right one for you? View more plans Live Chat'''
