["https://hidemyass.com/en-ca/legal/privacy"]
title = "Privacy Policy | Hide My Ass!"
description = "A VPN you can’t trust is worse than useless. So here’s the buck-naked truth about how we manage your data. Seriously. No puns inside."
full_description = 'Privacy Policy Version April, 2024 This policy describes who we are, how we collect, handle and protect your personal data and the privacy rights and choices available to you regarding the access, correction and deletion of your personal data. For older versions of this document, please visit the legal archive. This policy does not apply to service data which may be collected by different products, such as an antivirus app, or to the operation of cookies on our website. For information on how we handle website cookies, please visit our Cookies Policy. The information on our personal data practices may be supplemented by product settings, contractual terms, or notices provided prior to or at the time of data collection. Who are we? We are part of Gen™ - a global company with a family of trusted consumer brands. The Controller of your personal data is Avast Software s.r.o., which has its principal place of business at 1737/1A Pikrtova, Prague 4, Czech Republic, 140 00 (referred to as "we," "us," "our," or “HMA” in this policy). If you live in the United Kingdom, Avast’s representative established in the UK is NortonLifeLock UK Limited, 100 New Bridge Street, London, England EC4V 6JA. What data our VPN processes? Generally speaking, we need some personal data particularly to provide you our products and services, optimize and improve our products and services, to send you direct marketing, or to comply with our legal obligations. We try to minimize the collection of any data, we aggregate or delete it as soon as possible, and if it is not necessary we don’t collect it at all. We will describe how we process the data in the following sections. But let’s start with what we don’t collect. Our No Logging Policy - data we don’t send to our servers. Period. Originating IP address. Any DNS queries while connected. We rely on our own secure DNS servers, so your queries are also protected from exposure to 3rd parties. Browsing history. Transferred data. We may collect and process personal data about you in the following situations: Product functionality Service Data from our VPN servers If you use our VPN service, we collect the minimum amount of information needed to provide and operate it, as well as keep it running safely and efficiently. This is the data we collect to make sure our VPN infrastructure works (“Service Data”): Service Data What we use it for Day of connectionE.g. We store the date you were connected together with an internal identifier, but not the exact time: timestamps are floored to either 12 am or 12 pm. To troubleshoot for support and abuse handling.Example: To know the amount of daily active users. Rounded amount of data transmittedE.g. If a user transferred within the session 364MB, we floor it to 300MB. 1843MB of transferred data is floored to 1000MB. We keep just the first digit of the value together with an internal identifier. To plan for new network capacity and server improvements.Example: We may deploy more capacity to meet demand and make sure speeds stay up for all users. We store server’s service data for 35 days, after which time it is deleted on a rolling basis — data created on Jan 3rd, 2020 gets deleted on Feb 7rd 2020, for example. Service Data from our VPN clients In order to make sure our VPN clients do their job properly and without errors we have to know how many specific errors we have. This data pertains to interactions taken in the app, and cannot be used to uncover what you’re using the VPN service for. Client Data What we use it for Connection eventsEvents such as the attempt to connect, disconnection, connection error, etc. together with an internal identifier exclusively used for this (“connection event identifier”) To operate and provide VPN service with high quality. We do not pair any individual user with this data.Example: How many unknown users get the same error? Application EventsEvents such as auto-connection, uninstall event, etc. together with an internal identifier (“application event identifier”) To plan product development and analyticsExample: How many users do we have? Is a new client-side feature we introduced popular? Are people uninstalling after our latest release? Crash reports generated and sent by the userWe might collect data like your e-mail, app version or internal identifiers described above. To help troubleshoot the issue. We don’t send any privacy-sensitive data automatically - you need to explicitly allow sending this back to us and check prior to what data is being sent before you share it with us.Please note that if you provide us together with information above also your personal data, e.g. within an ad hoc crash report that you decide to send to us, we could add this information to the service data and might be able to connect it with you.Example: App is crashing on some specific device. This is how customer care support can help with device-specific issues. We store client’s service data for 2 years, after which time it is deleted on a rolling basis — data created on Jan 3rd, 2019 gets deleted on Jan 3rd, 2021, for example. Account creation and management When you create an account with us (note: this is necessary in order for you to use the VPN service), we will need some information about you. This is the personal data that is created and stored for the management of your account: Account data What we use it for Email address To send you purchase receipts, communications, and occasional product news Username (only for legacy versions) To manage your account and facilitate your login into the service. We do not collect this information anymore. Usernames are used only with older versions of our VPN clients. Activation code To activate your subscription Subscription renewal date To tell us until when the account is valid All of the above data is stored for as long as you use our service, as it is necessary for us to provide it. However, your Account Data is not paired with your activity usage. You can request a copy of your account data through support. Billing and Payment We rely on third-party payment processors to handle your product purchases. You can find out which provider we are working with for the point of purchase you chose (for example our website, an app store, etc) by looking at your transactional email or receipt. This is the list of payment processors we cooperate with and their privacy policies: 2Checkout/Verifone - https://www.2checkout.com/legal/privacy/ Google Play - https://policies.google.com/privacy?hl=en-US Apple iTunes - https://www.apple.com/legal/privacy/en-ww/ These providers are in the position of independent controllers and may collect a variety of information about you to complete the purchase. All of them are PCI-compliant or the equivalent and are prohibited from using your personal data for anything but facilitating your payment and subscription management or as otherwise described in their applicable terms of service and privacy policy. Some of that billing data may be shared with us in order to detect and prevent fraud, help with customer support, or used as a record of your payment for accounting, taxation, and invoicing purposes. This data is what we call “billing data” and it includes your name, address, email address, the product (subscription you purchased) and for how long, and payment information. Your payment provider will process your credit card number, but it is not shared with us. On our side, billing data is stored for as long as you continue to use our service, and for up to 10 years after that because of our legal obligations. If legal obligations change, or we need to resolve disputes and enforce our agreements, we may be obliged to keep this data longer than that. Communication If you contact us by email, it will be stored for 24 months, unless required by law or other exceptional circumstances. We do this to speed up our turn around on support and to follow up. If you are a user of our service or you have subscribed on our website, we will send you commercial communications through this channel in the form of newsletters, or blog notifications. Please note, if you don’t want to be on our mailing list, you may use the “Unsubscribe” link available in every communication we send you. Third-party tools used for analytics To analyze application events from our VPN clients in order to understand how our services function, or how stable or successful they are, we rely on our own analytics tools as much as possible. Here are the third-party tools we use, how we use them, and their privacy policies: Google Firebase Analytics on iOS and Android Firebase helps us to understand how people interact with certain aspects of our service. While Firebase normally relies on Android Advertising ID or iOS Identifier for Advertisers, this is not the case of our service because we’ve opted to use our own identifiers instead. As this tool is not necessary for service functioning, you can opt-out of providing us with this de-identified application performance data in our application settings. Google Fabric Crashlytics on iOS and Android This Google tool helps us to improve application stability, pinpoint things that don’t work, and improve your experience. Its implementation doesn’t contain any information that can personally identify you. Both Firebase Analytics and Crashlytics are subject to Google’s privacy policies For which purposes we process your personal data? Personal data is information that relates to an identified or identifiable natural person, such as the personal data necessary to provide you with our service, to create and manage your account, to handle your product purchases, to communicate with you, to optimize and improve our service, and to comply with our legal obligations. More specifically, we use your personal data for the following purposes relying on the following legal bases: On the basis of fulfilling our contract with you or entering into a contract with you on 