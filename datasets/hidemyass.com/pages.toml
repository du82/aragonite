t? Kontaktiere uns Live-Chat Ein paar nette Worte über uns Expertenmeinungen Unserer Meinung nach sind die Verschlüsselungsmethoden und Sicherheitsmerkmale [von HMA] einsame Spitze. Die Benutzerfläche ist eine der intuitivsten überhaupt und die Animationen des sich verkleidenden Esels haben uns jedes Mal zum Schmunzeln gebracht. Holly AguirreBeiträgerin, Reviewed Zu den größten Stärken dieses VPNs zählen seine benutzerfreundliche Oberfläche, seine beeindruckenden Geschwindigkeiten und seine Fähigkeit Geosperren (inklusive derer von Netflix!) zu umgehen. Katie KasunicTechnologieforscherin, VPNMentor Die von HMA angebotene Liste der verfügbaren VPN-Standorte ist besonders hervorzuheben, da sie selbst solche Länder beinhaltet, die von anderen VPN-Unternehmen oft ignoriert werden. So sind darin beispielsweise auch zahlreiche Serverstandorte auf dem afrikanischen Kontinent enthalten. Max Eddy Leitender Sicherheitsexperte, PCmag.com Ein paar wissenswerte Tipps... Wird ein VPN die Geschwindigkeit meiner Verbindung beeinträchtigen? Wir wollen hier keine Lügen erzählen: Das ist durchaus möglich. Wenn du ein VPN verwendest, wird deine Verbindung über einen unserer Remote-Server geleitet, bevor die gewünschte Webseite oder der gewünschte Dienst aufgerufen wird. Dies geschieht nicht augenblicklich, sodass die Daten einer sich in den USA befindlichen Person, die sich mit einem Server in Indien verbindet, um die Webseite ihres örtlichen Bürgermeisters zu besuchen, praktisch zweimal um die ganze Welt reisen, bevor sie auf dem Bildschirm dieser Person angezeigt werden, und zwar vom Router über den HMA-Server in Indien bis hin zur Webseite des Bürgermeisters, die wahrscheinlich ohnehin in den Staaten gehostet wird, und dann wieder über den Server in Indien zurück zum Router. Wenn deine Verbindung schnell genug ist und du dich mit einem unserer Hochgeschwindigkeitsserver verbindest, ist die Verzögerung allerdings so gering, dass du sie kaum wahrnehmen wirst. Ist deine Verbindung allerdings langsam und verbindest du dich mit einem unserer weiter entfernten Server, kannst du mit einer spürbaren Verzögerung rechnen. Glücklicherweise verfügen wir über Tools wie Lightning Connect, die dafür sorgen, dass du dir über Verzögerungen beim Versuch, deine Online-Privatsphäre mit HMA VPN zu schützen, keine Gedanken machen musst. Welche Bedingungen muss man beachten, wenn man von eurer 30-Tage-Geld-zurück-Garantie Gebrauch machen will? Nur eine: Rücksendungen von VPNs mit Wasserschäden werden nicht akzeptiert. Hast du eine Ahnung, wie schwer es ist, ein VPN zu trocknen? Wir jedenfalls nicht, weil das noch nie passiert ist, aber wir haben auch keine Lust, das herauszufinden. Aber mal im Ernst – wenn du von unserer 30-Tage-Geld-zurück-Garantie Gebrauch machst, dann kriegst du dein Geld selbst dann zurück, wenn du keine Gründe für deine Entscheidung angeben möchtest. Selbst wenn du länger als 30 Tage warten möchtest oder HMA ein zweites Mal kaufst, kannst du immer noch eine Rückerstattung beantragen. Aber es gibt keine Garantie, dass sie dir gewährt wird. Auf wie vielen Geräten kann ich HMA VPN installieren? Auf all deinen kompatiblen Geräten. Wir kommen zwar nicht ganz an Doom heran, aber du kannst HMA VPN dennoch auf erstaunlich vielen Geräten – inkl. iOS- und Android-Geräten, PCs, Macs und Android TVs – ausführen und es auf beliebig vielen solchen Geräten installieren, die sich in deinem Besitz befinden. Oder die du ausgeborgt hast. Oder die du dir unter den Nagel gerissen hast. Oder die du vorm Media Markt auf dem Parkplatz gefunden hast. Die Zahl der möglichen „Installationen“ von HMA VPN stimmt allerdings nicht ganz mit der Zahl der gleichzeitig „ausführbaren Instanzen“ von HMA VPN überein. Zwar kannst du es auf beliebig vielen Geräten installieren, allerdings kannst du es nur auf 5 Geräten – oder im Falle unseres Abos für Familie und Freunde auf 10 Geräten – gleichzeitig ausführen. Zumindest solange all diese Installationen mit demselben Konto verknüpft sind. Wieso ist die Protokollierungsrichtlinie so wichtig? Einigen Leuten mag Sie vielleicht unwichtig erscheinen, für andere Leute ist sie wiederum enorm wichtig. Man könnte sagen, dass die Protokollierungsrichtlinie einen symbolischen Charakter hat: Die Tatsache, dass sich ein VPN dazu verpflichtet, so wenig wie möglich zu protokollieren, zeigt, wie sehr es deine Privatsphäre schätzt und wie erst es sich mit dem Schutz deiner Daten auseinandersetzt. Vielen Leuten mag es vielleicht egal sein, dass ihr VPN die genauen Zeiten protokolliert, wann es aktiviert bzw. deaktiviert wird, wir hoffen aber, dass unsere Ablehnung einer selbst so banalen Protokollierung zeigt, wie gewissenhaft wir auch an den Schutz von Daten herangehen, die schon eher als vertraulich angesehen werden. In Anbetracht der Tatsache, dass die Minimierung der Protokollierung unsererseits mit einem nicht unerheblichen Zeit- und Kostenaufwand verbunden ist, liegt für uns der Mehrwert dieser Untermauerung unseres Engagements für den Schutz deiner Privatsphäre in der Veranschaulichung unserer Prinzipien und in der Aufwertung unseres Marketings. Unsere Protokollierungsrichtlinie ist ein Beweis dafür, dass wir meinen, was wir sagen, und sagen, was wir meinen. Doch unsere ablehnende Haltung gegenüber der Datenprotokollierung hat ebenso einen praktischen Nutzen für unsere Anwender: Im Falle einer Kompromittierung unserer Datenbanken im Zuge eines illegalen Hackerangriffs oder einer legalen polizeilichen Anordnung, ist die Menge der Daten, die auf diese Weise gewonnen werden können, so verschwindend gering und bedeutungslos, dass weder die entsprechenden Hacker noch die Polizei damit etwas anfangen könnten. Auf diese Weise können wir unser Versprechen, deine Privatsphäre unabhängig davon zu schützen, welchen Aktivitäten du im Internet nachgehst, auch dann einhalten, wenn wir mit den Behörden zusammenarbeiten müssen, wozu wir als juristische Person verpflichtet sind. Was hat es mit diesem Esel auf sich? Nun, das ist Jack, unser Maskottchen, und leider ist Jack ein kleiner Besserwisser. HMA steht übrigens für „Hide My Ass“, wobei wir diese Bezeichnung früher häufiger und offenkundiger verwendet haben, bevor uns klar geworden ist, dass die Tatsache, dass der Name nicht nur als „Verstecke meinen Esel“ sondern auch als „Verstecke meinen Arsch“ verstanden werden kann, dem Image unserer Marke möglicherweise eher schadet, als dass es ihm zuträglich wäre. Diese Zweideutigkeit des englischen Wortes „Ass“ und die Tatsache, dass wir Leuten den Allerwertesten retten, indem wir Ihre Identität verbergen, ist übrigens einer der Gründe, wieso wir uns für uns damals überhaupt für einen Esel als Maskottchen entschieden haben. Das Wortspiel hört da allerdings noch nicht auf, denn unser damals 16 Jahre alter Gründer war ein Bursche namens Jack Cator. Und dreimal darfst du raten, wie man einen männlichen Esel auf Englisch noch nennt. Ganz genau: „Jack“. Und auch wenn wir uns jetzt nur noch HMA nennen, werden wir ein solch vielschichtiges Wortspiel nicht einfach so aufgeben. Von daher ist Jack immer noch bei uns. Du wirst ihm in unseren Social-Media-Konten, unseren E-Mails, unseren Werbeanzeigen und natürlich auch auf unserer Webseite über den Weg laufen. Wir sind überzeugt, dass er dir mit der Zeit ebenso wie uns ans Herz wachsen wird, sei es wegen seines Charmes, oder weil du am Stockholm-Syndrom erkrankst. Und offen gesagt geht für uns beides in Ordnung."
