h Automatically launch HMA to protect your apps. No Log DNS Rely on our no-log DNS to avoid leaving a trail. Leak Shield Stop IPv4, IPv6, and DNS leaks when you browse. See more features We’ve learned a few things in 19+ years For example, we’ve learned that no matter how great your VPN is, it means nothing if your customers don’t love — or trust — you. Which is why we’ll do everything in our power to earn both, with our thirty-day money-back guarantee, world-class support team, and constant updates. Try HMA VPN risk-free with our 30-day money-back guarantee 1100+ servers in 290+ locations worldwide 20 Gbps connection speeds Servers for streaming & P2P connections Lightning Connect, Split-Tunneling, Kill Switch, & more! For Unlimited installs with 5 simultaneous connections 1 month plan 1 month plan Regular Price10,99€ /MO Regular Price10,99 € Regular Price10,99 €billed at once Buy now Buy now 12 month plan Save Offer Price60% 12 month plan Offer Price4,39€ /MO Save Offer Price60% Regular Price131,88 € Offer Price52,68 €billed at once Buy now Buy now Best Deal 36 month plan Save Offer Price73% 36 month plan Offer Price2,99€ /MO Save Offer Price73% Regular Price395,64 € Offer Price107,64 €billed at once Buy now Buy now 30-day money-back guarantee Accepted payment methods: Haven't found the right one for you? View more plans Live Chat A few words about us Expert reviews We found [HMA]’s encryption methods and security features top-notch. The user interface is one of the easiest to use and we chuckled at the donkey animation going stealth every time. Holly AguirreContributor, Reviewed Some of this VPN’s biggest strengths are its user-friendly interface, impressive speeds, and ability to bypass geoblocks (even Netflix’s!). Katie KasunicTechnology Researcher, VPNMentor The list of available server locations offered by HMA is particularly noteworthy because it covers regions often ignored by other VPN companies. It has, for example, numerous server locations across the continent of Africa. Max Eddy Senior Security Analyst, PCmag.com Some good-to-know tips… Will a VPN slow down my connection? No lie: it’s possible. See, when you use a VPN, before you go to the website or service you want to use, your connection first hops to one of our remote servers. This is not an instantaneous process, so if someone in the US connects to a server in India to visit their local mayor’s website, their data is effectively traveling around the world — twice — to reach their screen: from their router to the HMA server in India, to the mayor’s website that’s likely hosted on a server in the states, then back to the server in India, then back to their router. If your connection is fast enough, and you connect to one of our high-speed servers, the slowdown will be so negligible you won't notice it. If your connection is slow, and you connect to one of our more remote servers, there’s likely to be a noticeable slowdown. Fortunately, we have tools like Lightning Connect that’ll ensure you never have to worry about any slowdown when you’re keeping yourself private online with HMA VPN. Do you have any rules for your 30-day money-back guarantee? Just one: please don’t return it with any water damage. Do you know how hard it is to dry out a VPN? We don’t, because it’s never happened before, and we don’t plan to find out. But no, for real — if you take advantage of our 30-day money-back guarantee, you get your money back, no questions asked. However, if you wait past thirty days, or you re-buy HMA a second time, you can still ask for a refund. But it’s not guaranteed we’ll give you one. How many devices can I install HMA VPN on? As many compatible devices as you have. We’re not quite Doom, but you can still run HMA VPN on a shocking number of devices — iOS, Androids, PCs, Macs, Android TVs — and you can install it on as many of those devices as you own. Or borrowed. Or stolen. Or find unattended in a Best Buy parking lot. But “installing” HMA VPN isn’t quite the same thing as “using” HMA VPN. While it can be installed on any number of devices, you can only have it turned on in up to 5 devices at the same time, or 10 with our friends and family plan. At least, as long as each installation is connected to the same account. Why does the logging policy matter? To some people, maybe it doesn’t. To others, it matters a whole lot. The logging policy can be viewed symbolically: a VPN’s commitment to logging as little as possible is representative of their respect for your privacy and how seriously they approach the issue of protecting your data. For example, for a lot of people, a VPN logging exactly what time they turn the VPN on or off might not be a matter of much concern: but our unwillingness to do even that hopefully signals just how earnestly we protect the data that is generally viewed as more sensitive. Bearing in mind that it takes considerable effort to reduce logging, and even costs us a not-inconsiderate amount of money to pull off, the value of underlining our commitment to your privacy comes down to illustrating our principles as much as bolstering our marketing. It’s proof that we mean what we say and say what we mean. But refusing to log data has a practical benefit to our users as well: it means that if our databases should ever be compromised, either illegally via a hack or legally via some sort of police subpoena, the amount of data that could be acquired would be so dismally small and meaningless that neither the hackers nor the police could do anything with it. Thus, we can truly live up to our promise to protect your privacy no matter what you do online while still cooperating with the authorities, as we are obligated to do as a legal entity. What’s that donkey doing there? Alright so that’s Jack, our mascot, and we’re afraid he’s a little too clever by half. So HMA stands for “Hide My Ass”, a moniker we used to go by more consistently and openly before we figured it might be hurting our brand more than helping. And, since donkeys are also known as “Asses”, and we were in the habit of hiding them, well, it seemed like a natural fit for a mascot. But the pun actually goes deeper than that, because our founder was actually a 16-year-old kid named Jack Cator. And what’s another name for a male donkey? A “Jack”. And even though we just go by HMA now, we’re not about to give up on a double-layered slice of wordplay like that, so Jack has stuck around. He’ll show up on our social media, in emails, in our ads, and of course all across our website. We’re sure you’ll grow to love him soon, either due to his irrefutable charm or Stockholm syndrome. Frankly, we’re not picky which."
