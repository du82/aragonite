 tolika kompatibilních zařízeních, kolik jich vlastníš. Skutečně, HMA VPN můžeš používat na libovolném počtu zařízení. Podporujeme iOS, Android, Windows, Mac, Android TV. Prostě si ji nainstaluj na všech vlastněných zařízeních. Nebo půjčených. Nebo ukradených. Nebo náhodně nalezených na lavičce v parku. Ale „instalace“ HMA VPN není to samé, co „používání“ HMA VPN. Sice si ji můžeš nainstalovat na tolik zařízení, kolik chceš, ale můžeš ji mít současně zapnutou jen na pěti z nich (nebo deseti, pokud máš předplatné pro kamarády a rodinu). Všechny tyhle instalace zároveň musí být připojené ke stejnému účtu. Proč je důležité, že nezaznamenáváte aktivity? Pro některé lidi to důležité být nemusí, ale jiným na tom může záležet hodně. Protože bereme ochranu tvých dat opravdu vážně, jednoduše se zavazujeme, že budeme zaznamenávat jen minimum údajů, abychom respektovali tvoje soukromí. Spoustě lidí například nemusí nijak vadit, že si VPN zaznamenává přesné časy, kdy se připojili nebo odpojili. My ale něco takového neděláme. Jednoduše ti chceme dokázat, že opravdu chráníme data, která obecně můžou být považovaná za citlivější. Všechno to omezování záznamů o aktivitách uživatelů pro nás znamená spoustu úsilí a nemalé náklady. My si ale chceme stát za svým a chránit tvoje soukromí tak, jak nám velí naše principy a jak se prezentujeme navenek. Když prostě něco slíbíme, tak to dodržíme. Skutečnost, že nic nezaznamenáváme, má přínos i pro naše uživatele: Kdyby se nám náhodou někdo dostal do databází, ať už nelegálně (třeba nějaký hacker), nebo legálně (třeba policie na základě soudního příkazu), vyčtou z ní jen naprosté minimum, které jim nebude k užitku. Za naším příslibem chránit tvoje soukromí, ať už děláš na internetu cokoli, si stojíme, jen jako právnická osoba musíme spolupracovat s úřady, protože nám to nakazují zákony. Co má znamenat ten osel? To je Jack, náš maskot a pěkný chytrák. HMA je zkratka pro anglický název „Hide My Ass“, pod kterým jsme původně vystupovali, ale pak