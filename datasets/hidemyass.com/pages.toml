με ότι οι μέθοδοι κρυπτογράφησης και οι λειτουργίες ασφαλείας [του HMA] είναι κορυφαίες. Το περιβάλλον εργασίας χρήστη είναι από τα πιο εύχρηστα, άσε που γελάμε πολύ με το κινούμενο σχέδιο του γάιδαρου που εμφανίζεται κι εξαφανίζεται. Holly AguirreΑρθρογράφος που σχολιάζει Μερικά από τα πιο σημαντικά πλεονεκτήματα αυτού του VPN είναι η φιλική διεπαφή χρήστη, οι εντυπωσιακές ταχύτητες και η δυνατότητα παράκαμψης γεωγραφικών αποκλεισμών (ακόμη και στο Netflix!). Katie KasunicΕρευνήτρια Τεχνολογίας, VPNMentor Η λίστα με τις διαθέσιμες τοποθεσίες διακομιστή που προσφέρει το HMA είναι ιδιαίτερα αξιοσημείωτη επειδή καλύπτει περιοχές που συχνά αγνοούν άλλες εταιρείες VPN. Διαθέτει, για παράδειγμα, πολλές τοποθεσίες διακομιστών σε ολόκληρη την αφρικανική ήπειρο. Max Eddy Ανώτερος Αναλυτής Ασφάλειας, PCmag.com Ορισμένες χρήσιμες συμβουλές... Μήπως το VPN θα κάνει πιο αργή τη σύνδεσή μου; Δεν θα σου πούμε ψέματα: είναι πιθανό. Βλέπεις, όταν χρησιμοποιείς VPN πριν μεταβείς στον ιστότοπο ή την υπηρεσία που θέλεις να χρησιμοποιήσεις, η σύνδεσή σου μεταπηδά σε έναν από τους απομακρυσμένους server μας. Αυτή δεν είναι μια στιγμιαία διαδικασία, οπότε αν ένας χρήστης στις ΗΠΑ συνδεθεί με κάποιον server στην Ινδία για να επισκεφθεί τον ιστότοπο του τοπικού του δημαρχείου, ουσιαστικά τα δεδομένα του ταξιδεύουν σε όλο τον κόσμο - δύο φορές - για να φτάσουν στην οθόνη του χρήστη: από τον router του χρήστη στον server του HMA στην Ινδία, από εκεί στον ιστότοπο του δημάρχου που πιθανότατα φιλοξενείται σε κάποιον server στις ΗΠΑ, στη συνέχεια πίσω στον server στην Ινδία και μετά στον router του χρήστη. Εάν η σύνδεσή σου είναι αρκετά γρήγορη και συνδεθείς σε κάποιον από τους server μεγάλων ταχυτήτων, η καθυστέρηση θα είναι τόσο αμελητέα που δεν θα την αντιληφθείς. Εάν η σύνδεσή σου είναι αργή και συνδεθείς σε κάποιον πιο απομακρυσμένο server μας, ενδέχεται να υπάρξει αισθητή καθυστέρηση. Ευτυχώς, διαθέτουμε εργαλεία, όπως την Αστραπιαία Σύνδεση, που διασφαλίζουν ότι δεν θα χρειαστεί ποτέ να ανησυχήσεις για τυχόν καθυστερήσεις όσο διατηρείς την ανωνυμία σου στο διαδίκτυο με το HMA VPN. Υπάρχουν κάποιοι όροι για την εγγύηση επιστροφής χρημάτων 30 ημερών; Μόνο ένας: δεν θέλουμε να μας το επιστρέψεις βρεγμένο. Ξέρεις πόσο δύσκολα στεγνώνει το VPN; Επειδή δεν έχει συμβεί ποτέ αυτό, δεν ξέρουμε, ούτε θέλουμε να μάθουμε. Σοβαρά τώρα, αν εκμεταλλευτείς την εγγύηση επιστροφής χρημάτων 30 ημερών, παίρνεις πίσω τα χρήματά σου χωρίς ερωτήσεις. Ωστόσο, αν περάσουν οι τριάντα ημέρες ή αγοράσεις ξανά το HMA για δεύτερη φορά, μπορείς να ζητήσεις επιστροφή χρημάτων. Απλώς δεν εγγυώμαστε ότι θα σου την δώσουμε. Σε πόσες συσκευές μπορώ να εγκαταστήσω το HMA VPN; Σε όσες συμβατές συσκευές θέλεις. Δεν είμαστε δα και το Doom, παρ’ όλα αυτά μπορείς να εγκαταστήσεις το HMA VPN σε έναν συγκλονιστικό αριθμό συσκευών –iOS, Android, PC, Mac, Android TV– και μπορείς να το εγκαταστήσεις σε όσες τέτοιες συσκευές διαθέτεις. Ή έχεις δανειστεί. Ή έχεις κλέψει. Ή έχεις βρει παρατημένες σε κάποιο πάρκινγκ του Κωτσόβολου. Όμως η «εγκατάσταση» του HMA VPN δεν είναι το ίδιο ακριβώς με τη «χρήση» του HMA VPN. Ενώ μπορεί να εγκατασταθεί σε απεριόριστο αριθμό συσκευών, μπορείς να το ενεργοποιήσεις μόνο σε μέχρι 5 συσκευές ταυτόχρονα ή σε 10, με το πρόγραμμα για φίλους και οικογένειες. Τουλάχιστον, εφόσον κάθε εγκατάσταση είναι συνδεδεμένη με τον ίδιο λογαριασμό. Γιατί έχει σημασία η πολιτική καταγραφής; Για κάποιους μπορεί να είναι αδιάφορη. Για κάποιους άλλους, έχει μεγάλη σημασία. Η πολιτική καταγραφής μπορεί να έχει συμβολική αξία: η δέσμευση ενός VPN για όσο το δυνατόν λιγότερες καταγραφές μεταφράζεται σε σεβασμό για το απόρρητό σου και δείχνει πόσο σοβαρά προσεγγίζουμε το ζήτημα της προστασίας των δεδομένων σου. Για παράδειγμα, πολλοί χρήστες μπορεί να θεωρούν φυσιολογικό το να καταγράφει το VPN την ακριβή ώρα ενεργοποίησης ή απενεργοποίησης: εμείς όμως δεν κάνουμε ούτε καν αυτό, γιατί προστατεύουμε με μεγάλη σοβαρότητα τα δεδομένα που γενικά θεωρούνται πιο ευαίσθητα. Η αλήθεια είναι ότι πίσω από τη μείωση των καταγραφών κρύβεται μεγάλη προσπάθεια και ιδιαίτερα υψηλό οικονομικό κόστος. Η δέσμευσή μας για την προστασία του απορρήτου σου δεν είναι θέμα μάρκετινγκ, είναι η προάσπιση των αρχών μας. Η ζωντανή απόδειξη είναι ότι αυτά που λέμε τα εννοούμε. Ωστόσο, η άρνηση καταγραφής δεδομένων έχει πρακτικό όφελος και για τους χρήστες μας: αν ποτέ παραβιαστούν οι βάσεις δεδομένων μας, είτε παράνομα μέσω εισβολής είτε νόμιμα μέσω αστυνομικού εντάλματος, ο όγκος των δεδομένων θα είναι τόσο απογοητευτικά μικρός και δίχως νόημα, που ούτε οι χάκερ ούτε η αστυνομία θα θέλουν να τα χρησιμοποιήσουν. Έτσι, ανεξάρτητα από το τι κάνεις στο διαδίκτυο, μπορούμε πραγματικά να τηρήσουμε την υπόσχεσή μας και να προστατεύσουμε το απόρρητό σου, χωρίς να πάψουμε να συνεργαζόμαστε με τις αρχές, διότι, ως νομική οντότητα, έχουμε την υποχρέωση να το κάνουμε αυτό. Τι στο καλό κάνει εδώ αυτός ο γάιδαρος; Λοιπόν, αυτός είναι ο Τζακ, η μασκότ μας και είναι λίγο εξυπνάκιας. HMA σημαίνει «Hide My Ass», μια φράση που χρησιμοποιούσαμε σταθερά και ελεύθερα για αρκετό καιρό, μέχρι που σκεφτήκαμε ότι μπορεί να κάνει κακό στο προϊόν μας. Και επειδή οι γάιδαροι στα Αγγλικά λέγονται και «Asses», δηλαδή «οπίσθια» τα οποία είθισται να καλύπτουμε, θεωρήσαμε ότι θα είχε γούστο να χρησιμοποιήσουμε ως μασκότ έναν γάιδαρο. Όμως το λογοπαίγνιο πάει ακόμη πιο μακριά, διότι ο ιδρυτής μας ήταν ένα 16χρονο παιδί που ονομαζόταν Jack Cator. Πώς αλλιώς λέγεται ο γάιδαρος στα Αγγλικά; Jack. Παρ’ όλο που τώρα ονομαζόμαστε HMA, θέλουμε να τιμήσουμε το αρχικό λογοπαίγνιο, οπότε ο Τζακ παραμένει η μασκότ μας. Εμφανίζεται στα σόσιαλ, στα email, στις διαφημίσεις μας, και φυσικά, σε ολόκληρο τον ιστότοπό μας. Είμαστε σίγουροι ότι σύντομα θα τον αγαπήσεις κι εσύ, είτε λόγω της αδιάψευστης γοητείας του είτε λόγω του συνδρόμου της Στοκχόλμης. Ειλικρινά τώρα, δεν πρόκειται να σε ρωτήσουμε ποτέ το γιατί."
