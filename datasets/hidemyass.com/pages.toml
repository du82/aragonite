na VPN? Nosotros tampoco, porque nunca nos ha ocurrido y no queremos averiguarlo. Ahora en serio, si aprovechas nuestra garantía de reembolso de 30 días, te devolveremos tu dinero sin preguntas. Y si esperas más de treinta días, o vuelves a comprar HMA otra vez, también puedes solicitar un reembolso, pero no te aseguramos que te lo vayamos a dar. ¿En cuántos dispositivos puedo usar HMA VPN? En tantos dispositivos compatibles como tengas. Puedes ejecutar HMA VPN en una cantidad impactante de dispositivos (iOS, Android, PC, Mac, televisores Android) y puedes instalarlo en todos los dispositivos que tengas. O que te hayan prestado. O que hayas robado. O que hayas encontrado en el aparcamiento de tu centro comercial. Pero «instalar» HMA VPN no es lo mismo que «usar» HMA VPN. Aunque puedes instalarlo en tantos dispositivos como quieras, solo puedes tenerlo activado simultáneamente en un máximo de 5 dispositivos, o en 10 con el plan familiar y para amigos. Al menos, si cada instalación está vinculada a la misma cuenta. ¿Por qué es importante la política de registros? Puede que para algunos no sea importante, pero para otros lo es, y mucho. La política de registro representa el compromiso de una VPN de registrar lo menos posible, lo que muestra su respeto por tu privacidad y la seriedad con la que abordan la protección de sus datos. Por ejemplo, para muchas personas, una VPN que registra exactamente a qué hora encienden o apagan la VPN podría no ser motivo de gran preocupación: pero nuestra falta de voluntad para hacer incluso eso, indica cuán seriamente protegemos los datos que suelen verse como más sensibles. Teniendo en cuenta que se necesita un gran esfuerzo para reducir la recogida de datos, e incluso nos cuesta una cantidad considerable de dinero lograrlo, el valor de subrayar nuestro compromiso con tu privacidad ilustra nuestros principios tanto o más que nuestra publicidad. Es una prueba de que queremos decir lo que decimos y decimos lo que queremos decir. Pero renunciar al registro de datos también tiene un beneficio práctico para nuestros usuarios: significa que si nuestras bases de datos alguna vez se ven comprometidas, ya sea ilegalmente a causa de un hackeo o legalmente a través de algún tipo de citación policial, la cantidad de datos que podrían adquirirse sería tan pequeña y carente de sentido que ni los hackers ni la policía podrían hacer nada con ellos. Por lo tanto, podemos cumplir nuestra promesa de proteger tu privacidad sin importar lo que hagas en línea a la vez que seguimos cooperando con las autoridades, a lo que estamos obligados como entidad legal. ¿Qué está haciendo ahí ese burro? Ese es Jack, nuestra mascota. HMA son las siglas de «Hide My Ass», un juego de palabras en inglés (oculta mi trasero/mi asno) que solíamos utilizar de forma más abierta antes de caer en la cuenta de que podría perjudicar nuestra marca. Y como a los burros también se les conoce como «asnos», y teníamos la costumbre de esconderlos, parecía lógico escoger uno como mascota. Pero el juego de palabras va más allá, porque nuestro fundador era un chico de 16 años llamado Jack Cator. ¿Y qué otro nombre se le da a un burro? «Jack» (o jaco). Y aunque ahora se nos conoce como «HMA», no vamos a renunciar a un doble juego de palabras tan bueno, así que Jack se queda con nosotros. Aparecerá en nuestros correos electrónicos, redes sociales, anuncios y, por supuesto, en todo nuestro sitio web. Estamos seguros de que terminará gustándote, ya sea por su innegable encanto o por culpa del síndrome de Estocolmo. No somos quisquillosos."
