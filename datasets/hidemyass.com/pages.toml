full_description = 'HMA هو شبكة VPN مدقّقة بلا سجل: ما الذي يعنيه هذا؟ بفضل سياسة عدم تسجيل الدخول التي يتبعها HMA، يمكننا حماية خصوصيتك وعدم الكشف عن هويتك بشكل أفضل. ولكن هذه ليست سوى الخطوة الأولى نحو تحقيق غايتنا بأن نكون الراعي الرسمي الموثوق به مطلقًا في مجال حماية الخصوصية عبر شبكة الإنترنت. الحصول على HMA VPN ضمان استرداد الأموال خلال 30 يومًا الأشياء التي لن تُسجل مطلقًا البيانات المجهولة التي نحتاجها الأشياء التي لن تُسجل مطلقًا باستخدام سياسة عدم التسجيل، يمكنك استخدام شبكة HMA VPN وأنت تعلم أننا لن نجمع أو نُسجل أو نطلع على أيٍّ مما يلي: عنوان IP الأصلي الخاص بك، والذي يمكن استخدامه للتعرف عليك. وهذا يعني أنك عندما تستخدم شبكة HMA VPN، فإنك ستصبح مجهول الهوية حتى بالنسبة لنا. أي من استفساراتك حول DNS. لن تكون هناك أيّ طريقة لمعرفة المواقع الإلكترونية التي تزورها، ولن يقدر أيّ أحد آخر على ذلك أيضًا. فنحن نعتمد على أماننا الخاص، وخوادم DNS الخالية من السجلات لدينا كي تتم حماية استفساراتك أيضًا من كشفها للأطراف الخارجية. نشاطك، والذي يشتمل على المواقع التي تسجّل الدخول إليها، والخدمات التي تجرب استخدامها، والتطبيقات التي تُشغلها، ومقاطع الفيديو التي تشاهدها،… وكل ما تفعله عبر شبكة الإنترنت بشكل أساسي. كميّة البيانات التي نقلتها. الوقت الذي اتصلت فيه بالإنترنت: نحن لا نجمع الطوابع الزمنية الخاصة باتصالاتك. البيانات المجهولة التي نحتاجها للأسف، إن شبكات VPN ليست سحرية. ولتعمل هذه الوظيفة، يجب أن نجمع بعض البيانات المجهولة بشكل مؤقت: اليوم الذي تتصل فيه والوقت العام (الصباح أو المساء). وهذا يجعل من الممكن استكشاف الأخطاء وإصلاحها وتقديم خدمة العملاء. كمية البيانات المرسلة، مع تقريبها إلى مائة ميجا بايت. ويساعد ذلك في عمليات تحسين سعة الشبكة والخادم. ليست لدينا أي فكرة عن البيانات الموجودة بالفعل. تُخزن كل هذه البيانات لمدة 35 يومًا فقط، وعندها تُحذف البيانات نهائيًا. "لقد عملنا [مع HMA] للمساعدة على تعزيز الأمان، والأهمّ من ذلك، تعزيز خصوصية برامج عملاء VPN لديهم لتنمية قاعدة عملائهم العالميين". تمّ تدقيقها لإرضائك نحن نعلم أنه ليس كافيًا أن نقول ببساطة إنّنا لا نسجّل بياناتك – لِذا التزمنا بكلمتنا وعيَّنا شركة استشارية مستقلة في مجال الخطر الإلكتروني "VerSprite" للتدقيق في شبكة VPN الخاصة بنا. وبمساعدتهم، نحن فخورون بالإعلان بأننا ربحنا على أفضل تصنيف ممكن لديهم: "تأثير ذو خطر منخفض على خصوصية المستخدم". باختصار، إنهم يدعوننا بالصفوة. #ver-figure .container {padding-bottom:0;} قد تتساءل… لماذا تعد سياسة التسجيل مهمة؟ إذا كنت تسأل عن ذلك، فربما لا تكون ضمن جمهورنا المستهدف. باختصار، سياسات التسجيل لدينا هي فرصتنا لنتحلى بالشفافية قدر الإمكان فيما نحتاج لمعرفته منك، وما لا نحتاجه. دونها، لن تعرف ما الذي نستطيع فعله ببياناتك، كما سيكون من الصعب عليك أن تثق بنا في معرفة بياناتك، أليس كذلك؟ كيف يتعامل HMA مع تتبع الجهات الخارجية؟ حسنًا، هنا تتعقد الأمور أكثر قليلًا: بالنسبة إلى منتج سطح المكتب، لا نستخدم أي أدوات من إنتاج جهات خارجية قطعًا (وهذا من شأنه أن يجعلنا نتفوق على معظم منافسينا). أما بالنسبة لامتدادات Chrome وFirefox، فنحن نستخدم Google Analytics لتكوين فهم أفضل عن كيفية استخدام الأشخاص لمنتجاتنا بغية تحسينها. ومع ذلك، فنحن نستخدم الكثير من وسائل حماية البيانات لتجنب تلقي أي معلومات تعريف. بالنسبة إلى نظامي التشغيل iOS وAndroid، فنحن نستخدم ثلاث أدوات لتحليل البيانات وهم: Google Firebase وGoogle Fabric Crashlyics وAppsflyer. يساعدنا Google Firebase على فهم كيفية استخدام الأشخاص لمنتجاتنا بشكل أفضل. وعادة ما يوفر بيانات تعريف، ولكننا اخترنا عدم تلقيها واستخدمنا المعرّفات مجهولة الهوية الخاصة بنا بدلًا من ذلك. يمكنك إلغاء الاشتراك في خاصية عرض هذه البيانات المجهولة من إعدادات التطبيق. يساعدنا Google Fabric Crashlyics في تحديد المشكلات المتعلقة باستقرار التطبيق وأدائه. لا يمكنك إلغاء الاشتراك من هذا الخيار، ولكنه لا يحتوي على أيّ بيانات شخصيّة مطلقًا. يساعدنا Appsflyer في معرفة الإعلانات التي ترغب بها أو لا. هل ترغب في مساعدة فرق التسويق لدينا في أداء وظائفهم لمساعدتك؟ ولكن يمكنك إلغاء الاشتراك من إعدادات التطبيق. ماذا عن معلومات إعداد الفواتير؟ هناك جهات خارجية مسؤولة عن معالجة عملية الدفع الخاصة بنا، وهم يتبعون سياسات خصوصية خاصة بهم. يمكنك معرفة مَن نعمل معهم من خلال رسالة التأكيد على البريد الإلكتروني، غير أنّهم بالفعل يلتزمون بمعيار صناعة بطاقات الدفع (PCI) ولا يمكنهم استخدام معلوماتك لأيّ غرض غير تسهيل عملية الدف