يكباحثة تقنية، لدى VPNMentor تُعد قائمة مواقع الخوادم المتاحة التي توفرها HMA جديرة بالملاحظة بشكل خاص لأنها تغطي المناطق التي غالبًا ما تتجاهلها شركات VPN الأخرى. فلديها، على سبيل المثال، العديد من مواقع الخوادم عبر القارة الأفريقية. ماكس إيدي كبير المحللين الأمنيين، لدى PCmag.com بعض المعلومات التي يُفضل معرفتها… هل ستتسبب شبكة VPN في إبطاء اتصالي؟ بصراحة: هذا ممكن. انظر، عند استخدام إحدى شبكات VPN، وقبل الانتقال إلى موقع الويب أو الخدمة التي تريد استخدامها، ينتقل اتصالك أولًا إلى أحد خوادمنا البعيدة. لا تُعد هذه العملية عملية لحظية، لذلك إذا اتصل شخص ما في الولايات المتحدة بخادم في الهند لزيارة موقع رئيس البلدية المحلي هناك، فإن بياناته تنتقل بشكل فعال حول العالم – مرتين – للوصول إلى شاشته: من جهاز التوجيه الخاص به إلى خادم HMA الموجود في الهند، إلى موقع رئيس البلدية الذي من المحتمل أن يكون مستضافًا على خادم في الولايات المتحدة، ثم يعود إلى الخادم الموجود في الهند، ثم يعود إلى جهاز التوجيه الخاص بالشخص. وإذا كان اتصالك سريعًا بدرجة كافية، وقمت بالاتصال بأحد خوادمنا عالية السرعة، فسيكون التباطؤ ضئيلًا للغاية ولن تلاحظه. أما إذا كان اتصالك بطيئًا، وقمت بالاتصال بأحد خوادمنا البعيدة، فمن المحتمل أن يكون هناك تباطؤ ملحوظ. ولحسن الحظ، نمتلك أدوات مثل ميزة الاتصال السريع ستضمن عدم القلق أبدًا بشأن أي تباطؤ عندما تحافظ على خصوصيتك على الإنترنت باستخدام HMA VPN. هل لديكم أي قواعد تتعلق بضمان استرداد الأموال لمدة 30 يومًا؟ لدينا قاعدة واحدة فقط: وهي عدم إرجاع المنتج بسبب أي ضرر مائي. ألا تعلمون مدى صعوبة تجفيف شبكة VPN؟ ليست لدينا أي قاعدة، لأنه لم يحدث ذلك من قبل، ولا نخطط لمعرفة ذلك. لكن لا، حقًا – فإنك إذا استفدت من ضمان استرداد الأموال لمدة 30 يومًا، فستسترد أموالك، دون طرح أي أسئلة عليك. ومع ذلك، إذا انتظرت حتى انقضاء الثلاثين يومًا، أو أعدت شراء HMA مرة أخرى، فلا يزال بإمكانك طلب استرداد الأموال. لكن لا نضمن لك أننا سنمنحك ذلك. كم عدد الأجهزة التي يمكنني تثبيت HMA VPN عليها؟ أكبر عدد من الأجهزة المتوافقة لديك. لن نُقيد عليك العدد الذي تريده، لكن لا يزال بإمكانك تشغيل HMA VPN على عدد هائل من الأجهزة التي تعمل بنظام تشغيل iOS أو Android وأجهزة الكمبيوتر الشخصية وأجهزة Mac وأجهزة Android TV – ويمكنك تثبيته على العديد من هذه الأجهزة التي تمتلكها. أو التي تمت استعارتها. أو التي تمت سرقتها. أو التي عُثر عليها في موقف انتظار لشركة Best Buy. لكن لا تُعد عملية "تثبيت" HMA VPN كعملية "استخدامه" بالضبط. فبينما يمكن تثبيته على أي عدد من الأجهزة، يمكنك تشغيله على ما يصل إلى 5 أجهزة في الوقت نفسه فقط، أو 10 أجهزة في خطة الأصدقاء والعائلة. وعلى الأقل، ما دام كل تثبيت متصلًا بالحساب نفسه. لماذا تعد سياسة التسجيل مهمة؟ قد لا تكون مهمة بالنسبة لبعض الناس. بينما بالنسبة للآخرين، يُعد الأمر مهمًا جدًا. يمكن النظر إلى سياسة التسجيل على أنها شكل رمزي: فإن التزام شبكة VPN بتسجيل أقل قدر ممكن يمثل احترامها لخصوصيتك ومدى جدية تعاملها مع مسألة حماية بياناتك. فعلى سبيل المثال، بالنسبة لكثير من الأشخاص، قد لا يكون تسجيل شبكة VPN للوقت الذي يتم فيه تشغيلها أو إيقاف تشغيلها بالضبط مصدر قلق كبير: لكن نأمل أن يشير فقط عدم رغبتنا في القيام بذلك إلى مدى جدية حمايتنا للبيانات التي يُنظر إليها عمومًا على أنها أكثر حساسية. ومع الأخذ في الاعتبار أن الأمر يتطلب مجهودًا كبيرًا لتقليل التسجيل، وحتى أنه يكلفنا مبلغًا كبيرًا من المال لجمعها، فإن قيمة التأكيد على التزامنا تجاه خصوصيتك تنبع من توضيح مبادئنا بقدر تعزيز تسويق منتجاتنا. فهي دليل على أننا نعني ما نقوله ونقول ما نعنيه. لكن عملية رفض تسجيل البيانات لها فائدة عملية لمستخدمينا أيضًا: فذلك يعني أنه إذا كان يتحتم اختراق قواعد بياناتنا، إما بشكل غير قانوني عن طريق القرصنة وإما بشكل قانوني عبر نوع من أوامر الإحضار الشرطية، فإن كمية البيانات التي يمكن الحصول عليها ستكون صغيرة للغاية ولا معنى لها كي لا يستطيع المتسللون ولا الشرطة فعل أي شيء بها. وبالتالي، يمكننا أن نفي حقًا بوعدنا بحماية خصوصيتك بغض النظر عما تفعله عبر الإنترنت مع التعاون مع السلطات في الوقت نفسه، لأننا ملزمون بالقيام بذلك ككيان قانوني. ما الذي يفعله المساعد هناك؟ حسنًا، إنه جاك، التميمة الخاصة بنا، ونخشى أنه ذكي جدًا بشكل غريب. لذا فإن HMA تُعد اختصارًا لعبارة "Hide My Ass"، وهي كانت لقبًا اعتدنا استخدامه بشكل أكثر اتساقًا وانفتاحًا قبل أن نتصور أنه قد يضر بعلامتنا التجارية أكثر من مساعدتها. ومنذ ذلك الحين أصبح يُطلق على الحمير أيضًا اسم "المساعدين"، وكنا معتادين على إخفائهم... حسنًا، فقد بدا الأمر مناسبًا بشكل طبيعي للتميمة. لكن التورية في الواقع أعمق من ذلك، لأن مؤسسنا كان في الواقع طفلًا يبلغ من العمر 16 عامًا يُدعى جاك كاتور. وما الاسم الآخر الذي يُطلق على ذكر الحمار؟ إنه "جاك". وعلى الرغم من أننا نستخدم الاختصار HMA الآن، إلا إننا لسنا على وشك التخلي عن شريحة مزدوجة الطبقات من التلاعب بالألفاظ كهذا، لذلك ظل الاسم جاك عالقًا في الأذهان. حيث سيظهر على وسائل التواصل الاجتماعي الخاصة بنا وفي رسائل البريد الإلكتروني وفي إعلاناتنا وبالطبع في جميع أنحاء موقعنا على الويب. ونحن على يقين من أنك ستعتاد على حبه قريبًا، إما بسبب وسامته التي لا تقبل الجدل وإما بسبب متلازمة ستوكهولم التي لديه. وبصراحة، لسنا دقيقين في الاختيار.'
