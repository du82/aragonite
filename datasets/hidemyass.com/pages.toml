itch Automatically launch HMA to protect your apps. No Log DNS Rely on our no-log DNS to avoid leaving a trail. Leak Shield Stop IPv4, IPv6, and DNS leaks when you browse. See more features We’ve learned a few things in 19+ years For example, we’ve learned that no matter how great your VPN is, it means nothing if your customers don’t love — or trust — you. Which is why we’ll do everything in our power to earn both, with our thirty-day money-back guarantee, world-class support team, and constant updates. Try HMA VPN risk-free with our 30-day money-back guarantee 1100+ servers in 290+ locations worldwide 20 Gbps connection speeds Servers for streaming & P2P connections Lightning Connect, Split-Tunneling, Kill Switch, & more! For Unlimited installs with 5 simultaneous connections 1 month plan 1 month plan Regular PriceRs299.00 /MO Regular PriceRs 299 Regular PriceRs 299billed at once Buy now Buy now 12 month plan Save Offer Price33% 12 month plan Offer PriceRs199.00 /MO Save Offer Price33% Regular PriceRs 3,588 Offer PriceRs 2,388billed at once Buy now Buy now Best Deal 36 month plan Save Offer Price54% 36 month plan Offer PriceRs139.00 /MO Save Offer Price54% Regular PriceRs 10,764 Offer PriceRs 5,004billed at once Buy now Buy now 30-day money-back guarantee Accepted payment methods: Haven't found the right one for you? View more plans Live Chat A few words about us Expert reviews We found [HMA]’s encryption methods and security features top-notch. The user interface is one of the easiest to use and we chuckled at the donkey animation going stealth every time. Holly AguirreContributor, Reviewed Some of this VPN’s biggest strengths are its user-friendly interface, impressive speeds, and ability to bypass geoblocks (even Netflix’s!). Katie KasunicTechnology Researcher, VPNMentor The list of available server locations offered by HMA is particularly noteworthy because it covers regions often ignored by other VPN companies. It has, for example, numerous server locations across the continent of Africa. Max Eddy Senior Security Analyst, PCmag.com Some good-to-know tips… Will a VPN slow down my connection? No lie: it’s possible. See, when you use a VPN, before you go to the website or service you want to use, your connection first hops to one of our remote servers. This is not an instantaneous process, so if someone in the US connects to a server in India to visit their local mayor’s website, their data is effectively traveling around the world — twice — to reach their screen: from their router to the HMA server in India, to the mayor’s website that’s likely hosted on a server in the states, then back to the server in India, then back to their router. If your connection is fast enough, and you connect to one of our high-speed servers, the slowdown will be so negligible you won't notice it. If your connection is slow, and you connect to one of our more remote servers, there’s likely to be a noticeable slowdown. Fortunately, we have tools like Lightning Connect that’ll ensure you never have to worry about any slowdown when you’re keeping yourself private online with HMA VPN. Do you have any rules for your 30-day money-back guarantee? Just one: please don’t return it with any water damage. Do you know how hard it is to dry out a VPN? We don’t, because it’s never happened before, and we don’t plan to find out. But no, for real — if you take advantage of our 30-day money-back guarantee, you get your money back, no questions asked. However, if you wait past thirty days, or you re-buy HMA a second time, you can still ask for a refund. But it’s not guaranteed we’ll give you one. How many devices can I install HMA VPN on? As many compatible devices as you have. We’re not quite Doom, but you can still run HMA VPN on a shocking number of devices — iOS, Androids, PCs, Macs, Android TVs — and you can install it on as many of those devices as you own. Or borrowed. Or stolen. Or find unattended in a Best Buy parking lot. But “installing” HMA VPN isn’t