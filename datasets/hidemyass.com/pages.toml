full_description = 'سياسة الخصوصية إصدار أبريل 2024 توضح هذه السياسة نبذة عنّا وكيف نجمع بياناتك الشخصية ونعالجها ونحميها، وحقوق الخصوصية والخيارات المتوفرة لك فيما يتعلق بالاطّلاع على بياناتك الشخصية وتصحيحها وحذفها. للإصدارات القديمة من هذه الوثيقة، يُرجى زيارة أرشيف الوثائق القانونية. لا تنطبق هذه السياسة على بيانات الخدمة التي قد يتم جمعها من خلال منتجات مختلفة، مثل مضاد الفيروسات، أو على تشغيل ملفات تعريف الارتباط على موقعنا الإلكتروني. لمعرفة معلومات عن كيفية معالجتنا لملفات تعريف الارتباط الخاصة بموقع الويب، يُرجى زيارة سياسة ملفات تعريف الارتباط. قد يتم استكمال المعلومات المتعلقة بممارسات البيانات الشخصية الخاصة بنا في إعدادات المنتج أو الشروط التعاقدية أو الإشعارات المُقدَّمة قبل جمع البيانات أو عند جمعها. من نحن؟ نحن جزء من Gen™‎ - وهي شركة عالمية تمتلك عائلة من العلامات التجارية الاستهلاكية الموثوق بها. وجهة التحكم في بياناتك الشخصية هي شركة Avast Software s.r.o.، التي يقع مقر عملها الرئيسي في1737/1A Pikrtova, Prague 4, Czech Republic, 140 00 (يُشار إليها فيما يلي باسم "نحن" أو "لنا" أو "الخاص بنا" أو " HMA" في هذه السياسة). إذا كنت تعيش في المملكة المتحدة، فإن ممثل Avast المعتمد في المملكة المتحدة هو شركة NortonLifeLock UK Limited التي يقع مقرها في 100 New Bridge Street, London, England EC4V 6JA. ما بيانات عمليات شبكة V PN لدينا؟ بوجهٍ عام، نحتاج إلى معالجة بعض بياناتك الشخصية وذلك، على وجه التحديد، لتزويدك بمنتجاتنا وخدماتنا أو لتحسين منتجاتنا وخدماتنا والارتقاء بها أو لأغراض التسويق المباشر أو الامتثال لالتزاماتنا القانونية. نحاول الحد من جمع أي بيانات ونقوم بتجميعها أو حذفها في أقرب وقت ممكن، وإن لم تكن ضرورية، فإننا لا نجمعها على الإطلاق. سنوضح كيفية معالجتنا للبيانات في الأقسام التالية، ولكن لنبدأ بالبيانات التي لا نجمعها. سياسة عدم التسجيل - البيانات التي لا نرسلها إلى خوادمنا. المدة. عنوان IP الأصلي. أي استعلامات DNS أثناء الاتصال. نعتمد على خوادم DNS الآمنة لدينا مما يوفر الحماية لاستعلاماتك من الانكشاف للأطراف الثالثة. محفوظات التصفح. البيانات المُحوَّلة. قد نجمع بيانات شخصية عنك ونعالجها في الحالات التالية: وظيفة المنتج الحصول على بيانات الخدمة من خوادم VPN لدينا في حالة استخدامك خدمة VPN، فإننا نجمع القدر الأدنى من المعلومات اللازمة لتقديم الخدمة وتشغيلها وكذلك للحفاظ على سلامة وكفاءة عملها. في ما يلي البيانات التي نجمعها للتحقق من عمل البنية التحتية لخدمة VPN لدينا ("بيانات الخدمة"): بيانات الخدمة فيما نستخدمها يوم الاتصالمثال: نخزن التاريخ الذي تم فيه اتصالك مع مُعرِّف داخلي، ولكن ليس الوقت بالضبط: يتم تحديد الفترات الزمنية إما 12 ظهرًا أو 12 ليلاً. استكشاف المشكلات وإصلاحها لتقديم الدعم ومعالجة إساءة الاستخدام.مثال: معرفة مقدار المستخدمين النشطين يوميًا. المقدار التقريبي للبيانات المرسلةمثال: إذا حوّل المستخدم خلال الجلسة 364 ميجا بايت، فنقوم بتسجيلها 300 ميجابايت. يتم تسجيل 1843 ميجابايت من البيانات المحولة على أنها 1000 ميجابايت. لا نحتفظ إلا بالرقم الأول من القيمة مع مًعرّف داخلي. التخطيط لدعم توفير قدرة شبكية جديدة وإدخال تحسينات على الخادم.مثال: قد نُوّزع قدرة أعلى لتلبية الطلب ونتحقق من استمرار توفير السرعات لدى جميع المستخدمين. نُخزن بيانات الخدمة للخوادم لمدة 35 يومًا، ويتم حذفها، بعد انقضاء تلك المدة، بشكلٍ متكرر — على سبيل المثال، البيانات التي يتم إنشاؤها في 3 يناير 2020 تُحذف في 7 فبراير 2020. الحصول على بيانات الخدمة من عملاء VPN لدينا للتأكد من قيام عملاء VPN بوظيفتهم على النحو السليم وبدون أخطاء، يجب علينا معرفة عدد الأخطاء المحددة لدينا. تتعلق هذه البيانات بالتفاعلات التي تتم مع التطبيق ولا يمكن استخدامها لمعرفة فيما تستخدم خدمة VPN. بيانات العميل فيما نستخدمها أحداث الاتصالأحداث مثل محاولة الاتصال وقطعه وخطأ الاتصال وما إلى ذلك مع معرف داخلي يستخدم فقط لهذا ("معرف أحداث الاتصال") تشغيل خدمة VPN وتقديمها بجودة عالية. لا نقوم بإقران أي مستخدم فردي بهذه البيانات.مثال: كم عدد المستخدمين غير المعروفين الذين يواجهون نفس الخطأ؟ أحداث التطبيقأحداث مثل الاتصال التلقائي وحدث إلغاء التثبيت وما إلى ذلك مع معرف داخلي ("معرف أحداث التطبيق") التخطيط لتطوير المنتجات والتحليلاتمثال: كم عدد المستخدمين لدينا؟ هل تحظى ميزتنا الجديدة للعميل بقبول واسع؟ هل يلغي الأشخاص التثبيت بعد إصدارنا الأخير؟ تقارير الأعطال التي يقوم المستخدم بإنشائها وإرسالهاقد نجمع بيانات مثل البريد الإلكتروني أو إصدار التطبيق أو المعرفات الداخلية الموضحة أعلاه. المساعدة في استكشاف المشكلة وحلها. لا نرسل تلقائيًا أي بيانات حساسة للخصوصية - يجب أن تسمح صراحة بإرسالها إلينا وتتحقق من ماهية البيانات التي سيتم إرسالها قبل مشاركتها معنا.يُرجى ملاحظة أنه إذا قمت بتزويدنا بالمعلومات المذكورة أعلاه وكذلك ببياناتك الشخصية، مثل، في تقرير الأعطال المخصص الذي تقرر إرساله إلينا، يمكننا إضافة هذه المعلومات إلى بيانات الخدمة وقد يمكن إبلاغك بها.مثال: يتعطل التطبيق على بعض الأجهزة. تعد هذه هي طريقة مساعدة دعم العملاء بشأن المشكلات الخاصة بالأجهزة. نُخزن بيانات خدمة العملاء لمدة سنتين، ويتم حذفها، بعد انقضاء تلك المدة، بشكلٍ متكرر — على سبيل المثال، البيانات التي يتم إنشاؤها في 3 يناير 2019 تُحذف في 3 فبراير 2021. إنشاء الحساب وإدارته في حالة قيامك بإنشاء حساب لدينا (ملاحظة: يجب إنشاء حساب لاستخدام خدمة VPN)، سنكون بحاجة للحصول على معلومات عنك. في ما يلي البيانات الشخصية التي يتم إنشاؤها وتخزينها لإدارة حسابك: بيانات الحساب فيما نستخدمها عنوان البريد الإلكتروني إرسال إيصالات الشراء والمراسلات وأخبار المنتجات بين الفينة والأخرى اسم المستخدم (للإصدارات القديمة فقط) إدارة حسابك وتيسير تسجيل دخولك إلى الخدمة. لا نجمع هذه المعلومات مرة أخرى. لا تُستخدم أسماء المستخدمين إلا مع الإصدارات القديمة لدى عملاء VPN لدينا. رمز التنشيط تفعيل اشتراكك تاريخ تجديد الاشتراك إبلاغنا بفترة سريان الحساب يتم تخزين جميع البيانات الواردة أعلاه طوال فترة استخدامك لخدمتنا لكونها ضرورية لتقديم الخدمة. ومع ذلك، لا يتم إقران بيانات حسابك مع استخدام أنشطتك. يمكنك طلب نسخة من بيانات حسابك من خلال الدعم. الفوترة والدفع نعتمد على معالجات دفعٍ تابعة لأطرافٍ ثالثةٍ لمعالجة مشترياتك من المنتجات. يمكنك معرفة مقدم الخدمات الذي نعمل معه لنقطة الشراء التي اخترتها (على سبيل المثال، موقعنا الإلكتروني ومتجر التطبيقات وما إلى ذلك) من خلال الاطلاع على رسالة البريد الإلكتروني أو الإيصال الخاص بالمعاملة، وهذه قائمة بمعالجي الدفع الذين نتعاون معهم وسياسات خصوصيتهم: 2Checkout/Verifone - https://www.2checkout.com/legal/privacy/ Google Play - https://policies.google.com/privacy?hl=en-US Apple iTunes - https://www.apple.com/legal/privacy/en-ww/ يُعد مقدمو الخدمات هؤلاء مراقبين مستقلين ويجوز لهم جمع مجموعةٍ متنوعةٍ من المعلومات المتعلقة بك لإتمام عملية الشراء. ويمتثل جميعهم لمعايير صناعة بطاقات الدفع أو ما يعادلها ويُحظر عليهم استخدام بياناتك الشخصية لأي أمر بخلاف تسهيل عملية الدفع وإدارة الاشتراك أو كما هو موضح بخلاف ذلك في شروط الخدمة وسياسة الخصوصية المعمول بها. قد تتم مشاركة بعض من بيانات الفوترة هذه معنا لأجل الكشف عن عمليات الاحتيال ومنعها أو المساعدة في دعم العميل أو لاستخدامها بمثابة سجل لمدفوعاتك لأغراض المحاسبة والضرائب وإصدار الفواتير. هذه البيانات هي ما نسميها "بيانات الفوترة" وهي تتضمن اسمك وعنوانك وعنوان البريد الإلكتروني والمنتج (الاشتراك الذي قمت بشرائه) ومدته ومعلومات الدفع. سيقوم مقدم خدمة الدفع بمعالجة رقم بطاقة الائتمان خاصتك ولكن لا تتم مشاركتها معنا. من جانبنا، نقوم بتخزين بيانات الفوترة طالما واصلت استخدام خدمتنا وحتى 10 سنواتٍ بعد ذلك بسبب التزاماتنا القانونية. إذا تغيرت الالتزامات القانونية أو كنا بحاجةٍ إلى حل النزاعات وإنفاذ اتفاقياتنا، فقد نضطر إلى حفظ هذه البيانات لمدةٍ أطول من ذلك. الاتصالات إذا اتصلت بنا عبر البريد الإلكتروني، يتم تخزين رسالتك لمدة 24 شهرًا ما لم يقتض القانون أو تتطلب ظروف استثنائية أخرى خلاف ذلك، ونفعل ذلك لتسريع إنجاز عمليات الدعم والمتابعة. إذا كنت أحد مستخدمي خدمتنا أو كنت قد اشتركت في موقع الويب الخاص بنا، سنرسل لك الاتصالات التجارية عبر هذه القناة في صورة رسائل إخبارية أو إشعارات مدونة. يُرجى ملاحظة أنه إذا لم ترغب في أن تكون ضمن قائمتنا البريدية، يمكنك استخدام رابط "إلغاء الاشتراك" المتوفر في كل اتصال نرسله إليك. أدوات الأطراف الثالثة المستخدمة للتحليلات لتحليل أحداث التطبيق الواردة من عملاء VPN لدينا من أجل فهم كيفية عمل خدماتنا أو مدى استقرارها أو نجاحها، نعتمد على أدواتنا الخاصة بالتحليل إلى أقصى حدٍ ممكن. في ما يلي أدوات الأطراف الثالثة التي نستخدمها وكيفية استخدامها وسياسات خصوصيتها: Google Firebase Analytics على أنظمة iOS وAndroid تساعدنا Firebase على فهم كيفية تفاعل الأشخاص مع بعض جوانب خدماتنا. وعلى الرغم من أن Firebase عادةً ما تعتمد على معرّف الإعلانات في نظام Android أو معرّف أصحاب الإعلانات في نظام iOS، فليس هذا هو الحال معنا لأننا اخترنا استخدام معرِّفاتنا ا