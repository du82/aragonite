title = "High-Performance Graphics 2024 — July 26-28, with SIGGRAPH"
description = "High-Performance Graphics 2024 – July 26-28, home page"
full_description = "We hope you enjoyed HPG 2024, and look forward to seeing you at HPG 2025, co-hosted with EGSR in Copenhagen, Denmark! High-Performance Graphics (HPG) is the leading international forum for performance-oriented graphics and imaging systems research, including innovative algorithms, efficient implementations, languages, compilers, parallelism, and hardware architectures for high-performance graphics. The conference brings together researchers, engineers, and architects to discuss the complex interactions of parallel and custom hardware, novel programming models, and efficient algorithms in the design of systems for current and future graphics and visual computing applications. HPG2024 was co-hosted with SIGGRAPH in Denver, Colorado on Friday July 26 through Sunday July 28 2024."
