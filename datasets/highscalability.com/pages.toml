["https://highscalability.com/gossip-protocol-explained"]
title = "Gossip Protocol Explained - High Scalability -"
description = """
You can subscribe to the system design newsletter to excel in system design interviews and software architecture. The original article was published on systemdesign.one website.





What Is Gossip Protocol?

The typical problems in a distributed system are the following [1], [11]:

 * maintaining the system state (liveness of nodes)
 * communication"""
full_description = "distributed algorithm Gossip Protocol Explained NK 16 Jul 2023 — 16 min read You can subscribe to the system design newsletter to excel in system design interviews and software architecture. The original article was published on systemdesign.one website.What Is Gossip Protocol?The typical problems in a distributed system are the following [1], [11]:maintaining the system state (liveness of nodes)communication between nodesThe potential solutions to these problems are as follows [1]:centralized state management servicepeer-to-peer state management serviceCentralized State Management ServiceA centralized state management service such as Apache Zookeeper can be configured as the service discovery to keep track of the state of every node in the system. Although this approach provides a strong consistency guarantee, the primary drawbacks are the state management service becomes a single point of failure and runs into scalability problems for a large distributed system [1], [11].Peer-To-Peer State Management ServiceThe peer-to-peer state management approach is inclined towards high availability and eventual consistency. The gossip protocol algorithms can be used to implement peer-to-peer state management services with high scalability and improved resilience [1].The gossip protocol is also known as the epidemic protocol because the transmission of the messages is similar to the way how epidemics spread. The concept of communication in gossip protocol is analogous to the spread of rumors among the office staff or the dissemination of information on a social media website [4], [8].Broadcast ProtocolsThe popular message broadcasting techniques in a distributed system are the following:point-to-point broadcasteager reliable broadcastgossip protocolPoint-To-Point BroadcastThe producer sends a message directly to the consumers in a point-to-point broadcast. The retry mechanism on the producer and deduplication mechanism on the consumers makes the point-to-point broadcast reliable. The messages will be lost when the producer and the consumer fail simultaneously [3].Eager Reliable BroadcastEvery node re-broadcasts the messages to every other node via reliable network links. This approach provides improved fault tolerance because messages are not lost when both the producer and the consumer fail simultaneously. The message will be re-broadcast by the remaining nodes. The caveats of eager reliable broadcast are the following [3], [8]:significant network bandwidth usage due to O(n²) messages being broadcast for n number of nodessending node can become a bottleneck due to O(n) linear broadcastevery node stores the list of all the nodes in the system causing increased storage costsGossip ProtocolThe gossip protocol is a decentralized peer-to-peer communication technique to transmit messages in an enormous distributed system [1], [8]. The key concept of gossip protocol is that every node periodically sends out a message to a subset of other random nodes [8], [2]. The entire system will receive the particular message eventually with a high probability [11], [3]. In layman’s terms, the gossip protocol is a technique for nodes to build a global map through limited local interactions [1].The gossip protocol is built on a robust, scalable, and eventually consistent algorithm. The gossip protocol is typically used to maintain the node membership list, achieve consensus, and fault detection in a distributed system [2]. In addition, additional information such as application-level data can be piggybacked on gossip messages [1].The gossip protocol is reliable because a node failure can be overcome by the retransmission of a message by another node. First-in-first-out (FIFO) broadcast, causality broadcast, and total order broadcast can be implemented with gossip protocol [3].The gossip protocol parameters such as cycle and fanout can be tuned to improve the probabilistic guarantees of the gossip protocol. The following tools offer a high-end simulation and visualization of the gossip protocol [8], [5]:serf convergence simulatorgossip simulatorThe following characteristics of the gossip protocol make it an optimal choice as the communication protocol in a large-scale distributed system [12]:limits the number of messages transmitted by each nodelimits the bandwidth consumption to prevent the degradation of application performancetolerates network and node failuresThe gossip protocol can be used to keep nodes consistent only when the operations executed are commutative and serializability is not necessary. The tombstone is a special entry to invalidate the data entries that have a matching key without actual deletion of the data. The gossip protocol deletes the data from a node using a tombstone.Types of Gossip ProtocolThe time required by the gossip protocol to propagate a message across the system and the network traffic generated in propagating a message must be taken into consideration while choosing the type of gossip protocol for a particular use case [10]. The gossip protocol can be broadly categorized into the following types [8], [10]:anti-entropy modelrumor-mongering modelaggregation modelAnti-Entropy Gossip ProtocolThe anti-entropy algorithm was introduced to reduce the entropy between replicas of a stateful service such as the database. The replicated data is compared and the difference between replicas are patched [10]. The node with the newest message shares it with other nodes in every gossip round [8].The anti-entropy model usually transfers the whole dataset resulting in unnecessary bandwidth usage. The techniques such as checksum, recent update list, and Merkle tree can be used to identify the differences between nodes to avoid transmission of the entire dataset and reduce network bandwidth usage. The anti-entropy gossip protocol will send an unbounded number of messages without termination [8].Rumor-Mongering Gossip ProtocolThe rumor-mongering protocol is also known as the dissemination protocol. The rumor-mongering cycle occurs relatively more frequently than anti-entropy cycles and floods the network with the worst-case load [10]. The rumor-mongering model utilizes fewer resources such as network bandwidth as only the latest updates are transferred across nodes [8].A message will be marked as removed after a few rounds of communication to limit the number of messages. There is usually a high probability that a message will reach all the nodes [8].Aggregation Gossip ProtocolThe aggregation gossip protocol computes a system-wide aggregate by sampling information across every node and combining the values to generate a system-wide value [10].Further system design learning resourcesSubscribe to the system design newsletter and never miss a new blog post again. You will also receive the ultimate guide to approaching system design interviews on newsletter sign-up.Strategies to Spread a Message through Gossip ProtocolThe gossip protocol is an optimal framework to build a highly available service. The strategy to spread a message through gossip protocol should be chosen based on the service requirements and available network conditions. There are tradeoffs in terms of bandwidth, latency, and reliability with each strategy to spread a message. The strategies to spread a message apply to both anti-entropy and rumor-mongering models. The different strategies to spread a message with the gossip protocol are as follows [8], [5], [2]:push modelpull modelpush-pull modelPush ModelThe push model is efficient when there are only a few update messages due to the traffic overhead. The node with the latest message sends the message to a random subset of other nodes in the push model [8].Pull ModelEvery node will actively poll a random subset of nodes for any update messages in the pull model. This approach is efficient when there are many update messages because it is highly likely to find a node with the latest update message [8].Push-Pull ModelThe push-pull model is optimal to disseminate update messages quickly and reliably [2]. The node can push a new update message and the node can also poll for new update messages. The push approach is efficient during the initial phase when there are only a very few nodes with update messages. The pull approach is efficient during the final phase when there are numerous nodes with many update messages [8].Gossip Protocol PerformanceThe number of nodes that will receive the message from a particular node is known as the fanout. The count of gossip rounds required to spread a message across the entire cluster is known as the cycle [8], [5].cycles necessary to spread a message across the cluster = O(log n) to the base of fanout, where n = total number of nodesFor instance, it takes approximately 15 gossip rounds to propagate a message across 25,000 nodes. The gossip interval can be set to a value as low as 10 ms to propagate a message across a big data center in roughly 3 seconds. The propagation of a message in the gossip protocol should automatically age out to reduce the unnecessary load [4]. The performance of a gossip protocol implementation can be measured with the following metrics [8]:residue: number of remaining nodes that haven’t received the messages should be minimumtraffic: average number of messages sent between nodes should be minimumconvergence: every node should receive the message as quickly as possibletime average: average time taken to send the message to every node should be lowtime last: the time taken for the last node to receive the message should be lowA case study showed that a system with 128 nodes consumed less than 2 percent of CPU and less than 60 KBps of bandwidth to run gossip protocol [11].Gossip Protocol PropertiesThere is no formal way to define gossip protocol. In general, the gossip protocol is expected to satisfy the following properties [8]:node selection must be random to perform a fanoutonly local information is available to every node and the nodes are oblivious to the state of the clustercommunication between nodes involves periodic, pairwise, interprocess interactionsbounded size transmission capacity per gossip roundevery node deploys the same gossip protocolunreliable network paths between nodes are assumednode interaction frequency is lownode interactions result in a state exchangeGossip AlgorithmThe high-level overview of the gossip algorithm is the following [6], [1]:every node maintains a list of the subset of nodes and their metadatagossip to a random live peer node’s endpoint periodicallyevery node inspects the received gossip message to merge the highest version number to the local datasetThe heartbeat counter of a node is incremented whenever a particular node participates in the gossip exchange. The node is labeled healthy when the heartbeat counter keeps incrementing. On the other hand, the node is considered to be unhealthy when the heartbeat counter has not changed for an extended period due to a network partition or node failure [1]. The following are the different criteria for peer node selection in the gossip protocol [12]:utilize library offered by programming languages such as java.util.randominteract with the least contacted nodeenforce network-topology-aware interactionGossip Protocol ImplementationThe gossip protocol transports messages over User Datagram Protocol (UDP) or Transmission Control Protocol (TCP) with a configurable but fixed fanout and interval [12]. The peer sampling service is used by the gossip protocol to identify the peer nodes for gossip message exchange. The peer sampling service uses a randomized algorithm for the selection of a peer node. The application programming interface (API) of the peer sampling service should provide the following endpoints [8]:/gossip/init: returns the list of nodes known to a particular node at startup/gossip/get-peer: returns the address (IP address and port number) of an independent peer nodeThe workflow of the peer sampling service execution is as follows [8]:initialize every node with a partial view of the system (a list with the subset of nodes)merge the node’s view with the peer node’s view on the gossip exchangePut another way, every node maintains a small local membership table with a partial view of the system and periodically refreshes the table through gossip messages. The gossip protocol can leverage probabilistic distribution for selecting a peer node to reduce duplicate message transmission to the same node [4].The application state can be transferred as key-value pairs via the gossip protocol. The most recent value must be transferred when multiple changes are performed to the same key by a node. The API provided by the gossip protocol to orchestrate application state exchange is the following [6]:/gossip/on-join/gossip/on-alive/gossip/on-dead/gossip/on-changeThe seed nodes are fully functional nodes that are based on static configuration. Every node in the system must be aware of the seed nodes. The gossip system interacts with the seed nodes to prevent logical divisions [4], [12]. The following is the high-level workflow when a node receives a gossip message with the node metadata of a peer node [12]:compares the incoming gossip message to identify the missing values on the local node’s datasetcompare the incoming gossip message to identify the missing values on the peer node’s datasethigher version value is chosen when the node already contains the values present in the incoming gossip messageappend the missing values in the local node’s datasetreturn the missing values on the peer node’s dataset in the responseupdate the peer node’s dataset with the received responseIt is typical to transfer the entire node metadata through the gossip protocol on a node startup. An in-memory version number can be maintained by each node to send only incremental updates of the node metadata through the gossip protocol.The generation clock is a monotonically increasing number indicating the generation of the server. The generation clock is incremented whenever the node restarts. The version number guarantees the ordering and versioning of the application state. The version number can only be incremented [6]. The generation clock can be used along with the version number to detect node metadata changes correctly on node restarts [12].The gossiper timer is a component of the gossip protocol that will ensure every node eventually contains the crucial metadata about peer nodes, including the nodes that are behind a network partition. Every node includes a heartbeat associated with it. The heartbeat state consists of the generation and version number. The application state consists of key-value pairs representing the node state and a version number [6].A node initiating a gossip exchange sends a gossip digest synchronization message that consists of a list of gossip digests. The gossip digest consists of an endpoint address, a generation number, and a version number. The gossip digest acknowledgmen"
