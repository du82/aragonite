title = "Designing Netflix - High Scalability -"
description = "This is a guest post by Ankit Sirmorya. Ankit is working as a Machine Learning Lead/Sr. Machine Learning Engineer at Amazon and has led several machine-learning initiatives across the Amazon ecosystem. Ankit has been working on applying machine learning to solve ambiguous business problems and improve customer experience. For"
full_description = "Example Designing Netflix High Scalability 13 Dec 2021 — 14 min read This is a guest post by Ankit Sirmorya. Ankit is working as a Machine Learning Lead/Sr. Machine Learning Engineer at Amazon and has led several machine-learning initiatives across the Amazon ecosystem. Ankit has been working on applying machine learning to solve ambiguous business problems and improve customer experience. For instance, he created a platform for experimenting with different hypotheses on Amazon product pages using reinforcement learning techniques. Currently, he is in the Alexa Shopping organization where he is developing machine-learning-based solutions to send personalized reorder hints to customers for improving their experience.Problem StatementDesign a video streaming platform similar to Netflix where content creators can upload their video content and viewers are able to play video on different devices. We should also be able to store user statistics of the videos such as number of views, video watched duration, and so forth.Gathering RequirementsIn ScopeThe application should be able to support the following requirements.Content Creator should be able to upload content at a designated time.The viewers are able to watch the video on different platforms (TV, mobile-app, etc.).Users should be able to search videos based on the video titles.The system should support sub-titles for the videos as well.Out of ScopeThe mechanism to recommend personalized videos to different users.The billing and subscription model for watching the videos.Capacity PlanningWe need to build an application which should be able to support the traffic at the scale of Netflix. We should also be able to handle the surge of traffic which is often seen when sequel to a popular web-series (e.g. House of Cards, Breaking Bad etc.) comes out. Some of the numbers which are relevant to the capacity planning are listed below.Number of active users registered with the application = 100 MillionAverage size of the video content uploaded every minute = 2500 MBTotal combinations of resolution and codec formats which need to be supported = 10Average number of videos users watch daily = 3Netflix comprises of multiple microservices. However, the playback service responsible for responding to user playback queries will get the maximum traffic. So, it requires the maximum number of servers. We can calculate the number of servers required for handling the playback requests by using the equation mentioned below.S𝑒𝑟𝑣𝑒𝑟𝑠 𝑖𝑛 playback 𝑚𝑖𝑐𝑟𝑜𝑠𝑒𝑟𝑣𝑖𝑐𝑒= (#playbacks requested per second∗ Latency)/ #concurrent connections per serverLet’s assume that the latency (time taken to respond to user requests) of the playback service is 20 milliseconds and each server can support a maximum of 10K connections. Additionally, we need to scale the application for a peak traffic scenario where 75% of active users place playback requests. In such a scenario, we will need a total of 150 servers(=75M*20ms/10K).Number of videos watched per second= (#active users * #average videos watched daily)/86400 = 3472(100M * 3/86400)Size of the content stored on a daily basis = #average size of video uploaded every min * #pairwise combination of resolutions and codecs * 24* 60 = 36 TB/day (=2500MB * 10 * 24 * 60)High Level DesignThere will primarily be two kinds users of the system: content creators who upload video content, and viewers who watch the video. The entire system can be divided into the following components. Content Distributor Network (CDN): It’s responsible for storing the content in the locations which are geographically closest to users. This significantly enhances the user experience as it reduces the network and geographical distances that our video bits must travel during playback. It also reduces the overall demand on upstream network capacity by a great extent. FUN FACT: Open Connect is the global customized CDN for Netflix that delivers Netflix TV shows and movies to members world-wide. This essentially is a network of thousands of Open Connect Appliances (OCAs) which store encoded video/image files and is responsible for delivering the playable bits to client devices. OCAs are made up of tuned hardware and software which are deployed on the ISP site and custom tailored to provide optimal customer experience. Control Plane: This component will be responsible for uploading new content which will eventually be distributed across the CDNs. It will also be responsible for things such as file storage, sharding, data storage and interpretation of relevant telemetry about the playback experience. The major microservices in this component are listed below. CDN Health Checker Service: This microservice will be responsible to periodically check health of the CDN service, learn about the overall playback experience, and work towards optimizing it. Content Uploader Service: This microservice will consume the content provided by content generators and distribute it across the CDNs to ensure robustness and optimal playback experience. It will also be responsible for storing the metadata of video content in data-storage. Data Storage: The video metadata (title, description etc.) is persisted in the data-storage. We will also persist the subtitle information in the optimal database. Data Plane: This is the component with which the end users interact while playing a video content. This component gets requests from different media streaming platforms (TV, mobile, tablet etc.) and returns the urls of the CDNs from which the requested files can be served. It will comprise of two major microservices. Playback Service: This micro-service is responsible for determining the specific files which are required for serving a playback request. Steering Service: This service determines the optimal CDN urls from which the requested playback can be fetched from. Fig 0: HLD of Netflix In the image above, we have shown the bird’s eye-view of the overall system which should be able to meet all the in-scope requirements. The details of each of the component interactions are listed below. The content creators upload the video content to the control plane. The video content gets uploaded on the CDN which are placed geographically closer to end users. The CDN reports the status to the control plane such as health metrics, what files they have stored, the optimal BGP routes and so forth. The video metadata and the related CDN information gets persisted in the data storage. A user on the client device places the request to play a particular title (TV show or movie). Playback service determines the files which are required to playback a specific title. The Steering service picks the optimal CDNs from which the required files can be fetched from. It generates the urls of such CDNs and provide it to back to the client device. Client device requests the CDNs to serve the requested files. CDN serves the requested files to the client device which gets rendered to the users. API DesignVideo UploadPath:POST /video-contents/v1/videosBody:{ videoTitle : Title of the video videoDescription : Description of the video tags : Tags associated with the video category : Category of the video, e.g. Movie, TV Show, videoContent: Stream of video content to be uploaded }Search VideoPath:GET /video-contents/v1/search-query/Query Param:{ user-location: location of the user performing search }Stream VideoPath:GET /video-contents/v1/videos/Query Param:{ offset: Time in seconds from the beginning of the video }Data ModelWithin the scope of this problem, we need to persist video metadata and its subtitles in the database. The video metadata can be stored in an aggregate-oriented database and given that the values within the aggregate may be updated frequently, we can use a document-based store like MongoDB to store this information. The data-model for storing the metadata is shown in the table below.We can use a time-series database such as OpenTSDB, which builds on top of Cassandra, to store the sub-titles. We have shown below a snippet of the data-model which can be used to store video sub-titles. In this model(let’s call it Media Document), we have provided an event-based representation where each event occupies a time-interval on the timeline.FUN FACT: In this talk, Rohit Puri from Netflix, talks about the Netflix Media Database(NMDB) which is modeled around the notion of a media timeline with spatial properties. NMDB is desired to be a highly-scalable, multi-tenant, media metadata system which can serve near real-time queries and can serve high read/write throughput. The structure of the media timeline data model is called a “Media Document”.Component DesignControl PlaneThis component will mainly comprise of three modules: Content Uploader, CDN Health Checker, and Title Indexer. Each of these modules will be a micro-service performing a specific task. We have covered details of each of these modules in the section below.Content UploaderThis module is executed when a content creator uploads a content. It is responsible for distributing the content on CDN to provide optimal customer experience.Fig 1: Sequence Diagram of Content Upload OperationThe diagram above depicts the sequence of operations which gets executed when content creators upload the video content (TV Show or movie).The content creator uploads the raw video content which can be TV Show or movie.The Content_Storage_Service segments the raw video file into chunks and persists those segments on the file storage system.The Video_Encoder encodes each of the segments in different codec and resolution.The encoded file segments are stored in the file storage.The Video_Distributor reads the encoded file segments from the distributed file storage system.The Video_Distributor distributes the encoded file segments in CDN.The Video_Distributor persists the CDN url links of the videos in the data_storage.Video EncoderThe encoder works by splitting the video file into smaller video segments. These video segments are encoded in all possible combinations of codecs and resolutions. In our example, we can plan on supporting four codecs(Cinepak, MPEG-2, H.264, VP8) and three different resolutions(240p, 480p, 720p). This implies that each video segment gets encoded in a total of 12 formats(4 codecs * 3 resolutions). These encoded video segments are distributed across the CDN and the CDN url is maintained in the data store. The playback api is responsible for finding the most optimal CDN url based on the input parameters(client’s device, bandwidth, and so forth) of user requests.FUN FACT: Netflix’s media processing platform is used for video encoding(FFmpeg), title image generation, media processing(Archer) and so forth. They have developed a tool called MezzFS which collects metrics on data throughput, download efficiency, resource usage, etc. in Atlas, Netflix’s in-memory time-series database. They use this data for developing optimizations such as replays and adaptive buffering.CDN Health CheckerThis module ingests the health metrics of the CDNs and persists them in the data storage. This data is used by the data plane to get optimal CDN urls when users request playback.Fig 2: Sequence Diagram to check CDN Health MetricsIn the image above, we have shown the sequence of operations which gets executed to get statistics around the CDN health metrics and the BGP routes. The details about each of the steps in the sequence diagram are listed below.The cron job triggers the microservice (CDN_Health_Checker_Service) responsible for checking the health of CDNs.The CDN_Health_Checker_Service is responsible for checking the health of CDNs and collect health metrics and other information.The CDN_Health_Checker_Service persists the CDN info in the data store which is then used in the data-plane to find the optimal CDNs from which files can be served based on their file availability, health, and network proximity to the client.Title IndexerThis module is responsible for creating the indexes of the video titles and updates them in the elastic search to enable faster content discovery for end users.Fig 3: Sequence Diagram to store indexed titles on ElasticSearchThe details of the sequence of operations required for indexing the video titles for searching video content are listed below.The cron-job triggers the Title_Indexer_Service to index the video titles.The Title_Indexer_Service fetches the newly uploaded content from the data-store and applies the business rules to create indexes for the video titles.Title_Indexer_Service updates Elastic_Search with the indexes of the video titles making the titles easily searchable.Data PlaneThis component will be processing the user requests in real-time and will comprise of two major workflows: Playback Workflow and Content Discovery Workflow.Playback WorkflowThis workflow is responsible for orchestrating operations when a user places a playback request. It co-ordinates between different microservices such as Authorization Service (for checking user authorization and licensing), Steering Service (for deciding the best playback experience) and Playback Experience Service (for tracking the events to measure playback experience). Steering Service ensures the best customer experience by finding the most optimal CDN url based on user request such as user’s device, bandwidth and so forth. The orchestration process will be handled by the Playback_Service as shown in the image below.Fig 4: Sequence Diagram of Playback ServiceThe details about each of the steps in the sequence diagram is listed below.The client places a request to playback a video which gets directed to the Playback_Service.The Playback_Service calls the Authorization_Service to authenticate users request.The Playback_Service calls the Steering_Service to pick the CDN url from which the playback can be served.The CDN url is returned to the client(mobile/TV).The client retrieves the content from CDN.The client publishes the events for the playback experience to the Playback_Service.The Playback_Service tracks events to measure the playback experience by calling the Playback_Experience_Service.FUN FACT: As mentioned in this talk by Netflix Engineer Suudhan Rangarajan, gRPC is used as the framework for communication between different micro-services at Netflix. The advantages it provides over REST include: bi-directional streaming, minimum operational coupling and support across languages and platforms.Content Lookup WorkflowThis workflow is triggered when user searches for a video title and comprises of two microservices: Content Discovery Service and Content Similarity Service. The Content Discovery Service gets invoked when user requests for the video title. On the other hand, the Content Similarity Service returns the list of similar video title if the exact video title doesn’t exist in our data-store.Fig 5: Sequence Diagram of Content Lookup WorkflowWe have listed below details of each of the steps involved in the Content Loo"
