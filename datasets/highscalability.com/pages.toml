full_description = "consistent hashing Consistent hashing algorithm NK 22 Feb 2023 — 16 min read You can subscribe to the system design newsletter to excel in system design interviews and software architecture.You can view the original article Consistent hashing explained on systemdesign.one website.How does consistent hashing work?At a high level, consistent hashing performs the following operations:The output of the hash function is placed on a virtual ring structure (known as the hash ring)The hashed IP addresses of the nodes are used to assign a position for the nodes on the hash ringThe key of a data object is hashed using the same hash function to find the position of the key on the hash ringThe hash ring is traversed in the clockwise direction starting from the position of the key until a node is foundThe data object is stored or retrieved from the node that was foundTerminologyThe following terminology might be useful for you:Node: a server that provides functionality to other servicesHash function: a mathematical function used to map data of arbitrary size to fixed-size valuesData partitioning: a technique of distributing data across multiple nodes to improve the performance and scalability of the systemData replication: a technique of storing multiple copies of the same data on different nodes to improve the availability and durability of the systemHotspot: A performance-degraded node in a distributed system due to a large share of data storage and a high volume of retrieval or storage requestsGossip protocol: peer-to-peer communication technique used by nodes to periodically exchange state informationRequirementsFunctional RequirementsDesign an algorithm to horizontally scale the cache serversThe algorithm must minimize the occurrence of hotspots in the networkThe algorithm must be able to handle internet-scale dynamic loadThe algorithm must reuse existing network protocols such as TCP/IPNon-Functional RequirementsScalableHigh availabilityLow latencyReliableIntroductionA website can become extremely popular in a relatively short time frame. The increased load might swamp and degrade the performance of the website. The cache server is used to improve the latency and reduce the load on the system. The cache servers must scale to meet the dynamic demand as a fixed collection of cache servers will not be able to handle the dynamic load. In addition, the occurrence of multiple cache misses might swamp the origin server.Figure 1: Cache replicationThe replication of the cache improves the availability of the system. However, replication of the cache does not solve the dynamic load problem as only a limited data set can be cached [1]. The tradeoffs of the cache replication approach are the following:only a limited data set is cachedconsistency between cache replicas is expensive to maintainThe spread is the number of cache servers holding the same key-value pair (data object). The load is the number of distinct data objects assigned to a cache server. The optimal configuration for the high performance of a cache server is to keep the spread and the load at a minimum [2].Figure 2: Dynamic hashingThe data set must be partitioned (shard) among multiple cache servers (nodes) to horizontally scale. The replication and partitioning of nodes are orthogonal to each other. Multiple data partitions are stored on a single node for improved fault tolerance and increased throughput. The reasons for partitioning are the following [1]:a cache server is memory boundincreased throughputPartitioningThe data set is partitioned among multiple nodes to horizontally scale out. The different techniques for partitioning the cache servers are the following [1]:Random assignmentSingle global cacheKey range partitioningStatic hash partitioningConsistent hashingRandom assignmentFigure 3: Partitioning; Random assignmentThe server distributes the data objects randomly across the cache servers. The random assignment of a large data set results in a relatively uniform distribution of data. However, the client cannot easily identify the node to retrieve the data due to random distribution. In conclusion, the random assignment solution will not scale to handle the dynamic load.Single global cacheFigure 4: Partitioning; Single global cacheThe server stores the whole data set on a single global cache server. The data objects are easily retrieved by the client at the expense of degraded performance and decreased availability of the system. In conclusion, the single global cache solution will not scale to handle the dynamic load.Key range partitioningFigure 5: Key range partitioningThe cache servers are partitioned using the key range of the data set. The client can easily retrieve the data from cache servers. The data set is not necessarily uniformly distributed among the cache servers as there might be more keys in a certain key range. In conclusion, the key range partitioning solution will not scale to handle the dynamic load.Static hash partitioningFigure 6: Static hash partitioningThe identifiers (internet protocol address or domain name) of the nodes are placed on an array of length N. The modulo hash service computes the hash of the data key and executes a modulo N operation to locate the array index (node identifier) to store or retrieve a key. The time complexity to locate a node identifier (ID) in static hash partitioning is constant O(1).Static hash partitioningnode ID = hash(key) mod Nwhere N is the array’s length and the key is the key of the data object.A collision occurs when multiple nodes are assigned to the same position on the array. The techniques to resolve a collision are open addressing and chaining. The occurrence of a collision degrades the time complexity of the cache nodes.Figure 7: Static hash partitioning; Node failureThe static hash partitioning is not horizontally scalable. The removal of a node (due to a server crash) breaks the existing mappings between the keys and nodes. The keys must be rehashed to restore mapping between keys and nodes [3].Figure 8: Static hash partitioning; Node addedNew nodes must be provisioned to handle the increasing load. The addition of a node breaks the existing mappings between the keys and nodes. The following are the drawbacks of static hash partitioning:nodes will not horizontally scale to handle the dynamic loadthe addition or removal of a node breaks the mapping between keys and nodesmassive data movement when the number of nodes changesFigure 9: Static hash partitioning; Data movement due to node failureIn conclusion, the data set must be rehashed or moved between nodes when the number of nodes changes. The majority of the requests in the meantime will result in cache misses. The requests are delegated to the origin server on cache misses. The heavy load on the origin server might swamp and degrade the service [3].Further System Design Learning ResourcesSubscribe to the system design newsletter and never miss a new blog post again. You will also receive the ultimate guide to approaching system design interviews on newsletter sign-up.Consistent hashingFigure 10: Consistent hashingConsistent hashing is a distributed systems technique that operates by assigning the data objects and nodes a position on a virtual ring structure (hash ring). Consistent hashing minimizes the number of keys to be remapped when the total number of nodes changes [4].Figure 11: Hash function mappingThe basic gist behind the consistent hashing algorithm is to hash both node identifiers and data keys using the same hash function. A uniform and independent hashing function such as message-digest 5 (MD5) is used to find the position of the nodes and keys (data objects) on the hash ring. The output range of the hash function must be of reasonable size to prevent collisions.Figure 12: Consistent hash ringThe output space of the hash function is treated as a fixed circular space to form the hash ring. The largest hash value wraps around the smallest hash value. The hash ring is considered to have a finite number of positions [5].Figure 13: Consistent hashing; Positioning the nodes on the hash ringThe following operations are executed to locate the position of a node on the hash ring [4]:Hash the internet protocol (IP) address or domain name of the node using a hash functionThe hash code is base convertedModulo the hash code with the total number of available positions on the hash ringFigure 14: Consistent hashing; Node positionSuppose the hash function produces an output space size of 10 bits (2¹⁰ = 1024), the hash ring formed is a virtual circle with a number range starting from 0 to 1023. The hashed value of the IP address of a node is used to assign a location for the node on the hash ring.Figure 15: Consistent hashing; Storing a data object (key)The key of the data object is hashed using the same hash function to locate the position of the key on the hash ring. The hash ring is traversed in the clockwise direction starting from the position of the key until a node is found. The data object is stored on the node that was found. In simple words, the first node with a position value greater than the position of the key stores the data object [6].Figure 16: Consistent hashing; Retrieving a data object (key)The key of the data object is hashed using the same hash function to locate the position of the key on the hash ring. The hash ring is traversed in the clockwise direction starting from the position of the key until a node is found. The data object is retrieved from the node that was found. In simple words, the first node with a position value greater than the position of the key must hold the data object.Each node is responsible for the region on the ring between the node and its predecessor node on the hash ring. The origin server must be queried on a cache miss. In conclusion, the following operations are performed for consistent hashing [7]:The output of the hash function such as MD5 is placed on the hash ringThe IP address of the nodes is hashed to find the position of the nodes on the hash ringThe key of the data object is hashed using the same hash function to locate the position of the key on the hash ringTraverse the hash ring in the clockwise direction starting from the position of the key until the next node to identify the correct node to store or retrieve the data objectFigure 17: Consistent hashing; Deletion of a nodeThe failure (crash) of a node results in the movement of data objects from the failed node to the immediate neighboring node in the clockwise direction. The remaining nodes on the hash ring are unaffected [5].Figure 18: Consistent hashing; Addition of a nodeWhen a new node is provisioned and added to the hash ring, the keys (data objects) that fall within the range of the new node are moved out from the immediate neighboring node in the clockwise direction.Consistent hashingAverage number of keys stored on a node = k/Nwhere k is the total number of keys (data objects) and N is the number of nodes.The deletion or addition of a node results in the movement of an average number of keys stored on a single node. Consistent hashing aid cloud computing by minimizing the movement of data when the total number of nodes changes due to dynamic load [8].Figure 19: Consistent hashing; Non-uniform positioning of nodesThere is a chance that nodes are not uniformly distributed on the consistent hash ring. The nodes that receive a huge amount of traffic become hotspots resulting in cascading failure of the nodes.Figure 20: Consistent hashing; Virtual nodesThe nodes are assigned to multiple positions on the hash ring by hashing the node IDs through distinct hash functions to ensure uniform distribution of keys among the nodes. The technique of assigning multiple positions to a node is known as a virtual node. The virtual nodes improve the load balancing of the system and prevent hotspots. The number of positions for a node is decided by the heterogeneity of the node. In other words, the nodes with a higher capacity are assigned more positions on the hash ring [5].The data objects can be replicated on adjacent nodes to minimize the data movement when a node crashes or when a node is added to the hash ring. In conclusion, consistent hashing resolves the problem of dynamic load.Consistent hashing implementationFigure 21: Consistent hashing implementation; Binary search tree storing the node positionsThe self-balancing binary search tree (BST) data structure is used to store the positions of the nodes on the hash ring. The BST offers logarithmic O(log n) time complexity for search, insert, and delete operations. The keys of the BST contain the positions of the nodes on the hash ring.The BST data structure is stored on a centralized highly available service. As an alternative, the BST data structure is stored on each node, and the state information between the nodes is synchronized through the gossip protocol [7].Figure 22: Consistent hashing implementation; Insertion of a data object (key)In the diagram, suppose the hash of an arbitrary key ‘xyz’ yields the hash code output 5. The successor BST node is 6 and the data object with the key ‘xyz’ is stored on the node that is at position 6. In general, the following operations are executed to insert a key (data object):Hash the key of the data objectSearch the BST in logarithmic time to find the BST node immediately greater than the hashed outputStore the data object in the successor nodeFigure 23: Consistent hashing implementation; Insertion of a nodeThe insertion of a new node results in the movement of data objects that fall within the range of the new node from the successor node. Each node might store an internal or an external BST to track the keys allocated in the node. The following operations are executed to insert a node on the hash ring:Insert the hash of the node ID in BST in logarithmic timeIdentify the keys that fall within the subrange of the new node from the successor node on BSTMove the keys to the new nodeFigure 24: Consistent hashing implementation; Deletion of a nodeThe deletion of a node results in the movement of data objects that fall within the range of the decommissioned node to the successor node. An additional external BST can be used to track the keys allocated in the node. The following operations are executed to delete a node on the hash ring:Delete the hash of the decommissioned node ID in BST in logarithmic timeIdentify the keys that fall within the range of the decommissioned nodeMove the keys to the successor nodeWhat is the asymptotic complexity of consistent hashing?The asymptotic complexity of consistent hashing operations are the following: OperationTime ComplexityDescription Add a node O(k/n + logn) O(k/n) for redistribution of keys O(logn) for binary search tree traversal Remove a node O(k/n + logn) O(k/n) for redistribution of keys O(logn) for binary search tree traversal Add a key O(logn) O(logn) for binary search tree traversal Remove "
