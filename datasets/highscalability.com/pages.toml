title = "Designing WhatsApp - High Scalability -"
description = "This is a guest post by Ankit Sirmorya. Ankit is working as a Machine Learning Lead/Sr. Machine Learning Engineer at Amazon and has led several machine-learning initiatives across the Amazon ecosystem. Ankit has been working on applying machine learning to solve ambiguous business problems and improve customer experience. For"
full_description = "Example Designing WhatsApp High Scalability 03 Jan 2022 — 11 min read This is a guest post by Ankit Sirmorya. Ankit is working as a Machine Learning Lead/Sr. Machine Learning Engineer at Amazon and has led several machine-learning initiatives across the Amazon ecosystem. Ankit has been working on applying machine learning to solve ambiguous business problems and improve customer experience. For instance, he created a platform for experimenting with different hypotheses on Amazon product pages using reinforcement learning techniques. Currently, he is in the Alexa Shopping organization where he is developing machine-learning-based solutions to send personalized reorder hints to customers for improving their experience.Problem StatementDesign an instant messenger platform such as WhatsApp or Signal which users can utilize tosend messages to each other. An essential aspect of the application is that the chat messageswon’t be permanently stored in the application.FUN FACT: Some of the chat messengers such as FB Messenger stores the chat messages unless the users explicitly delete it. However, instant messengers such as WhatsApp don’t save the messages permanently on their server.Gathering RequirementsThe instant messenger application should meet the following requirements.It should be able to support one-on-one conversations between users.It should be able to show Sent/Delivered/Read confirmation to other users.It should be able to provide information about the last time a user was active.It should allow users to share images.It should be able to send push notifications to other users.Capacity PlanningWe need to build a highly scalable platform which can support traffic at the scale of WhatsApp.Additionally, while doing capacity planning, we need to ensure that we think through the worst-case scenarios of peak traffic. Some of the numbers which we can use for capacity estimations ofan application (like WhatsApp) are listed below.Number of users on the application every month: 1 BillionNumber of active users per second at peak traffic: 650, 000Number of messages per second at peak traffic: 40 MillionThe entire application will comprise of several microservices each performing a specific task.The number of servers required in the data plane handling the traffic of chat messages can beestimated using the following equation.#𝑠𝑒𝑟𝑣𝑒𝑟𝑠 𝑖𝑛 𝑐ℎ𝑎𝑡 𝑚𝑖𝑐𝑟𝑜𝑠𝑒𝑟𝑣𝑖𝑐𝑒= (#chat messages per second∗ Latency)/ #concurrent connections per serverLet’s assume that the number of concurrent connections per server is 100K, and the latency of sending a message is 20 milliseconds. In such a scenario, the estimated number of servers required in the chat servers’ fleet (using the equation mentioned above) will be 8 (i.e., 40 Million*20 ms/100K). In standard practice, it’s recommended to add a few more servers to account for handling failures of these servers. In a subsequent section, we will see the impact which these chat servers will have on the overall infrastructure costFUN FACT: In this talk, Rick Reed(software engineer @ WhatsApp) talks about optimizing their Erlang-based server applications and tuning the FreeBSD kernel to support millions of concurrent connections per server. This helped them to a great extent in keeping their server footprint as small as possibleHigh Level DesignThe required features of this instant messenger application can be modeled using two micro- services: Chat service and Transient service. The Chat Service will be the one serving the traffic of online chat messages sent by active users. The service will check if the user to whom the message is sent is online or not. If the user is online, then the message will be forwarded to that user instantly. Otherwise, the message will be handled by the Transient Service. This service will be responsible for maintaining all the messages (text or image) sent to offline users. The data will be stored in the Transient Storage temporarily until the offline user comes back online. We will provide more details about the individual components in one of the later sections.FUN FACT: WhatsApp actually uses a much similar approach as discussed by the sameWhatsApp engineer(Rick Reed) in a different talk.API DesignWe can expose a REST endpoint to interact with the Chat Service. The definition of the APIendpoint to send messages is mentioned below.sendMessage(String fromUser, String toUser, ClientMetaData clientMetaData, String message)Request:fromUser:The userId who is sending the requesttoUser:The userId to whom the request is being sentclientMetaData: The metadata to store client’s information such as device details, locations etc.message: The message being sent as part of the communication.Data ModelTable 1: Data Model – User InfoComponent DesignIn this section, we will talk about two different scenarios for sending messages in a one-to-one communication. After that, we will discuss the other features which we need to support, such as push notifications and user activity status. In the end, we will look into the different mechanisms for doing optimizations and handling failure scenarios.One-to-One CommunicationHere, we will talk about the two different scenarios associated with sending messages to another user. The first scenario involves sending a text message to an online user. In the second scenario, we have described the sequence of operations involved in sending an image to an offline user.The details about each of the steps in the sequence diagram for sending a text message to an online user is mentioned below.Step 1: Alice sends a message to Bob which gets directed to the chat server with which Alice is connected.Step 2: Alice gets an acknowledgement from the chat server it’s connected(i.e. Chat_Server_A) and the message is marked as SENT at Alice’s end.Step 3: Chat_Server_A makes a request to the data-storage to fetch information about the chat server to which Bob is connected.Step 4: Chat_Storage returns the information that Bob is connected to Chat_Server_B.Step 5: Chat_Server_A forwards the message to Chat_Server_B.Step 6: The message gets delivered to Bob using a push mechanism.Step 7: Bob sends ACK back to Chat_Server_B.Step 8: The ACK is forwarded to Chat_Server_A to which Alice is connected.Step 9: The ACK gets delivered to Alice and is marked as DELIVERED.Step 10: Another ACK is sent to Chat_Server_B when Bob reads the message (let’s say after 15 minutes).Step 11: Chat_Server_B requests to fetch the server to which Alice is connected.Step 12: Chat_Storage returns the information that Alice is connected to Chat_Server_A.Step 13: Chat_Server_B forwards the read ACK to Chat_Server_A.Step 14: The ACK is forwarded to Alice marking the request as READ.The details about each of the steps in the sequence diagram for sending an image to an offline user is mentioned below.Step 1: Alice sends an image to Bob which gets forwarded to Chat_Server_A, the server with which Alice is connected.Step 2: Chat_Server_A uploads the image to a File Server where the file stored in a directory structureStep 3: File Server returns the image url of the uploaded file to Chat_Server_A.Step 4: The image url is returned to Alice which is used to render the image on Alice’s device. The image is marked as SENT on Alice’s end.Step 5: Chat_Server_A makes request for the server to which Bob is connected.Step 6: Chat_Storage returns information that Bob is offline.Step 7: Chat_Server_A forwards the message containing the image-url to the transient serverStep 8: The transient sever stores the message containing the image-url in transient storage.Step 9: Bob comes online and performs heart-beat with Chat_Server_B.Step 10: Chat_Server_B fetches transient messages for Bob from the transient server.Step 11: Chat_Server_B forwards the transient messages to Bob.Step 12: Bob fetches the image from the file server. At this point, the image gets delivered to Bob’s device and all the references to the transient messages are removed from the system.Step 13: Bob’s device sends ACK for Alice’s image to Chat_Server_BStep 14: Fetches information about the server to which Alice is connected; i.e. Chat_Server_AStep 15: Forwards the ACK to Chat_Server_AStep 16: The ACK gets delivered to Alice marking the message as DELIVERED.Transient Data StorageWe can implement a queue-based mechanism to store and retrieve the transient messages using a FIFO based policy. We can use existing cloud-based technologies for this purpose, such as Amazon SQS or Windows Azure Queue Service. We can use these queues to store transient messages sent to offline users. All the references to these transient messages are removed from the system once the messages are delivered to the offline user.Push NotificationsThe are two approaches to deliver messages to users by using push technology : client pull or server push. If we go down the route of client pull, we can either decide between long vs. short polling. On the other hand, there are two ways to implement the server push approach: WebSocket and Server-Sent Events(SSE). Websockets has been the de-facto communication protocol for chat applications. We have provided more details about it in the section below.Using the polling technique, the client asks the server for new data regularly. The trade-off decision to choose the polling technique can be taken using the data-points mentioned below. Short Polling (e.g., AJAX-based timer) Pros: more straightforward and not very server consuming if the time between requests is long Cons: not ideal for scenarios when we need to be notified of server events with minimal delay Long Polling (e.g., Comet based on XHR) Pros: notifications of server events happen with no delay Cons: more complex and consume more server resources The approach to push server messages to clients is mainly of two types. The first one is WebSocket which is a communication protocol. It provides duplex communication channels over a single TCP connection. It’s ideal for scenarios such as chat applications due to its two-directional communication. The other one is called Server-sent events (SSE) which allows a server to send “new data” to the client asynchronously once the initial client-server connection has been established. SSEs are more suitable in a publisher-subscriber model such as real-time streaming stock prices; twitter feeds updates and browser notifications.User Activity StatusThe last time when a user was active is a standard functionality which can be found on instant messengers. We have shown the data-model to store the related information in Table 1 above.OptimizationsWe can use the parameters listed below to suggest optimizations in the system.Latency: We can use distributed cache such as Redis to cache the information of user activity status and their recent chats in-memory. This may help in reducing the overall latency of the application and provides a better customer experience. Even some of the database solutions do provide in-memory caching solutions such as Amazon DynamoDB Accelerator.Infrastructure Cost: It's apparent from the system that significant contribution to the infrastructure cost will be from chat servers. The cost incurred from the chat servers can mount quickly if its server foot-print isn't kept in check. One way of doing that is to increase the number of connections per host. It will significantly reduce the number of servers required for maintaining the service. We can accomplish this task by tuning the server configurations and choosing suitable technologies. For instance, engineers at WhatsApp were able to achieve millions of connections per host by optimizing their Erlang-based server applications and tuning the FreeBSD kernelAvailability: We can maintain multiple copies of the transient messages so that even if the messages in one of the copies is lost then it can still be retrieved from the other copy. This would imply maintaining replicas of those transient messages. The client would be responsible for fetching the messages from two queues and will merge them. We will discuss more in the next section.Addressing Bottlenecks:The major bottlenecks in the system which are more vulnerable to failures are the chat servers and the transient storage solutions. We have recommended some approaches to handle such failures in the section below.Chat Server Failure: The chat servers in the system will be holding connections with the users. There are two ways of handling the failure of chat servers. One approach can be to transfer those TCP connections to another server; however, implementation of such fail-overs isn’t trivial. The second, which is comparatively more straightforward is to have the user clients initiate the connection automatically in case of connection loss. The information of the server to which the user is connected needs to be updated in the database is agnostic of the approach we take. For instance, in Fig 5, we have shown an illustration of the handling this failure scenario. We can see that User1 is connected to Server1, and when this server goes down, then the connection is re-established with another server (i.e. Server2), and this information is updated in the database.Transient Storage Failure: The transient storage is another component which is prone to failures and can cause loss of messages in-transit to offline users. We can make replicas of the transient storage of each user to prevent the loss of messages which were sent to them when they were offline. When a user comes back online then both the original and the replica instances of the user’s transient storage are queried and merged. In Fig 6, we have illustrated a mechanism to handle transient storage failure which gets initiated when user comes back online.MonitoringWe want to ensure that our service can meet the user demands with high availability and low latency. We can define service level agreements (SLAs) for these metrics and create moderate and severe monitors which can trigger an alarm when these SLAs are violated. For this application, we can define the following SLAs for the sendMessage API.Availability SLA: p99.999Latency SLA: p99.99 of 5 millisecondsThe availability SLA implies that that the monitor will trigger an alarm if more than 1 out of 1000 requests fail. Likewise, the latency SLA means that an alert will be triggered if the server takes >5ms to respond for more than 1 out of 100 requests it receives.Additionally, we can put failure alarms in different error scenarios. One such scenario can occur when the chat server isn’t able to fetch transient messages for a user from all the replicas of transient storage. This maps to Step#10 illustrated in Fig 3 above where Chat_Server_B requests the transient server to fetch the messages sent to Bob when Bob was offline. Let’s assume that we maintain two copies of Bob’s messages in transient storage for making the system more robust. However, transient server isn’t able to retrieve messages from both the copies due to an in"
