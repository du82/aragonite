title = "Bu News | Hightek.org"
description = "03/10/2005 Version 3.4 beta is released. Brief list of changes:  o More platform independent. Now runs on Linux, NetBSD, OpenBSD,  FreeBSD, and even MacOS X 10.2. o Improved configuration flexability. o Configuration and log files are now installed in locations more  standard to both BSD and Linux. o Improved installation and de-installation scripts. o Ability to install and work out of the box for regular users,  as well as root. o Miscellaneous bug fixes and code cleanup. o Copyright is changed from GPL back to the more relaxed BSD. I have not done any further work on the CDRW dump features yet. Again, the last known platform they worked on was FreeBSD-4.x. So, for now, expect to use bu only for the NFS backup features for any other platform."
full_description = "03/10/2005 Version 3.4 beta is released. Brief list of changes: o More platform independent. Now runs on Linux, NetBSD, OpenBSD, FreeBSD, and even MacOS X 10.2. o Improved configuration flexability. o Configuration and log files are now installed in locations more standard to both BSD and Linux. o Improved installation and de-installation scripts. o Ability to install and work out of the box for regular users, as well as root. o Miscellaneous bug fixes and code cleanup. o Copyright is changed from GPL back to the more relaxed BSD. I have not done any further work on the CDRW dump features yet. Again, the last known platform they worked on was FreeBSD-4.x. So, for now, expect to use bu only for the NFS backup features for any other platform. 12/24/2004 Imported into public CVS on SourceForge.net. www: http://b-u.cvs.sourceforge.net/viewvc/b-u cvs: CVSROOT=:pserver:anonymous@b-u.cvs.sourceforge.net:/cvsroot/b-u Check out command: If $CVSROOT is set in the environment: (i.e. export CVSROOT) $ cvs co bu Otherwise: $ cvs -d:pserver:anonymous@b-u.cvs.sourceforge.net:/cvsroot/b-u co bu 7/20/2002 Version 3.3 beta is released Various bug fixes. 6/13/2002 Version 3.2.2 beta is released This release fixes several minor bugs in the installation and de-installation scripts. 6/04/2002 Version 3.2.1 beta is released This fixes a bug that prevented it from running with Perl versions less than 5.6.0. 6/02/2002 Version 3.2 beta is released Substantial improvements to the NFS backup features. 5/16/2002 Version 3.0 beta is released. The new 3.x beta releases of bu now have compressed multi-volume CDRW dump capability with full, differential, and incremental dump modes. Version 2.8 is currently the production release and is tested to work well on both Linux and FreeBSD. The CDRW features in the 3.x beta release only work on FreeBSD with IDE CD writers until I get the Linux specific portion of the code finished. Everything else should work on both platforms. Starting with version 3.x I have moved bu to the GNU copyright. Version 2.8 remains under the BSD copyright. 4/26/2002 I have set up a simple mailing list for bu announcements, bug reports, questions, and discussion. It is very low volume right now. To subscribe, send an email to to bu-users@hightek.org with ``subscribe'' in the subject. <!--//--><![CDATA[//><!-- if(window.da2a)da2a.script_load(); //--><!]]>"
