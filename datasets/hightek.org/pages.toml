full_description = "Drupal 8 - Wrapping text around images Submitted by vince on Fri, 03/23/2018 - 21:01 As of Drupal 8.4.5, since ckeditor has been crippled, these are the most simple methods I could come up with to style inline images in my content, such as wrapping text and/or adding borders and margins around them. These methods are not ideal but workable and not too painful. <!--//--><![CDATA[//><!-- if(window.da2a)da2a.script_load(); //--><!]]> Read more about Drupal 8 - Wrapping text around imagesLog in to post comments Drupal 8 paragraphs module Submitted by vince on Thu, 03/22/2018 - 21:26 The Paragraphs module for the Drupal 8 CMS is still utilizing text fields with the same ckeditor limitations I discussed here. However, it does have some nice features over just using the default single text entry box for the body of your content. Most notably, in conjunction with the Classy paragraphs module, the ability to define an arbitrary number of classes that you can select from to style your paragraphs and images. Read more about Drupal 8 paragraphs moduleLog in to post comments Drupal 8 WYSIWYG Editor Crippled Submitted by vince on Thu, 03/08/2018 - 12:46 I was excited that Drupal 8 included the ckeditor WYSIWYG editor out of the box until I discovered they crippled it. I spent a couple days wrestling with it and doing research on how to overcome the limitations to no avail. I love just about everything else I have learned about Drupal 8 so far. They have done a wonderful job on the interface and all the new back end features. Read more about Drupal 8 WYSIWYG Editor Crippled2 commentsLog in to post comments"
