to post comments Drupal vs Wordpress - My experiences and impressions Submitted by vince on Thu, 02/22/2018 - 16:34 I should have posted this earlier but never got around to it. It's not based on the latest version of Wordpress because these notes are from a few years ago when I was evaluating different CMS's to choose what to use for our web sites. I spent months researching, evaluating and testing a bunch of different CMS platforms for our web sites and it came down to Drupal and Wordpress as my top two runner ups. Read more about Drupal vs Wordpress - My experiences and impressionsLog in to post comments"
