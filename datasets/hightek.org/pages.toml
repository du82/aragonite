full_description = "Bu News 03/10/2005 Version 3.4 beta is released. Brief list of changes: o More platform independent. Now runs on Linux, NetBSD, OpenBSD, FreeBSD, and even MacOS X 10.2. o Improved configuration flexability. o Configuration and log files are now installed in locations more standard to both BSD and Linux. o Improved installation and de-installation scripts. o Ability to install and work out of the box for regular users, as well as root. o Miscellaneous bug fixes and code cleanup. o Copyright is changed from GPL back to the more relaxed BSD. I have not done any further work on the CDRW dump features yet. Again, the last known platform they worked on was FreeBSD-4.x. So, for now, expect to use bu only for the NFS backup features for any other platform. <!--//--><![CDATA[//><!-- if(window.da2a)da2a.script_load(); //--><!]]> Read more about Bu News"
