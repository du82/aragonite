["https://hilarymason.com/about"]
title = "About – Hi. I'm Hilary Mason."
description = "This is just a short excerpt for the about page."
full_description = "Hi, I’m Hilary. Simply: I make beautiful things with data. I’m the Founder of Fast Forward Labs, a machine intelligence research company, and the Data Scientist in Residence at Accel. Previously, I was the Chief Scientist at bitly. I also co-founded of HackNY, co-host DataGotham, and am a member of NYCResistor. More: I believe technology should give us superpowers. At Fast Forward Labs, we are building those superpowers. I’m a Data Scientist in Residence at Accel, where I get the chance to advise companies large and small on their data strategy. I spent four years as Chief Scientist at bitly, where I led an amazing team that studied attention on the internet in realtime, doing a mix of research, exploration, and engineering. I co-founded HackNY, a non-profit that helps talented engineering students find their way into the startup community of creative technologists in New York City. I’m an enthusiastic member of the larger conspiracy to evolve the emerging discipline of data science. I’m a native New Yorker and I love this city and the technology community here. I am an advisor to a few organizations that I adore, including Mortar, knod.es, collective[i], and DataKind. I’m a mentor to Betaspring, the Providence, Rhode Island-based startup accelerator, and the Harvard Business School Digital Initiative. I was a member of Mayor Bloomberg’s Technology and Innovation Advisory Council, which was a fascinating way to learn how government and industry can work together. I’ve received a few honors, like the TechFellows Engineering Leadership award, and was on the Forbes 40 under 40 Ones to Watch list and Crain’s New York 40 under Forty list. I’ve also been in Glamour, the WSJ, Fast Company, Scientific American, and more, which has made my mother very happy. I like to give talks, and have spoken about how to replace yourself with a very small shell script, on e-mail hacking, machine learning: a love story, and more. I also keep a fun mostly photo-oriented blog of mostly New York adventures at hilary.nyc. Like Loading..."
