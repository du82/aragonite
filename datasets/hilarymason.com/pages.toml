title = "Note to self: Managing SSH Keys in OS X – Hi. I'm Hilary Mason."
description = '''I recently acquired a new 13" Macbook Pro. My last machine was from 2012, so I've been having fun catching up on how you actually set up a functional developer environment today (it's basically the same as in 2012). I had to look up how to get OS X Sierra (10.12) to remember my SSH…'''
full_description = "Notes to SelfNote to self: Managing SSH Keys in OS X I recently acquired a new 13″ Macbook Pro. My last machine was from 2012, so I’ve been having fun catching up on how you actually set up a functional developer environment today (it’s basically the same as in 2012). I had to look up how to get OS X Sierra (10.12) to remember my SSH keys. This behavior has changed to mimic standard OpenSSH behavior, which is a good thing! First, add the key to your OS X keychain: ssh-add -k [key_file] Then, when you start a shell, run this: ssh-add -A I added it to my .bash_profile and it’s working quite nicely. Share this:TwitterFacebookLike Loading... Related January 26, 2017notetoself, osx, ssh, tech Published by hmason View all posts by hmason"
