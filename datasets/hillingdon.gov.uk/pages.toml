["https://www.hillingdon.gov.uk/hillingdonfirst"]
title = "About the HillingdonFirst card scheme - Hillingdon Council"
description = "Information on our HillingdonFirst card for residents - who can apply and requesting your HFC number, or a new or replacement card."
full_description = '''HillingdonFirst card Information for residents and businesses about our HillingdonFirst card. In this section: Information for residents Where can the HFC be used? Information for businesses About the HillingdonFirst card scheme Our HillingdonFirst card offers residents discounts, offers and preferential rates on various products, services and facilities across the borough. In this sectionWho can apply?Apply for a HillingdonFirst cardRegister your HillingdonFirst cardIf your details have changedNeed a replacement HillingdonFirst card? <img alt="HillingdonFirst card" src="/image/2321/HillingdonFirst-card/gi-responsive__fallback.jpg?m=1592490083313" class="gi-responsiveimage__fallback" width="380" height="254" loading="lazy" /> gi.responsiveImage.initialiseResponsiveImage('c_740205159858781'); Who can apply?Anyone aged 18 and over who lives in the borough of Hillingdon can apply for a HillingdonFirst card.​​Hillingdon residents aged 17 who drive can also apply for a HillingdonFirst card.Membership of the scheme is free. HillingdonFirst card terms and conditions (PDF, 235 KB)Apply for a HillingdonFirst cardTo apply for a HillingdonFirst card:log in to (or register for) My Account via the button belowselect the 'Apply for a card' button under the HillingdonFirst card heading(this option will only appear if you have added your home address to your account)complete the online form.Apply for a HillingdonFirst cardRegister your HillingdonFirst cardOnce you have received your HillingdonFirst card, register it so if it gets lost, damaged, stolen or becomes faulty, you can request a replacement card online.To register your HillingdonFirst card:log in to (or register for) My Account via the button belowselect the 'Add an existing card' button under the HillingdonFirst card headingcomplete the online form.Register your HillingdonFirst cardPlease note: Only 1 HillingdonFirst card can be registered to an individual's My Account.If your details have changedIf you have moved house or changed your name, please let us know.Update your detailsPlease note: When a resident passes away and their death is registered, we will cancel their HillingdonFirst card automatically.Need a replacement HillingdonFirst card?If your card has been lost, damaged, stolen or is faulty, providing it is registered, you can request a replacement card online.To request a replacement HillingdonFirst card:log in to (or register for) My Account via the button belowselect the 'Replace a card' button under the HillingdonFirst card headingcomplete the online form.Request a replacement HillingdonFirst card Print this page Share this page Next Page Where can the HFC be used? Page last updated: 03 Apr 2024 Was this page helpful? Yes No Report an issue with this page'''
