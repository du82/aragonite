["https://hillingdon.gov.uk/article/1014/Pay-or-challenge-my-parking-ticket"]
title = "Hillingdon 3Sixty Citizen Apcoa Payment Portal"
full_description = "You can use this site to pay for a Penalty Charge Notice (PCN) , to find out more information about the contravention, or to appeal. Please enter your vehicle registration and PCN number (HN followed by 8 characters) to pay the PCN, view the contravention details, photographic evidence or submit a challenge/representation. If you wish to submit a challenge/representation, do not pay the PCN at this stage or the PCN will be closed and you will not be able to submit a challenge/representation. Please note that your PCN information may not be available online from the next working day after the date of issue of the PCN. Please note – this portal is for payment of a penalty charge issued by the London Borough of Hillingdon for a civil traffic or parking contravention or for submitting a challenge/representation against a penalty charge. Information you provide in connection with your payment or challenge / representation will used to deal with that payment or challenge/representation. In the case of an appeal being submitted to the Environment and Traffic Adjudicators (ETA), your information will be shared it may also be shared with third parties such as the APCOA for enforcement and processing. If you would like more information about how we use your data, please read our Privacy Policy - www.hillingdon.gov.uk/privacy which also contains guidance on submitting data protection requests and questions."
