description = "Pay for a range of council fees and charges online."
full_description = "Make a payment Pay for a range of council fees and charges online. Adult social care charges and corporate debtorsThe invoice format for adult social care charges and corporate debtors has changed following a finance system migration, but our bank details remain the same and we ask that invoice payments are made as soon as possible. If an email has been provided, invoices will be emailed to you - please check your inbox and spam folder.Customer statements are also being issued from the new system. Please ensure payments are being made upon receipt of invoices and statements.Digital debt collectionThe council are utilising digital debt collection methods to ensure customers are paying their invoices promptly. You may receive SMS text messages, emails or automated phonecalls if you have an invoice from the council which is overdue for payment. Contact may be outside of standard working hours. Please act on any communications promptly to avoid further debt recovery action.What would you like to pay?Select the relevant box below for information and how to pay it.Please note: We do not retain your card details once the transaction is completed. Adult social care charges Business rates Corporate debtors Council rent Council tax Fixed penalty notice Housing benefits overpayment Leasehold charges Musical instrument hire Parking ticket / penalty charge notice Planning application fee School non-attendance penalty notice"
