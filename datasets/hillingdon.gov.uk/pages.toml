["https://hillingdon.gov.uk/HFbusiness"]
title = "HillingdonFirst card - information for businesses - Hillingdon Council"
description = "Join hundreds of other local businesses already signed up to our HillingdonFirst card discount scheme."
full_description = '''HillingdonFirst card Information for residents and businesses about our HillingdonFirst card. In this section: Information for residents Where can the HFC be used? Information for businesses HillingdonFirst card - information for businesses Join hundreds of other local businesses already signed up to our HillingdonFirst card discount scheme. <img alt="HillingdonFirst card" src="/image/2321/HillingdonFirst-card/gi-responsive__fallback.jpg?m=1592490083313" class="gi-responsiveimage__fallback" width="380" height="254" loading="lazy" /> gi.responsiveImage.initialiseResponsiveImage('c_739207428078186'); What is the HillingdonFirst card scheme?The HillingdonFirst card scheme offers Hillingdon residents discounts, offers and preferential rates on various products, services and facilities across the borough.The scheme supports local businesses by encouraging customer loyalty and is absolutely free for businesses to join.All offers and discounts will be listed on our Hillingdon Business Directory.How do I sign up?Sign up as a HillingdonFirst card business and offer residents discounts, offers and preferential rates on your products, services and facilities.If your business is already listed on the Hillingdon Business DirectoryLog in using the 'Manage my business' button on the Business Directory homepage.Check your listing details (including your opening hours, telephone number and email address) and update if needed.Under the field 'My business', select 'Would like to sign up as an HFC business' and add your HFC offer, eg 10% discount on a £40 spend.Once your request has been submitted, your details will be checked by our team and added/updated to the website. If your business isn't already listed on the Hillingdon Business DirectorySubmit a request to add your business using the 'List your business' button on the Business Directory homepage.provide all your business' information (including a brief description, address, your opening hours, telephone number and email address).Under the field 'My business', select 'Would like to sign up as an HFC business' and add your HFC offer, eg 10% discount on a £40 spend.Once your request has been submitted, your details will be checked by council officers and added to the website. If you no longer want your business to participate in the HillingdonFirst scheme, email web@hillingdon.gov.uk. Print this page Share this page Previous Page Where can the HFC be used? Page last updated: 22 May 2023 Was this page helpful? Yes No Report an issue with this page'''
year_published = 2023
year_updated = 2024
