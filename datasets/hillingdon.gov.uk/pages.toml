["https://hillingdon.gov.uk/pay-my-rent"]
title = "Paying my council rent - Hillingdon Council"
description = "Your rent is payable weekly and you can choose how to pay in a way that best suits you."
full_description = "Paying my council rent Your rent is payable weekly and you can choose how to pay in a way that best suits you. You can view your rent statement and pay your rent online. Pay onlineYou can pay your council rent online at any time - all you need is:your payment reference numberyour debit or credit card.Pay my council rent onlinePlease note:It can take 3 to 5 days for your account to reflect recent payments.If you are having trouble paying your rent, email housingcharges@hillingdon.gov.uk.If you have any concerns about your rent account, call 01895 556182.Other ways to pay your council rentPaying by direct debitDirect debit is the most convenient method of paying bills. It is quick and easy, and avoids queues.We will tell you the amounts and dates of the payments in advance. And you have the choice of either weekly or monthly payments.To set up a direct debit, please ensure you complete all sections of the direct debit mandate form.Payment cardsYou can use a payment card to pay by cash, card or cheque at a PayPoint.Simply hand your payment card and payment to the operator. You should always keep your receipt as proof of payment.You can request a new payment card by calling 01895 556699.TelephoneYou can pay using a debit card with our automated 24-hour service on 0330 041 6497. You will need your Hillingdon Housing Service payment card with you.If you wish to pay using your debit or credit card (we do not accept Amex), phone our payment line during office hours on 01895 556699 and select option 2. You will need your payment reference number.If you would like more information about any of these ways to pay or need a new or replacement payment card,call 01895 277252 or email housingcharges@hillingdon.gov.uk.TextYou can pay by text from your mobile phone.To register your phone, visit www.allpayments.net/textpay or call 01895 556182.Pay an alternative amountIf you cannot pay your full balance, you can pay an alternative amount on our payments site.Home or telephone banking arrangementIf you have a home or telephone banking arrangement, please quote the following:sort code: 60-22-10 (National Westminster bank)account number: 72430184your payment reference number (as shown on the bottom left of your payment card). Overpaid council rentTo claim overpaid rent from your rent account, please complete our online form.Request a refund on your council rentCouncil rent refund policyThe rent account will be left in 1 week's credit to avoid the account going into any period of arrears.If you are in receipt of Housing Benefit or Universal Credit, the refund will only be processed if it is clear you have made payments that have subsequently been covered by a backdated benefit payment.Refunds will not be made if there are potential or outstanding benefit overpayments waiting or likely to be processed.Unless we agree otherwise, payments will only be made to the bank account of the tenant.Please note: Any refunds due under the Direct Debit Guarantee are not affected by the above conditions. Print this page Share this page Page last updated: 27 Feb 2025 Was this page helpful? Yes No Report an issue with this page"
year_published = 2025
year_updated = 2025
clearnet = "https://hillingdon.gov.uk/pay-my-rent"
