["https://hillingdon.gov.uk/news"]
title = "News - Hillingdon Council"
description = "Read the latest news in Hillingdon."
full_description = '''News <img alt="Sign up for council e-newsletters banner" src="/image/7585/Sign-up-for-council-e-newsletters/gi-responsive__fallback.jpg?m=1657010441570" class="gi-responsiveimage__fallback" width="380" height="50" loading="lazy" /> gi.responsiveImage.initialiseResponsiveImage('c_739142415555084'); Hillingdon People magazine 06 Jan 2025 The magazine for Hillingdon residents, which provides community news from the council, is delivered to homes across the borough every 2 months. See more Council seeks views on garden waste collection service 03 Mar 2025 Hillingdon residents are being invited to share their feedback on the council's proposals to make its garden waste collection service more sustainable. See more Council continues to fight government underfunding to deliver value for money services 28 Feb 2025 Hillingdon Council approved its budget for 2025/26 last night (Thursday 27 February), continuing its commitment to putting residents first by further investing in services and keeping council tax at the second lowest level in outer London and the lowest of its neighbouring London boroughs. See more West Drayton couple fined more than £6,000 for illegally turning home into skip storage yard 25 Feb 2025 A husband and wife in West Drayton have been ordered to pay £6,936 after an investigation by Hillingdon Council found their home was unlawfully used to operate a skip hire and commercial waste business, causing significant disruption to residents, despite receiving multiple warnings. See more Council clamps down on anti-social behaviour in private residential block 21 Feb 2025 Hillingdon Council has been granted two closure orders within a residential apartment block in Harlington following reports of persistent anti-social behaviour (ASB) and criminal activity. See more Council launches Next Gen activities programme for young people 19 Feb 2025 Hillingdon Council has launched an exciting new youth offer and associated marketing campaign, Next Gen, to reflect the diverse and flexible needs of children and young people. See more Could you give a child a loving home? 17 Feb 2025 Hillingdon Council is encouraging residents with a safe and nurturing home environment to consider making a difference to a child's life by fostering. See more Have your say on priorities for reducing crime and disorder 17 Feb 2025 Hillingdon Council is encouraging residents to share their experiences and concerns about crime, disorder, and anti-social behaviour in the borough to help identify future priorities to tackle these issues. See more Council obtains new partial-closure orders to tackle ASB in flats 14 Feb 2025 Hillingdon Council has been granted new partial closure orders at three blocks of flats in Uxbridge and Hayes as part of ongoing efforts to stamp out anti-social behaviour (ASB) and keep residents safe. See more Hillingdon declares its 'open for business' at inaugural conference 14 Feb 2025 Hillingdon Council yesterday (Thursday 13 February) showcased its plans to work alongside partners and businesses to build a thriving economy at its first investment conference. See more Council completes revamp of West Drayton shopping parade 13 Feb 2025 Hillingdon Council has completed a revitalisation of Mulberry Parade in West Drayton as part of town centre improvements programme. See more Hillingdon businesses boosted with skills and mentoring 13 Feb 2025 Hillingdon Council celebrated the success of its UKSPF-funded business support programme, with 47 local enterprises rewarded for completion at a special awards ceremony. See more Cable Challenge gets pupils connecting with recycling 11 Feb 2025 Hillingdon Council is encouraging school pupils to find and collect old or unused electrical cables from around the home and recycle them as part of a drive to promote the reuse of valuable metals and further reduce contamination. See more Council celebrates its apprentices and developing local talent 10 Feb 2025 Hillingdon Council is celebrating its apprentices and their contribution to services as part of National Apprenticeship Week (10 to 16 February). See more Harlington restaurant fined more than £22,000 for cockroach infestation 05 Feb 2025 A Harlington tandoori and its manager have been ordered to pay £22,498.75 after an investigation by Hillingdon Council discovered a significant infestation of cockroaches despite a prior conviction for hygiene offences. See more Visit the borough's Warm Welcome Centres 30 Jan 2025 Hillingdon Council, in partnership with community organisations, is offering free, warm and welcoming places for residents to visit for a hot drink and some company during the colder winter days. See more Hillingdon Council firmly opposes Labour government's decision to back a third runway at Heathrow 29 Jan 2025 Following the announcement today (29 January) by the Chancellor of the Exchequer, Rachel Reeves, that the government is inviting proposals for expansion by the summer, the council reaffirms its intention to robustly fight any plans, just as it did with Heathrow Airport Limited's previous proposals. See more Council welcomes NHS to Civic Centre 28 Jan 2025 Hillingdon Council is delivering more joined up services and maximising the use of council assets with the relocation from this month of NHS North West London teams to the Civic Centre in Uxbridge. See more Keeping your heart healthy 28 Jan 2025 Hillingdon Council will host a series of events at its libraries next month to promote heart health and encourage residents to live a healthier lifestyle. See more New home for South Ruislip Children's Centre 27 Jan 2025 Hillingdon Council has relocated South Ruislip Children's Centre to a newly refitted and inclusive building on the same site, offering a wider range of early learning and development services for children and families. See more Book-themed recycling campaign aims to inspire schoolchildren 27 Jan 2025 Hillingdon Council has launched a new recycling campaign for primary school children called 'That's not my recycling bag', inspired by the popular 'That's not my' children's book series. See more Four fined more than £1,200 for fraudulent use of relatives' parking badges 23 Jan 2025 Hillingdon Council has successfully prosecuted four individuals caught fraudulently using a family member's Blue Badge following a boroughwide parking fraud enforcement operation. See more Hillingdon Council statement on the redevelopment of Hillingdon Hospital 21 Jan 2025 Cllr Jonathan Bianco, Deputy Leader and Cabinet Member for Corporate Services and Property, said: "We're glad that the government has finally seen sense and decided to move forward with the Hillingdon Hospital redevelopment. See more Council's first Families Roadshow comes to Ruislip Manor 20 Jan 2025 Hillingdon Council's first Families Roadshow will be held at Ruislip Manor Library on Wednesday 5 February from 10am to 3pm. See more Council acquires new homes in Uxbridge 16 Jan 2025 Hillingdon Council has purchased 12 new properties at Carpenters Court, Uxbridge, as part of its commitment to create more homes for residents. See more New vehicles give Harefield Civic Amenity Site efficiency upgrade 13 Jan 2025 New machinery was introduced at Harefield Civic Amenity Site at the end of last year as part of Hillingdon Council's drive for its operations to be more efficient and have a reduced carbon footprint. See more Council approves measures to restrict taxis from waiting in residential streets near Heathrow 13 Jan 2025 Hillingdon Council's Cabinet has approved proposals to implement a new Public Spaces Protection Order (PSPO) to stop taxis and private hire vehicles (PHVs) waiting in residential streets near Heathrow Airport. See more Council golf course to temporarily close while new operator sought 07 Jan 2025 Hillingdon Council has appointed advisors to support its search for a specialist operator to take on the running of Haste Hill and Uxbridge golf courses, with the latter set to temporarily close in the interim. See more Council secures new operator for its three early years centres 07 Jan 2025 As part of a continued drive to deliver value for money services, Hillingdon Council has secured a new, specialist childcare operator for its early years centres. See more 2024 news archive 01 Jan 2025 Hillingdon Council's news releases from 2024. See more 2023 news archive 01 Jan 2024 Hillingdon Council's news releases from 2023. See more'''
