["https://hillingdon.gov.uk/article/14016/Sign-up-for-automatic-recycling-bag-deliveries"]
title = "Automatic recycling bag delivery scheme - Hillingdon Council"
description = "Information on our automatic recycling bag delivery scheme and how to sign up or re-register."
full_description = "Recycling collections Our council is committed to recycling as much of our borough's waste as possible and we provide free recycling collections for residents. We encourage everyone to recycle more of the right things and help make Hillingdon a green and sustainable borough. In this section: Automatic recycling bag delivery scheme Festive recycling Dry mixed recycling Food waste recycling Garden waste recycling Textile recycling Small electricals Recycling collection days More ways to dispose of your recycling Automatic recycling bag delivery scheme Our automatic recycling bag delivery scheme is the easiest way for residents to access free dry, mixed recycling bags and food caddy liners. It's also the most efficient and cost-effective method for our council to deliver bags. With our free scheme, getting your recycling bags couldn't be easier.Simply sign up using our online form and we'll do the rest.Please note: If you were signed up to our previous automatic bag delivery scheme, you will need to re-register.When will deliveries be made?To help reduce our carbon footprint, we're introducing zoned deliveries (by ward) once a year.This will decrease the number of annual deliveries we make by more than 150,000, significantly reducing vehicle emissions and contributing to our target of our operations being carbon neutral by 2030. Check the delivery month for your wardBelmore - MayCharville - JuneColham and Cowley - AprilEastcote - NovemberHarefield Village - SeptemberHayes Town - MarchHeathrow Villages - JanuaryHillingdon East - JuneHillingdon West - JulyIckenham and South Harefield - JulyNorthwood - DecemberNorthwood Hills - AugustRuislip Manor - NovemberPinkwell - JanuaryRuislip - SeptemberSouth Ruislip - OctoberUxbridge - JulyWest Drayton - FebruaryWood End - MarchYeading - MayYiewsley - February Important: To ensure you receive your delivery, re-sign up or register at least 1 month ahead of your scheduled delivery month. Please continue to use any existing rolls of recycling bags you have until your first delivery is due.How to sign up or re-register for the schemeThe sign-up process is quick and easy.Complete our online form, where we will ask you a few questions about how much recycling, on average, your household generates a week and the number of people living at your property.Once you have submitted your form, you will receive an email, advising how many bags you will receive and confirmation of when your delivery will take place.On your delivery month, we will deliver your bags (to cover 12 months) to your doorstep.You will be emailed annually to review your subscription and, if circumstances have changed, your subscription will be adjusted accordingly. There will also be an option to cancel the subscription. Sign up for automatic recycling bag deliveriesPlease note:Each property can subscribe to the scheme only once.The number of rolls allocated for delivery per year will be based on the number of residents living at a property and household usage.While the new process is rolled out, there may be several months before your first scheduled delivery. If you need bags before your first delivery is due, you can request an ad-hoc delivery of recycling bags. Print this page Share this page Next Page Festive recycling Page last updated: 23 Jan 2025 Was this page helpful? Yes No Report an issue with this page"
year_published = 2025
year_updated = 2025
