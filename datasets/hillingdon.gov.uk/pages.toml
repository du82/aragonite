["https://hillingdon.gov.uk/article/14249/Council-seeks-views-on-garden-waste-collection-service"]
title = "Council seeks views on garden waste collection service - Hillingdon Council"
description = "Hillingdon residents are being invited to share their feedback on the council's proposals to make its garden waste collection service more sustainable."
full_description = '''Council seeks views on garden waste collection service Monday 3 March 2025: Hillingdon residents are being invited to share their feedback on the council's proposals to make its garden waste collection service more sustainable. <img alt="garden waste bags" src="/image/15929/Garden-waste-consultation/gi-responsive__fallback.jpg?m=1741005063570" class="gi-responsiveimage__fallback" width="380" height="217" loading="lazy" /> gi.responsiveImage.initialiseResponsiveImage('c_739084156921876'); A four-week consultation launched today (Monday 3 March) seeks to understand residents' usage and views on the council's proposal to introduce a subscription fee. The proposed change would see the introduction of a £70 charge for 2025/26 to support the service's running costs. It would continue to offer residents better value for money than neighbouring boroughs through a cheaper rate per collection, the retention of weekly collections in spring, summer and autumn, and greater capacity. Anyone without a subscription would still be able to take their garden waste to our civic amenity sites for free. The proposed change would also mean that the service is paid for by those using it rather than the cost being shared by all taxpayers, including those without gardens. Cllr Eddie Lavery, Hillingdon Council's Cabinet Member for Community and Environment, said: "The government has placed local authorities in a very difficult situation by failing to provide sufficient funding to meet the demand for services. "Earlier this month, the government broke its promise to fully fund councils for their increase in employer's national insurance costs and the recent upturn in inflation has made that hole in our budget even bigger. "The vast majority of local authorities in London are already charging for garden waste collection, some have been for many years now, and typically this is for a fortnightly service. We are not proposing to change the way we presently collect garden waste other than to make a charge for this service. "We are constantly seeking to protect residents from increased burdens but it is necessary to consider this proposal in order to ensure a more sustainable operating model for the future while continuing to put residents first by delivering value for money in comparison to our neighbouring boroughs." The consultation is open until Monday 31 March, and a decision will be made in spring. To take part visit www.hillingdon.gov.uk/garden-waste-consultation. <img alt="Council Strategy - Green sustainable icon with text" src="/image/12828/A-green-and-sustainable-borough/gi-responsive__fallback.png?m=1706865583670" class="gi-responsiveimage__fallback" width="350" height="99" loading="lazy" /> gi.responsiveImage.initialiseResponsiveImage('c_739084159923996'); <img alt="Council Strategy - Digital, modern icon with text" src="/image/13027/A-digital-enabled-modern-well-run-council/gi-responsive__fallback.png?m=1706865531540" class="gi-responsiveimage__fallback" width="350" height="99" loading="lazy" /> gi.responsiveImage.initialiseResponsiveImage('c_739084162927518'); Print this page Share this page Page last updated: 03 Mar 2025 Was this page helpful? Yes No Report an issue with this page'''
year_published = 2025
year_updated = 2025
clearnet = "https://hillingdon.gov.uk/article/14249/Council-seeks-views-on-garden-waste-collection-service"
