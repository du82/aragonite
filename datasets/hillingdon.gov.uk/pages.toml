["https://hillingdon.gov.uk/article/9886/Where-can-the-HillingdonFirst-card-be-used"]
title = "Where can the HillingdonFirst card be used? - Hillingdon Council"
description = "Use your HillingdonFirst card to receive discounts, offers and preferential rates on various products, services and facilities across the borough."
full_description = '''HillingdonFirst card Information for residents and businesses about our HillingdonFirst card. In this section: Information for residents Where can the HFC be used? Information for businesses Where can the HillingdonFirst card be used? Use your HillingdonFirst card to receive discounts, offers and preferential rates on various products, services and facilities across the borough. Your card also acts as proof of residency when using our waste and recycling centres. <img alt="Local businesses" src="/image/2323/Local-businesses/gi-responsive__fallback.jpg?m=1592490708963" class="gi-responsiveimage__fallback" width="380" height="254" loading="lazy" /> gi.responsiveImage.initialiseResponsiveImage('c_739209853618275'); At participating businessesHundreds of businesses are part of our HillingdonFirst card programme and offer discounts and offers on various products and services, including food and drink, clothing, travel, leisure and hair and beauty.Simply show your HillingdonFirst card at the point of paying.Please note: Acceptance of the HillingdonFirst card is at the shop manager's discretion. Your HillingdonFirst card cannot be used to make online purchases.View HillingdonFirst card offers and discounts <img alt="Computers at a Hillingdon library" src="/image/2324/Computers-at-a-Hillingdon-library/gi-responsive__fallback.jpg?m=1592491251693" class="gi-responsiveimage__fallback" width="380" height="277" loading="lazy" /> gi.responsiveImage.initialiseResponsiveImage('c_739209856102437'); At any of our librariesYour HillingdonFirst card is also your library card. This allows you to borrow books, talking books and access our fantastic online digital library.If you're an existing Hillingdon library member, speak with a member of staff about replacing your old card with a HillingdonFirst card.If you have not been an active library user in the last 2 years, you will need to reactivate your membership. You can do this by visiting one of our libraries and asking to join the library where your HillingdonFirst card will be activated.View Hillingdon's Digital Library <img alt="Things to do - Leisure Centres" src="/image/2325/Things-to-do---Leisure-Centres/gi-responsive__fallback.jpg?m=1592491591473" class="gi-responsiveimage__fallback" width="380" height="252" loading="lazy" /> gi.responsiveImage.initialiseResponsiveImage('c_739209858545468'); In leisure centresGet preferential rates at our leisure centres - contact your local centre directly for full details.Botwell Green Sports and Leisure Centre (opens new window)Highgrove Pool and Fitness Centre (opens new window)Queensmead Sports Centre (opens new window)Hillingdon Sports and Leisure Complex (opens new window)At council car parks and for on-street parkingGet preferential parking rates at our on-street parking bays and in our car parks with your HillingdonFirst card. You can view all of the available car parks and ticket pricing on our Car parks map and charges webpage. If paying by cardPress the yellow button.Press and hold your HillingdonFirst card on the contactless symbol for up to 4 seconds (until authorised).Insert coins for the duration of your parking.Press the green button.Display your ticket on your window screen.If paying with a contactless cardPress the yellow button.Press and hold your HillingdonFirst card on the contactless symbol for up to 4 seconds (until authorised).Use the blue buttons to select the payment change.Press the green button.Tap your contactless card (or mobile) to the card reader.Display your ticket on your window screen.Please note: If you forget your card, you will have to pay the full charge. Watch our short video, showing how to pay for a ticket using your HillingdonFirst card.If paying with PayByPhonePayByPhone allows you to pay for parking on the go using an app or web browser on your mobile phone or tablet without having to buy a ticket from a pay and display machine.You can find out how to get started with PayByPhone and linking your HillingdonFirst card with the app on our PayByPhone webpage. Related topics Waste and recycling centres Print this page Share this page Previous Page Information for residents Next Page Information for businesses Page last updated: 07 Aug 2023 Was this page helpful? Yes No Report an issue with this page'''
year_published = 2023
year_updated = 2024
clearnet = "https://hillingdon.gov.uk/article/9886/Where-can-the-HillingdonFirst-card-be-used"
