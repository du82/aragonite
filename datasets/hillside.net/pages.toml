["https://hillside.net/conferences/shepherding"]
title = "Shepherding"
description = "The Hillside Group is a nonprofit corporation dedicated to improving human communication about computers by encouraging people to codify common programming and design practice. We sponsor conferences like PLoP, EuroPLoP, UP, ChiliPLoP, Mensore PLoP, KoalaPLoP and SugarLoafPLoP"
full_description = "Many of us have submitted patterns to our colleagues for feedback prior to a writers’ workshop or other type of review. In fact, at PLoP conferences, all submissions are subjected to shepherding before they are evaluated for acceptance. Unfortunately, the quality of shepherding varies widely. Some people receive extremely helpful comments, but others receive only cursory remarks, and a “Looks good” endorsement. Yet shepherding can be a very powerful tool for improving patterns. It can go well beyond hints for grammar and usage, even to the heart of the work being shepherded. In fact, shepherding can turn a paper about a solution into a pattern. But it requires more than a casual reading by the shepherd: it requires attention! The Award winners named below exemplify the observant, helpful, and insightful characteristics that are crucial to quality shepherding. Congratulations!"
author = "Administrator"
year_published = 2025
