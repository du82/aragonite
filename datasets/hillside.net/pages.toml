["https://hillside.net/asianplop/proceedings/AsianPLoP2020"]
title = "AsianPLoP® 2020 Conference Proceeding"
full_description = "Asian Conference on Pattern Languages of Programs (AsianPLoP®) is the premier event for pattern authors and users to get together, discuss and learn more about patterns and pattern languages in the Asia region as well as other regions. The purpose of AsianPLoP® is to promote development of patterns, pattern languages, technologies and experiences of patterns primarily about software as well as domains. Permission to make digital or hard copies of all or part of this work for personal or classroom use is granted without fee provided that copies are not made or distributed for profit or commercial advantage and that copies bear this notice and the full citation on the first page. To copy otherwise, to republish, to post on servers or to redistribute to lists, requires prior specific permission. A preliminary version of this paper was presented in a writers' workshop at the 9th Asian Conference on Pattern Languages of Programs (AsianPLoP). AsianPLoP'20, March 4th - 6th, 2020, Taipei, Taiwan; (due to COVID-19 pandemic, the conference was held online September 2nd - 4th, 2020;) Copyright 2020 is held by the author(s). Welcome to the ninth edition of AsianPLoP. Although COVID-19 has prevented us from gathering in Taipei for the second time, we are pleased to announce that this edition continues the excellent tradition of AsianPLoP in sourcing patterns across a wide range of topics including software, education and learning, and social science. All papers accepted to the Writer's Workshop went through at least two iterations of shepherding, and received at least three votes from program committee members to put them in the Writer's Workshop. All keynotes, tutorials, and Writer's Workshops will meet online. While it will probably be a while for us to meet in one place and enjoy each other's presence again, we hope you'll enjoy this online edition of AsianPLoP. Conference co-chairs: Kai H. Chang, Auburn University, USA Hironori Washizaki, Waseda University, Japan Chui-Yu Chiu, Taipei Tech, Taiwan"
