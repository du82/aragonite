["https://hillside.net/home/board"]
title = "Board"
description = "The Hillside Group is a nonprofit corporation dedicated to improving human communication about computers by encouraging people to codify common programming and design practice. We sponsor conferences like PLoP, EuroPLoP, UP, ChiliPLoP, Mensore PLoP, KoalaPLoP and SugarLoafPLoP"
full_description = '''Joseph (Joe) Yoder (agilist, computer scientist, speaker, and pattern author) is the founder and principal of The Refactory, a company focused on software architecture, design, implementation, consulting, and mentoring on all facets of software development. Joe has presented many tutorials and talks, arranged workshops, given keynotes, and helped organize leading international agile and technical conferences. He is best known as an author of the Big Ball of Mud pattern, which illuminates many fallacies in software architecture. Joe teaches and mentors developers on Agile and lean practices, architecture, building flexible systems, clean design, patterns, refactoring, and testing. MaryLynn Manns, PhD is the co-author of two books, Fearless Change: Patterns for Introducing New Ideas, 2005 (also published in Japanese and Chinese) and More Fearless Change: Strategies for Making Your Ideas Happen, 2015, and a Professor Emerita at the University of North Carolina in Asheville. She has given numerous presentations on change leadership at events throughout the world and in many organizations that include Microsoft, Procter & Gamble, Avon, and Amazon. Kyle Brown is an IBM Fellow and Vice President and the CTO to the CIO of IBM. He has over 25 years of experience in designing and implementing large-scale systems. Kyle leads a team responsible for helping our customers adopt IBM’s cloud technologies and build applications using IBM's cloud products and he is a world-recognized expert on topics in the cloud, Java, and software architecture. He publishes often, conducts webinars, and is the author of ten books including the recent "Cloud Adoption Playbook" published in 2018 by Wiley. You can find all of his publications linked at http://www.kyle-brown.com Rebecca Wirfs-Brock is an internationally recognized leader in the development of object design methodologies. She invented the set of development practices known as Responsibility-Driven Design. Among her widely used innovations are use case conversations and object role stereotypes. She is the regular design columnist for IEEE Software and the author of the classic text, Designing Object-Oriented Software. Her most recent book, Object Design: Roles, Responsibilities and Collaborations, was published in 2002.'''
author = "Administrator"
year_published = 2025
