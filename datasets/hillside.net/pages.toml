["https://hillside.net/asianplop/proceedings/AsianPLoP2014/AsianPLoP2014ConferenceProceedings.html"]
title = "AsianPLoP® 2014 Conference Proceedings"
description = "Conference Proceedings from the 3rd Asian Confernce on Pattern Languages of Programs"
full_description = '''AsianPLoP is a premier event for pattern authors and users to gather, discuss and learn more about patterns and pattern languages in the Asia region as well as other regions. AsianPLoP is a PLoP® Conference sanctioned by the Hillside Group. PLoP is a registered trademark of The Hillside Group. These papers were work-shopped at Asian Conference on Pattern Languages of Programs (AsianPLoP) 2014 March 5-8, 2014, Tokyo, Japan. Permission to make digital or hard copies of all or part of this work for personal or classroom use is granted without fee provided that copies are not made or distributed for profit or commercial advantage and that copies bear this notice and the full citation on the first page. To copy otherwise, to republish, to post on servers or to redistribute to lists, requires prior specific permission. Copyright is held by the authors. Asian Conference on Pattern Languages of Programs (AsianPLoP) took place at the third time. The conference had 21 papers for Writer's Workshops (WW), and 5 papers for Writing Groups (WG). Papers for WW were workshopped in the traditional PLoP format. Papers for WG were also explained and commented in the similar workshop style. Moreover there were Keynote titled "How and Why Design Patterns Impact Quality and Future Challenges" by Yann-Gael Gueheneuc, Keynote titled "Nature of Order" by Hiroshi Nakano, Tutorial on how to write good patterns (Bootcamp), Alexander's Properties Workshop, Disaster Prevention Workshop, Workshop on Pattern Language Cards, and Games! The conference was sponsored and supported by TopSE Education Center, Waseda University Global Software Engineering Laboratory, SIGSE Patterns WG IPSJ, eXtreme Programming Japan Users Group (XPJUG), Agile Process Association, and SEMAT Japan Chapter. Yasunobu Kawaguchi, Takashi Iba, and Hironori Washizaki, AsianPLoP 2014 Conference and Program Chairs Pattern Languages of Programs (PLoP) conference is a place for pattern authors to have their pattern languages reviewed by fellow authors. The purpose of AsianPLoP is to promote development of patterns, pattern languages, technologies and experiences of patterns primarily about software; however, these for domains outside software were also welcome.'''
