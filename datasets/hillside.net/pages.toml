["https://hillside.net/asianplop/proceedings/AsianPLoP2015/AsianPLoP2015ConferenceProceedings.html"]
title = "AsianPLoP® 2015 Conference Proceedings"
description = "Conference Proceedings from the 4th Asian Confernce on Pattern Languages of Programs"
full_description = '''AsianPLoP is a premier event for pattern authors and users to gather, discuss and learn more about patterns and pattern languages in the Asia region as well as other regions. AsianPLoP is a PLoP® Conference sanctioned by the Hillside Group. PLoP is a registered trademark of The Hillside Group. These papers were work-shopped at Asian Conference on Pattern Languages of Programs (AsianPLoP) 2015 March 5-7, 2015, Tokyo, Japan. Permission to make digital or hard copies of all or part of this work for personal or classroom use is granted without fee provided that copies are not made or distributed for profit or commercial advantage and that copies bear this notice and the full citation on the first page. To copy otherwise, to republish, to post on servers or to redistribute to lists, requires prior specific permission. Copyright is held by the authors. Asian Conference on Pattern Languages of Programs (AsianPLoP) took place at the fourth time. The conference had 13 papers for Writer's Workshops (WW), and 1 paper for Writing Group (WG). Papers for WW were workshopped in the traditional PLoP format. Paper for WG was also explained and commented in the similar workshop style. Moreover there were Keynote titled "Japanese Supirituaruty and Pattern Language" by Hiroshi Nakano, Keynote titled "A Challenge to the (Japanese) Pattern Community" by James O. Coplien, Shepherding Workshop, Workshop on Processes for Making Lively Things, and Games! The conference was sponsored and supported by Waseda University Global Software Engineering Laboratory and SIGSE Patterns WG IPSJ. Pattern Languages of Programs (PLoP) conference is a place for pattern authors to have their pattern languages reviewed by fellow authors. The purpose of AsianPLoP is to promote development of patterns, pattern languages, technologies and experiences of patterns primarily about software; however, these for domains outside software were also welcome. AsianPLoP is different from other conferences. It is run in the "writers' workshop" style, as described in Richard Gabriel's book. Before the conference, authors interact with a "shepherd" who helps them improve their paper to make it as ready for AsianPLoP as possible. A program committee reviews the papers for final acceptance after they have gone through the shepherding process. The writers workshops provide more feedback.'''
author = "AsianPLoP 2015 Confernce Proceedings"
