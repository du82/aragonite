["https://hillside.net/guruplop"]
title = "GuruPlop"
full_description = "GuruPLoP 2014 The Indian pattern conference GuruPLoP is an excellent venue to meet pattern experts and to exchange knowledge about patterns. The conference helps you to learn more about patterns, to receive feedback on your own work, and to discuss with fellow pattern enthusiasts. We especially encourage new-comers, academic and non-academic pattern enthusiasts to participate in the conference. Open and supportive atmosphere makes GuruPLoP a great opportunity to get familiar with patterns and the patterns community. Some of you have had the opportunity to write and workshop patterns at one of the many PLoP conferences held in the world. Others will have heard about patterns, and even used them in your professional work, but have yet to commit your own insights to paper and submit them for mentored development. GuruPLoP offers two complementary experiences: 1 - If you are new to patterns you can learn all about pattern discovery and pattern writing. 2 - If you are an author you will gain the opportunity to workshop your work and gain the feedback and support that will enhance your work and bring it to the attention of the world. Important dates Dec 16th - Paper submission deadline Dec 18th - Start of shepherding Jan 12th - Second draft due for review Jan 27th - Paper acceptance notification Feb 21st-23rd - GuruPLoP conference Conference highlights Tutorials, seminars and invited presentationsExpanding your knowledge of patterns and pattern languages. Writer’s workshopsFor authors, participants, or observers where you will see the kind of support, mentoring, and feedback the community will provide for you. Social and informal activities Opportunities for networking and conversations that will establish you as part of a respected profession. Social and informal activities Opportunities for networking and conversations that will establish you as part of a respected profession. GuruPLoP in partnership with ISEC 2014 GuruPLoP 2014 will be held February 21st-23rd in Chennai, Tamil Nadu, in co-location with ISEC."
