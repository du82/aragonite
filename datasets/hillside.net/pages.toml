["https://hillside.net/patterns/patterns-catalog"]
title = "Design Patterns Catalog"
description = "The Hillside Group is a nonprofit corporation dedicated to improving human communication about computers by encouraging people to codify common programming and design practice. We sponsor conferences like PLoP, EuroPLoP, UP, ChiliPLoP, Mensore PLoP, KoalaPLoP and SugarLoafPLoP"
full_description = "Abstract: A specialized set of patterns for defining the human-machine interface has come into use within the world of telecommunications switching products. The patterns presented here provide for the essential interaction between a system and its human masters. Several of the patterns discuss concepts specific to a telecommunications system, but most are general enough to provide insight for anyone designing the input/output (“IO”) interface for a large system. This paper begins by discussing the environment within which these patterns are applicable. Two different methods of visualizing the overall structure of this language are then presented, one graphical and the other in the form of topical pattern groupings. The patterns are then introduced. Supplemental material includes thumbnail sketches of the patterns."
