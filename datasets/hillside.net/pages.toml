["https://hillside.net/conferences/asian-plop"]
title = "Asian PLoP"
description = "The Hillside Group is a nonprofit corporation dedicated to improving human communication about computers by encouraging people to codify common programming and design practice. We sponsor conferences like PLoP, EuroPLoP, UP, ChiliPLoP, Mensore PLoP, KoalaPLoP and SugarLoafPLoP"
full_description = "AsianPLoP solicits paper submissions written in both of English and Japanese; English papers and Japanese ones will be discussed in different sessions. Both practitioners from the industry and academics are invited to submit their papers. The conference solicits the papers for the following different sessions. While this is the first AsianPLoP, The Hillside Group has sponsored PLoP conferences located in Asian Pacific region in the past, including the MensorePLoP and KoalaPLoP. Software developers have long observed that certain themes recur and endure across different applications and systems. The emerging interest in patterns represents an effort to catalog and communicate these themes and motives-to provide handbooks of proven solutions to common problems. MensorePLoP brings together researchers and practitioners whose interests span a remarkably broad range of topics, who share an interest in exploring the power of the pattern form. MensorePLoP invites you to add your expertise to the growing corpus of patterns. MensorePLoP focuses on improving the expression of patterns. MensorePLoP was held at Hotel Moon Beach, Okinawa, Japan. This was the first attempt to hold this kind of conference in a subtropical climate and insular geological structure. KoalaPLoPTM was hosted near Melbourne Australia and is open to pattern authors, pattern users, and software designers and developers from around the world. The conference was last hosted in 2002. It ran for three conference cycles."
