["https://hillside.net"]
title = "The Hillside Group - A group dedicated to design patterns. Home of the patterns library."
description = "The Hillside Group is a nonprofit corporation dedicated to improving human communication about computers by encouraging people to codify common programming and design practice. We sponsor conferences like PLoP, EuroPLoP, UP, ChiliPLoP, Mensore PLoP, KoalaPLoP and SugarLoafPLoP"
full_description = "Pattern Languages of Programs, People, and Practices (PLoP®) is the premier conference for pattern authors and users to gather, discuss and learn more about patterns. To achieve this, the conference promotes the use of patterns and pattern languages, as well as the underlying theory of the nature of order. PLoP 2024 will be held October 13-16, 2024. Visit the PLoP Official Site, The mission of the Hillside Group is to improve the quality of life and society as a whole. This includes architects, developers, managers, owners, workers, educators, students, and more. Understanding and helping the human element is critical for achieving success. The Hillside Group believes in making processes and design more humane by paying attention to real people and existing practices. The Hillside Group promotes the use of patterns and pattern languages to record, analyze, and share knowledge to help achieve its mission. The Hillside Group sponsors a variety of activities to achieve this mission—organizing workshops, hosting PLoP (pattern) conferences, and producing publications for discussing, recording, and documenting successful practices. The Hillside Group supports many different conferences such as: PLoP, EuroPLoP, AsianPLoP, VikingPLoP, SugarLoafPLoP, and ChiliPLoP. These conferences focus on writing groups to better improve patterns through group exposure. Each conference offers advanced topics for the more adept pattern writers. Participants have the opportunity to refine and extend their patterns with help from knowledgeable and sympathetic patterns enthusiasts. The Design Patterns Book Series showcases many patterns from PLoP conferences and leading experts in the patterns field. The Hillside Fellowship Program was established in 2016 to recognize members of The Hillside Group who have made exceptional contributions to the Hillside community and to the Patterns community at large. The title of Hillside Fellow denotes an outstanding member who has consistently and repeatedly:"
