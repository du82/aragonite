full_description = "After the PLoP Workshops, writers are encouraged to modify their papers and submit a final version. The final versions are collected and submitted to the ACM Digital Library. The versions are also available from the conference website. Some of the PLoP accepted papers have been published on the ACM Digital Library. The program committee will review the final versions of the papers and recommend acceptance to for the ACM Digital Library based on the general quality of the paper and whether the suggestions from the Writers’ Workshop have been taken into account. Papers that have been workshopped at all PLoPs qualify for submission to the Springer journal LNCS Transactions on Pattern Languages of Programming (TPLoP). Submissions to TPLoP will be blind reviewed independently. If the paper is accepted for TPLoP, the editorial board usually asks for minor or major revisions based on the feedback from the reviewers. Proceedings of some previous years PLoPs are out of print. However, you can access the Writers' Workshop papers via past plop conference pages."
