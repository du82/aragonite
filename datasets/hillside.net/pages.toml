["https://hillside.net/asianplop2024"]
title = "AsianPLoP 2024"
description = "The Hillside Group is a nonprofit corporation dedicated to improving human communication about computers by encouraging people to codify common programming and design practice. We sponsor conferences like PLoP, EuroPLoP, UP, ChiliPLoP, Mensore PLoP, KoalaPLoP and SugarLoafPLoP"
full_description = "10th Asian Conference on Pattern Languages of Programs, People, and PracticesCall for Submissions and Participation for AsianPLoP 2024Feb. 28 - Mar. 3, 2024 — Fujisawa City, Kanagawa Prefecture, Japan When people create something or implement a practice, they utilize knowledge learned from their past experiences. However, this knowledge of design and practice is usually confined to the individual, making it inaccessible to others. What if we could articulate this tacit knowledge and share it with others? This is where Pattern Languages come into play. Originally developed as a method to share knowledge about designing good towns and buildings, it was later used to share expertise in excellent software design. Subsequently, Pattern Languages have been created across a wide range of fields to articulate and share knowledge in professional and everyday practices.AsianPLoP is a conference held in Asia, bringing together people interested in articulating and sharing knowledge of good design and practices across various fields. During the conference, participants bring their short papers and exchange feedback and further ideas to improve each other’s work. This fosters a collaborative environment for facilitating the creation of pattern languages to empower individuals and communities for a better future. Your participation and contributions are highly anticipated, as we embark on this collective journey towards a better future. The core of AsianPLoP, as with all PLoP conferences, is the Writers’ Workshop. This workshop is where participants discuss improving their papers through constructive feedback. Before papers are accepted for a Writers’ Workshop, they are shepherded. Shepherding is an iterative process, where an experienced author discusses the submission with its authors to refine the paper prior to the conference. To be accepted into the Writers’ Workshop, papers must be improved through this shepherding process. As AsianPLoP 2024 is calling for Short Papers, the Shepherding process is simplified into 1-2 rounds, which we refer to as Mini-Shepherding for this conference. After the conference, authors have the opportunity to submit their final version, revised based on the comments received at the Writers’ Workshop. Submitted papers that were updated after the writers' workshops can be found below."
