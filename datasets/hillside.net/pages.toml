["https://hillside.net/chiliplop"]
title = "Design Patterns Conference | ChiliPLoP 2012"
full_description = 'After many years in Arizona, Chili is moving one state eastward to New Mexico, where the official State Question is “Red or Green?” (Referring to chili, of course.) Our venue will be the historic Plaza Hotel, just across the square from Doc Holliday’s dentist office. The Plaza square is where the United States took official possession of New Mexico following the Civil War. Las Vegas, New Mexico has no casinos or rivers of neon but does have a couple of centuries of history and an invigorating tri-cultural heritage. It has also been featured in numerous movies including No Country for Old Men and the unforgettable Red Dawn. In 1887 Edward Bellamy published Looking Backward. 162 “Bellamy Clubs” formed, across the US—people gathering to discuss the ideas in the book and propose means and actions that would make them a reality. This year, ChiliPloP attendees will work on something similar—taking “A Different Kind of PLoP” to a new dimension. Please Join Us! The 15th Annual ChiliPLoP features "hot topics" for experienced folks to gather and tackle issues. Participants must choose one hot topic and register with the workshop organizer. How do you do this? Write an email to one of the organizers requesting that you be included in their Hot Topic discussion. If you are accepted, you will receive an email from your Hot Topic leader with the registration link. Application development (Reality Construction)—the use of computers and software to craft every aspect of the world we inhabit—should be an area of investigation and practice independent of its progenitors: computer science, software engineering, and MIS. Help define this discipline and participate in its establishment as a degree program with global scope. Through the use of cloud computing, providers and customers alike may benefit from economies of scale, reduced provisioning times, and flexible scaling of cloud applications. To benefit from this powerful computing environment, application architects, however, have to respect the specific properties of clouds: /elasticity/ -- the ability to adjust resources numbers assigned to an application flexibly and on demand; /pay-per-use/ -- only the reserved resources are billed to customers; /standardization/ -- the runtime environment of cloud applications consists of reusable services, middleware platforms, and virtualized hardware; /resource sharing/ -- resources in the cloud are shared between multiple customers...Cloud offerings provide infrastructure, platform and as a Service. If these services are used by cloud applications they become highly dependent on the interfaces and behavior of these offerings...'
