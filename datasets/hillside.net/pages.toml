["https://hillside.net/patterns-definition"]
title = "Patterns Definition"
description = "The Hillside Group is a nonprofit corporation dedicated to improving human communication about computers by encouraging people to codify common programming and design practice. We sponsor conferences like PLoP, EuroPLoP, UP, ChiliPLoP, Mensore PLoP, KoalaPLoP and SugarLoafPLoP"
full_description = '''I suppose I cannot argue with the actual words, because they are not obviously false, but I fear that this can represent a misconception. Each pattern is a three-part rule, which expresses a relation between a certain context, a problem, and a solution. I'm sure that because he wrote this many feel that the rewording above is a fair copy. I don't think it is. Alexander is capable of writing simple sentences when the thought he wishes to express is simple. He could easily have said "a pattern is solution to a problem in a context" - he uses most of these words already. As an element in the world, each pattern is a relationship between a certain context, a certain system of forces which occurs repeatedly in that context, and a certain spatial configuration which allows these forces to resolve themselves. As an element of language, a pattern is an instruction, which shows how this spatial configuration can be used, over and over again, to resolve the given system of forces, wherever the context makes it relevant. If you walk into a room and you ask Alexander to list all the patterns he sees, he will not look for sheets of paper with patterns written on them, he will look at the room and tell you the ones he sees in the spatial configuration. Similarly, if asked what patterns there are in a software system, an astute patterns person will look at the code and try to list them off. Each pattern is both a statement in a pattern language and a configuration in a program. I don't think the words in the first quote above capture that. For example, according to it a pattern might be: Problem: How do you allocate objects in memory? Context: A large OO system in a virtual memory computer. Solution: Run some typical problems and figure out which objects communicate frequently in a time locale and put them on the same page. This is not a pattern. It is merely a solution to a problem in a context. It can be made into a pattern by talking about configurations of objects that communicate according to a particular definition of efficiency in a virtual memory system. One can imagine other things that might be a pattern according to the over-simple definition, such as the way to figure out the number of things in a "this many sets of this size" problem is to use multiplication.'''
author = "Administrator"
year_published = 2025
clearnet = "https://hillside.net/patterns-definition"
tags = ["2024,", "chiliplop", "conferences", "context:", "design pattern conferences", "design patterns", "design patterns group", "dick", "disclaimer", "europlop"]
