full_description = "There is a growing interest in academia and industry to identify, collect, document and exchange best practices in the management of very large software application landscapes in a structured manner. The goal of the workshop is to improve this knowledge exchange by using an integrating pattern-based approach. An enterprise architecture management pattern (EAM pattern) is a general, reusable solution to a common problem in a given context which identifies driving forces, known usages and consequences. It can be specified on different levels of abstraction and detail, e.g. as a framework for enterprise architectures, as a method for enterprise modeling, or as a reference model."
