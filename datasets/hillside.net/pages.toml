["https://hillside.net/how-to-hold-a-writers-workshop"]
title = "how-to-hold-a-writers-workshop"
description = "The Hillside Group is a nonprofit corporation dedicated to improving human communication about computers by encouraging people to codify common programming and design practice. We sponsor conferences like PLoP, EuroPLoP, UP, ChiliPLoP, Mensore PLoP, KoalaPLoP and SugarLoafPLoP"
full_description = '''Writers' workshops are used by the pattern community to improve our patterns and other manuscripts. These workshops are the primary focus of our time at PLoP and in them we discuss accepted papers. Authors are assigned to a writers' workshop and are expected to attend all sessions in that workshop. All other conference attendees are encouraged to attend one or more writers' workshop sessions, preferably choosing to read and review papers where they can contribute. Paper assignments to workshops are posted before the conference. The format of writers' workshops has been adapted from the creative writing community. Each writers' workshop contains a handful of papers, which authors must read before the conference to be able to give each other feedback on their work in a peer review session of around one hour per paper. Richard Gabriel has written both a book and a pattern language on writers workshops. The pattern language is a good place to start. Each writers' workshop is led by a moderator. In each session, the author or authors of the paper under discussion remain (mostly) silent while the others discuss it and explain insights and views they have about it. Depending on the workshop moderation style, authors may be brought into the discussion to gain insight and clarity about their work. From these sessions, authors get much feedback and many suggestions about how they can improve their work. A fruitful participation in a writers' workshop session requires each participant to read the papers in advance and to take some notes on what was liked about the papers and what needs improvement. Because there's no reading time during the writers' workshops—experience shows that chatting with others or me\ eting people is much more fun than being alone reading papers—do yourself a favor and read the papers of your writers' workshop in advance. The writers workshop format is a particularly effective method to review, evaluate, and improve pattern descriptions. The general structure of a writers workshop has a group of ``discussants'' read the paper carefully before the session. During the workshop, the discussants examine the strengths and weaknesses of each paper, accentuating positive aspects and suggesting improvements in content and style.'''
author = "Administrator"
year_published = 2025
clearnet = "https://hillside.net/how-to-hold-a-writers-workshop"
