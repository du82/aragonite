full_description = '''VikingPLoP is a conference in the tradition of the PLoP conferences, held in different places in northern Europe; that's what the Vikings did -- they were always moving to new territory! The conference program contains writer’s workshops for submitted pattern papers, focus groups, and other activities. The conference provides participants with the opportunity to share their experiences about patterns and software. As with the PLoP series of conferences, our overall goal is to build a community of patterns' people. VikingPLoP especially encourages submissions related to embedded systems, however, also other pattern-related topics are very welcome. For examples of patterns from past years, browse the material at the Patterns Homepage. Any questions regarding this conference can be directed to: This email address is being protected from spambots. You need JavaScript enabled to view it. document.getElementById('cloak7bc8dfc07f29b243ba022c7b1a4c22ee').innerHTML = ''; var prefix = '&#109;a' + 'i&#108;' + '&#116;o'; var path = 'hr' + 'ef' + '='; var addy7bc8dfc07f29b243ba022c7b1a4c22ee = 'j&#97;r&#105;.r&#97;&#117;h&#97;m&#97;k&#105;' + '&#64;'; addy7bc8dfc07f29b243ba022c7b1a4c22ee = addy7bc8dfc07f29b243ba022c7b1a4c22ee + 't&#117;t' + '&#46;' + 'f&#105;'; var addy_text7bc8dfc07f29b243ba022c7b1a4c22ee = 'J&#97;r&#105; R&#97;&#117;h&#97;m&auml;k&#105;';document.getElementById('cloak7bc8dfc07f29b243ba022c7b1a4c22ee').innerHTML += '<a ' + path + '\'' + prefix + ':' + addy7bc8dfc07f29b243ba022c7b1a4c22ee + '\'>'+addy_text7bc8dfc07f29b243ba022c7b1a4c22ee+'<\/a>'; or This email address is being protected from spambots. You need JavaScript enabled to view it. document.getElementById('cloak167617fc0b66022737f65c3ed26ad2c5').innerHTML = ''; var prefix = '&#109;a' + 'i&#108;' + '&#116;o'; var path = 'hr' + 'ef' + '='; var addy167617fc0b66022737f65c3ed26ad2c5 = 'v&#101;l&#105;-p&#101;kk&#97;.&#101;l&#111;r&#97;nt&#97;' + '&#64;'; addy167617fc0b66022737f65c3ed26ad