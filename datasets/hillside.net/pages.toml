description = "The Hillside Group hosts conferences related to design patterns. The PLoP series of conferences focuses on improving pattern writing through group discussions."
full_description = "The Hillside Group Sponsors many different conferences such as: PLoP, EuroPLoP, AsianPLoP, ScrumPLoP, VikingPLoP, SugarLoafPLoP, and ChiliPLoP. These conferences focus on writing groups to better improve patterns through group exposure. Each conference offers advanced topics for the more adept pattern writers. Participants have the opportunity to refine and extend their patterns with help from knowledgeable and sympathetic patterns enthusiasts. Pattern Languages of Programs (PLoP™) conference is a premier event for pattern authors and pattern enthusiasts to gather, discuss and learn more about patterns and software development... Learn More EuroPLoP™ is a conference that explores, develops and celebrates patterns in software. As with PLoP™ in the US, the main focus of EuroPLoP™ will be a series of writer's workshops where pattern authors work together to improve their patterns... Learn More GuruPLoPTM is hosted in India and is open to pattern authors, pattern users, and software designers and developers from around the world... Learn More AsianPLoPTM is hosted in Tokyo, Japan and is open to pattern authors, pattern users, and software designers and developers from around the world... Learn More SugarLoafPLoP brings together researchers and practitioners whose interests span a remarkably broad range of topics, who share an interest in exploring the power of the pattern form... Learn More VikingPLoP is a conference in the tradition of the PLoP conferences, held in different places in Scandinavia; that's what the Vikings did -- they were always moving to new territory... Learn More"
