["https://hillside.net/patterns/about-patterns"]
title = "About Design Patterns"
description = "The Hillside Group is a nonprofit corporation dedicated to improving human communication about computers by encouraging people to codify common programming and design practice. We sponsor conferences like PLoP, EuroPLoP, UP, ChiliPLoP, Mensore PLoP, KoalaPLoP and SugarLoafPLoP"
full_description = 'Christopher Alexander inspired Kent Beck and Ward Cunningham to write their first small pattern language in 1987 for designing user interfaces. In 1993, Kent Beck and Grady Booch sponsored a mountain retreat in Colorado which was the start of the nonprofit Hillside Group. The original vision of this group was to help uplift the software community through pattern writing. Toward this end, the Hillside Group started the Pattern Languages of Programming (PLoP) conference series; variations are now being held around the globe. PLoP conferences follow a highly collaborative style based on “shepherding” before submission and peer based feedback workshops during the conference. Many successful pattern papers and books have emerged from this process. In 1994, Erich Gamma and his colleagues known as the Gang of Four (GoF) published "Design Patterns: Elements of Reusable Object-Oriented Software" which launched the concept of patterns to a broader audience. It is interesting to note that in a discipline that is known to experience continual change, these principles are still useful and this book continues to sell more than 20 years after publication. This success of patterns within the software community led to a lot of early hype about patterns. As noted, patterns in software engineering draw inspiration from Christopher Alexander, who is recognized as an important building and urban planning architect (Salingaros, 2000). Alexander used patterns to document successful design practices in the architecture profession. His focus on proven solutions rather than new and unique ones was motivated by his observation that modern day buildings and towns do not approach the beauty of the historical past. He notes that the vast majority of architecture since the end of World War II has been dehumanizing, of poor quality, and lacking all sense of beauty and human feeling (O’Callaghan, 2001). This created his distaste for simply fashionable architecture and a preoccupation with the search for a design approach that generates beautiful structures (Grabow, 1983).'
author = "Administrator"
year_published = 2025
clearnet = "https://hillside.net/patterns/about-patterns"
