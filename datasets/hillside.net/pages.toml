title = "GuruPLoP"
description = "The Hillside Group is a nonprofit corporation dedicated to improving human communication about computers by encouraging people to codify common programming and design practice. We sponsor conferences like PLoP, EuroPLoP, UP, ChiliPLoP, Mensore PLoP, KoalaPLoP and SugarLoafPLoP"
full_description = "Software developers have long observed that certain themes recur and endure across different applications and systems. The emerging interest in patterns represents an effort to catalog and communicate these themes and motives to provide handbooks of proven solutions to common problems. GuruPLoP brings together researchers and practitioners whose interests span a remarkably broad range of topics, who share an interest in exploring the power of the pattern form. GuruPLoP invites you to add your expertise to the growing corpus of patterns. GuruPLoP focuses on improving the expression of patterns. You will have the opportunity to refine and extend your patterns with help from knowledgeable and sympathetic fellow patterns enthusiasts. Important Dates• December 16th: Paper submission deadline• December 18th: Start of shepherding• January 12th: Deadline for second draft• January 26th: Paper acceptance notification• February 21-23, 2014: Conference"
