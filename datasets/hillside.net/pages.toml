["https://hillside.net/index.php/component/content/article/51-design-patterns/145-pattern-languages-of-program-design-4"]
title = "The Hillside Group"
description = "The Hillside Group is a nonprofit corporation dedicated to improving human communication about computers by encouraging people to codify common programming and design practice. We sponsor conferences like PLoP, EuroPLoP, UP, ChiliPLoP, Mensore PLoP, KoalaPLoP and SugarLoafPLoP"
full_description = '''by Neil Harrison (Editor), Brian Foote (Editor), Hans Rohnert (Editor) Addison-Wesley Pub Co; ISBN: 0201433044 <MAP NAME="boxmap-p8"><AREA SHAPE="RECT" COORDS="14, 200, 103, 207" HREF="http://rcm.amazon.com/e/cm/privacy-policy.html?o=1" ><AREA COORDS="0,0,10000,10000" HREF="http://www.amazon.com/exec/obidos/redirect-home/thehilgro02-20" ></MAP><img src="http://rcm-images.amazon.com/images/G/01/rcm/120x240.gif" width="120" height="240" border="0" usemap="#boxmap-p8" alt="Shop at Amazon.com"> Arranged in 23 chapters, each containing multiple patterns, the text contains well over 100 software setups on a wide variety of topics. Standout sections here include a compilation of C++ idioms by James Coplien, which are derived from his well-known Advanced C++ Programming Styles and Idioms, a book that helped inspire early pattern-makers. A chapter on managing limited memory provides tips for working with embedded systems on today's handheld devices. Those with a background in engineering will also appreciate the catalog of patterns for finite state machines (FSMs). Designers have the tendency to make patterns out of what is familiar to most everyone. Several chapters look at patterns used on Web sites (for example, navigation bars) and in wiring together multimedia content. The book also groups management patterns, some of which can be used for improving customer relations and managing software development. The last section, surely the most entertaining, is devoted to software management and describes why most code, over time, devolves into a "Big Ball of Mud." There is certainly a lot to take away for any designer who reads this book. It is a particularly rich collection of recently "discovered" patterns that will get you thinking about reusable design in your own software. --Richard Dragan'''
