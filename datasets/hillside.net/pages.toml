["https://hillside.net/conferences/plop/ooplsa-2007-mini-plop"]
title = "OOPLSA 2007 Mini PLoP"
description = "The Hillside Group is a nonprofit corporation dedicated to improving human communication about computers by encouraging people to codify common programming and design practice. We sponsor conferences like PLoP, EuroPLoP, UP, ChiliPLoP, Mensore PLoP, KoalaPLoP and SugarLoafPLoP"
full_description = '''"Mini-PLoP at OOPSLA '07" Read the ACM/DL Article. If you don't have access to the ACM, you can read the article here. This workshop will bring together authors of papers in software development who wish to experience a writers’ workshop of collaborative peers. The goal of the workshop is to provide useful feedback for authors and to share insights into problems that are encountered over and over again in software development. There has been a recognition that the writers’ workshop process is beneficial for the production of high quality papers ever since the first patterns conference or PLoP was held in 1994. In this OOPSLA workshop, attendees will participate in a writers’ workshop of their paper as well as writers’ workshops for papers of other attendees in their group. Participants who do not have a paper to workshop are also invited. Everyone will be expected to read all the papers in their groups in advance. The organizers of this workshop were all involved in PLoP ’06 and would like to continue a close association between this important patterns activity and OOPSLA. Our hope is that the relationship will benefit both OOPSLA, by attracting authors of papers that are works-in-progress, and PLoP, by allowing authors who might not be able to attend PLoP to participate in the writers’ workshop process. The workshop organizers have been part of the planning and organizing process for numerous patterns conferences (PLoPs) over several years. The main activity at PLoPs is the writers’ workshop. After last year’s PLoP, which was held in conjuction with OOPSLA, there was increased interest in the writers’ workshop and a recognition that it is a beneficial process for the production of high quality papers. The organizers of this workshop proposal were all involved in PLoP ’06 and would like to continue a close association between this important patterns activity and OOPSLA. Workshop participants will submit a paper by September 1. Organizers will read the papers and judge if they are appropriate for the workshop and notify authors by September 14. Accepted papers will be posted on the workshop web site and assigned to a specific workshop group. Non-authors can submit a request to join a specific workshop group and will be accepted based on the completion of a template of information about each paper in the workshop group. Members of each group will be expected to read all the papers in that group before the workshop. All participants must read all papers in their group beforehand and must remain with the group throughout the day.'''
