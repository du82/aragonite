description = "See our guidance on conserving buildings, making historic places accessible for disabled people, dealing with flooding and surveying."
full_description = 'Home Advice & Grants Technical Guidance Share this page Share Print Technical Guidance Our technical guidance on looking after historic buildings and sites, including climate change adaptation, retrofit and energy efficiency advice; plus briefing on recording, and information and project management. Looking After Historic Buildings How to maintain and repair historic buildings, including advice on the types of materials and treatment methods to use. Building Regulations Guidance on complying with building regulations and where to look in the approved documents to find advice specific to historic buildings. Energy Efficiency and Retrofit in Historic Buildings A range of technical advice to support retrofit for increased energy efficiency in historic buildings. Building Services Engineering How to look after building services such as electrics, heating, plumbing and ventilation in historic buildings. Emergency Planning and Fire Advice Look for advice about fire safety and emergency planning in the heritage sector. Flooding Advice How to inspect, conserve and repair historic buildings after flooding, as well as ways to prevent flood damage in the first place. Looking After Parks, Gardens and Landscapes How to care for historic designed landscapes including public parks, trees, and lakes, and advice on wildlife, pests and diseases. Looking After Monuments and Sites Advice on managing earthwork and ruin sites including soft capping, ivy on walls, bracken and problem plants Improving Accessibility How to adapt historic buildings and landscapes to make them more accessible to people with disabilities. Looking After War Memorials Aimed at anyone who manages or cares for a war memorial or memorial garden, this page provides practical advice to help you. Peatlands Advice on the historical, archaeological and natural significance of peatlands. Archaeological Science See our advice and guidance on archaeological science. Recording Heritage How to survey historic places to the best standard possible, using our wide-ranging technical survey guidance. Information Management This section is aimed at those responsible for recording, curating and maintaining information about the historic environment. Project Management Our general approach to project management, with specialist advice, guidance and training. Share this page Share Print Also of interest Technical Conservation Guidance Brochure, Newsletter and Webinars Delivering on Climate Change Action and Heritage <div class="he-grid-row "> <div class="he-grid-col-lg-10 he-grid-col-xl-8 mx-auto"> <div class="back-to-top"> <a href="#header" class="back-to-top__link back-to-top-button"> <div class="back-to-top__container"> <div class="back-to-top__icon"></div> </div> <span class="back-to-top__text"> Back to top </span> </a> </div> </div> </div> Please update your browser Our website works best with the latest version of the browsers below, unfortunately your browser is not supported. Using an old browser means that some parts of our website might not work correctly. Chrome Update Chrome Safari Update Safari Firefox Update Firefox Microsoft Edge Update Microsoft Edge Close this message'
