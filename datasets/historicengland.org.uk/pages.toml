description = "How to look after building services such as electrics, heating, plumbing and ventilation in historic buildings."
full_description = 'Home Advice & Grants Technical Guidance Building Services Engineering Share this page Share Print Building Services Engineering This section is aimed at anyone looking to install building services such as electrics, heating, plumbing and ventilation. Technical Conservation newsletter You can keep up to date with the latest technical conservation news, webinars, publications and courses by signing up to our monthly newsletter. Sign up to the mailing list Installing New Services Introduction to the core principles when installing new building services in historic buildings or their grounds. Heating Historic Buildings What to consider when designing and installing heating in historic buildings Installing Heat Pumps in Historic Buildings Advice on installing air, ground and water source heat pumps in historic buildings. Installing Solar Panels Guidance on designing and installing solar power systems. Electrical Energy Storage Systems Advice on installing electrical energy storage systems and batteries in historic buildings Internal Lighting in Historic Buildings What to consider when refurbishing historic internal lighting or designing and installing a new layout. External Lighting of Historic Buildings Discover the issues to consider when designing and installing external lighting for a historic structure or building and its surroundings. Emergency Lighting It is now common practice to consider emergency lighting and exit signs for any building used or visited by the public. Lightning and Surge Protection Lightning and surge protection should be considered for all churches, and tall or prominent historic buildings. Fire Alarm and Detection Systems Advice on designing, installing and maintaining fire alarm systems for historic buildings Share this page Share Print Also of interest Where Light Falls Technical Conservation Guidance Brochure, Newsletter and Webinars <div class="he-grid-row "> <div class="he-grid-col-lg-10 he-grid-col-xl-8 mx-auto"> <div