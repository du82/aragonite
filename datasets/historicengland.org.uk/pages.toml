["https://historicengland.org.uk/about/jobs/apprenticeships"]
title = "Apprenticeships with Historic England - Offices in Swindon, London and more | Historic England"
description = "Our apprenticeships are open to everyone and offer you a paid learning opportunity across heritage and support roles."
full_description = '''Heritage Building Skills Programme Interactive Map Meet the apprentices and learn where they helped to conserve listed buildings. See where the apprentices are working. About this image Colleagues at Historic England's Swindon office. © Historic England Archive View image article DP189398 Home About Us Careers Apprenticeships Share this page Share Print Colleagues at Historic England's Swindon office. © Historic England Archive View image article DP189398 More in this Section Explore Career Areas What We Offer What to Expect When You Apply Everyone's Welcome Our Values and Behaviours Apprenticeships Apprentice Host Organisation Pinnacle Conservation Historic Environment Advice Assistant Former Listing and Casework Apprentice Stonemasonry Apprentice Archaeological Technician Apprentice Public Relations and Communications Apprentice Our External Advisers Architectural Investigators Geospatial Survey Team Apprenticeships at Historic England Updated 6 October 2023 We value apprenticeships at Historic England. That’s why, in partnership with a number of heritage organisations, we are leading on the development of new apprenticeship routes into the heritage sector. Contents Why do an apprenticeship at Historic England? Developing you Meet some of our apprentices Current Opportunities Why do an apprenticeship at Historic England? Our apprenticeships offer real work experience with off-the-job training, supported by our approved training providers. Leading to officially recognised qualifications, an apprenticeship at Historic England is a great way to earn while you learn.You will only ever need the minimum qualifications for the apprenticeship standard you’re applying to – usually GCSE English and Maths (level 4). All we then ask is that you share our enthusiasm for how heritage connects communities.We offer apprenticeships from level 2 to level 7. You will usually spend 80% of your time learning through your day-to-day role at our offices and 20% of your time attending college. Sometimes, your designated learning coach may visit you at work or online to support you virtually. Developing you We’ll give you all the learning and development you need to complete your apprenticeship and gain a recognised qualification. You’ll have a Line Manager and Mentor who'll support you on your journey with us. This could include time to complete off-the-job training, or giving you opportunities to use what you have learnt in your work.We have a suite of learning for our apprentices and lots of general skills training including:time managementfast effective reading coursesstrength-based developmenttransformation needsWhile we can’t guarantee a permanent role at the end of your apprenticeship, we do support you to apply for roles within Historic England and will encourage you to look for suitable positions. We will also support you with your ongoing career at the end of your apprenticeship through various employability skills training, regardless of whether you choose to stay with us. Meet some of our apprentices Hear all about life as an apprentice at Historic England. Meet Historic Environment Advice Assistant Sacha Langdale Smith Read Sacha's blog about finding the perfect place with Historic England. Find out about Sacha's apprenticeship <figure class="captioned-image"> <picture> <source srcset="/media/heklbv3u/sacha-langdale-smith.jpg?anchor=center&amp;mode=crop&amp;quality=90&amp;width=535&amp;height=500&amp;upscale=true&amp;rnd=133694114325800000" media="(min-width: 1000px)" /> <source srcset="/media/heklbv3u/sacha-langdale-smith.jpg?anchor=center&amp;mode=crop&amp;quality=90&amp;width=700&amp;height=500&amp;upscale=true&amp;rnd=133694114325800000" media="(min-width: 800px)" /> <source srcset="/media/heklbv3u/sacha-langdale-smith.jpg?anchor=center&amp;mode=crop&amp;quality=90&amp;width=505&amp;height=425&amp;upscale=true&amp;rnd=133694114325800000" media="(min-width: 500px)" /> <img alt="A profile photo of Historic Environment Advice Assistant Sacha Langdale Smith" src="/media/heklbv3u/sacha-langdale-smith.jpg?anchor=center&amp;mode=crop&amp;quality=90&amp;width=336&amp;height=250&amp;upscale=true&amp;rnd=133694114325800000" /> </picture> </figure> Meet Former Listing and Casework Apprentice, Josie Parry Read Josie's interview about the second half of her apprenticeship and her new role. Find out about Josie's apprenticeship <figure class="captioned-image"> <picture> <source srcset="/media/sn5lpdud/josie-parry-body-2.jpg?center=0.59337311973101647,0.69428945769433192&amp;mode=crop&amp;quality=90&amp;width=535&amp;height=500&amp;upscale=true&amp;rnd=133498701726730000" media="(min-width: 1000px)" /> <source srcset="/media/sn5lpdud/josie-parry-body-2.jpg?center=0.59337311973101647,0.69428945769433192&amp;mode=crop&amp;quality=90&amp;width=700&amp;height=500&amp;upscale=true&amp;rnd=133498701726730000" media="(min-width: 800px)" /> <source srcset="/media/sn5lpdud/josie-parry-body-2.jpg?center=0.59337311973101647,0.69428945769433192&amp;mode=crop&amp;quality=90&amp;width=505&amp;height=425&amp;upscale=true&amp;rnd=133498701726730000" media="(min-width: 500px)" /> <img alt="Apprentice Josie Parry smiles at the camera from a historic viewing gallery" src="/media/sn5lpdud/josie-parry-body-2.jpg?center=0.59337311973101647,0.69428945769433192&amp;mode=crop&amp;quality=90&amp;width=336&amp;height=250&amp;upscale=true&amp;rnd=133498701726730000" /> </picture> </figure> Meet Former Stonemasonry Apprentice, Matthew Tinsley Read Matthew's interview about his apprenticeship and experience. Find out about Matthew's apprenticeship <figure class="captioned-image"> <picture> <source srcset="/media/05la0ukn/matthew-tinsley-body-2.jpg?anchor=center&amp;mode=crop&amp;quality=90&amp;width=535&amp;height=500&amp;upscale=true&amp;rnd=133506580060470000" media="(min-width: 1000px)" /> <source srcset="/media/05la0ukn/matthew-tinsley-body-2.jpg?anchor=center&amp;mode=crop&amp;quality=90&amp;width=700&amp;heigh