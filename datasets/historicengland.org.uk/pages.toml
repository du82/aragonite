["https://historicengland.org.uk/about/who-we-are/commission"]
title = "The Historic England Commission | Historic England"
description = "The Commission is the governing board of the Historic Buildings and Monuments Commission for England and oversees the work of Historic England."
full_description = '''About this image Market Hall, The Square, Chipping Campden, Gloucestershire. Interior view showing arches. Home About Us Who We Are Commission Share this page Share Print Market Hall, The Square, Chipping Campden, Gloucestershire. Interior view showing arches. More in this Section Commission Executive Team Committees Young Advisers The Historic England Commission As the governing board of the Historic Buildings and Monuments Commission for England, the Commission has direct responsibility for the work of Historic England.The Commission also has overall responsibility for the National Heritage Collection, which is managed by the English Heritage Trust on its behalf.It comprises a maximum of 17 individuals, appointed by the Secretary of State for the Department for Digital, Culture, Media and Sport, for their skill or professional standing in one or more areas of expertise. Membership Name and role Name Lord Mendoza CBE Title and organisation Chairman Details Links and contact details Read Lord Mendoza's biography Name and role Name Nairita Chakraborty Details Links and contact details Read Nairita Chakraborty's biography Name and role Name Ben Derbyshire Details Links and contact details Read Ben Derbyshire's biography Name and role Name Sandra Dinneen OBE Details Links and contact details Read Sandra Dinneen's biography Name and role Name Paul Farmer Details Links and contact details Read Paul Farmer's biography Name and role Name Jane, Lady Gibson OBE Details Links and contact details Read Jane, Lady Gibson's biography Name and role Name Professor Helena Hamerow Details Links and contact details Read Professor Helena Hamerow's biography Name and role Name Dame Julie Kenny Details Links and contact details Read Dame Julie Kenny's biography Name and role Name Sir Jonathan Marsden Details Links and contact details Read Sir Jonathan Marsden's biography Name and role Name Patrick Newberry Details Links and contact details Read Patrick Newberry's biography Name and role Name Robert Sackville-West Details Links and contact details Read Robert Sackville-West's biography Name and role Name Susie Thornberry Details Links and contact details Read Susie Thornberry's biography Name and role Name Richard Upton Details Links and contact details Read Richard Upton's biography Name and role Name Sue Wilkinson Details Links and contact details Read Sue Wilkinson's biography Historic England is participating in a Boardroom Apprentice 12-month board placement programme sponsored by the Ministry of Housing, Communities & Local Government, which enables those who would like to serve on a public or charitable board to gain experience in a safe way before they take that step. Importantly, it enables a wider diversity of individuals to play their part in boardrooms.From 1 January 2025, April Stephenson will join the Historic England board as an observer. Name and role Name April Stephenson Title and organisation Observer Details Links and contact details Read April Stephenson's biography Commission meetings Historic England publishes the public minutes of its Commission meetings as soon as they are approved as a correct record.Please note that the Commission generally meets six times a year.If you would like copies of any meeting papers that are available to the public and which pre-date those available on this page, please contact us.Meeting dates2025: 27 February, 12 June, 9 October, 11 DecemberMinutes of past meetings Download Commission minutes - June 2024 onwards (PDF, 468.65 KB) Download Commission minutes - June 2023 to March 2024 (PDF, 918.17 KB) Download Commission Minutes - March 2022 to March 2023 (PDF, 568.95 KB) Download Commission Minutes - April 2020 to December 2021 (PDF, 877.86 KB) Download Commission Minutes - 2019 to February 2020 (PDF, 393.88 KB) Download Commission Minutes - 2018 (PDF, 191.33 KB) Download Commission Minutes - 2017 (PDF, 190.58 KB) Download Commission Minutes - 2016 (PDF, 256.45 KB) Download Commission Minutes - 2015 (PDF, 390.35 KB) Declarations of Interest Registers of Interest are maintained for the Commission, the Historic England Advisory Committee, the London Advisory Committee, and the Historic England Executive Team. They record any significant, ongoing interest a member may have and are reviewed by the Audit and Risk Assurance Committee twice yearly.If a member has an interest on a specific case to be discussed at a meeting this should be declared at the start of the meeting and recorded in the minutes. Download Commissioners 2025 Declarations of Interest (PDF, 106.21 KB) Download Guidance notes on declaring ongoing interests (PDF, 158.08 KB) Related documents Download Commission Terms of Reference (PDF, 28.48 KB) Download Appointments Policy (PDF, 41.69 KB) Share this page Share Print Governance Team Email [email protected] Next steps Find out what Historic England does See our Corporate Plan See our latest annual report Find out how we are funded Find out more about our relationship with the English Heritage Trust <div class="he-grid-row "> <div class="main-col"> <div class="back-to-top"> <a href="#header" class="back-to-top__link back-to-top-button"> <div class="back-to-top__container"> <div class="back-to-top__icon"></div> </div> <span class="back-to-top__text"> Back to top </span> </a> </div> </div> </div> Please update your browser Our website works best with the latest version of the browsers below, unfortunately your browser is not supported. Using an old browser means that some parts of our website might not work correctly. Chrome Update Chrome Safari Update Safari Firefox Update Firefox Microsoft Edge Update Microsoft Edge Close this message'''
