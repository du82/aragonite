["https://historicengland.org.uk/about/what-we-do"]
title = "What Historic England Does | Historic England"
description = "Learn about Historic England's role to protect England's historic environment, and how we go about it."
full_description = '''Home About Us What We Do Share this page Share Print What We Do We are the public body that helps people care for, enjoy and celebrate England's spectacular historic environment. We protect, champion and save the places that define who we are and where we've come from as a nation. We care passionately about the stories they tell, the ideas they represent and the people who live, work and play among them. Working with communities and specialists we share our passion, knowledge and skills to inspire interest, care and conservation, so everyone can keep enjoying and looking after the history that surrounds us all. Historic England’s Role We are the public body that helps people care for, enjoy and celebrate England's spectacular historic environment. Historic England Future Strategy Our Future Strategy to make our Vision for a heritage that is valued, celebrated and shared by everyone become a reality. Corporate Plan Our Corporate Plan provides a framework for our work as an organisation with a focus on six priority areas. Our Carbon Reduction Plan This plan sets out our baseline for reducing carbon emissions and our approach to achieving Net Zero by 2040. Annual Report and Accounts Read our latest Annual Report and Accounts. International Collaboration How Historic England collaborates with heritage professionals and responsible departments all around the world. The Rules We Follow The downloadable pdfs on this page explain how the Commission and its advisory committees operate. The English Heritage Trust Find out about the relationship between Historic England and the English Heritage Trust. Access to Information Here you can find out about our data protection policy and how you can access any of your information that we may hold. Consultations From time to time we invite feedback on draft versions of our strategic plans and formal advice and guidance, and respond to government consultations. Share this page Share Print <div class="he-grid-row "> <div class="he-grid-col-lg-10 he-grid-col-xl-8 mx-auto"> <div class="back-to-top"> <a href="#header" class="back-to-top__link back-to-top-button"> <div class="back-to-top__container"> <div class="back-to-top__icon"></div> </div> <span class="back-to-top__text"> Back to top </span> </a> </div> </div> </div> Please update your browser Our website works best with the latest version of the browsers below, unfortunately your browser is not supported. Using an old browser means that some parts of our website might not work correctly. Chrome Update Chrome Safari Update Safari Firefox Update Firefox Microsoft Edge Update Microsoft Edge Close this message'''
