["https://historicengland.org.uk/advice/planning/housing"]
title = "Advice on Housing Development in the Historic Environment | Historic England"
description = "This page provides information on housing development in the historic built environment."
full_description = '''Heritage Works for Housing Reusing and redeveloping our built heritage has the potential to help create dynamic, comforting and sustainable places to live. Heritage Works for Housing About this image Latchmere Road, Battersea, London. General view of terraced housing. © Historic England Home Advice & Grants Planning Housing Share this page Share Print Latchmere Road, Battersea, London. General view of terraced housing. © Historic England More in this Section Heritage Consents The Planning System Conservation Areas Housing Affordable Rural Housing Low Demand Housing Historic Suburbs Heritage Works for Housing Planning Research Place-Making and Regeneration Design in the Historic Environment Heritage and Sustainable Growth Infrastructure Local Management Local Plans and the Historic Environment Neighbourhood Planning Minerals Extraction Rural Planning Decision-Taking Understanding Historic Places Coastal & Marine Historic Town Centres and High Streets The Reconstruction of Heritage Assets World Heritage Contested Heritage Housing Updated 20 May 2024 This page provides information on housing development in the historic built environment. Contents England's historic housing New housing in historic areas Existing historic housing Managing change to your home Further guidance on types of housing <a title="Heritage Works for Housing" aria-label="Heritage Works for Housing" href="/advice/planning/housing/heritage-works-for-housing/"> <picture class="img-fluid"> <source srcset="/media/lgolfnqu/park_hill_felix_mooneeram_external_buildings_1117_071.jpg?center=0.56720377863999494,0.49998836199378571&amp;mode=crop&amp;quality=90&amp;width=650&amp;height=650&amp;upscale=false&amp;rnd=133602469959430000" media="(max-width: 750px)"> <source srcset="/media/lgolfnqu/park_hill_felix_mooneeram_external_buildings_1117_071.jpg?center=0.56720377863999494,0.49998836199378571&amp;mode=crop&amp;quality=90&amp;width=400&amp;height=400&amp;upscale=false&amp;rnd=133602469959430000"> <img src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Phase 1 of Park Hill showing ‘streets in the sky’ corridor and external view of refurbished building fa&#231;ade. The facade displays the original concrete framing and bold coloured panels next to the windows. "> </picture> </a> Heritage Works for Housing Reusing and redeveloping our built heritage has the potential to help create dynamic, comforting and sustainable places to live. Heritage Works for Housing England's historic housing Some 4.4 million houses, representing around 20 per cent of the total housing stock, were built before 1919.Some of these have been designated as listed buildings or lie within conservation areas and are therefore protected by certain planning control, but the majority of these buildings do not receive any form of legal protection. The same is true for the vast majority of houses built after 1919.The local distinctiveness, identity and sense of place that residential areas create is often valued by the local community, and should be carefully considered when decisions on future development are being made.Sometimes, it is only after development decisions have been taken that the heritage value or significance of particular housing is properly understood.Decisions on future development therefore need to be taken from a position of informed understanding so that significance and character are conserved and any new housing enhances its context. New housing in historic areas Over recent years, demand for new housing has outstripped supply in England. As a result, development pressure in many historic places has grown, creating new challenges in accommodating badly-needed new houses in sensitive locations.Historic England has explored many of the issues associated with the current housing market, including several approaches adopted by local authorities, house builders and local communities that have resulted in successful housing development in historic places.Both the National Planning Policy Framework and the associated Planning Practice Guidance govern the process within which local authorities have to plan for the development of new housing.Historic England has produced advice to help local planning authorities and other stakeholders to successfully implement the historic environment policy within the NPPF in respect of:Local plan makingDecision taking andAssessing the impact of development on the setting of heritage assetsHistoric England has also commissioned the following reports into the issues created by current housing trends and their effects on historic places. The Sustainable Growth of Cathedral Cities and Historic Towns (2014) The Sustainable Growth of Cathedral Cities and Historic Towns was commissioned to look at the implication of proposed development on cathedral cities and historic towns, some of our most precious places. Evaluating the Impact of Housing Development on the Historic Environment (2014) An evaluation of the impact of larger-scale housing developments on the historic environment. It provides a library of case studies from England. Increasing Residential Density in Historic Environments (2018) This study explores successfully delivering developments which increase residential density in historic environments. Design in the Historic Environment (2021) Principles and case studies for good practice in design when making changes to the built historic environment. Existing historic housing There are almost 10,000 conservation areas across England designated for their special architectural interest, many of which cover residential areas.We have produced advice covering best practice in managing and appraising conservation areas, how to guide change within them and explaining how they are designated. <picture> <source srcset="/media/10492/conservation-area-appraisal-designation-and-management.jpg?mode=max&amp;quality=90&amp;width=220&amp;height=311&amp;upscale=false&amp;rnd=131940141605370000"> <img class="publications__cover-image" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="This revised advice note supports the management of change in a way that conserves and enhances the character and appearance of historic areas." /> </picture> Conservation Area Appraisal, Designation and Management Published 8 February 2019 This revised advice note supports the management of change in a way that conserves and enhances the character and appearance of historic areas. Learn more Managing change to your home Historic England also provides a range of advice on managing Your Home if you live in a historic building, whether it is listed or not, in a conservation area or simply old.It offers advice on how best to maintain your home, what to consider if you want to make changes – including what permission and consent you might need – as well as how to make it more energy efficient.The National Heritage List for England can tell you if your home is listed. Further guidance on types of housing Historic England also provides detailed advice on:Affordable Rural HousingLow Demand HousingSuburbs Share this page Share Print Next steps Find out about our planning role Find out what Historic England does Also of interest Design in the Historic Environment Design Case Study: Roussillon Park Chichester, West Sussex Wildernesse House Mews, Sevenoaks Bourne Estate, Holborn, London Design Case Study: 168 Upper Street, Islington Temple Gardens, Temple Cloud Fairmile Hospital Garden Quarter, Caversfield Church Fields, Boston Spa Timekeepers Square, Salford Welsh Streets Liverpool 8 <div class="he-grid-row "> <div class="main-col"> <div class="back-to-top"> <a href="#header" class="back-to-top__link back-to-top-button"> <div class="back-to-top__container"> <div class="back-to-top__icon"></div> </div> <span class="back-to-top__text"> Back to top </span> </a> </div> </div> </div> Please update your browser Our website works best with the latest version of the browsers below, unfortunately your browser is not supported. Using an old browser means that some parts of our website might not work correctly. Chrome Update Chrome Safari Update Safari Firefox Update Firefox Microsoft Edge Update Microsoft Edge Close this message'''
