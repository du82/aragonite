["https://historicengland.org.uk/advice/planning/conservation-areas"]
title = "Designating and Managing a Conservation Area | Historic England"
description = "This page sets out what conservation areas are and how they are designated and managed."
full_description = '''About this image High Street, Badminton, Gloucestershire. General view of cottages with uniform limewash. © Historic England View photo DP035061 Home Advice & Grants Planning Conservation Areas Share this page Share Print High Street, Badminton, Gloucestershire. General view of cottages with uniform limewash. © Historic England View photo DP035061 More in this Section Heritage Consents The Planning System Conservation Areas Tips for Local Authorities Tips for Amenity Societies Housing Planning Research Place-Making and Regeneration Design in the Historic Environment Heritage and Sustainable Growth Infrastructure Local Management Local Plans and the Historic Environment Neighbourhood Planning Minerals Extraction Rural Planning Decision-Taking Understanding Historic Places Coastal & Marine Historic Town Centres and High Streets The Reconstruction of Heritage Assets World Heritage Contested Heritage Designating and Managing a Conservation Area This page sets out Historic England's advice to local planning authorities who are considering designating a new conservation area or creating management proposals for an existing conservation area.A good understanding of what makes them special, and active management once they are designated are key to their ongoing success.Conservation Areas can be created where a local planning authority identifies an area of special architectural or historic interest, which deserves careful management to protect that character.The first conservation areas were designated in 1967 under the Civic Amenities Act, and there are now nearly 10,000 in England.Most local authorities have a conservation area within their boundaries, and they are generally valued by those living and working in them as special places. There are many different types including:The centres of our historic villages, towns and citiesFishing and mining villages18th, 19th and 20th-century suburbsModel housing estates, including late 20th century housing projectsCountry houses set in their historic parksHistoric transport links and their environs, such as stretches of canal and railway and airfieldsIndustrial heritage sites <figure class="nested-image__image-wrapper"> <picture class="nested-image__picture"> <source srcset="/media/1367/brunswick-terrace-weymouth.jpg?mode=max&amp;quality=90&amp;width=980&amp;height=650&amp;upscale=false&amp;rnd=132213025907230000" media="(min-width: 750px)"> <source srcset="/media/1367/brunswick-terrace-weymouth.jpg?mode=max&amp;quality=90&amp;width=640&amp;height=450&amp;upscale=false&amp;rnd=132213025907230000"> <img class="nested-image__image" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Image of row of terraced houses with brightly coloured awnings with British flag bunting on display."> </picture> <figcaption class="nested-image__caption"> <div> <p class="nested-image__caption-text"> There are nearly 10,000 conservation areas across England. &copy; Historic England </p> </div> </figcaption> </figure> Conservation area designation An area has to be identified by the local authority as having a definite architectural quality or historic interest to merit designation (NPPF paragraph 197).Conservation areas are normally designated by the local planning authority.However, Historic England can designate conservation areas in London, following consultation with the Secretary of State for Digital, Culture, Media and Sport.The Secretary of State can also designate a conservation area anywhere in England in exceptional circumstances – usually where the area is of more than local interest.The local authority's roleDesignation: is the formal process of the council establishing the conservation area and requires the process to be properly followed otherwise the designation could be challenged. But is it only the starting point of the council’s role in managing the new heritage asset.Appraisal: Ideally prior to designation the local planning authority should carry out, or have carried out a Conservation Area Appraisal. This might additionally include a photographic survey of all buildings being included at the time of designation.Management Plan: Following on from designation, this is the key tool for fulfilling the council’s duties under the 1990 Planning (Listed Buildings and Conservation Areas) Act to review the conservation area and its boundaries and formulate and publish proposals for the preservation and enhancement of the area.Alerting and involving the community: All properties within a conservation area are required to have this recorded as a local Land Charge. Residents and businesses in a conservation area need to know they may need permission from the Council before making alterations such as cladding, inserting windows, installing satellite dishes and solar panels, adding conservatories or other extensions, laying paving or building walls.It is important to publicise to property owners the following points:Article 4 Directions: The Council can add to the types of alterations that need planning permission by making an Article 4 Directions, and this can be used to protect features particular to the area from being lost without the need of permission.Trees: Cutting down a tree or doing any pruning work requires notifying the Council six weeks in advance. This is to give the Council time to assess the contribution the tree makes to the character of the conservation area and if the works would damage this.Demolition or substantial demolition of a building within a conservation area will usually require planning permission from the Council. It is now a criminal offence to carry out demolition in a conservation area without planning permission. Further advice Historic England has produced more detailed advice on the appraisal, designation, and management of conservation areas. <picture> <source srcset="/media/10492/conservation-area-appraisal-designation-and-management.jpg?mode=max&amp;quality=90&amp;width=220&amp;height=311&amp;upscale=false&amp;rnd=131940141605370000"> <img class="publications__cover-image" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="This revised advice note supports the management of change in a way that conserves and enhances the character and appearance of historic areas." /> </picture> Conservation Area Appraisal, Designation and Management Published 8 February 2019 This revised advice note supports the management of change in a way that conserves and enhances the character and appearance of historic areas. Learn more Research on 20th-century conservation areas Twentieth-century heritage is often under-valued and vulnerable. Historic England commissioned research from the Twentieth Century Society which explored existing and potential conservation area designation for 20th-century structures and landscapes. The main project report is available here: Download Potential Conservation Areas Scoping Report (PDF, 309.28 KB) Download Appendix 5.1 Existing C20 Conservation Areas: notes (PDF, 78.24 KB) Download C20 Conservation Areas Report: Appendix 5-2 Existing C20 Conservation Areas (XLSX, 100.34 KB) Research on the value of conservation areas Research by the London School of Economics has found that people value living in conservation areas. This is evidenced by properties in conservation areas having higher prices and greater price appreciation, even after adjusting for location and other factors that affect prices.For more information on this research see: Value of Conservation Areas Share this page Share Print Next steps See Your Home for advice aimed at those who live or work in a conservation area Look at our conservation area top tips for Local Authorities and Amenity Societies Find out about our planning role Find out what Historic England does Also of interest Conservation Areas at Risk 2017 – 50 Years of Conservation Areas Community Advice Hub <div class="he-grid-row "> <div class="main-col"> <div class="back-to-top"> <a href="#header" class="back-to-top__link back-to-top-button"> <div class="back-to-top__container"> <div class="back-to-top__icon"></div> </div> <span class="back-to-top__text"> Back to top </span> </a> </div> </div> </div> Please update your browser Our website works best with the latest version of the browsers below, unfortunately your browser is not supported. Using an old browser means that some parts of our website might not work correctly. Chrome Update Chrome Safari Update Safari Firefox Update Firefox Microsoft Edge Update Microsoft Edge Close this message'''
