["https://historicengland.org.uk/about/what-we-do/strategy"]
title = "Historic England Future Strategy | Historic England"
description = "Our Future Strategy to make our Vision for a heritage that is valued, celebrated and shared by everyone become a reality."
full_description = '''About this image Windmill Tump Long Barrow, Gloucestershire. © Historic England Archive. View image record DP236480 Home About Us What We Do Future Strategy Share this page Share Print Windmill Tump Long Barrow, Gloucestershire. © Historic England Archive. View image record DP236480 More in this Section Our Role Future Strategy Active Participation Corporate Plan Our Carbon Reduction Plan Annual Report & Accounts International Collaboration The Rules We Follow Historic England and the English Heritage Trust Access to Information Consultations Historic England Future Strategy Championing Heritage - Improving LivesOur Vision at Historic England is for a heritage that is valued, celebrated and shared by everyone. Our Future Strategy, which started in 2021, is about how we will make that Vision a reality. <picture> <source srcset="/media/15910/future-strategy.jpg?mode=max&amp;quality=90&amp;width=220&amp;height=311&amp;upscale=false&amp;rnd=132640080926330000"> <img class="publications__cover-image" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Strategy to achieve our Vision for heritage that is valued, celebrated and shared by everyone." /> </picture> Historic England Future Strategy 2021 Published 10 May 2021 Strategy to achieve our Vision for heritage that is valued, celebrated and shared by everyone. Learn more <img class="youtube-video__cookies-revoked-placeholder-image" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" srcset="/media/15726/thumbnail.jpg?anchor=center&amp;mode=crop&amp;quality=90&amp;width=220&amp;height=125&amp;upscale=true&amp;rnd=132612506859870000 220w" sizes="(max-width: 1000px) 100vw, 855px" alt=""/> Video not working due to cookies settings Enable YouTube cookies or click here to watch on YouTube <picture> <source type="image/webp" srcset="https://img.youtube.com/vi_webp/Lz7RRXeIlY4/mqdefault.webp 320w, https://img.youtube.com/vi_webp/Lz7RRXeIlY4/maxresdefault.webp 1280w" sizes="(min-width: 376px) 100vw, 320px"> <source srcset="https://img.youtube.com/vi/Lz7RRXeIlY4/mqdefault.jpg 320w, https://img.youtube.com/vi/Lz7RRXeIlY4/maxresdefault.jpg 1280w" sizes="(min-width: 376px) 100vw, 320px"> <img src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Video placeholder"> </picture> Our Purpose To improve people’s lives by championing and protecting the historic environment. Our Vision A heritage that is valued, celebrated and shared by everyone. A historic environment that people connect with and learn from and that we are proud to pass on to future generations. <figure class="nested-image__image-wrapper"> <picture class="nested-image__picture"> <source srcset="/media/15909/dp248880.jpg?mode=max&amp;quality=90&amp;width=980&amp;height=650&amp;upscale=false&amp;rnd=132639952023430000" media="(min-width: 750px)"> <source srcset="/media/15909/dp248880.jpg?mode=max&amp;quality=90&amp;width=640&amp;height=450&amp;upscale=false&amp;rnd=132639952023430000"> <img class="nested-image__image" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Lighthouse situated on a beach"> </picture> <figcaption class="nested-image__caption"> <div> <p class="nested-image__caption-text"> Dovercourt Lighthouse, Harwich, Essex &copy; Historic England DP248880 </p> </div> </figcaption> </figure> Our Values Passion We share our love of the historic environment to inspire and energise people Learning We listen and learn, and pass on this knowledge to others Collaboration We work with partners and we work together to achieve great things Openness We communicate in a way that’s understandable, available and useful to everyone Responsibility We are accountable to the public and we always act with integrity <figure class="nested-image__image-wrapper"> <picture class="nested-image__picture"> <source srcset="/media/15906/dp247448.jpg?mode=max&amp;quality=90&amp;width=980&amp;height=650&amp;upscale=false&amp;rnd=132639953543030000" media="(min-width: 750px)"> <source srcset="/media/15906/dp247448.jpg?mode=max&amp;quality=90&amp;width=640&amp;height=450&amp;upscale=false&amp;rnd=132639953543030000"> <img class="nested-image__image" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Woman pushing a wheelchair in front of a large multistory block of flats with yellow fascia"> </picture> <figcaption class="nested-image__caption"> <div> <p class="nested-image__caption-text"> Great Arthur House on Golden Lane Estate, Barbican, City of London &copy; Historic England DP247448 </p> </div> </figcaption> </figure> Our three Areas of Focus Thriving places Collaborating with people and partners to secure vibrant and sustainable futures for historic places. Connected communities Bringing communities together by discovering and celebrating local heritage, and by protecting the character of historic places. Active participation Inspiring and equipping people to take action in support of the places they care about. <figure class="nested-image__image-wrapper"> <picture class="nested-image__picture"> <source srcset="/media/15907/aa038929.jpg?mode=max&amp;quality=90&amp;width=980&amp;height=650&amp;upscale=false&amp;rnd=132640077752600000" media="(min-width: 750px)"> <source srcset="/media/15907/aa038929.jpg?mode=max&amp;quality=90&amp;width=640&amp;height=450&amp;upscale=false&amp;rnd=132640077752600000"> <img class="nested-image__image" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Interior of synagogue with wooden pews"> </picture> <figcaption class="nested-image__caption"> <div> <p class="nested-image__caption-text"> Bradford Reform Synagogue &copy; Historic England AA038929 </p> </div> </figcaption> </figure> Logic model How our work will deliver real-world change to make a difference to people's lives. Download Logic Model 2021-22 (PDF, 506.49 KB) Download Logic Model 2021-22 - print version (PDF, 152.48 KB) Share this page Share Print Also of interest Corporate Plan What We Do <div class="he-grid-row "> <div class="main-col"> <div class="back-to-top"> <a href="#header" class="back-to-top__link back-to-top-button"> <div class="back-to-top__container"> <div class="back-to-top__icon"></div> </div> <span class="back-to-top__text"> Back to top </span> </a> </div> </div> </div> Please update your browser Our website works best with the latest version of the browsers below, unfortunately your browser is not supported. Using an old browser means that some parts of our website might not work correctly. Chrome Update Chrome Safari Update Safari Firefox Update Firefox Microsoft Edge Update Microsoft Edge Close this message'''
