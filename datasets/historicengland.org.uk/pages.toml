title = "Our Climate Change Strategy | Historic England"
description = "A strategy for Historic England’s response to the climate, energy and biodiversity crisis."
full_description = 'About this image Dovercourt Lighthouse, Harwich, Essex added to the Heritage at Risk Register. © Historic England Archive View image record DP248862 Home Advice & Grants Climate Change Our Strategy Share this page Share Print Dovercourt Lighthouse, Harwich, Essex added to the Heritage at Risk Register. © Historic England Archive View image record DP248862 More in this Section Our Strategy Delivering Net Zero Local Data Demand for Retrofitting Skills Risks and Hazards Responses to Climate Change Nature Recovery and Heritage Heat Pumps and Solar Panels Can Work for Older Buildings Our Climate Change Strategy Published 23 March 2022 A strategy for Historic England’s response to the climate, energy and biodiversity crisis.IntroductionThe role of heritageVisionStrand 1 MitigationStrand 2 Managing risksStrand 3 AdaptationGlossaryNext StepsDownload strategy in PDF format The scale of the climate change challenge can feel overwhelming, but our heritage is part of the solution, and will inspire practical solutions for a more sustainable way of life, today and tomorrow. Duncan Wilson, Chief Executive Historic England Introduction This strategy describes Historic England’s response to the climate crisis. It includes our Vision and Aims, what we are doing as an organisation and how we will prioritise our work. It also explains how we will work in partnership, and support and empower people outside Historic England to combat climate change.It is written primarily for our people at Historic England, for our colleagues across the heritage sector, and for key stakeholders including the government.Climate change is one of the most challenging issues of our time, with potential negative consequences for both people and heritage. It is both an immediate challenge and a long-term one. Historic England strongly supports urgent climate action and, crucially, believes that heritage is part of the solution. This goes to the very heart of our purpose: to champion and protect the historic environment, because we recognise the power of heritage to improve lives. <figure class="nested-image__image-wrapper"> <picture class="nested-image__picture"> <source srcset="/media/ayzp33po/waves_on_quay_web.jpg?mode=max&amp;quality=90&amp;width=980&amp;height=650&amp;upscale=false&amp;rnd=132920932117000000" media="(min-width: 750px)"> <source srcset="/media/ayzp33po/waves_on_quay_web.jpg?mode=max&amp;quality=90&amp;width=640&amp;height=450&amp;upscale=false&amp;rnd=132920932117000000"> <img class="nested-image__image" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Waves crashing over a stone quay during a storm."> </picture> <figcaption class="nested-image__caption"> <div> <p class="nested-image__caption-text"> Severe weather events are happening more frequently. &copy; Historic England </p> </div> </figcaption> </figure> The role of heritage Historic England has been studying, collaborating with partners, and raising awareness of the impact of climate change on our heritage and historic environment for decades. We already know:Reusing our buildings is one of the most effective ways to reduce carbon emissions and eliminate unnecessary waste. By adapting our historic buildings appropriately, we can reduce carbon emissions, improve quality of life and nurture the skills needed for a green economy.Our rich and unique heritage provides an invaluable source of practical information about how we are already responding to a changing climate, including low carbon living. We can use this knowledge to understand the challenges and opportunities of living more sustainably.We must continue to work in partnership, both inside and outside the heritage sector, to find solutions. Our heritage is looked after by a wide variety of individuals, communities, owners and organisations; we need to equip people with the information and support they need to respond to the climate crisis.Our climate is already changing. Projections can be used to estimate where and when hazards driven by climate change will threaten vulnerable heritage. We need to prepare to experience some loss of heritage. The climate, energy and biodiversity crisis will affect every aspect of Historic England’s work. Our work in this area is complex, multi-faceted and evolving; it will continue to adapt and respond as we learn more. <figure class="nested-image__image-wrapper"> <picture class="nested-image__picture"> <source srcset="/media/z2blrkeu/specialist-repair_dp248594_web.jpg?mode=max&amp;quality=90&amp;width=980&amp;height=650&amp;upscale=false&amp;rnd=132920945399570000" media="(min-width: 750px)"> <source srcset="/media/z2blrkeu/specialist-repair_dp248594_web.jpg?mode=max&amp;quality=90&amp;width=640&amp;height=450&amp;upscale=false&amp;rnd=132920945399570000"> <img class="nested-image__image" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="A woman in a hi-vis vest and safety helmet repointing a historic structure."> </picture> <figcaption class="nested-image__caption"> <div> <p class="nested-image__caption-text"> Heritage properties require specialist care to adapt to increasingly severe weather events. &copy; Historic England </p> </div> </figcaption> </figure> Vision By 2040, our heritage will have played an important role in the global fight to limit climate change and its impact on people and places. We will have enabled people to live more sustainably and adapt to a changing climate, while conserving our irreplaceable heritage for future generations. This means that by 2040:Historic buildings, places and landscapes will have led the way to our low-carbon future, sustaining new jobs and extending our country’s global influence.The cherished character and distinctiveness of local places will be protected, continuing to add to quality of life and to attract investmentand visitors.Places will become ever more resilient as people learn to adapt to a changing climate.Our obligation to pass on our cultural inheritance to future generations willbe respected. <figure class="nested-image__image-wrapper"> <picture class="nested-image__picture"> <source srcset="/media/r4rjj4q4/linton-falls_dp143650_crop_web.jpg?mode=max&amp;quality=90&amp;width=980&amp;height=650&amp;upscale=false&amp;rnd=132924299409770000" media="(min-width: 750px)"> <source srcset="/media/r4rjj4q4/linton-falls_dp143650_crop_web.jpg?mode=max&amp;quality=90&amp;width=640&amp;height=450&amp;upscale=false&amp;rnd=132924299409770000"> <img class="nested-image__image" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="A historic hydroelectric plant building with new machinery added."> </picture> <figcaption class="nested-image__caption"> <div> <p class="nested-image__caption-text"> Linton Falls is a scheduled monument that has found an economic future by reverting to its original use as a hydro-electric power station. &copy; Historic England </p> </div> </figcaption> </figure> There are three strands that guide our climate change programme, nowand in the future:MitigationManaging riskAdaptation Strand 1 Mitigation: achieving net zero Strand 1 AimWe will proactively remove sources of emissions to achieve net zero for Historic England by 2040.The government has committed to reduce the UK’s carbon emissions to net zero by 2050. Removing carbon emissions and sustaining our heritage are compatible goals.We will lead by example and support other heritage organisations on their journey towards net zero. We will help others to understand how heritage and the historic environment can be part of the solution.We will climate-proof our policies, advice, guidance, and operations to play our part in delivering the government’s Net Zero Strategy, while making sure our heritage continues to be protected and cherished. Strand 1 Actions 1.1 Publish our baseline carbon footprint and a reduction plan In 2022 we published our baseline carbon footprint and a reduction plan that shows how we will achieve net zero by 2040, including a clear trajectory and milestones. The plan will outline what we will do to accurately identify and record our carbon emissions and to remove them from our operations. We will establish annual carbon reduction targets and report our progress against them each year from 2023 onwards. 1.2 Focus on the skills gap in construction for retrofitting In 2022, we will focus on the skills gap in construction, which must be addressed so our historic buildings can be retrofitted appropriately. We will work with others to quantify the skills gap and how to address it. 1.3 Share our experience of reducing our emissions with other heritage organisations We will share our experience of reducing our emissions with heritage organisations that need support to reduce their own emissions. By 2023, we will learn what heritage organisations need to respond to climate change, so that we can tailor our help accordingly. 1.4 Develop guidance and training on retrofitting historic buildings By 2024, we will develop accessible, tailored and practical guidance, training and support for those retrofitting historic buildings. 1.5 Invest in research By investing in high quality research, often in partnership with others, we will continue to find practical ways in which reusing historic buildings can play an essential part in achieving the government’s Net Zero Strategy targets.We will use this evidence to help influence policies and programmes designed to reduce carbon in the built environment. 1.6 Share knowledge on carbon reduction and biodiversity We will continue to share our knowledge of heritage and the historic environment to help inform carbon reduction and sequestration, and support biodiversity. <figure class="nested-image__image-wrapper"> <picture class="nested-image__picture"> <source srcset="/media/1oopfnma/volunteers-dp248591.jpg?mode=max&amp;quality=90&amp;width=980&amp;height=650&amp;upscale=false&amp;rnd=132920957225830000" media="(min-width: 750px)"> <source srcset="/media/1oopfnma/volunteers-dp248591.jpg?mode=max&amp;quality=90&amp;width=640&amp;height=450&amp;upscale=false&amp;rnd=132920957225830000"> <img class="nested-image__image" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="A group of volunteers gathered in front of a historic building."> </picture> <figcaption class="nested-image__caption"> <div> <p class="nested-image__caption-text"> Volunteer groups are critical to help care for, maintain and protect places important to local communities. </p> </div> </figcaption> </figure> Strand 2 Managing risks: understanding the threats of climate change Aim of Strand 2We will identify, understand, and respond to threats to heritage from a changing climate. We will share our insights: listening, learning, and collaborating with partners to effect, enable and catalyse change and risk management. The climate crisis requires us to think differently and act creatively, both in terms of how we look after our heritage and manage our operations. We will not meet our emission targets and sustain our heritage without changing our approach. Ian Morrison, Director of Policy and Evidence Historic England Strand 2 Actions 2.1 Work with climate scientists on implications for heritage of future climate projections We will continue to work with climate science specialists in government, universities and private practice to increase people’s understanding of, and access to, future climate projections and their implications for heritage. 2.2 Develop ways to quantify and monitor climate-related risks From 2022, we will develop ways to quantify and monitor climate-related risks. We will make sure the risks to heritage are fully incorporated into the fourth UK Climate Change Risk Assessment report. 2.3 Map climate-related hazards Working with partners, we will map climate-related hazards and share our findings to identify which aspects of our heritage are most vulnerable to a changing climate. 2.4 Evaluate affects of human responses to climate change on heritage We will monitor and evaluate human responses to climate change and how they are affecting heritage. <figure class="nested-image__image-wrapper"> <picture class="nested-image__picture"> <source srcset="/media/xatpord5/flooding-in-york_28341_016_lvls.jpg?mode=max&amp;quality=90&amp;width=980&amp;height=650&amp;upscale=false&amp;rnd=133754447067870000" media="(min-width: 750px)"> <source srcset="/media/xatpord5/flooding-in-york_28341_016_lvls.jpg?mode=max&amp;quality=90&amp;width=640&amp;height=450&amp;upscale=false&amp;rnd=133754447067870000"> <img class="nested-image__image" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="A historic city centre affected by a flooded river."> </picture> <figcaption class="nested-image__caption"> <div> <p class="nested-image__caption-text"> Flooding in York City Centre, 2012. &copy; Historic England </p> </div> </figcaption> </figure> Strand 3 Adaptation: preparing for a changing climate Strand 3 AimAs we improve our knowledge of climate projections and their implications for heritage, we will engage and equip people to take action in support of the places they care about. We will develop, innovate and adopt good practice – including emergent areas of work – responding to new insights, technical developments and changes as our work progresses.We will gather evidence to show how our historic environment can contribute to the resilience of places and communities, and how people can adapt to climate change. Stand 3 Actions 3.1 Embed climate adaptation thinking into our operations We will embed climate adaptation thinking into our operations. In all our future business decisions, we will remain mindful of future climate scenarios and their impacts. 3.2 Publish a consultation draft of a Historic England Advice Note on climate change In 2022, we will publish a consultation draft of a Historic England Advice Note (HEAN) on climate change. This will provide a framework for responding to climate change while sustaining our heritage. 3.3 Review and update Adaptation Report In early 2022, we will review our existing Adaptation Report (submitted to Defra in 2016) and prepare and submit an updated Adaptation Reporting Power Report to the government. 3.4 Develop new adaptive approaches for heritage assets We will continue to identify ways to adapt heritage to future climate threats, develop new adaptive approaches, and assess their effectiveness for different heritage assets. We will provide annual summaries of these approaches from 2023 onwards. 3.5 Develop a toolkit for coping with unavoidable loss of heritage By 2025, we and others will develop a toolkit that equips those who care for our heritage to plan for and manage decisions where some loss of, or transformative change to, heritage assets is unavoidable. 3.6 Contribute to the third National Adaptation Programme We will contribute to the third National Adaptation Programme (NAP) and gather evidence on how heritage can help society a'
