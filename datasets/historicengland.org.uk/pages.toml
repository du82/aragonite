title = "The Planning System | Historic England"
description = "This page sets out how the planning system works to protect historic places."
full_description = '''About this image Hereford Cathedral, Hereford. General view of cathedral. © Historic England Home Advice & Grants Planning The Planning System Share this page Share Print Hereford Cathedral, Hereford. General view of cathedral. © Historic England More in this Section Heritage Consents The Planning System Planning Bulletin Contested Heritage Listed Building Decisions Conservation Areas Housing Planning Research Place-Making and Regeneration Design in the Historic Environment Heritage and Sustainable Growth Infrastructure Local Management Local Plans and the Historic Environment Neighbourhood Planning Minerals Extraction Rural Planning Decision-Taking Understanding Historic Places Coastal & Marine Historic Town Centres and High Streets The Reconstruction of Heritage Assets World Heritage Contested Heritage The Planning System Updated 23 July 2024 This page sets out how the planning system works to protect the historic environment. It is through the planning system that most changes to buildings and land in England are managed. It guides decisions on proposed changes to the historic environment, including those which are protected by listing. On this page Aims The planning system Planning legislation Decision-making National planning policy National planning guidance Historic England published planning advice Aims The purpose of the planning system is to contribute to the achievement of sustainable development, including the provision of homes, commercial development, and supporting infrastructure in a sustainable manner. Within this, the planning system has three overarching, interdependent objectives outlined in the National Planning Policy Framework (NPPF) including:EconomicSocialEnvironmentalWhilst heritage comes within the environmental objective, it has an important part to play in delivering all three sustainable development objectives.The government's policy for managing change to the historic environment through the planning system is to conserve heritage assets in a manner appropriate to their significance, so that they can be enjoyed for their contribution to the quality of life of existing and future generations. The planning system The planning system includes both local and national elements.Local planning authorities must make a Local Plan, setting out policies for making planning decisions in their area and allocating land for development. Local Plans must be consistent with planning law and national policy and guidance. A Neighbourhood Plan can sit alongside the Local Plan, and can be prepared by a parish or town council, a neighbourhood forum, or a community organisation.The national elements of the planning system are illustrated in this diagram, and include legislation, national planning policy and practice guidance, and advice. These are explained in more detail below. <figure class="nested-image__image-wrapper"> <picture class="nested-image__picture"> <source srcset="/media/12517/national-planning-system-hierarchy-crop.jpg?mode=max&amp;quality=90&amp;width=980&amp;height=650&amp;upscale=false&amp;rnd=132213027085570000" media="(min-width: 750px)"> <source srcset="/media/12517/national-planning-system-hierarchy-crop.jpg?mode=max&amp;quality=90&amp;width=640&amp;height=450&amp;upscale=false&amp;rnd=132213027085570000"> <img class="nested-image__image" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Legislation - Government; Policy (NPPF) - Government; PPG - Government; GPAs - Sector (inc. Historic England); HEAN - Historic England"> </picture> <figcaption class="nested-image__caption"> <div> <p class="nested-image__caption-text"> The national elements of the planning system (broadly speaking, the level of detail of the different elements increases as you move down the diagram, but the weight to be applied to them decreases). </p> </div> </figcaption> </figure> Planning legislation Planning legislation sets out how Local Plans should be made and how planning decisions should be taken.‘Development’, a term defined by the Town and Country Planning Act 1990, requires planning permission. Listed buildings and scheduled monuments have their own consent processes (which can be in addition to planning permission or required in some situations where planning permission is not).The key pieces of legislation covering designated heritage assets, specifically, include:Listed Buildings and Conservation Areas in the Planning (Listed Buildings and Conservation Areas) Act 1990Scheduled monuments in the Ancient Monuments and Archaeological Areas Act 1979Registered Parks and Gardens and Registered Battlefields in the Historic Buildings and Ancient Monuments Act 1953Protected Wreck Sites in the Protection of Wrecks Act 1973.Broader planning and related legislation also significantly influence the historic environment. For example, the Enterprise and Regulatory Reform Act 2013 introduced new heritage planning mechanisms such as Listed Building Consent Orders, Local Listed Building Consent Orders and Listed Building Heritage Partnership Agreements.England’s planning system is currently undergoing a period of significant reform, including through the Levelling-up and Regeneration Act 2023 (although not all provisions in the Act have come into force yet). Decision-making Based on legislation, local planning authorities are usually responsible for deciding applications for planning permission and listed building consent, though the Secretary of State for Levelling Up, Housing and Communities (DLUHC) may at times themselves determine applications. Scheduled Monument consent, however, is decided by the Secretary of State for Culture, Media, and Sport (DCMS), with applications made to Historic England. National planning policy The National Planning Policy Framework (NPPF) sets out the government's planning policies, and how they are expected to be applied. It has been revised several times since its initial publication in 2012, with the most recent being December 2023.The NPPF has a section on the historic environment (Chapter 16 ‘Conserving and enhancing the historic environment’), though references to the historic environment are picked up throughout the document. The implementation of policy contained in Chapter 16 is discussed further in several of the advice notes listed below. National planning guidance The Government's Planning Practice Guidance (PPG) gives further information on how national policy is to be interpreted and applied locally. The PPG is available - together with a link to the NPPF - on the Planning Practice Guidance website. The PPG includes specific guidance on matters relating to the historic environment. Historic England published planning advice Our written advice is available to support owners, developers, and local planning authorities when considering proposed changes to heritage assets.Historic England's published planning advice comes in two forms:Good Practice Advice notes (GPAs) - provide supporting information on good practice, particularly looking at the principles of how national policy and guidance can be applied.Historic England Advice Notes (HEANs) - include detailed, practical advice on how to implement national planning policy and guidance.We are currently reviewing our advice considering ongoing planning reforms and will amend it, where necessary, in due course.Good Practice Advice (GPAs)The GPAs address plan-making and decision-taking, and other issues which are important in managing change affecting heritage assets. GPAs are the result of collaborative working with the heritage and property sectors in the Historic Environment Forum and have been prepared following public consultation.GPA1 - Local Plan MakingGPA2 - Managing Significance in Decision-Taking in the HistoricEnvironmentGPA3 - Setting and ViewsGPA4 - Enabling Development and Heritage AssetsHistoric England Advice Notes (HEANs)These are advice notes covering various planning topics in more detail and at a more practical level. They have been prepared by Historic England following public consultation.Historic England Advice Note 1 - Conservation Areas Appraisal, Designation and ManagementHistoric England Advice Note 2 - Making Changes to Heritage AssetsHistoric England Advice Note 3 - The Historic Environment and Site Allocations in Local PlansHistoric England Advice Note 4 - Tall BuildingsHistoric England Advice Note 5 - Setting up a Listed Building Heritage Partnership AgreementHistoric England Advice Note 6 - Drawing up a Local Listed Building Consent OrderHistoric England Advice Note 7 - Local Heritage ListingHistoric England Advice Note 8 - Sustainability Appraisal and Strategic Environmental AssessmentHistoric England Advice Note 9 - The Adaptive Reuse of Traditional Farm BuildingsHistoric England Advice Note 10 - Listed Buildings and Curtilage Historic England Advice Note 11 - Neighbourhood Planning and the Historic EnvironmentHistoric England Advice Note 12 - Statements of Heritage SignificanceHistoric England Advice Note 13 - Mineral Extraction and ArchaeologyHistoric England Advice Note 14 - Energy Efficiency and Traditional Homes is archived and superseded by Historic England Advice Note 18Historic England Advice Note 15 - Commercial Renewable Energy Development and the Historic EnvironmentHistoric England Advice Note 16 - Listed Building ConsentHistoric England Advice Note 17 - Planning and ArchaeologyHistoric England Advice Note 18 - Adapting Historic Buildings for Energy and Carbon EfficiencyHistoric England also produces advice on other topics such as designated heritage assets, archaeological matters, and technical conservation matters which may also impact on planning matters, but which do not primarily address planning in the historic environment.Other relevant advice published by Historic England includes:Managing Local Authority Heritage AssetsSustainable Growth for Historic PlacesConservation Principles, Policies and GuidanceThe Historic England Planning Bulletin is produced monthly, and highlights some of the recent and forthcoming developments in the world of planning from a heritage perspective. Share this page Share Print Policy Development Team Email [email protected] Address 4th Floor, Cannon Bridge House,25 Dowgate Hill,London,EC4R 2YA View on Map Related publications Building the Future, Transforming our Past Celebrating development-led archaeology in England, 1990-2015 Published 23 November 2015 Related documents Download The Heritage Dimension of Planning Applications PDF, 497 KB Next steps Find out what Historic England does Find out about our planning role Find out more about decision-taking in the historic environment Also of interest What is Listing? Training & Skills Development Opportunities Technical Guidance Planning Research <div class="he-grid-row "> <div class="main-col"> <div class="back-to-top"> <a href="#header" class="back-to-top__link back-to-top-button"> <div class="back-to-top__container"> <div class="back-to-top__icon"></div> </div> <span class="back-to-top__text"> Back to top </span> </a> </div> </div> </div> Please update your browser Our website works best with the latest version of the browsers below, unfortunately your browser is not supported. Using an old browser means that some parts of our website might not work correctly. Chrome Update Chrome Safari Update Safari Firefox Update Firefox Microsoft Edge Update Microsoft Edge Close this message'''
