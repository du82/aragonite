full_description = '''The National Heritage List for England Search the National Heritage List for England to find listed buildings, battlefields, monuments, parks, gardens, shipwrecks and more. Search the List What is Listing? <picture> <source srcset="/media/7036/schlumberger-cambridge-twilight.jpg?center=0.5880440494863064,0.49747828017417889&amp;mode=crop&amp;quality=90&amp;width=1940&amp;height=680&amp;upscale=true&amp;rnd=133825318608630000" media="(min-width: 1461px)"> <source srcset="/media/7036/schlumberger-cambridge-twilight.jpg?center=0.5880440494863064,0.49747828017417889&amp;mode=crop&amp;quality=90&amp;width=1460&amp;height=680&amp;upscale=true&amp;rnd=133825318608630000" media="(min-width: 1025px)"> <source srcset="/media/7036/schlumberger-cambridge-twilight.jpg?center=0.5880440494863064,0.49747828017417889&amp;mode=crop&amp;quality=90&amp;width=1024&amp;height=580&amp;upscale=true&amp;rnd=133825318608630000" media="(min-width: 769px)"> <source srcset="/media/7036/schlumberger-cambridge-twilight.jpg?center=0.5880440494863064,0.49747828017417889&amp;mode=crop&amp;quality=90&amp;width=768&amp;height=580&amp;upscale=true&amp;rnd=133825318608630000" media="(min-width: 601px)"> <source srcset="/media/7036/schlumberger-cambridge-twilight.jpg?center=0.5880440494863064,0.49747828017417889&amp;mode=crop&amp;quality=90&amp;width=600&amp;height=460&amp;upscale=true&amp;rnd=133825318608630000" media="(min-width: 421px)"> <source srcset="/media/7036/schlumberger-cambridge-twilight.jpg?center=0.5880440494863064,0.49747828017417889&amp;mode=crop&amp;quality=90&amp;width=420&amp;height=460&amp;upscale=true&amp;rnd=133825318608630000"> <img alt="General view of east elevation of Schlumberger Research Centre at twilight" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" /> </picture> About this image The Grade II* listed Schlumberger Gould Research Centre, High Cross, Madingley Road, Cambridge. © Historic England Archive. DP180540. View List entry 1438644 Connecting Communities Historic England is helping to deliver schemes that bring buildings into use, tell the stories of communities and their spaces, and restore pride in local heritage. Get involved today by contributing your photos and stories to the Missing Pieces Project. <picture> <source srcset="/media/h5udkdeg/dp136221.jpg?mode=max&amp;quality=90&amp;upscale=false&amp;rnd=133639761416570000" media="(min-width: 1440px)"> <source srcset="/media/h5udkdeg/dp136221.jpg?mode=max&amp;quality=90&amp;width=1440&amp;upscale=false&amp;rnd=133639761416570000" media="(min-width: 1000px)"> <source srcset="/media/h5udkdeg/dp136221.jpg?mode=max&amp;quality=90&amp;width=1000&amp;upscale=false&amp;rnd=133639761416570000" media="(min-width: 750px)"> <source srcset="/media/h5udkdeg/dp136221.jpg?mode=max&amp;quality=90&amp;width=750&amp;upscale=false&amp;rnd=133639761416570000" media="(min-width: 500px)"> <source srcset="/media/h5udkdeg/dp136221.jpg?mode=max&amp;quality=90&amp;width=500&amp;upscale=false&amp;rnd=133639761416570000"> <img class="card-item__image" alt="" title="The Missing Pieces Project" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" /> </picture> The Missing Pieces Project <picture class="card-item__lightbox-image"> <source srcset="/media/h5udkdeg/dp136221.jpg?mode=max&amp;quality=90&amp;upscale=false&amp;rnd=133639761416570000" media="(min-width: 1440px)"> <source srcset="/media/h5udkdeg/dp136221.jpg?mode=max&amp;quality=90&amp;width=1440&amp;upscale=false&amp;rnd=133639761416570000" media="(min-width: 1000px)"> <source srcset="/media/h5udkdeg/dp136221.jpg?mode=max&amp;quality=90&amp;width=1000&amp;upscale=false&amp;rnd=133639761416570000" media="(min-width: 750px)"> <source srcset="/media/h5udkdeg/dp136221.jpg?mode=max&amp;quality=90&amp;width=750&amp;upscale=false&amp;rnd=133639761416570000" media="(min-width: 500px)"> <source srcset="/media/h5udkdeg/dp136221.jpg?mode=max&amp;quality=90&amp;width=500&amp;upscale=false&amp;rnd=133639761416570000"> <img class="js-lazy-load" alt="" title="The Missing Pieces Project" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs="> </picture> The Missing Pieces Project All over England are places with stories to tell. Their stories are still being written, and they won’t be complete until you share your side. Find out more <picture> <source srcset="/media/rvllxpdq/youth-blacksmithing-project2.jpg?mode=max&amp;quality=90&amp;upscale=false&amp;rnd=133383168101970000" media="(min-width: 1440px)"> <source srcset="/media/rvllxpdq/youth-blacksmithing-project2.jpg?mode=max&amp;quality=90&amp;width=1440&amp;upscale=false&amp;rnd=133383168101970000" media="(min-width: 1000px)"> <source srcset="/media/rvllxpdq/youth-blacksmithing-project2.jpg?mode=max&amp;quality=90&amp;width=1000&amp;upscale=false&amp;rnd=133383168101970000" media="(min-width: 750px)"> <source srcset="/media/rvllxpdq/youth-blacksmithing-project2.jpg?mode=max&amp;quality=90&amp;width=750&amp;upscale=false&amp;rnd=133383168101970000" media="(min-width: 500px)"> <source srcset="/media/rvllxpdq/youth-blacksmithing-project2.jpg?mode=max&amp;quality=90&amp;width=500&amp;upscale=false&amp;rnd=133383168101970000"> <img class="card-item__image" alt="One man holding a piece of metal on an anvil while the other man hammers it." title="Everyday Heritage Grants" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" /> </picture> Everyday Heritage Grants <picture class="card-item__lightbox-image"> <source srcset="/media/rvllxpdq/youth-blacksmithing-project2.jpg?mode=max&amp;quality=90&amp;upscale=false&amp;rnd=133383168101970000" media="(min-width: 1440px)"> <source srcset="/media/rvllxpdq/youth-blacksmithing-project2.jpg?mode=max&amp;quality=90&amp;width=1440&amp;upscale=false&amp;rnd=133383168101970000" media="(min-width: 1000px)"> <source srcset="/media/rvllxpdq/youth-blacksmithing-project2.jpg?mode=max&amp;quality=90&amp;width=1000&amp;upscale=false&amp;rnd=133383168101970000" media="(min-width: 750px)"> <source srcset="/media/rvllxpdq/youth-blacksmithing-project2.jpg?mode=max&amp;quality=90&amp;width=750&amp;upscale=false&amp;rnd=133383168101970000" media="(min-width: 500px)"> <source srcset="/media/rvllxpdq/youth-blacksmithing-project2.jpg?mode=max&amp;quality=90&amp;width=500&amp;upscale=false&amp;rnd=133383168101970000"> <img class="js-lazy-load" alt="One man holding a piece of metal on an anvil while the other man hammers it." title="Everyday Heritage Grants" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs="> </picture> Everyday Heritage Grants Funding for creative projects that focus on heritage connecting people to historic places, specifically those people and places that are overlooked or underrepresented. Find out more <picture> <source srcset="/media/4b4pu013/cary-grant-plaque-curtains.jpg?mode=max&amp;quality=90&amp;upscale=false&amp;rnd=133770007020870000" media="(min-width: 1440px)"> <source srcset="/media/4b4pu013/cary-grant-plaque-curtains.jpg?mode=max&amp;quality=90&amp;width=1440&amp;upscale=false&amp;rnd=133770007020870000" media="(min-width: 1000px)"> <source srcset="/media/4b4pu013/cary-grant-plaque-curtains.jpg?mode=max&amp;quality=90&amp;width=1000&amp;upscale=false&amp;rnd=133770007020870000" media="(min-width: 750px)"> <source srcset="/media/4b4pu013/cary-grant-plaque-curtains.jpg?mode=max&amp;quality=90&amp;width=750&amp;upscale=false&amp;rnd=133770007020870000" media="(min-width: 500px)"> <source srcset="/media/4b4pu013/cary-grant-plaque-curtains.jpg?mode=max&amp;quality=90&amp;width=500&amp;upscale=false&amp;rnd=133770007020870000"> <img class="card-item__image" alt="A photograph of a heritage blue plaque on a brown brick wall flanked by red curtains. The text of the plaque reads: Historic England / Cary Grant (Archie Leach) / 1904-1986 / Actor and Film Star lived here as a child&quot;" title="The National Blue Plaque Scheme" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" /> </picture> The National Blue Plaque Scheme <picture class="card-item__lightbox-image"> <source srcset="/media/4b4pu013/cary-grant-plaque-curtains.jpg?mode=max&amp;quality=90&amp;upscale=false&amp;rnd=133770007020870000" media="(min-width: 1440px)"> <source srcset="/media/4b4pu013/cary-grant-plaque-curtains.jpg?mode=max&amp;quality=90&amp;width=1440&amp;upscale=false&amp;rnd=133770007020870000" media="(min-width: 1000px)"> <source srcset="/media/4b4pu013/cary-grant-plaque-curtains.jpg?mode=max&amp;quality=90&amp;width=1000&amp;upscale=false&amp;rnd=133770007020870000" media="(min-width: 750px)"> <source srcset="/media/4b4pu013/cary-grant-plaque-curtains.jpg?mode=max&amp;quality=90&amp;width=750&amp;upscale=false&amp;rnd=133770007020870000" media="(min-width: 500px)"> <source srcset="/media/4b4pu013/cary-grant-plaque-curtains.jpg?mode=max&amp;quality=90&amp;width=500&amp;upscale=false&amp;rnd=133770007020870000"> <img class="js-lazy-load" alt="A photograph of a heritage blue plaque on a brown brick wall flanked by red curtains. The text of the plaque reads: Historic England / Cary Grant (Archie Leach) / 1904-1986 / Actor and Film Star lived here as a child&quot;" title="The National Blue Plaque Scheme" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs="> </picture> The National Blue Plaque Scheme Historic England's national blue plaque scheme celebrates people from all walks of life who have made a significant contribution to human welfare or happiness; and/or have made an exceptional impact in their field, community or on society at large. Find out more <picture> <source srcset="/media/cd3nkybz/town-hall.jpg?mode=max&amp;quality=90&amp;upscale=false&amp;rnd=133251595524300000" media="(min-width: 1440px)"> <source srcset="/media/cd3nkybz/town-hall.jpg?mode=max&amp;quality=90&amp;width=1440&amp;upscale=false&amp;rnd=133251595524300000" media="(min-width: 1000px)"> <source srcset="/media/cd3nkybz/town-hall.jpg?mode=max&amp;quality=90&amp;width=1000&amp;upscale=false&amp;rnd=133