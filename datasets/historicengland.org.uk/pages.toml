["https://historicengland.org.uk/about/what-we-do/historic-englands-role"]
title = "Historic England’s Role | Historic England"
description = "We are the public body that helps people care for, enjoy and celebrate England's spectacular historic environment."
full_description = '''About this image Photographing the landscape at Bodmin Moor © Historic England Home About Us What We Do Our Role Share this page Share Print Photographing the landscape at Bodmin Moor © Historic England More in this Section Our Role Future Strategy Corporate Plan Our Carbon Reduction Plan Annual Report & Accounts International Collaboration The Rules We Follow Historic England and the English Heritage Trust Access to Information Consultations Historic England’s Role We are the public body that helps people care for, enjoy and celebrate England's spectacular historic environment.We do this by:Championing historic placesIdentifying and protecting our heritageSupporting changeUnderstanding historic places andProviding expertise at a local levelWatch this short film about England's historic places and why we champion them. <img class="youtube-video__cookies-revoked-placeholder-image" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" srcset="/media/15726/thumbnail.jpg?anchor=center&amp;mode=crop&amp;quality=90&amp;width=220&amp;height=125&amp;upscale=true&amp;rnd=132612506859870000 220w" sizes="(max-width: 1000px) 100vw, 855px" alt=""/> Video not working due to cookies settings Enable YouTube cookies or click here to watch on YouTube <picture> <source type="image/webp" srcset="https://img.youtube.com/vi_webp/hRIlbL2Lhy8/mqdefault.webp 320w, https://img.youtube.com/vi_webp/hRIlbL2Lhy8/maxresdefault.webp 1280w" sizes="(min-width: 376px) 100vw, 320px"> <source srcset="https://img.youtube.com/vi/hRIlbL2Lhy8/mqdefault.jpg 320w, https://img.youtube.com/vi/hRIlbL2Lhy8/maxresdefault.jpg 1280w" sizes="(min-width: 376px) 100vw, 320px"> <img src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Video placeholder"> </picture> We champion historic places By standing up for historic places, everyone, from individuals and communities to government and major landowners, can look after and care for heritage. We make sure people understand and appreciate the benefits England's heritage brings and why it should be respected, cherished and enhanced as part of the very soul of our nation. We open up heritage for everyone, using digital resources, media campaigns, our unsurpassed archive, publishing, public information and exhibitions. We identify and protect our heritage Protecting historic places through the designation system is at the very heart of what we do, as expert advisor to the government.Using our knowledge and understanding we celebrate what’s special and make sure that England’s history is recognised, respected and enjoyed.We manage the National Heritage List for England: from its origins in 1882, it has grown to include over 400,000 items ranging from prehistoric monuments to office blocks, battlefields and parks. They all benefit from legal protection.The list is available to everyone through our website. It continues to grow, both in size and in popularity, and now has more than a million visits a year. We support change We want people to use and enjoy historic places in ways that reveal and reinforce their significance, and safeguard their setting in a wider landscape. Each year we give advice on more than 20,000 applications for planning permission or listed building consent. We help make sure that threats to our heritage are understood, so policies, effort and investment can be targeted effectively. We find approaches to prevent heritage at risk and tackle it as a priority. Last year, we provided £14.26 million in grants to reduce the amount of heritage at risk. We understand historic places We share our understanding of the significance of England’s places. Using cutting-edge science, research,and information and by working with others, we help people manage historic places, both physically and economically. We share our knowledge through training and guidance, conservation advice and access to resources, including the Historic England Archive, which is the biggest national collection of records about the historic environment. We deliver national expertise at a local level Our local offices are the principal point of contact for many customers.Our staff specialise in assessment, processing grants, giving advice to owners, developers and local authorities, as well as designation, heritage data, government policy and communications. Our people work with partners across each region to raise the profile of the historic environment and make sure that it makes the fullest possible contribution across the country. Share this page Share Print Next steps See Historic England's Chairman speak about heritage as a national asset See our planning services Find a grant Find out about our current research See our advice on a range of heritage subjects See our training courses Find details of our national and local offices <div class="he-grid-row "> <div class="main-col"> <div class="back-to-top"> <a href="#header" class="back-to-top__link back-to-top-button"> <div class="back-to-top__container"> <div class="back-to-top__icon"></div> </div> <span class="back-to-top__text"> Back to top </span> </a> </div> </div> </div> Please update your browser Our website works best with the latest version of the browsers below, unfortunately your browser is not supported. Using an old browser means that some parts of our website might not work correctly. Chrome Update Chrome Safari Update Safari Firefox Update Firefox Microsoft Edge Update Microsoft Edge Close this message'''
