full_description = '''About this image Millennium Wheel, Houses of Parliament and the London skyline along the River Thames in silhouette at sunset © Historic England DP021408 Explore our images Home About Us Contact Us London National Office Print Millennium Wheel, Houses of Parliament and the London skyline along the River Thames in silhouette at sunset © Historic England DP021408 Explore our images More in this Section London National Office Swindon National Office Fort Cumberland North West North East & Yorkshire Midlands East of England South West London & South East Historic England Archive Press Office Historic England Publishing Enquiries About the List Heritage at Risk Register Enquiries London National Office Our main London office covers the whole country. Address 4th Floor Cannon Bridge House25 Dowgate HillLondon EC4R 2YALocation map Telephone 020 7973 3700 Email [email protected] Accessibility Our office is largely accessible for visitors with mobility, hearing and/or visual impairments. Parking Please advise your meeting host if you require a disabled parking space so that we can make arrangements before your visit. Access and facilities We have: Automated entrance doors to the building Lifts to the 4th floor Accessible toilets A T-loop installed in reception Disabled access is via Cousin Lane which avoids using the escalators. Please let your meeting host know if you'd like to use this entrance Download Historic England Cannon Bridge House Visitor Guide (PDF, 558.04 KB) Got a local London issue? For local London issues concerning the Greater London area only, please see our local London office contact page. Print Also of interest London & South East Regional Office <div class="he-grid-row "> <div class="main-col"> <div class="back-to-top"> <a href="#header" class="back-to-top__link back-to-top-button"> <div class="back-to-top__container"> <div class="back-to-top__icon"></div> </div> <span class="back-to-top__text"> Back to top </span> </a> </div> </di