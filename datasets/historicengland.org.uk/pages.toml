["https://historicengland.org.uk/advice/grants/other-grants"]
title = "Other Grants | Historic England"
description = "Find out about other possible sources of funding you should check before applying for a Historic England grant."
full_description = '''About this image Manor Farmhouse, Hillingdon, Greater London. © Historic England Archive View image record DP042375 Home Advice & Grants Grants Other Grants Share this page Share Print Manor Farmhouse, Hillingdon, Greater London. © Historic England Archive View image record DP042375 More in this Section Our Grant Schemes Our Grant Priorities Procurement Regulations Acknowledging Your Grant Visit Grant-Aided Places Subsidy Control Fundraising Tips Other Grants Culture Recovery Fund Other Grants You may be able to get help for your project from other funding bodies. Before you apply to us for a grant, please check other sources of public or charitable funding, such as those on this page.Demand for our grants is high and before making our decision we will want to be satisfied that all other funding opportunities have been explored. Heritage Funding Directory The Heritage Funding Directory is a free, easy-to-use guide to financial and other support for anyone undertaking UK-related heritage projects. Combining the funding directories of The Heritage Alliance and the Architectural Heritage Fund, it lists over 500 sources of grants from trusts and foundations, as well as organisations offering loan finance, awards, scholarships and other 'in kind' resources.The Directory's entries cover historic buildings, landscapes, parks and gardens, churchyards and cemeteries, industrial heritage, archives, historic churches, museums, archaeology, environmental and heritage skills, conservation, and more.Please be aware that for questions about applying for specific individual funding streams featured in the Directory, you should contact the relevant organisations listed in the Directory directly rather than the Heritage Alliance, which does not run the schemes. ChurchCare You can find advice for parishes on how to raise money for maintaining, repairing and developing church buildings via the ChurchCare website. Funds Online The Directory of Social Change's Funds Online website contains information on over 8,000 grant-making trusts. National Lottery Heritage Fund Using money raised by the National Lottery, the National Lottery Heritage Fund gives grants to sustain and transform our heritage. You can find out more on the National Lottery Heritage Fund website. Share this page Share Print Also of interest Advice & Grants Fundraising Tips Charter for Advisory Services <div class="he-grid-row "> <div class="main-col"> <div class="back-to-top"> <a href="#header" class="back-to-top__link back-to-top-button"> <div class="back-to-top__container"> <div class="back-to-top__icon"></div> </div> <span class="back-to-top__text"> Back to top </span> </a> </div> </div> </div> Please update your browser Our website works best with the latest version of the browsers below, unfortunately your browser is not supported. Using an old browser means that some parts of our website might not work correctly. Chrome Update Chrome Safari Update Safari Firefox Update Firefox Microsoft Edge Update Microsoft Edge Close this message'''
