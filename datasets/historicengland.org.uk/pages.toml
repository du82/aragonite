full_description = '''Home Advice & Grants Grants Share this page Share Print Grants Do you own or manage a historic place? Our grant schemes help fund the cost of caring for buildings, monuments, and landscapes. We also fund projects that allow people to understand and champion their heritage. Accessing grants Our Grant Priorities Read about Historic England's grant priorities. Grant applications are assessed against our priorities as well as individual scheme criteria. Our Grant Schemes Grants are an essential part of Historic England's work to protect the nation's heritage. Other Grants Find out about other possible sources of funding you should check before applying for a Historic England grant. Fundraising Tips Advice on fundraising for your project. Rules and regulations Acknowledging Your Grant Procurement Using Public Funding Subsidy Control Acknowledging Your Grant Subsidy Control Procurement Using Public Funding See grants in action Visit Grant-Aided Places You can visit any of the hundreds of historic properties we have grant-aided in England. Culture Recovery Fund The Culture Recovery Fund is part of the Government’s £1.57 billion support package to protect England's cultural, arts and heritage organisations. Share this page Share Print Also of interest Funding Advice for Heritage Champions Funding Support for Developers <div class="he-grid-row "> <div class="he-grid-col-lg-10 he-grid-col-xl-8 mx-auto"> <div class="back-to-top"> <a href="#header" class="back-to-top__link back-to-top-button"> <div class="back-to-top__container"> <div class="back-to-top__icon"></div> </div> <span class="back-to-top__text"> Back to top </span> </a> </div> </div> </div> Please update your browser Our website works best with the latest version of the browsers below, unfortunately your browser is not supported. Using an old browser means that some parts of our website might not work correctly. Chrome Update Chrome Safari Update Safari Firefox Update Firefox Microsoft Edge Update Microsoft Edge Close this message'''
