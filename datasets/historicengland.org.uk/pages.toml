full_description = 'About this image West Midlands Grand Hotel facade stone repair © Historic England Home Advice & Grants Planning Heritage Consents Share this page Share Print West Midlands Grand Hotel facade stone repair © Historic England More in this Section Heritage Consents Listed Building Consent Conservation Area Consent Planning Permission Scheduled Monument Consent Section 42 Consent Consent for Parks, Gardens & Battlefields Protected Wreck Sites Ecclesiastical Exemption Tree Consents Nationally Significant Infrastructure Projects Enterprise and Regulatory Reform Act 2013 Consent for Adapting K6 Telephone Kiosks The Planning System Conservation Areas Housing Planning Research Place-Making and Regeneration Design in the Historic Environment Heritage and Sustainable Growth Infrastructure Local Management Local Plans and the Historic Environment Neighbourhood Planning Minerals Extraction Rural Planning Decision-Taking Understanding Historic Places Coastal & Marine Historic Town Centres and High Streets The Reconstruction of Heritage Assets World Heritage Contested Heritage Heritage Consents This page introduces the different legal consents and permissions that may affect historic buildings and places, including those which are protected through the designation system. Use the list of links below to find out more about the main consents which may affect heritage. Listed Building ConsentConservation Area ConsentPlanning PermissionScheduled Monument ConsentConsent for Registered Parks, Gardens & BattlefieldsProtected Wreck SitesEcclesiastical ExemptionTree ConsentsNationally Significant Infrastructure Projects Decisions are normally made by the local planning authority - unless otherwise shown. The decision-maker will have to decide whether or not an application for consent is required in particular circumstances, as well as whether or not to grant consent for any application.Local planning authorities need to consult Historic England on certain types of applic