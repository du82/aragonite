full_description = 'Home About Us Contact Us Contact Us Customer Services Got a question? Get in touch with our friendly and helpful Customer Services Team Email [email protected] Telephone 0370 333 0607 Normal operating hours: 9am to 5pm Monday to Friday. Offices are closed on bank holidays and over the Christmas period. Zero tolerance position statement Our national offices London National Office Contact details for our main London office, which covers the whole country. Swindon National Office Contact details for our main Swindon office, which covers the whole country. Fort Cumberland Contact details for our research establishment at Fort Cumberland in Portsmouth. Our local offices In addition to our main offices in London and Swindon, we also have offices covering six regions. In this section you can find the contact details for your local office as well as their specific areas of responsibility. North West Regional Office North East & Yorkshire Offices Midlands Regional Office East of England Regional Office South West Regional Office London & South East Regional Office North West Regional Office East of England Regional Office North East & Yorkshire Offices South West Regional Office Midlands Regional Office London & South East Regional Office Departments Contact our Press Office How to contact our press office both during and outside office hours. Historic England Archive and Library How to contact the Historic England Archive which is based in Swindon. Historic England Publishing Contact Liverpool University Press to order books direct from our distributors or to enquire about publishing with Historic England. Listings and Heritage at Risk enquiries National Heritage List for England Enquiries Contact details for help in searching the National Heritage List for England (NHLE) Heritage at Risk Register for England Enquiries Contact the Heritage at Risk team about sites in England already on the Heritage at Risk Register, or to apply to add a site to the regis