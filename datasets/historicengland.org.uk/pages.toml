title = "Everyone's Welcome | Historic England"
description = "We’re looking for new ways to promote the past. To make it inclusive to all, we need people with fresh perspectives, from all walks of life, to join."
full_description = '''About this image Historic England staff meet for an open space session at an "unconference" event in York. © Historic England Home About Us Careers Everyone's Welcome Share this page Share Print Historic England staff meet for an open space session at an "unconference" event in York. © Historic England More in this Section Explore Career Areas What We Offer What to Expect When You Apply Everyone's Welcome Our Values and Behaviours Apprenticeships Our External Advisers Architectural Investigators Geospatial Survey Team Everyone's Welcome At Historic England, we’re always looking for new ways to promote the past that are inclusive to all and that celebrate the cultural diversity of England’s heritage.To do that, we need people with fresh perspectives, from all walks of life, to join us. Discover more about our commitment to diversity and inclusion below. On this page Embracing diversity Our support networks Inclusive culture Championing social mobility Women in Science Supporting mental health and wellbeing Embracing diversity We believe that heritage is for everyone, and so are jobs in the heritage sector. As an equal opportunities employer, we’re working hard to improve diversity in our workforce and are always looking for new perspectives to help us protect extraordinary places.We’re proud to be Disability Confident: Leader accreditation, which is the highest level within the scheme. As a Disability Confident Leader we’re committed to examining our behaviours and challenging biases that prevent us from being truly inclusive – taking steps to increase the representation of diverse voices in our workforce, on our Commission and on our advisory bodies. As part of the Disability Confident Scheme we offer a guaranteed interview if a disabled candidate meets our minimum criteria for the role. This is to ensure we are considering the person fairly on their abilities.We work in partnership with Evenbreak to promote our job opportunities to an inclusive audience.We're Youth Friendly, and a Gold Award winner, seven years running, of the Mind Workplace Wellbeing Index – but we’re not stopping there. Our support networks We’re working hard to improve the diversity of our workforce and have set up a range of employee network groups to provide peer support and advice to us on how to be more inclusive, including:Inclusion ChampionsWellbeing ForumMental Health Champions and First AidersDisability NetworkGender Equality NetworkNeurodiversity NetworkPride NetworkRace Equality NetworkSocial Mobility Network Inclusive culture We have implemented actions to create an inclusive and equitable organisation. Our goal is to reflect the diversity of the public we support. Our commitment is to ensure a welcoming and inclusive environment where all colleagues feel safe, respected, and empowered to succeed. We aim to ensure that every individual feels valued, included, and able to bring their authentic selves to work.Our commitment to Race EqualityOur vibrant Race Equality Staff Network offers peer support, organises events, and provides valuable feedback to the organisation on relevant issues. We are deeply committed to promoting inclusivity in our work, including through initiatives that celebrate and acknowledge the diverse histories and contributions of people from different racial and ethnic communities.We take pride in the representation of racially and ethnically diverse colleagues at Historic England, though we acknowledge that there is more work to be done to strengthen this representation. We continuously evaluate the racial and ethnic composition of our teams, aiming to achieve a similar level of diversity in our leadership as observed in the general population.Below are some examples of our initiatives in this area: Celebrating 31 Places Connected to Black British History We are celebrating the Black histories of 31 places in England, from associations with early Black Britons to Britain's first West Indian newspaper. Black British History Historic England is working to improve understanding and recognition of England's diverse heritage in our Inclusive Heritage research. Our commitment to Gender EqualityAt Historic England, we are committed to achieving gender equality as a cornerstone of building an inclusive workplace. We strive to create an environment where individuals of all genders are valued, respected, and empowered to reach their full potential.We are proud to have excellent representation of women in leadership roles. Recent improvements in our gender pay gap reflect our dedication to the comprehensive actions outlined in our Gender Pay Action Plan.Our Gender Equality Staff Network plays an integral role in our efforts, offering peer support, organising events, and championing positive change within the organisation. Through its initiatives, we aim to tackle gender-related challenges and celebrate the achievements of colleagues of all genders.We remain committed to taking meaningful steps to break down barriers, challenge biases, and create opportunities for everyone. By collaborating, we can ensure that Historic England continues to be a place where all individuals can thrive and bring their authentic selves to work.Below are some examples of our initiatives in this area: Trans and Gender-Nonconforming Histories There are rich histories of people crossing gender throughout English history that can resonate for trans and gender-nonconforming identities today. Independent Women From the mid-19th century, educated women who worked could remain unmarried and form their closest emotional ties with other women. Buildings that Celebrate Working Women Listed buildings tell us the story of working women at the forefront of a fascinating period of social and technological change. The Long Road to Women's Suffrage The struggle for women's suffrage was a campaign which began in the drawing rooms of London and Manchester in the mid-19th century. Our commitment to welcoming and supporting LGBTQ+ peopleWe have been working to create a supportive and inclusive work environment for LGBTQ+ people for many years. Our thriving Pride Staff Network provides peer support, organises social events, and can provide feedback on issues to the organisation. We are inclusive in our work, including through projects like Pride of Place, a ground-breaking celebration of places that tell important LGBTQ+ histories.We have good representation of LGBTQ+ people at Historic England, broadly reflecting estimates of the UK population and we are proud of that. We recognise that more work is always needed to maintain this. We are fully committed to providing a welcoming and inclusive work environment where colleagues feel safe and can thrive. Our aim is to ensure that all colleagues feel able and confident to be out and open in the workplace about their sexual orientation and gender identity if they choose to be. Championing social mobility We believe engaging with heritage helps social mobility and that it is vital for all people to have the opportunity to reach their full potential through participation in heritage.Historic England is a significant employer in the heritage sector, and we have a responsibility to ensure we reflect this aspiration within our organisation and increase social mobility in the sector by encouraging talented people from all socio-economic backgrounds to join our workforce and to support them to thrive, develop and progress their career with Historic England and beyond.We have signalled our commitment to Social Mobility by joining over 700 organisations in signing the Social Mobility Pledge. We also participate in the Social Mobility Index to better understand how we can shape our policies, processes, practices, and culture to reflect these aspirations. Women in Science Are you interested in a career in science and technology? Our specialists have shared their stories to inspire you.According to the United Nations, women are typically given smaller research grants than their male colleagues and, while they represent 33.3% of all researchers, only 12% of members of national science academies are women. This is why we're proud to feature women in science at Historic England. We hope that their examples will inspire others to pursue education and careers in science, technology and engineering. Gallery Please click on the gallery images to enlarge. <img class="image-gallery__image" src="/media/41ffseb2/15-jenny-harvey.jpg?mode=max&amp;quality=90&amp;width=380&amp;upscale=false&amp;rnd=133205036855500000" alt="Photograph showing a light-haired woman in a red jumper and apron standing at a tabletop working using a brush to conserve an artefact. " title="Jenny Harvey, Archives Conservator (photographic Materials), Archive Conservation Department: &quot;Coming from an arts background into conservation has been a fascinating career path. I am interested in material science and how it applies to historic objects, in particular finding appropriate treatment solutions. Using scientific knowledge, techniques and technical craft skills to preserve our physical heritage is extremely rewarding.&quot;"/> <img class="image-gallery__image" src="/media/1lhdbbg3/12-saya-honda-miles.jpg?mode=max&amp;quality=90&amp;width=380&amp;upscale=false&amp;rnd=133205037149270000" alt="Photograph showing a short, dark-haired woman working at a desk, she is using two screens and is looking at a series of graphs while typing on the keyboard." title="Saya Honda Miles, Lead Archive Conservator, Archive Conservation Department: &quot;As an archive conservator, I apply science to my day-to-day work. I have been trying to understand science around photographic materials and storage environment for a while, but there is no end. I am hoping to become a bridge between science and conservation, once finished my PhD.&quot;"/> <img class="image-gallery__image" src="/media/lbtncygc/2-caroline-cattini-dow.jpg?mode=max&amp;quality=90&amp;width=380&amp;upscale=false&amp;rnd=133205211637770000" alt="Photograph showing a blonde-haired woman smiling in seated position, wearing a blue top. " title="Caroline Cattini-Dow, Principal Building Services Engineer and Team Leader, Technical Conservation Team: &quot;I enjoyed science and technology at school, and on leaving I undertook an engineering apprenticeship. My role now is balancing the need to preserve the historic asset whilst integrating modern services so it remains usable in the future, resilient to our changing climate and net zero ambitions.&quot;"/> <img class="image-gallery__image" src="/media/xsxf1adh/3-bridget-drake-wilkes.jpg?mode=max&amp;quality=90&amp;width=380&amp;upscale=false&amp;rnd=133205036632670000" alt="Photograph showing a woman in a hard hat on crane platform working to restore North Portico at Witley Court. " title="Bridget Drake-Wilkes, Senior Structural Engineer, Technical Conservation Team: &quot;Being an engineer at Historic England is different to working elsewhere in design and construction. Normally, there’s always a rush to get something built. Here, there’s an opportunity to step back and ensure what you’re doing is best for the historic fabric of the building. Working at Historic England, you can influence and shape things for the longer term; here, you’re a guardian for future generations.&quot;"/> <img class="image-gallery__image" src="/media/0mtf04sm/9-helen-winton.jpg?mode=max&amp;quality=90&amp;width=380&amp;upscale=false&amp;rnd=133205038999130000" alt="Photograph in portrait style, showing dark, curly haired woman smiling widely wearing a green top and black cardigan. " title="Helen Winton, Head of Archaeological Investigation Team: &quot;Having mainly done science subjects at school, I later found out about archaeology through studying history of science. At work we use traditional and cutting-edge technology to investigate and tell stories about the past. I hope today shows the big overlap between science and culture – you can do both!&quot;"/> <img class="image-gallery__image" src="/media/fchhurku/8-sally-evans.jpg?mode=max&amp;quality=90&amp;width=380&amp;upscale=false&amp;rnd=133205037568830000" alt="Photograph showing a woman flying a helicopter over a rural landscape. Woman is wearing a knitted hat, red coat and is smiling at the camera." title="Sally Evans, Aerial Survey Manager, Archaeological Investigation Team: &quot;I love my role at Historic England, discovering and mapping archaeological sites using aerial photographs and airborne laser scanning (lidar) imagery. It’s very technical and requires extensive archaeological knowledge and IT skills. Many women leave archaeology as a career from their thirties onwards. I hope these messages change that pattern.&quot; "/> <img class="image-gallery__image" src="/media/l0clrfhm/4-alison-church.jpeg?mode=max&amp;quality=90&amp;width=380&amp;upscale=false&amp;rnd=133205037799900000" alt="Photograph showing dark-haired woman in red coat, high vis and hard hat using a decay detection drill on Belsay Hall roof trusses. " title="Alison Church, Senior Structural Engineer, Technical Conservation Team: &quot;As a Structural Engineer no two structures are the same and it’s this variety that continues to challenge and delight me. My job is to be both detective and doctor to our ailing historic structures. Every day is different, from on-site inspections and reporting to research and educating.&quot; "/> <img class="image-gallery__image" src="/media/ccldcd1z/11-francesca-gherardi.jpg?mode=max&amp;quality=90&amp;width=380&amp;upscale=false&amp;rnd=133205039289470000" alt="Photograph showing a decorated historic building with arched roof covered in a faded mural. A woman is shown next to equipment, she is dark haired and smiling. " title="Francesca Gherardi, Materials Scientist, Investigative Science Team: &quot;Understanding the world around me has always been fascinating, and my job combines my passion for science and cultural heritage. I work on a wide range of materials from wall paintings to silver coins and even buildings, helping in their preservation. Showcasing women in science is crucial to inspire the future generation as ‘You can’t be what you can’t see’.&quot;"/> <img class="image-gallery__image" src="/media/waenckbi/13-genevieve-hancock.jpg?mode=max&amp;quality=90&amp;width=380&amp;upscale=false&amp;rnd=133205040030200000" alt="Photograph showing a dark-haired woman in gloves and an apron working at a desk. She is using a paintbrush to work on a piece of glass on the tabletop." title="Genevieve Hancock, Archive Conservation Assistant, Archive Conservation Department: &quot;I’ve never considered myself a ‘woman in science’, but you do need an understanding of how objects degrade to be a conservator. I enjoy learning about all the different components of an archive item, and how they work with each other to either speed up or slow down their process of deterioration.&quot;"/> <img class="image-gallery__image" src="/media/mstfh0ec/10-ruth-pel'''
