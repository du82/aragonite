full_description = '''Home Advice & Grants Constructive Conservation Share this page Share Print Constructive Conservation Constructive Conservation is a positive, well-informed and collaborative approach to conservation. It is a flexible process of helping people understand their historic environment and using that understanding to manage change. We support innovative schemes that protect and enhance the significance of buildings and historic places. We work collaboratively with owners, architects and developers to help them develop proposals for creative uses of historic places. We use 'Conservation Principles' to make sure that our advice is reasonable, knowledgeable and consistent. Sustainable Growth Read case studies and inspiring examples of constructive conservation and sustainable development. Conservation Principles Here you can find information on the Conservation Principles that Historic England uses. Share this page Share Print Also of interest Our Planning Services Heritage and Sustainable Growth Grants <div class="he-grid-row "> <div class="he-grid-col-lg-10 he-grid-col-xl-8 mx-auto"> <div class="back-to-top"> <a href="#header" class="back-to-top__link back-to-top-button"> <div class="back-to-top__container"> <div class="back-to-top__icon"></div> </div> <span class="back-to-top__text"> Back to top </span> </a> </div> </div> </div> Please update your browser Our website works best with the latest version of the browsers below, unfortunately your browser is not supported. Using an old browser means that some parts of our website might not work correctly. Chrome Update Chrome Safari Update Safari Firefox Update Firefox Microsoft Edge Update Microsoft Edge Close this message'''
