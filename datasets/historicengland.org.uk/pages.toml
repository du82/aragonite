full_description = '''About this image West Midlands Grand Hotel facade stone repair © Historic England Home About Us What We Do Annual Report & Accounts Share this page Share Print West Midlands Grand Hotel facade stone repair © Historic England More in this Section Our Role Future Strategy Corporate Plan Our Carbon Reduction Plan Annual Report & Accounts International Collaboration The Rules We Follow Historic England and the English Heritage Trust Access to Information Consultations Annual Report and Accounts As part of our statutory responsibilities, Historic England lays its Annual Report and Accounts in the Houses of Parliament every year. Updated 30 September 2024 As Historic England only came into effect on 1 April 2015, the Annual Reports and Accounts on this page before 2015/16 relate to the period when it was still English Heritage.You can download the Annual Report and Accounts below.A limited supply of hard copies are kept by Customer Services. Current report <picture> <source srcset="/media/5idizbjv/he-annual-report-2024.jpg?mode=max&amp;quality=90&amp;width=220&amp;height=311&amp;upscale=false&amp;rnd=133669034017070000"> <img class="publications__cover-image" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Historic England&#39;s Annual Report and Accounts 2023/24 includes the audited accounts and performance and accountability reports." /> </picture> Historic England Annual Report and Accounts 2023/24 Published 31 July 2024 Historic England's Annual Report and Accounts 2023/24 includes the audited accounts and performance and accountability reports. Learn more Historic England Annual Report Highlights 2023/24This summary covers some of the highlights of Historic England’s activity in 2023/24. Download Annual Report Highlights 2023-24 (PDF, 848.88 KB) Previous reports <picture> <source srcset="/media/2sui5vny/he-annual-report-2023.png?mode=max&amp;quality=90&amp;width=220&amp;height=311&amp;upscale=false&amp;rnd=13334168525027000