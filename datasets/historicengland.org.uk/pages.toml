["https://historicengland.org.uk/about/who-we-are/committees-and-panels"]
title = "Committees | Historic England"
description = "Celebrate inclusive heritage and ensure your work is diverse and inclusive."
full_description = '''About this image Holme Next the Sea Timber Circle ("Sea Henge"), Norfolk. View at sunrise. Early bronze age site. © Historic England PLB_M990983 Home About Us Who We Are Committees Share this page Share Print Holme Next the Sea Timber Circle ("Sea Henge"), Norfolk. View at sunrise. Early bronze age site. © Historic England PLB_M990983 More in this Section Commission Executive Team Committees Audit and Risk Assurance Committee Business and Finance Committee Designation Review Committee Historic England Advisory Committee Historic Estate Conservation Committee London Advisory Committee Places of Worship Forum Remuneration and Appointments Committee Historic Places Panel Young Advisers Committees Historic England has three non-executive committees that advise staff and the Commission on specific strategy, policy and casework matters. There are also three committees to help manage internal business.All members of the advisory committees and a number of additional heritage and cultural specialists belong to an Expert Advisory Group that meets once a year, and provides advice and support to staff on an ad hoc, voluntary basis. Non-executive advisory committees The following three non-executive committees advise staff and Commission on strategy, policy and casework:Historic England Advisory CommitteeOffers expert advice to staff and the Commission on Historic England's functions under the National Heritage Act 1983, and other relevant legislation, in particular on policy matters and casework (excluding London) where it is novel, contentious or sets a precedent.London Advisory CommitteeOffers expert advice to staff and Commission on Historic England's functions under the National Heritage Act 1983, and other relevant legislation, relating to individual buildings, monuments, conservation areas, parks and gardens in London and in particular policy matters and casework where it is novel, contentious or sets a precedent.Designation Review CommitteeAdvises Commission and staff on complex, contentious and high profile designation review cases passed to Historic England from the Department for Culture, Media and Sport (DCMS). Committees to help manage internal business Historic Estate Conservation CommitteeThe Historic Estate Conservation Committee monitors and advises Commission on the conservation and maintenance of the properties within the National Heritage Collection (NHC). The NHC is managed by the English Heritage Trust. Business Committees The following three committees advise on internal Historic England Business:Audit and Risk Assurance Committee Business and Finance Committee Remuneration and Appointments Committee Historic England also has administrative responsibility for:Places of Worship Forum A non-denominational forum for those pursuing the conservation and sustainable future of historic places of worship.Historic Places Panel The Historic Places Panel (formerly Urban Panel) provides a broad spectrum of independent expertise to help local authorities and others engage in the regeneration and revitalisation of historic places. Share this page Share Print Governance Team Email [email protected] Next steps Find out what Historic England does See our Corporate Plan See our latest annual report Find out how we are funded Find out more about our relationship with the English Heritage Trust <div class="he-grid-row "> <div class="main-col"> <div class="back-to-top"> <a href="#header" class="back-to-top__link back-to-top-button"> <div class="back-to-top__container"> <div class="back-to-top__icon"></div> </div> <span class="back-to-top__text"> Back to top </span> </a> </div> </div> </div> Please update your browser Our website works best with the latest version of the browsers below, unfortunately your browser is not supported. Using an old browser means that some parts of our website might not work correctly. Chrome Update Chrome Safari Update Safari Firefox Update Firefox Microsoft Edge Update Microsoft Edge Close this message'''
