["https://historicengland.org.uk/advice/technical-advice/building-regulations"]
title = "Building Regulations | Historic England"
description = "Guidance on complying with building regulations and where to look in the approved documents to find advice specific to historic buildings."
full_description = "About this image Building works during the repurposing of derelict Victorian terraced houses Kimmel Street, Toxteth, Liverpool © Historic England Archive DP275570 Home Advice & Grants Technical Guidance Building Regulations Share this page Share Print Building works during the repurposing of derelict Victorian terraced houses Kimmel Street, Toxteth, Liverpool © Historic England Archive DP275570 More in this Section Looking After Historic Buildings Building Regulations Energy Efficiency and Retrofit in Historic Buildings Building Services Engineering Emergency Planning and Fire Advice Flooding and Historic Buildings Looking After Parks, Gardens and Landscapes Looking After Monuments and Sites Improving Access to Historic Buildings and Landscapes Looking After War Memorials Peatlands Archaeological Science Recording Heritage Information Management Project Management for Heritage Building Regulations, Approved Documents and Historic Buildings Updated 17 December 2024 This page provides guidance for owners of historic buildings on complying with building regulations in England. It also highlights where in the approved documents there is specific advice about historic buildings. Contents Building regulations Material change of use Buildings exempt from building regulations Approved documents Building regulations Building regulations are a legal requirement which set standards for how most new buildings should be constructed to achieve a minimum level of performance, including most outbuildings and extensions.They are intended to protect people’s safety, health and welfare. They also set standards for accessibility, water use, energy use and security.Historic England supports the government’s aim to improve the standards to which buildings are constructed and maintained. There are improvements we can all look to incorporate into our existing buildings to make them more energy efficient and resilient to climate change.Existing buildings are not generally required to be brought up to newer building regulations standards. However, existing buildings, or parts of existing buildings, may need to comply with certain aspects of building regulations in circumstances such as:The building is subject to change of useA thermal element (wall, floor or roof) is renovated or replacedWhen an extension is addedWhen a 'controlled service' or a 'controlled fitting' is installed. A replacement window is an example of a controlled fitting. A boiler is an example of a controlled serviceConsequential improvements are required – when an existing building over 1,000 square metres is extended or its capacity for heating or cooling per square metre is increasedFor more detail on building regulations and the building control system download the Manual to the Building Regulations. Material change of use Material change of use is a key element to complying with building regulations under Regulation 6.Where a material change of use is being proposed, the work must comply with the requirements indicated in Table A2.Where only part of a building is affected by a material change of use, then under Regulation 6 in most cases the building regulations apply only to the part that is subject to change. However, it is worth recognising that a change of material may adversely affect other parts of a building, for example in relation to fire safety.On page 31 of the Manual to the Building Regulations, Table A2 shows all the requirements that apply to material changes of use. Buildings exempt from building regulations Under Regulation 9 of the building regulations, some buildings are exempt. This includes some small buildings, extensions and buildings used for specific purposes.A full list of exempt buildings are defined in Schedule 2 of the Building Regulations 2010. Where buildings are exempt they must continue to meet the definitions in Schedule 2 after the works are complete.The Manual to the Building Regulations summarises the 7 classes of buildings exempt from regulations (in Table A1 on page 28):Buildings controlled under legislation for explosives, nuclear facilities or ancient monumentsCertain buildings not visited by people, such as plant roomsCertain greenhouses, agricultural buildings and buildings for animalsTemporary buildings not intended to remain in situ for more than 28 daysBuildings used for site accommodationCertain small detached buildings, generally without sleeping accommodation (although there are requirements about water and electricity supplies)Includes certain conservatories, porches and open-sided carports (although there are safety requirements about glazing and others about water and electricity supplies)Crown buildings, statutory undertakers’ property and airportsThe procedural aspects of the building regulations do not apply to Crown buildings, such as central government offices and courts of law.Statutory undertakers are bodies that have been given statutory powers as their function is that of a public character.Generally, this includes utilities or telecommunications companies and Network Rail. However, gas and electricity suppliers are not regarded as statutory undertakers under Section 4 of the Building Act.Civil Aviation Authorities and Airport Operators can be exempt from the building regulations.The Metropolitan Police Authority are exempt from procedural elements of the building regulations but building work is still subject to the same standards (referred to as ‘substantive requirements’ in the Building Act).Listed buildings or buildings in conservation areas, and other buildings of architectural or historic interestListed buildings or buildings in conservation areas are not exempt from complying with building regulations. However, the special needs of historic buildings are recognised in some of the building regulations’ approved documents covered below. Approved documents The approved documents provide guidance on how to comply with building regulations. They contain statutory guidance and practical examples and solutions on how to meet the requirements of the building regulations.Some approved documents are split into 2 volumes:Volume 1: dwellingsVolume 2: buildings other than dwellingsThere are 18 approved documents free to download from the government's website.The approved documents may not be relevant for all situations. Though you do not have to follow the guidance in the approved documents, you still need to be sure that your building work meets the legal rules set out in the Building Regulations 2010 as well as other statutory requirements. You need to comply with all relevant parts of the building regulations.Where you wish to follow an alternative approach to the guidance in the approved documents, you should discuss and agree with a building control body before starting building work.British Standards and other technical guidance may provide you with alternative measures that adopt higher standards than those recommended in the approved documents.Special considerations for buildings of architectural or historic interestSome of the approved documents explicitly recognise that special considerations are needed for buildings of architectural or historic interest such as:Listed buildingsBuildings situated in designated conservation areasBuildings which are of architectural or historic interest and which are referred to as a material consideration in a local authority’s development planBuildings of architectural and historical interest within national parks, areas of outstanding natural beauty and world heritage sitesVernacular buildings of traditional form and constructionBuildings included in the schedule of monuments under Section 1 of the Ancient Monuments and Archaeological Areas Act 1979 are exempt from compliance with the requirements of some building regulations.Relevant sections of the approved documents A: Structure Approved Document A: StructureThough Approved Document A does not explicitly mention works to historic buildings or traditional constructed buildings, it does apply to certain material changes of any building structure. It also highlights that the construction of a new building should not cause‘deflection or deformation of any part of the building, or such movement of the ground, as will impair the stability of any part of another building.’ (Page 5, Loading A1 (b))Nor should it cause‘subsidence (other than arising from shrinkage), in so far as the risk can be reasonably foreseen will not impair the stability of any part of the building.’ (Page 5, Ground Movement A2 (b))Where an extension is being built onto an existing traditionally constructed building, a structural engineer with experience of traditional construction, and where required conservation accredited, should be employed to assess how the extension might impact the existing building, to prevent issues such as differential movement occurring. B: Fire safety Approved Document B: Fire safetyPart B of Building Regulations 2010 applies to all material changes of use set out in Regulation 5 of Building Regulations 2010.Approved Document B and amendments provides guidance on fire safety measures within and around buildings. There are 2 volumes: dwellings and buildings other than dwellings.Many fire safety measures do not require building regulation approval. Fire safety should be addressed in all listed and other historic buildings, and often fire safety measures can be incorporated without causing any significant impact to the building.The approved document recognises historic buildings:'Where Part B applies to existing buildings, particularly buildings of special architectural or historic interest for which the guidance in this document might prove too restrictive, some variation of the provisions in this document may be appropriate. In such cases, it is appropriate to assess the hazard and risk in the particular case and consider a range of fire safety features in that context.' (Volume 1, page 3 paragraph 0.10 and Volume 2, page 4 paragraph 0.17)Where measures cannot be retrofitted, an engineered fire risk strategy should be undertaken by a trained professional in fire engineering solutions. This is covered in Approved Document B under Fire Safety Engineering (Volume 1, page 3 and Volume 2, page 4).For more guidance on fire safety, follow the links below to:Historic England's fire adviceHistoric England's emergency planning adviceCIBSE guide on fire engineered solutions BS 7974 application of fire safety engineering principles to the design of buildings C: Site preparation and resistance to contaminates and moisture Approved Document C: Site preparation and resistance to contaminates and moistureApproved Document C highlights the following for historic buildings:'The need to conserve the special characteristics of such historic buildings needs to be recognised. In such work, the aim should be to improve resistance to contaminants and moisture where it is practically possible, always provided that the work does not prejudice the character of the historic buildings, or increase the risk of long-term deterioration to the building fabric or fittings. In arriving at an appropriate balance between historic building conservation and improving resistance to contaminants and moisture it would be appropriate to take into account the advice of the local planning authority’s conservation officer.'Particular issues relating to work in historic buildings that warrant sympathetic treatment and where advice from others could therefore be beneficial include the following:a. Avoiding excessively intrusive gas protective measuresb. Ensuring that moisture ingress to the roof structure is limited and the roof can breathe. Where it is not possible to provide dedicated ventilation to pitched roofs it is important to seal existing service penetrations in the ceiling and to provide draught proofing to any loft hatches. Any new loft insulation should be kept sufficiently clear of the eaves so that any adventitious ventilation is not reduced.'In most cases the rate at which gas seeps into buildings, mainly through floods, can be reduced by edge located sumps or sub-floor vents. These are less intrusive than internal sumps or ducts that may involve taking up floors. If flagged floors are taken up the stones should be indexed, and their layout recorded to facilitate relaying when work is completed.'Radon can be dispersed by ventilation strategies such as positive pressurisation. These systems can often be accommodated in an unobtrusive manner.'If internal mechanical ventilation is used to disperse ground gases, it may affect the functioning of combustion appliances and may lead to the spillage of products of combustion into the building.' (pages 7 to 8)Flood resilience or resistance for existing buildings is not currently a requirement of the Building Regulations 2010, but flood risk is mentioned in Approved Document C (page 9, paragraph 0.8). In particularly the guidance refers to that of elevated groundwater levels, sewer flooding and intrusion of groundwater via floors or floor voids.Historic England's Flooding and Historic Buildings advice provides more information on making a building flood resilient. D: Toxic substances Approved Document D: Toxic substancesApproved Document D covers toxic substances, including insulating materials in cavity walls, and the prevention of toxic fumes entering buildings. Historic England's Energy Efficiency web pages provide more information on the appropriate insulation materials to use in traditionally constructed dwellings. E: Resistance to the passage of sound Approved Document E: Resistance to the passage of soundApproved Document E covers the resistance to sound. The section on historic buildings says: 'In the case of some historic buildings undergoing a material change of use, it may not be practical to improve the sound insulation to the standards set out in Tables 1a and 1b. [Defining the performance standards for separating walls, floors and stairs].'The need to conserve the special characteristics of such historic buildings needs to be recognised, and in such work, the aim should be to improve sound insulation to the extent that it is practically possible, always provided that the work does not prejudice the character of the historic building, or increase the risk of long-term deterioration to the building fabric or fittings.'In arriving at an appropriate balance between historic building conservation and improving sound insulation it would be appropriate to take into account the advice of the local planning authorities conservation officer.'In such cases it will be reasonable to improve the sound insulation as much as is practical, and to affix a notice showing the sound insulation value(s) obtained by testing in accordance with Regulation 41 or 20(1) and (5), in a conspicuous place inside the building.' (Approved Document E, page 13 paragraph 0.7) F: Ventilation Approved Document F: VentilationApproved Document"
