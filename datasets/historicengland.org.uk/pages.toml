title = "Fort Cumberland | Historic England"
description = "Contact details for our research establishment at Fort Cumberland in Portsmouth."
full_description = 'About this image Aerial view of Fort Cumberland in Portsmouth. © Historic England Archive N070043 Home About Us Contact Us Fort Cumberland Print Aerial view of Fort Cumberland in Portsmouth. © Historic England Archive N070043 More in this Section London National Office Swindon National Office Fort Cumberland North West North East & Yorkshire Midlands East of England South West London & South East Historic England Archive Press Office Historic England Publishing Enquiries About the List Heritage at Risk Register Enquiries Fort Cumberland The research establishment at Fort Cumberland in Portsmouth covers the following subject areas:ArchaeologyArchaeological ScienceArchaeological Archives Take a virtual laboratory tour Archaeobotany Conservation Materials Science Zooarchaeology X-Ray Facility Sample Processing Facility Fort Cumberland is also home to a number of small businesses and a charity:the Nautical Archaeology Society Address Fort CumberlandFort Cumberland RoadPortsmouthHampshirePO4 9LD Telephone 023 9285 6700 Email [email protected] Access Fort Cumberland is open to pre-booked visitors during events such as Heritage Open Days. Parking We have on-site parking with one allocated disabled parking bay. Accessibility and facilities Our office is partly accessible for visitors with mobility, hearing and/or visual impairments.Our office has:Accessible toiletsLift to all floors in the Ancient Technology, Archaeological Conservation and Environmental Studies buildingWe do not have T-loop facilities.More information about our equipment and lab facilities in available through the NHSF Kitcatalogue. Find out more about Fort Cumberland Download Visitor guide to the history and natural history of Fort Cumberland (PDF, 862.73 KB) Print <div class="he-grid-row "> <div class="main-col"> <div class="back-to-top"> <a href="#header" class="back-to-top__link back-to-top-button"> <div class="back-to-top__container"> <div class="back-to-top__icon"></div> </div> <s