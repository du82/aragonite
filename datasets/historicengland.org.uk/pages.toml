: 500px)" /> <img alt="Apprentice Jackie Ann Judge wears winter clothing in a field at dawn" src="/media/2mzjlk4c/jackie-ann-judge-body-2.jpg?center=0.60140128424839634,0.64791064052965708&amp;mode=crop&amp;quality=90&amp;width=336&amp;height=250&amp;upscale=true&amp;rnd=133506490363230000" /> </picture> <figcaption class="captioned-image__description col container" data-feature-image-caption> <div class="captioned-image__description-inner-wrapper"> <button class="captioned-image__description-button he-grid-col-lg-12" aria-controls="captioned-image-78534-description-text-f87652e3-f8d6-4d91-aa5f-8be10a68fa40" aria-expanded="false" title="About this image" type="button"> <span class="icon icon--info"></span> <span class="icon icon--chev-down"></span> </button> <div id="captioned-image-78534-description-text-f87652e3-f8d6-4d91-aa5f-8be10a68fa40" class="captioned-image__description-text he-grid-col-12"> <span>Historic England Archaeological Technician Apprentice, Jackie Ann Judge. </span> </div> </div> </figcaption> </figure> Meet Pinnacle Conservation As a host organisation for The Heritage Building Skills Programme, Pinnacle Conservation explain how successful apprenticeship schemes can benefit both employer and apprentice. Editor’s note: the Heritage Building Skills Programme was called The Hamish Ogston Foundation Heritage Building Skills Programme until October 2023. Find out more about Pinnacle Conservation <figure class="captioned-image"> <picture> <source srcset="/media/16188/dp181673-plymouth_web.jpg?center=0.385,0.49166666666666664&amp;mode=crop&amp;quality=90&amp;width=535&amp;height=500&amp;upscale=true&amp;rnd=133537899893470000" media="(min-width: 1000px)" /> <source srcset="/media/16188/dp181673-plymouth_web.jpg?center=0.385,0.49166666666666664&amp;mode=crop&amp;quality=90&amp;width=700&amp;height=500&amp;upscale=true&amp;rnd=133537899893470000" media="(min-width: 800px)" /> <source srcset="/media/16188/dp181673-plymouth_web.jpg?center=0.385,0.49166666666666664&amp;mode=crop&amp;quality=90&amp;width=505&amp;height=425&amp;upscale=true&amp;rnd=133537899893470000" media="(min-width: 500px)" /> <img alt="A man on scaffolding repointing a historic structure" src="/media/16188/dp181673-plymouth_web.jpg?center=0.385,0.49166666666666664&amp;mode=crop&amp;quality=90&amp;width=336&amp;height=250&amp;upscale=true&amp;rnd=133537899893470000" /> </picture> <figcaption class="captioned-image__description col container" data-feature-image-caption> <div class="captioned-image__description-inner-wrapper"> <button class="captioned-image__description-button he-grid-col-lg-12" aria-controls="captioned-image-52097-description-text-082e3992-4486-4e49-9603-52235520973c" aria-expanded="false" title="About this image" type="button"> <span class="icon icon--info"></span> <span class="icon icon--chev-down"></span> </button> <div id="captioned-image-52097-description-text-082e3992-4486-4e49-9603-52235520973c" class="captioned-image__description-text he-grid-col-12"> <span>Repointing in progress on a historic building</span> <span>&copy; Historic England Archive. Image Reference DP181673</span> </div> </div> </figcaption> </figure> <a title="See where the apprentices are working." aria-label="See where the apprentices are working." href="https://storymaps.arcgis.com/stories/a665a2a54af24b3abcc3d4f20c7226ee"> <picture class="img-fluid"> <source srcset="/media/b3ykossi/all-tier-2-003.jpg?anchor=center&amp;mode=crop&amp;quality=90&amp;width=650&amp;height=650&amp;upscale=false&amp;rnd=133410688892770000" media="(max-width: 750px)"> <source srcset="/media/b3ykossi/all-tier-2-003.jpg?anchor=center&amp;mode=crop&amp;quality=90&amp;width=400&amp;height=400&amp;upscale=false&amp;rnd=133410688892770000"> <img src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="A group of apprentices seated on the stage of a recreated Shakespearean theatre."> </picture> </a> Heritage Building Skills Programme Interactive Map Meet the apprentices and le