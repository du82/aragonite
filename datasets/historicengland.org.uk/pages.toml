["https://historicengland.org.uk/about/jobs/opportunities"]
title = "Careers and Roles at Historic England | Historic England"
description = "We’ve got opportunities up and down the country. Whatever your background, there’s sure to be a place for you at Historic England."
full_description = '''About this image Historic England's South West office at Finzels Reach, Bristol © Historic England Home About Us Careers Explore Career Areas Share this page Share Print Historic England's South West office at Finzels Reach, Bristol © Historic England More in this Section Explore Career Areas Meet the Team What We Offer What to Expect When You Apply Everyone's Welcome Our Values and Behaviours Apprenticeships Our External Advisers Architectural Investigators Geospatial Survey Team What Could You Do at Historic England? At Historic England, we have all sorts of roles for all sorts of people. So, whether you’re a specialist in your field or just starting out, you’re sure to find a role to suit your skills and interests. Explore career areas Archaeology If you’re looking for an archaeology role at the leading-edge of the heritage sector, look no further. Join us and you’ll share your expert advice as you promote the protection, conservation management and interpretation of the archaeological heritage of our special places, spaces and artefacts.Surrounded by some of the most passionate, progressive and intelligent people in the archaeology field, at Historic England, you’ll have every opportunity to create your legacy as you shape a career to be proud of.Examples of the sorts of roles we recruit toThe diverse nature of our work means there are lots of different archaeology roles on offer at Historic England. Wherever you find yourself, the work you do will make a real impact on our communities, for generations to come.Finds SpecialistMarine ArchaeologistMaritime ArchaeologistZooarchaeologistArchaeological Conservator Architecture Architecture roles like ours don’t come around very often. Here, you’ll work at the leading-edge of the heritage sector, surrounded by some of the most passionate, progressive and intelligent people in your field.Putting your expert technical knowledge and excellent interpersonal skills to use every day, you might find yourself advising on sustainable proposals for the repair of traditional and listed buildings. Or you could spend your time inputting into change proposals for historic townscapes and landscapes.Whatever your role, you’ll have every opportunity to create your legacy as you build a career you love.Examples of the sorts of roles we recruit toThe diverse nature of our work means there are a variety of architecture roles on offer at Historic England. Wherever you find yourself, the work you do will make a real impact on our communities, for generations to come.Assistant Inspector of Historic Buildings and AreasLandscape ArchitectSenior Building Conservation AdviserArchitectural Investigator Engineering and surveying The sheer scale of the work we do at Historic England means that, as one of our engineering or surveying professionals, you’ll have the opportunity to really make an impact and leave a lasting legacy. Whether you’re providing specialist technical services, or delivering strategic leadership on aspects of the care, repair, maintenance and adaption of the historic built environment, your influence will shape the future of our special places and spaces. And what could be more rewarding than that?Examples of the sorts of roles we recruit toThe diverse nature of our work means we have a range of different engineering and surveying roles on offer at Historic England. Wherever you find yourself, you’ll act as a guardian for future generations as you make a real difference to communities up and down the country.Senior Building Services EngineerSenior Structural EngineerGeospatial Survey SurveyorChartered Building SurveyorSenior Quantity Surveyor Facilities management Join us in Facilities Management and you’ll play a key role in ensuring Historic England’s offices, are safe, clean and comfortable at all times. Here, every property – and every day – is different, as you work with other passionate, progressive experts. Supported every step of the way, this is your opportunity to build a career you love knowing you are making a difference to the working environment of your colleagues.Examples of the sorts of roles we recruit toThe diverse nature of our work means there are a variety of Facilities Management roles on offer at Historic England. Wherever you find yourself, you’ll be inspired by our warm, open, collaborative culture as you make a real impact on our working spaces and environment.Facilities ManagerFacilities Assistant <picture> <source srcset="/media/8686/howard-clare.jpg?anchor=center&amp;mode=crop&amp;quality=90&amp;width=300&amp;height=400&amp;upscale=true&amp;rnd=132367723588630000"> <img class="biography__image" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="" aria-labelledby="biography-meettheteam-8bfd5b38-e734-4d65-9227-a8a4e8f35f01"/> </picture> Meet the team Clare Howard, Architectural Investigator Clare worked in commercial archaeology and heritage consultancy before joining Historic England. In her current role, Clare specialises in the research and investigation of heritage of various periods. Her particular interests are in medieval and church architecture.Read Clare's story You’re in a unique position to influence heritage. I’ve been in the air force, a teacher, and have 11 years of engineering experience - but here, I’ve got the opportunity to drive positive change across a wider audience. Read Daniel's story Daniel McNaughton, Senior Building Services Engineer Finance Our Finance department sits at the heart of Historic England. Here, no two days are the same as our teams provide the full range of financial services to our organisation, as well as a range of services to external clients. Join them and you’ll be surrounded by passionate experts in an interesting and varied environment.Examples of the sorts of roles we recruit toThe diverse nature of our work means there are a range of finance roles on offer at Historic England. Wherever you find yourself, you’ll be supported every step of the way as you build a career you love while ensuring our organisation remains at the forefront of the heritage sector.Head of FinanceFinance AssistantFinance Business Partner Human resources From recruiting top talent to developing our diversity and inclusion policies, our HR department provides advice and guidance across Historic England. Join them and you’ll play a vital role in helping us look after our people, so they can focus on caring for some of England’s most important historic places and spaces. By ensuring Historic England remains an incredible place to work, you’ll make a vital contribution to championing our collective heritage and improving people’s lives – for years to come.Examples of the sorts of roles we recruit toThe diverse nature of our work means there are a range of HR roles on offer at Historic England. Wherever you find yourself, you’ll be surrounded by passionate and progressive people, as you build a career to be proud of.HR Shared Service AdministratorHR AdviserHR Business Partners Information management technology From ‘business as usual’ service delivery to maintaining an integrated suite of IT tools, applications and networks, our Information Management and Technology department (IMT) is responsible for the use of technology throughout Historic England. Join them and you’ll play a key role in identifying and implementing the technology which will enable us to continue to care for some of England’s most important historic places for years to come. Supported every step of the way, this is a unique opportunity to build a career you love while ensuring Historic England continues to lead the way in the heritage sector.Examples of the sorts of roles we recruit toThe diverse nature of our work means there are lots of different IMT roles on offer at Historic England. Wherever you find yourself, you’ll be inspired by our warm, open, collaborative culture as you make a real impact on our communities, for generations to come.Change and Communications ManagerHead of Business ImprovementLearning Management System ManagerBusiness Services ManagerInformation Governance Manager <img class="youtube-video__cookies-revoked-placeholder-image" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" srcset="/media/15726/thumbnail.jpg?anchor=center&amp;mode=crop&amp;quality=90&amp;width=220&amp;height=125&amp;upscale=true&amp;rnd=132612506859870000 220w" sizes="(max-width: 1000px) 100vw, 855px" alt=""/> Video not working due to cookies settings Enable YouTube cookies or click here to watch on YouTube <picture> <source type="image/webp" srcset="https://img.youtube.com/vi_webp/PCwEeNV-HPI/mqdefault.webp 320w, https://img.youtube.com/vi_webp/PCwEeNV-HPI/maxresdefault.webp 1280w" sizes="(min-width: 376px) 100vw, 320px"> <source srcset="https://img.youtube.com/vi/PCwEeNV-HPI/mqdefault.jpg 320w, https://img.youtube.com/vi/PCwEeNV-HPI/maxresdefault.jpg 1280w" sizes="(min-width: 376px) 100vw, 320px"> <img src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Video placeholder"> </picture> Thinking about joining Historic England? It’s not just for people with PhDs - and you don’t need to be a historian or an architect to work here. Hannah Hamnett, High Street Heritage Action Project Officer Legal and governance Historic England’s Legal and Governance department provides proactive and pragmatic legal advice across our organisation. Join them and you’ll be surrounded by passionate, progressive people as you provide expert support in accordance with Historic England’s principles, practices and risk appetite. Supported every step of the way, this is a unique opportunity to build a career you love while ensuring Historic England continues to lead the way in the heritage sector.Examples of the sorts of roles we recruit toThe diverse nature of our work means there are a range of legal and governance roles on offer at Historic England. Wherever you find yourself, your work will contribute to improving the lives of communities across the country, for generations to come.SolicitorGovernance Officer Project support, business support and administration Keeping our organisation running smoothly, our administrative and support teams are key to Historic England’s success. With plenty of room to grow and move throughout the organisation, you’ll be supported every step of the way as you build a career to be proud of.Examples of the sorts of roles we recruit toThe diverse nature of our work means there are lots of different business support, project support and administration roles on offer at Historic England. Whether you’re taking care of the all-important administration and support responsibilities for a specific team or an exciting heritage project, the work you do will contribute to keeping Historic England at the forefront of the heritage sector.Executive AssistantPersonal AssistantSenior Business CoordinatorBusiness Support OfficerProject OfficerProject Co-ordinator Planning and conservation It’s down to our planners and conservators to ensure that the government’s planning, growth and housing policies take account of the historic environment.Join them and you’ll collaborate with other passionate, progressive experts across our organisation as you influence our thinking towards policy and action. The work you do here will make a real impact on the lives of communities up and down the country – for generations to come.Examples of the sorts of roles we recruit toThe diverse nature of our work means there are lots of different planning and conservation roles on offer at Historic England. Wherever you find yourself, you’ll have the unique opportunity to leave a lasting legacy as you help shape the future of our organisation.Senior National Planning AdviserEnvironmental Planning AdviserPlanning Adviser - Historic EnvironmentListing Adviser <picture> <source srcset="/media/yz2mwtaw/employees-stand-and-talk-in-swindon-office-library-dsc_8217.jpg?center=0.44932283222389541,0.59399230222312971&amp;mode=crop&amp;quality=90&amp;width=300&amp;height=400&amp;upscale=true&amp;rnd=133008925504570000"> <img class="biography__image" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="" aria-labelledby="biography-meettheteam-4d1187ce-4864-4b5f-a23d-d0b9c0400922"/> </picture> Meet the team Gareth Lopes Powell, 'Enriching the List' Officer There’s a perception that everyone who works here is middle-class - but that’s not true! And you don’t have to come from a heritage background either...Read Gareth's story Policy and data If you’re looking for a policy role with scale and variety, this is it. At Historic England, our policy experts ensure necessary guidance is in place to support consistent, high quality and timely advice and recommendations to Government on Listing, Scheduling and Protected Wrecks. What makes a policy role at Historic England unique? Not only do you play a leading role across the entire heritage sector here, but the work you do will make a real impact on communities up and down the country, for generations to come.Examples of the sorts of roles we recruit toThe diverse nature of our work means there are lots of different policy roles on offer at Historic England. Wherever you find yourself, your work will enable us to continue to improve people’s lives as we lead the way in the heritage sector.Economic AnalystListing Policy OfficerGuidance Development AdviserSocial Analyst Public engagement Join Historic England’s Public Engagement Group and you’ll help us engage diverse communities to inspire people to get involved with historic places they care about. We work with others to improve understanding of heritage through inspirational stories, innovative content, digital engagement, cultural events and learning programmes.Examples of the sorts of roles we recruit toThe diverse nature of our work means there are a variety of Public Engagement roles on offer at Historic England. Wherever you find yourself, you’ll be surrounded by passionate and progressive people as you help us connect with more people to take action in support of the historic environment.Media ManagerSocial Media and Content OfficerCultural Programme CuratorArchive Conservation AssistantHeritage Schools ManagerPhotographer Project management With hundreds of projects ongoing up and down the country, Historic England’s project management teams play a vital role in monitoring and controlling the scope of our work. Join them and you’ll collaborate with other experts at the top of their game as you help us deliver internationally recognised and renowned projects that engage people from all walks of life. Supported every step of the way, this is a unique opportunity to build a career you love while ensuring Historic England continues to lead the way in the heritage sector.Examples of the sorts of roles we recruit toThe diverse nature of our work means there are a variety of different project management roles on offer at Historic England. Wherever you find '''
