["https://historicengland.org.uk/advice"]
title = "Advice & Grants | Historic England"
description = "Celebrate inclusive heritage and ensure your work is diverse and inclusive."
full_description = '''Home Advice & Grants Share this page Share Print Advice & Grants Historic England publishes an extensive range of expert advice and guidance to help you care for and protect historic places. Advice finder Latest Advice and Guidance Find out what advice and guidance we have published in the last six months. A-Z of Guidance Browse and download from our A-Z list of Historic England advice and guidance. Search All Publications Search our wide range of publications including books, periodicals and guidance documents. Planning advice Our advice on heritage and the planning system is there to help both professionals and owners of older buildings to understand how heritage fits into the wider planning agenda. See all planning advice Heritage Works for Housing Repurposing and redeveloping our built heritage has the potential to help create dynamic, comforting and sustainable places to live. Heritage Consents The requirements for each of the principal types of statutory consent are summarised on the relevant pages within this section of the website. The Planning System This page sets out how the planning system works to protect historic places. Conservation Areas This page sets out what conservation areas are and how they are designated and managed. See all planning advice Technical guidance Our technical guidance on looking after historic buildings and sites including climate change adaptation, retrofit and energy efficiency advice; plus briefing on recording, and information and project management. Looking After Historic Buildings How to maintain and repair historic buildings, including advice on the types of materials and treatment methods to use. Building Services Engineering How to look after building services such as electrics, heating, plumbing and ventilation in historic buildings. Information Management This section is aimed at those responsible for recording, curating and maintaining information about the historic environment. Archaeological Science See our advice and guidance on archaeological science. Emergency Planning and Fire Advice Look for advice about fire safety and emergency planning in the heritage sector. Looking After Parks, Gardens and Landscapes How to care for historic designed landscapes including public parks, trees, and lakes, and advice on wildlife, pests and diseases. Recording Heritage How to survey historic places to the best standard possible, using our wide-ranging technical survey guidance. Energy Efficiency and Retrofit in Historic Buildings A range of technical advice to support retrofit for increased energy efficiency in historic buildings. See all technical guidance Your Home If your home is listed, in a conservation area, or simply an older building you can find lots of free, independent, practical advice here on maintaining, repairing and improving it. Your Home's History Finding out about the history of a house - who lived in it and when it was built - can be a challenging but rewarding experience. Owning an Older Home Find out what living in an older or listed building or in a conservation area means for owners. Maintenance and Repairs See our advice on looking after an older home, including how to carry out a maintenance check and where to find professional help. Energy Efficiency and Your Home Find out how to cut your fuel bills and carbon footprint in ways that are sympathetic to the historic character of your building. Making Improvements Find out what permission you will need when making changes to older homes and see our advice on best practice. See all advice for homeowners Climate Change We're facing a global crisis. Historic England recognises the need for urgent action and is committed to achieving net zero. We are researching and promoting how the historic environment can positively contribute to overall global sustainability through adapting and mitigating. Find out more: Climate Change Mitigation Adaptation and Energy Measures Delivering on Climate Change Action and Heritage Find position statements, advice, research and training on climate change and the historic environment. Our Climate Change Strategy A strategy for Historic England’s response to the climate, energy and biodiversity crisis. Our Carbon Reduction Plan This plan sets out our baseline for reducing carbon emissions and our approach to achieving Net Zero by 2040. Find out more: Climate Change Mitigation Adaptation and Energy Measures Caring for heritage If you are involved in caring for a place of worship, such as a church or a synagogue, or you want to find out how to de-clutter your street, you'll find helpful advice here. Community Advice Hub Information for groups and communities to find out more about your historic place and look after heritage. Places of Worship Find out how we can help you to look after your place of worship, from churches to mosques and synagogues to temples. Caring for Rural Heritage Advice and funding for the care of heritage in rural settings as well as research and techniques for managing changes to rural heritage. Cemeteries and Burial Grounds Guidance on the conservation of historic cemeteries and burial grounds and their monuments. Heritage Crime Find out what Historic England is doing to tackle the problem of crime against historic places. See all caring for heritage advice Grants Learn about Historic England grant schemes and other funding available. Our Grant Schemes Grants are an essential part of Historic England's work to protect the nation's heritage. Visit Grant-Aided Places You can visit any of the hundreds of historic properties we have grant-aided in England. Our Grant Priorities Read about Historic England's grant priorities. Grant applications are assessed against our priorities as well as individual scheme criteria. Other Grants Find out about other possible sources of funding you should check before applying for a Historic England grant. More about Grants Heritage and regeneration Heritage can be a catalyst to boost local economies, connect communities and improve quality of life in our villages, towns and cities. Find the resources and inspiration you need to harness the potential of historic places for regeneration. Heritage and Regeneration Advice Hub Explore advice, inspiration and resources for those who want to unlock the potential of historic places to revitalise both communities and local economies. Heritage Action Zones Find out how we have been working to unlock the economic potential of a historic site in your area with our Heritage Action Zones schemes. Better Places Partnership A service and resources for organisations delivering culture, heritage, and sport-led regeneration projects. The service closed in November 2024. Share this page Share Print <div class="he-grid-row "> <div class="he-grid-col-lg-10 he-grid-col-xl-8 mx-auto"> <div class="back-to-top"> <a href="#header" class="back-to-top__link back-to-top-button"> <div class="back-to-top__container"> <div class="back-to-top__icon"></div> </div> <span class="back-to-top__text"> Back to top </span> </a> </div> </div> </div> Please update your browser Our website works best with the latest version of the browsers below, unfortunately your browser is not supported. Using an old browser means that some parts of our website might not work correctly. Chrome Update Chrome Safari Update Safari Firefox Update Firefox Microsoft Edge Update Microsoft Edge Close this message'''
