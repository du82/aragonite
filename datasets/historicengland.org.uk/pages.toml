["https://historicengland.org.uk/about/who-we-are/heritage-belongs-to-everyone"]
title = "Equalities | Historic England"
description = "Find out what Historic England is doing to engage people of different backgrounds, perspectives and needs in our work."
full_description = '''About this image © Carolyn Jenkins News / Alamy Stock Photo Home About Us Who We Are Equalities Share this page Share Print © Carolyn Jenkins News / Alamy Stock Photo More in this Section Commission Executive Team Committees Young Advisers Equalities Heritage should be for everyone We at Historic England condemn racism in any form. We are committed to inclusion, diversity and equality of opportunity in all of our work - but we know that we, and the heritage sector, have a long way to go.Our heritage and our built environment should be a source of knowledge and understanding for everyone. There continues to be a disproportionate weighting in our history books, at our historic sites and in our records, focusing predominantly on white male achievement. This bias must change.England has a rich and complex history. Our buildings, monuments and places sometimes bring us face to face with parts of our history that are painful, or shameful by today's standards. We recognise that there are historic statues and memorials which have become symbols of injustice and a source of great pain for many people. Our sector has a long way to go to be able to tell hidden and uncomfortable stories and we are committed to playing a full part in driving forward the positive change that must happen.We have been working on contested heritage for some time, including in our Immortalised season in 2018. We will continue to engage proactively, and to support conversations with guidance, research and advice to owners, local authorities, councils and communities. We will review the content of entries in the National Heritage List for England to ensure that it reflects the diverse origins of listed statues and memorials. We will expedite this work. It is also important we acknowledge that, as a disproportionately white organisation in a disproportionately white sector, we can sympathise with but not fully understand the negative experiences of our Black, Asian and minority ethnic colleagues working in heritage. But we are committed to developing our understanding of this situation, to examine our behaviours and to challenge biases that prevent us from being truly inclusive. We will also continue to take steps to increase the representation of diverse voices, specifically those from Black people, in our workforce, on our Commission and on our advisory bodies.We will work to ensure that Black lives, past and present, are fully recognised as part of our nation’s history, and our sector’s future.We know that to oppose racism takes more than just a statement – it is about sustained long term change, and this takes time. This is a renewed dedication from us to listen, to support and to take positive action for diversity, inclusion and equality of opportunity at Historic England, and in the heritage sector. How we promote equality and diversity Historic England is working hard to improve diversity both in its workforce and in every aspect of the work we do. Our activities to promote equality and diversity are reviewed annually by Executive Team and Commission.We:Work in partnership with external organisations, such as disability advocacy groups, Black, Asian and minority ethnic heritage organisations, and faith networks, to ensure that we involve and consult people on issues that affect themMake sure the stories we tell represent the diversity of this country. For example, we have produced digital resources on women's history, on disability history and crowd-sourced LGBTQ history and Black and Asian history projectsMake sure our information is accessible to everyoneCheck our policies and activities are fair and inclusive through Equalities Impact Assessments. These are a simple set of procedures and guidelines and make sure we give full consideration to the impact of our work on people with different needsAre committed to minimising the gender pay gap and our approach to pay seeks to reward all staff fairly, regardless of genderWe’ve been working hard to improve the diversity of our workforce in relation to a range of characteristics, with a wide range of initiatives since 2012, including:Setting up a range of staff network groups to provide peer support and advice to us on how to be more inclusiveConcealing names and other information to prevent bias when we are shortlisting who to interviewProviding mandatory baseline training to staff on equality and diversityProviding training on unconscious biasWorking with specialist partner outreach organisations and using inclusive selection techniques to achieve a much broader range of applicants for our apprenticeships (this has already led to an increasingly diverse pool of appointments).Our positive action training placements, which so far have targeted Black, Asian and minority ethnic graduates and undergraduates, but are now widening to people not at university. These are not paid employment, but we provide a bursary to ensure nobody is prevented from participating because of their financial circumstances.Our work on unconscious bias and adjustments to our recruitment process to remove names and other information not relevant to the shortlisting process, has contributed to a steady and sustained upturn in the number of new recruits from a Black, Asian and minority ethnic background.We still have a lot of work to do. Our forthcoming diversity, inclusion and equality strategy will help us to take steps to accelerate our progress. Our strategy for inclusion, diversity and equality The historic environment in England should be accessible and relevant to everyone who lives and visits here, whatever their socio-economic background, race, religion, sexuality, gender, disability, or health.We know that currently we are not reaching large sections of the population and that our workforce is not diverse. Subsequently many of our work programmes and the ways in which we work are not yet inclusive.This strategy is for Historic England. It is not intended as a strategy for the historic environment sector but does include actions which will help develop more diversity in the sector. We have considered carefully our starting point and what we feel can be achieved in 3 years. This strategy does not represent the totality of our ambition but sets out where we need to get to to enable further progress to be realised.Executive Summary Download Inclusion, Diversity and Equality Strategy for Historic England - Executive Summary (PDF, 59.37 KB) Audio Version: 🔊 Listen to the Executive Summary as an MP3 (transcript) Full report and appendices: A Strategy for Inclusion,Diversity and Equality Download A Strategy for Inclusion, Diversity and Equality - November 2020 to March 2023 (PDF, 956.31 KB) Download Inclusion, Diversity And Equality Strategy 2020–23 - Appendix A: Our approach to implementation (PDF, 130.76 KB) Download Inclusion, Diversity And Equality Strategy 2020–23 - Appendix B: Annual Diversity Report 2020 (PDF, 255.50 KB) Download Inclusion, Diversity And Equality Strategy 2020–23 - Appendix C (PDF, 23.61 KB) Download Inclusion, Diversity And Equality Strategy 2020–23 - Appendix D: Our Implementation and Action Plan (PDF, 63.20 KB) Gender Pay Gap Report Download Gender Pay Gap Report 2023 (PDF, 182.98 KB) Download Gender Pay Gap Report 2022 (PDF, 153.19 KB) Download Gender Pay Gap Report 2021 (PDF, 793.56 KB) Download Gender Pay Gap Report 2020 (PDF, 178.27 KB) <figure class="nested-image__image-wrapper"> <picture class="nested-image__picture"> <source srcset="/media/xlug23aa/2a3j344-cropped.jpg?mode=max&amp;quality=90&amp;width=980&amp;height=650&amp;upscale=false&amp;rnd=133703639152000000" media="(min-width: 750px)"> <source srcset="/media/xlug23aa/2a3j344-cropped.jpg?mode=max&amp;quality=90&amp;width=640&amp;height=450&amp;upscale=false&amp;rnd=133703639152000000"> <img class="nested-image__image" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Woman pushing a girl in a wheelchair across a road."> </picture> <figcaption class="nested-image__caption"> <div> <p class="nested-image__caption-text"> Everybody should benefit from England&#39;s spectacular historic environment. &copy; Colin Burdett / Alamy Stock Photo </p> </div> </figcaption> </figure> If you would like any of this information in alternative formats: please contact Customer Services on 0370 333 0607. Share this page Share Print Also of interest Join Accessibility and Disability Inclusion Training Webinars <div class="he-grid-row "> <div class="main-col"> <div class="back-to-top"> <a href="#header" class="back-to-top__link back-to-top-button"> <div class="back-to-top__container"> <div class="back-to-top__icon"></div> </div> <span class="back-to-top__text"> Back to top </span> </a> </div> </div> </div> Please update your browser Our website works best with the latest version of the browsers below, unfortunately your browser is not supported. Using an old browser means that some parts of our website might not work correctly. Chrome Update Chrome Safari Update Safari Firefox Update Firefox Microsoft Edge Update Microsoft Edge Close this message'''
