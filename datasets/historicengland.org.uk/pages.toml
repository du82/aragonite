full_description = '''About this image Clevedon Pier, Marine Parade, Clevedon. © Historic England Archive Home About Us Who We Are Share this page Share Print Clevedon Pier, Marine Parade, Clevedon. © Historic England Archive More in this Section Commission Executive Team Committees Young Advisers Who We Are We're the public body that champions and protects England's historic places.Find out how Historic England is run and how we are funded. Our leadership Commission The Commission is the governing board of the Historic Buildings and Monuments Commission for England and oversees the work of Historic England. Executive Team The Chief Executive is supported by an Executive Team comprising the Executive Directors of Historic England's five operational groups. Committees Find out about the role of Historic England's committees. Our organisation structure Download High-Level Historic England Organogram (PDF, 104.74 KB) How we are funded How We Are Funded Historic England is funded largely by the Department for Culture, Media and Sport. How we work Inclusion, Diversity and Equality Find out what Historic England is doing to engage people of different backgrounds, perspectives and needs in our work. Modern Slavery Transparency Statement Historic England has a zero tolerance policy for any form of modern slavery, coerced labour or human trafficking. Share this page Share Print <div class="he-grid-row "> <div class="main-col"> <div class="back-to-top"> <a href="#header" class="back-to-top__link back-to-top-button"> <div class="back-to-top__container"> <div class="back-to-top__icon"></div> </div> <span class="back-to-top__text"> Back to top </span> </a> </div> </div> </div> Please update your browser Our website works best with the latest version of the browsers below, unfortunately your browser is not supported. Using an old browser means that some parts of our website might not work correctly. Chrome Update Chrome Safari Update Safari Firefox Update Firefox Microsoft Edge U