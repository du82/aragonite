["https://historicengland.org.uk/advice/grants/our-grant-schemes"]
title = "Our Grant Schemes | Historic England"
description = "Grants are an essential part of Historic England's work to protect the nation's heritage."
full_description = '''Home Advice & Grants Grants Our Grant Schemes Share this page Share Print Our Grant Schemes Our grants are an essential part of our work to protect the nation's heritage. The grants we offer are intended for: People who own or manage individual historic sites and need to repair them or understand them better Local authorities, for sites and buildings in their area Organisations that want to encourage better understanding, management and conservation of the historic environment in its many and varied forms In all cases, we expect to have a dialogue with the applicant. Please note that we cannot grant-aid work that began before a written grant offer was made and accepted. Repair Grants Find out about the repair grants Historic England offer for historic sites at risk of being lost. Heritage Protection Commissions and Capacity Building Find out about funding for projects that directly address themes outlined in Historic England’s Research Agenda. Management Agreements for Field Monuments Learn about funding for field monuments and management agreements. Regional Capacity Building Programme Discover what funding is available for local or regional activities and projects to understand, manage and conserve the historic environment. Grants for War Memorials Find out about the war memorials grant scheme. Everyday Heritage Grants Grants for creative projects that focus on heritage connecting people to historic places, specifically those people and places that are overlooked or underrepresented. Acquisition Grants to Underwrite Repairs Notices Learn about the grants we offer to help local authorities underwrite the cost of serving a Repairs Notice on historic buildings in a state of decay. Grants to Underwrite Urgent Works Notices We offer grants to support local authorities in order for urgent work to preserve listed buildings to be carried out. Partnership Schemes in Conservation Areas Find out about our Partnership Schemes in Conservation Areas scheme for preserving and enhancing conservation areas. Grants Given Our grants help to look after some of England's most important buildings and sites. We also fund research to understand and care for them better. Share this page Share Print <div class="he-grid-row "> <div class="he-grid-col-lg-10 he-grid-col-xl-8 mx-auto"> <div class="back-to-top"> <a href="#header" class="back-to-top__link back-to-top-button"> <div class="back-to-top__container"> <div class="back-to-top__icon"></div> </div> <span class="back-to-top__text"> Back to top </span> </a> </div> </div> </div> Please update your browser Our website works best with the latest version of the browsers below, unfortunately your browser is not supported. Using an old browser means that some parts of our website might not work correctly. Chrome Update Chrome Safari Update Safari Firefox Update Firefox Microsoft Edge Update Microsoft Edge Close this message'''
