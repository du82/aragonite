title = "About Historic England | Historic England"
description = "Historic England is the public body that helps people care for, enjoy and celebrate England's spectacular historic environment."
full_description = '''Home About Us Share this page Share Print About Us From the extraordinary to the everyday, our historic places and spaces matter - to you, to us, to the nation. From community centres to cathedrals, homes to highstreets, markets to mills – they are the places we all choose to hold onto, the legacy we want to pass on and the stories we continue to tell. What We Do We work together with people and organisations across England, to discover, protect and bring new life to our shared historic environment. Providing advice, knowledge, support and services, so the history that surrounds us all, lives on and is loved for longer. Historic England’s Role We are the public body that helps people care for, enjoy and celebrate England's spectacular historic environment. Historic England Future Strategy Our Future Strategy to make our Vision for a heritage that is valued, celebrated and shared by everyone become a reality. Corporate Plan Our Corporate Plan provides a framework for our work as an organisation with a focus on six priority areas. Annual Report and Accounts Read our latest Annual Report and Accounts. Our Role With English Heritage Find out about the relationship between Historic England and the English Heritage Trust. What We Do How We Are Funded Historic England is funded largely by the Department for Culture, Media and Sport. Find out more about how income is structured, and how we spend it. How We Are Funded How We Spend Our Money Transparency Data Annual Report and Accounts How We Are Funded Transparency Data How We Spend Our Money Annual Report and Accounts How We Are Funded Who We Are Meet the members of our Commission, Executive Team and Committees. Commission The Commission is the governing board of the Historic Buildings and Monuments Commission for England and oversees the work of Historic England. Executive Team The Chief Executive is supported by an Executive Team comprising the Executive Directors of Historic England's five operational groups. Committees Find out about the role of Historic England's committees. Inclusion, Diversity and Equality Find out what Historic England is doing to engage people of different backgrounds, perspectives and needs in our work. Modern Slavery Transparency Statement Historic England has a zero tolerance policy for any form of modern slavery, coerced labour or human trafficking. Who We Are Careers Interested in a career at Historic England? We’re always looking for passionate people with fresh perspectives to join us. Search All Jobs See the latest job vacancies at Historic England. Apprenticeships at Historic England Our apprenticeships are open to everyone and offer you a paid learning opportunity across heritage and support roles. Volunteer with Historic England Have fun meeting new people and learning new skills as a volunteer with Historic England. Everyone's Welcome We’re looking for new ways to promote the past. To make it inclusive to all, we need people with fresh perspectives, from all walks of life, to join. What Could You Do at Historic England? We’ve got opportunities up and down the country. Whatever your background, there’s sure to be a place for you at Historic England. Careers at Historic England Contact Us Customer Services Got a question? Get in touch with our friendly and helpful Customer Services Team Email [email protected] Telephone 0370 333 0607 Contact Us Find out how to get in touch with our national and regional offices. Stay up to Date Follow Historic England on social media and sign up to receive our newsletter. Access to Information Here you can find out about our data protection policy and how you can access any of your information that we may hold. Position statement: zero tolerance Historic England's zero tolerance position statement and unacceptable behaviour policy. Climate Change We’re facing a global crisis. Historic England recognises the need for urgent action and is committed to achieving net zero. We are researching and promoting how the historic environment can positively contribute to overall global sustainability through adapting and mitigating. Delivering on Climate Change Action and Heritage Find position statements, advice, research and training on climate change and the historic environment. Our Climate Change Strategy A strategy for Historic England’s response to the climate, energy and biodiversity crisis. Our Carbon Reduction Plan This plan sets out our baseline for reducing carbon emissions and our approach to achieving Net Zero by 2040. Climate Change Mitigation Adaptation and Energy Measures Share this page Share Print <div class="he-grid-row "> <div class="he-grid-col-lg-10 he-grid-col-xl-8 mx-auto"> <div class="back-to-top"> <a href="#header" class="back-to-top__link back-to-top-button"> <div class="back-to-top__container"> <div class="back-to-top__icon"></div> </div> <span class="back-to-top__text"> Back to top </span> </a> </div> </div> </div> Please update your browser Our website works best with the latest version of the browsers below, unfortunately your browser is not supported. Using an old browser means that some parts of our website might not work correctly. Chrome Update Chrome Safari Update Safari Firefox Update Firefox Microsoft Edge Update Microsoft Edge Close this message'''
