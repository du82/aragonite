full_description = '''Home Advice & Grants Inclusive Heritage Advice Hub Share this page Share Print Inclusive Heritage Advice Hub Updated 27 November 2024 The Inclusive Heritage Advice Hub is part of Historic England's commitment to supporting the heritage sector in becoming more diverse. It features several topic sections of digestible information for any organisation wishing to celebrate inclusive heritage and ensure their work is as diverse and inclusive as possible. If you are interested in having your case study featured on the Hub, please look at our page on how to contribute a case study. For other input, feedback and questions, contact the Inclusive Heritage Team. Inclusion and Diversity in the Workplace Advice and practical tips on creating an inclusive workplace culture. Diverse Workforces in the Heritage Sector Advice on the benefits of diversifying and supporting your workforce and how to collect associated data to aid this process. Inclusive Governance Boards and Diverse Trustees Advice about diversifying and supporting governance roles. Understanding and Working with Diverse Audiences and Participants Advice on how best to undertake work with diverse audiences and participants. Exploring Diverse Histories Advice on how best to explore diverse histories in your work and in the heritage sector. Training and Professional Development Signposting to inclusion, diversity and equality training and professional development opportunities. Share this page Share Print Also of interest Our Inclusion, Diversity and Equality Strategy Everyday Heritage Grants Community Advice Hub <div class="he-grid-row "> <div class="he-grid-col-lg-10 he-grid-col-xl-8 mx-auto"> <div class="back-to-top"> <a href="#header" class="back-to-top__link back-to-top-button"> <div class="back-to-top__container"> <div class="back-to-top__icon"></div> </div> <span class="back-to-top__text"> Back to top </span> </a> </div> </div> </div> Please update your browser Our website works best with the