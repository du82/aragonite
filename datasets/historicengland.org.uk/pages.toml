["https://historicengland.org.uk/advice/caring-for-heritage/places-of-worship"]
title = "Places of Worship | Historic England"
description = "Find out how we can help you to look after your place of worship, from churches to mosques and synagogues to temples."
full_description = 'About this image United Reformed Church, High St, Wellingborough. © Historic England Archive View image record DP081003 Home Advice & Grants Caring for Heritage Places of Worship Share this page Share Print United Reformed Church, High St, Wellingborough. © Historic England Archive View image record DP081003 More in this Section Community Advice Hub Your Business Cemeteries and Burial Grounds Heritage Crime Improve Your Street Places of Worship Maintenance and Repair of Places of Worship Making Changes to Places of Worship Listed Places of Worship and Permissions Opening and Welcoming Places of Worship Understanding Places of Worship New and Additional Uses for Places of Worship Places of Worship at Risk Support Officers New Works in Cathedrals Taylor Review Pilot Rural Heritage Transferring Local Authority Assets Looking After Our Industrial Heritage How to Save a Building Get Local Government Help to Protect Your Area Wellbeing and Heritage Advice Support Us Places of Worship England’s historic places of worship are managed and maintained by thousands of volunteers who give their time and raise money to make them fit for use. Historic England supports their faithful efforts to care for these special places, keeping them open for worship and many other cultural, social and educational purposes in the twenty-first century. These pages will help you to understand:What makes your building significantWhether it is listed as nationally importantHow you get the permissions needed to carry out repairs, maintenance and adaptationsIssues to think about when making changes to your place of worshipWhat to do when considering a new or alternative use for a place of worship. What do we mean by a place of worship? We are often asked why we don’t simply use the word ‘church’. The answer is that a wide range of denominations and faiths are using historic buildings. Most are Christian churches or chapels but there is also a rich heritage of meeting houses, synagogues, gurdwaras, temples, mandirs and mosques, plus an increasing number of secular buildings now being used by faith groups, such as former schools and cinemas. If they are open for public worship six times a year then they all count as places of worship. Our job is to offer advice to all of these groups. What do you want to do? Looking after an historic place of worship is a challenge. By providing informal advice we can help with the technical issues and legal processes you will encounter as you develop ideas. We also have a statutory role in the planning system once your proposals have been fully developed and submitted to the relevant authorising body. We offer specific advice on: Doing work to maintain or repair your building Making internal changes or installing new facilities for community use Finding help to develop a project or organise fundraising Dealing with the impact of specific challenges Whatever you are planning we can give you the initial support to get you on your way.Please refer to our Making Changes section if you are considering altering your place of worship. Share this page Share Print <div class="he-grid-row "> <div class="main-col"> <div class="back-to-top"> <a href="#header" class="back-to-top__link back-to-top-button"> <div class="back-to-top__container"> <div class="back-to-top__icon"></div> </div> <span class="back-to-top__text"> Back to top </span> </a> </div> </div> </div> Please update your browser Our website works best with the latest version of the browsers below, unfortunately your browser is not supported. Using an old browser means that some parts of our website might not work correctly. Chrome Update Chrome Safari Update Safari Firefox Update Firefox Microsoft Edge Update Microsoft Edge Close this message'
