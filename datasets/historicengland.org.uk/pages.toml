["https://historicengland.org.uk/advice/climate-change"]
title = "Delivering on Climate Change Action and Heritage | Historic England"
description = "Find position statements, advice, research and training on climate change and the historic environment."
full_description = 'Home Advice & Grants Climate Change Share this page Share Print Delivering on Climate Change Action and Heritage Published 29 October 2021 Updated 30 January 2025 Climate change is one of the greatest challenges of our time. We must reduce greenhouse gas emissions to limit global warming and avoid the worst impacts. We must also adapt to the current and future impacts as the climate continues to change over the coming decades. The historic environment has a significant role to play. On this page you can find out more about our climate change response, advice and guidance for owners and professionals, and our research. Our Climate Change Response Historic England firmly supports urgent climate action and has a broad programme of work to help manage this change. Our Corporate Plan sets out our Climate Action priorities and the activities we will carry out to deliver them. Our Climate Change Strategy (March 2022) Our Climate Change Strategy presents our response to the climate change crisis. Our Carbon Reduction Plan Our Carbon Reduction Plan details our commitment to transition to Net Zero for our own operations by 2040. Climate Change Adaptation Report 2024 Our Climate Change Adaptation Report explains the work we have done previously in response to the risks to heritage from climate change. Advice and guidance Our Your Home pages provide practical advice to homeowners and occupiers on maintaining, repairing and improving historic buildings to increase energy efficiency and resilience to flooding. Heritage organisations or businesses using historic buildings can find out how to move towards net zero carbon emissions. Our Technical Guidance, including our Technical Tuesday webinars, provides advice on looking after historic buildings and sites, including climate change adaptation, retrofit and energy efficiency advice. Our Planning advice helps professionals and owners of historic buildings to understand how change is managed through the planning system, including the delivery of climate change mitigation and adaptation. Energy Efficiency and Your Home Find out how to cut your fuel bills and carbon footprint in ways that are sympathetic to the historic character of your building. Adapting Historic Buildings for Energy and Carbon Efficiency: Advice Note 18 Approaches to improve the energy efficiency and support carbon reduction of historic buildings, whilst conserving their significance. Energy Efficiency and Retrofit in Historic Buildings A range of technical advice to support retrofit for increased energy efficiency in historic buildings. Nature Recovery and Heritage Advice and research on how the historic environment can support nature recovery Delivering Net Zero Local Data Demand for Retrofitting Skills An interactive map and dashboard of local data on the estimated need for retrofitting skills to deliver Net Zero for England’s historic buildings. Overheating This page looks at overheating in historic buildings and how to mitigate its impacts by keeping buildings cool and providing adequate ventilation. Flooding and Historic Buildings Many historic buildings are at risk of flooding from rivers, the sea, and surface/ground water. See our advice on preparing for and responding to flooding. Helping Your Organisation Towards Net Zero Guidance on how to get to net zero for heritage organisations or businesses using historic buildings. Climate Change Risks and Hazards Advice to help decision makers understand climate change risks and hazards for heritage. Research Our research helps us to build and develop a strong evidence base to better understand the risks and impacts of climate change, to develop the appropriate responses to ensure heritage is protected for future generations, to demonstrate the positive role heritage can play in addressing the climate crisis, and the skills and resources needed. Heritage and Carbon: Addressing the Skills Gap Retrofitting the UK’s historic buildings could generate £35bn of economic output a year while creating new construction jobs and supporting the country’s net zero ambitions. Climate Change Research: Impacts, Issues and Responses We’re researching the direct and indirect impacts of climate change, the effects on the historic environment and how we can respond. Coastal Risk and Priority Places Report This project centred on the creation of an interactive map resource that displays heritage assets sensitive to coastal change. Heat Pumps in Historic Buildings Ten case studies reviewing the performance of air source heat pump (ASHP) technology in homes, offices, shops and two small churches across England. Carbon in the Built Historic Environment The Heritage Counts 2019 report on the role of pre-1919 traditional buildings in a low carbon future. Key External Links Climate Creative Challenge: new approaches for communicating climate change responses Historic Environment Forum’s ‘Heritage Responds’ (October 2021) Climate Heritage Network Heritage Declares Climate Creative Challenge: new approaches for communicating climate change responses Climate Heritage Network Historic Environment Forum’s ‘Heritage Responds’ (October 2021) Heritage Declares Share this page Share Print Also of interest Your Home Technical Guidance Technical Conservation Guidance Brochure, Newsletter and Webinars <div class="he-grid-row "> <div class="he-grid-col-lg-10 he-grid-col-xl-8 mx-auto"> <div class="back-to-top"> <a href="#header" class="back-to-top__link back-to-top-button"> <div class="back-to-top__container"> <div class="back-to-top__icon"></div> </div> <span class="back-to-top__text"> Back to top </span> </a> </div> </div> </div> Please update your browser Our website works best with the latest version of the browsers below, unfortunately your browser is not supported. Using an old browser means that some parts of our website might not work correctly. Chrome Update Chrome Safari Update Safari Firefox Update Firefox Microsoft Edge Update Microsoft Edge Close this message'
