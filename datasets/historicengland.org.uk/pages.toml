["https://historicengland.org.uk/advice/caring-for-heritage/rural-heritage"]
title = "Caring for Rural Heritage | Historic England"
description = "Advice and funding for the care of heritage in rural settings as well as research and techniques for managing changes to rural heritage."
full_description = '''Home Advice & Grants Caring for Heritage Rural Heritage Share this page Share Print Caring for Rural Heritage Here you can find a range of advice to support you in caring for rural heritage. The resources available here include links to Historic England's research into rural heritage and guidance on managing change to this heritage at both landscape level and at the level of individual buildings or sites such as farmsteads. You can also find out about funding and other forms of support for rural heritage. Rural heritage England's rural landscape is a jewel of our national heritage, formed by people living on and working the land over thousands of years. It includes a great range of heritage assets from historic buildings to archaeological remains. What Is Rural Heritage? England's rural landscape includes a great range of heritage assets from historic buildings to archaeological remains. Rural Planning This page sets out how planning in the countryside differs from that in urban areas, and points to sources of further information. Protecting rural heritage Farm Buildings and Traditional Farmsteads Our advice and approach for ensuring the historic character, survival and use of traditional and historic farm buildings. Protected Rural Landscapes How we work with National Parks and the National Association of Areas of Outstanding Natural Beauty. Landscapes & Areas The historic environment is managed not only at the level of individual buildings, sites or monuments, but also in terms of entire landscapes. Support and funding Support and Funding for Rural Heritage Rural heritage can benefit from programmes that offer advice and funding for the care of heritage in rural settings. Metal Detecting A summary of the conditions regarding metal detecting on agri-environment land. Creating New Woodland Find the information and advice you need to create new woodland whilst also protecting the historic environment. Research and techniques Our research explores new ways of appreciating and understanding the rural historic environment and informs the ways we manage change to rural buildings and landscapes. Farmsteads Character A series of reports to help understand the local character of farmsteads in England. Rural Buildings Research Read about our recent research which assesses the character and significance of rural buildings across England’s countryside. Historic Characterisation Revealing the patterns and connections within a landscape, spatially and through time, for example in relation to buildings and patterns (of fields, streets and routeways). Atlas of Rural Settlement A downloadable spatial data of 19th century settlements and terrain in England based on the Atlas of Rural Settlement. Share this page Share Print Also of interest Peatlands <div class="he-grid-row "> <div class="he-grid-col-lg-10 he-grid-col-xl-8 mx-auto"> <div class="back-to-top"> <a href="#header" class="back-to-top__link back-to-top-button"> <div class="back-to-top__container"> <div class="back-to-top__icon"></div> </div> <span class="back-to-top__text"> Back to top </span> </a> </div> </div> </div> Please update your browser Our website works best with the latest version of the browsers below, unfortunately your browser is not supported. Using an old browser means that some parts of our website might not work correctly. Chrome Update Chrome Safari Update Safari Firefox Update Firefox Microsoft Edge Update Microsoft Edge Close this message'''
