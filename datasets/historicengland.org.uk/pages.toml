["https://historicengland.org.uk/about/how-we-are-funded"]
title = "How We Are Funded | Historic England"
description = "Historic England is funded largely by the Department for Culture, Media and Sport."
full_description = 'About this image Spiral staircase Home About Us How We Are Funded Share this page Share Print Spiral staircase More in this Section How We Spend Our Money How We Are Funded Published 6 August 2018 Updated 10 July 2024 The Historic Buildings and Monuments Commission for England (HBMCE) was established by the National Heritage Act 1983 and until 31 March 2015 was known as English Heritage. On 1 April 2015 English Heritage separated into two organisations: Historic England, the public body that champions and protects England’s historic environment andThe English Heritage Trust that looks after the National Heritage Collection consisting of 400 historic sites, such as Stonehenge and Dover Castle In the past, we were funded by a mixture of grant-in-aid (GIA) from the government and commercial income (memberships, admissions and retail etc) from running the National Heritage Collection,From 1 April 2015 the English Heritage Trust took over the day to day running of the National Heritage Collection, and Historic England no longer derived any income from this source. Income from grant-in-aid In 2023/24 Historic England received £101.5 million in grant-in-aid from the Department for Culture, Media and Sport.Our Framework Agreement with Government provides the context and framework for our work and sets out our key activities for the money we receive. Self-generated income Historic England also receives a small amount of other funding, such as research grants and lottery funding, for particular projects. Share this page Share Print Also of interest Framework Agreement Next steps See how we spend our money Read our annual report Find out what we do Find out about the relationship between Historic England and the English Heritage Trust <div class="he-grid-row "> <div class="main-col"> <div class="back-to-top"> <a href="#header" class="back-to-top__link back-to-top-button"> <div class="back-to-top__container"> <div class="back-to-top__icon"></div> </div> <span class="back-to-top__text"> Back to top </span> </a> </div> </div> </div> Please update your browser Our website works best with the latest version of the browsers below, unfortunately your browser is not supported. Using an old browser means that some parts of our website might not work correctly. Chrome Update Chrome Safari Update Safari Firefox Update Firefox Microsoft Edge Update Microsoft Edge Close this message'
