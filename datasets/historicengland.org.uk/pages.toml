description = "Find out what Historic England is doing to tackle the problem of crime against historic places."
full_description = '''Home Advice & Grants Caring for Heritage Heritage Crime Share this page Share Print Heritage Crime This section explores how crime and anti-social behaviour are affecting historic sites and buildings in England. You can find guidance on how to report a heritage crime, read articles about key issues, and learn how you can support our initiatives in tackling local crime. What is Heritage Crime? The definition of heritage crime and the scale of the issue in England. Report a Heritage Crime When you should call 999 or 101, and what happens next. Preventing Heritage Crime Action you can take to deter criminal behaviour in your local area. Follow the Heritage Crime team on Twitter Support and guidance This section contains information on heritage crime initiatives. It also features advice aimed at supporting local authorities and other organisations in tackling local crime. Metal Theft from Places of Worship Guidance on ways of preventing the theft of metals from historic buildings, particularly places of worship. Memorandum of Understanding A Memorandum of Understanding forms a key component in the partnership to tackle heritage crime in England and Wales. Local Authorities: Dealing with Heritage Crime Information for local authorities and other organisations who deal with the consequences of heritage crime. Heritage Crime Enforcement Neighbourhood Policing, used to tackle local crime and anti-social behaviour, also provides a useful model for tackling heritage crime. Articles and further reading Taking the Lead: Protecting Heritage Metal Can We Assume Legislative Change Will Reduce Crime? Scrap Metal Merchants: It's Time to Challenge and Ask the Right Questions What Will It Take to Combat Heritage Crime? Government Has Reviewed the Scrap Metal Dealers Act. Now What? Policing Our Past Protecting Heritage at Sea Local Partnerships Tackling Heritage Crime Together The Development of the Heritage Crime Programme in England Taking the Lead: Protecting Heritage Metal Policing Our Past Can We Assume Legislative Change Will Reduce Crime? Protecting Heritage at Sea Scrap Metal Merchants: It's Time to Challenge and Ask the Right Questions Local Partnerships Tackling Heritage Crime Together What Will It Take to Combat Heritage Crime? The Development of the Heritage Crime Programme in England Government Has Reviewed the Scrap Metal Dealers Act. Now What? Taking the Lead: Protecting Heritage Metal What Will It Take to Combat Heritage Crime? Protecting Heritage at Sea Can We Assume Legislative Change Will Reduce Crime? Government Has Reviewed the Scrap Metal Dealers Act. Now What? Local Partnerships Tackling Heritage Crime Together Scrap Metal Merchants: It's Time to Challenge and Ask the Right Questions Policing Our Past The Development of the Heritage Crime Programme in England Explore more Learn more Heritage Crime: E-learning module for police officers An online training scenario for Police Officers, Police Community Support Officers and Specialist Constables in an urban setting. Heritage Crime: E-learning module for crown prosecutors An online training scenario for Crown Prosecutors, providing guidance on identifying and successfully prosecuting heritage crime. Heritage Crime Risk Assessment Guidance on assessing and quantifying relative crime risks and to implement cost-effective measures to address those risks. Extent of Heritage and Cultural Property Crime in England Revealed New research funded by Historic England identifies the range of active and emerging threats to the historic environment. In partnership with Share this page Share Print Related publications Theft of Metal from Church Roofs: Prevention and Response Published 10 September 2021 Theft of Metal from Church Roofs: Replacement Materials Published 10 September 2021 Heritage Crime Prevention Advice for those who care for heritage assets Published 8 June 2023 Insuring Historic Buildings and other Heritage Assets Published 1 December 2018 Graffiti on His