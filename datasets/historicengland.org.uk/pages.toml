["https://historicengland.org.uk/advice/climate-change/risks-and-hazards"]
title = "Climate Change Risks and Hazards | Historic England"
description = "Advice to help decision makers understand climate change risks and hazards for heritage."
full_description = 'About this image The hillfort at Seaford Head, East Sussex, is a scheduled monument at risk from coastal erosion. © Historic England Home Advice & Grants Climate Change Risks and Hazards Share this page Share Print The hillfort at Seaford Head, East Sussex, is a scheduled monument at risk from coastal erosion. © Historic England More in this Section Our Strategy Delivering Net Zero Local Data Demand for Retrofitting Skills Risks and Hazards Responses to Climate Change Nature Recovery and Heritage Heat Pumps and Solar Panels Can Work for Older Buildings Climate Change Risks and Hazards Published 6 September 2024 Updated 3 February 2025 Our changing climate poses a major environmental, social and economic problem to society, including our historic environment. Understanding the risks climate change poses to our historic sites and places will help us plan our responses to its impacts and identify opportunities to adapt and become more resilient.On this page, you can find out about our developing work to understand risks to heritage, including information on how to monitor and quantify risks and tools to map climate-related hazards. The historic environment sector will need to understand these to comply with different regulations and apply policy. By considering climate change risks in our decision-making processes, we will be able to make more climate resilient and energy efficient decisions for our heritage assets and historic places. Contents Climate change risk Definitions: climate change hazards and impacts Risks to heritage Our climate hazard vocabulary Climate change and heritage training What tools are available to help understand climate change risk to heritage? Climate change risk We are working to identify, understand and respond to the long-term impacts of climate change. This is a constantly evolving area and we are working to ensure these impacts are considered in our guidance and data. Climate change risk refers to the potential negative consequences for human or ecological systems from the potential impacts of climate change, or from human responses to it. (Definition by the Intergovernmental Panel for Climate Change). Climate change also acts as a ‘risk multiplier’, which means the effects of climate change are likely to magnify existing issues. For example, changing weather patterns may cause more intense rainfall in areas already at risk from flooding. Multiple climate effects can also act together to cause combined impacts. For example, erosion at the coast caused by higher sea levels in combination with ground instability caused by heavy rainfall leading to landslides.We do not yet fully understand the long-term risks and impacts of climate change for our heritage. However, we know that we can expect to see, and in some places are already seeing, climate change effects across the country.These will include:Increased temperaturesChanging rainfall patternsSea-level riseSevere weather eventsFlooding.The potential occurrence of effects which may cause damage to heritage assets, which we refer to as climate hazards, might be felt differently across the country over different timescales. They might also act together to cause combined hazards, such as wind-driven rain. Definitions: climate change hazards and impacts The distinction between key terms relating to climate change risk assessment, including hazard, impact and driver, can be confusing. We use definitions set out by the Intergovernmental Panel on Climate Change (IPCC), aligning cultural heritage with international climate change science. The IPCC is the United Nations body for assessing the science related to climate change.Climate change hazards are the potential occurrences of natural or physical events that may cause damage or loss, such as rising sea-levels or increased temperatures. Climate change impacts are the consequence of climate hazards acting upon assets which are both exposed and vulnerable to them.Responses to the risks presented by climate hazards should be grounded in best practice by ensuring that options appraisals are informed using accurate evidence. Such appraisals should be informed by those who know the site, and should also consider that the site’s future use might be different from the current use/s. One solution fits all approaches are not appropriate, as these come from an assumption that every site will be the same – all sites have unique characteristics. Term Definition Driver Any natural or human-induced factor that directly or indirectly causes a change in a system Climactic Impact-Driver A physical climate condition that directly affects society or ecosystems Hazard The potential occurrence of a natural or human-induced physical event or trend that may cause loss of life, injury or other health impacts, as well as damage and loss to property, infrastructure, livelihoods, service provision, ecosystems and environmental resources Impact The consequence of realised risks on natural and human systems, where risks result from the interactions of climate-related hazards (including extreme weather and climate events), exposure, and vulnerability. Impacts may be referred to as consequences or outcomes, and can be adverse or beneficial Compound hazard / climate event The combination of multiple drivers and/or hazards that contributes to societal and/or environmental risk UK Climate Projections (UKCP) This is data developed by the Met Office to show how the UK climate may change in future. The most recent is UKCP18. Caption: This table, with citations, is set out in a Historic England research report. <figure class="nested-image__image-wrapper"> <picture class="nested-image__picture"> <source srcset="/media/kkvnt4gb/metofficegovuk_xxlarge_web.jpg?mode=max&amp;quality=90&amp;width=980&amp;height=650&amp;upscale=false&amp;rnd=133688934751000000" media="(min-width: 750px)"> <source srcset="/media/kkvnt4gb/metofficegovuk_xxlarge_web.jpg?mode=max&amp;quality=90&amp;width=640&amp;height=450&amp;upscale=false&amp;rnd=133688934751000000"> <img class="nested-image__image" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt=""> </picture> <figcaption class="nested-image__caption"> <div> <p class="nested-image__caption-text"> Drivers and impacts of climate change &copy; Met Office </p> <details class="long-description" data-long-description> <summary class="long-description__button" tabindex="0"> <span class="long-description__button-text"> <span data-text-update>Show</span> detailed description </span> </summary> <p class="long-description__text"> A diagram showing drivers of climate change, changes to the climate system and impacts, depicted as concentric rings. In the centre are the drivers: greenhouse gases, aerosol emissions and land use change. The next ring out depicts changes to the climate system: changes in the hydrological cycle, warmer land and air, warming oceans, melting ice, rising see levels, ocean acidification, global greening, change in ocean currents, more extreme weather. The outer ring depicts the impacts: risk to water supplies, conflicts and climate migrations, localised flooding, flooding of coastal regions, damage to marine ecosystems, fisheries failing, loss of biodiversity, change in seasonality, heat stress, habitable region of pests expands, forest morality and increased risk of fire, damage to infrastructure, food insecurity. </p> </details> </div> </figcaption> </figure> Risks to heritage The section below sets out some of the key climactic impact drivers and associated hazards, along with their potential impacts for heritage assets. Specific information on the effects of climate change on our historic buildings can be found on our Technical Advice pages. Climactic impact driver and associated hazards Impacts on heritage Coastal change: relative sea level, coastal flood, coastal erosion Britain’s coastline has changed continually, but the rate of change and where its greatest impacts will be are affected by these coastal hazards. Consequences are potentially the total loss of or significant damage to individual heritage assets.Sand dunes, peats and other inter-tidal deposits are likely to come under greater threat if wave energy and storminess increase. Heat and cold: average temperature, high temperature events, uncontrolled fire In the sea, temperature increase is affecting conditions that have previously preserved a rich maritime heritage. On land, it may lead to changing patterns of land use that could present challenges for terrestrial heritage. Increasing temperatures give rise to different flora and fauna, some of which may be harmful to our heritage. This is likely to have a major impact on plants, particularly trees, affecting the appearance of designed landscapes. New pests and diseases may affect designed landscapes, buildings and collections. Some collection materials and building fabric can also be impacted by high temperature events.Increasing temperatures and reduced summer precipitation will increase risk of uncontrolled fire which will affect archaeological sites, historic buildings and structures and collections. Wet and Dry: average precipitation patterns, heavy precipitation events, wind-driven rain Intense pluvial events, and persistent periods of rainfall on saturated or impermeable ground, can damage buildings, flood historic areas and landscapes, affect planting in designed landscapes, and exacerbate erosion.Rain or floodwater inundation can damage historic structures, particularly if rainwater goods are inadequate. See our guidance on resilient rainwater systems.Flood water inundation and saturation can also damage historic buildings and designed landscapes, particularly if standing water conditions persist. Floodplains and valley bottoms are also likely to experience an increase in the frequency and intensity of floods, destabilising structures and bridges as river courses change. Heat and Cold & Wet and dry: average humidity patterns, rapid humidity fluctuations Collections and building fabric can be heavily impacted by fluctuations in humidity, and high and low humidity events Wet and dry: hydrological, agricultural and ecological drought, landslide, shrink-swell, desiccation Drought can harm plants that make up designed and historic landscapes, affect archaeological deposits, in particular waterlogged deposits, affect the stability of buildings and other structures. It can affect ground stability and exacerbate erosion. Desiccation of wetlands can have a dramatic effect on the preservation of waterlogged archaeological and palaeo-environmental material. The drying out of certain geologies (for example, clay) can affect ground stability and increase subsidence affecting historic structures and affecting archaeological sites. Preservation in situ (in the ground) will become increasingly difficult as these damaging cycles create stressful environments for buried archaeology, see our guidance on the preservation of archaeology in situ. Compound hazards Several potential risks could manifest due to compound hazards. Further research is needed to understand the potential future impacts on heritage, such as assessing how changes in temperature and relative humidity will affect insect pest populations and plant growth. OpportunitiesThere are also potential opportunities for heritage within climate change action or due to climate change impacts, including:New discoveries, for example dry conditions revealing archaeological sitesProlonged fieldwork seasons and extended tourist season with opportunities for increased interest in heritageLearning from the past: the historic environment can inform integrated solutions such as management and adaptation approaches that deliver for biodiversity, heritage protection, and climate actionAdvocating for the positive role the historic environment can play in climate actionIncreased opportunities for community engagement and broadening access to heritageGreater collaboration with existing and new partners for knowledge, expertise and data. Our climate hazard vocabulary We have developed a standardised vocabulary of climate hazards for heritage. The vocabulary sets out key terms and defines over 50 hazards which could impact heritage assets, including those listed in the section on risks to heritage above.The use of these standardised terms can allow heritage professionals to consistently record which hazards sites are at risk from. This can inform assessments of climate change impacts on both single heritage sites and the wider historic environment.We have published a research report outlining the definitions we are using in our work, the method behind the hazard vocabulary, and information on how it could be used to inform climate change risk assessment on site.The full hazard vocabulary is available as a thesaurus on the Forum for Information Standards in Heritage (FISH) and as a downloadable Excel spreadsheet. Climate change and heritage training Our Climate Change and the Historic Environment programme delivers training that will deepen understanding of the role that the historic environment can play in climate action and aid the deployment of existing and emerging government policies, legislation and good practice.The programme is aimed primarily at local authority historic environment services, planning officers, other professionals whose advice-giving or decision-making affects the historic environment, and heritage organisations involved in climate change adaptation or mitigation measures.Find out more on our training pages. What tools are available to help understand climate change risk to heritage? There is a large volume of publicly available information and data on climate change risk. Information is available from a range of organisations including the Met Office, agencies like the Environment Agency, research institutions like the UK Centre for Ecology and Hydrology and the private sector. It can be a challenge to find the best data to inform risk assessment at site level.Our project to identify tools and resources sets out sources of information to help owners and managers understand the potential risk to their heritage sites from climate change hazards.Climate data tools range from simple PDF documents to online web portals showing hazards mapped at different spatial scales (from local to national), to complex tools requiring users to have technical experience with the software.Some of the best available resources are summarised below – whether you are just starting to consider how climate change may affect your site or looking to carry out a more detailed climate change risk assessment for particular hazards. The tools identified below are freely available and most have detailed user guides contained within them.Some local authorities may have local data available online and there are also multiple sources of paid-for data. Due to the ever-expanding volume of climate change data resources, we are not able to '
