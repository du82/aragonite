["https://historicengland.org.uk/advice/grants/our-priorities"]
title = "Our Grant Priorities | Historic England"
description = "Read about Historic England's grant priorities. Grant applications are assessed against our priorities as well as individual scheme criteria."
full_description = 'About this image Aerial view of Peace Gardens, Sheffield, South Yorkshire. © Historic England Archive View image record DP136254 Home Advice & Grants Grants Our Grant Priorities Share this page Share Print Aerial view of Peace Gardens, Sheffield, South Yorkshire. © Historic England Archive View image record DP136254 More in this Section Our Grant Schemes Our Grant Priorities Procurement Regulations Acknowledging Your Grant Visit Grant-Aided Places Subsidy Control Fundraising Tips Other Grants Culture Recovery Fund Our Grant Priorities As you would expect, there is a high demand for our grants. This means we cannot always offer a grant to every project that meets published grant scheme criteria. Grant applications are therefore assessed against our priorities as well as individual scheme criteria.Please note that we also assess all the projects that we fund on how they will achieve outcomes that deliver public value. Historic England has adopted a public value framework (PVF) to provide assurance to its stakeholders, including the taxpaying public, that it invests public money in ways that optimise value. Please refer to our public value framework page for more information.We strongly recommend that you contact your local office to discuss your project before making any grant application. National priorities We typically expect all projects seeking a grant to meet one of our national priorities. These are:Significant elements of the historic environment at riskActivities that strengthen the ability of the sector to reduce or avoid risk to the historic environment by understanding, managing and conservingOur Heritage at Risk Register shows the most significant elements of the historic environment at risk that we currently know about. If you are considering making a grant application for project development and/or repair work at a site that does not appear on the Heritage at Risk Register, you should check whether it might be eligible for a grant by contacting your local Historic England office.As we are unlikely to be able to help all priority projects in any single year, we will focus on those projects where there is a realistic opportunity to achieve progress now.We also need to be satisfied that you have explored other sources of charitable, private and public funding (for example, the National Lottery Heritage Fund). In some cases, we will be willing to help with project development work, facilitating solutions for heritage assets at risk even though we may be unable to help with major repairs. Sometimes, other funders will be better placed to help with major repairs.We review our grant priorities periodically to ensure that we are responding to the changing needs of the historic environment. Share this page Share Print Next steps Find out about our Heritage at Risk programme <div class="he-grid-row "> <div class="main-col"> <div class="back-to-top"> <a href="#header" class="back-to-top__link back-to-top-button"> <div class="back-to-top__container"> <div class="back-to-top__icon"></div> </div> <span class="back-to-top__text"> Back to top </span> </a> </div> </div> </div> Please update your browser Our website works best with the latest version of the browsers below, unfortunately your browser is not supported. Using an old browser means that some parts of our website might not work correctly. Chrome Update Chrome Safari Update Safari Firefox Update Firefox Microsoft Edge Update Microsoft Edge Close this message'
