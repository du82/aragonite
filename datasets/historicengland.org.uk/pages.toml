full_description = '''Home Advice & Grants Caring for Heritage Share this page Share Print Caring for Heritage If you are involved in caring for heritage in your area, or you want to find out how to de-clutter your street, you'll find helpful advice here. Taking the initiative Community Advice Hub Information for groups and communities to find out more about your historic place and look after heritage. Your Business What should you consider when you run a business from an older building? Find out how to look after it, and how to make changes to it. Improve Your Street Find out how you can help to transform the streets around you. Caring for Rural Heritage Advice and funding for the care of heritage in rural settings as well as research and techniques for managing changes to rural heritage. Looking After Our Industrial Heritage This section provides information for those who own, manage or are developing an industrial site or want to set up a building preservation trust. Places of Worship Find out how we can help you to look after your place of worship, from churches to mosques and synagogues to temples. Cemeteries and Burial Grounds Guidance on the conservation of historic cemeteries and burial grounds and their monuments. Assets of Community Value More and more community-based organisations are taking responsibility for managing historic buildings that were formerly owned by local authorities. Wellbeing and Heritage Advice Our strategy, case studies and sources of good practice to support the relationship between heritage and wellbeing. Enlisting help to protect heritage How to Save a Building Find out what you can do to save a building that's under threat. Heritage Crime Learn more about heritage crime, and what you can do to prevent it. Help Support Our Work Find out more about how you can help us champion and protect England’s historic environment. Get Local Council Help Are you concerned about a local conservation area? Email your local Ward Councillor and invite the Council to discuss your concerns. Share this page Share Print <div class="he-grid-row "> <div class="he-grid-col-lg-10 he-grid-col-xl-8 mx-auto"> <div class="back-to-top"> <a href="#header" class="back-to-top__link back-to-top-button"> <div class="back-to-top__container"> <div class="back-to-top__icon"></div> </div> <span class="back-to-top__text"> Back to top </span> </a> </div> </div> </div> Please update your browser Our website works best with the latest version of the browsers below, unfortunately your browser is not supported. Using an old browser means that some parts of our website might not work correctly. Chrome Update Chrome Safari Update Safari Firefox Update Firefox Microsoft Edge Update Microsoft Edge Close this message'''
