["https://historicengland.org.uk/advice/climate-change/reponses"]
title = "Responses to Climate Change | Historic England"
description = "Celebrate inclusive heritage and ensure your work is diverse and inclusive."
full_description = '''About this image A timber from a historic building which has been damaged due to insect infestation. Increased insect infestation is a possible risk of climate change. © Historic England, image reference DP095126 Home Advice & Grants Climate Change Responses to Climate Change Share this page Share Print A timber from a historic building which has been damaged due to insect infestation. Increased insect infestation is a possible risk of climate change. © Historic England, image reference DP095126 More in this Section Our Strategy Delivering Net Zero Local Data Demand for Retrofitting Skills Risks and Hazards Responses to Climate Change Nature Recovery and Heritage Heat Pumps and Solar Panels Can Work for Older Buildings Responses to Climate Change Historic England's approach to responding to the challenge of how climate change effects the historic environment. Climate change is a risk multiplier. It exacerbates less-significant threats, creating new and unforeseen challenges. There are two areas of response to climate change: Mitigation – reducing our impact upon the causes of climate change.Adaptation – adapting to the changes that are already, or will occur. Heritage is not only affected by the impacts of climate change but also by our responses to it e.g. flood defences, sustainable energy generation and improving energy efficiency of buildings. Mitigation Mitigation involves taking action to increase energy efficiency and sustainability. Improving these will reduce the emission of greenhouse gases and heighten our ability to manage additional mean global temperature rise. The UK Government encourages organisations to limit emissions by using fuel more efficiently and insulating their homes and businesses. Historic England have advice on how to do this whilst minimising negative impacts upon the historic environment: for instance advice on saving energy in your older home. Adaptation Adaptation means anticipating the adverse effects of climate change and taking appropriate action to prevent or minimise the damage they can cause. Early action will build in safeguards that will help to protect heritage around the country. Adaptation strategies are important for everyone, and are being discussed at every level of government, all around the world.Historic England is helping the UK heritage community to address this issue, by carrying out research and analysis on the distribution, scale and timing of potential threats. We use world-class research to create risk assessments for everything from coastal flooding to the World Heritage Sites of Stonehenge and Avebury. You can find details of previous research on environmental threats through our research results pages.You can read more about our work on climate change adaptation in our Climate Change Strategy and our response to Government as part of the National Adaptation Reporting Power. <figure class="nested-image__image-wrapper"> <picture class="nested-image__picture"> <source srcset="/media/2481/muchelney-flooding.jpg?mode=max&amp;quality=90&amp;width=980&amp;height=650&amp;upscale=false&amp;rnd=132357566511230000" media="(min-width: 750px)"> <source srcset="/media/2481/muchelney-flooding.jpg?mode=max&amp;quality=90&amp;width=640&amp;height=450&amp;upscale=false&amp;rnd=132357566511230000"> <img class="nested-image__image" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="An aerial view of flooding around Muchelney, Somerset"> </picture> <figcaption class="nested-image__caption"> <div> <p class="nested-image__caption-text"> An aerial view of flooding around Muchelney, Somerset. &copy; Historic England, Damian Grady </p> </div> </figcaption> </figure> Both mitigation and adaptation have a role in building resilience into our historic environment. Helping the historic environment to be resilient in the face of climate change involves understanding potential risks, identifying possible solutions and, when a course of action has been chosen, helping to monitor impact and manage future outcomes. Share this page Share Print <div class="he-grid-row "> <div class="main-col"> <div class="back-to-top"> <a href="#header" class="back-to-top__link back-to-top-button"> <div class="back-to-top__container"> <div class="back-to-top__icon"></div> </div> <span class="back-to-top__text"> Back to top </span> </a> </div> </div> </div> Please update your browser Our website works best with the latest version of the browsers below, unfortunately your browser is not supported. Using an old browser means that some parts of our website might not work correctly. Chrome Update Chrome Safari Update Safari Firefox Update Firefox Microsoft Edge Update Microsoft Edge Close this message'''
