full_description = "NASA HistoryExplore NASA’s HistoryNASA History OfficePublications and ResourcesNASA History SeriesNews and NotesAeronautics and Space Report of the PresidentOral HistoriesResearch ResourcesNASA Archives NASA History Since its founding in 1958, NASA has pushed the boundaries of scientific and technical limits to explore the unknown for all the citizens of our planet. Discover the history of our human spaceflight, science, technology, and aeronautics programs. Popular Topics More Topics in NASA History The NACA In 1958, NASA was created from the National Advisory Committee for Aeronautics, the government body for coordinating U.S. aeronautical research. Hidden Figures Meet the women who worked as human computers in NASA's early days. Apollo 11 Find out more about the first mission to land people on the Moon in July 1969. Project Gemini From 1964 to 1966, NASA launched 10 crewed missions to test the equipment and procedures for future Apollo missions. Hubble's 35th Anniversary Join in the celebrations as NASA's Hubble Space Telescope marks 35 years in space. Remembering Our Fallen Heroes NASA will never forget the tragic loss of the Apollo 1, Challenger and Columbia crews. Symbols of NASA Get to know the meatball, the worm, the seal, and other logos and insignia used by NASA. Animals in Space Learn about the early history of animals in space flight. Featured Video Celebrating the 110th Birthday of the NACA Before NASA was established in 1958, our predecessor—the National Advisory Committee for Aeronautics (NACA)—was busy coordinating the nation’s aeronautical research. In this new video, learn how its establishment on March 3, 1915, set the stage for groundbreaking innovations that changed flight in America and around the world. Learn More News and Events Explore NASA's History Governing the Moon: A HistoryIn the newest monograph in the NASA History Series, Stephen S. Buono presents the history behind the Agreement Governing the Activities of States on the Moon and Other Celestial Bodies, better known as the Moon Treaty. Read the E-bookRead the Latest NASA History NewsletterAs we close out 2024, NASA’s historians and archivists reflect on the progress made over the year and share snapshots of the agency’s history revealed in their recent work.Download the PDFA Wartime NecessityA Wartime Necessity is a new edited volume looking at World War II aviation and how applied research at institutions like the NACA generated aeronautical advances critical to the war effort.Download the Free E-bookGoing BeyondJohn M. Logsdon presents the history of George H. W. Bush's Space Exploration Initiative and his administration's efforts at organizational change at NASA in his new monograph Going Beyond.Get the E-book 66 Years of Aerospace Exploration Forged in response to early Soviet space achievements, NASA was built on the National Advisory Committee for Aeronautics (NACA), as the locus of U.S. civil aerospace research and development. Since October 1, 1958, when NASA opened for business, it has accelerated work on human and robotic spaceflight, and is responsible for scientific and technological achievements that have had widespread impacts on our nation and the world. Discover Our History about 66 Years of Aerospace Exploration Featured History More NASA History Articles Article2 Min ReadNASA Marks 110 Years Since Founding of Predecessor Organization News Release4 Min ReadNASA Remembers Long-Time Civil Servant John Boyd 5 Min ReadNASA’s Ames Research Center Celebrates 85 Years of InnovationArticle 4 Min ReadNASA Plane Supported Innovative Microgravity Research in ‘90sArticle 6 Min ReadCassini Mission: 5 Things to Know About NASA Lewis’ Last LaunchArticle Publications and Oral Histories The NASA History Office NASA Archives Dive Deeper Explore interviews with aerospace legends, analyses of key events, aerospace chronologies, and more! Since NASA’s founding, its History Office has developed history publications and conducted oral history interviews for the use of the general public. Connect with our resources to delve into your aerospace history research. Explore our Publications The NASA History Office The National Aeronautics and Space Act of 1958 not only created NASA but directed it “to provide for the widest practicable and appropriate dissemination of information concerning NASA activities and the results thereof.” The sharing of information, including our history, has always been, and continues to be, a priority. Learn More About Our Work These people and this equipment supported the flight of the NACA D-558-2 Skyrocket at the High-Speed Flight Station at South Base, Edwards AFB. Note the two Sabre chase planes, the P2B-1S launch aircraft, and the profusion of ground support equipment, including communications, tracking, maintenance, and rescue vehicles. Research pilot A. Scott Crossfield stands in front of the Skyrocket. Photo date: January 17, 1954NACA Preserving Our History And making it accessible to future generations The NASA Archives works to preserve and provide access to historically and culturally significant records and material created by NASA, including our work in the fields of engineering and science, ensuring that they will be discoverable for generations to come. NASA Archives Governing the Moon: A History In the latest monograph in the NASA History Series, Stephen S. Buono presents the history behind the Agreement Governing the Activities of States on the Moon and Other Celestial Bodies, also known as the Moon Treaty. Get the E-Book about Governing the Moon: A History Follow NASA History on Social Media Facebook logo @NASAHistoryOffice @NASAhistory View quintessential photos from NASA’s history with NASA on the Commons on Flickr Keep Exploring Discover More Topics From NASA Missions Humans In Space Aeronautics People of NASA"
