["https://www.historyandwomen.com/2023/06/barbara-strozzi-illegitimate-diva-of.html"]
title = '"Barbara Strozzi: The Illegitimate Diva of Venice'
description = "A blog about Women throughout History"
full_description = "During the 17th century, in the magical city of Venice, a little girl named Barbara Strozzi came into the world. She had quite the mysterious birth, with her mother known only as “La Greghetta.” Talk about a secret identity! Barbara was baptized in the church of Santa Sofia, and while her birth certificate didn’t spill the beans on her father’s identity, rumor has it that he might have been Giulio Strozzi, a poet and librettist who had quite the influence in seventeenth-century Venice. Now, Giulio was a big shot in the literary world. He was a member of the prestigious Accademia degli Incogniti, which was like the Avengers of intellectuals back then. They were a force to be reckoned with in the Republic of Venice and beyond. Giulio dabbled in all kinds of writing, from poetry to operas, prose to plays, and even lyrics for songs. He was basically the Renaissance version of a multi-hyphenate superstar. As for Barbara’s mother, not much is known about her. Historians suspect her name was Isabella, and she might have been a servant of Giulio. Barbara and Isabella lived under the same roof and were even mentioned in Giulio’s will. So, it seems like they were one big happy (and slightly unconventional) family. Now, here’s where things get interesting. Despite being an illegitimate child, Barbara had a unique relationship with her “adoptive father” Giulio. He saw her potential and helped her carve out a career as a musician later in life. Talk about a supportive dad! Barbara grew up in a household that was a hotspot for literary and musical geniuses of the time. Imagine having a front-row seat to all the creative magic happening around you. It must have been like living in a Renaissance version of MTV Cribs. As Barbara entered her teenage years, Venice was hit by plague after plague, and it seemed like everyone was dropping like flies. But Barbara and her mother managed to survive. Clearly, they had some serious survival skills. By the age of twelve, Barbara had already started showing off her musical talents. She had a voice that could move mountains, and she could even accompany herself on instruments like the lute or theorbo. Barbara’s musical gifts became more apparent as she grew older, and Giulio decided to take things up a notch. He arranged lessons in composition for her with none other than Francesco Cavalli, one of the hottest composers in town. By the time she hit fifteen, Barbara was hailed as “la virtuosissima cantatrice di Giulio Strozzi” (Giulio Strozzi’s extremely virtuosic singer). I bet her business card was the size of a billboard to fit that title. Giulio wasn’t one to keep Barbara’s talent under wraps. He started promoting her musical prowess like a proud stage mom, ensuring that works were dedicated to her left and right. He even founded the Accademia degli Unisoni, a fancy club for musicians that operated from the Strozzi household. Talk about a private concert venue! Barbara got to showcase her singing skills and perform her own works in semi-public settings. It was like being a pop star before pop stars were even a thing. When Barbara turned 18, she officially adopted her father’s last name, Strozzi, and carried it with her until her last breath. By her late teens, she had gained quite the reputation for her singing. Two volumes of songs full of praises for her voice were published, and she was the talk of the town. Well, at least the musical circles in Venice. Now, Barbara had big dreams, and she sought out patronage to help make them come true. But let’s just say she had a few misses along the way. Her opus 2, dedicated to Ferdinand III of Austria and Eleanora of Mantua on their marriage, went unnoticed. Ouch. But hey, she didn’t give up! She dedicated works to other notable folks like Anne de’ Medici, Nicolò Sagredo (who would later become the Doge of Venice), and Sophia, Duchess of Brunswick and Lüneburg. She even composed songs for the Duke of Mantua, proving that persistence pays off. Barbara Strozzi was a force to be reckoned with in the music scene. She was the most prolific composer of secular vocal music in Venice during the seventeenth century. Her compositions were like catnip for the ears, and she had a knack for poetic lyrics. She was a master at setting texts by the poet Marino, using them as a way to express herself and challenge gender norms of the time. She knew how to hit those high notes both musically and metaphorically. And let’s not forget her opus 5, a rare collection of sacred songs. She dedicated it to the Archduchess of Innsbruck, Anna de Medici. Barbara’s motet “Mater Anna” was like a musical homage to both the Catholic saint and the archduchess herself. It was a power move, combining spirituality and flattery in one composition. Barbara knew how to work her musical magic. So, there you have it, the extraordinary and witty tale of Barbara Strozzi, the musical prodigy of Venice. She may have faced challenges and setbacks, but she never stopped pursuing her passion. Her legacy lives on as a testament to the power of talent, determination, and a touch of Renaissance charm. Bravo, Barbara!"
