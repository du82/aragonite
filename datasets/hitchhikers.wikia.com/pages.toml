["https://hitchhikers.wikia.com/wiki/User_blog:Spacepigeon/Happy_Hitchhiker_Holidays_2019!"]
title = "User blog:Spacepigeon/Happy Hitchhiker Holidays 2019! | Hitchhikers | Fandom"
description = "Hey all, hope your winter is going well and happy holidays to all celebrating something this time of year! Just wanted to thank everyone who has helped out on the Wiki this year, and I'm not going..."
full_description = '''in: Admin blog posts, Blog posts Happy Hitchhiker Holidays 2019! Spacepigeon • 23 December 2019 • User blog:Spacepigeon <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Hey all, hope your winter is going well and happy holidays to all celebrating something this time of year! Just wanted to thank everyone who has helped out on the Wiki this year, and I'm not going anywhere soon - I'll be joining you all in this new year (and new decade!) and still trying to keep the Hitchhiker's Wiki in tip top condition! It is a shame that we've lost some regular contributors - but life is busy and it's very understandable when people have to put other things in front of volunteering to edit Wikis for free, it is just a hobby for most after all! I'm so grateful to anyone who has been here to help with putting some life back into this Wiki - it's come so far since when I first adopted it. I apologise for being busy especially at the end of 2019 and not editing as much as I'd like, but I'm definitely not giving up on this Wiki and there's still a lot of little jobs to be done that I won't forget any time soon. Are there any particular pages that you've noticed are in dire need of editing, or any pages that need to be created? Please do let me know, I'll add them to my to-do list for this new year! Happy holidays and a happy new year everyone, and most importantly, keep those towels close as we journey forwards into the unknown! -Pigeon Categories Categories: Admin blog posts Blog posts Community content is available under CC-BY-SA unless otherwise noted. More Fandoms Fantasy Sci-fi'''
year_published = 2025
clearnet = "https://hitchhikers.wikia.com/wiki/User_blog:Spacepigeon/Happy_Hitchhiker_Holidays_2019!"
