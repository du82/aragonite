n false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> This article is about the book/radio series. For the most incredibly improbable location of all of time and space, see Milliways. The Restaurant at the End of the Universe Attribution Author(s) Douglas Adams Publication information Release date 1 January 1980 Pages 208 (paperback edition) Chronology Preceded by The Hitchhiker's Guide to the Galaxy Followed by Life, the Universe and Everything The Restaurant at the End of the Universe is the second book in the Hitchhiker's Guide to the Galaxy book series by Douglas Adams. Contents 1 Plot Summary 2 Trivia 3 Dedication 4 Characters 4.1 Main Characters 4.2 Minor Characters 4.3 Devices 4.4 Ships 4.5 Places 4.6 Races and species 4.7 Publications Plot Summary[] The Restaurant at the End of the Universe begins just as The Hitchhiker's Guide to the Galaxy ended. Arthur Dent, Ford Prefect, Trillian, Zaphod Beeblebrox and Marvin have just left the planet Magrathea when they are attacked by a Vogon ship commanded by Prostetnic Vogon Jeltz. They find they are unable to use the Improbability drive to escape, as Arthur has accidentally jammed the computer with a simple request for a cup of tea which proved a rather difficult problem. Luckily, an ancestor of Zaphod's, Zaphod Beeblebrox IV, saves them. Zaphod and Marvin vanish, and reappear at the offices of The Hitchhiker's Guide to the Galaxy editorial building on Ursa Minor Beta. They are looking for Zarniwoop, who has gone on an intergalactic cruise in his office via his virtual universe. Arthur, Trillian and Ford are unaware of any of this, knowing only that the computer has been shut down, and only having received a message from a stalling Nutri-Matic Drink Synthesizer that says "Wait." When Zaphod and Marvin reach the fifteenth floor of the Guide's office, half of the building is lifted off the ground by Frogstar Fighters. A mysterious man named Roosta brings Zaphod to Zarniwoop's office, where they wait until the building lands on Frogstar World B. Roosta gives Zaphod final instructions before he leaves: Go through the window on his way out, not the door. Zaphod then meets Gargravarr who informs Zaphod that he is to be sent through the Total Perspective Vortex, a torture device which annihilates you by showing you just how infinitely small you are compared to the Universe. However, when Zaphod enters it, the Vortex shows him that he is the most important thing in the Universe. Zaphod escapes, and finds Zarniwoop in the first class cabin of a space liner that keeps its passengers in stasis as they wait for a re-fill of lemon soaked napkins in an abandoned spaceport. Zarniwoop explains that the Total Perspective Vortex has not malfunctioned — this is a virtual universe created by Zarniwoop for the sole benefit of Zaphod, who is the most important creature in this universe. It turns out that Zaphod had the shrunk Heart of Gold in his jacket pocket the whole time. It is reconstituted, and Zaphod is reunited with Trillian, Arthur and Ford. They escape from Zarniwoop by asking to be transported to the nearest restaurant. Milliways, the Restaurant at the End of the Universe, is the nearest restaurant in space but not time. They are transported there "five hundred and seventy-six thousand million years" into the future. Marvin is left stranded here for this incredibly vast amount of time parking diners' spaceships while waiting for the humans to return. After the meal, Zaphod and Ford steal a spaceship, which turns out to be a stuntship belonging to the rock band Disaster Area, programmed to dive into a star to provide backing effects for a rock concert. There is a teleporter on the ship for which the guidance system was never built, as it was never intended to be used, and it also requires somebody to stay on the ship to operate it. Marvin is chosen to stay behind and teleport the others, who have no choice but to go wherever it takes them. Zaphod and Trillian are returned to the Heart of Gold, which is commandeered by Zarniwoop to complete his mission, to discover who really rules the Universe. As it turns out, the Ruler of the Universe is entirely sceptical that he holds this position, as he is entirely sceptical of everything, including whether his cat, The Lord, really exists, or whether there is even a universe at all outside of his small isolated home. While Zarniwoop attempts to impress upon the Ruler of the Universe the reality and the weight of his position, Trillian and Zaphod sneak out and fly the Heart of Gold away. The teleporter has meanwhile sent Arthur and Ford to the Golgafrinchan Ark Fleet Ship B, a ship of fools which crash-lands on prehistoric Earth. They realise that the bumbling travellers are the real ancestors of modern humans. Arthur attempts to determine the Question to the Ultimate Answer of Life, the Universe and Everything by reaching into a Scrabble bag made from Ford's towel and pulling out letters randomly, hoping Deep Thought's computational matrix in Earth would have rubbed off on his subconscious. The letters spell "What do you get when you multiply six by nine" before running out, although one of the Neanderthals manages to spell "forty-two" with the tiles, implying that it is they, rather than the Golgafrinchans, who were intended to be part of Earth's computer matrix. After some brief contemplation, Ford and Arthur realise that this is, in fact, a detrimental "cock-up", and that the Earth will never produce the proper Question, thus destroying all hope of ever finding out what it is. As Ford convinces Arthur that there is nothing that can be done to improve the inevitable history of the Earth, Arthur decides that he should make the best of his situation and settles for a life on prehistoric Earth. Trivia[] The title refers to the restaurant's temporal, rather than spatial, location. Milliways exists in a temporally shielded bubble, overlooking the Big Crunch. Dedication[] To Jane and Jameswith many thanksto Geoffrey Perkins for achieving the Improbableto Paddy Kingsland, Lisa Braun and Alick Hale Munro for helping himto John Lloyd for his help with the original Milliways scriptto Simon Brett for starting the whole thing offto the Paul Simon album One Trick Pony which I played incessantlywhile writing this book. Five years is far too longAnd with very special thanks to Jacqui Graham for infinite patience, kindness and food in adversity Characters[] Main Characters[] Arthur Dent Ford Prefect Zaphod Beeblebrox Trillian Astra Marvin Minor Characters[] Eddie the Computer Prostetnic Vogon Jeltz Gag Halfrunt Zaphod Beeblebrox the Fourth Roosta Frogstar Scout Robot Class D Zarn