full_description = '''in: Series Books, Books written by Douglas Adams, Books, and 2 more Based on the Movies Versions of Hitchhiker's The Hitchhiker's Guide to the Galaxy (novel) Sign in to edit History Purge Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> “We have normality, I repeat we have normality.” This article covers a subject that is part of the real world, and thus should not be taken as a part of the Hitchhiker's universe. The Hitchhiker's Guide to the Galaxy (novel) Series The Hitchhiker's Guide to the Galaxy Attribution Author(s) Douglas Adams Cover artist(s) HipgnosisIan Wright Audiobook narrator(s) Douglas AdamsStephen Fry Publication information Publisher Pan books Release date 12 October 1979 (UK)October 1980 (US) Country United Kingdom Language English Pages 180 pp (UK Paperback) Media type Print (hardcover and paperback) ISBN 0-330-25864-8 Chronology Followed by The Restaurant at the End of the Universe The Hitchhiker's Guide to the Galaxy is the first book in The Hitchhiker's Guide to the Galaxy book series by Douglas Adams. Contents 1 Plot summary 2 Dedication 3 Appearances 3.1 Main Characters 3.2 Minor Characters 3.3 Devices 3.4 Ships 3.5 Places 3.6 Races and species 3.7 Publications Plot summary[] The Hitchhiker's Guide to the Galaxy begins with contractors arriving at Arthur Dent's house, in order to demolish it to make way for a bypass. His friend, Ford Prefect, arrives while Arthur is lying in front of the bulldozers, to stop them from demolishing it. He tries to explain to Arthur that he is actually from a planet somewhere in the vicinity of Betelgeuse and that the Earth is about to be demolished. The Vogons, an alien race, intend to destroy Earth to make way for a hyperspace bypass. The two escape by hitching a lift on one of the Vogons' ships; this is, however, against Vogon regulations and when the pair are discovered, they are tortured with a rendition of Vogon poetry, the third worst in the known Universe, and then thrown into space. They are, very improbably, picked up by the Heart of Gold, a ship powered by an infinite improbability drive, and has been stolen by Ford's semi-cousin and President of the Galaxy, Zaphod Beeblebrox. Zaphod, accompanied by Trillian and the clinically depressed robot Marvin, are searching for the legendary planet of Magrathea. There, Arthur, after being separated from the rest of the group, is taken to the interior of Magrathea by Slartibartfast, a native of the planet. As the others, except Marvin, are kidnapped, Slartibartfast explains to Arthur that the Earth is actually a supercomputer commissioned and paid for by a race of hyper-intelligent pan-dimensional beings. These creatures had earlier built a supercomputer named Deep Thought, to calculate the Answer to Life, the Universe, and Everything. This computer, after seven and a half million years of calculating, had announced that the Answer is in fact 42. Being unsatisfied with the Answer, they set about finding the Question. Deep Thought designed a computer, the Earth, to calculate the Question. However, ten million years later, and just five minutes before the completion of the program, the Earth is demolished by the Vogons. The manifestations of two of these beings, Frankie and Benjy Mouse, had arrived on Magrathea on the Heart of Gold, disguised as Trillian's pet mice. The mice realise that Arthur, as a last-generation non-organic by-product of the computer, has the Question imprinted into his brain and offer to buy his brain from him. Arthur disagrees, and a fight ensues. The mice are about to cut Arthur's head open, when klaxons all over the planet create a diversion, in which they escape. The galactic police had arrived on the planet to arrest Zaphod. The group is attacked by 2 members of the police, Shooty and Bang Bang, who abruptly die when their life support systems fail: Marvin had explained his view of the universe to the mother ship's computer and it committed suicide, taking their life support systems with it. Then the group decides to go to the Restaurant at the End of the Universe for lunch. Dedication[] forJonny Brock and Clare Gorstand all other Arlingtoniansfor tea, sympathy, and a sofa Appearances[] Main Characters[] Arthur Dent Ford Prefect Zaphod Beeblebrox Trillian Astra Marvin Minor Characters[] Mr Prosser Barman Prostetnic Vogon Jeltz Eddie the Computer Frankie Benjy Whale Bowl of Petunias Slartibartfast Shooty Bang Bang Fenchurch (mentioned) God (mentioned) Oolon Colluphid (mentioned) Genghis Khan (mentioned) Eccentrica Gallumbits (mentioned) Paula Nancy Millstone Jennings (mentioned) Grunthos the Flatulent (mentioned) Deep Thought (mentioned) Lunkwill (mentioned) Fook (mentioned) Loonquawl (mentioned) Phouchg (mentioned) Majikthise (mentioned) Vroomfondel (mentioned) Milliard