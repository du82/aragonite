full_description = '''in: Admin blog posts, Blog posts 600 pages! (And happy holidays!) Spacepigeon • 17 December 2018 • User blog:Spacepigeon <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Hello all![] I just wanted to congratulate us on reaching 600 articles on our Wiki! It's even more exciting knowing that most of those 600 pages actually have a good amount of content on them now, hooray![] It was a bit overwhelming when I first adopted this Wiki, I knew I was determined to help get it into a much more updated and coherent state by the end of the year, and we've done so well. I'd never used Wiki (or as it's now known, Fandom) before finding the Hitchhikers Wiki, and never been an admin on one before either, but I'm feeling so confident about our Wiki and our community lasting a lot longer than it has done previously. Even if people come and go, page information updates and changes, the website continues to grow and evolve... the Hitchhiker's Wiki will remain in at least a half decent state, which is a pretty good thing. :-P It's coming close towards the end of 2018 so I just wanted to say thanks to everyone who's made even the smallest contribution to this Wiki over the last year. It makes me so happy knowing there's other Hitchhikers fans out there, other people who care about there being one place where we can all find each other and find pages on all our favourite things about the stories! Joining this Wiki was something I never expected to do, but I'm so glad I did! It's been great getting to work with you all on this project and really achieve so much together. Happy holidays, and a happy rest of 2018 to you![] Spacepigeon P.S: I also want to take this opportunity to let you all know that the Featured Page on the main page changes every season (spring, summer, autumn/fall, winter). Next season's featured page poll is up! Go to the - talk page - and make your choice, and don't forget to suggest any articles you think should be featured! This is a great opportunity to highlight any great contributions you have seen on the Wiki, and to reward contributors' hard work! Categories Categories: Admin blog posts Blog posts Community content is available under CC-BY-SA unless otherwise noted. More Fandoms Fantasy Sci-fi'''
