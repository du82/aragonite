full_description = '''in: Technology, Main characters, Film characters, Robots Marvin Sign in to edit History Purge Talk (1) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> TV Comics Film Marvin Biographical information Full name Marvin Status Deceased Alias(es) Marvin the Paranoid Android Occupation Servant Physical information Species Robot Gender Male Hair colour No hair Eye colour Red (TV)Green (film) Behind the Scenes First appearance Fit the Second(15 March, 1978) Portrayed by Stephen Moore (radio, TV)David Learner (body; TV)Alan Rickman (voice; film)Warwick Davis (body; film) “You think you've got problems? What are you supposed to do if you are a manically depressed robot? No, don't try to answer that. I'm fifty thousand times more intelligent than you and even I don't know the answer. It gives me a headache just trying to think down to your level.” —Marvin to Arthur Dent[src] Marvin was an incredibly intelligent but overwhelmingly depressed robot manufactured by the Sirius Cybernetics Corporation and unwilling ally of the crew of the Heart of Gold, traveling with them across the galaxy through many crises for years, and traveling through time on more than one occasion. Contents 1 Biography 1.1 Creation 1.2 Final Days 2 Personality 3 Abilities 4 Appearances 5 Trivia 6 Notes 7 References Biography[] Creation[] Marvin was manufactured by the Sirius Cybernetics Corporation, built with a blinding intelligence and a prototype version of the Genuine People Personality software, which allowed him the capacity for complex thought and feelings.[1] To be added Final Days[] By the end of So Long, And Thanks For All The Fish, Marvin ends up on planet Preliumtarn, where he meets Arthur and Fenchurch for the last time. Multiple instances of time travel shenanigans have left Marvin no less than thirty-seven times older than the universe itself. His various body parts, now rusted and barely functional, have been replaced at least fifty times each (except, ironically, all the diodes down his left side). With Arthur and Fenchurch's help, Marvin arrives at the mountain where God's final message to the universe was written: "We Apologise for the Inconvenience." After reading this, Marvin remarks "I think I feel good about it," and finally dies. Personality[] Marvin the robot has a prototype version of the Genuine People Personality (GPP) software from SCC, allowing him sentience and the ability to feel emotions and develop a personality. He's also incredibly smart, having a "brain the size of a planet" capable of computing extremely complex mathematics, as well as solving difficult problems and operating high-tech devices. However, despite being so smart, Marvin is typically made to perform menial tasks and labour such as escorting people, opening doors, picking up pieces of paper, and other tasks well beneath his skills. Even extremely hard tasks, such as computing for the vast Krikkit robot army, are trivial for Marvin. All this leaves him extremely bored, frustrated, and overwhelmingly depressed. Because of this, all modern GPP-capable machines, such as Eddie the computer and the Heart of Gold's automatic doors, are programmed to be extremely cheerful and happy, much to Marvin's disgust. <a href="https://static.wikia.nocookie.net/hitchhikers/images/f/fd/ArthurAndMarvin.jpg/revision/latest?cb=20180916172749" class="mw-file-description image"><img alt="ArthurAndMarvin" src="https://static.wikia.nocookie.net/hitchhikers/images/f/fd/ArthurAndMarvin.jpg/revision/latest/scale-to-width-down/180?cb=20180916172749" decoding="async" loading="lazy" width="180" height="120" class="thumbimage" data-image-name="ArthurAndMarvin.jpg" data-image-key="ArthurAndMarvin.jpg" data-relevant="1" data-src="https://static.wikia.nocookie.net/hitchhikers/images/f/fd/ArthurAndMarvin.jpg/revision/latest/scale-to-width-down/180?cb=20180916172749" /></a> Arthur Dent and Marvin on Magrathea, as seen in the 1981 TV series. Marvin hates everyone and everything he comes into contact with, having no respect for anybody and will criticise and insult others at any opportunity, or otherwise rant and complain for hours on end about his own problems, such as the terrible pain he suffers in all the diodes down his left side. His contempt for everyone is often justified, as almost every person he comes across, even those who consider him a friend, (such as Arthur and Trillian, who treat him more kindly than Ford and Zaphod) treat Marvin as an expendable servant, even sending him to his death more than once (such as when Zaphod ordered Marvin to fight the gigantic, heavy-duty Frogstar Scout Robot Class D so he could escape). Being a robot, he still does what he's told (he won't enjoy it, nor will he let you forget it, but he'll do it anyway), though he'd much rather sulk in a corner by himself. Several times in the series Marvin ends up alone and isolated for extremely long periods of time, sometimes spanning millions of years, either by sheer bad luck (such as the explosion that propelled everyone but Marvin to Milliways in the far-off future) or because his unpleasantly depressing personality drives them away or, in more than one case, makes them commit suicide. In his spare time (which he has a lot of), Marvin will attempt to occupy himself by composing songs and writing poetry. Of course, none of them are particularly cheerful, or even that good. Abilities[] To be added Appearances[] To be added Trivia[] Marvin continually states that his brain is the size of a planet. And that he has a terrible pain in all the diodes down his left side. The crew of the Heart of Gold are trying to discover the question to life the universe and everything, that was being calculated by a computer the size of a planet. Marvin is trying to hint that he is able to tell them the question, or at least calculate the question, but they never ask. Marvin wrote a lullaby called "How I Hate the Night", described as "a short dolorous ditty of no tone, or indeed tune."[2] Now the world has gone to bed, Darkness won't engulf my head, I can see by infra-red, How I hate the night, Now I lay me down to sleep, Try to count electric sheep, Sweet dream wishes you can keep, How I hate the night. Notes[] Stephen Moore also recorded four single songs as the Marvin character, release on two 45 rpm records. These were "Marvin" and "Metal Man," followed by "Marvin, I Love You" and "Reasons To Be Miserable." The female vocals for "Marvin, I Love You" were provided by Kimi Wong. Douglas Adams told that Marvin was intended to be a minor joke, but after the robot's voice actor was hired he eventually had to write some script for him from time to time. During early production of the TV version, Douglas Adams envisaged Marvin as a man painted silver. This idea was vetoed by producer Alan Bell. During the scene in the film where Arthur is making his way through the queue to get Trillian released, he passes by a robot and does a double-take. The robot is the TV version of Marvin. References[] ↑ The Hitchhiker's Guide to the Galaxy (novel) ↑ Life, the Universe and Everything Categories Categories: Technology Main characters Film characters Robots Community content is available under CC-BY-SA unless otherwise noted. More Fandoms Fantasy Sci-fi'''
