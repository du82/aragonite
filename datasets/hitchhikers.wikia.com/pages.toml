a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> TV Comics Film Arthur Dent Biographical information Full name Arthur Phillip Dent Status Alive Alias(es) DentarthurdentEarthmanMonkeyman Relatives Unnamed mother †Unnamed father †Unnamed older brother[1] †Unnamed sister †Random Dent (daughter) Planet of origin Earth Occupation Traveller, formerly radio worker Physical information Species Human Gender Male Hair colour Brown Eye colour Brown Behind the Scenes First appearance Fit the First(8 March 1978) Portrayed by Simon Jones (radio, TV, LP)Chris Langham (stage)Jonathan Lermit (Illustrated Hitchhiker's Guide)Martin Freeman (film) “I'm very ordinary, but some very strange things have happened to me. You could say I'm more differed from than differing.” —Arthur Dent to Mella[src] Arthur Dent is a polite and straightforward human from Earth who escaped his planet's destruction and travelled the universe with his best friend, Ford Prefect. He spent several years being helplessly launched from crisis to crisis, encountering Vogons, Frogstar Scout robot while trying to straighten out his lifestyle. Contents 1 Biography 1.1 Early life 1.2 Escaping Earth's destruction 1.3 Search for Magrathea 1.4 Journey with the Golgafrinchans 1.5 Battling the Krikkiters 1.6 Travels with Fenchurch 2 Personality 3 Abilities 4 Possessions 5 Appearances 6 Trivia 7 Notes 8 References Biography[] Early life[] Arthur Dent is a human who grew up in Cottington, England on Earth[2] and attended to Eaton House Prep, where he encountered Blisters Smyth, a bullying head boy who filled Arthur's slippers with tapioca pudding. Arthur's university yearbook referred to him as "most likely to end up living in a hole in the Scottish highlands with only the chip on his shoulder for company."[3][4] <a href="https://static.wikia.nocookie.net/hitchhikers/images/3/3b/Arthur_and_Ford_TV.png/revision/latest?cb=20230909144922" class="mw-file-description image"><img alt="Arthur and Ford TV" src="https://static.wikia.nocookie.net/hitchhikers/images/3/3b/Arthur_and_Ford_TV.png/revision/latest/scale-to-width-down/200?cb=20230909144922" decoding="async" loading="lazy" width="200" height="149" class="thumbimage" data-image-name="Arthur and Ford TV.png" data-image-key="Arthur_and_Ford_TV.png" data-relevant="1" data-src="https://static.wikia.nocookie.net/hitchhikers/images/3/3b/Arthur_and_Ford_TV.png/revision/latest/scale-to-width-down/200?cb=20230909144922" /></a> Arthur and Ford Prefect[5] After leaving university, Arthur got into radio. He lived in London for a while, but moved to his house in the West Country after city life made him nervous and irritable, particularly people constantly asking him why he looked nervous and irritable. While there, he met Ford Prefect, parading as an out-of-work actor, telling everyone he was from Guildford, though he was actually from a planet somewhere in the vicinity of Betelgeuse. At some point, Arthur went to a fancy dress party in Islington, and while there he met an intelligent and kind woman called Tricia McMillan. The egotistical and reckless alien Zaphod Beeblebrox then turned up, masquerading as the one-headed "Phil," and convinced Tricia to leave with him, leaving Arthur to be miserable on his own.[3] Escaping Earth's destruction[] <a href="https://static.wikia.nocookie.net/hitchhikers/images/f/fc/Arthur_lies_in_front_of_the_bulldozer_%28TV%29.png/revision/latest?cb=20230923162543" class="mw-file-description image"><img alt="Arthur lies in front of the bulldozer (TV)" src="https://static.wikia.nocookie.net/hitchhikers/images/f/fc/Arthur_lies_in_front_of_the_bulldozer_%28TV%29.png/revision/latest/scale-to-width-down/200?cb=20230923162543" decoding="async" loading="lazy" width="200" height="150" class="thumbimage" data-image-name="Arthur lies in front of the bulldozer (TV).png" data-image-key="Arthur_lies_in_front_of_the_bulldozer_%28TV%29.png" data-relevant="1" data-src="https://static.wikia.nocookie.net/hitchhikers/images/f/fc/Arthur_lies_in_front_of_the_bulldozer_%28TV%29.png/revision/latest/scale-to-width-down/200?cb=20230923162543" /></a> Arthur lies in front of the bulldozer to protect his house[5] One fateful day in the 1980s[6], five or six years after meeting Ford, Arthur awoke to see that his house was to be demolished to make way for a bypass, and lay in front of the bulldozer that was set to destroy it. As Arthur argued with Mr. Prosser, the councilman trying to demolish his house, Ford arrived and convinced Arthur to come with him to the nearby pub, where he revealed his true nature as a Betelgeusian, and that the Earth was to be demolished by the Vogons to make way for a hyperspace bypass. At the last possible second, Ford and Arthur hitched a ride on a Vogon ship by contacting the Dentrassi cooks within, who hated the Vogons and loved to annoy them in any way possible, including bringing hitchhikers onboard. <a href="https://static.wikia.nocookie.net/hitchhikers/images/5/54/Jeltz_reads_his_poetry_to_Arthur_and_Ford_%28TV%29.png/revision/latest?cb=20230909145811" class="mw-file-description image"><img alt="Jeltz reads his poetry to Arthur and Ford (TV)" src="https://static.wikia.nocookie.net/hitchhikers/images/5/54/Jeltz_reads_his_poetry_to_Arthur_and_Ford_%28TV%29.png/revision/latest/scale-to-width-down/200?cb=20230909145811" decoding="async" loading="lazy" width="200" height="152" class="thumbimage" data-image-name="Jeltz reads his poetry to Arthur and Ford (TV).png" data-image-key="Jeltz_reads_his_poetry_to_Arthur_and_Ford_%28TV%29.png" data-relevant="1" data-src="https://static.wikia.nocookie.net/hitchhikers/images/5/54/Jeltz_reads_his_poetry_to_Arthur_and_Ford_%28TV%29.png/revision/latest/scale-to-width-down/200?cb=20230909145811" /></a> Enduring Vogon poetry[7] As Arthur and Ford hid in the Dentrassi quarters, Ford introduced Arthur to the travel guide he researched for, The Hitchhiker's Guide to the Galaxy, which was full of mostly apocryphal and wildly inaccurate information, as well as the Babel Fish, which translates any language imaginable when inserted into one's ear. Around this point, the pair were captured by a Vogon search party, and after being tortured by a reading of Vogon poetry (the third worst poetry in the universe), were tossed out through the airlock into the vacuum of space.[3] Search for Magrathea[] <a href="https://static.wikia.nocookie.net/hitchhikers/images/7/7d/Marvin_and_Ford_and_Arthur_%28TV%29.jpg/revision/latest?cb=20180825235529" class="mw-file-description image"><img alt="Marvin and Ford and Arthur (TV)" src="https://static.wikia.nocookie.net/hitchhikers/images/7/7d/Marvin_and_Ford_and_Arthur_%28TV%29.jpg/revision/latest/scale-to-width-down/200?cb=20180825235529" decoding="async" loading="lazy" width="200" height="149" class="thumbimage" data-image-name="Marvin and Ford and Arthur (TV).jpg" data-image-key="Marvin_and_Ford_and_Arthur_%28TV%29.jpg" data-relevant="1" data-src="https://static.wikia.nocookie.net/hitchhikers/images/7/7d/Marvin_and_Ford_and_Arthur_%28TV%29.jpg/revision/latest/scale-to-width-down/200?cb=20180825235529" /></a> Escorted to the Heart of Gold's bridge by Marvin[7] By a staggering coincidence, Arthur and Ford were rescued in the nick of time by the starship Heart of Gold, which was fitted with a new Infinite Improbability Drive. After they were saved and returned to normal, they were escorted to the bridge by Marvin, a chronically depressed and constantly complaining robot Arthur would later come to describe as an "electronic sulking machine".[8] Arriving on the bridge, they realized the ship was captained by none other than Zaphod Beeblebrox, who revealed himself to be Ford's semi-cousin, and Tricia McMillan, now going by "Trillian", who had fled to the stars with him after the party in Islington. Zaphod explained that they were searching for the legendary planet of Magrathea, the lost world of a race of custom planet manufacturers that became the richest planet in existence. Despite Ford's skepticism and Arthur's apathy, they joined them on their quest, and used the Infinite Improbability Drive to make their way into orbit around it.[3] To be added Journey with the Golgafrinchans[] Arthur and Ford eventually find themselves back on Earth – but two million years in the past marooned with an entire useless third of the Golgafrincham population. Ford and Arthur split after one year, and two years after that Arthur was insulted by Bowerick Wowbagger.[9] Battling the Krikkiters[] Then, five years after their arrival on the prehistoric Earth, Arthur and Ford met again and escaped prehistoric Earth through an eddy in the space-time continuum and a time-traveling Chesterfield sofa that deposited them in the middle of Lord's Cricket Ground at the climax of the final match in the Ashes series, the day before the destruction of Earth by the Vogons.[6] Travels with Fenchurch[] Having escaped the destruction of Earth once more and survived further adventures, Arthur eventually found himself once more back on an alternate Earth founded by the dolphins to save the human race from extinction. Here he fell in love with a woman named Fenchurch and seemed set to live happily ever after. In time, he learned how to fly and also carved a niche for himself as a sandwich-maker on the planet of Lamuella.[8] Personality[] Arthur Dent was considered a nice man and one of the kindest people to Marvin. Even after the Earth was destroyed, he categorised things according to "the Earth, and everything else". The Earth having been destroyed...meant that this view of things was a bit lopsided, but Arthur tended to cling to that lopsidedness as being the last remaining contact with his home." He places Sub-Etha Sens-O-Matics in the "everything else" category. Abilities[] Flight Excellent sandwich-making skills Possessions[] Dressing gown Fob watch (destroyed) The Hitchhiker's Guide to the Galaxy Video game only Buffered analgesic Pocket fluff Screwdriver Toothbrush A thing that his aunt gave him that he doesn't know what it is Appearances[] Appearances of Arthur Dent Radio series Primary Phase "Fit the First" "Fit the Second" "Fit the Third" "Fit the Fourth" "Fit the Fifth" "Fit the Sixth" Secondary Phase "Fit the Seventh" "Fit the Eighth" "Fit the Ninth" "Fit the Tenth" "Fit the Eleventh" "Fit the Twelfth" Tertiary Phase "Fit the Thirteenth" "Fit the Fourteenth" "Fit the Fifteenth" "Fit the Sixteenth" "Fit the Seventeenth" "Fit the Eighteenth" Quandary Phase "Fit the Nineteenth" "Fit the Twentieth" "Fit the Twenty-First" "Fit the Twenty-Second" Quintessential Phase "Fit the Twenty-Third" "Fit the Twenty-Fourth" "Fit the Twenty-Fifth" "Fit the Twenty-Sixth" Hexagonal Phase "Fit the Twenty-Seventh" "Fit the Twenty-Eighth" "Fit the Twenty-Ninth" "Fit the Thirtieth" "Fit the Thirty-First" "Fit the Thirty-Second" Novels The Hitchhiker's Guide to the Galaxy The Restaurant at the End of the Universe Life, the Universe and Everything So Long, and Thanks for All the Fish Mostly Harmless And Another Thing... TV series "Episode 1" "Episode 2" "Episode 3" "Episode 4" "Episode 5" "Episode 6" Comics The Hitchhiker's Guide to the Galaxy #1 The Hitchhiker's Guide to the Galaxy #2 The Hitchhiker's Guide to the Galaxy #3 The Restaurant at the End of the Universe #1 The Restaurant at the End of the Universe #2 The Restaurant at the End of the Universe #3 Life, the Universe and Everything #1 Life, the Universe and Everything #2 Life, the Universe and Everything #3 Video game The Hitchhiker's Guide to the Galaxy LP The Hitchhiker's Guide to the Galaxy The Hitchhiker's Guide to the Galaxy Part Two: The Restaurant at the End of the Universe Film The Hitchhiker's Guide to the Galaxy '''
