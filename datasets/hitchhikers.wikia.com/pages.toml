description = "Life, the Universe and Everything is the third book in The Hitchhiker's Guide to the Galaxy book series by Douglas Adams. Life, the Universe and Everything begins right after the events of The Restaurant at the End of the Universe. End of the Universe. After 4 years of being stranded on..."
full_description = '''in: Series Books, Books written by Douglas Adams, Books Life, the Universe and Everything Sign in to edit History Purge Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> “We have normality, I repeat we have normality.” This article covers a subject that is part of the real world, and thus should not be taken as a part of the Hitchhiker's universe. Life, the Universe and Everything Series The Hitchhiker's Guide to the Galaxy Attribution Author(s) Douglas Adams Cover artist(s) David Scutt (UK) Audiobook narrator(s) Stephen MooreMartin Freeman Publication information Publisher Pan Books (UK)Harmony Books (US) Release date August 1982 Country United Kingdom Language English Pages 160 pp (UK Paperback) Media type Print (Hardcover and Paperback) ISBN 0-330-26738-8 Chronology Preceded by The Restaurant at the End of the Universe Followed by So Long, and Thanks for All the Fish Life, the Universe and Everything is the third book in The Hitchhiker's Guide to the Galaxy book series by Douglas Adams. Contents 1 Plot Summary 2 Dedication 3 Appearances 3.1 Main Characters 3.2 Minor Characters 3.3 Devices 3.4 Ships 3.5 Places 3.6 Races and species 3.7 Publications 4 Trivia Plot Summary[] Life, the Universe and Everything begins right after the events of The Restaurant at the End of the Universe. End of the Universe. After 4 years of being stranded on prehistoric Earth, Arthur Dent is met by his old friend Ford Prefect, who drags him into a space-time eddy, represented by an anachronistic chesterfield sofa. The two end up at Lord's Cricket Ground two days before the Earth's destruction by the Vogons. Shortly after they arrive, a squad of robots land in a spaceship in the middle of the field and attack the assembled crowd, stealing The Ashes before departing. Another spaceship, the Starship Bistromath, arrives, with Slartibartfast at the helm, who discovers he is too late and requests Arthur and Ford's help. As they travel to their next destination, Slartibartfast explains that he is trying to stop the robots from collecting all the components of the Wikkit Gate. Long ago, the peaceful population of the planet of Krikkit, unaware of the rest of the Universe due to a dust cloud that surrounded its solar system, were surprised to find the wreckage of a spacecraft on their planet. Reverse engineering their own vessel, they explored past the dust cloud and saw the rest of the Universe, immediately taking a disliking to it and determining it must go. They built a fleet of ships and robots to attack the rest of the Universe in a brutal onslaught known as the Krikkit Wars but were eventually defeated. Realising that the Krikkit population would not be satisfied alongside the existence of the rest of the Universe, it was decided to envelop the system in a Slo-Time envelope, allowing Krikkit to survive long after the rest of the universe has ended; the Wikkit Gate was the key to the envelope. However, just before it was activated, one ship, that had been presumably lost, carrying a troop of robots appeared and began to retrieve the pieces of the Gate after they were dispersed about space and time. The three transport to an airborne party that has lasted numerous generations where another Gate component, the Silver Bail of Peace, is to be found, but Arthur finds himself separated from the others and ends up at a Cathedral of Hate created by a being called Agrajag. Agrajag reveals that Arthur has killed him countless times before, each time reincarnating into a new form that is soon killed by Arthur, and now plans to kill Arthur in revenge. However, when he realises that Arthur has yet to cause his death at a place called Stavromula Beta, Agrajag discovered he took Arthur out of his relative timeline too soon, and that killing him now would cause a paradox but attempts to kill Arthur anyway. In his insanity, Agrajag brings the Cathedral down around them. Arthur manages to escape unharmed, partially due to learning how to fly after falling and missing the ground while catching sight of a piece of luggage he had lost at a Greek airport years before. After collecting the suitcase, Arthur inadvertently comes across the flying party and rejoins his friends. Inside, they find Trillian, but they are too late to stop the robots from stealing the Bail. Arthur, Ford, Trillian, and Slartibartfast return to the Bistromath and try to head off the robots activating the Wikkit Gate. Meanwhile, the Krikkit robots steal the last piece, the Infinite Improbability Drive core from the spaceship Heart of Gold, capturing Zaphod Beeblebrox and Marvin at the same time. The Bistromath arrives too late at the gate to stop the robots, and transport to the planet to attempt to negotiate with the Krikkit people. To their surprise, they find that the people seem to lack any desire to continue the war, and are directed to the robot and spaceship facilities in orbit about the planet. With Zaphod and Marvin's help, the group is able to infiltrate the facilities and discover that the true force behind the war has been the supercomputer Hactar (due to the obvious flaw in the idea that the people of Krikkit are simultaneously smart enough to develop their Ultimate Weapon- a bomb that could destroy every star in the universe- while also being stupid enough not to realise that this weapon would destroy them too). Previously built to serve a war-faring species, he was tasked to build a supernova-bomb that would link the cores of every sun in the Universe together at the press of a button and cause the end of the Universe. Hactar purposely created a dud version of the weapon instead, causing his creators to pulverise him into dust, which thus became the dust cloud around Krikkit, still able to function but at a much weaker level. Trillian and Arthur speak to Hactar in a virtual space that he creates for them to explain himself. Hactar reveals that he spent aeons creating the spaceship that crashed on Krikkit to inspire their xenophobia and incite them to go to war, also influencing their thoughts. However, when the Slo-Time envelope was activated, his control over the population waned. As he struggles to remain functional, Hactar apologises to Trillian and Arthur for his actions before they leave for their ship. With the war over, the group collects the core of the Heart of Gold and the Ashes, the only two components of the Wikkit Gate not destroyed by the robots, and returns Zaphod and Marvin to the Heart of Gold. Returning only moments after the robots' attack at the Lord's Cricket Grounds, Arthur attempts to return the Ashes but is suddenly inspired to bowl one shot at a wicket that is being defended using a cricket ball in his bag. However, in mid-throw, Arthur suddenly realises that the ball he had was created and placed in his bag by Hactar and is actually the working version of the cosmic-supernova-bomb and that the defender of the wicket is one of the Krikkit robots, ready to detonate the bomb once thrown, all this causing him to trip, miss the ground, and allow him to fly. Arthur is able to throw the ball aside and disable the robot in mid-throw. In the epilogue, the characters are taking Arthur to a 'quiet and idyllic planet' when they come across a half-mad journalist. He tells them that he was at a court case and a witness there was given too much of a truth drug and started to tell all truth, which was driving everybody present mad. They go to the courtroom in the hope of learning the question of Life, the Universe and Everything from him. They discover he is finished and he has forgotten it all. He then attempts to tell Arthur where God's last message to his creation is, though he dies seemingly before Arthur is able to memorise the location. In the end, Arthur goes to live on the planet Krikkit, where he becomes a more skilful flier and learns bird language. Dedication[] for Sally, Rhea, Ariba, and Siya Appearances[] Main Characters[] Arthur Dent Ford Perfect Slartibartfast Zaphod Beeblebrox Trillian Astra Marvin Minor Characters[] Bowerick Wowbagger Arthur Philip Deodat Zem Eddie the Computer Zipo Bibrok 5 x 10⁸ (Informational Illusion) Agrajag Thor Hactar Half-Mad Journalist Prak Effrafax of Wug (mentioned) Eccentrica Gallumbits (mentioned) A-Rth-Urp-Hil-Ipdenu (mentioned) Lord High Sanvalvwag of Hollop (mentioned) Lallafa (mentioned) Hurling Frootmig (mentioned) Lig Lury Jr (mentioned) God (mentioned) Lajestic Vantrashell of Lob (mentioned) Devices[] The Hitchhiker's Guide to the Galaxy Towel Sub-Etha Sens-O-Matic Sofa Krikkit War Robots Maxi-Slorta Hypernuclear Device Bistromathic Drive Autorory Nutri-Matic Drink Synthesizer Kill-o-Zap Gun Wikkit Gate Wikkit Key Steel Pillar of Strength and Power (Marvin's leg) Gold Bail of Prosperity (Infinite Improbability Drive) Silver Bail of Peace (Rory Award) Perspex Pillar of Science and Reason (Argabuthon Sceptre of Justice) The Wooden Pillar of Nature and Spirituality (The Ashes) Slo-Time Envelope Ultimate Weapon Ships[] Wowbagger's Starship Starship Bistromath Krikkit Warship Heart of Gold Starship Titanic (Informational Illusion) Krikkit One (Informational Illusion) Places[] Earth Lord's Cricket Ground Squornshellous Zeta Han Wavel Allosimanius Syneca Vod (Informational Illusion) Krikkit Argabuthon Betelgeuse (mentioned) Eroticon VI (mentioned) University of Maximegalon (mentioned) Aldebaran (mentioned) Artifactovol (mentioned) Cloudworlds of Yaga (mentioned) Cathedral of Chalesm (mentioned) Long Lands of Effa (mentioned) Stavromula Beta (mentioned) Ursa Minor Beta (mentioned) Jaglan Beta (mentioned) Ursa Minor Alpha (mentioned) Valhalla (mentioned) Striterax (mentioned) Stug (mentioned) Cwulzenda (mentioned) Frazfraga (mentioned) Jajazikstak (mentioned) Carfrax (mentioned) Varlengooten (mentioned) Dalforsas (mentioned) Preliumtarn (mentioned) Races and species[] Humans Betelgeusians Magratheans Mattresses Krikkiter (Informational Illusion) Soolfinian (Informational Illusion) Neanderthal (mentioned) Golgafrinchan (mentioned) Arcturan Megavoidwhale (mentioned) Arcturan Megaleech (mentioned) Silastic Armorfiend (mentioned) Strenuous Garfighter (mentioned) Strangulous Stilettians (mentioned) Publications[] The Ultra-Complete Maximegalon Dictionary of Every Language Ever (mentioned) Squornshellous Swamptalk (mentioned) Encyclopedia Galactica (mentioned) Songs of the Long Land (mentioned) Trivia[] Life, the Universe and Everything was the reworking of "The Krikkitmen", a rejected Doctor Who serial written by Douglas Adams. In 2018, the story was given a direct novelisation as Doctor Who and the Krikkitmen, written by Doctor Who novelist James Goss in a deliberate pastiche of Adams' style. Categories Categories: Series Books Books written by Douglas Adams Books Community content is available under CC-BY-SA unless otherwise noted. More Fandoms Fantasy Sci-fi'''
