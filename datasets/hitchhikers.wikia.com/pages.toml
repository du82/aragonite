["https://hitchhikers.wikia.com/wiki/Blog:Recent_posts"]
title = "Blog:Recent posts | Hitchhikers | Fandom"
description = "Community content is available under CC-BY-SA unless otherwise noted."
full_description = '''Recent Blog Posts Blog posts 61 posts <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Spacepigeon • 15 November 2020 1 User Safety - Unaffiliated “Hitchhiker’s Wiki Discord” Hello all! I do hope everyone in our little community has been keeping as well as they can be during this tumultuous year. Understandably editing has slowed down during 2020 but I’m glad to see it as it means our users are prioritising real life things and that’s more important. I just wanted to make you aware that a user who has been permanently banned from the Hitchhiker’s Wiki for refusing to follow guidelines, harassment, and quite frankly a lot of self entitled and disrespectful behaviour is back to attention seeking in all the wrong ways. A day after receiving a permanent ban the user CarverSindile started their latest attempt to clamour for attention and continue their affiliation with our Wiki by creating what they and no one else is… Read Full Post Spacepigeon • 24 August 2020 0 Hitchhiker's Video Game Art Hi all! If you're reading this I hope you've been able to keep safe during everything that's been happening in the world. Understandably many FANDOM editors, myself included, have had to put our personal lives and work before our editing and I hope people are able to continue to focus on making themselves a priority as much as possible! Just thought I'd share some of the original art from the manual and promo material for the 1984 Hitchhiker's video game that I stumbled across recently! I'd never seen it before and I hope it's interesting to some other people out there! --Pigeon Read Full Post CarverSindile • 28 May 2020 0 I'm Back I go away to hibernate a year and come back and discover this wiki doesn't seem as active when I was activated/active on it. Edit: I wonder why. CarverSindile (talk) 10:18, August 3, 2020 (UTC) Read Full Post Spacepigeon • 12 March 2020 1 Hitchhiker's turns 42! Hello my fellow Megadodo staff! I'm a few days late but, well, time is a construct and all that - anyway on 8th March we celebrated 42 years of The Hitchhiker's Guide to the Galaxy which first aired on that day in 1978! Pan Macmillan has reprinted the scripts and novels in colourful new 42nd anniversary editions, the British Library hosted a bunch of events, and BBC Radio 4 aired the original episodes - it's wonderful to know that Hitchhiker's still has such an enduring fanbase and isn't going away anytime soon! BBC Radio 4 extra had a great one hour special to celebrate the 42nd anniversary which might interest you - it's all about other sci-fi podcasts, with Rachel Wheeley from The Strange Case of Starship Iris which is a podcast I'd recommend… Read Full Post Spacepigeon • 4 March 2020 0 42 Medals! Hello all, hope you and your towels are keeping well! Just wanted to congratulate us all for earning a total of 42 Milliways Medals between us! Keep up the great work, folks! -Pigeon Read Full Post Spacepigeon • 23 December 2019 1 Happy Hitchhiker Holidays 2019! Hey all, hope your winter is going well and happy holidays to all celebrating something this time of year! Just wanted to thank everyone who has helped out on the Wiki this year, and I'm not going anywhere soon - I'll be joining you all in this new year (and new decade!) and still trying to keep the Hitchhiker's Wiki in tip top condition! It is a shame that we've lost some regular contributors - but life is busy and it's very understandable when people have to put other things in front of volunteering to edit Wikis for free, it is just a hobby for most after all! I'm so grateful to anyone who has been here to help with putting some life back into this Wiki - it's come so far since when I first adopted it. I apologise for being busy especiall… Read Full Post Spacepigeon • 16 September 2019 2 One year admin-versary! Hello all! I just realised it's been a year since I adopted this Wiki - how time flies when you're on a planet with a 365 day year, give or take a leap year! It's interesting to look back and compare the Wiki to how it was a year ago, it was like a packet of biscuits left forgotten in the back of a mouldy cupboard, but now look at it! We get people updating each week, the logo now makes it clear that this isn't a Wiki about general hitchhiking and backpacking, and our main characters have information on their pages! Wonderful stuff! It makes me quite proud to be part of a community that has helped bring this Wiki up to date, into the 21st century and beyond! A big thanks to everyone who has contributed and left their footprint on this moon of… Read Full Post Spacepigeon • 25 May 2019 1 Happy Towel Day 2019! Hello all! Happy Towel Day to you! I just wanted to say thank you to everyone who has been a part of this Hitchhikers Wiki community over the past few months and made it the great place it is today! It's so good to know that we are growing this community of Hitchhikers fans by the day! Here's to you all! Hope you have a great Towel Day! I'm going to go and watch the tv series and be sure to keep my towel with me at all time. Catch you later, hoopy froods! -Spacepigeon P.S: To celebrate, our new poll is live on the main page! Take a look and vote for your favourite! Read Full Post Spacepigeon • 10 May 2019 2 New poll - suggestions needed! Hello all! It's about time for a new poll on the Main Page - don't you think? We've had so many responses for our current poll, and it's clear that everyone's favourite character is Marvin! Comment below with your suggestions for new poll topics, any we don't do next will be added to a list for future polls! I think it could be interesting to find out who everyone's favourite villain or antagonist is from the Hitchhiker's series... or maybe to find out which adaption is everyone's favourite... let me know what you think our next poll could be about! Keep ahold of your towels, folks! -Spacepigeon UPDATE: Here is our list of upcoming polls, feel free to add your suggestions in the comments below and you might see them on the main page in future! Whi… Read Full Post SonnyGalaxy42 • 25 April 2019 1 I'm back ☆ Hello☆ Sorry for my inactivity, but i have been a hiatus for a long time ~ Read Full Post Spacepigeon • 24 April 2019 1 Main Page protection issued after graffiti Hi all, just wanted to make you aware that the Main Page has been put under Protection due to recent graffiti. Thankyou to CarterMahoney for the warning about this particular user, and to Sir Maximillian for reverting said graffiti! Very glad to see community spirit in action despite such disappointing behaviour from that user. Due to the high volume amounts of graffiti this user has been undertaking, and the fact that they seem keen to continue this behaviour, I have decided to put the Main Page under Protection for an unspecified amount of time in order to save us from having to keep reverting any more graffiti. We have been warned that our Wiki is a target for them, so I think it a good idea to put up some extra precautions for the time … Read Full Post SpoonRaptor • 10 April 2019 1 Exactly 3 weeks since I first discovered Hitchhiker's Guide! Well, perhaps not exactly. ​​​​​​I haven't been keeping a prescise tally, but that had a better ring to it than "About three weeks or so ago". I suppose this is an occasion. Not a momentous occasion, perhaps not even a grand occasion, but an occasion nonetheless. I had known about the movie for some time, seeing it flash across the screen on Netflix on my family movie nights. I vaguely knew there were books, but I had no idea what it was about. For some while I had suggested to my family to watch it, but on family movie night we all have to agree and my mom's not that into sci-fi, and my dad said I wouldn't get all the British humor. Movie nights are Saturdays and Sundays, and one night after seeing it suggested but eventually having the fa… Read Full Post Spacepigeon • 21 March 2019 0 Hitchhiker's TV Show Merch! Hello all! I always see a lot of Hitchhiker's merch made by fans that's for the books and especially for the film, but never much love for the TV series. Well, I just found some really cool patches and towels (of course) embroidered with designs from the TV show so I thought I'd share it with you all because I know you'll appreciate how cool these are! They're from an Etsy shop in the UK, here's the link for anyone interested in seeing the rest of their Hitchhiker's stuff: https://www.etsy.com/uk/shop/GnTEmbroidery I think I'm going to be buying something for sure! Hope you're all having a good week! -Pigeon Read Full Post TheAnswerIsFortytwo • 10 March 2019 0 Hello World! Hey everyone! I am currently writing a paper on The Hitchhiker and I thought I might say hi here. Yeah let's how all of this goes. Thanks to everyone for all the helpfull articles :) See ya! Read Full Post Spacepigeon • 6 February 2019 2 Wordmark (Logo) updated! Hello all! I hope February is treating you well. I've been wanting to update our logo (or wordmark, if you want to be fancy) for quite a while. In the past we've had issues with people thinking this Wiki is about Hitchhiking in general... and the logo just saying 'Hitchhiker Wiki' didn't make it much clearer! (Though it was a cool sci-fi font.) I've changed the logo to say 'The Hitchhiker's Guide to the Galaxy Wiki' with an image of the thumb-in-planet logo next to it, just to make sure it's very clear what we are about. As the Wiki is now pretty active and, thanks to the hard work of our community, has a lot of updated and informational articles, I thought it was a good time to update our brand, so to speak. I hope the logo is clear and acce… Read Full Post Spacepigeon • 29 January 2019 0 Infoboxes are changing Hi all! Just wanted to let you know that I am planning to finally update the infoboxes to the new system. In short, this will mean: Infoboxes will be more compatible with source code In