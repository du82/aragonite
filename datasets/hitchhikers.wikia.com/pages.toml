ppearance "Fit the Second"(15 March 1978) Portrayed by Mark Wing-Davey (radio, TV, LP)Sam Rockwell (film) “If there's anything more important than my ego around, I want it caught and shot now.” —Zaphod Beeblebrox to Trillian[src] Zaphod Beeblebrox is a rude and narcissistic Betelgeusian criminal and former President of the Galaxy. Having stolen the starship Heart of Gold, he traveled the galaxy for some time, going on many bizarre adventures and searching for a purpose to his life. Contents 1 Biography 1.1 Early life 1.2 Galactic presidency 1.3 Search for Magrathea 2 Personality 3 Abilities 4 Possessions 5 Appearances 6 Trivia 7 References Biography[] Early life[] Zaphod Beeblebrox was born on Betelgeuse V and was a half-semi-cousin of Ford Prefect, with whom he shared three of the same mothers. Due to an accident with a contraceptive and a time machine, his direct ancestors from his father were also his direct descendants.[2][3] Galactic presidency[] To be added Search for Magrathea[] To be added Personality[] Zaphod is said to be "clever, imaginative, irresponsible, untrustworthy, extrovert, nothing you couldn't have guessed." As President of the Galaxy, his responsibility in that position was to draw attention away from the true rulers of the universe. To that end, Zaphod and his outrageous behaviour were highly successful. Abilities[] He is the only man to have survived the Total Perspective Vortex (albeit in an electronically synthesized universe which was created especially for him). He used his position as President of the Galaxy to steal the Heart of Gold, a spaceship taking advantage of the Infinite Improbability Drive, at its unveiling. He is also the inventor of the Pan Galactic Gargle Blaster and is the only person alive who can drink more than three in a single sitting. Zaphod has a successful business in secondhand biros. This may be due to his discovery of a planet where biros escape to. If so, he employed a man to sit on this now empty planet denying the whole thing. Possessions[] To be added Appearances[] Appearances of Zaphod Beeblebrox Radio series Primary Phase "Fit the Second" "Fit the Third" "Fit the Fourth" "Fit the Fifth" "Fit the Sixth" Secondary Phase "Fit the Seventh" "Fit the Eighth" "Fit the Ninth" "Fit the Tenth" "Fit the Eleventh" "Fit the Twelfth" Tertiary Phase "Fit the Thirteenth" "Fit the Fifteenth" "Fit the Seventeenth" "Fit the Eighteenth" Quintessential Phase "Fit the Twenty-Third" "Fit the Twenty-Fourth" "Fit the Twenty-Sixth" Hexagonal Phase "Fit the Twenty-Seventh" "Fit the Twenty-Eighth" "Fit the Twenty-Ninth" "Fit the Thirtieth" "Fit the Thirty-First" "Fit the Thirty-Second" Novels The Hitchhiker's Guide to the Galaxy The Restaurant at the End of the Universe Life, the Universe and Everything And Another Thing... Short stories Young Zaphod Plays it Safe TV series "Episode 2" "Episode 3" "Episode 4" "Episode 5" "Episode 6" Comics The Hitchhiker's Guide to the Galaxy #1 The Hitchhiker's Guide to the Galaxy #2 The Hitchhiker's Guide to the Galaxy #3 The Restaurant at the End of the Universe #1 The Restaurant at the End of the Universe #2 The Restaurant at the End of the Universe #3 Life, the Universe and Everything #1 Life, the Universe and Everything #2 Life, the Universe and Everything #3 Video game The Hitchhiker's Guide to the Galaxy LP The Hitchhiker's Guide to the Galaxy The Hitchhiker's Guide to the Galaxy Part Two: The Restaurant at the End of the Universe Film The Hitchhiker's Guide to the Galaxy Trivia[] Zaphod considers Alice Beeblebrox his favourite mother.[4] Zaphod has, at least on one occasion, carried adrenaline pills with him.[5] By one account, Zaphod visited Brontitall in the midst of his search for the Ruler of the Universe, but that was later revealed to be a delusion brought on by a psychotic episode.[6][7] In the Doctor Who webcast "Shada", versions of Zaphod and Arthur are seen imprisoned in Shada. References[] ↑ "Fit the Ninth" ↑ The Hitchhiker's Guide to the Gal