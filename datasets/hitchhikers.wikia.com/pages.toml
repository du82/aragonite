full_description = '''in: Blog posts Hello☆ SonnyGalaxy42 • 30 October 2018 • User blog:SonnyGalaxy42 <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Hello everyone!☆I wanted to open my first blog to introduce myself. I'm a very shy girl, and I'm always afraid of being teased because of my problem, because I'm autistic, and it’s very difficult for me to make many friends.However, I'm a very brilliant girl who spends her time reading or watching scientific and astronomy documentaries.I also love anything related to sci-fi, and i like to writing and inventing storiesI can’t stand rude people and I hate liars.I'm sorry if I wrote all these things, but I did not know what to say.However I'm happy that there is a wiki on a series that I love since childhood! Ford Prefect is my fav n°1 ☆I hope to make friends here, I have already had negative experiences where they treated me as stupid, just because I love space and sci-fi... ☆So long and thanks for all the fish☆ Categories Categories: Blog posts Community content is available under CC-BY-SA unless otherwise noted. More Fandoms Fantasy Sci-fi'''
