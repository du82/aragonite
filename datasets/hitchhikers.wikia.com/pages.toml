If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> TV Comics Film Ford Prefect Biographical information Full name Unpronounceable Status Alive Alias(es) Ford PrefectIx Relatives Three unnamed mothersUnnamed father and uncle †Zaphod Beeblebrox (half-semi-cousin) Planet of origin Betelgeuse V Occupation Field researcher for The Hitchhiker's Guide to the Galaxy Physical information Species Betelgeusian Gender Male Hair colour Ginger Eye colour Blue Behind the Scenes First appearance Fit the First(8 March, 1978) Portrayed by Geoffrey McGivern (radio, LP)David Dixon (TV)Yasiin Bey (film) “Time is an illusion. Lunchtime, doubly so.” —Ford Prefect to Arthur Dent[src] Ford Prefect is an adventurous, eccentric, and existentialist Betelgeusian field researcher for The Hitchhiker's Guide to the Galaxy who travelled across the universe with Arthur Dent on many bizarre adventures, primarily as a crewman on the Heart of Gold and the Bistromath. Contents 1 Biography 1.1 Early life 1.2 Field Research for the Guide 1.3 Escaping Earth's destruction 1.4 Search for Magrathea 1.5 Visit to Milliways 1.6 Later life 2 Personality 3 Possessions 4 Appearances 5 Trivia 6 References Biography[] Early life[] The Betelgeusian who would come to be known as Ford Prefect was born on Betelgeuse V to his simultaneous father and uncle from Betelgeuse VII. He was named in an obscure Betelgeusian dialect that died out when Betelgeuse VII was destroyed, and so he could not pronounce it, causing his father/uncle to die of shame. As such, his friends called him "Ix", which in English translates to "boy who is not able satisfactorily to explain what a Hrung is or why it should choose to collapse on Betelgeuse VII". Over time, he developed a close bond with Zaphod Beeblebrox, his egotistical and curt two-headed half-semi-cousin.[1] Field Research for the Guide[] Eventually, he grew up to be a field researcher for The Hitchhiker's Guide to the Galaxy, the famous and controversial travel guide. He traveled across the Milky Way Galaxy researching for new entries in the Guide, and eventually found himself on the planet Earth, of which the initial Guide entry was simply the word "Harmless". Taking the name "Ford Prefect" to hide among the Earthlings undetected, he studied the planet and its seemingly dominant species, the humans, for many years, which proved easy seeing how he closely resembled them. <a href="https://static.wikia.nocookie.net/hitchhikers/images/3/3b/Arthur_and_Ford_TV.png/revision/latest?cb=20230909144922" class="mw-file-description image"><img alt="Arthur and Ford TV" src="https://static.wikia.nocookie.net/hitchhikers/images/3/3b/Arthur_and_Ford_TV.png/revision/latest/scale-to-width-down/200?cb=20230909144922" decoding="async" loading="lazy" width="200" height="149" class="thumbimage" data-image-name="Arthur and Ford TV.png" data-image-key="Arthur_and_Ford_TV.png" data-relevant="1" data-src="https://static.wikia.nocookie.net/hitchhikers/images/3/3b/Arthur_and_Ford_TV.png/revision/latest/scale-to-width-down/200?cb=20230909144922" /></a> Ford and Arthur Dent[2] Ford wrote a competent and lengthy article about Earth and its culture, but the Guide editors reduced it down to a two-word entry: "Mostly harmless", tossing away much of Ford's hard work. He spent fifteen years trapped among humanity, frequently getting drunk and trying to locate passing spaceships to hitch a ride on to get back home. In his last six years on the planet, Ford met the friendly but simple-minded human Arthur Dent, and the two became fast friends, with Ford finding value in Arthur's kind demeanor.[1] Escaping Earth's destruction[] In the 1980s[3], Ford detected a Vogon Constructor Fleet approaching Earth to demolish it with his Sub-Etha Sens-O-Matic. When they arrived, Ford decided to take Arthur with him, using his electronic thumb to signal the Dentrassi cooks on board one of the Vogon ships, who hated the Vogons and loved to irritate them by bringing on hitchhikers, and teleport them up as the Vogons destroyed the planet. He explained where they were, giving Arthur his copy of the Guide to stop him from panicking and a Babel Fish to help him translate the Vogons' language. <a href="https://static.wikia.nocookie.net/hitchhikers/images/5/54/Jeltz_reads_his_poetry_to_Arthur_and_Ford_%28TV%29.png/revision/latest?cb=20230909145811" class="mw-file-description image"><img alt="Jeltz reads his poetry to Arthur and Ford (TV)" src="https://static.wikia.nocookie.net/hitchhikers/images/5/54/Jeltz_reads_his_poetry_to_Arthur_and_Ford_%28TV%29.png/revision/latest/scale-to-width-down/200?cb=20230909145811" decoding="async" loading="lazy" width="200" height="152" class="thumbimage" data-image-name="Jeltz reads his poetry to Arthur and Ford (TV).png" data-image-key="Jeltz_reads_his_poetry_to_Arthur_and_Ford_%28TV%29.png" data-relevant="1" data-src="https://static.wikia.nocookie.net/hitchhikers/images/5/54/Jeltz_reads_his_poetry_to_Arthur_and_Ford_%28TV%29.png/revision/latest/scale-to-width-down/200?cb=20230909145811" /></a> Enduring Vogon poetry [4] Unfortunately, soon after the pair were captured by a Vogon guard and were brought before the captain, who subjected them to a torturous reading of Vogon poetry, the third worst poetry in the universe. When the captain asked what the pair thought of his poem, they tried to compliment it to get on his good side, but it backfired and he threw them out the airlock into the vacuum of space.[1] Search for Magrathea[] <a href="https://static.wikia.nocookie.net/hitchhikers/images/7/7d/Marvin_and_Ford_and_Arthur_%28TV%29.jpg/revision/latest?cb=20180825235529" class="mw-file-description image"><img alt="Marvin and Ford and Arthur (TV)" src="https://static.wikia.nocookie.net/hitchhikers/images/7/7d/Marvin_and_Ford_and_Arthur_%28TV%29.jpg/revision/latest/scale-to-width-down/200?cb=20180825235529" decoding="async" loading="lazy" width="200" height="149" class="thumbimage" data-image-name="Marvin and Ford and Arthur (TV).jpg" data-image-key="Marvin_and_Ford_and_Arthur_%28TV%29.jpg" data-relevant="1" data-src="https://static.wikia.nocookie.net/hitchhikers/images/7/7d/Marvin_and_Ford_and_Arthur_%28TV%29.jpg/revision/latest/scale-to-width-down/200?cb=20180825235529" /></a> Ford and Arthur following Marvin to the control cabin on the Heart of Gold[4] By insurmountable odds, mere seconds before they suffocated in the void, Ford and Arthur were picked up by the Heart of Gold, a spacecraft fitted with a new Infinite Improbability Drive, and rescued from their demise. They spent a few minutes returning to normal, with Ford having a brief stint as a penguin, before they were approached and taken to the bridge by the manically depressed servant robot Marvin, who seemed to endlessly to complain about his depression to those around him. By another staggering coincidence, Ford and Arthur discovered that the ship had been stolen and was captained by none other than Zaphod Beeblebrox, who had become President of the Galaxy since last seeing Ford, and Trillian, an intelligent and polite human woman who Arthur once met at a very nice party in Islington that he totally blew it with. Zaphod explained that they were searching for the legendary planet of Magrathea, the fabled home of a race of custom planet manufacturers that became the richest planet in existence, and Ford and Arthur joined him on this quest, despite Ford's skepticism of its existence. <a href="https://static.wikia.nocookie.net/hitchhikers/images/a/af/Tossed_about_the_cabin_%28TV%29.png/revision/latest?cb=20230912125343" class="mw-file-description image"><img alt="Tossed about the cabin (TV)" src="https://static.wikia.nocookie.net/hitchhikers/images/a/af/Tossed_about_the_cabin_%28TV%29.png/revision/latest/scale-to-width-down/200?cb=20230912125343" decoding="async" loading="lazy" width="200" height="150" class="thumbimage" data-image-name="Tossed about the cabin (TV).png" data-image-key="Tossed_about_the_cabin_%28TV%29.png" data-relevant="1" data-src="https://static.wikia.nocookie.net/hitchhikers/images/a/af/Tossed_about_the_cabin_%28TV%29.png/revision/latest/scale-to-width-down/200?cb=20230912125343" /></a> The crew is tossed around the cabin while evading the Magratheans' automated missile attack[5] When the Heart of Gold came into orbit around the lost planet, Ford continued to argue with Zaphod that it couldn't possibly be Magrathea, before being forced to help him and Trillian take evasive action to avoid the guided thermonuclear missiles launched at them by the planet's automated defense systems, leading them being tossed about the cabin and one of the crew members sustaining a bruise to the upper arm. They narrowly avoided destruction by Arthur's quick move to turn on the Infinite Improbability drive and turn the missiles into a bowl of petunias and a very surprised-looking sperm whale, and so made their way to the planet's surface to explore it. Upon landing the Heart of Gold, Ford, Trillian, and Zaphod went to scout out the planet, investigating an underground tunnel opened up when the sperm whale splattered against the ground, while Arthur and Marvin stayed behind (partially as lookout, partially to avoid them). While investigating the caverns, Zaphod revealed to Ford and Trillian that parts of his brains had been burned away and some of his memories were missing, and that he was trying to figure out why. Before they could ponder this anymore, the trio were gassed and imprisoned by the Magratheans. When they woke up, Ford and Trillian complained until the Magratheans gave them a catalogue to keep them busy, and when a planet made entirely of gold came up, they woke up Zaphod. After leaving their cell, Ford, Zaphod, and Trillian met a pair of mice named Frankie and Benjy, Trillian's pet mice she'd brought back from the Earth. The mice offered them a feast and explained that they were a race of hyper-intelligent pan-dimensional beings who commissioned the Magratheans to build the Earth, which was really a giant supercomputer, to calculate the Ultimate Question of Life, the Universe and Everything, to which another supercomputer, Deep Thought, had determined the Ultimate Answer was 42. The Vogons had destroyed the planet five minutes before the moment of readout, and so they wished to scan the brain of the only surviving human on Earth who was there right up until the moment of destruction: Arthur Dent. <a href="https://static.wikia.nocookie.net/hitchhikers/images/8/84/Ford_turns_down_the_mice_%28TV%29.png/revision/latest?cb=20230912130226" class="mw-file-description image"><img alt="Ford turns down the mice (TV)" src="https://static.wikia.nocookie.net/hitchhikers/images/8/84/Ford_turns_down_the_mice_%28TV%29.png/revision/latest/scale-to-width-down/200?cb=20230912130226" decoding="async" loading="lazy" width="200" height="149" class="thumbimage" data-image-name="Ford turns down the mice (TV).png" data-image-key="Ford_turns_down_the_mice_%28TV%29.png" data-relevant="1" data-src="https://static.wikia.nocookie.net/hitchhikers/images/8/84/Ford_turns_down_the_mice_%28TV%29.png/revision/latest/scale-to-width-down/200?cb=20230912130226" /></a> "Sorry, mice, old mates, I don't think we've got a deal."[6] Soon after, the Magrathean Slartibartfast brought in Arthur after explaining all of this to him as well, and the mice then offered a great sum of money for Arthur's brain, as they would need to remove it and dissect it to get the Question. They even offered to replace it with an electronic brain (which Zaphod found quite reasonable, seeing how Arthur barely used his organic brain anyway), but Arthur refused, and the four quickly escaped, only to be cornered by two galactic po'''
