f (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> TV Comics The Hitchhiker's Guide to the Galaxy Status Active Manufacturer(s) Megadodo Publications Usage Electronic travel guide First appearance Fit the First “The Hitchhiker's Guide has already supplanted the great Encyclopaedia Galactica as the standard repository of all knowledge and wisdom, for though it has many omissions . . . it scores over the older, more pedestrian work in two important respects. First, it is slightly cheaper; and secondly it has the words DON'T PANIC inscribed in large friendly letters on its cover.” —The foreword to The Hitchhiker's Guide to the Galaxy, 1979[src] The Hitchhiker's Guide to the Galaxy, also known simply as the Guide or the book, was a guidebook for hitch-hikers throughout the Universe which featured heavily in the sci-fi series of the same name. It was produced by Megadodo Publications, which employed Ford Prefect as one of its researchers; eventually leading him to become stranded on planet Earth for fifteen years while writing a Guide entry about Earth. The Guide served in the original radio series as a plot device; giving the listeners' background information about the fictional world of Hitchhiker's and moving the story forward by narrating the events and often breaking the fourth wall. Contents 1 Physical description 2 Personality 3 History 4 Entries 4.1 Alcohol 4.2 Antares 4.3 Babel Fish 4.4 Drunkenness 4.5 Earth 4.6 Eccentrica Gallumbits 4.7 Flying 4.8 Haggunenons 4.9 History of every major Galactic Civilization 4.10 Grammar 4.11 Infinite 4.12 Intergalactic Bar Billiards 4.13 Magrathea 4.14 Sirius Cybernetics Corporation 4.15 Space 4.16 Towels 4.17 Universe 4.18 Veet Voojagig 4.19 Vogon Constructor Fleets 5 References Physical description[] The Guide itself was a device which, according to the first book, resembled a largish electronic calculator which looked “insanely complicated.” It had about a hundred tiny flat press buttons and a screen about four inches square on which any one of a million "pages" could be summoned at a moment's notice. It was said that the reason why it was published in the form of a micro sub meson electronic component is that “if it were printed in normal book form, an interstellar hitch hiker would require several inconveniently large buildings to carry it around in.” A new edition of the Guide - named the Guide Mark II - was published in the fifth novel Mostly Harmless. This new edition was artificially intelligent and capable of interacting with the reader. It was described as a black, birdlike robot. In the television series, the Guide looked similar to how it had been described in the book. It resembled a calculator, with a small screen and several buttons on the front. It was about the size of an average human hand. In the film, it looked more like a conventional book. In this adaption, there was a hitch-hiking symbol on the front cover of a thumb, and the “Don't Panic” was on the back cover. In the movie version, the Guide was voice activated, and the screen showed several bars which were the links to the subsections of the articles. “The Hitch Hiker's Guide to the Galaxy says that if you hold a lungful of air you can survive in the total vacuum of space for about thirty seconds. However it goes on to say that . . . the chances of getting picked up by another ship within those thirty seconds are two to the power of two hundred and sixty-seven thousand seven hundred and nine to one against.” —Chapter 9, The Hitchhiker's Guide to the Galaxy, 1979[src] Personality[] Although the Guide was merely a resource for hitch-hikers it had a distinctly flippant and exuberant tone, occasionally bordering on sarcastic. This may either have been due to the voice with which the Guide spoke, or the tone with which the many articles were written. On one occasion the Guide was said to speak in a “still quiet measured voice.” The Guide Mark II was said to have appeared pleasant and friendly, however, it was in fact deeply malevolent. Oddly enough, it later saved all the main characters from certain doom as part of some unknown agenda. “The Hitch Hiker's Guide to the Galaxy is an indispensable companion to all those who are keen to make sense of life in an infinitely complex and confusing Universe . . . where it is inaccurate it is at least definitely inaccurate. In cases of major discrepancy it's always reality that's got it wrong. . . . "The Guide is definitive. Reality is frequently inaccurate."” —Chapter 6, The Restaurant at the End of the Universe, 1980[src] History[] The Hitchhiker's Guide to the Galaxy was a “wholly remarkable book." It had been compiled and recompiled many times over many years and under many different editorships. It contained contributions from countless numbers of travellers and researchers. It is said that Hurling Frootmig was the founder of the Guide, and established its fundamental principles of honesty and idealism before he “went bust.” After many years of heart-searching and penury, Frootmig had a chance encounter with the Holy Lunching Friars of Voondoon, after which he refounded the Guide and “laid down its fundamental principles of honesty and idealism and where you could stuff them both.” Depiction from the radio series release. Following this change of heart, the Guide’s founder began to develop and explore the role of editorial lunch-breaks, which played a crucial part in the Guide’s history, since it resulted in visitors to the offices doing most of the actual work, instead of the editors. Shortly thereafter, the Guide was taken over by Megadodo Publications of Ursa Minor Beta, leading the Guide towards its first major commercial success and keeping the staff very financially sound. This positive change allowed the fourth editor of the Guide, Lig Lury Jr, to embark on extraordinary lunch-breaks, which led to him leaving his office late one morning and never returning. As he never formally resigned his editorship, all editors since Lig Lury Jr have been designating acting editors, with Lig’s desk still preserved the way he left it. In its time, the Guide became popular than the Celestial Home Care Omnibus, better selling than Fifty-three More Things to do in Zero Gravity, and more controversial than Oolon Colluphid's trilogy of philosophical blockbusters Where God Went Wrong, Some More of God's Greatest Mistakes and Who is this God Person Anyway? The Guide was seen to be a lot less lengthy and complicated than Dan Streetmentioner's book: Time Traveler's Handbook of 1001 Tense Formations. It skipped over the exhaustive topic of time travel and grammar, pausing only to note that the term ‘Future Perfect’ had been abandoned since it will have been discovered not to be. Although the Guide contained at least 5,973,509 contributions,[1] it was called “a very unevenly edited book and contains many passages that simply seemed to its editors like a good idea at the time." It was also said that “most of the actual work got done by any passing stranger who happened to wander into the empty offices of an afternoon and saw something worth doing.”[2] “Space . . . is big. Really big. You just won't believe how vastly, hugely, mind-bogglingly big it is. I mean, you may think it's a long way down the road to the chemist, but that's just peanuts to space. Listen... ” —Chapter 9, The Hitchhiker's Guide to the Galaxy, 1979[src] Entries[] Alcohol[] “The Hitch Hiker's Guide to the Galaxy also mentions alcohol. It says that the best drink in existence is the Pan Galactic Gargle Blaster. It says that the effect of a Pan Galactic Gargle Blaster is like having your brains smashed out by a slice of lemon wrapped round a large gold brick. The Guide also tells you on which planets the best Pan Galactic Gargle Blasters are mixed, how much you can expect to pay for one and what voluntary organizations exist to help you rehabilitate afterwards. The Guide even tells you how you can mix one yourself. Take the juice from one bottle of that Ol' Janx Spirit, it says. Pour into it one measure of water from the seas of Santraginus V - Oh that Santraginean sea water, it says. Oh those Santraginean fish!!! Allow three cubes of Arcturan Mega-gin to melt into the mixture (it must be properly iced or the benzine is lost). Allow four litres of Fallian marsh gas to bubble through it, in memory of all those happy Hikers who have died of pleasure in the Marshes of Fallia. Over the back of a silver spoon float a measure of Qualactin Hypermint extract, redolent of all the heady odours of the dark Qualactin Zones, subtle sweet and mystic. Drop in the tooth of an Algolian Suntiger. Watch it dissolve, spreading the fires of the Algolian Suns deep into the heart of the drink. Sprinkle Zamphuor. Add an olive. Drink ... but ... very carefully ...” Antares[] “The guide started to explain to anyone who cared to listen about the best ways of smuggling Antarean parakeet glands out of Antares (an Antarean parakeet gland stuck on a small stick is a revolting but much sought after cocktail delicacy and very large sums of money are often paid for them by very rich idiots who want to impress other very rich idiots).” Babel Fish[] “"The Babel fish," said The Hitch Hiker's Guide to the Galaxy quietly, "is small, yellow and leech-like, and probably the oddest thing in the Universe. It feeds on brainwave energy not from its carrier but from those around it. It absorbs all unconscious mental frequencies from this brainwave energy to nourish itself with. It then excretes into the mind of its carrier a telepathic matrix formed by combining the conscious thought frequencies with nerve signals picked up from the speech centres of the brain which has supplied them. The practical upshot of all this is that if you stick a Babel fish in your ear you can instantly understand anything said to you in any form of language. The speech patterns you actually hear decode the brainwave matrix which has been fed into your mind by your Babel fish. "Now it is such a bizarrely improbable coincidence that anything so mindboggingly useful could have evolved purely by chance that some thinkers have chosen to see it as the final and clinching proof of the non-existence of God. "The argument goes something like this: `I refuse to prove that I exist,' says God, `for proof denies faith, and without faith I am nothing.' "`But,' says Man, `The Babel fish is a dead giveaway, isn't it? It could not have evolved by chance. It proves you exist, and so therefore, by your own arguments, you don't. QED.' "`Oh dear,' says God, `I hadn't thought of that,' and promptly vanished in a puff of logic. "`Oh, that was easy,' says Man, and for an encore goes on to prove that black is white and gets himself killed on the next zebra crossing. "Most leading theologians claim that this argument is a load of dingo's kidneys, but that didn't stop Oolon Colluphid making a small fortune when he used it as the central theme of his best- selling book Well That About Wraps It Up For God. "Meanwhile, the poor Babel fish, by effectively removing all barriers to communication between different races and cultures, has caused more and bloodier wars than anything else in the history of creation."” Drunkenness[] “Trillian did a little research in the ship's copy of The Hitchhiker's Guide to the Galaxy. It had some advice to offer on drunkenness. "Go to it," it said, "and good luck."” <a href="https://static.wikia.nocookie.net/hitchhikers/images/3/34/The_tv_menu_guide.png/revision/latest?cb=20130326071203" class="mw-file-description image"><img alt="The tv menu guide" src="https://static.wikia.nocookie.net/hitchhikers/images'''
