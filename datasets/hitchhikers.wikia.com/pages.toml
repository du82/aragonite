["https://hitchhikers.wikia.com/wiki/User_blog:Garkbit/Hitchhikers_on_Stage_in_West_Yorkshire"]
title = "User blog:Garkbit/Hitchhikers on Stage in West Yorkshire | Hitchhikers | Fandom"
description = "I have obtained the rights to put The Hitchhiker's Guide to the Galaxy - The Original Radio Scripts on stage. It will be an abridged version of the entire Primary Phase performed script-in-hand by..."
full_description = '''in: Blog posts Hitchhikers on Stage in West Yorkshire Garkbit • 20 August 2015 • User blog:Garkbit <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> For any fellow hitchhiker based in West Yorkshire, England[] I have obtained the rights to put The Hitchhiker's Guide to the Galaxy - The Original Radio Scripts on stage. It will be an abridged version of the entire Primary Phase performed script-in-hand by a cast of 20+ actors and will include live sound and action. The production will be for two nights - 2nd and 3rd October 2015 at the Hippodrome Theatre, Halifax Road in Todmorden, West Yorkshire. Anyone who wants to make the journey is very welcome to come, whether you have hitched a lift with a 'Teaser', or come by more usual forms of transport. Tickets will be £6 each and can be purchased online via Todmorden Hippodrome Authentic Pan-Galactic Gargleblasters will be on sale at the bar! Categories Categories: Blog posts Community content is available under CC-BY-SA unless otherwise noted. More Fandoms Fantasy Sci-fi'''
