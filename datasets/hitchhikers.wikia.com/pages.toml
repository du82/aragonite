["https://hitchhikers.wikia.com/wiki/User:Spacepigeon"]
title = "User:Spacepigeon | Hitchhikers | Fandom"
description = "I'm just here to have a good time and write about my favourite sci-fi characters! I'm a very big fan of sci-fi, especially comedy sci-fi, especially particularly sometimes almost exclusively..."
full_description = '''User:Spacepigeon Sign in to edit History Purge Message Wall <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Accurate picture of me talking about fictional characters. I'm just here to have a good time and write about my favourite sci-fi characters! I'm a very big fan of sci-fi, especially comedy sci-fi, especially particularly sometimes almost exclusively British comedy sci-fi. Having grown up with Red Dwarf, H2G2, Doctor Who and War of the Worlds, as well as a bunch of British comedy shows, it's safe to say I'm a big fan of Hitchhikers. I've listened to the original radio show (The Primary and Secondary phases) countless times, as well as watching the TV show and reading the first couple of books hundreds of times, however I've listened and read the remaining adaptions a lot less, and the less said about the film the better. ;) I hope to one day create a database set in-universe with every Guide entry from each form of media collected into one place, as I haven't found anywhere like this yet. There was that app, but its long since disappeared. Maybe one day we can have a well researched virtual Guide in app form... I can dream. Until then, adding to this Wiki is a great substitute. Hopefully some more people discover their love of Hitchhikers too and come and join me, I feel cold, all alone in this infinite void... As of September 5th 2018 I am an admin on Hitchhikers! Come and talk to me if you need any help or have any suggestions, or just want to chat about Hitchhiker's. We've got 5,885 pages, 637 articles, and 18,902 total edits made to the wiki so far! Look at us go! Thanks to all who have contributed, and hello to our current 4 active users! Activity[] Today it is: 02/03/2025 My activity was last updated: 06/03/2020 Currently editing: Tidying up/adding info to articles on books Adding content to The Hitchhiker's Guide to the Galaxy (TV series) article Adding info and infoboxes to The Hitchhiker's Guide to the Galaxy TV episode articles Adding info and infobox to The Hitchhiker's Guide to the Galaxy (radio series) article Next up: Items Adding Appearances sections to character articles Tidying up Marvin Tidying up Fenchurch Add characters to 'Deceased' category and link in infoboxes under 'status' The Hitchhiker's Guide to the Galaxy (travel guide) Companies Creating "Campaign For Real Time" article Finished editing (for now): Tidy/add images to pages related to Total Perspective Vortex Tidy up/create pages related to InfiniDim Enterprises Fictional literature category articles Creating and working on The Hitchhiker's Guide to the Galaxy (trading cards) Adding Appearances and tidying up Zaphod Beeblebrox article Italicising media article titles Category:Language Category:Spacecraft Book template Radio episode infoboxes Media infoboxes - filling in information Infoboxes - updating and redesigning Vogon related pages Golgafrinchan related pages Technology Dirk Gently's Holistic Detective Agency Flora and fauna Restaurants and bars Food and beverages Badges Real world people Actors Main page The Hitchhiker's Guide to the Galaxy (video game) Theme, top navigation, Wiki colours Ongoing edits/updates: Creating and working on The Hitchhiker's Guide to the Galaxy (comic books) Community portal Help pages and community pages MoS page and Guidelines page My favourite trilogy of books[] Where God Went Wrong Some More of God's Greatest Mistakes Who is this God Person Anyway? Community content is available under CC-BY-SA unless otherwise noted. More Fandoms Fantasy Sci-fi'''
