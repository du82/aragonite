["https://hitchhikers.wikia.com/wiki/User_blog:Spacepigeon/All_radio_episodes!"]
title = "User blog:Spacepigeon/All radio episodes! | Hitchhikers | Fandom"
description = "Hi everyone! I've recommended looking at archive.org before for Hitchhiker's resources, as they often have the tv episodes and some of the radio shows uploaded there. However, BBC Radio 4 have..."
full_description = '''in: Admin blog posts, Blog posts All radio episodes! Spacepigeon • 24 January 2019 • User blog:Spacepigeon <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Hi everyone! I've recommended looking at archive.org before for Hitchhiker's resources, as they often have the tv episodes and some of the radio shows uploaded there. However, BBC Radio 4 have recently uploaded all of the radio series, Primary to Hexagonal phase! It's a really great resource when filling out info on this Wiki, but it's also great to have all of these episodes to listen to, and you can download them all for free, too! Here's the link: https://archive.org/details/hhgttgall6 If you don't have the radio series on hand, or are missing some phases in your collection, then this is a great opportunity to save these. It's a free archive where everything is available to the public, so I thought I'd let you all know about this as it's very exciting! Sometimes things on archive.org are only available for a limited amount of time, kept up for only a few months, so check these out sooner rather than later and download them if you want to keep them. I've downloaded them all, so if you see this later and they're no longer on archive.org, let me know and I'll upload them to a Google Drive or something so you can have access to them! Thanks for your time, hope you're all having a good 2019. Pigeon UPDATE: Previous links are no longer working, please see this link instead: https://archive.org/details/hitch-hikers-guide-to-the-galaxy-by-douglas-adams-bbc-radio-program I will try to update this post whenever links are broken, or new working links to the radio and TV episodes are found. Categories Categories: Admin blog posts Blog posts Community content is available under CC-BY-SA unless otherwise noted. More Fandoms Fantasy Sci-fi'''
year_published = 2025
