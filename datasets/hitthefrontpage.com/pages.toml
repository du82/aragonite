title = "Hit the Front Page of Hacker News"
description = "Learn to write blog posts that attract a technically sophisticated audience."
full_description = '''If you've ever submitted something to Hacker News you'll know: what makes the front page can feel completely random. Posts that make the front page follow a few common patterns. And once you know what to look for, you'll see them everywhere. When you share content on Hacker News, there are only two possible outcomes: "Front Page Glory" or "Fail in Silence." There's no in-between, so it will take you years to learn through simple trial and error. This lesson covers common topics that work well on Hacker News and how to estimate a topic's chances of success before you even begin writing. If your only plan for sharing your content is submitting it to Hacker News, you're going to get your heart broken a lot. It's impossible to predict perfectly what content will succed on Hacker News. That's why I recommend finding one or more backup plans: other communities that might be a match for your content. You don't have to be born an amazing writer. You can improve your writing and make it more engaging simply by putting in more effort. In this section, I'll talk about common writing pitfalls, how to avoid them, and how to strengthen your writing over time. In this section, I'll walk you through the process of submitting your post to Hacker News, how to make the most out of your time on the front page, and how to keep the comment thread civil and friendly. In this lesson, I'll show you what to do when your post fails to reach the front page, and why it's not always as hopeless as it may first appear. I've been developing an effective writing and publishing workflow for my blog over the past five years. In this lesson, I'll show you all the tools I use in the process of coming up with ideas, writing a first draft, editing, publishing, and sharing. If you're a blogger who wants to understand how to write content that attracts Hacker News' enormous, technically sophisticated audience, this course is for you. If you're a founder who wants to attract the attention of thousands of investors, customers, or employees without spending a dime, this course is for you.'''
