["https://hmarco.org/bugs/dcmtk-3.6.1-privilege-escalation.html"]
title = "CVE-2013-6825 - DCMTK 3.6.1 - Root privilege escalation"
full_description = "A bug in DCMTK for versions prior to 3.6.1 has been found. The bug is caused by not checking the return value of setuid() call. The process must not continue its normal execution when this call fails (return an error) to drop privileges. In some tools of the DCMTK software the return value of setuid() is not checked. In some cases it allows to do a privilege escalation because the process does not give up its root privileges and continue as root. All of the tools will receive DICOM messages (images, print jobs, or queries) over the network and create corresponding DICOM files. When running with root privileges, called by a user with access to the local system, the user can force the tool to write to directories to which the normal user account has no access rights. However, no filenames can be chosen for DICOM files, so it is not possible to selectively overwrite certain files. Furthermore, all tools can be configured by a user-defined configuration file to write a log file with a filename defined by the user. This could possibly be abused to destroy certain system files by overwriting them with a logfile. Finally, all tools will read configuration files, and some of them will also read a certificate and public key file for TLS/SSL communication. The calling user may provoke the tool to read these files from directories where he would otherwise not have read access. However, there is no function that would display the file content, or copy a file, so the user can mostly abuse this to detect if a certain file exists or not, or try to extract information from error messages generated when a file not conforming to the expected file format is read. DCMTK package 3.6.1 is vulnerable, all DCMTK versions since 1993 to the current 3.6.1 (released February-2014) are affected. The bug appears because the return value of the setuid() call is not checked. When the setuid() fails, the application continues executing (does not terminate) and the following code is executed with the original privileges. The bug appears in the following files:"
