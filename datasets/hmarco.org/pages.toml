["https://hmarco.org/bugs/glibc_ptr_mangle_weakness.html"]
title = "Glibc Pointer guarding weakness"
full_description = "A weakness in the dynamic loader have been found, Glibc prior to 2.22.90 are affected. The issue is that the LD_POINTER_GUARD in the environment is not sanitized allowing local attackers easily to bypass the pointer guarding protection on set-user-ID and set-group-ID programs. Pointer guarding is a security mechanism whereby some pointers to code stored in writable program memory (return addresses saved by setjmp(3) or function pointers used by various glibc internals) are mangled semi-randomly to make it more difficult for an attacker to hijack the pointers for use in the event of a buffer overrun or stack-smashing attack. This security issue allows a local user to disable the pointer guard security mechanism, which makes the system weaker. Note that disabling the pointer mangling protection can not be exploited on its own, but an attack vector to modify the protected (mangled) pointer is necessary. Unlike the previously published issue CVE-2013-4788 where static applications did not initialize the pointer mange, in this case only dynamic executables are affected. Static set-user-ID and set-group-ID programs are not affected. The security issue appears because the LD_POINTER_GUARD environment variable is not sanitized for set-user-ID and set-group-ID programs. In other words, it is possible to disable the pointer mangle security even on set-user-ID binaries. The dl_pointer_guard variable is used later to decide whether pointer guard protection is enabled or not. If LD_POINTER_GUARD is set to 0, then the dl_pointer_guard will contain 0. In this situation, the pointer mange protection will not be enabled regardless the permissions of the executable. To exploit the pointer mangle vulnerability in dynamic linked applications just execute the following command: In order to show how to exploit this weakness in a real scenario, a PoC has been created which emulates a vulnerability that overwrites a pointer (return address) saved in the stack previously stored by the setjmp() library call."
