["https://hmarco.org/bugs/linux-ASLR-reducing-mmap-by-half.html"]
title = "CVE-XXXX-XXXX - Linux ASLR mmap wekaness: Reducing entropy by half"
full_description = 'A bug in Linux ASLR implementation has been found. The issue is that the mmap base address for processes is not properly randomized on some architectures due to an improper bit-mask manipulation. Affected systems have reduced the mmap area entropy of the processes by half. This vulnerability is similar to the CVE-2015-1593 - Linux ASLR integer overflow: Reducing stack entropy by four published 10 days ago. As shown in the previous output, the 13th bit is fixed to 1. In order to have more confidence about this hypothesis, we can run additional tests: We obtained 0 as a result, which indicate us that the 13th bit after 1000 executions never is 1. To be more confident about this, we can run the complementary test (test 2). That is, run 1000 executions keeping only those samples that have the 13th bit set to 1. Since it seems that our system is vulnerable the expected number will be 1000. The total entropy for the mmap area of the processes is reduced by half. The number of possible locations are reduced by 50%, which for example will reduce the cost of brute force attacks. PowerPC, Sparc64 and ARM have 18 bits of entropy. Non-vulnerable systems have 262144 (218) different places to locate the mmap area. On vulnerable systems, this value is reduced to 131072 (217). The bug appears because as an attempt to avoid to use the same random number while creating a new process. The old implementation of get_random_int() returned the same value within a 1 jiffy window, which produced in some cases the same random value both to calculate the stack and the mmap area. This undesired behaviour was solved with following hack: The previous code belongs to ARM64 but the similar code is used by Sparc64 and PowerPC, which tries to shift the randomness by 1 bit. Unfortunately, they shifted the mask instead of the random value. The STACK_RND_MASK (which is 0x3FFFF on ARM64, 18 bits) mask is shifted 1 bit to the right, resulting in 0x1FFFF, 17 bits. After that, this resulting mask is used to obtain the "rnd" by performing an "&" operation obtaining a random value of 17 bits. This "rnd" value is shifted to left (PAGE_SHIFT + 1), which is 13 for ARM64, setting the 13th to 0.'
year_published = 2025
