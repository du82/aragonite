["http://hmarco.org/bugs/s3dvt_0.2.2-root-shell.html"]
title = "CVE-2013-6876 - s3dvt-0.2.2 - root shell"
full_description = "The drop privileges in s3dvt has the purpose to prevent to execute the bash with root privileges. In the cases where the application is installed with set bit setuid a non-privileged user could obtain a root shell. s3dvt package 0.2.2 is vulnerable. From the first commit on January 2006 to the current 0.2.2 (released May 2011) are also affected. Commit 0ad732f00b411b092c66a04c359da0f16ec3b387 fix the vulnerability is . After some discussion, the author decided to fix it but forgot to credit our contribution. The bug appears because the return value of the setuid() call is not checked. When the setuid() fails, the application continue executing (does not terminate) and the following code is executed with the original privileges. In this case it is possible to obtain a root shell. The bug is still present and exploitable. A different CVE number has been assigned. See CVE-2014-1226 - s3dvt_0.2.2 root shell. The strategy to exploit this kind of bugs consists in creating as many processes as the target user is allowed to make (which is given by RLIMIT_NPROC), and then the next attempt to drop privileges will fail, letting the process alive and with the original privileges. This bug can be exploited because the there is a similar bug in the code of the bash. And so, an attacker can bypass/exploit both bugs to raise privileges. As soon as we discovered the bug we tried our best to explain to s3dvt developers the problem and the way to fix it. After a long discussion, they managed to realise the issue and fixed one of the affected functions, the one that focused the discussion. But unfortunately: We strongly believe that such kind of contribution (finding a bug, and explain/teach how it can be fixed) shall be properly recognised."
year_published = 2025
