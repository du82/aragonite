["http://hmarco.org/renewssp/ssp_technical.html"]
title = "Renew Stack Smashing Protector (renewSSP)"
full_description = 'The Renew Stack Smashing Protector (renewSSP) is a modification of the stack-smashing protector (SSP) technique which eliminates brute force attacks against the canary. The technique is not intrusive, and can be applied by just pre-loading a shared library. The overhead is almost negligible. The technique has been tested on several web servers and on a complete GNU/Linux distribution by patching the standard C library. This prevention technique solve a very significant problem that appeared around 2006. Full paper: H. Marco-Gisbert I. Ripoll, Preventing brute force attacks against stack canary protection on networking servers, in Network Computing and Applications (NCA), 2013 12th IEEE International Symposium on, 2013, pp. 243-250 [DOI] Since 2006 forked and pre-forked networking servers architecture are specially prone to brute force attacks. The problem appears when the main process creates a new process by duplicating the calling process. In this situation the children processes inherit/share the same memory layout and the canary value. The attacker can try in bounded time all the possible values of canary (for SSP) and memory layouts (for ASLR) until the correct ones are found. The attacker can first attack the canary value and later using the same strategy attack the ASLR. During this process the attacker can discard previous guessed values which is called brute force attack. This attack can be modeled as a statistical problem called "sampling without replacing" and follow a uniform distribution. The renewSSP solution prevents brute force attacks against the stack canary by re-randomizing the canary value upon every child is created. This prevention technique can be applied to any server independently of the operating system. Brute forcing the stack buffer overflow is a real problem which affect mainly to servers but is not limited to them. Therefore an incalculable number of servers and user applications around the world could be benefited by the renewSSP technique.'
year_published = 2025
clearnet = "http://hmarco.org/renewssp/ssp_technical.html"
category = "SitesList"
