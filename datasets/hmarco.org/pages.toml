["http://hmarco.org/bugs/linux-ASLR-integer-overflow.html"]
title = "CVE-2015-1593 - Linux ASLR integer overflow: Reducing stack entropy by four"
full_description = 'A bug in Linux ASLR implementation for versions prior to 3.19-rc3 has been found. The issue is that the stack for processes is not properly randomized on some 64 bit architectures due to an integer overflow. Affected systems have reduced the stack entropy of the processes by four. To check if your Linux is vulnerable simply execute the following: If you see in your system the sequence 7FFF then your system is not patched and your ASLR is slightly weaker. The previous example shows that this x86_64 architecture is vulnerable. For completeness: The total amount of stack entropy is not shown by printing the memory map because most Linux architectures implement an intra-page randomization which increases the stack entropy by one more byte. Therefore, the real stack entropy is given by 7FFF???????0, which is 2^28 in affected systems. A system not affected by this weakness shall have a total stack entropy of 230, that is four times more entropy. The total stack entropy of the processes is reduced by four: from 230 to 228 (One fourth of expected entropy). The possible locations are significantly reduced from around one billion to two hundred millions. The problem seems to affect only to the x86_64 architecture. All Linux versions prior to 3.19-rc3 are affected. As far as we know this bug is already present in the first commit (1da177e) on the current repository (https://github.com/torvalds/linux), April 2005. The bug appears because the presence of a integer overflow in the function which randomizes the stack: randomize_stack_top() in file "fs/binfmt_elf.c" (the line containing the error is highlighted in red): The "random_variable" variable is declared as "unsigned int". Since the result of the shifting operation between STACK_RND_MASK (which is 0x3FFFFF on x86_64, 22 bits) and PAGE_SHIFT (which is 12 on x86_64), then the two leftmost bits are dropped when storing the result in the "random_variable". This variable shall be at least 34 bits long to hold the (22+12) result.'
