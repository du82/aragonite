["http://hmarco.org"]
title = "Hector Marco Gisbert - Lecturer and CyberSecurity Researcher"
full_description = "Hector Marco is is anassociate professor and cybersecurity researcher at the Universitat Politecnica de Valencia, Spain. He holds a PhD in Computer Science, Cybersecurity, from Universitat Politecnica de Valencia. Hector is senior member of the Institute of Electrical and Electronics (IEEE), and member of the Engineering and Physical Sciences Research Council (EPSRC) in UK. Previously, he was associate professor at University of the West of Scotland, UK and cybersecurity researcher at the Universitat Politecnica de Valencia where he co-founded the cybersecurity research group. Hector was part of the team developing the multi-processor version of the XtratuM hypervisor to be used by the European Space Agency in its space crafts. He participated in multiple research projects as Principal Investigator and Co-Investigator. Hector is author of many papers of computer security and cloud computing. He has been invited multiple times to reputed cybersecurity conferences such as Black Hat and DeepSec. Hector has published more than 10 Common Vulnerabilities and Exposures (CVE) affecting important software such as the Linux kernel. He has received honors and awards from Google, Packet Storm Security and IBM for his security contributions to the design and implementation of the ASLR-NG, a securer Linux ASLR. Hector's professional interests include low level cybersecurity, secure and non-secure world kernel and userland security, virtualization security and applied cryptography. return-to-csu: A New Method to Bypass 64-bit Linux ASLR [HTML] Héctor Marco and Ismael Ripoll. Black Hat Asia 2018, March 2018. Abusing LUKS to Hack the System [+info] Héctor Marco and Ismael Ripoll. In-depth security conference 2016 europe, (DEEPSEC 2016). Exploiting Linux and PaX ASLR's Weaknesses on 32-bit and 64-bit Systems [HTML] Héctor Marco and Ismael Ripoll. Black Hat Asia 2016, March-April 2016. Bypassing Trusted Code: Hacking GRUB [HTML] Héctor Marco and Ismael Ripoll. IX Jornadas STIC CCN-CERT, November 2015."
