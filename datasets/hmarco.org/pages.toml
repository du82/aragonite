["http://hmarco.org/virtualisation/nexx/NEXX_ARM_hypervisor.html"]
title = "NEXX ARM HYPERVISOR"
full_description = '''NEXX is a tiny (and incomplete) ARM hypervisor which enables you to run both bare and Linux partitions. The main purpose of NEXX was to learn operating systems internals and hardware programming. I only spent three months developing the NEXX ARM hypervisor focussed on learning. Code quality was not in the agenda, and so, the resulting code was... well ugly. I'm not proud of the code. Even that, I decided to make it public because from the beginning of 2011 I have had no time to continue it, and it seems that I'll never will. Before start building the hypervisor, partitions or the Linux kernel, we need to install the GCC ARM compiler to build the hypervisor from sources. The NEXX ARM hypervisor is compiled using the none eabi GCC cross-compiler. Following this guide, the GCC compiler will be installed in the "/opt" directory. Some files (config.mk, etc.,) expect the compiler in this path. We need to manipulate some ARM ELF files (objcopy, nm etc.,) as well as been able to build (make) and run the hypervisor, partitions and the Linux kernel under an ARM machine (qemu). To install these packages on Ubuntu and similar distributions execute the following command in a shell: Folder "user/partitions" contains two partitions "partition0.c" and "partition1.c" which are a very simple example. They print a message "I am partition 0" and "I am partition 1" respectively by invoking the hypercall NEXX_write_console(). You should be able to see these messages if you compile and execute as follow: You can build bare partitions with new code. The example partition code can be found in the extracted sources downloaded. The file "user/partitions/partition0.c" and "user/partitions/partition1.c" contains the code of the partition 1 and 2 respectively. The first "C" function called in a partition is PartitionMain() which does not receive any argument. You can add your code inside this function to build a new partition. After that, you can compile and test the partitions as showed before.'''
