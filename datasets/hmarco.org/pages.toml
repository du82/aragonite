["https://hmarco.org/renewssp/ssp_usingit.html"]
title = "Renew Stack Smashing Protector (renewSSP)"
full_description = "The RenewSSP relies on the already existing SSP infrastructure, and so, only minor modifications are needed in the system. It can be implemented in several ways: The last solution provides a way of using the RenewSSP that is transparent to users and applications. In just a few seconds, you can give it a try. This PoC shows how the renewSSP works. The following example prints the canary values of the process and its child, in both with the standard SSP and with the renewSSP. Note that the default configuration of the pre-forked Apache2 is to launch two working servers. As showed in the previous output, every child process has a different reference canary and the apache web server works accordingly. Now you can test the Apache2 using the ab (Apache Benchmark) utility. Our results show that the time per request (across all concurrent requests) is the same in both cases. In order to avoid network interference, we ran the benchmark in the same computer than the Apache2 server."
