re students have the opportunity to major in a STEM field while taking nearly a third of their classes in humanities, social sciences and the arts (HSA). The HSA requirement encourages students to pursue their interests in philosophy, psychology, political science, sociology, literature, music, photography, media studies and many other fields. With dynamic professors at Harvey Mudd and the other Claremont Colleges, you will be able to take courses in a wide range of topics of interest to you. Why do we center HSA in our curriculum? Because we believe humanities, social sciences and the arts are central to our mission to educate leaders who understand the impact of their work on society.Learn More The MajorExplore Your Field Through Research and Experiential LearningThe major builds depth and technical competence in a chosen field. Majors at Harvey Mudd emphasize a broad-based, interdisciplinary approach to equip our students with problem-solving skills and the ability to adapt to any challenge. Coursework comes alive with project-based experiential learning and graduate-level research opportunities. You’ll finish your major by completing real-world research (thesis) or a clinic project. Throughout the entire curriculum runs an emphasis on developing strong oral and written communications and excellent computational skills.Learn More Senior Capstone Experience Every student completes a yearlong senior project in either original research or the Clinic Program, depending on the major. Students can engage in research and Clinic before their senior year as well, and many do. The Clinic ProgramSolving Real-world ProblemsClinic engages juniors and seniors in solving real-world, technical problems for companies and organizations. Teams of four to five students complete computer science, engineering, mathematics, physics or multidisciplinary projects, applying their education to produce valuable solutions for sponsors.Learn More ResearchNot Your Average UndergradStudents work alongside faculty as colleagues, investigating open-ended questions, presenting findings at national conferences and co-publishing papers. Opportunities abound, and students can begin doing research early in their studies or engage in summer research.Learn More Life @ MuddHarvey Mudd nurtures a close-knit, creative, fun-loving community that is passionate about learning. We study together, play together and explore interests in everything from ballroom dance to robotics to sustainability.Learn More Mudders Can Harvey Mudd has a legacy of preparing its graduates for success. Students typically have many options after graduation and go on to lead very successful careers. Shailee Samar ’18Having received pivotal advice from former President Klawe, Shailee Samar ’18 now enables others to succeed. Christopher Pong ’08Part hobby, part job, Christopher Pong’s work on the Mars 2020 Perseverance Rover mission has been an emotional journey. Mary Jessie Celestin ’21The multi-talented Mary Jessie Celestin ’21 uses a human-centered approach to vitalize her hometown of San Jose."
