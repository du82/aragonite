["https://hmc.edu/about/visit"]
title = "Visit Campus | About | Harvey Mudd College"
full_description = 'Visit Campus Home About Visit Campus { "@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [{ "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.hmc.edu/" },{ "@type": "ListItem", "position": 2, "name": "About", "item": "https://www.hmc.edu/about/" },{ "@type": "ListItem", "position": 3, "name": "Visit Campus" }] } About Menu About Harvey Mudd College Visit Campus Toggle sub-menu of Visit Campus Campus Map NewsHarvey Mudd College News Toggle sub-menu of NewsHarvey Mudd College News Mudd ExpertsHarvey Mudd College Experts Latest VideosLatest Videos from Harvey Mudd College Fast FactsFast Facts: Harvey Mudd College HistoryHistory of Harvey Mudd College Mission and Strategic Planning Related SitesPresident’s Office Mudd Magazine Events Calendar Inclusive Excellence and the Curriculum Higher Education Opportunity Act (HEOA) Accreditation Visiting the Harvey Mudd College campus is the best way to learn more about our community. There’s plenty to see and do on campus and around the region. While visiting, learn more about the other Claremont Colleges, and explore the City of Claremont as well as the historic Claremont Village. Campus Tours Our admission site has instructions on arranging campus visits. If you’re thinking about applying to Harvey Mudd, you may wish to arrange a campus tour, interview or overnight visit. Claremont and the Region At the base of the San Gabriel Mountains, the City of Claremont is best known for its tree-lined streets, historic buildings and The Claremont Colleges—nationally and internationally renowned for their academic excellence. The Claremont community features Victorian homes, a population of nearly 40,000 and a vibrant village full of sidewalk cafes, specialty shops and espresso bars. Adjacent to the Village, the College Heights Lemon Packing House, built in 1922, was converted into the Claremont Lewis Museum of Art, which opened in spring 2007. Further afield, you’ll find even more to tempt you. Claremont is just 25 minutes from the nearest ski slopes, 90 minutes from the desert and less than an hour’s drive to the Pacific beaches. It’s a great jumping-off point for the many attractions that make Southern California a great place to visit. Discover things to do and places to visit in the greater Los Angeles area. Staying and Eating Hotels in Claremont and surrounding area Dining in Claremont Getting to Harvey Mudd College Harvey Mudd College is located in Claremont, Calif., 35 miles east of Los Angeles. Travel by Air Ontario International Airport (ONT) offers the most convenient access at 10 miles from campus. Los Angeles International Airport (LAX) and John Wayne International Airport (SNA) also serve the region. Driving to Harvey Mudd Harvey Mudd College lies at the northern edge of The Claremont Colleges and is between the 210 freeway and 10 interstate. Driving directions Navigating Interactive campus map shows parking locations Printable campus map (PDF) Visit Parking for maps and guidance. Public Transportation Metrolink operate services to Claremont rail station which is approximately one mile from Harvey Mudd. Long-distance bus connections available through Greyhound and Amtrak California Thruway Motorcoach. Local bus services are provided by Foothill Transit. The City of Claremont transit services site provides information on other transportation, including accessible options.'
