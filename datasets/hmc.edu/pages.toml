["https://hmc.edu/about/history"]
title = "History of Harvey Mudd College | About | Harvey Mudd College"
full_description = 'History of Harvey Mudd College Home About History { "@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [{ "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.hmc.edu/" },{ "@type": "ListItem", "position": 2, "name": "About", "item": "https://www.hmc.edu/about/" },{ "@type": "ListItem", "position": 3, "name": "History" }] } About Menu About Harvey Mudd College Visit Campus Toggle sub-menu of Visit Campus Campus Map NewsHarvey Mudd College News Toggle sub-menu of NewsHarvey Mudd College News Mudd ExpertsHarvey Mudd College Experts Latest VideosLatest Videos from Harvey Mudd College Fast FactsFast Facts: Harvey Mudd College HistoryHistory of Harvey Mudd College Mission and Strategic Planning Related SitesPresident’s Office Mudd Magazine Events Calendar Inclusive Excellence and the Curriculum Higher Education Opportunity Act (HEOA) Accreditation Harvey Mudd College, the nation’s top liberal arts college of engineering, science and mathematics, was chartered in December 1955. Two years later, in 1957, when the Space Race made technical education a priority in the United States, the College opened its doors. The founders’ vision—to attract the nation’s brightest students and offer them a rigorous scientific and technological education coupled with a strong curricular emphasis in the humanities and social sciences—has been successfully realized and expanded. In 1963, the College initiated the nationally recognized Clinic Program, which allows student teams to solve problems posed by sponsoring industry, government and nonprofit organizations. The emphasis on undergraduate research for all students has led to Harvey Mudd graduates earning PhD degrees in science and engineering at one of the highest rates in the nation. Harvey Mudd College Opens Harvey Mudd College opened in September 1957, less than a month before Sputnik I ushered in the Space Age. Forty-eight students and seven faculty who shared the dream of starting a technical college that would emphasize the humanistic aspects of technology were on hand when the school opened its doors. Nuclear physicist Joseph B. Platt served the fledgling institution as its first president, and new courses and a new curriculum were formulated under a grant from the Carnegie Corp. The founding faculty of Harvey Mudd College were: Graydon Bell, assistant professor of physics J. Arthur Campbell, professor of chemistry William Davenport, professor of humanities Robert James, professor of mathematics Duane Roller, professor of physics Roy A. Whiteker, assistant professor of chemistry George Wickes, assistant professor of humanities The First Students When the first class arrived, the Harvey Mudd College campus consisted of one (almost) completed dorm and borrowed classrooms and equipment. During the early years, most faculty members readily took on administrative responsibilities in addition to their teaching jobs. Some classes were even held in the homes of faculty and staff. In June 1959, the College held its first commencement ceremony graduating Stuart Black and Peter Loeb, who both transferred to Harvey Mudd their junior years. Because of the diminutive size of the graduating class, the ceremony drew national attention and was televised. Both graduates later became university professors. Progress and Success Slowly, classrooms and dorms were built, and students began to fill them. By 1965, 284 students were enrolled in classes and faculty numbered 43. Harvey Mudd celebrated its 60th anniversary in 2015, with student enrollment at 812 and climbing. In 1976, D. Kenneth Baker became the second president of Harvey Mudd College, followed by Henry E. Riggs in 1988, Jon C. Strauss in 1997 and Maria M. Klawe in 2006. Today, 905 extraordinary students are enrolled at Harvey Mudd College, learning through rigorous and challenging educational experiences from a highly committed faculty. Recently, the Western Association of Schools and Colleges reaffirmed the institutional accreditation for the College. In their final report, the WASC team wrote, “Harvey Mudd is characterized by excellence and success, and is widely regarded as among the nation’s best undergraduate science and engineering colleges.” The Harvey Mudd College Seal Harvey Mudd College Seal The Harvey Mudd College seal, created in 1960 by Thomas Jamieson and approved by the Harvey Mudd College Board of Trustees on Jan. 23, 1960, represents the various ideals of the College. The Founding Class of 1961 described the seal in the 1961 yearbook: “The seal combines symbols intended to convey the image of the College. Medieval heraldry was avoided as inappropriate for a college founded in mid-twentieth century with its sights set on the technology of the future. The sun represents energy, the elliptical Mobius strip denotes structure, and the dividers, measurement. The globe depicts the humanities and civilization.” The dividers are placed in the design to bridge the gap between the sun and the globe to symbolize the measure of energy and things scientific as well as the measure of humans and civilization. The outer as well as the inner ellipse can be read as orbital paths, suggesting humankind’s concern with space. Harvey Mudd’s Dream Harvey Seeley Mudd was born in Colorado in 1888 and died in Los Angeles in 1955. A mining engineer, he was a graduate of Stanford and Columbia universities. With his father, he founded and later became president of Cyprus Mines Corp., whose Los Angeles-based international enterprises began with thedevelopment of copper mines on the island of Cyprus. Mudd served as chairman of the Board of Fellows of Claremont College, now The Claremont Colleges Services, for 25 years. He helped plan the undergraduate college of science and engineering chartered in 1955, but he did not live to see it opened. With the backing of his friends and family, the new college was founded and named in his memory and honor. Harvey Mudd College Presidents Joseph B. Platt, 1956–1975. Downloadable book: Harvey Mudd College: The First Twenty Years D. Kenneth Baker, 1976–1988. Downloadable book: Harvey Mudd College: The Third Decade Plus, 1976-1988 Henry E. (“Hank”) Riggs, 1988–1997. Jon C. Strauss (PDF), 1997–2006. Maria M. Klawe, 2006–2023.'
