["https://hmc.edu/academics/common-core-curriculum"]
title = "Common Core Curriculum | Academics | Harvey Mudd College"
full_description = 'Common Core Curriculum Home Academics Common Core Curriculum { "@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [{ "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.hmc.edu/" },{ "@type": "ListItem", "position": 2, "name": "Academics", "item": "https://www.hmc.edu/academics/" },{ "@type": "ListItem", "position": 3, "name": "Common Core Curriculum" }] } Academics Menu Academics Majors at MuddMajors at Harvey Mudd Academic Emphases at Harvey Mudd Faculty of MuddFaculty of Harvey Mudd College Common Core Curriculum English Language Learning Student Awards and Fellowships Toggle sub-menu of Student Awards and Fellowships Apker AwardsHarvey Mudd Apker Awards Astronaut ScholarsHarvey Mudd Astronaut Scholars Beckman ScholarsHarvey Mudd Beckman Scholars Churchill ScholarshipsHarvey Mudd Churchill Scholarships Goldwater ScholarsHarvey Mudd Goldwater Scholars Watson FellowsHarvey Mudd Watson Fellows NSF Graduate Fellowship RecipientsHarvey Mudd NSF Graduate Fellowship Recipients Interdisciplinary Centers Toggle sub-menu of Interdisciplinary Centers Center for Design Education Toggle sub-menu of Center for Design Education Harvey Mudd College Design Courses Hixon-Riggs Program for Responsive Science and Engineering Toggle sub-menu of Hixon-Riggs Program for Responsive Science and Engineering 2020 Hixon Forum 2017 Hixon Forum Toggle sub-menu of 2017 Hixon Forum 2017 Hixon Forum Participants The Hixon-Riggs Early Career Fellowship in Science and Technology Studies Academic Offices and ProgramsDean of the Faculty Entrepreneurship Hixon Center for Climate and the Environment Institutional Research and Effectiveness Learning Programs Makerspace Registrar Study Abroad Summer Session Upward Bound The Core Curriculum at Harvey Mudd College seeks to nurture students’ intellectual curiosity and joy of learning, provide them with foundational knowledge and skills needed for further study in STEM disciplines, and begin a critical engagement with the humanities, social sciences, and the arts. In keeping with HMC’s liberal-arts approach to STEM education, the Core engages students in thinking critically about consequential problems and complex issues, making connections across disciplinary boundaries, communicating and collaborating effectively, and understanding how their personal and professional actions impact the world around them. The Core includes: One course each in computer science and engineering One course in biology and a laboratory Two semesters of mathematics One and a half semesters of physics and a laboratory One semester of chemistry and a laboratory A half-semester of college writing A course in critical inquiry offered by the Department of Humanities, Social Sciences, and the Arts A college course that investigates the impacts of our work on society The Core is demanding, but Harvey Mudd fosters collaboration, not competition—students work in teams and learn together. The hands-on, project-based courses in the Core foster a love for collaboration, communication skills and leadership ability. Harvey Mudd’s curriculum—the Common Core, requirements in the humanities, social sciences, and the arts, and the major—gives students a solid grounding in the sciences, expertise in a chosen field and an understanding of the relationship between technology and the people it serves. Visit Core Curriculum learning outcomes. The Harvey Mudd College Catalog has more information on the Common Core.'
