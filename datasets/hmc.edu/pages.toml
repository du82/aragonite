title = "Academics | Harvey Mudd College"
full_description = 'Home Academics { "@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [{ "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.hmc.edu/" },{ "@type": "ListItem", "position": 2, "name": "Academics" }] } Academics Menu Academics Majors at MuddMajors at Harvey Mudd Academic Emphases at Harvey Mudd Faculty of MuddFaculty of Harvey Mudd College Common Core Curriculum English Language Learning Student Awards and Fellowships Toggle sub-menu of Student Awards and Fellowships Apker AwardsHarvey Mudd Apker Awards Astronaut ScholarsHarvey Mudd Astronaut Scholars Beckman ScholarsHarvey Mudd Beckman Scholars Churchill ScholarshipsHarvey Mudd Churchill Scholarships Goldwater ScholarsHarvey Mudd Goldwater Scholars Watson FellowsHarvey Mudd Watson Fellows NSF Graduate Fellowship RecipientsHarvey Mudd NSF Graduate Fellowship Recipients Interdisciplinary Centers Toggle sub-menu of Interdisciplinary Centers Center for Design Education Toggle sub-menu of Center for Design Education Harvey Mudd College Design Courses Hixon-Riggs Program for Responsive Science and Engineering Toggle sub-menu of Hixon-Riggs Program for Responsive Science and Engineering 2020 Hixon Forum 2017 Hixon Forum Toggle sub-menu of 2017 Hixon Forum 2017 Hixon Forum Participants The Hixon-Riggs Early Career Fellowship in Science and Technology Studies Academic Offices and ProgramsDean of the Faculty Entrepreneurship Hixon Center for Climate and the Environment Institutional Research and Effectiveness Learning Programs Makerspace Registrar Study Abroad Summer Session Upward Bound Academics Academics The Harvey Mudd curriculum integrates vigorous STEM and liberal arts courses to educate talented scientists, engineers, and mathematicians— inspiring them to become passionate problem solvers who understand the impact of their work on society. Curriculum The curriculum has three components Common Core HSA The Major The Common CoreA Broad Foundation in STEM DisciplinesOur educational experience starts with the Common Core, a set of coordinated courses from every department—biology, chemistry, computer science, engineering, math, physics and humanities, social sciences and the arts. The Core gives you a broad scientific background coupled with academic writing and critical inquiry. No matter what your future major, you will gain a solid interdisciplinary foundation.Learn More Humanities, Social Sciences, and the ArtsKnow Your ImpactHarvey Mudd is a liberal arts college where students have the opportunity to major in a STEM field while taking nearly a third of their classes in humanities, social sciences and the arts (HSA). The HSA requirement encourages students to pursue their interests in philosophy, psychology, political science, sociology, literature, music, photography, media studies and many other fields. With dynamic professors at Harvey Mudd and the other Claremont Colleges, you will be able to take courses in a wide range of topics of interest to you. Why do we center HSA in our curriculum? Because we believe humanities, social sciences and the arts are central to our mission to educate leaders who understand the impact of their work on society.Learn More The MajorExplore Your Field Through Research and Experiential LearningThe major builds depth and technical competence in a chosen field. Majors at Harvey Mudd emphasize a broad-based, interdisciplinary approach to equip our students with problem-solving skills and the ability to adapt to any challenge. Coursework comes alive with project-based experiential learning and graduate-level research opportunities. You’ll finish your major by completing real-world research (thesis) or a clinic project. Throughout the entire curriculum runs an emphasis on developing strong oral and written communications and excellent computational skills.Learn More Senior Capstone Experience Every student completes a yearlong senior project in either original research or the Clinic Program, depending on the major. Students can engage in research and Clinic before their senior year as well, and many do. The Clinic ProgramSolving Real-world ProblemsClinic engages juniors and seniors in solving real-world, technical problems for companies and organizations. Teams of 4-5 students complete computer science, engineering, mathematics, physics, or multidisciplinary projects, applying their education to produce valuable solutions for sponsors.Learn More ResearchNot Your Average UndergradStudents work alongside faculty as colleagues, investigating open-ended questions, presenting findings at national conferences and co-publishing papers. Opportunities abound, and students can begin doing research early in their studies or engage in summer research.Learn More'
