title = "AI Rising: Now the most-cited technology - October 2023 Hacker News Hiring Trends"
description = "Most Popular programming languanges and software development technologies for October, 2023"
full_description = '''The term AI can mean many different things in the context of software development and programming. However, its significance in the current tech job market cannot be understated. The data reveals that for October's "Ask HN: Who is hiring?" thread, AI is the most mentioned technology term. AI was mentioned in nearly 20% of the postings. It has doubled, from 10% of postings in October, 2022, to the new peak. The only terms more popular than AI are location aspects (Remote vs onsite), experience level (Senior), and area of focus (full stack). For October, AI was more popular than any technology tracked in the history of the "Ask HN: Who is hiring?" thread. More popular than Python and React, the long-time dominant tech terms. Overall, the number of job postings in October's "Ask HN: Who is hiring?" thread is up 10% over September's historic low. October's data shows that the 2023 is stabilizing a bit over the past few months from the larger drops between Spring and Summer. I continue to hear rumblings in various places software developers hang out about the current job market being very difficult, and this data does continue to back that up. Python and TypeScript are still cruising in the top two spots for most popular programming languages. The rest of the pack are fairly steady although Kotlin makes a rare appearance in the Top 10 this month. As mentioned in the summary, mentions of AI are surging while mentions of Machine Learning are rising along with it. Remote positions dropped a bit, from 62% in September to 57% this month, but still in line with recent months. Onsite didn't pick up any ground, but Hybrid did. Hybrid is near its all-time peak. Interestingly, mentions of "Frontend" are on a decline, approaching levels not witnessed since the early days of the React framework. Even though Frontend features in 14% of the postings - a significant portion - there is a definite trend of decline here. Could it be a sign of decreasing demand for Frontend tasks? Or maybe, as technologies evolve, the distinction between Frontend and other specializations is becoming less defined? Another possibility is the emerging focus on AI and data-centric fields, which might be diversifying the types of roles in software development organizations. This shift certainly marks a trend worth monitoring in the coming months.'''
