["https://hntrends.com/2023/september.html"]
title = '"Who is hiring?" dips to another new low in September - Hacker News Hiring Trends'
description = "Most Popular programming languanges and software development technologies for September, 2023"
full_description = '''September's "Ask HN: Who hiring?" thread hit an eight-year low, as job posts continued their downward trend. We have to go back to January 2015 to when the number of postings was this low. But, September is in thet past and a new thread goes up tomorrow (Monday) morning. With Summer now over, October's thread could be a chance for a nice Fall bump. Python continues to dominate the programming landscape, being mentioned in over 21% of job postings. It, along with TypeScript, stands out from the rest, solidifying their places at the top. Go follows closely in third place, with mentions in nearly 9% of postings. No modern tech trends analysis is complete without a look at AI and related terms. September marked a significant milestone as AI reached an all time high, mentioned in over 18% of postings. Machine Learning also matched its all time best of nearly 16% of postings. Remote work opportunities are once again on the rise. After a decline to nearly 50%, the availability of remote positions has rebounded to over 60%. This increase appears to be offset more by a decrease in hybrid roles rather than a significant drop in onsite positions.'''
