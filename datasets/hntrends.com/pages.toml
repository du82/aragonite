full_description = "When I started this project ten years ago, I was mainly interested in studying and sharing the trends of techonologies used in the Software Development field. Now, after this decade of trend watching, it's interesting to reflect on the some of the other interesting aspects, non-technological, of the Software job market. We can witness the impact of Covid on the job market in two big ways, both on the big cuts at the beginning of the Pandemic, as well as the move to majority remote work. We can see the standardization of job levels across the industry, with the now ubiquitous Senior Software Engineer role. We can see the rise and fall of job posting counts reveal booms and busts in the Startup and Venture Capital ecosystem. This is the one happening again right now, as January's thread, with 285 postings (top-level threads), had the lowest number of job postings in over 9 years. We have to go all the way back to 2015 and before to find levels this low."
