["https://hntrends.com/2023/november.html"]
title = "Number of job postings climbing: up 20% in last two months"
description = "Most Popular programming languanges and software development technologies for November, 2023"
full_description = "November's Ask HN: Who is hiring? thread showed continued growth with 375 postings, up 20% from the near all-time low in September, and up 10% over October's thread. This is a positive sign after months of declines. However, on a year-over-year basis, we're still way off of the 2022 numbers (down 30%) and the 2021 numbers dwarf where we are today (down 61% since November, 2021). Technology-wise, everything remains relatively stable in November. Let's take a look at some areas of note. Python, TypeScript, and Go remain in the Top 3 spots. One notable change in November is C++, jumping into the fourth spot. Not bad for the nearly 40 year old language. While not a big jump from month-to-month in November, AI still shows its strength as a big mover this year. AI edged closer to being mentioned in 20% of postings. AI has nearly doubled in the past 12 months. Remote positions accounded for 61% of postings in November, getting back over 60% after a slight dip in October to 57%. Remote positions are still in the general area of where they've been for the past 6 months. Onsite and Hybrid have remained relatively steady. Specicalization keywords track the growth of different areas of engineering focus including Full-Stack, Front-end, and Back-end developers. Front-end in particular has been seeing steady drops over the past couple years. It peaked at just over 25% in January, 2022, but has dropped to 13% in November, 2023, a drop of 12%. Back-end has also been trending down over the last year with its own 10% drop from 28% to 18%. This could be a result of the industry broadening into more types of development. AI/ML and Data management come to mind as growing areas of focus and specialization. While the title of Senior Software Engineer has been a consistent level across the industry for more than a decade, the titles of Staff Software Engineer and Principal Software Engineer (often referred to as Staff+ in many books and articles) have emerged over the last few years. From the data, we can see the growth in Staff level positions has really picked up over the last year, reaching 10% in October and falling back slightly to abouto 8% in November."
