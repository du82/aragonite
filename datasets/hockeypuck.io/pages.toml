["https://hockeypuck.io"]
title = "Hockeypuck"
full_description = "Hockeypuck 2.x is a significant redesign of the original Hockeypuck 1.x, which is now deprecated. All bug fixes and new development will be on 2.x releases. Hockeypuck targets the HKP draft protocol specification. As this draft is a work in progress, Hockeypuck features may not exactly correspond to the current draft specification. Public key material conforming to RFC 4880 is supported by the keyserver, as are RFC 6637 ECC keys. As-of-yet non-standard key material, such as v4 Ed25519 keys, may also be distributed by Hockeypuck. Hockeypuck can synchronize public key material with SKS and other Hockeypuck servers. Recon protocol support is provided with the Conflux package. Hockeypuck uses PostgreSQL ≥ 9.4 (tested up to v16) for storing indexed key material. The architecture supports additional storage backends, which must implement a simple set of Go interfaces. Hockeypuck internally represents key material with an arbitrary document model that can be used with web applications by rendering it to JSON in responses. HTML responses can be customized by authoring a template that operates on the document model. Copyright 2012-2024 Casey Marshall and the Hockeypuck contributors. Hockeypuck is distributed under the Affero GNU Public License, version 3. In general, any use of Hockeypuck privately within an organization (including a company) is fine. Redistribution kicks in only when you publish services to other parties. The AGPL license (and my intent in licensing it such) DOES NOT permit the following distribution scenarios:"
