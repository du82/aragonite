["https://hockeypuck.io/install-tarball.html"]
title = "Hockeypuck"
full_description = "Download a [[https://github.com/hockeypuck/hockeypuck/releases][gzip-compressed tar archive release from Github]] for your operating system and architecture. Generally, Hockeypuck can be built for any Unix-like platform that the Go language compiler and linker supports. For added security, you could extract into an arbitrary path and chroot the Hockeypuck process, or extract it over an LXC rootfs. If you do this, consider the implications for a local UNIX domain socket connection to PostgreSQL. The Hockeypuck binary archive distributions could be a useful starting point to build packages for other operating system distributions. Contributions to the packaging project would be welcome for RPMs, BSD ports, etc."
