["https://hockeypuck.io/juju.html"]
title = "Hockeypuck"
full_description = "Juju 1.23.2 or later is recommended to make full use of this charm's juju actions. Install juju with: Familiarity with Juju and a bootstrapped environment is assumed. Read the Juju Documentation to get started. You should be able to access the keyserver at the listed public address, juju-azure-dev-y9157oo521.cloudapp.net:11371 fetch-keyfiles downloads OpenPGP binary keyfiles from a remote location to a local directory on the keyserver. Required. The remote location to fetch keyfiles from. This is expected to be a directory containing concatenated OpenPGP public keys in RFC 4880 binary format. These are the files typically produced by an SKS dump, and should have a *.pgp file extension. Please be mindful of the network activity that this action can place on the remote server hosting the files. Use sparingly on global pool dumps; otherwise mirror the files. Local directory where the files will be stored. /srv/hockeypuck/import is the default if not specified. Regardless of which service is keymaster or gatekeeper, both services will initiate and serve connections. To peer with other keyservers (Hockeypuck or SKS servers) that aren't in your Juju environment, set the config option recon_partners. The format of this option is a space-delimited list of partners, where each partner is a comma-separated pair of HTTP and recon addresses. Like this: Note that you can specify a different host for the HTTP and recon addresses. This supports connecting to peers that expose these ports on different host addresses. juju-gui screenshot from a Hockeypuck deployment: two synchronizing Hockeypuck peers, using MongoDB for storage, reverse-proxied by haproxy."
