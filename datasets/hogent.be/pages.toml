["https://hogent.be/dit-is-hogent/beleid"]
title = "Beleid - Hogeschool Gent"
description = "Geef de wereld het beste van jezelf. HOGENT inspireert en stimuleert mensen om, op eigen wijze, het verschil te maken in en voor de samenleving."
full_description = "HOGENT is er voor iedereen die, op eigen wijze, wil leren en wil bouwen aan een betere toekomst voor mens en planeet. We leiden toekomstbestendige professionals en kunstenaars op, die hun vak beheersen en helpen vernieuwen vanuit hun kennis, kunde en karakter. We vormen sociale, kritisch denkende, communicatief vaardige en ondernemende wereldburgers. We luisteren naar vragen uit de samenleving en anticiperen op maatschappelijke uitdagingen. We creëren praktijkgerichte kennis die grenzen verlegt met het oog op een duurzame toekomst. Door onderzoek in en beoefening van de kunsten nemen we een actieve rol op in het kunstenveld. HOGENT is een (vrij)moedige ruimte waar creativiteit en innovatie centraal staan. We versterken elkaar door in gesprek te gaan over onze verschillen. We werken samen met passie en met oog voor ieders eigenheid. HOGENT, da's kwaliteit. Aan HOGENT werken we vanuit een open houding samen aan die kwaliteit. We durven expe­rimen­teren, leren graag uit fouten, zijn zelfkritisch en staan open voor feedback. Kwaliteits­zorg is een zaak van iedereen. Meer lezen HOGENT, da's kwaliteit. Aan HOGENT werken we vanuit een open houding samen aan die kwaliteit. We durven expe­rimen­teren, leren graag uit fouten, zijn zelfkritisch en staan open voor feedback. Kwaliteits­zorg is een zaak van iedereen. Meer lezen Onderzoek en dienstverlening. HOGENT wil een verschil maken in en voor de samenleving. Daarom gaan we voor onderzoek en dienstverlening met duurzame impact. We zoeken in cocreatie naar oplossingen voor concrete problemen van bedrijven, organisaties en overheden en zetten in op de grote maatschappelijke uitdagingen van vandaag en morgen. Onderzoek en dienstverlening. HOGENT wil een verschil maken in en voor de samenleving. Daarom gaan we voor onderzoek en dienstverlening met duurzame impact. We zoeken in cocreatie naar oplossingen voor concrete problemen van bedrijven, organisaties en overheden en zetten in op de grote maatschappelijke uitdagingen van vandaag en morgen. Ben je op zoek naar expertise? Wil je met ons samenwerken? Ben je benieuwd naar onze onderzoeksprojecten? Ontdek hier de mogelijkheden. Het praktijkgericht wetenschappelijk onderzoek van HOGENT is... Verbonden met de opleidingen Onderwijs en onderzoek zijn onlosmakelijk met elkaar verbonden. Het onderzoek draagt bij tot de professionalisering van diegenen die onderwijs geven. Het inspireert de opleidingen tot reflectie over de beroepspraktijk en tot het integreren van onderzoeksresultaten en -methodes in het curriculum. Interdisciplinair Het onderzoek van HOGENT kijkt over de grenzen van disciplines heen. Door onderzoekers interdisciplinair te laten samenwerken, wil HOGENT inspelen op de complexiteit van de huidige en toekomstige maatschappelijke uitdagingen, en tegelijk het kritisch denken stimuleren over de grenzen van de eigen discipline. Gericht op impact Door onderzoek en expertise op diverse manieren te valoriseren, door dienstverlening en een aantrekkelijk aanbod van levenslang leren, is HOGENT een onmisbare partner bij leren en innoveren. Maatschappelijk geëngageerd Het onderzoek van HOGENT is maatschappelijk geëngageerd en maatschappijkritisch. Het anticipeert op ruime maatschappelijke uitdagingen en biedt antwoorden op de onmiddellijke noden van de beroepspraktijk. HOGENT zet in op cocreatie met het werkveld, beleidsmakers en burgers. Het onderzoek wordt gestuurd door een duidelijke onderzoeksagenda die geënt is op bestaande sterktes en op actuele maatschappelijke uitdagingen. De principes van duurzaamheid worden hierbij gehanteerd. Onderzoekscentra met duurzame impact Het praktijkgericht wetenschappelijk onderzoek aan HOGENT wordt uitgevoerd in inter­disciplinaire centra. Deze centra ambiëren op een duurzame manier bij te dragen aan oplossingen voor maatschappelijke uitdagingen door middel van meerjarige onderzoeks­programma's. Ze werken volgens de principes van systeemdenken, waarbij duurzame ontwikkeling mogelijk is binnen de ecologische en sociale grenzen die gesteld worden door de draagkracht van de aarde enerzijds en anderzijds de rechten van de mens. Om duurzame impact te realiseren, werken de centra nauw samen met de relevante interne en externe stakeholders bij wie ze een meetbare verandering willen realiseren op het vlak van attitudes, motivatie, kennis en/of vaardigheden. De centra fungeren als een draaischijf en open ontmoetings­plaats voor verschillende actoren. Ze bieden een platform voor samenwerking en uitwisseling tussen onderzoekers onderling en in cocreatie met lesgevers, studenten, partners uit het werkveld, partners uit de academische wereld, overheden, burgers, enzovoort. In de centra is er naast de onderzoek­sprojecten ook plaats voor dienstverlening, studenten­projecten, stages en bachelorproeven, waarbij gebruik kan worden gemaakt van de aanwezige infrastructuur en expertise. Deze activiteiten en het ontwikkelen en delen van onderzoeks­competenties in de centra bevorderen de nexus onderwijs-onderzoek. Daarnaast kunnen de centra demo's, activiteiten van levenslang leren en andere vormen van uitwisseling faciliteren tussen HOGENT-experten, andere onderzoeks­instellingen, alumni, ondernemers, designers, enzovoort. Maak kennis met de 12 onderzoekscentra. HR Excellence in Research HOGENT werd in 2017 beloond met het HR Excellence in Research Award. Dit label toont aan dat HOGENT zich inzet om via een HR-strategie voor onderzoekers het HR-beleid van onderzoekers voortdurend te verbeteren. We trachten op een respectvolle manier te zorgen voor goede werkomstandigheden voor alle onderzoekers binnen HOGENT. De HR-strategie voor onderzoekers van HOGENT gaat in op vier onderwerpen: · Ethische en professionele aspecten van onderzoeksactiviteiten · Rekrutering en selectie van onderzoekers · Werkomstandigheden voor HOGENT-personeel, inclusief de onderzoekers · Professionaliserings- en ontwikkelingsmogelijkheden voor onderzoekers Lees meer over het HR Excellence in Research label’ Gender Equality Plan HOGENT voldoet aan de Europese vereiste kenmerken van een Gender Equality Plan. Internationalisering. Als maatschappelijk geëngageerde organisatie wil HOGENT met haar medewerkers en afgestudeerden grenzen verleggen en zorgen voor innovatie en duurzame oplossingen die bijdragen tot de kwaliteit van het leven, ook met partners in regio's in ontwikkeling. Internationalisering. Als maatschappelijk geëngageerde organisatie wil HOGENT met haar medewerkers en afgestudeerden grenzen verleggen en zorgen voor innovatie en duurzame oplossingen die bijdragen tot de kwaliteit van het leven, ook met partners in regio’s in ontwikkeling. Diversiteitsbeleid betekent voor HOGENT het (h)er­kennen en aanvaarden van de unieke kwaliteiten en eigenschappen van alle studenten en personeels­leden en het bieden van mogelijkheden om die succesvol in te schakelen en te laten renderen. HOGENT wil talenten optimaal benutten door een structureel, inclusief diversiteitsbeleid te voeren. Diversiteitsbeleid voor studenten HOGENT wil al haar studenten de kans geven om hun talenten te ontplooien door een structureel, inclusief diversiteitsbeleid dat ingebed is in het algemene in-, door- en uitstroombeleid. Oog voor struikelblokken Tegelijkertijd heeft HOGENT extra aandacht voor pedagogisch-didactische struikelblokken die studenten zouden kunnen hinderen bij hun instroom, doorstroom en uitstroomtraject. Deze struikelblokken komen voort uit een wisselwerking tussen persoonskenmerken, de sociale omgeving en de onderwijsomgeving, en kunnen bijvoorbeeld te maken hebben met socio-economische status, taalvaardigheden en andere startcompetenties, functiebeperking, gender, interculturaliteit. Design for all HOGENT zet zowel in op het versterken van persoonskenmerken, als op het systematisch organiseren van het onderwijs en de onderwijsomgeving volgens het principe van design for all. Hierbij worden het onderwijs en de onderwijsomgeving niet afgestemd op de modale student, maar op een groep potentiële studenten die de diversiteit in de samenleving weerspiegelt. Voortdurende afstemming HOGENT wil studenten ondersteunen bij het (waar)maken van een adequate en gemotiveerde studiekeuze op basis van een realistische inschatting van de eigen competenties, talenten en interesses enerzijds, en van de verwachte en beoogde competenties van de verschillende opleidingen anderzijds. Diversiteitsbeleid voor personeel Het diversiteitsbeleid voor personeel van HOGENT is gericht op de hele personeelsgroep. Acties zijn niet gericht op een bepaalde groep of groepen, maar worden gevoerd in het kader van een geïntegreerd, kwaliteitsvol en duurzaam beleid ten behoeve van elk individueel personeelslid en de gehele organisatie. Wat willen we bereiken? Een werkklimaat waarin iedereen zich vrij voelt, begrip en respect ontvang en zich beschermd weet. Mogelijkheid om via innovatie en creativiteit andere, nieuwe, ideeën en inzichten te creëren. Erkenning van ieders vaardigheden en competenties. Duurzaamheid. HOGENT wil bouwen aan een betere toekomst. Daarom is duurzaamheid verankerd in de strategische doelstellingen. HOGENT kiest bewust om de strategie en het beleid op te bouwen binnen de Sustainable Development Goals van de Verenigde Naties. Meer over duurzaamheidsbeleid Meer over de SDG's Duurzaamheid. HOGENT wil bouwen aan een betere toekomst. Daarom is duurzaamheid verankerd in de strategische doelstellingen. HOGENT kiest bewust om de strategie en het beleid op te bouwen binnen de Sustainable Development Goals van de Verenigde Naties. Meer over duurzaamheidsbeleid Meer over de SDG's Taalbeleid bij HOGENT is consequent aandacht hebben voor de taalontwikkeling van studenten om hun studie succesvol te doorlopen en vlot te communiceren in een professionele context. Doelgerichte aandacht voor taalvaardigheid maakt deel uit van een stimulerend hoger onderwijs. Taalbeleid in de praktijk Drie basisdoelstellingen geven richting aan taalbeleid in de praktijk: transparant communiceren over de vereiste taalvaardigheid en structureel taalondersteuning bieden taalvaardigheid stimuleren in functie van de opleiding, de professionele context, de persoonlijke ontwikkeling en deelname aan de samenleving taalvariatie en meertaligheid waarderen, benutten en stimuleren Talige diversiteit wordt positief gewaardeerd. Studenten, lesgevers, onderzoekers en medewerkers worden aangemoedigd hun talig repertoire in te zetten en te blijven ontwikkelen."
