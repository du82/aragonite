full_description = "Welke opleiding past bij jou? Ontdek het op ons studiekeuze­platform! Je vindt er ons volledige opleidings­aanbod: graduaat, bachelor, bachelor-na-bachelor, master, master-na-master, afstands­leren, post­graduaten, verkorte trajecten, navormingen en studie­dagen. Ben je al overtuigd van je studiekeuze? Schrijf je dan meteen in! Daarnaast hebben we voor jou alle info die je nodig hebt voor een vlotte start gebundeld op één handige webpagina. Inschrijven Een vlotte start aan HOGENT Zoek een opleiding op interesse Klik hier Ontdek het studiekeuze­platform Klik hier Chat met een student of medewerker Klik hier Bezoek ons op de infodag van 26 februari Klik hier Download een brochure Klik hier Volg een open les Klik hier Laat je inspireren door HOGENTenaars. Laat je inspireren door échte HOGENTenaars. HOGENTenaars zijn een ras apart. Karaktervol, passioneel over hun vak en vastberaden hun doel te behalen. Elk op hun manier trachten ze de wereld het beste van zichzelf te geven. Check hun verhalen en laat je inspireren. Word jij ook een echte HOGENTenaar? Laat je inspireren Word leerkracht. Maak de volgende generatie klaar om de wereld het beste van zichzelf te geven. Ontdek onze lerarenopleidingen Word leerkracht. Maak de volgende generatie klaar om de wereld het beste van zichzelf te geven. Ontdek onze lerarenopleidingen Werken aan HOGENT. Werken bij HOGENT, dat is kiezen voor een boeiende en afwisselende job in een aangename werkomgeving. meer info → Studeren aan HOGENT Alles wat bij studeren komt kijken: van inschrijven begeleiding, internationale ervaringen tot je kot en de weekmenu's in onze resto's. meer info Studeren aan HOGENT Alles wat bij studeren komt kijken: van inschrijven begeleiding, internationale ervaringen tot je kot en de weekmenu's in onze resto's. meer info P Partners. We hebben ook een ruim aanbod voor partners, gaande van het werkveld tot secundaire scholen en alumni. Ontdek ons aanbod en doe een beroep op onze expertise. Met ruim