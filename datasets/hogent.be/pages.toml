title = "dit is HOGENT - Hogeschool Gent"
description = "Geef de wereld het beste van jezelf. HOGENT inspireert en stimuleert mensen om, op eigen wijze, het verschil te maken in en voor de samenleving."
full_description = "Maatschappelijk geëngageerd en een tikkeltje eigenwijs. Dat is HOGENT. HOGENT gelooft in de kracht van mensen. We zijn ervan overtuigd dat iedereen op hun manier het verschil kan maken, in én voor onze samenleving. Daarom delen we onze kennis en expertise met de studenten, met het werkveld en met de collega’s. Door ons onderwijs, onderzoek, dienstverlening en de beoefening van de kunsten maken we de maatschappij mee. HOGENT is een broedplaats waar kennis, creativiteit en ondernemerschap elkaar versterken en stimuleren. We stellen zaken in vraag en durven het status quo uitdagen, want dit leidt tot nieuwe kennis en vaardigheden. Vanuit onze passie doen we groeien en ontdekken, we inspireren elkaar om te experimenteren, grenzen te verleggen en te blijven leren. Video HOGENT: mensen maken het verschil Future proof. Studeren aan HOGENT gaat niet alleen over wat er in de boeken staat. Het gaat ook over wat je van die boeken vindt. Niet enkel over correcte antwoorden, maar over de juiste vragen stellen. Niet enkel over onze wijsheid, maar jouw eigenwijsheid. Bij HOGENT dagen we je uit. Wordt studeren de overtreffende trap van bijleren. Omdat wie als een grijze muis meeloopt, vroeg of laat, wordt ingehaald. Dus waarom HOGENT? Wel daarom! Omdat je behalve een stevige vakopleiding, vooral een future proof-attitude meekrijgt. Want jij kan het verschil maken. In en voor de maatschappij. Met ons uitgebreide opleidingsaanbod over alle studiedomeinen hebben we voor ieder talent en ambitie de geschikte opleiding. Ontdek de waaier aan opleidingen Future proof. Studeren aan HOGENT gaat niet alleen over wat er in de boeken staat. Het gaat ook over wat je van die boeken vindt. Niet enkel over correcte antwoorden, maar over de juiste vragen stellen. Niet enkel over onze wijsheid, maar jouw eigenwijsheid. Bij HOGENT dagen we je uit. Wordt studeren de overtreffende trap van bijleren. Omdat wie als een grijze muis meeloopt, vroeg of laat, wordt ingehaald. Dus waarom HOGENT? Wel daarom! Omdat je behalve een stevige vakopleiding, vooral een future proof-attitude meekrijgt. Want jij kan het verschil maken. In en voor de maatschappij. Met ons uitgebreide opleidingsaanbod over alle studiedomeinen hebben we voor ieder talent en ambitie de geschikte opleiding. Ontdek de waaier aan opleidingen Een partner voor het leven. Niemand weet wat de toekomst te bieden heeft. Maar één ding is zeker: we zullen levenslang leren. Dat geldt voor ieder van ons, of je nu student, werknemer, werkzoekende, of ondernemer bent. Steeds weer zal je nieuwe dingen aanleren en oude afleren. Want enkel zo kan je meesurfen op de continue veranderingen en de technologische vernieuwingen bijbenen. En enkel zo kan je jezelf blijven ontwikkelen en je ambities waarmaken. Yonk van HOGENT is hierin jouw partner. Met een gevarieerd aanbod bieden we je die kennis en expertise waar je op dat moment in je loopbaan of leven naar op zoek bent, en dat op de manier waarbij jij je het meest comfortabel bij voelt. Ontdek het aanbod Blijf je ontwikkelen, blijf YONK. Sla je vleugels uit! Verruim je blik en open je geest bij HOGENT. A Een artistieke vrijplaats. Aan KASK & Conservatorium geloven we in een hoge graad van artistieke en creatieve vrijheid. Wie bij ons studeert, schept met een open vizier een eigen toekomst. Je geeft hier vorm aan jezelf als kunstenaar, muzikant, vormgever, film- of theatermaker, instrumentenbouwer, landschapsarchitect, muziekproducer, tentoonstellingsmaker… KASK & Conservatorium is één school met vele kamers. Meer dan 2000 studenten, begeleid door meer dan 400 hooggespecialiseerde lesgevers en onderzoekers, allemaal werken we aan een toekomst die tal van kanten uit kan. De Bijloke en de Grote Sikkel in Gent, Buda in Kortrijk… onze campussen liggen midden in een bruisende stad, maar ze zijn ook eeuwenoud. Het zijn oases van rust waar men kan werken én leven. KASK & Conservatorium Duurzame impact. HOGENT maakt de wereld mee. Daarom gaan we voor onderzoek en dienstverlening met duurzame impact. We zoeken in cocreatie naar oplossingen voor concrete problemen van bedrijven, organisaties en overheden en zetten in op de grote maatschappelijke uitdagingen van vandaag en morgen. Met twaalf multidisciplinaire onderzoekscentra maken we deze ambitie waar, de duurzame ontwikkelingsdoelstellingen van de Verenigde Naties zijn hierin ons kompas. Ook in het artistieke onderzoeksveld is HOGENT een gewaardeerde innovatiepartner. praktijkgericht wetenschappelijk onderzoek artistiek onderzoek duurzaamheidsbeleid Duurzame impact. HOGENT maakt de wereld mee. Daarom gaan we voor onderzoek en dienstverlening met duurzame impact. We zoeken in cocreatie naar oplossingen voor concrete problemen van bedrijven, organisaties en overheden en zetten in op de grote maatschappelijke uitdagingen van vandaag en morgen. Met twaalf multidisciplinaire onderzoekscentra maken we deze ambitie waar, de duurzame ontwikkelingsdoelstellingen van de Verenigde Naties zijn hierin ons kompas. Ook in het artistieke onderzoeksveld is HOGENT een gewaardeerde innovatiepartner. praktijkgericht wetenschappelijk onderzoek artistiek onderzoek duurzaamheidsbeleid Een bruisende community. HOGENTenaars zijn een ras apart. Karaktervol, passioneel over hun vak, vastberaden hun doel te behalen. Een HOGENTenaar durft tegen de stroom in te gaan en buiten de lijntjes te kleuren. Personeel en studenten, samen maken we HOGENT. Studenten hebben hun stem in elk topic. Van studiegelden, examenroosters, menu’s van de restaurants tot een studentvriendelijke stad. Verenigd onder de koepel ‘Revolte’. HOGENTenaars ontmoeten elkaar op de campussen verspreid over campussen in Gent, Aalst, Melle, Lokeren en Bottelare. De campussen zijn gezellige en levendige ontmoetingsplaatsen. Met verschillende resto’s en een sfeervolle koffiebar, een openleercentrum, een sporthal, en een campusshop, is campus Schoonmeersen het hart van de bruisende HOGENT-community. Wist je dat je er zelfs kan wonen? De campus (virtueel) bezoeken Geef de wereld het beste van jezelf."
