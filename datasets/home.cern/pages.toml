title = "Who we are | CERN"
full_description = "Yves was being filmed for a documentary on track chambers and computing. (Image: CERN) Who we are What is CERN's mission? At CERN, our work helps to uncover what the universe is made of and how it works. We do this by providing a unique range of particle accelerator facilities to researchers, to advance the boundaries of human knowledge. Why was CERN built? At the end of the Second World War, European science was no longer world-class but a handful of visionary scientists imagined creating a European atomic physics laboratory. Founded in 1954, the CERN laboratory sits astride the Franco-Swiss border near Geneva. Who are the people that make CERN? CERN employs about 2500 people from nationalities all around the world, working in every area of the Organization, from physicists to computer scientists to chefs. How is CERN is governed and organised? CERN is run by Member States, each of which has two official delegates to the CERN Council. The CERN Council is the highest authority of the Organization and has responsibility for all-important decisions. It controls CERN’s activities in scientific, technical and administrative matters."
