["https://home.cern/science/computing"]
title = "Computing | CERN"
full_description = "(Image: CERN) Computing A central role in the fulfilment of CERN’s mission CERN is one of the most highly demanding computing environments in the research world. The World Wide Web was originally conceived and developed at CERN to meet the demand for automated information-sharing between scientists in universities and institutes around the world. From software development, to data processing and storage, networks, support for the LHC and non-LHC experimental programme, automation and controls, as well as services for the accelerator complex and for the whole laboratory and its users, computing is at the heart of CERN’s infrastructure. The Worldwide LHC Computing Grid (WLCG) – a distributed computing infrastructure arranged in tiers – gives a community of thousands of physicists near real-time access to LHC data. The CERN data centre is at the heart of WLCG, the first point of contact between experimental data from the LHC and the grid. Through CERN openlab, a unique public-private partnership, CERN collaborates with leading ICT companies and other research organisations to accelerate the development of cutting-edge ICT solutions for the research community. CERN has also established a medium- and long-term roadmap and research programme in collaboration with the high energy physics and quantum-technology research communities via the CERN Quantum Technology Initiative (QTI). CERN Data Centre WLCG The Worldwide LHC Computing Grid Storage The network challenge Open source for open science Data preservation CERN openlab Volunteer computing Net neutrality Towards the future: tackling upcoming data challenges A continuing programme of upgrades and consolidations to the LHC and the experiments at CERN will result in hugely increased ICT demands in the coming years, exceeding what is expected to be achievable with a constant investment budget by several factors in both storage and computing capacity. When the High-Luminosity LHC, HL-LHC, comes online in 2029, the storage and processing requirements are expected to be ten times greater than today. In order to address this, in 2017 the High Energy Physics community produced a roadmap Community White Paper (arXiv:1712.06982) that explores these software challenges and describes a number of potential mechanisms by which the community can address these problems of capacity and efficiency that will be faced during the next decade. The large-scale data challenges of HL-LHC are also shared with other science communities. WLCG and CERN have been working with the Square Kilometre Array (SKA) radio astronomy community to explore some of these common challenges. In June 2017, CERN and the SKA Organisation signed a Collaboration Agreement for joint work in computing and data management. In 2017 CERN openlab also published a white paper identifying the major ICT challenges that face CERN and other ‘big science’ projects in the coming years in order to collaborate with the industry and research institutes to tackle them. In 2021, the CERN Quantum Technology Initiative unveiled its first roadmap defining its medium- and long-term quantum research programme."
