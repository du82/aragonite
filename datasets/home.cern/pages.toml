["https://home.cern/fr/about/what-we-do/bring-nations-together"]
title = "Rassembler les nations | CERN"
full_description = "Cérémonie d'inauguration de l'esplanade des particules (Image: CERN) Rassembler les nations Le CERN rapproche les peuples et rassemble des cultures différentes afin de travailler à un objectif commun, dans un esprit d'ouverture et de collaboration pacifique Toutes ces années, le CERN a accueilli les communautés scientifiques de toutes origines, transcendant les barrières politiques. Durant la guerre froide, les chercheurs du CERN travaillèrent avec leurs confrères soviétiques et américains. Juste après la chute du mur de Berlin, de nombreux pays d’Europe de l’Est rejoignirent le CERN. Et aujourd’hui, des scientifiques du monde entier se côtoient au sein du Laboratoire. Le CERN fut pionnier dans la collaboration scientifique européenne et aida de nombreuses organisations à se développer, dans des domaines allant de l’astronomie à la biologie. La dernière organisation en date à suivre le modèle du CERN est le laboratoire SESAME en Jordanie, au Moyen-Orient. Israël et l’Autorité palestinienne font partie des membres fondateurs. Cela peut paraître surprenant, mais c’est pourtant la même philosophie qui conduisit, au sortir de la Seconde Guerre mondiale, les pays européens à coopérer en fondant le CERN. Pour en savoir plus sur ce sujet, cliquez sur États membres et relations internationales. Dernières nouvelles connexes Le Brésil devient État membre associé du CERN... At CERN News 22 mars, 2024 Le Brésil va devenir État membre associé du C... At CERN Press release 12 avril, 2022 La Lettonie devient État membre associé du CE... At CERN News 2 août, 2021 La Lettonie va devenir État membre associé du... At CERN Press release 14 avril, 2021 La Serbie devient le 23e État membre du CERN At CERN Press release 24 mars, 2019 La Croatie devient État membre associé du CER... At CERN Press release 28 février, 2019 Le CERN accueille la Roumanie en tant que nou... At CERN News 17 juillet, 2016 Premiers tours de faisceaux pour SuperKEKB Physics News 17 mars, 2016 Visites officielles de la Lituanie et du Paki... At CERN News 27 janvier, 2016 Voir toutes les actualités connexes"
