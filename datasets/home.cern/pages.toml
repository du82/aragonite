["https://home.cern/news/news/cern/cern-invites-photographers-explore-colliders-future"]
title = "CERN invites photographers to explore the colliders of the future | CERN"
description = 'Cameras at the ready! On 27 May 2025, twenty photographers will be given an exclusive opportunity to explore the world’s largest particle physics laboratory. CERN is teaming up with major science laboratories for an international photography competition known as the Global Physics Photowalk. During this year’s competition at CERN, entitled the “CERN Photowalk 2025: Future Colliders”, the Laboratory will open the doors to four unique spaces. The photographers will discover the facilities of the High-Luminosity LHC, its new magnets and cold powering system, and some of the technologies that will be needed for the machines of the future in decades to come. The best photos will be chosen by a local jury and a public vote. Each laboratory will also choose three photos to be entered into the international competition, which will run at the end of the summer. The winning photos in the international competition will be selected by a jury and a public vote and will be featured in the CERN Courier and in Symmetry magazine. The “CERN Photowalk 2025: Future Colliders” competition is open to all photographers. For more information about it, including how to enter, please go to: https://photowalk.web.cern.ch   Please note that the number of participants is limited and that the deadline for applications is 23 March 2025, 23:59:00 CET. For more information about the international competition, "Global Physics Photowalk 2025", please go to this link. Follow #PhysPics25 on social media for the latest news about this event.'
