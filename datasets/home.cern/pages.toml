d Asian countries and the USA, while there are none in Africa and only one under construction in South America. With the technology of Fusillo, a Curved-Canted-Cosine-Theta (CCCT) dipole demonstrator, the treatment might become more accessible in the future. This new type of electromagnet has many benefits: it requires a much lower current, has a relatively low cost and is more compact than other magnets due to a simplified design that requires fewer individual parts. Fusillo is also expected to be more easily cooled by dry cooling without using liquid helium, unlike many other superconducting magnets. Ten ropes, each made of seven insulated wires, are combined into a cable before being wound around the metal former that can be seen in the background. (Image: M. Struik/CERN) The basis of Fusillo’s design is cable wound into two nested coils. The coils are tilted following the grooves of the so-called “former”, seen in the first picture. The inner coil is tilted in the opposite direction to the outer coil, and together they produce a dipole field inside the tube. This is a new approach to creating a dipole field, which is being tested by the Fusillo demonstrator. Although the underlying idea has been around for many decades, the necessary computing power for its design has only been available in recent years. To produce a magnet that can be powered by a low current, Ariel Haziot and his team at CERN decided to twist multiple insulated wires into a type of rope that is then wound around the former. The individual wires are connected in a way that allows the current to run many laps around the coils, creating an electromagnet of usable strength (3 T in the centre) that requires a relatively small amount of current (300 A). The Canted-Cosine-Theta (CCT) concept has been in development at CERN since 2014 and is used in the High-Luminosity LHC. The current project of building a curved CCT demonstrator has so far taken Haziot and his team about 2.5 years. The photos document the recent process of winding the cables around the former. With only a couple of final steps to go, the building phase is drawing to a close and the first full-scale tests of this new magnet are planned for April. Following several subscale assessments, the tests will compare the magnet against simulation results and determine the next steps in the development process. Magnets like Fusillo are expected to be in use in the new storage ring for HIE-ISOLDE within about five years and might then be developed further for other applications, including hadron therapy. Carlos Fernandes (left), Frédéric Garnier (centre) and Ariel Haziot (right) wind the ropes of cable around the former. (Image: M. Struik/CERN) Knowledge transfersuperconductivitymagnetmedical applications Related Articles Women and Girls in Science and Technology 202... Knowledge sharing News 27 February, 2025 AI treatments for stroke survivors Knowledge sharing News 27 January, 2025 GaToroid - getting closer to affordable cance... Knowledge sharing News 16 January, 2025 View all news Also On Accelerators Accelerator Report: Linac4 beam commissioning... Accelerators News 24 February, 2025 Chamonix Workshop 2025: looking to the future Accelerators Opinion Mike Lamont 13 February, 2025 Accelerator Report: A first step towards beam... Accelerators News 13 February, 2025 Accelerator Report: Preparing for 2025 LHC op... Accelerators News 29 January, 2025 Accelerator Report: Another exciting year ahe... Accelerators News 17 January, 2025 Accelerator Report: A well-deserved winter br... Accelerators News 13 December, 2024 Future Circular Collider innovation and the e... Accelerators News 12 December, 2024 The test stand for the High-Luminosity LHC we... Accelerators News 12 December, 2024 Accelerator Report: The excellent 2024 LHC ru... Accelerators News 29 November, 2024 View all news"
