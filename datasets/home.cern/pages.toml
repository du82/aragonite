["https://home.cern/news/news/physics/bestiary-exotic-hadrons"]
title = "A bestiary of exotic hadrons | CERN"
description = "The Large Hadron Collider (LHC) has discovered 76 new particles so far. In addition to discovering the unique Higgs boson, the world’s largest and most powerful particle accelerator has found 52 new hadrons made up of two or three elementary particles called quarks and a bestiary of 23 oddities which confound easy explanation. These exotic hadrons appear to be composed of four or five quarks, but how they stick together is a subject of hot debate. The November/December 2024 edition of CERN Courier attacks the question on two fronts. As experimental particle physicists from CERN’s LHCb experiment, Patrick Koppenburg of Nikhef and Marco Pappagallo of INFN and the University of Bari approach the question as a detective story – an experimentally driven quest to understand the exotic offspring of one of the fundamental forces of nature. Meanwhile, theorists Marek Karliner of Tel Aviv University and Jonathan L. Rosner of the University of Chicago offer piercing insights into the quantum anatomy of exotic hadrons, revealing them to behave at times like molecules, at times as novel compact states, and at times as both simultaneously – with much still to be discovered. Find out more in the two CERN Courier articles here and here."
full_description = "News News Topic: Physics Voir en français A bestiary of exotic hadrons The LHC is engaged in a complex quest to understand the exotic offspring of one of the fundamental forces of nature 20 February, 2025 A simplified visualisation of the 23 exotic hadrons discovered so far at the LHC. Each particle contains at least one charm quark and a mixture of up, down and strange quarks. Quark and hadron masses are indicated by area, and quarks and antimatter quarks are shown in black and white, respectively. See CERN Courier for a full explanation. (Image: M. Rayner) The Large Hadron Collider (LHC) has discovered 76 new particles so far. In addition to discovering the unique Higgs boson, the world’s largest and most powerful particle accelerator has found 52 new hadrons made up of two or three elementary particles called quarks and a bestiary of 23 oddities which confound easy explanation. These exotic hadrons appear to be composed of four or five quarks, but how they stick together is a subject of hot debate. The November/December 2024 edition of CERN Courier attacks the question on two fronts. As experimental particle physicists from CERN’s LHCb experiment, Patrick Koppenburg of Nikhef and Marco Pappagallo of INFN and the University of Bari approach the question as a detective story – an experimentally driven quest to understand the exotic offspring of one of the fundamental forces of nature. Meanwhile, theorists Marek Karliner of Tel Aviv University and Jonathan L. Rosner of the University of Chicago offer piercing insights into the quantum anatomy of exotic hadrons, revealing them to behave at times like molecules, at times as novel compact states, and at times as both simultaneously – with much still to be discovered. Find out more in the two CERN Courier articles here and here. hadronstrong force Related Articles ALICE takes the next step in understanding th... Physics News 17 November, 2021 Meet AMBER Physics News 8 March, 2021 59 new hadrons and counting Physics News 3 March, 2021 View all news Also On Physics Observing triplets of weak bosons Physics News 19 February, 2025 The other 99% Physics News 5 February, 2025 Clocking nature’s heaviest elementary particl... Physics News 23 January, 2025 The measurement of a lifetime Physics News 19 December, 2024 LHCb sheds light on two pieces of the matter–... Physics News 16 December, 2024 A tale of two Higgs: CMS searches for the pro... Physics News 11 December, 2024 ALICE finds first ever evidence of the antima... Physics News 9 December, 2024 CLOUD experiment resolves puzzle of new aeros... Physics Press release 4 December, 2024 ATLAS observes top quarks in lead–lead collis... Physics News 15 November, 2024 View all news"
