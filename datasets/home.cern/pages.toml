["https://home.cern/news/news/physics/other-99"]
title = "The other 99% | CERN"
description = "Atoms are made up of protons and neutrons orbited by electrons, which are thousands of times lighter. But that’s not the whole story. Protons and neutrons are themselves composed of trios of particles called quarks, which are only a little heavier than the electrons and contribute less than 1% to the mass of protons and neutrons. So where does the other 99% of the mass of protons and neutrons – and thus of the visible Universe – come from? The answer is “glue” or, more specifically, particles called gluons, which stick the quarks together. Although gluons are massless, their energy provides the other 99% of the mass of protons and neutrons via Einstein’s famous equation E=mc2. However, much remains to be understood about gluon dynamics. The chief experimental challenge is to observe the onset of gluon saturation – a dynamic equilibrium between the splitting of gluons into pairs of gluons and gluon recombination, in which two gluons combine to become one. In the latest issue of the CERN Courier, Daniel Tapia Takaki of the University of Kansas describes how ultraperipheral, or near-miss, collisions at the Large Hadron Collider (LHC), mediated by high-energy photons, are shedding light on gluon dynamics and could reveal gluon saturation. Find out more in Takaki’s CERN Courier article and in this article from the ALICE collaboration."
full_description = 'News News Topic: Physics Voir en français The other 99% Near-miss collisions at the Large Hadron Collider are shedding light on the dynamics of gluons, which contribute 99% to the mass of protons and neutrons 5 February, 2025 Simulations of the density of gluons in the proton, showing the onset of gluon saturation. The first snapshot (no gluon saturation) shows a handful of "hotspots" of gluon density at an energy scale corresponding to gluons carrying roughly 1% of the proton’s momentum. The following eight delve down to 0.0001% of the proton’s momentum, where more than 70 hotspots overlap and gluons recombine as frequently as they split (gluon saturation). (Image: A. Ridzikova) Atoms are made up of protons and neutrons orbited by electrons, which are thousands of times lighter. But that’s not the whole story. Protons and neutrons are themselves composed of trios of particles called quarks, which are only a little heavier than the electrons and contribute less than 1% to the mass of protons and neutrons. So where does the other 99% of the mass of protons and neutrons – and thus of the visible Universe – come from? The answer is “glue” or, more specifically, particles called gluons, which stick the quarks together. Although gluons are massless, their energy provides the other 99% of the mass of protons and neutrons via Einstein’s famous equation E=mc2. However, much remains to be understood about gluon dynamics. The chief experimental challenge is to observe the onset of gluon saturation – a dynamic equilibrium between the splitting of gluons into pairs of gluons and gluon recombination, in which two gluons combine to become one. In the latest issue of the CERN Courier, Daniel Tapia Takaki of the University of Kansas describes how ultraperipheral, or near-miss, collisions at the Large Hadron Collider (LHC), mediated by high-energy photons, are shedding light on gluon dynamics and could reveal gluon saturation. Find out more in Takaki’s CERN Courier article and in this article from the ALICE collaboration. protongluonLHC Related Articles Accelerator Report: The excellent 2024 LHC ru... Accelerators News 29 November, 2024 Accelerator Report: Ending the 2024 LHC proto... Accelerators News 17 October, 2024 Accelerator Report: Exploring potential perfo... Accelerators News 30 May, 2024 View all news Also On Physics A bestiary of exotic hadrons Physics News 20 February, 2025 Observing triplets of weak bosons Physics News 19 February, 2025 Clocking nature’s heaviest elementary particl... Physics News 23 January, 2025 The measurement of a lifetime Physics News 19 December, 2024 LHCb sheds light on two pieces of the matter–... Physics News 16 December, 2024 A tale of two Higgs: CMS searches for the pro... Physics News 11 December, 2024 ALICE finds first ever evidence of the antima... Physics News 9 December, 2024 CLOUD experiment resolves puzzle of new aeros... Physics Press release 4 December, 2024 ATLAS observes top quarks in lead–lead collis... Physics News 15 November, 2024 View all news'
