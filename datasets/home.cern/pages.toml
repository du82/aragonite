["https://home.cern/about/who-we-are/our-mission"]
title = "Our Mission | CERN"
full_description = "about who we are our mission Our Mission Our Mission Research. Innovation. Collaboration. Inspiration. What is CERN's mission? Katarzyna Dyga of IT department measuring the TETRA network coverage and quality of voice calls in the AD during the end of year technical stop 2017/2018 assuring that the TETRA service is reliable. (Image: CERN) At CERN, our work helps to uncover what the universe is made of and how it works. We do this by providing a unique range of particle accelerator facilities to researchers, to advance the boundaries of human knowledge. The Laboratory, established in 1954, has become a prime example of international collaboration. Our mission is to: perform world-class research in fundamental physics. provide a unique range of particle accelerator facilities that enable research at the forefront of human knowledge, in an environmentally responsible and sustainable way. unite people from all over the world to push the frontiers of science and technology, for the benefit of all. train new generations of physicists, engineers and technicians, and engage all citizens in research and in the values of science. Our Goals Discovery through science Technological innovation Diversity and bringing nations together Inspiration and Education We want to: deliver world-class scientific results and knowledge; use our flagship accelerator, the LHC, to its maximum potential during its high-luminosity phase; provide maintain and continually update a diverse, complementary scientific programme serving a broad community; prepare for a post-LHC high-energy accelerator project. Beyond science, we also aim to: be a politically neutral voice for science, advocating investment in fundamental research and evidence-based policy; build further links with industry in terms of the transfer of knowledge from CERN to industry; train a new generation of scientists and engineers; inspire and nurture scientific awareness in all citizens. Find out more about CERN’s main objectives for 2021–2025 How do we fulfil our mission each year? Read our annual report"
