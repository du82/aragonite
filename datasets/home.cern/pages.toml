title = "Bring nations together | CERN"
full_description = "Cérémonie d'inauguration de l'esplanade des particules (Image: CERN) about what we do bring nations together Bring nations together Bring nations together CERN bridges nationalities and brings different cultures together to work towards a common goal, with the spirit of openness and peaceful collaboration Over the years, CERN has always been open to the scientific communities of all nations, overcoming political barriers. CERN scientists worked with their Soviet and US counterparts throughout the Cold War. It is no accident that many Eastern European countries joined CERN soon after the fall of the Berlin Wall. And today, scientists from all regions of the world rub shoulders at the Laboratory. CERN was the prototype for scientific collaboration in Europe, and has given rise to organisations with remits ranging from astronomy to biology. The latest organisation to follow in CERN’s footsteps is SESAME, a laboratory for the Middle East in Jordan. That Israel and the Palestinian Authority should be among the founder members of SESAME may seem surprising, but perhaps no more so than the countries of Europe coming together in the wake of the Second World War to found CERN. Find out more about our Member States and our International relations. Latest Related News Brazil becomes Associate Member State of CERN At CERN News 22 March, 2024 Brazil to become an Associate Member State of... At CERN Press release 12 April, 2022 Latvia becomes Associate Member State of CERN At CERN News 2 August, 2021 Latvia to join CERN as an Associate Member St... At CERN Press release 14 April, 2021 Serbia joins CERN as its 23rd Member State At CERN Press release 24 March, 2019 Croatia to become an Associate Member of CERN At CERN Press release 28 February, 2019 CERN welcomes Romania as its twenty-second Me... At CERN News 17 July, 2016 Congratulations to SuperKEKB for “first turns... Physics News 2 March, 2016 Official visits to CERN from Lithuania and Pa... At CERN News 27