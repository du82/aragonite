["https://home.cern/science/computing/open-source-open-science"]
title = "Open source for open science | CERN"
description = "Information about open data releases from CERN experiments"
full_description = 'Council Chamber meeting 29 Sept 2017 (Image: CERN) science computing open source open science Open source for open science Open source for open science For the benefit of society at large The cornerstone of the open-source philosophy is that the recipients of technology should have access to all its building blocks, such as software code, schematics for electronics and mechanical designs, in order to study it, modify it and redistribute it to others. Ever since releasing the World Wide Web software under an open-source model in 1994, CERN has continuously been a pioneer in this field, supporting open-source hardware (with the CERN Open Hardware Licence), open access (with the Sponsoring Consortium for Open Access Publishing in Particle Physics - SCOAP³) and open data (with the Open Data Portal for the LHC experiments). The CERN Open Data portal is a testimony to CERN’s policy of Open Access and Open Data. The portal allows the LHC experiments to share their data with a double focus: for the scientific community, including researchers outside the CERN experimental teams, as well as citizen scientists, and for the purposes of training and education through specially curated resources. The first papers based on data from the CERN Open Data portal have been published. Several CERN technologies are being developed with open access in mind. Invenio is an open-source library management package, now benefiting from international contributions from collaborating institutes, typically used for digital libraries. Indico is another open-source tool developed at CERN for conference and event management and used by more than 200 sites worldwide, including the United Nations. INSPIRE, the High Energy Physics information system, is another example of open source software developed by CERN together with DESY, Fermilab and SLAC. CERN, with co-funding from the European Commission, has also invested in Zenodo, a free repository for storing data, software and other research artefacts. It is intended for use beyond the High Energy Physics community and taps into CERN’s long-standing tradition and know-how in sharing and preserving scientific knowledge for the benefit of all. Zenodo is hosted at CERN and provides the wider scientific community with the option of storing its data in a non-commercial environment and making it freely available to society at large. .tabcontent, .tabs, .link-container { text-align: left; /* Aligns text of the tab content and links to the left */ } .tabcontent { display: none; width: 100%; padding: 20px; margin: 20px 0px; border: 2px solid #1974D2; /* Blue border */ background-color: white; /* White background */ box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Optional: adds shadow for better visibility */ } .tabs { overflow: hidden; } .tablinks, .separator { background-color: transparent; border: none; outline: none; cursor: pointer; padding: 20px 1px; transition: 0.3s; font-family: Arial; font-size: 15px; display: inline-block; margin: 10px 1px; color: #1974D2; /* Default text color */ text-decoration: none; /* No underline by default */ } .tablinks:hover, .tablinks.active { color: #FFA500; /* Orange color on hover and when active */ text-decoration: underline; /* Underline on hover and when active */ font-weight: bold; /* Bold on hover and when active */ } .separator { cursor: default; padding: 0; } .link-container { margin: 0px 0px; } .description-text { padding: 25px 0px; /* Margin for description texts */ } About open data|Download Information about open data releases from CERN experiments ALICE ATLAS CMS LHCb Download available databases from experiments ALICE ATLAS CMS LHCb OPERA PHENIX function openEvents(evt, eventName) { var i, tabcontent, tablinks; tabcontent = document.getElementsByClassName("tabcontent"); for (i = 0; i < tabcontent.length; i++) { tabcontent[i].style.display = "none"; } tablinks = document.getElementsByClassName("tablinks"); for (i = 0; i < tablinks.length; i++) { tablinks[i].className = tablinks[i].className.replace(" active", ""); } document.getElementById(eventName).style.display = "block"; evt.currentTarget.className += " active"; } // Auto-click on the first tab to show past events by default on page load document.addEventListener("DOMContentLoaded", function() { document.getElementsByClassName("tablinks")[0].click(); });'
