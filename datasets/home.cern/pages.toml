["https://home.cern/events/science-gateway-exhibitions-training-3"]
title = "Science Gateway exhibitions training | CERN"
description = "Enthusiastic to help visitors Discover CERN"
full_description = "Events Event Monday 3 Mar/25 13:00 - 15:00 (Europe/Zurich) Import to my calendar Science Gateway exhibitions training Go to Indico Event Where: Meet at the Guides space (bdg 86) Enthusiastic to help visitors Discover CERN? Want to accompany them on a journey Back to the Big Bang? Passionate about all things Quantum? Discover the 3 new exhibition spaces in Science Gateway. Learn about how to encourage visitors to explore the exhibits and help empower them to make their own deductions, telling a few CERN stories along the way. It’s perhaps an opportunity to change some vocations, to help a broad spectrum of public engage with science and have fun. This training prepares you for guiding in the exhibition areas of Science Gateway, covering topics such as asking open questions to encourage exploration and some basic accessibility dos and don’ts. This is not a complete explanation of all the exhibition content and prospective guides will need to spend some additional time familiarising themselves with exhibits in the area they chose to guide. Pre-requisites - ideally you will have followed the Science Communication course for guides and the Building information & Safety course before taking this training. But this is not obligatory, particularly in the run up to opening when all courses begin. You should be at ease communicating in either English or French. A minimum level of French is recommended, because of the number of local visitors expected, but it is not obligatory. The number of participants per training is limited to 24. Therefore, should you not be able to join, please cancel your participation or inform us as soon as possible. The minimum number of participants to launch the training is 7, otherwise the training will be cancelled. Other Events Monday 3 Mar/25 11:00 - 12:30 (Europe/Zurich) Lab workshop training: Magnet Challenge Event Meet outside Science Gateway Reception Monday 3 Mar/25 11:00 - 12:00 (Europe/Zurich) Visit point training: AVC Event CERN Monday 3 Mar/25 13:30 - 15:30 (Europe/Zurich) Science show training: Mysteries of Matter Event Meet outside Science Gateway Reception View all events"
