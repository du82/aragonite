["https://home.cern/events/first-massive-black-holes-recent-discoveries-and-open-questions"]
title = "The first massive black holes: recent discoveries and open questions | CERN"
description = "The presence of massive black holes in the first galaxies has been predicted theoretically for many years. Until the launch of the space telescope JWST the bulk of observational data hinged on very bright sources — luminous quasars — detected about one billion years after the Big Bang."
full_description = "Events Event Wednesday 5 Mar/25 14:00 - 16:00 (Europe/Zurich) Import to my calendar The first massive black holes: recent discoveries and open questions Go to Indico Event Where: 4/3-006 at CERN The presence of massive black holes in the first galaxies has been predicted theoretically for many years. Until the launch of the space telescope JWST the bulk of observational data hinged on very bright sources — luminous quasars — detected about one billion years after the Big Bang. Now a large number of fainter sources, candidate active massive black holes, have been identified, some at much earlier cosmic times. The extent of the population of potential massive black holes as well as their peculiar properties in terms of spectral distribution and compactness of the host galaxies challenge standard approaches. I will first discuss the challenges of interpreting these observations and comparing them to theoretical models. I will then connect massive black holes observed via their electromagnetic emission to those that can be detected via emission of gravitational waves: merging massive black holes. Other Events Wednesday 12 Mar/25 14:00 - 16:00 (Europe/Zurich) Modern aspects of quantum physics and topology Event CERN Wednesday 19 Mar/25 14:00 - 15:00 (Europe/Zurich) Talk by David Spergel Event CERN Wednesday 26 Mar/25 14:00 - 16:00 (Europe/Zurich) Talk by Luciano Maiani Event CERN View all events"
year_published = 2025
