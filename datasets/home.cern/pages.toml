["https://home.cern/events/science-show-training-mysteries-matter"]
title = "Science show training: Mysteries of Matter | CERN"
full_description = '''Events Event Monday 3 Mar/25 13:30 - 15:30 (Europe/Zurich) Import to my calendar Science show training: Mysteries of Matter Go to Indico Event Where: 82 at Meet outside Science Gateway Reception Are you excited about science? Are you happy to stand on a stage in front of a big crowd? Do you want to do some cool experiments? Then become a science show presenter! What is a science show? CERN's science shows are interactive demonstrations in front of an audience of up to 400 participants. They present various topics related to CERN - and beyond. The science shows are guided by scripts - but they do not need to be learnt off by heart. What is "Mysteries of Matter" about? Come and marvel at simple and entertaining experiments, often bordering on the magical, which demonstrate different states of matter and magnetism in a fun way. Break a rubber tube with a hammer? Levitate a magnet? It's not magic, it's science! This science show Mysteries of Matter explores the world of matter and different states of matter, including plasma and superconductors. Science show Mysteries of Matter is accessible as of 6 years old and lasts about 45 minutes. What will the training be like? The training will be in English and will last 2 hours. This includes: Overview of safety and access Presentation of resources available Overview of the show script and experiments Trying out experiments and Q&A You will also need to watch the "Mysteries of Matter" Show preferably during the following week. All essential resources for this training can be accessed through SCIENCE SHOWS | CERN Guides. Additional training requirements:You don't need to have any other courses already done before joining the training. However, before performing this science show as a primary presenter, you will also be required to pass the following courses: Cryogenic Safety: Awareness (online) Radiation Protection: Awareness (online) Cryogenic Safety: Fundamentals (classroom course, 2.5 hours) Science Gateway Facilities training for guides (1 hour) If you cannot attend, please cancel your participation or inform us as soon as possible. (In case you arrive late call Laura: +4175 411 17 75) Other Events Monday 3 Mar/25 11:00 - 12:30 (Europe/Zurich) Lab workshop training: Magnet Challenge Event Meet outside Science Gateway Reception Monday 3 Mar/25 11:00 - 12:00 (Europe/Zurich) Visit point training: AVC Event CERN Monday 3 Mar/25 13:00 - 15:00 (Europe/Zurich) Science Gateway exhibitions training Event Meet at the Guides space (bdg 86) View all events'''
