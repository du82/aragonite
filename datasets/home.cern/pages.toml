["https://home.cern/news/news/computing/international-geneva-celebrates-international-year-quantum"]
title = "International Geneva celebrates the International Year of Quantum | CERN"
description = "Panel including representatives of permanent missions in Geneva (Italy, Mexico, Kenya, Vanuatu, Slovenia, India and the Kingdom of Saudi Arabia) exploring the key themes of quantum science and technology and its impact on humanity. (Image: CERN) On 21 February 2025, the Geneva Conservatory of Music welcomed over 100 members of the International Geneva community to celebrate the launch of the International Year of Quantum Science and Technology (IYQ), following its official inauguration at UNESCO Headquarters in Paris earlier this month. Co-organised by the Open Quantum Institute (OQI) at CERN and UNESCO, the launch of the IYQ in Geneva was an officially recognised global IYQ event, designed to raise awareness within the local international community of policymakers, diplomats, scientists and civil society of the societal impact of quantum technology. International Geneva is a renowned global hub for international scientific diplomacy and therefore serves as the ideal platform for shaping a shared vision for quantum technology development and ensuring that its benefits reach communities all over the world, particularly in under-resourced regions. Key themes explored during the celebration included equitable access to quantum technology, open science, capacity building, education and bridging the digital divide. “International cooperation is at the heart of what we do at CERN,” emphasised Enrica Porcari, Head of CERN’s IT department, during her opening remarks. “In particular, with our OQI programme, we collaborate with a range of stakeholders from academia, the private sector, diplomacy, industry and education to anticipate the impacts of the technology before they are realised and to ensure that it is developed for the benefit of all.” Part of the collaborative dialogue between OQI and UNESCO, the Geneva launch of the IYQ underscored the need for global collaboration and anticipating the multilateral governance structure that will be needed to develop sustainable and inclusive quantum technology. Throughout the year, OQI at CERN will lead the organisation of key events and activities worldwide, including regional events, hackathons and the Quantum Diplomacy Game, which will be played across several continents. At CERN, a dedicated events season will allow local audiences to dive deep into the quantum world and appreciate how fundamental research can foster societal impact through its technological implementations.  More information about CERN events can be found at: https://visit.cern/events As an officially recognised global event of the IYQ, this event was made possible thanks to the support of all IYQ partners."
full_description = "News News Topic: Computing Voir en français International Geneva celebrates the International Year of Quantum Hosted in the historical venue of the Geneva Conservatory of Music, the event brought quantum technologies on stage for the local and global community 25 February, 2025 | By Alexia Yiannouli Panel including representatives of permanent missions in Geneva (Italy, Mexico, Kenya, Vanuatu, Slovenia, India and the Kingdom of Saudi Arabia) exploring the key themes of quantum science and technology and its impact on humanity. (Image: CERN) On 21 February 2025, the Geneva Conservatory of Music welcomed over 100 members of the International Geneva community to celebrate the launch of the International Year of Quantum Science and Technology (IYQ), following its official inauguration at UNESCO Headquarters in Paris earlier this month. Co-organised by the Open Quantum Institute (OQI) at CERN and UNESCO, the launch of the IYQ in Geneva was an officially recognised global IYQ event, designed to raise awareness within the local international community of policymakers, diplomats, scientists and civil society of the societal impact of quantum technology. International Geneva is a renowned global hub for international scientific diplomacy and therefore serves as the ideal platform for shaping a shared vision for quantum technology development and ensuring that its benefits reach communities all over the world, particularly in under-resourced regions. Key themes explored during the celebration included equitable access to quantum technology, open science, capacity building, education and bridging the digital divide. “International cooperation is at the heart of what we do at CERN,” emphasised Enrica Porcari, Head of CERN’s IT department, during her opening remarks. “In particular, with our OQI programme, we collaborate with a range of stakeholders from academia, the private sector, diplomacy, industry and education to anticipate the impacts of the technology before they are realised and to ensure that it is developed for the benefit of all.” Part of the collaborative dialogue between OQI and UNESCO, the Geneva launch of the IYQ underscored the need for global collaboration and anticipating the multilateral governance structure that will be needed to develop sustainable and inclusive quantum technology. Throughout the year, OQI at CERN will lead the organisation of key events and activities worldwide, including regional events, hackathons and the Quantum Diplomacy Game, which will be played across several continents. At CERN, a dedicated events season will allow local audiences to dive deep into the quantum world and appreciate how fundamental research can foster societal impact through its technological implementations. More information about CERN events can be found at: https://visit.cern/events As an officially recognised global event of the IYQ, this event was made possible thanks to the support of all IYQ partners. UNESCO Related Articles For Women in Science international rising tal... At CERN News 13 April, 2018 UNESCO: World Science Day for Peace and Devel... At CERN News 10 November, 2014 Celebrating science for peace At CERN Opinion Rolf Heuer 7 July, 2014 View all news Also On Computing Computer Security: 2025 – Plugging holes Computing News 27 February, 2025 Computer Security: When free+free becomes cos... Computing News 11 February, 2025 Computer Security: Don’t let your data walk a... Computing News 30 January, 2025 Computer Security: Are you a team player? Computing News 13 January, 2025 It’s beginning to look a lot like Quantum Computing Opinion Enrica Porcari 13 December, 2024 Computer Security: A security balancing act Computing News 5 December, 2024 Computer Security: Free croissants for everyo... Computing News 26 November, 2024 Computer Security: Security Rules revised Computing News 11 November, 2024 Computer Security: 2FA – 2 Fine Astuces Computing News 31 October, 2024 View all news"
