to witness this relationship being reinforced today. The Romanian seat in CERN Council Chamber where the delegates from CERN Member States attend the Council meetings. (Image: Maximilien Brice/CERN) Bilateral contacts began back in 1991, when a scientific and technical cooperation agreement was signed between CERN and the Government of Romania, establishing the legal framework for later developments. Aspiring to become a full-fledged Member State and thus to contribute fully also to the governance of the Laboratory, Romania submitted its formal application to join the Organization in April 2008. The Agreement granting Romania the status of Candidate for Accession came into force on 12 November 2010. Romania's scientific community at CERN has grown over the years and currently numbers around a hundred visiting scientists. Romania has particularly strong presence in the LHC experiments ATLAS, ALICE and LHCb. Romanian researchers and engineers also work at DIRAC and n_TOF at the Proton Synchrotron (PS), on the NA62 experiment at the Super Proton Synchrotron (SPS), and at the ISOLDE facility. Romania is also active in the Worldwide LHC Computing Grid and takes full advantage of technology transfer opportunities offered by CERN, notably through membership of the HEPTech network. The admission of Romania as a Member State brings an end to the status of Candidate for Accession, which was created by the CERN Council in 2001. This status was intended to allow countries wishing to become full Member States of the Organization a period of progressive scientific and financial integration. CERN now offers two statuses as part of its plans to encourage scientific and geographical enlargement. The statuses Associate Member State and Associate Member State in the pre-stage to Membership (for those countries who wish to become full Member States in the long term) were created in June 2010 and are also open to non-European countries. The twenty two Member States of CERN (Image: Cinzi