description = "This course is mandatory for any CERN Guide signing up for activities taking place in CERN Science Gateway : exhibitions, lab workshops and science shows."
full_description = "Events Event Wednesday 5 Mar/25 11:00 - 12:00 (Europe/Zurich) Import to my calendar Science Gateway Facilities Training Go to Indico Event Where: 86/R-001 at CERN This course is mandatory for any CERN Guide signing up for activities taking place in CERN Science Gateway : exhibitions, lab workshops and science shows. It can be followed before or after activity-specific trainings but before signing up for any activity in the Science Gateway. In one hour, you will visit Science Gateway spaces, understand how visitor flow works, learn how to react in case of evacuation or technical problem etc. Join the Science Gateway red jacket team ! The meeting point will be at the CERN Guides Space (building 86), facing the south tube of Science Gateway at the end of Esplanade des particules. The number of participants per training is limited to 15. Therefore, should you not be able to join, please cancel your participation or inform us as soon as possible. Other Events Monday 3 Mar/25 11:00 - 12:00 (Europe/Zurich) Visit point training: AVC Event CERN Monday 3 Mar/25 11:00 - 12:30 (Europe/Zurich) Lab workshop training: Magnet Challenge Event Meet outside Science Gateway Reception Monday 3 Mar/25 13:00 - 15:00 (Europe/Zurich) Science Gateway exhibitions training Event Meet at the Guides space (bdg 86) View all events"
