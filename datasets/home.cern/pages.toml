["https://home.cern/fr/about/what-we-do"]
title = "Quelles sont nos recherches ? | CERN"
full_description = "(Image: CERN) Quelles sont nos recherches ? Quels sont nos domaines de recherche ? La physique des particules est la raison d’être du CERN, mais le programme de physique du Laboratoire est beaucoup plus large, allant de la physique nucléaire à celle des hautes énergies, en passant par les études sur l'antimatière et les effets des rayons cosmiques sur la formation des nuages. Sommes-nous arrivés au bout du chemin dans notre compréhension de la Nature ? Loin de là. Il reste encore beaucoup à apprendre sur le boson de Higgs, et beaucoup d’énigmes à résoudre pour comprendre comment et pourquoi la matière est ce qu’elle est. Notre contribution à la société Les avancées scientifiques du CERN permettent de repousser les frontières de la technologie et ont par conséquent des retombées positives sur la société à l'échelle mondiale. Bien que le Laboratoire ait pour mission principale de se consacrer à la recherche fondamentale en physique des particules, il a également pour mandate former la prochaine génération de scientifiques et de rassembler les nations. Comment rassembler les nations ? Le CERN est un modèle de collaboration internationale ouverte et inclusive. Le Laboratoire rassemble les communautés scientifiques du monde entier, et transcende les barrières politiques pour amener des cultures différentes à travailler ensemble à un objectif commun. Le CERN a été un pionnier de la collaboration scientifique européenne, et a contribué au développement d'organismes œuvrant dans des domaines aussi variés que l'astronomie et la biologie. Comment inspirer les scientifiques de demain ? Le CERN offre un environnement exceptionnel pour la formation – un creuset fertile et stimulant de personnes et d'idées permettant aux physiciens, ingénieurs et techniciens en début de carrière d'accroître leurs compétences. En outre, le CERN attire un public venu du monde entier au travers d'activités pédagogiques destinées aux élèves et aux enseignants, ainsi que par des actions de communication grand public."
year_published = 2025
