full_description = "(Image: CERN) science computing data centre The CERN Data Centre CERN Data Centre At the heart of CERN’s infrastructure The CERN Data Centre is the heart of CERN’s entire scientific, administrative, and computing infrastructure. All services, including email, scientific data management and videoconferencing use equipment based here. The 450 000 processor cores and 10 000 servers run 24/7. Over 90% of the resources for computing in the Data Centre are provided through a private cloud based on OpenStack, an open-source project to deliver a massively scalable cloud operating system. Dashboard of key numbers from the CERN Data Centre (live) Take an immersive trip through the CERN Data Centre Acrobatic drone footage by world champion Chad Nowak provides a glimpse of the CERN Data Centre (Video: Chad Nowak/CERN)"
