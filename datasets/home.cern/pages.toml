["https://home.cern/about/what-we-do"]
title = "What we do | CERN"
full_description = "(Image: CERN) What we do What are our areas of research? CERN's main focus is particle physics – the study of the fundamental constituents of matter – but the physics programme at the laboratory is much broader, ranging from nuclear to high-energy physics, from studies of antimatter to the possible effects of cosmic rays on clouds. Have we reached the end of the road in understanding nature? Far from it. There is still much to learn about the Higgs boson, and many other puzzles remain about how and why matter in the Universe is the way it is. How do we help society? The scientific advancements of CERN push the frontiers of technology, which has a positive impact on society globally. Although the core mission of the Laboratory is fundamental research in particle physics, it also has a remit to train the next generation of scientists and to bring nations together. The transfer of CERN technologies and expertise to society is an integral part of these activities, providing novel solutions in many fields. How do we bring nations together? CERN is a model for open and inclusive international collaboration. The Laboratory unites scientific communities of all nations, overcoming political barriers to bring different cultures together to work towards a common goal. CERN was the prototype for scientific collaboration in Europe, and has given rise to organisations with remits ranging from astronomy to biology. How do we inspire the scientists of tomorrow? CERN offers a unique environment for training – a rich and stimulating melting pot of people and ideas giving early-stage physicists, engineers and technicians an exceptional opportunity to hone their skills. In addition, through CERN’s education activities for students and educators as well as outreach initiatives, the Laboratory engages with citizens across the globe."
