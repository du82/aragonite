["https://home.cern/about/how-accelerator-works"]
title = "How an accelerator works | CERN"
full_description = "How an accelerator works Electric fields and radiofrequency cavities accelerate particles inside accelerators, while powerful magnets focus or steer the particle beams Some shots of the SPS (Image: CERN) Accelerators were invented in the 1930s to provide energetic particles to investigate the structure of the atomic nucleus. Since then, they have been used to investigate many aspects of particle physics. Their job is to speed up and increase the energy of a beam of particles by generating electric fields that accelerate the particles, and magnetic fields that steer and focus them. An accelerator comes either in the form of a ring (a circular accelerator), where a beam of particles travels repeatedly round a loop, or in a straight line (a linear accelerator), where the particle beam travels from one end to the other. At CERN a number of accelerators are joined together in sequence to reach successively higher energies. The type of particle used depends on the aim of the experiment. The Large Hadron Collider (LHC) accelerates and collides protons, and also heavy lead ions. One might expect the LHC to require a large source of particles, but protons for beams in 27-kilometre ring come from a single bottle of hydrogen gas, replaced only twice per year to ensure that it is running at the correct pressure. How to accelerate protons In the first part of the accelerator, an electric field strips hydrogen atoms (consisting of one proton and one electron) of their electrons. Electric fields along the accelerator switch from positive to negative at a given frequency, pulling charged particles forwards along the accelerator. CERN engineers control the frequency of the change to ensure the particles accelerate not in a continuous stream, but in closely spaced “bunches”. Radiofrequency (RF) cavities These are specially designed metallic chambers, spaced at intervals along the accelerator. They are shaped to resonate at specific frequencies, allowing radio waves to interact with passing particle bunches. Each time a beam passes the electric field in an RF cavity, some of the energy from the radio waves is transferred to the particles, nudging them forwards. It’s important that the particles do not collide with gas molecules on their journey through the accelerator, so the beam is contained in an ultrahigh vacuum inside a metal pipe – the beam pipe. Radiofrequency (RF) cavities Various types of magnet These serve different functions around a circular accelerator. Dipole magnets, for example, bend the path of a beam of particles that would otherwise travel in a straight line. The more energy a particle has, the greater the magnetic field needed to bend its path. Quadrupole magnets act likes lenses to focus a beam, gathering the particles closer together. Collisions at accelerators can occur either against a fixed target, or between two beams of particles. Pulling together: Superconducting electromagn... Particle detectors These are placed around the collision point to record and reveal the particles that emerge from the collisions. How a detector works"
