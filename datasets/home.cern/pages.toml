title = "How to contact us | CERN"
full_description = "How to contact us Find someone at CERN If you have a CERN account and you know the name of the person you wish to speak to, you can find their contact details in the CERN Phonebook. Otherwise try the CERN telephone directories and switchboard on +41 (0) 22 76 761 11. CERN Community Support Centre (operated by the Service Desk) For the Registration service, access cards, professional visitors cards, visitors' cards with a guarantor, dosimetry distribution and biometry enrolment, please contact: CERN Community Support Centre, Building 33. Open 7.00 a.m. – 6.30 p.m. Geneva time, on working days. Raise a ticket through the Service Portal, send an email to service-desk@cern.ch, call them on +41 (0) 22 76 77777 or visit them or their website. Service Desk For questions about or technical problems with CERN-related services, such as your CERN account, or for internal administrative issues, please contact: CERN Service Desk, Building 33. Open 7.00 a.m. – 6.30 p.m. Geneva time, on working days. Raise a ticket through the Service Portal, send an email to service-desk@cern.ch, call them on +41 (0) 22 76 77777 or visit them. Visitor reception (Science Gateway) Opening hours: Tuesday - Sunday from 8:30 a.m. to 5:30 p.m. (closed on Mondays and on a few exceptional days; check opening days here). For general enquiries, speak to reception on +41 (0) 22 76 776 76 or send them an email: cern.reception@cern.ch (operating from Monday to Friday). Visits service Email: visits.service@cern.ch To find out how to visit CERN, please see the following link. Press office For media requests only: +41 (0) 22 767 34 32 or +41 (0) 22 767 21 41 Email: press.office@cern.ch CERN Press Office CH-1211 Geneva 23 Switzerland Journalists who have organised a visit to CERN will be welcomed at reception (building 33). Ask for the press office. Postal addresses As CERN is on the border between France and Switzerland it has two official postal addresses: For Switzerland For France CERN 1211 Geneva 23 Switzerland Organisation Européenne pour la Recherche Nucléaire 01631 CERN CEDEX France Recruitment Want to apply to a job at CERN? See the CERN jobs website for all information about CERN careers and the application process. Website Queries or issues with the CERN website? Contact the web team through the Service Portal."
