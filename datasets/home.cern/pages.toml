["https://home.cern/news/news/knowledge-sharing/official-launch-quantum-year"]
title = "Official launch of the Quantum Year | CERN"
description = "During the inauguration of the International Year of Quantum Science and Technology on 4 February, Simona-Mirela Miculescu, President of the 42nd session of the General Conference of UNESCO, mentioned CERN in her opening remarks as an example of science diplomacy and international collaboration. (Image: Alexia Yiannouli/CERN) The United Nations has declared 2025 the International Year of Quantum Science and Technology (IYQ). Kicking off about 100 planned events worldwide was an opening ceremony on 4 February at the UNESCO headquarters in Paris. Enrica Porcari, Head of CERN’s Information Technology department, attended the opening ceremony: “What matters is how much the planned initiatives will move the needle towards a broader public awareness about the profound implications that quantum science and technology already have and, most importantly, will soon have on society.” The CERN-based Open Quantum Institute (OQI) is a participating partner in the IYQ and a leading project coordinator for key events around Geneva throughout the year. Quantum is also the central theme for CERN’s 2025 public events season in CERN Science Gateway, supported by the CERN & Society Foundation. The public events season begins with De Temps en Temps on 11 February, the International Day of Women and Girls in Science. Physicist Yasmine Amhis from the LHCb experiment and the DoniSSi string quartet invite you to explore the mysteries of time in all its facets. Find out more and register here: https://indico.cern.ch/e/detempsentemps and discover the full programme here: https://visit.cern/events."
