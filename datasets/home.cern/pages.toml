e December 2020 on accelerator technology R&D and its applications. As an Associate Member State, Brazil is entitled to appoint representatives to attend meetings of the CERN Council and the Finance Committee. Its nationals are eligible to apply for limited-duration staff positions and CERN’s graduate programmes, and its industry is entitled to bid for CERN contracts, increasing opportunities for industrial collaboration in advanced technologies. International relations Related Articles Collaboration with CERN – an asset for scient... Knowledge sharing News 24 May, 2023 CERN and SESAME engage with Bahrain Knowledge sharing News 9 March, 2023 CERN fundraising effort contributes to aiding... At CERN News 4 November, 2022 View all news Also On At CERN The Prime Minister of Luxembourg visits CERN At CERN News 28 February, 2025 CERN invites photographers to explore the col... At CERN News 26 February, 2025 CERN Science Gateway welcomes its 500 000th v... At CERN News 24 February, 2025 International Day of Women and Girls in Scien... At CERN News 11 February, 2025 Swiss artist Amanda E. Metzger selected for t... At CERN News 30 January, 2025 Strengthening fire and rescue collaboration At CERN News 27 January, 2025 Happy 2025 to the CERN community! At CERN Opinion Fabiola Gianotti 17 January, 2025 Happy 2025 from CERN At CERN News 6 January, 2025 CERN highlights in 2024 celebrating 70 years At CERN News 20 December, 2024 View all news"
