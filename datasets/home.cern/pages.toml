full_description = '''Press Room For our latest news, follow @CERNpress account on Twitter. Sign up to receive our press releases. CERN 70 MEDIA KIT 2024 FCC Study Media Kit 2024 Latest Media News CERN invites photographers to explore the col... At CERN News 26 February, 2025 Swiss artist Amanda E. Metzger selected for t... At CERN News 30 January, 2025 CLOUD experiment resolves puzzle of new aeros... Physics Press release 4 December, 2024 CERN signs long-term solar power agreements Engineering News 29 November, 2024 CERN launches Resonance, a new arts collabora... At CERN News 28 November, 2024 CERN Council selects Mark Thomson as next Dir... At CERN Press release 6 November, 2024 Estonian flag raised at CERN At CERN News 17 October, 2024 Particle physicists chart a course to the fut... Physics Press release 11 October, 2024 Blowing out 70 candles: CERN celebrates seven... At CERN Press release 1 October, 2024 View all media news Media kits for journalists Media kits Resources Our material can be used on the condition that it is properly credited to CERN and that you agree to our terms of use. If you have any question related to our copyright rules, please contact us. If you are looking for a specific image and you cannot find it here, please search the CERN Document Server (CDS) database or the CERN videos database. World Wide Web Physics Computing At CERN View all resources by topics Media Visits Backstage of Swiss RTS TV show "la puce à l'oreille" filmed at CERN Control Centre with Bertrand Piccard as main guest. (Image: CERN) CERN welcomes a large number of worldwide media. To have your media visit organised on the CERN site, you should first contact and obtain permission from the CERN Media and Press Relations team at least four weeks in advance. We will only accept visits from media that have a clear mandate with a broadcaster, publication or agency. The visits take place from Monday to Friday. Media with no mandate are free to book a visit with the CERN public Visits Service. During LHC operation, media visits underground are no longer possible. However, our team can organize visits on the CERN site above ground and arrange for interviews with scientists. Since the underground facilities are not accessible, we advise Visual Media to use our stock footage on the tunnel and the detectors. If you are working at CERN and have questions regarding medias, please consult The Press Office and You. Disclaimer The CERN laboratory is a working site: your visit will be subject to safety conditions. Before your visit, please read the liability waiver regarding safety on site. Upcoming Media Events FAQs FAQ about the High Luminosity LHC CERN answers queries from social media Facts and figures about the LHC View All FAQs Contact Us Arnaud Marsollier Head of Media Relations Sophie Tesauri Senior Press Officer Smaragda Andrikaki Press Officer Anaïs Gerard Press Officer Lidia Dragu Junior Press Officer Sarah Charley US Communications Officer Stephanie Hills UK Communications Officer Email Press Office'''
