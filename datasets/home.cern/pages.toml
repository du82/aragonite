title = "Partnerships | CERN"
full_description = "Partnerships Current partnerships include: Arts at CERN An arts programme that fosters dialogue between artists and scientists, supporting creativity and artistic innovation in the research environment. EU projects Participating in European Union projects strengthens CERN's existing collaborations and creates new links with European universities, laboratories and industrial partners, complementing the main R&D programmes of the Organization. EIROforum EIROforum combines the resources, facilities and expertise of eight of Europe’s largest intergovernmental scientific-research organizations (CERN, EFDA-JET, EMBL, ESA, ESO, ESRF, European XFEL and ILL) that are responsible for infrastructure and laboratories. Knowledge transfer The Knowledge Transfer group at CERN aims to engage with experts in science, technology and industry in order to create opportunities for the transfer of CERN’s technology and know-how. The ultimate goal is to accelerate innovation and maximise the global positive impact of CERN on society. CERN openlab CERN openlab is a public-private partnership between CERN and leading Information and Communication Technology (ICT) companies. Its mission is to accelerate the development of cutting-edge solutions to be used by the worldwide LHC community. Procurement The Procurement and Industrial Services (PI) group acquires supplies and services for CERN, meeting technical, delivery and performance requirements at the lowest possible overall cost. The group ensures balanced industrial return for CERN member states under the organization's procurement rules."
