title = "Directions | CERN"
full_description = '''Directions Addresses CERN has two main sites, one in France and the other in Switzerland. The visitor reception can be found at the Meyrin site in Switzerland. For postal addresses and other contact information, please visit our contact page. Visitor reception CERN Community Support Centre Science Gateway Esplanade des Particules 1 1217 Meyrin Switzerland Building 33 Esplanade des Particules 1 1217 Meyrin Switzerland For information about goods reception, please visit the Site and Civil Engineering (SCE) department's website. Location of the visitor reception: View Larger Map How to get to CERN By plane From Geneva International Airport at Cointrin Taxi: approximately 35 CHF. Public transport: take bus 23, 28 or 57 and get off at "Blandonnet" and then catch tram 18 or bus 68 to the final stop "CERN". See the TPG web site for full details. By train From Geneva railway station at Cornavin (Gare Cornavin) Public transport: take tram 18 to "CERN", which is the final stop. Ticket costs 3 CHF (Ticket "Tout Genève" on the ticket machine). See the TPG web site for full details. By car GPS location Address: 1, Esplanade des Particules, Meyrin, Switzerland Reception: Lat: 46.233058, Long: 6.055692 From the Swiss side Follow "Aeroport", "Lyon" or "Meyrin". When in Meyrin head for "St. Genis" (which is just across the border in France). Before you get to St. Genis, CERN is on the left hand side of the "Route de Meyrin", just before the border crossing. From the French side Follow "Gex" or "St. Genis". When in St. Genis head for the border. CERN is on your right hand side immediately after the border crossing. Once you get here… Registration service Find a building at CERN'''
