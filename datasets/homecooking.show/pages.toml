  Shirley Corriher’s roasted pecan chocolate chip cookies [ link ]From Bakewise by Shirley O. CorriherHere are some gift guides!Samin’s Instagram Gift Guide ThreadSamin’s Twitter Gift Guide ThreadBravetart’s triple oatmeal cookiesFrom BraveTart by Stella ParksAllison’s Grandma’s preacher cookiesOriginal:2 cups sugar1 stick butter1/2 cup milk2 cups oats1 cup coconut (unsweetened)1/2 cup cocoa powder1 tsp vanillaCombine sugar, butter, and milk in a saucepan over medium heat. Bring to a boil and let cook for three minutes. Remove from heat and add remaining ingredients. Dollop onto a parchment lined baking sheet and let set as long as you can wait.Hrishi’s modified version:Substitute 2 cups sugar with:1¼ cups of white sugar, ½ cup of brown sugar (or substitute even more or all white sugar with brown sugar)Add ½ teaspoon of diamond kosher saltSprinkle Maldon Sea Salt on top to finish80’s tangy lemon icebox cookies from Gourmet magazine [ link ]Thanks to Francis Lam, Dorie Greenspan, Zanne Stewart, and Ian Knauer for helping us get to the bottom of this cookie mystery!Coquine’s chocolate chip cookiesWe don’t have a recipe, but you can order them.Flour bakery’s chocolate chip cookiesFrom Pastry Love by Joanne ChangCrumpets Bakeshop Hrishi’s favorite cookie in Los Angeles is the Mocha Chip Cookie with Sea Salt. You can order it here﻿Helen Zaltzman’s gingerbread Beyonce [ link ]


































































  

  
  
                    
                                                                                                                                
                            
            

  


  













































  

  
  
                    
                                                                                                                                
                            
