wn on the grill. Don't move it because it's going to stick at first. Once it has formed a crust, you can move it and get an even browning on both sides. Fig leaf roasted fruitLine a dish with fig leaves and arrange whole or cut fruit on it with a dollop of butter or olive oil. Add a little bit of white wine. Roast the fruit until it is withered and reduced. Serve on a plate next to some meat, some salad, a big toast slathered with cheese, or an omelet. Laurie Ellen Pellicano’s cheese crackers [ link ]Frico and Seedy FricoHeat the oven to 375°F. Cover two large baking sheets with parchment. Combine the cheese and spice. Make 2-tablespoon-sized piles of finely grated hard cheese (or cheese mixed with seeds, black pepper, and/or a pinch of cayenne) on parchment-lined baking sheets. Spread the piles cheese evenly with a fork, leaving 2 inches between each. Bake until the crisps just begin to color, 6 to 8 minutes. Don’t let them fully brown or the cheese will be bitter. Use a spatula to remove the crisps and immediately transfer to paper towels. When cooled, store the crisps in an airtight container for up to two days.Nadiya Hussain’s chicken korma [ link ] Illustration by Mamie Rheingold Hrishikesh Hirway"
