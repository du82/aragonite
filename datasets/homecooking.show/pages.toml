full_description = 'Episode 14: Bittersweet (with Helen Zaltzman) Dec 16 Written By Hrishikesh Hirway We’re wrapping up this pandemic year and our pandemic podcast in a carefully-sealed bag, so as not to let the flavors intermingle with other flavors in your podcast cookie tin. For our cookie-themed episode, we‘ve got chocolate chip cookies, no-bake cookies, and smart cookie Helen Zaltzman (@HelenZaltzman), who tells us about her gingerbread creations. Plus, a Chef Detective mystery about a lost family favorite from an out-of-print magazine.For a transcript of this episode, click here. For more info about Samin’s jam auction, click here. Food ideas discussed in this episode:The Baby BooMake the tiniest chocolate chip cookie.From Emily Weinstein, Distinguished Deputy Food Editor at The New York Times:“I just went on a whole journey to try to capture the size of an idea baby boo in a photo and not sure I did it. To my mind the perfect boo contains a single chip, is bigger than a penny and smaller than a guitar pick. Also my father-in-law has labels he puts on that my sister-in-law designed a million years ago to put on his boo tins. There’s a thousand-word document with pointers on the recipe, but I can’t find it right now. I do know that thinks the ideal scooping implement is a grapefruit spoon and that you should be able to get at least 50 boos on a cookie sheet. He cools them on brown paper supermarket bags (though I don’t know why). “ <img src="https://images.squarespace-cdn.com/content/v1/5e6fc0cefda9b621a4bc8605/1608064478703-ZVPE7V4TOLXW3D23HGNP/Baby+Boo+2.jpg" alt="Baby Boo 2.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5e6fc0cefda9b621a4bc8605/1608064477152-WKUJ01887DRG34SVVZOB/Baby+Boo+1.jpg" alt="Baby Boo 1.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5e6fc0cefda9b621a4bc8605/1608064479888-QML8Z05Y6LZ7OTT7KUTF/Baby+Boo+3.jpg" alt="Baby Boo 3.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5e6fc0cefda9b621a4bc8605/1608064482729-PFGOK7BG7DQPDXSOU984/Baby+Boo+4.jpg" alt="Baby Boo 4.jpg" /> #block-yui_3_17_2_1_1608064275976_7289 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1608064275976_7289 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } Shirley Corriher’s roasted pecan chocolate chip cookies [ link ]From Bakewise by Shirley O. CorriherHere are some gift guides!Samin’s Instagram Gift Guide ThreadSamin’s Twitter Gift Guide ThreadBravetart’s triple oatmeal cookiesFrom BraveTart by Stella ParksAllison’s Grandma’s preacher cookiesOriginal:2 cups sugar1 stick butter1/2 cup milk2 cups oats1 cup coconut (unsweetened)1/2 cup cocoa powder1 tsp vanillaCombine sugar, butter, and milk in a saucepan over medium heat. Bring to a boil and let cook for three minutes. Remove from heat and add remaining ingredients. Dollop onto a parchment lined baking sheet and let set as long as you can wait.Hrishi’s modified version:Substitute 2 cups sugar with:1¼ cups of white sugar, ½ cup of brown sugar (or substitute even more or all white sugar with brown sugar)Add ½ teaspoon of diamond kosher saltSprinkle Maldon Sea Salt on top to finish80’s tangy lemon icebox cookies from Gourmet magazine [ link ]Thanks to Francis Lam, Dorie Greenspan, Zanne Stewart, and Ian Knauer for helping us get to the bottom of this cookie mystery!Coquine’s chocolate chip cookiesWe don’t have a recipe, but you can order them.Flour bakery’s chocolate chip cookiesFrom Pastry Love by Joanne ChangCrumpets Bakeshop Hrishi’s favorite cookie in Los Angeles is the Mocha Chip Cookie with Sea Salt. You can order it here﻿Helen Zaltzman’s gingerbread Beyonce [ link ] Illustration by Mamie Rheingold Hrishikesh Hirway'
