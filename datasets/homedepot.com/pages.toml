["https://homedepot.com/c/gift-cards"]
title = "Gift Cards - The Home Depot"
description = "Shop Home Depot gift cards online and get more done! Whether you need a Home Depot gift card, or one of the many specialty gift cards we stock, we have you covered!"
full_description = "There’s one gift that is guaranteed to fit every time—a gift card from The Home Depot. Home Depot gift cards are the perfect way to give to the Doers in your life. Congratulate a friend on a new home, say “Thank you” to an employee on a job well done, wish a “Happy Birthday” to the DIYer in your life or reward your honey with a little something to help them get through that ‘Honey-do’ list. Available in plastic or eGift Card options, The Home Depot Gift Cards come in a variety of designs. So, you can personalize your gift card for the occasion, be it a wedding, holiday, new home purchase, Birthday or Mother’s/Father’s Day. Redeem your gift card in store or online. There are no fees and your gift card value never expires. The Home Depot Gift Cards are easy to use. Apply it toward the purchase of merchandise at homedepot.com and any of The Home Depot stores for up to the amount displayed. To use your card online, first add selected items to cart. At checkout, under the Payment tab, choose “apply a gift card” and insert your card number and PIN to place your order. Home Depot gift cards can be purchased and redeemed in store or online. If you’re in the store, look for the display with a variety of card designs. You’re sure to find one that works. To purchase The Home Depot Gift Cards we accept VISA, MasterCard, American Express, Discover, PayPal, The Home Depot® Consumer Credit Card, The Home Depot® Pro Xtra Credit Card, and the Home Depot Commercial Card. Once you have purchased a Gift Card, you can reload it with additional funds at any The Home Depot store or online. If you’re wondering how much money is available to spend on your The Home Depot gift card, checking your balance is simple. You may check the available balance in one of two ways: Gift card scams are on the rise and are becoming a serious issue for major retailers and their customers. But, there are some things you can do to avoid falling victim. How do you avoid gift card scams? First off, remember is that no legitimate transaction will require you to pay speciﬁcally with gift cards. The Home Depot gift cards can only be used at The Home Depot stores or on homedepot.com and cannot be used to purchase other prepaid or specialty gift cards. Government agencies such as the IRS, Treasury Department, FBI or local police departments, will not accept any form of gift cards as payment, and would not ask you for gift card information, especially over the phone."
