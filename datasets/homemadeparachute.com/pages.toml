["https://homemadeparachute.com/blog/rush-poetry-cornered/2013/05/burnaby-lougheed"]
title = "Burnaby-Lougheed | Homemade Parachute"
full_description = "Sprawling on the fringes of the GVA In geometric mandate An insulated candidate In between the bright lights And the far unlit electorate Campaigning it all seems so one-sided Resumes all provided The future pre-decided Detached and subdivided In the Translink fare paid zone Nowhere is the voter Or the other voter Or the other voter Or the other voter Or the other voter so alone [Burnaby-Lougheed] (Not seen) In the high school halls (Not seen) In the shopping malls Conform to the party platform or be cast out [Burnaby-Lougheed] (Not seen) On the mountain tops (Not seen) In the coffee shops Be online or be cast out Any honest mistranslation might help to smooth The unattractive truth But the suburbs have no charms to soothe The restless dreams of the power hungry and craven (Except @scronide, he's a charming mofo!) Drawn like hipsters we drift into the city The timeless old Scienceworld attraction Cruising for a latte Lit up like a firefly Just to see a winner on Election Night Some will sell out their teams for small desires Or lose the race to Libs Get caught in unsafe cribs And start to dream of Coquitlam To relax their restless flight from St Lucia Somewhere out of an unverified but holy smokes this transcript from 2005! memory Of lighted streets or quiet Twitter streams..."
