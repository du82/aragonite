["https://homemadeparachute.com/blog/blues-poetry-cornered/2013/11/apache-server"]
title = "Apache Server | Homemade Parachute"
full_description = "Well they screwed up the back end dev in the repo last night now they screwed up his workflow too Down in the conference room they're gettin' ready for a fight gonna see what them JavaScript boys can do Now there's trouble bustin' in from outta RESTful states and the P.M. can't get no relief Gonna be a rumble out on the foosball deck and the QA lead's hangin' on by the skin of her teeth Everything times out, baby, that's a fact But maybe everything that times out someday comes back Switch your caching on fix your CSS with fervor and push it tonight to the Apache server Well I got my specs and tried to pull my requests But I got bugs that no honest dev can fix So I patched what I could, checked it in Firefox And I bought us that upgrade on that virtual box Now our process may have died and our docs may be old but with you forever I'll stay We're goin' out where the market's turnin' to gold so mock up your UI cause the coffee's getting cold and maybe everything times out That's a fact but maybe everything that times out someday comes back Now I been lookin' for a library but it's hard to find Down here it's just JavaScript and PHP and don't get caught on the wrong side of that line Well I'm tired of comin' out on the losin' end So honey last night I found this .git and I'm gonna do a little pull with it Everything times out, baby, that's a fact But maybe everything that times out someday comes back Switch your caching on fix your .htaccess with fervor and push it tonight to the Apache server Push it tonight to the Apache server Push it tonight to the Apache server…"
