["https://homemadeparachute.com/blog/poetry-cornered/2013/06/cachin"]
title = "Cachin’ | Homemade Parachute"
full_description = "Cachin’ Cachin’ Cachin’ Keep testin’, testin’, testin’, Doritos we are ingestin’, Keep them templates testin’ Drupaaaaaaaal! Don’t try to understand it, Just try, catch, var_dump it When you wrote this had you glue sniffed? Man, this function’s regurgitatin’ But some booze will be a-waitin’, A-waiting at the end of my shift. Move ’em on, queue ’em up, Queue ’em up, move ’em out, Move ’em on, queue ’em up Drupaaaaaaaal! Set ’em up, file ’em in File ’em in, push ’it out, Cut it out, file ’em in Drupaaaaaaaal! Cachin’, cachin’, cachin’ Cachin’, cachin’, cachin’ Drupaaaaaaaal! Cachin’, cachin’, cachin’ Though the error log’s a-swollen Keep them servers cachin’ Drupaaaaaaaal! That theme was cobbled together, Hell-bent for leather Wishin’ my iPhone was by my side. All the things I’m missin’, Webkit, love, and kissin’, Are waiting once the buglist does subside… Move ’em on, queue ’em up, Queue ’em up, move ’em out, Move ’em on, queue ’em up Drupaaaaaaaal! Set ’em up, file ’em in File ’em in, push ’it out, Cut it out, file ’em in Drupaaaaaaaal! Keep testin’, testin’, testin’, Acetaminophen we are ingestin’, Keep that module testin’ Drupaaaaaaaal! Don’t try to understand it, Just try, catch, var_dump it Wishin’ my iPhone was by my side. All the things I’m missin’, Webkit, love, and kissin’, Are waiting for this dude to abide… Drupaaaaaaaal! Drupaaaaaaaal!"
