["https://homemadeparachute.com/blog/blues-poetry-cornered/2013/03/adobe-updater-blues"]
title = "Adobe Updater Blues | Homemade Parachute"
full_description = "Get on your knees, you lowly supplicator, Prepare to run the Adobe App Updater, Better make a little prayer, better leave a little offering, Say, got yer soul handy? Time for a proffering. Is that a lousy rhyme? You’ll find a better one, Lots of time left ’fore the first download is done, Now you know what they say, a watched pot never— Whoops! Timeout error, it’s a futile endeavour! Now the updater’s downloaded something to install, A manager for updates, for a manager, you recall, Double click the icon, you’re almost halfway there, Halfway? Well, maybe a third, shy a hair. Now don’t forget these add-ons, they’ll really make you happy, For your browser? And some spyware? They’re really quite face-slappy! Before you proceed, you’d better quit your browser, Don’t want you to see the help forums, Uh, you’re gonna need clean trousers, By now you’re full of regret, we bet— Are you missing Flash yet?"
