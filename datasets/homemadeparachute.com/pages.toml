["https://homemadeparachute.com"]
title = "Homemade Parachute"
full_description = "About this Site There are no analytics Found anywhere on this site, To the dismay of the critics, We removed them utterly, downright The only cookies are fully-baked To us, you remain inscrutable Your pains are private, as are your aches Even your fears, quite uncomputable Almost twenty years, this domain has stood Across three servers, to the current neighbourhood It was handcoded at first, Valid XHTML 1.1, ’member that? Then <?php> for a while it was cursed Through it all, the traffic was flat And even Drupal 8 for a wee little bit Now handcrafted again, no more of that sh•t Time to get back to something fundamental, Easy to write, easy to git done, ’Cause handwriting html Is, improbably, kind of fun! March 4, 2020 in Poetry Cornered Margaret Do you remember punch cards stacked on a college desk Do you remember print outs stacked up so very statuesque Do you remember the compiler in the basement lab Do you remember I thought it was four spaces not a tab By the way didn't I fix that bug? Please excuse me, I really meant to fix that bug So sorry, I really meant to fix that bug Cause you fixed mine Margaret is it too soon to say it’s working And Margaret should we get it to complete once again? I just can't go on pretending I got it the first time you explained Margaret, oh I never thought we’d miss it Though Margaret we’ve been working on it since yesterday noon, We said the code would run forever We’d get that lander onto the Moon Do you remember Skylab in the night with shooting stars Do you remember late night engineering seminars Do you remember Apollo almost reached it’s moment of “NO GO” Do you remember how you skipped information overflow By the way didn't I fix that bug? Please excuse me, I really meant to fix that bug So sorry, I really meant to fix that bug Cause you fixed mine Margaret I just wanna see it work once But Margaret I'm too scared to press the RUN key To hear you've found another infinite loop That bungs up this system logic tree Margaret I'm still trying to fix that routine Margaret it’s much harder now this backtrace’s byzantine Maybe it will prove that we were right Or just prove we need more caffeine (For Amorphia Apparel, who made this awesome shirt by request, and the first part of a proposed musical call, yes, “Hamilton”…) Aug 31, 2017 in Poetry Cornered"
