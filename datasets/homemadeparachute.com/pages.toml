full_description = "Square icons go on every screen Square icons are the boss Square icons on the shiny OS Square icons got no gloss Square icons are the latest thing Square icons take the cake Square icons gonna be everywhere Square icons got nothing fake Sometimes pushing beziers around Sometimes pulling out the rug Sometimes pushing all the buttons Sometimes looking oh so smug It's the power and the glory Getting kicked out of paradise It's a cinderella story They no longer look like dice Square icons got sharp corners Square icons it's not like you can choose Square icons got no woodgrain texture Square icons cut, don't bruise Square icons show no pictures Square icons all the rage Square icons losing all their colour Square icons grey and beige Sometimes building walled gardens Sometimes ripping denim down Sometimes building you an app store Lock you underground It's no old-time religion It's the morph they would skeuo It's the fool at the dev conf Getting paid to play the fool Square icons for every app Square icons give and take Square icons for your own good Square icons, make no mistakes! Square icons sure look heavy handed Square icons by Jan Tschichold Square icons look like Windows Phone Square icons got no soul... [bwaa bwaa bwaaaaa {keyboard solo!}]"
