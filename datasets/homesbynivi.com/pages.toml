["https://homesbynivi.com/about"]
title = "About Nibedita (Nivi) Das | Pleasanton Real Estate"
description = """
Agent Details     
Hi, I’m Nivi Das, an experienced REALTOR® dedicated to helping clients achieve their real estate dreams. Whether you're a first-time homebuyer searching for the perfect home, a seller looking to upsize or downsize, or an investor seeking strategic opportunities, I’m here to be your trusted partner in this exciting journey, connecting you to homes and communities that truly fit your lifestyle.
With over 18 years of expertise in architecture, urban design, and project management, I bring a unique perspective to real estate. Originally from India, I moved to the U.S. in 2003 to pursue dual Master’s degrees in Architecture and Community Planning from Kansas State University. My career as an Urban Designer in Sacramento and the San Francisco Bay Area sharpened my skills in development, market analysis, and community planning. Since transitioning to real estate in 2018, I’ve merged this background with a personalized approach to guide my clients through the buying, selling, or investing process.
My expertise spans design, energy efficiency, location suitability, city policies, and permitting, ensuring that my clients are always well-informed and positioned to succeed in the competitive Bay Area market. From strategic negotiations to smooth escrow processes, my goal is to make your experience seamless, rewarding, and stress-free. I’m committed to building lasting relationships with my clients, offering continued support and guidance well beyond the transaction to ensure long-term satisfaction and success.
Alongside my career, I’m a proud mom to two wonderful daughters, and I have a deep passion for dance and theater, which brings creativity and joy to my everyday life.
Let’s connect and make your real estate goals a reality!
 
MISSION AND PURPOSE 
Connecting You to Homes and Communities That Fit Your Lifestyle. 
CORE VALUES 


Clients First, Always. Prioritizing the needs and goals of clients above all else by providing exceptional service, clear communication, and steadfast advocacy throughout every transaction. 




Innovative Solutions for a Seamless Path to Homeownership or Sale. Leveraging creativity, knowledge, and networks to find innovative solutions for challenges, ensuring every client’s path to homeownership or sale is smooth and rewarding. 




Build Stronger Communities Through Connection and Ethical Practices. Strengthening the community by actively engaging with local organizations, building relationships, and contributing to its growth through ethical and socially responsible practices. 




Trust Built on Transparency. Earning and maintaining trust through transparency, honesty, and a commitment to ethical dealings, creating lasting relationships built on confidence and reliability."""
