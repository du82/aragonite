full_description = "Home Employment Opportunities Careers are made at Johns Hopkins Medicine Explore Careers Our patients come from all over the world — and so do our staff members. They come to be part of a professional and diverse health care team; to work beside the unequaled talent of Johns Hopkins physicians, nurses and providers; and to enjoy extensive benefits and opportunities for personal and professional growth. Explore Careers by Positions From medicine and social work to finance and IT, Johns Hopkins employees get to make a difference every day. Join our team and help provide outstanding care to patients, train the next generation of doctors and nurses, and push the frontiers of biomedical discovery. Leadership Nursing Allied health Administrative and support services Nonclinical professional positions Epic and IT Explore Careers by Entity Have a specific location in mind? From community hospitals to academic medical centers, and from cities to suburbs, Johns Hopkins Medicine has a work environment that’s right for you. Browse opportunities by entity: Johns Hopkins Howard County Medical Center Johns Hopkins All Children's Hospital Johns Hopkins Ambulatory Surgery Centers Johns Hopkins Bayview Medical Center Johns Hopkins Community Physicians Johns Hopkins Health Plans Johns Hopkins Care at Home Johns Hopkins Medicine International Johns Hopkins University School of Medicine Search all job opportunities Sibley Memorial Hospital Suburban Hospital Johns Hopkins Intrastaff The Johns Hopkins Hospital As one of the largest employers in Baltimore, Johns Hopkins — including The Johns Hopkins University and Health System — embraces its role as an economic engine to create lasting opportunities in our community. HopkinsLocal is a firm commitment to leverage our economic power to promote economic growth and investment in Baltimore by hiring city residents. Visit HopkinsLocal Discovering Baltimore The Johns Hopkins Hospital is located in scenic Baltimore, Maryland. Located on the Chesapeake Bay, the city is a melting pot of cultures and neighborhoods, ranging from metal and glass skyscrapers to brick row houses to the famous Inner Harbor. Learn More About Baltimore See More"
