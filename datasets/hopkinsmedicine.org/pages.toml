title = "About Johns Hopkins Medicine"
description = "Together, we will deliver the promise of medicine. The mission of Johns Hopkins Medicine is to improve the health of the community and the world by setting the standard of excellence in medical education, research and clinical care."
full_description = 'Home Improving the Health of the Community and the World window.addEventListener("DOMContentLoaded", () => { const playPauseButton = document.querySelector("#play-pause-button"); const heroVideo = document.querySelector("#hero-video"); playPauseButton.addEventListener("click", () => { if (playPauseButton.classList.contains("paused")) { playPauseButton.classList.remove("paused"); playPauseButton.setAttribute("aria-label", "Pause"); heroVideo.play(); } else { playPauseButton.classList.add("paused"); playPauseButton.setAttribute("aria-label", "Play"); heroVideo.pause(); } }); }); @import url(https://jhmcdn.blob.core.windows.net/custom-snippets/styles/hero-video-about.css); The mission of Johns Hopkins Medicine is to improve the health of the community and the world by setting the standard of excellence in medical education, research and clinical care. Diverse and inclusive, Johns Hopkins Medicine: Educates medical students, scientists, health care professionals and the public Conducts biomedical research Provides patient-centered medicine to prevent, diagnose and treat human illness. 2.8M Johns Hopkins Medicine receives more than 2.8 million patients and nearly 337,000 emergency room visits annually. 931 K With more than 50 care locations, Johns Hopkins Community Physicians receives more than 931,000 patients each year. 164 K Johns Hopkins Home Care treats nearly 164,000 adults and children in Central Maryland annually. Patient Care Locations Headquartered in Baltimore, Maryland, Johns Hopkins Medicine unites physicians and scientists of the Johns Hopkins University School of Medicine with the organizations, health professionals and facilities of The Johns Hopkins Hospital and Health System. Johns Hopkins Medicine has six academic and community hospitals, four suburban health care and surgery centers, over 40 patient care locations, a home care group and an international division, and it offers an array of health care services. View patient care locations Johns Hopkins University School of Medicine Johns Hopkins Medicine integrates the operations and planning of the Johns Hopkins University School of Medicine with the Johns Hopkins Health System and Hospital. From basic to translational to clinical research, Johns Hopkins medical and graduate students, residents and fellows learn from and study with Nobel laureates, Lasker Award winners and National Academy of Science members. Tomorrow’s biomedical research and health care leaders are learning from the best at the Johns Hopkins University School of Medicine today. More about the school Women in Leadership Today at Johns Hopkins Medicine, we see the profound influence of women leaders in every aspect of the fields of medicine and science – from the operating room, to the research laboratory, to the executive suite About Women Leaders The History of Johns Hopkins Medicine Johns Hopkins Medicine has a rich history rooted in philanthropy, diversity, inclusion and a passion for innovation. Read more about the history of Johns Hopkins Medicine More About Johns Hopkins Medicine Fast Facts: Johns Hopkins Medicine Strategic Priorities Our Commitment to the Baltimore Community Quick Links About Baltimore Administrative Offices Branding & Use of Name Careers Community Health Contact Us Diversity and Inclusion Doing Business with Johns Hopkins For the Media HIPAA Make a Gift Maps & Directions News & Publications Patient Safety & Quality Speakers Bureau See More'
