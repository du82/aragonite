description = "Find out how Johns Hopkins Medicine is advancing biomedical research, developing cutting edge treatments and disseminating new discoveries to the world."
full_description = '''Home @import url("https://jhmcdn.blob.core.windows.net/custom-snippets/styles/hero-video.css"); *{ box-sizing: border-box; margin: 0; padding: 0; } Research that Drives Excellence and Discovery window.addEventListener("DOMContentLoaded", () => { const playPauseButton = document.querySelector("#play-pause-button"); const heroVideo = document.querySelector("#hero-video"); playPauseButton.addEventListener("click", () => { if (playPauseButton.classList.contains("paused")) { playPauseButton.classList.remove("paused"); playPauseButton.setAttribute("aria-label", "Pause"); heroVideo.play(); } else { playPauseButton.classList.add("paused"); playPauseButton.setAttribute("aria-label", "Play"); heroVideo.pause(); } }); }); Research at Johns Hopkins Innovative research conducted at Johns Hopkins Medicine is vital to both medical advances and unsurpassed patient care. In the Lab Research begins in the lab, which is why we prioritize lab facilities that drive discovery and advancement in research. Meet Our Research Faculty Our faculty members expand what's possible through biomedical research. Clinical Trials Clinical trials provide important research for a wide range of conditions. Find out more about clinical trials at Johns Hopkins Medicine. Understanding Clinical Trials At Johns Hopkins Medicine, we believe that clinical research is key to improve care for people in our community and around the world. Once you understand more about clinical research, you may appreciate why it’s important to participate—for yourself and the community. Learn More Research Topics At the foundation of Johns Hopkins Medicine is research — from basic research, where scientists study cells and mechanisms, to clinical research that builds on those findings using trials, to translational research that takes information learned from trials to the patient bedside. Browse Research Topics The Latest in Research News Press releases and other breaking news from Johns Hopkins Medicine. Visit Newsroom See More'''
