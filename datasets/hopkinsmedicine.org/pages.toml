["https://hopkinsmedicine.org/som"]
title = "The Johns Hopkins University School of Medicine | Johns Hopkins Medicine"
description = """
Connecting the Best Minds in Science and Patient                            Care"""
full_description = '''Home @import url("https://jhmcdn.blob.core.windows.net/custom-snippets/styles/hero-video-with-dropdown.css"); Connecting the Best Minds in Science and Patient Care Apply to a Program M.D. Program Graduate Programs M.D.-Ph.D. Program Residency & Fellowship Programs Postdoctoral Positions Graduate Clinical Education Continuing Medical Education Pathway Programs Our School of Medicine Community The Johns Hopkins University School of Medicine consistently ranks among the nation’s very best in education. These numbers are important, but we’re more than numbers – we’re a community of seekers and dreamers. Using the latest tools and teachings available to scientists and doctors, we become healers, caregivers, discoverers and inventors. Johns Hopkins Medical Students Bring STEM Activities to Pediatric Patients Medical students from Johns Hopkins University School of Medicine are making a difference in the lives of pediatric inpatients at the Johns Hopkins Children's Center through the TEACH program (Together Educating All Children in Hospitals). Watch the Video Reading Pinocchio and Frankenstein in the Age of Artificial Intelligence Katie Pham, a neuroscience Ph.D. student, considers the stories of Frankenstein and Pinocchio and their relevance to artificial intelligence today. Read More Hands That Speak: Finding Humanity in Neurocritical Care In the new Personomics series of the Biomedical Odyssey blog, a clinical fellow writes about sharing meaningful communication with a patient during critical illness by using American Sign Language, resulting in a profound connection between them. Read More Keeping It Casual SOOTHE (Students Offering Optimism to Help) hinges on the importance of casual conversation, sending medical students to more than six areas of the hospital to talk with patients at their bedsides. Read More School of Medicine Students Form Bonds with Community Members Who Are Chronically Ill Students get to know Baltimore residents beyond the hospital walls. Read More Johns Hopkins Connecting the Community | Asylee Women Enterprise Hear from a fellow Hopkins medical student about their work with Asylee Women Enterprise, and how it has enriched her experience in Baltimore. Watch Now American Medical Association Update Resident Whitney Sambhariya presents a summary of the highlights of the Interim American Medical Association meeting. Read More From Research to Clinic: Regulatory Frameworks for AI in Medicine MD/PhD student Akshaya Annapragada writes about new regulatory frameworks governing the use of AI in the clinic. Read More A Candid Conversation with the Nation’s Doctor: US Surgeon General Vivek Murthy at Johns Hopkins U.S. Surgeon General Vivek Murthy recently joined the Johns Hopkins Medicine Distinguished Speaker Series. In a wide-ranging discussion, Murthy shared his inspiring path to public service and invaluable advice for future health leaders. Read More Case Report: Bedside Matters How can medicine stay true to its Oslerian roots while embracing technology’s advances? Read More Convocation 2024 Help us celebrate the Johns Hopkins University School of Medicine diploma and hooding ceremony for the class of 2024. Congrats on your achievement! Read More I Believe in Us | Johns Hopkins School of Medicine "I Believe in Us" celebrates our deep connections to our school, our community, our work and to each other. Johns Hopkins School of Medicine – where we discover all that we are. Watch Now See More @import url(https://jhmcdn.blob.core.windows.net/custom-snippets/styles/photo-grid.css); Research Saves Lives NIH Funding is a Matter of Life or Death NIH Funds Research That Leads Directly To Cancer Treatments, Clinical Trials NIH-Funded Research Revolutionizes Treatment of Age-Related Hearing Loss ﻿﻿ Tour the Johns Hopkins Baltimore Campuses This video offers prospective applicants a virtual tour of the two main Baltimore teaching hospitals: The Johns Hopkins Hospital and Johns Hopkins Bayview Medical Center. Watch on YouTube - Information About ... Academic Departments & Institutes Alumni Campus Life Diversity Education Programs Faculty Our Student Blog Student Well-Being Student Portal Access jhops.org for email, courses, account information and much more. SciCal Johns Hopkins Science Calendar: A listing of scientific events for the Johns Hopkins community. Academic Kudos Join us in celebrating our community — from faculty to students — on their achievements. View Kudos RESEARCH AND EDUCATION ARE FINELY INTERTWINED Pioneers in Research From basic to translational to clinical research, our medical and graduate students, residents and fellows study with Nobel laureates, Lasker Award winners and National Academy of Science members. In the Lab Research begins in the lab, which is why we prioritize lab facilities that drive discovery and advancement in research. Meet Our Research Faculty Our faculty members expand what’s possible through biomedical research. Experience Baltimore Called “Charm City” for a reason, Baltimore is a place that has a little something for everybody. Baltimore is a spirited city – a unique blend of historic charm, cultural heritage and urban vitality. With hanging out at the Inner Harbor, attending neighborhood festivals, biking to school and more, Johns Hopkins medical students, graduate students and residents have a lot to love about Baltimore. Learn more about living in Baltimore See More'''
