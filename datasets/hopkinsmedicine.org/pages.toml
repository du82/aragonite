description = "Review and find the Johns Hopkins Medicine non-discrimination notice documents for patients."
full_description = "Non-Discrimination Notice LANGUAGE ASSISTANCE I speak... English አማርኛ / Amharic العربية / Arabic မြန်မာ / Burmese ខ្មែរ / Cambodian 中文 / Chinese Farsi Français / French Deutsch / German Ελληνικά / Greek ગુજરાતી / Gujarati Haiti עִברִי / Hebrew हिंदी / Hindi Igbo Asusu / Igbo Italiano / Italian 日本語 / Japanese 한국어 / Korean Ɓàsɔ́ɔ̀-wùɖù-po-nyɔ̀ / KruBassa Polski / Polish Português / Portugese Русский / Russian Español / Spanish Tagalog ภาษาไทย / Thai اُردُو / Urdu Tiếng Việt / Vietnamese èdè Yorùbá / Yoruba English All Johns Hopkins Medicine Entities comply with applicable Federal, State and jurisdictional civil rights laws. Our policies prohibit discrimination, which includes an unfavorable difference in treatment (including bullying, abuse or harassment) of an individual because of their race, color, religion, ethnicity, ancestry, national origin, age, marital status, socioeconomic status, language, physical or mental disability, sex, actual or perceived sexual orientation, gender identity or expression, HIV/AIDS status or on the basis of an association with another individual on account of that individual’s actual or perceived sexual orientation, gender expression or HIV/AIDs status or any other protected status as defined by Federal, State or local law. Johns Hopkins Medicine Entities also provides services such as: Qualified sign language interpreters to assist people to communicate effectively as needed; written information in other formats (large print, audio, accessible electronic formats, other formats) Reasonable accommodations or modifications in their policies, practices and procedures on the basis of disability, unless it would result in undue hardship or fundamental alteration of the program Reasonable accommodations on the basis of sincerely-held religious beliefs that do not cause a substantial burden Language services, such as qualified interpreters and information written in other languages, to people whose primary language is not English. If you need these services, you or your representative may inform a member of your treatment team, such as a nurse, advanced practice practitioner or physician. Interpreter services and JHM designated communication tools are provided free of charge. Organizations that follow this Notice (collectively “Johns Hopkins Medicine [JHM] Entities”) include all locations where Johns Hopkins workforce members provide health care to the public. If you or your representative believe that the Johns Hopkins Medicine Entity where you received services discriminated against you or failed to provide these services based on discriminatory practices, you or your representative may contact the Patient Relations Department (or other appropriate point-of-contact) for the JHM Entity where care was provided to report your concerns. Refer to the JHM Patient Rights and Responsibility website for contact information. You may also file a civil rights complaint with the following Federal Agencies: U.S. Department of Health and Human Services 200 Independence Avenue, SW Room 509F, HHH Building Washington, D.C. 20201 1-800-368-1019, 800-537-7697 (TDD) Complaint forms are available at https://www.hhs.gov/ocr/complaints/index.html U.S. Commission on Civil Rights 1331 Pennsylvania Avenue, NW Washington, DC 20425 Phone: 1-202-376-8128, Voice TTY Relay: 711 Website: https://www.usccr.gov/contact/complaints U.S. Department of Justice, Civil Rights Division, Disability Rights Section Website: https://www.ada.gov/file-a-complaint/ If you receive care in Baltimore City, you may file civil rights complaints with the following agency: Community Relations Commission The Office of Equity and Civil Rights 7 East Redwood Street, 9th Floor Baltimore, MD 21202 Hours: 9 a.m. to 4:30 p.m. Phone: 1-410-396-3143 Email: [email protected] Website: https://civilrights.baltimorecity.gov/community-relations-commission/law If you receive care in Montgomery County, you may also file civil rights complaints with the following agency: Montgomery County Office of Human Rights in the following ways: 21 Maryland Avenue, Suite 330, (3rd floor of the Rockville Library) Rockville, Maryland 20850 Phone: 1-240-777-8450 Email: [email protected] Website: https://www.hhs.gov/civil-rights/index.html Download English Non-Discrimination Notice as pdf. Reviewed: July 26, 2024. See More"
