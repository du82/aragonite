["https://hopkinsmedicine.org/patient-care/johns-hopkins-medicine-request-appointment"]
title = "Schedule an Appointment | Johns Hopkins Medicine"
full_description = "Schedule an Appointment You can schedule an appointment in the following locations: Maryland, Virginia and Washington, D.C. Florida You can also schedule an appointment if you live out-of-state or outside the United States. Canceling or Rescheduling an Appointment If you need to cancel or reschedule an appointment, please do so as soon as possible. If an appointment is canceled at least 48 hours in advance, this enables another patient to make an appointment to see one of our clinicians and start getting the care they need. To cancel or reschedule, please log onto MyChart or call your clinician’s office. Schedule an Appointment in Maryland, Virginia and Washington, D.C. Schedule Online through MyChart Schedule by Phone Schedule Labs and Imaging Schedule Online Through MyChart Many adult and pediatric clinicians offer online appointment scheduling through MyChart for current Johns Hopkins Medicine patients. Anyone who has sought care at a Johns Hopkins Medicine facility in the last few years can activate a MyChart account (If you have not activated your account, learn more about MyChart). For some appointments, you must be an existing patient of the practice or care service to schedule online. Johns Hopkins Community Physicians offers online appointment scheduling for primary care to new patients. Primary Care Johns Hopkins Community Physicians New patients can schedule online. Current patients can schedule online via MyChart School of Medicine - Internal Medicine Current patients can schedule online via MyChart Adult Specialty Care New and follow-up appointments for: Allergy Cardiology Dermatology Otolaryngology (ear, nose and throat) Endocrinology and Diabetes ENTAA care (Allergy, Dermatology and Otolaryngology) Gastroenterology Gynecology and Obstetrics Hematology (some exclusions apply) Immunology Infectious Diseases Nephrology (some exclusions apply) Occupational Therapy Ophthalmology / Optometry (eye care) for most new and return patients Orthopedics / Orthopedic Surgery Pain Treatment Physical Medicine & Rehabilitation (PM&R) PM&R Psychology (for new patients with multiple sclerosis, long COVID and stiff person syndrome) Physical Therapy Plastic and Reconstructive Surgery (some exclusions apply) Speech-Language Pathology (SLP) Surgery (Cardiac, Endocrine, Colorectal, General, Thoracic and Vascular) Urogynecology Urology Follow-up appointments for: Geriatric Medicine (Beacham) JHCP Heart Care Neurology / Neurosurgery Pulmonology Rheumatology Sleep Medicine Schedule your appointment today. If you are looking to schedule an appointment with another department not listed here, please use the phone numbers provided for Maryland, domestic and international residents. Pediatric Specialty Care New and follow-up appointments for: Cardiology Dermatology Endocrinology Infectious Diseases Nephrology Ophthalmology / Optometry (eye care) for most new and return patients Orthopedics / Orthopedic Surgery Otolaryngology (ear, nose and throat) Plastic and Reconstructive Surgery (some exclusions apply) Pulmonology Rheumatology Speech-Language Pathology (SLP) Surgery Urology Follow-up appointments for: Allergy Hematology Immunology Neurology and Neurosurgery Schedule your appointment today. If you are looking to schedule an appointment with another department not listed here, please use the phone numbers provided for Maryland, domestic and international residents. If you are looking to schedule an appointment with another department not listed here, please use the phone numbers provided for Maryland, domestic and international residents. Schedule by Phone If You Live in Maryland If You Live Out-of-State, but Would Like an Appointment in Maryland If You Live Outside the United States If You Live in Maryland Johns Hopkins Medicine provides a wide range of comprehensive and cost-effective health care services. Additionally, Johns Hopkins Community Physicians offers primary care, including internal medicine, obstetrics and gynecology, pediatrics and some specialty care at over 35 convenient locations throughout Maryland. For more information, please visit the Johns Hopkins Community Physicians website. To speak with a Johns Hopkins Medicine representative, please call 410-955-5000 (Adults) or 443-578-3181 (Pediatrics). For existing Johns Hopkins Medicine patients, certain primary care and specialty care appointments are available to schedule online. Find a Doctor Schedule Labs and Imaging You may need to schedule an appointment for certain labs and imaging tests your clinician has ordered for you. Use the links below to find the appropriate department to schedule your appointment with. Radiology/Imaging Studies Labs Schedule an Appointment in Florida Schedule an Appointment Schedule Labs and Imaging Schedule an Appointment Johns Hopkins All Children’s Hospital provides pediatric specialty care as well as obstetrics and gynecology, maternal-fetal medicine and adult cardiology at locations along the west coast of Florida. For more information, please visit https://www.hopkinsmedicine.org/all-childrens-hospital/services. For adults in Florida who seek care from Johns Hopkins Medicine in Maryland, please use this scheduling information. Find a Doctor Scheduling Labs and Imaging You may need an appointment for certain labs and imaging tests your clinician has ordered for you. Use the links below to find out more information. Radiology/Imaging Studies Labs If You Live Out-of-State or Outside the United States If You Live Out-of-State but Would Like an Appointment in Maryland Johns Hopkins USA offers you a single point of contact to assist you with any questions or needs for your medical visit to Baltimore. Your Johns Hopkins USA medical concierge can help you schedule medical appointments, assist you with transportation and accommodation arrangements and prepare you for your visit from out-of-state. To speak with a Johns Hopkins USA representative in person, call 1-855-695-4872 (Monday – Friday, 8 a.m. to 6 p.m. EST). For existing Johns Hopkins Medicine patients, certain primary care and specialty care appointments are available to schedule online. Schedule an Appointment If You Live Out-of-State but Would Like a Pediatric Appointment in Florida Johns Hopkins All Children’s Hospital provides pediatric specialty care as well as obstetrics and gynecology, maternal-fetal medicine and adult cardiology at locations along the west coast of Florida. For more information, please visit https://www.hopkinsmedicine.org/all-childrens-hospital/services. If You Live Outside the United States Johns Hopkins Medicine International pairs you with a medical concierge to arrange all aspects of your medical visit, paying special attention to your personal, cultural and travel-related needs. Johns Hopkins Medicine International can also help arrange your medical appointments, provide language interpretation, financial counseling, assistance with travel arrangements and anything else to help make Johns Hopkins feel as close to home as possible. Schedule an Appointment in Maryland Online or by phone: To speak with a representative in Baltimore in person, please call +1-410-502-7683 (Monday-Friday, 7:30 a.m. to 5:00 p.m. EST-Eastern Standard Time or 12:30 p.m. to 10:00 p.m. GMT-Greenwich Mean Time). Schedule an Appointment in Florida Online or by phone: If you are looking for care at Johns Hopkins All Children’s Hospital in Florida, please reach out to the Johns Hopkins All Children’s Hospital International Patient Services team at 727-767-3023. See More"
