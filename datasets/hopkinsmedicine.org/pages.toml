["https://hopkinsmedicine.org/patient-care/patients-visitors/billing-insurance/no-surprises-act"]
title = "No Surprises Act | Johns Hopkins Medicine"
description = "Learn more about the No Surprises Act and how Johns Hopkins Medicine helps you understand your medical bills."
full_description = "Home Patient Care Patients and Visitors Billing and Insurance No Surprises Act Johns Hopkins Medicine is committed to helping you understand your upcoming health care costs so you can plan for your care. Our section on paying your bill provides several ways to pay and discuss your bill. The federal No Surprises Act became effective Jan. 1, 2022. The law aims to help patients understand health care costs in advance of care and to minimize unforeseen — or surprise — medical bills. LANGUAGE ASSISTANCE I speak... English Español / Spanish العربية / Arabic 中文 / Chinese 한국어 / Korean Русский / Russian No Surprises Act OverviewPatients are protected from receiving surprise medical bills resulting from out-of-network care for emergency services and for certain scheduled services without prior patient consent.Patients who do not have insurance or who are not using insurance to pay for care have a right to receive a good faith estimate of their potential bill for medical services when scheduled at least three days in advance.Individuals with Medicare, Medicare Advantage, Medicaid, Indian Health Services, VA health care, or TRICARE insurance plans are not covered under the No Surprises Act because these federal insurance programs have existing protections in place to minimize large, unforeseen bills.Surprise Medical BillsUnforeseen medical bills can happen when a patient receives emergency or scheduled clinical care or services from a provider or facility that is considered out of network or non-participating by that patient’s insurance plan. These surprise bills are often called balance billing or out-of-network billing.Balance billing occurs when a provider sends a bill to a patient to cover the difference between what the insurance plan agreed to pay the provider and the full cost for a service. Learn more about your rights for balance billing. Maryland-specific balance billing protections: If you are in a health maintenance organization (HMO) governed by Maryland law, you may not be balance billed for services covered by your plan, including ground ambulance services. If you are in a preferred provider organization (PPO) or exclusive provider organization (EPO) governed by Maryland law, hospital-based or on-call physicians paid directly by your PPO or EPO (assignment of benefits) may not balance bill you for services covered under your plan, and they can’t ask you to waive your balance billing protections. If you use ground ambulance services operated by a local government provider who accepts an assignment of benefits from a plan governed by Maryland law, the provider may not balance bill you. If you believe you’ve been wrongly billed, you may contact the Health Education and Advocacy Unit of Maryland’s Consumer Protection Division. Learn more about your rights for balanced billing in Maryland (look for Maryland-specific billing protections).Out-of-network costs happen when a patient receives care from a facility or provider not participating in that patient’s insurance plan. This may result in a higher patient cost than if the patient were seen by an in-network provider or facility.The No Surprises Act will reduce instances where patients face unexpected medical bills due to receiving care from an out-of-network facility or provider during an emergency. Similarly, patients are protected from receiving surprise bills for certain scheduled services for which they could not reasonably know the network status of a provider. For certain scheduled care with out-of-network providers, patients must be given appropriate notice and give approval, where applicable, to be billed for any applicable out-of-network fee or amount.Get a Cost of Care EstimateUninsured and self-pay patients have a right to receive a good faith estimate ahead of scheduled nonemergency health care services. A good faith estimate shows the cost of items and services that are reasonably expected for your health care needs. The estimate is based on information known at the time the estimate was created, and can include costs related to your visit such as medical tests, medications, equipment and hospital fees.Health care providers should give you the estimate in writing at least one day before your medical service if your care has been scheduled at least three days in advance. You may also request an estimate at any time.If you have MyChart, you can use our cost estimator tool to estimate the costs associated with your hospital care. If you do not have MyChart, you can get instructions on how to access the tool as a guest. Learn more about your rights for a good faith estimate.If you have questions related to receiving a good faith estimate, call 844-986-1584or email [email protected].For details about the law, visit the No Surprises Act site from the Centers for Medicare and Medicaid Services.ResourcesEspañolConozca sus derechos como paciente Derechos y protecciones contra las facturas médicas sorpresaInfórmese sobre sus derechos como paciente: Pida una cotización de buena feالعربية / Arabicاعرف حقوقك كمريض ا الحقوق والحماية ضد الفواتير الطبية المفاجئةاحصل على تقدير بحسن نية للتكاليف中文 / Chinese了解您的患者权利 防止意外医疗费用的权利和保护了解您的患者权利 获得诚信估算한국어 / Korean환자의 권리 알기 기습 의료비 청구에 대한 권리와 보호환자의 권리 알기 믿을 수 있는 좋은 견적 받기Русский / RussianЗнайте свои права как пациента Права и средства защиты от неожиданных медицинских счетовЗнайте свои права как пациента Получите достоверный предварительный счет See More"
year_published = 2025
