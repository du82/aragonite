title = "Charges and Fees | Johns Hopkins Medicine"
description = "Find information about estimated charges and fees for the Johns Hopkins Medicine hospital you plan to visit."
full_description = "Home Patient Care Patients and Visitors Billing and Insurance Paying Your Bill Charges and Fees Federal price transparency regulations require hospitals to establish and make public a list of their standard charges for items and services. Patients can use the list of standard charges to compare prices and make informed decisions about their care. In Maryland, the average rates for hospital services — radiology, laboratory, intensive care stay — are regulated by the Maryland Health Services Cost Review Commission (HSCRC), a state regulatory agency. The HSCRC sets average hospital rates on Jan. 1 and July 1 every year. Hospitals outside of Maryland are not restricted by regulation in setting their charges. These hospitals use market information and competitive pricing tools to set rates for services. Download information about estimated charges for the hospital you plan to visit: Johns Hopkins Howard County Medical Center - Last updated July 1, 2024 The Johns Hopkins Hospital - Last updated July 1, 2024 Johns Hopkins Bayview Medical Center - Last updated July 1, 2024 Sibley Memorial Hospital - Last updated July 1, 2024 Suburban Hospital - Last updated July 1, 2024 Johns Hopkins All Children's Hospital - Last updated July 1, 2024 Please note that the use of these files is not an accurate method to estimate the cost of health care, as the actual services you receive may differ from those estimated. You can call the Cost Estimates Assistance Line at 844-986-1584 or email [email protected] for help with cost estimates. Estimate Your Hospital Bill Johns Hopkins Medicine now offers an online tool to help you estimate the hospital fee portion of your bill. The estimates are available for 300 services across our six hospitals. Get Your Estimate Consider these factors that may affect the cost of health careEstimates are subject to changePlease note that cost estimates may change without notice. The actual cost of your procedure may be higher or lower based on factors specific to your case, such as your length of stay in the hospital and the complexity of your medical condition. If you have questions regarding an estimated charge, please contact our billing customer service team.There may be other chargesEstimates reflect hospital charges only. They do not include physician or other provider fees that may be billed separately from the hospital fees. You may receive bills from multiple physicians for their services, including the anesthesiologist, hospitalist, pathologist, radiologist, cardiologist, emergency room physician and other specialists who participate in your care. If you have questions regarding the bill for their services, please contact the individual provider.Hospital charges can fluctuateAlthough Maryland sets hospital rates twice each year, hospital charges are allowed to fluctuate, and specific charges may be different from the average approved rates that cover a larger group of services. So, charges on Maryland hospital bills may be different from the charges in the above fee schedules. This is both allowable and normal, as hospitals adjust charges frequently to comply with other regulations. The Johns Hopkins Hospital and other Maryland hospitals believe it is impractical to update posted charges more than twice per year. See More"
year_published = 2025
clearnet = "https://hopkinsmedicine.org/patient-care/patients-visitors/billing-insurance/pay-bill/charges-fees"
