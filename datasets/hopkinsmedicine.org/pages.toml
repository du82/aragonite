["https://hopkinsmedicine.org/patient-care/locations/find-your-way"]
title = "Find Your Way to Appointments | Johns Hopkins Medicine"
full_description = '''Home Patient Care Our Locations Find Your Way to Appointments with Ease Download the AppLet Us Help You Find Your Way! The Johns Hopkins Find Your Way app is all you need to get to and around the buildings of The Johns Hopkins Hospital and Johns Hopkins Bayview Medical Center. This free app will help you navigate to our hospitals, as well as direct you to key landmarks inside our walls, such as your appointment location, dining options and more. To download and use: Download the free app to your mobile device from the appropriate button below. Follow the pop-up prompts to allow: Alerts and data Bluetooth (must enable for the app to run) App Features Home The app's home screen will take you anywhere you want to go! Use the large blue buttons or the smaller icons along the bottom of the screen to select how you want to use the app. To learn more about features in the Johns Hopkins Find Your Way app, click or swipe left. Take Me to My Location Use the Take Me to My Location feature to get driving or walking directions to your appointment from your home. To do this: Use the search bar to type in your destination, or Use the Locations or Parking buttons to find your desired building, clinic or parking area After you select your location, you will be able to select the navigation app of your choice — Google Maps, Waze or Apple Maps. Take Me to My Location Once you arrive at your location, your street view map will change to a map of the hospital buildings. You can also use this feature for walking directions to: Your appointment location Pharmacies Dining options Restrooms Information desks and more When you have arrived at your destination, you will receive notification that you have arrived. Parking Never lose your car again! Once you have parked your car, tap the Parking icon on the home screen to save your parking spot. When your appointment is over, tap the Parking icon again for directions back to your car. MyChart The Johns Hopkins Find Your Way app also links to your MyChart account. Tap the MyChart option to view appointment information, test results and more. Note: You must have a MyChart account and the app downloaded to use this feature. If you do not have an account, click the "Sign up now!" on the MyChart login page. Find A Doctor Looking for a specialty provider? The Find a Doctor feature allows you to search for providers by last name or location. Make an appointment directly from the app or get driving directions. Health Information Johns Hopkins Medicine has a vast digital library of information on a wide range of conditions, treatments, prevention and caregiving tips. Use the Health Information feature to see the latest articles, or search for a condition, treatment or healthy living tip to learn more. See More'''
