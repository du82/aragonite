["https://hopkinsmedicine.org/patient-care/patients-visitors/billing-insurance/insurance-info"]
title = "Insurance Information | Johns Hopkins Medicine"
description = "Johns Hopkins Medicine participates in a wide range of health plans. Before scheduling an appointment or seeking treatment, please contact your insurance plan to understand your benefits and costs."
full_description = "Home Patient Care Patients and Visitors Billing and Insurance Insurance Information Johns Hopkins providers are participating with many commercial health insurance plans, including many of those offered by the companies listed below. There are exceptions to Johns Hopkins’ participation in these plans based on the insurance product type, employer benefit design, and physician location or specialty. For Bill-Related Questions Call —— 855-662-3017 Insurance Plans We Accept To confirm coverage of your specific physician or provider, please contact the insurer directly. Aetna CareFirst BlueCross BlueShield Cigna Healthcare* First Health Geisinger Health Plan Humana Johns Hopkins Health Plans Kaiser Permanente of the Mid-Atlantic States MultiPlan/PHCS/Beech Street UnitedHealthcare** * No Johns Hopkins Medicine physician, provider or facility participates with the Cigna Connect and Cigna SureFit network plans. **Johns Hopkins physicians and physician groups are not participating with the MDONEX or VAONEX plans, which are offered on the Maryland and Virginia health exchanges. Johns Hopkins physicians and physician groups are also not participating with the Core, Compass, Navigate, Value or Balance plans, which are also offered on state health exchanges. Each Johns Hopkins hospital and member organization has its own accepted insurances. In some community hospitals and clinics, you may receive care from outside private practice providers who may not participate with your insurance plan. There may be other exceptions to the above list, based upon the type of plan, network, provider group or other factors that are specific to each patient. Please contact your insurance company directly to confirm that your Johns Hopkins medical provider is in-network with a specific health plan. All patient cost shares and charges for non-covered benefits are due at the time of service. Please note that your insurance company may not pay for all of your services. For example, you may be required to pay out-of-pocket expenses (such as deductibles, copayments and coinsurance) or you may be required to seek services (such as lab and radiology services) at specific locations/providers. Medicare Coverage Please be advised that Johns Hopkins Medicine hospitals and most Johns Hopkins University physicians participate with Medicare, but we are not contracted with most Medicare Advantage Plans. If your Johns Hopkins Medicine hospital doesn’t participate with a Medicare Advantage Plan, you can use out-of-network benefits if your plan has them. How to Prepare For Your Visit or Admission Talk to your physician Before your admission or appointment, remember to discuss the estimated length of stay and anticipated tests and services with your physician. It’s good to be aware of all the details so that you can check with your insurance provider to understand what will be and what might not be covered. To ease a hospital admission, we will begin the paperwork as soon as your doctor informs us of the admission date. A preadmission coordinator will call you at home to verify basic information such as the name of your employer, your home address and the type of insurance you carry. Please note that your health insurance plan may require you to obtain a referral from your primary care provider before being seen by our specialists. Your physician will send a referral electronically, or you will be given a copy to take during your visit at Johns Hopkins. Our patient access staff will work with your physician’s office to obtain authorization from your insurance carrier when necessary. Talk to your insurer ​Many insurance carriers have coverage limits on room charges and certain services. If you aren’t sure what is covered, please contact your insurance provider to understand your benefits and costs before scheduling an appointment or seeking treatment. Some plans may limit the geographic area in which you can receive care, even for routine services. Your plan may refer to this as a “limited network.” Johns Hopkins may not be part of your plan’s limited network. Don’t forget important documents View which documents to prepare for your visit or admission. To ensure proper billing and prompt payment, please be sure to provide complete information about all of your insurance plans, including Medicare and Medicaid. If applicable, the hospital will bill both your primary and secondary carriers. If you do not know which plan is primary, a financial counselor will be happy to assist you — please call 855-662-3017. If not all insurance information is received at the time of service, the bill will be the responsibility of the patient/guarantor. Estimate Your Hospital Bill Johns Hopkins Medicine now offers an online tool to help you estimate the hospital fee portion of you bill. The estimates are available for 300 services across our six hospitals. Get Your Estimate What Happens After Your Visit After each visit, the Johns Hopkins Medicine facility/member organization will file health insurance claims directly with your primary payer and, if appropriate, your secondary insurance payer. By signing the Agreement for Care Form, you agree that your Johns Hopkins Medicine health care provider can be paid directly by your insurance. If you are not able to pay your bill in full, you may qualify for a payment plan and/or financial assistance. Have Questions About Your Bill? Contact customer service at 1-855-662-3017. Phone Directory Patient/Guarantor Payment Responsibilities Commercial Insurance, Medicare and Medicaid All copayments and charges for non-covered benefits are due at the time of service. Automobile Insurance The hospital will bill auto insurance carriers if you authorize that benefits be paid directly to the hospital. Should this authorization be withheld, the bill will be the responsibility of the patient/guarantor. Self Pay (No Insurance) The hospital requires payment in full and in advance of nonemergency admissions and outpatient services unless you have made other arrangements through the hospital’s financial counseling office. For more information, please contact billing and insurance customer service at 855-662-3017. ﻿﻿ Maryland Health Connection Maryland Health Connection is the state’s health insurance marketplace that makes it easier to shop for, compare and enroll in quality health coverage. We are committed to informing, educating and assisting people in our communities to enroll in quality health coverage. Visit website Watch on YouTube - See More"
year_published = 2025
clearnet = "https://hopkinsmedicine.org/patient-care/patients-visitors/billing-insurance/insurance-info"
