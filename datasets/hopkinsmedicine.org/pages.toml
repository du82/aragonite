["https://hopkinsmedicine.org/patient-care/patients-visitors/billing-insurance/financial-assistance"]
title = "Financial Assistance and Payment Plans | Johns Hopkins Medicine"
description = "If you need help paying your bill for services provided by Johns Hopkins Medicine, you may be eligible for payment plans or financial assistance."
full_description = "Home Patient Care Patients and Visitors Billing and Insurance Financial Assistance and Payment Plans If you need help paying your bill, you may be eligible for a payment plan or financial assistance. In this section: Payment Plans Financial Assistance Billing and Financial Assistance Information Sheet Notice of Physicians Providing Care Payment Plans We recommend that you contact your insurance provider before visiting a hospital, clinic or doctor’s office to find out what your plan covers and if you will be responsible for any part of the payment. To speak with a Cost Estimate representative please call 844-986-1584. Hours of operation are 8:30 am – 4:30 pm Monday - Friday. If you are not able to pay your bill in full, we can help you with a payment plan or you may qualify for financial assistance. In some cases, you may have the option to set up a payment plan based on your income. Contact Customer Service at 443-997-3370 or call toll-free at 855-662-3017 if you are a Johns Hopkins patient. Financial Assistance Johns Hopkins is committed to providing financial assistance to patients who are uninsured, underinsured, ineligible for a government program or otherwise unable to pay for medically necessary care. To speak with a Financial Assistance representative please call 443-997-3067. Hours of operation are 8:30 am - 4:30 pm Monday - Friday. Financial Assistance Eligibility You may qualify for financial assistance if you: Have exhausted all insurance options Have been denied medical assistance or are not eligible Meet other criteria for financial assistance, which is based on information you will be asked to provide regarding your income, assets and outstanding debt To determine if you are eligible, please review the Financial Assistance Policy. Financial Assistance Policy (PFS035) English | Chinese | Farsi | French | Japanese | Korean | Portuguese | Russian | Spanish | Tagalog | Vietnamese Appendix A: Sibley Memorial Hospital Financial Assistance Provisions Specific to Washington, D.C., Regulations English | Chinese | Farsi | French | Japanese | Korean | Portuguese | Russian | Spanish | Tagalog | Vietnamese Appendix B: Johns Hopkins Medicine Financial Assistance Applications Follow these instructions to submit an application (for all care locations except Johns Hopkins Care at Home – see Appendix D): English | Chinese | Farsi | French | Japanese | Korean | Portuguese | Russian | Spanish | Tagalog | Vietnamese Please submit your application according to the instructions. Applications are not accepted in person. After we receive your application, we will notify you whether you meet the initial requirements for financial assistance. You may be asked to provide supporting documents before the final decision on eligibility and the amount of financial assistance is made. If a balance remains after financial assistance is applied to your bill, you will have access to a payment plan. Appendix C: Johns Hopkins Care at Home – Policy Provisions English | Chinese | Farsi | French | Japanese | Korean | Portuguese | Russian | Spanish | Tagalog | Vietnamese Appendix D: Financial Assistance Application for Johns Hopkins Care at Home English | Chinese | Farsi | French | Japanese | Korean | Portuguese | Russian | Spanish | Tagalog | Vietnamese Billing and Financial Assistance Information Sheet Patient Billing and Financial Assistance Information Sheets (Plain Language Summaries) are available for The Johns Hopkins Hospital, Johns Hopkins All Children's Hospital, Johns Hopkins Bayview Medical Center, Howard County General Hospital, Suburban Hospital and Sibley Memorial Hospital: English | Chinese | Farsi | French | Japanese | Korean | Portuguese | Russian | Spanish | Tagalog | Vietnamese To speak to a customer service representative, call toll-free 1-855-662-3017 or 443-997-3370 and select option “0”. Customer service hours are 8:30 am - 4:30 pm Monday - Friday. Notice of Clinicians Providing Care This list (PDF) shows clinicians who can see patients or render services at Johns Hopkins Health System facilities and who are covered by the health system's financial assistance policy. See More"
