full_description = "This page is intended to inform all our customers of terms and conditions (Terms) on which we operate sales service (Services) for the products (Products) on our website (www.horribleguild.com). Please read these Terms in their entirety before using our Services. Registering to our website and/or ordering any Product from it binds you to the following Terms. The site www.horribleguild.com is operated by HORRIBLE GAMES S.r.l., with registered address as Milan, via California, 3, P.IVA 09469990965. Registration / Order placement The User’s registration and/or placing an order as unregistered user (guest) means acceptance of the Terms indicated below and the Privacy Policy conditions. In the event of Terms update, the effective use of our website and Services counts as acceptance of possible changes that occurred in the meantime. The User can cancel his registration using the Account Cancel button on the Account page. Description of Services www.horribleguild.com is a shop online platform dedicated to Horrible Games products (Products). Sales Terms Orders: By placing an order through our website you warrant that you are old enough to enter into a contract for the purchase of goods or services in the place that you live, and that you are old enough to buy any age restricted items in your order. Once your order has been received you should receive a confirmation email that states our acceptance of your order (as we send this email sales contract is effective). Payments: Payment of all Products in your order (and eventual shipping fees) must be made with a credit card. Credit card payment can be made on Stripe circuit. Please consult Stripe terms of use. Delivery: The Products will be delivered to the address specified in your order and in accordance with the delivery option selected at the point of checkout. Please refer to the chosen courier Terms & Conditions for details on delivery schedule. Product Availability: We use all reasonable endeavours to ensure that our website displays the correct availability of Products for ordering. In the event of any missing product due to improper availability display, you’ll be promptly informed and offered with the choice to be refunded or to wait shipping as soon as product becomes available again. Claims: Claims for transport damage must be sent within 7 days from receipt of the package. After this time, the forwarder company will automatically reject the claims. The game box is not replaceable. Please note that the forwarder company will decide unquestionably whether to accept the complaint and to provide the reimbursement they deem appropriate. Claims for packages lost/not received must be made within 120 days from the shipment date. Errors: If the Products fails to arrive because of your mistake (wrong address, recipient absent, not picking up at courier/postal warehouse, etc.), you will have to pay shipping cost for the new delivery. If the Products fails to be shipped on our mistake, we will send it again with no expenses. Please note that we will not reship any game without first investigating what happened to the first shipment. Shipments: We ship by postal services or supported couriers (USPS, Fedex, DHL, etc.). We reserve the right to separate the contents of orders into different shipments or merge different orders in the same shipment. If this happens, there will not be any additional costs to you as a customer nor the right to any refund. Guarantees Cancellations: Orders of available products can be cancelled within 24 hours after confirmation email. Preorders can be cancelled within 30 days from the order date and within the product shipment. The customer will receive a full refund. Right of withdrawal: We accept the return of Products, but only for those bought on our website by physical persons, excluding those bought by shops, corporations, or companies. The return shipping is entirely in charge of the buyer and must be performed within 14 days from delivery. To return Products, please contact our Customer Care team using the form at the bottom of this page, selecting the “Return products” subject. We’ll give you instructions to contact our competent warehouse and arrange the return shipping with them. For useful reference, the address of our warehouses are: Horrible Games S.r.l. c/o Fulfilment EuropeAlte Leipziger WollkämmereiVolbedingstr. 2D-04357 LeipzigGermany for Europe.Returned Products must be in their original conditions. If the returned Products have been damaged or miss parts or components will be sent back to the customer after payment by the customer of a new shipping fee. Waiting for this additional payment Returned Products will be stored for 3 months. After this period, they will be trashed. General terms If any of these Terms are determined by any competent authority to be invalid, unlawful or unenforceable to any extent, such term, condition or provision will to that extent be severed from the remaining terms, conditions and provisions which will continue to be valid to the fullest extent permitted by law. These Terms, together with our Privacy Policy and Cookies Policy, and any other document expressly referred to in these documents, constitute the whole agreement between us. Horrible Games retains the right to revise and amend these Terms from time to time. The latest version of these Terms will be available on the Website. You will be subject to the policies and Terms in force at the time that you order Products from us. To the fullest extent permissible, any dispute or claim arising out of or in connection with a Contract or its subject matter or formation (including non-contractual disputes or claims) will be governed by Italian law and subject to the exclusive jurisdiction of the Court of Milan."
