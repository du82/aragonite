full_description = "Similo: The Lord of the Rings, a cooperative deduction game set in Middle-earth! 2023-09-14 News Horrible Guild is very proud to announce the upcoming launch of Similo: The Lord of the Rings.This new The Lord of the Rings edition of the critically acclaimed deduction game will see fans trying to guess a secret card from Middle-earth among the twelve displayed on the table. They’ll be assisted by the Clue Giver, who plays cards from their hand as clues, to suggest which cards they should remove. If the secret card is the only one left at the end, all players win!Similo: The Lord of the Rings will include more than 30 famous characters from Middle-earth, like Frodo Baggins™, Gandalf™, Aragorn™, Arwen™, Galadriel™, Gollum™, Sauron™, and many more.It is a fantastic addition to the Similo series, which has now sold over 800’000 copies worldwide. It brings together a top gaming brand with a superb license, and we are beyond excited. We are confident it will be a big hit with fans of both properties.Similo: The Lord of the Rings will be launching at retail later this year in Q4 2023. For more info, check the official page of the game on our website.Until next time! Tags: Board Games, Similo Continue Reading Previous PostEvergreen has been nominated for the Origins Awards!Next PostEssen SPIEL ’23 & SPIEL@HOME limited-time offer! You Might Also Like The King’s Dilemma: Chronicles NOW AVAILABLE! 2023-01-30 The King’s Dilemma: Chronicles, a single player, narrative-driven political RPG 2022-07-15 History and Wild Animals decks are now available for Similo on BoardGameArena! 2022-03-16"
