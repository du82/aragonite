["https://horribleguild.com/eu/about-us"]
title = "About Us – Horrible Guild"
description = "Author of Horse Fever (2009), Dungeon Fighter (2011), Potion Explosion (2015), Railroad Ink (2018), The King’s Dilemma (2019), and loads of other stuff. Founder & CEO of Horrible Guild. Punk lover. Pathologically impatient."
full_description = '''About Us HomeAbout Us Hello, we are Horrible Guild... Horrible Guild is an Italian board game and roleplaying game publisher founded in 2014 by Lorenzo Silva. Our goal is to design, develop and produce cool and innovative games capable of bringing fun to everyone: we try to make our games stand out from the crowd, both for visual style and gameplay mechanics.Follow us on our social media profiles to stay updated on our latest endeavours and get previews of our next products. ... and this is the Horrible team! Lorenzo Silva CEO Author of Horse Fever (2009), Dungeon Fighter (2011), Potion Explosion (2015), Railroad Ink (2018), The King’s Dilemma (2019), and loads of other stuff. Founder & CEO of Horrible Guild. Punk lover. Pathologically impatient. Hjalmar Hach Lead Designer & Head of R&D Musician, composer and game designer. He discovered board games in 2015: it was love at first sight. His most beloved offsprings are: Photosynthesis (2016), Railroad Ink (2018), The King’s Dilemma (2019) and Similo: The Card Game (2019). Claims to have lived more than 100 different lives. Federico Corbetta Caci Head of Narrative & RPG The only things he loves more than his horses are red wine and sludge metal. By contract, he has to yell “character arc!” at least twice a day. Thinks life is a roguelike, but no one really cares. Alessandro Pra' Lead Editor Can’t stay away from the sea for too long. Music lover. Sax and EWI player. Amateur photographer. Free software enthusiast. Nintendo Addict. Andrea Lugli Project Manager Beer, board game and football are his perfect cocktail mix. If it is added a pinch of adventure and a life in nature to him, he will forever be a happy man. Renato "Renè" Sasdelli Project Manager Hates air conditioner and cold. Among other things, loves the sun, open airs, samba, caipirinha, football (soccer) and, of course, boardgames. Camilla Muschio Sales & Production Manager She can eat everything and sleep anywhere, Never question her will to ask… if anything, she asks too many questions. Curious, cat lover. She loves cinema and playing for fun. Ylenia D'Abundo Sales & Production Coordinator Always smiling, she loves to travel and learn new things. The enthusiasm and passion for board games distinguish her. She also loves Mediterranean cuisine and music. Laura Severino Administration Manager She is an old soul and a bookworm. She loves everything retro-styled, cute things, purple and punching out components from new games. Giulia Monte Administration Coordinator Always in search of a good thrill, no matter if in the first row at a rock concert or among the pages of an adventure book. Open minded and curious about the world. Loves to find new strategies and challenges, in life just as in boardgames. Davide Amici Marketing Manager Half games enthusiast, half music lover, 100% cheerleader. Draws energy from the sun but believes blue light emissions will keep him younger. Bronze Age nostalgic. Alberto Putignano Digital Products Developer Computer scientist who someday knocked his head and decided to become a game designer (we’ll see how that goes). Has a soft spot for retro visuals and Japanese urban photography. On a quest to end all quests. Federico “Toy” Dossi Sales & Distribution Assembled in 1984. Hutt and Ghostbuster, gelatinous cube lover. Protonic batteries included (expected lifespan: more than 5000 years). Keep away from microphones. Worst toy ever!'''
year_published = 2025
