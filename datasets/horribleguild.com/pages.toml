["https://horribleguild.com/eu/2021/04/19/railroad-ink-challenge-is-going-digital"]
title = "Railroad Ink Challenge is going digital! – Horrible Guild"
full_description = "Railroad Ink Challenge is going digital! 2021-04-19 News We’re delighted to announce that Railroad Ink Challenge™, the digital adaptation of our critically acclaimed roll and write game, is coming soon!The game is being converted to the digital format by the same development team behind the critically acclaimed digital versions of Potion Explosion™, Dragon Castle™, and Similo™.Forest, Desert and more expansions based on the physical board game are planned and will be coming as DLC in the months following release!Play solo to improve your best score, or create online challenges to compete with players from all over the world! But that’s not all! In the digital version of Railroad Ink Challenge you will find:The wonderful art of the roll and write game by Marta Tranquilli, fleshed out and digitally enhance.Network planning gameplay, try to make the best use of the available routes each round to create the perfect transportation network.Try to conquer the top of the online leaderboards (Daily, Monthly, and All-Time)!Cross-platform, asynchronous multiplayer challenges with your friends!Get ready to roll dice, plan routes, and reach networking nirvana with the digital version of Railroad Ink Challenge!Please remember to add the game to your wishlist on Steam (even if you got the founders editionadd-on on Kickstarter)! This helps us give the game visibility on launch day and possibly even get it featured.We hope you will join us in this new digital adventure! Tags: Railroad Ink, Video Games Continue Reading Next PostRailroad Ink Challenge is now available on the App Store, Google Play, and Steam! You Might Also Like The Queen’s Dilemma™, soon on Kickstarter! 2022-05-13 Black Lives Matter 2020-06-30 All Dungeon Fighter products are 20% off for a limited time! 2023-04-04"
