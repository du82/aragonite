full_description = "Potion Explosion: The Digital App Designers: Lorenzo Silva, Andrea Crespi, Stefano Castelli Artist: Giulia Ghigini Students of the Horribilorum Sorcery Academy must prove themselves by collecting ingredients and using them to design as many potions as possible. Display talent to win skill tokens by mastering a particular potion several times or preparing a variety of different potions. Collect the most skill tokens to win the game and become a Potion Master! Asynchronous Multiplayer Hotseat Network Multiplayer Single-Player Categories: Potion Explosion, Video Games Tag: Video Games Add to Wishlist Add to Wishlist Description Description The official adaptation of Potion Explosion, the award-winning puzzle board game.Play this game solo or against players from all over the world with Solo, Online, and Local Pass & Play modes!In Potion Explosion, you will explode ingredients, trigger chain reactions, and gather it all in your caldron. You will then use your hard-earned unicorn tears, fairy dandruff, and whatnot to craft powerful mixtures with wacky effects! May the best wizard win!At the beginning of the game, each player is given potions to complete with specific effects and ingredients. You will have to select ingredients in the dispenser; once your selected ingredient is removed, the ingredients above will slide down. If two ingredients of the same nature collide, they explode and you get them too! You can then use your ingredients to cook up your potions. You only have a limited tank space to store remaining ingredients from one turn to another, so choose carefully! Once a potion is completed, you score points, get to use its powerful effect, and pick another potion to craft. The wizard with the most points wins!Features:• The magical universe of the board game, fleshed out and digitally enhanced• A tactical gameplay, allowing for different playstyles and strategies• A Solo Mode against up to 3 adjustable AIs• An online Multiplayer Mode with a 