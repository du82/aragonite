title = "Wilderfeast In-Depth Look #1 | Game System & Core Loop – Horrible Guild"
full_description = "Wilderfeast In-Depth Look #1 | Game System & Core Loop 2023-07-12 News Welcome to Wilderfeast Restaurant! Our tasting menu includes a series of insights into various aspects of the game. In this first course, we will serve up a reduction of the basics of the game system in rules sauce.In Wilderfeast, one player is the Guide, this system’s term for the Game Master or GM, who facilitates the game and brings the world to life. The rest are wilders, the protagonists of a story about finding harmony between humanity and nature.Your character sheet is an evolving personal chronicle, each attribute representing a major moment from your life or a monster you’ve made part of yourself. Every character has levels in Styles, which represent broad approaches to actions, and Skills, which represent the types of actions wilders and monsters perform most.If a character attempts an action with something at stake, they make a Test using a Style combined with a Skill, such as a Mighty Call to intimidate a monster into backing away or a Swift Search to follow tracks in the undergrowth. Wilderfeast features a simple but flexible dice pool system, built around a central idea…Wilders are both, so they can choose which of their sides to embrace when taking Tests: will you hold back, and stay true to your human side, or go wild, and unleash the monster in you?A common short-term consequence of failing Tests is that you lose Stamina, which represents both your health and your energy. The less Stamina you have, the more dangerous it is to press forward. A more long-term consequence is that you lose Harmony, a shared resource that represents your pack’s relationship with each other and the natural world.The bulk of gameplay in Wilderfeast occurs during Journeys, where you explore wild places and hunt frenzied monsters. Each phase of a Journey reflects your main duties as a wilder: The Trail, when you’re trying to reach a destination, The Hunt, when you’re fighting a frenzied monster, or The Feast, when you’re cooking a meal.When you’re just using the basic rules to mediate the conversation of the game, that’s called free play, and the only difference between free play and Journeys is that Journeys provide some extra structure on top of the foundation that free play lays.We hope you enjoyed the first course of our Wilderfeast tasting menu! Next time we will serve you appetizers from one of the most iconic parts of the game: The Feast!If you want to share your Wilderfeast experience with other players, don’t hesitate to join our Discord server! We want to hear your thoughts!If you didn’t play the Wilderfeast™ Quickstart yet, instead… wait no further! Here’s the link, just in case you missed it the first time around.DOWNLOAD THE QUICKSTART­Remember, Wilderfeast™ is launching on Kickstarter on September 5!Follow the project on Kickstarter to be notified when it will go live!Wilderfeast™ is a game by KC Shi, writer for tabletop RPGs such as Warhammer Age of Sigmar: Soulbound, the Uncaged anthology, BEOWULF: Age of Heroes, and One More Quest. Cover art by Xulia Vicente.FOLLOW ON KICKSTARTER­ Tags: In-Depth Look, Kickstarter, Tabletop RPG, Wilderfeast Continue Reading Previous PostWilderfeast™ | A tabletop RPG of monstrous cuisineNext PostWilderfeast In-Depth Look #2 | The Feast You Might Also Like The King’s Dilemma: Chronicles NOW AVAILABLE! 2023-01-30 Get the Vampire: The Masquerade – Vendetta deluxe bundle for a discounted price! 2022-02-28 One More Quest is now LIVE on Kickstarter! 2022-01-25"
