["https://horribleguild.com/eu/2024/09/26/come-visit-us-at-spiel-24"]
title = "Come visit us at SPIEL 24 in Hall 5, booth 5D221! – Horrible Guild"
full_description = "Come visit us at SPIEL 24 in Hall 5, booth 5D221! 2024-09-26 News Hi there Horrible friends!Are you ready? SPIEL is back!The largest tabletop gaming fair in the world will be held October 3-6 in Essen, Germany. That’s just one week away!NOTE: Even if you’re not attending SPIEL, keep reading! We have a special promotion that you might find interesting at the end of this post! 😉If you will be attending SPIEL, you will find us in Hall 5, booth 5D221.Read on to find out what we have in store for you this year!Similo: Board Games is back! As has become a tradition, for 2024 we have created a new deck in the Similo series, in cooperation with several other publishers, to celebrate the world of tabletop gaming! Will you find out the secret board game?You can seize a free copy of Similo: Board Games ’24 if you buy one of the games portrayed in the deck, including our own SPIEL brand new releases (more on those later)!You will find Similo: Board Games ’24 at our booth, at SPIEL’s booth (6B406), and at the booths of the other participating partners. It will only be available while stocks last, so make sure to grab yours before it’s too late!Speaking of special Similo decks, to celebrate our 10th anniversary we made a limited edition deck called Similo: 10 Years of Horribleness, coming with 34 cards featuring all of the games in our history, with artwork from the many artists we’ve worked with over the years… some of which were specifically made for this deck!It’s a limited run, each copy is numbered and unique, and once it’s gone it will never be reprinted again… grab yours before they sell out forever!To conclude all things Similo, SPIEL will also see the debut of the latest and recently-announced entry in the regular Similo series, Similo: Jurassic World, including more than 30 famous dinosaurs and other prehistoric creatures from the franchise, like Tyrannosaurus rex, Velociraptor, Triceratops, Dilophosaurus, Brachiosaurus, Indominus rex, Mosasaurus, and many more.Many previous Similo decks will also be available, like Fables, History, Animals, Wild Animals, Spookies, Harry Potter, Fantastic Beasts, and last year’s The Lord of the Rings.Similo is a cooperative deduction game designed by Hjalmar Hach, Pierluca Zizzi, and Martino Chiacchiera, with art by Naïade.Spotlight is a cooperative hidden object game for 1-5 players where you and your friends search for wacky characters and items hidden in dark places brimming with absurd things… using your trusty flashlight!The game will debut at SPIEL after a successful preview launch at GenCon. Spotlight is designed by Lorenzo Silva and Hjalmar Hach, the award-winning duo behind smash hits such as the Railroad Ink series and The King’s Dilemma, with art by Giulia Ghigini.Flower Fields is a competitive tile-placement game where you create a beautiful garden full of life and color… with the help of bees! Pick tiles wisely and connect your flowers, then send bees to pollinate them and increase their value!Flower Fields is designed by Luca Bellini and Luca Borsa, prolific duo of Italian designers behind hobby games such as Pakal as well as the preschool line of board games for Chicco, with art by Fabio Frencl.Don’t miss your chance to play with the authors Luca Bellini and Luca Borsa and get your copy of Flower Fields autographed!The session will take place on Saturday, October 5 at 15:00.Evergreen: Giant Trees and Mushrooms is a set of 2 modular expansions for Evergreen introducing Giant Trees, an additional growth step beyond Big Trees, and Mushrooms, which thrive and multiply in the shadows.Just like the core game and the previous expansion, Pines and Cacti, Evergreen: Giant Trees and Mushrooms is designed by award-winning author Hjalmar Hach, with art by Wenyi Geng.As an exclusive preview at our booth, you will also be able to try out the brand new Railroad Tiles, a tile placement game based on our critically acclaimed roll-and-write game series Railroad Ink.The game is planned for release in late 2025, but it is live on Kickstarter until October 10, so this is the perfect chance to get a taste of the game in advance before you get the game next year… or back our campaign!We also have promos that you get together with your purchase at our booth! An additional pack of Search cards for Spotlight, the Flower Mix mini-expansion for Flower Fields, two new Blueprint cards for Railroad Ink, the King Gilford hero for Dungeon Fighter, the Tonic of Glacial Preservation potion for Potion Explosion, and a promo card for Similo: Jurassic World: the Mosquito in Ambra!But that’s not all! Custom card sleeves for our games, enamel pins, neck lanyards, stickers… as well as bundles and special offers allowing you to get more horrible stuff for a discounted price!Last but not least, if you won’t be able to travel all the way to Germany to try our latest games… fret not! SPIEL@HOME is back!Starting on October 3, you will be able to get free shipping for any order placed on our shop over 50€ / $50 and receive our brand new SPIEL releases–as well as our other products–directly at your home!This is a limited time offer, so don’t miss your chance!Join us in Essen this October 3-6! You will find us in Hall 5, booth 5D221… we look forward to seeing you there! And if not, we hope you’ll take advantage of our SPIEL@Home special offer! You Might Also Like The King’s Dilemma: Chronicles, a single player, narrative-driven political RPG 2022-07-15 Wilderfeast In-Depth Look #1 | Game System & Core Loop 2023-07-12 Introducing Daily Challenges, a new FREE update for Railroad Ink Challenge! 🚂🚃 2021-10-01"
year_published = 2024
