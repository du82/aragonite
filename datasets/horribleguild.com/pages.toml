["https://horribleguild.com/eu/2023/09/28/essen-spiel-23-spielhome-limited-time-offer"]
title = "Essen SPIEL ’23 & SPIEL@HOME limited-time offer! – Horrible Guild"
full_description = "Essen SPIEL ’23 & SPIEL@HOME limited-time offer! 2023-09-28 News Hi there Horrible friends!Are you ready? SPIEL is back!This year marks the 40th edition of the largest tabletop gaming fair, which will be held October 5-8 in Essen, Germany. That’s just one week away!NOTE: Even if you’re not attending SPIEL, keep reading! We have a special promotion that you might find interesting at the end of this email! 😉If you will be attending SPIEL, you will find us in our new location in Hall 5, booth 5G112. Read on to find out what we have in store for you this year!Similo: Board Games is back! Just like last year, we created a new deck in the Similo series in cooperation with several other publishers to celebrate the world of tabletop gaming! Will you find out the secret board game?You can seize a free copy of Similo: Board Games ’23 if you buy one of the games portrayed in the deck, including our own SPIEL brand new releases (more on those later)!You will find Similo: Board Games ’23 at our booth, at SPIEL’s booth (6B408), and at the booths of the other participating partners. It will only be available while stocks last, so make sure to grab yours before it’s too late!SPIEL will also see the debut of the latest and recently-announced entry in the Similo series, Similo: The Lord of the Rings, including 40 famous characters from Middle-earth, like Frodo Baggins™, Gandalf™, Aragorn™, Arwen™, Galadriel™, Gollum™, Sauron™, and many more.All previous Similo decks will also be available: Fables, History, Myths, Animals, Wild Animals, Spookies, Harry Potter, and Fantastic Beasts.Similo is a cooperative deduction game designed by Hjalmar Hach, Pierluca Zizzi, and Martino Chiacchiera, with art by Naïade.Sunrise Lane is a strategical city-building game where you need to grab the most prestigious plots of land and build wonderful houses… if you can beat your competitors to it!The game will debut at SPIEL after an extremely successful preview launch at GenCon, were it went sold out earlier this year. Sunrise Lane is designed by legendary author Reiner Knizia, with art by Francesco De Benedittis.Quicksand is a real-time cooperative game where where you work together to deactivate a dangerous trap of gears and sand. Play cards to flip and advance sand timers and prevent any of them from running out! Only strategic planning and perfect teamwork will allow you to overcome this intense challenge!Quicksand is designed by Lorenzo Silva and Hjalmar Hach, the award-winning duo behind smash hits such as the Railroad Ink series and The King’s Dilemma, with art by Maxime Morin.Evergreen: Pines and Cacti is a set of 2 modular expansions for Evergreen introducing two new kinds of plants that interact with light and shadow in new, interesting ways! Keep your small pines in shadow to make them grow into big pines, but make sure to keep your cacti in the sun… or they will die!Just like the core game, Evergreen: Pines and Cacti is designed by award-winning author Hjalmar Hach, with art by Wenyi Geng.Railroad Ink: Archipelago Boards Set is a new expansion for Railroad Ink! Build your transportation network spanning across multiple islands but beware: you can only draw your dice on one island at a time! These boards also feature a new Special Building, the Warehouse, which allows you to “store” routes and save them for later use.Railroad Ink: Archipelago Boards is designed by the award-winning duo Lorenzo Silva and Hjalmar Hach, with art by Marta Tranquilli.We also have promos that you get together with your purchase at our booth! The special Double Park card for Sunrise Lane, the Danger Mode mini-expansion for Quicksand, the Tucker Blackfoot hero for Dungeon Fighter, the Serum of Invisibility potion for Potion Explosion, and two promo cards for Similo: The Lord of the Rings: the One Ring and the Eye of Sauron!But that’s not all! Custom card sleeves for our games, enamel pins, neck lanyards, calendars, stickers… as well as bundles and special offers allowing you to get more horrible stuff for a discounted price!Last but not least, if you won’t be able to travel all the way to Germany to try our latest games… fret not! SPIEL@HOME is back!Starting on October 5, you will be able to get free shipping for any order placed on our shop over 30€ / $30 and receive our brand new SPIEL releases–as well as our other products–directly at your home!This is a limited time offer, so don’t miss your chance! For more information, push the button below and pay a visit to our shop!GET TO OUR SHOP!Join us in Essen this October 5-8! You will find us in Hall 5, booth 5G112… we look forward to seeing you there! And if not, we hope you’ll take advantage of our SPIEL@Home special offer! Finally, don’t forget to join our community on Discord and Facebook to share your excitement for SPIEL‘23 and meet fellow players! Until next time! Tags: Board Games, Essen SPIEL Continue Reading Previous PostSimilo: The Lord of the Rings, a cooperative deduction game set in Middle-earth!Next PostOur Black Friday sales are now live! You Might Also Like Wilderfeast In-Depth Look #2 | The Feast 2023-07-18 Come visit us at SPIEL 24 in Hall 5, booth 5D221! 2024-09-26 The King’s Dilemma: Chronicles NOW AVAILABLE! 2023-01-30"
