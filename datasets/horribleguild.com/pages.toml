full_description = "Payment HomePayment Which payment methods do you accept?Payment for all products in your order (and eventual shipping fees) must be made with a credit card. Credit card payment can be made on the Stripe circuit. For further information, please consult the Stripe terms of use. How does Stripe work?Stripe is a fully integrated, cloud-based, global payment management platform. It allows companies to accept payments with a wide range of methods, including debit and credit cards.Stripe simplifies the online purchase process, making it more fluid and secure: thanks to the use of specific tools developed for the management of payment flows and anti-fraud security, it offers maximum flexibility and ease of use.On our website, Stripe supports the following payment methods:Credit and debit cards (Visa, Mastercard, Maestro, American Express, Diners, etc.)Wallet payment methods (Apple Pay, Google Pay)To lear more about Stripe, please refer to the company website. For further information, please check our Terms of Service and Frequently Asked Questions pages."
