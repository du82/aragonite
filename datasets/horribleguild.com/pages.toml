title = "The Horrible Shop is open! 🦑 🎉 – Horrible Guild"
full_description = "The Horrible Shop is open! 🦑 🎉 2021-11-24 News After months of hard work, we are happy to announce our e-commerce!On the Horrible Shop, you’ll find our games, promos, game accessories, and more! Many of these items were previously only available at gaming conventions, so check them out!Please note that the shop is still a bit of a work in progress. Depending on your region, some products may currently be out of stock or with limited quantities available.Create your account and add your favorites to the wishlist, you’ll be notified when they go back in stock!GO TO THE SHOP!This is just the beginning. In the future, we’ll add more kinds of products to our catalog (did anybody say “Horrible merchandising”?), so stay tuned!And don’t forget to join our community on Discord and Facebook to meet fellow players and share your experiences!Until next time! You Might Also Like Harry Potter Similo, a cooperative deduction game set in the Wizarding World! 2022-01-18 Introducing Evergreen, a tree-growing abstract strategy game for 1-4 players! 🌳☀ 2022-05-18 Horrible Guild at SPIEL ’22! 2022-09-28"
