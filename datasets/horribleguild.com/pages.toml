["https://horribleguild.com/eu/cookies-policy"]
title = "Cookies Policy – Horrible Guild"
full_description = "Please read this cookie policy carefully before using www.horribleguild.com For more information about the use of cookies while visiting www.horribleguild.com, please read our Privacy Policy. What is a cookie Apart from being a biscuit outside the internet, in the web a cookies is simple text files that can be stored on your computer or mobile device by a website’s server to recognise and remember you. Each cookie is unique to your web browser. It will contain some anonymous information such as a unique identifier, website’s domain name, and some digits and numbers. When you visit our sites, we may collect information from you automatically through cookies or similar technology, such as a tag, pixel, or other web beacon. What types of cookies and how do we use them We use cookies in a range of ways to improve your experience on our site, including for example Keeping you signed in Understanding how you use our site Cookies that are used by www.horribleguild.com are referred to as “first-party cookies” and those that are used by our partners are “third-party cookies”. Because of how cookies work, our website cannot access third-party cookies; nor can other organisations access the data in the cookies we use on our website. We use three types of first party cookies: Necessary cookies Necessary cookies allow us to offer you the best possible experience when accessing and navigating through our website and using its features. For example, these cookies let us recognize that you have created an account and have logged into that account. Functionality cookies Functionality cookies let us operate the site in accordance with the choices you make. For example, we will recognize your username and remember how you customized the site during future visits. Analytical cookies These cookies enable us and third-party services to collect aggregated data for statistical purposes on how our visitors use the website. These cookies do not contain personal information such as names and email addresses and are used to help us improve your user experience of the website. Third Party Cookies in Detail Google Analytics is configured to work only on anonymous data tracking. Woocommerce session cookies (see https://docs.woocommerce.com/document/woocommerce-cookies/ for reference). WordPress cookies (see https://www.cookielawinfo.com/wordpress-cookies-list-why-they-are-used/ for reference). Sendinblue cookies (see https://www.sendinblue.com/legal/cookies/ for reference). We also use: Google Tag Manager technology (see https://support.google.com/tagmanager/answer/6102821 for reference). Facebook Pixel technology (see https://developers.facebook.com/docs/facebook-pixel/ for reference). Other organisations also collect user information on our sites through cookies, tags and pixels. Tags and pixels, also known as web beacons, are similar to cookies but are collected through embedded images. How to manage or delete cookies You can manage the use of cookies on our sites clicking the button here below. You may need to do this again each time you use a different IP address, device, or virtual private network. You can also adjust the global privacy setting or plug-in which should be communicated to use via your browser. [cookie_settings] It is also possible to stop your browser from accepting cookies altogether by changing your browser’s cookie settings. You can usually find these settings in the “options” or “preferences” menu of your browser. The following links may be helpful, or you can use the “Help” option in your browser. Cookie settings in Firefox Cookie settings in Chrome Alternatively, you can visit www.internetcookies.org, which contains comprehensive information on how to manage or delete cookies on a wide variety of browsers and devices. You will find general information about cookies and details on how to delete cookies from your device. Useful links If you would like to find out more about privacy, cookies and their use on the internet, you may find the following links useful: Microsoft cookies guide All About Cookies Contacting us If you have any questions about this policy or our use of cookies, please contact us."
