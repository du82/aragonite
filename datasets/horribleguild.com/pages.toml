\t\tAdd to Wishlist\t\tAdd to Wishlist"""
full_description = "The King’s Dilemma: Chronicles Developed by: Horrible Guild, Big Trouble Game Studio Lead the King’s Council for generations as the consequences of your decisions decide the kingdom’s resources and political standing. Form alliances, solve dilemmas, and prepare for the final uprising that was foretold by an ancient prophecy! Categories: The King's Dilemma: Chronicles, Video Games Tag: Video Games Add to Wishlist Add to Wishlist Description Description Lead the King’s Council for generations as the consequences of your decisions decide the kingdom’s resources and political standing. Form alliances, solve dilemmas, and prepare for the final uprising that was foretold by an ancient prophecy!The GameWelcome to the Kingdom of Ankist: a place of daring expeditions, gruesome battles, and arcane mysteries. You play as the Head of the Council, the leader of the King’s inner circle. Listen to the advice of your Council of Houses, or overrule their decisions.Face hundreds of dilemmas where every choice you make may affect your relationship with the other Houses, influence the well-being and resources of the kingdom, and change the course of history itself. Discover the lands of Ankist over a story spanning across tens of generations. Form alliances, survive betrayals, and prepare for the final uprising foretold by an ancient prophecy.Will you act for the greater good, or will you think only of yourself?GameplayExplore the map of Ankist and see the Kindom’s problems currently at hand. Choose one, and the Council will be summoned to make a decision: do we send help to people hit by famine? Should we wage war against that northern tribe raiding the villages across our border? The Houses will cast their vote: “Aye” or “Nay” based on their personal interest and political stance. At that point, you might decide to influence the vote, spending your House’s finances to corrupt members of the council, or consuming some fo the limited “power” points you are given for the rule of each King.Each decision you make has consequences both on your relations with the other Houses and on the Kingdom’s resources, which in turn might result in the King abdicating or being overthrown. But they will also make more dilemmas become available on the map. Based on the resources standing at the end of the current King’s rule and your moral alignment, you will be awarded “greed” and “influence” points, which you’ll be able to spend to research technology, start expeditions, or build structures. Which of these will become available depends on the choices you made.Each of the above will award you money and resources during the rule of each King, in addition to changing the events of the final uprising you will be preparing for.Features• Play as one of twelve different houses, each with their own narrative goal• Discover 300+ story-driven dilemmas through Ankist and its neighboring kingdoms• Choose branching narrative paths across six intertwined storylines• Explore multiple endings, with each playthrough lasting 3 to 4 hours• Use influence or corruption to control the Council• Invest in research, technology and buildings• Play across generations, choose your heir as well as their personality and goals• Always be preparing for the final battle The WorldThe King’s Dilemma: Chronicles tells the story of Ankist, a fictional medieval kingdom in the continent of Lywik. The structure of the kingdom is feudal: the Duchies and the Marks are managed by their ruling Houses, many of which also have their representatives sitting at the Council, a governing body ruling in the name of the King located in Lybra, the capital city of the Kingdom. As the leader of the Council, all social classes will come asking for your help: Merchants, Scholars, the Army, the Cult of the Mother, and of course, the People. It will be your task to drive the choices of the Council and satisfy their requests… but you’ll also have to manage the resources of the Kingdom, and keeping everyone happy won’t be easy.Your main interest is obviously to make Ankist prosper; however, you are also trying to increase the power and the prestige of your own family over the others. The campaign spans decades and generations, and you will assume the role of different representatives of your House over the course of the game. Video Gallery Related Products Quick View Board Games, The King's DilemmaThe King’s Dilemma 80.00€ Add to cart Add to Wishlist Add to Wishlist Quick View Board Games, The King's DilemmaThe King’s Dilemma – Ankist Map 5.00€ Add to cart Add to Wishlist Add to Wishlist Quick View Board Games, The King's DilemmaThe King’s Dilemma – Prologue Demo Kit 10.00€ Add to cart Add to Wishlist Add to Wishlist"
