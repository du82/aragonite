full_description = "Similo: The Card Game Designers: Hjalmar Hach, Pierluca Zizzi, Martino Chiacchiera Artist: Xavier “Naïade” Durin A cooperative deduction game where your goal is to make the other players guess one secret character by playing other character cards from your hand as clues, stating whether they are similar to or different from the secret character. Local Pass & Play Mode Online Multiplayer Mode Categories: Similo, Video Games Tag: Video Games Add to Wishlist Add to Wishlist Description Description The official adaptation of Similo, the critically acclaimed cooperative guessing game illustrated by world famous artist Naïade, is here! Play against players from all over the world Online or locally with your friends in Local Pass & Play mode!In Similo, you have 5 rounds to let the other players find the secret character among the twelve shown. Play more characters as clues, to suggest similarities or differences with the secret character. After each clue, the other players must discard 1 or more characters from the roster. If they discard the secret character, you all lose! But, if the secret character is the only one left, you all win!PASS & PLAY AND ONLINE MULTIPLAYER MODESPlay with your friends with the local pass and play mode, or join games with players from all over the world with online multiplayer!Features:• The wonderful art of the card game by Naïade, fleshed out and digitally enhanced• Social deduction gameplay, where you try to decrypt the minds of your friends and create the perfect clues• Local Pass & Play Mode for 2 to infinite players, the perfect party game• Online Multiplayer Mode! Join 1 on 1 matches with people from all over the world Video Gallery Related Products NEW Quick View Board Games, SimiloSimilo: Jurassic World – Promo Card 1.00€ Add to cart Add to Wishlist Add to Wishlist NEW Quick View Board Games, SimiloSimilo: 10 Years of Horribleness 10.00€ Add to cart Add to Wishlist Add to Wishlist BUNDLE -100% Quick View Board Games