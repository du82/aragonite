full_description = "Introducing Daily Challenges, a new FREE update for Railroad Ink Challenge! 🚂🚃 2021-10-01 News We’re stoked to announce a new free update for Railroad Ink Challenge™, the digital adaptation of our critically acclaimed roll and write game. Introducing… Daily Challenges!Enjoy a new level to compete on each day, with special rules and variable setups! Test your skills and get rewards based on your ranking at the end of the day… and the best part is that it is available now on the App Store, Google Play, and Steam!The Daily Challenges update introduces:Over 20 new kinds of route creating custom dice configurations, with unique configurations of rails /roadsPre-placed tiles and locked tiles (mountains)9 new ObjectivesCustom placement of Exits around the boardCustom placement and quantity of special buildingsCustom number of roundsJump aboard the train and join your first Daily Challenge on your favorite device with the new Railroad Ink Challenge free update! Tags: Railroad Ink, Video Games Continue Reading Previous PostRailroad Ink Challenge is now available on the App Store, Google Play, and Steam!Next Post🐙 🦑 Horrible Guild at Essen SPIEL 2021! 🦑 🐙 You Might Also Like Railroad Ink Challenge is now available on the App Store, Google Play, and Steam! 2021-06-18 Essen SPIEL ’23 & SPIEL@HOME limited-time offer! 2023-09-28 Wilderfeast In-Depth Look #1 | Game System & Core Loop 2023-07-12"
