full_description = 'A Quick Update Leave a Comment / By Enigma / Last Updated On: October 17, 2024HomeAnnouncementA Quick Update Hi there! It’s been a minute. 🙂As you might have noticed, Team Hovatek has been quite busy. We launched our free Online TWRP Builder a few months back and have been actively making improvements—a big thanks to all who have tested and given feedback. We rely on your feedback to keep improving the tool. We are also working on nine (9) new courses that include MediaTek, Unisoc/Spreadtrum and Qualcomm software repairs which should be launched in 2025.New FeaturesWe’ve made some improvements across our website that you might find helpful. Feel free to shoot us an email if you need certain features or improvements.Light & Dark Theme SwitcherWe’ve implemented light and dark theme switching across our website. The theme switcher sits at the top of every page. Simply toggle to switch to your preferred mode.<img decoding="async" width="293" height="67" src="https://www.hovatek.com/blog/bpyeki/uploads/2024/10/theme-switch-icon.png" alt="" class="wp-image-12995"/>Progressive Web App (PWA)Our entire website is now a PWA which can be installed on Android, iOS and Windows devices. Once you visit our website, installing the PWA is easy.Android: You should get a prompt to install the app. You can also look under Settings and tap Install.iOS: From Safari, go to Share > Add to Home Screen > AddWindows PC: You’ll find an icon at the top right corner (beside the address bar). Click it and click Install.Push NotificationYou’ll normally get notified via email when you have a response. You can also get notified on your device via a prompt whenever you have a response or message at our forum. To enable this feature:Sign up and log in at our ForumScroll to the bottom of the Forum and click Subscribe to push notificationAccept permission once promptedRefresh the pageTelegram & Whatsapp ChannelsOur Telegram and Whatsapp channels are open to join. Membership means you get important announcements and updates quickly. You also enjoy occasional discounts on our services and courses. Join Now — Telegram | WhatsappDid I mention we’ll be recruiting soon?'
