["https://www.hovatek.com/twrpbuilder"]
title = "Online TWRP Builder - Hovatek"
description = "Build TWRP from source for Android devices e.g Mediatek (MTK), Unisoc, Spreadtrum if(SPD), Qualcomm (QLM) Allwinner etc"
full_description = '''FEATURES Your gadget comes with a stock recovery mode by default. While this enables you to perform simple tasks like installing Over The Air (OTA) updates, Factory reset and backup, its very limited and can be unreliable at times. These are the problems that TWRP solves. Flash Custom Scripts Flash scripts in zip format e.g Magisk for root access, Multi disabler to disable FBE (file-based encryption), Vaultkeeper, Process authentication, wsm, Stock recovery auto-restoration etc Install Custom ROMs Custom ROMs can enhance your gadget by fixing existing bugs, de-bloating (to free up resources), disabling limiting securities (e.g RW) and adding awesome features for a sleek experience. Easy Backup & Restore Custom recoveries like TWRP make universal backups that you and other devices can restore. You can backup select or all partitions, giving you a truly customized backup & restore experience. Device Management Functions like Terminal access, ADB Root shell, ADB Sideload, Partition Management, File Manager, Fix Permissions etc enable you to make or reverse desired modifications and fix issues. Watch Video Tutorial TWRP SCREENSHOT Team Win Recovery Project (TWRP) is an open source, community project which replaces the stock recovery on Android devices with a feature rich custom recovery. BUILD TWRP FOR YOUR DEVICE Choose your image type, Android version and upload Image Type boot.img boot.img + vendor_boot.img recovery.img Android Version 7 8.0 8.1 9 10 11 12 13 14 Screen Resolution X Is the device A/B e.g has boot_a and boot_b? No Yes Touch Driver(s) (optional) Reduce TWRP Size? (optional) default / I'm not sure Yes, a little Yes, much Yes, a lot TWRP Flags (optional) Choose TWRP flag AB_OTA_UPDATER BOARD_HAS_NO_REAL_SDCARD BOARD_KERNEL_CMDLINE BOARD_USES_METADATA_PARTITION DEVICE_RESOLUTION RECOVERY_SDCARD_ON_DATA RECOVERY_TOUCHSCREEN_FLIP_X RECOVERY_TOUCHSCREEN_FLIP_Y RECOVERY_TOUCHSCREEN_SWAP_XY TARGET_ARCH TARGET_RECOVERY_DEVICE_MODULES TARGET_USE_CUSTOM_LUN_FILE_PATH TARGET_USERIMAGES_USE_EXT4 TARGET_USERIMAGES_USE_F2FS TARGET_USES_MKE2FS TW_ALWAYS_RMRF TW_BRIGHTNESS_PATH TW_CUSTOM_BATTERY_PATH TW_CUSTOM_POWER_BUTTON TW_DEFAULT_BRIGHTNESS TW_DEFAULT_LANGUAGE TW_DEVICE_VERSION TW_DISABLE_TTF TW_EXCLUDE_DEFAULT_USB_INIT TW_EXCLUDE_ENCRYPTED_BACKUPS TW_EXCLUDE_MTP TW_EXCLUDE_SUPERSU TW_FORCE_CPUINFO_FOR_DEVICE_ID TW_FRAMERATE TW_H_OFFSET TW_HAS_DOWNLOAD_MODE TW_HAS_EDL_MODE TW_HAS_NO_BOOT_PARTITION TW_HAS_NO_RECOVERY_PARTITION TW_INCLUDE_CRYPTO TW_INCLUDE_CRYPTO_FBE TW_INCLUDE_DUMLOCK TW_INCLUDE_FB2PNG TW_INCLUDE_FBE_METADATA_DECRYPT TW_INCLUDE_INJECTTWRP TW_INCLUDE_JB_CRYPTO TW_INCLUDE_LIBRESETPROP TW_INCLUDE_LPTOOLS TW_INCLUDE_NTFS_3G TW_INCLUDE_REPACKTOOLS TW_INCLUDE_RESETPROP TW_MAX_BRIGHTNESS TW_NEVER_UNMOUNT_SYSTEM TW_NO_BATT_PERCENT TW_NO_BIND_SYSTEM TW_NO_CPU_TEMP TW_NO_EXFAT TW_NO_EXFAT_FUSE TW_NO_LEGACY_PROPS TW_NO_REBOOT_BOOTLOADER TW_NO_REBOOT_RECOVERY TW_NO_SCREEN_BLANK TW_NO_SCREEN_TIMEOUT TW_NO_USB_STORAGE TW_OEM_BUILD TW_ROUND_SCREEN TW_SECONDARY_BRIGHTNESS_PATH TW_THEME TW_USE_MODEL_HARDWARE_ID_FOR_DEVICE_ID TW_USE_NEW_MINADBD TW_USE_TOOLBOX TW_Y_OFFSET TWHAVE_SELINUX TWRP_EVENT_LOGGING TWRP_INCLUDE_LOGCAT Upload 0% Cancel Loaded/Total Mbps Time Left 1 2 3 Track your build progress CHECK Join us FAQ Which devices are supported? It supports all devices capable of installing TWRP recovery running on Android 5.1, 6, 7, 8, 8.1, 9, 10, 11, 12, 13 or 14 although Android 5.1 - 6 is on hold at the moment. How does the tool work and what do I need to build TWRP? You need the stock recovery.img, boot.img or vendor_boot.img depending on your device. The sections to take note of are: Image Type (required): You can choose recovery.img, boot.img or boot.img + vendor_boot.img depending on the stock files you wish to use. See the "Which image type should I choose" section below Android Version (required): Out tool currently supports Android 9-14 Touch drivers (optional): This is for users who have touch screen not working issues on the built TWRP. See the "Touch is not working" section below. Reduce TWRP size (optional): If the built TWRP is too large then set this to yes when rebulding else just leave the default. TWRP flags (optional): This enables you to add custom flags to your device tree. You can request more flags to be added to our list. Upload: The files you could possibly upload are boot.img, recovery.img, vendor_boot.img and patch.zip (ensure to maintain these file names). If you wish to upload multiple files, you select them all at once. What is patch.zip and how do I create it? This file is for users who wish to upload custom files or folders to the recovery > root folder in the device tree. Lets say you wish to fix touch issues by adding a vendor folder to the recovery > root folder. You simply zip the vendor folder, name it patch.zip then select it also when uploading your stock file(s) for build. Its important to keep this file as small as possible so your TWRP doesn't get too large. How can I track the TWRP build progress? You will receive a Work ID after successfully submitting your boot or recovery image. Tap the clipboard icon to copy it. Scroll down to the "Track your build progress" section, enter your Work ID and submit. Error building Tree. What do I do? Please send us a message using one of our many contact options. Ensure to include a link to the boot or recovery image which you used. Build Failed! What Next? Please send us a message using one of our many contact options. Ensure to include your Work ID and a link to the boot or recovery image which you used. Does this tool port TWRP or build from source? Unlike our Auto TWRP porter tools, this builds TWRP recovery from source first by creating your device tree then using it to build from TWRP source. Touch is not working in TWRP? If you observe that touch isn't working in your TWRP then you need to retry and ensure to supply the name(s) of your touch driver(s) in order to fix TWRP touch not working. Ensure to seprate the names by space if your device has more than one driver. To get the names of your touch drivers, install Device Info HW, launch and look under General > Touchscreen. Lets say you have novatek,nf_nt36672c , it means there are two drivers. Search under vendor and vendor_dlkm (either on your device using a root file manager or by extracting / mounting the vendor.img and vendor_dlkm.img) for files that contain the names or parts of it. For example, searching for novatek, I found oplus_bsp_tp_novatek_common.ko and searching for nt36672c, I found oplus_bsp_tp_nt36672c_noflash.ko. In this example, my touch drivers / modules are oplus_bsp_tp_novatek_common.ko and oplus_bsp_tp_nt36672c_noflash.ko so I input oplus_bsp_tp_novatek_common.ko oplus_bsp_tp_nt36672c_noflash.ko (ensure to separate multiple drivers by space) for touch drivers in the form above. If touch still doesn't work then include a patch.zip (which would contain your touch drivers in a vendor > firmware folder) when uploading your stock files. See the "How does the tool work" section above for how to create patch.zip Which image type should I choose, recovery.img, boot.img or boot.img + boot_vendor.img? Check your device's official firmware and follow the order below: If you find recovery.img then choose recovery.img and upload the file. If you don't find recovery.img (or it fails) but find boot.img then choose boot.img and upload the file. If choosing boot.img fails and you have vendor_boot.img then choose boot.img+vendor_boot.img and select both files at once when uploading. Device Stuck in fastboot after flashing TWRP? If you get stuck in fastboot after flashing TWRP then run the command fastboot reboot fastboot . If this doesn't get you into TWRP then flash back the stock image (i.e boot, recovery or vendor_boot) used to build TWRP How do I flash TWRP as recovery.img, boot.img or vendor_boot.img? For recovery.img and vendor_boot.img, you flash the recovery.img to the recovery partition or vendor_boot.img to the vendor_boot partition in fastboot / fastbootD and power off then boot into recovery mode using button combo (Volume up + Power). For boot.img, you boot TWRP using the command fastboot boot boot.img. Once in TWRP, navigate to Advanced then choose Flash Current TWRP. Reboot to system once this is done. From this point, you can enter TWRP recovery mode using adb or button combo. How do I fix TWRP is too large? If the built TWRP is too large (size too large in fastboot) then repeat the process but choose yes under Reduce TWRP Size? (optional) Device is stuck in TWRP after rebooting? This tends to happen when you flash TWRP to the boot partition or wipe data in TWRP which then requires a stock recovery or vendor_boot to complete. Flash back your stock image. Touch screen stops working after a while This is due to screen timeout. You can disable this to prevent it from reoccuring or avoid letting TWRP to sleep or lock (due to inactivity) Does the built TWRP support External SD card, OTG and encryption? SD card: Yes OTG: Yes. If its not detected when you connect then press the power button to trigger the lock screen or keep tapping buttons on the screen if you have touch. The OTG device should eventually show up. Encryption: Not yet. We're working on a way to automate this process. You could flash DFE Neo v2 in TWRP to disable forced encryption or manually modify the fstab file "You need to manually replace offsets". What is this? This means you need to take one more step before flashing the TWRP. You need to: 1. Unpack the TWRP image using Android Image Kitchen 2. Unpack the Stock image (same image type as the TWRP) using Android Image Kitchen 3. Copy the following from Stock split_img to TWRP split_img (* could be vendor_boot, recovery or boot): *.img-base *.img-board *.img-dtb_offset *.img-kernel_offset *.img-ramdisk_offset *.img-tags_offset 4. Repack the TWRP and flash What I have is recovery_ramdisk.img (image type recovery.img) but it fails at building tree You need to make a few modifications to the recovery_ramdisk image after unpacking using Android Image Kitchen namely 1. Add values for ro.product.board and ro.board.platform to the prop.default 2. Unpack the other images (with recovery or kernel in the name) in Android Image Kitchen and search for recovery.fstab. Copy this fstab file to ramdisk > system > etc 3. Repack the image and use our tool again How do I convert the TWRP into an Odin-flashable tar? Install 7zip Right-click the TWRP and select 7-zip > Add to archive Change Archive format to tar Click OK How do I report bugs or issues? Please contact us by clicking the chat bubble at the bottom-right corner. Ensure to state the issue clearly, mention your device model, Android version and provide a link to your boot or recovery image.'''
