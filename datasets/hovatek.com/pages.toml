["https://www.hovatek.com/blog/my-experience-rooting-the-t-mobile-revvl-6-5g"]
title = "My Experience rooting the T-Mobile Revvl 6 5G – Hovatek Blog"
description = "The T-Mobile Revvl 6 5G is a Mediatek MT6833 Dimensity 700-powered smartphone with an Android 12 Operating System. The client’s goal was to root"
full_description = "My Experience rooting the T-Mobile Revvl 6 5G 3 Comments / By Enigma / Last Updated On: January 9, 2024HomeTipsMy Experience rooting the T-Mobile Revvl 6 5G The T-Mobile Revvl 6 5G is a Mediatek MT6833 Dimensity 700-powered smartphone with an Android 12 Operating System. The client’s goal was to root; unlocking the bootloader first and then rooting.Unlocking the BootloaderJust to test, I tried unlocking the bootloader using fastboot but none of the commands worked. I had to turn to bootloader unlocking using MTK Client.Entering BROM ModeTo use MTK Client, you need to get this model into BROM. To force the T-Mobile Revvl 6 5G into BROM mode, you power off, hold the volume decrease button then connect to the PC.Once the Bootloader is unlocked, your screen will show a warning on every boot;dm-verity corruptionYour device is corrupt.It can’t be trusted and may not work properly.Press power button to continue.Or device will power off in 5s dm-verityThis is normal and your device should boot up fine once you press the power button. If you’re stuck in a boot loop then you must have forgotten to wipe user data after unlocking the bootloader so run this command in the MTK client command line:py -3 mtk e metadata,userdataExtracting boot imageThe plan was to root using magisk manager so the boot.img needed to be extracted from the phone. I chose to extract only the boot.img. The command was:py -3 mtk r boot_a bootIf you wish to backup other partitions then here’s a list of partitions for this modelmiscparaexpdbfrpnvcfgnvdatavbmeta_avbmeta_system_avbmeta_vendor_avbmeta_bvbmeta_system_bvbmeta_vendor_bmetadatapersistprotect1protect2seccfgotpmd1img_aspmfw_api_img_adpm_ascp_asspm_amcupm_agz_alk_aboot_avendor_boot_adtbo_atee_asec1proinfoefusenvramboot_paralogomd1img_bspmfw_bpi_img_bdpm_bscp_bsspm_bmcupm_bgz_blk_bboot_bvendor_boot_bdtbo_btee_bsuperuserdataflashinfo T-Mobile Revvl 6 5G partitiionsIt is important to note that backing up large partitions using MTK Client can be very slow so a better approach is to use the payload command to disable security and then (with the phone still connected), do a readback using WWR. The payload command ispy -3 mtk payloadArmed with the boot file, I renamed it to boot.img, then the client patched it using the latest version of Magisk Manager (as at this post) and copied it back to the PC.Rooting the T-Mobile Revvl 6 5GRooting models -like this- which have fastbootD is done by flashing the magisk-patched boot in fastbootD instead of fastboot. You need to have set up adb and fastboot already.To get into fastbootD from ADB, you run the following commands:adb devices adb reboot-bootloader fastboot devices fastboot reboot fastbootWait till the device enters fastbootD. Assuming the magisk-patched boot is named magiskboot.img, your flashing command would look like this:fastboot flash boot magiskboot.img fastboot rebootCheck for root in Magisk Manager once the device boots to the home screen.How to bypass FRP on T-Mobile Revvl 6 5GIf you ever need to bypass Factory Reset Protection (FRP) on this model then you can easily achieve this by wiping the frp partition then rebooting. The command to bypass FRP is:py -3 mtk e frp"
