description = "Create your own computer roleplaying game from scratch. Everything you need: step-by-step expert instructions, code, graphics and resources. Start today!"
full_description = '''I'm going to help you make your dream computer roleplaying game. The book "How to Make an RPG" takes you from zero to a SNES-era RPG masterpiece. The package includes the digital book, over two-hundred example projects, over $2500 worth of art for your game and full access to the C++ code for the underlying opensource engine. Want to make your own SNES-style retro RPG but don't know where to start? This is the book for you! It takes you from nothing to a professionally finished RPG. This is your chance to make your awesome idea a reality, stop watching from the sidelines and make it happen. Go from displaying a single image, to an entire fantasy world. We'll cover the three pillars of RPGs; exploration, combat and questing. The boring stuff is taken care of so you can concentrate on making an RPG, not writing boilerplate code for communicating with your graphics card or kerning fonts correctly. A fast game engine is provided, including the source. If you want dig into the hardcore C++ code and tweak it - you can! Everything you make, you own; to sell or giveaway as you wish - it's yours - go wild! You'll learn the fundamentals - After reading the book, you'll be able apply the lessons to any platform or language. The book uses Lua code; the game industry standard scripting language. In fact, we'll be using a special version called LuaJIT which is tuned for speed. Lua is elegant, extremely fast and quick to learn. Games from Fable to World of Warcraft use it, with good reason. You've played SNES-era RPGs like Final Fantasy 6, Chrono Trigger, Secret Of Mana, Phantasy Star and I'm sure you've thought "This would be better if...". With this book you'll be able to act on that thought and create your own worlds, characters and epic plots. If you ever wanted to make an RPG you should. Do you want to passively play RPGs, or do you want to create one? Make your own original piece of work, your own take on the RPG - it would be a shame if you never gave it a go! Try the book out and if you’re not completely satisfied, I’ll give you a full refund. No questions asked.'''
