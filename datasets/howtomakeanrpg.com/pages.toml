read full article. Polish 04 - Stat Numbers This is the fourth article in a series that takes the RPG from the “How to Make an RPG” project and adds a little more polish to one element. In the previous… Click to read full article. Designing a Realtime Combat System Combat in an action RPG aka ARPG seems simple; avoid enemy attacks while dishing out your own but even a simple system is made up of many design decisions! In this article… Click to read full article. Polish 03 - Combat Numbers This is the third article in a series that takes the RPG from the “How to Make an RPG” project and adds a little more polish to one element. In the previous… Click to read full article. Free JRPG Art: Skeleton Warriors It’s hard to find high quality free art for your games. The How to Make an RPG book comes with a nice selection of art but it’s definitely lacking in the undead… Click to read full article. Customizing the "Dungeon" RPG The How to Make an RPG book teaches you how to make three different small RPGs. The first RPG, called “Dungeon”, tasks the player with escaping a dungeon after being captured. Once… Click to read full article. Polish 02 - Bitmap Numbers This is the second article in a series that takes the final RPG code from the “How to Make an RPG” project and adds a little more polish to one element. The… Click to read full article. Where to Get Art for Your Game You’ve got three main options when it comes to procuring game art: - Make it yourself Click to read full article. Polish 01 - Cutscene Dialog Skipping The book “How to Make an RPG” shows you step-by-step how to make three fully featured RPGs. In this article we’ll add a little polish the dialog code that’s used in the… Click to read full article. How to Make an RPG: Release! The How to Make an RPG project is now at a state where it’s ready for public release. You can buy it here. Click to read full article. RPG Conversation: Never Winter Nights Implementation Part II In the previous article we used the How