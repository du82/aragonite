title = "RPG Conversation: Never Winter Nights Implementation Part I"
full_description = '''« RPG Conversation: Never Winter Nights Implementation Part II RPG Conversation: Never Winter Nights » In a previous article we looked at the Never Winter Nights conversation system and broke it down a little. In this article we’ll implement a similar system using one of the How to Make an RPG examples projects as a base. This a long and pretty technical article. Even a little dry in places but it tells you all you need to know to make a graph based conversation system. Never Winter Nights structures it’s conversation using a graph. The nodes represent NPC speech and PC replies. Some of the nodes have annotations that may: Determine if the node appears. Alter the game state. For instance, imagine a game where you’re talking to a shady politician and have some blackmail. Because you have the blackmail a special conversation option appears that makes him give you an item to keep you quiet. Once he gives you the item the game needs to record this has happened so he only gives it you once. We can design this interaction using node annotations and altering game state. Setting Up the Project The conversation structure is pretty simple. We could implement it in pure Lua but it’s more fun to use real game code. I’ll be using a modified example from the How to Make an RPG book. The example is from the last chapter of the book. It’s been modified so the hero character is in a small room with the major. Prerequisites This example jumps into to a full codebase. If you’re not an experienced programmer then it might a bit hard to follow fully. The code uses: StateMachines (or actually a state stack) Tweening functions A small amount of vector math The Starting Room The starting point for the implementation looks like this screenshot: This starting area contains a single NPC. We’ll add some NWN style dialog to this NPC. When we talk to someone the conversation UI takes up the bottom half of the screen. We want the person we’re speaking with to appear in the center of the top half of the screen. Therefore when entering a conversation we’ll position the camera to center on the speaker as shown below. The How to Make an RPG codebase uses a stack of states to control gameplay. Most gameplay occurs in the ExploreState which let’s the player move a character around a map. We’ll create a new state to handle conversations, that we’ll call DialogState. Let’s create the DialogState class and push an instance of it on global state stack when the player interacts with the NPC. NPC interaction is done via a trigger object, defined and added in the map file. First, we set the trigger, by editing the map file; as shown below. -- This is in map_town.lua. The map file for where our dialog takes place function CreateTownMap(state) local id = "town" local townState = state.maps[id] local OnTalk = function(map, trigger, entity, x, y, layer) -- We haven't created this state yet but here's the code to push it -- on the stack local dialogState = DialogState:Create() gStack:Push(dialogState) end return { -- code omitted on_wake = { { id = "AddNPC", params = {{ def = "npc_major", id ="major", x = 5, y = 4 }} }, }, actions = { talk_action = { id = "RunScript", params = { OnTalk } }, }, trigger_types = { talk = { OnUse = "talk_action" }, }, triggers = { -- tile 5, 4 is where the NPC is standing { trigger = "talk", x = 5, y = 4 }, }, -- code omitted This code creates a trigger that runs a function called OnTalk when the player interacts with the NPC. The OnTalk function creates a DialogState and pushes it in on the global stack. This DialogState is where we’ll create the Never Winter Nights style conversation. Starting Conversations and Focusing the Camera The DialogState centers the camera on the speaker, let’s the player navigate the conversation graph and then restores the camera when the state is exited. The conversation UI is made of two panels at the bottom of the screen. As the camera moves to the speaker the panels fade in. The transition takes 0.3 seconds so it feels nice and snappy. The image below shows the panels correctly positioned. Next let’s write the camera movement code and the code to render the UI panels. I could do something fancy with nested states here but to make things simple the transitions are handled manually. The code is quite lengthy so let’s start with just the constructor. DialogState = {} DialogState.__index = DialogState local eMode = { Entering = "Entering", Running = "Running", Exiting = "Exiting" } function DialogState:Create(dialogDef) local this = { mMode = eMode.Entering, mDef = dialogDef, -- Code for the in/out transition mTransTween = nil, mTransDuration = 0.3, -- seconds mCamDiff = Vector.Create() } local layout = Layout:Create() layout:Contract('screen', 32, 20) layout:SplitHorz('screen', 'top', 'bottom', 0.5, 1) layout:SplitHorz('bottom', 'dialog', 'response', 0.4, 1) this.mLayout = layout self.mPanels = { layout:CreatePanel("dialog"), layout:CreatePanel("response") } setmetatable(this, self) return this end Mode Enum Before defining the constructor we set up the equivalent of a Lua enum; eMode. There are three modes: Entering - the enter transition. Exiting - the exit transition. Running - the state executing as normal. In the Entering and Exiting modes all input is ignored. When the Running mode is entered the player can interact with the conversation. DialogState Constructor The constructor takes in a def parameter which will contain the conversation graph. We store the def in the this table and store the current mode, mMode as Entering. We finish setting up the this table by adding the transition variables: a tween, a duration and a vector to track the camera movement. To create the UI we use a special layout class. The layout class helps us quickly divide the screen into panels. After the layout operations we end up with two panels; “dialog” and “response”. These are both positioned in the bottom half of the screen. The panels are stored in the this table as mPanels and the layout object is stored as mLayout. We’ll use the layout object later to align text inside the panels. Next let’s implement the Enter and Exit functions. These set up the in and out transitions for the state. function DialogState:Enter() self.mMode = eMode.Entering self:InitEnterTransition(self.mDef.speakerX, self.mDef.speakerY) end function DialogState:InitEnterTransition(x, y) -- Find the follow state -- and tell the camera to stop following the player local explore = self:FindExploreState() self.mExploreState = explore explore:SetFollowCam(false) -- Store the original camera position for the player -- We'll restore this when we exit the dialog local pos = explore.mHero.mEntity.mSprite:GetPosition() self.mOriginalCamPos = Vector.Create() self.mOriginalCamPos:SetX(math.floor(pos:X())) self.mOriginalCamPos:SetY(math.floor(pos:Y())) -- Store the target position for the NPC camera alignment self.mNPCCamPos = Vector.Create() -- To center the NPC in the top half of the map we get it's pixel position -- Then add 0.25 of the height of the window local pX, pY = explore.mMap:GetTileFoot(x, y) self.mNPCCamPos:SetX(math.floor(pX)) self.mNPCCamPos:SetY(math.floor(pY + System.ScreenHeight() * 0.25)) -- Set the camera to start in the original camera position explore.mManualCamX = self.mOriginalCamPos:X() explore.mManualCamY = self.mOriginalCamPos:Y() -- Set up the transition tween and the different vector -- between where the camera is and where we want it to be self.mTransTween = Tween:Create(0, 1, self.mTransDuration, Tween.EaseOutQuad) self.mCamDiff = self.mOriginalCamPos - self.mNPCCamPos -- Set the UI alpha self:SetUIAlpha(0) end function DialogState:InitExitTransition() self.mTransTween = Tween:Create(1, 0, self.mTransDuration, Tween.EaseOutQuad) end function DialogState:FindExploreState() -- Don't have a great way to get access to this at the moment. local exploreState = nil for k, v in ipairs(gStack.mStates) do if v.__index == ExploreState then exploreState = v break end end return exploreState end function DialogState:Exit() self.mExploreState:SetFollowCam(true) -- restore the follow cam end OnEnter OnEnter is called when the DialogState is pushed on the stack. This sets the mode to Entering and initializes the in-transition by calling InitEnterTransition with the NPC tile position. InitEnterTransition The InitEnterTransition moves the camera so the NPC is centered in the top half of the screen and fades in the UI. Camera movement is normally controlled by the ExploreState. FindExploreState returns the ExploreState from the global stack. We tell it to stop updating the camera, as we want to control it during the conversation. We store the current position of the camera, so when the DialogState exits we can restore it’s original position. To a camera position that centers the top of the window on the NPC; we get NPC position in world space and add on half the window height. With the two positions defined, we calculate the difference as a vector and store it in mCamDiff. Then we setup a tween to move the camera between the two positions. At the end of the InitEnterTransition function we call self:SetUIAlpha(0) to make the panels invisible. As we write more of the code this SetUIAlpha function will update the alpha of all additional UI elements. InitExitTransition The next function defined is InitExitTransition. We call this function when we want to exit the state. It returns the camera to the original position and fades out the UI. All the required camera positions have already been set by InitEnterTransition function. To set up the exit transition we just create a new tween that goes from 1 to 0. FindExploreState We’ve already made use of FindExploreState. It iterates through the global stack until it finds the ExploreState. OnExit The OnExit function tells the ExploreState to use the camera to resume following the hero character. OnExit is guaranteed to be called before the DialogState is removed from the stack. Updating the camera code here ensures we don’t end up with a stuck camera that doesn’t follow the hero! Right, let’s write everything else. function DialogState:Update(dt) -- Update the camera position self.mExploreState:UpdateCamera(self.mExploreState.mMap) if self.mMode == eMode.Entering then self:UpdateEnter(dt) elseif self.mMode == eMode.Running then self:UpdateRun(dt) elseif self.mMode == eMode.Exiting then self:UpdateExit(dt) end end function DialogState:UpdateEnter(dt) if self.mTransTween:IsFinished() then self.mMode = eMode.Running return end self.mTransTween:Update(dt) local v01 = self.mTransTween:Value() -- Move the camera local camPos = self.mOriginalCamPos + (self.mCamDiff * v01) self.mExploreState.mManualCamX = camPos:X() self.mExploreState.mManualCamY = camPos:Y() -- Fade in the dialog box self:SetUIAlpha(v01) end function DialogState:SetUIAlpha(a01) local color = Vector.Create(1, 1, 1, a01) -- Set the panels alpha for _, v in pairs(self.mPanels) do v:SetColor(color) end end function DialogState:UpdateRun(dt) end function DialogState:UpdateExit(dt) if self.mTransTween:IsFinished() then gStack:Pop() return end self.mTransTween:Update(dt) local v10 = self.mTransTween:Value() local camPos = self.mOriginalCamPos + (self.mCamDiff * v10) self.mExploreState.mManualCamX = camPos:X() self.mExploreState.mManualCamY = camPos:Y() self:SetUIAlpha(v10) end function DialogState:HandleInput() -- only accept input when no transition is running. if self.mMode ~= eMode.Running then return end if Keyboard.JustPressed(KEY_SPACE) then self:InitExitTransition() self.mMode = eMode.Exiting end end function DialogState:Render(renderer) for _, v in pairs(self.mPanels) do v:Render(renderer) end end Update The state has three modes. In the Update function we update the camera then call a different functions depending on the current mode. UpdateEnter UpdateEnter is the update function called when we’re entering the state. We first check if the transition tween is finished and if so, change the mode to Running and immediately return. If the transition tween hasn’t finished we update it and store it’s value in v01. We then multiply the camera difference vector by v01 and add it to the original camera position. This moves the camera towards the NPC. We also set the alpha for the UI according to the v01 value; fading it in. SetUIAlpha The SetUIAlpha function takes in an alpha value in the range 0 to 1. 0 is transparent 1 is opaque. For now it sets the color of each panel to white with the given alpha value. We’ll be updating this function as we add more UI elements. UpdateRun The UpdateRun function is called when the dialog is running and the player can interact with the conversation graph. There’s nothing we need to do here now. UpdateExit The UpdateExit function restores the camera and fades out the UI elements. If first checks if the transition tween is finished, if so it pops the dialog state off the stack, returning the game to the ExploreState. If the transition tween isn’t finished, it’s updates it and uses it’s value to move the camera and fade the UI. HandleInput The HandleInput function returns immediately unless the mode is set to Running. It checks if the Space key has been pressed and, if so, starts the exit transition. A DialogState with Transitions That’s the complete transition code for the DialogState. Check out how it looks below: Now we’ve got the skeleton up and running, let’s add a little meat. The Dialog Interface The interface seems simple. There are two panels; the dialog panel for the NPC and the responses panel for the PC. We’re going to assume the NPC dialog always fits in the top box. The bottom box contains a list of responses or a “Press Space to Continue” message in the case of a node with no responses. Before processing the conversation graph let’s write the code to display a node. First we’ll extend DialogState with a currentNode table. This table contains the dialog text and an optional list of responses. The current node table looks something like this: currentNode = { text = "Hello, I'm an NPC. Doing some talking.", responses = { { text = "Hello." }, { text = "Goodbye." } } } The dialog text is just a string but each reply is a table. The replies are tables because they may include some metadata. We assume the list of replies is filtered already (if there’s a reply that requires you to have >15 charisma or something it’s already been removed). Displaying a Conversation Node We’ll use a Selection menu, from the How to Make an RPG book to manage and render the replies. The selection menu is a UI element that displays a list of options and lets the player scroll through and pick one. In the DialogState we’ll add a special MoveToNode function that sets the current node data and creates the selection menu for the replies. Let’s start by updating the constructor. function DialogState:Create(dialogDef) local this = { -- code omitted -- Code for display mCurrentNode = {}, mReplyMenu = nil, mAreThereReplies = false, mNoRepl'''
