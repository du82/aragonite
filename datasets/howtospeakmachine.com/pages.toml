["https://howtospeakmachine.com/2019/06/02/quant-is-the-scaffolding-qual-is-the-clay"]
title = "Quant is the scaffolding. Qual is the clay. – How To Speak Machine 📘: Computational Thinking For The Rest Of Us"
description = "by John Maeda"
full_description = "Quant is the scaffolding. Qual is the clay. “After many engagements leading ethnographic investigations, the analogy I often used with clients is that the Quant is the scaffolding … the Qual (or thick data) is the clay.I bias toward the latent side of Qual where ethnographic, contextual inquiry, and anthropological observations play in. The Quant informs strategy and prioritization based on conclusive, statistically significant evidence. The Qual informs the substance of the product experience. We often drew this as two inverted triangles from one another, balancing small “n” and large “N” — a shallow depth of insight (conclusive) with deep insight (latent).”—Kevin Bethune Sign up for the Resilience Tech Briefing with no more than 2022 characters, zero images, and all in plain-text. #mc_embed_signup{background: none; clear:left; font:14px Helvetica,Arial,sans-serif; width:100%;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ As a small courtesy the a few PDF links will be sent to you soon after you sign up! —@johnmaeda via Kevin Bethune / On Quant vs Qual … Post date June 2, 2019 Posted in Uncategorized Previous post: Speed × Thoughtfulness Next post: How To Speak Machine in the UK"
