description = "by John Maeda"
full_description = "Paul Baran: Distributed Networks In 1962, U.S. authorities considered ways to communicate in the aftermath of a nuclear attack. How could any sort of “command and control network” survive? Paul Baran, a researcher at RAND, offered a solution: design a more robust communications network using “redundancy” and “digital” technology.—Rand Corp “The nodes would use a scheme he called ‘hot-potato routing’ or distributed communications.” “Around December 1966, I presented a paper at the American Marketing Association called ‘Marketing in the Year 2000.’ I described push-and-pull communications and how we’re going to do our shopping via a television set and a virtual department store. If you want to buy a drill, you click on Hardware and that shows Tools and you click on that and go deeper.”—Paul Baran Sign up for the monthly #DesignInTech Briefing Post date January 1, 2019 Posted in Uncategorized Previous post: How The Internet Works Next post: How To Speak Machine: Computational Thinking For The Rest Of Us Leave a Reply Cancel replyComment * Name * Email * Website The unpublished, third iteration of How To Speak Machine’s introduction section Post date May 1, 2019"
