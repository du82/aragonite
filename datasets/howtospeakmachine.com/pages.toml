["https://howtospeakmachine.com/2019/04/05/lavoisier-and-combustion"]
title = "Lavoisier and Combustion – How To Speak Machine 📘: Computational Thinking For The Rest Of Us"
description = "by John Maeda"
full_description = "Lavoisier and Combustion “[Lavoisier] believed that the energy came from a process known as respiration, which turned oxygen into carbon dioxide and heat, the same way a burning piece of wood might.” —Smithsonian “Antoine-Laurent Lavoisier is considered the father of modern chemistry, and he was among the first to relate this science to physiology by exploring the ideas of metabolism and respiration. Lavoisier placed a guinea pig into an ice calorimeter – a container inside another insulated container filled with ice. The amount of ice that melted would be a measure of the heat given off by the guinea pig. Through this experiment, Lavoisier was able to demonstrate that respiration was a form of slow combustion. Decades ahead of his colleagues, Lavoisier theorized that nutrients play a part in metabolism and respiration. He began to investigate how the body converts food into tissues before his death in 1794. Nevertheless, Lavoisier’s work laid the foundation for later investigations of the role of food in the human body.” —U of Missouri Libraries Post date April 5, 2019 Posted in Uncategorized Previous post: There are three kinds of design — but one is most important. Next post: Corbato and Daemons Leave a Reply Cancel replyComment * Name * Email * Website"
