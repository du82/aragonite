full_description = "Swear at the computer for better service When my colleague Alexis Lloyd told me about this patent that routes you to a human operator if you start swearing at the machine caller, A call processing apparatus comprises a device for answering an incoming call, an interactive voice unit for eliciting information about the call from the customer, a device for analyzing the caller’s response according to predetermined criteria to identify callers having certain behavioral characteristics, and a device for routing callers identified as having these characteristics to predetermined attendant stations. The apparatus therefore permits caller’s having special needs to be automatically routed to suitably trained attendants.USPTO I cursed not knowing about it sooner. It’s nice to know how to save time when talking with a 🤖 … too bad you’ve got to call on your dark side for it, though. —JM Sign up for the Resilience Tech Briefing with no more than 2022 characters, zero images, and all in plain-text. #mc_embed_signup{background: none; clear:left; font:14px Helvetica,Arial,sans-serif; width:100%;} /* Add your own Mailchimp form style overrides in your site stylesheet or in this style block. We recommend moving this block and the preceding CSS link to the HEAD of your HTML file. */ As a small courtesy the a few PDF links will be sent to you soon after you sign up! —@johnmaeda Post date June 2, 2019 Posted in Uncategorized Previous post: The Sorcerer’s Apprentice Next post: Speed × Thoughtfulness The unpublished, third iteration of How To Speak Machine’s introduction section Post date May 1, 2019"
