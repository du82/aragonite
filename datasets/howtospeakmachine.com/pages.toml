["https://howtospeakmachine.com/2019/04/23/talk-data-to-me-or-first-party-data-vs-second-party-data-vs-third-party-data"]
title = "Talk data to me. Or, First Party Data vs Second Party Data vs Third Party Data – How To Speak Machine 📘: Computational Thinking For The Rest Of Us"
description = "by John Maeda"
full_description = "Talk data to me. Or, First Party Data vs Second Party Data vs Third Party Data I got lost down a rabbit hole with respect to data terminology. To get this all straight, here’s my take on the matter: First party data is what you collect and control. It’s the data that you grow yourself, or to use a produce analogy it’s your backyard garden. Second party data is what someone else collects and controls. Or said differently, someone else’s “first party data.” In the post-GDPR world, second party data is considered much more healthy than third party data. It’s like buying produce directly from the farm instead of through a supermarket or foodstore chain. Third party data is the stuff that’s aggregated and comes from gigantic data aggregators out there. This is the kind of run-of-the-mill data that anybody with a wad of cash can buy, and doesn’t provide an unfair advantage. In the post-GDPR world, third party data is under greater scrutiny — in other words it needs to use a produce analogy it needs to be sure that the data doesn’t include salmonella. Post date April 23, 2019 Posted in Uncategorized Previous post: 60mph versus the speed of light Next post: Instrumentation and Erika Hall’s Admonition Leave a Reply Cancel replyComment * Name * Email * Website Dr. Gertrude Blanch and the Works Progress Administration (WPA) Mathematical Tables Project Post date February 23, 2019"
