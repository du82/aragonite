["https://howtospeakmachine.com/2018/11/24/when-computing-was-scarce"]
title = "When Computing Was Scarce – How To Speak Machine 📘: Computational Thinking For The Rest Of Us"
description = "by John Maeda"
full_description = "When Computing Was Scarce According to the 1960s timeline from the Smithsonian: “In 1964, the number of computers in the United States has grown to seventeen thousand (up from fifteen in 1954).” Frank Loesser and Abe Burrows win the 1962 Pulitzer Prize for Drama with How to Succeed in Business without Really Trying.In 1963, the Equal Pay Act, the first federal law against sexual discrimination, is passed by Congress, requiring the payment of equal compensation to women and men doing jobs calling for substantially equal skill, effort, and responsibility.In 1963, a direct telephone link, the “hot line,” is established between the White House and the Kremlin.In 1964, the omnibus Civil Rights bill is passed banning discrimination in voting, jobs, and accommodations. The same year the Civil Rights Act is passed, forbidding discrimination on the grounds of religion, race, ethnicity, and sex.In 1964, the number of computers in the United States has grown to seventeen thousand (up from fifteen in 1954). “In 1967, a Senate subcommittee hears testimony predicting that by 1985, Americans will work twenty-two hours each week, twenty-seven weeks a year, or they will retire at thirty-eight years old.” In 1967, a Senate subcommittee hears testimony predicting that by 1985, Americans will work twenty-two hours each week, twenty-seven weeks a year, or they will retire at thirty-eight years old.In 1969, the first man lands on the moon.In 1969, approximately 225 million telephones are in service in the world, 114 million of which are in the United States. Timeline 1960First commercial computer with keyboard input and monitor to display entered material–the PDP-1–introducedQuickborner management consulting group begins to develop the “office landscape” concept, with workspaces organized to reflect flow of information and communications patternsHalogen lamp introduced1961IBM introduces Selectric typewriter, in which characters are printed on paper by a rotating ball while the carriage remains fixed1962Philips introduces the “Compact Cassette” for recording sound on magnetic tapeFirst “personal computer” intended for a single researcher developed by Digital Equipment Corporation and MIT’s Lincoln Laboratory. Each LINC computer cost $43,000.World’s first telecommunications satellite, Telstar, in orbit, creating worldwide communications network for handling telephone, television, and data transmission1963First push-button telephones introducedFiber-tip pen developed in Japan by Pentel, initially using a bamboo inner barrel to feed ink into the fiber tip (1966, bamboo barrel was replaced by a bundle of acrylic fibers that transferred ink to the tip by capillary action)1964Robert Propst and George Nelson of Herman Miler introduce “Action Office” freestanding units1969ARPANET, the “Mother of the Internet,” is begun as a U.S. government experiment linking researchers with remote computer centers and allowing them to share hardware and software resources And in the 1990s timeline: “In 1994, the Internet reaches nearly twenty-five million computer users (an increase from 213 registered computers in 1981).” Post date November 24, 2018 Posted in How To Speak Machine Previous post: Memory & Storage Next post: The Venerable Electromechanical Mouse Leave a Reply Cancel replyComment * Name * Email * Website"
