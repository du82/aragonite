title = "First Use Of The Word “Computer” – How To Speak Machine 📘: Computational Thinking For The Rest Of Us"
description = "by John Maeda"
full_description = "First Use Of The Word “Computer” English author Richard Braithwaite in his 1613 book, The Yong Mans Gleanings, is reputed to have used the first instance of the word “computer” as describing a human who’s good at maths: WHat art thou (O Man) and from whence hadst thou thy beginning? What matter art thou made of, that thou promisest to thy selfe length of daies: or to thy posterity continuance. I haue read the truest computer of Times, and the best Arithmetician that euer breathed, and he reduceth thy dayes into a short number: The daies of Man are threescore and ten. where Braithwaite is describing someone who’s good at arithmetic as a “computer.” Post date February 24, 2019 Posted in Uncategorized Previous post: Winifred “Tim” Asprey Next post: The Words “Computer” and “Computational” in 1895 Leave a Reply Cancel replyComment * Name * Email * Website"
