title = "Why Computers Crash – How To Speak Machine 📘: Computational Thinking For The Rest Of Us"
description = "by John Maeda"
full_description = "Why Computers Crash Although crashes caused by hardware are possible, most computer crashes are caused by errors in the OS software.SciAm There are 3 fundamental types of computer program errors that are related to when/how the error is discovered: Compile-time errors, Run-time errors, and “silent” errors. Runtime errors are the ones that result in crashes that you see as a user.Software Explained List from Quora Null Pointer ExceptionFunction has bad inputsRead/write past boundaries of an array or tap into a non-existent arrayWrite to a string that doesn’t have memory allocated (like #3)Pointer doesn’t point to a valid placeFiles or ports or connection handles are bad — in which case we use defensive programming to prepare for worse caseSomething mathematical is wrong like divide by zeroCode is trying to extend beyond its system permissionsSystem is out of memoryMemory leaks are causing #9Bad library — bug introduced from other codeMalicious hackers have taken over your computer List from MakeUseOf that is more hardware-y Bad memory or motherboardBIOS settings at hardware levelCorrupt registryIncorrect or corrupt driversHard drive issuesHardware conflictsVirusPower issuesOverheating Post date November 26, 2018 Posted in How To Speak Machine Previous post: Recursion (noun). If you still don’t get it, see recursion. Next post: Is The Local Maximum Good Or Bad? 1 Comment Add Yours → Lance says: December 28, 2018 at 10:06 am Computer errors are fascinating. A lifetime of learning to master. I loved reading in The New Yorker about the early Google days where Jeff Dean and Sanjay Ghemawat pair-debugged an issue in their search results from software layer all the way down to a bit-flip from natural causes. (Reference.) trange environmental factors came into play. When a supernova explodes, the blast wave creates high-energy particles that scatter in every direction; scientists believe there is a minute chance that one of the errant particles, known as a cosmic ray, can hit a computer chip on Earth, flipping a 0 to a 1. The world’s most robust computer systems, at nasa, financial firms, and the like, used special hardware that could tolerate single bit-flips. But Google, which was still operating like a startup, bought cheaper computers that lacked that feature. Reply Leave a Reply Cancel replyComment * Name * Email * Website"
