description = "by John Maeda"
full_description = "Wolfram’s Rule 30 and the Conus Textile It’s the hard to beat the eery feeling of studying Wolfram’s Rule 30. Just eight rules applied to a one-dimensional cellular automata generate a pattern that bears a profound resemblance to the Conus Textile snail’s shell. And when you study the simple variants it’s all quite compelling to just think about. Just visit http://atlas.wolfram.com/01/01/30/ to see more. —JM An associated video I made for my YouTube channel: https://www.youtube.com/watch?v=K_NDgT_0svU https://youtube.com/johnmaedaislearning Post date December 23, 2018 Posted in How To Speak Machine Previous post: Is The Local Maximum Good Or Bad? Next post: How The Internet Works Leave a Reply Cancel replyComment * Name * Email * Website"
