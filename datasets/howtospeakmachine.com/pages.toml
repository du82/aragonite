["https://howtospeakmachine.com/2018/12/22/is-the-local-maximum-good-or-bad"]
title = "Is The Local Maximum Good Or Bad? – How To Speak Machine 📘: Computational Thinking For The Rest Of Us"
description = "by John Maeda"
full_description = "Is The Local Maximum Good Or Bad? Local maxima create value while iterating cheaply, but innovation requires the costly pursuit of global maxima. Nat Eliason eloquently writes about the value of escaping the local maximum: When you diversify your skill set, you define a new maxima and stop competing for the local ones determined by common skill sets.—Nat Eliason On the other hand Samuel Hulick does a fantastic job writing in praise of the local maximum: Running up against a local maximum should be a goal, not something to be scared of. Infinite possibilities = no global maximum.—Samuel Hulick There’s a good piece by Rian van der Merwe that has a nuanced take on the local maximum and Apple’s approach to product development: From an engineering perspective, variation is expensive, iteration is cheap. First, spend as much time and money as you can afford on variation upfront, because if you move into the wrong neighborhood, it’s really hard to change that later on. Second, don’t move to a new neighborhood until you’re absolutely sure that you’ve hit the local maximum right where you live.—Rian van der Merwe So the answer is, like my HR VP used to always tell me, “It depends.” If I were to summarize my findings: Local maxima create value while iterating cheaply, but innovation requires the costly pursuit of global maxima. Photo by Tim Marshall on Unsplash. Post date December 22, 2018 Posted in Uncategorized Previous post: Why Computers Crash Next post: Wolfram’s Rule 30 and the Conus Textile Leave a Reply Cancel replyComment * Name * Email * Website Dr. Gertrude Blanch and the Works Progress Administration (WPA) Mathematical Tables Project Post date February 23, 2019"
