["https://howtospeakmachine.com/2019/04/23/60mph-versus-the-speed-of-light"]
title = "60mph versus the speed of light – How To Speak Machine 📘: Computational Thinking For The Rest Of Us"
description = "by John Maeda"
full_description = "60mph versus the speed of light I wanted to know how many Moore’s Law-style doubling cycles it would take to make 60mph as fast as the speed of light. Apparently in 1899 an electric (!) car broke the 60mph barrier. So if we calculate this a bit, I found that between 23 and 24 doubling cycles is when it would have gone at light speed. That places it somewhere in 1922 if you believe in doubling every year or 1934 if you believe in doubling every 1.5 years. So let’s call it at 1925. “In 1925, due to exponential advances in vehicle technology a car handily broke the lightspeed barrier.”—Purely fictional >>> 60*(2**23) 503316480 Okay. We’re close! >>> 60*(2**24) 1006632960 Post date April 23, 2019 Posted in Uncategorized Previous post: .01% improvements every second Next post: Talk data to me. Or, First Party Data vs Second Party Data vs Third Party Data Leave a Reply Cancel replyComment * Name * Email * Website"
