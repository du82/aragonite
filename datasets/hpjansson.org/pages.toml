full_description = "Chafa 1.14: All-singing, all-dancingOn January 18, 2024 By Hans Petter Jansson In ComputingDear friends, comrades, partners in crime and moderate profit! I am pleased to announce the immediate availability of Chafa 1.14.0. Continue reading Balance of Power: A rematch served coldOn November 1, 2022 By Hans Petter Jansson In Computing, TechnicalA happy reunion with Chris Crawford's hit geopolitics simulator Balance of Power (1985), with gameplay and code analysis. Continue reading Adventure game graphics with DALL-E 2On August 16, 2022 By Hans Petter Jansson In ComputingIs DALL-E 2 fit for use in creative work? A case study involving pixel graphics for a point-and-click adventure game. Continue reading GNOME at 25: A health checkupOn July 23, 2022 By Hans Petter Jansson In UncategorizedAround the end of 2020, I looked at GNOME's commit history as a proxy for the project's overall health. A year and a half went by since then, and it's time for an update. Continue reading A quick textmode-themed updateOn June 9, 2022 By Hans Petter Jansson In ComputingSummer is coming and I've got a couple of posts cooking that may turn out mildly interesting, but — time constraints being what they are — in the meantime there's this. Continue reading Let it snow '21On December 21, 2021 By Hans Petter Jansson In Computing, Life, TechnicalAmidst the holidays that perhaps aren't turning out exactly as hoped, one can take comfort in small tokens of continuity – like the fact that xsnow is still being actively maintained. Continue reading Chafa 1.8: Terminal graphics with a side of everythingOn September 16, 2021 By Hans Petter Jansson In Computing, TechnicalThe Chafa changelog was growing long again, owing to about half a year's worth of slow accretion. Hence, a release. Here's some stuff that happened. Continue reading Chafa 1.6.0: WiderOn January 18, 2021 By Hans Petter Jansson In Computing, TechnicalHere's another one from the terminal graphics extravaganza dept: Chafa 1.6.0 brings fullwidth character support, so in addition to the usual block elements and ASCII art, you now get some mean CJK art too. Or grab as many fonts as you can and combine all of the Unicode into one big glorious mess. Continue reading"
