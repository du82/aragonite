description = "Read our list of policies at Historic Royal Policies and find out how we aim to keep everyone safe."
full_description = 'Start of main content { "@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [ { "@type": "ListItem", "position": 1, "name": "About us" , "item": "https://www.hrp.org.uk/about-us/" } , { "@type": "ListItem", "position": 2, "name": "Policies" } ] } Home About us Policies Policies We are a charity who looks after six palaces; Tower of London, Hampton Court Palace, Banqueting House, Kensington Palace, Kew Palace and Hillsborough Castle and Gardens. Read our list of policies on equality and diversity, safeguarding, accessibility and more. Equality and Diversity At Historic Royal Palaces, everyone should feel welcome and accepted. That means we are continually looking for ways to improve access and diversity for our visitors, staff and the services we provide. Read more about equality and diversity. Read our equality and diversity policy Gender Pay Gap Report The Government requires organisations with over 250 staff to calculate and publish the difference in average pay between all male and female employees. Read our gender pay gap information below. Read our Gender Pay Gap Report Modern Slavery Act Statement Historic Royal Palaces takes appropriate steps to ensure that slavery and human trafficking is not present within our organisation or within its supply chains. Find out more about our commitment. Read our Modern Slavery Act Statement Safeguarding We want everyone to feel welcome including children, young people and vulnerable adults. We want their experience of engaging with our palaces and their stories to be meaningful, safe and enjoyable. Find comprehensive information on safeguarding policies and procedures below. Read our Safeguarding Policies Freedom of Information The Freedom of Information Act 2000 gives rights of public access to information held by public bodies including Historic Royal Palaces. Discover which areas information covers and how to find what you need. Read our Freedom of Information Policy Supplier Manual Find out how you can work with us as a supplier and read our code of conduct. Discover our Partner and Supplier Rules Our Pension Scheme Read our statement of investment principles on how we govern decisions regarding investments for our pension scheme. View our Pension Scheme Collections and Conservation We have a responsibility to manage and conserve the buildings, collections and interiors in our care. To help us do this, we have a set of policies that explain how we manage, develop and care for our collections. Read our Collections and Conservation Policies Immunity from Seizure Part 6 of the Tribunals, Courts and Enforcement Act 2007 provides immunity from seizure for cultural objects loaned from overseas to temporary public exhibitions in approved museums or galleries in the UK where conditions are met. Read more below. Read our Immunity from Seizure Policy Accessibility We’re committed to ensuring all visitors can access our palaces. Discover the steps we take to ensure our website is as accessible as possible in our statement below, where you can also read how we work to make each palace open to everyone. Read our Website Accessibility Statement Privacy and Cookie Policy We are dedicated to keeping your personal data safe. Find out how we collect, use and share your data when you use our website, applications and other technologies. Read our Privacy and Cookie Notice Complaints Read the complaints policy below and find out more about our complaints procedure. Read our complaints policy'
