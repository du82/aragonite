full_description = '''Start of main content { "@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [ { "@type": "ListItem", "position": 1, "name": "About us" , "item": "https://www.hrp.org.uk/about-us/" } , { "@type": "ListItem", "position": 2, "name": "Conservation" , "item": "https://www.hrp.org.uk/about-us/conservation/" } , { "@type": "ListItem", "position": 3, "name": "Conserving Her Majesty Queen Elizabeth II&#x27;s baby dress" } ] } Home About us Conservation Conserving Her Majesty Queen Elizabeth II's baby dress Conserving Her Majesty Queen Elizabeth II's baby dress Watch the video of HM Queen Elizabeth II's baby dress undergoing conservation A conservator works to meticulously and carefully repair the areas of damage on the item of child’s dress belonged to HM Queen Elizabeth II. Video transcript Follow along with an interactive transcript of HM Queen Elizabeth II's baby dress undergoes conservation on YouTube. A link to open the transcript can be found in the description. This item of child’s dress belonged to HM Queen Elizabeth II. A photo from 1927 shows her wearing the dress while out with her nanny. It was brought into our conservation studio as areas of the silk were damaged. Watch the video to see how conservator Rosie Chamberlin worked to meticulously and carefully repair the areas of damage. How you can help As an independent charity we receive no funding from the Government or the Crown. We depend on our visitors, members, donors, volunteers and sponsors to help us. We know we are asking a lot at this difficult time, but if you are able to, please support us so we can continue to protect these spaces and the objects in our care. Donate'''
