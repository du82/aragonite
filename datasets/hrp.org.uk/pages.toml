["https://hrp.org.uk/about-us/conservation/treatment-conservation"]
title = "Treatment Conservation  | Historic Royal Palaces"
full_description = '''Start of main content { "@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [ { "@type": "ListItem", "position": 1, "name": "About us" , "item": "https://www.hrp.org.uk/about-us/" } , { "@type": "ListItem", "position": 2, "name": "Conservation" , "item": "https://www.hrp.org.uk/about-us/conservation/" } , { "@type": "ListItem", "position": 3, "name": "Treatment Conservation" } ] } Home About us Conservation Treatment Conservation Treatment Conservation What is Treatment Conservation? Treatment Conservation is the meticulous and skilful process of a conservator intervening with an object to improve its condition. The aim is not to restore the object to its original state, but to address ongoing deterioration, stabilise and strengthen it as needed, and potentially improve its aesthetic appeal. Intervention is carefully controlled to preserve the original materials, techniques and historical information as much as possible, with the aim of making these interventions as unnoticeable as possible. How is treatment carried out? Treatment is carried out by a specialist conservator who has undergone rigorous training in the conservation of the specific materials, or types of collections, which require conservation treatment. This process involves comprehensive documentation, analysis, and problem-solving using scientific methodologies, to gain a deeper understanding of the object and its treatment needs. A well-informed treatment plan is formulated and expertly implemented within established standards and timelines. Treatment conservation at Historic Royal Palaces Our conservation serves a dual purpose: ensuring an object's stability and longevity, whilst also enhancing public access for present and future visitors to engage, learn, and gain enjoyment. With one of the country's most enduring conservation treatment programs, we uphold the highest standards in conserving the diverse range of collections across our six palaces. This includes both moveable objects in our spaces such as framed paintings and textiles, to immovable assets, which are integral to the building and gardens themselves, such as ceiling paintings and exterior statuary. They represent a continuum from archaeology to the present day, and include collections displayed as they were intended, often with their original setting. New acquisitions added to the collections to enhance our spaces and stories. Our Treatment Conservation team is a group of passionate experts. We are proud to be part of a long and rich history of preserving the collections that dates back to the establishment of the Great Wardrobe in the 13th century. We conduct treatments in situ or within dedicated workshop spaces, on or off-site, undertaken by Historic Royal Palace conservators or working with external specialists as needed. Our textile conservation studio at Hampton Court Palace, was established by Royal Command from Edward VII. It was officially established by George V in 1912 and managed by the William Morris and Co. Since then, it has been staffed by a skilled team of conservators, who work on intricate treatments for royal tapestries, state beds and throne canopies, upholstered furniture, costumes and costume accessories. We also have a specialised wall paintings conservator who preserves a wide range of painted surfaces and stone, from archaeological finds to modern-day pieces. Watch Conservation of a Tudor ceiling Watch the conservation team investigate the magnificent ceiling of the Wolsey Closet at Hampton Court Palace Conservators investigate the magnificent ceiling of the Wolsey Closet at Hampton Court Palace, closely examining materials and structure through inspections by experts combined with scientific paint and material analysis. Video transcript of Conservation of a Tudor Ceiling Follow along with an interactive transcript of Conservation of a Tudor ceiling on YouTube. A link to open the transcript can be found in the description. Watch Conserving the Bacton Altar Cloth Watch the conservation team carefully treat this incredibly rare survival of Elizabethan dress thought to have belonged to Elizabeth I herself. Over 1,000 hours were spent on the conservation of the Bacton Altar Cloth, an incredibly rare survival of Elizabethan dress thought to have belonged to Elizabeth I herself. Video transcript of Conservation the Bacton Altar Cloth Follow along with an interactive transcript of Conserving the Bacton Altar Cloth on YouTube. A link to open the transcript can be found in the description. Listen to our podcast as we go behind the scenes in the Textile conservation studio.'''
