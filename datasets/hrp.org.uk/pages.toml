["https://hrp.org.uk/about-us/collections"]
title = "Collections  | Historic Royal Palaces"
description = "Collections in our care at Historic Royal Palaces."
full_description = 'Start of main content { "@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [ { "@type": "ListItem", "position": 1, "name": "About us" , "item": "https://www.hrp.org.uk/about-us/" } , { "@type": "ListItem", "position": 2, "name": "Collections" } ] } Home About us Collections Collections Our aim is to conserve, display and interpret the magnificent buildings, interiors and collections in our care. Our royal palaces host internationally important collections of fine and decorative art, the majority forming part of the Royal Collection. We work in partnership with the Royal Armouries to display their collections of arms and armour at the Tower of London. We also manage, conserve, display and research our own collections of royal ceremonial dress, architectural drawings, art, archaeology, furniture, furnishings, architectural decoration and social history. Our collections The objects in our collections help us to tell the stories of the people that lived in the palaces. Art and decorative arts collections Fine and decorative art on display across our palaces remains part of the Royal Collection, one of the largest and most important art collections in the world. Royal Ceremonial Dress Collection 10,000 items of historic dress from the 16th century to the present day, this is a collection of national and international importance. Collections and conservation policies We have a set of collections management policies which explain how we manage, develop and care for the collections. Read the policies Conservation We carry out world-leading conservation work to preserve and enhance the thousands of treasures in our guardianship, so that the palaces and collections have a life today and in the future. Find out more'
