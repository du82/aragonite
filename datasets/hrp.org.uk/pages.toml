full_description = 'Start of main content { "@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [ { "@type": "ListItem", "position": 1, "name": "About us" , "item": "https://www.hrp.org.uk/about-us/" } , { "@type": "ListItem", "position": 2, "name": "Research" , "item": "https://www.hrp.org.uk/about-us/research/" } , { "@type": "ListItem", "position": 3, "name": "Our Research" } ] } Home About us Research Our Research Our Research Annual Research Report Historic Royal Palaces undertakes a wide variety of research across a number of different disciplines. Highlights from 2022-2023 include: Henry VIII on Tour: Landscape, Communities and Performance, an AHRC-funded project led by Anthony Musson in partnership with the University of York and the University of Newcastle to recreate and reconceptualise the royal progresses of Henry VIII. The Crown to Couture exhibition, which also resulted in Crown to Couture: The Magazine, Polly Putnam and Claudia Acott Williams (London: HRP, 2023), an original approach to exhibition publishing. Research for a new permanent exhibition, The Crown Jewels. Permissible Beauty, a film and installation produced in collaboration with the University of Leicester, The National Trust and English Heritage, taking inspiration from the ‘Hampton Court Beauties’ to create new portraits of British Black Queer creatives. For a full summary of our most recent research outputs, please see our 2022-23 Research Report. Annual Research Report 2022-2023 Conservation research See our Conservation Research, for our world leading activities in heritage science. Conservation research Postdoctoral research and Fellowships Find out about working with us as a postdoctoral researcher, current Early Career Researcher opportunities, and Knowledge Exchange Fellowships. Postdoctoral research and Fellowships Knowledge Exchange Partnerships Historic Royal Palaces is open to discussions of hosting postdoctoral researchers under Knowledge Exchange Partnership and Knowledge Exchange Fellowship schemes to tackle key issues or questions across the organisation. If you are an academic or postdoctoral researcher who has access to one of these schemes through your university and would like to explore potential opportunities, please contact us at [email protected].'
