["https://hrp.org.uk/about-us/research/staff-research-profiles/dr-joanna-marschner"]
title = "Dr Joanna Marschner  | Historic Royal Palaces"
full_description = '''Start of main content { "@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [ { "@type": "ListItem", "position": 1, "name": "About us" , "item": "https://www.hrp.org.uk/about-us/" } , { "@type": "ListItem", "position": 2, "name": "Research" , "item": "https://www.hrp.org.uk/about-us/research/" } , { "@type": "ListItem", "position": 3, "name": "Staff Research Profiles" , "item": "https://www.hrp.org.uk/about-us/research/staff-research-profiles/" } , { "@type": "ListItem", "position": 4, "name": "Dr Joanna Marschner" } ] } Home About us Research Staff Research Profiles Dr Joanna Marschner Dr Joanna Marschner Position: Senior Curator, Research Department About Joanna is a historian and art historian interested in monarchical history of the 17th-21st centuries. In particular, she has studied the construction of a visual image for the monarchy and court through the palaces and royal gardens, as well as by members of the royal family, courtiers and palace employees, especially women. Much of her scholarship is grounded in HRP’s Royal Ceremonial Dress Collection. She has led numerous exhibition and research projects at Kensington Palace, including ‘Enlightened Princesses: Caroline, Augusta, Charlotte and the Shaping of the Modern World’, and ‘Queen Victoria’s Self-fashioning: Curating the Royal Image for Dynasty, Nation and Empire’. She has been Chair of DATS and the Costume Committee of ICOM, and now works for HRP part-time. Select publications Marschner, J., Queen Caroline: Cultural Politics at the Early Eighteenth Century Court (New Haven and London: Yale University Press, 2014) Marschner, J., (ed.), Enlightened Princesses: Caroline, Augusta, Charlotte and the Shaping of the Modern World (New Haven and London: Yale University Press, 2017) Marschner, J., Homans, M., Munich, A., (eds.), Queen Victoria’s Leaves of the Journal of Our Life in the Highlands, and More Leaves. Critical edition (Oxford: Oxford University Press, 2024) All articles by Dr Joanna Marschner (4) An American visitor to Kew Palace in 1753 04 July 2019 In the summer of 1753, it must have been with apprehension and excitement that the Pinckney family from South Carolina awaited an audience at the White House, Kew with Princess Augusta, Princess Dowager of Wales, the mother of the future King George III. Caroline of Ansbach: The Brainiest Princess 03 October 2017 George Augustus of Hanover and his wife, Caroline of Ansbach arrived in London in 1714, in the train of the new king, George I, George Augustus's father. A Royal History of Princesses and Music 17 July 2017 When Caroline of Ansbach moved with the Hanoverian court to London in 1714, Britain saw the start of a new era of princess-led musical connoisseurship. Introducing: Queen Caroline of Ansbach 29 April 2014 Let me introduce you to Queen Caroline of Ansbach, the wife of King George II. She has escaped the attention of historians, but in my opinion, this is a very great shame – I find her an absolutely fascinating woman. Page 1 of 1'''
