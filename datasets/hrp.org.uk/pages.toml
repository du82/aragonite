["https://hrp.org.uk/about-us/research/our-research/postdoctoral-research-and-fellowships"]
title = "Postdoctoral Research and Fellowships  | Historic Royal Palaces"
full_description = '''Start of main content { "@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [ { "@type": "ListItem", "position": 1, "name": "About us" , "item": "https://www.hrp.org.uk/about-us/" } , { "@type": "ListItem", "position": 2, "name": "Research" , "item": "https://www.hrp.org.uk/about-us/research/" } , { "@type": "ListItem", "position": 3, "name": "Our Research" , "item": "https://www.hrp.org.uk/about-us/research/our-research/" } , { "@type": "ListItem", "position": 4, "name": "Postdoctoral Research and Fellowships" } ] } Home About us Research Our Research Postdoctoral Research and Fellowships Postdoctoral research and Fellowships Postdoctoral research opportunities Historic Royal Palaces offers opportunities for postdoctoral researchers through our funded research project and schemes including the AHRC Early Career Fellowships in Cultural and Heritage Institutions. When postdoctoral research and fellowship opportunities are available at HRP they will be advertised here. Our postdoctoral researchers Find out more about our current postdoctoral researchers and the projects they are working on in the profiles below. Dr Jamie Ingram Dr Kirsty Wright Dr Catherine Jenkinson Dr Jamie Ingram Position: PDRA on 'Graffiti at the Tower of London' About Jamie graduated from the University of Southampton with a doctorate in medieval archaeology in 2022. He is interested in social history and archaeology focusing on historic graffiti and human behaviours around informal mark making. He is currently the postdoctoral researcher looking at the historic graffiti at Tower of London and working on developing a recording and research strategy focusing on the graffiti and understanding its meaning and significance. Select Publications Ingram, J., ‘Liminal space and liminal place: the medieval church porch’, in Z. Hadromi- Allouche and M McKay (eds.), Betwixt and Between Liminality and Marginality (Lanham and London: Lexington Books, 2023), pp. 79-98. Ingram, J., ‘Historic graffiti and potential interpretation at Chichester Cathedral’, Journal of Church Archaeology, 21 (2022). Dr Kirsty Wright Position: PDRA on ‘Henry VIII on Tour: Landscapes, Communities & Performance’ About Kirsty is a postdoctoral researcher at Historic Royal Palaces working on the Henry VIII on Tour project. Her current research focuses on queenship, architecture and government to explore the roles of Henry’s queens on royal progresses. She completed her PhD at the University of York on the Exchequer of Receipt in the Palace of Westminster, which explored the relationship between institutional development and the architecture of the palace. She is particularly interested in place-based research as a means to understand the historic built environment and to connect people with heritage. Select Publications Wright, K., ‘Revisiting the War in the Receipt: 1572-1609’, Parliamentary History, 42 (2023), 11-31. Dr Catherine Jenkinson Position: PDRA on ‘(Hi)stories of Violence: Myth-Making, Imprisonment and the Cultural Identity of the Tower of London' About Catherine recently completed a doctorate in History at the University of Oxford. Her doctoral research examined the Tower’s use as a prison and the range of prisoner experiences there in late-Tudor and early-Stuart England. In 2023-4, she was a postdoctoral researcher on a Knowledge Exchange Fellowship, funded by the University of Oxford, which explored the history of torture and execution at the Tower. She is now PDRA on ‘(Hi)stories of Violence: Myth-Making, Imprisonment and the Cultural Identity of the Tower of London’, funded by the University of Oxford, which reconsiders how histories of violence at the Tower of London have been conceptualised in the cultural imagination from the middle ages to the twentieth century. She is also College Lecturer and Julian Schild Junior Research Fellow at Pembroke College, Oxford.'''
year_published = 2025
