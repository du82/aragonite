full_description = '''Start of main content { "@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [ { "@type": "ListItem", "position": 1, "name": "About us" , "item": "https://www.hrp.org.uk/about-us/" } , { "@type": "ListItem", "position": 2, "name": "Collections" , "item": "https://www.hrp.org.uk/about-us/collections/" } , { "@type": "ListItem", "position": 3, "name": "Art and decorative arts collections" } ] } Home About us Collections Art and decorative arts collections Art and the decorative arts The Royal Collection Much of the fine and decorative art on display across our palaces remains part of the Royal Collection, one of the largest and most important art collections in the world. The Royal Collection is held in trust by The King for his successors and the nation, and is housed in 13 royal residences and historic palaces across the UK. Many artworks can be seen in the historic settings and royal apartments for which they were originally commissioned or acquired. Others are displayed in temporary exhibitions or in purpose-built galleries, including the Cumberland Art Gallery and Mantegna Gallery at Hampton Court Palace. You can find further information at rct.uk/collections, the online catalogue for the Royal Collection. Cumberland Art Gallery Discover more Image: Peter depicted on the King's Staircase at Kensington Palace. © Historic Royal Palaces Peter 'the Wild Boy' from Hanover: The Boy on the Staircase Peter's life-size portrait is on the King's Staircase at Kensington Palace and was painted just months after his arrival in England. Read more about his life. Read the blog Art Collections Explore what's on Things to see Cumberland Art Gallery Discover masterpieces by Rembrandt, Caravaggio, van Dyck, and more at the Cumberland Art Gallery at Hampton Court Palace. Closed 26 February to 02 March, and 04 to 07 March 2025 In line with palace opening hours Hampton Court Palace Included in palace admission (Members go free) Learn more Things to see Rubens ceiling Marvel at Sir Peter Paul Rubens' ceiling in its original setting of Inigo Jones' spectacular Banqueting House. Closed Banqueting House Included in palace admission (Members go free) Learn more Things to see State Drawing Room Discover contemporary Irish art from the collection of His Majesty The King in this elegant family space. In line with castle opening times Hillsborough Castle Included in combined castle tour and gardens tickets (Members go free) Learn more Browse more history and stories Art at Hillsborough Castle Hillsborough Castle has become a place in which to see amazing art The story of Hillsborough Castle and Gardens ‘The Grandest House in County Down’ The execution of Charles I Killing of a 'treasonous' King'''
