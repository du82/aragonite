["https://hrp.org.uk/about-us/research/staff-research-profiles/dr-jemima-hubberstey"]
title = "Dr Jemima Hubberstey  | Historic Royal Palaces"
full_description = 'Start of main content { "@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [ { "@type": "ListItem", "position": 1, "name": "About us" , "item": "https://www.hrp.org.uk/about-us/" } , { "@type": "ListItem", "position": 2, "name": "Research" , "item": "https://www.hrp.org.uk/about-us/research/" } , { "@type": "ListItem", "position": 3, "name": "Staff Research Profiles" , "item": "https://www.hrp.org.uk/about-us/research/staff-research-profiles/" } , { "@type": "ListItem", "position": 4, "name": "Dr Jemima Hubberstey" } ] } Home About us Research Staff Research Profiles Dr Jemima Hubberstey Dr Jemima Hubberstey Position: Research Officer About Jemima completed a Collaborative Doctoral Award with the University of Oxford and English Heritage in 2021, exploring the connection between literary circles and garden design in the mid-eighteenth century. Subsequently, she held an AHRC-funded Postdoctoral Fellowship in the Humanities at the University of Oxford, examining elite women and the intellectual culture of the country house. She also worked on a Knowledge Exchange Fellowship with the University of Oxford, English Heritage and the National Trust, uncovering the lost literary legacies that once united Wrest Park and Wimpole Hall in the eighteenth and nineteenth centuries. With a particular interest in the long eighteenth-century, Jemima has published on a range of topics, including historic houses and gardens, literature and theatrical performance, and more recently, wellbeing and the country house. As Research Officer, Jemima supports the research activities and projects at Historic Royal Palaces. Select publications Hubberstey, J., ‘The Genius of Rest … those Happy Groves Inspired’: Literary Composition, Coterie Sociability, and the Gardens at Wrest Park’, in Bluestockings and Landscape in Eighteenth-Century Britain: The Prospect of Improvement, ed. M. Ellis and J. Orchard (London: Boydell and Brewer, 2024). Hubberstey, J., ‘“I am a sort of Prisoner Here”: Elite Performance and Bath Society in the Eighteenth Century’, in Bath and Beyond, ed. H. Burlock, R. Eagles, and T. LeBoff (London: Routledge, 2024). Hubberstey, J., ‘Quiet and Clever Together’: Reassessing the Significance of Elite Women and the Literary Culture of the Country House, in Women Writers and the Creative Arts in Britain, 1660-1832, Women’s Writing, 30 (2023), pp. 276-294.'
