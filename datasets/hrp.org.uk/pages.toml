["https://hrp.org.uk/about-us/research/staff-research-profiles/dr-constantina-vlachou-mogire"]
title = "Dr Constantina Vlachou-Mogire  | Historic Royal Palaces"
full_description = 'Start of main content { "@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [ { "@type": "ListItem", "position": 1, "name": "About us" , "item": "https://www.hrp.org.uk/about-us/" } , { "@type": "ListItem", "position": 2, "name": "Research" , "item": "https://www.hrp.org.uk/about-us/research/" } , { "@type": "ListItem", "position": 3, "name": "Staff Research Profiles" , "item": "https://www.hrp.org.uk/about-us/research/staff-research-profiles/" } , { "@type": "ListItem", "position": 4, "name": "Dr Constantina Vlachou-Mogire" } ] } Home About us Research Staff Research Profiles Dr Constantina Vlachou-Mogire Dr Constantina Vlachou-Mogire Position: Heritage Science Manager About As manager of the Heritage Science Team and Laboratory, Constantina is responsible for the planning and execution of research informing the preservation of the diverse objects and interiors of six heritage sites. Over the last sixteen years she has led and successfully delivered several large-scale research and capital projects including the upgrade the scientific infrastructure in the HRP’s Heritage Science Laboratory following an award of about £1m from the Arts and Humanities Research Council. She has co-supervised three PhD students and since 2012 coordinated the HRP Heritage Science scholarship scheme. Constantina holds a PhD in Archaeological Sciences and has over twenty years of work experience in various heritage science research areas including imaging, recording, modelling, preventative conservation, environmental science, data management, material science and ancient technology. She has published several academic papers and disseminated her research to specialist conferences as well as to wider audiences through blogs, social media, public talks. Constantina is a member of the AHRC Peer Review College, an Accredited Member of ICON, a member of the ICON Heritage Science Group Committee (2009 – 2013), a fellow of IIC and Co-Chair of the NHSF Excellent Research Working Group. Since 2010, she has been a member of the BSI B/560 Conservation of Tangible Cultural Heritage and EU CEN/TC 346 Conservation of Cultural Property committees. (ORCID ID) Select publications Vlachou-Mogire, C., Danskin, J., Gilchrist, J.R., and Hallett, K., ‘Mapping Materials and Dyes on Historic Tapestries Using Hyperspectral Imaging’, Heritage, 6 (2023), pp. 3159-82. Vlachou-Mogire C., Bertolotti, G., Hallett, K., and Frame, K., ‘Developing “Smart” Solutions for Light Management for Historic Collections’, Studies in Conservation, 65 (2020), pp. 333-41. Vlachou-Mogire C., P. Moretti, L. Monico, A. Chieli, M. Iwanicka, P. Targowski, V. Detalle, E. Bourguignon, K. Laclavetine, F. Mirambet, Tong Tong, and S. Pinchin, ‘A non-invasive multi-technique investigation of Banqueting House Whitehall Rubens ceiling paintings’, Microchemical Journal, 156 (2020). Follow Dr Constantina Vlachou-Mogire: Constantina Vlachou- Mogire, PhD, ACR, FIIC on LinkedIn Constantina Vlachou- Mogire, PhD, ACR, FIIC on X'
