["https://hrp.org.uk/about-us/collections/historic-royal-palaces-collections"]
title = "Historic Royal Palaces Collections  | Historic Royal Palaces"
description = "Our collections include more than 60,000 objects relating to the history of the palaces and the lives of those who have lived within them."
full_description = '''Start of main content { "@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [ { "@type": "ListItem", "position": 1, "name": "About us" , "item": "https://www.hrp.org.uk/about-us/" } , { "@type": "ListItem", "position": 2, "name": "Collections" , "item": "https://www.hrp.org.uk/about-us/collections/" } , { "@type": "ListItem", "position": 3, "name": "Historic Royal Palaces Collections" } ] } Home About us Collections Historic Royal Palaces Collections Historic Royal Palaces Collections Our collections include more than 60,000 objects relating to the history of the palaces and the lives of those who have lived within them. They cover many periods of history from the medieval to the 21st-century, and include archaeology, architectural decoration and features, fixings and fittings, fine and decorative art, social history, furniture and furnishings, books and manuscripts. Discover more about some of our collections. Royal Ceremonial Dress Collection Architectural drawings A significant collection The diverse nature of the objects in our collection reflects the fact that the palaces have been lived in or constantly used for over 1000 years. Some of the objects in the decorative arts and social history collection have been acquired to furnish rooms to improve visitors' understanding of life in the palaces. Many have also been acquired to tell the stories of the people that lived in the palaces. A few of the objects have been left behind by former residents. A good example are the items from Apartment 23 at Hampton Court Palace which belonged to Lady Manning who occupied that apartment from 1935 to 1992. They form the core of an internationally significant collection of social history objects. Discover more The Revealing Tale of Queen Victoria's Early Biography On display in the first case of our exhibition Victoria: A Royal Childhood at Kensington Palace, read more about the one of the first biographies of the young Queen Victoria. Read the blog Patrick Lamb and William Daniel: A Glimpse into the World of Two Royal Cooks Take a glimpse into the world of two Royal cooks through their notebooks. Read the blog You can help Palace upkeep is expensive work and as an independent charity we receive no funding from the Government or the Crown. We depend on our visitors, members, donors, volunteers and sponsors to help us raise funds so that our palaces can be open and accessible to everyone. Support us Palace Collections Explore what's on Things to see Cumberland Art Gallery Discover masterpieces by Rembrandt, Caravaggio, van Dyck, and more at the Cumberland Art Gallery at Hampton Court Palace. Closed 26 February to 02 March, and 04 to 07 March 2025 In line with palace opening hours Hampton Court Palace Included in palace admission (Members go free) Learn more Things to see Rubens ceiling Marvel at Sir Peter Paul Rubens' ceiling in its original setting of Inigo Jones' spectacular Banqueting House. Closed Banqueting House Included in palace admission (Members go free) Learn more Things to see Mantegna Gallery The Mantegna Gallery is closed for maintenance work until 2026. Two paintings from The Triumphs of Caesar can be seen in the Queen’s Presence Chamber (part of The Georgian Story) during this period. Closed for maintenance Hampton Court Palace Included in palace admission (Members go free) Learn more Browse more history and stories Art at Hillsborough Castle Hillsborough Castle has become a place in which to see amazing art The story of Hillsborough Castle and Gardens ‘The Grandest House in County Down’ The execution of Charles I Killing of a 'treasonous' King'''
