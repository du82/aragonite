["https://hrp.org.uk/about-us/research/research-projects-and-networks"]
title = "Research Projects and Networks  | Historic Royal Palaces"
description = "Discover the projects and networks at Historic Royal Palaces and find out more about the research and outputs involved with these."
full_description = '''Start of main content { "@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [ { "@type": "ListItem", "position": 1, "name": "About us" , "item": "https://www.hrp.org.uk/about-us/" } , { "@type": "ListItem", "position": 2, "name": "Research" , "item": "https://www.hrp.org.uk/about-us/research/" } , { "@type": "ListItem", "position": 3, "name": "Research projects and networks" } ] } Home About us Research Research projects and networks Research Projects and Networks (Hi)stories of Violence The (Hi)stories of Violence: Myth-Making, Imprisonment and the Cultural Identity of the Tower of London explored the association of the Tower with oppression and state violence, examining the difference between fact and fiction. Learn more about the project Henry VIII on Tour This three-year project explores the role of Henry VIII’s annual royal progresses in fashioning royal image, connecting communities and transforming landscapes. Learn more about the project A Mythological Subject, by Pietro Liberi, c1660-65. © Royal Collection Enterprises Limited 2024 | Royal Collection Trust. Queer Heritage and Collections Network Historic Royal Places is a founding partner of the Queer Heritage and Collections Network (QHCN), a UK-wide Subject Specialist Network which was launched in 2020 to provide training, networking and peer support to people working with LGBTIQA+ collections and histories. Queer Heritage and Collections Network Jewish History at the Tower of London This project researched Jewish prisoners, sanctuary seekers, and staff connected to the Tower of London, c. 1189 to 1290, creating a dataset of individual biographies and catalogue of archival resources. Jewish History at the Tower of London Victoria's Self Fashioning This research network examined Queen Victoria's role in the fashioning of her own image, and the consequences of this for monarchy, nation, and empire from the nineteenth century to the present. Learn more about the project Lest We Forget The Lest we Forget: Poppies and Public Commemoration research project explored the ways in which the public commemorated the First World War through a case study of ‘Blood Swept Lands and Seas of Red’- an art installation of over 800,000 ceramic poppies, planted in the Tower of London moat in 2014. Learn more about the project Portable Palaces Portable Palaces: Royal Tents and Timber Lodgings, 1509-1603 explored the tent as an important and ubiquitous expression of architecture through a study of the design of the royal tents and associated temporary buildings that were created for the sixteenth-century English court. Learn more about the project'''
