["https://hrp.org.uk"]
title = "Official Site  | Historic Royal Palaces"
description = "Welcome to Historic Royal Palaces. Experience history where it happened as we bring our six iconic palaces and their stories to life. Book your tickets online today."
full_description = "Start of main content Historic Royal Palaces We are the independent charity that loves and looks after six of the most wonderful palaces in the world What's on at our palaces Dress Codes 13 March - 30 November 2025 Discover never-before-seen royal and court fashion treasures in Dress Codes, a new exhibition at Kensington Palace. Learn more Exhibition Things to see Royal Style in the Making Discover the intimate bond between royal clients and fashion designers in a captivating new exhibition at Hillsborough Castle. 15 March 2025 - 04 January 2026 Hillsborough Castle Included in combined castle tour and gardens tickets (Members go free) Learn more Easter Families Events Easter Lindt Gold Bunny Hunt Join the Lindt GOLD BUNNY Hunt around the gardens and enjoy some springtime family fun. 29 March - 21 April 2025 Open in line with palace hours. Hampton Court Palace Included in palace admission (Members go free) Learn more Events Still The Hours Experience an audio-led journey at Hampton Court Palace after hours, revealing the hidden lives of women. Wednesday 19 March - Sunday 30 March 2025 Entry from 18:00 - 20:30 Hampton Court Palace Separate ticket (advance booking required) Learn more More what's on Shop 24/7 online Discover unique souvenirs inspired by our palaces. Browse our online shop Join as a member Enjoy a range of member benefits including unlimited adventures at our magnificent palaces, access to an exciting events programme and discounts in our shops and restaurants. Membership Browse history and stories Women's history at the palaces For centuries women have influenced the course of history, and the history of our palaces. Explore their stories, compiled by our expert curators and contributors. Read more Take a close look at Peter Paul Ruben's Masterpiece Discover the stories depicted in the nine painted panels and secrets of the Banqueting House with Google Arts and Culture. Zoom in to see details of the paintings in incredible detail online. View on Google Arts & Culture Get involved We are an independent charity and there are many ways you can support us. Make a donation A donation can make a difference in keeping the spirit of the palaces alive for the future, for everyone. Donate Membership Your support through membership gives the palaces a future, for everyone. Become a member Support us as a corporate partner Enjoy unrivalled access to our incredible palaces by supporting us as a corporate partner. Corporate partnerships Become a custodian of British History Sponsor a stone in the iconic White Tower at the Tower of London. Looking for that extra special gift? Give a friend or loved one something uniquely personal. Sponsor a stone"
