["https://hrp.org.uk/about-us"]
title = "About us  | Historic Royal Palaces"
description = "Historic Royal Palaces is an independent charity that looks after the Tower of London, Hampton Court Palace, the Banqueting House at Whitehall, Kensington Palace, Kew Palace and Hillsborough Castle and Gardens in Northern Ireland."
full_description = '''Start of main content { "@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [ { "@type": "ListItem", "position": 1, "name": "About us" } ] } Home About us About us Jump to Our work Trustees and Directors Annual reports Policies Work for us We are the independent charity that loves and looks after six of the most wonderful palaces in the world. The palaces are the setting for the stories that shape us all, and we’re bringing them to people in ways that mean more to them. We want everyone to find themselves in the spaces and stories we share. How you can support us History of Historic Royal Palaces Historic Royal Palaces was established by the government in 1989 in order to care for five royal palaces. We later became an independent charity in 1998 and in 2014 took over the management of Hillsborough Castle and Gardens in Northern Ireland. More about our history Our work Researching History We have a charitable duty, written into our founding charter, to help everyone learn about the sites in our care. We want everyone to feel welcome and accepted when they visit the palaces. The history of the palaces spans almost 1,000 years. Each has a complex history, much of which remains untold. For that reason, we welcome the addition of new research and fresh perspectives to our work, particularly when they reveal aspects of our national history which might previously have been overlooked. We are an Independent Research Organisation and our aim is to present the history of the palaces in a transparent, balanced and inclusive way, always informed by rigorous research. We believe that our work is enriched by the involvement of a wide range of people and perspectives, so we want to work with a broad range of organisations and communities, to bring the story of the palaces to life. The Historic Royal Palaces Research Institute was launched in 2019 to provide a community network for staff undertaking research across the organisation and provide a platform for our academic projects, programmes and partnerships. Research at Historic Royal Palaces Collections Our palaces host internationally important collections of fine and decorative art, the majority forming part of the Royal Collection. We manage, conserve, display and research our own collections of royal ceremonial dress, architectural drawings, art, archaeology, furniture, furnishings, architectural decoration and social history. Our team of expert curators explore the history of the palaces and the people who lived and worked within them. Their rigorous research underpins all of our work. We also work in partnership with the Royal Armouries to display their collections of arms and armour at the Tower of London. Collections Conservation We carry out world-leading conservation work to preserve and enhance the thousands of treasures in our guardianship, so that the palaces and collections have a life today and in the future. Conservation at our palaces Schools We will aim to reach every school in the country through our rich and diverse Schools programme offering an educational visit, learning resources, or CPD and teacher training opportunities. Our Schools programme Communities Historic Royal Palaces work collaboratively with local communities to create opportunities for people to meaningfully engage with our spaces and stories and to make our palaces more accessible and relevant for all visitors. Working with Communities Sustainability We have set out a commitment to make a positive impact through our environmental sustainability performance. We want to be able to implement solutions for making a difference to the environment. Sustainability strategy Trustees and Directors Historic Royal Palaces is governed by a Board of Trustees. Our Trustees promote Historic Royal Palaces’ Cause in the world. They act in the organisation's best interests, ensuring high standards in all the work we do, and that we use our money and resources as effectively as possible. The Chief Executive, John Barnes, is accountable to the Board of Trustees for the performance of Historic Royal Palaces and ultimately to Parliament for the public assets in our care. He chairs an Executive Board of eight Directors. Our Trustees and Directors Annual reports and accounts As an independent charity we publish all our annual reports, accounts and Trustees meetings. View Annual reports Read Trustees' meeting minutes Policies Equality & Diversity Safeguarding Children Complaints policy Due diligence and immunity from seizure Conservation and Collection Care Policy Freedom of Information Modern Slavery statement Policies HRP Pension Scheme Statement of Investment Principles. HRP Pension Scheme SIP Tower of London World Heritage Site HM Royal Palace and Fortress of the Tower of London (the Tower) is one of England’s most evocative ancient monuments. There is a tangible sense of history in every tower and around every corner, making it an endlessly fascinating place for visitors from all round the world. We have a heritage management plan which sets out the management objectives for the Tower. Tower of London World Heritage Site Plan Work at Historic Royal Palaces Find out more about working at Historic Royal Palaces. Work for us'''
year_published = 2025
