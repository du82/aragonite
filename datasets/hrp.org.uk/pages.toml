["https://hrp.org.uk/about-us/research/staff-research-profiles/alfred-r-j-hawkins"]
title = "Alfred R J Hawkins  | Historic Royal Palaces"
full_description = '''Start of main content { "@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [ { "@type": "ListItem", "position": 1, "name": "About us" , "item": "https://www.hrp.org.uk/about-us/" } , { "@type": "ListItem", "position": 2, "name": "Research" , "item": "https://www.hrp.org.uk/about-us/research/" } , { "@type": "ListItem", "position": 3, "name": "Staff Research Profiles" , "item": "https://www.hrp.org.uk/about-us/research/staff-research-profiles/" } , { "@type": "ListItem", "position": 4, "name": "Alfred R J Hawkins" } ] } Home About us Research Staff Research Profiles Alfred R J Hawkins Alfred R J Hawkins Position: Assistant Curator of Historic Buildings, HM Tower of London & Banqueting House, Whitehall About Alfred has worked in the commercial archaeology and heritage sectors as an archaeological researcher, archaeologist and, subsequently, a historic building specialist. Since 2018, Alfred has been Assistant Curator of Historic Buildings for HM Tower of London and the Banqueting House, Whitehall for Historic Royal Palaces and since 2023, Cathedral Archaeologist for Portsmouth Cathedral. At Historic Royal Palaces he has advised on large scale development projects including Beyond the Deepening Shadow and Superbloom alongside many other conservation projects across these sites. Alfred is a specialist in the history, architecture and archaeology of the Tower and Banqueting House, archaeological best practice and human remains, building conservation, and ecclesiastic law, with a particular interest in the conservation and archaeology of Royal Peculiars and Cathedrals. Alongside this, Alfred regularly makes on screen appearances on HRP’s socials and documentaries including BBC2’S Digging for Britain, Channel 5’s Inside the Tower of London, and Discovery Channel’s Unearthed. Select publications Hawkins, A. R. J., ‘The Peculiar Case of a Royal Peculiar: A Problem of Faculty at the Tower of London’, Ecclesiastical Law Journal, 24 (2022) pp. 345-363. Hawkins, A. R. J., Faillace, K., Madgwick, R., Sidell, J., ‘Life, Death and Worship at His Majesties Tower of London: Excavations outside the Chapel Royal of Saint Peter ad Vincula’ (forthcoming). All articles by Alfred R J Hawkins (4) Secrets of Henry VIII's Whitehall: The Archaeology of a Lost Palace 17 August 2023 More than 300 years after the destruction of Whitehall Palace by fire, archaeological excavation and scientific analysis continue to uncover the lost stories and secrets of Henry VIII's once elaborate home. Caring for the Tower of London through lockdown 11 May 2021 While the Tower of London was closed to the public during the Covid-19 pandemic, much work was underway to protect the fabric of the building and the future of the palace. Assistant Curator Alfred Hawkins reveals one of the important projects that he has been working on behind the scenes. 500 years of the Chapel Royal of St Peter ad Vincula 19 September 2020 Assistant Curator of Historic Buildings Alfred Hawkins introduces some of the extraordinary stories surrounding the Chapel Royal of St Peter ad Vincula, the little Tudor church at the heart of the Tower of London. Excavations at the Tower of London's chapel 21 October 2019 Historic Buildings Curator Alfred Hawkins explains the process of archaeological excavations, and their importance in expanding our current understanding of historic sites like the Tower of London. Page 1 of 1'''
