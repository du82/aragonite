["https://hrp.org.uk/about-us/conservation/preventive-conservation"]
title = "Preventive Conservation  | Historic Royal Palaces"
full_description = 'Start of main content { "@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [ { "@type": "ListItem", "position": 1, "name": "About us" , "item": "https://www.hrp.org.uk/about-us/" } , { "@type": "ListItem", "position": 2, "name": "Conservation" , "item": "https://www.hrp.org.uk/about-us/conservation/" } , { "@type": "ListItem", "position": 3, "name": "Preventive Conservation" } ] } Home About us Conservation Preventive Conservation Preventive Conservation What is preventive conservation? Preventive conservation is carried out on the collections and historic interiors across all six palaces. We use our expertise to identify potential issues that may cause damage and then develop pragmatic solutions to resolve these in the most sympathetic and sustainable way. Working closely with curators and surveyors, we ensure that the buildings and collections are accessible and safely preserved for future generations. Using a blend of traditional techniques, research and cutting-edge technology, we carefully monitor, manage and reduce the environmental risks, such as light, water, fire, humidity, heat, moths and dust that could otherwise cause damage to collections and interiors. Behind the scenes Our approach provides opportunities for us to work collaboratively with colleagues across the organisation, and beyond. We advise and train others on aspects of how we research, protect and conserve our historic buildings and collections. This knowledge is shared through partnerships with other heritage organisations and universities, including supporting professional internships and apprenticeships. We host student placements to train the next generation of heritage guardians and ensure our buildings and collections survive for future generations. Caring for a palace takes a lot of planning and often involves the whole team working together to ensure a conservation project is completed on time. During a visit, you may see our conservators carrying out inspections, conservation cleaning or applying treatments from large scaffolding in hard-to-reach areas. This is all part of our work to look after the buildings and collections in our care. Watch Conservators Behind The Scenes at Hampton Court Palace Watch conservator Jen Tran in her daily duties, a rare glimpse behind the scenes of our vital conservation work. Follow preventive conservator Jen Tran in her daily duties. Showcasing a rare glimpse behind the scenes of our vital conservation work undertaken at Hampton Court Palace. Video transcript of Conservators Behind The Scenes at Hampton Court Palace Follow along with an interactive transcript of Conservators Behind the Scenes at Hampton Court Palace. A link to open the transcript can be found in the description. Listen to our podcast as we go behind the scenes in the Textile conservation studio.'
