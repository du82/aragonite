["https://hrp.org.uk/about-us/research"]
title = "Research at Historic Royal Palaces  | Historic Royal Palaces"
description = "Historic Royal Palaces is an Independent Research Organisation and our aim is to present the history of the palaces in a transparent, balanced and inclusive way, always informed by rigorous research. We launched the Research Institute in 2019 to provide a community network for staff undertaking research across the organisation and provide a platform for our academic projects, programmes and partnerships."
full_description = 'Start of main content { "@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [ { "@type": "ListItem", "position": 1, "name": "About us" , "item": "https://www.hrp.org.uk/about-us/" } , { "@type": "ListItem", "position": 2, "name": "Research" } ] } Home About us Research Research The research we do at Historic Royal Palaces takes many forms. From the history of our unique palaces and the people who lived and worked in them, to world renowned conservation science and innovative public engagement methodologies, we lead and collaborate on a wide variety of research projects with academic, cultural and industry partners. Our collections include the Arts Council England designated Royal Ceremonial Dress Collection, archaeological finds, and architectural drawings. Many of the objects on display within our palaces which we undertake research on, including the Crown Jewels, are part of the Royal Collection. We are an Independent Research Organisation (IRO), a status which enables us to receive UK Research and Innovation (UKRI) funding, co-supervise PhD students, and host postdoctoral fellowships. Research vision and strategy At Historic Royal Palaces our vision is that authoritative research should underpin and inform everything we do as part of our core function to look after, interpret and engage audiences with the buildings, landscapes and collections in our care. Our four priority research areas are: identities and perceptions materiality and environment inclusivity and diverse heritages interactions and relationships To find out more, read our Research Strategy 2022-27 (PDF). Download Research Strategy 2022-27 Download Projects and networks Historic Royal Palaces leads and collaborates on a variety of research projects and networks. See our research projects and networks Study with us Historic Royal Palaces and Queen Mary University of London offer an MA course in Heritage Management, designed to equip future heritage sector leaders. Find out about our collaborative doctoral programmes, placement opportunities and current PhD students. Study with us Our research See highlights of our latest research in our Annual Research Report, current postdoctoral fellows and opportunities for Early Career Researchers. Our research Staff research profiles Find out more about the specialisms of our research active staff. Staff research profiles Contact Enquiries about our research activities, studying with us or collaborative projects should be made to [email protected]. This is not for general or personal research enquiries.'
year_published = 2025
