["https://hrp.org.uk/about-us/conservation"]
title = "Conservation  | Historic Royal Palaces"
full_description = '''Start of main content { "@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [ { "@type": "ListItem", "position": 1, "name": "About us" , "item": "https://www.hrp.org.uk/about-us/" } , { "@type": "ListItem", "position": 2, "name": "Conservation" } ] } Home About us Conservation Conservation We are proud to care for some of the most important buildings and collections in the world. We carry out world-leading conservation work to preserve and enhance the thousands of treasures in our guardianship, so that the palaces and collections have a life today and in the future. Conservation is all the activities we do to manage change to the collections over time, and involves many specialists to help us understand, protect and share the heritage in our care. Our work includes research, managing environmental risks, cleaning, stabilisation and treatment. We prepare and mount objects for new exhibitions and love to share our discoveries, encouraging everyone to join us as heritage guardians. Our expert conservation team is part of a long history of caring for the palaces; our conservation studio was set up in 1912 by William Morris and Co, with traces back to the Great Wardrobe, established in the 13th century. This ensures the palaces have a future as bright as their past. Conservation in action and practice We protect, conserve and manage the collections across our six palaces. We are passionate about revealing and preserving the stories and layers of history hidden in the collections. Our world class research informs everything that we do. We learn from past practices and encourage innovation, exploring creative and sustainable solutions to the challenges we face in preserving the nation’s heritage. Our Collection Care and Conservation policy (PDF) explains how we make decisions about how we care for, conserve and manage objects and interiors in our care. Watch How to Conserve a Historic Mantua Dress Explore behind the scenes at the Textile Conservation Studio at Hampton Court Palace and discover how the Rockingham Mantua, an exceptional example of an 18th century court mantua, is conserved and mounted for display. Join our talented conservators as they practice safely mounting this historic dress for display. Video Transcript of How to Conserve a Historic Mantua Dress Follow along with an interactive transcript of How to Conserve a Historic Mantua Dress on YouTube. A link to open the transcript can be found in the description. How we conserve the collections Discover conservation in action online with Google Arts and Culture. We protect conserve, research and manage the collections on display and in store across our six palaces. Conservation in action on Google Arts and Culture Treatment conservation Treatment Conservation is the meticulous and skilful process of a conservator intervening with an object to improve its condition. We work to address ongoing deterioration, stabilise and strengthen it as needed, and restore its aesthetic appeal if required. Read more Preventive conservation Preventive conservation looks at potential issues that may cause damage, then develop pragmatic solutions to resolve these in the most sympathetic and sustainable way for both the buildings and collections. Read more Conservation research Conservation research happens across the palaces and scientific research is a core activity. A range of research projects are undertaken from tapestries to terracotta roundels. Read more Preparing objects for display Objects that are displayed in our palaces undergo a thorough assessment to ensure they are in optimal condition before being prepared for display. Find out the ways this is carried out and why it is important. Read more Collections Our palaces host internationally important collections of fine and decorative art, the majority forming part of the Royal Collection. We look after our more than 60,000 objects relating to the history of the palaces in our own collections and 10,000 items of historic dress in the Royal Ceremonial Dress Collection. Go to Collections Read our collections policies Hear from our conservators on our blog A gold 1920s wedding dress for the bride who wanted to shine For a glittering twist on 1920s wedding dress inspiration, look no further than the Hon. Ursula Mary Lawley's gold wedding ensemble. Read the blog Conserving Henry VIII's Abraham tapestries Part III: Bringing the Circumcision of Isaac back to life It's been nearly five months since conservation work started on Henry VIII's 'Abraham' tapestries, starting with the Circumcision of Isaac. And what a few months it's been! Read the blog Conservation Research'''
year_published = 2025
clearnet = "https://hrp.org.uk/about-us/conservation"
