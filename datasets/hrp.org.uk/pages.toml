["https://hrp.org.uk/about-us/research/staff-research-profiles/dr-charles-farris"]
title = "Dr Charles Farris  | Historic Royal Palaces"
full_description = '''Start of main content { "@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [ { "@type": "ListItem", "position": 1, "name": "About us" , "item": "https://www.hrp.org.uk/about-us/" } , { "@type": "ListItem", "position": 2, "name": "Research" , "item": "https://www.hrp.org.uk/about-us/research/" } , { "@type": "ListItem", "position": 3, "name": "Staff Research Profiles" , "item": "https://www.hrp.org.uk/about-us/research/staff-research-profiles/" } , { "@type": "ListItem", "position": 4, "name": "Dr Charles Farris" } ] } Home About us Research Staff Research Profiles Dr Charles Farris Dr Charles Farris Public Historian for the History of the Monarchy About Charles is a curator and public historian based at the Tower of London. He holds a BA in History, MA in Medieval Studies, and AHRC-funded PhD in English Medieval History, from Royal Holloway, University of London. After completing his PhD, Charles was Post Doctoral Research Associate on AHRC-funded projects at the University of Westminster and Historic Royal Palaces. He curated the 2023 Crown Jewels Exhibition at the Tower of London. He co-curated the 2023-24 Crown and Coronation touring immersive light and sound show with artistic collaboration Luxmuralis. He is the Digital Lead for the curators’ team and a regular host on the Historic Royal Palaces Podcast. He is a seminar convener and committee member for the Society for Court Studies. His research focuses on medieval and early modern kingship and material culture, experimental archaeology, and inclusive histories. Select publications Farris, C., ‘Edward I and the Blessed Virgin Mary’, in The Reign of Edward I: New Interpretations, ed. A. King and A. Spencer (York: York University Press, 2020), pp. 125-42. Farris, C., ‘The New Edwardians? Royal Piety in the Yorkist Age’, in Harlaxton Medieval Studies Volume XXIII: The Yorkist Age, ed. H. Kleineke and C. Steer (Donington: Shaun Tyas, 2013), pp. 44-63. Farris, C., ‘The Administration of Cloth and Clothing in the Great Wardrobe of Edward I’, Medieval Clothing and Textiles, 17 (2023), 67-90. All articles by Dr Charles Farris (7) Medieval and Tudor Poets at the Tower 09 August 2024 What dramatic Tudor event might Sir Thomas Wyatt have drawn on for his poetry? And did you know Geoffrey Chaucer worked at the Tower of London? Charles II and the Discovery of the 'Princes in the Tower' in 1674 17 July 2024 Tower of London Curator Charles Farris explores one of the most famous discoveries in the Tower’s history – a small chapter in the continuing mystery of the Princes in the Tower. Royal Ceremonial Dress Collection in the Jewel House 26 June 2023 Curator Charles Farris introduces some of the amazing ceremonial dress now on display in the Jewel House exhibition. Elizabeth I’s coronation procession from the Tower of London 17 November 2022 Curator Charles Farris recalls Elizabeth’s dramatic procession from the Tower of London to Westminster the day before her coronation. Edward I’s Santa Suit: Christmas in the Medieval Palace 10 December 2021 Curator Charles Farris explores how Edward I and his royal medieval court celebrated Christmas. Phillis Wheatley's Visit to the Tower of London in 1773 22 October 2021 Curator Charles Farris explores the incredible life and career of Phillis Wheatley, an important African American poet, who visited the Tower of London in 1773. Ambrose Rookwood and Sir Everard Digby: Lesser-known gunpowder plotters 30 January 2019 You might not have heard of Ambrose Rookwood and Sir Everard Digby. But their marks on the Tower of London can still be seen today. Page 1 of 1'''
