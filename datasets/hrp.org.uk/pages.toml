["https://hrp.org.uk/about-us/research/staff-research-profiles/alexandra-stevenson"]
title = "Alexandra Stevenson  | Historic Royal Palaces"
full_description = 'Start of main content { "@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [ { "@type": "ListItem", "position": 1, "name": "About us" , "item": "https://www.hrp.org.uk/about-us/" } , { "@type": "ListItem", "position": 2, "name": "Research" , "item": "https://www.hrp.org.uk/about-us/research/" } , { "@type": "ListItem", "position": 3, "name": "Staff Research Profiles" , "item": "https://www.hrp.org.uk/about-us/research/staff-research-profiles/" } , { "@type": "ListItem", "position": 4, "name": "Alexandra Stevenson" } ] } Home About us Research Staff Research Profiles Alexandra Stevenson Alexandra Stevenson Position: Curator of Archaeology and Historic Buildings About Alexandra is an archaeologist and historian working across Hampton Court Palace, the Tower of London, and Kensington Palace. She has a particular interest in the buildings, parks, and gardens at Hampton Court and she is currently researching the female craftspeople who were employed by the Office of Works in the long 18th century. She is the lead curator responsible for HRP’s extensive archaeological collections. Select publications Stevenson, A., ‘Statement of Significance and Research Report Wilderness House, Hampton Court Palace,’ Historic Royal Palaces (2023). Stevenson, A., ‘Statement of Significance and Initial Survey of the Shepherd’s Cottages, Home Park, Hampton Court Palaces,’ Historic Royal Palaces (2023). Stevenson, A., ‘Women Working in the Building Trades at some of London’s Royal Palaces in the 17th and 18th centuries’, The Construction Historian Magazine, Summer 2021. All articles by Alexandra Stevenson (1) A Turkish Bath for Horses at Hampton Court 16 June 2022 With eyes on Royal Ascot in June, we wanted to share a lesser-known aspect of Hampton Court’s Equine Past. In the 1860s a Turkish bath was installed at Hampton Court Palace…for the horses! Buildings Curator Alexandra Stevenson explores this curious history. Page 1 of 1'
