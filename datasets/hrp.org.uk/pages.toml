["https://hrp.org.uk/about-us/research/staff-research-profiles/alice-blows"]
title = "Alice Blows  | Historic Royal Palaces"
full_description = 'Start of main content { "@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [ { "@type": "ListItem", "position": 1, "name": "About us" , "item": "https://www.hrp.org.uk/about-us/" } , { "@type": "ListItem", "position": 2, "name": "Research" , "item": "https://www.hrp.org.uk/about-us/research/" } , { "@type": "ListItem", "position": 3, "name": "Staff Research Profiles" , "item": "https://www.hrp.org.uk/about-us/research/staff-research-profiles/" } , { "@type": "ListItem", "position": 4, "name": "Alice Blows" } ] } Home About us Research Staff Research Profiles Alice Blows Alice Blows Position: Curator of Historic Buildings About Alice is a curator and building historian. She previously worked in the commercial heritage sector and prior to this, for the Pevsner Architectural Guides. Her research interests include building during the reign of Charles I and the Civil War and the development of manorial estates following the dissolution of the monasteries. Her MA thesis which uncovered the history of the houses at Mells, Somerset, was the topic of a paper given at the Society of Antiquaries in 2022. With a background in music, Alice is also interested in the relationship between design and performance at the English and French courts in the early modern period. Select publications Blows, A. ‘Mells Manor and the Houses of the Horners: An Architectural Overview’, in Art and the Country House (London: Paul Mellon Centre for Studies in British Art, 2020)'
