["https://hrp.org.uk/about-us/collections/architectural-drawings"]
title = "Architectural drawings  | Historic Royal Palaces"
description = "The Historic Royal Palaces Architectural Drawings Collection is an archive of historic and modern drawings detailing the architectural histories of the palaces in the late 19th and 20th centuries."
full_description = 'Start of main content { "@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [ { "@type": "ListItem", "position": 1, "name": "About us" , "item": "https://www.hrp.org.uk/about-us/" } , { "@type": "ListItem", "position": 2, "name": "Collections" , "item": "https://www.hrp.org.uk/about-us/collections/" } , { "@type": "ListItem", "position": 3, "name": "Architectural drawings" } ] } Home About us Collections Architectural drawings Architectural drawings The Historic Royal Palaces Architectural Drawings Collection is an archive of historic and modern drawings detailing the architectural histories of the palaces in the late 19th and 20th centuries. The archive holds around 30,000 drawings for the Tower of London, Hampton Court Palace, Kensington Palace, Kew Palace and the Banqueting House, Whitehall. It includes original designs, surveys, working drawings, presentation drawings, mechanical, electrical and public health drawings, archaeological record surveys, historical reconstructions and published prints. The drawings range in date from the early 1800s to the early 2000s and include hand-drawings, diazotypes, tracings, blueprints and negatives. Enquiries are welcome and appointments to view the collection can be made by contacting the Archivist. Contact Archivist 4B The CasematesHM Tower of LondonEC3N 4AB 020 3166 6412[email protected] Discover more Image: Plan of the Beauchamp Tower at the Tower of London, 1852, HRP /EH/TOL/2062 Historic Royal Palaces. Anthony Salvin: the architect who transformed the Tower of London Read more about Anthony Salvin, the Victorian architect who began the transformation of the Tower of London in the 19th Century. Read the blog Palace Collections Architecture and building history'
