["https://hsbxl.be/events/byteweek/2023/2023-01-31"]
title = "pre-FOSDEM Byteweek slot"
description = "pre-FOSDEM Byteweek slot"
full_description = "Confirmed events for today [18:00] Soldering workshop: The basics [09:00] pre-FOSDEM Byteweek slot (All day) Currently planned for today [18:00] Soldering workshop: The basics [09:00] pre-FOSDEM Byteweek slot (All day) Invite your FOSS group over! Hackerspace Brussels is opening up for the FOSS community to hack on their projects in the advent of FOSDEM. There’s heating, food, WiFi and also our tool corner to get creative. There’s a setup to give presentations, do workshops or even stream to your community if you feel inclined to do so. Reach out at contact@hsbxl.be for more details. At 18:00 our weekly Tech Tuesday starts, a social gathering. Feel free to stay over and get to know our members!"
