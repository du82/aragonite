["https://hsbxl.be"]
title = "Hackerspace Brussels - HSBXL"
full_description = '''Hackerspace Brussels - HSBXL Located in a historical office building, HSBXL is a collaborative community space of about 170 square meters. It's a place for creative and constructive hackers of all kinds – tech enthusiasts, tinkerers, artists, and anyone interested in pushing the boundaries of technology. There's a workshop area, a decent electronics lab with over 9000 components, a couple of 3D printers, a library, and lots of tools in our “heavy corner”. You're always welcome to come over and follow one of the workshops or attend the weekly Tuesday meetings, co-working days, hack nights, or other events. Curious about what of kind tools, devices, and machines we have in our space? Read more on our tools page. document.addEventListener('DOMContentLoaded', function () { baguetteBox.run('.photo'); new Masonry('.grid', { columnWidth: 160 , }); }); Connect Github Gitlab Meetup Eventbrite Youtube Twitter Mastodon/Fediverse Facebook Wat is HSBXL? Hackerspace Brussels, bekend als HSBXL, is een collaboratieve gemeenschap gevestigd in een historisch kantoorgebouw in Molenbeek, Brussel. De ruimte beslaat ongeveer 170 vierkante meter en is bedoeld voor creatieve en constructieve hackers van allerlei aard—technologie-enthousiastelingen, knutselaars, kunstenaars en iedereen die geïnteresseerd is in het verleggen van technologische grenzen. Faciliteiten bij HSBXL Werkplaats: Een ruimte uitgerust voor diverse projecten en experimenten. Elektronicawerkplaats: Bevat meer dan 9000 componenten voor elektronische projecten. 3D-printers: Beschikbaar voor het maken van prototypes en creatieve ontwerpen. Lasercutter: Beschikbaar voor het maken van prototypes en creatieve ontwerpen. Bibliotheek: Een verzameling bronnen voor leden om te raadplegen. "Heavy Corner": Uitgerust met diverse gereedschappen voor zwaardere werkzaamheden. Doelstellingen van HSBXL Kennisdeling: Bevorderen van leren en uitwisselen van kennis tussen leden door middel van workshops, lezingen en gezamenlijke projecten. Toegang tot technologie: Bieden van apparatuur en middelen die individuen thuis mogelijk niet hebben. Creativiteit en innovatie stimuleren: Een omgeving creëren waar mensen kunnen experimenteren en ideeën tot leven kunnen brengen. Samenwerking bevorderen: Opbouwen van een gemeenschap waar mensen met verschillende achtergronden samenwerken en van elkaar leren. Open cultuur ondersteunen: Bevorderen van openheid en transparantie in technologie, met nadruk op vrije software en open hardware. Evenementen en Activiteiten HSBXL organiseert regelmatig evenementen zoals: TechTuesdays: Wekelijkse open avonden voor zowel leden als bezoekers. Open Coworking Days: Gelegenheden om samen te werken en ideeën uit te wisselen. Workshops en Hackathons: Sessies gericht op specifieke technologieën of projecten. Locatie en Bereikbaarheid HSBXL is gelegen aan Rue Osseghem 53, 1080 Molenbeek, Brussel, België. De ruimte bevindt zich in LionCity, een levendige en innovatieve plek in het hart van Brussel, gehuisvest in het voormalige distributiecentrum van Delhaize in Molenbeek. LionCity herbergt een diverse mix van ambachten, ondernemers, sociale projecten, cultuur, sport en stedelijke landbouw. De dichtstbijzijnde metrohalte is Beekkant, op slechts enkele tientallen meters afstand, waar de meeste metrolijnen in Brussel (1, 5, 2, 6) stoppen. Bij aankomst bij LionCity, als de poort gesloten is, kunt u bellen naar +32 2 880 40 04; een lid zal u dan verder begeleiden. Contact Voor vragen kunt u contact opnemen via Matrix op #hsbxl:matrix.org. Lidmaatschap Geïnteresseerden kunnen lid worden van HSBXL om toegang te krijgen tot de faciliteiten en deel te nemen aan de gemeenschap. Meer informatie over het lidmaatschap is beschikbaar op de officiële website. HSBXL is een non-profitorganisatie die draait op vrijwilligers en is gebaseerd op waarden zoals openheid, inclusiviteit en de wens om technologie ten goede van de gemeenschap te gebruiken. Iedereen met een nieuwsgierige geest en een passie voor leren is welkom, ongeacht ervaring of achtergrond. C'est quoi, HSBXL? Hackerspace Brussels, connu sous le nom de HSBXL, est une communauté collaborative située dans un bâtiment historique à Molenbeek, Bruxelles. L'espace s'étend sur environ 170 mètres carrés et est destiné aux hackers créatifs et constructifs de tous horizons—enthousiastes en technologie, bricoleurs, artistes et toute personne intéressée à repousser les limites technologiques. Installations à HSBXL Atelier: Un espace équipé pour divers projets et expérimentations. Atelier d'électronique: Contient plus de 9000 composants pour des projets électroniques. Imprimantes 3D: Disponibles pour créer des prototypes et des conceptions créatives. Découpeuse: Disponibles pour créer des prototypes et des conceptions créatives. Bibliothèque: Une collection de ressources consultables par les membres. "Heavy Corner": Équipé d'outils divers pour les travaux lourds. Objectifs de HSBXL Partage de connaissances: Encourager l'apprentissage et l'échange de savoir entre les membres grâce à des ateliers, des conférences et des projets communs. Accès à la technologie: Fournir des équipements et des ressources que les individus n'ont peut-être pas chez eux. Stimuler la créativité et l'innovation: Créer un environnement où les gens peuvent expérimenter et donner vie à leurs idées. Favoriser la collaboration: Construire une communauté où des personnes de différents horizons collaborent et apprennent les unes des autres. Soutenir une culture ouverte: Promouvoir l'ouverture et la transparence en technologie, en mettant l'accent sur les logiciels libres et le matériel open source. Événements et Activités HSBXL organise régulièrement des événements tels que : TechTuesdays: Soirées ouvertes hebdomadaires pour les membres et les visiteurs. Journées de coworking ouvertes: Opportunités pour travailler ensemble et échanger des idées. Ateliers et hackathons: Sessions axées sur des technologies ou projets spécifiques. Emplacement et Accessibilité HSBXL est situé au Rue Osseghem 53, 1080 Molenbeek, Bruxelles, Belgique. L'espace se trouve à LionCity, un lieu vivant et innovant au cœur de Bruxelles, hébergé dans l'ancien centre de distribution de Delhaize à Molenbeek. LionCity abrite une mixité diversifiée d'artisanat, d'entrepreneurs, de projets sociaux, de culture, de sport et d'agriculture urbaine. La station de métro la plus proche est Beekkant, à seulement quelques dizaines de mètres, où s'arrêtent la plupart des lignes de métro de Bruxelles (1, 5, 2, 6). À votre arrivée à LionCity, si le portail est fermé, vous pouvez appeler le +32 2 880 40 04 ; un membre vous guidera pour entrer. Contact Pour toute question, vous pouvez contacter via Matrix à #hsbxl:matrix.org. Adhésion Les personnes intéressées peuvent devenir membres de HSBXL pour accéder aux installations et participer à la communauté. Plus d'informations sur l'adhésion sont disponibles sur le site officiel. HSBXL est une organisation à but non lucratif, gérée par des bénévoles et basée sur des valeurs telles que l'ouverture, l'inclusivité et le désir d'utiliser la technologie au service de la communauté. Toute personne curieuse et passionnée par l'apprentissage est la bienvenue, quel que soit son niveau d'expérience ou ses origines. ˅ Resources 📂 images/space01.jpg images/space02.jpg images/space03.jpg images/space04.jpg images/space05.jpg images/space06.jpg images/space07.jpg images/space08.jpg images/space09.jpg images/space10.jpg images/space11.jpg images/space12.jpg images/space13.jpg ˅ Page changelog 📖 2025-02-18: improved OSM linking and added mastodon url verification (Thibault Molleman) 2024-07-12: Use gallery feature for home page (Adrian Pascu) 2024-07-12: Add some photos to the main page to immediately communicate the vibe and concept of our hackerspace (Bert Van de Poel) 2024-05-29: Update meetup link (Adrian Pascu) 2024-05-15: Add Eventbrite link (Adrian Pascu) 2024-05-15: Add Meetup link (Adrian Pascu) 2024-05-03: Format files (Adrian Pascu) 2024-03-25: Update the Mastodon links (Thibault Molleman) 2024-01-05: Add favicon (Adrian Pascu) 2022-09-18: Remove defunct Link to https://www.meetup.com/hackerspace-Brussels-hsbxl/ (Benedikt Wildenhain) 2020-09-02: added space between metal hand and H (Nino) 2019-03-19: 🤘 (betz) 2018-12-11: redirect /welcome to the front (betz) 2018-12-04: meetup link on frontpage (betz) 2018-11-25: Update _index.md (Betz) 2018-11-18: citygate iframe height (betz) 2018-11-18: frontpage template, video shortcode (betz) [Edit this page] Contact us For any questions you can reach out to us over Matrix at #hsbxl:matrix.org.'''
