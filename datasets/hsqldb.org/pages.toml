["http://hsqldb.org/web/supportware.html"]
title = "HSQLDB SupportWare"
description = "hsqldb: Full-featured 100% Java ORDBMS"
full_description = "A significant development effort has led to the release of the latest version of HSQLDB. Better compatibility with new versions of Java, as well as improved code quality are just part of this effort. For years, HSQLDB has been Java developers' best choice for development, testing and deployment of database applications. We have maintained our leading position through continuous enhancements. A major development effort has resulted in version 2.7.4, the most advanced open source RDBMS for small and medium sized databases. HSQLDB SupportWare allows individual developers, corporations and organizations to support the maintenance and development of HSQLDB. This is for individual developers who want to support the HyperSQL project. In return, your questions will get priority and you will get a say in future developments. This is for corporations with limited internal use or less than 50 distributed units of HyperSQL. Your developers will get the same benefits as individual developers. Premier Corporate subscription - large corporations, large-scale use or distribution - base level $2500 or �2500 This is for corporation with extensive use or distribution of HyperSQL. You can ask for enhancements and they will be implemented to the extent your financial contribution allows. Full deployment support is also provided. The suggested amounts for Premier Corporate subscription are the minimum recommended amounts. If you consider that your use of HSQLDB warrants a larger contribution, please use your discretion. Feature Sponsorship allows an organization to sponsor specific new features or improvements. If your organization would benefit from the addition of a new feature or capability to HSQLDB, you can fund its development after discussion and agreement with Fred Toussi, the Project Maintainer. Please send an email to fredt (at) users.sourceforge.net Project Sponsorship We also welcome corporate project sponsors to support the general development of the software. Project sponsors will be featured on our home page and can include their news and announcements."
