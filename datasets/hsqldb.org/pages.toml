["https://hsqldb.org/doc/2.0/guide/deployment-chapt.html"]
title = "Chapter 12. Deployment Guide"
full_description = "Copyright 2002-2024 Fred Toussi. Permission is granted to distribute this document without any alteration under the terms of the HSQLDB license. Additional permission is granted to the HSQL Development Group to distribute this document with or without alterations under the terms of the HSQLDB license. Memory used by the program can be thought of as two distinct pools: memory used for table data, which is not released unless the data is deleted; and memory that is released automatically, which includes memory used for caching, building result sets and other internal operations such as storing the information needed for rolling back a transaction. Most JVM implementations allocate up to a maximum amount of memory (usually 64 MB by default). This amount is generally not adequate when large memory tables are used, or when the average size of rows in cached tables is larger than a few thousand bytes. The maximum amount of allocated memory can be set on the Java command line that is used for running HyperSQL. For example, the JVM parameter -Xmx256m increases the amount to 256 MB. The memory used for a MEMORY table is the sum of memory used by each row. Each MEMORY table row is a Java object that contains an array of objects for the fields in the row. Each field is an object such as Integer, Long, String, etc. In addition, each index on the table adds a node object. As a result, a table with just one column of type INTEGER will have four objects per row taking up 80 bytes per row. Beyond this, each extra column in the table adds at least a few bytes to the size of each row. TEXT tables use less memory than MEMORY tables, as the array of objects is read from the disk only when needed. CACHED tables use even less memory, as discussed below. With CACHED tables, the data is stored on disk and only up to a maximum number of rows are held in the memory cache at any time. These cached rows use the same amount of memory per row as MEMORY tables. A single memory cache is used for all CACHED tables."
