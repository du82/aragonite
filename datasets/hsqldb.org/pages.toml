["http://hsqldb.org/web/usagelinks.html"]
title = "HyperSQL Usage Examples"
description = "hsqldb: Full-featured 100% Java ORDBMS"
full_description = "For new users. A step-by-step tutorial with Java code examples. Note the Data Types page is mixed up with features from SQL Server, which you should ignore. For new users. A simple, illustrated guide on how to run an HSQLDB server and to connect to the server with the Database Manager Swing. Introduction to programming with HSQLDB in 5 parts. This popular guide introduces HSQLDB and shows examples of how to connect and use with JDBC, Java Server Pages and JSTL. You can use the guide with HSQLDB 2.X. Unit testing and integration testing using JUnit, Liquibase, HSQLDB, Hibernate, Maven and Spring Framework This guide shows how to program a JPA application using Hibernate and HSQLDB. The guide is in 2 parts. There is a link to part 1 at the beginning of the page. If you use HSQLDB 2.x, please use the latest Hibernate 3.6 and follow the guide. This guide shows how to use HSQLDB for testing JPA/Hibernate applications targeted for Oracle. Covers how to account for database engine differences. With the latest HSQLDB, this task has become easier due to the ORA syntax compatibility mode. This guide shows how to program a GWP JPA application using Hibernate JPA and HSQLDB. If you use HSQLDB 2.x, please use the latest Hibernate 3.6 and follow the guide."
