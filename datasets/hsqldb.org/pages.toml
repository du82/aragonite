["http://hsqldb.org/web/hsqlFeatures.html"]
title = "HyperSQL Features"
description = "hsqldb: Full-featured 100% Java ORDBMS"
full_description = "Since the release of version 2.0, many new features and enhancements have been introduced in point releases. Regular code reviews, user feedback, and bug fixes resulted in the latest release. This document lists the enhancements and new features in version 2.0 and beyond. An extensive range of new SQL and JDBC capabilities, increased scalability, and better query optimisation have been achieved by a rewrite of most of the internal components and the addition of some major new ones. All areas of functionality have been thoroughly tested with an extensive internal test suite and by users with their applications. HyperSQL 2.0 went into alpha release in April 2009 and several RC releases were downloaded over 20000 times before the final release in June 2010. Over 200 users submitted bug reports which were promptly fixed. The same process was repeated again and again over the next 9 years. There were 7 point releases in 2011, followed by another 16 between 2012 and 2024. An extensive Guide was written over two years to cover all features of the engine in detail. It has been updated with each release to cover the latest features. Fully multithreaded core supports 2PL (two-phased locking) and MVCC (multiversion concurrency control), plus a hybrid 2PL+MVCC transaction control mode. Transactions can be SERIALIZABLE or READ COMMITTED, using strict 2PL concurrency control. Version 2.0 also adds the MVCC modes, SNAPSHOT ISOLATION and READ CONSISTENCY, which are comparable to REPEATABLE READS and READ COMMITTED isolation levels, but with higher concurrency. Many enhancements are introduced to allow maximum multi-threaded concurrency in different isolation modes. Massive high performance LOB store for BLOBs and CLOBs up to multi-gigabyte size, with total storage capacity of 64 terabytes. Increased default storage space of 64GB for all CACHED table disk-based data, with fast startup and shutdown. The default can always be extended to 8TB with a connection property. With another connection property at the time of database creation, the maximum can be extended to 256TB."
year_published = 2025
