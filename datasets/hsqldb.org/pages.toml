["https://hsqldb.org/web/openoffice.html"]
title = "HyperSQL and OpenOffice.org"
description = "hsqldb: 100% Java Database"
full_description = "In 2021, two new OOo and LO extensions are developed and maintained on GitHub by the developer prrvchr. These extensions make it easy to use the latest version of HSQLDB 2.x with the latest versions of the Base program. One extension simply adds and loads the HSQLDB 2.x jar, ready for use. It also allows updating the jar to the latest version. The second extension extracts the database from the .odb file in the same directory and connects to the extracted database files. The simple driver: https://github.com/prrvchr/jdbcDriverOOo/ The driver that extracts the files: https://github.com/prrvchr/HyperSQLOOo/ The extensions are easy to use, with clear visual instructions on how to add the extensions to the Office suite and how to create and open databases. HSQLDB 1.8 has been included with OpenOffice.org since OOo 2.0 (2005), providing users with an integrated SQL database engine. It is also included with LibreOffice. Current release versions of both OpenOffice.org and LibreOffice include a version of HSQLDB 1.8.0.x. The Base program of these office suites allow the user to create databases with a GUI and save them as a self-contained file. Over a period of 18 months, HSQLDB 2.x was integrated into the development code for OpenOffice.org in cws hsqldb19 (a code branch of OOo Base). This was a collaboration between OpenOffice.org and HSQLDB developers and the snapshots releases have been tested by volunteers. As of April 2011, this development branch was ready to be released as part of OpenOffice version 3.4 or 3.5. We are willing to collaborate with LibreOffice and Apache OpenOffice to integrate the latest 2.x version of HSQLDB. Well before the new extensions were released, it was already possible to use HSQLDB 2.x as an external embedded or client-server database with both OpenOffice.org (OOo) and LibreOffice (LO) Base program. This configuration is currently the choice of many users with large or network-shared databases. Thanks to the OOo community, information on how to use HSQLDB 2.x with the current versions of OpenOffice.org and LibreOffice is widely available. One starting point is here:"
