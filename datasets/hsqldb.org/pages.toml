["https://hsqldb.org/doc/2.0/util-guide/systempls-app.html"]
title = "Appendix A. SqlTool System PL Variables"
full_description = '''SqlTool System PL variables are the mechanism used to configure SqlTool behavior. You can list all set PL variables by running the SqlTool command * listvalues. If a SqlTool System variable is not shown, then it is unset (which is equivalent to non-null). But if a system variable is not set, that doesn't mean that the setting behavior will be unset, but rather that the default behavior will apply. For example, if you * listvalues and the variable *DSV_COL_DELIM is not listed, that doesn't mean that there will be no DSV column delimiter, but that the default DSV column delimiter will be used. The in-program help can be used to determine what the default behavior is. (In the case of *DSV_COL_DELIM, you can see the default behavior by running \x?. Besides System PL variables, there are also user PL variables which have names beginning with a letter, and the special variables ? and NULL. NULL is completely equivalent to *NULL, which is explained below. Where the table below reports that a variable is read only, for now that usually means only that you should treat is as read-only. Behavior will be unpredictable if you write to these. At some point in future I may add enforcement of this. (Contact me if this is important for you). Read only literal string for use with forrows, but inversely to *ROW availability, *ROWS is never available inside of a forrows, only after a forrows. (To use a previous ROWS value inside a forrows loop, you would have to assign it to a user PL variable). The value is just the contatenation of *ROW for each row joined with *DSV_ROW_DELIM delimiter. It is basically a simple DSV export for the query. Be aware that the \p command can't take an argument with line delimiters, so though you can use *ROWS with the default *DSV_ROW_DELIM value for exporting, comparing, and other purposes, to print it with \p you will need to change *DSV_ROW_DELIM so that it doesn't include a line break.'''
