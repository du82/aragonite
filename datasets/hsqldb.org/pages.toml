["http://hsqldb.org"]
title = "HSQLDB"
description = "hsqldb: Full-featured 100% Java RDBMS"
full_description = "Commercial support for business users of HSQLDB is available from the HyperXtremeSQL web site. A higher-performance database engine based on HSQLDB, with several additional features such as extended OLAP, the PL/HXSQL procedural language and COMPACT memory tables is also available from that site. HSQLDB is included with OOo and LibreOffice and downloaded over 100 million times. Some information on the use of HSQLDB within OpenOffice.org can be found here. HSQLDB was the 5th most popular relational database used from JVM in a 2016 survey of deployed software HSQLDB supports the widest range of SQL Standard features seen in any open source database engine: SQL:2023 core language features and an extensive list of SQL:2023 optional features. It supports full Advanced ANSI-92 SQL with only two exceptions. Many extensions to the Standard, including syntax compatibility modes and features of other popular database engines, are also supported. HyperSQL is fully multithreaded and supports high performance 2PL and MVCC (multiversion concurrency control) transaction control models. See the list of features in the latest version. Recent releases added support for JSON constructor functions as well as direct CSV data load and unload. Temporal system-versioned tables keep all the data changes over time, allowing queries to view historic snapshots and, with PERIOD predicates, data changes over any period of time. Fine-grained row-level access control governs visibility and permissions on rows of data. Log-based synchronization keeps replicas in sync. Support for Java 8 java.time classes in JDBC, table spaces for disk-based tables, UUID type for columns, SYNONYM for tables and functions, and auto-updated TIMESTAMP columns on row updates, are some of the recent features. Other features include: The ability to cancel long-running statements from JDBC as well as from admin sessions. UTF-16 file support for text table sources. MySQL compatibility for REPLACE, INSERT IGNORE and ON DUPLICATE KEY UPDATE statements."
