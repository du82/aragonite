full_description = "ManifoldCF version 1.0 was released in October 2012 following graduation as an Apache project. ManfoldCF is a general spider framework that tracks and processes documents in repositories, databases and file systems. It relies entirely on a relational database to store scanning histories and current operations. HSQLDB can be used as the default embedded database when a separate database server such as PostgreSQL is not used. We cooperated with the project and added minor enhancements to HSQLDB to improve the performance of some complex queries used for viewing the history. HSQLDB's multithreaded MVCC model is put to good use to allow non-blocking access to the heavily updated database that can grow to hundreds of megabytes. This list is of course not complete. Especially, hundreds of open-source projects that use HSQLDB have not been listed. Please feel free to submit a link to be added to this list. We only publish links to well-established software on this page. New and up-and-coming software releases of special interest may also be listed."
