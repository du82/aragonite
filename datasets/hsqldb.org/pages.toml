["https://hsqldb.org/web/hsqlDevelopment.html"]
title = "HyperSQL Development"
description = "hsqldb: Full-featured 100% Java ORDBMS"
full_description = "2005-today: After the release of version 1.8.0 in 2005, we aimed to develop a highly standard-compliant database engine to support advanced data types and Standard SQL syntax. This required a complete rewrite of most core and interface components of the engine and was done in stages over four years. We avoided early releases in order to provide a well-balanced feature set. Version 2.0.0 was finally released in June 2010, after a year of alpha and beta releases with extensive public tests. We completed all the features listed in the new features page. Since the release of 2.0.0, we have added enhancements, new features and fixed reported bugs, resulting in version 2.7.1 in October 2022. Point releases have appeared on average twice a year. Recent new features include hot backup, multi-billion row tables, extended SQL syntax compatibility modes, JEE XA transactions, connection pool and many new built-in functions. We add regular enhancements to all areas of the engine. For example, recursive query support was improved in version 2.7.1. See the SupportWare page on how you can support the effort financially. The development effort and all public releases are coordinated by the full-time Maintainer to ensure continuity and consistency. We are always looking for new developers to join our team. Anyone who would like to contribute code, tests, documentation or translation is welcome to join. Please send an email to the Maintainer, Fred Toussi, fredt (at) users.sourceforge.net with your proposed enhancement. When you contribute code, you are expected to contribute tests that validate your code. HSQLDB is used in (or is supported by) a large number of open source projects. We welcome direct, priority contact with developers from those projects to ensure a smooth transition to new versions. You can point us to the HSQLDB access code in your pre-release sources and we will look and suggest any simple improvements that may be necessary. We value contributions from all developers who use HSQLDB in their projects. We have been able to fulfil many requests for additional features or bug fixes and will continue to give priority to what users ask for."
