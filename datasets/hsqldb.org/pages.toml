full_description = "HSQLDB (HyperSQL Database) is a relational database engine written in Java. Version 2.7 offers many features and adheres closely to the latest SQL and JDBC 4 standards. A set of HTML, PDF and text documents covering different aspects of HSQLDB and some of its utilities. The license texts for the source and binaries, based on the BSD license. hsqldb_lic.txt is for sources developed entirely by the HSQL Development Group. hypersonic_lic.txt is for sources that contain code from the closed HypersonicSQL project. Support for HyperSQL is available from http://hsqldb.org/support in various forms, including a mailing list and user forums. The web site features the latest bugfix versions of the software, FAQ and other useful resources."
