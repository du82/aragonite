["https://hstspreload.org/removal"]
title = "HSTS Preload List Removal"
full_description = 'Enter a domain to remove from the HSTS preload list: document.getElementById("domain-form").classList.remove("hidden"); This form requires JavaScript. Remove Successful Removal example.com is now pending removal from the HSTS preload list. Please make sure that example.com never sends an HSTS header with the preload directive, unless you are ready to preload again. Good luck with HSTS in the future! Failure An error occurred. Please start over. Information This form can be used to remove domains from the HSTS preload list. Removal Requirements If a preloaded site sends a valid HSTS header without the preload directive, it is considered to be requesting removal from the preload list. In order to be removed from the HSTS preload list through this form, your site must demonstrate the removal request by satisfying the following set of requirements: Be preloaded or pending preload through hstspreload.org. Serve HTTPS with a valid certificate. Send a valid HSTS header. The header must not contain the preload directive. Please note that a preload list domain removal may take 6-12 weeks to reach most Chrome users, and may take longer for other browsers. Disabling HSTS If you completely want to disable HSTS, you can send the following knockout entry: Strict-Transport-Security: max-age=0 If you want to be removed from the preload list but do not completely want to disable HSTS, it is up to you whether you would like remove the includeSubDomains directive or change the max-age value, as long as you remove the preload directive.'
year_published = 2025
