["https://htmlgoodies.com/privacy-policy"]
title = "Privacy Policy | HTML Goodies"
description = "The original home of HTML tutorials. HTMLGoodies is a website dedicated to publishing tutorials that cover every aspect of being a web developer. We cover programming and web development tutorials on languages and technologies such as HTML, JavaScript, and CSS. In addition, our articles cover web frameworks like Angular and React.JS, as well as popular Content Management Systems (CMS) that include WordPress, Drupal, and Joomla. Website development platforms like Shopify, Squarespace, and Wix are also featured. Topics related to solid web design and Internet Marketing also find a home on HTMLGoodies, as we discuss UX/UI Design, Search Engine Optimization (SEO), and web dev best practices."
full_description = "Privacy Policy Effective Date: March 1, 2014 (Updated September 20th, 2023) THE FOLLOWING DESCRIBES THE INFORMATION THAT TECHNOLOGYADVICE COLLECTS AND HOW IT USES SUCH INFORMATION. PLEASE READ THIS PRIVACY POLICY CAREFULLY BEFORE USING THIS WEBSITE. BY USING THE SERVICES OR SUBMITTING PERSONAL INFORMATION THROUGH THE SERVICES, YOU EXPRESSLY CONSENT TO THE PROCESSING AND USE OF YOUR PERSONAL INFORMATION ACCORDING TO THIS PRIVACY POLICY. Privacy Statement TechnologyAdvice, LLC and its subsidiaries (collectively “TechnologyAdvice”) are committed to safeguarding your privacy online. This privacy policy applies to Your information that TechnologyAdvice collects and receives. By using this website (“Website”) You agree to the terms of this Privacy Policy. Please read the following policy to understand how Your Personal Information will be treated as You use TechnologyAdvice's Services. The following discloses our information gathering and dissemination practices. All capitalized terms not defined in this Privacy Policy have the same meaning as defined in TechnologyAdvice's Terms of Use. Personal Information Defined For this Privacy Policy, “Personal Information” means information that is personally identifiable such as names, addresses, e-mail addresses, or phone numbers, as well as other non-public information that is associated with a User. TechnologyAdvice collects and uses Personal Information as described in this Privacy Policy from the Users of our Services. Personal Information TechnologyAdvice Collects TechnologyAdvice collects Personal Information upon Your consent. This information might be used to send you product recommendations, articles via a newsletter, or more information about a particular technology vendor, depending on the form you fill out and the consent you provide at the time you fill out that form. Product Recommendations: TechnologyAdvice collects Personal Information from You in order to connect You with sellers of technology (“Services”) that You are searching for. When You give TechnologyAdvice access to Personal Information for this purpose, You consent to receive product recommendations and technology buying advice from TechnologyAdvice via email or phone call, and with your consent the Website may pass your data along to technology vendors who meet your requirements. Email Newsletters: TechnologyAdvice collects email addresses to provide readers of our blogs with updates via email newsletters. These email newsletters contain links to blog posts, product recommendations, and links to research white papers that match your technology or industry interests. Get Pricing: Should You request pricing details for a particular technology listed on the site, TechnologyAdvice will collect Personal Information such as: Email address Name Phone number Industry Company demographics When You consent to receive pricing details for a technology, TechnologyAdvice will contact you with those pricing details. With your consent, the Website may pass your data along to technology vendors who meet your requirements. Product Reviews: TechnologyAdvice uses your personal information to verify Your identity and to ensure you are not a current or previous employee of the technology company or their direct competitors. TechnologyAdvice collects the following Personal Information that You submit voluntarily. You may provide TechnologyAdvice with additional information about You as You use the Services such as: physical addresses telephone numbers information regarding Your business (e.g., business name, revenue thresholds, etc.) information regarding Your business needs and technology requirements other personally identifiable information You affirmatively provide to us such as LinkedIn profile information When You contribute posts and reviews, participate in TechnologyAdvice surveys (either directly, or through third party service providers), or provide any other Content to the Services through other means, TechnologyAdvice will collect all the information You provide. In connection with reviews, posts, and surveys, TechnologyAdvice (and/or its third party service providers) may collect a wide variety of product- and vendor-related information. Please be aware that while some pieces of information that You provide to TechnologyAdvice would not be sufficient to identify You when seen by another User without any context, the combination of different pieces of information that You have provided for viewing by other Users, or any contextual information, may allow other Users and TechnologyAdvice to identify You. When You contact TechnologyAdvice by sending TechnologyAdvice an e-mail or when You use any of our contact forms, TechnologyAdvice will collect any information that is contained in (and/or attached to) Your e-mail, text message, or that You enter into such forms. TechnologyAdvice does not collect, process or control any sensitive personal information such as Physical or Mental Health, Political Beliefs or Genetics, etc. Legal Grounds for Processing Information under GDPR For our direct marketing activities, we employ Legitimate Interest as legal grounds for processing data. Browsing the Website If You browse through the Website without entering any Personal Information, TechnologyAdvice will automatically gather and store certain information about Your visit. This information does not identify You personally and cannot be linked back to You unless You decide at some point to identify Yourself. If You are only browsing, TechnologyAdvice may collect the following information (whenever possible): IP address, domain name, the type of browser and operating system used to access the Website, the date and time You access the Website, the pages You visit (click-through), and if You linked to the Website from another website, the address of that website as well as additional information related to Your visit. TechnologyAdvice uses Your IP address to help diagnose problems with our server, and to administer the Website. Cookies TechnologyAdvice may place “cookies” on Your personal computer. “Cookies” are small identifiers sent from a web server and stored on Your computer's hard drive, similar to a license plate, that help TechnologyAdvice to recognize You if You visit the Website again. TechnologyAdvice use cookies to record session information, such as record user-specific information on what pages You access or visit, record past activity in order to provide better service when You return to the Website, ensure that You are not repeatedly sent the same banner ads, to customize Website content based on Your browser type, and to track how You found the Website. Cookies are not designed to be used to get data from Your hard drive, Your e-mail or any other personal data about You. To protect Your privacy, TechnologyAdvice does not use cookies to store or transmit any Personal Information about You on the Internet. You can reject cookies by changing Your browser settings. Please note, however, that if You reject our cookies, it is possible that some web pages may not properly load, Your access to certain information might be denied or You might have to enter information about Yourself more than once. Minors TechnologyAdvice does not knowingly collect personally identifiable information by anyone under the age of 18. Do not fill out any forms on the site if You are under the age of 18 and do not provide TechnologyAdvice with any information regarding any individual under the age of 18. Use of Personal Information Personal Information You submit to TechnologyAdvice, or to third parties that support us in collecting information, is used by us to provide You and other Users with the Services, to respond to requests that You make, to improve our Services, and to operate, maintain, and improve the features, functionality, performance, and support of the Services. TechnologyAdvice uses the Personal Information that it gathers about You for the following purposes: To provide our Services to You, to communicate with You about Your use of the Services, to respond to Your inquiries, to fulfill Your orders, and for other customer service purposes, which may include communicating with You via email To tailor the content and information that TechnologyAdvice may send or display to You, personalized help and instructions, and to otherwise personalize Your experiences while using the Website or the Services For customer loyalty programs To share with website affiliates, and/or vendors of products You have given us consent to contact You regarding products or services as a means of establishing communication between both You and such vendors or affiliates. For marketing and promotional purposes. For example, TechnologyAdvice may use information You provide to contact You in the manner(s) You request at the time that data is collected. TechnologyAdvice may collect your email address to send You news and newsletters, special offers and promotions, or to otherwise contact You about products or information You expressed interest in. TechnologyAdvice also may use the information that TechnologyAdvice learns about You to assist us in advertising our Services on third party websites. To better understand how users access and use the Website and Services, both on an aggregated and individualized basis, to improve the Website and Services and respond to user desires and preferences, and for other research and analytical purposes Public Postings One of the purposes of the Services is for Users to share product- and vendor-related information with other Users. Therefore, You should assume that any information (including any Personal Information You may choose to provide, but excluding Your registration information) that You post will be made available to other Users of the Services. TechnologyAdvice may provide You the ability to anonymously post certain comments, in which case TechnologyAdvice will not include Your contact information (i.e., name, username, email address, or postal address) on the Website in connection with such comments. However, You should know that TechnologyAdvice's internal records may associate Your contact information with such comments. Feedback If You provide feedback about the Services, TechnologyAdvice may use and disclose such feedback for any purpose, provided TechnologyAdvice does not associate such feedback with Your Personal Information. TechnologyAdvice will collect any information contained in such feedback and will treat the Personal Information in it in accordance with this Privacy Policy. Disclosure of Personal Information Except as otherwise stated in this Privacy Policy, TechnologyAdvice does not disclose to or share Your Personal Information with third parties, unless You ask or authorize TechnologyAdvice to do so. TechnologyAdvice may provide Your Personal Information to third party service providers and suppliers who work on behalf of or with TechnologyAdvice to provide You with some of the services and features of the Services and to help us communicate with Users. However, these service providers and suppliers do not have any independent right to use this information except to help TechnologyAdvice provide the Services. TechnologyAdvice may share some or all of Your Personal Information with any parent company, subsidiaries, joint ventures, or other companies under a common control (collectively, “Affiliates”), in which case TechnologyAdvice will require Affiliates to honor this Privacy Policy. Data Retention Unused data and data that falls outside of categories we deem commercially viable will be deleted. To ensure the accuracy of our recommendations and the privacy of Personal Information, TechnologyAdvice analyzes all records annually and deletes any that have gone untouched, unprocessed, and unreferenced in a timespan of 5 years. Data that has been requested to be forgotten will be deleted promptly. Mergers In the event TechnologyAdvice goes through a business transition such as a merger, acquisition by another company, or sale of all or a portion of its assets, Your Personal Information will likely be among the assets transferred. You acknowledge that such transfers may occur, and that any acquirer of TechnologyAdvice or its assets may continue to use Your Personal Information as set forth in this Privacy Policy. Legal Obligation to Disclose TechnologyAdvice may (and You authorize us to) disclose information TechnologyAdvice has collected from and about You (including Personal Information) if TechnologyAdvice believes in good faith that such disclosure is necessary to (a) comply with relevant laws or to respond to subpoenas or warrants served on us; (b) to enforce our TechnologyAdvice Terms of Use and Privacy Policy; or (c) to protect and defend the rights or property of us, the users of our Services, or third parties. Data Compliance GDPR (General Data Protection Regulation) TechnologyAdvice adheres to rights of data subjects set out by the GDPR standards. Under these standards individual citizens of the European Union (EU) and the European Economic Area (EEA) have the right to: Be forgotten. At any time you may contact TechnologyAdvice's Data Protection Officer and request that your data be fully removed from all of our databases. Update or change your Personal Information Transfer your Personal Information to another data processor or controller Object to the processing of your personal information If You would like to make a subject access request (SAR) to view, delete, or otherwise change the data stored in the TechnologyAdvice database, please contact our Data Protection Officer by emailing datacontroller@technologyadvice.com. CCPA(California Consumer Privacy Act) Through our site and partners, we receive data that you actively submit, as well as data that we track when you request information, or otherwise actively send us data. We usually collect data such as your name, email address, business address, telephone number, and other information related to the business you represent. TechnologyAdvice adheres to rights of data subjects set out by CCPA. Residents of California upon verification have the right to The right to know which personal information is being collected The right to know if personal data is being sold or shared, and to whom The right to object to the sale of personal data The right to access one's own personal information The right to equal service and price, even for consumers who exercise their privacy rights We may deny your deletion request if retaining the information is necessary for us or our service providers to: Complete the transaction for which we collected the personal information, provide a good or service that you requested, take actions reasonably anticipated within the context of our ongoing business relationship with you, or otherwise perform our contract with you. Detect security incidents, protect against malicious, deceptive, fraudulent, or illegal activity,"
