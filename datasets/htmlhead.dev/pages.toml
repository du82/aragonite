full_description = "These elements provide information for how a document should be perceived, and rendered, by web technologies. e.g. browsers, search engines, bots, etc. Most content is shared to Facebook as a URL, so it’s important that you mark up your website with Open Graph tags to take control over how your content appears on Facebook. More about Facebook Open Graph Markup With Twitter Cards, you can attach rich photos, videos and media experiences to Tweets, helping to drive traffic to your website. More about Twitter Cards If you embed tweets in your website, Twitter can use information from your site to tailor content and suggestions to Twitter users. More about Twitter privacy options. Pinterest lets you prevent people from saving things from your website, according to their help center. The description is optional. This branch consists of the README.md file that is reflected on the htmlhead.dev website. All changes to the content of the guide should be made in this file. This branch is responsible for the htmlhead.dev website. We use Jekyll to deploy the README.md markdown file to GitHub Pages. All website related modifications should be made in this branch. You may find it helpful to review the Jekyll Docs and understand how Jekyll works before working in this branch. If this project was helpful for you or your organization, please considering supporting my work directly:"
