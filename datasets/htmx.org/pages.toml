description = "The hx-disable attribute in htmx will disable htmx processing for a given element and all its children."
full_description = "hx-disable The hx-disable attribute will disable htmx processing for a given element and all its children. This can be useful as a backup for HTML escaping, when you include user generated content in your site, and you want to prevent malicious scripting attacks. The value of the tag is ignored, and it cannot be reversed by any content beneath it. Notes hx-disable is inherited haiku javascript fatigue: longing for a hypertext already in hand docs reference examples talk essays @htmx_org The hx-disable attribute will disable htmx processing for a given element and all its children. This can be useful as a backup for HTML escaping, when you include user generated content in your site, and you want to prevent malicious scripting attacks."
