["https://htmx.org/attributes/hx-on"]
title = "</> htmx ~ hx-on Attribute"
description = "The hx-on attributes in htmx allow you to write inline JavaScript event handlers directly on HTML elements, supporting both standard DOM events and htmx-specific events with improved locality of behavior."
full_description = '''hx-on The hx-on* attributes allow you to embed scripts inline to respond to events directly on an element; similar to the onevent properties found in HTML, such as onClick. The hx-on* attributes improve upon onevent by enabling the handling of any arbitrary JavaScript event, for enhanced Locality of Behaviour (LoB) even when dealing with non-standard DOM events. For example, these attributes allow you to handle htmx events. With hx-on attributes, you specify the event name as part of the attribute name, after a colon. So, for example, if you want to respond to a click event, you would use the attribute hx-on:click: <div hx-on:click="alert('Clicked!')">Click</div> Note that this syntax can be used to capture all htmx events, as well as most other custom events, in addition to the standard DOM events. One gotcha to note is that DOM attributes do not preserve case. This means, unfortunately, an attribute like hx-on:htmx:beforeRequest will not work, because the DOM lowercases the attribute names. Fortunately, htmx supports both camel case event names and also kebab-case event names, so you can use hx-on:htmx:before-request instead. In order to make writing htmx-based event handlers a little easier, you can use the shorthand double-colon hx-on:: for htmx events, and omit the “htmx” part: <!-- These two are equivalent --> <button hx-get="/info" hx-on:htmx:before-request="alert('Making a request!')"> Get Info! </button> <button hx-get="/info" hx-on::before-request="alert('Making a request!')"> Get Info! </button> If you wish to handle multiple different events, you can simply add multiple attributes to an element: <button hx-get="/info" hx-on::before-request="alert('Making a request!')" hx-on::after-request="alert('Done making a request!')"> Get Info! </button> Finally, in order to make this feature compatible with some templating languages (e.g. JSX) that do not like having a colon (:) in HTML attributes, you may use dashes in the place of colons for both the long form and the shorthand form: <!-- These two are equivalent --> <button hx-get="/info" hx-on-htmx-before-request="alert('Making a request!')"> Get Info! </button> <button hx-get="/info" hx-on--before-request="alert('Making a request!')"> Get Info! </button> hx-on (deprecated) The value is an event name, followed by a colon :, followed by the script: <button hx-get="/info" hx-on="htmx:beforeRequest: alert('Making a request!')"> Get Info! </button> Multiple handlers can be defined by putting them on new lines: <button hx-get="/info" hx-on="htmx:beforeRequest: alert('Making a request!') htmx:afterRequest: alert('Done making a request!')"> Get Info! </button> Symbols Like onevent, two symbols are made available to event handler scripts: this - The element on which the hx-on attribute is defined event - The event that triggered the handler Notes hx-on is not inherited, however due to event bubbling, hx-on attributes on parent elements will typically be triggered by events on child elements hx-on:* and hx-on cannot be used together on the same element; if hx-on:* is present, the value of an hx-on attribute on the same element will be ignored. The two forms can be mixed in the same document, however.'''
