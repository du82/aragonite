title = "</> htmx ~ hx-params Attribute"
description = "The hx-params attribute in htmx allows you to filter the parameters that will be submitted with an AJAX request."
full_description = 'hx-params The hx-params attribute allows you to filter the parameters that will be submitted with an AJAX request. The possible values of this attribute are: * - Include all parameters (default) none - Include no parameters not <param-list> - Include all except the comma separated list of parameter names <param-list> - Include all the comma separated list of parameter names <div hx-get="/example" hx-params="*">Get Some HTML, Including Params</div> This div will include all the parameters that a POST would, but they will be URL encoded and included in the URL, as per usual with a GET. Notes hx-params is inherited and can be placed on a parent element haiku javascript fatigue: longing for a hypertext already in hand docs reference examples talk essays @htmx_org'
