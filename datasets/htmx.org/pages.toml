["https://htmx.org/attributes/hx-inherit"]
title = "</> htmx ~ hx-inherit Attribute"
description = "The hx-inherit attribute in htmx allows you to explicitly control attribute inheritance behavior between parent and child elements, providing fine-grained control over which htmx attributes are inherited when the default inheritance system is disabled through configuration."
full_description = 'hx-inherit The default behavior for htmx is to “inherit” many attributes automatically: that is, an attribute such as hx-target may be placed on a parent element, and all child elements will inherit that target. Some people do not like this feature and instead prefer to explicitly specify inheritance for attributes. To support this mode of development, htmx offers the htmx.config.disableInheritance setting, which can be set to true to prevent inheritance from being the default behavior for any of the htmx attributes. The hx-inherit attribute allows you to control the inheritance of attributes manually. htmx evaluates attribute inheritance as follows: when hx-inherit is set on a parent node inherit="*" all attribute inheritance for this element will be enabled hx-inherit="hx-select hx-get hx-target" enable inheritance for only one or multiple specified attributes Here is an example of a div that shares an hx-target attribute for a set of anchor tags when htmx.config.disableInheritance is set to false: <div hx-target="#tab-container" hx-inherit="hx-target"> <a hx-boost="true" href="/tab1">Tab 1</a> <a hx-boost="true" href="/tab2">Tab 2</a> <a hx-boost="true" href="/tab3">Tab 3</a> </div> Notes Read more about Attribute Inheritance haiku javascript fatigue: longing for a hypertext already in hand docs reference examples talk essays @htmx_org'
year_published = 2025
