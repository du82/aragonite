["https://htmx.org/docs"]
title = "</> htmx ~ Documentation"
description = """
htmx gives you access to AJAX, CSS Transitions, WebSockets and Server Sent Events directly in HTML, using attributes, so you can build modern user interfaces with the simplicity and power of hypertext
htmx is small (~14k min.gz’d), dependency-free, extendable, IE11 compatible & has reduced code base sizes by 67% when compared with react"""
full_description = '''Documentation Contents introduction installing ajax triggers trigger modifiers trigger filters special events polling load polling indicators targets swapping synchronization css transitions out of band swaps parameters confirming inheritance boosting websockets & SSE history requests & responses validation animations extensions events & logging debugging scripting hx-on attribute 3rd party integration Web Components caching security configuring htmx in a Nutshell htmx is a library that allows you to access modern browser features directly from HTML, rather than using javascript. To understand htmx, first let’s take a look at an anchor tag: <a href="/blog">Blog</a> This anchor tag tells a browser: “When a user clicks on this link, issue an HTTP GET request to ‘/blog’ and load the response content into the browser window”. With that in mind, consider the following bit of HTML: <button hx-post="/clicked" hx-trigger="click" hx-target="#parent-div" hx-swap="outerHTML"> Click Me! </button> This tells htmx: “When a user clicks on this button, issue an HTTP POST request to ‘/clicked’ and use the content from the response to replace the element with the id parent-div in the DOM” htmx extends and generalizes the core idea of HTML as a hypertext, opening up many more possibilities directly within the language: Now any element, not just anchors and forms, can issue an HTTP request Now any event, not just clicks or form submissions, can trigger requests Now any HTTP verb, not just GET and POST, can be used Now any element, not just the entire window, can be the target for update by the request Note that when you are using htmx, on the server side you typically respond with HTML, not JSON. This keeps you firmly within the original web programming model, using Hypertext As The Engine Of Application State without even needing to really understand that concept. It’s worth mentioning that, if you prefer, you can use the data- prefix when using htmx: <a data-hx-post="/click">Click Me!</a> If you understand the concepts around htmx and want to see the quirks of the library, please see our QUIRKS page. 1.x to 2.x Migration Guide Version 1 of htmx is still supported and supports IE11, but the latest version of htmx is 2.x. If you are migrating to htmx 2.x from htmx 1.x, please see the htmx 1.x migration guide. If you are migrating to htmx from intercooler.js, please see the intercooler migration guide. Installing Htmx is a dependency-free, browser-oriented javascript library. This means that using it is as simple as adding a <script> tag to your document head. There is no need for a build system to use it. Via A CDN (e.g. unpkg.com) The fastest way to get going with htmx is to load it via a CDN. You can simply add this to your head tag and get going: <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script> An unminified version is also available as well: <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.js" integrity="sha384-oeUn82QNXPuVkGCkcrInrS1twIxKhkZiFfr2TdiuObZ3n3yIeMiqcRzkIcguaof1" crossorigin="anonymous"></script> While the CDN approach is extremely simple, you may want to consider not using CDNs in production. Download a copy The next easiest way to install htmx is to simply copy it into your project. Download htmx.min.js from unpkg.com and add it to the appropriate directory in your project and include it where necessary with a <script> tag: <script src="/path/to/htmx.min.js"></script> npm For npm-style build systems, you can install htmx via npm: npm install htmx.org@2.0.4 After installing, you’ll need to use appropriate tooling to use node_modules/htmx.org/dist/htmx.js (or .min.js). For example, you might bundle htmx with some extensions and project-specific code. Webpack If you are using webpack to manage your javascript: Install htmx via your favourite package manager (like npm or yarn) Add the import to your index.js import 'htmx.org'; If you want to use the global htmx variable (recommended), you need to inject it to the window scope: Create a custom JS file Import this file to your index.js (below the import from step 2) import 'path/to/my_custom.js'; Then add this code to the file: window.htmx = require('htmx.org'); Finally, rebuild your bundle AJAX The core of htmx is a set of attributes that allow you to issue AJAX requests directly from HTML: AttributeDescription hx-getIssues a GET request to the given URL hx-postIssues a POST request to the given URL hx-putIssues a PUT request to the given URL hx-patchIssues a PATCH request to the given URL hx-deleteIssues a DELETE request to the given URL Each of these attributes takes a URL to issue an AJAX request to. The element will issue a request of the specified type to the given URL when the element is triggered: <button hx-put="/messages"> Put To Messages </button> This tells the browser: When a user clicks on this button, issue a PUT request to the URL /messages and load the response into the button Triggering Requests By default, AJAX requests are triggered by the “natural” event of an element: input, textarea & select are triggered on the change event form is triggered on the submit event everything else is triggered by the click event If you want different behavior you can use the hx-trigger attribute to specify which event will cause the request. Here is a div that posts to /mouse_entered when a mouse enters it: <div hx-post="/mouse_entered" hx-trigger="mouseenter"> [Here Mouse, Mouse!] </div> Trigger Modifiers A trigger can also have a few additional modifiers that change its behavior. For example, if you want a request to only happen once, you can use the once modifier for the trigger: <div hx-post="/mouse_entered" hx-trigger="mouseenter once"> [Here Mouse, Mouse!] </div> Other modifiers you can use for triggers are: changed - only issue a request if the value of the element has changed delay:<time interval> - wait the given amount of time (e.g. 1s) before issuing the request. If the event triggers again, the countdown is reset. throttle:<time interval> - wait the given amount of time (e.g. 1s) before issuing the request. Unlike delay if a new event occurs before the time limit is hit the event will be discarded, so the request will trigger at the end of the time period. from:<CSS Selector> - listen for the event on a different element. This can be used for things like keyboard shortcuts. Note that this CSS selector is not re-evaluated if the page changes. You can use these attributes to implement many common UX patterns, such as Active Search: <input type="text" name="q" hx-get="/trigger_delay" hx-trigger="keyup changed delay:500ms" hx-target="#search-results" placeholder="Search..."> <div id="search-results"></div> This input will issue a request 500 milliseconds after a key up event if the input has been changed and inserts the results into the div with the id search-results. Multiple triggers can be specified in the hx-trigger attribute, separated by commas. Trigger Filters You may also apply trigger filters by using square brackets after the event name, enclosing a javascript expression that will be evaluated. If the expression evaluates to true the event will trigger, otherwise it will not. Here is an example that triggers only on a Control-Click of the element <div hx-get="/clicked" hx-trigger="click[ctrlKey]"> Control Click Me </div> Properties like ctrlKey will be resolved against the triggering event first, then against the global scope. The this symbol will be set to the current element. Special Events htmx provides a few special events for use in hx-trigger: load - fires once when the element is first loaded revealed - fires once when an element first scrolls into the viewport intersect - fires once when an element first intersects the viewport. This supports two additional options: root:<selector> - a CSS selector of the root element for intersection threshold:<float> - a floating point number between 0.0 and 1.0, indicating what amount of intersection to fire the event on You can also use custom events to trigger requests if you have an advanced use case. Polling If you want an element to poll the given URL rather than wait for an event, you can use the every syntax with the hx-trigger attribute: <div hx-get="/news" hx-trigger="every 2s"></div> This tells htmx Every 2 seconds, issue a GET to /news and load the response into the div If you want to stop polling from a server response you can respond with the HTTP response code 286 and the element will cancel the polling. Load Polling Another technique that can be used to achieve polling in htmx is “load polling”, where an element specifies a load trigger along with a delay, and replaces itself with the response: <div hx-get="/messages" hx-trigger="load delay:1s" hx-swap="outerHTML"> </div> If the /messages end point keeps returning a div set up this way, it will keep “polling” back to the URL every second. Load polling can be useful in situations where a poll has an end point at which point the polling terminates, such as when you are showing the user a progress bar. Request Indicators When an AJAX request is issued it is often good to let the user know that something is happening since the browser will not give them any feedback. You can accomplish this in htmx by using htmx-indicator class. The htmx-indicator class is defined so that the opacity of any element with this class is 0 by default, making it invisible but present in the DOM. When htmx issues a request, it will put a htmx-request class onto an element (either the requesting element or another element, if specified). The htmx-request class will cause a child element with the htmx-indicator class on it to transition to an opacity of 1, showing the indicator. <button hx-get="/click"> Click Me! <img class="htmx-indicator" src="/spinner.gif"> </button> Here we have a button. When it is clicked the htmx-request class will be added to it, which will reveal the spinner gif element. (I like SVG spinners these days.) While the htmx-indicator class uses opacity to hide and show the progress indicator, if you would prefer another mechanism you can create your own CSS transition like so: .htmx-indicator{ display:none; } .htmx-request .htmx-indicator{ display:inline; } .htmx-request.htmx-indicator{ display:inline; } If you want the htmx-request class added to a different element, you can use the hx-indicator attribute with a CSS selector to do so: <div> <button hx-get="/click" hx-indicator="#indicator"> Click Me! </button> <img id="indicator" class="htmx-indicator" src="/spinner.gif"/> </div> Here we call out the indicator explicitly by id. Note that we could have placed the class on the parent div as well and had the same effect. You can also add the disabled attribute to elements for the duration of a request by using the hx-disabled-elt attribute. Targets If you want the response to be loaded into a different element other than the one that made the request, you can use the hx-target attribute, which takes a CSS selector. Looking back at our Live Search example: <input type="text" name="q" hx-get="/trigger_delay" hx-trigger="keyup delay:500ms changed" hx-target="#search-results" placeholder="Search..."> <div id="search-results"></div> You can see that the results from the search are going to be loaded into div#search-results, rather than into the input tag. Extended CSS Selectors hx-target, and most attributes that take a CSS selector, support an “extended” CSS syntax: You can use the this keyword, which indicates that the element that the hx-target attribute is on is the target The closest <CSS selector> syntax will find the closest ancestor element or itself, that matches the given CSS selector. (e.g. closest tr will target the closest table row to the element) The next <CSS selector> syntax will find the next element in the DOM matching the given CSS selector. The previous <CSS selector> syntax will find the previous element in the DOM matching the given CSS selector. find <CSS selector> which will find the first child descendant element that matches the given CSS selector. (e.g find tr would target the first child descendant row to the element) In addition, a CSS selector may be wrapped in < and /> characters, mimicking the query literal syntax of hyperscript. Relative targets like this can be useful for creating flexible user interfaces without peppering your DOM with lots of id attributes. Swapping htmx offers a few different ways to swap the HTML returned into the DOM. By default, the content replaces the innerHTML of the target element. You can modify this by using the hx-swap attribute with any of the following values: NameDescription innerHTMLthe default, puts the content inside the target element outerHTMLreplaces the entire target element with the returned content afterbeginprepends the content before the first child inside the target beforebeginprepends the content before the target in the target’s parent element beforeendappends the content after the last child inside the target afterendappends the content after the target in the target’s parent element deletedeletes the target element regardless of the response nonedoes not append content from response (Out of Band Swaps and Response Headers will still be processed) Morph Swaps In addition to the standard swap mechanisms above, htmx also supports morphing swaps, via extensions. Morphing swaps attempt to merge new content into the existing DOM, rather than simply replacing it. They often do a better job preserving things like focus, video state, etc. by mutating existing nodes in-place during the swap operation, at the cost of more CPU. The following extensions are available for morph-style swaps: Idiomorph - A morphing algorithm created by the htmx developers. Morphdom Swap - Based on the morphdom, the original DOM morphing library. Alpine-morph - Based on the alpine morph plugin, plays well with alpine.js View Transitions The new, experimental View Transitions API gives developers a way to create an animated transition between different DOM states. It is still in active development and is not available in all browsers, but htmx provides a way to work with this new API that falls back to the non-transition mechanism if the API is not available in a given browser. You can experiment with this new API using the following approaches: Set the htmx.config.globalViewTransitions config variable to true to use transitions for all swaps Use the transition:true option in the hx-swap attribute If an element swap is going to be transitioned due to either of the above configurations, you may catch the htmx:beforeTransition event and call preventDefault() on it to cancel the transition. View Transitions can be configured using CSS, as outlined in the Chrome documentation for the feature. You can see a view transition example on the Animation Examples page. Swap Options The hx-swap at'''
