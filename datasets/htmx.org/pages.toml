["https://htmx.org/api"]
title = "</> htmx ~ Javascript API"
description = """
htmx gives you access to AJAX, CSS Transitions, WebSockets and Server Sent Events directly in HTML, using attributes, so you can build modern user interfaces with the simplicity and power of hypertext
htmx is small (~14k min.gz’d), dependency-free, extendable, IE11 compatible & has reduced code base sizes by 67% when compared with react"""
full_description = '''Javascript API While it is not a focus of the library, htmx does provide a small API of helper methods, intended mainly for extension development or for working with events. The hyperscript project is intended to provide more extensive scripting support for htmx-based applications. Method - htmx.addClass() This method adds a class to the given element. Parameters elt - the element to add the class to class - the class to add or elt - the element to add the class to class - the class to add delay - delay (in milliseconds ) before class is added Example // add the class 'myClass' to the element with the id 'demo' htmx.addClass(htmx.find('#demo'), 'myClass'); // add the class 'myClass' to the element with the id 'demo' after 1 second htmx.addClass(htmx.find('#demo'), 'myClass', 1000); Method - htmx.ajax() Issues an htmx-style AJAX request. This method returns a Promise, so a callback can be executed after the content has been inserted into the DOM. Parameters verb - ‘GET’, ‘POST’, etc. path - the URL path to make the AJAX element - the element to target (defaults to the body) or verb - ‘GET’, ‘POST’, etc. path - the URL path to make the AJAX selector - a selector for the target or verb - ‘GET’, ‘POST’, etc. path - the URL path to make the AJAX context - a context object that contains any of the following source - the source element of the request, hx-* attrs which affect the request will be resolved against that element and its ancestors event - an event that “triggered” the request handler - a callback that will handle the response HTML target - the target to swap the response into swap - how the response will be swapped in relative to the target values - values to submit with the request headers - headers to submit with the request select - allows you to select the content you want swapped from a response Example // issue a GET to /example and put the response HTML into #myDiv htmx.ajax('GET', '/example', '#myDiv') // issue a GET to /example and replace #myDiv with the response htmx.ajax('GET', '/example', {target:'#myDiv', swap:'outerHTML'}) // execute some code after the content has been inserted into the DOM htmx.ajax('GET', '/example', '#myDiv').then(() => { // this code will be executed after the 'htmx:afterOnLoad' event, // and before the 'htmx:xhr:loadend' event console.log('Content inserted successfully!'); }); Method - htmx.closest() Finds the closest matching element in the given elements parentage, inclusive of the element Parameters elt - the element to find the selector from selector - the selector to find Example // find the closest enclosing div of the element with the id 'demo' htmx.closest(htmx.find('#demo'), 'div'); Property - htmx.config A property holding the configuration htmx uses at runtime. Note that using a meta tag is the preferred mechanism for setting these properties. Properties attributesToSettle:["class", "style", "width", "height"] - array of strings: the attributes to settle during the settling phase refreshOnHistoryMiss:false - boolean: if set to true htmx will issue a full page refresh on history misses rather than use an AJAX request defaultSettleDelay:20 - int: the default delay between completing the content swap and settling attributes defaultSwapDelay:0 - int: the default delay between receiving a response from the server and doing the swap defaultSwapStyle:'innerHTML' - string: the default swap style to use if hx-swap is omitted historyCacheSize:10 - int: the number of pages to keep in localStorage for history support historyEnabled:true - boolean: whether or not to use history includeIndicatorStyles:true - boolean: if true, htmx will inject a small amount of CSS into the page to make indicators invisible unless the htmx-indicator class is present indicatorClass:'htmx-indicator' - string: the class to place on indicators when a request is in flight requestClass:'htmx-request' - string: the class to place on triggering elements when a request is in flight addedClass:'htmx-added' - string: the class to temporarily place on elements that htmx has added to the DOM settlingClass:'htmx-settling' - string: the class to place on target elements when htmx is in the settling phase swappingClass:'htmx-swapping' - string: the class to place on target elements when htmx is in the swapping phase allowEval:true - boolean: allows the use of eval-like functionality in htmx, to enable hx-vars, trigger conditions & script tag evaluation. Can be set to false for CSP compatibility. allowScriptTags:true - boolean: allows script tags to be evaluated in new content inlineScriptNonce:'' - string: the nonce to add to inline scripts inlineStyleNonce:'' - string: the nonce to add to inline styles withCredentials:false - boolean: allow cross-site Access-Control requests using credentials such as cookies, authorization headers or TLS client certificates timeout:0 - int: the number of milliseconds a request can take before automatically being terminated wsReconnectDelay:'full-jitter' - string/function: the default implementation of getWebSocketReconnectDelay for reconnecting after unexpected connection loss by the event code Abnormal Closure, Service Restart or Try Again Later wsBinaryType:'blob' - string: the the type of binary data being received over the WebSocket connection disableSelector:"[hx-disable], [data-hx-disable]" - array of strings: htmx will not process elements with this attribute on it or a parent disableInheritance:false - boolean: If it is set to true, the inheritance of attributes is completely disabled and you can explicitly specify the inheritance with the hx-inherit attribute. scrollBehavior:'instant' - string: the scroll behavior when using the show modifier with hx-swap. The allowed values are instant (scrolling should happen instantly in a single jump), smooth (scrolling should animate smoothly) and auto (scroll behavior is determined by the computed value of scroll-behavior). defaultFocusScroll:false - boolean: if the focused element should be scrolled into view, can be overridden using the focus-scroll swap modifier getCacheBusterParam:false - boolean: if set to true htmx will append the target element to the GET request in the format org.htmx.cache-buster=targetElementId globalViewTransitions:false - boolean: if set to true, htmx will use the View Transition API when swapping in new content. methodsThatUseUrlParams:["get", "delete"] - array of strings: htmx will format requests with these methods by encoding their parameters in the URL, not the request body selfRequestsOnly:true - boolean: whether to only allow AJAX requests to the same domain as the current document ignoreTitle:false - boolean: if set to true htmx will not update the title of the document when a title tag is found in new content scrollIntoViewOnBoost:true - boolean: whether or not the target of a boosted element is scrolled into the viewport. If hx-target is omitted on a boosted element, the target defaults to body, causing the page to scroll to the top. triggerSpecsCache:null - object: the cache to store evaluated trigger specifications into, improving parsing performance at the cost of more memory usage. You may define a simple object to use a never-clearing cache, or implement your own system using a proxy object htmx.config.responseHandling:[...] - HtmxResponseHandlingConfig[]: the default Response Handling behavior for response status codes can be configured here to either swap or error htmx.config.allowNestedOobSwaps:true - boolean: whether to process OOB swaps on elements that are nested within the main response element. See Nested OOB Swaps. Example // update the history cache size to 30 htmx.config.historyCacheSize = 30; Property - htmx.createEventSource A property used to create new Server Sent Event sources. This can be updated to provide custom SSE setup. Value func(url) - a function that takes a URL string and returns a new EventSource Example // override SSE event sources to not use credentials htmx.createEventSource = function(url) { return new EventSource(url, {withCredentials:false}); }; Property - htmx.createWebSocket A property used to create new WebSocket. This can be updated to provide custom WebSocket setup. Value func(url) - a function that takes a URL string and returns a new WebSocket Example // override WebSocket to use a specific protocol htmx.createWebSocket = function(url) { return new WebSocket(url, ['wss']); }; Method - htmx.defineExtension() Defines a new htmx extension. Parameters name - the extension name ext - the extension definition Example // defines a silly extension that just logs the name of all events triggered htmx.defineExtension("silly", { onEvent : function(name, evt) { console.log("Event " + name + " was triggered!") } }); Method - htmx.find() Finds an element matching the selector Parameters selector - the selector to match or elt - the root element to find the matching element in, inclusive selector - the selector to match Example // find div with id my-div var div = htmx.find("#my-div") // find div with id another-div within that div var anotherDiv = htmx.find(div, "#another-div") Method - htmx.findAll() Finds all elements matching the selector Parameters selector - the selector to match or elt - the root element to find the matching elements in, inclusive selector - the selector to match Example // find all divs var allDivs = htmx.findAll("div") // find all paragraphs within a given div var allParagraphsInMyDiv = htmx.findAll(htmx.find("#my-div"), "p") Method - htmx.logAll() Log all htmx events, useful for debugging. Example htmx.logAll(); Method - htmx.logNone() Log no htmx events, call this to turn off the debugger if you previously enabled it. Example htmx.logNone(); Property - htmx.logger The logger htmx uses to log with Value func(elt, eventName, detail) - a function that takes an element, eventName and event detail and logs it Example htmx.logger = function(elt, event, data) { if(console) { console.log("INFO:", event, elt, data); } } Method - htmx.off() Removes an event listener from an element Parameters eventName - the event name to remove the listener from listener - the listener to remove or target - the element to remove the listener from eventName - the event name to remove the listener from listener - the listener to remove Example // remove this click listener from the body htmx.off("click", myEventListener); // remove this click listener from the given div htmx.off("#my-div", "click", myEventListener) Method - htmx.on() Adds an event listener to an element Parameters eventName - the event name to add the listener for listener - the listener to add options - an options object (or a useCapture boolean) to add to the event listener (optional) or target - the element to add the listener to eventName - the event name to add the listener for listener - the listener to add options - an options object (or a useCapture boolean) to add to the event listener (optional) Example // add a click listener to the body var myEventListener = htmx.on("click", function(evt){ console.log(evt); }); // add a click listener to the given div var myEventListener = htmx.on("#my-div", "click", function(evt){ console.log(evt); }); // add a click listener to the given div that should only be invoked once var myEventListener = htmx.on("#my-div", "click", function(evt){ console.log(evt); }, { once: true }); Method - htmx.onLoad() Adds a callback for the htmx:load event. This can be used to process new content, for example initializing the content with a javascript library Parameters callback(elt) - the callback to call on newly loaded content Example htmx.onLoad(function(elt){ MyLibrary.init(elt); }) Method - htmx.parseInterval() Parses an interval string consistent with the way htmx does. Useful for plugins that have timing-related attributes. Caution: Accepts an int followed by either s or ms. All other values use parseFloat Parameters str - timing string Example // returns 3000 var milliseconds = htmx.parseInterval("3s"); // returns 3 - Caution var milliseconds = htmx.parseInterval("3m"); Method - htmx.process() Processes new content, enabling htmx behavior. This can be useful if you have content that is added to the DOM outside of the normal htmx request cycle but still want htmx attributes to work. Parameters elt - element to process Example document.body.innerHTML = "<div hx-get='/example'>Get it!</div>" // process the newly added content htmx.process(document.body); Method - htmx.remove() Removes an element from the DOM Parameters elt - element to remove or elt - element to remove delay - delay (in milliseconds ) before element is removed Example // removes my-div from the DOM htmx.remove(htmx.find("#my-div")); // removes my-div from the DOM after a delay of 2 seconds htmx.remove(htmx.find("#my-div"), 2000); Method - htmx.removeClass() Removes a class from the given element Parameters elt - element to remove the class from class - the class to remove or elt - element to remove the class from class - the class to remove delay - delay (in milliseconds ) before class is removed Example // removes .myClass from my-div htmx.removeClass(htmx.find("#my-div"), "myClass"); // removes .myClass from my-div after 6 seconds htmx.removeClass(htmx.find("#my-div"), "myClass", 6000); Method - htmx.removeExtension() Removes the given extension from htmx Parameters name - the name of the extension to remove Example htmx.removeExtension("my-extension"); Method - htmx.swap() Performs swapping (and settling) of HTML content Parameters target - the HTML element or string selector of swap target content - string representation of content to be swapped swapSpec - swapping specification, representing parameters from hx-swap swapStyle (required) - swapping style (innerHTML, outerHTML, beforebegin etc) swapDelay, settleDelay (number) - delays before swapping and settling respectively transition (bool) - whether to use HTML transitions for swap ignoreTitle (bool) - disables page title updates head (string) - specifies head tag handling strategy (merge or append). Leave empty to disable head handling scroll, scrollTarget, show, showTarget, focusScroll - specifies scroll handling after swap swapOptions - additional optional parameters for swapping select - selector for the content to be swapped (equivalent of hx-select) selectOOB - selector for the content to be swapped out-of-band (equivalent of hx-select-oob) eventInfo - an object to be attached to htmx:afterSwap and htmx:afterSettle elements anchor - an anchor element that triggered scroll, will be scrolled into view on settle. Provides simple alternative to full scroll handling contextElement - DOM element that serves as context to swapping operation. Currently used to find extensions enabled for specific element afterSwapCallback, afterSettleCallback - callback functions called after swap and settle respectively. Take no arguments Example // swap #output element inner HTML with div element with "Swapped!" text htmx.swap("#output", "<div>Swapp'''
