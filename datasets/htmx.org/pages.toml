["https://htmx.org/attributes/hx-vars"]
title = "</> htmx ~ hx-vars Attribute"
description = "The hx-vars attribute in htmx allows you to dynamically add to the parameters that will be submitted with an AJAX request. This attribute has been deprecated. We recommend you use the hx-vals attribute that provides the same functionality with safer defaults."
full_description = 'hx-vars NOTE: hx-vars has been deprecated in favor of hx-vals, which is safer by default. The hx-vars attribute allows you to dynamically add to the parameters that will be submitted with an AJAX request. The value of this attribute is a comma separated list of name:<expression> values, the same as the internal syntax of javascript Object Literals. <div hx-get="/example" hx-vars="myVar:computeMyVar()">Get Some HTML, Including A Dynamic Value in the Request</div> Security Considerations The expressions in hx-vars are dynamically computed which allows you to add JavaScript code that will be executed. Be careful to never trust user input in your expressions as this may lead to a Cross-Site Scripting (XSS) vulnerability. If you are dealing with user input such as query strings or user-generated content, consider using hx-vals which is a safer alternative. Notes hx-vars is inherited and can be placed on a parent element. A child declaration of a variable overrides a parent declaration. Input values with the same name will be overridden by variable declarations. haiku javascript fatigue: longing for a hypertext already in hand docs reference examples talk essays @htmx_org'
