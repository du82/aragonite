["https://htmx.org/attributes/hx-patch"]
title = "</> htmx ~ hx-patch Attribute"
description = "The hx-patch attribute in htmx will cause an element to issue a PATCH request to the specified URL and swap the returned HTML into the DOM using a swap strategy."
full_description = 'hx-patch The hx-patch attribute will cause an element to issue a PATCH to the specified URL and swap the HTML into the DOM using a swap strategy: <button hx-patch="/account" hx-target="body"> Patch Your Account </button> This example will cause the button to issue a PATCH to /account and swap the returned HTML into the innerHTML of the body. Notes hx-patch is not inherited You can control the target of the swap using the hx-target attribute You can control the swap strategy by using the hx-swap attribute You can control what event triggers the request with the hx-trigger attribute You can control the data submitted with the request in various ways, documented here: Parameters haiku javascript fatigue: longing for a hypertext already in hand docs reference examples talk essays @htmx_org'
year_published = 2025
