full_description = '''.wuw { display:none; } .uwu { display:none; } body.lmao .dark-hero .main { display:none; } body.lmao .dark-hero .wuw { display:block; padding-top: 24px; } body.lmao .dark-hero .uwu { display:none; } body.kawaii .dark-hero .main { display:none; } body.kawaii .dark-hero .wuw { display:none; } body.kawaii .dark-hero .uwu { display:block; padding-top: 24px; } body.ads .ad { display: block; text-align: center; margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw); } body.ads .ad a:hover { opacity: 100%; } body .ad { display: none; } body.ads .ad img { max-width: 90vw; } if(window.location.search=="?wuw=true" || window.location.search=="?suw=true") { document.body.classList.add('lmao'); } if(window.location.search=="?uwu=true") { document.body.classList.add('kawaii'); } if(window.location.search=="?ads=true") { document.body.classList.add('ads'); } </> htmx high power tools for HTML NEWS: htmx 2.0 has been released! It is not currently marked as latest in NPM so that people using the 1.x line are not accidentally upgraded. We will mark 2.0 as latest at some point in 2025. introduction htmx gives you access to AJAX, CSS Transitions, WebSockets and Server Sent Events directly in HTML, using attributes, so you can build modern user interfaces with the simplicity and power of hypertext htmx is small (~14k min.gz’d), dependency-free, extendable & has reduced code base sizes by 67% when compared with react motivation Why should only <a> & <form> be able to make HTTP requests? Why should only click & submit events trigger them? Why should only GET & POST methods be available? Why should you only be able to replace the entire screen? By removing these constraints, htmx completes HTML as a hypertext quick start <script src="https://unpkg.com/htmx.org@2.0.4"></script> <!-- have a button POST a click via AJAX --> <button hx-post="/clicked" hx-swap="outerHTML"> Click Me </button> The hx-post and hx-swap attributes on this button tell htmx: “When a user clicks on this button, issue an AJAX request to /clicked, and replace the entire button with the HTML response” htmx is the successor to intercooler.js Read the docs introduction for a more in-depth… introduction. Note that htmx 2.x has dropped IE support. If you require IE support you can use the 1.x code-line, which will be supported in perpetuity. book We are happy to announce the release of Hypermedia Systems, a book on how to build Hypermedia-Driven Applications using htmx & more: sponsors htmx development can be supported via GitHub Sponsors Thank you to all our generous supporters, including: #sponsor-table td { text-align: center; padding: 16px; min-height: 100px; border-bottom: none; width:33%; } @media only screen and (max-width: 760px) { /* Force table to not be like tables anymore */ table, thead, tbody, th, td, tr { display: block; } #sponsor-table td { width:90%; } #sponsor-table td * { margin: auto; } } Platinum Sponsor Gold Sponsors Silver Sponsors ʕ •ᴥ•ʔ made in montana'''
