["https://htmx.org/attributes/hx-swap-oob"]
title = "</> htmx ~ hx-swap-oob Attribute"
description = "The hx-swap-oob attribute in htmx allows you to specify that some content in a response should be swapped into the DOM somewhere other than the target, that is 'out-of-band'. This allows you to piggyback updates to other elements on a response."
full_description = 'hx-swap-oob The hx-swap-oob attribute allows you to specify that some content in a response should be swapped into the DOM somewhere other than the target, that is “Out of Band”. This allows you to piggyback updates to other element updates on a response. Consider the following response HTML: <div> ... </div> <div id="alerts" hx-swap-oob="true"> Saved! </div> The first div will be swapped into the target the usual manner. The second div, however, will be swapped in as a replacement for the element with the id alerts, and will not end up in the target. The value of the hx-swap-oob can be: true any valid hx-swap value any valid hx-swap value, followed by a colon, followed by a CSS selector If the value is true or outerHTML (which are equivalent) the element will be swapped inline. If a swap value is given, that swap strategy will be used and the encapsulating tag pair will be stripped for all strategies other than outerHTML. If a selector is given, all elements matched by that selector will be swapped. If not, the element with an ID matching the new content will be swapped. Using alternate swap strategies As mentioned previously when using swap strategies other than true or outerHTML the encapsulating tags are stripped, as such you need to excapsulate the returned data with the correct tags for the context. When trying to insert a <tr> in a table that uses <tbody>: <tbody hx-swap-oob="beforeend:#table tbody"> <tr> ... </tr> </tbody> A “plain” table: <table hx-swap-oob="beforeend:#table2"> <tr> ... </tr> </table> A <li> may be encapsulated in <ul>, <ol>, <div> or <span>, for example: <ul hx-swap-oob="beforeend:#list1"> <li>...</li> </ul> A <p> can be encapsulated in <div> or <span>: <span hx-swap-oob="beforeend:#text"> <p>...</p> </span> Troublesome Tables and lists Note that you can use a template tag to encapsulate types of elements that, by the HTML spec, can’t stand on their own in the DOM (<tr>, <td>, <th>, <thead>, <tbody>, <tfoot>, <colgroup>, <caption>, <col> & <li>). Here is an example with an out-of-band swap of a table row being encapsulated in this way: <div> ... </div> <template> <tr id="row" hx-swap-oob="true"> ... </tr> </template> Note that these template tags will be removed from the final content of the page. Slippery SVGs Some element types, like SVG, use a specific XML namespace for their child elements. This prevents internal elements from working correctly when swapped in, unless they are encapsulated within a svg tag. To modify the internal contents of an existing SVG, you can use both template and svg tags to encapsulate the elements, allowing them to get the correct namespace applied. Here is an example with an out-of-band swap of svg elements being encapsulated in this way: <div> ... </div> <template><svg> <circle hx-swap-oob="true" id="circle1" r="35" cx="50" cy="50" fill="red" /> </svg></template> <template><svg hx-swap-oob="beforebegin:#circle1"> <circle id="circle2" r="45" cx="50" cy="50" fill="blue" /> </svg></template> This will replace circle1 inline and then insert circle2 before circle1. Note that these template and svg wrapping tags will be removed from the final content of the page. Nested OOB Swaps By default, any element with hx-swap-oob= attribute anywhere in the response is processed for oob swap behavior, including when an element is nested within the main response element. This can be problematic when using template fragments where a fragment may be reused as an oob-swap target and also as part of a bigger fragment. When the bigger fragment is the main response the inner fragment will still be processed as an oob swap, removing it from the dom. This behavior can be changed by setting the config htmx.config.allowNestedOobSwaps to false. If this config option is false, OOB swaps are only processed when the element is adjacent to the main response element, OOB swaps elsewhere will be ignored and oob-swap-related attributes stripped. Notes hx-swap-oob is not inherited'
year_published = 2025
