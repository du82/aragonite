["https://http2.github.io"]
title = "HTTP/2"
full_description = "This is the home page for HTTP/2, a major revision of the Web's protocol. It is maintained by the IETF HTTP Working Group. HTTP/2 is a replacement for how HTTP is expressed “on the wire.” It is not a ground-up rewrite of the protocol; HTTP methods, status codes and semantics are the same, and it should be possible to use the same APIs as HTTP/1.x (possibly with some small additions) to represent the protocol. The focus of the protocol is on performance; specifically, end-user perceived latency, network and server resource usage. One major goal is to allow the use of a single connection from browsers to a Web site. The basis of the work was SPDY, but HTTP/2 has evolved to take the community’s input into account, incorporating several improvements in the process. See our charter for more details of the scope of the work, as well as our Frequently Asked Questions."
