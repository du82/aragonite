title = "Apache Contributors - The Apache HTTP Server Project"
full_description = "This page exists to recognize the efforts and contributions of the core individuals in the Apache HTTP Server Project. Hundreds of people have made individual contributions to the Apache project. Patch contributors are listed in the src/CHANGES file. Frequent contributors have included Petr Lampa, Tom Tromey, James H. Cloos Jr., Ed Korthof, Nathan Neulinger, Jason S. Clary, Jason A. Dour, Michael Douglass, Brian Havard, Tony Sanders, Brian Tao, Michael Smith, Adam Sussman, Nathan Schrenk, Matthew Gray, and John Heidemann. Name: Erik Abele Email: erik@codefaktor.de URL: http://www.codefaktor.de/ Organization: Independent Occupation: Technology Consultant, Web Developer Location: Aalen, Germany Comments: Vogon Heavy Industries - coding with impact! OS Expertise: Linux, Mac OS X Contributions: Mostly documentation, various tweaks here and there Name: Aaron Bannert Email: aaron@apache.org URL: http://www.clove.org/~aaron/ Organization: Codemass, Inc. Occupation: Open Source Software Consultant Location: San Francisco, CA, USA Comments: Banish all tabs! OS Expertise: Linux and Solaris with a dash of Darwin Contributions: Flood. Various APIs for APR. Some work on the Worker MPM. Threads, mutexes, condition variables, oh my! Interested in various forms of IPC. Terrible m4/autoconf/libtool hacks. Name: Brian Behlendorf Email: brian@behlendorf.com URL: http://www.behlendorf.com Organization: Collab.Net Occupation: CTO Location: San Francisco, CA, USA Comments: Infrastructure, baby! OS Expertise: FreeBSD Contributions: Various, focusing on assisting the development process itself. Name: Ryan Bloom Email: rbb@apache.org Organization: Independent Occupation: Software Engineer Location: Oakland, CA OS Expertise: Linux, AIX, Windows Contributions: Apache Portable Run-Time. Initial work to make Apache a hybrid model. Name: Rich Bowen Email: rbowen@rcbowen.com URL: http://drbacchus.com/ Organization: Red Hat Occupation: Community Manager Location: Lexington, KY Comments: The documentation can always be made just a little better. Contributions: Documentation. IRC tech support."
