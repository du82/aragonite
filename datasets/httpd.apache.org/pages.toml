["https://httpd.apache.org/docs-project"]
title = "Documentation Project - The Apache HTTP Server Project"
full_description = '''The documentation of the Apache HTTP Server is a collaborative effort, made possible by the participation of the entire HTTP Server community. We'd love to have your help too. The best way to report a problem with the documentation is to make a comment on the docs page in question, or to open a ticket. Select 'Documentation' as the component. Have a look at the list of open documentation bugs to see if it's already covered. We try to keep that list very short. If you have a suggestion of something that we could do better, or even want to write a new or replacement document, there are a number of ways to go about it. The best way is probably to join the mailing list and strike up a conversation. We always love to have new people on the project. Or, you can open a ticket , as discussed above. We are very interested in your suggestions, and any way that you think we can improve the documentation. We look forward to hearing from you. The 2.2, 2.4 and trunk documentation also have a comment feature, where you can quickly add a comment about the documentation. To access this, click the "Comments" link on a page or simply scroll down to the bottom. Our documentation is kept in svn, along with the source code, and the actual changes are all made there. If you intend to be a long-term contributor to the documentation, the best thing to do is to get an svn checkout and submit patches. We've got a document that gives you all of the necessary details. Once you have a checkout from SVN, you need to also check out the docs-build directory and run the relevant build scripts to produce all of the relevant transformations. Please see docs build for more information. The discussion surrounding the documentation project happens on the docs@httpd.apache.org mailing list. To subscribe to this mailing list, send email to docs-subscribe@httpd.apache.org and follow the instructions in the response you receive. The archives of this mailing list may be found at lists.apache.org , if you want to have a preview of how we do things, and who the main characters are.'''
