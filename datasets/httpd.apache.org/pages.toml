["https://httpd.apache.org/lists.html"]
title = "Apache HTTP Server Mailing Lists - The Apache HTTP Server Project"
full_description = '''The following mailing lists relate to the Apache HTTP Server project. Users should consider subscribing to the Announcements or User Support mailing lists. Other lists are for people interested in helping with the development and debugging of the server. Formatted archives are available in several places including the Apache Mail Archives , MarkMail , and MARC. Raw mbox archives for most lists are available at http://httpd.apache.org/mail/. You can also use the mail-to-news gateway offered by GMANE to access most of the lists with a news reader. The announce@httpd.apache.org mailing list is used to announce major releases and other important information about the Apache HTTP Server project. Messages are posted only by the Foundation; there is no discussion. The lists and discussion groups listed here are the only place that configuration and how-to questions belong, ever. Every day, users become frustrated, not with Apache, but with how nobody will help them understand how to get started. 95% of the time, it's not for lack of helpers, but for lack of effort and well stated questions. Before you go further, please read Eric S. Raymond and Rick Moen's explanation of "How To Ask Questions The Smart Way". If you follow their advice, you will discover that these forums have dozens of helpers ready to provide you with guidance on using the Apache HTTP Server! Note: Do not send your Apache questions to Eric or Rick! In addition, there are a few usenet discussion groups in which discussions about the server can be found. These include: The dev@httpd.apache.org mailing list is used for discussions about the actual development of the server. All httpd candidates for release are announced to this list prior to acceptance. Subscribers to this list are encouraged to 'test-drive' these candidates just before they're generally released, and provide their feedback in a [vote] thread. Note these candidates are NOT yet released, and should not be carried on announcement channels, until the testing is complete and they have been voted as released on the dev@ list. Configuration and support questions should be addressed to a user support group. This list is only for discussion of changes to the source code and related issues. Other questions are likely to be ignored.'''
