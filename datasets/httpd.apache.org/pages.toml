["https://httpd.apache.org/userslist.html"]
title = "Users Mailing List - The Apache HTTP Server Project"
full_description = "This mailing list is a place for users of the Apache HTTP Server to discuss Apache and help each other to install and configure the software. Although some developers may participate in the list, the primary interaction is user-to-user. Posting is only permitted by subscribed addresses as an anti-spam measure. The list is moderated by volunteers from the Apache Software Foundation; moderation will mostly be notable by its absence. However, blatant abuse of the forum's purpose or the sensibilities of the subscribers will not be tolerated. Any action taken by the moderators is final, solely at their discretion, and not subject to formal appeal. To subscribe, send an empty message to users-subscribe@httpd.apache.org . You will receive a confirmation message with instructions on how to validate your subscription. After you have subscribed, you can post to the list by sending messages to users@httpd.apache.org . You cannot post to the list without subscribing. If you prefer to receive a digest version of the list that sends groups of messages in a single email, you can subscribe by sending an empty message to users-digest-subscribe@httpd.apache.org . To unsubscribe, send a messages to users-unsubscribe@httpd.apache.org (or, if you are subscribed to the digest version of the list, send to users-digest-unsubscribe@httpd.apache.org ). You must send the unsubscribe message from the same email address that you used to subscribe to the list. To complete the unsubscription process you must reply to a confirmation email. If you do not receive this confirmation email, please check your spam filters to see if they are capturing the message. If all else fails, you can contact the list administrator at users-owner@httpd.apache.org to get help. Archives are available at the Apache Mail Archives , MarkMail (great for searching), MARC , CanSeek.ca , or in raw mbox format. In addition, you can access this mailing list with the mail-to-news gateway offered by GMANE [ gmane.comp.apache.user ] or search the usenet newsgroups for a much larger archive of Apache-related postings."
author = "Documentation Group"
