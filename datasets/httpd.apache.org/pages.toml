["https://httpd.apache.org/dev/devnotes.html"]
title = "Apache Development Notes - The Apache HTTP Server Project"
full_description = "This page is intended to provide some basic background about development nits and the maintenance of the developer site. Committers should check out via https instead of http (so that they can commit their changes). For more info about Subversion, please read the ASF version control FAQ. The developers continue to seek to maintain module compatibility between 2.4.1 and future 2.4 releases for administrators and end users. Almost all files relating to Apache, both the actual sources and the files that aren't part of the distribution, are now maintained in an SVN repository. Here is the way in which changes are applied: Developer checks out a copy of the files on which they want to work (in this case, the trunk), into a private working directory called httpd-trunk: This step only needs to be performed once (unless the private working directory is tainted or deleted). Committers should use a URL prefix of https on the checkout, to save themselves headaches later. Developer makes changes to their working copies, makes sure they work, and generates a patch so others can apply the changes to test them: The /tmp/foo file is mailed to the developers list so they can consider the value/validity of the patch. It is worth making sure your code follows the Apache style, as described in the style guide. Once other developers have agreed that the change is a Good Thing, the developer checks the changes into the repository: There are several different branches under the httpd subtree in the Apache SVN repository that pertain to the different releases. The top level can be perused with the SVN ViewCVS pages. The main subtrees pertaining to the httpd server source are: To create a directory tree containing the 2.4 sources, and call it httpd-2.4, change your current directory to the parent of the tree and then check the 2.4 sources out as follows: If you want to check out the bleeding edge of development, the httpd-2.5 development tree (slated for a release 2.6), and call it httpd-trunk, checkout as follows:"
