title = "Download - The Apache HTTP Server Project"
full_description = 'Use the links below to download the Apache HTTP Server from our download servers. You must verify the integrity of the downloaded files using signatures downloaded from our main distribution directory. The signatures can be verified with our KEYS file. Only current recommended releases are available on the main distribution site. Historical releases, including the 1.3, 2.0 and 2.2 families of releases, are available from the archive download site. The Apache HTTP Server Project is pleased to announce the release of version 2.4.63 of the Apache HTTP Server ("Apache" and "httpd"). This version of Apache is our latest GA release of the new generation 2.4.x branch of Apache HTTPD and represents fifteen years of innovation by the project, and is recommended over all previous releases! The Apache Software Foundation and the Apache HTTP Server Project are pleased to announce the release of version 2.3.9 of mod_fcgid, a FastCGI implementation for Apache HTTP Server versions 2.2 and 2.4. This version of mod_fcgid is a security release. Win32, Netware or OS/2 Source with CR/LF line endings: mod_fcgid-2.3.9-crlf.zip [ PGP ] [ MD5 ] [ SHA1 ] The Apache HTTP Server Project is pleased to announce the release of Apache FTP module for Apache HTTP Server, version 0.9.6 as beta. Users are encouraged to test and provide feedback on this beta release. For information about this module subproject, see the mod_ftp module project page. Win32, Netware or OS/2 Source with CR/LF line endings: mod_ftp-0.9.6-beta-crlf.zip [ PGP ] [ SHA1 ] [ MD5 ] It is essential that you verify the integrity of the downloaded files using the PGP or SHA signatures. Please read Verifying Apache HTTP Server Releases for more information on why you should verify our releases and how to do it. Copyright © 1997-2025 The Apache Software Foundation. Apache HTTP Server, Apache, and the Apache feather logo are trademarks of The Apache Software Foundation.'
