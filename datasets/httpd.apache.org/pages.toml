["https://httpd.apache.org/apreq/download.cgi"]
title = "libapreq download - The Apache HTTP Server Project"
full_description = "Use the links below to download libapreq from one of our mirrors. You must verify the integrity of the downloaded files using signatures downloaded from our main distribution directory. If you do not see the file you need in the links below, please see the master distribution directory or, preferably, its mirror. You are currently using https://dlcdn.apache.org/. If you encounter a problem with this mirror, please select another mirror. If all mirrors are failing, there are backup mirrors (at the end of the mirrors list) that should be available. This release works with Apache HTTP Server 2.4. Please note that this version will not work with older 1.3.X releases of the Apache HTTP Server, and is not tested against (unsupported) 2.0 or 2.2 releases. This release works with Apache HTTP Server 1.3. Please note that this version will not work with newer 2.X releases of the Apache HTTP Server. Please use libapreq2-2.17 for use with Apache HTTP Server 2.4. It is essential that you verify the integrity of the downloaded files using the PGP or MD5 signatures. The PGP signatures can be verified using PGP or GPG. First download the KEYS as well as the asc signature file for the particular distribution. Make sure you get these files from the main distribution directory , rather than from a mirror. Then verify the signatures using: % pgpk -a KEYS% pgpv libapreq2-2.17.tar.gz.asc or % pgp -ka KEYS% pgp libapreq2-2.17.tar.gz.asc or % gpg --import KEYS% gpg --verify libapreq-2.17.tar.gz.asc Alternatively, you can verify the MD5 signature on the files. A unix program called md5 or md5sum is included in many unix distributions. It is also available as part of GNU Textutils. Windows users can get binary md5 programs from here , here , or here. Copyright © 1997-2025 The Apache Software Foundation. Apache HTTP Server, Apache, and the Apache feather logo are trademarks of The Apache Software Foundation."
