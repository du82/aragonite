["https://httpd.apache.org/modules"]
title = "Apache httpd Modules - The Apache HTTP Server Project"
full_description = "The following page highlights some modules that the Apache HTTP Server Project maintains that are not included in the core distribution. The listing of all modules included in the core distribution can be found in the online documentation. Finally, we do not maintain any detailed listing of third-party modules. You should use your favorite search engine, or have a look at code source repositories such as GitHub. Does your CGI performance leave you wanting? Is mod_perl simply too much effort for just hosting your CGI scripts? Do you want to run PHP applications outside of your web server processes? FastCGI is the solution for you! mod_fcgid is an implementation of FastCGI for Apache HTTP Server 2.0 and later which routes requests to FastCGI application processes which it manages. When is Apache HTTP Server not an http: server? When it's serving the same web content, via an ftp: protocol request! This code is currently released as a beta. Volunteers are especially sought to test out the IPv6 functionality (EPRT and EPSV support). Sick of keeping your DNS records and Apache config IPs and CNAMEs in sync? Let Apache serve your DNS for you based on your httpd.conf! Try out mod_domain. This experimental code has not been released, but is available to you from the subversion development repository. This experimental code has not been released, but is available to you from the subversion development repository. It is currently in-use by the ASF to provide our email archives browser. This experimental code has not been released, but is available to you from the subversion development repository. This experimental code has not been released, but is available to you from the subversion development repository. This experimental code has not been released, but is available to you from the subversion development repository. The sandbox is where unreleased code goes to play. Browse around for some goodies that are not part of the normal Apache HTTP Server distribution, but may give you an idea about ways you can extend the server. Someone may be actively working on these bits, but they may be completely unmaintained!"
