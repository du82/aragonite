["https://httpd.apache.org/mod_ftp"]
title = "mod_ftp - FTP Protocol module for Apache 2 - The Apache HTTP Server Project"
full_description = "mod_ftp is a FTP Protocol module to serve httpd content over the FTP protocol (whereever the HTTP protocol could also be used). It provides both RETR/REST retrieval and STOR/APPE upload, using the same user/permissions model as httpd (so it shares the same security considerations as mod_dav plus mod_dav_fs). Development of mod_ftp can be followed through the Subversion repositories. For public access you can use : See the README-FTP file distributed with the module's source code for additional build and installation notes. mod_ftp was created by Covalent in 2001, granted to the ASF and entered incubation in 2005, and was graduated as a subproject of the HTTP Server Project in 2007. Copyright © 1997-2025 The Apache Software Foundation. Apache HTTP Server, Apache, and the Apache feather logo are trademarks of The Apache Software Foundation."
