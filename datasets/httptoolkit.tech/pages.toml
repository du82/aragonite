fect, export rules to share with your team or store as your own private library.Transform, redirect & inject errorsRedirect production sites to local test servers, or block requests with connection resets, timeouts & failing status codes. Want a real response from a target server, but different? Dynamically transform requests or response to inject headers (goodbye CORS errors), match/replace body content, patch JSON bodies, and more.{"@context":"https://schema.org","@type":["SoftwareApplication","WebApplication","MobileApplication"],"image":"https://httptoolkit.com/logo-square.png","screenshot":"https://httptoolkit.com/screenshot.png","dateModified":"2025-01-13T15:32:10.000Z","video":{"@type":"VideoObject","name":"HTTP Toolkit","description":"A short demo of HTTP Toolkit in action","contentUrl":"https://httptoolkit.com/http-mock-demo.mp4","thumbnailUrl":"https://httptoolkit.com/http-mock-demo-thumbnail.png","uploadDate":"2019-09-25T00:00:00Z"},"name":"HTTP Toolkit","description":"Beautiful & open-source tools to debug, test and develop with HTTP(S)","softwareVersion":"1.19.4","operatingSystem":["Windows","Mac","Linux","Android"],"aggregateRating":{"@type":"AggregateRating","ratingValue":"5","reviewCount":56},"url":"https://httptoolkit.com/","downloadUrl":["https://httptoolkit.com/download/win-exe/","https://httptoolkit.com/download/win-standalone/","https://httptoolkit.com/download/win-winget/","https://httptoolkit.com/download/linux-deb/","https://httptoolkit.com/download/linux-standalone/","https://httptoolkit.com/download/linux-aur/","https://httptoolkit.com/download/osx-dmg/","https://httptoolkit.com/download/osx-homebrew/"],"applicationCategory":"DeveloperApplication","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}'''
