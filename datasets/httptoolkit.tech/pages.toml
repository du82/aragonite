full_description = '''Looking for a Charles Proxy alternative?HTTP Toolkit is a modern powerful alternative to Charles designed from the ground up for instant targeted debugging and control of any HTTP(S) traffic (with no Java necessary)On mobile? Send a link to your computer to download HTTP Toolkit there:An extra form field you should ignoreSend me a download linkNo spam, no newsletters - just a quick & easy download linkDownload for macOSMacOS DMGMacOS via HomebrewLinux DEB PackageLinux RPM PackageLinux Arch PackageLinux AppImageLinux ZipWindows InstallerWindows via WingetWindows ZipVideo not availableVideo not availableVideo not availableVideo not availableOne-click setup integrations for every tool you useHTTP Toolkit includes one-click automated setup to provide precisely targeted interception of individual mobile apps, browsers, terminal windows, Docker containers & more.See all integrationsHTTP Toolkit has all the core Charles proxy features you use, plus:One-click zero-configuration HTTPS interceptionInspect & rewrite any HTTPS in seconds, with no global CA certificate required, for mobile apps, browsers, Docker containers, and more. Built-in documentationDocumentation for every standard HTTP header and status code, plus specific endpoint docs & validation for 2600+ popular APIs, from Stripe to GitHub to AWS. Powerful rules engine for rewriting & mocking HTTP trafficDefine custom rules that precisely match requests to automatically edit their contents, redirect them, simulate network errors, or breakpoint them for manual modification. Precisely targeted interceptionCapture traffic from an individual browser window, terminal session, or mobile app, without interfering with (or having to filter though) traffic from the rest of your machine. Automated mobile device setupMultiple integration tools for both Android and iOS, allowing isolated interception of individual apps with system-level certificates and automatic SSL unpinning as standard. Export intercepted traffic as ready-to-use codeOne-click export of any collected requests as ready-to-use code for 20+ programming languages & tools. CaptureIntercept HTTP with zero setupCapture HTTP(S) with zero hassle, with one-click interception for a huge range of tools and platforms.Precisely target interception, to capture traffic from a single client without the noise & disruption of intercepting your entire computer.Intercept individual Android or iOS apps, entire devices, Docker containers, browser windows, backend processes like Node.js, Java, Python or Ruby, terminal sessions...Alternatively, just connect any client manually to HTTP Toolkit as an HTTP proxy, fully compatible with HTTP requests from anywhere.inspectExplore, search & examine HTTPHunt through traffic quickly & effectively, with content-type and source categorization, plus powerful filtering tools to precisely match the messages that matter.Examine the URL, status, headers & body of each message, with built-in parsing of parameters, and explanations & docs from MDN for all standard headers.Dig into message bodies with highlighting & autoformatting for JSON, Protobuf, Base64, HTML, XML, JS, hex and more, all built on top of Monaco - the editing tools from Visual Studio Code.breakpointPause & edit live HTTP trafficUse breakpoints to pause in-flight HTTP traffic for manual editing.Configure fine-grained matching logic to jump to exactly the cases you care about.Redirect requests to another URL, update the method, headers or status, or edit the body.Or get more involved and respond to requests without forwarding them, or even just hard-close connections directly.SendSend your own custom requestsSend your own requests directly, to explore APIs or test out different request parameters.Use the fully featured HTTP client to define every aspect of your request, with automatic handling of details like body compression and message framing.Explore sent requests & their responses with all the tools & power HTTP Toolkit offers for debugging intercepted traffic.ModifyPro FeatureTest with fully automated rewrite rulesInject mock responses for prototyping and testingPrecisely match interesting requests, then define your own static response or map local files, to test clients against any endpoint behaviour you can imagine. Use it to override real responses, or even to simulate responses from endpoints or entire servers that don't exist yet.Build, curate & share rulesetsCreate rules in one click from intercepted traffic, tune to perfection, then use rule groups & custom aliases to quickly organize rules and toggle behaviours. Once they're perfect, export rules to share with your team or store as your own private library.Transform, redirect & inject errorsRedirect production sites to local test servers, or block requests with connection resets, timeouts & failing status codes. Want a real response from a target server, but different? Dynamically transform requests or response to inject headers (goodbye CORS errors), match/replace body content, patch JSON bodies, and more.TESTIMONIALSJoin 710,236 developersWhy HTTP Toolkit?Numbers that speak for themselves:+years of development+users around the worldopen-source contributors+GitHub stars across httptoolkit's repos{"@context":"https://schema.org","@type":["SoftwareApplication","WebApplication","MobileApplication"],"image":"https://httptoolkit.com/logo-square.png","screenshot":"https://httptoolkit.com/screenshot.png","dateModified":"2025-01-13T15:32:10.000Z","video":{"@type":"VideoObject","name":"HTTP Toolkit","description":"A short demo of HTTP Toolkit in action","contentUrl":"https://httptoolkit.com/http-mock-demo.mp4","thumbnailUrl":"https://httptoolkit.com/http-mock-demo-thumbnail.png","uploadDate":"2019-09-25T00:00:00Z"},"name":"HTTP Toolkit","description":"Beautiful & open-source tools to debug, test and develop with HTTP(S)","softwareVersion":"1.19.4","operatingSystem":["Windows","Mac","Linux","Android"],"aggregateRating":{"@type":"Aggre