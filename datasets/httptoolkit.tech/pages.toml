e every aspect of your request, with automatic handling of details like body compression and message framing.Explore sent requests & their responses with all the tools & power HTTP Toolkit offers for debugging intercepted traffic.ModifyPro FeatureTest with fully automated rewrite rulesInject mock responses for prototyping and testingPrecisely match interesting requests, then define your own static response or map local files, to test clients against any endpoint behaviour you can imagine. Use it to override real responses, or even to simulate responses from endpoints or entire servers that don't exist yet.Build, curate & share rulesetsCreate rules in one click from intercepted traffic, tune to perfection, then use rule groups & custom aliases to quickly organize rules and toggle behaviours. Once they're perfect, export rules to share with your team or store as your own private library.Transform, redirect & inject errorsRedirect production sites to local test servers, or block requests with connection resets, timeouts & failing status codes. Want a real response from a target server, but different? Dynamically transform requests or response to inject headers (goodbye CORS errors), match/replace body content, patch JSON bodies, and more.TESTIMONIALSJoin 710,236 developersWhy HTTP Toolkit?Numbers that speak for themselves:+years of development+users around the worldopen-source contributors+GitHub stars across httptoolkit's repos{"@context":"https://schema.org","@type":["SoftwareApplication","WebApplication","MobileApplication"],"image":"https://httptoolkit.com/logo-square.png","screenshot":"https://httptoolkit.com/screenshot.png","dateModified":"2025-01-13T15:32:10.000Z","video":{"@type":"VideoObject","name":"HTTP Toolkit","description":"A short demo of HTTP Toolkit in action","contentUrl":"https://httptoolkit.com/http-mock-demo.mp4","thumbnailUrl":"https://httptoolkit.com/http-mock-demo-thumbnail.png","uploadDate":"2019-09-25T00:00:00Z"},"name":"HTTP Toolkit","description":"Beautiful & open-source tools to debug, test and develop with HTTP(S)","softwareVersion":"1.19.4","operatingSystem":["Windows","Mac","Linux","Android"],"aggregateRating":{"@type":"AggregateRating","ratingValue":"5","reviewCount":56},"url":"https://httptoolkit.com/","downloadUrl":["https://httptoolkit.com/download/win-exe/","https://httptoolkit.com/download/win-standalone/","https://httptoolkit.com/download/win-winget/","https://httptoolkit.com/download/linux-deb/","https://httptoolkit.com/download/linux-standalone/","https://httptoolkit.com/download/linux-aur/","https://httptoolkit.com/download/osx-dmg/","https://httptoolkit.com/download/osx-homebrew/"],"applicationCategory":"DeveloperApplication","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}'''
