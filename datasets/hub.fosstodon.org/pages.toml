["https://hub.fosstodon.org/2021-donation-round"]
title = "2021 Donation Results"
description = "Here are the results of the latest round of Fosstodon donations."
full_description = "2021 Donation Results Written by: Kev Quirk | 30 Nov 2021 Here are the results of the latest round of Fosstodon donations. We recently started another round of donations for this year where we had enough spare funds to donate $300 to two open source projects. First came the nominations round where a tonne a really great open source projects were nominated. We love seeing this level of involvement from the Fosstodon community - keep it up, folks! Once we had the shortlist nailed down, we de-duped it and gave it to our Patrons to cast the final vote in order to decide which 2 projects receive the donations. The results The spread of the results was surprising this time around - usually we have one or two clear winners. This time, although we had 2 winners, it was very close: So with 4 and 3 votes respectively, the winners of this round of donations were: postmarketOS European Digital Rights Thank you Finally, we would like to say thanks to all of you - not just those who donate, but to everyone who makes Fosstodon what it is. We’re are a bustling community of tech and open source enthusiasts and we continue to go from strength to strength. If you want to be help support Fosstodon financially, there are a number of ways to do so: Become a Patron Donate on LiberaPay Donate on PayPal"
