["https://hub.fosstodon.org/why-is-fosstodon-down"]
title = "Why is Fosstodon currently down?"
description = "We had to do some maintenance which brought the instance down for a while. Sorry about that."
full_description = "Why is Fosstodon currently down? Written by: Kev Quirk | 07 Nov 2022 We had to do some maintenance which brought the instance down for a while. Sorry about that. Fosstodon is now back up. If you’re still seeing this page, please CLEAR YOUR CACHE. Hey folks, Kev here from the Fosstodon team. This is just a quick message to explain to you guys why Fosstodon is down, of all times, during this MAHOOSIVE wave of traffic from Twitter. Well, we’re down because we’re migrating our database to a new server for a couple of reasons: It will give us more room to grow and upgrade the service, keeping the high performance we’re known for. It will also help Hugo from Masto.host with some much needed relief for other instances on his service. Basically, we’re doing it for the greater good. Note: We will remain on Masto.host - this is a migration within their service. We estimate that the server will be down for around 2 hours, so we should be back online by early-afternoon Eastern. If you have any questions, comments or concerns, please feel free to email us. Thanks to everyone for the ongoing support. We’re really sorry if this outage impacts you negatively, but it really is for the best."
year_published = 2025
