["https://hub.fosstodon.org/about"]
title = "About | Fosstodon Hub"
description = "Some info on how things work around here."
full_description = "About Us The whole point of Fosstodon is to be a community of like-minded people who enjoy Free & Open Source Software (FOSS). Running a social network can be expensive, so we accept donations in various forms. Originally founded by Kev Quirk and Mike Stone as a means to have their own presence in the Fediverse, it quickly grew. Originially funded out of pocket, Fosstodon grew beyond what Kev and Mike could afford to pay for by themselves. The community has generously donated to allow for Fosstodon to grow. From the very start, we committed to donating any extra money we have available to other open source projects. We want to make sure we are as transparent as possible when it comes to the support we receive from our members."
