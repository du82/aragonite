to help us prepare for anticipated growth. 📅 29 Jun 2021 We're Growing, But We Need Your Help! Fosstodon is going from strength to strength, but in order to keep that up, we need your help. 📅 24 Jun 2021 New member sign up We've made an adjustment to the way new members sign up and it's already been a huge help. 📅 21 Apr 2021 Once Again You've Done It Details of our 4th round of donations to open source projects. 📅 19 Nov 2020 Time To Support Some FOSS Projects Here we go again...another round of FOSS project donations! :-) 📅 11 Oct 2020 Community Spotlight Have a project that you think needs some exposure? We might be able to help. 📅 11 Sep 2020 Thank You For Your Reports Reporting troublesome toots really helps us, so thank you. 📅 31 Aug 2020 Donation Results - Round 3 Here's the results of our third round of donations to open source projects. 📅 11 Jul 2020 Another round of donations Yet again, we're donating some spare funds to open source projects. 📅 15 Jun 2020 We Have A New Community Manager We have managed to fill the position for our new community manager. 📅 01 Jun 2020 Adding A New Sticker To Our Shop More sticky swag for you to enjoy! 📅 18 Apr 2020 We Need A Community Manager We're growing the team and Fosstodon needs a Community Manager. You interested? 📅 13 Apr 2020 Moving Away From Cloudflare A lot of people in open source don't like Cloudflare, so we stopped using it. 📅 01 Apr 2020 We're Not Just FOSS People come to Fosstodon for so much more than just FOSS. 📅 16 Feb 2020 Stickers are back! If you want some cool sticky Fosstodon swag, we got you covered. 📅 21 Jan 2020 We Asked, You Answered Thank you all so, so much! 📅 30 Dec 2019 We Need Your Support Please We want to make sure Fosstodon stays around for the foreseeable future, but we need your help. 📅 17 Dec 2019 Moderation Update An update on how we're moderating things in our little corner of the fediverse. 📅 02 Aug 2019 Fosstodon, Kev & 'Snowflakes' There's been some drama around Kev's use of the word 'snowflakes'. Here's his response... 📅 08 Jul 2019 Donations - Round 2 This is our second round of open source donations - it's very exciting! 📅 17 Jun 2019 Longevity and Fosstodon We're not planning on going anywhere, but if we do, we have a plan. 📅 07 Jun 2019 We Just Made Our First Donation! Making donations to open source projects is a nice feeling. Hopefully this is our first of many! 📅 04 Mar 2019 Five Things To Do After You Join Fosstodon Useful tips to get you started with Fosstodon and our amazing community. 📅 05 Oct 2018 New Patron's Keybase Team If you're a Patron, you now get exclusive access to a private Keybase team. 📅 03 Oct 2018 Why Fosstodon Is English Only An explaination as to why Fosstodon is an English only instance. 📅 23 Aug 2018 Welcome Our first post on the new Hub, hello world! 📅 22 Aug 2018 Mastodon Mastodon Mastodon"
