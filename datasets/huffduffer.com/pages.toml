["https://huffduffer.com/about"]
title = "About on Huffduffer"
description = "Create your own podcast: find links to audio files on the Web; huffduff the links (add them to your podcast); subscribe to podcasts of other found sounds."
full_description = "About Have you ever wanted to put together a podcast of audio files that you’ve discovered on the web? It isn’t as easy as it should be. A podcast is an RSS file and making an RSS feed by hand is a pain. Huffduffer takes the pain out of podcasting found sounds. Huffduff it The word Huffduffer derives from a technology called Huff-Duff that was used to triangulate the position of radio transmissions. Huffduffing on the web is a way of pin-pointing interesting MP3 files. Here’s how it works: You find an MP3 that you’d like to share with the world. Use the handy Huffduff it bookmarklet or huffduff it directly on the site. That file is now added to your podcast. Let me show you an example: here’s my profile on Huffduffer and here’s my podcast that you can subscribe to. Tag it When you are huffduffing an audio file, you can “tag” it with key words or phrases. Separate tags with spaces or commas; whichever you prefer. Tagging files like this makes it easier to find related files that other people have huffduffed. A separate podcast is created for every tag you use. For example: here’s everything I’ve tagged with “science fiction” and here’s the podcast of everything I’ve tagged with “science fiction”. Discover it Tags are also a useful way of finding interesting stuff that other people have huffduffed. For example: here’s everything tagged with “design” and here’s the podcast of everything tagged with “design”. If you want to drink from the firehose: here’s the newest huffduffed stuff and here’s the podcast of the newest huffduffed stuff. Pretty much every page on huffduffer.com has a corresponding podcast so you can subscribe to whichever ones interest you. Any questions? If you have any questions, comments, or suggestions, please feel free to share them on with me. Huffduffer was built by Jeremy Keith—that’s me! You can read more about the development process on my blog and you can see how I’m using Huffduffer by visiting my profile."
year_published = 2025
clearnet = "https://huffduffer.com/about"
