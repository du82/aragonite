full_description = "The Hustle » Episode 115 - Dave Gregory of XTC/Big Big Train Huffduffed by 43north on August 27th, 2023 Episode 115 - Dave Gregory of XTC/Big Big Train July 18, 2017 XTC were one of the most beloved bands of the burgeoning alternative rock era. Armed with catchy and witty songs that leaned to the quirkier side of pop music, they produced a steady stream of excellent records from the late 70s until their demise in the 90s. Guitarist Dave Gregory shares with us some refreshingly honest stories about the challenges of being in the band such as not being able to tour and clashes with famous producers, but also the highs of recording such great music. Today, Dave's main gig is as a member of progressive rock band Big Big Train who released a new album, Grimspound, this year. Such a lovely guy and conversation! http://www.bigbigtrain.com/ 00:0000:00 Share | Download(Loading) http://thehustle.podbean.com/e/episode-115-dave-gregory-of-xtcbig-big-train/ download Also huffduffed as… The Hustle » Episode 115 - Dave Gregory of XTC/Big Big Train —Huffduffed by paulroub on July 18th, 2017 Share Link:"
