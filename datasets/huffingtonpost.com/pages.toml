title = "Indigenous Voices"
description = "Activist Allie Redhorse Young has been bringing celebrities, popular events and voter registration to Navajo Nation. Now she's tapped into field organizers, too."
full_description = '''Emma McNail for HuffPost/ GettyTrump’s Education Secretary Pick Blames D.C. ‘Bureaucrats’ For Indian Boarding Schools'I Am Finally Free!': Leonard Peltier Released From Prison After Nearly 50 YearsDeb Haaland Launches Bid For New Mexico GovernorThis Filmmaker Is Finally Giving Us The Full Range Of Indigenous Identity We Deserve On-ScreenJoe Biden Frees Leonard PeltierDeb Haaland Reflects On Her Legacy — And Whether It Can Survive 4 Years Of TrumpThe Army Won't Follow A Law That Would Return Stolen Human Remains‘Stand With Us Again’: 120 Tribal Leaders Urge Biden To Release Leonard PeltierThis Indigenous Singer Knows Exactly Where She BelongsElon Musk Posts Racist Images In Response To Elizabeth Warren's Call For Ethics StandardsDozens Of Democrats Plead With Biden To Free Leonard Peltier Before Leaving OfficeThis New Film Confronts A Haunting History That We Rarely Talk AboutHow Indigenous People Are Changing The Narrative of Colonized Land‘Show Mercy’: Sen. Brian Schatz Urges Joe Biden To Free Leonard Peltier In Final DaysThis Artist Is Weaving Her Indigenous Ancestry Into Meaningful Wearable Artwork HPGam.cmd.push(function(){ return HPGam.render("inline-infinite", "leaderboard_flex_middle", false, false); }); In Rural Arizona, A Bid — And A Block — To Get Indigenous Voters To The PollsActivist Allie Redhorse Young has been bringing celebrities, popular events and voter registration to Navajo Nation. Now she's tapped into field organizers, too.By Jennifer BenderyIn Honor of Indigenous Peoples Day, Here Are 7 Must-Reads By Native AuthorsWhether you’re in the community or looking to become better informed about our cultures, I highly recommend checking out these impactful and nuanced books.By Chyana Marie SageI Never Thought I’d Make It To The Runway — Until I Got The Chance To Model As My Most Authentic SelfI did a little modeling when I was younger — but I never made it onto the runway because I simply did not fit the mold. But one ask changed everything.By Kate NelsonThere's A Very Real Benefit To Seeing A Dermatologist With Your Skin ToneBlack dermatologists reveal the unique challenges that not all experts are equipped to handle.By Julie KendrickThe Meaning Behind 'Rez Dogs' Star D'Pharaoh Woon-A-Tai's Red Face Paint At The EmmysThe Canadian actor made a silent statement about an epidemic of violence happening to Indigenous women across North America.By Kelby VeraAmnesty International Urges Biden To Release Leonard Peltier Before Leaving Office"You have the opportunity to rectify a case that has long troubled human rights advocates and Indigenous Peoples worldwide," the group told the president.By Jennifer BenderyNo Apology Can Fix GOP Candidate’s ‘Old Racist Stereotypes’: Crow Tribal Leader“There’s really no excuse or room for that,” Levi Black Eagle said of Montana Senate hopeful Tim Sheehy painting his tribe as rowdy alcoholics.By Chris D'AngeloA GOP Candidate Was Caught On Tape Making Racist RemarksThe recordings are the latest in Tim Sheehy’s scandal-plagued campaign.By Chris D'AngeloThe ‘Barbie’ Success Was Only A Blip When It Comes To Women In HollywoodIn 2023, of the top 100 highest-earning movies at the box office, just 14 featured women of color as leads or co-leads, down from 18 in 2022.By Marina FangDeb Haaland ‘Wholeheartedly’ Endorses Kamala Harris For President“Kamala has been a staunch advocate for Tribal people, for women, and for marginalized communities,” the interior secretary told HuffPost in an exclusive statement.By Jennifer BenderyRare Video Shows Isolated Indigenous Tribe Emerging From Amazon Amid Nearby LoggingMembers of the Mashco Piro tribe were filmed along a Peruvian river, near where companies have been demolishing land with government support.By Nina GolgowskiIndigenous Actors Snag More Primetime Emmy Nods Than Ever BeforeOn Wednesday, Lily Gladstone and Kali Reis became the first Native American women to score Primetime Emmy acting nominations.By Kelby Vera'Avengers' Stars Lend Voices To Lakota Language Dub Of Classic Marvel FilmMark Ruffalo enlisted Robert Downey Jr., Scarlett Johansson and Chris Evans to rerecord their dialogue in Lakota, which is in threat of becoming an extinct language.By Kelby VeraLeonard Peltier Denied Parole After Nearly 50 Years In PrisonPresident Joe Biden is likely the last hope for the ailing, 79-year-old Native American rights activist to ever go home.By Jennifer BenderyU.S. Catholic Church Formally Apologizes For Role In Indian Boarding SchoolsKey senators praised the move by the U.S. Conference of Catholic Bishops, but said it's just a first step to addressing the trauma inflicted on Native children.By Jennifer BenderyThis Indigenous Community Created A New Blueprint To Fight Climate ChangeThe Métis have always played a pivotal role in land protection and conservation. They're not about to slow down now.By Chyana Marie SageLeonard Peltier Is Getting What May Be His Last Chance At FreedomThe Native American rights activist, whom the U.S. government put in prison nearly 50 years ago after a trial rife with misconduct, is getting a parole hearing.By Jennifer BenderyAustralia’s Richest Woman Demands Museum Remove 'Offensive' Portrait Of Her“I paint the world as I see it,” the artist said of his portrayal of Gina Rinehart, a mining heiress and billionaire who's painted with a double chin and droopy features.By Nina GolgowskiSorry, But Land Acknowledgments Are Not EnoughTalk is cheap unless it's backed up by action. Here's what that action looks like.By Chyana Marie SageA Conservative Republican's Rise Is The Latest Sign Of Indigenous Political PowerRep. Tom Cole of Oklahoma will lead House Republican spending discussions for the rest of the 118th Congress.By Jonathan Nicholson HPGam.cmd.push(function(){ return HPGam.render("inline-infinite", "leaderboard_flex_middle", false, false); }); 7 Life Lessons From My 'G Ma' — Who Was Also The First Indigenous Woman Senator Of CanadaI hope these reach all of the women out there looking for motivation — and a little laugh when the struggle gets too heavy.By Chyana Marie SageA U.S. Senator Is Shaming Universities Into Returning Native American Human Remains"The worst kind of colonialism," Sen. Brian Schatz (D-Hawaii) said of schools and museums holding on to thousands of stolen bones. But it's complicated.By Jennifer BenderyThis Tribe Is Reclaiming Its Land — And It Starts With 1 AnimalA legacy of land theft thwarts most tribes' efforts to restore wild buffalo. Wind River Indian Reservation has crafted a unique solution.By Roque PlanasIndigenous Author Tommy Orange Digs Into Our Past — So We Can Embrace Who We Are TodayIn his new novel, Orange's characters reveal how intergenerational trauma can manifest.By Chyana Marie Sage HPGam.cmd.push(function(){ return HPGam.render("tb", "desktop_bottom_right_sticky", true, false); }); Close HPGam.cmd.push(function(){ return HPGam.render("bottom-1", "leaderboard_footer", false, false); }); NEWSPOLITICSENTERTAINMENTLIFEVOICESHUFFPOST PERSONALSHOPPINGNEWSLETTERSAbout UsAdvertiseContact UsRSSFAQCareersUser AgreementComment PolicyDMCA PolicyHuffPost Press RoomAccessibility StatementPrivacy PolicyConsent PreferencesPrivacy SettingsPart of HuffPost News. ©2025 BuzzFeed, Inc. All rights reserved.The Huffington Post{"locale":"en-US","messages":{"ABOUT":"About","ADVERTISEMENT":"Advertisement","AND":"and","BEFORE_YOU_GO":"Before You Go","BLOCKQUOTE":"“{quote}”","BROUGHT_TO_YOU_BY_HUFFPOST_SHOPPING":"Brought To You By Huffpost Shopping","BY":"By","CANCEL":"Cancel","CLICK_TO_SUGGEST_A_CORRECTION":"Click to suggest a correction","CLOSE":"Close","CLOSE_EDITIONS_MENU":"Close editions menu","COLUMNIST":"Columnist","COMMENTS_WEBVIEW_TITLE":"Conversations","CONTENT_REMOVED":"Content Removed","CONTRIBUTOR":"Contributor","CONTRIBUTOR_DISCLAIMER":"This post was published on the now-closed HuffPost Contributor platform. Contributors control their own work and posted freely to our site. If you need to flag t