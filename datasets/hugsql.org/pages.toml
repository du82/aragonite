title = "Parameter Types | HugSQL"
description = "Within an SQL statement itself, HugSQL understands several types of parameters that can be passed in during the function call. All parameter types take the form:"
full_description = "Parameter TypesWithin an SQL statement itself, HugSQL understands several types of parameters that can be passed in during the function call. All parameter types take the form::param-nameCopyOR:param-type:param-nameCopyWhen a HugSQL-generated function is called, the parameters in an SQL statement are replaced at runtime with the hash-map data passed in as the function's second argument. The keys of the hash-map are matched to the :param-name portion of the parameter. Parameters can be repeated throughout an SQL statement, and all instances of a parameter will be replaced.Edit this page"
