title = "Introduction | HugSQL"
full_description = "IntroductionHugSQL is a Clojure library for embracing SQL.SQL is the right tool for the job when working with a relational database!HugSQL uses simple conventions in your SQL files to define database functions in your Clojure namespace, creating a clean separation of Clojure and SQL code.HugSQL supports runtime replacement of:SQL Values where id = :idSQL Value Lists where id in (:v*:ids)SQL Identifiers from :i:table-nameSQL Identifier Lists select :i*:column-namesSQL Tuples where (a.id, b.id) = (:t:ids)SQL Tuple Lists insert into emp (id, name) values (:t*:people)Raw SQLCustom Parameter Types (implement your own)HugSQL features Clojure Expressions and Snippets providing the full expressiveness of Clojure and the composability of partial SQL statements when constructing complex SQL queries.HugSQL has protocol-based adapters supporting multiple database libraries and ships with adapters for clojure.java.jdbc (default), next.jdbc, and clojure.jdbc.Edit this page"
