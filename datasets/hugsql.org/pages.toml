title = "Deep Get Parameter Names | HugSQL"
description = 'The parameter name can optionally use a "deep get" syntax to drill down into a parameter data structure. This syntax consists of keywords and integers joined by a period .. A keyword is a key for a hashmap. An integer is a vector index. For example:'
full_description = 'Deep Get Parameter NamesThe parameter name can optionally use a "deep get" syntax to drill down into a parameter data structure. This syntax consists of keywords and integers joined by a period .. A keyword is a key for a hashmap. An integer is a vector index. For example:SQL-- first-employee :? :1select * from employees where id = :value:employees.0.idCopyClojure(first-employee db {:employees [{:id 1} {:id 2}]});=> {:id 1 :name "Al"}CopyEdit this page Deep Get Parameter NamesThe parameter name can optionally use a "deep get" syntax to drill down into a parameter data structure. This syntax consists of keywords and integers joined by a period .. A keyword is a key for a hashmap. An integer is a vector index. For example:SQL-- first-employee :? :1select * from employees where id = :value:employees.0.idCopyClojure(first-employee db {:employees [{:id 1} {:id 2}]});=> {:id 1 :name "Al"}CopyEdit this pagePreviousCustom Parameter TypesNextNamespaced Keywords'
