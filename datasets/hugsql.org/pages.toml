["https://hugsql.org/hugsql-in-detail/parameter-types/sql-identifier-parameters"]
title = "SQL Identifier Parameters | HugSQL"
description = "Identifier Parameters are replaced at runtime with an optionally-quoted SQL identifier."
full_description = '''SQL Identifier ParametersIdentifier Parameters are replaced at runtime with an optionally-quoted SQL identifier.Identifier Parameters' type is :identifier, or :i for short.SQL--:name identifier-param :? :*select * from :i:table-nameCopyClojure(identifier-param-sqlvec {:table-name "example"});=> ["select * from example"]CopyAs of HugSQL 0.4.6, Identifier Parameters support SQL aliases:Clojure(identifier-param-sqlvec {:table-name ["example" "my_example"]});=> ["select * from example as my_example"]CopyBy default, identifiers are not quoted. You can specify your desired quoting as an option when defining your functions or as an option when calling your function.dangerIf you are taking identifiers from user input, you should use the :quoting option to properly quote and escape identifiers to prevent SQL injection!Valid :quoting options provided to hugsql.core/def-db-fns (and friends) are::ansi double-quotes: "identifier":mysql backticks: `identifier`:mssql square brackets: [identifier]:off no quoting (default)Identifiers containing a period/dot . are split, quoted separately, and then rejoined. This supports myschema.mytable conventions.Clojure(hugsql.core/def-db-fns "path/to/good.sql" {:quoting :ansi})(identifier-param-sqlvec {:table-name "example"});=> ["select * from \"example\""](identifier-param-sqlvec {:table-name "schema1.example"} {:quoting :mssql});=> ["select * from [schema1].[example]"]CopyEdit this page'''
