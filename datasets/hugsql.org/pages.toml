title = "SQL Identifier List Parameters | HugSQL"
description = "Identifier List Parameters are similar to Identifier Parameters, but work on lists of identifiers. You might use these to replace column lists found in select, group by, or order by clauses."
full_description = '''SQL Identifier List ParametersIdentifier List Parameters are similar to Identifier Parameters, but work on lists of identifiers. You might use these to replace column lists found in select, group by, or order by clauses.Identifier List Parameter's type is :identifier*, or :i* for short.The * indicates a sequence of zero or more identifiers.Each identifier in the list is treated as an Identifier Parameter, and the list is joined with a comma.SQL--:name identifier-list-param :? :*select :i*:column-names, count(*) as populationfrom examplegroup by :i*:column-namesorder by :i*:column-namesCopyClojure(identifier-list-param-sqlvec {:column-names ["state" "city"]});=> ["select state, city, count(*) as population\n; from example\n; group by state, city\n; order by state, city"]CopyAs of HugSQL 0.4.6, Identifier List Parameters support SQL aliases:SQL--:name identifier-list-param :? :*select :i*:column-names-aliased, count(*) as populationfrom examplegroup by :i*:column-namesorder by :i*:column-namesCopyClojure(let [columns [["state" "my_state"] ["city" "my_city"]]] (identifier-list-param-sqlvec {:column-names-aliased columns :column-names (mapv first columns)}));=> ["select state as my_state, city as my_city, count(*) as population\n; from example\n; group by state, city\n; order by state, city"]CopyEdit this page'''
