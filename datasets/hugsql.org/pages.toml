["https://hugsql.org/hugsql-in-detail/sql-file-conventions"]
title = "SQL File Conventions | HugSQL"
description = "HugSQL SQL files contain special single-line comments and multi-line comments in the following forms:"
full_description = "SQL File ConventionsHugSQL SQL files contain special single-line comments and multi-line comments in the following forms:SQL -- :key value1 value2 value3 OR /* :key value1 value2 value3 */CopyExamples:SQL-- regular SQL comment ignored by hugsql/*regular SQL multi-line comment ignored by hugsql*/-- :name query-get-many :? :*-- :doc My query doc string to end of this lineselect * from my_table;-- :name query-get-one :? :1/* :docMy multi-linecomment doc string*/select * from my_table limit 1CopyHugSQL recognizes the following keys::name or :name- (private fn) Name of the function to create. Optionally followed by the command and result (e.g., :name :? :*) instead of providing these as separate key/value pairs.:doc Docstring for the created function.:command Underlying database command to run.:result Expected result type (shape).:snip or :snip- (private fn) Name of the function to create. :snip is used in place of :name for snippets.:meta Metadata in the form of an EDN hashmap to attach to function.:require Namespace require and aliases for Clojure expression support.Edit this page"
year_published = 2025
