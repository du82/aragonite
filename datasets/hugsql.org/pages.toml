["https://hugsql.org/hugsql-in-detail"]
title = "HugSQL in Detail | HugSQL"
description = "HugSQL encourages SQL, DDL, and DML statements to be stored in SQL files such that you are not concatenating large strings or needing to use leaky-abstraction DSLs in your Clojure projects."
full_description = "HugSQL in DetailHugSQL encourages SQL, DDL, and DML statements to be stored in SQL files such that you are not concatenating large strings or needing to use leaky-abstraction DSLs in your Clojure projects.In order to generate the Clojure functions from your SQL statements, HugSQL requires a simple set of conventions in your SQL files. These conventions allow HugSQL to:define functions by nameadd docstrings to defined functionsdetermine how to execute (the command type):SQL selectDDL create table/index/view, drop ...DML insert, update, deleteany other statements (e.g. vacuum analyze)determine the result type:one row (hash-map)many rows (vector of hash-maps)affected rowsany other result you implementreplace parameters for:Values: where id = :idValue Lists: where id in (:v*:ids)Tuple Lists (for multi-insert): values :tuple*:my-recordsSQL Identifiers: from :i:table-nameSQL Identifier Lists: select :i*:column-namesRaw SQL: :sql:my-queryEdit this page"
year_published = 2025
