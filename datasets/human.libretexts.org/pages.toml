\ #2 \\ #3 \end{array}\right]}\) \(\newcommand{\fourvec}[4]{\left[\begin{array}{r}#1 \\ #2 \\ #3 \\ #4 \end{array}\right]}\) \(\newcommand{\cfourvec}[4]{\left[\begin{array}{c}#1 \\ #2 \\ #3 \\ #4 \end{array}\right]}\) \(\newcommand{\fivevec}[5]{\left[\begin{array}{r}#1 \\ #2 \\ #3 \\ #4 \\ #5 \\ \end{array}\right]}\) \(\newcommand{\cfivevec}[5]{\left[\begin{array}{c}#1 \\ #2 \\ #3 \\ #4 \\ #5 \\ \end{array}\right]}\) \(\newcommand{\mattwo}[4]{\left[\begin{array}{rr}#1 \amp #2 \\ #3 \amp #4 \\ \end{array}\right]}\) \(\newcommand{\laspan}[1]{\text{Span}\{#1\}}\) \(\newcommand{\bcal}{\cal B}\) \(\newcommand{\ccal}{\cal C}\) \(\newcommand{\scal}{\cal S}\) \(\newcommand{\wcal}{\cal W}\) \(\newcommand{\ecal}{\cal E}\) \(\newcommand{\coords}[2]{\left\{#1\right\}_{#2}}\) \(\newcommand{\gray}[1]{\color{gray}{#1}}\) \(\newcommand{\lgray}[1]{\color{lightgray}{#1}}\) \(\newcommand{\rank}{\operatorname{rank}}\) \(\newcommand{\row}{\text{Row}}\) \(\newcommand{\col}{\text{Col}}\) \(\renewcommand{\row}{\text{Row}}\) \(\newcommand{\nul}{\text{Nul}}\) \(\newcommand{\var}{\text{Var}}\) \(\newcommand{\corr}{\text{corr}}\) \(\newcommand{\len}[1]{\left|#1\right|}\) \(\newcommand{\bbar}{\overline{\bvec}}\) \(\newcommand{\bhat}{\widehat{\bvec}}\) \(\newcommand{\bperp}{\bvec^\perp}\) \(\newcommand{\xhat}{\widehat{\xvec}}\) \(\newcommand{\vhat}{\widehat{\vvec}}\) \(\newcommand{\uhat}{\widehat{\uvec}}\) \(\newcommand{\what}{\widehat{\wvec}}\) \(\newcommand{\Sighat}{\widehat{\Sigma}}\) \(\newcommand{\lt}{<}\) \(\newcommand{\gt}{>}\) \(\newcommand{\amp}{&}\) \(\definecolor{fillinmathshade}{gray}{0.9}\) No headers Humanities are academic disciplines that explore human society and culture. During the Renaissance, the term primarily referred to classics, distinguishing secular studies from divinity. Today, humanities encompass fields outside professional training, mathematics, natural sciences, and sometimes social sciences, focusing on understanding the human experience. Introduction to Humanities 1e (Larsen)This text is an introductory survey of the genres and themes of the humanities. The material focuses on philosophy, religion, language, and the arts. As themes, the ideas of freedom, love, happiness, death, nature, and myth are be explored. Typically, a study of humanities looks at western philosophers, maybe a few of the world religions, a history of western music and western visual arts. This textbook begins to break down the barriers of limiting ourselves to learning about western humanities.Front Matter1: ChaptersBack MatterIntroduction to Humanities 2e (Larsen)This course is an introductory survey of the genres and themes of the humanities. Readings, lectures, and class discussions will focus on genres such as music, the visual arts, drama, literature, and philosophy. As themes, the ideas of freedom, love, happiness, death, nature, and myth may be explored from a western and non-western point of view.Front Matter1: ChaptersBack MatterBeing Human: An Introduction to Western Culture (Shehorn)The humanities are branches of study focused on culture, values, and other ways that humans express themselves, like literature, art, history, philosophy, and religion. The idea of the humanities originates in Greece with paideia, or general education beginning with the Sophists in the fifth century BCE. The goal of these studies was to prepare young men to be good and active citizens and Cicero’s humanitas, which prepared young men to be orators.Front Matter1: Beauty2: Love3: Discovery4: Conquest5: FreedomConclusionBack MatterModern Humanities (Turnbull and Ricciardi)Through the exploration of modern literature, drama, art, film, poetry, and music, this course places developments in the Humanities into historical and philosophical contexts and illustrates the continuity of culture. This course introduces students to literature, philosophy, art, film, and music from the beginning of the 20th century to the present.Front Matter1: BIRTH OF MODERNISM AND THE MODERN WORLD (1900-1920’s)2: THE ROARING TWENTIES and THE GREAT FALL (1920’s-1945)3: THE SEARCH FOR MEANING and BEGINNING OF GLOBALISM (1945-1950’s)4: LIBERATION AND EQUALITY (1960-ONWARD)Back MatterHumanities: Prehistory to the 15th Century (Lumen)The book Humanities: Prehistory to the 15th Century provides an interdisciplinary exploration of human history, culture, and artistic achievements from prehistoric times through the Middle Ages. It examines key cultural developments, including art, literature, philosophy, religion, and architecture, highlighting their societal contexts and global influences.Front Matter1: Prehistoric Culture2: Mesopotamia Culture3: Egyptian Culture4: Greek Culture5: Roman Culture6: Roman and Christian Religious Culture7: Byzantine and Muslim Culture8: Western European Civilization During the Middle AgesBack Matter/*<![CDATA[*/{"MindTouch.IDF3.label.drag-n-drop":"Drag","MindTouch.IDF3.label.reveal.showAll":"Show all","MindTouch.IDF3.label.reveal.showLess":"Show less","MindTouch.IDF3.warning.page-order-limit-exceeded":"Sorry, there are too many child pages to safely reorder. The greatest number of children you can reorder on a page is {0}."}/*]]>*/ Thumbnail: Dublino, Irlanda (Unsplash License; Giammarco Boscaro via Unsplash) /*<![CDATA[*/window.addEventListener('DOMContentLoaded', function () { $('iframe').on('load', function () { $(this).iFrameResize({ warningTimeout: 0, scrolling: 'omit' }); }) })/*]]>*/ /*<![CDATA[*/ var front = "auto"; if(front=="auto"){ front = "Humanities"; if(front.includes(":")){ front = front.split(":")[0]; if(front.includes(".")){ front = front.split("."); front = front.map((int)=>int.includes("0")?parseInt(int,10):int).join("."); } front+="."; } else { front = ""; } } front = front.replace(/_/g," "); MathJaxConfig = { TeX: { equationNumbers: { autoNumber: "all", formatNumber: function (n) { if(false){ return front + (Number(n)+false); } else{return front + n; } } }, macros: { PageIndex: ["{"+front+" #1}",1], test: ["{"