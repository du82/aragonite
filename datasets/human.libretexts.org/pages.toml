command{\Span}{\mathrm{span}}\) \( \newcommand{\kernel}{\mathrm{null}\,}\) \( \newcommand{\range}{\mathrm{range}\,}\) \( \newcommand{\RealPart}{\mathrm{Re}}\) \( \newcommand{\ImaginaryPart}{\mathrm{Im}}\) \( \newcommand{\Argument}{\mathrm{Arg}}\) \( \newcommand{\norm}[1]{\| #1 \|}\) \( \newcommand{\inner}[2]{\langle #1, #2 \rangle}\) \( \newcommand{\Span}{\mathrm{span}}\) \( \newcommand{\AA}{\unicode[.8,0]{x212B}}\) \( \newcommand{\vectorA}[1]{\vec{#1}} % arrow\) \( \newcommand{\vectorAt}[1]{\vec{\text{#1}}} % arrow\) \( \newcommand{\vectorB}[1]{\overset { \scriptstyle \rightharpoonup} {\mathbf{#1}} } \) \( \newcommand{\vectorC}[1]{\textbf{#1}} \) \( \newcommand{\vectorD}[1]{\overrightarrow{#1}} \) \( \newcommand{\vectorDt}[1]{\overrightarrow{\text{#1}}} \) \( \newcommand{\vectE}[1]{\overset{-\!-\!\rightharpoonup}{\vphantom{a}\smash{\mathbf {#1}}}} \) \( \newcommand{\vecs}[1]{\overset { \scriptstyle \rightharpoonup} {\mathbf{#1}} } \) \( \newcommand{\vecd}[1]{\overset{-\!-\!\rightharpoonup}{\vphantom{a}\smash {#1}}} \) \(\newcommand{\avec}{\mathbf a}\) \(\newcommand{\bvec}{\mathbf b}\) \(\newcommand{\cvec}{\mathbf c}\) \(\newcommand{\dvec}{\mathbf d}\) \(\newcommand{\dtil}{\widetilde{\mathbf d}}\) \(\newcommand{\evec}{\mathbf e}\) \(\newcommand{\fvec}{\mathbf f}\) \(\newcommand{\nvec}{\mathbf n}\) \(\newcommand{\pvec}{\mathbf p}\) \(\newcommand{\qvec}{\mathbf q}\) \(\newcommand{\svec}{\mathbf s}\) \(\newcommand{\tvec}{\mathbf t}\) \(\newcommand{\uvec}{\mathbf u}\) \(\newcommand{\vvec}{\mathbf v}\) \(\newcommand{\wvec}{\mathbf w}\) \(\newcommand{\xvec}{\mathbf x}\) \(\newcommand{\yvec}{\mathbf y}\) \(\newcommand{\zvec}{\mathbf z}\) \(\newcommand{\rvec}{\mathbf r}\) \(\newcommand{\mvec}{\mathbf m}\) \(\newcommand{\zerovec}{\mathbf 0}\) \(\newcommand{\onevec}{\mathbf 1}\) \(\newcommand{\real}{\mathbb R}\) \(\newcommand{\twovec}[2]{\left[\begin{array}{r}#1 \\ #2 \end{array}\right]}\) \(\newcommand{\ctwovec}[2]{\left[\begin{array}{c}#1 \\ #2 \end{array}\right]}\) \(\newcommand{\threevec}[3]{\left[\begin{array}{r}#1 \\ #2 \\ #3 \end{array}\right]}\) \(\newcommand{\cthreevec}[3]{\left[\begin{array}{c}#1 \\ #2 \\ #3 \end{array}\right]}\) \(\newcommand{\fourvec}[4]{\left[\begin{array}{r}#1 \\ #2 \\ #3 \\ #4 \end{array}\right]}\) \(\newcommand{\cfourvec}[4]{\left[\begin{array}{c}#1 \\ #2 \\ #3 \\ #4 \end{array}\right]}\) \(\newcommand{\fivevec}[5]{\left[\begin{array}{r}#1 \\ #2 \\ #3 \\ #4 \\ #5 \\ \end{array}\right]}\) \(\newcommand{\cfivevec}[5]{\left[\begin{array}{c}#1 \\ #2 \\ #3 \\ #4 \\ #5 \\ \end{array}\right]}\) \(\newcommand{\mattwo}[4]{\left[\begin{array}{rr}#1 \amp #2 \\ #3 \amp #4 \\ \end{array}\right]}\) \(\newcommand{\laspan}[1]{\text{Span}\{#1\}}\) \(\newcommand{\bcal}{\cal B}\) \(\newcommand{\ccal}{\cal C}\) \(\newcommand{\scal}{\cal S}\) \(\newcommand{\wcal}{\cal W}\) \(\newcommand{\ecal}{\cal E}\) \(\newcommand{\coords}[2]{\left\{#1\right\}_{#2}}\) \(\newcommand{\gray}[1]{\color{gray}{#1}}\) \(\newcommand{\lgray}[1]{\color{lightgray}{#1}}\) \(\newcommand{\rank}{\operatorname{rank}}\) \(\newcommand{\row}{\text{Row}}\) \(\newcommand{\col}{\text{Col}}\) \(\renewcommand{\row}{\text{Row}}\) \(\newcommand{\nul}{\text{Nul}}\) \(\newcommand{\var}{\text{Var}}\) \(\newcommand{\corr}{\text{corr}}\) \(\newcommand{\len}[1]{\left|#1\right|}\) \(\newcommand{\bbar}{\overline{\bvec}}\) \(\newcommand{\bhat}{\widehat{\bvec}}\) \(\newcommand{\bperp}{\bvec^\perp}\) \(\newcommand{\xhat}{\widehat{\xvec}}\) \(\newcommand{\vhat}{\widehat{\vvec}}\) \(\newcommand{\uhat}{\widehat{\uvec}}\) \(\newcommand{\what}{\widehat{\wvec}}\) \(\newcommand{\Sighat}{\widehat{\Sigma}}\) \(\newcommand{\lt}{<}\) \(\newcommand{\gt}{>}\) \(\newcommand{\amp}{&}\) \(\definecolor{fillinmathshade}{gray}{0.9}\) No headers Some civilizations were long lasting, others have almost disappeared, however, they left a record of their civilizations through sculptures. Depending on natural resources available, each culture used a variety of materials to create sculptures, some sculptures were practical and usable while others were merely decorative. Sculptures made of marble or stone came from quarries in nearby mountains, the raw marble or stone cut out by stonemasons and transported to the site where the figure would emerge under the guidance of the stone carver. Other sculptures were formed from the abundant clay found in alluvial plains, using the clay to build up layers to form an image. 5.1: OverviewDuring this period, art moved beyond the immense structures erected for a king or priest or decorated pottery. Art became aesthetically enjoyable by many, not just pragmatically serviceable.5.2: Roman Empire (27 BCE – 393 CE)The Roman Empire spread across three continents, surrounding the Mediterranean Sea, consuming many cultures with its massive and highly trained army, a formidable opponent to other civilizations.5.3: Classical and Hellenistic Greece (510 BCE – 31 BCE)Greece was almost the most perfect place to live during in 400 BCE; Athens was moving towards democracy, art was prospering, and the weather was exceptionally conducive for farming, The late Classical period in Greece was a time of change and progress in art, realistic statues were emerging with a human form unlike the upright, stiff statues of the past.5.4: Nok (700 BCE – 300 BCE)The Nok culture emerged around 700 BCE in Western Africa, located in the current day Nigeria, vanishing around 300 BCE. The Nok was one of the most advanced cultures in the sub-Saharan area to fabricate life-sized terracotta figures.5.5: Qin Dynasty (221 BCE - 206 BCE)When Emperor Qin Shi Huang united seven states and established a powerful central dynasty, the Qin Dynasty became China’s first imperial dynasty, lasting from 221 BCE to 206 BCE, a mere 15 years.5.6: Yayoi Period (300 BCE – 300 CE)The Yayoi Period followed the Jomon Period in Japan.5.7: Nazca (100 BCE – 800 CE)The Nazca lived in the river valleys of the mountains along the coast of Peru, a civilization flourishing on the high desert plateau in a city called Cahuachi—the line builders.5.8: Moche (100 CE – 800 CE)The Moche civilization prospered along the coast and inland valleys of Peru from 100 CE to 750 CE.5.9: Conclusion and Contrast5.10: Chapter Five Attributions/*<![CDATA[*/{"MindTouch.IDF3.label.guide.settings.classifications":"Classification settings","MindTouch.IDF3.label.guide.settings.learningpath":"Path settings","MindTouch.IDF3.label.overview.max.count":"{0} characters remaining.","MindTouch.IDF3.label.overview.max.count.over":"Warning. {0} characters will be truncated.","MindTouch.LearningPath.dialog.remove.cancel":"Cancel","MindTouch.LearningPath.dialog.remove.confirm":"OK","MindTouch.LearningPath.dialog.remove.header":"Remove path","MindTouch.LearningPath.dialog.remove.message":"You are about to remove this path from this guide."}/*]]>*/ /*<![CDATA[*/window.addEventListener('DOMContentLoaded', function () { $('iframe').on('load', function () { $(this).iFrameResize({ warningTimeout: 0, scrolling: 'omit' }); }) })/*]]>*/ /*<![CDATA[*/ var front = "auto"; if(front=="auto"){ front = "5: The Transition of Art (400 BCE – 200 CE)"; if(front.includes(":")){ front = front.split(":")[0]; if(front.includes(".")){ front = front.split("."); front = front.map((int)=>int.includes("0")?parseInt(int,10):int).join("."); } front+="."; } else { front = ""; } } front = front.replace(/_/g," "); MathJaxConfig = { TeX: { equationNumbers: { autoNumber: "all", formatNumber: function (n) { if(false){ return front + (Number(n)+false); } else{return front + n; } } }, macros: { PageIndex: ["{"+front+" #1}",1], test: ["{"+front+" #1}",1] }, Macros: { PageIndex: ["{"+front+" #1}",1], test: ["{"+front+" #1}",1] }, SVG: { linebreaks: { automatic: true } } } }; MathJax.Hub.Config(MathJaxConfig); MathJax.Hub.Register.StartupHook("End", ()=>{if(activateBeeLine)activateBeeLine()}); /*]]>*/ This page titled 5: The Transition of Art (400 BCE – 200 CE) is shared under a CC BY 4.0 license and was authored, remixed, and/o