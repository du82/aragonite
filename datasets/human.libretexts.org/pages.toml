incess KaguyaBack MatterSatyricon: Translation with Critical Introduction and ActivitiesTHE SATYRICON. Latin original by Gaius or Titus Petronius. Translated by Alfred R. Allinson (Panurge Press, 1930), adapted and abridged by Jessalynn Bird, following chapter divisions and textual ellipses of C. Chinn. A reconstructed translation of the Satyricon, complete with critical introduction and footnotes. Questions and activities may be found as separate chapters.Front MatterThe Text of the Satyricon- Critical Introduction, Translation, FootnotesGuides and ActivitiesThe Mongols: Self-Perception, Letters and Rhetoric, and Modern LegaciesThis unit opens with an assignment on the Mongols' self-identity as presented in their Secret History. Another assignment compares and contrasts diplomatic and military approaches utilized by Mongol and western rulers. The unit closes with an assignment which encourages the analysis of the legacies of the Mongols on Western perceptions and depictions of Asia, particularly China and Mongolia./*<![CDATA[*/{"MindTouch.IDF3.label.drag-n-drop":"Drag","MindTouch.IDF3.label.reveal.showAll":"Show all","MindTouch.IDF3.label.reveal.showLess":"Show less","MindTouch.IDF3.warning.page-order-limit-exceeded":"Sorry, there are too many child pages to safely reorder. The greatest number of children you can reorder on a page is {0}."}/*]]>*/ /*<![CDATA[*/window.addEventListener('DOMContentLoaded', function () { $('iframe').on('load', function () { $(this).iFrameResize({ warningTimeout: 0, scrolling: 'omit' }); }) })/*]]>*/ /*<![CDATA[*/ var front = "auto"; if(front=="auto"){ front = "Humanistic Studies Supplemental Modules"; if(front.includes(":")){ front = front.split(":")[0]; if(front.includes(".")){ front = front.split("."); front = front.map((int)=>int.includes("0")?parseInt(int,10):int).join("."); } front+="."; } else { front = ""; } } front = front.replace(/_/g," "); MathJaxConfig = { TeX: { equationNumbers: { autoNumber: "all", formatNumber: function (