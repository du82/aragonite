mmand{\threevec}[3]{\left[\begin{array}{r}#1 \\ #2 \\ #3 \end{array}\right]}\) \(\newcommand{\cthreevec}[3]{\left[\begin{array}{c}#1 \\ #2 \\ #3 \end{array}\right]}\) \(\newcommand{\fourvec}[4]{\left[\begin{array}{r}#1 \\ #2 \\ #3 \\ #4 \end{array}\right]}\) \(\newcommand{\cfourvec}[4]{\left[\begin{array}{c}#1 \\ #2 \\ #3 \\ #4 \end{array}\right]}\) \(\newcommand{\fivevec}[5]{\left[\begin{array}{r}#1 \\ #2 \\ #3 \\ #4 \\ #5 \\ \end{array}\right]}\) \(\newcommand{\cfivevec}[5]{\left[\begin{array}{c}#1 \\ #2 \\ #3 \\ #4 \\ #5 \\ \end{array}\right]}\) \(\newcommand{\mattwo}[4]{\left[\begin{array}{rr}#1 \amp #2 \\ #3 \amp #4 \\ \end{array}\right]}\) \(\newcommand{\laspan}[1]{\text{Span}\{#1\}}\) \(\newcommand{\bcal}{\cal B}\) \(\newcommand{\ccal}{\cal C}\) \(\newcommand{\scal}{\cal S}\) \(\newcommand{\wcal}{\cal W}\) \(\newcommand{\ecal}{\cal E}\) \(\newcommand{\coords}[2]{\left\{#1\right\}_{#2}}\) \(\newcommand{\gray}[1]{\color{gray}{#1}}\) \(\newcommand{\lgray}[1]{\color{lightgray}{#1}}\) \(\newcommand{\rank}{\operatorname{rank}}\) \(\newcommand{\row}{\text{Row}}\) \(\newcommand{\col}{\text{Col}}\) \(\renewcommand{\row}{\text{Row}}\) \(\newcommand{\nul}{\text{Nul}}\) \(\newcommand{\var}{\text{Var}}\) \(\newcommand{\corr}{\text{corr}}\) \(\newcommand{\len}[1]{\left|#1\right|}\) \(\newcommand{\bbar}{\overline{\bvec}}\) \(\newcommand{\bhat}{\widehat{\bvec}}\) \(\newcommand{\bperp}{\bvec^\perp}\) \(\newcommand{\xhat}{\widehat{\xvec}}\) \(\newcommand{\vhat}{\widehat{\vvec}}\) \(\newcommand{\uhat}{\widehat{\uvec}}\) \(\newcommand{\what}{\widehat{\wvec}}\) \(\newcommand{\Sighat}{\widehat{\Sigma}}\) \(\newcommand{\lt}{<}\) \(\newcommand{\gt}{>}\) \(\newcommand{\amp}{&}\) \(\definecolor{fillinmathshade}{gray}{0.9}\) No headers 1.1: What Is Art Appreciation?Appreciation of the visual arts goes beyond staring at a painting hanging on the wall of a museum—art is in everything and everywhere you look. Opening your eyes to the world of art is essential in understanding the world around you.1.2: Art of the Past and the Origins of CreativityExploring art outside the norm, understand the origins of creativity, and how it connects the art of the past in all cultures across the world is critical in art appreciation.1.3: What are BCE and CE?Scholars have readily adopted the new BCE/CE designation for communication and modernizing a worldwide standard.1.4: What is an ArtistAn artist is any person from any culture engaged in one or more activities to create art or practice art.1.5: How to Compare and Contrast ArtComparing modern paintings and historic paintings brings an understanding of how the past influences the present. Learning the elements of art, design, and art methods will help you communicate and write with a new language to compare and contrasting art.1.6: What Are the Elements of Art and the Principles of Art?The visual art terms separate into the elements and principles of art. The elements of art are color, form, line, shape, space, and texture. The principles of art are scale, proportion, unity, variety, rhythm, mass, shape, space, balance, volume, perspective, and depth.1.7: Art Materials and MethodsArt materials and methods are anything an artist uses to create art in any combination. Materials and methods also can be defined as the process of manufacturing or fabrication of a piece of art such as bronze needs to be melted and poured into a mold to be a finished piece of art.1.8: Chapter 1 Attributions/*<![CDATA[*/{"MindTouch.IDF3.label.guide.settings.classifications":"Classification settings","MindTouch.IDF3.label.guide.settings.learningpath":"Path settings","MindTouch.IDF3.label.overview.max.count":"{0} characters remaining.","MindTouch.IDF3.label.overview.max.count.over":"Warning. {0} characters will be truncated.","MindTouch.LearningPath.dialog.remove.cancel":"Cancel","MindTouch.LearningPath.dialog.remove.confirm":"OK","MindTouch.LearningPath.dialog.remove.header":"Remove path","MindTouch.LearningPath.dialog.remove.message":"You 