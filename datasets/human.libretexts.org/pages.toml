mmand{\threevec}[3]{\left[\begin{array}{r}#1 \\ #2 \\ #3 \end{array}\right]}\) \(\newcommand{\cthreevec}[3]{\left[\begin{array}{c}#1 \\ #2 \\ #3 \end{array}\right]}\) \(\newcommand{\fourvec}[4]{\left[\begin{array}{r}#1 \\ #2 \\ #3 \\ #4 \end{array}\right]}\) \(\newcommand{\cfourvec}[4]{\left[\begin{array}{c}#1 \\ #2 \\ #3 \\ #4 \end{array}\right]}\) \(\newcommand{\fivevec}[5]{\left[\begin{array}{r}#1 \\ #2 \\ #3 \\ #4 \\ #5 \\ \end{array}\right]}\) \(\newcommand{\cfivevec}[5]{\left[\begin{array}{c}#1 \\ #2 \\ #3 \\ #4 \\ #5 \\ \end{array}\right]}\) \(\newcommand{\mattwo}[4]{\left[\begin{array}{rr}#1 \amp #2 \\ #3 \amp #4 \\ \end{array}\right]}\) \(\newcommand{\laspan}[1]{\text{Span}\{#1\}}\) \(\newcommand{\bcal}{\cal B}\) \(\newcommand{\ccal}{\cal C}\) \(\newcommand{\scal}{\cal S}\) \(\newcommand{\wcal}{\cal W}\) \(\newcommand{\ecal}{\cal E}\) \(\newcommand{\coords}[2]{\left\{#1\right\}_{#2}}\) \(\newcommand{\gray}[1]{\color{gray}{#1}}\) \(\newcommand{\lgray}[1]{\color{lightgray}{#1}}\) \(\newcommand{\rank}{\operatorname{rank}}\) \(\newcommand{\row}{\text{Row}}\) \(\newcommand{\col}{\text{Col}}\) \(\renewcommand{\row}{\text{Row}}\) \(\newcommand{\nul}{\text{Nul}}\) \(\newcommand{\var}{\text{Var}}\) \(\newcommand{\corr}{\text{corr}}\) \(\newcommand{\len}[1]{\left|#1\right|}\) \(\newcommand{\bbar}{\overline{\bvec}}\) \(\newcommand{\bhat}{\widehat{\bvec}}\) \(\newcommand{\bperp}{\bvec^\perp}\) \(\newcommand{\xhat}{\widehat{\xvec}}\) \(\newcommand{\vhat}{\widehat{\vvec}}\) \(\newcommand{\uhat}{\widehat{\uvec}}\) \(\newcommand{\what}{\widehat{\wvec}}\) \(\newcommand{\Sighat}{\widehat{\Sigma}}\) \(\newcommand{\lt}{<}\) \(\newcommand{\gt}{>}\) \(\newcommand{\amp}{&}\) \(\definecolor{fillinmathshade}{gray}{0.9}\) No headers How did humans initiate their desire to create art and why? Undoubtably, this query will never be resolved by cultural anthropologists, however, the more archeological sites discovered and excavated the more our discovery of humans and their creativity continues. When an ancient settlement is established, archeologists take great care in removing artifacts, piecing together what the art meant to the culture. If the foundation of a great building is discovered, researchers study the architecture, imagining how the great buildings were designed and built without the aid of today’s technology or heavy equipment. How were the great pyramids constructed? How were the stones moved to build Stonehenge? 2.1: OverviewThe definition of Prehistoric is defined as any time prior to the written word by humans. Does that make the history any less valuable? No, for definition ‘pre’ means before the first evidence of written language. Maybe there is evidence not yet found. How would that change the definition? Prehistoric time can be divided into two periods: Paleolithic beginning about 2.6 million years ago to 12,000 BCE; and the Neolithic beginning 12,000 BCE and continuing until to 4500 BCE.2.2: Geology of CavesCaves are openings in the earth caused by the erosion of the limestone. Limestone is a naturally occurring sedimentary rock and makes up 10% of all the rock on the planet. The limestone usually is composed of marine skeleton fragments from coral reefs and grains of silica, chert, clay, sand, and silt. The composition of limestone is easily eroded by water.2.3: Cave ArtMany people wonder how scientists establish the approximate dates of ancient art. In the late 1940s, the University of Chicago developed a method called radio carbon dating which relies on the amount of carbon located in the object in reference to the amount of carbon in the atmosphere.2.4: Handheld ArtHandheld art is known as venus figures, also known as a fertility goddess, received the names from archeologists to describe the pocket-sized female like sculptures.2.5: Conclusion and Contrast2.6: Attributions/*<![CDATA[*/{"MindTouch.IDF3.label.guide.settings.classifications":"Classification settings","MindTouch.IDF3.label.guide.settings.learningpath":"Path s