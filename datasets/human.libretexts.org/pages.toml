rray}{c}#1 \\ #2 \end{array}\right]}\) \(\newcommand{\threevec}[3]{\left[\begin{array}{r}#1 \\ #2 \\ #3 \end{array}\right]}\) \(\newcommand{\cthreevec}[3]{\left[\begin{array}{c}#1 \\ #2 \\ #3 \end{array}\right]}\) \(\newcommand{\fourvec}[4]{\left[\begin{array}{r}#1 \\ #2 \\ #3 \\ #4 \end{array}\right]}\) \(\newcommand{\cfourvec}[4]{\left[\begin{array}{c}#1 \\ #2 \\ #3 \\ #4 \end{array}\right]}\) \(\newcommand{\fivevec}[5]{\left[\begin{array}{r}#1 \\ #2 \\ #3 \\ #4 \\ #5 \\ \end{array}\right]}\) \(\newcommand{\cfivevec}[5]{\left[\begin{array}{c}#1 \\ #2 \\ #3 \\ #4 \\ #5 \\ \end{array}\right]}\) \(\newcommand{\mattwo}[4]{\left[\begin{array}{rr}#1 \amp #2 \\ #3 \amp #4 \\ \end{array}\right]}\) \(\newcommand{\laspan}[1]{\text{Span}\{#1\}}\) \(\newcommand{\bcal}{\cal B}\) \(\newcommand{\ccal}{\cal C}\) \(\newcommand{\scal}{\cal S}\) \(\newcommand{\wcal}{\cal W}\) \(\newcommand{\ecal}{\cal E}\) \(\newcommand{\coords}[2]{\left\{#1\right\}_{#2}}\) \(\newcommand{\gray}[1]{\color{gray}{#1}}\) \(\newcommand{\lgray}[1]{\color{lightgray}{#1}}\) \(\newcommand{\rank}{\operatorname{rank}}\) \(\newcommand{\row}{\text{Row}}\) \(\newcommand{\col}{\text{Col}}\) \(\renewcommand{\row}{\text{Row}}\) \(\newcommand{\nul}{\text{Nul}}\) \(\newcommand{\var}{\text{Var}}\) \(\newcommand{\corr}{\text{corr}}\) \(\newcommand{\len}[1]{\left|#1\right|}\) \(\newcommand{\bbar}{\overline{\bvec}}\) \(\newcommand{\bhat}{\widehat{\bvec}}\) \(\newcommand{\bperp}{\bvec^\perp}\) \(\newcommand{\xhat}{\widehat{\xvec}}\) \(\newcommand{\vhat}{\widehat{\vvec}}\) \(\newcommand{\uhat}{\widehat{\uvec}}\) \(\newcommand{\what}{\widehat{\wvec}}\) \(\newcommand{\Sighat}{\widehat{\Sigma}}\) \(\newcommand{\lt}{<}\) \(\newcommand{\gt}{>}\) \(\newcommand{\amp}{&}\) \(\definecolor{fillinmathshade}{gray}{0.9}\) No headers From the time of the first civilizations, people continued to adapt and explore their environments, Innovations lead to inventions making life easier and aiding in the emergence of new cultures. Simultaneously, throughout the world, ancient civilizations were constructing large structures without the aid of modern building equipment. 4.1: OverviewFrom the time of the first civilizations, people continued to adapt and explore their environments. Innovations lead to inventions making life more comfortable and aiding in the emergence of new cultures. Simultaneously, throughout the world, ancient civilizations were constructing large structures without the aid of modern building equipment.4.2: Middle, New, and Late Kingdom Egyptian Dynasties (1366 BCE – 332 BCE)The Egyptians continued as the powerhouse of the Nile River and tomb builders for the kings. Their standardized written language was into literary texts, and many technical innovations introduced around Egypt. The horse and chariot, musical instruments, bronze works, pottery, and looms evolved into modern machines.4.3: Aegean (1700 BCE – 1450 BCE)The largest concentration of people was on the island of Crete, home to the Minoans. They were a chief exporter of wine, crafted work, jewelry, oil, and importers of raw materials to support the growing number of people on the island. They built one of the finest fleets of merchant vessels for trading with other civilizations in the area; Egyptians, Mesopotamians, and Indus Valley people.4.4: Mesopotamia (2500 BCE – 330 BCE)Mesopotamia was the ancient region on the eastern side of the Mediterranean, today's Iraq and parts of Iran, Syria, and Turkey. The ancient Mesopotamians evolved into three distinct cultures: Assyrian, Babylonian, and Persian.4.5: Phoenicians (1200 BCE – 539 BCE)The Phoenicians were an ancient civilization living on the coast of the Mediterranean Sea in what is now Lebanon. Eventually, some of the settlements even extended along the coast of North Africa.4.6: Etruscan (900 BCE – 600 BCE)The Etruscans lived westward of the Tuscany region of what is now Italy, their culture influenced by the trading contacts with the Aegeans and Phoenicians.4.7: Shang and Zhou Dynasties (1766 BCE – 256 BCE)In China, the Xia dynasty was one of the first ancient civilizations to be described in historical records. There is some archeological evidence showing the Xia dynasty existed from 2100 to 1600 BCE as they settled on the Yellow (Huang) River.4.8: Late Jomon (1500 BCE – 300 BCE)The middle and late Jomon period in Japan brought about more significant expansion of settlements and new techniques with wet rice farming and bronze metallurgy. Trees were plentiful in the surrounding areas, and the Jomon people became skilled woodworkers, building permanent settlements using wood from the plentiful and long-lasting chestnut trees.4.9: Chavin (900 BCE – 200 BCE)Chavin culture developed during 900-200 BCE high in the northern Andes Mountains of Peru in the Mosna Valley. Settled by the Chavin, the highland plateau area is located 3150 meters above sea level, where the Mosna and Huachecsa rivers merge, forming a vibrant agricultural location.4.10: Olmec (1500 BCE – 400 BCE)As with most other civilizations, the Olmec civilization began where there was water, establishing their location on the alluvial fan of the Coatzacoalcos River basin. The Olmec’s erected three large sites around 900 BCE, La Venta, the largest and most prominent.4.11: Early and Middle Pre-Classic Mayan (2000 BCE – 400 BCE)The Early/Middle Pre-Classic Mayan civilization (2000-1000 BCE) remains somewhat of a mystery, although we do know they were agriculturalists in the lowlands of western Mesoamerica on the Pacific Ocean. During the Middle Pre-Classic, the Mayan started expanding northward to accommodate the population growth, becoming traders, engineers, and builders of towering temples.4.12: Conclusion and Contrast4.13: Chapter 4 Attributions/*<![CDATA[*/{"MindTouch.IDF3.label.guide.settings.classifications":"Classification settings","MindTouch.IDF3.label.guide.settings.learningpath":"Path settings","MindTouch.IDF3.label.overview.max.count":"{0} characters remaining.","Mind