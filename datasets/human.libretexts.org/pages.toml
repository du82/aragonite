use of materials and sense of beauty. Art is also conveyed by the simple act of creating art for art’s sake. Every person is born with the innate desire to create art and similar to other professions, training is essential in honing skills to produce art. Front Matter1: A World Perspective of Art Appreciation2: The Dawn of Art (40,800 BCE – 5000 BCE)3: The First Civilizations and their Art (5000 BCE – 1900 BCE)4: Learning to Build and the Evolution of Tools and Symbolic Statues (1900 BCE - 400 BCE)5: The Transition of Art (400 BCE – 200 CE)6: The Sophisticated Art of Cultures (200 CE – 1400 CE)7: The Sacred Buildings of Civilizations (200 CE – 1400 CE)8: Renaissance - The Growth of Europe (1400 CE – 1550 CE)9: The Beginning of Colonization (1550 CE – 1750 CE)10: The New World Grows (1700 CE – 1800 CE)11: The Industrial Revolution (1800 CE – 1899 CE)12: The Modern Art Movement (1900 CE – 1930 CE)13: The World is One (1930 – 1970)14: The World is One (1960 CE – 1990s CE)15: The New Millennium (2000 - 2020)Back Matter/*<![CDATA[*/{"MindTouch.IDF3.label.drag-n-drop":"Drag","MindTouch.IDF3.label.reveal.showAll":"Show all","MindTouch.IDF3.label.reveal.showLess":"Show less","MindTouch.IDF3.warning.page-order-limit-exceeded":"Sorry, there are too many child pages to safely reorder. The greatest number of children you can reorder on a page is {0}."}/*]]>*/ /*<![CDATA[*/window.addEventListener('DOMContentLoaded', function () { $('iframe').on('load', function () { $(this).iFrameResize({ warningTimeout: 0, scrolling: 'omit' }); }) })/*]]>*/ /*<![CDATA[*/ var front = "auto"; if(front=="auto"){ front = "A World Perspective of Art Appreciation (Gustlin and Gustlin) 1.0"; if(front.includes(":")){ front = front.split(":")[0]; if(front.includes(".")){ front = front.split("."); front = front.map((int)=>int.includes("0")?parseInt(int,10):int).join("."); } front+="."; } else { front = ""; } } front = front.replace(/_/g," "); MathJaxConfig = { TeX: { equationNumbers: { autoNumber: "all",