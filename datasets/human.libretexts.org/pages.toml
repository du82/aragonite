anding how information is produced and valued, and 3) the ethical use of information in creating new knowledge. Many of the concepts discussed in the pages in this section are also reflected in the Education and Professional Development section in the Social Sciences library. Doing Research (Brinkerhoff)Critical Thinking in Academic Research (Gruwell and Ewing)Introduction to College Research (Butler, Sargent, and Smith)Introduction to College-level Research (Iowa State University Library Instruction Services)Steps to Success Crossing the Bridge Between Literacy Research and Practice 2Ed. (Munger)The Information Literacy Users Guide (Bernnard et al.)Information Literacy - Basic Research Skills (Withers)Choosing and Using Sources - A Guide to Academic Research (Lowry)Choosing Using Sources: A Guide to Academic ResearchInformation Literacy Concepts: An Open Educational Resource (Hisle and Webb)Information Literacy - Research and Collaboration across Disciplines (D'Angelo)The Discipline of Organizing 4e (Glushko)Web Literacy for Student Fact-Checkers (Caulfield)Information Literacy in the Age of Algorithms (Project Information Literacy)/*<![CDATA[*/{"MindTouch.IDF3.label.drag-n-drop":"Drag","MindTouch.IDF3.label.reveal.showAll":"Show all","MindTouch.IDF3.label.reveal.showLess":"Show less","MindTouch.IDF3.warning.page-order-limit-exceeded":"Sorry, there are too many child pages to safely reorder. The greatest number of children you can reorder on a page is {0}."}/*]]>*/ /*<![CDATA[*/window.addEventListener('DOMContentLoaded', function () { $('iframe').on('load', function () { $(this).iFrameResize({ warningTimeout: 0, scrolling: 'omit' }); }) })/*]]>*/ /*<![CDATA[*/ var front = "auto"; if(front=="auto"){ front = "Research and Information Literacy"; if(front.includes(":")){ front = front.split(":")[0]; if(front.includes(".")){ front = front.split("."); front = front.map((int)=>int.includes("0")?parseInt(int,10):int).join("."); } front+="."; } else { front = ""; } } front 