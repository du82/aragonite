g the Environment - Media Representation and Climate ChangeBack MatterHumanities DEI-SJ OERThis OER contains readings, classroom activities, and assignments for use in humanities and English courses at City Colleges of Chicago. The subject matter offered is in the media studies discipline, and the focus is diversity, equity, inclusion, and social justice.Front Matter1: Reading Culture - A Primer on Power and Ideology2: Reading Culture - Critical Perspectives on Technology3: Reading Culture - Semiotics and the Fundamentals of Meaning-Making4: Reading Culture - Children's Media and the ‘Always/Already’ of Ideology5: Reading Culture - Oppositional Viewership and You6: Reading the News - Critical Media Strategies7: Reading the Movies - An Introduction to Cinematic Language8: Reading Television - The Cultural Shifts of Streaming Media9: Reading the Internet - The Political Power of Memes10: Reading the Internet - Coded Inequalities and Algorithmic Bias11: Reading the Internet - The (Hidden) Costs of the Digital1'''
