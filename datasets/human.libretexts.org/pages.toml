 (OER DEI SJ)This text introduces methods of research and writing of investigative papers.Front Matter1: Compare and Contrast Writing Assignment with Cited Sources2: Hesiod and Shakespeare -- Jose Moctezuma3: Aeschylus's Prometheus and Shelley's Prometheus - Jose Moctezuma4: Mary Shelley's Modern Prometheus -- Jose Moctezuma5: Writing a Cause/Effect or Problem-Solution Essay About Unconscious Bias by Larnell Dunkley6: Annotation, Summary, Quoting, and Citation Using Two Studies of First Generation College Students by Jamison Spencer7: Writing the Classic Argument by Ukaisha Al-Amin8: Identifying and Learning about Logical Fallacies By Ukaisha Al-Amin9: Managing a Research Project By Ukaisha Al-Amin10: Choosing a Research Topic By Ukaisha Al-Amin11: How to Start Research by Using Inquiry Based Research By Ukaisha Al-Amin12: Rhetorical Analysis of Visual Arguments By Ukaisha Al-Amin13: Writing Effective Research Questions By Ukaisha Al-Amin14: Discovering Experts and Examining Authority For Evaluation of Sources By Ukaisha Al-Amin15: Writing An Effective Research Proposal By Ukaisha Al-Amin16: Revising An Essay By Ukaisha Al-Amin17: Essay Structure Lesson 1 Delayed Thesis Type of Structures By Ukaisha Al-Amin18: Essay Structure Lesson 2 Researcher Centered Structure By Ukaisha Al-Amin19: Evaluating and Analyzing Different Types of Sources By Ukaisha Al-Amin20: Annotated Bibliographies By Ukaisha Al-Amin21: Integrating Sources Successfully Using MLA By Ukaisha Al-Amin22: Final Drafts of Research Essays By Ukaisha Al-Amin23: Orientation and Kairos by Viggy Alexandersson24: Reflexivity and Ethos by Viggy Alexandersson25: The Big Why and Pathos by Viggy Alexandersson26: Research Question and Logos by Viggy Alexandersson27: Aristotelian Argumentation Part 1 by Viggy Alexandersson28: Aristotelian Argumentation Part 2 by Viggy Alexandersson29: Aristotelian Argumentation Part 3 by Viggy Alexandersson30: Rogerian Argumentation Part 1 by Viggy Alexandersson31: Rogerian Argument