, often through reading and studying philosophers who have addressed these questions in the past, with appreciation of the historical and cultural contexts in which these questions are raised and answered. Philosophy courses help students to develop good logical and critical reasoning skills, expose hidden preconceptions, encourage open debate and independent thought, and provide opportunity to apply valuable insights gained to contemporary life. Major sub-fields of philosophy include metaphysics, epistemology, ethics, aesthetics, political philosophy, logic and philosophy of science. An Introduction to Philosophy (Payne)Introduction to Philosophy (OpenStax)Introduction to Philosophy - Philosophy of Mind (Salazar Ed.)Words of Wisdom - Introduction to Philosophy (Ondich)Modern Philosophy (Ott and Dunn)Introduction to Philosophy: Aesthetic Theory and Practice (Saito et al.)Philosophy Readings (Hagman and Nesse)Introduction to Philosophy Reader (Levin et al.)Ancient Philosophy Reader (Levin)Philosophy of Western Religions (Levin et al.)Introduction to Philosophy: Philosophy of Religion (Branson et al.)Philosophy of Religion (Picorino)Political Philosophy Reader (Levin et al.)South and East Asian Philosophy Reader (Levin et al.)Inferring and Explaining (Johnson)Introduction to Ethics (Levin et al.)Ethics (Fisher and Dimmock)Ethics in Life and Vocations (Whitman)Animals and Ethics 101 - Thinking Critically About Animal Rights (Nobis)Thinking Critically About Abortion (Nobis and Grob)Book: Metaethics from a First Person Standpoint - An Introduction to Moral Philosophy (Wilson)Introduction to History and Philosophy of Science (Barseghyan, Overgaard, and Rupik)A Concise Introduction to Logic (DeLancey)An Introduction to Formal Logic (Magnus)Sets, Logic, Computation (Zach)Fundamental Methods of Logic (Knachel)Introduction to Logic and Critical Thinking 2e (van Cleave)A Modern Formal Logic Primer (Teller)Logical Reasoning (Dowden)Critical Reasoning and Writing (Levin et al.)T