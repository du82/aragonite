gular and irregular verbs. The student will be familiarized with those features of Hispanic culture through authentic language and cultural products.Front MatterCapítulo 1 EmpecemosCapítulo 2 ¿Cuál es tu profesión?Capítulo 3 La familiaCapítulo 4 Mi casa es tu casaCapítulo 5 La metrópoliCapítulo 6 ¡Viajemos!Back MatterSpan 110: Elementary Spanish II Vivir en las Fronteras (Sanchez-Dominguez)A continuation of SPAN 100 with the main emphasis on the imperfect, preterit, and the present perfect forms for both regular and irregular verbs. The course continues teaching language acquisition in a cultural context through the four basic language skills: hearing, speaking, reading, and writing. Not open to students with native fluency in Spanish and to those students who have studied in a Spanish Speaking country. Course is conducted in SpanishFront MatterCapítulo 7- Breve repaso Span 100 e introducción Span 110Capítulo 8- Las modas van y vienenCapítulo 9- ¡La comida es deliciosa!Capítulo 10- Vida saludableCapítulo 11- ¿Qué hacemos por el medio ambiente?Capítulo 12- Sabes, ¿qué es la inteligencia artificial?Back Matter¡Español en Acción I!The beginning Spanish course is based on a contrastive analysis between Spanish and English and is designed to develop English-speaking students' rudimentary abilities in the four basic language skills: hearing, speaking, reading, and writing. The main emphasis is on the present tense of both regular and irregular verbs. The student will be familiarized with those features of Hispanic culture through authentic language and cultural products.Front Matter1: Capítulo 1 Empecemos2: Capítulo 2 ¿Cuál es tu profesión?3: Capítulo 3 La familia4: Capítulo 4 Mi casa es tu casa5: Capítulo 5 La metrópoli6: Capítulo 6 ¡Viajemos!Back Matter¡Español en Acción II! (Sanchez-Dominguez)Front MatterChapter 7: Capítulo 7 La vida cotidianaChapter 8: Capítulo 8 Vida saludableChapter 9: Capítulo 9 ¡La comida es deliciosa!Chapter 10: Capítulo 8 Las modas van y vienenC