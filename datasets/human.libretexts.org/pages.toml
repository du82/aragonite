s (including pronunciation). This text also includes an introduction to cultural aspects of the Spanish-speaking world.Front Matter1: Capítulo 1- Hola, ¿qué tal?2: Capítulo 2- En la universidad3: Capítulo 3- La familia4: Capítulo 4- Los pasatiempos5: Capítulo 5- Las vacaciones6: Capítulo 6- De compras7: Capítulo 7- La rutina diaria8: Capítulo 8- La comidaBack MatterMundo sin fronteras: Introducción a la lengua española - Español 102This course is a continuation to SPAN 101. Students work on further vocabulary and grammar skills, pronunciation, oral and listening skills, reading skills, and writing skills. This course also includes cultural aspects of the Spanish-speaking world not covered in SPAN 101 and/or expands on cultural aspects presented in SPAN 101.Front Matter8: Capítulo 8- La comida9: Capítulo 9- Las fiestas10: Capítulo 10- En el consultorio11: Capítulo 11- La tecnología12: Capítulo 12- La vivienda13: Capítulo 13- La naturaleza14: Capítulo 14- En la ciudad15: Capítulo 15- El bienestarBack Matter/*<![CDATA[*/{"MindTouch.IDF3.label.drag-n-drop":"Drag","MindTouch.IDF3.label.reveal.showAll":"Show all","MindTouch.IDF3.label.reveal.showLess":"Show less","MindTouch.IDF3.warning.page-order-limit-exceeded":"Sorry, there are too many child pages to safely reorder. The greatest number of children you can reorder on a page is {0}."}/*]]>*/ /*<![CDATA[*/window.addEventListener('DOMContentLoaded', function () { $('iframe').on('load', function () { $(this).iFrameResize({ warningTimeout: 0, scrolling: 'omit' }); }) })/*]]>*/ /*<![CDATA[*/ var front = "auto"; if(front=="auto"){ front = "Allan Hancock College"; if(front.includes(":")){ front = front.split(":")[0]; if(front.includes(".")){ front = front.split("."); front = front.map((int)=>int.includes("0")?parseInt(int,10):int).join("."); } front+="."; } else { front = ""; } } front = front.replace(/_/g," "); MathJaxConfig = { TeX: { equationNumbers: { autoNumber: "all", formatNumber: function (n) { if(false){ return front 