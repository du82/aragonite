["https://humanistculture.bandcamp.com/track/the-book-of-truth-time-wrote-the-rocks"]
title = "The Book of Truth (Time Wrote the Rocks) | Raymond Arnold"
description = """
The Book of Truth (Time Wrote the Rocks) by Raymond Arnold, released 17 November 2016

From desert cliff and mountaintop we trace the wide design,
Strikeslip fault and overthrust and syn and anticline. . .
Wegaze upon creation where erosion makes it known,
And\tcount the countless aeons in the banding of the stone.

Odd long vanished creatures &amp; their tracks &amp; shells are found
Where truth has left its sketches on the slate below the ground.
The patient stone can speak, if we but listen when it talks.
Humans wrote the book of earth...           
Time wrote the rocks...
\t
There are those who name the stars, who watch the sky by night,
Seeking out the darkest place, to better see the light.
Long ago, when isolation broke his weary will,
Galileo recanted, but the Earth is moving still.

High above the mountaintops, where only distance bars,
The\ttruth has left its footprints in the dust between the stars
We may watch and study or may   shudder and de-ny
Humans wrote the book of night…
Light wrote the sky
\t
By stem and root and branch we trace, by feather, fang and fur,
How the living things that are descend from things that were
The moss, the kelp, the zebrafish, the very mice and flies,
Tiny, humble, wordless things how shall they tell us lies?

We are kin to beasts, no other answer can we bring.
The\ttruth has left its fingerprints on every living thing.
Winnowed by an aimless game of birth and blood and strife.
Humans wrote the book of names...
Death wrote life
\t
And\twe who listen to the stars, or walk the dusty grade,
Or break the very atoms down to see how they are made,
Seek new stories, seek new song to better guide our hand,
The profoundest act of worship is to try to understand.

Deep in flower and in flesh, in star and soil and seed,
The truth has left its living word for anyone to read.
So turn and look where best you think the story is unfurled.
Humans write the book of truth...
Truth writes the world."""
