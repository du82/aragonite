title = "When I Die | Raymond Arnold"
description = """
When I Die by Raymond Arnold, released 06 June 2014

They may bury my body when I die
Near some graveyard I&#39;ll be found
Simply rotting in the ground
If they bury my body when I die

They may burn my body when I die
As that fiery furnace flashes
II&#39;ll be nothing more than ashes
If they burn my body when I die

They may use my body when I die
As the doctors ply their arts
I&#39;ll be in a hundred parts
If they use my body when I die

They may freeze my body when I die
Though I may well be mistaken
I would hope to reawaken
If they freeze my body when I die

They may eat my body when I die
If a zombie horde remains
They&#39;ll be hankering for brains
As they eat my body when I die.

I&#39;d prefer to never die at all
Cheating death is such a rarity
It would take a singularity
To permit we never die at all

They may bury my body when I die
Near some graveyard I&#39;ll be found
Simply rotting in the ground
If they bury my body when I die."""
