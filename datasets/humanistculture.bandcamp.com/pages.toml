["https://humanistculture.bandcamp.com/track/rehearsal-five-thousand-years"]
title = "[Rehearsal] Five Thousand Years | Raymond Arnold"
description = """
[Rehearsal] Five Thousand Years by Raymond Arnold, released 17 November 2016

A possible child,
Dreamin’ through the longest night
A possible smile,
Wakin’ to a distant light

A possible world,
Tell me what you wanna see.
Where’s that child going? Tell me,
Who’s that child gonna be?

In five thousand years…
(Whatcha wanna do, whatcha wanna see, in another)
Five thousand years…
(Where we wanna go, who we want to be, in another)
In five thousand years
If we boldly set our sight,
Journey through the coldest night
In five thousand years…

VERSE 2

We’ll build a brand new home,
Raise the glass domes high.
And in a century or three
Our children might look at the sky

And then at last they’ll see
That distant yellow sun.
The cradle of humanity,
And all the things we might become.

In five thousand years…
(Whatcha wanna do, whatcha wanna see, in another)
Five thousand years…
(Where we wanna go, who we want to be, in another)
In five thousand years…
If we sailed across the stars,
Unimaginably far
In five thousand years...

(Instrumental break)

And maybe good folk still might die,
But maybe not, we gotta try
I don’t quite know what shape we’ll take
I don’t quite know what world we’ll make

I don’t quite know how things might change
I don’t quite know what rules we’ll break
Our present selves may think it strange
But there&#39;s so many lives at stake

Oh, entropy is bearin’ down
But we got tricks of sticking’ ‘round.
And if our children see the day
That yellow fades to red then grey,

We’ll take a moment, one by one
Turn to face the dying sun
Bittersweetly wave good bye -
The journey’s only just begun....

In five thousand years…
(Whatcha wanna do, whatcha wanna see, in another)
Five thousand years…
(Where we wanna go, who we wanna be, in another)
In five thousand years…
When all that we once knew is gone,
Our legacy could carry on
In five thousand years.
Five thousand years…
Whatcha want to do, whatcha wanna see, in another
Five thousand years…
…..

Where we wanna go...
who we wanna be...?"""
