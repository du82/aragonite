["https://humanistculture.bandcamp.com/track/a-little-echo"]
title = "A Little Echo | Raymond Arnold"
description = """
A Little Echo by Raymond Arnold, released 06 June 2014

My heart is beating.
My breath is strong.
I’m walkin’, runnin’, dancin’, playin’.
Havin’ fun.

The wheels inside my mind are turnin’,
Thinkin’, feelin’, loving’, learning.
Wonderin’ what kind of person 
I’ll become.

And life ticks on,
And lives connect
And over time I
Collect a little echo
of your mind, and so, even
when we&#39;re separated
Even though it&#39;s not the same
It&#39;s sort of nice to same your name
And hear you whisper mine.

My heart is skippin’.
I take a nervous breath.
I finally see your face again.
It’s been so long since last you left.

I got a little metal circle
Hanging on my chest.
As we collide, and intertwine, 
It presses cold against my breast.

And life ticks on,
And lives connect
And over time I
Collect a little echo
of your mind, 
and so, even when we&#39;re separated
Even though it&#39;s not the same
It&#39;s sort of nice to same your name
And hear you whisper mine.

My heart is failin’
Breath is slow.
I’m lookin’, longin’, lovin’, wishin’
That I didn’t have to go.
I got a little metal circle
Hangin’ round my neck.
It’s got some little words inscribed,
The doctors doublecheck.

I don’t quite know if I’ll awaken.
Don’t quite know what shape I’d take.
I don’t quite know how things might change.
I don’t quite know what world you would make... 
...while I was gone.
I don’t quite know.
I don’t quite know how long.

And life ticks on,
And lives connect
And over time I
Collect a little echo
of your mind, 
and so, even when we&#39;re separated
Even though it&#39;s not the same
It&#39;s sort of nice to same your name
And hear you whisper mine."""
