description = """
Bitter Wind March by Raymond Arnold, released 06 July 2015

Little one, little one, bitter wind blown
Little one, little one, bitter wind blown

Little one, little one, bitter wind blown
Little one, little one, bitter wind blown


Sun barely rising above the horizon
