Grandma told me stories, &#39;bout life from way back when
Walking uphill both ways through the snow

Rugged people trudgin&#39; down the narrow path ahead
Going where their daddy said to go

Way back when, everything seemed simple baby
Some day soon, maybe it&#39;ll all make sense again
But here and now, got a world to explore
Got some riddles to unravel, baby
What&#39;chu waiting for?

Here and now, here and now
We got choices all around
Here and now, here and now
WE got int-er-est compound-ing
Taking things for granted tbat&#39;d shatter Newton&#39;s mind
What&#39;ll we find in to-morrow&#39;s here and now?

(8 bar Instrumental break)

Way back when, everything seemed simple baby
Some day soon, maybe it&#39;ll all make sense again
But here and now, got a world to explore
Got some riddles to unravel, baby
What&#39;chu waiting for?

Here and now, here and now,
We got pens instead of swords,
Here and now, here and now
Turning ploughshares into tract - ors
Taking things for granted,
Superstimulous galore, what&#39;s in
Store for tomorrow&#39;s here and now?

Way back when, everything seemed simple baby
Some day soon, maybe it&#39;ll all make sense again
But here and now, got a world to explore
Got some riddles to unravel, baby
What&#39;chu waiting for?

Here and now, here and now
(Here and now, here and now)
Here and now, here and now
(Here and now, here and now)

Here and now (here and now)
We got smallpox locked up tight
Here and now (here and now)
Brand new star wars out tonight!
Here and now, here and now
Gotta run and catch my flight
But I&#39;ll see you in tomorrow&#39;s here and now.

Here and now, here and now
We got robots driving cars
Here and now, here and now
Elon&#39;s colonizing mars

Here and now, here and now,
We got smart philanthropy,
With some scientific rigor,
And some metanalyses.

Way back when, everything seemed simple baby
Some day soon, maybe it&#39;ll all make sense again
But here and now, got a world to explore
Got some riddles to unravel, baby
What&#39;chu waiting for?
What&#39;chu waiting for?
What&#39;chu waiting for?"""
