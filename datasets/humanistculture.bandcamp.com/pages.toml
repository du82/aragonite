["https://humanistculture.bandcamp.com/fair_trade_music_policy"]
title = "Fair Trade Music Policy | Bandcamp"
description = "Bandcamp believes that music is an indispensable part of culture, and for that culture to thrive, artists must be compensated fairly and transparently for their work."
full_description = "Bandcamp believes that music is an indispensable part of culture, and for that culture to thrive, artists must be compensated fairly and transparently for their work. We’re proud of the fact that when you choose to pay an artist on Bandcamp, your money reaches them quickly, and in a way that is simple to explain and understand. Our business, which was founded in 2008, is based on taking a revenue share of sales. Our share is 15% on digital items, and 10% on physical goods. Payment processor fees are separate and vary depending on the size of the transaction, but for an average size purchase, amount to an additional 4-7%. The remainder, usually 80-85%, goes directly to the artist or their label, and we pay out daily. Since we only make money when artists make a lot more money, our interests remain aligned with those of the community we serve. It’s a straightforward approach, and one we’re happy to say works well. Fans have paid artists and independent labels $1.46 billion using Bandcamp, and $15.8 million in the past 30 days alone. Thank you for being a part of a fair, sustainable music economy!"
