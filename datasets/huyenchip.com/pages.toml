title = "Contact me"
description = "I help companies deploy machine learning into production. I write about AI applications, tooling, and best practices."
full_description = '''Contact me Email The best way to reach me is via email. I try to respond to every email. However, I tend to procrastinate on long/non-urgent emails, and sometimes forget to respond altogether. If I haven’t replied in a week, feel free to follow up. Social media I use social media, but don’t spend a lot of time on it. The services I use include: Twitter: I read Twitter DMs, but I find its inbox hard to use so please don’t use Twitter to reach me. LinkedIn: I read LinkedIn messages but I prefer emails. YouTube: I’m camera-shy, so I haven’t done a lot of videos. But I want to change that. Facebook: I publish my Vietnamese writing on my public page. I post random, infrequent life updates on my personal account. If we aren’t friends on FB, your message will go to Other folder and I don’t check that folder. Instagram: If I don’t follow you on Instagram, your message goes to a separate folder that I don’t check. tl;dr: follow me on social media but reach me via email. Scheduling Please send a calendar invite for any scheduled plans if I haven’t already. I may forget otherwise. Conclusion When it comes to communication, I’m systematic but not inflexible. This post is a reference to avoid misunderstandings, not a rule. Some of the best memories I’ve had are from spontaneous decisions. I’d love to have more free spirits and rulebreakers in my life. var disqus_config = function () { this.page.url = 'https://huyenchip.com/communication/'; this.page.identifier = 'https://huyenchip.com/communication/'; }; (function() { var d = document, s = d.createElement('script'); s.src = 'https://chiphuyen.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a>'''
