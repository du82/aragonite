["https://huyenchip.com/2020/12/30/mlops-v2.html"]
title = "Machine Learning Tools Landscape v2 (+84 new tools)"
description = "An analysis of 284 machine learning tools uncovered some interesting points about the MLOps landscape."
full_description = '''Machine Learning Tools Landscape v2 (+84 new tools) Dec 30, 2020 • Chip Huyen [Twitter thread] Last June, I published the post What I learned from looking at 200 machine learning tools. The post got some attention and I got a lot of messages from people telling me about new tools. I updated the old list to now include 284 tools. I’ll keep on updating the list as I find out about new tools. Any lead would be much appreciated! While looking for these MLOps tools, I discovered some interesting points about the MLOps landscape: Increasing focus on deployment The Bay Area is still the epicenter of machine learning, but not the only hub MLOps infrastructures in the US and China are diverging More interests in machine learning production from academia Click here to see the list in Google Sheets. To see a fancy interactive chart, scroll to the end of this blog post. 1. Increasing focus on deployment In the list of 284 MLOps tools, there are 180 startups. Out of these 180 startups, 65 raised money in 2020. Most startups that raised money in 2020 are in still in the Data pipeline category, with an increasing number of in all-in-one (end-to-end platforms), hardware, and serving. Here are further breakdowns on the most popular categories: Accelerators (building chips optimized for machine learning algorithms, often with a focus on data centers) AI Apps platform (end-to-end platforms for developing & deploying AI applications) Data management Monitoring Edge devices (building chips optimized for inference on consumer devices with low power) 2. The Bay Area is still the epicenter of machine learning, but not the only hub Among 65 MLOps startups that raised money in 2020, more than half of them are outside the Bay Area, with growing hubs in Boston, New York City, Israel. 10 notable MLOps startups outside the Bay Area that raised money in 2020: DataRobot - Boston - $320M: enterprise AI apps platform Graphcore - UK - $250M: chips for machine learning Dataiku - NYC - $100M: enterprise AI apps platform Hailo - Israel - $60M: chips for machine learning DefinedCrowd - Seattle - $50.5M: training data generation Zilliz - China - $43M: open-source software for processing unstructured data Starburst Data - Boston- $42M: distributed SQL query engine Anodot - Israel - $35M: enterprise data monitoring Materialize - Boston - $32M: stream processing Rasa - Germany - $26M: API for conversational AI This is an encouraging signals for people who want to build tools for machine learning production but don’t want to: succumb to the Bay Area monoculture and astronomical cost of living deal with American fickle immgration policies. It’s cheaper to find good engineers outside the Bay, and it might also be easier since you don’t have to compete with hundreds of tech giants and other startups for top engineers. 3. MLOps infrastructures in the US and China are diverging One term I saw while reading China-focused AI newsletters is “localization” (国产化替代) – replace foreign technologies with Chinese alternatives. Chinese companies use tools similar to what American companies use, but not quite the same. In the US, companies rely on Google Cloud, Amazon AWS for hosting services. In China, companies rely on Tencent Cloud, Alibaba Cloud. In the West, the Cloud Native Computing Foundation (CNCF) acts as the caretaker for container technologies including Kubernetes. In China, they have TARS Foundation for open-source microservices projects. One reason for a separate foundation is language barriers. Chinese engineers might fork a popular repo, modify it for their use, then either can’t merge back because they don’t know how to communicate with the maintainers in English, or don’t want to merge back because it’d take a lot of time. The list includes a few Chinese tooling startups, but it missed out so many because Chinese startups don’t get enough attention from the Western media. Many of them have their websites and documents only in Mandarin, which makes it hard to find information about them. 4. More interests in machine learning production from academia The AI research scene seemed to have calmed down in 2020 – Google freezed hiring for AI researchers, Uber laid off their entire AI research team, Element AI was sold for cheap. However, the ML production scene is still growing with more and more tools on the market. There’s also a growing interest in ML production even from academia. Here are some of the venues for those who want to learn about ML production in academia: Challenges in Deploying and Monitoring Machine Learning Systems workshop at ICML MLSys Seminars at Stanford Conference on Machine Learning and Systems The seemingly less steep curve from 2019 to 2020 is because a lot of companies that started this year are still in stealth. Click on a category to see the tools in that category. Click on the white space in the center to go up a level. Acknowledgment: Thanks Luke Metz for being a faithful first reader. I want to devote a lot of my time to learning. I’m hoping to find a group of people with similar interests and learn together. Here are some of the topics that I want to learn: How to bring machine learning to browsers Online predictions and online learning for machine learning MLOps in general If you want to learn any of the above topics, join our Discord chat. We’ll be sharing learning resources and strategies. We might even host learning sessions and discussions if there’s interest. Serious learners only! var disqus_config = function () { this.page.url = 'https://huyenchip.com/2020/12/30/mlops-v2.html'; this.page.identifier = 'https://huyenchip.com/2020/12/30/mlops-v2.html'; }; (function() { var d = document, s = d.createElement('script'); s.src = 'https://chiphuyen.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a>'''
