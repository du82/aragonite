["https://hxp.io/blog/106/hxp-CTF-2022-Secure-Flag-Dispenser"]
title = "hxp | hxp CTF 2022: Secure Flag Dispenser"
description = "hxp is a CTF team."
full_description = "Decompiling the binary immediately reveals strings BN_CTX_new and BN_new, hinting towards OpenSSL being statically linked into the executable image. OpenSSL lets us comfortably recover symbols by extracting function names, file names, and line numbers from run-time assertions and comparing with the structure of the code structure in source: The RSA parameters are (N, e) = (0x6878703c33796f753c336878700000000000000000000000009debf6dfc0d75203bde49a1f3ba3d949f08fa84b6d0a770f730306c32d179566544333df001dcf71d1030707aabf254b8777e1c9c0d857133d5ccabfa0232858588e17ba23dc2a34880ced41edb9f0814695e6ab4ba2d5fc758f431de65e8e34b508a1facda541, 0x309), which look suspiciously backdoored. The t.pcap file contains 777 tcp connections from either 42.226.106.30 or 92.243.26.60 to 42.226.106.54. The astute reader will notice two things: So lets think about what would happen on any connection attempt from either 42.226.106.30 or 92.243.26.60. Remember, the behaviour of the binary depends on whether the client connects from 🔒.hxp.io or from somewhere else. According to getnameinfo(3) the function is the inverse of getaddrinfo(3): it converts a socket address to a corresponding host and service, in a protocol-independent manner. It does so by performing reverse DNS lookups. So what do the two addresses resolve to? Hm … 42.226.106.30 doesn’t have a reverse DNS record set, but 92.243.26.60 resolves to 💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩.💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩.💩💩💩💩💩💩💩💩💩💩💩💩💩💩💩[...].kirschju.re . That doesn’t look right. Googling for punycode and OpenSSL immediately points to the Halloween 2022 OpenSSL CVEs CVE-2022-3602 and CVE-2022-3786. One of them allows to overflow a stack-allocated buffer inside OpenSSL with . (dot) characters. When inserting the values from the reverse DNS request into the vulnerable program, one can see that the randbytes variable at the very top (1680 bytes) of the tack stack frame gets overwritten by .s almost entirely. That means that we know the AES key used to encrypt the flag that is sent to the client!"
