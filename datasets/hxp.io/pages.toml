["https://hxp.io/blog/111/hxp-38C3-CTF-NeedForSpeed"]
title = "hxp | hxp 38C3 CTF: NeedForSpeed"
description = "hxp is a CTF team."
full_description = "hxp thanks philipp-tg and edermi for contributing this challenge. Read more about NFS on their blogpost. In case your UID is not 1337, you can still not access the files. You have to first either set your own UID to 1337, or use a NFS client which does that for you. I hope you enjoyed the memes and they reminded you times when NFS stood for something. The challenge sets up a VM using a default Debian 12 cloud image with the following cloud-init configuration (only important parts): Either by dumping the mounting process with Wireshark, or by reading up on how the NFS protocol works, we get an idea of the protocol. NFS works exclusively with file handles. A file handle consists of the root file handle (get when mounting) and a file specific handle (4 byte inode, 4 byte generation). Actually, the generation does not matter can you can just send 0-bytes, and locally the flag gets inode number a0720000. Just reading the flag then works. You’re done. Congratz. The flag is owned by root:shadow and per default it’s not possible to access files owned by root as root_squash [2] is enabled by default. Using the NFS3 function readdirplus [1], with the root file handle and the known file handle for /, we can get all file handles of all files and folders under /. This way we get the actual file handle for flag.txt and can therefore just read the file using the default NFS read instruction. (although reading /etc/shadow is not possible in this example, but we have seen it in the wild several times) Beerware: Members of hxp wrote the contents of this site. As long as you retain this notice, you can do whatever you want with this. If you and some team member meet some day, and you think this stuff is worth it, you can buy them a beer (or something) in return."
