["https://hxp.io/blog/21/Organizing-our-first-CTF"]
title = "hxp | Organizing our first CTF"
description = "hxp is a CTF team."
full_description = "As most of you probably know by now, we held our first CTF last weekend and with it there was a lot to learn for us. Since most (or probably even all) of our readers here are CTF players and organizers themselves, we thought it would be a nice touch to compile everything into a blog post to give all of you the chance to laugh about our stupid mistakes and maybe even learn something new. :) We actually picked the date for our CTF quite carefully. We used ctftime.org to choose a more or less free weekend, and at the time we did that, neither Hack.lu, EKOPARTY nor WhiteHat Grand Prix had been announced there. We know all those are linked to conferences so I guess there would have been a way to know that would happen. If someone knows a better source for this kind of information, please let us know so we can choose a better date next time. Since all of us are students we are more or less used to “ad-hoc decision making”. When we reached out to sponsors most of them were quite eager to work with us, but since we informed them only about a month prior there was no chance to get anything done in this time frame (most of them are large corporations with a lot of bureaucracy attached). We set ourselves some strict deadlines to finish the tasks and infrastructure so we would have it done around two weeks before the CTF. Well… Let’s phrase it this way: In the end the CTF was just around the corner and literally nothing was finished completely. Luckily we noticed that our productivity skyrocketed exponentially with the nearing real deadline; we jokingly called this “the curve of productivity” (while crying and coding in the corner). Two hours before the official start, all of our network connections suddenly got killed. After a bit of panicking our admin manged to contact a guy at LRZ (the “somewhat internet provider” for our university) and it turned out every host making more than 60 ssh connections within one minute gets kicked from the network. This was a real problem since we all used the same IP (we have a CTF network running here) and therefore were all blocked from our own infrastructure (which was in a different network). This is the reason why the CTF was delayed by one hour; luckily our admin managed to get someone to unblock us (which is quite hard on a Saturday here) so hooray to that! Also, shoutout to More Smoked Leet Chicken for pwning the scoreboard! (yeah, yeah, yeah, add a constraint to your challenges_solved table or use a mutex, I fucked this one up ;))"
