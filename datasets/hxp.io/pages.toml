full_description = "Inspired by https://eslam.io/posts/ejs-server-side-template-injection-rce/, who was able to exploit the ejs templating engine using prototype pollution. But this was fixed in ejs 3.1.7. Let’s investigate the current release. In his analysis, Eslam even scratches the possibility to overwrite options which are passed with data. He specifically mentions the delimiter in the context of abusing it for catastrophic regex. Several CMS systems or admin interfaces around the world offer users the option to customize their own e-mail, footer, headeer, … templates. So the use case to have untrusted templates is quite valid. Since the POST request redirects directly to the template without the delimiter, the default delimiter of % is cached and a later overwrite is not possible. If then accessing the site with delimiter=. set, the new delimiter will be used returning the flag in the template. Beerware: Members of hxp wrote the contents of this site. As long as you retain this notice, you can do whatever you want with this. If you and some team member meet some day, and you think this stuff is worth it, you can buy them a beer (or something) in return."
