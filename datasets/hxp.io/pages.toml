["https://hxp.io/blog/18/MMACTF-2015-Reversing-150-Impossible-writeup"]
title = 'hxp | MMACTF 2015: Reversing 150 "Impossible?" writeup'
description = "hxp is a CTF team."
full_description = 'The challenge consists of one 32-bit binary named impossible with a size of about 4k. Putting it into hex rays decompiles the program smoothly. The relevant parts (with slight adjustments to improve readability) are shown below: The program reads in up to 20 distinct numbers in ascending order, checks whether they are in the range $[2,10^6]$, computes the sum and the product of the numbers and checks if the sum equals the product. Don’t let yourself be confused by the HIDWORD and LODWORD macros, that’s just IDA’s way of telling us that 64bit arithmetic is being done on 32 bit numbers. If the values of sum and product match and we gave the program more than one number, we win. So, remember are looking for $m\in[2,20]$ distinct $n_i\in[2,10^6]$ such that \[ \sum_{i=0}^{m-1} n_i = \prod_{i=0}^{m-1} n_i \text. \] Mathematicians proved that the only solutions to the problem above ${(0, 0), (1, 1), (2, 2)}$ do not meet our requirements, so solving the problem above is provably impossible. … well, then, how the heck could the solve counter for the challenge be $>0$ at the time we started working on the task? Fair enough: The above equation omits the fact we’re not working on numbers of arbitrary precision. What we’re actually looking for is a solution to the congruence So the integer wrap-around is right there to rescue us. At this point, a long and cruel session of mindtorturing emerged and many ideas turned out to be totally useless until we had the final inspiration. Some observations: The following idea finally led to a solution: Once the wrap-around occurs, we want the resulting number to be as small as possible (see observation 1 above). This means that we need to construct a number with a very large gap between the first and the second 1 bits. Clearly, all numbers $2^x+2^y$ with $x$ large (as close as possible to and below of $64$) and $y$ small (as close as possible to and above $0$) satisfy this requirement. We thus started looking at numbers $2^n + 1$ with $n\in[0,63]$ to find the largest one consisting of prime factors all below $10^6$:'
