["https://hxp.io/blog/108/hxp-CTF-2022-shadertoy_plus_plus"]
title = "hxp | hxp CTF 2022: shadertoy_plus_plus"
description = "hxp is a CTF team."
full_description = "Teams are provided with a ShaderToy-like service which accepts GLES3.1 Compute shaders. Clients need to find a “0day” in the two main libraries — Google’s ANGLE and SwiftShader — and exploit it to pop a shell. For setting up the challenge, ANGLE is used for implementing GLES3.1 and SwiftShader is used for emulating shaders on the CPU. This setup is not much different from what WebGL could be on some browsers, and it has previously been shown to be an attack vector for browsers. The service does very little: setups a context, creates a texture to render to, gives a source of entropy (time), takes four shaders, renders them, converts them to PNG using fpng and finally sends them as base64-encoded data. When creating the EGL context, the client requests the EGL_CONTEXT_OPENGL_ROBUST_ACCESS_EXT extension which results in added validation of accesses in GPU programs and APIs. The ANGLE and SwiftShader projects are admittedly large, but it was not expected that one goes through all of the code and we had also prepared a series of hints for players: Seven hours into the CTF somebody already had an arbitrary read/write primitive, so we hold off from sharing hints. The shadertoy_plus_plus service really only receives shaders and this is the only attack vector: provide a crafted shader and exploit some bug in the chain. The attack surface of the compiler and shader runtime is huge: transpiler may be buggy, high number of type of accesses and something may be missed, buggy JIT, incompatible or incorrect order of compiler passes. The possibility of such a bug is increased by the fact that WebGL does not expose GLES3.1, and thus that code is likely a lot less tested. A feature, new in GLES3.1, is atomic counters. To use atomic counters, the client allocates an “atomic” buffer and accesses it from the shader using the atomic builtins (atomicCounterIncrement, …) at a specific offset. The access is not an array access, but the shader still can specify a buffer offset using the offset layout qualifier. This design bypases the ClampIndirectIndices pass from earlier and access sanitization is left to SwiftShader. Interestingly, SwiftShader also does not perform sanitization for atomic accesses."
