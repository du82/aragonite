["https://hxp.io/blog/118/hxp-38C3-CTF-suboptimal_pwning"]
title = "hxp | hxp 38C3 CTF: suboptimal_pwning"
description = "hxp is a CTF team."
full_description = "The challenge offers a remote service where one can provide their SUBLEQ program to be emulated using the interpreter from [1]. The interpreter has an obvious buffer overflow during program input and program emulation for accesses to the buffer mem. The goal of the challenge is to submit a SUBLEQ program that obtains the flag from the filesystem. SUBLEQ [3] is a popular single-instruction abstract instruction set [2] that has a single instruction that handles subtraction of values in memory, handles jumps to new memory addresses, and handles input and output for a given memory address. For more details on the SUBLEQ instruction set, [3] gives a good overview. Normally, the exploit for this challenge would be fairly simple since the mem buffer is allocated on the stack and there’s an arbitrary read and write to stack memory. The typical exploit would be to obtain a libc pointer from stack memory and modify its value to a one-gadget [4], that would then give a remote shell on ret. The challenge is made more difficult by enabling a plethora of clang compiler hardenings for the binary, that can be seen in the provided Dockerfile.build. I suggest searching the compiler flags on the internet for more details. The more impactful compiler flags are fsanitize=address (AddressSanitizer) and fsanitize=integer (UBSan subset) that add runtime compiler checks for memory accesses and integer arithmetic for the built binary [5] [9]. ASAn instruments the binary program to catch near out-of-bounds accesses to the mem buffer by surrounding the buffer with red zones and using reference shadow memory to determine if the access is allowed. The instrumentation also has the mem buffer to be allocated via __asan_stack_malloc_10 that results in the buffer be allocated in mmap-region instead of the stack. The UBSan-integer checks catch signed integer wrap-arounds and other unintended or undefined behavior [9], that also made the exploit more unstable. Since the mem buffer is in the mmap region and there’s no explicit randomization for mappings in the mmap region, except for the mmap region base, the relative offsets between mem and libc can be hardcoded. Note that there may still be noise in the relative offset value due to the behavior of the address space allocator, but the noise is still relatively small (8 bits?). For testing with ASLR disabled, the relative offset of 23531488 touches exactly the base of the libc image when run in the docker container."
