["https://hxp.io/blog/120/hxp-38C3-CTF-hack4"]
title = "hxp | hxp 38C3 CTF: hack4"
description = "hxp is a CTF team."
full_description = "The challenge gives one access to a QEMU VM running a modified AMD64 CPU - the hack4 - with an extension for supporting “AI operations” on a dedicated “AI engine” - the AI1337. The goal of the challenge is to exploit bugs in the QEMU implementation for emulating the hardware to escape the QEMU VM. For understanding the hardware architecture changes better, there’s a provided manual - hxp_ai1337.pdf - in the challenge that documents the hardware architecture. The end goal of the challenge is to use the stack use-after-free (flaw 5) to create a ROP-chain on the QEMU stack to gain code execution and spawn a shell. Unfortunately, the scratch memory size is not configured to be large enough to cover the used stack frames of the QEMU thread. To achieve this, the exploit needs to increase the slice size and slize count, but this operation is done via wrmsr to Model Specific Registers that is a privileged operation and the VM environment only provides a non-privileged user shell. Normally, only the AI1337 engine can make use of the virtual memory scratch hole since the “access_enabled” state is only turned on during the execution of the specialized AMD64 instructions for interacting with the AI1337 engine. However, Flaw 4 allows one to keep the “access_enabled” state on, which will cause any memory access, that falls into the scratch virtual memory region, to be served from scratch memory. Combining flaws 1, 2, 3 and 4 allows the user to relocate the scratch memory region to any virtual address and have any user process or kernel access the global memory for any memory access - instruction or data fetches. The /init process is a suitable target because it runs as root and busybox is not built with image base randomization enabled (PIE). The below exploit overlaps the scratch hole region with the code handling the umount code, that gets executed during /init teardown, then writes shell-spawning code and finally calls exit. The exit call will return execution to the /init script that will call umount in busybox, that will then result into spawning a root shell. This is the first stage of the exploit that results into getting a root shell."
