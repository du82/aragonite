["https://hxp.io/blog/16/CONFidence-CTF-2015-Reversing-400-Deobfuscate-Me-writeup"]
title = 'hxp | CONFidence CTF 2015: Reversing 400 "Deobfuscate Me" writeup'
description = "hxp is a CTF team."
full_description = "A delegation of the H4x0rPsch0rr team spent a weekend in the awesome city of Kraków and participated in the even more awesome CONFidence CTF organized by the DragonSector team (thanks for the invitation!). Out of the numerous challenges that were opened up during the CTF, no team was able to solve a reversing task called “Deobfuscate Me” which was worth 400 points. After the competition task authors presented their sample solutions which, in case of this task, consisted of incrementally measuring differences in the execution traces of the challenge depending on the user input. However, we wanted to show that it was also possible to leverage symbolic execution in combination with a SMT solver to solve the challenge. Our (somewhat tedious) approach is described in this writeup. The challenge is a classical reversing task which simply asks the user for input, performs several checks on it and finally outputs whether the input was correct. Of course, the correct input would then be the flag. As you can see from the dummy input the flag format was known a priori, a fact that decreased the time needed to solve several tasks substantially. The same applies to this challenge, as we will see later. The interesting part is the function check, where the binary verifies the user input. We quickly associate the name of the task with what we are presented with by check: The code is heavily scattered. Assuming that the chain of jmp instructions continues in this pattern and that all code snippets are position independent (i.e. do not reference constants or strings relative to their own position), this is nothing a small python script and Capstone cannot deal with: By quickly patching the deobfuscated blob into the original binary using dd and executing the patched binary we see that apparently we didn’t break it too badly: Aaaaargh. Even though we’ve seemingly successfully removed the jumps the code still is close to impossible to read. We see tons of xchg instructions, many of which are garbage (the actual user input resides on the stack, the function nevertheless starts to immediately read undefined registers), and lots of arithmetic operations using cryptic constants. The return value should in theory be written to eax in the function epilogue but, again, the xchg instructions make it impossible to track the final value back through the remaining 40k of machine code."
