["https://hxp.io/blog/22/9447-CTF-2015-crypto310-Fibbed-writeup"]
title = 'hxp | 9447 CTF 2015: crypto310 "Fibbed" writeup'
description = "hxp is a CTF team."
full_description = 'In this challenge, we were given the source code of a server and client along with a network dump generated from letting those communicate. The description reads: The protocol consists of a Diffie-Hellman-style key agreement, only the underlying operation seems to have been changed. Carefully reading the code shows that the computation is performed in the ring of $2\times 2$ matrices over a finite field using a Montgomery ladder algorithm, so we have to find a way to solve the Diffie-Hellman problem in these (in fact, we will even compute logarithms). Hence, if we are able to compute the private exponent $x$ from the public (i.e. contained in the network dump) matrix $A^x$, we can simply compute the shared secret $A^{xy}$ and decrypt the flag. We let $B\in(\mathbb Z/p)^{2\times 2}$ denote the matrix $A^x$ obtained from the packet dump, hence our task is to compute the logarithm $\log_A B$ in $(\mathbb Z/p)^{2\times 2}$. If we could diagonalize the matrix $A$, that is, obtain an invertible matrix $S\in(\mathbb Z/p)^{2\times 2}$ such that $S^{-1}AS$ is a diagonal matrix, then also $S^{-1}BS$ is a diagonal matrix and the exponentiation acts coefficient-wise, so we could compute the logarithm on the coefficients of the diagonalized matrices. By “exponentiation acts coefficient-wise”, we mean that for all $2\times 2$ diagonal matrices and exponents $e$, \[ \begin{pmatrix}a&0\\0&b\end{pmatrix}^e = \begin{pmatrix}a^e&0\\0&b^e\end{pmatrix} \text. \] Moreover, if $S$ is an invertible $2\times 2$ matrix such that $S^{-1}AS$ is diagonal (hence $S^{-1}BS$ is), then $A^x=B$ if and only if $S^{-1}A^xS=S^{-1}BS$ if and only if $(S^{-1}AS)^x=S^{-1}BS$, and this means we can compute the logarithm on the diagonalized matrices’ coefficients. However, this is not immediately possible: $A$’s characteristic polynomial \[ \chi_A=\xi^2-\xi-1 \] is irreducible over $\mathbb Z/p$, hence $A$ has no eigenvalues in that field. But we can transition to an extension field in which $A$ is diagonalizable: Over the field \[ F\;:=\;(\mathbb Z/p)[\xi]/\chi_A \;\cong\; \mathbb F_{p^2} \text, \] the matrix $A$ does have distinct eigenvalues, namely the images of $\xi$ and $\xi^p$ in $F$.'
