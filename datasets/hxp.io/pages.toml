["https://hxp.io/blog/104/hxp-CTF-2022-hypersecure-writeup"]
title = "hxp | hxp CTF 2022: hypersecure writeup"
description = "hxp is a CTF team."
full_description = "The challenge implements a hypervisor (HV) based on AMD SVM 1 to sandbox a 4K-large program. The goal is to escape the sandbox (VM-escape), and then read the flag. Let’s briefly go through the HV implementation. At a high level, the module creates a VM context at load time, receives a 4KiB raw binary from userspace, and then executes it from within the sandbox. For context creation, the HV setups the two-stage translation tables — Guest Page Table (GPT) and Nested Paged Table (NPT) — where GPT is controlled by the VM and the NPT only by the hypervisor. The NPT maps 4 x 4KiB of Host Physical Memory into the Guest Physical Address space, and the GPT maps 2MiB of contiguous Guest Physical Memory but only first 16KiB would be accessible (rest will cause NPT fault). The HV setups the Virtual Machine Control Block (VMCB), a block which contains the Control Area and Save Area. The Control Area is intended for directing the CPU Firmware on what’s necessary for the HV for correct and secure virtualization of the VM. This includes information opaque to the VM: what instructions or state changes must be intercepted by the HV, exit information on VM-exit, TSC-management, pointer to the NPT, etc. The Save Area contains CPU context state which gets loaded on entering the VM, and used for storing VM state on exiting the VM. The area contains the RAX, …, RIP, …, CR0, …, segment registers, etc. Similarly, the HV’s state is stored into an area, called HSAVE, pointed to by the HSAVE_PA MSR. The format of the HSAVE area is implementation-defined, but QEMU reuses the same format as the VMCB Save Area 3. When setting up the Control Block, the HV marks instructions for interception: hlt, vmmcall, vmrun, IO access, MSR access, etc. If IO access were allowed, the VM could potentially attack the HV via some device, read the flag off disk, etc. For this, the HV setups a block of memory — IO Permission Map (IOPM) — and writes the blocks’s physical address into the IOPM_BASE_PA field. Each bit specifies if the IO address is intercepted. All bits are set, and thus all IO operations are intercepted."
