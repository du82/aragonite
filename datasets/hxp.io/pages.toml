["https://hxp.io/blog"]
title = "hxp | CTF team"
description = "hxp is a CTF team."
full_description = '''hack1: MSC, CRY (625 points, 7 solves) hack2: MSC, PWN (769 points, 4 solves) hack3: PWN, MSC (833 points, 3 solves) Here we explain the intendet solution for the web challenge Fajny Jagazyn Wartości Kluczy from our recent CTF. This challenge consisted of a PHP frontend and two Python backends for a simple note-taking application. Some PHP quirks lead to request smuggling, and unexpected (?) Unicode normalization gives us the flag. It is a Rust binary using x11rb to move around windows on the screen and display a flag in plain sight. Here we explain the intended solution for the cryptography challenge alcoholic_variety from our recent CTF. The goal of the challenge was to solve a discrete-logarithm problem on a mysterious abelian variety given in terms of its addition formulas in a high‑dimensional projective space over a finite field. Teams are provided with a ShaderToy-like service which accepts GLES3.1 Compute shaders. Clients need to find a “0day” in the two main libraries — Google’s ANGLE and SwiftShader — and exploit it to pop a shell. In this challenge, you could write one byte to an arbitrary kernel address (even those marked read-only, as long as it is not mapped as executable). This leads to a full compromise of the kernel, even without a KASLR leak. This challenge was a text-based adventure game implemented in LaTeX3 (maybe known to some as expl3). The goal is simple: to get the flag, win the game. Here we explain the intended solution for the cryptography+reversing challenge the_swirl from our recent CTF, which no team managed to solve during the competition. The goal of the challenge was to break a Ring‑LWE key-encapsulation mechanism (KEM) by exploiting leakage from a botched NTT‑based implementation of the multiplication in the underlying polynomial ring $R = \mathbb F_q[X]/(X^{256}+1)$, where $q=11777$. Here's a very short summary of the ideas behind the cryptography challenge not_csidh from our recent CTF. I wanted to get this out soon after the end of the CTF, but I didn't manage to finish a proper writeup in time, so it's bullet points for now (or maybe forever, depending on how things go 😬).'''
