["https://hxp.io/blog/112/hxp-38C3-CTF-HaRlEm-ShAkE"]
title = "hxp | hxp 38C3 CTF: HaRlEm ShAkE"
description = "hxp is a CTF team."
full_description = "It is a Rust binary using x11rb to move around windows on the screen and display a flag in plain sight. We’ll go directly into the main method and see some setup until we arrive at a long list of function calls to sub_942E0 with changing parameters. Analyzing sub_942E0, we first see a hardcoded key 91b16ca0da5d332cb9909596be5f6918f0e11956f55685f111d105c4a5ec5f58 as well as a string Stop patching pls :(. This is triggered if we patch the given blobs of data passed to the function or the key itself so the decryption fails. Starting the program changes the position and size of all X11 windows. I’m running on Sway, so that doesn’t affect me, but we can also skip that call in the debugger. We then set a breakpoint in sub_942E0 and let the program decrypt the image for us. The first image a { character. We know all offsets as seen in the screenshot above. We also know the key, and the constant expand 32-byte k gives us a hint we might be using using Salsa20/ChaCha20. 12 bytes nonce length are default for ChaCha20, so let’s just try ChaCha20-Poly13051 and it works out of the box. The first image decodes correctly. Now we automate it for all character-images and place them to the wanted positions (which are also passed into sub_942E0). We also found this string in the binary: Screen too small :(, min size 1900 x 900. These values we use to create our image. What the program actually does is putting all character images together into one big image and then sending this image to the XServer creating a clickable region. Meaning: You can click through everything except the characters itself. You might have seen this when hovering over certain areas that “randomly” your mouse changes when harlem_shake is running. Using tools like XScope, or adding logging in XServer, you can just read out the requests and get the flag. Beerware: Members of hxp wrote the contents of this site. As long as you retain this notice, you can do whatever you want with this. If you and some team member meet some day, and you think this stuff is worth it, you can buy them a beer (or something) in return."
