["https://hxp.io/blog/105/hxp-CTF-2022-browser_insanity-writeup"]
title = "hxp | hxp CTF 2022: browser_insanity writeup"
description = "hxp is a CTF team."
full_description = "The challenge targets the WebView browser in the KolibriOS project. The KolibriOS user (infra) will visit an html page you provide. The goal is to provide a crafted page which exploits a “0day” vulnerability to exfiltrate the flag at /hd0/1/flag.txt. The browser supports basic HTML rendering and a few image formats. The image parsers are an excellent starting point: quite a few formats (13) and all implemented in x86 assembly. AFL++ is an ideal candidate for searching for bugs in such code: setting up a harness is simple, QEMU mode can be trivially enabled when static instrumentation is not possible, and fuzz corpuses for image formats are widely available. A super simple approach found 90 “unique” crashes in 16 hours of fuzzing. IIRC, there were all kinds of bugs in all of the parsers: null ptr derefs, buffer overflows, interger wrap arounds, random-looking access. Unfortunately, I couldn’t really exploit any of these or just lost patience knowing they will be something simpler. There’s a buffer overflow when handling HTML tags. The overflow happens in file programs/cmm/browser/TWB/parse_tag.h in _tag::parse. Since there is no zero byte at the end of name and prior is immediately after name, this leads to an infinite strcpy. This turns out to be well-exploitable in KolibriOS because most of memory is mapped as RWX and the instruction is a little after the tag object. When the rep prefix is overwritten, the instruction will be re-fetched and executed. The exploit turns out to be fairly simple: overwrite with a relative-jump opcode to jump into the provided payload, payload reads the file and connects to a remote server to send the flag. Debugging KolibriOS was a tiny bit painful: file format was custom, OS itself was buggy, no image with symbols, DEBUG debugger barebone and buggy. For debugging, I ended up employing th technique: Beerware: Members of hxp wrote the contents of this site. As long as you retain this notice, you can do whatever you want with this. If you and some team member meet some day, and you think this stuff is worth it, you can buy them a beer (or something) in return."
