full_description = '''hxp is a group of exceptionally good-looking hackers who joined forces as a CTF team called "H4x0rPsch0rr" sometime in the early 2010s originally in Munich, Germany, although some of us have since a̶s̶c̶e̶n̶d̶e̶d̶ moved to b̶e̶t̶t̶e̶r̶ other places. As we've semi-successfully explained to various people countless times, our original name was a pun on a certain Bavarian brewery that nobody has ever heard of, so at some point we got fed up with trying to explain the unexplainable and pronounce the unpronouncable. That was when the name was shortened to the current "hxp" — and G̶o̶d̶ everyone saw that it was g̶o̶o̶d̶ a little bit better. Internationally, we are renowned for being a total failure in (including, but not limited to) attack-defense CTFs, our remarkably stupid jokes, and our habit of seeking the proximity of Polish CTF teams in order to leech some of their booze and 1337 h4x0r sk1llz. As of recently, it seems to pay off: For some reason, we have (to our own and everyone else's surprise) apparently developed a pleasant tendency to qualify for on-site CTFs in Asia, which led to an increased appreciation of East Asia's amazing cuisine (including, but not limited to, duck tongue and jellyfish), as well as the discovery of some of our team members' inexplicable knowledge of (a few) Chinese characters. We are also notorious for organizing our own CTF, creatively named after ourselves. Since we apparently need this, here's our manifesto: (1) no bullsh_t, and (2) please hack. Beerware: Members of hxp wrote the contents of this site. As long as you retain this notice, you can do whatever you want with this. If you and some team member meet some day, and you think this stuff is worth it, you can buy them a beer (or something) in return.'''
