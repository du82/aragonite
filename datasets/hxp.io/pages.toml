["https://hxp.io/blog/116/hxp-38C3-CTF-wreckme_again"]
title = "hxp | hxp 38C3 CTF: wreckme_again"
description = "hxp is a CTF team."
full_description = 'When initially opening this challenge with the decompiler of your choice you are greeted by some magic constants and many similar loops. The application to an integer value and subsequent usage suggests the constants to be part of some isomorphic or at least homomorphic mapping between possible integer representations. This construction with these constants indeed is used to switch between base 2 and base -2. Thus the sign of each position flips between + and -. We can compare signed integer numbers represented in base 2 and base -2 using the following table One can clearly see that for values between 5 and -8 there is a 1-to-1 mapping between both representations. Using a bit of python we can verify that 7 maps to -9 and 6 to -10. We conclude that both representations agree modulo 16. With this knowledge we can deduce that the loop performs addition of v8 and v9 with the result computed in v4. After checking some initial properties on the input (e.g., starts with “hxp{” and ends with “}”) there is a loop with some more intricate processing: IDA already warns us that v41 is potentially undefined. Therefore, we should take a close look at both these functions. As these function are full of vector intrinsics, I suggest to simply sample different inputs and outputs. sub_1B60 does wide multiplication and sub_2130 appears to be a div-mod implementation. Luckily IDA is well equipped to handle these kind of functions, even in the free version. You can read up on it in Igor’s tip of the week #107. In short, you need to define a struct and then adjust the function signature. This construction iterates over the subgroup generated by 0x5d58aad of the multiplicative group of $\mathbb{Z} / 541923743\mathbb{Z}$ starting from 0xfd2dd6. Note that the input is treated as base -2, therefore this adjustment is applied to all digits and most special characters. The final loop in main performs a memcmp, so sub_14c0 transforms the input in some way. Understanding this will yield the flag.'
