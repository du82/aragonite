["https://hxp.io/blog/110/hxp-38C3-CTF-alcoholic_variety-writeup"]
title = "hxp | hxp 38C3 CTF: alcoholic_variety writeup"
description = "hxp is a CTF team."
full_description = 'Here we explain the intended solution for the cryptography challenge alcoholic_variety from our recent CTF. The goal of the challenge was to solve a discrete-logarithm problem on a mysterious abelian variety given in terms of its addition formulas in a high‑dimensional projective space over a finite field. The task consisted of a simple Python script vuln.py, which implements a standard double-and-add ladder for scalar multiplication in an (additive) group and asks the user (i.e., you!) to compute the corresponding discrete logarithm in no more than 10 minutes: The real core of the challenge, however, is a 2 MB Python file formulas.py, which looks somewhat as follows (with very repetitive parts omitted): Judging from the normalize() function, it does look like we are dealing with a projective situation: Rescaling all the coordinates by the same constant yields the same point. Therefore everything "lives" inside of the 9‑dimensional projective space $\mathbb P^9$ over the finite field $\mathbb F_p$. Moreover, it can quickly be verified that add() indeed performs an operation that behaves like an addition (associative & commutative), with neutral element zero. Therefore we are dealing with an abelian variety, which is the proper name for algebraic varieties carrying an algebraic group structure. The instances of this concept that are the most familiar to CTF players should be elliptic curves and Jacobians of hyperelliptic curves. In this case, however, the given abelian variety looks nothing like those more standard cases: Indeed, all we have is the zero point, a base point, and an addition formula, but not even the equations for the variety are given. ...involves looking for multivariate polynomials that vanish simultaneously at all known points of the variety. Since we have the addition formulas and a base point of presumably large order, sampling lots of random‑ish points should be easy: Simply start from zero and keep add()ing the base point to it to obtain a large number of points.'
