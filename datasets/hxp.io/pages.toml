["https://hxp.io/blog/90/hxp-CTF-2021-includers-revenge-writeup"]
title = "hxp | hxp CTF 2021: includer's revenge writeup"
description = "hxp is a CTF team."
full_description = "As promised here is a writeup of the includer’s revenge challenge exploiting the additional fastcgi_buffering / readfile local file inclusion vulnerability. It’s clear that we again have a (hard?) LFI PHP task via include_once($_GET['file'] ?? 'index.php'). Additionally, the challenge seems to contain a suspicious readfile branch in the otherwise aesthetically pleasing minimal appearance. Let’s use this feature to write a file with attacker-chosen content in order to get code execution. readfile is a neat PHP function that: “Reads a file and writes it to the output buffer.” Contrary to include, it also supports reading URL streams like http:// resources and directly writes them to the output buffer. readfile and fastcgi_buffering seems to only create a file when the client is connected via HTTP/1.0 (see curl part in exploit). Otherwise, chunked transfer can be used. Including the new file via our friend procfs (🤎) e.g /proc/$NGINX_WORKER_PID/fd/$FD only works within a very small time window and requires a lot of luck (or a lot of violent force). If we’re too slow, PHP’s include resolves this path to strings like /var/lib/nginx/fastcgi/4/01/0000000014 (deleted), which doesn’t exist in the filesystem. Luckily the logic in include can be confused via /proc/self/fd/$NGINX_WORKER_PID/../../../$NGINX_WORKER_PID/fd/$FD (thanks @hlt for this trick!), which will make it always interpret the content of the original file. This trick greatly reduces the amount of luck/force needed to make this exploit work reliably and quickly. Note: This race can also be won without confusing include, see pasten’s includer’s revenge + counter writeup. Beerware: Members of hxp wrote the contents of this site. As long as you retain this notice, you can do whatever you want with this. If you and some team member meet some day, and you think this stuff is worth it, you can buy them a beer (or something) in return."
