["https://hxp.io/blog/113/hxp-38C3-CTF-phpnotes"]
title = "hxp | hxp 38C3 CTF: phpnotes"
description = "hxp is a CTF team."
full_description = 'This challenge consisted of a PHP frontend and two Python backends for a simple note-taking application. Some PHP quirks lead to request smuggling, and unexpected (?) Unicode normalization gives us the flag. Initially, one might want to query the flag directly, but the frontend will not allow such a request. Each note has an ID (corresponding to its filename) that consists of 16 random hex-encoded bytes, and the frontend (in Backend::check) validates that the note IDs that we request actually follow this format. From the challenge linked in the description, we learn that passing unsanitized user input as HTTP headers into PHP’s stream_context_create allows request smuggling. However, in this challenge, our control over the headers is significantly lower: the only injection point we have is the JWT from the auth cookie, which is validated by the firebase/php-jwt package before it is actually forwarded. In general, a JWT consists of three URL-safe base64-encoded segments joined by .: The header is a JSON object containing metadata about the token (e.g., the signature algorithm that was used). The claims are a JSON object containing the token’s actual payload (e.g., the expiry time, logged-in username, etc.). Finally, the token contains a cryptographic signature or MAC over the header and claims, to verify that it was not tampered with. Depending on the use case, this can be symmetric or asymmetric cryptography; here, the final entry is a 2048-bit RSA signature over the SHA256 hash of the data (RS256). Since the signature is computed over the raw header and claims, modifying either of these is out of the question. Therefore, we need to modify the signature in a way that leaves it valid. But since the actual cryptography is performed using OpenSSL, and OpenSSL is generally sane[verification needed], there should be no useful RSA tricks here. Instead, let us take a look at the code that does the actual verification (in Firebase\JWT\JWT::decode): Here, urlsafeB64Decode just adds the missing base64 padding, replaces - and _ with + and / respectively (switching from the “URL-safe” alphabet to the default alphabet), and calls PHP’s builtin base64_decode.'
