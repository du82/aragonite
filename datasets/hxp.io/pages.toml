full_description = 'Let’s face it, this “hacking” hobby of yours can be quite daunting at times. How about you get out your Gameboy and have some fun instead? Note: You’re looking for a Gameboy Advance game. Replace < and > by { and } before submitting your flag. In this challenge we’re presented with a compiled version of the Visual Boy Advance emulator. When trying to open any (legally owned) ROM image of a game, we’re greeted with the following error message, indicating that we’re dealing with a modified version of the emulator: Decompiling the binary and searching for references to the string of the error message, we find a suspcious looking check in the pseudocode: Digging a bit more, we find familiar-looking pieces of code and data (for example sub_14076D050, xmmword_14106A8B0, state initialization at loc_14076FF98, …) that we quickly recognize as a SHA-1 implementation. Making an educated guess that the SHA1 input is probably the loaded ROM file, and converting the magic constants to a proper hash a quick internet research reveals that the check can be satisfied by loading a copy of Pokemon Leafgreen (Revision 1). This is a game for which source code has been almost fully restored by the pret project, which obviously simplifies our reversing efforts substantially. To understand what happens inside the emulator when loading the correct ROM file, we inspect the function with the lockdown error code (sub_14076FED0) a bit more. The prologue makes use of some global variables: We can recover meaningful names surprisingly easily by compiling a copy of the Visual Boy Advance source code and comparing the debugging-symbols-enhanced binary to the challenge binary (this also works well when comparing across operating system versions). Finding the right functions to match is again conveniently made possible by following string references (such as, for example, "Error opening image %s"). This way we are able to identify sub_14076FED0 as CPULoadRom, and steal some rather useful global variable names (such as g_rom, and g_workRAM):'
