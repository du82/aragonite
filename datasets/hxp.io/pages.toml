["https://hxp.io/blog/13/Boston-Key-Party-2015-Reversing-300-Community-College-fredkin"]
title = 'hxp | Boston Key Party 2015: Reversing 300 "Community College" / "fredkin"'
description = "hxp is a CTF team."
full_description = "file fredkin fredkin: ELF 32-bit LSB executable, MIPS, MIPS-II version 1 (SYSV), dynamically linked (uses shared libs), for GNU/Linux 2.6.32, BuildID[sha1]=2204905041c5ddc8a13ab816a6421daf0870b6a0, stripped MIPS? Ooooh, well … Firing up IDA and loading the binary we’re greeted by a relatively complex main function calling several other functions (who’d have guessed this?). The following is the prologue: We immediately are able to spot several ABI concepts we’re familiar with from other machine architectures: The $sp register is a stack pointer which gets decremented at the beginning to make space for local variables. After saving some registers on the stack, the frame pointer gets initialized to point at the top of the current stack frame to be able to reference local variables relatively to a fixed address (rather than having to worry about the current value of $sp). Nothing fancy here. The sixth instruction loads the $gp register with an offset which is later used to point into the global offset table where all externally imported functions reside. The value 0x4235c0 thus will be important once we worry about determining what library functions are called by the program. The offset is then stored in a variable gp_base on the stack for later use. The next part shows part of the calling convention used by gcc on MIPS: Function arguments are passed in the $aX registers, which are immediately saved in the local stack frame by the callee to make them persist nested function calls. We can see how argc and argv (always the first and second the second argument of main) are written into the stack frame and how argc is checked being equal to 2. If equality holds, the processor jumps to loc_404a14 omming the assembly block that informs us about the proper usage of the program (./fredkin flag). This block loads argv[1] into $a0 and passes it as an argument to strlen. How do I know about the latter? Looking up the symbol at virtual address 0x4235c0-0x7d54 (gp_base - offset used by the third lw instruction) gives us the name of the library function. We’ll use this technique from now on to resolve the names of all calls to libraries. After strlen returns, the result is stored on the stack and a counter is initialized to zero using the constant zero register $zero."
