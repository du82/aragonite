["https://hxp.io/blog/117/hxp-38C3-CTF-hack1-hack2-hack3"]
title = "hxp | hxp 38C3 CTF: hack1, hack2, hack3"
description = "hxp is a CTF team."
full_description = "hack1: MSC, CRY (625 points, 7 solves) hack2: MSC, PWN (769 points, 4 solves) hack3: PWN, MSC (833 points, 3 solves) The “hack-1” to “hack-3” is a series of challenges on hacking platforms with enabled memory encryption. There’s a wide variety of memory encryption technologies available, but among the more widely available and researched is the family of memory encryption features from AMD [1]. There are plenty from AMD - Secure Memory Encryption (SME) [2], Secure Encrypted Virtualization (SEV) [2], SEV-Encrypted State (SEV-ES) [3], SEV-Secure Nested Paging (SNP). Today, these features seem to be limited to the AMD EPYC product line. The hack challenges emulate selected parts of the memory encryption solutions using QEMU based on publicly available research papers. The hack-1 challenge covers the limitation of memory integrity and weak block cipher mode in the first version of AMD SEV implementations (AMD EPYC 7251). The hack-2 challenge covers the limitation of confidentiality and integrity of the AMD SEV VM’s registers that can be both read and modified in-between VM-exit and VM-enter. The hack-3 challenge covers the limitation of memory integrity and explores the application of IAGO attacks [4] on AMD SEV (and SEV-ES). Each challenge provides a list of commands for interacting with the VM. Commands include reading or writing physical memory, reading or changing registers, reading or writing to UART. The commands interface is provided to steer teams to focus on specific limitations of the implementations and to limit easier unintended exploits that are irrelevant to the challenges. QEMU was used for emulating the features. While QEMU supports setting up AMD SEV VMs with KVM on authentic EPYC platforms, QEMU does not support emulating the features. This required me to implement AMD SEV/SME based on an interpretation of how the features work. I added support for the features in the QEMU TCG Interpreter (TCI) that interprets the IR instead of JIT-ing it. The above slowed down VM boot considerably to 1-5 minutes depending on the boot flow, and also probably slowed down many teams. At the same time, it was the only way to get started bringing-up these features in QEMU since it allowed a simpler implementation and better debugging support."
