["https://hxp.io/blog/20/TUMCTF-Teaser-2015-crypto150-really_slow_arithmetic-writeup"]
title = 'hxp | TUMCTF Teaser 2015: crypto150 "really_slow_arithmetic" writeup'
description = "hxp is a CTF team."
full_description = 'Trying to simply log in, as demanded by the task, quickly turns out to be quite hopeless: The SSH client immediately eats 100% CPU power and even after waiting a considerable amount of time, there is no significant progress in authenticating to the server. So what’s wrong with the key? As it turns out (using openssl asn1parse and some regex magic to shorten the output), all private parts except $d$ are set to zero or one, that is, blanked out, and $d$ has over four million bits, much more than the modulus ($16384$ bits). (Fun fact: OpenSSH does in fact accept keys of that format, i.e. without $p$, $q$, $d\bmod{\varphi(p)}$, $d\bmod{\varphi(q)}$, $q^{-1}\bmod p$. Hence the key is actually functional!, just a little bit, pun intended, oversized…) It is a defining property of the exponents in the RSA signature system that $e$ and $d$ satisfy \[ ed\equiv1\pmod{\lambda(n)} \text, \] where, in this context, $\lambda$$(n)=\operatorname{lcm}(p-1,q-1)$. On the other hand, this implies that there is an infinite number of working private exponents $d$ for a given public key $(n, e)$ — and the one we are given seems to be a rather large one ;-). Now how can we obtain a smaller representant $d’$ of those possible exponents? Clearly we still need $ed’\equiv1\pmod{\lambda(n)}$. Since the canonical projection $\mathbb Z\to\mathbb Z/\lambda(n)\mathbb Z$ is a ring homomorphism, we can just replace $d$ by $d\bmod\lambda(n)$ without changing the validity of the congruence $d$ must satisfy. But… We don’t know $\lambda(n)$, and it can’t easily be derived from $n$ since this task is essentially equivalent to factoring $n$. However, there is an efficient algorithm to determine the factors of $n$ given a pair $(e, d)$ which satisfies the usual congruence! A nice description of such a method can be found in Dan Boneh’s paper, proof of fact 1. (Also make sure to check out the implementation below. It’s the block commented “magic!”.) After a factorization $n=pq$ has been obtained, one can simply compute \[ d’ := d\bmod \operatorname{lcm}(p-1,q-1) \] and create a new keyfile filling in the exponent $d’$ in place of $d$ and, if one wishes, the numbers missing from the given key (although that’s not strictly necessary, as commented above). The resulting key should work quickly enough to authenticate to the server in time.'
