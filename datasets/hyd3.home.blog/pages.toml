full_description = '''Jerry – No Metasploit Yeah… that’s definitely not the Jerry I remember from Tom and Jerry. Anyway, let’s get started with our usual portscan: Okay. Let’s look at some other enumeration scans, namely gobuster on port 8080 and nikto: Hmm. Ok interesting… So we can use PUT and place a malicious file on the server…? But let’s see if there’s another way to get into this box: Ooh Apache Tomcat! Pretty familiar with this. Using default creds: tomcat and s3cret, we get in. Scrolling down, we see we can upload a .war file. Too easy. We can generate a war file with msfvenom to get a reverse shell: Clicking the link navigates us to our war file which triggers the reverse shell NT AUTHORITY\SYSTEM shell! A bit anti-climactic but oh well. Getting the flags, we see that this was the intended way because we have “2 for the price of 1.txt” for the flags: __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67b23ab6897b2', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); hyd3sec walkthroughs Leave a comment July 1, 2020 1 Minute Shocker – No Metasploit Cool… let’s get started with a portscan and basic gobuster enumeration: Okay. Let’s have a look at the website: Hm. Seemingly useless dead end. I thought I was missing something. No matter how much I try to enumerate, I come up short with nothing: Then after doing A LOT of research, I found out that cgi-bin stores scripts in other languages such as python, js, bash, php, etc. Let me try fuzzing that with those specific extensions: Finally a hit. user.sh Googling for cgi-bin and sh web exploits, shellshock came up… I looked into it more and knew I had to put a special shellshock string into the User-Agent field to exploit the vulnerability, followed by the command And we get a callback on our listener: Note: Usually I’ll have tested the above exploit with a ping first, but at this point I was extremely frustrated and just wanted to go for it. Grabbing the user flag: Okay. Now on to priv esc. I always like to do sudo -l as one of the first enumeration commands: duh. So I can run any perl command as root. This should be pretty obvious but from here, all you need to do is sudo /usr/bin/perl and then either use pentestmonkey’s perl reverse shell one-liner and you’ll get a root shell OR just use perl syntax to switch to the root user. Leaving this open-ended for you to figure out the rest! __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67b23ab68d2d4', { sectionId: '370373', format: 'inread' }); }); hyd3sec walkthroughs Leave a comment July 1, 2020 1 Minute'''
