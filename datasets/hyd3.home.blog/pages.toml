title = "OSCP – hyd3sec's Blog"
description = "Posts about OSCP written by hyd3sec"
full_description = '''Jerry – No Metasploit Yeah… that’s definitely not the Jerry I remember from Tom and Jerry. Anyway, let’s get started with our usual portscan: Okay. Let’s look at some other enumeration scans, namely gobuster on port 8080 and nikto: Hmm. Ok interesting… So we can use PUT and place a malicious file on the server…? But let’s see if there’s another way to get into this box: Ooh Apache Tomcat! Pretty familiar with this. Using default creds: tomcat and s3cret, we get in. Scrolling down, we see we can upload a .war file. Too easy. We can generate a war file with msfvenom to get a reverse shell: Clicking the link navigates us to our war file which triggers the reverse shell NT AUTHORITY\SYSTEM shell! A bit anti-climactic but oh well. Getting the flags, we see that this was the intended way because we have “2 for the price of 1.txt” for the flags: __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67b23b228c25d', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); hyd3sec walkthroughs Leave a comment July 1, 2020 1 Minute Valentine – No Metasploit Alright, let’s get into it. Fire off autorecon and return the portscan results: So autorecon has a neat feature where it will further enumerate ports and put them in separate text files. Opening tcp_443_http_nmap.txt shows: The gobuster output on port 443 shows: Port 80 shows the same: Looking at the actual website and poking around we don’t see much: /decode and /encode.php don’t show much either. However, going to /dev/ we see something interesting: And hype_key: So this is pretty obviously hex code. Copy that file onto your box and run xxd on it to read what it says: Looks like it’s an ssh key for… hype? Well, let’s try to login with it. Ok… so we need a passphrase Heartbleed has been known to leak information… let’s see if we can find something on git to help extract this info This python script allows us to exploit the heartbleed bug: https://raw.githubusercontent.com/roflcer/heartbleed-vuln/master/attack.py After supplying the required params, we get something back that looks like base64: Decode that string and you get a potential password Let’s try to ssh in again… Alright, now time to Priv Esc. After looking around (A LOT), I realized it’s always good to look at .bash_history, so I did: Running down the list of commands and running: tmux -S /.devs/dev_sess looks like it spawns a tmux session as root __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67b23b2291ec2', { sectionId: '370373', format: 'inread' }); }); hyd3sec walkthroughs Leave a comment July 1, 2020 1 Minute'''
