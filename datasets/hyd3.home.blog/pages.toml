full_description = "Featured OSCP – HacktheBox List In preparation for the OSCP, these are the boxes that I went after (in this order) after my first failed exam attempt. This list is mostly based on TJ_Null’s OSCP HTB list. There’s 39 boxes in this list, but this is a great example of trying ‘harder’ and going beyond the course material. I watched all of Ippsec’s YouTube videos on these boxes before I attempted any of them. I’ll publish walk-throughs of all of these boxes in the coming days for you to see my methodology, where I messed up, etc. Some of these boxes are active, so I will have to wait until they retire to publish those ones. ServmonResoluteMagicAdmirerNestSaunaCacheOptimumJeevesValentineBashedShockerJerryFriendzoneNibblesNinevehBeepSolidstateSenseGrandpaDevelLameBastardPoisonCronosSundayIrkedTartarsauceSwagshopGrannyBlunderArcticNodeLegacyDevOopsHawkNetworkedChatterboxSecNotes __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67b23b5f590e0', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); hyd3sec courses and certs 1 Comment June 22, 2020July 1, 2020 1 Minute"
