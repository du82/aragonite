full_description = "HTB – Optimum Box Walkthrough [No Metasploit] This is an awesome box… pretty straight forward up to user, but but definitely got caught up in a few things that I’ll be sure to never do again… and getting root was not so easy… you definitely learn a lot with this box… wget scripting for windows… windows priv esc tools… anyway let’s get started. First, let’s get an Nmap scan done: Ok so only port 80 is open… a little more enumeration will show that the website is running on Rejetto… I typically only like to use exploit-db’s stuff (searchsploit runs off exploit-db in case you didn’t know) An exploit search yields: The code shows the usage: So after you download the file, copy it into a new folder… edit the script accordingly… The directions also say you need to copy nc.exe from your system… make sure you copy the right one (not the sql one) Then serve it all up on a web server Run the script… Then look at your nc -nvlp window…. You’re in kostas. Get your user flag. Priv Esc to Root Ok… full disclosure, this took me QUITE a while to figure out, but I was determined to not use Metasploit After looking at systeminfo, googling windows privilege escalation tools, etc., I came across https://resources.infosecinstitute.com/windows-exploit-suggester-an-easy-way-to-find-and-exploit-windows-vulnerabilities/ After I saw it was vulnerable to MS16-098 and looking around the web… a lot… I came across this little bad boy: And this is where I pulled a super noob move and wasted hours. First, I downloaded the file directly and tried to compile it… guess what… you can’t directly compile a C file in a Linux environment. I then tried downloading the binary directly through my browser… which constantly resulted in a 0 byte file… very frustrated I went to go get a beer and take a break. I came back, used plain old git in terminal… and voila! Move the file to the folder where you’re serving up SimpleHTTP on! So now I’m wondering… how am I gonna get this .exe onto the victim machine? wget won’t work because we’re in a windows environment… Make wget script for windows (I had to google how to do this) Use the wget script you made earlier to move the .exe onto the victim machine… Moment of truth… this .exe better work… lol Run it…. And BOOM! You should get root. __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67b23e0326b3f', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); hyd3sec walkthroughs Leave a comment November 22, 2019June 22, 2020 2 Minutes"
