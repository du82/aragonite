["https://hyd3.home.blog/2020/06/24/nest-no-metasploit"]
title = "Nest – No Metasploit – hyd3sec's Blog"
description = '''Definitely learned a new thing or two with this box. Anyway, let's fire off nmap: <img src="https://hyd3home.files.wordpress.com/2020/06/image-40.png?w=906" alt="Nmap scan report for 10.10.10.178 Host is up, received user-set (ø.ø35s latency). scanned at 2020-05-22 22:36:31 EDT for 68øs Not shown: 65533 filtered ports Reason: 65533 no-responses PORT STATE SERVICE REASON VERSION 445/tcp open microsoft-ds? syn-ack t t…'''
full_description = '''Nest – No Metasploit hyd3sec walkthroughs June 24, 2020 4 Minutes Definitely learned a new thing or two with this box. Anyway, let’s fire off nmap: Okay… so let’s go look at port 4386 to try to see what it is. HQK Reporting Service? Erm. Ok. Port 445 was open so let’s run smbclient to list the shares and smbmap to list the contents: What’s in Welcome Email.txt? Cool. So we got a password. No… don’t go trying to use it just yet. Continue enumerating. Looking at NotepadPlusPlus config.xml: Looking at RU_config.xml: … and that’s why we continue to enumerate FIRST. Okay so, trying the creds that we’ve found so far… we figure out a couple things. TempUser can get access with welcome2019 So can L.Frost!, but L.Frost can only login with welcome2019, not list shares for some reason (access denied) Same with R.Thompson… User: C.Smith and Password: fTEzAfYDoz1YzkqhQkH6GQFYKp1XY5hm7bjOP86yYxE= can list contents in Secure$\IT\Carl\ directory with TempUser With the encrypted password, RUScanner had vb files (Module1.vb) with an example of how to decrypt the password Utils.vb had the actual code to decrypt the password So I needed a nudge on this because this is all REALLY out of my brain capacity (but wouldn’t be for long!)… this involved A LOT of trial and error: Cutting and pasting the code on .net Fiddle (https://dotnetfiddle.net) and removing all the unnecessary (non encrypting related functions) and adding Imports System at the top (to get rid of the errors and import necessary classes/modules/etc to make the code work) and adding Console.WriteLine(plainText) before the decrypt function returns gave us this code: That last portion was used to just decrypt the actual string that we found earlier. This returned the password: The password is: xRxRxPANCAK3SxRxRx Using this, we can try to access the share with C.Smith’s username: We can then just download user.txt and read it: Now onto root. Looking around, we see some interesting files in HQK Reporting HQK_Config_Backup.xml contents: Looking a bit at Debug Mode Password.txt, it looks interesting. After looking for hours, I remembered about using alternate data streams to hide stuff in files. Interesting… so there’s a stream called Password! Okay, so we know this is associated with the HQK service on port 4386. Let’s try to telnet with these creds: Reading the manual for HQK Reporting Service, we can figure out the commands used to enumerate what is on the service. To be continued… __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67b23a33a4cd1', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67b23a33a4e38', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Share this:TwitterFacebookLike Loading... Related TaggedhacktheboxhtbnestOSCPwalkthrough Published by hyd3sec View all posts by hyd3sec Published June 24, 2020'''
