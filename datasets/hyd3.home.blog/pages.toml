title = "METASPLOIT… Use it? – hyd3sec's Blog"
description = "To put it simply... it depends on what you're trying to accomplish. If your goal is nothing more than being a hobbyist and going to DEFCON and CTF events and trying to get on top of the scoreboard... then sure... use it. It's a great tool. If you're starting out, sure use it. We all…"
full_description = "METASPLOIT… Use it? hyd3sec random November 19, 2019June 22, 2020 1 Minute To put it simply… it depends on what you’re trying to accomplish. If your goal is nothing more than being a hobbyist and going to DEFCON and CTF events and trying to get on top of the scoreboard… then sure… use it. It’s a great tool. If you’re starting out, sure use it. We all remember the thrill of the first password we cracked or the first shell we got right? But if you want to truly understand the processes behind it all… try not to use it. There are other ways around it and people have done it before. There’s plenty of stuff online that will point you in the right direction. I only try to use it as a last resort. I don’t want to get dependent on a program that does a lot of the hard work for me. Plus I crave understanding why things work the way they do. Oh, and because I don’t want to be a skiddie. I’m not being judgemental… like I said… it just depends on what you want to accomplish. But if you want to truly be a professional and get an even better sense of satisfaction when you pop a shell or get root through manual windows privilege esc (yes I finally did this earlier today… will post about it under my Optimum walkthrough), then try not to use it. __ATA.cmd.push(function() { __ATA.initVideoSlot('atatags-370373-67b23c346f1a5', { sectionId: '370373', format: 'inread' }); }); __ATA.cmd.push(function() { __ATA.initDynamicSlot({ id: 'atatags-26942-67b23c346f1d6', location: 120, formFactor: '001', label: { text: 'Advertisements', }, creative: { reportAd: { text: 'Report this ad', }, privacySettings: { text: 'Privacy', } } }); }); Share this:TwitterFacebookLike Loading... Related Taggedmetasploitscript kiddieskiddie Published by hyd3sec View all posts by hyd3sec Published November 19, 2019June 22, 2020"
