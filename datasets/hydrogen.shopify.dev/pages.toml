title = "Hydrogen Update | January 2025 release"
description = "Build performant ecommerce faster with Shopify’s React-based framework for developing custom storefronts. Built-in Oxygen hosting makes deployment easy."
full_description = "<Back to UpdatesJanuary 2025 releaseJanuary 31, 2025Welcome to our January release! This release supports the latest Storefront API (2025-01) and contains package updates and validation on Remix future flag. Turn on Remix future flag: v3_lazyRouteDiscovery Remix introduced lazy route discovery future flag to optimize route manifest delivery. To turn it on, simply add the following line to your vite.config.ts: Code ExampleCopy export default defineConfig({ plugins: [ hydrogen(), oxygen(), remix({ presets: [hydrogen.preset()], future: { v3_fetcherPersist: true, v3_relativeSplatPath: true, v3_throwAbortReason: true, v3_lazyRouteDiscovery: true, // add this flag }, }), tsconfigPaths(), ], For more information, see the v3_lazyRouteDiscovery PR or refer to the Remix guide [https://remix.run/docs/en/main/start/future-flags#v3_lazyroutediscovery]. Cart delivery address update (breaking) SFAPI 2025-01 updated how cart delivery address is handled (changelog). cart.buyerIdentity.deliveryAddressPreferences is deprecated. Code ExampleCopy query CartQuery( ... ) @inContext(country: $country, language: $language) { cart(id: $cartId) { buyerIdentity { deliveryAddressPreferences { // deprecated ... } } } } Use the new cart.delivery instead. Code ExampleCopy query CartQuery( ... ) @inContext(country: $country, language: $language) { cart(id: $cartId) { delivery { // new cart delivery endpoint ... } } } To modify the cart delivery address, 3 new mutations are introduced: cartDeliveryAdressesAdd, cartDeliveryAddressesUpdate, and cartDeliveryAddressesRemove. To take advantage of all the latest features and improvements in Hydrogen, just run npx shopify hydrogen upgrade. That’s it for the January release — see you next month!Get buildingSpin up a new Hydrogen app in minutes.npm create @shopify/hydrogen@latestSee documentationLearn HydrogenRead Hydrogen docs and guidesBuild with usHydrogen is 100% open sourceLearn HydrogenCode-along tutorials for development tips and insights"
