full_description = "February 18, 2025February 2025 releaseThis release contains package updates and validation on Remix future flag v3_singleFetch.Read more January 31, 2025January 2025 releaseWelcome to our January release! This release supports the latest Storefront API (2025-01) and contains package updates and validation on Remix future flag. Turn on Remix future flag: v3_lazyRouteDiscovery Remix introduced lazy route discovery future flag to optimize route manifest delivery. To turn it on, simply add the following line to your vite.config.ts: Code ExampleCopy export default defineConfig({ plugins: [ hydrogen(), oxygen(), remix({ presets: [hydrogen.preset()], future: { v3_fetcherPersist: true, v3_relativeSplatPath: true, v3_throwAbortReason: true, v3_lazyRouteDiscovery: true, // add this flag }, }), tsconfigPaths(), ], For more information, see the v3_lazyRouteDiscovery PR or refer to the Remix guide [https://remix.run/docs/en/main/start/future-flags#v3_lazyroutediscovery]. Cart delivery address update (breaking) SFAPI 2025-01 updated how cart delivery address is handled (changelog). cart.buyerIdentity.deliveryAddressPreferences is deprecated. Code ExampleCopy query CartQuery( ... ) @inContext(country: $country, language: $language) { cart(id: $cartId) { buyerIdentity { deliveryAddressPreferences { // deprecated ... } } } } Use the new cart.delivery instead. Code ExampleCopy query CartQuery( ... ) @inContext(country: $country, language: $language) { cart(id: $cartId) { delivery { // new cart delivery endpoint ... } } } To modify the cart delivery address, 3 new mutations are introduced: cartDeliveryAdressesAdd, cartDeliveryAddressesUpdate, and cartDeliveryAddressesRemove. To take advantage of all the latest features and improvements in Hydrogen, just run npx shopify hydrogen upgrade. That’s it for the January release — see you next month! December 12, 2024December 2024: Support for 2,000 variants and combined listingsAs we wrap up the year, we're excited to bring you updates that expand product variant limits, optimize product page performance and more.Read more"
