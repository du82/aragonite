["https://www.hyperhosting.gr/content/news-announcements/31-free-ssl"]
title = "SSL. Δωρεάν. Σε όλους. - Νέα & Ανακοινώσεις - Greek Web Hosting ::HyperHosting.gr:: Domain Registration and Dedicated Servers in Greece"
description = "Παροχή υπηρεσιών φιλοξενίας σε ΕΛΛΗΝΙΚΟ datacenter. Επίσημος καταχωρητής ονομάτων .gr .eu. Υπηρεσίες datacenter (ενοικίαση dedicated server/colocation) και ποιοτική υποστήριξη από το 2001!"
full_description = "SSL. Δωρεάν. Σε όλους.Η ασφάλεια των δεδομένων είναι πάντα σημαντική για την υπηρεσία που παρέχουμε. Το ίδιο σημαντικό είναι και οι επισκέπτες σας να έχουν ένα αίσθημα ασφαλείας όταν επισκέπτονται τη σελίδα σας, για αυτό τον λόγο προτείναμε πάντα την εγκατάσταση SSL certificate στο site σας, ώστε η επικοινωνία με τους πελάτες σας να γίνεται με μεγαλύτερη ασφάλεια. Εδώ και 2 χρόνια παρέχουμε SSL certificates σε ανταγωνιστικές τιμές, προσπαθώντας να προωθήσουμε την ασφάλεια των δεδομένων σας.Σήμερα πηγαίνουμε ένα βήμα παραπέρα: από σήμερα, όλοι οι πελάτες μας έχουν τη δυνατότητα χρήσης SSL certificate για το site τους ΔΩΡΕΑΝ! Η εν λόγω δυνατότητα σας επιτρέπει -για όσο διάστημα είστε πελάτης hosting σε εμάς- να έχετε SSL certificate το οποίο θα διασφαλίζει την ασφαλή μετάδοση των προσωπικών δεδομένων των επισκέπτών σας!Η εν λόγω δυνατότητα παρέχεται σε όλα τα πακέτα shared hosting μας τα οποία βρίσκονται σε servers που έχουν εγκατασταθεί τα τελευταία 3 έτη. Σε περίπτωση που το site σας βρίσκεται σε παλαιότερο server και επιθυμείτε την παροχή του δωρεάν SSL certificate, μπορείτε να μας ανοίξετε ένα ticket στο helpdesk ώστε να προγραμματίσουμε τη μεταφορά σας σε νεότερο server. Καθώς έχουμε ήδη ενεργοποιήσει την υπηρεσία, μπορείτε να δοκιμάσετε να πάτε στο secure site σας (https://.....) για να δείτε αν η εγκατάσταση έχει ολοκληρωθεί ή αν θα χρειαστεί να μας ζητήσετε μεταφορά του site σας.Παραθέτουμε μερικές ερωτήσεις που πιθανόν να έχετε:Τι διάρκεια έχουν τα certificates;Τα certificates έχουν διάρκεια τριών (3) μηνών και ανανεώνονται αυτόματα πριν τη λήξη τους χωρίς να χρειαστεί να κάνετε κάτι εσείς.Έχω addon/parked domain στο πακέτο μου. Τι μπορούμε να κάνουμε;Παρέχουμε δωρεάν SSL για όλα τα addon ή parked domains που έχετε.Μπορώ να έχω την υπηρεσία και στα subdomains;Καλύπτονται έως 200 subdomains ανά domain, ανεξαρτήτως αν είναι το κύριο, parked ή addonΠρόσθεσα ένα νέο addon/parked domain ή έκανα νέα παραγγελία hosting, τι πρέπει να κάνω για να ενεργοποιηθεί το SSL;Τίποτα, η ενεργοποίηση θα γίνει αυτόματα εντός 48 ωρών. Σε περίπτωση που περάσουν 48 ώρες και αντιμετωπίσετε θέμα, ενημερώστε μας με ένα ticket στο Helpdesk.Τι γίνεται αν έχω πάνω από 200 subdomains;Θα καλύψουμε τα 200 subdomains τα οποία έχουν τον μικρότερο αριθμό γραμμάτων.Μπορώ να πάρω το SSL και να πάω σε άλλη εταιρία;Τα SSL που έχουμε είναι για χρήση στους servers μας, δεν μπορείτε να τα μεταφέρετε αλλού.Έχω αγορασμένο SSL που λήγει, τι μπορώ να κάνω;Σε περίπτωση που επιθυμείτε μπορείτε να το ανανεώσετε αγοράζοντας νέο, διαφορετικά 3 ημέρες πριν τη λήξη του θα εγκατασταθεί αυτόματα το δωρεάν SSL.Ποια εταιρία παρέχει τα certificates;Τα certificates θα είναι signed by cPanel, με παροχή της υπηρεσίας από την Comodo."
