full_description = "Υποβάλλοντας την παραγγελία σας συμπληρώνοντας τη σχετική φόρμα, θα λάβετε ένα τηλεφώνημα τις ώρες που μας διευκρινήσατε ωστε να επιβεβαιωθεί η παραγγελία σας. Με την επιβεβαίωση της παραγγελίας σας, μέσα σε 30 λεπτά θα λάβετε στο e-mail σας τα στοιχεία του λογαριασμού σας (username και password για το control panel, η IP σας για να ανεβάσετε τα αρχεία σας καθώς και άλλο ενημερωτικό υλικό). Μπορείτε να ξεκινήσετε τη δημιουργία του site σας άμεσα χωρίς να χρειάζεται να καταβάλλετε πρώτα το αντίτιμο όπως κάνουν άλλες γνωστές εταιρίες. Το αντίτιμο του πακέτου σας θα πρέπει να το καταβάλλετε μέσα σε δύο (2) εργάσιμες ημέρες από την ημερομηνία ανοίγματος του πακέτου σας. Να σημειωθεί εδώ οτι σε περίπτωση που έχετε ζητήσει και ταυτόχρονη κατοχύρωση domain name από εμάς, αυτό θα είναι διαθέσιμο 1-2 ημέρες μετά την ημερομηνία καταθέσεως του αντιτίμου. Η πληρωμή μπορεί να γίνει είτε μέσω καταθέσεως σε έναν από τους διαθέσιμους τραπεζικούς λογαριασμούς μας (Alpha, Εθνική, Eurobank, Πειραιώς) είτε μέσω πληρωμής μέσω κάρτας, είτε μέσω κατευθείαν πληρωμής στα γραφεία μας (Αρριανού 1, Άλιμος). Οι κάρτες που γίνονται δεκτές είναι οι VISA, Mastercard. Με την κατάθεση σας, μας ενημερώνετε με ένα ticket στο Helpdesk ή τηλεφωνικά αναφέροντας μας την τράπεζα στην οποία έγινε η κατάθεση και σας πιστώνουμε το ποσό στον λογαριασμό σας."
