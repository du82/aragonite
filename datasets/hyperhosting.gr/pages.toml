["https://www.hyperhosting.gr/en/content/news-announcements/31-free-ssl"]
title = "SSL. Free. To everyone. - News & Announcements - Greek Web Hosting ::HyperHosting.gr:: Domain Registration and Dedicated Servers in Greece"
description = "Παροχή υπηρεσιών φιλοξενίας σε ΕΛΛΗΝΙΚΟ datacenter. Επίσημος καταχωρητής ονομάτων .gr .eu. Υπηρεσίες datacenter (ενοικίαση dedicated server/colocation) και ποιοτική υποστήριξη από το 2001!"
full_description = "Data security is always important on the service we provide. The same important is for your visitors to have a sense of security when they visit your website, for this reason we always suggested an SSL installation on your website, so the communication with your clients would be with increased security. For 2 years now we offer SSL certificates in competitive prices, trying to promote your data security. Today we go one step further; starting today, all our clients have the option to use an SSL certificate for their site FREE OF CHARGE! This ability allows you -as long as you are a hosting client of us- to have an SSL certificate which will ensure the encrypted transmission of our client's personal data! This feature is offered in all our shared hosting plans which are in a server installed in the last 3 years. In case your site is in an older server and you wish to take advantage of the free SSL certificate, you may open a ticket on our helpdesk so we can migrate your website to a newer server. Since you we have already enabled the service on all our clients, you can try and go to your secure site (https://....._) to see if the installation is completed or if a site migration is needed. Here we have some of the questions you might have:What is the certificate duration?The certificates are valid for three (3) months and are automatically renewed before their expiration, without any effort from your behalf.I have addon/parked domains in my package. What can we do?The free SSL is offered for all addon or parked domains you may have. Can I cover subdomains too?We cover up to 200 subdomains per domain, regardless of its status (main, parked or addon).I added a new addon/parked domain or I just placed a new hosting order, what should I do to have SSL enabled?Nothing, the activation will be completed automatically within 24 hours.What happens if I have more than 200 subdomains?We will cover the 200 subdomains with the least character length.Can I export my SSL and move to another company?The SSLs provided are for use in our servers, you can't move them elsewhere.I have a paid SSL which is due to expire, what can I do?In case you wish you can renew it by buying a new one, otherwise 3 days prior to expiration the free SSL will be installed.Which company are these certificates from?The certificates are signed by cPanel and the service is provided by Comodo."
year_published = 2016
clearnet = "https://www.hyperhosting.gr/en/content/news-announcements/31-free-ssl"
