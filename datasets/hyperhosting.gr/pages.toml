["http://www.hyperhosting.gr/page/network"]
title = "Δίκτυο - Greek Web Hosting ::HyperHosting.gr:: Domain Registration and Dedicated Servers in Greece"
description = "Παροχή υπηρεσιών φιλοξενίας σε ΕΛΛΗΝΙΚΟ datacenter. Επίσημος καταχωρητής ονομάτων .gr .eu. Υπηρεσίες datacenter (ενοικίαση dedicated server/colocation) και ποιοτική υποστήριξη από το 2001!"
full_description = "Αναγνωρίζουμε οτι το downtime δεν είναι επιλογή. Παρέχουμε φιλοξενία σε μηχανήματα στην Ελλάδα, προκειμένου να υπάρχει η μέγιστη δυνατή ταχύτητα απόκρισης αλλά και οι ελάχιστες δυνατές διακοπές λόγω των διεθνών κυκλωμάτων. Τα ιδιόκτητα μηχανήματα μας βρίσκονται στο state-of-the-art datacenter της United Group στην Λ. Αθηνών. Από εκεί παρέχουμε -εκτός της φιλοξενίας sites- τις υπηρεσίες datacenter (ενοικίαση dedicated servers, colocation κλπ).To datacenter της United Group υποστηρίζεται από ένα ζεύγος UPS της APC Silcon τεχνολογίας Delta Conversion (παροχή 240KVA το ένα) και μίας γεννήτριας ντίζελ (600KVA) ωστε να εξασφαλίζεται σταθερή τάση χωρίς αυξομειώσεις και διακοπές. Το datacenter παρέχει τις ιδανικές συνθήκες λειτουργίας, αφού διαθέτει 10 κλιματιστικές μονάδες Carrier, fully redundant με συνολική θερμική απαγωγή 800Kbtu, οι οποίες παρέχουν ψύξη σε όλο το χώρο επιτυγχάνοντας ομαλή ροή ψυχρού αέρα σε σταθερή θερμοκρασία. Ο έλεγχος της θερμοκρασίας και της υγρασίας υλοποιείται με αυτόματα συστήματα ανιχνευτών που συνδέονται με το κεντρικό σύστημα συναγερμού.Βγαίνουμε στο backbone με 2 uplink 10Gbps το κάθε ένα μέσω οπτικών ινών πάνω σε MikroTik CloudCore routers, τα οποία συνδέονται με το κεντρικό backbone της Nova και από εκεί η κίνηση μοιράζεται είτε στο GR-IX είτε στο εξωτερικό. Η ύπαρξη του GR-IX (σύνδεση μεταξύ των μεγαλυτερων παροχεων Internet και ακαδημαϊκων ιδρυμάτων) εξασφαλίζει μεγαλύτερη ταχύτητα για τους επισκέπτες από Ελλάδα, με latency τόσο χαμηλό που φτάνει μέχρι και τα 4ms!Το κτίριο είναι τοποθετημένο μακριά από πιθανές πηγές ηλεκτρομαγνητικού θορύβου, μηχανικών ταλαντώσεων ή λοιπών παρεμβολών και πληρεί τους πλέον αυστηρούς κανονισμούς αντισεισμικής προστασίας. Η εσωτερική διαρρύθμιση έχει υλοποιηθεί με πυρίμαχα βραδύκαυστα υλικά με αντοχή σε φωτιά και υψηλές θερμοκρασίες. Το σύστημα πυρασφαλείας αποτελείται από δύο χώρους, τον κυρίως χώρο των μηχανημάτων και το χώρο κάτω από το ψευδοπάτωμα. Ο κάθε χώρος είναι χωρισμένος σε 2 ζώνες, διαθέτει αυτόνομο σύστημα πυρόσβεσης, ξεχωριστό πίνακα λειτουργίας και 14 ανιχνευτές καπνού."
