title = "cPanel Certified Partner - Νέα & Ανακοινώσεις - Greek Web Hosting ::HyperHosting.gr:: Domain Registration and Dedicated Servers in Greece"
description = "Παροχή υπηρεσιών φιλοξενίας σε ΕΛΛΗΝΙΚΟ datacenter. Επίσημος καταχωρητής ονομάτων .gr .eu. Υπηρεσίες datacenter (ενοικίαση dedicated server/colocation) και ποιοτική υποστήριξη από το 2001!"
full_description = "Στα πλαίσια της διάκρισης των συνεργατών της οι οποίοι είναι σε θέση να παρέχουν ποιοτική υποστήριξη στους πελάτες τους, η cPanel ανακοίνωσε τον Ιούνιο πως ξεκινάει το πρόγραμμα cPanel Certified Partner. Είμαστε στην ευχάριστη θέση να ανακοινώσουμε πως είμαστε η πρώτη εταιρία στην Ελλάδα η οποία γίνεται cPanel Certified Partner! Η διάκριση του να είσαι cPanel Certified Partner σημαίνει πως υπάρχει ο απαιτούμενος αριθμός ατόμων τα οποία έχουν άριστη γνώση του cPanel, προσφέροντας άμεση λύση στα περισσότερα από τα προβλήματα που αναφέρουν οι χρήστες. Ο κάθε administrator έχει λάβει μία σειρά certifications τα οποία παρέχονται σε εξεταζόμενους οι οποίοι επιτυγχάνουν βαθμολογία άνω του 90% στην εξέταση πιστοποίησης. Τα εν λόγω certifications έχουν διάρκεια ενός έτους, μετά τη λήξη του οποίου οι εξεταζόμενοι δίνουν εκ νέου εξετάσεις για να αποδείξουν πως έχουν τις απαραίτητες γνώσεις σε ένα οικοσύστημα το οποίο ανανεώνεται συνεχώς. Τα certificates είναι τα:cPanel & WHM Sales Professional (CPSP)cPanel Professional Certification (CPP)cPanel & WHM Administrator Certification (CWA) Εκτός του ότι με την λήψη του εν λόγω σήματος πιστοποιούμαστε πως έχουμε τις απαραίτητες γνώσεις για άμεση και αποτελεσματική λύση στα προβλήματα των χρηστών, τυχόν αιτήματα που περνάμε στην cPanel έχουν το Ultra Priority status, το υψηλότερο επίπεδο προτεραιότητας που υπάρχει, οπότε υπάρχει άμεση απόκριση για την επίλυση των θεμάτων που προωθούμε.Η εν λόγω υποστήριξη παρέχεται από την μεριά μας σε όλα τα πακέτα shared hosting και στους managed cloud και dedicated servers. Πλέον μπορείτε να αφιερώνετε χρόνο για την οικογένεια ή την δουλειά σας και να αφήνετε την συντήρηση του server σε εμάς, με πιστοποίηση πως θα γίνει σωστή δουλειά :)"
