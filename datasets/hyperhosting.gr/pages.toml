["http://www.hyperhosting.gr/en/page/terms"]
title = "Terms of use - Greek Web Hosting ::HyperHosting.gr:: Domain Registration and Dedicated Servers in Greece"
description = "Παροχή υπηρεσιών φιλοξενίας σε ΕΛΛΗΝΙΚΟ datacenter. Επίσημος καταχωρητής ονομάτων .gr .eu. Υπηρεσίες datacenter (ενοικίαση dedicated server/colocation) και ποιοτική υποστήριξη από το 2001!"
full_description = 'ΣΥΜΦΩΝΗΤΙΚΟ ΜΙΣΘΩΣΗΣ ΕΙΚΟΝΙΚΟΥ ΔΙΑΚΟΜΙΣΤΗ (virtual web server) ΚΑΙ ΠΑΡΟΧΗ ΔΙΑΔΙΚΤΥΑΚΗΣ ΦΙΛΟΞΕΝΙΑΣ ΙΣΤΟΣΕΛΙΔΩΝ (web hosting) H "HyperHosting" (στο εξής θα αναφέρεται ως η Εταιρία), μέσω του δικτυακού τόπου www.hyperhosting.gr, διαθέτει πρόσβαση και χρήση χώρου στο σκληρό δίσκο διακομιστών (web servers), μισθωμένων από τρίτους. Οι διακομιστές αυτοί διανέμουν στο Internet το αποθηκευμένο σε αυτούς υλικό για την προβολή των πελατών της (web sites, οπτικοακουστικό υλικό, multimedia, streaming) και μέσω αυτών δύναται να διακινείται και η ηλεκτρονική αλληλογραφία των πελατών της. Ο _________________________ (στο εξής θα αναφέρεται ως ο Πελάτης), προτίθεται να ενοικιάσει και να χρησιμοποιήσει τον προσφερόμενο από την Εταιρία, virtual server για τους δικούς του σκοπούς. Τα συμβαλλόμενα μέρη συμφωνούν και συναποδέχονται τα κάτωθι: α) Ο πελάτης βεβαιώνει ότι το υλικό που θα "ανεβάζει" στον server θα είναι έτοιμο και δεν θα χρειάζεται καμία επιπλέον επεξεργασία από την Εταιρία για να λειτουργήσει. Εναλλακτικά μπορεί να χρησιμοποιήσει τις υπηρεσίες της Εταιρίας για την κατασκευή, συντήρηση, διαχείρηση, ανανέωση και διαφήμιση του web site στον χώρο που του έχει παραχωρηθεί, επιβαρυνόμενος με το ανάλογο επιπλέον κόστος, το οποίο χρεώνεται ξεχωριστά και κατόπιν συνεννόησης/συμφωνίας. Επίσης η Εταιρία αναβαθμίζει σε τακτά χρονικά διαστήματα εγκατεστημένες εφαρμογές που υπάρχουν στους servers της προκειμένου να διατηρεί τα επίπεδα ασφαλείας στο υψηλότερο δυνατό επίπεδο και για να παρέχει τις πιο πρόσφατες εκδόσεις των cPanel, PHP, MySQL, Perl, Zend, Ioncube κλπ. Είναι αποκλειστική υποχρέωση του πελάτη να ενημερώνει αναλόγως τις σελίδες και εφαρμογές του (τον κώδικα PHP, MySQL queries κλπ των ιστοσελίδων που ο Πελάτης διατηρεί στον χώρο που του παρέχει η Εταιρία) έτσι ώστε να είναι συμβατές με τους servers της Εταιρίας. Η Εταιρία δεν ευθύνεται για οποιαδήποτε απώλεια, ζημιά και ηθική βλάβη προκύπτει από αυτές τις αναβαθμίσεις καθώς και από την αδυναμία ή απροθυμία του πελάτη να προσαρμόσει τις ιστοσελίδες του με τις αναβαθμισμένες εκδόσεις των διάφορων εφαρμογών και προγραμματιστικών γλωσσών Η/Υ που έχουν εγκατασταθεί στους servers της Εταιρίας.'
