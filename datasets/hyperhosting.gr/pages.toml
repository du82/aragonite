title = ".gr domains :: Έκτακτη Ανακοίνωση 16/07 - Νέα & Ανακοινώσεις - Greek Web Hosting ::HyperHosting.gr:: Domain Registration and Dedicated Servers in Greece"
description = "Παροχή υπηρεσιών φιλοξενίας σε ΕΛΛΗΝΙΚΟ datacenter. Επίσημος καταχωρητής ονομάτων .gr .eu. Υπηρεσίες datacenter (ενοικίαση dedicated server/colocation) και ποιοτική υποστήριξη από το 2001!"
full_description = "Η ΕΕΤΤ, με νέα έκτακτη ανακοίνωση της στις 15/07/2015 και λόγω των εξελίξεων που επηρεάζουν την ομαλή πληρωμή των ονομάτων χώρου [.gr], με σκοπό την προστασία των ιδιοκτητών των domains, αποφάσισε τα εξής:1) Ονόματα Χώρου των οποίων η περίοδος εκχώρησης τους λήγει από τις 14/06/2015 έως και τις 28/06/2015, παρατείνεται η διάρκεια του δικαιώματος δέσμευσης (quarantine) έως και τις 4/08/2015. Σε αυτή την περίπτωση υπάγονται domain τα οποία έληξαν το εν λόγω διάστημα και είχαν 15 ημέρες διορία οι ιδιοκτήτες τους να τα ανανεώσουν.2) Ονόματα Χώρου των οποίων η περίοδος εκχώρησης τους λήγει από τις 29/06/2015 έως και τις 3/08/2015, διατηρούνται σε ισχύ έως και τις 4/08/2015. Η διάρκεια του δικαιώματος δέσμευσης (quarantine), η οποία είναι 15 ημέρες άρχεται για όλα τα ανωτέρω ονόματα την 5η Αυγούστου 2015. Σε αυτή την περίπτωση υπάγονται domains τα οποία θα λήξουν το εν λόγω διάστημα, οπότε με αυτή την ενέργεια το domain ΘΑ ΣΥΝΕΧΙΣΕΙ να λειτουργεί κανονικά και μετά την ημερομηνία λήξεως του, έως την 5η Αυγούστου 2015.3) Η περίοδος ανανέωσης των ανωτέρω domain θα ισχύει για 2 έτη από την προηγούμενη ημερομηνία λήξεως και όχι από την προσωρινή που δίνεται σαν παράταση.Το σύστημα μας θα στέλνει κανονικά τις ενημερώσεις το εν λόγω χρονικό διάστημα με σημείωση η οποία θα παραπέμπει στο παρόν άρθρο. Εννοείται πως αν επιλέξετε να πληρώσετε με εναλλακτικό τρόπο (πχ πιστωτική κάρτα, PayPal, EasyPay) η ανανέωση γίνεται κανονικά.Για να χρησιμοποιήσετε την υπηρεσία domain forward, θα πρέπει να ανανεώσετε το domain σας, καθώς οι παραπάνω παρατάσεις δεν ισχύουν για την συγκεκριμένη υπηρεσία μας."
