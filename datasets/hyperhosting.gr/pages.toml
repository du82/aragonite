full_description = '''Η χρήση των ηλεκτρονικών σελίδων και υπηρεσιών πού παρέχονται στον επισκέπτη/χρήστη (για την διευκόλυνση του παρόντος θα αναφέρεται στο εξής ως "ο Πελάτης" ανεξαρτήτως αν έχει προμηθευτεί κάποια υπηρεσία), από τον ιστότοπο hyperhosting.gr ιδιοκτησίας του Βαρδίκου Ε. Γεώργιου με διακριτικό τίτλο «HyperHosting» (εφεξής «η Εταιρεία»), προϋποθέτει την ανεπιφύλακτη συμφωνία σας με την Πολιτική Απορρήτου περί Προστασίας Προσωπικών Δεδομένων του παρόντος ιστότοπου. Συνεπώς, ο επισκέπτης/χρήστης οφείλει να διαβάσει προσεκτικά τα περιεχόμενα αυτής της σελίδας, πριν από τη χρήση των υπηρεσιών της σελίδας. Η χρήση της ιστοσελίδες σημαίνει ανεπιφύλακτη αποδοχή της παρούσης Πολιτικής Απορρήτου.Αυτή η πολιτική απορρήτου μπορεί να αλλάζει από καιρό σε καιρό σύμφωνα με τη νομοθεσία ή τις εξελίξεις στον κλάδο. Δεν θα ενημερώσουμε ρητά τους πελάτες μας ή τους χρήστες του ιστότοπου μας για τις αλλαγές αυτές. Αντ' αυτού, σας συνιστούμε να ελέγχετε περιστασιακά αυτή τη σελίδα για τυχόν αλλαγές της παρούσας πολιτικής απορρήτου. Η εξακολούθηση της χρήσης του ιστότοπου hyperhosting.gr ακόμη και μετά τις όποιες αλλαγές στην Πολιτική Απορρήτου, σημαίνει την ανεπιφύλακτη αποδοχή των όρων αυτών εκ μέρους σας.'''
