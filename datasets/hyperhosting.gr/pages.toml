full_description = "Από 1η Αυγούστου, λόγω της αύξησης του κόστους των Μητρώων .net και .org καθώς και της πτώσης του ευρώ σε σχέση με το δολάριο το τελευταίο έτος, θα ισχύσει νέος τιμοκατάλογος για .com .net .org .info .biz domains. Μπορείτε να ανανεώσετε τα domains σας στην υπάρχουσα τιμή για πολλαπλά έτη έως τέλος Ιουλίου, ώστε να αποφύγετε τις αυξήσεις. Τα τελευταία 3 έτη έχουν πραγματοποιηθεί αυξήσεις σε όλα τα Μητρώα διεθνών domains, αυξήσεις τις οποίες απορροφήσαμε διατηρώντας τις τιμές σταθερά χαμηλές. Με απώλεια πάνω από 20% της αξίας του ευρώ έναντι του δολλαρίου και με νέες αυξήσεις των Μητρώων από 1/8, αναγκαζόμαστε να προβούμε σε διόρθωση των τιμών. Τιμές λιανικής.com: 9,50 + ΦΠΑ = 11,69 ευρώ.net: 10,40 + ΦΠΑ = 12,79 ευρώ.org: 10,40 + ΦΠΑ = 12,79 ευρώ.info: 9,50 + ΦΠΑ = 11,69 ευρώ.biz: 9,50 + ΦΠΑ = 11,69 ευρώΤιμές μεταπωλητή.com: 8,70 + ΦΠΑ = 10,70 ευρώ.net: 9,59 + ΦΠΑ = 11,80 ευρώ.org: 9,59 + ΦΠΑ = 11,80 ευρώ.info: 8,90 + ΦΠΑ = 10,95 ευρώ.biz: 9,15 + ΦΠΑ = 11,25 ευρώ"
