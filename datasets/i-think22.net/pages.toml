["https://i-think22.net/archives/2013/04/09/paste-on-the-console"]
title = "Paste on the console - i-think Twenty-Two"
description = """
I’ve already alluded to the fact that I love working on the console and in
Windows, PowerShell is my console of choice. I get to throw all sort …"""
full_description = 'Paste on the console Apr 9th, 2013 7:14 pm | Comments I’ve already alluded to the fact that I love working on the console and in Windows, PowerShell is my console of choice. I get to throw all sort of things through it’s object based pipeline and play with them in fun and exciting ways. I also have added to my path a large number of the GnuWin32 tools which are sometimes better at dealing with raw text like sed and occasionally grep instead of PowerShell’s Select-String. By having these utilities in my path I can better deal with being stuck in pure cmd.exe. Anyway, one of my favourite utilities is Clip.exe. It comes out of the box in Windows 7 and presumably Windows Vista. I rolled my own for Windows XP although I believe that it may be available as part of a resource kit. In case it isn’t immediately obvious, what Clip.exe does is takes whatever is fed to Standard Input and saves it to the clipboard. Very useful indeed. The clipboard is a great place for storing some data temporarily and I quite frequently find that I want to process it in various ways. I have a bunch of command line utilities that are perfect at this, but I have to save the contents to a file and pass that file to the utility. That sounds like busy work. Fortunately the GnuWin32 utilities and PowerShell both read from standard input. What I need is a tool that does the opposite of Clip.exe and writes the contents of the clipboard to standard input. What I need is Paste.exe. So I wrote it. <pre><code>namespace ConsolePaste { using System; using System.Linq; using System.Threading; using System.Windows.Forms; public class Paste { [STAThread] public static void Main(string[] args) { var raw = args.Contains(&quot;-r&quot;); if (Clipboard.ContainsText()) { if (raw) { Console.Out.Write(Clipboard.GetText()); return; } foreach (var line in Clipboard.GetText().Split(new [] {&quot;\r\n&quot;, &quot;\n&quot;}, StringSplitOptions.None )) { Console.Out.WriteLine(line); } } else if (Clipboard.ContainsFileDropList()) { if (raw) { Console.Out.Write(string.Join(Environment.NewLine, Clipboard.GetFileDropList().Cast&lt;string&gt;())); return; } foreach (var file in Clipboard.GetFileDropList()) { Console.Out.WriteLine(file); } } } } } </code></pre> A simple compile… $ csc .\Paste.cs And after copying to my Utilities folder (which is in my path) I’m good to go. An added bonus is that I handle files copied in Windows Explorer. These will be returned as a list of filenames. By default I add an extra Environment.NewLine and the end of the content as it tends to make the whole thing neater in the console. If this is causing you hassles use the -r switch which will paste the contents in their raw form. Paste in Action I use paste to quickly view the clipboard contents: $ paste To strip formatting in the clipboard: $ paste | clip To filter clipboard contents: $ paste | grep -i batman As subjects of a PowerShell ForEach-Object: $ paste | % { $_.Length } If you find a common pattern, share it in the comments below. Posted by Rhys Parry Apr 9th, 2013 7:14 pm i-think it « Apple TV and Automatic Downloads Boosting productivity with F# discriminated unions and pattern matching »'
