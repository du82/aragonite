full_description = "Movember Nov 3rd, 2008 8:14 pm | Comments A while ago I shaved off my beard. Now I’m letting some of my facial hair grow back in the form of a Mo for Movember. This lip-tickling effort is about raising awareness (and hopefully money) to help address men’s health issues, especially depression and prostate cancer. I’m not asking you to turn your head and cough, but you can help by donating. Hell, you can donate online at my Movember page using either credit card or even PayPal. How cool is that? There site is nice and secure and even makes the address bar turn green in Firefox! My internet banking site only recently got on that bandwagon. Talking about wagons and things that are old and obsolete, seems that even cheques are acceptable! Just write a cheque payable to Movember Foundation', referencing my Registration Number 1835396 and mail it to: Movember Foundation PO Box 292 Prahran VIC 3181 And I haven’t even mentioned the best bit yet. Not only can you give money away while I grow my magnigificent Mo, but you can also give a bit of a smack- down to the tax man. As usual, donations over $2 are tax deductable. It’s a whole world of awesome. If you are a tight-arse (you know who you are) you can always grow your own Mo and ask others to cough up the dough. Of course if you do give money (remember you can donate online) it will go towards continuing to raise awareness of men’s health issues through the Prostate Cancer Foundation of Australia and beyondblue - the national depression initiative. The PCFA and beyondblue will use the funds to fund research and increase support networks for those men who suffer from prostate cancer and depression. You can’t ask for more than that. Well, you can, but it’s probably better than what you would have spent the money on. The wonderful people at Movember (it’s not just a month) have even detailed what they do spend the money on. I’ll be posting some pictures of my Mo once it starts to properly set in. While you are waiting, why not make a donation? Mo On!! Posted by Rhys Parry Nov 3rd, 2008 8:14 pm i-think « Your travel survival plan - Part 2 Ads in search results »"
