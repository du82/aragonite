full_description = "Mac OS X - Day Three Apr 25th, 2005 8:52 am | Comments It is now the third day of my Macintosh experience and I am fitting in with it all very well. Actually, it seems to be the other way around. The Mac fits me. The question now is what is the fate of my main PC? I have only had to turn it on a couple of times so far (and only to get files I wasn’t clever enough to put on my Linux server). Seeing as it is probably about 10 times as high and about three times as deep as my Mac Mini and makes (almost) infinitely more noise I’m not quite sure what it’s purpose is any more. Currently the Sound Blaster Audigy is the only thing saving it from being re-commisioned as a Linux box. Still, it is a good computer and it may be wise to clean it up and use it for the rare times when “only a Window box can provide”. Unfortunately, the fan noise is so extreme that it is unsuitable for use as a 24/7 server (at least in my room). Today I am testing the portability of my Mac Mini and taking it to be able to watch videos. If it succeeds well in this test I believe it will be ready to take to uni to set up in the wireless network zones. (Still need to test whether the wireless network reaches the TV well enough to use it as a screen). It is probably inevitable that I shall purchase a second one (with all the trimmings) further down the track so that I may have a permament placement here. If I can resolve the fan issues on my main PC it may be time to convert it to a full time server and use it to store my ever-growing collection of files. Posted by rhysparry Apr 25th, 2005 8:52 am macintosh « Mac OS X - Day Two One day I'll rewrite that code... »"
