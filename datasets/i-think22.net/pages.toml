["https://i-think22.net/archives/2005/04/16/i-think-awards-update"]
title = "i-think Awards Update - i-think Twenty-Two"
description = """
This is the first of the weekly updates to keep you informed about the status
of the i-think Awards. Via e-mail I will always put the basic details, …"""
full_description = "i-think Awards Update Apr 16th, 2005 9:39 am | Comments This is the first of the weekly updates to keep you informed about the status of the i-think Awards. Via e-mail I will always put the basic details, such as dates, with more flushed out via the i-think Twenty-Two website. But first, some dates… Currently the awards dinners is likely to be either on the weekend of June 26th or May 3rd. The preference is for a Saturday night. The final date will be decided when Will works out when he is going to be in Brisbane. This means that nominations will need to close at the end of May. New categories will stop being added at about mid-May (so that nominations can take place). Voting will be available once nominations have closed up until 10am of the day of the awards. So, just how did Paul walk away with so many awards last year. I’ve had a look at the numbers and come up with some theories. Theories that should help you win an i-think award. But first, a graph: The majority (~73%) of the winners shown in this graph won all the awards they were nominated for. In fact, if I showed all winners in this graph the percentage would be significantly higher. Theory 1: You have to be in it to win it. You don’t necessarily need to swamp the nominations to walk away a winner. Even though Paul seemed to seriously rig the awards he still lost 40% of the awards he was nominated for. Theory 2: Get your friends to vote. Now this may seem a little unethical, but getting your friends to vote is a fabulous way to increase your chances. Paul used this to his advantage last year adding 3-4 new voters within the last weeks of voting. So why not do the same. The only condition is that your friends must attend the i-think awards, as did Paul’s last minute helpers last year. This will help build the atmosphere at the dinner and will give your friends an opportunity to see the crazy antics of the i-think awards. Theory 3: Make categories just for you Paul took advantage of the open structure of the i-think Awards by creating categories just for him, such as Best Stubble and Best Receeding Hairline. In fact Paul won two thirds of all categories that were hair related. You too can make up your own categories, just be sure to give yourself some competition. Remember, categories with only one nomination (or none) are wiped from the record come awards night, so come up with something. Theory 4: Build categories early Historically most people have been fairly slack and get their nominations in at the very last minute. This actually reduces your chances of winning. Categories are listed in the order they were added to the system and so are nominees. If your nomination is at the top you may actually increase your chances, so make those nominations early. (This can also save you from the embarrassment of being too late to nominate). Like the ads at uni now that give you tips on avoiding library late fees, number one on the list is “return (or renew) your books on time”. Theory 5: If all else fails, buy your i-think awards. Whilst of course I would never condone the selling of an i-think awards and tarnishing its good name and reputation this may be the only way you’ll ever win, or maybe not. I’ve been treating myself to DVDs for years and I’ve never won an i-think award. So, what are you waiting for, make your nominations today!!! Posted by rhysparry Apr 16th, 2005 9:39 am i-think awards « i-think Awards 2005 i-think Awards Update - Week 2 »"
