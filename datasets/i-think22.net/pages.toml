full_description = "My bike has put me in the Red Sep 20th, 2005 12:47 pm | Comments Well, having bought a bike to save me some money on parking and fuel I find myself in the red after the first day. That’s right, it has cost me more money to have my bike. Why? This morning while peddling furiously to uni I turned right, but my bike didn’t. It seems that it wasn’t quite assembled properly and I lost all steering control. Fortunately both I and the bike remain unharmed. (Unlike some people (you know who you are) I didn’t run int a pole or railing) So, you might be thinking, why didn’t you just fix it. Well, I was silly and didn’t have a toolkit with me. So I pushed the bike back up the hill to head home. A task which was increasingly difficult as the bike had other plans. Fortunately a Good Samaritan passed by and helped get it working so it wouldn’t be hard to push. Of course, by the time I got home it was too late to ride again or even walk into the city (to uni) as I usually do. So I drove to my normal car park (cost, $4.80) and caught a bus across to the city (cost, $2.10). So after one day it has cost me $2.10 more than I would normally pay. It has also flared up the pain from when I went horse riding two years ago (Photos would be inappropriate). Posted by Rhys Parry Sep 20th, 2005 12:47 pm miscellaneous « Score one for the Good Guys Do we hear wedding bells? »"
