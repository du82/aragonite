["https://i3wm.org/conduct-faq"]
title = "i3 - improved tiling wm"
description = "i3 is a tiling window manager with clean, readable and documented code, featuring extended Xinerama support, usage of libxcb instead of xlib and several improvements over wmii"
full_description = '''Code of Conduct: FAQ Largely taken from django. Thanks! This FAQ attempts to address common questions and concerns around the i3 community's Code of Conduct. If you still have questions after reading it, please feel free to contact us at conduct AT i3wm DOT org. Why have you adopted a Code of Conduct? We think the i3 community is awesome. If you're familiar with the i3 community, you'll probably notice that the Code basically matches what we already do. Think of this as documentation: we're taking implicit expectations about behavior and making them explicit. We know that the i3 community is open, friendly, and welcoming. We want to make sure everyone else knows it too. What does it mean to "adopt" a Code of Conduct? For the most part, we don't think it means large changes. We think that the text does a really good job describing the way the i3 community already conducts itself. We expect that most people will simply continue to behave in the awesome way they have for years. However, we do expect that people will abide by the spirit and words of the CoC when in "official" i3 spaces. In practice, this means mailing lists (i3-discuss), the i3 IRC channel (#i3), bug tracking and code review tools. In addition, violations of this code outside these spaces may affect a person's ability to participate within them. What happens if someone violates the Code of Conduct? Our intent is that the anyone in the community can stand up for this code, and direct people who're unaware to this document. If that doesn't work, or if you need more help, you can contact conduct AT i3wm DOT org. For more details please see our Reporting Guidelines Why do we need a Code of Conduct? Everyone knows not to be a jerk. Sadly, not everyone knows this. However, even if everyone was kind, everyone was compassionate, and everyone was familiar with codes of conduct it would still be incumbent upon our community to publish our own. Maintaining a code of conduct forces us to consider and articulate what kind of community we want to be, and serves as a constant reminder to put our best foot forward. But most importantly, it serves as a signpost to people looking to join our community that we feel these values are important. This is censorship! I have the right to say whatever I want! You do -- in your space. If you'd like to hang out in our spaces (as clarified above), we have some simple guidelines to follow. If you want to, for example, form a group where i3 is discussed using language inappropriate for general channels then nobody's stopping you. We respect your right to establish whatever codes of conduct you want in the spaces that belong to you. Please honor this Code of Conduct in our spaces.'''
