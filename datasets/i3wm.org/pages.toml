title = "i3: i3status(1)"
full_description = '''i3status(1) Michael Stapelberg <michael@i3wm.org> version 2.15, August 2024 Table of Contents <p><b>JavaScript must be enabled in your browser to display the table of contents.</b></p> 1. NAME i3status - Generates a status line for i3bar, dzen2, xmobar or lemonbar 2. SYNOPSIS i3status [-c configfile] [-h] [-v] [--run-once] 3. OPTIONS -c --config Specifies an alternate configuration file path. By default, i3status looks for configuration files in the following order: ~/.config/i3status/config (or $XDG_CONFIG_HOME/i3status/config if set) /etc/xdg/i3status/config (or $XDG_CONFIG_DIRS/i3status/config if set) ~/.i3status.conf /etc/i3status.conf -h --help Print the verison and a minimal syntax. -v --version Print the version and any build configuration. --run-once Only run once instead of looping. 4. DESCRIPTION i3status is a small program for generating a status bar for i3bar, dzen2, xmobar, lemonbar or similar programs. It is designed to be very efficient by issuing a very small number of system calls, as one generally wants to update such a status line every second. This ensures that even under high load, your status bar is updated correctly. Also, it saves a bit of energy by not hogging your CPU as much as spawning the corresponding amount of shell commands would. 5. CONFIGURATION The basic idea of i3status is that you can specify which "modules" should be used (the order directive). You can then configure each module with its own section. For every module, you can specify the output format. See below for a complete reference. Sample configuration general { output_format = "dzen2" colors = true interval = 5 } order += "ipv6" order += "disk /" order += "run_watch DHCP" order += "run_watch VPNC" order += "path_exists VPN" order += "wireless wlan0" order += "ethernet eth0" order += "battery 0" order += "cpu_temperature 0" order += "memory" order += "load" order += "tztime local" order += "tztime berlin" wireless wlan0 { format_up = "W: (%quality at %essid, %bitrate) %ip" format_down = "W: down" } ethernet eth0 { format_up = "E: %ip (%speed)" format_down = "E: down" } battery 0 { format = "%status %percentage %remaining %emptytime" format_down = "No battery" status_chr = "⚡ CHR" status_bat = "🔋 BAT" status_unk = "? UNK" status_full = "☻ FULL" status_idle = "☻ IDLE" path = "/sys/class/power_supply/BAT%d/uevent" low_threshold = 10 } run_watch DHCP { pidfile = "/var/run/dhclient*.pid" } run_watch VPNC { # file containing the PID of a vpnc process pidfile = "/var/run/vpnc/pid" } path_exists VPN { # path exists when a VPN tunnel launched by nmcli/nm-applet is active path = "/proc/sys/net/ipv4/conf/tun0" } tztime local { format = "%Y-%m-%d %H:%M:%S" hide_if_equals_localtime = true } tztime berlin { format = "%Y-%m-%d %H:%M:%S %Z" timezone = "Europe/Berlin" } load { format = "%5min" } cpu_temperature 0 { format = "T: %degrees °C" path = "/sys/devices/platform/coretemp.0/temp1_input" } memory { format = "%used" threshold_degraded = "10%" format_degraded = "MEMORY: %free" } disk "/" { format = "%free" } read_file uptime { path = "/proc/uptime" } 5.1. General The colors directive will disable all colors if you set it to false. You can also specify the colors that will be used to display "good", "degraded" or "bad" values using the color_good, color_degraded or color_bad directives, respectively. Those directives are only used if color support is not disabled by the colors directive. The input format for color values is the canonical RGB hexadecimal triplet (with no separators between the colors), prefixed by a hash character ("#"). Example configuration: color_good = "#00FF00" Likewise, you can use the color_separator directive to specify the color that will be used to paint the separator bar. The separator is always output in color, even when colors are disabled by the colors directive. This option has no effect when output_format is set to i3bar or none. The interval directive specifies the time in seconds for which i3status will sleep before printing the next status line. Using output_format you can choose which format strings i3status should use in its output. Currently available are: i3bar i3bar comes with i3 and provides a workspace bar which does the right thing in multi-monitor situations. It also comes with tray support and can display the i3status output. This output type uses JSON to pass as much meta-information to i3bar as possible (like colors, which blocks can be shortened in which way, etc.). dzen2 Dzen is a general purpose messaging, notification and menuing program for X11. It was designed to be scriptable in any language and integrate well with window managers like dwm, wmii and xmonad though it will work with any window manager xmobar xmobar is a minimalistic, text based, status bar. It was designed to work with the xmonad Window Manager. lemonbar lemonbar is a lightweight bar based entirely on XCB. It has full UTF-8 support and is EWMH compliant. term Use ANSI Escape sequences to produce a terminal-output as close as possible to the graphical outputs. This makes debugging your config file a little bit easier because the terminal-output of i3status becomes much more readable, but should only used for such quick glances, because it will only support very basic output-features (for example you only get 3 bits of color depth). none Does not use any color codes. Separates values by the pipe symbol by default. This should be used with i3bar and can be used for custom scripts. It’s also possible to use the color_good, color_degraded, color_bad directives to define specific colors per module. If one of these directives is defined in a module section its value will override the value defined in the general section just for this module. If you don’t fancy the vertical separators between modules i3status/i3bar uses by default, you can employ the separator directive to configure how modules are separated. You can also disable the default separator altogether by setting it to the empty string. You might then define separation as part of a module’s format string. This is your only option when using the i3bar output format as the separator is drawn by i3bar directly otherwise. For the other output formats, the provided non-empty string will be automatically enclosed with the necessary coloring bits if color support is enabled. i3bar supports Pango markup, allowing your format strings to specify font, color, size, etc. by setting the markup directive to "pango". Note that the ampersand ("&"), less-than ("<"), greater-than (">"), single-quote ("'"), and double-quote (""") characters need to be replaced with "&amp;", "&lt;", "&gt;", "&apos;", and "&quot;" respectively. This is done automatically for generated content (e.g. wireless ESSID, time). Example configuration: general { output_format = "xmobar" separator = " " } order += "load" order += "disk /" load { format = "[ load: %1min, %5min, %15min ]" } disk "/" { format = "%avail" } 5.2. IPv6 This module gets the IPv6 address used for outgoing connections (that is, the best available public IPv6 address on your computer) and the interface it is assigned to. Example format_up: %iface: %ip Example format_down: no IPv6 5.3. Disk Gets used, free, available and total amount of bytes on the given mounted filesystem. These values can also be expressed in percentages with the percentage_used, percentage_free, percentage_avail and percentage_used_of_avail formats. Byte sizes are presented in a human readable format using a set of prefixes whose type can be specified via the "prefix_type" option. Three sets of prefixes are available: binary IEC prefixes (Ki, Mi, Gi, Ti) represent multiples of powers of 1024. This is the default. decimal SI prefixes (k, M, G, T) represent multiples of powers of 1000. custom The custom prefixes (K, M, G, T) represent multiples of powers of 1024. It is possible to define a low_threshold that causes the disk text to be displayed using color_bad. The low_threshold type can be of threshold_type "bytes_free", "bytes_avail", "percentage_free", or "percentage_avail", where the former two can be prepended by a generic prefix (k, m, g, t) having prefix_type. So, if you configure low_threshold to 2, threshold_type to "gbytes_avail", and prefix_type to "binary", and the remaining available disk space is below 2 GiB, it will be colored bad. If not specified, threshold_type is assumed to be "percentage_avail" and low_threshold to be set to 0, which implies no coloring at all. You can customize the output format when below low_threshold with format_below_threshold. You can define a different format with the option "format_not_mounted" which is used if the path does not exist or is not a mount point. Defaults to "". Example order: disk /mnt/usbstick Example format: %free (%avail)/ %total Example format: %percentage_used used, %percentage_free free, %percentage_avail avail Example prefix_type: custom Example low_threshold: 5 Example format_below_threshold: Warning: %percentage_avail Example threshold_type: percentage_free 5.4. Run-watch Expands the given path to a pidfile and checks if the process ID found inside is valid (that is, if the process is running). You can use this to check if a specific application, such as a VPN client or your DHCP client is running. There also is an option format_down. You can hide the output with format_down="". Example order: run_watch DHCP Example format: %title: %status 5.5. Path-exists Checks if the given path exists in the filesystem. You can use this to check if something is active, like for example a VPN tunnel managed by NetworkManager. There also is an option format_down. You can hide the output with format_down="". Example order: path_exists VPN Example format: %title: %status 5.6. Wireless Gets the link quality, frequency and ESSID of the given wireless network interface. You can specify different format strings for the network being connected or not connected. The quality is padded with leading zeroes by default; to pad with something else use format_bitrate, format_noise, format_quality or format_signal. The special interface name _first_ will be replaced by the first wireless network interface found on the system (excluding devices starting with "lo"). Example order: wireless wlan0 Example format_up: W: (%quality at %essid, %bitrate / %frequency) %ip Example format_down: W: down Example format_bitrate: "%g %cb/s" Example format_noise: "%03d%s" Example format_quality: "%03d%s" Example format_signal: "%03d%s" 5.7. Ethernet Gets the IP address and (if possible) the link speed of the given ethernet interface. If no IPv4 address is available and an IPv6 address is, it will be displayed. The special interface name _first_ will be replaced by the first non-wireless network interface found on the system (excluding devices starting with "lo"). Example order: ethernet eth0 Example format_up: E: %ip (%speed) Example format_down: E: down 5.8. Battery Gets the status (charging, discharging, unknown, full), percentage, remaining time and power consumption (in Watts) of the given battery and when it’s estimated to be empty. If you want to use the last full capacity instead of the design capacity (when using the design capacity, it may happen that your battery is at 23% when fully charged because it’s old. In general, I want to see it this way, because it tells me how worn off my battery is.), just specify last_full_capacity = true. You can show seconds in the remaining time and empty time estimations by setting hide_seconds = false. If you want the battery percentage to be shown in another format, use format_percentage. integer_battery_capacity = true is a legacy option for format_percentage = "%.00f%s" If your battery is represented in a non-standard path in /sys, be sure to modify the path property accordingly, i.e. pointing to the uevent file on your system. The first occurrence of %d gets replaced with the battery number, but you can just hard-code a path as well. It is possible to define a low_threshold that causes the battery text to be colored color_bad. The low_threshold type can be of threshold_type "time" or "percentage". So, if you configure low_threshold to 10 and threshold_type to "time", and your battery lasts another 9 minutes, it will be colored color_bad. To show an aggregate of all batteries in the system, use "all" as the number. In this case (for Linux), the /sys path must contain the "%d" sequence. Otherwise, the number indicates the battery index as reported in /sys. Optionally custom strings including any UTF-8 symbols can be used for different battery states. This makes it possible to display individual symbols for each state (charging, discharging, unknown, full). Of course it will also work with special iconic fonts, such as FontAwesome. If any of these special status strings are omitted, the default (CHR, BAT, UNK, FULL) is used. Example order (for the first battery): battery 0 Example order (aggregate of all batteries): battery all Example format: %status %remaining (%emptytime %consumption) Example format_down: No battery Example format_percentage: "%.02f%s" Example status_chr: ⚡ CHR Example status_bat: 🔋 BAT Example status_unk: ? UNK Example status_full: ☻ FULL Example low_threshold: 30 Example threshold_type: time Example path (%d replaced by title number): /sys/class/power_supply/CMB%d/uevent Example path (ignoring the number): /sys/class/power_supply/CMB1/uevent 5.9. CPU-Temperature Gets the temperature of the given thermal zone. It is possible to define a max_threshold that will color the temperature red in case the specified thermal zone is getting too hot. Defaults to 75 degrees C. The output format when above max_threshold can be customized with format_above_threshold. Example order: cpu_temperature 0 Example format: T: %degrees °C Example max_threshold: 42 Example format_above_threshold: Warning T above threshold: %degrees °C Example path: /sys/devices/platform/coretemp.0/temp1_input 5.10. CPU Usage Gets the percentual CPU usage from /proc/stat (Linux) or sysctl(3) (FreeBSD/OpenBSD). It is possible to define a max_threshold that will color the load value with color_bad in case the CPU average over the last interval is getting higher than the configured threshold. Defaults to 95. The output format when above max_threshold can be customized with format_above_threshold. It is possible to define a degraded_threshold that will color the load value with color_degraded in case the CPU average over the last interval is getting higher than the configured threshold. Defaults to 90. The output format when above degraded threshold can be customized with format_above_degraded_threshold. For displaying the Nth CPU usage, you can use the %cpu<N> format string, starting from %cpu0. This feature is currently not supported in FreeBSD. Example order: cpu_usage Example format: all: %usage CPU_0: %cpu0 CPU_1: %cpu1 Example max_threshold: 75 Example format_above_threshold: Warning above threshold: %usage Example degraded'''
