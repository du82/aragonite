["https://iacr.org/news/item/25142"]
title = "IACR News item: 27 February 2025"
full_description = 'IACR News item: 27 February 2025 PhD students in cryptographic applications of algebraic curves Queensland University of Technology, Brisbane, Australia Job Posting We are inviting applications for PhD student scholarships in the School of Computer Science, Faculty of Science, Queensland University of Technology (QUT). Students who are interested in cryptographic applications of algebraic curves are encouraged to apply to work on one of the following two areas: - Isogeny-based post-quantum cryptography - Constructive and computational aspects of zk-SNARKs Applicants should have a strong background in mathematics and/or computer science and be highly motivated for research work with a demonstrated ability to work independently. Applications (cover letter, CV, transcripts, contacts for references) can be emailed to Craig Costello with "PhD applicant - YOUR NAME" in the subject. Applications will be processed continuously until the positions are filled. Closing date for applications: Contact: craig.costello@qut.edu.au Expand Additional news items may be found on the IACR news page.'
