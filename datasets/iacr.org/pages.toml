full_description = "Transactions on Symmetric Cryptology The IACR Transactions on Symmetric Cryptology (ToSC) is a scholarly journal for timely research papers on symmetric cryptology that seeks to combine the benefits of fast conference turnaround with consistent journal reviewing. ToSC is a Gold Open Access (free availability from day one) journal, published in electronic form by the Ruhr University of Bochum. It will become the publication venue for the IACR Fast Software Encryption conference, which operates as a journal/conference hybrid. Reading the journal: Transactions on Symmetric Cryptology is a journal started in 2016 and available online only, at http://tosc.iacr.org . Submission information: There are four submission deadlines per year. The latest deadlines can always be found on the transactions home page and in the Call for Papers of the next FSE conference . Editorial board: The editorial board of ToSC coincides with the program committee of FSE. The current editorial board/program committee can always be found on the transactions home page and in the Call for Papers of the next FSE conference . FSE steering committee Frequently asked questions"
