title = "IACR Committees and Special Roles (2024)"
full_description = "Committees and Special Roles (2024) As described in the bylaws and guidelines , the board of directors and the president of the IACR may appoint committees as required to assist them in the day-to-day functioning of the IACR. The members of these various committees are listed below. Observers and Special Roles The steering committee representatives participate as observers in the meetings of the board of directors. Steering Committee Chair Steering Committee Representative Asiacrypt Huaxiong Wang Masayuki Abe CHES Benedikt Gierlichs Peter Schwabe FSE Orr Dunkelman Gregor Leander PKC Yuliang Zheng Moti Yung TCC Tal Malkin Tal Malkin RWC Dan Boneh Kenny Paterson Other people participating as observers in the Board of Directors include: Archivist: Hilarie Orman Email: Database Administrator: Kevin S. McCurley Email: Code-of-Conduct Liaison: Tal Rabin Email: Program Chair Contact: Bart Preneel Email: Webmaster: Yu Yu Email: Audit Committee (2023) The audit committee takes delegates responsibility on behalf of the Board of Directors for ensuring that there is a framework for accountability; for examining and reviewing all systems and methods of control, especially financial systems; and for ensuring that IACR is complying with law, relevant regulations and good practice. The audit committee consists of: Allison Bishop Helena Handschuh Brian LaMacchia Greg Rose Benjamin Wesolowski Election Committee (2024) The IACR runs a yearly election to elect members of its Board of Directors. The Election Committee consists of: María Naya-Plasencia (chair) Shai Halevi Bart Preneel Investment Committee (2019) The Investment Committee oversees the IACR investments. Brian LaMacchia (IACR treasurer, ex-officio chair) Josh Benaloh Christian Cachin Helena Handschuh Greg Rose Ethics Committee (2023) The Ethics Committee of the IACR is responsible for providing recommendations to editors, program chairs, program-committee members, and reviewers concerning fairness and ethical aspects of all matters under the influence of the IACR, such as its operations, its events, and its publications. Allison Bishop (Chair) Britta Hale Anna Lysyanskaya Bart Preneel Tancrède Lepoint Schools Committee (2022) Starting in 2014, the IACR sponsors a small number of Cryptology Schools providing intensive training on clearly identified topics in cryptology. The schools comittee consist of: Jian Guo Sasha Boldyreva Marc Fischlin Tancrède Lepoint (chair) Anna Lysyanskaya"
