["https://iacr.org/museum"]
title = "IACR Museum of Historic Papers in Cryptology"
full_description = "IACR Museum of Historic Papers in Cryptology The history of cryptology up until the modern era has been chronicled by many authors, most notably David Kahn in his wonderful book The Codebreakers . In the past century, the intertwining of cryptology with national security has made it difficult to get access to some original source material. Beyond that, the fragility of paper and human memory have further obscured the picture. The IACR's Museum of Cryptology will try to fill in some of the gaps by being a repository for older research papers that have not been otherwise published for the public. If you would like to suggest or contribute papers please contact the archivist . We would like to have information about the original publication, where to find it, any copyright information that is available, and why it is significant. The index of the Museum: Claude Shannon's 1945 report A Mathematical Theory of Cryptography Michael Rabin's 1981 report How to Exchange Secrets with Oblivious Transfer"
year_published = 2025
clearnet = "https://iacr.org/museum"
