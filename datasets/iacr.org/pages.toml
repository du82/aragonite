["https://iacr.org/jobs"]
title = "Open Positions in Cryptology"
full_description = '''Open Positions in Cryptology Submit a job IACR provides a listing of open positions with a focus on cryptology. To advertise a job opportunity, please use the button to the right. Submissions should include the organization, title, description, a URL for further information, contact information, and a closing date (which may be "continuous"). The job will be posted for six months or until the closing date. Submissions in other formats than text will not be posted. There can be no attachments. This is intended to be a free service from an IACR member to the IACR membership. The content of the job posting is the responsibility of the person requesting the posting and not the IACR. Commercial enterprises who want to advertise their openings should identify at least one of their employees who is a member of IACR. Post-doctoral fellowship University of Waterloo The Department of Combinatorics and Optimization at the University of Waterloo invites applications from qualified candidates for 2-year postdoctoral fellowship appointments in post-quantum cryptography under the supervision of Prof. David Jao, Prof. Michele Mosca, and Prof. Douglas Stebila. A Ph.D. degree and evidence of excellence in research are required. Successful applicants are expected to maintain an active program of research, and participate in research activities with academic and industry partners in the grant. The annual salary is 70,000 CAD. In addition, a travel fund of 3,000 CAD per year is provided. The positions are available immediately. Interested individuals should apply using the MathJobs site (https://www.mathjobs.org/jobs/list/26357/). Applications should include a cover letter describing their interest in the position, a curriculum vitae and research statement and at least three reference letters. The University of Waterloo acknowledges that much of our work takes place on the traditional territory of the Neutral, Anishinaabeg and Haudenosaunee peoples. Our main campus is situated on the Haldimand Tract, the land granted to the Six Nations that includes six miles on each side of the Grand River. Our active work toward reconciliation takes place across our campuses through research, learning, teaching, and community building, and is centralized within our Indigenous Initiatives Office. The University regards equity and diversity as an integral part of academic excellence and is committed to accessibility for all employees. We encourage applications from candidates who have been historically disadvantaged and marginalized, including applicants who identify as Indigenous peoples (e.g., First Nations, Métis, Inuit/Inuk), Black, racialized, people with disabilities, women and/or 2SLGBTQ+. If you have any application, interview or workplace accommodation requests, please contact Carol Seely-Morrison (caseelymorrison@uwaterloo.ca). All qualified candidates are encouraged to apply; however, Canadians and permanent residents will be given priority. Contact: Douglas Stebila (dstebila@uwaterloo.ca) Last updated: 2025-02-27 posted on 2025-02-26 Ph.D. student Télécom Paris, Paris, France As part of a collaborative project on data protection, we are recruiting a PhD student to carry out research on advanced cryptography (e.g. homomorphic encryption, multiparty computation). Candidates should have a strong background in cryptography. The thesis must be completed by the end of December 2025. Contact: Sébastien Canard (sebastien.canard@telecom-paris.fr), Qingju Wang (qingju.wang@telecom-paris.fr) Last updated: 2025-02-27 posted on 2025-02-26 PhD students in cryptographic applications of algebraic curves Queensland University of Technology, Brisbane, Australia We are inviting applications for PhD student scholarships in the School of Computer Science, Faculty of Science, Queensland University of Technology (QUT). Students who are interested in cryptographic applications of algebraic curves are encouraged to apply to work on one of the following two areas: - Isogeny-based post-quantum cryptography - Constructive and computational aspects of zk-SNARKs Applicants should have a strong background in mathematics and/or computer science and be highly motivated for research work with a demonstrated ability to work independently. Applications (cover letter, CV, transcripts, contacts for references) can be emailed to Craig Costello with "PhD applicant - YOUR NAME" in the subject. Applications will be processed continuously until the positions are filled. Contact: craig.costello@qut.edu.au Last updated: 2025-02-27 posted on 2025-02-26 PhD Student in Cryptology KTH Royal Institute of Technology; Stockholm, Sweden Since this position requires Swedish citizenship, the below description of the position is available in Swedish only. Centrum för cyberförsvar och informationssäkerhet (CDIS) vid KTH — som är ett samarbete mellan KTH och Försvarsmakten, samt vissa andra myndigheter — söker doktorander. Det rör sig om en bred utlysning inom cybersäkerhetsområdet. Vi vill här särskilt peka ut en möjlig specialisering inom kryptologiområdet. Mer specifikt har KTH i samarbete med avdelningen för krypto och IT-säkerhet vid Must pågående spetsforskning som syftar till att möta de utmaningar som följer av kvantdatorutvecklingen. Vi söker nu inom ramen för CDIS utlysning en doktorand som kan bidra till den forskningen. Doktoranden kommer att handledas av Johan Håstad och/eller Douglas Wikström. Forskningssatsningen omfattar även Martin Ekerå och Joel Gärtner. Vid intresse, sök en av de av CDIS utlysta doktorandtjänsterna. Tjänsten kommer att omfatta 80% doktorandstudier vid KTH och 20% placering vid Must där möjlighet ges att arbeta med några av Sveriges främsta kryptologer. Resultatet för doktoranden blir en unik kombination av teori och praktik inom kryptologiområdet. För ytterligare information, kontakta Johan Håstad (johanh@kth.se) eller Martin Ekerå (ekera@kth.se). Sista ansökningsdag är den 13 mars 2025. Observera att svenskt medborgarskap är ett krav för tjänsten, och att tjänsten medför krav på säkerhetsprövning. Contact: For more information about the position, please contact Johan Håstad (johanh@kth.se) or Martin Ekerå (ekera@kth.se). Last updated: 2025-02-27 posted on 2025-02-25 Post-Doc in Cryptography Universität der Bundeswehr München, Germany We are looking for a bright researcher with strong interest and suitable experience in any of the following research areas: Secure computation: SMPC / FHE techniques and their use in protocol design, e.g. PSI PQC techniques for any of the aforementioned areas The successful candidate will be expected to lead on research activities in our upcoming research project on secure multi-party computation, funded by a German institution. They will work closely with members of the Privacy and Applied Cryptography (PACY) lab, led by Prof. Mark Manulis, and the Quantum-Safe and Advanced Cryptography (QuSAC) lab, led by Prof. Daniel Slamanig. The candidate will benefit from our modern infrastructure and availability of funds to support own research and travel. Also, Munich is amongst best places to live in Germany. This position is full-time and available for immediate start (~58k to 68k EUR p.a. depending on qualifications and experience) with initial contract for 2 years. Candidates without a doctoral degree but with sufficient research experience, e.g., final-year doctoral students, are also welcome to apply. Requirements: Master's degree (or equivalent) or PhD in Mathematics, Cryptography, or Computer Science with excellent grades Solid knowledge and demonstrable experience in any of the aforementioned research areas Post-doc candidates must have a strong track record (ideally with papers at IACR conferences and/or the top 4 security conferences) and good academic writing and presentation skills Experience with cryptographic implementations (desirable) Proficiency in English (essential) and German (desirable) A valid working permit for the EU Applications (cover letter, CV, transcripts, contacts for references) can be emailed to Prof. Mark Manulis. Applications will be processed continuously until the position is filled. Contact: Prof. Mark Manulis (mark.manulis [at] unibw [dot] de) Last updated: 2025-02-25 posted on 2025-02-25 Fully Funded Postdoc Position Monash University, Melbourne, Australia The post-quantum cryptography research group at Monash University, Australia, has a fully funded postdoc opening for a research project funded by Australian Research Council - Discovery Projects 2025, including in particular the following areas: Developing tools and techniques for FHE-based private cloud computation applications. Theory and applications of zk-SNARKs in FHE-based cloud computation. Secure and Efficient Implementations of zk-SNARK and FHE schemes and their applications. The candidate will have the opportunity to work in an excellent research environment and collaborate with experts in cryptography and with CryptoLab industry partners, as well as contributing to supervision and training of PhD students. Monash University is among the leading universities in Australia and is located in Melbourne, ranked as Australia's most liveable city and among the most liveable cities in the world. Applicants should have (or be expected to complete in the next 6 months) a PhD in mathematics, theoretical computer science, cryptography, engineering or closely related areas. Research experience in at least one of lattice-based cryptography, zero-knowledge proofs, or FHE is required. The candidate should have excellent English verbal and written communication skills. Programming experience and skills, especially in Sagemath, Python, Magma, and/or C/C++, are also highly desirable. To apply: Please apply by filling in the application form by 21st Apr 2025 at the following URL: https://forms.gle/YYZBb5uGwq4eGpT27 Contact: Ron Steinfeld (ron.steinfeld@monash.edu) Last updated: 2025-02-24 posted on 2025-02-21 PhDs / PostDocs in Cryptographic Engineering Research Institute Cyber Defence (CODE), Bundeswehr University Munich, Germany We have an opening of multiple PhD and Post-Doc researchers at the Research Institute CODE in Munich, Germany. All positions are available for start from March/April 2025 and are fully funded at federal salary levels TV-ÖD E13/14. The researcher will work closely with Michael Hutter who will start a professorship in Embedded Systems Security. The candidate will have the opportunity to travel and tackle cutting-edge challenges currently facing the industry (e.g., PQShield). Candidates will also gain experience with supporting teaching activities.We are seeking talented researchers with a strong interest and relevant experience in any of the following research areas: Applied cryptography with a focus on hardware and embedded systems security Physical attacks, side-channel leakage detection, fault analysis, hardware tampering, machine learning/deep learning/AI-driven techniques for SCA Secure and efficient implementations of cryptography, Post-Quantum Cryptography (PQC), privacy-preserving computing (MPC, FHE) ASIC/FPGA design security Requirements: Master's degree or PhD in Computer Science, Information Security, etc. PostDoc candidates must have a strong track record High motivation for research work and ability to work independently Eager to disseminate research results through publications and presentations at top-tie conferences. Fluency in written and spoken English (German desirable but not required) How to apply?Send an email to Michael Hutter with subject "Application CODE" including your motivation letter, CV, transcripts of grades, and references. Contact: Prof. Michael Hutter (michutte [AT] gmail dot com)Applications will be processed continuously until the positions are filled. Last updated: 2025-02-24 posted on 2025-02-20 PhD student University of Wollongong, Australia We are recruiting one PhD student to conduct research in privacy-preserving post-quantum cryptography. The position is fully funded for up to four years, with attractive stipends and travel grants. Applicants are expected to have a Master's degree in cryptography (or a closely related field) and proficiency in English. Applications will be processed continuously until the position is filled. Contact: Please send your applications (CV, transcripts, contacts for references) to Dr Khoa Nguyen (khoa@uow.edu.au). Last updated: 2025-02-24 posted on 2025-02-19 Faculty Position on Cybersecurity Universitat Politècnica de Catalunya (UPC)- BarcelonaTECH Several faculty positions within the Cybersecurity domain are available in Universitat Politecnica de Catalunya - BarcelonaTech (UPC), School of Engineering in Manresa. UPC is a leading research university in Spain with more than 5000 students studying on Information and Communication Technology related fields. It is the top Spanish university in terms of participation in EU-funded research projects. Apart from conducting research within their area, the successful candidates are expected to teach the recent MSc program on Cybersecurity, AI, and IoT areas, funded through the European Commission’s Digital Europe programme. The development of the MSc program will be part of a European project, in which the candidates will participate actively. Skills/Qualifications:PhD degree in the area of Computer Science, Computer Engineering, or a related fieldWritten and spoken proficiency in English (Spanish or Catalan is a plus)Proven scientific publication recordExperience in academic teaching (classes and lab courses) and supervising or co-supervising of academic theses What we offer: A friendly working environmentHybrid work modality with up to 40% home office optionWide range of internal and external training opportunities, various career optionsNice climate The initial appointment will be a visiting professor position (inline with the university staff categories), during the timeframe of which the recruited professors 