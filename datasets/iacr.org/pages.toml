["https://iacr.org/petitions"]
title = "IACR Petitions and Position Statements"
full_description = "IACR Petitions and Position Statements IACR Statement On the War in Gaza (Title revised on May 10, 2024) Original Statement of October 18, 2023 The IACR strongly condemns the atrocities perpetrated by Hamas against Israel. We are outraged and horrified by this dreadful assault on civilians: Israelis of all religions, ages, and backgrounds; tourists; and foreign workers. We stand in solidarity with the people of Israel. Our heartfelt sympathy and support go out to our members everywhere who are affected by that attack, and to all those who are suffering its ongoing consequences. Addendum as of May 10, 2024 The IACR is further horrified by the devastation and loss of life suffered by civilians in Gaza in the ongoing war, and the continued immense suffering in Gaza, Israel, and elsewhere. IACR Statement Condemning the Russian war in Ukraine (April 6, 2022) The IACR strongly condemns the unprovoked and unjust war that Russia is waging in Ukraine. We are outraged by the suffering and loss of life that this brutal aggression is inflicting on the Ukrainian People. IACR Statement Condemning US Immigration Ban (January 29, 2017) The IACR strongly opposes U.S. President Donald Trump’s Executive Order suspending visas to nationals of seven Muslim-majority countries. We declare such actions, which hurt international collaboration, to pose a concrete and direct threat to our mission, and to the continued international contributions of our members to society, industry, and government. IACR Response to Australia's Defence Trade Controls Act (July 6, 2015) The Australian government has passed legislation that subjects encryption to export controls, without exemptions for ordinary research & teaching activities. This petition calls on the Australian government to include exemptions so that the activities of Australian IACR members are not criminalized. IACR Statement On Mass Surveillance (May 14, 2014) A statement repudiating mass surveillance adopted by IACR members at the membership meeting of Eurocrypt 2014. For feedback or suggestions, please contact ."
