["https://iacr.org/fellows"]
title = "IACR Fellows"
full_description = 'IACR Fellows Nominations IACR has established the IACR Fellows Program to recognize outstanding IACR members for technical and professional contributions that: Advance the science, technology, and practice of cryptology and related fields; Promote the free exchange of ideas and information about cryptology and related fields; Develop and maintain the professional skill and integrity of individuals in the cryptologic community; Advance the standing of the cryptologic community in the wider scientific and technical world and promote fruitful relationships between the IACR and other scientific and technical organizations. In general, two broad categories of accomplishment will be considered: technical contributions and distinguished service to the cryptologic community. Fellows are expected to be "model citizens" of the cryptologic community, and thus most of them will have demonstrated sustained and significant accomplishment in both categories, but a very small number may be chosen for unique and crucial accomplishment in one category only. The number of Fellows to be selected in any one year is expected to be approximately 0.25% and should not exceed 0.5% of the total current membership. For more information see the IACR Fellows Program description. The program was approved by the IACR membership in 2002. 2024 Anne Canteaut Joan Feigenbaum Alfred Menezes Kobbi Nissim Chris Peikert David Pointcheval François-Xavier Standaert Brent Waters 2023 Jung Hee Cheon Stanisław Jarecki Marc Joye Jesper Buus Nielsen Rafael Pass Giuseppe Persiano Reihaneh Safavi-Naini 2022 Masayuki Abe Christian Cachin Claude Carlet Benny Pinkas Yael Tauman Kalai 2021 Craig Gentry Yehuda Lindell Josef Pieprzyk Leonid Reyzin Ingrid Verbauwhede 2020 Yevgeniy Dodis Rosario Gennaro Xuejia Lai Tal Malkin David Naccache 2019 Jonathan Katz Kaoru Kurosawa Daniele Micciancio Vincent Rijmen Amit Sahai Xiaoyun Wang 2018 Juan Garay Yuval Ishai Paul Kocher Stafford Tavares 2017 Jan Camenis