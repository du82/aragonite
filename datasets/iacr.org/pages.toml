["https://iacr.org/schools"]
title = "IACR Conferences"
full_description = '''IACR Cryptology Schools Starting in 2014, the IACR sponsors a small number of Cryptology Schools providing intensive training on clearly identified topics in cryptology. The aim is to develop awareness and increased capacity for research in cryptology. See also the IACR official policy regarding Cryptology Schools. A Cryptology School is typically held full-time for 4-5 days of intensive learning and constitutes an efficient way to provide high-quality training for graduate students, as well as for professionals. Attendance should be open to anyone who is interested and qualified. In order to facilitate learning, a school is usually taught by a few domain experts with a focus on educating the audience rather than impressing with results. In line with the mission of IACR, a Cryptology School should enable the audience to advance the theory and practice of cryptology and related fields. At some schools graduate students may also get an opportunity to present their work and gather feedback from the experts and teachers. Information on proposing an IACR Cryptology School. Upcoming IACR Cryptology Schools Spring School on Symmetric Cryptography 2025, March 10-March 14, 2025, Rome, Italy. Past IACR Cryptology Schools School on Cryptographic Attacks, October 13-October 16, 2014, Porto, Portugal. The Fourth Asian Workshop on Symmetric Key Cryptography - Cryptology School (ASK 2014), December 19-December 22, 2014, Chennai, India. School on Computer-aided Cryptography, June 1-June 4, 2015, College Park, USA. SAC Summer School (S3), August 10-August 12, 2015, Sackville, Canada. Summer school of the 19th Workshop on Elliptic Curve Cryptography (ECC 2015), September 23-September 25, 2015, Bordeaux, France. School on Design and Security of Cryptographic Algorithms and Devices, October 18-October 23, 2015, Sardinia, Italy. Blockchain Technologies; from cryptographic e-cash to modern cryptocurrency, May 29-June 2, 2016, Corfu, Greece. ECC2016 Computational Alg