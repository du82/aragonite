["https://iacr.org/meetings/ches"]
title = "CHES"
full_description = "Cryptographic Hardware and Embedded Systems (CHES) The Conference on Cryptographic Hardware and Embedded Systems (CHES) has been sponsored by IACR since 2004. The focus of this conference is on all aspects of cryptographic hardware and security in embedded systems. The conference is a forum for new results from the research community as well as from the industry and other interested parties. Of special interest are contributions that describe new methods for secure and efficient hardware implementations, and high-speed or leak-resistant software for embedded systems, e.g. smart cards, microprocessors, DSPs, etc. The conference aims to bridge the gap between the cryptography research community and the application areas of cryptography. All submitted papers will be reviewed. For information about CHES 2012, contact ches2012 at iacr.org. For information about organizing CHES in the future, contact chesrep at iacr.org. Information about previous years is available below. Information about publications from the conferences may be found in Cryptodb. CHES 2025, Kuala Lumpur, Malaysia. CHES 2024, Halifax, Canada. CHES 2023, Prague, Czechia. CHES 2022, Leuven, Belgium. CHES 2021, Virtual event, Anywhere on Earth. CHES 2020, Virtual Event, Anywhere on Earth. CHES 2019, Atlanta, USA. CHES 2018, Amsterdam, The Netherlands. CHES 2017, Taipei, Taiwan. CHES 2016, Santa Barbara, USA. CHES 2015, Saint Malo, France. CHES 2014, Busan, Korea. CHES 2013, Santa Barbara, USA. CHES 2012, Leuven, Belgium. CHES 2011, Nara, Japan. CHES 2010, Santa Barbara, USA. CHES 2009, Lausanne, Switzerland. CHES 2008, Washington, DC, USA. CHES 2007, Vienna, Austria. CHES 2006, Yokohama, Japan. CHES 2005, Edinburgh, Scotland. CHES 2004, Cambridge, USA. CHES 2003, Cologne, Germany. CHES 2002, Redwood Shores, CA, USA. CHES 2001, Paris, France. CHES 2000, Worcester, MA, USA. CHES 1999, Worcester, MA, USA."
