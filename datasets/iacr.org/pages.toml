Auckland, New Zealand. 14th International Conference on Security and Cryptography (SECRYPT 2017), July 26-28, 2017, Madrid, Spain. Conference on Selected Areas in Cryptography (SAC 2017), August 16-18, 2017, Ottawa, Canada. The 6th Technion Summer School on Cyber and Computer Security, September 10-14, 2017, Haifa, Israel. Conference on Number Theory Methods in Cryptology (NuTMiC'2017), September 11-13, 2017, Warsaw, Poland. 5th Int. Conf. on Cryptology and Information Security (Latincrypt 2017) (Latincrypt 2017), September 20-22, 2017, Havana, Cuba. Fourteenth Workshop on Fault Diagnosis and Tolerance in Cryptography (FDTC'17), September 25-25, 2015, Taipei, Taiwan. The 13th International Conference on Information Security and Cryptology (INSCRYPT 2017), November 3-5, 2017, Xi'an, China. 10th International Conference on Information Theoretic Security (ICITS 2017), November 29-December 2, 2017, Hong Kong, China. 16th International Conference on Cryptology and Network Security (CANS 2017), November 30-December 2, 2017, Hong Kong, Hong Kong. 7th Asian Workshop on Symmetric Key Cryptography (ASK 2017), December 9-11, 2017, Changsha, China. 18th International Conference on Cryptology in India ( INDOCRYPT'17), December 10-13, 2017, Chennai, India. 16th IMA International Conference on Cryptography and Coding (IMA Cryptography & Coding (C&C)), December 12-14, 2017, Oxford, United Kingdom. Seventh International Conference on Security, Privacy and Applied Crypto (SPACE 2017), December 15-17, 2017, Goa, India. 2016 School on Design for a Secure IoT, January 25-29, 2016, Tenerife, Spain. 1st CROSSING Winter School on Quantum Security (CXQS16), January 25-29, 2016, Darmstadt, Germany. Financial Cryptography and Data Security 2016 (FC '16), February 22-26, 2016, Rockley, Christ Church, Barbados. The Seventh International Conference on Post-Quantum Cryptography (PQCrypto 2016), February 24-26, 2016, Fukuoka, Japan. Spring School on Symmetric Cryptography, March 17-19, 2016, Bochu