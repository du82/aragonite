full_description = "Journal of Cryptology The Journal of Cryptology is the flagship journal of the International Association for Cryptologic Research, and provides a forum for publication of original results in all areas of modern information security. Journal Access IACR members can access JoC articles for free. Online access for others is available via the SpringerLink service. Information on back issues or non-member subscriptions is available directly from Springer. About The Journal of Cryptology started with volume 1 in 1988, and currently consists of four issues per year. It is published by Springer. IACR members receive a subscription to the Journal of Cryptology. Subscriptions are available to non-members directly from Springer. Journal homepage at Springer Current editorial board Submissions The journal accepts submissions of all kinds, including full research papers, short notes, and survey articles. Proposals for special issues are welcome and should be made to the current Editor-in-Chief. Interested in submitting a paper? JoC submission website Please note that the IACR Policy on Conflicts of Interest applies to all submissions. Papers are only accepted via the Journal of Cryptology submission website. If you are a referee, please review our referee guidelines. There are also some instructions for new associate editors."
