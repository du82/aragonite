title = "About CryptoDB"
full_description = "CryptoDB General About CryptoDB Report errors Publications Awards Invited talks/papers By year By venue With video Acceptance rates BibTeX People Most publications Coauthor statistics All Program committees Most Program committees About CryptoDB setActive('aboutCryptodb'); The goal of CryptoDB has been to collect and organize data about publications and committees of IACR. It includes statistics from Crypto, Eurocrypt, Asiacrypt, CHES, PKC, TCC, FSE, and the Journal of Cryptology. It recently started including Transactions on Cryptographic Hardware and Embedded Systems (TCHES), and Transactions on Symmetric Cryptology (ToSC). So far only a small amount of data has been imported from the ePrint archive, because the latter has character encoding problems. CryptoDB currently lists 16,812 publications or invited talks, by 9,793 authors, with data going back to 1981. It also includes 180 paper awards and 7,716 memberships on program committees by 1,388 people. CryptoDB also includes the cryptostats database from John Black. Some of the data has been imported from DBLP in cases where no other source existed. They deserve a lot of credit for maintaining a high-quality public database. You can select different views on the data using the menus on the top. There is further information about how the site is maintained, and a history of recent changes."
