["https://iaea.org/about/organizational-structure/department-of-management"]
title = "Department of Management | IAEA"
description = "The Department of Management provides a platform of services that enable the IAEA to successfully deliver its scientific and technical programmes. It provides solutions across a wide range of financial, human resources management, administrative, information technology, and general services to meet the needs of the Secretariat and Member States."
full_description = "The Department of Management provides a platform of services that enable the IAEA to successfully deliver its scientific and technical programmes. It provides solutions across a wide range of financial, human resources management, administrative, information technology, and general services to meet the needs of the Secretariat and Member States. Division of Budget and Finance The Division of Budget and Finance delivers services in support of all IAEA programmes. This includes programme budgeting; payments and accounting; and reporting on the use of financial resources to senior management, the Board of Governors and Member States. The Division is also responsible for the implementation and management of the Agency's financial information systems. The work of the Division is intended to ensure the continued confidence of the Board of Governors and Member States in the financial management of the Agency. Division of General Services The Division of General Services provides service functions for the IAEA, such as travel and transport support, facilities management, archives and records management, and management of the Vienna International Centre Commissary. It also provides support in all technical matters to the IAEA laboratories in Seibersdorf, Austria. Division of Conference and Document Services The Division of Conference and Document Services facilitates the exchange and dissemination of information relevant to the Agency's work and mandate between the Secretariat and Member States, and among Member States. To this end, the Division organizes meetings and conferences, and edits, prints and distributes documents and scientific and technical publications in the six official United Nations languages. Division of Human Resources The Division of Human Resources provides services ranging from human resource planning, recruitment, staff development and career management to compensation and benefits, as well as medical and health-related services. Division of Information Technology The Division of Information Technology provides secure, reliable and sustainable information communication and technology solutions and services."
year_published = 2025
