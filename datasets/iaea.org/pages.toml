["https://iaea.org/newscenter/news/iaea-profile-a-womans-mission-to-advance-nuclear-information-management"]
title = "IAEA Profile: A Woman’s Mission to Advance Nuclear Information Management | IAEA"
description = "The IAEA profiles employees to provide insight into the variety of career paths that support the Agency’s mission of Atoms for Peace and Development and to inspire and encourage readers, particularly women, to pursue careers in STEM (science, technology, engineering and mathematics) or STEM-adjacent fields."
full_description = 'If you would like to learn more about the IAEA’s work, sign up for our weekly updates containing our most important news, multimedia and more. Dibuleng Mohlakwana speaking at the ‘Innovative Technologies for Nuclear Information Management’ side event during the 68th IAEA General Conference in September 2024. (Photo: IAEA) The IAEA profiles employees to provide insight into the variety of career paths that support the Agency’s mission of Atoms for Peace and Development and to inspire and encourage readers, particularly women, to pursue careers in STEM (science, technology, engineering and mathematics) or STEM-adjacent fields. Read more profiles of women at the IAEA. Technology is increasingly shaping how we share and retrieve information, and demand for information continues to grow. As a result, information science stands at the forefront of innovation and knowledge sharing. "Information is key to driving performance in organizations, just like financial and human resources. Every decision relies on available data and information,” said Dibuleng Mohlakwana, Head of the IAEA Nuclear Information Section. "My mission at the IAEA is to help people make informed decisions and navigate the vast amount of information available today." With nearly 30 years of experience in information, knowledge and records management, Mohlakwana oversees the collection and management of nuclear information accessible to the IAEA and the public. Her role also involves introducing innovative tools and techniques to help the IAEA continuously improve how it shares, organizes and makes information accessible. Born in Limpopo Province, South Africa, Mohlakwana grew up in a family of educators and agriculturalists. From a young age, her family instilled in her the value of hard work, resilience and education, as well as the independence to carve her own path. This gave her a strong foundation for pursuing her ambitions. "Information science chose me,” Mohlakwana said. “At 17, I was drawn to information science while studying at the University of Limpopo. I realized effective information management is crucial for organizational success, motivating me to ensure that the right information reaches the right people at the right time." She went on to earn a master’s degree in information and knowledge management and a PhD in information science.'
year_published = 2025
