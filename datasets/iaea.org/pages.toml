["https://iaea.org/about/overview/gender-at-the-iaea/meet-the-mscfp-students"]
title = "Meet the Marie Sklodowska-Curie Fellowship Programme students | IAEA"
description = "“I am always surprised to see how people fear radioactive waste more than all the problems caused by a lack of energy. My objective is to work in a diverse scientific community, researching ways to get a fully closed nuclear fuel cycle, thus solving the radioactive waste problem that is one of the main concerns about nuclear energy today. And the most important for me is to"
full_description = 'If you would like to learn more about the IAEA’s work, sign up for our weekly updates containing our most important news, multimedia and more. “I am always surprised to see how people fear radioactive waste more than all the problems caused by a lack of energy. My objective is to work in a diverse scientific community, researching ways to get a fully closed nuclear fuel cycle, thus solving the radioactive waste problem that is one of the main concerns about nuclear energy today. And the most important for me is to inspire other young women in any country to not give up on their dream of working in the nuclear field. Since my first year at university, I always had to combine jobs and studies to help my parents pay my tuition fees, which was not an easy thing. With the IAEA MSCFP, things are different because they took away my financial stress, gave me the opportunity not just to do the master’s studies of my dream, but also to fully concentrate on my studies and research." Flora Mbouyom from Cameroon, studying nuclear energy at the IMT Atlantique Bretagne-Pays de la Loire, France “Thanks to the IAEA MSCFP, I was able to focus on my master’s degree without the financial burden. The scholarship helped cover the cost of living in a new country, and university tuition. I was able to shadow medical physicists and assist in different research projects related to the development of new technology for future patient care in radiation therapy. These experiences helped me obtain a placement in a medical physics residency program after graduation.” Elvia Reyes Guevara from Guatemala, studied nuclear science and applications at the University of Pennsylvania, United States "The IAEA MSCFP facilitated my immersion in research, while the internship component allowed me to build a strong network in the scientific and professional field at the IAEA Dosimetry Laboratory. Through these experiences, I gained the clarity needed to define my research interests and make an informed decision about pursuing a PhD programme that aligns with my aspirations."'
year_published = 2025
