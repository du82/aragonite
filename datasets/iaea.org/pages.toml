description = "The Medium Term Strategy has been prepared through a joint consultation process among Member States and the Secretariat. It covers a period of six years from 2018 to 2023."
full_description = "The Medium Term Strategy has been prepared through a joint consultation process among Member States and the Secretariat. It covers a period of six years from 2024 to 2029. The Medium Term Strategy serves as a strategic direction and roadmap for the Secretariat to prepare the Agency’s programme and budget during the period covered by it, by identifying priorities among and within its programmes for three biennia for the achievement of the Agency’s statutory objectives in an evolving international environment. The Medium Term Strategy 2024–2029 draws upon the Medium Term Strategy 2018–2023 and may be updated, if deemed necessary by the Board of Governors, adapting to new developments and evolving needs and priorities of Member States."
