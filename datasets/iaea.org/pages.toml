["https://iaea.org/about/procurement"]
title = "Procurement | IAEA"
description = "The IAEA procures goods and services with a total value of more than €100 million every year. A substantial number of these orders are for delivery to Member States in Africa, Asia, Europe and Latin America, with the remainder going to the IAEA's headquarters and its field laboratories and offices."
full_description = "The IAEA procures goods and services with a total value of more than €100 million every year. A substantial number of these orders are for delivery to Member States in Africa, Asia, Europe and Latin America, with the remainder going to the IAEA's headquarters and its field laboratories and offices. The Agency's Office of Procurement Services typically purchases: specialized construction services and security upgrades for nuclear related facilities; services for the disposal of spent nuclear fuel and other radioactive material; accelerators and cyclotrons for medical purposes; a wide range of equipment and services related to radiation detection; laboratory supplies; analytical instruments; isotopes; nuclear imaging and radiotherapy equipment; hydrology equipment; and goods and services related to nuclear safety and security. Other goods and services include those needed to maintain operations at IAEA headquarters, such as office equipment and supplies, facilities management services, information and communication technology, and various consultancy services. Bidding for business opportunities with the IAEA The IAEA carries out its procurement process under strict adherence to the principles of transparency, fairness, competition and best value, as well as international best practices. This is reflected throughout the evaluation and award process and is in accordance with the IAEA's Financial Regulations and Rules. The IAEA makes its business opportunities available on the United Nations Global Marketplace. All bids and proposals must be prepared and submitted according to the IAEA's General Instructions for Bidders and the Special Instructions to Bidders forming part of the relevant solicitation. Currently, prospective vendors do not need to register with the IAEA to participate in the solicitation process. However, the IAEA has rolled-out an iSupplier portal through which suppliers can submit their offers and invoices. With the launch of the iSupplier portal the IAEA will start progressively phasing out other channels of submission of offers and invoices, therefore suppliers are encouraged to register and submit their offers and invoices through the iSupplier portal; a navigation guide and training material can be found in the IAEA iSupplier portal once the vendor is registered. If a vendor is awarded a contract, the IAEA may request additional documentation as necessary. All orders, contracts and agreements are subject to the IAEA's General Conditions of Contract: General Conditions of Contract for Provision of Goods and Services General Conditions of Contract for Provision of Goods General Conditions of Contract for Provision of Services"
year_published = 2025
year_updated = 2025
