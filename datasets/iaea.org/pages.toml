["https://iaea.org/about/privacy-policy"]
title = "IAEA's Personal Data Privacy Policy | IAEA"
description = "The IAEA is committed to processing personal data in an accountable and non-discriminatory manner. As an autonomous intergovernmental organization in relationship with the United Nations, enjoying privileges and immunities that derive, inter alia, from its Statute, the IAEA is not bound by the EU's General Data Protection Regulation (GDPR). The IAEA processes, or ensures"
full_description = '''General Information The IAEA is committed to processing personal data in an accountable and non-discriminatory manner. As an autonomous intergovernmental organization in relationship with the United Nations, enjoying privileges and immunities that derive, inter alia, from its Statute, the IAEA is not bound by the EU's General Data Protection Regulation (GDPR). The IAEA processes, or ensures processing of, personal data in carrying out its mandated activities based on the IAEA Personal Data Privacy Policy. The IAEA defines "personal data" as information relating to a natural person (data subject) who can be uniquely identified by that information, either directly or indirectly through recognizable attributes. The IAEA uses the term "data processing" to describe all activities associated with the handling of personal data, including the collection, storage, usage, transfer and disposal of personal data. The Privacy Policy is integral to the IAEA's administrative framework on data governance. It is implemented without prejudice to the privileges and immunities of the IAEA, deriving from such instruments as the Statute and the Agreement on the Privileges and Immunities of the International Atomic Energy Agency. In line with our Privacy Policy, the IAEA processes personal data in accordance with the following principles: Fair and Legitimate Processing The IAEA processes personal data in a fair manner, and based on any of the following: The mandate and applicable legal framework of the IAEA, including its Statute and applicable decisions of its Policy-Making Organs; The best interests of the data subject, consistent with the mandate of the IAEA; The consent of the data subject, consistent with the mandate of the IAEA; or Any other legal basis specifically identified by the IAEA. Purpose Specification Personal data should be processed for one or more specific purpose(s), consistent with the IAEA’s mandate, and is not to be processed in a way incompatible with such purpose(s).'''
year_published = 2025
clearnet = "https://iaea.org/about/privacy-policy"
