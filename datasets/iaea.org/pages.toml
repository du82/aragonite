["https://iaea.org/ar/min-nahn/iidarat-aldamanat"]
title = "إدارة الضمانات | IAEA"
description = "تضطلع إدارة الضمانات بمهام ومسؤوليات الوكالة المنوطة بها بصفتها هيئة التفتيش المعنية بالأسلحة النووية في العالم، وتدعم الجهود العالمية لوقف انتشار الأسلحة النووية."
full_description = "موارد ذات صلة الضمانات والتحقق أساسيات ضمانات الوكالة تنفيذ الضمانات الإطار القانوني للضمانات مساعدة الدول كومباس - مبادرة الوكالة لبناء القدرات الشاملة للنظام الحكومي لحصر ومراقبة المواد النووية والسلطات الحكومية والإقليمية(باللغة الإنكليزية) تضطلع إدارة الضمانات بمهام ومسؤوليات الوكالة المنوطة بها بصفتها هيئة التفتيش المعنية بالأسلحة النووية في العالم، وتدعم الجهود العالمية لوقف انتشار الأسلحة النووية. ويتمثل الدور الرئيسي للإدارة في إدارة وتنفيذ ضمانات الوكالة الدولية للطاقة الذرية. كما تسهم في الحد من الأسلحة النووية ونزع السلاح، عن طريق تلبية طلبات التحقق والمساعدة التقنية الأخرى المرتبطة بالاتفاقات والترتيبات ذات الصلة. شُعَب العمليات لدى الإدارة ثلاث شعب للعمليات ومكتب للتحقق في إيران يضطلعون بدور محوري في التحقق من أن الدول التي لديها اتفاقات ضمانات سارية المفعول، لا يوجد بها تحريف للمواد النووية المعلنة عن الأنشطة النووية السلمية، ولا توجد بشأنها مؤشرات على وجود مواد نووية أو أنشطة غير معلنة في الدولة بأسرها. وتتولى كل شعبة مسؤولية تنفيذ الضمانات في منطقة جغرافية مختلفة: شعبة العمليات ألف – المنطقة الأسترالية الآسيوية وشرق آسيا قسم العمليات باء - الشرق الأوسط، وجنوب آسيا، وأفريقيا، وبعض الدول غير الأوروبية، والأمريكتان شعبة العمليات جيم - أوروبا والاتحاد الروسي وآسيا الوسطى مكتب التحقق في إيران ويجري كل قسم تقييماً بشأن مدى اتساق البرنامج النووي المعلن من الدولة في ضوء نتائج أنشطة التحقق التي تضطلع بها الوكالة بموجب اتفاق الضمانات ذي الصلة والبروتوكول الإضافي (حيثما ينطبق) بجانب جميع المعلومات الأخرى ذات الصلة بالضمانات المتاحة للوكالة. ويضطلعون جميعاً على وجه الخصوص بتقييم شامل للدولة يستند إلى جميع المعلومات المتاحة للوكالة الدولية للطاقة الذرية بشأن الأنشطة النووية والأنشطة ذات الطابع النووي التي تضطلع بها الدولة."
year_published = 2024
year_updated = 2024
