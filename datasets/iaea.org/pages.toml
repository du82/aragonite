["https://iaea.org/about/overview/sustainable-development-goals"]
title = "Sustainable Development Goals (SDGs) | IAEA"
description = "The IAEA, in line with its 'Atoms for Peace and Development' mandate, supports countries in their efforts to reach the 17 Sustainable Development Goals (SDGs) set out in the United Nations (UN) 2030 Agenda for Sustainable Development. Many countries use nuclear science and technology to contribute to and meet their development objectives in areas including energy, human"
full_description = "The IAEA, in line with its ‘Atoms for Peace and Development’ mandate, supports countries in their efforts to reach the 17 Sustainable Development Goals (SDGs) set out in the United Nations (UN) 2030 Agenda for Sustainable Development. Many countries use nuclear science and technology to contribute to and meet their development objectives in areas including energy, human health, food production, water management and environmental protection. The use of these techniques contributes directly to nine of the 17 SDGs. The 2030 Agenda was adopted in 2015. The Agenda’s 17 SDGs and their associated 169 targets aim at stimulating action over the next 15 years in areas of critical importance for humanity and the planet. They are integrated and indivisible and balance the three dimensions of sustainable development: the economic, social and environmental. Related resources IAEA and the SDGs Video Series: Nuclear Science for Sustainable Development How the IAEA Will Contribute to the Sustainable Development Goals"
year_published = 2025
