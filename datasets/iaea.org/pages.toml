title = "Meet our staff | IAEA"
full_description = 'If you would like to learn more about the IAEA’s work, sign up for our weekly updates containing our most important news, multimedia and more. Hailing from Kinshasa, the capital of the Democratic Republic of Congo, Carmen Kibonge has taken a path shaped by a passion for numbers, a supportive family and a commitment to make a difference, which eventually led her to the IAEA. Read more → “I want every country to have a cancer plan and more people to know about the cancer work that the IAEA does," says Lisa Stevens reflecting on her work at the IAEA. Read more → “I was fascinated by the idea that someone on one side of the world could communicate with someone on the other side because of technology. It really spoke to me,” says Rutendo Zvirawa, reflecting on what inspired her to pursue a career in information technology. Read more → Zeynep Gulerce’s career has been shaped by earthquakes. She was a young civil-engineer-in-training in Türkiye when a magnitude 7.4 earthquake struck the Kocaeli Province of the country. Read more → “I want to contribute to narrowing the energy equity gap to ensure more people can access affordable, sustainable and clean energy,” says Gloria Kwong reflecting on her work at the IAEA. Read more → Vienna International Centre, PO Box 100 A-1400 Vienna, Austria Telephone: +43 (1) 2600-0, Facsimile +43 (1) 2600-7'
