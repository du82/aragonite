["https://iaea.org/ar/min-nahn/almusawat-bayn-aljinsayn-fi-alwikala"]
title = "المساواة بين الجنسين في الوكالة | IAEA"
description = 'الوكالة الدولية للطاقة الذرية ملتزمةٌ بالمساواة بين الجنسين وبدعم قدرة الأفراد كافةً، بغض النظر عن نوع الجنس، على الإسهام في برامجها وأنشطتها والاستفادة منها على قدم المساواة. وتحقيقاً لهذه الغاية، تسعى الوكالة جاهدةً لتحقيق التوازن بين الجنسين في الأمانة وتنفيذ تعميم مراعاة المنظور الجنساني في برامجها وأنشطتها. "تأتي المساواة بين الجنسين وتمكين المرأة في صميم أهداف التنمية'
full_description = 'موارد ذات صلة الحلقة الدراسية الشبكية بشأن اليوم الدولي للمرأة لعام ٢٠٢١ (باللغة الإنكليزية) اليوم الدولي للمرأة لعام ٢٠٢٠ - يجب أن نحسّن أداءنا (باللغة الإنكليزية) لقيم الأخلاقية الأساسية لدى الوكالة (باللغة الإنكليزية) شؤون الموظفين - التوظيف في أمانة الوكالة شؤون الموظفين - المرأة في األمانة الرابطة العالمية للعاملات في المجال النووي (باللغة الإنكليزية) رابطة العاملات في المجال النووي – فرع الوكالة (باللغة الإنكليزية) الوكالة الدولية للطاقة الذرية ملتزمةٌ بالمساواة بين الجنسين وبدعم قدرة الأفراد كافةً، بغض النظر عن نوع الجنس، على الإسهام في برامجها وأنشطتها والاستفادة منها على قدم المساواة. وتحقيقاً لهذه الغاية، تسعى الوكالة جاهدةً لتحقيق التوازن بين الجنسين في الأمانة وتنفيذ تعميم مراعاة المنظور الجنساني في برامجها وأنشطتها. "تأتي المساواة بين الجنسين وتمكين المرأة في صميم أهداف التنمية المستدامة، وهُما مسألتان حيويتان للإعمال الكامل لحقوق وإمكانات الجميع. ويجب أن ترشد هذه الأهداف الأساسية عملنا في الوكالة." المدير العام، رافائيل ماريانو غروسي انقر هنا لمعرفة المزيد عن العمل لدى الوكالة والاطلاع على الوظائف الشاغرة الحالية!'
