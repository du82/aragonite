["https://iaea.org/about/overview/budget"]
title = "Budget | IAEA"
description = "The IAEA carries out its work in two main areas: the regular programme and the Technical Cooperation programme. These two programmes are financed from separate funds. They are additionally supported by extra-budgetary contributions from Member States and non-member states donors. The IAEA's budget is approved annually by the IAEA General Conference"
full_description = "The IAEA carries out its work in two main areas: the regular programme and the Technical Cooperation programme. These two programmes are financed from separate funds. They are additionally supported by extra-budgetary contributions from Member States and non-member states donors. The IAEA's budget is approved annually by the IAEA General Conference In 2000, the IAEA adopted the Results Based Approach for the development of its programme. Results based programming and budgeting involves formulating a programme and budget that is driven by a number of desired results that are articulated at the outset of the process, and against which actual performance is measured at the end of the programme and budget cycle. In a results based approach, programme formulation follows a sequence of steps intended to ensure that the programme is designed to meet the needs of Member States and makes the best use of the Agency's potential. The Agency's main sources of funding are the Regular Budget Fund, the Technical Cooperation Fund and Extrabudgetary Programme Funds. These are mainly supplied by Member States and, in some cases, by other donors. Contributions to the extrabudgetary funds and the Technical Cooperation Fund are voluntary. Regular budget The regular budget consists of an operational and a capital component. While the first component is used to finance ongoing operational costs, the capital component is used to finance major infrastructure investments in line with the IAEA's major capital investment plan. The regular budget is divided into six major programmes, in accordance with the structure of the Agency's work programme. See the Regular Budget Appropriations for the year: - Arabic | Chinese | English | French | Russian | Spanish Technical Co-operation funding The IAEA’s technical co-operation activities are financed from the Technical Co-operation Fund and extrabudgetary contributions. The Fund comprises voluntary contributions, for which the Agency’s Board of Governors recommends a target each year. See the Technical Cooperation Fund Allocation for the year: - Arabic | Chinese | English | French | Russian | Spanish"
year_published = 2025
