["https://iaea.org/fr/laiea/la-parite-a-laiea"]
title = "La parité à l’AIEA | AIEA"
description = "L’Agence internationale de l’énergie atomique est déterminée à respecter l’égalité des sexes et à aider toute personne, quel que soit son sexe, à contribuer en toute égalité à ses programmes et activités et à en tirer avantage. À cette fin, elle s’efforce de parvenir à une représentation équilibrée des femmes et des hommes au sein du Secrétariat et de prendre en compte les"
full_description = "L’Agence internationale de l’énergie atomique est déterminée à respecter l’égalité des sexes et à aider toute personne, quel que soit son sexe, à contribuer en toute égalité à ses programmes et activités et à en tirer avantage. À cette fin, elle s’efforce de parvenir à une représentation équilibrée des femmes et des hommes au sein du Secrétariat et de prendre en compte les questions de genre dans ses programmes et activités. « L’égalité des sexes et l’autonomisation des femmes sont au cœur des objectifs de développement durable et sont essentielles à la pleine réalisation des droits et du potentiel de chacun. Ces objectifs fondamentaux doivent aussi orienter les travaux que nous menons à l’AIEA. » Rafael Mariano Grossi, Directeur général de l’AIEA Cliquez ici pour en savoir plus sur les conditions de travail à l’AIEA et consulter les vacances de postes ! Ressources connexes Webinaire sur la Journée internationale de la femme 2021 (en anglais) Journée internationale de la femme 2020 - Nous devons faire mieux (en anglais) Valeurs éthiques fondamentales de l’AIEA (en anglais) Personnel - Composition de l’effectif du Secrétariat de l’Agence Personnel - Les femmes au Secrétariat Women in Nuclear Global (en anglais) Women in Nuclear - Section AIEA (en anglais)"
