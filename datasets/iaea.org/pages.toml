["https://iaea.org/about/overview/gender-at-the-iaea/women-in-nuclear-security-initiative-winsi"]
title = "Women in Nuclear Security Initiative (WINSI) | IAEA"
description = "The mission of the Women in Nuclear Security Initiative (WINSI) is to support the achievement of gender equality in nuclear security both within the IAEA’s Division of Nuclear Security and the global community of practice."
full_description = 'The mission of the Women in Nuclear Security Initiative (WINSI) is to support the achievement of gender equality in nuclear security both within the IAEA’s Division of Nuclear Security and the global community of practice. WINSI was launched in March 2021 by the IAEA’s Division of Nuclear Security to contribute to IAEA Director General Rafael Mariano Grossi’s vision to establishing the IAEA as a leading global voice for gender equality in the nuclear field. The Initiative is set up as an interest group under Women in Nuclear Global, which aims to promote and strengthen the involvement of women in nuclear security worldwide as well as to enhance the attractiveness of nuclear security jobs and careers to women, especially for the next generation. WINSI will carry out activities to highlight the experiences and achievements of women in nuclear security as well as concerns and challenges that women may face, and to increase awareness of the Agency’s programme on nuclear security, as well as Agency’s work on gender equality. "Nuclear security needs the talents of both men and women, as diversity and gender equality bring benefits to all fields. However, women are underrepresented in nuclear security, as well as in the nuclear field in general, so it is important to understand and tackle the barriers that women can face to joining and thriving in the field. I hope that through this important initiative, we can learn from the experiences of women from the Agency and Member States, and contribute to promoting and strengthening the involvement of women in nuclear security worldwide." Elena Buglova, Director of the IAEA Division of Nuclear Security WINSI has organized and hosted in 2021-2022 the following webinars: The Role of the IAEA in Strengthening Capacity of Women in Nuclear Security Worldwide Women in Information and Computer Security in the Nuclear World Women in Nuclear Security Inspections Women in Nuclear Security Law Enforcement In partnership with four renowned international universities, WINSI organized during 2022 four webinars with the aim to establish an international forum where knowledge on existing programmes and opportunities in nuclear security education can be shared: Webinar in cooperation with Amity University (India) Webinar in cooperation with Purdue University (USA) Webinar in cooperation with Mansoura University (Egypt) Webinar in cooperation with Hertie School (Germany) Details on upcoming events and general information on Nuclear Security webinars can be found here.'
year_published = 2025
