title = "Gender at the IAEA | IAEA"
description = "The International Atomic Energy Agency is committed to gender equality. To this end it is carrying out initiatives for gender balance among its professional staff and senior management, and it is mainstreaming gender considerations into its programmatic work."
full_description = '''The International Atomic Energy Agency is committed to gender equality and to supporting the ability of all individuals, regardless of gender, to equally contribute to and benefit from its programmes and activities. To this end, the IAEA strives to achieve gender balance in the Secretariat and to implement gender mainstreaming in its programmes and activities. "Gender equality and the empowerment of women lie at the heart of the Sustainable Development Goals and they are vital to fully realizing the rights and potential of everyone. These fundamental aims must also inform our work at the IAEA." ​​​- ​IAEA Director General, Rafael Mariano ​Grossi Click here to learn more about working at the IAEA and view our current vacancies! Related resources International Women's Day 2021 Webinar International Women's Day 2020 - We Must Do Better IAEA core ethical values Personnel - Staffing of the Agency's Secretariat Personnel - Women in the Secretariat Women in Nuclear – Global Women in Nuclear - IAEA Chapter IAEA Marie Sklodowska-Curie Fellowship Programme Lise Meitner Programme'''
