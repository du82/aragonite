["https://iaea.org/es/el-oiea/departamento-de-salvaguardias"]
title = "Departamento de Salvaguardias | OIEA"
description = "El Departamento de Salvaguardias se encarga de cumplir las funciones y responsabilidades del OIEA en su calidad de órgano mundial responsable de las actividades de inspección en el ámbito nuclear y prestar apoyo a los esfuerzos mundiales para poner fin a la proliferación de armas nucleares."
full_description = "El Departamento de Salvaguardias se encarga de cumplir las funciones y responsabilidades del OIEA en su calidad de órgano mundial responsable de las actividades de inspección en el ámbito nuclear y prestar apoyo a los esfuerzos mundiales para poner fin a la proliferación de armas nucleares. La función primordial del Departamento es administrar y aplicar las salvaguardias del OIEA. También contribuye al control de las armas nucleares y al desarme nuclear respondiendo a las solicitudes de verificación y otras formas de asistencia técnica asociadas a los acuerdos y arreglos conexos. Divisiones de Operaciones El Departamento cuenta con tres divisiones de operaciones y la Oficina de Verificación para el Irán, que desempeñan un papel fundamental en la tarea de verificar que en los Estados con acuerdos de salvaguardias en vigor no se desvían los materiales nucleares declarados de actividades nucleares con fines pacíficos a otros fines y que no existen indicaciones de la existencia de materiales o actividades nucleares no declarados en el Estado en su conjunto. Cada una de las divisiones se encarga de la aplicación de las salvaguardias en una zona geográfica diferente: División de Operaciones A: Australasia y Asia oriental. División de Operaciones B: Oriente Medio, Asia meridional, África, algunos Estados europeos no miembros de la UE y América. División de Operaciones C: Europa, Federación de Rusia y Asia central. Oficina de Verificación para el Irán. Cada una de las divisiones lleva a cabo una evaluación de la correspondencia entre el programa nuclear declarado del Estado y los resultados de las actividades de verificación del Organismo en virtud del acuerdo de salvaguardias correspondiente, el protocolo adicional (cuando corresponda) y cualquier otra información concerniente a las salvaguardias de que disponga el Organismo. En concreto, las divisiones realizan una evaluación exhaustiva del Estado basada en toda la información de que dispone el OIEA sobre las actividades nucleares y actividades conexas del Estado."
year_published = 2024
year_updated = 2024
