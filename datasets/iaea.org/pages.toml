["https://iaea.org/about/governance/board-of-governors"]
title = "Board of Governors | IAEA"
description = "The General Conference consisting of representatives of the IAEA Member States meets in a regular annual session, usually in September, to consider and approve the IAEA's budget and to decide on other issues raised by the Board of Governors, the Director General and Member States."
full_description = "The Board of Governors is one of the two policy-making bodies of the IAEA, along with the annual General Conference of IAEA Member States. The Board examines and makes recommendations to the General Conference on the IAEA's financial statements, programme and budget. It considers applications for membership, approves safeguards agreements and the publication of the IAEA's safety standards. It also appoints the Director General of the IAEA, with the approval of the General Conference. The Board generally meets five times per year: in March and June, twice in September (before and after the General Conference) and in November. Board Members for 2024–2025 The 35 Board Members for 2024-2025 are Algeria, Argentina, Armenia, Australia, Bangladesh, Belgium, Brazil, Burkina Faso, Canada, China, Colombia, Ecuador, Egypt, France, Georgia, Germany, Ghana, India, Indonesia, Italy, Japan, the Republic of Korea, Luxembourg, Morocco, the Kingdom of the Netherlands, Pakistan, Paraguay, the Russian Federation, South Africa, Spain, Thailand, Ukraine, the United Kingdom of Great Britain and Northern Ireland, the United States of America and the Bolivarian Republic of Venezuela. Related resources Rules and Procedures of the Board of Governors IAEA General Conference List of Member States"
