full_description = "El Organismo Internacional de Energía Atómica está comprometido con la igualdad de género y el apoyo a la capacidad de todas las personas, independientemente de su género, para contribuir por igual a sus programas y actividades y beneficiarse de ellos. Para ello, el OIEA se esfuerza por lograr un equilibrio de género en la Secretaría y por incorporar la perspectiva de género en sus programas y actividades. “La igualdad de género y el empoderamiento de la mujer son elementos centrales de los Objetivos de Desarrollo Sostenible y son fundamentales para la plena realización de los derechos y el potencial de todos. Estos objetivos fundamentales también deben orientar nuestra labor en el OIEA”. ​​​- ​ Director General, Rafael Mariano ​Grossi Haga clic aquí para saber más sobre el trabajo en el OIEA y acceder a nuestras vacantes actuales Recursos conexos Día Internacional de la Mujer 2021: seminario web (en inglés) Día Internacional de la Mujer 2020 — Debemos hacerlo mejor (en inglés) Valores éticos fundamentales del OIEA (en inglés) Personal - Personal de la Secretaría del Organismo Personal - Mujeres en la Secretaría Women in Nuclear - Global (en inglés) Women in Nuclear - en el OIEA (en inglés)"
