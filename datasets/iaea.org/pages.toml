["https://iaea.org/fr/laiea/departement-des-garanties"]
title = "Département des garanties | AIEA"
description = "Le Département des garanties s’acquitte des tâches et responsabilités qui lui sont confiées par l’AIEA en tant qu’organisme chargé des inspections nucléaires dans le monde, en appuyant les efforts déployés au niveau mondial pour stopper la prolifération des armes nucléaires."
full_description = "Le Département des garanties s’acquitte des tâches et responsabilités qui lui sont confiées par l’AIEA en tant qu’organisme chargé des inspections nucléaires dans le monde, en appuyant les efforts déployés au niveau mondial pour stopper la prolifération des armes nucléaires. Le principal rôle du Département est d’appliquer et de mettre en œuvre les garanties de l’AIEA. Il contribue également à la limitation des armes nucléaires et au désarmement nucléaire en répondant aux demandes de vérification et de toute autre assistance technique découlant des accords et arrangements connexes. Divisions des opérations Le Département possède trois Divisions des opérations et un Bureau de vérification en Iran, qui jouent un rôle primordial en vérifiant que, pour les États ayant des accords de garanties en vigueur, il n’y a pas de détournement de matières nucléaires déclarées d’activités nucléaires pacifiques, ni d’indice de matières ou d’activités nucléaires non déclarées au niveau de l’État dans son ensemble. Chacune des Divisions est chargée d’appliquer les garanties dans une zone géographique donnée, comme suit : Division des opérations A - Australasie et Asie de l’Est Division des opérations B - Moyen-Orient, Asie du Sud, Afrique, certains États d’Europe non-membres de l’UE, et continent américain Division des opérations C - Europe, Fédération de Russie et Asie centrale Bureau de vérification en Iran Chaque division évalue la cohérence du programme nucléaire déclaré de l’État avec d’une part les résultats des activités de vérification exécutées par l’Agence dans le cadre de l’accord de garanties pertinent, du protocole additionnel (le cas échéant), d’autre part toutes les autres informations pertinentes pour les garanties dont dispose l’AIEA. Les divisions effectuent notamment une évaluation exhaustive au niveau de l’État sur la base de toutes les informations dont dispose l’Agence au sujet des activités nucléaires et connexes dudit État."
year_published = 2024
year_updated = 2024
