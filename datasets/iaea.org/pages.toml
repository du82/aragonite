["https://iaea.org/about/employment/internships"]
title = "IAEA Internship programme | IAEA"
description = "The purpose of the IAEA internship programme is to provide people studying toward a university degree or who have recently received a degree with the opportunity to gain practical work experience in line with their studies or interests, and expose them to the work of the Agency and the United Nations. At the same time, it  benefits the IAEA and its programmatic work to obtain"
full_description = "Practical experience in an international environment The purpose of the IAEA internship programme is to provide people studying toward a university degree or who have recently received a degree with the opportunity to gain practical work experience in line with their studies or interests, and expose them to the work of the Agency and the United Nations. At the same time, it benefits the IAEA and its programmatic work to obtain the assistance of qualified students specialized in various professional fields. Duration of the programme The duration of internships is normally not less than three months and not more than one year. Interns are subject to the authority of the Director General and must observe all applicable IAEA rules, regulations, instructions and procedures. Requirements of the programme To be eligible for the internship programme, applicants must meet the following conditions: Be at least 20 years of age; Have completed at least three years of full-time studies at a university or equivalent institution towards the completion of their first degree; May apply up to one year after the completion of a bachelor's, master's, or doctorate degree. Applications submitted after that time will not be considered. Applicants must not have previously participated in the Agency’s internship programme; A working (oral and written) knowledge of English is essential. Knowledge of other official IAEA languages (Arabic, Chinese, French, Russian, or Spanish) is an asset, and Should be able to adapt to an international, multicultural and multilingual environment, have good communication skills and be able to work in a team. Interns are selected from candidates whose study disciplines are relevant to the Agency's work. Stipend for the programme The IAEA provides a stipend to interns working full-time at a rate of €1450 per month. The stipend is not a salary, but an allowance to assist with basic subsistence costs during the internship period. The interns are responsible for their own travel expenses to and from the duty station as well as visa expenses."
year_published = 2025
