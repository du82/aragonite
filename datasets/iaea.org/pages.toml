["https://iaea.org/about/overview/statute"]
title = "Statute | IAEA"
description = "The Statute of the IAEA was approved on 23 October 1956 by the Conference on the Statute of the International Atomic Energy Agency, which was held at the Headquarters of the United Nations. It came into force on 29 July 1957."
full_description = "The Statute of the IAEA was approved on 23 October 1956 by the Conference on the Statute of the International Atomic Energy Agency, which was held at the Headquarters of the United Nations. It came into force on 29 July 1957. The Statute has been amended three times by application of the procedure laid down in paragraphs A and C of Article XVIII. On 31 January 1963, some amendments to the first sentence of the then paragraph A.3 of Article Vl came into force; the Statute as thus amended was further amended on 1 June 1973 by the coming into force of a number of amendments to paragraphs A to D of the same Article (involving a renumbering of sub-paragraphs in paragraph A); and on 28 December 1989 an amendment in the introductory part of paragraph A.l came into force. All these amendments have been incorporated in the text of the Statute, which consequently supersedes all earlier editions. Related resources Statute of the IAEA - Arabic - Chinese - English - French - Russian - Spanish Amendments to the Statute of the IAEA Efficiency and Transparency"
