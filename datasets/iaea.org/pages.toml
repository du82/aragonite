["https://iaea.org/about/governance/general-conference"]
title = "General Conference | IAEA"
description = "The General Conference consisting of representatives of the IAEA Member States meets in a regular annual session, usually in September, to consider and approve the IAEA's  budget and to decide on other issues raised by the Board of Governors, the Director General and Member States."
full_description = "The General Conference consisting of representatives of the IAEA Member States meets in a regular annual session, usually in September, to consider and approve the IAEA's budget and to decide on other issues raised by the Board of Governors, the Director General and Member States. Representatives of IAEA Member States and invited non-Member States and organizations may register for the General Conference in accordance with such rules as the General Conference has approved. The General Conference elects a President and members of the General Committee at the beginning of each annual session. They hold office for the duration of the session. In conjunction with the General Conference, the IAEA regularly organizes a Scientific Forum on topics related to nuclear technology and science. Annual IAEA General Conference The IAEA General Conference is set to take place in September each year at the Vienna International Centre (VIC) in Vienna, Austria, where high-ranking officials and representatives from IAEA Member States will consider a range of issues. For further information on the IAEA General Conferences, past and forthcoming, please see the General Conference Archives. Scientific Forum at the General Conference In conjunction with the General Conference, the IAEA regularly organizes a Scientific Forum on topics related to nuclear technology and science. It takes place at the Vienna International Centre (VIC) in Vienna, the site of the General Conference. Exhibitions Member States and accredited organizations wishing to take part as exhibitors — usually set up as a side event to the General Conference — are kindly invited to submit their space requests in advance. Relevant information and specifications will be made available to the prospective exhibitors in due course. It should be noted that specific stands may not be automatically reserved every year by one Member State, but will be assigned by Conference Services on a rotational basis. For any additional information, please contact the IAEA Conference Services Section."
