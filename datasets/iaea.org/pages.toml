["https://iaea.org/about/department-of-safeguards"]
title = "Department of Safeguards | IAEA"
description = "The Department of Safeguards carries out the IAEA’s duties and responsibilities as the world’s nuclear inspectorate, supporting global efforts to stop the spread of nuclear weapons."
full_description = "The Department of Safeguards carries out the IAEA’s duties and responsibilities as the world’s nuclear inspectorate, supporting global efforts to stop the spread of nuclear weapons. The primary role of the Department is to administer and implement IAEA Safeguards. It also contributes to nuclear arms control and disarmament, by responding to requests for verification and other technical assistance associated with related agreements and arrangements. Divisions of Operations The Department has three Divisions of Operations and the Office for Verification in Iran, which play a pivotal role in verifying that for States with safeguards agreements in force, there is no diversion of declared nuclear material from peaceful nuclear activities and no indications of undeclared nuclear material or activities in the State as a whole. Each of the Divisions is responsible for the implementation of safeguards in a different geographical area: Division of Operations A - Australasia and East Asia Division of Operations B - Middle East, South Asia, Africa, some non-EU European states, and the Americas Division of Operations C - Europe, the Russian Federation and Central Asia Office for Verification in Iran Each Division conducts an evaluation of the consistency of the State's declared nuclear programme against the results of the Agency's verification activities under the relevant Safeguards Agreement, Additional Protocol (where applicable) and with all other safeguards-relevant information available to the Agency. In particular, they perform a comprehensive State evaluation based on all information available to the IAEA about the State's nuclear and nuclear-related activities. Division of Concepts and Planning This Division develops concepts, approaches and methods for safeguarding nuclear material, facilities and activities; prepares safeguards policy and guidance documentation; assists the Divisions of Operations with safeguards implementation issues; and supports advisory and policy-making bodies. It also conducts strategic planning for the Department and coordinates research and development activities, including the management of Member State Support Programmes. The Division also provides assistance to personnel from Member States through training, advisory missions and guidance documents."
year_published = 2018
year_updated = 2018
