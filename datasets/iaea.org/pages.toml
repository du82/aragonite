["https://iaea.org/ar/min-nahn/aleamal-fi-alwakalat-alduwaliat-lilttaqat-aldhariya"]
title = "العمل لدى الوكالة الدولية للطاقة الذرية | IAEA"
description = "توفر الوكالة بيئة عمل دينامية ومتعددة الثقافات. ويفد موظفوها من أكثر من 100 بلد ويعملون في مجموعة واسعة من المجالات التقنية والعلمية."
full_description = "كتيبات إطار الكفاءات: دليل لمديري وموظفي الوكالة الدولية للطاقة الذرية (باللغة الإنكليزية) السكن والعيش في فيينا (باللغة الإنكليزية) نقل الأثاث المنزلي (باللغة الإنكليزية) معلومات إضافية القيم الأخلاقية الأساسية للوكالة (باللغة الإنكليزية) شروط عمل الموظفين في الفئة الفنية (باللغة الإنكليزية) شروط عمل الموظفين في فئة الخدمات العامة (باللغة الإنكليزية) شروط التدريب الداخلي في الوكالة (باللغة الإنكليزية) توفر الوكالة بيئة عمل دينامية ومتعددة الثقافات. ويفد موظفوها من أكثر من 100 بلد ويعملون في مجموعة واسعة من المجالات التقنية والعلمية. والوكالة الدولية للطاقة الذرية لديها قوة عاملة على مستوى عالمي تتَّسم بالتنوُّع وتعدُّد التخصُّصات. ويعمل في الوكالة أكثر من 2500 موظف في طائفة واسعة من التخصصات النووية والمتصلة بالمجال النووي، وتعتمد الوكالة على خبراتهم لضمان استخدام المواد النووية في الأغراض السلمية وتطبيق التقنيات النووية لتحقيق التنمية المستدامة. ويقع مقر الوكالة في فيينا بالنمسا حيث يوجد غالبية الموظفين. ولدى الوكالة أيضاً مكاتب إقليمية في تورنتو وطوكيو، ومكاتب اتصال في نيويورك وجنيف، ومختبرات بحثية في زايبرسدورف، بالنمسا، وفي موناكو. وتوفِّر الوكالة مجموعة متنوعة من ترتيبات العمل لتلبية احتياجات مختلف موظفيها. ويشمل ذلك مرونة ساعات الدوام، وترتيبات العمل بدوام جزئي وتقاسم الوظائف. وتقدِّم الوكالة مجموعة سخية من المزايا والاستحقاقات تشمل إجازات مدفوعة الأجر وإجازة الوالدين والتأمين الصحي وبرنامج المعاشات التقاعدية ومنح التعليم وغيرها من المزايا التي تُحدد حسب نوع العقد."
year_published = 2018
year_updated = 2018
