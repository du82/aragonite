["https://iaea.org/about/employment/professional-staff"]
title = "Professional staff | IAEA"
description = "Professional staff members of the IAEA are experts in their fields who carry out the functions of the IAEA through two different means. First, they contribute as individual experts. Second, they organize input from experts to deal with specific tasks, such as preparing standards. IAEA professional staff work in international and multidisciplinary teams. The skills needed by"
full_description = "Professional staff members of the IAEA are experts in their fields who carry out the functions of the IAEA through two different means. First, they contribute as individual experts. Second, they organize input from experts to deal with specific tasks, such as preparing standards. IAEA professional staff work in international and multidisciplinary teams. The skills needed by the professional staff are usually very specific to the nature of the IAEA's work. Staff members are international civil servants subject to the authority of the Director General. As such, they may not seek or accept instructions in regard to the performance of their duties from any government or other authority external to the Agency. While all staff members are subject to the laws and regulations of the duty station country, they are entitled to certain privileges and immunities in the interests of the IAEA. Professional Staff positions are advertised through online vacancy notices. Post grades Similar to other United Nations agencies, the IAEA offers its international professional staff the following career steps: P-1 to P-3 levels At the P-1/P-2 junior/entry level, the principal goal of staff members is to demonstrate expertise by participating in the execution of programmes and projects, moving in the course from apprenticeship to higher levels of responsibility. As a P-3 professional, staff members launch and develop particular facets of the IAEA programme and gain further professional experience. Necessary qualifications: University degree (or equivalent graduate degree) One year of experience in a field of relevance to the post, respectively Strong analytical skills Computer skills: standard Microsoft Office software Languages: fluency in English. Working knowledge of other official languages of the IAEA (Arabic, Chinese, French, Russian, Spanish) is advantageous Ability to work effectively in multidisciplinary and multicultural teams Ability to communicate effectively P-4 to P-5, D levels Two paths are open at the P-4 and P-5 levels: taking on managerial responsibilities or carrying out functions in a highly specialized field of expertise. Those with managerial responsibilities function as head of a unit or section, or as director (D level) of a division. They directly participate in the preparation and execution of the IAEA's strategy, manage a budget and assume a leadership role. Necessary qualifications: Advanced university degree (or equivalent post graduate degree) Seven/10/15 years of experience in a field of relevance to the post, respectively Resource management experience Strong analytical skills Computer skills: standard Microsoft Office software Languages: fluency in English. Working knowledge of other official languages of the IAEA (Arabic, Chinese, French, Russian, Spanish) is advantageous Ability to work effectively in multidisciplinary and multicultural teams Ability to communicate effectively"
year_published = 2025
