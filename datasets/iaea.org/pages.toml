["https://iaea.org/about/logo-usage-guidelines"]
title = "Logo Usage Guidelines | IAEA"
description = "The IAEA logo is a vital element of the Agency’s visual identity, symbolizing its mission and role within the United Nations system. The logo is protected under Article 6ter of the Paris Convention for the Protection of Industrial Property and must always be used in its entirety without modification, ensuring consistent representation across all platforms."
full_description = "The IAEA logo is a vital element of the Agency’s visual identity, symbolizing its mission and role within the United Nations system. The logo is protected under Article 6ter of the Paris Convention for the Protection of Industrial Property and must always be used in its entirety without modification, ensuring consistent representation across all platforms. Logo Versions Three versions of the IAEA logo are available: Standard Version of the logo is encouraged to be used for all public-facing communication; Tagline Version for public information products that benefit from an explanation of the IAEA’s mandate; Long Version for formal communications such as letters, on the fascia of a building/signage, etc. The Legacy Slogan Version is no longer used for communication or outreach products. The IAEA logo is available in the six official UN languages (Arabic, Chinese, English, French, Russian, and Spanish) and can be used in horizontal or vertical orientations. Colour options include: IAEA Blue (preferred for most applications). White (on IAEA Blue or other dark backgrounds). Black (used only in grayscale documents or specific campaign designs). To ensure clarity and legibility, the logo should: Be placed against clean, high-contrast backgrounds. Never be placed over busy or distracting images unless visibility is guaranteed. Third-Party Usage Requirements The use of the IAEA logo by any third party on non-IAEA documents and other materials requires advance, written and specific per-use authorization.Upon approval of a cooperation activity, non-Agency or joint communication materials, and at least three weeks prior to any deadline, the third party should submit the IAEA counterpart: The completed Application Form for Third Party Use of the IAEA Logo and Draft communication materials (mock-up) with the intended placement and proposed IAEA logo format. Please refer to Guidelines for Third Party Use of the IAEA Logo for detailed application process and recommendation on the format, colour and placement of the IAEA logo for your submission."
year_published = 2025
