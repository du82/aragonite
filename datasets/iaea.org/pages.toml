["https://iaea.org/es/el-oiea/trabajar-en-el-oiea"]
title = "Trabajar en el OIEA | OIEA"
description = "El OIEA ofrece un entorno laboral dinámico y multicultural. Su personal procede de más de 100 países y trabaja en una gran diversidad de campos técnicos y científicos."
full_description = "El OIEA ofrece un entorno laboral dinámico y multicultural. Su personal procede de más de 100 países y trabaja en una gran diversidad de campos técnicos y científicos. El OIEA cuenta con un personal diverso y multidisciplinario de primera categoría. Con más de 2500 funcionarios que trabajan en una gran diversidad de disciplinas nucleares y conexas, recurre a sus conocimientos especializados para garantizar el uso de los materiales nucleares con fines pacíficos y la aplicación de las técnicas nucleares para el desarrollo sostenible. La Sede del Organismo se encuentra en Viena (Austria), donde la mayoría del personal desarrolla su labor. El OIEA también tiene oficinas regionales en Toronto y Tokio, oficinas de enlace en Nueva York y Ginebra, y laboratorios de investigación en Seibersdorf (Austria) y Mónaco. El OIEA ofrece distintas modalidades laborales para satisfacer las necesidades de su variado personal. Ello incluye horarios flexibles, trabajo a tiempo parcial y modalidades de trabajo compartido. El OIEA dispone de una generosa oferta de prestaciones y derechos, que incluye permisos retribuidos, licencia parental, seguro médico, plan de pensiones, subsidios de educación y otras prestaciones, que se determinan en función del tipo de contrato. Marco de competencias del OIEA El marco de competencias del OIEA es un modelo que describe a grandes rasgos la excelencia del desempeño laboral en el Organismo. Comprende una serie de competencias que se aplican a numerosas funciones profesionales en la organización. Cada competencia define, en términos generales, la excelencia de la conducta laboral, definición que establece un punto de referencia con que evaluar al personal. Con este marco de competencias puede saberse qué conductas se requieren, se valoran, se reconocen y se premian en lo que respecta a funciones profesionales específicas. Se utiliza durante todo el ciclo laboral, comprendido el proceso de selección, y es parte integrante de la descripción del puesto."
year_published = 2018
year_updated = 2018
