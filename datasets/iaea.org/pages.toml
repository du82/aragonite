["https://iaea.org/newscenter/news/iaea-profile-balancing-numbers-and-dreams-a-career-in-finance-and-accounting"]
title = "IAEA Profile: Balancing Numbers and Dreams – A Career in Finance and Accounting | IAEA"
description = "The IAEA profiles employees to provide insight into the variety of career paths that support the Agency’s mission of Atoms for Peace and Development and to inspire and encourage readers, particularly women, to pursue careers in STEM (science, technology, engineering and mathematics) or STEM-adjacent fields."
full_description = 'If you would like to learn more about the IAEA’s work, sign up for our weekly updates containing our most important news, multimedia and more. The IAEA profiles employees to provide insight into the variety of career paths that support the Agency’s mission of Atoms for Peace and Development and to inspire and encourage readers, particularly women, to pursue careers in STEM (science, technology, engineering and mathematics) or STEM-adjacent fields. Read more profiles of women at the IAEA. Hailing from Kinshasa, the capital of the Democratic Republic of Congo, Carmen Kibonge has taken a path shaped by a passion for numbers, a supportive family and a commitment to make a difference, which eventually led her to the IAEA. Kibonge was raised in a family that encouraged educational aspirations for both girls and boys, which is not always the case in her central African home country, where economic constraints often lead families to prioritize the education of boys. “In my family, it was expected that a girl would go to school. I know I was privileged, and I really appreciated the access to education,” she reflects. She was also inspired by her mother, an HR manager who was one of the few women in her community to pursue higher education. From an early age, Kibonge was captivated by mathematics and loved “cracking numbers”. Because of her mental arithmetic skills, her nickname at school was Ordi, after the French word for computer. But maths was not part of her original career aspirations. When she contemplated her future, a desire to help others and the work of international organizations in low and middle income countries like her own led her to consider a career in medicine. Her dream of becoming a paediatrician, however, shifted when she was confronted with the sight of blood in biology class. Nevertheless, the seed of wanting to work internationally had been planted. "I wanted to help people, not just in my country, but globally," she says. Kibonge decided to pursue higher education in Austria, motivated by stories from friends who had lived there, as well as her love of classical music. Following her passion for numbers, she enrolled at the University of Vienna to study business administration with a focus on finance and accounting. Meanwhile, she supported herself by giving maths lessons.'
year_published = 2020
clearnet = "https://iaea.org/newscenter/news/iaea-profile-balancing-numbers-and-dreams-a-career-in-finance-and-accounting"
