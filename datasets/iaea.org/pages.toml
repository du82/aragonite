["https://iaea.org/about/jobs/howtoapply"]
title = "How to apply | IAEA"
description = "Interested applicants may inquire about employment opportunities at the IAEA at any time. To be assured of consideration for a specific position, however, they must apply in writing following the issuance of an official vacancy notice.  Vacancy notices are issued months before a position becomes available at the Agency. They are not only available online but also sent to all"
full_description = "Interested applicants may inquire about employment opportunities at the IAEA at any time. To be assured of consideration for a specific position, however, they must apply in writing following the issuance of an official vacancy notice. Vacancy notices are issued months before a position becomes available at the Agency. They are not only available online but also sent to all Member States, typically to the national atomic energy commissions, ministries of foreign affairs, other international organizations, universities and other educational institutions. General applications submitted for administrative, scientific or engineering, consultancy and internship posts are made available as the need arises. Submitting an application All applicants must complete and submit an application by using the online job application form. Internal and external candidates must apply on-line. If applying for a specific advertised post, applications must be received before the closing date as stated on the vacancy notice by midnight Vienna, Austria time (CET/CEST). Applications received after the application deadline will not be considered. Applications must only be submitted online. At this stage, there is not need to attach copies of qualifications, previous employment contracts, entire publications, etc. All application material should be typewritten and in English. After application submission All applicants will be informed of the outcome of their application in due course. Applicants who do not comply with the application guidelines or do not meet the essential requirements specified in the vacancy notice will not be considered. Testing may be part of the recruitment process. Additional information The Competency Framework: A Guide for IAEA Managers and Staff Types of employment Vacancy notices Login to vacancy pages"
year_published = 2025
