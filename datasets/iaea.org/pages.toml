["https://iaea.org/about/rafael-grossi"]
title = "Rafael Mariano Grossi | IAEA"
description = "IAEA Director General Rafael Mariano Grossi assumed office on 3 December 2019. Mr Grossi is a diplomat with over 35 years of experience in the field of non-proliferation and disarmament. In 2013, he was appointed Ambassador of Argentina to Austria and Argentine Representative to the IAEA and other Vienna-based International Organizations."
full_description = "Former Directors General Cornel Feruta, 2019 (Acting) Yukiya Amano, 2009-2019 Mohamed ElBaradei, 1997-2009 Hans Blix, 1981-1997 Sigvard Eklund, 1961-1981 Sterling Cole, 1957-1961 If you would like to learn more about the IAEA’s work, sign up for our weekly updates containing our most important news, multimedia and more. IAEA Director General Rafael Mariano Grossi assumed office as the Agency’s sixth Director General on 3 December 2019. In September 2023 the IAEA's 67th General Conference approved by acclamation his re-appointment to serve a second four-year term of office starting 3 December 2023. Mr Grossi is a diplomat with almost 40 years of experience in the fields of non-proliferation and disarmament. In 2013, he was appointed Ambassador of Argentina to Austria and Argentine Representative to the IAEA and other Vienna-based International Organizations. Before assuming office as the IAEA’s Director General, Mr Grossi was president-designate of the 2020 Review Conference of the Parties to the Treaty on the Non-Proliferation of Nuclear Weapons (NPT), and from 2014 to 2016 served as president of the Nuclear Suppliers Group (NSG). He was the NSG’s first president to serve two successive terms. In 2015, Mr Grossi presided over the Diplomatic Conference of the Convention of Nuclear Safety, securing unanimous approval for the Vienna Declaration on Nuclear Safety, an important milestone in international efforts following the 2011 Fukushima-Daiichi nuclear accident. From 2010 to 2013, he served as Assistant Director General for Policy and Chief of Cabinet at the IAEA, having previously held senior positions in the Argentinian Foreign Service, including as Political Affairs Director General from 2007 to 2009. Mr Grossi was Chief of Cabinet at the Organization for the Prohibition of Chemical Weapons (OPCW) in The Hague from 2002 to 2007. Prior to this, he served in the Argentinian Foreign Ministry, including as Head of Embassy in Belgium and Luxemburg from 1998 to 2002, and as Argentine Representative to NATO from 1998 to 2001. Mr Grossi joined the Argentinian Foreign Ministry in 1985."
