["https://iaea.org/about/organizational-structure/department-of-technical-cooperation"]
title = "Department of Technical Cooperation | IAEA"
description = "This Department is responsible for formulating and delivering the IAEA’s development mandate. The Agency’s technical cooperation with Member States aims to promote tangible socioeconomic impacts, supporting the use of nuclear science and technology to address major sustainable development priorities at the national, regional and interregional levels. The organizational"
full_description = "This Department is responsible for formulating and delivering the IAEA’s development mandate. The Agency’s technical cooperation with Member States aims to promote tangible socioeconomic impacts, supporting the use of nuclear science and technology to address major sustainable development priorities at the national, regional and interregional levels. The organizational structure of the Department is shown here. Division of Programme Support and Coordination This Division develops strategies, guidelines and procedures for the IAEA’s technical cooperation programme. One of its key functions is to carry out financial monitoring and control for the programme and to develop and maintain TC programme data and information management systems. It develops tools for programme management, monitoring, training, self-evaluation and quality assurance, and is responsible for pursuing partnership opportunities and for liaison on corporate resource mobilization efforts. Divisions for Africa, Asia and the Pacific, Europe, and Latin America and the Caribbean These Divisions are responsible for developing, managing, monitoring and reviewing activities under the IAEA technical cooperation programme: Division for Africa: Algeria, Angola, Benin, Botswana, Burkina Faso, Burundi, Cabo Verde, Cameroon, Central African Republic, Chad, Comoros, Congo, Côte d’Ivoire, Democratic Republic of the Congo, Djibouti, Egypt, Eritrea, Eswatini, Ethiopia, Gabon, Gambia, Ghana, Guinea, Mauritania, Kenya, Lesotho, Liberia, Libya, Madagascar, Malawi, Mali, Mauritius, Morocco, Mozambique, Namibia, Niger, Nigeria, Rwanda, Senegal, Seychelles, Sierra Leone, South Africa, Sudan, Togo, Tunisia, Uganda, United Republic of Tanzania, Zambia and Zimbabwe. Division for Asia and the Pacific: Afghanistan, Bahrain, Bangladesh, Brunei Darussalam, Cambodia, China, Fiji, Indonesia, Islamic Republic of Iran, Iraq, Israel, Jordan, Kuwait, Lao People’s Democratic Republic, Lebanon, Malaysia, Marshall Islan