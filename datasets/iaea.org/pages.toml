["https://iaea.org/about/employment/consultants-and-experts"]
title = "Consultants and experts | IAEA"
description = "The IAEA frequently engages consultants and experts under individual contracts (temporary staff assignments or consultancies) to work on short-term projects. The functions of consultants and experts are results-oriented and usually assist in the delivery of specific IAEA programmatic activities. Applicants interested in such temporary assignments or consultancies may submit an"
full_description = "The IAEA frequently engages consultants and experts under individual contracts (temporary staff assignments or consultancies) to work on short-term projects. The functions of consultants and experts are results-oriented and usually assist in the delivery of specific IAEA programmatic activities. Applicants interested in such temporary assignments or consultancies may submit an application to the pipeline vacancies in their field of expertise. Pipeline vacancies enable the IAEA to capture information in a highly detailed and structured manner by using expertise-related questions, and enrich the CV with expertise levels that will be used by recruiters to find suitable candidates for temporary assignments or consultancies. Please note that a submission to a pipeline vacancy does not constitute commitment on the part of the IAEA to take a particular application into consideration in the recruitment process. When a division has a need for a specific skill set, the IAEA’s Recruitment Unit will run a query among applications submitted to the relevant pipeline vacancy. Application status The IAEA is unable to provide up-to-date information on the application status while the recruitment process is ongoing. All applications are carefully reviewed for the respective vacancies. Candidates can check their individual submission status by navigating as below: 1: Enter IAEAs Job Board (link) 2: Click on “My Jobpage” in the top bar On the job page, you should be able to see the status of each of your application submissions and status of the vacancy notice. In general, only selected candidates will be notified on the next steps of the recruitment process. All candidates should receive an update at the end of the process. On average, vacancies are processed approximately between six to nine months after the application deadline."
year_published = 2025
clearnet = "https://iaea.org/about/employment/consultants-and-experts"
