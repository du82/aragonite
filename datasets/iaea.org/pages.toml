["https://iaea.org/about/partnerships/european-union"]
title = "European Union | IAEA"
description = "The European Union (EU), in particular the European Commission and the European External Action Service (EEAS), plays an important role in the development of cooperation policy and financing, and is an important strategic partner for the IAEA. The EU’s support to the Agency focuses particularly on projects/activities relating to nuclear safety and nuclear security. Support to"
full_description = "The European Union (EU), in particular the European Commission and the European External Action Service (EEAS), plays an important role in the development of cooperation policy and financing, and is an important strategic partner for the IAEA. The EU’s support to the Agency focuses particularly on projects/activities relating to nuclear safety and nuclear security. Support to nuclear safety projects are partly delivered through the IAEA’s technical cooperation programme. The cooperation with European institutions started in 2003, when the European Community and the United Nations signed a Financial and Administrative Framework Agreement. In 2004, the IAEA and the European Community signed a contribution agreement to support IAEA Nuclear Security Programme activities and in 2005 the IAEA and the European Commission signed the first Contribution Agreement for a project in the field of nuclear safety. Since then, the Agency and the EU have worked together on projects to address the development needs of IAEA Member States in the field of nuclear safety and to strengthen nuclear security worldwide. Nuclear safety projects address areas such as radiation protection, safe management of radioactive waste, environmental remediation, decommissioning, nuclear safety culture and emergency preparedness and response. Projects on nuclear security include universalization and implementation of the Convention on the Physical Protection of Nuclear Material (CPPNM) and its Amendment, physical protection of nuclear facilities, activities related to materials out of regulatory control, computer security, education and training and the establishment of new IAEA Nuclear Security Guidance. In 2013, the IAEA and the European Commission affirmed their cooperation in a Memorandum of Understanding (MoU) on cooperation in the area of nuclear safety, which was extended in 2017 and renewed in 2021 for an additional period of 18 months. This MoU outlines the partners’ intent to further strengthen cooperation, particularly in education and training, research and development, and capacity building. Cooperation carried out under the MoU enables the IAEA and the European Commission to work more effectively to enhance global nuclear and radiation safety."
year_published = 2025
clearnet = "https://iaea.org/about/partnerships/european-union"
