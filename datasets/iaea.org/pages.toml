["https://iaea.org/about/multilingual-content"]
title = "Multilingual Content | IAEA"
description = "To make its content accessible to a wider range of readers, the IAEA offers versions of its web site in Arabic, Chinese, French, Russian and Spanish – alongside English."
full_description = "To make its content accessible to a wider range of readers, the IAEA offers versions of its web site in Arabic, Chinese, French, Russian and Spanish – alongside English. Each web site in languages other than English is updated weekly to bring our readers news that are of most interest to their respective regions and language communities. In addition to news stories, the language sites in these languages present the IAEA and its various work areas and provide historical information on its role in promoting the peaceful uses of nuclear technology. Over 400 topic pages and hundreds of publications, news articles, videos, photo essays and press releases are also available – with each site focusing on the regions where the language is spoken. Links to more technical material available in English are also included. The IAEA has Facebook account in Arabic, French, Russian and Spanish, as well as in English; it also has a Weibo account in Chinese. The flagship publication, the IAEA Bulletin, is also available in Arabic, Chinese, French, Russian and Spanish – alongside English."
