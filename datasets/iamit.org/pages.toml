title = "Backpacking In Europe – Two Weeks Of Flights 2021 – I Am Security"
description = "This is somewhat of a “stream of consciousness” diary of my EU Flight Trip – 10/25/21-11/8/21. Yes, it’s long (sums up over 40 hours of flying), and veers off the security/hacking…"
full_description = "Backpacking In Europe – Two Weeks Of Flights 2021 Dec 19, 2021 — by iamit in Uncategorized This is somewhat of a “stream of consciousness” diary of my EU Flight Trip – 10/25/21-11/8/21. Yes, it’s long (sums up over 40 hours of flying), and veers off the security/hacking/risk content typically here. But it’s a new hobby for me, and I do find it fascinating and teaching – especially how to approach a new topic, establish that you are always learning, and experience things from a different perspective. Some of the terms are likely aviation-specific so apologize in advance (GA is General Aviation, airport codes may seem cryptic but can be easily Googled for, etc…). Day 1 – Basics Getting to know OK-MMA was easy – it’s the same type of Cessna 172 I’ve been flying so far for. The engine is brand new with less than 100 hours on it since major overhaul, the aircraft is nicely trimmed (no need for a heavy right leg on the rudder), and practicing a few takeoffs and landings from a grass airfield has proven to be quite easy to handle. We took off in very clear weather and flew VFR to a few “sightseeing” airstrips to practice some navigation, aviation, and communication. Getting through the airspace is comfortable, with clear communications from the helpful “Praha Information”, and so was getting to our rest stop at Karlovy Vary. Making sure we cleared the Prague TMA, getting clearance to land was a breeze, and the sights along the way were stunning. Fall is in full force, and the colors of the trees and grass are picturesque. Autumn at full force Short break at LKKV, and we headed back to a fairly “low” flight (3,300ft to keep clear of the 3,500 max under the Prague TMA) to LKMB for the final landing before lunch break. Lunch at the Restaurant (and my hotel) and prep for the night flight lesson which is planned to start at 18:30 as twilight is out. Taking off from LKMB to Brno, the flight was quiet and beautiful, as most of the navigation is done while keeping the highway at the glide path in case of an emergency. Uneventful landing at Brno with a quick coffee stop before heading off to Ostrava (Mosnov Airport). Same weather (clear and quiet) but as we got to Mosnov we hit quite some turbulence as we started practicing “techniques” for the night VFR rating. Steep turns and stalls in high turbulence were less than optimal, but provided for a great training opportunity, followed by a few traffic patterns with some of the longest finals I’ve experienced (with 15k headwinds it feels like landing in slow-motion). We concluded the night training with almost 4 hours clocked in for the night, and a couple of beers after refueling and parking at the airport. Approaching Mosnov Airport for night training Day 2 – Cross Country Headed out from Mosnov (LKMT) towards Oradea (LROD) in Romania. Longer cross-country flight (2.6 hours) with stunning views as we crossed Slovakia and Hungary through the mountains (Tatra mountains). A quick refueling there and headed off to Targu Mures in the Transylvania area of Romania (more mountains). An hour and a half flight time, and we landed, and headed out to a nice local restaurant for some local version of Goulash. The rolling hills between the Czech Republic and Slovenia Crossing the mountain ridges in Hungary Back to the airport, and we started heading back west to get to our night training in time. From Targu Mures (LRTM) to a quick refueling stop (and customs, always customs/passport when crossing so many borders outside the EU Schengen area) at the Slovakian airport of Poprad-Tatry, and we departed at night towards Ostrava. 2 hours of flight time (including the night training at Ostrava, and it was time for one final flight for my solo night flights. 5 clean takeoffs and landings later, and I was ready to call it a day and crash, especially as the next day called for an early takeoff to get to the airport where my validation examination will be held which is an hour flight away. My night solo pattern work Day 3 – Making it official Early wake-up at Ostrava for a 7am takeoff in marginal VFR (light mist/fog rolling over the valleys in the morning time) and a beautiful flight to Jihlava where my examiner is. Another grass field airport with cool activities in it (firefighting, gliders, and an experimental shop that bolted a crazy turbo-prop engine to a Cessna 172). Early morning mist across the Czech plains The examination flight went well with additional tips from the examiner on navigation in the Czech Republic, and an hour and a half later I was given the all-clear to get my European (EASA) license validation. At that time the fog/clouds north of us were still around Mlada Boleslav so we waited it out a bit before heading back on the 1-hour trip to “home base”. More paperwork to make sure everything is in order for the CAA to issue my validation, more paperwork on producing the night training certification, and I finally drove (what’s that?) to the Prague airport to handle the CAA paperwork before the weekend as Thursday is a national holiday so they are closed, and Friday there’s no public admittance – which means this was my last chance to get the validation if I wanted to fly through the weekend. Back to the hotel, catching up on a little work and family facetime, and starting to plan the Friday flights… Day 4 – Rest, and flight planning/booking. Had a lot of fun realizing that the Zurich airport is VFR friendly and has allotted slots through the day for VFR arrivals and departures in between the massive amounts of flights they are handling. Took their online training and got certified in the way of working there. Coordinated handling and parking, and set up everything for tomorrow to go through Munich (EDMJ – Jesenwang, right outside of Munich) to Zurich (LSZH). Day 5 – out for an adventure. The weather conditions in the planned route weren’t optimal but showed signs of clearing up. The main issue is a low dense fog that prohibited VFR flights over it (can’t see the ground = no go). Pushed back my departure a bit to allow for the fog to dissipate a bit more and took off from LKMB westward. A light mist was still in patches around, but overall visibility was good and the crossing of the Kbely and Prague airspaces went smoothly. Once I reached the planned cruising altitude of 6,500’ however, I saw that the fog “front” is in front of me. Slowing down to let the front dissolve didn’t prove to be very effective, and after circling a couple of times at the front of the fog line, I started looking for an alternate field to land at. The first choice (Horovice) was out as it was also foggy, and someone on the radio heard that I was looking for a clear airfield to land and suggested Pribram (LKPM) which had clear VFR conditions. A neat approach and smooth landing and I was back to planning. Right side – VFR. Left side – nope. Filed another flight plan to EDMJ for a departure 45 minutes later and was watching the weather reports on the receding fog front line ahead of me to the west. Once things seemed to be trending positive, I took off again and climbed back to cruise altitude (funny how they call it FL65 here where the transition altitude is 5,000’). Managed to find a way through some of the Czech portions of the fog area and was clear and cruising in German airspace through rolling hills and serene scenery. However, the fog hit again. The mountain range that runs from Passau, through Deggendorf to Regensburg, essentially leaves the plains to the west of it locked in the low and dense fog, with zero visibility even when looking straight down through it. As I was flying along the fog line north-west, looking for either an area that I could cross towards or alternate landing sites, the helpful ATC was making calls on my behalf to see which fields were open. My first attempt was towards Regensburg (EDNR) which seemed to be right along the fog line but on the clear side. I could see ½ of the town next to the airport (Regenstauf), but the other half was covered, and after descending to examine whether these were low clouds or fog, I realized that fog it is, and there’s no way I’m attempting to go in there – not even knowing the airfield is 1km away. Riding the fog line Turned back and headed to the clearer areas in the valley where the national park of Bayerischer Wald is (as the fog didn’t get to it – the ridges to the northeast and southwest provided protection against it…). I remembered that on the way west, I noted there was an airfield just to my right and decided to check it out (EDNB at Arnbruck). Flying over there (all while coordinating with the helpful German ATC and listening to Foo Fighters) and managed to contact someone on the airfield frequency, who gave some hope that they were somewhat operational. He did mention there’s no activity today, so I called in blind for the landing. Turned out – the other person on the radio was in another Cessna and is the head instructor for the local flying club, who also called in for the person that could refuel me. I responded to his “how quickly do you need the fuel, and how long do you need to stay” with a simple “I’m easy – take your time, I am on vacation and might stay here longer”. Turned out to be a great little town here. Daniel, the “money person” of the club (who is also a pilot), was extremely friendly (as luck played it – he was on his way to the field to fuel his car) and provided great tips on flying in the local weather, and where to go next. We then also met up with Rolf – the CFI who congratulated me on the nice landing (and the go-around on my first approach since I was extra careful with the surrounded forested hills). Arnbruck Airport After fueling and parking my Cessna out of the way, I finished planning my next leg towards Innsbruck, with a scenic route that goes through Passau to take advantage of the geography that’s likely to keep the foggy areas out of my path and then towards the Austrian alps which had consistently clear weather so far (as well as forecasted ahead). At that point, I decided that I’m not going to fall to “getthereitis”, and fully embraced the flexibility and the enjoyment from being able to fly anywhere, and everywhere I could (under the weather conditions) as the scenery is absolutely stunning. Paid the extra 10EUR for parking overnight (cheaper than a couple of hours of parking in TLV or NYC) and booked the closest hotel for the night. The plan is to eat local food, drink local beers, and head out tomorrow morning-ish (10 am) southbound and “where the wind takes us”. Arnbruck felt like a Disney theme park, but for real Day 6 – To the Alps! Started the day slowly as I was waiting for the morning fog in the valley to clear up. Took a while to get the plane ready as I had to scrape off the ice from the windshield, wings, and vertical stabilizer (a first for everything!). Safety first – took a while to get all the frost off the wings and windshield Warmed up the engine and prepped for a short field takeoff to clear the trees and houses at the end of the runway (best direction as the mist was still around). The scenery was beautiful again this morning, and the patches of fog across the hill ridges made it for a fantastic area to fly by. Uneventful flight southbound towards Passau, Austria – a city that lies in the connection of three rivers, and the detour was definitely worth it. One of the rivers was still filled with fog, while everything around it was clear. Amazing views, and pictures probably don’t do justice to it. The rivers converging around Passau Had to maneuver around some more fog but the way towards the alps passing and into the Innsbruck valley was fine, and as I was getting close to the alps the raw beauty of the mountains really pops up from the altitude I was flying at (6,500’). Getting close to the Alps Alpine ridges – there are the northeastern parts of it Going through the Alps in the valley between the mountains is an amazing experience, and so was the response from Innsbruck tower when I first made contact. “We were waiting for you…” Uh, that didn’t sound too great. Apparently, as luck had it, the Foehn kicked in – a nasty wind coming in from the south and generating wind speeds in excess of 60kt at the top of the ridges. The tower reported highly turbulent winds measuring 44kt, with a crosswind component of 22kt on the runway, and asked what I’d like to do. After the fact I picked the METAR (Meteorological Aerodrome Report) for that time – which the forecast didn’t predict… METAR LOWI 301020Z 12026G46KT 090V180 CAVOK 18/M06 Q1011 WS ALL RWY NOSIG= I checked with a small airfield I spotted earlier in the valley whether they had fuel (AVGAS) and would welcome an unannounced visitor, and of course, they were happy to host guests. Called back to Innsbruck and told them I’d like to do a pass around the airport and then head back and land at Langkampfen (LOIK). As I was getting close, I realized that the winds are pretty vicious at that altitude (6,000) and were getting worse. I was barely making 80kt ground speed and inching forward through the valley. I only managed to get a good look at the Innsbruck airport but decided to turn back after a nasty turbulence hit me. Everything in the plane jumped up and hit the ceiling – me included. I was thankful for being a little stricter with the seatbelt than the locals in the Czech Republic (who secured the shoulder strap in the back seat so they can just wear the waist strap). I was more thankful that as I was going into the turbulence, I tightened the shoulder strap closer – to a point where I couldn’t lean forward. The jolt threw everything around the cabin, and my headset was the only thing separating me from a nasty bump to my head. We bounced so hard, that the plastic housing that connects the yoke to the instrument plane broke off… That’s Innsbruck airport and as much as it looks serene the wind was unforgiving I immediately turned back after making sure everything is still working and in one piece and informed the tower that I’m heading back. Langkampfen was a short grass strip nestled in the valley between the mountains and has an active glider and GA activity. A go-around – realizing the wind speed difference between up in the valley – around 30-40kt, and down on the ground at 2kt made my final too fast and too high, and the second circuit resulted in a smooth landing on the grass. Another highly welcoming group of people (who don’t take credit for refueling – which meant another trip to the bank with one of the locals), and I was back and getting my bearings after the nasty jolt in the turbulence. Langkampfen is nestled in the Alpine valley Planning my next hop, I was aiming for north-east Austria, but after chatting up with the volunteer controller he mentioned Vilshofen in Germany which has a nice airport, a great restaurant, and a small town right across the river. I remembered that other pilots were talking about it, and it is just an h"
