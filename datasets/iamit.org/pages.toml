["https://www.iamit.org/blog/2020/02/the-product-versus-skill-pendulum-in-security-and-the-need-for-better-solutions"]
title = "The Product Versus Skill Pendulum In Security And The Need For Better Solutions – I Am Security"
description = "This post was originally published on Forbes Security used to be easy–a fairly binary condition over whether you are protected or not, whether you are patched or not, or whether the port is a…"
full_description = "The Product Versus Skill Pendulum In Security And The Need For Better Solutions Feb 11, 2020 — by iamit in Opinion This post was originally published on Forbes Security used to be easy–a fairly binary condition over whether you are protected or not, whether you are patched or not, or whether the port is accessible to outside IP addresses or not. And then came complexity: Overlaying different aspects of vulnerabilities. Factoring in application issues, platform bugs, OS patches, network configurations and user access controls has shifted the rather binary situation to an exponential one. As such, we, as security practitioners, learned to use more skills in terms of threat modeling, secure development, honeypots and honeytokens for earlier detections, data-centric decision-making and increased focus on education and training. Weâ€™ve reached a point where products matter less and less. Remember when the first action when getting a new PC was to install an AV on it and try to beat the clock before it got exploited? Now, PCs are pretty much secure out of the box thanks to the native malware detection and mitigation tools that are part of the operating system. However, when looking at the security industry, we still see a lot of relics of the old-school way of operating. Iâ€™m not looking to explore whoâ€™s to blame (VCs? Startups? Consumers? Analysts? Your bet is as good as mine), but a lot of security vendors still treat the world in a binary fashion. If you look at marketing claims, for instance, itâ€™s either you have their product, or you are not secure. This brings me to my main point: A lot of security organizations are already through the pendulum shift. They are much more data- and customer-focused and are prioritizing their risk decisions around this rather than around the binary checklist of products. If thatâ€™s the case, where does that leave most industry vendors, especially with products that are not designed around the customerâ€™s actual needs? As an example, our security organization at Cimpress has been pretty adamant about practicing this customer-focused approach. We make it clear what our needs are and the features/capabilities weâ€™d like to have based on our threat models and current capabilities. However, this leads to several problems. First, a lot of vendors donâ€™t know how to address that. They have a list of features and their marketing pitch, and thatâ€™s it. We’re looking for specific answers–possibly answers that include road map milestones–and are not expecting a single product to address all of our needs. Vendors, on the other hand, find it difficult to adjust their sales process (and pricing) to address customers’ specific needs, leaving frustrated after being told that weâ€™re not using 80% of the product capabilities but would love to pay for the 20% we actually need. Second, there seems to be a lack of vendors who truly adopt the approach of identifying needs on the customer side and are still adopting the approach of finding novel technical problems and solutions to address them. So, we’re left with niche products that don’t address actual needs but get snazzy marketing backing. We end up pushing the pendulum further into the skills territory, forcing security teams to rely on their own skills and in-house tooling. To top it off, this increased reliance on skill is deepening the skills gap we already have in the industry. We have an education process that focuses on specific areas of the security field and training and education programs that are often product-focused. Meanwhile, generalists are becoming more rare and expensive as demand for less product-centric and more data/process-centric expertise increases. What to do? Simple: Enjoy the sound of silence for a moment, especially as a vendor. Donâ€™t incessantly ask what a potential customer’s current challenges are while trying to calculate what part of the answer you can anchor on to and sell your product through. We need to “shift left” that question from sales back to product design and even company inception. We need more smart people listening to what customers say about their needs and, rather than identifying where existing solutions can address them, trying to identify where there are partial or no solutions. Iâ€™ve been fortunate to work with a few VCs and startups that do just that and have the foresight to validate these needs and keep driving their solution to address them or pivot their product so that it truly addresses the core issues. On the other hand, I get frustrated with vendors who succumb to trying to latch on to a minor detail and blow it out of proportion or, worse, resort to speaking ill of their competition. Statements like, “We see a lot of customers of vendor X come to us after two years, and now, with our product, they are happy,” should be banned from sales discussions and replaced with, “Vendor X? Yes! I hear that their product is really good and addresses a certain set of problems really well. Iâ€™d love to know what your threat model and priorities are to better understand whether it is X you should go with or maybe find a different set of solutions.” And as much as innovative products sometimes need to educate the market (Iâ€™ve been there and am actively working with companies like that as well), most times, the reverse is whatâ€™s needed: truly understanding what the industry needs right now and providing true minimal viable products (MVPs) that solve these often basic problems. Thereâ€™s money in solving seemingly simple issues, especially if they have been around for a long time and are considered “the norm” or something that people need to just accept as suboptimal. Share this:Click to share on LinkedIn (Opens in new window)Click to share on Twitter (Opens in new window)Click to share on Facebook (Opens in new window)Click to email a link to a friend (Opens in new window)Click to print (Opens in new window) hacking security security engineer