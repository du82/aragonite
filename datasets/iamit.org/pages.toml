full_description = "Tag: startups Elastic Permissions Jun 23, 2020 — by iamit in Opinion, Security Research Over the past two years my colleagues and friends have heard me talk about Elastic Permissions, and at some point I started hearing other people mention the term (yay for planting the seeds through consistently using a new term…). So I figured – for the sake of clarity, let’s put this out there for posterity.… The Product Versus Skill Pendulum In Security And The Need For Better Solutions Feb 11, 2020 — by iamit in Opinion This post was originally published on Forbes Security used to be easy–a fairly binary condition over whether you are protected or not, whether you are patched or not, or whether the port is accessible to outside IP addresses or not. And then came complexity: Overlaying different aspects of vulnerabilities. Factoring in application issues, platform bugs,…"
