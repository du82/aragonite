["https://iamit.org"]
title = "iamit.org"
full_description = '''You can find here all sorts of stuff that I have collected along the years, from photos, to information about me and my (wrong) doings. Mostly I maintain my blog updated with random musings and security stuff I used to try to keep pretty active - motorcycles, skying, running, gym, rollerblading, scuba-diving, and probably some other stuff I forgot while writing this. Now it's whatever keeps me "aligned" and relatively in good enough shape. Adrenaline I do need a fix just like the guy next door, only difference is that I prefer to get my chemicals in a more natural process. I have had my share of two wheelers, am currently in recess from my trustworthy RR, but a comeback is fast approaching. In the meantime I've picked up flying (faster, more dimensions of freedom). I'm the Advisory Chief Security Officer at Rapid7. Prior to that I've spent 4 years as the Chief Security Officer at Cimpress. I used to be a Senior Manager of Security Engineering at Amazon AWS, and held leadership positions with ZeroFOX , IOActive, Aladdin, Finjan and Comsec. I am actively serving on the advisory board of several startups. I am also serving on the board of directors of BSides Las Vegas as a general director. I have had the pleasure to talk at the most sought-after conferences in my field such as BlackHat, DefCon, BlueHat, InfoSecurity, and more... I was also frequently interviewed by leading pring and web magazines and news outlets, speaking about web security, eCrime, and technology (see this page for a chronological sampler). My formal education is in Computer Science (BA from the Interdisciplinary Center) where I have been more than formally educated and have had a chance to meet a lot of new friends (teachers included...). The amazing environment at the IDC also enabled me to perform research (see academic projects) and keep on working in the same time. Besides the formal education, I am a firm believer in self teaching - as in "huh, that looks interesting, lets see how it works..." (That's how you end up being a "good" hacker working for an information security consulting company and heading their Unix & Internet department...). This is the real deal. I would not say that the University did not give me a lot (believe me it did!), but I do believe that a lot of people can go to the University, and end up with a degree that's not worth the paper it's printed on (unfortunately I meet people like that from time to time - and it does not matter how high or low their University is ranked...).'''
