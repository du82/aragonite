["https://ianatkinson.net/garforth/photos/pits.htm"]
title = "Garforth Pits Old Photos | Ian Atkinson"
full_description = "Garforth is in many ways a 'mining village' as so many of the villages in this area are. However, people have settled here for thousands of years (we're in the Domesday book) so it wouldn't be correct to think there was nothing here before the Victorian pits were sunk. It's certainly true to say that Garforth in its present form owes its existence to the pits though with the majority of the older housing having been built for pit workers, schools for their children and so on. Before the arrival of the pits Garforth, even on the interior, was mostly farmland and based around agriculture. There were three major pits in Garforth owned by the Gascoigne family which you can read about below and many more in the surrounding areas. Although the Gascoigne pits closed in the inter-war years, mining continued in this area for many decades afterwards with pits such as Ledston Luck operating until the 1980s. The Gascoignes themselves sold their mines to The Garforth Collieries Ltd. following the strike in 1919, this turned out to be a shrewd decision as they avoided the effects of the further downturn and strikes in the 1920s [7]. There are further images of the strikes below. I think is is worth defining the following terms which sometimes cause confusion. In Yorkshire though it is most common to refer to a mine as a pit probably because common people would say they 'worked down t'pit': Isabella pit on Ash Lane was named after one of the Gascoigne sisters, the eldest daughter of the colliery owner. It opened in 1833 and continued until it was worked out in 1925, when 392 men lost their jobs [2][3]. Sisters Pit, named after the two Gascoigne sisters, was sunk in 1843 and employed 240 men. It was worked out by 1922 [2]. The pit was located on the other side of Aberford Road to the station where Tescos now stands [4]. Trench Pit was located in Ninelands Lane and was named after Col. Richard Oliver Trench who was the husband of Isabella Gascoigne [3]. The pit was sunk in in 1899 and closed in 1930 due to financial difficulties, costing 417 men their jobs. At the time it was the last remaining pit in Garforth."
year_published = 2025
clearnet = "https://ianatkinson.net/garforth/photos/pits.htm"
