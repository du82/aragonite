["https://ianatkinson.net/garforth/photos/lidgett-lane.htm"]
title = "Garforth Lidgett Lane Old Photos | Ian Atkinson"
full_description = "On this page we travel down Lidgett Lane from the bottom of Main Street towards Selby Road. Closer towards Main St. Lidgett Lane has many fine Victorian houses as well as entrances to the terraced Streets such as Beech Grove Avenue and Strawberry Avenue. Further along Lidgett Lane is the more modern Police Station and Garforth Academy (formerly Garforth Community College from my days and Garforth Comprehensive School before that though everyone my age just calls it t'Comp!). Looking towards Strawberry Avenue with the ginnels to Beech Grove Terrace and Barleyhill Road in the foreground. Looking down Beech Grove Avenue towards Main St. As in many places, the iron railings were removed during the war to be melted down as steel for airplanes was in short supply. Looking towards Strawberry Avenue with the ginnels to Beech Grove Terrace and Barleyhill Road in the foreground. Springfield House in Lowther Road, with Lowther Avenue curving off towards the right of the frame. Springfield House was once a surgery operated by Dr. Sidney Griesbach and later by Dr. J.F. Robinson [3]. Springfield House is now a residential home for the elderly. Stood on the corner of Lowther Road looking towards Selby Road, the houses on the right no longer exist but look to have stood where there is now a patch of grass. Looking towards Lowther Road on the right, the houses which are on card Lilywhite GFH06 can be more clearly seen here. There were five houses on the row and they must have been very small inside. Looking towards Lowther Road, the large white building with the four upstairs windows is now The Coach House care home. Looking down Lidgett Lane with what is now Garforth Academy playing fields on the right It's not possible to take a very accurate comparison photo as the original seems to be taken from the top of a ladder."
