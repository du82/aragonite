["https://ianatkinson.net/garforth/photos/selby-road.htm"]
title = "Selby Road and Garforth Bridge Old Photos | Ian Atkinson"
full_description = "On this page we follow Selby Road from Garforth Bridge up towards Garforth Cliff. Selby Road bounds the South side of Garforth and being a major and historical road has some of the oldest buildings still standing in Garforth. Garforth Bridge refers to the area around the Old George. When Wakefield Road and Selby Road formed a crossroads there was a bridge there which was built over Sheffield Beck. Of course, there is now a roundabout there and the beck flows through the middle of it (where the willow trees are). This is a view of Selby Road taken from Wakefield Road, showing the Old George on the left, Springfield Place centre frame and The Gaping Goose towards the right of the frame. The land in the front of the frame (where the hotel now stands) was called Bowman’s Well Green Farm and later Lindley’s [3]. Selby Road climbing towards Swillington Common. The large house on the left, now demolished, was owned by the manager of Naylor Pollard & Co. [2]. Hawthorn Terrace is recognisable in the centre frame of both photographs. The hotel in the 1970s when it was the Leeds Mercury Motor Inn. The comparison of the Holiday Inn today photo shows the exterior as in the top left frame. These are images of Naylor Pollard & Co., a factory which made shirts and ‘Pilot’ overalls, employing large numbers of girls from Garforth. The factory no longer exists and the sorting office now stands on the same land. Before becoming the shirt factory the site had also been a corn mill run by Horsefields, a glue factory run by Charles H. Robshaw and a tannery [2][3]. Brookfield is an 18th century house situated on Selby Road near The Old George which has now been converted into offices. The house once belonged to John Clapham Bartle, a land auctioneer and estate agent who owned a cattle market behind the Brown Cow in Whitkirk [3]. Fitton’s Garage situated where Clark’s Garage now stands opposite The Old George. The Garage was built c.1920 from an old aircraft hangar and from it Fitton sold ROP (Russian Oil Products) petrol [2]."
