["https://ianatkinson.net/computing/professional.htm"]
title = "Professional | Ian Atkinson"
full_description = "Professionally I am a Senior Infrastructure Engineer working in Higher Education. I graduated from the University of Leeds with a BSc in Computing in 2003. Since 2004 I have worked at Leeds Arts University which is a specialist arts institution founded in 1846. In my current position I work in a seven person IT Services team supporting approximately 3000 students and 300 staff across both further and higher education. I've been into computers from a young age but grew up at a time when their use in schools was very limited. When I was at infants' school in the late 80s there was a single BBC Micro which lived on a trolley and only came out on special occasions. Once I moved to junior school there was a single Acorn A3020 which also lived on a trolley but again wasn't used all that much (although we were occasionally allowed to play Lemmings on it). My Grandad also had a Commodore Plus/4 which loaded games off a tape and he used to let me play on that if I went there in the school holidays. When I moved up to comprehensive school instead of a single Acorn A3020 there was a single room full of Acorn A3020s! This was shared by the whole school of 1800 students. At that time it still wasn't common to use computers at all in school. They weren't in the classrooms or built into the curriculum very much; we only used to go to that room now and again. There was no Internet of course so you just used whatever software was on the machine. One of the teachers did used to run a computer club though where you could go up to the computer room after school to do whatever you wanted, although we weren't allowed to play games because it would “wear the mice out”! He even started to teach some of us programming using BASIC and this is where I really got interested in computers. After a while the teacher stopped going to the club but we were still allowed in the room so we used to explore the systems and teach ourselves. At home I managed to get a second hand Amstrad PC1512 when I was about 12 which allowed me to learn DOS and also write BASIC programs at home. When I was a bit older I managed to get a 386 Windows 3.1 computer from a car boot sale and then when I was 18 I got a Windows XP machine which was the first modern computer I'd owned."
year_published = 2025
