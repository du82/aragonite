["https://ianatkinson.net/garforth/references.htm"]
title = "Prints, References and Copyright for Old Garforth Photos | Ian Atkinson"
full_description = "Occasionally people contact me asking about prints of these photographs for decorating local businesses etc. Please note that I do not provide a service selling prints nor do I claim copyright over any of the old photos. Copyright of the photos is a complex matter and is discussed below. You can buy prints of lots of old Leeds Photos from leodis.net which is run by Leeds City Council and there are a handful available at Francis Frith. You will also find people selling prints of old photos on eBay though again it's questionable whether or not they should be. All contemporary photographs are copyright to myself unless otherwise noted and may not be copied or used elsewhere without my permission. Please contact me if you wish to license any of my photographs. Certain people and groups may claim they hold copyright to some of the old photos when it's clearly not the case. When a photograph is taken by an individual, the individual automatically owns the copyright for that photograph. Exceptions to this are instances where the individual is acting on behalf of their employer, in which case the employer will own the copyright, or where a copyright has been legally transferred to another party. The duration of this copyright lasts for the life of the photographer and extends 70 years from the date of their death. After such time the image falls into the ‘public domain’ and may be used freely without restriction. e.g. an image of Garforth Bridge is taken in 1850 by a man aged 30 years old. The man dies aged 60 in 1880 and therefore the image falls into the public domain in 1950. e.g. an image was taken of Garforth Main Street in 1960 by a man aged 30, he may die aged 90 in the year 2020. This image will therefore not fall into the public domain until the year 2090. Clearly some of the photographs that I have presented here will be in the public domain, but others may not. It is impossible to ascertain the copyright holders for all of the photographs which I why I have added a general reference for these photographs."
year_published = 2025
clearnet = "https://ianatkinson.net/garforth/references.htm"
tags = ["contemporary", "photos", "prints", "prints,", "references"]
language = "en"
internal-references = ["none"]
external-references = ["amzn.to", "francisfrith.com", "historicengland.org.uk", "instagram.com", "leodis.net", "leodisleather.etsy.com", "maps.nls.uk", "media.cdn.festool.io", "msdn.microsoft.com", "parlington.co.uk", "youtube.com"]

["https://ianatkinson.net/garforth/photos/aberford-road.htm"]
title = "Garforth Aberford Road Old Photos | Ian Atkinson"
full_description = "Here we travel up Aberford Road from where it begins at Town End at the top of Main Street out towards East Garforth. Aberford Road bounds the North side of Garforth and includes many old buildings and houses as well as Garforth Station. The road was originally a toll road with the toll house being where Toll Bar Garage now stands at the end of Bar Lane. This road is of course far busier than it ever was years ago as it servers as the main access route into the newer East Garforth housing estates around Sturton Lane and beyond. The road was also called 'Station Road' historically as can be seen on some of the old postcards below. Now Station Road just refers to the short piece of road leading down to the station from where you turn off the Aberford Road. Looking down Wakefield Road with the top of Main Street on the left. The corner property was a butcher’s shop owned by Squire Backhouse [3]. This image shows the row of houses at Town End, which is little changed today. The closest house in the right of the frame was used by the Yorkshire Penny Bank and the house is still called ‘Bank House’ today. The house was owned by Mr. and Mrs. Dixon who rented a room to the bank every other Saturday evening. The bank was operated by Ben Chadwick who was the headmaster of the Colliery School at East Gaforth [2]. Looking towards The Miner’s Arms and Aberford Road from Town End. The large gabled house that can be seen in this first image past the Miner’s belonged to Tom Pickering and was demolished c.1938 to make way for Oak Road [3]. A carnival taking place in Aberford Road during Edwardian times with The Gascoignes in the background [3]. The Gascoigne Arms which at the time was selling Bentley’s Yorkshire Bitter, brewed in Woodlesford [3]. The Miners was previously known as ‘The Jolly Collier’, ‘Vince’s’ and also ‘The Black Bull’ [3]. These old mill buildings were situated where Beaconsfield House now stands. Whilst originally a flour mill, they were used as a grass mill during WW2 and finally as a council depot [3]."
