title = "Garforth Ninelands Lane Old Photos | Ian Atkinson"
full_description = "Ninelands Lane runs North-South through the middle of Garforth parallel to Main Street and connects Aberford Road with Selby Road. At one time it would have bounded the Eastern side of Garforth but there are now more modern housing estates beyond along Fairburn drive. Historically there seems to have been little of note along Ninelands and as such there are very few images for this page. The main place to see would have been Trench Pit which you can read about on the pits page. Ninelands Lane with Trench Pit in the background. Trench Pit was on the site which used to be Stocks Blocks for many years but as of 2021 is now the Redrow Poplars and Roundwood development which can be seen in the image here."
