["https://ianatkinson.net/garforth/photos/churches.htm"]
title = "Garforth Churches Old Photos | Ian Atkinson"
full_description = "St. Mary’s was built in 1844 and was mostly funded by the Gascoigne family. This is probably the third church to be built on this site [2]. Every postcard series seems to have photos of the church so there are many different images to enjoy. It's not possible to take quite the same image of the front of the church now as there are houses in the way so I have taken the best view that I can as a general comparison. The Primitive Methodist Chapel in Chapel Lane near the top of Main St. was built in 1876, as can be seen from the date engraved into the front of the building. Today it is the home of SLP College which is a musical theatre school."
