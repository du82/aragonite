["https://ianatkinson.net/garforth/photos/station.htm"]
title = "Garforth Station Old Photos | Ian Atkinson"
full_description = "Garforth station was built in the 1870s by the North Eastern Railway Company, and apart from some glazing on the waiting area is little changed! An earlier station existed which was built in 1834, but this eventually proved inadequate as the number of passengers using rail slowly increased. You can see the old station through the bridge in some of the images looking towards Leeds. There are plans to replace the historic foot bridge with a more modern version to allow wheelchair access to platform 1 in the near future. This card looks to have been taken at the same time as NN05, the lady on the right with a shawl can be seen in both photos and they are framed almost identically. This image is taken at elevation and is looking towards Leeds. The tracks on the left are the Castleford line which ran past Trench Pit and the old goods shed can also be seen on the left."
year_published = 2025
