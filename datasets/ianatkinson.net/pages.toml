["https://ianatkinson.net/garforth/photos/postcards.htm"]
title = "Old Postcards of Garforth | Ian Atkinson"
full_description = "These are the Garforth postcards broken down by publisher. I collect these so if you have any cards that you'd like to sell please let me know. Most of the cards are used elsewhere on the site in the correct places however they are also laid out below by card series for anyone who is interested. Where possible I have noted the sequence numbers for the cards and presented them in order. Any card which starts NN means 'no number' i.e. I have assigned my own NN numbers just so I can keep track of them. Over time I may be able to give some of the NN cards their correct numbers. Bramley were a local Leeds company based in Cross Gates just up the road from Garforth. The company address is given as Bramley, Publisher, The Electric Press Printing Works, Cross Gates, Leeds.There are several Bramley cards without numbers, those which are sequenced are e.g. 'B19'. Other cards are simply marked with 'B' in one corner or just the number.The Bramley numbers do not seem to be unique for example different cards from different places may be marked 'B19'.There are also tinted versions of some cards available. The Frith company is still in existence today as Francis Frith who sell many items with their old images on as well as old maps etc.Frith cards are marked with a place code (of their own devising) and a number. The place code for Garforth is GFH so all Frith cards for Garforth are marked e.g. 'GFH3'. For Guiseley this is GSY.This sequence is also used for the Lilywhite cards (the owner of Lilywhite later ran Frith) however the cards in each series are not the same i.e. Lilywhite GFH2 is different to Frith GFH2.For Garforth There are 46 Garforth images in the Frith archive (51 including tints), for Guiseley there are 50. Currently only a subset of these appear on the main Frith website for purchase. Historically not all Frith images of a given place were published as postcards so it's unknown how many of each set might physically exist other than those shown below.For Garforth the Frith cards are dated from either c.1955 (GFH1-19) or c.1965 (GFH20-46).Not all Frith cards in the gallery below can be viewed at full size due to copyright restrictions, all Frith cards are copyright The Francis Frith Collection and those that can be viewed are used with permission."
