["https://ianatkinson.net/garforth/photos/briggate.htm"]
title = "Garforth Main Street (Briggate) Old Photos | Ian Atkinson"
full_description = "Briggate, today known as Main Street, lies at the heart of the town dividing West Garforth from Church Garforth. Once mainly residential with a few small shops it has changed over time into a busy shopping street and is the centre of the modern community. Architecturally Main Street is now very mixed with many old buildings surviving amongst less appealing 1960s brutalist concrete and more recent redevelopment. Many old details are obscured by gaudy modern shop fronts so as always it is for interested persons to try and see through to the history beyond. We begin here with a collection of old shops which were all situated on Briggate over the years. I love old shop photos from the days when people took a lot of pride in their businesses and the proprietors can often been seen posing outside. The cage on the roof of the building held the air raid siren from the war which I can remember being there in the 80s when I was small. Looking up Briggate with Holly House in the centre left of the frame along with the end of Barley Hill Road. The pale building on the far side of Barley Hill road was Preston’s tailors shop. Later on this unit was Knowles’ greengrocers and Everett’s the butcher’s [3]. This unit is now La Bella Vita Italian restaurant. Opposite the end of Barley Hill Road looking down towards Lidgett Lane. In the centre right of the frame is Alfred Smith’s grocery shop and the attached living quarters known as Holly House (‘China Town’ in the contemporary image). Holly House later became the Leeds and Holbeck Building Society. Alfred Smith’s shop was later owned by a Mrs Holliday and then the Shaws [3]. Holly House with the edge of Barley Hill Road just visible in the centre right of the frame. The house in the left of the frame no longer exists and newer shops have been re-built in its place. The little girl in the picture is Flo ‘Flo Toes’ James who in later life was a teacher at the Parochial School and also starred in local theatre [3]. Looking towards Lidgett Lane, this image shows Holly House and the end of Barley Hill Road in the centre of the frame. In the right of the frame is a parade of shops comprising of H. Appleyard, P. Breckon’s sweet shop and and Louis Dimler’s pork butcher’s [3]."
