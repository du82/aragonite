full_description = "There are several churches in Guiseley of different denominations, some are still standing and others have since been demolished. These interior photos were taken on the heritage open day in 2024 with the kind permission of the reverand. Guiseley rectory is an Elizabethan Grade II* listed building which was originally build in 1601 by Robert More who was the Rector at the time. The rectory may have been build on the grounds of an ancient manor house. The building is now private housing. The Wesleyan Methodist Chapel in Oxford Road was built in 1896 and demolished in 1985 where a replacement church was immediately built."
