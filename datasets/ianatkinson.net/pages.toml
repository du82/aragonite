["https://ianatkinson.net/garforth/photos/church-lane.htm"]
title = "Garforth Church Lane Old Photos | Ian Atkinson"
full_description = "Here we follow Church Lane from its starting point near the bottom of Main Street until it meets Ninelands Lane at the top end. Running East-West through what was historically known as Church Garforth, Church Lane contains a mixture of newer houses as well older houses and of course two churches. Sadly many older and grand houses such as The Grange and Rose Villa as can be seen below were demolished years ago to make way for the Grange estate which went up around the 1960s. These images show the Parochial School which stood at the end of Church Lane opposite the Library. The school was closed in 1990 and demolished in 1994 where the medical centre was built in its place. I remember the school standing empty when I was younger, I never went inside as I was at Barleyhill Infants School and then West Garforth Junior School and I don't think I've ever seen a photo of the interior either. This parade of shops stood where the Library now stands and included Varley’s Hairdressers, Laycock’s newsagents and Shackleton’s bakery [3]. The cricket ground is on the left hand side behind the hedge and the methodist church is on the right with St. Mary's further in the distance. The Grange was a large house which stood on Church Lane. The house was demolished in order to make way for the Grange estate, which was of course named after the house [3]. The Hollies was built in Church Lane by a man named Jabez Wooley who owned a brickworks in Leeds [3]. The Hollies is now a home for the elderly but still retains its original name. St. Mary’s church hall, which burnt down in the 1990s. The huts used by the Scouts and the Girl Guides can be seen in the background amongst the trees. The church grounds are on the right hand side and the cottages on the left were demolished in order to make way for Oak Crescent [3]. Looking down Church Lane with the church wall on the left. The car with registration A4062 appears in quite a few of the Parkinson and Roy cards, I suspect they were all taken on the same day though I don't know who's car it is!"
year_published = 2025
clearnet = "https://ianatkinson.net/garforth/photos/church-lane.htm"
