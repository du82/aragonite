title = "About Ian"
description = "I have over 20 years of rich experience in leading editorial teams and shaping content strategies, with a knack for steering through digital transformations. I'm skilled in both B2B and consumer publishing sectors. I'm not just good at brainstorming ideas with editorial teams but also excel in presenting concepts to"
full_description = "I have over 20 years of rich experience in leading editorial teams and shaping content strategies, with a knack for steering through digital transformations. I'm skilled in both B2B and consumer publishing sectors. I'm not just good at brainstorming ideas with editorial teams but also excel in presenting concepts to top-tier clients. My approach combines strategic thinking with hands-on expertise, empowering teams to create brilliant content against a background of constant change. I've had experience in leading large teams through times of change, and I can help you do that too.That's the official bio, but there's a lot more to know about me.I used to edit a Mac magazine, back when there were such things. I started on MacUser in the UK in 1995, and edited it from about 2001 to 2003. After that, I did quite a bit of freelance technology journalism.I launched a website called Alphr.com for Dennis Publishing a few years ago.We made a bit of a splash for a while, and it was lots of fun.I was director of content and audience development for Bauer Media in the UK.This means I ran the content side of many websites, from Grazia and Heat to Parkers and Motorcycle News. That included everything from content strategies, social media, building teams to create award-winning video, and more.I wrote an off-the-cuff short comedy blog post which became an Internet Law.Yes, I am that Ian Betteridge and one day I will write up what it’s like to be best-known for something that was intended as a throwaway remark.A few years ago I started writing fiction. Like a lot of creative people, I found that the higher I went up the career ladder the less hands-on creative work I did. So I started writing fiction, and I've had a few short stories published. I'm currently working on a novel, which one day soon I will actually finish. This work by Ian Betteridge is licensed under CC BY-SA 4.0"
