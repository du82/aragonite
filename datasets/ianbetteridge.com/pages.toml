["https://www.ianbetteridge.com/ten-blue-links-reinventing-drink-ordering-edition"]
title = "Ten Blue Links “reinventing drink ordering” Edition"
description = """
1. Inventing the future





If there is a book about Apple, I have probably read it. On my first day working at the company in 1989 I was given the obligatory copy of then-CEO John Sculley’s Odyssey: From Pepsi to Apple. After that, I devoured as much as I"""
full_description = "1. Inventing the future If there is a book about Apple, I have probably read it. On my first day working at the company in 1989 I was given the obligatory copy of then-CEO John Sculley’s Odyssey: From Pepsi to Apple. After that, I devoured as much as I could. I don’t think I have read a book like John Buck’s Inventing the Future, though. It’s getting on for 500 pages of interviews, history and anecdotes about Apple’s Advanced Technology Group, and I highly recommend it if you want to hear stories which haven’t been told before about Apple. I really wish it had an index, but it’s still well worth the money. 2. Apple’s web video mojo Durig a conversation about Apple QuickTime, Kevin Marks pointed me at this article he wrote back in 2006 on why the company was losing its web video mojo. Kevin was right then – Apple could have owned web video – and someone really needs to sit down and write the history of that part of the company’s story. How did they mess up? As Kevin puts it “they invented pop-up web ads, and put one in before playing any web QT movie to sell the ‘Pro’ version of the player. They crippled the QT Player to remove the editing features unless you paid – even for the Mac users who had had the benefit before.” A lesson for today’s Apple, too. 3. Future is cleaning house IMore, the 16 year old site which was born in the wake of the iPhone, is to close down. It’s not the only one of Future’s tech brands to be shuttered: AnandTech, the technology brand which had one of the best reputations in the world, is also going although its archive will stay online for the foreseeable future. I’m not surprised – while both sites were well regarded, they were not a great fit for the affiliate-led strategy that Future has been pursuing for many years (where it was ahead of most publishers). 4. “Pray we don’t alter the deal further” One of the reasons I loathe – and I really do mean that – the current generation of tech giants is their ability to lock down markets for software and pull the rug out from under existing application developers. The latest example is iA, which has effectively killed off the Android version of its wonderful writing app iA Writer after Google changed the rules regarding letting applications access Google Drive. “In order to get our users full access to their Google Drive on their devices, we now needed to pass a yearly CASA (Cloud Application Security Assessment) audit. This requires hiring a third-party vendor like KPMG.” Yes, that’s right: pay an auditor maybe a couple of months of revenue in order to access cloud storage. But it’s not just Google: Apple has the same control, as iA point out in a footnote. 5. Halide rejected from the App Store No really, it’s not just Google. After seven years, and despite being featured in the iPhone 16 keynote, an update to Halide was rejected from Apple’s App Store because its permissions prompt wasn’t explicit enough that the app, which is a camera app and takes pictures, was in fact a camera app which takes pictures. Apple admitted this was a mistake, but how many “mistakes” never get corrected because the app isn’t high profile enough to get the right level of attention? 6. Why this blog will be moving soon I’m not a massive fan of WP Engine as a company, and I wouldn’t recommend them as a WordPress host for a bunch of small reasons, but I have no doubt at all that Matt Mullenweg’s apparent crusade against them is one of the hollowest and most disingenuous set of complaints I have seen in a long time. Pulling the rug out from users getting security updates is an unforgiveable move. This blog is hosted by WordPress.com, and I don’t particularly want to move back to self-hosting WordPress. Anyone got any recommendations? 7. Return to work and die I mean, literally die. For four days. With no one noticing. 8. Remember the TouchPad? This one is a definite trip down memory lane: The HP TouchPad was a WebOS tablet that had many of the attributes necessary to compete with the iPad, and yet was dumped by HP 49 days after its release. And I had completely forgotten that Russell Brand did an advert for it. Oh boy. 9. Cosmic Alpha 2 COSMIC DE has moved into alpha 2. If you don’t know about it, it’s a new Linux desktop environment which has been created as part of the next big upgrade to PopOS, the distribution created by computer maker System76 for its range of machine. I’m using it on my ThinkPad, and – so far at least – it’s been stable and very usable considering its alpha status. I’ve seen release versions of open source products be less stable. I might write something longer about my experience of Cosmic DE as I use it more. 10. Douchebros want to ruin bars, now Sometimes I really wish that the idea of “disruption” in business had never been invented, because it really does attract some of the worst ideas. Case in point: disrupting queuing for a drink in a bar. No. Just no."
year_published = 2024
year_updated = 2024
