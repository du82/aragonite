I have"""
full_description = "I have over thirty years of experience in content development across every platform, from web to video to social media and more. I specialise in transforming content strategies in both B2B and consumer brands and – equally important – coaching senior leaders and frontline content creators to do fantastic work. I have worked with media businesses like Bauer and Dennis Publishing, and creating content strategies for brands as diverse as BT, Virgin Media, Centrica, Barclays, Marks and Spencer, Volvo and more. Digital TransformationMy career has been shaped by digital transformation — from launching award-winning digital brands to rebuilding teams in times of uncertainty. I've learned that true change isn't just about implementing new systems or strategies; it's about understanding the delicate interplay between technology, human behaviour, and organizational culture.When you work with me, you're partnering with someone who brings both proven methodology and authentic human connection to every engagement. My approach is built on three core principles:Deep listening that goes beyond surface challenges to uncover root causes and opportunitiesData-informed strategy that balances analytical rigor with practical wisdomEmpathetic leadership that builds trust and drives lasting changeCoachingMy approach isn't about simply coming in and changing things for you – it's about leaving you with a legacy of improvement in your leadership and your team through coaching. My coaching methodology is built on the belief that effective leadership emerges from self-awareness, strategic thinking, and emotional intelligence. Through our work together, we'll:Explore your unique leadership style using proven frameworks and real-world scenariosDevelop practical strategies for navigating complex organizational challengesBuild resilience and adaptability through targeted skill developmentCreate accountability structures that drive meaningful progressI've seen this approach transform leaders at every level—from helping a creative director rebuild team morale after a difficult restructuring to guiding a CEO through the launch of a digital-first strategy that doubled their audience engagement.Digital Transformation Success StoriesMy experience in digital transformation spans from legacy media brands to cutting-edge digital platforms. Some highlights include: Leading a digital growth strategy for Grazia, where we grew online audience from 250,000 to two million monthly users while maintaining the brand's premium positioningChanging Parkers' digital strategy, creating new revenue streams through innovative content models and audience engagement strategiesDeveloping and implementing a content model for Heat that balanced traditional media with emerging digital platforms, resulting in a 300% increase in traffic growthTaking a traditional technology magazine brand and relaunching it as a new, exciting and award-winning siteContent Development ExpertiseContent strategy isn't just about creating engaging material—it's about building sustainable systems that deliver value consistently. My approach to content development combines creative vision with systematic execution:Audience-First Strategy: Using data analytics and audience insights to create content that resonates deeply with your target marketMulti-Platform Excellence: Developing integrated content strategies that work seamlessly across digital, print, and social channelsSustainable Systems: Building content processes that scale efficiently while maintaining quality and brand consistencyInnovation with Purpose: Implementing new technologies and formats that enhance storytelling without losing sight of core business objectivesI've applied these principles across diverse scenarios, from helping traditional publishers pivot to digital-first models to guiding brands in developing distinctive voices in crowded markets.Let's start a conversation about how we can build your path to sustainable success."
