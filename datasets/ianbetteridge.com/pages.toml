["https://www.ianbetteridge.com/weeknote-sunday-15th-december"]
title = "Weeknote, Sunday 15th December"
description = """
* I’m pinching the bullet pointed style of week note from Alice Bartlett.
 * Last week at work, and not back until the 6th of next year. That’s three weeks off. Glorious, and much needed.
 * Related: I have had two long (for me) lie-ins, on Saturday and Sunday mornings. Instead"""
full_description = "I’m pinching the bullet pointed style of week note from Alice Bartlett. Last week at work, and not back until the 6th of next year. That’s three weeks off. Glorious, and much needed. Related: I have had two long (for me) lie-ins, on Saturday and Sunday mornings. Instead of waking up thinking of work projects, I have working up and got straight back to sleep again. Double glorious. I will be very glad to see the back of 2024. I was looking through some old journal entries yesterday and it’s surprising how much I’ve said that in the past. I was glad to see the back of 2013. 2014 wasn’t that great either. But it got better, and maybe this coming year will too. On Saturday I headed into that there London to take a look at two exhibitions: Digital Dreams at Tate Modern, and 80s Photography at Tate Britain. Digital Dreams was OK, but found it hard to string together a narrative, which was understandable given the subject matter. 80s Photography was deeply disappointing – not for the work, which was fine, but for the complete lack of actual contextualising. I was there, I should have loved this, and I didn’t. New year coming, which means reevaluating a few things including the tools that I use. I’m probably going to move away from Dropbox and Fastmail, which have been stalwarts for the past year. I have a lot of different options for email and storage, and unfortunately none of them quite fit what I want. More on this another time."
year_published = 2024
year_updated = 2024
