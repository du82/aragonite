["https://www.ianbetteridge.com/weeknote-sunday-12-january-2025"]
title = "Weeknote, Sunday 12 January 2025"
description = "* It's been COLD. Cold weather always reminds me of being a kid because the home I grew up in was cold. It was a council house, and had a gas fire in the front room (what people call a living room these days) and one in the kitchen. The rest"
full_description = "It's been COLD. Cold weather always reminds me of being a kid because the home I grew up in was cold. It was a council house, and had a gas fire in the front room (what people call a living room these days) and one in the kitchen. The rest of the house? Nothing. The beds had many blankets. We got central heating and double glazing (along with an indoor toilet) when I was about 10. Physio appointment on Tuesday, which went fine. I have pressure on one of the nerves in my back (not the sciatic one, another nerve) which means occasionally I get back pain and the front of my thigh goes numb. I have to do daily exercises. It's not a big deal.Somehow, I managed to also give myself RSI in my left wrist. I have no pain or problems with typing, but my pinch grip is variable. Index finger, fine, then it gets weaker across to my little finger. Bodies are weird, man. It's getting better, but slowly.It was also my first week back at work, which was a decent enough week, but BOY did I find the whole getting up thing hard. My reading this week fell off the cliff, basically because of that issue with getting up. I was pretty pleased with my newsletter this week. I am less pleased with the overall state of the world. It's interesting the way that has evolved. The original idea was a short, snappy summary of ten stories of the week. It's become a long essay which tries -- and sometimes succeeds -- in linking together a load of stuff. There are definitely consistent themes. A bad night's sleep last night, which means I fell back to sleep and woke up at 11. Bad habits, man. Bad."
year_published = 2025
