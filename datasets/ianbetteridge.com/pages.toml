["https://www.ianbetteridge.com/ten-blue-links-folsom-prison-blues-edition"]
title = "Ten blue links, Folsom Prison Blues Edition"
description = """
1. Oh, WordPress!





Not content with their CEO getting into a stupid public spat with a user and apparently revealing information about them which should have remained private, WordPress announced it was doing deals to give access to their customers’ posts and content to train “selected AI partners” (although not,"""
full_description = "1. Oh, WordPress! Not content with their CEO getting into a stupid public spat with a user and apparently revealing information about them which should have remained private, WordPress announced it was doing deals to give access to their customers’ posts and content to train “selected AI partners” (although not, at all, people hosting their own version of WordPress, so please shut that rumour down). The most charitable interpretation of this is that the company messed up its comms. The least is that it’s started into an enshittification spiral, which will ultimately lead to it becoming the same kind of terrible service as everyone else. Related: I’m pondering whether I should start self-hosting again. 2. Good bus services or a tunnel that sets your skin on fire? Who knows which one is best for America The Boring Company was always a joke, producing precisely one usable tunnel with money that should have been spent improving public transport infrastructure. Now its one tunnel is causing maintenance workers to get chemical burns from toxic waste. Go Elon. Where’s my pitchfork? 3. Apple gets stuck in traffic Apple’s car project was a legacy of the era when Jony Ive ruled the roost and had decided he could design better products than anyone else in the world. I’m actually quite surprised that it lasted as long as it did after he left the company. And now, apparently, it’s finally dead. From a business perspective, it never made any sense: historically, car manufacturer margins have been far smaller than the 30-40% that Apple wants. Tesla had higher margins than everyone else mainly because it bilked the government of the US for massive subsidies, cut corners in its manufacturing, and did everything possible to avoid providing any kind of proper customer service. While I’m sure Apple would have loved some of those sweet, sweet corporate welfare cheques, the rest of the Tesla Method of Business™ is probably not where it wants to be. 4. How publishing is losing its soul There have always been publishers whose relationship with advertisers was a little too cosy. Even back in the days when selling ads was like shooting fish in a barrel with a bazooka, ad sales people would try a little “friendly chat” with a journalist to “check in and see how product X is doing”. Most journalists always told them, in a friendly way, where to get off. But as times get tougher and things get more desperate, it’s natural that executives are going to lean on journalists to “do the right thing for the company” rather than for their audience. This piece, from a year ago, is about CNET, but I guarantee they are not the only ones doing the same. Private equity companies only care about getting a return on their investment as soon as possible. They aren’t concerned about the long-term viability of a brand — and they definitely aren’t concerned about the people reading the content. Of course, once they have fired all the journalists and replaced them with “prompt engineers” that will be problem solved because there will be no one left to complain. 5. Prison laptops are a thing? I didn’t know they were, until I read this Twitter thread. Amazing. 6. Desperate times make desperate publishers It’s not that long since publishers were wary of getting into a legal tangle with the likes of Google because they wanted to keep the provider of most of their traffic onside, but these days things are different. I don’t know whether this will be successful or not — despite my ‘O’ level in law, I am not a lawyer — but I’m absolutely certain that Google’s 50,000 gorilla-like presence in the adtech market distorts it in a variety of ways. Let’s not even start on Facebook. Yet. The one caveat to all this is that $2.3bn is 1% of the amount the company made from advertising last year, so it’s another case of what sounds like a high number to publishers actually being cost-of-business to Google. 7. At last, the worst use of AI (special government edition) I’m not against the use of LLMs for summarisation. In fact, sometimes it’s one of the best uses for it. LLMs can be really good at picking out the salient points of an email, for example, and if you have ever worked in a corporate environment you know quite how much long emails are used to hide important points. But using it for creating drafts of routine responses and to summarise reports for ministers is a recipe for worse government. Why? Because good ministers get into the details of this stuff. Yes, they have many decisions to make, but not getting into the details of your brief leads to awful, hand-waving, big-picture-details-are-for-losers government. Most ministers don’t know enough about the topic area when they start — this will only encourage them not to be immersed in it. 8. How not to do layoff communications One of the things I studied on my leadership masters was how to manage layoffs, and later on, I saw at first hand how excellent leaders and managers do it. I’ve seen the seriousness and discipline it takes to so redundancies in a way which is humane, deeply considers how the communications will work, and also looks hard at the effects of redundancies on the remaining part of the business. It’s always horrible, but it doesn’t have to be either deliberately cruel or handled ineptly. So, I wonder, what is it about tech companies that makes them so awful at it? My gut feeling is that it’s partly down to the culture of the hero founder/CEO: basically, leaders who are not prepared to listen to anyone with actual experience of doing this stuff professionally. 9. Green trade rules are “biased” When Piyush Goyal, India’s trade minister, told the FT that rules inserted into trade agreements with his country designed to reduce carbon emissions were “biased” he got a lot of stick, and a lot of it was classic “greedy Indians” racist nonsense from people who should know better. The fact is that he’s mostly right: the West is expecting India (17% of the world’s population, 3% of its carbon emissions) to stop lifting people out of poverty while the US (4% of the world’s population, 15% of its emissions) doesn’t reduce its emissions anywhere near fast enough. As Goyal put it, “all the environmental damage that has been done in the past has still not been made up for. What about that? Before we add new environmental issues, let’s first sort out who is responsible for the environmental degradation. Certain promises were made in Paris. They have to be delivered upon.” Just as it would like everyone to forget quite how much of its wealth came from colonialism, the West would love people to ignore how much it has benefited from pumping vast amounts of carbon into the atmosphere we all share. Climate colonialism is alive and well and living… well, here. 10. How the Tories radicalised me I often note how the government’s Prevent programme, designed to stop radicalisation, ought to look at the role of the Tory party. Recently, Tory party membership has been a bigger marker of someone being against traditional British values like free speech and the right to protest than anything else. Lewis Goodall wrote a very good piece about the radicalisation of the Tory party, and how it’s now more or less in thrall to conspiracy theories. Certainly, 14 years of Tories has radicalised me: I’ve gone from soft left to full-on “end capitalism now”, which is an unexpected return to my politics of 40 years ago. I should, at least, thank the Tories for opening my eyes again."
