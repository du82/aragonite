["https://www.ianbetteridge.com/john-scalzi-has-a-new-mac"]
title = "John Scalzi has a new Mac"
description = """
John Scalzi has done a terrific overview of the new 16in MacBook Pro (with M3 Max, naturally) that he recently acquired, and I agree with so many of the points in it.


As he says, it is really weird going to a 16in laptop after using a 13in one – I"""
full_description = "John Scalzi has done a terrific overview of the new 16in MacBook Pro (with M3 Max, naturally) that he recently acquired, and I agree with so many of the points in it. As he says, it is really weird going to a 16in laptop after using a 13in one – I dusted off my 16in 2019 MacBook Pro a couple of days ago to keep it updated and make sure I has all my files on it1 and it makes using the Air feel like you’re using a toy computer. It also reminds me how much better the keyboard on the Air is – the MBP was, I think, part of the last generation of Macs before Apple dropped their terrible switches. Like John, I also find myself using USB-C to charge the Air rather than the MagSafe port. I don’t get the love for MagSafe. Sure, if you trip over the cable you have a chance with USB-C to remove your laptop from whatever surface it’s on, but on the few occasions I have kicked a cable the USB-C has come out anyway. Maybe other people’s tables are more slippery than mine? And anyway – with battery life like the M-series machines have, my Air mainly gets charged overnight. It’s really rare I bother plugging it in during the day2. And I entirely agree with him about this, too: If you’re using your laptop for word processing or spreadsheets, with web browsing and occasional light gaming, and you want a Mac, please for the love of God get a MacBook Air, which is so much cheaper, much lighter, and more than enough for what you’re doing with your computer. The time was when even non-pros really wanted/“needed” a MacBook Pro. Now, that’s not the case: if (like me) you spend most of your life in ordinary business applications and don’t do professional audio/video editing, an Air will be more than good enough. Even my puny little base model Air (8Gb RAM, 256Gb SSD) is faster than my much more beefy Intel MacBook Pro at video editing. Not that I do a lot, but on the odd occasions when I do, it works. It’s basically my “reserve” Mac, in case the MacBook Air gets lost/stolen/dies ↩︎ The exception is when it’s on my work desk, where it’s plugged into a USB-C monitor – which has a short cable, so isn’t going to get kicked out. ↩︎"
year_published = 2024
