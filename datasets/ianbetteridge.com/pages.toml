full_description = "The best way to get in touch with me is email. If you want to send me secure encrypted email (preferred if it's something private/secret), you can do that at my Proton account (you'll need to have a Proton account too for maximum security).Social mediaI have a lot of social media accounts, but one place you won't find me is X/Twitter. Despite being there very early (user number 32,069) I'm not going to stay on a site which is run by a drug-addled megalomaniac devoted to making the world a worse place. My main social media account is on Mastodon, and I would encourage you to follow me there. However, I'm also on Bluesky, where I'm pretty active, and I have an account on Threads (where I'm much less active). If you're interested in most posts, all of them go out to all those accounts. You can also find my pictures at Instagram. And if you really want to stalk me, you can also find what I'm listening to at Last.fm. MeatspaceI live in the UK, currently down in sunny Kent. If you want to send me something, email me and I will let you know where you can send it."
