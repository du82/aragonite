["https://www.ianbetteridge.com/weeknote-sunday-29th-december-2025"]
title = "Weeknote, Sunday 29th December 2025"
description = """
* I have been up in Suffolk, spending the week with my sister and her family. This means – as they live in the middle of nowhere – there is remarkably little to report. The only time I actually left the house was to go to the pub.
 * The pub is a local"""
full_description = "I have been up in Suffolk, spending the week with my sister and her family. This means – as they live in the middle of nowhere – there is remarkably little to report. The only time I actually left the house was to go to the pub.The pub is a local country one, the legendary Moon and Mushroom. It was of course rammed with Christmas diners, but they did a good pint.Highlight of the pub trip: an old man who had a stroke. Well, it wasn’t a highlight in terms of his health (he survived and didn’t seem too scathed) but it was definitely the kind of thing that gets a pub full of country people very excited.Because my sister has a better broadband connection than me, I spent some of the time downloading a bunch of movies, only to find of course that my MacBook Air really doesn’t have much free storage. Apple seems to want 150Gb of my 256Gb drive for “System Data”, none of which actually appears in the file system. Cache files don’t add up to that much. Golf clap, Apple.I also spent some time shifting over my website (erm, this website) from WordPress.com to Ghost. Things that are worth knowing if you do this: when you import into Ghost, it will create users for any authors, and it’s not clever enough to realise that the “Ian Betteridge” author you are importing is the same as the “Ian Betteridge” who already exists. You will end up with two version of yourself. Otherwise, it all went super-smoothly.There was football on telly AKA on Amazon Prime. My Manchester City-supporting brother in law was not in the best of moods.I’m typing this on the train back to Canterbury. Not sure what I fancy doing for new year yet – I could go away somewhere, maybe down to Brighton, but I also quite fancy a week on my own doing things from the Long List of Pottering Stuff. We shall see."
