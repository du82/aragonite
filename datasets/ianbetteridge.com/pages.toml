full_description = '''Ten Blue Links, “I thought I was done with Trump, then he dragged me back in” Edition 1. The days of an SEO-only content strategy are over A great thread by Mordy Oberstein, who highlights something that... Technology Read more Nuvia, Qualcomm and ARM’s license to print money Ah, the nuclear option. So why is ARM cancelling Qualcomm’s right to make ARM-compatible chips? To understand what’s... Technology ai arm Business News qualcomm Read more "Ireland doesn't want the money" John Gruber on the EU ruling that Apple owes 13bn euro in taxes to Ireland: Ireland doesn’t want the... Apple Technology Read more Founder Mode, hackers, and being bored by tech I could — and probably should — write an entire essay about the cult of the founder in Silicon Valley, how it... Technology Read more DOJ, Nvidia, and why we restrict monopolies A 1600, a group of English merchants were granted a royal charter, a legal document which allowed them to venture... Technology Read more Taboola targeting Eric Seufert, on Threads: Regarding Taboola’s partnership with Apple: I’ve seen people claim that this is somehow hypocritical... Technology Read more Block, block and block again Jack Dorsey, Bluesky, decentralised social networks and the very common crowd – Attack of the 50 Foot Blockchain: There’s a... Technology Read more Why do people try and forbid linking? Websites That Forbid Other Websites From Linking to Them – Pixel Envy: Some of these are even more bizarre than a... SEO Technology Read more What a difference four years makes John Gruber in 2020 on the tracking industry led by Facebook: The entitlement of these fuckers is just off the... Apple Technology Read more On the fine art of technology reviews Nearly thirty years ago I reviewed my first product. It was a Lexmark solid ink inkjet printer, created for designers... Journalism Technology Read more Ten blue links, Folsom Prison Blues Edition 1. Oh, WordPress! Not content with their CEO getting into a stupid public spat with a user and apparently revealing... Linkblogs Politics Technology Read more'''
