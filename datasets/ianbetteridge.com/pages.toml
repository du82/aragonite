["https://www.ianbetteridge.com/weeknote-sunday-10th-march"]
title = "Weeknote, Sunday 10th March"
description = """
Last week we went to see Dune. It’s a pretty amazing film, the kind that you just let wash over you and experience rather than trying too hard to intellectualise. You definitely need to have seen the first part, though.





I have some news about work which I will"""
full_description = "Last week we went to see Dune. It’s a pretty amazing film, the kind that you just let wash over you and experience rather than trying too hard to intellectualise. You definitely need to have seen the first part, though. I have some news about work which I will be able to share with everyone next week… yes, I am an international man of mystery. But on Wednesday last week I gave a couple of hours training on video content strategy, something that I am surprised to realise I’ve been doing regularly for about 15 years. One thing I really enjoy about giving training courses is it makes me realise that I actually know quite a lot about something, and also put it all down on paper. Because there are too many hours in the day, and because a new version of KDE Plasma is out, I spent some time installing it on my ThinkPad. I had a bit of a play with KDE Neon — the distribution the KDE team created to showcase the most up to date KDE packages — but then decided to install the pre-release version of the Fedora 40 KDE spin. I’ve grown pretty comfortable with Fedora as a distro, and it’s close enough to release to be stable. Things I have been writing I wrote about the future of search-driven affiliate content. The short version is, I don’t think there is one, at least not to the degree that many online publishers are relying on now. In particular, I think the impact of conversation-driven search, which incorporates LLMs to create queries from natural language, will make a big difference. Meanwhile, this week’s ten blue links was a “too much Apple edition”, thanks to Apple driving off a cliff while shooting itself in the foot. Things I have been reading This has been a slow week for reading. Having completed Burn Book I’m doing the thing I often do, which is to bounce around a couple of different books to see what sticks. I’ve read a little bit of Steven Sinofsky’s Hardcore Software, as well as Plunder of the Commons. Too many books, too little time."
year_published = 2024
year_updated = 2024
