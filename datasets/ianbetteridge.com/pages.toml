full_description = '''I have over 20 years of rich experience in leading editorial teams and shaping content strategies, with a knack for steering through digital transformations. I'm skilled in both B2B and consumer publishing sectors. I'm not just good at brainstorming ideas with editorial teams but also excel Every week I write about the places where technology, content, culture and politics meet. Sign up to stay in touch. 1. From the department of super-genius ideas Sergey Brin wants Googlers to work 60 hours a week in the office, so the company can develop AGI, which will then mean they can make more of their employees unemployed. Sure, sounds like a great deal to me! Of course, Brin also 1. The front line of enshittification Printers are probably the most maligned of all technologies. Everyone -- and I mean everyone -- hates their printer. But why? Well, blame HP. HP pioneered some of the most egregious practices in tech, such as subscriptions for ink which won't let OK, so perhaps it's time to post something about what Apple’s Advanced Data Protection is, what it does, and why it's inaccurate to say that Apple is "removing iCloud end-to-end encryption". Bear in mind I am simplifying, but only slightly and mainly so'''
