["https://www.ianbetteridge.com/some-thoughts-on-apple-vision-pro-and-vrar-in-general"]
title = "Some thoughts on Apple Vision Pro (and VR/AR in general)"
description = "* As many people have noted, the ultimate platform for augmented reality is something that is both portable (can be worn all the time) and invisible (not a huge set of goggles which get in the way of your interactions with the world. We are so far away from this in"
full_description = "As many people have noted, the ultimate platform for augmented reality is something that is both portable (can be worn all the time) and invisible (not a huge set of goggles which get in the way of your interactions with the world. We are so far away from this in terms of technology that I would be surprised if we even have it in my lifetime (see also: fully autonomous vehicles that you can drive in). The price of Apple Vision is not unreasonable given the technology in it. They are not selling this at a loss, and I would expect the margins on it are similar to other Apple products, but Apple Vision is not something that can currently be made at under $1000, which is probably the sweet spot for this kind of tech. As with the Apple Watch, the company has a set of use cases in mind. As with the Apple Watch, these will almost certainly not be the uses that customers actually find most compelling. Expect the marketing to shift in response to what actually resonates with people. This represents a minor potential issue for Apple. Apple Watch was priced low enough to have quite a wide spread of customers, especially once the cheaper hardware options appeared after a year or two. Apple Vision is priced too high to get a wide range of customer types. The danger is that it will skew too heavily towards highly-affluent customers, and they kinds of uses they make of devices, for Apple to get much insight into what the real uses of Apple Vision are. Apple doesn’t do much testing with real users (even under NDA) before products are released. That means real-world feedback is vital. The criticisms that people have made about the battery life are really not that relevant. No one is going to use this wandering around. You’re going to mostly have your behind in a chair. I’ve done a lot of VR demos when moving and nothing breaks the “reality” of the app you’re using than trying to do much in the physical world. Yes, the passthrough video means you can do this. But trust me, you won’t. It’s a shame that you can’t have multiple Mac “monitors” open at the same time. But you can have multiple apps, so I would guess quite a few of the things you want to keep open on multiple monitors will devolve to native apps. It’s a bigger shame Apple has chosen to only have an App Store model for software. The lack of hackability of the platform won’t matter to most people, but it does matter to me. This isn’t a market of customers who need the same level of “protection” as on a smartphone, so the justification that all apps need to be checked for malware doesn’t exist on this platform. This was a chance for Apple to break with the past. It’s chosen not to do so. I wonder if, strategically, Apple has ended up “skating to where the puck was” rather than where it’s going to be. It’s taken so long to get Apple Vision out – by some reports, perhaps ten years – that the interest in and relevance of VR and AR has died down. VR’s use cases have mostly boiled down to games. AR is still not really a possibility, at least not in its ultimate form."
year_published = 2024
year_updated = 2024
