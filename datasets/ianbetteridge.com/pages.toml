["https://www.ianbetteridge.com/ireland-doesnt-want-the-money"]
title = '''"Ireland doesn't want the money"'''
description = """
John Gruber on the EU ruling that Apple owes 13bn euro in taxes to Ireland:





Ireland doesn’t want the money… What a great win for Margrethe Vestager, making clear to the world that the EU is hostile to successful companies. Good job.



Ireland has long had a reputation as,"""
full_description = 'John Gruber on the EU ruling that Apple owes 13bn euro in taxes to Ireland: Ireland doesn’t want the money… What a great win for Margrethe Vestager, making clear to the world that the EU is hostile to successful companies. Good job. Ireland has long had a reputation as, effectively, an in-EU tax haven — one which walked very close to the line of EU and international law And the country has been especially "favourable" to large tech companies. As the Irish Independent notes: The Government continues to claim there was no special treatment for Apple, and these were all ­merely legitimate tax exemptions. The ECJ says otherwise, with its final judgment: “Ireland granted Apple unlawful aid, which Ireland is required to recover.” The judges ruled that Apple’s two units incorporated in Ireland enjoyed favourable tax treatment compared with resident companies taxed in Ireland that were not capable of benefiting from such advance rulings by the tax authorities here. A rotten deal, indeed. And the Irish government itself has long known that its sweetheart deals weren’t up to international standards: As finance minister from 2017, Paschal Donohoe wisely started a process of bringing Irish rules into line – including rolling back the IP reliefs – and eventually signed up to the new OECD corporate tax deal. Ironically — and counter to John’s point — the conversation in Ireland is already about how to use the windfall from Apple to invest in infrastructure which will help maintain its position as a hub in the EU for tech businesses: And then there is what Ireland can – and cannot – offer. Promises – about clean energy, top-class education, abundant water and so on – count for little now. The State has the resources to address this, helped by another €14 billion which will soon be resting in our account. But the question investors are asking is whether Ireland can actually deliver. It’s not just tax, of course. Ireland has also been recognised as the most lax data protection regime in Europe, so much so that the EDPB was forced to step in and make the Irish DPA enforce its own rules against Meta. John’s reaction to that case was a little different.'
