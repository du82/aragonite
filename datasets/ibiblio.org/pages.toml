["https://ibiblio.org"]
title = "The Public's Library and Digital Archive"
full_description = "Blog Poetry Available through ibiblio Spring is soon approaching, a season that may ignite the artistic side in many of us. Poetry is a great compliment to this wonderful time of the year: the Greek ‘poiesis’ (ποίησις), from ποιέω ‘to make’, reflects the rejuvenation many of us feel during springtime. See below for a couple of ways to access poetry through ibiblio! There are a couple of notable ways to access poetry via ibiblio – Project Gutenberg and the Internet Poetry Archive. Project Gutenberg may already be familiar to some users. The project is overseen by the PGLAF and acts as an online library of freely downloadable eBooks. Via Project Gutenberg, readers can connect with an expansive library of literature both new and old. To view poetry available through Project Gutenberg, navigate to ‘Bookshelves’ via ‘Search and Browse’. From there, you can select the ‘Poetry’ category and sort by title, author, release date, or popularity. The Internet Poetry Archive, created by ibiblio founder Paul Jones, aims to “make poetry accessible to new audiences [providing] teachers and students of poetry new ways of presenting and studying [contemporary] poets and their texts.” Follow the link to explore the writings of poets like Seamus Heaney, Margaret Walker, and Yusef Komunyakaa. Also, see Paul Jones’ webpage for a selection of his recently published poetry. Please enjoy this springtime poem by Gerard Manley Hopkins. Happy reading! Spring NOTHING is so beautiful as spring— When weeds, in wheels, shoot long and lovely and lush; Thrush’s eggs look little low heavens, and thrush Through the echoing timber does so rinse and wring The ear, it strikes like lightnings to hear him sing; The glassy peartree leaves and blooms, they brush The descending blue; that blue is all in a rush With richness; the racing lambs too have fair their fling. What is all this juice and all this joy? A strain of the earth’s sweet being in the beginning In Eden garden. Have, get, before it cloy, Before it cloud, Christ, lord, and sour with sinning, Innocent mind and Mayday in girl and boy, Most, O maid’s child, thy choice and worthy the winning. 4 March 2024 SoundExchange and Digital Audio Streaming ibiblio hosts several digital audio streams, all of which broadcast copyrighted material regularly. You may have wondered, “How are intellectual property owners paid when their recordings are broadcast online?” In the USA, royalties are owed to intellectual property owners each time a sound recording is played. An organization that centralizes management of these these rights for public radio stations that stream online is SoundExchange. Additionally, SoundExchange provides payments to artists and intellectual property owners when their music is broadcast online. To ensure an equitable distribution of royalties, data associated with the sound recording is processed, and a payment is collected from the statutory licensee. Then, shares are allocated, processed, and distributed to the intellectual property owners. You can follow this link to visit SoundExchange’s official website. Additionally, you can learn more about SoundExchange’s history and purpose via the associated Wikipedia page. SoundExchange compliance helps to ensure that royalties from broadcast sound recordings are distributed properly. Each audio stream we host must send SoundExchange reports to ensure royalties are properly distributed. One of the most important things this report includes is the total number of times a recording is received by a unique listener. This is known as the actual total performances, or more colloquially as “per play, per listener.” Our audio streams produce logs which we can then compile into a report for SoundExchange. Actual total performances is used to calculate the amount owed by a radio station to the intellectual property owners. Equitable distribution of royalties helps keep the digital audio streams we host sustainable. You can visit some of these radio stations and access their online streams for your music listening pleasure. Here are a few of the radio stations we host: Concierto – Spanish/English classical music produced by WDAV WCPE, The Classical Station WXYC – UNC-Chapel Hill’s student radio station 24 January 2024 Winter Reads with Project Gutenberg This collection of books and short stories contains recommendations perfect for cold weather and the holiday season. They are accessible through Project Gutenberg, a library of over 60,000 free eBooks in the public domain. You can read more about Project Gutenberg here, and browse their bookshelves to find more great titles! See below to explore titles to enjoy while trying to stay warm this winter! The Gift of the Magi This short story, published in 1905, tells of a couple who need to buy gifts for each other but must make sacrifices to find the perfect gift. The Gift of the Magi teaches a great lesson about gift-giving and is a valuable story to read or reread during the holiday season. Winter Sports in Switzerland This illustrated book from 1913 has chapters on tobogganing, skiing, skating, hockey, and more. It describes Swedish traditions and culture and provides insight into sports and life in 20th-century Switzerland. King Winter In this story, King Winter, the embodiment of the Christmas Spirit, leaves his palace of snow to bring winter to the land and reward obedient children with holiday sweets (Library of Congress). King Winter is a rare German children’s story from the 19th century inspired by a character from Germanic and Norse traditions. Little Women Louisa May Alcott’s Little Women follows four sisters throughout their lives. Pivotal scenes occur during Christmastime, and the descriptions of winter in New England make this a festive read for snow days. A Christmas Carol A Christmas Carol by Charles Dickens is a well-known holiday classic about a businessman who changes his attitude about Christmas after being visited by a host of spirits. Dickens’ story has been adapted many times for the stage and film, but it is worth reading the original material to know where the text came from! 1 December 2023 1 2 3 … 64 Next Page→"
