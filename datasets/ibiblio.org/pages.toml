title = "Supporters"
full_description = "Supporters NetApp creates innovative storage and data management solutions that deliver outstanding cost efficiency and accelerate business breakthroughs. Customers around the world choose us for our “go beyond” approach and broad portfolio of products and services. Our solutions provide nonstop availability of critical business data and speed product development, so you can deploy new capabilities with confidence and get to revenue faster than ever before. Discover our passion for helping companies around the world go further, faster at www.netapp.com. IBM, world leaders in the creation, development and manufacture of the industry’s most advanced information technologies, including computer systems, software, networking systems, storage devices and microelectronics. The Internet Archive is a 501(c)(3) non-profit that was founded to build an Internet library, with the purpose of offering permanent access for researchers, historians, and scholars to historical collections that exist in digital format. Founded in 1996 and located in the Presidio of San Francisco, the Archive has been receiving data donations from Alexa Internet and others. In late 1999, the organization started to grow to include more well-rounded collections. Now the Internet Archive includes texts, audio, moving images, and software as well as archived web pages Fedora is a Linux-based operating system that showcases the latest in free and open source software. Fedora is always free for anyone to use, modify, and distribute. It is built by people across the globe who work together as a community: the Fedora Project. The Fedora Project is open and anyone is welcome to join. The Carolina Digital Library and Archives brings the power of digital technologies to library and archival collections and to the work of scholars, researchers, and students at Carolina and beyond. Established in 2007, the CDLA builds and stewards digital collections at Carolina while developing standards and practices that will advance the work of libraries, archives, and scholarly communications."
