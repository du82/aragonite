                                                                                                                                Help Request                                                                                                                                                                    Contact                                                                                                                                                                    FAQ                                                                                                                                                                           Browse Exhibits"""
full_description = "Linux Distributions Welcome to ibiblio.org’s Linux Distribution homepage! This page lists some of the Linux distributions that we host or mirror–it is not an exhaustive list. To access a distribution, simply click on its title. You will find a link to the distribution’s homepage beneath each description. If you prefer to browse the Linux distribution directory tree itself, please use http://distro.ibiblio.org/. If you need help with installation, you may refer to The Linux Installation HOWTO at tldp.org. For questions on individual distributions, please refer to the distribution’s homepage. These distributions are freely available for download and distribution under Open Source copyleft and licensing restrictions. Please refer to each package for copying and distribution restrictions. See copyleft & licensing for overview explanation of Open Source licensing. AdminsParadiseA full Web-based phone and fax solution that integrates the best-of-breed open source VoIP software Amigo LinuxAMIGO Linux is one of the easiest ways yet to run Linux. Just unzip on a FAT partition and boot. No installation needed. Anubis LinuxAnubis-Linux is a distro that's designed to provide a lot of development tools and documentation. Arch LinuxArch Linux is an i686-optimized Linux distribution based on ideas from CRUX. Archpwn linuxArchPwn is a security based Linux Live CD/DVD system that aims to be a fully working swiss army knife for pentesting purpose (GPL licensed). Archo-Debian LinuxArco-debian is a bootable CD Linux with automatic hardware detection is originally based on Knoppix and Kurumin. BasiclinuxBasicLinux is a multipurpose mini-Linux that boots from HD, FD or CD-ROM. Bayanihan LinuxBayanihan Linux is a complete open source-based desktop solution for office and school use. It is a package that includes an operating system, a word processor, spreadsheet program, presentation software, email facility, an internet browser, and a graphics editor. Bio-LinuxBio-Linux is an Ubunto based Linux distribution created for scientists to use in analyzing biological data. BitCuratorBitCurator contains free and open source digital forensics tools and associated software libraries. BlackArch LinuxBlackArch Linux is a penetration testing Linux distribution based on Arch Linux and designed to be by penetration testers and security researchers. Black Lab LinuxBlack Lab Linux is based on Ubuntu and contains packages for multimedia production, content creation, and software development as well as support for some popular browser plugins. Burning Thunder Pup (BTP)Burning Thunder Pup is a Puppy Linux distribution with (working) Firefox and Thunderbird desktop icons and Wine in the terminal. Blag Linux and GNUBLAG is a Linux distribution based on Fedora Core and reduced to one CD. It includes useful applications missing from Fedora Core (e.g. mp3, p2p, apt, etc…), as well as a suite of graphics, Internet, audio, video, office, and peer-to-peer file sharing applications. CD LinuxCDlinux is a compact distribution of GNU/Linux. The name is a synonymous of “Compact Distro Linux.” It is small in size, yet rich in features. CentOSThe CentOS Project is a community driven Linux project that provides two different Linux distributions. CentOS Linux is a consistent and stable platform. CentOS Stream is a rolling release distribution that runs just before Red Hat Enterprise Linux (RHEL). Damnsmall LinuxDamn small Linux is a very small live CD Linux distribution. It has a working desktop environment yet is small enough to fit on a business card-size CD. Davinci LinuxLinux DaVinci is an operating system based upon Slax, which permits to develop and fulfill Italian schools necessities about computer science course into college schools. Debian LinuxDebian is a Linux based operating system that includes over 50,000 additional packages. DragoraDragora GNU/Linux is a new, independent distribution made in Argentina. Dyne:bolic LinuxDyne:bolic GNU/Linux is a live bootable distribution working directly from the CD without the need to install or change anything on harddisk EasyOSEasyOS is an experimental Linux distribution with a number of features that set it aside from other distributions, it is designed to support containers, it can run totally isolated if desired, the user is root, atomic version upgrade, supports SFS packages, GUIs for everything. Elemental Linux ServerThe Elemental Linux Server (ELS) is designed from the outset to be a minimal, no-frills server distribution. There is no GUI, everything is console-based. EpidemicEpidemic GNU/Linux is a Brazilian Live-CD Linux Distribution based on Debian. The focus is the desktop use. Esun LinuxESUN Linux is an Ubuntu-based distribution containing free software for enterprise management. Fatdog64Fatdog64 is an all 64bit distro built using T2 build scripts and Woof (Puppy) init scripts. FedoraThe Fedora Project is a Red-Hat-sponsored and community-supported open source project, though it is not a supported product of Red Hat, Inc. FortMacTuxFortMacTux is a small, fast, and full featured KDE/Slackware-based, Slax forked, Linux distribution. It was inspired by and for AlbertA. Funtoo LinuxFuntoo is a variation on Gentoo Linux. GenerationsGenerations Linux is a bootable ISO live GNU/Linux operating environment. The ISO9660 image file can be used to burn a CD-ROM or used with virtualization products such as VMware Player or VirtualBox. GibraltarGibraltar, a Debian GNU/Linux based firewall distribution, available for download. This Gibraltar does not need to be installed on a hard disk but can be run directly from the bootable, live CD-ROM. GobolinuxGoboLinux is a Linux distribution that breaks with the historical Unix directory hierarchy. Basically, this means that there are no directories such as /usr and /etc. GranularGranular is a Linux Operating System that is intended to be as user-friendly and flexible as possible. HamuxHamux is based on CentOS Linux and provides packages for Ham Radio. HanthanaHanthana is a Linux based operating system and a Fedora remix suitable for desktop and laptop users. KnoppixKNOPPIX is a bootable CD with a collection of GNU/Linux software, automatic hardware detection, and support for many graphics cards, sound cards, SCSI and USB devices and other peripherals. Knoppix_NSMKnoppix-NSM is dedicated to providing a framework for individuals wanting to learn about Network Security Monitoring (NSM) or who want to quickly and reliably deploy a NSM capability in their network. LadybugLadyBug is a french GNU/Linux Live System base on PCLINUXOS and SAM. Linux MintLinux Mint is based on Debian and Ubuntu. It's a safe and reliable Linux that is designed to be modern, elegant, comfortable, powerful, and easy to use. LinuxSharkLinuxShark is based on opens use 11.2 and The Linux Kernel Version 2.6.32.2, It is regularly updated with the latest security patches and Kernel upgrades. LNXThe LNX-BBC is a mini Linux-distribution, small enough to fit on a CD-ROM that has been cut, pressed, or molded to the size and shape of a business card. Mageia LinuxMageia is a GNU/Linux based free software operating system that is run as a community project and supported by a non-profit organization. Manjaro LinuxManjaro Linux is an accessible, friendly, open-source Linux distribution and community. MepisMEPIS Linux is a Debian-based desktop Linux distribution designed for both personal and business purposes. MyDebianMyDebian is Debian Live based Live Linux distribution. NetLinxNet Linux is remastered and pre-configured Linux 4.31 with Firefox and Skype OnionDSLoniondsl is a live CD based on Damn Small Linux which is set up to automatically bypass the Australian Internet censorship program. OpenMandrivaThe OpenMandriva Association's goal is to develop a pragmatic distribution that provides the best user experience for everyone, from newbies to developers. openSUSEThe openSUSE project is a worldwide community program sponsored by Novell that promotes the use of Linux everywhere. OpenwallOpenwall GNU/*/Linux (or Owl for short) is a security-enhanced operating system with Linux and GNU software as its core, compatible with other major distributions of GNU/*/Linux. PCLinuxOSPCLinuxOS is an English only live CD initially based on Mandrake Linux that runs entirely from a bootable CD. PCPACThe PCPAC project describes a method for converting a Linux desktop distribution into a safe, reliable and efficient PAC, a Public Access Computer, for a library, school or waiting room. pdaXrom: Power in your pocketpdaXrom is a cross-platform Linux distribution with own build system. Its targets are PDA and embedded systems. Peanut LinuxPeanut Linux is a Linux OS (O)perating (S)ystem. Pendrive LinuxA Portable Linux Operating system that you can bring with you on a USB hard drive, flash pendrive, thumbdrive, flashdrive, ipod, phone or other mobile device. Project is no longer under active development. Poly-p-uxWhat is poly-p-ux? Well, just take a look at the image on the main page. (sorry, lynx users :D ). Say you have a VERRY old computer (386, 486, or Pentium, ideally.). Think of it as a snail. It can't do much. In fact, you probably have Windows 3.1 on it right now. Admit it. Well, poly-p-ux is a Linux distribution that's your own little rocket. Puppy LinuxPuppy Linux is a Live CD Linux distribution that is very small and focuses on ease of use. If the computer has at least 256 MB of RAM, the entire operating system and all the applications will run from RAM, allowing the boot medium to be removed after the operating system starts. PuppyRusPuppyRus Linux is a Russian version of Puppy Linux. QuirkyA variant of puppy, Quirky is a Linux distribution and is in the “Puppy Linux family”, also known as a “puplet”. RefractaRefracta is a variant of the GNU operating system and uses the Linux kernel. Robo Hobby LinuxKnoppix-Based Linux LiveCD for robotics hobbyists. Root LinuxROOT is a GNU/Linux operating system aiming for speed, simpleness and flexibility. It contains many high quality software packages for both server and workstation use. Sabayon LinuxSabayon Linux is an operating system powered by the Linux kernel and GNU. SliTazSliTaz is a free operating system, working completely in RAM and booting from removable media such as a cdrom or USB key. SME ServerThe SME Server is an open-source software package that, when installed on a PC-compatible computer, transforms it into a easy-to-use, Linux-based communications server. SoLSoL is short for Server optimized Linux and is a Linux distribution completely independent from other Linux-distributions. SourceMageSource Mage is a source-based GNU/Linux distribution based on a Sorcery metaphor of “casting” and “dispelling” programs, which we refer to as “spells”, and a package manager called “Sorcery”. StartCom LinuxThe StartCom Linux operating systems are based on the Red Hat Enterprise and Fedora source code, each modified with reliability, security and efficiency in mind, to fit the tasks assigned to each flavor of StartCom Linux. T2T2 started as a community driven fork from the ROCK Linux Project with the aim to create a decentralized development and clean a framework for spin-off projects and customized distributions. Another goal was to provide a more continous release stream for stable security updates. Tiny Core LinuxTiny Core Linux is a very small (10 MB) minimal Linux Desktop. It is basedon Linux 2.6 kernel, Busybox, Tiny X, Fltk, and Jwm. TinyMeTinyMe is a remaster of PCLinuxOS. It comes packaged in a miniscule 200MB or smaller ISO. We do this for those of you who have old computers, like to mess around with small/fast systems, or just want a minimal environment. UbuntuUbuntu is an open source software operating system that runs from the desktop, to the cloud, to all your internet connected things Unity LinuxOriginally Unity-Linux was a Mandriva based Linux distribution that was started when a number of packagers left PCLinuxOS. Due to multiple differences both parties thought it best to part ways, so Unity-Linux was born. Vector LinuxVector Linux is a small, fast, Intel Linux operating system based on one of the original Linux distributions, Slackware. XCP-ngXCP-ng is an open source hypervisor based on XenServer ZenarchZenarch is a hybrid/modular live cd based on slax and archlinux OS. ZenwalkZenwalk is a GNU/Linux operating system, designed to provide the following characteristics:Modern and user-friendly (latest stable software, selected applications); Fast (optimized for performance capabilities); Rational (one mainstream application for each task); Complete (full development/desktop/multimedia environment); Evolutionary (simple network package management tool – netpkg). Gone but not forgotten, distributions we once hosted or mirrored: ALT Linux Developed in Russia, ALT Linux is a universal distribution created by an international team of free software developers. ALT Linux Junior is a single-disk distribution for home computers designed especially for beginners and is easy to install and use. ALT Linux Master is a universal distribution which can be used on a server or on a workstation. It is equally useful for software developers. ALT Linux Castle is a protected server distributions on the basis of RSBAC system. Distribution homepage Animux is a free animation based toolset which can handle tasks from creative development to post-production stage of your creative project. Distribution homepage Aurora Linux is a port of Red Hat Linux (now Fedora) to Sun SPARC processor based machines. Distribution homepage Deli Linux A Linux distribution for old computers, Deli Linux is a distribution for old x86 compatible computers from 486 to Pentium III with 32 to 128 MB RAM. It is based on uClibc and provides a full graphical Environment with a web browser, an e-mail client and an office package. Distribution homepage Gentoo Linux is a versatile and fast, completely free x86-based Linux distribution geared towards developers and network professionals. Unlike other distros, Gentoo Linux has an advanced package management system called Portage. Portage is a true ports system in the tradition of BSD ports, but is Python-based and sports a number of advanced features including dependencies, fine-grained package management, “fake” (OpenBSD-style) installs, safe unmerging, system profiles, virtual packages, configuration file management, and more. Distribution homepage gOS is an easy-to-use, Ubuntu-based distribution designed for less technical computer users. Its main features are the use of Enlightenment as the default desktop and tight integration of various Google products and services into the product. Distribution homepage LAMPPIX is a Linux live CD originating in Germany, based on Knoppix and Damn Small Linux. It comes with the XAMPP web server, MySQL database, PHP and Perl scripting languages, as well as other tools to run PHP-driven web pages directly off a CD-ROM. Distribution homepage Phantomix is"
