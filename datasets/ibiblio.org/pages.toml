full_description = "Software Mirrors ibiblio (then called SunSITE) began mirroring open source software in 1992, and was one of only three such repositories available on the internet. Now almost 30 years later mirroring and open source software has evolved. The list represents software mirrors that ibiblio currently hosts, or used to host. In the event that we don't currently host a mirror, a link to the software's homepage is provided. ApacheThe Apache Project comprises the popular Apache web server, the Cocoon 2 XML publishing framework, the Jakarta Tomcat servlet tools, and more. CPANThe Comprehensive Perl Archive Network provides a large collection of Perl software and documentation. CTANThe Comprehensive TeX Archive Network provides the most complete and up-to-date TeX-related software. Distributions We host and mirror many Linux distributions. Please see our distributions page for a complete list. DOSEMUDOSEMU is a linux application that enables the Linux OS to run many DOS programs. EggdropNot eggdrop soup, an eggdrop robot ( commonly called a bot ) is a program that does things automatically on IRC. Fortran Fortran-related software and utilities. GaleonGaleon is a GNOME Web browser based on gecko (the mozilla rendering engine). Inactive mirror. GNOMEThe GNOME project has built a complete free and easy-to-use desktop environment for pretty much any Linux or BSD user, as well as a powerful application framework for the software developer. Inactive mirror. GNUThe GNU Project was launched in 1984 to develop a complete Unix-like operating system which is free software: the GNU system. GRASS GISGRASS GIS (Geographic Resources Analysis Support System) is an Open Source/Free Software Geographical Information System (GIS) with raster, topological vector, image processing, and graphics production functionality that operates on various platforms through a graphical user interface and shell in X-Windows. It is released under GNU General Public License (GPL). GTKbuffet GTK libraries, applications, and language mirror htdight://dig is a robust World Wide Web-based indexing and retrieval system. KDEKDE is a powerful Open Source graphical desktop environment for Unix workstations. It combines ease of use, contemporary functionality, and outstanding graphical design with the technological superiority of the Unix operating system. kernel.orgThis is the primary site for the Linux kernel source, but it has much more than just kernels. mirror.pl mirror.pl, by Lee McLoughlin, is a perl script which duplicates a directory hierarchy between two machines. It avoids copying files unnecessarily by comparing the file time-stamps and file sizes before transferring. MOD-SSLSSL/TLS integration into Apache using the OpenSSL libraries. Inactive mirror. mozdev mozdev comprises a group of developers dedicated for contributing to... MozillaMozilla is an open-source web browser, designed for standards compliance, performance and portability. OpenCSWOpenCSW aims to produce an easy to use open source software distribution installable on top of Solaris and Solaris-based systems, developed by a transparent and democratic community. OpenSSHOpenSSH is an open-sourced implementation of the SSH protocol. Inactive mirror. OpenSSLOpenSSL is an open source SSL and TLS toolkit and general purpose cryptography library. Open OfficeOpen Office is an open-sourced office suite that will run on many platforms. ProFTPDProFTPD is a secure and configurable FTP server which takes Apache-style directives. rsyncrsync is an open source utility that provides fast incremental file transfer. RubyRuby is an object-oriented interpreted scripting language for quick and easy programming. SambaSamba is an Open Source/Free Software suite that provides seamless file and print services to SMB/CIFS clients. sshthe DataFellows ssh client / server system Sun FreewareThis is a mirror of the Sun Freeware Project. Inactive mirror. TedTed is a text processor running under X Windows on Unix/Linux systems. Inactive mirror. teTeXteTeX is a complete TeX distribution for UNIX compatible systems. XEmacsXEmacs is a highly customizable open source text editor and application development system. X libs the X window management system Software Mirrors Software Mirrors Software Mirrors"
