full_description = '''Tool callingOverviewTool calling enables a chat model to respond to a given prompt by invoking an (external) tool. When using watsonx.ai you can use the API or SDKs with supported chat models, and pass a list of tools from which the model will suggest what tool to use to answer your question.Here are the foundation models that you can use with the chat API in conjunction with tool calling:ibm/granite-3-8b-instructmeta-llama/llama-3-1-70b-instructmeta-llama/llama-3-1-8b-instructmeta-llama/llama-3-2-11b-vision-instructmeta-llama/llama-3-2-1b-instructmeta-llama/llama-3-2-90b-vision-instructmeta-llama/llama-3-405b-instructmistralai/mistral-largeSupport for tool calling will be added to more models over time.ExampleYou can generate text by sending a structured list of messages, together with a list of tools.The following example uses the mistralai/mistral-large foundation model, which works well with text generation and also supports tool calling. The model is given a single tool called add, and a message with the question “What is 2 plus 4?“. The response of the model will be a new message containing the tool that should be called, including the method of calling that tool.CurlNode.jsPythonReplace {token}, {region}, and {project_id} with your information.1curl -X POST \ 2-H 'Authorization: Bearer {token}' \ 3-H 'Content-Type: application/json' \ 4-H 'Accept: application/json' \ 5--data-raw '{ 6 "model_id": "mistralai/mistral-large", 7 "project_id": "4947c695-a374-428c-acca-332c1a1dc9e9",{ 8 "messages": [{ 9 "role": "user", 10 "content": [{ 11 "type": "text", 12 "text": "What is 2 plus 4?" 13 }] 14 }], 15 "tools": [{ 16 "type": "function", 17 "function": { 18 "name": "add", 19 "description": "Adds the values a and b to get a sum.", 20 "parameters": { 21 "type": "object", 22 "properties": { 23 "a": { 24 "description": "A number value", 25 "type": "float" 26 }, 27 "b": { 28 "description": "A number value", 29 "type": "float" 30 } 31 }, 32 "required": [ 33 "a", 34 "b" 35 ] 36 } 37 } 38 }], 39 "tool_choice_option": "auto", 40 "max_tokens": 300, 41 "time_limit": 1000 42 }' \ 43"https://{region}/ml/v1/text/chat?version=2023-10-25"For more information and examples, see the API reference.The response of the model will look something like the following JSON:1{ 2 "id": "chat-a00942a130e84f83bc0090c38c2f419f", 3 "model_id": "mistralai/mistral-large", 4 "choices": [ 5 { 6 "index": 0, 7 "message": { 8 "role": "assistant", 9 "tool_calls": [ 10 { 11 "id": "chatcmpl-tool-77cbe4e94d88489383a0c6ed1b644674", 12 "type": "function", 13 "function": { 14 "name": "add", 15 "arguments": "{\"a\": 2, \"b\": 4}" 16 } 17 } 18 ] 19 }, 20 "finish_reason": "tool_calls" 21 } 22 ] 23}Edit this page on GitHubPreviousCapabilities: ChatNextCapabilities: Text generationContact usPrivacyTerms of useAccessibilityIBM.comHave questions? Contact us onon Discord React Components version ^1.61.0Last updated 14 February 2025Copyright © 2025 IBM'''
