["https://www.ibm.com/new/announcements/ibm-granite-3-2-open-source-reasoning-and-vision"]
title = "IBM Granite 3.2: open source reasoning and vision"
description = "IBM Granite 3.2, headlined by the reasoning-enhanced Granite 3.2 Instruct models and multimodal Granite Vision 3.2, introduces several new enterprise capabilities."
full_description = 'Granite 3.2, the latest release in our third generation of IBM Granite models, is an essential step in the evolution of the Granite series beyond straightforward language models. Headlined by experimental reasoning features and our first official vision language model (VLM), Granite 3.2 introduces several significant new capabilities to the Granite family. The release also includes an array of improvements to the efficiency, efficacy and versatility of our existing offerings. IBM’s prioritization of practical, enterprise-ready models continues the pursuit of state-of-the-art performance with fewer and fewer parameters. As always, the latest Granite models are open sourced under Apache 2.0 license. All Granite models are now available on Hugging Face. Select models are also available through additional platforms, including IBM watsonx.ai. Tutorials, recipes and other resources are available in the "Getting Started" section at the end of this article. The newest iterations of IBM’s flagship text-only large language models (LLMs), Granite 3.2 Instruct 8B and Granite 3.2 Instruct 2B, have been trained to offer enhanced reasoning capabilities relative to their 3.1 counterparts. Our implementation of reasoning runs somewhat counter to certain industry trends, in keeping with IBM’s practical approach to enhancing model performance. These experimental features of the new Granite 3.2 Instruct models represent only one of multiple ongoing explorations at IBM Research into reasoning-driven model evolution. Further work on inference scaling techniques demonstrates that Granite 3.2 8B Instruct can be calibrated to match or exceed the mathematical reasoning performance of much larger models, including OpenAI’s GPT-4o-0513 and Anthropic’s Claude-3.5-Sonnet-1022. The intuition driving recent advancements in language model reasoning comes from 2022 research demonstrating that simply adding the phrase “think step by step,” a prompt engineering technique commonly called chain of thought (CoT) prompting, significantly improves model outputs on reasoning tasks.1'
year_published = 2025
