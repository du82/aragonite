["https://www.ibm.com/watsonx/developer/get-started/quick-start"]
title = ""
description = "watsonx Developer Hub provides a selection of quick starts and guides to support developers building Generative AI applications and solutions on the watsonx platform."
full_description = '''Quick startMake your first API request to watsonx.aiGet started with your first API or SDK requests with watsonx.ai to generate responses from a prompt.1. Visit Developer Access pageTo begin using the API and SDK, you will need 3 values: a project or space id, an endpoint for your region, and an API key. You can visit the Developer Access page to receive these values. Make sure to also follow the link on the Developer Access page to get your IBM Cloud API key separately.2. Start BuildingCurlNode.jsPython3. Create a tokenYou authenticate to watsonx.ai by including a bearer token in your requests. The token is generated from an API key that you own.Create an IAM Bearer token by making a request to the IAM Identity Services API with your API key. Replace {apikey} with the value of the API key that you created.1curl -X POST \ 2-H 'Content-Type: application/x-www-form-urlencoded' \ 3--data 'grant_type=urn:ibm:params:oauth:grant-type:apikey&apikey={apikey}' \ 4'https://iam.cloud.ibm.com/identity/token'The response includes a token property. You use the value of the token in the Authorization header of your API requests. For example, if your token is tzLbqWhyALQawBg5TjRIf5sAznhrKQyvBFFaZbtF60m5 in the service credentials, include the credentials in your request like this:1curl -X \ 2-H 'Authorization:Bearer tzLbqWhyALQawBg5TjRIf5sAznhrKQyvBFFaZbtF60m5' \ 3'https://{region}/ml/v1/text/generation'4. Make your API request to infer textRun the following curl request to infer text from text input. Replace {token}, {region}, and {project_id} with information from your account.1curl -X POST \ 2-H 'Authorization: Bearer {token}' \ 3-H 'Content-Type: application/json' \ 4-H 'Accept: application/json' \ 5--data-raw '{ 6 "input": "How far is Paris from Bangalore?", 7 "parameters": { 8 "max_new_tokens": 100, 9 "time_limit": 10000 10 }, 11 "model_id": "ibm/granite-13b-chat-v2", 12 "project_id": "{project_id}" 13}' \ 14'https://{region}/ml/v1/text/generation?version=2024-05-31'Next stepsNow that you successfully made a simple request with watsonx.ai, learn about other features and capabilities.Try your request against another foundation model by changing the model_id from ibm/granite-13b-chat-v2 to another ID. For information about how to find the model IDs, see Models.Experiment with Text generation, Chat or Tool callingEdit this page on GitHubPreviousGet started: OverviewNextGet started: ModelsContact usPrivacyTerms of useAccessibilityIBM.comHave questions? Contact us onon Discord React Components version ^1.61.0Last updated 14 February 2025Copyright © 2025 IBM'''
