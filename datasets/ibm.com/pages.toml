["https://www.ibm.com/watsonx/developer/agents/quickstart"]
title = ""
description = "watsonx Developer Hub provides a selection of quick starts and guides to support developers building Generative AI applications and solutions on the watsonx platform."
full_description = "AgentsBuild and deploy your first agent using watsonx.aiThis guide will walk you through building and deploying an AI agent using watsonx.ai. The example project is a research agent that can search the web to summarize research papers using external tools.Use Agent Templates in watsonx.ai to kickstart your agent development (4:33 min)1. Visit Developer Access pageTo begin using the API and SDK, you will need 3 values: a project or space id, an endpoint for your region, and an API key. You can visit the Developer Access page to receive these values. Make sure to also follow the link on the Developer Access page to get your IBM Cloud API key separately.2. Start buildingPythonPrerequisitesPython 3.11Pipx or uvPoetryAn IBM Cloud account with watsonx.ai access1: Clone the repository1git clone --no-tags --depth 1 --single-branch --filter=tree:0 --sparse https://github.com/IBM/watsonx-developer-hub.git 2cd watsonx-developer-hub 3git sparse-checkout add agents/langgraph-arxiv-research/Move to the directory with the agent template:1cd agents/langgraph-arxiv-research/2: Install the templateRunning the below commands will install the repository in a separate virtual environment:For pipx:1pipx install --python 3.11 poetry # set up the env incl. poetry 2poetry install # install the dependencies 3source $(poetry -q env use 3.11 && poetry env info --path)/bin/activate # start the environmentFor uv:1uv venv --python 3.11 # set up the env 2uv pip install poetry # install poetry 3poetry install # install the dependenciesYou can use any other tool to run your Python code, make sure to use Python v11 or higher.3: Export PYTHONPATHAdding working directory to PYTHONPATH is necessary for the next steps. In your terminal execute:1export PYTHONPATH=$(pwd):${PYTHONPATH}4: Set the enviroment variablesThe config.toml file should be filled in before either deploying the template on IBM Cloud or executing it locally.Go to the Developer Access page to find your environment variables.Everything is now set up to run the agent locally in the next step.5. Running the agent locallyYou can run the agent locally and interact with the agent via a terminal-based chat application:1poetry run python examples/execute_ai_service_locally.pyTroubleshooting: If you run into ModuleNotFoundError, check that PYTHONPATH is set correctly.Choose from some pre-defined questions or ask the agent questions of your own.Please bear in mind that the research paper should be available on arXiv if you want the agent to be able to summarize it.6. Deploying to IBM CloudDeploy the agent by running:1poetry run python scripts/deploy.pySave the deployment_id printed in the output.You can test your deployment using the file:1poetry run python examples/query_existing_deployment.pyNote: Ensure that deployment_id is set correctly in query_existing_deployment.py before running the test.TroubleshootingIssueSolutionModuleNotFoundErrorEnsure PYTHONPATH is set correctlyIBM Cloud API errorsDouble-check config.toml credentialspoetry install failsEnsure Python 3.11 is installed and pipx is working3. Preview the agent in the dashboardOnce an agent is deployed to watsonx.ai you can find the API endpoint to connect to the agent from a remote location or directly interact with the agent using the built-in chat interface. To use the agent via the chat interface follow these steps:1. Find your newly deployed agentIn the watsonx.ai dashboard under “Deployments” where you should open the space you just deployed the agent to.2. Open the spaceBy clicking on the space (in this case “agent test”) you can find the list of deployments, after running the script from the previous section you should see a new deployment in this list.Note: Make sure to check the deployment has the tag wx-agent as this is needed to interact with it via the “Preview” tab.3. Find the preview tabAfter clicking on the latest deployment, you can see the private and public API endpoint of the agent, you can also see a “Preview” tab which you’ll need to open to test the agent in the chat interface.4. Ask the agentIn the chat interface you can ask the same questions as you did when running the agent locally, for example”: “show me a list or arxiv papers about deepseek”. This should return a list of papers published on ArXiv that mention DeepSeek. You can also see what tools the agent called to retrieve this information.Next StepsExplore the watsonx.ai Python SDK documentationBrowse more examples in the watsonx-developer-hub repositoryReach out to us on Discord if you have any questions or want to share feedback.Edit this page on GitHubPreviousCapabilities: AutoAI RAGNextGuides: OverviewContact usPrivacyTerms of useAccessibilityIBM.comHave questions? Contact us onon Discord React Components version ^1.61.0Last updated 14 February 2025Copyright © 2025 IBM"
year_published = 2025
