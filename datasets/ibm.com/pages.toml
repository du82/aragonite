full_description = "Collaborating with deep technology, industry and domain expertise to create next-generation enterprises For more than 50 years, enterprises have used IBM servers to host SAP workloads. As they transition to RISE with SAP, IBM Power Virtual Server will enable a faster and less disruptive SAP ERP modernization on IBM Cloud. As the only technology company with decades of SAP consulting expertise, IBM partners with SAP to add client value throughout the AI journey: jointly defining journey maps, co-innovating solutions and delivering on RISE-enabled transformation journeys. Moreover, SAP embeds watsonx technology into their own solutions. Announced in May 2024, our new Value Generation Partnership initiative includes new generative AI capabilities and industry-specific cloud solutions that can help clients unlock business value. IBM and SAP’s shared approach to generative AI, built on an open ecosystem, trust and purpose-built models, will help empower clients to optimize business outcomes. IBM received 2 prestigious SAP Pinnacle Awards: one for SAP Business AI-Customer Value Creation and another for Industry Cloud. These recognitions landed IBM as a top-performing partner excelling in helping customers become best-run businesses. This brings IBM's total SAP Pinnacle Awards to 39. Over 18,000 unique certified SAP consultants help you successfully migrate legacy ERP applications to the cloud, redesign processes to use data, AI and automation and transform finance into a competitive advantage within your business. 212% ROI over 3 years for a composite organization based on interviewed customers running their SAP environments in IBM Cloud®, the only SAP-certified IaaS offering both IBM Power® and Intel x86 instances for RISE with SAP and SAP NetWeaver deployments. IBM is the first cloud provider to offer infrastructure, business transformation and end-to-end managed services platform “ManagePlus” to support the build and management on SAP and non-SAP workloads. In our 50+-year partnership, over 10,000 SAP customers have trusted IBM to deliver and run their SAP systems with an extensive portfolio of solutions tailored to SAP across IBM Consulting and technology. IBM Consulting builds over 1,000 bespoke solutions for SAP each year, and SAP HANA served 4,800 clients on IBM Power servers."
