title = "CSCO Study - Achieving data-led innovation | IBM"
description = "Navigating and managing supply chain challenges has, out of necessity, become a top business priority for not just CSCOs but the entire C-suite."
full_description = "CSCO Study: Achieving data-led innovationOriginally published 20 September 2022Business today is anything but usual—and this is especially true in supply chains, where it’s no longer a question of if a major disruption is coming, but when. Now is the time for Chief Supply Chain Officers to prepare for what happens next.Download the reportSubscribe for more insights from IBM IBVSave and shareDownload report translationsChoose an optionOpen menuOriginally published 20 September 2022Download the reportOverviewOrder out of chaosFrom “now” to “next”Action guideDownload the reportSubscribe for more insights from IBM IBV86%increase in the importance of macroeconomic forces over the next 2-3 years, according to CSCOs.95%more digitalization and AI automation are used by top-performing CSCOs, compared to their peers.36%increase in CEOs citing supply chain disruption as one of their greatest challenges.Another day, another crisisListen to the study synopsis00:00 / 0Download the audioA persistent pandemic, economic uncertainty, and a global geopolitical conflict continue to dominate headlines and fuel Chief Supply Chain Officer (CSCO) frustrations. Navigating uncertainties—and managing supply chain challenges accordingly—has out of necessity become a top business priority for boards and C-suites alike.86%increase in the importance of macroeconomic forces over the next 2-3 years, according to CSCOs.95%more digitalization and AI automation are used by top-performing CSCOs, compared to their peers.36%increase in CEOs citing supply chain disruption as one of their greatest challenges.Over the next two to three years, CSCOs say that issues related to supply chain disruptions, technology infrastructure, sustainability, and market shifts are their greatest challenges. Yet when addressed with an open mindset, challenges create opportunities—and visibility. A heightened emphasis on supply chain functionalities and roles is giving CSCOs the expertise, latitude, and organizational authority to innovate into a data-led future.CSCOs are walking a tightropeTime, attention, and resources are finite entities—and what we’re seeing are moment-by-moment trade-offs and compromises as CSCOs rebalance and reimagine their operations.Data is destinyToday’s CSCOs have created a foundational approach that can reap benefits, whether a supply chain is focused on efficiency and resiliency today or data-led insights and innovations that illuminate the future.Transformational technologies lead the wayCSCOs who outperform their peers are investing aggressively in scaling infrastructure and hybrid cloud, AI-enabled workflows, sustainability, and cybersecurity.“I would tell a new Chief Supply Chain Officer to make sure your foundation is solid and that you’re managing the day to day, and then ask, where’s technology going?”Mike CorboChief Supply Chain Officer, Colgate PalmoliveListen to Mike Corbo’s advice for new CSCOs.Order out of chaosWith disruptions looming around every corner, CSCOs will need deep organizational awareness to keep their balance. AI and intelligent workflows can deliver 360-degree insights and impact analysis that provide interconnectivity and help with predictability. Intelligent workflows can help the workforce—digital and human—dynamically adjust to the unforeseen with both self-learning and self-calibration. And automation—ranging from chatbots to robots—is an essential component.In fact, how CSCOs prioritize technologies speaks volumes to their near- and mid-term devotion to intelligent workflows to monitor and take action.Great expectationsMost CSCOs believe AI will deliver results over the next 3 years—though other exponential technologies aren’t far behind.IBMInstitute for Business Value“The one thing that I think we need to address at scale is labor and people. And I just do not see it. Suddenly, it feels like we have lost 20% of the workforce.”Sophie BechuChief Operations Officer, PhilipsListen to Sophie Bechu’s perspective on the need for talent.From “now” to “next”Universal problems can prompt a universal response, and that’s the case with CSCOs. Across the spectrum, CSCOs have adopted a steady-as-they-go emphasis on automation, AI and intelligent workflows, ecosystems, and sustainability.But with a steely eye to the future, a group of CSCOs who are outperforming their peers stands out in their obsession with investing in transformational technology. They’re ratcheting up these strategies, adopting a data-driven approach that emphasizes four tech-enabled areas: Hybrid cloudAdopting hybrid cloud enables CSCOs to extend the value and reach of their legacy applications and data in a flexible infrastructure that also accommodates the exponential technology needed to drive innovation.AI-enabled workflowsTop-performing CSCOs are simulating decision impact, anticipating operational challenges, modeling pre-emptive new strategies, and—critically—evaluating options when there’s no available historical data.Sustainability58% of top-performing CSCOs see opportunities to bond with customers over sustainability imperatives, using that shared mission to improve customer engagement and fulfillment.CybersecurityAccording to IBM research, 47% of attacks on manufacturing were due to vulnerabilities companies could not—or failed to—patch. The top tier of CSCOs report outperforming their competition on cybersecurity 16% more than other CSCOs.Move toward data-led innovation with our action guide.Move toward data-led innovation with our action guide.AutomationAccelerate automation in extended workflowsAmp up AI to make workflows smarterCultivate collaborative ecosystemsSustainabilityLink environmental and social initiatives with business solutionsOptimize workflows with AI to manage carbon, waste, energy, and water consumptionCompete with new sustainable products and servicesModernizationArchitect modern infrastructuresScale hybrid cloud platformsIncrease awareness of cybersecurity vulnerabilities and solutionsAutomationAccelerate automation in extended workflowsAmp up AI to make workflows smarterCultivate collaborative ecosystemsSustainabilityLink environmental and social initiatives with business solutionsOptimize workflows with AI to manage carbon, waste, energy, and water consumptionCompete with new sustainable products and servicesModernizationArchitect modern infrastructuresScale hybrid cloud platformsIncrease awareness of cybersecurity vulnerabilities and solutionsIBMInstitute for Business ValueAccess our detailed, comprehensive CSCO action guide and our entire set of findings when you download the full CSCO study, Own Your Transformation: Data-led innovation for the modern supply chain.Download the reportSubscribe for more insights from IBM IBVWant to learn more about the study?Contact usWant to learn more about the study?Contact usExpertsJonathan WrightIBM Global Managing Partner, Finance and Supply Chain Transformation and IBM Sustainability ServicesIBM ConsultingSend E-mailLinkedInRob CushmanSenior Partner, Worldwide Leader - Supply Chain TransformationIBM ConsultingSend E-mailLinkedInKaren ButnerGlobal Research Leader, Supply Chain, Automation, Virtual Enterprise, IBM Institute for Business ValueIBM ConsultingSend E-mailLinkedInJoe BertiChief Product Officer, Sustainability SoftwareIBM TechnologySend E-mailLinkedInExplore past C-suite studies202220212019201720152013201220112010200920082006200520042003Select a previous C-suite Study year2022202120192017201520132012201120102009200820062005200420032022 C-suite study reportsRole research reportsChief Executive Officer:Practical pathways to transformational sustainabilityHow can IBM help you?Supply Chain Consulting ServicesBuild resilient, sustainable supply chains that prepare your business for the future of work, create greater transparency and improve employee and customer experiences.Build Smarter Supply Chains with AI and BlockchainAct with speed and confidence to mitigate disruptions and build resilient, sustainable supply chains....IBM Consulting Deliver meaningful impact faster. Let's create new ways for business to do business.How can IBM help you?Supply Chain Consulting ServicesBuild resilient, sustainable supply chains that prepare your business for the future of work, create greater transparency and improve employee and customer experiences.Build Smarter Supply Chains with AI and BlockchainAct with speed and confidence to mitigate disruptions and build resilient, sustainable supply chains....IBM Consulting Deliver meaningful impact faster. Let's create new ways for business to do business.You might also likeSmart procurement made smarterIntelligent workflows don’t just create smart procurement—they create wiser procurement, from source to pay.Translations availableThe intuitive supply chainPredict future disruptions and gain a competitive edge with the combined power of generative AI and cloud computing.Translations availableThe CEO’s guide to generative AI: ProcurementExplore three things CEOs need to know and three things they need to do now to apply generative AI to procurement.Translations availableThe CEO’s guide to generative AI: Business process automation for operationsExplore three things CEOs need to know and three things they need to do now to apply generative AI to business process automation.Translations availableAll supply chains are digitalExplore how the relationship between cybersecurity and supply chain risk management shapes ecosystem-wide resilience. A report developed in collaboration with Microsoft.Translations availableFrom smart to genius—Navigating supply chains in the age of gen AIThis volume of supply chain Think Circle “greatest hits” spans everything from the virtualization mandate, resiliency, sustainability, digital intelligence, generative AI, and more.You might also likeSmart procurement made smarterIntelligent workflows don’t just create smart procurement—they create wiser procurement, from source to pay.Translations availableThe intuitive supply chainPredict future disruptions and gain a competitive edge with the combined power of generative AI and cloud computing.Translations availableThe CEO’s guide to generative AI: ProcurementExplore three things CEOs need to know and three things they need to do now to apply generative AI to procurement.Translations availableThe CEO’s guide to generative AI: Business process automation for operationsExplore three things CEOs need to know and three things they need to do now to apply generative AI to business process automation.Translations availableAll supply chains are digitalExplore how the relationship between cybersecurity and supply chain risk management shapes ecosystem-wide resilience. A report developed in collaboration with Microsoft.Translations availableFrom smart to genius—Navigating supply chains in the age of gen AIThis volume of supply chain Think Circle “greatest hits” spans everything from the virtualization mandate, resiliency, sustainability, digital intelligence, generative AI, and more."
