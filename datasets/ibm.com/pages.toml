title = "IBM Granite 3.1 documentation – IBM Granite"
description = "Granite 3.1 models leverage new dense architecture. These models were trained with 12 trillion tokens across 12 languages and 116 programming languages. IBM is committed to open-source innovation, and these models are no exception. All Granite models are licensed under Apache 2.0."
full_description = '''Granite 3.1Granite 3.1 models leverage new dense architecture. These models were trained with 12 trillion tokens across 12 languages and 116 programming languages. IBM is committed to open-source innovation, and these models are no exception. All Granite models are licensed under Apache 2.0.Model cardRun locally with Ollamainfo iconGranite 3.1 models are available for download on Hugging Face, featuring a longer 128K context window. Try now on the Granite Playground. Try Granite 3.1Model playgroundAgentic RAGgranite-3.1-8b-instructUse Granite in an agentic RAG pattern to answer complex queries using external information.Entity extractiongranite-3.1-8b-instructExtract well-formed entities from unstructured data with Granite.Document summarizationgranite-3.1-8b-instructMulti-level abstractive document summarization using Granite. Overview Granite 3.1 represents IBM’s third generation of large language models, released in the open under an Apache 2.0 license and matching top performance on general, enterprise, and safety benchmarks. Among other features, Granite 3.1 models support a context length of 128K and provide a better way to handle RAG and function-calling tasks. Granite 3.1 instruction models are finetuned from Granite-3.1 base models using a combination of open source instruction datasets with permissive license and internally collected synthetic datasets tailored for solving long context problems. The Granite 3.1 language model family includes: Granite Dense - Powerful “workhorse” models designed for enterprise AI Granite MoE - Inference-efficient Mixture of Experts (MoE) models ideal for on device applications or CPU-based deployments Granite Accelerator - Speculative decoding companion model for increased inference speed and lower latency Model cards Granite 3.1 8B InstructGranite 3.1 2B InstructGranite 3.1 3B A800M InstructGranite 3.1 1B A400M Instruct Run locally with Ollama Learn more about Granite 3.1 on Ollama. Granite 3.1 8B InstructGranite 3.1 2B InstructGranite 3.1 3B A800M InstructGranite 3.1 1B A400M Instruct Chat template To obtain the best performance from Granite 3.1 instruction models, we recommend using our official chat template. We show an example of this template below: <|start_of_role|>system<|end_of_role|>Knowledge Cutoff Date: April 2024.Today's Date: December 13, 2024.You are Granite, developed by IBM. You are a helpful AI assistant<|end_of_text|><|start_of_role|>user<|end_of_role|>What is 2+2?<|end_of_text|><|start_of_role|>assistant<|end_of_role|>If you have two groups each with two items, you have four items in total.<|end_of_text|>Copy to clipboard The components of this chat template serve the following purpose: <|start_of_role|>, <|end_of_role|>, and <|end_of_text|> are special tokens for prompt control. <|start_of_role|> indicates the start of a turn. <|end_of_role|> indicates the end of the control token, and the start of textual content. <|end_of_text|> indicates the end of the turn. system, user, and assistant are the generic turn types that can be used to build prompts. system is useful for adding a static system prompt, which is optional. Depending on the text-generation task, we recommend to use the following system prompts with Granite 3.1 models: system prompt for regular multi-turn conversations Today's Date: December 14, 2024.You are Granite, developed by IBM. You are a helpful AI assistant.Copy to clipboard system prompt for function-calling tasks Knowledge Cutoff Date: April 2024.Today's Date: December 16, 2024.You are Granite, developed by IBM. You are a helpful AI assistant with access to the following tools. When a tool is required to answer the user's query, respond with <|tool_call|> followed by a JSON list of tools used. If a tool does not exist in the provided list of tools, notify the user that you do not have the ability to fulfill the request.Copy to clipboard system prompt for RAG generation tasks Knowledge Cutoff Date: April 2024.Today's Date: December 16, 2024.You are Granite, developed by IBM. Write the response to the user's input by strictly aligning with the facts in the provided documents. If the information needed to answer the question is not available in the documents, inform the user that the question cannot be answered based on the available data.Copy to clipboard Using a custom system prompts is also possible. However, as it may have unexpected results, we only recommend it for advanced users. Use user for queries from the user or an external agent. Use assistant for generations from the model itself. Important: prompts built via transformers library using the apply_chate_template function automatically apply the official chat template for Granite 3.1 models. Please check our HF model cards find and example. We highly recommend using this method to build prompts. Granite 3.1 highlights In this section, we share examples that highlight the unique capabilities that Granite 3.1 models bring on board. Multi-turn conversation The regular multi-turn conversation chat template for Granite 3.1. is quite similar to the one used in the previous version. Here is a simple example of what the regular multi-turn conversation chat template for Granite 3.1 models looks like. <|start_of_role|>system<|end_of_role|>Knowledge Cutoff Date: April 2024.Today's Date: December 14, 2024.You are Granite, developed by IBM. You are a helpful AI assistant.<|end_of_text|><|start_of_role|>user<|end_of_role|>Please list an IBM Research laboratory located in the United States.<|end_of_text|><|start_of_role|>assistant<|end_of_role|>Copy to clipboard Expected response: One of the IBM Research labs in the United States is the one situated in Cambridge, Massachusetts. This location is renowned for its work in various fields such as computer science, services, storage systems, physical sciences, and materials science and technology. The Cambridge lab is part of IBM's global network of research facilities, driving innovation and technological advancements.<|end_of_text|>Copy to clipboard Note that this example uses the system prompt recommended for Granite 3.1 models. We encourage using this system prompt to obtain the best performance from these models. Even though we do not restrict defining custom system prompts, using a non-default system prompt may have unexpected results. Thus, we only recommend it if you are an advanced user. Important: prompts built via transformers library using the apply_chate_template function, will automatically include the recommended system prompt as long as users do not specify a custom system prompt. Function-calling Regarding function-calling generation tasks, please be aware of the following updates: We also recommend using a specific system prompt for function-calling tasks. We encourage users to use it to obtain the best performance. The turn type for the list of tools has changed from available_tools (Granite 3.0) to tools (Granite 3.1). We slightly changed the schema to define the list of tools for Granite 3.1 models. Note that tools are now an array of dictionaries with a structure that includes the tool name, description, and required arguments. The format of the assistant responses containing function calls also changed. Note that the tool call is now pre-pended by a <tool_call> token. Here is a simple example of how a function-calling prompt with Granite 3.1 models should be formatted. <|start_of_role|>system<|end_of_role|>Knowledge Cutoff Date: April 2024.Today's Date: December 16, 2024.You are Granite, developed by IBM. You are a helpful AI assistant with access to the following tools. When a tool is required to answer the user's query, respond with <|tool_call|> followed by a JSON list of tools used. If a tool does not exist in the provided list of tools, notify the user that you do not have the ability to fulfill the request.<|end_of_text|><|start_of_role|>tools<|end_of_role|>[ { "name": "get_current_weather", "description": "Get the current weather", "arguments": { "location": {Copy to clipboard Expected response <tool_call>[{"name": "get_current_weather", "arguments": {"location": "New York"}}]<|end_of_text|>Copy to clipboard Important: prompts built via transformers library using the apply_chate_template function will automatically include the recommended system prompt for function-calling tasks if a list of tools is passed to the function, and a custom system prompt has not been defined. Retrieval augmented generation (RAG) Regarding RAG generation tasks, please be aware of the following updates: We encourage users to use the official system prompt for RAG generation tasks with Granite 3.1 models. Granite 3.1 models provide a much friendlier way to handle documents. Now, there is no need to include documents in the user query. Instead, use the turn type, documents, to provide the list of documents the model should consider. Inside the list of documents, a header Document 0, Document 1 … Document N signals the beginning of the document. A line break signals the end. Granite 3.1 models also provide a better way to handle questions unrelated to the documents provided. The assistant returns a default message if the question cannot be answered with the documents provided. The following example shows the format for RAG inference with Granite 3.1 models. <|start_of_role|>system<|end_of_role|>Knowledge Cutoff Date: April 2024.Today's Date: December 16, 2024.You are Granite, developed by IBM. Write the response to the user's input by strictly aligning with the facts in the provided documents. If the information needed to answer the question is not available in the documents, inform the user that the question cannot be answered based on the available data.<|end_of_text|><|start_of_role|>documents<|end_of_role|>Document 0Bridget Jones is a binge drinking and chain smoking thirty-something British woman trying to keep her love life in order while also dealing with her job as a publisher. When she attends a Christmas party with her parents, they try to set her up with their neighbours' son, Mark. After being snubbed by Mark, she starts to fall for her boss Daniel, a handsome man who begins to send her suggestive e-mails that leads to a dinner date. Daniel reveals that he and Mark attended college together, in that time Mark had an affair with his fiancée. Bridget decides to get a new job as a TV presenter after finding Daniel being frisky with a colleague. At a dinner party, she runs into Mark who expresses his affection for her, Daniel claims he wants Bridget back, the two fight over her and Bridget must make a decision who she wants to be with. Document 1Bridget is currently living a happy life with her lawyer boyfriend Mark Darcy, however not only does she start to become threatened and jealous of Mark's new young intern, she is angered by the fact Mark is a Conservative voter. With so many issues already at hand, things get worse for Bridget as her ex-lover, Daniel Cleaver, re-enters her life; the only help she has are her friends and her reliable diary., Copy to clipboard Important: prompts built via transformers library using the apply_chate_template function, will automatically include our recommended system prompt for RAG tasks if a list of documents is passed and the user does not specify a custom system prompt. Long-context inference A longer context allows Large Language Models to handle more detailed and complex inputs. This capability, for instance, is crucial for tasks that require using long documents, many documents, or understanding extensive dialogues. The following example shows a generation task that benefits from long-context capability due to a long list of documents. Note that we have summarized the list of documents for demonstration purposes. <|start_of_role|>system<|end_of_role|>Knowledge Cutoff Date: April 2024.Today's Date: December 16, 2024.You are Granite, developed by IBM. Write the response to the user's input by strictly aligning with the facts in the provided documents. If the information needed to answer the question is not available in the documents, inform the user that the question cannot be answered based on the available data.<|end_of_text|><|start_of_role|>documents<|end_of_role|>Document 0Bridget Jones is a binge drinking and chain smoking thirty-something British woman trying to keep her love life in order while also dealing with her job as a publisher. When she attends a Christmas party with her parents, they try to set her up with their neighbours' son, Mark. After being snubbed by Mark, she starts to fall for her boss Daniel, a handsome man who begins to send her suggestive e-mails that leads to a dinner date. Daniel reveals that he and Mark attended college together, in that time Mark had an affair with his fiancée. Bridget decides to get a new job as a TV presenter after finding Daniel being frisky with a colleague. At a dinner party, she runs into Mark who expresses his affection for her, Daniel claims he wants Bridget back, the two fight over her and Bridget must make a decision who she wants to be with. Document 1Bridget is currently living a happy life with her lawyer boyfriend Mark Darcy, however not only does she start to become threatened and jealous of Mark's new young intern, she is angered by the fact Mark is a Conservative voter. With so many issues already at hand, things get worse for Bridget as her ex-lover, Daniel Cleaver, re-enters her life; the only help she has are her friends and her reliable diary., Copy to clipboard Expected response <|start_of_role|>assistant<|end_of_role|>Patrick Dempsey portrays the character of Jack Quant in 'Bridget Jones's Baby.'<|end_of_text|>Copy to clipboard Common inference tasks This section includes common prompt examples using the official chat template for Granite 3.1 models. Summarization This example demonstrates how to summarize an interview transcript. <|start_of_role|>system<|end_of_role|>Knowledge Cutoff Date: April 2024.Today's Date: December 17, 2024.You are Granite, developed by IBM. Write the response to the user's input by strictly aligning with the facts in the provided documents. If the information needed to answer the question is not available in the documents, inform the user that the question cannot be answered based on the available data.<|end_of_text|><|start_of_role|>documents<|end_of_role|>Document 0Speaker 1 (00:00):Simone, congratulations. Simone (00:02):Thank you.Copy to clipboard Expected response Simone Biles, discussing her Paris 2024 Olympic experience, expresses pride in her performances and self-care practices, crediting her therapist for support. She reflects on her success, defining it by her own efforts, and acknowledges the impact she's had on young gymnasts and the sport's evolution. Biles highlights the significance of seeing three Black athletes together on the podium, emphasizing the importance of representation.<|end_of_text|>Copy to clipboard Text classification This example demonstrates a classificatio'''
