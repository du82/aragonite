["https://www.ibm.com/case-studies/ibm-software-team"]
title = "IBM Software Team | IBM"
description = "IBM developers gain significant efficiency using IBM watsonx Code Assistant."
full_description = "Artificial intelligence (AI) is changing the world of software development. According to Gartner® Magic Quadrant™ for AI Code Assistants (link resides outside of ibm.com), by 2028, 90% of enterprise software engineers will use AI code assistants, up from less than 14% in early 2024.* By using these solutions, developers can boost efficiency and overcome common challenges, such as managing complex legacy codebases, incorporating new programming languages and onboarding developers. In 2024, as part of the annual IBM watsonx™ Challenge, IBM invited its own employees to demonstrate how they could overcome these challenges using IBM watsonx Code Assistant™. Thousands of IBM employees, spanning hundreds of project teams, experimented with the many watsonx Code Assistant capabilities, including code explanation, code documentation, code generation, and test case generation. The time savings that the teams achieved not only unlocked new possibilities in their work, but they also represented potential benefits for development teams everywhere. * Gartner, Magic Quadrant for AI Code Assistants, August 19 2024. GARTNER is a registered trademark and service mark of Gartner, Inc. and/or its affiliates in the U.S. and internationally and is used herein with permission. Magic Quadrant is a registered trademark of Gartner, Inc. and/or its affiliates and is used herein with permission. All rights reserved. One of the watsonx Challenge winning teams applied watsonx Code Assistant to an urgent work dilemma and achieved significant efficiency gains. This small team, a mix of veteran and recently hired product developers, inherited more than 50 undocumented code repositories containing about 750 JavaScript files. The team faced the prospect of weeks of manual analysis to understand and properly document the code base. For the challenge, the team fed 9 files containing more than 1000 lines of code into the gen AI assistant and prompted the solution to produce one-sentence summaries of each file."
