title = ""
description = "watsonx Developer Hub provides a selection of quick starts and guides to support developers building Generative AI applications and solutions on the watsonx platform."
full_description = "LibrariesLangChainLangGraphLlamaIndexCrewAIwatsonx.ai Flows Enginewatsonx.ai Python SDKwatsonx.ai Node.js SDKOverviewUse these (open source) libraries to build AI applications on watsonx.ai.LangChainLangChain is a framework that enables the development of applications that are powered by language models and provides tools to integrate data sources, model configurations, and workflows. The framework is available for both Python and JavaScript, and is compatible with watsonx.ai API endpoints.Follow these tutorials to learn how to use LangChain with watsonx:Create a LangChain AI Agent in Python using watsonxCreate a LangChain RAG system in Python with watsonxDocumentation:Python DocsJS DocsLangGraphLangGraph is a framework for building stateful, multi-actor applications by combining language model outputs with structured graph data to create agent and multi-agent workflows; these workflows are then represented with graphs.Follow these tutorials to learn how to use LangGraph with watsonx:Build a RAG agent to answer complex questionsLlamaIndexLlamaIndex (formerly GPT Index) is a tool that helps structure, index, and query external data sources using language models, making it easier to build and interact with custom knowledge bases.Follow these tutorials to learn how to use LlamaIndex with watsonx:Use watsonx.ai with LlamaIndex to build RAG applicationsUse watsonx and LlamaIndex for Text-to-SQL taskDocumentation:LlamaIndex DocsCrewAICrewAI is a multi-agent framework that enables autonomous AI agents to collaborate effectively in completing complex tasks through role-based design and coordinated workflows.1. Install dependenciesInstall the main CrewAI package with the following command:1pip install crewai2. Create your crewTo create a new CrewAI project, run the following CLI (Command Line Interface) command:1crewai create crew my_project3. Update environment variablesUpdate the .env file with the model, watsonx.ai base URL, watsonx.ai API key and watsonx.ai project ID.Make sure to use a model that is suitable for tool calling.You can find your credentials within the Developer Access page.Example:1MODEL=watsonx/ibm/granite-3-8b-instruct 2WATSONX_URL=https://{region}.cloud.ibm.com 3WATSONX_APIKEY=your-api-key 4WATSONX_PROJECT_ID=your-project-id 4. Run your crewNavigate to your project directory:1cd my_projectTo run your crew, execute the following command in the root of your project:1crewai run5. Customize your crewLearn more about how to customize your crew within the CrewAI documentation.Flows Enginewatsonx.ai Flows Engine is a tool that enables developers to build, customize, and deploy generative AI applications by integrating large language models (LLMs) with enterprise data through an intuitive flow language and pre-built AI workflows​.Follow these tutorials to learn how to use Flows Engine with watsonx:Build a RAG application with watsonx.ai Flows EngineBuild a web page summarization tool using watsonx.ai Flows EngineUse IBM Granite LLMs in watsonx.ai Flows EngineImplement LLM guardrails for RAG applicationsDocumentation:Flows Engine DocsFlows Engine GitHubPython SDKThe IBM watsonx.ai Python SDK enables developers to train, deploy, and integrate AI models with their applications using various APIs. The SDK supports tasks, such as model scoring, and integrates with IBM watsonx.ai services.Documentation:watsonx.ai Python SDK Docswatsonx.ai Python SDK GitHubNode.js SDKThe IBM watsonx.ai Node.js SDK enables developers to create and deploy generative AI applications by providing programmatic access to the IBM watsonx.ai service with various API calls and authentication options.Documentation:watsonx.ai Python Node.js Docswatsonx.ai Python Node.js SDK GitHubEdit this page on GitHubPreviousGet started: ModelsNextCapabilities: ChatContact usPrivacyTerms of useAccessibilityIBM.comHave questions? Contact us onon Discord React Components version ^1.61.0Last updated 14 February 2025Copyright © 2025 IBM"
