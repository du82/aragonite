full_description = "IBM watsonx™ models are designed for the enterprise and optimized for targeted business domains and use cases. Through the AI studio IBM® watsonx.ai™ we offer a selection of cost-effective, enterprise-grade foundation models developed by IBM, open-source models and models sourced from third-party providers to help clients and partners scale and operationalize artificial intelligence (AI) faster with minimal risk. You can deploy the AI models wherever your workload is, both on-premises and on hybrid cloud. IBM watsonx foundation models library gives you the choice and flexibility to choose the model that best fits your business needs, regional interests and risk profiles from a library of proprietary, open-source and third-party models. IBM® Granite™ is our family of open, performant, and trusted AI models, tailored for business and optimized to scale your AI applications. With Granite 3.1, you’ll find open-sourced, enterprise-ready models that deliver exceptional performance across a wide range of enterprise tasks such as cybersecurity and RAG and against safety benchmarks. Use IBM developed and open-sourced embedding models, deployed in IBM watsonx.ai, for retrieval augmented generation, semantic search and document comparison tasks. Don’t sacrifice performance for cost. Granite outperforms comparable models across a variety of enterprise tasks. Build responsible AI with a comprehensive set of risk and harm detection capabilities, transparency, and IP protection. Select a generative foundation model that best fits your needs. After you have a short list of models for your use case, systematically test the models by using prompt engineering techniques to see which ones consistently return the desired results. Supports questions and answers (Q&A), summarization, classification, generation, extraction, RAG, and coding tasks. Supports questions and answers (Q&A), summarization, classification, generation, extraction, RAG, and coding tasks. Supports 