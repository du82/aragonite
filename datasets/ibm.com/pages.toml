full_description = "At IBM we value your privacy and are committed to protecting and processing your personal information responsibly. This privacy statement describes how IBM collects, uses, and shares personal information about consumers and other individuals within our clients, business partners, supplier and other organizations with which IBM has or contemplates a business relationship. It applies to IBM Corporation and IBM subsidiaries except where a subsidiary presents its own statement without reference to IBM’s. Where we provide products, services, or applications as a business-to-business provider to a client, the client is responsible for the collection and use of personal information while using these products, services, or applications. This collection and use is covered by the client’s privacy policy, unless otherwise described. Our agreement with the client may allow us to request and collect information about authorized users of these products, services, or applications for reasons of contract management. In this case, this privacy statement, or a supplementary privacy notice, applies. It includes information on Your Account, IBM Websites, IBM Applications, Cloud and Online Services, Marketing, Contractual Relationships, Support Services, Protecting You and IBM, IBM Locations, Recruitment and Former Employees, Conducting our Business Operations, Cookies and Similar Technologies, and Children. The information that we collect and use may include profile information, interactions on webpages, marketing preferences, information to investigate malicious activities, recordings or transcripts of your conversations with us for support purposes, information to improve our business operations, and more. You can create an account with IBM by creating an IBMid. An IBMid provides IBM with your name, email address, mailing address, and related information that you may provide. We may require an IBMid for certain services, such as the use of IBM Applications, Cloud and Online Services."
