full_description = "Our third generation of AI language models are here. Fit for purpose and open sourced, these enterprise-ready models deliver exceptional performance against safety benchmarks and across a wide range of enterprise tasks from cybersecurity to RAG. Don’t sacrifice performance for cost. Granite outperforms comparable models1 across a variety of enterprise tasks. Build responsible AI with a comprehensive set of risk and harm detection capabilities, transparency, and IP protection. Base and instruction-tuned language models with new reasoning capabilities designed for agentic workflows, RAG, text summarization, text analytics and extraction, classification, and content generation. Pre-trained model specialized on vision tasks for document and image understanding, supporting a range of file types and resolutions, and designed for efficient deployment in enterprise environments. Decoder-only models designed for code generative tasks, including code generation, code explanation, and code editing, trained with code written in 116 programming languages. Lightweight and pre-trained for time-series forecasting, optimized to run efficiently across a range of hardware configurations. Safeguard AI with Granite Guardian, ensuring enterprise data security and mitigating risks across a variety of user prompts and LLM responses, with top performance in 15+ safety benchmarks. NASA and IBM teamed up to create an AI Foundation Model for Earth Observations using large-scale satellite and remote sensing data. Designed to significantly enhance understanding of user intent and increase the relevance of information and sources in response to a query. Applying reasoning capabilities to Granite led to a significant jump in complex instruction following and maintained general performance and safety characteristics, whereas comparable models experienced degradation in these domains *Prices shown are indicative, may vary by country, exclude any applicable taxes and duties, and a