["https://ibtimes.co.uk/what-feb-28-economic-blackout-boycott-amazon-walmart-mcdonalds-more-24-hours-1731534"]
title = "What Is The Feb 28 Economic Blackout: Boycott of Amazon, Walmart, McDonalds and More For 24 Hours | IBTimes UK"
description = "A nationwide 24-hour boycott, the 'Feb. 28 Economic Blackout,' aims to pressure major retailers over rising prices and policy changes."
full_description = '''By Vinay Patel @VinayPBPatel Published 28 February 2025, 12:44 PM GMT Share on Facebook Share on Twitter Share on LinkedIn Share on Reddit Share on Flipboard doFir.push(function(){var flipboard=1;jQuery(".genericon-flipboard").on('click',function(e){e.preventDefault();e.stopPropagation();if(flipboard){flipboard=0;LJ('https://cdn.flipboard.com/web/buttons/js/flbuttons.min.js',function(){jQuery(".genericon-flipboard").trigger('click')})}})}) Share on Pocket Consumers are being asked to join a 24-hour spending strike, the 'Feb. 28 Economic Blackout,' in protest of rising prices and corporate decisions. X / Sumner @renmusb1 A nationwide consumer boycott, known as the 'February 28 economic blackout', is set to take place on Friday, with organisers urging Americans to avoid major retailers such as Amazon, Walmart and leading fast-food chains for 24 hours. The movement, spearheaded by activist group The People's Union USA, aims to challenge corporate pricing policies and protest rising living costs.The Movement Behind the BoycottFounded by John Schwarz, The People's Union USA has been vocal about its mission for 'economic justice' and has been actively promoting the initiative on social media. Schwarz insists the movement is apolitical, stating in a widely shared Instagram video: 'All our lives, we've been told we have no choice—that this is just how things are. We're expected to accept outrageous prices, corporate greed, and billionaire tax breaks while we struggle to get by. For one day, we are finally going to turn the tables.'The campaign has gained traction, with notable figures such as Stephen King, Bette Midler and John Leguizamo endorsing the boycott. Social media activists have also pointed to companies like Ford, McDonald's, Target and Walmart, which have recently scaled back their diversity, equity and inclusion (DEI) programmes, as potential targets.Writer's pickWhy Are People Boycotting Coca-Cola? And 11 Other Companies Latinos Refuse To Buy FromStanding Firm: 13 Companies Committed to DEI in 2025 Despite Pressure from TrumpTarget DEI Initiatives Axed: List of Companies Rolling Back DEI and Those Standing FirmMore Boycotts on the Horizon?According to RetailWire, The People's Union USA has planned further economic blackouts, including a broader one on 28th March. Additionally, it is coordinating retailer-specific boycotts against Walmart, Amazon, and global food conglomerates like Nestlé and General Mills.To target Amazon, organisers are urging consumers to avoid purchases from its subsidiary, Whole Foods. The movement also highlights Target, which historically supported DEI initiatives but recently scaled them back. The labour group We Are Somebody, led by Nina Turner, has already initiated a boycott against Target since 1st February, aligning with Black History Month.Religious Support and Expanding ProtestsThe movement has also drawn support from religious leaders. Reverend Jamal Bryant of Atlanta has launched targetfast.org to mobilise Christians for a 40-day boycott of Target, beginning 5th March, in alignment with Lent. Meanwhile, civil rights leader Reverend Al Sharpton has announced that the National Action Network will select two companies for boycott within 90 days due to their rollback of DEI commitments.Sharpton said: 'Donald Trump can cut federal DEI programmes to the bone, he can claw back federal money to expand diversity, but he cannot tell us what grocery store we shop at.'Will the 28th February Blackout Have an Impact?The People's Union is calling for a total halt in consumer spending—both online and in physical stores—between midnight and 11:59 p.m. on 28th February. However, supporters are encouraged to continue shopping at small, local businesses.Despite growing momentum, economists remain sceptical about the boycott's potential impact. Some analysts predict that major retailers will feel little disruption. 'A lot of people dismiss the idea, arguing that a one-day spending freeze won't move the needle for major corporations or the broader financial system. And I agree—it'll likely have a minimal direct impact,' Kevin Thompson, CEO of 9i Capital Group, told Newsweek.Broader Economic ImplicationsBoycotts of this nature are not unprecedented. Earlier this year, the 'No Buy 2025' challenge gained traction on TikTok, urging consumers to purchase only necessities. Similarly, Costco faced a MAGA-led boycott after reaffirming its DEI policies.According to RetailWire, while some retailers might experience a slight dip in revenue on Friday, broader economic factors such as inflation and tariff policies already weigh heavily on consumer confidence. 'The market share pie is just so big,' noted Marshal Cohen, chief retail advisor at Circana. 'You can't afford to have your slices get smaller. Consumers are spending more money on food, and that means there's more pressure on general merchandise or discretionary products.'However, Cohen believes that any significant sales decline is likely to be concentrated in liberal coastal cities and major metropolitan areas.Expert OpinionsAnna Tuchman, marketing professor at Northwestern University's Kellogg School of Management, stated that while the economic blackout may cause a temporary dip in retail sales, it is unlikely to lead to long-term changes. 'I think this is an opportunity for consumers to show that they have a voice on a single day,' she said. 'But it's unlikely we will see sustained decreases in economic activity as a result of this boycott.'Meanwhile, political and image consultant Afya Evans from Atlanta expressed support for the blackout but noted that she will continue shopping—albeit at independent retailers and Black-owned businesses. 'It's a broader thing. We want to see what the impact is. Let everybody participate. And plan from there,' she said.Writer's pickUS Coast Guard Chief Found Out She Was Fired While In Line To Take A Photo With TrumpGoogle, Accenture, Amazon Join Growing List of US Companies Scrapping DEI Efforts and GoalsSam's Club Dethrones Costco As America's Top Wholesale Club Due To High-Tech CheckoutTwo Major Reasons Why People Are Boycotting Sam's Club: What You Need to Know© Copyright IBTimes 2025. All rights reserved.'''
