["https://ibtimes.co.uk/rise-property-guardianship-how-brits-are-turning-abandoned-buildings-affordable-housing-1731463"]
title = "The Rise Of Property Guardianship: How Brits Are Turning Abandoned Buildings Into Affordable Housing | IBTimes UK"
description = "People are looking for affordable housing in churches and schools"
full_description = '''By Marcelo Alejandro Leyva Chapa Published 27 February 2025, 8:24 PM GMT Share on Facebook Share on Twitter Share on LinkedIn Share on Reddit Share on Flipboard doFir.push(function(){var flipboard=1;jQuery(".genericon-flipboard").on('click',function(e){e.preventDefault();e.stopPropagation();if(flipboard){flipboard=0;LJ('https://cdn.flipboard.com/web/buttons/js/flbuttons.min.js',function(){jQuery(".genericon-flipboard").trigger('click')})}})}) Share on Pocket Former restaurant turned home by Live-In Guardians Live-In Guardians With UK housing costs soaring, many working professionals are seeking alternative ways to secure stable accommodation without leaving the cities where they live and work. One increasingly popular solution is property guardianship, a practice where individuals live in abandoned buildings such as churches, schools, and office spaces for a fraction of the cost of traditional rent.As house prices continue to rise—the average UK home now costs £268,087 ($339,460)—more people are turning to unconventional housing solutions to cut costs. While these properties often lack modern amenities and come with fewer legal protections, guardians argue that the significant savings outweigh the downsides, allowing them to put money aside for a future home.How Property Guardianship Works Former school turned into a home in Newcastle AD HOC Property Property guardianship operates through private companies that match potential residents with vacant buildings. In exchange for a licensing fee, which is almost always cheaper than traditional rent, guardians take up residence in unoccupied properties, often enjoying larger living spaces than they could otherwise afford.For property owners, having guardians in place acts as a deterrent to squatters and helps prevent the buildings from falling into further disrepair. However, since property guardianship is not governed by UK tenancy law, residents do not have the same legal protections as traditional renters.Unlike standard tenants, guardians face: (1) No protection from eviction, as they can be removed on short notice, (2) no guarantees of maintenance, meaning buildings can lack heating, electricity, or running water and lastly, (3) no rental security, as the licensing fee can be increased at any time.Despite these risks, many guardians accept these conditions in exchange for lower housing costs, seeing it as a short-term sacrifice to save for a more permanent home.The Unconventional Spaces Becoming HomesWith the UK's housing crisis showing no signs of slowing, some people are taking a different approach—buying and transforming abandoned buildings into homes themselves.According to the UK House Price Index, buyers are purchasing properties for as little as £100,000 ($126,623) and turning them into affordable apartments. This has led to a wave of redevelopment projects, where old structures are repurposed into housing.In Sunderland, a former school was converted into 15 apartments for elderly residents, offering a cost-effective solution to the demand for senior living spaces. Similarly, a historic church in Stanford-le-Hope is being transformed into residential homes, reflecting a wider trend of revitalising derelict buildings to meet housing needs.Expanding Affordable Housing Through Redevelopment Washington Old School in Sunderland, was changed into 15 apartments for the elderly Fairhurst Engineering One of the key advantages of repurposing old buildings is the potential for expansion. Many vacant schools, churches, and office spaces occupy large plots of land, allowing developers to build upwards and outwards, maximising available living space.Some projects have seen former public buildings turned into multi-unit housing developments, with some properties being transformed into as many as 40 apartments—a stark contrast to leaving these spaces abandoned for decades.A Growing Trend Amid the Housing CrisisAs rent and property prices continue to rise, the demand for cost-effective housing alternatives is pushing more people towards property guardianship and building redevelopment. Instead of relocating to cheaper areas, many are choosing to stay in major cities, making use of available but neglected buildings.While the guardian lifestyle is not without its challenges, the financial benefits and sense of community are making it an increasingly popular choice. With the trend only expected to grow, the question remains: will property guardianship remain a niche solution, or will it become a key strategy in tackling the UK's housing crisis? UK Housing UK© Copyright IBTimes 2025. All rights reserved.'''
