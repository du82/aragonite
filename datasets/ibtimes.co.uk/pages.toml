["https://ibtimes.co.uk/complete-list-celebrities-who-lost-their-homes-la-fires-1730058"]
title = "Complete List Of Celebrities Who Lost Their Homes To The LA Fires | IBTimes UK"
description = "Stars such as Anthony Hopkins, Billy Crystal, Heidi Montag, Adam Brody and Leighton Meester are among those who have lost their homes to the fires."
full_description = '''By Ria Pathak Updated 13 January 2025, 1:55 PM GMT Share on Facebook Share on Twitter Share on LinkedIn Share on Reddit Share on Flipboard doFir.push(function(){var flipboard=1;jQuery(".genericon-flipboard").on('click',function(e){e.preventDefault();e.stopPropagation();if(flipboard){flipboard=0;LJ('https://cdn.flipboard.com/web/buttons/js/flbuttons.min.js',function(){jQuery(".genericon-flipboard").trigger('click')})}})}) Share on Pocket AFP News This is a developing story. Follow for updates.Some of Hollywood's best-known faces are among the thousands caught up in the devastating wildfires currently tearing through Southern California. With nearly 180,000 residents already evacuated—and that number still rising—the crisis has touched everyone from ordinary families to some of the biggest names in the entertainment industry.The crisis began with the Pacific Palisades fire on Tuesday morning, swiftly followed by outbreaks in neighbouring communities like Eaton, Woodley, and Hurst. The area where the fire erupted, nestled between Santa Monica and Malibu in northern Los Angeles, is known for its exceptionally high property values.It boasts some of the most expensive real estate in the country, belonging to stars like Ben Affleck, Michael Keaton, and more. Here are the celebrities who lost their homes in the LA fire:1. Paris HiltonA post shared by instagram Paris Hilton lost her Malibu mansion in the devastating LA wildfires, a home valued at approximately £10 million ($13.54 million). The socialite expressed heartbreak over the destruction, sharing emotional posts on social media to show support for others impacted by the fires. Paris described the loss as surreal, noting that her home held countless irreplaceable memories.Despite her grief, Hilton has stepped up to assist the community by launching a relief fund. She personally donated $100,000 and pledged to match donations from others, raising substantial funds for displaced families.Paris has since been residing in Beverly Hills and focusing on rebuilding her life while advocating for stronger disaster management systems.READ MORE: Meet Stewart and Lynda Resnick: The Billionaire Farmers Controlling California's Water2. Milo VentimigliaActor Milo Ventimiglia, known for his role in This Is Us, lost his Los Angeles property to the fires. While the home's value has not been disclosed, it was a charming retreat in a tranquil neighbourhood. Ventimiglia expressed sorrow over the loss, remarking on the eerie parallels between his real-life experience and his character's storyline in the series, where a house fire was a central plot point.The actor praised first responders for their efforts and encouraged fans to support wildfire victims. Milo has temporarily moved into a rental property in the Hollywood Hills while considering his next steps.3. Bryan Greenberg and Jamie ChungA post shared by instagram Celebrity couple Bryan Greenberg and Jamie Chung lost their serene Los Angeles home in the wildfires. While the property's value remains undisclosed, it was known for its luxurious design and stunning views. Jamie shared heartbreaking photos of the fire's aftermath on her Instagram, thanking firefighters for their bravery.The couple has been actively raising funds for wildfire victims and encouraging their followers to donate to relief efforts. Currently, they are staying with close friends. Both have stated that they intend to rebuild in the same area, citing their deep love for the community.4. Mel GibsonMel Gibson's Malibu home, valued at approximately £7.15 million ($9.68 million), was reduced to ashes in the wildfires. The actor-director, who was out of state at the time, shared his shock and devastation upon learning of the loss. Gibson's property, a Spanish-style villa, had been a peaceful haven for years.In interviews, he expressed gratitude that no lives were lost, acknowledging the irreplaceable loss of personal mementos. Currently, Gibson is staying in a rental property in Austin, Texas, while he decides whether to rebuild or relocate. He has donated to local organisations supporting fire victims and has called for improved wildfire prevention policies.5. Miles Teller and Keleigh TellerA post shared by instagram Miles Teller and his wife, Keleigh, lost their Pacific Palisades home, valued at around £8.8 million ($12.1 million). The couple's home, a stunning modern structure, was a reflection of their artistic personalities. Keleigh shared a final photo of their property moments before it was engulfed in flames, expressing relief that they escaped unharmed.Miles described the ordeal as "life-changing" and has since been vocal about the need for better emergency evacuation plans. They are temporarily living in New York while exploring options to rebuild in California.READ MORE: Did Medium To The Stars, Tyler Henry, Predict The LA Fires? Eerie Warning He Gave Ricki Lake Three Months Ago6. Melissa RiversA post shared by instagram Melissa Rivers, daughter of legendary comedian Joan Rivers, saw her hillside home destroyed by the wildfires. The property, though not publicly valued, was estimated to be worth millions due to its prime location. Rivers described the loss as "heartbreaking but manageable," acknowledging her privilege compared to others who lost everything.She has focused on advocating for better fire management policies, leveraging her platform to drive change. Melissa is currently staying in a luxury condo in Beverly Hills and has organised a charity auction featuring her late mother's memorabilia, donating all proceeds to wildfire relief funds.7. Billy CrystalBilly Crystal and his wife lost their family home of 45 years, valued at £10.4 million ($14 million), in the fires. The beloved comedian and actor shared poignant memories of raising his children in the house, calling its destruction a profound loss. Crystal has praised firefighters for their heroic efforts and expressed gratitude that his family remained safe.He has been temporarily staying with his daughter in Los Angeles while planning to rebuild. Crystal has used his influence to bring attention to the challenges of wildfire recovery, hosting benefit events and making personal donations to aid displaced families. Despite the tragedy, he remains optimistic about starting anew.8. Anna FarisAnna Faris lost her picturesque hillside home in the fires, a property valued at £7.5 million ($9.9 million). The actress, known for her roles in Scary Movie and Mom, shared her devastation on social media, describing the experience as surreal. Faris was forced to evacuate with only a few personal items, leaving behind cherished possessions.9. Mandy MooreA post shared by instagram Mandy Moore's home in Malibu, valued at approximately £8.5 million ($11.5 million), was destroyed in the wildfires. The singer and actress described the loss as "utterly devastating," noting that the house held significant sentimental value. Mandy has taken a hands-on approach to recovery, partnering with local charities to support displaced residents. She has temporarily relocated to an apartment in downtown Los Angeles.10. Heidi Montag and Spencer PrattA post shared by instagram Reality TV stars Heidi Montag and Spencer Pratt lost their sprawling Malibu home in the LA wildfires. The property, valued at approximately £6.5 million ($8.8 million), was a significant part of their lives, featured prominently in their social media posts and reality shows.Montag expressed heartbreak over the loss, sharing emotional updates about their evacuation experience. Spencer Pratt called the situation a "waking nightmare," acknowledging how quickly the fire engulfed their property. The couple is temporarily residing in a rented home in Beverly Hills, focusing on creating a sense of normalcy for their son, Gunner.11. Adam Brody and Leighton MeesterAdam Brody and Leighton Meester lost their Pacific Palisades home, valued at around £9 million ($12.5 million), in the wildfires. Known for their private lifestyle, the couple rarely shared glimpses of their home, but it was described as a modern retreat with ocean views. Meester expressed profound sadness over the destruction, calling it a life-altering event. The couple evacuated with their two children and their pets, grateful for their safety but heartbroken over the loss of sentimental possessions.12. Tina KnowlesTina Knowles, mother of Beyoncé and Solange, lost her Malibu home, a property estimated at £8 million ($10.9 million). The home, which she often described as her sanctuary, was filled with artworks and memorabilia from her daughters' careers. Tina shared her devastation on social media, thanking the firefighters for their hard work and expressing gratitude that her family was safe. Currently, she is staying with her daughter Beyoncé in Los Angeles.13. Cary ElwesA post shared by instagram Cary Elwes, best known for his role in The Princess Bride, lost his Malibu property in the wildfires. The home, valued at approximately £7 million ($9.6 million), was described as a rustic retreat surrounded by nature. Elwes has shared his devastation, emphasising how quickly the fire consumed his property. He has since been staying in temporary housing in Santa Monica.Despite the personal loss, Cary has been using his platform to advocate for improved wildfire prevention policies and greater support for first responders. He has also contributed to several charities focused on helping families recover from the disaster. Elwes has expressed gratitude for the outpouring of support from fans and friends during this difficult time.14. Diane WarrenOscar-nominated songwriter Diane Warren lost her Los Angeles home in the wildfires, a property valued at approximately £6.5 million ($8.8 million). Known for her passion for animal rescue, Diane was most devastated by the potential harm to wildlife in the affected areas. Currently, Diane is staying with close friends in Los Angeles.15. Anthony HopkinsSir Anthony Hopkins lost his Malibu estate, valued at around £7.15 million ($9.68 million), in the fires. The property, a picturesque villa overlooking the Pacific Ocean, was one of the actor's favourite retreats. Hopkins shared his heartbreak over the loss, describing the event as a stark reminder of life's impermanence. Despite the tragedy, he expressed gratitude for the safety of his family and neighbours.16. Eugene LevyEugene Levy's Los Angeles home, a luxurious property valued at approximately £6 million ($8.2 million), was destroyed in the wildfires. The Schitt's Creek actor expressed his sadness over the loss, emphasising the importance of family during difficult times. Levy and his wife Catherine are currently staying in temporary accommodation in Vancouver, where they also own a home.17. Ricki LakeRicki Lake, the talk show host and actress, lost her Malibu beach house, valued at around £5.8 million ($8 million). The property, which she described as her "dream home," was a place of solace and inspiration for years.The LA wildfires have left a trail of devastation, with numerous celebrities among those who lost their homes. Despite their personal losses, many of these stars have used their platforms to support recovery efforts and advocate for stronger wildfire prevention measures.Writer's pickWho Is David Muir? 'Pathetic' News Host Slammed For Fashion Faux Pas While Reporting On LA FiresTrolls Take Aim at Joy Taylor Over Allegations of Misconduct and Favouritism at Fox SportsQuick Facts About Aubrey Plaza's Husband: Car Accident, Their Secret Wedding, and His Tragic SuicideMeet Richard Giannotti: Joy Taylor's Ex-Husband Who She Allegedly Cheated On With Emmanuel Acho© Copyright IBTimes 2025. All rights reserved.'''
