["https://ibtimes.co.uk/sams-club-dethrones-costco-americas-top-wholesale-club-due-high-tech-checkout-1730724"]
title = "Sam's Club Dethrones Costco As America's Top Wholesale Club Due To High-Tech Checkout | IBTimes UK"
description = "Sam's Club dethroned Costco as America's top wholesale club due to its high-tech Scan & Go checkout, boosting customer satisfaction and online order fulfilment."
full_description = '''By Vinay Patel @VinayPBPatel Published 04 February 2025, 7:31 AM GMT Share on Facebook Share on Twitter Share on LinkedIn Share on Reddit Share on Flipboard doFir.push(function(){var flipboard=1;jQuery(".genericon-flipboard").on('click',function(e){e.preventDefault();e.stopPropagation();if(flipboard){flipboard=0;LJ('https://cdn.flipboard.com/web/buttons/js/flbuttons.min.js',function(){jQuery(".genericon-flipboard").trigger('click')})}})}) Share on Pocket Sam's Club's innovative Scan & Go checkout propelled it past Costco as the top wholesale club, earning higher customer satisfaction and leading the ACSI rankings. Twitter / Evan @StockMKTNew Sam's Club has overtaken Costco as the nation's top wholesale club for customer satisfaction.Shoppers have praised Sam's Club's upgraded Scan & Go checkout system—Walmart's take on the warehouse club experience. This feature allows members to scan and pay for their purchases via a mobile app, letting them skip the tills entirely.Scan & Go: The Secret to Sam's Club's SuccessOne in three shoppers use this feature to avoid checkout queues altogether. Thanks to these enhancements, Sam's Club achieved the highest score in the annual American Customer Satisfaction Index (ACSI), earning 85 out of 100—an impressive four-point increase.This jump not only placed them ahead of longtime leader Costco—whose score stayed at 82—but also surpassed all other major retailers. 'My hope is that Sam's Club, when you shop, feels like what it's like to shop in the future, this is a glimpse of that,' Sam's Club CEO Chris Nicholas told Business Insder in October 2024. 'That's what I hope, and so that's my job. This is a glimpse of that,' he added.READ MORE: Two Major Reasons Why People Are Boycotting Sam's Club: What You Need to KnowHow Technology Helped Sam's Club Take The LeadThe ability to scan items while shopping and then skip the checkout lines is a big attraction for customers, according to the ACSI. 'We're seeing a clear divide emerge between brands that are meeting the needs and expectations of younger consumers versus those that are falling behind,' ACSI director of research emeritus Forrest Morgeson told BI.Morgeson suggested that digital tools like those at Sam's Club are crucial for keeping younger shoppers happy. Sam's Club also received positive feedback for fulfilling online orders accurately and promptly, especially for curbside pickup. Costco's score held steady at 82, while BJ's, which ranked third, dropped to 78.Costco has explored integrating some technology into its operations, but its digital features don't yet compare to what Sam's Club offers. Costco recently implemented ID scanners to ensure only members shop at their locations. The company now offers online inventory checks for local warehouses so shoppers can see if a desired item is in stock at their nearest location.Costco Doubles Down On DEI PoliciesIn the survey, 42,000 shoppers shared their experiences at these popular stores. Costco has recently been in the news for their firm stance in support of diversity, equity, and inclusion (DEI) initiatives. The company and its shareholders recently voted to maintain their existing DEI policies.At their annual meeting, shareholders overwhelmingly rejected a proposal from a conservative activist group that opposed Costco's diversity, equity, and inclusion policies. This vote served as an initial indicator of investor sentiment regarding the value of corporate DEI programs, many of which companies implemented or expanded starting in 2020.A top Costco executive cautioned that the retailer might have to increase prices this year if US President Donald Trump's proposed tariff policies are enacted. 'When it rains, it rains on everybody,' Gary Millerchip, the discount warehouse club's chief financial officer, told investors during an earnings call last month.'Of course, tariffs raise costs. That's not something that we see as a positive in general,' Millerchip said. The executive added that the potential impact of the proposed tariffs on the 'timing and scope of changes' at Costco remained uncertain.Writer's pick'Give a Fair Contract or Else': 18,000 Costco Workers Prepare to Strike Over Pay and Conditions79-Year-Old Earns Up To £3,900 Monthly On TaskRabbit: Shares Tips On How To Get 'Superb Reviews'Here's Why The Kroeger Albertsons Merger Was Blocked And What It Means For Consumers© Copyright IBTimes 2025. All rights reserved.'''
