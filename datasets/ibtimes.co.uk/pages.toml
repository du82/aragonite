title = "Capital One Banking Outage Could Delay Some US Paychecks: When Will It Be Fixed? | IBTimes UK"
description = "Capital One customers faced significant disruptions Thursday due to a widespread outage impacting online banking services."
full_description = '''By Vinay Patel @VinayPBPatel Published 17 January 2025, 5:57 AM GMT Share on Facebook Share on Twitter Share on LinkedIn Share on Reddit Share on Flipboard doFir.push(function(){var flipboard=1;jQuery(".genericon-flipboard").on('click',function(e){e.preventDefault();e.stopPropagation();if(flipboard){flipboard=0;LJ('https://cdn.flipboard.com/web/buttons/js/flbuttons.min.js',function(){jQuery(".genericon-flipboard").trigger('click')})}})}) Share on Pocket Capital One customers faced significant disruptions Thursday as a widespread outage crippled online banking services. X / Etcetera Ejikeme @etceteraejikeme Capital One customers are grappling with significant banking disruptions, including delays in receiving pay cheques, as the bank works urgently to restore services and minimise the impact on its users.Pay cheque Delays Hit School EmployeesA technical outage at Capital One Bank has led to delays in direct deposits, notably affecting more than 600 East Baton Parish school employees. This group, which excludes teachers, had been expecting their pay cheque on Thursday."This will only affect 12-month employees, and the delayed direct deposit will be issued by our fiscal agent, Capital One, as soon as the outage is resolved," district spokesman Taylor Gast explained in a news release.Approximately 1,000 accounts tied to over 600 school employees—around 10% of the district payroll—have been impacted. This group includes various staff members, from secretaries to senior administrators. Teachers, who were paid on Wednesday prior to the outage, remain unaffected due to their nine-, ten-, or eleven-month contracts.No Clear Timeline for Service RestorationThe outage, which began around 4 am on Thursday, 16 January, has disrupted Capital One's online banking services, according to reports from Down Detector. While the bank announced at 11:15 am that services would "gradually begin to return to normal throughout the day," a specific timeline for full restoration remains uncertain.Capital One has assured customers that it is addressing the issue and will cover reasonable fees incurred as a result of the disruption once services are fully restored.Writer's pickIs Pam Bondi Married With Children: Quick Facts About Trump's Pick for Attorney GeneralWas Hawk Tuah Girl Arrested: Hawk Investors Question Haliey Welch's Whereabouts Amid SilenceShocking Details From Neil Gaiman Exposé, 'There Is No Safe Word': What You Need To KnowThe Root Cause of the OutageCapital One revealed in a social media post on X (formerly Twitter) that a technical issue with a third-party vendor is at the core of the disruption. This issue has temporarily affected account services such as deposits and payment processing for consumer, small business, and commercial banking customers."We are actively working with the vendor to resolve the issue and restore services, and we apologise for the inconvenience," Capital One's customer service team stated.The bank has been actively responding to a surge of customer inquiries on X, offering reassurances and updates on the progress of its efforts.Capital One Under Fire for More Than Just Tech IssuesThe outage comes at a particularly challenging time for Capital One. Earlier this week, the Consumer Financial Protection Bureau (CFPB) announced a lawsuit against the bank, accusing it of misleading customers regarding their savings account interest rates and allegedly defrauding them of over £1.63 billion ($2 billion) in interest.According to the CFPB, Capital One blurred the lines between its legacy "360 Savings" account and its newer, higher-yield "360 Performance Savings" account, failing to adequately inform customers about the difference. This allegedly caused account holders to miss out on substantial interest earnings.Banking Woes Across the IndustryCapital One's challenges are not isolated. Just days earlier, Citibank faced its own service disruptions, with customers reporting difficulties accessing their accounts via mobile devices and issues related to fraud alerts. While Citibank resolved the mobile access problem quickly, the fraud alert issue remains ongoing.The double blow of a technology outage and the CFPB lawsuit has put Capital One under intense scrutiny. As financial institutions increasingly rely on technology to deliver essential services, the need for robust systems and transparent practices has never been more critical.Writer's pickCandice Miller 'Is Weirdly Okay' After Husband's Suicide, Receives $15M Life InsuranceComplete List Of Celebrities Who Lost Their Homes To The LA FiresMeet Stewart and Lynda Resnick: The Billionaire Farmers Controlling California's Water© Copyright IBTimes 2025. All rights reserved.'''
