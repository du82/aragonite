["https://ibtimes.co.uk/pam-bondi-married-children-quick-facts-about-trumps-pick-attorney-general-1730198"]
title = "Is Pam Bondi Married With Children: Quick Facts About Trump's Pick for Attorney General | IBTimes UK"
description = "Pam Bondi, Donald Trump's Attorney General nominee, is a seasoned legal professional with a notable career in politics, marked by two divorces, a called-off engagement, and a steadfast focus on justice reform."
full_description = '''By Sarah Tan Published 15 January 2025, 10:01 PM GMT Share on Facebook Share on Twitter Share on LinkedIn Share on Reddit Share on Flipboard doFir.push(function(){var flipboard=1;jQuery(".genericon-flipboard").on('click',function(e){e.preventDefault();e.stopPropagation();if(flipboard){flipboard=0;LJ('https://cdn.flipboard.com/web/buttons/js/flbuttons.min.js',function(){jQuery(".genericon-flipboard").trigger('click')})}})}) Share on Pocket Former Florida attorney general Pam Bondi, pictured in February 2024, helped defend Donald Trump against impeachment AFP News Pam Bondi, Donald Trump's nominee for United States Attorney General, has sparked curiosity not just for her legal career but also her personal life. The former Florida Attorney General, known for her sharp legal acumen and close association with Trump, has had a series of high-profile relationships but currently remains unmarried and childless.A Prominent Legal CareerBondi, aged 59, was born on 17 November 1965, in Tampa, Florida. She earned her Bachelor of Arts in criminal justice from the University of Florida before pursuing a Juris Doctor at Stetson University College of Law. Admitted to the Florida Bar in 1991, she served as Florida's Attorney General from 2011 to 2019, becoming the first woman to hold this position in the state.Bondi's political prominence soared during Trump's presidency when she served on his defence team during his first impeachment trial. She later joined the America First Policy Institute, overseeing Trump's legal matters. Following controversy surrounding Trump's original Attorney General nominee, Matt Gaetz, Bondi's appointment has garnered widespread attention.During her recent Senate confirmation hearing, Bondi vowed to "restore confidence and integrity to the Department of Justice." She pledged to prioritise prosecuting violent crime, combatting drug trafficking, and addressing border security.Marital History and RelationshipsPam Bondi has walked down the aisle twice, although both marriages ended in divorce. At 24, she wed Garret Barnes in 1990. However, the union was short-lived, lasting only 22 months, and ended in 1992. In 1996, Bondi married Scott Fitzgerald, but their marriage also dissolved after six years, concluding in 2002.Her most recent public relationship was with Greg Henderson, an ophthalmologist, to whom she became engaged in 2012. The couple kept their relationship largely private, and rumours swirled after Bondi was photographed in a white dress during a Caribbean cruise. Despite the speculation, Bondi later confirmed that no wedding took place.Does Pam Bondi Have Children?Bondi does not have children, and her focus has largely remained on her legal and political career.Bondi has not been immune to public scrutiny. Her nomination for Attorney General comes at a time of political polarisation, with Trump lauding her ability to "refocus the DOJ to its intended purpose of fighting crime." Critics, however, have questioned her political alignment and past affiliations.Bondi's personal life has also piqued public interest, with her high-profile relationships and decision to remain unmarried becoming a subject of tabloid fascination. Despite this, Bondi has maintained a level of privacy, choosing to concentrate on her professional achievements.Writer's pickQuick Facts About Travis Hunter: What Happened to His Dad, Who His Fiancée Is, and MoreQuick Facts About Amanda Palmer: What Did Neil Gaiman's Ex-Wife Know About the Alleged AssaultsWho Is Paulette Thompson: Quick Facts About Brian Thompson's Wife, How They Met and Their KidsHow Many Wives and Children Does Pete Hegseth Have?© Copyright IBTimes 2025. All rights reserved.'''
