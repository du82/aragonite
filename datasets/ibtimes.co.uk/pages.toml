["https://ibtimes.co.uk/cancuns-taxi-scams-are-spiralling-out-control-tourists-face-sky-high-fares-violent-clashes-1731461"]
title = "Cancún's Taxi Scams Are Spiralling Out of Control: Tourists Face Sky-High Fares and Violent Clashes | IBTimes UK"
description = "Cancún's tourism industry faces a crisis as violent taxi disputes, soaring fares, and government intervention threaten the city's reputation and visitor experience."
full_description = '''By Marcelo Alejandro Leyva Chapa Published 27 February 2025, 1:25 AM GMT Share on Facebook Share on Twitter Share on LinkedIn Share on Reddit Share on Flipboard doFir.push(function(){var flipboard=1;jQuery(".genericon-flipboard").on('click',function(e){e.preventDefault();e.stopPropagation();if(flipboard){flipboard=0;LJ('https://cdn.flipboard.com/web/buttons/js/flbuttons.min.js',function(){jQuery(".genericon-flipboard").trigger('click')})}})}) Share on Pocket Cancun taxis from the airport to a hotel can cost up to £115 ($146) SIPSE Cancún, once a thriving tourism hotspot, is facing a growing crisis as tourist numbers plummet and tension between taxi drivers and rideshare services reaches boiling point. Tourism in Cancún dropped by 14% in 2024, a decline linked to violent taxi disputes, exorbitant fares, and a growing preference for rideshare apps like Uber, DiDi, and Cabify.As viral videos circulate of cab drivers attacking Uber drivers and tourists, the Quintana Roo government has been forced to step in, announcing investigations into taxi driver misconduct and potential regulations to bring fares under control.Outrage Over Exorbitant Taxi FaresTaxi fares in Cancún are supposed to be regulated within a range of £4 to £15 ($5 to $20) for trips to Cancún, Tulum, and Puerto Morelos. However, due to exclusive government contracts with the local taxi union, drivers have been exploiting tourists, with some charging between £40 and £115 ($50 to $146) for a single ride to the Hotel Zone.Concerns over these prices escalated after Mexican influencer Luisito Comunica called out the high taxi fares on Instagram. The issue had been largely ignored by city officials—until it gained widespread media attention, eventually prompting Mexican President Claudia Sheinbaum to address the controversy.'We are going to review the situation because in some cases there is abuse,' Sheinbaum stated. 'We recognise the taxi drivers, but they need to charge what should be charged.' Luisito Comunica talking about the high costs of taxis in Cancun Infobae Taxi Drivers Resort to Violence to Keep ControlDespite government support for rideshare apps, the local taxi union continues to violently oppose their presence, frequently targeting both drivers and passengers.On 12 December 2024, three cab drivers physically assaulted an American tourist for attempting to use Uber. These drivers were immediately detained, and their licences permanently revoked.Instances of taxi drivers blocking roads, throwing objects at cars, and dragging drivers out of their vehicles have also been reported. In several cases, taxis have stopped cars mistakenly assumed to be rideshares, only to realise they were private vehicles belonging to locals.A journalist visiting Cancún International Airport shared a particularly disturbing experience. While waiting for a friend to pick him up, he was approached by a taxi driver offering a ride. When the journalist declined, saying his friend was coming, the driver responded aggressively, asking, 'An Uber friend? F*k you.'**Such incidents of aggression have been captured in multiple viral videos, drawing international attention to the escalating taxi violence in Cancún. Taxi drivers agressions in Cancun (VIDEO: REFORMA) Government Crackdown and Calls for National Security InterventionFaced with rising violence and a decline in tourism, hotel owners in the Mexican Caribbean have urged Mexico's National Guard, National Migration Institute, and National Customs Agency to intervene. They fear that unless decisive action is taken, Cancún's reputation as a premier tourist destination will be permanently damaged.The Quintana Roo government has also begun discussions on legislation to regulate taxi fares and ensure tourist safety, but many worry it may be too little, too late.Until real reforms are put in place, tourists are advised to remain cautious when using local transport and to consider alternative travel options to avoid being overcharged—or worse, becoming a victim of taxi-related violence.Writer's pickWhy Are People Boycotting Coca-Cola? And 11 Other Companies Latinos Refuse To Buy FromMothers Of Children Killed By Illegal Immigrants Blast Selena Gomez's Crying Video: 'What About Our Kids?'Who Is Danette Colbert? 'Career Criminal' Known for Drugging Men Now Linked to Adan Manzano's DeathDon't Wait, Buy Now: Nine Items Americans Should Buy Before Costs Skyrocket Due to Trump Tariffs Uber Mexico© Copyright IBTimes 2025. All rights reserved.'''
