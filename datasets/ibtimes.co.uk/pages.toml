["https://ibtimes.co.uk/heres-why-average-irs-refund-tax-returns-filed-2025-32-lower-last-year-1731550"]
title = "Here's Why the Average IRS Refund for Tax Returns Filed in 2025 Is 32% Lower Than Last Year | IBTimes UK"
description = "The average US tax refund for the 2024 tax year dropped to £1,725 as of 14th February 2025 from £2,551 on the same day last year."
full_description = '''By Niloy Chakrabarti Published 28 February 2025, 11:00 PM GMT Share on Facebook Share on Twitter Share on LinkedIn Share on Reddit Share on Flipboard doFir.push(function(){var flipboard=1;jQuery(".genericon-flipboard").on('click',function(e){e.preventDefault();e.stopPropagation();if(flipboard){flipboard=0;LJ('https://cdn.flipboard.com/web/buttons/js/flbuttons.min.js',function(){jQuery(".genericon-flipboard").trigger('click')})}})}) Share on Pocket There are several changes to the standard deduction rules for US taxpayers filing returns in 2025. Nataliya Vaitkevich/Pexels.com The latest data from the US Internal Revenue Service (IRS) revealed that the average tax refund for those who have already filed their returns for the 2024 tax year was £1,725 as of 14th February 2025. This is a 32% drop from £2,551 compared to the same day last year. By Valentine's Day, the IRS had received almost 33 million individual tax returns.Tax season officially began on 27th January. That's when the IRS started processing returns for the tax year 2024. For most filers, taxes for 2024 returns are due on 15th April 2025.Despite the lower tax refunds, the IRS stated that 'historically, filing season numbers even out as more tax returns come in.'Child Tax and Earned Income Tax Credits Take Additional TimeThe latest average refund figures could be lower, given that the data doesn't include refunds linked to earned income tax credits or additional child tax credits because these refunds are generally issued after mid-February. These credits could turn tax returns into five-figure amounts, considerably increasing the average rebate.Since these tax credits take longer to process due to additional identity checks under the federal Protecting Americans from Tax Hikes Act (PATH), the IRS doesn't want taxpayers to rely on any specific date for a refund to pay bills or make large purchases. However, the agency expects refunds for these tax credits to be available to filers in their bank accounts by 3rd March. Note that federal holidays and weekends could lead to delays.A recent Intuit Credit Karma survey showed that many taxpayers rely on yearly tax refunds to make ends meet. Around 45% attribute their worrisome financial situation to high living costs due to sticky inflation. At the same time, US taxpayers also use their tax refunds to pay down debt or grow their emergency funds.However, the IRS stated that those who don't claim earned income or child tax credits and file their federal returns electronically using the direct deposit option can expect refunds in their bank accounts within 21 days.Key Tax Changes To Be Aware OfAlthough much of the tax filing process is the same as last year, filers should be aware of some key changes.The standard deduction for taxpayers filing in 2025 jumped by £318 to £11,932. For couples filing jointly, the amount increases to £23,865. The IRS adjusts these values annually based on inflation trends, which picked up again after cooling down in the latter half of 2024. The IRS also hiked the maximum Earned Income Tax Credit amount to £6,400 from £6,228.Meanwhile, due to the expansion of the Direct File program, more Americans can now file their taxes for free. The IRS expects to receive over 140 million individual returns before the April deadline.US Taxpayers can track their refunds using the 'Where's My Refund' tool on the IRS website. Filers can input your Social Security Number (SSN) or Individual Taxpayer ID Number (ITIN), select the appropriate tax year and filing status, and then enter the exact whole dollar refund amount on your return to check the refund status.Writer's pickElon Musk Mulls £3.9K DOGE Dividends for 78M Taxpayers Using Savings From Reduced Federal SpendingSocial Security Disability Dispute Times Could Worsen After Office Closures as Pending Cases Cross 270KSocial Security Confirms $1,580 Monthly Average SSDI Payments: Here's How To Speed Up the Claims Process Tax Inflation© Copyright IBTimes 2025. All rights reserved.'''
