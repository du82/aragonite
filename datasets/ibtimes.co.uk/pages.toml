["https://ibtimes.co.uk/32-year-old-built-nine-income-streams-while-working-9-5-reveals-challenges-lessons-learned-1729037"]
title = "32-Year-Old Built Nine Income Streams While Working A 9-to-5; Reveals Challenges And Lessons Learned | IBTimes UK"
description = "Investment banker turned multi-income entrepreneur Nischa shares her journey from a single 9-to-5 job to building a diverse income portfolio."
full_description = '''By Vinay Patel @VinayPBPatel Published 29 November 2024, 1:31 AM GMT Share on Facebook Share on Twitter Share on LinkedIn Share on Reddit Share on Flipboard doFir.push(function(){var flipboard=1;jQuery(".genericon-flipboard").on('click',function(e){e.preventDefault();e.stopPropagation();if(flipboard){flipboard=0;LJ('https://cdn.flipboard.com/web/buttons/js/flbuttons.min.js',function(){jQuery(".genericon-flipboard").trigger('click')})}})}) Share on Pocket Investment banker Nischa, at 32, reveals 9 income streams she built alongside her full-time job. Investment Banker Nischa Shah, who shares videos on personal finance, self-development, and business on her YouTube channel, began her journey with a single income: her 9-to-5 banking job. Like many, she believed climbing the corporate ladder was the only path to financial security. But she eventually realised this approach had its limits."Relying solely on active income is risky for two reasons," Nischa explains in her new video. "First, you're completely tied to trading your time for money, which means there's always going to be a ceiling to how much you can make. Secondly, you're putting all your eggs in one basket, hoping that a single source of income never disappears."Her solution? Building multiple income streams. With minimal upfront capital and leveraging her free time outside of her day job, she established several streams. Here's her breakdown of each one:1. YouTube AdSenseNischa's journey into additional income kicked off with YouTube AdSense. She sheds light on two crucial metrics every creator should grasp:CPM (Cost Per Mille): The amount advertisers pay for every 1,000 views. RPM (Revenue Per Mille): The earnings creators pocket after YouTube's 45% cut."For instance, one of my videos, 'How to Become Unrecognisable,' earned $594 from 86,000 views with an RPM of $6.86," Nischa explained. "In contrast, my video 'Five Side Hustles That Can Make You $1,000 a Week' generated over $1,300 with the same number of views, thanks to a higher RPM of $15.61." She underscores that content type and audience targeting are major factors influencing earnings.2. DividendsDividends are one of Nischa's most hands-off income streams. As she puts it, "When you own shares in a company, some distribute a portion of their profits back to shareholders. That's what dividends are." Rather than buying individual stocks, she prefers the simplicity of dividend funds."This way, you're diversifying your risk. If one company cuts dividends, you're still earning from others," the 32-year-old banker said.3. Community PlatformNischa recently launched a community platform that brings together like-minded individuals passionate about personal finance and self-improvement. While it's currently operating in the red, she sees immense long-term potential."I've invested in a community manager, a personal finance expert, and other resources to provide immense value to members," she shares. "Once operational costs are covered, the platform will become a sustainable revenue stream independent of other platforms."4. Active Income From AccountingDespite her foray into diverse income streams, Nischa continues her career as a chartered accountant. "This is my most active income stream since I'm only paid when I work. But I keep it going to maintain my professional credentials and expertise," she says.5. Real Estate IncomeReal estate has been a steady income stream for Nischa, growing from residential to commercial ventures. "Commercial properties, particularly in the UK, often provide steadier income streams," she notes.She also advocates for Real Estate Investment Trusts (REITs) as an alternative for those who lack the capital to invest in physical properties.6. Public SpeakingNischa's expertise in personal finance has led to lucrative speaking engagements. "I started small, speaking at free events, but each opportunity built my credibility and expanded my network. Now, I get paid opportunities, like speaking at Google and creative summits," she says.7. Affiliate MarketingNischa discovered that she was already dabbling in affiliate marketing without realising it. "Referring a friend to a credit card or bank account and earning a reward is affiliate marketing," she explains."In the content creator space, companies provide custom links, and you earn a commission when someone uses your link," she added.8. CoursesTaking full advantage of her finance expertise, Nischa created online courses, a scalable income stream with limitless potential. "What's great about courses is that they can generate income long after you've done the work," she says.She advises testing the market through pre-sales before investing time and resources into course creation.9. Real Estate Investment Trusts (REITs)Nischa recommends REITs for those without the funds to invest in physical real estate. These publicly traded stocks allow smaller investors to tap into real estate income without the hassle of direct ownership.Key TakeawaysNischa's journey demonstrates that building multiple income streams is achievable, even with a demanding full-time job. "It's about using pockets of free time and starting small," she says.Her approach balances active and passive income streams, catering to various skill sets and financial goals. By diversifying her income, she's achieved financial stability and flexibility, inspiring others to follow her path.Writer's pick8 Christmas Side Hustles That Millennials Swear By—And They're Making Over $3,000 MonthlyFormer Scientist Becomes CEO of Six-Figure Company Selling CurriesViral Social Media Video With 6.6M Views Helped Couple Land A $250,000 Clothing Deal© Copyright IBTimes 2025. All rights reserved.'''
