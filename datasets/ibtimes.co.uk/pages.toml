["https://ibtimes.co.uk/social-security-disability-dispute-times-could-worsen-after-office-closures-pending-cases-cross-1731498"]
title = "Social Security Disability Dispute Times Could Worsen After Office Closures as Pending Cases Cross 270K | IBTimes UK"
description = "The already lengthy times for appealing rejections for the Social Security Disability Insurance benefits could worsen due to systemic challenges and DOGE's decision to downsize the federal agency."
full_description = '''By Niloy Chakrabarti Published 27 February 2025, 11:51 AM GMT Share on Facebook Share on Twitter Share on LinkedIn Share on Reddit Share on Flipboard doFir.push(function(){var flipboard=1;jQuery(".genericon-flipboard").on('click',function(e){e.preventDefault();e.stopPropagation();if(flipboard){flipboard=0;LJ('https://cdn.flipboard.com/web/buttons/js/flbuttons.min.js',function(){jQuery(".genericon-flipboard").trigger('click')})}})}) Share on Pocket Social Security Disability Insurance disputes are increasing rapidly in 2025. Shutterbug75/Pixabay.com The average wait time for Social Security disability appeals is over nine months. As of January, almost 270,949 Americans were awaiting decisions on disability appeals. The Social Security Administration (SSA) hired nearly 600 Administrative Law Judges (ALJ) and 500 decision writers between 2016 and 2018 to expedite the process, which gradually reduced processing times and backlogs to a 30-year low (261,574) in September 2024.However, pending cases jumped by almost 10,000 to over 270,000 in four months, raising questions about the effectiveness of SSA's actions. The resurgence in delays can be attributed to significant system issues, which are financially affecting countless Americans relying on Social Security benefits as they are unable to work due to disabilities. Prolonged delays often translate to financial hardships for this vulnerable population and also increase the chances of exacerbating existing health issues.From Claiming To Appealing And Receiving Disability Benefits Can Stretch To Three YearsIf you claim Social Security Disability Insurance (SSDI) benefits, the initial decision can take up to 8 months. If benefits are denied in the initial stage, the reconsideration stage generally adds another seven months.O'Connor Law PLLC's Mary Ellen O'Connor told Newsweek that reconsiderations usually end in another rejection. In that case, claimants have to wait at least another year for a hearing before an ALJ. The hearing allows claimants to supply new evidence and clarify information related to their disability applications. Those who finally get approved must wait another five months before benefits are reflected in their bank accounts.She highlighted that by the time applicants receive disability benefits after years of reconsideration and hearings, many end up losing their homes, cars and health insurance, compelling them to depend on family or return to work with existing medical conditions.SSA Issues Aggravated By Trump's DOGE DownsizingThe challenges at the SSA related to appeals processing could be due to inconsistent judge rulings, the massive backlog itself, and technological hurdles with virtual hearings. Attorney shortages are also an emerging problem, given that low remuneration limits repel lawyers from working on cases that stretch for years. In turn, many claimants have to deal with the system alone, further minimising chances of approval.The SSA's staffing shortage is another big problem that affects resolution times for various services. In March 2024, former SSA Commissioner Martin O'Malley told Congress that by the end of the financial year 2024, the agency would serve 7 million more recipients with 7,000 fewer full-time staff compared to FY 2015.Furthermore, US President Donald Trump's Department of Government Efficiency (DOGE) recently ordered the General Services Administration to terminate leases on an estimated 7,500 federal offices, including several SSA offices nationwide. These actions could further prolong the lengthy wait times for processing Social Security disability appeals.Earlier this week, the SSA also announced the closure of its Office of Transformation department, which was responsible for guiding and overseeing 'enterprise-wide initiatives, addressing policies, business processes, and systems.' DOGE claims that millions of dollars were saved via SSA contract reductions, including cuts to IT support.Writer's pickSocial Security Confirms $1,580 Monthly Average SSDI Payments: Here's How To Speed Up the Claims ProcessDOGE Dividend Cheques May Give Americans $5000 Each: What Is It And How Do You Qualify For ItIRS Layoffs Amid Trump's Federal Workforce Reduction Could Delay 2025 Tax Refund Schedule© Copyright IBTimes 2025. All rights reserved.'''
