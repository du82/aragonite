["https://ice.edu/about/alumni-profiles/ashley-merriman"]
title = "Ashley Merriman | Alumni Profiles | Institute of Culinary Education"
description = "Ashley Merriman grew up in Center Sandwich, NH. After graduating from Hamilton College in New York, she came to ICE. She has spent the majority of her professional career in New York City working at Butter and Seattle at Tilth. She was the chef at Branzino in Seattle when she was a competitor on season six of Bravo’s hit TV show Top Chef. After the show, she returned to New York City and worked with Alex Guarnaschelli at Butter and The Darby before heading the kitchen at The Waverly Inn. When asked about her culinary voice, she says, “ICE helped me refine my existing skills and knowledge and introduced me to the broader culinary world in New York City.” Now she gives back to the young cooks in her kitchen, saying, “I love helping young cooks develop habits of excellence in the kitchen, teaching my cooks something new every day and watching them grow as cooks.” Ashley is currently the Co-Chef of Gabrielle Hamilton's Prune."
