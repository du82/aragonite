["https://ice.edu/campus-programs/culinary-arts"]
title = "School of Culinary Arts Program | Institute of Culinary Education"
description = "Imagine a culinary arts school classroom where you and your progress matter. You'll study the cooking skills that are valued in the culinary industry, as well as forge the personal contacts that will guide you through your journey. What’s more, our students range widely in both age and previous professional experience. Some are recent high school or college graduates, while others are current line cooks looking to refine their skills, or professionals from industries as varied as IT, medicine, publishing and beyond. This diversity is at the core of our personalized, student-focused approach to teaching."
full_description = "Your Priority Is Thriving. Ours is You. Imagine a culinary arts school classroom where you and your progress matter. You'll study the cooking skills that are valued in the culinary industry, as well as forge the personal contacts that will guide you through your journey. What’s more, our students range widely in both age and previous professional experience. Some are recent high school or college graduates, while others are current line cooks looking to refine their skills, or professionals from industries as varied as IT, medicine, publishing and beyond. This diversity is at the core of our personalized, student-focused approach to teaching. Every class in our culinary school program teaches specific skills. Beginning with basic ingredient identification, our culinary arts Chef-Instructors will help train your senses, guiding you through an incredible range of tastes and flavors, from herbs and condiments to vegetables and meats. Your evolution will continue through the development of culinary techniques such as knife skills, dry and moist heat cooking methods, sauce making, restaurant service simulations, pastry and baking and more. Over the course of the culinary arts campus programs, you'll have the opportunity to take classes with different Chef-Instructors, exposing you to a wide range of mentors with different areas of expertise. This, combined with our global curriculum and externship program, will help to provide you with a solid foundation to pursue a culinary career inside or outside the kitchen. Real-World Culinary Experience One of the things that makes ICE a top culinary arts school, is that our culinary training is grounded in classical French technique but the experience in the program is unmistakably global. Thailand, India, Japan and Italy – the techniques, ingredients and distinctive flavors of all these regions and others will be a part of your culinary arts school training. Our culinary arts campus programs are designed to take you and your creativity anywhere in the industry and abroad."
