["https://ice.edu/blog/pumpkin-soup-shot-recipe"]
title = "Eight-Ingredient Soup Shot for Fall Entertaining | Institute of Culinary Education"
description = "ICE's former Content Director, Ashley Day has also managed USA TODAY's food section and covered food and travel for The Daily Meal, Rand McNally and Hungry? City Guides. Ashley went from taste-testing frozen pizzas at the Good Housekeeping Institute to braving exotic game meat for Field & Stream, then making ramen with Morimoto and rolling sushi with Nobu for USA TODAY Eats."
full_description = "The Institute of Culinary Education hosts more than 500 special events a year at our New York campus in Brookfield Place. The department’s lead chef-instructor, Philipp Hering, develops a new hands-on menu every season for these cooking parties, corporate gatherings, birthdays and anniversaries, and team-building exercises. Chef Phil started planning the fall menu in late July by testing recipes, planning logistics and estimating costs. He draws inspiration from auditing career classes and evaluating feedback from previous events, with simplicity and deliciousness in mind. In summer, the special events kitchen experiments with imaginative and ambitious ideas that Chef Phil refines for the fall menu. “When something is a crowd favorite and people gravitate towards it, we use it on the next menu,” he says. “You have to think about the people coming in here and tone it down for a hands-on event.” After all, part of the fun of events at ICE is participation. “I throw parties here,” says Chef Phil. “New York City has every kind of restaurant for a group, but here, you’re having fun making a dish. People think there’s pressure, but we do all the prep — you have a cocktail hour and the fun part of cooking.” The perfect recipe to try at home is a pumpkin soup shot that’s part of the passed hors d’oeuvres selection. “The soup is very creamy, but surprisingly light,” says Chef Phil. “When you think of winter soups, you think heavy and filling, but it’s a light shot that gets a pancetta skewer for a little added saltiness.” ICE's former Content Director, Ashley Day has also managed USA TODAY's food section and covered food and travel for The Daily Meal, Rand McNally and Hungry? City Guides. Ashley went from taste-testing frozen pizzas at the Good Housekeeping Institute to braving exotic game meat for Field & Stream, then making ramen with Morimoto and rolling sushi with Nobu for USA TODAY Eats. ICE's former Content Director, Ashley Day has also managed USA TODAY's food section and covered food and travel for The Daily Meal, Rand McNally and Hungry? City Guides. Ashley went from taste-testing frozen pizzas at the Good Housekeeping Institute to braving exotic game meat for Field & Stream, then making ramen with Morimoto and rolling sushi with Nobu for USA TODAY Eats."
