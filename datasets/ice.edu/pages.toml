["https://ice.edu/about/faculty-profiles/joshua-resnick"]
title = "Joshua Resnick | Institute of Culinary Education"
description = "Chef Joshua Resnick graduated first in class from the International Culinary Center (ICC) in 2013 and later worked as a culinary instructor from 2019 until the school closed in 2020.&nbsp"
full_description = "Chef Joshua Resnick graduated first in class from the International Culinary Center (ICC) in 2013 and later worked as a culinary instructor from 2019 until the school closed in 2020. In between his time with ICC, Joshua started his career with stints as a line cook at Gramercy Tavern, Abbey Restaurant Group and the White Gold Butchers, working his way up to sous chef with Viejo Group. As sous chef, he opened both Tokyo Record Bar and Air's Champagne Parlor alongside Chef Zachary Fabian and co-created and executed eight-course tasting menus nightly at Tokyo Record Bar, while also preparing hot food items for Air's Champagne Parlor. Chef Joshua excels in classic and French culinary techniques, ranging from basic knife skills and kitchen maintenance to food preservation and charcuterie. He began teaching Culinary Arts career training and recreational cooking classes at ICE in 2021. For over five decades, the Institute of Culinary Education has been a leader in culinary and hospitality education. Let us help you find your culinary voice. ICE is accredited by ACCSC and licensed by BPPE (in CA) and BPSS (in NY), and is not regulated in TX under Chapter 132 of the Texas Education Code. Terms of UsePrivacy PolicyDMCA PolicyJoin the ICE TeamApplicant Privacy StatementNY Career Catalog & BrochureLA Career Catalog & BrochureLA Annual Report and School Performance Fact Sheets Bureau for Private and Postsecondary Education (BPPE) Higher Education Emergency Relief FundNondiscrimination Statement & Title IX PolicyHigher Education Consumer Information Disclosures"
