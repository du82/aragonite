title = "Pastry & Baking Arts Program | NY & LA | Institute of Culinary Education"
description = "Drawing from the pastry arts training and baking arts traditions of France, Italy, Austria and Switzerland, as well as contemporary American variations, our Pastry & Baking Arts program is both international in scope and constantly evolving with modern global influences. Our award-winning curriculum has been shaped by Nick Malgieri, renowned pastry chef and author of 12 cookbooks, as well as Chef Michael Laiskonis, former Executive Pastry Chef at three-Michelin-starred Le Bernardin and winner of the prestigious James Beard Award for Outstanding Pastry Chef."
full_description = "Old World, New World and the Whole World Drawing from the pastry arts training and baking arts traditions of France, Italy, Austria and Switzerland, as well as contemporary American variations, our Pastry & Baking Arts program is both international in scope and constantly evolving with modern global influences. Our award-winning curriculum has been shaped by Nick Malgieri, renowned pastry chef and author of 12 cookbooks, as well as Chef Michael Laiskonis, former Executive Pastry Chef at three-Michelin-starred Le Bernardin and winner of the prestigious James Beard Award for Outstanding Pastry Chef. Culinary Skills that Will Last a Lifetime Pastry and baking combines art and technique unlike any other field of the food industry. Your hands-on education starts with our chef-instructors, who will guide you through the crucial components of this craft and lead you on the path to becoming an accomplished professional. You'll cover a wide range of pastries and breads, including flaky croissants and crusty sourdough, beginning with an exploration and tasting of ingredients to study how flavors and textures combine. Instructors cover a wide range of dough-based products, from strudels and tarts to puff pastries. Our bread curriculum, designed by Chef Sim Cass, the founding baker of Keith McNally’s Balthazar Bakery, will teach you to prepare yeast-raised classics like bagels, brioche, pizza and baguettes. With a strong emphasis on theory, our baking arts and pastry arts curriculum will teach you the essential techniques of cakes and chocolate, highlighting the key ratios and methods that allow you to go beyond recipes and produce unique creations. You'll practice decorating cakes by hand until inscriptions and piping become second nature. Ultimately, students have the opportunity to apply these skills to design and produce a tiered cake of their own creation. Chocolate confections are also part of the curriculum, from the simple truffle to intricate showpieces. What's more, Pastry & Baking Arts students in New York have access to the ICE Chocolate Lab, where they can learn more about the bean-to-bar process of chocolate production."
