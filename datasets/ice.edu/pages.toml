["https://ice.edu/about/faculty-profiles/mishel-ledoux"]
title = "Michel LeDoux | Faculty Profiles | Los Angeles Campus | ICE"
description = "Michel LeDoux is the Director of Hospitality and Restaurant Management at the Institute of Culinary Education (ICE) in Los Angeles."
full_description = 'ICE Chefs and Deans of Restaurant & Hospitality Management Predict Food and Dining Trends for 2021Dec. 28, 2020 "I want to teach students how to create and deliver a great dining experience while operating and growing a profitable business." Mishel LeDoux has worked in the hospitality industry and delivered exceptional service at fine-dining restaurants across California for more than a decade. After studying at San José State University, Mishel began her career in hospitality public relations, opening and branding restaurants in Northern California, before becoming the special events manager and publicist for Wolfgang Puck’s Spago in Palo Alto, California. In 2005, she moved to Southern California to serve as the general manager of Wolfgang Puck Grand Café in Orange, and later worked for eight years as the general manager of Wolfgang Puck’s Michelin-starred restaurant CUT at the Four Seasons Beverly Wilshire in Beverly Hills. After her time with Wolfgang Puck, she served as the general manager of The Bazaar by José Andrés at the SLS Hotel in Los Angeles. Under the leadership of two renowned chefs, Mishel learned the dynamics of delivering the highest level of service, while instilling in guests a desire to consistently return to the restaurant. She carries through this philosophy at all times, teaching staff to create memorable moments for each guest and understanding every aspect of the restaurant. As the general manager, she knows how to take care of each guest, immediately setting them at ease with her warm personality. “I strove daily to ensure each guest [felt] special and at home, whether for a business lunch or family dinner,” Mishel says. For over five decades, the Institute of Culinary Education has been a leader in culinary and hospitality education. Let us help you find your culinary voice. ICE is accredited by ACCSC and licensed by BPPE (in CA) and BPSS (in NY), and is not regulated in TX under Chapter 132 of the Texas Education Code. Terms of UsePrivacy PolicyDMCA PolicyJoin the ICE TeamApplicant Privacy StatementNY Career Catalog & BrochureLA Career Catalog & BrochureLA Annual Report and School Performance Fact Sheets Bureau for Private and Postsecondary Education (BPPE) Higher Education Emergency Relief FundNondiscrimination Statement & Title IX PolicyHigher Education Consumer Information Disclosures'
