["https://ice.edu/about/alumni-profiles/Ann-Redding"]
title = "Ann Redding | Institute of Culinary Education"
description = '''Chef Ann Redding is a celebrated chef renowned for her innovative approach to Thai cuisine. Born in Thailand and raised in the United States, her culinary journey began at her grandmother's produce stall in the vibrant markets of Ubon. This early exposure fostered a deep understanding of food and hospitality.After formal training at ICE, Redding honed her skills at acclaimed establishments such as Amuse, Jewel Bako, La Esquina and Per Se. Her time at Per Se proved transformative, not only refining her culinary technique but also leading to a pivotal meeting with Matt Danzer, who would become her husband and partner in their culinary endeavors.Inspired by their extensive travels in Thailand, the couple embarked on a mission to blend traditional Thai flavors with Western culinary techniques. In 2013, they opened Uncle Boon's, their flagship restaurant in New York City.Uncle Boon's garnered critical acclaim for its vibrant, authentic fare, and was awarded its first Michelin star in 2015. (Chef Redding has since received numerous James Beard Award nominations, including Outstanding Chef in 2020 and Best Chef nods from 2017 to 2020.)The couple expanded their portfolio with Mr. Donahue's, a diner-concept that received a "New York Times Critics Pick" from Pete Wells. While Mr. Donahue's enjoyed success, the popularity of Uncle Boon's led the restaurateurs to transform the space into Uncle Boon's Sister, a dedicated takeout window.Unfortunately, the COVID-19 pandemic necessitated the closure of both Uncle Boon's concepts. However, Chef Redding and Danzer, dubbed "The New Guard of New York Dining" by Eater, quickly pivoted, opening "Thai Diner" in early 2020.Thai Diner has since become a beloved staple of the Lower Manhattan culinary scene, earning Bib Gourmand status in the Michelin Guide and receiving rave reviews from publications including The New Yorker, Eater and The New York Times Magazine, with the Times naming Thai Diner’s coconut sundae one of "The 25 Essential Dishes to Eat in New York City."'''
full_description = '''Born in Thailand and raised in the United States, her culinary journey began at her grandmother's produce stall in the vibrant markets of Ubon. This early exposure fostered a deep understanding of food and hospitality. After formal training at ICE, Redding honed her skills at acclaimed establishments such as Amuse, Jewel Bako, La Esquina and Per Se. Her time at Per Se proved transformative, not only refining her culinary technique but also leading to a pivotal meeting with Matt Danzer, who would become her husband and partner in their culinary endeavors. Inspired by their extensive travels in Thailand, the couple embarked on a mission to blend traditional Thai flavors with Western culinary techniques. In 2013, they opened Uncle Boon's, their flagship restaurant in New York City. Uncle Boon's garnered critical acclaim for its vibrant, authentic fare, and was awarded its first Michelin star in 2015. (Chef Redding has since received numerous James Beard Award nominations, including Outstanding Chef in 2020 and Best Chef nods from 2017 to 2020.) The couple expanded their portfolio with Mr. Donahue's, a diner-concept that received a "New York Times Critics Pick" from Pete Wells. While Mr. Donahue's enjoyed success, the popularity of Uncle Boon's led the restaurateurs to transform the space into Uncle Boon's Sister, a dedicated takeout window. Unfortunately, the COVID-19 pandemic necessitated the closure of both Uncle Boon's concepts. However, Chef Redding and Danzer, dubbed "The New Guard of New York Dining" by Eater, quickly pivoted, opening "Thai Diner" in early 2020. Thai Diner has since become a beloved staple of the Lower Manhattan culinary scene, earning Bib Gourmand status in the Michelin Guide and receiving rave reviews from publications including The New Yorker, Eater and The New York Times Magazine, with the Times naming Thai Diner’s coconut sundae one of "The 25 Essential Dishes to Eat in New York City." For over five decades, the Institute of Culinary Education has been a leader in culinary and hospitality education. Let us help you find your culinary voice.'''
