["https://ice.edu/blog/nyc-restaurants-serving-traditional-lunar-new-year-foods"]
title = "Celebrate Lunar New Year at These NYC Restaurants with Special Menus | ICE"
description = "Mahira Rivers is a James Beard Foundation-nominated freelance food writer and restaurant critic based in New York City. Her writing has appeared in publications like The New York Times, New York Magazine, Food & Wine and Eater. Prior to freelancing, she worked as an anonymous inspector for the Michelin Guides North America where she dined out nine times a week across the country in search of the finest cuisine. She currently writes the newsletter Sweet City, dedicated to discovering the best desserts in New York City."
full_description = "Attention East Asian food fans: Celebrate Lunar New Year with traditional flavors at these NYC spots. The Institute of Culinary Education's campuses are located in New York City and Los Angeles, two culinary capitals of the world. In order to deepen our students' understanding, we create comprehensive guides surrounding the culinary industries in these cities. Though this guide was created with culinary students in mind, it's a resource for anyone seeking restaurants serving Lunar New Year foods in New York. So enjoy — tag us on Instagram if you dine at one of these recommendations. Happy Lunar New Year! If you thought the festivities and revelry of the new year were over, we have some good news for you: Millions of people around the world are preparing for another round of celebrations to honor the Lunar New Year. For many East Asian cultures, Lunar New Year is a time to say goodbye to the year prior and usher in a fresh start. This year – the year of the wood snake, according to the Chinese zodiac – the biggest single day of jubilation within the two week-long celebration falls on January 29. For many, the festivities in New York’s Chinatown define the holiday, owing to gregarious lion dances and pebble-sized firecrackers that slap the streets with a rat-tat-tat sound. Lunar New Year, however, is celebrated throughout East Asia, and countries from China to South Korea to Malaysia mark it with observances and ceremonies unique to their culture. Still, there is one universal belief that permeates all Lunar New Year celebrations: Food is central to the festivities. Food not only brings people together, it symbolizes a prosperous and healthy year ahead. For those living in NYC, the city’s panoply of global cuisines makes finding traditional Lunar New Year dishes from a variety of cultures easy. Here are 10 NYC restaurants serving celebratory Lunar New Year menus. The best Lunar New Year celebration calls for a table full of food and a big gathering of friends and family. Pinch Chinese in Soho is a longtime favorite for their Peking duck set menu, which is perfect for a crowd. Pinch is also offering a special menu for Lunar New Year from January 25 to February 2, which will include dishes like black garlic tiger shrimp and lucky year rice cakes. The restaurant’s wine program, led by award-winning wine director Miguel de Leon, is known for its high-quality list and excellent food-friendly pairings. Note: all orders for the Peking duck must be placed 72 hours in advance via email. Make reservations on Resy."
