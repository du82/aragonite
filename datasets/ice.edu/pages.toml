["https://ice.edu/about/faculty-profiles/maya-aldy-fletcher"]
title = "Maya Aldy-Fletcher | Institute of Culinary Education"
description = "Maya Aldy-Fletcher studied at Northeastern University in Boston before receiving her culinary diploma from the French Culinary Institute in New York City, where she was trained in classical French cuisine. She launched her culinary career at Bouley by David Bouley in New York City, followed by working as a chef at Hu'u Restaurant and Bar and P.T. Lotus Food distribution, both in Bali. In 2011, she opened up her own restaurant, PT. GMP in Jakarta, Indonesia, which she ran for five years.Since moving back to the United States, Chef Aldy-Fletcher has trained as a health coach at the the Institute for Integrative Nutrition and has worked as an independent food and beverage consultant. She's passionate about cooking with a nutrition-forward approach to create delicious dishes that fit into a balanced lifestyle.Chef Aldy-Fletcher has been at ICE since 2021."
