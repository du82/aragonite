["https://ice.edu/career-services-resources/career-services"]
title = "Career Services and Resources | Institute of Culinary Education"
description = "Our on-campus and online programs in Culinary Arts, Plant-Based Culinary Arts, Pastry & Baking Arts and Hospitality & Hotel Management put your training into practice with an externship in the field. This is an opportunity to tailor your education to your personal interests and career goals. Students spend about 200 hands-on hours at the industry’s most acclaimed restaurants, hotels, catering companies, pastry shops and corporate food service venues. In the past few years, ICE placed thousands of externs in hundreds of establishments, providing a range of work experiences as diverse as our student body."
full_description = "Externships Our on-campus and online programs in Culinary Arts, Plant-Based Culinary Arts, Pastry & Baking Arts and Hospitality & Hotel Management put your training into practice with an externship in the field. This is an opportunity to tailor your education to your personal interests and career goals. Students spend about 200 hands-on hours at the industry’s most acclaimed restaurants, hotels, catering companies, pastry shops and corporate food service venues. In the past few years, ICE placed thousands of externs in hundreds of establishments, providing a range of work experiences as diverse as our student body.Discover the chefs and hospitality pros who regularly accept ICE externs Job Placement & Career Services We're proud to present a wide range of job opportunities from our community for each ICE graduate. Upon graduation, you can start receiving our weekly alumni email newsletter with job opportunities that have been curated by our Career Services team. You’ll also be invited to our Career Fairs in which we invite employers to campus to meet our students and alumni.Learn more ICE's career resources and job placement opportunities"
