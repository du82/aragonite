["https://ice.edu/about/alumni-profiles/amy-falbaum"]
title = "Amy Falbaum | Institute of Culinary Education"
description = "Amy Falbaum operates one of the most prestigious and successful recruiting companies in the hospitality industry, Amy Falbaum & Associates. Her firm searches and places exceptional talent for senior positions in the most prominent restaurants, hotels, and good and services companies, both in the U.S. and abroad. Amy and her team's knowledge of the industry as an insider and her ability to “speak its language” have garnered lasting relationships with companies. Amy's clients appreciate her depth of experience, as well as her Midwest approachability, earnestness, and authenticity. Her clients come to see her as one of their own and know Amy will have the right focus on advancing their desired culture and fulfilling their hiring interests. In addition to several notable achievements on the frontlines, Amy has served the industry as an executive manager for the kitchen at the ’21′ Club, as well as top managerial positions at Sarabeth’s Kitchen, American Renaissance, and Gramercy Tavern. She is a part-time instructor at the Institute of Culinary Education in its Culinary Management program. She has a bachelor of arts degree from Hunter College and is a graduate of the American Academy of Dramatic Arts."
