["https://ice.edu/about/alumni-profiles/Nate-Wood"]
title = "Dr. Nate Wood | Institute of Culinary Education"
description = "Dr. Nate Wood, a leading figure in the emerging field of culinary medicine, seamlessly blends his passions for medicine, food, teaching and media. As an Instructor of Medicine and the inaugural Director of Culinary Medicine at Yale School of Medicine and the Irving and Alice Brown Teaching Kitchen at Yale New Haven Health, he empowers people to enjoy food in a healthy way.A board-certified internal medicine and obesity medicine physician, Dr. Wood practices primary care at both the hospital and clinic levels. Beyond patient care, he actively engages in medical education, community outreach and research initiatives focused on healthy cooking and eating. His expertise extends to mentoring a diverse range of healthcare professionals and trainees, including residents, medical students, physician associate students, nurses and practicing physicians.Dr. Wood's research supports the development, implementation, and testing of innovative culinary medicine curricula. His scholarly contributions have been recognized in prestigious medical journals such as the New England Journal of Medicine, Journal of General Internal Medicine and Arthritis & Rheumatology.Inspired by his grandfathers, both of whom were professional cooks, and captivated by the Food Network while waylaid with an injury, marrying food and health was a fitting professional path for the now Dr. Wood. While pursuing a medical degree at Wayne State University, however, he realized he needed a food credential equivalent to his MD. He thus took a year off from medical school to enroll in ICE’s Culinary Arts program. This decision allowed him to hone his culinary skills and gain valuable experience at renowned establishments like the two-Michelin-star restaurant, The Modern.After completing his culinary training, Dr. Wood returned to Wayne State to finish his medical degree and subsequently earned a Master of Health Science at Yale. His stated goal is to revolutionize healthcare through culinary medicine, leveraging interactive nutrition and cooking instruction to prevent and manage diseases. Read More about Alumni Dr. Nate Wood on the ICE Blog"
full_description = "Dr. Nate Wood, a leading figure in the emerging field of culinary medicine, seamlessly blends his passions for medicine, food, teaching and media. As an Instructor of Medicine and the inaugural Director of Culinary Medicine at Yale School of Medicine and the Irving and Alice Brown Teaching Kitchen at Yale New Haven Health, he empowers people to enjoy food in a healthy way. A board-certified internal medicine and obesity medicine physician, Dr. Wood practices primary care at both the hospital and clinic levels. Beyond patient care, he actively engages in medical education, community outreach and research initiatives focused on healthy cooking and eating. His expertise extends to mentoring a diverse range of healthcare professionals and trainees, including residents, medical students, physician associate students, nurses and practicing physicians. Dr. Wood's research supports the development, implementation, and testing of innovative culinary medicine curricula. His scholarly contributions have been recognized in prestigious medical journals such as the New England Journal of Medicine, Journal of General Internal Medicine and Arthritis & Rheumatology. Inspired by his grandfathers, both of whom were professional cooks, and captivated by the Food Network while waylaid with an injury, marrying food and health was a fitting professional path for the now Dr. Wood. While pursuing a medical degree at Wayne State University, however, he realized he needed a food credential equivalent to his MD. He thus took a year off from medical school to enroll in ICE’s Culinary Arts program. This decision allowed him to hone his culinary skills and gain valuable experience at renowned establishments like the two-Michelin-star restaurant, The Modern. After completing his culinary training, Dr. Wood returned to Wayne State to finish his medical degree and subsequently earned a Master of Health Science at Yale. His stated goal is to revolutionize healthcare through culinary medicine, leveraging interactive nutrition and cooking instruction to prevent and manage diseases."
