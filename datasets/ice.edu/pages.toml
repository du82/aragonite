["https://ice.edu/about/faculty-profiles/jordan-heissenberger"]
title = "Jordan Heissenberger | Institute of Culinary Education"
description = "Jordan Heissenberger moved to New York City from Buffalo, NY to trail in restaurants and attend The French Culinary Institute's Italian program. From there, he traveled to Italy and studied at ALMA The International School of Italian Cuisine, in Colorno, Italy. After completing an externship at Onice, a gastronomic restaurant in Florence, Chef Jordan returned to New York City. Chef Jordan has worked at various restaurants in the city including Rucola, Buvette, Walter's (and its speakeasy Karasu), and Apollonia, and ascended to the position of Executive Chef.Chef Jordan began teaching recreational classes at ICE in 2024."
