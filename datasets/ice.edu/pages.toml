["https://ice.edu/about/alumni-profiles/beth-collins"]
title = "Beth Collins | Alumni Profiles | Institute of Culinary Education"
description = "For over ten years, Beth Collins has focused on feeding children healthy food at school. She owns Local Plates LLC., a consulting business based in Traverse City that which offers food service solutions that result in healthier food served in schools. Collins morphed from professional chef to lunch lady when, in 2000, she moved from the kitchens of the fine dining world in New York City to the Ross School in East Hampton, NY. She has also worked with the Berkeley Unified School District in California as part of the tactical support team funded by the Chez Panisse Foundation. In 2007 and 2008, she directed school food service reform for the Grand Traverse Area Catholic Schools in Traverse City. She is also behind the pioneering efforts of Lunch Lessons."
