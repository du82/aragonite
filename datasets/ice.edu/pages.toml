["https://ice.edu/about/faculty-profiles/herve-guillard"]
title = "Herve Guillard | Faculty Profiles | Los Angeles Campus | ICE"
description = "Herve Guillard is the Lead Chef-Instructor in Pastry Arts at the Institute of Culinary Education in Los Angeles."
full_description = '''"Never leave the classroom with an unclear mind: reflect on your successes and challenges every day." Teaching and cooking are Chef Herve Guillard's passions and run in his family. Chef Guillard's parents owned a bakery in Saint Florent Le Vieil, France, and this was where he learned and perfected his baking and pastry skills, starting at a young age. In his 20s, Chef Guillard had a non-culinary chapter, earning a master's degree in toxicology, which led to safety engineering positions at Disneyland Paris and Walt Disney Animation Studios. In 1995, he moved to the United States to operate his own business as a private chef, and in 2000, began teaching culinary and pastry arts at Le Cordon Bleu in Los Angeles. Chef Guillard returned to operating his own business, Culinary Wonders - Cooking Studio, full time in 2011, but his love of teaching never left. He started instructing culinary classes at the College of the Canyons in Santa Clarita, California in 2013, then became department lead at the University of Antelope Valley in Lancaster, California, in 2016. He joined the opening team at ICE's Los Angeles campus in 2018 and is very excited at the prospect of delivering education in an environment dedicated to high standards of excellence and student success. For over five decades, the Institute of Culinary Education has been a leader in culinary and hospitality education. Let us help you find your culinary voice. ICE is accredited by ACCSC and licensed by BPPE (in CA) and BPSS (in NY), and is not regulated in TX under Chapter 132 of the Texas Education Code. Terms of UsePrivacy PolicyDMCA PolicyJoin the ICE TeamApplicant Privacy StatementNY Career Catalog & BrochureLA Career Catalog & BrochureLA Annual Report and School Performance Fact Sheets Bureau for Private and Postsecondary Education (BPPE) Higher Education Emergency Relief FundNondiscrimination Statement & Title IX PolicyHigher Education Consumer Information Disclosures'''
