["https://ice.edu/blog/meet-emerson-majano"]
title = "ICE LA Alum Emerson Majano's Unexpected Career | Institute of Culinary Education"
description = "Hillery Wheeler Hargadine has been with ICE since 2009. A graduate of ICE’s Restaurant and Culinary Management program, she was a member of the school's Admissions team — helping students to fulfill their dreams of receiving a culinary education — for ten years. Today, she works on messaging and content, authoring student profiles and supporting marketing communications. Hillery currently lives in Toyko, Japan with her husband and son, and eats as much sushi and ramen as possible."
full_description = '''A visitor to the Surfas Culinary District website is greeted with a “new products page” that includes things like Hotaru matcha milk jam and a professional-grade stainless steel soda siphon. While the average culinary enthusiast is welcome to shop the store, which describes itself as a “chef’s paradise,” the depot and cafe sections are designed to bring everything a professional chef or restaurateur needs under one roof. Answering the needs and wishes of these chefs is Emerson Majano, a graduate of the Institute of Culinary Education Los Angeles. The food and beverage industry is full of interesting and usual jobs the average person never considers when they think about embarking on a culinary career, including Chef Emerson. After winning the C-CAP scholarship to ICE’s Health-Supportive Culinary Arts program (now Plant-Based Culinary Arts), Chef Emerson was thrilled to land an externship at the exclusive Jonathan Club in downtown Los Angeles. “It was an amazing experience because I got to see [techniques and] ingredients I didn't know existed, and put into practice what I learned in culinary school,” Chef Emerson says. Chef Emerson's full title at Suras Culinary District is Sales Rep, Chef Consultant and Chef Assistant. But long before he was helping LA chefs find obscure molecular gastronomy ingredients or specialty equipment, he was a little boy in Honduras learning to cook — in secret. “My dad didn't want me to cook,” Chef Emerson says. “He told me ‘You shouldn't be in the kitchen, that's a woman's thing. You should do something that a man does.’” “My grandma got so mad," he says. "She said, ‘Your dad is wrong, it’s not only women who cook.’” His grandmother was committed to making sure her grandson understood the opportunities that existed for men who were interested in cooking. At the time, "MasterChef USA" was airing in Honduras with a Spanish translation. “My grandmother said, ‘We’re going to watch this show so you can see all these men cooking,” he says.'''
year_published = 2024
