["https://ice.edu/about/faculty-profiles/eric-rowse"]
title = "Eric Rowse | Institute of Culinary Education"
description = "Chef Eric Rowse has more than 15 years of professional cooking experience, nine of them in managerial positions. A fan of wood-fired cooking, pasta making and bread baking, Chef Eric feels at home teaching. He has served as chef de cuisine at Paul Ragan’s Altaeats, executive chef at Packing House Wines, a 90-seat wine bar and retail shop, and executive chef at Barcito in downtown LA. He loves teaching students how to provide an exceptional guest experience using creativity and over-the-top hospitality.Chef Eric joined the Institute of Culinary Education’s culinary arts department in 2021."
full_description = '"How far you go in the industry is one-hundred percent determined by how much heart you have, how much you pay attention, how much you practice and your own self-dedication.” Chef Eric Rowse has more than 15 years of professional cooking experience, nine of them in managerial positions. A fan of wood-fired cooking, pasta making and bread baking, Chef Eric feels at home teaching. He has served as chef de cuisine at Paul Ragan’s Altaeats, executive chef at Packing House Wines, a 90-seat wine bar and retail shop, and executive chef at Barcito in downtown LA. He loves teaching students how to provide an exceptional guest experience using creativity and over-the-top hospitality. For over five decades, the Institute of Culinary Education has been a leader in culinary and hospitality education. Let us help you find your culinary voice. ICE is accredited by ACCSC and licensed by BPPE (in CA) and BPSS (in NY), and is not regulated in TX under Chapter 132 of the Texas Education Code. Terms of UsePrivacy PolicyDMCA PolicyJoin the ICE TeamApplicant Privacy StatementNY Career Catalog & BrochureLA Career Catalog & BrochureLA Annual Report and School Performance Fact Sheets Bureau for Private and Postsecondary Education (BPPE) Higher Education Emergency Relief FundNondiscrimination Statement & Title IX PolicyHigher Education Consumer Information Disclosures'
