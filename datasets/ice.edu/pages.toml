["https://ice.edu/about/alumni-profiles/Ju-Sung-Bobby-Yoon"]
title = 'Ju Sung "Bobby" Yoon | Institute of Culinary Education'
description = "Bobby Yoon brought a taste of his family's Korean barbecue to New York City when he opened Yoon Haeundae Galbi in 2018. (The restaurant is inspired by his grandfather's esteemed restaurant in Busan, South Korea – Haeundae Somunnan Amso Galbijip – which was established in 1964.) Prior to opening Yoon Haeundae Galbi, the culinary innovator and restaurateur honed his skills at renowned New York City establishments like Danji and O Ya.In the seven years since its opening, Yoon Haeundae Galbi has garnered critical acclaim, solidifying its place as a top destination for Korean barbecue in NYC. In 2023, the New York Times' Pete Wells recognized the restaurant's exceptional quality, ranking it among the city's “100 Best Restaurants” in the inaugural 2023 list and again in 2024. This recognition, coupled with consistent praise from respected industry publications like Eater, The Infatuation and TimeOut, highlights Yoon's dedication to preserving authentic Korean culinary traditions while delivering an exceptional dining experience.Yoon's innovative approach, particularly his meticulous application of his grandfather's unique meat-cutting technique, sets Yoon Haeundae Galbi apart. The restaurant's intimate design and focus on high-quality ingredients – from signature short ribs and flavorful banchan to an acclaimed seafood tteokbokki – have contributed significantly to the vibrant and diverse culinary landscape of New York City."
