["https://ice.edu/blog/meet-steven-gao"]
title = "How ICE Grad Steven Gao's Daily Life Earned Him 300k Followers | Institute of Culinary Education"
description = "Sean is a freelance writer at the Institute of Culinary Education (ICE), combining his passion for food with his storytelling expertise. An outdoor enthusiast interested in adventure writing, he enjoys exploring new recipes, visiting local markets and experiencing culinary diversity in New York City."
full_description = "A recent Institute of Culinary Education graduate gained over 300,000 Instagram followers in less than a year — simply by posting about his day-to-day life. From learning how to chop an onion with Gordon Ramsey to exploring NYC’s ramen scene, social media is filled with culinary content. A popular trend, especially on TikTok, is “day-in-the-life” videos, offering an inside look into various professions, including what it takes to become a professional chef. Steven Gao, known as @StevenMotoCooks on TikTok and Instagram, seized the opportunity when he enrolled at the Institute of Culinary Education's New York City campus in 2023. Chef Steven graduated from Rutgers University in 2023 with a degree in computer science/graphic design. When reflecting back on his college experience, Chef Steven realized that his happiest memories were when he was cooking for his friends. “While I enjoyed my classes, I didn’t want to work in graphic design,” Chef Steven says. “I loved making memories with friends while cooking. Even though I wasn’t a strong cook, I wanted to keep creating those happy moments.” This desire led him to consider, and then enroll, in culinary school. He joined ICE's Culinary Arts program for the 2023/2024 term. Once he started class, Chef Steven quickly realized that the hands-on instructional content was perfect for recording. Many students already take out their phones to document complex cuts and slices, so he decided to take his videos a step further. Drawing from his experience creating volleyball training videos in college, Chef Steven began documenting his culinary school journey with quick cuts and voiceovers to keep viewers engaged. His content aimed to introduce people to the world of cooking and provide a glimpse into culinary school life. But the process also helped him learn more, as he reviewed and researched the topics for his videos, reinforcing what he learned in class. “Depending on the topic, I’d research the history of a technique taught in class to ensure accuracy,” Chef Steven says. “Making the roux videos was particularly fun because I was deepening my understanding, which made the videos more informative.”"
year_published = 2024
