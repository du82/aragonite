["https://ice.edu/about/alumni-profiles/Kerry-Brodie"]
title = "Kerry Brodie | Institute of Culinary Education"
description = "Kerry Brodie is a culinary entrepreneur and social advocate whose work at the intersection of food and refugee empowerment has garnered widespread recognition. As the founder and Executive Director of Emma’s Torch, Kerry uses the power of culinary education to uplift refugees, asylees, and survivors of human trafficking. Established in 2016, Emma’s Torch offers in-depth culinary training, employability skills, and empowerment programs, all designed to help displaced individuals integrate into their new communities. With cafes in Brooklyn and Washington, DC, the organization provides a platform for refugees to showcase their culinary traditions while gaining invaluable work experience.Kerry's background is steeped in both culinary passion and a deep commitment to social justice. After graduating from Princeton she developed her business skills in the consulting field before focusing her efforts on social justice at the Human Rights Campaign. As the concept for what would become Emma’s Torch began to take hold, Kerry pursued applicable education for the task at had, completing ICE’s Culinary Arts program and earning a Master’s in Government from Johns Hopkins University. Inspired by her Jewish heritage and motivated by the legacy of immigrant resilience in her own family, Kerry founded Emma’s Torch as a way to channel her privilege and resources to support those rebuilding their lives.Kerry’s work has garnered significant accolades, including recognition on CNN Heroes, The Forward 50, and City & State’s 40 Under 40. In addition, Kerry and Emma’s Torch have been featured in such publications as Forbes, Glamour and The New York Times and many more. The Pulitzer Center also released a short film about Emma’s Torch entitled “A Table for All.”Kerry’s vision for Emma’s Torch not only empowers refugees through culinary education but also ensures they are equipped with the tools to achieve long-term financial independence. Through her leadership, Kerry continues to prove that food can be a powerful force for change, and she is making an indelible impact on the lives of many who need it most."
