title = "Homestays | ICE Admissions | Institute of Culinary Education"
description = "Learn about our housing options at the Institute of Culinary Education! ICE is one of the top culinary arts schools in America and has locations in NYC & LA. Find your culinary voice today!"
full_description = "Host families are resources for local knowledge and can make your stay a cultured and enriching experience. The furnished homestay option is for students who want to be immersed in the culture of New York City or Los Angeles by staying with a local resident. This is an ideal option for those who are on a budget or looking for a family-style stay (and not always the best option for those who are more independent or free-spirited). In the application form, students are invited to state their preferred location, family dynamic (with or without children), dietary restrictions, allergies, etc., so that a third party can match your preferences to a host family. However, we cannot guarantee that all preferences can be met. Through the homestay program, lifelong friendships can be created. If you’re new to NYC or LA and want trustworthy guidance in your experience, this could be the right option for you. Submit your ICE Student Housing Form to get startedNY: ICE Student Housing FormLA: ICE Student Housing Form For more information about culinary school homestays and other student housing options in New York, please contact (888) 986-CHEF or NYhousing@ice.edu. For more information about culinary school homestays and other student housing program in Los Angeles, please contact (888) 709-CHEF or LAhousing@ice.edu. Homestays are not offered by ICE but are provided by independent third parties. Before you submit your Institute of Culinary Education Student Housing Form, please review the Housing Disclaimer . For over five decades, the Institute of Culinary Education has been a leader in culinary and hospitality education. Let us help you find your culinary voice. ICE is accredited by ACCSC and licensed by BPPE (in CA) and BPSS (in NY), and is not regulated in TX under Chapter 132 of the Texas Education Code. Terms of UsePrivacy PolicyDMCA PolicyJoin the ICE TeamApplicant Privacy StatementNY Career Catalog & BrochureLA Career Catalog & BrochureLA Annual Report