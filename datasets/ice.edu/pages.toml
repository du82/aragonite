["https://ice.edu/about/events/host-your-event"]
title = "Host Your Event | Special Events & Cooking Classes | NY Campus | ICE"
description = "For more information on cooking classes or hosting an event, click below to submit a request form, call the Special Events department directly at (800) 543-8834 or email Diana Allan at specialevents@ice.edu. Please note: cooking events are only available on ICE's New York campus.Start Planning Your Event"
full_description = "Chef Phil's Summer Salmon Recipe /sites/default/files/styles/width_400/public/content/blog-article/image/salmon%20promo.jpg.webp?itok=-KiJdFbw 05.24.19Recipes Eight-Ingredient Soup Shot for Fall Entertaining /sites/default/files/styles/width_400/public/content/blog-article/image/pumpkin-soup-9.27.18-17-900x900.jpg.webp?itok=2bT5ilzb 09.25.18Recipes Our hands-on cooking events at our ICE New York campus are perfect for corporate entertaining, team building, closing dinners, press events and product launches, or for personal celebrations such as birthdays, anniversary parties, bridal showers, rehearsal dinners or special reunions. Combining the best elements of a cocktail party, a cooking class and your favorite restaurant, ICE cooking parties and group cooking events are an easy, seamless choice when you want to celebrate or entertain. A typical event is approximately 3.5 hours and begins with a 30- to 45-minute reception featuring passed hors d’oeuvres or a tasting table. After your guests enjoy some light bites with a drink from the bar, our highly trained chefs will invite your group to put on aprons and hats for the cooking portion of the event. We'll put your guests to work while they learn skills, tips and techniques in a fun, interactive environment. The memorable and delectable activities culminate in an hour-long private dining experience. ICE's signature hospitality will leave your guests with a lasting impression — we’ll even do the dishes! Speak with our event planner. For more information on cooking classes or hosting an event, click below to submit a request form, call the Special Events department directly at (800) 543-8834 or email Diana Allan at specialevents@ice.edu. Please note: cooking events are only available on ICE's New York campus. For over five decades, the Institute of Culinary Education has been a leader in culinary and hospitality education. Let us help you find your culinary voice. ICE is accredited by ACCSC and licensed by BPPE (in CA) and BPSS (in NY), and is not regulated in TX under Chapter 132 of the Texas Education Code."
