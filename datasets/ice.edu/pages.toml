["https://ice.edu/blog/new-orleans-dooky-chase-exec-chef-leah-chase"]
title = 'Vital Names: Chef Leah Chase, the "Queen of Creole Cuisine," Nourished Civil Rights Leaders (and More) | Institute of Culinary Education'
description = "Welcome to “Vital Names,” a series of articles spotlighting influential Black chefs whose names are not as widely known as they should be, and whose marks on the culinary world have been overlooked, misattributed or appropriated. The vital name in part four of the series is Chef Leah Chase, a restaurant-owner, cookbook author and civil rights advocate from New Orleans, Louisiana."
full_description = '''Welcome to “Vital Names,” a series of articles spotlighting influential Black chefs whose names are not as widely known as they should be, and whose marks on the culinary world have been overlooked, misattributed or appropriated. The vital name in part four of the series is Chef Leah Chase, a restaurant-owner, cookbook author and civil rights advocate from New Orleans, Louisiana. Chef Leah Chase's legacy is deeply woven into the fabric of New Orleans and the U.S. as a whole. Known to many as the "Queen of Creole Cuisine," Chase's influence and impact on culinary arts in and beyond the American south cannot be overstated. Her story, however, comprises more than extraordinary culinary contributions. At Dooky Chase's, her restaurant on Orleans Street in the heart of NOLA's historic Treme neighborhood, Civil Rights activists met and made plans; African American art was displayed and admired; and celebrities, community leaders and U.S. presidents including George W. Bush and Barack Obama savored Creole flavors. Her restaurant was so revered — and Chase herself was so beloved — that she became a literal Disney Princess. "When you do a lot of work in your community, you become known, so somebody probably referred [Disney] to me, and I'm so happy about that," Chase told Oprah.com. "Now everybody wants to be Tiana. I think it's fantastic." Chase is widely credited as the inspiration for Princess Tiana, the first ever Black Disney princess and the heroine of the 2009 movie "The Princess and the Frog." Tiana, a chef who was born and raised in New Orleans (like Chase), dreams throughout the movie of opening her own restaurant. Spoiler alert: Her dream comes true. Noting the film's significance for Black chefs, Chase said: "When I came up, being a cook was nothing. It's just lately that we have chefs coming into their own." "Back then," she added, "people would look at you, especially if you were a Black woman, and say: 'Oh, you just a cook. That's it.' But now, being a chef is it."'''
year_published = 2025
clearnet = "https://ice.edu/blog/new-orleans-dooky-chase-exec-chef-leah-chase"
