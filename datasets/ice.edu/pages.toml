title = "Alumni Resources | ICE Career Services | Institute of Culinary Education"
description = "When asked what they learned at ICE, our graduates often say, cooking with integrity and passion, leading by example and moving with purpose to get things done quickly. But that’s just the tip of the iceberg: watch the video to see what else our alumni have to say about their ICE experience. To hear more from our alumni, visit our YouTube Channel to watch other video interviews. If you’d like to share your story, email ICE marketing at marketing@ice.edu."
full_description = "What Our Alumni Say About ICE When asked what they learned at ICE, our graduates often say, cooking with integrity and passion, leading by example and moving with purpose to get things done quickly. But that’s just the tip of the iceberg: watch the video to see what else our alumni have to say about their ICE experience. To hear more from our alumni, visit our YouTube Channel to watch other video interviews. If you’d like to share your story, email ICE marketing at marketing@ice.edu. Connect with ICE Alumni on Social: Facebook and Instagram ICE Alumni Stories – Yours Could Be Next Our grads make headlines with awards and nominations, restaurant rankings in the media, television appearances and dining reviews, and we proudly share ICE alumni stories on our website, blog and social media channels. We consistently highlight the latest restaurant openings and expansions, promotions and successes among ICE’s community of alumni, and we invite you to share your story with us. To be features, reach out to marketing@ice.edu.Read the latest ICE alumni news on our blog Networking Events – Get Involved A great way for ICE alumni to network and find new opportunities in the culinary and hospitality industries is to attend one of ICE’s on-campus events, including our popular Meet the Culinary Entrepreneurs event series. Many ICE alumni also enjoy coming back to campus to share their experiences and expertise with active students. Some have led culinary and pastry demonstrations, others have joined panel discussions about specific topics. If you’d like to be a speaker at an ICE event, or give a chef demonstration, contact ICE’s Vice President of Culinary Operations, Barry Tonkinson, at BTonkinson@ice.edu.Come to an ICE Event Job Placement – Let Us Help You Our Career Services team is available to help ICE graduates with job placement or to hire staff for their own business, at any point in their career. Even as graduates advance through their careers, the doors of our Career Services Department remain open to all alumni, including invitations to our on-site career fairs and networking opportunities. ICE alumni resources include a weekly email with a list of new hospitality and food job openings, including everything from entry-level positions to advanced roles and new business opportunities. (If you are an ICE graduate who would like to receive these postings, please click here.) ICE also serves our alumni in a variety of other ways, including helping you hire staff at your own food establishment and by extending invites to our on-site career fairs and networking opportunities."
