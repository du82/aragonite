description = "Chef Emilie Symons, MA, is a chef, educator and integrative health coach."
full_description = "Chef Emilie Symons, MA, is a chef, educator and integrative health coach. She developed the Online Plant-Based Culinary Arts & Food Operations program at ICE. She earned a master’s degree in Food Studies from New York University, and for over a decade her career has focused on the intersection of food, education, and wellness with positions at The Edible Schoolyard, The Sylvia Center, and most recently leading the Teaching Kitchen at New York-Presbyterian Hudson Valley Hospital. An interest in behavioral health led her to completing Duke’s Integrative Health Coaching program. She’s been teaching at ICE since 2022 and leads the Mental Fitness Kitchen and coaching program at Dr. Drew Ramsey’s clinic. Chef Symons studied at Barnard College, where she received her BA in creative writing and psychology. For over five decades, the Institute of Culinary Education has been a leader in culinary and hospitality education. Let us help you find your culinary voice. ICE is accredited by ACCSC and licensed by BPPE (in CA) and BPSS (in NY), and is not regulated in TX under Chapter 132 of the Texas Education Code. Terms of UsePrivacy PolicyDMCA PolicyJoin the ICE TeamApplicant Privacy StatementNY Career Catalog & BrochureLA Career Catalog & BrochureLA Annual Report and School Performance Fact Sheets Bureau for Private and Postsecondary Education (BPPE) Higher Education Emergency Relief FundNondiscrimination Statement & Title IX PolicyHigher Education Consumer Information Disclosures"
