title = "Ann Ziata | Institute of Culinary Education"
description = "Ann Ziata graduated from the Natural Gourmet Institute for Health and Culinary Arts' Chef's Training Program in 2011 and became a chef at Ravens Restaurant in Mendocino, California, where she serve"
full_description = '''"The best chefs use in-season ingredients, do as little as possible to them and give nature all the credit." Ann Ziata graduated from the Natural Gourmet Institute for Health and Culinary Arts' Chef's Training Program in 2011 and became a chef at Ravens Restaurant in Mendocino, California, where she served fine-dining vegan fare. In 2013, she went on to cook at the Omega Institute in Rhinebeck, New York. She did a stage at Cafe Paradiso in County Cork, Ireland, and has been the lead chef for First Descents, preparing meals for cancer survivors on retreats across America, each summer since 2015. Chef Ann began teaching at the Natural Gourmet Institute in 2013 where she developed recipes, managed content, led weekly cooking demonstrations at the Union Square Greenmarket, and taught recreational and professional classes through 2018. "I love teaching health-supportive cooking because it's inclusive and delicious; everyone can enjoy it," Chef Ann says. "It's customizable, and it promotes a culture where we can take care of ourselves in a fun, celebratory way." For over five decades, the Institute of Culinary Education has been a leader in culinary and hospitality education. Let us help you find your culinary voice. ICE is accredited by ACCSC and licensed by BPPE (in CA) and BPSS (in NY), and is not regulated in TX under Chapter 132 of the Texas Education Code. Terms of UsePrivacy PolicyDMCA PolicyJoin the ICE TeamApplicant Privacy StatementNY Career Catalog & BrochureLA Career Catalog & BrochureLA Annual Report and School Performance Fact Sheets Bureau for Private and Postsecondary Education (BPPE) Higher Education Emergency Relief FundNondiscrimination Statement & Title IX PolicyHigher Education Consumer Information Disclosures'''
