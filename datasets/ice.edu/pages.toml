["https://ice.edu/about/faqs"]
title = "FAQs | About ICE | Institute of Culinary Education"
description = "Frequently Asked Questions about the Institute of Culinary Education. ICE is one of America's top culinary arts school with locations in NYC & LA and programs online. Find your culinary voice today!"
full_description = '''02.26.25AlumniICE at 50: Meet Dr. Nate Wood, ICE Alum and the Man Teaching "Food as Medicine" at Yale Medical School 02.18.25NewsVital Names: James Hemings, America's First French-Trained Chef, Introduced Americans To Their Favorite Foods The decision to start culinary school can come with a lot of questions, but the ICE team is here to put your mind at ease and help you get started on the path to an exciting career in the culinary and hospitality field. At ICE, every prospective student has a personal Admissions Representative who is available to answer all your questions about the industry, the school and the program or programs that may be a good fit for your long-term goals. It’s easy! Just submit our Request for Information Form and we’ll send you more information about the school and our programs. An Admissions Representative will also reach out to get to know more about you, your background and your goals. Taking a campus tour is the best way to get a feel for what ICE is all about! Even if you plan to enroll in one of our online programs, walking through the halls of ICE and seeing students in their kitchens and classrooms provides an unparalleled glimpse into the energy and enthusiasm that makes ICE such a special place. Can’t come in person? Your Admissions Representative would be happy to set up a virtual tour via zoom. Simply complete our Request for Information Form and we’ll get in touch to set up a visit! Yes! ICE currently offers Associate Degrees in Culinary Arts, Pastry & Baking Arts and Plant-Based Culinary Arts that can be completed in just over a year. These unique programs are a combination of hands-on training classes in our professional-grade kitchens, specialized culinary business management lessons in a classroom setting and online general education coursework that relates to a career in the culinary industry. To request more information about ICE’s degree programs submit our simple Request for Information Form. Absolutely! ICE students come from all walks of life and many maintain full-time jobs while also making their culinary and hospitality school dreams come true. You can register for evening or weekend classes on campus, or maximize your flexibility with one of ICE’s online programs.'''
