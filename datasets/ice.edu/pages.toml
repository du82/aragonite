["https://ice.edu/blog/blackened-salmon-kale-caesar-recipe"]
title = "Chef Phil's Summer Salmon Recipe | Institute of Culinary Education"
description = "Summer is the perfect time for a hands-on cooking event at ICE, and Chef Phil develops diverse, crowd-pleasing menu items for customizable gatherings in our state-of-the-art spaces. Here are four tips for how to approach his latest seafood dish."
full_description = "Summer is the perfect time for a hands-on cooking event at ICE, and Chef Phil develops diverse, crowd-pleasing menu items for customizable gatherings in our state-of-the-art spaces. Here are four tips for how to approach his latest seafood dish. The salmon: Shop for salmon with the same rules as any fish: Look for firm and unbroken flesh, clear eyes and a briny, fresh scent. Wild salmon is always better. Although it costs more, the flavor is worth it. As with any meat, movement equals flavor. Wild salmon, which is given a chance to swim, is more flavorful than farmed salmon, which is kept in pens. The side: Kale is notoriously a tougher green, but it offers a lot of flavor that regular greens just don’t have. I like using it on salads because it gives the dressing a nice platform to shine. Caesar dressing is perfect for kale because it’s a rich, full-bodied dressing that can match the hardier green. Mix it with cheese, toasted breadcrumbs and a hint of lemon juice and it is a perfect blend of complementary flavors. The skill: Blackening is a technique in which food, traditionally fish, is dipped in butter and sprinkled with herbs and spices. All chefs have their own spin on the recipe, but they usually include thyme, oregano, chili pepper, salt, garlic powder and onion powder. After this step, the food is cooked in a heavy cast-iron pan to get a nice brown-black crust. This is an old technique most often associated with Cajun cooking, which a lot of people have adapted to fit their own style. I experimented with a lot of different spices for this recipe. My spice mix included what I consider to be the core spices, with additional ones that complement them. I also use olive oil instead of butter, as I find that olive oil works very nicely with salmon and the health benefits are distinct. I grill the fish rather than fry it in a cast-iron pan to give it an added depth of flavor. The serving: I’m a huge fan of grilled fish and salads when the weather is warm, as you can eat this right off the grill with friends. Serve with some chilled white wine and you’ve got yourself a great late spring or summer meal!"
year_published = 2019
