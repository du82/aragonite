["https://ice.edu/admissions"]
title = "Admissions| Institute of Culinary Education"
description = "Seeing is believing. A personal tour of ICE makes it all real and ignites the creative senses. Most importantly, you’ll see the school in action—your ICE Admissions Representative can arrange for you to meet with faculty, career counselors or even audit an actual class to experience life as a student firsthand.The best way to learn about being an ICE student is to visit in person - to get a taste of what’s happening every day at ICE. In the meantime, check out a video tour of our New York and Los Angeles campuses to get a sense of what our culinary campuses are like."
full_description = 'Students Say They Just "Felt Right" at ICE Seeing is believing. A personal tour of ICE makes it all real and ignites the creative senses. Most importantly, you’ll see the school in action—your ICE Admissions Representative can arrange for you to meet with faculty, career counselors or even audit an actual class to experience life as a student firsthand.The best way to learn about being an ICE student is to visit in person - to get a taste of what’s happening every day at ICE. In the meantime, check out a video tour of our New York and Los Angeles campuses to get a sense of what our culinary campuses are like. Financial Aid Is Just a Call, Click or Visit Away Your education is an investment in yourself and your future. Our Financial Aid advisors provide personalized counseling to help make your culinary school dreams a reality. To set up a meeting or a call with a personal financial aid advisor, simply ask your ICE Admissions Representative to make an appointment for you. Financial aid is available to all students who qualify.Learn more about Financial Aid Apply for ICE Admission Online 24/7 Simply complete our online application and you’ll be one step closer to following your dreams of a career in the culinary arts!Apply Now Hungry for More Info? The ICE admissions team can answer your individual questions, set up a one-on-one meeting virtually or in-person and reserve you a seat for our next open house. (By the way, we wrote the book on culinary careers, and have a limited number of free copies for prospective students. Be sure to ask your ICE Admissions Representative for details.) To start the conversation, call (888) 354-CHEF to learn more about programs at our New York campus or (888) 718-CHEF to learn more about programs at our Los Angeles campus, and our 100% online program*. *note: externship must be completed in a professional kitchen'
