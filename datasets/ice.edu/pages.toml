["https://ice.edu/campus-programs/restaurant-culinary-management"]
title = "Restaurant & Culinary Management Program | NY & LA | Institute of Culinary Education"
description = "You’ll be trained by professionals who have already done what you dream of doing, and succeeded. Our experienced instructors have opened and operated restaurants, catering businesses, food shops and more. Many are active consultants, meaning they have experience working with aspiring entrepreneurs just like you. With them, you'll study how to develop profitable business concepts, write a business plan and get to know the finer points of culinary marketing. You’ll practice troubleshooting restaurant and bar management issues concerning operations and staffing, analyze changing trends and make fiscal modifications to keep your business profitable.Through case studies, role-playing and group projects, we will show you how to make smart decisions for your business. You’ll also have a chance to gain valuable professional insight through field trips and lectures with successful culinary entrepreneurs and restaurant managers, which will help you better understand how to open a food business."
full_description = "Learn from Industry Experts You’ll be trained by professionals who have already done what you dream of doing, and succeeded. Our experienced instructors have opened and operated restaurants, catering businesses, food shops and more. Many are active consultants, meaning they have experience working with aspiring entrepreneurs just like you. With them, you'll study how to develop profitable business concepts, write a business plan and get to know the finer points of culinary marketing. You’ll practice troubleshooting restaurant and bar management issues concerning operations and staffing, analyze changing trends and make fiscal modifications to keep your business profitable.Through case studies, role-playing and group projects, we will show you how to make smart decisions for your business. You’ll also have a chance to gain valuable professional insight through field trips and lectures with successful culinary entrepreneurs and restaurant managers, which will help you better understand how to open a food business. Diverse Student Body, Diverse Goals Our students have diverse goals and experiences: A typical culinary management class might include career changers from fields such as marketing, finance, nursing or IT; recent high school or college graduates; and even working chefs or restaurant owners and operators who want to master the business side of the restaurant industry. Many culinary management graduates have pursued management and operations careers outside the kitchen while others combine this business-minded education with a culinary arts program to pursue leadership roles inside the kitchen. Combine Food Business Management with Hands-on Culinary Training Enrolling in our Culinary Arts, Pastry & Baking Arts or Plant-Based Culinary Arts programs in addition to Restaurant & Culinary Management allows you to double up and gain a dual diploma. We structure our course schedules to allow you to pursue both programs simultaneously and offer tuition incentives to help make realizing your professional goals that much easier.Learn More About ICE's Dual Diploma Option"
