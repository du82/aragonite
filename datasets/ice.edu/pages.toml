["https://ice.edu/blog/balsamic-glaze-and-spun-sugar"]
title = "Elevate Cheesecake with Balsamic Glaze and Spun Sugar | Institute of Culinary Education"
description = "Rory Macdonald is the former chef of New York City's Patisserie Chanson and its subterranean Dessert Bar. He's known for molecular gastronomy and tableside presentation, with experience working for the Hakkasan Group and Gordon Ramsey after launching his career in Europe. Read more about Chef Rory."
full_description = "Balsamic Vinegar of Modena can melt in your mouth and add an element of surprise and delight to a pastry in the form of spun sugar. Chef Rory Macdonald tops his mini cheesecakes with a glaze combining cherry puree and balsamic. The flavors marry beautifully and he adds a touch of creativity and ingenuity with his slinky-like spun sugar. Using a tube attachment on an electric screwdriver, he spins a balsamic-isomalt mixture into thin, golden cylinders to delicately top each cake. Rory Macdonald is the former chef of New York City's Patisserie Chanson and its subterranean Dessert Bar. He's known for molecular gastronomy and tableside presentation, with experience working for the Hakkasan Group and Gordon Ramsey after launching his career in Europe. Read more about Chef Rory. Rory Macdonald is the former chef of New York City's Patisserie Chanson and its subterranean Dessert Bar. He's known for molecular gastronomy and tableside presentation, with experience working for the Hakkasan Group and Gordon Ramsey after launching his career in Europe. Read more about Chef Rory. *USA Today 2019LA Annual ReportFacts SheetsHigher Education Emergency Relief FundBureau for Private and Postsecondary EducationHigher Education Emergency Relief FundNondiscrimination Statement & Title IX PolicyHigher Education Consumer InformationBureau for Private and Postsecondary EducationDisclosuresBureau for Private and Postsecondary Education ICE is accredited by ACCSC and licensed by BPPE (in CA) and BPSS (in NY), and is not regulated in TX under Chapter 132 of the Texas Education Code."
