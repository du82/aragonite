["https://ice.edu/about/alumni-profiles/Rebecca-Roth-Gullo"]
title = "Rebecca Roth Gullo | Institute of Culinary Education"
description = '''A true Bostonian, Rebecca Roth Gullo has emerged as a culinary force in the city. Her journey, however, began far from the kitchen. After a career in politics, working for leaders like Ted Kennedy and NYC Mayor Michael Bloomberg, Gullo found her unexpected calling in the culinary world.Gullo’s entrepreneurial spirit shone through with The Gallows, a Boston gastropub that quickly became a South End favorite. It was Blackbird Doughnuts, however, that catapulted Gullos to fame. The shop’s artisanal treats, with their creative flavors and meticulous craftsmanship, took Boston by storm, securing spots for Blackbird Donuts on countless "best of" lists and establishing it as an institution.Gullo's culinary empire continued to expand, encompassing a diverse portfolio of successful ventures. These include Banyan Bar + Refuge, an Asian-inspired gastropub, and multiple locations of Sally's Sandwich Shop.Beyond her business acumen, Gullo’s love of and commitment to Boston has earned her much respect within the city. She’s been recognized by Boston Main Streets, a prominent network dedicated to neighborhood revitalization, and her restaurants are frequently featured in renowned food publications like The Boston Globe: Food & Dining, Eater and Infatuation.Rebecca Roth Gullo's story is a testament to her entrepreneurial spirit, culinary talent and dedication to the city of Boston. She has not only built a successful restaurant empire but has also left an indelible mark on the city's vibrant food scene.'''
