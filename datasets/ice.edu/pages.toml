["https://ice.edu/about/alumni-profiles/Keita-Suzuki"]
title = "Keita Suzuki | Institute of Culinary Education"
description = "A rising star in the Los Angeles culinary scene, Chef Keita Suzuki honed his skills under the tutelage of culinary luminaries. One of the first graduates of ICE’s Los Angeles campus, Suzuki's journey began at the iconic Spago in Beverly Hills, where he immersed himself in the art of fine dining under the legendary Chef Wolfgang Puck. Navigating the challenges of the COVID-19 pandemic with resilience, Suzuki successfully launched and operated his own catering and takeout business. In 2022, he re-entered the fine dining arena, joining the team at the esteemed Destroyer under the guidance of acclaimed Chef Jordan Khan. As Chef Khan's renowned restaurant group flourished, so did Suzuki's career trajectory. By 2024, his exceptional talent and dedication led him to the coveted position of Sous Chef at Meteora, one of Los Angeles' most celebrated culinary destinations. With Suzuki as part of the kitchen leadership team, Meteora achieved a significant milestone – its first Michelin star, which attests to the restaurant's unwavering commitment to culinary excellence and Suzuki's invaluable contributions to its success."
