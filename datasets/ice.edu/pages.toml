["https://ice.edu/blog/vital-names-american-food-history-james-hemings"]
title = "James Hemings Brought America Its Favorite Foods| Institute of Culinary History"
description = "James Hemings, the enslaved chef for Thomas Jefferson and America's first French-trained chef, brought numerous popular foods stateside. Here, we explore Hemings' legacy, as an oft-forgot vital name in American food history and a man of tremendous wit, grit and talent."
full_description = "Welcome to “Vital Names,” a series of articles spotlighting influential Black chefs whose names are not as widely known as they should be, and whose marks on the culinary world have been overlooked, misattributed or appropriated. The vital name in part three of the series is James Hemings, the first American to train as a chef in France and the enslaved chef de cuisine of Thomas Jefferson. To whom do Americans attribute these beloved foods? For most of us, the answer is “I don’t know.” For some of us, the answer is either wrong or only partially informed. That’s because food history — like all history — is recorded and passed down by those in power. Here, the foods in question were introduced to Americans by James Hemings. As an enslaved chef to Thomas Jefferson, Hemings was not a person in power. Thus, he was erased from the annals of American cuisine. So, too, were his contributions. James Hemings was born into slavery in Virginia in 1765. His mother was Elizabeth Hemings, an enslaved woman. His father was John Wayles, a slave trader. At nine years old, Hemings arrived at Thomas Jefferson's Monticello as part of the Wayles’ estate, one of dozens of enslaved people who came into Jefferson’s possession through his wife’s inheritance. (A bit of background: John Wayles’ daughter Martha – by his wife Martha Eppes – married Jefferson. Hemings was, thus, a half-sibling to Jefferson’s wife. Hemings’ sister Sally, who was also enslaved, later bore children by Thomas Jefferson.) In 1784, Jefferson was named Minister Plenipotentiary (aka Commerce Minister) and relocated to France. Jefferson took 19-year-old Hemings with him. While in France, Hemings studied French cooking and apprenticed to some of the finest pastry and culinary chefs in Paris. Among these was the caterer and restaurateur Monsieur Combeaux and the lead chef in the household of the Prince of Condé. Hemings also paid for French language lessons with a private tutor. Eventually, Hemings earned the role of chef de cuisine (head chef) in Jefferson's kitchen at his home on the Champs-Élysées. There, he managed a team of white cooks and supporting staff across various roles in the kitchen, and he served his creations to European artists, statesmen and aristocrats hosted by Jefferson. Hemings was paid a wage — a rarity among enslaved people — but it was far less than that paid to white chefs in equivalent roles."
year_published = 2025
clearnet = "https://ice.edu/blog/vital-names-american-food-history-james-hemings"
