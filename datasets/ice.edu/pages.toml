["https://ice.edu/about/faculty-profiles/katie-chamberlain"]
title = "Katie Chamberlain | Faculty Profiles| New York Campus | ICE"
description = "Katie Chamberlain is a Hospitality Management Instructor at the Institute of Culinary Education (ICE) in New York City."
full_description = '"I want to share my real-world experience and industry expectations with others who are passionate and want to make an impact in the industry." Katie Chamberlain has several years of hospitality experience from working in hotels, universities, events, travel and tourism. Most notably, she worked and planned events for Major League Baseball. As president and co-founder of Planit Access, a company that focuses on accessible events, travel and tourism, she is a passionate advocate of accessibility accommodations for persons with disabilities as well as those with aspirations of being in the hospitality field. Ms. Chamberlain is a scholar practitioner working toward a doctorate in education and teaches at the Institute of Culinary Education and New York University as a hospitality management instructor. “What I hope to impart to students is to create a learning environment that is accessible, sustainable and experiential,” she says. “To be a role model through inspiring, motivating and supporting students in the good, bad and ugly of their academic careers as they mature and progress to be successful leaders in our society." For over five decades, the Institute of Culinary Education has been a leader in culinary and hospitality education. Let us help you find your culinary voice. ICE is accredited by ACCSC and licensed by BPPE (in CA) and BPSS (in NY), and is not regulated in TX under Chapter 132 of the Texas Education Code. Terms of UsePrivacy PolicyDMCA PolicyJoin the ICE TeamApplicant Privacy StatementNY Career Catalog & BrochureLA Career Catalog & BrochureLA Annual Report and School Performance Fact Sheets Bureau for Private and Postsecondary Education (BPPE) Higher Education Emergency Relief FundNondiscrimination Statement & Title IX PolicyHigher Education Consumer Information Disclosures'
