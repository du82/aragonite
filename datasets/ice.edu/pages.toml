full_description = '''Jürgen David is a classically trained pastry chef, confectioner and educator with more than 25 years of experience in classrooms, catering, restaurants, bakeries and confectionaries. He was trained in Vienna, Austria. In 1997, Chef Jürgen came to the U.S. and joined the International Culinary Center, first as a pastry chef-instructor and then as an associate director, where he was instrumental in developing and implementing the 300-hour cake techniques and design course. Chef Jürgen is fluent in English and German, holds multiple certifications in education, food safety and pastry, and has made appearances on shows, including Bravo's "Queer Eye for the Straight Guy" and Marvel Studios' YouTube series "Make it Marvel." For over five decades, the Institute of Culinary Education has been a leader in culinary and hospitality education. Let us help you find your culinary voice. ICE is accredited by ACCSC and licensed by BPPE (in CA) and BPSS (in NY), and is not regulated in TX under Chapter 132 of the Texas Education Code. Terms of UsePrivacy PolicyDMCA PolicyJoin the ICE TeamApplicant Privacy StatementNY Career Catalog & BrochureLA Career Catalog & BrochureLA Annual Report and School Performance Fact Sheets Bureau for Private and Postsecondary Education (BPPE) Higher Education Emergency Relief FundNondiscrimination Statement & Title IX PolicyHigher Education Consumer Information Disclosures'''
