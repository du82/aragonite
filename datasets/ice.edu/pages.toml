title = "So, You Want a Career in Hospitality? Here's One Way To Make It Happen | Institute of Culinary Education"
description = "Tired of checking Instagram and pining for an exciting career that takes you to beautiful destinations around the globe? A diploma from ICE's Hospitality & Hotel Management program can get you on the path toward a fulfilling career with, literally, a world of opportunities."
full_description = '''Tired of checking Instagram and pining for an exciting career that takes you to beautiful destinations around the globe? A diploma from ICE's Hospitality & Hotel Management program can get you on the path toward a fulfilling career with, literally, a world of opportunities. While some ICE hospitality graduates, like Rommel Gopez, pursue careers in hotels and resorts, others favor culinary-focused roles. Many land positions with acclaimed restaurants, restaurant groups, event planners and more. "I really love the idea of meeting people," she says. "Giving them something that they want and something that they need, listening to their story, and making them feel good – that was really hospitality to me.” Though she became Director of the Front Office at the acclaimed Ace Hotel in New York (in two years, no less), she got her start working an externship at the restaurant inside the hotel – Chef April Bloomfield's The Breslin. Watch the video below to hear Christina's story (in her own words), and learn how she went from ICE to NYC's coolest restaurant and hotel. Caitlin was ICE's content manager from 2016 to 2018 before moving to Spain and opening a pop-up artisanal sandwich shop. Today, she is a food and lifestyle writer and editor in Paris. Caitlin was ICE's content manager from 2016 to 2018 before moving to Spain and opening a pop-up artisanal sandwich shop. Today, she is a food and lifestyle writer and editor in Paris. *USA Today 2019LA Annual ReportFacts SheetsHigher Education Emergency Relief FundBureau for Private and Postsecondary EducationHigher Education Emergency Relief FundNondiscrimination Statement & Title IX PolicyHigher Education Consumer InformationBureau for Private and Postsecondary EducationDisclosuresBureau for Private and Postsecondary Education ICE is accredited by ACCSC and licensed by BPPE (in CA) and BPSS (in NY), and is not regulated in TX under Chapter 132 of the Texas Education Code.'''
