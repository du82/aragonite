["https://ice.edu/blog/ice-50-anniversary-alumni-honoree-chef-rachel-yang"]
title = "Meet Chef Rachel Yang, ICE Distinguished Alumni Honoree | Institute of Culinary Education"
description = "Sean is a freelance writer at the Institute of Culinary Education (ICE), combining his passion for food with his storytelling expertise. An outdoor enthusiast interested in adventure writing, he enjoys exploring new recipes, visiting local markets and experiencing culinary diversity in New York City."
full_description = "To celebrate 50 years of ICE, we're honoring 50 distinguished ICE alumni. Meet Chef and Seattle restaurateur, Rachel Yang. Chef Rachel Yang pioneered Korean-influenced cuisine in Seattle, where she and her husband have owned two celebrated restaurants — Joule and Revel — for nearly two decades. In that time, she's received numerous accolades, among them 12 James Beard Award nominations. (Read Chef Rachel's full bio here.) Her longevity in a competitive industry is remarkable, as is the community she fosters among staff and patrons who consider her spaces neighborhood mainstays. After 17 years (and counting), Joule remains a fixture, serving bold flavors and blending Korean techniques with Seattle's local produce and proteins. Recently, Chef Rachel expanded her influence by opening the Paper Cake Shop, which specializes in layered cakes. As part of ICE's 50th anniversary series, we spoke with the distinguished alumni honoree about her biggest achievements, her time at ICE, and the mentors who shaped her career. These were her thoughts. Chef Rachel: The biggest achievement is that I opened my first restaurant, Joule, 17 years ago, and it's still running. That's very rare. I've been a savory chef for over 20 years, and we opened a pastry cake shop for the first time. Experiencing the sweet side of cooking has been really amazing and fun. Chef Rachel: When we opened Joule, Korean restaurants were rare, and Seattle wasn't as diverse. Being a pioneer and becoming a neighborhood spot that people think of for Seattle food is pretty amazing. Now, at Paper Cake Shop, we focus on layered sheet cakes — airy sponge cake, creamy buttercream, and tart fillings. It's the same layering concept I've used in savory cooking, with sugar acting like salt to bring out flavors. Chef Rachel: We have a manager who's been with us for 12 years. It's amazing to have someone who truly lives what they do… and who wants to take care of the community with the food that we make. We've had hundreds of employees come through, and seeing them blossom is incredible. We all collaborate, create fun food, and take care of people — it's great to be part of so many special moments."
year_published = 2025
clearnet = "https://ice.edu/blog/ice-50-anniversary-alumni-honoree-chef-rachel-yang"
