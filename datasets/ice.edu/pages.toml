["https://ice.edu/campus-programs/culinary-arts-associate-degree"]
title = "Culinary Arts & Management Associate Degree | Institute of Culinary Education"
description = "Our signature career training program teaches the practice and art of cooking through theory, technique, palate training, speed and teamwork. Each of your cooking classes will cover a specific skill and build upon the class before it, beginning with basic ingredient identification. ICE Chef-Instructors will help train your senses, guiding you through a range of tastes and flavors, from herbs and condiments to vegetables and meats. They will show you how to progressively develop culinary techniques such as knife skills, dry and moist heat cooking methods, sauce-making, baking, pastry-making and more. In class, you can also expect to cover many different international cuisines and run restaurant service simulations, in addition to so much more. Throughout the program, you'll experience lessons with multiple chef-instructors, exposing you to a variety of mentors with different perspectives and areas of expertise."
full_description = "Culinary Arts Our signature career training program teaches the practice and art of cooking through theory, technique, palate training, speed and teamwork. Each of your cooking classes will cover a specific skill and build upon the class before it, beginning with basic ingredient identification. ICE Chef-Instructors will help train your senses, guiding you through a range of tastes and flavors, from herbs and condiments to vegetables and meats. They will show you how to progressively develop culinary techniques such as knife skills, dry and moist heat cooking methods, sauce-making, baking, pastry-making and more. In class, you can also expect to cover many different international cuisines and run restaurant service simulations, in addition to so much more. Throughout the program, you'll experience lessons with multiple chef-instructors, exposing you to a variety of mentors with different perspectives and areas of expertise. Culinary Management ICE’s Restaurant & Culinary Management program offers practical training in hospitality management, restaurant operations and entrepreneurship. Our experienced instructors will teach you how to develop profitable concepts, write a business plan and market your venture to a target audience. You'll get a sense of how to troubleshoot restaurant and bar management issues concerning operations and staffing, analyze changing trends and make fiscal modifications to keep a business profitable. You'll train to make strategic business decisions with case studies, role-playing and group projects; have a chance to gain valuable professional insights from prominent guest lecturers; and study menu design, social media marketing, kitchen and interior design, and wine tasting and appreciation.Get More Info Applied General Education Online Classes Students take online courses that are relevant to the restaurant industry and culinary careers, such as the history and culture of food, social psychology, business communication, leadership, change management and more. You'll study subjects as they apply to the business of food service, including interpersonal communication, time management, problem-solving, critical thinking; team building and leadership; written and verbal communication strategies as they relate to recipe writing, reviewing, food blogging and culinary demonstrations; and nutrition in terms of dietary preferences and the relationship between diet, health and disease."
