full_description = '''# 1 "America's Best Culinary School" The Institute of Culinary Education, its faculty and alumni have been awarded top honors by the James Beard Foundation, the IACP, USA Today, The Daily Meal and more. Find out why an ICE education puts you in amazing company. [1] Learn about our campus programs 19 K Alumni Our alumni lead the industry — running top kitchens around the globe, winning awards and transforming the future of culinary innovation. 88% report that their ICE education has proved somewhat or extremely important to their careers. [2] Meet our successful alumni 50 Years With 50 years of experience launching culinary careers, ICE is among the most respected culinary schools in Los Angeles and in America. In the last two years, ICE placed students in over 300 establishments, prompting praise from industry leaders. [3] Discover where ICE can take you Evan Funke Chef & Owner, Funke, Mother Wolf, Tre Dita "Strong foundation is everything. The leadership at ICE provides a rich environment for students to extract the necessary skills to start their journey towards becoming a professional chef." Tom Colicchio Award-Winning Chef & Restaurateur, Head Judge of "Top Chef" I’ve been working with ICE students in New York for years and they are consistently among the best young chefs in my restaurants. Suzanne Goin James Beard Award-Winning Chef & Restaurateur, Lucques Restaurant Group When I visited ICE in New York, I was so impressed with the school’s facilities and culinary programs. I know our Los Angeles chefs and restaurateurs are looking forward to having a premier culinary school for aspiring chefs and having a resource for recruiting talent close to home. It’s a great time to be cooking in LA — there is so much opportunity to cook for those that want a career in the field. Marcus Samuelsson James Beard Award-Winning Chef & Restaurateur, Marcus Samuelsson Restaurants I love working with ICE graduates; they're very focused, very passionate and determined. ICE is known for its great chef-instructors and facilities. And if I am impressed with the work an extern or entry-level cook does for me, I can reach out to some of the best restaurants in the world to help them get their next job.'''
