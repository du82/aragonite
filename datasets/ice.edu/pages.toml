title = "Careers Inside Kitchen | Institute of Culinary Education"
description = "Executive chefs are responsible for overseeing other chefs and staff in the kitchen, which makes having leadership experience extremely important. They also lead the way in terms of creating the menu, training new members of the team and making sure the kitchen operations run smoothly.ICE Alumni in the Spotlight:Anthony Ricco Suzanne Cupps"
full_description = "Executive Chef Careers Executive chefs are responsible for overseeing other chefs and staff in the kitchen, which makes having leadership experience extremely important. They also lead the way in terms of creating the menu, training new members of the team and making sure the kitchen operations run smoothly.ICE Alumni in the Spotlight:Anthony Ricco Suzanne Cupps Pastry Chef Careers The Pastry Chef is another leader in the kitchen, from a creative and operational standpoint. While this position may report to an Executive Chef, the Pastry Chef is responsible for creating desserts and pastries to accompany the menu. The Pastry Chef also has creative freedom to test new recipes for desserts and pastries. ICE Alumni in the Spotlight:Meadow RamseyJennifer Tafuri Chef-Owners and Restaurateur Careers As the titles suggest, chef-owners and restaurateurs own or manage a restaurant or food business. They can also be the originator of the business concept and play an important role in the growth of the business. In the case of a chef-owner, the menu may be within their creative control as well.ICE Alumni in the Spotlight:Missy Robbins Miguel Trinidad"
