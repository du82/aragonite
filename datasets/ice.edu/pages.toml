["https://ice.edu/blog/meet-monkfish-poor-mans-lobster"]
title = 'Meet Monkfish, the “Poor Man’s Lobster" | Institute of Culinary Education'
description = "Cory Sale is the Senior Public Relations Manager at ICE and an alumna (Culinary Arts '22). She enjoys writing about seasonal produce almost as much as visiting NYC’s greenmarkets, where she finds new flavors to add to ice cream. When she’s not cooking (or eating), you can find her on the frisbee field chasing down a piece of plastic."
full_description = '''The Institute of Culinary Education has teamed up with GrowNYC for a monthly series highlighting a seasonal ingredient at the local greenmarket. On a recent visit to NYC's Union Square greenmarket, ICE Director of Culinary Affairs Hervé Malivert braved brisk February temperatures to achieve a singular goal: sourcing local, wild fish. (With few fruits and vegetables harvested this time of year in New York, seafood is a smart greenmarket choice.) Chef Hervé headed straight to the American Pride Seafood tent. There, he selected monkfish, whose sweet, clean flavor tastes far less "fishy" than its appearance suggests. (Search "monkfish photo" at your own risk.) According to Chef Hervé, monkfish's white, meaty flesh earned it the nickname “poor man’s lobster” because it resembles lobster meat but is much more economical. In his recipe for Pan Seared Monkfish with Bourbon-Roasted Sweet Potatoes and Beurre Blanc, Chef Hervé first brines the monkfish to extract moisture, firm up the flesh, and remove the albumin (those white globs that can seep out of fish when cooked; it’s a protein and safe to eat). He then pan sears the fish and bastes it with thyme and garlic. “Monkfish can be grilled, seared, roasted – I cook it like I would a chicken or steak, it’s very versatile,” Chef Hervé says.He paired the fish with mashed sweet potato and seared pak choi (both from the greenmarket) and finished the dish with a beurre blanc sauce. This is a classic French butter sauce Chef Hervé teaches his students in ICE’s Culinary Arts program. “It goes well with lean meats and is perfect for the winter season when you want something warm and buttery,” he says.Check out the recipe below, and give it a try next time you're craving seafood at an attainable price. Cory Sale is the Senior Public Relations Manager at ICE and an alumna (Culinary Arts '22). She enjoys writing about seasonal produce almost as much as visiting NYC’s greenmarkets, where she finds new flavors to add to ice cream. When she’s not cooking (or eating), you can find her on the frisbee field chasing down a piece of plastic.'''
year_published = 2025
