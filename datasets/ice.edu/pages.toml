["https://ice.edu/blog/science-behind-croissants"]
title = "The Science Behind Croissants | Institute of Culinary Education"
description = "Pamela Vachon is a freelance food and travel writer and ICE graduate (Culinary '11) whose work has appeared in Bon Appetit, Travel + Leisure and Wine Enthusiast, among others. She is a certified sommelier and non-certified cheese expert who teaches at NYC's Murray's Cheese."
full_description = "From a baking perspective, croissants are much more than mere breakfast treats – they’re structural marvels. At once light and flaky, multi-layered and complex, they challenge the conventions of both science and baking. Rarely do flour, butter and yeast come together in such a flavorful feat of engineering. Chef Jürgen David, ICE’s Director of Pastry Research & Development, talks us through the science behind croissants, explaining the ingredient nuances and technical factors that make this iconic French pastry possible. To fully understand croissants is to understand the multi-stage rising process that happens when you make them. In what is considered biological or organic leavening, yeast feeds on the sugars and starches in the dough, breaking them down and releasing carbon dioxide in the process. “That carbon dioxide gas will be trapped by the gluten that you developed in the dough, and that's how bread becomes puffy.” There is also chemical leavening, such as what happens with baking soda or baking powder, and mechanical leavening, wherein air is whipped into the dough via egg whites or cream. Croissants are made by applying a highly technical version of the latter method — going “a step beyond,” says Chef Jürgen — known as lamination. “If you are creating layers of butter and dough, then you get lamination,” says Chef Jürgen. Steam is created when the layers of butter react with heat, which then lift the layers of dough. In the case of croissants, an intricate folding process, outlined below, creates a multitude of layers for this process to happen on a many-tiered scale. According to Chef Jürgen: “The biological leavening combined with lamination is what makes croissants soft, flaky, and light.” Lamination comes down to a complex process of folding, rolling and turning to create a finished product that, before baking, has dozens of distinct layers of butter and dough stacked on top of one another. For recreational bakers, one of the most surprising aspects of croissant making (speaking from experience) is that butter — just like dough — can be rolled flat and remain firm while you manipulate it. That’s because it’s a fat whose melting point is above room temperature. This means that, so long as you aren’t working in overly hot conditions, butter will stay solid during the croissant formation process."
year_published = 2025
