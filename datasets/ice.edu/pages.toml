["https://ice.edu/about/alumni-profiles/Jaratpoon-Sugar-Sungkamee"]
title = 'Jaratpoon "Sugar" Sungkamee | Institute of Culinary Education'
description = '''Nestled in a modest strip mall in Hollywood, Jitlada Thai Restaurant has become an iconic destination for authentic Southern Thai cuisine. Under the leadership of Jaratpoon "Sugar" Sungkamee, the second-generation owner, Jitlada continues to capture the hearts of food lovers throughout Los Angeles. Opened in 1970, the restaurant reached new heights in the mid-2000s under the stewardship of Sugar's father, Chef Tui, and her aunt, Chef Sarintip “Jazz” Singsanong. Together, they helped introduce Southern Thai flavors to a broad audience. For their efforts, they earned critical acclaim, including an enthusiastic review by Jonathan Gold in 2007 that solidified Jitlada as a top LA dining destination.When Tui passed away, Sugar, along with her aunt Jazz, took over the family restaurant, honoring the legacy of her father’s passion for food while applying her own business acumen. With an MBA and a culinary management diploma from ICE Los Angeles, Sugar’s leadership combines tradition and innovation, and ensures that Jitlada’s offerings remain relevant and exciting for new generations of diners.Jitlada’s menu embodies the bold, vibrant flavors of Southern Thai cuisine and features a mix of beloved Thai staples and lesser-known specialties. Among these are an addictive crispy catfish salad and a rich, aromatic Taepo chicken curry. The restaurant’s flavors reflect the Sungkamee family’s roots in Nakhon Si Thammarat, and they’re quality has earned Jitlada a spot on countless “must-try” and “best of” lists, as well as consistent recognition by the Michelin Guide and The James Beard Foundation. In 2021, Sugar opened Spicy Sugar in Long Beach, California, and followed it opening with a second location that’s thriving under the ownership of head chef Katt Goldsmith. Sugar, who is a tireless advocate for women in business, uses her platform to uplift others in her community.For Sugar, Jitlada isn’t just a restaurant; it’s a living tribute to her father’s legacy and a place where family, culture and great food come together in a way that resonates deeply with anyone who walks through its doors.Learn more about Sugar’s Journey on the ICE blog'''
full_description = '''Nestled in a modest strip mall in Hollywood, Jitlada Thai Restaurant has become an iconic destination for authentic Southern Thai cuisine. Under the leadership of Jaratpoon "Sugar" Sungkamee, the second-generation owner, Jitlada continues to capture the hearts of food lovers throughout Los Angeles. Opened in 1970, the restaurant reached new heights in the mid-2000s under the stewardship of Sugar's father, Chef Tui, and her aunt, Chef Sarintip “Jazz” Singsanong. Together, they helped introduce Southern Thai flavors to a broad audience. For their efforts, they earned critical acclaim, including an enthusiastic review by Jonathan Gold in 2007 that solidified Jitlada as a top LA dining destination. When Tui passed away, Sugar, along with her aunt Jazz, took over the family restaurant, honoring the legacy of her father’s passion for food while applying her own business acumen. With an MBA and a culinary management diploma from ICE Los Angeles, Sugar’s leadership combines tradition and innovation, and ensures that Jitlada’s offerings remain relevant and exciting for new generations of diners. Jitlada’s menu embodies the bold, vibrant flavors of Southern Thai cuisine and features a mix of beloved Thai staples and lesser-known specialties. Among these are an addictive crispy catfish salad and a rich, aromatic Taepo chicken curry. The restaurant’s flavors reflect the Sungkamee family’s roots in Nakhon Si Thammarat, and they’re quality has earned Jitlada a spot on countless “must-try” and “best of” lists, as well as consistent recognition by the Michelin Guide and The James Beard Foundation. In 2021, Sugar opened Spicy Sugar in Long Beach, California, and followed it opening with a second location that’s thriving under the ownership of head chef Katt Goldsmith. Sugar, who is a tireless advocate for women in business, uses her platform to uplift others in her community. For Sugar, Jitlada isn’t just a restaurant; it’s a living tribute to her father’s legacy and a place where family, culture and great food come together in a way that resonates deeply with anyone who walks through its doors.'''
