["https://ice.edu/about"]
title = "About Us | Institute of Culinary Education"
description = "There’s nothing quite like the buzz of anticipation that fills the auditorium for the Institute of Culinary Education's annual commencement ceremonies. Clad in chef’s whites and the iconic toque, students who have completed their programs in the past year gather in the cities of their respective campuses to join their classmates in celebration as they mark the start of their journey from hospitality or culinary school student to industry professional. Online students are invited to attend the annual ICE Los Angeles commencement ceremony."
full_description = "Commencement There’s nothing quite like the buzz of anticipation that fills the auditorium for the Institute of Culinary Education's annual commencement ceremonies. Clad in chef’s whites and the iconic toque, students who have completed their programs in the past year gather in the cities of their respective campuses to join their classmates in celebration as they mark the start of their journey from hospitality or culinary school student to industry professional. Online students are invited to attend the annual ICE Los Angeles commencement ceremony.Watch Recaps Alumni Nothing makes us prouder than seeing our students thriving as alumni. You’ll find our 17,900+ alumni in every corner of the culinary and hospitality field across the country and around the world. From award-winning chefs to food media stars, chart-topping cookbook authors and successful entrepreneurs, ICE’s goal is always to help students Find their Culinary Voice™.Alumni Profiles Faculty Our talented instructors come from a variety of backgrounds and are one of the key ingredients in the Institute of Culinary Education's unique recipe for culinary education. While some have worked at America’s finest restaurants, won major industry awards, and opened and operated their own hospitality or food businesses, they all share one thing: a passion for not just doing, but educating. Our faulty members bring an incredible range of skills, extensive networks, and real-world experience into their classrooms. All our instructors are respected experts who have dedicated themselves to training the next generation of culinary arts and hospitality professionals.Faculty Profiles Events Having campuses in the heart of two of America’s culinary capitals means some of the best talent in the food and hospitality world regularly stop by to perform demonstrations, give lectures, sit on panels and recruit ICE students and alumni for their businesses. In addition to hosting these thought-leaders, the Institute of Culinary Education campuses are always a buzz with activity, including regular Open Houses for prospective culinary school students, cooking competitions and even wine tasting and service examinations for entry to the Court of Master Sommeliers, America’s.Upcoming Events"
