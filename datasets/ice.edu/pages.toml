["https://ice.edu/about/careers-at-ice"]
title = "Join the ICE Team | Institute of Culinary Education"
description = "Chef-Instructor, Culinary Arts and Pastry & Baking ArtsPart-time or Full-timeCulinary Operations Assistant (COA)Full-timeHospitality Management Instructor Part-timeChef AssistantPart-time or Full-time with evening and weekend availabilityRecreational Chef-InstructorPart-time"
full_description = "New York Campus Chef-Instructor, Culinary Arts and Pastry & Baking ArtsPart-time or Full-timeCulinary Operations Assistant (COA)Full-timeHospitality Management Instructor Part-timeChef AssistantPart-time or Full-time with evening and weekend availabilityRecreational Chef-InstructorPart-time About ICE The Institute of Culinary Education (ICE) is one of the largest and most diverse culinary schools in the world with campuses in New York and Los Angeles. Established in 1975, ICE offers award-winning six to 13-month career training programs in Culinary Arts, Pastry & Baking Arts, Plant-Based Culinary Arts, Restaurant & Culinary Management and Hotel & Hospitality Management and continuing education programs in Artisan Bread Baking and The Art of Cake Decorating — with more than 14,000 successful alumni, many of whom are leaders in the industry. ICE also offers professional development for culinary professionals, hosts more than 500 special events each year and is home to one of the world’s largest recreational cooking, baking and beverage programs with 26,000 students annually. ICE’s 74,000-square-foot, cutting-edge campus in New York City and 38,000-square-foot Los Angeles campus were designed for inspiration, creativity and community. Visit us at ice.edu, watch our videos on YouTube at youtube.com/iceculinary, or join the conversation on Twitter, Instagram and Facebook at @iceculinary to find your culinary voice™."
