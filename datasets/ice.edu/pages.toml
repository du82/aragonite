["https://ice.edu/about/alumni-profiles/dan-long"]
title = "Dan Long | Institute of Culinary Education"
description = "Dan Long grew up in New York, attended Colorado College in Colorado Springs then returned to New York City to study at the Institute of Culinary Education (ICE). Dan worked at Veritas, a three-star restaurant on 20th Street, and One c.p.s., a restaurant at The Plaza Hotel (both now closed). In December 2004, he and co-owner, Marley Hodgson, opened Mad Greens, a fast-casual salad restaurant in Centennial, Colorado. The concept aimed to bring “fresh, fast and healthy fare” to Colorado and has grown to more than 30 locations in Arizona, Colorado and Texas. AC Restaurant Group bought Mad Greens in 2013 for expansion and Dan continues to oversee the business."
