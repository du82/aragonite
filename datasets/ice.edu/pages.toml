["https://ice.edu/chef-instructor"]
title = "Chef-Instructor | Institute of Culinary Education"
description = "POSITION SUMMARY: The Institute of Culinary Education (ICE), NYC’s top-rated culinary school, is seeking full- and part-time Chef-Instructors to expertly train students in theory, practic"
full_description = "The Institute of Culinary Education (ICE), NYC’s top-rated culinary school, is seeking full- and part-time Chef-Instructors to expertly train students in theory, practice and art of cooking and baking — skills which can be applied to a broad range of career paths. As a key member of the faculty, you will facilitate learning and evaluate students using ICE’s award-winning curriculum, and you will leverage your professional experience to proactively support students in the pursuit of their goals. If you are looking to share your talent, skills and industry excellence to help create the next generation of chefs, this is the opportunity for you. We are passionate, disciplined and foster an environment of excellence. We support and reward creativity, performance, professional development and team involvement. We also have fun, and eat well, in the process! About ICE: The award-winning Institute of Culinary Education (ICE) was established in 1975 and has since grown to be one of America’s leading centers for culinary education and the largest culinary institute in New York City and Los Angeles. In 2015, ICE built and moved to a new flagship 75,000 sq. ft. location in lower Manhattan, NY. ICE has been ranked the “#1 Culinary School in America” by USA Today, 2019 and DailyMeal.com, 2016. The foundation of ICE is its five Diploma Programs in Culinary Arts, Pastry & Baking Arts, Restaurant & Culinary Management, Hotel & Hospitality Management and Health-Supportive Culinary Arts. ICE’s programs are intensive, sophisticated and, as a diploma, can be completed in 8-12 months. In addition to career programs, ICE NYC offers a vast menu of recreational courses for the public, and a highly developed special events / cooking party division. In the spring of 2018, ICE opened a branch campus in Pasadena, CA. In the summer or 2020, ICE licensed the assets of the former French Culinary Institute. Visit us at ice.edu or join us on Twitter, Instagram, YouTube and Facebook at @iceculinary to find your culinary voice™."
year_published = 2025
