["https://ice.edu/campuses/newyork"]
title = "New York | ICE Campuses | Institute of Culinary Education"
description = "The Institute of Culinary Education, its faculty and alumni have been awarded top honors by the James Beard Foundation, the IACP, USA Today, The Daily Meal and more. Find out why an ICE education puts you in amazing company. [1]"
full_description = '''# 1 "America's Best Culinary School" The Institute of Culinary Education, its faculty and alumni have been awarded top honors by the James Beard Foundation, the IACP, USA Today, The Daily Meal and more. Find out why an ICE education puts you in amazing company. [1] Learn about our campus programs 19 K Alumni Our alumni run top kitchens around the globe, winning awards and transforming the future of culinary innovation. 88% report that their ICE education has proved somewhat or extremely important to their careers. [2] Meet our successful alumni 50 Years With 50 years of experience launching culinary careers, the Institute of Culinary Education is among the most respected culinary schools in New York and in America. In the last two years, ICE placed students in over 300 establishments, prompting praise from industry leaders. [3] Discover Where ICE Can Take You Shenarri Freeman Executive Chef, Cadence, ICE Plant-Based Culinary Arts, '20 My time at ICE provided me with all of the necessary essential cooking skills and techniques to progress in my field. Taking the Health-Supportive Culinary Arts program, a plant-forward approach to cooking, taught me a more holistic approach to cooking without processed foods. My role in this industry wouldn’t be as polished without this program. Danny Meyer Founder & Executive Chairman, Union Square Hospitality Group “For fifty years, [ICE] has trained generations of chefs, restaurateurs and hospitality professionals who have greatly enriched the national culinary conversation. The education provided by ICE has lit the way for its thousands of graduates and contributed abundantly to the pleasures of dining out.” Chintan Pandya James Beard Award-Winning Chef & Founder, Unapologetic Foods ICE continues to set the tone for building industry expertise and talent in Culinary Arts. At the most recent ICE event, it was refreshing to see candidates' experience and passion for their craft. We are proud of our very own ICE alumni, Isha Thakkar, who oversees the Penn Station Rowdy Rooster restaurant.'''
