["https://ice.edu/blog/ice-50-anniversary"]
title = "The Institute of Culinary Education Celebrates its 50-Year Anniversary"
description = "The Institute of Culinary Education turns 50 in 2025. To celebrate, the school is honoring distinguished alumni and hosting a year’s worth of special events."
full_description = "The Institute of Culinary Education turns 50 in 2025. To celebrate, the school is honoring distinguished alumni and hosting a year’s worth of special events. ICE has been educating culinary and hospitality professionals for decades. This year, however, is particularly momentous. To celebrate its 50th birthday, ICE NYC and ICE LA campuses are hosting special programming throughout the year, all of which speak to the history of ICE as one of the nation’s most prestigious culinary schools. “Reaching ICE’s 50th anniversary, and my 30th as owner, is a testament to the passion and dedication of our students, faculty, and alumni,” ICE Chairman and CEO, Rick Smilow says. “[They] continue to push the boundaries of what’s possible.” What’s possible—both at ICE and in the culinary world overall—has evolved and expanded dramatically over 50 years. There is, perhaps, no one who knows this better than the many thousand graduates of ICE’s New York, Los Angeles and online programs. Among the highlights of the school’s 50th anniversary celebrations is the recognition of 50 distinguished alumni. Collectively, they represent the diversity of programs at ICE, and each has had a powerful impact on our industry’s past, present and future. Danny Meyer, Union Square Hospitality Group founder and a longtime employer of ICE externs and alumni, had this to say about ICE’s rigorous programs: “For fifty years, The Institute of Culinary Education has trained generations of chefs, restaurateurs and hospitality professionals who have greatly enriched the national culinary conversation. The education provided by ICE—under Rick Smilow’s impassioned leadership—has lit the way for its thousands of graduates and contributed abundantly to the pleasures of dining out.” Mary Attea—Chef: Musket Room + Executive Chef/Partner: Raf's, Café Zafiri (New York, NY)Mashama Bailey—Chef/Partner: The Grey (Savannah, GA)Maxime Bilet—President/Founder: Imagine Food Innovation Group (Seattle, WA)Esther Choi—Chef/Owner: mŏkbar + TV Personality (New York, NY)Samuel Clonts—Chef/Co-owner: 63 Clinton (New York, NY)Suzanne Cupps—Chef/Owner: Lola's (New York, NY)Georgiana Hiliadaki—Co-founder: Hospitality Group Modern Greek Food Group (Athens, Greece) Vivian Howard—TV Personality + Owner: Chef & The Farmer (Kinston, NC)Sohui Kim—Chef/Owner: Insa, Gage and Tollner, The Good Fork (New York, NY)Marc Murphy—Celebrity Chef + Restaurateur + Food Media Personality (New York, NY)Helen Nguyen—Chef/Owner: Saigon Social (New York, NY)Ayesha Nurdjaja—Chef/Partner: Shukette, Shuka (New York, NY)Ann Redding—Chef/Co-owner: Thai Diner (New York, NY) Missy Robbins—Chef/Owner: Lilia, Misi, Misipasta + Co-founder, Grove House NYC Hospitality Group (New York, NY) Steve Samson—Chef/Owner: Rossoblu, Superfine, Superfine Playa (Los Angeles, CA)Dan Segall—Chef: Jade by Todd English (Bali, Indonesia) Simone Tong—Chef (Austin, TX)David Viana—Chef/Owner: Heirloom Kitchen, The Lovely Lita, Judy & Harry's at St. Laurent Social Club (Old Bridge, Aberdeen and Asbury Park, NJ)Rachel Yang—Chef/Owner: Joule, Revel (Seattle, WA)"
