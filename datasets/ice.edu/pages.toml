["https://ice.edu/about/alumni-profiles/andrew-rigie"]
title = "Andrew Rigie | Alumni Profiles | Institute of Culinary Education"
description = '''Andrew Rigie is the Executive Director and Founder of the New York City Hospitality Alliance, a leading association representing restaurants and nightlife venues across New York City. He also leads the Impact Foundation, the Alliance's charitable arm, supporting the industry through emergency meals, culinary scholarships, and education. Born into the hospitality business, Rigie worked in his family's third-generation bakery and other industry roles before joining the New York State Restaurant Association in 2004. There, he honed his skills in member recruitment, grassroots organizing, and consulting. In 2009, he became Executive Vice President of the Association's NYC operations. Rigie founded the independent NYC Hospitality Alliance in 2012, growing it into a powerful voice for the industry, providing essential resources and representation in government and media. He also serves on numerous advisory boards, including as Chair of NYC’s Office of Nightlife Advisory Board, and has held leadership positions on Community Board 7 (Manhattan) and the New York State and City's COVID-19 Recovery committees. A prominent advocate, speaker, and commentator, Rigie was a Crain's New York Business "40 Under 40" honoree and has been recognized by City & State as a "New York City Power 100"  and Hunter College as a "Star in NYC Food Policy".'''
full_description = '''...The curriculum provided me with a comprehensive understanding of the nuances of this diverse industry. ICE made me a more competent, confident and qualified hospitality industry professional. Andrew Rigie is the Executive Director and Founder of the New York City Hospitality Alliance, a leading association representing restaurants and nightlife venues across New York City. He also leads the Impact Foundation, the Alliance's charitable arm, supporting the industry through emergency meals, culinary scholarships, and education. Born into the hospitality business, Rigie worked in his family's third-generation bakery and other industry roles before joining the New York State Restaurant Association in 2004. There, he honed his skills in member recruitment, grassroots organizing, and consulting. In 2009, he became Executive Vice President of the Association's NYC operations. Rigie founded the independent NYC Hospitality Alliance in 2012, growing it into a powerful voice for the industry, providing essential resources and representation in government and media. He also serves on numerous advisory boards, including as Chair of NYC’s Office of Nightlife Advisory Board, and has held leadership positions on Community Board 7 (Manhattan) and the New York State and City's COVID-19 Recovery committees. A prominent advocate, speaker, and commentator, Rigie was a Crain's New York Business "40 Under 40" honoree and has been recognized by City & State as a "New York City Power 100" and Hunter College as a "Star in NYC Food Policy". For over five decades, the Institute of Culinary Education has been a leader in culinary and hospitality education. Let us help you find your culinary voice. ICE is accredited by ACCSC and licensed by BPPE (in CA) and BPSS (in NY), and is not regulated in TX under Chapter 132 of the Texas Education Code. Terms of UsePrivacy PolicyDMCA PolicyJoin the ICE TeamApplicant Privacy StatementNY Career Catalog & BrochureLA Career Catalog & B