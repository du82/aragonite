["https://ice.edu/about/faculty-profiles/connie-elick"]
title = "Connie Elick | Institute of Culinary Education"
description = "Connie Elick, M.S. R.D. brings her knowledge of nutrition and food science to the Institute of Culinary Education.After getting her start the culinary industry as a host and server, Connie decided to taker love for nutrition further by pursuing a Bachelor of Science degree in Foods & Nutrition - Dietetics at California State Polytechnic University Pomona. While earning her bachelor's degree, Connie volunteered at the AIDS Project Los Angeles. After graduating, she continued her charitable work as a nutrition volunteer at the Healthbridge Children’s Hospital.Connie continued her education, earning her a master's degree in Nutrition & Food Science from California State Polytechnic University in 2021. Since then, she has become a registered dietitian and teaches courses as a lecturer California State University San Bernardino and at ICE.Connie is also active on social media, where she shares tips and leads group sessions on various nutrition-related topics. Find her at @elicknutrition."
