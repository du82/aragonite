full_description = "Dorm-Style Rooms Dorm-style options offer a more traditional student housing experience at approachable prices. This is a great opportunity to meet people, have a dorm-life experience and be part of a community of peers as well as students from other schools and universities.Click here to learn more about dorm-style ICE housing options Apartments ICE partners offer a variety of apartment options in a wide range of budgets so you can feel right at home. From shared and studio apartments to luxury apartments in centrally located neighborhoods, we'll help you select the location that best fits your lifestyle.Click here to check out apartment-style ICE housing options Co-Living* An increasingly popular option in New York City's real estate market is co-living: private or shared rooms in group homes with all-inclusive pricing. Students are matched with like-minded housemates in fully furnished spaces with utilities, Wi-Fi and community-building amenities included.*Co-Living options are currently only available at our NYC campus.Discover the benefits of co-living Homestays Furnished homestays offer fully furnished, private rooms in the homes of host families — a popular choice for our international students. This option is optimal for students who would prefer to immerse themselves in the city’s culture by living with a local resident.Click here for details about ICE homestays Learn more For more information about the Institute of Culinary Education's housing program for the New York campus, please call (888) 986-CHEF or email NYhousing@ice.edu. For ICE’s Los Angeles campus, please call (888) 826-CHEF or email LAhousing@ice.edu. We look forward to working with you!Institute of Culinary Education housing disclaimer"
