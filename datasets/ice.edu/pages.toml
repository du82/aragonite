["https://ice.edu/about/our-story/my-culinary-voice"]
title = "My Culinary Voice | Our Story | Institute of Culinary Education"
description = 'Duff Goldman’s slogan is simple: If you can dream it, we can create it. The Pastry Chef and Owner of the Baltimore-based, Charm City Cakes bakery and star of Food Network’s "Ace of Cakes" is up for any confectionery challenge. "I’m not too serious about how I put my food out there, but don’t confuse that with not being serious about what I do."'
full_description = '''Duff Goldman - Food Network Star & Chef-Owner of Charm City Cakes Duff Goldman’s slogan is simple: If you can dream it, we can create it. The Pastry Chef and Owner of the Baltimore-based, Charm City Cakes bakery and star of Food Network’s "Ace of Cakes" is up for any confectionery challenge. "I’m not too serious about how I put my food out there, but don’t confuse that with not being serious about what I do." Alex Atala — Netflix "Chef's Table" Star and D.O.M Chef Could chefs lead the charge in the effort to save our planet? Chef Alex Atala certainly thinks so. The Brazilian chef’s commitment to his native cuisine goes beyond cooking delicious food and is well documented in his featured episode of the Netflix series “Chef’s Table.” Atala envisions that — through connecting with each other and sharing knowledge, flavors and experiences — this generation and generations of chefs to come will harness their unique power to inspire and unite people to bring lasting, impactful change to our food systems. Alex Guarnaschelli - "Iron Chef" & Executive Chef of Butter NYC Alex Guarnaschelli started young. As the daughter of a busy cookbook editor, she spent her childhood surrounded by a smorgasbord of food and culinary trends. Since then, she’s honed her culinary voice by cooking alongside the best — like Guy Savoy and Daniel Boulud — and by leading the charge in her own kitchen, the acclaimed NYC restaurant Butter, as Executive Chef. Watch the video to discover why Alex is embracing a quieter culinary voice and learning to say more with less. Marc Forgione - "Iron Chef" and Restaurateur Restaurateur and chef Marc Forgione savors a challenge. Since winning "Iron Chef" and earning the first Michelin star for his eponymous restaurant, he has continued to wow diners with his bold and delicious take on local ingredients. Marc — who, according to The New York Times, “excels at simplicity” — shares the five straightforward ingredients of his culinary voice.'''
