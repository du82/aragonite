["https://ice.edu/blog/celebrated-brooklyn-chef-boise-hotelier-meet-ice-alum-cal-elliott"]
title = "Meet ICE Alum Cal Elliott | Institute of Culinary Education"
description = "Hillery Wheeler Hargadine has been with ICE since 2009. A graduate of ICE’s Restaurant and Culinary Management program, she was a member of the school's Admissions team — helping students to fulfill their dreams of receiving a culinary education — for ten years. Today, she works on messaging and content, authoring student profiles and supporting marketing communications. Hillery currently lives in Toyko, Japan with her husband and son, and eats as much sushi and ramen as possible."
full_description = "“If you're willing to learn, you move up really quickly. I always found that opportunities in kitchens were always there — you just have to learn how to watch and observe and be respectful. If you do all those things, you'd be amazed how quickly you learn and how quickly you're appreciated.” While Williamsburg, Brooklyn, has become an international tourist destination attracting top talent from a number of creative industries, Chef Cal Elliott was a player in the neighborhood’s food and beverage scene before, in his words, “Brooklyn became a brand.” Now a restaurateur and proud owner of the newly opened boutique hotel The Avery in downtown Boise, Idaho, the ICE graduate has seen his fair share of changes throughout his many years in some of the country’s top kitchens. Ironically, Chef Cal’s first recollection of how he got into the culinary industry relates directly to the city he was committed to getting out of — Boise. “My greatest ambition at 18 years old was to get out of Idaho,” he says. “I managed to do that and moved to New York when I was 19 and started working in restaurants — because that’s what you do when you’re a kid in New York.” Though restaurant work may be a common jumping-off point for people looking to establish themselves in the city that never sleeps, Chef Cal found the work suited him. By 1999, he was not only working in the kitchen of Dan Barber’s esteemed Blue Hill restaurant, but was also enrolled in ICE’s Culinary Arts program on the weekends. “Culinary school for me was about investing in something,” Chef Cal says. “I invested in myself and my career, so it made me take it seriously. Everyone [today] wants to feel like they know everything…just because you read or watch a YouTube video, that doesn’t mean you know how to do something.” Toward the end of his culinary program at ICE, Chef Cal externed at Diane Forster’s Verbena and later worked under Chef Tom Collichio at Gramercy Tavern. Then, a career-making job presented itself at Colin Devlin’s newly opened Dumont in Williamsburg, Brooklyn, which was quickly transforming into a culinary mecca."
year_published = 2024
