["https://ice.edu/blog/buttery-flaky-irresistible-viennoiserie"]
title = "Viennoiserie Pastries | Institute of Culinary Education"
description = "ICE Pastry & Baking Arts students at ICE have the opportunity to learn and adopt the traditional techniques of viennoiserie, which go back almost a millennium to its origins in Vienna."
full_description = "Do you love a flaky, delicate croissant? Or a sticky, sweet Danish? Meet your favorite pastry category: viennoiserie. Today, Pastry & Baking Arts students at ICE have the opportunity to learn and adopt the traditional techniques of viennoiserie, which go back almost a millennium to its origins in Vienna. The most recent viennoiserie day at ICE LA was led by Pastry & Baking Arts Chef-Instructors Carrie Smith and Jürgen David. Unlike crunchy, heartier yeasted doughs, viennoiserie breads are typically on the sweeter side, with well-known examples including cinnamon rolls and brioche. Viennoiserie relies on a particular process known as lamination, in which dough is either kneaded and pressed into sheets by hand or, for larger-scale productions, with a sheeter machine. The layers of dough are then folded over, separated by a layer of butter in what are known as envelope folds. These folds encase the butter so that it may give rise to the pastries once they are baked. But first, the sheeted dough is placed in a proofing drawer at just below 90˚F for two hours. This creates a humid environment for the dough to rise while keeping the butter at the proper temperature to prevent it from oozing out the sides or hardening within, preserving the layers. “It’s a wonderful day for students and for the chefs,” Chef Carrie says. “It’s also a day that requires close attention to structure.” For instance, a traditional Danish recipe requires more sugar than a croissant, and may even include the traditional Scandinavian spice cardamom. A Danish is also glazed in simple syrup to make it moist and give it a tantalizing shine. A croissant, on the other hand, is typically crunchier and possesses an airier, honeycomb consistency thanks to the absence of eggs. There are, of course, variations of all these pastries, as Chefs Carrie and Jürgen made a red striped, bi-color croissant with a raspberry filling. The color design denotes the type of filling — for example, a green stripe may indicate a pistachio cream filling."
year_published = 2023
