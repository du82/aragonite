["https://ice.edu/career-services-resources/partner-with-ice"]
title = "Partner With ICE | ICE Career Services | Institute of Culinary Education"
description = "ICE and Zwilling J.A. Henckels have partnered to train the next generation of culinary professionals using the highest-quality kitchen equipment. As a leader in culinary education, ICE is proud to teach students using Zwilling’s cookware, flatware and glassware."
full_description = "ICE + Zwilling ICE and Zwilling J.A. Henckels have partnered to train the next generation of culinary professionals using the highest-quality kitchen equipment. As a leader in culinary education, ICE is proud to teach students using Zwilling’s cookware, flatware and glassware.Learn More ICE + Vitamix At ICE, we’re blending culinary education with the highest quality kitchen equipment. That’s why our kitchen classrooms are equipped with Vitamix blenders — the “gold standard in the industry,” according to Chef-Instructor Robert Ramsey.Learn More ICE + Rational When it comes to oven technology, Rational is leading the charge, and we're thrilled ICE students can explore Rational's top-of-the-line kitchen equipment. ICE + meez We've developed a culinary partnership with meez, the first-of-its-kind, interactive, digital recipe tool for professional chefs, to provide unprecedented culinary technology for our on-campus and online diploma program. meez’s built-in operational empathy and myriad functionalities allow for a complementary digital education platform to help power ICE's already exceptional curriculum.Learn More ICE + IBM ICE collaborated with IBM researchers to test the limits of ingredient pairings and develop strategies to implement cognitive cooking in the culinary arts.Learn More ICE + American Express When it comes to building a successful restaurant or food business, who better to turn to than the expert consultants and Culinary Management instructors at ICE? In this four-part video series, created in collaboration with American Express, we invited aspiring and current restaurant owners to explore the world of restaurant management with tips, advice and insider information that can help ensure your success.Learn More ICE + The New York Jets An ICE cooking partnership with the New York Jets saw the school offer a series of classes that helped students take their game day dishes to the next level, whether they were tailgating or home-gating! Students cooked alongside Jets legends and players, and were trained by ICE’s all-pro chefs.Learn More"
