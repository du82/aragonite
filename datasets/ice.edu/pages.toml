["https://ice.edu/about/faculty-profiles/alan-someck"]
title = "Alan Someck | Faculty Profiles | New York Campus | ICE"
description = "Alan Someck is a Restaurant & Culinary Management Instructor at the Institute of Culinary Education (ICE) in New York City."
full_description = "Alan Someck has a bachelor's of science degree in management from Rensselaer Polytechnic Institute and a master's in social psychology from San Diego State University. He's managed restaurants and operations for Millie’s Restaurant, Keystone Hospitality Solutions and Green Restaurant Initiative, and has been awarded seven grants from the federal government and New York State to work on sustainability issues within the food industry. Alan has organized workshops and training programs for the New York State Restaurant Association and has been a speaker and author of business articles on franchising and management strategies. He's also a legal expert witness in the hospitality field. Alan began guest lecturing and substituting for other instructors at ICE in September 2008 and joined the faculty full time in 2009. He continues to work with restaurant start-ups, restaurants that need help growing or solving operational problems, and franchises. Alan also founded the Great Neck Spirits Special Olympics Basketball Program, which hosts an annual basketball tournament and runs a weekly basketball league, in 1994. For over five decades, the Institute of Culinary Education has been a leader in culinary and hospitality education. Let us help you find your culinary voice. ICE is accredited by ACCSC and licensed by BPPE (in CA) and BPSS (in NY), and is not regulated in TX under Chapter 132 of the Texas Education Code. Terms of UsePrivacy PolicyDMCA PolicyJoin the ICE TeamApplicant Privacy StatementNY Career Catalog & BrochureLA Career Catalog & BrochureLA Annual Report and School Performance Fact Sheets Bureau for Private and Postsecondary Education (BPPE) Higher Education Emergency Relief FundNondiscrimination Statement & Title IX PolicyHigher Education Consumer Information Disclosures"
