["https://ice.edu/about/faculty-profiles/anthony-caporale"]
title = "Anthony Caporale | Faculty Profiles | New York Campus | ICE"
description = "Anthony Caporale is the Director of Spirits Education at the Institute of Culinary Education (ICE) in New York City."
full_description = '''"Good bartenders always remember that the craft is not about making the drink, it’s about serving the drink." Anthony is an internationally-renowned mixology author, educator and consultant specializing in the history and science of alcoholic beverages. He has worked in the restaurant industry for his entire career, starting as a server before transitioning into bartending, and ultimately moving into manager, owner and then consulting roles. To date, Anthony has been involved in the opening or operation of more than two dozen restaurants and foodservice operations, including serving as the Beverage Manager at Bobby Flay's flagship Mesa Grill restaurant in New York City. Anthony is also the creator and host of "Art of the Drink TV," YouTube's first series about cocktails and bartending, which quickly garnered millions of loyal viewers across the globe as well as numerous awards and accolades. He has since gone on to create and host the Broadway Bartender web series which was distributed by BroadwayWorld and nominated for two Taste Awards, ultimately winning Best Drink or Beverage Program Online. He also wrote and hosted Spoon University’s acclaimed Mixology 101 video series, and was the featured Mixology Historian on The Smithsonian Channel‘s "Searching For Secrets: New York" episode. For the New York stage, Anthony launched "The Imbible" musical theatre series about the history of cocktails and spirits, which ran for six years and was among the longest-running Off-Broadway shows of all time. Additionally, Anthony has served as the Managing Editor for Chilled Magazine, the National Brand Ambassador for Drambuie Scotch Liqueur and the U.S. Cocktail Ambassador for Truvia Natural Sweetener. Anthony is currently curating an exhibit on trade and the Temperance movement at Mystic Seaport Museum, the largest maritime museum in the United States. Anthony has been a member of the ICE Culinary Management faculty for over a decade, and has taught thousands of students in hundreds of classes ranging from Bartending 101 to How to Operate a Successful Foodservice Business. He also authored the cocktail chapter of ICE's groundbreaking cookbook, "Cognitive Cooking with Chef Watson: Recipes for Innovation from IBM & the Institute of Culinary Education."'''
year_published = 2023
