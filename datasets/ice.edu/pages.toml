["https://ice.edu/blog/chef-jurgens-elegant-tiramisu-recipe"]
title = "Tiramisu Recipe by Chef Jürgen | Institute of Culinary Education"
description = "Anna Johnson is the Content Manager at the Institute of Culinary Education Los Angeles as well as a current Plant-Based Culinary Arts student. She loves telling stories about anything food- and beverage-related, with a special interest in sustainability, accessibility and advocacy within the hospitality world. Follow her culinary school journey on social media at @yumgoddess."
full_description = "Being a classic Italian dessert, this “pick me up” (that is the literal translation from Italian) is a crowd pleaser and everyone will have a strong idea about how they like their tiramisu. The basics are the same — mascarpone cheese, eggs, espresso-soaked ladyfingers (made from scratch or using the traditional Savoiardi biscuits) and a dusting of cocoa powder are the staple ingredients for this delectable treat. It's such a popular dish, that International Tiramisu Day is celebrated on March 21, and it's spawned dessert competitions just for tiramisu alone. Chef Jürgen's version utilizes a sabayon method for cooking the eggs (hello, food safety!) and a more sophisticated touch by using Marsala in the recipe. Instead of a rustic, homestyle approach, this version is made as individual servings — you are special and deserve your own small serving, no sharing necessary. Anna Johnson is the Content Manager at the Institute of Culinary Education Los Angeles as well as a current Plant-Based Culinary Arts student. She loves telling stories about anything food- and beverage-related, with a special interest in sustainability, accessibility and advocacy within the hospitality world. Follow her culinary school journey on social media at @yumgoddess. Anna Johnson is the Content Manager at the Institute of Culinary Education Los Angeles as well as a current Plant-Based Culinary Arts student. She loves telling stories about anything food- and beverage-related, with a special interest in sustainability, accessibility and advocacy within the hospitality world. Follow her culinary school journey on social media at @yumgoddess. *USA Today 2019LA Annual ReportFacts SheetsHigher Education Emergency Relief FundBureau for Private and Postsecondary EducationHigher Education Emergency Relief FundNondiscrimination Statement & Title IX PolicyHigher Education Consumer InformationBureau for Private and Postsecondary EducationDisclosuresBureau for Private and Postsecondary Education ICE is accredited by ACCSC and licensed by BPPE (in CA) and BPSS (in NY), and is not regulated in TX under Chapter 132 of the Texas Education Code."
year_published = 2024
