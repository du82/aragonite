["https://ice.edu/about/alumni-profiles/Katie-Barreira"]
title = "Katie Barreira | Institute of Culinary Education"
description = "Katie Barreira has played a pivotal role in shaping the online food landscape. While still a student at ICE, she worked an internship at Everyday with Rachel Ray, and she completed her Culinary Arts program with an externship at Food & Wine Magazine. Both ignited her passion for food media.At Everyday with Rachel Ray, Barreira climbed the ranks to become Food Editor. In this role, she combined her hands-on kitchen expertise with her editorial acumen. It was a unique fusion that proved invaluable in future endeavors.In 2015, Barreira was a key contributor in the launch of Time Inc. Food Studio, an initiative that ushered in a new era for the company and showcased her vision within the evolving food media landscape. Following the acquisition of Time Inc. by Meredith Corp., Barreira continued to lead as Test Kitchen Director for Meredith Food Studios.As Test Kitchen Director at what soon became Dotdash Meredith, Barreira oversaw a network of recipe sites, among them Allrecipes.com and The Spruce Eats. Her team is responsible for the creation, testing and tasting of countless recipes, and ensuring that home cooks everywhere find success in the kitchen. This extensive network also supports content development for a diverse range of publications, from Food & Wine and Southern Living, to People and Cooking Light (now merged with EatingWell).Barreira's contributions have impacted the way millions of people cook. Her dedication to quality and innovation has solidified her position as a leading figure in the world of online food media."
