full_description = "Fabio Pari-di-Monriva brings over 20 years of experience in the hospitality field to ICE's Tourism, Travel & Hospitality Management program. A graduate of the University of Massachusetts at Amherst with a Masters in Business Administration - Global Management, Mr. Pari-di-Monriva has worked at a number of major hotel brands across the country including the Residence Inn by Marriott (Treasure Island, FL), NYLO Hotels (Warwick, RI) and Hilton (Hartford, CT). Mr. Pari-di-Monriva's skill set includes managing small- to mid-sized projects consisting of renovations, pre-opening and procurement. He is experienced with properties ranging from select-service to independent, boutique properties. Currently the General Manager of Le Meridien's gorgeous Central Park location in New York City, as well as the Founder of SHYFT, an executive search and hospitality consultancy specializing in premium and luxury hotels, Mr. Pari-di-Monriva is excited to share his knowledge with ICE students. For over five decades, the Institute of Culinary Education has been a leader in culinary and hospitality education. Let us help you find your culinary voice. ICE is accredited by ACCSC and licensed by BPPE (in CA) and BPSS (in NY), and is not regulated in TX under Chapter 132 of the Texas Education Code. Terms of UsePrivacy PolicyDMCA PolicyJoin the ICE TeamApplicant Privacy StatementNY Career Catalog & BrochureLA Career Catalog & BrochureLA Annual Report and School Performance Fact Sheets Bureau for Private and Postsecondary Education (BPPE) Higher Education Emergency Relief FundNondiscrimination Statement & Title IX PolicyHigher Education Consumer Information Disclosures"
