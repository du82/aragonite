rivilege to work with students of all ages and backgrounds, united in taking the brave step to follow their interests, the creativity that results from such a diverse student body and the chance to sample delicious fine cuisine dailyBest thing I ever ate: Ask me on different days and you are sure to get different answers, but the experience that springs to mind is Capital City Bakery in Austin, Texas — a 100% vegan bakery with delicious treats!"
