["https://ice.edu/about/alumni-profiles/allison-vines-rushing"]
title = "Allison Vines-Rushing | Consulting | Alumni Profiles | NY Campus| ICE"
description = "Born in Louisiana and raised in Florida, Allison Vines-Rushing graduated from Florida State at Tallahassee with a bachelor’s degree in biology. After graduating, she moved to New York City to attend ICE. Allison explored her southern roots as an extern at New Orleans’ venerable Brennan’s and worked at Gerrard’s Downtown. Then she headed back to New York City in 2001, working at Picholine and four-star Alain Ducasse. In 2003, she was the opening chef at Jack’s Luxury Oyster Bar. In 2004, she received the James Beard Foundation’s Rising Star Chef of the Year Award. She moved back to the New Orleans with her husband, Chef Slade Rushing, in 2005, where they own and operate MiLa, featuring seasonal produce from local farms. She currently works as a culinary consultant."
full_description = "Deciding to attend school in New York was one of the best decisions I’ve made career-wise. It gave me the confidence to remain in the culinary scene. Born in Louisiana and raised in Florida, Allison Vines-Rushing graduated from Florida State at Tallahassee with a bachelor’s degree in biology. After graduating, she moved to New York City to attend ICE. Allison explored her southern roots as an extern at New Orleans’ venerable Brennan’s and worked at Gerrard’s Downtown. Then she headed back to New York City in 2001, working at Picholine and four-star Alain Ducasse. In 2003, she was the opening chef at Jack’s Luxury Oyster Bar. In 2004, she received the James Beard Foundation’s Rising Star Chef of the Year Award. She moved back to the New Orleans with her husband, Chef Slade Rushing, in 2005, where they own and operate MiLa, featuring seasonal produce from local farms. She currently works as a culinary consultant. For over five decades, the Institute of Culinary Education has been a leader in culinary and hospitality education. Let us help you find your culinary voice. ICE is accredited by ACCSC and licensed by BPPE (in CA) and BPSS (in NY), and is not regulated in TX under Chapter 132 of the Texas Education Code. Terms of UsePrivacy PolicyDMCA PolicyJoin the ICE TeamApplicant Privacy StatementNY Career Catalog & BrochureLA Career Catalog & BrochureLA Annual Report and School Performance Fact Sheets Bureau for Private and Postsecondary Education (BPPE) Higher Education Emergency Relief FundNondiscrimination Statement & Title IX PolicyHigher Education Consumer Information Disclosures"
