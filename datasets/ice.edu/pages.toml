["https://ice.edu/about/alumni-profiles/Meredith-Hayden"]
title = "Meredith Hayden | Institute of Culinary Education"
description = '''Chef Meredith Hayden, known online as Wishbone Kitchen, is a multi-faceted culinary personality. A content creator, recipe developer, private chef and cookbook author, Hayden's career trajectory is marked by a blend of passion and ambition.After graduating from Clemson University, she pursued a career in ad sales at Vogue while simultaneously attending ICE’s Culinary Arts program in the evenings. Following an externship at the acclaimed New York restaurant Charlie Bird, she leveraged ICE's alumni resources to secure a position as a private chef for fashion designer Joseph Altuzarra. This role provided the foundation for her burgeoning culinary empire.Under the Wishbone Kitchen brand, Hayden has cultivated a strong online presence, sharing her expertise on a wide range of topics, from ingredient selection and recipe development to dinner party planning, table settings, and even fashion. Her popular YouTube series, "Dinner with Friends," showcases her culinary skill and entertaining style, and features celebrity guests like Joe Jonas and Ed Sheeran.Hayden's debut cookbook, "The Wishbone Kitchen Cookbook: Seasonal Recipes for Everyday Luxury and Elevated Entertaining," is set to be released in May 2025.Hayden’s influence extends beyond her own platforms. She has been featured in prominent publications such as Vogue, Bon Appétit, The New York Times, Business Insider and Cherry Bombe. In recognition of Hayden’s innovative approach to culinary storytelling, Cherry Bombe included her on their "Future of Food 50" list, which celebrates individuals shaping the future of the food world. Additionally, Forbes named her to their "30 Under 30" list in 2025, acknowledging her significant accomplishments at a young age.'''
