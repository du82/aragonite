title = "Recreational Chef Instructor | Careers at ICE | New York Campus | ICE"
description = "The Institute of Culinary Education (ICE) is looking for a Recreational Chef Instructor for our New York campus."
full_description = "The Institute of Culinary Education, New York City Campus, is seeking a weekend Recreational Chef-Instructor. The chef will be responsible for leading the hands-on recreational cooking classes in conformity with ICE proprietary class lessons. The chef will be responsible for ensuring that the highest quality food service and experience for clients are consistently delivered. The Institute of Culinary Education (ICE) is one of the largest and most diverse culinary schools in the world with campuses in New York and Los Angeles. Established in 1975, ICE offers award-winning six to 13-month career training programs in Culinary Arts, Pastry & Baking Arts, Plant-Based Culinary Arts, Restaurant & Culinary Management, and Hospitality & Hotel Management, in addition to professional development in Artisan Bread Baking and The Art of Cake Decorating — with more than 14,000 alumni, many of whom are leaders in the industry. ICE also offers continuing education for culinary professionals, hosts 400 special events each year and is home to one of the world’s largest recreational cooking, baking and beverage programs with 26,000 students annually. ICE’s 74,000-square-foot, cutting-edge campus in New York City and its 38,000-square-foot Los Angeles campus were designed for inspiration, creativity and community. ICE continues to grow and evolve with the launch of its LA campus in 2018, the addition of the Natural Gourmet Center in 2019 and the agreement with the International Culinary Center in 2020. Visit us at ice.edu or join us on Instagram, Facebook, Twitter and YouTube at @iceculinary to find your culinary voice™."
