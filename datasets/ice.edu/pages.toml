full_description = "The award-winning Institute of Culinary Education (ICE) is seeking a part-time Chef Assistant (CA). The role of the Chef Assistant provides support to the Recreational and Special Events Departments. Tasks include but are not limited to the following: Assisting the Chef by delivering ingredients and equipment, setting up and breaking down workspaces, cleaning and resetting workspaces and interacting with guests.This position requires weekend and evening availability. The award-winning Institute of Culinary Education (ICE) was established in 1975 and has since grown to be one of America’s leading centers for culinary education and recreational cooking. ICE offers comprehensive career training programs in the Culinary Arts, Pastry & Baking Arts, Plant-Based Culinary Arts, Restaurant & Culinary Management and Hospitality & Hotel Management. ICE also operates the nation’s largest recreational cooking, baking and wine program. Our alumni run top kitchens around the globe, winning awards and transforming the future of culinary innovation. Ninety-two percent report that their ICE education has proved somewhat or very important to their careers. For more information about ICE, please visit our website at ice.edu or connect with us @iceculinary on Instagram, Facebook, Twitter and YouTube."
