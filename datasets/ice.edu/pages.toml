["https://ice.edu/about/alumni-profiles/Adeena-Sussman"]
title = "Adeena Sussman | Institute of Culinary Education"
description = '''Adeena Sussman is a cookbook author, food writer and culinary expert celebrated for her flavorful recipes inspired by Israeli cuisine. Born and raised in the San Francisco Bay Area, Sussman credits her love of food and cooking to a childhood spent in the kitchen with her mother. After college, Sussman experienced firsthand the vibrancy of Israeli cuisine when she moved to Jerusalem, taking a job in television production. When she returned to New York, Sussman focused on food writing and landed a job at Gourmet. She then enrolled in ICE’s Culinary Arts program to further her expertise. This path led Sussman to co-authoring cookbooks with Chrissy Teigen and Sprinkles Cupcakes founder Candace Nelson, and ultimately, authoring her own cookbooks.Sussman's solo debut, "Sababa: Fresh, Sunny Flavors From My Israeli Kitchen," was a critical and commercial success, earning praise for its accessible recipes. Her subsequent cookbook, "Shabbat: Recipes and Rituals From My Table to Yours," went deeper into the traditions and flavors of Shabbat (the Jewish Sabbath) and was an immediate New York Times Bestseller.Adeena Sussman's contributions to the culinary world have made Israeli cuisine more visible and prolific. Her passion for food, combined with her talent for storytelling and recipe development, continues to inspire home cooks and food enthusiasts alike. Read More about Alumni Adeena Sussman on the ICE Blog'''
full_description = '''Adeena Sussman is a cookbook author, food writer and culinary expert celebrated for her flavorful recipes inspired by Israeli cuisine. Born and raised in the San Francisco Bay Area, Sussman credits her love of food and cooking to a childhood spent in the kitchen with her mother. After college, Sussman experienced firsthand the vibrancy of Israeli cuisine when she moved to Jerusalem, taking a job in television production. When she returned to New York, Sussman focused on food writing and landed a job at Gourmet. She then enrolled in ICE’s Culinary Arts program to further her expertise. This path led Sussman to co-authoring cookbooks with Chrissy Teigen and Sprinkles Cupcakes founder Candace Nelson, and ultimately, authoring her own cookbooks. Sussman's solo debut, "Sababa: Fresh, Sunny Flavors From My Israeli Kitchen," was a critical and commercial success, earning praise for its accessible recipes. Her subsequent cookbook, "Shabbat: Recipes and Rituals From My Table to Yours," went deeper into the traditions and flavors of Shabbat (the Jewish Sabbath) and was an immediate New York Times Bestseller. Adeena Sussman's contributions to the culinary world have made Israeli cuisine more visible and prolific. Her passion for food, combined with her talent for storytelling and recipe development, continues to inspire home cooks and food enthusiasts alike. For over five decades, the Institute of Culinary Education has been a leader in culinary and hospitality education. Let us help you find your culinary voice. ICE is accredited by ACCSC and licensed by BPPE (in CA) and BPSS (in NY), and is not regulated in TX under Chapter 132 of the Texas Education Code. Terms of UsePrivacy PolicyDMCA PolicyJoin the ICE TeamApplicant Privacy StatementNY Career Catalog & BrochureLA Career Catalog & BrochureLA Annual Report and School Performance Fact Sheets Bureau for Private and Postsecondary Education (BPPE) Higher Education Emergency Relief FundNondiscrimination Sta