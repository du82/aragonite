["https://ice.edu/admissions/housing/student-housing-form-disclaimer"]
title = "Student Housing | Housing Form and Housing Disclosure | Institute of Culinary Education"
description = "Learn about our housing options at the Institute of Culinary Education! ICE is one of the top culinary arts schools in America and has locations in NYC & LA. Find your culinary voice today!"
full_description = "The housing and housing assistance referred to on this Webpage, videos and as part of this program is not being provided by the Institute of Culinary Education (“ICE”), but is provided by several companies that specialize in providing housing on a short-term and long-term basis in the New York City and Los Angeles Metropolitan Areas (the “Housing Companies”). While ICE believes that these Housing Companies are reputable, ICE is not affiliated with them, has not conducted any background investigation into them, does not control them or their employees or representatives, and is not responsible or liable for their actions or omissions or any representations or recommendations that they may make. ICE is not an agent for any of the Housing Companies and has no authority to bind, or act on behalf of, any of them. None of the Housing Companies or their respective employees or agents is an agent of ICE and none of them has any authority to bind or act on behalf of ICE. The Housing Companies may directly provide housing to you as a landlord, or they may simply arrange for you to rent housing from a third-party landlord or share a room with another tenant or owner of a home. You may be required to enter into verbal or written leases, agreements or arrangements with the Housing Companies, the landlords and/or others as a condition of securing housing. ICE strongly advises you to carefully review and make sure that you understand any agreement or arrangement before signing it or otherwise committing yourself. If you have any questions regarding any agreement or other arrangement, we recommend that you check with a qualified attorney before agreeing to the terms. If you are not comfortable with any terms, conditions or agreements provided by a Housing Company, you should not agree to such housing arrangement. Please be aware that ICE does not assume any responsibility for any agreement, arrangement or other understanding that you may enter into with any Housing Company, any landlord, or anyone else."
