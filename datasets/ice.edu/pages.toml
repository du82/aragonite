["https://ice.edu/about/faculty-profiles/louis-eguaras-0"]
title = "Louis Eguaras | Institute of Culinary Education"
description = "Louis Eguaras has been working in the culinary industry for over 30 years in a variety of roles, ranging from executive chef to author to motivational speaker.Chef Eguaras served in the U.S. Navy for over six years, during which he cooked for two former presidents. Chef Eguaras was the chef and guest relations coordinator for former President George H. W. Bush, Sr. at the Camp David Presidential Retreat before serving as one of the White House chefs to former President Bill Clinton for over two years. He worked as the personal chef for Admiral Ronald J. Zlatoper, who was the Commander-in-Chief of the U.S. Navy Pacific Fleet from 1994 to 1996.After his time in the Navy, Chef Eguaras has since worked in marketing, as a business consultant, as a motivational speaker and executive chef. He has been working in educational institutions as a chef-instructor since 2005 and wrote the book 101 Things I Learned in Culinary School, the second edition of which was published in 2020.Chef Eguaras holds a Bachelor's Degree in Hospitality and Restaurant Management from New England Culinary Institute."
