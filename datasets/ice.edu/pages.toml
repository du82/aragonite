["https://ice.edu/blog/how-make-herb-laminated-pasta-dough"]
title = "How to Make Herb-Laminated Pasta Dough | Institute of Culinary Education"
description = "Cory Sale is the Senior Public Relations Manager at ICE and an alumna (Culinary Arts '22). She enjoys writing about seasonal produce almost as much as visiting NYC’s greenmarkets, where she finds new flavors to add to ice cream. When she’s not cooking (or eating), you can find her on the frisbee field chasing down a piece of plastic."
full_description = "With just one technique, a simple pasta can turn into a piece of abstract art, dancing with pops of color. The secret to creating these colorful doughs is lamination. Though you might associate “laminated doughs” with croissants, Danishes, and puff pastry, culinary chefs can also use lamination to elevate pasta. When laminating pastry dough, a block of fat becomes encased inside the dough through folding and rolling, which results in delicate, flaky layers once baked. Laminated pasta dough follows a similar method, and those luscious layers can be used to add some flair. When making laminated pasta dough, the chef can embed colorful herbs and flowers between two sheets of pasta, which are rolled together and then shaped. The process is endlessly customizable and the result is pasta freckled with vibrant petals and colorful leaves. Director of Culinary Affairs Hervé Malivert loves to make laminated pasta dough, so read on for his expert tips. Adding a botanical element to pasta dough through lamination adds another dimension to the plate — remember, we eat with our eyes first. He suggests using shapes like ravioli or pappardelle to showcase the colorful add-ins, as narrower noodles and stuffed shapes like fettuccine or tortellini won't show their colors well. It’s also important to consider the sauce. While a wide noodle like lasagna may seem like the perfect canvas, once the noodle is stacked and buried under red sauce, the design disappears. When making laminated pastas, Chef Hervé likes to make a simple butter sauce with shallot, garlic, and a single tomato to let the dough shine. Chef Hervé used pasta dough enriched with eggs to make the dough in these photos, but semolina dough can also be used with this technique. ICE’s Hydroponic Garden grows over 80 different types of plants in water, so Chef Hervé has many options to choose from to decorate his laminated pastas. The garden has cherry tomatoes, yellow strawberries, micro greens, herbs and flowers. Plus, the farm's manager is always open to suggestions for new plants to grow. Students at the New York campus can visit the Hydroponic Garden at any time to taste and volunteer."
year_published = 2024
