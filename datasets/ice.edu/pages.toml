["https://ice.edu/about/alumni-profiles/anthony-scotto"]
title = "Anthony Scotto | Alumni Profiles | Institute of Culinary Education"
description = "Anthony Scotto did his externship at Lupa Osteria Romana, and continued to work as part of the Batali-Bastianich restaurant empire, eventually rising to Chef de Cuisine at Del Posto. Scotto then joined Michael White’s AltaMarea Group, which launched Campagna restaurant in the Richard Gere-owned, Relais & Chateaux property Bedford Post Inn in Westchester, of which Scotto was Executive Sous Chef. After Bedford Post Inn, Scotto went abroad to Milan, Italy, to open a Joe Bastianich project, Ricci, as Executive Chef. Now, he is back stateside in Hudson, NY, working as Chef de Cuisine for the critically-acclaimed Fish & Game. When asked about his culinary voice, he says, “ICE gave me the opportunity to quickly get my degree and move into the culinary field within a year. The instructors guided me to an appropriate extern site that fit my abilities, and cuisine I wanted to be a part of.”"
