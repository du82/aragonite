["https://ice.edu/career-services-resources/career-services/job-placement"]
title = "Job Placement | ICE Career Services | Institute of Culinary Education"
description = "During individual sessions throughout your time at ICE, our advisors offer assistance in résumé writing, interview skills and other opportunities for professional development. Volunteer opportunities with chefs and other food professionals provide additional networking and real-world experience to students during their studies.As graduation nears, our Career Services Department works closely with you in developing your professional presence and matching your skills, goals and personality with restaurant positions and hospitality careers offered by our extensive employer network."
full_description = "Individual Attention During individual sessions throughout your time at ICE, our advisors offer assistance in résumé writing, interview skills and other opportunities for professional development. Volunteer opportunities with chefs and other food professionals provide additional networking and real-world experience to students during their studies.As graduation nears, our Career Services Department works closely with you in developing your professional presence and matching your skills, goals and personality with restaurant positions and hospitality careers offered by our extensive employer network. An Extensive Network Even as you advance through your career, the doors of our Career Services Department remain open to all alumni — regardless of your graduation date. Our ever-expanding network stays with you after graduation. As an ICE alum, you’ll receive a weekly email with information about culinary career resources as well as a list of new hospitality and food job openings, including everything from entry-level positions to advanced roles and new business opportunities. (If you are an ICE graduate who would like to receive these postings, please click here.)ICE also serves our alumni in a variety of other ways, including helping you hire staff at your own food establishment and by extending invites to our on-site career fairs and networking opportunities. Careers Inside and Outside the Kitchen ICE alumni have attained important positions inside the kitchen, including executive chef, pastry chef, sous chef, baker, chef de cuisine and garde manger positions. Many have also become chef-owners, restaurateurs and general managers. Outside the kitchen, career opportunities range from journalism to retail, catering and event management. ICE graduates are succeeding in beverage and mixology positions, marketing, research, private cooking and more."
