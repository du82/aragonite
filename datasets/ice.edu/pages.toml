["https://ice.edu/about/faculty-profiles/barbara-rich"]
title = "Barbara Rich | Institute of Culinary Education"
description = "Barbara Rich studied at the California Culinary Academy before three years of kitchen experience as assistant sous chef at Zuni Café in San Francisco."
full_description = '"Teaching health-supportive cooking makes us more thoughtful about the choices we make, not always leaning on the usual suspects in the kitchen." Barbara Rich studied at the California Culinary Academy before three years of kitchen experience as assistant sous chef at Zuni Café in San Francisco. She moved to New York in 1997 and worked all stations as a roundperson at The Lobster Club, followed by prep, staff training and ordering experience as a chef at Savoy Restaurant. In 2000, Chef Barbara was named executive chef at Danal Restaurant, where she created recipes, developed menus and oversaw the kitchen staff. In 2003, she gained catering experience with Creative Edge Parties, where she was a chef for six years before consulting and teaching. Chef Barbara began teaching culinary arts as an adjunct at Hudson County College in Jersey City, then spent four years as a chef instructor at the Art Institute of New York. In January 2005, she moved to the Natural Gourmet Institute for Health and Culinary Arts, where she took on many roles, managing internships and alumni relations, in addition to instructing. Chef Barbara comes to ICE with more than a decade of experience teaching culinary skills with a health-supportive framework, including vegetarian and vegan cooking. She has a wealth of expertise on medicinal uses for food and health-based diets and intimate familiarity with Natural Gourmet’s unique curriculum. “Teaching culinary is so important to me, and not just because I want people to have skills,” says Chef Barbara. “I want to have the students leave the program feeling empowered and confident about their future, whatever that brings." Outside of the kitchen, Chef Barbara is an avid endurance athlete, competing in half ironmans and ultra-running. For over five decades, the Institute of Culinary Education has been a leader in culinary and hospitality education. Let us help you find your culinary voice. ICE is accredited by ACCSC and licensed by BPPE (in CA) and BPSS (in NY), and is not regulated in TX under Chapter 132 of the Texas Education Code.'
