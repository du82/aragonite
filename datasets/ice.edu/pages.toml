description = "Meet The Culinary Entrepreneurs is an exclusive ICE lecture series featuring some of America's top food business experts. Held throughout the year at both ICE campuses (and streamed live for online students), these sessions introduce students and the public to the world’s leading chefs, restaurateurs, specialty food retailers, caterers and other culinary business proprietors who have established highly regarded national and international brands. The ongoing series was designed to complement ICE’s Restaurant & Culinary Management program, which trains students with career goals of owning or operating a restaurant or other food business."
full_description = '''Meet the Culinary Entrepreneurs Meet The Culinary Entrepreneurs is an exclusive ICE lecture series featuring some of America's top food business experts. Held throughout the year at both ICE campuses (and streamed live for online students), these sessions introduce students and the public to the world’s leading chefs, restaurateurs, specialty food retailers, caterers and other culinary business proprietors who have established highly regarded national and international brands. The ongoing series was designed to complement ICE’s Restaurant & Culinary Management program, which trains students with career goals of owning or operating a restaurant or other food business. Guest Chef Series ICE regularly hosts masters of technique and cuisine from highly acclaimed restaurants (many of them Michelin-starred) to demonstrate select dishes on campus. Students and alumni get to meet and watch some of the industry’s most talented chefs, who share the stories behind their approaches and styles in an intimate setting conducive to career-inspiring conversations. 02.26.25AlumniICE at 50: Meet Dr. Nate Wood, ICE Alum and the Man Teaching "Food as Medicine" at Yale Medical School 02.18.25NewsVital Names: James Hemings, America's First French-Trained Chef, Introduced Americans To Their Favorite Foods'''
