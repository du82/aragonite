["https://ice.edu/about/alumni-profiles/amy-thielen"]
title = "Amy Thielen | Alumni Profiles | Institute of Culinary Education"
description = 'Amy Thielen was living in a cabin in the woods of Minnesota, “growing a garden, canning and working part-time as a breakfast cook at a diner," when she realized she wanted to go to culinary school. For her, ICE was a good fit for a number of reasons: the cost was reasonable, the New York City setting was appealing and she just felt at ease in the school.After being hired from her externship at David Bouley’s Austrian restaurant Danube, Amy went on to work on a number of projects, including recipe testing for Bouley’s cookbook, East of Paris, as well as cooking in some of New York City’s top kitchens, including db Bistro Modern, Jean Georges Vongerichten’s Chinese restaurant, 66, and Cru. When she became pregnant with her son, Amy began to pursue freelance work in test kitchens, developing recipes for magazines like Country Living.Amy then took a step back from city life, relocating to her cabin in the woods of Minnesota with her husband and newborn son. It was then that she began to put pen to paper for the proposal of her cookbook, The New Midwestern Table, which was published in 2013.The New Midwestern Table caught the attention of another cookbook author: celebrity chef Lidia Bastianich. Lidia’s production company, Tavola, wanted to produce a television show loosely based on the book, and soon Food Network came knocking. Two seasons of Heartland Table—filmed at Amy’s Minnesota cabin—have aired so far.Amy recently published a food memoir, Give a Girl a Knife, and is a contributing editor at Saveur.'
full_description = 'Amy Thielen was living in a cabin in the woods of Minnesota, “growing a garden, canning and working part-time as a breakfast cook at a diner," when she realized she wanted to go to culinary school. For her, ICE was a good fit for a number of reasons: the cost was reasonable, the New York City setting was appealing and she just felt at ease in the school. After being hired from her externship at David Bouley’s Austrian restaurant Danube, Amy went on to work on a number of projects, including recipe testing for Bouley’s cookbook, East of Paris, as well as cooking in some of New York City’s top kitchens, including db Bistro Modern, Jean Georges Vongerichten’s Chinese restaurant, 66, and Cru. When she became pregnant with her son, Amy began to pursue freelance work in test kitchens, developing recipes for magazines like Country Living. Amy then took a step back from city life, relocating to her cabin in the woods of Minnesota with her husband and newborn son. It was then that she began to put pen to paper for the proposal of her cookbook, The New Midwestern Table, which was published in 2013. The New Midwestern Table caught the attention of another cookbook author: celebrity chef Lidia Bastianich. Lidia’s production company, Tavola, wanted to produce a television show loosely based on the book, and soon Food Network came knocking. Two seasons of Heartland Table—filmed at Amy’s Minnesota cabin—have aired so far. For over five decades, the Institute of Culinary Education has been a leader in culinary and hospitality education. Let us help you find your culinary voice. ICE is accredited by ACCSC and licensed by BPPE (in CA) and BPSS (in NY), and is not regulated in TX under Chapter 132 of the Texas Education Code. Terms of UsePrivacy PolicyDMCA PolicyJoin the ICE TeamApplicant Privacy StatementNY Career Catalog & BrochureLA Career Catalog & BrochureLA Annual Report and School Performance Fact Sheets Bureau for Private and Postsecondary Education (BPPE) 