["https://ice.edu/about/alumni-profiles/anthony-sasso"]
title = "Anthony Sasso |Alumni Profiles | Institute of Culinary Education"
description = "After graduating from college in New York City, Anthony Sasso travelled to Spain to explore his ancestral roots. He fell in love with the food and returned to New York City to enroll in ICE. He eventually found himself at Bar Jamón before becoming a prep cook at Casa Mono. After a year, he returned to Spain to work at the famed El Hogar Gallego. Learning as much as he could about authentic Spanish cuisine and local Catalan specialties, Sasso brought his skills back to the kitchen at Casa Mono. He began the restaurant's butchery and in-house curing programs. In 2008, he was promoted to Chef de Cuisine. In 2009, Casa Mono earned its first-ever Michelin star under his leadership. In 2017 he joined the La Sirena team as Executive Chef."
full_description = "After graduating from college in New York City, Anthony Sasso travelled to Spain to explore his ancestral roots. He fell in love with the food and returned to New York City to enroll in ICE. He eventually found himself at Bar Jamón before becoming a prep cook at Casa Mono. After a year, he returned to Spain to work at the famed El Hogar Gallego. Learning as much as he could about authentic Spanish cuisine and local Catalan specialties, Sasso brought his skills back to the kitchen at Casa Mono. He began the restaurant's butchery and in-house curing programs. In 2008, he was promoted to Chef de Cuisine. In 2009, Casa Mono earned its first-ever Michelin star under his leadership. In 2017 he joined the La Sirena team as Executive Chef. For over five decades, the Institute of Culinary Education has been a leader in culinary and hospitality education. Let us help you find your culinary voice. ICE is accredited by ACCSC and licensed by BPPE (in CA) and BPSS (in NY), and is not regulated in TX under Chapter 132 of the Texas Education Code. Terms of UsePrivacy PolicyDMCA PolicyJoin the ICE TeamApplicant Privacy StatementNY Career Catalog & BrochureLA Career Catalog & BrochureLA Annual Report and School Performance Fact Sheets Bureau for Private and Postsecondary Education (BPPE) Higher Education Emergency Relief FundNondiscrimination Statement & Title IX PolicyHigher Education Consumer Information Disclosures"
