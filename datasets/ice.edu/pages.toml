["https://ice.edu/admissions/school-counselors"]
title = "School Counselors | ICE Admissions | Institute of Culinary Education"
description = "Our events are great ways for you and your students to get to know ICE. Check out the upcoming open houses for programs on ICE’s New York and Los Angeles campuses, as well as virtual open houses for our online career programs and upcoming guest lectures and panels."
full_description = "You’ve Come to the Right Place ICE has launched more than 17,900 careers in the food world and produced generations of satisfied parents, counselors and students along the way. We couple individualized training with the extensive career placement services in the field, arranging hands-on externships at the industry's top food establishments and providing professional support to our graduates long after they leave our teaching kitchens. In short, our mission is to help each student find his or her culinary voice. A Schedule and Curriculum for Every Student ICE offers comprehensive diploma and associate degree programs (LA campus only) in the Culinary Arts, Pastry & Baking Arts, and Plant-Based Culinary Arts (formerly known as Health-Supportive Arts. We also offer diploma programs for Restaurant & Culinary Management and Tourism, Travel & Hospitality Management, all of which can be completed in just seven to 14 months. We have convenient morning, afternoon, evening and weekend classes starting each month throughout the calendar year. Our 74,000-square-foot professional facility in New York and our 38,000-square-foot professional facility in Los Angeles feature small, hands-on classes with attentive, distinguished chef-instructors. Students enjoy a global tour of culinary traditions and techniques and access to the highest quality ingredients, sourced from the same purveyors that cater to NYC and LA’s finest restaurants. In 2021, ICE also began offering students in select states the opportunity to enroll in online culinary arts programs. Join the Network To request information to share with your students and colleagues, you can email schoolcounselors@ice.edu or call (888) 997-CHEF for ICE’s New York campus or email LAadmissions@ice.edu or call (888) 718-CHEF for ICE’s Los Angeles campus. Our ICE School Counselor Coordinators will be happy to set up a personal or group tour of the school for you and your students, or provide detailed answers to any further questions you may have."
year_published = 2025
