["https://ice.edu/about/alumni-profiles/christina-delli-santi"]
title = "Christina Delli Santi | Alumni Profiles | Institute of Culinary Education"
description = "After high school, Christina attended cosmetology school and embarked on a successful career as a hairdresser and salon manager. When a new opportunity arose, Christina decided it was time to change course and pursue her passion for hospitality, which led her to enroll at ICE. Christina did her externship at the popular gastropub located inside New York City’s Ace Hotel, The Breslin, where she landed a full-time job upon graduation. When a position opened up in the front office of the Ace Hotel, Christina jumped at the opportunity, and in just two years, worked her way up to director of front office, followed by brand relationship manager.In 2019, Christina made the leap to general manager of Urban Cowboy Lodge, opening in 2020 in The Catskills."
