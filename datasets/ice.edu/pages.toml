["https://ice.edu/about/our-story/ice-gives-back"]
title = "ICE Gives Back | About ICE | Institute of Culinary Education"
description = "Learn about how we give back at the Institute of Culinary Education. ICE is one of the top culinary arts schools in America with locations in NYC & LA, and programs online. Find your culinary voice today!"
full_description = "At its core, hospitality is about giving. We are therefore not surprised, and always impressed, by the contributions of time, money and food that we see chefs and restaurants making to a wide range of charities. As a leader in the culinary and hospitality training field, we think it is important that ICE does more than our share to give back. We hope to be role models and inspire our students, customers and other schools and companies in this regard. To achieve these goals, we give money, time, energy and space at the school. We also give scholarships and logistical support to help others raise funds, and much, much more. CITY HARVEST City Harvest is one of the country’s oldest and most well-known food rescue organizations. City Harvest has rescued, received and delivered millions of pounds of food to help address hunger and food budget issues faced by the millions of Americans who live at or below the poverty level. ICE Chairman and CEO Rick Smilow is a City Harvest board member. ICE assists City Harvest with fundraising by hosting donor development events, donating cooking parties as auction items and co-sponsoring one of the organization’s trucks. Additionally, the Smilow family has made a major gift to help enable City Harvest to support the organization’s warehouse and food rescue facility in Brooklyn, New York. ICE also donates food and ingredients to City Harvest on a daily basis and is now the organization’s “top school donor.” ACTION AGAINST HUNGER (AAH) As an international food relief agency, AAH focuses on hunger relief, clean water and sanitation programs throughout Africa and Asia. ICE Chairman and CEO Rick Smilow was on the Board of Advisors of AAH. Over the years, ICE has, in part or whole, catered donor development events for AAH and contributed classes and parties for fundraising auctions. In the wake of many of the most broad reaching natural disasters, ICE’s administration, Chef-Instructors and students have a strong track record of pulling together to raise funds for the people and communities who lost the most."
year_published = 2025
clearnet = "https://ice.edu/about/our-story/ice-gives-back"
