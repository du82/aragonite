["https://ice.edu/about/faculty-profiles/brian-konopka"]
title = "Brian Konopka | Institute of Culinary Education"
description = "Brian Konopka is an experienced food and beverage professional, chef and founder with a demonstrated history of success in the hospitality industry. Skilled in food and beverage operations, concept development, facilities design, multi-unit expansion and brand building, Brian is a well-rounded hospitality executive with a background spanning in fine dining, multi-unit and fast casual concepts in the United States and abroad. A graduate of both the Culinary Institute of America and the New England Culinary Institute, Brian’s extensive resumé includes stints at the famed Windows on the World (where he was Chef De Partie Saucier), as well as Le Cirque at the Bellagio in Las Vegas, where he received Best New Restaurant from Food & Wine magazine. Brian is also the Founder and CEO of Kobeyaki Restaurants, a fast-casual concept based in New York."
