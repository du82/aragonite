full_description = "Whether you’re looking to attend our on-campus programs in New York and Los Angeles, or our online programs, you’re just a few short steps away from becoming part of the ICE family and kickstarting your new career based on passion and creativity. Simply submit your application – it takes less than 10 min for most students – and you’ll be on your way! We also encourage you to have a quick chat with an ICE Admissions Representative; they’re here to learn more about you, answer any questions you may have about the school, our programs, courses and the enrollment process. Apply Here. The Institute of Culinary Education has classes starting throughout the year and does not require any particular GPAs, standardized tests or references to be admitted. What you will need to provide is simply: Non-US citizens will also need to prove their residency status/provide a current visa or follow the steps to apply for a student visa through ICE as well as proof of language proficiency. You can find all the details about required documents in our international student guidelines. For full details about acceptable education documents, visit our Admissions page ICE’s Office of Student Financial Services is a full team dedicated to guiding you to the best and easiest financing options so you can make your culinary school dreams a reality. Financing options include: With a wide variety of financing options and an ICE admissions team that is committed to keeping enrollment simple and straightforward, there’s no reason to wait! Start your application today and see where your Culinary Voice can take you. For over five decades, the Institute of Culinary Education has been a leader in culinary and hospitality education. Let us help you find your culinary voice. ICE is accredited by ACCSC and licensed by BPPE (in CA) and BPSS (in NY), and is not regulated in TX under Chapter 132 of the Texas Education Code. Terms of UsePrivacy PolicyDMCA PolicyJoin the ICE TeamApplicant Privacy StatementNY Career Catalog & BrochureLA Career Catalog & BrochureLA Annual Report and School Performance Fact Sheets Bureau for Private and Postsecondary Education (BPPE) Higher Education Emergency Relief FundNondiscrimination Statement & Title IX PolicyHigher Education Consumer Information Disclosures"
