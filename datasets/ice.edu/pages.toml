["https://ice.edu/continuing-education"]
title = "Culinary Arts Continuing Education | Institute of Culinary Education"
description = "This rigorous course offers students a thorough training in essential wine education topics, from tasting to wine history to service. Upon graduating, students will sit the Court of Master Sommelier (CMS) Introductory and Certified Sommelier examinations onsite. This course, which is the only course approved by the Court of Master Sommeliers, Americas, is right for both culinary professionals who are looking to deepen their wine knowledge as well as serious wine enthusiasts with no prior culinary training."
full_description = "Intensive Sommelier Training This rigorous course offers students a thorough training in essential wine education topics, from tasting to wine history to service. Upon graduating, students will sit the Court of Master Sommelier (CMS) Introductory and Certified Sommelier examinations onsite. This course, which is the only course approved by the Court of Master Sommeliers, Americas, is right for both culinary professionals who are looking to deepen their wine knowledge as well as serious wine enthusiasts with no prior culinary training.Learn More about Sommelier Training Artisan Bread Baking There has never been a more exciting time for bread in America. When you consider the simple ingredients that form the foundation of all breads — flour, yeast, salt and water — it’s truly remarkable how many varied products have been crafted by the hands of master bakers. Today’s growing demand for artisanal breads offers bakers an incentive to widen their skillset and learn how to prepare specialties from the crustiest baguette to delicate croissants.Learn More about Artisan Bread Baking Culinary Management & Business Every kitchen is also a business. As you advance your entrepreneurial efforts, there is a range of skills you’ll need to grow and succeed. Whether it is understanding legal issues and financial statements or writing the perfect business plan, ICE’s food business experts can help you accomplish your entrepreneurial ambitions.Learn More about Food Business Workshops The Art of Cake Decorating Custom cakes in every shape and style have become the centerpieces of celebrations of all kinds. Learning how to create these spectacular showstoppers can be a profitable and creative outlet for bakers who want to widen their skillset. In ICE's Art of Cake Decorating program, you'll work alongside cake experts and be taught how to craft your own dazzling designs.Learn More about the Art of Cake Decorating Advanced Culinary Studies One thing all great chefs have in common? An appetite for knowledge and lifelong learning. In the culinary field, the ever-evolving menu of techniques and tools means that there are always new things to learn. From techniques like sous vide and hydrocolloids to historic cooking methods, we cater to your culinary curiosities and aim to expand your skillset and evolve your culinary career.Learn More about the Advanced Culinary Courses"
