["https://ice.edu/about/our-story/history"]
title = "History | About ICE | Institute of Culinary Education"
description = "In the spring of 2015, ICE relocated from our longtime home on 23rd Street in New York’s Chelsea neighborhood to 225 Liberty Street in the Battery Park City neighborhood. Our Lower Manhattan location extends across 74,000 square feet, with Hudson River views to the west and One World Trade Center views to the east. This move, coinciding with ICE’s 40th anniversary, was an exciting chapter in a long history that parallels the growth of culinary culture in New York."
full_description = "2015-Present: Regional and National Expansion In the spring of 2015, ICE relocated from our longtime home on 23rd Street in New York’s Chelsea neighborhood to 225 Liberty Street in the Battery Park City neighborhood. Our Lower Manhattan location extends across 74,000 square feet, with Hudson River views to the west and One World Trade Center views to the east. This move, coinciding with ICE’s 40th anniversary, was an exciting chapter in a long history that parallels the growth of culinary culture in New York. In early 2018, ICE opened a West Coast campus in Los Angeles , one of the biggest food destinations in the U.S. The new facility, formerly occupied by Le Cordon Bleu's Pasadena location, was updated to reflect the standards of ICE's flagship NYC campus. The school aims to create the same sense of community, creativity and campus life offered in New York, adapted to the thriving L.A. food scene. In 2019, ICE introduced Plant-Based Culinary Arts (formerly known as Health-Supportive Culinary Arts) at both campuses. The program is based on the Health-Supportive Culinary Arts program originated by the Natural Gourmet Institute (NGI). Like NGI’s program, ICE’s Plant-Based Culinary Arts curriculum is based on seven principles of food selection: whole, fresh, seasonal, traditional, balanced, local and delicious. Ingredients for ICE’s program are sourced in accordance with these standards. In 2020, ICE and the International Culinary Center (ICC) entered into an agreement that brought the best aspects of ICC’s expertise, unique offerings and heritage to ICE's campuses in New York and Los Angeles. ICC was founded as The French Culinary Institute (FCI) by Dorothy Cann Hamilton in 1984. At the time of the school’s closing in 2020, ICC was widely recognized as a leader in culinary education. ICE is proud to carry on the legacy of ICC through our unique program offerings and the expertise of our instructors. 2021 was another big year for the school, as it saw the launch of ICE's first associate degree program in Culinary Arts at the Los Angeles campus, and the launch of ICE's first online program — Culinary Arts & Food Operations. Since then, the school's degree offerings and online offerings have quickly expanded. Students at ICE's Los Angeles campus can now pursue an associate degree in Culinary Arts, Pastry & Baking Arts or Plant-Based Culinary Arts. For students looking to pursue their culinary dreams online, the school now offers an online Plant-Based Culinary Arts program in additional to our online Culinary Arts program."
year_published = 2025
