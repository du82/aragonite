["https://ice.edu/campus-programs"]
title = "Campus Programs | Institute of Culinary Education"
description = "Our entire staff here at ICE is dedicated — to you. Your growth as an individual and a hospitality or culinary professional is the measure of our success. Whether you’re interested in the culinary arts, baking and pastry, plant-based cuisine, restaurant management or the hospitality industry, our diverse, multifaceted business and culinary programs at ICE will help you reach your goals. It's no wonder that 87% of alumni say they would recommend an ICE education to students looking to launch a culinary or hospitality career. [1]"
full_description = "One-On-One Is Our Mantra Our entire staff here at ICE is dedicated — to you. Your growth as an individual and a hospitality or culinary professional is the measure of our success. Whether you’re interested in the culinary arts, baking and pastry, plant-based cuisine, restaurant management or the hospitality industry, our diverse, multifaceted business and culinary programs at ICE will help you reach your goals. It's no wonder that 87% of alumni say they would recommend an ICE education to students looking to launch a culinary or hospitality career. [1] Associate’s Degree and Diploma Program Opportunities ICE's programs are sophisticated, intensive and student-centric. Our comprehensive diploma programs provide you with diverse course work, hands-on learning, externships, job placement assistance, electives and extracurricular options, creating a program that is tailored to your passions. Our associate degree programs offer all those benefits plus business management and industry-relevant general education courses under one program. Leading chefs, restaurateurs and hotel professionals know, respect and hire graduates of our school. Located In Two Culinary Capitals of the World ICE has a spirit and atmosphere that you won’t find in other schools. When you study at ICE NY or ICE LA, you’re studying in one of America’s most exciting food cities, and the city is an extension of your classroom. Leading chefs, restaurateurs and hotel professionals know, respect and hire graduates of our school. Students who are unable to attend ICE in-person in New York or Los Angeles can still get a comprehensive ICE education by enrolling in one of our online programs. An ICE Education Opens Doors New York City and Los Angeles are ideal markets to launch your hospitality or culinary career, a process we facilitate through ICE externships. In the culinary world, it’s all about who you know, and we have a strong network of award-winning restaurants, chefs and alumni to ensure your ongoing success. ICE alumni and instructors have won national, regional and local awards, and have gained recognition from organizations including the James Beard Foundation, Food & Wine Magazine, Women Chefs & Restaurateurs, the American Culinary Federation and the International Association of Culinary Professionals (IACP)."
