["https://ice.edu/career-services-resources/disclosures"]
title = "Disclosures | Institute of Culinary Education"
description = "State Authorization for ICE's Online (Distance Education) ProgramsICE is required to receive state-level authorization to offer and enroll students in online (distance education) programs."
full_description = "ICE is required to receive state-level authorization to offer and enroll students in online (distance education) programs. The following programs are available to students in the states listed. Academic honesty, integrity and ethics are required of all students and employees of ICE. ICE will not tolerate cheating, plagiarism or other forms of dishonesty. 1. ICE defines cheating as including but not limited to the following: • Using unauthorized materials such as books, notes, cell phone or PDA accessories or crib sheets to answer examination questions; • Taking advantage of information considered unauthorized by one's instructor regarding examination questions; • Copying another student's homework, written assignments, examination answers, electronic media or other data; • Assisting or allowing someone else to cheat; or • Failure to report cheating to an academic official of the school. 2. ICE defines plagiarism as including but not limited to the following: • Representing the ideas, expressions or materials of another without due credit; • Paraphrasing or condensing ideas from another person's work without proper citation; or • Failing to document direct quotations and paraphrases with proper citation. 3. ICE defines other forms of academic dishonesty as including but not limited to the following: • Fraud, deception and the alteration of grades or official records; • Changing examination solutions after the fact, inventing, changing or falsifying laboratory data or research; • Purchasing and submitting written assignments, homework or examinations or passing off the work of others as your own; • Reproducing or duplicating images, designs or Web pages without giving credit to the developer, artist or designer; • Submitting work created for another course without instructor approval; • Misrepresenting oneself or one's circumstance to gain an unfair advantage • Collaborating with another person(s) without instructor approval; or • Selling or providing term papers, course work or assignments to other students. • Misrepresenting your identity or allowing another to do so. 4. ICE students may not make unauthorized copies of copyrighted material on or using ICE computer systems, networks or storage media. ICE students may not store unauthorized copies of copyrighted works using ICE systems, networks and/or storage media. ICE students may not download, upload, transmit, make available or otherwise distribute copyrighted material without authorization using ICE computer systems, networks, Internet access or storage media, and may not use peer-to-peer file services that would promote copyright infringement. ICE reserves the right to monitor its computer systems, networks and storage media for compliance with this policy, at any time, without notice, and with or without cause. Additionally, ICE reserves the right to delete from its computer systems and storage media, or restrict access to, any seemingly unauthorized copies of copyrighted materials it may find, at any time and without notice. ICE also reserves the right to restrict access to its computer systems, networks and storage media at any time for any reason. There are four possible consequences for violating the academic honesty and copyright infringement policy: • Failure of the assignment • Failure of the course • Expulsion from the school • Rescinding a diploma or certificate It is entirely within the discretion of ICE to determine the appropriate consequence for any violation of this policy."
year_published = 2025
