["https://ice.edu/about/alumni-profiles/Sameer-Bhatt"]
title = "Sameer Bhatt | Institute of Culinary Education"
description = '''Sameer Bhatt, Managing Partner of the acclaimed Bungalow restaurant in NYC, brings a wealth of experience and a global perspective to the hospitality industry.Born in New Delhi, Bhatt's interest in hospitality took shape during a college summer internship in New York City. Returning to India, he co-founded a successful restaurant group specializing in late-night delivery.Driven by his passion for the industry, Bhatt returned to New York to enhance his expertise, pursuing a formal education in Restaurant & Culinary Management at the Institute of Culinary Education (ICE).He honed his skills in the dining rooms of renowned NYC establishments, including Eleven Madison Park and Le Pavillon, where he ascended to the position of Maître D' under the guidance of Chef Daniel Boulud.In 2023, Bhatt partnered with Chef Vikas Khanna and restaurateur Jimmy Rizvi to open Bungalow, a restaurant celebrating their South Asian heritage.Bungalow was an immediate success. Reservations sold old quickly, and critical acclaim proliferated. The New York Times awarded Bungalow three stars, and the 2024 Michelin Guide bestowed Bib Gourmand status upon the restaurant. Numerous "Best Restaurants" lists have further solidified Bungalow's position as a culinary destination.'''
full_description = '''Sameer Bhatt, Managing Partner of the acclaimed Bungalow restaurant in NYC, brings a wealth of experience and a global perspective to the hospitality industry. Born in New Delhi, Bhatt's interest in hospitality took shape during a college summer internship in New York City. Returning to India, he co-founded a successful restaurant group specializing in late-night delivery. Driven by his passion for the industry, Bhatt returned to New York to enhance his expertise, pursuing a formal education in Restaurant & Culinary Management at the Institute of Culinary Education (ICE). He honed his skills in the dining rooms of renowned NYC establishments, including Eleven Madison Park and Le Pavillon, where he ascended to the position of Maître D' under the guidance of Chef Daniel Boulud. In 2023, Bhatt partnered with Chef Vikas Khanna and restaurateur Jimmy Rizvi to open Bungalow, a restaurant celebrating their South Asian heritage. Bungalow was an immediate success. Reservations sold old quickly, and critical acclaim proliferated. The New York Times awarded Bungalow three stars, and the 2024 Michelin Guide bestowed Bib Gourmand status upon the restaurant. Numerous "Best Restaurants" lists have further solidified Bungalow's position as a culinary destination. For over five decades, the Institute of Culinary Education has been a leader in culinary and hospitality education. Let us help you find your culinary voice. ICE is accredited by ACCSC and licensed by BPPE (in CA) and BPSS (in NY), and is not regulated in TX under Chapter 132 of the Texas Education Code. Terms of UsePrivacy PolicyDMCA PolicyJoin the ICE TeamApplicant Privacy StatementNY Career Catalog & BrochureLA Career Catalog & BrochureLA Annual Report and School Performance Fact Sheets Bureau for Private and Postsecondary Education (BPPE) Higher Education Emergency Relief FundNondiscrimination Statement & Title IX PolicyHigher Education Consumer Information Disclosures'''
