["https://ice.edu/about/alumni-profiles/Avish-Naran"]
title = "Avish Naran | Institute of Culinary Education"
description = "A native son of Los Angeles’ Silver Lake neighborhood, Avish Naran translated the love of food instilled in him by his Gujarati family into a career first as a cook, and later as a celebrated restaurant owner in the Los Angeles culinary scene. Avish started his cooking career as a stage at the longstanding luxury steakhouse Pacific Dining Car before committing to formal training in Napa Valley. He then threw himself into the fine dining side of Indian cuisine in San Francisco, working his way through such well-known establishments as Taj Campton Place and August 1 Five before relocating to New York to work at Indian Accent while attending ICE”s Restaurant & Culinary Management program. It was in that program that Avish decided to build a business plan for a restaurant rooted in his Indian heritage, his restaurant training, and the fun-loving California dining scene that felt like him. His first restaurant, Pijja Palace, hit that mark. A brightly lit sports bar with a menu of Indian-infused Italian-American classics like Chutney ‘Pijja’ (pizza), Rigatoni in tomato masala and dosa-battered onion rings, Pijja Palace has made almost every short list of must-eat spots in Los Angeles since opening its doors in 2022. Beyond the restaurant’s praise (including being named a Bib Gourmand by the Michelin Guide), Avish himself has been lauded as a rising star in the hospitality industry. The Observer named him to their “2024 Nightlift & Dining Power List” the same year that Bloomberg Business named him in their Ones to Watch round up of major influencers on entertainment and culture. Eater Los Angeles also published a dedicated interview with Avish. As Pijja Palace continues its reign within the LA dining scene, Avish is looking to his next project, Szechuan Club. An homage to the Asian-fusion restaurants of his youth, the cocktail-forward eatery will be located next to Pijja Palace, and is set to open in spring of 2025. Learn More About Alumni Avish Naran on the ICE Blog"
full_description = "A native son of Los Angeles’ Silver Lake neighborhood, Avish Naran translated the love of food instilled in him by his Gujarati family into a career first as a cook, and later as a celebrated restaurant owner in the Los Angeles culinary scene. Avish started his cooking career as a stage at the longstanding luxury steakhouse Pacific Dining Car before committing to formal training in Napa Valley. He then threw himself into the fine dining side of Indian cuisine in San Francisco, working his way through such well-known establishments as Taj Campton Place and August 1 Five before relocating to New York to work at Indian Accent while attending ICE”s Restaurant & Culinary Management program. It was in that program that Avish decided to build a business plan for a restaurant rooted in his Indian heritage, his restaurant training, and the fun-loving California dining scene that felt like him. His first restaurant, Pijja Palace, hit that mark. A brightly lit sports bar with a menu of Indian-infused Italian-American classics like Chutney ‘Pijja’ (pizza), Rigatoni in tomato masala and dosa-battered onion rings, Pijja Palace has made almost every short list of must-eat spots in Los Angeles since opening its doors in 2022. Beyond the restaurant’s praise (including being named a Bib Gourmand by the Michelin Guide), Avish himself has been lauded as a rising star in the hospitality industry. The Observer named him to their “2024 Nightlift & Dining Power List” the same year that Bloomberg Business named him in their Ones to Watch round up of major influencers on entertainment and culture. Eater Los Angeles also published a dedicated interview with Avish. As Pijja Palace continues its reign within the LA dining scene, Avish is looking to his next project, Szechuan Club. An homage to the Asian-fusion restaurants of his youth, the cocktail-forward eatery will be located next to Pijja Palace, and is set to open in spring of 2025. For over five decades, the Institute 