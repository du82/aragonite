["https://ice.edu/campus-programs/plant-based-culinary-arts-associate-degree"]
title = "Plant-Based Culinary Arts | Associate Degree | Institute of Culinary Education"
description = "Our Plant-Based Culinary Arts career training program teaches the practice and art of cooking through theory, technique, palate training, speed and teamwork. Our exclusive curriculum promotes vegetables and other whole foods, nutrition, wellness and sustainability. With a health-supportive curriculum inspired by the Natural Gourmet Institute, our plant-based program appeals to students living a vegetarian or vegan lifestyle who want a comprehensive culinary education, including instruction on how to cook plant-based and other proteins. The program explores food as medicine and diets such as Ayurvedic, macrobiotic, gluten-free and dairy-free. Over the course of the program, you'll experience lessons with multiple Chef-Instructors with different perspectives and areas of expertise in plant-based cooking (including vegan recipes) and other healthy culinary techniques"
full_description = "Plant-Based Culinary Arts Our Plant-Based Culinary Arts career training program teaches the practice and art of cooking through theory, technique, palate training, speed and teamwork. Our exclusive curriculum promotes vegetables and other whole foods, nutrition, wellness and sustainability. With a health-supportive curriculum inspired by the Natural Gourmet Institute, our plant-based program appeals to students living a vegetarian or vegan lifestyle who want a comprehensive culinary education, including instruction on how to cook plant-based and other proteins. The program explores food as medicine and diets such as Ayurvedic, macrobiotic, gluten-free and dairy-free. Over the course of the program, you'll experience lessons with multiple Chef-Instructors with different perspectives and areas of expertise in plant-based cooking (including vegan recipes) and other healthy culinary techniques Culinary Management ICE’s Restaurant & Culinary Management program offers practical training in food business management, operations and entrepreneurship. Our experienced instructors will teach you how to develop profitable concepts, write a business plan and market your venture to a target audience interested in healthy cooking and plant-based eating. You'll get a sense of how to troubleshoot restaurant and bar management issues concerning operations and staffing, analyze changing trends and make fiscal modifications to keep a business profitable. You'll train to make strategic business decisions with case studies, role-playing and group projects; have a chance to gain valuable professional insights from prominent guest lecturers; and study menu design, social media marketing, kitchen and interior design, and wine tasting and appreciation.Get More Info Applied General Education Online Classes Students take online courses that are relevant to restaurant industry careers, such as the history and culture of food, social psychology, business communication, leadership, change management and more. You'll study subjects as they apply to the business of foodservice, including interpersonal communication, time management, problem-solving, critical thinking; team building and leadership; written and verbal communication strategies as they relate to recipe writing, reviewing, food blogging and culinary demonstrations; and nutrition in terms of dietary preferences and the relationship between diet, health and disease."
