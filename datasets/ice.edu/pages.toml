["https://ice.edu/about/faculty-profiles/michael-handal"]
title = "Michael Handal | Faculty Profiles | New York Campus | ICE"
description = "Michael Handal is a Culinary Arts Chef-Instructor at the Institute of Culinary Education (ICE) in New York City."
full_description = '''"I never read or experience an idea or technique related to food or teaching without thinking about its application to ICE's curriculum." Michael Handal, CCC, CCE, graduated from Fordham University and the Culinary Institute of America. He has worked at The Knickerbocker Field Club, La Côte Basque and The Helmsley Palace Hotel. He was inspired to cook by watching episodes of "The French Chef" and is ICE’s resident expert on charcuterie. Chef Mike is recognized by the American Culinary Federation as a Certified Chef de Cuisine (CCC) and a Certified Culinary Educator (CCE). “My training and experience has been grounded in classical French cuisine, from pastry to butchering, from purchasing and receiving, from garde manger to running a kitchen brigade, everything I have done in my career has pointed me towards teaching others how to cook professionally," says Chef Mike. "I never read or experience an idea or technique related to food or teaching without thinking about its application to ICE's curriculum and our students or how our instructors can successfully use it in their kitchens with their students.” For over five decades, the Institute of Culinary Education has been a leader in culinary and hospitality education. Let us help you find your culinary voice. ICE is accredited by ACCSC and licensed by BPPE (in CA) and BPSS (in NY), and is not regulated in TX under Chapter 132 of the Texas Education Code. Terms of UsePrivacy PolicyDMCA PolicyJoin the ICE TeamApplicant Privacy StatementNY Career Catalog & BrochureLA Career Catalog & BrochureLA Annual Report and School Performance Fact Sheets Bureau for Private and Postsecondary Education (BPPE) Higher Education Emergency Relief FundNondiscrimination Statement & Title IX PolicyHigher Education Consumer Information Disclosures'''
