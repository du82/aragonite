["https://ice.edu/about/faculty-profiles/luisa-degirolamo"]
title = "Chef Luisa DeGirolamo | Institute of Culinary Education"
description = "Chef Luisa DeGiorlamo has over 20 years of experience working in established kitchens, hotels, private country clubs and restaurants in the New York Tri-State area.Chef Luisa has an Associate’s Degree in Baking & Pastry Arts, and has worked at establishments including Rustic Root (Woodbury), Elizabeth’s Chocolates (Bellmore), Jacqueline’s Patisserie (Babylon) and Piping Rock Club (Locust Valley), where she served as Executive Pastry Chef for 10 years. She also has her own establishment, Confections by Lu, which provides custom-designed cakes and desserts.She continues her education by attending workshops and classes by Paris Gourmet and Pre-Gel. “It has been important to myself as a pastry chef to continue to grow by remaining teachable in this industry,” she says.In her free time, you can find Chef Luisa growing fresh herbs, flowers and vegetables she uses for her home cooking and baking. “The best thing about learning how to grow food is getting to pass this knowledge and skill along to future students, and most importantly to my daughter, Amelia.”"
