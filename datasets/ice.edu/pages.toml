["https://ice.edu/blog/jouvert-nyc-eat-doubles-and-get-ready-carnival-james-beard-award-winning-spot"]
title = "J'ouvert in NYC: Eat Doubles and Get Ready for Carnival at This James Beard Award-Winning Spot | Institute of Culinary Education"
description = "Cory Sale is the Senior Public Relations Manager at ICE and an alumna (Culinary Arts '22). She enjoys writing about seasonal produce almost as much as visiting NYC’s greenmarkets, where she finds new flavors to add to ice cream. When she’s not cooking (or eating), you can find her on the frisbee field chasing down a piece of plastic."
full_description = "Cory Sale, ICE Culinary Arts grad and Senior PR Manager, shares her experience celebrating Carnival in Trinidad — and finding one of her now favorite foods. It was 4 a.m., and syncopated, snare-heavy soca poured from a nearby truck, its flatbed filled with enormous black speakers. The music's intense rhythms echoed inside my chest. My feet moved to the beat, and I swayed my hips and arms in a kind of figure eight — one among hundreds of mud and paint-covered celebrants chipping through the alleys and thoroughfares of Trinidad's Port of Spain. Together, we were a parade. Joy, music and energy carried us along. Soon, we would feast on doubles, a sandwich-like street food comprising fried flatbread and curried chickpea filling. This was one small part of my experience playing J’ouvert. French for “day break,” J'ouvert is a Trinidadian celebration that kicks off Trinidad and Tobago's annual Carnival — and it has roots in resistance. In the early 1800s, Great Britain brought enslaved West Africans to Trinidad and Tobago. (Though it was then under British colonial rule, it was a French colony at multiple points prior; thus, its earliest colonizing settlers were French.) The French held elaborate pre-Lent masquerade parties. In defiance of rules forbidding their participation, enslaved people made their own party: singing, drumming, dancing, and mocking plantation owners. These parties, alongside the traditions of Canboulay (a nighttime festival celebrated at the end of the sugarcane harvest), enabled enslaved people to celebrate community and keep their cultural traditions alive. Today, members of the Caribbean diaspora celebrate Carnival all over the world. Though I didn't make it to Trinidad for this year's J'ouvert, a trip to A&A Bake & Doubles Shop in Brooklyn takes me right back to that 4 a.m. festival. A 2019 recipient of the James Beard Foundation’s American Classics Award, the restaurant has been serving Trinidadian fare since 2002. Mixing savory and sweet flavors, their doubles are made with fluffy, chewy flatbreads that envelop a delicious chickpea filling. Optional (but highly recommended) toppings include mango, tamarind, and pepper sauces."
year_published = 2025
