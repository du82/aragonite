["https://ice.edu/about/alumni-profiles/John-Reilly"]
title = "John Reilly | Institute of Culinary Education"
description = "Le B., the latest venture from renowned chef Angie Mar, is currently one of New York City's most celebrated restaurants. At the heart of this acclaimed kitchen stands ICE alum, Chef John Reilly, as Sous Chef. Following the closure of Mar's beloved Beatrice Inn in 2020, Le B. emerged as a more sophisticated and refined iteration, captivating the matured taste of the former downtown scenesters that frequented the original haunt. The restaurant has garnered widespread acclaim, gracing the pages of prestigious publications like The Financial Times, The Robb Report, Esquire and The New Yorker, including a feature in Helen Rosner's James Beard Award-winning restaurant review column in the latter’s special section called The Food Scene. This recognition underscores the exceptional culinary artistry displayed by Chef Reilly and his talented team, solidifying Le B.’s (and Chef Reilly’s) position as a culinary force in the New York food scene."
