full_description = "It’s a fast-paced, dynamic environment where the margin for error is slim, and where hard work, dedication and passion can bring the most rewarding success. These realities guide our programs and make our graduates highly sought-after candidates for a wide range of employers who are hiring ICE alumni every day. Our alumni come to you with skills and ambition to work at the most demanding levels in the restaurant and hospitality industries. This is made evident by the top awards and recognition they win as students, as ICE graduates and as successful professionals. Want to hire ICE alumni? Get your job posting in front of 17,900+ of the finest culinary and hospitality alumni at the click of a button. Whether you’re looking to add entry-level staff, or looking to source seasoned senior-level executive chefs or general managers, the ICE alumni network is your targeted resource for talented candidates. You can list job openings for ICE graduates free of charge with the job listing application form. Listings will run for three weeks and are listed blindly for current students and alumni. Interested candidates obtain contact information from Career Services and contact you directly by the means you request (phone, email, etc.). If you have any questions, please email us at NYcareerservices@ice.edu for ICE New York’s campus or LAcareerservices@ice.edu for ICE Los Angeles’ campus. For over five decades, the Institute of Culinary Education has been a leader in culinary and hospitality education. Let us help you find your culinary voice. ICE is accredited by ACCSC and licensed by BPPE (in CA) and BPSS (in NY), and is not regulated in TX under Chapter 132 of the Texas Education Code. Terms of UsePrivacy PolicyDMCA PolicyJoin the ICE TeamApplicant Privacy StatementNY Career Catalog & BrochureLA Career Catalog & BrochureLA Annual Report and School Performance Fact Sheets Bureau for Private and Postsecondary Education (BPPE) Higher Education Emergency Relief F