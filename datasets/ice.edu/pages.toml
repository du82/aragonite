["https://ice.edu/career-services-resources/career-services/externships"]
title = "Externships | ICE Career Services | Institute of Culinary Education"
description = "Similar in concept to an internship, ICE externships are paid or unpaid placements in a professional environment. They are chosen at a student's discretion with the assistance of Career Services advisors as part of ICE Career Resources. Students determine an externship site based on their personal interests and career goals, and ICE externships consistently prove to be an exceptional opportunity for hands-on training, networking at the heart of the industry, and often, job offers."
full_description = '''How Do ICE Externships Work? The final course of our Culinary Arts and Pastry & Baking Arts diploma programs is a 210-hour externship at a restaurant, bakery or other culinary business. Our Plant -Based Culinary Arts, Online Culinary Arts & Food Operations, and Tourism, Travel & Hospitality Management diploma programs end with a 200-hour in-the-field externship. ICE’s Associate Degree programs also culminate with an ICE externship, 360 hours in length. Our Incredible Track Record Our students extern at hundreds of establishments each year — and each experience is as unique as our students. Noteworthy restaurants and bakeries owned and operated by celebrated chefs across America are among these sites, as well as leading food publications, catering companies and luxury hotels. Getting your foot in the door with one of these organizations could be the start of the career you’ve been dreaming about. Our staff has the connections Faculty and advisors come together as part of ICE's career resources. They assess your career aspirations, skills and academic record to pair you with sites that align with your goals and background. Each ICE externship is structured so that your performance is monitored by the school's professional staff, and subsequent feedback and evaluations are incorporated into your overall grade. ICE externships are a fantastic opportunity for training and networking in the real world. When you're choosing which culinary school to attend, be sure to ask about externship programs and learn how each program incorporates in-the-field experience into your education. Gail Simmons, Culinary Arts Graduate Judge/Host on Bravo's "Top Chef" and "Top Chef: Just Desserts""The externship that I did at ICE actually was probably more important than any single step in my career afterwards. I wanted to be a food writer, so I thought that when I left ICE, I would go to extern at a food magazine. But my career counselor at ICE, not forced me, but certainly encouraged me to go into a top restaurant kitchen, to hone and round out the knowledge I had gained in the classroom. Having the strong culinary background that I learned from ICE really helped me with everything I have done since school. It gave me credibility in the industry, and gave me the language and the skills I needed to later stand beside some of the greatest chefs in the world."'''
year_published = 2025
clearnet = "https://ice.edu/career-services-resources/career-services/externships"
