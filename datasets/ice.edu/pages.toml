["https://ice.edu/about/faculty-profiles/alex-orman"]
title = "Alex Orman | Faculty Profiles | New York Campus | ICE"
description = "Alex Orman is a Pastry & Baking Arts Chef Instructor at the Institute of Culinary Education (ICE) in New York City."
full_description = "Chef Alex Orman was inspired to pursue culinary arts from a young age. Upon moving to the U.S. from Uzbekistan in 1993, he enrolled in hotel and restaurant management courses at New York City College of Technology. In 1998, Chef Alex had the opportunity to relocate and work in the kitchen of the prestigious Hotel de France. Later, Chef Alex ventured to the NYC restaurant scene and served as a pastry chef at the acclaimed Russian Tea Room. There, he received two gold medals from the Salon of Culinary Art of the Societe Culinaire Philanthropique. After stints at the Glen Oaks Country Club, City Hall, La Grenouille and Gascogne Bistro, Chef Alex opened his own restaurant in Staten Island, Alor Cafe. Over seven years, Alor Cafe transformed into a fine dining and music venue. Today, Chef Alex is the proud father of three, living with his wife and children in Brooklyn. For over five decades, the Institute of Culinary Education has been a leader in culinary and hospitality education. Let us help you find your culinary voice. ICE is accredited by ACCSC and licensed by BPPE (in CA) and BPSS (in NY), and is not regulated in TX under Chapter 132 of the Texas Education Code. Terms of UsePrivacy PolicyDMCA PolicyJoin the ICE TeamApplicant Privacy StatementNY Career Catalog & BrochureLA Career Catalog & BrochureLA Annual Report and School Performance Fact Sheets Bureau for Private and Postsecondary Education (BPPE) Higher Education Emergency Relief FundNondiscrimination Statement & Title IX PolicyHigher Education Consumer Information Disclosures"
