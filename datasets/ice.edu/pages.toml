["https://ice.edu/about/events/host-your-event/mixology-events"]
title = "Mixology, Wine & Beer Events | Host Your Events | NY Campus | ICE"
description = "Our expert mixologists will explain what makes the perfect cocktail, and your group will have the opportunity to make and sample seven different cocktails."
full_description = "ICE has a long roster of wine, beer and spirits experts to teach you and your guests tricks of the bar trade. Learn how to shake and stir a martini (hint: James Bond may not have always been right) and which wine pairs best with a NY strip steak (spoiler: it’s not always that big, juicy red you’re used to). Get shaking now. Our events begin with a 30-minute reception complete with a plentiful cheese platter alongside wine and beer from the bar. This is followed by a 90-minute hands-on lesson that focuses on the shaking and mixing techniques, from the importance of using fresh juices to what tools are needed for a seamlessly stocked bar at home. Our expert mixologists will explain what makes the perfect cocktail, and when you’re ready to shake and stir, your group will have the opportunity to make and sample five craft cocktails. Non-alcoholic variations can be provided. Book a mixology event. Some of ICE's most popular Classic Mixology themes include: Around The World The Singapore Sling (Malaysia) Negroni (Italy) Sazerac (US) Caipirinhas (Brazil) Margarita (Mexico) In ICE's two-hour private wine tasting events, your group will taste eight to 10 wines paired with cheeses or other small bites. In this sit down tasting, your instructor will teach you to evaluate quality, taste, style and how to pair wines with food. Some of our most popular tasting topics include: Wine Tasting 101, Essential Red Wine Varietals, Champagne Gala and Italian Festival: Vino, Salume & Formaggio. Schedule a sip. For more information on cooking classes or hosting an event, submit a request form, call the Special Events department directly at (800) 543-8834 or email specialevents@ice.edu. For over five decades, the Institute of Culinary Education has been a leader in culinary and hospitality education. Let us help you find your culinary voice. ICE is accredited by ACCSC and licensed by BPPE (in CA) and BPSS (in NY), and is not regulated in TX under Chapter 132 of the Texas Education Code."
