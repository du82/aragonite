["https://ice.edu/about/faculty-profiles/celine-beitchman"]
title = "Celine Beitchman | Institute of Culinary Education"
description = "Celine Beitchman was an instructor, curriculum developer and director at the Natural Gourmet Institute for 10 years."
full_description = '''Celine Beitchman was an instructor, curriculum developer and director at the Natural Gourmet Institute for 10 years. She studied under the school's founder, Annemarie Colbin, Ph.D., and is an expert in nutrition education for healthcare professionals, chefs and home cooks alike. Chef Celine has prior experience as a private chef and in special events, catering, kitchen production, operations and management. She's worked as a line cook, garde manger, food stylist and pastry chef, and appeared in Bon Appetit, Brit + Co, HuffPost and Mind Body Green as a health food expert. Chef Celine joined the Institute of Culinary Education in 2019 to teach Plant-Based Culinary Arts career classes and professional development courses in culinary nutrition and food therapy. She has a master's in clinical nutrition, a bachelor's in film and a Level 3 wine certification from WSET. "I look at wine, food and nutrition as a continuum," Chef Celine says. "Im always able to find some meaningful connection, and I’ll help you find that, too. That’s my attitude when it comes to teaching." For over five decades, the Institute of Culinary Education has been a leader in culinary and hospitality education. Let us help you find your culinary voice. ICE is accredited by ACCSC and licensed by BPPE (in CA) and BPSS (in NY), and is not regulated in TX under Chapter 132 of the Texas Education Code. Terms of UsePrivacy PolicyDMCA PolicyJoin the ICE TeamApplicant Privacy StatementNY Career Catalog & BrochureLA Career Catalog & BrochureLA Annual Report and School Performance Fact Sheets Bureau for Private and Postsecondary Education (BPPE) Higher Education Emergency Relief FundNondiscrimination Statement & Title IX PolicyHigher Education Consumer Information Disclosures'''
