["https://ice.edu/blog/ice-50-anniversary-alumni-honoree-doctor-nate-wood"]
title = "Meet Dr. Nate Wood, ICE Distinguished Alumni Honoree | Institute of Culinary Education"
description = "Mahira Rivers is a James Beard Foundation-nominated freelance food writer and restaurant critic based in New York City. Her writing has appeared in publications like The New York Times, New York Magazine, Food & Wine and Eater. Prior to freelancing, she worked as an anonymous inspector for the Michelin Guides North America where she dined out nine times a week across the country in search of the finest cuisine. She currently writes the newsletter Sweet City, dedicated to discovering the best desserts in New York City."
full_description = "To celebrate 50 years of ICE, we're honoring 50 distinguished ICE alumni. Meet Chef and board-certified physician, Dr. Nate Wood. Nate Wood knows a good peach when he sees one. That’s just what happens when you grow up in Michigan with a family that cherishes good food, like seasonal fruits at their peak. But for Dr. Nate Wood, who graduated from ICE in 2018, fresh fruit is also key to a well-rounded diet and a healthy lifestyle. These two facets of food — taste and function — are equally important to the ICE alum, board-certified physician and Director of Culinary Medicine at the Irving and Alice Brown Teaching Kitchen at Yale New Haven Health. What that means is that Wood is both a chef and a doctor, and his passion is the intersection of food and medicine — specifically, the belief that food is medicine and that the public health sector would benefit from prioritizing things like diet and lifestyle. From cultivating his interest in food and cooking as a young boy in West Michigan to now teaching and practicing culinary medicine at the Yale School of Medicine in New Haven, Connecticut, Wood has pioneered a food-based career at the intersection of culinary arts and internal medicine. Today, he’s a regular guest on TV news; he’s published work in collaboration with journalists at The New York Times; and he’s even been featured on a Netflix cooking show. But, as Wood has said himself, this success couldn’t have happened without completing the culinary arts program at ICE. Wood took a year off of medical school to attend classes at the New York campus. His experience provided an invaluable education, but it also boosted Wood’s confidence and credibility. We caught up with Wood to talk about his time at ICE, working with food in the medical field, and what he considers one of the most vital skills for anyone hoping to work in the culinary field (spoiler: it’s dishwashing). DR. WOOD: Over the years at Yale, I've been able to incorporate a lot more nutrition education into the curricula. When these healthcare professionals are done with their training, they will be proactively asking about diet and lifestyle and will have an evidence-based view of food as medicine, which will allow them to provide better patient care. Being able to help set that local revolution in motion is something I'm most proud of."
year_published = 2025
clearnet = "https://ice.edu/blog/ice-50-anniversary-alumni-honoree-doctor-nate-wood"
