["https://ice.edu/about/faculty-profiles/bridget-vickers"]
title = "Bridget Vickers | Institute of Culinary Education"
description = "Bridget Vickers studied pastry and baking at Le Cordon Bleu before launching her career as a cake decorator and recipe developer at Bristol Farms in Mission Viejo. She moved on to manage the bakery at New Frontiers Natural Food Stores before becoming the executive pastry chef for Cal Poly campus dining.Chef Vickers was the executive pastry chef at Good Neighbor Bakery in Santa Monica, which she co-owned, and Creative Cakes by Bridget, which she owned, designing wedding and specialty cakes, plated desserts and menus.Chef Vickers began teaching at Le Cordon Bleu in 2015 and came to the Institute of Culinary Education in 2019. She specializes in cake, bread, laminated doughs and French pastries."
