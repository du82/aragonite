["https://ice.edu/continuing-education/art-cake-decorating"]
title = "Cake Art & Decorating | Continuing Education | ICE"
description = "Available at the New York campus, ICE’s Art of Cake Decorating program was developed by award-winning Chef Toba Garrett, one of the country’s most notable authors, instructors and practitioners of the art of cake design. Chef Toba has won many gold and silver medals at cake decorating competitions all over the world and her work has been featured by various media outlets including the Today Show, InStyle, Pastry Art and Design, Gourmet and many more. Dessert Professional named Chef Toba one of the 10 Best Cake Decorators in America, and she has even had her work featured by the Smithsonian Museum in Washington D.C."
full_description = "Curriculum From a Living Cake Legend Available at the New York campus, ICE’s Art of Cake Decorating program was developed by award-winning Chef Toba Garrett, one of the country’s most notable authors, instructors and practitioners of the art of cake design. Chef Toba has won many gold and silver medals at cake decorating competitions all over the world and her work has been featured by various media outlets including the Today Show, InStyle, Pastry Art and Design, Gourmet and many more. Dessert Professional named Chef Toba one of the 10 Best Cake Decorators in America, and she has even had her work featured by the Smithsonian Museum in Washington D.C. From the Basics to Advanced Techniques Our cake decorating continuing education courses explore the history of this intricate art, including instruction in celebrated traditions of cake design from around the world. Students will also train in various methods of contemporary cake decorating, from the basics of piping, advanced sugarwork and hand-sculpting to airbrushing, hand-painting and novelty cakes. Craft Your Own Award-Winning Cake Armed with expert cake design skills, alumni of our professional cake decorating classes have placed among the highest rated cakes at esteemed cake competitions, including the prestigious New York Cake Show. One of our alumni even won the competition’s grand prize — within mere days of graduating!Request More Information Course 1 INTRODUCTION TO BUTTER CREAM PIPING 40 hours The course will instruct how to prepare several different types of buttercream as well as prepare all types of piped borders and flowers. Through repetition and practice the student will build their skills and develop confidence. Icing cakes, pressure control piping and learning food color applications are a few of the key elements to compliment butter cream use.Course Highlights:Preparing and using buttercream icingsPressure control piping, cornet preparationBasic cake borders - shells, star flowers, ballooning, zigzag, reverse shells, fleur-de-lis, garlands and ropeIntermediate buttercream piping - grape clusters, sweet pea clusters, E shells, curved shells, shells with flutes, ruffles and swags, bows, basket weaveBasic floral piping skills - leaves, rose bud, half rose, full blown roses"
