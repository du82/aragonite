title = "Chelsea Burgess | Institute of Culinary Education"
description = '''Chelsea Burgess likes to create cakes that are as visually stunning as they are delicious. Prior to joining ICE in 2022, she was the Lead Cake Artist and Production Manager at Nine Cakes, where she designed and decorated custom tiered wedding cakes. Aside from the New York wedding industry, Chef Chelsea also has experience with high volume production bakeries and catering.Chef Chelsea received her bachelor's degree in Baking & Pastry Arts from Johnson & Wales University."Culinary school gave me a solid foundation, and not only taught me the skills needed to work in this field, but also gave me the knowledge and understanding of why pastry techniques work," she says.Chef Chelsea's most-used reference book is The Flavor Bible and she follows Cherry Bombe to stay informed about inspiring women in the restaurant industry. She loves working with her hands and outside of the kitchen, she enjoys embroidering, creating large-scale floral installations, and painting.'''
