title = "Isabelle Gonzalez | Institute of Culinary Education"
description = "Isabelle Gonzalez's foothold into the travel trade industry started at the age of 17 when she began working for airlines, first Aeromexico Airlines and then Avianca Airlines. This fueled a career in hospitality within airlines, hotels, tourism offices and travel management firms, where Isabelle gained extensive knowledge of international hotel sales, contract negotiations and travel presentations throughout Europe and Latin America. She spearheaded the International Tourism for Long Island, NY, and as a result, Long Island is now considered a destination for international groups and meetings.Isabelle began teaching Hospitality & Hotel Management at ICE in 2023. She is passionate about preparing the next generation of hospitality tourism professionals and event planners, and finds it rewarding to understand their thought processes and curiosity."
