title = "Jason Hawk | Institute of Culinary Education"
description = "Chef Jason Hawk brings more than 20 years of experience in the culinary industry, including his most recent role as lead chef instructor at the International Culinary Center (ICC)."
full_description = "Chef Jason Hawk brings more than 20 years of experience in the culinary industry, including his most recent role as lead chef instructor at the International Culinary Center (ICC). After graduating from the Culinary Institute of America in 2001, Chef Jason held various roles at New York restaurants, ranging from Claudette, a Provencal restaurant serving French and North African Cuisine to The Cock and Bull, a British gastro pub. Prior to pivoting from the restaurant industry to culinary education at ICC, Chef Jason worked as co-chef and sous chef at David Burke Tavern for two years. Chef Jason is a pro at staff training, ordering, inventory, scheduling, menu planning and event management. He began teaching Plant-Based Culinary Arts at ICE in 2020. For over five decades, the Institute of Culinary Education has been a leader in culinary and hospitality education. Let us help you find your culinary voice. ICE is accredited by ACCSC and licensed by BPPE (in CA) and BPSS (in NY), and is not regulated in TX under Chapter 132 of the Texas Education Code. Terms of UsePrivacy PolicyDMCA PolicyJoin the ICE TeamApplicant Privacy StatementNY Career Catalog & BrochureLA Career Catalog & BrochureLA Annual Report and School Performance Fact Sheets Bureau for Private and Postsecondary Education (BPPE) Higher Education Emergency Relief FundNondiscrimination Statement & Title IX PolicyHigher Education Consumer Information Disclosures"
