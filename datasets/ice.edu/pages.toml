title = "Andrew Catalano | Faculty Profiles | New York Campus | ICE"
description = "Andrew Catalano is a Hospitality Management Instructor at the Institute of Culinary Education (ICE) in New York City."
full_description = "Andrew Catalano resides in Maspeth, New York, and has worked in the hospitality service industry for over 35 years. He has experience in working with union and non-union operations, for- and not-for profits in all segments of the industry, private ownership, corporate, education, and healthcare - acute and LTC. Andrew is an adjunct professor at CUNY and the Institute of Culinary Education, and a certified instructor with the National Restaurant Association. As the owner principle of Strategic Management Consultants, Andrew prides himself with offering fresh eye reviews for the service operator, including financial review, performance management, labor optimization, marketing strategies, food safety and employee training for front line and management staff. Andrew holds a master's degree in business management, which gives him the refined skills to think through problems, develop a vision and plan next steps to improve the quality and value of an operation. For over five decades, the Institute of Culinary Education has been a leader in culinary and hospitality education. Let us help you find your culinary voice. ICE is accredited by ACCSC and licensed by BPPE (in CA) and BPSS (in NY), and is not regulated in TX under Chapter 132 of the Texas Education Code. Terms of UsePrivacy PolicyDMCA PolicyJoin the ICE TeamApplicant Privacy StatementNY Career Catalog & BrochureLA Career Catalog & BrochureLA Annual Report and School Performance Fact Sheets Bureau for Private and Postsecondary Education (BPPE) Higher Education Emergency Relief FundNondiscrimination Statement & Title IX PolicyHigher Education Consumer Information Disclosures"
