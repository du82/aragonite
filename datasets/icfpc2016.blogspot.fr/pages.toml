6 Organizers at 3:05 PM 4 comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Sunday, September 18, 2016 We started accepting T-shirt orders! We are soon announcing contest winners in ICFP 2016, but meanwhile, here's an update for T-shirts! Thank you for answering the questionnaires about T-shirts. According to the responses, design A was very popular compared to design B, so we are making design A only. Also we will produce slim-cut (womens) T-shirts too. So, now, we are ready to accept orders! We prepared two editions of T-shirts: Screenprint Edition and DTG Edition. While the design is the same, all others (garment, printing method, price, logistics, ...) are totally different. Please read carefully the explanations below before placing orders. 1. Screenprint Edition This edition uses screenprinting as T-shirt printing method. We expect it to have higher quality and durability than DTG Edition, while price is lower. Price is 1,500 JPY. Items are sold and shipped by BOOTH, a Japan-based company. Since BOOTH does not support international shipping by itself, if you live outside Japan, you need to use some international forwarding service to ship items overseas. BOOTH recommends tenso.com (see links below for details). Order deadline of Screenprint Edition is Sep 30 23:59 UTC. Estimated shipping date is October or December. 2. DTG Edition DTG stands for Direct-To-Garment, and this edition prints T-shirts on demand by ink-jet printers. One good point about this method is that items can be produced on-demand, any time. Price is 32.99 USD. Items are sold and shipped by CafePress, a US-based company. It supports international shipping by itself. We set no deadline for this edition, so you can buy one whenever you like. Summary The table below summarizes the differences of two editions: Order Links Finally, here are links to the shops! Screenprinting Edition, Mens: https://icfpc2016-tshirt.booth.pm/items/327165 Screenprinting Editions, Womens: https://icfpc2016-tshirt.booth.pm/items/328441 (You can change the display language by the dropdown box at the bottom of the page) (Tenso.com http://www.tenso.com/en/static/lp_shop_booth is recommended by BOOTH for international shipping) DTG Edition, Mens: http://www.cafepress.com/cp/customize/product2.aspx?from=CustomDesigner&number=1941085036 DTG Edition, Womens: http://www.cafepress.com/cp/customize/product2.aspx?from=CustomDesigner&number=1941085496 We hope you like them! Posted by ICFPC2016 Organizers at 3:10 PM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Friday, September 2, 2016 Winners have been notified. We have sent the notification of all prizes to the winners. The emails were sent from the address icfp-contest _at_ researchr _dot_ org on 17 and 29 August. Please check your mail box whether the notification is buried under spam messages. Posted by ICFPC2016 Organizers at 4:04 PM 1 comment: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Sunday, August 21, 2016 We are making T-shirts! We are planning to make ICFP Programming Contest 2016 T-shirts. If you are interested, please fill in this questionnaire so we can estimate the total number of orders. ICFP Programming Contest 2016 T-shirts Questionnaire Note that submitting this form does NOT place an order. We will later announce the details on how to order them on this blog. This activity is approved by our sponsors, ACM and ICFP. Posted by ICFPC2016 Organizers at 1:02 PM No comments: Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Monday, August 8, 2016 You've done a great job! We have been receiving a lot of heartwarming messages, and are already learning that many of the solutions had been generated by karate humans or computer-aided humans. You have shown another class of problems computers alone cannot solve well, and have shown the importance of human-computer collaboration. All the efforts you have put in are the live evidences that make the vision beyond The Singularity substantially brighter, than any predictions and spells found in the Kojiki. The purpose of the contest has been fulfilled. Posted by ICFPC2016 Organizers at 2:35 AM Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest The contest is over! The contest is over! You may not submit solutions anymore. We would like to remind you once again to submit your source code. See the source code submission instructions for details. You can still update your team profile on the server for the next 24 hours. Meanwhile, we have set up a postmortem server, where we have put all the submitted problems. If you want to continue playing, please use the postmortem server. We hope you have enjoyed this year's ICFP programming contest. We love you all and are deeply grateful for your participation. Please look forward to the announcement of the final results at ICFP 2016. Good game, everyone! Posted by ICFPC2016 Organizers at 12:00 AM Email ThisBlogThis!Share to XShare to FacebookShare to Pinterest Older Posts Home Subscribe to: Posts (Atom) Blog Archive ▼ 2016 (24) ▼ September (4) Judge's source codes have been published Contest results are up! We started accepting T-shirt orders! Winners have been notified. ► August (18) ► July (2) Past contests ICFP Programming Contest 2015 ICFP Programming Contest 2014 ICFP Programming Contest 2013 ICFP Programming Contest 2012 ICFP Programming Contest 2011 ICFP Programming Contest 2010 ICFP Programming Contest 2009 ICFP Programming Contest 2008 ICFP Programming Contest 2007 ICFP Programming Contest 2006 ICFP Programming Contest 2005 ICFP Programming Contest 2004 ICFP Programming Contest 2003 ICFP Programming Contest 2002 ICFP Programming Contest 2001 ICFP Programming Contest 2000 ICFP Programming Contest 1999 ICFP Programming Contest 1998 Watermark theme. Powered by Blogger.'''
