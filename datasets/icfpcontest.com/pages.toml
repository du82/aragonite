["https://icfpcontest.com/index.html"]
title = "ICFP contest 2025"
full_description = "This is the 28th instance of the annual, 72-hour programming contest series sponsored by the ACM SIGPLAN International Conference on Functional Programming. The contest first ran in 1998. Winners will be presented in October at the ICFP/SPLASH mega-conference in Singapore. The contest will be held from Friday 5th Semptember 2025 at 12:00 UTC to Monday 8th September 2025 at 12:00 UTC. There will be a lightning division, ending on Saturday 6th September 2025 at 12:00 UTC."
