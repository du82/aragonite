["https://icfpcontest2017.github.io/post/lambdaduct"]
title = "Lambda Duct -- Offline mode simulator"
full_description = "Lambda Duct -- Offline mode simulator ● 05 Aug 2017 We have released the initial version of Lambda Duct – an offline mode simulator for Lambda Punter. Lambda Duct acts as a bridge between a client in offline mode and an online game server. Please refer to the Lambda Duct repository on GitHub for instructions on how to install and use it. TL;DR Install Lambda Duct via OPAM $ opam pin add lambda-duct https://github.com/icfpcontest2017/lambda-duct.git Then supply the name of your client program (configured to run in offline mode) and the port of the game you want to connect to $ lamduct --game-port <port> ./<name of client program> Note the ./ in front of the client program name. Happy punting! contest"
