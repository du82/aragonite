["https://icfpcontest2017.github.io/post/full-one"]
title = "Full contest (I)"
full_description = 'Full contest (I) ● 28 Aug 2017 The results of the first round of the full contest are now available. Their were 146 entries in total. You can watch the replays of all the games on PuntTV. Bad punters As with the lightning contest, we do not include entries that failed to score on our simplest test map. In total, 26 entries failed to score: ゲームセンターYAGI aelburicus ball.icfp2017 Canivsar chirimenjako Dragons frosch03 Get Counterstrike and Race for the Galaxy at http://store.steampowered.com/! IKS InforFun Junk Food KMCDragon lambda-llama Lambda Riot Leonardone @ NEETSDKASU Lonely Punter masakt MaxInt Milky Holmes OtakuPunter paiv Parse error sonna*baka*na VorpalSwords Xiphon and the physicists YukashitaOu The most common problem seems to be that the protocol is not implemented correctly — resulting in some kind of exception being raised. Several entries fail to include the message size in their messages. There are various problems with managing the serialised game state. Some entries expect the server to send JSON state in the setup message matching a schema that is only defined by their clients. Another problem is relying on a particular order for fields of JSON objects that did not match the one of our testing framework. Some entries rely on writing state to the file system (explicitly disallowed by the specification). At least one entry always attempts to make illegal moves. Results A total of 120 teams took part in the first round. We used the same methodology as for the first round of the lightning contest, but with one fewer map (we only used one of the randomly generated maps compared with two in the first round of the lightning contest). The maps are here: circle lambda randomMedium triangle For each of the 8 possible combinations of extensions and each of the 4 maps we assigned groups of 4 teams (each group playing 4 times in order to allow every team to play in every position). This gave rise to a total of 3840 games. The results are as fo