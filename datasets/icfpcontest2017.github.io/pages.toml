full_description = "Futures! ● 04 Aug 2017 The Futures are here! We are releasing the first extension of the contest: Futures. Futures are bets on reaching a particular site from a mine and are well rewarded if fulfilled. But beware because failure can be costly … The Futures specification is here. We also made modifications to the problem description bumping it to version 1.3. Changes Fixed typo in the type of the contents of the “timeout” message: Float rather than GameState. Clarified which moves are sent along with a stop message. Clarified that the size header in a message is a string. Clarified that the VM will be used for the evaluation. contest"
