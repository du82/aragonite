["https://icfpcontest2021.github.io"]
title = "ICFP Contest 2021"
full_description = "The scoreboards for the full division and lightning division have been updated as well with the complete rankings. We will provide a link to the video recording of the programming contest report as soon we have it. Congratulations to the winners, and thanks again to everyone who took part! We're excited to announce that we have open sourced the code that we used to put together the contest under the BSD3 license. We've sent e-mails notifying the winners. The final scoreboard will be reavealed and the winners will be announced at the ICFP conference on August 23-25, 2021. The final scoreboard for the lightning and the full division is now available. Teams with 0 points are not shown, and the top 15 teams in both rounds have been randomly shuffled, and their score hidden to keep some intrigue. We will get in touch with the winners soon. Some teams have already posted interesting writeups on how they approached the problem. We started collecting these here. Several people have asked what will happen to the poses.live website now that the contest is over. Since there is some interest in keeping it around, the organisers will move this to a smaller instance on a personal server. All data from the contest will be wiped, and teams will have to re-register on this new instance if they want to continue trying it out. There will be significant downtime this week as we move it. We will also release source code of the portal and judge after the contest presentation at ICFP 2021. Thanks again to everyone for taking part in this! We would like to thank all teams for particating, and we hope people had a lot of fun implementing UIs and solvers for the problem, regardless of how well they did on the scoreboard. The poses.live server will remain up for a bit more. If you want to qualify for prizes, don't forget to upload your source code on your team profile page within the next 12 hours. The winners of the contest will be announced at the 2021 International Conference on Functional Programming, taking place Sun 22 - Fri 27 August."
year_published = 2025
clearnet = "https://icfpcontest2021.github.io"
tags = ["00:00", "08:49", "09:52", "12:00", "13:30", "14:13", "15:36", "16:30", "17:45", "17:54"]
