["https://icfpcontest2022.github.io"]
title = "ICFP Contest 2022 Homepage"
description = "ICFP Contest 2022 will take place between 2nd and 5th of September!"
full_description = "ICFP Contest 2022 Homepage Announcements ICFP Programming Contest Lightning Division Standings Are Published You can check scoreboard page to see your standing. ICFP Programming Contest Final Round Standings Are Published You can check scoreboard page to see your standing. ICFP Programming Contest Awards Are Given First prize goes to Unagi Rust, Go and Python is the programming tool of choice for discriminating hackers. Second prize goes to RGBTeam Rust, C++ and Python is a fine programming tool for many applications. Third prize goes to Pigimarl C++, Rust and Python is also not too shabby. Winner of the lightning division is RGBTeam Rust, C++ and Python are very suitable for rapid prototyping. Judges’ prize goes to The Cat is Number 1 The Cat is Number 1 are an extremely cool bunch of hackers. ICFP Programming Contest Report Session at ICFP Results of ICFP Programming Contest will be announced between 15.40-16.00(UTC) on 13th of September at the ICFP Programming Contest Report Session. Session will be broadcasted live on youtube, we will provide the link over the discord/twitter and also this website a few minutes before the session. You can use the youtube link below to watch the session Youtube Link: https://youtu.be/n_bbsxEoPVI Information ICFP Contest is an annual 72-hour programming contest organized under ICFP (International Conference on Functional Programming) since 1998. If you are a first time participant of ICFP Contest, you can check previous contests (2021, 2020, 2019, 2018) or our about page. Please follow the contest twitter for trivias and announcements until the contest! Further enquires and real-time communication about the contest takes place on the ICFP Discord channel #programming-contest. ICFPC 2022 will take place between 2nd UTC 12(noon) and 5th UTC 12(noon) of September. Details regarding the contest will be posted on this page until, through, and after the contest. Please stay locked in for any announcements! Registrations are now open at https://robovinci.xyz! Specification You can react the specification at Specification tab"
