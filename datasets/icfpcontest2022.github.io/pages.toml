["https://icfpcontest2022.github.io/rules"]
title = "Rules"
description = "ICFP Contest 2022 will take place between 2nd and 5th of September!"
full_description = "Rules (1) This is an open contest. Anyone may participate in ICFP Programming Contest 2022 except for the ICFP 2022 Contest organizers. (2) No advance registration or entry fee is required. (3) Contestants are free to organise themselves into teams of any size. A contestant may only be a member of a single team. Teams may not divide, merge, or collaborate after the start of the contest. (4) Teams are free to use any programming language(s) on any platform(s). (5) Teams must register during the contest to obtain credentials. Teams using more than one set of credentials during the contest will be disqualified. (6) Teams wishing to be considered for prizes must submit source code at the end of the contest. The exact details of contest submissions will be announced at the start of the contest. Teams may submit multiple times during the contest; early submissions may be evaluated during the contest for live standings, but only the last submissions for the lightning division and the full contest will be considered for prizes. (7) The Organizers retain the right to monitor, record, and investigate the submissions, other contest-related activities, or lack thereof, of contestants and teams. The records are used for the sole purpose of judgment and are discarded once the contest-related events are over. (8) Contestants are kindly asked not to attempt to attack the contest server. That will spoil the fun for the other teams and the Organizers, who worked hard to bring you this experience. Violations of these rules, attempts to compromise the integrity of the contest infrastructure, attempts to interfere with other contestants, collusion between the teams, or attempts to contravene the spirit of the contest will lead to disqualification of the involved contestants and/or teams. (9) Contestants retain ownership of all intellectual property rights in and to any submitted solutions, source code, custom tools, and related materials (“Submissions”) that contestants had before submission. As a condition of submission, contestants grant the Organizers a non-exclusive, perpetual, irrevocable, worldwide, royalty-free license to use, reproduce, publish, distribute, publicly perform and publicly display the Submissions, allowing the Organizers to test and evaluate the Submissions for purposes of the contest. (10) All decisions of the Organizers are final. * These rules are taken from rules page of ICFP2021, we kindly thank the organizers of the contest."
