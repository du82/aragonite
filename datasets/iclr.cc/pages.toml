title = "2025 ICLR Call for Socials"
full_description = "Select Year: (2025) 2025 2024 2023 2022 2021 2020 2019 2018 2017 2016 2015 2014 2013 Dates Calls Call for Papers Call for Workshops Call for Tiny Papers Call for Blog Posts Call for Socials Guides FAQ Poster Information Author Guide Reviewer Guide Area Chair Guide Senior Area Chair Guide Attend Register Visa and Travel Information Financial Assistance and Volunteering Child Care Code of Conduct Organization Organizing Committee Program Committee ICLR Board Reviewers Ethics Committee Exhibitors ICLR 2025 Call for Socials ICLR 2025 continues to support the strong community-building role that is so central to the conference. We hope to create opportunities for all participants to meet new people and to share knowledge, best-practices, opportunities, and interests. A Social is a participant-led meeting centered around different themes. These themes can be anything ranging from a gathering around research topics and interests (e.g., generative models, reinforcement learning, social impact ML), around skills exchange and training (e.g., giving better presentations, guidance on academic job applications), supporting affinity group meetings (e.g., Women in Machine Learning), or other social and intellectual gatherings. If you are interested in hosting a Social, please complete this form. Submit this form before 17 March (anywhere on earth). Notifications of acceptance will go out on 24 March. Socials are typically 1.5 - hour long sessions, must have at least two leads (who will organize the session, moderate the session, and ensure respectful communication). Organizers and guests should be registered participants of ICLR. We will review these as quickly as we can after the deadline. We may combine activities, or suggest other modifications (such as suggesting alternative dates/times) in order to balance the program of activities."
