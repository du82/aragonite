["https://iclr.cc/public/JournalToConference"]
title = "Journal To Conference"
full_description = "Select Year: (2025) 2025 2024 2023 2022 2021 2020 2019 2018 2017 2016 2015 2014 2013 Dates Calls Call for Papers Call for Workshops Call for Tiny Papers Call for Blog Posts Call for Socials Guides FAQ Poster Information Author Guide Reviewer Guide Area Chair Guide Senior Area Chair Guide Attend Register Visa and Travel Information Financial Assistance and Volunteering Child Care Code of Conduct Organization Organizing Committee Program Committee ICLR Board Reviewers Ethics Committee Exhibitors The NeurIPS/ICLR/ICML Journal-to-Conference Track The Boards of machine learning conferences NeurIPS, ICLR and ICML have jointly agreed on holding a joint Journal-to-Conference track, through which the authors of published journal papers at selected journals would be given the opportunity to present their work at one of these 3 conferences, of their choosing. This initiative is inspired by the Transactions of the Association for Computational Linguistics (TACL) of the NLP community, where published papers are eligible for presentation at sponsoring NLP conferences. The track considers published papers from the Journal of Machine Learning Research (JMLR), for presentation at an upcoming NeurIPS, ICLR or ICML. Eligibility Eligible papers must: Have been published at JMLR no earlier than January 1st 2024. Moving forward, the eligibility year will increase by 1 year on January 1st of each year, so that the eligibility period is of at most 2 years since publication. Not contain contributions that have already been published at a conference by the same authors. In other words, the journal paper cannot be an extension of a previous conference publication. Not have been presented at a prior edition of this NeurIPS/ICLR/ICML Journal-to-Conference Track. Request to present To request a presentation, the author of an eligible JMLR published paper must submit their request through the following form: https://forms.gle/7baKjVfyaqPWp1nN6 (if for some reason you are not able to use this form, you may email us at journaltoconferencetrack@gmail.com) Each conference has its own deadline for receiving requests, as follows: NeurIPS 2022: September 8th 2022 ICLR 2023: January 13th 2023 ICML 2023: April 24th 2023 NeurIPS 2023: September 24th 2023 ICLR 2024: January 17th 2024 ICML 2024: May 3rd 2024 NeurIPS 2024: September 27th 2024 ICLR 2025: January 24th 2025 ICML 2025: May 3rd 2025 NeurIPS 2025: September 20th 2025 All requests to present eligible papers (as defined above) will be accepted, up until the presentation capacity of the host conference is reached. For more information, see the FAQ below or reach out to us at journaltoconferencetrack@gmail.com . Barbara Engelhardt, Hugo Larochelle, Naila Murray Oversight Committee NeurIPS/ICLR/ICML Journal to Conference Track FAQ Q: Which journal(s) are eligible? A: Only JMLR. This includes JMLR MLOSS (Machine Learning Open Source Software). Q: Does this track accept journal papers that are extensions of a previous conference publication by the same authors? A: No. Q: How old can eligible journal papers be? A: The paper must have been published by JMLR no earlier than January 1st 2024. Q: What is the deadline to submit a request to present at a chosen conference: A: The deadlines are specific to each conference and are as follows: NeurIPS 2022: September 8th 2022 ICLR 2023: January 13th 2023 ICML 2023: April 24th 2023 NeurIPS 2023: September 24th 2023 ICLR 2024: January 17th 2024 ICML 2024: May 3rd 2024 NeurIPS 2024: September 27th 2024 ICLR 2025: January 24th 2025 ICML 2025: May 3rd 2025 NeurIPS 2025: September 20th 2025 Q: Will the paper be included in the chosen conference’s proceedings? A: No. This track only provides an additional opportunity to present the work. It shall not be considered as being published in the proceedings of the chosen conference. Q: Do I have to submit a version of the journal paper in the conference’s publication style format? A: No. We will only require the journal in its JMLR paper format. Q: The journal has confirmed my paper is accepted by email, however the paper doesn't yet appear in the proceedings. Can I still submit a request? A: No. We require that you provide a valid and working link to the PDF of your paper from the journal's proceedings site. Q: What type of presentation will be provided by the chosen conference? A: Generally, the presentation offered will follow the format of a typical poster presentation at the chosen conference. The exact session that will include the presentation will be decided by each conference committee while creating the conference program. Q: What is the review process, how are papers selected? A: There is no further peer review done on submitted papers; they are only checked to ensure they meet the eligibility criteria (see Eligibility above). Q: May the deadline be extended / can I request a deadline extension? A: No; the deadline is already as late as possible (for venue planning, visa purposes etc.) and is firm. Extensions will not be made for any reason."
year_published = 2025
