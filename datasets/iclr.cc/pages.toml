["https://iclr.cc/Conferences/2022/CallForWorkshops"]
title = "Workshops Call for Proposals 2022"
full_description = "Select Year: (2022) 2025 2024 2023 2022 2021 2020 2019 2018 2017 2016 2015 2014 2013 Dates Calls Call for Papers Call for Workshops Call for Blog Posts Call for Socials Guides Author Guide Reviewer Guide Area Chair Guide Organization ICLR Board Organizing Committee Program Committee Reviewers About ICLR Conference Site ICLR 2022 - Call for Post-Conference Workshops Workshops to take place virtually on April 29, 2022 2021-10-29 Workshop Application Deadline For any information needed that is not listed below, please submit questions using this link: https://iclr.cc/Help/Contact Workshops provide an informal, cutting edge venue for discussion of work in progress and future directions. Good workshops have helped to crystallize common problems, explicitly contrast competing frameworks, and clarify essential questions for a subfield or application area. Workshops are a structured means of bringing together people with common interests to form communities. Good workshops should include some form of community building. There will be seven hours of workshop meetings, split into morning and afternoon sessions, with free time between the sessions for individual exchange. Potential workshop topics range through Deep learning / representations learning for scientific discovery, or for art and creativity, Fairness in machine learning, transparency, governance and inclusion, Implementation issues, parallelization, software platforms, hardware Interpretable machine learning, Learning in Low Resource Scenarios, Optimization for representation learning, Program synthesis, Privacy in machine learning, Robustness, Security and Privacy Uncertainty in representation learning Applications in vision, audio, speech, natural language processing, robotics, neuroscience, healthcare, agriculture, pandemic response, or any other field, as well as any other topic relevant to an appreciable fraction of the ICLR community. Detailed descriptions of previous workshops may be found in last year's online schedule. Workshop schedules should encourage lively debates, stimulate the production of new ideas and the discussion of important issues. To this end, a good workshop proposal should be designed to attract roughly between 1% and 10% of conference attendees. Every group considering submitting a workshop must read the Guidance for ICLR Workshop Proposals 2021, which describes the philosophy behind hosting workshops, includes templates of previous successful proposals, details the selection criteria and process, describes what is considered a conflict of interest, and includes other frequently asked questions. Submission Instructions Proposals should be submitted through an application using the CMT system: https://cmt3.research.microsoft.com/ICLRWorkshops2022 Important dates for workshop submissions: Workshop Application Open: 20 September 2021 Workshop Application Deadline: 29 October 2021 Workshop Acceptance Notification: 6 December 2021 Suggested Submission Date for Workshop Contributions: 25 February 2022 Mandatory Accept/Reject Notification Date: 25 March 2022 The criteria and process by which proposals will be assessed are described in the Guidance for ICLR Workshop Proposals 2022. Funding The organizers of each accepted workshop can name four individuals per day of the workshop to receive complimentary workshop registration. Feryal and Vukosi iclr-2022-workshop-chairs@googlegroups.com ICLR 2022 Workshop Chairs"
