["https://iclr.cc/Conferences/2025/Press"]
title = "Press"
full_description = "Select Year: (2025) 2025 2024 2023 2022 2021 2020 2019 2018 2017 2016 2015 2014 2013 Dates Calls Call for Papers Call for Workshops Call for Tiny Papers Call for Blog Posts Call for Socials Guides FAQ Poster Information Author Guide Reviewer Guide Area Chair Guide Senior Area Chair Guide Attend Register Visa and Travel Information Financial Assistance and Volunteering Child Care Code of Conduct Organization Organizing Committee Program Committee ICLR Board Reviewers Ethics Committee Exhibitors ICLR Press Page Media Kit ICLR 2025 Test of Time and Outstanding Announcements coming soon... ICLR 2024 Test of Time and Outstanding Paper Award Winners ICLR 2024 Fact Sheet ICLR 2023 Outstanding Paper Award Winners ICLR 2023 Fact Sheet ICLR 2022 Fact Sheet Press Accreditation The 2025 press application is now open - Apply Here. Submitt your press questions to press@iclr.cc. The International Conference on Learning Representations “ICLR” program requires individuals applying for accreditation to be professional journalists and represent media organizations. ICLR reserves the right to deny or withdraw accreditation of journalists from media organizations if any actions are deemed improper or inconsistent with the principles of the Organization. Press accreditation qualifications Press accreditation is strictly reserved for members of the press. Applicants must show they are professional members of the press with a proven track record. Media accreditation is not accorded to the information outlets or advocacy publications of non-governmental organizations. Accreditation Process To begin, you will need the following information. The names and information entered are for purposes of identification and verification only and will not be published for general access. This information will be retained in the system for reference unless a written request to remove it is received. Then create a profile: https://iclr.cc/Profile/create. E-mail address Complete name Name of organization Organization Website Read and confirm you agree to the Code of Conduct We will ask you to submit recent articles that demonstrate a track record of reporting and demonstrate active engagement in covering the activities of AI research. Samples must be unaltered clippings or media products from the organization written by the individual requesting accreditation. Receiving accreditation Every effort will be made to issue the accreditation as soon as possible. Applications are considered on a case-by-case basis and the decisions are final. Accreditation covers the duration of the conference. Double registration is not allowed. If you are already registered as an attendee or sponsor, your application for press accreditation will not be granted. Freelance journalists are subject to the same requirements for accreditation and must complete the full process. Freelance journalists, including photographers, must provide clear evidence they are on assignment from a specific news organization or publication. A valid assignment letter from that news organization, or publication, is required. Photographic agencies must provide clear evidence from a client news organization or publication. You must also submit the other required documents for accreditation. ICLR is making efforts to take on broad new forms of information dissemination and social networking. Accreditation of bloggers for ICLR meetings will be done on a case-by-case basis and criteria currently applied to online media will be applied. We are aware that assignments can change on short notice. Please communicate changes to staff as soon as they are known. The applicant will have to complete the same process, but as long as they have the required valid materials, there is usually little delay in processing. An organization that welcomes citizen journalists and has no apparent editorial board oversight would not be eligible for accreditation. Accreditation approval Once you have received confirmation of accreditation, you will be registered for the conference. When attending the conference, your registration will be processed as a complimentary registration, and you will receive an email confirmation for the conference as well as access to the virtual platform once access is open for attendees. Access All accredited press are granted full access to the in-person and virtual events. Disclaimer The ICLR General Chair reserves the right to deny or withdraw accreditation for activities that violate the principles of the Code of Conduct and/or ethics of journalism and/or ICLR. At any time, the ICLR General Chair may revoke accreditation if it is put to improper use, if it has been used to abuse the privileges so extended, or if personal or public conduct is not consistent with the best interest of the organization."
