["https://iclr.cc/Conferences/2025/CallForTinyPapers"]
title = "Call for Tiny Papers 2025"
full_description = 'Select Year: (2025) 2025 2024 2023 2022 2021 2020 2019 2018 2017 2016 2015 2014 2013 Dates Calls Call for Papers Call for Workshops Call for Tiny Papers Call for Blog Posts Call for Socials Guides FAQ Poster Information Author Guide Reviewer Guide Area Chair Guide Senior Area Chair Guide Attend Register Visa and Travel Information Financial Assistance and Volunteering Child Care Code of Conduct Organization Organizing Committee Program Committee ICLR Board Reviewers Ethics Committee Exhibitors Tiny Papers in 2025 This year, the Tiny Papers Track has been integrated into the workshops! The Tiny Papers Track was established in 2023 (and held again in 2024) to attract under-represented, under-resourced, and budding researchers who may not yet have the resources to submit full papers to the ICLR Conference track. As this aim significantly overlaps with an aim of the ICLR Workshops, this year, we ask that Workshops extend this support to their participants directly. Please check individual workshops for their Tiny and Short Papers tracks when the workshop roster at ICLR 2025 is finalized! Frequently Asked Questions (FAQs) Can I submit a 2-page tiny paper directly to a general tiny papers submission track, like in prior years? No: This year, there will be no submission venue just for tiny papers. Instead, each workshop will host a tiny or short papers submission track within its own workshop venue. What are the ICLR 2025 Workshops? Workshops are proposed by the community according to the ICLR 2025 Call for Workshops, and will be held after the main conference event; see Dates and Registration for details on when and how to attend. Will the ICLR 2025 Workshops only accept tiny papers? No. Workshops are free to create submission tracks beyond a tiny or short papers track, including a longer paper track. The objective of ICLR Workshops includes but is broader than the original Tiny Papers mission; namely it is threefold: to create alternative entry points to research, and in particular, approachable avenues for beginners to enter and enjoy the ICLR community; to celebrate intermediate breakthroughs in representation learning research; to efficiently disseminate ideas, findings, and opinions within the ICLR community. What are the page limits, deadlines, evaluation criteria, submission process, plans for publication as proceedings, etc. for workshop tiny and short papers? These may vary by workshop according to the needs and standards of subcommunities represented by the ICLR Workshops. However, all workshops need to meet the specifications for workshops described in the ICLR 2025 Call for Workshops, which includes hard deadlines for submissions and decisions. Please see individual workshop calls for tiny and short papers when the workshop roster is finalized for final details. Is there financial assistance available for authors of workshop tiny and short papers to attend ICLR in person, or to attend virtually? Authors of workshop papers, including tiny / short workshop papers, may be eligible for funding from ICLR to attend in person or virtually, but need to submit a separate application for Financial Assistance that is used by the DEI Chairs to make funding determinations for all ICLR contributors. This application for Financial Assistance to attend ICLR 2025 will become available on the ICLR 2025 conference homepage at the beginning of February, and will close on March 2nd. Contact For questions about tiny papers not answered in the above FAQs, please use "Equity, Diversity, Inclusion" on the ICLR Contact page to get in touch with the ICLR 2025 DEI Chairs. If your question is answered by the above FAQs, you will not receive a response due to the high volume of emails we receive.'
