nitialPricing = false; if (data['initial']) { if (data['tutorials']) { $("#tutorials").attr("checked", "checked"); } ; if (data['conference']) { $("#conference").attr("checked", "checked"); } ; if (data['workshops']) { $("#workshops").attr("checked", "checked"); } ; if (data['student']) { $("#student").attr("checked", "checked"); } ; getpricing(); } getInitialPricing = false; $("#pricingSpinner").addClass('d-none'); $("#earlyregistration").html(data['early_invoice_html']); $("#lateregistration").html(data['late_invoice_html']) }, }) } $(function () { getpricing(); }) addRegistrationItem = function (event) { $.ajax({ url: "/Register", type: "POST", data: { csrfmiddlewaretoken: csrftoken, action: "addRegistrationItem", registrationID: "", registrationItemID: event.target.id, }, success: function (data) { if (data['status'] == 'Success') { window.location.reload(); //doing a window reload rather than the two calls below gets the payment options too. //getRegistrationTable(); //getProductPickerMenu(); } else { alert(data['status']); } }, }) return false; } $(function () { $(".registrationMenu").click(addRegistrationItem) }); $("#id_pronoun").on("change", function (event) { target = event.target if (target.value == 1) { /*We are selecting other*/ var newInput = "<input id='other-pronoun' maxlength='32' name='other-pronoun'class='form-control' value='' placeholder='indicate desired pronoun (32 characters max)'>" $(target).after(newInput); } else { /*Remove the input value so it doesn't get submitted*/ $("#other-pronoun").remove(); } }) $("[name='affiliation']").on("change", function () { $("#checkPricing").click(); }) var saturday_checked = $("#registration_form").find("input.checkbox-on-left[name='Saturday Workshop 1 Day Pass']").prop("checked"); var friday_checked = $("#registration_form").find("input.checkbox-on-left[name='Friday Workshop 1 Day Pass']").prop("checked"); var either_checked = friday_checked || saturday_checked; var others_checked = $("#registration_form").find("input.checkbox-on-left:checked").not("[name='Friday Workshop 1 Day Pass']").not("[name='Saturday Workshop 1 Day Pass']").length != 0; if (either_checked & others_checked) { $("#registration_form").find("input.checkbox-on-left[name='Saturday Workshop 1 Day Pass']").prop("checked", false); $("#registration_form").find("input.checkbox-on-left[name='Friday Workshop 1 Day Pass']").prop("checked", false); alert("If you registered for the 'Conference and Workshops' you do not need the Friday or Saturday 1 Day pass. " + "Unchecking the 1 Day Pass. "); } var virtual_pass_checked = $("#registration_form").find("input.checkbox-on-left[name='Virtual Only Pass']").prop("checked"); var others_checked = $("#registration_form").find("input.checkbox-on-left:checked").not("[name='Virtual Only Pass']").length != 0; if (virtual_pass_checked & others_checked) { $("#registration_form").find("input.checkbox-on-left[name='Virtual Only Pass']").prop("checked", false); alert("A virtual only pass is included if you register f'''
