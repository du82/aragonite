["https://iclr.cc/public/DiversityInclusion"]
title = "Diversity and Inclusion Policy and Groups"
full_description = "Select Year: (2025) 2025 2024 2023 2022 2021 2020 2019 2018 2017 2016 2015 2014 2013 Dates Calls Call for Papers Call for Workshops Call for Tiny Papers Call for Blog Posts Call for Socials Guides FAQ Poster Information Author Guide Reviewer Guide Area Chair Guide Senior Area Chair Guide Attend Register Visa and Travel Information Financial Assistance and Volunteering Child Care Code of Conduct Organization Organizing Committee Program Committee ICLR Board Reviewers Ethics Committee Exhibitors ICLR 2025 Group Activities The schedule of events for diversity groups will appear here once it's known. Diversity Equity & Inclusion The International Conference on Learning Representations is taking seriously questions of diversity, equity, and inclusion in our conference. Our efforts are building on several grassroots efforts from the Women in Machine Learning, Black in AI, Queer in AI and LatinX in AI. ICLR is working to expand these efforts to make the conference as welcoming as possible to all. In addition to hosting diversity-related events, the conference is also making and considering structural changes. These include a Code of Conduct introduced in 2018. We are actively working to make the conference event itself more inclusive, including supporting childcare, nursing mothers, attendees with disabilities, and gender inclusive measures. We have also introduced a new Diversity, Equity and Inclusion (DEI) Action Fund. Donations are solely designated to provide accommocations for individuals who might otherwise be excluded or marginalized from the ICLR conference, and to support programs that champion fair, impartial and equal access to opportunities and resources in the ICLR research community. Any DEI Action Fund donations that are unable to be utilized in the current year will be used for these purposes in future years. Financial Assistance Anyone needing financial assistance in order to attend and participate in the annual ICLR conference can apply through our Financial Assistance Application program. WIML {Dis}Ability in AI Please contact us with any assistance needs at the conference. DEI Action Fund The DEI Action Fund is made possible each year with generous donations from some of our sponsors. Women in Machine Learning » Black in AI » Latinx in AI » Queer in AI » Jews in ML » {Dis}Ability in AI »"
