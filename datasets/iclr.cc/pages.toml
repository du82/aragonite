["https://iclr.cc/Conferences/2021/CallForWorkshops"]
title = "Workshops Call for Proposals 2021"
full_description = "Select Year: (2021) 2025 2024 2023 2022 2021 2020 2019 2018 2017 2016 2015 2014 2013 Dates Calls Call for Papers Call for Workshops Call for Socials Guides Presentation Guide Reviewer Guide Area Chair Guide Author Guide Workshop Organizer Guide Participate Virtual Conference FAQ Virtual Conference Workshop Instructions Organization ICLR Board Organizing Committee Program Committee Reviewers Volunteers About ICLR Conference Site ICLR 2021 - Call For Workshop Proposals Workshops taking place in virtually, May 8, 2021 2020-11-09 Workshop Application Deadline Time left to submit: The date WorkshopApplicationDeadline not found. For any information needed that is not listed below, please submit questions using this link: https://iclr.cc/Help/Contact Following the ICLR 2021 main conference, workshops on a variety of current topics will be held on Friday, May 7, 2021. We invite researchers interested in chairing one of these workshops to submit proposals. Workshop organizers have several responsibilities, including coordinating workshop participation and content, publicizing and providing the program in a timely manner, and moderating the program throughout the workshop. Goal of ICLR Workshops Workshops provide an informal, cutting edge venue for discussion of work in progress and future directions. Good workshops have helped to crystallize common problems, explicitly contrast competing frameworks, and clarify essential questions for a subfield or application area. Workshops are a structured means of bringing together people with common interests to form communities. Good workshops should include some form of community building. There will be seven hours of workshop meetings, split into morning and afternoon sessions, with free time between the sessions for individual exchange. Potential workshop topics range through AI for Agriculture, AI for Pandemic Prevention and Response, Interpretable machine learning, fairness in machine learning, transparency, governance and inclusion, Uncertainty in representation learning, Deep learning / representations learning for scientific discovery, or for art and creativity, Program synthesis, Privacy in machine learning, Energy efficiency in machine learning, Optimization for representation learning, Implementation issues, parallelization, software platforms, hardware, ML systems, Applications in vision, audio, speech, natural language processing, robotics, neuroscience, healthcare, or any other field, as well as any other topic relevant to an appreciable fraction of the ICLR community. Detailed descriptions of previous workshops may be found in last year's online schedule. Workshop schedules should encourage lively debates, stimulate the production of new ideas and the discussion of important issues. To this end, a good workshop proposal should be designed to attract roughly between 1% and 10% of conference attendees. Every group considering submitting a workshop must read the Guidance for ICLR Workshop Proposals 2021, which describes the philosophy behind hosting workshops, includes templates of previous successful proposals, details the selection criteria and process, describes what is considered a conflict of interest, and includes other frequently asked questions. Submission Instructions Proposals should be submitted through an application using the CMT system: https://cmt3.research.microsoft.com/ICLRW2021 Important dates for workshop submissions: Workshop Application Open: 11 September 2020 Workshop Application Deadline: The date WorkshopApplicationDeadline not found. Workshop Acceptance Notification: The date WorkshopAcceptanceNotifications not found. Suggested Submission Date for Workshop Contributions: 26 February 2021 Mandatory Accept/Reject Notification Date: 26 March 2021 The criteria and process by which proposals will be assessed are described in the Guidance for ICLR Workshop Proposals 2021. Funding ICLR does not provide travel funding for workshop speakers. In the past, some workshops have sought and received funding from external sources to bring in outside speakers. The organizers of each accepted workshop can name four individuals per day of the workshop to receive complimentary workshop registration. Chelsea and Sanmi iclr-2021-workshop-chairs@googlegroups.com ICLR 2021 Workshop Chairs"
