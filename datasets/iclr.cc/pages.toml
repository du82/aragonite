["https://iclr.cc/Conferences/2018/CallForWorkshops"]
title = "ICLR 2018 Call for Workshop Submissions"
full_description = "Select Year: (2018) 2025 2024 2023 2022 2021 2020 2019 2018 2017 2016 2015 2014 2013 Dates Schedule Schedule Overview Full Schedule Calls Call for Papers Call for Workshops Attend Hotels Vancouver Tourism City Running Tours Vancouver Virtual Guide Organization ICLR Board Organizing Committee Best Reviewers Area Chairs About ICLR Students Travel Application Volunteer Application 6th International Conference on Learning Representations (ICLR 2018) Call for Workshop Papers Website: http://iclr.cc/ Paper submission deadline: 5:00pm Eastern Standard Time, February 12, 2018 or Date not found: WorkshopSubmissionDeadline Location: Vancouver Convention Center, Vancouver, BC, Canada, April 30-May 3, 2018 Overview At the workshop track of ICLR 2018 we solicit the submission of 3 page abstracts. As with last year, the Workshop Track will focus and favor late-breaking developments, very novel ideas and position papers. Topics covered may include: Unsupervised, semi-supervised, and supervised representation learning Representation learning for planning and reinforcement learning Metric learning and kernel learning Sparse coding and dimensionality expansion Hierarchical models Optimization for representation learning Learning representations of outputs or states Implementation issues, parallelization, software platforms, hardware Applications in vision, audio, speech, natural language processing, robotics, neuroscience, or any other field Extended abstracts submitted to the Workshop Track are strictly limited to 3 pages, excluding references. These contributions are considered as workshop papers and can be published elsewhere, i.e., they are not subject to the dual submission policy restriction or double-blind of our conference track papers. Selection of abstracts is performed via a light single-blinded review process, unlink the main conference which this year was double blind. Note that some of the conference submissions that are not accepted to the Conference Track but fit the novelty requirements of this call for abstract, may also be invited to be presented, without need for further review, under the Workshop Track. ICLR Submission Instructions - Workshop Track By February 12th, 2018, 5:00 PM Eastern Standard time, authors must submit the PDF of their extended abstract to openreview: https://openreview.net/group?id=ICLR.cc/2018/Workshop For more information on preparing your extended abstract, including style files for the Workshop Track, please see: iclr2018_stylefiles_workshop.zip Acceptance decisions of extended abstract will be sent by March 9th. At least one author of each accepted extended abstract will be required to register to the ICLR event and present their work. Senior Program Chair Tara Sainath, Google Program Chairs Iain Murray, University of Edinburgh Marc’Aurelio Ranzato, Facebook Oriol Vinyals, Google DeepMind Steering Committee Aaron Courville, Université de Montreal Hugo Larochelle, Google General Chairs Yoshua Bengio, Université de Montreal Yann LeCun, New York University and Facebook Contact The organizers can be contacted at iclr2018.programchairs@gmail.com"
