["https://iclr.cc/virtual/2021/index.html"]
title = "Getting Started"
full_description = '''Select Year: (2021) 2025 2024 2023 2022 2021 2020 2019 2018 2017 2016 2015 2014 2013 Getting Started Schedule Papers Workshops Community Socials Town Hall Mentorship Sponsor Hall Featured Invited Talks Orals Organizers Welcome to the ICLR 2021 virtual conference! The ICLR 2022 organizers put together an exciting program of invited talks, contributed research papers, socials, and workshops. To jump right into the conference program, we recommend the conference schedule to get started. You can also find more details about the virtual conference format in the opening remarks from the organizing committee. Read on below to learn more about how to use all elements of the virtual conference site. System Requirements To access the site you will need a modern browser with JavaScript enabled. This website uses several external tools, namely Rocket.Chat, Zoom, and GatherTown. GatherTown works best in Chrome, Edge, Firefox or Brave. You will not need to download any special software although there is a link in the Help menu on this page to the desktop version of RocketChat if desired. A 10 mb of inbound bandwidth is recommended. Navigating the Website You may access all parts of the virtual conference using the top menu bar. Check the Schedule to get an overview of when the live sessions for all events are taking place. You may navigate all the papers in the Papers section of the Main Conference. You may search for titles and authors or look through all papers by skimming titles and bookmarking them. You can bookmark other sessions as well. If you go to your name in the top right corner and click on My Bookmarks in the dropdown menu, you can download the schedule with all sessions you bookmarked or you can subscribe to your bookmarks inyour calendar. Video Each event has a live stream on the top of the page that you can watch during and after the presentation. Finished videos will be available after the conference. Rocket.Chat All registered attendees will have access to Rocket.Chat, a separate Rocket.Chat account is not needed. If you have problems with Rocket.Chat try refreshing the page. If that does not work try logging out and then logging back in. Each session has a Rocket.Chat channel. Questions for the speakers should be posted there. Other participants that are also interested in the question can comment or put emoji on the post to increase its visibility. Eventually, the moderator will select questions to ask the speaker. Speakers will be able to continue answering questions on Rocket.Chat after the end of their talk for approximately one hour. HelpDesk There is a #HelpDesk channel in Rocket.Chat where you can post any conference support questions. If you are not able to access Rocket.Chat, open a request here. Full Screen Mode You can run Rocket.Chat in Full-Screen Mode which lists all the channels you've visited. To go to Full-Screen Mode click on the Full [ ] icon in the top right corner. When prompted select Authenticate with OAuth and then click the blue Authorize button in the Authorize Rocket.Chat window. Desktop Client You can also use the desktop client which provides better notification. You can download the desktop client for your platform here. When you run it enter the server URL: https://chat.iclr.cc. You may be prompted to log into iclr.cc. After you log in, select Authenticate with OAuth and then click the blue Authorize button in the Authorize Rocket.Chat window. Poster Sessions The poster sessions will be held in GatherTown. You can access the poster in GatherTown by clicking "Visit Poster at Spot XX in Virtual World" on the paper's page. GatherTown requires a registration. GatherTown If you just registered it can take up to one hour before you will be able to log in to GatherTown. This Video explains how to use GatherTown. GatherTown can be used on a laptop or desktop using Google Chrome, Microsoft Edge, Brave, or Firefox. In some towns, there will be a user named "Helpdesk - Firstname". If you need help, find them or write in the #HelpDesk channel. For internet speeds, we recommend 10 Mbps download and 3 Mbps upload. To fully leverage GatherTown, you should have a camera and microphone on. Timezones This is a cautionary tale about timezones. Several attendees have noticed that the times shown in the virtual website appeared incorrect. The problem was that they chose a timezone that did not adjust for daylight savings time. We highly recommend picking a timezome based off a nearby city, especially if your area observes daylight savings time. Timezones are political and complex and thus confusing. Please check your timezone, and preferably choose a zone based on a city. Note that we are currently in Daylight Savings Time rather than Standard time in most, but not all of the US and Europe. Your current timezone: Calendar You can build custom calendar of ICLR events you want to attend by clicking the events green flag or the green bookmark text next to the events date-time. To view your bookmarks click the dropdown by your name in the top right of the virtual site menu and select MyBookmarks. You can then subscribe to the calendar or download it and import it in your calendar. Sponsors We encourage everyone to visit the sponsor hall just like you would at the physical conference. Some sponsors have a Topia virtual (spatial) world. Chromium browsers work best in spatial worlds. When authenticating choose "Sign in with Email" in red rather than authenticating with Facebook or Google, and use your ICLR email address. News Keep up to date on the latest conference news at the ICLR Blog and follow us on twitter. Code of Conduct Everyone is expected to follow the Code of Conduct. If you have concerns related to your inclusion at that conference, or observe someone else's difficulties, or have any other concerns related to inclusion, please use this Form report the issue. You can report a post in Rocket.Chat by hovering over the post, then click on the three vertical dots, and then select Report. This report is not anonymous. Help In general, please refer to the Help menu at the top right of this page for more details on how to resolve common issues. For technical difficulties, please contact the Rocket.Chat #HelpDesk channel. You can get to it using the Help - Helpdesk RocketChat menu item. If you have problems with Rocket.Chat try refreshing the page and if that does not work try logging out and then logging back in. If you still can't access it, send an email to helpdesk@iclr.cc this email is only for people who can not connect to RocketChat.'''
