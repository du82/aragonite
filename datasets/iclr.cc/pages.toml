["https://iclr.cc/Conferences/2025/Pricing"]
title = "Pricing"
full_description = '''Select Year: (2025) 2025 2024 2023 2022 2021 2020 2019 2018 2017 2016 2015 2014 2013 Dates Calls Call for Papers Call for Workshops Call for Tiny Papers Call for Blog Posts Call for Socials Guides FAQ Poster Information Author Guide Reviewer Guide Area Chair Guide Senior Area Chair Guide Attend Register Visa and Travel Information Financial Assistance and Volunteering Child Care Code of Conduct Organization Organizing Committee Program Committee ICLR Board Reviewers Ethics Committee Exhibitors ICLR 2025 Pricing Both the Conference Sessions (Workshops included) registration and the Sunday and Monday Workshop 1 Day Pass registrations include the Virtual Pass for the entire conference. Affiliation Type Full time student* Academic Industrial Please check the events you wish to price Conference Sessions and Workshops Sunday Workshop 1 Day Pass Monday Workshop 1 Day Pass Virtual Only Pass Scroll Down for Pricing * Full Time Student You must be a full-time student in an accredited undergraduate, Master’s or graduate program, or a continuing student (i.e., accepted into such a program for the next academic cycle). You will be required to upload a digital version of your student ID at registration. If you are an attendee but not a presenter, your student ID must be valid during the time of the conference. If you are a presenter of an accepted work (conference or workshops), your student ID need only be valid at the time of submission of that work. If attending the physical conference, you will need to present your physical student ID when you check in. Reception - Guest Ticket There is a reception on Thursday evening, April 24 that is included with all physical registrations. If you would like to bring an addition guest, purchase the Additional Guest Reception Ticket for $75 as you register. Registration Cancellation Policy Registrations canceled before Apr 14, 2025, you will receive a full refund. Refunds will be issued back to your credit card and may take up to 10 business days to appear on your statement. Registrations cannot be canceled or refunded after that time. Cancel and refund your registration in the Payment and Receipt section of your registration. Registrations are not transferrable Registrations are linked to immigration documents, tax documents and credit card transactions and cannot be transferred to another person. Visa information for physical or hybrid conferences If your visa is denied before Apr 14, 2025, you may cancel and refund your registration in the Payment and Receipt section of your registration for a full refund. If you applied for your visa before March 15, 2025, and you are unable to attend because your visa was denied or you have not received a response we will refund your registration fees. Refund requests must be received within one week of the close of the meeting with documents showing when you applied for your visa and the visa denial . Early pricing ends in if ("earlyregistrationdeadline" != "") { var earlyregistrationdeadline = "2025/03/16 11:59:59 UTC"; $('.earlyregistrationdeadline-countdown').countdown(earlyregistrationdeadline, function (event) { $(this).html(event.strftime('%w weeks %d days %H:%M:%S')); }); } on March 16, 2025, 4:59 a.m. pacific time. if ("cancellationdeadline" != "") { var cancellationdeadline = "2025/04/14 22:00:00 UTC"; $('.cancellationdeadline-countdown').countdown(cancellationdeadline, function (event) { $(this).html(event.strftime('%w weeks %d days %H:%M:%S')); }); } until the cancellation deadline. var getInitialPricing = true; function getpricing() { $("#pricingSpinner").removeClass("d-none"); var csrfmiddlewaretoken = getCookie('csrftoken'); var data = {}; $("#registration-form").find('input').each(function () { data[this.name] = this.checked; }) data["csrfmiddlewaretoken"] = csrfmiddlewaretoken; data['getInitialPricing'] = getInitialPricing; data['affiliation'] = $("[name='affiliation']:checked").val(); data['year'] = 2025; $.ajax({ type: "POST", data: data, }).done(function (data, textStatus, jqXHR) { getInitialPricing = false; if (data['initial']) { if (data['tutorials']) { $("#tutorials").attr("checked", "checked"); } ; if (data['conference']) { $("#conference").attr("checked", "checked"); } ; if (data['workshops']) { $("#workshops").attr("checked", "checked"); } ; if (data['student']) { $("#student").attr("checked", "checked"); } ; getpricing(); } getInitialPricing = false; $("#pricingSpinner").addClass("d-none"); $("#earlyregistration").html(data['early_invoice_html']); $("#lateregistration").html(data['late_invoice_html']) }) } $(function () { getpricing(); }) let conference_components = $("#registration-form").find("input"); let virtual_pass_input = conference_components.filter("input[name='Virtual Pass']"); let other_components = conference_components.not("input[name='Virtual Pass']"); if (conference_components.length > 1) { conference_components.on("change", function () { let virtual_pass_checked = virtual_pass_input.prop("checked"); let others_checked = conference_components.is(":checked"); if (virtual_pass_checked) { $("#registration-form").find("input").prop("checked", false) virtual_pass_input.prop("checked", true); } else if (others_checked) { virtual_pass_input.prop("checked", false); } setTimeout(getpricing, 100); }) }'''
