["https://iclr.cc/Conferences/2025/ChildCare"]
title = "ICLR 2025 Child Care"
full_description = "Select Year: (2025) 2025 2024 2023 2022 2021 2020 2019 2018 2017 2016 2015 2014 2013 Dates Calls Call for Papers Call for Workshops Call for Tiny Papers Call for Blog Posts Call for Socials Guides FAQ Poster Information Author Guide Reviewer Guide Area Chair Guide Senior Area Chair Guide Attend Register Visa and Travel Information Financial Assistance and Volunteering Child Care Code of Conduct Organization Organizing Committee Program Committee ICLR Board Reviewers Ethics Committee Exhibitors ICLR 2025 Child Care We are excited to announce that KiddieCorp is back with us providing childcare services at ICLR 2025! How to register your child To receive child care services at the ICLR 2025 venue, please register your child via KiddieCorp's form below in advance of the conference. Registration is on a first-come, first-served basis until we run out of space. Note that there is a USD $10 per hour per child fee this year. KiddieCorp Registration » Financial assistance for child care ICLR aims to support attendees with child care needs by paying in part or in full for child care services while they participate in conference activities. To apply for this form of assistance, please complete the Child Care Financial Assistance Application form below. ICLR 2025 Child Care Financial Assistance Application » Questions? For further questions or information regarding child care, please reach to the Diversity, Equity & Inclusion (DEI) Chairs via the ICLR contact page."
