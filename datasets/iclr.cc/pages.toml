title = "2021 Conference"
full_description = "Select Year: (2021) 2025 2024 2023 2022 2021 2020 2019 2018 2017 2016 2015 2014 2013 Dates Calls Call for Papers Call for Workshops Call for Socials Guides Presentation Guide Reviewer Guide Area Chair Guide Author Guide Workshop Organizer Guide Participate Virtual Conference FAQ Virtual Conference Workshop Instructions Organization ICLR Board Organizing Committee Program Committee Reviewers Volunteers About ICLR Conference Site ICLR 2021 · The Ninth International Conference on Learning Representations Mon May 3rd through Fri the 7th Virtual Only Conference firstback Virtual Site » Certificate of Attendance » BEWARE of Predatory ICLR conferences being promoted through the World Academy of Science, Engineering and Technology organization. Current and future ICLR conference information will be only be provided through this website and OpenReview.net. Sponsors The generous support of our sponsors allowed us to reduce our ticket price by about 50%, and support diversity at the meeting with travel awards. In addition, many accepted papers at the conference were contributed by our sponsors. View ICLR 2021 sponsors »Become a 2025 Sponsor General Chair Shakir Mohamed, DeepMind Senior Program Chair Katja Hofmann, Microsoft Program Chairs Alice Oh, KAIST Naila Murray, Facebook AI Research Ivan Titov, U Edinburgh / U Amsterdam Workshop Chairs Sanmi Koyejo, U Illinois UC Chelsea Finn, Stanford Area Chairs Area Chairs » Ethics Review Committee Thomas G. Dietterich, Oregon State University Ayanna Howard, Georgia Institute of Technology Chihyung Jeon, KAIST Patrick Lin, California Polytechnic State University Miguel Luengo-Oroz, UN Global Pulse Margaret Mitchell, Google Research and Machine Intelligence Diversity Equity & Inclusion Chairs Jane Wang, Google Emtiyaz Khan, RIKEN AIP Virtual Chairs - Virtual & Volunteers Hendrik Strobelt, IBM Matthias Gallé, Naver Labs Europe Sileye Ba, Loreal Marija Stanojevic, Temple University Engagements Chair - Socials & Sponsors Viktoriia Sharmanska, Imperial Luisa Zintgraf, University of Oxford Contact The organizers can be contacted here. About Us The International Conference on Learning Representations (ICLR) is the premier gathering of professionals dedicated to the advancement of the branch of artificial intelligence called representation learning, but generally referred to as deep learning. ICLR is globally renowned for presenting and publishing cutting-edge research on all aspects of deep learning used in the fields of artificial intelligence, statistics and data science, as well as important application areas such as machine vision, computational biology, speech recognition, text understanding, gaming, and robotics. Participants at ICLR span a wide range of backgrounds, from academic and industrial researchers, to entrepreneurs and engineers, to graduate students and postdocs. A non-exhaustive list of relevant topics explored at the conference include: unsupervised, semi-supervised, and supervised representation learning representation learning for planning and reinforcement learning representation learning for computer vision and natural language processing metric learning and kernel learning sparse coding and dimensionality expansion hierarchical models optimization for representation learning learning representations of outputs or states optimal transport theoretical issues in deep learning societal considerations of representation learning including fairness, safety, privacy, and interpretability, and explainability visualization or interpretation of learned representations implementation issues, parallelization, software platforms, hardware climate, sustainability applications in audio, speech, robotics, neuroscience, biology, or any other field"
