["https://iclr.cc/Conferences/2018"]
title = "2018 Conference"
full_description = "Select Year: (2018) 2025 2024 2023 2022 2021 2020 2019 2018 2017 2016 2015 2014 2013 Dates Schedule Schedule Overview Full Schedule Calls Call for Papers Call for Workshops Attend Hotels Vancouver Tourism City Running Tours Vancouver Virtual Guide Organization ICLR Board Organizing Committee Best Reviewers Area Chairs About ICLR Students Travel Application Volunteer Application ICLR 2018 The Sixth International Conference on Learning Representations Vancouver Convention Center, Vancouver CANADA Mon Apr 30th through May 3rd, 2018 Schedule at a Glance Overview Conference Papers Workshops Papers Invited Talks Orals Mon Tue Wed Thu General Chairs Yoshua Bengio, Université de Montreal Yann LeCun, New York University and Facebook Senior Program Chair Tara Sainath, Google Program Chairs Iain Murray, University of Edinburgh Marc’Aurelio Ranzato, Facebook Oriol Vinyals, Google DeepMind Steering Committee Aaron Courville, Université de Montreal Hugo Larochelle, Google Contact The organizers can be contacted here. Area Chairs » Best Reviewers Amir-massoud Farahmand, Andrew Owens, David Kale, George Philipp, Julien Cornebise, Michiel van de Panne, Tom Schaul, Yisong Yue Registration Pricing » Registration 2018 » Hotel Reservation » Registration Cancellation Policy » Sponsors View ICLR 2018 sponsors Become a Sponsor Overview The performance of machine learning methods is heavily dependent on the choice of data representation (or features) on which they are applied. The rapidly developing field of deep learning is concerned with questions surrounding how we can best learn meaningful and useful representations of data. We take a broad view of the field and include topics such as feature learning, metric learning, compositional modeling, structured prediction, reinforcement learning, and issues regarding large-scale learning and non-convex optimization. The range of domains to which these techniques apply is also very broad, from vision to speech recognition, text understanding, gaming, music, etc. A non-exhaustive list of relevant topics: unsupervised, semi-supervised, and supervised representation learning representation learning for planning and reinforcement learning metric learning and kernel learning sparse coding and dimensionality expansion hierarchical models optimization for representation learning learning representations of outputs or states implementation issues, parallelization, software platforms, hardware applications in vision, audio, speech, natural language processing, robotics, neuroscience, or any other field The program will include keynote presentations from invited speakers, oral presentations, and posters."
