["https://iclr.cc/Conferences/2025/CallForWorkshops"]
title = "Workshops Call for Proposals 2025"
full_description = '''Select Year: (2025) 2025 2024 2023 2022 2021 2020 2019 2018 2017 2016 2015 2014 2013 Dates Calls Call for Papers Call for Workshops Call for Tiny Papers Call for Blog Posts Call for Socials Guides FAQ Poster Information Author Guide Reviewer Guide Area Chair Guide Senior Area Chair Guide Attend Register Visa and Travel Information Financial Assistance and Volunteering Child Care Code of Conduct Organization Organizing Committee Program Committee ICLR Board Reviewers Ethics Committee Exhibitors ICLR 2025 - Call for Workshops List of accepted workshops at ICLR 2025: https://openreview.net/group?id=ICLR.cc/2025/Workshop_Proposals Following the ICLR 2025 main conference, two days of in-person workshops on a variety of current topics will be held on April 27 and 28, 2025 in Singapore. We invite researchers interested in chairing a workshop to submit proposals. Workshop organizers have several responsibilities, including coordinating workshop participation and content, publicizing and providing the program in a timely manner, and moderating the program throughout the workshop. Goal of ICLR Workshops Workshops provide an informal, cutting edge venue for discussion of works in progress and future directions. Good workshops have helped to crystallize common problems, explicitly contrast competing frameworks, and clarify essential questions for a subfield or application area. Workshops are a structured means of bringing together people with common interests to form communities. Good workshops should include some form of community building. Each workshop is a single-day, in-person event, split into morning and afternoon sessions, with free time between the sessions for individual exchange. Workshop topics should include, but are not limited to, the following: Deep learning / representations learning for scientific discovery Theoretical foundations of deep learning Fairness in machine learning, transparency, governance and inclusion Implementation issues, parallelization, software platforms, hardware Learning in low-resource settings ​​Optimization for representation learning Privacy in deep learning Robustness and adversarial learning Uncertainty in representation learning Generative AI and large language models Important Applications in vision, audio, speech, multilingual contexts , robotics, neuroscience, healthcare, climate change, agriculture, pandemic response, societal and policy impact, or any other field, as well as any other topic relevant to an appreciable fraction of the ICLR community. Detailed descriptions of previous workshops may be found in last year's online schedule (https://blog.iclr.cc/2024/01/08/announcing-the-accepted-workshops-at-iclr-2024/). Workshop schedules should encourage lively debates, stimulate the production of new ideas and foster discussion of important issues. Every group considering submitting a workshop proposal should read the Guidance for ICLR Workshop Proposals 2025, which describes important considerations for hosting workshops, includes templates of previous successful proposals, details the selection criteria and process, describes what is considered a conflict of interest, and includes other frequently asked questions. Submission Instructions Proposals should be submitted through an application on openreview at: https://openreview.net/group?id=ICLR.cc/2025/Workshop_Proposals. The criteria and process by which proposals will be assessed are described in the Guidance for ICLR Workshop Proposals 2025. Important dates for workshop organizers Workshop Application Open: 12 September 2024 Workshop Application Deadline: 20 October 2024, 11.59pm AoE Workshop Acceptance Notification: 2 December 2024 Suggested Submission Date for Workshop Contributions: 3 February 2025 Accepted papers posted publicly on OpenReview (hard deadline)*: 5 March 2025, 11.59pm AoE *This is the date by which you need to let authors who submitted to your workshop and us know which papers you accepted to your workshop. This date is critical for contributors to your workshop who applied for financial assistance with ICLR. At minimum, the title and authors of accepted submissions must be posted publicly on OpenReview by the hard deadline of March 5. It is not necessary to post PDFs, reviews, or meta-reviews yet Import Workshop Program and Accepted Papers to iclr.cc: 5 March 2025, 11.59pm AoE If you are unsure or have questions how to perform any of the above steps, please consult the help links we provided in our "Action Items for Workshop Organizers" (a copy can found be here) or the workshop organizer slack. Organizer Support The organizers of each accepted workshop can name four individuals to receive a complimentary full-conference registration. ICLR 2025 Workshop Chairs Adji Bousso Dieng (Princeton University) Luis Oala (Dotphoton) Nezihe Merve Gürel (TU Delft) Pierre Alquier (ESSEC Business School) Yanan Sui (Tsinghua University) Contact Email: workshop-chairs@iclr.cc'''
