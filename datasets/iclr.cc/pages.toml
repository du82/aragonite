["https://iclr.cc/Conferences/2021/AuthorGuide"]
title = "ICLR 2021 Author Guide"
full_description = 'Select Year: (2021) 2025 2024 2023 2022 2021 2020 2019 2018 2017 2016 2015 2014 2013 Dates Calls Call for Papers Call for Workshops Call for Socials Guides Presentation Guide Reviewer Guide Area Chair Guide Author Guide Workshop Organizer Guide Participate Virtual Conference FAQ Virtual Conference Workshop Instructions Organization ICLR Board Organizing Committee Program Committee Reviewers Volunteers About ICLR Conference Site Author Guide Submission This year we are asking authors to submit paper abstracts by the abstract submission deadline of 28 September 2020, 08:00 AM PDT (UTC-7). The full paper submission deadline is 2 October 2020, 08:00 AM PDT (UTC-7). Abstracts and papers must be submitted using the conference submission system at: https://openreview.net/group?id=ICLR.cc/2021/Conference. It is key that authors submit genuine and informative abstracts that reflect the content of the full submission, as abstracts will be used in Area Chair bidding before the final paper submission deadline. Placeholder or duplicate abstracts will be removed. For detailed submission instructions, including paper length and style file, please refer to the call for papers on https://iclr.cc/Conferences/2021/CallForPapers. Source code submission: Source code associated with a paper can be uploaded as part of the supplementary material. Code submission gives more information to reviewers, especially for replicability of the paper. We encourage all authors to submit code as part of their submission. Note that reviewers are encouraged, but not required to review supplementary material during the review process. All supplementary material must be self-contained and zipped into a single file. Note that supplementary material will be visible to reviewers and the public throughout and after the review period, and ensure all material is anonymized. Code of Ethics All ICLR participants, including authors, are required to adhere to the ICLR Code of Ethics (https://iclr.cc/public/CodeOfEthics). All authors of submitted papers are required to read the Code of Ethics, adhere to it, and explicitly acknowledge this during the submission process. The Code of Ethics applies to all conference participation, including paper submission, reviewing, and paper discussion. As part of the review process, reviewers will be encouraged to raise potential violations of the ICLR Code of Ethics. If authors feel that their paper submission raises questions regarding the Code of Ethics, they are encouraged to discuss any potential issues as part of their submission. This discussion is not counted against the maximum page limit of the paper and should be included as a separate section. Authors who encounter potential violations of the Code of Ethics, e.g., as part of the review or public discussion, should raise these issues in a private message to their paper’s Area Chair through the open review interface. Reviewing Process Submissions to ICLR are uploaded on OpenReview, which enables public discussion during the review process public discussion phase, which lasts until November 17, 2020, as well as further discussion between authors, reviewers and area chairs until November 24, 2020. Authors are encouraged to participate in the public discussion of their paper, as well as of any other paper submitted to the conference. Submissions and reviews are both anonymous and visible as follows: Official reviews are anonymous and publicly visible. Anybody who is logged in can post comments that are publicly visible or restrict visibility to reviewers and up, ACs and up, or just PCs. Login is required before posting any comment. By 10 November 2020, we expect all reviews to be completed. Reviews are anonymous and publicly visible in Open Review. Once the reviews are posted, authors are free to upload modifications to the paper during the two week discussion period. The most relevant dates for authors are as follows: Review Release: Tues, Nov 10 Discussion Stage 1: Tues, Nov 10 - Tues, Nov 17 Discussions among Reviewers/Authors/Public. Anyone may post comments, but they must be logged in, and their names will be shown. Reviewers remain anonymous (R1, R2, etc.). Discussion Stage 2 - Tues, Nov 17 - Tues, Nov 24 Discussions among authors, reviewers and AC. Comments are all anonymous. ACs encourage reviewers to acknowledge and respond to author responses. In addition, authors can post "official comments" about their paper before the discussion stage, and restrict visibility to reviewers, area chairs, or program chairs as appropriate. For example, this functionality can be used to post links to supplementary material. Additional details of the review process can be found in the ICLR 2021 Call for Papers, Reviewer Guide and AC Guide. Camera-ready Submissions The deadline for uploading camera-ready submissions will be in March 2021. Additional guidance on preparing your camera-ready version will be provided on this page in due course. Frequently Asked Questions FAQ During Discussion Stages Q. Can we change the title of a paper during the rebuttal? Yes, you can change the title, abstract, and the paper’s content, including supplementary materials. But make sure any modifications are clearly communicated to the reviewers and the area chair, so that they can efficiently review the modified version of your paper. The set of authors cannot be changed, but the order can be changed. Q. For rebuttal revisions, are we limited to one upload or can we update the paper several times? You can upload as many revisions as you want until Nov 24, but reviewers and area chairs are not required to look at every revision. It is up to you to clearly communicate what’s been changed. Q. Can you please explain to me the difference between first and second stages of discussion? Are there things that I must reply/address before 17th Nov (end date of first discussion phase)? The key difference is that during stage 1 the discussion is open to the public. This means any user who is logged on to Openreview can comment on papers. This is an opportunity to get the widest possible discussion, and if you have follow up questions to public comments, then these should be resolved by the end of discussion phase 1. Discussion phase 2 allows a more focused discussion between authors, reviewers and area chairs. Authors can respond to reviewer/AC questions up until Nov 24 (End of Day, Anywhere on Earth) both by posting on the forum and uploading a revised PDF. Q. Is there a limit on the number of comments we can post? Can we post multiple replies to each reviewer? There is a word limit for each comment, but there is no limit on the number of comments. You may post multiple replies to each reviewer, but please remain civil and considerate of the reviewers’ time, as they are reviewing and thus engaging in discussions for multiple papers for ICLR. Compared to other conferences in the field, the open nature of the discussion phases allows more interaction among the authors and reviewers. Please see previous versions of ICLR Openreview to get a sense of the interactions (e.g., Openreview forums for ICLR 2020) Q. How do we contact the Reviewers, Area Chairs, and Program Chairs? If you have private comments to the area chair and/or reviewers of your paper, please communicate through the Openreview forum for that submission and choose “Area Chairs of the submission” and/or "Reviewers of the submission" from the dropdown menu of the “Readers”. Your first point of contact in case of questions is the Area Chair assigned to your submission. In cases that cannot be resolved together with the Area Chair, please contact the Program Chairs by emailing iclr2021programchairs@googlegroups.com. FAQ Before Submission Deadline Q: When is the submission deadline for supplementary materials? The deadline is the same for the full paper and for the supplementary materials. Q: Should appendices/supplementary material be added as a separate PDF or in the same PDF as the main paper? Either is allowed, you can include the supplementary material at the end of the main pdf after the references, or you can include it as a separate file for the supplementary materials. Q: How can we make our code available for reviewing anonymously? You can share your code in three ways: Anonymize your code, put it in a .zip file and submit it as supplementary materials. Make an anonymous repository and put the link in your paper. The above methods will make your code public, along with your paper and reviews/comments for the paper. After we open the discussion forums for all submitted papers, make a comment directed to the reviewers and area chairs and put a link to an anonymous repository. This method will let you keep your code visible only to the reviewers and ACs for your paper. Q: I can’t modify my submission to include the PDF and supplementary materials. Can you help? Make sure you logged in using the same account you used to upload the submission. If so, you should be able to click on your submission and see a "Revision" button. If you are still having problems accessing your submission, follow these steps: Go to your submission and hover over your name in the ‘Authors’ field. If your name is associated with an email address that is not currently on your profile, add this email address to your OpenReview profile and confirm it. This will give you access to your submission and the ‘Revision’ button. If your name is associated with another profile that is not the profile you submitted the paper with, contact the OpenReview team at info@openreview.net so they can merge your profiles. If you are still having trouble, please contact OpenReview technical support at info@openreview.net and explain the situation.'
