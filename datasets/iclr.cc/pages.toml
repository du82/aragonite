title = "ICLR 2019 Schedule Overview"
full_description = "Select Year: (2019) 2025 2024 2023 2022 2021 2020 2019 2018 2017 2016 2015 2014 2013 Dates Schedule Program Highlights Full Schedule Workshop Book PDF Workshop Book PDF (Large Font) Calls Call for Papers Call for Workshops Workshop FAQ Reviewer Guide Area Chair Guide Attend Child Care Hotels Safety Local Transportation Airport Shuttle Disability Assistance Visa Information Poster Printing Restaurants Travel Awardee FAQ Organization ICLR Board Organizing Committee Program Committee About ICLR ICLR 2019 Schedule Overview Monday 5/6, AM Session Chair: Katerina Fragkiadaki 7:00 am - 6:30 pm: Registration Desk open 8:45 - 9:00: Opening Remarks 9:00 - 9:45: Invited Talk 1: Cynthia Dwork 9:45 - 10:30: Workshops (Running concurrently with main conference) 9:45 - 10:00: Contributed talk 1: Generating High Fidelity Images with Subscale Pixel Networks and Multidimensional Upscaling 10:00 - 10:15: Contributed talk 2: BA-Net: Dense Bundle Adjustment Networks 10:15 - 10:30: Contributed talk 3: Large Scale GAN Training for High Fidelity Natural Image Synthesis 10:30 - 11:00: Coffee Break 11:00 - 1:00: Workshops continued (Running concurrently with main conference) 1:00 - 2:30: Lunch - on your own Monday 5/6, PM Session Chair: Asja Fischer 3:15 - 4:00: Workshops continued (Running concurrently with main conference) 2:30 - 3:15: Invited Talk 2: Léon Bottou 3:15 - 3:30: Contributed talk 4: On Random Deep Weight-Tied Autoencoders: Exact Asymptotic Analysis, Phase Transitions, and Implications to Training 3:30 - 3:45: Contributed talk 5: How Powerful are Graph Neural Networks? 3:45 - 4:00: Contributed talk 6: The Lottery Ticket Hypothesis: Finding Sparse, Trainable Neural Networks (Best Paper) 4:00 - 4:30: Coffee Break 4:30 - 6:30: Workshops continued (Running concurrently with main conference) 6:30 - 7:30: Opening Reception 7:00 - 7:30: Newcomers Welcome to ICLR - Rivergate Room Tuesday 5/7, AM Session Chair: Yan Liu 8:00 am - 6:30 pm: Registration Desk open 9:00 am - 6:30 pm; LatinX in AI and Black and AI joint workshop 9:00 - 9:45: Invited Talk 3: Emily Shuckburgh 9:45 - 10:00: Contributed talk 7: Learning Protein Structure with a Differentiable Simulator 10:00 - 10:15: Contributed talk 8: Enabling Factorized Piano Music Modeling and Generation with the MAESTRO Dataset 10:15 - 10:30: Contributed talk 9: A Unified Theory of Early Visual Representations from Retina to Cortex through Anatomically Constrained Deep CNNs 10:30 - 11:00: Coffee Break 11:00 - 1:00: Poster Session 1:00 - 2:30: Lunch - on your own Tuesday 5/7, PM Session Chair: David Warde-Farley 2:30 - 3:15: Invited Talk 4: Ian Goodfellow 3:15 - 3:30: Contributed talk 10: Slalom: Fast, Verifiable and Private Execution of Neural Networks in Trusted Hardware 3:30 - 3:45: Contributed talk 11: Learning to Remember More with Less Memorization 3:45 - 4:00: Contributed talk 12: Learning Robust Representations by Projecting Superficial Statistics Out 4:00 - 4:15: Contributed talk 13: ImageNet-trained CNNs are biased towards texture; increasing shape bias improves accuracy and robustness 4:15 - 4:30: Coffee Break 4:30 - 6:30: Poster Session Wednesday 5/8, AM Session Chair: Chelsea Finn 8:00 am - 6:30 pm: Registration Desk open 9:00 - 9:45: Invited Talk 5: Pierre-Yves Oudeyer 9:45 - 10:00: Contributed talk 14: Learning deep representations by mutual information estimation and maximization 10:00 - 10:15: Contributed talk 15: KnockoffGAN: Generating Knockoffs for Feature Selection using Generative Adversarial Networks 10:15 - 10:30: Contributed talk 16: Deterministic Variational Inference for Robust Bayesian Neural Networks 10:30 - 10:45: Contributed talk 17: FFJORD: Free-Form Continuous Dynamics for Scalable Reversible Generative Models 10:45 - 11:00: Coffee Break 11:00 - 1:00: Poster Session 1:00 - 2:30: Lunch - on your own Wednesday 5/8, PM 2:30 - 3:15: Invited Talk 6: Zeynep Tufekci 3:15 - 4:15: ICLR Debate: Leslie Kaelbling 4:15 - 4:30: Coffee Break 4:30 - 6:30: Poster Session Thursday 5/9, AM Session Chair: Graham Neubig 8:00 am - 12:00 pm: Registration Desk open 9:00 - 9:45: Invited Talk 7: Mirella Lapata 9:45 - 10:00: Contributed talk 18: Pay Less Attention with Lightweight and Dynamic Convolutions 10:00 - 10:15: Contributed talk 19: The Neuro-Symbolic Concept Learner: Interpreting Scenes, Words, and Sentences From Natural Supervision 10:15 - 10:30: Contributed talk 20: Smoothing the Geometry of Probabilistic Box Embeddings 10:30 - 10:45: Contributed talk 21: Ordered Neurons: Integrating Tree Structures into Recurrent Neural Networks (Best Paper) 10:45 - 11:00: Coffee Break 11:00 - 1:00: Poster Session 1:00 - 2:30: Lunch - on your own Thursday 5/9, PM Session Chair: Jasper Snoek 2:30 - 3:15: Invited Talk 8: Noah Goodman 3:15 - 3:30: Contributed talk 21: Meta-Learning Update Rules for Unsupervised Representation Learning 3:30 - 3:45: Contributed talk 22: Temporal Difference Variational Auto-Encoder 3:45 - 4:00: Contributed talk 23: Transferring Knowledge across Learning Processes 4:00 - 4:30: Coffee Break 4:30 - 6:30: Poster Session 6:30 - 8:30 - Closing Reception"
