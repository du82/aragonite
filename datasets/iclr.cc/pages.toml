f attendance (above in the Payment and Receipt section as your proof of attendance. 6. Get Recruited by our Sponsors If you would like to let the ICLR 2025 sponsors know that you are job hunting, check this box and we will share your information with them. Share my profile information and my accepted papers and presentations Add me to a temporary ICLR email list (email remains anonymous) You do not need to save. Changes are immediate in this panel. Please use the PDF format for your CV if possible. Upload My CV 7. Book Hotel Make your Hotel reservation Here. Special group pricing has been made for ICLR attendees. Please make your reservations through this link only function nextPanel(event) { $(".panel-collapse").removeClass("show"); $(this).closest(".panel-collapse").parent().next().find(".panel-collapse").addClass("show"); } function submitPanelAndNext(event) { if (this.innerHTML.startsWith("Payment")) { if ($("input[name='affiliation']:checked").length == 0) { alert("Choose your affiliation type: student, academic, etc..."); return } if ($("#registration-checkboxes").find(":checkbox:checked").length == 0) { alert("Select at least one Session"); return } if ($("input[name='affiliation']:checked").val() == 'student' && !existing_id_filename) { alert("You must upload your student ID"); return } } var registrationID = 'None'; if (registrationID == '' || registrationID == "None") { registrationID = ''; } else { registrationID = '&registrationID=' + registrationID; } var form = $(this).closest('form'); /*Find the next panel, get its id -- something like collapse2 -- and extract just the number*/ var thisPanel = parseInt($(this).parentsUntil(".collapse").last().parent()[0].id.replace(/^\D+/g, '')); if (thisPanel == NaN) { thisPanel = 1; } var nextPanel = thisPanel + 1; form.attr("action", "/Register2?showPanel=" + nextPanel + registrationID); form.submit(); } function showPanel() { var showPanel = "1"; if (showPanel != "") { showPanelElement = $("#collapse" + showPanel); $(".collapse").removeClass("show"); showPanelElement.addClass("show"); } } showPanel(); existing_id_filename = ""; function ShowHideStudentIDUpload() { if ($("#student").is(":checked")) { var student = true; if (existing_id_filename == "") { $("button:contains(Save Registration)").attr("disabled", "disabled"); } $("#student_id_form").show(); } else { var student = false; $("#student_id_form").hide(); $("button:contains(Save Registration)").removeAttr("disabled"); } jQuery.ajax({ data: { student: student, csrfmiddlewaretoken: csrftoken, action: "setStudentFlag", }, type: 'POST', success: function (data) { if (data['status'] == "Success") { } else { alert(data['msg']); window.location.reload(); } }, error: function (jqXHR, textStatus, String) { alert(String); }, }); } /*ShowHideStudentIDUpload();*/ $("#id_student_id").on("change", function (e) { SubmitStudentID(); }) function SubmitStudentID() { var data = new FormData(); jQuery.each(jQuery('#id_student_id')[0].files, function (i, file) { data.append('file-' + i, file); }); data.append("csrfmiddlewaretoken", csrftoken); data.append("action", "saveStudentId"); data.append("registrationID", ""); jQuery.ajax({ data: data, cache: false, contentType: false, processData: false, type: 'POST', success: function (data) { if (data['status'] == "Success") { $("button:contains(Save Registration)").removeAttr("disabled"); $("#upload_result").html("<br><small>File uploaded successfully.</small>"); $("#upload_result").addClass("highlight"); $("#student-upload-div").removeClass("info-ring"); existing_id_filename = "uploaded"; } else { alert(data['msg']); window.location.reload(); } }, error: function (jqXHR, textStatus, String) { alert(String); }, }); } $(document).ready(function () { $("#registration_form input:checkbox").on("change", function () { $("#checkPricing").click(); }); $("#id_share_my_information").on("change", function () { $("#jobHuntersForm").submit(); }); $("#id_add_to_email_list").on("change", function () { $("#job