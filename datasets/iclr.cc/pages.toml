title = "Call for Blog Posts"
full_description = "Select Year: (2025) 2025 2024 2023 2022 2021 2020 2019 2018 2017 2016 2015 2014 2013 Dates Calls Call for Papers Call for Workshops Call for Tiny Papers Call for Blog Posts Call for Socials Guides FAQ Poster Information Author Guide Reviewer Guide Area Chair Guide Senior Area Chair Guide Attend Register Visa and Travel Information Financial Assistance and Volunteering Child Care Code of Conduct Organization Organizing Committee Program Committee ICLR Board Reviewers Ethics Committee Exhibitors 2025 - Call For Blogposts Key Dates Abstract & Submission deadline: Nov 15th Extended to Nov 22nd 23:59 AOE, 2024 Submit to OpenReview Any modifications to your blog post, via a pull request on github Notification of acceptance: ~January 22nd, 2025 Camera-ready merge: March 15th, 2025 Call for blog posts ​ We invite all researchers and practitioners to submit a blog post discussing: Review past work and summarize the outcomes, develop new intuitions, or highlight some shortcomings. Present novel perspectives or interpretations of existing machine learning concepts or techniques. Discuss important issues in machine learning, such as reproducibility, from a novel perspective. Analyze the societal implications of recent advancements in machine learning and AI. Cool research ideas that you tried but did not work out If you are unsure about the content of your post you can reach us at iclr-blogpost-track@googlegroups.com. ​ Past blog posts can be accessed here: 2022, 2023, 2024. ​ Conflict of interest ​ The authors of the blog posts will have to declare their conflicts of interest (positive or negative). Conflicts of interest include: Recent collaborators (less than 3 years) Current institution ​ Blog Posts must not be used to highlight or advertise past publications of the authors or of their lab. Publication The posts will be created and published under a unified template; see the submission instructions and the sample post hosted on the blog of this website. Poster Additionally, accepted posts will have the option to present their work as a poster during the main poster session. For more information about the main poster session (time, poster format, etc.) please refer to the ICLR homepage. Review Blogs will be peer-reviewed (double-blind) for quality and novelty of the content: clarity and pedagogy of the exposition, new theoretical or practical insights, reproduction/extension of experiments, etc. The review is dual-anonymous assuming good faith from both submitters and reviewers (see the submission instructions for more details). ​ Contact For answers to many common questions please refer to the ICLR FAQ. Should you have other inquiries, please don’t hesitate to reach out via email at: iclr-blogpost-track@googlegroups.com. More Information Please visit our official website for more information: https://iclr-blogposts.github.io/2025/about/"
