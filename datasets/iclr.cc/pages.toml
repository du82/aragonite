title = "2022 Conference"
full_description = "Select Year: (2022) 2025 2024 2023 2022 2021 2020 2019 2018 2017 2016 2015 2014 2013 Dates Calls Call for Papers Call for Workshops Call for Blog Posts Call for Socials Guides Author Guide Reviewer Guide Area Chair Guide Organization ICLR Board Organizing Committee Program Committee Reviewers About ICLR Conference Site The Tenth International Conference on Learning Representations (Virtual) Mon Apr 25th through Fri the 29th firstback Registration Pricing » Registration 2022 Registration Cancellation Policy » Certificate of Attendance Virtual Site The 2022 Virtual Site is now free to the public. Tweet Registration Pricing » Registration 2022 Registration Cancellation Policy » Conference Site Start Here Invited Talks Schedule Papers Workshops Announcements ICLR.cc will be down for server maintenance intermittantly over the weekend of April 19th starting at 6:30 pm pacific time. ICLR 2024 Hotel Reservations available HERE Local Poster Printing Service - Free Delivery to Venue - Order HERE Allowable Poster Dimensions - HERE Call for Socials - applications closed Careers site is open! Check out opportunities HERE Press Accrediation now OPEN Authors of eligible TMLR publications can submit a request to present in ICLR conference! Find more here. BEWARE of Predatory ICLR conferences being promoted through the World Academy of Science, Engineering and Technology organization. Sponsors The generous support of our sponsors allowed us to reduce our ticket price by about 50%, and support diversity at the meeting with travel awards. In addition, many accepted papers at the conference were contributed by our sponsors. View ICLR 2022 sponsors »Become a 2025 Sponsor 2022 ICLR Organizing Committee General Chair Katja Hofmann, Microsoft Deputy GC: Alexander (Sasha) Rush, Cornell Tech Senior Program Chair Yan Liu, University of Southern California Program Chairs Chelsea Finn, Stanford University Yejin Choi, University of Washington / AI2 Marc Deisenroth, University College London Workshop Chairs Feryal Behbahani, DeepMind Vukosi Marivate, University of Pretoria Area Chairs Area Chairs » Ethics Review Committee Thomas G. Dietterich, Oregon State University Ayanna Howard, Ohio State University Patrick Lin, California Polytechnic State University Miguel Luengo-Oroz, UN Global Pulse Shannon Vallor, University of Edinburgh Robert Sparrow, Monash University Diversity Equity & Inclusion Chairs Krystal Maughan, University of Vermont Rosanne Liu, Google & ML Collective Virtual Chairs - Virtual & Volunteers Jumanah Alshehri, Temple University Archana David, Infosys Ltd Engagements Chairs - Socials & Sponsors Ehi Nosakhare, Microsoft William Agnew, University of Washington Blog Track Chairs Sebastien Bubeck, Microsoft David Dobre, MILA Charlie Gauthier, MILA Gauthier Gidel, MILA Claire Vernade, DeepMind Workflow Chairs Zhenyu (Sherry) Xue, ICLR Yaguang Li, Google Brain Contact The organizers can be contacted here. About Us The International Conference on Learning Representations (ICLR) is the premier gathering of professionals dedicated to the advancement of the branch of artificial intelligence called representation learning, but generally referred to as deep learning. ICLR is globally renowned for presenting and publishing cutting-edge research on all aspects of deep learning used in the fields of artificial intelligence, statistics and data science, as well as important application areas such as machine vision, computational biology, speech recognition, text understanding, gaming, and robotics. Participants at ICLR span a wide range of backgrounds, from academic and industrial researchers, to entrepreneurs and engineers, to graduate students and postdocs. A non-exhaustive list of relevant topics explored at the conference include: unsupervised, semi-supervised, and supervised representation learning representation learning for planning and reinforcement learning representation learning for computer vision and natural language processing metric learning and kernel learning sparse coding and dimensionality expansion hierarchical models optimization for representation learning learning representations of outputs or states optimal transport theoretical issues in deep learning societal considerations of representation learning including fairness, safety, privacy, and interpretability, and explainability visualization or interpretation of learned representations implementation issues, parallelization, software platforms, hardware climate, sustainability applications in audio, speech, robotics, neuroscience, biology, or any other field"
