["https://ico.org.uk/global/privacy-notice/make-an-enquiry"]
title = "Make an enquiry | ICO"
full_description = "Global ICO Privacy notice Make an enquiry Make an enquiry Contents Search this document ICO Privacy notice General information Cha​nges to this privacy notice Controller’s contact details Data Protection Officer's contact details How do we get information? Your data protection rights Request a service adjustment Sharing your information Links to other websites Your right to complain Children’s information Managing customer contact How you can contact us Visitors to our website Visitors to the office 2. Reason for contacting us Responding to our project ExplAIn consultation Report a nuisance call or message Making a complaint Report bad practices as a whistleblower Make an enquiry Investigations for law enforcement purposes Using our subject access request service Apply for a job or secondment Contact the Press Office Attend an event, seminar or workshop Responding to our consultation requests and surveys Register for a webinar or live broadcast event Subscribing to our e-newsletter Request our publications Make an information request Using our privacy notice generator tool 3. Communicate with us as a business Pay a fee under the Data Protection (charges and information) Regulations 2018 (the data protection fee) Apply for an ICO grant Report a breach (service providers) Report a breach (all controllers) When we audit an organisation Submit a Data Protection Impact Assessment for consultation Submit a BCR application for approval Signing the Your Data Matters pledge Joining our SME feedback group Nominations for Data Protection Officer of the Year award Providing details for case studies We’re carrying out an advisory check-up on your organisation Submit a question to our Innovation Advice Service in the BETA phase Register as a trust service provider Submit a Code of Conduct or Certification Scheme for approval Apply for accreditation as a code monitoring body Upstream feedback group Volunteer to particate in ICO website user research Data Protection Practitioners' Conference 2024 View our 'what we do with your personal data when you...' infographic for a basic overview of the below information.Contents Purpose and lawful basis for processing What we need and why we need it What we do with it How long we keep it What are your rights? Do we use any data processors? Purpose and lawful basis for processingWhen you contact us to make an enquiry, we collect information, including your personal data, so that we can respond to it and fulfil our regulatory responsibilities.The lawful basis we rely on to process your personal data is article 6(1)(e) of the UK GDPR, which allows us to process personal data when this is necessary to perform our public tasks as a regulator.If the information you provide us in relation to your enquiry contains special category data, such as health, religious or ethnic information the lawful basis we rely on to process it is article 9(2)(g) of the UK GDPR, which also relates to our public task and the safeguarding of your fundamental rights. And Schedule 1 part 2(6) of the DPA2018 which relates to statutory and government purposes.What we need and why we need itWe need enough information from you to answer your enquiry. If you call the helpline, we won’t make an audio recording of it and we won’t usually need to take any personal information from you. But in certain circumstances we may make notes to provide you with a further service as required.If you contact us via email or post, we’ll need a return address for response.What we do with itWe’ll set up a case file on our case management system to record your enquiry and so we can get it to the correct area of the business to be dealt with. We’ll also keep a record of our response. We use the information supplied to us to deal with the enquiry and any subsequent issues that may arise, and we may also check on the level of service we provide by asking you to complete a customer satisfaction survey.How long we keep itFor information about how long we hold personal data, see our retention schedule.If you agree to participate in the customer experience survey, ICS will keep your survey response for 30 days from the survey closes. They will keep your name and email address for 9 months from the survey expiry date.What are your rights?We are acting in our official capacity to respond to your enquiry, so you have the right to object to our processing of your personal data. There are legitimate reasons why we may refuse your objection, which depend on why we are processing it.For more information on your rights, please see ‘Your rights as an individual’.Do we use any data processors?We do not use any data processors to handle enquiries.We use the Royal National Institute of Blind People (RNIB) as a data processor when we need to translate our correspondence into braille.We use the Institute of Customer Service (ICS) as a data processor to run our customer satisfaction surveys. Previous Report bad practices as a whistleblower Next Investigations for law enforcement purposes"
