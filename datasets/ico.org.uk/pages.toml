["https://ico.org.uk/global/privacy-notice/making-a-complaint"]
title = "Making a complaint | ICO"
full_description = "Global ICO Privacy notice Making a complaint Making a complaint Contents Search this document ICO Privacy notice General information Cha​nges to this privacy notice Controller’s contact details Data Protection Officer's contact details How do we get information? Your data protection rights Request a service adjustment Sharing your information Links to other websites Your right to complain Children’s information Managing customer contact How you can contact us Visitors to our website Visitors to the office 2. Reason for contacting us Responding to our project ExplAIn consultation Report a nuisance call or message Making a complaint Report bad practices as a whistleblower Make an enquiry Investigations for law enforcement purposes Using our subject access request service Apply for a job or secondment Contact the Press Office Attend an event, seminar or workshop Responding to our consultation requests and surveys Register for a webinar or live broadcast event Subscribing to our e-newsletter Request our publications Make an information request Using our privacy notice generator tool 3. Communicate with us as a business Pay a fee under the Data Protection (charges and information) Regulations 2018 (the data protection fee) Apply for an ICO grant Report a breach (service providers) Report a breach (all controllers) When we audit an organisation Submit a Data Protection Impact Assessment for consultation Submit a BCR application for approval Signing the Your Data Matters pledge Joining our SME feedback group Nominations for Data Protection Officer of the Year award Providing details for case studies We’re carrying out an advisory check-up on your organisation Submit a question to our Innovation Advice Service in the BETA phase Register as a trust service provider Submit a Code of Conduct or Certification Scheme for approval Apply for accreditation as a code monitoring body Upstream feedback group Volunteer to particate in ICO website user research Data Protection Practitioners' Conference 2024 View our 'what we do with your personal data when you...' infographic for a basic overview of the below information.Contents Purpose and lawful basis for processing What we need Why we need it What we do with it How long we keep it What are your rights? Do we use any data processors? Purpose and lawful basis for processingOur purpose is to investigate and take regulatory action in line with our statutory duties.The lawful basis we rely on to process your personal data is article 6(1)(e) of the UK GDPR, which allows us to process personal data when this is necessary to perform our public tasks as a regulator.If the information you provide us in relation to your complaint contains special category data, such as health, religious or ethnic information the lawful basis we rely on to process it is article 9(2)(g) of the UK GDPR, which also relates to our public task and the safeguarding of your fundamental rights. And Schedule 1 part 2(6) of the DPA2018 which relates to statutory and government purposes.What we needWe need information from you to investigate your complaint properly, so our complaint forms are designed to prompt you to give us everything we need to understand what’s happened.When we receive a complaint from you, we’ll set up a case file. This normally includes your contact details and any other information you have given us about the other parties in your complaint.Why we need itWe need to know the details of your complaint so we can investigate it and fulfil our regulatory function.What we do with itWe will use your personal information to investigate your complaint, and may also check on our level of service by inviting you to complete a customer satisfaction survey. We compile and publish statistics showing information like the number of complaints we receive, but not in a form that identifies anyone. No third parties have access to your personal information unless the law allows them to do so. However, if you have made a complaint about an organisation, we usually have to disclose your identity to them. This is so we can clearly explain to them what you think has gone wrong and if necessary advise them how to put it right. This also means we may receive information about you from them.If you don’t want information that identifies you to be shared with the organisation you want to complain about, we’ll try to respect that. However, it is not always possible to handle a complaint on an anonymous basis so we’ll contact you to discuss this.If you contact us to make a freedom of information complaint about a public authority, and we issue a decision notice, we will need you to provide us with an identifiable correspondence address or personal email address which will be included on a copy of any decision notice provided to the public authority about which you have complained.If you are acting on behalf of someone making a complaint, we’ll ask for information to satisfy us of your identity and if relevant, ask for information to show you have authority to act on someone else’s behalf.When we send you the outcome of your complaint, we’ll include a link to an optional survey that you can complete to let us know what you think about the service you received. You’ll need to provide your case reference number and a ranking for each of the criteria in the survey. We’ll use your feedback to help us gauge how well we’re handling complaints and to identify opportunities for improvement.We may also contact you to ask if you would be interested in participating in a customer satisfaction survey. If you would like to be included, we will pass your name and email address onto a third party to complete the survey on our behalf.How long we keep itFor information about how long we hold personal data, see our retention schedule.If you agree to participate in the customer experience survey, ICS will keep your survey response for 30 days from the survey closes. They will keep your name and email address for 9 months from the survey expiry date.What are your rights?We are acting in our official capacity to investigate your complaint, so you have the right to object to our processing of your personal data. There are legitimate reasons why we may refuse your objection, which depend on why we are processing it.For more information on your rights, please see ‘Your rights as an individual’.Do we use any data processors?We do not use data processors to handle complaints.We use Microsoft Forms for our complaint handling feedback survey.We use the Royal National Institute of Blind People (RNIB) as a data processor when we need to translate our correspondence into braille.We use the Institute of Customer Service (ICS) as a data processor to run our customer satisfaction surveys. Previous Report a nuisance call or message Next Report bad practices as a whistleblower"
