["https://ico.org.uk/for-organisations/advice-for-small-organisations/create-your-own-privacy-notice"]
title = "Create your own privacy notice | ICO"
full_description = "For organisations Advice for small organisations Create your own privacy notice Create your own privacy notice Click to toggle details Latest updates - last updated 20 August 2024 20 August 2024 - We’ve published new sector-specific versions of the privacy notice generator for customer and supplier information. These are for the following sectors: Professional services (including finance, insurance and legal services); Education and childcare; Health and social care; and Charity and voluntary. 19 August 2024 - We've updated the privacy notice generator for staff and volunteer information based on feedback. We've amended the content on lawful bases, international transfers, data sharing and individual rights. 9 August 2024 - We've updated the privacy notice generator for customer and supplier information based on feedback. We've amended the content on lawful bases, international transfers, data sharing and individual rights. 31 May 2024 - We've updated the tools based on feedback. We've amended the content on retention schedules, children's data, joint controllers and data processors. Mae’r gwasanaeth yma yn cael ei adolygu ar hyn o bryd a bydd yn ddwyieithog cyn gynted â phosib. Ymddiheuriadau am unrhyw anghyfleusterau. This service is currently under review and will be available bilingually as soon as possible. We apologise for any inconvenience. A privacy notice lets people know what information you have and what you’ll do with it. It’s never been easier to make your own privacy notice, and having one is a great way to show people you can be trusted with their information. We’ve replaced our privacy notice template with a quick and easy generator tool to help you create a bespoke privacy notice in just a few simple steps. This brand new tool has been designed for sole traders and start-ups, as well as small and medium-sized businesses and charities to help make sure your organisation is compliant with the law. People care about their information - show them your organisation cares too. Privacy notice generator – for customer and supplier information Letting your customers know how you’ll use their information will help encourage them to use your products or services. You could include this privacy notice on your website, or provide a link to it in your regular customer communications or your email signatures. This version of the tool is for the following sectors: Professional services (including finance, insurance and legal services); Education and childcare; Health and social care; Charity and voluntary; and other businesses, including retail and manufacture. Start now Privacy notice generator – for staff and volunteer information Having a privacy notice for your staff and volunteers is a straightforward way to let them know how you use their information. You could include this on your staff intranet, in your recruitment welcome packs or in your policies library. Start now Also see: Does my business need a privacy notice? Does my organisation need to register and pay the data protection fee?"
