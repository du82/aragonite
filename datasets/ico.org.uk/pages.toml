title = "E-newsletter | ICO"
full_description = "About the Information Commissioner's Office Media centre E-newsletter E-newsletter Subscribe to our e-newsletter here Subscribe to our action we've taken e-newsletter here Stay up to date with news from the ICO Our e-newsletters bring you the latest developments in data protection and Freedom of Information. We will send updates at least once a month. If you want to consent to receiving our newsletter please subscribe below. If at any point you want to withdraw your consent please email or call us 0303 123 1113. For more information about what we do with personal data see our privacy notice. Stay up to date with action we’ve taken Our updates bring you the latest news about action we’ve taken against nuisance marketers, the trends we’re seeing in the concerns reported to us, areas we will be investigating in the future and other news we think you will be interested in. We are unable to respond to complaints individually but each report you make helps us to take action. Unsubscribe If you wish to unsubscribe you can do so by clicking on the unsubscribe link at the end of any e-newsletter you have received from us to your email address. Previous newsletters View our archived e-newsletters."
