["https://ico.org.uk/global/privacy-notice/data-protection-practitioners-conference-2024"]
title = "Data Protection Practitioners' Conference 2024 | ICO"
full_description = "Global ICO Privacy notice Data Protection Practitioners' Conference 2024 Data Protection Practitioners' Conference 2024 Contents Search this document ICO Privacy notice General information Cha​nges to this privacy notice Controller’s contact details Data Protection Officer's contact details How do we get information? Your data protection rights Request a service adjustment Sharing your information Links to other websites Your right to complain Children’s information Managing customer contact How you can contact us Visitors to our website Visitors to the office 2. Reason for contacting us Responding to our project ExplAIn consultation Report a nuisance call or message Making a complaint Report bad practices as a whistleblower Make an enquiry Investigations for law enforcement purposes Using our subject access request service Apply for a job or secondment Contact the Press Office Attend an event, seminar or workshop Responding to our consultation requests and surveys Register for a webinar or live broadcast event Subscribing to our e-newsletter Request our publications Make an information request Using our privacy notice generator tool 3. Communicate with us as a business Pay a fee under the Data Protection (charges and information) Regulations 2018 (the data protection fee) Apply for an ICO grant Report a breach (service providers) Report a breach (all controllers) When we audit an organisation Submit a Data Protection Impact Assessment for consultation Submit a BCR application for approval Signing the Your Data Matters pledge Joining our SME feedback group Nominations for Data Protection Officer of the Year award Providing details for case studies We’re carrying out an advisory check-up on your organisation Submit a question to our Innovation Advice Service in the BETA phase Register as a trust service provider Submit a Code of Conduct or Certification Scheme for approval Apply for accreditation as a code monitoring body Upstream feedback group Volunteer to particate in ICO website user research Data Protection Practitioners' Conference 2024 Purpose and lawful basis for processing What we need What we do with it How long we keep it What are your rights? Do we use any data processors? Do we transfer data overseas? External providers Purpose and lawful basis for processingOur purpose for collecting this information is so we can facilitate the event and provide you with an acceptable service.The lawful basis we rely on to process the personal data of delegates and our staff is Article 6(1)(e) of the GDPR, which allows us to process personal data when this is necessary to perform our public tasks as a regulator.What we needIn order to register for the conference delegates will need register directly on the broadcast platform which is hosted by Orcula.We’ll need your name and email address as well as information about your job role and level of experience. We will also need your organisation’s name, its size and the sector in which you work. We will provide automated captioning in all of the online sessions but will ask you for details of any additional access requirements.We are planning to record the conference however delegates cameras and audio are not used for the duration of the conference and will not be captured in the recording. Any questions submitted in the Q&A function box can be submitted anonymously and all question will be read out anonymously.The conference broadcast platform collects delegates movements between the sessions and the questions submitted.As part of our commitment to ensuring our events are inclusive and accessible for everyone, we request delegates voluntary participation in providing Equality, Diversity, and Inclusion (EDI) information. Any information you provide is anonymous and not traceable to your registration for the DPPC event.We will use this data to help us understand who we are reaching through our DPPC event, and where we can make improvements.What we do with itEveryone who has registered to attend the DPPC 2024 can attend and there is no charge. Information submitted by delegates in the registration survey is used to shape the agenda for the online conference.The 2024 event, will be hosted online and we have partnered with Amplitude Event Solutions and Orcula to provide a broadcast platform.Delegates can access the conference by registering to attend and providing the information outlined above. Delegates will receive correspondence about the event, which will be sent directly from our partners at Amplitude Event Solutions by email. This will include a unique user name and password so delegates can access the conference platform on the day.Information about delegates movements between the sessions and time spent in each area will be used for conference evaluation only by the ICO.How long we keep itFor information that we gather as part of the registration process please see our retention schedule.Any information sent to or gathered by Amplitude and Orcula will be stored after the conference for one week. We are giving instruction for all information related to the conference to be deleted from the platform on 16 October 2024.What are your rights?If you wish to opt out of participating in the conference at any time then please let us know by email.For more information on your rights, please see 'Your data protection rights'.Do we use any data processors?Yes – we use data processors to help facilitate the event who will process information in line with our instructions.Do we transfer data overseas?No.External providerTo facilitate the conference running smoothly in a digital environment we have partnered with Amplitude Event Solutions and Orcula to broadcast the sessions. You can read their data policy here. Previous Volunteer to particate in ICO website user research"
