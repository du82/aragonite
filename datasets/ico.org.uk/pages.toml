["https://ico.org.uk/about-the-ico/who-we-are/wales-office"]
title = "Wales office | ICO"
full_description = "About the Information Commissioner's Office Who we are Wales office Wales office The ICO's office in Cardiff provides a local point of contact for members of the public and organisations based in Wales. We operate an advice service to address general enquiries on data protection and freedom of information. We promote good practice in information rights by raising awareness of organisational responsibilities across all sectors. We work with the Welsh Government and wider public sector to influence relevant areas of policy and implementation to promote information rights. Subject to availability, we can provide speakers for appropriate awareness raising events. Welsh Language Standards The ICO is committed to providing services to all stakeholders, and The Welsh Language (Wales) Measure 2011 established a legal framework to impose duties on public organisations to comply with standards of conduct in relation to the Welsh Language. The ICO is committed to providing services to Welsh speaking stakeholders, and the ICO Wales office these services in line with the standards imposed in our Compliance Notice which can be found here. Complaints and compliments relating to our compliance with the Welsh language should be made in writing and directed to the Wales office using the contact details below. These will be handled in accordance with our service standards and our existing complaints procedure. You can also report complaints to the Welsh Language Commissioner.​ ICO Wales contact details Information Commissioner’s Office – Wales2nd Floor, Churchill HouseChurchill WayCardiffCF10 2HH Please phone 0330 414 6421 to talk to the team. Email: [email protected] We welcome calls in Welsh. Rydym yn croesawu galwadau yn Gymraeg. For information about what we do with personal data, see our privacy notice."
