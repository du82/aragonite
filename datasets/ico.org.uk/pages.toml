["https://ico.org.uk/for-organisations/data-protection-fee/register"]
title = "Register | ICO"
full_description = "For organisations Data protection fee Register Register Use this service to register and pay the fee for the first time. It is for all organisations (we use this term to include all data controllers, including sole traders and companies) that need to pay a fee to the ICO. You'll need to complete the form in one session, so we suggest you get everything you need before you start. You will need: your credit or debit card details, if paying by card; organisation name and address; and details about the number of staff you have and your turnover. We do not provide invoices as registration is required by law. Start your new registration application Takes about 15 minutes Already registered? Use this service to renew your annual data protection fee. Renew your fee We will use the information to process your payment and maintain the public register. We will publish all the information you provide, except where we say otherwise. For more information, see our privacy notice. When we receive your payment, we'll usually send a confirmation the following working day, and publish your registration on the register of fee payers within seven working days."
