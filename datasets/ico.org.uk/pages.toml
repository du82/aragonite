["https://ico.org.uk/for-organisations/advice-for-small-organisations/checklists/direct-marketing-advice-generator"]
title = "Direct marketing advice generator | ICO"
full_description = "For organisations Advice for small organisations How compliant are you? Check now Direct marketing advice generator Direct marketing advice generator Marketing can help you thrive by promoting your products and services to new and existing customers. Direct marketing is where you advertise or communicate marketing material to particular people or organisations. This includes promoting your aims and ideals, such as fundraising. You can find out more in our guidance. When you’re planning and delivering direct marketing messages, you must comply with the Privacy and Electronic Communications Regulations (PECR). Where these activities involve the use of personal information, you must also comply with the UK GDPR. Use this tool to learn how to market your organisation and use personal information in the right way. This will mean you’re only contacting people who are happy to hear from you, saving you time and money and protecting your reputation. This tool is in beta phase. This means it is being tested, amended and updated following review and feedback. You can tell us what you think at the end of the tool. Start This should take less than 15 minutes to complete."
