title = "Complaints and compliments about us | ICO"
full_description = "Make a complaint Complaints and compliments about us Complaints and compliments about us We aim to give the best possible service to all our customers in all of the services we provide. We publish information about the service standards you can expect in some of our key business areas. You can also get this information from our live chat service or our helpline on 0303 123 1113. If you are dissatisfied with our service, you can complain. You can also let us know if you think there is something we have done well. The Information Commissioner is not in a position to respond in person to all the matters raised with their office by the public. The Commissioner delegates such casework correspondence to be dealt with by their staff."
