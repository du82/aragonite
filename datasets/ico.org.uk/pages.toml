title = "Privacy and Electronic Communications Regulations (PECR) training videos | ICO"
full_description = "For organisations Direct marketing and privacy and electronic communications Privacy and Electronic Communications Regulations (PECR) training videos Privacy and Electronic Communications Regulations (PECR) training videos Click to toggle details Latest updates 19 May 2023 - we have broken the Guide to the UK GDPR down into smaller guides. All the content stays the same. Everyone in your business is responsible for complying with information rights laws. We’re here to help. We’ve taken the information governance and legislation training modules we provide to ICO staff as part of their internal training and made them available for you to reuse. This is a good place for your business to start. You can select the modules that fit the needs of your business and add them to your existing training materials. You can also amend the modules to suit your business if you need to. Please note: there may be some terminology which needs updating in some of these modules, which we will update over time. However you should still find the content useful in training your staff in the key points of the relevant legislation. To make sure you're accessing the latest content, use the resources on our website rather than downloading them. This module provides information about what to do if you want to reach your customers through electronic marketing. We also look at the use of cookies, and how to let people know what you’re doing with the information you collect. Training videos Module 14: Privacy and Electronic Communications Regulations (PECR) You may also be interested in... ICO training videos"
