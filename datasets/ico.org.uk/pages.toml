description = "Search the ICO’s register of more than 1 million data controllers to find organisations and people registered with the ICO under the Data Protection Act."
full_description = "About the Information Commissioner's Office What we do Register of fee payers and certificate downloads Register of fee payers and certificate downloads Download your registration certificateYou can download your registration certificate directly from our register of fee payers.We recommend you search for your certificate using your registration reference only. If you don't have your registration reference we recommend searching using your postcode. Please note: new registrations and certificates take two working days to be available to download. Download registration certificate Search the registerEvery organisation that processes personal information must pay a fee to the ICO, unless they are exempt. Failure to do so will result in a fixed penalty.There are more than one million fee payers on our register. We publish: the name and address of the controller; the registration reference; the level of fee paid; the date registered and the registration expiry; any other trading names of the organisation; and the contact details for the Data Protection Officer (DPO) if we have been told of one. The DPO name will also be published if they have consented to this. You can search our register to see if an organisation is registered with us. Search the register You can also download the register of fee payers as a dataset."
