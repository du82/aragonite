["https://ico.org.uk/global/privacy-notice/3-communicate-with-us-as-a-business"]
title = "3. Communicate with us as a business | ICO"
full_description = "Global ICO Privacy notice 3. Communicate with us as a business 3. Communicate with us as a business Contents Search this document ICO Privacy notice General information Cha​nges to this privacy notice Controller’s contact details Data Protection Officer's contact details How do we get information? Your data protection rights Request a service adjustment Sharing your information Links to other websites Your right to complain Children’s information Managing customer contact How you can contact us Visitors to our website Visitors to the office 2. Reason for contacting us Responding to our project ExplAIn consultation Report a nuisance call or message Making a complaint Report bad practices as a whistleblower Make an enquiry Investigations for law enforcement purposes Using our subject access request service Apply for a job or secondment Contact the Press Office Attend an event, seminar or workshop Responding to our consultation requests and surveys Register for a webinar or live broadcast event Subscribing to our e-newsletter Request our publications Make an information request Using our privacy notice generator tool 3. Communicate with us as a business Pay a fee under the Data Protection (charges and information) Regulations 2018 (the data protection fee) Apply for an ICO grant Report a breach (service providers) Report a breach (all controllers) When we audit an organisation Submit a Data Protection Impact Assessment for consultation Submit a BCR application for approval Signing the Your Data Matters pledge Joining our SME feedback group Nominations for Data Protection Officer of the Year award Providing details for case studies We’re carrying out an advisory check-up on your organisation Submit a question to our Innovation Advice Service in the BETA phase Register as a trust service provider Submit a Code of Conduct or Certification Scheme for approval Apply for accreditation as a code monitoring body Upstream feedback group Volunteer to particate in ICO website user research Data Protection Practitioners' Conference 2024 We hold the names and contact details of individuals acting in their capacity as representatives of their organisations, across the business. If this relates to interactions regarding our regulatory functions, the lawful basis is article 6(1)(e) of the UK GDPR. If the interactions relate to suppliers, contracts, buildings management, IT services etc., the legal basis is article 6(1)(c) of the UK GDPR for any legal obligation or article 6(1)(f) because the processing is within our legitimate interests as a business.As a contracting authority, the ICO are obliged by law to carry out tenders via an e–procurement portal. Any personal information provided to us as part of the tendering process will be held in this e-procurement portal. We use Delta eSourcing for this and their privacy notice can be viewed here. Previous Using our privacy notice generator tool Next Pay a fee under the Data Protection (charges and information) Regulations 2018 (the data protection fee)"
