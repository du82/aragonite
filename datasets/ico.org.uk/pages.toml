["https://ico.org.uk/for-organisations/direct-marketing-and-privacy-and-electronic-communications/guidance-for-the-use-of-personal-data-in-political-campaigning-1"]
title = "Guidance for the use of personal data in political campaigning | ICO"
full_description = "For organisations Direct marketing and privacy and electronic communications Guidance for the use of personal data in political campaigning Guidance for the use of personal data in political campaigning Download options (Opens download panel) Pages All pages This page Format PDF Download Contents Search this document Guidance for the use of personal data in political campaigning Legal obligations Controllers, joint controllers and processors Personal data Accountability Purpose limitation, data minimisation and storage limitation Lawful, fair and transparent processing Lawful bases Special category data Use of the electoral register Collecting personal data Profiling in political campaigning Political campaigning – opinion research and direct marketing Political campaigning in the online world After a campaign In October 2019 we launched a consultation on a draft framework code of practice for the use of personal data in political campaigning, the responses were used to help inform our work on the final version of this guidance, the use of personal data in political campaigning. We have published a summary of the responses received. At a glance Being able to communicate with and engage voters, including using digital services, is an essential part of democratic life. It is equally important to retain the trust and confidence of voters in using their data and the integrity of elections. This guidance highlights the importance of processing personal data in compliance with data protection law during political campaigning. This guidance provides clarity and practical advice to help those processing personal data in political campaigning to comply with the UK General Data Protection Regulation (UK GDPR), the Data Protection Act 2018 (DPA) and the Privacy and Electronic Communications Regulations 2003 (PECR). It does not introduce any new obligations or responsibilities. In more detail Introduction What is the purpose of this guidance? Who is this guidance for? When does this guidance apply? What happens if we don’t comply with this guidance? How should we use this guidance? Introduction It is vital in any democratic society that political parties and campaigners are able to communicate effectively with voters. But it is equally vital for the integrity of elections and democracy that all organisations involved in political campaigning handle and process personal data in a way that is compliant with data protection law. In recent years political campaigning has become increasingly sophisticated as new digital technologies and communication tools have developed rapidly. Campaigners now use the latest technology and commercial marketing techniques to attempt to understand their potential voters and communicate their political messages. The often invisible nature of these techniques can affect people’s trust and confidence in how their personal data is being used. However unintended, this poses a risk which undermines the democratic process. People can only make truly informed choices about who to vote for if they are sure their decisions have not been unfairly influenced. The messaging and technologies used by political parties and campaigners may vary and change over time. But they all need to be working to the same rules when it comes to data protection and direct marketing laws, regardless of the method or future technological developments. What is the purpose of this guidance? This guidance provides clarity and practical advice to help those processing personal data in political campaigning to comply with the UK General Data Protection Regulation (UK GDPR), the Data Protection Act 2018 (DPA) and the Privacy and Electronic Communications (EC Directive) Regulations (PECR). This guidance does not introduce any new obligations or responsibilities for campaigners above existing data protection and electronic marketing laws. Who is this guidance for? This guidance is aimed at controllers (see section on controllership for further information) processing personal data for political campaigning purposes. By political campaigning purposes we mean: “activity in support of, or against, a political party, a referendum campaign or a candidate standing for election, or the success or failure of a recall petition.” This includes, but is not limited to, processing by registered political parties, candidates, referendum campaigners, non-party campaigners and recall petition campaigners. (Specifically, as defined in Political Parties and Referendums Act 2000 sections 23, 88, 105. Also the Representation of the People Act 1983 s118A and other equivalent electoral legislation, and Recall of MPs Act 2015, Schedule 3, Part 5.) This guidance applies to you if you process personal data for political campaigning purposes, regardless of your status under electoral law. It is not intended to cover internal party or campaign group election campaigning, such as leadership elections. It is also not intended to cover more general campaigning activities where these do not relate to referendum campaigns or elections. However, some of the points covered in the guidance may be useful for those purposes. It applies to you if you have a branch, office or other ‘establishment’ in the UK, and process personal data in the context of the activities of that establishment, whether or not you are based in the UK. It may also apply to you even if you don’t have an establishment in the UK and you are based outside the UK. The UK GDPR and the DPA still applies if you offer services to users in the UK, or monitor the behaviour of users in the UK, if your establishment is overseas. This guidance applies to processing for political campaigning in elections and referenda or potential elections and referenda in the UK. However, if you are processing for campaigning in non-UK elections and referenda and you are based in the UK, then the UK GDPR and DPA still applies and you may find this guidance helpful. When does this guidance apply? This guidance is not restricted to any ‘regulated periods’. You can collect, process and handle personal data for political campaigning purposes before, during, after and between particular campaigns. This guidance applies for as long as you are processing personal data for political campaigning purposes. What happens if we don’t follow with this guidance? Whilst this guidance is issued under the Commissioner’s general powers, it does not have any special legal status beyond that. However, if you are processing personal data for the purposes of political campaigning and you don’t take reasonable steps to follow this guidance, you are likely to find it difficult to demonstrate that your processing is fair and complies with the UK GDPR and PECR. If you process personal data in breach of the UK GDPR or PECR, we can take action against you. Tools at our disposal include assessment notices, warnings, reprimands, enforcement notices and penalty notices (administrative fines). For serious breaches of the data protection principles, we have the power to issue fines of up to £17 million or 4% of your annual worldwide turnover, whichever is higher. In using these powers the Commissioner will follow the ICO Regulatory Action Policy. Our approach is to encourage conformance. Where we find issues we take fair, proportionate and timely regulatory action with a view to guaranteeing that individuals’ information rights are properly protected. We will take account of the size and resources of the organisation concerned. We are more likely to allow controllers time to bring their activities into compliance if you have a well-documented and reasoned case to support the approach you have taken. How should we use this guidance? This guidance assumes you are familiar with key terms and concepts in the UK GDPR, DPA and PECR. If you need an introduction to data protection – or more context and guidance on key concepts – you should refer to our separate Guide to Data Protection and Guide to the Privacy and Electronic Communications Regulations. For the avoidance of doubt, references in this guidance to UK GDPR can be taken to also include the EU GDPR as it stood at 31 December 2020, known as ‘the frozen GDPR’. Personal data relating to individuals located overseas that was collected prior to the end of 31 December 2020 is technically covered by the ‘frozen GDPR’ rather than the UK GDPR. However, in practice this makes little material difference to the way in which this guidance applies. For more information on the application of ‘the frozen GDPR’ please see our guidance on Data Protection after the end of the transition period. This guidance focuses on specific compliance and good practice points for using personal data in political campaigning. It is divided into several sections, designed loosely to follow the lifecycle of a political campaign. It is not intended as an exhaustive guide to compliance. It only covers processing for political campaigning purposes; it does not cover your wider obligations such as processing employment data or carrying out wider administrative tasks. Similarly, it does not elaborate on all your data protection obligations for political campaigning. For example, it does not cover accuracy, security, breach reporting or the right of access. Such obligations are equally as important as those explained in this guidance. However, the ways in which they apply are broadly the same whether you are processing for political campaigning purposes or any other purpose, so we have not included them. You need to ensure you are aware of all of your obligations, and you should read this guidance alongside our other guidance. This guidance applies to you if you process personal data for political campaigning purposes, regardless of your status under electoral law. Further reading For an introduction to data protection law and guidance on key concepts, see our Guide to Data Protection. For an introduction to electronic marketing laws, see our Guide to Privacy and Electronic Communications Regulations. Next Legal obligations"
