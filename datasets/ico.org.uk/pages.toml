["https://ico.org.uk/action-weve-taken/the-icos-work-to-recover-fines"]
title = "The ICO's work to recover fines | ICO"
full_description = "Action we've taken The ICO's work to recover fines The ICO's work to recover fines We have a robust but fair approach when recovering fines, providing payment plans where debtors are in genuine financial hardship. However, where we identify organisations that can pay but won’t pay, we will pursue formal recovery action which can result in insolvency. Equally, where directors seek to avoid payment via insolvency we actively exercise our full rights as a creditor, including nominating Insolvency Practitioners whose investigations can result in personal claims against directors. Formal debt recovery via insolvency can be complex and take several years to conclude so whilst it may appear that no money has been recovered, action is still actually ongoing and we will update our website when we receive dividends (payments). We also work closely with other enforcement agencies to disrupt and obstruct seriously non-compliant directors who for example, may persist in continuing to make nuisance calls or send unsolicited spam despite our fine. This can result in directors being disqualified and further civil action or criminal prosecutions. Civil monetary penalties Court orders for winding-up upon ICO petitions Director disqualifications Civil monetary penalties Fines issued in 2024/2025: Data controller Date of final notice Act Fine Poxell Ltd 03/08/2023 PECR £150,000 Ministry of Defence 07/12/2023 DPA £350,000 Grocery Delivery E-Services UK Ltd t/a HelloFresh 11/01/2024 PECR £140,000 Skean Homes Ltd 11/01/2024 PECR £100,000 L.A.D.H Limited 11/01/2024 PECR £50,000 Pinnacle Life Limited 15/02/2024 PECR £80,000 Coastal Windows & Conservatories (UK) Limited 15/08/2024 PECR £40,000 Court orders for winding-up upon ICO petitions There was 1 court orders for winding-up upon ICO petitions in Q2 2024/25. Director disqualifications We continue to refer cases and support Insolvency Service investigations. Director Years disqualified Disqual-ification end date Disqua