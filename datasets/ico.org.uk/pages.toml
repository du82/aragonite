["https://ico.org.uk/global/privacy-notice/apply-for-an-ico-grant"]
title = "Apply for an ICO grant | ICO"
full_description = "Global ICO Privacy notice Apply for an ICO grant Apply for an ICO grant Contents Search this document ICO Privacy notice General information Cha​nges to this privacy notice Controller’s contact details Data Protection Officer's contact details How do we get information? Your data protection rights Request a service adjustment Sharing your information Links to other websites Your right to complain Children’s information Managing customer contact How you can contact us Visitors to our website Visitors to the office 2. Reason for contacting us Responding to our project ExplAIn consultation Report a nuisance call or message Making a complaint Report bad practices as a whistleblower Make an enquiry Investigations for law enforcement purposes Using our subject access request service Apply for a job or secondment Contact the Press Office Attend an event, seminar or workshop Responding to our consultation requests and surveys Register for a webinar or live broadcast event Subscribing to our e-newsletter Request our publications Make an information request Using our privacy notice generator tool 3. Communicate with us as a business Pay a fee under the Data Protection (charges and information) Regulations 2018 (the data protection fee) Apply for an ICO grant Report a breach (service providers) Report a breach (all controllers) When we audit an organisation Submit a Data Protection Impact Assessment for consultation Submit a BCR application for approval Signing the Your Data Matters pledge Joining our SME feedback group Nominations for Data Protection Officer of the Year award Providing details for case studies We’re carrying out an advisory check-up on your organisation Submit a question to our Innovation Advice Service in the BETA phase Register as a trust service provider Submit a Code of Conduct or Certification Scheme for approval Apply for accreditation as a code monitoring body Upstream feedback group Volunteer to particate in ICO website user research Data Protection Practitioners' Conference 2024 Purpose and lawful basis for processing What we need Why we need it What we do with it How long we keep it What are your rights? Do we use any data processors? Purpose and lawful basis for processingOur purpose for processing this information is to facilitate the grant.The lawful basis we rely on to process your personal data is article 6(1)(e) of the UK GDPR, which allows us to process personal data when this is necessary to perform our public tasks as a regulator.What we needWhen individuals apply for a research grant under the ICO’s Grants Programme, they submit their information in an application form, give details of their proposal and outline the research’s potential cost.Why we need itThose who are awarded grants are asked to provide progress reports, a final report and a list of final expenses. Any personal information given in the application and during any research for which we have awarded a grant, is used only to review the grant application and the ongoing administration and management of any grants we award.What we do with itWe may also publish information about projects on our own website, including the amount of grant awarded and the recipient of the grant.Some information about grants awarded are also published on the Government grants register. The information that will be made public on the register includes the name of the grant programme (for us the ICO Grants Programme) and the funder’s name (the ICO), a description of the grant’s aims and objectives, the value and currency of the grant, the date it was awarded, and the name of the grant’s recipient and their recipient ID. More information on the Government grants register can be found here.How long we keep itFor information about how long we hold personal data, see our retention schedule.What are your rights?As we process personal data in grant applications in our capacity as a regulator, you have the right to object to our processing of your personal data. There are legitimate reasons why we may refuse your objection, which depend on why we are processing it.For more information on your rights, please see ‘Your rights as an individual’.Do we use any data processors?No – we do not use any processors for the above. But, as stated above, we do publish information on the Government grants register. Previous Pay a fee under the Data Protection (charges and information) Regulations 2018 (the data protection fee) Next Report a breach (service providers)"
