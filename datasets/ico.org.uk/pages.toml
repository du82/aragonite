["https://ico.org.uk/global/privacy-notice/contact-the-press-office"]
title = "Contact the Press Office | ICO"
description = "This privacy notice tells you what to expect when you contact the ICO press office."
full_description = "Global ICO Privacy notice Contact the Press Office Contact the Press Office Contents Search this document ICO Privacy notice General information Cha​nges to this privacy notice Controller’s contact details Data Protection Officer's contact details How do we get information? Your data protection rights Request a service adjustment Sharing your information Links to other websites Your right to complain Children’s information Managing customer contact How you can contact us Visitors to our website Visitors to the office 2. Reason for contacting us Responding to our project ExplAIn consultation Report a nuisance call or message Making a complaint Report bad practices as a whistleblower Make an enquiry Investigations for law enforcement purposes Using our subject access request service Apply for a job or secondment Contact the Press Office Attend an event, seminar or workshop Responding to our consultation requests and surveys Register for a webinar or live broadcast event Subscribing to our e-newsletter Request our publications Make an information request Using our privacy notice generator tool 3. Communicate with us as a business Pay a fee under the Data Protection (charges and information) Regulations 2018 (the data protection fee) Apply for an ICO grant Report a breach (service providers) Report a breach (all controllers) When we audit an organisation Submit a Data Protection Impact Assessment for consultation Submit a BCR application for approval Signing the Your Data Matters pledge Joining our SME feedback group Nominations for Data Protection Officer of the Year award Providing details for case studies We’re carrying out an advisory check-up on your organisation Submit a question to our Innovation Advice Service in the BETA phase Register as a trust service provider Submit a Code of Conduct or Certification Scheme for approval Apply for accreditation as a code monitoring body Upstream feedback group Volunteer to particate in ICO website user research Data Protection Practitioners' Conference 2024 Purpose and lawful basis for processing What we need Why we need it What we do with it How long we keep it What are your rights? Do we use any data processors? Purpose and lawful basis for processingOur purpose for collecting this information is so we can respond to you and give you information about the legislation we oversee in order for you to publish.The lawful basis we rely on for processing your personal data is public task, under article 6(1)(e) of the UK GDPR.What we needWe need enough information from you so we can respond to you. We’ll take your name and number/contact email address and, where relevant, the name of the organisation you represent.Why we need itWe need to keep a record of who we have spoken with and what has been asked for/provided. If we can’t answer your query/request over the phone, we’ll need your contact information for our response.What we do with itWe’ll only use your personal information to respond to you and will make a record of our communications with you, both verbal and written.We’ll also use your contact information to send you our press releases.How long we keep itFor information about how long we hold personal data, see our retention schedule.What are your rights?We are acting in our official capacity as a regulator in providing you with press releases and responding to media enquiries. This means you have the right to object to our processing of your personal data. There are legitimate reasons why we may refuse your objection, which depend on why we are processing it.You can however, ask us to stop sending you press releases at any time and we’ll update our records immediately to reflect your wishes. For more information on your rights, please see ‘Your rights as an individual’.Do we use any data processors?Yes – We use Onclusive and Kantar, who are in partnership with Agility, to store communications and distribute our press releases.Go to the privacy notices for Kantar and Onclusive to find out more about how they process personal data. Previous Apply for a job or secondment Next Attend an event, seminar or workshop"
