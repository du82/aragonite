["https://ico.org.uk/for-organisations/direct-marketing-and-privacy-and-electronic-communications/business-to-business-marketing"]
title = "Business-to-business marketing | ICO"
full_description = "For organisations Direct marketing and privacy and electronic communications Business-to-business marketing Business-to-business marketing At a glance Business-to-business marketing is when you send direct marketing to another business or a business contact. PECR contains rules on direct marketing by electronic message (eg phone call, email, text message and fax). These rules may differ depending on your chosen method of direct marketing and the type of business that you intend to contact. Sometimes you may need consent. Businesses are classed as “corporate subscribers” under PECR if they are a corporate body with separate legal status (eg companies, limited liability partnerships, Scottish partnerships, and some government bodies). However sole traders and other types of partnerships are classed as “individual subscribers” and PECR treats them the same as individuals. In general the marketing rules in PECR apply equally to corporate subscribers and individual subscribers. The main difference is that the rule on marketing by electronic mail (eg email or text message) doesn’t apply to corporate subscribers. If you are processing personal data for direct marketing purposes, even in a business context, the UK GDPR applies. If you collect an individual’s contact details in their business capacity and you intend to send them direct marketing messages, you must tell them about this and have a lawful basis under the UK GDPR for the processing. If you want to use publicly available personal data to send marketing to an individual, even in a business context, you need to comply with the UK GDPR. Businesses and business contacts can object to your direct marketing. They can also change their mind and withdraw their consent to your marketing at any time. In brief What is business-to-business marketing? Why is it important to know the rules for business-to-business marketing? When does PECR apply to business-to-business marketing? What are the rules for business-to-business marketing calls? What are the rules for sending business-to-business marketing by electronic mail? What are the rules for sending business-to-business marketing by fax? When does the UK GDPR apply to business-to-business marketing? What lawful basis might be appropriate for processing personal data of our business contacts? What do we need to tell our business contacts if we are processing their personal data? Can we use publicly available data to send business-to-business marketing? Can businesses object to our marketing? Checklist What is business-to-business marketing? Business-to-business (B2B) marketing is when you send direct marketing to another business or a business contact. Direct marketing is broad and covers all types of advertising, marketing or promotional material. It covers any means of communication such as emails, text messages, phone calls, and post. It includes commercial marketing (eg promotion of products and services) and the promotion of aims and ideals (eg fundraising, campaigning). Why is it important to know the rules for business-to-business marketing? It is important because how the law applies to you may differ depending on your chosen method of direct marketing and the type of business that you intend to contact. For example, are they a corporate subscriber or are they treated the same as individuals? The UK GDPR still applies to B2B marketing if you are processing personal data. For example, if you hold the name of the individual who represents the business. It is the Privacy and Electronic Communications Regulations 2003 (as amended) (PECR) rules that may be different for B2B when compared to contacting individuals in their personal capacity. Further reading Guide to the UK GDPR Guide to PECR When does PECR apply to business-to-business marketing? PECR applies to the sending of direct marketing messages by: live or automated phone call; electronic mail (eg emails and text messages); and faxes. The marketing rules in PECR refer to “subscribers”. For example, this means the customer named on the bill for a telephone line or internet connection. There are two type of subscribers in PECR - corporate and individual. Corporate subscriber covers subscribers that are a corporate body with separate legal status. This includes: companies; corporation soles; limited liability partnerships; Scottish partnerships; some government bodies; and any other body corporate or entity that is a legal person distinct from its members. So, for example, the email address or telephone number of an employee at a corporate body would constitute a corporate subscriber for the purposes of PECR because the ‘subscriber’ is their employer. However not all types of businesses are classed as corporate subscribers under PECR. Some are actually classed as individual subscribers. This includes: sole traders; certain types of partnerships (eg non-limited liability partnerships or other types of English, Welsh and Northern Irish partnerships); and other unincorporated bodies of individuals. This means they are treated the same as individuals and have greater protections under PECR. PECR applies to direct marketing sent to businesses in the following circumstances: Marketing method Does PECR apply? ‘Live’ phone calls to corporate subscribers ✓ ‘Live’ phone calls to sole traders and some types of partnerships ✓ Automated phone calls to corporate subscribers ✓ Automated phone calls to sole traders and some types of partnerships ✓ Faxes sent to corporate subscribers ✓ Faxes sent to sole traders and some types of partnerships ✓ Electronic mail (eg emails or text messages) to corporate subscribers ✘ Electronic mail (eg emails or text messages) to sole traders and some types of partnership ✓ See the sections below for the rules on making B2B marketing calls and sending marketing by electronic mail and faxes. Further reading Guide to PECR: Electronic and telephone marketing Guide to PECR: Subscribers What are the rules for business-to-business marketing calls? PECR covers making direct marketing calls by live or automated call. These rules apply to B2B marketing calls. Live direct marketing calls In most circumstances if you want to make a live direct marketing B2B call (where a live person is speaking) the PECR rules are that you: cannot call numbers registered with the Corporate Telephone Preference Service (CTPS) or the Telephone Preference Service (TPS) unless the business has consented to your marketing calls; cannot call the number of a business who has previously objected to your calls; must say who is calling (eg the name of your organisation); must allow your number (or an alternative contact number) to be displayed to the business receiving the call; and must provide your contact details or a Freephone number if asked. It is important to remember that some businesses (eg sole traders and some partnerships) register with the TPS, and others register with the CTPS. Therefore before you make live B2B calls, you need to screen against both the CTPS and TPS registers, as well as your own ‘do not call’ list. Example An office equipment company wants to advertise its services by telephone. It has a list of businesses and their phone numbers. Before making any calls, the company screens the numbers against both the CTPS and TPS, as well as its own list of phone numbers of businesses that have previously asked it not to call them. The company makes marketing calls to the remaining numbers on its list, ensuring that its own telephone number is displayed when making the calls. The rules on making some types of live direct marketing calls are stricter. For claims management services you must have consent to make live marketing calls. For live marketing calls about pension schemes you must: be a trustee or manager of a pension scheme or a firm authorised by the Financial Conduct Authority; and the person you are calling must have specifically consented to your calls or your relationship with the individual meets strict criteria. Automated direct marketing calls This type of call is made by an automated dialling system that plays a recorded message. If you want to make an automated marketing B2B call, you must: have consent from the business you intend to call (this consent must specially cover automated calls from you); say who is calling (eg the name of your organisation); allow your number (or an alternative contact number) to be displayed to those receiving the call; and provide your contact details or a Freephone number. PECR takes its standard of consent from the UK GDPR which means it must be freely given, specific, informed and unambiguous. See our separate guidance on what counts as consent for more information. If you are processing personal data when making a marketing call to another business, you need to comply with the UK GDPR. For example, because you know the name of the person who you are calling. See the section When does the UK GDPR apply to business to-business marketing for further information. Further reading Guide to PECR: Telephone marketing Guide to PECR: What counts as consent What are the rules for sending business-to-business marketing by electronic mail? The term electronic mail is intentionally broad and is defined in PECR as: “any text, voice, sound or image message sent over a public electronic communications network which can be stored in the network or in the recipient’s terminal equipment until it is collected by the recipient and includes messages sent using a short message service” It covers any electronically stored messages. For example emails, text messages, picture or video messages, voicemails, direct messages via social media or any similar message that is stored electronically. The PECR rule on direct marketing by electronic mail does not apply to corporate subscribers. For example, this means you can send B2B direct marketing emails or texts to any corporate body. You do not need their consent under PECR to send such messages. However you must: not disguise or conceal your identity; and give a valid address for business to opt-out or unsubscribe from your messages. It makes good business sense for you to keep a ‘do not email or text’ list of any corporate subscribers that object or opt-out of your direct marketing by electronic mail. You should screen any new B2B direct marketing lists against it. PECR does not say that you must comply with a corporate subscriber’s opt-out in the context of electronic mail. However, given the fact that it does require you to provide a valid address for opt-outs, the intention clearly was there to allow corporate subscribers to unsubscribe. In addition, it serves little purpose to continue to send such marketing to a corporate subscriber who has asked you not to. Therefore, you should comply with a corporate subscriber’s opt-out request. It is important to remember, however, that in some circumstances you may be required to comply with an opt-out or objection. For example, if personal data is involved. See the section Can businesses object to our direct marketing for further information. Because sole traders and some partnerships are treated by PECR as individual subscribers you can only market them by electronic mail if they have specifically consented, or the ‘soft opt-in’ applies. The soft opt-in is a term commonly used to describe the exception to the consent requirement. If you want to use the soft opt-in for sole traders or partnerships instead of consent you must meet all of the following requirements: you must have obtained the contact details in the course of a sale or negotiation of a sale of your product or service; it is your similar products and services that are being marketed; you gave the sole trader or partnership a clear opportunity to refuse or opt-out of your marketing when you collected their details; and you give them an opportunity to refuse or opt-out in every communication you send to them. If you are unsure whether the contact details belong to an individual subscriber or a corporate subscriber this puts you at risk of breaching PECR. To mitigate that risk you should treat the details as belonging to an individual subscriber and ensure that you comply with rules on electronic mail. Example An online building supplies company collects email addresses of customers when they place orders with it. The company wants to advertise its special offers by email to these customers. The products it sells on its website are aimed at those in the building trade but it is aware that many of its customers are likely to be sole traders. The company decides that for all future purchases it will use the soft opt-in for all of its customers. As part of the online buying process it clearly explains that it would like to send emails to the customer about its special offers and gives a tick box for customers to use should they wish to opt-out. It sends marketing emails about its own products and services to those customers who did not opt-out and it includes an unsubscribe option within each email that it sends. If you are processing personal data when sending marketing by electronic mail to another business, you need to comply with the UK GDPR (including complying with the right to object to direct marketing). See the section When does the UK GDPR apply to business-to-business marketing for further information. The PECR rules on cookies and similar technologies apply if: you use ‘tracking pixels’ within your direct marketing emails; and the pixel involves storing information, or accessing stored information, on the device used to read the email (such as its location, operating system etc). The rules on cookies and similar technologies apply to all types of subscriber. See our separate guidance on cookies and similar technologies for information on how to comply. Further reading Guide to PECR: Electronic mail marketing Guide to PECR: Cookies and similar technologies What are the rules for sending business-to-business marketing by fax? Faxing is no longer often used as a method of sending direct marketing. However, if you are considering using this method, you can send direct marketing faxes to corporate subscribers without their consent. But you cannot fax any number listed on the Fax Preference Service unless they have specifically given their permission for you to send them marketing faxes. You also cannot fax anyone who has told you not to. If you want to send marketing faxes to a sole trader or certain types of partnership you must have consent. In practice, for B2B marketing by fax you need to: check if the business is an individual subscriber; get consent from any individual subscribers (eg sole traders); screen against the Fax Preference Service; screen against your own ‘do not fax’ lists; and include your name (eg the name of your organisation) and contact address or Freephone number on all B2B direct marketing faxes. You need to comply with the UK GDPR, if you are processing personal"
year_published = 2025
