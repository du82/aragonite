["https://ico.org.uk/global/copyright-and-re-use-of-materials"]
title = "Copyright and re-use of materials | ICO"
full_description = "Copyright and re-use of materials All text content on this website is available under the Open Government Licence (OGL) v3.0, except where otherwise stated.If you re-use text content under the OGL, you must include the following attribution: Information Commissioner’s Office, [name and date of publication], licensed under the Open Government Licence.If you would like to re-use the ICO’s materials but the proposed re-use would contravene any of the conditions of the OGL, you should contact the ICO communications department (see below). Please bear in mind that materials downloaded from the ICO website are up to date versions but items you have obtained from the ICO in the past, or from elsewhere, may not be. The ICO updates its guidance and other materials from time to time. We recommend that you use the latest versions by referring to the ICO website. The ICO’s intellectual property rights, including copyright in its materials, are unaffected by the ICO’s voluntary application of the OGL. These rights still belong to the ICO. Images Images are not available for re-use under the OGL because in most cases copyright is held by a third party. The ICO does not grant anyone any rights to reuse images. Contacting the ICO communications department Contact Tim Bowden in the ICO communications department to ask permission and what, if any, additional conditions may apply. Your application should be in writing, specifying the name and address of the applicant, identifying the information source you want to re-use and the purpose for re-use. For information about what we do with personal data see our privacy notice. Use of logos The use of any of the Information Commissioner's logos on any document or in association with any information signifies that the document or information has been prepared or approved by the Information Commissioner. The logos are used only on materials generated by the Commissioner's office or where the Commissioner's office has worked in association with an organisation preparing advice on data protection or freedom of information. Use of any of the Commissioner's logos without the Commissioner's consent infringes the copyright held in respect of the logos. No permission will be granted for the use of the logos nor will reproduction of the logos in any form be allowed unless the Commissioner determines that: the material on which the logos is to be used and the use of the logos on such material have been expressly approved by their office."
