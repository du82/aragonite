["https://ico.org.uk/global/privacy-notice/managing-customer-contact"]
title = "Managing customer contact | ICO"
full_description = "Global ICO Privacy notice Managing customer contact Managing customer contact Contents Search this document ICO Privacy notice General information Cha​nges to this privacy notice Controller’s contact details Data Protection Officer's contact details How do we get information? Your data protection rights Request a service adjustment Sharing your information Links to other websites Your right to complain Children’s information Managing customer contact How you can contact us Visitors to our website Visitors to the office 2. Reason for contacting us Responding to our project ExplAIn consultation Report a nuisance call or message Making a complaint Report bad practices as a whistleblower Make an enquiry Investigations for law enforcement purposes Using our subject access request service Apply for a job or secondment Contact the Press Office Attend an event, seminar or workshop Responding to our consultation requests and surveys Register for a webinar or live broadcast event Subscribing to our e-newsletter Request our publications Make an information request Using our privacy notice generator tool 3. Communicate with us as a business Pay a fee under the Data Protection (charges and information) Regulations 2018 (the data protection fee) Apply for an ICO grant Report a breach (service providers) Report a breach (all controllers) When we audit an organisation Submit a Data Protection Impact Assessment for consultation Submit a BCR application for approval Signing the Your Data Matters pledge Joining our SME feedback group Nominations for Data Protection Officer of the Year award Providing details for case studies We’re carrying out an advisory check-up on your organisation Submit a question to our Innovation Advice Service in the BETA phase Register as a trust service provider Submit a Code of Conduct or Certification Scheme for approval Apply for accreditation as a code monitoring body Upstream feedback group Volunteer to particate in ICO website user research Data Protection Practitioners' Conference 2024 Restricted contact Single point of contact What are your rights? Restricted contact We may impose a restriction on your access to our services if it’s necessary to protect our staff from unacceptable behaviour as explained in our service standards.The lawful basis we rely on to process your personal data is article 6(1)(e) of the General Data Protection Regulation (UK GDPR), which allows us to process personal data when this is necessary to perform our public tasks as a regulator.If we feel that your behaviour is unacceptable or unreasonably persistent, we may issue you with a behaviour warning in the first instance. If we issue you with a behaviour warning, or if we do impose a restriction or your access to our services, we’ll explain to you why we feel it’s necessary and any restriction we have applied. We’ll create a record of warnings and restrictions for administration purposes, so relevant staff members know about any warnings or restrictions that are in place. This will include your name, contact details and a description of why we have issued a warning or imposed a restriction.The decision to impose a restriction will be taken, and reviewed, by a manager. We’ll write to you explaining why we’ve applied the restriction. We’ll review the restriction periodically. We’ll remove it if we feel your behaviour has changed or if you no longer communicate with us.Single point of contact We may provide a single point of contact if you or we (or both) believe it will help to create a better outcome for all concerned.The lawful basis we rely on to process your personal data is article 6(1)(e) of the UK GDPR, which allows us to process personal data when this is necessary to perform our public tasks as a regulator.If the information you provide us in relation to your single point of contact contains special category data, such as health, religious or ethnic information the lawful basis we rely on to process it is article 9(2)(g) of the UK GDPR, which also relates to our public task and the safeguarding of your fundamental rights, and Schedule 1 part 2(6) of the DPA2018 which relates to statutory and government purposes.A decision will be made by a manager to give you a single point of contact. This may be where you have several complaints and we believe it will be more efficient for us to deal with them in this way. We’ll make a record of the fact that you have a single point of contact. All relevant staff will know about using it to manage communications between our office and you. It will include your name, contact details and a description of the need to have a single point of contact. We’ll review this requirement from time to time.What are your rights?We are acting in our official capacity as a regulator regarding your contact restriction or single point of contact (or both), so you have the right to object to our processing of your personal data. There are legitimate reasons why we may refuse your objection, which depend on why we are processing it.For more information on your rights, please see ‘Your rights as an individual’. Previous Children’s information Next How you can contact us"
year_published = 2025
