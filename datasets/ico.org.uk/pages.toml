["https://ico.org.uk/global/privacy-notice/attend-an-event-seminar-or-workshop"]
title = "Attend an event, seminar or workshop | ICO"
full_description = "Global ICO Privacy notice Attend an event, seminar or workshop Attend an event, seminar or workshop Contents Search this document ICO Privacy notice General information Cha​nges to this privacy notice Controller’s contact details Data Protection Officer's contact details How do we get information? Your data protection rights Request a service adjustment Sharing your information Links to other websites Your right to complain Children’s information Managing customer contact How you can contact us Visitors to our website Visitors to the office 2. Reason for contacting us Responding to our project ExplAIn consultation Report a nuisance call or message Making a complaint Report bad practices as a whistleblower Make an enquiry Investigations for law enforcement purposes Using our subject access request service Apply for a job or secondment Contact the Press Office Attend an event, seminar or workshop Responding to our consultation requests and surveys Register for a webinar or live broadcast event Subscribing to our e-newsletter Request our publications Make an information request Using our privacy notice generator tool 3. Communicate with us as a business Pay a fee under the Data Protection (charges and information) Regulations 2018 (the data protection fee) Apply for an ICO grant Report a breach (service providers) Report a breach (all controllers) When we audit an organisation Submit a Data Protection Impact Assessment for consultation Submit a BCR application for approval Signing the Your Data Matters pledge Joining our SME feedback group Nominations for Data Protection Officer of the Year award Providing details for case studies We’re carrying out an advisory check-up on your organisation Submit a question to our Innovation Advice Service in the BETA phase Register as a trust service provider Submit a Code of Conduct or Certification Scheme for approval Apply for accreditation as a code monitoring body Upstream feedback group Volunteer to particate in ICO website user research Data Protection Practitioners' Conference 2024 Purpose and lawful basis for processing What we need Why we need it What we do with it How long we keep it What are your rights? Do we use any data processors? Purpose and lawful basis for processingOur purpose for collecting this information is so we can facilitate the event and provide you with an acceptable service.The lawful basis we rely on for processing your personal data is your consent under article 6(1)(a) of the UK GDPR. When we collect any information about dietary or access requirements we also need your consent (under article 9(2)(a)) as this type of information is classed as special category data.What we needIf you wish to attend one of our events, you will be asked to provide your contact information including your organisation’s name and, if offered a place, information about any dietary requirements or access provisions you may need. We may also ask for payment if there is a charge to attend.Why we need itWe use this information to facilitate the event and provide you with an acceptable service. We also need this information so we can respond to you.What we do with itIf you are not successful in securing a place, we’ll let you know and hold your details on a reserve list in case a place becomes available.If you are allocated places at an event, we’ll ask for information about any dietary/access requirements. We don’t share this information in any identifiable way with the venue, and we delete it after the event.We don’t publish delegate lists for events.During online events we may use Slido to create interactive live polls, Q&As, and quizzes. We will retain the data from these events for 3 months on order to analyse the responses and gauge the success of the event. Use of Slido is not required in order to attend our events.How long we keep itFor information about how long we hold personal data, see our retention schedule.What are your rights?We rely on your consent to process the personal data you give us to facilitate the event. This means you have the right to withdraw your consent at any time. If at any point you want to withdraw your consent please email or call us 0303 123 1113. If you do that, we’ll update our records immediately to reflect your wishes.For more information on your rights, please see ‘Your rights as an individual’.Do we use any data processors?Yes – we use data processors to help facilitate the events.We collect registration information via an online reporting tool hosted by Snap Surveys, who process information in line with our instructions. We also use Microsoft Forms for the same purpose.For in-person events we might print delegate name badges. To do this we will share your information with our external print company Print-it. You can read their privacy notice here.We also use Orcula for the registration and hosting of some of our events.We may sometimes charge a fee to attend an event. If this happens, our communications about the event will provide details of the data processor we use to collect payments.We may use Slido when running interactive online events, for instance when we want to use live polls, Q&As, and quizzes. You can read the Slido privacy notice here. Previous Contact the Press Office Next Responding to our consultation requests and surveys"
