["https://ico.org.uk/for-organisations/advice-for-small-organisations/whats-new/e-learning"]
title = "E-learning | ICO"
full_description = "For organisations Advice for small organisations What's new? E-learning E-learning The videos on this page uses YouTube and Vimeo's privacy-enhanced modes and may set a cookie on your device. See our cookies page for more information. An introduction to data protection for small businesses and sole traders Setting strong passwords – a useful guide Multi-factor authentication – a useful guide We've had a breach - what happens next? No need to panic: Simple ways to deal with SARs Data protection for direct marketing: a two-minute guide Soft opt-in for email and text marketing: a two-minute guide Data protection and telephone marketing: a two-minute guide Data protection explained in three minutes Top tips for small businesses in the land and property sector Data protection in small schools Data sharing to safeguard children Data protection for small healthcare organisations Cyber security guidance for small businesses Employee monitoring: how your business can get it right Training resources for small businesses An introduction to data protection for small businesses and sole traders This webinar covers personal information, lawful bases, retention periods, subject access requests, personal data breaches and individual rights. Click to toggle details Script for this video Hi we're from the Information Commissioner's Office or ICO, the UK's independent regulator for data protection law.Our role is to help businesses get data protection.Right advise government about data privacy issues and take action against those who don't comply with the law. A fundamental aspect of our work is helping small businesses get their data protection right by providing practical advice.And you can find lots of this on our SME web hub.The web hub has top tips, guides, and simple tools designed to help small and medium sized businesses get to grips with data protection.It has everything you need to get started,check how you're doing and improve your compliance. We also link to the registration page where you can check if you need to pay the fee,change your details or set up your direct debit.Many organisations are legally required to register and pay the data protection fee. For small and medium sized businesses this is £52 or £78 per year with a £5 reduction when paid by direct debit.We have a self assessment tool so you can check if you need to register with us.We also have friendly and knowledgeable staff on our helpline and live chat who can guide you if you get stuck. So, this video will help you understand how to make data protection work for your small business.It looks at the key issues.you need to know, focusing on: what is personal information, how to identify the appropriate lawful basis for your business, how to set appropriate retention periods, privacy notices and the right to be informed, security and personal data breaches, And finally, individual rights and what to do if you receive a subject access request. So what is personal information?Data protection law is all about personal information.This is any and all information that identifies and relates to a living person.It could be about who some one is, where they live or what they do.It's information that tells you something about them. As part of running your business, you're likely to handle people's personal information every day.An example might be the information you record as part of employing staff, such as their bank and wage details, their HR records, and any sickness information.It's your responsibility to keep all that personal information safe, so it's important you know what you have, why you have it and where it is.You need to consider how you store it, how you use it, and when you should dispose of it.You must also understand the rights people have over their information and how to uphold them.Getting these things right will give confidence and reassurance to your staff, suppliers and customers.They'll trust you to comply with the law and look after their information properly. Now before you collect and use someone's personal information, you need to identify your lawful basis.This is basically your reason for having the data, and there are six options, consent, legal obligation, contract, vital interests, public task and legitimate interests.We'll briefly go through each of these for you now. So consent if you're relying on consent to use personal information, it has to be freely given.It can't be coerced or a condition of service.The person giving their consent can withdraw it at any time, and if they do so, you must stop processing their personal information.Consent is the lawful basis most people think of, but it's not necessarily always the most appropriate.For example, if you employ staff, you have to tell HMRC what they earn for tax purposes.You couldn't rely on consent here because if they said I don't want you to give HMRC any information about me, you'd be a bit stuck. In this example,legal obligation would be a more appropriate lawful basis. So a little more on legal obligation then. This is where the specific legislation in place that directs you to process the personal information.For example, as previously mentioned, you have a legal obligation to provide information about your employees to HMRC.You may also have a legal obligation to share personal information with the Health and Safety Executive where there's been a death, injury or dangerous incident in your workplace. Next contract you may need to process personal information to meet your contractual obligations or as part of a potential contract.For example, if a prospective client asks for a quote for your services, you'll need to process a certain amount of their personal information in order to provide this. Now you can rely on vital interests and a lawful basis if you need to process personal information to protect someone's life. For example, giving relevant information to the ambulance crew who've turned up to help someone who's unconscious. Public task. This lawful basis is usually used by public authorities or organisations carrying out specific tasks in the public interest.You may need to consider this if you work on behalf of a public authority such as your local Council. And finally, legitimate interests.This is where using personal information is in the legitimate interests of yourself or a third party, and this can include commercial interests.But you do need to be able to justify your use of this lawful basis.To do so, you must identify a legitimate interest.Show that the way you're using personal information is necessary to achieve this interest and balance your interest against the person's own interests.This lawful basis is most appropriate where you use personal information in ways that people would reasonably expect, and where the privacy impact is minimal.For example, if you use contact information that somebody's made public to let them know about a job opportunity, they may be interested in. Whichever lawful basis you rely on,the way you use personal information needs to be proportionate and necessary to achieve the specified purpose.You must be able to justify what you're doing and why. Next, think about the personal information you hold.We've talked about the lawful basis for having it, but you must also ask yourself, do I still need it?You must be able to justify how long you keep personal information for and set an appropriate retention period.The UK GDPR doesn't set specific time limits for different types of data.Instead,this will depend on your purpose for holding the information.First, identify why you need the personal information.It might be that you're required to comply with legislation relevant to your sector.If so, then a specific retention period may already be set out, but if you're only retaining personal information for your own purposes, you'll need to set your own retention periods.Think about the different types of personal information you hold and decide how long you need to keep each type for. Now, once you've established your retention periods, you should document them. Regularly review the information you hold in line with these.Some automated systems can help you with this by flagging records for review or deleting information after a predetermined period.You also need to consider how you dispose of the personal information you no longer need. So make sure you shred any paper documents that include personal information and double check that electronic information isn't being stored in your backups or recycle bins if you no longer need it. Next, we'll focus on the right to be informed.People typically have a right to know what you're doing with their data.You generally have to tell people what data you have, why you have it, what you're going to do with it, who you'll share it with, and how long you'll keep it for.It's usually easiest to let them know this through a privacy notice.You can either put this on your website, or you could have it as a document you provide, either as a paper or electronic copy.This should be given to people before you start using their data, such as when they first contact you.Think about how your audience interacts with you and make your privacy information available to them in a way that will be easy for them to access.Proactively telling people what you do with personal information, including who you share it with and how long you keep it in an easy to understand and transparent way, will increase people's confidence in your collection and use of their information. Now when you run a business, people trust you with their data and you do have a duty to keep it safe.So we recommend that if you store information electronically, as most of us do, to set user accounts with strong passwords and make all of your devices lock when left for a certain period. Avoid using the same password for multiple accounts or using personal passwords for work accounts. Consider using multifactor authentication similar to that used when you log into your bank account.For example, a password and a validation code sent by text.This will help to reduce the risk of any unauthorised access to your accounts. Be extra vigilant about opening web links and attachments and emails or other messages.If you're unsure, contact the source of the email first to make sure that they haven't had a phishing attack.The National Cyber Security Centre, or NCSC, explains that phishing is when attackers attempted to trick users into doing the wrong thing, such as by clicking a bad link that will download malware or direct them to an unsafe website.These phishing attacks often arrive by email, but can also be through phone, text or social media too.It's also important to make your staff aware of the dangers and what to look out for. Regularly delete unneeded emails as this means any attacker who does gain access to your systems is going to have much less personal information available to them. Having up to date backups of your hard drive is important.Storing these away from your main computer is an effective way of making sure your business' data is still available to youif you were the subject of a ransomware attack.Sometimes, however, things don't go according to plan.Now, if there's been a breach of security and this leads to the accidental or unlawful destruction, loss, alteration, unauthorised disclosure of, or access to personal information, this is known as a personal data breach, or PDB.In other words, this means something's gone wrong with the personal information you're responsible for, and it's your job to take action.If this does happen, the first thing you need to do is to consider the implications.What's the potential risk to the people affected? Your priority is to take action to reduce or remove that risk whenever possible.The faster you act, the greater the chance of stopping what may have been a small problem from becoming a big problem. So having assessed the risk, if you can't say that it's unlikely that people will be affected, you need to report the breach to us at the ICO.Where possible, you should do this within 72 hours of finding out that something went wrong and give us as much information as you can.Tell us what happened,why it happened and what you've done to reduce the risk. And always keep an internal record of what's happened and look at the steps you can take to stop the same thing from happening again in the future. So moving on then, we talked about the right to be informed earlier, but there are other rights that people have over their personal information.It's important that you understand these rights and are aware of the requests that people can make to you. These individual rights give people a level of control over how businesses use their information.They include the right to have their data deleted or corrected, the right to stop processing in certain circumstances, and the right to get a copy of the data held about them.This is known as making a subject access request or a SAR. In most circumstances, you'll have one calendar month to respond to any information rights requests that are made to you.So knowing what information you hold and where it's stored can really help to make things quick and easy. We'd recommend putting a process in place for handling these types of requests now, even if you've never received one before. Having a written process to follow can make it easier and save you time once the clock starts ticking. In this video, we'll focus on subject access requests as we receive lots of questions about these on our live services.You can receive a SAR from anyone, including a customer, employee or a member of the public captured on your CCTV recording. Now if someone makes a request about their information, you must comply with that request unless there's a good reason not to.You can only refuse all or part of the request if you have a compelling reason.A request can be refused if it's manifestly unfounded or excessive.But refusing a request on these grounds is a high bar to reach.So you will need a strong justification that you should document. A request could be regarded as manifestly unfounded if it's clear the person who's making the request isn't really interested in the information, but has another motive.For example, if a customer makes a request but then offers to withdraw it in return for some form of benefit, such as a discount on their next purchase. For a request to be considered manifestly excessive, it needs to be clearly or obviously unreasonable.A person is entitled to request a copy of all the personal information you hold about them.A request isn't manifestly excessive just because it may involve a large amount of data.You will need to take into account all the circumstances of the request if you're determining whether it's manifestly excessive.For example, does it largely repeat or overlap with previous requests made by the same person?If it does, has a reasonable time elapsed since "
