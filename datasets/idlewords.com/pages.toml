["https://idlewords.com/2003/5"]
title = "5"
full_description = '''I've arrived in Maine for a long weekend, visiting my mother in the aptly-named town of Friendship. The peepers are croaking up a storm outside, but if you listen carefully, you can hear raindrops. An indignant letter from the insurance company is on the kitchen table. Apparently, this house has something called 'knob and tube wiring'. In the eyes of the insurance company, this is on… I just got a headhunting letter from one Kat Morrell, inviting me to apply for a job with the MSN Search people. From the letter, it sounds like they're preparing the Anti-Google - indexing the entire Internet to create "a search engine that will leapfrog over current technologies". Software patents are the kiss of death for innovation, because under current practice you can get the most obvious 'method' for doing just about anything patented. Have you ever swung sideways on a swing? Patent in… For a while now, I've been interested in how language barriers affect our ability to communicate online. With some real blog census data now coming in (and with the better half gone to her sister's graduation, and so unable to keep me from wasting a perfectly good Saturday) I spent today trying to measure how high those barriers are. I was driving home along Route 100, which for many miles is in a narrow V-shaped valley with forest on both sides of the narrow road. And there it was, a black bear, who must have just crossed the road and was lumbering up the slope, westbound, to attend to his bear business up in the Green Mountains. After a dispiriting two days of zapping duplicate URLs, and watching the crawl count drop by tens of thousands of weblogs, it looks like we hit a rich pocket of ore in the site queue. Minutes ago, the census crawl nosed past Technorati, with about a third of a million weblog sites indexed. I believe this is now the largest general weblog list on the … Part of the problem in indexing weblogs is finding them in the first place. Weblogs.com and sites like it are a start, but there are plenty of weblogs that don't announce their updates anywhere. The only way to find them is by crawling.'''
