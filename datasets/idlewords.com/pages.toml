["https://idlewords.com/2002/11/a_horrible_election_night.htm"]
title = "A Horrible Election Night (Idle Words)"
full_description = "It is the most depressing of nights here, in Vermont. Against all odds, the Democratic candidate for governor is trailing badly, which probably means farewell to civil unions in this state. According to the unusual Vermont constitution, if no candidate gets at least half the vote for governor, there will be a smackdown in the legislature, which is dominated by Republicans. Before tonight, the state was atwitter with speculation about whether the legislature would dare elect the Republican, Jim Douglas, even though Racine would get the plurality of the vote. But suddenly it seems he will just lose. A nasty election day all across the country. A victory for warmongers, plutocrats, cheats and religious nut jobs from coast to coast. I feel grumpy."
