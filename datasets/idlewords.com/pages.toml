["https://idlewords.com/2002/6"]
title = "6"
full_description = "A blogging smackdown in the house tonight, as each fights to craft the perfect entry, the One Entry that will suck traffic remorselessly away from the other. It has been ark-building weather for three days now, assuming that Noah built his ark in a tropical swamp without benefit of air conditioning, and yet despite it all, the fireflies came out t… I have been listening to old Sam Spade radio shows, complete with plugs for Wildroot Cream Oil Hair Tonic. Obviously not directed at me. Although in other respects, the forties ( radio version ) seem like a good fit. … A beastly hot night, and the cat is doing pirouettes, trying to catch a moth somewhere. I have been listening to the pleasant 'ping' of the Semant-O-Matic, as people run searches and poke around. Listening and reading the Sunday papers. And what interesting things there are. For one, the gigantic Arizona wildfire, all fifteen hundred square miles of it, which m… I am sitting here trying to solve the mystery of the erratic dialup -- four or five minutes of blissful 56 Kbps browsing, and then *poof*! There is no more incoming traffic. I blame the iBook, because the cube in the other room stays online for long langorous hours. iBook? Cube? No, this is not some ultra-hip chromed Architectural Digest fantasyland I inhabit. It is an ultra-hip rur… Here's something to really piss you off - NPR's bullshit linking policy. Basically, they want you to ask permission if you want to link to any part of their website. This is idiotic for what reason? My one brush with arbitrary power came when I exchanged strong words with a jackass INS agent with tatoos all up his arm. I had moved to Vermont, and so it turned out my three hour drive to get a citizenship interview in New Hampshire was fruitl… And the first player to score was named Emmanuel Olisadebe! Black, Nigerian-born, and fluent in Polish. Who knew? It's great to see that we're not just a land of lily-white potato eaters anymore. This might be old hat to Denmark, France, or Germany, but Poland is the most 06.10.2002 Geek Factor 10"
