["https://idlewords.com/2006/04/argentina_on_two_steaks_a_day.htm"]
title = "Argentina On Two Steaks A Day (Idle Words)"
full_description = "The classic beginner's mistake in Argentina is to neglect the first steak of the day. You will be tempted to just peck at it or even skip it altogether, rationalizing that you need to save yourself for the much larger steak later that night. But this is a false economy, like refusing to drink water in the early parts of a marathon. That first steak has to get you through the afternoon and half the night, until the restaurants begin to open at ten; the first steak is what primes your system to digest large quantities of animal protein, and it's the first steak that buffers the sudden sugar rush of your afternoon ice cream cone. The midnight second steak might be more the glamorous one, standing as it does a good three inches off the plate, but all it has to do is get you up and out of the restaurant and into bed (for the love of God, don't forget to drink water). The afternoon steak is the workhorse steak, the backbone of the day. It's the steak that gets you around the city, ensures a successful nap, steers you into the bar and (most importantly) gives you the mental clarity to choose the right cut of meat in the restaurant that night. Misorder the first steak and you will either find yourself losing steam by eight o'clock, when no restaurant is open, or scampering to find an awkward third bridge steak, to tide you over until dinner. All you need to know about the quality of pasture in the pampas is that cows went feral in Argentina. You can still see them grazing pretty much anywhere there is a horizontal patch of grass, all now firmly back in the hand of man, but still with a happy grassy glint in their eye. This most docile, placid, and passive of large herbivores stepped off the boat, took one nibble at the pampas and made a run for it. It knew that it wanted to spend the rest of its life eating the pampas grass, without outside interference. And the settlers, once they caught some of the early escapees, began to feel the same way about the beef. Eating steaks in Argentina feels like joining a cult. You find yourself leaning on friends to come visit, and writing YOU JUST DON'T UNDERSTAND in all caps more often than feels comfortable. Argentine beef really is extraordinary. Almost all of this has to do with how the cows are raised. There are no factory feedlots in Argentina; the animals still eat pampas grass their whole lives, in open pasture, and not the chicken droppings and feathers mixed with corn that pass for animal feed in the United States. Since this is the way of life a cow was designed for, it is not necessary to pump the animal full of antibiotics. The meat is leaner, healthier and more flavorful than that of corn-fed cattle. It has fewer calories, contains less cholesterol, and tastes less mushy and waterlogged than American meat. And the cows spend their lives out grazing in the field, not locked into some small pen. You can taste the joy."
year_published = 2006
