["https://idlewords.com/2003/4"]
title = "4"
full_description = '''I'm at a cafe about a block from the White House, watching the world go by. There's a man to my left on a cell phone, with about ten large cameras hanging from his body. He's talking animatedly about cameras into the cell phone. I've spent the last three days in a weird mix of meetings, slide demonstrations, and late night peregrinations through an Edward Hopper landscape, looking fo… Columbia has a news digest site they call Newsblaster which is the best I've ever seen. Each news category has a summary auto-synthesized out of a slew of articles that their crawler finds. Unlike Google news, which just pastes together the lead sentences of several stories, Columbia does some sophisticated processing on the text to actually p… I'm knee-deep in preparation for a slide talk tomorrow, but I can't resist posting a link to a pretty mind-numbing open letter to Dave Winer from a certain Daniel Brandt. The gist of Brandt's letter is to ask Dave Winer to take down his blogroll, which (in combination with a zillion other blogrolls) is skewing Google's rankings to fa… Azeem Azhar has an excellent summary of the two schools of thought in search engine design, and how they pertain to Google's recently announced purchase of Applied Semantics. I'm starting to cringe at the word "semantic", Lord knows I've done my share of harm there. It applies to both very structured Aristotelian type 'al… The coffee maker in this Westin hotel room is called "Aroma Elite". I love the idea that someone spent thousands of dollars coming up with that name. And now I have joined the Aroma Elite, as I sip my cup of joe. The Westin is a schizophrenic place. Promises of endless luxury, and rapacious fees for the tiniest bit of service. They have strangely fetishized the beds here - the ele… I've set up a discussion list on peer-to-peer search engines, since there seemed to be a lot of interest in the topic at the O'Reilly conference. The ultimate goal is to come up with a lightweight, flexible protocol that search engines can use to ask questions of each other, but it's a hard nut to crack.'''
