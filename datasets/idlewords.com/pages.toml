["https://idlewords.com/2005/08/a_rocket_to_nowhere.htm"]
title = "A Rocket To Nowhere (Idle Words)"
full_description = "The Space Shuttle Discovery is up in orbit, safely docked to the International Space Station, and for the next five days, astronauts will be busy figuring out whether it's safe for them to come home. In the meantime, the rest of the Shuttle fleet is grounded (confined to base, not allowed to play with its spacecraft friends) because that pesky foam on the fuel tank keeps falling off. There are 28 Space Shuttle flights still scheduled, firmly or tentatively, through 2010, when the current orbiter is supposed to retire in favor of a yet-to-be-designed replacement (which will not fly until 2014). On the eve of this launch, NASA put the likelihood of losing an orbiter at 1 in 100, a somewhat stunning concession by an agency notorious for minimizing the risk of its prize program. Given the track record, and the unanticipated foam problems, it's probably reasonable to assume a failure rate approaching 2%, a number close to the observed failure rate (1 in 57) and one likely to fall on the conservative side as the orbiters age. For all the talk of safety improvements, there really isn't a way to make the Shuttle much safer. The changes made with so much fanfare after the Columbia loss have been marginal, serving to prevent the psychologically untenable situation of watching damage occur at launch and being unable to do anything about it before re-entry, many days later. Actual safety improvements to the Shuttle - putting the orbiter on top of the launch stack, installing a crew escape system - would be so hideously expensive that they have been consistently vetoed. With 28 launches to go, probability tells us that the chance of losing another orbiter before the program's scheduled retirement is about 50-50. But past experience suggests that NASA will continue flying these things until one of them blows up again (note that suspicious four-year gap in manned flight capability right around the time the Shuttle is supposed to retire). This seems like as good a time as any to ask: why are we doing this?"
