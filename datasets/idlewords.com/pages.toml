["https://idlewords.com/2004/05/attacked_by_thugs.htm"]
title = "Attacked By Thugs (Idle Words)"
full_description = '''Warsaw has a river running down its middle, an unassuming and turpid ribbon of water with a stairstep concrete enbankment along both of its banks, where you can often find retirees fishing (only people on fixed incomes or those close to death would dare eat fish from the Vistula). In between the embankment and the touristy downtown on the western side of the river runs a long strip of parkland, bordered on its far edge by a big divided highway that parallels the river and is packed with traffic at all hours of the day. A simple, linear world - river, embankment, about a hundred yards of lawn and shrubbery, and highway. This riverside park doesn't figure much in Warsaw criminal lore. You can usually find young mothers pushing strollers along the path, nuns out for a walk, or the occasional staggering drunk, all of them signs of safety and comfort. On this particular day, I was walking along with a backpack on, muttering to myself loudly, and headed to the Old Town not half a kilometer away. It was towards noon and the weather was stunning, but the park was almost empty. At some point I noticed that a couple of young guys has started walking behind me on the path, your typical teenaged buzz-cut-and-track-suit types (Poland has yet to discover the mullet) who didn't seem very threatening. A little later, I noticed a second pair of young guys to my right, on a parallel sidewalk, and I recall feeling a tinge of uneasiness - there was a little too much in the way of fleeting looks and smirking from them, and I remember thinking that if the two pairs of guys were together, then I was in trouble. But this seemed like a paranoid thought, and I was just a few dozen steps from a very busy road, so rather than cutting sharply right to get nearer to traffic (which would have looked silly but spared me what happened next) I decided to just keep walking. The sidewalk to my right tapered off into lawn, and the pair of guys walking there cut diagonally across to my own path, until they were walking just a few dozen steps ahead of me. And then they slowed down and started to look back at me, smiling. Not normal. ' "What's up?" said the smaller of the pair, a teenager with an overhanging forehead.'''
