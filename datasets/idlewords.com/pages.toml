title = "1"
full_description = "It's positively subarctic here, but no one in New York seems to own a decent winter coat. Everywhere the streets are full of skinny, huddling people racing around in thin leather jackets, windbreakers and the occasional light wool overcoat. I'm beginning to think it's a point of pride to not own ugly, bulky winter outerwear here. Apartments are small, after all. I don't look forward to it, I don't want it to be this way, but I also know when to bow to the inevitable. We all die one day, we all pay taxes, and some of us are foredoomed to wake up in the capital of New Jersey. There may be nothing wrong with Trenton - I've never been there, and I'm in no hurry to speed my inevitable, inadvertent first visit -… (n) Software so grandiose and vaguely designed that no mortal mind can understand what it is actually supposed to do."
