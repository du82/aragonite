["http://www.idlewords.com"]
title = "Idle Words"
full_description = "“From a mathematics and trajectory standpoint and with a certain kind of technology, there’s not too many different ways to go to Mars. It’s been pretty well figured out. You can adjust the decimal places here and there, but basically if you're talking about chemical rockets, there's a certain way you're going to go to Mars.” - John Aaron[1] Unlike the Moon, which hangs in the sky like a lonely grandparent waiting for someone to visit, Mars leads a rich orbital life of its own and is not always around to entertain the itinerant astronaut. There is just one brief window every 26 months when travel between our two planets is feasible, and this constraint of orbital mechanics is so fundamental that we’ve known since Lindbergh crossed the Atlantic what a mission to Mars must look like.[2] Using chemical rockets, there are just two classes of mission to choose from: (The durations I give here can vary, but are representative). Before comparing the merits of each, it’s worth stressing what they have in common—both are long, more than double the absolute record for space flight (438 days), five times longer than anyone has remained in space without resupply (128 days), and about ten times humanity’s accumulated time beyond low Earth orbit (82 days).[3] It is this inconvenient length, more than any technical obstacle, that has kept us from going to Mars since rockets capable of making the trip first became available in the 1960's. [4] And because this length is set by the relative motions of the planets, it’s resistant to attack by technology. You can build rockets that go faster, but unless you make Mars go faster, you’ll mostly end up trading transit time for longer stay times. Getting a round trip below the 500 day mark requires fundamental breakthroughs in either propulsion or refueling. [5] Delta-v requirements for short stay missions of varying length (left) and a long-stay mission (orange line right) for comparison. Note the sharp jump at around 500 days. source."
