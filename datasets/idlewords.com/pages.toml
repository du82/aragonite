title = "Idle Words - Maciej Ceglowski"
full_description = '''This site is a collection of blog posts and short essays I've been writing since 2002. These are mainly about travel and food. You can find links to articles by category and a list of the all-time most popular articles on the front page. My name is pronounced "MAH-tchay". It's an archaic Polish form of "Matthew". I was born in Warsaw, Poland, in 1975, but accidentally immigrated to the United States when I was six years old. Although I still speak the language with my mother, and have family in and around Warsaw, I'm as American as gooseberry pie.'''
