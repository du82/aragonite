["https://idlewords.com/2002/10"]
title = "10"
full_description = "I think I am too much a coward ever to study climatology, because there are so very many ways for the world to become suddenly and dangerously inhospitable, in a very short stretch of time. For several weeks I had been distracted by the possibility that the great Atlantic conveyor might be about to halt ( as it has done … Seamus Heaney came to town, today, to give a reading of his poetry at Mead Chapel. I am usually a sluggard about attending events like these, but today I went and did not regret it. It was a wonderful reading - Seamus Heaney turns out to be a gentle man, full of warmth and humor, and his poems are very, very good. Before reading each one, he would give an unobtrusive little explanation o… We went today up to Burlington to get a whole bunch of shots for our impending trip to China. I got two shots in each arm, one each for flu, typhoid, and hepatitis, while tetanus and diptheria shared a syringe like gentlemen. Fifteen minutes in the doctor's office cost me $72, and the same for the better half, although we were in there together. All together, the shots came to half the … Sometimes I think every profession has its own special niche for the milquetoast authoritarian; those colorless and highly annoying people who thrive on being right about matters most arcane. Everyone has encountered the obsessive trivia hound, movie geek, or sports nut at work or in school, but it turns out there are whole little niche professions for the insufferable know-it-all; profession… I got a message in my mailbox the other day entitled 'highschool fun', and it's only by some small miracle I didn't delete it before noticing it actually came from one of my former high school classmates. Isn't that sad, somehow? One of the nice things about Apple's OS X mail client is that you can configure it to not download images, so that the ten daily 'high school barnyard fun' ema… The most amazing crystal blue day, with a crazy patchwork of fall colors scattered all across the mountains. The fall has been taking its sweet time with us, doing all kinds of ochre and subdued yellow things since the middle of August, unusually early, and suddenly we are in the middle of the real leaf season. The most magical thing about fall in Vermont is how different each year is from t…"
