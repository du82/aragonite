["https://idlewords.com/2005/11/dating_without_kundera.htm"]
title = "Dating Without Kundera (Idle Words)"
full_description = "One of the terrors of dating is Milan Kundera, and specifically, The Unbearable Lightness of Being, the sexually-transmitted book that this Czech-born author has inflicted on a generation of American youth. I fully recognize the important role of the dating book, that is, the carefully selected work you lend a prospective lover sometime in the golden honeymoon period between your second cup of coffee together and the first time you spend a night in the same bed without touching. In that short window of time, your partner is still a delicious mystery to you, an enigmatic and discerning being, and to her you are a dark continent of adventure and excitement, waiting to be explored. And so you lend her books that are funny, playful, and good subway reading, but also complex enough to hint at your Hidden Depths. Something unusual is a plus, as are lots of sexy bits, to serve as a reminder of the animal fires that burn within. And since you don't yet know one another too well, you try to choose a shotgun of a book that fires a wide pattern, thematically speaking. Like an early physicist studying the atom, you will hurl little bits of culture at your new love and collect valuable data about her inner life by observing the way they bounce off. Given these requirements, it's not surprising that many people have gravitated towards The Unbearable Lightness of Being. The book has that sexy whiff of the Eastern Bloc to it (very effective on anyone who hasn't been immunized by an actual relationship with an Eastern European), it's full of young people having complex, turgid sex with one another, and since the first sentence of the book mentions 'Nietzsche', it is ipso facto philosophical. It doesn't hurt, either, that Milan Kundera's craggy, intellectual face with the thunderbolt eyebrows is staring from the back cover. The problem, though, is that the Unbearable Lightness of Being is a really bad book. Milan Kundera is the Dave Matthews of Slavic letters, a talented hack, certainly a hack who's paid his dues, but a hack nonetheless. And by his own admission, this is his worst book. If you strip off the exoticism of Brezhnev-era Czechoslovakia (this rinses off easily in soapy water), you are left with a book full of vapid characters bouncing against each other like little perfectly elastic balls of condensed ego. And every twenty pages the story steps outside for a cigarette so that the author can deliver a short philosophical homily. Kundera has a sterile, cleanroom writing style meant to suggest that he is a surgeon expertly dissecting the human condition before your eyes, but if you look a little more closely, you see he's just performing an autopsy on a mannequin. Or more accurately, a RealDoll."
