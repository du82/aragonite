["https://idlewords.com/2002/10/pedantry.htm"]
title = "Pedantry (Idle Words)"
full_description = "Sometimes I think every profession has its own special niche for the milquetoast authoritarian; those colorless and highly annoying people who thrive on being right about matters most arcane. Everyone has encountered the obsessive trivia hound, movie geek, or sports nut at work or in school, but it turns out there are whole little niche professions for the insufferable know-it-all; professions that pay you to acquire detailed knowledge too stultifying for the average bear, and let you be snarky about it. I'm not talking about the borderline jobs like taxonomy, baseball writing, numismatics or tax law. I mean jobs that let you go whole hog, and devote your life to the minutia of some arbitrary system. In computer programming, we have language lawyers. In government, there are parliamentarians and heads of protocol. But nothing beats organic chemistry, where you can specialize in nomenclature, and devote your whole life to parsing names like: Oh, what glory can be yours! Every compound has a one true name, and any chemist ( in theory ) should be able to look at a molecule and come up with the appropriate monstrous name, but the rules are so arcane that in practice one must often seek professional help. Until computers came along, 'professional help' meant turning to one of those damp-palmed nomenclature geeks to help fill in the compound names in your research paper. Fortunately, times have changed, and now we have computers that will take a molecular diagram and give you a canonical compound name without smirking. Three cheers for computers, my Internet friends! Let's hope they can stamp out priggish people in all walks of life. ---"
year_published = 2002
