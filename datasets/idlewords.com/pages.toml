["https://idlewords.com/2002/12"]
title = "12"
full_description = '''One of my favorite Christmas presents this year was a set of vintage Polish propaganda poster calendars from my mother, who found them on sale on a visit to Warsaw last month. My mother was born a year before the war ended, and remembers crying when Stalin died in 1953, so some of these posters bring back a lot of memories for her. To judge by her reaction… I promised a post a few days ago about distributed search engines, but I\'ve been dilly-dallying about it. It\'s the holidays, we\'re all full of turkey and cookies. In my earlier post, I fretted about how Google and other centralized search services like it had become a bottleneck to finding information online, and could therefore become a tempting target in the drive to regulate ( and… I drove three hundred and fifty miles today, from Polish Christmas in Maine to American New Year in Connecticut, and a good hundred of those miles were made sweeter by the Colorblind James Experience. I am at a loss to describe the band in a way that would do it justice – it is a kind of motown jazz sextet by way of circus sideshow – but I can guarantee that you've not heard anything like it.… I have been holed up with some strange and compelling Cold-War era books on arms control, and on a whim decided to look some of the topics up on the web. In the process, I discovered a fascinating website where you can scare yourself silly about proliferation, learn a lot about how nuclear weapons work, and get some 12.25.2002 Nuclear Tidbit My fascination with the arms race pays off - did you know that the B-side to Bill Halley's "Rock around the Clock" was a post-nuclear apocalypse sex fantasy called "Thirteen women and only one man"? No, really.… I am in Maine for Christmas, far from the madding crowd (or its Vermont equivalent), and I feel vaguely silly writing a serious post about agribusiness. One of the many infuriating things about modern industrial farming is that it makes you feel like a crank just for writing about it. You start out citing facts, and pretty soon you feel like you are out in la-la land. But that’s because all…'''
