["https://idlewords.com/2003/12/100_years_of_turbulence.htm"]
title = "100 Years of Turbulence (Idle Words)"
full_description = '''A century ago today, the Wright brothers took turns steering one of the first powered heavier-than-air aircraft on a series of controlled flights, the longest of which lasted fifty-seven seconds. I say "one of the first" because there is a bit of controversy about who was first to fly, depending on how Clintonian you want to get about the meaning of "flight". If simply getting airborne is the criterion, honors have to go to the New Zealand eccentric Richard Pearse, who in 1902 built a giant flying table that enabled him to reach an altitude of several dozen feet and crash into gorse hedges. If powered flight without a pilot on board qualifies, then credit is due to Charles Parson's powered glider (1883) and Alexander Mozhaiski's steam-powered [!] monoplane (1884). If reaching an altitude of eight inches counts as flying, then put your hands together for Clement Ader, who made the first manned flight in 1890 - also using steam power - and then improved his aircraft so much that it could not get off the ground at all. If you believe that a qualifying flight has to be sustained and controlled, but you have lenient standards of proof, then you should consider the claims of Gustave Whitehead, who built a plane that modern science shows to be stable and controllable, but neglected to bring a camera or logbook along on his maiden voyage. If you are very demanding and insist that the plane not only stay in the air under its own power, but land at the same point it took off, to demonstrate full control, then you'll be wanting to congratulate the Wright brothers. In 1904, they rolled up their sleeves, built an improved version of their flyer, and on October 20 made a circular flight a little less than a mile long. Not even a year later, Orville was able to fly for more than 24 miles, staying airborne for 39 minutes. That's true flight by anybody's criteria except the Brazilians, who insist on the tortured prerequisite of takeoff from a dead stop in still air, just so they can cheer the Brazilian scion and one-man freak show Alberto Santos-Dumont. Dumont made waves in Paris by flying a giant powered box kite for several hundred yards in October 1906, gradually perfecting his technology until it could 'easily cover 200 meters of ground'. From there, it was a direct line to the Embraer jet.'''
year_published = 2003
clearnet = "https://idlewords.com/2003/12/100_years_of_turbulence.htm"
