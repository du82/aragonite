["https://idlewords.com/2004/11"]
title = "11"
full_description = "I attended a conference last weekend in the aptly named Downers Grove, out in the suburban doughnut of strip malls and car dealerships that surrounds the city of Chicago and buffers it against the redneck sea. I used to live in the northern part of this doughnut, in a town called Glenview, next to a big naval air station. But the naval base has since been eaten by little starter mansions, and I… I live these days as a permanent houseguest of my friend S., a stern-looking, white haired Russian Pushkinist. S. grew up as an expatriate in Czechoslovakia before making his way to Germany and then the United States. In 1994, when the Republican Revolution took place, and there was much gnashing of teeth at Jesse Helms becoming chairman of the Foreign Relations committee, I remembering a… I have made the source code for the Languid language guesser available in a module called, astonishingly, Language::Guess. Enjoy. Thanks to everyone who tried out the language guesser, and thereby helped me debug it. I have added multiple language… Everyone is excited about the election, and websites are progressively going down under the traffic. From a technical point of view, this is amazing - it's 2004, and serving local cached copies of the same text file to millions of people should not be a challenge, particularly if you have some inkling that Nov. 2 could be a high-traffic date for your site."
