full_description = '''Kudos to Dave Winer for updating the XML-RPC spec to remove the ASCII limitation on string values. This brings the spec up to date with common usage, and makes it officially possible to include non-English text in XML-RPC transactions. BOOM! The first thunderstorm of the summer. The lightning is so bright you can see colors in the landscape - green grass, black tree trunks, and millions of raindrops caught motionless in the strobe light. And BOOM! Tomorrow I head to Québec with my mother; we're going up way north of QuÃ©bec city, to a lake called St. Jean, where (it is whispered) temperatures are below eight… I'm writing this on a northbound train, headed back to Vermont after spending three days (and three air-conditioned nights) at the Center for Hellenic Studies in Washington, DC. The Center for Hellenic Studies is the kind of place that would launch a thousand classics careers, if only more people knew about it. Picture an ivory tower, sliced int… Here's a little chart of the growth in the census since we started crawling in early May. The red line is the offical blog count on Technorati, for comparison. For the past few weeks, there have been large strikes taking place in France. The proximate cause of the strikes is a proposal for pension reform and school decentralization, but there is a lot of history involved. For a while, it looked like the June school exams would have to be postponed, although teachers worked out a compromise with the government at the last minute. Nevertheless, the st… Sam Ruby is suggesting a fresh start for a weblog log format. As Lord High Poohbah of the NITLE Blog Census, I endorse it to the hilt. And I even have a name in mind - let's call it "RSS XP".… There's a nice project out there called GeoURL. Bloggers figure out what their coordinates are, and include that information in a META tag in their weblog. This information consists of a latitude/longitude pair. For the past few weeks, there have been large strikes taking place in France. For a while, it looked like the June school exams would have to be postponed, although teachers worked out a compromise with the government at the last minute. Trains get cancelled, school gets cancelled.'''
