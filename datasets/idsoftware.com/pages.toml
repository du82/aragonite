title = "id Software"
description = "id Software is a video game development studio guided by the basic principle of making the most innovative and immersive worlds possible, powered by leading-edge technology, to deliver an intense gaming experience."
full_description = "We are a studio guided by the basic principle of making the most innovative and immersive worlds possible, powered by leading-edge technology, to deliver an intense gaming experience. id Software is hiring across all departments for our unannounced project. We're looking for talented, self-motivated teammates with the skills and passion to drive innovation. Join our team in building premier, engaging gameplay experiences for a connected world. id Software, part of the ZeniMax Media Inc. family of companies, has provided technical, design and artistic leadership as a world-renowned game developer and technology innovator since its founding in 1991. id Software’s iconic brands such as Wolfenstein®, DOOM®, QUAKE® and RAGE® have become staples of popular culture for generations of gamers. At id Software, everything revolves around the people; we believe in hiring the best and brightest and giving them the tools and the environment to be successful. These principles have guided us successfully for over thirty years and will continue to guide us into the future. id Software is located in the Dallas-Fort Worth Metroplex in North Texas. With the fourth largest metropolitan area in the USA, there is fun to be had no matter what your taste is. From our award winning restaurants and sports teams, to our world class art and history museums, the DFW area has some of the most vibrant, exciting and unique entertainment in the country. Our employees also enjoy being part of the DFW game industry organized through our local IGDA chapter. id Software’s Frankfurt studio is an extension of the Dallas office focusing on technology development and the idTech engine for DOOM® and other games in development at Zenimax-owned studios. Located in Germany’s fifth largest city, Frankfurt is host to some of the most influential trade fairs, it has the most banks in continental Europe and with its impressive skyline and Main river flowing through it, it is lovingly called “Mainhattan” by many."
