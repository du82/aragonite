["https://www.ieee-security.org/CSFWweb/goodessay.html"]
title = "Essay"
full_description = '''I think the time has come for a full-scale redevelopment of the logical foundations of computer security. These thoughts have been forming in my mind over the last several years, and the discussion that ensued from John McLean's system Z example in the Computer Security Forum (Volume 5, Issue 14, June 22, 1986) prompts me to try to put some of them into writing. My belief that this redevelopment is necessary comes from my own attempt to try to review and understand the mathematical foundations upon which much of our current thinking about security is based. Some of this review has formal proofs. Some of it has been simply to try to understand these foundations and explain them to others. I was quite surprised to find that many of these foundations are imprecise and, in some cases, quite inadequate even to define precisely such fundamental concepts as "secure system." There is a pressing need for this redevelopment because we are now beginning to build a computer security industry, and it is very important that it be built on solid foundations. John McLean's Z system is an important case in point. It is widely accepted that a system is secure if and only if it produces a sequence of secure states. It is not surprising that this view is widely accepted. This is the property that was proved about the Bell and La Padula state transition rules, and it is the view that is embodied in the TCSEC. John's Z system clearly demonstrates the inadequacy of this widely-accepted definition of a secure system. The Z system satisfies this definition. Given an initial secure state, it produces only secure states (according to the traditional, Bell and La Padula definition of "secure state"). But system Z obviously is not secure because it downgrades everything in sight so that any subject can have access to any object. Then, in the discussion that follows John's example, the Z system is dismissed as a "stupid" and "bizarre" system. Such is the price of asking fundamental questions about sacred cows! Here I must rise fully in support of John McLean. What his example exhibits is not a stupid, bizarre system, but the inadequacy of a widely-accepted definition of "secure system." The state sequence definition of a secure system accepts system Z as secure, and it obviously is not! The problem is not the system, it is the acceptance criteria. That was John's key point, and the thrust of his question was "What else do we need for an adequate definition of 'secure system'?"'''
year_published = 2025
clearnet = "https://www.ieee-security.org/CSFWweb/goodessay.html"
