["https://www.ieee-security.org/CSFWweb/charter.html"]
title = "CSF Charter"
full_description = '''Background The Computer Security Foundations Symposium is an annual symposium for researchers in computer security and privacy, to develop and examine theories of security and privacy, to build formal models that provide a context for those theories, and to study techniques for verifying, analyzing, and implementing security and privacy. It was created in 1988 as an IEEE Computer Society workshop, in cooperation with the Technical Committee on Security and Privacy, in response to a 1986 essay by Don Good entitled "The Foundations of Computer Security - We Need Some." The meeting became a "symposium" in 2007, along with a policy for open, increased attendance. All topics relating to foundational security and privacy are in scope. The atmosphere of the symposium is informal, encouraging an exchange of thoughtful technical discussion by all attendees both during and after scheduled presentations. The purpose of this document is to help preserve the spirit and style of the symposium by outlining its objectives and its present mode of operation, and by establishing a steering committee to serve as an institutional memory, to assist the current organizers of the symposium in their duties, and guide the evolution of the symposium particulars. Organization The following functions should be filled: General Chair, Program Chair, Publication Chair, Publicity Chair, Finance Chair, Steering Committee, and Program Committee. It is envisioned that the current assignments of organizers may be split, combined, or otherwise reapportioned by the General Chair among an equal, greater, or smaller number of organizers to ensure a workable allocation of the organizational burden. Planning and IEEE coordination Soon after the symposium, the General Chair for the following year's symposium must plan for it by applying for IEEE Computer Society sponsorship and/or other institutional affiliations. The planning process includes establishing a location and date for the symposium, a schedule, and an estimated budget.'''
