["https://www.ieee-security.org/CFP/upcoming-conferences.html"]
title = ""
full_description = "NDSS 2025 Network and Distributed System Security Symposium and Workshops, San Diego, CA, USA, February 23-28, 2025. [posted here 6/3/24] The Network and Distributed System Security Symposium (NDSS) is a top venue that fosters information exchange among researchers and practitioners of network and distributed system security. The target audience includes everyone interested in practical aspects of network and distributed system security, with a focus on system design and implementation. A major goal is to encourage and enable the Internet community to apply, deploy, and advance the state of practical security technologies. This call solicits technical papers. Authors are encouraged to write the abstract and introduction of their paper in a way that makes the results accessible and compelling to a general security researcher. All submissions will be reviewed by the Program Committee and accepted submissions will be published by the Internet Society in the Proceedings of NDSS 2025. The Proceedings will be made freely accessible from the Internet Society web pages. Furthermore, permission to freely reproduce all or parts of papers for noncommercial purposes is granted provided that copies bear the Internet Society notice included on the first page of the paper. The authors are thus free to post the camera-ready versions of their papers on their personal pages and within their institutional repositories. Reproduction for commercial purposes is strictly prohibited and requires prior consent. For more information, please see https://www.ndss-symposium.org/ndss2025/submisions/call-for-papers/. USEC 2025 Symposium on Usable Security and Privacy, Co-located with NDSS Symposium 2025, San Diego, California, USA, February 24, 2025. [posted here 11/18/24] The Symposium on Usable Security and Privacy (USEC) invites submissions on all aspects of human factors and usability in the context of security and privacy. USEC ’25 aims to bring together researchers already engaged in this interdisciplinary effort with other researchers in relevant areas. We encourage economics, HCI, AI, theoretical computer science, cryptography, psychology, and business studies researchers and practitioners to submit original research in this area. We particularly encourage collaborative research from authors in multiple fields. To honor significant contributions that have had a lasting impact on the field, USEC ’25 will also feature a Test of Time Award. This award will celebrate research demonstrating enduring relevance and influence in usable security and privacy over the past 14 years of USEC. We will invite nominations for this award from the Organizing Committee, Program Committee, and authors submitting their works to USEC ’25. This recognition will honor research that continues to shape and inspire current and future investigations in the discipline. For more information, please see https://www.ndss-symposium.org/ndss2025/submissions/cfp-usec/."
