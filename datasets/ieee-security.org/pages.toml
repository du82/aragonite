["https://www.ieee-security.org/Calendar/submitting.html"]
title = "Submitting Calls-for-Papers to Cipher"
full_description = 'The Cipher calendar and CFP list are primarily for the use of researchers in the field of computer and network security who are looking for venues to publish original work. Thus, the great majority of the announcements are for academic events, and they are usually sponsored by a college, university, or professional society. Other types of conferences may be included at the discretion of the editor. Please be clear about how the proceedings will be published. In order to help academic researchers with their publications, the Cipher editors give the highest priority to events that have published, indexed, proceedings. Events that distribute proceedings only to attendees, or that publish only a few of the presented papers, or otherwise limit publication, may be included in the Calender, with a notation about the absence or limitation of proceedings, but not in the Call-for-Papers page. To have a conference considered for inclusion in the Cipher calendar and Calls-for-Papers, submit a plain text version of the CFP to cipher-cfp @ ieee-security.org . (See information about email failures.) A URL, instead of ascii text, is acceptable if the web page has all the essential information available as ascii text that can be "selected" using a window system interface. If the date or place or other information is in an embedded graphic, it may delay processing of the CFP indefinitely. A third option, for HTML experts, is to submit HTML for a calendar and CFP entry in the exact HTML format used in compiled listings; use "view source" in a browser to see the format of calendar and CFP pages. Use this option only if you have extensive experience editing HTML source files. If your email to cipher-cfp contains a disclaimer such as "the contents of this message are confidential" or "Copyright", then your announcement will not be posted. Please be aware of the policy used by the institution that hosts your email account, and if they automatically attach such disclaimers, you will need to send the announcement from a different account.'
