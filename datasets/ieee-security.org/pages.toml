["https://www.ieee-security.org/Cipher/SubscribeInfo.html"]
title = "IEEE Cipher:  Information for Subscribers and Contributors"
description = """
IEEE Cipher:  Information for Subscribers and    Contributors"""
full_description = '''To receive the full ASCII CIPHER issues as e-mail, send e-mail to cipher-admin@ieee-security.org (which is NOT automated) with subject line "subscribe". To receive a short e-mail note announcing when a new issue of CIPHER is available for Web browsing send e-mail to cipher-admin@ieee-security.org (which is NOT automated) with subject line "subscribe postcard". To remove yourself from the subscription list, send e-mail to cipher-admin@ieee-security.org with subject line "unsubscribe". Those with access to hypertext browsers may prefer to read Cipher that way. It can be found at http:www.ieee-security.org/cipher.html. Another method of administering subscription information is to use the mailing list web interface; you can subscribe and unsubscribe through it. Periodic automated mailings will remind you of your password, which you can use to manage details of the account. (If you are subscribed to the "cipher-postcard" list, or wish to subscribe to it, use this web address). Contributions to cipher@ieee-security.org are invited. Cipher is a NEWSletter, not a bulletin board or forum. It has a fixed set of departments, defined by the Table of Contents. Please indicate in the subject line for which department your contribution is intended. For Calendar entries, please include a URL and/or e-mail address for the point-of-contact. For Calls for Papers, please submit a one paragraph summary to cipher-cfp@ieee-security.org. See this and past issues for examples. ALL CONTRIBUTIONS CONSIDERED AS PERSONAL COMMENTS; USUAL DISCLAIMERS APPLY. All reuses of Cipher material should respect stated copyright notices, and should cite the sources explicitly; as a courtesy, publications using Cipher material should obtain permission from the contributors. 2. You are writing for the readers of a NEWSletter. Think of yourself as a member of the audience -- if you weren't able to be at the meeting what would you like to know about it from a friend who attended? Put the most important things first and be brief. Write in the active voice. See Strunk & White for additional advice on writing style. Look at past Cipher issues for examples.'''
