["https://www.ieee-security.org/CFP/Cipher-Call-for-Papers.html"]
title = "Cipher Call-for-papers"
full_description = "Note: Please send new calls to cipher-cfp@ieee-security.org and take a moment to read the submission guidelines. And please see the Cipher Calendar for events sorted in date order. For all other questions, please contact cipher-cfp@ieee-security.org by email. Elsevier Online Social Networks and Media Journal (OSNEM), Special issue on Disinformation, toxicity, harms in Online Social Networks and Media. (Submission Due 31 March 2025) [posted here 1/20/25] Guest Editors: Marco Conti (IIT-CNR, Italy), Andrea Passarella (IIT-CNR, Italy), and Arkaitz Zubiaga (Queen Mary University of London, UK) Online Social Networks and Media have revolutionized society, and are now a key part of how most people work, live, socialize, find information and entertain themselves. But whilst they have generated huge benefits, leading to unprecedented connectivity across the globe, online social networks have also enabled the spread of hazardous and dangerous behaviours. Chiefly, this is generated by disinformation campaign and fake news, generation and spread of toxic content, deliberate or unconscious generation and spreading of harmful content. Generative AI is exponentially exacerbating the diffusion of toxic content, while, quite interestingly, not being equally used to counteract harmful behaviours. On the other hand, content moderation techniques are emerging, aiming at providing practical tools to fight against online harms driven by toxic content. This special issue seeks high-quality scientific articles which examine, via a data-driven approach, the emergence of harmful behaviours in OSNEM, as well as tools and methods to fight against them. We particularly encourage papers which focus on online hate, misinformation, disinformation, toxic content. Data-driven approaches, supported by existing or new publicly available datasets, are strongly encouraged. For more information, please see https://www.sciencedirect.com/journal/online-social-networks-and-media. DFRWS-USA 2025 25th Annual Digital Forensics Research Conference, Chicago, Illinois, USA, July 22-25, 2025. (Submission Due 31 January 2025) [posted here 11/4/24] DFRWS conferences feature thought provoking Keynote Speakers, hands-on workshops, cutting edge research papers, presentations, panel discussions, demonstrations and poster sessions accompanied by a full schedule of social events including a Welcome Reception, the DFRWS Digital Forensics Rodeo and an expedition. All presentations take place in-person but virtual registrations will be available for those who are not able to attend the conference in person but wish to participate in this historic event. FULL RESEARCH PAPERS undergo double-blinded peer review, and the proceedings are published by Elsevier as a special issue of the Journal of Forensic Science International: Digital Investigation. We ask to submit articles according to the submission instructions. Systematization of Knowledge (SoK) Papers: As this marks the 25th occurrence of the conference, a substantial body of knowledge has been published through this platform over the years. Therefore, starting from this year, we solicit Systematization of Knowledge (SoK) papers that systematize, contextualize and evaluate existing knowledge of digital forensics. A suitable SoK paper needs to provide unique insights, such as a new viewpoint, a comprehensive taxonomy, and new evidence in supporting or challenging long-held beliefs. A survey paper without such insights is not appropriate and may be rejected without full review. A SoK paper submission needs to have the prefix �SoK: � in the title, and select the checkbox in the submission form. Accepted SoK papers will be presented at the conference and included in the proceedings. For more information, please see https://dfrws.org/conferences/dfrws-usa-2025/."
