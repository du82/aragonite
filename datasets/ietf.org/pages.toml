full_description = "About Groups IETF Trust The IETF Trust was created to acquire, hold, and maintain intellectual property and other property used in connection with Internet standards. The IETF Trust was created by the Internet Society and the Corporation for National Research Initiatives as settlors, the Internet Engineering Task Force and the Initial Trustees on December 15, 2005.The purposes of the trust include the advancement of educational and public interest by acquiring, holding, maintaining and licensing certain existing and future intellectual property and other property used in connection with the Internet standards process and its administration, for the advancement of the science and technology associated with the Internet and related technology.More information is available at the IETF Trust website. Groups Internet Engineering Steering Group Internet Architecture Board Internet Research Task Force Nominating Committee IETF Trust Affiliate Groups Independent Submissions Editor RFC Editor"
