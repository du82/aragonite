["https://ietf.org/blog/ietf-administration-llc-2023-budget"]
title = "IETF  | IETF Administration LLC 2023 Budget"
description = "The IETF Administration LLC has finalised its 2023 budget following a community consultation."
full_description = "IETF News Blog listing IETF email service issues resolved as of 4 March 2025 The IETF email processing system delays reported on 3 March 2025 have been resolved. All messages in the queue were delivered by 0700 UTC on 4 March and the system is now keeping up. Robert Sparks Senior Director of Information Technology 4 Mar 2027 IETF setting standards for AI preferences The newly-chartered AI Preferences (AIPREF) Working Group will work on standardizing building blocks that allow for the expression of preferences about how content is collected and processed for Artificial Intelligence (AI) models. Suresh Krishnan AIPREF Working Group Co-chair Mark Nottingham AIPREF Working Group Co-chair 27 Feb 2025 Suggested IETF 122 Sessions for Getting Familiar with New Topics These IETF 122 meeting sessions are likely to include discussions and proposals that are accessible to a broad range of Internet technologists whether they are new to the IETF or long-time participants. 21 Feb 2025 IETF email service transition completed on 24 February The IETF email processing infrastructure transition planned for 0900-1100 UTC on 24 February has been completed. Robert Sparks Senior Director of Information Technology 14 Feb 2025 New Participant Program Registration now open for IETF 122 Bangkok We are happy to announce that registration is now open for the first edition of an expanded New Participants Program during the IETF 122 Bangkok meeting! Michelle Cotton IETF New Participant Ambassador 7 Feb 2025 Show all Show filters Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter IETF Administration LLC 2023 Budget Jay Daley IETF Executive Director 20 Mar 2023 The IETF Administration LLC has finalised its 2023 budget following a community consultation. (While our budget was published in line with our normal schedule, this explanatory post blog should have been published at the same time but was unintentionally delayed, for which we apologise.)In developing its budget the LLC continues to give careful consideration to each budget request as well as the needs of the community as a whole. The IETF Administration LLC 2023 Budget has now been finalised and approved by the LLC Board. It contains the following sections:BudgetMeeting BudgetChart of Accounts Key AssumptionsISOC contribution as per our agreementAll meetings will go ahead with the same fee structure and with lower levels of onsite registration than pre-COVID. The fee structure will be reviewed during the yearFundraising will meet the targets set out two years ago.All strategic retreats etc will go ahead. Air travel costs will be at 50% above pre-COVID levels.Investments increase 10% over the year, as confirmed with our investment advisors7.5% inflation reflected in staff and some admin costs Summary Summary of IETF LLC 2023 budget 2023 Budget 2022 Budget Variance Non-Meeting Revenue $ 10,264,250 $ 9,074,098 $ 1,190,152 Meeting Revenue $ 3,685,791 $ 3,934,315 $ (248,524) TOTAL REVENUE $ 13,950,041 $ 13,008,413 $ 941,629 Operating Expenses $ 6,353,650 $ 5,692,400 $ 661,250 Meeting Expenses $ 4,933,815 $ 4,287,606 $ 646,208 TOTAL EXPENSES $ 11,287,465 $ 9,980,007 $ 1,307,458 NET INCOME $ 2,662,577 $ 3,028,406 $ (365,829) Capital Expenditure $ 752,400 $ 573,039 $ 179,361 NET INCOME AFTER CAPITAL $ 1,910,177 $ 2,455,367 $ (545,190) Key Changes from 2022 BudgetBudget changes:FundraisingThe budget for ISOC matched funds is $0.5m lower than previously budgeted due to lower than projected fundraising in 2022.Meetings:For the 2022 budget we estimated a faster growth in numbers than we saw in the end and so for 2023 we are being more conservative with our predictions.Assumes onsite childcare for all meetings.Fee waivers are now budgeted as an expense, which are offset by sponsorship. Previously these were not accounted for.Administration:Inflationary increase in all wages. Additional 0.5 FTE role for Secretariat to handle the increased meeting administration as we take over functions previously handled by meeting hosts that they were unwilling to continue with.Community leadershipNew project budgets for and Outreach Program and a Diversity Program that will be coordinated through EMODIR.New IETF Trust budget, totalling $311k.Tools:Robert Sparks is now on the staff but his costs are still shown in the Tools section. Despite the outlook we are stepping up our tools investment to get through a range of key projects in 2023, with the expectation that this will continue in 2024 and then drop off.Included $50k for implementing new RFC Editor website and $50k for user experience research.Presentation changes:Some meeting expenses are now split out by the nature of the sponsorship that pays for them, to better show how we spend this money.Added a ‘Host recharge’ line for such things as t-shirt and social event expenditure no. ReservesOur reserves are invested with one fund manager in four separate portfolios, each with a different risk and investment profile. These portfolios and their value as of 31 December 2022 are as follows:Continuity and Operations $4,797,313Board Designated Reserve $9,663,027Restricted Endowment $3,709,578Business Opportunities $500,590Our plan to produce full reserve forecasts for this budget (FY 2023) have been delayed due to the late introduction of a new financial system and the extreme volatility of the current investment market. Share this page PreviousIETF LLC Statement on Remote Meeting Participation NextNext steps towards a net zero IETF"
