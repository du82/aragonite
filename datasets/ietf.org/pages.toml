full_description = "IETF News Blog listing IETF email service issues resolved as of 4 March 2025 The IETF email processing system delays reported on 3 March 2025 have been resolved. All messages in the queue were delivered by 0700 UTC on 4 March and the system is now keeping up. Robert Sparks Senior Director of Information Technology 4 Mar 2027 IETF setting standards for AI preferences The newly-chartered AI Preferences (AIPREF) Working Group will work on standardizing building blocks that allow for the expression of preferences about how content is collected and processed for Artificial Intelligence (AI) models. Suresh Krishnan AIPREF Working Group Co-chair Mark Nottingham AIPREF Working Group Co-chair 27 Feb 2025 Suggested IETF 122 Sessions for Getting Familiar with New Topics These IETF 122 meeting sessions are likely to include discussions and proposals that are accessible to a broad range of Internet technologists whether they are new to the IETF or long-time participants. 21 Feb 2025 IETF email service transition completed on 24 February The IETF email processing infrastructure transition planned for 0900-1100 UTC on 24 February has been completed. Robert Sparks Senior Director of Information Technology 14 Feb 2025 New Participant Program Registration now open for IETF 122 Bangkok We are happy to announce that registration is now open for the first edition of an expanded New Participants Program during the IETF 122 Bangkok meeting! Michelle Cotton IETF New Participant Ambassador 7 Feb 2025 Show all Show filters Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter IETF 2022 Draft Budget Jay Daley IETF Executive Director 1 Nov 2021 The IETF Administration LLC has prepared its draft budget for 2022 and now seeks community feedback. The IETF LLC 2022 Draft Budget contains the following sections:BudgetMeetings budgetChart of accountsKey assumptionsInternet Society contribution as per our agreementIETF 113 will go ahead with 650 onsite participants, IETF 114 and IETF 115 will go ahead as in-person meetings with 1000 participants. All meetings will have a fee for remote participants.All strategic retreats etc will go ahead.Air travel costs will be at 50% above pre-COVID levels.The RFC Editor Future Program will conclude as expected and an RCSE will be appointedInvestments increase 5% over the year (up from 4% in 2021)4% inflation reflected in staff and some admin costs (up from 2% in 2021) Summary 2022 Draft Budget 2021 Budget Variance Non-Meeting Revenue $ 8,574,098 $7,489,940 $ 1,084,158 Meeting Revenue $ 3,926,815 $ 3,104,437 $ 822,378 TOTAL REVENUE $ 12,500,913 $ 10,594,377 $ 1,906,536 Operating Expenses $ 5,618,552 $ 5,642,035 $ (23,483) Meeting Expenses $ 3,351,387 $ 3,347,792 $ 3,595 TOTAL EXPENSES $ 8,969,939 $ 8,989,827 $ (19,888) NET INCOME $ 3,530,973 $ 1,604,550 $ 1,926,423 Capital Expenditure $ 561,714 $ 585,000 $ 424,500 NET INCOME AFTER CAPITAL $ 2,969,260 $ 1,019,550 $ 1,949,710 Key changes from 2021Budget changesGeneralInflation has been applied at a rate of 4% while it currently stands in the US at 5.3%, in anticipation of Federal Reserve action to reduce it. FundraisingThe budget for fundraising for external funds into the endowment has been raised from $0.5m to $1m in line with the plan even though that may be premature.The budget for ISOC funds into the endowment is based on the 2021 budget of us raising $0.5m in 2021. Current donations are running approximately $250,000 lower than that and if that situation does not change then the budget for next year will need to be reduced by $500,000 to account for the loss of 2:1 match funds.Meetings:Assumes all three IETF meetings will go ahead in-person with reduced numberAssumes fee for remote participation paid by 250 people per meetingChildcare costs only for last two meetings in 2022Estimating much higher travel costs throughout 2022.Administration:Budget for Director of Development increased to provide for a CRM system and small events for potential donors..Inflation has been applied to a number of itemsCommunity leadershipNew budget for EMODIR Support, covering the development, production and distribution of materials (documentation, videos, and other collateral). This is more than offset by a reduction in the Comms budget.The IETF Trust budget has increased.RSE and RPCThe costs for the new RSCE have been added including recruitment costs.Tools:New contract for a project manager to plan a complete rewrite of RPC tools.New DBA services contract.Old contracts now removed.More accurate cost for new developers.Net increase in cost for Tools across both Opex and Capex of approximately $340,000.Presentation changesMajor changes to capex presentationSplit capex between Tools and OtherIncluded a negative capitalisation adjustment line under tools opex to forecast the tools expense that is capitalised at the end of the year. This also allows for a reader to correctly estimate total tools expenditure.Tools tab simplified to show capex/opex split for each line.Split LLC staff costs between Administration and Tools to correctly show tools spend.Travel page tidied up to reduce hard coded valuesNew EMODIR Support line under Community LeadershipReservesOur reserves are invested with one fund manager in four separate portfolios, each with a different risk and investment profile. These portfolios and their value as of 31 August 2021 are Continuity and Operations $5,366.968Board Designated Reserve $10,852,743Restricted Endowment $3,876,686Business Opportunities $563,453We are planning to produce full reserve forecasts for our next budget (FY 2023) following the introduction of a new financial system in 2022 that will significantly improve our operational forecasting and therefore the level of any surplus that may be safely added to reserves while leaving sufficient cash at hand. Community feedbackCommunity feedback on the budget is welcome and should be made either directly to the IETF Executive Director at exec-director@ietf.org, who can also answer any questions, or to the administration discussion list admin-discuss@ietf.org. Please provide any feedback before November 29th 2021. Share this page PreviousApplied Networking Research Prize presentations at IETF 112 NextConclusion of the IASA2 Retrospective"
