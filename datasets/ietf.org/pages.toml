title = "IETF  | Independent Submissions Editor"
description = "The Independent Submissions Editor manages the Independent Submissions Stream."
full_description = "About Groups Independent Submissions Editor The Independent Submissions Editor manages the Independent Submissions Stream. The Independent Submissions Stream, defined in RFC 4846, publishes RFCs that are outside the official processes of the IETF, IAB, and IRTF but are relevant to the Internet community and achieve reasonable levels of technical and editorial quality.The Independent Submissions Editor (ISE) is the individual responsible for the Independent Submission stream. The ISE is appointed by the IAB through an open process, and is responsible directly to the IAB. The responsibilities and required qualifications for the ISE are defined in RFC 8730, as updated by RFC 9280.The ISE is currently Eliot Lear, who can be reached at rfc-ise@rfc-editor.org.The ISE is supported by the Independent Submissions Editorial Board (ISEB). Groups Internet Engineering Steering Group Internet Architecture Board Internet Research Task Force Nominating Committee IETF Trust Affiliate Groups Independent Submissions Editor RFC Editor"
