["https://ietf.org/blog/wimse-working-group"]
title = "IETF  | WIMSE Working Group: Serious business for cloud computing"
description = "Chartered in March 2024, the IETF Workload Identity in Multi System Environments (WIMSE) working group aims to address challenges of implementing fine-grained access control across platforms in the public and private clouds, which is increasingly importan"
full_description = "IETF News Blog listing IETF email service issues resolved as of 4 March 2025 The IETF email processing system delays reported on 3 March 2025 have been resolved. All messages in the queue were delivered by 0700 UTC on 4 March and the system is now keeping up. Robert Sparks Senior Director of Information Technology 4 Mar 2027 IETF setting standards for AI preferences The newly-chartered AI Preferences (AIPREF) Working Group will work on standardizing building blocks that allow for the expression of preferences about how content is collected and processed for Artificial Intelligence (AI) models. Suresh Krishnan AIPREF Working Group Co-chair Mark Nottingham AIPREF Working Group Co-chair 27 Feb 2025 Suggested IETF 122 Sessions for Getting Familiar with New Topics These IETF 122 meeting sessions are likely to include discussions and proposals that are accessible to a broad range of Internet technologists whether they are new to the IETF or long-time participants. 21 Feb 2025 IETF email service transition completed on 24 February The IETF email processing infrastructure transition planned for 0900-1100 UTC on 24 February has been completed. Robert Sparks Senior Director of Information Technology 14 Feb 2025 New Participant Program Registration now open for IETF 122 Bangkok We are happy to announce that registration is now open for the first edition of an expanded New Participants Program during the IETF 122 Bangkok meeting! Michelle Cotton IETF New Participant Ambassador 7 Feb 2025 Show all Show filters Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter WIMSE Working Group: Serious business for cloud computing Pieter Kasselman WIMSE Working Group Co-chair Justin Richer WIMSE Working Group Co-chair 15 Oct 2024 Chartered in March 2024, the IETF Workload Identity in Multi System Environments (WIMSE) working group aims to address challenges of implementing fine-grained access control across platforms in the public and private clouds, which is increasingly important to how complex software functions are built and deployed. The increasing prevalence of cloud computing and micro service architectures has led to the rise of complex software functions being built and deployed as workloads—instances of software executing for a specific purpose, across multiple service platforms. WIMSE focuses on the unique identity and access management aspects of workloads at runtime and their execution context, particularly focusing on the propagation, representation, and processing of workload identity. While several standards and open-source projects—such as OAuth, JWT, and SPIFFE—offer foundational elements for this work, there are no established standards on how to combine these standards, or any guidance on how to bridge the gaps between them. . This can lead to inconsistencies, interoperability issues, and potential security vulnerabilities.WIMSE formed from a Birds of a Feather session held during the IETF 118 meeting in Prague and first met as a working group during IETF 119 in Brisbane. Work has progressed rapidly since then and the group has already adopted three documents that identify, articulate, and bridge the gaps and ambiguities in multi-cloud workload identity deployments and define solutions that can be adopted across a diverse set of platforms and deployments. WIMSE is scheduled to meet during IETF 121 Dublin in November 2024.“WIMSE Service to Service Authentication“ defines authentication and authorization for software workloads in a variety of runtime environments, from the most basic ones up to complex multi-service, multi-cloud, multi-tenant deployments. This document defines the simplest, atomic unit of this architecture: the protocol between two workloads that need to verify each other's identity in order to communicate securely.“Workload Identity in a Multi System Environment (WIMSE) Architecture“ discusses an architecture for designing and standardizing protocols and payloads for conveying workload identity and security context information. “Best Current Practice for OAuth 2.0 Client Authentication in Workload Environments” describes the current best practices to avoid client_secret provisioning and leverage platform attestation to receive access tokens from an OAuth 2.0 authorization server via RFC 7523. Work is ongoing…. If you are interested in working on these issues and contributing ideas and solutions, please sign up for the mailing list and plan to attend the session during IETF 121. Share this page PreviousMeet the IETF Secretariat NextSuggested IETF 121 Sessions for Getting Familiar with New Topics"
