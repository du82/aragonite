["https://ietf.org/administration/reports/iana-annual-audits"]
title = "IETF  | IANA Annual Audits"
description = "A third-party review is conducted annually on the performance of the IANA functions to provide as assessment of the proper implementation of protocol parameter registries and the associated policies. This page provides summary statements about these reports."
full_description = "Administration Administrative reports IANA Annual Audits Annual Review of Protocol Parameters Processing A third-party review is conducted annually on the performance of the IANA functions to provide as assessment of the proper implementation of protocol parameter registries and the associated policies. The review is conducted pursuant to the annual supplemental agreement for the Memorandum of Understanding between IETF LLC and ICANN, and the report issued is reviewed by the IAB Chair, IETF Chair and IETF LLC Executive Director (or their designates), who then issue a summary statement posted below. Review of IANA Functions Confidential Audit Report - 2023On 22 February 2023, ICANN provided a copy of the confidential audit report of the IANA functions for the period covering 1 October 2021 through 30 September 2022. Individuals appointed by the IAB and the IETF LLC reviewed the confidential audit report on behalf of the IETF. Those individuals report that the audit found no exceptions in the processing of protocol parameter requests, which means that all spot-checked updates to the IANA protocol parameter registries were made in accordance with the policy for that registry.Review of IANA Functions Confidential Audit Report - 2022On 3 March 2022, ICANN provided a copy of the confidential audit report of the IANA functions for the period covering 1 October 2020 through 30 September 2021. Individuals appointed by the IAB and the IETF LLC reviewed the confidential audit report on behalf of the IETF. Those individuals report that the audit found no exceptions in the processing of protocol parameter requests, which means that all spot-checked updates to the IANA protocol parameter registries were made in accordance with the policy for that registry.Review of IANA Functions Confidential Audit Report - 2021On 1 February 2021, ICANN provided a copy of the confidential audit report of the IANA functions for the period covering 1 October 2019 through 30 September 2020. Individuals appointed by the IAB and the IETF LLC reviewed the confidential audit report on behalf of the IETF. Those individuals report that the audit found no exceptions in the processing of protocol parameter requests, which means that all spot-checked updates to the IANA protocol parameter registries were made in accordance with the policy for that registry.Review of IANA Functions Confidential Audit Report - 2020On 27 January 2020, ICANN provided a copy of the confidential audit report of the IANA functions for the period covering 1 October 2018 through 30 September 2019. Individuals appointed by the IAB and the IETF LLC reviewed the confidential audit report on behalf of the IETF. Those individuals report that the audit found no exceptions in the processing of protocol parameter requests, which means that all spot-checked updates to the IANA protocol parameter registries were made in accordance with the policy for that registry.Review of IANA Functions Confidential Audit Report – 2019On 30 January 2019, ICANN provided a copy of the confidential audit report of the IANA functions for the period covering 1 October 2017 through 30 September 2018. Individuals appointed by the IAB and the IAOC reviewed the confidential audit report on behalf of the IETF. Those individuals report that the audit found no exceptions in the processing of protocol parameter requests, which means that all spot-checked updates to the IANA protocol parameter registries were made in accordance with the policy for that registry.Review of IANA Functions Confidential Audit Report – 2018On 22 January 2018, ICANN provided a copy of the confidential audit report of the IANA functions for the period covering 1 October 2016 through 30 September 2017. Individuals appointed by the IAB and the IAOC reviewed the confidential audit report on behalf of the IETF. Those individuals report that the audit found no exceptions in the processing of protocol parameter requests, which means that all spot-checked updates to the IANA protocol parameter registries were made in accordance with the policy for that registry.Review of IANA Functions Confidential Audit Report – 2017On 14 March 2017, ICANN provided a copy of the confidential audit report of the IANA functions for the period covering 1 December 2015 to 30 September 2016. Individuals appointed by the IAB and the IAOC reviewed the confidential audit report on behalf of the IETF. Those individuals report that the audit found no exceptions in the processing of protocol parameter requests, which means that all spot-checked updates to the IANA protocol parameter registries were made in accordance with the policy for that registry.IPROC Review of the IANA Functions Confidential Audit Report – 2016On 25 March 2016, ICANN provided a copy of the confidential audit report that of the IANA functions for the period covering 1 December 2014 to 30 November 2015. The IPROC reviewed the confidential audit report on behalf of the IETF. The IPROC reports that the audit found no exceptions, which means that all spot-checked updates to the IANA protocol parameter registries were made in accordance with the policy for that registry.IPROC Review of the IANA Functions Confidential Audit Report – 2015On 1 April 2015, ICANN provided a copy of the confidential audit report that of the IANA functions for the period covering 1 December 2013 to 30 November 2014. The IPROC reviewed the confidential audit report on behalf of the IETF. The IPROC reports that the audit found no exceptions, which means that all spot-checked updates to the IANA protocol parameter registries were made in accordance with the policy for that registry. Administrative reports"
