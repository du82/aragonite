full_description = "Administration Legal requests We regularly responds to requests for information including subpoenas. As part of our commitment to transparency, we publish all of these request and our response below. To find out more about legal requests to the IETF and how to make one, see Legal Request Procedures. For legal requests prior to the formation of the IETF LLC in 2018, please refer to the IAOC archives. 2025JanuaryFlexiworld Technologies, Inc. v. Amazon.com, Inc., Amazon.com Services, Inc., Amazon Web Services, Inc., Case No.: 2:21-cv-01055-DGE (W.D. Wash. June 22, 2020) | RFC Editor DeclarationSamsung Electronics Co., Ltd; Samsung Electronics America, Inc.; and Four Batons Wireless, LLC | IETF Secretariat Declaration2024DecemberFlexiworld Technologies, Inc. v. Amazon.com, Inc., et al. | RFC EditorInternational Business Machines Corporation v. Croga Innovations Ltd. | RFC EditorInternational Business Machines Corporation v. Croga Innovations Ltd. | RFC EditorNovemberCroga Innovations Ltd. v. Cisco Systems, Inc. | RFC EditorConcurrent Ventures, LLC and XtreamEdge, Inc. v. Advanced Micro Devices, Inc. and Pensando Systems, Inc., W.D. Texas | RFC EditorOctoberIEIT Systems Co., Ltd. v. Hewlett Packard Enterprise Co. | RFC EditorSeptemberPortsmouth Network Corp. v. Cisco Systems, Inc. | RFC EditorPortsmouth Network Corp. v. Cisco Systems, Inc. | IETF SecretariatInter partes review (IPR) before the United States Patent and Trademark Office | IETF SecretariatMaySNMP Research Inc. et al. v. Broadcom Inc. et al. | RFC EditorSNMP Research Inc. et al. v. Broadcom Inc. et al. | IETF SecretariatNetsocket Inc. v. Cisco Systems, Inc. | RFC EditorMarchUSPTO PTAB Inter Partes Review | RFC EditorJanuaryMonarch Networking Solutions LLC v. Juniper Networks, Inc. | IETF SecretariatMonarch Networking Solutions LLC v. Juniper Networks, Inc. | IETF SecretariatRequest for information from Kirkland & Ellis LLP | RFC EditorRequest for information from Kirkland & Ellis LLP | RF