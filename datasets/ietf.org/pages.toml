full_description = '''IETF News Blog listing IETF email service issues resolved as of 4 March 2025 The IETF email processing system delays reported on 3 March 2025 have been resolved. All messages in the queue were delivered by 0700 UTC on 4 March and the system is now keeping up. Robert Sparks Senior Director of Information Technology 4 Mar 2027 IETF setting standards for AI preferences The newly-chartered AI Preferences (AIPREF) Working Group will work on standardizing building blocks that allow for the expression of preferences about how content is collected and processed for Artificial Intelligence (AI) models. Suresh Krishnan AIPREF Working Group Co-chair Mark Nottingham AIPREF Working Group Co-chair 27 Feb 2025 Suggested IETF 122 Sessions for Getting Familiar with New Topics These IETF 122 meeting sessions are likely to include discussions and proposals that are accessible to a broad range of Internet technologists whether they are new to the IETF or long-time participants. 21 Feb 2025 IETF email service transition completed on 24 February The IETF email processing infrastructure transition planned for 0900-1100 UTC on 24 February has been completed. Robert Sparks Senior Director of Information Technology 14 Feb 2025 New Participant Program Registration now open for IETF 122 Bangkok We are happy to announce that registration is now open for the first edition of an expanded New Participants Program during the IETF 122 Bangkok meeting! Michelle Cotton IETF New Participant Ambassador 7 Feb 2025 Show all Show filters Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter IETF 121 post-meeting survey Jay Daley IETF Executive Director 25 Nov 2024 IETF 121 Dublin was held 2-8 November 2024 The results of the IETF 121 Dublin post-meeting survey are now available on a interactive dashboard. Thank you to all of you who responded to this survey as we use your views to continually adjust the meeting experience. AnalysisWe received 225 responses, 206 onsite and 19 remote. With 1592 registered participants, this gives the survey a maximum margin of error of +/- 6.06%. The number of remote respondents was much lower than previous surveys and the margin of error for that segment is +/-22.14%, so any results specific to remote participants are unreliable.The results for satisfaction questions include a mean and standard deviation using a five point scale scoring system of Very satisfied = 5, Satisfied = 4, Neither satisfied nor dissatisfied = 3, Dissatisfied = 2, Very dissatisfied = 1. While there’s no hard and fast rule, a mean of above 4.50 is sometimes considered excellent, 4.00 to 4.49 is good, 3.50 to 3.99 is acceptable and below 3.50 is either poor or very poor if below 3.00. The satisfaction score tables also include a top box, the total of satisfied and very satisfied, and a bottom box, the total of dissatisfied and very dissatisfied, both in percentages. Please note that a small number of questions are on a four point scale.Question changes since the last surveyFor this survey we introduced a new matrix question about remote participation and added new lines to existing questions about the lunch break time of 11:30am, realtime transcripts and games night. As there was no social event, we again dropped the question about opportunities for social interaction.As a one-off, we had a set of questions about the alldispatch experiment, which concluded at this meeting.Actions taken following the last surveyFor this meeting, we made the following changes, prompted by survey feedback:As this meeting was in a conference centre and we regularly get feedback that this reduces opportunities for socialising and ad-hoc interactions, we arranged for the break refreshments to be in one room instead of split across floors, and supplied a bar two nights of the week on premises.SatisfactionOverall satisfaction is 4.30, a good result. With some key exceptions, the satisfaction scores remain high.The table below shows the satisfaction scores for the last six meetings, along with colour coded indicators for the five point scale above: excellent (🔵), good (🟢), acceptable (🟡), poor (🔴), very poor (⚫️) Satisfaction scores for the last six meetings IETF 121 Dublin IETF 120 Vancouver IETF 119 Brisbane IETF 118 Prague IETF 117 San Francisco IETF 116 Yokohama Overall satisfaction 4.30 🟢 4.37 🟢 4.24 🟢 4.42 🟢 4.30 🟢 4.30 🟢 AGENDA Overall agenda 4.21 🟢 4.19 🟢 4.05 🟢 4.20 🟢 4.16 🟢 4.18 🟢 Sessions for WGs 4.42 🟢 4.29 🟢 - 4.32 🟢 4.22 🟢 4.22 🟢 BOFs 4.33 🟢 4.12 🟢 - 4.12 🟢 3.95 🟡 4.11 🟢 Sessions for RGs 4.22 🟢 4.20 🟢 - 4.09 🟢 4.12 🟢 4.14 🟢 Plenary 4.25 🟢 3.84 🟡 - 3.94 🟡 3.99 🟡 3.98 🟡 Side meetings 3.91 🟡 3.87 🟡 - 3.79 🟡 3.75 🟡 3.73 🟡 Hackathon 4.32 🟢 4.30 🟢 - 4.27 🟢 4.25 🟢 4.34 🟢 HotRFC 4.13 🟢 3.94 🟡 - 3.90 🟡 3.89 🟡 3.84 🟡 Pecha Kucha 4.08 🟢 - - 4.00 🟢 4.15 🟢 - Office hours 4.27 🟢 3.97 🟡 - 4.07 🟢 3.98 🟡 4.23 🟢 Opportunities for social interaction - - - 4.06 🟢 4.11 🟢 3.72 🟡 STRUCTURE Overall meeting structure 4.31 🟢 4.28 🟢 4.15 🟢 4.34 🟢 4.28 🟢 4.28 🟢 Start time 4.40 🟢 4.40 🟢 - 4.49 🟢 (9:30am) 4.28 🟢 (9:30am) 4.16 🟢 (9:30am) Finish at 5pm Friday 3.63 🟡 3.67 🟡 - 3.65 🟡 - - Lunch break timing 3.91 🟡 (11:30am) - - - - - Length of day 4.11 🟢 4.18 🟢 - 4.20 🟢 4.30 🟢 4.30 🟢 Number of days 4.13 🟢 (5+2) 4.15 🟢 (5+2) - 4.18 🟢 (5+2) 4.27 🟢 (5+2) 4.30 🟢 (5+2) Session lengths 4.36 🟢 (60 / 90 / 120) 4.36 🟢 (60 / 90 / 120) - 4.38 🟢 (60 / 90 / 120) 4.41 🟢 (60 / 90 / 120) 4.36 🟢 (60 / 90 / 120) Break lengths 4.31 🟢 (30/90) 4.31 🟢 (30/90) - 4.38 🟢 (30/90) 4.32 🟢 (30/90) 4.38 🟢 (30/90) Number of parallel tracks 4.06 🟢 (8) 3.94 🟡 (8) - 3.94 🟡 (8) 4.08 🟢 (8) 4.01 🟢 (8) CONFLICTS Conflict avoidance 4.05 🟢 3.93 🟡 3.88 🟡 4.00 🟢 3.90 🟡 3.94 🟡 VENUE & ACCOMM Options for accommodation 3.71 🟡 3.68 🟡 4.10 🟢 ONSITE Overall 4.19 🟢 4.44 🟢 4.37 🟢 4.50 🔵 4.29 🟢 - Badge collection 4.65 🔵 4.73 🔵 4.71 🔵 4.70 🔵 4.69 🔵 - WiFi 4.37 🟢 4.25 🟢 4.09 🟢 4.17 🟢 3.98 🟡 4.06 🟢 Realtime transcripts 4.08 🟢 - - - - - QR Codes 4.17 🟢 4.31 🟢 4.31 🟢 4.18 🟢 4.11 🟢 - Break F&B 2.88 ⚫️ 4.15 🟢 3.75 🟡 4.05 🟢 4.44 🟢 - Breakout seating 3.43 🔴 3.54 🟡 3.93 🟡 3.80 🟡 4.08 🟢 - Signage 4.14 🟢 4.08 🟢 3.96 🟡 4.15 🟢 4.22 🟢 - Coffee carts 4.31 🟢 4.65 🔵 4.08 🟢 4.64 🔵 4.56 🔵 - Childcare 4.50 🔵 4.43 🟢 3.76 🟡 4.12 🟢 4.06 🟢 - Games night 4.15 🟢 - - - - - Welcome reception 4.05 🟢 4.01 🟢 3.97 🟡 4.08 🟢 - - Farewell reception 4.29 🟢 4.31 🟢 4.15 🟢 4.34 🟢 - - REMOTE Overall - - - - - - Sound quality 4.53 🔵 - - - - - Video feed 4.42 🟢 - - - - - Onsite respect of remote 4.47 🟢 - - - - - Queue management 4.61 🔵 - - - - - Remote participationWe once again asked people why they participated remotely and asked if those who participated remotely would have wanted to participate onsite.Putting the two together continues to show a consistent proportion of remote participants would have participated onsite but were unable to do so because they did not have the funding.However, remote participation itself gets high satisfaction scores for the various components (an overall satisfaction question was accidentally omitted). Sources of fundingFor the second time asked the question "What was the primary source of funding for your onsite participation?", with the overwhelming majority (72.65%) funded by their employer, and the next highest segment (10.76%) using their own personal funds. New participantsWe regularly include a set of questions for those who identify themselves as new participants and these have been used to drive large changes to the new participant program over the last two years. We will provide a more detailed analysis of the results of these questions in a future blog post. Areas for improvementBreak food and beverageThe satisfaction score this time around (2.88) is Very Poor and by far the worst score we've had for any area of the experience under our direct control. I can only apologise and pledge that we will ensure that the various issues we experienced this time are not repeated.Breakout seatingOnce again we were constrained by venue health and safety rules from providing the level of seating people want near to the breakout rooms. This is one of the last venues that was negotiated without an extra seating clause so we expect this to become less of an issue for future meetings.Welcome receptionWe've now had a Farewell Reception for three meetings and that has had a consistently higher satisfaction score than the Welcome Reception, indicating that the Welcome Reception could be improved. We welcome any suggestions on what it is lacking and how it could be improved.Opportunities for social interactionWe are in a global economic environment where meeting hosts have budgetary constraints that mean they cannot fund a social event and our efforts to address this, avoiding a significant increasing in expenditure, have been so far limited to the introduction of a game night. This is another area where we welcome suggestions - should we do something to help people meet up for dinner, recommend local events, or something else?Side meetingsWhile the larger issue of side meetings remains problematic, one consistent request has been for better support for them on the meeting agenda. The reluctance to do this in the past has been that this would imply they are an official part of the agenda, but we will look to see if there is a way to do this that clearly addresses their status.Areas we might not be able to improveConference centresWhen we meet in conference centres we regularly receive very divided feedback (across in-person and the survey) with some strongly in favour and some strongly against. Our policy is to prefer a one-roof approach, but there are multiple countries/cities we will only be able to meet in if we meet in a conference centre and so we will continue to switch between the two.Cost of accommodationOver the last several years the accommodation market has changed significantly with the advent of short-term rental aggregators, and hotel booking aggregators. As seen in this survey, participants are choosing accommodation from a wide range of options and are distributed across the city. Before this change, we used to contract a lower rate secondary hotel but reach the stage where this booking was underused and risked us paying contractual penalties, and so we stopped.We do, on occasion, book a meeting in a city that is less of a travel hub or less of a destination than others and so has lower cost accommodation across the board, but in those cases we often receive feedback that the extra travel hop was too much or that sponsors are less interested in supporting such a meeting.Conflict avoidanceAs noted previously it is likely that we are simply not able to do any better given the number of sessions and the limited days in which we can meet. The IESG has made the Friday afternoon experiment a permanent feature in order to help with this, but that in turn has brought multiple complaints and a lower satisfaction score than other aspects of the meeting.Cost of registrationThe IETF is a charity that relies on donations, sponsors and registration fees, and so has to set those fees high enough to keep operating. This is offset by this being the only part of the IETF where there is a participation cost, and by the high quality remote participation and unlimited remote fee waivers. To address concerns, we are talking to sponsors about a formal grant program, but in the current economic climate this is not progressing quickly. Individual commentsThe individual comments covered a number of key themes, most of which have already been covered above, leaving the following:Coffee queue. This venue was booked before we introduced barista coffee and when it came to arranging it, they would only allow it if we paid a high fee, and so we were unable to have the same coverage as at previous meetings.Cut short farewell reception. This is still a new event that is subject to change. We will consider how to address this feedback.Other comments. Other comments will be passed on to the appropriate people to consider. And finallyThank you everyone who responded to this survey, your feedback is much appreciated. Share this page PreviousThe new GREEN working group gets ready for an energy efficient Internet NextExtended Protocol Provisioning Tutorial from IETF 121'''
