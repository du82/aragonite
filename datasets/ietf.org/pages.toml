full_description = "Administration Financial statements The IETF Administration LLC publishes monthly statements, meeting statements, annual budgets, and other documents to provide visibility into its financial structure and to keep the IETF community informed about its work. Annual budgets and chart of accountsIETF LLC 2025 Budget, Meetings Budget, Chart of Accounts, Budget NarrativeIETF LLC 2024 Budget, Meetings Budget, Chart of Accounts, Budget NarrativeIETF LLC 2023 Budget, Chart of Accounts, Budget NarrativeIETF LLC 2022 Budget, Chart of Accounts, Budget NarrativeIETF LLC 2021 Budget, Chart of Accounts, Budget NarrativeIETF LLC 2020 Budget Reforecast, Chart of Accounts, Budget Reforecast NarrativeIETF LLC 2020 Budget, Chart of Accounts, Budget NarrativeIETF LLC 2019 Budget, Chart of Accounts Audited Financial Reports2023 Audited Financial Report2022 Audited Financial Report2021 Audited Financial Report2020 Audited Financial Report2019 Audited Financial Report Form 990Form 990 is an annual reporting return that United States federally tax-exempt organizations must file with the United States Internal Revenue Service. It provides information on the filing organization’s mission, programs, and finances to ensure transparency and public interest of tax-exempt organization. Because the the IETF Administration LLC is covered by the Internet Society's 501(c)(3) registration, it is included in the ISOC Forms 990, which are reposted here. More information is available on the ISOC website.Form 990 2022Form 990 2021Form 990 2020Form 990 2019Form 990 2018 Monthly statements2024DecemberNovemberOctoberSeptemberAugustJulyJuneMayAprilMarchFebruaryJanuary2023DecemberNovemberOctoberSeptemberAugustJulyJuneMayAprilMarchFebruaryJanuary2022NOTE: From January 2022 the IETF LLC changed its financial statements from an accrual basis to a modified cash basis in order to provide more readable financial statements and to provide a truer picture of finances throughout the year. Meeting StatementsPlease note that it takes several months for all meeting-related expenses to be reconciled, so statements will not be posted immediately after the meeting occurred. Note: For IETF 107 through IETF 112, no meeting statements are available as these were fully online/virtual meetings. For IETF 113 and onwards, these are taking much longer to produce than expected due to issues with VAT reclaims.IETF 118 - PragueIETF 117 - San FranciscoIETF 116 - YokohamaIETF 115 - LondonIETF 114 - PhiladelphiaIETF 113 - ViennaIETF 106 - SingaporeIETF 105 - MontrealIETF 104 - PragueIETF 103 - BangkokIETF 102 - Montreal Financial information prior to the IETF LLCBudgets prior to the formation of the LLCFinancial statements prior to the formation of the LLCMeeting statements prior to IETF 102 Initial ISOC Financial Contributions to IETF LLCIETF LLC 2018 Preliminary Sample BudgetIETF LLC 2018 Transition Working BudgetIETF LLC 2018 Transition Statement2018 Chart of Accounts Administration IETF Administration LLC Administrative announcements Administrative reports IETF Administration LLC Board of Directors Financial statements RFPs and contracts Administrative policies and procedures Legal requests Legal request procedures IETF Administration LLC Staff"
