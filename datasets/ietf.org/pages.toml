["https://ietf.org/blog/email-delivery-delay-2025-03"]
title = "IETF  | IETF email service issues resolved as of 4 March 2025"
description = "The IETF email processing system delays reported on 3 March 2025 have been resolved. All messages in the queue were delivered by 0700 UTC on 4 March and the system is now keeping up."
full_description = "IETF News Blog listing IETF setting standards for AI preferences The newly-chartered AI Preferences (AIPREF) Working Group will work on standardizing building blocks that allow for the expression of preferences about how content is collected and processed for Artificial Intelligence (AI) models. Suresh Krishnan AIPREF Working Group Co-chair Mark Nottingham AIPREF Working Group Co-chair 27 Feb 2025 Suggested IETF 122 Sessions for Getting Familiar with New Topics These IETF 122 meeting sessions are likely to include discussions and proposals that are accessible to a broad range of Internet technologists whether they are new to the IETF or long-time participants. 21 Feb 2025 IETF email service transition completed on 24 February The IETF email processing infrastructure transition planned for 0900-1100 UTC on 24 February has been completed. Robert Sparks Senior Director of Information Technology 14 Feb 2025 New Participant Program Registration now open for IETF 122 Bangkok We are happy to announce that registration is now open for the first edition of an expanded New Participants Program during the IETF 122 Bangkok meeting! Michelle Cotton IETF New Participant Ambassador 7 Feb 2025 Shaping the Future of Network Management: First Draft of NEMOPS Workshop Report Released A first draft of the Next Era of Network Management Operations (NEMOPS) Workshop report including next steps to shape the future of network management protocols and techniques has been published. Dhruv Dhody IAB Member Wes Hardaker IAB Member 5 Feb 2025 Show all Show filters Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter IETF email service issues resolved as of 4 March 2025 Robert Sparks Senior Director of Information Technology 4 Mar 2027 The IETF email processing system delays reported on 3 March 2025 have been resolved. All messages in the queue were delivered by 0700 UTC on 4 March and the system is now keeping up. The mail processing system encountered reduced disk I/O capacity due to an incident in the underlying filesystem that took some time to recover.During this period of reduced I/O capacity, email submission to lists was very high—driven by the Internet-Draft submission deadline at 2359 UTC Monday, 3 March. This led to very long queue time for messages going to mailing lists. We are looking into ways to improve the baseline I/O capacity of the system to provide better resiliency for the future.We believe this issue is currently resolved so will not be updating this post further.As previously shared:Following the email processing infrastructure transition last month, the new system was experiencing delay—sometimes over 4 hours—in delivering messages with the increased load resulting from the Internet-Draft submission deadline for the upcoming IETF 122 Bangkok meeting. We are working on short-term and long-term fixes.Email messages were being delivered almost immediately to the IETF mailarchive.ietf.org system, which can be searched for specific messages. While it does not reflect delivery delays, general system status can be found on the IETF Status page.One factor contributing to these delays was the number of messages being sent automatically due to the Internet-Draft submission deadline. This deadline for documents to be considered at an IETF meeting generally results in a burst of Internet-Draft (I-D) submissions. An announcement of each submission is distributed to a variety of lists, including several with large subscriber lists, such as I-D Announce. A single submission may result in many thousands, and sometimes many-10s-of-thousands of email messages being generated. This burst of I-D submissions has put additional strain on the new email processing system.We looked into and believe we now have an understanding of the root causes of the congestion and how to help the delivery queues drain more quickly. We are also considering longer-term changes to avoid the backup in the future. Share this page PreviousIETF setting standards for AI preferences Next"
year_published = 2025
