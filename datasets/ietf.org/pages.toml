description = "The IETF Administration LLC is soliciting community feedback on the second retrospective on the  IETF Administrative Support Activity (IASA 2.0). This follows our first retrospective from 2021."
full_description = "IETF News Blog listing IETF email service issues resolved as of 4 March 2025 The IETF email processing system delays reported on 3 March 2025 have been resolved. All messages in the queue were delivered by 0700 UTC on 4 March and the system is now keeping up. Robert Sparks Senior Director of Information Technology 4 Mar 2027 IETF setting standards for AI preferences The newly-chartered AI Preferences (AIPREF) Working Group will work on standardizing building blocks that allow for the expression of preferences about how content is collected and processed for Artificial Intelligence (AI) models. Suresh Krishnan AIPREF Working Group Co-chair Mark Nottingham AIPREF Working Group Co-chair 27 Feb 2025 Suggested IETF 122 Sessions for Getting Familiar with New Topics These IETF 122 meeting sessions are likely to include discussions and proposals that are accessible to a broad range of Internet technologists whether they are new to the IETF or long-time participants. 21 Feb 2025 IETF email service transition completed on 24 February The IETF email processing infrastructure transition planned for 0900-1100 UTC on 24 February has been completed. Robert Sparks Senior Director of Information Technology 14 Feb 2025 New Participant Program Registration now open for IETF 122 Bangkok We are happy to announce that registration is now open for the first edition of an expanded New Participants Program during the IETF 122 Bangkok meeting! Michelle Cotton IETF New Participant Ambassador 7 Feb 2025 Show all Show filters Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter Consultation on the Second IASA2 Retrospective Jason Livingood IETF Administration LLC Board Chair 4 Sep 2024 The IETF Administration LLC is soliciting community feedback on the second retrospective on the IETF Administrative Support Activity (IASA 2.0). This follows our first retrospective from 2021. We will incorporate the feedback we receive and release the retrospective at or before IETF 121 in November 2024. The first assessment was required by BCP 101 after three years of operation. That report recommended we perform subsequent retrospectives every three years. Thus, we have produced a DRAFT of the second IASA2 retrospective for your consideration. We are seeking input from the community this month, after which we will revise the report and then release it during IETF 121. This document is an informational assessment and some of the draft recommendations are outside the purview of the IETF LLC and so would require initiation of community-driven processes to address those issues.Timeline:September 3 - 30: Share a draft of the assessment and begin community review.October: Revision of the report based on community input.November: Release the report during or before IETF 121.How to provide input by 30 September 2024:Email: send feedback to admin-discuss@ietf.orgGitHub: Open an issue or propose a pull request at the IASA2 Retrospective repo. The draft can be found here on GitHub. Thank you in advance for your thoughtful review, comment, questions, and any other input. Share this page PreviousIETF email service outage deferred NextRFC data visualizations accessibility review"
