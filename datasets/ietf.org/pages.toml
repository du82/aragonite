["https://ietf.org/administration/llc-staff"]
title = "IETF  | IETF Administration LLC Staff"
description = "IETF Administration LLC Staff"
full_description = "Administration IETF Administration LLC Staff Meet the IETF Administration LLC Staff IETF Executive DirectorJay Daley, is IETF Executive Director, a position he has held since October 2019. He has had an extensive career in the Internet, starting with networking schools in the 1990s and then working in the domain name industry from the early 2000s. He has held the roles of Interim CEO of .ORG (Public Interest Registry), CEO of NZRS, the domain name registry for New Zealand’s .nz ccTLD, and CTO at Nominet UK, the official registry for .UK domain names. An experienced organizational leader, he is particularly focused on good governance, evidence-led decision making, empowered communities, and maintaining a free and open Internet. Jay began his career as a software developer in 1986, moved to network management, and then to general IT services management before taking on his first CEO role in 2009.Communications and OperationsGreg Wood, is Senior Director of Communications and Operations for the IETF Administration LLC. He previously served as Director of Communications at the Internet Society (ISOC) and, before joining ISOC, was the Director of Communications for Internet2. Greg first encountered the Internet in 1992 while working at start up university in Lithuania. He currently is based in the Washington, D.C. area.FinanceDebbie Sasser is the Director of Finance at IETF and started that role May 2023. She is a Certified Public Accountant (CPA) with experience in both public practice and industry in the United States and in Europe. Her broad sector knowledge includes manufacturing, not for profit, service, retail, agriculture, development, and house building. She is based in Arizona USA and her passions are canyoneering, hiking, rocks, plants, and traveling.Tools TeamRobert Sparks, is a member of the Tools Development team, and is the Senior Director of Information Technology for the IETF LLC. He is a co-chair of the STIR working group, and is a past-chair of the SIMPLE and GEOPRIV working groups. Robert was on the Internet Architecture board 2015-2019, and served as the program lead for the RFC Editor program, and as the IAB shepherd for the liaison relationship with 3GPP. Robert was a member of the RFC Series Oversight Committee from 2014-2019. Robert was an Area Director for the Real-time Applications and Infrastructure area from 2009-2013. He is a co-author of the core SIP specification and several of its updates and extensions, and has focused on improving the level of interoperability of SIP implementations by coordinating the SIPit interoperability events. He is also an active open source contributor. Robert served as a Senior Principal Member of Technical Staff at Oracle, Principal Engineer at Tekelec, VP of Research and Development at Estacado Systems, CTO at Xten Networks (now CounterPath), and has held management and research positions at dynamicsoft, Lucent, Worldcom and Texas A&M University. Robert has a BSc in Computer Science and a MSc in Mathematics from Texas A&M University.The other staff in the tools team are:Nicolas Giard, Senior Software DeveloperMatthew Holloway, Senior Software Development EngineerKesara Rathnayake, Senior Software Development EngineerJennifer Richards, Senior Software DeveloperRFC Production Center (RPC)Jean Mahoney is the Director of RPC Communications and Strategy.Sandy Ginoza (no photo) is the Director of RPC Operations.The other staff in the RPC are:Lynne BartholomewMadison ChurchMegan FergusonTed HarrisonKaelin FoodyKaren MooreAlanna PalomaAlice RussoSarah TarrantRebecca VanRheenenSecretariatThe IETF Secretariat is a contracted service with Association Management Solutions. While not IETF staff, they are an important part of the IETF and so are listed here for convenience.Cindy Morgan has been part of the IETF Secretariat team since 2008 and currently serves as the Director of Leadership Operations. Cindy oversees the Secretariat functions related to the standards process, including support for the Internet Engineering Steering Group (IESG), Internet Architecture Board (IAB), and Internet Research Task Force (IRTF). Cindy ensures that the IETF Secretariat meets its contracted Service Level Agreements as they relate to the IETF standards process, and works with the IETF Executive Director (ED) and IETF Chair to refine Secretariat support needs and operational procedures as they relate to the IETF standards process and support for leadership bodies. Cindy also acts as the Secretariat liaison to the IETF tools development process.Laura Nugent has worked with the IETF since 2008 as the Director of Meetings and Events, conducting the location and venue sourcing and reporting, managing site inspections, as well as all contracting for IETF meetings and leadership retreats. Beginning in April of 2024, while continuing to lead IETF sourcing and contracting, Laura took on a number of new responsibilities. In addition to her meeting and event activities, Laura now oversees the IETF administrative functions handled by the Secretariat; specifically, Laura ensures that the Secretariat meets its contractual obligations as they relate to the IETF Administration and meeting contracts, collaborates with the IETF Chair and IETF Executive Director to refine Secretariat support, develops general administrative policies and procedures, works with IETF legal counsel to address contractual issues, responds to requests for Internet-Draft (I-D) authentication and subpoenas, and prepares, compiles and signs all I-D legal declarations. Laura also participates in the development of initiatives to improve IETF culture and oversees staff support of these programs, including Systers, the New Participant program, and EODir. Related activities include managing support for the annual ANRW Workshop and Travel Grant program, and serving on the ANRW Steering Committee.Stephanie McCammon Stephanie McCammon is the Director of Meeting Operations and Sponsorships with the IETF Secretariat, and has worked with the IETF since 2008. She manages the meeting planning team for the IETF and oversee all post-contract meeting planning, while thinking creatively about improvements to IETF meetings. She also manages the sponsorship program by engaging with new and existing sponsors, developing and promoting sponsorship opportunities, and overseeing the fulfillment of sponsor benefits.Contacting usThere are different ways to Contact Us you might be interested in IETF Administration LLC Administration IETF Administration LLC Administrative announcements Administrative reports IETF Administration LLC Board of Directors Financial statements RFPs and contracts Administrative policies and procedures Legal requests Legal request procedures IETF Administration LLC Staff"
