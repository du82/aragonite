al-Time Area IETF-LLC Security Area (sec) Date from Date to Filter IETF Annual Report 2022 3 Oct 2023 The IETF Annual Report 2022 provides a summary of Internet Engineering Task Force (IETF), Internet Architecture Board (IAB), Internet Research Task Force (IRTF), and RFC Editor community activities from last year. The report provides a high-level overview of activities across the IETF, IAB, and IRTF. It brings together in one place a wide range of information from 2022, including about working groups and research groups, meetings and other events, as well as information about document authoring and publication. The report also includes updates on the ongoing operational and financial support provided via the IETF LLC for the work of the IETF, IAB, IRTF, and RFC Editor.We encourage you to review the full report, which provides links to additional details. Of course, regular meetings of the IETF LLC Board of Directors and Internet Engineering Steering Group (IESG) telechats are also open to observers, with agendas published in advance. Ongoing discussion of general topics related to the IETF community is always encouraged on the IETF-Discussion list, with IETF LLC administration issues discussed on the Admin-Discussion list. Share this page PreviousIETF 117 Highlights NextIETF Working Group leadership skills training opportunity"
