description = "The IETF Administration LLC (IETF LLC) provides the corporate legal home for the IETF, the Internet Architecture Board (IAB), and the Internet Research Task Force (IRTF)."
full_description = "Administration The IETF Administration LLC (IETF LLC) provides the corporate legal home for the IETF, the Internet Architecture Board (IAB), and the Internet Research Task Force (IRTF). The responsibilities of the IETF LLC include: supporting the ongoing operations of the IETF, including meetings and non-meeting activities; managing the IETF's finances and budget; raising money on behalf of the IETF, and establishing and enforcing policies.The IETF LLC is managed by the IETF Executive Director, who leads the team of LLC Staff and is overseen by the IETF LLC Board of Directors. IETF Administration LLC Details of the mission, values, responsibilities, strategy and legal/policy foundations of the IETF Administration LLC. Administrative announcements Links to email announcements from the Executive Director and LLC Board Administrative reports Reports on the activities and performance related to the IETF and the IETF Administration LLC IETF Administration LLC Board of Directors The IETF LLC Board is responsible for conducting oversight of the LLC's execution of its responsibilities. Financial statements The IETF Administration LLC publishes monthly statements, meeting statements, annual budgets, and other documents to provide visibility into its financial structure and to keep the IETF community informed about its work. RFPs and contracts Explains our contracting process and provides details of our current and past RFPs including contracts and COI disclosures. Also has details of special contracts. Administrative policies and procedures Policies and procedures of the IETF Administration LLC. Legal requests The IETF publishes all legal requests, subpoenas, and responses. Legal request procedures These are the instructions for making requests of the IETF related to legal matters. IETF Administration LLC Staff IETF Administration LLC Staff"
year_published = 2025
