["https://ietf.org/blog/ietf-administration-llc-2024-strategic-plan"]
title = "IETF  | IETF Administration LLC 2024 Strategic Plan"
description = "The IETF Administration LLC 2024 Strategic Plan sets out the strategy that it aims to follow over the next 3-5 years."
full_description = "IETF News Blog listing IETF email service issues resolved as of 4 March 2025 The IETF email processing system delays reported on 3 March 2025 have been resolved. All messages in the queue were delivered by 0700 UTC on 4 March and the system is now keeping up. Robert Sparks Senior Director of Information Technology 4 Mar 2027 IETF setting standards for AI preferences The newly-chartered AI Preferences (AIPREF) Working Group will work on standardizing building blocks that allow for the expression of preferences about how content is collected and processed for Artificial Intelligence (AI) models. Suresh Krishnan AIPREF Working Group Co-chair Mark Nottingham AIPREF Working Group Co-chair 27 Feb 2025 Suggested IETF 122 Sessions for Getting Familiar with New Topics These IETF 122 meeting sessions are likely to include discussions and proposals that are accessible to a broad range of Internet technologists whether they are new to the IETF or long-time participants. 21 Feb 2025 IETF email service transition completed on 24 February The IETF email processing infrastructure transition planned for 0900-1100 UTC on 24 February has been completed. Robert Sparks Senior Director of Information Technology 14 Feb 2025 New Participant Program Registration now open for IETF 122 Bangkok We are happy to announce that registration is now open for the first edition of an expanded New Participants Program during the IETF 122 Bangkok meeting! Michelle Cotton IETF New Participant Ambassador 7 Feb 2025 Show all Show filters Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter IETF Administration LLC 2024 Strategic Plan Jay Daley IETF Executive Director 9 Jan 2024 The IETF Administration LLC Strategic Plan sets out the strategy that it aims to follow over the next 3-5 years. This Strategic Plan is developed by the IETF LLC Board and then revised after consultation with the IETF community. The call for consultation went out on 6 October 2023 and feedback was provided directly and on the admin-discuss mailing list. As a result of this, the following changes were made to the strategy:To add a goal around making the IETF as accessible as possible in order to address the concern that meeting fees are a barrier to participation and to reflect the long-term aspiration of the IETF LLC to reduce or even eliminate these fees. The new text is:To make IETF infrastructure and services, in particular IETF Meetings, as fairly accessible as possible, while still operating within resource constraints.Remove the IAB from the transformation about strategic planning as this should only apply to the IESG. The changed text is:IESG and IAB uses the LLC to provide professional support for their strategic planning, as required.Include text on the transformation about websites noting the IESG overall control. The inserted text is:The IESG is the organizational owner of IETF content and websites and has delegated to …This strategy is an important living document for the IETF LLC. It forms the basis of the annual goals for the IETF Executive Director and is used as a key input into the annual budget process. Thank you to all those who provided feedback.This Strategic Plan, along with older versions and related strategic documents, are available on the Administration Overview page. Share this page PreviousLaunch of the IETF Community Survey 2023 NextInternet Society Extends Financial Support to the IETF"
