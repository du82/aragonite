description = "The IETF Administration LLC (IETF LLC) completed the IETF Administrative Support Activity (IASA 2.0) retrospective. The report was developed with community input and review and is now available online."
full_description = "IETF News Blog listing IETF email service issues resolved as of 4 March 2025 The IETF email processing system delays reported on 3 March 2025 have been resolved. All messages in the queue were delivered by 0700 UTC on 4 March and the system is now keeping up. Robert Sparks Senior Director of Information Technology 4 Mar 2027 IETF setting standards for AI preferences The newly-chartered AI Preferences (AIPREF) Working Group will work on standardizing building blocks that allow for the expression of preferences about how content is collected and processed for Artificial Intelligence (AI) models. Suresh Krishnan AIPREF Working Group Co-chair Mark Nottingham AIPREF Working Group Co-chair 27 Feb 2025 Suggested IETF 122 Sessions for Getting Familiar with New Topics These IETF 122 meeting sessions are likely to include discussions and proposals that are accessible to a broad range of Internet technologists whether they are new to the IETF or long-time participants. 21 Feb 2025 IETF email service transition completed on 24 February The IETF email processing infrastructure transition planned for 0900-1100 UTC on 24 February has been completed. Robert Sparks Senior Director of Information Technology 14 Feb 2025 New Participant Program Registration now open for IETF 122 Bangkok We are happy to announce that registration is now open for the first edition of an expanded New Participants Program during the IETF 122 Bangkok meeting! Michelle Cotton IETF New Participant Ambassador 7 Feb 2025 Show all Show filters Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter Conclusion of the IASA2 Retrospective Jason Livingood IETF Administration LLC Board Chair 1 Nov 2021 The IETF Administration LLC (IETF LLC) has now completed the IETF Administrative Support Activity (IASA 2.0) retrospective. The report was developed with community input and review and is now available online. This assessment was required by BCP 101 after three years of operation of the IETF LLC. In April 2021 we announced a proposed process and timing for this retrospective and sought comment from the community. We then started the process in June 2021 with solicitation of input from the community.The report documents areas where work is completed as well as where work is continuing. Section E of the document also contains several recommendations for future work, including that further IASA assessments be performed every three years. This report will also be presented at the IETF 112 plenary meeting on 3 November 2021 at 13:30 UTC. Share this page PreviousIETF 2022 Draft Budget NextIETF 112 Sessions for New Participants"
