title = "IETF  | Internet Architecture Board"
description = "The Internet Architecture Board provides long-range technical direction for Internet standards, ensuring the Internet continues to grow and evolve as a platform for global communication and innovation."
full_description = "About Groups Internet Architecture Board The Internet Architecture Board provides long-range technical direction for Internet standards, ensuring the Internet continues to grow and evolve as a platform for global communication and innovation. The Internet Architecture Board (IAB) is a committee of the Internet Engineering Task Force. Its responsibilities include:IESG Confirmation: The IAB confirms the IETF Chair and Internet Engineering Steering Group (IESG) Area Directors, from nominations provided by the IETF Nominating Committee.Architectural Oversight: The IAB provides oversight of, and occasional commentary on, aspects of the architecture for the protocols and procedures used by the Internet.Standards Process Oversight and Appeal: The IAB provides oversight of the process used to create Internet Standards. The IAB serves as an appeal board for complaints of improper execution of the standards process through acting as an appeal body in respect of an IESG standards decision.IANA: The IAB is responsible for administration of the assignment of IETF Protocol parameter values by the IETF Internet Assigned Numbers Authority (IANA).External Liaison: The IAB acts as representative of the interests of the IETF in liaison relationships with other organizations concerned with standards and other technical and organizational issues relevant to the world-wide Internet.Advice to ISOC: The IAB acts as a source of advice and guidance to the Board of Trustees and Officers of the Internet Society (ISOC) concerning technical, architectural, procedural, and (where appropriate) policy matters pertaining to the Internet and its enabling technologies.IRTF Chair: The IAB selects a chair of the Internet Research Task Force (IRTF) for a renewable two year term.See the IAB website for more information. The IAB can be contacted by email at iab@iab.org. Groups Internet Engineering Steering Group Internet Architecture Board Internet Research Task Force Nominating Committee IETF Trust Affiliate Groups Independent Submissions Editor RFC Editor"
