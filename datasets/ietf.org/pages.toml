["https://ietf.org/forms/legal-requests"]
title = "IETF  | Informal Legal Requests Form"
full_description = "Forms Informal Requests for Information Upon receipt of your request IETF legal counsel will follow-up to acknowledge receipt and to clarify any questions concerning the request. Usually, IETF counsel will work with the IETF to determine whether the requested information can be obtained and authenticated as needed. If it is determined that authentication is not possible (e.g., as is the case for certain older documents), then counsel will cooperate with the requester to determine alternative approaches.Authentication of documents and publication dates is generally made through written Declarations signed by the relevant IETF record custodians. As currently structured, different individuals have custody of Internet-Drafts and RFCs, meaning that separate Declarations will be issued for these different document types. If greater formality is required, a notarized Affidavit may be issued upon the request of the requester. Please provide the following information.If the form below does not work for you, please contact the IETF Secretariat. Specific information you are requesting (i.e. which Internet-Drafts or RFCs you would like authenticated). * Please list all requested documents in this field (you do not need to complete a new form for each document). Legal case or administrative proceeding, including jurisdiction and case number * Parties in the case * Name and contact details of the person making the request and on whose behalf the request is made. * Responses are typically made via electronic document. Please let us know if you require a hard copy. * Electronic document is sufficient. Signed hard copy is required (additional fees may apply). Is notarization of the declaration required? * Yes No When do you need us to respond by? *"
year_published = 2025
