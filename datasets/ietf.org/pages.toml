full_description = "Administration IETF Administration LLC Board of Directors The IETF Administration LLC Board of Directors conducts oversight of the LLC's execution of its responsibilities. The IETF Administration LLC Board of Directors has five members, three appointed by the NomCom, one by ISOC and one by the IESG:Roman Danyliw (IESG appointee, term ends 2026)Mirjam Kühne, Chair (NomCom appointee, term ends 2026)Jason Livingood, Vice-Chair (NomCom appointee, term ends 2025)Sean Turner, Vice-Treasurer (Internet Society appointee, term ends 2025)Shauna Turner, Treasurer (NomCom appointee, term ends 2027)The board can be reached at llc-board@ietf.orgAnnouncements Board MeetingsIETF LLC Administration Board of Directors meetings are conducted via teleconference.Regular meetings are divided into four sections:Open (to Observers)Board + Support StaffBoard + Executive DirectorExecutive Session (Board-Only)You can download or subscribe to the LLC Board meetings calendar.The next Board meetings are as follows:5 March 2025 - 19:00 UTC [Webex link Meeting ID: 2436 963 2528 | Password: 123416 April 2025 - 18:00 UTC [Webex link Meeting ID: 2436 963 2528 | Password: 123414 May 2025 - 18:00 UTC [Webex link Meeting ID: 2436 963 2528 | Password: 1234Agendas and Minutes of the current year's meetings are posted below. Agendas are posted one week in advance of meetings and are subject to change. Minutes are approved and posted within two weeks after each meeting.5 March 2025 - Agenda12 February 2025 — Agenda | Minutes8 January 2025 — Agenda | Minutes Previous Board Meeting Minutes and AgendasMinutes and agendas from every IETF Administration LLC Board of Directors meeting are made public.2024202320222021202020192018 you might be interested in IETF Administration LLC Administration IETF Administration LLC Administrative announcements Administrative reports IETF Administration LLC Board of Directors Financial statements RFPs and contracts Administrative policies and procedures Legal