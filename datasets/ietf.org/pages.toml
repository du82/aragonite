["https://ietf.org/blog/aipref-wg"]
title = "IETF  | IETF setting standards for AI preferences"
description = "The newly-chartered AI Preferences (AIPREF) Working Group will work on standardizing building blocks that allow for the expression of preferences about how content is collected and processed for Artificial Intelligence (AI) models."
full_description = '''IETF News Blog listing IETF email service issues resolved as of 4 March 2025 The IETF email processing system delays reported on 3 March 2025 have been resolved. All messages in the queue were delivered by 0700 UTC on 4 March and the system is now keeping up. Robert Sparks Senior Director of Information Technology 4 Mar 2027 Suggested IETF 122 Sessions for Getting Familiar with New Topics These IETF 122 meeting sessions are likely to include discussions and proposals that are accessible to a broad range of Internet technologists whether they are new to the IETF or long-time participants. 21 Feb 2025 IETF email service transition completed on 24 February The IETF email processing infrastructure transition planned for 0900-1100 UTC on 24 February has been completed. Robert Sparks Senior Director of Information Technology 14 Feb 2025 New Participant Program Registration now open for IETF 122 Bangkok We are happy to announce that registration is now open for the first edition of an expanded New Participants Program during the IETF 122 Bangkok meeting! Michelle Cotton IETF New Participant Ambassador 7 Feb 2025 Shaping the Future of Network Management: First Draft of NEMOPS Workshop Report Released A first draft of the Next Era of Network Management Operations (NEMOPS) Workshop report including next steps to shape the future of network management protocols and techniques has been published. Dhruv Dhody IAB Member Wes Hardaker IAB Member 5 Feb 2025 Show all Show filters Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter IETF setting standards for AI preferences Suresh Krishnan AIPREF Working Group Co-chair Mark Nottingham AIPREF Working Group Co-chair 27 Feb 2025 The newly-chartered AI Preferences (AIPREF) Working Group will work on standardizing building blocks that allow for the expression of preferences about how content is collected and processed for Artificial Intelligence (AI) model development, deployment, and use. The use of Internet content for training large language models ("AI") has become a contentious topic. Training a model requires voluminous information, and the Internet is readily available as a source of diverse content. However, many publishers and authors object to these new uses of their work without permission or compensation.While the IETF doesn't take a position on the legal questions in this space, we do track developments, and last September the IAB AI-CONTROL Workshop highlighted a need for clearer communication between content publishers and AI model trainers. Right now, AI vendors use a confusing array of non-standard signals in the robots.txt file (defined by RFC 9309) and elsewhere to guide their crawling and training decisions. As a result, authors and publishers lose confidence that their preferences will be adhered to, and resort to measures like blocking their IP addresses.To address this need, the AIPREF working group has been chartered to define:a common vocabulary to express authors' and publishers' preferences regarding use of their content for AI training and related tasks, andmeans of attaching that vocabulary to content on the Internet, either by embedding it in the content or by formats similar to robots.txt, and a standard mechanism to reconcile multiple expressions of preferences. The Working Group will hold its first meeting during IETF 122 Bangkok, where administrative and initial scoping discussions will take place. Shortly thereafter, it will hold an interim meeting from 8-10 April in Brussels, Belgium. This is an open meeting, but registration is required.If you are interested in monitoring or participating in this work, subscribe to the AIPREF working group mailing list. Share this page PreviousSuggested IETF 122 Sessions for Getting Familiar with New Topics NextIETF email service issues resolved as of 4 March 2025'''
year_published = 2025
clearnet = "https://ietf.org/blog/aipref-wg"
