title = "IETF  | Groups"
description = "The work of the IETF is undertaken and supported by a wide variety of groups with differing structures, goals, and responsibilities."
full_description = "About Groups The work of the IETF is undertaken and supported by a wide variety of groups with differing structures, goals, and responsibilities. While the technical work in the IETF is primarily undertaken in working groups as part of the IETF standards development process, other groups, including those described below, provide support for and help organize this work. These groups provide administrative oversight for the IETF, help select individuals to serve in leadership roles, and develop the tools and services used as part of the IETF standards process. Internet Engineering Steering Group The Internet Engineering Steering Group (IESG) is responsible for technical management of IETF activities and the Internet standards process. Internet Architecture Board The Internet Architecture Board provides long-range technical direction for Internet standards, ensuring the Internet continues to grow and evolve as a platform for global communication and innovation. Internet Research Task Force The Internet Research Task Force (IRTF) promotes research of importance to the evolution of the Internet by creating focused, long-term Research Groups working on topics related to Internet protocols, applications, architecture and technology. Nominating Committee The Nominating Committee or, as it is typically known, the NomCom, exists to review open IESG, IAB and IAOC positions and to nominate a candidate for each. IETF Trust The IETF Trust was created to acquire, hold, and maintain intellectual property and other property used in connection with Internet standards. Tools Team The IETF Tools Team is a group of volunteers from the IETF community that develops tools to support the work of the IETF itself. Affiliate Groups Affiliate groups allow IETF participants to discuss topics of mutual interest not related to IETF work. Independent Submissions Editor The Independent Submissions Editor manages the Independent Submissions Stream. RFC Editor The RFC Editor function comprises a set of parts that together manage the editing, publishing, and archiving of RFCs, and the policies around this."
