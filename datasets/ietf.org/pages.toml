title = "IETF  | Open Internet"
description = "”We believe in rough consensus and running code” is an unofficial mantra of the IETF and underscores the value the community puts on work that makes a difference in the real world."
full_description = "Open Internet The Open Internet sponsorship supports a long-term future for IETF work, meetings, and vision. Open access to RFCsSince the inception of the RFC Series, RFCs have been free to download. This was once considered radical as other technical standards were only available for a fee, but is increasingly adopted by new standards organizations. The RFC Editor function of professional editors and website is a significant cost for the IETF and Open Internet sponsorship helps us to offset this and ensure the long term openness of RFCs.IETF EndowmentThe IETF Endowment is a designated investment fund created in support of the IETF and our activities, intended to ensure the long-term sustainability of the IETF. It is governed by an IETF Endowment Policy, which outlines the structure of the IETF Endowment, as well as the acceptance, withdrawal, and use of funds. Open Internet sponsorshipBy anticipating future needs today, Open Internet sponsors ensure a high-functioning, diverse, and robust IETF community of tomorrow. Sponsorship opportunities are available in Gold, Silver and Bronze - see Meeting sponsorship for more details. Ways to give There are many ways to make a gift to the IETF See all the ways to give Home About Technologies Participate Process Support us Meetings"
year_published = 2025
