al-Time Area IETF-LLC Security Area (sec) Date from Date to Filter IETF Administration LLC 2021 Budget Jay Daley IETF Executive Director 8 Mar 2021 The IETF Administration LLC has finalised its 2021 budget following a community consultation. Apologies - this budget was approved by the LLC board on 14 January 2021 and should have been published soon after.In December 2020 the IETF Administration LLC published a draft of its 2021 budget along with a detailed narrative for community feedback. This IETF Administration LLC 2021 Budget has now been finalised and approved by the LLC Board. In developing this budget the LLC continues to give careful consideration to each budget request as well as the needs of the community as a whole.Only minor changes have been made to the budget since the draft with some budget lines moved to provide a more accurate breakdown of costs, with no net impact on the budget. These changes are“Secretariat - IT” moved to the Tools Team section where it correctly belongs“Secretariat - Admin” split into two, based on advice from the Secretariat, with the new “Secretariat - Community Leadership” added to the Community Leadership section.The updated budget therefore only differs from the consultation draft in the presentation of figures on the summary page. Share this page PreviousApplied Network Research Prize presentations at IETF 110 NextNew Internet Architecture Board and Internet Engineering Steering Group Meet for First Time"
