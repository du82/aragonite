["https://ietf.org/blog/countries-listed-in-ietf-systems"]
title = "IETF  | Countries Listed in IETF Systems"
description = "This post explains how the list of countries shown in IETF systems is chosen."
full_description = "IETF News Blog listing IETF email service issues resolved as of 4 March 2025 The IETF email processing system delays reported on 3 March 2025 have been resolved. All messages in the queue were delivered by 0700 UTC on 4 March and the system is now keeping up. Robert Sparks Senior Director of Information Technology 4 Mar 2027 IETF setting standards for AI preferences The newly-chartered AI Preferences (AIPREF) Working Group will work on standardizing building blocks that allow for the expression of preferences about how content is collected and processed for Artificial Intelligence (AI) models. Suresh Krishnan AIPREF Working Group Co-chair Mark Nottingham AIPREF Working Group Co-chair 27 Feb 2025 Suggested IETF 122 Sessions for Getting Familiar with New Topics These IETF 122 meeting sessions are likely to include discussions and proposals that are accessible to a broad range of Internet technologists whether they are new to the IETF or long-time participants. 21 Feb 2025 IETF email service transition completed on 24 February The IETF email processing infrastructure transition planned for 0900-1100 UTC on 24 February has been completed. Robert Sparks Senior Director of Information Technology 14 Feb 2025 New Participant Program Registration now open for IETF 122 Bangkok We are happy to announce that registration is now open for the first edition of an expanded New Participants Program during the IETF 122 Bangkok meeting! Michelle Cotton IETF New Participant Ambassador 7 Feb 2025 Show all Show filters Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter Countries Listed in IETF Systems Jay Daley IETF Executive Director 31 Oct 2023 The IETF Administration LLC and Secretariat regularly receive questions and requests from the IETF community about the countries that are listed in IETF systems, in particular the list in the meeting registration system. Recent communications include a request for a new country to be added to this list and a recommendation that this list should be titled ‘Country or Region’. This post explains how this list is chosen and why we will not be acting on these requests. As you might expect from a technical standards organization, IETF systems use ISO 3166, the global standard technical list of codes for countries and their subdivisions, which incorporates the names of countries from UN sources. For practical reasons, we do not directly implement this list but rely instead on third-party code libraries, which generally include features that go beyond that standard. The one non-standard feature used in IETF systems, is the replacement of some official short names of countries with more commonly used short names, as this simplifies and improves the user experience. For example, in the meeting registration system the ISO 3166 short name of “Netherlands (Kingdom of the)” is replaced with “Netherlands”. Similarly “Taiwan (Province of China)” is replaced with “Taiwan”.We understand that there are a lot of strong feelings about this subject and the combination of choices above will leave some people very unhappy. However, there is no straightforward neutral way to do this, nor is it possible to address a request to change without upsetting someone else. The choices above are a fair way to balance the many competing interests for what are, after all, just a set of IT systems.In response to the two specific requests above:On the question of adding a new country - we do not think it is appropriate for us to create a custom list instead of ISO 3166. That is simply not an area of political controversy that we should be entering into.On the question of renaming the list from ‘Country’ to ‘Country or Region’ - our current approach of simplifying ‘countries and their subdivisions’ is the same approach taken in ISO 3166 itself which is the standard for ‘Country Codes’. While there are some places where the UI could support a more expansive term, in other places that would be problematic and we prefer consistency as that delivers a better user experience.If you have any questions or comments, then please feel free to contact me directly at exec-director@ietf.org Share this page PreviousReport on Experience of Women Participating in the Internet Engineering Task Force NextSuggested IETF 118 Sessions for Getting Familiar with New Topics"
year_published = 2025
clearnet = "https://ietf.org/blog/countries-listed-in-ietf-systems"
