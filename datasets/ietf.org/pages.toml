title = "IETF  | Articles by Michelle Cotton"
full_description = "IETF News Articles by Michelle Cotton 2025-02-07 New Participant Program Registration now open for IETF 122 Bangkok 2024-10-22 New Participant activities at the IETF: Major expansion coming for IETF 122! IETF News Articles by Michelle Cotton 2025-02-07 New Participant Program Registration now open for IETF 122 Bangkok 2024-10-22 New Participant activities at the IETF: Major expansion coming for IETF 122! The IETF works on a broad range of networking technologies that provide the foundation for the Internet's growth and evolution. While most IETF work takes place online, meetings and other events such as Hackathons provide in-person opportunities to advance work within the IETF. The IETF is the premier Internet standards organization. It follows open and well-documented processes for setting these standards. Once published, those standards are made freely available. The global IETF community works together in many different ways to produce high quality, relevant technical documents that influence the way people design, use, and manage the Internet."
