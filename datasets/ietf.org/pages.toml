full_description = "Contact us Get in touch, we would love to hear from you If you do not know where to start or no suitable contact is listed below then please email support@ietf.org.GeneralGeneral inquiries: support@ietf.orgErrors or problems with IETF websites: support@ietf.orgMedia inquiries: media@ietf.orgMeeting sponsorship: sponsorship@ietf.orgIETF Endowment: IETF Executive DirectorIETF Executive Director: exec-director@ietf.orgLegal, Conduct and ComplaintsTo report a copyright infringement: Copyright infringementTo request an authenticated document or to serve a subpoena, see our legal requests proceduresTo report/discuss an issue of conduct by a community participant or community leader: OmbudsteamTo report/discuss an issue of conduct by a member of the IETF Administration LLC Board, staff or a contractor: IETF LLC Whistleblower HotlineFor questions, concerns and requests concerning personal data: privacy@ietf.orgFor all other complaints, contact the IETF Executive Director: exec-director@ietf.orgInternet Standards and Standards DevelopmentThe Internet Engineering Steering Group (IESG) is responsible for technical management of IETF activities and the Internet standards process.For general inquires, contact the IESG Secretary: support@ietf.orgTo report a vulnerability with an IETF protocol: Guidance on Reporting Protocol Vulnerabilities to the IETFLiaisons and liaison statementsThe IETF has a limited number of liaison relationships with other organizations. Liaisons from the IETF to other organizations are appointed by the Internet Architecture Board (IAB). If you have any question about liaison management or need information about sending a liaison statement to the IETF, please contact the Internet Architecture Board (IAB) at liaison-coordination@iab.orgIT Infrastructure and ServicesTo report a vulnerability in our infrastructure or services: Vulnerability Disclosure StatementTo raise an issue with a specific IETF system please see the appropriate GitHub repositoryPostal AddressIETF Administration LLC1000 N West Street, Suite 1200Wilmington, DE 19801USAPhone: +1 ‪(302) 319-3421‬SecretariatAssociation Management Solutions, LLC (AMS)39221 Paseo Padre Pkwy, Suite JFremont, California 94538USAPhone: +1-510-392-4910 Encrypted EmailTo send encrypted email, you can use our PGP key and send to the email address in the key (encrypted at ietf dot org.) This is for credit card or other confidential information ONLY; other email must be sent to the appropriate addresses above. Home About Technologies Participate Process Support us Meetings"
