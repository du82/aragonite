title = "IETF  | Administrative policies and procedures"
description = "Policies and procedures of the IETF Administration LLC."
full_description = "Administration Administrative policies and procedures The IETF Administration LLC publishes its policies and procedures here. Any questions regarding these policies should be directed to the IETF Executive Director in the first instance.Governance PoliciesAdopted by the IETF LLC Board following community consultation:IETF LLC Code of ConductIETF LLC Conflict of Interest PolicyIETF LLC Records Retention and Management PolicyIETF LLC Travel & Expense Reimbursement PolicyIETF LLC Whistleblower PolicyIETF LLC Endowment PolicyIETF LLC Community Engagement PolicyIETF LLC Infrastructure and Services Vulnerability DisclosureOperational Policies and related documentsAdopted by the LLC Board for internal use:IETF LLC Staff PolicyIETF LLC Email Address Policy for StaffIETF LLC Board Electronic Voting ProceduresIETF LLC Board Minutes ApprovalIETF LLC Investment Policy StatementIETF LLC Board/ED Delegated AuthoritiesIETF LLC Accounting PolicyIETF LLC Objectively False IPR Disclosure PolicyIETF LLC Records Retention ScheduleIETF LLC Charitable Contribution Acceptance PolicyIETF LLC OFAC Compliance PolicyIETF LLC Risk Management PolicyIETF LLC Risk RegisterCovered individuals and complianceThe governance policies above apply to 'Covered Individuals', defined as follows:The IETF Administration LLC (“IETF LLC”) Board Directors, employees and contractors, as well as any volunteers and/or agents who are formally authorized to act on behalf of IETF LLC in some capacity and are considered by the LLC to be acting in that capacity (collectively, “Covered Individuals”).Who is not a Covered Individual? IETF participants, IRTF participants, IESG members, the IRTF Chair, IAB members, IAB program members, working group chairs, research group chairs, directorate participants, the Independent Submissions Editor, the Independent Submissions Editorial Board, NOC volunteers, Tools team volunteers, the Ombudsteam, the Sergeants-at-arms, trustees of the IETF Trust, and any individual not involved in the IETF, except if such individuals are formally authorized as Covered Individuals (such as an IETF LLC Board Director).The IETF LLC functions are performed and/or overseen by the Covered Individuals described above. All Covered Individuals must adhere to the various policies adopted by the IETF LLC from time to time.We recommend that Covered Individuals watch the compliance video to assist in their reading of these policies. you might be interested in IETF LLC Whistleblower Hotline Administration IETF Administration LLC Administrative announcements Administrative reports IETF Administration LLC Board of Directors Financial statements RFPs and contracts Administrative policies and procedures Legal requests Legal request procedures IETF Administration LLC Staff"
