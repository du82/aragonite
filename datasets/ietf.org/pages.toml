title = "IETF  | IETF Administration LLC 2025 Budget"
description = "A draft budget was shared previously for community consultation and the IETF Administration LLC now has finalised its budget for 2025."
full_description = "IETF News Blog listing IETF email service issues resolved as of 4 March 2025 The IETF email processing system delays reported on 3 March 2025 have been resolved. All messages in the queue were delivered by 0700 UTC on 4 March and the system is now keeping up. Robert Sparks Senior Director of Information Technology 4 Mar 2027 IETF setting standards for AI preferences The newly-chartered AI Preferences (AIPREF) Working Group will work on standardizing building blocks that allow for the expression of preferences about how content is collected and processed for Artificial Intelligence (AI) models. Suresh Krishnan AIPREF Working Group Co-chair Mark Nottingham AIPREF Working Group Co-chair 27 Feb 2025 Suggested IETF 122 Sessions for Getting Familiar with New Topics These IETF 122 meeting sessions are likely to include discussions and proposals that are accessible to a broad range of Internet technologists whether they are new to the IETF or long-time participants. 21 Feb 2025 IETF email service transition completed on 24 February The IETF email processing infrastructure transition planned for 0900-1100 UTC on 24 February has been completed. Robert Sparks Senior Director of Information Technology 14 Feb 2025 New Participant Program Registration now open for IETF 122 Bangkok We are happy to announce that registration is now open for the first edition of an expanded New Participants Program during the IETF 122 Bangkok meeting! Michelle Cotton IETF New Participant Ambassador 7 Feb 2025 Show all Show filters Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter Filter by topic and date Topic All General Area Transport Area (tsv) Operations and Management Area Internet Architecture Board News Internet of Things Security & Privacy IRTF Applications and Real-Time Area IETF-LLC Security Area (sec) Date from Date to Filter IETF Administration LLC 2025 Budget Jay Daley IETF Executive Director 22 Jan 2025 The IETF Administration LLC has finalised its budget for 2025. The IETF Administration LLC 2025 Final Budget is made up of the following:BudgetMeetings budgetChart of accountsCommunity consultationA draft budget was shared for community consultation and no changes were made as a result, though other changes were incorporated that are sufficiently immaterial (increase to net income of $9,150) to not require a further consultation.Key assumptionsISOC contribution as per our agreementIETF 123 & IETF 124 meetings will have a slightly increased fee structure.RPC cost structure has changed from prior yearsIncrease cost of airfareNo additional employeesInvestments rate of return is 2.2% over the year, as confirmed with our investment advisorsUp to 2.5% inflation reflected in staff and some contract costsSummary Summary of 2025 budget and comparison to 2024 2025 Draft Budget 2024 Budget Variance Non-Meeting Revenue $ 9,149,340 $ 9,271,173 $ (121,833) Meeting Revenue $ 4,474,293 $ 4,147,704 $ 326,589 Revenue $ 13,623,633 $ 13,418,877 $ 204,756 Operating Expenses $ 7,071,604 $ 7,123,163 $ 51,559 Meeting Expenses $ 4,978,805 $ 5,076,232 $ 97,427 Expenses $ 12,050,409 $ 12,199,395 $ 149,986 Net Income $ 1,573,224 $ 1,219,482 $ 353,742 Capital Expenditure $ 937,930 $ 1,015,942 $ 78,012 Net Income after Capital $ 635,294 $ 203,540 $ 431,754 Key Changes from 2024Budget changes:InvestmentsThe budget for Investment income is lower due to using 2.2% vs. 4% as advised by Goldman Sachs. This is a decrease of ($300,833)Key ContractsThe Secretariat contract decreased with the IT changes, but increased for inflation and the loss of a multi-service discount, leaving a net increase. The RPC contract changed to a cost plus contract and absorbed the RPC Tools Refresh PM contract, creating a positive variance to 2024’s budget.Meetings:Sponsorship revenue budgeted decreased slightly due to Global Sponsor changing to Global Host and therefore being recognized differently. Meeting Rebates & Comps budgeted decreased due to less Subvention Grants and VAT recovery.Meeting venue costs are significantly lower, but travel costs have increased due to increased airfare costs.Administration:Inflationary increase in all wages at a maximum of 2.5%.Adjustment for actual payroll process fees was less than expectedConference Services in-kind contributions of $58,050 was not budgeted for in 2024Professional Development and Staff Meeting costs together increased from the 2024 budget due to increased staff in 2024 and managing the RPC staffTools:No additional staff budgeted for 2025 (one position remains vacant).There is a reduction of Tools expenses by $693,490 due to using internal staff vs contractors for projects.Depreciation budgeted in 2024 was below the need to cover all of the CapEx in the last few years, so the 2025 budget reflects an additional $500,000 of depreciation.Increase in registration feesWe last increased the registration fees in July 2023, following a report to the community and consultation. The increase was based on US inflation in the eight years since the previous increase, to January 2023, resulting in a rise of ~25% across the boardAt that time, the board set a policy that the fees should be increased annually, during the annual budget process, using US inflation since the last increase. Unfortunately, this was not followed for the 2024 financial year, meaning that the rise this year will be slightly higher to compensate.The fees have been reviewed using the official US inflation calculator, which gives the inflation rate from January 2023 to October 2024 (latest) as 5.51%. Using that for the increase, and with some rounding, we get the following fees, to be effective from July 2025: Meeting registration fees from July 2025 ONSITE REMOTE Old New Increase % Old New Increase % Week Super Early $875 $925 5.71% $250 $264 5.60% Early $1,095 $1,155 5.48% $310 $327 5.48% Standard $1,200 $1,265 5.42% $360 $380 5.56% One Day Super Early $470 $495 5.32% $140 $148 5.71% Early $590 $620 5.08% $170 $180 5.88% Standard $645 $680 5.43% $200 $210 5.00% Student $150 $160 6.67% $55 $58 5.45% Share this page PreviousRFC Production Center management transition NextNet zero update for 2024"
