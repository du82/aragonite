["https://iflscience.com/about"]
title = "About | IFLScience"
description = "We’re dedicated to entertaining, educating, and sparking curiosity about the world around us – and beyond."
full_description = "Welcome to IFLScience – where science becomes educational and entertaining. Our platform is dedicated to demystifying the world of science and making it accessible and enjoyable for everyone. Through our commitment to high-quality journalism, and accurate and engaging content, we aim to ignite curiosity and deepen the understanding of the scientific phenomena shaping our world.Our HistoryIFLScience Limited is a UK-based science website that is part of LabX Media Group.IFLScience started as a Facebook page devoted to memes and science content in 2012 whereafter it evolved into a global go-to website for engaging, amusing, and thought-provoking science articles.Our MissionAt IFLScience, our mission is to share the wonder and relevance of science with a global audience. We strive to present scientific knowledge in a way that is not only accessible but also engaging, breaking down the barriers between the scientific community and the public. Our content covers a vast array of topics, from the latest breakthroughs in research to the environmental challenges facing our planet, all aiming to inform, educate, and inspire our readers.Learn more in our editorial mission statement here.Our TeamBehind IFLScience is a team of award-winning journalists and editors, each with expertise in various scientific fields, from doctors to best-selling authors. Our team members hold bachelor’s, master's, and doctorate degrees in a range of disciplines, including biochemistry, astrophysics, quantum mechanics, anthropology, neuroscience, pure mathematics, forensic science, human biology, zoology, medical genetics, and more. IFLScience also has a skilled digital media team consisting of video creators, editors, producers, animators, and social media and marketing experts who bring our content to life. Meet our team here.What We DoWe bring science to life through: News Reporting: Covering the latest scientific discoveries in an accurate, informative, thought-provoking, often amusing, and always accessible manner.Explainers: Simplifying complex scientific concepts for a general audience.Opinion Pieces: Expert insights and commentary on current scientific debates and developments.Multimedia Content: We elevate our storytelling by incorporating a diverse range of multimedia elements, including videos, infographics, eBooks, and exclusive digital offerings like our 'Curious' magazine and 'The Big Questions' podcast. These products are designed to deepen and enrich the reader's experience, bringing science to life in engaging and innovative ways.Our ValuesIFLScience is guided by core values that reflect our commitment to science communication: honesty, integrity, transparency, evidence-based reporting, impartial politics, accessibility, and making science fun.We are dedicated to upholding journalistic values, ethical reporting, transparency, and proper crediting while sharing the discoveries, wonders, and leaps forward in science.Integrity and Accuracy: We are dedicated to factual correctness, relying on credible sources and thorough fact-checking and crediting. Learn more about our correction policy here and our fact-checking policy here.Curiosity: We foster a culture of curiosity, encouraging our team and our readers to explore and question the world around them.Engagement: We believe in making science engaging and fun, breaking down the stereotypes of science as inaccessible or dry.Community: We aim to build a community where science enthusiasts can share their passion, learn, and engage in meaningful conversations. Learn more about our social media use and comments policy here.Why You Can Trust UsIFLScience adheres to strict data privacy standards, ensuring that our readers' information is protected and used responsibly in line with global privacy regulations. Learn more about our privacy policy here.We are committed to transparency, see our transparency policy here.IFLScience has high credibility. We received a 100/100 green independent journalistic standards rating by NewsGuard for consecutive years. For a full explanation of the nutrition label click here.Image credit: NewsGuardIFLScience has been rated high for factual credibility by Media Bias/Fact Check.Our ReachIFLScience reaches over 10 million monthly global visitors through our website and 60 million globally through our social media channels.Learn more about our reach and audience here.Advertising PolicyRead our policy that outlines our approach to advertising to maintain the trust and integrity of our platform here. If you are interested in advertising with us, you can contact us here.Editor’s NoteIn an era where the accuracy and reliability of science communication are paramount, IFLScience emerges as a distinguished science publication. We pride ourselves on making science both accessible and engaging, breaking down complex barriers, and ensuring the delivery of trustworthy news and content. Our commitment to credible science media content resonates through our coverage across our website, social media, and digital platforms. As we continuously evolve, we've broadened our scope and audience engagement with innovative offerings like our journalist-led podcast series 'The Big Questions' and our monthly digital magazine 'Curious'. These platforms provide exclusive, in-depth content ranging from feature articles and interviews to captivating science photography and beyond. As a leading voice in science communication, IFLScience empowers our readers and viewers to make sense of the world's most significant developments. Whether it's debunking myths surrounding controversial scientific debates or presenting insights from some of the most esteemed thought leaders in the scientific community, our approach is quintessentially IFLScience: making serious science enjoyable and engaging in initiatives that aim to better the future of humanity. We invite you to join us in our mission to enlighten and improve the world. Together, let's make a difference. Johannes Van Zijl, Managing DirectorMembershipsWe’re excited to introduce our new membership model, a chance for you to play a direct role in shaping the future of accessible, engaging science communication.By joining, you’re not just supporting a platform that makes science understandable and exciting, you’re becoming part of a community that values curiosity, discovery, and truth. Whether it’s debunking myths, diving into groundbreaking discoveries, or exploring how science impacts our everyday lives, your support helps us focus on what truly matters: delivering exceptional content, empowering our team, improving our offerings, and ensuring a great experience for you, our readers. Discover more about what’s next for IFLScience and how you can be part of it here.Follow UsGoogle NewsFacebookInstagramThreadsYouTubeFlipBoardXTikTokRedditContact UsWe welcome feedback, inquiries, and the sharing of ideas. If you have a question, comment, or story to share, please reach out to us here. Interested in writing for us? See our features and op-ed pitch submission details here."
