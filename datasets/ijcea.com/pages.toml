title = "International Journal of Computer Engineering and Applications – IJCEA"
full_description = "ISSN : 2321-3469 Frequency : Monthly DOI : 10.30696/IJCEA Editor in Chief : Prof. Dehmet Sahunghi UGC Approved : YES IJCEA International Journal of Computer Engineering and Applications is a scholarly peer-reviewed open access academic journal. The journal covers the frontier issues in the computer science and their applications in business, industry and other subjects. The computer science is a branch of engineering science that studies computable processes and structures. It contains theories for understanding computing systems and methods; computational algorithms and tools; methodologies for testing of concepts. The subjects covered by the journal include artificial intelligence, bioinformatics, computational statistics, database, data mining, financial engineering, hardware systems, imaging engineering, internet computing, networking, scientific computing, software engineering, and their applications. The journal is accessible to accredited universities and government libraries. All the papers in the journal are also available freely with online full-text content and permanent worldwide web link. The abstracts will be indexed and available at major academic databases. IJCEA International Journal of Computer Engineering and Applications welcomes author submission of papers concerning any branch of the computer science and their applications in business, industry and other subjects. The subjects covered by the journal include artificial intelligence, bioinformatics, computational statistics, database, data mining, financial engineering, hardware systems, imaging engineering, internet computing, networking, scientific computing, software engineering, and their applications. At IJCEA, we are committed to upholding the highest standards of quality, integrity, and excellence in scholarly publishing. Our quality policy serves as a guiding principle for all aspects of our journal's operations, from manuscript submission to publication and beyond. Cr