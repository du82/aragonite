full_description = '''The story behind the productHandwoven BRÖNDENWith a striking, detailed design by Akanksha Deo – the BRÖNDEN rug is a celebration of the hands that have so skillfully woven it. Think of it like a painting for your floor – only softer and cosier! Play Hej, Akanksha!Originally from India, IKEA designer Akanksha takes a keen interest in textiles, traditional handcraft and natural materials. The BRÖNDEN rug was a chance to showcase and celebrate the diversity of weaving techniques in a highly visual way. "The brief was to create a rug that almost screams 'handmade', and the value in it." – Akanksha Deo 1/3'''
