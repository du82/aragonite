full_description = 'Skip to product list 90 Day returns Products Tables & chairs Dining furniture Dining tables { "@context":"https://schema.org", "@type":"BreadcrumbList", "itemListElement": [ { "@type" : "ListItem", "position": 1, "name": "Products", "item": "https://www.ikea.com/ae/en/cat/products-products/" } ,{ "@type" : "ListItem", "position": 2, "name": "Tables &amp; chairs", "item": "https://www.ikea.com/ae/en/cat/chairs-fu002/" } ,{ "@type" : "ListItem", "position": 3, "name": "Dining furniture", "item": "https://www.ikea.com/ae/en/cat/dining-furniture-700417/" } ] } Dining tables 2 seater dining tables 4 seater dining tables 6 seater dining tables 8 seater dining tables 10 seater dining tables Extendable tables Wall-mounted tables Dining table tops & underframes Round tables Show all categories (+1) Dining tables are the heroes of the home. They play so many roles from home office to game central to, well, the place you eat your meals. You can have a table from 2 seats up to 4, 6, 8 & 10 seats. Some are also extendable tables. So find your style and buy modern dining room set online.Take your pick at our smorgasbord of tablesWhether you have friends over for brunch, a candle-lit date-night dinner or something in-between, table requirements change constantly. Luckily, we have extendable tables that go well with every occasion, but especially your home. Think of how you use it, the style you want – then find the right table for you.See all extendable tablesProduct information pageProduct information pageProduct information pageProduct information pageProduct information pageProduct information pageProduct information pageProduct information pageProduct information pageProduct information pageProduct information pageProduct information pageProduct information pageProduct information pageProduct information pageProduct information pageProduct information pageProduct information pageSee all extendable tablesSort and Filter65 itemsCompareResults listCompareTop s