full_description = '''Skip to product list Products Rugs & mats Free accessories delivery on orders over Dhs 250. Free furniture delivery on orders over Dhs 950. Shop now! { "@context":"https://schema.org", "@type":"BreadcrumbList", "itemListElement": [ { "@type" : "ListItem", "position": 1, "name": "Products", "item": "https://www.ikea.com/ae/en/cat/products-products/" } ] } Rugs & mats Rugs Outdoor flooring Door mats Bath mats Round, plush, or square? We love rugs in equal parts for their ability to liven up a room. Not to mention they can help create a sense of definition in your space. Looking for something for the outdoors? Check out the selection of IKEA outdoor flooring that'll upgrade your space in an instant!The first step towards a good night’s sleep A soft rug by the bedside works like a bumper between a hectic day and the sleeping hours. To sit on the bedside with your feet resting on the plush rug is a shortcut to put your body and mind into a relaxed mode. In the morning that same rug makes sure you don’t get cold feet about the day ahead.Product information pageProduct information pageProduct information pageProduct information pageProduct information pageProduct information pageProduct information pageProduct information pageProduct information pageProduct information pageProduct information pageFriend of your feet and floorsFrom the day’s first step to moving about your home, rugs literally add a layer of comfort to the room. The cosiness aside, a thick stain-resistant STOENSE rug – available in a variety of sizes and colours – also helps to calm things down by reducing noise.Product information pageProduct information pageProduct information pageProduct information pageSmaller rugs can have a big impactYou don’t need a big rug to give the mood in a room a big boost and get a more personal look. You can combine smaller rugs to fit your space, like in this long hallway, for example. And a small rug could be the perfect size for a smaller room or area in your home.See all runners & small rugsProduct information pageProduct information pageProduct information pageProduct information pageSee all runners & small rugsThe perfect canvas for any living spaceSkip listingChoosing the right rug for your dining tableHow to choose and place bedroom rugsHow to calculate how much decking you needSo good you could sleep on itThere’s not much cosier than feeling a soft wool rug under your feet. Our handwoven wool rugs are super resilient and add a personal touch to any room. Whether you want a modern geometric pattern or a more textured weave, our wool rugs make you want to stop what you’re doing and roll around on the floor.Product information pageProduct information pageProduct information pageProduct information pageProduct information pageProduct information pageTips and ideas for a more sustainable homeSkip listingEnergyWasteWaterFurnitureReusablesFoodEveryday actions matter. See some ideasClick and collectOrders that you pick up yourselfLearn moreDelivery servicesThe available delivery options depend on the type of product you order.Learn more'''
