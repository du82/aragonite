["https://www.ikea.com/global/en/stories/design/mattress-myths-250212"]
title = "Debunking the myths around mattresses – IKEA Global"
description = "Buying a new mattress can be a big commitment. Making the change can be costly, and how can you be sure you've made the right choice for the many sleeps ahead? Thanks to decades of home furnishing knowledge and insights, we know what does – and doesn't – ensure the best rest. Let's bust some common myths surrounding our favourite bedtime companion, shall we?"
full_description = "Debunking the myths around mattressesBuying a new mattress can be a big commitment. Making the change can be costly, and how can you be sure you've made the right choice for the many sleeps ahead? Let's bust some common myths surrounding our favourite bedtime companion, shall we? Play video At IKEA, thanks to decades of home furnishing knowledge and comfort insights, we know what does – and doesn't – ensure the best rest. All our mattresses are designed, made and tested for real life at home. The team at the IKEA Test Lab facility in Älmhult, Sweden, has been putting IKEA products through their paces since the 1960s, while our Comfort Lab is dedicated to researching exactly what helps us to feel comfortable and relaxed. All this experience is how we've come to know more than a few common mattress misconceptions, and why we're always eager to help and demystify them! Myth #1More springs mean higher quality Myth #2A thicker mattress means more comfort Myth #3The higher the price tag, the better the mattress A spring in your sleepIt's not the number of springs in the mattress that counts; it’s the position and design of the spring that makes a difference. Our mattresses are designed to meet the many different needs of our customers around the globe. For example, our pocket sprung mattresses feature comfort zones – areas where the body needs extra support, such as the hips, shoulders and spine. Placing the springs in just the right place provides the body with the support it needs and helps keep you aligned while you sleep.Our VÅGSTRANDA pocket-sprung mattress has an innovative double layer of springs arranged in a wave shape, for double comfort and support. The springs seamlessly follow the curvature of the spine, while the extra layer makes the mattress more responsive to movement and relieves pressure points. Less is moreWith a focus on our Democratic Design principles: Form, function, quality, affordability and sustainability, along with our frugal Småland heritage, we believe it’s not about the amount of materials you use, but how you use them. Our team checks every layer to ensure we’re using the best materials for the job, and how we can make our mattresses even better.We continuously develop new designs and materials to create mattresses with the lowest impact. For example, thinner springs that use less metal, and layers that are easy to separate, are just some of the ways we're improving our mattresses for both sleep and sustainability.Working smarter and leaner also means less waste and lower costs, making our mattresses even more affordable. Quality at a low priceAt the heart of every IKEA product is quality with a low price tag – it’s a part of our DNA. Our teams of designers and engineers have been developing IKEA mattresses for decades. Combined with our Life at Home Report knowledge and insights from our comfort lab, not to mention a good bashing in our test lab, we not only know what keeps the many people awake at night but also what helps them sleep.When it comes to an IKEA mattress, there’s no preferential treatment for any of our mattresses – they all undergo the same rigorous tests, regardless of their price. In the IKEA Test Lab, every mattress is rolled over, sat on, scratched and even set alight as it endures more than 100 tests and quality requirements prior to production.All our mattresses are produced as part of our integrated value chain, so everything from design and materials to construction, quality, and, of course, cost is uniquely IKEA. And what’s more, they all come with our 10-year guarantee. Myth #4Getting rid of an old mattress is a real nightmare! Myth #5... and choosing a new one is even harder! Out with the oldTime flies when you’re sleeping well, but the general rule of thumb when it comes to investing in a new mattress is every 8-10 years. But what to do with our former sleeping partner? Disposing of IKEA mattresses has become even easier and more sustainable thanks to our mattress removal service*.*Check your local IKEA website for availability. In with the newChoosing the right mattress is as personal as you. With decades of experience and an entire lab dedicated to comfort, we’ve got all bases covered. Every IKEA mattress is designed with comfort, materials and support in mind, inspired by the different sleeping preferences of the many people around the globe.Have you tried the IKEA Comfort guide? Our helpful online questionnaire matches you with the mattress that’s just right for you. A new mattress is certainly something to sleep onDon't let your old mattress keep you awake. From soft to firm, springs to memory foam we've got just the right mattress for you. Visit your local IKEA store or click below to find your perfect new sleep partner."
year_published = 2025
