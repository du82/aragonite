title = "Customer service - IKEA"
description = "Say hello to our customer services. This is the place to find out about everything from returns and claims,  planning tools, deliveries and stock check to how to track your order and even how to shop at IKEA. It’s so easy to get the assistance you need. So how can we help you?"
full_description = "Customer ServiceHow can we help you? Welcome, it’s great to see you. Whatever you need, we’ve got the answers, the help, and the services to make sure you have a great IKEA experience. Track my order All services Product support How to shop Payment & finance methods IKEA Gift card Frequently asked questions Contact us Privacy and security Show all categories (+1) Helping you help yourself Looking to check the status of your order? Want to return a product or order a spare part? We have convenient self service options which will let you do just that! Track my orderCheck the delivery statusCheck it nowGift card balanceCheck your gift card balanceCheck it nowReturn or exchange productsFor an exchange or refund, you can return your unopened products within 90 days. Read moreSpare partsFind and order screws, cam locks, dowels and more for your IKEA products.Read moreFrequently Asked Questions Can I track my order?Yes, you can track your order status. All you need is your order number (10-digit number on the sales request pagt. Find out more here. How do I get the IKEA shopping app?Download free IKEA Store app via App Store (iOS) or Google Play (Android)Can I return or cancel an online order?For an exchange or refund, you can return your products within 90 days, Simply return the unopened items and please return them with proof of purchase.Find out more about Return policy.Can I collect my order?Our collection points are open 24/7 to collect your order(except Al Wahda collection point . Find out more about click & collect service.Do you have installment service?If you've found out how you want your dream home, but need some help spreading the cost, we can offer you a range of finance options to help you make your ideas a reality. Find out more about finance optionsHow much does it cost to have the products delivered to my home?When you shop online, you can see the delivery cost before finalising your purchase. This amount is calculated according to the value of the products being delivered and where they're being delivered to. Find out more about our delivery service. Contact usToll free 800 4532 Phone: +971 4 203 7555Fax: +971 4 203 7620IKEA Business: +971 4 203 7568 / 04 203 7572Find an IKEA near youVisit us in store and get inspired. We're open and excited for your visit. Browse our products, walk through our room settings, and grab a bite to go.Find your IKEARelatedIKEA Cookie PolicyTerms and conditions - IKEAVoice assist"
