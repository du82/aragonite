2319 ou un chargeur mobile universel VARMFRONT 5 200 mAh (modèle E2037), date de fabrication (AASS) 2318, 2319 ou 2322 d’en cesser toute utilisation et de contacter IKEA pour obtenir un produit de remplacement ou un remboursement intégral.Plus d'info IKEA rappelle le chargeur USB ÅSKSTORM 40W en raison d'un risque de brûlures thermique et choc électrique. IKEA demande instamment à tous les clients qui possèdent un chargeur USB ÅSKSTORM 40W gris foncé, article numéro 50461193, de ne plus l'utiliser et de contacter IKEA pour obtenir un remboursement complet. Plus d'infoBienvenue chez IKEA. Nous nous efforçons d’améliorer le quotidien du plus grand nombre. Nos meubles et accessoires d’aménagement intérieur ont un design unique, sont fonctionnels, et produits dans le respect du développement durable. Chez IKEA, vous trouverez l’inspiration pour rendre votre intérieur aussi agréable à vivre que possible. Découvrez nos canapés, rêvez à votre prochaine cuisine, essayez nos matelas et lits boxspring, ou concevez vo'''
