["https://www.ikea.com/global/en/stories/design/mavinn-collection-handcraft-social-enterprises-240822"]
title = "The MÄVINN collection – IKEA Global"
description = "Contemporary craft. Job generators. Welcome the latest MÄVINN collection, in collaboration with social businesses and artisans in Bangladesh, India and Jordan. Dive in!"
full_description = '''Making waves with MÄVINN Close your eyes. Go on! OK, are they shut? Good. Now imagine you’re in a bustling, lively market. Delicious scents fill the air, sunlight warms your skin, vibrant colours, unusual objects and persuasive sellers are everywhere to be seen. Is your curiosity ready to play? Then it's time to meet the latest MÄVINN collection! Play video The MÄVINN collection is contemporary craftsmanship at its finest – generating jobs where they are needed most. Designers Maria Vinka and Paulin MachadoThe golden threadIt’s been 12 years since IKEA first started collaborating with social businesses around the world. The new MÄVINN collection is the latest culmination of these partnerships, with an assortment of unique, handmade products designed to create jobs for women and marginalised groups in regions where employment is most needed.Pieces in the collection were designed by Maria Vinka and Paulin Machado. For Maria, being a part of these projects since the very beginning has been a singular joy. “Working with design, you want to do things better. You want to make things more beautiful, or more fun, or more useful,” says Maria. “But when you incorporate that you are also helping people in need, it is a double happiness. It feels good in your heart and what’s not to like about that? If you’re asked to do this kind of project, it’s impossible to resist!” At its heart, the project is a true exchange of ideas and skills, says Maria. “The artisans get a little glimpse into our world, we get a glimpse into their world and together we create something fantastic.” For the love of jute, cotton and ingenuityWhile every product in the collection has its own expression, the materials, colours and recurring patterns bring them together. Cotton and jute are both wonderfully versatile, natural materials and can be found – either together or alone – in each and every item in the MÄVINN collection. But the material choices run deeper than simply creating a cohesive collection. Different regional skills develop around the materials available. “It’s embroidery here, banana leaves there, jute elsewhere,” says Maria. “Different skills grow in different areas because the artisans try to work with locally sourced materials. The resourcefulness is inspiring.” Play video Like no other “We really hope that people with eyes for design and handicraft will love the range,” says Maria. “Those who value small details – something with a little extra twist. A lot can be done without making something very expensive.” The slight variations in each piece are to be celebrated! They are the marks of the human mind and hand at work. It’s all in the details, like the embroidered four-leaf clover on a bathrobe and cushion cover or the handmade tassels on a throw. The hands behind handmadeSince its inception, IKEA Social Entrepreneurship has continued to blossom, with more and more people choosing to take part. "If you strengthen a small group, the ripple effects can be felt through their families and out into the entire community," says Maria. Artisans Bhawari Devi and Bhawari Devi (yes, they share a name!)Today, the partnerships with social businesses and artisans generate work for 11,000 people in Bangladesh, India and Jordan. Get to know the fantastic organisations that create each piece of the MÄVINN collection. SPUN, IndiaSPUN was initiated by the IKEA supplier Welspun to take social responsibility in the rural areas where they operate. They create jobs and offer handicraft technique training for rural women far from the labour market, strengthening the region overall. Ramesh Flowers, IndiaRamesh Flowers creates long-term employment for female artisans in India. Handcrafted items are made from natural waste materials such as nutshell, bark and more. From a team of just five people, Ramesh Flowers has grown to over 700 employees. Classical Handmade Products, BangladeshClassical Handmade Products specialise in sustainable, handmade products that use only garment waste and natural fibres. The production is located in rural areas, allowing families to stay in their home villages. Jordan River Foundation, JordanIKEA partnered with the organisation in 2017 in the wake of the Syrian war, when millions of refugees fled to Jordan. The aim is to create jobs and help integration between refugees and local artisans through handicraft skills. Previous slide Next slide "Our partnership with IKEA has ensured that women get jobs and a regular income. Many have felt empowered to take on more responsibilities in the organisation. Now, we hope to reach even more people with our offer. It’s one small step to a more interconnected, humane world.” – Sumita GhoseFounder Rangsutra It's time for some MÄVINN magicThe MÄVINN collection has officially dropped. Go on - take a tour! If the collection isn't yet available or is not available in your country, we’ll instead take you to see more inspiring products and collections for the home.'''
year_published = 2025
