["https://www.ikea.com/global/en/stories/design/ikea-icons-2023"]
title = "The IKEA icons quiz – IKEA Global"
description = "Put your IKEA knowledge to the test with a quiz of fun facts about the IKEA icons. Smart designs, low prices: we're paying tribute to 30 iconic products that have come to define the IKEA range."
full_description = "Unmistakably IKEASmart designs, low prices: we're paying tribute to 30 iconic products that have come to define the IKEA range. Hey, you may even spot a few that you have in your own home! So, you think you’re a fan?Put your IKEA knowledge to the test with a quiz of fun facts about the icons. Take the quiz Open card Close card IKEA PS 2002 Watering canDesign Monika Mulder, 2002Blue, purple, green! Produced in more than 15 hues, this watering can, originally called IKEA PS VÅLLÖ, is one of our most colourful products. Open card Close card BURVIKSide tableDesign Mikael Axelsson, 2018Lightweight and portable with a playful form, this side table truly puts the “fun” in functional. Open card Close card IKEA PS LÖMSKSwivel chairDesign Monika Mulder, 2003Twenty years on, kids around the world still love curling up, spinning around, and hiding away in this cosy chair. Open card Close card KYRREStoolDesign Charlie Styrbjörn and Mikael Axelsson, 2019Sturdy and stackable KYRRE was inspired by traditional three-legged milking stools: long favoured by farmers for not wobbling on uneven ground. Open card Close card POÄNGArmchairDesign Noboru Nakamura, 1976POÄNG was the joint effort of designer Noboru Nakamura and product developer Lars Engman, who would later co-create the one and only KLIPPAN sofa. Open card Close card KLIPPANSofaDesign Noboru Nakamura, 1980Back in the day, sewing patterns for KLIPPAN sofas were sold so you could make your own custom cover in any fabric. Open card Close card MAMMUTChildren’s chairDesign Morten Kjelstrup/Allan Østgaard, 1993Inspired by the wacky world of comics, the playfully chunky legs of this chair also provide extra stability for little ones. Open card Close card TURBOClothes rackDesign Marcus Arvonen, 2011Pondering the day’s outfit may well take longer than piecing together this easily-assembled clothes rack. Open card Close card FAMNIG HJÄRTACushionDesign Anna Efverlund, 1998Serving soft snuggles and hugs for 25 years and counting. Open card Close card SINNERLIGPendant lampDesign Ilse Crawford, 2015This pendant lamp is the fruit of IKEA’s first partnership with acclaimed designer Ilse Crawford, whose work is noted for its timelessness and focus on sustainability. Open card Close card SÖDERHAMNSofaDesign Ola Wihlborg, 2013 It’s one of our softest, snuggliest and most flexible sofa series. That might explain why, for ten years, it has also been one of our most popular. Open card Close card CHILIFRUKTVaseDesign Mikael Axelsson, 2021 The same pinched lip that holds single-stem flowers in place makes this vase a great watering can, too. Open card Close card IKEA 365+CarafeDesign Wiebke Braasch, Nike Karlsson, Henrik Preutz, Ola WihlborgOur experience tells us that most people keep water in the door of the fridge so we measured the shelves in fridge doors around the world to get the size of this carafe just right. Open card Close card FRÖSETChairDesign Sarah Fager and Henrik Preutz, 2020Bentwood furniture has long been a part of the Scandinavian design language. The FRÖSET chair offers a contemporary take on this technique – offering timeless style at a more accessible price. Open card Close card DUKTIGPlay kitchenDesign Mikael Warnhammar, 2007The designer based this play kitchen on the full-size VÄRDE kitchen series, sold back in 1998. Open card Close card LAMPANTable lampDesign Magnus Elebäck, Carl Öjerstam, 2002We did everything to keep the price of this lamp down – even skipping the packaging! Turned upside down, this lamp base fits perfectly inside the shade, protecting it during transport. Open card Close card BORGEBYCoffee tableDesign Johanna Jelinek, 2020This coffee table might just be the textbook definition of Scandinavian design: light wood, simplified forms, and built-in storage to boot! Open card Close card STOCKHOLMRugDesign Anna Sörensson, 2006Stripes, black & white, and 100% wool: the three key ingredients of this time-defying favourite for floors. Open card Close card IKEA PS 2014Pendant lampDesign David Wahl, 2014Resembling something between a planet and spaceship, it probably comes as no surprise that this lamp’s designer is a serious science fiction fan. Open card Close card ODGERChairDesign John Löfgren and Jonas PetterssonDeveloping the ODGER chair was a challenge but thanks to its straightforward click mechanism, assembly couldn’t be more simple. Open card Close card LOBERGETSwivel chairDesign Carl Öjerstam, 2019For designer Carl Öjerstam, the challenge was to design a comfortable desk chair using just 1 kg of material. LOBERGET was the result! Open card Close card JANINGEChairDesign John/Jonas/Petrus/Paul/Caroline, 2014This strong and sturdy chair even passed ANSI BIFMA: the toughest quality certification for furniture for public-use. Open card Close card IKEA PS SKÅPCabinetDesign Nicholai Wiig Hansen, 199950% sideboard, 50% changeroom locker, 100% timeless style. Open card Close card STOCKHOLMMirrorDesign Ola Wihlborg, 2014The lower, wider part of the mirror frame doubles as a small shelf – the perfect parking spot for keys and make-up. Open card Close card SYMFONISKTable lamp with WiFi speakerDesign Andreas Fredriksson/Iina Vuorivirta, 2019No more dancing in the dark! The SYMFONISK table lamp with WiFi speaker was created in collaboration with world-leading wireless home audio specialists Sonos. Open card Close card LISABOCoffee tableDesign Knut Hagberg and Marianne Hagberg, 2016This table was among the first to feature simple wedge-dowel technology that has revolutionized the assembly of IKEA furniture. Open card Close card BRUSENOutdoor sofaDesign Ola Wihlborg, 2019Designer Ola’s goal was to create a durable, decorative sofa for outdoor use, but many think it’s so nice that it’s even found its way indoors. Open card Close card RISATORPBasketDesign Wiebke Braasch, 2015RISATORP takes its name from a small town in southern Sweden surrounded by forests. If you ever visit Risatorp, this handy basket could make a great foraging companion! Open card Close card KRUXLED work lampDesign Monika Mulder, 2018With its forward-facing ‘ears’ and adjustable arm and head, the KRUX LED work lamp has been lighting up children’s rooms since 2018. Open card Close card IKEA PS 1995ClockDesign Thomas Eriksson, 1995A real piece of Swedish history! This clock is part of the permanent collection of the National Museum in Stockholm, Sweden."
