ucten bij jullie thuis","VUGC_GETTING_FEATURED_TITLE":"Laat je inspireren door andere IKEA shoppers, op basis van jouw recent bekeken producten! Ontdek hier hoe je in de spotlight komt te staan."},"items":[],"shoppableFragmentsProps":{"url":""},"compactFragmentsUrls":{},"roomFilterItemsProps":{"roomFilterItems":[],"preSelectedFilterId":"all"},"optimizely":{"shouldSendUserBucketedEvent":false},"dataUrl":"/be/nl/content-rec/fragments/dynamic/data/long-feed-imc.json","startIndex":1,"requestId":null,"numberOfItemsToLoad":6,"gridType":"grid3","title":"Meer ideeën en inspiratie","filterBarDisabled":false} Belangrijke informatie IKEA roept bepaalde ledlichtsnoeren en ledlampen voor buiten met een niet-conforme stekker terug uit de productfamilies LEDLJUS, SOMMARLÅNKE, STRÅLA, SVARTRÅ en UTSUND. IKEA verzoekt alle klanten die ledlichtsnoeren en ledlampen voor buiten hebben uit de productfamilies LEDLJUS, SOMMARLÅNKE, STRÅLA, SVARTRÅ en UTSUND die onder de terugroeping vallen met klem om die niet langer te gebruiken en contact op te nemen met IKEA. Door een productiefout voldoet de stekker van die producten niet aan een toepasselijke veiligheidsnorm, waardoor het risico bestaat op elektrische schokken. De betrokken producten zijn te herkennen aan de naam van de led-driver, de datumstempel van de led-driver en de naam van de stekker (zie hieronder voor meer details). Meer info IKEA roept bepaalde VARMFRONT powerbanks terug vanwege brandgevaar. IKEA verzoekt alle klanten met een VARMFRONT powerbank 10 400 mAh (modelnummer E2038) met datumstempel (JJWW) 2313, 2316, 2318 en 2319, of een VARMFRONT powerbank 5 200 mAh (modelnummer E2037) met datumstempel (JJWW) 2318, 2319 en 2322, met aandrang om het gebruik ervan te stoppen en contact op te nemen met IKEA voor vervanging of een volledige terugbetaling.Meer info IKEA roept ÅSKSTORM 40W USB-oplader terug wegens gevaar voor thermische brandwonden en elektrische schokken. IKEA dringt er bij alle klanten die een ÅSKSTORM 40W USB-lader in het donkergrijs met artikel nummer 50461193 in hun bezit hebben, op aan deze niet meer te gebruiken en contact op te nemen met IKEA voor een volledige terugbetaling. Meer infoWelkom bij IKEA. Wij proberen het dagelijkse leven voor zo veel mogelijk mensen te verbeteren. Onze betaalbare meubelen en woonaccessoires hebben een uniek design, zijn functioneel en duurzaam geproduceerd. Bij IKEA vind je inspiratie om jouw interieur zo mooi en leefbaar mogelijk te maken. Bekijk onze zetels, droom alvast van een nieuwe keuken, probeer onze matrassen en boxspringbedden, of ontwerp je eigen kleerkast. Voor sfeervolle meubelen voor buiten neem je een kijkje bij onze tuinmeubelen. Koop je meubels & woondecoratie voor een lage prijs online of in je IKEA winkel. Thuislevering vanaf €2,99 voor België en Luxemburg. We bieden ook een verscheidenheid aan services om tijd te besparen.'''
