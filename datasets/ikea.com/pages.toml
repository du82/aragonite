hs 1095(2)More optionsTONSTAD Bed frame with storage, 160x200 cm Dhs2,495Price Dhs 2495More optionsTONSTAD Bed frame with storage, 160x200 cm Dhs2,495Price Dhs 2495More optionsLimited editionSLATTUM Upholstered bed frame, 160x200 cm Dhs595Price Dhs 595(15)More optionsNew Lower PriceTARVA Bed frame, 160x200 cm Dhs695Price Dhs 695Previous price: Dhs795Dhs 795(4)More optionsBJÖRKSNÄS Bed frame, 160x200 cm Dhs2,095Price Dhs 2095(1)More optionsNew Lower PriceTUFJORD Upholstered bed frame, 160x200 cm Dhs2,145Price Dhs 2145Previous price: Dhs2,445Dhs 2445(1)More optionsSLATTUM Upholstered bed frame, 160x200 cm Dhs595Price Dhs 595(15)More optionsTONSTAD Bed frame with storage, 90x200 cm Dhs1,595Price Dhs 1595More optionsTONSTAD Bed frame with storage, 90x200 cm Dhs1,595Price Dhs 1595More optionsRAMNEFJÄLL Upholstered bed frame, 90x200 cm Dhs665Price Dhs 665More optionsNew Lower PriceTARVA Bed frame, 90x200 cm Dhs395Price Dhs 395Previous price: Dhs495Dhs 495More optionsGuides and plannersSkip listingGet guidance about bed framesHow to choose a mattress that’s best for youIKEA presents an extensive variety of beds, catering to a diverse range of needs. We acknowledge that individual requirements for sleeping arrangements vary, and our objective is to offer the perfect bed for each customer. Whether you seek a cozy retreat, optimal back support, or a stylish addition to your bedroom, our assortment of beds has something for everyone. Double Beds: Also known as full-size beds, these provide ample sleeping space for couples or generous comfort for individuals. Their versatility makes them a popular choice in bedrooms of various sizes. Sofa Cum Beds: These practical solutions for homes with limited space function as comfortable seating by day and easily convert into a bed when needed. Ideal for guest rooms or small apartments. Beds with Storage: Designed for efficient space utilization, these beds come with built-in storage options like drawers, shelves, or under-bed storage solutions, aiding in decluttering bedrooms and maximizing organization. Divan Beds: Known for their simplicity and comfort, divan beds consist of a mattress and base, providing solid support and often featuring storage options. Their minimalist design complements various decor styles. Single Beds: Tailored for individual sleepers, single beds are suitable for children's bedrooms, guest rooms, or small living spaces, available in various styles to suit different preferences. Guest Beds & Day Beds: Serving dual purposes in guest rooms or home offices, these beds function as seating during the day and can be extended into a bed for guests, making them versatile additions to your home. Upholstered Beds: Adding a touch of luxury and comfort, upholstered beds feature soft, padded headboards and frames, providing a cozy and stylish focal point in the bedroom, often with various fabric and color choices. Children's Beds: Designed with safety and fun in mind, children's beds come in various shapes and themes, often with built-in safety features to create a secure and appealing sleeping environment for kids. Loft Beds & Bunk Beds: Maximizing vertical space in bedrooms, these beds are great choices for children's rooms or shared spaces, providing extra room for play or study areas. Baby Cots: Crafted to provide a safe and comfortable sleeping space for infants, baby cots come with adjustable mattress heights and often convert into toddler beds as the child grows. Headboards: Available in various styles and materials, headboards serve as decorative and functional elements for beds, offering back support while reading or sitting up in bed and contributing to the bedroom's aestheticsBed sizes Beds come in all different shapes and sizes. Even though they might look different, and different bed frames can have different dimensions, the standards for bed sizes for adults are the same. The mattress will normally be 200 cm long, but the width will vary. Beds for kids, like cribs and so on, will have other sizes, both length and width. For adults the width will determine the bed size. Below you can see our standard bed sizes for adults from narrowest to widest:· Single : 90 x 200 cm Double: 140 x 200 cm Queen: 160 x 200 cm King: 180 x 200 cm Bed frames Most of our beds are sold with separate bed frames and separate mattresses. This means you can combine the style and look of your bed with the mattress of your choice. Our wide assortment of bed frames makes it easy for you to find a size and style you like. With the right bed frame, you can also choose the height of your bed, which can make it easier getting out of bed – at least physically – you still have to fight the lust of staying in a warm cozy bed.Some of our bed frames also have practical storage built-in, such as drawers or other clever solutions. For instance, a loft bed can have shelves or cupboards underneath. Great if you have limited space or want to maximize the space your bed takes up.Grey Bed FramesBlack Bed Frames Beige Bed FramesBrown Bed FramesBlue Bed Frames Red Bed FramesGreen Bed FramesPink Bed FramesTurquoise Bed FramesFabric Bed FramesLeather Bed FramesMetal Bed Frames140x200 cm beds80x200 cm bed framesStandard King bedsWooden Bed Frames90x200 cm bedsWhite Bed FramesQueen size bed frames'''
