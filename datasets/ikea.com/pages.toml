["https://www.ikea.com/ae/ar/customer-service/services/click-collect"]
title = "الطلب والاستلام - IKEA"
description = "الطلب والاستلام"
full_description = 'الطلب والاستلام مفتوح 7/24كيفية عمل خدمة الطلب والاستلام؟ - 3 خطوات سهلة الخطوة 1اختر التاريخ والوقت المناسبين لاستلام طلبك. الخطوة 2 احصل على تأكيد عبر البريد الإلكتروني والرسائل النصية القصيرة بمجرد أن يصبح طلبك جاهزًا للاستلام. الخطوة 3استلم طلبك دون عناء من نقطة تجميع ايكيا في سيارتك في اليوم نفسه أو في اليوم التالي. ما عليك سوى اتباع إشارات "انقر واستلم".الشروط: عند التسوق عبر الإنترنت: خدمة الطلب والاستلام مجانية. كل ما عليك دفع ثمنه هو المنتجات التي اشتريتها. طلبات الطلب والاستلام لن تكون مؤهلة لخدمات التوصيل والتجميع يجب أن تكون خدمة "انقر واستلم" مدفوعة مسبقًا وغير صالحة لنوع الدفع "الدفع عند الاستلام". بمجرد تأكيد الطلب والاستلام لمشترياتك، لن نتمكن من إعادة جدولته. نوصي بوضع ذلك في عين الاعتبار. خدمة الطلب والاستلام غير متوفرة لعملاء ايكيا في سلطنة عمان. يمكنك اختيار خدمة التوصيل إلى المنازل بدلاً من ذلك. بمجرد تأكيد طلب "الطلب والاستلام" ، فإن الإلغاء الجزئي غير ممكن للأسف. يمكنك بدلاً من ذلك اختيار إلغاء طلبك بالكامل وتقديم طلب جديد. نقاط الاستلام الخاصة ب "الطلب والاستلام" في متجر دبي فستيفال سيتي ومتجر جبل علي ومتجر جزيرة ياس ومتجر العين مفتوحة على مدار الساعة طوال أيام الأسبوع لاستلام طلبك. قبل وقت الاستلام المحدد: سوف تتلقى رسالة بريد إلكتروني لتأكيد طلبك بمجرد إتمامه. سوف تتلقى رسالة تأكيد عبر البريد الإلكتروني والرسائل النصية مرة ثانية بمجرد إعداد طلبك. ستتلقى رسالة عبر البريد الإلكتروني والرسائل القصيرة لتأكيد أن طلبك أصبح جاهزًا للاستلام ويمكنك استلام مشتريات "الطلب والاستلام" الخاصة بك بناءً على التاريخ الذي حددته مسبقًا أثناء تقديم طلبك عبر الإنترنت. إذا كنت غير قادر على استلام طلب انقر واستلم خلال 48 ساعة من التاريخ والوقت اللذين اخترتهما ، فسنطلب للأسف إلغاء طلبك لأننا لن نتمكن من تخزينه بعد 48 ساعة المخصصة. بعد معالجة الإلغاء ، ستتلقى تأكيدًا بالبريد الإلكتروني على الإلغاء ، وستتلقى المبلغ المسترد وفقًا للمهلة المصرفية القياسية. إذا أصبح منتج أو أكثر من المنتجات التي طلبتها غير متوفر، فسنخطرك عبر مكالمة هاتفية. يمكنك اختيار استرداد مبلغ المنتج (المنتجات) غير المتوفرة، واستلام بقية طلبك عندما يكون جاهزًا للاستلام. أو يمكنك اختيار إلغاء طلبك بالكامل لاسترداد الأموال بالكامل. عندما يكون طلبك جاهزًا للاستلام من المتجر: بمجرد إعداد طلبك وجاهزيته للاستلام ، سنخطرك. يرجى عدم الذهاب للاستلام حتى تتلقى تأكيدًا بأن الطلب جاهز للاستلام سيُطلب منك تقديم رمز الاستجابة السريعة أو رقم طلب الويب للتحقق.. في متجر ايكيا، اتبع اللافتات الخاصة بخدمة الطلب والاستلام لاستلام طلبك. سيُطلب منك ابراز رسالة تأكيد الطلب عبر البريد الإلكتروني أو الرسالة القصيرة حتى نتمكن من التحقق من طلب الطلب والاستلام عبر الإنترنت في وقت الاستلام. يمكنك تفويض شخص آخر لتحصيل طلبك. سيتعين عليك إعادة توجيه رسالة التأكيد عبر البريد الإلكتروني أو الرسائل القصيرة (بما في ذلك رمز الاستجابة السريعة) إلى ممثلك ، وسنعتبر ذلك بمثابة تفويض رسمي منك لتسليم الطلب إليهم. بدون رسالة التأكيد الإلكترونية أو الرسائل القصيرة (بما في ذلك رمز الاستجابة السريعة) ، لن نتمكن من تسليم الطلب. بعد الاستلام، يمكنك إرجاع المنتجات من طلب الطلب والاستلام في متجر ايكيا. يرجى الرجوع إلى سياسة الإرجاع الخاصة بـايكيا لمزيد من المعلومات. المزيد من خدماتنا'
