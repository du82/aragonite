["https://www.ikea.com/global/en/stories/design/mittzon-system-240403"]
title = "The MITTZON system – IKEA Global"
description = "Looking for an adaptable workspace where everyone can come together to work, create and collaborate? Our MITTZON family provides the possibility to create togetherness by customising and adapting different spaces for both the group and the individual. Let's get to work!"
full_description = "Let the future get to work MITTZON How would you reimagine the workplace from the confines of a lockdown? What would it look like and how would it be different from what we knew before? With development beginning in the midst of the pandemic, the MITTZON system has come to redefine how we understand and experience the workplace. From functionality to ergonomics, every corner of the traditional office was reconsidered until we found ourselves surrounded by a family of 85 products that looks to the future. Ergonomics 2.0Through our research, we discovered that having experienced a ‘work from home’ lifestyle, a lot of people expect the post-pandemic workplace to mimic home life more closely. Offices should be softer, acoustically pleasing, greener, and calmer. So where did we begin?The MITTZON family was designed to support a fully ergonomic environment where the individual wellbeing of coworkers is not just considered, but prioritised. We worked with experts in the field to approach each product from a human perspective. How are the senses affected? What could help with focus? Our findings have been woven into the very fabric of the MITTZON development and production.“Ergonomic principles cover much more than good posture, and we put much thought into developing pieces that take that into account.” – Philip DiléIKEA product design developer That sounds greatThe sound-absorbing material used in the MITTZON acoustic screens is wood fibre – a recyclable material made of more than 90% wood. But these innovative screens do more than absorb and block sound - they also prevent visual distractions and offer the privacy needed to do focused work. Biophilic design Nature-reminiscent shapes, colours and materials in indoor spaces have been shown to promote wellness by reducing stress and increasing productivity. The MITTZON family has plucked inspiration from the Scandinavian outdoors, such as sand patterns and wood finishes, to help create a relaxing and inspiring environment. KeywordsScandinavianFlexibleErgonomicNature inspired Texture and material Shapeshifting purpose “With the rise of hybrid work, we saw that office space and physical real estate was shrinking. Many offices have downsized, meaning that flexibility is key,” says Dilé. The answer? Foldable, adjustable, wheelable pieces that can be reconfigured for all kinds of needs and situations. To achieve peak adaptability, each item was designed with a broader understanding of how it would function together with other products in the MITTZON system. Made to be used Each product in the MITTZON system has been robustly manufactured using high-quality materials that withstand wear. Many products can be disassembled, reassembled, refurbished and repaired. Pair that with the 10-year guarantee and you’ve got a range that lives up to the in it for the long haul mentality that founded the team’s design considerations. “For us, it was really important that they are long-lasting from a technical perspective, but also in terms of a design that is timeless,” says Dilé. Open card MITTZON Sit-stand deskErgonomic comfort and clever features to boot – MITTZON sit/stand desk elevates your wellbeing and possibility to focus. Quality tested and guaranteed to outlast years of ups and downs. Open card Cable managementA MITTZON desk isn't just a surface to work upon. Cables can be tucked inside a lidded compartment and led under the table into the tray for cable management. Orderly as can be! Open card MITTZONFrame with castors/clothes rail/display shelfA flexible system to divide work areas or create a room in a room. Dress the frame with a clothes rail and shelf to store coats, shoes, bags and helmets. Open card MITTZONFrame with castors/display shelf/cable boxGive your plants a fancy new home that can move around the room as you please. A little nature can go a long way, improving focus and general wellbeing! Open card MITTZONAcoustic screen, floor standing Create your own world of calm. The acoustic floor-standing screen absorbs sound and reduces visual distractions so you can focus. Open card MITTZONFoldable table with castorsThe ultimate buddy for flexibility. Roll this table out, place it with others and let the meeting begin. When it’s time for clean-up or a new activity, simply fold it, roll it back and store it. Open card Hello hooks!A decluttered workspace. It's the dream! MITTZON desks and tables come with hooks, giving you an easy-to-reach spot for your headphones or bag. Make hybrid working work for youIf you’re looking to turn your workplace into an adaptable space where people can collaborate and create, you’ve got to meet the MITTZON system. Go on - take a look! North America, you’ll have to wait a bit, but MITTZON will be with you in July."
year_published = 2025
