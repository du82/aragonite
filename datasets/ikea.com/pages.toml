full_description = 'خدمة التوصيل توفر لك خدمة التوصيل في ايكيا الوقت والطاقة للقيام بما تريد - مثل الغناء تحت المطر بدلاً من القيادة فيه. التسليم يأتي عن طريق الطرود أو الشاحنة. سنخبرك بالنوع الذي يناسب طلبك. بالنسبة لتسليم الشاحنات، يمكنك اختيار خيارات مثل التسليم في نفس اليوم، والتسليم السريع. أو يمكنك توفير المال من خلال خدمة اطلب و استلم عن طريق الطلب عبر الإنترنت والاستلام من أحد متاجر ايكيا أو نقطة الاستلام مجانًا. خيارات التوصيل والاسعار|يجب معرفته | الاسئلة الاكثر تكراراخيارات التوصيل والاسعار عبر الانترنت خدمات التوصيل السعر توصيل الطرود10 درهم | مجاناً للطلبات التي تزيد عن 250 درهمالتوصيل الاثاث45 درهم | مجاناً للطلبات التي تزيد عن 950 درهمالتوصيل والتركيب144 درهم للطلبات التي تقل عن 950 درهم | 99 درهم للطلبات التي تزيد عن 950 درهمالتركيب فقط99 درهمالتوصيل والتركيب السريع350 درهم التوصيل في نفس اليوم السعر توصيل الطرود 10 درهم | مجاناً للطلبات التي تزيد عن 250 درهمتوصيل الاثاث45 درهم | مجاناً للطلبات التي تزيد عن 950 درهم التوصيل في نفس اليوم خدمة التوصيل في نفس اليوم متاحة لدبي وأماكن محددة في أبو ظبي. عند الطلب قبل الساعة 12:00 ظهراً. مواعيد محدودة متاحة الشروط والأحكام اطلب قبل الساعة 12:00 ظهراً مواعيد محدودة متاحة (من يأتي أولاً يخدم أولاً) سيتم توصيل الطلب بين الساعة 3 مساءً و 10 مساءً متوفر فقط في دبي وأماكن محددة في أبو ظبي الأماكن المحددة في أبو ظبي:طريق المطار| القرم| الوحدة| البطين|الكورنيش| طريق الدفاع| الكترا| قصر الإمارات| أبراج الاتحاد| حمدان| مدينة جواسات| الخالدية|منتزه خليفة| المناصر |جزيرة ماريا| مينا | المرور| النجدة| بوابة البحرية| طريق الجوازات|جزيرة الريم| السلام| قصر البحر| TCA التوصيل والتركيب السريع عند التسوق من IKEA.aeسنقوم بتوصيل أثاثك إلى منزلك أو مكتبك ونقوم بتجميعه في اليوم التالي عند قيامك بالشراء قبل الساعة 2 ظهرًا يمكنك الآن الاستمتاع بأثاثك وإكسسواراتك الجديدة في غضون 24 ساعة. عند التسوق من متجر ايكيا الأقرب إليكسنقوم بتوصيل أثاثك إلى منزلك أو مكتبك في نفس اليوم وسنقوم بتجميعه عند قيامك بالشراء قبل الساعة 3 مساءً. يمكنك الآن الاستمتاع بأثاثك وإكسسواراتك الجديدة لمدة تتراوح من 24 إلى 48 ساعة. يجب معرفة: بالنسبة لتوصيل الشاحنات، يجب اخبارنا عن أي اعتبارات مثل ركن السيارة أو الوقت أو قيود الوزن. تأكد من أن التسليم الخاص بك سوف يتناسب مع جميع المداخل أو القاعات أو السلالم أو المصاعد في منزلك مبناك. للحصول على الأبعاد، ابحث ضمن "تفاصيل المنتج" في صفحات فهرس المنتج الفردية. بالنسبة لعمليات التسليم إلى شقة أو شقة، تأكد من إمكانية استلام الطرود أو تركها عند المدخل الرئيسي. تتسوق لعملك؟ تعرف على ايكيا للأعمال. سنقوم بإحضار أثاثك إلى عملك حتى تتمكن من التركيز على تقديم خدمة ممتازة لعملائك. الاسئلة الاكثر تكراراكيف يمكنني تتبع طلبي؟أدخل رقم الطلب الخاص بك لتتبعهتتبع طلبكهل يمكنني إجراء تغييرات على عنوان التسليم أو التاريخ بعد تقديم طلبي؟يمكنك الاتصال بخدمة العملاء لدينا قبل 48 ساعة من تاريخ التسليم بالعنوان أو التاريخ المحدث وتأجيل الطلب حسب التاريخ المتاح لدينا.تواصل معنالقد تلقيت طلبي، ولكن المنتج مفقود أو تالف. ماذا أفعل؟يجب الإبلاغ عن المنتجات المفقودة أو التالفة خلال 48 ساعة من استلام طلبك. ما عليك سوى الاتصال بنا وسنقوم بترتيب عملية الاستبدال معك.تواصل معناذات صلةالطلب والاستلام مفتوح 7/24خدمة التجميعالشروط والأحكام - ايكياتواصل معنا'
