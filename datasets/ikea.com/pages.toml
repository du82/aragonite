["https://www.ikea.com/global/en/stories/design/brannboll-gaming-collection-240828"]
title = "Game on: The BRÄNNBOLL gaming collection – IKEA Global"
description = "Home gaming furniture has come a long way. The BRÄNNBOLL gaming collection is flexible, colourful and ready for gaming... and everything else!"
full_description = "The BRÄNNBOLL gaming collection Game on! Home gaming furniture has come a long way. The BRÄNNBOLL gaming collection is flexible, colourful and ready for gaming... and everything else! Play video With more than 3.3 billion gamers in the world, gaming has become the world’s largest hobby and an important part of life at home. The BRÄNNBOLL gaming collection is a game-changer for casual gamers looking for style and functionality around the home. The 20-piece collection of furniture, storage solutions and accessories allows you to create the ultimate gaming space with ease, yet each piece blends into any space when it's game over. A gaming collection inspired by street styleColourful, comfortable and relaxed, the collection takes inspiration from athleisure and the world of street sports. Powder-coated steel frames matched with textiles in bold eye-catching tones and subtle hues evoke the sense of energy and excitement of gaming, while blending into any room design. With a non-slip backing and a stitched perimeter, the gaming rug makes the ideal VR space. “Moving away from traditional gaming aesthetics and integrating gaming into the home environment was an essential aspect of this collection.” – Anna-Maria Nilsson,Designer Take it easyErgonomics play an important role. Armchairs accelerate from lounging to sitting and an easy chair rocks as you take every curve, adding comfort to the gaming experience. Castors allow you to wheel in cables, accessories or food supplies midway through the game, then roll them away and out-of-sight when it’s time to switch off. Whether you're playing in the fast lane or enjoying down time, tables and shelving units from the collection are the perfect companions for hanging out. Super hero cape or cosy gaming throw? You decide. Play video In the driving seatReady for a few laps? This bold armchair folds out, creating the perfect cockpit. When the race is won, simply fold it up and wheel it away from the TV and pretend you've been reading all day! Inflate your gameThe doughnut shape of the inflatable lounge chair is ideal for supporting your game – and your back. Colourful and comfy, the fun begins as soon as you sit down! Play video The perfect takeawayPerfect for gaming on the go, this clever felt basket is great for storing gaming accessories and even has a handy cut-out on the side, allowing you to charge gear while storing it. Its practical carrying handles double as legs, transforming it into a self-standing table when you're ready to go. The nearest service stationWhen it's time to recharge and refuel, this handy moveable side table ensures snacks and drinks are always within reach. A guardrail surrounds the perimeter, allowing you to reach out for refreshments without taking your eyes of the action onscreen. Play video Storage space or secret portal?What lies behind the stylish facade of storage cabinet? A secret gaming station and multiverse portal of course! With a foldable table top, space for a chair and a shelf for a PC tower, it's ideal for a small space virtual universe. Pillow fighter or supporter?This comfy gaming bolster has a cylindric shape that provides great support for arms or legs while gaming. It also makes a great sword or a huggable buddy during downtime. Play video Tilt, swing, bendNo need to sit still in this easy chair. Designed with immersive gaming in mind, the seat is suspended from the frame, allowing it to follow your every move. Previous slide Next slide Take home gaming in style to the next levelSee the BRÄNNBOLL gaming collection of mobile, flexible gaming furniture online or at an IKEA store near you. If the collection isn't yet available or is not available in your country, we’ll instead take you to see more inspiring products and collections for the home!"
year_published = 2025
clearnet = "https://www.ikea.com/global/en/stories/design/brannboll-gaming-collection-240828"
