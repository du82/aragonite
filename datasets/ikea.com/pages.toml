["https://www.ikea.com/global/en/more-information"]
title = "More information – IKEA Global"
description = "Looking for an answer to your question about the IKEA business? Have a look here."
full_description = "Have a question? We are happy to help. The IKEA business spans a wide range of areas, organisations and companies. To help you find the right contact, we've put together commonly asked questions, including contact details. There are no IKEA stores in the country where I live. How can I buy IKEA products? IKEA stores are only allowed to sell within the country where they are located. To learn about placing an order from outside our active markets, visit our International Sales page.How do I become an IKEA supplier? We are always looking for new suppliers who share our passion for quality and sustainability.Visit our supplier page where you will find the application form.I’m interested in becoming an IKEA franchisee. Where can I find out more? Inter IKEA Systems B.V., the IKEA franchisor, is constantly evaluating potential IKEA franchisees in both new and existing markets. When considering new franchisees, Inter IKEA Systems B.V. evaluates attributes such as:- experience local market knowledge and presence (demonstrating ability to set up and operate IKEA stores nationally) - corporate culture and values - financial strength and ability to complete the investment process across a country and in a large-scale retail environment format.Send an email to franchise@inter.ikea.com telling us why you would like to become a franchisee.Where can I find IKEA reports and publications? To make finding reports and publications easier, we have gathered them in one place.Browse and download recent IKEA publications and reports.How can I apply for permission to use IKEA copyright images/films? We tend to grant permission for educational and training purposes and deserving causes. Material that does not fit under either of these categories is assessed on a case by case basis since we want to know the context in which the material will be used. For more information, send a mail to legal.affairs@inter.ikea.com.How can I report misuse of the IKEA trademark that I have come across? The IKEA trademark is sometimes used without our permission. It is very important to us that our consumers are not misled, and that they can have confidence that all products bearing the IKEA trademark are genuine products.We therefore ask you to help us by reporting any wrongful use of the IKEA trademark or similar marks by sending a mail to infringement.report@inter.ikea.com. We cannot give you any reward or compensation, but you will get a big thank you for your support in protecting the IKEA trademark and preventing fraud and misrepresentation.I observed or experienced a breach of code of conduct, e.g. involving corruption, harassment, discrimination. How do I raise my concern? Inter IKEA Group has a clear code of conduct. Bullying, discrimination, fraudulent or corrupt activities, environmental violations or other breaches of laws or regulations are not tolerated. If you have a concern, we would really like to hear from you. Visit inter.IKEA.com where you can access our Speak up reporting platform."
year_published = 2025
clearnet = "https://www.ikea.com/global/en/more-information"
