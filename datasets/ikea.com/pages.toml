full_description = '''The story behind the productBend it like FRÖSETBentwood furniture has been around for centuries. See how designers Sarah Fager and Henrik Preutz have given this traditional technique a contemporary flavour with the FRÖSET chair. Play Hej, Sarah & Henrik!These two designers worked closely together on the FRÖSET chair, with the aim of combining a dynamic and airy look with sturdy durability. By using bentwood in varying thicknesses, they successfully ticked both boxes! "Bending wood is something that we have done in Scandinavian furniture-making for a long time. It's part of our design history." – Sarah Fager 1/2'''
