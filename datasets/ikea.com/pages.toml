title = "Privacy & Cookie statement"
description = "If you’re reading this, you’re probably curious what information we collect, how we use it and what rights you have when we process your personal information. Read on to find out."
full_description = "Privacy and Cookie statement Updated 24 October, 2024 The IKEA vision is to create a better everyday life for the many people. That’s a big job, and one that we at Inter IKEA Group take seriously. Who are the many people? You are! Whether you’re an IKEA customer, business partner, co-worker or wish to apply for a job at an IKEA company, the IKEA vision is all about you. So naturally we want to get to know you better. One way we do that is by collecting your personal information. If you’re reading this, you’re probably curious about what information we collect, how we use it and what rights you have when we process your personal information. Read on to find out.This privacy and cookie statement consists of various chapters. Below is a drop-down menu. Just click on the topic that you want to know more about and the relevant information will appear.This privacy and cookie statement is reviewed and updated regularly. If we change this statement, we will post the updated statement here. Any changes will go into effect on the last updated date shown above. We will not retroactively use or share your personal information for materially different purposes without first taking reasonable steps to notify you.Without your information, our job would be a lot harder, so thanks for sharing! We hope to make your everyday life better in return.Who we are and how we set up our website IKEA is one brand but many companies. Each plays a special role to achieve the IKEA vision.We are Inter IKEA Group. We are the group of companies that connects IKEA franchisees with range development and suppliers, and aligns the overall IKEA strategic direction – all to create a better everyday life for the many people. The Inter IKEA Group includes Inter IKEA Systems B.V. – the worldwide IKEA franchisor – as well as range development, supply and certain industry activities. It also includes IKEA Älmhult AB, the owner of the IKEA Museum in Älmhult, Sweden.This privacy and cookie statement applies to Inter IKEA websitesIn this privacy and cookie statement we explain how we, at Inter IKEA Group, process and protect your personal information on our websites www.ikea.com, www.inter.ikea.com, www.ikeamuseum.com, www.jobs.ikea.com, www.ikeasocialentrepreneurship.org, www.ikea.es, and at the IKEA Museum and the IKEA store in Delft, Netherlands. We also tell you all about your privacy rights.In this privacy and cookie statement we also explain how we use cookies on our websites. Although most Inter IKEA websites use the same categories of cookies, the actual cookies may differ per website. For example, some of our websites may have YouTube cookies, while other websites may not. You can find detailed Information about the cookies on each page, either in the cookie banner, or at the bottom of the page under “cookie settings”. Any choice you make with regards to the placement of cookies on one webpage does not automatically transfer to other websites. You are required to choose your cookie settings separately for each Inter IKEA website.Links to other IKEA websitesOn our homepage we offer links to other IKEA websites. Not all of these IKEA websites are owned by Inter IKEA Group; some are owned by our franchisees. For example, if you click on the “go shopping” button on our homepage www.ikea.com, you will be directed to an IKEA country website (except for Spain, where you will be directed to a landing page initially). If you click on “IKEA Foundation” on our homepage www.ikea.com you will be directed to www.ikeafoundation.org. IKEA country websites and the IKEA foundation website are owned and managed by our franchisees.Our franchisees have their own privacy and cookie policies. This privacy and cookie statement is not valid for IKEA franchisees’ websites. Any choice you make with regards to the processing of your personal information and the placement of cookies on our websites does not transfer to the IKEA franchisees’ websites.When you visit our websites (cookie statement) On our websites we use cookies. These are small text files that are stored on your computer, phone or tablet. The information contained in these files allows us to optimise and personalise our website for you, to analyse how our website is used and to show you relevant advertising.In addition to cookies, there are other technologies that we use to store and read information on your computer, tablet or mobile phone, such as Javascript and tracking pixels. For the sake of convenience we will also refer to them as 'cookies'.Read more about the categories of cookies that we use on our websites below. The actual cookies placed may differ per website. You can find detailed Information about the cookies placed on each page, either in the cookie banner, or at the bottom of the page under “cookie settings”. Please note that any choice you make with regards to the placement of cookies on one webpage does not automatically transfer to other websites. You will have to choose your cookie settings separately for each website.Types of cookies used on our websitesOn our websites we use the following types of cookies:a. Strictly Necessary Cookies or Technical CookiesTechnical cookies are necessary for the website to work properly. For example, these enable you to easily navigate through our websites and to register your privacy settings. Without technical cookies, our websites do not function. For this reason, these cookies are always set and we do not require your consent to use them. We do not process any personal information through these cookies.b. Preference cookiesWith your consent, we place preference cookies on your device. These cookies are used to store your preferences. For example, we remember which language you have set and your country of preference. With this information we can make your interaction with our websites more user-friendly.We base the placement of preference cookies and the processing of data collected through these cookies on your consent.c. Analytical cookiesWith your consent, we place analytical cookies on your device. With these cookies we collect information about your computer, internet and system administration. With these cookies we also collect aggregated information on how you use our websites, time spent, pages visited, geolocation, etc.This information allows us to estimate our audience size and usage patterns, store information about your preferences and recognise you when you return to our websites. We use this information to improve our websites and services and to give you a more personalised experience, by customizing our websites according to your individual interests. This information does not allow us to identify you or draw conclusions about you.We base the placement of analytical cookies and the processing of data collected through these cookies on your consent.d. Marketing cookiesWith your consent, our advertisers place so-called marketing cookies on your device. They use these cookies to track which pages you visit from their network in order to build up a profile of your online surfing behaviour. This profile is partly built on the basis of comparable information obtained from your visits to other websites in their network. This profile is not linked to your name, address, e-mail address and the like as known to us, but only serves to tailor advertisements to your interests so that they are as relevant to you as possible.We base the placement of marketing cookies and the processing of data collected through these cookies on your consent.Managing cookiesYou can opt out/withdraw your consent at any time by clicking on the “cookie settings” link that is shown at the bottom of each website and change your settings. Please note that any choice you make with regards to the placement of cookies on one webpage does not automatically transfer to other websites. You will have to withdraw your cookie consent separately for each website.If you withdraw your consent, the cookies placed on your browser will be disenabled and will no longer collect your personal information. But they will not automatically be removed from your browser. You will have to do this manually.Withdrawal of consent does not affect processing of your data that took place prior to the withdrawal.Responsibility for the placement of cookies and the processing of your personal information collected through cookies on our websitesOur websites www.ikea.com, www.inter.ikea.com and www.ikea.es are owned by Inter IKEA Systems B.V.. Inter IKEA Systems B.V. is responsible for the placement of cookies and the processing of your personal information collected through cookies placed on these websites.Our website www.ikeamuseum.com is owned by IKEA Älmhult AB. IKEA Älmhult AB is responsible for the placement of cookies and the processing of your personal information collected through cookies placed on this website.Our website www.jobs.ikea.com is owned by Inter IKEA Group. Inter IKEA Group entities are jointly responsible for the placement of cookies and the processing of your personal information collected through cookies placed on these websites.Our website www.ikeasocialentrepreneurship.org is owned by IKEA Social Entrepreneurship B.V.. IKEA Social Entrepreneurship B.V. is responsible for the placement of cookies and the processing of your personal information collected through cookies placed on this website.How long we keep your personal information collected through cookiesWe will keep your personal information for no longer than necessary for the purpose for which we process your data. We may store your information longer than stated above if it is necessary to fulfil legal obligations, or to protect our legal rights, for example in a legal dispute.Other IKEA websitesOn our homepage we offer links to other IKEA websites. Not all of these IKEA websites are owned by Inter IKEA Group; some are owned by our franchisees. For example, if you click on the “go shopping” button on our homepage www.ikea.com you will be directed to an IKEA country website. If you click on “IKEA Foundation” on our homepage www.ikea.com you will be directed to www.ikeafoundation.org. IKEA country websites are owned and managed by IKEA franchisees. The website www.ikeafoundation.org is owned by our franchisee INGKA.Our franchisees have their own privacy and cookie policies. This privacy and cookie statement is not valid for IKEA franchisees’ websites. Any choice you make with regards to the processing of your personal information and the placement of cookies on our websites does not transfer to the IKEA franchisees’ websites.When you click on “go shopping” On our website www.IKEA.com we offer links to IKEA country websites. You can reach these IKEA country websites by clicking on the “go shopping” button on our website.The IKEA country websites are owned, managed and operated by IKEA franchisees. Our franchisees have their own privacy and cookie policies. This privacy and cookie statement is not valid for the IKEA country websites. Any choice you make with regards to the processing of your personal information and the placement of cookies on our websites does not transfer to the IKEA country websites.When you contact us What personal information we collectWhen you contact us, we may collect and use records and copies of your correspondence. This includes contact details, such as name, e-mail address and phone number. If you contact us on behalf of an organisation, this also includes organisation type, registered number and address.We will use your personal information to help you with whatever matter you submit to us.We base our processing of this data on the legal ground of legitimate interest.Responsibility for the processing of your personal informationThe Inter IKEA Group entity contacted by you is responsible for the processing of your personal information.How long we keep your personal informationWe will keep your personal information for no longer than necessary for the purpose for which we process your data. We may store your information longer than stated above if it is necessary to fulfil legal obligations, or to protect our legal rights, for example in a legal dispute.When you subscribe to our newsletter What personal information we collectOn our website we offer you the opportunity to subscribe to our newsletter. For this we ask for your e-mail address. We will use your e-mail address for the sole purpose of sending you our newsletter. In each newsletter we will offer you a free and easy way to unsubscribe.We base our processing of this data on the legal ground of performance of an agreement.Responsibility for the processing of your personal informationInter IKEA Systems B.V. is responsible for the processing of your personal information.How long we keep your personal informationWe will keep your personal information for no longer than necessary for the purpose for which we process your data. We may store your information longer than stated above if it is necessary to fulfil legal obligations, or to protect our legal rights, for example in a legal dispute.We keep the e-mail address that you provided to us to receive our newsletter until you unsubscribe. After you’ve unsubscribed your e-mail address will be removed from our database.When you book a visit to/visit the IKEA Museum What personal information we collectBookingsIn the IKEA Museum we sometimes arrange special workshops and events, either free or paid, which may require advance booking. We also offer tours with our inspiring, knowledgeable guides. Apart from open tours, which are available and included in the admission for individual visitors and small groups, we offer more in-depth tours that must be booked in advance.When you make a booking for an event or tour at the IKEA Museum we ask you for your name, e-mail address, telephone number, payment method and payment details.We use your contact details and booking information to make the reservation and provide you with the requested services. We base this processing of your data on the legal basis of performance of an agreementWe also use your contact details and booking information to improve our museum and related services and to inform you about future exhibitions. We base our processing of this data on the legal basis of legitimate interest.Visiting the IKEA MuseumIn the IKEA Museum we use CCTV cameras.The recorded material may be used for internal and/or external investigations, in the event of an incident or for other security purposes. We do this to create a safe environment for our guests and employees. We base this processing of your personal information on the legal basis of legitimate interest.Who is responsible for the processing of your personal information?IKEA Älmhult AB is responsible for the processing of your personal information.How long we keep your personal informationWe will keep your personal information for no longer than necessary for the purpose for which we process your data. We may "
