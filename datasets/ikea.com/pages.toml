free of charge from customer service or via IKEA.be/spareparts. More infoWelcome to IKEA. We try to improve everyday life for as many people as possible. Our affordable furniture and home accessories have a unique design, are functional and sustainably produced. At IKEA, you will find inspiration to make your home interior as beautiful and livable as possible. Browse our sofas, dream up a new kitchen, try our mattresses and box-spring beds, or design your own wardrobe. For atmospheric outdoor furniture, take a look at our garden furniture. Buy your furniture & home decoration at low prices online or at your local IKEA shop. Home delivery from €2.99 for Belgium and Luxembourg. We also offer a variety of services to save time.'''
