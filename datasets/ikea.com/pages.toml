full_description = 'The story behind the productForever RÖNNINGEMaja Ganszyniec is the creative mind behind this textbook example of time-defying style and quality. A chair designed to be loved for a lifetime! Play Hej, Maja!Based in Warsaw, Maja is always for looking to explore more sustainable solutions, through designs that underline the value of materials and use them wisely. The RÖNNINGE chair celebrates the beauty of solid hardwood with its visible grains, while making the most of its strength and durability. "A long-lasting product is one that can withstand extensive use, but also one that will last despite changing trends." – Maja Ganszyniec 1/3'
