["https://ikiwiki.info/rcs"]
title = "Revision Control Systems"
full_description = "Ikiwiki supports using several revision control systems for storing page histories. Ikiwiki started out supporting only Subversion, but the interface ikiwiki uses to a revision control system is sufficiently simple and generic that it can be adapted to work with many systems by writing a plugin. These days, most people use git. While all supported revision control systems work well enough for basic use, some advanced or special features are not supported in all of them. The table below summarises this for each revision control system and links to more information about each. feature git svn bzr monotone mercurial darcs tla cvs ikiwiki-makerepo yes yes yes yes yes yes no yes auto.setup yes yes incomplete yes incomplete yes incomplete yes rcs_commit_staged yes yes yes yes yes yes no yes rcs_rename yes yes yes yes yes yes no yes rcs_remove yes yes yes yes yes yes no yes rcs_diff yes yes yes yes yes yes yes yes rcs_getctime fast slow slow slow fast slow slow slow rcs_getmtime fast slow slow slow fast no no no rcs_preprevert yes no no no no no no no rcs_revert yes no no no no no no no anonymous push yes no no no no no no no conflict handling yes yes yes buggy yes yes yes yes openid username yes no no no yes yes no no Notes: Lack of support in ikiwiki-makerepo or auto.setup can make it harder to set up a wiki using that revision control system. The rcs_commit_staged hook is needed to use attachments or comments. rcs_getctime and rcs_getmtime may be implemented in a fast way (ie, one log lookup for all files), or very slowly (one lookup per file). Openid username support allows avoiding display of Google's ugly openids. There is a page with details about how the different systems work with ikiwiki, for the curious."
year_published = 2015
clearnet = "https://ikiwiki.info/rcs"
tags = ["control", "fast", "revision", "slow", "systems"]
language = "en"
internal-references = ["none"]
external-references = ["anarc.at", "ann.jussieu.fr", "antportal.com", "beza1e1.tuxen.de", "branchable.com", "bugs.gentoo.org", "code.activestate.com", "community.activestate.com", "dev.iikb.org", "developer.mozilla.org", "httpd.apache.org", "joeyh.name", "log.hugoschotman.com", "metacpan.org", "openid.net", "packages.debian.org", "packages.guix.gnu.org", "search.cpan.org", "security-tracker.debian.org", "software.opensuse.org"]

["https://ikiwiki.info/patch"]
title = "patch"
full_description = '''Since we have enough people working on ikiwiki to be dangerous, or at least to duplicate work without coordination, here's a queue of suggested patches. If you post a patch to the todo or bugs list, or elsewhere, once it's ready to be applied, add a 'patch' tag so it will show up here. If your patch is non-trivial and might need several iterations to get right, or you'd just like to make it easy for Joey to apply it, please consider publishing a git branch. Patches that have been reviewed and need changes before they are merged are listed separately, on the reviewed list. There are 63 unreviewed patches and 11 reviewed patches. RSS Add a new post titled: Make recentchanges CGI more configurable Posted Tue Sep 3 02:22:45 2024 po plugin broken with po4a 0.70 Posted Tue Jun 11 06:35:03 2024 finish html5 migration Posted Mon Apr 1 10:32:48 2024 javascript resources placed after html tag Posted Wed Jul 15 12:30:30 2020 allow toc to skip entries Posted Sun Mar 15 16:50:55 2020 Add ikiwiki PO-Plugin to ignore languages Posted Sat Aug 25 06:52:24 2018 JSON Feed support Posted Thu Jun 1 19:26:27 2017 highlight line numbers Posted Fri Jan 22 12:41:48 2016 userdir() pagespec directive to match userpage and SubPages Posted Fri Nov 20 13:25:17 2015 Commonmark support Posted Thu Mar 5 02:24:52 2015 add remove to actionlist Posted Mon Jul 28 09:13:36 2014 osm plugin icon patch Posted Fri Oct 11 14:48:42 2013 git-annex support Posted Sat Sep 21 09:56:10 2013 send only one mail per page in notifyemail Posted Sat Sep 7 17:24:52 2013 option to send only the diff in notifyemail Posted Fri Sep 6 17:53:50 2013 xapian omega same lang when indexing and searching Posted Wed Aug 7 10:51:13 2013 calendar with "create" links Posted Thu Apr 18 15:29:32 2013 please add some table styles Posted Fri Nov 16 17:08:43 2012 usedirs_redir proposed additional module Posted Fri Apr 20 00:33:28 2012 allow TMPL_LOOP in template directives Posted Thu Mar 15 18:52:12 2012 be more select