["https://ikiwiki.info/contact"]
title = "contact"
full_description = '''The ikiwiki project strongly encourages collaboration through ikiwiki itself, and thus does not have a mailing list. Anyone can create an account on ikiwiki's own wiki. ikiwiki provides a bug tracker, a TODO list, and "discussion" sub-pages for every page, as well as a forum for general questions and discussion. ikiwiki developers monitor RecentChanges closely, via the webpage, email, and IRC, and respond in a timely fashion. You could also drop by the IRC channel #ikiwiki on OFTC (irc.oftc.net). It can also be reached from Matrix on #oftc#ikiwiki:matrix.org, but note that you will need your Matrix user to be registered on OFTC by talking first with @_oftc_Nickserv:matrix.org first. However, if you find a new security vulnerability, please email the maintainers privately instead of raising it in a public medium, so that we can arrange for coordinated disclosure when a fix is available. The maintainers are Joey Hess (joey@kitenet.net), Amitai Schleier (schmonz-web-ikiwiki@schmonz.com) and Jonathan Dowland (jmtd@debian.org).'''
year_published = 2024
