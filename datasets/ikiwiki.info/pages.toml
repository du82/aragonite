title = "plugins"
full_description = "Most of ikiwiki's features are implemented as plugins. Many of these plugins are included with ikiwiki. auth bundle chrome comments core date format fun html link meta special-purpose tags web widget There's documentation if you want to write your own plugins, or you can install plugins contributed by others. To enable a plugin, use the --plugin switch described in usage, or the equivalent add_plugins line in ikiwiki.setup. Enable the goodstuff plugin to get a nice selection of plugins that will fit most uses of ikiwiki. Plugin directory 404 admonition aggregate amazon s3 anonok attachment autoindex blogspam brokenlinks calendar camelcase color comments conditional contrib addtag album asciidoc asymptote attach bibtex bibtex2html bootstrap compile cowsay created in future datetime cmp default content for *copyright* and *license* fast-pandoc field flattr ftemplate gallery getfield googlemaps groupfile highlightcode i18nheadinganchors imailhide img irclog irker jscalendar jssearchfield justlogin linguas listsubscribe livefyre localfavicon mailbox mandoc mathjax mediawiki monthcalendar mscgen navbar newpage nimble opengraph opml org mode pagespec alias pageversion pandoc parenttag plusone pod poetry postal purge redirect remark report sar screenplay.pm sidebar2 signinview siterel2pagerel sourcehighlight sqlite_search syntax taskreport tex4ht texinfo todo tracking unixauth unixrelpagespec verboserpc video wordcount xslt ymlfront creole cutpaste date ddate duckduckgo editdiff editpage edittemplate emailauth embed favicon filecheck flattr format fortune getsource goodstuff google goto graphviz h1title haiku headinganchors highlight hnb html htmlbalance htmlscrubber htmltidy httpauth img inline link linkmap listdirectives localstyle lockedit map mdwn meta mirrorlist moderatedcomments more notifyemail opendiscussion openid troubleshooting orphans osm otl pagecount pagestats pagetemplate parentlinks passwordauth pingee pinger po poll polygen postsparklin