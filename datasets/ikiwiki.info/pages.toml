["http://ikiwiki.info/plugins/rst"]
title = "rst"
full_description = '''Plugin: rst Author: martin f. krafft Included in ikiwiki: yes Enabled by default: no Included in goodstuff: no Currently enabled: no This plugin lets ikwiki convert files with names ending in ".rst" to html. It uses the reStructuredText markup syntax. You need to have RPC::XML, python and the python-docutils module installed to use it. Note that this plugin does not interoperate very well with the rest of ikiwiki. Limitations include: There are issues with inserting raw html into documents, as ikiwiki does with WikiLinks and many directives. So while you may find this useful for importing old files into your wiki, using this as your main markup language in ikiwiki isn't recommended at this time.'''
year_published = 2011
clearnet = "http://ikiwiki.info/plugins/rst"
