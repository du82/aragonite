full_description = '''General Information Feel free to add your own ikiwiki site! In case you have created a custom theme consider adding it to the theme list See also: Debian ikiwiki popcon graph and google search for ikiwiki powered sites. While nothing makes us happier than knowing that ikiwiki has happy users, dropping some change in the TipJar is a nice way to show extra appreciation. Ikiwiki Hosting Name Ikiwiki Configuration Costs Branchable Open configuration with ikiwiki-hosting Free for free software, otherwise involves fees FreedomBox Web configuration with Plinth Runs on your home's private cloud server Projects & Organizations This wiki (of course!) NetBSD wiki The GNU Hurd DragonFly BSD X.org Freedesktop.org and many projects therein Monotone The Free Software Foundation uses it for their internal wiki, with subversion. The cairo graphics library website. The Portland State Aerospace Society website. Converted from a combination of TWiki and MoinMoin to ikiwiki, including full history (Git backend). Planet Debian upstream Debian Mentors wiki The BSD Associate Admin Book Project The maildirman wiki The Relativistic Programming research wiki. Debian-IN Braawi Ltd Webconverger (a Web only linux distribution) with a blog DebTorrent The Debian Packaging Handbook project The libkdtree project The pcc (Portable C Compiler) project. (Simple rcs backend) The TOVA Company public site. We also use it for internal documentation and issue tracking, all with a Git backend. Reusable technical support websites, developed for Redpill realms: master demo site (source) Homebase Bitbase (source) Børneuniversitetet (source) CampusGrün Hamburg The awesome window manager homepage notqmail vcs-home Public Domain collection of Debian related tips & tricks - please add any tips too Finnish Debian community dist-bugs monkeysphere Cosin Homepage uses an Ikiwiki with a subversion repository. Bosco Free Orienteering Software MIT Student Information Processing Board Tinc VPN The XCB library The Philolexian Society of Columbia University Fachschaft Informatik HU Berlin Wetknee Books IPOL Image Processing On Line Debian Costa Rica Fvwm Wiki Software in the Public Interest NXT Improved Firmware The FreedomBox Foundation AntPortal - also see our templates and themes on github The Amnesic Incognito Live System The Progress Linux OS wiki Oxford Computer Society *BSD UNIX user group in Denmark Telecomix Broadcast System WikiMIX.cc Paris Observatory Information System website, also used for internal documentation SolderPad Documentation The Open TV White Space Project The RS-232 Club FusionInventory project FabLab Deventer i.o. Börn og tónlist - an Icelandic open-content site, primarily for kindergarten teachers, about music and music-related activites with children. Migrated from MediaWiki to IkiWiki in June 2013. Heavily changed appearance with only minimal changes to page.tmpl. Also its sister site Leikur að bókum, about children's books in a kindergarten/pre-school context. Réseaulibre.ca - a mesh project in Montréal, most data is stored in the wiki, including IP address allocation and geographic data. Features map (osm) integration. Foufem - Foufem, a feminist hackerspace Grésille - A French hactivist group. Grenode - A French non-profit Internet access provider. Rézine - A French non-proft Internet service provider. Nos oignons - Tor exit nodes funded by the community. CAS Libres - A French feminist radio program. Les Barricades - A French socialist choir (CSS has been adapted from the one of Grésille). DKØTU Amateur Radio Station, TU Berlin Plan A - A proposal for improvement of the urban public transport in Munich (by PRO BAHN, Bund Naturschutz and others) Smuxi IRC Client - powerful IRC client for GNOME hplusroadmap - a community for open source hardware, do-it-yourself biohacking and practical transhumanism OpenAFS - an open-source, cross-platform distributed file system Copyleft.org Hacklab Independência - radical tech collective Piratas XYZ - one of pirate party of brazil's sites Bürgerinitiative S4-Ausbau - A initative in the larger munich area to improve the public transport line S4 MagmaSoft, as well as the support site and the Software Wiki voice in time a voice recording studio located in Hamburg, Germany (rather complex build using ikiwiki only, providing CGI access for the customer) nb instrument a workshop for beautifully handcrafted musical instruments, located in Hamburg, Germany (also one of our rather complex builds using ikiwiki only, providing CGI access for the customer) coido architects architectural company, located in Hamburg, Germany and Rotterdam, Netherlands (also rather complex build adding masonry and gallery scripts and some pjaxing to the picture, providing CGI access for the customer) guppy an internationalized modular Python IRC bot ChessWOB Chess Without Boundaries Debian Enhancement Proposals Crypt Code Club Personal sites and blogs Joey's homepage, including his weblog Kyle's MacLea Genealogy wiki and Livingstone and MacLea Emigration Registry kite Alessandro Dotti Contra's personal website Kelly Clowers' personal website Anna's nature features Roland Mas's blog Sergio Talens-Oliag's personal wiki and blog Christian Aichinger's homepage Adam Shand's homepage Hess family wiki Zack's homepage, including his weblog betacantrips, the personal website of Ethan Glasser-Camp Keith Packard's homepage and blog. Christian Mock's homepage. Choffee. Proper Treatment 正當作法 lost scraps, pages/blog of Petr Ročkai aka mornfall Schabis blaue Seite - I abuse ikiwiki as blog/cms combo, and will migrate all existing content into ikiwiki eventually. blog of LukClaes. Embedded Moose, Andrew Greenberg's personal and consulting page. Cameron Dale KarlMW's homepage, generated with an ikiwiki asciidoc plugin. Carl Worth's Boring Web Pages NicolasLimare (nil+lab+id+french translation of the basewiki) Andrew Sackville-West has setup a family wiki Simon Ward's site and blog. Paul Wise's homepage and blog Martin's PhD wiki David Riebenbauer's page Thomas Harning's 'eHarning' wiki madduck's (new) homepage Olivier Berger's professional homepage Don Marti's blog Jon's homepage JanWalzer's homepage -- Work in Progress Adam Trickett's home intranet/sanbox system (Internet site & blog -- not ikiwiki yet) Simon McVittie's website and blog Svend's website and blog Per Bothner's blog Bernd Zeimetz (bzed) Gaudenz Steinlin NeoCarz Wiki Yes - its actually Ikiwiki behind that! I'm using Nginx and XSL to transform the ikiwiki renderings thanks to the valid XHTML output of ikiwiki. Great work Joey!! Natalian - Kai Hendry's personal blog Mick Pollard aka _lunix_ - Personal sysadmin blog and wiki Skirv's Wiki - formerly Skirv's Homepage Jimmy Tang - personal blog and wiki Nico Schottelius' homepage Andreas Zwinkaus homepage Walden Effect Avian Aqua Miser Cosmic Cookout Backyard Deer Alex Ghitza homepage and blog Andreas's homepage - Ikiwiki, Subversion and CSS template Chris Dombroski's boring bliki Josh Triplett's homepage - Git backend with the CGI disabled, to publish a static site with the convenience of ikiwiki. Jonatan Walck a weblog + wiki over I2P. Also mirrored to the Internet a few times per day. Daniel Wayne Armstrong Mukund Nicolas Schodet weakish Marco Silva a weblog + wiki using the darcs backend NeX-6 ikiwiki blog and wiki running over ipv6 Jason Riedy, which may occasionally look funny if I'm playing with my branch... pmate's homepage and blog tychoish.com - a blog/wiki mashup. blog posts are "rhizomes." Martin Burmester Øyvind A. Holm (sunny256) — Read my Ikiwiki praise here. Mirco Bauer (meebey) Richard "RichiH" Hartmann - I thought I had added myself a year ago. Oups Jonas Smedegaard multilingual "classic" website w/ blog Siri Reiter portfolio website with a blog (in danish) L'Altro Wiki Tutorials, reviews, miscellaneus articles in English and Italian. gregoa's p.r. - political rants Michael Hammer The personal website of Andrew Back Paul Elms Personal site and blog in russian. Salient Dream - All Things Strange. Anton Berezin's blog Waldgarten News and documentation of a permaculture inspired neighbourhood-garden located in Hamburg, Germany. Waldfarm - Natural Life by Natural Farming, Natürliches Leben mit natürlicher Landwirtschaft OscarMorante's personal site. Puckspage Political and personal blog in German. The name comes from the elf out of midsummer nights dream. LucaCapello's homepage Martín Ferrari's homepage and blog Z is for Zombies — personal blog/site of Francesca Ciceri Julien Lefrique's homepage, hosted on GitHub pages with CGI disabled Anarcat's homepage - with a custom theme Wouter's Blog, with a custom CSS stylesheet based off the rest of his website. Julian Andres Klode's blog KheOps's blog Stig Sandbeck Mathisen - Personal site and blog, with a bootstrap theme, and varnish frontend. Kalle Söderman: Seen Architecture, Stockholm Project - Mainly -image galleries using the album and osm plugins with a customized html5 theme. James Richardson's wiki, blog, and online resume. Amitai Schleier's site Aloodo Blog Ninguém tem blog! - Restricted ikiwiki hosting Dissertos radicais E pelas praças não terá nome Igreja Universal do Reino do Iuri Mim Mídia Capoeira - independent journalism initiative Sean Whitton's personal website Matto's personal website Rob Sayers' personal website Svetlana Tkachenko's personal website - personal site, no blog re:fi.64's personal wiki canvon's blog Coyote Works - Work In Progress site of Stephen Michael Kellat cat.chessmuse.com - alip's chess blog wesl.ee's personal wiki Summer Camp Island wiki (no CGI)'''
