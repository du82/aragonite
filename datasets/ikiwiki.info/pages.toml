title = "bugs"
full_description = '''If you've found a bug in ikiwiki, post about it here. TODO items go elsewhere. Link items to done when done. Also see the Debian bugs. If you are reporting a security vulnerability, please email the maintainers privately, instead of making it public by listing it here. See security for contact details. There are 140 "open" bugs: RSS Add a new bug titled: po test failing on debian stable Building current master on debian stable: Failed test at t/po.t line 538. # '<p>Tails takes <BD> hour to install</p> # ' # doesn't match '(?^usx: # .* # L'installation\sde\sTails\sdure\s<BD>\sheure # .* # )' # Looks like you failed 1 test of 126. t/po.t ......................... Dubious, test returned 1 (wstat 256, 0x100) The failing code comes from "t/po.t: add test for UTF-8 vs. po4a 0.58+" It builds ok on debian unstable. --Joey Posted Fri Feb 28 16:46:15 2025 Edit ?Discussion Please change admin user for ikiwiki.info Please change the admin user password for ikiwiki.info as this is too weak Posted Fri Apr 12 08:39:35 2024 Edit ?Discussion duplicate script element for ikiwiki.js Originally reported to Debian at https://bugs.debian.org/cgi-bin/bugreport.cgi?bug=598415: If both relativedate and toggle plugins are enabled and features of both plugins are used on a wiki page, a tag for ikiwiki.js is rendered twice in the generated HTML for the page. At the time I'm reporting this here, the problem is evident at https://ikiwiki.info/sandbox/. Related: javascript resources placed after html tag — Jon, 2024-03-25 Posted Mon Mar 25 10:54:13 2024 Edit ?Discussion filecheck.pm: warnings about division with uninitialized value If you enable filecheck and attachment, then IkiWiki (e.g. via wrapper) will throw a lot of the following errors on stderr Use of uninitialized value $size in division (/) at /.../filecheck.pm line 73. 73 is sub humansize ($) { my $size=shift; foreach my $unit (reverse sort { $units{$a} <=> $units{$b} || $b cmp $a } keys %units) { if ($size / $units{$unit} > 0.25) { return (int($size / $units{$unit} * 10)/10).$unit; } } return $size; # near zero, or negative } Disabling attachment is sufficient to stop this. — Jon 2023-09-06 Posted Wed Sep 6 09:44:47 2023 Edit ?Discussion ispage() does not work as expected In a few places, it is recommended to try the ispage() pagespec, described at attachment but provided by the (supposedly independent) plugin filecheck. I've had trouble getting it to work so put together a minimal test-case. Very basic wiki with filecheck enabled (but attachment not). File structure as follows index.mdwn a/foo.mdwn a/bar.txt a/pic.png index containing [[!map pages="a/*"]] [[!map pages="a/* and ispage()"]] The first map expands, as expected, to bar.txt foo pic.png The second is empty. Expected behaviour: foo (with txt not enabled) — Jon, 2023-09-06 here's a trace of what happens to ispage() when applied to the above example. match_ispage gets called with argument "a/foo" it calls Ikiwiki::pagetype with that argument unmodified the first branch checks for a period, so fails base is calculated to be "foo" the next branch fails as $hooks{htmlize}{foo} is false the function returns undefined. — Jon, 2023-09-06 Posted Wed Sep 6 08:02:31 2023 Edit ?Discussion sparkline fails to generate graphs in debian bullseye I have tried to use the sparkline plugin today and it failed with: remote: PHP Fatal error: Cannot use 'Object' as class name as it is reserved in /usr/share/php/sparkline/Object.php on line 71 ... at built time. I have tried to follow the instructions in sparkline but those also failed with because php5 is long gone from Debian, of course. The libdigest-sha1-perl package also seems gone, so I have tried this: apt install libsparkline-php php-gd php-cli ... but that is how I ended up with the above failures. I suspect the embedded PHP code in ikiwiki needs to be ported to PHP 7 (or 8 now?)... But really, maybe, the sparkline Perl library should be examined again. Surely it's not that bad that we need PHP around here, do we? It looks like SVG::Sparkline could be a good candidate although there's also Text::Sparkline. Or maybe sparklines are dead... http://sparkline.org doesn't even resolve... Time flies, doesn't it? -- anarcat I hit this a little while ago and ended up ditching the sparkline plugin. But, if it is to be resurrected, I would agree with ditching PHP here, too. For my use-case the data changes so infrequently (this graph of blog posts by year, not including the current year) that I manually generate something in LibreCalc annually, and copy the resulting picture in. — Jon, 2023-01-20 Posted Sun Jan 8 00:31:17 2023 Edit ?Discussion charset attribute on the script element is obsolete the w3 validator fails on the main ikiwiki website because of the way inline scripts are handled. For example, validating the post convention for signing posts to ikiwiki.info leads to this warning: Warning: The charset attribute on the script element is obsolete. From line 271, column 1; to line 271, column 78 >↩↩</div>↩<script src="../../ikiwiki/ikiwiki.js" type="text/javascript" charset="utf-8"></scri Seems like a low-hanging fruit... There are other errors on my blog, namely the pubdate=pubdate blob added by IkiWiki::displaytime, no idea where that's coming from, but it's not standard anymore. See for example, this validation and also the time element specification. It looks like it was part of HTML5 but was removed at some later point. According to this GitHub comment on the react project, it was replaced by the itemprop attribute, as in itemprop="datePublished". See also this w3 example. Phew. -- anarcat 2022-09-01 For pubdate, I created pubdate not valid for html5 in 2020, with a patch. I've applied that in my opinionated ikiwiki container. -- Jon, 2022-09-06 Posted Thu Sep 1 11:42:32 2022 Edit ?Discussion wishlist: make variable where httpauth takes the user configurable I recently migrated from the (no longer supported) mod_auth_kerb to its designated replacement, mod_auth_gssapi for HTTP authentication. mod_auth_kerb sets REMOTE_USER to the Krb5 name that authenticated (e.g., wouter@EXAMPLE.COM). mod_auth_gssapi does not do so; it sets it in the GSS_NAME variable, instead. It would be awesome if the httpauth plugin would accept a configuration value to set the variable in which to look for the username to account for cases like these. Posted Thu Aug 18 04:50:50 2022 Edit ?Discussion WSL: (110: Connection timed out) while reading upstream Hello. I've just installed ikiwiki on Debian WSL and what I tried so far is working, but a thing: the websetup page is loading until it reaches a timeout and I can't see any button to save preferences at the bottom of the page. This is the log: 2022/08/01 20:10:13 [error] 3881#3881: *2 upstream timed out (110: Connection timed out) while reading upstream, client: 172.26.16.1, server: cuspide, request: "POST /ikiwiki.cgi HTTP/1.1", upstream: "fastcgi://unix:/var/run/fcgiwrap.socket:", host: "cuspide:8080", referrer: "http://cuspide:8080/ikiwiki.cgi?do=prefs" Posted Mon Aug 1 14:45:51 2022 Edit ?Discussion mdwn: URIs with parentheses are not rendered properly (with at least discount) With Ikiwiki, mdwn, and discount configured, the following syntax [some link with parens in it](http://foo.com/parens(yeah)) Has a broken URI (missing the closing parenthesis) and renders the second parenthesis outside of the link. Here's it live on ikiwiki.info: some link with parens in it) Bug present in at least discount 2.2.6 and 2.2.7 and merely exposed by IkiWiki. Note that upstream consider this to be not-a-bug/"behavior follows specs": https://github.com/Orc/discount/issues/241 The following alternative markdown implementations get this right: libtext-markdown-perl 1.000031 (debian -3) multimarkdown 1.000035 (debian -2) commonmark)) I note the irony of the commonmark URI being an apt demo of the problem. — Jon, 2021-11-05 Posted Fri Nov 5 05:43:55 2021 Edit ?Discussion logged in users can remove any comments [ the precise circumstances around which this can happen are still being nailed down ] remove says: Users can only remove things that they are allowed to edit or upload. This permits a logged-in user to remove comments by other users, which might be unexpected. — Jon, 2021-09-30 Posted Thu Sep 30 09:59:31 2021 Edit ?Discussion newer email tokens don't replace older ones if I request more than one email login link, the first token received still has to be used. Using a later one triggers "bad token" error ikiwiki version 3.20200202.3 Posted Fri May 14 18:06:55 2021 Edit ?Discussion disabling theme plugin should trigger site rebuild Disabling theme should trigger a site rebuild, just as enabling it does. In particular when performing the operation via the websetup front-end. — Jon, 2021-01-05 Posted Tue Jan 5 12:07:55 2021 Edit ?Discussion meta directive with multiple authors Some wiki pages have multiple authors. It seems logical that you would use multiple meta directives to mark this, [[!meta author="author one"]] [[!meta author="other author"]] however, when you do this, it appears that things that key off of the author tag only pick up on the last instance of the directive. for example a page spec looking for author(author one) will not match while one looking for author(other author) will match. I would expect that both would match. Posted Mon Oct 26 22:43:44 2020 Edit Discussion graphviz wide characters If you include a wide character, such as a fancy quote, in a graphviz source file for use with the file parameter to the graph directive, you get the following error: [[!graph Error: Wide character in subroutine entry at /usr/share/perl5/IkiWiki/Plugin/graphviz.pm line 57.]] Note, this is what renders on the resulting wiki page, not something that you see on the command line. Since dot supports UTF-8, I would expect this to work. I'm unsure if this is a bug in the graphviz plugin, or in the perl module it depends upon, but figured I would start here. This reminds me of table can not deal with Chinese —Jon, 2020-11-02 Posted Sat Oct 24 01:45:05 2020 Edit ?Discussion flip html5 default to 1, and clean up templates Is it perhaps time to flip the default for the html5 to 1? What criteria should be used to answer that question? With smcv's last major change in this area, back in 2014, the market share of IE8 and earlier was a concern at 5%. What is the equivalent market share today? The templates are still a real complex mess of branches around this configuration option. I'd love to see all that branching removed. Would anyone else? A hypothetical future html4 option/plugin could work by post-processing the generated output and replacing the troublesome tag names (via XSLT perhaps, depending on tooling). Is there any appetite for this? —Jon, 2020-10-05 Posted Mon Oct 5 11:27:11 2020 Edit ?Discussion the data argument for the table directive should follow linking rules when using the table directive with the table plugin, if I use the data argument to specify a file as a source of the data, I currently have to give a full path from the root of the wiki to the file. I should be able to give just the file name and have the file located using the same rules that are followed when creating wiki links. Posted Tue Jun 30 17:02:14 2020 Edit ?Discussion responsive_layout does not workin in edit mode The responsive_layout option (which flags ikiwiki pages as not broken on small displays) is not applied in edit mode (or other CGI generated pages). This can be verified easily by checking the meta tags in the pages's source or using Firefox's page info (Ctrl-i), which contains a width=device-width, initial-scale=1 viewport option in rendered pages but not the editing. As a result, page editing from mobile is tedious, as it involves scrolling around not only in the edit window but also the scrolled page as a whole. I've given it a try with a local copy of a saved page into which the meta was edited, and the page could be edited much more smoothly on mobile when the meta was set on the edit page (as was expected -- it works well on the regular pages, after all). There was still some scrolliness due to the large width of the commit message field, but that could be a bug in the used theme and even so does not limit the usefulness of setting this on all generated pages as long as the theme is basically responsive. Posted Sun May 24 06:42:06 2020 Edit ?Discussion emailauth bypasses account_creation_password I have had the following in my ikiwiki.setup since 2016: account_creation_password: XXXXXXXXXXXX The XXX is made of lowercase, uppercase and digits, randomly generated. I would expect this to stop any account creation. Yet new accounts get created all the time: w-anarcat@marcos:~/source/.ikiwiki$ perl -le 'use Storable; my $userinfo=Storable::retrieve("userdb"); print $userinfo->{$_}->{regdate} foreach keys %$userinfo' | sort -n | tail -10 1587487021 1587574304 1587695540 1587770285 1588354442 1588409505 1589257010 1589834234 1590175162 1590176201 The last two timestamps, for example, are today. I'm not absolutely certain, but I believe that account is an emailauth account: 'zemihaso_hfdsf.sadsdskfm.com' => { 'regdate' => 1590175162, 'passwordless' => 'd8de5ec25cfd68e64318fe6353c6428a', 'subscriptions' => 'comment(blog/2020-04-27-drowning-camera)', 'email' => 'zemihaso@hfdsf.sadsdskfm.com' }, It's obviously a spammer. It seems to be attacking my wiki by doing the following: register an account with emailauth subscribe to the page spam the page with a comment which then sends email to the victim(s) It's all kind of a mess. I'm at the point in my anti-spam protection where I am seriously considering disabling all user registration and all comments on all pages. Maybe delegate this to Mastodon or some other third-party commenting system, because I'm just tired of dealing with spam and bounces... Anyone else seeing this? Shouldn't the account_creation_password setting apply to emailauth? What else am I missing? Thanks! -- anarcat Posted Fri May 22 20:33:50 2020 Edit ?Discussion aggregate web trigger sends response as text/plain With IkiWiki 3.20200202.3, aggregate's web trigger sends it's response as HTTP 200, Content-Type: text/plain, followed by a payload that seems to include a Content-type in the body accidentally, and a bunch of HTML: qusp▶ GET -e "https://$redacted/ikiwiki?do=aggregate_webtrigger" Enter username for Git Access at REDACTED:443: admin Password: 200 OK Connection: close Date: Mon, 20 Apr 2020 08:27:39 GMT Server: nginx/1.14.2 Content-Length: 2467 Content-Type: text/plain Client-Date: Mon, 20 Apr 2020 08:27:39 GMT Client-Peer: 31.51.75.214:443 Client-Response-Num: 1 Client-SSL-Cert-Issuer: /C=US/O=Let's Encrypt/CN=Let's Encrypt Authority X3 Client-SSL-Cert-Subject: /CN=REDACTED Client-SSL-Cipher: ECDHE-RSA-CHACHA20-POLY1305 Client-SSL-Socket-Class: IO::Socket::SSL Aggregation triggered via web. Content-type: text/html <!DOCTYPE html> <html xmlns="http://www.w3.org/1999/xhtml'''
