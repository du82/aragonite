["https://ikiwiki.info/recentchanges"]
title = "RecentChanges"
description = "Changed pages:"
full_description = '''Recent changes to this wiki: RSS Changed pages: wikiicons/search-bg.gif Changed by: jon Commit type: git Date: 15:13:31 10/07/25 search-bg.gif: transparent bg, mid-grey colour This works in both light and dark modes. diff --git a/doc/wikiicons/search-bg.gif b/doc/wikiicons/search-bg.gif index 02f9da4a7..a4fc51b8a 100644 Binary files a/doc/wikiicons/search-bg.gif and b/doc/wikiicons/search-bg.gif differ Changed pages: wikiicons/openidlogin-bg.png Changed by: jon Commit type: git Date: 14:04:00 10/07/25 attempt to rework openid logo diff --git a/doc/wikiicons/openidlogin-bg.png b/doc/wikiicons/openidlogin-bg.png new file mode 100644 index 000000000..8c4c6da37 Binary files /dev/null and b/doc/wikiicons/openidlogin-bg.png differ diff --git a/themes/lightdark/style.css b/themes/lightdark/style.css index 9994cfdc4..fdbe42ca4 100644 --- a/themes/lightdark/style.css +++ b/themes/lightdark/style.css @@ -46,6 +46,10 @@ pre.hl { color: inherit; background-color: inherit; } .hl.sym { color: inherit; } .hl.kwc { color: inherit; } +input#openid_identifier { + background: url(wikiicons/openidlogin-bg.png) no-repeat; +} + input#openid_identifier, input#searchbox { diff --git a/underlays/login-selector/ikiwiki/login-selector/login-selector.js b/underlays/login-selector/ikiwiki/login-selector/login-selector.js index a8017e712..15f3aac3a 100644 --- a/underlays/login-selector/ikiwiki/login-selector/login-selector.js +++ b/underlays/login-selector/ikiwiki/login-selector/login-selector.js @@ -16,7 +16,7 @@ var selections_email_large = { var selections_openid_large = { openid: { name: 'OpenID', - icon: 'wikiicons/openidlogin-bg.gif', + icon: 'wikiicons/openidlogin-bg.png', label: 'Enter your OpenID:', url: null } Changed pages: todo/mastodon comments Changed by: anarcat Commit type: web Date: 13:42:59 03/03/25 more messing around mastodon diff --git a/doc/todo/mastodon_comments.mdwn b/doc/todo/mastodon_comments.mdwn index cd9aaa145..e73ea979d 100644 --- a/doc/todo/mastodon_comments.mdwn +++ b/doc/todo/mastodon_comments.mdwn @@ -13,3 +13,35 @@ Or maybe i just need to make a new template and insert it in my blog posts... po >> I'm not even sure this is a good idea. The first test I did was a "test comment" which led to half a dozen "test reply" and then I realized i couldn't redact individual posts from there. Ugh. I don't even know if, when I mute a user, it actually gets hidden from everyone else too... >> >> So I'll test this for a while, I guess. + +# Update: the feed2exec diversion + +There's another thing that's needed to make this work, which I didn't mention above, which is to automatically *post* new entries to Mastodon when they show up, because otherwise the above needs you to manually post the thing to Mastodon. It's kind of a mess. At first, I implemented this as a [feed2exec](https://gitlab.com/anarcat/feed2exec) plugin called [ikiwikitoot.py](https://gitlab.com/anarcat/feed2exec/-/blob/main/feed2exec/plugins/ikiwikitoot.py) but that didn't work reliably: there was this horrible bootstrapping issue that you had to first post the article, then run the RSS feed, and that modifies the article again. + +This didn't work reliably for me, so I added more duct-tape so you can now run the command directly without going through the RSS feed. I ended up with the following post-receive hook in my `source.git`: + +``` +w-anarcat@marcos:~/source.git$ cat hooks/post-receive +#!/bin/sh + +/home/anarcat/src/feed2exec/feed2exec/plugins/ikiwikitoot.py --post-receive --base-url https://anarc.at/ +``` + +And the code still lives in feed2exec... It makes use of my second Python parser for ikiwiki directives (ugh) which really makes me feel like this should be implemented natively as a real ikiwiki plugin instead. + +I'm not sure how this would work: we'd need to somehow keep state of which page is associated with which mastodon post. In theory, this could be kept in .ikiwiki, but i find that iffy: i really like the idea of having the mastodon post directly in the git source, but i'm not aware of any ikiwiki plugin actually modifying the source, that seems to be traditionnally a "no no". + +I would also really like ikiwiki to render comments as static HTML. This would add a couple benefits over the current approach: + + 1. no javascript necessary + 2. reduce load on the mastodon server (the current approach hits the server for every *visitor* that hits the "load comments" button, which is not kind to the mastodon server) + 3. reduce reliance on the upstream mastodon server to be up (right now, if mastodon goes away, comments disappear) + 4. allow for moderation on the ikiwiki side (right now, we're completely subject to the mastodon server moderation, if we don't like a comment, we can't remove it without removing it from the mastodon server) + +But that's even more work. I definitely like the idea of adding `!comment` directives to existing posts though, this feels nice, and it's easy to remove them to do moderation. + +The trick is "when do you post updates": short of having a daemon (or CGI?) that receives activitypub pushes, we'd need *something* that pulls new updates on a regular basis anyways, so it's not clear how easy it would be to actually implement. + +Still, moving that code from feed2exec/python to ikiwiki/perl (or ikiwiki/python, there's precedents here), would be an important step, IMHO. + +Thoughts? -- [[anarcat]] 2025-03-03 Changed pages: todo/support for light and dark mode Changed by: joeyh Commit type: git Date: 16:46:55 02/28/25 comments diff --git a/doc/todo/support_for_light_and_dark_mode.mdwn b/doc/todo/support_for_light_and_dark_mode.mdwn index 5e4b408c3..8389f3e39 100644 --- a/doc/todo/support_for_light_and_dark_mode.mdwn +++ b/doc/todo/support_for_light_and_dark_mode.mdwn @@ -106,6 +106,8 @@ is probably the best way to implement this. >> [[support dark mode in antitheme]]: making the other existing themes >> support light-and-dark mode. That could be valuable, at least in the >> short term. +>> +>>> actiontabs strikes me as a good one to support it. --[[Joey]] >> >> I concur that adjusting the antitheme to support light/dark mode could >> be regarded as a breaking change for existing users. I think we should @@ -150,3 +152,13 @@ is probably the best way to implement this. >>>>> switch <https://ikiwiki.info> over to it. One thing that will need >>>>> adjusting for that, though, is the ikiwiki logo: [[ikiwiki_logo|logo/ikiwiki.png]] >>>>> — [[Jon]], *2024-10-09* + +>>>>>> I am game for switching ikiwiki.info over to it. Indeed I plan to +>>>>>> switch a lot of little websites like that over to it. +>>>>>> +>>>>>> My time and attention for this is sadly limited. Thanks for doing this work. +>>>>>> I have upgraded ikiwiki on branchable, so it should be possible to +>>>>>> change the ikiwiki.info setup once you sort out the icon (maybe +>>>>>> adding just a small white border would suffice), and smcv and schmonz +>>>>>> both have the admin bit to do it. Or feel free to reach out to me by email. +>>>>>> --[[Joey]] Changed pages: bugs/po test failing on debian stable Changed by: joeyh Commit type: git Date: 16:29:14 02/28/25 po test bug report diff --git a/doc/bugs/po_test_failing_on_debian_stable.mdwn b/doc/bugs/po_test_failing_on_debian_stable.mdwn new file mode 100644 index 000000000..389868b3a --- /dev/null +++ b/doc/bugs/po_test_failing_on_debian_stable.mdwn @@ -0,0 +1,17 @@ +Building current master on debian stable: + + Failed test at t/po.t line 538. + # '<p>Tails takes <BD> hour to install</p> + # ' + # doesn't match '(?^usx: + # .* + # L'installation\sde\sTails\sdure\s<BD>\sheure + # .* + # )' + # Looks like you failed 1 test of 126. + t/po.t ......................... + Dubious, test returned 1 (wstat 256, 0x100) + +The failing code comes from "t/po.t: add test for UTF-8 vs. po4a 0.58+" + +It builds ok on debian unstable. --[[Joey]] Changed pages: todo/admonitions Changed by: jmtd Commit type: web Date: 06:46:53 02/22/25 done diff --git a/doc/todo/admonitions.mdwn b/doc/todo/admonitions.mdwn index 16f0b00ee..9350e154e 100644 --- a/doc/todo/admonitions.mdwn +++ b/doc/todo/admonitions.mdwn @@ -168,3 +168,5 @@ the actiontab theme enabled: >> It turned out to be a simple fix, a missing semicolon. [patch here](https://github.com/jmtd/ikiwiki/commit/3e31200ed258ba1f7ab1652d6bc2d035a9e5c990). The rest of that branch is just your admonitions branch rebased onto `3.20200202.3`. *—[[Jon]], 2021-02-18* >>> Interesting. That was of course, a missing semicolon, not sure how I missed that. I cherry-picked your patch, but I wonder why I wasn't seeing the problem on my end... Maybe I had other padding that was covering for this... Thanks, in any case! :) -- [[anarcat]] + +[[done]]. *— [[Jon]], 2025-02-22* Changed pages: users/jon Changed by: jmtd Commit type: web Date: 06:46:17 02/22/25 rm 'review requested': all done diff --git a/doc/users/jon.mdwn b/doc/users/jon.mdwn index 0e825b28d..f3e587710 100644 --- a/doc/users/jon.mdwn +++ b/doc/users/jon.mdwn @@ -22,11 +22,3 @@ piece of software for this task. * slides at <http://www.staff.ncl.ac.uk/jon.dowland/unix/docs/>. -## Review requested - -I prefer to have another pair of eyeballs ACK my own patches where -possible. These are ready for a look: - - * [[bugs/backlinks onhover thing can go weird]] - * [[todo/don't generate an empty parentlink span]] - * [[todo/add a search plugin that uses duckduckgo]] Changed pages: todo/fix ikiwiki logo in dark mode Changed by: jmtd Commit type: web Date: 06:45:24 02/22/25 logo needs fixing diff --git a/doc/todo/fix_ikiwiki_logo_in_dark_mode.mdwn b/doc/todo/fix_ikiwiki_logo_in_dark_mode.mdwn new file mode 100644 index 000000000..0728f0140 --- /dev/null +++ b/doc/todo/fix_ikiwiki_logo_in_dark_mode.mdwn @@ -0,0 +1,6 @@ +[[As mentioned here|support for light and dark mode]], the logo needs +fixing for dark mode: + +[[!img logo/ikiwiki.png]] + +*— [[Jon]], 2025-02-22* Changed pages: news/version 3.20250221 Changed by: jon Commit type: git Date: 17:03:55 02/21/25 add news item for ikiwiki 3.20250221 diff --git a/doc/news/version_3.20250221.mdwn b/doc/news/version_3.20250221.mdwn new file mode 100644 index 000000000..cd6cd7b6d --- /dev/null +++ b/doc/news/version_3.20250221.mdwn @@ -0,0 +1,25 @@ +ikiwiki 3.20250221 released with [[!toggle text="these changes"]] +[[!toggleable text=""" +* [ Jonathan Dowland ] + * po.pm: fixes for po4a ≥ 0.70. + * CGI::printheader: optional HTTP status argument + * comments: return HTTP 202 for moderated comments + * page.tmpl: don't generate an empty parentlinks span + * new plugins: + * Jason Blevins' h1title plugin (previously external/contrib) + * DuckDuckGo plugin for site searching + * new theme: lightdark. Supports browse preferences for light or + dark mode. + * Default html5 to '1' + * Remove charset attribute from forms + * Use the HTML5 details tag for more backlinks + +* [ Paul Wise ] + * Remove extra quote character from date spans + +* [ intrigeri ] + * t/po.t: Add missing PO header + +* [ Antoine Beaupré ] + * admonitions plugin +"""]] Changed pages: todo/fix assumption git branch is master Changed by: jon Commit type: git Date: 17:55:24 02/18/25 todo: fix assumption git branch is master diff --git a/doc/todo/fix_assumption_git_branch_is_master.mdwn b/doc/todo/fix_assumption_git_branch_is_master.mdwn new file mode 100644 index 000000000..cbf655c7e --- /dev/null +++ b/doc/todo/fix_assumption_git_branch_is_master.mdwn @@ -0,0 +1,7 @@ +`Git.pm` and several tests (and perhaps other things) implicitly assume +the default branch for a repository is `master`. This is currently still +the Git default, but can be overridden by a user (`init.defaultBranch`: +try setting it and running the test suite!). We should make `Git.pm` +more robust by settings `init.defaultBranch` on locally-created repos to +match our assumption (or to match setup's `gitmaster_branch`) +*— [[Jon]], 2025-02-18* Changed pages: templates Changed by: jon Commit type: git Date: 14:05:50 02/18/25 Document duckduckgoform.tmpl diff --git a/doc/templates.mdwn b/doc/templates.mdwn index 378e579ba..f5e47e7d5 100644 --- a/doc/templates.mdwn +++ b/doc/templates.mdwn @@ -74,8 +74,8 @@ Here is a full list of the template files used: * `feedlink.tmpl` - Used to add rss/atom links if `blogpost.tmpl` is not used. * `aggregatepost.tmpl` - Used by the aggregate plugin to create a page for a post. -* `searchform.tmpl`, `googleform.tmpl` - Used by the search plugin - and google plugin to add search forms to wiki pages. +* `searchform.tmpl`, `googleform.tmpl`, `duckduckgoform.tmpl` - Used by the + search plugin, google and duckduckgo plugins to add search forms to wiki pages. * `searchquery.tmpl` - This is a Omega template, used by the search plugin. * `comment.tmpl` - Used by the comments plugin to display a comment. Changed pages: plugins/contrib/album Changed by: AwesomeAdam12345 Commit type: web Date: 22:46:19 02/08/25 Add alternatives to broken download links diff --git a/doc/plugins/contrib/album.mdwn b/doc/plugins/contrib/album.mdwn index 9fac11164..9bdb304f4 100644 --- a/doc/plugins/contrib/album.mdwn +++ b/doc/plugins/contrib/album.mdwn @@ -59,15 +59,21 @@ First, you need a version of ikiwiki with the [[trail]] plugin merged in Manual installation requires these files (use the "raw" link in gitweb to download): -* [album.pm](http://git.pseudorandom.co.uk/smcv/ikiwiki.git/blob/album5:/IkiWiki/Plugin/album.pm) +* [album.pm](http://git.pseudorandom.co.uk/smcv/ikiwiki.git/blob/album5:/IkiWiki/Plugin/album.pm) / + [cbaine's album.pm](https://git.cbaines.net/ikiwiki/plain/IkiWiki/Plugin/album.pm?h=git-annex-album) in an `IkiWiki/Plugin` subdirectory of your configured `plugindir` -* [albumviewer.tmpl](http://git.pseudorandom.co.uk/smcv/ikiwiki.git/blob/album5:/templates/albumviewer.tmpl), - [albumitem.tmpl](http://git.pseudorandom.co.uk/smcv/ikiwiki.git/blob/album5:/templates/albumitem.tmpl), - [albumnext.tmpl](http://git.pseudorandom.co.uk/smcv/ikiwiki.git/blob/album5:/templates/albumnext.tmpl) and - [albumprev.tmpl](http://git.pseudorandom.co.uk/smcv/ikiwiki.git/blob/album5:/templates/albumprev.tmpl), +* [albumviewer.tmpl](http://git.pseudorandom.co.uk/smcv/ikiwiki.git/blob/album5:/templates/albumviewer.tmpl) / + [cbaine's albumviewer.tmpl](https://git.cbaines.net/ikiwiki/plain/templates/albumviewer.tmpl?h=git-annex-album), + [albumitem.tmpl](http://git.pseudorandom.co.uk/smcv/ikiwiki.git/blob/album5:/templates/albumitem.tmpl) / + [cbaine's albumitem.tmpl](https://git.cbaines.net/ikiwiki/plain/templates/albumitem.tmpl?h=git-annex-album), + [albumnext.tmpl](http://git.pseudorandom.co.uk/smcv/ikiwiki.git/blob/album5:/templates/albumnext.tmpl) / + [cbaine's albumnext.tmpl](https://git.cbaines.net/ikiwiki/plain/templates/albumnext.tmpl?h=git-annex-album) and + [albumprev.tmpl](http://git.pseudorandom.co.uk/smcv/ikiwiki.git/blob/album5:/templates/albumprev.tmpl) / + [cbaine's albumprev.tmpl](https://git.cbaines.net/ikiwiki/plain/templates/albumprev.tmpl?h=git-anne'''
