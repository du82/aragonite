["https://ilga.gov/commission/lig/LegislativeInspectorGeneral.asp"]
title = "Illinois General Assembly, Legislative Inspector General"
full_description = "Legislative Inspector General Michael P. McCuskey was appointed to that position by joint resolution of the General Assembly on February 23, 2022. Prior to that appointment, he served as a federal district court judge from 1998 to 2014, during which time he served as Chief Judge for the Central District of Illinois from 2004 to 2012. Both before and after serving as a federal judge, he also served as a state court judge, both at the trial court and appellate court levels. He served as Chair of the Board of Trustees of Illinois State University from 2008 to 2014, and as a member of the Board of Directors of the American Red Cross for Central Illinois from 1991 to 1998. In 1991, he received an award of excellence for meritorious service from the Illinois Public Defender Association. He received a Bachelor of Science degree in education from Illinois State University; was a history teacher and baseball coach at Ottawa High School in Ottawa, Illinois; then in 1975 graduated with a Juris Doctor degree from Saint Louis University School of Law."
year_published = 2025
