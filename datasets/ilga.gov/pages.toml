["https://ilga.gov/commission/jcar/default.asp"]
title = "JCAR Home Page"
full_description = "The Joint Committee on Administrative Rules is a bipartisan legislative oversight committee created by the General Assembly in 1977. Pursuant to the Illinois Administrative Procedure Act, the committee is authorized to conduct systematic reviews of administrative rules promulgated by State agencies. JCAR conducts several integrated review programs, including a review program for proposed, emergency and peremptory rulemaking, a review of new Public Acts and a complaint review program. JCAR is composed of 12 legislators who are appointed by the legislative leadership, with the membership apportioned equally between the two houses and the two political parties. It is co-chaired by 2 members representing each party and each legislative house. Support services for the committee are provided by the JCAR staff. Two purposes of JCAR are to ensure that the General Assembly is adequately informed of how laws are implemented through agency rulemaking and to facilitate public understanding of rules and regulations. To that end, in addition to the review of new and existing rulemaking, JCAR monitors legislation that affects rulemaking and conducts a Public Act review to alert agencies to the need for rulemaking. It also publishes a weekly newsletter called The Flinn Report on the General Assembly website to inform and educate Illinois citizens about current rulemaking activity and maintains the State's database for the Illinois Administrative Code and Illinois Register. E-mail JCAR JCAR Home Page | Member Listing | Administrative Code | Flinn Report | Illinois RegisterIllinois General Assembly Home Page"
year_published = 2025
clearnet = "https://ilga.gov/commission/jcar/default.asp"
