["https://ilga.gov/commission/lig/revolvingdoor.asp"]
title = "Illinois General Assembly, Legislative Inspector General"
full_description = "The Illinois �Revolving Door� statute (5 ILCS 430/5-45) is an anti-corruption statute aimed at preventing conflicts of interest in awarding State contracts, approving contract change orders, or making executive branch regulatory or licensing decisions. The statute imposes a one-year �cooling off� period after leaving State office or employment during which time State personnel who in the previous year awarded, approved, or supervised those who awarded or approved, $25,000 or more in State contracts or change orders to a contractor (or a parent or subsidiary) are prohibited from accepting employment with or receiving compensation from the entity involved. The restrictions of the statute also apply to the prohibited person�s spouse or immediate family member living with them. Especially stringent prohibitions are placed on Members of the General Assembly and certain senior staff, including chiefs of staff and deputy, associate, and assistant chiefs of staff of offices of the General Assembly, Senate, House of Representatives, President and Minority Leader of the Senate, Speaker and Minority Leader of the House of Representatives, Senate Operations Commission, and legislative support agencies. All such persons should consult with their ethics officers regarding application to them of subsection (h) of the statute. Violation of the revolving door statute is a serious offense and subject to an administrative fine of up to 3 times the annual compensation that would have been obtained in violation of the restrictions. Also, intentional violation of the revolving door statute is subject to criminal prosecution as a Class A misdemeanor. (5 ILCS 430/50-5) If you do not know whether you are subject to the revolving door statute, contact your ethics officer. - Subsections (a) and (h) of the statute define classes of people who are subject to the one-year cooling off period, regardless of position; and - Subsection (c) defines a list of positions that may be subject to the cooling off restriction, subject to individualized review and determination by the LIG."
year_published = 2025
