description = "Disclaimers for the Illinois General Assembly web site"
full_description = "These notices apply only to the Illinois General Assembly website.� The home page URL is http://ilga.gov. All sub-strings are part of this website. An example of a sub-string is http://www.ilga.gov/commission/lis/lis_home.html. This website is provided as a public service. Access is subject to the following terms and conditions, which you expressly accept by using this site. Please read this document carefully. Personal information is information about an individual that is readily identifiable to that specific individual. Personal information includes personal identifiers such as an individual's name, address, and phone number. A domain name, Internet Protocol address, or date and time of access is not considered personal information. We will not obtain any personal information about you when you visit this site unless you voluntarily choose to provide that information. Personal information you choose to provide will be used by us only for official business purposes. For example, if you send an e-mail message or complete a web form that contains personal information, we may retain your e-mail address and other information as appropriate for official business purposes. Release of personal information you choose to provide to us will be governed by applicable law. Personal information you provide to us will not be sold or leased and will not be disclosed to any unauthorized person. Any personal information retained by the Illinois General Assembly will be protected by appropriate security controls. The Illinois General Assembly is committed to complying fully with the Children's Online Privacy Protection Act. Accordingly, if you are under the age of 13, you are not authorized to provide us with personally identifying information. We appreciate your cooperation with this federally mandated requirement. Users are cautioned that the collection of personal information volunteered by children on-line or by e-mail will be treated the same as information given by an adult and may be subject to public access."
