title = "Google Page Speed Insights und deren Bedeutung - imagebin.org"
description = """
Die Page Speed Insights sind ein Analyse-Tool für die Ladezeiten von Websites, das mit jeder beliebigen URL funktioniert. Die Ergebnisse werden getrennt sowohl für die Mobil- als auch für die Desktop-Version der jeweiligen Seite ausgegeben. Google richtet sich hierbei primär an die Werte der mobilen Ansicht und listet nach diesem Wert.
Die Parameter die wirklich entscheiden
Page-Speed Insights liefern Ihnen keine detaillierten Analyse-Ergebnisse zur Verwertung, um die Ladezeiten Ihrer Homepage bedeutsam optimieren zu können. Dabei sollte es das oberste Ziel sein, diese Ladezeiten zu optimieren. Gerade die subjektive Ladezeit ist eine spezielle Kennzahl für sich. Google wertet die Ladezeit anhand des Deltas aus, welches in Zeiteinheiten verstreicht, bis alle Inhalte vollständig geladen sind. Aus der subjektiven Sicht kann die gesamte Webseite schon geladen sein, obwohl dies in Wirklichkeit nicht der Fall ist. So können Sie zum Beispiel den eigentlichen Content der Pages zuerst laden und Bilder oder ergänzende Videos erst dann, wenn der Webseitenbenutzer diese “anfordert”. So erhöhen Sie die Benutzerfreundlichkeit Ihrer Homepage.
 
Wenn Sie die Ladezeiten nur für die Suchmaschine erhöhen, kann diese Bemühung auch in die falsche Richtung gehen. Sofern Sie nur daraufsetzen, dass alle Bestandteile Ihrer Webseite für den Algorithmus der Suchmaschine schnell geladen werden, so verschlechtert sich die Benutzerfreundlichkeit stark. Denn Sie setzen keinen Fokus auf den Benutzer, sondern für die Suchmaschinen. Diese stehen jedoch nicht an erster Stelle, dies ist der Besucher.
Das Resultat der Page-Speed-Analyse ist allerdings nicht ein einziger Wert, es setzt sich vielmehr aus verschiedenen Kennzahlen zusammen:
First Contentful Paint & DOM Content Loaded (FCP und DCL)
 
 

FCP (First Contentful Paint) orientiert sich an dem Zeitpunkt während des Ladens einer Seite, zu dem die ersten Inhalte für die Nutzer sichtbar werden (seien es Texte oder Bilder). Entscheidend ist hier also, wie schnell Nutzer mit der Website interagieren können.

 

DCL (DOM Content Loaded) gibt den Zeitpunkt an, zu dem das HTML-Dokument vollständig geladen und analysiert ist. Hier geht es also um die Frage, wie schnell Textinhalte komplett eingesehen werden können.

Analyse-Report
 Zuletzt zeigen die Analyseberichte bereits selbstständig Optimierungsvorschläge an, die aus rein technischer Perspektive für richtig erscheinen. Diese sollten allerdings immer kritisch hinterfragt und nicht blind übernommen werden. Dadurch könnten sich verschiedene Optimierungen zwar gut auf die Ladezeiten auswirken, dafür aber an anderer Stelle die Usability der Webseite verschlechtern.
Außerdem wird Ihnen Page Speed Insights auch dann noch Verbesserungsvorschläge unterbreiten, wenn die Gesamtperformance schon sehr gut ist. Wie bereits erläutert, kann in diesem Fall häufig davon abgesehen werden, weitere Verbesserungen vorzunehmen.
Eine Hilfe bei der Einschätzung, welche Optimierungsansätze sich auszahlen könnten, bietet das Tool aber ebenfalls: So gibt es eine geschätzte Einsparung in Sekunden an, die eine konkrete Modifikation bedeuten würde.
Die Optimierung langer Ladezeiten für mehr Performance
Falls Ihre Website zu lange Ladezeiten aufweist, kann das unterschiedlichste Gründe haben. Zu den häufigsten gehören aber die Folgenden, die sich glücklicherweise auch relativ schnell beheben lassen:
 

Die Response-Ladezeit des Servers ist zu lang:

 
Grundvoraussetzung, damit eine Seite schnell laden kann, ist eine schnelle Server-Antwort. Eine Möglichkeit zur Beschleunigung ist die Anschaffung stärkerer Hardware, eine andere die Vermeidung von Weiterleitungen, die Redirects, die zum Beispiel bei fehlerhaften internen Verlinkungen greifen.
 

Zu große Bilder:

 
Den wesentlichsten Anteil an der Dateigröße einer HTML-Seite haben in der Regel Bilder. Werden diese nicht gezielt komprimiert, können sie mehrere Megabyte einnehmen und die Ladezeiten unnötig verlängern. Stattdessen sollten Bilder entweder händisch mit entsprechender Bearbeitungssoftware in der Größe reduziert werden.
 

Mangelhaftes Browser-Caching:

 
Wird das Caching aktiviert, werden die Inhalte beim Aufrufen einer Seite lokal zwischengespeichert, sodass ein erneutes Laden deutlich schneller vonstattengeht.
 

Entfaltung des vollen Potenzials der Codezeilen im Quelltext:

 
Immer öfter werden beim Seitenaufruf regelmäßig Scripts geladen, die überhaupt nicht mehr genutzt werden. Diese sollten gelöscht werden, damit der Quellcode nicht unnötig aufgebläht wird. Um zu erkennen, welche Codezeilen überflüssig sind, können Sie verschiedene Browser-Tools nutzen.
 

Mangelhafte Strategie zur Priorisierung sichtbarer Inhalte:

 
Die Inhalte einer Website sollten stets von oben nach unten geladen werden. Im Idealfall lädt der ATF-Content (above the fool), der für die Nutzer ohne zu scrollen auf den ersten Blick sichtbar ist, so im Bruchteil von Sekunden. Ist der Ladevorgang weiter unten noch nicht abgeschlossen, stört das nicht, da die Nutzer die Wartezeit hier nicht bewusst wahrnehmen."""
