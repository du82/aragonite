title = "Hosted Authentication with EmailEngine"
description = "To get quickly up and running, EmailEngine provides a hosted email authentication form that you can use to integrate with your application."
full_description = "While you can always add new email accounts directly via EmailEngine's API, you also have the option to let EmailEngine take care of the entire setup process. This approach simplifies user interactions and reduces complexity in your application. With hosted authentication, you direct your users to EmailEngine’s web-based form, where they provide their email server credentials. After successful configuration, EmailEngine stores the account settings and redirects the user back to your application, ready for use. Note: If you prefer not to use the hosted authentication form but need to manage OAuth2 flows, consider the alternative authentication server feature. How Does It Work?Your application generates a signed URL that links to your EmailEngine installation. This URL includes basic account details (such as account ID and user name) that EmailEngine will use during the setup process. Once your user is redirected to this URL, EmailEngine handles the rest by displaying the appropriate forms. After successful configuration, the user is redirected back to your application’s designated URL, and you can begin making API calls to interact with their email account. Important: To display options for Gmail or Outlook accounts, you need to configure these services ahead of time. Follow the specific guides for Outlook OAuth2 and Gmail OAuth2 integration."
