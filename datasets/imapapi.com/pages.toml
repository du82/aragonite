["https://imapapi.com/logging"]
title = "Logging"
description = "How to track what's going under the hood of EmailEngine"
full_description = '''EmailEngine logs all its messages to standard output in Pino format. Pino uses JSON structures with some predefined keys, so it is kind of human-readable but not really. Luckily, there are many tools that we can use to transform EmailEngine logs into a more suitable format. The working principle for all these log renderers is the same – you should pipe the standard output from EmailEngine to the log rendering process. You can limit output logs by setting a minimum log level. The default is trace, which means that everything is logged. jq is a well-known command for processing JSON structures in the command line. It is not EmailEngine specific at all, but we can easily use it to make EmailEngine logs slightly more readable. pino-pretty is a command-line utility that makes Pino formatted logs more readable. You can install it from the npm registry as a global command. eerawlog is an EmailEngine-specific log renderer. It is meant to help debug IMAP and API call transactions. This is the only thing it's suitable for, so it's not a general log renderer – it tends to throw away everything that is not IMAP-specific. Easier to understand how EmailEngine communicates with IMAP servers. Hard to see how the application is doing in general. EmailEngine must be started with the --log.raw=true command-line argument or with the EENGINE_LOG_RAW=true environment variable. Otherwise, detailed logs required by the eerawlog command will be disabled. You can filter by the keys listed in log entries by adding a cli argument --filter.[key]="value". If you want to include multiple values, set the same keyword multiple times. pino-gelf is another useful utility that sends all log messages from EmailEngine to a Graylog server. A neat feature is that pino-gelf can also work in a throughput mode so that it both sends the logs to Graylog and logs messages to console so we can mix it up with other tools like pino-pretty Something to keep in mind with pino-gelf is that it creates separate log keys only for root-level log entry keys. Object values are serialized into JSON strings:'''
year_published = 2025
clearnet = "https://imapapi.com/logging"
