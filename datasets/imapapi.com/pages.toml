full_description = '''Each request against the EmailEngine API must be authenticated with an access token. This requirement cannot be disabled in production, as certain parts of EmailEngine, such as the hosted authentication feature, assume that EmailEngine may be publicly accessible. Each request against the EmailEngine API must be authenticated with an access token. This requirement cannot be disabled in production, as certain parts of EmailEngine, such as the hosted authentication feature, assume that EmailEngine may be publicly accessible. To generate an access token, navigate to the "Access Tokens" page in EmailEngine's administration dashboard. Each token can have a specific scope assigned. For example, if you are using Prometheus to monitor EmailEngine, choose the "Metrics" scope. This limits access to only the necessary data, avoiding full API access. Access tokens are displayed only once. If you close the dialog without saving the token, you will not be able to retrieve it again, as EmailEngine stores only hashed tokens, not the actual token value. EmailEngine requires Bearer authorization for API requests. You must include the access token in the Authorization header as follows: Prometheus can scrape EmailEngine metrics from the /metrics endpoint (e.g., http://127.0.0.1:3000/metrics). These requests also require authorization, and you should generate an access token with the "Metrics" scope specifically for Prometheus. To enable Prometheus to authenticate with EmailEngine, include the following configuration in the scrape_configs section: To check if the /metrics endpoint is functioning, you can use a curl command similar to regular API requests:'''
