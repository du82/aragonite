["https://imapapi.com/bounces"]
title = "Bounces"
description = "EmailEngine scans incoming mail for bounce responses and notifies about these using webhooks."
full_description = '''Bounces in Message ListingsWhen listing messages in the Sent Mail folder, EmailEngine checks for bounces associated with each listed message. If a bounce is detected, it is included in the message entry as a bounces array. Here’s an example message listing that includes bounce information: { "id": "AAAAAgAAAZ0", "uid": 413, "date": "2021-11-28T10:17:27.000Z", "size": 839, "subject": "Example message", "from": { "name": "Sender Name", "address": "sender@example.com" }, "to": [ { "name": "", "address": "failed.recipient@example.com" } ], "messageId": "<4dbe4a40f37e9c2ba5b25912bc7c8997@example.com>", "bounces": [ { "message": "AAAAAQAABWw", "recipient": "failed.recipient@example.com", "action": "failed", "response": { "message": "550 5.1.1 <failed.recipient@example.com>: Recipient address rejected: User unknown in relay recipient table", "status": "5.1.1" }, "date": "2021-11-28T10:17:29.722Z" } ] } Retrieving Bounce ContentTo retrieve the actual contents of a bounce message, you can use the data.bounceMessage value from the webhook payload or the bounces[].message value from the message listing. For example, to fetch the bounce content for AAAAAQAABWw, use the following curl command: $ curl "http://localhost:3000/v1/account/ekiri/message/AAAAAQAABWw?textType=*" \ -H 'Authorization: Bearer d2d438e2a965...' The response will return the full content of the bounce message: { "id": "AAAAAQAABWw", "uid": 1388, "date": "2021-11-28T10:17:28.000Z", "unseen": true, "size": 3611, "subject": "Undelivered Mail Returned to Sender", "from": { "name": "Mail Delivery System", "address": "MAILER-DAEMON@smtp.example.com" }, "to": [ { "name": "", "address": "sender@example.com" } ], "attachments": [ { "id": "AAAAAQAABWwy", "contentType": "message/delivery-status", "encodedSize": 480, "filename": false, "embedded": false, "inline": false }, { "id": "AAAAAQAABWwz", "contentType": "message/rfc822", "encodedSize": 1437, "filename": false, "embedded": false, "inline": false } ], "messageId": "<20211128101728.144CB82458@smtp.example.com>", "text": { "plain": "This is the mail system at host smtp.example.com.\n\nI'm sorry to have to inform...", "html": "<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\">\n<html><body style=...", "hasMore": false } }'''
