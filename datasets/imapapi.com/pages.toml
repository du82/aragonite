["https://imapapi.com/configuration"]
title = "EmailEngine Configuration Guide – Setup and Customization Options"
description = "Learn how to configure EmailEngine using application and runtime settings. Discover command-line options, environment variables, and how to customize your EmailEngine setup for optimal performance."
full_description = "EmailEngine uses two types of configurations: Application Configuration: This is loaded when the application starts and includes settings such as the HTTP port number. Runtime Configuration: This can be updated at any time via the Settings API endpoint or through the built-in web interface. Examples include the webhook destination URL. You can configure the application using either command-line arguments or environment variables. If both are provided for the same setting, the environment variable will take precedence over the command-line argument. Queue SettingsConcurrency options for queue handling.By default, a queue worker processes one job at a time. If your queues are being processed too slowly, you can increase the concurrency values. However, increasing concurrency may result in events being processed out of order when the concurrency count is set higher than 1. Therefore, only increase these values if event order is not a critical concern. Configuration Option CLI Argument ENV Value Default Webhooks Concurrency Count --queues.notify=1 EENGINE_NOTIFY_QC=1 1 Submit Concurrency Count --queues.submit=1 EENGINE_SUBMIT_QC=1 1"
year_published = 2025
