["https://imapapi.com/email-templates"]
title = "Email templates"
description = "Email templating allows you to prepare and re-use email content with EmailEngine when sending out emails."
full_description = 'Email templating allows you to prepare and reuse email content efficiently. You can manage templates either by using the Templates API or via the administration interface (look for the Email templates link on the side menu). When sending emails using the Submission API endpoint, do not set the "subject", "html", or "text" properties. Instead, set the "template" property with the template ID value. EmailEngine will use the contents of that template to compile the email message. EmailEngine supports Handlebars syntax in templates. To utilize this feature, set the "render" property with the necessary replacement parameters. By default, HTML content in replacement parameters is sanitized. To insert unsanitized HTML content, use triple curly braces. For example, the parameter value {"key_name": "<h1>Hello</h1>"} will be inserted to the HTML section of the email as &lt;h1&gt;Hello&lt;/h1&gt; This inserts the parameter value into the template without any sanitization. The parameter value {"key_name": "<h1>Hello</h1>"} will be inserted as <h1>Hello</h1>. You can send multiple emails with a single API call using the mail-merge feature. Each recipient receives a separate email with only their address in the To: header, allowing for recipient-specific templating variables. Each recipient will receive a customized email with their specific information inserted into the template. Mail-merge emails can be sent as list emails by setting a listId property in the email structure. The listId should resemble a domain name. Recipients will recognize emails with the same listId as part of the same mailing list. If listId is set, EmailEngine adds common mailing list headers, including a one-click unsubscribe link. Email clients use these headers to provide an easy "unsubscribe" option. Note: Replace http://your-emailengine-instance.local with the actual URL of your EmailEngine instance.'
year_published = 2025
