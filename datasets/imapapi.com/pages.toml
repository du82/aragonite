["https://imapapi.com/sending-emails"]
title = "Sending emails with EmailEngine"
description = "How to use EmailEngine to send emails with user's SMTP server"
full_description = "EmailEngine simplifies sending emails through registered accounts' SMTP servers or external sending services, making email management easier for applications without storing account credentials. When you send an email using EmailEngine, it first queues the email for delivery. Then, it attempts to transfer the message to the account's SMTP server or the selected sending service. By using EmailEngine, you avoid directly managing the credentials of individual email accounts. Instead, you only need access to EmailEngine and the account ID from which you wish to send the email. For sending a pre-formatted RFC822 email, submit it as a base64-encoded raw property value. If the envelope property is not specified, recipients are derived from the email headers. Once enabled, configure your email sending library to use EmailEngine’s SMTP server. The SMTP username is the account ID, and the password is the SMTP password from the configuration page. Note: EmailEngine’s SMTP server does not support TLS/SSL encryption, so make sure these settings are not configured. EmailEngine provides optional open and click tracking, which rewrites outgoing email HTML to route links through the tracking system. Tracked events generate webhook notifications for opens and clicks. Send emails through external services like SendGrid, Mailgun, or AWS SES by registering a gateway via API. EmailEngine allows you to list and delete emails that have been queued but are not yet transferred to the account's SMTP server. Outbox includes all emails that are scheduled to be delivered in the future, and it also contains emails that should have been sent but for whatever reason are not – for example, the SMTP server is currently not accessible. EmailEngine includes helpers that mimic regular email clients when replying or forwarding emails. Read about it here."
