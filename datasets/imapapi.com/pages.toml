["https://imapapi.com/pre-processing-functions"]
title = "Pre-processing functions"
description = "Filter and modify webhooks and other processes"
full_description = "EmailEngine allows pre-processing of several actions, such as webhooks posted using the Webhook Routing feature and emails stored in ElasticSearch. The pre-processing function is a small JavaScript code snippet that you can provide to EmailEngine, which runs whenever a triggering event occurs. The output from this function determines if the event is processed or discarded. For the filter function to pass, it must return the boolean true value. Any other value or exception will discard the event. For webhooks, a failing filter means that the webhook is not posted, and for Document Store events, it means that the email is not stored in the Document Store. This function allows you to modify the structure of the processed data. You can add or remove properties or completely replace the value. EmailEngine disables most APIs for security reasons when running the pre-processing functions, so in general, only the native JavaScript functions are available. There are some specific Web APIs that are enabled: Pre-processing functions support top-level await and async syntax. This is mostly needed for Fetch calls. EmailEngine allows defining an environment for the pre-processing scripts. This is a JSON object string you can set either from the Service settings page or via the Settings API using the scriptEnv key. Once the environment object value is set, it becomes available for all pre-processing scripts as the env object variable. Once you have the environment object set up, you can use it in the filter and map functions as the env variable. The following filter function only passes if the account ID of the email is listed in the provided array:"
