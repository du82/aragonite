["https://imapapi.com/local-addresses"]
title = "Local addresses"
description = "Using local IP addresses with EmailEngine"
full_description = "If your server has multiple IP addresses/interfaces available, you can configure EmailEngine to use these whenever making an outbound connection to an email server. Using multiple addresses is primarily helpful if you are making many connections and might get rate limited by destination server based on your IP address. This approach allows you to distribute connections between separate IP addresses. If your server has multiple IP addresses/interfaces available, you can configure EmailEngine to use these whenever making an outbound connection to an email server. Using multiple addresses is primarily helpful if you are making many connections and might get rate limited by destination server based on your IP address. This approach allows you to distribute connections between separate IP addresses. EmailEngine can either use the default address, assign a static address for each account or select a random address every time a new connection to an email server is made. EmailEngine provides you with a list of IP addresses it can use. Check all addresses that are valid for your use case. If you happen to remove an address that is used as a static address for some accounts, then no need to worry – EmailEngine will automatically pick another one. In addition to local addresses, you can route all your connections through proxy servers. The email server would see the proxy server's IP address as the client IP. Example HTTP proxy with username and password (if the server is using a standard HTTP or HTTPS port, then you do not have to specify it): On the same network configuration page, as shown above, you can also set up a global proxy. In that case, all connections, both for IMAP and SMTP, would be proxied through this specific proxy server. This is primarily useful when your network is private, and you have to make requests through a dedicated proxy server with a public interface. Another option is to set up account-specific proxies. When creating or updating an account, use the proxy property that takes the proxy URL as its value."
year_published = 2025
