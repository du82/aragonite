full_description = '''if (window && window.ad_utils && window.ad_utils.makeAdSlotsCall) { window.ad_utils.makeAdSlotsCall( true, 'https://www.imdb.com/_json/getads/main?url=https%3A%2F%2Fwww.imdb.com%2Fsearch%2Fname%2F%3Fbirth_monthday%3D02-28&subPageType=name&adLayout=desktop_single_column&targeting=c%3D1&preferredLanguage=en-US', 'inlinebottom,inline20,sis_pixel', {"inlinebottom_refresh":{"767":"300x250","1023":"728x90","1279":"970x250","9999":"970x250"},"inlinebottom":{"767":"300x250","1023":"728x90","1279":"970x250","9999":"970x250"},"inline20":{"767":"320x50","1023":"728x90","1279":"970x250","9999":"970x250"},"inline20_refresh":{"767":"320x50","1023":"728x90","1279":"970x250","9999":"970x250"}}, {"inlinebottom_refresh":{"apsSlotId":"div-gpt-ad-1740793660-5_refresh","apsSlotName":"/22890456344/consumer-main-inlinebottom_refresh"},"inlinebottom":{"apsSlotId":"div-gpt-ad-1740793660-5","apsSlotName":"/22890456344/consumer-main-inlinebottom"},"inline20":{"apsSlotId":"div-gpt-ad-1740793660-0","apsSlotName":"/22890456344/consumer-main-inline20"},"inline20_refresh":{"apsSlotId":"div-gpt-ad-1740793660-0_refresh","apsSlotName":"/22890456344/consumer-main-inline20_refresh"}}); } @media only screen and (min-width : 320px) and (max-width : 767px){ .placeholder_inline20_size { width: 320px; height: 50px; } } @media only screen and (min-width : 768px) and (max-width : 1023px){ .placeholder_inline20_size { width: 728px; height: 90px; } } @media only screen and (min-width : 1024px) and (max-width : 1279px){ .placeholder_inline20_size { width: 970px; height: 250px; } } @media only screen and (min-width : 1280px) and (max-width : 9999px){ .placeholder_inline20_size { width: 970px; height: 250px; } } Advanced searchTITLESNAMESCOLLABORATIONSSee resultsSearch filtersExpand allNameBirth date Enter full date to or just enter yyyy, or yyyy-mm below to BirthdayAwards & recognitionBest Actress-NominatedBest Actor-NominatedBest Actress-WinningBest Actor-WinningBest Supporting Actress-NominatedBest Supporting Actor-NominatedBest Supporting Actress-WinningBest Supporting Actor-WinningBest Director-NominatedBest Director-WinningOscar-NominatedEmmy Award-NominatedGolden Globe-NominatedOscar-WinningEmmy Award-WinningGolden Globe-WinningPage topicsOnly includes names with the selected topicsAward NominationsBiographyBirth DatePlace of birthDeath DatePlace of deathHeight infoQuotesTriviaSearch within topicBiographyPlace of birthPlace of deathQuotesTriviaDeath date to or just enter yyyy, or yyyy-mm below to Gender identityMaleFemaleNon-binaryOtherCreditsAdult namesExcludeInclude1-50 of 1,695Sort byPopularityPopularityA-ZBirth dateDeath date1. Ali LarterActressProducerMusic DepartmentFinal Destination (2000)Born in Cherry Hill, New Jersey, Ali began modeling at age 13, and traveled the world before moving to Los Angeles to study acting. Her first professional acting job was a role on the television series Chicago Sons (1997). She received her breakthrough in the high school football drama Varsity Blues (1999) which included her infamous whipped cream bikini scene. Roles in the horror films House on Haunted Hill (1999) and Final Destination (2000) further transitioned her career as an actress.Acting alongside Colin Farrell, Larter starred in the Western comedy, American Outlaws (2001) which performed poorly at the box office. That year, she also starred as Brooke Taylor Windham in the comedy Legally Blonde (2001) with Reese Witherspoon.Not happy with how things were going, Larter moved to New York in 2002 to reassess her life and career. She reprized her role as Clear Rivers in the sequel Final Destination 2 (2003), for which she received star billing. A year later, she made a cameo appearance as herself on the pilot to the HBO comedy drama Entourage (2004) and starred in Three Way (2004) as Isobel Delano. She had a role in A Lot Like Love (2005) as Gina.Larter moved back to Los Angeles in 2006 where she auditioned for a role in the NBC sci-fi drama Heroes (2006). The pilot premiered on 25 September 2006 to successful ratings and many critics declaring it "the new Lost (2004)". The series ran for a total of 77 episodes over four seasons when it was canceled due to diminishing ratings and high production costs. There has been interest in a mini-series or a movie to wrap up story lines.During her time on Heroes (2006), Larter made several appearances on film. The first was the Bollywood film Marigold (2007), where she received a seven-figure salary. The movie was met with primarily negative reviews. She also starred in Resident Evil: Extinction (2007), part 3 of the popular film franchise based on the Capcom video games. She played Claire Redfield, based on the video game character of the same name. The movie was a box office success, tripling its production budget albeit being a critical flop. Larter also appeared in the caveman comedy Homo Erectus (2007) which was released direct-to-DVD. The film co-starred Hayes MacArthur, an actor whom she was engaged to marry in December 2007.In 2009, Larter starred opposite Beyoncé and Idris Elba in the thriller Obsessed (2009). The film opened at number one at the box office but was met with negative reviews, with some critics comparing it to Fatal Attraction (1987). It was also this year that Larter and MacArthur married in a small ceremony in Maine; among the guests was Larter's close friend, Amy Smart. The couple has two children.She reprized her role as Claire Redfield in Resident Evil: Afterlife (2010) and Resident Evil: The Final Chapter (2016), directed by Paul W.S. Anderson.2. John TurturroActorWriterProducerFading Gigolo (2013)Highly talented, lightly built American actor who always looks unsettled and jumpy has become a favourite of cult/arthouse film aficionados with his compelling performances in a broad range of cinematic vehicles.Turturro was born in Brooklyn, New York, to Italian-American parents, Katherine (Incerella), a jazz singer, and Nicholas Turturro, a construction worker and carpenter, who was born in Giovinazzo. His brother, also named Nicholas Turturro, is an actor, and actress Aida Turturro is his cousin.Turturro has become a regular in the thought provoking films of Spike Lee and the off the wall comedies of Joel Coen & Ethan Coen. His wonderful performances include as the highly agitated "Pino" in Do the Right Thing (1989), as an intellectual playwright in Barton Fink (1991), a pedophile tenpin bowler in The Big Lebowski (1998), a confused boyfriend in Jungle Fever (1991) and as the voice of Harvey the dog in Summer of Sam (1999).Turturro has continued to appeal to audiences despite his unconventional looks and the often annoying onscreen mannerisms of his characters which he used to great effect in films such as his blue collar tale of warring brothers in the construction business, Mac (1992), as the irate, dumped game show contestant, Herbie Stempel, in Robert Redford's dynamic Quiz Show (1994). One of modern American cinema's gems of acting, Turturro remains in strong demand for his high calibre thespian talents.3. Robert Sean LeonardActorSoundtrackDead Poets Society (1989)One actor who has deserved much acknowledgment and fame and has had to do without it on a number of occasions is Robert Sean Leonard, known by most as Dr. James Wilson on House (2004). But his career has spanned a number of classic films, alongside such greats as Daniel Day-Lewis, Christian Bale, Paul Newman, and Denzel Washington.Born Robert Lawrence Leonard in Westland, New Jersey, he attended first Fordham University and then Columbia University. Afterwards he was accepted into the Screen Actor's Guild, changing his middle name to 'Sean'. Leonard's first acting role was My Two Loves (1986) where he was cast in a small role. That same year he was also in The Manhattan Project (1986). The film is a suspense thriller starring John Lithgow and is about a science experiment taken too far.Leonard continued on from these firsts and landed a role in Bluffing It (1987) and then acted in another teen comedy: My Best Friend Is a Vampire (1987). His next role is easily one of his most memorable. He took the second billing in Dead Poets Society (1989) opposite Robin Williams and Ethan Hawke. His character of Neil Perry is a young student whose passion for acting is smothered in fear of his father's wrath and his parents' domination of his life. While Robin Williams earned himself an Oscar nomination, Leonard gave a truly Oscar-worthy performance.The 20-year old actor was well on his way now, and he proceeded to act in another Oscar-nominated film: Mr. & Mrs. Bridge (1990) starring Paul Newman. Leonard resumed the rebellious youth act from "Dead Poets" as he played one of the children caught between their father's conservative ways and their own ideas. Leonard followed up with the not-so successful Married to It (1991). Two years after that Leonard found massive success in three different films.Firstly, he acted in Kenneth Branagh's Much Ado About Nothing (1993). Pulling in 60 million on an 8 million dollar budget, it remains one of the most successful films based off of a play by Shakespeare. Leonard was surrounded by other talents apart in addition to Branagh, such as Brian Blessed, Kate Beckinsale, Denzel Washington, Michael Keaton, and Emma Thompson. Leonard played the character of Claudio and was sadly criticized by several critics for his acting. However others such as Roger Ebert defended the young lead whose character is deceived into thinking his betrothed is unfaithful.In the same year, Leonard took the lead in Swing Kids (1993), which also starred Christian Bale, Frank Whaley, Barbara Hershey and Kenneth Branagh who, rather than upstage Leonard, Bale and Whaley, refused any credit in the film. The film, another success for Leonard, told the story of a group of friends in the Hitler Youth attempting to hold onto something they love-- the Lindy hop. Reviews were mixed, but the film has a faithful following to this day.Also that year Leonard took a smaller role in Martin Scorsese's elaborate and artistic film The Age of Innocence (1993) starring Daniel Day-Lewis, Winona Ryder, and Michelle Pfeiffer. The film is about the aristocrat who must choose between two women and risk scandal. The film earned Ryder an Oscar nomination and a win for Best Costume. Leonard himself played the young son of Danny Archer and plays a crucial role at the end of the film.After these three great films Leonard's career slowed down. Despite acting in three different films in 1996 (the Oliver Stone-produced Killer: A Journal of Murder (1995) starring James Woods, the light-hearted The Boys Next Door (1996), and the romantic I Love You, I Love You Not (1996)) none were as successful as those he made in 1993. Leonard moved onwards to act in (among other things) The Last Days of Disco (1998) and the thriller Ground Control (1998) opposite Kiefer Sutherland, Henry Winkler, and Bruce McGill.Leonard's work changed as the new millennium began. He turned to television as well as continuing film. He acted in the series The Outer Limits (1995) and Wasteland (1999) as well as making movies such as the dramatic film Tape (2001) by Richard Linklater, A Glimpse of Hell (2001) opposite James Caan, and the box office bomb Driven (2001) starring Sylvester Stallone and Burt Reynolds. After a few more films Leonard was cast in the series that gave him much fame.House (2004) is a drama series about a cynical, antisocial, crippled doctor who is almost always correct in his solutions to medical problems. Leonard, the first actor to be cast in the series, plays the character of Dr. Wilson, the only person that House considers a friend. Wilson is a much more humane person than House, which leads to many debates between himself and House, though he is plagued by his own problems. It is the best known face that Leonard has ever portrayed in his career, and hopefully he will take on other fantastic roles and obtain the honors he so richly deserves.4. Sarah BolgerActressSoundtrackIn America (2002)Sarah Lee Bolger (born 28 February 1991) is an Irish actress. She is best known for her roles in the films In America (2002), Stormbreaker, and The Spiderwick Chronicles (2008), as well as her award winning role as Lady Mary Tudor in the TV series The Tudors (2007), and for guest starring as Princess Aurora in Once Upon a Time (2011).5. Bernadette PetersActressSoundtrackThe Jerk (1979)Throughout her illustrious career, Bernadette Peters has dazzled audiences and critics with her performances on stage and television, in concert, and on recordings. She is one of the most critically-acclaimed Broadway performers, having received nominations for seven Tony Awards, winning two, and eight Drama Desk Awards, winning three. Four of the Broadway cast albums on which she has starred have won Grammy Awards. Recently, she has been starring on Broadway as Dolly Gallagher Levi in the hit musical, Hello, Dolly!Bernadette was born Bernadette Lazzara on February 28, 1948 in Queens, New York City, to Marguerite (Maltese) and Peter Lazzara, a bread delivery truck driver. She is of Sicilian descent.Bernadette first performed on the stage as a child and then a teenage actor in the 1960s, and in film and television in the 1970s. She was praised for this early work and for appearances on The Muppet Show (1976), The Carol Burnett Show (1991) and in other television work, and for her roles in films like Silent Movie (1976), The Jerk (1979), Pennies from Heaven (1981) and Annie (1982). In the 1980s, she returned to the theatre, where she became one of the best-known Broadway stars over the next three decades. She also has recorded six solo albums and several singles, as well as many cast albums, and performs regularly in her own solo concert act. Peters is particularly noted for her starring roles in stage musicals, including "Song and Dance", "Sunday in the Park with George", "Into the Woods", "Annie Get Your Gun" and "Gypsy", becoming closely associated with composer Stephen Sondheim.Peters continues to act in films and on television, where she has been nominated for three Emmy Awards and three Golden Globe Awards, winning once. Her career boasts an impressive list of television credits, which includes Amazon Prime's highly popular, Mozart in the Jungle, which won the 2016 Golden Globe for Best TV Comedy or Musical series. She also co-stars in the new CBS All Access series, The Good Fight, a spin-off of the network's popular series, The Good Wife. One of Broadway's most critically acclaimed performers, Peters has won numerous accolades including being the recipient of three Tony Awards, a Golden Globe, three Grammy nominations, three Emmy nominations and has a star on the Hollywood Walk of Fame.Peters' albums include the Grammy nominated I'll Be Your Baby Tonight, Sondheim, Etc.: Bernadette Peters Live at Carnegie Hall, and Bernadette Peters Loves Rodgers & Hammerstein, in addition to numerous Grammy Award winning'''
