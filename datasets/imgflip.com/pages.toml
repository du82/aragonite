["https://imgflip.com/gif-maker"]
title = "GIF Maker - Imgflip"
description = "Easily create animated GIFs online from videos, Youtube, video websites, or images. Simple yet powerful customization options."
full_description = '''Sound Disabled (viewer cannot hear sound) Enabled (viewer must tap sound button) Enabled & Autoplay (viewer will hear sound immediately) Lossy GIF compression None (Lossless optimize only) Medium High Ultra Mega Giga Plaid Wombat Alpaca Noodle You can make high quality animated GIFs online for free, with simple and powerful customization options, much faster than advanced tools like Adobe Photoshop. Features include adding text and images/stickers, choosing fonts, cropping, rotating, resizing, reversing, enabling sound, enabling motion of text and images, drawing/outlining/scribbling, as well as several advanced features. Imgflip supports all modern devices including Windows, Mac, iPhone/iOS, and Android. Yes! Just make sure that you are logged into an Imgflip account, and all GIFs you create will be saved. You can also download your GIF images and store them offline. The Imgflip watermark helps other people see where the GIF was created. We really don't want your GIFs to look bad though, so we made it as small as possible while still being readable, and it will not even show up on tiny GIFs. You can disable the watermark completely with a Pro account, if you really need to have watermark-free images. Facebook will sometimes decide to animate GIFs, and sometimes not. For best chances, make sure the width and height of your GIF are both larger than 200px, since Facebook tends to not animate small GIFs. Sometimes you have to click share, then exit out of the window, and then click share again. Other social media websites may have similar issues, because they can decide to handle GIFs however they want, outside of our control. If your .gif file fails entirely to upload to another website or computer program but it works fine on Imgflip, then the site you're uploading to may not fully support GIFs. You can sometimes fix this by changing the Filesize Optimization to "Basic" instead of "Advanced" in the More Options menu of our GIF Maker. This can increase file size but makes your .gif work with more programs. Shopify in particular has a bug claiming that optimized GIFs are corrupted.'''
