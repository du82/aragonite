title = "This Meme Does Not Exist - Imgflip"
description = "Memes Generated by an Artificial Neural Network"
full_description = '''ChatGPT version now available, with support for more memes than the classic model! While the classic model's random outbursts can make it a hilarious novice AI, GPT will give more "put together" captions. It's highly recommended to use subject text with GPT because the results can be phenomenal (GPT seems to think food-related memes are the funniest otherwise...). GPT generations are free for 10 per month, but require Pro or Pro Basic after that due to the cost of the API. The AI meme generator is also embedded into the main Imgflip Meme Generator, where it supports ALL templates including custom uploads. Just click the "AI" button. Classic model notes: These captions are generated by a deep artificial neural network. Nothing about the text generation is hardcoded, except that the maximum text length is limited for sanity. The model uses character-level prediction, so you can specify prefix text of one or more characters to influence the text generated. Using someone's name or other short text as a prefix works best. The network was trained using public images generated by users of the Imgflip Meme Generator for the top 48 most popular Meme Templates. Beware, no profanity filtering was done on the training data so you may encounter vulgarity. Curious about the technical details of building the network? Check out the accompanying article Meme Text Generation with a Convolutional Network in Keras & Tensorflow.'''
