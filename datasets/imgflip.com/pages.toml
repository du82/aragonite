["https://imgflip.com/api"]
title = "Meme Generator API - Imgflip"
description = """
Gets an array of popular memes that may be captioned with this API.
\t\t\tThe size of this array and the order of memes may change at any time.
\t\t\tWhen this description was written, it returned 100 memes ordered by
\t\t\thow many times they were captioned in the last 30 days. Additional properties
\t\t\tother than those listed below may be added in the future without warning,
\t\t\tso do not assume the JSON structure of each meme will never have new properties."""
full_description = '''The Imgflip API uses a RESTful JSON interface. Request parameters are standard HTTP form urlencoded parameters, and return data is JSON. The base version of the API is free. You can upgrade to our Premium API to unlock advanced features. Requests to the free version of the API do not have a hard limit, but may be throttled or blocked if you start doing crazy things or abusing the API. The Premium API has a base cost of $9.99 per month and includes some Premium requests each month (details below). After that, each type of Premium request has a small per-request cost. Note that the free API endpoints are still free if you have API Premium, you'll only be charged for the Premium-only features. Add a caption to an Imgflip meme template. Images created with this API will be publicly accessible by anyone through the url in the response - there is no "private" option. This does not mean these memes will be posted publicly though, one still needs to know the exact URL to find the image. If the image hangs around on Imgflip servers for a while and gets very few views (direct image views and image page views both count), it will be auto-deleted to save space. For a real working example of the API, check out this hubot script (written in coffeescript). That script is open source, so feel free to use that set of regexes as a starting place. IMPORTANT NOTE: If you plan to use the API for anything other than testing, you should create your own Imgflip account and use that instead of the default imgflip_hubot account, because that account may be limited as soon as you send a non-trivial number of requests, and then your script wouldn't be able to make memes anymore, and everyone would be sad. All memes on Imgflip can have custom default font settings which will be used if you do not specify the exact settings you want. For example, this allows a meme such as Two Buttons to default to uncapitalized black text with rotation applied, because it fits the template better. x, y, width, and height are for the bounding box of the text box. x and y are the coordinates of the top left corner. If you specify bounding coordinates, be sure to specify all four (x, y, width, height), otherwise your text may not show up correctly. If you do not specify bounding box coordinates, the same automatic default coordinates from imgflip.com/memegenerator will be used, which is very useful for memes with special text box positioning other than the simple top/bottom.'''
