["https://imgflip.com/about"]
title = "About Imgflip"
description = "About imgflip.com"
full_description = '''The Imgflip image generators are designed to be insanely fast and provide powerful customization, while still being simple and easy to use. Images created on Imgflip can be made "private" if you just want to download the image and save it for yourself, or they can be saved on imgflip.com where you can share them with friends and track their popularity. If you think your images will be appreciated by other imgflip users, you can submit them to be featured. Imgflip users and/or moderators can then vote on your submitted images, and the best ones will make it to the front page. If you have any suggestions, comments, or if you'd like to report a bug, please use the feedback form. If you want an image removed, please submit a removal request. Imgflip LLC is a bootstrapped company; we have received no venture funding. We are advised by ScOp VC. The Imgflip developers also develop a personal health app.'''
