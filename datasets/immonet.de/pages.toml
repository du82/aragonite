full_description = "Der Standort München ist nicht nur ein Anziehungspunkt für viele Touristen, sondern auch eine wirtschaftliche pulsierende Region. Wer hier arbeitet, möchte oft auch gerne hier wohnen und das am liebsten in den eigenen vier Wänden. Zugegeben: Ganz einfach ist es nicht, ein Haus in München zu kaufen, zumindest dann, wenn man ein wenig auf den Preis achten muss. Der Quadratmeterpreis für ein Haus, zu kaufen in München-Zentrum, liegt bei rund 3000 Euro. Günstig kaufen kann man Immobilien insbesondere vor den Toren der Stadt im näheren Umland. Die Innenstadt ist verhältnismäßig teuer, vor allem für diejenigen, die mit Familie einziehen möchten und demnach viel Platz benötigen. Dass man für das Kaufen eines Hauses in München etwas tiefer in die Tasche greifen muss, liegt vielleicht auch daran, dass man von vielen Wohnlagen schnell im Grünen ist und viele Möglichkeiten hat, seine Freizeit zu gestalten. Ob Wandern, Schwimmen, Ski-Fahren in den Wintermonaten oder nicht zuletzt das reichhaltige kulturelle Angebot: München ist einfach eine ganz besondere Stadt. Im Sommer locken die unzähligen Biergärten und im Winter die Weihnachtsmärkte. Auch für Naturfreunde hat die Stadt mit Parks im Innenbereich oder in der näheren Umgebung sehr viel zu bieten."
