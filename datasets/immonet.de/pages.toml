full_description = "Hamburg ist die Metropole im Norden Deutschlands. Gekrönt von einer sagenhaften Hafengeschichte und als zweitgrößte Stadt Deutschlands bietet sie nicht nur rund 1,8 Millionen Einwohnern ein Zuhause, sondern auch zahlreichen Besuchern immer wieder einen Grund, sich in Hamburg einmal genauer umzuschauen. Wem es darum geht, ein Haus zu kaufen in Hamburg, der wird sich hier in den unterschiedlichsten Stadtteilen wohlfühlen. Harvestehude ist eines der Villenviertel Hamburgs. Hier befinden sich zwei wunderschöne Parks, die das Wohnen in Hamburg noch luxuriöser gestalten nämlich der Innocentiapark und der Bolivar-Park an der Nikolai-Kirche. Der Harvestehuder Isemarkt, einer der schönsten Wochenmärkte Hamburgs, lockt zweimal wöchentlich zahlreiche Einwohner und Besucher Hamburgs an. Zahlreiche attraktive Bauten runden das Bild dieses Stadtteils ab. Aber auch andere Stadtteile der Elbmetrople eignen sich, um ein Haus zu kaufen in Hamburg. Geographisch gesehen, liegt Hamburg genau an der Mündung der Alster sowie der Bille in die Elbe. Lediglich 110 Kilometer weiter nördlich mündet die Elbe dann in die Nordsee. Besonders sehenswert sind die Hamburger Elbbrücken, die das Südufer mit dem Nordufer verbinden. Im Stadtzentrum wurde die Alster zu einem künstlichen See aufgestaut, so entstanden die Außenalster und die Binnenalster. Die Elbbrücken sind nur ein Bruchteil der insgesamt mehr als 2.500 Brücken, die Flüsschen, Fleeten und Kanäle der Stadt überqueren. Mit dieser Zahl übertrifft Hamburg selbst Amsterdam und Venedig in der Zahl der Brücken. Wer würde sich nicht wohlfühlen, wenn es darum geht, ein Haus zu kaufen in Hamburg."
