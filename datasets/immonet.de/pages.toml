title = "Danwood - Preise, Infos & Kataloge"
description = "Danwood gehört zu den führenden Anbietern im Bereich der Fertighäuser und setzt dabei auf maximale Energieeffizienz in nachhaltiger Holzbauweise. Seit der Gründung im Jahr 1995 hat sich das Unternehmen als einer der erfolgreichsten Fertighausanbieter in der DACH-Region etabliert und errichtet jährlich rund 1500 Häuser. Die vielfältige Produktpalette umfasst Bungalows, Stadtvillen, Familienhäuser, Modulhäuser und exklusive Villen.Mit über 120 bezugsfertigen Musterhäusern bietet Danwood seinen Kunden zahlreiche Anpassungsmöglichkeiten, um individuelle Wohnträume zu erfüllen. Nachhaltigkeit steht dabei im Vordergrund: Jedes Haus wird aus Holz gefertigt und entspricht bereits im Standard den hohen Anforderungen eines Effizienzhauses 40. Dies sorgt nicht nur für niedrige Unterhaltskosten, sondern leistet auch einen wertvollen Beitrag zum Umweltschutz. Optional ist auch der Bau eines Effizienzhauses 40Plus oder mit zertifiziertem NH-Siegel möglich.Die Häuser von Danwood sind im Standard mit dreifach verglasten Fenstern, einer Lüftungsanlage mit Wärmerückgewinnung, Fußbodenheizung und Luft-Wasser-Wärmepumpe ausgestattet, was zu geringen Heizkosten führt. Dabei kommen ausschließlich Markenprodukte renommierter Hersteller zum Einsatz.Kunden profitieren bei Danwood von einem herausragenden Preis-Leistungs-Verhältnis, hoher Preis- und Kostentransparenz sowie einer Festpreisgarantie. Versteckte Kosten gibt es nicht – auf diese Zuverlässigkeit können sich Bauherren voll und ganz verlassen."
