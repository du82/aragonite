full_description = "Provence, Bretagne oder Côte d’Azur: Die Deutschen schätzen die Lebensart, die Kulinarik und Kultur sowie die vielfältige Landschaft ihres Nachbarlands Frankreich. Manche so sehr, dass sie dort den Kauf einer Ferienimmobilie in Erwägung ziehen. Als EU-Bürger gibt es für Deutsche keine rechtlichen Hürden bei Immobilienerwerb in Frankreich – sie sind Franzosen gleichgestellt. Ablauf und rechtliche Rahmenbedingungen beim Grunderwerb in Frankreich unterscheiden sich jedoch in vielen Details von den hiesigen Gegebenheiten, weshalb sich Erwerber vorab gut informieren sollten. Wer eine Immobilie in Frankreich sucht, kann dabei – ähnlich wie in Deutschland – verschiedene Quellen verwenden: Immobilienportale im Internet, Anzeigen in Tageszeitungen und Aushänge. Oder man wendet sich an einen Makler beziehungsweise ein Immobilienvermittlungsbüro. Der Maklerberuf (agent immobilier) ist in Frankreich strenger reglementiert als in Deutschland: Zulassung und Ausübung sind nur möglich, wenn der Makler eine langjährige Ausbildung vorweisen kann. Eine Besonderheit: In Frankreich darf auch der Notar Immobilien vermitteln. Bei der Auswahl eines Objektes gilt es, die in Betracht kommende Immobilie sorgfältig auf Mängel zu untersuchen, im Zweifel kann hier auch ein Sachverständiger helfen. Allerdings ist ein Verkäufer in Frankreich verpflichtet, eine Reihe von Gutachten vorzulegen. Welche das sind, hängt zum Beispiel von der Lage und dem Baujahr der Immobilie ab. Das stärkt die die Rechtsposition des Käufers. Zu den relevanten Gutachten gehören zum Beispiel: Eine Besonderheit gibt es für Käufer von älteren Immobilien in südlichen Regionen Frankreichs. Hier ist das Klima so mild und warm, dass Termiten vorkommen können. Ein Problem kann das vor allem bei älteren Fachwerkhäusern sein. In Regionen, in denen diese Problematik relevant ist, muss der Verkäufer ein höchstens sechs Monate altes Termitengutachten vorlegen. Ebenfalls gilt es zu prüfen, ob es sich bei der Immobilie um einen Schwarzbau handelt, indem man sich zum Beispiel die Baugenehmigung vorlegen lässt. Ein illegaler Bau kann üble Folgen haben: Neben hohen Geldstrafen drohen auch Abrissverfügungen."
