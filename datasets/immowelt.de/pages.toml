description = "Möchtest du deinen SCHUFA-BonitätsCheck sofort erhalten? Dann klicke hier! ✔ online bestellen ✔ sofort downloaden"
full_description = "SCHUFA-Auskunft online bestellen Vermieter überzeugen Viele Vermieter fragen ihre Mietinteressenten vor Abschluss des Mietvertrages nach einer SCHUFA-Auskunft, um einen Eindruck von ihrer finanziellen Zuverlässigkeit zu bekommen. Mieter, die eine positive SCHUFA-Selbstauskunft vorlegen können, gewinnen dadurch oft das Vertrauen des Vermieters – und erhöhen so ihre Chancen auf die Wohnung. Speziell für Mieter gibt es bei der SCHUFA den SCHUFA-BonitätsCheck - nicht zu verwechseln mit der SCHUFA-Eigenauskunft. Denn dieses Zertifikat für Mieter enthält ganz spezifisch nur jene Informationen, die für den Abschluss des Mietvertrages relevant sind. So bleibt die Privatsphäre der Mieter geschützt. Über immowelt ist dieses Zertifikat für 29,95 Euro innerhalb weniger Minuten online verfügbar und kann als PDF direkt an den Vermieter weitergeleitet werden. Wenn es bei der Wohnungssuche schnell gehen muss, haben Mietinteressenten so die Nase vorn. Die SCHUFA-Auskunft für Mieter ist innerhalb weniger Minuten online verfügbar. Foto: iStock/gpointstudio Schnell und einfach zur Online SCHUFA-Auskunft So funktionierts: Daten eingeben Bitte gib deine persönlichen Daten, wie Name, Adresse und E-Mail, für die Bestellung ein. Bezahlen Der SCHUFA-BonitätsCheck kostet 29,95 Euro. Wenn du deine IBAN eingibst und bestätigst, zieht die SCHUFA den Betrag per Lastschrift von deinem Konto ein. Die Bestätigung inklusive Rechnung erhältst du direkt im Anschluss per E-Mail. Versandart wählen Willst du das Dokument per Post erhalten oder lieber direkt herunterladen? Für den Download musst du deine Identität mit deiner Personalausweisnummer und IBAN bestätigen. So kannst du die Echtheit deiner SCHUFA-Auskunft beweisen: Das SCHUFA-Zertifikat ist durch Sicherheitsmerkmale wie Hologrammstreifen und SCHUFA-Siegel gleich mehrfach geschützt. Zusammen mit dem Dokument erhältst du außerdem einen Verifizierungscode, mit dem die Echtheit der SCHUFA-Auskunft für Vermieter einfach online überprüfbar ist: unter www.meineSCHUFA.de/check. Das ist innerhalb der ersten 60 Tage ab Ausstellungsdatum möglich. FAQ zur SCHUFA-Auskunft Hier findest du alle Antworten zu häufig gestellten Fragen rund um die SCHUFA-Auskunft Warum fragen viele Vermieter nach einer SCHUFA-Auskunft? Was steht in der SCHUFA-Auskunft für Mieter? Geld zurück – bekommen Mieter die Kosten für die SCHUFA-Auskunft online erstattet? Wie ermittelt die SCHUFA die Bonität der Mieter? Was ist die SCHUFA? Welche Daten darf die SCHUFA speichern? Wann bekommt man einen SCHUFA-Eintrag Wann gibt es einen negativen SCHUFA-Eintrag? Wann werden SCHUFA-Einträge gelöscht? Wer kann Informationen aus meiner SCHUFA-Auskunft abfragen? Noch Fragen zur SCHUFA-Auskunft? Einfach und bequem über Schufa-Auskunft online informieren – in den FAQs gibt es Antworten auf die wichtigsten Fragen. Foto: iStock/gradyreese Warum fragen viele Vermieter nach einer SCHUFA-Auskunft? Viele Vermieter wollen sicher gehen, dass ihr künftiger Mieter auch zuverlässig zahlt. Denn ein Mietausfall stellt für sie ein hohes Risiko dar. Bevor sie ihre Wohnung darum in andere Hände geben, fragen viele nach einer Bonitätsauskunft. Für eine solche Auskunft ermittelt eine Auskunftei wie die SCHUFA die Kreditwürdigkeit des Mieters, also wie wahrscheinlich es ist, dass es zu einem Zahlungsausfall kommt. Fällt die SCHUFA-Selbstauskunft positiv aus, so beweist das die Zuverlässigkeit des Mieters und steigert seine Aussichten auf eine Zusage für die Wohnung. zurück Was steht in der SCHUFA-Auskunft für Mieter? Der SCHUFA-BonitätsCheck ist speziell für Mieter konzipiert. Darin stehen nur die wichtigsten Fakten, die für den Vertragsabschluss mit dem Vermieter relevant sind. So bleibt die eigene Privatsphäre geschützt. Diese wesentlichen Inhalte sind in der SCHUFA-Auskunft für Mieter enthalten: Name, Adresse und Geburtsdatum der Person, die die SCHUFA-Auskunft bestellt hat das Datum der SCHUFA-Auskunft der Hinweis zur Bonität – zum Beispiel die Bestätigung, dass ausschließlich positive Vertragsinformationen vorliegen ein Hinweis, welche Vertragsinformationen der SCHUFA-BonitätsCheck zum Beispiel umfasst, wie Daten zu Girokonten, Kreditkarten, Handyverträgen, Leasing- oder Kreditverträgen sowie zu Internetbestellungen auf Rechnungen Ein Verifizierungscode, mit dem der Vermieter die Echtheit des Zertifikats innerhalb von 60 Tagen ab Ausstellungsdatum online überprüfen kann Wer vertiefende Informationen über die von ihm gespeicherten Daten möchte, bekommt diese bei der SCHUFA online, beispielsweise über meineSCHUFA Pakete. Hierfür ist eine Registrierung auf www.meineSCHUFA.de notwendig. Auf Grundlage des Artikels 15 der EU-Datenschutzgrundverordnung stehen Mieter aber generell Auskunft über die von ihnen gespeicherten, persönlichen Daten zu. Diese können sie auch direkt bei der SCHUFA anfordern. PRAXIS-TIPP Die höchste Glaubwürdigkeit besitzt das Dokument, wenn das Ausstellungsdatum möglichst aktuell ist. zurück Geld zurück – bekommen Mieter die Kosten für die SCHUFA-Auskunft online erstattet? Die Kosten für die SCHUFA-Auskunft online bekommen Mieter in der Regel nicht zurückerstattet. Jedoch kann es je nach Einzelfall möglich sein, die Kosten im Rahmen eines berufsbedingten Umzuges als Werbungskosten bei der Einkommenssteuer abzusetzen. Dafür müsste die SCHUFA-Auskunft nötig gewesen sein, um die Wohnung zu bekommen. Mieter könnten dann die Kosten in der Steuererklärung mit aufnehmen. Aber: In den meisten Fällen ist es einfacher, statt bei der Steuer alle Einzelkosten zurückzufordern eine Umzugspauschale zu wählen, mit der alle Umzugskosten abgegolten werden. Diese beträgt für Singles mehrere hundert Euro. Steuertipps für den Umzug So setzt du deine Umzugskosten von der Steuer ab weiterlesen Wer eine SCHUFA-Auskunft nur für den persönlichen Gebrauch zur Selbstauskunft haben will, kann eine kostenlose Kopie seiner personenbezogenen Daten nach Artikel 15 der Datenschutz-Grundverordnung (DSGVO) bei der SCHUFA anfordern. Diese Datenübersicht wird nur in Papierform bereitgestellt und gibt Auskunft über die gespeicherten persönlichen Daten. Da diese jedoch sensibel sind – zum Beispiel Informationen zu Bank- und Kreditkartendaten – sollte die Datenkopie vertraulich behandelt werden. Wer seine Bonität gegenüber dem Vermieter beweisen will, kann den SCHUFA-BonitätsCheck wählen. LINK-TIPP: Lies hier, wo du als Mieter Steuern sparen kannst zurück Wie ermittelt die SCHUFA die Bonität der Mieter? Die SCHUFA benutzt wie andere Auskunfteien auch das Scoring, um die Bonität der Verbraucher einzuschätzen. Dabei wird aus einer Menge von gesammelten Daten eine Prognose erstellt. Diese soll Auskunft darüber geben, mit welcher Wahrscheinlichkeit es zu einem Zahlungsausfall kommt – oder eben nicht. Ein SCHUFA-Score von über 97,5 Prozent ist zum Beispiel sehr gut und bedeutet ein geringes Risiko, dass es zu Zahlungsausfall kommt. Dieser Score wird aus den Daten ermittelt, die der SCHUFA zur Verfügung stehen. Dazu zählen zum Beispiel Daten von Bankkonten und Kreditkarten, Leasingverträgen, Mobilfunkverträgen, Ratenzahlungsgeschäften, Krediten oder Bürgschaften gespeichert. Es kann aber nicht auf Daten wie Einkommen oder Beruf zurückgegriffen werden. Wer wissen will, welche Informationen genau die SCHUFA über ihn gespeichert hat, kann diese Informationen dort einfordern. zurück Wie Auskunfteien deine Bonität ermitteln So funktionieren die SCHUFA und andere Auskunfteien: weiterlesen Was ist die SCHUFA? Die Abkürzung SCHUFA steht für den Begriff „Schutzgemeinschaft für allgemeine Kreditsicherung“. Sie wurde 1927 gegründet und ist ein Unternehmen, das kreditrelevante Daten über Endverbraucher sammelt und bündelt. Die Idee dahinter ist, dass Unternehmen, die Vertragspartner der SCHUFA sind, ihre Zahlungserfahrungen mit Kunden untereinander austauschen. Dazu gehören Positiv- wie Negativdaten. Also: Ob der Kunde regelmäßig und pünktlich seine Raten zahlt – oder ob es zu Zahlungsausfällen kommt. So können Zahlungsausfälle minimiert werden.Die SCHUFA selbst stellt keine Recherchen zur Datensammlung an, sondern übernimmt Daten, die ihr von Vertragspartnern übermittelt werden. Dazu gehören Kreditinstitute, Bausparkassen, Versicherungsunternehmen, Kauf- und Versandhäuser, Leasingfirmen, Strom- und Telefonkommunikationsanbieter. Die Vertragspartner müssen zahlreiche Anforderungen erfüllen, um etwa dem strengen Datenschutzgesetz zu entsprechen. zurück Welche Daten darf die SCHUFA speichern? Unternehmen, die mit der SCHUFA zusammenarbeiten und Daten an sie weitergeben, dürfen dies aufgrund des Artikels 6 der Datenschutz-Grundverordnung (DSGVO) nur unter bestimmten Voraussetzungen: „Die betroffene Person hat ihre Einwilligung zu der Verarbeitung der sie betreffenden personenbezogenen Daten für einen oder mehrere bestimmte Zwecke gegeben“. Üblicherweise werden zum Beispiel Informationen wie Name, Geburtsdatum, Anschrift, aber auch Leasingverträge, Ratenzahlungsgeschäfte oder Mobilfunkkonten gespeichert. zurück Welche Daten sammelt die SCHUFA In ihrer Datensammlung darf die Schufa nur bestimmte Informationen speichern. weiterlesen Wann bekommt man einen SCHUFA-Eintrag In der Regel dürfen Unternehmen Daten an die SCHUFA melden und eine Auskunft anfordern, wenn sie ihren Kunden Kredite geben. Darin mit inbegriffen ist auch die Lieferung von Waren oder Dienstleistungen, die erst zu einem späteren Zeitpunkt vom Kunden bezahlt werden – etwa beim Möbelkauf auf Raten. zurück Wann gibt es einen negativen SCHUFA-Eintrag? Vorsicht: Wer ein schlechter Zahler ist, wird in der Schufa-Auskunft abgestraft. Foto: iStock/Vladimir Vladimirov Einen negativen SCHUFA-Eintrag bekommen Verbraucher erst, wenn sie sich als schlechter Zahler herausstellen. Ein von der Bank gekündigter Kredit, Zahlungsausfälle oder Informationen aus den öffentlichen Schuldnerverzeichnissen gelten als Hinweise für nicht vertragsgemäßes Verhalten. Bei versäumten Zahlungen darf aber nicht gleich ein negativer Eintrag erfolgen. Erst muss der Verbraucher zweimal angemahnt werden, die offene Forderung zu begleichen. Zudem muss er vier Wochen vor dem SCHUFA-Eintrag darauf hingewiesen werden, dass es zu einem SCHUFA-Eintrag kommt, wenn er nicht zahlt. zurück Wann werden SCHUFA-Einträge gelöscht? Informationen bei der SCHUFA werden nach bestimmten Voraussetzungen gelöscht. So lange dauert es: Girokonto- und Kreditkarteninformationen: nach Kontoauflösung Kreditinformationen: 3 Jahre ab dem Jahr der Rückzahlung Versandhandelskonten: 3 Jahre nach Eingang, beziehungsweise ab Mitteilung über Auflösung Daten aus nicht vertragsgemäß abgelaufenen Geschäften: 3 Jahre nach der Begleichung Daten aus den Schuldnerverzeichnissen der Amtsgerichte: 3 Jahre danach. Oder früher, wenn die Löschung beim Amtsgericht der SCHUFA vor der Frist von drei Jahren gemeldet wird. PRAXIS-TIPP Nicht immer sind die Daten aktuell – etwa wie beim Schuldnerverzeichnis der Amtsgerichte. Wer diese Information aktualisieren will, kann sie der SCHUFA mitteilen und entsprechend korrigieren lassen. zurück Wer kann Informationen aus meiner SCHUFA-Auskunft abfragen? Abfragen beantragen dürfen Unternehmen, die Leistungen oder Lieferungen gegen einen Kredit gewähren oder solche, die ansonsten ein wirtschaftliches Risiko tragen. Dazu können zum Beispiel auch Telekommunikationsunternehmen zählen. Voraussetzung dafür ist allerdings eine Vertragspartnerschaft mit der SCHUFA. zurück Noch Fragen zur SCHUFA-Auskunft? Wenn du weitere Fragen zur SCHUFA-Auskunft hast, kann dir das Service-Team der SCHUFA weiterhelfen. Du erreichst es unter der Service-Hotline: 0611-92780 (Montag bis Freitag von 8:00 bis 19:00 Uhr). Bitte beachte, dass die Mitarbeiter über sensible Daten keine telefonische Auskunft geben können. Bei spezifischen Fragen zum Inhalt der SCHUFA-Selbstauskunft wendest du dich daher am besten schriftlich an die SCHUFA. Die Adresse lautet: SCHUFA Holding AG, Postfach 10 34 41, 50474 Köln."
