full_description = 'Wir als datenschutzrechtlich Verantwortliche informieren Sie mit dieser Erklärung über die Verarbeitung Ihrer personenbezogenen Daten auf unseren Webseiten sowie über Ihre Rechte als Nutzer. Wir nehmen den Schutz Ihrer Daten ernst und halten uns an alle in der Bundesrepublik Deutschland geltenden datenschutzrechtlichen Bestimmungen bzw. Gesetze. Dabei erheben, verarbeiten und nutzen wir Ihre personenbezogenen Daten grundsätzlich nur dann, wenn Sie hierzu Ihre Einwilligung gegeben haben oder dies gesetzlich erlaubt ist. Diese Stelle ist Anbieter von Telemedien im Sinne des Telekommunikation-Digitale-Dienste-Datenschutz-Gesetz (TDDDG) und Verantwortlicher im Sinne der Datenschutz-Grundverordnung (DSGVO). Diese Stelle ist auch gemeint, wenn Formulierungen wie "wir" oder "uns" benutzt werden. Herting Oberbeck Datenschutz GmbH RA David Oberbeck Hallerstr. 76, 20146 Hamburghttps://www.datenschutzkanzlei.de E-Mail: datenschutz@immowelt.de Personenbezogene Daten sind alle Informationen, die sich auf eine identifizierte oder identifizierbare natürliche Person beziehen (betroffene Person). Mit personenbezogenen Daten kann eine betroffene Person identifiziert werden. Hierzu zählt beispielsweise der Name, die Anschrift, die E-Mail-Adresse, die Telefonnummer oder eine Ihnen von Ihrem Internetprovider zugewiesene IP-Adresse. Keine personenbezogenen Daten sind solche Informationen, mit deren Hilfe Sie nicht identifizierbar sind (anonyme Daten). AVIV Germany will dauerhaft der zuverlässige Berater für alle Themen rund um Ihr Zuhause sein. Wenn sich Ihre Lebenssituation ändert oder Sie neue Ziele anstreben, hält immowelt das richtige Wohn- und Immobilienangebot für Sie bereit. Wir sind bestrebt, eine langfristige Beziehung mit Ihnen aufzubauen: Unsere Produkte und Services stehen Ihnen 7 Tage die Woche, 24 Stunden am Tag zur Verfügung. Mit uns können Sie Ihre Wohnsituation, Ihren Lebensmittelpunkt und Ihre Zukunft gestalten. AVIV Germany hat es sich zum Ziel gemacht, Suchende und Anbieter von Immobilien zusammenzubringen. Sie haben bei uns u.a. die Möglichkeit, sich über Immobilienangebote zu informieren, Immobilienanbieter zu kontaktieren, Ihren Umzug vorzubereiten und sich über Aktuelles aus der Immobilienwelt zu informieren.'
