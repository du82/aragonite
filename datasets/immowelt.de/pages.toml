full_description = "AchtungVorsicht vor Unterverbriefung: Um Steuern zu sparen, wollen Verkäufer oftmals in Übertragungsurkunde nicht den echten Verkaufspreis vermerken, sondern einen behördlich festgelegten Steuerwert. Käufer sollten sich keinesfalls darauf einlassen, denn handelt es sich hier um eine strafbare Steuerhinterziehung. Bulgarien hat einiges zu bieten: Im Ost-Westen das Balkangebirge, im Osten das Schwarze Meer. Dazwischen befinden sich Partymeilen, idyllische Dörfer, Kunst, Kultur, Tradition und Natur. Für viele Touristen ist das der Grund, jedes Jahr wieder zu kommen. Wer nicht immer im Hotel wohnen möchte, sondern seinen Urlaub im eigenen Ferienhaus verbringen möchte oder vorhat, seinen Wohnsitz ganz nach Bulgarien zu verlegen, hat zwar als EU-Bürger keine großen Hürden zu überwinden, sollte aber dennoch auf einige Dinge verstärkt achten. Eine Wohnung mit Meerblick, ein kleines Häuschen am Fuße des Gebirges – wer sich für eine Immobilie in Bulgarien interessiert, hat eine vielfältige Auswahl, auch hinsichtlich des Preissegments. Mag ein Angebot auch noch so verlockend sein, so sollten dem Immobilienkauf wichtige Schritte wie die Prüfung aller wesentlichen Dokumente vorausgehen. Generell können EU-Bürger ohne Beschränkungen eine Immobilie in Bulgarien erwerben. Wer sich also für eine Immobilie in Bulgarien interessiert, könnte letztlich direkt loslegen. Allerdings sollten sich Käufer neben ihren finanziellen Möglichkeiten über einige Dinge klar sein – beispielsweise darüber, wo sich die Immobilie befinden soll. Denn je nach Lage unterscheiden sich die Preise sehr stark: „Grundsätzlich sind die Preise in Sofia und an der Küste beispielsweise am Sonnenstrand hoch, während sie im Inland vergleichsweise niedrig sind“, erklärt Irina Konstantinova, Rechtsanwältin und Partnerin der Anwaltskanzlei Ruskov & Kollegen. Hinzu kommen weitere Kriterien wie Infrastruktur, Größe der Immobilie und die Frage, ob diese als Wohnsitz oder Mietobjekt genutzt werden soll. S