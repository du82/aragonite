full_description = "AchtungDer Kaufpreis muss in komplett nachweisbarer Form gezahlt werden. Das bedeutet, es darf, um nicht gegen das italienische Geldwäschegesetz zu verstoßen, kein Betrag über 5.000 Euro bar gezahlt werden. Das gilt bereits für die Anzahlung, die ebenfalls nur per Scheck oder Überweisung erfolgen darf. AchtungIn einigen Regionen Italiens stehen sehr viele renovierungsbedürftige Objekte zum Verkauf. Als Faustregel gilt dabei, etwa 100 Prozent des Kaufpreises sind zusätzlich für die Arbeiten an der Immobilie einzuplanen. So wird aus dem vermeintlichen Schnäppchen schnell eine enorme finanzielle Belastung. InfoEs gibt die Möglichkeit, sich beim Abschluss des Vorvertrages beziehungsweise des Kaufvertrages vertreten zu lassen. Dafür wird eine schriftliche, italienische Vollmacht benötigt. Die Unterschrift des eigentlichen Käufers muss auf dieser Vollmacht jedoch nachgewiesen werden. Dies geschieht in der Regel durch einen deutschen Notar. Eine andere Möglichkeit wäre, die Unterschrift in einem italienischen Konsulat in Deutschland vorzunehmen. Der Vorteil dabei ist, dass die Beglaubigung gleich auf Italienisch verfasst wird und nicht noch kostenpflichtig übersetzt werden müsste. AchtungIn Italien muss grundsätzlich jede Art von Vertrag aus fiskalischen Gründen in einem Registerbüro („Ufficio del registro“) registriert werden. Die Registrierung hat zur Folge, dass eine einmalige Steuer fällig wird – entweder als fester Steuer oder aber prozentual, bezogen auf den Wert des Vertrages. InfoBis vor einigen Jahren war die sogenannte Unterverbriefung in italienischen Kaufverträgen keine Seltenheit. Bei einer Unterverbriefung wird im Kaufvertrag ein geringerer Kaufpreis angegeben, als tatsächlich gezahlt wird, um damit die Steuerlast zu senken. Dem schob die italienische Regierung 2005 mit der Einführung des Gesetzes Nr. 266 einen Riegel vor. Seit Inkrafttreten 2006 ist für die Besteuerung des Immobilienerwerbs lediglich der Katasterwert und nicht der tatsächliche Kaufpreis maßgebend. Dennoch wollen einige Verkäufer eine Unterverbriefung, um hohen Zahlungen wegen der Spekulations- beziehungsweise Wertzuwachssteuer zu entgehen. Kommt der Fiskus allerdings dahinter, drohen sowohl Verkäufer als auch Käufer saftige Steuernachzahlungen – einschließlich Zinsen und Bußgeld."
