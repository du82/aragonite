full_description = "Ein Hostel in der Stadt, eine urige Szenekneipe oder doch lieber das gehobene Restaurant – wer sich im Hotel- und Gastgewerbe selbständig machen will, hat viele Möglichkeiten. Der Erfolg einer Geschäftsidee hängt von einem guten Konzept, aber auch der Standortwahl ab. So finden Unternehmer die passende Immobilie, um ihre Gäste glücklich zu machen. Unternehmer im Hotel- und Gastgewerbe müssen sich täglich neuen Herausforderungen stellen – mal gibt es einen Lieferengpass, dann vermiest eine Schlechtwetterfront die Hauptsaison. Wer sich im Hotel- und Gastgewerbe selbständig machen will, braucht darum neben einer ausgeklügelten Geschäftsidee vor allem: das nötige Know-How, die passende Immobilie und eine Genehmigung. Denn wer sein eigenes Hostel oder Café eröffnen will, muss sein Gewerbe zunächst eintragen lassen. Sollen die künftigen Gäste auch mit Schnaps und Bier bewirtet werden, braucht der künftige Gastronom zudem eine Gaststättenkonzession. Für den Kauf einer Gastronomie- oder Hotel-Immobilie braucht es einen gut ausgearbeiteten Geschäftsplan. Unternehmer sollten sich darum vorher genau Gedanken machen zu: Zielgruppe: Welche Personen möchte ich mit meinem Angebot ansprechen? Lassen sie sich zum Beispiel einer bestimmten Altersgruppe zuordnen? Welche besonderen Wünsche haben sie und wie kann ich sie erfüllen? Preissegment: Billiges Essen in hohen Margen kann sich lohnen – hochqualitative Ware in kleinen Mengen aber auch. Gleiches gilt für Unterkünfte. Wer sich hier aber einmal etabliert hat, kann oft nur noch schwer vom einen auf das andere Segment umschwenken. Es gibt viele verschiedene Betriebsarten im Gastgewerbe – manche sind nur für die Unterkunft, andere nur für Essen und Trinken, wiederum andere für beides. Ein kleiner Überblick: Die Zielgruppen von Jugendherbergen und Hostels sind vorrangig Jugendliche und junge Erwachsene, die Kosten für Übernachtungen liegen meist im unteren Preissegment. Während Jugendherbergen eher auf Gruppen ausgelegt ist, sind Hostels insbesondere für Individualreisende interessant."
