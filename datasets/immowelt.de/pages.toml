["https://www.immowelt.de/anbieten/nachmieter"]
title = "Nachmieter suchen: Schneller raus aus dem Mietvertrag"
description = "Wer einen Nachmieter sucht, muss wichtige Fristen, Vertragsklauseln und Details beachten. Wir sagen dir was du über die Nachmietersuche wissen musst."
full_description = "Neuer Job in neuer Stadt oder geräumigere Wohnung: Oft wollen Mieter schnell raus aus dem Mietvertrag. Doch vorher muss der Vermieter zustimmen. Mit unserer Nachmietersuche und dem Musterschreiben für die Wohnungskündigung zum Download steigen die Chancen. Übersicht Wann soll ich einen Nachmieter suchen? 3 Nachmieter suchen und dann ausziehen: Ein weit verbreiteter Irrtum Wann der Mieter einen Nachmieter stellen kann Einigung mit Vermieter als einzige Möglichkeit für viele Mieter Wann soll ich einen Nachmieter suchen? Wer vorzeitig aus seiner Wohnung ausziehen will, sieht sich häufig mit einem großen Problem konfrontiert: der Kündigungsfrist des Mietvertrags. Sie beträgt meist für den Mieter 3 Monate, kann in einzelnen Fällen aber auch bedeutend länger sein. Sucht sich der aktuelle Mieter einen Ersatzmieter, führt das nicht unbedingt dazu, dass er vorzeitig aus dem Mietverhältnis entlassen wird. 3 Nachmieter suchen und dann ausziehen: Ein weit verbreiteter Irrtum Wer dem Vermieter 3 potenzielle Nachmieter benennt, kommt aus seinem Mietvertrag ohne Kündigungsfrist heraus? „Diese Behauptung ist weit verbreitet, aber falsch“, erklärt Hans Jörg Depel, Geschäftsführer vom Mieterverein Köln. Anfang der 70er-Jahre habe einmal ein Gericht eine derartige Entscheidung zugunsten des Mieters getroffen, aber diese Rechtsprechung hat sich nicht durchgesetzt. Seitdem geistere in vielen Mieterköpfen diese angebliche Regelung herum. „Fakt ist, dass der Vermieter in aller Regel nicht verpflichtet ist, dem Mieter entgegenzukommen und einen Nachmieter zur Abkürzung der Kündigungsfrist zu akzeptieren“, sagt Hans Jörg Depel. Sollten Mieter und Vermieter sich nicht über einen Nachmieter einigen und es keine einvernehmliche Regelung geben, habe der Mieter auch keine Chance, die drei Monate Kündigungsfrist zu umgehen oder zu verkürzen. Hans Jörg Depel ist Geschäftsführer des Mietervereins Köln und Experte für Mietrecht. Foto: Hans Jörg Depel Jetzt kostenloses Kündigungsschreiben herunterladen Wann der Mieter einen Nachmieter stellen kann Es gibt jedoch Sonderfälle, bei denen der Mieter einen Nachmieter suchen und so früher ausziehen kann. Dazu muss der Mietvertrag allerdings bestimmte Klauseln enthalten. Nachmieter gesucht? Finde einen Nachmieter und ziehe schneller aus deiner Wohnung aus. So sparst du dir auch doppelte Mietzahlungen. Jetzt Nachmieter finden → Zeitmietvertrag oder Vertrag mit Kündigungsausschluss Bei einem längerfristigen Vertrag – beispielsweise einem qualifizierten Zeitmietvertrag oder einem Vertrag mit Kündigungsausschluss – kann der Mieter gemäß § 242 BGB nur in seltenen Ausnahmefällen vorzeitig eine Wohnungskündigung aussprechen. Dazu muss er gemäß dem Grundsatz von Treu und Glauben ein berechtigtes Interesse an der vorzeitigen Vertragsaufhebung haben – und anschließend einen geeigneten Nachmieter suchen. Auch der Bundesgerichtshof urteilte in der Vergangenheit, dass die Suche nach einem Mietnachfolger in diesem Fall reine Mietersache sei (Az. VIII ZR 247/14). „Ohne Nachmieter gibt es keine vorzeitige Kündigung. Einzig bei Tod des Mieters können die Erben die Wohnung innerhalb der gesetzlichen Kündigungsfrist kündigen“, informiert Hans Jörg Depel. Ein berechtigtes Interesse kann vorliegen, wenn: der Mieter aus beruflichen Gründen in eine andere weit entfernte Stadt ziehen muss. der Mieter aus familiären Gründen eine größere Wohnung benötigt. Das ist dann der Fall, wenn sich Familiennachwuchs ankündigt, gilt aber auch wenn der Ehepartner stirbt und der Hinterbliebene die Miete nicht bezahlen kann oder die Wohnung für einen Einzelnen zu groß ist. der Mieter in ein Altenheim, eine altersgerechte Wohnung oder ein Pflegeheim zieht. ein ähnlich schwerwiegender Grund vorliegt, die ein Festhalten am Mietvertrag unzumutbar machen. Das können beispielsweise schwere gesundheitliche Probleme des Mieters oder eines Mitbewohners sein. Kein berechtigtes Interesse ist es hingegen, wenn der Mieter eine günstigere Wohnung beziehen will oder in ein Haus einziehen will, das ihm gehört. Wenn der Mieter berechtigtes Interesse nachweisen kann, sind mehrere Punkte wichtig. „Der Nachmieter muss den bestehenden Vertrag ohne Einschränkungen akzeptieren“, sagt Hans Jörg Depel. Außerdem müsse er in der Lage sein, die Miete zu bezahlen – „der Vermieter kann darauf bestehen, dass der Nachfolger in etwa das gleiche Einkommen hat wie der Vorgänger“, erklärt Depel. Nachmieterklausel im Mietvertrag Auch durch eine spezielle Nachmieterklausel kommen Mieter früher aus dem Mietvertrag raus. Die Bedingung ist hier ebenso ein geeigneter Nachmieter. Die sogenannte Nachmieterklausel sei jedoch sehr selten zu finden, sagt Hans Jörg Depel. „Mir sind in meinen mehr als 40 Jahren beim Mieterverein Köln vielleicht drei oder vier solche Klauseln untergekommen.“ Tipp: Ist der Vermieter wegen dem berechtigten Interesse des Mieters dazu verpflichtet, einen geeigneten Nachmieter zu akzeptieren, kann er diesen nicht einfach ablehnen. „Falls er das dennoch tut, muss der Mieter von dem Tag an keine Miete mehr zahlen, zu dem ein Nachmieter die Wohnung angemietet hätte“, sagt Depel. Das gelte analog für Verträge mit Nachmieterklauseln. Einigung mit Vermieter als einzige Möglichkeit für viele Mieter Meistens hat der Mieter jedoch kein Recht darauf, aus dem Mietvertrag entlassen zu werden. Möglich ist es manchmal trotzdem. „Gerade in Gebieten mit angespanntem Wohnungsmarkt lassen Vermieter mit sich reden. So können sie früher eine höhere Miete verlangen“, sagt Hans Jörg Depel. Auch wenn der Mieter rechtlich keine Möglichkeit auf Verkürzung der Mietzeit hat, sollte er also in jedem Fall den Vermieter fragen und versuchen, ihn von seinem Anliegen zu überzeugen. Beispielsweise kann der Mieter anbieten, Suchanzeigen auf eigene Kosten zu schalten und Besichtigungen zu organisieren. Das spart dem Vermieter zeitlichen und finanziellen Aufwand. Tipps zur Nachmietersuche Wer einen Nachmieter sucht, sollte bestimmte Dinge beachten. Vor allem, wenn die Vereinbarung nicht auf einer vertraglichen Regelung beruht, sollte der Mieter den Vermieter stark mit einbinden, in diesem Fall ist Letzterer nämlich nicht verpflichtet, irgendeinen gesuchten Nachmieter zu akzeptieren. Die mit dem Vermieter getroffene Einigung sollte schriftlich festgehalten werden. Mieter sollten einen Nachfolger für sich suchen, der ihnen vom Typ her ähnlich ist. Ein Alleinstehender sollte also keine fünfköpfige Familie als Nachmieter vorschlagen. Interessenten sollten die Bedingungen des Vermieters erfüllen. Um einen geeigneten Nachfolger zu finden, können Mieter auch die Suchanzeigen durchsuchen. Das Mietangebot sollten Mieter zunächst auf den eigenen Namen anfertigen, denn du selbst suchst den Nachmieter, nicht der Vermieter. Auf immowelt können Sie ganz einfach selbst eine Immobilienanzeige veröffentlichen. Wichtig bei der Nachmietersuche ist eine enge Kooperation mit dem Vermieter. Ihm können Mieter beispielsweise auch anbieten, bei der Wohnungsbesichtigung von Interessenten dabei zu sein. So kann auch er sich ein persönliches Bild von den potentiellen Nachmietern machen. Immobilienanzeige aufgeben Finde erfolgreich Mieter oder Käufer für deine Immobilie über immowelt. Objekt- und Mietverwaltung in der Cloud. Sicher und DSGVO-konform. Überzeuge Dich vom Testsieger – Jetzt 45 Tage kostenlos testen. Jetzt Anzeige aufgeben →"
