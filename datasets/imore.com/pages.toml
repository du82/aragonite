nd: #9306F9; color: #ffffff','Externals script failed to load', err)); Master your iPhone in minutesiMore offers spot-on advice and guidance from our team of experts, with decades of Apple device experience to lean on. Learn more with iMore!Contact me with news and offers from other Future brandsReceive email from us on behalf of our trusted partners or sponsorsBy submitting your information you agree to the Terms & Conditions and Privacy Policy and are aged 16 or over.By signing up you agree to our Privacy Policy and Terms & Conditions. Gerald LynchSocial Links NavigationEditor in ChiefGerald Lynch is the Editor-in-Chief of iMore, keeping careful watch over the site's editorial output and commercial campaigns, ensuring iMore delivers the in-depth, accurate and timely Apple content its readership deservedly expects. You'll never see him without his iPad Pro, and he loves gaming sessions with his buddies via Apple Arcade on his iPhone 15 Pro, but don't expect him to play with you at home unless your Apple TV is hooked up to a 4K HDR screen and a 7.1 surround system. Living in London in the UK, Gerald was previously Editor of Gizmodo UK, and Executive Editor of TechRadar, and has covered international trade shows including Apple's WWDC, MWC, CES and IFA. If it has an acronym and an app, he's probably been there, on the front lines reporting on the latest tech innovations. Gerald is also a contributing tech pundit for BBC Radio and has written for various other publications, including T3 magazine, GamesRadar, Space.com, Real Homes, MacFormat, music bible DIY, Tech Digest, TopTenReviews, Mirror.co.uk, Brandish, Kotaku, Shiny Shiny and Lifehacker. Gerald is also the author of 'Get Technology: Upgrade Your Future', published by Aurum Press, and also holds a Guinness world record on Tetris. For real. More about apple Apple loses $14bn Irish tax case against the EU How to re-watch Apple's iPhone 16, Apple Watch Series 10, and AirPods 4 event Latest One more thing… Goodbye f