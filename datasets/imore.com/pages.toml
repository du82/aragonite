full_description = "Smart Home Homekit Best HomeKit cameras 2025 Buying Guides By Tammy RogersContributions from John-Anthony Disotto, James Bentley last updated 11 July 2024 Keep your home safe and secure. When you purchase through links on our site, we may earn an affiliate commission. Here’s how it works. window.vanilla.infiniteArticlesData = []; Jump to: Quick List Best Overall Best for outdoors Best for indoors Best as a hub Best doorbell Best wireless Best value Easiest setup Best high-end Q&A Quick Links(Image credit: Logitech)1. Quick List 2. Best overall 3. Best for outdoors 4. Best for indoors 5. Best as a hub 6. Best doorbell 7. Best wireless 8. Best value 9. Easiest setup 10. Best high-end 11. Q&A If you're looking for an easy way to look over your property and secure a little peace of mind, the best HomeKit cameras are a great investment. Being able to use them both indoor and out, and connect to your iPhone or iPad when you're away, you can check up on your house and make sure nothing goes wrong as you pop off for a trip or for your holidays. The reason you may want to commit to something that specifically works with Apple HomeKit is you can create your own automation, with lights turning on at certain times to get a better view. We've managed to test out and review tons of HomeKit cameras, and we have whittled it down to just a few of our favorites. Here are the best HomeKit cameras right now.Tammy RogersStaff WriterHomeKit fanatic As the resident HomeKit obsessive, I've got in a prime place to recommend what HomeKit gadgets you should slip into your home. In this case, I've trawled our extensive review library to see what HomeKit cameras I'd recommend you add to your setup so that you can keep your home safe.1. Quick List Best overall 1. Logitech Circle View View at AppleView at antonlineView at Amazon Indoors and out Logitech's Circle View camera is our top pick because it's one of the only HomeKit-enabled wired options available for indoors and out. In our hands-on review, we enjoyed Circle View's crisp, high-quality 1080p video and how it featured instant notifications and HomeKit Secure Video. Read More Best for outdoors 2. Eve Outdoor Cam View at AmazonView at Best BuyView at Newegg Best for outdoors As the name suggests, the Eve Outdoor Cam is made for the outdoors, using the wiring in your existing light fixtures for power. Don't worry about losing an outdoor light, though, since it also features a powerful LED floodlight that provides color night vision. Read more Best for indoors 3. eufy Security Solo IndoorCam P24 View at NeweggView at eufyCheck Amazon Best for indoors The eufy Indoor Cam Pan 2K features an integrated motor that provides the perfect indoor view. We especially liked its unique follow feature that allows the camera to track a person and — as noted in our review — how it rotates the lens inward when the camera shuts off for privacy. Read More Best as a hub 4. Aqara 2K Security Indoor Camera Hub G3 View at AmazonView at AmazonView at Amazon Best as a hub Aqara's Camera Hub G3 is not just a high-quality HomeKit Secure Video-enabled camera with 2K imagery but also a hub for other Aqara accessories with an integrated Zigbee 3.0 radio. Aqara's camera also has an onboard siren, motorized pan-and-tilt controls, IR blasting capabilities, and more. Read More Best doorbell 5. Logitech Circle View Doorbell View at AppleView at antonlineView at Amazon Best doorbell In our review, we proclaimed that the Logitech Circle View Doorbell is the doorbell for HomeKit and Apple fans — which is still the case today. Logitech's doorbell protects your precious packages with a unique 160-degree field of view that provides a taller, head-to-toe image of your porch. Read More Best wireless 6. eufyCam 2C View at soundcoreView at AmazonView at Walmart Best wireless The eufyCam 2C is a subscription-free, all-wireless camera with six-month battery life and an IP67 weather-resistance rating. This camera supports 1080p HD video resolution with night vision and includes a built-in floodlight for extra security. Read More Load more ↓ Best value 7. eufy Security Solo IndoorCam C24 View at WalmartView at AmazonView at Newegg Best value If you want the most bang for your HomeKit buck, go with the eufy Security 2K Indoor Cam. This camera offers excellent, high-definition 2K visuals at an incredibly affordable price. Don't let the low price fool you, though, as we found in our review that this camera includes all the bells and whistles. Read More Easiest setup 8. Eve Cam View at Amazon Easiest setup While testing the Eve Cam, we appreciated how it worked exclusively with Apple's HomeKit Secure Video and the Home app. Working directly with Apple's Home platform means you don't have to worry about downloading another app or going through a painful registration process. Read More Best high-end 9. ecobee SmartCamera View at NeweggView at AmazonView at Dell Best high-end The ecobee SmartCamera integrates with the company's line of popular smart thermostats as well as the ecobee Haven home monitoring service, giving you whole-home coverage 24/7 through motion and occupancy sensing. We loved its many features in our review. Read More Back to the top ^Best Overall(Image credit: Logitech)1. Logitech Circle View Best OverallOur expert review: Average Amazon review:☆☆☆☆☆SpecificationsWireless protocol: 2.4GHzFOV: 180 degreesNight Vision: YesSpeaker: MonoVideo resolution: 1080pToday's Best DealsView at AppleView at antonlineView at AmazonReasons to buy+Weather resistant+Great image quality+No app or account neededReasons to avoid-Expensive-Lacks motion zones and advanced settings-Slightly odd design choicesThe Logitech Circle View is a super solid little camera with a host of great features. You can hook it up outside, inside, or wherever you might need to monitor, and it's support for HomeKit secure video means that it you'll be able to store all your video within the Apple Home app, crucially without an extra 3rd party app from Logitech.It's small and compact, blending in around any house or into any interior decoration. In our review, we loved the weather resistance and the incredible image quality, as well as the responsiveness of the camera.It's not cheap, however – but if you want top quality, then as always you're going to have to pay a little to get it. It would be nice as well to have motion zones and some more advanced settings on board, but as it stands this is a very solid security contender for your HomeKit setup.Best for outdoors(Image credit: Eve)2. Eve Outdoor camBest for outdoorsSpecificationsWireless protocol: 2.4GHzFOV: 157 degreesNight Vision: YesSpeaker: MonoVideo resolution: 1080pToday's Best DealsView at AmazonView at Best BuyView at NeweggReasons to buy+Weatherproof case+10-day recording history+HomeKit compatibleReasons to avoid-Needs existing light fixtureIf you want a camera that you can stick outside, then the EVE outdoor cam is an excellent option. It's not cheap, but its very sturdy, and it's built in light is great for illuminating porches or gardens so that you can see what's going on. There's also night vision on board as well, so that you don't need to switch the light on in the dark – great if you want to see what kind of wildlife finds its way into your garden.This isn't one that we've reviewed, but reviews around the web love it's features – they're not a fan however of how the camera fits. It needs to be placed on existing light fixtures, making placement a little harder than it perhaps should be. If your lights outside are fitted correctly, however, you'll be golden.Best for indoors(Image credit: Christopher Close)3. eufy Security Solo IndoorCam P24 Best for outdoorsOur expert review: SpecificationsWireless protocol: 2.4GHzFOV: 360 degrees pan & tiltNight Vision: YesSpeaker: MonoVideo resolution: 2KToday's Best DealsView at AmazonReasons to buy+Affordable price+Pan and tilt controls+Image and night vision qualityReasons to avoid-2.4ghz Wi-Fi only-Upright wall mount not included-HomeKit not available at launchPerfect for use indoors, the eufy Indoor Cam Pan 2K is a great little security camera that you can place around the house. It's super affordable, and its pan and tilt controls make controlling the camera an absolute doddle. The image quality is also top-notch, and we particularly like the fun, almost cartoon-esque look of the little camera. There are a couple of things we're less fans of. It would be great if the camera could be mounted on a wall, sideways, but you can only mount it in an upright position. There's only one version of WiFi on board as well, the now relatively out-of-date 2.4Ghz version. On launch, HomeKit wasn't available, but subsequent updates have made the standard available.Best as a hub(Image credit: Aqara)4. aqara 2k security indoor camera hub g3Best as a hubAverage Amazon review:☆☆☆☆☆SpecificationsWireless protocol: 2.4/5GHzFOV: 360 degrees pan & tilt, 110 degree lensNight Vision: YesSpeaker: MonoVideo resolution: 2KToday's Best DealsView at AmazonView at AmazonView at AmazonReasons to buy+It's got removable cat ears+Built-in hub+Well pricedReasons to avoid-Won't work outdoors-Not all visible depending on the smart home platform you useThere aren't many HomeKit gadgets out there that want to make you smile, but the Aqara indoor camera hub G3 certainly puts in a lot of the heavy lifting for the space. That silicon cat ear hood can be pulled off if you're a misery and hate fun – but there are also some other great reasons that you might want to pick up this super cute little camera hub.For one, it's a hub that will link all your other Aqara sensors and devices to HomeKit, making them all work properly with the standard. It's also a really good camera, with brilliant resolution and a great wide-angle view. It's also very well priced – we're yet to review the camera, but those that have love the camera's features, with little bad to say about the little cat-eared camera that could.Best doorbell(Image credit: Logitech)5. Logitech Circle View Doorbell Best doorbellOur expert review: Average Amazon review:☆☆☆☆☆SpecificationsWireless protocol: 2.4/5GHzFOV: 160 degreesNight Vision: YesSpeaker: MonoVideo resolution: 1200x1600Today's Best DealsView at AppleView at antonlineView at AmazonReasons to buy+Easy installation+Excellent image quality+Fast response times and notificationsReasons to avoid-Expensive-Requires existing wiring-Recording requires an iCloud storage subscriptionThe Logitech Circle View Doorbell is another excellent entry into Logitech's product lineup, and this one straps to your doorframe, ensmartening your front door. There are some great features in the doorbell, such as the already excellent Logitech cameras that power it, as well as support for HDR and a 160-degree field of view.There's night vision on board too, so that you can see who might be coming to your door in the middle of the night. There are a couple of things to be aware of aswell, however; it needs to be hooked up to your existing doorbell wiring, so no battery power. You'll also need to pay a decent sum to get a hold of one – it's not a cheap device.Best wireless(Image credit: Christopher Close)6. eufyCam 2C Best wirelessOur expert review: Average Amazon review:☆☆☆☆☆SpecificationsWireless protocol: 2.4/5GHzFOV: 135 degreesNight Vision: YesSpeaker: MonoVideo resolution: 1080pToday's Best DealsView at soundcoreView at AmazonView at WalmartReasons to buy+Excellent night vision+Integrated floodlight+6-month battery lifeReasons to avoid-Missing anti-theft detection-Sometimes slow to load in the Home app-Non-removable batteriesThis set of Cameras is a great option if you're looking for something with no wires. There's a central hub that two battery operated cameras hook up to, and you can add more cameras when the need arises. Those cameras only need recharging when their batteries go out, letting you circulate which cameras aren't in operation while the other one charges.We love the size and look of the little cameras in our review, and as a package getting a couple of cameras is really good for security coverage. The cameras can be put inside and outside as well, so there's plenty of range to them. There are just a couple of things to note about them; the batteries are built in, so you can't change them, and there isn't any anti-theft detection. If someone wanted to run off with them, you'd be stuck camera-less, only realising when you go to check the feed.Best value(Image credit: Christopher Close)7. eufy Security Solo IndoorCam C24 Best valueOur expert review: Average Amazon review:☆☆☆☆☆SpecificationsWireless protocol: 2.4GHzFOV: 125 degreesNight Vision: YesSpeaker: MonoVideo resolution: 2KToday's Best DealsView at WalmartView at AmazonView at NeweggReasons to buy+Affordable price+2K image quality+2-way audioReasons to avoid-eufy app lacks 2FA-microSD card not included-2.4ghz Wi-Fi onlyThe tiny little eufy Indoor Cam 2K is a very accomplished camera, with great resolution and 2-way audio so that you can speak over the camera, and hear what is said back to you. It is for indoor use – you're not going to want to stick this thing outside lest it fill with water when it rains, but it's small enough to blend in with any room in the house.There are position adjustments in the camera's sturdy stand, and you can mount it to a wall if you need. There's a microSD card slot on the side as well, although you'll need to supply your own – there isn't one in the box. There's only support for WiFi 2.7GHz too, so it can be a little slow to react when you open it in app.Easiest setup(Image credit: Christopher Close)8. Eve Cam Easiest setupOur expert review: Average Amazon review:☆☆☆☆☆SpecificationsWireless protocol: 2.4GHzFOV: 150 degreesNight Vision: YesSpeaker: MonoVideo resolution: 1080pToday's Best DealsView at AmazonReasons to buy+1080p HD visuals+Easy set up process+Magnetic standReasons to avoid-Expensive-Indoor use only-Night vision not the greatestThe Eve Cam was Eve's first go at a smart home security camera, and an excellent first shot it was too. It's super compact, and the stand means that the camera can swivel around so that you can place it wherever you need. It is indoor only, but it's emphasis on privacy makes for a camera that gives you more piece of mind that it's around your house.Built from the ground up for HomeKit, the Eve cam works seamlessly with the Apple Home app, and lets you store video over HomeKit secure video. It will also work with all your sensors and other HomeKit devices so that you can make more automations and commands.It's not cheap, and the night vision could be better, but beyond that, it's an excellent home security camera.Best high-end(Image credit: Christopher Close)9. ecobee SmartCamera Best high-endOur expert review: SpecificationsWireless protocol: 2.4GHzFOV: 180 degreesNight Vision: YesSpeaker: MonoVideo resolution: 1080pToday's Best DealsView at AmazonView at Peak DesignView"
