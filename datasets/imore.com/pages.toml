description = "Everything you need to know about team iMore"
full_description = '''Apple About iMore News By IM Staff last updated 9 January 2023 Everything you need to know about team iMore When you purchase through links on our site, we may earn an affiliate commission. Here’s how it works. window.vanilla.infiniteArticlesData = []; (Image credit: Future) Jump to: Meet the iMore team Our top contributors Executive team How we test Ethics and standards Licensing, reprints, and permission About Future PLC iMore privacy policy The iMore team of Apple enthusiasts and experts shows you how to get the most out of your tech life by using Apple products and the apps, services, and devices they connect with to their fullest. iMore is THE destination for everything iPhone, iPad, iPod, Mac, MacBook and Apple Watch. With in-depth buyers guides, detailed help guides, expert product recommendations, and timely tips, the iMore staff seeks to provide all the guidance likeminded Apple lovers could possibly need. Born in 2008 of a merger between trusted Apple sites The iPhone Blog and Phone different, iMore is a mainstay in the Apple community for good reason. Every single iMore writer and editor takes their job seriously, and we prioritize accuracy and editorial independence in everything we do, never receiving compensation for coverage and never pulling punches.Meet the iMore teamGerald LynchSocial Links NavigationEditor-in-ChiefGerald Lynch is the Editor-in-Chief of iMore, keeping careful watch over the site's editorial output and commercial campaigns, ensuring iMore delivers the in-depth, accurate and timely Apple content its readership deservedly expects. You'll never see him without his iPad Pro, and he loves gaming sessions with his Game Center buddies via Apple Arcade on his iPhone 14 Pro, but don't expect him to play with you at home unless your Apple TV is hooked up to a 4K HDR screen and a 7.1 surround system. Living in London in the UK, Gerald was previously Editor of Gizmodo UK, and Executive Editor of TechRadar, and has covered international trade shows including Apple's WWDC, MWC, CES and IFA. If it has an acronym and an app, he's probably been there, on the front lines reporting on the latest tech innovations. Gerald is also a regularly contributing tech pundit for BBC Radio and in the past has written for various other print and online publications, including T3 magazine, GamesRadar, Space.com, Real Homes, MacFormat, music bible DIY, Tech Digest, TopTenReviews, Mirror.co.uk, Brandish, Kotaku, Shiny Shiny and Lifehacker. Gerald also holds a Guinness world record on Tetris. He is also the author of 'Get Technology: Upgrade Your Future', published by Aurum Press. Gerald is a big reader, studying English Literature at Goldsmiths, University of London, plays guitar, and knows his way around a virtual reality headset. Gerald dreams of the day when he can pop on an Apple VR headset and meet Lawnmower Man-era Pierce Brosnan. Sadly, Pierce doesn't share the dream.Stephen WarwickSocial Links NavigationNews EditorStephen Warwick has written about Apple for five years, three at iMore and before then at Today’s iPhone, part of the Phonedog group (now Slashdot TV). He covers all of iMore's latest breaking news regarding all of Apple's products and services, both hardware and software. This means Stephen is well versed in every area of Apple’s business operation. This includes its best products such as the iPad, iPhone, Mac, AirPods, and Apple Watch. However, it also extends to apps and services, as well as the supply chain, patents and litigation, competition, politics and lobbying, the environment, and more. Stephen has interviewed industry experts in a range of fields including finance, litigation, security, and more. He also specializes in curating and reviewing audio hardware and has experience beyond journalism in sound engineering, production, and design. Stephen also has a keen interest in gaming on both console and PC. Before becoming a writer Stephen studied Ancient History at University and also worked at Apple for more than two years. Stephen is also a host on the iMore show, a weekly podcast recorded live that discusses the latest in breaking Apple news, as well as featuring fun trivia about all things Apple.Tammy RogersSocial Links NavigationSenior Staff WriterAs the Senior Staff Writer for iMore, Tammy puts over a decade of experience in finding the best prices for Apple products to work, helping you save money on the equipment that you want. She keeps on top of the best prices on Apple devices around the web, letting you know the best times to buy. If you want to know the best thing to buy for a particular use case, Tammy’s your girl - she puts together the buying guides that tell you a little more about which products you should look at. While she may be the newest member of the iMore team, she’s bringing a unique take on the Apple ecosystem and bringing back regular deals content to round out the iMore library. It’s not just Apple that Tammy is into - she’s an avid audiophile and cinephile to boot. She’s turned her parent’s spare room into a home cinema, replete with large TV that dominates a wall and Dolby Atmos surround system. You’ll be pleased to know that it’s all second-hand - even outside of iMore, Tammy loves a deal. When not working, Tammy will likely be found doing more writing. With a Masters in Screenwriting from the University of the West of England, she fills most of her spare time writing feature-length and TV episode screenplays, interspersed with a hefty dosage of short stories, many of which will never see the light of day. Outside computer screens, she splits her time between rearranging a burgeoning action figure collection or racing a digital car around a virtual track. Tammy would like to replicate the shared cockpit scene from Top Gun, only with Lewis Hamilton in an F1 car. Lewis is yet to reply to her emails.John-Anthony DisottoSocial Links NavigationHow To EditorJohn-Anthony Disotto is the How To Editor of iMore, ensuring you can get the most from your Apple products and helping fix things when your technology isn’t behaving itself. Living in Scotland, where he worked for Apple as a technician focused on iOS and iPhone repairs at the Genius Bar, John-Anthony has used the Apple ecosystem for over a decade and prides himself in his ability to complete his Apple Watch activity rings. John-Anthony has previously worked in editorial for collectable TCG websites and graduated from The University of Strathclyde where he won the Scottish Student Journalism Award for Website of the Year as Editor-in-Chief of his university paper. He is also an avid film geek, having previously written film reviews and received the Edinburgh International Film Festival Student Critics award in 2019. John-Anthony also loves to tinker with other non-Apple technology and enjoys playing around with game emulation and Linux on his Steam Deck. In his spare time, John-Anthony can be found watching any sport under the sun from football to darts, taking the term “Lego house” far too literally as he runs out of space to display any more plastic bricks, or chilling on the couch with his French Bulldog, Kermit. Daryl BaxterSocial Links NavigationFeatures EditorDaryl Baxter is iMore's Features Editor, overseeing long-form and in-depth articles and op-eds. Daryl loves using his experience as both a journalist and Apple fan to tell stories about Apple's products and its community, from the apps we use everyday to the products that have been long forgotten in the Cupertino archives. Daryl studied Computer Systems (Networks) at Nottingham Trent University, where he first flexed his editorial muscles with an interview with original Tomb Raider composer Nathan McCree, published in the university's magazine, helping Daryl to discover the career he wanted to follow. Since then, Daryl's professional life has included working as tech support, freelance editorial, and eventually settling into full time editorial positions, building out a new tech site at Gfinity in 2018. Daryl was eventually tasked with leading the Software & Downloads section at TechRadar. Daryl also published a now best-selling book available in shops and online, called 'The Making of Tomb Raider', which tells the story of the beginnings of Lara Croft and the series' early development. He's constantly being asked if a second book is being made. Who knows... Now at iMore as its Features Editor, he wants to dig deep into the depths of Apple products, features and the company's rich history, looking at everything from the latest Apple silicon through to honoring what came before with the iPod Photo and the Macintosh. In his spare time, Daryl's usually found in a coffee shop, playing many retro games, and GoldenEye multiplayer on the Switch. Alongside this, he's also constantly replaying Metal Gear Solid 3, and quoting The Simpsons to whoever may be nearby.James BentleySocial Links NavigationStaff WriterJames is a staff writer and general Jack of all trades at iMore. With news, features, reviews, and guides under his belt, he has always liked Apple for its unique branding and distinctive style. Originally buying a Macbook for music and video production, he has since gone on to join the Apple ecosystem with as many devices as he can fit on his person. With a degree in Law and Media and being a little too young to move onto the next step of his law career, James started writing from his bedroom about games, movies, tech, and anything else he could think of. Within months, this turned into a fully-fledged career as a freelance journalist. Before joining iMore, he was a staff writer at Gfinity and saw himself published at sites like TechRadar, NME, and Eurogamer. As his extensive portfolio implies, James was predominantly a games journalist before joining iMore and brings with him a unique perspective on Apple itself. When not working, he is trying to catch up with the movies and albums of the year, as well as finally finishing the Yakuza series. If you like Midwest emo music or pretentious indie games that will make you cry, he’ll talk your ear off.Our top contributorsKaren FreemanSocial Links NavigationContributorKaren is a contributor to iMore.com as a writer and co-host of the iMore Show. She’s been writing about Apple since 2010 with a year-long break to work at an Apple Store as a product specialist. Before joining iMore in 2018, Karen wrote for AppAdvice (mostly about App Store apps and Apple product accessories), WatchAware (all about the Apple Watch.) She also wrote some articles for MacWorld, both online and in print. You'll also find her byline on Tom's Guide and CNET. Karen writes a lot of accessory roundups and reviews for iMore, plus occasional how-tos and editorials. She’s an early adopter who used to wait in long lines on release days before pre-ordering made things much quicker and easier, but still kind of misses lining up with the other Apple enthusiasts. Karen is a wife and mom (and dog mom) who is also a part-time teacher. She loves to travel and is always looking for the best portable tech and accessories so she can work from anywhere in the world. She works as a movie extra whenever possible and has done nine films so far, including Cherry on Apple TV+. Karen earned both her bachelor’s and master’s degree from University of Michigan and remains a big fan, so Go Blue!Joe WituschekSocial Links NavigationContributorJoe Wituschek is a Contributor at iMore. With over ten years in the technology industry, he has held positions at both Best Buy and Apple. Now, Joe now covers the technology company for the website. In addition to covering breaking news on a daily basis, he also writes opinion pieces and reviews that cover a the full gamut of products in the Apple ecosystem. From Apple TV to charging accessories, Joe’s interests range far and wide for anything that will have a meaningful impact for consumers that use Apple products. He fell in love with Apple products when he got an iPod nano for Christmas almost twenty years ago. In college he bought his first MacBook (it came with a free iPod touch for education at the time) and eventually the iPhone. Despite being considered a "heavy" user, he has always preferred the consumer-focused products like the MacBook Air, iPad mini, and iPhone 13 mini. He will fight to the death to keep a mini iPhone in the lineup. In his free time, Joe enjoys playing video games with friends on Xbox, going to the movies., photography, working out, and running. Over the pandemic, he has gotten heavily into the outdoors including hiking, camping, and backpacking.Oliver HaslamSocial Links NavigationContributorOliver has written about Apple and the wider technology business for more than a decade with bylines on How-To Geek, PC Mag, iDownloadBlog, and many more. He has also been published in print for Macworld, including cover stories. At iMore, Oliver is involved in daily news coverage and, not being short of opinions, has been known to 'explain' those thoughts in more detail, too. Having grown up using PCs and spending far too much money on graphics card and flashy RAM, Oliver switched to the Mac with a G5 iMac and hasn't looked back. Since then he's seen the growth of the smartphone world, backed by iPhone, and new product categories come and go. Current expertise includes iOS, macOS, streaming services, and pretty much anything that has a battery or plugs into a wall. Oliver also covers mobile gaming for iMore, with Apple Arcade a particular focus. He's been gaming since the Atari 2600 days and still struggles to comprehend the fact he can play console quality titles on his pocket computer. Passionate about apps and the developer ecosystem, Oliver is always keen to try out the hottest new things to hit the App Store — and some that haven't made it there yet, too.Executive teamJeremy KaplanSocial Links NavigationContent DirectorAfter 25 years covering the technology industry, Jeremy Kaplan is a familiar face in the media world. He is currently Content Director for iMore, where he oversees product development and quality for the world's most respected Apple blog. Before joining Future, Jeremy was Editor in Chief of Digital Trends, where he transformed the niche publisher into one of the fastest growing properties in digital media, ranking on the annual Inc 5,000 for three years running. The publisher won multiple awards during his tenure, including a sought-after Digiday Content Marketing Award in 2019. The same year, Jeremy was named to the FOLIO: 100, which honors publishing professionals making an industry-wide impact. How we testWe love unboxing, testing, benchmarking, and reviewing the latest and greatest Apple gear at iMore, as well as the various gadgets and software that help you make the most of your iPhones, iPads, Mac computers and more. We take our responsibility to provide informed and accurate recommendations and reviews seriously. And to make sure we deliver on our commitment to provide reliable a'''
