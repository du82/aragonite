title = "Apple buyer's guide: How to navigate the Apple Store and get the exact iPhone, iPad, Mac or Apple Watch you need | iMore"
description = "Take the guesswork out of your next Apple Store visit with our in-depth buyer's guide."
full_description = "Apple Apple buyer's guide: How to navigate the Apple Store and get the exact iPhone, iPad, Mac or Apple Watch you need Buying Guides By Tammy Rogers published 31 May 2024 Take the guesswork out of your next Apple Store visit with our in-depth buyer's guide. When you purchase through links on our site, we may earn an affiliate commission. Here’s how it works. (Image credit: Apple) Jump to: iPhone iPad Apple Watch Mac AirPods HomePod Apple TV Mac Displays AirTag Apple Vision Pro Accessories The Apple Store: Clean, bright, and filled with helpful staff that want to find the best Apple product for you. The online Apple Store is slightly different: Easy to navigate, with plenty of information, but nothing that tells you what you need. Be that deciding how much RAM you need in a Mac Studio, whether you want a Pro iPhone or a standard model, or if you should go for a cellular or GPS Apple Watch, there are so many questions that you want to be answered — and yet somehow, no one does.We here at iMore know our stuff about Apple products. What kind of spec options you should choose for different Macs, which storage options you should choose for your iPhone — the list goes on. if there’s a question about an Apple product then we’ve been asked it and answered it. Now, we’re putting all of our knowledge into one page, so that you can find out exactly what you need at the Apple Store — and how you can find it.Helping you make the right choicesWe’ll start off by explaining how we’ve split the page up. It’s divided into the products that you’ll be looking at buying from the Apple store, in such a way that it helps you compare what you’re looking for. For example: If you’re looking for an iPhone 15 Pro, it’s unlikely you’re also looking for the entry-level iPhone 15 — so we’ve compared it primarily instead against the more powerful iPhone 15 Pro Max. With some products, like the Mac lineup, the choice may be a bit more clear cut between some areas (desktop or MacBook, for instance), so we’ve specced out the best options for that branch so that you can see what you need to get the most out of your purchase. Beyond that, we’ve got a library of buying guides if you’re looking for the best accessories for your Apple products, so we’ve laid them all out too to make it easier to find what you need. Want to know whether you should wait for the next model? We’ll let you know how far along a product is in its expected life cycle, and we’ll update it as time goes on and an update gets closer and closer, so you never get caught out buying a device that's soon to be superseded.It's a big guide, so use the navigation bar on the left to jump to whichever section interests you the most. But take a browse throughout too — you might get tempted by something totally different along the way.iPhone(Image credit: Apple)iPhone 15 Pro and iPhone 15 Pro Max You can always trust iMore. Our team of Apple experts have years of experience testing all kinds of tech and gadgets, so you can be sure our recommendations and criticisms are accurate and helpful. Find out more about how we test. Models currently on sale:iPhone 15 ProiPhone 15 Pro MaxThe iPhone 15 Pro models are the top-of-the-range iPhones, and they come with prices to match. No matter which of the two you’re looking for, be ready to pay $999 and above. But what’s the difference between the two top-level iPhones?The main difference is the screen. The iPhone 15 Pro has a 6.1-inch screen, while the Pro Max features a larger 6.7-inch screen. If you’re not sure which screen is the right size for you, the best way to find out is to head over to a physical Apple Store and pick them up — you don’t want to be stretching your thumbs too far to use your phone, but you might be willing to sacrifice compact-ness for media consumption on the larger display.The Max also has an extra bonus in the form of its optical Zoom lens. While the iPhone 15 Pro is no slouch when it comes to zoom with 3x optical zoom, the Max has a camera capable of 5x optical zoom so you can get really up close and personal with your subjects.Battery life is the other consideration between the two — the Pro Max has a much larger cell inside that powers it for longer. Apple says that the Pro Max will get 3 hours of extra video playback, and our testing has confirmed the improved staying power of the larger model. Beyond the screen size and the camera, the two phones are vastly the same. There’s the A17 Pro chip keeping everything running along smoothly and powering some very impressive games and apps. The screens are both what Apple calls ‘Super Retina XDR’, and they feature ProMotion to up the refresh rate to 120Hz.Buying the best iPhones will net you the full gamut of features built up over successive iPhone generations as well; Dynamic Island on top to hide the camera hole in the front, an impressive camera with a 48MP main shooter, and the all-important USB-C port on the bottom. There’s more to the iPhone 15 Pro line than just that, however, and we go into great detail in our iPhone 15 Pro review and iPhone 15 Pro Max review.Should you buy an iPhone 15 Pro or Pro Max today? Yes, both were only unveiled in September, so will be relevant for some time yet. But which model should you buy, and which storage amount should you get? Simple: If you want the biggest and the best iPhone Apple has to offer, then buy the iPhone 15 Pro Max.Those with smaller hands or tighter pants should consider the iPhone 15 Pro, as it will take up less space and require less stretching of your thumbs to use. If you’re a photographer, mind you, then you’ll likely miss the improved zoom lens of the iPhone 15 Pro Max.Storage-wise, you should take a few things into account. How many apps are you going to install? Are you going to watch all your video content as downloads on-device or are you going to stream it? And are you going to take loads of pictures? At a minimum, you should be going above the base storage, and getting an iPhone 15 Pro with 256GB of storage. That will give you plenty of space for some of the App Store's best iPhone apps, your photo library, and other things you might store on your iPhone later down the line, like documents or digital publications.Bear in mind that you can’t upgrade your iPhone's storage like you can with some Android handsets, so what you buy is what you get through the life of the phone. 256GB is a minimum that you should be thinking about, but you might want to go even higher. The 512GB storage option is the best middle ground between space and price. You won’t be paying top dollar for more storage, but you’ll have enough to store more apps as they take up ever more gigabytes of space.If you’re looking to buy an iPhone 15 Pro Max for the camera so that you can use it in a more professional setting, then you should go for the 1TB option. You’ll pay the most, but you’ll get all the storage you’ll need. Remember as well that the Pro Max supports video recording to external storage media, so you don’t have to worry too much about those professional video or photography shoots taking up all your space.Confused about color? The iPhone 15 Pro and 15 Pro Max are available in several different Titanium finishes — Black, White, Blue, and Natural. Be aware that the Blue and Black Titanium options are susceptible to fingerprints, which can change the color for a little while when you use them. If you want to avoid this problem, stick with the White and Natural options.The exact model you should buy is:iPhone 15 Pro Max 512GB This is the iPhone Pro that we’d recommend. You’ll get that bigger screen, improved zoom lens, and increased battery over the smaller Pro model — but most importantly, a bit more space to store apps, photos, and videos. - Specs: 512GB | 6.7-inch display | USB-C charging - Price: $1,399Today's best Apple iPhone 15 Pro deals $999View $999.99ViewShow moreWe check over 250 million products every day for the best prices(Image credit: Apple)iPhone 15 and iPhone 15 PlusModels currently on sale:iPhone 15iPhone 15 PlusiPhone 14iPhone 13iPhone SE 3rd generationThe iPhone 15 line is the flagship of the iPhone fleet — it might not be the most expensive or most powerful, but it is the most important to Apple. It’s the iPhone that most people are going to buy, coming in at a lower price than the Pro models and in more colors. While not as impressive as the iPhone 15 Pro and Pro Max, it’s no slouch — and the iPhone 15 generation gained some features to bring it closer to the top models than previous iterations. If you want to learn more about the two devices in more detail, check out our iPhone 15 review and our iPhone 15 Plus review.Price-wise, you’ll be paying from $799 for an iPhone 15 all the way up to $1,199 for the largest model with the most storage. That price is going to depend on a couple of factors — the size of the phone, and how many gigabytes of storage it's got inside.The iPhone 15 Plus was released alongside the iPhone 15, following on from the larger model that came with the iPhone 14. There’s no real difference in specs, apart from the size of the screen (bumped up from 6.1 inches to 6.7 inches) and a larger battery afforded with the extra space in the chassis. That battery will give you around six extra hours of video playback, according to Apple.Beyond the screen and the battery, there’s not much difference between the two iPhone 15 models. Both have the A16 Bionic chip, the same that powered the iPhone 14 Pro and iPhone 14 Pro Max last year that’s capable of some impressive processing. The cameras are both the same, with a pair of lenses in the form of a 48MP main and an Ultra Wide system. Optical zoom goes up to 2x, and there are all the bells and whistles in the image processing engine for those well-known incredible iPhone photos.You are giving up some things with the iPhone 15 and iPhone 15 Plus over the Pro and Pro Max. One of the most noticeable is the lack of ProMotion — the non-Pro models are noticeably less smooth than the more expensive iPhones, which might put you off. That screen also lacks the Always-On feature of the top-of-the-line iPhones, so you’ll miss out on the StandBy mode. There are also fewer storage options, only going up to 512GB, so if you need more room to store stuff on your iPhone, then you might want to look elsewhere.One thing you don’t miss out on, however, is the Dynamic Island at the top of the screen. It’s a nice, Pro feature that’s moved over, and lets you track now playing music and other apps with a glance at the software bubble that appears over the front camera module. All the new iPhone models also received a USB-C port on the bottom, reducing the number of cables you’ll need to cart around with you.Should you buy an iPhone 15 or iPhone 15 Plus Max today? Yes, iPhones are revealed every September and the iPhone 15 range is only a few months old. This one's got some shelf life yet.What of the other iPhones that you can buy on the Apple Store? Apple has left some of the older iPhone models up for purchase, and you might save some money if you go for something a little less new. The iPhone 14 is the newest of the three other models, and you’ll still get a solid phone. You’ll take a hit in camera and processing power, but you’ll still get an excellent phone. The chassis will be slightly different as well — this year's iPhones got new, smoother lines whereas the iPhone 14 is more angular in the edges. No USB-C, either — only Apple's proprietary Lightning charging and data transfer. The iPhone 14 will save you around $100 if you go for it: They start at $699. For more about the iPhone 14, check out our iPhone 14 review.The iPhone 13 can still be bought at the Apple Store, and if you’re looking for an iPhone that’s still potent but don’t want to spend too much, then it’s the way to go. The screen is vastly the same as the iPhone 14, the processor similar, and the camera identical — if you put the two side by side, you’ll be hard-pressed to find any difference beyond the color options. The iPhone 13 starts at $599, a $200 saving on the iPhone 15. For more details, read our iPhone 13 review.Finally, you can buy an iPhone SE 3rd generation — the base model iPhone that comes in at $429. It’s completely different in most ways from the rest of the iPhone lineup, bar the OS that runs at the center. It’s got a 12MP single-lens camera, a Touch ID sensor on the front for fingerprint security scanning, and large bezels around the 4.7-inch screen. If you want the best iPhone for dipping your toes into the line, then this could be what you’ve been looking for. Still not sure? Check out our iPhone SE 3 review for more information.But which iPhone 15 should you buy? The color, of course, is up to you — but there are a couple of things inside the iPhone that you should think about. For one, whether you should get the Plus or the non-Plus iPhone. Our choice would be to save a little money and go for the iPhone 15 — the screen is fine for almost everything you could ever want to do with your phone, and it won’t require as much thumb stretching to use.The second thing to think about is storage — and this is where you should spend the extra. As apps, games, and high-quality photos become larger and larger, you need extra storage to keep more on your phone. We’d recommend at least paying the extra $100 on the 256GB iPhone — that doubles the base storage, and gives you plenty more space for anything you want to store on your iPhone.Still not sure about the screen size? Pop over to the Apple Store and get both in your hand — have a play with the phone, turn it over in your hands, and work out whether it's too big or just right for you. It’s more sensible than ordering and hoping for the best and gives you a better idea of the size of the handset.The exact model you should buy is:iPhone 15 256GB We’d recommend sticking with the physically smaller iPhone in this instance, but you should still upgrade th