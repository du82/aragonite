title = "Sign up for the iMore newsletter! | iMore"
description = "Did you know you can get iMore's best articles of the day delivered right to your inbox?"
full_description = '''Apple Sign up for the iMore newsletter! News By Gerald Lynch published 6 July 2022 Did you know you can get iMore's best articles of the day delivered right to your inbox? When you purchase through links on our site, we may earn an affiliate commission. Here’s how it works. window.vanilla.infiniteArticlesData = []; (Image credit: Future) Dear iMore reader, Want a slice of iMore in your inbox every week? Then you've come to the right place!From this page you can sign up to the all-new and improved iMore newsletter. This weekly letter will replace the one you may have already been getting, and has been revamped and reworked to better serve you. The iMore newsletter will act as a digest for all the most important information coming out of Apple’s HQ in Cupertino, whether that’s the latest news, rumors, product launches or explainers. Every article will be hand curated by our team of editors, adding context and insight into why we think a given topic should be on your radar.The new edition will hit your inbox every Friday. Expect to see it at around noon EST / 5pm GMT, ready to be read at your leisure over the weekend. All you need to do is fill out the form below.To ensure that the iMore newsletter makes it to your inbox, please be sure to add imore@smartbrief.com to your email contact list, too.Please let us know what you think. Reader feedback is important to us and we would love to hear your input on the topics and articles we select for you. We’ll also be running polls in the newsletter too – a great opportunity to have your voice heard on the most vital conversations on all things Apple.Thanks in advance — your suggestions will make the iMore newsletter a more fun, relevant and informative reading experience. window.sliceComponents = window.sliceComponents || {}; externalsScriptLoaded.then(() => { window.reliablePageLoad.then(() => { var componentContainer = document.querySelector("#slice-container-newsletterForm-articleInbodyContent-hxHaF4ZU