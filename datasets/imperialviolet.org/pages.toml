["https://www.imperialviolet.org/tourofwebauthn/tourofwebauthn.html"]
title = "A Tour of WebAuthn"
full_description = "This book was distributed at the FIDO Authenticate conference in 2024. Its intended format was as a PDF, which you can find here. If you’re reading this book then hopefully you’re already on board with this idea, but let’s recap anyway. The typical practice with passwords is to remember a few different ones and re-use them widely. (Password managers support generating random passwords, but people mostly don’t.) Sites must store hashes of these passwords to recognize them, but most passwords have too little entropy to resist brute-forcing when the hashes leak. (The website haveibeenpwned.com now has records of about 13.5 billion accounts that have been found in account database leaks from nearly 800 websites.) When a password database leaks, not only can any successfully cracked passwords be used immediately to sign in to that site but, because of password re-use, those users’ accounts on other sites may also be compromised. Next, because users typically remember their passwords, they can be tricked into entering them on lookalike websites. These “phishing” attacks are common, effective, and can have global implications when used to interfere in elections. Lastly, passwords can leak from many other parts of the software stack. Facebook inadvertently logged hundreds of millions of passwords over many years, and Javascript-injection attacks can exfiltrate anything entered on a site, including passwords. This book is about using public key signature schemes to try and build a better system of authentication. These schemes have names like ECDSA, RSA, and ML-DSA. They vary in how large their outputs are, how fast they operate, and whether they’re resistant to (still theoretical) large quantum computers. In this book we’ll consider them only in the abstract—the construction of public key signature schemes is a deep and fascinating topic, but we will cover none of it here. The names of these operations have obviously been chosen to suggest analogs in the real world, but that is a double-edged sword. These are not handwritten marks on a piece of paper; they are only defined by the operations above. For example, there can be multiple valid “signature” values by a public key for a given message. But while these subtleties are important in some contexts, like cryptocurrencies, they aren’t for us."
author = "Adam Langley"
year_published = 2024
year_updated = 2024
clearnet = "https://www.imperialviolet.org/tourofwebauthn/tourofwebauthn.html"
