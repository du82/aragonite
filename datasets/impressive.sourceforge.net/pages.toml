title = "Impressive"
full_description = '''2023-11-04A new maintenance release: 0.13.2 Again, long time no update, but changes in libraries Impressive depends on again forced my hand here: This time, it's Pillow (the successor of the Python Imaging Library) that deprecated a few APIs for whatever reason, making Impressive 0.13.1 crash on newer Linux distributions that ship with this newer library version. 0.13.2 fixes this and a few other bugs as well. There are no functional changes. 2022-03-190.13.1 brings SDL 2 support There hasn't been an update for a long time, and you might wonder what happened to the »final« version of 0.13.0. I decided to skip it, because 0.13.1 introduces another important compatibility feature: suport for PyGame 2 and SDL 2. Other than that, it's mostly bug fixes and little enhancements here and there. Unfortunately, there are some caveats with PyGame 2 support, which are out of my control; specifically, there's frequently trouble with PyGame 2.0 on Linux systems, but those seem to be fixed with PyGame 2.1. And if you're using a Raspberry Pi of generation 1 to 3, do yourself a favor and stay at the older buster version of Raspbian, »Raspbery Pi OS (Legacy)«. While Impressive has been adapted to work with the current bullseye version, that doesn't offer 3D acceleration on those older Pi models (yet?), and only shows a black screen if you force it. Raspberry Pi 4 users are not affected. 2020-05-31Some maintenance in 0.13.0-beta2 The second beta version brings the expected bugfixes (mainly crashes on Python 3 due to oversights during porting), but also a few minor new features: High-DPI scaling is now disabled on Windows, so that the display isn't as blurry as it used to be on affected systems. New prev and next PageProps have been introduced to change the playback order of pages. Finally, there's now a »pseudo-binary« file called impressive in the .tar.gz release archive that's more compact and with slightly quicker startup time than the standard source code file. 2019-11-21A Linux-specific hotfix in 0.13.0-beta1a While testing on various machines, a rather nasty bug has been found on Linux: If the PyGame library has been installed using pip (Python's own package manager) instead of a distribution package, it would simply crash hard. 0.13.0-beta1a explicitly fixes this. Windows is not affected at all, so there's no new Win32 package. 2019-11-20Towards Python 3 with 0.13.0-beta1 The next major version bump is immanent, but this time, it isn't much about features on the surface, but rather profound changes under the hood: With a lot of help from the Fedora project, Impressive has finally been made compatible with Python 3.x. This is important because Python 2.x is discontinued and will no longer be supported in 2020. The amount of changes needed to ensure this Python 3 compatibility is quite large though, and as the version string indicates, there may still be some issues lurking around, even though it proved stable in my testing so far. Other than that, there aren't many changes: The Win32 package is now built with Python 3 too, and for 64-bit architectures. The page count for the --page-progress option can now be limited (to compensate for backup slides, for example), the overview animation time can be configured independently from the zoom animation time, and more than one progress bar can now be displayed at once. 2019-08-28Some maintenance in 0.12.1 After one and a half years, there is now a new release that fixes a few issues, mainly with new library versions. The only new feature is that automatic slideshows can now be paused temporarily by pressing the [A] key. Furthermore, Impressive should now run on Raspberry Pi 4, but (contrary to how it was for earlier RasPi generations) only inside an X11 session. This is most likely the last version of Impressive that requires Python 2.7 to run; behind the curtains, preparations are made for a next version that will run on Python 3 as well. 2018-02-040.11.3 and 0.12.0, the unexpected feature release Sometimes things just don't work out as planned. 0.11.2 had a rather nasty bug that broke automatic presentations (the -a/--auto option), so 0.11.3 was planned as a bugfix release to take care of that and some other little issues that made hyperlinks not work properly in every situation, or even crash when clicking them in some PDFs. But then a very avid user of Impressive informed me of some modifications he did and ideas for other features, and I just couldn't keep myself from implementing it all ... so here we have it: 0.12.0, a totally unplanned feature release! It mainly does two things: One, it greatly enhances zoom mode, with fractional zoom levels, mouse wheel zooming, and the so-called »box zoom« mode, where you can draw a box just like a highlight box, except that Impressive zooms in so the box fills the whole screen and darkens everything else. Two, it takes video a little more seriously: Video files can now be specified as input files, just like images and PDFs. The video player backends have been a little modernized (particularly on Windows), and video is now supported on the Raspberry Pi as well. 2017-12-190.11.2, a maintenance release This version doesn't add any major features, but it's more stable and compatible with newer software environments. The largest change is a new MuPDF backend with better performance than ever, and the possibility to use MuPDF for PDF parsing. As a result, pdftk is no longer a hard requirement to open newer PDF documents; the only feature that still depends on it is automatic extraction of page titles. Even hyperlinks work without it. 2015-11-12Some small fixes in 0.11.1 This update just adds a few small fixes regarding hyperlinks and, most importantly, a compatibility fix for newer versions of one of the libraries relies on. This caused Impressive to break for Arch Linux users a few days ago, and so I'd rather make a new release version before the new library version gets into the real mainstream distributions. 2015-01-08... and now for the Windows users: 0.11.0b Linux wasn't the only system affected from some growing pains in 0.11.0. I got two bug reports that the Windows version wasn't working either on some specific graphics hardware / driver combinations. To fix this, the way OpenGL functions are loaded has been rewritten and the problem seems to be gone now. 2014-12-23Just a minor patch: 0.11.0a Only a couple of hours after the release of 0.11.0, users informed me that there were problems with some recent Linux distributions, namely »could not load SDL library« errors and crashes because no OSD font has been found. 0.11.0a should fix these issues. It's a source-only release that affects POSIX systems only; on Windows, this version behaves in all regards identical to 0.11.0. That's why there's no new Win32 .zip file for 0.11.0, as it isn't needed. 2014-12-21Early christmas present: 0.11.0 is out Almost one year ago, I promised some larger changes to Impressive and, in fact, already implemented them. They sat in SVN for quite a while, and so far it seems that the people who tried them are quite happy with them, so it's time for a new release. In 0.11.0, major parts of the program have been rewritten. The graphics code is all-new and is now based on OpenGL (ES) 2.0 instead of the ancient OpenGL 1.1. The result: It now runs on Raspberry Pi, and transitions are smoother on this small computer than they ever were on high-end PCs with the previous versions. The other big thing is that Impressive finally got fully customizable keyboard and mouse controls. Also, the blazingly fast MuPDF is now supported as a PDF rendering backend. The changes also bring some incompatibilities though. The most important one is that the transition PageProp no longer affects the transition after the specified page, but the transition to (or before) the specified page. The -e/--noext and -R/--meshres command-line options are now gone because they don't have any place in the new OpenGL 2.0 world; the -e option has been reused for input customization. Finally, some (rarely used) transitions have disappeared and some new ones are now available. 2014-05-02A major bug fixed in 0.10.5 As it turned out, 0.10.4 didn't only fix a ton of bugs, it also introduced one particularly nasty one: The file list feature stopped working. Since many people were using it, 0.10.5 fixes this specific issue. Other than that, it doesn't contain anything new; all the exciting stuff won't appear until 0.11.0. 2013-12-29Surprise! 0.10.4 is alive and kicking! Yes, it has been another really, really large gap between the previous release and this one – so large, in fact, that some people already think the project has been discontinued. The reports of Impressive's death are greatly exaggerated though. In fact, I'm planning to release a new major version soon(-ish), and 0.10.4 is an intermediate step before I start with the bigger (and compatibility-breaking) changes. 0.10.4 has the longest changelog of any version to date, but it's mostly smaller changes. There are some bugfixes and compatibility improvements, and a couple of options that can be useful in certain situations, like Ignite-style quick talks or LaTeX slides with built-in presenter screens. 2010-10-170.10.3 is out — finally a new release after a long time! It has been over one and a half years since the last regular Impressive release. Development slowed down considerably since, but it didn't halt: A few changes were made in the Subversion repository. Most of these are bugfixes, stability fixes and compatibility fixes to make Impressive work with newer versions of the tools it relies on. There are a few new features, though these are just minor ones. 2008-02-030.10.2 is out, containing a few new features This release contains some internal fixes and improvements, but also a few user-visible new features. First, there's support for URL hyperlinks like web links and e-mail addresses. Second, Impressive now understands list files: These are text files that contain the actual names of the files to show, which can be useful for image slideshows. Third, there's are new »automatic overview« mode that hides PDF pages from Impressive's overview page based on whether they have a title or not. This makes use of the fact that some LaTeX packages for presentation slide generation don't emit PDF titles for pages that are part of multi-step slides (those who are revealed one step after another). Finally, there are three new PageProps: Using keys, alphanumeric keys can be bound to user-provided Python functions now, comment permanently shows a line of text on a page and video is a highly experimental(!!!) feature that plays a fullscreen video when a page is entered. 2007-11-27a little interim release Over the last few weeks, it came to my attention that most Linux distributions switched to an incompatible pdftoppm implementation that breaks Impressive's page rendering. Since I don't have the time to turn my TODO list into a new release, I just updated a few spots to make it work on newer Linux distributions again. Users of the Win32 package don't need to (and, in fact, can't) update. 2007-09-090.10.1 supports PDF hyperlinks Apart from bugfixes and internal improvements, there are three important new features in this release: First, Impressive now contains a simple PDF parser, which (in conjuction with pdftk) can extract PDF hyperlinks and make them usable. This means that the navigation controls put into the files, e.g. by the latex-beamer, can finally be used. Second, there is a more generic command-line parser: Impressive now accepts an arbitrary number of image files, PDF files or image directories as inputs and concatenates them automatically. The third feature is a new (optional) "persistent" cache mode, which can be useful for large and frequently held presentations. It works just like the normal disk cache that was introduced in 0.9.0, but the cache files won't be deleted and can be used to speed up initialization the next time the presentation is shown. Please note that some caching-specific command line options have been changed in this process; please refer to the help screen or manual for details. 2007-06-020.10.0 comes with a huge load of new features Up to now, I took the time to describe each release's new features in detail, but 0.10.0 has so much of them that I will use a more compact presentation this time :) Most importantly, Impressive now uses Xpdf's pdftoppm as the default PDF rendering backend. This not only solves numerous GhostScript problems – it's also faster and cuts the Windows version's size down to a half. New keyboard shortcuts: [Home]/[End] for first/last page, [L] to return to the most recently displayed page, [I] and [O] for interactive toggle of the skip and »visible on overview page« flags, [R] to reset the timer Unused alphanumeric or function keys can now be used for shortcuts to quickly access specific pages. Impressive finally accepts lists of image file names on the command line. This makes JPEG/PNG slideshows much easier. Transitions can now be turned off completely, either globally or on a per-page basis. The PagePeel transition is not longer part of the default set of transitions. This means that now all default (automatically assigned) transitions are of the non-intrusive Crossfade and Wipe kind. Note that any info scripts which do a AvailableTransitions.remove(PagePeel) will not work any longer! On the other hand, two new families of (rather intrusive) transitions have been added: Slide and Squeeze. Both come in variants for all four main directions, Left, Right, Up and Down. The OSD layout is now configurable on the command line. New page properties: transtime to set the transition duration for a single slide, progress to suppress display of the duration/progress indicator bar, reset to reset the timer after a page has been shown Added the possibility to execute any Python code before and after specific pages. Of course, there's a bunch of minor extensions and also bugfixes, most importantly the one for the supersample mode. (Which, on the other hand, is somewhat obsolete now that Xpdf is used for rendering :) 2007-03-19A bunch of new features in 0.9.4 Besides numerous smaller bugfixes, the current release adds some new interesting features: If the target duration of the presentation is known, Impressive can display a progress bar at the lower edge of the screen. Luke Campagnola contributed code to adjust the gamma curve and the black level of the presentation. Impressive may now use a transparent PNG file as the mouse cursor image instead of the default one. And finally, the middle mouse button comes to life again: it toggles the overview mode now. 2007-02-26Time for 0.9.3 Today's new version fixes some annoying bugs and implements some minor under-the-hood polishing. But there's a new feature, too: The [T] key now shows a little time display in the upper-right corner of the screen. If [T] is pressed while'''
