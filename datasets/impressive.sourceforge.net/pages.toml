["https://impressive.sourceforge.net/manual.php"]
title = "Impressive"
full_description = "Impressive Documentation http://impressive.sourceforge.net/ Version: 0.13.2 Author: Martin J. Fiedler Last updated: 2023-11-04 You can download this document for offline reading or print it. Table Of Contents Description Installation Command Line Parameters Usage Control Configuration Info Scripts Other Useful Information Description Impressive is a simple presentation program that displays slideshows of PDF documents, image files or video files. Rendering is done via OpenGL, which allows for some “eye candy” effects. A somewhat-modern GPU (graphics processing unit) supporting OpenGL 2.0 or OpenGL ES 2.0 and appropriate drivers are required to run Impressive. Installation There are three basic ways to get an Impressive installation on your computer. The following section will guide you through each of these methods. The easy method: use a pre-built package For Windows systems, a ZIP file with a pre-built version of Impressive and all required external tools can be downloaded from the web site. There is no real installation procedure – the ZIP file can be extracted into any folder. One of the extracted file is called impressive.exe. PDF files or directories containing images can simply dropped onto this file in Explorer to run a presentation with default settings. A more comfortable method is installing Impressive in the »Send To« menu that's part of each file's context menu. This is done by opening the location shell:sendto in Explorer and creating a shortcut to impressive.exe there. After that, a presentation can be started by right-clicking a PDF file and selecting »Send To → Impressive«. Most GNU/Linux distributions offer Impressive as part of their standard package repositories, among them Debian, Ubuntu, Fedora, OpenSUSE and Arch Linux. The package is typically called impressive and will install all necessary dependencies. On Mac OS X, there is a py-impressive package in the MacPorts repositories, but at the time of writing, it's extremely outdated and thus not recommended. In general, the easy method of installing the Windows ZIP or distribution package is simple and convenient, but it has caveats: Releases of Impressive only happen in long and irregular intervals, and the package maintainers may be a few versions behind. Recent features and bugfixes will thus not be available. Using the source code release Another way to get Impressive is downloading the platform-independent source code version. The most important file in this archive is impressive.py, which contains all the code of Impressive, and impressive (without extension), which is the same in a compressed manner. The latter can be run like any executable on Unix-like systems, or installed system-wide using sudo install -m 755 impressive /usr/local/bin/. However, the following external libraries and utilities have to be installed as well for Impressive to work: Python 2.7, 3.6 or newer — www.python.org (required); in particular, for the »pseudo-binary« version (impressive without .py), Python 3.x is required PyGame (the SDL binding for Python) — www.pygame.org (required) PIL, the Python Imaging Library, or Pillow, a compatible fork of it — www.pythonware.com/products/pil (required) pdftk 1.44 or higher (a.k.a. »PDFtk Server«) for retrieving PDF metadata (page titles) — www.accesspdf.com/pdftk (recommended; required if MuPDF is not available) the MuPDF utilities for PDF rendering and metadata retrieval (hyperlinks) — www.mupdf.com (highly recommended) Xpdf or the Poppler utilities for alternate PDF rendering — www.foolabs.com/xpdf/ or http://poppler.freedesktop.org/ (required if MuPDF is not available; not required otherwise) GhostScript for alternate PDF rendering — www.cs.wisc.edu/~ghost (required if neither MuPDF nor Xpdf/Poppler utilities are available; not required otherwise) xdg-utils for starting web or e-mail hyperlinks from PDF documents — portland.freedesktop.org (recommended; does not apply to Win32) PyWin32, the Python for Windows extensions — pywin32.sourceforge.net (optional; applies to Win32 only) MPlayer or MPlayer2 for sound and video playback — www.mplayerhq.hu (optional) omxplayer for video playback on Raspberry Pi — github.com/popcornmix/omxplayer (optional; applies to Raspberry Pi only) FFmpeg for more efficient generation of video preview images — ffmpeg.org (optional) On Unix-like systems, these dependencies are typically available in the major distributions' package repositories and can be installed easily with the package managers, e.g.: Debian/Ubuntu: aptitude install python3-pygame python3-pil pdftk mupdf-tools xdg-utils mplayer ffmpeg Fedora: yum -i python3-pygame python3-pillow pdftk mupdf xdg-utils mplayer ffmpeg Arch Linux with AUR: pacman -S python3-pygame python3-pillow pdftk mupdf xdg-utils mplayer ffmpeg Mac OS X with MacPorts: port install py27-game py27-pil pdftk mupdf xdg-utils mplayer ffmpeg Using the latest version from SVN The source code of Impressive is maintained in a Subversion (SVN) repository. For users that want the newest version or want to help with debugging or developing Impressive, it is recommended to check out this repository: svn co https://svn.emphy.de/impressive/trunk/impressive Regarding external dependencies, the section above applies as well; in addition, Subversion (whose package is usually called svn or subversion) is obviously required too. After checking out the sources, the impressive.py program will still be missing. Instead, the main program is called impressive_dev.py and is functionally equivalent; it pulls the actual source files from the src subdirectory and runs them. To get a real stand-alone impressive.py file for installation or redistribution, it needs to be generated using either make (if GNU Make is installed) or python compile.py. On Linux systems, sudo make install can then be used to install Impressive at /usr/local/bin/impressive and its manpage at /usr/local/man/man1/impressive.1. These two installed files can be removed again with sudo make uninstall. Special considerations for Raspberry Pi Impressive runs on Rasbperry Pi Single-Board Computers with bearable performance, if the following notes are taken into consideration: On Raspberry Pi generations 1, 2 and 3 with the classic (non-KMS) graphics driver stack: Overscan must be off (set disable_overscan=1 in /boot/config.txt, or run raspi-config → Advanced Menu → Overscan). Doesn't require X11 – can also be run from a normal text console in Raspbian Lite. Can be run from X11, but only in fullscreen mode. On the Raspberry Pi 4 and Pi 1-3 with KMS drivers, Impressive behaves like the desktop version. Must be run from X11, can use windowed mode. On Raspberry Pi 1 to 3, 3D acceleration might not work, falling back to (very slow!) software rendering. Video playback uses omxplayer instead of MPlayer. This has the following advantages and drawbacks: Only H.264 and (if licensed on the specific device) MPEG-2 video codecs are supported. These are, however, hardware-decoded with full performance. Fine-grained seeking (1 second / 10 second) is not supported. 1-second seek operations are ignored, 10-second seek maps to 30-second seek. Since microSD storage is very slow on the Raspberry Pi, consider using the -cz/--cache compressed option for better performance. This will consume more RAM though, which is also a scarce resource on the device, but typical presentation slides with uniformly colored backgrounds compress very well and shouldn't be a problem. Using Impressive, it is possible to convert a Raspberry Pi 1 to 3 into an automated »digital signage« system, i.e. a system with the sole purpose of repeatedly showing a single presentation, which can consist of one or more PDF files, image files, or videos. Currently, there's no automated installation for this mode; however the following script (which is included in an SVN checkout as well) contains the necessary code and installation instructions (for advanced users): https://svn.emphy.de/impressive/trunk/impressive/boot_impressive.sh Command Line Parameters When used from the command line (some terminal and shell in Unix, cmd.exe on Windows), Impressive accepts a range of command-line options in GNU getopt syntax. The following options are available (in alphabetical order): -a <seconds> or --auto <seconds> Automatically advance to the next page after the given number of seconds. Together with the -w option (described below), this can be used to create automatic slideshows. Note that this option will not interrupt video playback: If a video is longer than the interval specified with --auto, it will be played until the end, but Impressive will change to the next page directly after that. -A <X>:<Y> or --aspect <X>:<Y> Specifies the display aspect ratio. Normally, Impressive assumes that the pixel aspect ratio is 1:1 (square pixels), regardless of the display resolution that has been set up. If a resolution has been selected that doesn't match the display's aspect ratio, the screen will be distorted. To overcome this, this option may be used to manually specify the display aspect ratio, e.g. »-A 16:9«. Note that this option has no effect if the MuPDF backend is used for rendering. -b or --noback Disables background rendering. By default, Impressive will pre-render all pages in a separate background thread while the presentation runs. If this option is specified, it will instead render all pages immediately on startup. This option has no effect if caching is disabled (--cache none, see below). --background <color> Sets the background color of the overview page and the page border that's visible if the page's and the screen's aspect ratios don't match. The color is specified using HTML/CSS 3-digit or 6-digit hexadecimal RGB syntax: #f00 or #ff0000 is bright red, for example. The leading hash sign (#) is optional. In addition, the words black (which is also the default) and white are recognized. -bare Disables all functionality that relies on temporary files, specifically video frame extraction using MPlayer (extracting video frames with FFmpeg still works), PDF page title extraction, PDF hyperlinks, and even PDF rendering for all backends except MuPDF 1.4 or newer on Unix-like operating systems. --box-edge <pixels> Sets the border size (in pixels when unzoomed) of the highlight boxes' and spotlight's smooth edges. The default value is 4 pixels; it can be set to zero, in which case highlight boxes and the spotlight will have hard edges. -B <ms> or --boxfade <ms> Sets the duration (in milliseconds) of the highlight box fade-in/fade-out animation. Default value: 100 ms. -c <mode> or --cache <mode> Specifies the page cache mode to use. Valid options are: noneDisables page caching altogether, only the current and the following page will be kept in RAM. Jumping between pages will be very slow, because Impressive will need to render the requested pages on the fly. In addition, the overview page won't be complete until every page has been shown at least once. memoryCaches all page images in memory. This is the fastest method, but it requires very large amounts of memory (about 3 MiB per page at 1024x768 resolution). compressed or zCaches all page images in memory as well, but in compressed form. This will be a little slower than memory mode, but on pages with uniform backgrounds, this will easily reduce the required amount of RAM by a factor of 20. diskLike memory, but uses a temporary file rather than memory for storage. This is the default. persistentUses a permanent cache file for caching. This file will not be deleted when Impressive quits and will be reused on subsequent invocations. The default name for the cache file is derived like the names for Info Scripts (see below for an explanation), but with a .cache file name extension instead of .info. This method is a little bit slower than disk mode, but the time span until the overview page is fully populated will be significantly decreased if Impressive is ran again with the same input files and options. The mode name may be abbreviated at will, down to one character. Thus, --cache persistent, -c persist and even -cp are all synonyms. -C <filename>[:<X>,<Y>] or --cursor <filename>[:<X>,<Y>] This option can be used to specify an image that shall be used as a (software) mouse cursor instead of the normal (hardware) one. It can either be a name of an image file (typically a transparent .png) or one of the special values »-« (dash) or »default«, both of which select a built-in cursor image. On platforms that do not support a hardware cursor, this default cursor will also be used as a default if this option is not used. If the name of an external file is specified, the position of the hotspot (the pixel inside the cursor where the actual mouse position is located) can be specified as well, for example: --cursor mycursor.png:2,4. --clock If this option is enabled, the current time will be shown instead of the elapsed time if time display is activated (with the T key in the default control configuration). Compatible with the -M option. --control-help This option will output a short help screen of how the control configuration (keyboard and mouse bindings) work, along with a list of all recognized events and actions and a dump of the current bindings (which is the default configuration if no other -e/--bind or -E/--controls options precede this option). After that, Impressive will exit; no presentation will be started. -d <time> or --duration <time> Specifies the expected run time of the presentation. The time parameter can be either a number of seconds or a human-readable time like 1:23 (1 minute and 23 seconds), 4:56h (4 hours and 56 minutes), 3m45s (3 minutes and 45 seconds), 5m (5 minutes) or 1:23:45 (1 hour, 23 minutes and 45 seconds). If an expected duration is specified, Impressive will show a semi-transparent green progress bar at the bottom edge of the screen, indicating how much time has already passed. If the time is up, the bar will occupy the whole edge and fade to yellow (at 125% of the expected time) to red (at 150% or more). -D <ms> or --mousedelay <ms> Sets the time (in milliseconds) the mouse cursor is shown if it is not moved. There are two special values: 0 (zero) shows the mouse cursor permanently, 1 (one) hides it completely. The default value is 3000 ms if Impressive is started in fullscreen mode, and 0 (i.e. don't hide) if started in windowed mode. --darkness <percentage> Specifies how much the screen shall become darker when using highlight boxes or spotlight mode. The value is specified in percent, with 25 being the default. A value of zero would mean no darkening at all (the screen would just be blurred slightly, and desaturated if the graphics hardware supports it), and a value of 100 would make everything but the highlighted parts of the screen black. -e <bindings> or --bind <bindings> Configures keyboard or mouse bindings. For the syntax of the argument, refer to the Control Configuration section of the manual. -"
year_published = 2025
clearnet = "https://impressive.sourceforge.net/manual.php"
