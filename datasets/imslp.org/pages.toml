["https://imslp.org/wiki/CC-SA_or_similar"]
title = "IMSLP:Licensing Policy and Guidelines - IMSLP"
full_description = '''We welcome works that are naturally in the public domain, as well as new editions, arrangements and compositions released for use in line with our licensing policy (explained on this page). This page is mainly about licensing rules for original creations (editions, recordings, arrangements, compositions) made by IMSLP users. For information on public domain files, see Copyright Made Simple and Public domain. Copyright law protects creative works by default in virtually every country around the world. Normally, all rights are reserved to the creator of a work at the time of its creation. The only way that a work can be shared on IMSLP is if the original copyrights have expired or if the copyright holder grants permission. Copyright is a complex subject, and what constitutes a copyrightable creation is not the same in every country; copyright law is complicated and explainers of various aspects can be found on other pages. We are still working on making our explainers more comprehensive and updating them for the latest changes. For some information, see Copyright Made Simple and Public domain. In any case, submissions can include public domain content, copyrighted content or both. For example: Works that are in the public domain can be used by anyone for any purpose. They can be performed and copied freely and used as the basis for new works (such as your arrangement) with no restrictions. These new works can be released under a free license, but they are proprietary by default — that is, copyright law restricts their use to only that specifically authorized by the copyright holder; if the copyright holder releases the work under a free license, then this grants permission to anyone to use the copyrighted work according to the terms of the license. Note that licenses are not "infectious." They can only protect original copyrighted material controlled by the person granting permission. For example, in the United Kingdom, a new "typographical arrangement" is protected by copyright for a term of 25 years. So if you open a scorewriting/engraving program and copy in a piece of music that is in the public domain (such as a composition by Mozart), you would gain a 25-year copyright on your "typographical arrangement" in the UK, and your permission would be needed for users in the UK to copy your score. However, your copyright would not extend to the creative work of Mozart contained within your score, and anyone who owned a copy of your score could perform from it without needing your permission (since the performance would be of Mozart's work, not yours). What elements are actually protectable within editions may vary from country to country, but the copyright status of an edition cannot affect the public domain status of the underlying work itself. For this reason, a performance made from a copyrightable edition of a public domain work is not subject to the copyright of the edition as long as the performance is of the public domain work.'''
