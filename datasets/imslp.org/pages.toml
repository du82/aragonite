["https://imslp.org/wiki/IMSLP:Public_Domain"]
title = "Public domain - IMSLP"
full_description = "A work that is in the public domain is not protected by copyright and can be freely used for any purpose. Which works are in the public domain varies from country to country. This page explains (in general terms) which items are in the public domain in certain countries. Please note that this informational guide does not cover the full complexities of copyright law and is not guaranteed to be accurate or up to date. This guide deals mostly with copyright in Canada, the United States and European Union countries, which are the laws relevant for most uploads made to IMSLP, both due to the presence of servers and mirrors in Canada, the US and EU countries, as well as the fact that many items uploaded to IMSLP were first published in these countries. This page may not contain information specific to your country. Special rules usually apply to sound recordings. Please consult the section on sound recordings for further information. Please note that while the use of copyrighted works may sometimes be allowed under fair use or fair dealing provisions, this guide does not cover that topic. IMSLP's main servers are located in Canada. An item may be uploaded to the main IMSLP servers if it is in the public domain in Canada — or if appropriate permission is given by the copyright holder(s), a topic which is not addressed on this page (see the licensing policy and guidelines). Items which are in the public domain in the United States but not Canada may be uploaded to Petrucci Music Library US (PML-US). For information on how to make an upload to PML-US, please see PML-US upload instructions. IMSLP voluntarily applies a rule that critical, scientific or urtext editions of public domain works may be uploaded to IMSLP only if 25 years have passed since their publication or if they are in the public domain in Germany. (With such editions, it is important to remove any prefaces, etc., which qualify for independent copyrights, as well as some additions — such as fingerings — which may originate with the editor — see the section on new editions of public domain works below.)"
