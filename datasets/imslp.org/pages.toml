full_description = "Clarification of Editors' Notes in those places where the original print has faded : Les personnes qui ont l'occasion de chanter à l'Eglise sont souvent embarrassées sur le choix et l'ordre des morceaux à exécuter. Voici, à défaut des renseignements que peuvent toujours donner les Maîtres de Chapelle, quelques indications générales sur l'ordre des Saluts, des Messes de Mariage et autres... Le Tantum Ergo ne se chante qu'à la fin du Salut, immédiatement avant la Bénédiction. On peut encore chanter au commencement du Salut à la place du motet du Saint Sacrement... N.B. On peut remplacer ce motet par un fragment des Litanies de la Sainte Vierge... 3° LA PRIERE POUR LE PAPE se chante au chœur en plain-chant... 5° N.B. Dans les messes basses autres que les messes de mariage où l'on chante pendant l'office, les morceaux sont les mêmes, sauf le VENI CREATOR qui est inutile et qu'on peut remplacer par un KYRIE - Les litanies de la Sainte Vierge se chantent généralement pendant la procession qui a lieu les jours de fête de la Sainte Vierge. Content is available under the Creative Commons Attribution-ShareAlike 4.0 License • Page visited 8,384 times • Powered by MediaWiki • Switch back to classic skin"
