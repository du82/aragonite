["https://imslp.org/wiki/IMSLP:File_formats"]
title = "IMSLP:File formats - IMSLP"
full_description = "On this page you can find some information on the file formats used in IMSLP. If you want to download the PDF file of the score you're currently looking for, you clicked the wrong link. Please go back and click on the score description to retrieve the PDF. These are the only file formats IMSLP accepts for scores. Raw image files, whether loose or ZIPped, will be removed. Braille Ready Format (BRF) is a plain text-based file format used for transmitting files with Braille characters. BRF files can primarily be embossed on paper using a braille embosser or read through a refreshable braille display. Other uses include converting the files into audio using a text-to-speech (TTS) application or into visual content in a text editor for reading by a sighted person. Braille scores in BRF files can thus be viewed using the following methods: Braille scores available on IMSLP should follow the guidelines of the New International Manual of Braille Music Notation (1996), published by the Braille Music Subcommittee of the World Blind Union. All relevant information about the method of transcription and the correct layout of the scores is presented next to each file. Portable Document Format (PDF) is the main type of document used here on IMSLP for music scores. To view PDF files, download one of the recommended clients: For Ubuntu users who browse the web with Firefox, click here to install Mozplugger. Mozplugger embeds the Evince PDF Reader (among other things) inside Firefox. Evince is installed by default, but you can make sure by clicking here. For Mac (OS X) users, creating PDF files is possible without additional software. A tutorial can be found here. Note: On rare occasions, MacOS users may find that Preview is not compatible with a PDF. In this case, try another program. Compressed MusicXML (MXL) is an open-specification music typeset format developed by MakeMusic, Inc. that is supported by a number of music notation softwares, including MuseScore, Finale and Sibelius. Because different notation software may render MusicXML slightly differently, the official rendering standard on IMSLP is the open-source MuseScore notation software."
