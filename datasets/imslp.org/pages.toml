["http://imslp.org/wiki/Ana_Sayfa"]
title = "Ana Sayfa - IMSLP"
full_description = '''Hoş geldiniz! IMSLP, bir kamu malı beste kütüphanesidir. Sitemiz 16 Şubat 2006'dan beri yayındadır · 241,471 çalışma · 794,329 beste besteci adına göre · bestecinin yaşadığı zamana göre · çalışmanın tarzına göre · çalışmanın yapıldığı zamana göre Català · Dansk · Deutsch · Ελληνικά · English · Español · Français · Hrvatski · Italiano · 日本語 · 한국어/조선말Македонски · Nederlands · Polski · Português · Русский · Suomi · Slovenčina · Svenska · 中文 · 繁體中文 Uluslararası Müzik Notaları Kütüphanesi Projesi"ne hoş geldiniz! IMSLP'nin amacı bütün kamu malı müzik notalarını, ve bestelerini ücretsiz olarak dünyayla paylaşmak isteyen bütün bestekârların çalışmalarını içeren bir kütüphane oluşturmaktır. IMSLP'nin hedeflerini burdan okuyabilirsiniz. Aynı zamanda IMSLP, müzikle alakalı düşünce paylaşımını ve yayınlanan besteler hakkında analizler yapılmasını da destekler. Bu sebepten istediğiniz gibi sayfa oluşturabilir, veya sayfalara kendi analizleriniz ekleyebilirsiniz. (bunun için lütfen değiştirmek istediğiniz saydadaki "Tartışma" bağlantısını kullanın.) IMSLP'nin yardımınıza ihtiyacı var! Müzik kültürünüzü diğer kullanıcılarlapaylaşarak bu vikinin gelişmesine yardımcı olabilirsiniz. Eğer raflarınızda eski müzik notları varsa, veya bilgisayarınızın sabit diskinde kamu malı müzik notaları varsa, onları IMSLP'ye yüklemeyi deneyebilirsiniz. Katkı Portalı'nı ve Beste kaydetme rehberi'ni ziyaret ederek nasıl katkıda bulunabileceğinizin ayrıntılarını öğrenebilirsiniz. Bununla birlikte IMSLP ve genel olarak müzikle alakalı fikir alışverişinde bulunmak için IMSLP forumları'nı kullanabilirsiniz. Projeler: Beste kaydetmeye ek olarak, bazen IMSLP bu sitenin belli bir tamamlık kazanması için özel projeler organize eder. Şu an, IMSLP'nin ana projelerinden biri Bach-Gesellschaft Ausgabe'nin düzenlenmesi ve yüklemesi. (tam çalışmalar).'''
