["https://imslp.org/wiki/Editions_Russes_de_Musique"]
title = "Editions Russes de Musique - IMSLP"
full_description = "Founded by Serge Koussevitzky and his wife Natalia in 1909 for the purpose of promoting new Russian music. Any losses were absorbed by the owners, and profits were distributed to the composers represented by the firm. The company was established first in Berlin, with branch offices in Leipzig, Moscow, St. Petersburg, Paris, London and New YorkThe selection of works to be included in the catalogue was the responsibility of a committee made up of Scriabin, Rachmaninoff, Medtner, Ossovsky, Struve and Koussevitzky, who decided by majority vote. The committee's rejection of Stravinsky's ballet Petrushka in 1911 precipitated a crisis in which Koussevitzky threatened to withdraw, resulting in a reversal of the decision. Koussevitzky resolved any future conflicts of this nature by purchasing the Gutheil catalog in 1914, which operated under his personal control as an autonomous imprint of the company. Notable composers represented by Edition Russe or Gutheil besides those mentioned above include Arensky, Balakirev, Berezovsky, Catoire, Vernon Duke, Grechaninov, Konyus, Lopatnikov, Nabokov, Prokofiev, Siloti and Taneyev. The Russian branch offices were taken over by Muzgiz after the revolution, and the headquarters moved to Paris in 1920. The firm was sold to Boosey & Hawkes on March 1, 1947. Content is available under the Creative Commons Attribution-ShareAlike 4.0 License • Page visited 36,328 times • Powered by MediaWiki • Switch back to classic skin"
