["https://imslp.org/wiki/%E3%83%91%E3%83%96%E3%83%AA%E3%83%83%E3%82%AF%E3%83%89%E3%83%A1%E3%82%A4%E3%83%B3"]
title = "パブリックドメイン - IMSLP"
full_description = "IMSLPの主たるサーバーが2つとも物理的にカナダ国内(ひとつはモントリオールで、もうひとつはトロント)におかれているために、IMSLPはカナダの著作権法を遵守しています。この法律は、他の国の著作権法とは違っています。カナダの著作権法をとても簡単にまとめると、著作権の保護期間を作家や作曲家(などそれらすべて)の死後50年とすることを貫いているということです。 WTOまたはベルヌ条約の加盟国で最初に公表された作品のみが、カナダでは著作権の対象となります。しかし、すでに作品が元の国(すなわち、最初の公表が行われた国)でパブリックドメインとなっている場合を除き、どちらかの条約に署名していればほとんどのケースでは遡及的にこれが適用されます。 いくつかの作品が米国でパブリックドメインであってカナダや他の国ではまだパブリックドメインでありません。これは、米国法が、1978年より前に公表された作品について、最初の公表の日から起算しているためです。1923年より前に公表された作品なら(1923年より前の米国著作権法参照)、または米国内で1923年から1963年に公表されて1963年の法改正を受けていない作品なら1923年から1963年の米国著作権法参照)、ほぼ確実に米国ではパブリックドメインです。IMSLPは現時点で米国内にサーバーを持っていませんので、ストラヴィンスキーの「春の祭典」のドーヴァー版(リプリント版)のような米国内に限ってパブリックドメインである楽譜は、現時点で投稿できません。 特定の楽譜の全体の著作権の長さ(すなわちパブリックドメインになる前の長さ)は、関係する三者(作曲者、出版者、もしあれば編集者)に与えられた期間のうち最も長いものに等しいということに気をつけてください。例えば、1985年にヘンレーから出版されたベートーヴェンのソナタの新訂版は、著作権が設定されています。(その作品がまだパブリックドメインとならない編集者によって編集されていており、加えてこの最初の版組に著作権が設定されていて、原典版にかかる25年のドイツの期間がまだ有効です。)一方で、1995年のドーヴァー版は古い版の再出版にすぎませんから、パブリックドメインです(ドーヴァーのスタッフが付け加えたタイトルのページとカバーを除いて。最初の版組がパブリックドメインなのでここには編集者の著作権が設定されていません。パブリックドメインの版組を再出版しても著作権は設定されません)。著作権表示は、通常、楽譜の最初のページの下部に書かれています。"
