title = "IMSLP:Privacy policy - IMSLP"
full_description = '''The following discloses the information gathering and dissemination practices for IMSLP/Petrucci Music Library's (hereinafter "IMSLP") website (the "Site"). We reserve the right to modify the information contained herein at anytime without prior notice. If we do make changes to our privacy policies, we will modify this page accordingly. Check this page periodically for amendments. This site and all information and materials on it are provided to you "AS IS" without warranty of any kind. YOUR USE OF THE SITE, OR YOUR PROVISION TO US OF ANY PERSONAL INFORMATION CONSTITUTES YOUR AGREEMENT TO THESE TERMS AND ANY SUBSEQUENT CHANGES TO THESE TERMS; DO NOT USE THE SITE OR PROVIDE INFORMATION IF YOU DO NOT AGREE WITH ALL OF THE TERMS. As with many websites, we collect certain information, even when you are not logged in. When you browse, read, or download information from the Site, data is collected by IMSLP, including but not limited to your IP address, URL request, browser type, and date and time of your request. The data are analyzed in various ways. We collect this information on an aggregate basis only. For example, we track which pages are most popular among visitors as a whole. We do not track information on which pages an individual user visits. We do not collect any other information without your knowledge and permission. We use this information to improve the usefulness of the site to our visitors. Unless you affirmatively provide additional information to us (including signing the Licensing page during an upload), we do not collect or store personally identifiable information such as name, mailing address, email address, phone number, or social security number. IMSLP requests personally identifiable information when you register for an account. Information may be used or requested to perform research, improve usability of the site, administer mailing lists or online communities, or other activities related to IMSLP services. This information may include, but is not limited to, personal names, e-mail addresses, location, and occupation.'''
