["https://imslp.org/wiki/Domaine_public"]
title = "Domaine public - IMSLP"
full_description = '''Remarque préliminaire : Pour les détails sur le vocabulaire, voir IMSLP:Internationalization/Français#Vocabulaire. Les deux serveurs principaux de l'IMSLP étant physiquement localisés au Canada (l'un à Montréal et l'autre à Toronto), IMSLP applique les lois canadiennes en matière de copyright. Celles-ci peuvent différer de celles en vigueur dans votre propre pays. La façon la plus synthétique de résumer le principe du copyright canadien est la suivante : le droit d'auteur perdure pendant une période de 50 ans suivant la mort du compositeur/compositrice ou de l'éditeur/éditrice (s'il/elle existe). Il n'existe pas de copyright sur la publication elle-même. Ainsi, la réimpression ou la nouvelle gravure d'une édition tombée dans le domaine public est elle-même dans le domaine public si elle n'a pas fait l'objet d'un travail d'édition original. Dans le cas d'un travail d'édition significatif et anonyme, la loi Canadienne prévoit que le copyright persiste pendant 50 ans après la date de publication et si l'éditeur devient publiquement connu, on revient à la règle des 50 ans après le décès de l'éditeur. Cependant, de part sa nature incertaine, l'utilisation de cette clause est déconseillée. C'est donc la date du décès qui prime au Canada. La date de publication peut avoir aussi une importance déterminante pour décider la nature domaine public ou non d'une édition aux États-Unis (voir Œuvres publiées avant 1923). Pour qu'une édition puisse prétendre à se voir appliquer la règle "décès + 50 ans" (ou en fait toute protection par copyright), le travail d'édition doit être significatif. Voici par exemple une liste non-exhaustive de travaux d'édition à caractère significatif ou non : Les travaux d'édition non significatifs ne sont pas éligibles à une protection par copyright. Les travaux d'édition significatifs le sont. Il existe toutefois une exception répandue dans de nombreux pays concernant les éditions académiques (ou encore "scientifiques"). Cette catégorie comprend les éditions dites critiques (par exemple Bärenreiter) et les éditions "urtext". Veuillez vous reporter au paragraphe Exceptions pour plus de détails à ce sujet.'''
