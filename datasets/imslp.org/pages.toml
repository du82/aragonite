["https://imslp.org/wiki/%CE%94%CE%B7%CE%BC%CF%8C%CF%83%CE%B9%CE%BF%CF%82_%CE%A4%CE%BF%CE%BC%CE%AD%CE%B1%CF%82"]
title = "Δημόσιος Τομέας - IMSLP"
full_description = "Επειδή δύο βασικοί διακομιστές (servers) του IMSLP βρίσκονται στον Καναδά (ένας στο Μόντρεαλ και ο άλλος στο Τορόντο), το IMSLP ακολουθεί Καναδέζικους Νόμους περι Πνευματικής Ιδιοκτησίας, οι οποίοι μπορεί να διαφέρουν από την δική σας χώρα. Η συντομότερη περίληψη του Καναδέζικου νόμου περι πνευματικών δικαιωμάτων θα ήταν ότι τα πνευματικά δικαιώματα ισχύουν για τον συνθέτη ή επιμελητή μέχρι και 50 χρόνια μετά τον θάνατό του/της. Για τον εκδότη/εκδοτικό οίκο, τα πνευματικά δικαιώματα ισχύουν μέχρι οποιοσδήποτε όρος από τους παρακάτω λήξει πρώτος: Μόνον έργα τα οποία έχουν εκδοθεί σε χώρες που είναι μέλη της WTO ή της Σύμβασης Berne είναι αντικείμενα κάτω από τον νόμο περι πνευματικών δικαιωμάτων στον Καναδά; παρ'όλ'αυτά, στις περισσότερες περιπτώσεις αυτό εφαρμόζεται αναδρομικά, εκτός και αν το έργο ήταν ήδη στον δημόσιο τομέα στην μητρική του χώρα (δηλαδή την χώρα στην οποία έγινε η πρώτη έκδοση) όταν μία από τις δύο συνθήκες είχε υπογραφεί. Μερικά έργα είναι στον δημόσιο τομέα στις ΗΠΑ, αλλά οχι ακόμα στον δημόσιο τομέα του Καναδά και άλλων χωρών. Ο λόγος γι'αυτό είναι ότι ο νόμος των ΗΠΑ υπολογίζει όρους από την ημερομηνία της πρώτης έκδοσης για όλα τα έργα που εκδόθηκαν πρίν το 1978. Άν ένα έργο εκδόθηκε πρίν το 1923 (βλ. Νόμος περι πνευματικών δικαιωμάτων των ΗΠΑ για πρίν το 1923), ή εκδόθηκε για πρώτη φορά στις ΗΠΑ μεταξύ του 1923 και του 1963 χωρίς ανανέωση των πνευματικών δικαιωμάτων (βλ. Νόμος περι πνευματικών δικαιωμάτων των ΗΠΑ για μεταξύ 1923-1963), ανήκει σχεδόν σίγουρα στον δημόσιο τομέα στις ΗΠΑ. Αυτά τα αρχεία τοποθετούνται στον διακομιστή (server) του IMSLP που βρίσκεται στις ΗΠΑ."
