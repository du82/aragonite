["https://imslp.org/wiki/IMSLP:About"]
title = "IMSLP:About - IMSLP"
full_description = "IMSLP, also known as the International Music Score Library Project or Petrucci Music Library, was started in 2006. The logo on the main page is a capital letter A. It was taken from the beginning of the very first printed book of music, the Harmonice Musices Odhecaton. It was published in Venice in 1501 by Ottaviano Petrucci, the library's namesake. The IMSLP/Petrucci Music Library is currently owned and run by Project Petrucci LLC, a company created with the sole purpose of managing this site. IMSLP welcomes submissions of both public domain materials as well as copyrighted materials with proper permission according to our licensing policy. Note: E-mail is preferred unless there is a specific reason for physical contact. Other methods of contacting staff members can be found here. IMSLP currently has 241,449 works, 794,169 scores, 88,578 recordings, 28,615 composers, and 2,046 performers. Content is available under the Creative Commons Attribution-ShareAlike 4.0 License • Page visited 345,476 times • Powered by MediaWiki • Switch back to classic skin"
