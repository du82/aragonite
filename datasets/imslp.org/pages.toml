["https://imslp.org/wiki/Hansen"]
title = "Hansen - IMSLP"
full_description = '''Hansen of Copenhagen, Denmark has been the major publisher of Scandinavian music. Founded in 1853 by Jens Wilhelm Hansen. Hansen's two sons Jonas (1850-1919) and Alfred (1854-1923) joined the firm in 1874, the year before acquisition of the Copenhagen publisher C. E. Horneman. The period 1875-1914 saw vigorous growth: works by Danish composers like Niels Gade and J. P. E. Hartmann and the Norwegian Christian Sinding were added in this period, and there were several acquisitions: C.C. Lose (1872), Horneman & Erslev (1875), Carl Warmuth (Oslo, 1908) and Nordisk (1910). Notable Scandinavian composers added in the 20th century include Jean Sibelius, Carl Nielsen, Emil Hartmann, Wilhelm Stenhammar, and Selim Palmgren. Hansen opened branches in Leipzig (1887-1940), New York (ca.1974) and subsidiaries included Norsk (Oslo, from 1908), Nordiska (Stockholm, from 1915), Wilhelmiana (Frankfurt, from 1951), and J. & W. Chester (London, from 1957). The Hansen group was absorbed by Music Sales in late 1980s, then in 2018 Music Sales sold its printed music division to Hal Leonard. As with many publishers, Hansen more often provided scores with edition numbers than with plates in the 20th century (or at least both: so Henk Badings' 4th piano sonata has plate 26533 and is "Wilhelm Hansen edition, nr. 3816", the latter bit of information more often provided- in library catalogs anyway? - than the former...) Imprints use other plates (Nordiska Musikforlaget kept N M S even after purchase by Hansen, for example.) Content is available under the Creative Commons Attribution-ShareAlike 4.0 License • Page visited 37,265 times • Powered by MediaWiki • Switch back to classic skin'''
