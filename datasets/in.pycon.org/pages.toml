["https://in.pycon.org/2025/coc"]
title = "Code Of Conduct | 12th - 15th September"
description = "Code Of Conduct"
full_description = "Code Of ConductThe Short FormWe invite you to come to PyCon India 2025 in a spirit of curiosity, friendliness, open-mindedness, and respect. We will not tolerate harassment in any form.At the PyCon India venue and related online forums, you agree to:Be kind and sensitive to the people around you and respect the boundaries of other attendees.Attempt to resolve differences of opinion peacefully.Avoid harassment, exclusionary or offensive behaviour of any kind. This includes but is not limited to offensive verbal comments related to gender, sexual orientation, disability, physical appearance, body size, race, religion, sexual images in public spaces, deliberate intimidation, stalking, following, harassing photography or recording, sustained disruption of talks or other events, inappropriate physical contact, and unwelcome sexual attention.Violations can be reported online by sending a mail to coc@in.pycon.org, or to PyCon India volunteers at the venue.If a participant engages in behaviour that violates this Code of Conduct, the Code of Conduct team may take any action they deem appropriate, including warning the offender or expulsion from the community and community events with no refund of event tickets. Please read on for a more detailed version of the Code of Conduct below.The Long FormAimPyCon India is a community organised conference intended for advocating the use and adoption of the Python programming language in India. It is also a platform for fostering networking and collaboration among the Python developer community in India.We believe in the broad spectrum of individual and collective experience and in the inherent dignity of all people. We believe that amazing things happen when people from different worlds and world-views approach each other to create a conversation.PyCon India 2025 welcomes everyone and is dedicated to providing a harassment-free conference experience for everyone, regardless of age, gender, sexual orientation, physical appearance, disability, neurotype, race, religion, political opinion, culture or employment. We don’t tolerate harassment of attendees in any form.WhereThis Code of Conduct applies to the venue of PyCon India 2025 Conference, pre-event & post-event informal gatherings, related online forums and all conference related events organised by PyCon India.WhoThis is applicable to speakers, participants, sponsors, volunteers and organisers.Be The Best You Can BeBe kind, sensitive, understanding and respectful to other attendees.Listen with empathy when someone has a different perspective.Talk to the volunteers if you see something inappropriate or feel something is wrong.All communication should be appropriate for a professional audience, including people from many different backgrounds.Do not insult or put down attendees or engage in any action that violates the open, welcoming and sharing spirit of the conference.Please Refrain FromOffensive verbal comments related to gender, sexual orientation, disability, physical appearance, body size, race, religion.Violent threats or language directed against another person.Swearing, insults or discriminatory/exclusionary/offensive jokes or language.Deliberate intimidation, stalking, following, harassing photography or recording.Sustained disruption of talks or other events.Using sexually explicit or violent material in presentations. Sexual language or imagery is inappropriate for all aspects of the conference, including talks and exhibits.Unwelcome sexual attention or inappropriate physical contact.Advocating for, or encouraging, any of the above behaviour.Repeated harassment of others. In general, if someone asks you to stop, then stop.Wearing sexualized clothing, uniforms, or costumes, or creating a sexualized environment.Demeaning others or failing to maintain a polite and respectful tone when interacting with attendees.We have zero tolerance on harassment of conference participants in any form, including, but not limited to the activities mentioned here.Participants asked to stop any harassing behaviour are expected to comply immediately.ReportingIf you are being harassed or notice that someone else is being harassed, or have any other concerns, please reach out to us at coc@in.pycon.org before, during or after the conference.Feel free to contact a conference volunteer to find the Code of Conduct committee or directly reach out to the Code of Conduct committee and they will take your report and do the needful action. Volunteers will be wearing Volunteer badges and CoC committee will be wearing a special colour shirt to be able to easily identify them. Please be assured that any report/incident you shared with us will be highly confidential and will not leave outside the bounds of CoC committee members.Contact any of the following committee members. The Helpdesk can assist you in finding them at the venueFor more information on how to report incidents and what to include in your report, please visit our Reporting Guide. It provides clear instructions on the reporting process and the steps we take to address reported incidents.We take every report seriously and are committed to creating a safe and welcoming environment for all attendees. Your cooperation helps us ensure a positive experience for everyone at PyCon India. Thank you for being proactive in maintaining the integrity of our community.LicenseThis Code of Conduct is derived fromThe Django Code of Conduct by the Django Software Foundation which is under a Creative Commons Attribution 3.0 Unported LicenseThe PSF Code of Conduct by Python Software Foundation which is under a Creative Commons Attribution 3.0 Unported LicensePyCon India Conference Code of Conduct is licensed under a Creative Commons Attribution 3.0 Unported License."
