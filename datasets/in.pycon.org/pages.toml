["https://in.pycon.org/2025/cfp"]
title = "Call For Proposals | 12th - 15th September"
description = "Call For Proposals"
full_description = "Call For ProposalsJoin us for the 16th edition of PyCon India, the premier Python conference in India, scheduled for September 12-15, 2025, in Bengaluru. Whether you use Python professionally, as a hobby, or are simply passionate about Python and its community, we’d love to hear from you and invite you to submit proposals for Talks and Workshops.Important DatesSubmission Open: 20 February 2025Submission Deadline: 18 May 2025Schedule Announcement: 7 July 2025Workshops: 12 September 2025Talk Presentations: 13-14 September 2025DevSprint: 15 September 2025 (Details to follow)VenuesWorkshops: To be announcedTalk Presentations: NIMHANS Convention Centre, BengaluruDevSprint: To be announcedSubmit Your ProposalSubmit your proposal for a Talk or Workshop at PyCon India 2025.We welcome speakers from diverse backgrounds to share their knowledge and insights.Choose a category – Talk (30 min) or Workshop (3 hours).Review the submission guidelines before submitting your proposal.For any questions regarding the CFP process, please email cfp@in.pycon.orgSubmit a ProposalSession TypesTalks• Technical Talks are 30-minute sessions (25 min talk + 5 min Q&A)• Cover any Python-related topic and share valuable insights• Share real-world experiences, new ideas, and best practices in Python• Discuss challenges, solutions, and contributions to the Python ecosystem• Provide practical knowledge, innovative approaches, or industry trends• Refer to the submission categories for more detailsWorkshops• Workshops are 3-hour hands-on sessions for interactive learning• Focus on practical implementation and guide participants through real-world applications• Include live coding, exercises, and problem-solving to enhance learning• Cover tools, frameworks, best practices, or advanced techniques in Python• Encourage collaboration, experimentation, and active participation• Refer to the submission categories for more detailsCategoriesPython Core & Performance• Fundamental Python concepts like language runtime, AST, standard library, new features, documentation, and concurrency primitives like multithreading• Deep dive into Python internals, GIL optimization, and memory management• Performance improvements using Cython, PyPy, JIT compilers, and async programmingAI, ML & Data Science• Generative AI, LLMs, multimodal AI, and reinforcement learning.• ETL, Real-time analytics, and business intelligence.• Applications of AI in automation, NLP, and computer vision.Python for Cloud, DevOps & Infrastructure• Cloud native applications with AWS, GCP, and Azure.• Kubernetes, Terraform, and Infrastructure as Code (IaC).• CI/CD automation, serverless computing, and Python in platform engineering.Web, Desktop & Full-Stack Development• Building APIs & web applications using gRPC, FastAPI, Django, and Flask, etc.• Desktop App Development – GUI frameworks like PyQt, Tkinter, and Kivy for cross-platform apps.Python for Hardware, Edge Computing & IoT• MicroPython, CircuitPython, and real-time embedded systems• Robotics, automation, and IoT applications with Raspberry Pi, ESP32, etc.• Optimizing Python for low-power hardwarePython in Research & Education• High-performance computing in physics, chemistry, and climate modeling• Python in medical research: drug discovery, medical imaging, and bioinformatics• Educational ApplicationsCommunity• Cultural Aspects & Societal Influence – Exploring how Python impacts diversity, health, education, productivity, and workspaces• Ethical Considerations in Technology – Examining government policies, responsible AI, privacy concerns, and mitigating biases in tech• Career Growth, Mentorship & Developer Well-Being – Work-life balance, mental health in tech, productivity strategies, mentorship, career growth, and leadership development• Building and maintaining Python user groups and meetupsOthers• Emerging Tech – Quantum computing, blockchain, and Python in metaverse applications• Python’s role in sustainability & green computing – Energy-efficient programming• Python in FinTech & Algorithmic Trading – DeFi, automated trading, and risk analysis• Developer Tools – Enhancing productivity with Python-based IDEs, debugging tools, automation frameworks, and package management solutions• And everything else not explicitly covered in the other categoriesSubmission GuidelinesOriginality: Proposals must be original and not previously presented at PyCon India.Diversity: We encourage submissions from individuals of all backgrounds, including those from underrepresented groups in technology.Multiple Submissions: Speakers may submit multiple proposals; however, each proposal should be distinct.Language: All proposals must be submitted in English.Reference: Review the proposals from last year for inspiration and guidance.Review ProcessInitial Screening: Proposals will be reviewed for completeness and adherence to guidelines.Internal Review: A panel of experts will evaluate proposals based on relevance, clarity, and impact.External Review: Selected proposals will undergo further evaluation by external reviewers.Final Selection: Shortlisted speakers will be invited for rehearsal sessions before finalizing the schedule.RehearsalsShortlisted speakers are expected to participate in rehearsal sessions via teleconferencing. This process ensures that talks are well-prepared and fit within the allotted time.Code of ConductAll participants must adhere to the PyCon India Code of Conduct, ensuring a welcoming and inclusive environment for everyone."
