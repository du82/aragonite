["https://inaturalist.org/journal/gordonfletch0806/107235-field-journal-3"]
title = """
Field Journal 3
 ·  iNaturalist"""
description = "March 1, 2025 Start Time: 11:50 AM End Time: 1:30 PM Location: Centennial Woods Habitats: Forest and Meadow Weather: 40 Degrees, feels like 32 Degrees, cloudy with patches of freezing rain Today, I expected to see a wealth of birds since it was my first time visiting Centennial Woods. However, I think the small bit of freezing rain, especially at the beginning of my walk, caused a lot of birds to go into their hiding holes and I mostly heard calls rather than saw actual birds. As we walked, we constantly heard the introductory notes to calls of Black-capped Chickadees. They seemed as though they were calling back and forth to each other and not quite flocking together but following when one left a tree. I also heard a mourning dove, American Crows, Canada Geese, some type of gull, and Blue Jays. I heard a call I didn't recognize and hadn't ever heard before as well- it was 3-4 short and clear introductory notes, a buzz, and then 3 iterations of alternating clear notes and buzzing. T..."
full_description = "March 1, 2025 Start Time: 11:50 AM End Time: 1:30 PM Location: Centennial Woods Habitats: Forest and Meadow Weather: 40 Degrees, feels like 32 Degrees, cloudy with patches of freezing rain Today, I expected to see a wealth of birds since it was my first time visiting Centennial Woods. However, I think the small bit of freezing rain, especially at the beginning of my walk, caused a lot of birds to go into their hiding holes and I mostly heard calls rather than saw actual birds. As we walked, we constantly heard the introductory notes to calls of Black-capped Chickadees. They seemed as though they were calling back and forth to each other and not quite flocking together but following when one left a tree. I also heard a mourning dove, American Crows, Canada Geese, some type of gull, and Blue Jays. I heard a call I didn't recognize and hadn't ever heard before as well- it was 3-4 short and clear introductory notes, a buzz, and then 3 iterations of alternating clear notes and buzzing. This call was coming from tall conifer trees, as were a lot of small songbird calls. When we reached a meadow, I did see some Black-capped Chickadees sitting in low trees and shrubs, preening themselves. Some of them hopped along the snow-covered ground, probably foraging with their all-purpose beaks. They were much more skittish than other Black-capped Chickadees I had seen before and I wondered why- perhaps their circadian rhythms require them to be more alert during the winter when survival is already hard enough. When I walked onto the beaver dam bridge in Centennial, I performed the 'spish', and the calls stopped for about 5 minutes. It didn't attract any birds to my knowledge, but I did think the alerting was interesting. In this clearing, I also saw a female Northern Cardinal- I say female and not male in the middle of molting because it is way too early for molting season for Northern Cardinals. It would not be advantageous for these birds to molt in this weather. This is an example of a circannual rhythm- the Northern Cardinal will molt around August-September (although notably not into a duller winter plumage0, nest as early as February, and do not migrate. She was shorter and stockier than other cardinals I had seen, but it could've been the distance. She was buff-colored with textbook red points and a conical bill for cracking seeds. Compared to the Black-capped Chickadees around her, she was markedly different. The Black-capped Chickadees do not exhibit sexual dimorphism like Northern Cardinals. They smaller birds had grey backs, buff-colored chests, white cheeks, black caps and bibs, and a short, all-purpose beak. These birds use their small bodies to nest in the numerous cavities I saw on my walk, whereas the Northern Cardinals are open nesters. In this clearing, I attempted to perform Black-capped Chickadee calls and songs as well as Northern Cardinal songs; though I did not notice a change in behavior. As I walked out of the woods, I saw a murder of American Crows flying ahead, hearing their caw-caws. I also heard screaming caws that sounded markedly different than American Crows. I saw a bird perched on the top of a barren tree that had a long tail, long beak, crest on the top of the head, and grey feathers. I hypothesized that this could be a Blue Jay, out of the sun and therefore not showing off it's structural colors. I looked up variations of Blue Jay calls and identified the screaming caw as a Blue Jay! This was really rewarding because I had been hearing it the whole walk! Posted on March 1, 2025 07:19 PM by gordonfletch0806"
author = "gordonfletch0806"
year_published = 2025
