["https://inaturalist.org/journal/cosmiccat/107237-spring-plans-enid-oklahoma"]
title = """
Spring Plans:  Enid, Oklahoma
 ·  iNaturalist"""
description = "For my vacation this year, I am going to Enid, Oklahoma, in May, mostly to visit the crystal mine in Salt Plains National Wildlife Refuge. https://www.fws.gov/refuge/salt-plains There are a few state parks near Enid such as Alabaster Caverns. https://www.travelok.com/state-parks/alabaster-caverns-state-park While planning my spring trip to Oklahoma, I looked up mushrooming foraging laws. Unfortunately, you can't pick them without a permit. However, a new bill has been introduced into the state legislature that would allow the collection of fungi and edible plants from public lands. There will be a hearing on the bill Monday, March 3rd. If you live in Oklahoma, please contact your representatives to voice your support! Info: https://www.oklahomafungi.com/blog/oklahoma-bill-could-allow-mushroom-foraging-on-public-land As for mushroom laws, I've been trying to find info on the legality of mushroom picking in Louisiana. The only thing I could find was the state's hunting/fishing guide t..."
full_description = "For my vacation this year, I am going to Enid, Oklahoma, in May, mostly to visit the crystal mine in Salt Plains National Wildlife Refuge. https://www.fws.gov/refuge/salt-plains There are a few state parks near Enid such as Alabaster Caverns. https://www.travelok.com/state-parks/alabaster-caverns-state-park While planning my spring trip to Oklahoma, I looked up mushrooming foraging laws. Unfortunately, you can't pick them without a permit. However, a new bill has been introduced into the state legislature that would allow the collection of fungi and edible plants from public lands. There will be a hearing on the bill Monday, March 3rd. If you live in Oklahoma, please contact your representatives to voice your support! Info: https://www.oklahomafungi.com/blog/oklahoma-bill-could-allow-mushroom-foraging-on-public-land As for mushroom laws, I've been trying to find info on the legality of mushroom picking in Louisiana. The only thing I could find was the state's hunting/fishing guide that states you may pick mushrooms in the WMAs without a permit, as long as you limit yourself to no more than five gallons per day. Posted on March 2, 2025 12:37 AM by cosmiccat"
