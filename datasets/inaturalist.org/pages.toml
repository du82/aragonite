["https://inaturalist.org/journal/milewski/107217-non-convergence-of-legumes-fabaceae-under-arid-climates-with-winter-rainfall-in-north-america-and-southern-africa-part-2"]
title = """
Non-convergence of legumes (Fabaceae) under arid climates with winter rainfall in North America and southern Africa, part 2
 ·  iNaturalist"""
description = "...continued from https://www.inaturalist.org/journal/milewski/107143-non-convergence-of-legumes-fabaceae-under-arid-climates-with-winter-rainfall-in-north-america-and-southern-africa-part-1# ADAPTIVE FEATURES On both continents, the vegetation along drainage lines tends to be dominated by stipular-spinescent, large shrubs/small trees of mimosoid legumes with bipinnately compound leaves. In North America, several spp. of 'Prosopis' are involved, whereas in southern Africa the sole species in this topographic situation is Vachellia karroo (https://www.inaturalist.org/observations/248296260). Another large-scale difference is that plants are generally shorter in karoo vegetation (https://www.inaturalist.org/observations/10877319) than under similar rainfall in North America. Beginning our examination with Caesalpiniodeae: Senna is indigenous to the North American study area. This genus is absent from the southern African study area, despite being indigenous elsewhere on the subcontine..."
full_description = "...continued from https://www.inaturalist.org/journal/milewski/107143-non-convergence-of-legumes-fabaceae-under-arid-climates-with-winter-rainfall-in-north-america-and-southern-africa-part-1# ADAPTIVE FEATURES On both continents, the vegetation along drainage lines tends to be dominated by stipular-spinescent, large shrubs/small trees of mimosoid legumes with bipinnately compound leaves. In North America, several spp. of 'Prosopis' are involved, whereas in southern Africa the sole species in this topographic situation is Vachellia karroo (https://www.inaturalist.org/observations/248296260). Another large-scale difference is that plants are generally shorter in karoo vegetation (https://www.inaturalist.org/observations/10877319) than under similar rainfall in North America. Beginning our examination with Caesalpiniodeae: Senna is indigenous to the North American study area. This genus is absent from the southern African study area, despite being indigenous elsewhere on the subcontinent. Furthermore, the species in the Mojave Desert is unlike any congener indigenous to South Africa (https://www.inaturalist.org/observations?place_id=6986&subview=map&taxon_id=52348&view=species) in being cauloterminally spinescent and drought-deciduous. Parkinsonia is indigenous to the study areas on both continents. However, the incidence if this genus falls short in southern Africa, in the number of spp. (two coexisting in North America versus only one in southern Africa), and the usual height of the plants (North America https://www.inaturalist.org/observations/260930138 versus southern Africa https://www.inaturalist.org/observations/260930138). Turning from Caesalpinioideae to Faboideae: The two genera and (at most) seven spp. of Faboideae in the North American study area are far fewer than the nine genera and (at least) 26 spp. in the southern African study area. The growth-forms of the faboid legumes differ. Calobota pungens somewhat resembles Psorothamnus (https://www.inaturalist.org/observations?verifiable=true&taxon_id=581639). However, most spp. of Psorothamnus are large plants (https://www.inaturalist.org/observations/257121906 and https://www.inaturalist.org/observations/257672246 and https://www.inaturalist.org/observations/201084866 and https://www.inaturalist.org/observations/218261105 and https://www.inaturalist.org/observations/98158072 and https://www.inaturalist.org/observations/223661714 and https://www.inaturalist.org/observations/213080064 and https://www.inaturalist.org/observations/209343532 and https://www.inaturalist.org/observations/208800172 and https://www.inaturalist.org/observations/182401566 and https://www.inaturalist.org/observations/155248903 and https://www.inaturalist.org/photos/134655639 and https://www.inaturalist.org/observations/262223415 and https://www.inaturalist.org/observations/260560404 and https://www.inaturalist.org/observations/258603726). By comparison, members of the same subfamily in the succulent karoo are small plants. Olneya deserves special mention, although this genus is typical of the Colorado Desert, penetrating the Mojave Desert only slightly. Olneya grows to a tree, >5 meters high, beyond the strict confines of drainage lines (https://www.inaturalist.org/observations/196920843 and https://www.inaturalist.org/observations/196794772 and https://www.inaturalist.org/observations/254346914 and https://www.foothill.watersavingplants.com/eplant.php?plantnum=650&return=d27 and https://www.inaturalist.org/observations/223445163 and https://www.inaturalist.org/observations/213646040), and has wood denser (air-dry specific gravity 1.2) than that of any legume in southern Africa (https://www.inaturalist.org/observations/196709965). The faboid species most resembling Olneya in the study area in southern Africa is Schotia afra. However, the following differences remain. Schotia afra: seems shorter than Olneya (https://www.inaturalist.org/observations/240123104), is non-spinescent, does not fix nitrogen, is ornithophilous in its pollination syndrome (https://en.wikipedia.org/wiki/Ornithophily#:~:text=Ornithophily%20or%20bird%20pollination%20is%20the%20pollination%20of%20flowering%20plants%20by%20birds.), and has fruits and seeds far larger than those of Olneya. The following show the maximum height of most spp. of faboid legumes in the succulent karoo: https://www.inaturalist.org/observations/129291874 and https://www.inaturalist.org/observations/11086209. Among Faboideae, foliage-form differs as follows: Psorothamnus is drought-deciduous, whereas its counterparts in succulent karoo are evergreen. Olneya is evergreen, but is incomparably more arborescent (https://www.inaturalist.org/observations/206274222) than any member of the same subfamily in the southern African study area. With respect to spinescence among faboids in the North American study area: In Psorothamnus, the spinescence is cauloterminal, accompanied by obstructive branching (https://www.inaturalist.org/observations/257074770 and https://www.inaturalist.org/observations/256971773 and https://www.inaturalist.org/observations/246702775 and https://www.inaturalist.org/observations/215297014 and https://www.inaturalist.org/observations/67993032 and https://www.inaturalist.org/observations/261483809 and https://www.inaturalist.org/observations/257680159). In Olneya, the spinescence is stipular (https://www.inaturalist.org/observations/201589384 and https://www.jstor.org/stable/25027850 and https://www.inaturalist.org/observations/207709576 and https://www.inaturalist.org/photos/11115580 and https://www.inaturalist.org/observations/223853127 and https://www.inaturalist.org/observations/257075156 and https://www.inaturalist.org/observations/208642354 and https://www.inaturalist.org/observations/206939533 and https://www.inaturalist.org/observations/202084999 and https://www.inaturalist.org/observations/199121391 and https://www.inaturalist.org/observations/197330604). (Also please see https://www.inaturalist.org/posts/107217-non-convergence-of-legumes-fabaceae-under-arid-climates-with-winter-rainfall-in-north-america-and-southern-africa-part-2#activity_comment_888cfa65-5958-49cf-97f8-5c600ec04a32.) At least six spp. in four genera of faboid legumes in the southern African study area are - at least nominally - spinescent. Their cauloterminal spinescence and the associated obstructive branching are shown in: https://www.inaturalist.org/observations/97522345https://www.inaturalist.org/observations/54046913 However, the difference remains that the stems of cauloterminally spinescent legumes tend to be greenish in North America (https://www.inaturalist.org/observations/252022242), vs non-photosynthetic in southern Africa. Thus, no species in the North American study area resembles the typical legume in the southern African study area, viz. a small-leafed, non-spinescent, evergreen, small shrub. Turning from Faboideae to Mimosoideae: The genera Senegalia and Vachellia are indigenous to both study areas. However, the southern African species of Senegalia is rare in the study area, whereas its North American counterpart is common, and Vachellia, typical of drainage lines in the Karoo, has marginal incidence in the Mojave Desert. Furthermore, the two spp. of Senegalia are surprisingly different. Senegalia greggii has far smaller leaves, and clearer drought-deciduousness, than are seen in S. caffra. The inflorescences and fruits also differ in obvious ways. Calliandra eriophylla somewhat resembles the typical fabaceous shrub in the southern African study area, in being a low shrub, approximately evergreen, non-spinescent, and nitrogen-fixing. However, differences remain. The North American species is rare in the study area, and has bipinnately compound leaves that fold at night (https://en.wikipedia.org/wiki/Nyctinasty). DISCUSSION Overall, the intercontinental differences are in line with those under the adjacent mediterranean climates. California differs from the western parts of South Africa in having greater topographic uplift, and consequently greater rejuvenation of nutrients such as phosphorus. Under dry climates and freedom from regimes of wildfire, shrubs tend to be drought-deciduous and spinescent on relatively nutrient-rich soils, vs evergreen and non-spinescent on nutrient-poor soils. This helps to explain, in this study, some of the intercontinental differences; for example, within the shared genus Senegalia, the southern African species tends to be evergreen (in association with sandstones), and a difference within the southern African study area, in which obvious stipular spinescence (https://www.inaturalist.org/observations/255182322 and https://www.inaturalist.org/observations/251644359 and https://www.inaturalist.org/observations/178857245) occurs on the nutrient-enriched alluvium of drainage lines. A climatic difference is that fog is less frequent in the Mojave Desert than in the southernmost Namib Desert and Little Namaqualand. This form of precipitation mitigates drought, helping to explain why legumes seem less xerophytic in southern Africa than in North America. However, neither nutrient-poverty nor fog explain the differences in the height of the vegetation, described above. The vegetation in California, right across the climatic range, tends to be taller than at similar average rainfall in western southern Africa. This remains true regardless of regimes or wildfire. CONCLUSION Overall, I find remarkably limited evolutionary convergence in this study. There are, of course, certain intercontinental resemblances; for example, caesalpinioids lack the nitrogen-fixing symbiosis in both study areas (https://nph.onlinelibrary.wiley.com/doi/10.1111/nph.14474). However, these resemblances can largely be explained by phylogenetic affinity, and even where phylogenetic affinity is greatest, adaptive differences are obvious. It remains possible that the study areas, although matched environmentally as closely as possible, remain different enough in climates, soils, and biotic regimes that convergence should not be expected in the first place. However, the exact selective pressures need to be explained. Posted on March 1, 2025 03:59 AM by milewski"
author = "Antoni Milewski"
year_published = 2025
