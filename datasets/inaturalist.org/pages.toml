full_description = "Take your nature knowledge up a notch with Seek! Use the power of image recognition technology to identify the plants and animals all around you. Earn badges for seeing different types of birds, amphibians, plants, and fungi and participate in monthly observation challenges. Found a mushroom, flower, or bug, and not sure what it is? Open up the Seek camera to see if it knows! Drawing from millions of wildlife observations on iNaturalist, Seek shows you lists of commonly recorded insects, birds, plants, amphibians, and more in your area. Scan the environment with the Seek Camera to identify organisms using the tree of life. Add different species to your observations and learn all about them in the process! The more observations you make, the more badges you’ll earn! Seek will ask permission to turn on location services, but your location is obscured to respect your privacy while still allowing species suggestions from your general area. Your precise location is never stored in the app or sent to iNaturalist. Our image recognition technology is based on observations submitted to iNaturalist.org and partner sites, and identified by the iNaturalist community. For help with the Seek app, please email help+seek@inaturalist.org. Seek is created by iNaturalist, and was originally released with support from the California Academy of Sciences, the National Geographic Society, Our Planet on Netflix, WWF, HHMI Tangled Bank Studios, and Visipedia."
