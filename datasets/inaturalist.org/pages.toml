description = """
Photos / Sounds              5 photos
  What        California Bay        (Umbellularia californica)  
  

  Observerpaolacabrera
  Date    February      28,     2025  02:32 PM PST
  Place  Oakland, CA 94619, USA (Google, OSM)
    Date Added      February 28, 2025        04:40 PM PST    Description      Seen quite a bunch growing along side with the redwoods. They are in the same areas where it is shaded and damp, which I found quite fascinating. Some of the trunks seemed to go sideways which is perhaps their way of receiving more sunlight due to the tall redwoods covering sunlight especially since they are shorter in height.  
  
                            2                    IDs                                Needs ID              View"""
full_description = "Seen quite a bunch growing along side with the redwoods. They are in the same areas where it is shaded and damp, which I found quite fascinating. Some of the trunks seemed to go sideways which is perhaps their way of receiving more sunlight due to the tall redwoods covering sunlight especially since they are shorter in height. Found older redwoods and some younger ones around the understory. The area under the taller redwoods were quite muddy and humid despite the warm and sunny weather. The shaded areas were cooler in temperature. Seen a lot of the trees cloning with each other and sprouting from the same trunk. Seemed to prefer areas where it is open and where the sun is exposed. They were in an area further from the redwoods. Managed to find it perching on a tree. Around the redwood area, I saw one of the ravens rustling a leaf on the redwood and trying to search for food. Heard some crowing along the way. Found around the bottom of the redwoods. They seem to favor damp and shaded areas. The flat leaf surface is used to absorb as much sunlight whenever sunlight is accessible. Found around the understory of the redwoods. They seem to not get as much sunlight which can explain their flat leaf surface."
