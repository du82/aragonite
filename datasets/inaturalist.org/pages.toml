full_description = 'This is the privacy policy ("Privacy Policy") of the iNaturalist.org website, iOS App, and Android App, the iNaturalist Network Member websites, and describes how iNaturalist ("iNaturalist," "We," "Us" or "Our") handles Personal Information (as defined below) that users ("You," "Your” or "User") provide to Us, or that We collect from You through the use of Our Website, which is located at www.inaturalist.org ) and through the iNaturalist Network Member websites (collectively, the "Websites"), and through the iNaturalist iOS App, and the iNaturalist Android App and the Seek by iNaturalist App (the “App(s)”) (the “Websites” and “App(s)” are collectively, the “Platform”). Each country has different laws and rights relating to Personal Information of their residents. If You are a resident located outside the United States, in addition to this Privacy Policy, please also see Your country specific disclosures including those for: Argentina; Australia; Canada; Chile; Colombia; Costa Rica; Ecuador; Finland; Greece; Guatemala; Israel; Mexico; New Zealand; Panama; Portugal; South Africa; Spain; Sweden; Taiwan; Uruguay; and the United Kingdom; This Privacy Policy is subject to Our Terms of Use at https://www.inaturalist.org/pages/terms. We may update this Privacy Policy from time to time, as specified in the “Privacy Policy Changes” section below. You should read this entire Privacy Policy before submitting information to Us or using Our Platform. Whenever You submit personal and non-personal information via Our Platform or otherwise to Us, whether online or offline, You consent to the collection, use disclosure, transfer, and storage of that information in accordance with this Privacy Policy. "Personal Information" means information such as Your first/middle initial or name, last name, e-mail address, street address, mailing address if different, town or city, state, zip code, telephone number, profile photograph, Internet Protocol (IP) addresses, credit card information and any other information that could allow someone to identify You or contact You, including information collected through cookies and other technology.'
