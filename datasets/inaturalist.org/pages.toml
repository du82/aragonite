["https://inaturalist.org/pages/about"]
title = """
About
 ·  iNaturalist"""
full_description = "iNaturalist helps you identify the plants and animals around you while generating data for science and conservation. Get connected with a community of millions scientists and naturalists who can help you learn more about nature! What’s more, by recording and sharing your observations, you’ll create research-quality data for scientists working to better understand and protect nature. So if you like recording your findings from the outdoors, or if you just like learning about life, join us! Vision: iNaturalist's vision is a world where everyone can understand and sustain biodiversity through the practice of observing wild organisms and sharing information about them. Mission: iNaturalist’s mission is to connect people to nature and advance biodiversity science and conservation. It's also a crowdsourced species identification system and an organism occurrence recording tool. You can use it to record your own observations, get help with identifications, collaborate with others to collect this kind of information for a common purpose, or access the observational data collected by iNaturalist users. Our approach towards advancing biodiversity science and conservation is to focus on supporting a large healthy community using the platform to generate, share, explore and curate data rather than focusing on accruing data. As such, iNat is not a data repository and isn’t a good place to drop off external data not generated on the platform. Please check out GBIF as an appropriate repository. We resize and reprocess all the photos directly uploaded to iNat. And while we do archive photos from 3rd party services like Flickr, do not rely on us to keep the original information in photos you add to iNat. Maintain good backups on your own hardware, or use one of the many cloud-based backup solutions out there. It's not even here to map all ecological phenomena, like rocks, trash, water features, etc. iNaturalist is for recording observations of individual living things, particularly things that can be tied to a species name. It's certainly not here to map your friends, security camera, recycling bins, etc. If you're interested in those kinds of things, try a photo-sharing site (many of them include maps), Open Data Kit, or another mapping platform."
year_published = 2025
