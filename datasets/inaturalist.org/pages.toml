["https://www.inaturalist.org/blog"]
title = """
iNaturalist's Journal
 ·  iNaturalist"""
full_description = "We passed a major milestone with today’s update to iNaturalist’s Computer Vision and Geomodel—100,000 modeled taxa! To mark this achievement, we’re excited to make the Geomodel Expected Nearby Maps available in three key ways: This dataset provides a powerful new tool for researchers, conservationists, and policymakers to better understand and protect biodiversity—a key part of iNaturalist's mission. Understanding where species occur and how their distributions are changing is fundamental to biodiversity conservation. Yet, while satellites provide near-continuous imaging of the Earth, most species distribution datasets remain artisanal—often hand-drawn by experts or based on statistical correlations with indirect environmental variables like temperature rather than direct biodiversity observations. ✅ Built on hundreds of millions of observations from the iNaturalist community. ✅ Improving each month as new observations are added. ✅ A true data-driven complement to traditional range maps, reflecting actual species occurrences. One way to showcase this dataset is by estimating terrestrial vertebrate species richness. The map below was generated by stacking 12,000 individual range maps from the dataset, covering approximately 30% of all terrestrial vertebrate species (12k out of 39k). Areas with higher species richness are shown in red. Despite known biases towards more 'charismatic' species in this subset of vertebrates, this estimate aligns with established biodiversity patterns, showing peak species richness in the tropics, similar to other global biodiversity assessments (e.g., this study). Similarly, a map of small-ranged terrestrial vertebrates (species with range sizes smaller than the median for their group) highlights endemism hotspots in regions such as the Andes and Madagascar, corroborating findings from other biodiversity studies (e.g., this study). The maps above focus on terrestrial vertebrates where 30% of all species are in the model. However, the gaps are much larger for other groups. Across all described species, while iNaturalist has documented ~25%, we currently have enough observations to model only 5% of them."
year_published = 2025
year_updated = 2025
