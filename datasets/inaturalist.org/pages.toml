["https://inaturalist.org/sites/network"]
title = "iNaturalist Network ·  iNaturalist"
full_description = "The iNaturalist Network is a localized experience that is fully connected to the global iNaturalist community. Network members are local institutions that promote local use and facilitate the use of data from iNaturalist to benefit local biodiversity. They have access to true coordinates within their geographic areas that are automatically obscured from public view in order to better protect threatened species. Your username and password work on all sites that are part of the iNaturalist Network. If you choose to affiliate with a Network site, the local institutions that support each site will also have access to your email address (only to communicate with you about site activities) and access to the true coordinates for observations that you have chosen to make publicly obscured or private. iNaturalist has formal agreements with organizations in each of these geographic areas to support the use of the iNaturalist platform. As of 2024, we are piloting a simplified approach to network partnerships. If your organization is interested in joining the iNaturalist Network, you can find more details here."
year_published = 2025
