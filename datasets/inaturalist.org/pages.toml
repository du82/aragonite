["https://inaturalist.org/pages/community+guidelines"]
title = """
Community Guidelines
 ·  iNaturalist"""
full_description = "Welcome to iNaturalist! iNaturalist is a global community of people who record observations of other organisms and share them with each other so all of us can learn more about the natural world. We all want iNat to be a fun, helpful, and relaxed place to be, so we (Ken-ichi and the other site staff) wrote the original guidelines with extensive input from the community to describe what we consider good and bad behavior, and they have been updated and amended by staff since then. These are not a replacement for our Terms of Use, and with the exception of a few items marked with a (!), these are not hard and fast rules. They are guidelines and heuristics for how we should conduct ourselves on iNaturalist. These guidelines do not address our behavior beyond iNaturalist. Keep in mind that staff may, at their discretion, remove content that we deem harmful to iNaturalist’s community or data quality. This includes intentionally false content, machine generated content, content created by sockpuppet accounts, hate speech, pornography, and the like. Let’s just get these out of the way at the start. Any of these behaviors are grounds for immediate suspension without warning. (!) Hate speech. Hate speech is content consciously designed to attack people based on age, race, gender, sexual orientation, income, physical ability, country of origin, religion, educational background, or any other attribute that people are unable to control. This includes misgendering (intentionally not using or stating intention not to use someone’s stated pronouns). (!) Insults or threats. Insults are attacks meant purely to belittle or offend people. A threat is any content that indicates an intent to harm another person. Note that warnings about suspension or other regulatory actions on the part of site staff or site curators on iNaturalist are not threats. (!) Sexually explicit content. Observations of mating non-human species are fine, but common sense should still be used. (!) Sockpuppet accounts. A sockpuppet account is an additional account set up to evade suspension, circumvent restrictions in functionality, or other forms of bad behavior, like confirming your own identifications. This does not include multiple accounts set up for multiple roles, e.g. a personal account and a professional account."
year_published = 2025
clearnet = "https://inaturalist.org/pages/community+guidelines"
