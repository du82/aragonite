full_description = '''I was outside earlier tonight, looking on the side of my house for insects to photograph. I had my earbuds in but I wasn’t listening to anything because I needed to focus on the camera. I started hearing noises from far behind me (in the woods behind my house). It sounded like someone breathing heavily. I didn’t pay attention to it at first, but it just kept getting louder. It was really out of place, when all you’re expecting is the stillness and silence of night. I drop my phone and just... Today, I visited Edgar Evins State Park to check if any spring ephemerals had emerged. While walking along the Highland Rim Nature Trail, I first noticed several Virginia spring beauties (Claytonia virginica) blooming near the first half of the trail. After observing the spring beauties, I came across several purple cress (Cardamine douglassii) plants. Like the spring beauties, these looked very fresh in terms of their bloo... 昨天看到新西兰的－个圆果雀稗观察 https://www.inaturalist.org/observations/263435784 ，启发了对鸭乸草／圆果雀稗类群的理解。 Paspalum orbiculare 的模式标本来自南太平洋的岛屿。 Paspalum scrobiculatum 在印度和非洲被训化种植为一种杂粮。https://www.themilletlovers.com/post/kodo-millet-sustainable-nutritious-delicious 上面信息可帮助对两个学名的理解。 Exocarpos bidwillii, known by the tag name "Takana," is a small, leafless shrub endemic to New Zealand. Despite being common, it has been largely overlooked in scientific literature and popular botanical publications due to its inconspicuous nature. The plant's description has largely remained unchanged since the publication of "Flora of New Zealand" in 1961. However, recent field observations and iNaturalist contributions over the past eight years have pro... Each time you go out and make observations for this project, describe your walk by adding a comment to this post. Include the date, distance walked, and categories that you used for this walk.'''
