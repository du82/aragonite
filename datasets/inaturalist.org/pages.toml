["https://inaturalist.org/journal/harriseli195/107246-spring-is-on-the-way"]
title = """
Spring is on the Way 
 ·  iNaturalist"""
description = "March 1, 2025 – Edgar Evins State Park Field Notes Today, I visited Edgar Evins State Park to check if any spring ephemerals had emerged. While walking along the Highland Rim Nature Trail, I first noticed several Virginia spring beauties (Claytonia virginica) blooming near the first half of the trail. After observing the spring beauties, I came across several purple cress (Cardamine douglassii) plants. Like the spring beauties, these looked very fresh in terms of their blooms. I only saw three plants with flowers fully opened. Lastly, I saw an abundance of harbinger of spring (Erigenia bulbosa) along the trail. This is definitely one of the earliest blooming spring ephemerals in Tennessee. While plentiful, you really had to be looking for it, as it was easy to overlook! In a few weeks, there should be even more plants up and blooming. Spring is always a joyful time for botanists—so many plants to observe!"
