["https://inaturalist.org/pages/press"]
title = """
Press
 ·  iNaturalist"""
full_description = 'iNaturalist is frequently mentioned in a variety of local news outlets. We suggest searching Google News for recent examples. Below are some notable examples of broader media coverage about iNaturalist. Scott Loarie and Ken-ichi Ueda are interviewed about the evolution and impact of iNaturalist along with community members Jennifer Rycenga and Prakrit Jain. Michael Coren recommends Seek, iNaturalist, PlantNet, and Merlin as science-driven apps for exploring biodiversity in your neighborhood. Amy Harmon interviewed dozens of members of the iNaturalist community in search of what makes it a place for civil discourse in pursuit of truth about the natural world. Amber Dance covers community science and profiles several community science leaders, including iNat user Greg Pauly. Shoshi Parks covers the effort to document newts in California using iNaturalist to try and reduce newt road mortality. Dale Bowman said Seek by iNaturalist "changed my outdoor world, especially for identifying plants and trees." "iNaturalist has become a world-leading resource that combines observational data with artificial intelligence and community expertise to bring natural history into the digital age." by Paul Manning and Morgan Jackson Sarah Lindenfield Hall tells of neighborhood nature explorations with her daughter during the covid-19 pandemic. Catherine LeClair writes about iNaturalist and Seek by iNaturalist, and how using them helped her become more connected to nature. iNaturalist and iNaturalist Canada are discussed in this article, as well as the importance of crowdsourced data. iNaturalist staff member Carrie Seltzer was also interviewed for CTV in connection with the article. April Glaser explores the tradeoffs between sharing biodiversity information and keeping it secret, using eBird and iNaturalist as examples. The iNaturalist observation of a rare Hoodwinker Sunfish in the wrong hemisphere spawned many news stories in outlets around the world. This piece by Merrit Kennedy describes the dialogue on iNaturalist that made this discovery possible.'
year_published = 2025
