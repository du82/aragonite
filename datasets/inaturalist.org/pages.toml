["https://www.inaturalist.org/pages/curator+guide"]
title = """
Curator Guide
 ·  iNaturalist"""
full_description = '''Welcome curators! This guide describes some of the curatorial tools iNat provides as well as some of iNaturalist's policies toward how we curate our taxa. This document is both a how-to manual and a statement of our curatorial policies. If you cannot abide by our policies, we will start by warning you, but if you continue to reject our policies, we will remove your curator status. Being a site curator means you have the power to make new taxa, edit existing taxa, alter our taxonomic tree, delete taxon names, and generally maintain the state of iNat's taxonomy. You also have the ability to hide other users' comments and suspend them for violations of iNaturalist's Community Guidelines. You will not have the ability to remove or override anyone's identification, however. If you are interested in getting the tools to help with some of the tasks outlined below, read through this Curator Guide in full then fill out the Curator Application here. In order to apply to be a site curator you must have had an account for 60 days or more, have added 100 improving identifications to anyone's observations, including your own, and made at least five flags. Note that as of January 20th, 2021, curators can no longer promote another user to curatorship. Only iNaturalist staff and iNaturalist Network Site Admins can make someone a curator. If you demonstrate by your behavior on the site, forum, or other communication that you are unwilling to abide by these curatorial policies, abusive to us or members of our community, or otherwise unreasonable, the staff will revoke your curator status, or just not grant it in the first place. What constitutes abusive or unreasonable behavior is at the discretion of the site staff. Have a question or not sure how to respond to a specific situation? Always feel free to flag something for curation to have a discussion with other curators, or to reach out to the staff at help@inaturalist.org. Everyone on iNat can add new taxa to the system by searching external name providers using the taxon selector or by using the box at the bottom of the search page. Curators can make new taxa directly by going to https://www.inaturalist.org/taxa/new or by clicking the "Create a new taxon link" in the Curation box on their dashboard.'''
