["https://inaturalist.org/journal/birdwhisperer/107137-ground-squirrels-of-idaho"]
title = """
Ground Squirrels of Idaho
 ·  iNaturalist"""
description = "As a follow up to my chipmunks of Idaho post, here is an attempt to provide a guide to ground-dwelling squirrels of Idaho, and rather than focusing on just one genus of squirrels, we'll do the tribe Marmotini. Key 1) Distinct striping on the dorsum -- **2** 1) No striping on the dorsum -- **7** 2) Dorsum with only two white stripes; very small; white tail; occurs in deserts, especially sagebrush or saltbrush -- **White-tailed Antelope Squirrel** *ssp. leucurus* 2) Dorsum with two lateral white stripes that are flanked on each side by black stripes, with a gray-brown dorsum that could be called a dorsum stripe, resulting in a total of 7 stripes; medium-sized squirrels; gray or yellow tails; occurs in coniferous forests and subalpine/alpine zones -- **3** 3) Inner black stripes (dorsally of white stripes) thinner than outer black stripes; north of Snake River -- **4** 3) Inner black stripes (dorsally of white stripes) same width and length as outer black stripes; south of Snake River ..."
full_description = '''As a follow up to my chipmunks of Idaho post, here is an attempt to provide a guide to ground-dwelling squirrels of Idaho, and rather than focusing on just one genus of squirrels, we'll do the tribe Marmotini. Key 1) Distinct striping on the dorsum -- 2 1) No striping on the dorsum -- 7 2) Dorsum with only two white stripes; very small; white tail; occurs in deserts, especially sagebrush or saltbrush -- White-tailed Antelope Squirrel ssp. leucurus 2) Dorsum with two lateral white stripes that are flanked on each side by black stripes, with a gray-brown dorsum that could be called a dorsum stripe, resulting in a total of 7 stripes; medium-sized squirrels; gray or yellow tails; occurs in coniferous forests and subalpine/alpine zones -- 3 3) Inner black stripes (dorsally of white stripes) thinner than outer black stripes; north of Snake River -- 4 3) Inner black stripes (dorsally of white stripes) same width and length as outer black stripes; south of Snake River 5 4) Yellowish-gray tail; paler overall, especially dorsum; occurs throughout northern Idaho north of the Snake River -- Golden-mantled Ground Squirrel ssp. cinerascens 4) Cinnamon tail; darker overall, especially dorsum; might not occur in Idaho, but if they do, likely only occurs in Centennial Mountains and Henry's Lake area -- Golden-mantled Ground Squirrel ssp. tescorum 5) Black dorsum stripes muted, and not distinctly contrasting; neck and face tend to be more ochraceous, and dorsum vinaceous; may not occur in Idaho, but if they do, it'd be Hells Canyon area -- Golden-mantled Ground Squirrel ssp. connectens 5) Black dorsum stripes distinct and contrasting; neck and face more tawny, and dorsum grayish-brown; occurs throughout southern Idaho south of the Snake River -- 6 6) Tail is ochraceous-tawny or ochraceous-buff -- Golden-mantled Ground Squirrel ssp. trepidus 6) Tail is chestnut or fulvous -- Golden-mantled Ground Squirrel ssp. castanurus 7) Very large squirrels, with hefty bodies; ears often don't protrude over skull -- 8 7) Small or medium sized squirrels, with slenderer bodies; ears regularly protrude over the skull (except for small species) -- 11 8) Rather uniform in color, being a solid brownish overall; may not occur in Idaho, but if they do, it is Boundary or Bonner County in extreme northern Idaho -- Groundhog ssp. petrensis 8) Bicolored, with a distinct difference in upperparts vs underparts; occurs throughout Idaho -- 9 9) Highly variable, but generally known for ghostly whitish body, blackish head, and deep rufous flanks and tail; generally, only occurs in subalpine/alpine zones; restricted Idaho Batholith and northeastern part of the state -- Hoary Marmot ssp. okanagana 9) Brownish-red upperparts contrasting sharply with brightly yellow underparts; generalist in regard to habitat preference; found throughout the state -- 10 10) Upperparts more likely to be blackish or dark reddish-brown; underparts dark russet-brown; eastern Idaho -- Yellow-bellied Marmot ssp. nosophora 10) Upperparts more likely to be brown or gray-brown; underparts yellowish to tawny; western Idaho -- Yellow-bellied Marmot ssp. avara 11) Long tail that is greater than half the length of the body; only occurs in southeastern Idaho in desert regions -- Rock Squirrel ssp. utah 11) Long tail that is less than half the length of the body; occurs throughout Idaho -- 12 12) Ears protrude above the skull; medium-sized squirrels; uniformly colored bodies; occurs in a variety of habitats -- 13 12) Ears small, and tightly pressed against the skull; small-size squirrels; distinct bicolored bodies with sharp contrast line; tends to favor dry, desert-like habitats -- 18 13) Largest of the remaining squirrels, often characterized with reddish body, especially the face, with distinct white spotting on the dorsum; moderately long tail; occurs in conifer forests -- Columbian Ground Squirrel ssp. columbarius 13) Mostly browns or grays overall, spotted or unspotted, and with short tails; occurs in a variety of habitats -- 14 14) Tail short comparable to remaining species, but likely not helpful in field situations; tail is also a deep reddish on the underside, which is also not very helpful; occurs primarily in southwestern Idaho, with eastern limits being the Albion Mountains -- Belding's Ground Squirrel ssp. creber 14) Tail long comparable to Belding's; tail is not reddish on the underside; occurs primarily in southern Idaho, with various sympatry with Belding's -- 15 15) Gray tail; occurs in eastern Idaho, from about the South Hills and east -- Uinta Ground Chipmunk 15) Ochraceous or buffy tail; occurs in southwestern and extreme southeastern Idaho, with little sympatry with Uinta Ground Squirrel -- 16 16) Grayish body overall; resident to southwestern Idaho in very small numbers; may be extirpated from the state -- Wyoming Ground Squirrel ssp. nevadensis 16) Brownish body overall; resident to east-central Idaho or extremely southeastern Idaho -- 17 17) Apparently only distinguished by longer hind foot and larger cheek teeth; resident to east-central Idaho, particularly Lemhi and Custer counties -- Wyoming Ground Squirrel ssp. aureus 17) Apparently only distinguished by shorter hind foot and smaller cheek teeth; resident to extreme southeastern Idaho, particularly Teton to Franklin counties -- Wyoming Ground Squirrel ssp. elegans 18) White spotting on the upperparts; north of the Payette River in Payette, Gem, Adams, Washington, and Valley counties -- 19 18) No white spotting; southern Idaho south of the Payette River -- 20 19) Occurs in shifty, sandy areas in Washington, Payette, and Gem counties; browner overall -- Idaho Ground Squirrel ssp. endemicus 19) Occurs in moist, mountain meadows in Adams and Valley; redder overall -- Idaho Ground Squirrel ssp. brunneus 20) Occurs in northwestern Owyhee County with Owyhee Plateau likely being a geographic break; tends to be grayer -- Gray Ground Squirrel ssp. vigilis 20) Occurs throughout southern Idaho with Owyhee Plateau likely being a geographic break from Gray Ground Squirrel; tends to be browner -- 21 21) Rusty tail; creamy underparts; occurs between the Payette and Snake River in the Treasure Valley -- Piute Ground Squirrel ssp. idahoensis 21) Cream tail; whitish underparts; occurs either on south side of Snake River, or north side east of Glenn's Ferry -- 22 22) Light gray-brown dorsum; occurs on south side of the Snake River -- Piute Ground Squirrel ssp. mollis 22) Darker gray-brown dorsum; occurs on north side of the Snake River from the Magic Valley to Centennial Mountains -- Piute Ground Squirrel ssp. artemisiae White-tailed Antelope Squirrel (Ammospermophilus lecurus) Distinguish Traits: Smallest ground squirrel in Idaho, with distinct white stripes on the sides. Whitish tail is often perked up, especially while running, or perched on top of sagebrush. Pretty easy species to identify. Subspecies Diagnosis: lecurus is the only subspecies in Idaho Range: Southwestern Idaho, specifically Owyhee County, but it appears to cross the Snake River at bridges into adjacent northern counties. Habitat: Sagebrush steppe and deserts. Commentary: Theoretically, should only occur in Owyhee County, due to the Snake River being a geographic barrier northward, but man-made bridges have allowed the squirrels to colonize areas in Canyon County, but they appear to be absent once you're half a mile away from the bridge. Continual colonization is likely to happen. https://www.inaturalist.org/observations/231015930 https://www.inaturalist.org/observations/13479748 Golden-mantled Ground Squirrel (Callospermophilus lateralis) Distinguish Traits: Distinguished by six stripes on the dorsum on the lateral sides. These stripes include two white stripes, flanked on either side by black stripes. The gray-brown dorsum may be considered a seventh stripe. Neck and face are often rich tawny, orange, or vinaceous. Tail is a variety of colors, and often used for subspecies criteria. Subspecies Diagnosis: Five subspecies are purported to occur in Idaho according to ASM (Bartels and Thompson 1993). These subspecies can be divided into two groups: thin inner black stripe in the north, and thick inner black tripe in the south. Those with a thin inner stripe are reportedly further diagnosed by the presence of a yellowish-gray (tescorum) or cinnamon tail (cinerascens). The former subspecies is also supposed to be paler overall on the dorsum. The remaining three subspecies have thick inner stripes. Subspecies connectus probably the easiest to separate with muted stripes that aren't super contrasting. The last two are distinguished by tail color with an ochraceous-tawny or ochraceous-buff in trepidus, and chestnut or fulvous in castanurus. Range: tescorum in northern and central Idaho, cinerascens in the Fremont County area, connectens in the Seven Devils Mountains in west-central Idaho, trepidus in southern Idaho, and castanurus in southeastern Idaho. Habitat: Coniferous forests and montane forests Commentary: I am not afraid to say that the taxonomic is unstable, especially at the subspecific level. ASM published 13 different subspecies (Bartels and Thompson 1993), but in their accounts, they tend to ignore discussion on subspecific diagnosis. One doctorate thesis (Wright 1972) predates the ASM publication, and the author recognizes 7 subspecies separated into 3 different groups. However, Wright places all individuals within Idaho as individuals with thin black inner stripes, while others place everything south of the northern US Rockies as thick striped. Currently, iNaturalist is following the ASM treatment since our taxonomic status is MMD, which is a program developed by the ASM, but they only assess taxonomy at the species level and above. ssp. tescorum https://www.inaturalist.org/observations/253825102 https://www.inaturalist.org/observations/244818290 ssp. cinerascens https://www.inaturalist.org/observations/239430351 https://www.inaturalist.org/observations/238704979 ssp. connectens https://www.inaturalist.org/observations/91995630 https://www.inaturalist.org/observations/120624295 ssp. trepidus https://www.inaturalist.org/observations/16412303 https://www.inaturalist.org/observations/250093381 ssp. castanurus https://www.inaturalist.org/observations/131242691 https://www.inaturalist.org/observations/89728658 Groundhog (Marmota monax) Distinguish Traits: One of the largest squirrels in the world, with hefty, wide body. Unlike the other marmots in Idaho, this species is more uniform in color, being a solid brownish. Often grizzled with gray. Subspecies Diagnosis: petrensis is the only subspecies in Idaho Range: Range in Idaho only hypothetical but suspected to occur in extreme northern Idaho in Bonner and Boundary counties. Habitat: Conifer forests mainly. Commentary: As stated above, the presence of this species in Idaho is purely hypothetical at the moment. Good opportunity for iNatters! https://www.inaturalist.org/observations/51718877 https://www.inaturalist.org/observations/118876926 Hoary Marmot (Marmota caligata) Distinguish Traits: Quite variable, but generally also diagnosable due to whitish pelage. Palest individuals are nearly solidly white except for blackish ears, nose, hindquarters and tail, but the latter parts of the body often heavily grizzled with white. Darkest individuals can be blackish overall with reddish hindquarters and tail, but back and sides still often grizzled with white indicating this species. Most common phenotype though is blackish face, white body, and rufous flanks and tail. Subspecies Diagnosis: okanagana is the only subspecies in Idaho. Range: Mountains of north and central Idaho Habitat: Subalpine or alpine, rarely occurring at lower elevations. Commentary: Hoary Marmot tends to act as an elevational replacement for Yellow-bellied Marmot, but otherwise should the expected species in the Idaho Batholith and ranges with higher peaks. https://www.inaturalist.org/observations/238107181 https://www.inaturalist.org/observations/204696697 Yellow-bellied Marmot (Marmota flaviventris) Distinguish Traits: Largest squirrel in the world. Generally identified by distinct bicolored body with reddish-brown upperparts and yellowish underparts. Not likely to confused with anything else. Subspecies Diagnosis: Subspecies nosophora has blackish or dark reddish-brown upperparts that contrast with dark russet-brown underparts. Yellowish tones are held to a minimal. Subspecies avara differs with brown or gray-brown upperparts contrasting with brightly yellow or tawny underparts. Range: Subspecies nosophora occurs in eastern Idaho, while avara occurs in western Idaho. Habitat: Generalist; sagebrush steppe, montane forests, lava flows, rockslides, scree, etc. Commentary: There is pretty good ssp. nosophora https://www.inaturalist.org/observations/193954432 https://www.inaturalist.org/observations/171693622 ssp. avara https://www.inaturalist.org/observations/221647708 https://www.inaturalist.org/observations/128567185 Rock Squirrel (Otospermophilus varigateus) Distinguish Traits: Rather distinct squirrel that has a strong resemblance to tree squirrels. Does climb trees and bushes occasionally, but usually always on the ground, while living in burrows. Long, bushy tail, and long ears. Dark grayish body overall with brownish tinge to the rump and back. Upperparts spotted with white. Subspecies Diagnosis: utah is the only subspecies in Idaho. Range: Restricted to lowlands along the Wasatch front in south-central Idaho. Habitat: Deserts, sagebrush steppe, riparian, and shrubland. Commentary: Generally this species is not listed as occurring in Idaho, but there are several RG reports of this species in south-central Idaho that are very clear Rock Squirrels. https://www.inaturalist.org/observations/155994296 https://www.inaturalist.org/observations/30491330 Columbian Ground Squirrel (Urocitellus columbianus) Distinguish Traits: The first of the Urocitellus squirrels, the most diverse genus in Idaho, I find this species to be the most distinctive. Rather medium-sized, they're about the size of Rock Squirrels, or slightly bigger than the other large-eared Urocitellus. Characterized by a deep rusty face and underparts, contrasting with dark brownish-gray upperparts with whitish spotting. Some variation with how deeply reddish the face and underparts is. Subspecies Diagnosis: columbianus is the only subspecies in Idaho. Range: North and central Idaho Habitat: Coniferous forests and montane meadows. Commentary: Rather common species in the Idaho Rockies north of the Snake River. As previously stated, this is one of the more common species, and usually meadows are dominated by this species and Golden-mantled Ground Squirrels. https://www.inaturalist.org/observations/225230487 https://www.inaturalist.org/observations/220926915 Belding's Ground Squirrel (Urocitellus beldingi) Distinguish Traits: The first of what I call the "big-eared" Urocitellus, which have ears p'''
author = "Sean Cozart"
year_published = 2025
