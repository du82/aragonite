["https://inaturalist.org/pages/jobs"]
title = """
Careers at iNaturalist
 ·  iNaturalist"""
full_description = "iNaturalist is the leading biodiversity platform on the planet where millions of community scientists, supported by a vast network of expert naturalists, crowd-source one of the world's largest biodiversity databases representing the backbone of conservation science. With 4 million monthly active users and 400 thousand monthly active contributors, each month iNaturalist generates over 6 million observations of over 100 thousand distinct species. iNaturalist is a 501(c)3 non-profit building a global movement of nature advocates and stewards. Smart, hard-working nature lovers make up our small team. We live in countries all over the world but come together each day to further our mission. We are a virtual team, and most of this position's work can be performed from home or wherever you are comfortable. You'll even get some funds to set up your office and a monthly stipend to defray some of the costs. Some travel to meetings and events will be required. We offer a pretty awesome benefits package, including medical, dental, vision and life insurance, plus an employer-funded health reimbursement account and employee-funded flexible spending accounts. There is a 401k plan with a 5% match. Most full-time positions are eligible for unlimited personal time off, and unlike some tech companies, we really mean it – everyone is expected to take a minimum of three weeks a year off. Eligible new parents get up to 12 weeks of paid leave and an additional 18 of unpaid."
