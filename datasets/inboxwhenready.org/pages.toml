["https://inboxwhenready.org/images/press-kit/press@inboxwhenready.org"]
title = "Inbox When Ready – Press kit"
full_description = "If you'd like to write about Inbox When Ready, I'm glad to help. I'm also available for interview on the subject of email productivity in general. Inbox When Ready is a Chrome extension that adjusts the Gmail interface to protect your focus and improve your email workflow. It will help you check your inbox with reasonable frequency, batch process your email on a regular schedule and minimise the total time you spend in your inbox. The extension was inspired by BJ Fogg's behaviour model, which predicts that the best way to change behaviour is to optimise triggers and ability. In this context, the desired behaviour is sustained focus when working with email. This is achieved by suppressing a trigger (the visible inbox) and reducing ability (by locking you out of your inbox at times you specify). Inbox When Ready is made by Peter Hartree in Reykjavík, Iceland. The extension is free to use. You can support my work by upgrading to the PRO edition."
