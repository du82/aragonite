["https://inboxwhenready.org/pricing"]
title = "Inbox When Ready – Free or Pro?"
description = "The extension is available in free and PRO editions."
full_description = "You can support my work by proudly displaying the signature message. Or, you can upgrade to Inbox When Ready PRO to permanantly disable it. All new users get a free 14 day trial of the PRO edition. If you want to upgrade immediately, please click here. Happiness promiseIf you don't love the pro edition, just email me within 60 days and I'll send you a full refund. This refund policy applies to all payments, including renewals. Many people who use Inbox When Ready feel less stressed and reclaim an hour of focussed work every week that would otherwise be lost to their inbox. With your support, I hope to help many more people realise wins like this. If Inbox When Ready helps you reclaim 1 hour per week for focussed work, and your time is worth $35 / hour, the annual PRO subscription pays for itself within twothree weeks. The design, development and maintenance of Inbox When Ready represents months of work and a big ongoing commitment. I can't sustain this on a voluntary basis. A lot of web software is 'free' because it sells your data or shows you ads. Inbox When Ready will never do this. No, you only need one license. Inbox When Ready PRO is licensed to you—the person—for use with all of your email addresses. If your income is less than $3000 / month, you're welcome to use Inbox When Ready PRO free of charge. Please just fill out this form to get your PRO license. If you earn a higher income and you think the PRO edition is too expensive, you may be undervaluing your time, or just not finding the extension helpful. Inbox When Ready is made by Peter Hartree in Reykjavík, Iceland. The extension is free to use. You can support my work by upgrading to the PRO edition."
