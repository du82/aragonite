["https://inboxwhenready.org/terms-privacy"]
title = "Inbox When Ready – Terms and Privacy Policy"
description = "Terms and privacy policy for the extension."
full_description = '''When you install the extension, it requests the minimum browser permissions that are required to make changes to the Gmail web interface. Inbox When Ready will never read your emails, and it does not require API access to your Gmail account. This makes it more secure than the vast majority of browser extensions for Gmail, and suitable for use with Google's Advanced Protection Programme. The extension is reviewed on a regular basis by the security teams at the Google Chrome Web Store, the Microsoft Partner Center, and Mozilla Firefox Add-ons directory. These terms and privacy policy are effective from 30th March 2018. They were last reviewed—but not changed—on 7th November 2024. When you install the extension, we collect the name and email address of each of your Google accounts. This enables us to personalise extension settings and email you about the extension. You can opt-out of email correspondence by clicking the link at the bottom of the emails we send, or by sending a request to [email protected]. When you use the extension, we may collect usage data including the time of use and the functions used. This enables us to better understand your needs and provide you a better product. You can opt-out from extension usage data collection on the "Privacy" dialog of the extension settings. When you use the extension, we may collect diagnostic data if you experience an error (e.g. a bug in Inbox When Ready, or a conflict with another extension). This enables us provide you a better product. It is not yet possible to opt-out of this. If you pay for the extension, our payment processor will collect your payment information including card details and postal address. This enables us to apply appropriate tax rates, process your payment and comply with accounting requirements. When you visit our website, we may collect website usage data including time of visit and the pages you visit, in order to improve our website. The legal basis for the collection and processing of this data is legitimate interest, namely your interest in enjoying a useful service and our interest in efficiently providing it.'''
year_published = 2025
