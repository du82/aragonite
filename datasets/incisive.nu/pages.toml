title = "Incisive.nu"
full_description = "Working and Learning from Home with Young Children March 15th, 2020 My partner and I both work from home, and here are the most important things I’ve learned as we’ve attempted to balance two careers and an inquisitive, extremely energetic child with much less than full childcare coverage, first in NYC and now in rural Oregon. (Read more ->) Writing Well about Terrible People September 24th, 2017 This morning, I set myself the task of turning my response to a New York Times article into something less ephemeral and annoying than a tweetstorm. I gave myself one hour to do it, which mostly meant not letting myself spend another two hours adding more links. I have a lot of feelings, and I’m […] Be More Careful on Facebook February 15th, 2017 Here’s the short version of what I’m about to say: Immigrants and visitors to the US—along with anyone participating in protests or visible resistance to the current administration—are the targets of intrusive governmental surveillance, including surveillance of their social networks. Both immigrants and political dissidents are being vilified by the administration and targeted for draconian and unconstitutional attacks. If your “friends”—or friends of friends—network includes people vulnerable to these attacks, you should assume that your constitutionally protected political speech may be used in bad faith to characterize your contacts as terrorists or criminals, and act accordingly. Read more ⇒ Hard Reset January 4th, 2017 Our pop culture mostly presents telepathy as a cartoony curse: The power arrives, the cascade of thoughts overwhelms the telepath, temple-grabbing and visual effects ensue. (Like other primarily mental superpowers, telepathy is a tidy figure for the hormones of adolescence that we pretend doesn’t follow us into adulthood.) In our narratives, only a few characters usually possess or gain the strength to wield their skills successfully; most dissolve under the flood. Anyway, then some of the baby nerds raised on genre media grew up and made a giant real-life telepathy machine for all of us to plug into, and that’s been…illuminating. Most of my internet sanity-retention tactics over the last couple years have been rooted in the assumption that the online roar of anxiety would lessen a bit, especially after the 2016 election. I did a few things to tune my experience, and they helped me stick it out. Then the worst thing happened, and now we’re facing down a whole ugly flock of existential threats, along with the usual systemic, ongoing wrongs. Terror blended with uncertainty is one of the mammal brain’s worst enemies, and the social internet—especially Twitter—is soaked in it. Read more ⇒"
