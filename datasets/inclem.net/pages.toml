["http://inclem.net/files/p4a_revamp_doc"]
title = "python-for-android — python-for-android 0.1 documentation"
full_description = "python-for-android¶ python-for-android is an open source build tool to let you package Python code into standalone android APKs that can be passed around, installed, or uploaded to marketplaces such as the Play Store just like any other Androip app. This tool was originally developed for the Kivy cross-platform graphical framework, but now supports multiple bootstraps and can be easily extended to package other types of Python app for Android. python-for-android supports two major operations; first, it can compile the Python interpreter, its dependencies, backend libraries and python code for Android devices. This stage is fully customisable, you can install as many or few components as you like. The result is a standalone Android project which can be used to generate any number of different APKs, even with different names, icons, Python code etc. The second function of python-for-android is to provide a simple interface to these distributions, to generate from such a project a Python APK with build parameters and Python code to taste. Contents¶ Quickstart Installation Dependencies Basic use Setting paths to the the SDK and NDK Commands Commands index General arguments Distribution arguments Recipes Creating your own Recipe Methods and tools to help with compilation Using a PythonRecipe Using a CythonRecipe Using a CompiledComponentsPythonRecipe Using an NDKRecipe A Recipe template Examples of recipes The Recipe class Bootstraps Current bootstraps Creating a new bootstrap Accessing Android APIs Using Pyjnius Using Plyer Troubleshooting Debug output Getting help Debugging on Android Common errors Differences to the old python-for-android project Contributing Old p4a toolchain doc Toolchain Examples Python API Java API (pyjnius) Contribute Related projects FAQ Indices and tables Indices and tables¶ Index Module Index Search Page"
