title = "inclem.net"
full_description = "State of Vivarium Sat 30 December 2023 | tags: vivariumwayland Somehow it’s been over two and a half years since my last post. Time flies when not slowed down by a global pandemic. My last few posts were about the state of Vivarium, my dynamic tiling wayland compositor. I had a number of feature targets and completion goals I was working on. But surprisingly something unexpected happened: Vivarium turned out to be good enough to use! I still use it every day on all my machines but since the last release I’ve only performed minor tweaks and fixes. Vivarium is by no means finished, it has many missing and unsupported features including things like support for a recent wlroots release, and big wayland features like protocol support to allow screen sharing. However, it isn’t missing anything that bugs me right now. I continue to fix things as they come up but it’s probably unrealistic to think I’ll put a lot of effort into new development any time soon. As far as I can tell there might be one or two people using Vivarium, which I know only from occasional pull requests. Many thanks if that’s you, I appreciate (and have benefited from) many of those. In the last couple of years there’s been a lot more wayland development and more compositor alternatives have sprung up. Perhaps one of them would suit me, but for now I’ll still be using Vivarium for the foreseeable future. Vivarium 0.0.3 release: damage tracking and wlroots 0.13 support Sun 30 May 2021 | tags: vivariumwayland I’ve just tagged for release Vivarium 0.0.3. Vivarium is a dynamic tiling wayland compositor, with desktop semantics inspired mostly by xmonad. Release summary This release has two major new features: damage tracking, and support for wlroots 0.13. There are also various minor fixes and additions, such … read more Thoughts on writing a wayland window manager with wlroots Sat 17 April 2021 | tags: vivariumwayland I recently released Vivarium, a dynamic tiling wayland compositor built using the wlroots library. Going from zero to compositing was interesting, there are good libraries available but everything has moved very fast in the last couple of years so it can be hard to know where to start. I especially … read more"
