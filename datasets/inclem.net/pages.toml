full_description = "Kivy 1.10 released Sat 07 May 2016 | tags: kivypythonrelease We’re pleased to announce a new stable version of Kivy, version 1.10. You can see the full detailed changelog on the mailing list announcement, and download the new version from the Kivy website or via your package manager. This release includes many new features. Highlights include: Python 3.5/3.6+ support on Windows. Support for these versions was previously available in nightly builds due to changes in the compiler toolchain, but official wheels are now available. A new RecycleView widget replaces the old ListView. It is faster and more efficient, but with a simpler API. Graphics backend improvements including ANGLE support on Windows and a mock backend for headless Kivy. Several new Window options when using the SDL2 backend, for much improved cross-platform behaviour. Improvements in Clock performance. There are also many other new features and bugfixes, spread across over 1500 commits from almost 100 different developers. Thanks to everyone who contributed! Kivy 1.9.1 released Sat 02 January 2016 | tags: kivypythonrelease We’ve just released a new stable version of Kivy, version 1.9.1. You can see the changelog on the mailing list announcement, and download the new version from the Kivy website or via your package manager. This is mainly a bugfix and tidying release following the major version … read more Kivy 1.9 released Thu 02 April 2015 | tags: kivypythonrelease Kivy 1.9 has just been released! This has been a long time in the making, for no very good reason, but now you can take advantage of all our many new features in the stable branch. You can find the full changelog at the official mailing list announcement. This … read more"
