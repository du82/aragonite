full_description = "Kivy crash course Kivy crash course videos This site was originally created to collate my Kivy Crash Course series of youtube videos, which you can find on my youtube channel. This series starts from scratch and moves quickly through different Kivy features in about 10 minutes per video. Making a simple App; youtube or article. Building an Android APK; youtube or article. More interesting widget interactions; youtube or article. Kivy language; youtube. Mixing python and kivy language; youtube. Kivy properties; youtube. Drawing on the canvas; youtube. Let’s fix some bugs; youtube. Creating a scrollable label; youtube. Thinking about layouts; youtube. Animation and the Clock; youtube. Using Android APIs; youtube. Using Kivy’s settings panel: youtube. Using a ScreenManager: youtube. I maintain a separate github repository with the original kivy crash course files and any accompanying notes. Everything relevant is linked to from the individual articles or videos. Text tutorials I’ve also written a series of introductory text tutorials for Kivy: Hello world! Improving appearances, customising widgets using Kivy Properties Building a full GUI Making the GUI do stuff, binding to events A drawing app Let’s draw something Introducing kv language More kv language Finishing the drawing app"
