["https://includejs.dev/notes/missing-semester-02"]
title = "Missing Semester 02 - Shell Tools and Scripting - includeJS"
description = "More on Shell, scripting, variables, functions, arguments and, most importantly, the tools!"
full_description = '''Missing Semester 02 - Shell Tools and ScriptingMore on Shell, scripting, variables, functions, arguments and, most importantly, the tools!Written by Eva Dee on 20th of September 2020 (about a 4 minute read).📹 YouTube Link✏️ Official NotesAssigning Variables permalink foo=barDeclaring a variable.echo $fooAccessing a variable.❗ Spaces are reserved for separating the arguments (foo = bar is an invalid declaration).Quotes permalink For literal strings, double or single quotes are equivalent.But, variables won't expand inside single quotes (but yes in double-quotes)'Value is $foo' ⛔"Value is $foo" ✅Functions permalink Function example: (mcd - create and cd into that folder)mcd () { mkdir -p "$1" cd "$1"}source [function name]Execute commands from a file in the current shell.source path/to/fileEvaluate the contents of a given file.Special Variables permalink $0The name of the script we are running.$1Access the 1st argument.$#The number of arguments we are giving to the command (length).%_The value of the last argument.!!Run the last command again (often used with sudo).$?Read the value of standard error. (false produces error code 1).$$Process id.$@Expands to all the arguments (spread).;To concacenate different commands in the same line.Short-circuit Operators permalink false || echo "Oops, fail" (prints Oops, fail)true || echo "Will not be printed" (prints nothing)true && echo "Things went well" (prints Things went well)false && echo "Will not be printed" (prints nothing)true ; echo "This will always run" (prints This will always run)false ; echo "This will always run" (prints This will always run)Process Substitution permalink Process substitution feeds the output of a process (or processes) into the stdin of another process.cat <(ls) <(ls ..)<( CMD ) will execute CMD and place the output in a temporary file and substitute the <() with that file’s name.Test permalink Evaluate condition.If it is true, returns 0 exit status, otherwise returns 1.test -z \$GIT_BRANCHTest if given variable is empty.test -e filenameTest if file exists.Globbing permalink Globbing or filename expansion: Filename expansion means expanding filename patterns or templates containing special characters.For example, example.??? might expand to example.001 and/or example.txt.touch foo{1,2,10}touch {foo,bar}/{a..j}Shell Functions vs Scripts permalink Functions have to be in the same language as the shell, while scripts can be written in any language. This is why including a shebang for scripts is important.Functions are loaded once when their definition is read. Scripts are loaded every time they are executed.Functions are executed in the current shell environment whereas scripts execute in their own processMisc permalink shebangThe first line in the script that will inform the shell how to run this program.foo=$(pwd)Saves the output of the pwd command in the foo variable: echo "We are in $(pwd)/dev/nullIf you redirect output there, it will be discarded (this is so for tidying up your output)ctrl + rBackward search (press ctrl + r again to go through the results)Shell Tools permalink brew info [tool]👍 To look it up on Homebrew.shellcheck (For bash script debugging)imageMagick (Tools and libraries to manipulate images in many formats)ffmpeg (Play, record, convert, and stream audio and video)findfind . -name src -type dfind . -mtime -1 (modification time in the last day )find . -naame "\*.tmp" -exec rm {} \;fd (Simple, fast and user-friendly alternative to find)ripgrep (For more colorful grep.)rg -C 5 emoji src (Get 5 lines of context.)history | grep convertfzf (Type fzf to search over all your files.)tree (Display directories as trees (with optional color/HTML output))broot (New way to see and navigate directory trees)'''
