["https://includejs.dev/notes/FEM-command-line"]
title = "Introduction to Bash, VIM & Regex - includeJS"
description = "Frontendmasters course on command line by James Halliday."
full_description = '''Introduction to Bash, VIM & RegexFrontendmasters course on command line by James Halliday.Written by Eva Dee on 27th of March 2020 (about a 4 minute read).Navigation permalink bash is a unix (an operating system that evolved into Linux) shell. A shell is a computer program that is used to launch other computer programs ( via a text interface). bash comes from 'bourne again shell'.ls -1display directory content, line by line.cd is the same as cd ~resetto reset your terminal 👍mv moby-dick.txt{_,} will expand to: mv moby-dick.txt_ moby-dick.txtYou can always test what your command will do (without actually doing it), by adding echo - this will output just the expansion.mkdir -pThe -p flag will create a directory if one doesn't exist yet.Expansion permalink cat b{ee,oo}p.txtimg{0...100}Will generate 100 directories like img0, img1 etc.>> file.txtAppend to file.ls -l *.txt | wc -lWill count the number of .txt files in the current directory.sed -r 's/\s+/\n/g'Converts all whitespace (tabs, spaces, newlines) into newlines.calDisplays the calendar.cal November 2020cal -3Shows previous months, current month, next month.datedate +FToday's date in year-month-date format.echo 'date' (with backticks) is the same as echo $(date)If you run curl -s the -s flag will get rid of the progress bar. 👍Bash Scripts permalink #!/bin/bashYou need to put that on the first line of your bash scripts.touch loggerYou can add a .sh extension to your scripts, but not needed.echo date + '%F %T' $1 >> date +%F.logAppend a message to a file with today's date (a logger of sorts). $1 is the variable.chmod +x loggerYou need to make the script executable. 👍You can use $* (instead of $1) to grab the whole input - for multi-word inputs. If you are using $1, you'll have to add ''. 👍while true; do node server.js; doneRestart the node server every time it crashes.usr/local/binWhere your scripts should live.sudo cp logger /usr/local/bin/loggyCopying our script to the scripts folder. From now on, we can execute it from anywhere by typing loggy.Exit Codes permalink echo $?Read the exit code of the program you've just executed (0 means no error, non-zero fo unsuccessful).test -fEvaluates the expression and, if it evaluates to true, returns a zero (true) exit status; otherwise, it returns 1 (false). -f: True if file exists and is a regular file.Jobs permalink ctrl cStops the process.ctrl zPuts the process in the background. You can revive it with fg 👍.pgrepSearch for a process by its name.pkill -9 [process name]Kill all processes which match process name.Regex permalink regex in JavaScript:str.split(re)str.match(re)str.replace(re)re.test(str)re.exec(str)flags:i case insensitiveg match all occurrences (global)m treat a string as multiple liness treat a string as a single linemetacharacters:. matches any character? zero or one time* zero or more times+ one or more times[] character class^ anchor at the beginning$ anchor to the end(a|b) match a or b() capture group(?:) non capture group\d digit [0-9]\w word [A-Za-z0-9]\s whitespace [\t\r\n\f]Sed permalink sed -E and grep -Eto escape metacharacterssed -E 's/[0-9]+//'gremove all the numbers'cool "beans" zzz'.replace(/"[^"]+"/, 'XXX')Replace everything between double quotation marks with XXX.sed -E 's/(\w+) \1/\1/g'Remove duplicates (only if they are next to each other).sed 's/cool/k00l/g' -i file.txtReplace cool with k00l in the file specified.Vim permalink navigation (also used in less)k upwardsj downwardsl right sideh left side'''
