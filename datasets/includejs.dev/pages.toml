["https://includejs.dev/notes/cs50-02"]
title = "CS50 Week 2: Arrays - includeJS"
description = "On arrays, strings (or are they?) and functions."
full_description = '''CS50 Week 2: ArraysOn arrays, strings (or are they?) and functions.Written by Eva Dee on 6th of December 2021 (about a 6 minute read).🔗 Course WebsiteReplacing make with clang permalink When you run make hello.c you get a file called a.out (aka assembly output).To give it a name yourself: clang -o hello hello.cTo include custom libraries, you have to include them as a header file, but also tell clangwhere to find it: clang -o hello hello.c -lcs50 (link in the cs50 library)What is compiling? permalink Compiling actually involves four steps:preprocessing - evaluating libraries and imports, basically looking for everything that has a # symbol. The header files include all the prototypes.compiling - translating your code into assembly codeassembling - translating assembly code into binarylinking - linking all the different files into oneDebugging permalink Syntactic errors vs logical errors.using printfuse debug50 (a debugger built on the industry standard's tool called GDB - the GBU debugger)make sure to set up breakpoints before running the debugger!rubber duck debuggingMemory permalink think of RAM (random-access memory) as a grid, 1 byte taking one space inside the grid.RAM is volatile; it requires electricity to continue powering itwhen you run a program in C, it is running in your RAMthink of the computer's memory as a grid of bytes// this is inside CS50 IDEbool 1 byte (bit wasteful, could be just a bit instead)char 1 bytedouble 8 bytesfloat 4 bytesint 4 byteslong 8 bytesstring ? bytesArrays permalink An array is a sequence of values stored in memory back to back to back (aka contiguous).Arrays are used to hold values of the same data type.Arrays can be multidimensional.Array values are passed by reference.With an array declaration, you need to specify three things:typenamesizee.g. int scores[3];And this is how you pass an array as an input:// you use square brackets, but no size// arrays in C do not know how long they are// so you'll need to pass in length separatelyfloat average(int length, int array[])What is a (damn, you) segmentation fault ?When you work with data outside of your declared array. For example, you have an array with size 10, but you are accessing the element at position 11.Random access is one of the most powerful yet one of the scariest features in C. You can touch, look at, change any memory you want.🤔 What is the difference between conversion, casting, coercion?Conversion: either implicitly or explicitly changing a value from one data type to another, e.g. a 16-bit integer to a 32-bit integer.Coercion: an implicit conversion.Casting: an explicit type conversion int() or Number()String permalink a string is an array of characters! (there is no 🥄!)How do we know when the string ends?\0 null (terminating) character where you basically "waste" one byte to indicate where the string ends.So a string with length 3, actually takes up 4 bytes.And how do you loop over the string's characters (for how long)?:// since every string end is padded with the NULL charfor (int i = 0; str[i] != '\0'; i++) {}// can be replaced with strlen// make sure to include the <string.h> headerfor (int i = 0, len = strlen(str); i < len; i++) {}Food for thought 🤔The whole point of programming ultimately is to abstract those lower-level implementation details.Command-line arguments permalink argc: argument count. The program's name is by default, the first argumentargv: argument vector (vector is another word for array), is an array of strings. The first element argv[0] is always the name of the program. The last element is always stored at argv[argv-1]By default, main returns 0.int main(int argc, string argv[]){ printf("hello, %s\n", argv[1]);}else{ printf("hello, world\n");}Exit status permalink 0 in computer speak typically means all ok 👍: return 0you can return a custom value (in case of errors or any results you want to keep track of): e.g. return 1to check the exit status of a program you just ran: echo $?Functions permalink synonyms: procedures, methods, subroutines There are three parts in a function declaration:return typenamethe argument list (comma-separated, with a type and a name)🤔 What is the difference between function declaration vs function definition?float sum_two (int a, int b);// the definition (aka the actual recipe)float sum_two (int a, int b){ int result = a + b; return result;}Functions can have 0 (void) arguments or no output (also void).'''
author = "Eva Dee"
year_published = 2021
