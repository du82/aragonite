["https://includejs.dev/notes/missing-semester-03"]
title = "Missing Semester 03 - Editors (Vim) - includeJS"
description = "Vim's interface is a programming language 🤯."
full_description = "Missing Semester 03 - Editors (Vim)Vim's interface is a programming language 🤯.Written by Eva Dee on 22nd of September 2020 (about a 3 minute read).📹 YouTube Link✏️ Official NotesVim Modes permalink Normal: for moving around a file and making edits (Esc)Insert: for inserting text (i)Replace: for replacing text (R)Visual (plain v, line V, or block ctrl+v): for selecting blocks of textCommand-line: for running a command (:)Some Vim Vocabulary permalink a buffer: a set of open files (A given buffer may be open in multiple windows, even within the same tab)a session: A Vim session has a number of tabs, each of which has a number of windows (split panes)a tab: each tab has a number of windowsa window: a view (each window shows a single buffer)Command Mode permalink :q close the current window:qa close all windows (quit Vim):q! close and discard any changes you've made (force-quit):w save:wq save and quit:help [topic] open help (:help :w opens help for the :w command):e [name of file] open file for editing:ls show open buffersMovement (normal mode) permalink Basic movement: hjkl (left, down, up, right)Words: w (next word), b (beginning of word), e (end of word)Lines: 0 (beginning of line), ^ (first non-blank character), $ (end of line)Screen: H (top of screen), M (middle of screen), L (bottom of screen)Scroll: Ctrl+u (up), Ctrl+d (down)File: gg (beginning of file), G (end of file)Find: f[character], t[character], F[character], T[character] (Find and To)find/to forward/backward [character] on the current line, / ; for navigating matches% (find the corresponding item - brackets, quotation marks etc)search: /[regex], n / N for navigating matchesEditing (insert mode) permalink o / O insert line below / aboved[motion] delete [motion]e.g. dw is delete word, d$ is delete to end of line, d0 is delete to beginning of linedd deletes the whole line`c[motion] change [motion] (similar to delete, but puts you in insert mode)e.g. cw is change wordx delete character (equal do dl)r[character] replaces the current character with the one you typedu to undo, ctrl+r to redoy to copy / “yank”p to paste~ flips the case of a character (or selection)Selection (visual mode) permalink do motion action and select everything in betweenin Visual Line mode (V) you'll be selecting by lines at the timein Visual Block mode (ctrl+v) you'll be selecting by rectangular blocksCounts permalink To perform a given action a number of times.3w move 3 words forward5j move 5 lines down7dw delete 7 wordsModifiers permalink Particularly useful for changing stuff inside/around brackets, quotes.i, “inside”, and a, “around”.ci( change the contents inside the current pair of parenthesesci[ change the contents inside the current pair of square bracketsda' delete a single-quoted string, including the surrounding single quotes"
