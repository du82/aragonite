["https://includejs.dev/notes/slack-shortcuts"]
title = "Most Useful Slack Shortcuts - includeJS"
description = "More Slack Shortcuts Here"
full_description = "Most Useful Slack ShortcutsMore Slack Shortcuts HereWritten by Eva Dee on 7th of April 2020 (about a 2 minute read).I work remotely, and most of our communication happens on Slack (we use Google Hangouts and Whereby for video communication and Notion for documentation and issue tracking).Favorite Slack Shortcuts (so far) permalink shift + enterCreate a new line in your message ('Enter' is for sending).up arrowEdit your last message.cmd + uTo upload files (I use this one all the time for sharing screenshots of my work in progress).cmd + shift + enterCreate a new code snippet. 💡Use single backticks for inline code and tripple backticks for a short code snippet./awayTo toggle away status (useful for when you want to take a peek at your Slack group, but not be seen as online).cmd + shift + yEdit your status - to quickly tell your team that you are unavailable.cmd + shift + aOpen all unreads. (Meh, not sure yet whether this one is useful for me).alt + up arrow/down arrowNavigate up and down channels or DMs 💪.cmd + numberTo switch between different slack groups 💪.cmd + kQuick switcher (sort of like command palette in VSCode).cmd + /Toggle the keyboard shortcuts panel./remind [who] [what] [when]To set reminders in Slack.Pro tips:I use Rocket emoji for all my emoji dispensing.Add Giphy for Slack for GIF posting via /giphy command."
