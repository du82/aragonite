["https://includejs.dev/notes/more-git-magic"]
title = "Useful Git Commands - includeJS"
description = "How To Make Life Easier When Using Git"
full_description = '''Useful Git CommandsHow To Make Life Easier When Using GitWritten by Eva Dee on 4th of April 2020 (about a 2 minute read).I wrote about useful git commands previously here and here.Besides the Smashing Magazine link from above, I've also picked up a couple of tricks from Harry Roberts' and Git Explorer.git branch --sort=-committerdateSort branches by date.git checkout -Checkout previous branch (- is same as @{-1}).git branch -vvList branches along with commit ID, commit message, and remote.git status -sbGit status that is easier to read (I have a gs alias for that).git reflogTo see the history of all of your git activitygit log -- missing_file.txtFind files (even ones that were deleted).git shortlog -sn --all --no-mergesTo see who has committed how much 💪.git shortlog -sn --since='10 weeks' --until='2 weeks'In a specific range.git for-each-ref --count=10 --sort=-committerdate refs/heads/ --format="%(refname:short)"See 10 most recent branches recently worked on.git commit --amend --no-editModify the last commit, but leave the commit message. (I will marry this one!)git diff --stagedShow commited/staged changes.git diff [commit1] [commit2] | lessCompare two commits and output the result in the terminal.git stash show -p [stash id]View contents of a stash. Very useful for a notorious stasher like me!'''
