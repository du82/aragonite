["https://includejs.dev/notes/vscode-shortcuts"]
title = "VScode Keyboard Shortcuts - includeJS"
description = "Link to the VSCode installation page."
full_description = '''VScode Keyboard ShortcutsLink to the VSCode installation page.Written by Eva Dee on 3rd of April 2020 (about a 3 minute read).The Ever-expanding List of Frequently Used Keyboard Shortcuts permalink cmd + shift + \For finding a matching bracket (especially useful if you're not using an extension that does that for you - like Rainbow Brackets).cmd + pQuick open, go to file.cmd + p + pToggle back and forth between two files (equal to ctrl + tab).cmd + .To toggle the auto-fix menu (for fixing indentation, etc.). This is especially useful if you're not using Prettier.cmd + 0Bring focus to the sidebar. cmd 1 to bring the focus back to the code editor.ctrl + [num]Jump from tab to tab (e.g., first tab is ctrl + 1).F2Toggle rename mode: this will change the name of that constant wherever it occurs (great for refactoring).F8Go to the next error or warning.F12Go to the definition (great for exploring the codebase).cmd + down arrowOpen a file while in file explorer (pressing the enter key will rename the file).cmd + dSelect multiple instances.alt + up arrowMove a line of code up (you can move it down with the down arrow instead).shift + alt + down arrowDuplicate lines of code down (you can do it upward, by using the up arrow instead).alt + right arrowNavigate the code, word by word going right (you can go left by using the left arrow instead).cmd + right arrowJump to the end of the line (cmd + left arrow for the beginning of the line).cmd + lSelect the current line. Press the l key repeatedly to select more lines (expanding downward).cmd + shift + kDelete the current line.cmd + shift + enterInsert a line above.cmd + [Increase indentation (with closing square bracket to decrease indentation).cmd + up arrowJump to the top of the file (use the down arrow to jump to the bottom of the file).ctrl + gNavigate to a specific line number.cmd + backspaceDelete everything and place cursor to the start of that line.cmd + k + vOpen markdown preview (for markdown files).cmd + shift + .Open breadcrumbs.cmd + p then @Go to the command palette, then press @ to navigate to the different sections of the file.cmd + down arrow + .Open the file (through directory explorer). Pressing enter will toggle the rename mode.cmd + k + jOpen a Quokka workspace - prototyping playground.cmd + ,Go to user settings.cmd + k + cmd + SOpen keyboard shorcuts.Custom shortcuts permalink alt + w + wClose all files and collapse the directory tree.capslock + right arrowI'm using capslock as an extra modifier key (via Karabiner-Elements), this combination splits the screen horizontally to the right (useful for comparing two files).capslock + FToggle full screen.'''
