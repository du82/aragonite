["https://includejs.dev/notes/analyze-git-logs"]
title = "Analyze Git Logs with the Command Line - includeJS"
description = "Stuff I learned from the Egghead course Analyze Git Logs with the Command Line"
full_description = '''Analyze Git Logs with the Command LineStuff I learned from the Egghead course Analyze Git Logs with the Command LineWritten by Eva Dee on 1st of March 2020 (about a 2 minute read).Question: how to figure out which of your days were the most productive (on which days you made the highest number of commits?). This example uses my team's commits for 2019 front-end application written in ReactJS.1.git log | grep 2019Get commits from 2019 (pipe the log through a filter).2.git log | grep 2019 | wc -lCount how many commits were made in 2019 (count the number of lines).3.git log | grep 2019 | sed -e 's/Date: //' | sed -e 's/\(...\).*/\1/'To get out the days when the commits were commited (using sed and regex magic).4.git log | grep 2019 | cut -d ' ' -f 4Same as above (cut into groups using the delimiter - empty space in this case).5.git log | grep 2019 | tr -s ' 'Squeezes the output (removes the extra spaces in this case).6.git log | grep 2019 | tr -s ' ' | cut -d ' ' -f 2Combines the translate and cut commands to get the same output as number 3. (regex madness from above).7.git log | grep 2019 | awk '{ print $2 }'Same result as above, but using awk.8.git log | grep 2019 | awk '{ print $2 }' | sort | uniq -cCount the number of occurences of each day (make sure to run sort before uniq, as uniq only removes neighboring duplicates).8.git log | grep 2019 | awk '{ print $2 }' | sort | uniq -c | sort -nSort the final result and add -n for when sorting numbers.Final result: (Who would have thunk it, Mondays are the least productive of all weekdays 🤔).numberday16Sun18Sat278Mon316Fri323Wed351Thu359Tue(hey, my first table in markdown 💪!)'''
author = "Eva Dee"
year_published = 2020
