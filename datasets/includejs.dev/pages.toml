description = "On how to setup reactJS projects, when to use Typescript."
full_description = '''The Opinionated Guide to React 01 - Folder structure, file naming, eslint, typescriptOn how to setup reactJS projects, when to use Typescript.Written by Eva Dee on 9th of November 2020 (about a 3 minute read).Legend:✏️ means the author👩‍💻 means moiFolder Structure permalink ✏️ Four main folders (inside src):componentspagesassetsutilsFor state managementcontext👩‍💻 Compared to how we have it set up at work:components ✅ (Button also lives here)pages ✅ (we straight up call them screens)utilsWe don't have a separate assets folder. 🤔But we have (in addition):modules for state management (Redux and hooks)API for talking to the backendlegacy shame 😊😱 What is Overmind? (to be revealed in a future chapter)File naming permalink ✏️ "I always try to name my files index.js and let the folder name do the talking."👩‍💻 (I currently give each file a specific name.)But, but, what happens when you're searching?Exporting components permalink ✏️const LandingPage = () => {}; export default LandingPage; 👩‍💻export default function LandingPage() {} eslint permalink eslint-config-react-app😱 But to add to a project (outisde of create-react-app):npm install --save-dev eslint-config-react-app @typescript-eslint/eslint-plugin@^4.0.0 @typescript-eslint/parser@^4.0.0 babel-eslint@^10.0.0 eslint@^7.5.0 eslint-plugin-flowtype@^5.2.0 eslint-plugin-import@^2.22.0 eslint-plugin-jsx-a11y@^6.3.1 eslint-plugin-react@^7.20.3 eslint-plugin-react-hooks@^4.0.8Typescript (when to use it?) permalink Plug it in when you need itNever at the beginning unless you know the app you are building will have the need for a complicated state.Design systems are things where TypeScript is quite handyFor a complex app🤔 Besides typesettings, what else does TypeScript give you?Answer🤔 Proptypes vs typescript?Typescript and PropTypes serve different purposes. Typescript validates types at compile-time, whereas PropTypes are checked at runtime.Typescript is useful when you are writing code: it will warn you if you pass an argument of the wrong type to your React components, give you autocomplete for function calls, etc.PropTypes are useful when you test how the components interact with external data.🤔 Compile-time vs runtime?Source code (if written in a high-level programming language) must be compiled into machine code to be an executable program. The operations at compile time include syntax analysis, semantic analysis, and code generation. During compilation, errors can occur. They occur due to syntax and semantic errors.The runtime is also known as execution time. It is the time when a program is running in contrast to other program lifecycle phases such as compile-time, load time, etc.When the compilation process is completed, it is run by the user. The time period to run the executable generated at compile time is referred to as runtime. Runtime errors are known as exceptions.'''
