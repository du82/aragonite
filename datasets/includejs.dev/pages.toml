full_description = "NotesCollections📕 Sometimes I write down notes for an entire course, class or book. These are broken down into several posts.Missing Semester 🔍The Opinionated Guide to React 💬You Don't Know JS 📚You Don't Know JS Book 2 📚CS50 💡🕵️‍♀️ Explore notes by TAGSHow to Prepare for AWS Solutions Architect Associate Certificate28th of May 2023Six months ago, I didn't know much about cloud computing. And then I've decided to change that. Read the restResurecting a file deleted from a git repo16th of February 2023Sometimes when I'm working in a Git repository, I might delete a file that, it later turns out, I shouldn't have done. Read the rest2023 - a year in review7th of January 2023So much has happened - this is some of it. Read the restBest online resources for learning Modern Greek (IMHO!)6th of November 2022My favourite resources for learning Greek that I encountered in the last year. Get in touch if you think I'm missing out on any. Read the restWe moved to Greece26th of October 2022We started our drive on a Monday afternoon from the Lake District in the UK and by Saturday night we made it to Athens Read the restOn debugging20th of May 2022Not all programmers (even if they are good) are good at debugging. Read the restMy Favorite Newsletters, 2022 Edition.1st of May 2022The newsletters I'm currently reading can roughly be divided into three categories: everything internet (online culture, trends, memes), programming (front-end development and general computer science principles) & computers (Mac OS, productivity), and language & culture. Read the restManaging complexity is the primary technical goal in software development.10th of March 2022On managing complexity. Read the restCS50 Week 10: Ethics, Security and AI29th of December 2021CS50's finishes strong with a lecture on Ethics. Followed by two shorter lectures on AI and Security. Read the restCS50 Week 9: Flask 🧴25th of December 2021Spinning up a web app with Flask and sqlite db. Read the restCS50 We