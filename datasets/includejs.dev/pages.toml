["https://includejs.dev/notes/remy-CLI"]
title = "Notes from Command Line Course by Remy Sharp - includeJS"
description = "Learn command line pipes, alias, zsh, string processing and more."
full_description = '''Notes from Command Line Course by Remy SharpLearn command line pipes, alias, zsh, string processing and more.Written by Eva Dee on 21st of March 2020 (about a 4 minute read).List permalink ls -ltrl = list, t = sort by time modified, r = reverse resultscd -Go to the last directory - great for jumping between two directories.which [application name]Tells you where the app is running from.Find and Pipe permalink find .Print all the files in the current directory (including hidden files).find . | grep .mdFind all markdown files.find . | grep .md | wc -lAnd count how many lines.find . | grep .md | xargs cat | wc -wHow many words in each markdown file.find [directory] -mtime -1 -lsFind all files modified in the last 24 hours.find [directory] -mtime -1 -ls | egrep .js$ | awk '{ print $1 }'Find above, but only files ending in .js and print out the first column.Grep permalink grep -n [term]Will show the line number of where the match occurred.grep -c [term]Count the number of occurrences.grep [term] -n -A 2 -B 2Will print two lines before and two lines after the match.grep '^#Find all the headings in a markdown file.Tail and Less permalink cat [file] | pbcopyCopy the contents of a file onto the clipboard.tail -f [file]Follow the file stream (will continue to print newlines).lessFor file pagination:b navigate backwardf navigate forward👩‍💻 Make sure to always sort before using uniq (as it only works on neighboring lines).egrep '^\s+RT @' freezing.log | sort | uniq -c | sort -nr | lessUsing egrep to search for an expression starting with one or more spaces followed by RT @, sort the result, count the number of uniq ones, sort the result by reverse number and pipe into less for easier perusal 💪vi /etc/sudoers👩‍💻 see what sudo powers you havechmod and chown that I didn't pay attention too (since I don't work in shared environments) 😬.Managing processes permalink ps auxww | grep [term] -iShow all running processes.kill -9Forced shutdown.df -hDisk space.du -hsDisk usage for a particular directory (human readable, summary number).top /htopuptimeFor a quick overview (load averages).Aliases permalink My git aliases:ga='git add'gcm='git checkout master'gd='git diff'gp='git push'gf='git fetch'gl='git pull'gs='git-status'Wget and Curl permalink wget [url]Will save that page to your harddrive.wget -r -l4 -spider -D [url]Will recursively save all the pages (spider), 4 links deep, inside a specific domain.wget ‐‐level=1 ‐‐recursive ‐‐no-parent ‐‐accept mp3,MP3 http://example.com/mp3/Download all the MP3 files from a sub-directorywget ‐‐mirror ‐‐domains=abc.com,files.abc.com,docs.abc.com ‐‐accept=pdf http://abc.com/Download the PDF documents from a website through recursion but stay within specific domains.curl [url] | scrape pWould scrape all the p tags from that page.curl -I [url]Returns headers.curl -L -I -X GET [url]GET request, get all headers, following redirects.👩‍💻 In browser developer tools, Networks tab, you can copy each request as Curl (and then run it locally).Misc permalink Ngrok: will tunnel any local port into a public url.cat [file.json] | json --keysWill list out all the keys at root level.json -aProcess array as an object which allows for lookups.awk '{ print $2 }'Split the string up by spaces and print the second column only ($0 represents the entire string).ps auxww | grep node | awk '{ print $1 }'Find all node processes.ps auxww | grep node | awk '{ print $1 }' | xargs killFind them and destroy them! xargs takes the pipped in output and takes it as an argument for the next thing.Similar notes permalink My favorite command line one-liners (from Linux Comand Library) 🤓"Automate with Bash'''
