["https://includejs.dev/notes/browser-keyboard-shortcuts"]
title = "Chrome/Firefox Keyboard Shortcuts (for developers) - includeJS"
description = "Use The Keyboard (one of the resources I used)"
full_description = "Chrome/Firefox Keyboard Shortcuts (for developers)Use The Keyboard (one of the resources I used)Written by Eva Dee on 19th of May 2020 (about a 2 minute read).Navigation permalink ctrl a and ctrl eFor moving to the beginning/end of the line (just like in your terminal/command line!)cmd + lBring the URL bar into focus.cmd + enterDuplicate the current tab (while in URL focus).cmd + shift + tOpen a tab you just closed (a lifesaver for my trigger-happy fingers).cmd + dAdd a bookmark (extra tip: when saving bookmarks to the bookmarks bar, delete all the text meaning only an icon will get displayed => you can cram many more bookmarks into your bookmarks bar 💪).Dev tools permalink cmd + shift + cToggles the inspect element mode (and makes for faster DOM inspection).Toggle the console from dev tools by pressing esc key.cmd+ option + iTo open the dev tools (in the last panel you used).shift + enterFor a multi-line entry (in the Console)cmd + [ and cmd + ]To focus next/previous panel in the dev tools.cmd + shift + dSwitch back to whatever docking position you last used.cmd + shift + pOpen the Command Menu.Have you ever wondered how to access console.log values? Wonder no more permalink Go to the console, right-click on the logged value and click Store as Global Variable.Now, this value will be stored in a variable temp1 (temp0 in Firefox). Nuts!The subsequent values (in the same session) will be stored astemp2, temp3...To get that data onto your clipboard type: copy(temp1) 🤯Firefox extras permalink cmd + shift + pTo start private browsing.cmd + kMove focus to the Search bar.cmd + up/down arrowGo to the top/bottom of a webpage."
