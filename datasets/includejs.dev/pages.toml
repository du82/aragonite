title = "You Don't Know JS - 05 Exploring Further - includeJS"
description = "On values vs references, function forms, coercive comparison and prototypal classes. 🤯"
full_description = '''You Don't Know JS - 05 Exploring FurtherOn values vs references, function forms, coercive comparison and prototypal classes. 🤯Written by Eva Dee on 6th of March 2021 (about a 8 minute read).📕 GitHub LinkValues vs. References permalink In many languages, the developer can choose between assigning/passing a value as the value itself, or as a reference to the value. In JS, however, this decision is entirely determined by the kind of value.primitive values are always assigned/passed as value copieswith references two or more variables are pointing at the same value and modifying this shared value would be reflected by an access via any of those referencesIn JS, only object values (arrays, objects, functions, etc.) are treated as references.Function (forms) permalink arrow function expressions are syntactically anonymousBut! anonymous functions might get a name inference when the function expression is assigned with =var awesomeFunction = function(coolThings) { // .. return amazingStuff;};awesomeFunction.name;// "awesomeFunction"If you pass a function expression as an argument to a function call (more common), no name inference occurs. In this case, the name property will be an empty string, and the developer console will usually report anonymous function.Even if a name is inferred, it's still an anonymous function because the inferred name is a metadata string value, not an available identifier to refer to the function.You can also have a named function expression:var awesomeFunction = function someName(coolThings) { // .. return amazingStuff;};awesomeFunction.name;// "someName"someName is associated with the function at compile-time, and the association with the identifier awesomeFunction doesn't happen until runtime.More declaration forms permalink // generator function declarationfunction *two() { .. }// async function declarationasync function three() { .. }// async generator function declarationasync function *four() { .. }// named function export declaration (ES6 modules)export function five() { .. }More function expression forms permalink // IIFE(function(){ .. })();(function namedIIFE(){ .. })();// asynchronous IIFE(async function(){ .. })();(async function namedAIIFE(){ .. })();// arrow function expressionsvar f;f = () => 42;f = x => x * 2;f = (x) => x * 2;f = (x,y) => x * y;f = x => ({ x: x * 2 });f = x => { return x * 2; };f = async x => { var y = await doSomethingAsync(x); return y * 2;};someOperation( x => x * 2 );//Functions as methods permalink class SomethingKindaGreat { // class methods coolMethod() { .. } // no commas! boringMethod() { .. }}var EntirelyDifferent = { // object methods coolMethod() { .. }, // commas! boringMethod() { .. }, // (anonymous) function expression property oldSchool: function() { .. }};Coercive Conditional Comparison permalink Since the Boolean(..) function always returns a value of type boolean, the == vs === in this snippet is irrelevant; they'll both do the same thing.var x = "hello";if (Boolean(x) == true) { // will run}// which is the same as:if (Boolean(x) === true) { // will run}Prototypal Classes permalink A prototypal class with Object.create(..)var Classroom = { welcome() { console.log("Welcome, students!"); }};var mathClass = Object.create(Classroom);mathClass.welcome();// Welcome, students!All functions by default reference an empty object at a property named prototype.This is not the function's prototype (where the function is prototype linked to), but rather the prototype object to link to when other objects are created by calling the function with new.So you could do this instead:function Classroom() { // ..}Classroom.prototype.welcome = function hello() { console.log("Welcome, students!");};var mathClass = new Classroom();mathClass.welcome();// Welcome, students!The "prototypal class" pattern is now strongly discouraged, in favor of using ES6's class mechanism:class Classroom { constructor() { // .. } welcome() { console.log("Welcome, students!"); }}var mathClass = new Classroom();mathClass.welcome();// Welcome, students!Under the covers, the same prototype linkage is wired up, but this class syntax fits the class-oriented design pattern much more cleanly than "prototypal classes".'''
author = "Eva Dee"
year_published = 2021
