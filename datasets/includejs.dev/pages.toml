title = "Best online resources for learning Modern Greek (IMHO!) - includeJS"
description = "My favourite resources for learning Greek that I encountered in the last year. Get in touch if you think I'm missing out on any."
full_description = "Best online resources for learning Modern Greek (IMHO!)My favourite resources for learning Greek that I encountered in the last year. Get in touch if you think I'm missing out on any.Written by Eva Dee on 6th of November 2022 (about a 2 minute read).A collection of the best online resources for learning Modern Greek (2022)Learning the Greek Alphabet permalink You will need to learn the alphabet before doing anything else 😅.Duolingo has an alphabet learning section (note: I only use Duolingo - the free version - on my laptop. I'm not too fond of all the commercials and gamification you get on the mobile version)These YT videos:Learn The Modern Greek Alphabet | OmiloGreek alphabet the CORRECT pronunciationVocabulary permalink Duolingo - I've been doing around 50px every day for the past yearMemrise - the quality of decks will varyClozemaster - great app for practising vocab and reading (it's free, but you can skip the ads with the paid version)Anki - by far my favourite resource. I religiously use Anki every day for about 50 minutes each day. Half of that time is spent on Greek, the other half on reviewing other languages and learning programming and other things relevant to my work as a software developer (keyboard shortcuts, programming concepts, useful snippets of code etc.).I heavily rely on shared decks (browse here, but if I encounter a word or phrase I particularly want to remember, I add it to my Anki too.Babadum - colourful flashcards (many languages supported) - I used it a lot in the beginning when I was learning how to readSpeaking permalink I use iTalki for 1:1 language classesGrammarI love Language Transfer: I think I listened to their 120 lesson three times by nowAlexia's YT channelEssential Grammar (by Routledge): super handyVerbix for verb conjugationListening permalink Easy Greek videos + podcast! Totally worth subscribing and getting the video transcripts and the vocabulary lists (that you can then import into Anki)Hellenic American Union 80 podcast episodesWriting permalink Note: I recommend buying Greek keyboard stickers, which you can tape over your computer/laptop's keyboardpractice typing in GreekCulture permalink I've watched many movies (my favourite ones: 1968, Xenia, Brides) and listened to a lot of Greek music (Marina Satti!). Just anything that I could find online. 😊"
