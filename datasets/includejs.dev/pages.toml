["https://includejs.dev/notes/missing-semester-04"]
title = "Missing Semester 04 - Data Wrangling - includeJS"
description = "Data wrangling is taking data in one format and changing it into a different format 💡."
full_description = '''Missing Semester 04 - Data WranglingData wrangling is taking data in one format and changing it into a different format 💡.Written by Eva Dee on 28th of September 2020 (about a 4 minute read).📹 YouTube Link✏️ Official NotesShoutout to tldr and dashdash for making the man files much easier to work with👍!Note, I have tldr aliased to help, it's much easier to type! (my other bash aliases).Regex permalink . means “any single character” except newline* zero or more of the preceding match+ one or more of the preceding match[abc] any one character of a, b, and c(RX1|RX2) either something that matches RX1 or RX2^ the start of the line$ the end of the linegreedy matching is to match as much as you can. Add a ? to make matching non-greedy.capture group is any text matched by a regex surrounded by parentheses and stored in a numbered capture group ( \1, \2, \3).Sed permalink Edit (find & replace) text in a (non-interactive) scriptable manner.echo "Welcome to the jungle" | sed 's/jungle/party/'Find the string jungle and replace it with string party.sed 's/jungle/super party/' jungleFileFind the string jungle (inside the file jungleFile) and replace it with super party.sed 's/jungle/super party/gi' myfileFind all occurrences of the string jungle and replace them with super party (ignoring character case).sed -n '5,10p' myfile.txtReturn lines 5 to 10 inside the file myfile.txt.sed '20,35d' myfile.txtReturn all of the file except for lines 20-35 inside the file myfile.txt.sed’s regular expressions are somewhat weird, and will require you to put a \ before most of these to give them their special meaning. Or you can pass -E.sed "s/[aeiou]/*/g" myfile.txtFind all vowels and replace them with *.sed 's/[aeiou]/\u&/g' birthday.txt& is the capture group, \u makes all the vowels uppercase.More sed examples.wc permalink wc -l fileCount lines in file.wc -w fileCount words in file.sort permalink sort filenameSort a file in ascending order.sort -rIn reverse ordersort -nWill sort in numeric (instead of lexicographic) ordersort -r filenameSort a file in descending order.uniq permalink uniq -cWill collapse consecutive lines that are the same into a single line, prefixed with a count of the number of occurrencessort file | uniqDisplay each line once.sort file | uniq -dDisplay only duplicate lines.awk permalink For editing column data.Awk assigns some variables for each data field found:$0 for the whole line.$1 for the first field.$2 for the second field.$n for the nth field.Fun alert!history | awk '{CMD[$2]++;count++;}END { for (a in CMD)print CMD[a] " " CMD[a]/count*100 "% " a;}' | grep -v "./" | column -c3 -s " " -t | sort -nr | nl | head -n10Display 10 most frequently used bash commands from history.xargs permalink xargsTakes a list of inputs and turns them into arguments. Execute a command with piped arguments coming from another command, a file, etc.ls CC* | xargs wcPrint the number of lines/words/characters in each file in the listfind /tmp -name core -type f -print | xargs /bin/rm -fFind files named core in or below the directory /tmp and delete them. Note that this will not work correctly if there are any filenames containing newlines or spaces.find /tmp -name core -type f -print0 | xargs -0 /bin/rm -fFind files named core in or below the directory /tmp and delete them, processing filenames in such a way that file or directory names containing spaces or newlines are correctly handled.find /tmp -depth -name core -type f -deleteFind files named core in or below the directory /tmp and delete them, but more efficiently than in the previous example.💪 My own legit and tested example:find . -iname 'IMG*.jpg' -mtime -20 | xargs exiftool -All=Find (case insensitive) all images that start with IMG, less than 20 days old and remove their EXIF data.Misc permalink lessOpen a file for interactive reading, allowing scrolling and search.bc -lRun calculator in interactive mode using the standard math library:'''
