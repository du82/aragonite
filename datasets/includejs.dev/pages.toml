["https://includejs.dev/notes/pragmatic-vscode-shortcuts"]
title = "VSCode Keyboard Shorcuts & Achieving Editor Fluency - includeJS"
description = "From The Pragmatic Programmer, 20th Anniversary Edition"
full_description = '''VSCode Keyboard Shorcuts & Achieving Editor FluencyFrom The Pragmatic Programmer, 20th Anniversary EditionWritten by Eva Dee on 14th of June 2020 (about a 4 minute read).Emoji legend✅ already mastered🥊 needs more practice📕 need to be learned🤷‍♀️ not sure if useful1. When editing text, move and make selection by permalink Character permalink 🥊 shift + (left/right) arrowSelect character by character.Word permalink ✅ alt + (left/right) arrowNavigate word by word.🥊 alt + shift + (left/right) arrowSelect word by word.📕 option + deleteRemove word by word.Line permalink ✅ cmd + (left/right) arrowMove to the beginning/end of the line.🥊 cmd + shift + (left/right) arrow keySelect/unselect line.✅ shift (up/down) arrowSelect line by line.🥊 cmd + shift + kDelete the current line.✅ cmd + xCut a line.📕 cmd + shift + enterInsert a line above.📕 cmd + backspaceDelete a line.✅ option + (up/down) arrowMove a line up or down.✅ option + shift + (up/down) arrowCopy line up or down.Paragraph permalink 📕 cmd + lSelect the current line; keep pressing -l to expand selection downward.📕 option + shift + (left/right) arrowExpand or shrink selection.File permalink ✅ cmd + (up/down) arrowGo to the top/bottom of a file.✅ cmd + shift + (up/down) arrow keySelect/unselect entire file.🥊 ctrl + tabGo to the next opened tab.🥊 shift cmd + tOpen a previously closed file.2. When editing code, move by various syntactic units (matching delimiters, functions, modules...) permalink ✅ cmd + shift + \Go to the matching opening/closing bracket.📕 cmd + shift + oNavigate by symbols.3. Reindent code following changes permalink ✅ cmd + [ or cd + ]4. Comment and uncomment blocks of code with a single command permalink ✅ cmd + /5. Undo and redo changes permalink ✅ cmd + z and cmd + shift + z6. Split the editor window into multiple panels, and navigate between them permalink 🥊 cmd + \Split editor.📕 cmd + numFocus a specific editor window.7. Navigate to a particular line number permalink 📕 ctrl + g8. Sort selected lines permalink 🤷‍♀️ cmd + shift + p(or F1) to access the command palette, then run sort lines.9. Search for both strings and regular expressions, and repeat previous searches permalink ✅ cmd +fSearch in the current document.✅ cmd + shift + fSearch in the current workspace.📕 cmd + shift + hToggle replace mode.10. Temporarily create multiple cursors based on a selection or on a pattern match, and edit the text at each in parallel permalink ✅ cmd + clickInsert cursor (press Escape to remove the temporary cursors).✅ cmd + dSelect the next match.📕 cmd + uDe-select previous match.11. Display compilation errors in the current project permalink ✅ cmd + .To open the quick-fix context menu.📕 F8Go to the next error warning.12. Run the current project's test permalink 🤷‍♀️ cmd + shift + pOpen the command palette, then run all tests?Bonus (added by me) permalink 📕 cmd + k + zEnter the zen mode.📕 cmd +Toggle between different VScode workspaces.📕 cmd + option + sSave all tabs.I wrote about VScode Keyboard Shortcuts previously.'''
