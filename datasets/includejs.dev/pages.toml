["https://includejs.dev/notes/managing-complexity"]
title = "Managing complexity is the primary technical goal in software development. - includeJS"
description = "On managing complexity."
full_description = "Managing complexity is the primary technical goal in software development.On managing complexity.Written by Eva Dee on 10th of March 2022 (about a 2 minute read).Not so long ago, I finished reading Code Complete. One of the key takeaways from the book was: Managing complexity is the primary technical goal in software development. 🤯I've been thinking about this a lot.Here's what the book says about conquering complexity, along with the rest of my notes from one of my favorite chapters: Chapter 34 Themes in software craftsmanship.Conquering Complexity permalink dividing a system into subsystemsdesigning classes well so that you can ignore their inner workings when using themavoiding global dataavoid deep inheritanceavoid deeply nested loopshaving thought out approach to error handlingkeeping routines shortclear variable namingminimizing the number of paramsusing conventionsPick your process permalink the programming process significantly affects the final productfor bigger projects/teams, organizational characteristics make a bigger difference than anyone's individual abilitiesmake clear requirements (req errors are more costly than construction errors)don't skip the design processavoid premature optimizationwrite pseudocodeWrite programs for people first, software second permalink readability affects: comprehensibility, reviewability, error rate, debugging, modifiability, development time, external qualityWatch for falling rocks permalink rewrite tricky codepay attention to buggy codeany warning sign (repetitious or hard-to-modify code) should cause you to doubt the quality of your programmore warning signs: difficulties in writing var names, comments or when decomposingbe sensitive to indications that your program is hard to understandIterate, repeatedly, again, and again permalink the more you iterate in each development activity, the better the product of that activity will beMisc permalink rather than latching on to the latest miracle fad, use a mixture of methods. Experiment with the exciting, recent methods, but bank on the old and dependable onesbe eclectic: willing to try several approaches, knowing that some will fail and some will succeed but not knowing which ones will work until after you try themtreat the techniques as tools in a toolbox and use your own judgment to select the best tool for the jobexperiment! and be willing to change your beliefs based on the results of the experimenta blanket attempt to avoid mistakes is the biggest mistake of all"
