["https://includejs.dev/notes/cs50-07"]
title = "CS50 Week 7: SQL - includeJS"
description = "Introduction to relational databases and SQL."
full_description = '''CS50 Week 7: SQLIntroduction to relational databases and SQL.Written by Eva Dee on 17th of December 2021 (about a 8 minute read).🔗 Course WebsiteCSV permalink a .csv is a flat-tile databasethe data for each column is separated by commas, and each row is on a new line, saved simply as a filevery portable; good for sorting; bad for searchingif you use with open for opening files, it will handle the eventual closing of the file as well. So essentially, the file will remain open while you are indented inside the with block.the DictReader presumes that the first row is going to be column headings (if your file doesn't have headers, you'll have to manually configure DictReader)to canonicalize means to format your data in some standard way# printing only unique valuesimport csv# a colection of unique valuestitles = set()with open("Favorite TV Shows - Form Responses 1.csv", "r") as file: reader = csv.DictReader(file) for row in reader: # the dict reader is aware of the column names # trim and uppercase the entries titles.add(row["title"].strip().upper())# let's sort as wellfor title in sorted(titles): print(title)This is how you'd define a dictionary:titles = dict()#ortitles = {} # dict vote counter for row in reader: title = row["title"].strip().upper() if title not in titles: titles[title] = 0 titles[title] += 1And this is how you'd sort by dict value (not key):def f(title): return titles[title]# 🤯 you can pass in functions to sortedfor title in sorted(titles, key=f, reverse=True):# for short (anonymous) functions, you can write them inline like this:# lambda arguments: return valuefor title in sorted(titles, key=lambda title: titles[title], reverse=True):Relational database permalink programs that store data, ultimately in files, but with additional data structures that allow us to search and store data more efficiently.SQLite is a lightweight version of it (very much used on mobile apps)instead of .csv, the data is now stored in a binary fileinside the file you'll find the tables (aka sheets inside a spreadsheet)sqlite3 command-line tool for interacting with the dbyou can import a .csv file into sqilite3SQL permalink When working with data, you generally deal with these four actions:CREATE and INSERTSELECT (aka READ in the CRUD world)UPDATEDELETEExamples:SELECT title FROM shows;SELECT * FROM shows; (selects all columns)More SQL functions permalink SQL supports many functions that we can use to count and summarize data:AVGCOUNTDISTINCT, for getting distinct values without duplicatesLOWERMAXMINUPPER…SQL clauses permalink You can also add clauses, or phrases that modify the query:WHERE, matching results on a strict conditionLIKE, matching results on a less strict conditionORDER BY, ordering results in some wayLIMIT, limiting the number of resultsGROUP BY, grouping results in some way…Example queries:sqlite> SELECT title FROM shows WHERE title LIKE "%Office%";sqlite> SELECT DISTINCT(UPPER(title)) FROM shows ORDER BY UPPER(title);SELECT UPPER(title), COUNT(title) FROM shows GROUP BY UPPER(title) ORDER BY COUNT(title);🤔 What does it mean to normalize data?To reduce redundancy and ensure a single source of truth.Data Types permalink BLOB, for “binary large object”, raw binary data that might represent filesINTEGERNUMERIC, number-like but not quite a number, like a date or timeREAL, for floating-point valuesTEXT, like stringsAttributes permalink NOT NULL, there must be some valueUNIQUE, means that the value for that column must be unique for every row in the tablePRIMARY KEY, like the id column above that will be used to uniquely identify each rowFOREIGN KEY, like the show_id column above that refers to a column in some other tableBack in our Python file, this is how you can create a squlite db programmatically:from cs50 import SQLopen("shows.db", "w").close()db = SQL("sqlite:///shows.db")db.execute("CREATE TABLE shows (id INTEGER, title TEXT, PRIMARY KEY(id))")db.execute("CREATE TABLE genres (show_id INTEGER, genre TEXT, FOREIGN KEY(show_id) REFERENCES shows(id))")with open("Favorite TV Shows - Form Responses 1.csv", "r") as file: reader = csv.DictReader(file) for row in reader: title = row["title"].strip().upper() # saving the id to use it as FOREIGN KEY in a bit # using the ? as a placeholder id = db.execute("INSERT INTO shows (title) VALUES(?)", title) for genre in row["genres"].split(", "): db.execute("INSERT INTO genres (show_id, genre) VALUES(?, ?)", id, genre)More queries:SELECT title FROM shows WHERE id IN (SELECT show_id FROM genres WHERE genre = "Musical");Data Types in MySQL permalink INTEGERsmallint, with fewer bitsintegerbigint, with more bitsNUMERICbooleandatedatetimenumeric(scale,precision), with a fixed number of digitstimetimestampREALrealdouble precision, with twice as many bitsTEXTchar(n), a fixed number of charactersvarchar(n), a variable number of characters, up to some limit ntext, a string with no limitIndexes permalink indexes tell our database program to create additional data structures so we can search and sort with logarithmic time (instead of O(n)): sqlite> CREATE INDEX title_index ON shows (title);this creates B-trees, like binary trees in C, with nodes organized such that we can search faster than linearlyA B-tree is a family tree that is very wide and not that tall (aka it tries to keep the leaf nodes as close to the root as possible)JOIN permalink SELECT title FROM peopleJOIN stars ON people.id = stars.person_idJOIN shows ON stars.show_id = shows.idWHERE name = "Steve Carell";Problems permalink SQL injection attacks: possible in any application that takes in a user input (e.g., Bobby Tables)race conditions: code in a multi-threaded environment can be commingled or mixed in each thread (e.g., Instagram egg with 50 million likes). The solution is to use TRANSACTIONS which lock a specific row in a table to only one update at a time.'''
