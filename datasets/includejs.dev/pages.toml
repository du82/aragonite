title = "Missing Semester 11 - QA - includeJS"
description = "Q and A session (brielfy) covering a wide range of topics 🤔"
full_description = "Missing Semester 11 - QAQ and A session (brielfy) covering a wide range of topics 🤔Written by Eva Dee on 14th of November 2020 (about a 4 minute read).📹 YouTube Link✏️ Official NotesWhat are some of the tools you’d prioritize learning first? permalink Learn your code editor well (more keyboard, less mouse).Learning how to automate and/or simplify repetitive tasks in your workflow because the time savings will be enormousGit and GithubWhen do I use Python versus a Bash script versus some other language? permalink In general, bash scripts are useful for short and simple one-off scripts when you just want to run a specific series of commands. For larger and/or more complex scripts use a more mature scripting languages like Python or Ruby (bash scripts can easily become overly complicated and unreadable).But also (for bash vs Python):bash is more performant (better start-up time, but not ecessarily better execution time) and better for pippingPython is more elegant and more powerful, also more general purpose. Also better debugging toolsWhat is the difference between source script.sh and ./script.sh? permalink In both cases, the script.sh will be read and executed in a bash session, the difference lies in which session is running the commands.source script.sh command are executed in current bash session, so any changes made in the current environment (such like changing directories or defining functions, all variable assignments) will persist../script will run a new instance of bash, the variables aren't preserved.What are the places where various packages and tools are stored and how does referencing them work? permalink In general, there are some conventions about where specific types of files live./bin - Essential command binaries/sbin - Essential system binaries, usually to be run by root/dev - Device files, special files that often are interfaces to hardware devices/etc - Host-specific system-wide configuration files/home - Home directories for users in the system/lib - Common libraries for system programs/opt - Optional application software/sys - Contains information and configuration for the system (covered in the first lecture)/tmp - Temporary files (also /var/tmp). Usually deleted between reboots./usr/ - Read only user data/usr/bin - Non-essential command binaries/usr/sbin - Non-essential system binaries, usually to be run by root/usr/local/bin - Binaries for user compiled programs/var - Variable files like logs or cachesWhat is the difference between Docker and a Virtual Machine? permalink What is a VM? permalink A virtual machine is a system that acts exactly like a computer.Each virtual machine requires its underlying operating system, and then the hardware is virtualized.And Docker? permalink Docker is a tool that uses containers to make the creation, deployment, and running of applications a lot easier. It binds the application and its dependencies inside a container.And the difference? permalink The main difference between containers and virtual machines is that virtual machines will execute an entire OS stack, including the kernel, even if the kernel is the same as the host machine.Unlike VMs, containers avoid running another instance of the kernel and instead share the kernel with the host.VMDockerHardware-level process isolationOS level process isolationEach VM has a separate OSEach container can share OSBoots in minutesBoots in secondsVMs are of few GBsContainers are lightweight (KBs/MBs)Ready-made VMs are difficult to findPre-built docker containers are easily availableVMs can move to new host easilyContainers are destroyed and re-created rather than movingCreating VM takes a relatively longer timeContainers can be created in secondsMore resource usageLess resource usageThe table is courtesy of Geekflare"
author = "Eva Dee"
year_published = 2020
