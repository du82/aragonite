title = "macOS Shortcuts - Just 'cause - includeJS"
description = "My favorite, most used/useful macOS keyboard shortcuts. 🤓"
full_description = '''macOS Shortcuts - Just 'causeMy favorite, most used/useful macOS keyboard shortcuts. 🤓Written by Eva Dee on 24th of April 2021 (about a 4 minute read).🤔 Note: This list does not include the already well-known shortcuts such as cmd + c for copy or cmd + f for find.Another note: As the title implies, these shortcuts are for macOS. If you want to use them on a Windows machine, you might just get away with changing cmd to ctrl to get it working. Obviously, this won't be true for the Custom shortcuts (featured right at the end of this post). These will work only for me. Because I'm special (and mostly, because I set it up like so.)Table of contentsWhy didn't anyone tell me sooner?Text clippingsFinderNavigationSwooshGeneral usefulnessSearchDexter like shortcutsCustom shortcutsWhy didn't anyone tell me sooner? permalink Saving screenshots to the clipboard instead of a file 🤯You modify the shortcut inside the Keyboard/shortcuts/Screenshots. Shoutout to Stefan for telling me this.cmd + ~Toggle between different windows of the same app.ctrl + down arrowView All Windows Of The Current AppDouble-click text to select a word.Triple-click text to select the whole paragraph. (Wat. How did I now know that? 😳)Text clippings permalink Did you know that if you drag-n-drop a chunk of text onto your desktop this will create a .textclipping file which you can then again drag and drop into other apps? Madness, absolute and utter madness!Excellent for copying frequently-used text (spells, incarnations, that sort of thing).Finder permalink cmd + 1To open Icons viewcmd + 2To open List viewcmd + 3To open Columns viewcmd + shift + .Show hidden files (dotfiles) inside any finder window or file open dialog.Swoosh permalink cmd + shift + hHome directory.cmd + shift + aApplications directory.cmd + shift + dDesktop directory.cmd + shift + gGo to a directory (with autocomplete)General usefulness permalink cmd + wCloses the active window you are currently in. Use Option-Command-W to close all currently active app windows.cmd + mMimimize. Aka hide in dock.cmd + optionHold these two then click on the app icon (in the dock) to get to all the open windows for a specific app. The rest of the apps get hidden.cmd + shift + /Focuses current application help search field - useful for finding hidden settings (inside text editors etc).cmd + click (on a link)To open it in your default browser.cmd + ,For preferences.cmd + .Often times works as "cancel".ctrl + clickFor bringing up context menus.enter + shiftAdd a new line (instead of sending) - most used in Messages and Slack.cmd + 0To return to the default (100%) zoom (most used in browsers).Search permalink cmd + eSelect a word, then use it as a search query.cmd + gNavigate through each instance of the item you want to find. This is waaaaay better than using that tiny dropdown arrow for going to the next search.Dexter like shortcuts permalink (from the TV series Dexter, doggy dude, very quick with hiding his apps/windows/tabs every time someone unexpectedly barged into his office. )cmd + ctrl + qLock your machine, a must when working in a non-home environment (or working on secretive birthday plans).cmd + hTo hide an app (it's still opened), but unlike minimize, you don't have it seen opened in the dock (to the right of that vertical bar).Custom shortcuts permalink Turn notifications on/off (especially useful when you are sharing your screen 😅)I have that wired to:caps lock + mForward delete:caps lock + backspace'''
author = "Eva Dee"
year_published = 2021
clearnet = "https://includejs.dev/notes/mac-os-shortcuts"
category = "research"
