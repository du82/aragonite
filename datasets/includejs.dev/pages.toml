full_description = '''Missing Semester 05 - Command-Line EnvironmentJob control, terminal multiplexers, dotfiles, and remote machines 🤓.Written by Eva Dee on 4th of October 2020 (about a 3 minute read).📹 YouTube Link✏️ Official Notes1. Job Control permalink SIGINT: Term Interrupt from keyboard (ctrl + c)SIGQUIT: Core Quit from keyboard (ctrl + \)SIGHUP: Terminal line hangup (if you close your terminal, but things - e.g. servers - are still running in the background)SIGKILL: Term Kill signal - be vary, can lead to orphan processesSIGTERM: Term Termination signalSIGSTOP: Stop process ctrl + zWe can then continue the paused job in the foreground or in the background using fg or bg.Misc permalink sleep 20 Put the process to sleep for 20 seconds.jobsThe jobs command lists the unfinished jobs associated with the current terminal session.killSends a signal to a process, usually related to stopping the process, e.g. SIGKILL is kill -9 [pid]. All signals except for SIGKILL and SIGSTOP can be intercepted by the process to perform a clean exit.If you add & to the end of a terminal command, it will start the execution in the background.🤔 What does ctr + d do?It sends an EOF (end-of-file) marker, unless disabled by an option, this will close the current shell (EXIT).2. Terminal Multiplexers permalink Terminal multiplexers like tmux allow you to multiplex terminal windows using panes and tabs so you can interact with multiple shell sessions.The most popular terminal multiplexer these days is tmux. To operate tmux you'll have to learn keybindings.tmux terminology:sessions: a session is an independent workspace with one or more windowswindows: Equivalent to tabs in editors or browsers, they are visually separate parts of the same sessionpanes: Like vim splits, panes let you have multiple shells in the same visual display.🤔 What is emacs?The extensible, customizable, self-documenting, real-time display editor (aka a powerful and highly customizable text editor)3. Dotfiles permalink aliasA shell alias is a short form for another command that your shell will replace automatically for you. You can alias a command to that same command with your favorite flags: e.g. mv -iExamples of programs with dotfiles:bash - ~/.bashrc, ~/.bash_profilegit - ~/.gitconfigvim - ~/.vimrc and the ~/.vim folderssh - ~/.ssh/configtmux - ~/.tmux.conf4. Remote machines permalink sshStands for Secure shell and is a program for logging into a remote machine and for executing commands on a remote machine.ssh username@remote_hostConnect to a remote server.ssh-keygenTo generate ssh keys.'''
