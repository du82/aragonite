["https://includejs.dev/notes/git-mistakes"]
title = "Fix Common Git Mistakes - includeJS"
description = "Stuff I learned from the Egghead course Fix Common Git Mistakes"
full_description = "Fix Common Git MistakesStuff I learned from the Egghead course Fix Common Git MistakesWritten by Eva Dee on 29th of February 2020 (about a 3 minute read).git commit --amend -m [commit message]To fix the commit message (before pushing).This also works if you want to add more files to a commit.git log --onelineDisplay logs in one line.git reset HEAD [filename]To unstage a specific file.git diff origin/master HEADTo see the difference between the currrent working directoy and master.git reset [commit hash] OR git reset HEAD~1(for one commit back)It's recommended that you use reset only on branches you haven't pushed yet.git reset --softUndoes the commit, but changes are still staged.git reset --mixed OR git resetRemoves the commit and unstages the changes.git reset --hardRemoves the commit, unstages the stages and removes them from the working directory.git reflogTo see all the changes done in your git repository.git reset --hard [commit hash]You will reset to a speficic commit.git revert [commit hash]You shouldn't reset commits you've already pushed (that's changing history), instead do a revert.git branch -vvVerbose output.git push --set-upstream origin my-branchEqual to: git push -u origin my-branchgit cherry-pick [commit hash]For copying a commit from one branch to another.git stash pop AND git stash applyTo apply the changes from the stash (apply keeps the changes in the stash). With git stash pop the changes normally go away (but not in case of a merge conflict)git stash drop [commit hash]To remove changes from a stash.git checkout -b branchIf you want to explore a commit, but get rid of the dettached HEAD state, you can checkout the commit as it's own branch.git remote prune origin --dry-runCheck which branches will be disassociated with the master locally after you've merged them into the remote master. Then run: git remote prune origin and afterwards: git branch -d [branch name]git rebase -i HEAD~3To interactively rebase the last three commits.git rm -r --cached .Remove all files from the git repository. Afterward run git add . to add them all back in (this is for applying the gitignore file to the files that have been added before gitignore).git rebase -i HEAD~2To add a file to a previous commit get into the interactive rebase mode, then choose edit for that specific commit. Do your changes, then do git commit --amend --no-edit (to keep the same commit message) and then git rebase --continue.git rebase -i HEAD~2For squashing commits.For completely removing a file from the github history."
