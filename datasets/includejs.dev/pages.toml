["https://includejs.dev/notes/opinionated-react-03"]
title = "The Opinionated Guide to React 03 - ReactJS project starters - includeJS"
description = "On Create React App, Gatsby and Next"
full_description = '''The Opinionated Guide to React 03 - ReactJS project startersOn Create React App, Gatsby and NextWritten by Eva Dee on 23rd of November 2020 (about a 3 minute read).Create React App permalink 🟢 Pros:maintained by the React teamthe fastest way to get started and have some React code show up on your pagesupports most CSS pre-processors Supports PWAeasily updatable with new features Support for SVG as React Components🔴 Cons:not very extensible because you don't have access to the webpack or even babel config (unless you eject)Not a lot of flexibility when it comes to changing the way it handles file typesno Server-Side Rendering (SSR) Supportno decisions from the React team in terms of app building, so all the router, state management, and other choices will be up to you.🤔 What is server-side rendering?Server-side rendering (also called static pre-rendering), also called SSR, is the ability of a JavaScript application to render on the server rather than in the browser.🤔 Server-side- vs client-side rendering?SSR means you run javascript on your server and render the app to HTML before sending it to the client. Just like a traditional web server would, except you also send the raw data required to render the page and use that to "hydrate" your application on the client.CSR means you forego all that, use whatever for your server, and just let the browser render the page. Since the HTML response body from the server will then be practically nothing but an empty HTML structure with a script tag, crawlers that don't run javascript will have no idea what's going on on your page.More hereNext permalink 🟢 Pros:a shortcut to making server-side rendered (SSR) - supported out of the box - applications in Reacthas routing and styling defaults (but you can choose your own)the option to change the babel config (.babelrc)get started with the CLI (npx create-next-app)amazing docs with lessons to followproduction-gradecustomization options🔴 Cons:a steep learning curve, mostly because SSR things are just harderharder to leave if Next is not the best tool for your projectNotes from the FrontEndMasters courseGatsby permalink 🟢 Pros:you can pull data from anywhere to make static siteshas a CLI: npx gatsby new gatsby-site.huge plugins ecosystemamazing documentationflexibility to tweak Gatsby internals to your needs Export to HTMLamazing community and team behind itfocus on performance and accessibility🔴 Cons:the steep learning curve for any advanced thingsknowledge of GraphQL required to get startednot everything can be staticsome errors only show up on build or deploy🤔 What are the benefits of static sites?better SEO (the app is pre-rendered HTML, so everything gets read by Google to rank your site better)ease of deployment (compared to server-side applications)🤔 How do Gatsby and Next compare?"When something is static, I prefer to use Gatsby. When it's server-rendered, I go with Next."More also here'''
