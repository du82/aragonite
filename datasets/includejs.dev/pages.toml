["https://includejs.dev/notes/cs50-03"]
title = "CS50 Week 3: Algorithms - includeJS"
description = "On algorithms, Big O notation and other difficult stuff that I forgot the moment I learned 😅."
full_description = '''CS50 Week 3: AlgorithmsOn algorithms, Big O notation and other difficult stuff that I forgot the moment I learned 😅.Written by Eva Dee on 8th of December 2021 (about a 5 minute read).🔗 Course WebsiteBig O notation (O) permalink for describing the running time of algorithms (how many steps max will it take)O(n) - on the order of n🤔 And what's in the opposite end of Big O?Ω Greek Omega letter used to describe the best-case scenario (Ω of ...)They are both approximationsLinear search permalink Iterate across the array from left to right, trying to find the target element.for i from 0 to n-1 If i-th element is "value you are looking for" return truereturn falseBinary search permalink Given a sorted array, divide and conquer by systematically eliminating half of the remaining elements (phone book) in the search for the target element.if no items return falseif middle item is "value you are looking for" return trueelse if "value you are looking for" < middle item search left halfelse if "value you are looking for" > middle item search right halfSorting permalink In C you can't use == to compare two strings (yes for int and yes for char)instead you have to use a function like strcmp() found in <string.h> file🤔 What's a hertz?something that is done once per secondif your computer's CPU is 1 gigahertz, that means that it can do 1 billion things at a timeCustom types permalink 🤔 What is a struct? It's a container inside which you can put multiple other data types.// define the structtypedef struct{ string name; string number;}person;// initialize the array people with length of two// using the person structperson people[2]// assign valuepeople[0].name = "Eva";people[0].number = "123-456-789";Selection sort permalink Find the smallest unsorted element in an array and swap it with the first unsorted element of that array.The amount of work will decrease with each iteration.However, you can't short circuit and quit the work even if all the elements are already swappedfor i from 0 to n-1 find smallest item between i'th item and last item swap the smallest item with the i'th itemBubble sort permalink Swap the adjacent pairs of elements if they are out of order, effectively bubbling larger elements to the right and smaller ones to the left.Repeat n-1 times for i from 0 to n-2 if i'th and i+1'th elements out of order swap them if no swaps QuitMerge sort permalink Split the full array into subarrays, then merge those subarrays back together in the correct order.Meaning that in an array of size 8, you'll start with 8 lists of size 1You'll need some temporary arrays to help you with sorting, meaning you'll be needing at least twice as much spaceif only one item returnelse sort left half of items sort right half of items merge sorted halvesInsertion sort permalink Proceed once through the array from left to right, shifting elements as necessary to insert each element into its correct place.🤔 How do the algorithms compare In terms of running time (slowest -> fastest)?In terms of Big O:O(n2) bubble sort, selection sort, insertion sortO(n log n) merge sortO(n) linear searchO(log n) binary searchO(1)In terms of Ω:Ω(n2) selection sortΩ(n log n) merge sortΩ(n) bubble sort, insertion sortΩ(log n)Ω(1) linear search, binary searchθ Theta permalink for describing algorithms where O andΩ values are the sameθ(n2) selection sortθ(n log n) merge sortθ(n)θ(log n)θ(1)Recursion permalink A function calling itself.Classic example is the factorial: fact(n) = n * fact(n-1)Every factorial has two cases:base case: when triggered, will terminate the recursive processrecursive case: which is where recursion actually occursint fact(int n){ if (n == 1) return 1; else // With single line returns, you can take the curly braces away. return n * fact(n-1)'}'''
author = "Eva Dee"
year_published = 2021
