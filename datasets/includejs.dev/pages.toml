title = "You Don't Know JS: Book 2 (Scope and Closure) - 04 Around the Global Scope - includeJS"
description = "JavaScript global scope and built-ins in different environments (browser, engine, dev tools, node)."
full_description = '''You Don't Know JS: Book 2 (Scope and Closure) - 04 Around the Global ScopeJavaScript global scope and built-ins in different environments (browser, engine, dev tools, node).Written by Eva Dee on 14th of June 2021 (about a 10 minute read).📕 GitHub LinkGlobal scope permalink The global scope is an important glue in practically every JS application.In modern browsers, multiple JS files are stitched together using one of the three following ways:1. ES modules permalink files are loaded individually by the JS environmenteach module then imports references to whichever other modules it needsThe relations between modules are called dependencies. When a module needs a piece from another module, it is said to depend on that module.i.e., Modules are expected to export what they want to be accessible from outside and import what they need.files only cooperate through shared imports; no need for shared outer scope2. Using a bundler (like web pack) permalink files are typically concatenated together into one big file before delivery to the browser and JS engineadditional mechanism needed for resolving namespaces via a wrapper function// this establishes an application-wide scope// a stand-in for the global scope(function wrappingOuterScope(){ var moduleOne = (function one(){ // .. })(); var moduleTwo = (function two(){ // .. function callModuleOne() { moduleOne.someMethod(); } // .. })();})();🤔 But, what do build tools actually do?Take a “main” module, the one intended to be put in <script type="module"> in HTML.Analyze its dependencies: imports as well as imports of imports etc.Build a single file with all modules (or multiple files, that’s tunable), replacing native import calls with bundler functions, so that it works. Special module types like HTML/CSS modules are also supported.In the process, other transformations and optimizations may be applied:Unreachable code removed.Unused exports removed (aka tree-shaking).Development-specific statements like console and debugger removed.Modern, bleeding-edge JavaScript syntax may be transformed to older one with similar functionality using Babel.The resulting file is minified (spaces removed, variables replaced with shorter names, etc).3. Via global scope permalink // the modules are dropped onto the global scope// this is same as loading files separatelyvar moduleOne = (function one(){ // ..})();var moduleTwo = (function two(){ // .. function callModuleOne() { moduleOne.someMethod(); } // ..})();Built-ins (that live in global) permalink 1. JS built-ins permalink primitives: undefined, null, Infinity, NaNnatives: Date(), Object(), String(), etc.global functions: eval(), parseInt(), etc.namespaces: Math, Atomics, JSONfriends of JS: Intl, WebAssembly2. JS-engine built-insconsole (and its methods)the DOM (window, document, etc)timers (setTimeout(..), etc)web platform APIs: navigator, history, geolocation, WebRTC, etc.🤔 And what about Node?Node also exposes several elements "globally," but they're technically not in the global scope: require(), __dirname, module, URL, and so on.But where does it live? 🏠 permalink it's not as simple as saying: the outermost portion of a filedifferent JS environments handle the scopes differentlyBrowser Window// In a browser, global functions and variables// declared with var (not let/const!) become// the property of the global objectvar studentName = "Kyle";function hello() { console.log(`Hello, ${ studentName }!`);}hello();// Hello, Kyle!// The variables will be loaded as properties on// the `window` object (so you can do `window.hello()`)the code may be loaded via:inline <script> tag<script src=..> tag in the markupdynamically created <script>❗ Using global variables is generally discouraged. There should be as few global variables as possible.🤔 We use the global object to test for support of modern language features.if (!window.Promise) { alert("Your browser is really old!");}Global Shadowing Globalswindow.something = 42;// let declaration adds a something global variable but not a global object property// something lexical identifier shadows the something global object property// avoid this confusion by using var for globals (and let and const for block scopes)let something = "Kyle";console.log(something);// Kyleconsole.log(window.something);// 42To make our code future-proof and easier to understand, we should access properties of the global object directly, as window.xDOM Globals🤯 a DOM element with an id attribute automatically creates a global variable that references it.<ul id="my-todo-list"> <li id="first">Write a book</li> ..</ul>first;// <li id="first">..</li>window["my-todo-list"];// <ul id="my-todo-list">..</ul>What's in a (Window) Name?var name = 42;// because name is actually a pre-defined getter/setter on the window object,// which insists on its value being a string valueconsole.log(name, typeof name);// "42" stringWeb WorkersWeb Workers are a web platform extension on top of browser-JS behavior, which allows a JS file to run in a completely separate thread (operating system-wise) from the thread that's running the main JS program.It does not share the global scope with the main JS program.In a Web Worker, the global object reference is typically made using self.var studentName = "Kyle";let studentID = 42;function hello() { console.log(`Hello, ${ self.studentName }!`);}self.hello();// Hello, Kyle!self.studentID;// undefinedDeveloper Tools Console/REPL permalink There are differences in:The behavior of the global scopeHoistingBlock-scoping declarators (let / const ) when used in the outermost scopeES Modules (ESM) permalink // variables declared inside a module, are not trully global// they are module-globalvar studentName = "Kyle";function hello() { console.log(`Hello, ${ studentName }!`);}hello();// Hello, Kyle!export hello;Node permalink node treats every single .js file as a module (either ES module or CommonJS)which means that the top level of your Node programs is never actually the global scope// the var and function declarations are contained in that wrapping function's scope,// and are not treated as global variablesvar studentName = "Kyle";function hello() { console.log(`Hello, ${ studentName }!`);}hello();// Hello, Kyle!module.exports.hello = hello;The only way to add properties to the global environment is to use the global object.global is a reference to the real global scope object, somewhat like using window in a browser JS environment.global.studentName = "Kyle";function hello() { console.log(`Hello, ${ studentName }!`);}hello();// Hello, Kyle!module.exports.hello = hello;Global this permalink As of ES2020, JS has finally defined a standardized reference to the global scope object, called globalThisthat should be supported across all environments. It’s supported in all major browsers.Other links permalink JavaScript Info: Intro to modulesJavaScript Info: Global Object'''
