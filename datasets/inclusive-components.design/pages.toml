["https://inclusive-components.design/collapsible-sections"]
title = "Collapsible Sections"
description = "Collapsible sections are perhaps the most rudimentary of interactive design patterns on the web. All they do is let you toggle the visibility of content by clicking that content's label. Big whoop. Although the interaction is simple, it's an interaction that does not have a consistent native implementation across browsers"
full_description = '''Get the book! The Inclusive Components book is now available, with updated and improved content and demos. Collapsible sections are perhaps the most rudimentary of interactive design patterns on the web. All they do is let you toggle the visibility of content by clicking that content's label. Big whoop. Although the interaction is simple, it's an interaction that does not have a consistent native implementation across browsers — despite movement to standardize it. It is therefore a great "hello world" entry point into accessible interaction design using JavaScript and WAI-ARIA. So why am I talking about it now, after covering more complex components? Because this article will focus on developer and author experience: we're going to make our collapsible regions web components, so they are easy to include as part of larger patterns and in content files. As we did when approaching tab interfaces, it helps to consider what our component would be in the absence of JavaScript enhancement and why that enhancement actually makes things better. In this case, a collapsible section without JavaScript is simply a section. That is: a subheading introducing some content — prose, media, whatever. <h2>My section</h2> <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Cras efficitur laoreet massa. Nam eu porta dolor. Vestibulum pulvinar lorem et nisl tempor lacinia.</p> <p>Cras mi nisl, semper ut gravida sed, vulputate vel mauris. In dignissim aliquet fermentum. Donec arcu nunc, tempor sed nunc id, dapibus ornare dolor.</p> One advantage of collapsing the content is that the headings become adjacent elements, giving the user an overview of the content available without having to scroll nearly so much. Expanding the content is choosing to see it. Another advantage is that keyboard users do not have to step through all of the focusable elements on the page to get to where they want to go: Hidden content is not focusable. The adapted markup Just attaching a click handler to the heading for the purposes of expanding the associated content is foolhardy, because it is not an interaction communicated to assistive software or achievable by keyboard. Instead, we need to adapt the markup by providing a standard button element. <h2><button>My section</button></h2> <div> <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Cras efficitur laoreet massa. Nam eu porta dolor. Vestibulum pulvinar lorem et nisl tempor lacinia.</p> <p>Cras mi nisl, semper ut gravida sed, vulputate vel mauris. In dignissim aliquet fermentum. Donec arcu nunc, tempor sed nunc id, dapibus ornare dolor.</p> </div> (Note: I have wrapped the content in a <div>, in preparation for showing and hiding it using the script to follow.) The button is provided as a child of the heading. This means that, when a screen reader user focuses the <button>, the button itself is identified but also the presence of its parent: "My section, button, heading level 2" (or similar, depending on the screen reader). Had we instead converted the heading into a button using ARIA's role="button" we would be overriding the heading semantics. Screen reader users would lose the heading as a structural and navigational cue. In addition, we would have to custom code all of the browser behaviors <button> gives us for free, such as focus (see tabindex in the example below) and key bindings to actually activate our custom control. <!-- DON'T do this --> <h2 role="button" tabindex="0">My section</h2> State Our component can be in one of two mutually exclusive states: collapsed or expanded. This state can be suggested visually, but also needs to be communicated non-visually. We can do this by applying aria-expanded to the button, initially in the false (collapsed) state. Accordingly, we need to hide the associated <div> — in this case, with hidden. <h2><button aria-expanded="false">My section</button></h2> <div hidden> <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Cras efficitur laoreet massa. Nam eu porta dolor. Vestibulum pulvinar lorem et nisl tempor lacinia.</p> <p>Cras mi nisl, semper ut gravida sed, vulputate vel mauris. In dignissim aliquet fermentum. Donec arcu nunc, tempor sed nunc id, dapibus ornare dolor.</p> </div> Some make the mistake of placing aria-expanded on the target element rather than the control itself. This is understandable since it is the content that actually switches state. But, if you think about it, this wouldn't be any good: the user would have to find the expanded content — which is only possible if it's actually expanded! — and then look around for an element that might control it. State is, therefore, communicated through the control that one uses to switch it. Is that all the button ARIA? Why yes. We don't need to add role="button" because the <button> element implicitly has that role (the ARIA role is just for imitating the native role). And unlike menu buttons, we are not instigating an immediate change of context by moving focus. Therefore, aria-haspopup is not applicable. Some folks add aria-controls and point it to the content container's id. Be warned that aria-controls only works in JAWS at the time of writing. So long as the section's content follows the heading/button in the source order, it isn't needed. The user will (immediately) encounter the expanded content as they move down the page. Styling the button We've created a situation wherein we've employed a button, but a button that should look like an enhanced version of the heading it populates. The most efficient way to do this is to eradicate any user agent and author styles for buttons, forcing this button to inherit from its heading parent. h2 button { all: inherit; } Great, but now the button has no affordance. It doesn't look like it can be activated. This is where, conventionally, a plus/minus symbol is incorporated. Plus indicates that the section can be expanded, and minus that it may be collapsed. The text label and/or icon for a button should always show what pressing that button will do, hence the minus sign in the expanded state indicating that the button will take the section content away. The question is: how do we render the icon? The answer: as efficiently and accessibly as possible. Simple shapes such as rectangles (<rect>) are a highly efficient way to create icons with SVG, so let's do that. <svg viewBox="0 0 10 10"> <rect height="8" width="2" y="1" x="4"/> <rect height="2" width="8" y="4" x="1"/> </svg> There, that's small enough to fit in a tweet. Since state is communicated via the aria-expanded attribute non-visually, we don't need this graphic to be screen reader accessible or interactive. In which case, we need to add a couple more attributes. <button aria-expanded="false"> My section <svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"> <rect class="vert" height="8" width="2" y="1" x="4" /> <rect height="2" width="8" y="4" x="1" /> </svg> </button> aria-hidden="true" hides the SVG from screen readers and other assistive technologies focusable="false" addresses the issue that Internet Explorer/Edge make SVGs focusable by default Note the class of "vert" for the rectangle that represents the vertical strut. We're going to target this with CSS to show and hide it depending on the state, transforming the icon between a plus and minus shape. [aria-expanded="true"] .vert { display: none; } Tying state and its visual representation together is a very good thing. It ensures that state changes are communicated interoperably. Do not listen to those who advocate the absolute separation of HTML semantics and CSS styles. Form should follow function, and directly is most reliable. Note that the default focus style was removed with inherit: all. We can delegate a focus style to the SVG with the following. h2 button:focus svg { outline: 2px solid; } High contrast themes One more thing: We can ensure the <rect> elements respect high contrast themes. By applying a fill of currentColor to the <rect> elements, they change color with the surrounding text when it is affected by the theme change. [aria-expanded] rect { fill: currentColor; } To test high contrast themes against your design on Windows, search for High contrast settings and apply a theme from Choose a theme. Many high contrast themes invert colors to reduce light intensity. This helps folks who suffer migraines or photophobia as well as making elements clearer to those with vision impairments. Why not use <use>? If we had many collapsible regions on the page, reusing the same SVG <pattern> definition via <use> elements and xlink:href would reduce redundancy. <button aria-expanded="false"> My section <svg viewBox="0 0 10 10 aria-hidden="true" focusable="false"> <use xlink:href="#plusminus"/> </svg> </button> Unfortunately, this would mean we could no longer target the specific .vert rectangle to show and hide it. By using little code to define each identical SVG, this is not a big problem in our case. A small script Given the simplicity of the interaction and all the elements and semantics being in place, we need only write a very terse script: (function() { const headings = document.querySelectorAll('h2') Array.prototype.forEach.call(headings, heading => { let btn = heading.querySelector('button') let target = heading.nextElementSibling btn.onclick = () => { let expanded = btn.getAttribute('aria-expanded') === 'true' || false btn.setAttribute('aria-expanded', !expanded) target.hidden = expanded } }) })() Here's an accompanying CodePen demo: See the Pen <a href='https://codepen.io/heydon/pen/QqzRvQ/'>Collapsible sections</a> by Heydon (<a href='https://codepen.io/heydon'>@heydon</a>) on <a href='https://codepen.io'>CodePen</a>. Progressive enhancement The trouble with the above script is that it requires the HTML to be adapted manually for the collapsible sections to work. Implemented by an engineer as a component via a template/JSX, this is expected. However, for largely static sites like blogs there are two avoidable issues: If JavaScript is unavailable, there are interactive elements in the DOM that don't do anything, with semantics that therefore make no sense. The onus is on the author/editor to construct the complex HTML. Instead, we can take basic prose input (say, written in markdown or in a WYSIWYG) and enhance it after the fact with the script. This is quite trivial in jQuery given the nextUntil and wrapAll methods, but in plain JavaScript we need to do some iteration. Here's another CodePen that automatically adds the toggle button and groups the section content for toggling. It targets all <h2>s found in the <main> part of the page. See the Pen <a href='https://codepen.io/heydon/pen/gGNaoM/'>Collapsible sections PE</a> by Heydon (<a href='https://codepen.io/heydon'>@heydon</a>) on <a href='https://codepen.io'>CodePen</a>. Why write it in plain JavaScript? Because modern browsers support Web API methods very consistently now, and because small interactions should not depend on large libraries. A progressive web component The last example meant we didn't have to think about our collapsible sections during editorial; they'd just appear automatically. But what we gained in convenience, we lost in control. Instead, what if there was a compromise wherein there was very little markup to write, but what we did write let us choose which sections should be collapsible and what state they should be in on page load? Web components could be the answer. Consider the following: <toggle-section open="false"> <h2>My section</h2> <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Cras efficitur laoreet massa. Nam eu porta dolor. Vestibulum pulvinar lorem et nisl tempor lacinia.</p> <p>Cras mi nisl, semper ut gravida sed, vulputate vel mauris. In dignissim aliquet fermentum. Donec arcu nunc, tempor sed nunc id, dapibus ornare dolor.</p> </toggle-section> The custom element name is easy to remember, and the open attribute has obvious implications. Better still, where JavaScript is unavailable, this outer element is treated like a mere <div> and the collapsible section remains a simple section. No real harm done. In fact, if we detect support for the <template> element and attachShadow within our script, the same fallback will be presented to browsers not supporting these features. if ('content' in document.createElement('template')) { // Define the <template> for the web component if (document.head.attachShadow) { // Define the web component using the v1 syntax } } The template We could place a template element in the markup and reference it, or create one on the fly. I'm going to do the later. tmpl.innerHTML = ` <h2> <button aria-expanded="false"> <svg aria-hidden="true" focusable="false" viewBox="0 0 10 10"> <rect class="vert" height="8" width="2" y="1" x="4"/> <rect height="2" width="8" y="4" x="1"/> </svg> </button> </h2> <div class="content" hidden> <slot></slot> </div> <style> h2 { margin: 0; } h2 button { all: inherit; box-sizing: border-box; display: flex; justify-content: space-between; width: 100%; padding: 0.5em 0; } button svg { height: 1em; margin-left: 0.5em; } [aria-expanded="true"] .vert { display: none; } [aria-expanded] rect { fill: currentColor; } </style> ` This template content will become the Shadow DOM subtree for the component. By styling the collapsible section from within its own Shadow DOM, the styles do not affect elements in Light DOM (the standard, outer DOM). Not only that, but they are not applied unless the browser supports <template> and custom elements. Defining the component Note the <slot> element in the template HTML, which is a window to our Light DOM. This makes it much easier to wrap the content provided by the author than in the previous progressive enhancement demo. Inside the component definition, this.innerHTML refers to this Light DOM content. We shall create a shadowRoot and populate it with the template's content. The Shadow DOM markup is instead found with this.shadowRoot.innerHTML. class ToggleSection extends HTMLElement { constructor() { super() this.attachShadow({ mode: 'open' }) this.shadowRoot.appendChild(tmpl.content.cloneNode(true)) } } With these references, we can move Light DOM to Shadow DOM. Which means we can repurpose the Light DOM <h2>'s label and eliminate the now superfluous element. It probably seems dirty doing this DOM manipulation — especially when you're used to simple, declarative (React) components. But it's what makes the web component progressive. this.btn = this.shadowRoot.querySelector('h2 button') var oldHeading = this.querySelector('h2') var label = oldHeading.textContent this.btn.innerHTML = label + this.btn.innerHTML oldHeading.parentNode.removeChild(oldHeading) Actually, we can do one better and support different introductory heading levels. Instead of targeting headings at all, we can just get the first element in the Light DOM. Making sure the first element is a heading would be a matter for editorial guidance. However, i'''
year_published = 2017
year_updated = 2017
