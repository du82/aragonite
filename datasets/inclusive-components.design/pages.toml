description = "Let's use a question/answer format for this because it's easier. What is inclusive-components.design? A blog trying to be a pattern library, with a focus on inclusive design. Each post explores a common interface component and comes up with a better, more robust and accessible version of it. Why?"
full_description = "About The Project Let's use a question/answer format for this because it's easier. What is inclusive-components.design? A blog trying to be a pattern library, with a focus on inclusive design. Each post explores a common interface component and comes up with a better, more robust and accessible version of it. Why? Because the web is full of interfaces which don't consider the diversity of abilities, circumstances, and preferences of their users. What do you mean by component? A module, a part of your interface, an entry in your pattern library. A bit of what you make as a designer and developer. What do you mean by inclusive design? I wrote What The Heck Is Inclusive Design? for 24 Ways to answer that question. Is there a book about this kind of thing? I'm glad you asked. Yes, I wrote Inclusive Design Patterns. Who are you? I'm Heydon Pickering. If you want to hire me, read this first. I'm the accessibility editor for Smashing Magazine. I've been building interfaces for the web for over 10 years. Is there a Twitter account to follow? Yes! @inclusicomps. ❤ Friends of @inclusicomps ❤ @mfairchild365 @kevtiq @Long_Lazuli @laura_shields @f_papado @marcospeebles @jina @invisionapp @jina @2urface @mrchrisadams @AndyKKirk @steverowling @gorghoa @chrislaursen @oskarwestinTO @schofeld @kleinfreund @wcagtest @bakkenbaeck @a11ycob @IAmAdamTaylor @petervangrieken @webfactory @mdcpepper @hankchizljaw @_ericthayer @zellwk @upstatement @scott_gruber @ShiftCph @clearleft @souporserious @Kraig_Walker @jshvgt @mattdistefano @scottohara @huijkman @smarteru + Your name here and a follow back for $15 per article"
