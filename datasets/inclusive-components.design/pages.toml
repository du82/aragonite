["https://inclusive-components.design/a-content-slider"]
title = "A Content Slider"
description = "Carousels (or 'content sliders') are like men. They are not literally all bad — some are even helpful and considerate. But I don't trust anyone unwilling to acknowledge a glaring pattern of awfulness. Also like men, I appreciate that many of you would rather just avoid dealing with carousels, but often"
full_description = '''Get the book! The Inclusive Components book is now available, with updated and improved content and demos. Carousels (or 'content sliders') are like men. They are not literally all bad — some are even helpful and considerate. But I don't trust anyone unwilling to acknowledge a glaring pattern of awfulness. Also like men, I appreciate that many of you would rather just avoid dealing with carousels, but often don't have the choice. Hence this article. Carousels don't have to be bad, but we have a culture of making them bad. It is usually the features of carousels, rather than the underlying concept that is at fault. As with many things inclusive, the right solution is often not what you do but what you don't do in the composition of the component. Here, we shall be creating something that fulfills the basic purpose of a carousel — to allow the traversal of content along a horizontal axis — without being too reverential about the characteristics of past implementations. Control In the broadest terms, any inclusive component should be: Clear and easy to use Interoperable with different inputs and outputs Responsive and device agnostic Performant Under the user's control That last point is one I have been considering a lot lately, and it's why I added "Do not include third parties that compromise user privacy" to the inclusive web design checklist. As well as nefarious activities, users should also be protected from unexpected or unsolicited ones. This is why WCAG prescribes the 2.2.2 Pause, Stop, Hide criterion, mandating the ability to cease unwanted animations. In carousel terms, we're talking about the ability to cease the automatic cycling of content 'slides' by providing a pause or stop button. It's something, but I don't think it's good enough. You're not truly giving control, you're relinquishing it then handing it back later. For people with vestibular disorders for whom animations can cause nausea, by the time the pause button is located, the damage will have been done. For this reason, I believe a truly inclusive carousel is one that never moves without the user's say-so. This is why I prefer the term 'content slider' — accepting that the operative slider is the user, not a script. Carousels start and stop moving as they see fit. Our slider will not slide except when slid. But how is sliding instigated? Multimodal interaction 'Multimodal' means "can be operated in different ways". Supporting different modes of operation may sound like a lot of work, but browsers are multimodal by default. Unless you screw up, all interactive content can be operated by mouse, keyboard, and (where supported) touch. By deferring to standard browser behavior, we can support multimodality in our content slider with very little effort. Horizontal scrolling The simplest conceivable content slider is a region containing unwrapped content laid out on a horizontal axis, traversable by scrolling the region horizontally. The declaration overflow-x: scroll does the heavy lifting. .slider { overflow-x: scroll; } .slider li { display: inline-block; white-space: nowrap; } Save for some margins and borders to improve the appearance of the slider, this is a serviceable MVP (Minimum Viable Product) for mouse users. They can scroll by pulling at a visible scrollbar, or by hovering over the slider and using trackpad gestures. And that animation is smooth too, because it's the browser doing it, not a JavaScript function fired every five milliseconds. (Where no scrollbar is visible, affordance is not so obvious. Don't worry, I'll deal with that shortly.) Keyboard support For mouse users on most platforms, hovering their cursor over the slider is enough to enable scrolling of the hovered element. For touch users, simply swiping left and right does the trick. This is the kind of effortless multimodality that makes the web great. For those using the keyboard, only when the slider is focused can it be interacted with. Under normal circumstances, most elements do not receive focus my default — only designated interactive elements such as links and <button>s. Elements that are not interactive should not be directly focusable by the user and, if they are, it is a violation of WCAG 2.4.3 Focus Order. The reason being that focus should precede activation, and if activation is not possible then why put the element in the user's hand? To make our slider element focusable by the user, we need to add tabindex="0". Since the (focused) element will now be announced in screen readers, we ought to give it a role and label, identifying it. In the demos to follow, we'll be using the slider to show artworks, so "gallery" seems apt. <div role="region" aria-label="gallery" tabindex="0"> <!-- list of gallery pictures --> </div> The region role is fairly generic, but is suitable for sizable areas of content and its presence ensures that aria-label is supported correctly and announced. You can't just go putting aria-label on any inert <div> or <span>. Now that focus is attainable, the standard behavior of being able to scroll the element using the left and right arrow keys is possible. We just need a focus style to show sighted users that the slider is actionable: [aria-label="gallery"]:focus { outline: 4px solid DodgerBlue; outline-offset: -6px; /* compensates for 2px border */ } See the Pen <a href='https://codepen.io/heydon/pen/XzzaKv/'>Basic slider</a> by Heydon (<a href='https://codepen.io/heydon'>@heydon</a>) on <a href='https://codepen.io'>CodePen</a>. Standalone demo of the basic content slider. Affordance There are already a couple of things that tell the user this is a slidable region: the focus style, and the fact that the right-most image is usually cut off, suggesting there is more to see. Depending on how critical it is for users to see the hidden content, you may deem this enough — plus it keeps things terse code-wise. However, we could spell things out much more clearly. Inclusive design mantra: If in doubt, spell it out. We can do this by creating an 'instructions' element after the slider to reveal messages depending on the state of the slider itself. For instance, we could reveal a :hover specific message of "scroll for more". The adjacent sibling combinator (+) transcribes the :hover style to the .instructions element. #hover { display: none; } [aria-label="gallery"]:hover + .instructions #hover { display: block; } The :focus message can be done in much the same way. But we'll also want to associate this message to the slider region for people running screen readers. Whether or not the region is of interest to any one screen reader user is irrelevant. It gives more context as to what it is for should it be appealing to them. And they know better what they're avoiding if not. For this we can use our faithful aria-describedby property. We point it at the focus message element using its id as the value: <div role="region" aria-label="gallery" tabindex="0" aria-describedby="focus"> <!-- list of gallery pictures --> </div> <div class="instructions"> <p id="hover">scroll for more</p> <p id="focus">use your arrow keys for more</p> </div> Now, when focusing the gallery slider, screen readers will announce something similar to "gallery, region, use your arrow keys for more." As a further note on multimodality, be assured that screen reader users in "browse mode" (stepping through each element) will simply enter the region and traverse through each image in turn. In other words, the slider is multimodal even for screen reader users. The path of a screen reader user in browse mode is much the same as a keyboard user's path given linked/interactive slides. In either case, the browser/reader will slide the container to bring the focused items into view. Hover and focus? It's interesting sometimes what you find in testing. In my case, I noticed that when I both hovered and focused the slider, both messages appeared. Of course. As a refinement, I discovered I could concatenate the states (:hover:focus) and reveal a message that addresses both use cases at once. [aria-label="gallery"]:hover:focus + .instructions #hover-and-focus { display: block; } Using the general sibling combinator (~) I was able to make sure the other two messages were hidden (otherwise I'd see all three!): [aria-label="gallery"]:hover:focus + .instructions #hover-and-focus ~ * { display: none; } Try hovering, then clicking, the slider in this demo: See the Pen <a href='https://codepen.io/heydon/pen/MOoMox/'>Basic slider with kbd/mouse affordances</a> by Heydon (<a href='https://codepen.io/heydon'>@heydon</a>) on <a href='https://codepen.io'>CodePen</a>. Standalone version of the content slider with mouse and keyboard affordances/instructions. Handling the touch case So far the touch experience is poor: No instructions are provided by default and, when you start swiping, some devices show the focus message, unhelpfully referring to "arrow keys" which most likely don't exist. Handling the touch interaction case means first detecting if the user is operating by touch. Critically, we don't want to detect touch support at a device level, because so many devices support touch alongside other input methods. Instead, we just want to know if the user happens to be interacting by touch. This is possible by detecting a single touchstart event. Here's a tiny script (all the best scripts are!): window.addEventListener('touchstart', function touched() { document.body.classList.add('touch') window.removeEventListener('touchstart', touched, false) }, false) All the script does is detect an initial touchstart event, use it to add a class to the <body> element, and remove the listener. With the class in place, we can reveal a "swipe for more" message: .touch .instructions p { display: none !important; } .touch .instructions #touch { display: block !important; } (Note: The !important markers are there because I have simplified the selectors for readability, reducing their specificity in the process.) Slides Depending on your use case and content, you could just stop and call the slider good here, satisfied that we have something interoperable and multimodal that only uses about 100 bytes of JavaScript. That's the advantage of choosing to make something simple, from scratch, rather than depending on a one-size-fits-all library. But so far our slider doesn't really do "slides", which typically take up the full width of their container. If we handle this responsively, folks can admire each artwork in isolation, across different viewports. It would also be nice to be able to add some captions, so we're going to use <figure> and <figcaption> from now on. <li> <figure> <img src="[url]" alt="[description]"> <figcaption>[Title of artwork]</figcaption> </figure> </li> Let's switch to Flexbox for layout. [aria-label="gallery"] ul { display: flex; } [aria-label="gallery"] li { list-style: none; flex: 0 0 100%; } Just display: flex is all we need on the container because flex-wrap defaults to nowrap The 100% in the flex shorthand is the flex-basis, making each item take up 100% of the <ul> container. I'm making the <figure> a flex context too, so that I can center each figure's contents along both the vertical and horizontal axes. [aria-label="gallery"] figure { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 50vh; } That 50vh value is the only fixed(ish) dimension I am using. It's to make sure the slider has a reasonable height, but fits within the viewport. For the image and <figcaption> to always fit within the container, we make the image scale proportionately, but compensate for the predictable height of the <figcaption>. For this we can use calc: [aria-label="gallery"] figcaption { padding: 0.5rem; font-style: italic; } [aria-label="gallery"] img { max-width: 100%; max-height: calc(100% - 2rem); margin-top: 2rem; } With a padding of 0.5rem, the caption text becomes approximately 2rem high. This is removed from the flexible image's height. A margin-top of 2rem then re-centers the image. See the Pen <a href='https://codepen.io/heydon/pen/mqMvEY/'>Carousel with captions</a> by Heydon (<a href='https://codepen.io/heydon'>@heydon</a>) on <a href='https://codepen.io'>CodePen</a>. Standalone demo of the content slider with captions. Performance and lazy loading One of the most striking observations noted in the classic shouldiuseacarousel.com is that, of carousels that contain linked content, "1% clicked a feature. Of those, 89% were the first position." Even for auto-rotating carousels, the research shows that the number of clicks on slides proceeding the initial slide drops off dramatically. It is entirely likely that the first image in our content slider is the only one that most readers will ever see. In which case, we should treat it as the only image, and load subsequent images if the user chooses to view them. We can use IntersectionObserver, where supported, to load each image as each slide begins to scroll into view. Here's the script, with notes to follow: const slides = document.querySelectorAll('[aria-label="gallery"] li') const observerSettings = { root: document.querySelector('[aria-label="gallery"]') } if ('IntersectionObserver' in window) { const callback = (slides, observer) => { entries.forEach(entry => { if (!entry.isIntersecting) { return } let img = entry.target.querySelector('img') img.setAttribute('src', img.dataset.src) observer.unobserve(entry.target) }) } const observer = new IntersectionObserver(callback, observerSettings) slides.forEach(t => observer.observe(t)) } else { Array.prototype.forEach.call(slides, function (s) { let img = s.querySelector('img') img.setAttribute('src', img.getAttribute('data-src')) }) } In observerSettings we define the outer gallery element as the root. When <li> elements become visible within it, that's when we take action. We feature detect with 'IntersectionObserver' in window and just load the images straight away if not. Sorry, old browser users, but that's the best we can offer here — at least you get the content. For each slide that intersects, we set its src from the dummy data-src attribute in typical lazy loading fashion. Note that, so users do not see broken images on particularly slow networks, we provide a placeholder image as the original src value. This takes the form of a tiny SVG data URI: src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' /%3E" No JavaScript Currently, users with no JavaScript running are bereft of images because the data-src/src switching cannot occur. The simplest solution seems to be to provide <noscript> tags containing the images with their true src values already in place. <noscript> <img src="[url]" alt="[description]"> </noscript> See the Pen <a href='https://codepen.io/heydon/pen/Ebwjyo/'>Content slider with intersection observer</a> by Heydon (<a href='https://codepen.io/heydon'>@heydon</a>) on <a href='https://codepen.io'>CodePen</a>. Standalone demo of '''
