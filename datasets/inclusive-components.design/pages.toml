title = "A Todo List"
description = "According to tradition, each new javascript framework is put through its paces in the implementation of a simple todo list app: an app for creating and deleting todo list entries. The first Angular.js example I ever read was a todo list. Adding and removing items from todo lists demonstrates"
full_description = '''Get the book! The Inclusive Components book is now available, with updated and improved content and demos. According to tradition, each new javascript framework is put through its paces in the implementation of a simple todo list app: an app for creating and deleting todo list entries. The first Angular.js example I ever read was a todo list. Adding and removing items from todo lists demonstrates the immediacy of the single-page application view/model relationship. TodoMVC compares and contrasts todo app implementations of popular MV* frameworks including Vue.js, Angular.js, and Ember.js. As a developer researching technology for a new project, it enables you to find the most intuitive and ergonomic choice for your needs. The inclusive design of a todo list interface is, however, framework agnostic. Your user doesn’t care if it’s made with Backbone or React; they just need the end product to be accessible and easy to use. Unfortunately, each of the identical implementations in TodoMVC have some shortcomings. Most notably, the delete functionality only appears on hover, making it an entirely inaccessible feature by keyboard. In this article, I’ll be building an integrated todo list component from the ground up. But what you learn doesn’t have to apply just to todo lists — we’re really exploring how to make the basic creation and deletion of content inclusive. Unlike the simple, single element toggle buttons of the previous article, managed lists have a few moving parts. This is what we’re going to make: The heading A great deal of usability is about labels. The <label> element provides labels to form fields, of course. But simple text nodes provided to buttons and links are also labels: they tell you what those elements do when you press them. Headings too are labels, giving names to the sections (regions, areas, modules) that make up an interface. Whether you are creating a static document, like a blog post, or an interactive single-page application, each major section in the content of that page should almost certainly be introduced by a heading. Our todo list’s name, “My Todo List” in this case, should be marked up accordingly. <h1>My Todo List</h1> It’s a very on the nose way of demarcating an interface, but on the nose is good. We don’t want our users having to do any detective work to know what it is they’re dealing with. Heading level Determining the correct level for the heading is often considered a question of importance, but it’s actually a question of belonging. If our todo list is the sole content within the <main> content of the page, it should be level 1, as in the previous example. There’s nothing surrounding it, so it’s at the highest level in terms of depth. If, instead, the todo list is provided as supplementary content, it should have a level which reflects that. For example, if the page is about planning a holiday, a “Things to pack” todo list may be provided as a supplementary tool. Plan for my trip (<h1>) Places to get drunk (<h2>) Bars (<h3>) Clubs (<h3>) Things to pack (todo list) (<h2>) In the above example, both “Bars” and “Clubs” belong to “Places to get drunk”, which belongs to “Plan for my trip”. That’s three levels of belonging, hence the <h3>s. Even if you feel that your packing todo list is less important than establishing which bars are good to visit, it’s still on the same level in terms of belonging, so it must have the same heading level. As well as establishing a good visual hierarchy, the structure described by logically nested sections gives screen reader users a good feel for the page. Headings are also harnessed as navigational tools by screen readers. For example, in JAWS, the 2 key will take you to the next section labeled by an <h2> heading. The generic h key will take you to the next heading of any level. The <section> element With all this talk of sections, surely we should be using <section> elements, right? Maybe. Here are a couple of things to consider: Heading elements already describe sections. That is, the content that starts with a heading and ends just before a heading of the same level is a de facto section. If you do use a <section> element, you still need to provide a heading to it, otherwise it is an unlabeled section. In practice, the value added by <section> elements is limited, but still worth noting: Some screen readers will announce the start and end of sections when their users are traversing the page element-to-element. Some screen readers provide region navigation. For example, in JAWS, <section>s count as “regions” and can be moved between using r and Shift + r. They can make code organization clearer by providing container elements for sections of the page. To really make the most of <section>s you should label them recursively. That is, by connecting their headings to the <section> elements themselves using aria-labelledby: <section aria-labelledby="todos-label"> <h1 id="todos-label">My Todo List</h1> <!-- content --> </section> (Note that the aria-labelledby value must match the heading’s id value.) This effectively provides a group label to the section, meaning the label will be announced in some screen reader software upon entering the section by focus. Running the NVDA screen reader, when I enter the section and focus the first checkbox, I hear “My Todo List region, list with three items, pick up kids from school checkbox, checked.” It’s helpful to provide this contextual information to users navigating by focus rather than by region or heading. The list I talk about the virtues of lists in Inclusive Design Patterns. Alongside headings, lists help to give pages structure. Without headings or lists, pages are featureless and monotonous, making them very difficult to unpick both visually and non-visually. Not all lists need to be bullet lists, showing a list-style, but there should be some visual indication that the items within the list are similar or equivalent; that they belong together. Non-visually, using the <ul> or <ol> container means the list is identified when encountered and its items are enumerated. For our three-item todo list, screen readers should announce something like, “list of three items”. A todo list is, as the name suggests, a list. Since our particular todo list component makes no assertions about priority, an unordered list is fine. Here’s the structure for a static version of our todo list (the adding, deleting, and checking functionality has not yet been added): <section aria-labelledby="todos-label"> <h1 id="todos-label">My Todo List</h1> <ul> <li> Pick up kids from school </li> <li> Learn Haskell </li> <li> Sleep </li> </ul> </section> Empty state Empty states are an aspect of UI design which you neglect at your peril. Inclusive design has to take user lifecycles into consideration, and some of your most vulnerable users are new ones. To them your interface is unfamiliar and, without carefully leading them by the hand, that unfamiliarity can be off-putting. With our heading and “add” input present it may be obvious to some how to proceed, even without example todo items or instructions present. But your interface may be less familiar and more complex than this simple todo list, so let’s add an empty state anyway — for practice. Revealing the empty state It’s quite possible, of course, to use our data to determine whether the empty state should be present. In Vue.js, we might use a v-if block: <div class="empty-state" v-if="!todos.length"> <p>Either you've done everything already or there are still things to add to your list. Add your first todo &#x2193;</p> </div> But all the state information we need is actually already in the DOM, meaning all we need in order to switch between showing the list and showing the empty-state is CSS. .empty-state, ul:empty { display: none; } ul:empty + .empty-state { display: block; } This is more efficient because we don’t have to query the data or change the markup. It’s also screen reader accessible: display: none makes sure the element in question is hidden both visually and from screen reader software. All pseudo-classes pertain to implicit states. The :empty pseudo-class means the element is in an empty state; :checked means it’s in a checked state; :first-child means it’s positioned at the start of a set. The more you leverage these, the less DOM manipulation is required to add and change state with JavaScript. Adding a todo item We’ve come this far without discussing the adding of todos. Let’s do that now. Beneath the list (or empty state if the list is empty) is a text input and “add” button: Form or no form? It’s quite valid in HTML to provide an <input> control outside of a <form> element. The <input> will not succeed in providing data to the server without the help of JavaScript, but that’s not a problem in an application using XHR. But do <form> elements provide anything to users? When users of screen readers like JAWS or NVDA encounter a <form> element, they are automatically entered into a special interaction mode variously called “forms mode” or “application mode”. In this mode, some keystrokes that would otherwise be used as special shortcuts are switched off, allowing the user to interact with the form fields fully. Fortunately, most input types — including type="text" here — trigger forms mode themselves, on focus. For instance, if I were to type h in the pictured input, it would enter “h” into the field, rather than navigating me to the nearest heading element. The real reason we need a <form> element is because we’ll want to allow users to submit on Enter, and this only works reliably where a <form> contains the input upon which Enter is being pressed. The presence of the <form> is not just for code organization, or semantics, but affects browser behavior. <form> <input type="text" placeholder="E.g. Adopt an owl"> <button type="submit">Add</button> </form> (Note: Léonie Watson reports that range inputs are non-functional in Firefox + JAWS unless a <form> is employed or forms mode is entered manually, by the user.) Labeling Can you spot the deliberate mistake in the above code snippet? The answer is: I haven’t provided a label. Only a placeholder is provided and placeholders are intended for supplementary information only, such as the “adopt an owl” suggestion. Placeholders are not reliable as labeling methods in assistive technologies, so another method must be provided. The question is: should that label be visible, or only accessible by screen reader? In almost all cases, a visible label should be placed above or to the left of the input. Part of the reason for this is that placeholders disappear on focus and can be eradicated by autocomplete behavior, meaning sighted users lose their labels. Filling out information or correcting autocompleted information becomes guesswork. However, ours is a bit of a special case because the “add” label for the adjacent button is quite sufficient. Those looking at the form know what the input does thanks to the button alone. All inputs should have labels, because screen reader users don’t know to look ahead in the source to see if the submit button they’ve yet to reach gives them any clues about the form’s purpose. But simple input/submit button pairs like this and search regions can get away without visible labels. That is, so long as the submit button’s label is sufficiently descriptive. In addition, make sure forms with multiple fields have visible labels for each field. Otherwise the user does not know which field is for what. There are a number of ways to provide an invisible label to the input for screen reader users. One of the simpler and least verbose is aria-label. In the following example, “Write a new todo item” is the value. It’s a bit more descriptive than just “add”, which also helps to differentiate it from the button label, avoiding confusion when focus is moved between the two elements. <form> <input type="text" aria-label="Write a new todo item" placeholder="E.g. Adopt an owl"> <button type="submit">Add</button> </form> Placeholder styling Be aware that some user agents (browsers) provide very feint placeholder text, in grey, which can lead to a failure under WCAG 1.4.3 Contrast (Minimum). I recommend you style placeholders to have a higher contrast cross-browser and use an additional style — such as italicization in the pictured example — to help differentiate it from user-entered text. ::-webkit-input-placeholder { color: #444; font-style: italic; } ::-moz-placeholder { color: #444; font-style: italic; } :-ms-input-placeholder { color: #444; font-style: italic; } :-moz-placeholder { color: #444; font-style: italic; } The independent blocks are regrettably necessary because each browser has trouble parsing other browsers’ proprietary selectors. Submission behavior One of the advantages of using a <form> with a button of the submit type is that the user can submit by pressing the button directly, or by hitting Enter. Even users who do not rely exclusively on the keyboard to operate the interface may like to hit Enter because it’s quicker. What makes interaction possible for some, makes it better for others. That’s inclusion. If the user tries to submit an invalid entry we need to stop them. By disabling the <button> until the input is valid, submission by click or by Enter is suppressed. In fact, the type="submit" button stops being focusable by keyboard. In addition to disabling the button, we provide aria-invalid="true" to the input. Screen readers will tell their users the input is invalid, letting them know they need to change it. <form> <input type="text" aria-invalid="true" aria-label="Write a new todo item" placeholder="E.g. Adopt an owl"> <button type="submit" disabled>Add</button> </form> Feedback The deal with human-computer interaction is that when one party does something, the other party should respond. It’s only polite. For most users, the response on the part of the computer to adding an item is implicit: they simply see the item being added to the page. If it’s possible to animate the appearance of the new item, all the better: Some movement means its arrival is less likely to be missed. For users who are not sighted or are not using the interface visually, nothing would seem to happen. They remain focused on the input, which offers nothing new to be announced in screen reader software. Silence. Moving focus to another part of the page — the newly added todo, say — would cause that element to be announced. But we don’t want to move the user’s focus because they might want to forge ahead writing more todos. Instead we can use a live region. The feedback live region Live regions are elements that tell screen readers to announce their contents whenever those contents change. With a live region, we can make screen readers talk to their users without making those users perform any action (such as moving focus). Basic live regions are defined by role="status" or the equivalent aria-live="polite". T'''
year_published = 2017
year_updated = 2018
