["https://independent.co.uk/arts-entertainment/films/news/oscars-2025-when-watch-time-b2706880.html"]
title = "Oscars 2025 live: When and how to watch as Hollywood awaits biggest night of the year | The Independent"
description = "This year’s Oscar nominees include Demi Moore (’The Substance’), Timothée Chalamet (’A Complete Unknown’), Kieran Culkin (’A Real Pain’) and Ariana Grande (’Wicked’)"
full_description = '''Liveupdated{"lang":"en","timestamp":1740882442}CultureFilmNewsOscars 2025 live: When and how to tune in as Hollywood prepares for biggest night of the yearThis year’s Oscar nominees include Demi Moore (’The Substance’), Timothée Chalamet (’A Complete Unknown’), Kieran Culkin (’A Real Pain’) and Ariana Grande (’Wicked’)Tom Murrayin New YorkSaturday 01 March 2025 20:56 GMTComments{"articleId":"b2706880","hasBookmark":true,"hasFacebook":true,"isLoggedIn":false,"title":"Oscars 2025 live: When to tune in as Hollywood awaits biggest night of the year","url":"https://www.independent.co.uk/arts-entertainment/films/news/oscars-2025-when-watch-time-b2706880.html"}The Oscars | Overrated or Underrated?Your support helps us to tell the storyRead moreSupport NowFrom reproductive rights to climate change to Big Tech, The Independent is on the ground when the story is developing. Whether it's investigating the financials of Elon Musk's pro-Trump PAC or producing our latest documentary, 'The A Word', which shines a light on the American women fighting for reproductive rights, we know how important it is to parse out the facts from the messaging.At such a critical moment in US history, we need reporters on the ground. Your donation allows us to keep sending journalists to speak to both sides of the story.The Independent is trusted by Americans across the entire political spectrum. And unlike many other quality news outlets, we choose not to lock Americans out of our reporting and analysis with paywalls. We believe quality journalism should be available to everyone, paid for by those who can afford it.Your support makes all the difference.Read more{}The 2025 Academy Awards are right around the corner, ready to celebrate the best films and acting performances of the last year.Sunday’s ceremony will be hosted by Conan O’Brien, who takes over from Oscars stalwart Jimmy Kimmel.Nominations were announced in January with Netflix’s divisive musical Emilia Pérez leading the pack on 13 nominations, setting a record for a non-English-language film. Meanwhile, The Brutalist and Wicked tied with 10 nominations apiece. A Complete Unknown and Conclave followed with eight mentions each.In the acting categories, Demi Moore (The Substance), Timothée Chalamet (A Complete Unknown), Kieran Culkin (A Real Pain), and Ariana Grande (Wicked) are among the nominees.Emilia Pérez star Karla Sofía Gascón is also set to attend after sitting out most of awards season due to her racist tweet controversy.There is likely to be some kind of tribute to film icon Gene Hackman, whose death under “suspicious” circumstances at 95 is currently under investigation.This year’s ceremony will air on ABC and stream on Hulu at 7 p.m. ET/4 p.m. PT on Sunday. British viewers can tune in on ITV1 and ITVX.The Independent will be bringing you live updates from the Dolby Theatre in Hollywood, Los Angeles.Follow along below:Key pointsWho is nominated?How to watch the ceremonyThe Independent's Oscar predictionsWhat's in the Oscars gift bag?In 2000, 55 Oscars vanished from an LA dock. What happened next?When a pallet carrying a small army of 13-inch-tall golden men vanished 24 years ago, Academy bosses raised the alarm and the FBI joined the hunt. Ellie Harrison looks back on the strange tale, which features a dumpster diver, Hollywood handshakes and a $50,000 reward.In 2000, 55 Oscars trophies were stolen from an LA loading dock. What happened next?When a pallet carrying a small army of 13-inch-tall golden men vanished 24 years ago, Academy bosses raised the alarm and the FBI joined the hunt. Ellie Harrison looks back on the strange tale, which features a dumpster diver, Hollywood handshakes and a $50,000 rewardTom Murray2 March 2025 02:27An Oscar frontrunner is based on a true story – but whose truth is it?I’m Still Here is inspired by the “disappearance” of a real-life congressman in Seventies Brazil and directed by Walter Salles, a childhood friend of the congressman’s family. It’s just the latest in a strange sub-genre of historical fiction made by filmmakers with insider access, writes Xan Brooks – for better and for worse.An Oscar frontrunner is based on a true story – but whose truth is it?‘I’m Still Here’ is inspired by the ‘disappearance’ of a real-life congressman in Seventies Brazil, and directed by Walter Salles, a childhood friend of the congressman’s family. It’s just the latest in a strange sub-genre of historical fiction made by filmmakers with insider access, writes Xan Brooks – for better and for worseTom Murray2 March 2025 01:28Video: Timothée Chalamet calls his oscar nomination 'luminous'Timothée Chalamet calls his oscar nomination 'luminous'Tom Murray2 March 2025 00:29Why ‘Mean Girls with popes’ deserves to win the Oscar for Best PictureFilled with dramatic popes and nuns backstabbing one another behind closed doors, Edward Berger’s surprisingly spicy thriller ‘Conclave’ – starring Ralph Fiennes and Isabella Rossellini – should be rewarded on Hollywood’s biggest night.Lydia Spencer-Elliott goes to bat for the film here:Why Conclave deserves to win the Oscar for Best PictureFilled with dramatic popes and nuns backstabbing one another behind closed doors, Edward Berger’s surprisingly spicy thriller – starring Ralph Fiennes and Isabella Rossellini – should be rewarded on Hollywood’s biggest night, writes Lydia Spencer-ElliottJacob Stolworthy1 March 2025 23:20Why ‘Anora’ deserves to win Best PictureThe awards season staple features a star-making performance from 25-year-old Mikey Madison and a tone that oscillates between slapstick, romcom and bleak drama – and it’d be a worthy winner on Oscar night, writes Annabel Nugent.Why Anora deserves to win the Oscar for Best PictureThe awards season staple features a star-making performance from 25-year-old Mikey Madison and a tone that oscillates between slapstick, romcom and bleak drama – and it’d be a worthy winner on Oscar night, writes Annabel NugentJacob Stolworthy1 March 2025 22:3015 worst films that ever won Oscars, rankedAny belief that the Oscars award the right films, directors and performances has faded over the years.While every ceremony has a smattering of correct decisions – trophies handed to the right people for the right films – more often than not, the pervading feeling is one of pessimism caused by a deluge of undeserving recipients.Here are 15 of the most egregious examples:15 worst films that ever won Oscars, rankedJacob Stolworthy runs through 15 of the awards show’s most ridiculous victors... and what should have won insteadJacob Stolworthy1 March 2025 21:30Although every Oscars nominee won’t be a winner this weekend, they will each walk away with something special: a very pricey gift bag.Organised by Los Angeles-based entertainment company Distinctive Assets Legendary, this year’s gift bags for nominees were given a special title: “Everyone Wins.”But what’s inside the luxurious bags each of which is reportedly worth more than six figures?Amber Raiken investigates:What’s in the Oscars 2025 gift bag: LA wildfire relief and a luxury wellness retreatFrom luxury vacations to transformative skincare products, Oscar nominees won’t go home empty handed on SundayJacob Stolworthy1 March 2025 20:30Who will win this year’s Oscars? Our predictionsWill it be Demi Moore or Mikey Madison? Timothée Chalamet or Adrien Brody? And is ‘Emilia Pérez’ really, truly dead in the water? Ahead of tomorrow’s Academy Awards, Adam White predicts who will reign supreme in the show’s major categories.Who will win and who should win at this year’s OscarsWill it be Demi Moore or Mikey Madison? Timothée Chalamet or Adrien Brody? And is ‘Emilia Pérez’ really, truly dead in the water? Ahead of this Sunday’s Academy Awards, Adam White predicts who will reign supreme in the show’s major categoriesJacob Stolworthy1 March 2025 19:30An end to political acceptance speeches?In a world awash in war and fascism, Academy Award winners are having to navigate an impossible conundrum: do you talk about it all on stage, or ignore it entirely?Al Horner speaks to Hollywood insiders and Oscar winners Adam McKay and Graham Moore about the biggest elephant in the room this awards season.Read more here:Actors like to get political at the Oscars – this year many won’t dareIn a world awash in war and fascism, Academy Award winners are having to navigate an impossible conundrum: do you talk about it all on stage, or ignore it entirely? Al Horner speaks to Hollywood insiders and Oscar winners Adam McKay and Graham Moore about the biggest elephant in the room this awards seasonJacob Stolworthy1 March 2025 18:30‘The Independent’ has gone head-to-head on all things Oscars, to decide what’s overrated and what’s underrated.Watch along as Jacob Stolworthy and Annabel Nugent discuss Demi Moore’s long-awaited Best Actress nod, why Gladiator II might not be as bad as you think and *that* kiss between Adrien Brody and Halle Berry.We also ask: asre the Oscars overrated or an overly long snooze-fest? Let’s battle it out.The Oscars | Overrated or Underrated?We’re going head-to-head on all things Oscars, to decide what’s overrated and what’s underrated. Join Independent TV’s Jacob Stolworthy and Annabel Nugent as they discuss Demi Moore’s long-awaited Best Actress nod, why Gladiator II might not be as bad as you think, and *that* kiss between Adrien Brody and Halle Berry. The Oscars: overrated and overly long snooze-fest? Or an underrated classic in the cultural calendar? Let's battle it out. Jacob Stolworthy1 March 2025 17:30Newer1 / 3Older{"liveBlogId":1994860,"initialPosts":[{"type":"post","data":{"name":"1994860","title":"In 2000, 55 Oscars vanished from an LA dock. What happened next?","id":1997103,"uuid":"181f25df-66df-48a7-90e2-018b26fd14ee","scheduleTime":"1740882442","created":"1740862772","changed":"1740862772","container":1994860,"user":{"name":"Tom Murray"},"extra":{"authorName":"Tom Murray"}},"postJson":[{"type":"markup","data":{"marku