["https://independent.co.uk/arts-entertainment/films/news/betsy-arakawa-gene-hackman-wife-b2705918.html"]
title = "Betsy Arakawa death: The classical pianist who was married to Gene Hackman since 1991 | The Independent"
description = "The couple were found dead in their home in Santa Fe"
full_description = '''The Independent's journalism is supported by our readers. When you purchase through links on our site, we may earn commission. CultureFilmNewsBetsy Arakawa death: The classical pianist who was married to Gene Hackman since 1991The couple were found dead in their home in Santa Fe Lydia Spencer-ElliottFriday 28 February 2025 19:23 GMTComments{"articleId":"b2705918","hasBookmark":true,"hasFacebook":true,"isLoggedIn":false,"title":"Betsy Arakawa death: The classical pianist who was married to Gene Hackman since 1991","url":"https://www.independent.co.uk/arts-entertainment/films/news/betsy-arakawa-gene-hackman-wife-b2705918.html"}Gene Hackman and wife Betsy Arakawa found dead in their home in Santa FeYour support helps us to tell the storyRead moreSupport NowFrom reproductive rights to climate change to Big Tech, The Independent is on the ground when the story is developing. Whether it's investigating the financials of Elon Musk's pro-Trump PAC or producing our latest documentary, 'The A Word', which shines a light on the American women fighting for reproductive rights, we know how important it is to parse out the facts from the messaging.At such a critical moment in US history, we need reporters on the ground. Your donation allows us to keep sending journalists to speak to both sides of the story.The Independent is trusted by Americans across the entire political spectrum. And unlike many other quality news outlets, we choose not to lock Americans out of our reporting and analysis with paywalls. We believe quality journalism should be available to everyone, paid for by those who can afford it.Your support makes all the difference.Read more{}Fans were shocked when news broke that Gene Hackman had been found dead in his home in Santa Fe, New Mexico aged 95, alongside his wife Betsy Arakawa, 65, and their pet dog.No foul play is suspected but a cause of the couple’s death is yet to be determined, with police set to hold a press conference when further details are known. Hackman and Arakawa had been married since 1991 and reportedly began dating in the mid-Eighties after The French Connection star separated from his first wife, Faye Maltese in 1986.The actor met Arakawa, who was reportedly born in Hawaii in the early Sixties, at a gym in California, where she was working part time while pursuing a career in classical music, per The New York Times.By 1991, Hackman and Arakawa were living together in Santa Fe. In the same year, the Oscar winner underwent angioplasty after suffering congestive heart failure, which convinced him to retire from acting."I haven’t held a press conference to announce retirement, but yes, I’m not going to act any longer," he told Reuters in 2008. "I really don’t want to do it any longer."The Royal Tenenbaums star instead pivoted to writing, having published his first book, Wake of the Perdido Star, in 1999. Four other novels, including Payback at Morning Peak, followed.open image in gallery{"id":"trigger-autogallery-38803","index":0}Gene Hackman was found dead alongside his classical pianist wife Betsy Arakawa (2003 AP)In 2014, Hackman told the podcast Writer’s Bone that Arakawa helped refine his writing ability. “If in fact, I have a style, it came from repeated edits, friends’ suggestions, and my wife’s unwavering specific read-throughs,” he said.Arakawa had a successful career in her own right and was trained as a classical pianist. Alongside her musical talents, Hackman’s wife also helped design their Santa Fe home, which was featured in Architectural Digest in April 1990.Watch Apple TV+ free for 7 daysNew subscribers only. £8.99/mo. after free trial. Plan auto-renews until cancelledTry for freeWatch Apple TV+ free for 7 daysNew subscribers only. £8.99/mo. after free trial. Plan auto-renews until cancelledTry for freeWhile Hackman was busy filming, Arakawa procured furniture from boutiques around the world, including in New York, California and Germany. She would send him photos of each development, with Hackman determining the floor plan, paint colours and soft furnishings.Arakawa and Hackman opted for an open plan design using colonial New Mexico and Spanish Baroque styles. open image in gallery{"id":"trigger-autogallery-38804","index":1}The couple married in 1991 after meeting at a California gym where Arakawa worked (AP)By the time the project was complete, the abandoned 1950s block building was “light and soaring”, having previously been described by the architect Stephen Samuelson as “horrible”.Hackman’s wife had no social media presence and never gave interviews. “Where we live, in Santa Fe, you can lead your own life and not be bothered by the latest gossip,” the actor told the Irish Independent.However, the actor offered fans a slight glimpse into his home life in 2020 when he told Empire he and his wife regularly watched DVDs that Arakawa rented. “We like simple stories that some of the little low-budget films manage to produce,” he said. “Friday night is set aside for a Comedy Channel marathon, with particular attention paid to Eddie Izzard… The speed of thought is amazing.”open image in gallery{"id":"trigger-autogallery-38805","index":2}Hackman attributed his writing success to his wife and said she helped him find his literary style (AP)Arakawa and Hackman were found dead at their home in Santa Fe alongside their pet dog. The couple was previously reported to own multiple German shepherds.While Hackman was filming The Replacements in Baltimore in 2000, two strays wandered onto the set. The actor took them to a local shelter, which named the dogs Gene and Keanu after his co-stars. The couple adopted the one named Gene, per The Baltimore Sun.“We can confirm that both Gene Hackman and his wife were found deceased Wednesday,” the Santa Fe New Mexican County Sheriff, Adan Mendoza said in a statement on Thursday. “We do not believe foul play was a factor in their deaths; however, [the] exact cause of death has not been determined at this time.”More aboutBetsy ArakawaGene HackmanJoin our commenting forumJoin thought-provoking conversations, follow other Independent readers and see their repliesComments{"adUnitPath":"71347885/_main_independent/in_arts-entertainment/in_films/video/gallery_mpu_sb","autoGallery":true,"disableAds":false,"gallery":[{"data":{"title":"Gene Hackman","description":"FILE - Actor Gene Hackman arrives with his wife, Betsy Arakawa, for the 60th Annual Golden Globe Awards in Beverly Hills, Calif., Sunday, Jan. 19, 2003. (AP Photo/Mark J. Terrill, File)","caption":null,"copyright":"2003 AP","credit":"ASSOCIATED PRESS","alt":null,"url":"https://static.independent.co.uk/2025/02/27/10/Gene_Hackman_85882.jpg","id":"35baf73ba1b84f5e850ab42a099cdbba","mid":5292676,"uid":0,"extra":{"imageSize":{"width":1442,"height":1040}},"localCaption":"Gene Hackman was found dead alongside his classical pianist wife Betsy Arakawa","localCopyright":"2003 AP"},"type":"image"},{"data":{"title":"GENE HACKMAN-DECESO","description":"ARCHIVO - Gene Hackman y su esposa Betsy Arakawa en junio de 1993. (AP Foto, Archivo)","caption":null,"copyright":"AP","credit":"ASSOCIATED PRESS","alt":null,"url":"https://static.independent.co.uk/2025/02/27/09/GENE_HACKMAN-DECESO_79247.jpg","id":"f5103c892bfc405f997d5eb8de400ed8","mid":5292639,"uid":0,"extra":{"imageSize":{"width":2420,"height":1613}},"localCaption":"The couple married in 1991 after meeting at a California gym where Arakawa worked","localCopyright":"AP"},"type":"image"},{"data":{"title":"SEI241658242","description":"FILE - In this 1993 file photo, actor Gene Hackman is seen. (AP Photo/File)","caption":null,"copyright":"AP","credit":null,"alt":null,"url":"https://static.independent.co.uk/2025/02/27/9/09/SEI241658242.jpeg","id":null,"mid":5292548,"uid":5126,"extra":{"imageSize":{"width":2998,"height":2082},"sizes":[]},"localCaption":"Hackman attributed his writing success to his wife and said she helped him find his literary style","localCopyright":"AP"},"type":"image"}],"id":"auto-image-gallery","isImage":false,"title":"All to know about Gene Hackman’s classical pianist wife Betsy Arakawa "}Most Popular{"title":"Most Popular","src":"/api/most-popular-article?section=article-typepremium,article-typenon-premium&limit=5","items":"articles"}Popular videos{"title":"Popular videos","className":"sc-enynzb-0 ksidoU popular-videos","src":"/api/most-popular-article?section=independent-tv&limit=3","items":"articles"}{"title":"Indy100 Trending"}Sponsored Features{"title":"Sponsored Features","src":"/api/most-popular-article?section=news&limit=5","items":"articles"}'''
