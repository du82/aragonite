title = "Trump Zelensky reaction: Stephen King hits out at ‘bully’ US president after tense meeting | The Independent"
description = "Author voiced his disdain after Trump’s treatment of Ukrainian president"
full_description = '''CultureBooksNewsStephen King hits out at ‘bullies’ Donald Trump and JD Vance over Zelensky White House rowAuthor voiced his disdain after Trump’s treatment of Ukrainian president Jacob StolworthySaturday 01 March 2025 11:42 GMTComments{"articleId":"b2707093","hasBookmark":true,"hasFacebook":true,"isLoggedIn":false,"title":"Stephen King hits out at ‘bully’ Trump after tense Zelensky row in White House","url":"https://www.independent.co.uk/arts-entertainment/books/news/trump-zelensky-vance-reaction-stephen-king-b2707093.html"}Trump accuses 'disrespectful' Zelensky of gambling with WW3Your support helps us to tell the storyRead moreSupport NowFrom reproductive rights to climate change to Big Tech, The Independent is on the ground when the story is developing. Whether it's investigating the financials of Elon Musk's pro-Trump PAC or producing our latest documentary, 'The A Word', which shines a light on the American women fighting for reproductive rights, we know how important it is to parse out the facts from the messaging.At such a critical moment in US history, we need reporters on the ground. Your donation allows us to keep sending journalists to speak to both sides of the story.The Independent is trusted by Americans across the entire political spectrum. And unlike many other quality news outlets, we choose not to lock Americans out of our reporting and analysis with paywalls. We believe quality journalism should be available to everyone, paid for by those who can afford it.Your support makes all the difference.Read more{}Stephen King has lashed out at Donald Trump and JD Vance after their row with President Zelensky in the White House.The horror author, who has long been vocal of his disdain for the US president, said the pair “should be ashamed of themselves”, and accused them of “bullying” the Ukrainian leader.Zelensky had flown to Washington to try to win security guarantees in his country’s war against Russia and, while the meeting started courteously, it descended into open acrimony as both Republicans demanded Zelensky show gratitude.Follow all the latest updates after Trump clashVance told him: “Mr President, with respect. I think it’s disrespectful for you to come to the Oval Office to try to litigate this in front of the American media.”The Ukrainian president tried to object, prompting Trump to raise his voice and say: “You’re gambling with the lives of millions of people.” Trump repeatedly insisted: “You’re not in a good position right now.”While Kremlin officials reacted with glee, Western leaders have voiced their support for Zelensky, who was allegedly “kicked out” of the White House soon after.King responded to a post from fellow author Joe Hill, who wrote on Threads: “I’m sickened – but not shocked – by today’s scene in the Oval Office. “Trump and Vance despise Zelensky: he has the nerve, character, and courage to stand up to Putin and they don’t. A man who adheres to his principles will always be incomprehensible to people who don’t have any.”King, whose post on the subject followed a perfect three-word response from Sir Michael Caine, added: “Trump and Vance should be ashamed of themselves, but bullies don’t “do” shame.”open image in gallery{"id":"trigger-autogallery-2439","index":0}Zelensky and Trump’s conversation turned sour in front of the world (Getty Images)The author would have usually shared his post on X, but he left the app shortly after Trump won a second term as president due to his affiliations with app owner Elon Musk.However, he returned last month with a post reading: “Just wanted to say that Trump is a traitorous, Putin-loving dips***! Goes double for Elon!”King previously said of Trump in an interview with The Sunday Times: “I happen to think that Trump was a horrible president and is a horrible person.open image in gallery{"id":"trigger-autogallery-2440","index":1}Stephen King hits out at ‘bullies’ Donald Trump and JD Vance (Threads)“I think he actually engaged in criminal behaviour and, certainly, I felt that he was a sociopath who tried to overturn the American democracy not out of any political wish of his own but because he could not admit that he had lost. So, I don’t really understand the people who continue to support him.”More aboutStephen KingDonald TrumpZelenskyJD VanceJoin our commenting forumJoin thought-provoking conversations, follow other Independent readers and see their repliesComments{"adUnitPath":"71347885/_main_independent/in_arts-entertainment/in_books/video/gallery_mpu_sb","autoGallery":true,"disableAds":false,"gallery":[{"data":{"title":"Zelensky-Trump.jpg","description":"WASHINGTON, DC - FEBRUARY 28: U.S. President Donald Trump and Ukrainian President Volodymyr Zelensky meet in the Oval Office at the White House on February 28, 2025 in Washington, DC. Trump and Zelensky are meeting today to negotiate a preliminary agreement on sharing Ukraineâs mineral resources that Trump says will allow America to recoup aid provided to Kyiv while supporting Ukraineâs economy. (Photo by Andrew Harnik/Getty Images)","caption":"","copyright":"Getty Images","credit":null,"alt":null,"url":"https://static.independent.co.uk/2025/03/01/08/newFile.jpg","id":null,"mid":5296334,"uid":103,"extra":{"imageSize":{"width":3654,"height":2742}},"localCaption":"Zelensky and Trump’s conversation turned sour in front of the world","localCopyright":"Getty Images"},"type":"image"},{"data":{"title":"Stephen-King-Trump-Threads.png","description":"Stephe King hits out at ‘bullies’ Donald Trump and JD Vance","caption":"Stephe King hits out at ‘bullies’ Donald Trump and JD Vance","copyright":"Threads","credit":null,"alt":null,"url":"https://static.independent.co.uk/2025/03/01/08/Screenshot-2025-03-01-at-07.57.25.jpg","id":null,"mid":5296329,"uid":103,"extra":{"imageSize":{"width":1238,"height":578}},"localCaption":"Stephen King hits out at ‘bullies’ Donald Trump and JD Vance","localCopyright":"Threads"},"type":"image"}],"id":"auto-image-gallery","isImage":false,"title":"Stephen King hits out at Trump after Zelensky White House row"}Most Popular{"title":"Most Popular","src":"/api/most-popular-article?section=article-typepremium,article-typenon-premium&limit=5","items":"articles"}Popular videos{"title":"Popular videos","className":"sc-enynzb-0 ksidoU popular-videos","src":"/api/most-popular-article?section=independent-tv&limit=3","items":"articles"}{"title":"Indy100 Trending"}Sponsored Features{"title":"Sponsored Features","src":"/api/most-popular-article?section=news&limit=5","items":"articles"}'''
