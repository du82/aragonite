 Substance’","localCopyright":"Mubi"},"type":"image"},{"data":{"caption":null,"copyright":"Searchlight","title":"006_ARP_240206_JS_G2-72746.00_38_04_19.Still004","description":"Jesse Eisenberg and Kieran Culkin in A REAL PAIN. Photo Courtesy of Searchlight Pictures, Â© 2024 Searchlight Pictures All Rights Reserved.","credit":null,"alt":null,"url":"https://static.independent.co.uk/2025/02/24/9/57/006_ARP_240206_JS_G2-72746-00_38_04_19-Still004.jpeg","mid":5287044,"cleanUrl":"https://static.independent.co.uk/2025/02/24/9/57/006_ARP_240206_JS_G2-72746-00_38_04_19-Still004.jpeg","extra":{"imageSize":{"width":2047,"height":1365},"sizes":{"3:2":{"trimData":{"top":0,"right":0,"bottom":0,"left":0},"cropData":{"x":0,"y":0.1666666666666572,"width":2047,"height":1364.6666666666667,"rotate":0,"scaleX":1,"scaleY":1}}}},"localCaption":"Jesse Eisenberg and Kieran Culkin in ‘A Real Pain’","localCopyright":"Searchlight"},"type":"image"},{"data":{"caption":null,"copyright":"Universal","title":"2551_CC_00005","description":"L'''
