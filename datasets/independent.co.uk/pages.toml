title = "‘Mummified’ bodies and scattered pills: What we know about Gene Hackman and wife’s ‘suspicious’ deaths | The Independent"
description = "Hollywood star died at the same time as wife of 34 years and one of their pet dogs"
full_description = '''CultureFilmNewsScattered pills and ‘mummified’ bodies: What we know about Gene Hackman and wife’s ‘suspicious’ deathsHollywood star died at the same time as wife of 34 years and one of their pet dogsJacob Stolworthy,Kevin E G Perry,Josh MarcusSaturday 01 March 2025 07:51 GMTComments{"articleId":"CF1:2705770To1","hasBookmark":true,"hasFacebook":true,"isLoggedIn":false,"title":"What we know about Gene Hackman and wife’s ‘suspicious’ deaths","url":"https://www.independent.co.uk/arts-entertainment/films/news/gene-hackman-cause-death-betsy-arakawa-carbon-monoxide-b2706377.html"}Gene Hackman and wife Betsy Arakawa found dead in their home in Santa FeYour support helps us to tell the storyRead moreSupport NowFrom reproductive rights to climate change to Big Tech, The Independent is on the ground when the story is developing. Whether it's investigating the financials of Elon Musk's pro-Trump PAC or producing our latest documentary, 'The A Word', which shines a light on the American women fighting for reproductive rights, we know how important it is to parse out the facts from the messaging.At such a critical moment in US history, we need reporters on the ground. Your donation allows us to keep sending journalists to speak to both sides of the story.The Independent is trusted by Americans across the entire political spectrum. And unlike many other quality news outlets, we choose not to lock Americans out of our reporting and analysis with paywalls. We believe quality journalism should be available to everyone, paid for by those who can afford it.Your support makes all the difference.Read more{}The world has been rocked by the death of Gene Hackman, whose body was found with that of his 65-year-old wife, classical pianist Betsy Arakawa.Hackman, a two-time Oscar winner who starred in films including The French Connection, Unforgiven and The Royal Tenenbaums, was 95.The couple, who had been married since 1991, were found Wednesday dead in their home in Santa Fe, New Mexico, along with one of their pet dogs. Two healthy dogs were also on the property.A pair of maintenance workers found the bodies on Wednesday then alerted police, telling officers they hadn’t seen the homeowners in about two weeks. Santa Fe County Sheriff Adan Mendoza initially said that foul play was not suspected, although a search warrant affidavit has since ruled their deaths “suspicious” enough to require further investigation.The affidavit states that the front door of the residence was found unsecured and opened. There were no immediate signs of a break-in.Arakawa was found in a bathroom, with an open pill bottle and medication scattered nearby.Police also found a space heater near Arakawa’s head, leading a deputy to write in the search warrant it may have fallen if Arakawa suddenly hit the floor.The dead dog, a German Shepherd, was 10-15 feet from Arakawa, in a closet in the bathroom. One of the healthy dogs was observed running loose on the property.Arakawa’s body “showed obvious signs of death, body decomposition, bloating in her face and mummification in both hands and feet,” according to the warrant, obtained by Variety and TMZ.Watch Apple TV+ free for 7 daysNew subscribers only. £8.99/mo. after free trial. Plan auto-renews until cancelledTry for freeWatch Apple TV+ free for 7 daysNew subscribers only. £8.99/mo. after free trial. Plan auto-renews until cancelledTry for freeHackman’s body was found in “similar and consistent” condition.open image in gallery{"id":"trigger-autogallery-8570","index":0}Betsy Arakawa and Gene Hackman were found dead in their home (Bei/Shutterstock)The actor was discovered on the ground near the kitchen in a “mudroom”, an entryway where shoes and coats are often removed, and he appeared to have fallen “suddenly”. A cane and sunglasses were found on the ground nearby.Police say there’s no immediately clear cause of death, and that they have not discovered any kind of note or final statement. “There was no indication of a struggle,” Mendoza told the media.“There was no indication of anything that was missing from the home or disturbed that would be an indication that there was a crime that had occurred.”Preliminary findings from a medical investigation found that the pair suffered “no external trauma”.open image in gallery{"id":"trigger-autogallery-8571","index":1}Gene Hackman was 95 (AP)A statement from the Santa Fe County Sheriff’s Office said: “In the early hours of Thursday, February 27 2025, Hackman and Arakawa were transported to the Office of the Medical Investigator (OMI).“An autopsy was performed. Initial findings noted no external trauma to either individual.”The official results of the post-mortem examinations and toxicology reports are pending and the manner and cause of death have not yet been determined, according to the sheriff’s office. It could take weeks for the results to come in.Putting together the timeline has been a “challenge,” Mendoza said. The sheriff’s office plans to dig through the planner and cellphones, which authorities found at the Santa Fe home, to help establish a timeline.But one recent development might provide some crucial context. Recordings from Hackman’s pacemaker revealed that he could have died as early as February 17, more than a week before the couple’s bodies were discovered. "An initial interrogation was conducted of Mr Hackman's pacemaker. This revealed that his last event was recorded on February 17, 2025,” Mendoza said at a Friday afternoon press conference. “I was advised that a more thorough investigation will be completed,” he added, but “according to the pathologist, I think that is a very good assumption that that was his last day of life.”It’s not immediately clear whether Hackman and Arawaka died at the same time; the cause of death is under investigation.Hackman’s daughter Elizabeth Jean had earlier speculated that carbon monoxide poisoning may have been the cause.Testing and observation of the house’s systems from the Santa Fe Fire Department and New Mexico Gas Company did not reveal immediate signs of a leak. Both tested negative for carbon monoxide poisoning, Mendoza said Friday.In a 911 call, a distressed maintenance worker, who last saw the couple two weeks OK, said he was unable to get inside the house when asked if the people inside were breathing.“I have no idea,” he said. “I am not inside the house. It’s closed. It’s locked. I can’t go in. But I can see she’s lying down on the floor from the window.”open image in gallery{"id":"trigger-autogallery-8572","index":2}Hackman and Arakawa had been married since 1991 (2003 AP)Since retiring from acting in 2004, Hackman had been open about his health struggles, revealing in 2009 that his doctor wanted him to quit Hollywood due to the stress on his heart.Hackman told Empire: “The straw that broke the camel’s back was actually a stress test that I took in New York. The doctor advised me that my heart wasn’t in the kind of shape that I should be putting it under any stress.”The actor previously told CNN interviewer Larry King that he had angioplasty surgery to heal his angina in the 1990s.Angioplasty is a medical procedure that restores blood flow to the heart muscle after the coronary arteries become blocked.“I try to take care of myself,” he said at the time. “I don’t have a lot of fears. I have the normal fear of passing away. You know, I guess we all think about that, especially when you get to be a certain age. “I want to make sure that my wife and my family are taken care of. Other than that, I don’t have a lot of fears.”Hackman had three children – Christopher, Elizabeth and Leslie – with his first wife, Faye Maltese. The pair were married from 1956 to 1986. Maltese died in 2017.More aboutGene HackmanSanta FeBetsy ArakawaJoin our commenting forumJoin thought-provoking conversations, follow other Independent readers and see their repliesComments{"adUnitPath":"71347885/_main_independent/in_arts-entertainment/in_films/video/gallery_mpu_sb","autoGallery":true,"disableAds":false,"gallery":[{"data":{"title":"Gene-Hackman-Betsy-Arakawa.jpg","description":"Mandatory Credit: Photo by Bei/Shutterstock (5133069ae)\r\nGene Hackman and Betsy Hackman\r\nArchive Photos\r\n1995\r\nGene Hackman and Betsy Hackman .\r\nGovernor's Ball .\r\nPhoto by: Berliner Studio/BEImages","caption":null,"copyright":"Bei/Shutterstock","credit":null,"alt":null,"url":"https://static.independent.co.uk/2025/02/27/10/newFile.jpg","id":null,"mid":5292699,"uid":103,"extra":{"imageSize":{"width":1101,"height":826}},"localCaption":"Betsy Arakawa and Gene Hackman were found dead in their home","localCopyright":"Bei/Shutterstock"},"type":"image"},{"data":{"title":"Obit Gene Hackman","description":"FILE - Actor Gene Hackman, winner of Best Supporting Actor at academy awards in March 1993. (AP Photo, File)","caption":null,"copyright":"AP","credit":null,"alt":"Obit Gene Hackman","url":"https://static.independent.co.uk/2025/02/28/08/9cd7aa606a944c23abfdd90234f8b160.jpg","id":null,"mid":5294628,"uid":5204,"extra":{"imageSize":{"width":2000,"height":1304}},"localCaption":"Gene Hackman was 95","localCopyright":"AP"},"type":"image"},{"data":{"title":"Gene Hackman","description":"FILE - Actor Gene Hackman arrives with his wife, Betsy Arakawa, for the 60th Annual Golden Globe Awards in Beverly Hills, Calif., Sunday, Jan. 19, 2003. (AP Photo/Mark J. Terrill, File)","caption":null,"copyright":"2003 AP","credit":"ASSOCIATED PRESS","alt":null,"url":"https://static.independent.co.uk/2025/02/27/10/Gene_Hackman_85882.jpg","id":"35baf73ba1b84f5e850ab42a099cdbba","mid":5292676,"uid":0,"extra":{"imageSize":{"width":1442,"height":1040}},"localCaption":"Hackman and Arakawa had been married since 1991","localCopyright":"2003 AP"},"type":"image"}],"id":"auto-image-gallery","isImage":false,"title":"Everything we know about Gene Hackman’s death "}Most Popular{"title":"Most Popular","src":"/api/most-popular-article?section=article-typepremium,article-typenon-premium&limit=5","items":"articles"}Popular videos{"title":"Popular videos","className":"sc-enynzb-0 ksidoU popular-videos","src":"/api/most-popular-article?section=independent-tv&limit=3","items":"articles"}{"title":"Indy100 Trending"}Sponsored Features{"title":"Sponsored Features","src":"/api/most-popular-article?section=news&limit=5","items":"articles"}'''
