["https://independent.co.uk/arts-entertainment/films/news/gene-hackman-death-latest-updates-wife-santa-fe-b2705677.html"]
title = "Gene Hackman death: Investigation intensifies after pacemaker sheds light on time of death | The Independent"
description = "The Oscar-winning actor, best known for ‘The French Connection’ and ‘The Conversation’, was found dead along with his wife Betsy Arakawa and a pet dog"
full_description = '''As it happenedended{"lang":"en","timestamp":1740861447}CultureFilmNewsGene Hackman death: Investigation intensifies after pacemaker sheds light on time of deathThe Oscar-winning actor, best known for ‘The French Connection’ and ‘The Conversation’, was found dead along with his wife Betsy Arakawa and a pet dogJacob Stolworthy,Kevin E G Perry,Tom MurraySaturday 01 March 2025 20:37 GMTComments{"articleId":"CF1:2705677To1","hasBookmark":true,"hasFacebook":true,"isLoggedIn":false,"title":"Gene Hackman’s investigation intensifies after pacemaker discovery","url":"https://www.independent.co.uk/arts-entertainment/films/news/gene-hackman-death-cause-pacemaker-autopsy-latest-updates-b2707163.html"}Gene Hackman and wife Betsy Arakawa found dead in their home in Santa FeYour support helps us to tell the storyRead moreSupport NowFrom reproductive rights to climate change to Big Tech, The Independent is on the ground when the story is developing. Whether it's investigating the financials of Elon Musk's pro-Trump PAC or producing our latest documentary, 'The A Word', which shines a light on the American women fighting for reproductive rights, we know how important it is to parse out the facts from the messaging.At such a critical moment in US history, we need reporters on the ground. Your donation allows us to keep sending journalists to speak to both sides of the story.The Independent is trusted by Americans across the entire political spectrum. And unlike many other quality news outlets, we choose not to lock Americans out of our reporting and analysis with paywalls. We believe quality journalism should be available to everyone, paid for by those who can afford it.Your support makes all the difference.Read more{}Gene Hackman has been found dead, aged 95, in his Santa Fe home along with his wife Betsy Arakawa, 65, and one of their pet dogs.According to a police search warrant, the actor, his wife and their dog were found in separate rooms and appeared to have been “dead for some time”. The couple suffered “no external trauma”, the preliminary findings of a medical investigation found.At a press conference at the Santa Fe County Sheriff’s Office on Friday afternoon, Sheriff Adan Mendoza announced that an investigation by Dr Heather Jarrell, New Mexico's Chief Medical Investigator, had revealed that Hackman’s pacemaker had stopped 10 days before his body was found."An initial interrogation was conducted of Mr Hackman's pacemaker. This revealed that his last event was recorded on February 17, 2025, I was advised that a more thorough investigation will be completed,” said Mendoza.Asked if that meant Hackman had died that day, he responded: "According to the pathologist, I think that is a very good assumption, that that was his last day of life."He also confirmed that both Hackman and Arakawa had tested negative for carbon monoxide.Santa Fe County Sheriff Adan Mendoza initially said that foul play was not suspected, although a search warrant affidavit has since ruled their deaths “suspicious” enough to require further investigation.Despite early speculation, the document added that there were “no obvious signs of a gas leak”.The actor was one of the best-loved stars in Hollywood, appearing in classic films such as The French Connection, The Conversation and Superman.He won Oscars for The French Connection and Clint Eastwood’s Unforgiven and stepped away from the spotlight a few years after 2001’s The Royal Tenenbaums.RecommendedGene Hackman and wife’s death deemed ‘suspicious’ after initial gas leak speculationGene Hackman and Betsy Arakawa suffered ‘no external trauma’ – police‘We will miss him sorely’: Gene Hackman’s family ‘devastated’ by actor’s passing‘Mummified’ bodies and scattered pills: What we know about Gene Hackman and wife’s ‘suspicious’ deathsKey PointsGene Hackman and wife Betsy Arakawa found dead in their home in Santa FeSheriff says Hackman’s pacemaker stopped on February 17Hackman's family issue statementGene Hackman death: Everything we know as actor’s body is found with wife and dogFrancis Ford Coppola calls Hackman 'inspiring and maginifcent'Mel Brooks reveals how Hackman came to be cast in 'Young Frankenstein'Mel Brooks has recalled how Hackman came to be cast in his 1974 comedy classic Young Frankenstein, writing on X: “I was privileged to know Gene Hackman because he played tennis with another Gene—Gene Wilder. And that Gene told him about a little role called The Blind Hermit in our movie YOUNG FRANKENSTEIN.“He said, ‘Do you think Mel would let me play it? I’ve always wanted to do a comedy.’ Needless to say, I was over the moon and he was perfect.”Kevin Perry28 February 2025 01:05Bill Murray says Hackman was 'really difficult'Speaking to the Associated Press, Bill Murray said his Royal Tenenbaums could be “rough” on young directors like Wes Anderson.Murray said: “He was a tough nut, Gene Hackman, but he was really good and he was really difficult. Like, we can say it now, but he was a tough guy because older great actors do not give young directors much of a chance. They're really rough on ’em.”Murray added: “He was a great one. He was a great actor.”Kevin Perry28 February 2025 04:00Tom Hanks shares succinct Hackman tribute(Getty Images)On Instagram, Tom Hanks shared a short and sweet tribute to Hackman, writing: “There has never been a ‘Gene Hackman Type.’ There has only been Gene Hackman.”Kevin Perry28 February 2025 05:00Dustin Hoffman calls Hackman: 'A giant among actors'Dustin Hoffman has paid tribute to the “brilliant” Gene Hackman, who he first met at acting school when he was still a teenager.The two befriended each other at the Pasadena Playhouse in the 1950s. They later starred together in the 2003 film, Runaway Jury.“I met Gene in acting school, at the Pasadena Playhouse, when he was 27 and I was 19. We used to play congas together on the roof, trying to be like our hero Marlon Brando,” Hoffman said in a statement.Dustin Hoffman (2017 Invision)“And Gene was like Brando, in that he brought something unprecedented to our craft, something people didn’t immediately understand as genius,” added Hoffman. “He was expelled from our school after three months for ‘not having talent.’ It was the first time they ever did that. He was that good. Powerful, subtle, brilliant. A giant among actors. I miss him already.”Greg Evans28 February 2025 08:45Frantic 911 call released from maintenance man who found bodiesAudio has been released from the maintenance man who called 911 after finding Hackman and Arakawa’s bodiesGene Hackman frantic 911 call from maintenance man who found bodiesGreg Evans28 February 2025 09:45Police offer insight as to why a heater was next to Arakawa's bodyWhen investigating the property, police reported that they found a black space heater next to Awakara’s body, which was discovered in the bathroom.In a statement, an officer "advised he suspected the heater could have fallen in the event the female abruptly fell to the ground".The report also stated that he "observed an orange prescription bottle on the countertop near the deceased female. The prescription bottle appeared opened with pills scattered on the countertop".Greg Evans28 February 2025 10:06Tom Hanks pays tributeOn Instagram, the Oscar winner wrote: “There has never been a ‘Gene Hackman Type.’ There has only been Gene Hackman.”Tom Hanks pays tribute to Hackman on Instagram (Instagram)Greg Evans28 February 2025 10:15Hackman's daughters seen for first time since father's deathElizabeth and Leslie Hackman have been spotted for the first time in public since the announcement of their father’s death.The siblings were seen walking into a Denny's restaurant in Burbank, California but are expected to head to Santa Fe shortly, once police release more information.Leslie said in a statement: "We need to wait and find out whatever information from the police. We weren't expecting to have to go out there and go through the house and all that."So we have some work cut out for us. But yeah, we'll be going out to New Mexico."Greg Evans28 February 2025 10:16Hackman's wife had put him on a strict dietDoug Lanham, a close friend and former business partner, of Hackman’s has revealed that Arakawa had put the actor on a strict diet and was very serious about his health.Lanham told TMZ that Hackman was only able to “sneak a cheat meal“ when they were out golfing Lanham, who was in the restaurant industry, said that Hackman would order either the “halibut or rice-paper salmon rather than a big steak” whenever he came to one of his establishments.Greg Evans28 February 2025 10:32BBC Breakfast’s Charlie Stayt issues apology after technical error in Gene Hackman reportBBC Breakfast presenter Charlie Stayt has issued an apology after a technical error disrupted a report about Gene Hackman during the show on Friday (28 February).The investigation was discussed in a pre-recorded segment on BBC Breakfast, with a photograph of Hackman concluding the report.However, the picture of the Oscar winner remained on screen even as Stayt moved to the next story on the programme – a controversial BBC documentary about Gaza, narrated by the son of a Hamas leader.“The BBC has apologised for serious flaws in the production of a documentary about the war in Gaza,” Stayt began to say, before realising the error.“Apologies, let’s just get, err, that bit straightened out,” he stalled as the image was taken off screen.BBC Breakfast’s Charlie Stayt issues apology after error in Gene Hackman report Hollywood star died alongside his wife and dog at their home in Santa FeGreg Evans28 February 2025 10:45Older1 / 6Newer{"liveBlogId":1993281,"initialPosts":[{"type":"post","data":{"name":"1993281","title":"Mel Brooks reveals how Hackman came to be cast in 'Young Frankenstein'","id":1993944,"uuid":"d17ab975-370b-4ace-9855-f2758329922c","scheduleTime":"1740704718","created":"1740703834","changed":"1740703834","container":1993281,"user":{"name":"Kevin Perry"},"extra":{"authorName":"Kevin Perry"}},"postJson":[{"type":"markup","data":{"markup":"<p>Mel Brooks has recalled how Hackman came to be cast in his 1974 comedy classic <em>Young Frankenstein</em>, writing on X: “I was privileged to know Gene Hackman because he played tennis with another Gene—Gene Wilder. And that Gene told him about a little role called The Blind Hermit in our movie YOUNG FRANKENSTEIN.</p>"}},{"type":"markup","data":{"markup":"<p>“He said, ‘Do you think Mel would let me play it? I’ve always wanted to do a comedy.’ Needless to say, I was over the moon and he was perfect.”<a rel=\"nofollow\" target=\"_blank\" href=\"https://x.com/MelBrooks/status/1895272789520588906/photo/1\"></a></p>"}},{"type":"twitter","data":{"url":"https://x.com/MelBrooks/status/1895272789520588906","isConversation":false,"align":"center"}}],"timestamp":1740704718,"formattedTimestamp":"28 February 2025 01:05"},{"type":"post","data":{"name":"1993281","title":"Bill Murray says Hackman was 'really difficult'","id":1993946,"uuid":"a61578ad-dbe8-4453-befe-6904cf111d0f","scheduleTime":"1740715218","created":"1740704186","changed":"1740704186","container":1993281,"user":{"name":"Kevin Perry"},"extra":{"authorName":"Kevin Perry"}},"postJson":[{"type":"markup","data":{"markup":"<p>Speaking to the Associated Press, Bill Murray said his <em>Royal Tenenbaums </em>could be “rough” on young directors like Wes Anderson.</p>"}},{"type":"markup","data":{"markup":"<p>Murray said: “He was a tough nut, Gene Hackman, but he was really good and he was really difficult. Like, we can say it now, but he was a tough guy because older great actors do not give young directors much of a chance. They're really rough on ’em.”</p>"}},{"type":"markup","data":{"markup":"<p>Murray added: “He was a great one. He was a great actor.”</p>"}},{"type":"twitter","data":{"url":"https://x.com/APEntertainment/status/1895184688714571838","isConversation":false,"align":"center"}}],"timestamp":1740715218,"formattedTimestamp":"28 Feb