description = "When Pehla nasha, from Jo Jeeta Wohi Sikandar, first played on screens large and small in 1992, and Aamir Khan appeared in a loud red shirt and flung his sweater into the picturesque landscape behind…"
full_description = 'Songs Pehla Nasha Table of ContentsPehla Nasha – The SongPehla Nasha Pehla Khumar Song VideoPehla Nasha Pehla Khumar Cast and ArtistsSong TriviaFalak Tak Chal Saath Mere LyricsDil Ibadat Kar Raha Hai LyricsMain Kya Janu Kya Jadu HaiFarishton Ki Nagri Mein Main When Pehla nasha, from Jo Jeeta Wohi Sikandar, first played on screens large and small in 1992, and Aamir Khan appeared in a loud red shirt and flung his sweater into the picturesque landscape behind him, in slow motion, you knew something had changed and that something new was beginning. Pehla nasha went on to establish many firsts, firsts that would change the way Hindi songs were made and visualised for the decades to follow. Pehla Nasha – The Song On the most visual level, Pehla nasha was the first Hindi song to be shot almost completely in slow motion. That in itself is not a great feat, but then you realise that Hindi songs have actors mouthing the lyrics, and they seem to be doing so at regular speed in this song. This required them all to mouth a vastly sped-up version of the song as they danced, and the high speed film was then slowed down by an equal factor to slow down the motion while having the words appear at a normal pace. A complicated maneuver, which after this song became a fairly standard effect, still used often in Hindi song videos today. This song launched Farah Khan into the role of lead choreographer, having only been an assistant before it. It also introduced the Bollywood world to her brand of casual dance, far removed from the synchronised, stage-show antics that had been the main-stay of Hindi cinema for many decades preceding this song. With Pehla nasha, the film song once again became a spectacle and it’s own art form rather than mere supporting material, with the dance choreographer playing a much larger role in the direction of song videos than ever before, This directly led to some of the very experimental work by Farah Khan in Dil Se some years later. Most of all, though, Pehla nasha is remembered, and will always be remembered, for being one of the most magical songs to ever grace the Hindi screen. The veteran Majrooh Sultanpuri gifted it with his usual brand of concise poetry in the lyrics, and the duo of Jatin-Lalit exploded into the scene after a couple of luke-warm outings as music directors. The beautiful piano that forms the spine of this song and the supporting guitar riffs became a sort of signature sound, and they went on to a very prolific musical career over the next decade. To most, Pehla nasha is not the technical and cultural marvel that I’ve just described, but simply one of the most potent romantic melodies of an era. As with such songs of every time, many will have fond or painful memories of their life etched around this song, and that more than anything will live on. With such lines as: Ek kar doon aasman aur zameen Kaho yaaron kya karoon, kya nahin I’d make the sky and the Earth one, if I could Tell me, my friends, what I shouldn’t do, or should Song writing by Majrooh Sultanpuri. See the complete lyrics of Pehla Nasha with meaning. … the song captured a certain confused, raw, innocence, perhaps even naivete, about love that few songs had done so well before, and a whole generation identified with it, enough to ignore the gangly adults pretending to be school kids on screen. The emotion was captured well, and in the end, that’s all that mattered. Pehla Nasha Pehla Khumar Song Video https://youtu.be/zI2HJONbT5AVideo can&#8217;t be loaded because JavaScript is disabled: <a href="https://youtu.be/zI2HJONbT5A" title="Pehla Nasha Pehla Khumar Jo Jeeta Wohi Sikandar HD">Pehla Nasha Pehla Khumar Jo Jeeta Wohi Sikandar HD (https://youtu.be/zI2HJONbT5A)</a> Alternative links: YouTube [Audio] Dailymotion Mail.ru YouTube [Audio with lyrics] Pehla Nasha Pehla Khumar Cast and Artists Movie name Jo Jeeta Wohi Sikandar (1992) Actresses Ayesha Jhulka and Pooja Bedi Actors Aamir Khan and Mamik Singh Singers Udit Narayan and Sadhana Sargam Music Composer Jatin-Lalit Lyricist Majrooh Sultanpuri Dance Choreographer Farah Khan Film Director Mansoor Khan Cinematographer Najeeb Khan Song Trivia Remix Magnet Pehla Nasha‘s enduring popularity as a song has resulted in it being covered and remixed many, many times through the decades that have followed. There’s a popular cover of the song in 2016 from the band Sanam. And various DJ’s have lent their name and edits to remixes over the years, including Bally Sagoo, Devious, DJ Aqueel, DJ Rohan, DJ Saur and many others. They are all fun experiments and might even be preferred by some listeners if slow ballads are not your thing. I still think the original stands above the rest, unless the dance beat is your main need. Also listen to …Falak Tak Chal Saath Mere LyricsDil Ibadat Kar Raha Hai LyricsMain Kya Janu Kya Jadu HaiFarishton Ki Nagri Mein Main♫ Share this music ♫Share on WhatsAppShare on FacebookShare on EmailShare on PinterestShare on X (Twitter) 1990s, 1992, aamir khan, ayesha jhulka, farah khan, hindi songs, jatin-lalit, jo jeeta wohi sikandar, majrooh sultanpuri, mamik singh, mansoor khan, najeeb khan, pooja bedi, sadhana sargam, udit narayan'
