full_description = "Lyrics Pehla Nasha Lyrics Table of ContentsPehla Nasha Lyrics in EnglishPehla Nasha Pehla Khumar Meaning in English TranslationPehla Nasha Lyrics in HindiTinka Tinka, Zara ZaraChookar Mere Mann KoAise To Na DekhoHawaon Pe Likh Do Hawaon Ke Naam The lyrics of Pehla Nasha by Majrooh Sultanpuri for the 1992 romantic sports film Jo Jeeta Wohi Sikandar are simple on the surface. The simplicity of the Pehla Nasha lyrics, that very quotable phrase of “pehla nasha’ might have contributed to its success. In combination with music by Jatin-Lalit at the height of their 90s powers, and with the voices of Udit Narayan and Sadhana Sargam, this was destined to be a hit. In any other circumstance it might have been a middling song but the public love affair with this movie at the time and the right timing of the release of this song with its very Western instrumentation has made this nothing short of a cultural phenomenon. Pehla Nasha Pehla Khumar song details Song Title Pehla Nasha Pehla Khumar Movie name Jo Jeeta Wohi Sikandar (1992) Singers Udit Narayan and Sadhana Sargam Lyricist Majrooh Sultanpuri Music Composer Jatin-Lalit Watch the song video of Pehla Nasha Pehla Khumar on YouTube Pehla Nasha Lyrics in English Romanized Hindi F: Chaahe tum kuchh na kaho, maine sun liya Kay saathi pyaar ka, mujhe chun liya Chun liya … Maine sun liya … M: Pehla nasha, pehla khumar Naya pyaar hai, naya intezaar Kar loon main kya apna haal Aye dil-e-bekaraar Mere dil-e-bekaraar, tu hi bata Pehla nasha, pehla khumar … Udta hi phiroon, inn hawaaon mein kahin, ya main jhool jaoon inn ghataaon mein kahin (2) Ek kar doon aasman aur zameen, kaho yaaron kya karoon, kya nahin Pehla nasha, pehla khumar Naya pyaar hai, naya intezaar Kar loon main kya apna haal Aye dil-e-bekaraar Mere dil-e-bekaraar, tu hi bata Pehla nasha, pehla khumar … F: Usne baat ki kuch aise dhang se, sapne de gaya woh hazaaron rang ke (2) Rah jaoon jaise main haar ke, aur choome woh mujhe, pyaar se Pehla nasha, p