["https://indiansong.org/songs/woh-chand-khila-woh-taare-hanse"]
title = "Woh Chand Khila Woh Taare Hanse - Indian Song"
description = "By the time the 1959 film Anari came along, Raj Kapoor was a well established presence in the Hindi film world, as was his his slightly-awkward and naive Chaplinesque on-screen persona…"
full_description = 'Songs Woh Chand Khila Woh Taare Hanse Table of ContentsWoh Chand Khila Woh Taare Hanse – The SongWoh Chand Khila Woh Taare Hanse Song VideoWoh Chand Khila Woh Taare Hanse Cast and ArtistsJadu Hai, Tera Hi JaduPudhu Vellai Mazhai LyricsYeh Haseen WadiyanPehla Nasha Lyrics By the time the 1959 film Anari came along, Raj Kapoor was a well established presence in the Hindi film world, as was his his slightly-awkward and naive Chaplinesque on-screen persona, made famous by such films as Awaara (1951). So perhaps in some ways he was playing to type in this mix of romance and intrigue. Along with co-starring the effervescent Nutan, the film did give us some very memorable songs, chief among which is the chirpy well-remembered Woh chand khila woh taare hanse. Woh Chand Khila Woh Taare Hanse – The Song In keeping with the mildly comedic mood of the song, both and Nutan, both very capable serious actors, are at their light-hearted best here. Kapoor is fittingly awkward and lacking in confidence as the naive (anaari) of the title. Nutan is in parts playful and and romantic in a song that is beautifully shot and lit by cinematographer Jaywant Pathare, with some great timing and pace to the shots, directed by Hrishikesh Mukherjee. It’s little surprise that stills from this song are often used as supporting imagery whenever Nutan is mentioned online and in print. While not one of her most subtle or magical performances in a song she is quite radiant here, in a most forthright way. Shankar-Jaikishen gave some extremely lilting and memorable music for the song, with the interstitial accordion pieces particularly standing out as a very identifiable signature note to the whole affair. I’ve sat through many an amateur renditions of this song where the modern electronic-keyboard players have tried in vain to match the flow of those accordion melodies, and where percussionists have gotten carried away in the upbeat spirit of the song’s rhythm. Lata Mangeshkar is youthful and high-pitched in her rendition of the song, adding to the girlish charm of it, with the mood much enhanced by the very picturesque lyrics by Hasrat Jaipuri. Chaandi ki chamakti raahein, Woh dekho jhoom jhoom ke bulayen Kirnon ne pasaari baahein, Ki armaan naach naach lehraye Look how the shimmering paths of moonlight call out in pleasure Moonbeams spread their arms as hopes dance and sway for good measure Song writing by Hasrat Jaipuri. See the complete lyrics of Woh Chand Khila Woh Taare Hanse with meaning. Woh chand khila woh taare hanse is a light-hearted song in a film that is not all light-hearted. But it endures and many people main memory and awareness of this film, and as a lasting image of Nutan‘s talent. Woh Chand Khila Woh Taare Hanse Song Video https://www.youtube.com/watch?v=OvtU5FYxK-cVideo can&#8217;t be loaded because JavaScript is disabled: <a href="https://www.youtube.com/watch?v=OvtU5FYxK-c" title="Woh Chand Khila - Raj Kapoor - Nutan - Anari - Lata Mangeshkar - Mukesh - Evergreen Hindi Songs">Woh Chand Khila &#8211; Raj Kapoor &#8211; Nutan &#8211; Anari &#8211; Lata Mangeshkar &#8211; Mukesh &#8211; Evergreen Hindi Songs (https://www.youtube.com/watch?v=OvtU5FYxK-c)</a> Alternative links: YouTube Dailymotion Woh Chand Khila Woh Taare Hanse Cast and Artists Movie name Anari (1959) Actress Nutan Actor Raj Kapoor Singers Lata Mangeshkar and Mukesh Music Composer Shankar-Jaikishan Lyricist Hasrat Jaipuri Film Director Hrishikesh Mukherjee Cinematographer Jaywant Pathare Also listen to …Jadu Hai, Tera Hi JaduPudhu Vellai Mazhai LyricsYeh Haseen WadiyanPehla Nasha Lyrics♫ Share this music ♫Share on WhatsAppShare on FacebookShare on EmailShare on PinterestShare on X (Twitter) 1950s, 1959, anari, hasrat jaipuri, hindi songs, hrishikesh mukherjee, jaywant pathare, lata mangeshkar, mukesh, nutan, raj kapoor, shankar-jaikishan'
