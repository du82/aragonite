full_description = '''List of all Blogs Here's a list of all available blogs with their most recent post. You can sort by clicking on the column headers. You can also filter by typing in the input fields. Sorry, this feature needs JavaScript new Tabulator("#table", { ajaxURL: 'export', initialSort: [ {column: "published", dir: "desc"}, ], initialHeaderFilter:[ {field:"errors", value:"0"}, ], sortOrderReverse: true, columnDefaults: { headerFilterPlaceholder: "filter", headerFilter: "input", tooltip: true, headerTooltip: true, }, columns: [ { title: "Blog Title", field: "feedtitle", width: 300, }, { title: "Last Post", field: "itemurl", formatter: "link", formatterParams: { labelField: "itemtitle", url: (cell) => { try { const url = new URL(cell.getValue()); url.searchParams.set('utm_source', 'indieblog.page'); url.searchParams.set('utm_medium', 'list'); url.searchParams.set('utm_campaign', 'indieblog.page'); return url.toString(); } catch (e) { console.error(e, cell.getValue()); return cell.getValue(); } }, }, width: 400, }, { title: "Posted", field: "published", sorter: "number", width: 80, hozAlign: "right", formatter: (cell) => { return (new Date(cell.getValue() * 1000)).toISOString().split('T')[0]; }, }, { title: "Homepage", field: "homepage", formatter: "link", formatterParams: { label: (cell) => { const value = cell.getValue(); if (value === '') return ''; const url = new URL(value); if (url.pathname === '/') return url.hostname; return url.hostname + url.pathname; }, url: (cell) => { const url = new URL(cell.getValue()); url.searchParams.set('utm_source', 'indieblog.page'); url.searchParams.set('utm_medium', 'list'); url.searchParams.set('utm_campaign', 'indieblog.page'); return url.toString(); } }, }, { title: "Added", field: "added", sorter: "number", width: 80, hozAlign: "right", formatter: (cell) => { return (new Date(cell.getValue() * 1000)).toISOString().split('T')[0]; }, }, { title: "Feed", field: "feedurl", formatter: "link", width: 150, formatterParams: { label: (cell) => { return (new URL(cell.getValue())).pathname } }, }, { title: "Mastodon", field: "mastodon", formatter: "link", width: 150, formatterParams: { url: (cell) => { const value = cell.getValue(); if (value === '') return ''; const parts = value.split('@'); return 'https://' + parts[2] + '/@' + parts[1]; } }, }, { title: "ID", field: "feedid", hozAlign: "right", formatter: "link", formatterParams: { url: (cell) => { return 'inspect?id=' + cell.getValue(); } }, }, { title: "Error Count", field: "errors", sorter: "number", width: 60, hozAlign: "right", headerFilter: "number", }, { title: "Last Error", field: "lasterror", }, ], }); All the above data is also available as JSON export.'''
