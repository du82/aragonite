full_description = "Suggest a blog Use this form to add a new source. Enter the URL to an RSS/ATOM feed or a homepage link. Suggest a feed or blog URL: Submit What sites can be submitted? I haven't decided on any firm rules. If it's a personal site with an RSS feed, it is probably welcome. No illegal stuff, no corporate blogs, no nazis. I tried to submit my site, but got an error!? Make sure your site has a valid RSS or ATOM feed. JSON Feed is not supported. If you're not sure, you can check with a service like the W3C Feed Validation Service. Pay especially close attention that your feed is served with the correct MIME type. When submitting your site, the feed parser will try to autodetect the feed URL. If it fails, you can always submit the feed URL manually. Using the Android Share Menu When you install indieblog.page as a Progressive Web App (PWA), you can find it in the share menu and easily suggest new blogs that way. If you missed the prompt earlier, you can still find the option to install in your browser's menu."
