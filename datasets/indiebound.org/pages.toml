full_description = '''{"@context":"https://schema.org","@type":["Product","Book"],"sku":"9781668015155","isbn":"9781668015155","gtin14":"09781668015155","image":["https://images-us.bookshop.org/ingram/9781668015155.jpg?v=enc-v1"],"name":"The Storm We Made","description":"<b>NATIONAL BESTSELLER * A <i>GOOD MORNING AMERICA</i> BOOK CLUB PICK * LONGLISTED FOR THE CENTER FOR FICTION 2024 FIRST NOVEL PRIZE</b><BR> <BR> <b>In this &ldquo;espionage-laden family epic&rdquo; (<i>Vanity Fair</i>), an ordinary housewife becomes an unlikely spy&#8212;and her dark secrets will test even the most unbreakable ties.</b><BR><BR>Malaya, 1945. Cecily Alcantara&rsquo;s family is in terrible danger: her fifteen-year-old son, Abel, has disappeared, and her youngest daughter, Jasmin, is confined in a basement to prevent being pressed into service at the comfort stations. Her eldest daughter Jujube, who works at a tea house frequented by drunk Japanese soldiers, becomes angrier by the day.<BR> <BR>Cecily knows two things: that this is all her fault; and that her family must never learn the truth.<BR> <BR>A decade prior, Cecily had been desperate to be more than a housewife to a low-level bureaucrat in British-colonized Malaya. A chance meeting with the charismatic General Fujiwara lured her into a life of espionage, pursuing dreams of an &ldquo;Asia for Asians.&rdquo; Ten years later as the war reaches its apex, her actions have caught up with her. Now her family is on the brink of destruction&#8212;and she will do anything to save them.<BR> <BR>Told from the perspectives of four unforgettable characters,<I> The Storm We Made</I> spans years of pain, triumph, and perseverance. &ldquo;The tenderness in its details, the ordinary ways that these characters love and laugh in the face of the extraordinary&hellip;Chan shows us, with clarity and care, how the truest mirror comes from the intimacy of human connection&rdquo; (<I>The New York Times Book Review</I>).","brand":{"@type":"Brand","name":"S&S/ Marysue Rucci Books"},"publisher":{"@type":"Thing","name":"S&S/ Marysue Rucci Books"},"author":[{"@type":"Person","name":"Vanessa Chan"}],"bookFormat":"Paperback / softback","datePublished":"2025-02-11","numberOfPages":368,"size":"212.7 X 139.7 X 25.4 mm | 288.0 g","offers":{"@type":"Offer","url":"https://bookshop.org/p/books/the-storm-we-made-vanessa-chan/19968062?ean=9781668015155&next=t","itemCondition":"https://schema.org/NewCondition","availability":"https://schema.org/InStock","price":17.66,"priceCurrency":"usd","shippingDetails":{"@type":"OfferShippingDetails","shippingRate":{"@type":"MonetaryAmount","value":3.99,"currency":"USD"},"shippingDestination":{"@type":"DefinedRegion","addressCountry":"US"},"deliveryTime":{"@type":"ShippingDeliveryTime","handlingTime":{"@type":"QuantitativeValue","minValue":0,"maxValue":1,"unitCode":"DAY"},"transitTime":{"@type":"QuantitativeValue","minValue":3,"maxValue":5,"unitCode":"DAY"}}},"hasMerchantReturnPolicy":{"@type":"MerchantReturnPolicy","applicableCountry":"US","returnPolicyCategory":"https://schema.org/MerchantReturnFiniteReturnWindow","merchantReturnDays":30,"returnMethod":"https://schema.org/ReturnByMail","returnShippingFeesAmount":{"@type":"MonetaryAmount","value":3.99,"currency":"USD"}}}}The Storm We MadeA Good Morning America Book Club PickVanessa Chan (Author)Paperback $18.99$17.66AvailableHardback $27.00$25.11AvailableHardback Library BindingLarge Print$40.24BackorderPaperback $18.99$17.66AvailableAdd to WishlistShop Other Formats4.9/5.021,000+ ReviewsBookshop.org has the highest-rated customer service of any bookstore in the worldDescriptionNATIONAL BESTSELLER * A GOOD MORNING AMERICA BOOK CLUB PICK * LONGLISTED FOR THE CENTER FOR FICTION 2024 FIRST NOVEL PRIZE In this “espionage-laden family epic” (Vanity Fair), an ordinary housewife becomes an unlikely spy—and her dark secrets will test even the most unbreakable ties.Malaya, 1945. Cecily Alcantara’s family is in terrible danger: her fifteen-year-old son, Abel, has disappeared, and her youngest daughter, Jasmin, is confined in a basement to prevent being pressed into service at the comfort stations. Her eldest daughter Jujube, who works at a tea house frequented by drunk Japanese soldiers, becomes angrier by the day. Cecily knows two things: that this is all her fault; and that her family must never learn the truth. A decade prior, Cecily had been desperate to be more than a housewife to a low-level bureaucrat in British-colonized Malaya. A chance meeting with the charismatic General Fujiwara lured her into a life of espionage, pursuing dreams of an “Asia for Asians.” Ten years later as the war reaches its apex, her actions have caught up with her. Now her family is on the brink of destruction—and she will do anything to save them. Told from the perspectives of four unforgettable characters, The Storm We Made spans years of pain, triumph, and perseverance. “The tenderness in its details, the ordinary ways that these characters love and laugh in the face of the extraordinary…Chan shows us, with clarity and care, how the truest mirror comes from the intimacy of human connection” (The New York Times Book Review).Product DetailsPublisherS&S/ Marysue Rucci BooksPublish DateFebruary 11, 2025Pages368LanguageEnglishTypePaperback / softbackEAN/UPC9781668015155Dimensions212.7 X 139.7 X 25.4 mm | 288.0 gBISAC Categories: Literary Fiction, Historical Fiction, Popular FictionProduct DetailsPublisherS&S/ Marysue Rucci BooksPublish DateFebruary 11, 2025Pages368LanguageEnglishTypePaperback / softbackEAN/UPC9781668015155Dimensions212.7 X 139.7 X 25.4 mm | 288.0 gBISAC Categories: Literary Fiction, Historical Fiction, Popular FictionAbout the AuthorVanessa Chan is the Malaysian author of internationally bestselling The Storm We Made, a Good Morning America Book Club Pick, BBC Radio 2 Book Club pick, and New York Times Editor’s Choice. The novel, her first, will be translated into more than twenty languages worldwide. Her other work has been published in Vogue, Esquire, and more.ReviewsPRAISE FOR THE STORM WE MADE "One of the best espionage novels I’ve ever come across." —CrimeReads “Readers are transported back to 1945 Malaya in this rich, spellbinding saga that follows Cecily Alcantara, a mother who was also an unlikely spy for Japanese forces during WWII. Ten years prior, a chance meeting with General Fuijwara lured her into a life of espionage. Now, she’ll do anything to save her family. This captivating story shines a light on the dangers of war and the lengths to which we’ll go to save the ones we cherish." —Woman's World Magazine "Vanessa Chan is the kind of author who can completely transport you to another time and place… it is a total page turner.” —Good Morning America, GMA Book Club Pick “This ambitious and sweeping debut novel explores the fallout of a Malayan woman’s decision to become a spy for Japanese forces in World War II, unwittingly helping to usher in a brutal occupation with devastating costs for her family.” —New York Times Book Review, Editors' Choice “’Ambitious’ would be a trite term for Vanessa Chan’s outstanding debut, a historical novel that thrums with the commingling tensions of its backdrop: the lead-up to the WWII Japanese invasion of what is now Malaysia. Chan writes her characters—particularly the conflicted protagonist, Cecily Alcantara, a former espionage asset to the Japanese Imperial Army—with a precision that neither flinches from the brutality of war nor ignores the humanity within. This is a book with real staying power.” —Elle Magazine “[T]his debut novel grabs the reader by the throat and never lets go, following a single family through one of World War II’s most grisly—and often overlooked—chapters... Moving between perspectives and timelines—between actions and their disastrous, unforeseen consequences—Chan tests the bounds of familial bonds, political sacrifice, and human resilience.” —Oprah Daily, The Best Novels to Read This January “A wartime story like you’ve never read before.” —PEOPLE Magazine "[A] searing debut.... Conquest and colonization have long been fertile subjects in fiction, from Joseph Conrad to present-day writers such as Zadie Smith and Imbolo Mbue. Like them, Chan uses colonialism as a lens through which to examine such themes as racism, colorism, status, poverty and violence.... The author and her relatives carry 'the legacy of colonization' in their bodies, Chan writes, and it was this intergenerational trauma — and resilience — she wanted to evoke through [her novel]. With authenticity and passion, Chan succeeds in imparting their pain and will to survive, through singular characters whose flaws and contradictions are as fascinating as their strengths." —Leigh Haber, Washington Post "This ambitious and sweeping debut novel explores the fallout of a Malayan woman’s decision to become a spy for Japanese forces during World War II. Seduced by promises of an “Asia for Asians,” she instead helps usher in a brutal occupation with devastating costs for her family.“ —The New York Times “Vanessa Chan’s espionage-laden family epic, which takes place in Malaya under British and Japanese occupation, dissects the moral complexity of decisions made under duress.” —Vanity Fair “Chan shows us, with clarity and care, how the truest mirror comes from the intimacy of human connection.” —NPR "The Storm We Made is a searing look at the impacts of colonialism, the horrors of war, and the power of a mother's love.” —Town & Country, "The 30 Must-Read Books of Winter 2024" "The Storm We Made kicks up a weather system of epic proportions, ranging from military terror during World War II to domestic warmth…. The book’s greatest power: It makes space for complexity without relinquishing the grip of a good story…. Chan reveals how war is experienced in bodies and hearts, breaking down the morale of those who remain.… This is a novel concerned with power — how it’s given and taken, whom we must align with to get close to it — and the consuming desire for more…. But simmering beneath all of this is the will to dream — for the self, the family and the nation.… What makes the book pulse with life is … the tenderness in its details, the ordinary ways that these characters love and laugh in the face of the extraordinary…. Chan shows us, with clarity and care, how the truest mirror comes from the intimacy of human connection.” —The New York Times Book Review "January may find you dry, blue and still vacuuming pine needles from the carpet. A favorite way to inject excitement into that postholiday apathy? Espionage. Vanessa Chan’s historical fiction debut, set in the 1930s and ’40s, centers on a Malayan mother of three. Seduced by the promise of an Asia for Asians, she sees that promise break during the Japanese occupation.” —The Morning newsletter, The New York Times “World War II might be the most popular subject for historical fiction, but Vanessa Chan's debut, The Storm We Made, defies the typical focus on the Western front and a clear-cut distinction between good and evil that characterizes many books… [a] heartbreaking story of a family riven by war.” —Jenny Shank, Minneapolis Star Tribune “The intrigue begins from page one of Malaysian author Vanessa Chan’s much-heralded debut novel. This historical family saga tells the story of a Malayan mother caught up in espionage during World War II through varying points of view, handled expertly by Chan.” —Hannah Bae, San Francisco Chronicle, Datebook "19 New Books to Cozy Up With This Winter" “An intricate puzzle in which [Chan] deftly moves narrative pieces in time and among viewpoints.” —Booklist "Utterly gripping... The Storm We Made moves effortlessly through time, building to a thrilling crescendo. Filled with unforgettable characters and beautiful, vivid language, this is a novel of family secrets, survival, and resilience during the darkest of times." —Electic Literature "Outstanding... Chan showcases dazzling stylistic flair as she alternates between timelines, blending thematic touches of thrilling spy craft and domestic drama within the outlines of this spellbinding historical novel. Profound in its empathy and devastating in its consequences, The Storm We Made considers the deeply personal implications of a world at war, and makes Vanessa Chan's first novel an unforgettable glimpse at how extraordinary times fall upon ordinary people." —Shelf Awareness "This refreshing, gripping historical fiction takes place in occupied Malaya during WWII and the decade that led up to it, telling a sotry of a family brought to the brink both by their oppressors and th eguilt of a mother who's kept a crushing secret. Told by four deeply real characters, you'll find yourself rooting for them even as they butt up against the limits of right and wrong." —Good Housekeeping "The Storm We Made is a dazzling debut novel about the horrors of war, the fraught relationships between the colonized and their oppressors, and the ambiguity of right and wrong when survival is at stake." —San Francisco Bay Chronicle "With action, intrigue, dazzling writing and a war front not often visited, The Storm We Made stands out from other WWII historical fiction... This is historical fiction at its most sweeping and heartbreaking." —Reader's Digest "Expect to be swept away from the first sentence... The Storm We Made bears the full weight of war and the endless costs that come with it, but is so triumphant in its depiction of survival, it soars." —Stylecaster "In her captivating debut, Chan unleashes a perfect storm of beauty, devastation, secrets, and success. Set during and before WWII, Chan follows an unlikely spy and how her actions may save a country but tear her family apart. This should be every reader's first book of 2024. Everyone I know who has read it has been flabbergasted by its brilliance." —Debutiful “The Storm We Made is poised to be a breakout debut of 2024.” —Kate Dwyer, Esquire "In her debut novel, Chan takes us to 1940s Malaysia (then known as Malaya), where, after helping to usher in a brutal occupation, Cecily Alcantara must confront the consequences of events on her three children: one is missing, one is sequestered in a basement, and the third works a tiresome job at a teahouse. Split into four perspectives, the narrative excavates the family and its relationships throughout World War II." —Alta"Exceptionally brave. Heart-breaking, beautiful, and moving. Destined to be a classic. The Storm We Made is a celebration of stories that have been silenced or erased. Vanessa Chan writes with admirable power, confidence and grace. By confronting the horror of colonization and war, this book opens the pathway to peace and healing. A significant contribution to world's literature." —Nguyen Phan Que Mai, author of the international bestseller, The Mountains Sing and Dust Child"The Storm We Made is brave, funny and immensely moving. One of the most powerful and confident debuts I’ve ever read. A storytelling star is b'''
