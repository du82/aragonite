title = "Anna O a book by Matthew Blake - Bookshop.org US"
full_description = '''{"@context":"https://schema.org","@type":["Product","Book"],"sku":"9780063314146","isbn":"9780063314146","gtin14":"09780063314146","image":["https://images-us.bookshop.org/ingram/9780063314146.jpg?v=enc-v1"],"name":"Anna O","description":"<p><strong>#1 International Bestseller</strong></p><p><strong><em>GMA</em> Buzz Pick&#160;&#8226;&#160;A <em>Today</em> Show Pick &#8226; A <em>People</em> Magazine Pick</strong></p><p><strong>&#8220;A riveting, unsettling crime novel that will keep you turning pages well past your bedtime. Is Anna O a sleeping beauty or a sleeping killer? Matthew Blake's tension-filled thriller is&#160;as elusive and mysterious as sleep itself.&#8221;</strong>&#8212;<strong>Nita Prose, #1&#160;<em>New York Times&#160;</em>author of&#160;<em>The Maid</em>&#160;and&#160;<em>The Mystery Guest</em></strong></p><p><strong>Joining the ranks of Gillian Flynn, A. J. Finn, and Alex Michaelides, Matthew Blake delivers the thriller of the year: a dark, twisty, and shocking mystery about a young woman who commits a double murder while sleepwalking, and then never opens her eyes again.</strong></p><p><strong>ANNA O WILL WAKE UP THE WORLD</strong></p><p><em>What if your nightmares weren&#8217;t really nightmares at all?</em></p><p>We spend an average of 33 years of our lives asleep. But what really happens, and what are we capable of, when we sleep?</p><p>Anna Ogilvy was a budding twenty-five-year-old writer with a bright future. Then, one night, she stabbed two people to death with no apparent motive&#8212;and hasn&#8217;t woken up since. Dubbed &#8220;Sleeping Beauty&#8221; by the tabloids, Anna&#8217;s condition is a rare psychosomatic disorder known to neurologists as &#8220;resignation syndrome.&#8221;</p><p>Dr. Benedict Prince is a forensic psychologist and an expert in the field of sleep-related homicides. His methods are the last hope of solving the infamous &#8220;Anna O&#8217;&#8221;case and waking Anna up so she can stand trial. But he must be careful treating such a high-profile suspect&#8212;he&#8217;s got career secrets and a complicated personal life of his own.</p><p>As Anna shows the first signs of stirring, Benedict must determine what really happened and whether Anna should be held responsible for her crimes.</p><p>Only Anna knows the truth about that night, but only Benedict knows how to discover it. And they&#8217;re both in danger from what they find out.</p>","brand":{"@type":"Brand","name":"Harper Paperbacks"},"publisher":{"@type":"Thing","name":"Harper Paperbacks"},"author":[{"@type":"Person","name":"Matthew Blake"}],"bookFormat":"Paperback / softback","datePublished":"2025-02-25","numberOfPages":432,"size":"8.0 X 5.3 X 1.1 inches | 10.9 pounds","offers":{"@type":"Offer","url":"https://bookshop.org/p/books/anna-o-matthew-blake/20231802?ean=9780063314146&next=t","itemCondition":"https://schema.org/NewCondition","availability":"https://schema.org/InStock","price":17.66,"priceCurrency":"usd","shippingDetails":{"@type":"OfferShippingDetails","shippingRate":{"@type":"MonetaryAmount","value":3.99,"currency":"USD"},"shippingDestination":{"@type":"DefinedRegion","addressCountry":"US"},"deliveryTime":{"@type":"ShippingDeliveryTime","handlingTime":{"@type":"QuantitativeValue","minValue":0,"maxValue":1,"unitCode":"DAY"},"transitTime":{"@type":"QuantitativeValue","minValue":3,"maxValue":5,"unitCode":"DAY"}}},"hasMerchantReturnPolicy":{"@type":"MerchantReturnPolicy","applicableCountry":"US","returnPolicyCategory":"https://schema.org/MerchantReturnFiniteReturnWindow","merchantReturnDays":30,"returnMethod":"https://schema.org/ReturnByMail","returnShippingFeesAmount":{"@type":"MonetaryAmount","value":3.99,"currency":"USD"}}}}Anna OA NovelMatthew Blake (Author)Paperback $18.99$17.66AvailablePaperback Large Print$34.00$31.62AvailableHardback $30.00$27.90AvailablePaperback $18.99$17.66AvailableAdd to WishlistShop Other Formats4.9/5.021,000+ ReviewsBookshop.org has the highest-rated customer service of any bookstore in the worldDescription#1 International BestsellerGMA Buzz Pick • A Today Show Pick • A People Magazine Pick“A riveting, unsettling crime novel that will keep you turning pages well past your bedtime. Is Anna O a sleeping beauty or a sleeping killer? Matthew Blake's tension-filled thriller is as elusive and mysterious as sleep itself.”—Nita Prose, #1 New York Times author of The Maid and The Mystery GuestJoining the ranks of Gillian Flynn, A. J. Finn, and Alex Michaelides, Matthew Blake delivers the thriller of the year: a dark, twisty, and shocking mystery about a young woman who commits a double murder while sleepwalking, and then never opens her eyes again.ANNA O WILL WAKE UP THE WORLDWhat if your nightmares weren’t really nightmares at all?We spend an average of 33 years of our lives asleep. But what really happens, and what are we capable of, when we sleep?Anna Ogilvy was a budding twenty-five-year-old writer with a bright future. Then, one night, she stabbed two people to death with no apparent motive—and hasn’t woken up since. Dubbed “Sleeping Beauty” by the tabloids, Anna’s condition is a rare psychosomatic disorder known to neurologists as “resignation syndrome.”Dr. Benedict Prince is a forensic psychologist and an expert in the field of sleep-related homicides. His methods are the last hope of solving the infamous “Anna O’”case and waking Anna up so she can stand trial. But he must be careful treating such a high-profile suspect—he’s got career secrets and a complicated personal life of his own.As Anna shows the first signs of stirring, Benedict must determine what really happened and whether Anna should be held responsible for her crimes.Only Anna knows the truth about that night, but only Benedict knows how to discover it. And they’re both in danger from what they find out.Product DetailsPublisherHarper PaperbacksPublish DateFebruary 25, 2025Pages432LanguageEnglishTypePaperback / softbackEAN/UPC9780063314146Dimensions8.0 X 5.3 X 1.1 inches | 10.9 poundsBISAC Categories: Mystery, Thrillers & Crime, Mystery, Thrillers & Crime, Mystery, Thrillers & CrimeProduct DetailsPublisherHarper PaperbacksPublish DateFebruary 25, 2025Pages432LanguageEnglishTypePaperback / softbackEAN/UPC9780063314146Dimensions8.0 X 5.3 X 1.1 inches | 10.9 poundsBISAC Categories: Mystery, Thrillers & Crime, Mystery, Thrillers & Crime, Mystery, Thrillers & CrimeAbout the AuthorMatthew Blake is a novelist and screenwriter. His debut psychological thriller Anna O was a global number one bestseller and published in over 40 territories. It is being developed for the screen by Netflix.Reviews"A riveting, unsettling crime novel that will keep you turning pages well past your bedtime. Is Anna O a sleeping beauty or a sleeping killer? Matthew Blake's tension-filled thriller is as elusive and mysterious as sleep itself." — Nita Prose, #1 New York Times bestselling author of The Maid and The Mystery Guest"An irresistible concept beautifully executed—certain to be one of the year's best thrillers." — Lee Child"The most talked about thriller of 2024." — Today Show"Steeped in mythology, psychology and true-crime lore, Blake's cliff-hanger features a young woman who's been asleep since she murdered her two besties four years earlier. Now it's time to wake up Sleeping Beauty . . . and unleash a cascade of twists likely to outfox all but the sharpest thriller mavens." — People"An audacious, inventive mystery, a thriller of ideas, and—here's irony for you—a novel about sleep to keep you up late. Anna O reads like a dream but unsettles like a nightmare; the premise is original, the writing stylish, and the payoff unforgettable. You won't forget her name." — A.J. Finn, #1 New York Times bestselling author of The Woman in the Window“A wickedly stunning work. Blake’s experience as a screenwriter is on full display here as he ramps up the suspense and carves out his cast of wonderful characters with the skill of a real pro. The twist is one of the best I’ve ever read and ranks right up there with The Silent Patient. Sure to be wildly popular and to have fans clamoring for Blake’s next work.” — David Baldacci"Like blockbusters such as The Maidens and The Girl on the Train." — The Washington Post"Once you pick it up, there’s no putting it down. Layered and grandly operatic in scope and tension." — Kirkus Reviews (starred review)“Anna O has cast a spell . . . which is partly a testament to Blake’s deft hand with characters. Prince is a fascinating unreliable narrator; the question of whether he’s merely annoying or something more sinister becomes a potent source of suspense. By the novel’s . . . twist-filled conclusion, I was . . . more than a little surprised." — Los Angeles Times“Blake never lets the reader, or his hero, get comfortable, delivering one game-changing twist after another. The exhilarating results are likely to shock even seasoned thriller fans.” — Publishers Weekly (starred review)"Entirely gripping . . . . Truly page-turning." — New York Post"Lionel Shriver’s new novel advances a coherent vision of the contemporary world." — Irish Independent“Anna O delivers one gasp after another as it moves relentlessly towards its surprising and remarkably persuasive finale." — The Anniston Star"Anna O sits at the pinnacle of psychological suspense! It’s a nonstop thrill ride through the darker sides of the human mind, filled with plot twists galore and populated by characters who are utterly real and undeniably appealing. This novel is written in the voice of a natural-born storyteller." — Jeffery Deaver“Anna O takes a spellbinding look at a sleeping disorder that sounds like the stuff of horror movies . . . With masterful control over a large cast of characters plus a plot that keeps you guessing, Blake proves to be at the top of his game with this story. Reminiscent of The Silent Patient in the best ways.” — Stephanie Wrobel“This one gets in your head. I may never sleep again.” — J.D. Barker, New York Times Bestselling author of Behind a Closed Door"Uproarious." — Mail on SundayEarn by promoting booksEarn money by sharing your favorite books through our Affiliate program.Become an affiliateBookshop.org Best Sellers of the WeekBookshop.org View All (25)'''
