["https://indiebound.org/buy-local/9780812986501"]
title = "The Book of Love a book by Kelly Link - Bookshop.org US"
full_description = '{"@context":"https://schema.org","@type":["Product","Book"],"sku":"9780812986501","isbn":"9780812986501","gtin14":"09780812986501","image":["https://images-us.bookshop.org/ingram/9780812986501.jpg?v=enc-v1"],"name":"The Book of Love","description":"<b>NATIONAL BESTSELLER &bull; FINALIST FOR THE <i>LOS ANGELES TIMES </i>BOOK PRIZE &bull; LONGLISTED FOR THE CENTER FOR FICTION FIRST NOVEL PRIZE &bull; In the acclaimed first novel from short story virtuoso and Pulitzer Prize finalist Kelly Link, three teenagers become pawns in a supernatural power struggle.</b><br><b> </b><br><b>&ldquo;A dreamlike, profoundly beautiful novel [that] pushes our understanding of what a fantasy novel can be.&rdquo;&mdash;Amal El-Mohtar, <i>The New York Times Book Review </i>(Editors&rsquo; Choice)</b><br><b> </b><br><b>&ldquo;Imagine a ring of David Mitchell and Stephen King books dancing around a fire until something new, brave, and wonderful rose up from the flames.&rdquo;&mdash;Isaac Fitzgerald, <i>Today<br><br></i><b>ONE OF <i>VULTURE</i> AND <i>PUBLISHER WEEKLY</i>&rsquo;S TEN BEST BOOKS OF THE YEAR</b> <br>A BEST BOOK OF THE YEAR: <i>The New York Times Book Review, </i>NPR, <i>The New Yorker, Time, Town &amp; Country, Esquire, Harper&rsquo;s Bazaar, New York Post, Book Riot, Lit Hub</i> </b><br><br><i>The Book of Love</i> showcases Kelly Link at the height of her powers, channeling potent magic and attuned to all varieties of love&mdash;from friendship to romance to abiding family ties&mdash;with her trademark compassion, wit, and literary derring-do. Readers will find joy (and a little terror) and an affirmation that love goes on, even when we cannot.<br><br>Late one night, Laura, Daniel, and Mo find themselves beneath the fluorescent lights of a high school classroom, almost a year after disappearing from their hometown, the small seaside community of Lovesend, Massachusetts, having long been presumed dead. Which, in fact, they are.<br><br>With them in the room is their previously unremarkable high school music teacher, who seems to know something about their disappearance&mdash;and what has brought them back again. Desperate to reclaim their lives, the three agree to the terms of the bargain their music teacher proposes. They will be given a series of magical tasks; while they undertake them, they may return to their families and friends, but they can tell no one where they&rsquo;ve been. In the end, there will be winners and there will be losers.<br><br>But their resurrection has attracted the notice of other supernatural figures, all with their own agendas. As Laura, Daniel, and Mo grapple with the pieces of the lives they left behind, and Laura&rsquo;s sister, Susannah, attempts to reconcile what she remembers with what she fears, these mysterious others begin to arrive, engulfing their community in danger and chaos, and it becomes imperative that the teens solve the mystery of their deaths to avert a looming disaster.<br><br>Welcome to Kelly Link&rsquo;s incomparable Lovesend, where you&rsquo;ll encounter love and loss, laughter and dread, magic and karaoke, and some really good pizza.","brand":{"@type":"Brand","name":"Random House Trade Paperbacks"},"publisher":{"@type":"Thing","name":"Random House Trade Paperbacks"},"author":[{"@type":"Person","name":"Kelly Link"}],"bookFormat":"Paperback / softback","datePublished":"2025-02-11","numberOfPages":640,"size":"7.9 X 5.2 X 1.3 inches | 0.9 pounds","offers":{"@type":"Offer","url":"https://bookshop.org/p/books/the-book-of-love-kelly-link/20099222?ean=9780812986501&next=t","itemCondition":"https://schema.org/NewCondition","availability":"https://schema.org/InStock","price":18.6,"priceCurrency":"usd","shippingDetails":{"@type":"OfferShippingDetails","shippingRate":{"@type":"MonetaryAmount","value":3.99,"currency":"USD"},"shippingDestination":{"@type":"DefinedRegion","addressCountry":"US"},"deliveryTime":{"@type":"ShippingDeliveryTime","handlingTime":{"@type":"QuantitativeValue","minValue":0,"maxValue":1,"unitCode":"DAY"},"transitTime":{"@type":"QuantitativeValue","minValue":3,"maxValue":5,"unitCode":"DAY"}}},"hasMerchantReturnPolicy":{"@type":"MerchantReturnPolicy","applicableCountry":"US","returnPolicyCategory":"https://schema.org/MerchantReturnFiniteReturnWindow","merchantReturnDays":30,"returnMethod":"https://schema.org/ReturnByMail","returnShippingFeesAmount":{"@type":"MonetaryAmount","value":3.99,"currency":"USD"}}}}The Book of LoveA NovelKelly Link (Author)Paperback $20.00$18.60AvailableHardback $31.00$28.83AvailablePaperback $20.00$18.60AvailableAdd to Wishlist4.9/5.021,000+ ReviewsBookshop.org has the highest-rated customer service of any bookstore in the worldDescriptionNATIONAL BESTSELLER • FINALIST FOR THE LOS ANGELES TIMES BOOK PRIZE • LONGLISTED FOR THE CENTER FOR FICTION FIRST NOVEL PRIZE • In the acclaimed first novel from short story virtuoso and Pulitzer Prize finalist Kelly Link, three teenagers become pawns in a supernatural power struggle. “A dreamlike, profoundly beautiful novel [that] pushes our understanding of what a fantasy novel can be.”—Amal El-Mohtar, The New York Times Book Review (Editors’ Choice) “Imagine a ring of David Mitchell and Stephen King books dancing around a fire until something new, brave, and wonderful rose up from the flames.”—Isaac Fitzgerald, TodayONE OF VULTURE AND PUBLISHER WEEKLY’S TEN BEST BOOKS OF THE YEAR A BEST BOOK OF THE YEAR: The New York Times Book Review, NPR, The New Yorker, Time, Town & Country, Esquire, Harper’s Bazaar, New York Post, Book Riot, Lit Hub The Book of Love showcases Kelly Link at the height of her powers, channeling potent magic and attuned to all varieties of love—from friendship to romance to abiding family ties—with her trademark compassion, wit, and literary derring-do. Readers will find joy (and a little terror) and an affirmation that love goes on, even when we cannot.Late one night, Laura, Daniel, and Mo find themselves beneath the fluorescent lights of a high school classroom, almost a year after disappearing from their hometown, the small seaside community of Lovesend, Massachusetts, having long been presumed dead. Which, in fact, they are.With them in the room is their previously unremarkable high school music teacher, who seems to know something about their disappearance—and what has brought them back again. Desperate to reclaim their lives, the three agree to the terms of the bargain their music teacher proposes. They will be given a series of magical tasks; while they undertake them, they may return to their families and friends, but they can tell no one where they’ve been. In the end, there will be winners and there will be losers.But their resurrection has attracted the notice of other supernatural figures, all with their own agendas. As Laura, Daniel, and Mo grapple with the pieces of the lives they left behind, and Laura’s sister, Susannah, attempts to reconcile what she remembers with what she fears, these mysterious others begin to arrive, engulfing their community in danger and chaos, and it becomes imperative that the teens solve the mystery of their deaths to avert a looming disaster.Welcome to Kelly Link’s incomparable Lovesend, where you’ll encounter love and loss, laughter and dread, magic and karaoke, and some really good pizza.Product DetailsPublisherRandom House Trade PaperbacksPublish DateFebruary 11, 2025Pages640LanguageEnglishTypePaperback / softbackEAN/UPC9780812986501Dimensions7.9 X 5.2 X 1.3 inches | 0.9 poundsBISAC Categories: Fantasy, Popular Fiction, Popular FictionProduct DetailsPublisherRandom House Trade PaperbacksPublish DateFebruary 11, 2025Pages640LanguageEnglishTypePaperback / softbackEAN/UPC9780812986501Dimensions7.9 X 5.2 X 1.3 inches | 0.9 poundsBISAC Categories: Fantasy, Popular Fiction, Popular FictionAbout the AuthorKelly Link is the author of White Cat, Black Dog; Get in Trouble, a finalist for the Pulitzer Prize in fiction; Magic for Beginners; Stranger Things Happen; and Pretty Monsters. Her short stories have been published in The Best American Short Stories and Prize Stories: The O. Henry Awards. She is a MacArthur “Genius” fellow and has received a grant from the National Endowment for the Arts. She is the co-founder of Small Beer Press and co-edits the occasional zine Lady Churchill’s Rosebud Wristlet. She is also the co-owner of Book Moon, an independent bookstore in Easthampton, Massachusetts.Reviews“[The Book of Love] pushes our understanding of what fantasy can be.”—The New York Times, 100 Notable Books of 2024“No other book made me cry quite so much or love quite so hard.”—NPR, Best Books of 2024“The escapist masterpiece of the year.”—Vulture, Best Books of 2024“A wild, compelling ride, full of fantastical twists and turns.”—Town & Country, Best Books of 2024 “A heart-squeezing tale of wonder and life that hugs your brain in the best way.”—Book Riot, Best Books of 2024“An incredible achievement—a novel whose people and places feel so true to life that the magic that shimmers through the pages like grown-up fairy dust seems not just real but unquestionable.”—Cassandra Clare, author of Sword Catcher“By turns playful and harrowing, surreal and sagacious, replete with gods and other monsters, The Book of Love is an astonishing, gorgeous novel written with Link’s unique wit, warmth and ability to get under your skin.”—Holly Black, author of Book of Night“The places of this novel are both glitteringly strange and so fully realized that one feels one might visit them tomorrow.”—San Francisco Chronicle“Sublime . . . [The characters’] boldness and exhilaration are infectious. For a minute there, I even thought I could fly.”—The Boston Globe“The wonders of Hollywood special effects feel like garish imitations next to Link’s sorcery.”—The Washington Post“[If you] find yourself wishing for a little more magic in your life, this is the novel for you.”—Lit Hub“A dizzying dream ride you will never forget.”—Leigh Bardugo, author of Ninth House“Haunting, immersive, and at times surpassingly beautiful.”—Locus“This is one of those books that cuts your life in two: before you read it, and after.”—Alix E. Harrow, author of Starling House“A giant, glorious novel about friendship, love, queerness, rock-and-roll, stardom, parenthood, loyalty, lust and duty.”—Cory Doctorow, author of The Lost Cause“A luxurious, bewitching novel of exceptional beauty and power.”—Carmen Maria Machado, author of In the Dream House“Pure enchantment—a tale of love, death, magic and teenagers being teenagers, rich with fairy strangeness and told in sentences like jewels strung on a chain.”—Zen Cho, author of Black Water Sister“An absolute feast of a story, ushering the reader along a path that is always sublime, often hilarious, and at every single point rammed full of heart and truth.”—Melinda Salisbury, author of Her Dark WingsEarn by promoting booksEarn money by sharing your favorite books through our Affiliate program.Become an affiliateBookshop.org Best Sellers of the WeekBookshop.org View All (25)'
