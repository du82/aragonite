full_description = '''{"@context":"https://schema.org","@type":["Product","Book"],"sku":"9780063351219","isbn":"9780063351219","gtin14":"09780063351219","image":["https://images-us.bookshop.org/ingram/9780063351219.jpg?v=enc-v1"],"name":"The Hidden Life of Cecily Larson","description":"<p><strong>A special paperback edition with colored sprayed edges of this compelling multigenerational novel of survival, love, and the families we make.</strong></p><p><strong>&#8220;A family secret, a DNA test, a journey as rich and colorful as the early-day circus itself. Through Cecily Larson&#8217;s hidden life, Ellen Baker tenderly examines personal determination, lost love, family ties, and our innate need to discover our own truth.&#8221;&#160;&#8212;&#160;Lisa Wingate, #1&#160;<em>New York Times</em>&#160;bestselling author</strong></p><p>In 1924, four-year-old Cecily Larson&#8217;s mother reluctantly drops her off at an orphanage in Chicago, promising to be back once she&#8217;s made enough money to support both Cecily and herself. But she never returns, and shortly after high-spirited Cecily turns seven, she is sold to a traveling circus to perform as the &#8220;little sister&#8221; to glamorous bareback rider Isabelle DuMonde. With Isabelle and the rest of the circus, Cecily finally feels she&#8217;s found the family she craves. But as the years go by, the cracks in her little world begin to show. And when teenage Cecily meets and falls in love with a young roustabout named Lucky, she finds her life thrown onto an entirely unexpected&#8212;and dangerous&#8212;course.</p><p>In 2015, Cecily is now 94 and living a quiet life in Minnesota, with her daughter, granddaughter, and great-grandson. But when her family decides to surprise her with an at-home DNA test, the unexpected results not only bring to light the tragic love story that Cecily has kept hidden for decades but also throw into question everything about the family she&#8217;s raised and claimed as her own for nearly 