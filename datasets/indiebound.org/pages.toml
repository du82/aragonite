title = "Expiration Dates a book by Rebecca Serle - Bookshop.org US"
full_description = '{"@context":"https://schema.org","@type":["Product","Book"],"sku":"9781982166830","isbn":"9781982166830","gtin14":"09781982166830","image":["https://images-us.bookshop.org/ingram/9781982166830.jpg?v=enc-v1"],"name":"Expiration Dates","description":"<b>The <i>New York Times</i> bestselling author of <i>In Five Years</i> and <i>One Italian Summer </i>returns with &ldquo;a romantic gem&rdquo; (Laura Dave, <i>New York Times </i>bestselling author) about a young woman who decides to finally live for herself rather than rely on the universe for answers. Now featuring bonus content! </b><BR><BR>Daphne Bell believes the universe has a plan for her. Every time she meets a new man, she receives a slip of paper with his name and a number on it&#8212;the exact amount of time they will be together. The papers told her she&rsquo;d spend three days with Martin in Paris; five weeks with Noah in San Francisco; and three months with Hugo, her ex-boyfriend turned best friend. Daphne has been receiving the numbered papers for over twenty years, always wondering when there might be one without an expiration. Finally, the night of a blind date at her favorite Los Angeles restaurant, there&rsquo;s only a name: Jake.<BR> <BR>But as Jake and Daphne&rsquo;s story unfolds, Daphne finds herself doubting the paper&rsquo;s prediction, and wrestling with what it means to be both committed and truthful. Because Daphne knows things Jake doesn&rsquo;t, information that&#8212;if he found out&#8212;would break his heart.<BR> <BR>&ldquo;Daphne&rsquo;s sometimes heart-wrenching, often heartwarming search for meaningful relationships, both romantic and platonic, is sure to inspire&rdquo; (<i>Publishers Weekly</i>, starred review) new and longtime fans of Rebecca Serle.","brand":{"@type":"Brand","name":"Atria Books"},"publisher":{"@type":"Thing","name":"Atria Books"},"author":[{"@type":"Person","name":"Rebecca Serle"}],"bookFormat":"Paperback / softback","datePublished":"2025-02-04","n