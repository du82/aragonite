["https://indiebound.org/blog-posts"]
title = "IndieBound Blog | IndieBound.org"
full_description = "Locate Stores:by Name|by ZIP IndieBound FAQ Affiliate Program eBooks & Audiobooks Indie Bestsellers Indie Next List Kids’ Next List Reading Groups Spotlight on Amazon Black Lives Matter Well-Read Black Girl Sign In|My Account Get Help|Security & Privacy|Terms of Use IndieBound Blog 44th & 3rd Bookseller On Paying Homage to Obama and Uplifting Black AuthorsFeatured Bookstores2/19/2025 44th & 3rd Bookseller is a family-owned bookstore whose mission is to be a source of unbiased literature that shares the rich cultural experience of the Black community. Co-founder Cheryl Lee met with Bookselling This Week to share her story. The Food Temptress On Preserving History Through Food and Promoting Cookbooks By Black AuthorsFeatured Bookstores2/5/2025 The Food Temptress Cookbook Store in Virginia Beach, VA, specializes in cookbooks written by Black authors. As the owner and sole employee, Rekaya Gibson is on a mission to “connect customers to cookbooks by Black authors that inspire creativity and preserve food traditions.” I met with Gibson to learn more about the store’s origin, mission, and operation. The King's English Bookshop: 47 Years As Salt Lake City's Indie BookstoreFeatured Bookstores11/27/2024 The King’s English Bookshop has been serving Salt Lake City, Utah, since 1977. With 47 years of bookselling behind it, I met with co-owner Anne Holman to learn more about the store’s history, its growth, and what’s in store for the future. How Em and Em's Books Curated a Diverse Collection with Only Used BooksFeatured Bookstores11/13/2024 Em and Em’s Books is an online and pop-up independent bookstore based in Buffalo, New York. As a queer and partially native-owned business, focuses on work by LGBTQIA2S+, BIPOC, and women authors and donates a portion of the profits each month to a different charity or nonprofit. I met with co-owners Emma Hayes and Emily Graham to learn more about the store’s origin, operation, and future goals. Death By TBR Books: Creating a Virtual CommunityFeatured Bookstores10/2/2024 When Stephanie Csaszar opened a physical bookstore in 2018, she had next to no online presence. But as the pandemic progressed and her own health deteriorated, Csaszar made the shift to a fully online store. Today, Death By TBR Books specializes in genre fiction and operates out of Csaszar’s home in Washington. I sat down with Csaszar to learn how she came to bookselling, how Death By TBR has evolved, and where it’s going in the future. Spiral Circle: 50 Years As Orlando's Metaphysical Bookstore Featured Bookstores9/18/2024 Spiral Circle, a metaphysical bookstore in Orlando, Florida, will celebrate its 50th year of operation in 2025. Founded in 1975, the shop has long been a little haven near downtown Orlando. I met with owner Julie Wilder, as well as Christina Ray, intuitive reader and book buyer, to learn more about Spiral Circles’ past and future, as well as the unique challenges of running a metaphysical bookstore. Pagination Page 1 Next page ›› IndieBound Blog Topics Advocacy Education Featured Bookstores"
