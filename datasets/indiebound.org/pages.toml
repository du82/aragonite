title = "Bookshop.org Affiliate Program | IndieBound.org"
description = "Beginning March 1, 2023, you can show your support of independent bookstores by signing up as a Bookshop affiliate and replacing your IndieBound.org buy button with a Bookshop.org buy button. Below is the new Bookshop.org button. The new tagline makes it clear that shopping Bookshop.org supports indies."
full_description = "Bookshop.org Affiliate Program Beginning March 1, 2023, you can show your support of independent bookstores by signing up as a Bookshop affiliate and replacing your IndieBound.org buy button with a Bookshop.org buy button. Below is the new Bookshop.org button. The new tagline makes it clear that shopping Bookshop.org supports indies. If you’re not familiar with Bookshop.org then we’re glad we have this opportunity to introduce you! Bookshop is an online bookstore and B-Corp with a mission to financially support local, independent bookstores. The best way to support your local, independent bookstore is to shop directly with them. The second best way is to shop with Bookshop.org. Bookshop has donated $24.7M dollars to independent bookstores since it launched in 2020. You can find your local, independent bookstore on Bookshop.org’s Store Finder, shop your local, independent bookstore’s affiliate page on Bookshop.org, or purchase books on Bookshop.org knowing that 10% of your purchase will go directly into a pool that’s distributed to independent bookstores. Many stores credit Bookshop.org with their survival during the pandemic, and Bookshop.org is a key factor in the profitability of many stores. Bookshop.org now has over two million customers and, according to Bookshop.org’s customer research, 78% of them switched from buying from Amazon to supporting the indie channel when they buy online. Your Next Steps Instructions on how to become a Bookshop affiliate are here. Until you make this change, your IndieBound.org buy button will redirect to Bookshop.org automatically beginning March 1, 2023. Don’t worry, your old links & buttons will not break. (Your links will continue to work but in order to continue generating affiliate revenue be sure and set yourself up as a Bookshop affiliate and add your Bookshop button.)"
