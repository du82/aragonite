["https://indiebound.org/indies-first"]
title = "Indie Bookstore Day | IndieBound.org"
description = "Indie Bookstore Day SATURDAY, APRIL 26, 2025 Independent Bookstore Day is a one-day national party that takes place at indie bookstores across the country on the last Saturday in April."
full_description = "Indie Bookstore Day Indie Bookstore Day SATURDAY, APRIL 26, 2025 Independent Bookstore Day is a one-day national party that takes place at indie bookstores across the country on the last Saturday in April. The American Booksellers Association is thrilled to announce Trevor Noah as the 2025 official spokesperson for Independent Bookstore Day, an annual event that celebrates the spirit and value of independent bookstores that takes place the last Saturday of April. Past spokespeople have included Amanda Gorman, Celeste Ng, Roxane Gay, Dan Rather, N.K. Jemisin, Jason Reynolds, Cheryl Strayed, and more. Trevor Noah is one of the most successful comedians in the world and was the host of the Emmy® Award-winning “The Daily Show” on Comedy Central. Trevor has also notably served as the Grammy Awards host for four years in a row. Trevor currently hosts a Spotify original weekly podcast titled What Now? With Trevor Noah. Trevor is the author of the #1 New York Times bestseller Born a Crime: Stories from a South African Childhood which won the 2017 Thurber Prize for American Humor. Trevor's success has also spanned to sold out stand-up comedy shows across 5 continents and 4 Netflix stand-up specials which received multiple Emmy and Grammy nominations. Trevor moved from in front of the camera to a behind-the-scenes turn as executive producer with his Emmy-nominated production company, Day Zero Productions (DZP). In 2018, Trevor launched the Trevor Noah Foundation to improve equitable access to quality education for underserved youth in South Africa. Trevor’s vision is a world where education enables youth to dream, see and build the impossible. Readers are invited to celebrate Indie Bookstore Day by visiting their favorite local bookstore (or bookstores!) the last Saturday of April. Authors and illustrators who would like to participate in Indie Bookstore Day are encouraged to: Reach out to their favorite local indie bookstore to participate in an event or hand-sell books on Indie Bookstore Day Link to Bookshop.org or their favorite local store on their websitePromote their favorite stores by posting a message or video on social media Encourage followers to shop local and buy books from their indie bookstore Follow news about Indie Bookstore Day in Bookselling This Week and via the hashtag #IndieBookstoreDay on social media. Inquiries about Indie Bookstore Day can be directed to ibd@bookweb.org. #button-5qmy0jzvmeii{background:#aa1a22;color:#fff;border-color:#aa1a22;} #button-5qmy0jzvmeii:hover{background:#000;color:#fff;border-color:#000;}"
