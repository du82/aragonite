his steamy college romance by the bestselling author of The Love Hypothesis. Rank last week: 1 Weeks on List: 3 #2: Fourth Wing By Rebecca Yarros Entangled: Red Tower Books Buy Enter the brutal and elite world of a war college for dragon riders from bestselling author Rebecca Yarros. Rank last week: 2 Weeks on List: 23 #3: Martyr! By Kaveh Akbar Vintage Buy A newly sober, orphaned son of Iranian immigrants, guided by the voices of artists, poets, and kings, embarks on a remarkable search for a family secret that leads him to a terminally ill painter living out her final days in the Brooklyn Museum. Electrifying, funny, and wholly original, Martyr! heralds the arrival of an essential new voice in contemporary fiction. Rank last week: 3 Weeks on List: 8 #4: The Frozen River By Ariel Lawhon Vintage Buy A gripping historical mystery inspired by the life and diary of Martha Ballard, a renowned 18th-century midwife who defied the legal system and wrote herself into American history. Rank last week: 4 Weeks on List: 16 #5: Parable of the Sower By Octavia E. Butler Grand Central Buy A post-apocalyptic novel of hope and terror by the bestselling author of Kindred. Rank last week: 5 Weeks on List: 28 #6: Demon Copperhead By Barbara Kingsolver Harper Perennial Buy Kingsolver's brilliant novel enthralls, compels, and captures the heart as it evokes a young hero's unforgettable journey to maturity. A November 2022 Indie Next Pick and a winner of the 2023 Pulitzer Prize for Fiction. Rank last week: 6 Weeks on List: 26 #7: Orbital By Samantha Harvey Grove Press Buy Orbital is an eloquent meditation on space and life on our planet through the eyes of six astronauts circling the earth in 24 hours. Winner of the Booker Prize 2024. Rank last week: 7 Weeks on List: 15 #8: North Woods By Daniel Mason Random House Trade Paperbacks Buy When two young lovers abscond from a Puritan colony, little do they know that their humble cabin in the woods will become the home of an extraordinary succession of human and nonhuman characters alike. Rank last week: 9 Weeks on List: 21 #9: The Crash By Freida McFadden Poisoned Pen Press Buy A new psychological thriller from bestselling author Freida McFadden! The nightmare she's running from is nothing compared to where she's headed. Rank last week: 8 Weeks on List: 4 #10: A Court of Thorns and Roses By Sarah J. Maas Bloomsbury Publishing Buy From bestselling author Sarah J. Maas comes a seductive, breathtaking book that blends romance, adventure, and faerie lore into an unforgettable read. Rank last week: 11 Weeks on List: * #11: The Handmaid's Tale By Margaret Atwood Anchor Buy Atwood's funny, unexpected, horrifying, and altogether convincing novel is at once scathing satire, dire warning, and literary tour de force. Now a Hulu series. Rank last week: 12 Weeks on List: * #12: Yellowface By R. F. Kuang William Morrow Paperbacks Buy Yellowface grapples with questions of diversity, racism, and cultural appropriation, as well as the terrifying alienation of social media. R. F. Kuang's novel is timely, razor-sharp, and eminently readable. Rank last week: 13 Weeks on List: 7 #13: The Housemaid By Freida McFadden Grand Central Buy An addictive psychological thriller with a jaw-dropping twist, Freida McFadden's The Housemaid is perfect for fans of Ruth Ware, Lisa Jewell, and Verity. Rank last week: NEW Weeks on List: 32 #14: The Berry Pickers By Amanda Peters Catapult Buy A four-year-old Mikmaq girl goes missing from the blueberry fields of Maine, sparking a mystery that will haunt the survivors, unravel a family, and remain unsolved for nearly fifty years. Rank last week: 15 Weeks on List: 17 #15: First Lie Wins By Ashley Elston Penguin Buy Evie Porter has everything a nice, Southern girl could want: a perfect, doting boyfriend, a house with a white picket fence and a garden, a fancy group of friends. The only catch: Evie Porter doesn't exist. Rank last week: NEW Weeks on List: 2 Trade Paperback Nonfiction Bestsellers #1: On Tyranny: Twenty Lessons from the Twentieth Century By Timothy Snyder Crown Buy Today, our political order faces new threats, not unlike the totalitarianism of the 20th century. We are no wiser than the Europeans who saw democracy yield to fascism, Nazism, or communism. Our one advantage is that we might learn from their experience. Rank last week: 1 Weeks on List: * #2: Braiding Sweetgrass: Indigenous Wisdom, Scientific Knowledge, and the Teachings of Plants By Robin Wall Kimmerer Milkweed Editions Buy Drawing on her life as an Indigenous scientist, and as a woman, Kimmerer shows how other living beings offer us gifts and lessons, even if we've forgotten how to hear their voices. Rank last week: 2 Weeks on List: * #3: The Backyard Bird Chronicles By Amy Tan Knopf Buy A gorgeous, witty account of birding, nature, and the beauty around us that hides in plain sight, written and illustrated by the best-selling author of The Joy Luck Club. Rank last week: 3 Weeks on List: 41 #4: All About Love: New Visio"
