title = "#BoxedOut Campaign | IndieBound.org"
description = "For booksellers participating in the #BoxedOut campaign, the American Booksellers Association has assembled various assets for social media, posters to hang in bookstores, and DIY display materials."
full_description = "#BoxedOut Campaign #BoxedOut Materials for Bookstores For booksellers participating in the #BoxedOut campaign, the American Booksellers Association has assembled various assets for social media, posters to hang in bookstores, and DIY display materials. Access Materials Here; Filter by #BoxedOut Locate Stores:by Name|by ZIP IndieBound FAQ Affiliate Program eBooks & Audiobooks Indie Bestsellers Indie Next List Kids’ Next List Reading Groups Spotlight on Amazon Black Lives Matter Well-Read Black Girl Sign In|My Account Get Help|Security & Privacy|Terms of Use #BoxedOut #ShopIndie To tangibly demonstrate how our world is being overtaken by cardboard Amazon boxes, the American Booksellers Association launched the #BoxedOut campaign, featuring cardboard coverings engulfing booksellers’ storefronts and piles of cardboard boxes spilling out of these now-cardboard buildings. The brown boxes that have become ubiquitous in building lobbies and on porches are “boxing out” bookstores and other small businesses all across the country, resulting in the loss of local jobs, local sales tax, community, and support. To tangibly demonstrate how our world is being overtaken by cardboard Amazon boxes, the American Booksellers Association launched the #BoxedOut campaign, featuring cardboard coverings engulfing booksellers’ storefronts and piles of cardboard boxes spilling out of these now-cardboard buildings. The brown boxes that have become ubiquitous in building lobbies and on porches are “boxing out” bookstores and other small businesses all across the country, resulting in the loss of local jobs, local sales tax, community, and support. People may not realize the cost and consequences of ‘convenience’ shopping until it's too late… Closed indie bookstores represent the loss of local jobs and local tax dollars; the loss of community centers; and the loss of opportunities for readers to discover books and connect with other readers in a meaningful face-to-face way.” — Allison K Hill, CEO of ABA #BoxedOut Campaign #BoxedOut Materials for Bookstores For booksellers participating in the #BoxedOut campaign, the American Booksellers Association has assembled various assets for social media, posters to hang in bookstores, and DIY display materials. Access Materials Here; Filter by #BoxedOut"
