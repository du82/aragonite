 Hugo, her ex-boyfriend turned best friend. Daphne has been receiving the numbered papers for over twenty years, always wondering when there might be one without an expiration. Finally, the night of a blind date at her favorite Los Angeles restaurant, there’s only a name: Jake. But as Jake and Daphne’s story unfolds, Daphne finds herself doubting the paper’s prediction, and wrestling with what it means to be both committed and truthful. Because Daphne knows things Jake doesn’t, information that—if he found out—would break his heart. “Daphne’s sometimes heart-wrenching, often heartwarming search for meaningful relationships, both romantic and platonic, is sure to inspire” (Publishers Weekly, starred review) new and longtime fans of Rebecca Serle.Product DetailsPublisherAtria BooksPublish DateFebruary 04, 2025Pages288LanguageEnglishTypePaperback / softbackEAN/UPC9781982166830Dimensions209.6 X 134.9 X 25.4 mm | 213.2 gBISAC Categories: Popular Fiction, Romance, Literary FictionProduct DetailsPublisherAtria BooksPublish DateFebruary 04, 2025Pages288LanguageEnglishTypePaperback / softbackEAN/UPC9781982166830Dimensions209.6 X 134.9 X 25.4 mm | 213.2 gBISAC Categories: Popular Fiction, Romance, Literary FictionAbout the AuthorRebecca Serle is the New York Times bestselling author of Expiration Dates, One Italian Summer, In Five Years, The Dinner List, and the young adult novels The Edge of Falling and When You Were Mine. Serle also developed the hit TV adaptation Famous in Love, based on her YA series of the same name. She is a graduate of USC and The New School and lives in Los Angeles with her husband. Find out more at RebeccaSerle.com.Earn by promoting booksEarn money by sharing your favorite books through our Affiliate program.Become an affiliateBookshop.org Best Sellers of the WeekBookshop.org View All (25)'
