title = "The Warm Hands of Ghosts a book by Katherine Arden - Bookshop.org US"
full_description = '{"@context":"https://schema.org","@type":["Product","Book"],"sku":"9780593128275","isbn":"9780593128275","gtin14":"09780593128275","image":["https://images-us.bookshop.org/ingram/9780593128275.jpg?v=enc-v1"],"name":"The Warm Hands of Ghosts","description":"<b>NATIONAL BESTSELLER &bull; During the Great War, a combat nurse searches for her brother, believed dead in the trenches despite eerie signs that suggest otherwise, in this hauntingly beautiful historical novel with a speculative twist, from the author of <i>The Bear and the Nightingale</i>.<br><br>&ldquo;A wonderful clash of fire and ice&mdash;a book you won&rsquo;t want to let go of.&rdquo;&mdash;Diana Gabaldon, author of <i>Outlander</i></b><br><br><b>&ldquo;Spectacular&mdash;a tour de force, wonderful and deep and haunting.&rdquo;&mdash;Naomi Novik, author of <i>A Deadly Education</i><br></b><br><b>ONE OF <i>BOOKPAGE</i>&rsquo;S TEN BEST BOOKS OF THE YEAR</b><br><br><i>January 1918. </i>Laura Iven was a revered field nurse until she was wounded and discharged from the medical corps, leaving behind a brother still fighting in Flanders. Now home in Halifax, Canada, Laura receives word of Freddie&rsquo;s death in combat, along with his personal effects&mdash;but something doesn&rsquo;t make sense. Determined to uncover the truth, Laura returns to Belgium as a volunteer at a private hospital, where she soon hears whispers about haunted trenches and a strange hotelier whose wine gives soldiers the gift of oblivion. Could Freddie have escaped the battlefield, only to fall prey to something&mdash;or someone&mdash;else?<br><br> <i>November 1917. </i>Freddie Iven awakens after an explosion to find himself trapped in an overturned pillbox with a wounded enemy soldier, a German by the name of Hans Winter. Against all odds, the two form an alliance and succeed in clawing their way out. Unable to bear the thought of returning to the killing fields, especially on opposite sides, they take refuge with a mysterious man who seems to have the power to make the hellscape of the trenches disappear.<br><br> As shells rain down on Flanders and ghosts move among those yet living, Laura&rsquo;s and Freddie&rsquo;s deepest traumas are reawakened. Now they must decide whether their world is worth salvaging&mdash;or better left behind entirely.","brand":{"@type":"Brand","name":"Del Rey"},"publisher":{"@type":"Thing","name":"Del Rey"},"author":[{"@type":"Person","name":"Katherine Arden"}],"bookFormat":"Paperback / softback","datePublished":"2025-01-28","numberOfPages":352,"size":"8.2 X 5.5 X 0.7 inches | 0.6 pounds","offers":{"@type":"Offer","url":"https://bookshop.org/p/books/the-warm-hands-of-ghosts-katherine-arden/20095341?ean=9780593128275&next=t","itemCondition":"https://schema.org/NewCondition","availability":"https://schema.org/InStock","price":17.67,"priceCurrency":"usd","shippingDetails":{"@type":"OfferShippingDetails","shippingRate":{"@type":"MonetaryAmount","value":3.99,"currency":"USD"},"shippingDestination":{"@type":"DefinedRegion","addressCountry":"US"},"deliveryTime":{"@type":"ShippingDeliveryTime","handlingTime":{"@type":"QuantitativeValue","minValue":0,"maxValue":1,"unitCode":"DAY"},"transitTime":{"@type":"QuantitativeValue","minValue":3,"maxValue":5,"unitCode":"DAY"}}},"hasMerchantReturnPolicy":{"@type":"MerchantReturnPolicy","applicableCountry":"US","returnPolicyCategory":"https://schema.org/MerchantReturnFiniteReturnWindow","merchantReturnDays":30,"returnMethod":"https://schema.org/ReturnByMail","returnShippingFeesAmount":{"@type":"MonetaryAmount","value":3.99,"currency":"USD"}}}}The Warm Hands of GhostsA NovelKatherine Arden (Author)Paperback $19.00$17.67AvailableHardback $28.99$26.96AvailableHardback Library BindingLarge Print$44.84AvailablePaperback $19.00$17.67AvailableAdd to WishlistShop Other Formats4.9/5.021,000+ ReviewsBookshop.org has the highest-rated customer service of any bookstore in the worldDescriptionNATIONAL BESTSELLER • During the Great War, a combat nurse searches for her brother, believed dead in the trenches despite eerie signs that suggest otherwise, in this hauntingly beautiful historical novel with a speculative twist, from the author of The Bear and the Nightingale.“A wonderful clash of fire and ice—a book you won’t want to let go of.”—Diana Gabaldon, author of Outlander“Spectacular—a tour de force, wonderful and deep and haunting.”—Naomi Novik, author of A Deadly EducationONE OF BOOKPAGE’S TEN BEST BOOKS OF THE YEARJanuary 1918. Laura Iven was a revered field nurse until she was wounded and discharged from the medical corps, leaving behind a brother still fighting in Flanders. Now home in Halifax, Canada, Laura receives word of Freddie’s death in combat, along with his personal effects—but something doesn’t make sense. Determined to uncover the truth, Laura returns to Belgium as a volunteer at a private hospital, where she soon hears whispers about haunted trenches and a strange hotelier whose wine gives soldiers the gift of oblivion. Could Freddie have escaped the battlefield, only to fall prey to something—or someone—else? November 1917. Freddie Iven awakens after an explosion to find himself trapped in an overturned pillbox with a wounded enemy soldier, a German by the name of Hans Winter. Against all odds, the two form an alliance and succeed in clawing their way out. Unable to bear the thought of returning to the killing fields, especially on opposite sides, they take refuge with a mysterious man who seems to have the power to make the hellscape of the trenches disappear. As shells rain down on Flanders and ghosts move among those yet living, Laura’s and Freddie’s deepest traumas are reawakened. Now they must decide whether their world is worth salvaging—or better left behind entirely.Product DetailsPublisherDel ReyPublish DateJanuary 28, 2025Pages352LanguageEnglishTypePaperback / softbackEAN/UPC9780593128275Dimensions8.2 X 5.5 X 0.7 inches | 0.6 poundsBISAC Categories: Fantasy, Historical Fiction, FantasyProduct DetailsPublisherDel ReyPublish DateJanuary 28, 2025Pages352LanguageEnglishTypePaperback / softbackEAN/UPC9780593128275Dimensions8.2 X 5.5 X 0.7 inches | 0.6 poundsBISAC Categories: Fantasy, Historical Fiction, FantasyAbout the AuthorKatherine Arden is the New York Times bestselling author of the Winternight trilogy and the Small Spaces Quartet. In addition to writing, she enjoys aimless travel, growing vegetables, and running wild through the woods with her dog, Moose. She lives in Vermont.Reviews“A spectacular tour de force by one of my favorite authors, so wonderful and deep and haunting that you might well imagine it required a Faustian bargain of its own—I love this book so much and want everyone to read it!”—Naomi Novik, author of A Deadly Education“Katherine Arden’s effortless blend of history and folklore is sure to entrance again with this stunning foray into the twentieth century, where ghosts walk, dreams blunt trauma, and myth becomes real.”—Kate Quinn, author of The Diamond Eye“Darkly beautiful and deeply humane, this is a story of love that reaches across borders and across oceans, and even penetrates the veil of death. It will stir your heart and settle into your bones.”—Ava Reid, author of A Study in Drowning“The Warm Hands of Ghosts is a miraculously warm fusion of the mud and bloody horror of war with the unquenchable power of love and the bond formed at the limits of human endurance. It’s a magical and marvelous book.”—Nicola Griffith, author of Menewood“Absolutely incredible—I had chills all through reading it.”—Shannon Chakraborty, author of The City of Brass“Katherine Arden isn’t writing about World War I, she’s writing from World War I—the diction, the madness, the desperation. But the hope, too—and maybe even a devil grinning at us from the trenches.”—Stephen Graham Jones, author of The Only Good Indians“From the brutal trenches of World War I comes a vivid story of grief and love that feels not only timeless, but timely. This exquisite novel took me over like a haunting, and Arden’s eerie, exacting prose followed me long after I closed the cover. It’s one of the best historical fantasies I’ve ever read.”—Emma Törzs“A marvelous novel, visionary, imaginative, and brilliantly written.”—Anthony Horowitz, author of Magpie Murders“Arden’s haunting novel is at once immersive and timeless, an ode to the enduring power of memory.”—Vaishnavi Patel, author of Kaikeyi“A page-turner of the highest order . . . a masterpiece of historical realism seamlessly blended with the supernatural that delivers spine-tingling heroism as well as a searing study of war’s cruelties and the necessity of remembrance . . . a haunting, fantastic read!”—Helene Wecker, author of The Golem and the Jinni“Arden’s World War I setting is visceral, with real-world horrors that make warm-handed ghosts and seductive devils comforting in comparison. The touch of fantasy enhances the uncanny, shifting realities of a world in turmoil.”—Library Journal (starred review)“Through resonant prose, [Arden] literalizes the apocalyptic qualities of WWI while dwelling in moral complexity and delivering vibrant, fully fleshed-out characters. The interwoven supernatural elements lend the historical details greater weight. The result is a powerful page-turner.”—Publishers Weekly (starred review)“Set on and off the battlefields of Belgium in the final year of World War I, this novel adds a supernatural touch to its vividly realized historical details.”—Kirkus Reviews (starred review)Earn by promoting booksEarn money by sharing your favorite books through our Affiliate program.Become an affiliateBookshop.org Best Sellers of the WeekBookshop.org View All (25)'
