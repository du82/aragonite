full_description = '''Privacy Policy Privacy Policy Effective Date: July 9, 2018 This Privacy Policy describes the types of information that the American Booksellers Association and IndieBound.org (“ABA”, “we”, “our”, or “us”) collects from and about you when you visit our website, www.indiebound.org (“Site”). This Privacy Policy also explains how ABA may use and disclose such information, as well as your ability to control certain uses of it. By using the Site, you agree to the collection, use, and disclosure of your information as described in this Privacy Policy, and agree to the ABA Terms of Use which are incorporated by reference. If you do not agree, please do not access or use the Site. QUICK GUIDE TO CONTENTS WHO WE ARE INFORMATION WE COLLECT HOW WE USE YOUR INFORMATION AND OUR LAWFUL BASIS INFORMATION WE SHARE RETENTION OF YOUR INFORMATION YOUR RIGHTS AND CHOICES THIRD PARTY CONTENT AND LINKS CHILDREN’S PRIVACY DATA SECURITY INTERNATIONAL TRANSFERS REVISIONS TO THIS PRIVACY POLICY HOW TO CONTACT US 1. WHO WE ARE The American Booksellers Association is a national not-for-profit trade organization created to help independently-owned bookstores grow and succeed. IndieBound.org is an ABA website dedicated to encouraging the use of independent bookstores. For services and Websites used by residents of the European Economic Area, the American Booksellers Association is the data controller responsible for your personal data. 2. INFORMATION WE COLLECT There are several ways we may obtain information about you, including through information you provide to us directly and information we automatically collect. This includes data that identifies you personally whether directly (i.e., name) or indirectly (i.e., information about your online use). A. Information You Provide ABA collects information from you when you choose to share it with us. This may include when you visit the Site, register or create an online account with or through the Site, place an order, request information from us, sign up for newsletters or our email list, fill out a survey, request customer support, or otherwise communicate with or contact us. The information we collect may include your name, address, telephone or mobile number, and email address. You may also provide us with certain information in connection with specification transactions: Information You Provide When You Make a Purchase. If you make a purchase from us, we collect a credit/debit card number and related financial information (such as CVV, expiration date, and billing address). Information You Provide at Off-Line Events. If you provide us with any information while attending one of our events offline, we may retain this information. This may include, but is not limited to an email address, phone number, or physical address. B. Information Automatically Collected Whenever you visit or interact with the Site, we, as well as any third-party advertisers and/or service providers, may use cookies, web beacons, pixel tags, log files, or other technologies to automatically or passively collect information about your online activity. For information about our use of cookies and other similar technologies through the Site, you can read our Cookie Policy. Please note that we automatically collect the following information about you: Computer or Device. We may automatically collect your IP address or other unique identifier or information from the computer, mobile device, tablet or other device you use to access the Site, including the browser type, device type, operating system, software version, hardware model, mobile network information, proxy address of your Internet Service Provider; and the domain name from which you accessed the Site. Usage Information. We may also collect information about your use of the Site, including the date and time you visit the Site, the areas or pages of the Site that you visit, the amount of time you spend viewing or using the Site, the number of times you return to the Site, other click-stream or site usage data, emails that you open, forward or click-through to our Site, and other sites that you may visit. Third Party Service Providers. We may use third party service providers to support our Site. Some of these service providers may use technology such as cookies, web beacons, pixel tags, log files, Flash cookies, or HTML5 cookies to receive, collect, and store information. Third Party Analytic Technologies. We may use third parties’ analytics and tracking tools to better understand who is using the Site, how people are using the Site, how to improve the effectiveness of the Site and related content, and to help us or those third parties serve more targeted advertising to you across the Internet. These tools may use technology such as cookies, web beacons, pixel tags, log files, Flash cookies, HTML5 cookies, or other technologies to automatically collect and store certain information. They may also combine information they collect from your interaction with the Site with information they collect from other sources. We do not have access to, or control over, these third parties’ use of cookies or other tracking technologies. To learn more about your advertising choices relating to the collection and use of your information, please see the Your Rights and Choices section below. C. Combination of Information We may combine the information we receive from and about you, including information you provide to us and information we automatically collect through our Site, as well as information collected offline, across other computers or devices that you may use, and from third-party sources. 3. HOW WE USE YOUR INFORMATION AND OUR LAWFUL BASIS ABA may use the information we collect from and about you for a variety of business purposes; in general to provide the services, improve customer experience and engagement, and develop the Site. We are committed to protecting and maintaining the privacy of your information. Therefore we will process your data only in accordance with applicable data protection law and this Privacy Policy. We will have a lawful basis for processing your data when: We need to process your information in order to provide you with the products or service you have requested or to enter into a contract; We have a legitimate interest for processing your data – e.g., for fraud prevention; network and information systems security; data analytics; enhancing, modifying, or improving our services; identifying usage trends; determining the effectiveness of promotional campaigns; and advertising personalization of the service using data to make it easier and faster for you to place orders; You have consented to such processing; and/or We are required to do this by law (for example, where it is necessary to retain it in connection with potential litigation). We may use the information we collect from and about you for a variety of business purposes, including the following: To respond to your inquiries, fulfill orders, and contact and communicate with you when necessary; To enhance your online shopping experience, including as a way to recognize you and welcome you to the Site; To review the usage and operations of our Site, develop new products or services, and conduct analysis to enhance or improve our content, products, and services; To provide you with customized Site content, targeted offers, and advertising on the Site, via email, or across other websites, mobile applications, social media or online services; To contact you with information, newsletters and promotional materials from ABA or on behalf of our partners and affiliates; To use your data in an aggregated non-specific format for analytical and demographic purposes (this processing may involve profiling – for example to create audiences based on demographic or location-based information for marketing and customization purposes); To address problems with the Site or our business, and to protect the security or integrity of the Site and our business; To use and disclose your credit/debit card information only to process payments and prevent fraud; and For other purposes disclosed at the time you provide your information or otherwise with your consent. Additionally, if you use the Site to connect with third party services you authorize us to use information from and about you, on your behalf, to interact with these third party services based on your requests. 4. INFORMATION WE SHARE Except as provided in this Privacy Policy, we will not disclose, sell, or rent any of your information to any third parties without your consent. We may share the information we collect from and about you as described below. A. Sharing of Information by Us We may share your personal information with: Our Affiliates: We may share your information with ABA affiliates and subsidiaries bearing the ABA or IndieBound brands for business, operational, promotional and marketing purposes. Third Party Service Providers: We may share your information with third-party service providers that provide business, professional or technical support functions for us (including to the extent necessary or desirable to fulfill or ship your order or complete your transaction), help us operate our business and the Site, or administer activities on our behalf. We may share your information with third-party service providers in order to fulfill your request or otherwise complete a service provided to you. Select Third Parties: We may share your personal information with any affiliates, partners, agents or other parties whose products and services may be of interest to you. If you do not want us to share your information in this manner, please see the "Your Rights and Choices" section below. From time to time, we also may share your personal information with third parties for research and development purposes. Legal Obligations; Safety: We may access and disclose your information to respond to subpoenas, judicial processes, or government requests and investigations, or in connection with an investigation on matters related to public safety, as permitted by law, or otherwise as required by law. We may disclose your information to protect the security of our Site, servers, network systems, and databases. We also may disclose your information as necessary, if we believe that there has been a violation of our Terms of Use, any other legal document or contract related to our services, or the rights of any third party. Sale or Transfer of Business or Assets: We may sell or purchase assets during the normal course of our business. If another entity acquires us or any of our assets, information we have collected about you may be transferred to such entity. In addition, if any bankruptcy or reorganization proceeding is brought by or against us, such information may be considered an asset of ours and may be sold or transferred to third parties. Should such a sale or transfer occur, we will use reasonable efforts to try to require that the transferee use personal information provided through this Site in a manner that is consistent with this Privacy Policy. Aggregate or Anonymous Non-Personal Information: We may also share aggregate, anonymous, or de-identified non-personal information with third parties for their marketing or analytics uses. Other: We also may share your information as disclosed to you at the time of collection. B. Sharing of Information by You (Online Blogs and Forums) The Site offers many ways to find, enjoy, and share content. Your activity in connection with the Site may include filling out surveys, reviewing and rating products or services, inquiring about or purchasing products or services, participation in online communities, “liking” or “sharing” our content to your social media accounts or pages or otherwise interacting with the Site. Any information you may disclose on our Site, in blogs, on message boards, in chat rooms, or on other public areas on the Site or other third-party websites, applications, or services that this Site may link to, becomes public information. Please exercise caution when disclosing personal information in these public areas. 5. RETENTION OF YOUR INFORMATION We will keep your personal data for as long as we need it for the purpose it is being processed for. For example, we will retain your information for as long as your account is active or as needed to provide you services; and after that, we will keep the personal information for a period which enables us to handle or respond to any complaints, queries or concerns relating to your account. Your information may also be retained so that we can continue to improve your experience with us and to ensure that you receive any loyalty rewards which are due to you. We will periodically review the personal information we hold and delete it securely, or in some cases anonymize it, when there is no longer a legal, business, or consumer need for it to be retained. 6. YOUR RIGHTS AND CHOICES A. Data Subject Rights If you live in the European Economic Area (EEA), you have a number of rights when it comes to your personal data. If you wish to exercise these rights with regards to your personal data that we hold, please contact us using the details set out in the Contact Us section below. Further information and advice about your rights can be obtained from the data protection regulator in your country. These include: The right to be provided with clear, transparent and easily understandable information about how we use your information and your rights (which is why we are providing you with the information in this Policy). The right to obtain access to your information (if we are processing it). The right to have your information corrected if it is inaccurate or incomplete. You can do this through your account page or by contacting us. The right to 'block' or suppress further use of your information. When processing is restricted, we can still store your information, but may not use it further. We keep lists of people who have asked for further use of their information to be 'blocked' to make sure the restriction is respected in future. The right to request that we delete or remove your data where there is no compelling reason for us to keep using it. This is not a general right to erasure; there are exceptions. The right to request that we transfer or port elements of your data either to you or another service provider. The right to object to certain types of processing, including processing for direct marketing (i.e., if you no longer want to be contacted with potential opportunities). If you have given your consent to anything we do with your personal data, you have the right to withdraw your consent at any time. You also have the right to lodge a complaint about the way we handle or process your personal data with your national data protection regulator Pursuant to applicable data protection law, we may be entitled to refuse to act on the request. To make these requests wi'''
