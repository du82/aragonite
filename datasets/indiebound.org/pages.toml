description = "“With adorable rhymes from Julia Donaldson (author of The Gruffalo and Room on the Broom) and gorgeous illustrations by Catherine Rayner, Bert, the Bowerbird is a wonderful tale of bird-based romance and self-acceptance. Don’t settle, Bert!”        — Charlie Marks, Fountain Bookstore, Richmond, VA"
full_description = "Locate Stores:by Name|by ZIP IndieBound FAQ Affiliate Program eBooks & Audiobooks Indie Bestsellers Indie Next List Kids’ Next List Reading Groups Spotlight on Amazon Black Lives Matter Well-Read Black Girl Sign In|My Account Get Help|Security & Privacy|Terms of Use The Kids’ Next List is your next great read! This bi-monthly list features the top nominations from independent booksellers across the country, showcasing the best of the best debuts and new releases in all categories and genres for young readers. January/February 2025 Kids Indie Next List #1 Pick The Last Bookstore on Earth Lily Braun-Arnold (Delacorte Press) Buy Now “An engaging YA novel about a young woman riding out a post-apocalyptic world in the bookstore where she worked pre-Storm. A nice mix of trials and tribulations with wry humor and a sweet budding sapphic romance. I was hooked from the first chapter!” — Jean Bartz, Books on Main (WI), Friendship, WI Picture Books Bert, the Bowerbird: The Small Bird with a Big Heart By Julia Donaldson, Catherine Rayner Boxer Books Buy Now “With adorable rhymes from Julia Donaldson (author of The Gruffalo and Room on the Broom) and gorgeous illustrations by Catherine Rayner, Bert, the Bowerbird is a wonderful tale of bird-based romance and self-acceptance. Don’t settle, Bert!” — Charlie Marks, Fountain Bookstore, Richmond, VA Between You and Me By Rob Sanders, Raissa Figueroa Clarion Books Buy Now “Moving to a new place can be hard and frightening, but it can also be wondrous and fun like this uplifting picture book about new places, new friends, and new adventures.” — Stephanie Staton, CoffeeTree Books, Morehead, KY Bigfoot's Big Heart By Sarah Glenn Marsh, Ishaa Lobo Viking Books for Young Readers Buy Now “This is adorable! Bigfoot and all the cryptids around the globe find some unexpected (and very determined) allies in scouting kids worldwide. Here’s a perfect Valentine for all the introverts or shy kids or delightful weirdos!” — Tegan Tigani, Queen Anne Book Company, Seattle, WA Girls on the Rise By Amanda Gorman, Loveis Wise Viking Books for Young Readers Buy Now “Superstars Amanda Gorman and Loveis Wise have created a mantra that celebrates girls in all forms for staring down fear, speaking out against injustice, and most importantly, standing up for each other.” — Jennifer Carney, Sidetrack Bookshop, Royal Oak, MI Lily's Dream: A Fairy Friendship (Fairies Welcome) By Bea Jackson, Bea Jackson Aladdin Buy Now “Stunning! A truly beautiful book, full of messages about perseverance, friendship, and appreciating what makes each of us unique. This story will also leave readers itching to build fairy houses of their own.” — Amanda Zarni, Book Ends Winchester, Winchester, MA Soy Sauce! By Laura G. Lee Algonquin Young Readers Buy Now “Where would we be without the humble, versatile, workhorse of flavor: soy sauce? This picture book is a joyful ode to this essential element of East Asian food, and provides a fascinating look at how different cultures make soy sauce.” — Audrey Mueller, Linden Tree Children's Books, Los Altos, CA Ten-Word Tiny Tales of Love (Ten Word Tiny Tales) By Joseph Coelho, Various Candlewick Buy Now “What if you had to condense your adoration into just ten words? I absolutely love this coffee table worthy picture book with ten-word expressions of love. Stunningly illustrated by some of the best, it’s a perfect gift for anyone who makes your heart sing.” — Angie Tally, The Country Bookshop, Southern Pines, NC To See an Owl By Matthew Cordell Random House Studio Buy Now “Janie is a young birdwatcher who especially loves owls, but they’re very hard to spot. Fortunately, Janie has a lot of determination and is not giving up! An inspiring story accompanied with gorgeous illustrations, perfect for the nature-lover.” — Andrew King, Ridgecrest Books, Shoreline, WA Toto By Hyewon Yum Neal Porter Books Buy Now “I adore Toto — the book as well as the birthmark who bears the name! A lovely story that focuses on learning to embrace what makes you different. Yum’s evocative, warm illustrations and gentle prose deserve a place on your shelf.” — Janet Geddis, Avid Bookshop, Athens, GA Victor, the Wolf with Worries By Catherine Rayner Boxer Books Buy Now “An extraordinary picture book. I love how it uses wolves and their behaviors to help children explore and manage emotions. A really great story to show how to be a good friend to someone who needs help managing their feelings.” — Cori Cusker, Bright Side Bookshop, Flagstaff, AZ Middle Grade As You Wish By Nashae Jones Aladdin Buy Now “Birdie’s plans to get a boyfriend as an eighth grader go awry when a mythological West African god Anansi appears and grants a series of wishes. A sweet middle grade romance with a fun twist!” — Beth Seufer Buss, Bookmarks, Winston-Salem, NC Chickenpox By Remy Lai Henry Holt and Co. BYR Paperbacks Buy Now “This is such a fun graphic novel set in ’90s Indonesia about being a big sister and dealing with the responsibility of being the oldest. The artwork is adorable and I loved the ’90s callbacks with corded phones, Walkmans and LaserDisc movie rentals.” — Stephanie Rivera, Chapter Two...a Bookstore, Lompoc, CA Cinderella and the Beast (or, Beauty and the Glass Slipper) (The Princess Swap #1) By Kim Bussing Random House Books for Young Readers Buy Now “A fun mashup of Beauty and the Beast and Cinderella that will delight Disney fans and appeal to readers who appreciate a well-told story. Bussing brings some fun updates to these familiar stories, including a fairy godfather and a glass prosthetic.” — Amanda Grell, Pearl's Books, Fayetteville, AR A Copycat Conundrum (The Misfits) By Lisa Yee, Dan Santat Random House Books for Young Readers Buy Now “Olive and the Misfits are back for another mystery, this time involving a million-dollar scavenger hunt/adventure program, an art museum, and missing treasure. A great Agatha Christie style action-adventure mystery!” — Aerie Brown, Blue Willow Bookshop, Houston, TX Fresh Start: A Graphic Novel By Gale Galligan Graphix Buy Now “Another absolute delight from Gale Galligan! This book is sweet, expressive, and deeply vulnerable in the absolute best way. A reminder that being brave enough to make new friends and forgive your old ones (and yourself!) is always worth it.” — Leah Grover, Scrawl Books, Reston, VA Inkbound: Meticulous Jones and the Skull Tattoo By Philippa Leathley Storytide Buy Now “The start of a great new fantasy series! I can’t wait for the sequel!” — Chris Abouzeid, Belmont Books, Belmont, MA Kaya of the Ocean By Gloria L. Huang Holiday House Buy Now “An absolutely gorgeous story, shining a light on the very real struggles of growing up and feeling different. With incredibly heartfelt writing and a vivid setting, Kaya’s story can help young people that struggle with anxiety feel seen and heard.” — Jonathan Pope, Prologue Bookshop, Columbus, OH Mixed-Up By Kami Garcia, Brittney Williams First Second Buy Now “One of the best slice-of-life middle grade graphic novels I’ve read since Raina Telgemeier’s Smile. Stella’s problems felt so real as a neurodivergent person; I almost cried multiple times while reading this book. All of the text being in OpenDyslexic font was the cherry on top.” — Joey Santo Domingo, Black Garnet Books, Saint Paul, MN Same Page By Elly Swartz Delacorte Press Buy Now “A timely novel weaving together everything that comes with the middle school years and how to navigate it all. Layered with multiple situations kids face, the main conflict is focused on books being challenged at school and how this affects friendships.” — Shannon Krug, Serendipity Books, Chelsea, MI Will's Race for Home By Jewell Parker Rhodes Little, Brown Books for Young Readers Buy Now “This was so enjoyable! This book highlights a part of history you don’t see very often from a child’s perspective. I loved reading about the Land Rush and the free Black people who participated in it. Lots of action and suspense and honest emotion.” — Izzy Stringham, White River Books, Carbondale, CO Young Adult After Life By Gayle Forman Quill Tree Books Buy Now “Gayle Forman has the talent to make the unbelievable believable. In After Life, Forman asks: does forever love really mean forever? You’ll want to savor each perfectly placed word and well-crafted sentence.” — Kathleen Caldwell, A Great Good Place for Books, Oakland, CA Breath of the Dragon: Breathmarked By Fonda Lee, Shannon Lee Wednesday Books Buy Now “A martial arts thriller with magic! In a divided land, sixteen-year-old Jun’s only chance at reuniting his family and achieving his dream is to compete in a martial arts tournament. Fonda Lee and Shannon Lee conjure a rich fantasy land with scene after scene of captivating combat.” — Ben Kemper, Rediscovered Books, Boise, ID Everything Is Poison By Joy McCullough Dutton Books for Young Readers Buy Now “A captivating young adult historical novel told both in prose and in verse. Carmela has been patiently waiting for years for her mother to finally let her work in and learn the mysteries of the apothecary. She’s soon learning all she can to help the people of Rome.” — Jennifer Jones, Bookmiser, Marietta, GA Ex Marks the Spot By Gloria Chao Viking Books for Young Readers Buy Now “An international scavenger hunt and an enemies-to-lovers romance? Sign me up! Gemma receives a mysterious message from her maternal grandfather. Soon she is off on a journey to Taiwan to embrace a culture she’s never been given the chance to know.” — Nicole Miller, Barbara's Bookstore, Burr Ridge, IL Honeysuckle and Bone By Trisha Tobias Zando - Sweet July Books Buy Now “Don’t let the duppy get you! Honeysuckle and Bone transports you to the canicular heat of Jamaica as the secrets heat up with each turning page. Evocative horror that pays homage to the rich oral history that is Caribbean folklore.” — Morgan Haywood-Joy, Greenlight Bookstore, Brooklyn, NY I Am Not Jessica Chen By Ann Liang HarperCollins Buy Now “This book follows hardworking student Jenna Chen who can never quite compete with her Harvard-bound cousin Jessica. After a wish gone wrong, Jenna wakes up inhabiting Jessica’s body and must adjust to her cousin’s life and all the good (and bad) that comes with it.” — Mallory Sutton, Bards Alley, Vienna, VA I Shall Never Fall in Love By Hari Conner, Hari Conner HarperAlley Buy Now “This Austen retelling allows for a new queer look at regency England. The characters’ relationships kept me reading and urgently wanting to know what would come next. For fans of any genre, this graphic novel is adorably written and will have you reading more and more.” — Landon Krandall, Back Cove Books, Portland, ME Mystery Royale By Kaitlyn Cavalancia Disney Hyperion Buy Now “This novel reads like a complex puzzle game with a touch of romance and lots of family drama! Readers will be swept up in this magical illusionary world.” — Kristine Jelstrom-Hamill, Buttonwood Books and Toys, Cohasset, MA No Place Left to Hide By Megan Lally Sourcebooks Fire Buy Now “Buckle up! You’re in for a wild ride. No Place Left to Hide is a gripping thriller full of twists and turns, both figuratively and literally.” — Alyssa Leibow, Beach Books, Seaside, OR What the Woods Took: A Novel By Courtney Gould Wednesday Books Buy Now “Five teens are forced into a wilderness trek masqueraded as a cure to them being ‘troubled teens.’ When their guides disappear, they begin to suspect there’s something wrong in this forest. I couldn't stop reading this deliciously dark and queer story.” — Katlin Kerrison, Story on The Square, McDonough, GA More Indie Next ListsMarch 2025 Indie Next ListMarch/April 2025 Kids Indie Next ListFebruary 2025 Indie Next ListJanuary 2025 Indie Next ListWinter 2025 Reading Group Indie Next ListDecember 2024 Indie Next ListNovember 2024 Indie Next ListNovember/December 2024 Kids Indie Next ListOctober 2024 Indie Next ListFall 2024 Reading Group Indie Next ListView the full archive"
