full_description = "About IndieBound IndieBound is a “local first” shopping movement and a network of hundreds of independent bookstores sharing book recommendations and connecting readers and authors. IndieBound is an initiative of the American Booksellers Association dedicated to making the world better one independent bookstore at a time. Locally owned, independent businesses pump money back into their communities by way of taxes, payrolls, and purchases. That means more money for sound schools, green parks, strong fire departments, and smooth roads, all in your neighborhood. Independent bookstores have always occupied a special place in communities. Through IndieBound — and the Indie Next List fliers and Indie Bestseller Lists — readers find trusted, bookseller-curated reading options, newly discovered writers, and a real choice for buying. IndieBound allows indie booksellers to communicate this vital role they play in their local economies and communities. It allows authors to show their dedication to indies nationwide, easily done by linking to thousands of indie bookstores through IndieBound.org. And it allows consumers to feel that their actions are a part of a larger picture — to know that their choices make a difference and that others are working toward the same goals. Check out the Indie Next List & Indie Bestseller Lists The monthly Indie Next List, compiles recommendations from passionate and knowledgeable independent booksellers all over the country. The weekly Indie Bestseller Lists offer a snapshot of the most popular books at indie bookstores nationwide. Learn more about the importance of independent bookstores Huffpost / This Book Will Change Your Life / March 5, 2013 Writer’s Digest / Why Independent Bookstores Matter Now More Than Ever / March, 1 2018 BuzzFeed / 22 Reasons We're Thankful For Independent Bookstores / April 27, 2019 PRESS CONTACT: Ray Daniels, ray@bookweb.org #button-5qmy0jzvmeii{background:#aa1a22;color:#fff;border-color:#aa1a22;} #button-5qmy0jzvmeii:hover{background:#000;color:#fff;border-color:#000;} Earn commissions through IndieBound Become an affiliate List your bookstore on IndieBound Join ABA #button-5qmy0jzvmeii{background:#aa1a22;color:#fff;border-color:#aa1a22;} #button-5qmy0jzvmeii:hover{background:#000;color:#fff;border-color:#000;}"
