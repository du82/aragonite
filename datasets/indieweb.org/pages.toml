full_description = '''Toggle the table of contents Toggle the table of contents Homebrew Website Club PageDiscussion English ReadView sourceView history Tools Tools move to sidebar hide Actions ReadView sourceView history General What links hereRelated changesSpecial pagesPrintable versionPermanent linkPage information From IndieWeb Homebrew Website Club is a growing world-wide network of meetups for everyone who wants to take back their web experience from social media silos, and own their online identities & content, or just want support with blogging! 📝 Want to blog more and looking for: ideas, momentum, and a supportive community? 📆 Join a gathering of like-minded people and get friendly support with writing, creating, and anything related to using and improving your own website! 💬 You can also join our chat to talk with the community between meetings! Meetings Meetings take place most Wednesdays virtually across timezones and a few cities in-person. If it collides with an official holiday in your country, skip that week and resume the next week! 2025-03-05 19:00-20:30 Homebrew Website Club Europe/London 18:00-20:00 Homebrew Website Club - Pacific 2025-03-11 18:00-19:00 Homebrew Website Club Edinburgh: Writing Hour 2025-03-12 18:00-20:00 Homebrew Website Club - Nuremberg/Germany 19:00-20:30 Homebrew Website Club Europe/London 2025-03-19 19:00-20:30 Homebrew Website Club Europe/London 2025-03-25 18:00-19:00 Homebrew Website Club Edinburgh See https://events.indieweb.org for more details and dates/locations/URLs of upcoming meetings. Past meetings and notes Homebrew Website Club Events are listed on events.indieweb.org as of 2020-01 2025 01-08 🏰🎡🌎 • 01-15 🎡 • 01-22 🎡🌎 • 01-29 🎡 • 02-05 🎡🌎 • 02-12 🏰🎡 • 02-19 🎡🌎 • 2024 01-03 🎡🌎 • 01-10 🏰🎡 • 01-13 🌌 • 01-17 🎡🌎 • 01-24 🎡 • 01-31 🎡🌎 • 02-07 🎡 • 02-14 🏰🎡🌎 • 02-21 🎡 • 02-28 🎡🌎 • 03-13 🏰🎡🌎 • 03-20 🎡 • 03-27 🎡🌎 • 04-03 🎡 • 04-08 📜 • 04-10 🏰🎡🌎 • 04-17 🎡 • 04-24 🌎 • 04-27 🌌 • 05-01 🎡 • 05-08 🏰🎡🌎 • 05-09 🌐 • 05-15 🎡 • 05-22 🎡