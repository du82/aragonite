full_description = '''Toggle the table of contents Toggle the table of contents 2024-12-indieweb-gift-calendar PageDiscussion English ReadView sourceView history Tools Tools move to sidebar hide Actions ReadView sourceView history General What links hereRelated changesSpecial pagesPrintable versionPermanent linkPage information From IndieWeb (Redirected from IndieWeb Gift Calendar) 🎁 Welcome to the IndieWeb Gift Calendar! The 2024 IndieWeb Gift Calendar is the 8th annual group effort to gift (ship) one or more IndieWeb-related thing(s) each day of December that others can use to improve their IndieWeb experience. This can be anything from IndieWeb friendly services & apps (like social readers, Micropub clients), CMSs, plugins, major documentation contributions, or community libraries. Anyone can participate. See the Inspiration section below for ideas. See previous years for examples: 2023, 2022, 2021, 2020, 2019, 2018, 2017 Please keep Considerations in mind, and if you’re not sure, make a commitment for yourself to ship something you’ll use yourself, which may reveal ways to improve things for the community. Once you've finished something, write a short blog post and link to it in the calendar below! .mwMonthCalendar table { border-collapse: collapse; } .cal-week, .cal-cell { border: 1px #DFDFDF solid; padding: 2px; } .cal-week { text-align: center; font-weight: bold; background-color: #EFEFEF; } .cal-cell { vertical-align: top; height: 90px; width: 14%; } .cal-day { text-align: right; font-weight: bold; background-color: #EFEFEF; color: #333333; } .cal-weekend { background-color: #f5f5f5; } .cal-weekend .cal-day { background-color: #e1e1e1; } .cal-today { background-color: #FFFFDF; } December 2024MondayTuesdayWednesdayThursdayFridaySaturdaySunday 1🤝 Blog editing offer Tracy Durnell ✳️ Mastodon backfeed in micro.blog Manton Reece 📜 IndieWeb Carnival Dec. Zinzy Waleson2📜 Why, what, how to post Tantek Çelik3📅 Web Writer's Workshop capjamesg4✳️ Libre.fm end of year recaps Dr. Matt Lee 🗓 WWW notes capjamesg 📅 HWC EU/LDN capjamesg & Mark Sutherland 🗓 HWC EU/LDN notes capjamesg 📅 HWC Austin Manton Reece5📅 Front End Study Hall (FrESH) #016 Joe Crawford6🗓 FrESH notes Joe Crawford 📫 This Week in the IndieWeb7📅 IndieWebCamp San Diego 🗓🗓🗓🗓🗓🗓🗓🗓 IWC SD notes: intro-demos session-sched syndication venue-recs site-building-tools exercise-geodata indieweb-tooling million-pixel gRegor Morrill8📅 IndieWebCamp San Diego9📄 recommendations Tantek Çelik10📅 HWC Edinburgh Fran + capjamesg 📄 Haunt Dr. Matt Lee11❇️ Artemis capjamesg 📅 HWC Nuremberg Björn Stierand & Sebastian 📅 HWC EU/LDN Mark Sutherland 📅 HWC Pacific David Shanske 🗓 HWC NUR notes Björn Stierand12🗓 HWC EU/LDN notes capjamesg13📫 This Week in the IndieWeb14📼📼📼 IWC Brighton recordings: hosting, NFC, pain points David Shanske📼📼📼📼📼📼 IWC Berlin recordings: queerer stranger, non-technical collaboration, text authoring, timeline algos, locations places, online presence after death David Shanske15📅 IndieWeb SF Brunch Pablo Morales Tantek Çelik 📄 Google Search Console Mike Kupietz 🗓 HWC Pacific notes capjamesg16📜 The joy of writing online @dominikhofer.me17📅 Front End Study Hall (FrESH) #017 Joe Crawford18📅 HWC EU/LDN Mark Sutherland 🗓 FrESH notes Joe Crawford19📄 venue category Tantek Çelik20📫 This Week in the IndieWeb 🛠 Scripts to Analyze CSS from Firefox’s Javascript console Mike Kupietz 📄 Artemis capjamesg 🗓 HWC EU/LDN notes gRegor Morrill21🛠 Web Feed Recovery script capjamesg22🛠 :root CSS Custom Properties Bookmarklet📄 Yet Another Webmention Explainer Joe Crawford23🛠 lab.artlung.com updated web dev tools; Webmention support on each! 2024-12-23 post Joe Crawford24💬 chat bridge support to reset a Slack handle Aaron Parecki25📅 HWC Pacific Special Holiday Edition David Shanske26💬 how to moderate technical or silo rants in chat Tantek Çelik27🗓 HWC Pacific notes gRegor Morrill 📫 This Week in the IndieWeb28🧩 IndieWeb for Elgg v2.1.0 (🦣) 👤 Nikolai Shcherbin29📄 2025-01-01-commitments Tantek Çelik30📄 Open Graph Protocol Tools Dr. Matt Lee 📄 2024-review 📄 2025/Berlin Tantek Çelik31📄 2025/Edinburgh capjamesg 📄 California Tantek Çelik Considerations Gifts can be anything from major wiki documentation contributions / improvements to shipping updates on any of the IndieWeb applications (like social readers), services, CMSs, plugins, community libraries, or any other projects in use by multiple folks. Please keep in mind the following considerations when adding something to a day: Please keep the description to three lines or less. If you need help or ideas to copyedit your description down to fit, see other entries, or ask in chat for help copyediting. It must be shipping / usable, not just a blog post announcing / saying you plan to do it. Is it clear what your thing does? Is it clear how someone is supposed to use it or otherwise benefit from it? What use-case does it solve for others (besides yourself)? Ask yourself, how would/could someone else in the community use the thing I'm posting? If it's a markup / styling example, is it clear what its purpose is, and how someone could/should copy the markup/styling and customize it for their own site? If it's a programming example, is it clear how an indieweb site could use the code, using what language(s)? Does it require any frameworks? If it's a code example or project, is it clearly open sourced, with a clear link to its GitHub or other code repo that has at least a README explaining how it can be used for either direct user benefit or to enhance existing indieweb sites? Emoji gift kinds We use emoji to indicate different kinds of IndieWeb related gifts since the 2022 gift calendar! E.g., always requiring IndieWeb related as part of the description, here are the emoji gift kinds we have used so far: 🎁 gift planned — wait for the day for it to be unwrapped! Have something you’re making for the community for a particular day? We have used the 🎁 emoji since 2023 for planned gifts! Put 🎁 on the day of your planned gift, and wrap it in <span> giftwrap like this so others know who it’s from. <span title="from: yourname">🎁</span> ❇️ new user service (none yet in 2024!) ✳️ updated or friendly user service (or improved building blocks support) 🖍 graphics posting/creating user client (presumably with Micropub support) 🤝 offer to help with another’s site, e.g. edit a blog post, code-review site code 🧩 user-installable plugin or add-on e.g. WordPress/Drupal plugin, browser add-on/extension 🛠 tools, libraries, web components, command line utilities etc. for developers 📃 for external documentation updates for any of the above (e.g. improved tools or services docs) 📅 event, e.g. IndieWebCamp, Pop-up, Homebrew Website Club, Front End Study Hall 🎧 podcast, e.g. TWITIWAE 📄 new non-trivial wiki page, or non-trivial expansion thereof (like a major subsection, perhaps a screenful, or helpful for discovering one or more existing indieweb resources or tools), that is immediately useful for others in the community 🗓 new event notes or session notes wiki page 📑 new category wiki page 📼 video recording uploaded, e.g. an IndieWebCamp session 📫 newsletter published, e.g. This Week In The IndieWeb 💬 chat related improvements (bots, chat bridges, moderation, archives, chat web UI) 📜 blog post about the IndieWeb — only use this if the blog itself is the gift, i.e. if it’s a blog post about one of the above, use the icon related to the thing itself, not the blog post about the thing. Roughly sorted by more directly personal website related first, then user-centric before developer-centric, then IndieWeb community (events, meta) related gifts with apparently hardest first More ideas (inspired by kinds of gifts from 2021) 📝 writing client (presumably with Micropub support) ... More sources of ideas: See posts#Types_of_Posts Got a gift that does not fit any of the above? Add your gift to the day, then ask in the indieweb-meta channel for suggestsions on which emoji to use! Inspiration Looking for something to do to benefit the community? In general (feel free to add things here that you find inspiring in general, or hope someone else is inspired to do :) Updates to / new versions of things shipped in last year’s calendar or prior gift calendars. to-do and look for something you can do in a day! IndieWebify issues to fix, fix one, and get an update deployed New release of microformats2 parser(s) php-mf2 mf2py ... Work on 2024-review and previous years that weren't completed Organize and host an IndieWeb event ... Specific inspirations: "how to save or republish your Foursquare lists" could be a post for the IndieWeb Gift Calendar, since the app is being shutdown 2024-12-15, and the Foursquare domain in early 2025 We haven't had an updated "people grid" in a while (latest 2016?). If someone would like to go through more recent IWCs and other IndieWeb events, a new one could be created from photos or current avatars on their personal sites ... In progress Got something you're working on for the IndieWeb Gift Calendar but it's not quite complete or ready for community re-use? Feel free to link to it here while you're working on it, especially if you'd like others to review it, provide feedback etc. Brainstorming Past Gift Calendars 2017-12-indieweb-challenge 2018-12-indieweb-challenge 2019-12-indieweb-gift-calendar 2020-12-indieweb-gift-calendar 2021-12-indieweb-gift-calendar 2022-12-indieweb-gift-calendar 2023-12-indieweb-gift-calendar 2024-12-indieweb-gift-calendar See Also challenge Latest: IndieWeb Gift Calendar Retrieved from "https://indieweb.org/wiki/index.php?title=2024-12-indieweb-gift-calendar&oldid=99389" Category: IndieWeb Gift Calendar'''
