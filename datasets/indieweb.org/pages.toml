title = "Getting Started - IndieWeb"
full_description = "Toggle the table of contents Toggle the table of contents Getting Started PageDiscussion English ReadView sourceView history Tools Tools move to sidebar hide Actions ReadView sourceView history General What links hereRelated changesSpecial pagesPrintable versionPermanent linkPage information From IndieWeb 🎉 Get started on the indieweb by connecting with the IndieWeb community, getting a personal domain, a place for your content, and setting up your home page and other IndieWeb essentials. Do the reasons why resonate with you, but you are not sure how to get on the IndieWeb? You have found the right page! With each step below, you will gain understanding and more ownership of your online identity & content, steadily making progress with your personal web presence. Videos and Articles Watch a video or read an article, suitable for all levels: 📺 ▶️ Why We Need the #IndieWeb at PDF 2014 (13:15. longer: ▶️ The Once and Future IndieWeb 41:49) ▶️ Taking Back The Web / Building Blocks of the Indie Web at Webstock ‘18 (27:26. slides) ▶️ This Week in Google, Episode 266: The Indie Web 2014-09-10 (44:22) 📰 📃 An Introduction to the IndieWeb ( Chris Aldrich 2017-07-28) 📃 Welcome to the Indie Web Movement ( Dan Gillmor/Slate 2014-04-25) Would you like to know more? See additional videos and posts about the IndieWeb. Join The Community Want to chat with people on the indieweb before jumping in? 👥 Join our chat room - connect with other members of the IndieWeb community who are happy to share their experiences and answer questions: 💬 Online #indieweb chat (using your browser) 💬 Slack #indieweb community - open sign-up Quickly get questions answered and accelerate your progress in all things IndieWeb. Got something you’re proud of on your personal site? Join a Homebrew Website Club meetup near you to meet IndieWeb community members in person, ask questions, demo cool stuff on your site, and share your experiences & motivations for getting on the IndieWeb. You may also request consultant services if you like. 📅 Next Homebrew Website Club meetup Or want to jump right in and deep dive over a weekend with IndieWeb makers? 🎪 Next IndieWebCamp weekend! Feel free to skip ahead and come back to community and help only when you need it. Get your own site This is the key to being on and a part of the IndieWeb: Your own domain Your own site That’s it. Everything else is optional awesomeness, you choose. Here are three paths to setup your site: Want a convenient place to publish your thoughts? Pick an IndieWeb Service Comfortable with CMS setup, themes, plugins? Setup an IndieWeb CMS Are you a Web Developer (full stack or otherwise) and live in command lines & code? Steps for IndieWeb self-starters Each of those has several options to pick from depending on what you’re looking for: IndieWeb Services The easiest way to get on the IndieWeb is with a service that supports the IndieWeb. Want to setup a Content Management Service (CMS) instead? See the next section Micro.blog Micro.blog launched with IndieWeb support from day 1 and can be set up very quickly! Tutorial: Setting up micro.blog Blogger Blogger is one of the oldest hosted blogging services and can be setup to do a lot of IndieWeb features. It requires more work than Micro.blog, but if you are already on Blogger, take a look! Tutorial: Set up an Indie Website using Blogger Others There are many more options (domain, software, hosting, etc.) for setting up your Indie Website. Read-on for more choices for each step! There are numerous additional (mostly open source) IndieWeb CMSs in addition to Known and WordPress: E.g. Craft, Kirby, Perch, ProcessWire, TYPO3 Comparison Table: Table of IndieWeb CMSs IndieWeb self-starters Get a personal domain Main article: personal-domain 🌐 You need your own personal domain to use as your primary online identity: Get your own personal domain name - Ask a friend or colleague for a recommended domain name registrar (e.g. that they use and like/trust/respect) Domain Privacy - Most domain name registrars will make your personal information publicly available (name, mailing address, phone number, email address). Many registrars offer domain privacy options, so that instead of your personal details the registrar's details will be in the whois directory. Only use domain privacy if you fully trust the provider of the service -- disputes about domain name administration or transfers may get tricky if you are not listed as the legal owner of the domain. Why? See why. This is the key first step to joining the indieweb, owning a domain name you can use as your primary online identity. Get a place for your content 📝 Next, you need a place for your content. Here are three options to choose from depending on your preferences. GitHub Pages & GitLab Pages GitHub Pages and GitLab Pages are free and have a web interface for creating & editing. For quick hosting you can use github-pages or gitlab-pages as a first step to get online. No installation needed. GitHub: follow the blank-gh-site instructions to clone it and set it up in your account, or come to a Homebrew Website Club meetup and ask for help. You can be setup to publish in minutes. GitLab: follow the indieweb-template instructions to clone it and set it up in your account. There are other free but more limited options described in Transitional Steps. Web Hosting Web hosting costs a little but provides much more capabilities. Sign up with a web hosting provider (ask friends and colleagues who they use for their personal websites that they're happy with, also see Lifehacker's list of 5 best web hosting companies) Set up your domain name to be served by your web hosting provider Home Server Using your own server at home costs more and takes more time to set up — for developers only. You can also self-host on your own server. Interesting to hobbyists are the many Small Computers available that can be used as servers, including Raspberry Pi, Beaglebone Black, Intel Galileo, and a host of other small, low-power computers. Set up your site As a community with diverse interests, desires, and levels of technical know-how, there are multiple approaches to setting up a site on the Indieweb. Simple One Page 📄 All you really need to get started is a simple one page site, which you can setup using the blank-gh-site project. CMS Guides 📑 If you already know or have a preference for a content management system, see these specific guides for setting them up on your domain. Getting Started on WordPress Getting Started with Known These two are highly recommended and have dedicated help and support forums, see the projects page for more options. If your web hosting provider has a control panel like DirectAdmin, cPanel or Fantastico, it may allow have an option to quickly set up a content management system in a few clicks. Set up your home page Main article: How to set up web sign-in on your own domain 🏡 Create and upload a simple index.html home page with your name, icon, and rel-me links to your social network profiles. Make sure that the profiles link back to your domain. The website https://indiewebify.me/validate-rel-me/ has a handy tool to validate that your domain name and profiles are linked together correctly. Why? This ensures that it is easy to see that your profile on the social networks are all the same person as your domain name. This will also allow you to sign in to sites that support IndieAuth — like this wiki! Tools 🔧 Indiewebify.me provides step-by-step guidance and tools to test & validate your progress. See Tools for more useful things for building & debugging an IndieWeb site. Add info about yourself 👤 Update your index.html home page to include your basic information in an h-card. This h-card can be as simple as your name. The website https://indiewebify.me/validate-h-card/ has a handy tool to validate your h-card. Why? When you publish content, you can link back to your home page using rel-author and your authorship information can be retrieved from the h-card. Advantages: While you are not yet publishing content on your own site, at this point you have: Staked your claim on the indieweb Set up an identity that you own and control Why add my basic contact information in an h-card? This helps with providing authorship information for anything you publish and link back to your home page with rel-author. These are small but important steps to declaring your independence from content silos. Add links to existing social media ✴️ Why add links to your social media profiles? By linking from your personal site to your existing social media, and having your social media profiles link to your personal site, it sets you up to use your domain as your IndieAuth identity — to sign into this wiki for example. For more details, see: setup web sign-in. Advantages: while you are not sharing your content on your own site yet, you've staked your claim on the indie web, and setup an identity that you own and control. Publish content on your domain 📰 Using whatever project or CMS you have installed on your server, post something! Add microformats to your content 📑 Add the h-entry microformat markup to your posts. Many CMSs and themes already support them! You can use the h-entry validator to verify that your recent post has validate your h-entry. Why? This will allow other people's software to easily read and understand your content. This is useful for a variety of things like recognizing comments, likes, reposts, and displaying reply-contexts for your posts. Syndicate Elsewhere Main article: POSSE 📤 Set up automatic syndication of your posts so copies of your IndieWeb content can be published (semi-automatically) to your existing social media so your followers there will see your IndieWeb content . This practice is called POSSE, short for Publish on your Own Site, Syndicate Elsewhere. By setting up POSSE, you can have your posts pushed to specific social media silos with a personal permalink back to the original on your own site. Why? By POSSEing your content to silos, you allow those that read content on those silos to continue seeing what you have to say, while you retain ownership and control of your content on your own site. Remember: Incremental progress is OK and encouraged! POSSE does not have to be totally automatic to be effective. Use a CMS with POSSE support (or POSSE plugin for it), or post on your site and manually sharing to social media (including a link back to the original). This will help you figure out what works for you and what is worth the effort to automate. Share and Join Us Next steps: Share what you did / discovered in the process of building your IndieWeb site, even if it is only a single page, with a simple design. Ask what you can/should do next in the discussion channels. Check the list of events and join us at the next IndieWebCamp or Homebrew Website Club meetup! Once you can IndieAuth or log into the wiki, create your user page by wikifying yourself. Document what you've done and add your site and details to the IndieWeb examples section of relevant pages to share what and how you've done it with others. Optional Bonus Steps Port old silo content to your site Main article: export#Silos Once you are posting on your own site and POSSE'ing out content to social silos, port your old silo content to your own site with permalinks on your site. Typically this involves a one-time export and batch import process. Here are some popular social content silos: Twitter Tumblr Facebook ... See the full list of social media export links at: How to export: Silos Also consider sites you use which may be shutting down soon, see: site-deaths#Upcoming Set up a personal URL shortener Main article: permashortlinks Why? A personal short domain will let you create permashortlinks which help: Provide shorter URLs you can use on slides or in hand written notes Provide discoverable permashortcitations in POSSEd notes, e.g. on Twitter, which itself enables original-post-discovery. POSSEing to silos that have post length limits, but don't wrap your links, e.g. Foursquare notes (along with checkin posts) ... How? For WordPress, install and use the Hum personal shortener plugin. For others, take a look at porting the existing open source Whistle algorithmic URL shortener to your system. Historical The following CMS Tutorials are many years out of date, though may still have some aspects that work. They need to be either updated, or archived to another page and removed from this one. IndieWeb CMS and Hosting We have step-by-step tutorials that will get you all the way from an idea for a domain name to a full-fledged Indie Website with a few CMSs. Known or WordPress are the easiest. See the CMS page for more options. Want to write your own CMS or use another project? See the IndieWeb self-starters section. CMS Tutorials ⚠️ these CMS tutorials are many years out of date If you want to get started with Known or WordPress and a web hosting service, there are step-by-step Tutorials which will get you all the way from an idea for a domain name to a full-fledged Indie Website, currently on Amazon Web Services and Reclaim Hosting. table.choices { border-collapse: collapse; margin: 25px 0 } table.choices td, table.choices th { padding: 5px; border: 1px solid #808080; } table.choices th:first-child { text-align: left } table.choices div { float: left; margin-right: 10px } Using Known Using Wordpress On Amazon Web Services Tutorial: Set up an Indie Website using Known on Amazon Web Services Tutorial: Set up an Indie Website using WordPress on Amazon Web Services On Reclaim Hosting Tutorial: Set up an Indie Website using Known on Reclaim Hosting Tutorial: Set up an Indie Website using WordPress on Reclaim Hosting (to be written) In general Tutorial: Get Started with Known Tutorial: Get Started on WordPress Do you have tutorials for Known or WordPress for other hosting services? Please feel free to add them or join the IndieWeb chat channels and bring them up! See also: Tutorial: Sign up for an Amazon Web Services account Tutorial: Find and purchase a great domain name for your site Tutorial: Set up DNS so your new domain name points to your website Previous Services Based on the experience of even fairly technical newcomers, it is too difficult and expensive and fragile to setup WordPress.com to work properly with IndieWeb features (even as simple as posting an RSVP to an event), so this is no longer recommended. WordPress.com WordPress.com is the hosted WordPress service. It too can be setup with some IndieWeb features, but also takes more work, and for some features may require a higher level of paid service. Tutorial: Set Up an IndieWeb site on WordPress.com See Also IETF Getting Started - as another example, and perhaps source of inspiration for how to keep incrementally improving this page https://fillmem.com/post/fast-secured-and-free-static-site/ https://webdesign.tutsplus.com/articles/chinese-icp-licensing-what-why-and-how-to-get-ho"
