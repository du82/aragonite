title = "Main Page-ru - IndieWeb"
description = "Индивеб это сфокусированная на людях альтернатива «корпоративному вебу»."
full_description = '''Main Page-ru PageDiscussion English ReadView sourceView history Tools Tools move to sidebar hide Actions ReadView sourceView history General What links hereRelated changesSpecial pagesPrintable versionPermanent linkPage information From IndieWeb Что такое Индивеб? Индивеб это сфокусированная на людях альтернатива «корпоративному вебу». Индивеб это сообщество личных сайтов, связаных простыми стандартами, основанное на принципах владения своим доменом, использования этого домена как главной айдентити в сети, публикации на своём сайте (с опциональным копированием повсюду), и владения своими данными. Твой контент принадлежит тебе Когда ты постишь что-то в интернете, оно должно принадлежать тебе, а не корпорациям. Слишком много компаний перестали существовать и потеряли данные пользователей. Когда ты подключаешься к Индивебу, то твой контент остается твоим, и под твоим контролем. У тебя больше связей Твои статьи и статусы могут публиковаться во всех сервисах, а не только в одном, и это позволяет общаться со всеми. Даже ответы и лайки из других сервисов могут возвращаться на твой сайт и быть все в одном месте. Всё под твоим контролем Ты можешь постить что тебе угодно, в том формате, который захочешь, без чьего-либо надзора. К тому же, можно использовать короткие читабельные ссылки навроде example.com/ideas. Такие ссылки вечны, и всегда будут работать. 🌱 Подключайся к Индивебу Начать прямо сейчас! или узнать побольше: Почему Индивеб? Читать This Week in the IndieWeb: еженедельные новости, или смотреть все недавние изменения в вики Присоединяйся к чату про индивеб (журнал чата), пользуйся проектами, которые мы создаём, и участвуй в их разработке! 🗽 Идём дальше блогинга и децентрализации Движение Индивеба отличается от предыдущих попыток/сообществ: Принципы важнее фокуса на проектах. Другие предполагают монокультуру одного проекта на всех. Мы разрабатываем множество проектов. У сообщества Индивеба есть code-of-conduct. Селфдогфудинг вместо почты. Покажи, прежде чем рассказать. Начни с того, что важно именно тебе, создавая, развивая свой сайт. Дизайн в первую очередь, протоколы и форматы во вторую. Фокус на хорошем UX и селфдогфудинге чтобы создать минимально возможные форматы и протоколы. И, возможно, самое важное — мы фокусируемся на людях, не проектах, и регулярно проводим встречи, куда может прийти любой. Смотрите также Индивеб Редактировать домашнюю страницу .skin-vector-2022 #mw-content-text { max-width: none; } .vector-feature-zebra-design-disabled #mw-content-text { margin-top: 3px; } .vector-body-before-content, .vector-page-toolbar { display: none; } .iwc-homepage__container { background-color: var(--background-color); padding: 1rem 1.5rem; margin: 0 0 1rem 0; } .iwc-homepage__container--introduction .mw-headline { color: #54595d; font-size: 1rem; } .iwc-homepage__container--introduction p { font-size: 1.1875rem; } .iwc-homepage__content { font-size: 1rem; margin: 0 auto; max-width: 50rem; } .iwc-homepage__content p, .iwc-homepage__content li { max-width: 75ch; } .iwc-homepage__content h2 { border: 0; } .iwc-homepage__content figure + h3 { margin-top: 1rem; } .iwc-homepage__content dfn { font-style: normal; } .iwc-homepage__content img { height: auto; max-width: 100%; } figure[typeof~='mw:File'].iwc-homepage__icon, figure[typeof~='mw:File/Frameless'].iwc-homepage__icon { margin: 1.25rem; margin-left: -0.25rem; } .iwc-homepage__content h2:first-of-type, .iwc-homepage__content h3:first-of-type, figure[typeof~='mw:File'].iwc-homepage__icon:first-of-type { margin-top: 0; } Retrieved from "https://indieweb.org/wiki/index.php?title=Main_Page-ru&oldid=93287" Category: Pages in Russian'''
