full_description = '''Main Page-tr PageDiscussion English ReadView sourceView history Tools Tools move to sidebar hide Actions ReadView sourceView history General What links hereRelated changesSpecial pagesPrintable versionPermanent linkPage information From IndieWeb IndieWeb Nedir? IndieWeb, "kurumsal web"'e karşı insan odaklı bir alternatiftir. İçeriğiniz size ait Web'de bir şey paylaştığınızda, bu size ait olmalı, bir şirkete değil. IndieWeb'e katılarak, içeriklerinizin kontrolünü elinize alın. Bağlıyken daha güçlüsünüz İçerikleriniz ve kısa mesajlarınız tüm servislere erişebilir, sadece birine değil tüm ağlardaki insanlara erişmenizi sağlar. Yorum ve beğenileriniz bile diğer servisler tarafından sizin sitenize yönlendirilir Böylece hepsi tek bir yerde, size ait olan yerde yer alır. Kontrol sizde İstediğiniz her şeyi paylaşabilirsiniz, iistediğiniz her formatta paylaşabilirsiniz, ve kimse sizi gözetleyemez. Ek olarak, example.com/ideas gibi basit ve okunabilir linkler paylaşabilirsiniz . Bu linkler permaliktir ve her zaman çalışır. 🌱 IndieWeb'e katıl Hadi başlayalım! ya da daha fazla öğrenmek için: Neden IndieWeb? Bu hafta IndieWeb'de size haftalık güncellemeleri sunar, ya da tüm değişikliklere göz atın. #indieweb chat'e katıl (chat loga eriş) ya da üzerinde çalıştığımız projelerimize yardım et 🗽 Bloglama ve Merkeziyetin Ötesinde IndieWeb'in çabası ondan öncekilerin çabalarından farklıdır: Prensiplerimiz, proje merkezlilikten önce gelir. Diğerleri tek kültürlülüğün herkes için iyi olduğuna inanmaya devam etse de, biz projelerde çoğulcuğulu geliştiriyoruz. IndieWeb halkı bir davranış koduna sahiptir. Email yerine Selfdogfood. Söylemeden önce göster. Kendi istek ve ihtiyaçlarına göre önceliklendir, kendi sitenin geliştirerek ilerle. Tasarım birinci sırada, protokoller and formatlar ikinci. İlk olarak iyi bir UX (User Experience) and selfdogfood prototipleri geliştir. Minimum ihtiyaçlarını sağladıktan sonra formatlar and protokollere göz at. Belki de en önemlisi, biz proje odaklı değil insan odaklıyız, ve hepinizin katılabileceği sürekli toplantılar yapıyoruz. Viki Kaynakları Son değişiklikler Dosya yükle Ana sayfayı düzenle .skin-vector-2022 #mw-content-text { max-width: none; } .vector-feature-zebra-design-disabled #mw-content-text { margin-top: 3px; } .vector-body-before-content, .vector-page-toolbar { display: none; } .iwc-homepage__container { background-color: var(--background-color); padding: 1rem 1.5rem; margin: 0 0 1rem 0; } .iwc-homepage__container--introduction .mw-headline { color: #54595d; font-size: 1rem; } .iwc-homepage__container--introduction p { font-size: 1.1875rem; } .iwc-homepage__content { font-size: 1rem; margin: 0 auto; max-width: 50rem; } .iwc-homepage__content p, .iwc-homepage__content li { max-width: 75ch; } .iwc-homepage__content h2 { border: 0; } .iwc-homepage__content figure + h3 { margin-top: 1rem; } .iwc-homepage__content dfn { font-style: normal; } .iwc-homepage__content img { height: auto; max-width: 100%; } figure[typeof~='mw:File'].iwc-homepage__icon, figure[typeof~='mw:File/Frameless'].iwc-homepage__icon { margin: 1.25rem; margin-left: -0.25rem; } .iwc-homepage__content h2:first-of-type, .iwc-homepage__content h3:first-of-type, figure[typeof~='mw:File'].iwc-homepage__icon:first-of-type { margin-top: 0; } Retrieved from "https://indieweb.org/wiki/index.php?title=Main_Page-tr&oldid=93292"'''
