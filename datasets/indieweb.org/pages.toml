title = "IndieWeb"
description = "IndieWebCamp is a two day gathering of web creators collaboratively advancing the independent web. One day of breakout sessions, and one day of hacking, creating, & improving our personal sites to empower ourselves and inspire each other."
full_description = '''Main Page Main PageDiscussion English ReadView sourceView history Tools Tools move to sidebar hide Actions ReadView sourceView history General What links hereRelated changesSpecial pagesPrintable versionPermanent linkPage information From IndieWeb What is the IndieWeb? The IndieWeb is a people-focused alternative to the “corporate web”. We are a community of independent and personal websites based on the principles of: owning your domain and using it as your primary online identity, publishing on your own site first (optionally elsewhere), and owning your content. Your content is yours When you post something on the web, it should belong to you, not a corporation. Too many companies have gone out of business and lost all of their users’ data. By joining the IndieWeb, your content stays yours and in your control. You are better connected Your articles and status messages can be distributed to any platform, not just one, allowing you to engage with everyone. Replies and likes on other services can come back to your site so they’re all in one place. You are in control You can post anything you want, in any format you want, with no one monitoring you. In addition, you share simple readable links such as example.com/ideas. These links are permanent and will always work. 🌱 Join the IndieWeb Get Started Now! Or learn more: Why IndieWeb? Join #indieweb chat (real-time log!) to share your website, get inspiration or ask about services and projects to setup your IndieWeb site! Read This Week in the IndieWeb for weekly highlights 📝 Blog With Us Monthly We have a number of monthly collaborative blog carnivals that you can join by posting on your own site! Each month features a different topic, theme, or movie to blog: IndieWeb Carnival IndieWeb Movie Club 🗽 Beyond Blogging and Decentralization The IndieWeb effort is different from previous efforts/communities: Principles over project-centrism. Others assume a monoculture of one project for all. We are developing a plurality of approaches and projects. The IndieWeb community has a code-of-conduct. Publish on your site. Show before tell. Prioritize by making what you need, creating, iterating on your site. Design first, protocols and formats second. Focus on creating a good user experience and using your own prototype features to focus on minimum necessary formats and protocols. Simpler building blocks. When necessary, we adopt, improve, and create open standards for good design, user experience, and ease of implementation. Perhaps most importantly, we are people-focused instead of project-focused. We have regular meetups. All are welcome. You don't need to have a website to join, but you should be interested in personal websites! 🎡 Homebrew Website Club Homebrew Website Club 2018-11-14 SF Homebrew Website Club is a regular meetup of creatives passionate about improving their own websites, sharing successes and challenges with a like-minded and supportive community. Upcoming meetups 2025-03-05 19:00-20:30 Homebrew Website Club Europe/London 18:00-20:00 Homebrew Website Club - Pacific 2025-03-11 18:00-19:00 Homebrew Website Club Edinburgh: Writing Hour 2025-03-12 18:00-20:00 Homebrew Website Club - Nuremberg/Germany 19:00-20:30 Homebrew Website Club Europe/London 2025-03-19 19:00-20:30 Homebrew Website Club Europe/London 2025-03-25 18:00-19:00 Homebrew Website Club Edinburgh 🎪 IndieWebCamp IndieWeb Summit 2019 IndieWebCamp is a two day gathering of web creators collaboratively advancing the independent web. One day of breakout sessions, and one day of hacking, creating, & improving our personal sites to empower ourselves and inspire each other. Upcoming IndieWebCamps 2024-11-09…10 IndieWebCamp Berlin ... See more and help organize, suggest dates, locations, and volunteer: Future IndieWebCamps Contribute to IndieWebCamp Planning! ⛺️ IndieWeb Pop-Ups Pop-Ups are online events about a specific topic, similar to an extended discussion session at an in-person IndieWebCamp. Upcoming Pop-Ups 2025-03-11 18:00-19:30 Front End Study Hall #023 More Pop-Ups are being planned. Jump on in and help facilitate, suggest dates or propose a topic. Translations You may read and edit IndieWebCamp articles in other languages: Català (Catalan) Deutsch (German) Español (Spanish) Français (French) Italiano (Italian) 日本語 (Japanese) 한국어 (Korean) Norsk bokmål (Norwegian Bokmål) Portuguese (Brazil) Русский (Russian) Türkçe (Turkish) 中文 (Chinese) See also other-languages, and how-to-start-a-new-translation. More Information Read posts about the IndieWeb Watch videos about the IndieWeb Follow news about the IndieWeb Subscribe to the This Week in the IndieWeb newsletter Participate in upcoming IndieWeb events Join #indieweb chat and discuss all things IndieWeb Wiki Resources Recent changes Upload file Edit home page Login .skin-vector-2022 #mw-content-text { max-width: none; } .vector-feature-zebra-design-disabled #mw-content-text { margin-top: 3px; } .vector-body-before-content, .vector-page-toolbar { display: none; } .iwc-homepage__container { background-color: var(--background-color); padding: 1rem 1.5rem; margin: 0 0 1rem 0; } .iwc-homepage__container--introduction .mw-headline { color: #54595d; font-size: 1rem; } .iwc-homepage__container--introduction p { font-size: 1.1875rem; } .iwc-homepage__content { font-size: 1rem; margin: 0 auto; max-width: 50rem; } .iwc-homepage__content p, .iwc-homepage__content li { max-width: 75ch; } .iwc-homepage__content h2 { border: 0; } .iwc-homepage__content figure + h3 { margin-top: 1rem; } .iwc-homepage__content dfn { font-style: normal; } .iwc-homepage__content img { height: auto; max-width: 100%; } figure[typeof~='mw:File'].iwc-homepage__icon, figure[typeof~='mw:File/Frameless'].iwc-homepage__icon { margin: 1.25rem; margin-left: -0.25rem; } .iwc-homepage__content h2:first-of-type, .iwc-homepage__content h3:first-of-type, figure[typeof~='mw:File'].iwc-homepage__icon:first-of-type { margin-top: 0; } Retrieved from "https://indieweb.org/wiki/index.php?title=Main_Page&oldid=100019"'''
