full_description = '''Main Page-ca PageDiscussion English ReadView sourceView history Tools Tools move to sidebar hide Actions ReadView sourceView history General What links hereRelated changesSpecial pagesPrintable versionPermanent linkPage information From IndieWeb Què es la IndieWeb? La IndieWeb és una alternativa centrada en la gent a la ‘web corporativa’. El teu contingut és teu Quan publiques alguna cosa a la web, t'hauria de pertànyer a tu, no a una empresa. Massa companyies han tancat i perdut totes les dades dels seus usuaris. Unint-te a la IndieWeb, el teu contingut continua sent teu i estant sota el teu control. Estàs millor connectat Els teus articles i missatges d'estat es poden transmetre a tots els serveis, no només a un de sol, i permetre així que et relacionis amb tothom. Fins i tot les respostes i els "M'agrada" en altres serveis poden tornar al teu lloc web: d'aquesta manera són tots en un únic indret. Tu tens el control Pots publicar el que vulguis, en el format que vulguis, sense que ningu no et monitoritzi. Addicionalment, comparteixes enllaços llegibles simples com exemple.com/idees. Aquests enllaços són permanents i sempre funcionaran. 🌱 Uneix-te a l'IndieWeb Interessat/da? Get Started Now! Visualitza les discussions actuals i els canvis recents d'aquest lloc web per veure en què hem estat treballant recentment. Fes un cop d'ull als projectes que estem construint i uneix-te a la discussió (irc://irc.freenode.net/indiewebcamp) 🗽 Més enllà dels blogs i de la descentralització La iniciativa de la IndieWeb és diferent d'anteriors esforços/comunitats: Principis abans que projecte-centrisme. Altres assumeixen una monocultura d'un projecte per a tot. Nosaltres estem desenvolupant una pluralitat de projectes. Publica en el teu propi lloc web Mostra abans de parlar. Prioritza la solució dels teus propis problemes, creant, iterant en el teu propi lloc web. Disseny primer, formats en segon lloc. Centra't en una bona experiència d'usuari i en prototips "selfdogfood" per crear els formats i protocols necessaris mínims per a tu. Potser el més important: estem centrats en la gent enlloc de projectes, i tenim encontres regulars on tothom és benvingut. Recursos wiki Canvis recents Penja el document Edita la pàgina d'inici .skin-vector-2022 #mw-content-text { max-width: none; } .vector-feature-zebra-design-disabled #mw-content-text { margin-top: 3px; } .vector-body-before-content, .vector-page-toolbar { display: none; } .iwc-homepage__container { background-color: var(--background-color); padding: 1rem 1.5rem; margin: 0 0 1rem 0; } .iwc-homepage__container--introduction .mw-headline { color: #54595d; font-size: 1rem; } .iwc-homepage__container--introduction p { font-size: 1.1875rem; } .iwc-homepage__content { font-size: 1rem; margin: 0 auto; max-width: 50rem; } .iwc-homepage__content p, .iwc-homepage__content li { max-width: 75ch; } .iwc-homepage__content h2 { border: 0; } .iwc-homepage__content figure + h3 { margin-top: 1rem; } .iwc-homepage__content dfn { font-style: normal; } .iwc-homepage__content img { height: auto; max-width: 100%; } figure[typeof~='mw:File'].iwc-homepage__icon, figure[typeof~='mw:File/Frameless'].iwc-homepage__icon { margin: 1.25rem; margin-left: -0.25rem; } .iwc-homepage__content h2:first-of-type, .iwc-homepage__content h3:first-of-type, figure[typeof~='mw:File'].iwc-homepage__icon:first-of-type { margin-top: 0; } Retrieved from "https://indieweb.org/wiki/index.php?title=Main_Page-ca&oldid=93447" Category: Pages in Catalan'''
