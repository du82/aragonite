full_description = '''Main Page-pt PageDiscussion English ReadView sourceView history Tools Tools move to sidebar hide Actions ReadView sourceView history General What links hereRelated changesSpecial pagesPrintable versionPermanent linkPage information From IndieWeb O que é IndieWeb? A IndieWeb é uma alternativa a "web corporativa" focada na pessoa. Seu conteúdo te pertence Quando você publica algo na Web, ele deve pertencer a você, não a uma corporação. Muitas empresas saíram do mercado e perderam todos os dados de seus usuários. Ao fazer parte da IndieWeb, seu conteúdo permanece seu e está sob seu controle. Você está melhor conectado Seus artigos e mensagens de status podem ir para todos os serviços, não apenas para um, permitindo que você se envolva com qualquer um. Até mesmo respostas e curtidas em outros serviços podem voltar a seu site para que elas fiquem em um só lugar. Você no controle Você pode postar o que quiser, no formato que quiser, sem que ninguém o monitore. Além disso, você compartilha links legíveis simples, como example.com/ideas. Esses links são permanentes e sempre funcionarão. 🌱 Junte-se a IndieWeb Comece Agora! Ou aprenda mais: Por quê IndieWeb? Leia Essa semana na IndieWeb para destaques semanais, ou veja todas as constribuições recentes Junte-se ao canal #indieweb (log em tempo real) e usando & contribuindo projetos que nós estamos construindo! 🗽 Além de blogs e descentralização A iniciativa IndieWeb é diferente de outras iniciativa/comunidades: Princípios antes centralização do projeto. Outros assumem uma monocultura de um projetos para todos. Nós estams desenvolvendo uma pluralidade de projetos. A comunidade IndieWeb tem um código de conduta. Selfdogfood em vez de email. Mostrar antes de contar. Priorize coçar suas próprias costas, criando, iterando seu próprio site. Design primeiro, protocolos e formatos depois. Foque em uma boa UX & selfdogfood para criar o mínimo necessário de formatos & protocolos. Talvez o mais importante é que somos focados em pessoas, em vez de focados em projetos, e temos encontros regulares onde todos são bem-vindos. 🎡 Homebrew Website Club Homebrew Website Club 2018-11-14 SF O Homebrew Website Club é um encontro regular de criativos apaixonados por melhorar seus próprios sites, compartilhando sucessos e desafios com uma comunidade solidária e com ideias semelhantes. Próximos encontros 2025-03-05 19:00-20:30 Homebrew Website Club Europe/London 18:00-20:00 Homebrew Website Club - Pacific 2025-03-11 18:00-19:00 Homebrew Website Club Edinburgh: Writing Hour 2025-03-12 18:00-20:00 Homebrew Website Club - Nuremberg/Germany 19:00-20:30 Homebrew Website Club Europe/London 2025-03-19 19:00-20:30 Homebrew Website Club Europe/London 2025-03-25 18:00-19:00 Homebrew Website Club Edinburgh 🎪 IndieWebCamp IndieWeb Summit 2019 IndieWebCamp é um encontro de dois dias de criadores da web que avançam de forma colaborativa na web independente. Um dia de sessões de discussão e um dia hackeando, criando e melhorando nossos sites pessoais para nos capacitar e inspirar uns aos outros. Ajude a organizar, sugira datas, locais e seja voluntário: Future IndieWebCamps Contribute to IndieWebCamp Planning! Traduções Você pode ler e editar artigos do IndieWebCamp em outros idiomas: Català (Catalan) Deutsch (German) Español (Spanish) Français (French) 한국어 (Korean) 中文 (Chinese) Italiano (Italian) See also other-languages, and how-to-start-a-new-translation. Mais Informação Leia postagens sobre a IndieWeb Assista vídeos sobre a IndieWeb Siga notícias sobre a IndieWeb Participe em próximos eventos IndieWeb Junte-se #indieweb chat e discuta todas as coisas relacionadas a IndieWeb Recursos Wiki Recent changes Upload file Editar página inicial .skin-vector-2022 #mw-content-text { max-width: none; } .vector-feature-zebra-design-disabled #mw-content-text { margin-top: 3px; } .vector-body-before-content, .vector-page-toolbar { display: none; } .iwc-homepage__container { background-color: var(--background-color); padding: 1rem 1.5rem; margin: 0 0 1rem 0; } .iwc-homepage__container--introduction .mw-headline { color: #54595d; font-size: 1rem; } .iwc-homepage__container--introduction p { font-size: 1.1875rem; } .iwc-homepage__content { font-size: 1rem; margin: 0 auto; max-width: 50rem; } .iwc-homepage__content p, .iwc-homepage__content li { max-width: 75ch; } .iwc-homepage__content h2 { border: 0; } .iwc-homepage__content figure + h3 { margin-top: 1rem; } .iwc-homepage__content dfn { font-style: normal; } .iwc-homepage__content img { height: auto; max-width: 100%; } figure[typeof~='mw:File'].iwc-homepage__icon, figure[typeof~='mw:File/Frameless'].iwc-homepage__icon { margin: 1.25rem; margin-left: -0.25rem; } .iwc-homepage__content h2:first-of-type, .iwc-homepage__content h3:first-of-type, figure[typeof~='mw:File'].iwc-homepage__icon:first-of-type { margin-top: 0; } Retrieved from "https://indieweb.org/wiki/index.php?title=Main_Page-pt&oldid=93290" Category: Pages in Portuguese'''
