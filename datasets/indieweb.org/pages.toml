["https://indieweb.org/IndieWeb:General_disclaimer"]
title = "code-of-conduct - IndieWeb"
full_description = '''Toggle the table of contents Toggle the table of contents code-of-conduct PageDiscussion English ReadView sourceView history Tools Tools move to sidebar hide Actions ReadView sourceView history General What links hereRelated changesSpecial pagesPrintable versionPermanent linkPage information From IndieWeb (Redirected from IndieWeb:General disclaimer) 🌈 IndieWeb code of conduct tl;dr: Be respectful of other people, respectfully ask people to stop if you are bothered, and if you can't resolve an issue, contact staff. If you are being a problem, it will be apparent and you'll be asked to leave. Based on previous excellent work by others, this is a living code of conduct. This code of conduct applies to all IndieWeb spaces both online and off, including our events, chat channels, and wiki. Respect IndieWeb is an intentionally positive community that recognizes and celebrates the creativity and collaboration of independent creators (and independence) and the diversity of people, cultures, and opinions that they bring to IndieWeb. IndieWeb spaces are an inclusive environment, based on treating all individuals respectfully, regardless of gender (including transgender status), sexual orientation, age, disability, medical conditions, race and/or ethnicity, caste, nationality, religion (or lack thereof), physical appearance, politics, ideology (real world or tech), or software preferences. We value respectful behavior above individual opinions. Respectful behavior includes: Be considerate, kind, constructive, and helpful. Avoid demeaning, discriminatory, harassing, hateful, gratuitous or off-topic sexual (body part), or physically threatening behavior, speech, text, names, and imagery. If you're not sure, ask someone instead of assuming. IndieWeb prioritizes marginalized people’s safety over privileged people’s comfort. IndieWeb organizers reserve the right not to act on complaints regarding: ‘Reverse’ -isms, including ‘reverse racism,’ ‘reverse sexism,’ and ‘cisphobia’ Reasonable communication of boundaries, such as “leave me alone,” “go away,” or “I’m not discussing this with you.” Communicating in a ‘tone’ you don’t find congenial Criticizing racist, sexist, cissexist, or otherwise oppressive behavior or assumptions (Thanks to XOXO for providing the above paragraph and list on marginalized people’s safety with a CC-BY license) Resolve Peacefully We believe peer to peer discussions, feedback, corrections can help build a stronger, safer, and more welcoming community. If you see someone behaving disrespectfully, you are encouraged to respectfully discourage them from such behavior. Expect that others in the community wish to help keep the community respectful and welcome your input in doing so. If you experience disrespectful behavior and feel in any way unable to respond or resolve it respectfully (for any reason), please immediately bring it to the attention of an organizer. We want to hear from you about anything that you feel is disrespectful, threatening, or just icky in any way. We will listen and work to resolve the matter. Apologize for Mistakes Should you catch yourself behaving disrespectfully, or be confronted as such, own up to your words and actions, and apologize accordingly. No one is perfect, and even well-intentioned people make mistakes. What matters is how you handle them, and avoiding repeating them in the future. Consequences If the organizers determine that an event participant is behaving disrespectfully, the organizers may take any action they deem appropriate, up to and including expulsion and exclusion from the event without warning or refund. As organizers, we will seek to resolve conflicts peacefully and in a manner that is positive for the community. We can't foresee every situation however, and thus if in the organizers' judgment the best thing to do is to ask a disrespectful individual to leave, we will do so. Resolving an Issue If you believe you’re experiencing practices at an IndieWeb event which doesn’t meet the policies below, or if you feel you are being harassed in any way, please immediately contact the event organizer(s) or designated code of conduct responders for the event. If you believe you’re experiencing practices in chat or at an event which don’t meet the policies above, please immediately contact any ally you may know. Anyone in the community should feel empowered to resolve issues and uphold our high standards. However if you feel the issue requires escalation to a community organizer please contact: Marty McGuire US/Eastern schmarty in chat Aaron Parecki US/Pacific aaronpk in chat imessage/email: aaron@parecki.com sms/voice: 503-567-8642 Martijn van der Ven Central European Time Zegnat in chat Feel free to contact me out of the blue, even over email or any other way available to you listed on my personal website. gRegor Morrill US/Pacific gRegor or gRegorLove in chat or contact through https://gregorlove.com/contact/ capjamesg and Mark Sutherland UK capjamesg and marksuth in chat or contact via jamesg@jamesg.blog. Add yourself here… (see this for more details) include your local timezone License Like everything else posted on IndieWeb.org, this Code of Conduct is released to the public domain according to CC0 (see the wiki's copyright page for details). Open Code of Conduct You can re-use the IndieWeb code-of-conduct for your own community by: Copy/paste the whole thing (the CC0 license lets you do this) Replace "IndieWeb" with the name of your organization Make any organization-specific customizations you think are needed You may attribute indieweb.org/code-of-conduct as a source if you wish Consider also licensing your Code of Conduct with the CC0 license so others may easily re-use it as well Drop us a line in chat! We'd love to add yours to our list of similar codes of conduct, and see what improvements you've made. Thanks Thank you to every IndieWeb community member for helping making IndieWeb the respectful and inclusive community that it is. Signed Organizers: Tantek 18:28, 14 February 2013 (PST) Aaronparecki.com 16:55, 16 February 2013 (PST) ... (fellow organizers, please sign with ~~~~) And anyone else that wishes to help uphold this code of conduct and the principles therein: Waterpigs.co.uk 23:18, 14 February 2013 (PST) Ben Atkin 20:52, 16 February 2013 (PST) Tom Morris 10:25, 26 March 2013 (GMT) Hupili.net 19:59, 9 July 2013 (PDT) Bret.io 20:00, 9 July 2013 (PDT) Kylewm.com 15:14, 25 June 2014 (PDT) Kevinmarks.com 13:59, 19 September 2014 (PDT) Petermolnar.eu 13:59, 19 September 2014 (PDT) Bill Rawlinson 22:00, 19 September 2014 (GMT) Ben Roberts 17:00, 19 September 2014 (EDT) Michael Owens 13:13, 16 October 2014 (PDT) Bear.im 13:56, 19 December 2014 (PST) gRegor Morrill 18:27, 22 June 2015 (PDT) Jeena 19:14, 22. July 2015 (CEST) Matthias Pfefferle 06:17, 23 July 2015 (PDT) Bradleyallen.info 23:12, 7 January 2016 (PST) Bridget Harrison 23 January 2016 Benjamin Melançon 2016 January 25 Joschi Kuphal 15:16, 6 February 2016 (CET) Jason Garber 08:29 8 February 2016 (EST) Www.rmendes.net 10:50, 16 June 2016 (PDT) Christophe Ducamp 22:22, 19 June 2016 (PDT) Www.funwhilelost.com 11:40, 24 October 2016 (PDT) martymcgui.re 16:10, 19 June 2017 (PDT) Josh Juran 17:52, 24 June 2017 (PDT) Chris Aldrich 15:03, 14 July 2017 (PDT) Sebastian Lasse 00:00, 10 September 2017 (GMT) Kimberly Hirsh 09:47, 6 May 2018 (PDT) 陈耀军（Eureka Chen） 2018年5月24日(GMT) dougbeal 19:37, 13 July 2018 (PDT) Arlo James Barnes 17:17, 8 December 2018 (PST) Cathie LeBlanc 10:54am, 01 January 2019 (EST) Frank Meeuwsen 18:39, 8 february 2019 (CET) David Shanske 2019-06-28 (would have signed earlier if I noticed a signature section) Jacky Alciné 2019-06-28 (PST) Evgeny Kuznetsov 12:32, 29 June 2019 (PDT) Tuna Çağlar Gümüş 00:51, 11 March 2020 (TRT) Dmitri Shuralyov 12:13, 25 October 2020 (PDT) Yousef Amar 15:31, 5 October 2022 (PDT) Herbi Marquez 15:49, 19 January 2023 (PST) Dr. Matt Lee 13:56, 9 September 2024 (PDT) Joe Crawford 12:53, 20 October 2024 (PDT) capjamesg 19:17, 19 December 2024 (GMT) Paul Watson 19:18, 19 December 2024 (GMT) Murray 19:36, 19 December 2021 (GMT) sign with ~~~~ (that's four tildes), or {{your-sig-template-name-here}} ~~~~~ (that's five tildes) Testimonials https://twitter.com/CharlieRoseMari/status/1209356881044688896?s=20 "My other favorite thing about #IndieWeb is just how nice and friendly everyone is, and the fact that there is a super empowering COC." @CharlieRoseMari December 24, 2019 Feedback code-of-conduct-feedback Quotes Be excellent to each other.—Bill S. Preston (1989) Similar Codes of Conduct The following codes of conduct are based on this one, and are similar in terms of focusing on positive behaviors and community empowerment. Code of Conduct — Yes and Yes Yes 2015-08-17 Brit Charek Learning to Say Yes: Our Experience at an Unconference … you knew everyone was interesting and at most two or three degrees of separation from you. Between that and the conference’s code of conduct and stance on inclusion and collaboration, I really felt that I was in a safe place to share ideas. Emphasis added. Google Open Source Community Guidelines See Also code-of-conduct-why code-of-conduct-examples Health & Safety Policy Retrieved from "https://indieweb.org/wiki/index.php?title=code-of-conduct&oldid=99857"'''
