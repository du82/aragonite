["https://indieweb.org/Main_Page-es"]
title = "Main Page-es - IndieWeb"
description = 'La IndieWeb es una alternativa centrada en la gente a la "web corporativa".'
full_description = '''Main Page-es PageDiscussion English ReadView sourceView history Tools Tools move to sidebar hide Actions ReadView sourceView history General What links hereRelated changesSpecial pagesPrintable versionPermanent linkPage information From IndieWeb ¿Qué es IndieWeb? La IndieWeb es una alternativa centrada en la gente a la "web corporativa". Es una comunidad de sitios web independientes y personales conectados por estándares abiertos basados en los principios de: tener su propio dominio y usarlo como su identidad principal, publicar en su sitio (o en otros sitios opcionalmente) y ser proprietario de su contenido. Tu contenido es tuyo Cuando publicas algo en la web, debería pertenecerte a ti, no a una empresa. Demasiadas compañías han cerrado y perdido todos los datos de sus usuarios. Uniéndote al IndieWeb, tu contenido continúa siendo tuyo y estando bajo tu control. Estás mejor conectado Tus artículos y mensajes de estado pueden transmitirse a todos los servicios, no solamente uno, y permitir así que te relaciones con todo el mundo. Incluso las respuestas y los "Me gusta" en otros servicios pueden regresar a tu sitio de esta forma están todos en un mismo lugar. Tú tienes el control Puedes publicar lo que quieras, en el formato que quieras, sin que nadie te monitoreé. Adicionalmente, compartes enlaces simples de leer como ejemplo.com/ideas. Estos enlaces son permanentes y siempre funcionarán. 🌱 Únete al IndieWeb ¿Interesado/a? Empieza ahora! Participa en el chat #indieweb (registro en tiempo real) para compartir tu sitio, inspiración o preguntar sobre servicios y proyectos para comenzar tu sitio IndieWeb! Lee This Week in the IndieWeb para ver lo más destacado de la semana. Lee publicaciones recientes sobre IndieWeb en español 🗽 Más allá de los blogs y de la descentralización La iniciativa IndieWeb es diferente a esfuerzos y comunidades anteriores: Principios antes del proyecto-centrismo. Otros asumen una monocultura de un proyecto para todos. Nosotros desarrollamos una pluralidad de proyectos. La communidad IndieWeb tiene un código de conducta. Publicar en su sitio. Mostrar antes de contar. Priorizar haciendo lo que necesitas, creando y mejorando en su sitio web. Diseño primero y formatos despues. Enfocate en una buena experiencia y usa lo que haces para crear los mínimos formatos y protocolos necesarios. Lo más importante: estamos centrados en la gente en lugar de proyectos, y tenemos encuentros regulares donde todo el mundo es bienvenido. Translations Puedes leer y editar artículos en otros idiomas: Català (Catalán) Deutsch (Alemán) English (Ingles) Français (Francés) 한국어 (Coreano) Norsk bokmål (Bokmål Noruego) Türkçe (Turco) 中文 (Chino) Italiano (Italiano) Portuguese (Portugués) Русский (Ruso) Vea también otros idiomas y cómo iniciar una nueva traducción. Recursos Wiki Cambios recientes Subir archivo Editar página de inicio .skin-vector-2022 #mw-content-text { max-width: none; } .vector-feature-zebra-design-disabled #mw-content-text { margin-top: 3px; } .vector-body-before-content, .vector-page-toolbar { display: none; } .iwc-homepage__container { background-color: var(--background-color); padding: 1rem 1.5rem; margin: 0 0 1rem 0; } .iwc-homepage__container--introduction .mw-headline { color: #54595d; font-size: 1rem; } .iwc-homepage__container--introduction p { font-size: 1.1875rem; } .iwc-homepage__content { font-size: 1rem; margin: 0 auto; max-width: 50rem; } .iwc-homepage__content p, .iwc-homepage__content li { max-width: 75ch; } .iwc-homepage__content h2 { border: 0; } .iwc-homepage__content figure + h3 { margin-top: 1rem; } .iwc-homepage__content dfn { font-style: normal; } .iwc-homepage__content img { height: auto; max-width: 100%; } figure[typeof~='mw:File'].iwc-homepage__icon, figure[typeof~='mw:File/Frameless'].iwc-homepage__icon { margin: 1.25rem; margin-left: -0.25rem; } .iwc-homepage__content h2:first-of-type, .iwc-homepage__content h3:first-of-type, figure[typeof~='mw:File'].iwc-homepage__icon