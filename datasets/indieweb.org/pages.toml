title = "2024/Berlin - IndieWeb"
description = "IndieWebCamp Berlin 2024, the ninth IndieWebCamp in Berlin, was 2024-11-09…10 the weekend after btconf Berlin 2024."
full_description = '''Toggle the table of contents Toggle the table of contents 2024/Berlin PageDiscussion English ReadView sourceView history Tools Tools move to sidebar hide Actions ReadView sourceView history General What links hereRelated changesSpecial pagesPrintable versionPermanent linkPage information From IndieWeb ⚠️ This is a past IndieWebCamp! See the Berlin page for the next IndieWebCamp Berlin IndieWebCamp Berlin 2024 IndieWebCamp Berlin 2024 IndieWebCamp Berlin 2024, the ninth IndieWebCamp in Berlin, was 2024-11-09…10 the weekend after btconf Berlin 2024. 🗓 https://events.indieweb.org/2024/11/XkH8P6vkmYNr Summary IndieWebCamp Berlin is an all-levels BarCamp-like collaboration in Berlin for two days of keynotes, brainstorming, creating, teaching, and helping gain more control over our data and lives online! Learn how to use open web services, software, and technologies to empower yourself and – maybe more importantly – encourage all users to own their own content and identities. Bring your laptop and mobile devices, we’ll help you get setup to both publish where you want, and keep control of your content! Etherpad: https://etherpad.indieweb.org/2024-11-09-iwc-berlin Venue Mozilla Berlin, GSG-Hof Schlesische Straße, Building 3, 4th Floor, Schlesische Straße 27, 10997 Berlin, Germany. Participating ❤️ Code of Conduct Please read and agree to these: IndieWeb code of conduct Tickets 🎟 We've hit capacity and tickets are CLOSED for IndieWebCamp! Join us online (remote participation details to follow below). Consider getting a streaming 🎟 btconf ticket too! And start planning your travel and lodging! Optional: Add yourself to the Going list below! Remote Participation 💻 Main IndieWebCamp room: https://us02web.zoom.us/j/82618857318?pwd=LbwLKs8nbnmEZH34pLf4JUAggRtObe.1 Orange: https://thws-de.zoom-x.de/j/62683648550?pwd=7zHP8q05vNAL777rOW95wBWajucp0s.1 Yellow: https://hs-ansbach-de.zoom.us/j/64909777603?pwd=50s95dYLN9eDmBIM4NuB12ajVuACDv.1 Health and Safety 😷 In order to ensure a safe and healthy environment for all, if you are feeling unwell, or have any respiratory (Covid, RSV, flu, cold) symptoms, we require that you participate remotely. Before the camp, we recommend: get fully vaccinated for COVID-19, including if possible the updated Fall 2024 booster bring KN95/FFP2, N95, or equivalently rated mask/respirator that you’re comfortable wearing in meeting rooms take a Covid test before travel. we require remote-only participation if positive contact the #Organizers with any specific concerns / desires with respect to Health and Safety In the 5 days beforehand (i.e. November 4th-8th inclusive) please consider avoiding any situations that may risk exposure to contagious diseases, or at least wear a rated mask if you must enter such a situation (e.g. going to a hospital, pharmacy, on taking transit of any sort). En route to Berlin and the camp: If you are flying or taking a train to the IndieWebCamp to participate in person, please consider: In airports or stations: wear rated mask at all times, except for any identity checks On the plane or train: wear a rated mask at all times, except to briefly pull it down to take a sip of water/liquids. Daily at the camp, there will be good air circulation in the venue. In addition: if you are feeling unwell, or have any respiratory (Covid, RSV, flu, cold) symptoms, you must participate remotely (not in-person) the venue recommends but does not require masking indoors our room tables and chairs layout will permit sitting at 2m/6' distance if you prefer recommend masking when indoors, and only removing a mask to take a sip from a drink recommend eating only in the break area outside the meeting rooms, or outside the building speakers at the podium (e.g. when demonstrating) may remove their masks while speaking note: there may be other venue workers (Mozillians) present who we are sharing the space with who are not under any requirements for masking etc. Updates: similar to the IndieWebCamp Portland Health and Safety policy, this policy is a living policy, and may receive clarifying edits between now and the IndieWebCamp. However, we will not remove or downgrade any aspect of this policy between now and IndieWebCamp Berlin 2024. Schedule 🗓 Main article: 2024/Berlin/Schedule Schedule for Saturday and Sunday, November 9-10. Start/end times firm-ish, inside flex. 09:30 Organizer setup 10:00 Doors / tables / seats open! BYO laptop, coffee, or breakfast, and join us! 10:30 Welcome, policies, logistics 10:40 Intros and Session planning — let's brainstorm session discussion topics / Create Day topics/projects sharing for collaboration 11:30 breakout/Create Day sessions 12:30 photo and lunch break 13:30 breakout/Create Day sessions 15:00 Demos for Create Day! (Sunday only) 16:45 Camp cleanup 17:00 Camp closed for the day Breakfast and Coffee There are a few coffee shops within a 10 minute walk of the venue to get coffee before the event: Cafe BARETTO Espressobar: Wrangelstraße 41, 10997 Berlin, Germany Coffee and filled croissants available. Opens 9am on weekends passenger espresso: Oppelner Str. 44, 10997 Berlin, Germany Coffee, sandwiches, and cakes available. Opens 9:30am on weekends Café Quitte Espresso Bar Kreuzberg: Wiener Straße 62, 10999 Berlin, Germany Coffee, pastries, bagels available. Opens 8am on weekends 19grams Schlesi: Schlesische Str. 38, 10997 Berlin, Germany Coffee and light pastries available. Opens 10am on weekends (perhaps ideal for a coffee in the lunch break) Planning Main article: 2024/Berlin/Planning Note: Beyond Tellerrand 2024 Berlin 2024-11-07…08 ThF: https://beyondtellerrand.com/events/berlin-2024 Participants and Ideas 👥 RSVPd and registered with a a ticket? Add your interests and what you want to create! Tantek Çelik interested in principles, FYND, and want to work on Falcon Marc Thiele Joschi Kuphal capjamesg jo will attend in person on Saturday! Sven Knebel Sara Jakša Frederik Braun (Saturday TBD, but definitely on Sunday) Kagami Dennis paotsaq Stefan Rudersdorf Add yourself here… (see this for more details) Maybe: Martijn van der Ven - might turn up last minute, but not able to commit until late October at the earliest. scoutaloud - cannot attend in person but might join remotely if that is a possibility Add yourself here… (see this for more details) Remote...for sure David Shanske Organizers Organizers: Tantek Çelik — venue, wikifying, some supplies, helping run day of Marc Thiele — some comms / promo with btconf emails / announcements Joschi Kuphal — some supplies, some remote participating equipment (360deg video), sponsors wrangling capjamesg — wikifying, weekend coffee and breakfast options, perhaps gathering & coordinating volunteers See Checklists for tasks. Posts Blog posts, articles, notes, toots, tweets etc. about the camp! https://mastodon.social/@btconf/113162883538872283 "The #indiewebcamp is back in Berlin and You can be part of two exciting days right after #btconf! @tantek.com, James and @jkphl are teaming up to meet you in the Mozilla Office in Berlin. All information and registration here: https://beyondtellerrand.com/events/berlin-2024/side-events#indiewebcamp" @btconf September 19, 2024 2024-314 Tantek Çelik: https://tantek.com/2024/314/t1/indiewebcamp-berlin-2024-day-1 Day 1 of #IndieWebCamp #Berlin 2024¹ was very well attended!* 20 participants, more than 3x the previous one in 2022, and second highest (2019 had 22).* 18 introduced themselves² and their personal sites or aspirations for oneCollectively we proposed and facilitated 11 breakout sessions³ on many timely topics covering #syndication, #inclusion, #longevity, #federation / #fediverse, how to best use #Mastodon with your personal site, #privacy and #security concerns of being online, #writing, how can we design better user interfaces for text authoring, and personalized reading #algorithms for staying connected with friends. … 2024-11-10 jo: Day trip to my first IndieWebCamp in Berlin ... IndieWebCamps 2025 Düsseldorf • Berlin • Planning More Camps & Popups 2024 Brighton • Düsseldorf • Portland • Berlin • San Diego Build a Website in an Hour March (P) 2023 Nuremberg • San Diego Create Day November (O) • CreateFest December (O) Multi-Lingual Personal Websites (P) • Build a Website in an Hour July (P) • Build a Website in an Hour September (P) 2022 Düsseldorf • Berlin Create Day March (O) • July (O) • September (O) • December (O) Analog Meets Online (P) • Personal Libraries (P) • How to Make the IndieWeb More Approachable (P) 2021 Düsseldorf Create Day July (O) • October (O) • December (O) Respectful Responses (P) • Webmentions Beyond Webmention.io (P) • Very Sensitive Data (P) • Microsub (P) • IndieAuth (P) • Gardens and Streams II (P) • IndieAuth 2 (P) 2020 Austin Online • London (O) • West (O) • East (O) • Create Day (O) Garden & Stream (P) • Micropub (P) • IndieAuth (P) • Get Started with WP (P) • microformats2 (P) • Friendly WP Themes (P) 2019 Austin • New Haven • Berlin • Düsseldorf • Utrecht • 9th IndieWeb Summit (Portland) • Amsterdam • Oxford • NYC • Brighton • Berlin2 • SF Online 2018 Baltimore • Düsseldorf • 8th IndieWeb Summit (Portland) • SF • Oxford • NYC • Nürnberg • Berlin 2017 Bellingham • Düsseldorf • Nürnberg • 7th IndieWeb Summit (Portland) • Istanbul • NYC • Berlin • Austin 2016 NYC • MIT • Nürnberg • Düsseldorf • 6th IndieWeb Summit (Portland) • NYC2 • Brighton • LA (Santa Monica) • Berlin • MIT2 2015 Cambridge MA • Germany (Düsseldorf) • Portland & Brighton (5th Summit) • Edinburgh • MIT • SF 2014 SF • NYC • Portland/NYC/Berlin (4th Summit) • UK (Brighton) • Cambridge MA • Online 2013 Portland (3rd Summit) • UK (Brighton) • Hollywood 2012 Portland (2nd Summit) • UK (Brighton) 2011 Portland (Summit) See Also Previously: 2022/Berlin, 2019/Berlin2, 2019/Berlin, 2018/Berlin, 2018#Berlin_Remote_Event, 2017/Berlin, 2016/Berlin, 2014 (one of three locations) Berlin IndieWebCamp Retrieved from "https://indieweb.org/wiki/index.php?title=2024/Berlin&o