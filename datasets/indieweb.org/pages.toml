10&09 • 09-03 • 08-27&26 • 08-20 • 08-13&12 • 07-29 • 07-15 • 07-01 • 06-17 • 06-03 • 05-20 • 05-06 • 04-22 • 04-08 • 03-25 • 03-11 • 02-25 • 02-11 • 02-07-ko • 01-28 • 01-14 2014 12-17 • 12-03 • 11-19 • 11-05 • 10-22 • 10-08 • 10-05-par • 09-24 • 09-10 • 08-27 • 08-13 • 07-30 • 07-16 • 07-02 • 06-18 • 06-04 • 05-21 • 05-07 • 04-23 • 04-09 • 03-26 • 03-19 • 03-12 • 02-26 • 02-12 • 01-29 • 01-15 2013 12-18 • 12-04 • 11-20 Regular Meetings Just show up. These Homebrew Website Club chapters are well established and meet regularly at least once a month (often fortnightly AKA bi-weekly). If it has been more than a month since a city has met, move them down to popups until a regular pattern is re-established. Alphabetical by city/region, see each city for regularity. Americas Pacific Online 🌎 Americas / Pacific Online, AKA Virtual HWC North American Time: Hosted online weekly Organizer(s): Chris Aldrich, David Shanske First meeting: ???? (maybe in 2020 soon after lockdown?) Venue: see the Zoom link on https://events.indieweb.org/ events Europe / London Online 🌎 Europe / London Online, AKA Virtual HWC UK Time: Hosted online weekly Formerly hosted in person in London, ENGLAND - monthly Current organiser(s): Mark Sutherland, capjamesg Former organiser(s): Ana Rodrigues, Calum Ryan, Neil Mather First meeting 2016-06-15 Nuremberg 🏰 Nürnberg, Germany - in person, monthly Organizer(s): Sebastian Feldmann, Björn Stierand First Meeting 2016-05-25 Recently: 2025-02-12 Upcoming: 2025-03-12 Venue: LEONARDO Zentrum für Kreativität und Innovation, Karl-Grillenberger-Str. 3a, Nürnberg Emeritus organizers: Joschi Kuphal, Julie Anne Noying (founding co-organizer) Popups These cities have held popup Homebrew Website Club meet-ups at least a couple of times recently, and are working hard to get established! After three consecutive months of successful regular meetings, popups get bumped to Regular meetings! Or if they do not happen for three months, bump them back down to Getting Started. Cities getting started Speak up and help make another meetup happen in your city! These cities have organizers (can always use more), have (re)started with at least one meeting (hopefully with a photo posted), and would love to hear from you to help make more happen. If it's been more than six months since a meet-up or organizers have all moved to other cities, move a city to "Up-and-coming or needs restarting" in the next section. Ordered alphabetically: Edinburgh Edinburgh, UK monthly Organizer(s): Harry Reeder First meeting 2015-08-13 (Thursday) Restarted 2024-03-26 Met nearly every Tuesday night during 2015 from 2015-10 onward, and every Thursday night before that since 2015-08-13! TODO: note when meetings went on hiatus Needs restarting Step up and make a meetup happen. These cities have one or more organizers interested in helping making a meetup happen and are up for grabs. Step up, contact the folks below, and make a meetup happen! At your first (or first in at least six months) meet-up be sure to take and post photos, then link to them and bump up your city to Cities getting started above. no other cities have organizers for an in-person meetup 🇪🇺 Virtual HWC European time Online - fortnightly Organizer(s): Martijn van der Ven First meeting: 2017-05-31 Meetings on Mumble, other platforms sometimes under consideration. More cities with interest Interested in helping start a Homebrew Website Club? Find or add your city and name below! Sorted alphabetically by city. Brisbane, Australia - Malcolm Blaney is interested, has an office walking distance from train. Cincinnati, OH - Dave Menninger is interested in meeting up Durham, NC - Kimberly Hirsh is interested in meeting up in Durham, NC. Glasgow, Scotland - Donald McIntosh is interested in meeting up. Melbourne, Australia - vishae is interested in meeting up Rochester, MN - David Williamson is interested in organizing a meetup. Sarasota, FL – TheDavidJohnson is interested in organizing a meetup in Sarasota, FL Savannah, GA - User:Lawver.net is interested in organizing! St. Louis, MO – Mark87 is interested in meeting up in St. Louis, MO. Vienna, Austria - Rosemary Orchard is interested in attending/organising something. Düsseldorf, Germany - Johan Bové is interested in co-organizing. Looking into location options and others to help out. Athens, Greece - User:Heracl.es is interested in co-organizing. Looking into interested homebrewers for setting up a community. ... add your city and your name here if you're interested in co-organizing a Homebrew Website Club in your city. Past Meetings These cities used to have meetings and could totally use a new space(s) and/or another/new co-organizer(s) to step and make one happen! Past co-organizers are more than happy to help connect you to the existing community, so definitely reach out! Accra Accra, Ghana Organizer(s): Greg McVerry, Sadik, ...? First attempt: 2019-02-26 First meeting: 2019-03-20 Most recently: 2019-05-01 🌮 Austin Austin, TX - first Wednesday of the month Organizers: Tom Brown, Manton Reece First meeting: 2017-09-06 Venue: Mozart's Coffee 🦀 Baltimore Baltimore, MD - monthly or sometimes biweekly! Organizer(s): Marty McGuire, Jonathan Prozzi First meeting 2016-09-21 We meet at least once per month. We aim to meet fortnightly to match the usual HWC schedule, but sometimes skip or move a week to avoid conflicts with our venue. Venue is consistently: Digital Harbor Foundation Tech Center, 1045 Light St. Baltimore, MD http://www.digitalharbor.org/ Barnsley Barnsley, UK Organizer(s): Craig Burgess (Europe/London) (@craigburgess) Every third Thursday per https://getdoingthings.com/homebrew-website-club-barnsley-1/ We're just getting off the ground with our first event, July 18 2019 Bellingham Bellingham, WA - fortnightly Organizer(s): gRegor Morrill First meeting 2016-06-15 Ended 2017-10 Venue was consistently: The Foundry, 1000 F St., Bellingham, WA, http://bellinghamfoundry.com Waiting for: need new local organizer(s)! Berlin Berlin, Germany - fortnightly on thursdays (since 2017-09) Organizer(s): Florian Weil, Sebastian Greger, (Sven Knebel – only occasionally in Berlin nowadays) First meeting 2017-02-08 since 2017-10-05 regular location at *IN-Berlin, Lehrter Str. 53, Berlin, Germany* no regular activity in 2018 for now :/ Birmingham Main article: homebrewbrum Birmingham, ENGLAND, last Wednesday of the month Organizer(s): Dave Redfern, Marc Jenkins, Paul Tibbetts First meeting 2016-10-05 2017-10-11 We haven't had a meetup for a few months now and none planned at the mo. 🎪 Brighton Brighton, ENGLAND - weekly Organiser: Jeremy Keith Every Thursday from 6pm to 7:30pm (unless Jeremy is out of town). Venue is consistently: Clearleft, 68 Middle Street, Brighton BN1 1AL https://clearleft.com http://68middle.st Brussels Brussels, Belgium Organizer(s): RMendes & NCollig First meeting on 2017-03-02 HWC Brussels Twitter: https://twitter.com/HwcBrussels @hwcbrussels (appears to be suspended as of 2018-10-04) Chicago Chicago, IL Organizer(s) formerly: Kartik Prabhu, and gRegor Morrill First meeting 2014-04-09 Waiting for: need new local organizer(s)! Detroit Detroit, MI Organizer: Les Orchard First meeting (attempt) 2016-03-23 ... Edmonton Edmonton, AB, Canada Organizer: kongaloosh First meeting 2017-06-06 and [1] Most recently ... ? Fort Collins Fort Collins, CO Organizer(s): Isabel Forester First meeting 2017-05-03 Waiting for: a space to be used regularly Facebook Group (for planning and events): Homebrew Website Club Fort Collins Most recently ... ? Frederick Frederick, MD monthly Organizer(s): Eddie Hinkle First meeting on 2017-07-26, on a hiatus as of 2018-03-01. Some lessons learned: having a co-organizer is helpful for days when there are low attendance. Future plans: potential rebranding to IndieWeb Meetup vs. HWC to broaden external appeal, potentially find a co-organizer, etc. Considering restarting in the first quarter of 2019. Gent Gent, Belgium Organizer(s): Kristof De Jaeger HWC Gent Twitter: @HWCGent 🏖 Goa Goa, India Organizer(s): prtksxna First meeting: 2019-07-24 Starting with support of the WordPress group. Gothenborg Göteborg, Sweden monthly Organizer(s): Jeena Paradies First Meeting 2015-07-29 Meets ~once a month (plan: every second Wednesday) Guadalajara Guadalajara, Mexico Organizer(s): Ken Bauer First meeting was a success (7 people) Mar 20, 2019 Second meeting was also a success and the third was small New site created specifically for the club On hiatus, working on next meeting to start during the upcoming semester on campus that starts in August. We plan to combine this club meeting with topics on use of open source software to give a broader draw and try to grow numbers. Please help to invite others! 🇮🇳 Indian Standard Time Virtual HWC Online Organizer(s): Chaitanya First meeting: 9 September 2020 Upcoming meeting: 30 September 2020 Platform: Zoom 🔺 Karlsruhe Karlsruhe (monthly — see https://github.com/hwc-ka/dates for upcoming) Organizer: Daniel Ehniss, Matthias Pf'''
