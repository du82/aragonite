title = "Main Page-ko - IndieWeb"
description = "인디웹(IndieWeb)은 '기업 기반 상용 웹'에 대한 대안으로서 사람들이 중심이 되는 웹입니다."
full_description = '''Main Page-ko PageDiscussion English ReadView sourceView history Tools Tools move to sidebar hide Actions ReadView sourceView history General What links hereRelated changesSpecial pagesPrintable versionPermanent linkPage information From IndieWeb 인디웹(IndieWeb) 소개 인디웹(IndieWeb)은 '기업 기반 상용 웹'에 대한 대안으로서 사람들이 중심이 되는 웹입니다. 콘텐츠는 주인은 여러분이에요! 웹 상에 뭔가를 올릴 때, 이는 회사가 아니라 여러분의 것입니다. 많은 회사들이 비지니스가 더 이상 안되면, 여러분의 데이터를 없애버립니다. 인디웹에 참여하시면, 여러분의 콘텐츠는 여러분이 제어하실 수 있습니다. 여러분이 더 잘 할 수 있어요! 여러분의 글이나 메시지는 모든 서비스에 올릴 수 있습니다. 더 많은 사람들이 볼수도 있구요. 댓글이나 좋아요!한 것도 , 원한다면 여러분의 사이트로 되돌아 올 수 있습니다. 여러분이 제어할 수 있어요! 원할 때, 원하는 곳에 올릴 수 있고 누구도 모니터링 하지 않습니다. example.com/ideas' 같은 간단한 링크로 공유 가능하고 이들은 영구적 주소로 존재할 수 있습니다. 🌱 블로그와 분산 웹의 미래 인디웹은 이전 노력 및 커뮤니티와 몇 가지 차별점이 있습니다. 기본 원칙 - 독점문화를 넘어서 공감대 기반 프로젝트를 만들고 있습니다. 개밥먹기 - 말 만하기 전에 문제를 발견하고, 만들고, 고치는 과정을 계속 우선합니다. 먼저 디자인을 하고, 포맷은 나중에. 최소한의 표준과 프로토콜을 가지고 멋진 UX와 개밥먹기 프로토타입을 먼저 만듭니다. 관심이 있으시면, 지금 참여해주세요! 현재 토론 내용(영문)을 보시고 최신 변경 사항(영문)도 확인 하실 수 있습니다. 현재 진행 중인 프로젝트 목록을 확인 하신 후 IRC 토론 (irc://irc.freenode.net/indiewebcamp) 참여나 인디웹 캠프 행사에도 참여해 주세요! 🎡 홈브루 웹사이트 클럽 홈브루 웹사이트 클럽(Homebrew Website Club)은 과거 홈브루 컴퓨터 클럽과 유사하게 자기 자신만의 웹 사이트를 만들고, 디자인하고 향상 시키려는 격주 모임입니다. 🎪 인디웹 캠프 인디웹캠프(IndieWebCamp)는 인디웹을 더 발전 시키려는 오픈 웹 기술을 나누고 만드려는 웹 창작자들의 모임입니다. 주말 동안 함께 모여서 토론하고 새로운 사람들을 독려하고, 해킹 및 창의적 작업을 위해 시간을 보내게 됩니다. 위키 리소스 최근 변경사항 파일 업로드 홈페이지 편집 .skin-vector-2022 #mw-content-text { max-width: none; } .vector-feature-zebra-design-disabled #mw-content-text { margin-top: 3px; } .vector-body-before-content, .vector-page-toolbar { display: none; } .iwc-homepage__container { background-color: var(--background-color); padding: 1rem 1.5rem; margin: 0 0 1rem 0; } .iwc-homepage__container--introduction .mw-headline { color: #54595d; font-size: 1rem; } .iwc-homepage__container--introduction p { font-size: 1.1875rem; } .iwc-homepage__content { font-size: 1rem; margin: 0 auto; max-width: 50rem; } .iwc-homepage__content p, .iwc-homepage__content li { max-width: 75ch; } .iwc-homepage__content h2 { border: 0; } .iwc-homepage__content figure + h3 { margin-top: 1rem; } .iwc-homepage__content dfn { font-style: normal; } .iwc-homepage__content img { height: auto; max-width: 100%; } figure[typeof~='mw:File'].iwc-homepage__icon, figure[typeof~='mw:File/Frameless'].iwc-homepage__icon { margin: 1.25rem; margin-left: -0.25rem; } .iwc-homepage__content h2:first-of-type, .iwc-homepage__content h3:first-of-type, figure[typeof~='mw:File'].iwc-homepage__icon:first-of-type { margin-top: 0; } Retrieved from "https://indieweb.org/wiki/index.php?title=Main_Page-ko&oldid=93294" Category: Pages in Korean'''
