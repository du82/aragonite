["https://indieweb.org/Main_Page-nb"]
title = "Main Page-nb - IndieWeb"
description = "IndieWeb er et folkefokusert alternativ til “bedriftsnettet”."
full_description = '''Main Page-nb PageDiscussion English ReadView sourceView history Tools Tools move to sidebar hide Actions ReadView sourceView history General What links hereRelated changesSpecial pagesPrintable versionPermanent linkPage information From IndieWeb Hva er IndieWeb? IndieWeb er et folkefokusert alternativ til “bedriftsnettet”. Ditt innhold er ditt Når du legger ut noe på nettet burde det tilhøre deg, ikke en bedrift. For mange bedrifter har gått ut av virksomhet og tapt alle brukernes data. Ved å bli med på IndieWeb vil innholdet ditt forbli ditt eget og under din kontroll. Du er bedre tilkoblett Dine artikler og statusmeldinger kan gå til alle tjenester, ikke bare en, noe som gjør det mulig å engasjere alle sammen. Selv svar og liker på andre tjenester kan komme tilbake til siden din så alle er på samme sted. Du er under kontroll Du kan legge ut hva du vil, i det formatet du vil, uten at noen overvåker deg. I tillegg kan du dele enkle, lesbare lenker som example.com/ideas. Disse lenkene er permanente og vil alltid virke. 🌱 Bli med på IndieWeb Kom i gang nå! Eller lær mer: Hvorfor IndieWeb? Les Denne uken på IndieWeb for ukentlige høydepunkt, eller se alle nylige bidrag Bli med i #indieweb-chatten (sanntidslogg) og bruk og bidra til prosjekter vi holder på med! 🗽 Forbi blogging og desentralisering Decentralization IndieWeb-innsatsen er forskjellig fra tidligere forsøk/samfunn: Prinsipper over prosjekt-sentralisme. Andre antar en monokultur med kun et felles prosjekt. Vi utvikler et flertall prosjekter. IndieWeb-samfunnet har en atferdskodeks. Selfdogfood i stedet for epost. Vis før fortell. Prioriter ved å klø din egen kløe, lage, repetere på din egen side. Design først, deretter protokoller og formater. Fokuser på god brukeropplevelse og selfdogfood-prototyper for å lage et minimum av nødvendige formater & protokoller. Viktigst er kanskje at vi har fokus på folk i stedet for prosjekter, og vi har jevnlige oppmøter hvor alle er velkomne. 🎡 Homebrew Website Club Homebrew Website Club 2018-11-14 SF Homebrew Website Club er et oppmøte som finner sted annenhver uke, for kreative personer som er lidenskapelige for å forbedre sin egen nettside, dele suksesses og utfordringer med likesinnede og et støttende samfunn. Kommende oppmøter 2025-03-05 19:00-20:30 Homebrew Website Club Europe/London 18:00-20:00 Homebrew Website Club - Pacific 2025-03-11 18:00-19:00 Homebrew Website Club Edinburgh: Writing Hour 2025-03-12 18:00-20:00 Homebrew Website Club - Nuremberg/Germany 19:00-20:30 Homebrew Website Club Europe/London 2025-03-19 19:00-20:30 Homebrew Website Club Europe/London 2025-03-25 18:00-19:00 Homebrew Website Club Edinburgh 🎪 IndieWebCamp IndieWeb Summit 2019 IndieWebCamp er en ukentlig samling av skapere på nett som bygger og deler sine egne nettsider for å drive det uavhengige internett framover. Vi bruker en dag på å diskutere, og en dag på å hacke og skape for å styrke oss selv og andre til våre egne identiterer og data. Hopp på og hjelp med organisering og/eller foreslå datoer og steder for mer! IndieWebCamp-planlegging! Oversettelser Du kan lese og redigere IndieWebCamp-artikler på andre språk: Català (Catalansk) Deutsch (Tysk) Español (Spansk) Français (Fransk) 한국어 (Koreansk) Se også other-languages, og how-to-start-a-new-translation-nb. Mer info Les innlegg om IndieWeb Se på videoer om IndieWeb Følg nyheter om IndieWeb Delta i kommende IndieWeb-hendelser Bli med i #indieweb-chatten og diskuter alt mulig om IndieWeb Wikiressurser Nylige endringer Last opp fil Rediger startside .skin-vector-2022 #mw-content-text { max-width: none; } .vector-feature-zebra-design-disabled #mw-content-text { margin-top: 3px; } .vector-body-before-content, .vector-page-toolbar { display: none; } .iwc-homepage__container { background-color: var(--background-color); padding: 1rem 1.5rem; margin: 0 0 1rem 0; } .iwc-homepage__container--introduction .mw-headline { color: #54595d; font-size: 1rem; } .iwc-homepage__container--introduction p { font-size: 1.1875rem; } .iwc-homepage__content { font-size: 1rem; margin: 0 auto; max-width: 50rem; } .iwc-homepage__content p, .iwc-homepage__content li { max-width: 75ch; } .iwc-homepage__content h2 { border: 0; } .iwc-homepage__content figure + h3 { margin-top: 1rem; } .iwc-homepage__content dfn { font-style: normal; } .iwc-homepage__content img { height: auto; max-width: 100%; } figure[typeof~='mw:File'].iwc-homepage__icon, figure[typeof~='mw:File/Frameless'].iwc-homepage__icon { margin: 1.25rem; margin-left: -0.25rem; } .iwc-homepage__content h2:first-of-type, .iwc-homepage__content h3:first-of-type, figure[typeof~='mw:File'].iwc-homepage__icon:first-of-type { margin-top: 0; } Retrieved from "https://indieweb.org/wiki/index.php?title=Main_Page-nb&oldid=93299" Category: Pages in Norwegian Bokmål'''
