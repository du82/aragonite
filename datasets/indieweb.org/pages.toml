title = "Main Page-it - IndieWeb"
description = "IndieWeb è il web delle persone, l'alternativa “indipendente” al “web delle corporazioni”."
full_description = '''Main Page-it PageDiscussion English ReadView sourceView history Tools Tools move to sidebar hide Actions ReadView sourceView history General What links hereRelated changesSpecial pagesPrintable versionPermanent linkPage information From IndieWeb Cosa è IndieWeb? IndieWeb è il web delle persone, l'alternativa “indipendente” al “web delle corporazioni”. I tuoi contenuti ti appartengono Quando pubblichi qualcosa sul web, questo è tuo, non è di una corporazione/impresa. Troppe imprese sono fallite e i contenuti dei loro utenti sono andati persi. Aderendo a IndieWeb, mantieni il controllo del destino dei tuoi contenuti. Tu sei connesso meglio I tuoi articoli e i tuoi messaggi di stato possono essere disponibili a tutti i servizi, non solo ad uno, permettendoti di interagire con tutti gli altri. Anche le risposte, i like, e gli altri servizi possono riferirsi al tuo sito in modo che siano tutti raggiungibili da esso. Sei tu alla guida Puoi pubblicare ogni cosa tu voglia, nei formati che preferisci, senza censure né qualcuno che ti controlli. Inoltre, tu condividi semplici link come esempio.com/idee. Questi link sono permalink e funzioneranno sempre, o almeno fino a che avrai cura a mantenerli tali. 🌱 Aderisci a IndieWeb Inizia ora! O per saperne di più: Perché IndieWeb? Leggi Questa settimana su IndieWeb per le notizie settimanali, o visita gli ultimi contributi Join #indieweb chat (registro real-time ) e Usa e contribuisci ai progetti che stiamo costruendo! 🗽 Oltre al blogging e al decentramento L'impegno di IndieWeb è diverso da quello delle altre comunità: Princìpi anziché centralizzazione. Altri assecondano una monocultura della piattaforma per tutti. Noi stiamo sviluppando un principio di pluralismo, tanti siti che cooperano, con contenuti che si integrano. In IndieWeb abbiamo il codice di condotta. Usiamoli noi stessi anziché pontificare. Prova prima di parlare. Vedi se funziona per te o se ti crea fastidi sul tuo stesso sito. Progetta prima, poi pensa ai protocolli e formati. Concentrati su una buona User Experience e "cucina tu quello che mangi": creando un prototipo con il minimo necessario di formati e protocolli. Tieni sempre presente che le persone sono al centro, non i progetti. I nostri incontri sono aperti a tutti. 🎡 Homebrew Website Club Homebrew Website Club del 14 novembre 2018 a San Francisco Homebrew Website Club è un raduno (bi)settimanale di creativi appassionati al miglioramento del propri siti web, condivisione di successi e sfide in una comunità affine e solidale. Prossimi incontri 2025-03-05 19:00-20:30 Homebrew Website Club Europe/London 18:00-20:00 Homebrew Website Club - Pacific 2025-03-11 18:00-19:00 Homebrew Website Club Edinburgh: Writing Hour 2025-03-12 18:00-20:00 Homebrew Website Club - Nuremberg/Germany 19:00-20:30 Homebrew Website Club Europe/London 2025-03-19 19:00-20:30 Homebrew Website Club Europe/London 2025-03-25 18:00-19:00 Homebrew Website Club Edinburgh 🎪 IndieWebCamp IndieWeb Summit 2019 IndieWebCamp è un raduno di due giorni di creativi web per creare e condividere i loro siti web nell'ottica del web indipendente. Impieghiamo un giorno per discutere e un giorno di hacking e creazione per migliorare noi stessi e gli altri nel possesso dei nostri dati e delle nostre identità. Altri IndieWebCamp saranno programmati! Unisciti a noi per organizzare e suggerire date, luoghi e incontri! Pianificare un IndieWebCamp! Traduzioni Puoi leggere e scrivere, correggere le pagine di IndieWebCamp nelle seguenti lingue: English (Inglese) Català (Catalano) Deutsch (Tedesco) Español (Spagnolo) Français (Frencese) 한국어 (Coreano) 中文 (Cinese) Italiano (Italiano) Vedi anche altre lingue, e come iniziare una nuova traduzione. Maggiori informazioni Leggi i post sul IndieWeb Guarda i video su IndieWeb Segui le news su IndieWeb Partecipa ai prossimi eventi IndieWeb Vieni a discutere in #indieweb chat ogni cosa sul web indipendente su IndieWeb Risorse Wiki Ultime modifiche File upload Modifica 