full_description = '''Toggle the table of contents Toggle the table of contents Planning PageDiscussion English ReadView sourceView history Tools Tools move to sidebar hide Actions ReadView sourceView history General What links hereRelated changesSpecial pagesPrintable versionPermanent linkPage information From IndieWeb Welcome to the planning page for future IndieWebCamps! The IndieWebCamp community is planning numerous upcoming events, including future IndieWebCamps, regular Homebrew Website Club meetups, Popups, talks, and other proposals — if you'd like to help, please contribute to this page. See individual IndieWebCamp home pages (typically /Year/City ) for specific camp planning. Related: IndieWebCamp Organizing to learn what it takes to plan and organize an IndieWebCamp? Pop-ups to see or propose more Popup sessions for 2025 Planned There are no currently tickets-open in-person IndieWebCamps. Stay tuned! Also check out the upcoming online IndieWebCamp pop-ups and RSVP! https://events.indieweb.org/tag/popup Save Dates The following IndieWebCamps have a confirmed date and venue, start planning travel! Tickets opening up soon! ... One Preferred Or Workable Date The following IndieWebCamp(s) being planned have only one preferred or workable date, as proposed. Save the dates in your calendar. We cannot confirm these dates at this time though, so wait on booking any travel! 2025-05-03…04 IndieWebCamp Düsseldorf 2025 the Saturday & Sunday immediately before btconf Düsseldorf 2025 2025-11-08…09 IndieWebCamp Berlin 2025 the Saturday & Sunday immediately after btconf Berlin 2025 ... 2025 Let's plan 2025 IndieWebCamps! The IndieWebCamps in following subsections are currently being planned and need help figuring out a date - help co-organize! We had a few in-person IndieWebCamps in 2021-2024, most of them Germany and one in San Diego, so let’s continue planning those, and we should try to plan an in-person IndieWeb Summit 2025, keeping in mind vaccinations, and regional Covid case rates. See IndieWebCamp Organizing: COVID precautions for more. Let’s also continue planning online IndieWebCamps and single topic pop-ups, perhaps focused on particular timezones. If you're interested in hosting an online camp or pop-up, go to Pop-up Planning page and write a stub for your event, or ask for help in the IndieWeb chat. Locking in dates as far in advance as possible helps encourage the most attendance, especially farther away from venues/cities. General planning date notes: November first half is the likely last chance to plan an IndieWebCamp for the year. December is tough due to holidays and lots of other events Exceptions: first or second weekend are possible like: 2015/SF, 2019/SF, 2023/SD & 2024/SD. 2025 Holidays to keep in mind while planning 2025-01-01 New Year's Day 2025-02-14 Valentine's Day (Monday) 2025-02-17 US President's Day 2025-04-20 Easter 2025-05-05…06 btconf Düsseldorf 2025-05-25 US Memorial Day 2025-06-19 Juneteenth 2025-06-28…29 Pride (SF, Seattle) 2025-07-04 US Fourth of July (Thursday) 2025-09-01 US Labor Day 2025-09-22 Rosh Hashanah 2025-10-01…02 Yom Kippur 2025-10-31 Halloween 2025-11-06…07 btconf Berlin 2025-11-27 US Thanksgiving 2025-11-28 US Black Friday 2025-12-24 Christmas Eve 2025-12-25 Christmas Day 2025-12-31 New Years Eve ... insert others in date order 2025 events to plan adjacent to or avoid colliding with: April Dr. Matt Lee's planning an event in April/May that IWC would be a part of, so #Cambridge_MA 7-8: W3C AC meeting, Sophia Antipolis, France (followed by AB meeting 9-10th April) May 5-6: btconf #Düsseldorf ... November 6-7 btconf #Berlin 10-14 W3C TPAC, Kobe, Japan December possibly #San_Diego Keeping that in mind: If you live in one of the cities / states / countries below and are interested, add your name! If you know of a suitable venue for hosting, add that as a possibility. If you have a particular month of the year to recommend, add that! Please offer your opinion/preference with a nested list item and +1/0/-1 signed! IndieWebCamps below are listed in order roughly by how "real" they appear for a specific city based on a few fuzzy criteria in rough order: likely/confirmed co-organizers (especially local to the city co-organizers) 2+ required, preferably 3-4 total at least one (preferably 2) that is (are) regularly active in chat (IRC/Slack) preferably at least 1 experienced organizer of a past successful IndieWebCamp likely/confirmed venue likely/confirmed dates candidate dates (adjacent to an existing event folks would go to) interest level of folks in those candidate dates Other 2025 Events 2025-04-04 Proposal: a "404" day to recognize missing pages/sites on 4/4. Previously: 2018-04-04 HWC, and 2013 proposal 2025-04-10 Proposal: a "410" day to recognize deleted pages/sites on 4/10. Previously: 2018-04-10 HWC 2025-04-18 Proposal: a "418" day to have tea & scones. Previously: 2018-04-18 HWC Cambridge MA Previous event: 2016/MIT2 Venue: anyone have a connection to Microsoft NERD research campus? other options? let's try to avoid re-using MIT, plus W3C has moved out of MIT so we no longer have that connection Dr. Matt Lee is looking at venues Can help co-organize: Dr. Matt Lee — local to the city ... ping @mattl on #indieweb-events chat! Interested in participating! Tantek Çelik Ben Roberts Chris Aldrich David Shanske Patrick M. Niedzielski cwebber (via #social IRC 2017-09-26) 🌮 Taco 🌮 Dave 🌮 capjamesg Add yourself here… (see this for more details) Possible/preferred months: April/May 2025 Possible dates? 2025-??-??…?? Add yourself here… (see this for more details) 2025-??-??…?? Add yourself here… (see this for more details) Edinburgh IndieWebCamp Edinburgh! Previous event: 2015/Edinburgh Venue: TBD Ideas for venue: Edinburgh Futures Institute (part of the University of Edinburgh), or any other UoE campus CodeBase ... Confirmed organizers and facilitators: capjamesg - local-to-the-city! venue, ticketing, etc. Francesco (https://fran.fi) Add yourself here