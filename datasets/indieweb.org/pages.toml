title = "Category:building-blocks - IndieWeb"
full_description = '''Toggle the table of contents Toggle the table of contents Category:building-blocks CategoryDiscussion English ReadView sourceView history Tools Tools move to sidebar hide Actions ReadView sourceView history General What links hereRelated changesSpecial pagesPrintable versionPermanent linkPage information Help From IndieWeb 🧱🔩 Building blocks are key design-patterns, technologies, and methods for building and improving your independent website. See also: User actions and building blocks, a diagram of common IndieWeb actions and which building blocks are used for each. IndieMark, a way of measuring "how indieweb" is your website, and a good step-by-step guide to what feature(s) you should consider implementing next. Why Why building blocks? This early quote from Tim Berners-Lee's Weaving The Web Chapter 4 page 39 summed it up well: ... if I had insisted everyone use HTTP, this would also have been against the principle of minimal constraint. If the Web were to be universal, it should be as unconstraining as possible. Unlike the NeXT computer, the Web would come as a set of ideas that could be adopted individually in combination with existing or future parts. As was the Web, so is the IndieWeb. The IndieWeb also comes as a set of (additional) ideas (as building blocks), that can be "adopted individually in combination with existing or future parts". From a systems perspective, designing a modular system is harder than designing a monolithic system; however over time a modular system has a much better chance of evolving and adapting to changing needs and a diversity of uses. It is for these reasons that the IndieWeb is built with a set of building blocks, instead of a monolithic "stack". Identity The act of having a personal website immediately creates an online identity which can be better established with: microformats h-card for homepage and icon rel-me for identity-elsewhere and RelMeAuth sign-in Posts Posts and variants are perhaps the building block of an indieweb site: posts marked up with h-feed, h-entry, and h-card notes articles posts-elsewhere comments Stuff in/of posts: hashtags permalinks authorship person-tag Citability in addition to permalinks, the following building blocks help with citing posts in constrained destinations such as limited character count POSSE destinations, or print: permashortlinks permashortcitations Syndication syndication, the ability to post content on your own site and push it out to 3rd party silos. h-entry POSSE original-post-discovery Reverse Syndication Reverse syndication (AKA backfeed) refers to pulling silo activity around your syndicated posts (e.g. silo likes, reposts or replies) back to your personal site. Mentions The ability for one webpage to let another know the first has linked to the second is a vital indieweb building block. The key mention technology for the indieweb is: webmention Login The ability to use your online identity (domain) to authenticate yourself on the web. Technologies: web-sign-in indieauth Web Actions A web action is the interface and user experience of taking a specific discrete action, across the web, from one site to another site or application. webactions Link Preview A link preview is what posts show about one or more embedded links, e.g. a headline, image, summary from the link destination. Link Preview Reply Context A reply context similar to a link preview, except is the information that a reply post shows about the original post that it is in reply to. E.g. original post author (name, photo, link), original post content (or abbreviated summary). reply-context Tests SWAT0 originally from the 2010 Federated Social Web Summit. Historical See building-blocks-historical. See also microformats Subcategories This category has the following 2 subcategories, out of 2 total. D domain-name-registrars‎ (5 P)M microformats‎ (25 P) Pages in category "building-blocks" The following 40 pages are in this category, out of 40 total. 2 2017/building-blocksA authorship authorship-specB building block Building block icons building blocks building-block building-blocksC cross-postingE elsewhere events/2023-10-25-hwc-pacific events/2024-03-13-hwc-pacificH h-card hashtagsI identity-elsewhere IndieAuth indieauth-for-loginL link-previewM microformats Micropub MicrosubP permalink person-tag personal-domain PESOS pingback-fr pipes POSSE POSSE-ko posts posts-elsewhereR rel-meS storageT to-do toolsV User:Vanderven.se martijn/IndieAuthW web hosting webactions Webmention WebSub Retrieved from "https://indieweb.org/wiki/index.php?title=Category:building-blocks&oldid=90231"'''
