title = "IndieWeb Carnival - IndieWeb"
description = "IndieWeb carnival is a blog carnival on topics related to the IndieWeb specifically."
full_description = '''Toggle the table of contents Toggle the table of contents IndieWeb Carnival PageDiscussion English ReadView sourceView history Tools Tools move to sidebar hide Actions ReadView sourceView history General What links hereRelated changesSpecial pagesPrintable versionPermanent linkPage information From IndieWeb IndieWeb carnival is a blog carnival on topics related to the IndieWeb specifically. Why An IndieWeb carnival will help motivate people to post more on their personal websites and provide inspiration for writing. See also: why post How to Each month, the carnival has a different host. At the beginning of the month, the host comes up with the topic, and posts it both on their website and here. Then, other people post their submissions and alert the host about them. At the end of the month, the host collects all the received submissions and posts an overview of it. Hosting The whole process is open to change, so any suggestions welcome. Any person having their own website is eligible to become a host. You can be the host just once or you can repeat multiple times. If you want to volunteer as the future host, please add your name to the below list of future hosts. One does not need to decide on the topic until posting the call for submission. If you changed your mind and you do not want to host, simply remove yourself from the list. That way some other people can volunteer for that month. As long as the months did not yet start or is about to start in less than a week, there is nothing else needed done. If you are in that time frame, then please contact the person who started this carnival ( Sara Jakša - email: sarajaksa@sarajaksa.eu ) to arrange for the replacement. If the month you are assigned started and you did not post a call of submission before or in a first couple of days of the month, your spot will be taken by one of the pitch-hitters hosts. The List of Future Hosts 2025 Month Host Theme February Joe Crawford "Affirmations" March Pablo Morales Self-expression April Jamie Thingelstad TBD May Chris Shaw "Small Web Communities" June Nick Simson personal style July Maxwell Joslyn TBD August Marisabel Colors September Abdujabbar Bozdar TBD October hacknorris gathering knowledge November Alex Sirac cycles and fluctuations December V.H. Belvadi ‘Where do you see the IndieWeb in 2030?’ 2026 Month Host Theme January February March capjamesg Topic to be determined April May Juhis TBD June July Joe Crawford Masks, Identities & Cosplay August September October November December Pinch-Hitter Hosts If you want to be the host, but you do not want to commit to it for the specific month, you can also add yourself to the pitch-hitters list. They are the hosts, that pitch in case any of the hosts for the month drops for any reason or if there is a month without a host. In this case, we will try to find the host from the lower list first. By putting yourself on the bellow list, you only indicate, that you are willing to be asked to host on the short-term notice. It does not mean that you need to accept it at that time. Al Abut alexsirac.com foreverliketh.is jo Sara Jakša zacharykai capjamesg List Of Past IndieWeb Carnivals & Hosts 2025 Month Host Theme Round-up(s) January V.H. Belvadi On the importance of friction Roundup Post February Joe Crawford "Affirmations" 2024 Month Host Theme Round-up(s) January foreverliketh.is Positive Internalization Roundup Post February Manuel Moreale Digital Relationships Roundup Post March orchids (basement community) Accessibility in the Small Web Roundup Post April Aaron Leonard Good Enough Roundup Post May Juhis Creative environments Roundup Post June Andrei DIY — Something from (Almost) Nothing Roundup Post July capjamesg Tools August Steve Ledlow rituals Roundup Post September Matthew Graybosch "Power Underneath Despair" (Suicide Prevention Month) "Last Call" Roundup Post October ZinRicky multilingualism in a global Web Roundup Post November Alexandra Impact December Zinzy Waleson belief Roundup Post 2023 Month Host Theme Round-up(s) June Sara Jakša IndieWeb and cooking Roundup Post by Sara Roundup post by Jeremy July capjamesg Moments of Joy Roundup Post August Mark Sutherland Gardening Roundup post by Joe September Jeremy Cherfas My Kind of Weather Roundup Post October Pablo Morales Self-care and Routine. Roundup Post November Alex Sirac Community and Belonging December jo personal holiday / December traditions Roundup Post Current rules (can be changed in the future) Default rules for the host The carnival happens every month that has the host. At the beginning of the month, the host posts about their topic on the blog. The host then collects the submissions until the end of the month. After that, the host posts the summary of all the submissions with the links and sends them to the next month's host post. Any rules beside the upper paragraph are at the host discretion. In case the host does not provide any additional rules, you can use the below ones as the default ones. The minimal qualifier for what every host would be accepting is that the blog posts are in English. The host can specify a broader range of submissions that they are willing to accept (like different media, formats or languages). The main way of people submitting the post are webmentions. If your site does not support the webmentions, then the main way of submitting is the email. A host can also specify a different way to accept the submissions. Default rules for the participants Any rules the host has specified for their carnival take precedence. Otherwise, the rules defined below stand. Once you see the topic, post something connected to the topic suggested on your blog. The blog post should be written in the month the carnival is taking place - so between the posting of the topic and the last day of the month. Then, submit your submission to the host of this month. Since this is an IndieWeb community, the main way of people submitting the post are webmentions. If the host site does not support the webmentions, then send them an email with the link. The minimal qualifier for what every host will be accepting is blog posts in English language. History Started as based on the discussion in the 2023-06-14 Homebrew Website Club London/Europe. Inspired by this carnival 32BITMAS (Dec '23 & Jan '24) Lainchan Web Festival (Feb—Mar '24) IndieWeb Movie Club Links Some helpful advice for hosting the carnivals for one of the other blogging carnivals in the wild Advice for Hosting the Carnival See Also IndieWeb Movie Club 100 days gift calendar Retrieved from "https://indieweb.org/wiki/index.php?title=IndieWeb_Carnival&oldid=100248"'''
year_published = 2025
clearnet = "https://indieweb.org/IndieWeb_Carnival"
