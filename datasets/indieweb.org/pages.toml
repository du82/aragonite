title = "Main Page-ja - IndieWeb"
description = "IndieWeb キャンプは、ウェブの独立を推進するクリエーターたちが2日間集う催しです。1日は分科会、もう1日は個人サイトをハック・作成・改善し、自身を鍛え互いを刺激し合います。"
full_description = '''Main Page-ja PageDiscussion English ReadView sourceView history Tools Tools move to sidebar hide Actions ReadView sourceView history General What links hereRelated changesSpecial pagesPrintable versionPermanent linkPage information From IndieWeb IndieWeb（インディーウェブ）とは？ IndieWeb は、“企業ウェブ”に対する、個々人のためのウェブです。 わたしたちは独立した個人ウェブサイトのコミュニティーであり、次の原則を掲げています。すなわち、自分のドメインを基本のオンライン・アイデンティティーとして用いること。そして、コンテンツをまず自分のサイトで公開し（オプションで他サイトにも展開可）、自身の所有物とすること。 あなたのコンテンツはあなたのもの ウェブに何かを公開するとき、それは企業ではなくあなたのものであるべきです。企業サイトの閉鎖とともに、かつて多くのユーザーコンテンツが失われてきました。IndieWeb に倣うことで、あなたのコンテンツはあなた自身のものとなり、すべてをあなたが管理できます。 あなたがコントロールする 好きなコンテンツを好きなかたちで、誰にも見張られずに公開できます。コンテンツのパーマリンクは任意で、文字どおり永続的に維持できます。 より良くつながる（オプション） あなたのポストや状態を、あらゆるプラットフォームへ配信できます。各プラットフォームでの返信や「いいね」は、すべてあなたのサイトに返ってきます。 🌱 IndieWeb に加わろう 今すぐ始める🎉 IndieWeb をもっと理解する。🗽原則と🌈行動規範もお読みください #indieweb チャットに参加して、ウェブサイトを共有したり、インスピレーションを得たり、IndieWeb に関するサービスやプロジェクトを訊いたりする This Week in the IndieWeb で毎週の主な出来事を知る 🎡 ホームブリューウェブサイトクラブ ホームブリューウェブサイトクラブ、2018年11月14日サンフランシスコにて ホームブリュー（自家製）ウェブサイトクラブは、自身のウェブサイトの改善に情熱を燃やすクリエーターたちが定期的に集う場であり、成功や課題を共有し助け合うコミュニティーです。 今後の交流会 2025-03-05 19:00-20:30 Homebrew Website Club Europe/London 18:00-20:00 Homebrew Website Club - Pacific 2025-03-11 18:00-19:00 Homebrew Website Club Edinburgh: Writing Hour 2025-03-12 18:00-20:00 Homebrew Website Club - Nuremberg/Germany 19:00-20:30 Homebrew Website Club Europe/London 2025-03-19 19:00-20:30 Homebrew Website Club Europe/London 2025-03-25 18:00-19:00 Homebrew Website Club Edinburgh 🎪 IndieWeb キャンプ IndieWebサミット2019 IndieWeb キャンプは、ウェブの独立を推進するクリエーターたちが2日間集う催しです。1日は分科会、もう1日は個人サイトをハック・作成・改善し、自身を鍛え互いを刺激し合います。 今後の IndieWeb キャンプ 2024-11-09…10 IndieWebCamp Berlin … 下記も読み、開催を手伝ったり、日程や場所を提案したりしましょう。 IndieWeb キャンプの予定 IndieWeb キャンプの企画に貢献しよう！ ⛺️ IndieWeb ポップアップ IndieWeb ポップアップは、特定の話題に関するオンラインイベントで、IndieWeb キャンプでの長時間の対話セッションに似ています。 今後のポップアップ 2025-03-11 18:00-19:30 Front End Study Hall #023 さらに多くのポップアップが予定されています。飛び入り参加も大歓迎！ 司会を務めたり、日程を提案したり、話題を提供したりしましょう。 📝 ブログカーニバル わたしたちが毎月催すブログカーニバルにあなたのサイトで参加できます！ お題のテーマや映画についてブログを書きましょう。 IndieWeb Carnival IndieWeb Movie Club 翻訳 IndieWeb の記事を、別の言語で読んだり編集したりできます。 Català（カタロニア語） Deutsch（ドイツ語） English（英語） Español（スペイン語） Français（フランス語） Italiano（イタリア語） 한국어（韓国語） Norsk bokmål（ノルウェー語） Portuguese（ポルトガル語） Русский（ロシア語） Türkçe（トルコ語） 中文（中国語） その他の言語、新たに翻訳を始める方法もお読みください。 さらなる情報 IndieWeb に関する投稿を読む IndieWeb に関するビデオを見る IndieWeb に関するニュースをフォローする 今週の IndieWebニュースレターを購読する 今後の IndieWeb イベントに参加する #indieweb チャットで議論する Wiki リソース 最近の更新 ファイルをアップロード 編集 ログイン .skin-vector-2022 #mw-content-text { max-width: none; } .vector-feature-zebra-design-disabled #mw-content-text { margin-top: 3px; } .vector-body-before-content, .vector-page-toolbar { display: none; } .iwc-homepage__container { background-color: var(--background-color); padding: 1rem 1.5rem; margin: 0 0 1rem 0; } .iwc-homepage__container--introduction .mw-headline { color: #54595d; font-size: 1rem; } .iwc-homepage__container--introduction p { font-size: 1.1875rem; } .iwc-homepage__content { font-size: 1rem; margin: 0 auto; max-width: 50rem; } .iwc-homepage__content p, .iwc-homepage__content li { max-width: 75ch; } .iwc-homepage__content h2 { border: 0; } .iwc-homepage__content figure + h3 { margin-top: 1rem; } .iwc-homepage__content dfn { font-style: normal; } .iwc-homepage__content img { height: auto; max-width: 100%; } figure[typeof~='mw:File'].iwc-homepage__icon, figure[typeof~='mw:File/Frameless'].iwc-homepage__icon { margin: 1.25rem; margin-left: -0.25rem; } .iwc-homepage__content h2:first-of-type, .iwc-homepage__content h3:first-of-type, figure[typeof~='mw:File'].iwc-homepage__icon:first-of-type { margin-top: 0; } Retrieved from "https://indieweb.org/wiki/index.php?title=Main_Page-ja&oldid=100144" Category: Pages in Japanese'''
