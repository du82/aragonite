["https://indieweb.org/Main_Page-de"]
title = "Main Page-de - IndieWeb"
description = "Das IndieWeb ist eine menschenorientierte Alternative zum “geschäftlichen Web”."
full_description = '''Main Page-de PageDiscussion English ReadView sourceView history Tools Tools move to sidebar hide Actions ReadView sourceView history General What links hereRelated changesSpecial pagesPrintable versionPermanent linkPage information From IndieWeb Was ist das IndieWeb? Das IndieWeb ist eine menschenorientierte Alternative zum “geschäftlichen Web”. Es ist eine Gemeinschaft von unabhängigen und persönlichen Webseiten, welche durch offene Standards verbunden sind und auf den folgenden Prinzipien beruhen: eine eigene Domain zu besitzen und sie als die primäre Onlineidentität zu verwenden, zuerst auf der eigenen Seite zu veröffentlichen (und optional anderswo) und die eigenen Inhalte zu besitzen. Deine Inhalte gehören dir Wenn Du etwas im Web postest, sollten deine Daten Dir gehören und keiner Firma. Zu viele Unternehmen gaben das Geschäft auf und verloren alle Daten ihrer Nutzer. Indem Du dem IndieWeb beitrittst, behältst Du die Kontrolle über Deine Daten. Du bist besser vernetzt Deine Artikel und Statusmeldungen können auf beliebige Plattformen verteilt werden, anstatt nur auf eine, somit kannst Du mit jedem interagieren. Kommentare und Likes von anderen Diensten können an Deine Seite zurückgeleitet werden, so dass sie zusammen an einem Ort sind. Du hast die Kontrolle Du kannst posten, was Du möchtest, in jedem Format, das Dir beliebt, ohne überwacht zu werden. Außerdem kannst Du einfach lesbare Links wie beispiel.de/ideen teilen. Diese Links sind beständig und werden immer funktionieren. 🌱 Tritt dem IndieWeb bei Leg jetzt los! Oder erfahre mehr: Wieso IndieWeb? Nimm am #indieweb chat teil (Echtzeit-Log) um Deine Webseite zu teilen, inspiriert zu werden oder Fragen zu Diensten und Projekten zu stellen, mit denen Du Deine IndieWeb-Seite erstellen kannst! Lies This Week in the IndieWeb für die wöchentlichen Höhepunkte 🗽 Mehr als Bloggen und Dezentralisierung Das Bestreben des IndieWebs unterscheidet sich von früheren Bemühungen und Communitys: Prinzipien gehen über Projektzentralisierung. Während Andere von einer Monokultur von einem Projekt für alle ausgehen, entwickeln wir eine Vielfalt von Projekten. Die IndieWeb-Gemeinschaft hat einen Verhaltenskodex. Veröffentliche auf Deiner eigenen Seite. Zeige, anstatt nur zu erzählen. Mache das, was Du brauchst, entwickle und verfeinere Deine Ideen auf Deiner Webseite. Das Design kommt zuerst, dann folgen Protokolle und Formate. Konzentriere Dich darauf, eine gute User Experience zu entwickeln, und verwende Deine eigenen Prototyp-Funktionen um Dich auf die minimal notwendigsten Formate und Protokolle zu beschränken. Das wahrscheinlich Wesentlichste ist, dass wir personenorientiert statt projektorientiert sind. Wir haben reguläre Treffen. Jede/r ist willkommen. Du brauchst keine Webseite um beizutreten, solltest aber an persönlichen Webseiten interessiert sein. 🎡 Homebrew Website Club Homebrew Website Club 2018-11-14 SF Der Homebrew Website Club ist ein reguläres Treffen von kreativen Menschen mit einer Passion für das verbessern ihrer Webseiten und dem Teilen ihrer Erfolge und Probleme mit einer gleichgesinnten und hilfsbereiten Gruppe. Anstehende Treffen 2025-03-05 19:00-20:30 Homebrew Website Club Europe/London 18:00-20:00 Homebrew Website Club - Pacific 2025-03-11 18:00-19:00 Homebrew Website Club Edinburgh: Writing Hour 2025-03-12 18:00-20:00 Homebrew Website Club - Nuremberg/Germany 19:00-20:30 Homebrew Website Club Europe/London 2025-03-19 19:00-20:30 Homebrew Website Club Europe/London 2025-03-25 18:00-19:00 Homebrew Website Club Edinburgh 🎪 IndieWebCamp IndieWeb Summit 2019 IndieWebCamp ist eine zweitägige Versammlung von Web-Gestaltern, die gemeinsam das unabhängige Web vorantreiben. Ein Tag für die Breakout-Session und ein Tag zum Hacken, Kreieren und Verbessern unserer persönlichen Seiten; um uns gegenseitig zu bestärken und inspirieren. Anstehende IndieWebCamps 2024-11-09…10 IndieWebCamp Berlin ... ... Siehe mehr, hilf beim Organisieren, schlage Daten und Orte vor oder melde Dich freiwillig: Future IndieWebCamps Contribute to IndieWebCamp Planning! ⛺️ IndieWeb Pop-Ups Pop-Ups sind Online-Events zu einem bestimmten Thema, die einer längeren Diskussion bei einem persönlichen IndieWebCamp ähneln. Anstehende Pop-Ups 2025-03-11 18:00-19:30 Front End Study Hall #023 Mehr Pop-Ups sind in Planung. Steige ein, hilf beim Ermöglichen und schlage Daten oder Themen vor. Übersetzungen Du kannst IndieWeb Artikel in anderen Sprachen lesen und bearbeiten: Català (Katalanisch) Español (Spanisch) Français (Französisch) 한국어 (Koreanisch) Norsk bokmål (Bokmål) Türkçe (Türkisch) 中文 (Chinesisch) Italiano (Italienisch) Portuguese (Brasilianisches Portugiesisch) Русский (Russisch) Siehe auchandere Sprachen, und Wie man eine neue Übersetzung startet. Mehr Information Lies Posts über das IndieWeb Schaue Videos zum IndieWeb Folge Neuigkeiten über das IndieWeb Abonniere den This Week in the IndieWeb Newsletter Nimm an Anstehenden IndieWeb Events teil Tritt dem #indieweb chat bei und besprich alle Dinge, die mit dem IndieWeb zu tun haben Wiki Ressourcen Kürzliche Änderungen Datei hochladen Homepage bearbeiten Einloggen .skin-vector-2022 #mw-content-text { max-width: none; } .vector-feature-zebra-design-disabled #mw-content-text { margin-top: 3px; } .vector-body-before-content, .vector-page-toolbar { display: none; } .iwc-homepage__container { background-color: var(--background-color); padding: 1rem 1.5rem; margin: 0 0 1rem 0; } .iwc-homepage__container--introduction .mw-headline { color: #54595d; font-size: 1rem; } .iwc-homepage__container--introduction p { font-size: 1.1875rem; } .iwc-homepage__content { font-size: 1rem; margin: 0 auto; max-width: 50rem; } .iwc-homepage__content p, .iwc-homepage__content li { max-width: 75ch; } .iwc-homepage__content h2 { border: 0; } .iwc-homepage__content figure + h3 { margin-top: 1rem; } .iwc-homepage__content dfn { font-style: normal; } .iwc-homepage__content img { height: auto; max-width: 100%; } figure[typeof~='mw:File'].iwc-homepage__icon, figure[typeof~='mw:File/Frameless'].iwc-homepage__icon { margin: 1.25rem; margin-left: -0.25rem; } .iwc-homepage__content h2:first-of-type, .iwc-homepage__content h3:first-of-type, figure[typeof~='mw:File'].iwc-homepage__icon:first-of-type { margin-top: 0; } Retrieved from "https://indieweb.org/wiki/index.php?title=Main_Page-de&oldid=96345" Category: Pages in German'''
