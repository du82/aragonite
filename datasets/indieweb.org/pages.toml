title = "Main Page-zh - IndieWeb"
description = "作为“基于企业的商业网站”的替代品IndieWeb是以人为本的网站。"
full_description = '''Main Page-zh PageDiscussion English ReadView sourceView history Tools Tools move to sidebar hide Actions ReadView sourceView history General What links hereRelated changesSpecial pagesPrintable versionPermanent linkPage information From IndieWeb 什么是IndieWeb? 作为“基于企业的商业网站”的替代品IndieWeb是以人为本的网站。 IndieWeb是一个由个人网站组成的社区。这个社区由一系列简单的标准互联，并建设在拥有自己的域名、使用域名作为主要身份辨识手段、在自己的站点上发布内容（也可同步到其他服务上）、掌控自己的数据等原则上。 你的创作属于你自己 你在网上发布的内容应当属于你，而非某个企业。有太多的用户数据在公司停止运营的同时被丢失。通过加入IndieWeb，你的创作内容将属于你，且由你掌控。 你与世界相连变得更加简单 你的文章和状态更新可以被散布到任何服务上，而不用受到某一平台的限制，这使你能够和所有人进行互动。而其他平台上的回复与点赞也可以回流到你的站点上。 你能够控制一切 你可以用任意格式发表你想发表的一切东西，不用受他人监控。除此之外，你可以用像example.com/ideas这样简短易读的永久链接分享内容，而不必担心链接会失效 🌱 加入IndieWeb 现在就开始！或进一步了解：为何加入IndieWeb? 阅读This Week in the IndieWeb来获取每周亮点，或查看所有近期贡献 加入#indieweb聊天室（实时日志）并使用或贡献力量来改进我们的项目！ 🗽 超越博客和去中心化 IndieWeb运动不同与过去的类似尝试/社区： 以原则而非具体项目为中心。不同与某个项目一家独大试图满足所有人的需求的常态，我们同时推进多个项目的开发。IndieWeb社区有自己的行为准则。 自己动手，丰衣足食。在说之前先展示。以满足自己的需要为优先，把自己的站点作为创作的试验场。 将设计摆在具体协议或格式之前。先实现你所喜欢的交互界面的原型，然后再考虑实现所需的最简格式和协议。 也许最重要的是，我们关注个人而非项目。我们有定期的聚会，并欢迎任何人参与。 🎡 Homebrew Website Club Homebrew Website Club 2018-11-14 SF Homebrew Website Club是热衷于改进自己网站的创作者们的聚会。这里大家与志趣相投、互相支持的社区同伴们分享所遇到的成功和挑战。 即将到来的Homebrew Website Club聚会 2025-03-05 19:00-20:30 Homebrew Website Club Europe/London 18:00-20:00 Homebrew Website Club - Pacific 2025-03-11 18:00-19:00 Homebrew Website Club Edinburgh: Writing Hour 2025-03-12 18:00-20:00 Homebrew Website Club - Nuremberg/Germany 19:00-20:30 Homebrew Website Club Europe/London 2025-03-19 19:00-20:30 Homebrew Website Club Europe/London 2025-03-25 18:00-19:00 Homebrew Website Club Edinburgh 🎪 IndieWebCamp IndieWeb Summit 2019 IndieWebCamp是网上创作者们通过分享他们的网站来推进独立网站的周末小聚。我们通过一天的讨论和一天的创造来鼓励所有人取回自己的在线身份和数据。 更多的IndieWebCamp在筹备中！ 一起来帮助组织聚会或提议聚会地点和日期吧！ 组织IndieWebCamp！ 翻译 你可以用其他语言来阅读或编辑IndieWebCamp的文章： English (英语) Català (加泰兰语) Deutsch (德语) Español (西班牙语) Français (法语) 한국어 (韩语) Türkçe (土耳其语) Italiano (意大利语) Portuguese (葡萄牙语) 参见其他语言和如何开始新的翻译。 更多信息 阅读关于IndieWeb的日志 观看关于IndieWeb的视频 关注IndieWeb新闻 参加即将到来的IndieWeb活动 加入#indieweb聊天室来讨论关于IndieWeb的任何事情 维基资源 最近改动 上传文件 编辑主页 .skin-vector-2022 #mw-content-text { max-width: none; } .vector-feature-zebra-design-disabled #mw-content-text { margin-top: 3px; } .vector-body-before-content, .vector-page-toolbar { display: none; } .iwc-homepage__container { background-color: var(--background-color); padding: 1rem 1.5rem; margin: 0 0 1rem 0; } .iwc-homepage__container--introduction .mw-headline { color: #54595d; font-size: 1rem; } .iwc-homepage__container--introduction p { font-size: 1.1875rem; } .iwc-homepage__content { font-size: 1rem; margin: 0 auto; max-width: 50rem; } .iwc-homepage__content p, .iwc-homepage__content li { max-width: 75ch; } .iwc-homepage__content h2 { border: 0; } .iwc-homepage__content figure + h3 { margin-top: 1rem; } .iwc-homepage__content dfn { font-style: normal; } .iwc-homepage__content img { height: auto; max-width: 100%; } figure[typeof~='mw:File'].iwc-homepage__icon, figure[typeof~='mw:File/Frameless'].iwc-homepage__icon { margin: 1.25rem; margin-left: -0.25rem; } .iwc-homepage__content h2:first-of-type, .iwc-homepage__content h3:first-of-type, figure[typeof~='mw:File'].iwc-homepage__icon:first-of-type { margin-top: 0; } Retrieved from "https://indieweb.org/wiki/index.php?title=Main_Page-zh&oldid=93291" Category: Pages in Chinese'''
