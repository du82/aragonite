title = "Main Page-fr - IndieWeb"
description = "L'IndieWeb est une alternative au 'web corporate' axée sur les personnes."
full_description = '''Main Page-fr PageDiscussion English ReadView sourceView history Tools Tools move to sidebar hide Actions ReadView sourceView history General What links hereRelated changesSpecial pagesPrintable versionPermanent linkPage information From IndieWeb Qu'est-ce que l'IndieWeb ? L'IndieWeb est une alternative au 'web corporate' axée sur les personnes. Votre contenu est à vous Lorsque vous publiez quelque chose sur le web, cela devrait vous appartenir, à vous et non à une société. Beaucoup trop d'entreprises ont fait faillite et perdu toutes les données de leurs utilisateurices. En rejoignant l'IndieWeb, votre contenu reste à vous et sous votre contrôle. Vous êtes mieux connecté⋅e Vos articles et messages de statut peuvent aller sur tous les services, pas seulement un, vous permettant de vous engager avec tout le monde. Même les réponses et les likes sur d'autres services peuvent revenir sur votre site de sorte qu'ils se retrouvent tous dans un seul endroit. Vous avez le contrôle Vous pouvez poster tout ce que vous voulez, dans le format que vous voulez, sans que personne ne vous surveille. En outre, vous partagez des liens lisibles tels que exemple.com/idees. Ces liens sont permanents et fonctionneront toujours. 🌱 Rejoignez l'IndieWeb Démarrez dès maintenant! Ou apprenez-en plus : Pourquoi l'Indieweb ? Suivez les discussions en cours et les modifications récentes sur ce site pour voir les travaux récents. Utilisez et contribuez aux projets que nous construisons et rejoignez la discussion. 🗽 Au-delà du Blogging et de la Décentralisation L'initiative IndieWeb est différente des précédents projets : Des principes plutôt qu'un focus sur des projets spécifiques. Certains projets imposent une monoculture ; nous développons une pluralité de projets. La communauté IndieWeb a une charte de conduite. Le selfdogfood à la place de l'email. Montrez ce que vous faites avant d'en parler. Commencez par vous chercher des poux à vous-mêmes en créant et en itérant sur votre propre site. Le design d'abord, les protocoles & formats ensuite. Concentrez-vous une bonne expérience utilisateurice et selfdogfoodez vos prototypes pour implémenter les formats & protocoles nécessaires. Peut-être plus important : nous centré⋅e⋅s sur les gens, pas sur les projets, et nous avons des rencontres régulières où chacun⋅e est bienvenu⋅e. 🎡 Homebrew Website Club Homebrew Website Club 2018-11-14 SF Homebrew Website Club est une rencontre (bi)hebdomadaire de créatifs passionnés par l'amélioration de leurs propres sites Web, partageant leurs réussites et leurs défis avec une communauté partageant les mêmes idées et solidaires. Rencontres à venir 2025-03-05 19:00-20:30 Homebrew Website Club Europe/London 18:00-20:00 Homebrew Website Club - Pacific 2025-03-11 18:00-19:00 Homebrew Website Club Edinburgh: Writing Hour 2025-03-12 18:00-20:00 Homebrew Website Club - Nuremberg/Germany 19:00-20:30 Homebrew Website Club Europe/London 2025-03-19 19:00-20:30 Homebrew Website Club Europe/London 2025-03-25 18:00-19:00 Homebrew Website Club Edinburgh 🎪 IndieWebCamp IndieWeb Summit 2019 IndieWebCamp est un rassemblement de créateurices web, construisant et partageant des technologies web ouvertes pour faire progresser le web indépendant. Nous nous rassemblons durant un weekend pour discuter comment nous pouvons aider et autonomiser les personnes dans la gestion de leur identité et de leurs data, puis nous passons une journée à hacker et créer. Lancez-vous et aidez à organiser et/ou suggérez des dates et lieux ! IndieWebCamp Planning Traductions Vous pouvez lire et éditer les articles sur ce site dans d'autres langues : Català (Catalan) Deutsch (Allemand) English (Anglais) Español (Espagnol) 한국어 (Coréen) Voir aussi les autres langues, et comment démarrer une nouvelle traduction. Plus d'informations Lisez les articles à propos de l'IndieWeb Regardez les vidéos à propos de l'IndieWeb Suivez les news à propos de l'IndieWeb Participez aux évènements IndieWeb à venir Ressources Wiki Changements récents Téléverser un fichier Modifier la page d'accueil .skin-vector-2022 #mw-content-text { max-width: none; } .vector-feature-zebra-design-disabled #mw-content-text { margin-top: 3px; } .vector-body-before-content, .vector-page-toolbar { display: none; } .iwc-homepage__container { background-color: var(--background-color); padding: 1rem 1.5rem; margin: 0 0 1rem 0; } .iwc-homepage__container--introduction .mw-headline { color: #54595d; font-size: 1rem; } .iwc-homepage__container--introduction p { font-size: 1.1875rem; } .iwc-homepage__content { font-size: 1rem; margin: 0 auto; max-width: 50rem; } .iwc-homepage__content p, .iwc-homepage__content li { max-width: 75ch; } .iwc-homepage__content h2 { border: 0; } .iwc-homepage__content figure + h3 { margin-top: 1rem; } .iwc-homepage__content dfn { font-style: normal; } .iwc-homepage__content img { height: auto; max-width: 100%; } figure[typeof~='mw:File'].iwc-homepage__icon, figure[typeof~='mw:File/Frameless'].iwc-homepage__icon { margin: 1.25rem; margin-left: -0.25rem; } .iwc-homepage__content h2:first-of-type, .iwc-homepage__content h3:first-of-type, figure[typeof~='mw:File'].iwc-homepage__icon:first-of-type { margin-top: 0; } Retrieved from "https://indieweb.org/wiki/index.php?title=Main_Page-fr&oldid=93298" Category: Pages in French'''
