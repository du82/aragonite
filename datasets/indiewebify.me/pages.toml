title = "IndieWebify.Me - a guide to getting you on the IndieWeb"
full_description = "A personal domain name is an inexpensive, internationally universal identifier which gives you more control over your space than other IDs (e.g. email address or phone number.) You probably already have many disconnected profiles on the web. Linking between them and your domain name with the rel=me microformat ensures that it’s easy to see that you on Google/Twitter/Github/Flickr/Facebook/email are all the same person as your domain name. Humans can already understand the things you post on your site. By adding a few short class names to your HTML, other people’s software can understand it and use it for things like reply contexts, cross-site comments, event RSVPs, and more. When you reply to something on another indieweb site, or mention someone with an indieweb site, sending a webmention lets them know they’ve been linked to. Sending webmentions allows you to write replies to other content and participate in cross-site conversations. You can send webmentions by: Posting replies to other people’s posts is the next step after just being able to mention them with webmention. Usually a reply is a note just like any other, but linking in a special way to the post it’s in reply to. When marked up with h-entry and rel=in-reply-to and/or class=u-in-reply-to, your reply can show up as a comment on the original post. To test if your webmention sending is working, try replying to a post by someone who’s implemented comment receiving. There’s a list on the wiki. If you wish you can also go the extra mile and display a copy of the post you’re replying to. This is called a reply context, and is an excellent way to practise parsing posts on other people’s sites. Now you can post replies which show up as comments on other people’s sites, the next step is to be able to receive comments yourself. There are several ways to do this. Once you’ve got webmention receiving set up, there are a few different ways of making sure it’s working correctly: Want to make changes to IndieWebify.Me? The code is on Github. Found a problem? file an issue or send a PR."
year_published = 2025
