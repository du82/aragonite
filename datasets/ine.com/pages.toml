828w, /_next/image?url=https%3A%2F%2Fus-east-1.graphassets.com%2FAwCYQkwjSUCbfkm08Ct1Mz%2FR41G1kyyQO6CBe3Jj4a2&amp;w=1080&amp;q=75 1080w, /_next/image?url=https%3A%2F%2Fus-east-1.graphassets.com%2FAwCYQkwjSUCbfkm08Ct1Mz%2FR41G1kyyQO6CBe3Jj4a2&amp;w=1200&amp;q=75 1200w, /_next/image?url=https%3A%2F%2Fus-east-1.graphassets.com%2FAwCYQkwjSUCbfkm08Ct1Mz%2FR41G1kyyQO6CBe3Jj4a2&amp;w=1920&amp;q=75 1920w, /_next/image?url=https%3A%2F%2Fus-east-1.graphassets.com%2FAwCYQkwjSUCbfkm08Ct1Mz%2FR41G1kyyQO6CBe3Jj4a2&amp;w=2048&amp;q=75 2048w, /_next/image?url=https%3A%2F%2Fus-east-1.graphassets.com%2FAwCYQkwjSUCbfkm08Ct1Mz%2FR41G1kyyQO6CBe3Jj4a2&amp;w=3840&amp;q=75 3840w" src="/_next/image?url=https%3A%2F%2Fus-east-1.graphassets.com%2FAwCYQkwjSUCbfkm08Ct1Mz%2FR41G1kyyQO6CBe3Jj4a2&amp;w=3840&amp;q=75" decoding="async" data-nimg="fill" style="position:absolute;top:0;left:0;bottom:0;right:0;box-sizing:border-box;padding:0;border:none;margin:auto;display:block;width:0;height:0;min-width:100%;max-width:100%;min-height:100%;max-height:100%" class="styles_backgroundImage__518sm" loading="lazy"/>Made for OrganizationsOur full-cycle training methodology was created with organizations in mind. INE provides organizations with what they need to develop, upskill, and retain employees in and across cybersecurity and networking roles.Enterprise and Business SolutionsIntersection of Cybersecurity and Networking Resources for OrganizationsFrameworks for Workforce DevelopmentLearn moreSpeak to an INE Advisor Learn moreDevelop skills with immersive, scenario-based practice labs.INE understands that teaching “how to” under "ideal" conditions stops short of being work-role ready. We place great emphasis on creating scenarios which are as close to real world circumstances as possible to help create a resilient team. Azure SolutionsPentestingCisco SolutionsVulnerabilitiesPopular Skill Dive LabsCyberSecurityprofessionalVulnerabilitiesNetworkingprofessionalBGP FundamentalsCloudnoviceGetting Started with Azure CloudCyberSecuritynoviceBeyond Security+Browse All Skill Dive LabsTop News08 OCT 24By Rohit PardasaniImplementing & Troubleshooting OSPF Areas: Stub, NSSA, and Totally StubbyAs network architectures evolve, OSPF remains a cornerstone technology, more relevant than ever. Whether it's providing connectivity in Data Center VXLAN fabrics, supporting MPLS and Segment Routing in Service Provider networks, or ensuring efficient routing in large, complex enterprise environments, OSPF's role is undeniable.Understanding and implementing proper OSPF design is key to: Maximizing network uptime Reducing network convergence time during failure scenariosOptimizing the critical aspects of network performance Today’s network engineers must possess the skills to fully leverage OSPF’s capabilities to meet the demands of modern networking environments.In this blog, we'll explore how to implement and troubleshoot one of OSPF's most essential aspects—its ability to optimize routing through various types of stub areas. Understanding how Stub Areas, Not-So-Stubby Areas (NSSA), and Totally Stubby Areas work is key to ensuring you have the skills to design scalable, high-performance networks.Also, be sure to check the Further Learning section at the end for links to hands-on additional resources.Getting StartedLet's look at the topology diagram below to understand the need for these different OSPF area types.In this topology, we have two Autonomous System Boundary Routers (ASBRs) redistributing external routes (BGP and EIGRP) into the OSPF domain. The ASBRs advertise these routes using the External LSA (LSA Type 5), which then floods throughout the OSPF domain without any changes. These types of routes can be verified below. As you can see above, R2 is receiving many External Routes (Type 5 LSAs). Next, we verify who the advertising router is. Below, we can see the detailed verification for the first and last routes. For route 10.1.1.1, the advertising router is R1, and the router ID is 10.1.1.1. For route 10.10.10.15, the advertising router is R9, and the router ID is 10.9.9.9. Now, let’s verify what checksum value the ASBRs set for the Type 5 LSA routes 10.1.1.1 and 10.10.10.15.Now, to confirm that the Type 5 LSA is flooded throughout the OSPF domain without any change, we must verify the checksum value on any other router that is not the ASBR. If the checksum value is the same, it confirms that the ASBR floods Type 5 LSA throughout the OSPF domain unchanged. We will verify this on R2.Since the checksum value is the same on all routers, our verification for the ASBR flooding the Type 5 LSA throughout the OSPF domain is complete.Imagine if the ASBR advertised 50,000 Type 5 LSA routes. 50,000 Type 5 LSAs would flood the OSPF domain, affecting the network's performance. To optimize the OSPF network, you can configure an Area as a Stub Area. This Stub Area will not receive any Type 5 LSAs; instead, it receives a default Summary LSA (Type 3 LSA) route from the local ABR so that it can still reach the external networks. What is a Stub Area?A Stub area is designed to reduce the size of the routing table by restricting the types of LSAs (Link-State Advertisements) that can enter the area. Specifically, a Stub area does not allow external routes (Type 5 LSAs) to enter. Instead, the area routers rely on a default route (0.0.0.0/0) to reach destinations outside of OSPF.Stub Area Key Characteristics:Type 1 and Type 2 LSAs: Routers within the stub area will exchange Router (Type 1) and Network (Type 2) LSAs as normal.Type 3 LSAs: Summary LSAs (Type 3) are allowed for inter-area routes.No Type 4 LSAs: ASBR Summary LSAs (Type 4) are not generated by the ABR.No Type 5 LSAs: External Routes (Type 5 LSAs) are blocked. Instead, a Type 3 LSA default route (0.0.0.0/0) is injected into the area to forward traffic to external destinations.Stub Area Restrictions:Area 0 cannot be configured as a Stubby Area.There must be no virtual-links transiting the Stubby Area.There must be no ASBR present in the Stubby Area.Stub Area Use CaseStub areas are ideal for areas with limited resources or where external route information is not needed. For example, a branch office with only a few internal routes may use a stub area to simplify routing decisions.Now that we have learned the basics of OSPF Stub Areas, let's deep-dive into the configuration.Implementing and Troubleshooting OSPF Stub AreaImagine that Area 1 is a remote branch office, and the routers there cannot handle too many LSAs. To reduce the routes from the routing table and to optimize Area 1, configure the entire Area 1 as a Stub Area. This will remove all the Type 5 LSAs from the OSPF database and the routing table. Important Note: a Stub flag must match between two routers for them to establish OSPF adjacency. This means that if Area 1 is configured as a Stub on R4, then R3 and R2 must also be configured as Stub for Area 1.Let’s verify if the Stub flag needs to match. For this, we will configure Area 1 as Stub on R4 an'''
