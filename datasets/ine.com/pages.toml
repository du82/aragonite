title = "Meet Our Experts | INE Instructors"
description = "Alexis Ahmed is an experienced penetration tester and security researcher with over 7 years of experience in the Cybersecurity industry and has provided self-paced and live Penetration Testing & Red Team training to students and professionals at INE since 2021. He started off his career as a Linux system administrator and soon discovered a passion and aptitude for information security and transitioned into the role of a Junior Penetration Tester. In 2017, he founded HackerSploit, a Cybersecurity consultancy company that specializes in Penetration Testing, Red Teaming & Cloud Security, where he currently works as a Sr Penetration Tester and Cybersecurity Instructor. In the Infosec & Cybersecurity community, Alexis is better known as HackerSploit. Join his 700k+ followers at his YouTube channel for more Red Team content.See Training"
full_description = "Meet Our ExpertsWe are honored to work with some of the brightest minds in the industry. With more than 100 years of combined experience and a list of accolades longer than a certification exam, there is nobody more equipped or qualified to train you or your team.Become an INE InstructorSee BioAlexis AhmedPenetration Tester & Red Team InstructorSee TrainingAlexis Ahmed is an experienced penetration tester and security researcher with over 7 years of experience in the Cybersecurity industry and has provided self-paced and live Penetration Testing & Red Team training to students and professionals at INE since 2021. He started off his career as a Linux system administrator and soon discovered a passion and aptitude for information security and transitioned into the role of a Junior Penetration Tester. In 2017, he founded HackerSploit, a Cybersecurity consultancy company that specializes in Penetration Testing, Red Teaming & Cloud Security, where he currently works as a Sr Penetration Tester and Cybersecurity Instructor. In the Infosec & Cybersecurity community, Alexis is better known as HackerSploit. Join his 700k+ followers at his YouTube channel for more Red Team content.See TrainingSee BioKeith BogartTechnical Training Instructor - NetworkingSee TrainingKeith is a Technical Trainer and Course Developer with over 20 years of experience in Cisco Routing and Switching technologies and internetworking. His passion is to help others understand complex networking topics and protocols so that they can achieve their personal and professional goals. Keith excels Instructor-led coursework, virtual courses taught over the web, course development of instructional materials and labs, and creation of assessments. Keith has helped thousands of learners over the years achieve various levels of Cisco certifications ranging from the CCENT to the CCIE. Keith earned his Cisco Certified Internetworking Expert (CCIE) in 1999, Cisco Certified Networking Associate in 2001 and Certified Wireless Networking Administrator in 2014.See TrainingSee BioBrian McGahanCo-Founder of INE & Director of Networking ContentSee TrainingBrian McGahan is the co-founder and Director of Networking Content at INE. He has played a pivotal role in shaping the company’s technological vision and strategic direction. Brian is a four-time Cisco Certified Internetwork Expert (CCIE) #8593 (Routing & Switching/Service Provider/Security/Data Center), Cisco Certified Design Expert (CCDE) #20130013, and co-founder of Internetwork Expert Inc. His extensive expertise in network architecture forms the backbone of INE’s innovative solutions. With over twenty years of experience in the field, Brian has authored numerous industry-leading training materials and guides that have educated thousands of professionals worldwide.See TrainingSee BioBrian OlliffDefensive Cybersecurity InstructorSee TrainingIn late 2020, Brian joined INE as a Defensive Cybersecurity Instructor to help others excel in the field. He’s been a professional in the IT field for more than 15 years, possessing extensive experience with both network and server administration, as well as defensive cyber security operations and engineering.See TrainingSee BioRohit PardasaniSr. Network Architect and Instructor & CCIE x 5See TrainingRohit Pardasani has been working in the education field since 2001, and with INE since 2016. He continues to revolutionize the way engineers prepare for the prestigious CCIE Lab certification. With more than 20 years in the networking industry and a focus on Cisco networking and network security for the past 18 years, Rohit brings decades of teaching, real-world enterprise, and service provider experience to the classroom. Rohit has assisted hundreds of engineers in obtaining their CCIE certifications. He currently holds 5xCCIE’s (Routing Switching, Service Provider, Security, Voice and Collaboration). When not teaching or developing new products, Rohit consults with large ISPs and enterprise customers in India and UK. Rohit is currently pursuing his CCIE Data Center certification.See TrainingSee BioTracy WallaceDirector of Content DevelopmentSee TrainingTracy Wallace is the Director of Content Development at INE, where he leads the creation and curation of educational materials across multiple platforms. His strategic vision focuses on developing engaging and comprehensive content that meets the evolving needs of IT/IS professionals. Tracy’s extensive experience in developing Microsoft training and cloud training portfolios at INE has established him as a pivotal figure in shaping educational content that aligns with industry demands and enhances learner outcomes. His leadership in creating and delivering on-demand training content for Azure and relational databases demonstrates his ability to innovate and adapt educational tools that empower both instructors and students at INE.See TrainingSee BioFrank SatterwhiteCyber Security PrincipalSee TrainingFrank Satterwhite is the Cyber Security Principal at INE, Excels at building, establishing, and strengthening information security programs, cyber resilience, and incident response in global organizations from an engineering as well as Virtual CISO perspective. Proven Red Team Lead, Cyber Security Engineer, Incident Manager, and Level 2 SOC Analyst proficient in utilizing tools to detect, identify, mitigate, and remediate incidents. Highly skilled with technical mitigation of incidents and leading Incident Response based on SANS, NIST, and industry best practices. Especially skilled at handling ransomware and data breaches. Leads SOCs, Global CSIRTs and proven experience with IT, and stakeholder engagement. And proven experience dentifying and mitigating emerging and advanced persistent threats impacting networks, systems, and applications.See TrainingExplore the Full Team of Expert InstructorsWith nearly 100 professionals contributing their expertise, there’s even more to discover. Browse our complete library of expertly crafted content and start learning today.Sign Up Now"
