["https://inessential.com/1999/12"]
title = "inessential: December 1999"
full_description = '''22 Dec 1999 12/22/99 A holiday gift from UserLand -- hosting EditThisPage.Com sites created in 1999 indefinitely. This is an example of why I work for UserLand and wouldn't want to work anywhere else. Generosity is key. I remembered last night that I actually have a shrink-wrapped copy of Caldera OpenLinux 2.3. I wondered if it was easy to create a dual-boot machine, Windows and Linux, so I could have a Linux workstation that's purely for play. It turns out that OpenLinux comes with an actual manual (!), and according to the manual it's super-easy to set up a dual-boot machine. So I'm going to. I'll probably write up my experience here. I'm so freakin' desperate for a decent browser on my Mac that I'm going to try Mozilla Milestone 12. Update: It may be the dogfood release, but it's not my dogfood, and I can't eat it. It's slow. Page up and page down buttons don't work. Etc. I'll try again when M13 comes out. 21 Dec 1999 12/21/99 Kate Adams: "New morning ritual for me: Wake up, make coffee, and flip homepage." isp.root makes it easy to host lots of Manila sites. I'm looking forward to seeing the first non-UserLand Manila ISP. I just fixed automatic shortcuts for stories in Manila sites. I need to make this site searchable before I actually start adding content to it. Luckily (perhaps), this is a general problem I'm facing -- lots of Manila users want to make their site searchable. This may (or may not) happen before the turn of the millennium. Marc Richter: My Linux Journey from newbie to not such a newbie. Marc helped me via email -- now I have a clue about compiling postgres to get it installed on LinuxPPC. Marc is a subscriber to UserLand's Linux-Newbies mailing list. All I want for Christmas. I like LinuxPPC very much -- my one Linux box is a LinuxPPC box, an old Mac 8500. But I wonder if Yellow Dog Linux might have been the better choice for servers. Check out the list of databases that come installed with Yellow Dog. Too late to change now -- but I have another Mac server I'm slowly working on "retiring" to Linux. The original tagline for this site was "You don't need to be here."'''
year_published = 2025
