["https://inessential.com/2023/06/27/seattle_xcoders_this_thursday.html"]
title = "inessential: Seattle Xcoders this Thursday"
full_description = "27 Jun 2023 Seattle Xcoders this Thursday Seattle Xcoders meetups are at 7 pm on the first, third, and fifth Thursdays of each month, lately at the Bale Breaker x Yonder Cider Taproom in Seattle, in Ballard. We meet outside, usually in the uncovered area that has some benches and small gas fire pits. (Not actually pits. More like small coffee tables with rocks and fire on top.) There are no presentations or anything like that — we’re not back to doing indoor meetings with slides. We’re just talking. (Seattle Xcoders has always had a strong social game, so this is no surprise.) Everybody’s welcome! You don’t have to be a coder. Designers, support folks, testers, writers, and anybody interested in Apple-land apps are all encouraged to come hang out. Even managers. If you’re interested, be sure to subscribe to the calendar, so you don’t miss any changes of date, time, or venue. I myself don’t make it every time, but I do plan to be there this Thursday (June 29). See you there!"
