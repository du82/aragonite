["https://inessential.com/apps_ive_made.html"]
title = "inessential: Apps I’ve Made"
full_description = "Apps I’ve Made NetNewsWire is a free and open source RSS reader for Mac and iOS. The Past MarsEdit (2004, Ranchero Software) is now at Red Sweater. TapLynx (2009, NewsGator) was acquired by Push IO, which is now at Oracle. It has been discontinued. Glassboard (2011, Sepia Labs), a group messaging app, was acquired by Second Gear, but has since been turned off. Vesper (2013, Q Branch), a note-taking app, was written with Dave Wiskus and John Gruber. Vesper has been made open source and released on GitHub. For a few years I worked at The Omni Group on OmniOutliner and OmniFocus. The Distant Past I worked on UserLand Frontier 1996-2002. Before that — 1995-1996 — I released software that worked with WebSTAR: SpotLight, DenyAgent, and something else (I can’t remember its name). SpotLight sold about 10 copies; DenyAgent and that something else sold zero copies. But they shipped. 🐣🐥"
