["https://info-coach.fr/pc/internet/orange.php"]
title = "Mon Internet avec Orange"
full_description = '''Mon fournisseur d'Internet est Orange. J'ai conservé ma ligne téléphonique de France-Télécom et j'ai souscrit à une formule triple play (Internet + TV + Téléphone) en 18 Gb à 30 € / mois. Orange n'est certe pas le moins chèr des fournisseurs mais la qualité de service est au rendez-vous et malgré des coup de téléphone à répétition de SFR je reste fidèle... Ces dernières années j'utilisais une Livebox 1 Inventel et un décodeur ISD82. Je viens de mettre à jour (26/5/2010) mon installation par l'achat d'une Livebox 2 et l'échange du décodeur TV pour un décodeur UHD86. J'ai décidé d'acheter la Livebox (59 € en grande surface) car (a la date du 26/5/2010) la mise à jour est payante (20 €) et donc avec une location de 3€ / mois en 13 mois de location la Livebox est payée ! La livebox 2 présente de nombreuse amélioration qui la place à égalité avec les boxs des autres fournisseurs. J'ai installé à l'arrivé de la ligne France Télécom un filtre maître de la marque Tyco dont la sortie ADSL est connectée directement sur la livebox 2 et dont la sortie téléphone est envoyé sur certaines prises téléphoniques de la maison ainsi que sur un commutateur décrit plus loin. Les appels entrants en provenance de France Télécom (n° en 01) ne sont pas "traités" par la livebox et nécessite donc en général un téléphone supplémentaire ce qui n'est pas pratique. Afin de pouvoir recevoir les appels de FT et les appels d'Internet (les n° en 01 et les n° en 09) sur un même téléphone j'ai installé un "commutateur de lignes" (combine-a-line) électronique qui permet de connecter un téléphone sur deux lignes. Le basculement de ligne se fait automatiquement pour les appels entrants. Pour les appels sortants, la priorité est donnée à la lignegratuite par Internet (L1) mais il est possible de forcer l'utilisation de la ligne FT (L2) en composant à partir d'un combiné le symbole # avant le numéro du correspondant. La sortie du commutateur est envoyé sur une ligne de téléphone connecté à une base DEC avec six combinés repartis dans la maison.'''
