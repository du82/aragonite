title = "Atari Component Datasheets"
description = "Atari ST component datasheets"
full_description = '''Here you will find datasheets for some of the components used in the Atari computer. The datasheets are organized in the following categories: Most SIMMs and DRAM chips are specified using a "depth x width" notation. There are DRAM chips of various sizes available on the market, which have different depths and widths as well, and a SIMM can be made up (in general) of any combination of DRAM chips that adds up to the proper depth and width. For example, a 1x9 30-pin 1 MB parity SIMM is typically made up of either 9 * 1Mx1 DRAMs, or 2 * 1Mx4 DRAMs plus 1 * 1Mx1. In both cases, the total memory is the same: 1Mx9. Some of the information presented here comes from here The following table shows the different sizes of DRAM chips commonly used in memory modules, and the different bit widths that each size is typically available in. For each one, the configuration of the chip is shown (depth x width) and then in parentheses, the most commonly found last four digits of the part number found on the chip: This site contains copyrighted material the use of which has not always been specifically authorized by the copyright owner. We are making such material available in our efforts to help in the understanding of the Atari Computers. We believe this constitutes a 'fair use' of any such copyrighted material. The material on this site is accessible without profit and is presented here with the only goal to disseminate knowledge about Atari computers. Consistent with this notice you are welcome to make 'fair use' of anything you find on this web site. However, all persons reproducing, redistributing, or making commercial use of this information are expected to adhere to the terms and conditions asserted by the copyright holder. Transmission or reproduction of protected items beyond that allowed by fair use notice as defined in the copyright laws requires the permission of the copyright owners.'''
