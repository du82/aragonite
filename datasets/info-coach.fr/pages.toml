["https://info-coach.fr/pc/hardware/config/SSD.php"]
title = "Les SSD pour PC -- by Info-Coach"
full_description = "Les disques SSD (solid state drive) utilisent de la mémoire flash pour le stockage des données. Le résultat est un temps d'acces pratiquement nul et un taux de transfert beaucoup plus éleve que les disques durs. Les seuls points négatifs sont le prix et dans une certaine mesure la durée de vie. Mais le gain en réactivité et en performance est très impressionant: vos programme s'ouvre quasiment instantanement... Il faut savoir que les SSD ont tendance à s'encrasser avec le temps et necéssite une operation de trim pour retrouver leurs performances. Windows 7 est le seul OS a supporter directement les SSD (trim automatique). Les prix changent très rapidement donc à vérifier. Les Sandforce 1200 standard et le Marvell 88SS9174 sont les meuilleur choix."
