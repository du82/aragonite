["https://info-coach.fr/pc/hardware/config/son.php"]
title = "Carte Son pour PC -- by Info-Coach"
full_description = "Depuis l'apparition de la carte son Sound Blaster 16 de Creative Lab en 1992 le son est devenu une composante importante dans les PC. Dans les années 2000 la carte son à disparu au profit de composant directement soudé sur la carte mère. Ces composants n'ont toutefois pas la qualité de cartes sons dédiés et consomment de la puissance CPU. Il est donc recommandé d'utiliser des cartes sons séparées pour obtenir une qualité hi-fi haut de gamme et des fonctionalités specifiques: Dolby Digital live, DTS interactive, EAX, ASIO, Midi, etc. Musique Assistée par Ordinateur (MAO): Les ordinateurs sont de bons outils pour enregistrer, éditer et mixer des sons. Mais le transfert de l'audio vers et depuis l'ordinateur requiert une interface audio, et le choix de celle-ci n'est pas toujours évidente. Les interfaces audio existent en effet sous de multiples formes : Circuit intégré à la carte mère, cartes PCI, boitiers externes, simple stéréo ou multi-canaux, entrées analogiques et/ou numériques, entrées asymétriques ou symétriques, avec ou sans alim phantom, etc."
