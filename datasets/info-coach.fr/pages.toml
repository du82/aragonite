title = "Atari ST Interfaces / Connectors / Cables Information"
description = "Atari ST Interfaces & Connectors & Cables"
full_description = 'This page gives information on the numerous interfaces of the Atari ST and the associated connectors and cables. It also provides information on some standard cables and connectors not specific but useful for the Atari ST. Important note: On this page the connectors pinout are always given looking at them from the front side and not from the solder side. On the back panel you find connectors for a modem, printer, hard disks, floppy disk, TV (Atari with RF modulator) and monitor Back to the top The midi interface is used to connect the Atari to electronic musical instruments. It uses asynchronous signals (8 bits plus start and stop bits) at 31250 bauds (bit/sec). The Atari interfaces midi through a dedicated 6850 ACIA (Asynchronous Communication Interface Adapter) chip as shown on the right. Note the unconventional connection of Midi Thru signals to pin 1 & 3 of the out midi connector. This allows to have a midi thru interface without the cost of an extra connector. The Atari has two midi DIN5 connectors: A standard Midi In connector, and a non standard Midi Out connector that also includes the Midi thru output (this was done to avoid adding a third connector as specified in the standard midi) Note that a shield is connected on the Midi Out connector which is not following the midi standard. It is therefore recommanded to use cable without shield connection. For the Midi In connector there is no shield which is standard midi. It is possible to use standard Midi cables for the Midi In and the Midi Out connection to/from the Atari. However it is mandatory to check that the cable connected to the Atari Midi Out does not have any wires connected to pin 1 & 3. This should be the case if you use a "standard midi cable" as describe below, but sometimes you will find DIN5 male-male audio cables that connects all the pins. It is possible to build a special Y cable that allows to have a Midi Out port as well as a Midi Thru port coming from the Atari. For that matter you need to connect two cables on a male DIN5 connector (the one connected to the Atari Midi Out) and each of them are terminate on a male DIN5 connector. The Y cable connections are described below. Here is a picture of this cable'
