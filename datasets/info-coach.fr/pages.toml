["https://info-coach.fr/pc/hardware/sandyBridge.php"]
title = "Architecture Intel Sandy Bridge -- Info-Coach"
full_description = "Le 9 Janvier 2011 Intel met à disposition les premiers Cores iX-2XXX en 32 nm basés sur la micro-architecture « Sandy Bridge » pour les segments desktops et notebooks sur le socket LGA1155. Le segment haut de gamme en LGA2011 n'apparaitra pas avant 2012. Les performances, à frequence égale, seront supérieures de 10 à 30 % et le GPU intégré vera sa performance doublée. Les cartes mères seront basées sur les chipsets de la serie 6 (P67, H67, ...) qui supportent le SATA 6 Gbps et l'USB 3.0 Hormis ces caractéristiques qui distinguent Sandy Bridge de son prédécesseur, celui-ci conserve les choix technologiques introduits ou réintroduits durant Nehalem, à savoir : Le Intel Developer Developer Forum 2010 -- IDF2010 -- c'est tenu du 13 au 15 septembre 2010 au Moscone Center de SFO. De nombreuses informations ont été présentées, mais nous allons nous intéresser ici à la présentation de la nouvelle architecture Sandy Bridge. Première vrais intégration d'un CPU et d'un GPU sur une puce. Le fait d'avoir intégré les deux processeurs sur une seule puce (et non pas deux puce dans un chip comme pour les i3 et i5) permet une optimisation des performances et de la consommation entre les deux fonctions. Toute la gestion du processeur est faite par une unité appelé le System Agent SA (équivalent au uncore). Il contient le northbridge (PCI express, le DMI, le controlleur memoire, le Display Engine) ... Il est en charge du control indépendant des frequences et tensions des différentes unités, ainsi que du control optimisé de la puissance en fonction de la dissipation thermique (PCU - Power Control Unit). Le système de cache traditionel L3 à été repensé afin de pouvoir benéficier au CPU et GPU. Il prend le nom de LLC (last level cache) et fonctionne à la même vitesse que les Cores. Les différents cores, le GPU, et le system agent communique par un bus en boucle (ring bus) extremement performant qui delivre une bande passante de 96 Go/s par Core (384 Go/s dans un Quad Core!)"
