["https://info-coach.fr/atari/hardware/devices/supercard.php"]
title = "Atari ST Computer Hardware Information"
full_description = '''The long awaited successor to the famous SuperCard series released by Utilities Unlimited is here! This device lets you duplicate 5.25” or 3.5” floppy disks. This device can also can make image files for storage. With it’s 25ns flux capture resolution, SuperCard Pro offers nearly double the resolution of other flux copiers!With it’s easy to use software, you don’t have to be a computer wiz or deal with command line interfaces! Simply select the type of disk you want to backup and press START! This is related to the subject of Atari FD protection and to preservation. For more generic information on this subject please refer to my Atari Floppy Disk Preservation page. You can buy the SuperCard Pro board from their webstore. The product was shipped from the US to my home in France very quickly without problem. Getting the board up and running was quick and easy following the Users guide. I have tested the host drivers on Windows 8 64 bits edition and I did not experienced any problem during installation (make sure you run the install program as an administrator). I was able to do my first imaging of an Atari FD using the SCP program almost immediately after the driver installation. Note that at the time of this writing the software is still in beta and few things are not yet fully implemented. As usual you have to be very careful when connecting the floppy disk data cable. Often this kind of cable uses keyed connectors, but the connector on the board does not accept keyed cable. Therefore you cant use a cable that has pin 3 hole filled. Old cables that have connectors for both 3 1/2" and 5.25" drive should work. Look for the marked wire (usually red) that indicates pin 1 of the connector. You have to make sure that this pin is connected to pin 1 on the floppy drives connector (pin numbers are usually indicated on the printed circuit board - see pictures). This site contains copyrighted material the use of which has not always been specifically authorized by the copyright owner. We are making such material available in our efforts to help in the understanding of the Atari Computers. We believe this constitutes a 'fair use' of any such copyrighted material. The material on this site is accessible without profit and is presented here with the only goal to disseminate knowledge about Atari computers. Consistent with this notice you are welcome to make 'fair use' of anything you find on this web site. However, all persons reproducing, redistributing, or making commercial use of this information are expected to adhere to the terms and conditions asserted by the copyright holder. Transmission or reproduction of protected items beyond that allowed by fair use notice as defined in the copyright laws requires the permission of the copyright owners. Copyright owner are welcome to contact me if they want me to remove specific information.'''
