["https://info-coach.fr/atari/hardware/video.php"]
title = "Atari ST Video Information By DrCoolZic"
full_description = 'The Atari video outputs are connected mainly to the Video shifter circuitry as shown on this block diagram. Audio out and in are coming from the Yamaha YM-2149 sound circuit, and the synchronization signals are coming from the Atari Glue chip. The color outputs on pin 6 (Green), 7 (Red), and 10 (Blue) pass through an amplifier followed by a dump resistor of 27 Ohm resistors on the STF and 75 Ohms resistors on the STE. Pin 8 is connected to 12V / 10mA pins on "recent" ST. However on 520STF this pin is actually connected to GND. Pin 5 accept an optional audio input signal that can be mixed with the internally generated signal before going to the audio out on pin 1. Pin 4 is connected the MFP68901 circuit and is used to set the Atari in Hi-resolution when grounded and to Med/Low-resolution when left open. A transition on this pin generates a reset of the system. The following schematic describe most of the Atari STE video circuitry. The schematic for an Atari Mega STE is very close to this one but the locations of the components are different. However note that the video schematic for an Atari STF is quite different. This is due mainly because of the usage of a totally different version of the Shifter. Note the presence of two sections which are stuffed or not depending if the Atari is equipped with an RF modulator or not. There are several problems when trying to connect an Atari to a modern LCD/CRT monitor: The output voltages used are not standard, and the frequencies in Low/Medium color resolution are beyond the capability of most of the recent monitors. If you can find an old "multisync" monitor like the NEC 14" CRT Multisync II -- built in 1988 it accepts a horizontal frequency in range 15.5-35 kHz and a vertical frequency in range 50-80 Hz and therefore it can directly displays the 3 resolutions of the Atari. Unfortunately modern "VGA monitors" do not support directly all the resolution of the Atari. While in most case they should work with the Atari in monochrome mode (high resolution), they will probably not work for the color mode (medium-low resolutions) due to the fact that their minimal Horizontal Sync must usually be above 30 KHz and voltages can also be a problem.'
year_published = 2025
