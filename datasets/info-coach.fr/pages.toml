["https://info-coach.fr/atari/software/Image-formats.php"]
title = "Atari ST Protection Mechanisms"
description = "Describes some of the protections used by the Atari ST as well as techniques to reproduce copy protected FD."
full_description = "This page presents several Atari Floppy Disks image's formats. These images can be used for emulation or for preservation backup / copy of original Atari floppy disks. Some of these formats can be used directly (for example Pasti STX) in hardware / software emulators while some other may require to be converted (for example Kryoflux Stream files) by program like Aufit. Disk images are mainly used by SW or HW emulators. There are a lot of sites dedicated to the subject of Atari emulation and I will therefore point you to a list of links on the subject. The most widely used Atari software emulators are Hatari, Steem SSE, and Saint. The HxC2001 Universal FD Drive Emulator can be used to read FD images on real Atari. Note also that most recent emulators like Steem SSE can directly read zipped disk images. For example Steem SSE or Hatari can mount directly a zipped file (.zip) that contains a disk image of any of the supported disk image format. This section try to answer the question: I have Atari floppies that I want to use with my favorite emulator... This section try to answer the question: I have some interesting disk images and I would like to create a FD to run on my real Atari... As already mentioned above, if you deal with disk images there is one program you must have: the Floppy Imaging & File transfer program (FloImg) from P. Putnik. This program can be used to create images in ST / MSA / STT format directly from a ST floppy placed in the PC Floppy Drive. It is also possible to create FD directly from images. It also support ST <-> to MSA conversion. Another must have program is the MSA converter that run under Windows. This program not only allow conversion between different image formats but it also gives useful information about the image content. My Aufit program can be used to convert Kryoflux RAW, or Supercard Pro SCP images to STX, ST, or MSA format. For information there are some historical programs that run under DOS for st to msa conversion or from msa to st conversion. As well as two DOS programs to convert a PC disk to/from an ST disk."
