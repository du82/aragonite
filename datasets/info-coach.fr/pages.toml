["https://info-coach.fr/pc/hardware/config/memoire.php"]
title = "Mémoire pour PC -- by Info-Coach"
full_description = "Les performances de votre PC vont être influencées dans une certaine mesure par la mémoire vive dont vous allez l'équiper. Mais il faut savoir que l'impact de la mémoire est bien moins important que le CPU ou le GPU et donc il est plus avantageux de dépenser son budget pour des processeurs plus puissants que de vouloir acheter des kits mémoires très haut de gamme. Pour des plateformes plus anciennes on a le choix entre de la DDR2 ou de la DDR3. Il y a quelques années il était intéressant d'acheter de la DDR2 qui coûtait moins cher et qui était parfois mieux exploité que la DDR3. De nos jours il est fortement recommandé d'acheter de la DDR3 et sur les plateformes récentes ce n'est même plus un choix. Tous les processeurs récents n'acceptent que de la DDR3 qui est maintenant gérée de manière optimum. Nous ne parlerons donc pas de DRR2 dans cette présentation. Pour des raisons historiques et marketing, il existe trois façons différentes de spécifier la fréquence des mémoires: En dehors des besoins de Windows, la quantité de mémoire varie en fonction de vos applications. Dans la majorité des cas (Web, bureautique, vidéo, musique) 4 Go vous permet une utilisation confortable. Pour des applications de traitement de photo comme Photoshop ou des fonctions de montage vidéo (édition, encodage, etc.), ou si l'on utilise plusieurs applications « gourmandes » simultanément, il est parfois utile de passer à 6 Go mais il est rare d'avoir besoin de plus. Pour connaître vos besoins en mémoire, lancez le gestionnaire de tâches et observez l'historique de consommation mémoire. Si vous dépassez régulièrement les 50 %, vous pouvez envisager d'ajouter de la mémoire. En effet, il faut savoir que lorsque votre ordinateur vient à manquer de mémoire vive il fait appel à la mémoire virtuelle qui ce trouve sur un disque et les performances chutent alors de manière extrêmement importante. Les processeurs modernes ont une demande importante d'information en provenance de la mémoire et celle-ci constitue donc un goulot d'étranglement. Afin de permettre d'améliorer les performances, les contrôleurs de mémoire récents accèdent à plusieurs modules de mémoire simultanément. Selon les contrôleurs il est possible d'accéder à deux (dual channel) ou trois (triple channel) barrettes de mémoire simultanément. Pour fonctionner en dual ou triple channel deux ou trois barrettes de mémoire doivent être installé simultanément dans des emplacements repérés en général par des slots de même couleur. Les tests montrent que sur un contrôleur dual channel l'utilisation d'une seule barrette ampute les performances d'environ 20 %. C'est la raison pour laquelle les constructeurs de mémoire vendent des kits dual ou triple channel. En pratique cela veut dire qu'il est préférable d'acheter la quantité mémoire en multiple de deux ou de trois. Par exemple pour un dual channel 2 Go, 4 Go, 8 Go. Pour le triple channel utiliser un kit dual channel à un impact moins important."
