["https://info-coach.fr/pc/internet/anonymat.php"]
title = "Anonymat et Sécurité sur Internet"
full_description = "L'Internet est un outil fantastique et il serait bien difficile de s'en passer. Cependant, il faut savoir que dès que vous vous connectez sur Internet beaucoup d'informations vous concernant sont accessibles et souvent enregistrées à votre insu. Ces renseignements sont utilisés à diverses fins par des sociétés pas toujours scrupuleuses, par exemple pour mieux cibler les messages publicitaires qui vous sont adressés. Il faut savoir que si vous utilisez une connexion en WiFi dans un lieu public (Train, Internet Café...) il est très facile pour un Hacker de collecter les informations que vous échangez sur Internet et donc, par example, de lire les mails que vous envoyez ou que vous recevez ! Et n'oubliez pas que tout ce que vous publiez sur Internet est indexé et stocké de façon quasi permanente ! Préserver votre anonymat et sécuriser votre connexion Internet devient donc de plus en plus important ! Dans cet article je décris différentes techniques disponibles qui permettent de conserver un certain anonymat et/ou de sécuriser votre connexion Internet. Il faut savoir que si l’anonymat absolu n’existe pas il est possible de s’en approcher. Certaines des solutions exposées ici sont spécifiques aux téléchargements pour plus d’information voir ma page sur le partage de fichiers. Je vous rappelle que toutes les informations, logiciels, services et conseils présentés ici ne doivent en aucun cas servir à enfreindre le cadre législatif en vigueur, notamment celui lie à la protection du droit d'auteur. Vérifiez toujours que ces informations ne sont utilisées que pour favoriser un usage légal et responsable. Il faut savoir que dès l’instant où vous vous connectez à Internet des informations vous concernant sont enregistrées. Par exemple, votre fournisseur d’accès Internet (FAI) est tenu, de par la loi, d’enregistrer l’adresse IP qu’il vous a assignée et la plage horaire d’utilisation de cette adresse. L’utilisation de « box » et de réseaux Ethernet dans la plupart des foyers implique que dès la mise en route de votre ordinateur vous êtes connecté immédiatement à Internet. Si votre machine et votre pare-feu sont bien sécuriser peu ou pas d’information doit circuler à cet instant. Mais dès que vous ouvrez un explorateur Internet ou que vous lisez des mails, de nombreuses informations circulent et sont collectées, analysées, et enregistrées. Par exemple, il est extrêmement facile pour un serveur Internet de connaître : votre adresse IP (votre adresse Internet et votre adresse sur le réseau local), le pays et la ville de connexion, votre fournisseur Internet, si vous utilisez un Proxy, le navigateur que vous utilisez, votre système d’exploitation, votre résolution d’écran, votre langue, votre CPU, etc."
