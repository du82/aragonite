["https://info-coach.fr/pc/hardware/config/carte-mere.php"]
title = "Les Cartes Mères pour PC -- by Info-Coach"
full_description = "La carte mère est un élément important de votre configuration qui influe sur les performances et la stabilité de votre configuration.Son rôle est d'interfacer les composants principaux de votre PC : CPU, mémoire, carte graphique, périphérique, etc. Le marché des cartes mères est extrêmement actif ce qui résulte en une quantité importante de modèles s'échelonnant de 40 à plus de 300 euros. Comme les processeurs intègrent de nombreuses fonctions autrefois réaliser par ces cartes les différences ont tendance à s'amenuiser. Nous allons étudier quels sont les critères importants dans le choix de votre carte mère. La plupart des carte mères Sandy Bridge seront équipées avec l'UEFI (Unified Extensible Firmware Interface) à la place du BIOS. Les différences majeurs: Interface plus agéable, boot plus rapide, boot à partir de disque de plus de 2To Le P67 permet au slot PCIe 2.0 de fonctionner à 5 GT/s (au lieu de 2.5 GT/s) soit 1 GB/s (500 MB/s bidir)"
