["https://info-coach.fr/pc/hardware/config/HDD.php"]
title = "Les Disques Durs pour PC -- by Info-Coach"
full_description = "Bien que moins rapide que les SSD les disques durs (HDD) les performance des disques récent sont loins d'être ridicules. Ils ont sutout l'énorme avantage par rapport au SSD de couter beaucoup moins chers que les SSD. Le prix moyen du stockage sur HDD est d'environ 6 centimes d'euro au Go alors que pour les SSD ce prix s'éleve à 2€ / Go soit un rapport d'environ 1 à 30 Formatage de bas niveau. Historiquement les disques durs ont adaptées depuis l’année 1956 des secteurs de 512B. La norme est en train d'évoluée et de passer à 4K par secteur sous l'appellation « Advanced Format » en deux étapes : le 512e (512 émulation) et le 4Kn (4K native). Ceci permet d’utiliser la surface de stockage de manière plus efficace (gain global entre 5 et 13 %) avec des algorithmes de correction de données plus puissant. Mais attention ce format n’est supporté nativement que par les OS modernes tel que Windows Vista, Windows 7 et Windows Server 2008 (verifier que vous avez le patch KB982018). L’utilisation d’OS anciens, comme Windows XP, nécessitent l’utilisation d’outils spécifiques pour aligner correctement les partitions. Présentation rapide de la combinaison de plusieur disques durs en RAID afin d'ameliorer la sécurité ou les performances. Pour pouvoir mettre des disques durs en RAID ou JBOD vous devez avoir un controlleur qui supporte le RAID. Vous avez le choix d'avoir une carte dédiée (meilleur performance mais cher) ou d'utiliser des controlleurs sur la carte mère. Les chipset P55 (pas de support graphique) et H57 (support graphique - bien pour un NAS) permettent de contrloller les disques durs SATA en RAID et JBOD. Parfois les cartes mères sont équipés de controlleur supplémentaire permettant de faire du RAID (e.g. JMB 324). Il est également possible de faire du RAID en logiciel mais dans ce cas c'est le processeur qui doit faire tout le travail. Lorsque vous voulez utilisez vos disques en raid ile est préférable d'utiliser des disques appairées de même capacité et si possible de même performance. Donc l'ideal est d'utiliser des disques de même modeles. Il est possible d'utiliser des disques de modèle modèles différents mais ceci entraine en général des pertes de performance et/ou de capacité ce qui n'est pas traité ici."
year_published = 2025
