["https://info-coach.fr/pc/hardware/config/index.php"]
title = "Configuration d'un PC -- by Info-Coach"
full_description = "Mais pourquoi vouloir assembler un PC ? D'abord parce que c'est fun ensuite cela permet d'avoir un PC qui convient parfaitement à vos besoins, et enfin cela revient toujours moins cher qu'une configuration du commerce (il faut bien que les fabricants se fassent de l'argent !). La première étape est de prendre le temps de définir le plus précisément possible les utilisations que vous envisagez pour votre ordinateur : bureautique, jeux, traitement de vidéo, graphisme, composition musicale, home cinéma... Cette définition va vous permettre de choisir les éléments essentiels (CPU, GPU, mémoire, etc.) et ces choix vont à leurs tours vous permettre de déterminer les éléments secondaires (alimentation, boîtier, ventirad, etc.). En tant que particulier il ne m'est évidement pas possible de tester tout les composants ! Donc les recommandations proposées dans cette ensemble de pages repose sur l'analyse de revues publiées sur le net et de magazines spécialisés en particulier Hardware Magazine, PC Update, Canard PC Hardware. La sélection des différents composants de votre configuration doit ce faire dans un certain ordre. Je présente ici le processus que j'utilise pour définir une configuration PC: Liste de liens pour la selection des composants qui rentrent en ligne de compte pour assembler un PC: Dans les publications spécialisées, on trouve des configurations dites de référence qui sont définies parfois en fonction de l'application, parfois en fonction d'une gamme de prix. Ces configurations sont utiles comme point de départ ou de référence, mais vous devrez les affiner en fonction de votre utilisation. Les configurations résultantes seront toujours plus adaptées à vos besoins réels. Par exemple, les configurations dites haut de gamme correspondent en général à des configurations pour joueurs et sont donc toujours équipées de cartes graphiques ultras puissantes parfois même en multi-GPU. Or il est parfois nécessaire d'avoir une machine avec un CPU très puissante sans avoir de besoins particuliers pour des GPU haut de gamme. En effet les GPU sont essentiellement optimisés pour réaliser très rapidement des opérations graphiques complexes nécessaires au rendu des scènes de jeux. Même si certains programmes commencent à utiliser la puissance de calcul des GPU pour des applications autres que les jeux, mais ces utilisations restent minoritaires. Par exemple, Adobe Première offre la possibilité de ce servir des GPU Nvidia (et malheureusement seulement Nvidia) pour des calculs de rendus graphique."
