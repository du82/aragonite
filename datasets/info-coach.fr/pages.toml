["https://info-coach.fr/atari/hardware/memory-fr.htm"]
title = "La m�moire des ATARI"
full_description = '''Cette page fournie diff�rentes informations au sujet de "la m�moires" des ordinateurs Atari. Certaines des informations proviennent de la FAQ Atari ou il est possible de trouver des informations suppl�mentaire sur la m�moire des falcon et l'extension au del� de 4Mo. Ce paragraphe donne des informations g�n�rales sur les barrettes SIMM utilis�es dans les ordinateurs Atari, les configurations acceptables, ainsi que quelques conseils sur leur installation et afin d'aider � reconna�tre les m�moires un paragraphe est consacr� aux m�moires de l'�poque. Pour installer des m�moires il faut d'abord y acc�der puis enlever les m�moires existantes. Les Atari de la s�rie 520/1040 STE sont �quip�s de quatre emplacements pour des barrettes m�moire SIMM et sur ces mod�les il est donc possible d'augmenter la capacit� de la m�moire de 512 Ko � 1, 2, ou 4 Mo. Noter que les tout premiers STE ont �t� �quip�s de m�moire SIP qui sont extr�mement difficile � trouver, alors que les SIMM, qui ont �t� utilis�es largement dans les PC, sont en g�n�ral facile � trouver. Notez que ces informations, bien que valid�es sur Atari STE, s'appliquent � tout les mod�les de la gamme Atari �quip�s de connecteurs SIMM. Les Atari STE comportent quatre emplacements (appel� slot en anglais) m�moire SIMM num�rot�s de 1 � 4 (en partant de l'arri�re du syst�me vers l'avant). Par analogie avec les PC les slots sont regroup�s en banque de deux slots: La banque 0 est compos�e des slots 1 et 3 et la banque 1 est compos�e des slots 2 et 4. Les m�moires doivent �tre install�s par banque et donc doivent �tre install�s par 2. Les Atari STE acceptent des barrettes m�moire de type SIMM 8 Bits / 30 pins avec ou sans parit� et d'une capacit� de 256 Ko ou 1 Mo � l'exclusion de toute autre capacit� (en particulier les 4 Mo/8Mo et 16Mo ne sont pas accept�es) . La vitesse minimum pour les barrettes SIMM est de 150ns pour les 256Ko et de 120ns pour les 1Mo. Le plus souvent on trouve des barrettes de 256Ko en 120ns et des barrettes de 1Mo en 100ns ou 80ns ce qui convient parfaitement. A savoir les mod�les les plus rapides descendes jusqu'� 60ns.'''
