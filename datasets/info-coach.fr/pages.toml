["https://info-coach.fr/pc/internet/deepWeb.php"]
title = "Le Web Invisible"
full_description = "Selon des études récentes, près de 90 % des informations disponibles sur le Web ne sont pas indexées par les moteurs de recherches et sont donc à priori inaccessibles. Voici quelques outils qui vous permettront d'explorer un vaste réseau, riche en données souvent précieuses. Le Web invisible n'a rien de mystique. II ne s'agit pas d'un endroit ou traînent les hackers, se cachant avant de passer à l'attaque. Le Web invisible, aussi connu sous le nom de Deep Web ou Web Profond en français, se caractérise par son immensité. Sur la masse phénoménale des informations générées chaque jour sur l'Internet, seul un dixième est accessible a l'internaute lambda. La faute aux moteurs de recherches, aux robots d'indexation et a l'architecture même de l'Internet qui ne permet pas de traiter tous les contenus de manière égale. L'exemple le plus frappant reste les fichiers Flash et PDF qui, il y a encore quelques années n'étaient pas référencés. Aujourd'hui il reste encore de nombreux fichiers qui ne sont pas pris en compte par les outils classiques de recherche. Les vidéos, les images en premier lieu ou les fichiers volumineux en font partie. Il est difficile d'estimer la valeur du Web invisible, qui par définition n'est pas visible. Les chercheurs et spécialistes considèrent que le Web profond regorge de ressources de première main. Les entreprises devraient y trouver un grand intérêt puisque de nombreuses informations sur les concurrents circulent, de même que des informations sur les échanges B-to-B. Le niveau qualitatif des données serait même supérieur a celui du Web visible, trop vulnérable à la falsification des données Lors de recherches spécialisées sur un sujet donné, le Web invisible peut apporter de nombreux éléments introuvables ailleurs. Une multitude d'articles scientifiques, de publications universitaires, de livres blancs du marketing hantent les tréfonds de notre Web. Les entreprises sont les principales gagnantes, même si peu d'entre elles sont conscientes de l'existence d'un tel vivier. II devient très facile d'affiner sa stratégie grâce aux nombreux outils disponibles, veille concurrentielle ou collection d'information. Mais le citoyen lambda aussi y trouvera son compte, en plus d'une information de première qualité, il y trouvera des données que les gouvernements ont souhaite laisser filtrer. De la à tomber sur un dossier classe top secret du Pentagone... on ne sait jamais."
year_published = 2025
