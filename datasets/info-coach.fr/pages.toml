["https://info-coach.fr/atari/hardware/devices/dc.php"]
title = "Atari ST Computer Hardware Information"
full_description = '''The Discovery Cartridge is an excelent digital copier created by Richard Adams president of Happy Computer for the Atari ST/STe machines. It is capable of copying almost any kind of ST protected diskette as long as you have a correct control file. "The Discovery Cartridge's advantage over other disk copying or improvement software and hardware is the HART chip. HART stands for "HAPPY ATARI ROTATING THING". This custom made integrated circuit was designed by HAPPY COMPUTERS specifically to allow the full range of floppy disk reading and writing that could be needed with your Atari ST/MEGA computer. The limitations of the floppy disk controller chip built into your computer disappear. With the correct drive connected, and the proper supporting software, your computer can read and write virtually any floppy disk format. Using the standard 3.5" floppy drives for the computer, the immediate benefits are the ability to backup disks that you cannot ordinarily backup. The Discovery Cartridge also allows a variety of options that fulfils the wish list of most Atari computer users, so far as the disk system is concerned." To get knowledge of the DC first read this document "Introduction to the discovery cartridge, installation, etc." as well as Important DC Information. The DC is connected to the Atari by first plugging the cartridge into the cartridge port, and to the FDC port through a direct floppy cable. The schematics of the discovery cartridge can be found here. This extremely simple system is build around a custom chip called the HART chip. The DC could be sell with few options that allowed to add EPROM's, clock/calendar circuit PCF8573 and circuitry for extra floppies. The "basic" model (the one without option) only contains the HART chip, a TTL inverter package, a crystal, a few passive components. The DC is connected to the 68000 address and data bus through the cartridge port. Here is a picture of the basic board. Note that the imaging process is not fully automated and requires the user to provide information about the protection mechanisms used on the diskette to backup in a control file described below. Happy Computer was suppose to provide on request (and did provide) control files for making backup of specific diskettes. However the company is long time gone and there is a need to help user on the analysis process in order to create new command files (see programs below).'''
