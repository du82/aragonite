["https://info-coach.fr/pc/hardware/config/CPU.php"]
title = "Les Processeurs pour PC -- by Info-Coach"
full_description = '''Comme indiqué dans la page configuration le processeur est un élément essentiel de votre ordinateur. C'est l'équivalent du moteur de votre voiture. Le choix du processeur dépend étroitement de l'utilisation prévue pour votre ordinateur. La puissance nécessaire est déterminée par la complexité des opérations à effectuer par le CPU dans les programmes que vous utiliserez (e.g. encodage, filtres graphiques, filtres musicaux). Il faut également savoir si les programmes que vous comptez utiliser supportent le multi-cpu. En effet il ne sert à rien de prendre un Hexa-core si vos programmes ne savent pas les utiliser (i.e. utilisation du multi-threading). Par exemple pour un PC uniquement de joueur il faut un CPU équilibré avec votre GPU mais qui n'utilisera que très peu le multi-threading et donc dans ce cas il ne servira à rien de dépenser plus pour votre CPU que pour votre GPU. En général c'est une bonne idée de vouloir prendre le processeur le plus puissant possible ! Mais comme le processeur est souvent avec la carte graphique un des postes les plus importants du budget nécessaire pour assembler votre ordinateur et le premier critère de choix pour la sélection d'un processeur reste souvent le prix. Note: Comme j'ai passé une partie de ma carrière en tant que spécialiste d'architecture des processeurs chez INTEL je ne peut me résoudre à conseiller autre chose que des processeurs Intel. Si vous êtes un "aficionado" d'AMD passez votre chemin. Bien que les processeurs de la gamme Core 2 soient encore très performants à la date d'aujourd'hui (10/2010) il est difficile de les conseiller (fin de vie) sauf si votre budget est vraiment très limité ! Avant l'arrivée des nouveaux Sandy Bridge il était conseillé d'acheter uniquement les processeurs de la gamme Core iX qui intègrent le North Bridge (contrôleur mémoire, PCI Express ...) et ont une organisation des caches plus efficaces. Ceci permet un gain d'environ 20 % par rapport à un Core 2 à fréquence égale.'''
year_published = 2025
