title = "The Atari ST Quick FAQ"
full_description = "Oh, and for the real net.newbies, 'FAQ' stands for 'Frequently Asked Questions'. ;-) (and that's a smiley!) If any of your questions do not find an answer in here, please direct them to the comp.sys.atari.st newsgroup instead of me. I'll be willing to answer them myself, but if I didn't put it in the FAQ, I probably don't know. Any comments regarding the FAQ itself however (corrections, additions, comments, requests or total contradictions) are absolutely welcome. I'll be quite happy to correct any omissions or errors or to add sections that might be necessary (as soon as I find the time). Topics that are not covered in this FAQ might also be found in the older, larger but apparently no longer maintained FAQs: The Atari ST Quick FAQ (anonymous FTP/text version) ftp://ftp.sol.no/users/h/hallvart/atari/info/quickfaq.txt"
