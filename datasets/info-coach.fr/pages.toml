["https://info-coach.fr/atari/software/development.php"]
title = "Atari Software Development"
full_description = "There is obviously no easy answer to this question! It really depends on the requirements of your project but even more importantly of your familiarity with specific languages. Many languages are available on Atari but the most common choices are Assembly, Basic, and C. Other languages (e.g. Pascal) were not so popular on Atari and their implementations are usually not so good and therefore they should be avoided. Personally most of my development on Atari are done in C and I use Assembly only for small critical sections of my projects. I will not provide much information about using assembly language for the Atari because there is already plenty of sites that cover this subject... There are a lot of 68000 assemblers available for Atari ST but the most famous is the Devpac package from HiSoft. It contains an editor, an assembler, a linker, and a debugger. The two widely used versions are : Note also that most of the C compiler packages includes an assembler sufficient when you have only small pieces of your project in ASM. It is sometimes necessary (reverse engineering, cracking, ...) to look at some Atari executable code. For that matter you will need a disassembler. On the Atari I recommend to use Easy4 or this DASM68 or DIGGER. On PC you can use this disassembler from Fred76. And if you are ready to pay and spend lot of time in learning you should use the extremely powerful Ida Pro (Windows, Mac, Linux) multiprocessors Disassembler and debugger (there is a free evaluation version). There are many good C compilers available on Atari. The most famous ones are the Pure C and Lattice C compilers but they are not maintained and they do not have a good documentation. Therefore I recommend to use the AHCC Compiler developed and still maintained by Henk Robert. AHCC is fully compatible with Pure C code and libraries. For C development I recommend to use the AHCC (ANSI Home Cooked C) compiler from Henk Robbers. AHCC is an excellent full ANSI C89 compiler and is binary compatible to Pure C so it is possible to freely mix AHCC produced and Pure C produced objects and libraries. It uses the same project files as Pure C and a very similar graphic environment. It is therefore possible to migrate smoothly from Pure C to AHCC. The big big advantage of AHCC is that the code is maintained and continue to evolve. For example the current version 5.11 provides support for the Coldfire project. It also comes with sources so you can look at standard library implementation."
year_published = 2025
