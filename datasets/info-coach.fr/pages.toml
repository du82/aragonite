["https://info-coach.fr/atari/hardware/disassembly.php"]
title = "Démontage des ATARI ST"
description = "Demontage d'un Atari ST and d'un Hard Disk"
full_description = 'Note that all the images on this page are thumbnails and to view the full size detailed picture simply click on the thumbnail. Depending on what you have to do (for example, changing power supply, adding memory, etc.) it is obviously not always necessary to remove everything ... but if the need arises all information is there! Disassembly is presented following a logical order: from opening the plastic enclosure to the ultimate "undressing" of the motherboard. The reassembly of the computer is not detailed as you just have to follow the diassembly procedure in reverse order. However, a summary is provided for this purpose. Flip the computer upside down and locate the screws securing the cover. As shown in the photo, it is held by three screws at the bottom edge of the keyboard and four screws along the top edge. The 2nd top screw (marked by the tip of the pen on the photo) can be masked by a label. This label is a seal which indicates an intact system that has never been opened. It is reported that if you break the seal it will result in immediate termination of the warranty ... But of course this is not really important nowadays. I recommend that you pinpoint the location of the screws you remove, so that you can put back the same screws in the same locations. Check especially the difference between the top screws and the bottom screws because, in theory, they do not have the same lengths. For the moment, remove only the cover screws but do not remove the floppy drives crews . Holding both halves of the case together, flip the computer back over and carefully free the upper casing from the lower portion. To do this, first lift the cover from the left as shown in the pictures. Depending on your Atari this can be very easy or more difficult. After removing the cover you should see the keyboard at the bottom and several metal shields and the floppy drive at the top. The left photo shows a 520STE Atari and the right photo Atari 1040STF. You will notice that the right cover (above the floppy disk) is slightly different on the two models, but that the left cover is radically different. In an Atari STE the shield covers the power supply and the memory modules, whereas in the the Atari STF the shield only covers the power supply.'
year_published = 2025
