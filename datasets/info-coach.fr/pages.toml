["https://info-coach.fr/pc/hardware/config/alim.php"]
title = "Les Alimentations pour PC -- by Info-Coach"
full_description = "L'Alimentation est une composante importante de votre configuration et pourtant elle est souvent négligée. Son rôle est de convertir la tension alternative de 220V en basses tensions continues (3.3V / 5V / 12 V) utilisées par la carte mère et les périphériques (Disques durs, CD-ROM, etc..). Tous ces composants sont fragiles et il est donc très important que l'alimentation fournisse des tensions précises, parfaitement régulées, et qu’elle inclue un certain nombre de protections. Donc il est impératif de proscrire les alimentations « no-name » qui en général ne respectent pas les normes en vigueur et peuvent même se montrer dangereuses. Pour quelques euros de plus vous pouvez obtenir des alimentations de qualité qui ne généreront pas d'instabilité dans votre système, seront moins bruyantes, et dissiperont moins de chaleur. La consommation des processeurs en pleine charge est en général contenu sous les 100W et la consommation au repos devient de plus en plus faible sur les nouveau modèles (moins de 15 W). Si la consommation des processeur reste raisonnable on ne peut pas en dire autant des cartes graphiques dont la dissipation s'échelonne entre 100 W et 300 W. Les modèles haut de gamme dépassent parfois les 300W et la consommation au repos reste élevée. Il faudra donc étudier la consomation des cartes que vous achetez en particulier si vous faite du multi-gpu ainsi que le nombres de connecteurs PCIe 6/8 pins nécessaires. Quelques points de références: Après le processeur et la carte graphique c'est en général le troisième poste de consommation: 20 - 45 W Soit un total de 60W au repos et de 215 W en pleine charge. Comme le rendement optimum d'une alimentation se situe entre 50 et 80% nous obtenons une alimentation optimum d'environ 300 W. Donc une 400W voir une 500 W est plus que suffisante."
