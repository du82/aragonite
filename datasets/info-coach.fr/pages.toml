["https://info-coach.fr/atari/software/pc-projects/utilities.php"]
title = "My Atari Utilities"
description = "Atari ST Diskette Information"
full_description = "This page presents several utilities that I have developped for the Atari. These programs run on Windows and are have been released in the public domain. It is composed of a collection of programs that demonstrate how to read or write several of the Image file formats used by the Atari. The provided sources can be used as a reasonable starting point if you need to read or write image files. Another interest is that while reading or writing the different image files formats the programs display a lot of information about the internal content of the file. It can therefore be used in conjunction with the image file format description to better understand this format. The programs have a basic WPF (Windows Presentation Foundation) Graphical User Interface and are developed in C#. The Atari Image-file Reader-Writer project is free software; you can redistribute it and/or modify it under the terms of the GNU General Public License as published by the Free Software Foundation; either version 3 of the License, or (at your option) any later version. https://gnu.org/licenses/gpl.html. The project sources are available from this location on GitHub. The different Atari image file formats are described in my Atari FD Image Format page and specific documentations can be downloaded from Atari Documentation from DrCoolZic page. This site contains copyrighted material the use of which has not always been specifically authorized by the copyright owner. We are making such material available in our efforts to help in the understanding of the Atari Computers. We believe this constitutes a 'fair use' of any such copyrighted material. The material on this site is accessible without profit and is presented here with the only goal to disseminate knowledge about Atari computers. Consistent with this notice you are welcome to make 'fair use' of anything you find on this web site. However, all persons reproducing, redistributing, or making commercial use of this information