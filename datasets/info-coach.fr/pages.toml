["https://info-coach.fr/atari/software/preservation.php"]
title = "Atari ST Preservation & Backup"
description = "Describes some of the protections used by the Atari ST as well as techniques to reproduce copy protected FD."
full_description = "This page is about the preservation /backup for the future of Atari software stored on Floppy Disk Support. This is also related to Atari protections mechanisms used on FD as they make preservation / backup more difficult. Most, if not all, of the Atari programs are no longer available from their original suppliers and the problem with FD support is that the passage of time degrade them. Floppy disk medias created in the 80s / 90s we are now close to end of life even if kept in good conditions. Therefore preservation becomes an urgent task. Here I compare several software/hardware that you can use to preserve your Atari floppy disks. Things are evolving quickly in this area and therefore this comparison is a snapshot of what is available at the time of the writing (December 2014). The following section compares several techniques / devices that can be used for preservation and/or backing-up protected FD A backup program should always do the most to ensure the integrity of the resultant copy. The copy produced should operate just like the original and not remove the protection, or modify the program being copied in any way. The backup program must do the up most to check that the copy produced is correct. Therefore analog copiers should be avoided. Note that in order to create a backup of most Atari copy protected FDs, special hardware is required. This is because many of the protection mechanisms cannot be reproduced directly using the Atari FD controller. The only hardware solution for creating backup of diskettes (protected or not) on Atari is to use the Discovery Cartridge from Happy Computer. It uses a specially designed IC that allows to work down at the flux level when necessary and therefore can handle all possible Atari ST protection mechanisms. New KryoFlux and Supercard Pro devices, running on other platforms, have been especially designed to create backup of floppies. There are several Atari ST FD imaging formats for non protected diskettes (ST, DIM, MSA, ...) which were mainly created for emulation purpose but can also be used to recreate diskettes (backup). There are also new imaging formats for protected diskettes (CTR, IPF, SCP) that can be used to recreate FD."
year_published = 2025
