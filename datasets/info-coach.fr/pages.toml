["https://info-coach.fr/pc/hardware/config/GPU.php"]
title = "Les cartes graphiques pour PC -- by Info-Coach"
full_description = "Pour un joueur, la carte graphique reste le composant décisif dans la mesure où ses performances seront déterminantes pour la fluidité des jeux et il faudra donc prévoir une grosse partie de votre budget dans une configuration de joueur. Il faut savoir que les performances d'une carte graphique haut de gamme peuve être 10 fois supérieur a celle d'une carte d'entrée de gamme mais bien sur ceci à un cout important le prix variant dans les mêmes proportions . Le choix est d'autant plus difficile que ATi en Nvidia proposent une multitude de cartes et que la sortie de nouveau modèles ce fait à un rythme efféné. Les meuilleurs choix sont donc remis en question constament. Il faut aussi eventuellement tenir compte des possibilités offertent par le multi-GPU pour obtenir des solutions ultra performante ou plus économique. Les choix des GPU sont présenter en terme de cartes de référence. Il est intéressant d'analyser pour un modèle de GPU donné les options proposées par les différentes marques (overclocking, meilleur refroidissement, discrétion de la ventillation, connectique, etc.) et de choisir en fonction de vos besoins mais en restant dans une fourchette de prix raisonnable. La donne change : Octobre 2010 autour de 200 € la GTX 460 (à base de GF104) passe en tête. Elle prend position entre la HD5830 et la HD5850 d'ATi. Le GF104 supporte facilement l'overclocking."
