["https://info-coach.fr/atari/software/protection.php"]
title = "Atari ST Preservation & Backup"
description = "Describes some of the protections used by the Atari ST as well as techniques to reproduce copy protected FD."
full_description = '''I have created a document that describes the copy protection mechanisms used on Atari mainly from a "hardware point of view" (e.g. detail analysis of the flux transitions sampled from FD) and not from a "software point of view" (how a program tests these protections). If you are interested at the software side of the protections you can go to pages like Atari ST Protections from Markus Fritze or Les Protections sur Atari ST/AMIGA (in French) de DlFrSilver. It is highly recommended that you first read my document Atari Copy Protection Based on Key Disk that provides detailed information about most of the floppy disk protection mechanisms used on the Atari platform. Analysis of protections at the flux transition level has been done using my new Aufit Program as well as my older Analyzer programs. The flux transitions samples are created using the Discovery Cartridge (on Atari) or the Kryoflux and Supercard Pro devices on PC. In the area of protection of computer disc against unauthorized copying many patents exists. Some of them are presented below as they are of interest to understand Atari protections: As many of the documents referenced here are difficult to find, you will find a local copy of these documents. This site contains copyrighted material the use of which has not always been specifically authorized by the copyright owner. We are making such material available in our efforts to help in the understanding of the Atari Computers. We believe this constitutes a 'fair use' of any such copyrighted material. The material on this site is accessible without profit and is presented here with the only goal to disseminate knowledge about Atari computers. Consistent with this notice you are welcome to make 'fair use' of anything you find on this web site. However, all persons reproducing, redistributing, or making commercial use of this information are expected to adhere to the terms and conditions asserted by the copyright holder. Transmission or