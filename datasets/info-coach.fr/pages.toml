["https://info-coach.fr/atari/documents/myFAQ.php"]
title = "Atari ST FAQ by DrCoolZic"
description = "Frequently asked questions related to Atari ST/Falcon/TT computers"
full_description = '''While reading the original document I found a lot of interesting information but it also turned out to be a rather frustrating experience! The reason is that as the original document has not been updated since January 1999 most of the links in the original document are broken, a lot of topics are outdated and some more recent information/features about Atari ST computers are missing (for example nothing about devices like PeST, UltraSatan, KryoFlux ...). I therefore decided to rewrite a large portion of this FAQ. My document is based on The Atari ST Quick FAQ - Version 2.8a - 1999-01-22 (also available in an online version - in French) that was last updated by Nicholas Bales. There is also a text version (V2.9a) of this FAQ as well as some older documents published in the Atari newsgroup: FAQ1, FAQ2, FAQ3 As you probably know FAQ stands for "Frequently Asked Questions". :-) (and that's a smiley! ) The intent of this FAQ is to provide introductory level information for someone starting with an Atari. However if you are looking to more in-depth information this FAQ provides a lot of links to either external references or to internal references on subjects that I have covered. Again this FAQ is based on the original ST Quick FAQ from Nicholas Bales and for several subjects for which I (DrCoolZic) do not have specific knowledge or interest the original text has been kept unchanged. At the time the original FAQ was written, information among "Atarians" was widely exchange through newsgroup related to the Atari. Apparently the Atari newsgroup are gone from the Usenet distribution (at least I could not find any on my provider's news server) but it seems that some archives are still available from Google Groups. Newsgroups have been replaced by forums and there are plenty of Atari Forums. Back to the top I cannot be held responsible of any data loss, hardware damage, warranty voids, or thermonuclear warfare resulting in the application of anything described here. Nobody else can be blamed for any misuse but yourself. Any action that is described here may only be done at your own risks and perils. Whatever happens, it's not my fault.'''
