["https://info-coach.fr/atari/hardware/memory.php"]
title = "Atari ST Memory Information"
description = "Memory for Atari ST/Falcon/TT computers"
full_description = "This page provides various information about the memory of the Atari computers. Some of information comes from my Atari FAQ and it is possible to find additional information on the FAQ about the memory for the falcon and the extension beyond 4Mo. This paragraph gives general information on expanding memory of Atari computers equipped with SIMM modules, the different memory configurations, and some advice on their installation. In order to help in the identification of the memories modules a paragraph is devoted to old memories modules. To install the SIMM memories it is necessary to reach the memory connectors and to remove the existing modules. The 520/1040 STE Atari's models are equipped with SIMM memory sockets and it is therefore possible to easily increase the capacity of the memory up to 4MB. Although the information presented here have been validated on Atari STE models it should equally apply to any Atari's models equipped with SIMM connectors (e.g. Mega models). Be also aware that some very early STE models were equipped with SIP modules which are extremely difficult to find and not covered in this presentation. The Atari STE models have four SIMM memory sockets numbered from 1 to 4 (going from back to front of the system). These sockets are specifically designed to ensure that once inserted, the SIMM will be held in place tightly. The Atari STE models only accept the SIMM 30 pins / 8 Bits memory modules with or without parity bits and with a capacity of 256KB or 1MB exclusively (i.e. do not try 2MB, 4MB, 8MB, 16MB modules). The minimum speed for SIMM modules is of 150ns for the 256KB and 120ns for the 1MB. It is generally easy, and perfectly appropriate, to find 256KB modules at 120ns and 1MB modules at 100ns or 80ns. For information the fastest SIMM 30 modules are running at 60ns and they use memories are of FPM type (Fast Page asynchronous Mode) which are faster than the normal DRAM. The original SIMM modules used in Atari were not of EDO type but as for parity it should not matter."
year_published = 2025
