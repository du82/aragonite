["https://info-coach.fr/atari/software/PC-projects/analyzer.php"]
title = "Kryoflux Projects"
full_description = 'IMPORTANT NOTICE : All the programs presented here have been replaced by the Aufit project and therefore are not maintained anymore. This page contains information about several programs that I have written around the images produced by the KryoFlux controller board produced by KryoFlux Products & Services Limited. My experience with the Kryoflux hardware is described in "The Kryoflux Device". KryoFlux and Software Preservation Society (SPS) already provide all necessary information for the usage of the board with different platform (Amiga, PC, Atari, etc.). Therefore the focus of this page is to provide technical information for developers that want to write programs around the Kryoflux. Therefore you will find here several technical documentations and programs that I have written based on SPS and KryoFlux documents and sources. This is related to the subject of Atari FD protection and to preservation. For more generic information on this subject please refer to Atari Floppy Disk Preservation page. Results of Analysis of protected Atari Floppy Disk can be found in the Analysis of Kryoflux images page The following document provides a description of the Stream Files content (as produced by firmware 2.0) produced by the DTC (Disk Tool Console) program connected to a KryoFlux Device. The document also provides assistance on Decoding or Encoding Stream Files. It is based on my understanding of the KryoFlux documentations published by Software Preservation Society and KryoFlux Product & Services Limited but it also includes information based on experimentations and programing (using sources provided by SPS). I want to thanks István Fabián from SPS who has provided to me with a lot of detailed information on how KryoFlux device operates and on the source code used to decode a Stream File. Note: Regular user of the KryoFlux device should not be concerned by the information presented in this document which is mainly of interest to programmers that want to write tools around the Stream Files.'
