["https://info-coach.fr/atari/software/PC-projects/steem.php"]
title = "Atari Steem Emulator"
full_description = "My recommendation for the C++ compiler on Widows is Visual Studio from Microsoft. It includes a long list of features: powerful text editor with syntax coloring, browser for functions/variables, on-line C function help, etc. The intellisense technology automatically displays function and structure parameters (calltips) as you type and it provides auto-completion… and of course it provides a powerful debugging environment. It is available for free. Note: Some people are still people using the compilers VC6 from Microsoft and BCC5 from Borland to build Steem! This is really not a good choice! VC6 and BCC5 were released in the past millennium before final definition of ANSI/ISO C++ and are no more available/maintained. Therefore compared to modern C++ compilers they are not only missing features and checking, but more importantly they do not generate optimized code for recent processors architecture. This is the reason why I am using the freely available Visual C++ 2012 . I provide Visual Studio solution files for all my releases. Therefore after installing Visual Studio you just need to double click the provided solution file (for example Steem32B.sln) to open the Steem solution. You are now ready to build the solution for example by using the F6 key. Steem scan-line drawing routines are duplicated in x86 assembler for greater speed. This macro-heavy code compiles with the Netwide Assembler, NASM. The Netwide Assembler, NASM, is an 80x86 and x86−64 assembler designed for portability and modularity. It supports a range of object file formats, including Linux and *BSD a.out, ELF, COFF, Mach−O, Microsoft 16−bit OBJ, Win32 and Win64. It will also output plain binary files. Its syntax is designed to be simple and easy to understand, similar to Intel’s but less complex. It supports all currently known x86 architectural extensions, and has strong support for macros. Documentation can be found here It is always a good practice to keep track of the modifications you do on a project. So you can reverse to previous version of a project. Many open source repositories are using Apache Subversion (SVN). This is the case for the Original Steem code on Google code as well as for Steven Seagal version on Soundforge. Therefore on Windows I recommend to install the TurtoiseSVN client which is the de-facto standard for SVN. TustoiseSVN is fully integrated in Windows Explorer and this is all you need to manage revision of the Steem project. However if you are using any of the retail versions of Visual Studio (i.e. not one the free version) I recommend that you also use VisualSVN Visual Studio plug-in. With this plug-in you can perform all the Subversion operations directly within Visual Studio and it is free for personal usage."
