["https://info-coach.fr/pc/hardware/AsusP8P67/Asus-UEFI.php"]
title = "Architecture Intel Sandy Bridge -- Info-Coach"
full_description = "The Asus P8P67 Deluxe motherboard uses an UEFI firmware to boot the system. Compared to the well-known BIOS firmware it provides many new features like nicer GUI, faster boot time, but more importantly it support booting in UEFI mode from GPT disks. This last capability is becoming essential as many new drives with a capacity of 2.5TB and 3TB are now available (MBR disks capacity is limited to 2TB). The UEFI firmware of the Asus motherboard allows starting the system using an UEFI boot sequence or a standard BIOS boot sequence. The BIOS capability is provided to boot legacy OS like Windows XP. Therefore the Asus UEFI firmware provides a new set of options to specify boot devices and priorities which is somewhat different from what you find in classic BIOS. In this document we will present the Asus boot options, how to partition a GPT disk, how to install Windows 7 X64 in UEFI mode, and how to boot in UEFI mode. Note that the Asus implementation of the boot sequence is more flexible than many other implementations. With the Asus UEFI firmware the boot mode is automatically selected by the targeted boot file/device without user intervention. In contrast most of the other implementation will require the user to enter the BIOS and specify the boot mode for switching between legacy OS and “UEFI OS”. In the BIOS mode the boot devices are organized by type of devices (Hard Drives, CD/DVD, and Network). For each type it is possible to define a boot order. This is done in the Boot Menu of the UEFI setup program by clicking on the corresponding BBS (BIOS Boot Specification) priorities entry located at the bottom of the Boot Menu page (you may have to scroll down to find them). For example if you click on the Hard Drive BBS Priorities you will enter a submenu that presents all the drives connected to the system. Here you can define the boot order for the Hard disks. For example you can specify an SDD as the first priority (Boot Option #1) and a HDD as the second priority (Boot Option #2). This implies that the system will first try to boot from the SSD and if this fail it will try to boot from the HDD. The same prioritization procedure can be used for the CD/DVD as well as for the Network devices. Note that the Network Devices BBS Priorities entry only shows up if you have enabled the LAN (Intel / Realtek) Oprom options."
year_published = 2025
