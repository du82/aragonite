title = "Architecture Intel Sandy Bridge -- Info-Coach"
full_description = "As the name indicates this page is about the Asus P8P67 Motherboard that I have installed in my main PC. In this page I intent to share my experience with this motherboard. With its user-friendly interface, ASUS AI Suite II consolidates all exclusive ASUS features into one simple-to-use package. It allows users to supervise overclocking, energy management, fan speed, voltage and sensor readings, even interact with mobile devices via Bluetooth. This all-in-one software offers diverse and easy to use functions, with no need to switch back and forth between different utilities. The latest version, at time of this writing, of the AI Suite for the P8P67 mobo when running Windows XP / Vista / 7 is V1.01.14. At time of this writing there is no version of the AI Suite provided for Windows 8. This is a pain as several features of the motherboard can only be accessed easily from the AI Suite. Fortunately, after searching over the net, I have found that the AI Suite for Windows 8 was provided for some other Asus motherboard. On the Asus site I could not found any Windows 8 version of the AI Suite available for boards using the P67 chipset but I found that it was available for boards with the Z77 chipset. I have therefore downloaded the AI Suite from the Maximus V board: the Version 2.01.01. I did a full backup of my system and installed all the utilities provided as part of the suite on my system. Below are some results of the test of this version on my P8P67 motherboard."
