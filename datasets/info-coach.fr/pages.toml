["https://info-coach.fr/atari/hardware/STE-HW.php"]
title = "Atari STE Harware Description"
description = "The Hardware of the Atari STE"
full_description = 'This page contains a "relatively free" translation by DrCoolZic of the original article, published in the French ST Magazine N°44 September 1990, about the Atari STE Hardware. You can find a French online version of this article here. Note for the French reader: The original writting uses an extremely circonvoluted style with sentences that span over many many lines and usually contain many distinctive information. I did lots of "cleanup" and therefore I beleive that my translated text is easier to understand (as long as you read English!). The release of the Atari STE has opened many questions like "what are the performances of this new machine". The great programming capabilities of the STE have been discussed in many places but, until now, no thorough study of the hardware was made (that also includes the changes compared to the STF range). This article is particularly dedicated to the "Hardware gurus", but also to the curious programmers, wishing to better understand the STE machine. The literature on the hardware of the STF and the STE is relatively poor. Therefore in order to be understood by everyone I have tried to be as complete as possible, using also references to the preceding STF range. During operation, all the circuits of an ST machine works very tightly together. It is therefore not easy to split the hardware into distinct sections, such as sound or video. Although, to facilitate the life of the programmers, the addresses of the registers used by the different components have been grouped in zones corresponding to specific functions, the actual physical location of these registers is often dispatched on several circuits. It is therefore good to start this study by looking at the pinout of the main components of an STE. As they implements various functions in the STE be prepare to make a lot of jumps in the text while reading! Note-1: To speak about the old range, I will reference it as the STF which obviously also includes the MEGA ST. Note-2: The following convention is used for the pins and signals -- if a name is preceded with a star the pin or signal is active low.'
year_published = 2025
