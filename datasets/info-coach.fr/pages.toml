["https://info-coach.fr/atari/software/GameAnalysis.php"]
title = "Atari ST Preservation & Backup"
description = "Describes some of the protections used by the Atari ST as well as techniques to reproduce copy protected FD."
full_description = 'This page provides a short description of protections found on Atari games/programs I have analyzed. For a detailed description of Atari protections please refer to my FD protection document. It must be noted that: If you want to perform the analysis by yourself used the latest version of Aufit program and download the image from one of the following source Quality does not seems bad but in fact the track 72.0 has problems. You can see in the flux display window a red dot just before the detail check mark. If you switch to the information tab you will see the following message "*** Sector not found exception T72.0 Sect count=10 *** switching to safe mode". This indicates inconsistent number of sectors detected by Aufit and thefore it automatically switches to safe mode. Indeed if you look at the sector data display you will see that on certain revolutions the sector 8 (close to the end) is sometimes detected and sometimes notIf you switch to the Data View tab and look at track content you will see that in some revolutions only 2 sync marks are detected in front of the ID field of this sector (and therefore sector is not found). In a case like this Aufit probably wont be able to create a correct Pasti stx file. The only chance you have is to select a revolution where all the sectors are detected. Overall image quality of stream file not good lots of wobulation. (00.0 36.0-43.0) but convertion to stx ok The game can be converted to STX format. It works without problems on Hatari 1.8 but has problem on Steam 3.6.4 seems like 3.7 help in running the program but still not 100%. Seems to be a problem of timing and saving the STX file in Aufit with track sync header also help. Image from Atari-Forum in SCP format only. One bad track D2-T10.0 (cant be recovered) + one bad quality track D2-T08.0 SCP: Quality good except Disk 2 track 31.0 + 33.0 - Disk 3 T03.0 + 77.0 - can be recovered Back to the top Images Kryoflux + SCP from my personal disks. Quality image KF excellent, SCP D1 T02.0 bad - can be recovered'
