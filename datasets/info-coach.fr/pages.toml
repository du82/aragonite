["https://info-coach.fr/pc/internet/partage.php"]
title = "Techniques de partage de fichiers -- Info-Coach"
full_description = "Cette page vous informe sur quelques techniques de partage de fichiers sur Internet. Ces programmmes vous permettent, par exemple, de partager des vidéo de vos dernierères vacances. Je vous rappelle que toutes les informations, logiciels, services et conseils présentés ici ne doivent en aucun cas servir à enfreindre le cadre législatif en vigueur, notamment celui lie à la protection du droit d'auteur. Vérifiez toujours que ces informations ne soient utilisées que pour favoriser un usage légal et responsable : Il n'est pas possible de parler de partage sans parler d'anonymat et de la répression mise en place en France avec la loi Hadopi et au niveau mondial avec le projet ACTA. Vous trouverez des informations sur ces sujets dans la page Anonymat et Sécurité. Les études recentes publiées par les sociétés qui surveillent le traffic Internet (Sandvine, Ipoque, Arbor Network, ...) montrent que le P2P est en chute libre d'environ moins 26% en deux ans ! A la vue des ces chiffres on pourrais penser que cela correspond à une victoire pour les organismes de répression du téléchargement. Mais en fait la répression n'a fait qu'accelerer la transition des adeptes du téléchargement vers des solutions radicalement différentes : Le telechargement direct (RapidShare representerait à lui seul environ 5% du traffic mondial) mais surtout le streaming qui representerait environ 50% du traffic HTTP. Il faut noter que ces chiffres sont exprimés en pourcentage et il faut donc prendre en compte le fait que le traffic global est en train d'exploser. Malheureseument on assite à la fin d'une certaine idée du partage Cette dérive est une conséquence directe des actions menées par les industries culturelles qui ont fait payer leur produits à des prix exorbitants et non justifié. Le pair-à-pair (traduction de l'anglicisme peer-to-peer, souvent abrégé « P2P »), est un modèle de réseau informatique proche du modèle client-serveur mais où chaque client est aussi un serveur. Le pair-à-pair peut être centralisé (les connexions passant par un serveur intermédiaire) ou décentralisé (les connexions se faisant directement). Il peut servir au partage de fichiers en pair à pair, au calcul scientifique ou à la communication."
year_published = 2025
