["http://www.informit.com/about"]
title = "About | InformIT"
full_description = "About About InformIT InformIT is your one-stop technology learning resource. Our passion is delivering trusted and quality content and resources from the authors, creators, innovators, and leaders of technology and business from the best imprints in IT including Addison-Wesley, Cisco Press, Microsoft Press, and Pearson IT Certification, among others. Our editors are active participants in IT communities, and are always looking to publish on the topics that matter most to application and software developers and designers, programmers, system administrators, hobbyists, and IT professionals. Products found on InformIT come from the family of information technology publishers and brands of Pearson, the world's largest learning company. Our content, including eBooks and video training, is a part of O'Reilly Online Learning, a digital library subscription service. Learn more and start a free trial. Sign up for our newsletter and join our communities on Facebook, Twitter, and YouTube to keep up with the latest sample content, find out what our authors are up to, and get notifications of promotions and special offers as they are happening. We would love to hear from you! Let us know what topics matter most to you, what formats you prefer for learning, or what you think of a product from one of our imprints by contacting us at community@informit.com. About Pearson Pearson is the world's largest learning company with expertise in educational courseware and assessment, and a range of teaching and learning services powered by technology. Our mission is to help people make progress through access to better learning. We believe that learning opens up opportunities, creating fulfilling careers and better lives. Find out more about who we are. O'Reilly Online Learning Pearson content, including video training, is available in the O'Reilly Online Learning subscription service (previously known as Safari). O'Reilly Online Learning is the premier on-demand technology content library providing access to thousands of books and video training materials from Pearson, O'Reilly, Wiley, Manning, Pragmatic Bookshelf, and many others. Learn more. Contact Us Frequently Asked Questions Jobs Ordering and Shipping Info Press Room Privacy Notice Write for Us"
