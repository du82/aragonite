full_description = '''$(document).ready(function () { if (window.getComputedStyle) { $(".buckets-other, .copies, .wishlist, .book-extras, .product-buy-box, .append-bundles, #marketingDescription").appendAround(); } }); Home > Store View Larger Image Add To My Wish List Register your product to gain access to bonus material or receive a coupon. The AI Revolution in Customer Service and Support: A Practical Guide to Impactful Deployment of AI to Best Serve Your Customers By Ross Smith, Mayte Cubino, Emily McKeon Published Jul 2, 2024 by Pearson. Best Value Purchase Book + eBook Bundle Your Price: $49.29 List Price: $82.98 Includes EPUB and PDF About eBook Formats This eBook includes the following formats, accessible from your Account page after purchase: EPUB The open industry format known for its reflowable content and usability on supported mobile devices. PDF The popular standard, used most often with the free Acrobat® Reader® software. This eBook requires no passwords or activation to read. We customize your eBook by discreetly watermarking it with your name, making it uniquely yours. Watermarked eBook FAQ eBook Download Instructions Add to cart FREE SHIPPING! More Purchase Options Book Your Price: $35.99 List Price: $44.99 Usually ships in 24 hours. Add to cart FREE SHIPPING! eBook Your Price: $30.39 List Price: $37.99 Includes EPUB and PDF About eBook Formats This eBook includes the following formats, accessible from your Account page after purchase: EPUB The open industry format known for its reflowable content and usability on supported mobile devices. PDF The popular standard, used most often with the free Acrobat® Reader® software. This eBook requires no passwords or activation to read. We customize your eBook by discreetly watermarking it with your name, making it uniquely yours. Watermarked eBook FAQ eBook Download Instructions Add to cart Description tabArray.push('93f55b7e-b553-4a5e-8cef-199a361488c6'); Sample Content tabArray.push('0f8fc8f7-6d8d-4816-9b68-458cbd7149e6'); Updates tabArray.push('5ee7e6a0-2896-4293-85db-a976142bac52'); More Information Description Copyright 2025 Dimensions: 6" x 9" Pages: 544 Edition: 1st Book ISBN-10: 0-13-828650-7 ISBN-13: 978-0-13-828650-7 In the rapidly evolving AI landscape, customer service and support professionals find themselves in a prime position to take advantage of this innovative technology to drive customer success. The AI Revolution in Customer Service and Support is a practical guide for professionals who want to harness the power of generative AI within their organizations to create more powerful customer and employee experiences. This book is designed to equip you with the knowledge and confidence to embrace the AI revolution and integrate the technology, such as large language models (LLMs), machine learning, predictive analytics, and gamified learning, into the customer experience. Start your journey toward leveraging this technology effectively to optimize organizational productivity. A portion of the books proceeds will be donated to the nonprofit Future World Alliance, dedicated to K-12 AI ethics education. IN THIS BOOK YOULL LEARN About AI, machine learning, and data science How to develop an AI vision for your organization How and where to incorporate AI technology in your customer experience fl ow About new roles and responsibilities for your organization How to improve customer experience while optimizing productivity How to implement responsible AI practices How to strengthen your culture across all generations in the workplace How to address concerns and build strategies for reskilling and upskilling your people How to incorporate games, play, and other techniques to engage your agents with AI Explore thought experiments for the future of support in your organization Insightful & comprehensiveif you run a service & support operation, put this book on your essential reading list right now! PHIL WOLFENDEN, Cisco, VP, Customer Experience This book is both timely and relevant as we enter an unprecedented period in our industry and the broader world driven by Generative AI. The magnitude and speed of change were experiencing is astounding and this book does an outstanding job balancing technical knowledge with the people and ethical considerations we must also keep front of mind. BRYAN BELMONT, Microsoft, Corporate VP, Customer Service & Support The authors of this book are undoubtedly on the front lines of operationalizing Gen AI implementations in customer support environments and they know undoubtedly that at its core, support is about people and genuine human connections. This book walks you through their journey to keep people at the center of this technical tsunami. PHAEDRA BOINODIRIS, Author, AI for the Rest of Us  Sample Content Online Sample Chapter Application Areas of AI in Support Sample Pages Download the sample pages (includes Chapter 2) Table of Contents Part I: Introduction to AI and Its Applications in Customer Service and Support 1 The Seeds of an AI Revolution 2 Overview of Generative AI and Data Science Machine Learning 3 Application Areas of AI in Support Part II: Building AI Models Using Proprietary Content: The 6Ds Framework 4 Vision of Success 5 Discover: Laying the Foundation 6 Design: Building the Blueprint 7 Develop: Crafting the Solution 8 Diagnose: Ensuring Effectiveness 9 Deploy: Launching the Solution 10 Detect: Monitoring and Feedback Part III: Organizational Considerations for AI Model Creation and Deployment 11 Responsible AI and Ethical Considerations in Customer Support 12 Culture Considerations 13 Defining the Metrics that Matter in This New Era of AI 14 Utilization of AI for Operational Success 15 Evolution of Support Roles with AI Part IV: Gamified Learning and the Future of Work in Support 16 Games, Play, and Novelty in the Age of AI 17 Leadership Excellence in the Era of AI 18 Future of Work: Navigating the AI Revolution 19 Next Steps and Conclusion Glossary  Updates Submit 