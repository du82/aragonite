odern Windows, Linux, and Amazon Web Service environments.Michael J. Shannon has more than 25 years of IT and information system experience working as an employee, contractor, and consultant for companies like MCI, Platinum Technologies, Fujitsu, IBM, State Farm, MindSharp, Skillsoft, and of course Pearson. He is uniquely qualified to provide detailed explanations to help you understand exactly what is happening under the hood when accessing the Internet, whether it's using a corporate PC, laptop, mobile device, or even your web-enabled alarm!This course is a great first step in the process for entry-level IT certifications such as CompTIA Network+, A+, Cisco CCNA, Juniper, PAN, and cloud services like Google Cloud Platform and Amazon Web Services.Skill LevelBeginner/Entry-level What You Will Learn A complete overview of all TCP/IP fundamentalsAbout ground-level Internet technology and general networkingWho Should Take This CourseThe target audience for this course consists of anyone who wants to learn about the foundation of the Internet and the World Wide Web. It is a great introductory course and an excellent tool for individuals who are making a career change into Internet technology and need a visually stimulating primer.Course RequirementsNone About Pearson Video TrainingPearson publishes expert-led video tutorials covering a wide selection of technology topics designed to teach you the skills you need to succeed. These professional and personal technology videos feature world-leading author instructors published by your trusted technology brands: Addison-Wesley, Cisco Press, Pearson IT Certification, Prentice Hall, Sams, and Que. Topics include IT Certification, Network Security, Cisco Technology, Programming, Web Development, Mobile Development, and more. Learn more about Pearson Video training at http://www.informit.com/video.Video lessons are available for download for offline viewing within the streaming format. Look for the green arrow in each lesson.  