1a-046797ee36db'); Sample Content tabArray.push('0f8fc8f7-6d8d-4816-9b68-458cbd7149e6'); Updates tabArray.push('5ee7e6a0-2896-4293-85db-a976142bac52'); More Information Description Copyright 2025 Dimensions: 7-3/8" x 9-1/8" Pages: 672 Edition: 1st Book ISBN-10: 0-13-829142-X ISBN-13: 978-0-13-829142-6 Learn Generative Analysis--a New Method of Object-Oriented Analysis--to Keep Pace with How Generative AI Is Transforming the Face of Software Engineering Generative AI is revolutionizing software engineering--many aspects of manual coding are becoming automated, and the skills needed by software engineers, developers, and analysts are evolving. Anyone who writes or works with code will need to produce precise analysis artifacts to feed the AI code-generation process. Enter generative analysis: a precise, structured way for software engineers, programmers, and analysts to transition to this new, AI-enhanced software engineering world. In Generative Analysis, experts Jim Arlow and Ila Neustadt leverage Literate Modeling, M++, and multivalent logic to lay out a step-by-step approach to object-oriented analysis that produces clear and unambiguous results suitable for further processing into code by generative AI systems such as Copilot, ChatGPT, and Gemini. Prepare for the challenge of the future by understanding the flexibility you already have at hand using generative analysis. Gain a new perspective on the shift to generative AI-based programming models Understand how generative analysis artifacts feed generative AIs to generate code and UML models Explore techniques that feed into and refine each other until a precise analysis definition of a software system is achieved Recognize milestones and end points to eliminate "analysis paralysis" Learn to work at the right level of abstraction to leverage the most power from generative AI Gain understanding from real-world, detailed examples of prompts and AI responses This guide teaches advanced, precise, and sophisticated analysis techniques that will allow you to thrive in the new world of software engineering with generative AI. Register your book for convenient access to downloads, updates, and/or corrections as they become available. See inside book for details.  Extras Related Articles How to incorporate intuition in Generative Analysis How to use Questions to drive Generative Analysis Author's Site Please visit the author's site at clearviewtraining.com.  Sample Content Table of Contents Preface xivAbout the Authors xix Chapter 1: Generative Analysis for Generative AI 11.1 Introduction 11.2 Chapter contents 21.3 Communication and neuro linguistic programming (nlp) 31.4 Abstraction 71.5 Finding the right level of abstraction for Generative AI 141.6 Choice of Generative AI 141.7 Applying Generative AI to an example problem domain 151.8 Modeling in Generative Analysis 421.9 Chapter summary 51 Chapter 2: Launching OLAS, the example project 532.1 Introduction 532.2 Chapter contents 542.3 OLAS, the problem domain 552.4 Software engineering processes 552.5 The Unified Process (UP) 572.6 UP structure 602.7 UP workflows 622.8 UP phases 642.9 The UP phases in the world of Generative AI 682.10 The OLAS Inception phase 692.11 The OLAS Vision Statement 722.12 Keep all documents as concise as possible 732.13 Chapter summary 74 Chapter 3: Capturing information in Generative Analysis 773.1 Introduction 773.2 Chapter contents 783.3 Capturing informal, unstructured information 793.4 Mind mapping 823.5 Concept mapping 903.6 Dialog Mapping 1073.7 Antipatterns in mapping meetings 1143.8 Generative AI and mapping meetings 1153.9 Structured writing 1173.10 Structured documents 1193.11 Principles for structuring information 1203.12 Structured writing example 1273.13 Complexity versus profundity 1293.14 Chapter summary 132 Chapter 4: OLAS Elaboration phase 1334.1 Introduction 1334.2 Chapter contents 1344.3 Concept-mapping OLAS 1354.4 Creating a first-cut Logical Architecture 1474.5 Using Generative AI 