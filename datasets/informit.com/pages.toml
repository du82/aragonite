description = "4+ Hours of Video Instruction JavaScript started as a basic language for performing simple computations on web pages, but it's now become one of the most popular-if not the most popular-programming language. Over the past few years, it's become possible to do pretty much anything using only JavaScript: We can write entire front-end applications using React, Angular, or Vue. We can create JavaScript servers using Node.js. We can make JavaScript-driven desktop apps using Electron."
full_description = '''$(document).ready(function () { loadJWVideo("jw-vid_clip", $("#vidPlayerHolder"), $(".videoWrapper"), $('.videoWrapperInside')); if (window.getComputedStyle) { $(".buckets-other, .copies, .wishlist, .player-extras").appendAround(); } }); $(window).on("load", function () { $("img[id$='jwplayer_display_image']").attr("alt", "Introduction"); }); Home > Store Learn JavaScript LiveLessons (Video Training) By Shaun Wassell Published Apr 22, 2020 by Addison-Wesley Professional. Your browser doesn't support playback of this video. Please download the file to view it. Introduction 1.1 Learn what you can do with JavaScript Summary Online Video Sorry, this book is no longer in print. About this video Video accessible from your Account page after purchase. Not for Sale Add To My Wish List Register your product to gain access to bonus material or receive a coupon. Description tabArray.push('93f55b7e-b553-4a5e-8cef-199a361488c6'); Sample Content tabArray.push('0f8fc8f7-6d8d-4816-9b68-458cbd7149e6'); Updates tabArray.push('5ee7e6a0-2896-4293-85db-a976142bac52'); More Information Description Copyright 2020 Edition: 1st Online Video ISBN-10: 0-13-675305-1 ISBN-13: 978-0-13-675305-6 4+ Hours of Video Instruction JavaScript started as a basic language for performing simple computations on web pages, but it's now become one of the most popularif not the most popularprogramming language. Over the past few years, it's become possible to do pretty much anything using only JavaScript: We can write entire front-end applications using React, Angular, or Vue. We can create JavaScript servers using Node.js. We can make JavaScript-driven desktop apps using Electron. We can even develop mobile apps in JavaScript using React Native. In other words, JavaScript has become the common tongue of the software-development world, making it possible for a single developer with a single programming language to build programs that only a few years ago would have required an entire department.Join Shaun Wassell and take a journey into the universe of modern JavaScript. This LiveLessons offers manageable, thorough, step-by-step guides to learning and mastering modern JavaScript.DescriptionLearn JavaScript LiveLessons gives first-time JavaScript users what they need to become successful developers. Shaun Wassell offers a modern, full-fledged introduction to JavaScript. In particular, the viewer will learn the modern syntax of JavaScript: ES6. Shaun delivers step-by-step guidance that will take the learner from the basic syntax and concepts of JavaScript, all the way through the more advanced concepts that are covered in technical interviews.Customer ReviewWonderful hands on training video - Switch speed to 1.5 / 2.0x depends on your comfort and watch it. Hands on and easy to learn videotutorial - Highly recommendedSkill LevelBeginning to IntermediateWhat You Will LearnLearn modern JavaScript from the ground upBuild a basic server using JavaScript and Node.jsMaster the best practices of modern JavaScriptWrite high-quality, readable codeSkillfully answer technical interview questionsWrite and run modern JavaScript programsLearn how to take advantage of recent language additionsMaster the finer points of JavaScript ES6+Who Should Take This CourseJunior software developersSoftware engineersFull-stack developersFront-end developersBack-end developersCourse RequirementsPrerequisites:Basic knowledge of how programming worksSome experience with command line (not required)About Pearson Video TrainingPearson publishes expert-led video tutorials covering a wide selection of technology topics designed to teach you the skills you need to succeed. These professional and personal technology videos feature world-leading author instructors published by your trusted technology brands: Addison-Wesley, Cisco Press, Pearson IT Certification, Prentice Hall, Sams, and Que. Topics include IT Certification, Network Security, Cisco Technology, Programming, Web Development, Mobile Development, and more. Learn more about Pearson Video training at http://www.informit.com/video.Video Lessons are available for download for offline viewing within the streaming format. Look for the green arrow in each lesson.  Sample Content Table of Contents IntroductionLesson 1: What Is JavaScript?Learning objectives1.1 Learn what you can do with JavaScript1.2 Take a look at JavaScript’s features1.3 Learn the pros and cons of JavaScript1.4 Learn the JavaScript dialects and browser compatibility1.5 Running code using a REPL1.6 Learn basic JavaScript syntaxLesson 2: Learn the 8 JavaScript Data TypesLearning objectives2.1 Learn the 8 data types2.2 Learn about JavaScript’s “Number” type2.3 Learn about JavaScript’s “String” type2.4 Learn about JavaScript’s “Boolean” type2.5 Learn about JavaScript’s “Object” type2.6 Learn about arrays in JavaScript2.7 Learn about JavaScript’s “Function” type2.8 Learn about JavaScript’s “Undefined” type2.9 Learn about JavaScript’s “BigInt” type2.10 Learn about JavaScript’s “Symbol” typeLesson 3: Learn Basic JavaScript Control FlowLearning objectives3.1 Learn about equality in JavaScript3.2 Learn about If statements in JavaScript3.3 Learn about For Loops in JavaScript (For-in and For-of)3.4 Learn about While Loops in JavaScript (while and do-while)3.5 Handling and throwing errors in JavaScript3.6 Learn about Switch-Case Blocks in JavaScript3.7 Learn about Ternary Operators in JavaScript3.8 Learn the difference between block-scoped and function-scoped variablesLesson 4: Object-Oriented Programming in JavaScriptLearning objectives4.1 Learn about JavaScript classes4.2 Learn about Prototype-Based Inheritance4.3 Using the “This” keyword in JavaScriptLesson 5: Working with Objects, Arrays, and Functions in JavaScriptLearning objectives5.1 Use built-in Object Functions5.2 Use built-in Array FunctionsLesson 6: Learn JavaScript ES6+ SyntaxLearning objectives6.1 Write functions using Arrow syntax6.2 Set default values for function arguments6.3 Learn about the "spread operator"6.4 Use object destructuring to get object properties6.5 Use Interpolation to insert data into strings6.6 Learn the Import and Export code in JavaScriptLesson 7: Write and Run a JavaScript Program Learning objectives7.1 Learn about writing and running JavaScript programs7.2 Write a JavaScript program for the browser7.3 Move JavaScript to an external script7.4 Install Node.js and NPM7.5 Write a Node script7.6 Use Babel to transpile codeLesson 8: Work with Asynchronous Code in JavaScriptLearning objectives8.1 Use callbacks to handle asynchronous operations8.2 Learn about Promises8.3 Use Async and Await to make asynchronous code readableLesson 9: Create a Web Server with JavaScriptLearning objectives9.1 Learn the basics of writing a Node server9.2 Create and set up a Node.js project9.3 Create and run a basic Express server9.4 Create and test a GET endpoint9.5 Read a file with the ‘fs’ package9.6 Create and test a POST endpointLesson 10: Learn JavaScript Best PracticesLearning objectives10.1 Use ESLint to ensure code style10.2 Ensure Immutability in JavaScript programs10.3 Avoid Loops when working with arraysSummary  Updates Submit Errata  More Information  appendTabAjax('Reviews', 'ebf03de2-44c6-4d90-89bd-add1096ac20e', '/ProductTabs/Reviews/9780136753056'); displayDefaultTab(''); $(window).resize(function() { if ((document.documentElement.clientWidth > 600) && ($('#bssmoreInformation').hasClass('on'))) { displayDefaultTab(''); } }); InformIT Promotional Mailings & Special Offers ⚠ I would like to receive exclusive offers and hear about products from InformIT and its family of brands. I can unsubscribe at any time. Privacy Notice Overview Pearson Education, Inc., 221 River Street, Hoboken, New Jersey 07030, (Pearson) presents this site to provide information about products and services that can be purchased through this site. This privacy notice provides an overview of our commitment to privacy and describes how we collect, prote