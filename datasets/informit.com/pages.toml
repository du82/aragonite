full_description = "Oracle Press: Your learning resource for Oracle technologies Oracle Press is a publishing collaboration between Oracle and Pearson. It is the official source for information and training—including books, eBooks, and video courses—on Oracle technologies (Oracle Cloud Infrastructure, Oracle Database, Java, and more). New Releases and Coming Soon Core Java, Volume I: Fundamentals, 13th Editionby Cay S. Horstmann • 9780135328446 Written for experienced programmers looking for in-depth coverage of the Java language and platform, this first of two volumes offers a detailed treatment of fundamental Java programming topics, including object-oriented programming, reflection and proxies, interfaces and inner classes, exception handling, generics, collections, lambda expressions, concurrency, annotations, and the Java Platform Module System. The carefully crafted sample programs demonstrate almost every language and library feature, as well as the newest capabilities introduced in Java 21. ➔ Order the eBook Core Java, Volume II: Advanced Features, 13th Editionby Cay S. Horstmann • 9780135371749 This revised volume focuses on the advanced topics that a programmer needs to know for professional software development. It includes authoritative coverage of enterprise programming, networking, databases, security, internationalization, and native methods, as well as complete chapters on the Streams, XML, Date and Time, Scripting, and Compilation APIs. In addition, the chapters on Swing and Graphics cover techniques that are applicable to both client-side user interfaces and server-side generation of graphics and images. Cay S. Horstmann clearly explains sophisticated new features with depth and completeness and demonstrates how to use them to build professional-quality applications. ➔ Order the book, eBook, or bundle JVM Performance Engineering: Inside OpenJDK and the HotSpot Java Virtual Machineby Monica Beckwith • 9780134659879 Java Champion Monica Beckwith offers insights into the cutting-edge and future trends of Java performance. She demystifies the complexities of the Java Virtual Machine (JVM) performance, focusing on the OpenJDK HotSpot FM. Beckwith combines diagnostic techniques, performance methodologies, and effective optimizations with engaging case studies, practical applications, use-case diagrams, and process flowcharts. ➔ Order the book, eBook, or bundle Oracle Cloud Infrastructure - A Guide to Building Cloud Native Applicationsby Jeevan Gheevarghese Joseph, Adao Oliveira Junior, Mickey Boxell • 9780137902538 Cloud native development is a modern approach to designing, building, deploying, and managing applications. It takes advantage of the benefits of utility computing from providers, such as Oracle Cloud Infrastructure (OCI), and emphasizes automation, elasticity, and resilience. Whether you are new to the cloud or just new to OCI, this book provides an overview of the OCI services needed to build cloud native applications. ➔ Order the book, eBook, or bundle Oracle PL/SQL by Example, 6th Editionby Benjamin Rosenzweig, Elena Rakhimov • 9780138062835 With this comprehensive update for PL/SQL 21c, Oracle PL/SQL by Example, 6th Edition is the most current PL/SQL guide in print. Updated throughout, it covers everything from basic syntax and program control through the latest optimization and security enhancements. The authors walk you through every key task, helping you master Oracle 21c PL/SQL programming techniques on your own. ➔ Order the book, eBook, or bundle OCP Oracle Certified Professional Java SE 17 Developer (Exam 1Z0-829) Programmer's Guideby Khalid A. Mughal, Vasily A. Strelnikov • 9780137993642 OCP Oracle Certified Professional Java SE 17 Developer (Exam 1Z0-829) Programmer's Guide is a unique guide that combines a rigorous introduction to programming in Java with meticulous coverage of the Java SE 17 and Java SE 11 Developer exam objectives. This complete reference for Java certification contains so much information, we had to split it up into two print volumes for ease of use. Fully updated to reflect changes in the latest exams, it features an increased focus on analyzing code scenarios—not just individual language constructs. Each objective is thoroughly addressed, reflecting the latest features and APIs, as well as best practices for taking the exam. ➔ Order the book, eBook, or bundle >> Shop all Oracle and Java titles @Java on Twitter The latest from Oracle Connect ➔ New cloud partnerships put your data where you need it ➔ Oracle Cloud goes everywhere—including AWS, Google, and Microsoft Azure ➔ Oracle AI agents to help automate dozens of processes as businesses seek productivity gains * Release dates subject to change."
