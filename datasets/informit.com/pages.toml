["https://informit.com/about/faq.aspx"]
title = "FAQ | InformIT"
full_description = '''FAQOrdering Where can I purchase Pearson products? How can I find ordering and shipping information? I'm an educator. Do you have an academic review/deskcopy program? I'm an educator and would like to place a book order. How do I do that? How do I open a corporate account for bulk purchases? How do discount codes work? Products How do I download an electronic product? InformIT.com Features Where will I find additional files mentioned in my book? How do I sign up for your User Group program? How do I use the Search function on InformIT.com? Newsletters How can I subscribe to an InformIT newsletter? How do I unsubscribe from a newsletter? Writing & Reviewing for InformIT or Pearson Imprints How can I become a Pearson Education author or technical editor? Ordering Where can I purchase Pearson products? You can purchase Pearson imprint titles on InformIT.com, in bookstores, and from online resellers. How can I find ordering and shipping information? Visit the Ordering and Shipping Information page to learn about shipping options, prices, and stipulations, as well as find information on backordered products, billing, tax, and returns. I'm an educator. Do you have an academic review/deskcopy program? We certainly do. If you are interested in using Pearson books in your course, please follow these simple directions to submit your desk copy requests: Go to the catalog page of the book you would like to sample. Click the "Instructor" review copy link. Request your book via the Pearson site. Your Pearson representative will be automatically notified to follow up and provide you with a sample. I'm an educator and would like to place a book order. How do I do that? You may locate your Pearson sales representative by visiting the online rep locator. How do I open a corporate account for bulk purchases? For corporate bulk purchases for US companies (minimum of 25 copies), you can email the details of your inquiry if you need to set up an account. You can also call customer service at 800-992-0579. If you already have an account, you can register to use OASIS to request quotes and place orders. Corporate orders are subject to tax and shipping charges. How do discount codes work? If you have received a discount code, you will have the option to enter it during checkout. Codes that can be used more than once are saved to your account, so you may also select a code to use during checkout. Discounts are applied to the list price of a product, not the already discounted price displayed on product pages. Some products are not eligible to receive additional discounts, so your discount code may not be applied to all items in your cart. Discount codes cannot be applied to: eBooks that are part of a book/eBook bundle purchase Promotional "bundles" Products with special discounts applied as part of a promotional offering Products that are being promoted at one of our retail partner sites Only one coupon can be used per order. Products How do I download an electronic product? When you purchase an eBook from InformIT.com, you will receive a link in your Order Confirmation email to access the eBook via your Account page. Read our Watermarked PDF FAQ.InformIT.com Features Where will I find additional files mentioned in my book? If you're looking for additional files that are mentioned in a particular book, visit our Product Support page to find any downloadable files or errata. Enter the ISBN and then visit the product catalog page to find any available files. If no "Downloads" or "Updates" tabs appear on the page, then there are currently no downloadable or errata files available. How do I sign up for your User Group program? Visit our User Group section to learn about our program and register. How do I use the Search function on InformIT.com? You can search by title, author, keyword or ISBN. The 13-digit product ISBN is located on the back of your book, above the bar code. Newsletters How can I subscribe to an InformIT newsletter? Subscribe to the monthly newsletter to receive updates alerting you to new titles, special offers, author news, and more. How do I unsubscribe from a newsletter? Visit the unsubscribe page and enter your e-mail address or log in to InformIT and click on "Manage Newsletters." Remove the check mark next to the box for the newsletter you wish to unsubscribe from, and click "Submit." Writing & Reviewing for InformIT or Pearson Imprints How can I become a Pearson author or technical editor? If you are interested in becoming an author or technical editor, please visit our Write for Us page for contact information.'''
