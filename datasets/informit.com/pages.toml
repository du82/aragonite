unction with this Privacy Notice. The Supplemental privacy statement for California residents explains Pearson's commitment to comply with California law and applies to personal information of California residents collected in connection with this site and the Services. Sharing and Disclosure Pearson may disclose personal information, as follows: As required by law. With the consent of the individual (or their parent, if the individual is a minor) In response to a subpoena, court order or legal process, to the extent permitted or required by law To protect the security and safety of individuals, data, assets and systems, consistent with applicable law In connection the sale, joint venture or other transfer of some or all of its company or assets, subject to the provisions of this Privacy Notice To investigate or address actual or suspected fraud or other illegal activities To exercise its legal rights, including enforcement of the Terms of Use for this site or another contract To affiliated Pearson companie'''
