["http://www.informit.com/about/write_for_us.aspx"]
title = "Write for Us | InformIT"
full_description = "Write for UsInformIT brings technology experts and publishing experts together to create industry-leading training tools that help technology professionals succeed in their daily jobs. We welcome proposals for innovative, instructional books, eBooks, and videos about technology topics including programming, data science, cloud computing, software architecture & development, network administration, web design & development, security, and much more. We publish titles covering major technologies from companies including Cisco, Microsoft, Amazon, CompTIA, Oracle, Red Hat Software, and more. If you have a unique learning product idea or are interested in writing for one of our established series, we want to hear from you. Inquiries from potential technical reviewers are also welcome. How to propose a new title Review our proposal template (85 KB .doc), which includes all the information we'll need to consider your product idea. However, before submitting a full proposal, please send us an email message briefly describing your idea and your writing experience, so that we can provide initial feedback and tips."
