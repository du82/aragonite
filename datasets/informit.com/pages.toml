ray.push('0f8fc8f7-6d8d-4816-9b68-458cbd7149e6'); Updates tabArray.push('5ee7e6a0-2896-4293-85db-a976142bac52'); More Information About Features The book that's helped programmers master C for 25+ years: now updated for even greater relevance and value Revamped examples and well-crafted exercises provide hands-on experience Begins with simple tasks and builds to pro-quality techniques Guide to common mistakes helps you build robust, reliable code without trial-and-error By Stephen Kochan, author of several best-selling programming tutorials, including Programming in Objective-C  Description Copyright 2015 Dimensions: 7" x 9" Pages: 544 Edition: 4th Book ISBN-10: 0-321-77641-0 ISBN-13: 978-0-321-77641-9 Programming in C will teach you how to write programs in the C programming language. Whether you’re a novice or experienced programmer, this book will provide you with a clear understanding of this language, which is the foundation for many object-oriented programming languages such as C++, Objective-C, C#, and Java.This book teaches C by example, with complete C programs used to illustrate each new concept along the way. Stephen Kochan provides step-by-step explanations for all C functions. You will learn both the language fundamentals and good programming practices. Exercises at the end of each chapter make the book ideally suited for classroom use or for self-instruction.All the features of the C language are covered in this book, including the latest additions added with the C11 standard. Appendixes provide a detailed summary of the language and the standard C library, both organized for quick reference.“Absolutely the best book for anyone starting out programming in C. This is an excellent introductory text with frequent examples and good text....This is the book I used to learn C–it’s a great book.”–Vinit S. Carpenter, Learn C/C++ Today  Downloads Downloads Please download the code files associated with Programming in C here.  Sample Content Online Sample Cha