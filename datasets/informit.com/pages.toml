["https://www.informit.com/promotions/product-announcement-retirement-of-amazon-mobi-ebook-142422"]
title = "Product Announcement: Retirement of Amazon MOBI eBook file format | InformIT"
description = "Please read this important news about a change in eBook file formats for past and future purchases."
full_description = "Change in Multi-Format eBook Files:Replacing Amazon's MOBI with EPUB The MOBI format will no longer be available for download as of August 18, 2022 for any past purchase of a multi-format eBook here on the InformIT website or other sites in the InformIT Network. Amazon has announced the retirement of its proprietary MOBI file format for eBooks, and a transition to the EPUB format for use on Kindle devices and apps. As of August 2022, you will no longer be able to send the MOBI file format to Kindles or the Kindle app using the Send to Kindle service. The MOBI file format no longer supports the newest document features, while the EPUB format is updated and accepted by Kindle devices. Any MOBI files you have already sent to your Kindle will not be affected by this change. However, the downloadable multi-format eBook files available on your InformIT account will no longer include the MOBI format; those links will be removed on August 18, 2022. The EPUB and PDF links will remain. Purchases of future multi-format eBook files on this or any InformIT Network site after August 18 will include the EPUB and PDF formats, but will no longer include MOBI. Other InformIT Network sites include Cisco Press, Pearson IT Certification, Adobe Press, and Peachpit. You may access your purchases from all these sites together in one place, by simply logging into your InformIT account. This change does not mean any loss in content from your purchase, as the EPUB file already included with your purchase still contains all the same content, and may be used on the same devices and apps as the MOBI format was. Please visit your account and download any MOBI files you wish to retain, before August 18. After August 18, please use the EPUB format for viewing on Kindle apps and devices. Visit your InformIT account Need help? You may also view Amazon's Help Page for information on sending content to Kindle devices and apps, and contact Amazon Digital Services and Device Support for assistance with loading the EPUB format."
year_published = 2025
