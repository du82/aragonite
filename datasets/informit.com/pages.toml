full_description = '''$(document).ready(function () { if (window.getComputedStyle) { $(".buckets-other, .copies, .wishlist, .book-extras, .product-buy-box, .append-bundles, #marketingDescription").appendAround(); } }); Home > Store View Larger Image Add To My Wish List Register your product to gain access to bonus material or receive a coupon. A Tour of C++, 3rd Edition By Bjarne Stroustrup Published Sep 14, 2022 by Addison-Wesley Professional. Part of the C++ In-Depth Series series. Best Value Purchase Book + eBook Bundle Your Price: $45.29 List Price: $77.98 Includes EPUB and PDF About eBook Formats This eBook includes the following formats, accessible from your Account page after purchase: EPUB The open industry format known for its reflowable content and usability on supported mobile devices. PDF The popular standard, used most often with the free Acrobat® Reader® software. This eBook requires no passwords or activation to read. We customize your eBook by discreetly watermarking it with your name, making it uniquely yours. Watermarked eBook FAQ eBook Download Instructions Add to cart FREE SHIPPING! More Purchase Options Book Your Price: $31.99 List Price: $39.99 Usually ships in 24 hours. Add to cart FREE SHIPPING! eBook Your Price: $30.39 List Price: $37.99 Includes EPUB and PDF About eBook Formats This eBook includes the following formats, accessible from your Account page after purchase: EPUB The open industry format known for its reflowable content and usability on supported mobile devices. PDF The popular standard, used most often with the free Acrobat® Reader® software. This eBook requires no passwords or activation to read. We customize your eBook by discreetly watermarking it with your name, making it uniquely yours. Watermarked eBook FAQ eBook Download Instructions Add to cart Description tabArray.push('93f55b7e-b553-4a5e-8cef-199a361488c6'); Extras tabArray.push('abdf9677-e379-441c-971a-046797ee36db'); Sample Content tabArray.push('0f8fc8f7-6d8d-4816-9b68-458cbd7149e6'); Updates tabArray.push('5ee7e6a0-2896-4293-85db-a976142bac52'); More Information Description Copyright 2023 Dimensions: 7-3/8" x 9-1/8" Pages: 320 Edition: 3rd Book ISBN-10: 0-13-681648-7 ISBN-13: 978-0-13-681648-5 In A Tour of C++, Third Edition, Bjarne Stroustrup provides an overview of ISO C++, C++20, that aims to give experienced programmers a clear understanding of what constitutes modern C++. Featuring carefully crafted examples and practical help in getting started, this revised and updated edition concisely covers most major language features and the major standard-library components needed for effective use.Stroustrup presents C++ features in the context of the programming styles they support, such as object-oriented and generic programming. His tour is remarkably comprehensive. Coverage begins with the basics, then ranges widely through more advanced topics, emphasizing newer language features. This edition covers many features that are new in C++20 as implemented by major C++ suppliers, including modules, concepts, coroutines, and ranges. It even introduces some library components in current use that are not scheduled for inclusion in the standard until C++23.This authoritative guide does not aim to teach you how to program (for that, see Stroustrup's Programming: Principles and Practice Using C++, Second Edition), nor will it be the only resource you'll need for C++ mastery (for that, see Stroustrup's The C++ Programming Language, Fourth Edition, and recommended online sources). If, however, you are a C or C++ programmer wanting greater familiarity with the current C++ language, or a programmer versed in another language wishing to gain an accurate picture of the nature and benefits of modern C++, you won't find a shorter or simpler introduction.  Extras Author's Site Please visit the author's site at https://stroustrup.com/tour3.html.  Sample Content Online Sample Chapter Containers in C++ Sample Pages Download the sample pages (