full_description = "Product SupportHow to Find Product Support Materials Many of the products in our catalog offer free supporting files online. To quickly find out if support files are available for your product, enter the [U.S.] ISBN in the field below (do NOT use dashes between the numbers). Your ISBN is a 10-digit number listed next to the bar code on the back of your book or software product. If you have a PDF product, the ISBN can be found on the cover page. You'll be taken directly to the product page where you'll find all available support files. Please do not include dashes when entering your ISBN. ISBN-10 or ISBN-13:Types of Product SupportThere are dozens of types of support files, but most fall into one of the categories below: Examples and Support Files Typically these are files required to complete the tutorials within the book. They may be graphic files, code snippets, documents — all designed to help you work through the examples and tutorials in the book. Code Listings Many programming books make the all of the programming code in the book available for download. Additional Content Some publishers deliver additional discussion, or more in depth coverage on tertiary topics available via the web. Tools & Utilities Many titles offer small programs, utilities or other tools in support of their books. Errata Not every book is perfect. Check the product page for any available corrections to your book. These correction files are updated as needed, so check here first if you think you've found an error in your book."
