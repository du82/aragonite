title = "Stephen G. Kochan | InformIT"
full_description = "Home > Authors Stephen G. Kochan Stephen Kochan is the President of ClassroomM, Inc., a site devoted to education, training, and development of mobile applications. In addition to writing Programming in Objective-C and Programming in Objective-C 2.0, he is the author and co-author of 10 bestselling books on the C language–including Programming in C , Programming in ANSI C, Topics in C Programming. Steve also published several popular Unix books, including Exploring the Unix System and Unix Shell Programming. Steve has been programming on Macintosh computers since the introduction of the first Mac in 1984 and wrote Programming C for the Mac and Beginning AppleScript. Steve spent several years working at AT&T Bell Laboratories. While he was there, he worked on performance measurement tools and developed and taught courses in C programming and the Unix System. He is also the former CEO and President of Pipeline Associates, Inc. a software company which he founded in 1985. The company specialized in developing printer language interpreters and licensed its technology to preeminent printer manufactures such as Sharp, Konica, Hitachi, Mitsubishi International, Fujitsu, Kodak, Sharp Electronica, and Electronics for Imaging (EFI), Inc. Stephen G. Kochan"
