description = "6 Hours of Video InstructionHands-On Approach to Learning the Git Version Control SystemOverviewGit Essentials LiveLessons, Second Edition, provides you with functional, hands-on instruction on how to create, change, merge, branch, and otherwise manage repositories.About the InstructorDaniel Chen is a data science instructor, holds an MPH in epidemiology from Columbia University, and is a PhD candidate at Virginia Tech studying data science education in the biomedical sciences."
full_description = '''$(document).ready(function () { loadJWVideo("jw-vid_clip", $("#vidPlayerHolder"), $(".videoWrapper"), $('.videoWrapperInside')); if (window.getComputedStyle) { $(".buckets-other, .copies, .wishlist, .player-extras").appendAround(); } }); $(window).on("load", function () { $("img[id$='jwplayer_display_image']").attr("alt", "Introduction"); }); Home > Store Git Essentials LiveLessons 2e (Video Training), 2nd Edition By Daniel Y. Chen Published Sep 20, 2021 by Addison-Wesley Professional. Part of the LiveLessons series. Your browser doesn't support playback of this video. Please download the file to view it. Introduction Lesson 2: Git Basics on the Local Machine Summary Online Video Your Price: $239.99 List Price: $299.99 About this video Video accessible from your Account page after purchase. Add to cart Add To My Wish List Register your product to gain access to bonus material or receive a coupon. Description tabArray.push('93f55b7e-b553-4a5e-8cef-199a361488c6'); Sample Content tabArray.push('0f8fc8f7-6d8d-4816-9b68-458cbd7149e6'); Updates tabArray.push('5ee7e6a0-2896-4293-85db-a976142bac52'); More Information Description Copyright 2022 Edition: 2nd Online Video ISBN-10: 0-13-744093-6 ISBN-13: 978-0-13-744093-1 6 Hours of Video InstructionHands-On Approach to Learning the Git Version Control SystemOverviewGit Essentials LiveLessons, Second Edition, provides you with functional, hands-on instruction on how to create, change, merge, branch, and otherwise manage repositories.About the InstructorDaniel Chen is a data science instructor, holds an MPH in epidemiology from Columbia University, and is a PhD candidate at Virginia Tech studying data science education in the biomedical sciences. He is also a Carpentries instructor, instructor trainer, and the current community maintainer lead.Skill LevelBeginner to IntermediateLearn How ToUnderstand what Git can doStart a repository in a couple of different waysAdd and commit changes to a repositoryCompare diffsUse remotesUse branchesUse workflowsUse GUI-based versions of GitWho Should Take This CourseAnyone who needs version control for their IT projects or wants to learn how to collaborate with others using GitCourse RequirementsAbility to use the command lineAbility to use a terminal editorLesson DescriptionsLesson 1: Setting Up GitIn Lesson 1, Daniel introduces Git and then covers how to get everything installed and ready for the rest of the course. He discusses the reasons for using Git through the command line as well as through graphic user interfaces. The lesson covers the installation steps for installing Git for the first time as well as configuration. Lesson 2: Git Basics on the Local MachineLesson 2 cover the basic Git commands you will need to know while working on your local computer. It begins with how to create a repository. It shows you two ways to do that: starting from a local computer or starting from a remote. Daniel then turns to commits, the way to save a snapshot of your repository. He follows up on that with a look at the history log and the various things you can do with that, such as looking at the history, comparing files at various points in your history, undoing changes, restoring files, and going to a previous state in history. The lesson finishes up with how to ignore files and folders. The lesson provides you with the foundational skills you need to work on your own repository on your own computer. Lesson 3: Working with RemotesIn Lesson 3 you take your local repository and connect it with a remote Git hosting service such as GitHub, BitBucket, or GitLab. Daniel begins with what makes for a remote and then covers pushing to remotes using HTTP and SSH. He then turns to pushing and pulling commits. Next, he discusses that fact that, given that your repository is now in more than one place, changes can be made in those different places and the need to coordinated and synchronize changes. Some of the changes will cause conflicts and will need to be resolved. Daniel also discusses the fact that when you are using an online Git hosting service you can leverage the service to help with project management. Finally, Daniel shows you the preferred way to start a new project from the remote.Lesson 4: Working with Local BranchesIn Lesson 4, Daniel sets the foundations for working in collaborative teams. You will use branches so when multiple people are working on the same repository you can isolate their work from one another. Branches also enable us to work on new features without affecting the parts of the project that currently work. You will learn how to collaborate by collaborating with yourself. You start off by creating and switching between your branches and then learn how branches affect how your commit logs look, as well as how to clean them up. You also learn how branches affect your commits. Finally, Daniel covers merging branches and incorporating changes from the main branch and our current branch using Git rebase.Lesson 5: Incorporate Branch ChangesLesson 5 goes into detail on all the ways different branches can be updated by incorporating changes from the base branch before the branch gets merged. Daniel starts off by setting up the branch scenario followed by a review of how branches can be incorporated by directly using merge and rebase. He also covers how you can use interactive rebase to squash commits before rebasing. This practice will change the commit history of the branch but may make it easier to work with conflicts. Finally, Daniel shows you how to stash and pop changes when you start jumping around your branches.Lesson 6: Work and Merge with Remote BranchesLesson 6 integrates all the things you learned about making commits and branches with Git and how to combine those skills with a remote Git service such as GitHub, Bitbucket, or GitLab. You will see how branches can be pushed to and pulled from the remote, how a merge on the remote is handled by a pull request or merge request, and how to merge and fix merge conflicts in a pull request. This sets the foundation for collaborating with others by using the same collaboration techniques to collaborate with yourself.Lesson 7: Git WorkflowsLesson 7 covers the different ways you can set up a Git workflow for collaboration. Daniel has already covered the basic mechanics of using Git and synchronizing a local repository with a remote repository in the previous lessons. This lesson emphasizes how these skills can be used in a collaboration framework. The first part covers how to add a collaborator to a repository as you might on small projects or teams. Next, Daniel turns to using branching to set things up so team members can work independently on a project. Adding branch protection rules is the logical next step to enforce a branching workflow. For those looking for more branching structure there is a workflow called Gitflow workflow. It uses explicit branch naming conventions and includes a development or dev branch to test new features before they are incorporated into the main branch. Finally, Daniel covers the forking workflow for collaboration. This workflow is typically used in large open-source projects where you do not want to give collaborators direct write access to your repository. These Git workflow techniques all build on the fundamental skills of working with branches on your own, so you can always practice these techniques on your own by collaborating with yourself. Lesson 8: Git GUIsLesson 8 introduces a few Git graphical user interfaces (GUIs). Daniel covers the ones that may be installed with Git: GitHub Desktop, Git Cola, VS Code and its base, and GitLens extension. Then, he turns to how Git may be integrated into integrated development environment (IDEs) for the R programming language in RStudio and for the Python programming language in PyCharm. Daniel notes that GUIs make some Git commands easier to work with, and some GUIs are more complete than others. About Pearson Video TrainingPearson publishes expert-led video tutorials covering a wide selection of technology topics designed to teach you the skills you need to succeed. These professional and personal technology videos feature world-leading author instructors published by your trusted technology brands: Addison-Wesley, Cisco Press, Pearson IT Certification, Sams, and Que. Topics include IT Certification, Network Security, Cisco Technology, Programming, Web Development, Mobile Development, and more. Learn more about Pearson Video training at http://www.informit.com/video.Video Lessons are available for download for offline viewing within the streaming format. Look for the green arrow in each lesson.  Sample Content Table of Contents IntroductionLesson 1: Setting Up GitLearning objectives1.1 Understand what Git can do for you 1.2 Install Git1.3 Configure Git Lesson 2: Git Basics on the Local MachineLearning objectives2.1 Start a repository in two different ways 2.2 Add and commit your changes 2.3 Look at your history log 2.4 Compare file diff(erences) while working 2.5 Compare diff(erences) from previous commits 2.6 Restore and reset new changes 2.7 Restore and check out past commits 2.8 Check out a detached HEAD 2.9 Review restore and checkout 2.10 Ignore files and folders Lesson 3: Working with Remotes Learning objectives3.1 Understanding remotes3.2 Push to remotes using HTTP3.3 Push to remotes using SSH3.4 Push and pull your commits3.5 Make nonconflicting changes3.6 Fix conflicts3.7 Use GitHub and online remotes for project management3.8 Start your projects in a remoteLesson 4: Working with Local BranchesLearning objectives4.1 Create, switch, and list branches 4.2 Look at your log and clean up branches 4.3 Switch between branches with commits 4.4 Merge branches 4.5 Use rebase to incorporate changesLesson 5: Incorporate Branch ChangesLearning objectives5.1 Set up the branch examples 5.2 Use merge to incorporate changes 5.3 Use rebase to incorporate changes5.4 Squash commits before rebasing5.5 Stash changes before switching to other branchesLesson 6: Work and Merge with Remote BranchesLearning objectives6.1 Sync local work with the remote6.2 The pull request (PR) and merge request6.3 Merge branches via pull request6.4 Fix pull requests with merge conflictsLesson 7: Git WorkflowsLearning objectives7.1 Add a collaborator to repository7.2 Understand branching workflow7.3 Add branch protection rules7.4 Using Git Flow workflow7.5 Understand forking workflowLesson 8: Git GUIsLearning objectives8.1 Understand Git GUIs8.2 Use Git GUI8.3 Use GitHub Desktop8.4 Use Git Cola8.5 Use VS Code8.6 Use RStudio8.7 Use PyCharmSummary  Updates Submit Errata  More Information  appendTabAjax('Reviews', 'ebf03de2-44c6-4d90-89bd-add1096ac20e', '/ProductTabs/Reviews/9780137440931'); displayDefaultTab(''); $(window).resize(function() { if ((document.documentElement.clientWidth > 600) && ($('#bssmoreInformation').hasClass('on'))) { displayDefaultTab(''); } }); InformIT Promotional Mailings & Special Offers ⚠ I would like to receive exclusive offers and hear about products from InformIT and its family of brands. I can unsubscribe at any time. Privacy Notice Overview Pearson Education, Inc., 221 River Street, Hoboken, New Jersey 07030, (Pearson) presents this site to provide information about products and services that can be purchased through this site. This privacy notice provides an overview of our commitment to privacy and describes how we collect, protect, use and share personal information collected through this site. Please note that other Pearson websites and online products and services have their own separate privacy policies. Collection and Use of Information To conduct business and deliver products and services, Pearson collects and uses personal information in several ways in connection with this site, including: Questions and Inquiries For inquiries and questions, we collect the inquiry or question, together with name, contact details (email address, ph