il. Delivery may take as long as 4 to 5 weeks. Priority Mail is a non traceable service and does not have guaranteed delivery times. Priority Mail is free. Shipping Stipulations and Restrictions If your order is shipping Internationally (outside of the U.S.) it may be subject to import duties and taxes, which are levied once the package reaches the destination country. InformIT has no control over these charges and cannot estimate what they will be. Any charge that might be incurred is the customer's responsibility. For further information please contact your local customs office. There may also be one or more possible reasons that this site is unable to offer international shipments and eBook sales in specific countries, including but not limited to United States embargo laws, international distribution rights, international laws, and high fraud patterns. Please note that we are unable to ship to P.O. boxes. Backordered Products We will notify you if one of your selections is on backorder, and retain this back order for out of stock products for 30 days. If the product is not back in stock after this period, we will cancel the item(s) on backorder and you will receive an email confirmation of the cancellation. If the product is back in stock within 30 days, we will fulfill the original order. Note that if only part of your order of multiple products is out of stock, the in-stock items will be shipped right away. You can always cancel your order while you are waiting for it to get back in stock. Simply email your request to customer-service@informit.com. Please be sure to include your order number with your request. Bank/Credit Card Charges Important note: Your bank/credit card account statements may display both a pre-authorization charge and the finalized charge at the same time, depending on the bank and the timing of your order. This is merely a temporary duplicate listing, but not a duplicate charge. Rest assured, these line items refer to the same transaction,