description = "About Katrina Hi, I’m Katrina Bahl, the CEO, author, photographer, videographer, and recipe developer behind the popular dessert blog In Katrina’s Kitchen- “where dessert is always served first.” Here, you can expect to find over-the-top sweet treats and delicious desserts wholesome enough to enjoy daily. I’m a wife and a mom in a house full …"
full_description = 'Home » About About About Katrina Hi, I’m Katrina Bahl, the CEO, author, photographer, videographer, and recipe developer behind the popular dessert blog In Katrina’s Kitchen- “where dessert is always served first.” Here, you can expect to find over-the-top sweet treats and delicious desserts wholesome enough to enjoy daily. I’m a wife and a mom in a house full of boys who like to eat. My husband and I are high school sweethearts and have had the privilege of getting to know each other since 1995. We have lived in a few places, including Illinois and Georgia, but we call Ohio, where we grew up and fell in love, home. Our two growing teenage boys and our lovable dog, Chewbacca, have me outnumbered as the only girl in the house. <img decoding="async" width="720" height="960" src="https://www.inkatrinaskitchen.com/wp-content/uploads/2024/03/PXL_20230602_235436139-720x960.jpg" alt="" class="wp-image-10441" data-pin-description="About" data-pin-title="" srcset="https://www.inkatrinaskitchen.com/wp-content/uploads/2024/03/PXL_20230602_235436139-720x960.jpg 720w, https://www.inkatrinaskitchen.com/wp-content/uploads/2024/03/PXL_20230602_235436139-300x400.jpg 300w, https://www.inkatrinaskitchen.com/wp-content/uploads/2024/03/PXL_20230602_235436139-768x1024.jpg 768w, https://www.inkatrinaskitchen.com/wp-content/uploads/2024/03/PXL_20230602_235436139-1152x1536.jpg 1152w, https://www.inkatrinaskitchen.com/wp-content/uploads/2024/03/PXL_20230602_235436139-1536x2048.jpg 1536w, https://www.inkatrinaskitchen.com/wp-content/uploads/2024/03/PXL_20230602_235436139-640x853.jpg 640w, https://www.inkatrinaskitchen.com/wp-content/uploads/2024/03/PXL_20230602_235436139-150x200.jpg 150w, https://www.inkatrinaskitchen.com/wp-content/uploads/2024/03/PXL_20230602_235436139-scaled.jpg 1920w" sizes="(max-width: 720px) 100vw, 720px" /> Education Katrina has a Bachelor of Arts in Early Childhood Education and taught in the Chicago area as a reading specialist. She began her recipe website shortly after moving to Ohio in 2011. About In Katrina’s Kitchen InKatrinasKitchen.com began in 2011 and has since built a loyal international following via social media. At its start, it was named a 2012 and 2013 Top 100 Mom Food Blog and Pinterest Top 20 Dessert Blog, and it has been featured on the TODAY Show, Parents Magazine, Taste of Home Magazine, Woman’s World, and many other places online and in print. The Cookbook Publication date: November 3, 2014. Katrina discovered Biscoff when her son was diagnosed with a peanut allergy. The Biscoff brand approached her to write and photograph their cookbook. The Biscoff Cookie and Spread Cookbook is available to download or purchase. <img decoding="async" width="240" height="240" src="https://www.inkatrinaskitchen.com/wp-content/uploads/2014/11/The-Biscoff-Cookie-and-Spread-Cookbook-by-Katrina-Bahl-2-240x240.jpg" alt="The Biscoff Cookie and Spread Cookbook by Katrina Bahl Cover" class="wp-image-5025" data-pin-description="The Biscoff Cookie and Spread Cookbook by Katrina Bahl Cover" data-pin-title="" srcset="https://www.inkatrinaskitchen.com/wp-content/uploads/2014/11/The-Biscoff-Cookie-and-Spread-Cookbook-by-Katrina-Bahl-2-240x240.jpg 240w, https://www.inkatrinaskitchen.com/wp-content/uploads/2014/11/The-Biscoff-Cookie-and-Spread-Cookbook-by-Katrina-Bahl-2-150x150.jpg 150w, https://www.inkatrinaskitchen.com/wp-content/uploads/2014/11/The-Biscoff-Cookie-and-Spread-Cookbook-by-Katrina-Bahl-2-300x300.jpg 300w, https://www.inkatrinaskitchen.com/wp-content/uploads/2014/11/The-Biscoff-Cookie-and-Spread-Cookbook-by-Katrina-Bahl-2-250x250.jpg 250w, https://www.inkatrinaskitchen.com/wp-content/uploads/2014/11/The-Biscoff-Cookie-and-Spread-Cookbook-by-Katrina-Bahl-2-500x500.jpg 500w, https://www.inkatrinaskitchen.com/wp-content/uploads/2014/11/The-Biscoff-Cookie-and-Spread-Cookbook-by-Katrina-Bahl-2.jpg 600w" sizes="(max-width: 240px) 100vw, 240px" /> Katrina is PR-friendly and would love to hear more about working with your brand. She has worked with KitchenAid, Macy’s, OXO, Silpat, Biscoff, and more. She has been a brand ambassador for companies such as the American Dairy Association Mideast, the Ohio Poultry Association, HERSHEY, McCormick, Verizon Wireless, Princess Cruises, and more.'
