title = "Best Sugar Cookie Recipe | In Katrina's Kitchen"
description = "This is the BEST sugar cookie recipe– no chilling the dough, cookies keep their shape when baked, soft and flavorful, perfect for decorating. Every year millions of people print this Best Sugar Cookie Recipe EVER from In Katrina’s Kitchen. I have been using this recipe for over 25 years, and it has never failed me. …"
full_description = '''Home » Cookies » Best Sugar Cookie Recipe EVER Best Sugar Cookie Recipe EVER Jump to Recipe by Katrina Bahl This post may contain affiliate links. Please read my Privacy Policy. PinSharePostThis is the BEST sugar cookie recipe– no chilling the dough, cookies keep their shape when baked, soft and flavorful, perfect for decorating. <img fetchpriority="high" decoding="async" class="aligncenter size-full wp-image-7941" src="https://www.inkatrinaskitchen.com/wp-content/uploads/2011/12/Best-Sugar-Cookie-Recipe.png" alt="cut out sugar cookies in christmas shapes laid out on a baking sheet some are frosted some are not" width="600" height="1200" data-pin-description="This is THE BEST Sugar Cookie Recipe ever! Millions of viewers and pinners every year agree. You don't need to chill the dough before rolling, so this is also the EASIEST Sugar Cookie Recipe by far! " data-pin-title="" srcset="https://www.inkatrinaskitchen.com/wp-content/uploads/2011/12/Best-Sugar-Cookie-Recipe.png 600w, https://www.inkatrinaskitchen.com/wp-content/uploads/2011/12/Best-Sugar-Cookie-Recipe-300x600.png 300w" sizes="(max-width: 600px) 100vw, 600px" /> Every year millions of people print this Best Sugar Cookie Recipe EVER from In Katrina’s Kitchen. I have been using this recipe for over 25 years, and it has never failed me. The texture is medium-soft, but you can bake them longer if you prefer a crisp cookie. This cookie is my absolute favorite, and I have spent many years perfecting it for friends and family. <img decoding="async" class="aligncenter size-full wp-image-7950" src="https://www.inkatrinaskitchen.com/wp-content/uploads/2011/12/Best-Sugar-Cookie-Recipe-Ever-close-up.png" alt="snowflake cut out cookie on table top with other cookies laying beside" width="600" height="907" data-pin-description="This is THE BEST Sugar Cookie Recipe EVER for cut out cookies. No chilling the dough beforehand!!!!!!" data-pin-title="" srcset="https://www.inkatrinaskitchen.com/wp-content/uploads/2011/12/Best-Sugar-Cookie-Recipe-Ever-close-up.png 600w, https://www.inkatrinaskitchen.com/wp-content/uploads/2011/12/Best-Sugar-Cookie-Recipe-Ever-close-up-300x454.png 300w" sizes="(max-width: 600px) 100vw, 600px" /> Why is This the BEST Sugar Cookie Recipe? The dough comes together quickly with simple pantry ingredients. It does NOT need to be chilled. The recipe can be doubled easily. Cookies hold their shape with very little expanding when baked. Baked cookies freeze well. <img decoding="async" class="aligncenter size-full wp-image-7954" src="https://www.inkatrinaskitchen.com/wp-content/uploads/2011/12/Best-Sugar-Cookie-Recipe-Ever-text.png" alt="unfrosted christmas cut out cookies laying flat on a white surface with text Best Sugar Cookie Recipe" width="600" height="907" data-pin-description="This is THE BEST Sugar Cookie Recipe ever! Millions of viewers and pinners every year agree. You do not need to chill the dough before rolling, so this is also the EASIEST Sugar Cookie Recipe by far! " data-pin-title="" srcset="https://www.inkatrinaskitchen.com/wp-content/uploads/2011/12/Best-Sugar-Cookie-Recipe-Ever-text.png 600w, https://www.inkatrinaskitchen.com/wp-content/uploads/2011/12/Best-Sugar-Cookie-Recipe-Ever-text-300x454.png 300w" sizes="(max-width: 600px) 100vw, 600px" /> The recipe I am giving you makes a large batch of dough because I like to bake many cookies. Also, I like to roll and cut my cookies fairly thick…to hold a lot of frosting. Incorporating the last cup of flour may look dry and look crumbly. Turn out the dough onto your countertop and work with wet hands and/or more flour until the dough is smooth and ready to roll. <img decoding="async" class="aligncenter size-full wp-image-7944" src="https://www.inkatrinaskitchen.com/wp-content/uploads/2011/12/Best-Sugar-Cookie-recipe-process.png" alt="crumbly dough in mixer bowl then on floured surface then shown smooth and ready to roll out" width="600" height="1200" data-pin-description="You won't believe this is the best sugar cookie recipe ever!" data-pin-title="" srcset="https://www.inkatrinaskitchen.com/wp-content/uploads/2011/12/Best-Sugar-Cookie-recipe-process.png 600w, https://www.inkatrinaskitchen.com/wp-content/uploads/2011/12/Best-Sugar-Cookie-recipe-process-300x600.png 300w" sizes="(max-width: 600px) 100vw, 600px" /> Most asked Q and A about this Recipe Butter questions It is most important to note that the butter does not have to be at room temperature. We do not recommend rock-hard butter but allow the butter to sit on the countertop for 10-15 minutes while you assemble your ingredients. If you can press your finger into the butter and you can easily make a deep indent then the butter is too soft. You should be able to press the butter and make a small fingerprint. A tip for mixing butter is to cut it into cubes (or just small pats) before creaming with the sugar. The dough is sticky and/or crumbly. What can I do? The final dough really comes together and has a texture close to Play-Doh. Wet your hands if you need to. Turn out the dough onto a floured surface. Don’t be afraid to use more flour and incorporate it in while you are “kneading” it into a smooth ball. Forget everything you know about sugar cookie dough. Don’t be afraid of sprinkling more flour as you roll it out. Use the scraps! Mix them back into the unused dough and keep going. Can I chill the dough? I want to chill the dough. Actually, I need to make these 3 days in advance, is that okay? If you need to make the dough in advance, you can chill it. Wrap it tightly with plastic wrap and store it in the refrigerator. Bring the dough to room temperature before rolling and cutting. You may need to use more flour on the countertop. The cookies look under-baked. Can I bake them longer? I almost always suggest pulling out these cookies and the 8-9 minute mark for large cookie cutters, and 6-8 minutes for small cookie cutters. They will continue baking on the cookie sheet for a few minutes while they cool and set. After cooling for about 5 minutes, I use a spatula to transfer them to a wire rack. Can I omit the almond extract? You can omit the almond extract. If not using almond extract, replace it with an equal amount of pure vanilla extract. You can use any of your favorite flavorings in this cookie. I have used peppermint, maple, and lemon with great success. How Do I Make these Cookies Gluten-Free? To make these the best gluten-free Sugar Cookie, swap out the flour for your favorite gluten-free 1:1 flour. I use King Arthur Flour Measure for Measure Flour What is your favorite Christmas Cookie Frosting Recipe? I’m happy you asked! I like a soft, sweet frosting. Here is my favorite Christmas Cookie Frosting. Click here for my Small Batch Royal Icing recipe (it dries smooth and hard and is perfect for holding together gingerbread houses, too!). You could also try our Three Ingredient Chocolate Glaze <img decoding="async" class="aligncenter wp-image-6075 size-full" src="https://www.inkatrinaskitchen.com/wp-content/uploads/2016/12/Christmas-Cookie-Frosting-6-text-200.jpg" alt="frosted christmas cut out cookies snowflake christmas tree candy canes snowman on a white surface" width="500" height="750" data-pin-nopin="true" data-sr-force-nopin-value="true" data-pin-description="frosted christmas cut out cookies snowflake christmas tree candy canes snowman on a white surface" data-pin-title="" srcset="https://www.inkatrinaskitchen.com/wp-content/uploads/2016/12/Christmas-Cookie-Frosting-6-text-200.jpg 500w, https://www.inkatrinaskitchen.com/wp-content/uploads/2016/12/Christmas-Cookie-Frosting-6-text-200-160x240.jpg 160w" sizes="(max-width: 500px) 100vw, 500px" /> I hope you love this Best Sugar Cookie recipe as much as our family does! Merry Christmas! <img decoding="async" style="border-width: 0px;border-style: solid;border-color: #666666;" width="250" height="250" src="https://www.inkatrinaskitchen.com/wp-content/uploads/2011/12/Basic-Sugar-Cookie-Dough-204wm-250x250.jpg" class="attachment-square size-square" alt="Basic Sugar Cookie Dough from @katrinaskitchen" srcset="https://www.inkatrinaskitchen.com/wp-content/uploads/2011/12/Basic-Sugar-Cookie-Dough-204wm-250x250.jpg 250w, https://www.inkatrinaskitchen.com/wp-content/uploads/2011/12/Basic-Sugar-Cookie-Dough-204wm-150x150.jpg 150w, https://www.inkatrinaskitchen.com/wp-content/uploads/2011/12/Basic-Sugar-Cookie-Dough-204wm-300x300.jpg 300w, https://www.inkatrinaskitchen.com/wp-content/uploads/2011/12/Basic-Sugar-Cookie-Dough-204wm-500x500.jpg 500w" sizes="(max-width: 250px) 100vw, 250px" /> Best Sugar Cookie Recipe Yield: 36 cookies Prep Time: 30 minutes minsTotal Time: 38 minutes mins Soft cut out sugar cookie recipe that keeps its shape and dough does not need to be chilled before baking- perfect edges every time! #wprm-recipe-rating-0 .wprm-rating-star.wprm-rating-star-full svg * { fill: #ce1f66; }#wprm-recipe-rating-0 .wprm-rating-star.wprm-rating-star-33 svg * { fill: url(#wprm-recipe-rating-0-33); }#wprm-recipe-rating-0 .wprm-rating-star.wprm-rating-star-50 svg * { fill: url(#wprm-recipe-rating-0-50); }#wprm-recipe-rating-0 .wprm-rating-star.wprm-rating-star-66 svg * { fill: url(#wprm-recipe-rating-0-66); }linearGradient#wprm-recipe-rating-0-33 stop { stop-color: #ce1f66; }linearGradient#wprm-recipe-rating-0-50 stop { stop-color: #ce1f66; }linearGradient#wprm-recipe-rating-0-66 stop { stop-color: #ce1f66; } 1069 reviews Leave a Review » Print Recipe Pin Recipe Ingredients▢ 1 Cup unsalted butter, 226 grams▢ 1 Cup granulated white sugar, 200 grams▢ 1 teaspoon vanilla extract▢ 1/2 teaspoon almond extract▢ 1 egg▢ 2 teaspoons baking powder▢ 1/2 teaspoon salt▢ 3 cups all purpose flour, 360 grams ul.wprm-advanced-list-4159 li:before {background-color: #ce1f66;color: #ffffff;width: 22px;height: 22px;font-size: 12px;line-height: 12px;}Instructions PREHEAT oven to 350° F.In the bowl of your mixer, CREAM butter and sugar until smooth, at least 3 minutesBEAT in extracts and egg. (PLEASE NOTE there is 1 egg in this recipe.)In a separate bowl, COMBINE baking powder and salt with flour and add a little at a time to the wet ingredients. IMPORTANT NOTE: If the dough looks crumbly keep mixing for 30 seconds to 1 minute longer. The dough should be pulling away from the sides of the mixer. If the dough still looks too dry or stiff for your mixer, turn out the dough onto a countertop surface, flour surface as needed. Wet your hands and finish off kneading the dough by hand.DO NOT CHILL THE DOUGH. Divide into workable batches (2-3 chunks), roll out onto a floured surface, and cut. You want these cookies to be on the thicker side (closer to 1/4 inch rather than 1/8).Bake at 350 for 6-8 minutes. Let cool on the cookie sheet until firm enough to transfer to a cooling rack. Notes amzn_assoc_placement = "adunit0"; amzn_assoc_search_bar = "true"; amzn_assoc_tracking_id = "inkatskit-20"; amzn_assoc_ad_mode = "manual"; amzn_assoc_ad_type = "smart"; amzn_assoc_marketplace = "amazon"; amzn_assoc_region = "US"; amzn_assoc_title = "My Amazon Picks"; amzn_assoc_linkid = "4d5aca266b52b8e1913bde5feba9b714"; amzn_assoc_asins = "B018YAXX7Y,B012W9BHBW,B00008T960,B00282JLDK,B00266PQ82,B07RD58G24,B001X53NC8"; NutritionCalories: 107kcal, Carbohydrates: 14g, Protein: 1g, Fat: 5g, Saturated Fat: 3g, Cholesterol: 18mg, Sodium: 59mg, Potassium: 14mg, Fiber: 1g, Sugar: 6g, Vitamin A: 164IU, Calcium: 17mg, Iron: 1mg Course: DessertCuisine: AmericanAuthor: Katrina Bahl Keyword: best, christmas, cookie, frosting, sugar cookie Original recipes and images © In Katrina's Kitchen Did you make this recipe?Tag @katrinaskitchen on Instagram with the hashtag #katrinaskitchenrecipes Troubleshooting Best Sugar Cookie Recipe Scooping and dumping your flour may be the problem! Even with level scooping measurements can vary. Try getting a digital kitchen scale and adding your ingredients by weight. If your cookies seem to consistently need a longer or shorter baking time consider calibrating your oven with an oven thermometer. Bake with a silicone mat or parchment paper. Invest in a small metal cookie spatula to transfer cookies. If left on the counter top for about an hour your butter should be the right consistency- a finger pressed onto the butter will make a slight indent but not sink down into it. (Read more about room temperature butter in this post about XL Bakery Style Cookies.) Whenever a recipe calls for room temperature butter you should use room temperature eggs. To take the chill off of eggs I place them in a shallow bowl of warm (not hot) water for 2-3 minutes. You can then crack them for use in your recipe. <img decoding="async" class="size-full wp-image-3681 aligncenter" src="https://www.inkatrinaskitchen.com/wp-content/uploads/2011/12/Best-Sugar-Cookie-Recipe-In-Katrinas-Kitchen-500.jpg" alt="Best Sugar Cookie Recipe" width="500" height="667" data-pin-description="Best Sugar Cookie Recipe" data-pin-title="" srcset="https://www.inkatrinaskitchen.com/wp-content/uploads/2011/12/Best-Sugar-Cookie-Recipe-In-Katrinas-Kitchen-500.jpg 500w, https://www.inkatrinaskitchen.com/wp-content/uploads/2011/12/Best-Sugar-Cookie-Recipe-In-Katrinas-Kitchen-500-179x240.jpg 179w" sizes="(max-width: 500px) 100vw, 500px" /> Looking for more Christmas Cookies? Try my Christmas Cookie archive for some of the most adorable and delicious Christmas cookies. Some of my favorites are Grinch Cookies and Ugly Christmas Sweater Sugar Cookie Bars. For something different, try Christmas Tree Meringue Cookies. PinSharePost All Recipes, Christmas, Christmas Cookie Tray Favorites, Cookies, Holidays, Popular posted on December 29, 2011 — updated December 3, 2021 // 2,439 comments'''
