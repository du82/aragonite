title = "Homemade Cadbury Cream Cookie Cups"
description = "Sweet homemade Cadbury Cream filling stuffed into chewy chocolate chip cookie cups. It can be made into mini cookie cups if desired. Make homemade Cadbury Cream eggs at home with this simple recipe. The secret ingredient to making the creamy Cadbury filling is corn syrup. You just need a tiny bit, but it makes all …"
full_description = '''Home » Holidays » Easter » Homemade Cadbury Cream Cookie Cups Homemade Cadbury Cream Cookie Cups Jump to Recipe by Katrina Bahl This post may contain affiliate links. Please read my Privacy Policy. PinSharePostSweet homemade Cadbury Cream filling stuffed into chewy chocolate chip cookie cups. It can be made into mini cookie cups if desired. Make homemade Cadbury Cream eggs at home with this simple recipe. The secret ingredient to making the creamy Cadbury filling is corn syrup. You just need a tiny bit, but it makes all the difference in this Spring staple. The Original Recipe from In Katrina’s Kitchen <img fetchpriority="high" decoding="async" class="aligncenter size-large wp-image-9015" src="https://www.inkatrinaskitchen.com/wp-content/uploads/2012/03/Cadbury-Cream-Cookie-Cup-collage-image-720x1440.jpg" alt="cookie cups with frosting oozing out collage image with text homemade cadbury cream cookie cups an easter favorite" width="720" height="1440" data-pin-description="Sweet homemade Cadbury Cream filling stuffed into chewy chocolate chip cookie cups. Can be made into mini cookie cups if desired. PRINT and PIN this recipe and more Easter favorites at In Katrina's Kitchen today!" data-pin-title="Homemade Cadbury Cream Cookie Cups" srcset="https://www.inkatrinaskitchen.com/wp-content/uploads/2012/03/Cadbury-Cream-Cookie-Cup-collage-image-720x1440.jpg 720w, https://www.inkatrinaskitchen.com/wp-content/uploads/2012/03/Cadbury-Cream-Cookie-Cup-collage-image-300x600.jpg 300w, https://www.inkatrinaskitchen.com/wp-content/uploads/2012/03/Cadbury-Cream-Cookie-Cup-collage-image-768x1536.jpg 768w, https://www.inkatrinaskitchen.com/wp-content/uploads/2012/03/Cadbury-Cream-Cookie-Cup-collage-image-150x300.jpg 150w, https://www.inkatrinaskitchen.com/wp-content/uploads/2012/03/Cadbury-Cream-Cookie-Cup-collage-image.jpg 1000w" sizes="(max-width: 720px) 100vw, 720px" /> The first day of spring should be celebrated, don’t you think? St. Patrick’s Day is fun and all but thankfully, Target breaks out the cream eggs in January. Seriously, how many of us have bought the infamous eggs for our children’s Easter basket only to buy them again (and again) to cover our transgressions? <img decoding="async" class="aligncenter" style="border: 0px;" title="The Original Cadbury Cream Cookie Cups Recipe" src="https://1.bp.blogspot.com/-69dgd9cp0FU/T2fCv2tYJrI/AAAAAAAABTE/1qzQOIvXZ3k/s640/Cadbury+Cream+Cookie+Cups+008text.jpg" alt="Cadbury Cream Cookie Cups Recipe - Homemade Cadbury Cream tucked inside a delicious chocolate chip cookie cup" width="480" height="640" border="0" data-pin-description="Cadbury Cream Cookie Cups Recipe - Homemade Cadbury Cream tucked inside a delicious chocolate chip cookie cup" data-pin-title=""> Homemade Cadbury Cream It is simple and delicious to make Homemade Cadbury Cream. When we made the famous cream eggs, we all sat back and enjoyed our chocolate. The kitchen however looked like an Easter weekend crime scene. There was chocolate everywhere, and sticky cream fingerprints adorned every surface. Being the lazy creative person that I am, the idea for these homemade Cadbury cream cookie cups was born. <img decoding="async" class="aligncenter size-large wp-image-9021" src="https://www.inkatrinaskitchen.com/wp-content/uploads/2012/03/Chocolate-chip-cookie-dough-cups-720x1140.jpg" alt="chocolate chip cookie dough in a muffin tin" width="720" height="1140" data-pin-description="This SHOWSTOPPER DESSERT starts with a tube of chocolate chip cookie dough! " data-pin-title="Homemade Cadbury Cream Cookie Cups" srcset="https://www.inkatrinaskitchen.com/wp-content/uploads/2012/03/Chocolate-chip-cookie-dough-cups-720x1140.jpg 720w, https://www.inkatrinaskitchen.com/wp-content/uploads/2012/03/Chocolate-chip-cookie-dough-cups-300x475.jpg 300w, https://www.inkatrinaskitchen.com/wp-content/uploads/2012/03/Chocolate-chip-cookie-dough-cups-768x1216.jpg 768w, https://www.inkatrinaskitchen.com/wp-content/uploads/2012/03/Chocolate-chip-cookie-dough-cups-970x1536.jpg 970w, https://www.inkatrinaskitchen.com/wp-content/uploads/2012/03/Chocolate-chip-cookie-dough-cups-150x238.jpg 150w, https://www.inkatrinaskitchen.com/wp-content/uploads/2012/03/Chocolate-chip-cookie-dough-cups.jpg 1288w" sizes="(max-width: 720px) 100vw, 720px" /> Chocolate Chip Cookie Cups You can make homemade chocolate chip cookie dough, or begin with a tube of store-bought cookie dough to make this showstopper Easter dessert even easier! This recipe makes 12 large cream-filled cookie cups. This recipe can be adapted to make 24 smaller cookie cups by using a mini muffin tin. You do not need to use cupcake liners to make cookie cups, but there is no harm in doing so. <img decoding="async" class="aligncenter size-large wp-image-9020" src="https://www.inkatrinaskitchen.com/wp-content/uploads/2012/03/Homemade-Cadbury-Cream-Cookie-Cups-pic-720x1440.jpg" alt="Easter cookie cup being pulled upen with the text homemade Cadbury cream cookie cups" width="720" height="1440" data-pin-description="Sweet homemade Cadbury Cream filling stuffed into chewy chocolate chip cookie cups. Can be made into mini cookie cups if desired. PRINT and PIN this recipe and more Easter favorites at In Katrina's Kitchen today!" data-pin-title="Homemade Cadbury Cream Cookie Cups" srcset="https://www.inkatrinaskitchen.com/wp-content/uploads/2012/03/Homemade-Cadbury-Cream-Cookie-Cups-pic-720x1440.jpg 720w, https://www.inkatrinaskitchen.com/wp-content/uploads/2012/03/Homemade-Cadbury-Cream-Cookie-Cups-pic-300x600.jpg 300w, https://www.inkatrinaskitchen.com/wp-content/uploads/2012/03/Homemade-Cadbury-Cream-Cookie-Cups-pic-768x1536.jpg 768w, https://www.inkatrinaskitchen.com/wp-content/uploads/2012/03/Homemade-Cadbury-Cream-Cookie-Cups-pic-150x300.jpg 150w, https://www.inkatrinaskitchen.com/wp-content/uploads/2012/03/Homemade-Cadbury-Cream-Cookie-Cups-pic.jpg 1000w" sizes="(max-width: 720px) 100vw, 720px" /> Copycat Cadbury Cream Egg Recipe You only need 5 ingredients to make these cookie cups at home: Butter Corn Syrup Vanilla extract Powdered sugar Cookie dough Switch things up and make Cadbury Cream Egg Brownies! <img decoding="async" style="border-width: 0px;border-style: solid;border-color: #666666;" width="250" height="250" src="https://www.inkatrinaskitchen.com/wp-content/uploads/2012/03/Cadbury-Cream-Cookie-Cups-055wm250-250x250.jpg" class="attachment-square size-square" alt="Cadbury Cream Cookie Cups from @KatrinasKitchen" srcset="https://www.inkatrinaskitchen.com/wp-content/uploads/2012/03/Cadbury-Cream-Cookie-Cups-055wm250.jpg 250w, https://www.inkatrinaskitchen.com/wp-content/uploads/2012/03/Cadbury-Cream-Cookie-Cups-055wm250-240x240.jpg 240w, https://www.inkatrinaskitchen.com/wp-content/uploads/2012/03/Cadbury-Cream-Cookie-Cups-055wm250-150x150.jpg 150w" sizes="(max-width: 250px) 100vw, 250px" /> Cadbury Cream Cookie Cups Recipe Yield: 12 Cookie Cups Prep Time: 10 minutes minsCook Time: 15 minutes minsTotal Time: 25 minutes mins Homemade Cadbury Cream filling stuffed into chewy chocolate chip cookie cups. #wprm-recipe-rating-0 .wprm-rating-star.wprm-rating-star-full svg * { fill: #ce1f66; }#wprm-recipe-rating-0 .wprm-rating-star.wprm-rating-star-33 svg * { fill: url(#wprm-recipe-rating-0-33); }#wprm-recipe-rating-0 .wprm-rating-star.wprm-rating-star-50 svg * { fill: url(#wprm-recipe-rating-0-50); }#wprm-recipe-rating-0 .wprm-rating-star.wprm-rating-star-66 svg * { fill: url(#wprm-recipe-rating-0-66); }linearGradient#wprm-recipe-rating-0-33 stop { stop-color: #ce1f66; }linearGradient#wprm-recipe-rating-0-50 stop { stop-color: #ce1f66; }linearGradient#wprm-recipe-rating-0-66 stop { stop-color: #ce1f66; } 2 reviews Leave a Review » Print Recipe Pin Recipe Ingredients▢ 16 ounces chocolate chip cookie dough▢ 1/2 cup light corn syrup▢ 1/4 cup butter, softened▢ 1 teaspoon vanilla extract▢ 3 cups powdered sugar▢ 1 drop yellow food coloring ul.wprm-advanced-list-2584 li:before {background-color: #ce1f66;color: #ffffff;width: 22px;height: 22px;font-size: 12px;line-height: 12px;}Instructions START with prepared or purchased chocolate chip cookie dough. Each standard muffin tin should take about 2-3 tablespoons of cookie dough to make the cookie cups.SPRAY a muffin tin with nonstick spray. PRESS 2-3 tablespoons of dough onto the bottom of 12 muffin cups. BAKE for 13-15 minutes until golden. Let cool for 15 minutes in the pan. The middle will sink in. To help it along, you can press a small glass (or spice jar) into the well to create an indentation. While the cookies are warm but still firm, use the tips of your fingers to gently twist the cookie cups up and out of the pan. Let COOL completely.In the bowl of your mixer, COMBINE corn syrup, butter, and vanilla until light in color. Slowly add powdered sugar and mix until smooth.REMOVE 1/4 of the cream and dye with yellow food coloring. Set aside.POUR or scoop the white cream into the cookie cups. Finish off with a small dollop of yellow cream. Video Notes Use a standard size cupcake or muffin tin. Twist and lift the cookie cups out of the tin when they are still slightly warm but firm enough to be transferred without breaking. We used purchased cookie dough, but you can substitute your favorite homemade dough. These can be made into mini cookie cups using a mini muffin pan. Use about 1 tablespoon of cookie dough per cookie cup and adjust baking time to 9-12 minutes. amzn_assoc_placement = "adunit0"; amzn_assoc_search_bar = "true"; amzn_assoc_tracking_id = "inkatskit-20"; amzn_assoc_ad_mode = "manual"; amzn_assoc_ad_type = "smart"; amzn_assoc_marketplace = "amazon"; amzn_assoc_region = "US"; amzn_assoc_title = "My Amazon Picks"; amzn_assoc_linkid = "f27b9468ad96da69eda9d0d2cb73525b"; amzn_assoc_asins = "B001IANICS,B0000CCY1C,B01E0HBUSE,B085LQ1QQF"; Course: DessertCuisine: AmericanAuthor: Katrina Bahl Keyword: chocolate chip, cookie, Easter Original recipes and images © In Katrina's Kitchen Did you make this recipe?Tag @katrinaskitchen on Instagram with the hashtag #katrinaskitchenrecipes If you like these Cadbury Cream Cookie Cups, then be sure to try our other Easter Recipes! PinSharePost All Recipes, Cookies, Easter, Holidays, Other Sweets posted on March 19, 2012 — updated September 19, 2023 // 76 comments'''
