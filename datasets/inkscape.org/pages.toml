["https://inkscape.org/ja/about/overview"]
title = "概要 | Inkscape"
full_description = "Home » Inkscape について » 概要 概要 あらゆるデザイナーに デザイン作業を始めるときは通常、ナプキンにいたずら書きしたり、頭の中で思い描いたり、印象に残るものの写真を撮ったり、それを完成するには不十分なソフトウェアで不完全なモックアップを作るなどするかもしれません。Inkscape なら、その始めから最後までをカバーし、ウェブや物理媒体で公開するに十分なプロ級のデザインフォーマットを提供できます。 ベクター画像の制作が初めてならば少し難しく感じるかもしれませんが、すぐにその柔軟性や Inkscape の強力な機能を気に入ることでしょう。ベクターデザインは、ロゴマークや、イラスト、あるいは状況に応じてサイズ変更が要求されるアートなどの制作でよく使用されます。Inkscape はさまざまな制作現場においてマーケティング/ブランディング、エンジニアリング/CAD、ウェブグラフィックス、マンガの制作などの他、個人でも利用されています。 たくさんの学習教材を用意していますので活用してください！ プロフェッショナルのお仕事 すべての Inkscape プロジェクトは必要に応じてウェブブラウザーや商用印刷に適したファイル形式にエクスポートできます。Inkscape はクロスプラットフォームなので、Windows、Mac OS X、および Linux ディストリビューション上で動作します。今すぐダウンロードして、使ってみてください。 フリーコミュニティ Inkscape はフリーです！ 無料で、利用や配布も、ソースコードを覗くことも自由です。 ダウンロードページでは正式リリースされているバイナリと一緒に開発中のものやソースコードも公開されています。 Inkscape のソフトウェア開発はオープンソースの標準を順守しており、信頼性があり使いやすい製品をユーザーコミュニティに提供することを目的としています。この作業はオープンで、コア部分は小さく、拡張性は高くするためコミュニティ志向の開発を行っています。歴史的には Sodipodi Hydra コードベースをベースラインとしています。もしあなたが Inkscape に興味をもち、スキルやポジティブなご意見をお持ちでしたら、私たちへの参加をご検討ください。開発者向けページにより詳しい情報があります。"
