["https://inkscape.org/fr/apropos"]
title = "À propos | Inkscape"
description = "Inkscape est un logiciel de dessin vectoriel de qualité professionnelle qui fonctionne sur Windows, macOS et GNU/Linux. Inkscape est utilisé par des designers professionnels et des amateurs dans le monde entier pour créer une grande variété de graphismes tels que des illustrations, des icônes, des logos, des diagrammes, des cartes et des rendus pour le web. Inkscape utilise le standard ouvert du W3C : le SVG (Scalable Vector Graphic) comme format natif, et est un logiciel libre et open source."
full_description = "Accueil » À propos À propos d'Inkscape Qu'est-ce qu'Inkscape ? Inkscape est un logiciel de dessin vectoriel de qualité professionnelle qui fonctionne sur Windows, macOS et GNU/Linux. Inkscape est utilisé par des designers professionnels et des amateurs dans le monde entier pour créer une grande variété de graphismes tels que des illustrations, des icônes, des logos, des diagrammes, des cartes et des rendus pour le web. Inkscape utilise le standard ouvert du W3C : le SVG (Scalable Vector Graphic) comme format natif, et est un logiciel libre et open source. Inkscape comprend des outils de dessin sophistiqués avec des possibilités comparables aux autres logiciels de dessin vectoriel connus. Il est compatible avec de nombreux formats de fichiers, parmi lesquels SVG, AI, PDF, EPS, PS et PNG. Il dispose d'un ensemble complet de fonctionnalités, d'une interface simple et du support multilingue. Il est également conçu pour être extensible : les utilisateurs peuvent personnaliser les fonctionnalités d'Inkscape avec des extensions. Le projet Inkscape a une communauté d'utilisateurs internationale, et des supports d'apprentissage variés vous aideront à démarrer vos créations. De l'aide et de l'assistance sont fournies par la communauté, et il y a beaucoup de façon de s'impliquer si vous souhaitez contribuer au développement du projet. Inkscape est membre du Software Freedom Conservancy (le conservatoire de la liberté du logiciel), une organisation US 501(c)(3) non lucrative. Les contributions à Inkscape sont déductibles des impôts aux États-Unis. Qui réalise Inkscape ? Inkscape est l'œuvre de nombreux auteurs, chacun retenant son propre droit d'auteur et étant impliqué dans le choix des objectifs techniques et généraux du projet. D'autres contributeurs ne sont pas familiers avec le code informatique et constituent une part importante du projet Inkscape. Pour désigner les créateurs d'Inkscape ou l'ensemble des contributeurs, vous pouvez parler des « contributeurs d'Inkscape » et du « projet Inkscape » respectivement afin de les différencier du logiciel. Télécharger Vous voulez essayer Inkscape ? Téléchargez ici la dernière version : Téléchargement gratuit Produit avec"
