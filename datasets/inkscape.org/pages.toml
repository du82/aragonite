["https://inkscape.org/de/ueber/uebersicht"]
title = "Übersicht | Inkscape"
full_description = "Startseite » Über » Übersicht Übersicht Für Designer aller Art Der Designprozess kann mit einer Skizze auf einer Serviette, mit einer gezeichneten Mindmap, einem Bild eines unvergesslichen Gegenstandes oder einem Entwurf in einem Programm, das sich nicht zur Fertigstellung Deines Projektes eignet, beginnen. Inkscape kann Dir helfen, dieses Projekt mit professionellem Design fertigzustellen, um es im Internet zu veröffentlichen oder physisch umzusetzen. Wenn Du nicht mit dem Erstellen von Vektorgrafiken vertraut bist, kann dies zunächst ungewohnt sein, aber Du wirst bald von der Flexibilität und dem Funktionsumfang von Inkscape begeistert sein. Vektordesign ist oft der bevorzugte Weg, Logos, Illustrationen und Werke, die in verschiedenen Größen benötigt werden, zu erstellen. Inkscape wird in den unterschiedlichsten Branchen (Marketing, Ingenieurwesen/CAD, Web-Grafiken, Cartoonerstellung) und von privaten Benutzern eingesetzt. Es gibt viel Lernmaterial. Schau dich um! Professionelles Arbeiten Alle Inkscape-Dateien können in Browser-freundlichere oder von Druckereien unterstützte Dateiformate exportiert werden. Inkscape ist plattformunabhängig, was bedeutet, dass man es unter Windows, Mac OS X und Linux benutzen kann. Besuche die Download-Seite, um Inkscape zu installieren oder es mit anderen zu teilen. Freie Community Inkscape ist frei! Damit meinen wir, dass Inkscape nichts kostet, ohne Einschränkungen benutz- und verbreitbar ist, und dass man sich den Quellcode ansehen kann. Die Download-Seite listet veröffentlichte Versionen und einige Entwicklungs- und Quellcodelinks. Die Software-Entwicklung von Inkscape hält sich an die Open-Source-Standards und hat sich zum Ziel gesetzt, dem Anwender ein stabiles und brauchbares Produkt zu liefern. Der Entwicklungsprozess ist offen und community-orientiert und konzentriert sich auf einen kleinen, stabilen Software-Kern und die Erweiterbarkeit desselben. Die historische Grundlage bildet die Sodipodi Hydra-Codebasis. Wenn Du Dich für Inkscape interessierst, für das Projekt hilfreiche Fähigkeiten hast oder einfach gerne anderen zeigen möchtest, wie gut Dir Inskcape gefällt, mach doch einfach bei uns mit. Besuche die Mitmachen-Seite um mehr zu erfahren."
author = "Entwickler der Inkscape-Webseite"
year_published = 2025
