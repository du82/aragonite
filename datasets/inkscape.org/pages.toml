title = "Marke und Design | Inkscape"
full_description = '''Startseite » Über » Marke und Design Inkscape-Marke und -Design Name Inkscape: Open Source Scalable Vector Graphics Editor Hinweise: 'Inkscape' sollte groß geschrieben werden (nicht mit InnenGroßbuchstabe) und besteht aus nur einem einzigen Wort. Der Name 'Inkscape' ist markenrechtlich geschützt. Falsch: inkscape, Ink Scape, Inkspace, InkScape Slogan Draw Freely. Hinweise: Beachte die Großschreibung, und das Vorhandensein des Punktes am Ende. Der Slogan ist markenrechtlich geschützt. Logos Das Logo von Inkscape stellt einen Berg dar. Es gibt davon zwei offizielle Varianten: Die leicht glänzende und dreidimensional wirkende Originalvariante, und die vereinfachte Variante im flachen Design. Vom vereinfachten Logo gibt es wiederum 2 offizielle Varianten: einfarbig: Bevorzugt werden schwarz (auf hellerem Hintergrund) oder weiß (auf ausreichend dunklem Hintergrund), wobei das schwarze Logo vorzuziehen ist. Die verschneite Spitze und der Schneerand sind ausgeschnitten (transparent). zweifarbig: Der Berg und die Tintenspritzer sollten schwarz sein, die verschneite Spitze und der Schneerand weiß. Das Inkscape-Logo ist markenrechtlich geschützt und steht unter der CC-By-SA 3.0-Lizenz. Der Originalautor ist Andrew Michael Fitzsimon. Schriftarten Die Schriftart, die für das Wort 'Inkscape' verwendet werden soll, ist Linux Libertine. Die geschwungene Schriftart, die für den Slogan verwendet wird, ist Euphoria Script. Dateien zum Herunterladen Euphoria Script Regular Extended Linux Libertine Inkscape Logo SVG Inkscape Flat Logo 2 Color Variant Inkscape Flat Logo with Text Inkscape Flat Logo 1 Color Variant - Bl… Inkscape Flat Logo 1 Color Variant - Wh… Richtlinien zur Verwendung der Inkscape-Marke [Anm. d. Ü.: Der offizielle englische Originaltext findet sich unter https://inkscape.org/en/about/branding/. Dies ist lediglich eine inoffizielle deutsche Übersetzung der Inkscape-Markenrechtrichtlinien. Rechtsverbindlich ist ausschließlich der englische Originaltext.] 1 Zweck Die Software Freedom Conservancy (“Conservancy”) hat diese Richtlinien festgelegt, um dafür zu sorgen, dass die Identität des Bildbearbeitungsprogrammes Inkscape und seine Eigenschaft als freie und Open-Source-Software klar ersichtlich ist. Durch die Anwendung dieser Richtlinien kann das Inkscape-Projekt die Verbreitung von Inkscape fördern und gleichzeitig sicherstellen, dass die Marke auf eine Art und Weise geschützt wird, die dem U.S. Markenrecht entspricht. Diese Richtlinie wurde verfasst, um jede eindeutige und angemessene Verwendung der Inkscape-Marken zu erlauben und gleichzeitig mißbräuchliche Verwendung zu verhindern, die Benutzer z.B. im Unklaren darüber lässt, woher die Software stammt. Indem Du Dich an diese Richtlinien hältst, hilfst Du dabei, die Öffentlichkeit über die Freiheiten bei der Nutzung und Entwicklung der Software des Inkscape-Projektes zu informieren. Das Inkscape-Projekt ist ein Mitgliedsprojekt der Conservancy. Die Conservancy hält in Übereinstimmung mit ihrer nichtkommerziellen Zielsetzung die Markenrechte für das Inkscape-Projekt. In den gesamten Leitlinien bezieht sich das Wort "Marken" auf das Folgende: die Wörter "Inkscape", "Inkscapers" und "Live Path Effects" das Logo mit der Darstellung eines Berges ("Inkscape-Logo"), hier abgebildet: das Motto "Draw Freely" [Anm. d. Ü.: in etwa "Zeichne frei" oder "Freies Zeichnen"] Diese Richtlinien befassen sich nur mit den Marken, die zum Inkscape-Projekt gehören, jedoch nicht mit dem Urheberrecht der Software Inkscape. 2 Richtlinien für die Verwendung der Marken 2.1 Markenzeichen-Symbol bei erster Erwähnung Die erste, gut sichtbare Erwähnung des Namen sollte direkt vom Symbol für Markenzeichen gefolgt werden: "™". Beispiel: "Inkscape™". Auf diese Erfordernis wird in allen Zusammenhängen verzichtet, bei denen es nicht üblich ist, solche Zeichen zu verwenden: Email, Online-Diskussionen, nicht-grafische Werbung (sofern diese erlaubt ist) und wissenschaftliche Dokumente. Wir ermuntern zur möglichst häufigen Verwendung des Symbols, aber erkennen auch an, dass es in vielen nichtkommerziellen und informellen Fällen ausgelassen werden wird. 2.2 Verwendung der Marken ohne schriftliche Erlaubnis Die Marken dürfen in folgenden Fällen ohne vorherige schriftliche Erlaubnis verwendet werden (dies ist Gegenstand anderer Abschnitte): Um sich auf die Software Inkscape zu beziehen, wenn sie im Wesentlichen unverändert ist. "Im Wesentlichen unverändert" bedeutet: aus dem Quellcode, den das Inkscape-Projekt zur Verfügung stellt, kompiliert, möglicherweise mit kleineren Modifikationen, wie zum Beispiel (dies ist keine umfassende Auflistung): die Aktivierung oder Deaktivierung bestimmter Funktionen in der Standardversion, Übersetzungen in andere Sprachen, Veränderungen, die für die Kompatibilität mit einem bestimmten Betriebssystem notwendig sind oder auch der Zusatz von fehler-behebendem Code. Um die Software Inkscape als Teil eines Softwareangebotes zu benennen. Um sich auf das Inkscape-Projekt selbst, seine Produkte und seine Protokolle zu beziehen. Zusätzlich dürfen die Marken ohne schriftliche Erlaubnis verwendet werden, um Produkte, Dienstleistungen oder Gemeinschaften außerhalb der Inkscape-Software und des Inkscape-Projektes in den folgenen Fällen zu bezeichnen: Wenn sich die Nennung auf eine nicht unwesentlich veränderte Inkscape-Software bezieht, um auszudrücken, dass selbige Software ein "Derivat von Inkscape" ist oder "auf Inkscape basiert". Wenn sich die Nennung auf Nutzergemeinschaften und ihre Nutzung von Inkscape bezieht, das heißt z.B. virtuelle Gemeinschaften, gemeinschaftlich moderierte Online-Foren, Zusammenschlüsse von Inkscape nutzenden Organisationen usw., unter der Voraussetzung, dass die Marken nicht eingesetzt werden, um zu suggerieren, dass das Inkscape-Projekt hinter einer solchen Nutzergemeinschaft steht oder sie unterstützt. Wir verlangen keine Gebühren für die Verwendung der Markenzeichen in diesen Fällen. Dennoch freuen wir uns sehr über Spenden. Wenn Du daran interessiert bist, dem Inkscape-Projekt über die Conservancy zu spenden, dann besuche http://inkscape.org/donate.php. Die Conservancy ist in den USA eine "public charity" (öffentliche, wohltätige Organisation) nach 501(c)(3). 2.3 Verwendung der Marken als Teil eines Produktnamen Die Marken dürfen als Teil eines Produktnamen für ein Produkt, das mit Inkscape funktioniert, verwendet werden, solange der Name als Ganzes (durch seine anderen Bestandteile) klar und zweifelsfrei das Produkt von der Inkscape-Software abgrenzt und die allgemeine Gestaltung des Produktes keine offizielle Verbindung oder Übereinstimmung der Identität mit dem Inkscape-Projekt nahelegt. Da es seltsam aussehen würde, wenn man ein Markenzeichen-Symbol innerhalb eines größeren Names, dessen andere Teile ebenfalls Markenzeichen enthalten könnten, verwendet, wird unter diesen Umständen auf die Erfordnernis, das Markenzeichen-Symbol abzubilden, verzichtet. 2.4 Verbotene Verwendung der Marken In folgenden Fällen dürfen die Marken nicht verwendet werden: Immer dann, wenn es wahrscheinlich ist, dass hierdurch Verwirrung über die Identität des Inkscape-Projektes, der Herkunft seiner Software oder der Lizenz der Software entstehen kann. Immer dann, wenn eine stärkere Verbindung zwischen dem Nutzer und dem Inkscape-Projekt suggeriert wird als tatsächlich existiert. Immer dann, wenn es so aussieht, als ob es sich um einen Nachfolger von Inkscape handeln würde (z.B. "Inkscape++" ist nicht erlaubt). Immer dann, wenn es so aussieht als ob Inkscape eine Distribution, ein Betriebssystem, ein Produkt usw. einem anderen vorzieht, außer wenn dies ausdrücklich und schriftlich von Inkscape so dargestellt worden ist. 2.5 Grenzen dieser Richtlinie Diese Richtlinie gewährt keine Rechte für die Verwendung der Marken “Software Freedom Conservancy”, “Conservancy” oder irgendwelche anderen Marken, die nicht in Abschnitt 1 aufgeführt sind. Diese Richtlinie berechtigt nicht dazu, dass jemand als Vertreter für die Conservancy agiert, für das Inkscape-Projekt Vereinbarungen trifft oder auf sonstige Weise Verpflichtungen für das Inkscape-Projekt oder die Conservancy verursacht. 2.6 Richtlinien für die Verwendung des Inkscape-Logos Das Inkscape-Logo ist unter der Creative Commons license Attribution-ShareAlike 3.0 United States lizensiert. D as Inkscape-Projekt ermutigt Künstler dazu, das Logo zu verwenden, zu verändern und abgeleitete Werke vom Inkscape-Logo zu erstellen. Trotzdem dient das Inkscape-Logo auch als grafische Marke für das Inkscape-Projekt. Um die Erstellung unterschiedlicher Darstellungen des Inkscape-Logos zu verhindern, die absichtlich oder unabsichtlich mit unserer Marke konkurrieren oder diese verwässern würden, bitten wir darum, dass, wenn das Logo verwendet wird, um sich auf das Inkscape-Projekt und/oder die Inkscape-Software zu beziehen, es gemäß den Richtlinien in diesem Dokument verwendet wird. Wir bitten auch darum, dass das Inkscape-Logo, oder irgend ein Teil davon, nicht als Teil eines Markenzeichens, Logos oder einer Marke, die mit einem anderen Produkt, einer anderen Dienstleistung oder einem anderen Ding als Inkscape in Verbindung stehen, verwendet wird. Zum Beispiel dürfen Künstler gerne abgeleitete Werke unter Verwendung des Inkscape-Logos erstellen - aber ein fiktives Transportunternehmen erhält keine Erlaubnis, dieses abgeleitete Werk in seinem Logo zu verwenden. Das Inkscape-Projekt und die Conservancy behalten sich das Recht vor, die Verwendung des Logos in einer Art und Weise, die nicht mit diesen Richtlinien übereinstimmt und die das Inkscape-Logo schwächen oder verwässern, möglicherweise Verwirrung über die oder eine Verletzung der Markenrechte der Conservancy und des Inkscape-Projektes am Inkscape-Logo auslösen würde, zu verbieten. 2.7 Verwendung der Marken zu Werbezwecken Es ist ohne weitere Erlaubnis erlaubt, Marketingartikel zu erstellen und zu verkaufen, die den Namen Inkscape und das Inkscape-Logo enthalten, vorausgesetzt, dass hierfür nur die unveränderten Bilder von der Logo-Seite auf der Inkscape-Webseite verwendet werden. Bitte nimm Kontakt zu uns auf, wenn Du andere Marketingartikel mit den Marken darauf verkaufen möchtest. Dieser Abschnitt gilt unter dem Vorbehalt, dass die anderen Richtlinien, die in diesem Dokument enthalten sind, einschließlich derer, die sich auf die notwendige Erlaubnis zur Verwendung der Marken und der Verwendung der Marken als Teil eines Produktnamens, beziehen, eingehalten werden. 3 Rechte, die sich die Conservancy vorbehält Die Conservancy behält sich das alleinige Recht vor: Festzustellen, ob etwas diesen Richtlinien entspricht. Diese Regeln in Übereinstimmung mit ihrem Ziel, die Öffentlichkeit zu schützen, zu ändern. Ausnahmen jeglicher Art und aus jeglichem Grund von diesen Richtlinien zu erlauben, unbeschadet der anderen Abschnitte. 4 Fragen Diese Richtlinie hat das Ziel, die Marken von Inkscape zu schützen, um den Ruf der Software zu schützen, der durch die Beiträge des Inkscape-Projektes an die [freie und] OpenSource-Software-Gemeinschaft erworben wurde. Wenn Du irgendwo siehst, dass die Marken auf eine Art und Weise verwendet werden, von der Du glaubst, dass sie diese Richtlinien verletzt oder sonst irgendwie im Gegensatz zum Geist des Inkscape-Projektes oder der Ziele der Conservancy steht, informiere bitte die Conservancy darüber, indem Du Kontakt zu uns unter [TRADEMARK@SFCONSERVANCY.ORG] aufnimmst. Wenn Du Fragen zur Verwendung der Marken hast oder glaubst, dass Du die Marken wahrscheinlich für einen Zweck verwenden können dürftest, der hier in diesen Richtlinien nicht erlaubt ist und hierfür um Erlaubnis bitten möchtest, nimm bitte Kontakt zu Inkscape auf, indem Du eine Email an [TRADEMARK@SFCONSERVANCY.ORG] schreibst oder indem Du einen Brief an das Inkscape Project c/o Software Freedom Conservancy, 137 Montague St. Ste 380, Brooklyn, NY 11201-3548 schickst.'''
