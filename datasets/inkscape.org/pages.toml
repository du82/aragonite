["https://inkscape.org/hr/o-programu/karakteristike"]
title = "Karakteristike | Inkscape"
full_description = "Početna » O programu » Karakteristike Karakteristike Inkscapea Izrada objekata Crtanje: alat za olovku (prostoručno crtanje pomoću jednostavnih staza), alat olovke (izrada Bézier-ovih krivulja i ravnih linija), alata za kaligrafiju (prostoručno crtanje pomoću ispunjenih staza, koje predstavljaju kaligrafske poteze) Alati za oblike: pravokutnici (mogu imati zaobljene kutove), elipse (uključuju kružnice, lukove, segmente), zvijezde/poligoni (mogu biti zaobljeni i/ili nasumični), spirale Alat za tekst (višeredni tekst, potpuno uređivanje na radnoj površini) Ugrađeni bitmapi (s naredbom za stvaranje i ugradnju bitmapa odabranih objekata) Klonovi (tzv. „žive” povezane kopije objekata), uključujući alat za stvaranje mustri i raspoređivanje klonova Manipuliranje objektima Transformacije (premještanje, skaliranje, rotiranje, iskrivljavanje), interaktivno, kao i određivanjem točnih brojčanih vrijednosti Operacije Z‑reda (podizanje i spuštanje po razinama) Grupiranje objekata („biranje objekata u grupi” bez potrebe za razgrupiravanjem ili „ulazak u grupu”, stvarajući privremeni sloje) Slojevi (zaključavanje i/ili skrivanje pojedinačnih slojeva, preraspodjela slojeva, itd. Slojevi mogu tvoriti hijerarhijsko stablo) Poravnavanje i raspoređivanje objekata Ispuna i linije Izbornik boja (RGB, HSL, CMYK, krug boja, CMS) Alat za odabir boje Kopiranje/lijepljenje stilova Uređivač za gradijente, s mogućnošću stvaranja višestrukih gradijenata pomoću kontrolnih točaka Ispune s mustrama (bitmapske/vektorske) Isprekidane linije, s mnogim predefiniranim uzorcima crtica Oznake staza (završne, srednje i/ili početne oznake, npr. s raznim oblicima vrhova strelica) Operacije nad stazama Uređivanje čvora: premještanje čvorova i Bézier ručaka, poravnavanje i raspoređivanje čvorova, itd. Kovertiranje u stazu (za tekstualne objekte ili oblike), uključujući kovertiranje crte u stazu Booleove operacije Pojednostavnjivanje staze, s promjenjivim pragom Sužavanje i širenje staze, uključujući dinamički i povezano odmaknute objekte Precrtavanje bitmapa (bitmape u boji i crno-bijele bitmape) Podrška za tekst Višeredni tekst Koristi sve instalirane fontove, uključujući fontove s pismima koja se pišu s desna na lijevo Podrezivanje, spacioniranje, prored Tekst na stazi (tekst i staza se i dalje mogu mijenjati) Tekst unutar oblika (ispuni oblik tekstom) Iscrtavanje Zaglađeno iscrtavanje cijelog ekrana Podrška alfa prozirnosti u prikazu i PNG izvozu Trenutno iscrtavanje objekata prilikom interaktivnih transformacija Datotečni formati Stvaranje i uređivanje datoteka u standardnom SVG-formatu Prikaz i uređivanje stabla dokumenata u XML-uređivaču uživo PNG, OpenDocument crtež, DXF, sk1, PDF, EPS i PostScript izvozni formati i još više Izvoz i konverzije datoteka pomoću opcija naredbenog retka"
