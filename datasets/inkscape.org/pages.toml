["https://inkscape.org/*membership/blog/april-bug-accelerator-2024"]
title = "April Bug Accelerator 2024 | Inkscape"
description = "The new program of paid Inkscape bug fixing is upon us for the 1.4 release. Three developers are participating in this session: Tav, Martin Owens and Vaibhav Malik. Let&#39;s take a look at what they got up to in April 2024..."
full_description = "Home » Project Members » Blog » April Bug Accelerator 2024 April Bug Accelerator 2024 May 1, 2024, 5:01 p.m. This month was the starting point for the 1.4 release, which is Inkscape last Gtk3 based release before moving onto Gtk4. Many of the fixes in this list have been worked on in a backwards way as we fixed them in 1.4.x first and will forward port them to the main inkscape development later. The issues we have been working to can be found here: https://gitlab.com/groups/inkscape/-/milestones/13 Martin's Fixes Various administration to help setup the program, review bugs etc Marker disapearence #4696 after extension run fixed in !6389 after a long investigation Hardcoded shortcuts #4318 fixed with customisable tool shortcuts in !6308 Crashes when running extensions in #3653 fixed in !6331 Grid issues when pasting #4827 fixed in !6390 Crash when deleting page #4747 fixed in !6332 Minor documentation actions issue #4763 fixed in !6307 Batch export filename issues #4826 fixed in !6323 PDF url and size export issues #4806 fixed in !6327 Mouse dragging issues #4830 failed to fix in !6338 actually fixed in !6217 PDF import issues #4380 fixed with new option in !6397 Export crashes #4523 and #4524 fixed in refactoring !6324 A total of 35 hours, or 40% of the budget was used this month. Vaibhav's Fixes #4647, #1583 !6320, !6322 Fixed broken lock aspect ratio button and default text box resize behaviour #4790 !6326 Fixed shape builder messing with the transparency of on-canvas objects #4823 !6329 Fixed wrong and editable stroke width in clones #4804 !6335 Various object picker tool improvements #4756 !6340 Status bar opacity spin button tooltip improvements and fixed pasting of clipboard contents on middle-click #4652 !6344 Fixed pressing ENTER to rename the group in the layers dialog right after its creation #4553 !6347 Fixed icon preview dialog not updating preview on object deletion #4842 !6352 Fixed vertical adjustment spin button in the node toolbar #1967 !6355 Using gradient mesh tool on normal gradients will no longer crash Inkscape #1261 !6358 Added support to add gradient stop when the last stop is selected #3472, #4466 !6361 Various color-palette drag-and-drop improvements related to gradients #3146 !6371 Respect the direction of selection when SHIFT+CLICKING for selecting multiple objects in the layers dialog #4162 !6379 Minor gradient undo issue in the fill and stroke dialog #3478 !6386 Entering groups in the layers dialog should also enter them on the canvas A total of 33 hours, or 38% of the budget was used this month. Tav's Fixes #297 !6414 Change PDF text import to use the 'dx' and 'dy' attibutes. #4767 !6321 Fix infinite loop in text_to_glyph() with some fonts. A total of 36.5 hours or 41% of the budget was used this month."
