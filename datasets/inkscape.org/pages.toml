["https://inkscape.org/hr/o-programu/pregled"]
title = "Pregled | Inkscape"
full_description = "Početna » O programu » Pregled Pregled Za dizajnere svih vrsta Proces dizajna može započeti sa skicom logotipa na salveti, s fotografijom predragog predmeta ili s već stvorenim modelom, izrađen pomoću softvera, s kojim ne možeš dovršiti projekt. Inkscape će ti pomoći u svim fazama, sve do izrade konačnog profesionalnog formata, spreman za objavljivanje na webu ili u fizičkom obliku. Čak i ako je proces izrade vektorskih grafika za tebe nešto novo, vrlo brzo će te obradovati fleksibilnost i funkcije Inkscapea. Vektorski dizajn je često preferirana metoda za stvaranje logotipa, ilustracija i umjetničkih djela, koja zahtijevaju visoku skalabilnost. Inkscape se koristi u raznim granama industrije (marketing, inženjering, CAD, web grafike, crteži za stripove) kao i za vlastite potrebe. Postoji velika količina resursa za učenje – koristi ih! Profesionalno izdavaštvo Svi Inkscape projekti se mogu izvoziti u formatima koji su prikladni za web preglednike ili profesionalni tisak. Budući da je multiplatformski, lako se pokreće na Windowsu, Mac OS X-u i Linux distribucijama. Posjeti stranicu Preuzimanja i instaliraj ili podijeli ovu aplikaciju s drugima. Slobodna zajednica Inkscape je slobodan! Pod tim podrazumijevamo da je besplatan, da se slobodno koristi i distribuira, te da je moguće dobiti uvid u izvorni kȏd. Na stranici Preuzimanja se nalazi popis izdanih izgradnji, kao i neke razvojne izgradnje i izvorni kodovi. Razvoj softvera Inkscape poštuje standarde otvorenog koda i namijenjen je zajednici korisnika, nudeći solidan, upotrebljiv proizvod. Radi se o otvorenom i zajedničkom razvoju, fokusirajući se pri tome na malu jezgru i proširivost. Povijesna osnovica je osnovni kȏd Sodipodi Hydra. Ako te zanima razvoj softvera, ako imaš posebne vještine ili neki drugi pozitivan prilog, priduži nam se. Posjeti našu stranicu Surađuj, ako želiš saznati više."
