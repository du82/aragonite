["https://inkscape.org/*membership/blog/june-bug-accelerator-2024"]
title = "June Bug Accelerator 2024 | Inkscape"
description = "The final month for the bug accelerator program is done and we&#39;ve got some important fixes for the next version of Inkscape..."
full_description = "Home » Project Members » Blog » June Bug Accelerator 2024 June Bug Accelerator 2024 July 2, 2024, 3:45 p.m. Some general thoughts about the program this year compared to last year; we are starting to get to more difficult and harder to fix issues as previous efforts pick off all the smaller problems, I found this year's crop of issues to take more time, more detail and persistence than last year's. We also have a collection of macOS and windows bugs that were harder to fix because none of the hired contractors had those computers, though two did pick up one each of those types of computers part way through the program. In all future programs should make sure there is a balance of capability and we should expect the amount of bug fixing to fluctuate between releases as the difficulty of the problems changes. The issues we have been working to can be found here: https://gitlab.com/groups/inkscape/-/milestones/13 Martin's Fixes Some light administration Fix #4322 when constructing spiro lines that end at the beginning in !6537. Fix alignment of the handles reported in #4758 and fixed in !6565. Speed improvements needed in the spray report in #4910 partly fixed in !6545. Inkscape profiling to find speed problems with various widget redrawing and signals. Problems with batch export in #5092 and #5095 are tested and fixed in !6541. Anchor tags in PDF issues in #1631 are more controlled because of !6530. Crashes from stroke widths being zero and trying to write markers in #4705 fixed in !6529. Merge reviews and finishing up various patches and ports. Martin used 35.5 hours this month, totalling 84 hours for the whole program using 97% of the allotment. Tav's Fixes #4839 !6560 Remove GC from SPDocument. #4916 !6559 Fix segmentation faults with FontSelector. #4918 !6524 Fix crash when symmetrizing paths with overlapping nodes. Tav used 13 hours this month, leaving 19 hours remaining"
