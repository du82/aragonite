full_description = "Domů » Project Members » Blog Blogs for Project Members Contract to Import AI Files 2025 Update 5. února 2025 8:57 To allow the import of Adobe Illustrator files into Inkscape, we are developing a Python extension. This post outlines the progress made in the second month of the project, January 2025. Find out what Manpreet has worked on in January 2025... Read more Inkscape Translation Contribution, and Other Short Stories 25. prosince 2024 9:39 The Traditional Chinese translations of Inkscape at the time was, let’s say, lacking. There were visible untranslated parts everywhere, namely in the Align and Distribute dialog, the dialog tab names, parts of the menu items, in the settings, and in the tooltips. My gripe was that some of them were partially translated, meaning that maybe the tool name was translated but the tooltip wasn’t, or in the case of the Align and Distribute dialog, some align options were and some weren’t, even though they are similar functions.... Read more Contract to Import AI Files Update 24. listopadu 2024 17:39 To allow the import of Adobe Illustrator files into Inkscape, we are developing a Python extension. This post outlines the progress in the 1st month of the project, October 2024. Work is carried out inside the git repository [extension-ai](https://gitlab.com/inkscape/extras/extension-ai/). Read more June Bug Accelerator 2024 2. července 2024 15:45 The final month for the bug accelerator program is done and we've got some important fixes for the next version of Inkscape... Read more May Bug Accelerator 2024 1. června 2024 19:30 This may as the mid point for the 1.4 release we've been focusing on fixing the biggest issues and setting the stage for the final release. Read more April Bug Accelerator 2024 1. května 2024 17:01 The new program of paid Inkscape bug fixing is upon us for the 1.4 release. Three developers are participating in this session: Tav, Martin Owens and Vaibhav Malik. Let's take a look at what they got up to in April 2024... Read more December through February - Gtk4 Migration (Tavmjong) 11. března 2024 16:59 Tav's December through February report for the Gtk4 migration project. Read more September through November - Gtk4 Migration (Tavmjong) 5. prosince 2023 15:29 Tav's September through November report for the Gtk4 migration project. Read more October/November - GTK4 migration - dboles 29. listopadu 2023 21:15 Report by contractor Daniel Boles on GTK4 migration and other work done in October/November of 2023. Read more October - Bug Accelerator 2023 31. října 2023 14:37 This month was all about preparing the Inkscape 1.3.1 release, testing and backporting all the fixes and managing the issues that cropped up with the fixes that needed to get into the release. All fixes were re-tested to make sure they wouldn't break in the process. Read more October - GTK4 migration - dboles 20. října 2023 13:55 Report by contractor Daniel Boles on work done to migrate Inkscape to GTK4 in the month ending October. Read more September - Bug Accelerator 2023 1. října 2023 13:19 Very small update this month, three issues addressed. Unfortunately I wasn't available for most of the month for the Bug Accelerator program. Read more September - GTK4 migration - dboles 22. září 2023 15:07 Report by contractor Daniel Boles on GTK4 migration work done in September 2023. Read more August - Gtk4 Migration (Tavmjong) 19. září 2023 12:39 Tav's August report for the Gtk4 migration project. Read more Customizable Appearance of Canvas Controls - Google Summer of Code 2023 7. září 2023 12:00 Node handles are now customizable through a single stylesheet, providing them a complete redesign. A deep walkthrough to the process, and how everything was achieved, as part of a project under Google Summer of Code 2023. Read more ‹‹ předchozí 1 2 3 následující ››"
