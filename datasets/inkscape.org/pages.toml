full_description = "الرئيسية » Project Members » Blog Blogs for Project Members Contract to Import AI Files 2025 Update فبراير 5, 2025, 8:57 ص To allow the import of Adobe Illustrator files into Inkscape, we are developing a Python extension. This post outlines the progress made in the second month of the project, January 2025. Find out what Manpreet has worked on in January 2025... المزيد Inkscape Translation Contribution, and Other Short Stories ديسمبر 25, 2024, 9:39 ص The Traditional Chinese translations of Inkscape at the time was, let’s say, lacking. There were visible untranslated parts everywhere, namely in the Align and Distribute dialog, the dialog tab names, parts of the menu items, in the settings, and in the tooltips. My gripe was that some of them were partially translated, meaning that maybe the tool name was translated but the tooltip wasn’t, or in the case of the Align and Distribute dialog, some align options were and some weren’t, even though they are similar functions.... المزيد Contract to Import AI Files Update نوفمبر 24, 2024, 5:39 م To allow the import of Adobe Illustrator files into Inkscape, we are developing a Python extension. This post outlines the progress in the 1st month of the project, October 2024. Work is carried out inside the git repository [extension-ai](https://gitlab.com/inkscape/extras/extension-ai/). المزيد June Bug Accelerator 2024 يوليو 2, 2024, 3:45 م The final month for the bug accelerator program is done and we've got some important fixes for the next version of Inkscape... المزيد May Bug Accelerator 2024 يونيو 1, 2024, 7:30 م This may as the mid point for the 1.4 release we've been focusing on fixing the biggest issues and setting the stage for the final release. المزيد April Bug Accelerator 2024 مايو 1, 2024, 5:01 م The new program of paid Inkscape bug fixing is upon us for the 1.4 release. Three developers are participating in this session: Tav, Martin Owens and Vaibhav Malik. Let's take a look at what they got up to in April 2024... المزيد December through February - Gtk4 Migration (Tavmjong) مارس 11, 2024, 4:59 م Tav's December through February report for the Gtk4 migration project. المزيد September through November - Gtk4 Migration (Tavmjong) ديسمبر 5, 2023, 3:29 م Tav's September through November report for the Gtk4 migration project. المزيد October/November - GTK4 migration - dboles نوفمبر 29, 2023, 9:15 م Report by contractor Daniel Boles on GTK4 migration and other work done in October/November of 2023. المزيد October - Bug Accelerator 2023 أكتوبر 31, 2023, 2:37 م This month was all about preparing the Inkscape 1.3.1 release, testing and backporting all the fixes and managing the issues that cropped up with the fixes that needed to get into the release. All fixes were re-tested to make sure they wouldn't break in the process. المزيد October - GTK4 migration - dboles أكتوبر 20, 2023, 1:55 م Report by contractor Daniel Boles on work done to migrate Inkscape to GTK4 in the month ending October. المزيد September - Bug Accelerator 2023 أكتوبر 1, 2023, 1:19 م Very small update this month, three issues addressed. Unfortunately I wasn't available for most of the month for the Bug Accelerator program. المزيد September - GTK4 migration - dboles سبتمبر 22, 2023, 3:07 م Report by contractor Daniel Boles on GTK4 migration work done in September 2023. المزيد August - Gtk4 Migration (Tavmjong) سبتمبر 19, 2023, 12:39 م Tav's August report for the Gtk4 migration project. المزيد Customizable Appearance of Canvas Controls - Google Summer of Code 2023 سبتمبر 7, 2023, ظهراً Node handles are now customizable through a single stylesheet, providing them a complete redesign. A deep walkthrough to the process, and how everything was achieved, as part of a project under Google Summer of Code 2023. المزيد ‹‹ previous 1 2 3 next ››"
