["https://inkscape.org/es/acerca-de"]
title = "Acerca de | Inkscape"
description = "Inkscape es un software de vectores gráficos de calidad profesional para Windows, Mac OS X y GNU/Linux. Es usado por diseñadores profesionales y aficionados de todo el mundo para crear una gran variedad de gráficos como ilustraciones, iconos, logos, diagramas, mapas y diseños web. Inkscape es un software libre y de código abierto, que utiliza SVG (Scalable Vector Graphic), el estándar abierto de W3C, como formato nativo."
full_description = "Inicio » Acerca de Acerca de Inkscape ¿Qué es Inkscape? Inkscape es un software de vectores gráficos de calidad profesional para Windows, Mac OS X y GNU/Linux. Es usado por diseñadores profesionales y aficionados de todo el mundo para crear una gran variedad de gráficos como ilustraciones, iconos, logos, diagramas, mapas y diseños web. Inkscape es un software libre y de código abierto, que utiliza SVG (Scalable Vector Graphic), el estándar abierto de W3C, como formato nativo. Inkscape tiene herramientas de dibujo vectorial sofisticadas con capacidades comparables con los estándares de la industria. Puede exportar e importar varios formatos de archivo, incluyendo SVG, AI, EPS, PDF, PS y PNG. Tiene funcionalidades muy fáciles de comprender, una interfaz sencilla, soporte multi-idiomas y está diseñado para ser extensible, los usuarios pueden personalizar las funcionalidades de Inkscape con sus múltiples extensiones. El proyecto de Inkscape tiene una comunidad de usuarios internacional en constante crecimiento y existen muchos materiales de aprendizaje para ayudarte a empezar con tus creaciones. La ayuda y el soporte son proporcionados por la comunidad y hay muchas maneras de contribuir si quieres ayudar a promover el proyecto de Inkscape. Inkscape es miembro del Software Freedom Conservancy (Conservación del Software Libre), una organización US 501(c)(3) sin ánimo del lucro. Las contribuciones a Inkscape son deducibles en los impuestos en Estados Unidos. ¿Quién ha creado Inkscape? Inkscape tiene varios creadores, cada uno de ellos conserva sus propios derechos de autor y están implicados en la elección de los objetivos técnicos y generales del proyecto. También hay muchos otros contribuyentes, que no tienen conocimientos de códigos informáticos, que son parte importante del proyecto de Inkscape. Si deseas referirte a los creadores de Inkscape o al resto de contribuyentes, puedes usar los términos «contribuyentes de Inkscape» y «proyecto de Inkscape» respectivamente para diferenciarlos del software. Descargar ¿Listo/a para usar Inkscape? ¡Genial! Descarga la última versión ahora... Descarga gratis Creado con"
author = "Inkscape Website Developers"
year_published = 2025
clearnet = "https://inkscape.org/es/acerca-de"
