["https://inkscape.org/fr/apropos/presentation"]
title = "Présentation | Inkscape"
full_description = "Accueil » À propos » Présentation Présentation Pour les graphistes de toutes sortes Le processus de création peut commencer par des gribouillis sur une serviette en papier, un brouillon de cartographie mentale, une photo au contenu remarquable ou une maquette de logiciel qui ne permettrait vraiment pas de mener le projet à bout. Inkscape peut vous amener de ce stade à un design final de qualité professionnelle prêt pour une publication sur le web ou sous forme physique. Si la création vectorielle est un procédé nouveau pour vous, le ressenti peut différer, mais vous serez rapidement ravi(e) par la flexibilité et le pouvoir qu'offre Inkscape. Le dessin vectoriel est souvent la méthode de création d'image la plus adaptée pour les logos, les illustrations et l'art qui doit pouvoir être visionné à grande échelle. Le logiciel Inkscape est utilisé dans une large gamme d'industries (mercatique et image de marque, ingénierie et conception assistée par ordinateur, graphismes pour le web, bande dessinée) et d'usages personnels. Il y a de nombreux supports d'apprentissage disponibles — profitez-en ! Publication professionnelle Tous les projets Inkscape peuvent être exportés dans des formats pris en charge par les navigateurs web ou par les salles d'impression commerciales. Inkscape est multiplateforme : il fonctionne sans difficulté sous Windows, Mac OS X et les distributions GNU/Linux. Visitez la page de téléchargement pour installer ou partager l'application dès maintenant. Communauté libre Inkscape est libre ! C'est-à-dire que son utilisation et sa diffusion sont gratuites, et que vous pouvez étudier son code source et vous en inspirer. La page de téléchargement liste les versions disponibles ainsi que des liens vers le développement et le code source. Le développement du logiciel Inkscape adhère aux règles de l'Open Source et vise à fournir à la communauté d'utilisateurs un produit résistant et fonctionnel. Le processus de développement est ouvert et communautaire, et axé sur un noyau léger et sur l'extensibilité. Le code provient historiquement du projet Sodipodi Hydra. Nous vous encourageons à vous joindre à nous si avez un intérêt, une compétence ou une voix constructive dont vous souhaiteriez nous faire profiter. Visitez notre page Contribuer pour en savoir plus."
