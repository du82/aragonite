full_description = '''Home » Project Members » Blog » May Bug Accelerator 2024 May Bug Accelerator 2024 June 1, 2024, 7:30 p.m. The issues we have been working to can be found here: https://gitlab.com/groups/inkscape/-/milestones/13 Martin's Fixes Some administration and mentoring BatchItem Review in !6324 to merge fixes for #4523 and #4524 Fix on-import preference use in !6484 fixed both #4839 #3835 Fix preference GUI in !6485 fixes #4810 Graphics for release in !6483 requested in issue #5020 Items under cursor ContextMenu in !6489 fixes #5047 Manage merge requests and issues A total of 15.5 hours, or 18% of the budget was used this month leaving 37 hours remaining. Vaibhav's Fixes #4868 !6430 Fixed crash on adding new stops to single-stop gradients #4871 !6402 Minor issue related to the delete page button sensitivity in the page toolbar #4881, #5015 !6438 Toolbars alignments and padding fixes #4886 !6435 Fix star toolbar GTK4 port regressions #4756 !6475 Statusbar Opacity label shortcut broken (regression) #4421, #4858, #4859, #4522 !6371 Layers dialog cursor selection improvements #4925 !6458 Fix dialog category label alignment #4969 !6466 Enforce snap alignment activation for distance markers #4188, #4196 !6468 Various issues with the Font Collections dialog (polishing) #5042 !6478 The Opacity SpinButton undoes value change if Esc is pressed #4876 !6478 Set Remove overlaps invisible when aligning nodes #4888 !6493 Re-add indicator for "Show this every time" checkbox #4940 !6496 Fix freeze on changing file filter in the Save dialog #5056 !6501 Clearing font categories freezes the UI #5058 !6497 Add ellipsis-end to page labels in the page selector #4984 !6504 Node tool - delete segment changes shape #8602 !6508 Enhance font list reset button behaviour #5060 !6510 Simplify relative alignment for single selection A total of 55 hours, or 62% of the budget was used this month. This concludes this allotment of hours. Tav's Fixes #766 !6511 Fix creation of new mesh gradient from shared mesh. #4884 !6507 Various fixes to MenuButtons in collapsible toolbars. #4884 !6506 Use on only one collapsible region for Command Toolbar. #4884 !6446 Add icons or labels to toolbar MenuButtons that appear when window width is decreased. Using 19 hours.'''
