title = "Draw Freely | Inkscape"
description = "Inkscape ist ein professionelles Programm zur Bearbeitung von Vektorgrafiken, das auf Windows, Mac OS X und Linux läuft."
full_description = "Inkscape Summit Frankfurt 2025 5. Februar 2025 For the past few days, 7 Inkscape Members met up in Frankfurt, Germany to collaborate on various projects and get to know each other. We were especially delighted to have two InkStitch maintainers, a major downstream project of Inkscape, join us. This way, we got to learn about the struggles and worries of projects using Inkscape better, and even built a new capability for extensions to interact with Inkscape during the event. Weiterlesen... Inkscape at 21 is growing up and getting organized 6. November 2024 November 6, 2024, marks the end of the 20th anniversary year for the Inkscape project, and the beginning of a new decade of adventure. There were a few milestones this past year, among them an informal global celebration, a bug-fix program, an About Screen Contest, an Inkscape Summit, a summer of code, and the launch of version 1.4. Here’s a brief look at some of those milestones. Weiterlesen... Inkscape’s 20th Anniversary 5. November 2024 On November 18, 2023, the Inkscape project celebrated its 20th anniversary. The anniversary celebration was an online get-together of Inkscape users and contributors. This was an initiative by the Vectors team and the intention was to bring Inkscape users and contributors together to celebrate 20 years of Inkscape. Weiterlesen..."
