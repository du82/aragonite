["https://inkscape.org/es/acerca-de/funcionalidades"]
title = "Funcionalidades | Inkscape"
full_description = 'Inicio » Acerca de » Funcionalidades Funcionalidades de Inkscape Creación de objetos Herramientas de dibujo: lápiz (dibujo libre con un trazo simple), pluma (crea líneas Bezier, Spiro o rectas), caligráfica (dibujo a mano alzada a través de trayectorias con relleno para representar trazos caligráficos). Herramientas de formas: rectángulos (con bordes redondeados opcionales), elipses (incluye círculos, arcos y segmentos), estrella/polígono (pueden ser redondeados y/o aleatorios), espirales. Herramienta de texto (simples o párrafos, edición completa directa sobre el lienzo). Imágenes embebidas (con un comando para incrustar y convertir en imágenes los objetos seleccionados). Clonación (vincula copias de objetos "en vivo"), incluye una herramienta para crear patrones y ordenar los clones. Manipulación de objetos Transformación (mover, escalar, rotar y distorsionar) de manera interactiva o especificando sus valores exactos. Operaciones de profundidad (ordenación sobre el eje Z, hacia el espectador o hacia atrás). Agrupación de objetos ("seleccionar dentro del grupo" sin desagruparlo o abrir un grupo para seleccionar sus contenidos como si fuese una nueva capa imaginaria). Capas (bloqueo y/u ocultación, ordenación, etc., capas anidadas). Comandos de alineación y distribución. Relleno y borde Selección de color (RGB, HSL, rueda de color). Herramienta cuentagotas para selección de color. Copiar/pegar estilos. Editor de degradados con múltiples límites de color. Relleno con patrón (imágenes/vectores). Bordes punteados, con muchos estilos predefinidos. Marcadores en el trazado (de principio, fin, e.g. punta de flecha). Operaciones de trazado Editor de nodos: edición de nodos o manejadores Bezier, alineamiento y distribución de nodos, etc. Convertir en trazado (para textos o formas), incluye convertir el borde en trazado. Operaciones booleanas. Simplificación de trazados con magnitud variable. Expansión o contracción de trazados, de manera dinámica o enlazada. Trazado de bitmaps (el trazado resultante en color o escala de grises). Soporte de texto Texto simple o párrafo. Usa cualquier fuente de tu sistema que no sea bitmap, incluidas las de escritura de derecha a izquierda. Ajuste de kerning (espacio entre letras) e interlineado. Texto a trazo (el texto y el trazo continuarán modificables). Texto en forma (Rellena forma siguiendo el borde). Renderización Visualización con antialiasing. Soporte de PNG transparentes, tanto en su exportación como importación. Renderización interactiva durante la transformación de objetos. Otros Edición y visualización del código fuente del documento en el editor XML. Exportación a PNG, dibujo OpenDocument, DXF, sk1, PDF, EPS y PostScript entre otros. Opciones de conversión y exportación desde la línea de comandos. Creación y modificación de archivos bajo el estándar de formato SVG.'
