To learn about how to make one yourself, see here. And how to submit extensions for review here

Some extensions may depend on other programs, that will need to be installed on your computer for them to work correctly. Usually, the author of the extension will provide instructions for this.

Note on Security:
Please note that these extensions are not selected or curated and are provided by the Inkscape community as is. Always check code before running it to make sure it's safe."""
