["https://inkscape.org/fr/apropos/fonctionnalites"]
title = "Fonctionnalités | Inkscape"
full_description = "Accueil » À propos » Fonctionnalités Fonctionnalités d'Inkscape Création d'objet Dessin : outil pinceau (dessin à main levée avec des chemins simples), outil crayon (création de courbes de Bézier et de segments), outil calligraphie (dessin à main levée utilisant des chemins remplis représentant des pleins et des déliés) Outils de forme : rectangles (dont les coins peuvent êtres arrondis), ellipses (comprend les cercles, arcs, cordes et rayons), étoiles/polygones (qui peuvent être arrondis et/ou avoir des paramètres aléatoires) et spirales Outil texte (texte multi-lignes, édition sur le canevas) Images matricielles incorporées (avec une commande pour créer et incorporer les bitmaps des objets sélectionnés) Clones (copies d'objets liées « en direct » à l'original), comprenant un outil pour créer des motifs et ordonner des clones Manipulation d'objet Transformations (déplacement, redimensionnement, rotation, inclinaison), interactivement ou en spécifiant une valeur exacte Ordonnancement sur l'axe Z (avancer, reculer) Groupement d'objets (sélection dans un groupe sans dégrouper, ou entrée dans un groupe en le transformant en calque temporaire) Calques (verrouillage et masquage par calque, réarrangement, etc. ; les calques peuvent être organisés en arbre hiérarchique) Commandes d'alignement et de distribution Fond et contour Sélecteur de couleur (RVB, TSL, CMJN, roue, CMS) Outil pipette Copie et collage des styles Un éditeur de dégradés gérant plusieurs stops Remplissage par motif (matriciel ou vectoriel) Contours en pointillés, avec de nombreux motifs de pointillés prédéfinis Marqueurs de chemin (marques à la fin, au milieu ou au début, par ex. des têtes de flèche) Opérations sur les chemins Édition des nœuds : déplacement des nœuds et des poignées de Bézier, alignement et distribution des nœuds, etc. Conversion en chemin (pour les textes et les formes), incluant la conversion des contours en chemin Opérations booléennes Simplification de chemin, avec seuil paramétrable Érosion et dilatation des chemins, morphoses dynamiques et liées Vectorisation des images matricielles (chemins en couleur ou monochromes) Support du texte Texte sur plusieurs lignes Utilise toute police vectorielle installée, y compris les scripts allant de droite à gauche Ajustement du crénage, de l'interlettrage et de l'interligne Texte sur chemin (le texte comme le chemin restent éditables) Texte dans une forme (le texte suit alors le contour de la forme) Rendu graphique Affichage anticrénelé (lissage) Support de la transparence alpha à l'écran et dans les exportations en PNG Rendu complet des objets au cours des transformations interactives Formats de données Génération et édition intégralement conformes au format SVG Visualisation et édition en direct de l'arbre du document dans l'éditeur XML Exportation aux formats PNG, OpenDocument Drawing, DXF, sk1, PDF, EPS, PostScript et d'autres Exportation et conversion possibles en ligne de commande"
