full_description = '''Vítejte » About » Branding Branding and Trademark Name Inkscape: Open Source Scalable Vector Graphics Editor 'Inkscape' should be capitalized (not BiCapitalized), and is only one word. The name 'Inkscape' is trademarked. Incorrect: inkscape, Ink Scape, Inkspace, InkScape Tagline Draw Freely. Watch capitalization, and don't forget the full stop. The tagline is trademarked. Logos Inkscape's Logo is the Mountain Graphic Logo. There are two official variants of that logo: The original, slightly glossy 3D variant, and the simplified, flat variant. For the flat logo, there are 2 official variants: 1-color: Preferred colors are black (on lighter backgrounds), or white (on sufficiently dark backgrounds). The snowcap and rim line knocked out (transparent). Shaded: The mountain and ink should be black, and white (for the snowcap and rim line) The Inkscape Logo is trademarked, and is licenced as CC-By-SA 3.0. It's original author is Andrew Michael Fitzsimon. Fonts Inkscape - Linux Libertine Draw Freely. - Euphoria Script - The handwriting font that is used for the tag line Download Files Euphoria Script Regular Extended Linux Libertine Inkscape Logo SVG Inkscape Flat Logo 2 Color Variant Inkscape Flat Logo with Text Inkscape Flat Logo 1 Color Variant - Bl… Inkscape Flat Logo 1 Color Variant - Wh… Inkscape Trademark Usage Policy 1 Purpose Software Freedom Conservancy (“Conservancy”) has adopted this Policy to make sure that the identity of the Inkscape graphics editor and its free and open source nature is clear to everyone. By using this Policy, the Inkscape Project can spread the use of Inkscape while making sure that the mark is protected in a way that's consistent with U.S. trademark law. This Policy is written to allow all clear and appropriate use of the Inkscape marks while preventing abusive use of them in ways that could confuse users as to where the software came from. By adhering to this Policy, you help to promote to the public the freedom to u