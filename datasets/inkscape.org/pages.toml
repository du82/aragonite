["https://inkscape.org/learn/faq"]
title = "FAQ | Inkscape"
full_description = '''Home » Learn » FAQ Frequently Asked Questions — for Inkscape Users * * Please find an FAQ for Inkscape Developers in the wiki. Contents General What is Inkscape? Inkscape is an open-source vector graphics editor similar to Adobe Illustrator, Corel Draw, Freehand, or Xara X. What sets Inkscape apart is its use of Scalable Vector Graphics (SVG), an open XML-based W3C standard, as the native format. What is “vector graphics”? In contrast to raster (“bitmap”) graphics editors such as Photoshop or GIMP, Inkscape stores its graphics in a vector format. Vector graphics is a resolution-independent description of the actual shapes and objects that you see in the image. A rasterization engine uses this information to determine how to plot each line and curve at any resolution or zoom level. Contrast that to raster ("bitmap") graphics, which is always bound to a specific resolution, and stores an image as a grid of pixels. Vector graphics are a complement, rather than an alternative, to raster graphics. Each has its own purpose and is useful for different kinds of things. Raster graphics tend to be better for photographs and some kinds of artistic drawings, while vectors are more suitable for design compositions, logos, images with text, technical illustrations, etc. Note that Inkscape can import and display raster images, too. An imported raster images becomes yet another object in your vector graphics, and you can do with it everything you can do to other kinds of objects (move, transform, clip, etc.). What is “Scalable Vector Graphics”? Scalable Vector Graphics (SVG) is an open, industry-standard XML-based format for vector graphics developed by the W3C. Its acceptance has grown fast! Most, if not all, vector editors can import and export SVG, and all modern browsers (including IE, starting with IE9) can display it directly, i.e. without requiring any plugins. For more information, see About SVG below. What platforms does Inkscape run on? We provide source tarballs for Linux (binary packages are offered by the distributor) as well as flatpak and snap packages and a ppa for Ubuntu, packages for Windows (32bit and 64bit, portable app, fully self-contained installer, binary without installation), and Mac OS X (DMG, also MacPorts, Homebrew provided by community members). We know that Inkscape is successfully used on FreeBSD and other Unix-like operating systems. Note that Windows 98/Me and 2000 are no longer supported. What formats can Inkscape import/export? Inkscape natively supports opening or importing many different formats, such as SVG, SVGZ (gzipped SVG), PDF, EPS, and AI (Adobe Illustrator) formats. And, as of version 0.91, Inkscape can import CDR (CorelDraw) and VSD (Visio) natively. With the help of extensions, Inkscape can open a number of other vector formats. For importing PostScript or EPS, please see How to open EPS files in Windows. For formats of Dia, XFig, or Sketch, you need to have those programs installed. Inkscape can natively import most raster formats (JPEG, PNG, GIF, etc.) as bitmap images, but it can only export PNG bitmaps. Inkscape does not intend to export other raster formats than PNG as this is currently the most suitable format for vector graphics: it is an open format which uses lossless compression and is typically supported by all graphics or rendering software. If you need to convert your vector image into another raster image format (e.g. because your document contains bitmaps and the PNG file size is too large, or you want to use your vector image on a platform which only accepts JPEG), you will need to convert the exported PNG with another software (such as GIMP or ImageMagick) or an extension (see this one for JPEG). Inkscape can save as SVG, SVGZ, PDF, Postscript/EPS/EPSi, LaTeX (*.tex), POVRay (*.pov), HPGL, and MANY others. Starting with version 0.91, Inkscape can save as: FXG (Flash XML Graphics), SIF (Synfig Animation Studio), HTML5 Canvas, and there are improvements for XAML export. Please see “Exporting Other File Types” section of the Exporting Files chapter of the manual, for more details. If you need another import or export format that Inkscape currently does not offer, you can make a suggestion to add it to Inkscape in the Inkscape bug tracker. How did Inkscape start? Inkscape was started as a fork of Sodipodi, in late 2003, by four Sodipodi developers: Bryce Harrington, MenTaLguY, Nathan Hurst, and Ted Gould. Our mission was creating a fully compliant Scalable Vector Graphics (SVG) drawing tool written in C++ with a new, more user friendly (GNOME Human Interface Guidelines (HIG) compliant) interface and an open, community-oriented development process. Within several months the project had produced several releases, demonstrating a sequence of significant new features and improvements to the codebase and quickly established Inkscape as a noteworthy Open Source project. What does “Inkscape” mean? The name is made up of the two English words "ink" and "scape". Ink is a common substance for drawings, and is used when the sketched work is ready to be permanently committed to paper, and thus evokes the idea that Inkscape is ready for production work. A scape is a view of a large number of objects, such as a landscape or ocean-scape, and thus alludes to the object-oriented nature of vector imagery. Is Inkscape ready for regular users? Yes! While Inkscape does not yet have all the features of the leading vector editors, the latest versions provide for a large portion of basic vector graphics editing capabilities. People report successfully using Inkscape in a wide variety of professions and hobbies alike; such as web graphics, technical diagrams, icons, creative art, logos, maps… For example, thousands of images on Wikipedia are created with Inkscape, as is the majority of the content on openclipart.org. Many more examples of Inkscape art can be seen on the Official Inkscape deviantART page; and not to mention the new Gallery on the Inkscape website. You can start using Inkscape alongside your other graphics and desktop tools now! Can Inkscape create webpages? Sort of. Many webpage authors use Inkscape for webpage mockups or to generate parts of web pages, such as banners, logos, icons, and more. With the recent advances in SVG support in web browsers, using SVG directly on the web becomes more of a possibility. Most modern browsers can now display SVG images. In theory, SVG and XHTML can be used together within the same document, so interested users or developers can explore this possibility further. Unfortunately, even though SVG is the internet standard for vector graphics, SVG support is not 100%. Therefore, web page authors who need to support the widest variety of web browsers, often convert each SVG graphic to a raster image (.png) as the very last step. Can Inkscape create animations? Yes and no. Inkscape itself does not support animation, although it might someday. Until then, there are several ways to animate, either SVG images, or raster images which were originally created with Inkscape, using other technology. This page covers everything about animation and Inkscape. Can Inkscape be used from the command line? Yes, Inkscape has a powerful command line interface and can be used in scripts for a variety of tasks, such as exporting and format conversions. Please see below, for more info. Answers to frequently asked “How-to” questions How to change Inkscape's interface language Edit > Inkscape Preferences > Interface: Language. This requires a restart of Inkscape to take effect. How to change the Inkscape theme Please see the info here. How to make a transparent background or change the background color Inkscape's background is transparent by default. It simply does not use the checkerboard pattern that many graphics programs use, to indicate transparency. The only place you will see the checkerboard pattern to indicate transparency, is in color bars, in the Fill and Stroke dialog, or in the Style Indicators, and several different dialogs, wherever color and/or opacity can be set. To make a background non-transparent, please go to File menu > Document Properties > Page tab > Display, and click on the checkerboard bar. A small window will open, which allows you to change the color and/or opacity of the background. This should affect the exported images, but the background may still be transparent if you render your SVG with another software (e.g. a browser). If you want to display the background color everywhere the file is used, you'll need to draw a large rectangle, to fit the image/page size to place behind your drawing (on the bottom, in z-order), and fill it with the background color you want. See also this feature request in our old bug tracker. How to make a hole in a solid object, like the hole in a donut There are several ways to approach this, each with its own advantages and disadvantages. Draw the inner and outer circles (or whatever the shape is). Select both paths. Path menu > Combine Then press this button on Fill and Stroke dialog > Fill tab: , (read about the Fill Rule, in the manual) Draw the inner and outer circles (or shapes). Select one of the paths. (either one) Path menu > Reverse Select both paths Path menu > Combine Draw the inner and outer circles (or shapes). Put the inner circle on top, in z-order. Select both paths. Path menu > Difference And there are some fancier ways to accomplish this, but which go beyond the scope of an FAQ. Please see Where to find more help with Inkscape for further assistance. How to join 2 nodes, when one of the nodes is not an end node This is currently not possible with Inkscape. Only 2 end nodes can be joined. However, you can still place the nodes precisely, one on top of the other, using either Snapping, or entering the same values for both nodes in the X: and Y: fields on the Node tool control bar. Then, they can be moved together, as if they were one node, by selecting both nodes when you need to move them. Using the Node tool ( ), with both paths (or subpaths) selected, drag a tiny selection box around the 2 "stacked" nodes (or however many are stacked there). Now they can be moved around, as if they were one single node. How to create custom document templates This is covered briefly in the manual. But here's an excellent detailed tutorial, by Inkscape developer, Alexandre Prokoudine: Using Templates in Inkscape. How to measure distances and angles For versions 0.91 and later, Inkscape has a Measurement Tool. For versions below 0.91 (which are 0.48.5 and below) the Pen/Bezier tool can be used to get a general measurement. But it's hard to be precise with it. With the Pen/Bezier tool ( ), click at one end of the segment you want to measure, and move the mouse (without clicking) to the other end. In the status bar, you will see the distance and angle measurement. Then press Esc or right-click to cancel. The angle is measured by default from 3 o'clock origin counterclockwise (the mathematical convention), but in Preferences you can switch this to using compass-like measurement (from 12 o'clock, clockwise). Extensions menu > Visualize Path > Measure Path will display the measurement of a selected path, in a new text object on the canvas. Until the Measurement tool is available, after noting the measurement, you can either Undo, or just delete the text. Here is info on the Measure Path extension. How to scale or rotate groups of nodes By mouse: With the Node tool engaged ( ) press the "Show transformation handles for selected nodes" button , on the Node tool control bar, then select the nodes you need. Now you can transform the selected nodes in the same way as the Selection tool transforms objects. Click on an already selected node to toggle between scaling handles and rotation/skewing handles. By keyboard: Select the nodes you need. Then press the '<' or '>' key, to scale; or press the '[' or ']' key, to rotate them. Nodes will be transformed, as if they were an "object", either around the center of that node group, or around the node over which your mouse cursor hovers. So, for example, in a single-path silhouette portrait, you can now select the nodes of the nose and rotate/scale the nose as a whole without breaking the path into pieces. Press the Alt key, with either method, for incremental movement. Also, you can press H or V key, to flip the selected nodes horizontally or vertically. How to insert math symbols or other special symbols in the drawing Probably the simplest way, is to use whatever input method is provided by your operating system. For example, in Windows, you can use the Character Map (Start > All Programs > Accessories > System Tools > Character Map). Or in Inkscape, Text menu > Glyphs may provide even more options. For more info, please see the Creating Text chapter, in the manual. There are a couple of extensions which allow the use of LaTeX formulas. One of them can be found in the Render submenu of the Extensions menu, another one, for example, is texTex. Or they can also be found in the Extensions Repository. More info here and in the manual. How to make sine curves with Inkscape Extensions menu > Render > Function Plotter. Please find info in the manual. Other software, such as Xfig, KiG, or KSEG can also be used to create complex curves and then export to SVG for use in Inkscape. How to create custom palettes, and how to save colors for future use There are two ways how you can preserve selected colors for later use in Inkscape: The auto palette can collect the colors and gradients that you use in the current document. Colors saved this way are called custom swatches. The colors will only be available within that document (but you can use that document as a template). Since Inkscape uses the .gpl file format for its stock palettes, which is the same palette file format as The GIMP (The GNU Image Manipulation Program), GIMP palettes can be installed in Inkscape. To obtain a palette file, you can look around the internet, browse our gallery of user submitted palette files, or even save all the flat colors used in the current document to a .gpl file with 'File > Save a copy', and here, select the file format 'Gimp Palette (*.gpl). For Inkscape to find the new palette file, you need to put it into the 'palettes' directory in your user configuration directory (see 'How to install new extensions, palettes, document templates, symbol sets, icon sets, etc.' for instructions). How to bend a gradient — How to apply a gradient to a stroke so that it bends with the stroke — Gradient Mesh It's not possible to bend a linear or radial gradient. But there are several techniques to "fake it": Blurring of open, stroked paths, or long and narrow closed paths (such as crescent shaped objects), can sometimes simulate a curved gradient, in certain situations. Often used with clipping, to retain sharp edges, which can make the trick more effective. For example, in simulating highlights or shadows, in a draw'''
