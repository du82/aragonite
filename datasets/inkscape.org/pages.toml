["https://inkscape.org/*membership/blog/october-bug-accelerator-2023"]
title = "October - Bug Accelerator 2023 | Inkscape"
description = "This month was all about preparing the Inkscape 1.3.1 release, testing and backporting all the fixes and managing the issues that cropped up with the fixes that needed to get into the release. All fixes were re-tested to make sure they wouldn&#39;t break in the process."
full_description = "Home » Project Members » Blog » October - Bug Accelerator 2023 October - Bug Accelerator 2023 Oct. 31, 2023, 2:37 p.m. This month was all about preparing the Inkscape 1.3.1 release, testing and backporting all the fixes and managing the issues that cropped up with the fixes that needed to get into the release. All fixes were re-tested to make sure they wouldn't break in the process. You can see a full list of backports here: https://gitlab.com/inkscape/inkscape/-/merge_requests/5913 There was over 87 backports to process and each one was re-tested and merged into the 1.3.x branch. Quite a few needed to be manually merged as they had diverged so much from the old code that they no longer cleanly applied. Many crash fixes, lots of clean up and regression fixes to repair problems introduced by 1.3.0 back in July. All the fixes mentioned in previous reports since July have now made their way into the Inkscape release. Some tasks still remain but are relatively minor. Fixes this month: !5952 - Fix entering custom text in the page size tool !5999 - Split out Grid Line snapping from Grid intersection !5951 - Crash in gradient editing with Knot signal connection !5942 - Crash from size of generated image when not found !5912 - Context error when loading certain pdf files"
