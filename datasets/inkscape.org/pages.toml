["https://inkscape.org/learn/tutorials"]
title = "Tutoriales de Inkscape | Inkscape"
full_description = "Inicio » Aprende » Tutoriales Tutoriales Inkscape La comunidad de Inkscape ha creado una gran cantidad de tutoriales a lo largo de los años. Actualmente, más del 95% de estos tienen como autores los propios usuarios de Inkscape, esparcidos por toda la red. Los únicos tutoriales oficiales son los que vienen con el software, y que podrás encontrar en el menú Ayuda > Tutoriales. Tutoriales oficiales Éstos son los tutoriales del proyecto Inkscape. Proporcionan la información más básica y esencial que la mayoría de usuarios de Inkscape necesitarán en algún momento de su trayecto. Recomendamos su uso a todos loss usuarios. Estos mismos tutoriales forman parte del software Inkscape, donde son interactivos. Los primeros tres los recomendamos encarecidamente a los principiantes, titulados: Básico, Formas, y Avanzado. No te preocupes, el que se llama Avanzado no lo es realmente. Es una introducción a los elementos más básicos de los gráficos vectoriales y los trayectos. Los demás cubren características concretas, que podrás usar a medida que los necesites. Tutorial: Básico Tutorial: Formas Tutorial: Avanzado Tutorial: Trazado de mapas de bits Tutorial: PixelArt Tutorial: Caligrafía Tutorial: Interpolación Tutorial: Elementos de diseño Tutorial: Consejos y trucos Herramientas o características Estos tutoriales muestran cómo utilizar herramientas o características específicas. Personaliza los estilos de tus herramientas Consejos para evitar problemas de rendimiento (ralentización, cuelgues) Qué hacer cuando una herramienta dibuja objetos invisibles (o no funciona como antes) Cómo seleccionar un objeto individual Cómo usar LaTeX con Inkscape Cómo trazar una línea Tutoriales recomendados por usuarios Serie de tutoriales sobre Inkscape en la revista Full Circle - por Mark Crutch, publicados mensualmente en la revista Full Circle - los principiantes deberían comenzar con el primer tutorial Un curso acelerado de Inkscape - un paseo introductorio por la interfaz gráfica de Inkscape con trucos y consejos, escrito por el ilustrador Chris Hilbig 10 tutoriales buenos de Inkscape para diseñadores de gráficos vectoriales Tutoriales de Inkscape para el nerd creativo Sección de tutoriales de los foros de Inkscape Tutoriales subidos por usuarios Cómo participar en la creación de tutoriales Si te gustaría participar con la creación de tutoriales para esta página, o hasta unirte al equip de documentación, sigue leyendo aquí."
