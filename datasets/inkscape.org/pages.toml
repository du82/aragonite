["https://inkscape.org/de/ueber"]
title = "Über | Inkscape"
description = "Inkscape ist ein professionelles Programm zur Bearbeitung von Vektorgrafiken für Windows, Mac OS X und GNU/Linux. Es wird weltweit von professionellen und hobbymäßigen Designern dazu verwendet, eine Vielfalt an Bildern, wie Illustrationen, Icons, Logos, Diagramme, Karten oder auch Webgrafiken, zu gestalten. Inkscape nutzt den freien Standard SVG (Scalable Vector Graphics) des W3C und ist eine freie, quelloffene Software."
full_description = 'Startseite » Über Inkscape: Überblick Was ist Inkscape? Inkscape ist ein professionelles Programm zur Bearbeitung von Vektorgrafiken für Windows, Mac OS X und GNU/Linux. Es wird weltweit von professionellen und hobbymäßigen Designern dazu verwendet, eine Vielfalt an Bildern, wie Illustrationen, Icons, Logos, Diagramme, Karten oder auch Webgrafiken, zu gestalten. Inkscape nutzt den freien Standard SVG (Scalable Vector Graphics) des W3C und ist eine freie, quelloffene Software. Inkscape hat leistungsstarke Zeichenwerkzeuge, ähnlich wie andere bekannte Vektorgrafikeditoren. Es kann unter anderem die Dareiformate SVG, AI, EPS, PDF, PS und PNG im- und exportieren. Es enthält umfangreiche Funktionen, eine einfache Oberfläche, mehrsprachigen Support und es kann erweitert werden: Benutzer können Funktionen mithilfe von Add-Ons anpassen. Das Inkscape-Projekt hat eine wachsende internationale Benutzer-Community, und es gibt viele Lernmaterialien, die den Einstieg erleichtern. Hilfe und Support werden von der Community bereitgestellt, und es gibt viele Möglichkeiten, sich zu engagieren, wenn man sich am Inkscape-Projekt beteiligen will. Inkscape gehört zur Software Freedom Conservancy, einer nicht-kommerziellen US 501(c)(3)-Organisation. Spenden an Inkscape sind in den USA von der Steuer absetzbar. Wer erstellt Inkscape? Inkscape wird und wurde von einer großen Zahl von Personen geschrieben. Jede davon hält das Urheberrecht an den eigenen Beiträgen. Die Autoren beteiligen sich daran, die technischen und inhaltlichen Ziele des Projektes festzulegen. Auch viele Nicht-Programmierer tragen zum Erfolg des Projektes bei und werden als ein wichtiger Teil davon betrachtet. Als Bezeichnung für die Gesamtheit der Mitwirkenden und die Organisation können die Ausdrücke "die Mitwirkenden von Inkscape" und "das Inkscape-Projekt" verwendet werden, um den Unterschied zur eigentlichen Software "Inkscape" zu verdeutlichen. Download Du möchtest Inkscape ausprobieren? Großartig! Lade direkt die neueste Version herunter. Kostenloser Download Hergestellt mit'
author = "Entwickler der Inkscape-Webseite"
year_published = 2025
clearnet = "https://inkscape.org/de/ueber"
