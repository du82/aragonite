title = "Inkscape - Draw Freely. | Inkscape"
description = "Inkscape is professional vector graphics software which runs on Linux, Mac OS X and Windows desktop computers."
full_description = "Contract to Import AI Files 2025 Update Feb. 5, 2025 To allow the import of Adobe Illustrator files into Inkscape, we are developing a Python extension. This post outlines the progress made in the second month of the project, January 2025. Find out what Manpreet has worked on in January 2025... Read more... Inkscape Translation Contribution, and Other Short Stories Dec. 25, 2024 The Traditional Chinese translations of Inkscape at the time was, let’s say, lacking. There were visible untranslated parts everywhere, namely in the Align and Distribute dialog, the dialog tab names, parts of the menu items, in the settings, and in the tooltips. My gripe was that some of them were partially translated, meaning that maybe the tool name was translated but the tooltip wasn’t, or in the case of the Align and Distribute dialog, some align options were and some weren’t, even though they are similar functions.... Read more... Inkscape Summit Frankfurt 2025 Feb. 5, 2025 For the past few days, 7 Inkscape Members met up in Frankfurt, Germany to collaborate on various projects and get to know each other. We were especially delighted to have two InkStitch maintainers, a major downstream project of Inkscape, join us. This way, we got to learn about the struggles and worries of projects using Inkscape better, and even built a new capability for extensions to interact with Inkscape during the event. Read more... Inkscape at 21 is growing up and getting organized Nov. 6, 2024 November 6, 2024, marks the end of the 20th anniversary year for the Inkscape project, and the beginning of a new decade of adventure. There were a few milestones this past year, among them an informal global celebration, a bug-fix program, an About Screen Contest, an Inkscape Summit, a summer of code, and the launch of version 1.4. Here’s a brief look at some of those milestones. Read more... Inkscape’s 20th Anniversary Nov. 5, 2024 On November 18, 2023, the Inkscape project celebrated its 20th anniversary. The anniversary celebration was an online get-together of Inkscape users and contributors. This was an initiative by the Vectors team and the intention was to bring Inkscape users and contributors together to celebrate 20 years of Inkscape. Read more..."
