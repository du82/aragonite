title = "Inkscape について | Inkscape"
description = "Inkscape はベクター画像をプロフェッショナル品質で作成・編集できるソフトウェアです。動作OSは Windows, Mac OS X および GNU/Linux で作動できます。このソフトは世界規模のユーザーに、デザインのプロフェッショナルからホビー家にまで、様々な用途のグラフィック(イラスト、アイコン、ロゴ、ダイアグラム、マップ、ウェブ画像)の創作のために活用されています。 Inkscape は、 W3C オープン規格の SVG (Scalable Vector Graphics) を、ネイティブのフォーマットとして採用している、フリーでオープンソースなソフトウェアです。"
full_description = '''Home » Inkscape について Inkscape の概要 Inkscape とは何ですか? Inkscape はベクター画像をプロフェッショナル品質で作成・編集できるソフトウェアです。動作OSは Windows, Mac OS X および GNU/Linux で作動できます。このソフトは世界規模のユーザーに、デザインのプロフェッショナルからホビー家にまで、様々な用途のグラフィック(イラスト、アイコン、ロゴ、ダイアグラム、マップ、ウェブ画像)の創作のために活用されています。 Inkscape は、 W3C オープン規格の SVG (Scalable Vector Graphics) を、ネイティブのフォーマットとして採用している、フリーでオープンソースなソフトウェアです。 Inkscape は洗練された描画ソフトであり、その機能の匹敵するのは Adobe Illustrator, CorelDRAW および Xara Xtreme 並みです。 様々なファイル形式にインポートおよびエクスポートすることができます。 SVG, AI, EPS, PDF, PS および PNG などに対応しています。 このソフトは ひととおりの機能セット と シンプルなインターフェース を兼ね備えており、多言語対応していて、 さらに拡張性があるように設計されています; ユーザーは アドオン を使って Inkscape の機能をカスタマイズできます。 Inkscape プロジェクトは成長中の多くの国際的な ユーザーコミュニティ を持っています。そして 使い方の学習材料 も多く存在しています。 ヘルプとサポート もコミュニティによって提供されています。 and there are lots of ways for you to get involved if you want to help improve the Inkscape project. Inkscape is a member of the Software Freedom Conservancy, a US 501(c)(3) non-profit organization. Contributions to Inkscape are tax deductible in the United States. Who makes Inkscape? Inkscape has many authors, every author retains their own copyright and authors are likewise involved in setting Inkscape's technical and project goals. There are also many other non-coding contributors who are considered important parts of the Inkscape project. If you wish to refer to Inkscape's creators or organisation you can use the terms "Inkscape's Contributors" and "The Inkscape Project" respectively to differentiate from Inkscape the software package. ダウンロード Inkscape を試す準備ができてますか？ すばらしい！ 今すぐ最新バージョンのダウンロード... Free Download Built With'''
