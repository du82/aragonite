["https://inkscape.org/es/*leadership-committee"]
title = "Project Leadership Committee | Inkscape"
full_description = "Inkscape has a Leadership Committee who look after certain functions for the project. These include policy definition, funding and fund-raising, finances and budgeting, brand management and inter-project collaboration. The Inkscape Leadership Committee carries on discussion on the mailing list and in the rocket chat room (also available on IRC). Inkscape is a member of the Software Freedom Conservancy, which provides the project with Fiscal Sponsorship and other legal support infrastructure. Community Membership Policy - Membership of the project grants contributors access to voting and is open to everyone who contributes to the project. Working Group Policy - In order to better organize and recognize the importance of contributions to the project this policy describes how Working Groups (WG) are established. OIN License Agreement (117.4 KB) - The Inkscape Leadership Committee agreed to become a member of the Open Invention Network (OIN), pledging never to use patents aggressively against the Linux System."
