["https://inkscape.org/fr/apropos/usage-de-la-marque"]
title = "Usage de la marque Inkscape | Inkscape"
full_description = "Accueil » À propos » Usage de la marque Usage de la marque Inkscape Nom Inkscape: Open Source Scalable Vector Graphics Editor Notes : « Inkscape » doit prendre une (et une seule) majuscule, et s'écrit en un seul mot. Le nom « Inkscape » est une marque déposée. Graphies incorrectes : inkscape, Ink Scape, Inkspace, InkScape Slogan Draw Freely. Notes : Conservez les majuscules, et n'oubliez pas le point. Ce slogan est une marque déposée. Logos Le logo d'Inkscape est le « logo graphique montagneux ». Il en existe deux variantes officielles : le logo 3D reluisant original et la variante simplifiée, plane. Il y a également deux variantes officielles pour le logo plat : 1 couleur : Les couleurs préférées (par ordre de préférence) sont le noir (sur les fonds clairs) et le blanc (sur les fonds trop foncés). La neige et le col sont transparents. 2 couleurs : La montagne et l'encre doivent être noires, et avec la neige et le col blancs. Le logo d'Inkscape est une marque déposée, sous licence CC BY-SA 3.0. Son auteur original est Andrew Michael Fitzsimon. Polices de caractères La police à utiliser pour le mot « Inkscape » est Linux Libertine. La police manuscrite utilisée pour le slogan est Euphoria Script. Utilisation Pour comprendre comment les ressources relatives à l'image de marque d'Inkscape peuvent être utilisées, référez-vous à la politique de marque. Fichiers à télécharger Euphoria Script Regular Extended Linux Libertine Inkscape Logo SVG Inkscape Flat Logo 2 Color Variant Inkscape Flat Logo with Text Inkscape Flat Logo 1 Color Variant - Bl… Inkscape Flat Logo 1 Color Variant - Wh… Politique d'utilisation des marques déposées d'Inkscape [Note du traducteur : Cette page est une traduction en français non officielle de la politique de marque d'Inkscape. Seul le texte anglais original représente la légalité. Changez la langue d’affichage du site pour le consulter.] 1 But Le Software Freedom Conservancy (ci-après « Conservancy ») a adopté cette Politique afin de s'assurer que l'identité du logiciel de graphisme Inkscape et de sa nature libre et open source soit claire pour tous. En utilisant cette Politique, le projet Inkscape peut répandre l'utilisation d'Inkscape en s'assurant que la marque est protégée de manière conforme avec la loi des marques déposées aux États-Unis. Cette Politique est écrite pour permettre toute utilisation claire et appropriée des marques d'Inkscape tout en prévenant l'usage abusif qui pourrait tromper les utilisateurs sur l'origine du logiciel. En adhérant à cette Politique, vous contribuez à promouvoir au public la liberté d'utiliser et développer le logiciel Inkscape. Le projet Inkscape est un projet membre du Conservancy. Le Conservancy détient les droits des Marques en accord avec sa mission non lucrative correspondant au projet Inkscape. Dans cette Politique, le mot « Marques » réfère à : les termes « Inkscape », « Inkscapers » et « Live Path Effects » ; le logo graphique montagneux (« Logo Inkscape »), que voici : le slogan « Draw Freely ». Cette Politique concerne uniquement les Marques associées au projet Inkscape ; elle ne traite d'aucun copyright associé au logiciel Inkscape. 2 Recommandations concernant les Marques 2.1 Symbole des marques déposées à la première mention La première mention prominente du nom devrait être immédiatement suivie du symbole de marque déposée : « ™ ». Par exemple : « Inkscape™ ». Cette nécessité est dispensée dans tous les cadres où de telles marques ne sont généralement pas incluses : courrier électronique, discussion en ligne, publicités non graphiques (si autorisé), et papiers académiques. Nous encourageons l'utilisation du symbole dès que possible, mais admettons son omission dans de nombreux usages non commerciaux et informels. 2.2 Utilisation des Marques sans permission écrite Vous pouvez utiliser les Marques sans permission écrite préalable (objet des autres sections) : Pour désigner le logiciel Inkscape sous une forme non substantiellement modifiée. « Non substantiellement modifiée » signifie qu'elle est construite à partir du code source fourni par le Projet Inkscape, éventuellement avec quelques modifications mineures incluant mais non limitées à : l'activation ou la désactivation de certaines fonctionnalités par défaut, des traductions dans d'autres langues, des modifications requises pour compatibilité avec une distribution de système d'exploitation spécifique, ou l'inclusion de patchs de correction de bogues. Pour identifier le logiciel Inkscape comme un composant distinct d'une distribution de logiciels. Pour désigner factuellement le Projet Inkscape lui-même, ses produits, ou ses protocoles. Par ailleurs, vous pouvez utiliser les Marques pour désigner des produits, des services, ou des communautés hors du logiciel Inkscape et du Projet Inkscape sans permission écrite dans les contextes suivants : En désignant un logiciel Inkscape qui n'est pas non substantiellement modifié, pour signifier que le logiciel en question est « dérivé de » ou « basé sur » Inkscape. En désignant des communautés d'utilisateurs dans le contexte de leur utilisation du logiciel Inkscape, par ex., des communautés virtuelles, des forums en ligne modérés par une communauté, des consortiums d'utilisateurs organisationnels, etc., sachant que les Marques ne sont pas utilisées pour suggérer le soutien d'une communauté d'utilisateurs par le Projet Inkscape. Nous n'exigeons pas de frais pour une licence d'utilisation des Marques dans ces contextes. Toutefois, nous accueillons bien évidemment les dons. Si vous souhaitez donner au Projet Inkscape, soin du Conservancy, visitez http://inkscape.org/donate.php. Le Conservancy est une association 501(c)(3). 2.3 Utilisation des Marques dans le nom d'un produit Vous pouvez utiliser les Marques comme partie du nom d'un produit conçu pour fonctionner avec Inkscape, tant que le nom complet (avec ses autres composants) distingue clairement et sans ambiguïté le produit en question du logiciel Inkscape lui-même, et la présentation générale du produit n'implique aucune association officielle ou une identité avec le Projet Inkscape. Puisqu'il serait gênant d'insérer un symbole de marque déposée sur une portion d'un nom plus long dont les autres portions sont peut-être elles-mêmes marquées, la nécessité de placer ce symbole est dispensée dans cette circonstance. 2.4 Usages interdits des Marques Vous ne devez pas utiliser les Marques dans les cas suivants : D'une manière qui pourrait créer de la confusion dans l'identité du Projet Inkscape, la provenance de son logiciel, ou la licence du logiciel. D'une manière qui indique un degré d'association plus important entre vous et le Projet Inkscape que la réalité. D'une manière qui implique un successeur désigné à Inkscape (par ex., « Inkscape++ » n'est pas permis). D'une manière qui indique qu'Inkscape favorise une distribution, une plateforme, un produit, etc. par rapport à un autre sauf si cela est explicitement indiqué à l'écrit par Inkscape. 2.5 Limitations de cette Politique Cette Politique ne confère pas de droits pour utiliser les marques déposées « Software Freedom Conservancy », « Conservancy », ou pour utiliser d'autres marques déposées que les Marques listées à la Section 1. Cette Politique ne vous autorise pas à agir comme un agent pour le Conservancy, d'accéder à l'accord d'un soutien ou de créer une responsabilité pour le Projet Inkscape ou le Conservancy. 2.6 Recommandations quant à l'utilisation du Logo Inkscape Le copyright associé au Logo Inkscape est licencié sous la licence Creative Commons Attribution-ShareAlike 3.0, licence des États-Unis. Le Projet Inkscape encourage les artistes à utiliser, modifier et créer des travaux dérivés du Logo Inkscape. Ceci étant dit, le Logo Inkscape sert aussi de Marque graphique pour le Projet Inkscape. Pour empêcher la création de représentations séparées du Logo Inkscape qui concourraient intentionnellement ou par inadvertance avec notre Marque et qui atténueraient la valeur de celle-ci, nous demandons que lorsque le Logo est utilisé pour désigner le Projet Inkscape et/ou le logiciel Inkscape, vous utilisiez le Logo conformément aux recommandations générales d'utilisation décrites dans cette Politique. Nous demandons aussi que vous n'utilisiez pas le Logo Inkscape, ou une portion du Logo Inkscape, comme une partie d'une marque déposée, un logo, ou une autre image de marque pour l'associer à un autre produit, service, ou entité qu'Inkscape. Par exemple, un artiste peut tout à fait créer un travail dérivé utilisant le Logo Inkscape ; cependant, une entreprise malicieuse n'a pas la permission d'utiliser ce travail dérivé comme son logo corporatif. Le Projet Inkscape et le Conservancy se réservent le droit d'interdire une utilisation des Logos inconsistante avec ces lignes directrices qui affaiblirait ou dévaloriserait le Logo Inkscape, créant une vraisemblance de confusion, ou sinon nuit aux droits de marque déposée du Conservancy et du Projet Inkscape par rapport au Logo Inkscape. 2.7 Utilisation des Marques dans le commerce Vous pouvez créer et vendre des marchandises utilisant le nom Inkscape et le Logo Inkscape sans permission supplémentaire tant que vous utilisez seulement des reproductions non modifiées issues de la page du logo sur le site web d'Inkscape. Veuillez nous contacter si vous souhaitez vendre d'autres marchandises comprenant les Marques. Cette section est sujette aux autres conditions contenues dans cette Politique, incluant celles concernant les permissions requises pour l'usage et l'utilisation des Marques comme partie d'un nom de produit. 3 Droits réservés par le Conservancy Le Conservancy se réserve le droit de : vérifier que cette Politique est respectée ; modifier cette Politique conformément à sa mission de protéger le public ; donner des exceptions à cette Politique, de tout genre et pour toute raison, en dépit des autres clauses. 4 Questions Cette Politique est conçue pour sécuriser les Marques d'Inkscape afin de protéger la réputation de ce logiciel, gagnée par les contributions du Projet Inkscape à la communauté du logiciel (libre et) open source. Si vous constatez une utilisation des Marques qui vous semble violer cette Politique ou qui va à l'encontre de l'esprit du Projet Inkscape et de la mission du Conservancy, merci de le signaler au Conservancy en nous contactant à [TRADEMARK@SFCONSERVANCY.ORG]. Si vous avez des questions au sujet de l'utilisation des Marques, ou si vous pensez que vous devriez être autorisé à vous en servir d'une manière non autorisée par cette Politique et souhaitez obtenir l'autorisation, merci de contacter Inkscape en écrivant à [TRADEMARK@SFCONSERVANCY.ORG] ou à Inkscape Project c/o Software Freedom Conservancy, 137 Montague St. Ste 380, Brooklyn, NY 11201-3548."
