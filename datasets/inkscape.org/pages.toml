oes not confer any rights to use the trademarks “Software Freedom Conservancy,” “Conservancy,” or to use any other trademarks other than the Marks listed in Section 1. This Policy does not authorize you to act as an agent for Conservancy, enter into any agreement on behalf of or otherwise create any liability for the Inkscape Project or Conservancy. 2.6 Guidelines for using the Inkscape Logo The copyright associated with the Inkscape Logo are licensed under the Creative Commons license Attribution-ShareAlike 3.0 United States licença. The Inkscape Project encourages artists to use, modify, and create derivative works of the Inkscape Logo. That being said, the Inkscape Logo also serves as a graphic Mark for the Inkscape Project. To prevent the creation of separate depictions of the Inkscape Logo that would intentionally or inadvertently compete with and dilute our Mark, we ask that when using the Logo to refer to the Inkscape Project and/or to the Inkscape software, you use the Logo in compliance with the general usage guidelines provided in this Policy. We also ask that you not use the Inkscape Logo, or any portion of the Inkscape Logo, as part of a trademark, logo, or brand to be associated with any other product, service, or entity other than Inkscape. For example, an artists is welcome to create a derivative work using the Inkscape Logo; however, a ficticious trucking company does not have permission to use that derivative work as its corporate logo. The Inkscape Project and Conservancy reserve the right to prohibit the use of the Logos in a manner inconsistent with these guidelines that would weaken or dilute the Inkscape Logo, create a likelihood of confusion, or otherwise infringe upon the trademark rights of Conservancy and the Inkscape Project in the Inkscape Logo. 2.7 Use of the Marks in merchandising You may create and sell merchandise using the Inkscape name and the Inkscape Logo without additional permission provided that you use only unmodified graphics from this page on the Inkscape website (see below). Please contact us if you would like to sell any other merchandise containing the Marks. This section is subject to the other provisions contained in this Policy, including those regarding permissions required for usage and using the Marks as part of a product name. 3 Rights reserved by Conservancy Conservancy reserves the sole right to: Determine compliance with this Policy. Modify this Policy in ways consistent with its mission of protecting the public. Grant exceptions to this Policy, of any kind and for any reason whatsoever, other clauses notwithstanding. 4 Questions This Policy is designed to keep Inkscape's Marks safe in order to protect this software's reputation, earned by the contributions of the Inkscape Project to the [free and] open source software community. If you see any use of the Marks anywhere that you think violates this Policy or otherwise goes against the spirit of the Inkscape Project and Conservancy's mission, please bring it to Conservancy's attention by contacting us at [TRADEMARK@SFCONSERVANCY.ORG]. If you have questions about using the Marks, or if you think you should be able to use the Marks for any purpose not allowed by this Policy and would like permission for that use, please contact Inkscape by emailing [TRADEMARK@SFCONSERVANCY.ORG] or by writing to Inkscape Project c/o Software Freedom Conservancy, 137 Montague St. Ste 380, Brooklyn, NY 11201-3548.'''
