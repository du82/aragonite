["https://inkscape.org/en/news/2014/03/01/inkscape-joins-open-invention-network"]
title = "Inkscape joins the Open Invention Network | Inkscape"
description = "The Inkscape Project is joining the Open Invention Network, a group of 750 other projects who all pledge to never use patents aggressively against the Linux System."
full_description = 'Home » News » 2014 » March » 1st » Inkscape joins the Open Invention Network Inkscape joins the Open Invention Network March 1, 2014, 9:12 a.m. The Inkscape Board has voted in favor of the Inkscape Project joining as a member of the Open Invention Network. In so doing we pledge to never use patents aggressively against the Linux System. As part of the OIN, we join almost 750 projects and companies from the software industry in a pledge that covers over 2,100 Open Source packages. This helps to reduce risk on the core Linux System and other middleware technologies. Valer Mischenko of OIN sums it up: "This is the largest community to address software patent challenges in the world. The idea is: when everybody pledges freedom, there will be no wars." For more information, please read on, or go to openinventionnetwork.com'
