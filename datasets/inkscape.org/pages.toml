["https://inkscape.org/de/ueber/features"]
title = "Features | Inkscape"
full_description = '''Startseite » Über » Features Features von Inkscape Objekte erstellen Zeichnen: Bleistiftwerkzeug (Freihandzeichnen von einfachen Pfaden), Füllerwerkzeug (Bézierkurven und gerade Linien), Kalligrafiewerkzeug (Freihandzeichnen von kalligrafischen Strichen) Formenwerkzeuge: Rechtecke (können abgerundete Ecken haben), Ellipsen (mit Kreisen, Kreisbögen und -segmenten), Sterne/Polygone (können abgerundet und/oder zufällig verformt werden), Spiralen Textwerkzeug (mehrzeilig, komplette Direktbearbeitung) Einbindung von Pixelgrafiken (Erstellen und Einbetten von Pixelgrafiken in ausgewählte Objekte) Klone ("live"-verknüpfte Kopien von Objekten), beinhaltet ein Werkzeug für Muster und die Ausrichtung von Klonen Objekte bearbeiten Verändern (bewegen, skalieren, rotieren, neigen), sowohl interaktiv als auch durch Angabe genauer Zahlenwerte Z-Ordnung anpassen (absenken und anheben) Objekte gruppieren ("Auswahl in Gruppe" ohne Aufhebung der Gruppierung, oder "Gruppe öffnen" wandelt die Gruppe vorübergehend in eine Ebene um) Ebenen (Sperren und/oder Verstecken einzelner Ebenen, neu anordnen, usw.; Ebenen können in einer hierarchischen Baumstruktur angeordnet werden) Ausrichten und verteilen Füllung und Kontur Farbauswahl (RGB, HSL, CMYK, Farbrad) Farben von anderen Objekten übernehmen Kopieren/Einfügen der Formatierung Farbverlauf mit mehreren Zwischenfarben Musterfüllung (Pixelgrafik/Vektoren) Konturen mit vielen vordefinierten Mustern Pfadmarkierungen (Anfangs-/Mittel-/Endmarkierung z. B. Pfeilspitzen) Pfadbearbeitung Knotenbearbeitung: Knoten verschieben, Bézier-Knotenanfasser, Knoten ausrichten und verteilen usw. In Pfad umwandeln (für Textobjekte oder Formen), auch Konturen können in Pfade umgewandelt werden Boole'sche Operatoren Pfadvereinfachung in unterschiedlichem Ausmaß Pfade kombinieren/zerlegen, inklusive dynamischer und verknüpfter Versatzobjekte Pixelgrafiken vektorisieren (farbige und einfarbige Pfade) Textunterstützung Mehrzeilige Texte Benutzung aller Outline-Schriften möglich, Unterstützung für Schriften, die von rechts nach links geschrieben werden Unterschneidung, Buchstabenabstand, Zeichenabstand anpassen Text an Pfad ausrichten (Text und Pfad weiterhin bearbeitbar) Textumbruch an Form anpassen (folge Pfad beim Formfüllen) Rendern Komplette Kantenglättung Alpha-Transparenz-Unterstützung für die Darstellung und den PNG-Export Vollständiges Live-Rendern von Objekten während der Objektveränderung (bewegen, skalieren, rotieren, neigen) Sonstiges Direktbearbeitung des XML-Codes im XML-Editor Exportformate: PNG, OpenDocument Drawing, DXF, sk1, PDF, EPS und PostScript uvm. Kommandozeilen-Optionen für Export und Umwandlung Standard-konforme SVG-Dateierstellung und -bearbeitung'''
