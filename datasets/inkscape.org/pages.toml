["https://inkscape.org/es/acerca-de/resumen"]
title = "Resumen | Inkscape"
full_description = "Inicio » Acerca de » Resumen Resumen Para todo tipo de diseñadores El proceso de diseño puede empezar con un garabato en una servilleta, un boceto de tus ideas, una foto de un objeto memorable o una maqueta virtual que no llegaría a funcionar para acabar un proyecto. Inkscape te ayuda, desde esta fase, a conseguir un diseño de calidad profesional, preparado para ser publicado en la web o en un medio impreso. Si eres nuevo en el proceso de creación de gráficos vectoriales puede que te sientas extraño pero enseguida te sorprenderás de la flexibilidad y de la potencia que te ofrece Inkscape. Normalmente se prefiere el diseño vectorial para la crear logotipos, de ilustraciones y de creaciones que requieran una gran escalabilidad, es decir que se puedan ampliar o reducir a cualquier tamaño. Inkscape es un programa usado tanto a nivel particular como por una gran variedad de empresas (marketing o imagen corporativa, ingeniería/CAD, gráficos web o diseño de cómics). Hay muchos recursos de aprendizaje disponibles, ¡aprovéchalos! Publicación profesional Cualquier proyecto puede ser exportado a formatos ideales tanto para navegadores web como para imprentas. Es multiplataforma, es decir, es fácil de ejecutar en Windows, Mac OS X y distribuciones Linux. Visita la página de descarga para instalar o compartir la aplicación. Comunidad libre ¡Inkscape es libre! Con ello, entendemos que es libre de coste, uso y distribución. Al ser de código abierto, eres libre para modificarlo a tu gusto. La página de descarga muestra su última versión así como enlaces de desarrollo, también para conseguir su código fuente. El desarrollo de Inkscape se adhiere al estándar de código fuente abierto (open source) con la intención de proveer a la comunidad de usuarios de un producto sólido y útil. Dicho proceso de desarrollo es abierto y está basado en la comunidad, para crear un núcleo sólido y ampliable que parte del código de Sodipodi Hydra. Por ello, si estás interesado y dispones de los conocimientos necesarios o una actitud positiva, no dudes en unirte a nosotros. Visita nuestra página contribuye para saber más."
