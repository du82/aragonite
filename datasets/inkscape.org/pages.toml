full_description = '''Home » News » Latest News News 2025 2024 2023 2022 2021 2020 2019 2018 2017 2016 2015 2014 2013 2012 2011 Latest News Inkscape Summit Frankfurt 2025 Feb. 5, 2025, 1:14 p.m. For the past few days, 7 Inkscape Members met up in Frankfurt, Germany to collaborate on various projects and get to know each other. We were especially delighted to have two InkStitch maintainers, a major downstream project of Inkscape, join us. This way, we got to learn about the struggles and worries of projects using Inkscape better, and even built a new capability for extensions to interact with Inkscape during the event. Read more Inkscape at 21 is growing up and getting organized Nov. 6, 2024, 5:07 p.m. November 6, 2024, marks the end of the 20th anniversary year for the Inkscape project, and the beginning of a new decade of adventure. There were a few milestones this past year, among them an informal global celebration, a bug-fix program, an About Screen Contest, an Inkscape Summit, a summer of code, and the launch of version 1.4. Here’s a brief look at some of those milestones. Read more Inkscape’s 20th Anniversary Nov. 5, 2024, 11:59 p.m. On November 18, 2023, the Inkscape project celebrated its 20th anniversary. The anniversary celebration was an online get-together of Inkscape users and contributors. This was an initiative by the Vectors team and the intention was to bring Inkscape users and contributors together to celebrate 20 years of Inkscape. Read more Inkscape launches version 1.4, with powerful new accessible and customizable features Oct. 13, 2024, 6:44 p.m. After months of waiting, we are finally ready to unbox the latest version of Inkscape... meet 1.4, the Geek edition, where accessibility and customization reign. Inkscape project developers, most of them volunteer contributors from countries around the world, have been plugging away behind the scenes on new features, improving current ones, bug fixes and setting the stage for the arrival of GTK 4. Read more Inkscape Summit 2024 May 16, 2024, 5:35 p.m. We had a great Inkscape Summit in Rennes, France. Our three-day meeting was hosted by long-time Inkscaper's Elisa and Cédric in their school of design Activ.design... Read more Congratulations to Inkonic on winning Inkscape 1.4 About Screen Contest May 6, 2024, 2:20 p.m. We have a winner! Congratulations to the winning entry by artist Inkonic for their artwork "Inkscape's Path–Artist's Blossom". Read more 1.4 About Screen Contest March 3, 2024, 12:24 a.m. Announcing the About Screen Contest for Inkscape 1.4! Calling all artists! Each new version of Inkscape we run a fun contest inviting all seasoned Inkscape artists and newcomers to participate in the "About Screen" contest. Read more It’s time to celebrate the success of GSOC 2023 and recruit for 2024 with Inkscape Feb. 23, 2024, 9:09 p.m. Inkscape’s involvement in Google’s Summer of Code (GSoC) program is one of the ways the project helps to advance both learning and new and improved features in the program. We’re excited to be taking part in GSoC once more in 2024! Read more Creators: Don't Fall for Inkscape Impersonator Feb. 14, 2024, 3:41 p.m. Someone is reaching out by email to creators pretending to be from the Inkscape project to solicit partnerships. They have used the name “Inkscape PhotoEditor,” which does not exist. This is not us. Any official invitations to collaborate from the project will be listed prominently on our website. Read more Inkscape 1.3.2 solves data loss bug in previous release Dec. 1, 2023, 5:52 p.m. The Inkscape Developer Team released version 1.3.2 on November 26, 2023, to solve an important data loss bug in 1.3.1. If you installed 1.3.1, we recommend you update Inkscape as soon as possible. If you’re a Windows user, please uninstall the older version first. Read more Big, small release – Inkscape 1.3.1 is out! Nov. 18, 2023, 5:23 p.m. The latest point release, Inkscape 1.3.1, has grown into one of the biggest bug fix packages we've ever shared with the community. Update to benefit from more than 70 bug fixes, 16 improved user interface translations, and even two small, new features! Read more Inkscape launches version 1.3 with a focus on organizing work efficiently July 23, 2023, 6 p.m. With version 1.3 of Inkscape, you’ll find improved performance, several new features, and a solid set of improvements to a few existing ones. This version is squarely focused on helping users get organized and work more efficiently with our free and open source vector-editing software. Read more What was it like at Wilberweek? (GIMP Hackfest) July 19, 2023, 4:42 p.m. A week with The GIMP project at Blender HQ, Amsterdam I was really excited to have the opportunity to meet some of the GIMP developers in-person after many conversations with them over IRC in the past, and Wilberweek presented not only a great opportunity to do just that, but also to visit the Headquarters of another of my favourite FOSS projects, the unstoppable freedom-centric software juggernaut that is the Blender project. Read more Inkscape reveals tools for organizing efficiently in beta version of 1.3 May 30, 2023, 10:17 p.m. From shapes and patterns to documents and fonts, Inkscape’s 1.3 beta release offers you some new features, alongside a basket full of improvements large and small. Let’s dig into a few of the bells and whistles this new version has to offer. Read more Meet Inkscape's New About Screen Artist May 23, 2023, 7:09 p.m. For each major release, we host a contest for artists who compete to have their artwork displayed on Inkscape's About Screen. Meet the winning artist for the upcoming 1.3 release. Read more ‹‹ previous 1 2 3 4 ... 11 next ››'''
