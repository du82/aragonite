["https://inkscape.org/hr/o-programu"]
title = "O programu | Inkscape"
description = "Inkscape je profesionalni vektorski grafički softver za Windows, macOS i GNU/Linux sustave te je u cijelosti preveden na hrvatski. Koriste ga profesionalni dizajneri i amateri širom svijeta za stvaranje raznovrsne grafike, kao što su ilustracije, ikone, logotipi, dijagrami, karte i web grafike. Inkscape koristi W3C‑ov otvoreni SVG (skalabilne vektorske grafike) standard kao izvorni format i besplatan je softver otvorenog koda."
full_description = "Početna » O programu O programu Inkscape Što je Inkscape? Inkscape je profesionalni vektorski grafički softver za Windows, macOS i GNU/Linux sustave te je u cijelosti preveden na hrvatski. Koriste ga profesionalni dizajneri i amateri širom svijeta za stvaranje raznovrsne grafike, kao što su ilustracije, ikone, logotipi, dijagrami, karte i web grafike. Inkscape koristi W3C‑ov otvoreni SVG (skalabilne vektorske grafike) standard kao izvorni format i besplatan je softver otvorenog koda. Inkscape pruža sofisticirane alate za crtanje vektorskih grafika, koji su u potpunosti usporedivi sa standardnim grafičkim programima. Može uvesti i izvesti razne formate, uključujući SVG, AI, EPS, PDF, PS i PNG. Sadrži mnogobrojne funkcije, jednostavno sučelje, višejezičnu podršku i mogućnost proširenja softvera – korisnici mogu prilagoditi Inkscapeovu funkcionalnost raznim dodacima. Međunarodna korisnička zajednica projekta Inkscape raste iz dana u dan, te postoje mnogi materijali za učenje, koji ti pomažu u stvaranju tvojih kreacija. Pomoć i podršku pruža zajednica, a postoji mnogo načina kako joj se možeš priključiti, ako želiš doprinijeti razvoju Inkscape projekta. Inkscape je član organizacije Software Freedom Conservancy, neprofitne organizacije po US 501(c)(3). Doprinosi za Inkscape su porezno priznati u SAD‑u. Tko razvija Inkscape? Inkscape ima mnogo autora, svaki autor zadržava svoja autorska prava i autori su također uključeni u postavljanje Inkscapeovih tehničkih i projektnih ciljeva. Postoje i mnogi drugi neprogramerski suradnici, koji su također važni u Inkscape projektu. Ako se obraćaš stvarateljima ili organizaciji Inkscapea, koristi izraze „Inkscape suradnici” i „Inkscape projekt”, kako bi se razlikovalo od samog programskog paketa „Inkscape”. Preuzimanje Želiš isprobati Inkscape? Super! Preuzmi najnoviju verziju … Besplatno preuzimanje Izrađeno pomoću"
