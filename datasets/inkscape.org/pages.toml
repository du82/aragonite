om this page on the Inkscape website (see below). Please contact us if you would like to sell any other merchandise containing the Marks. This section is subject to the other provisions contained in this Policy, including those regarding permissions required for usage and using the Marks as part of a product name. 3 Rights reserved by Conservancy Conservancy reserves the sole right to: Determine compliance with this Policy. Modify this Policy in ways consistent with its mission of protecting the public. Grant exceptions to this Policy, of any kind and for any reason whatsoever, other clauses notwithstanding. 4 Questions This Policy is designed to keep Inkscape's Marks safe in order to protect this software's reputation, earned by the contributions of the Inkscape Project to the [free and] open source software community. If you see any use of the Marks anywhere that you think violates this Policy or otherwise goes against the spirit of the Inkscape Project and Conservancy's mission, please bring it to Conservancy's attention by contacting us at [TRADEMARK@SFCONSERVANCY.ORG]. If you have questions about using the Marks, or if you think you should be able to use the Marks for any purpose not allowed by this Policy and would like permission for that use, please contact Inkscape by emailing [TRADEMARK@SFCONSERVANCY.ORG] or by writing to Inkscape Project c/o Software Freedom Conservancy, 137 Montague St. Ste 380, Brooklyn, NY 11201-3548.'''
