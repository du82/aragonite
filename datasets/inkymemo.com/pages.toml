 was a jacob’s staff or cross staff, a precise graduated bar with a sliding crossbar to determine the angle between the horizon and stars. In later times, more precise instruments like the sextant were used. Sextants were called that because they had a circular arc for measuring angles which was 60 degrees wide. Sextant is latin for 1/6th (of a circle). Add two more of the 60 degree arcs and you get the protractor in your geometry box again. The divider in that same box came straight from the navigator’s arsenal for measuring distances on maps and charts.Sextant, Image – Wikimedia CommonsWe’re not saying a pirate ship was a house of scholars, of course. Nothing of the sort. There are people who killed and plundered after all. But keep in mind that they ran most of their decisions democratically, and the two kinds of crew who they often kidnapped to work on ships, because they were so valuable, were good navigators and musicians..stk-5a6354c:hover{border-top-right-radius:%spx !important;border-bottom-right-radius:%spx !important;padding-right:function(n){return this.substring(this.length - n,this.length)}px !important;padding-left:function(n){return this.substring(0,n)}px !important;right:function(n){return this.substring(this.length - n,this.length)}px !important;left:function(n){return this.substring(0,n)}px !important}:where(.stk-hover-parent:hover,.stk-hover-parent.stk--is-hovered) .stk-5a6354c{border-top-right-radius:%spx !important;border-bottom-right-radius:%spx !important;padding-right:function(n){return this.substring(this.length - n,this.length)}px !important;padding-left:function(n){return this.substring(0,n)}px !important;right:function(n){return this.substring(this.length - n,this.length)}px !important;left:function(n){return this.substring(0,n)}px !important}:where(.stk-block-accordion.stk--is-open) .stk-5a6354c{border-top-right-radius:%spx !important;border-bottom-right-radius:%spx !important;padding-right:function(n){return this.substring(this.length 