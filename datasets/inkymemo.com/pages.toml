famous drug lord Pablo Escobar was estimated to be the 7th richest man in the world. The tons of cocaine his organization was shipping abroad every week meant around $400 million earned on a weekly basis.He’d been growing to this stature since the 1970’s. Very early on he was making more money, all in cash, than they knew what to do with. Cash was stashed everywhere, in warehouses and fields. His brother, the accountant, was spending $2500 a month on rubber bands to hold the bundles of cash together. In spite of this, they were writing off $2 billion (with a B) of cash every year, lost to hungry rats and just to loss. Could you imagine how much more they would have lost without the rubber bands?With some of those riches he saved from rats, Escobar created a private zoo in his large estate near Medellin. In this zoo were 4 hippos. After the manhunt in 1993 which led to his death, his estate went into neglect and the hippos roamed free and reproduced freely. By the early 2000s there were 40 hippos in and around the estate. By 2018 there are estimated to be over a 100, and their territory now ranges all the way to the Magdalena River, where our story started.Never underestimate the superpowers of a humble rubber band. Millions of rubber bands are even more potent. Clearly they can do anything, including making a dent in a mass extinction or two..stk-a355624:hover{border-top-right-radius:%spx !important;border-bottom-right-radius:%spx !important;padding-right:function(n){return this.substring(this.length - n,this.length)}px !important;padding-left:function(n){return this.substring(0,n)}px !important;right:function(n){return this.substring(this.length - n,this.length)}px !important;left:function(n){return this.substring(0,n)}px !important}:where(.stk-hover-parent:hover,.stk-hover-parent.stk--is-hovered) .stk-a355624{border-top-right-radius:%spx !important;border-bottom-right-radius:%spx !important;padding-right:function(n){return this.substring(this.length - n,this.lengt