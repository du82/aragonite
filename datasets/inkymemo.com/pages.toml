title = "Calligraphy Ink Brushes from China and Four Treasures of The Study - Inky Memo"
description = "As pens and modern instruments become the defacto choice for regular writing its ubiquity has been on the decline, but the traditional ink brush continues to"
full_description = "Calligraphy Ink Brushes from China and Four Treasures of The StudySamir BharadwajHistory & StoriesThis article includes affiliate links to products from Amazon and other stores During the Ming Dynasty, renowned for its ceramics, Liulichang was a factory producing glazed tiles for the most prestigious buildings and temples of the time. Today nestled in downtown Beijing, Liulichang is an arts, crafts and cultural quarter. Designed to take you back in time to an old, if idealized, version of a Chinese village, the street is a haven for traditional cultural knick-knacks and tools for modern artists and dabblers in traditional mediums.Glazed earthenware, Ming Dynasty, Image Courtesy – Wikimedia CommonsNestled in this showcase for the classic and the old is a large store filled with the finest of writing brushes. Daiyuexuan, the famous brush makers, are over a hundred years old. Founded in 1916 by Dai Yuexuan, the establishment has been recognized as one of China’s most valuable and traditional brands and has been the choice of Chinese leaders and artists through the 20th century. Liulichang, Beijing, where Dai Yuexuan first founded his own business of making ink brushes, Image – WikipediaAs pens and modern instruments become the defacto choice for regular writing its ubiquity has been on the decline, but the traditional ink brush continues to be a staple among calligraphers, and Huzhou style brushes made by Daiyuexuan continue to be a beacon in the world of quality writing brushes. Dai Yuexuan hailed from the Zhejiang Province. There, in Huzhou city, he picked up his trade, as thousands have over a long history of brush making in the region, and he built his workshop around it.Handmade Brushes from China, Image Courtesy – Wikimedia Commons.stk-12aafd4:hover{border-top-right-radius:%spx !important;border-bottom-right-radius:%spx !important;padding-right:function(n){return this.substring(this.length - n,this.length)}px !important;padding-left:function(n