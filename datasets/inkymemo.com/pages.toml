uring steel dip-pen nibs.By the 1850s, Birmingham had over a 100 steel nib manufacturers, producing half the world’s nibs. The largest factory employed 2000 people. It was a steel rush! With every revolution, however, comes an unnoticed loss. So long and so hard had civilization craved a strong, durable and dependable fine writing nib, that all the new nibs were fine pointed. It was now finally possible to make a precision pointed writing instrument and so they all became fine pointed. It led to an explosion of writing and literacy across Europe and the World, second only to the invention of the printing press, but broad edged calligraphy took a back seat..stk-9e2d5ae:hover{border-top-right-radius:%spx !important;border-bottom-right-radius:%spx !important;padding-right:function(n){return this.substring(this.length - n,this.length)}px !important;padding-left:function(n){return this.substring(0,n)}px !important;right:function(n){return this.substring(this.length - n,this.length)}px !important;left:function(n){return this.substring(0,n)}px !important}:where(.stk-hover-parent:hover,.stk-hover-parent.stk--is-hovered) .stk-9e2d5ae{border-top-right-radius:%spx !important;border-bottom-right-radius:%spx !important;padding-right:function(n){return this.substring(this.length - n,this.length)}px !important;padding-left:function(n){return this.substring(0,n)}px !important;right:function(n){return this.substring(this.length - n,this.length)}px !important;left:function(n){return this.substring(0,n)}px !important}:where(.stk-block-accordion.stk--is-open) .stk-9e2d5ae{border-top-right-radius:%spx !important;border-bottom-right-radius:%spx !important;padding-right:function(n){return this.substring(this.length - n,this.length)}px !important;padding-left:function(n){return this.substring(0,n)}px !important;right:function(n){return this.substring(this.length - n,this.length)}px !important;left:function(n){return this.substring(0,n)}px !important}.stk-9e2d5ae{right:function(n){return th