full_description = "The Evolution of Broad Edge Nibs and RundschriftSamir BharadwajHistory & StoriesThis article includes affiliate links to products from Amazon and other stores Traditional arts are always dying. You could go back a few thousand years and will likely find Babylonian scribes decrying the death of good old, cultured, clay tablet writing in favor of all this fancy pen, ink and papyrus nonsense the kids were then using. “It will never last!”, they would have warned, and they were right.The ‘kids’ with their gritty iron gall ink and reed pens didn’t last. The goose feather would be the death of them, or their writing habits anyway. Quills took over and ever thinner, more richly-coloured synthetic inks were soon in vogue. The flexible (read unreliable) tip of the quill, and the unyielding chisel edge of the reed pen, resulted in a variety of scripts and lettering styles. Whether you liked it or not, line variation was unavoidable, so you had to make the best of it. A flurry of calligraphic pen flourishes were born and writing would never be boring again. But a new nemesis was lurking.A parchment quill and ink, Image Courtesy – Wikimedia Commons.stk-219f13c:hover{border-top-right-radius:%spx !important;border-bottom-right-radius:%spx !important;padding-right:function(n){return this.substring(this.length - n,this.length)}px !important;padding-left:function(n){return this.substring(0,n)}px !important;right:function(n){return this.substring(this.length - n,this.length)}px !important;left:function(n){return this.substring(0,n)}px !important}:where(.stk-hover-parent:hover,.stk-hover-parent.stk--is-hovered) .stk-219f13c{border-top-right-radius:%spx !important;border-bottom-right-radius:%spx !important;padding-right:function(n){return this.substring(this.length - n,this.length)}px !important;padding-left:function(n){return this.substring(0,n)}px !important;right:function(n){return this.substring(this.length - n,this.length)}px !important;left:function(n){return 