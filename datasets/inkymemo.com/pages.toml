full_description = "How Rubber Bands Are Strangely Tied To Pablo EscobarSamir BharadwajHistory & StoriesThis article includes affiliate links to products from Amazon and other stores 12,000 years ago, a settlement of ancient humans drew art on stone, depicting the animals they hunted in the Magdalena River Valley in Columbia. Giant sloths, mastodons and various large beasts populate the rock walls, painted in ocre across hundreds or maybe thousands of years.These Megafauna, giant creatures of a bygone era, are all now extinct. Today elephants are the only large plant eating animals we have left on land. A last remnant of hundreds and thousands of species which died out or which we hunted to extinction for food.This was 10,000 BCE. Many thousands of years later, north of the Magdalena Valley, the Olmec people bloomed and gave us the magic of rubber. Besides giving us erasers to fawn over as stationery lovers, in the mid 1800s, rubber’s stretchy nature resulted in the first patent for an elastic rubber band as a fastener.Eraser, Image Courtesy – Wikimedia CommonsOver the next 100 years, rubber bands developed slowly until in the 1930’s an American manufacturer of rubber started marketing bands made from discarded tyre inner tubes to newspaper companies. They were to protect all those dailies thrown at people’s doors every morning. They also sold them for agricultural use and eventually better ways were invented to make rubber bands, and they became the ubiquitous office supply we know today.Rubber Bands, Image Courtesy – Wikimedia Commons.stk-a89c02e:hover{border-top-right-radius:%spx !important;border-bottom-right-radius:%spx !important;padding-right:function(n){return this.substring(this.length - n,this.length)}px !important;padding-left:function(n){return this.substring(0,n)}px !important;right:function(n){return this.substring(this.length - n,this.length)}px !important;left:function(n){return this.substring(0,n)}px !important}:where(.stk-hover-parent:hover,.stk-ho