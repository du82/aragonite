description = "We can assume the scribes of those times used quills, reed styluses and all manner of tools to draw out the staffs and musical notes. Maybe they even had"
full_description = "Rastrum – The 5 pointed metal nib pen for writing musicSamir BharadwajHistory & StoriesThis article includes affiliate links to products from Amazon and other stores God may or may not have invented music, but His followers certainly had a hand in standardizing it. Like the history of the written word and mass education, the history of written music is closely related to religion. Modern music notation was invented in the church to help standardize hymns and prayer music. Various methods of recording musical notes have existed since the beginning of civilisation, but the idea of using a 5-line staff for music notation goes back to an Italian Benedictine monk from a thousand years ago.We can assume the scribes of those times used quills, reed styluses and all manner of tools to draw out the staffs and musical notes. Maybe they even had their own labor-saving devices which have been lost to time. But it took the invention of the metal-nibbed dip pen to lead to one of the most bizarre and beautiful writing instruments there ever was, the Rastrum..stk-2077fd8:hover{border-top-right-radius:%spx !important;border-bottom-right-radius:%spx !important;padding-right:function(n){return this.substring(this.length - n,this.length)}px !important;padding-left:function(n){return this.substring(0,n)}px !important;right:function(n){return this.substring(this.length - n,this.length)}px !important;left:function(n){return this.substring(0,n)}px !important}:where(.stk-hover-parent:hover,.stk-hover-parent.stk--is-hovered) .stk-2077fd8{border-top-right-radius:%spx !important;border-bottom-right-radius:%spx !important;padding-right:function(n){return this.substring(this.length - n,this.length)}px !important;padding-left:function(n){return this.substring(0,n)}px !important;right:function(n){return this.substring(this.length - n,this.length)}px !important;left:function(n){return this.substring(0,n)}px !important}:where(.stk-block-accordion.stk--is-open) .stk-2077fd8{border