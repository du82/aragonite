){return this.substring(this.length - n,this.length)}px !important;left:function(n){return this.substring(0,n)}px !important}}What are the Four Treasures of Study?In Huzhou, and Shanlian, a small town in the area, fine ink brushes have been made for 2000 years. Between the mulberry groves and the ancient streams that dot the landscape, writing brush manufacture has been a major part of the local economy and remains a big presence even today. In the old days, so renowned were the fine qualities of the Huzhou Brush that it found its way into the traditional Four Treasures of Study: A writing brush, fine paper, an ink stick and a ink stone, each from their own special town and region known for their long tradition of producing the best versions of them. Brush, ink, paper and ink stone used in Chinese calligraphy, Image Courtesy – WikipediaThese Four treasures or jewels continue to be an important tradition in China and across the Far eastern cultures which were influenced by them. Some brush manufacture has now been mechanized, but that is for mass produced middle-grade brushes. The finest writing instruments in the Huzhou style are still handmade..stk-e9c330b:hover{border-top-right-radius:%spx !important;border-bottom-right-radius:%spx !important;padding-right:function(n){return this.substring(this.length - n,this.length)}px !important;padding-left:function(n){return this.substring(0,n)}px !important;right:function(n){return this.substring(this.length - n,this.length)}px !important;left:function(n){return this.substring(0,n)}px !important}:where(.stk-hover-parent:hover,.stk-hover-parent.stk--is-hovered) .stk-e9c330b{border-top-right-radius:%spx !important;border-bottom-right-radius:%spx !important;padding-right:function(n){return this.substring(this.length - n,this.length)}px !important;padding-left:function(n){return this.substring(0,n)}px !important;right:function(n){return this.substring(this.length - n,this.length)}px !important;left:function(n){return this.substr