, but there’s something romantic about the old dip pen version. You can imagine the classic European composers absent mindedly lining their sheets so they can quickly scribble a musical idea before it’s lost.Alessandro Scarlatti – Griselda, Image Courtesy – Wikimedia CommonsSpeaking of classical composers, Beethoven’s notebooks are an invaluable artifact because he wrote these musical notebooks throughout his working life. Several dozens of them were sold off after his death as mementos of a celebrity, which he was even in his time. These now priceless artifacts changed hands over time and were even torn apart, with single pages given away as gifts. Musicologists have tried to piece them together over the past few centuries but how do you put together loose pages of notebooks from a lifetime of work?That’s where Rastrology comes in. It’s the study of the lines and marks made by the rastrum. In the wear and tear of the nibs and the mark quality, musicologists have found subtle clues that have helped add an age and chronology to hundreds of pages of sheet music. There’s a certain poetic melody to that idea. Not only did the musician leave their signature on all that old music, but so did the humble pen they recorded it with..stk-eb16418:hover{border-top-right-radius:%spx !important;border-bottom-right-radius:%spx !important;padding-right:function(n){return this.substring(this.length - n,this.length)}px !important;padding-left:function(n){return this.substring(0,n)}px !important;right:function(n){return this.substring(this.length - n,this.length)}px !important;left:function(n){return this.substring(0,n)}px !important}:where(.stk-hover-parent:hover,.stk-hover-parent.stk--is-hovered) .stk-eb16418{border-top-right-radius:%spx !important;border-bottom-right-radius:%spx !important;padding-right:function(n){return this.substring(this.length - n,this.length)}px !important;padding-left:function(n){return this.substring(0,n)}px !important;right:function(n){return this.substring