title = "How are Pirates Connected to Geometry? - Inky Memo"
description = "Did you know that during the heydays of piracy on the high seas, when beards were famous and boards were walked, a pirate ship was a roiling pit of Geometry?"
full_description = "How are Pirates Connected to Geometry?Samir BharadwajHistory & StoriesThis article includes affiliate links to products from Amazon and other stores Did you know that during the heydays of piracy on the high seas, when beards were famous and boards were walked, a pirate ship was a roiling pit of Geometry? On ships made of wood and often on the run from the navy, it’s no surprise that a carpenter was a crucial member of the crew. Not just good proper carpenters but innovative ones. A pirate ship’s carpenter needed to make do with makeshift materials and difficult conditions. Like any carpenter for millennia before them, they were very dependent on instruments like plumb lines or plum bob and a carpenter’s square (or try-square). This is a right-angle of wood or metal used to properly square off pieces of wood. It has been found in use all the way from ancient Egypt to your current carpenter’s work bag. It’s also very similar to the triangles or set squares you had in your school geometry set.Plum Bob, Image – Wikimedia Commons Carpenter’s Square, Image – Wikimedia Commons.stk-096ee96:hover{border-top-right-radius:%spx !important;border-bottom-right-radius:%spx !important;padding-right:function(n){return this.substring(this.length - n,this.length)}px !important;padding-left:function(n){return this.substring(0,n)}px !important;right:function(n){return this.substring(this.length - n,this.length)}px !important;left:function(n){return this.substring(0,n)}px !important}:where(.stk-hover-parent:hover,.stk-hover-parent.stk--is-hovered) .stk-096ee96{border-top-right-radius:%spx !important;border-bottom-right-radius:%spx !important;padding-right:function(n){return this.substring(this.length - n,this.length)}px !important;padding-left:function(n){return this.substring(0,n)}px !important;right:function(n){return this.substring(this.length - n,this.length)}px !important;left:function(n){return this.substring(0,n)}px !important}:where(.stk-block-accordion.stk--