spread his book of Rundschrift lessons around the globe, translated into several languages. When Soennecken manufactured a custom broad edged steel nib for his Rundschrift lettering, the perfect storm was complete and broad nib calligraphy grew popular again. Rundschrift, based on the French Rounde style from a century earlier, remained the standard writing style of the French Ministry of Finance until World War II.Soennecken Hole Punch, Image Courtesy – Wikimedia CommonsIf you like hole punches and folders, and punching random holes into paper for entertainment, you have this German gentleman to thank for your hobby. But if you’re into lettering or calligraphy, you owe Soennecken a round of applause. His efforts kept broad nib calligraphy alive into the era of the metal nib, and he wrote one of the first mass produced calligraphy instruction books with detailed diagrams. You owe him the applause for those contributions and for just being a well-rounded stationery addict..stk-43ed529:hover{border-top-right-radius:%spx !important;border-bottom-right-radius:%spx !important;padding-right:function(n){return this.substring(this.length - n,this.length)}px !important;padding-left:function(n){return this.substring(0,n)}px !important;right:function(n){return this.substring(this.length - n,this.length)}px !important;left:function(n){return this.substring(0,n)}px !important}:where(.stk-hover-parent:hover,.stk-hover-parent.stk--is-hovered) .stk-43ed529{border-top-right-radius:%spx !important;border-bottom-right-radius:%spx !important;padding-right:function(n){return this.substring(this.length - n,this.length)}px !important;padding-left:function(n){return this.substring(0,n)}px !important;right:function(n){return this.substring(this.length - n,this.length)}px !important;left:function(n){return this.substring(0,n)}px !important}:where(.stk-block-accordion.stk--is-open) .stk-43ed529{border-top-right-radius:%spx !important;border-bottom-right-radius:%spx !important;padding-right:fu