ur future self (and maybe descendants) of what was really going on in your life at this time.”— Derek Sivers (Musician, Entrepreneur, Book Publisher)4. “The notebook is the place where you figure out what’s going on inside you or what’s rattling around. And then, the keyboard is the place that you go to tell people about it.”― Austin Kleon (Author)5. “On many of the jobs I’ve held, even if someone did not know my name or position, I was commonly referred to as “that guy with the notebook”. I was constantly taking notes. It is also a nice “prop” if you want to appear “busy”. A thoughtful look, a slight chin rub, and a few notes. Working hard.” ― Michael A. LaPlante (Writer)6. “I can divide my life into the disorganized forgetful mess I was before I had my first notebook, and the increasingly organizing and effective person I am still becoming since then.” ― Chris J Wilson (Sketchnoter)7. “I find a lot of writing happens when you’re not actually at the computer. So I carry a notebook.” ― Noah Baumbach (Filmmaker)8. “Always carry a notebook. And I mean always. The short-term memory only retains information for three minutes; unless it is committed to paper you can lose an idea for ever.” ― Will Self (Author)9.“Keep a notebook. Travel with it, eat with it, sleep with it. Slap into it every stray thought that flutters up into your brain. Cheap paper is less perishable than gray matter. And lead pencil markings endure longer than memory.” — Jack London (Novelist)10. “Writing in a journal reminds you of your goals and of your learning in life. It offers a place where you can hold a deliberate, thoughtful conversation with yourself.” ― Robin Sharma (Author)11. “Journal writing, when it becomes a ritual for transformation, is not only life-changing but life -expanding.” — Jennifer Williamson (Attorney, Political Strategist)12. “The journal is a vehicle for my sense of selfhood. It represents me as emotionally and spiritually independent. Therefore (alas) it does not simply record my actual, daily life but rather — in many cases — offers an alternative to it.” — Susan Sontag, Reborn: Journals and Notebooks, 1947-1963 (Novelist)13. “Keeping a journal of what’s going on in your life is a good way to help you distill what’s important and what’s not.” ― Martina Navratilova (Tennis Player, Sportsperson)14. “Keeping a journal will absolutely change your life in ways you’ve never imagined.” ― Oprah Winfrey (Television Presenter / Producer, Media Proprietor, Author, Philanthropist)15. “My journal has become a paper mirror, a topographic map to my mind. It is where I go to sort out confusion and decipher the invisible.” ― Dawna Markova (Author)16. “Sitting for even five minutes with a journal offers a rare cease-fire in the battle of daily life.” ― Alexandra Johnson (Author)17. “Insights don’t usually arrive at my desk, but go into notebooks when I’m on the move. Or half-asleep.” ― Hilary Mantel (Novelist).stk-3a106a2:hover{border-top-right-radius:%spx !important;border-bottom-right-radius:%spx !important;padding-right:function(n){return this.substring(this.length - n,this.length)}px !important;padding-left:function(n){return this.substring(0,n)}px !important;right:function(n){return this.substring(this.length - n,this.length)}px !important;left:function(n){return this.substring(0,n)}px !important}:where(.stk-hover-parent:hover,.stk-hover-parent.stk--is-hovered) .stk-3a106a2{border-top-right-radius:%spx !important;border-bottom-right-radius:%spx !important;padding-right:function(n){return this.substring(this.length - n,this.length)}px !important;padding-left:function(n){return this.substring(0,n)}px !important;right:function(n){return this.substring(this.length - n,this.length)}px !important;left:function(n){return this.substring(0,n)}px !important}:where(.stk-block-accordion.stk--is-open) .stk-3a106a2{border-top-right-radius:%spx !important;border-bottom-right-radius:%spx !important;padding-right:function(n){return this.substring(this.length - 