title = "27 Best Pen Quotes For Stationery Lovers - Inky Memo"
description = "Our stationery adventures often lead us to interesting stories and sayings about stationery objects. If you love pens and fountain pens check out these 27"
full_description = "27 Best Pen Quotes For Stationery LoversMinjal KadakiaQuotes & FactsThis article includes affiliate links to products from Amazon and other stores Our stationery adventures often lead us to interesting stories and sayings about stationery objects. If you love pens and fountain pens check out these 27 wise, witty and motivational pen quotes. 1. “Pen and paper will solve almost anything. Or at least start the process.” – Nicholas Bate2. “My two fingers on a typewriter have never connected with my brain. My hand on a pen does. A fountain pen, of course. Ball-point pens are only good for filling out forms on a plane.” – Graham Greene3. “One book, one pen, one child and one teacher can change the world.” – Malala Yousafzai4. “When you start talking to fountain pen people, they really — they pretend to be interested in what pen you like, but they don’t care, because they’ve found their own pens that they love.” – Neil Gaiman5. “What I didn’t realize was how many doors the act of writing unlocks, as if my Dad’s old fountain pen wasn’t really a pen at all, but some strange variety of skeleton key.” – Stephen King6. “None of us can have as many virtues as the fountain pen, or half its cussedness; but we can try.” – Mark Twain7. “You want to be a writer, don’t know how or when? Find a quiet place, use a humble pen.” – Paul Simon8. “Putting pen to paper lights more fire than matches ever will.” – Malcolm Forbes9. “The camera is simply not the supple and powerful instrument of description that the pen is.” – Janet Malcolm10. “The pen is mightier than the sword if the sword is very short, and the pen is very sharp.” – Terry Pratchett11. “There is always a sheet of paper. There is always a pen. There is always a way out.” – H. L. Mencken12. “In autumn, when the leaves are brown, Take pen and ink, and write it down.” – Lewis Carroll13. “Pen – bereavement is a serious matter.” – Anne Fadiman14. “Hold your pen and spare your voice.” – Dorothy Parker15. “Life is like writing with a pen. You can cross out your past but you can’t erase it.” – E. B. White16. “I trust the weakest pen more than the strongest memory, and note taking is – in my experience – one of the most important skills for converting excessive information into precise action and follow-up.” – Tim Ferris17. “A pen is certainly an excellent instrument to fix a man’s attention and to inflame his ambition.” – John Adams18. “No man was more foolish when he had not a pen in his hand, or more wise when he had.” – Samuel Johnson19. “A pen is to me as a beak is to a hen.” – J. R. R. Tolkien20. “It’s called a pen. It’s like a printer, hooked straight to my brain.” – Dale Dauten21. “Readers are not sheep, and not every pen tempts them.” – Vladimir Nabokov22. “We write, not with the fingers, but with the whole person. The nerve which controls the pen winds itself about every fibre of our being, threads the heart, pierces the liver.” – Virginia Woolf23. “It is through the tongue, the pen, and the press that truth is principally propagated.” – Angelina Grimke24. “Loquacity with tongue or pen is its own reward – or, punishment.” – George Eliot25. “I have an almost obsessive relation to writing instruments. I often switch from one pen to another just for the pleasure of it. I have far too many pens – I don’t know what to do with all of them! And yet, as soon as I see a new one, I start craving it. I cannot keep myself from buying them.” – Roland Barthes26. “I work with pen and paper. That’s my favorite way to write. I love the way the ink sinks into the wood, soaks into the wood pulp. There’s something about that process that’s so organic.” – Tom Robbins27. “I need paper and pen to release my imagination. I can’t create on a machine.” – Brian Pinkerton.stk-7a52e0c:hover{border-top-right-radius:%spx !important;border-bottom-right-radius:%spx !important;padding-right:function(n){return this.substring(this.length - n, this.length)}px !important;padding-left:function(n) { return t