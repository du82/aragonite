full_description = "He who dove too deep into git checkout and git reset, Part 1 Red Huq 2020-06-20 09:00 Comments div.prompt { display: none; } div.rendered_html table, .rendered_html th, .rendered_html tr, .rendered_html td { font-size: 16px; border: 1px solid black; } I love git. I think it's a brilliant masterpiece of design and programming by Linus Torvalds. To me it's more than just a tool—it's art. Ok I'm a little weird but we know that today git is the de facto tool for version control and an unequivocal cornerstone of successful software development. In this blog post series, I'm going to dive really deep into the inner workings of the commands git checkout and git reset, break them down logically, and expose the method to the madness. You might already be familiar with a few aspects of these commands, but both of them conceal surprisingly powerful and useful functionality. Some of it might be new territory but I hope a lot of it will absolutely blow your mind. Either way, let's started with git checkout. Read more… Think twice before dropping that first one-hot encoded column Red Huq 2019-05-06 19:30 Comments div.prompt { display: none; } div.rendered_html table, .rendered_html th, .rendered_html tr, .rendered_html td { font-size: 16px; border: 1px solid black; } Many machine learning models demand that categorical features are converted to a format they can comprehend via a widely used feature engineering technique called one-hot encoding. Machines aren't that smart. A common convention after one-hot encoding is to remove one of the one-hot encoded columns from each categorical feature. For example, the feature sex containing values of male and female are transformed into the columns sex_male and sex_female, each containing binary values. Because using either of these columns provides sufficient information to determine a person's sex, we can drop one of them. In this post, we dive deep into the circumstances where this convention is relevant, necessary, or even prudent. Read more…"
