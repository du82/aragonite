After watching the film Arrival"""
full_description = '''Using natural language processing to build a spam filter for text messages Red Huq 2017-05-30 08:00 Comments div.prompt { display: none; } div.rendered_html table, .rendered_html th, .rendered_html tr, .rendered_html td { font-size: 16px; border: 1px solid black; } After watching the film Arrival, I developed a deep appreciation for the field of linguistics (also my favorite movie of 2016). Human language is the most unstructured type of data, and yet we effortlessly parse and interpret it, and even generate our own. On the other hand, understanding everyday language is a significant challenge for machines; this is the focus of natural language processing (NLP)—the crossroads between linguistics and AI. In this post, we'll make use of some NLP concepts and combine them with machine learning to build a spam filter for SMS text messages. In the 1950s, Alan Turing conjectured if a machine can fool a human into believing that he/she is speaking with another human, the machine exhibits intelligence—the iconic Turing test. Recently, a machine arguably passed the Turing test for the first time; the milestone was largely attributed to advances in NLP. If you've ever wondered how Siri or Google recognizes your voice, makes sense of a semantically nebulous question, such as "How did the Celtics do?", and returns an accurate response, that's also NLP in action! The war on spam is another. Before Gmail implemented its incredible spam filter, I remember crafting an elaborate set of if/then rules for words typically found in spam. Not surprisingly, it was tedious and prone to mistakes. Nowadays, no one hand codes a spam filter—we train machines to do the job! But email spam is different from SMS message spam; we tend to speak more casually on our phones, using more slang, incomplete sentences, or even concocting words and phrases. Let's see what machine learning can do for SMS message spam. Table of contents¶ Inspecting the dataset Text preprocessing Feature engineering Training and evaluating a model What terms are the top predictors of spam? How to improve the model 1. Inspecting the dataset¶ While browsing the UCI Machine Learning repository, I discovered a dataset chock-full of anonymous SMS text messages. Let's begin by loading it and taking a look around. In [2]: df = pd.read_table('data/SMSSpamCollection.txt', header=None) df.head() Out[2]: 0 1 0 ham Go until jurong point, crazy.. Available only ... 1 ham Ok lar... Joking wif u oni... 2 spam Free entry in 2 a wkly comp to win FA Cup fina... 3 ham U dun say so early hor... U c already then say... 4 ham Nah I don't think he goes to usf, he lives aro... In [3]: df.info() <class 'pandas.core.frame.DataFrame'> RangeIndex: 5572 entries, 0 to 5571 Data columns (total 2 columns): 0 5572 non-null object 1 5572 non-null object dtypes: object(2) memory usage: 87.1+ KB We have a collection of text data known as a corpus. Specifically, there are 5,572 SMS messages written in English, serving as training examples. The first column is the target variable containing the class labels, which tells us if the message is spam or ham (aka not spam). The second column is the SMS message itself, stored as a string. Since the target variable contains discrete values, this is a classification task. Let's start by placing the target variable in its own table and checking out how the two classes are distributed. In [4]: y = df[0] y.value_counts() Out[4]: ham 4825 spam 747 Name: 0, dtype: int64 It looks like there are far fewer training examples for spam than ham—we'll take this imbalance into account in the analysis. In addition, we need to encode the class labels in the target variable as numbers to ensure compatibility with some models in Scikit-learn. Because we have binary classes, let's use LabelEncoder and set 'spam' = 1 and 'ham' = 0. In [5]: le = LabelEncoder() y_enc = le.fit_transform(y) Next, let's place the SMS message data into its own table. In [6]: raw_text = df[1] We're sitting on a mountain of text data but it might as well be gibberish since a machine only understands numbers. How can we convert this corpus into useful numerical features so we can train a classifier? This is where NLP comes in. 2. Text preprocessing¶ There are many feature engineering strategies for transforming text data into features. Some involve assigning each unique word-like term to a feature and counting the number of occurrences per training example. However, if we were to perform this strategy right now, we'd end up with an absurd number of features, a result of the myriad possible terms. The classifier would take too long to train and likely overfit. As a result, each NLP problem requires a tailored approach to determine which terms are relevant and meaningful. For the remainder of this section, I'll walk through my preprocessing strategy, which relies heavily on regular expressions. Normalization¶ Let's begin by taking a step back and examining the terms of a hypothetical SMS message. In [7]: example = """ ***** CONGRATlations **** You won 2 tIckETs to Hamilton in NYC http://www.hamiltonbroadway.com/J?NaIOl/event wORtH over $500.00...CALL 555-477-8914 or send message to: hamilton@freetix.com to get ticket !! ! """ I'd definitely deem this as spam. But clearly there's a lot going on here: phone numbers, emails, website URLs, money amounts, and gratuitous whitespace and punctuation. Some terms are randomly capitalized, others are in all-caps. Since these terms might show up in any one of the training examples in countless forms, we need a way to ensure each training example is on equal footing via a preprocessing step called normalization. Instead of removing the following terms, for each training example, let's replace them with a specific string. Replace email addresses with 'emailaddr' Replace URLs with 'httpaddr' Replace money symbols with 'moneysymb' Replace phone numbers with 'phonenumbr' Replace numbers with 'numbr' In [8]: processed = raw_text.str.replace(r'\b[\w\-.]+?@\w+?\.\w{2,4}\b', 'emailaddr') processed = processed.str.replace(r'(http[s]?\S+)|(\w+\.[A-Za-z]{2,4}\S*)', 'httpaddr') processed = processed.str.replace(r'£|\$', 'moneysymb') processed = processed.str.replace( r'\b(\+\d{1,2}\s)?\d?[\-(.]?\d{3}\)?[\s.-]?\d{3}[\s.-]?\d{4}\b', 'phonenumbr') processed = processed.str.replace(r'\d+(\.\d+)?', 'numbr') Next, we'll remove all punctuation since "today" and "today?" refer to the same word. In addition, let's collapse all whitespace (spaces, line breaks, tabs) into a single space. Furthermore, we'll eliminate any leading or trailing whitespace. In [9]: processed = processed.str.replace(r'[^\w\d\s]', ' ') processed = processed.str.replace(r'\s+', ' ') processed = processed.str.replace(r'^\s+|\s+?$', '') We'll also need to treat the words "there", "There" and "ThERe" as the same word. Therefore, let's lowercase the entire corpus. In [10]: processed = processed.str.lower() Removing stop words¶ Some words in the English language, while necessary, don't contribute much to the meaning of a phrase. These words, such as "when", "had", "those" or "before", are called stop words and should be filtered out. The Natural Language Toolkit (NLTK), a popular Python library for NLP, provides common stop words. In [11]: stop_words = nltk.corpus.stopwords.words('english') This list of stop words is literally stored in a Python list. If instead we convert it to a Python set, iterating over the stop words will go much faster, and shave time off this preprocessing step. In [12]: processed = processed.apply(lambda x: ' '.join( term for term in x.split() if term not in set(stop_words)) ) Stemming¶ It's likely the corpus contains words with various suffixes such as "distribute", "distributing", "distributor" or "distribution". We can replace these four words with just "distribut" via a preprocessing step called stemming. There are numerous stemming strategies, some more aggressive than others. Instead of painstakingly building a stemmer from scratch, let's use one from NLTK called the Porter stemmer. In [13]: porter = nltk.PorterStemmer() processed = processed.apply(lambda x: ' '.join( porter.stem(term) for term in x.split()) ) Because we have so many preprocessing steps, let's combine them all into a handy function that takes in a string and cleans it up. In [14]: def preprocess_text(messy_string): assert(type(messy_string) == str) cleaned = re.sub(r'\b[\w\-.]+?@\w+?\.\w{2,4}\b', 'emailaddr', messy_string) cleaned = re.sub(r'(http[s]?\S+)|(\w+\.[A-Za-z]{2,4}\S*)', 'httpaddr', cleaned) cleaned = re.sub(r'£|\$', 'moneysymb', cleaned) cleaned = re.sub( r'\b(\+\d{1,2}\s)?\d?[\-(.]?\d{3}\)?[\s.-]?\d{3}[\s.-]?\d{4}\b', 'phonenumbr', cleaned) cleaned = re.sub(r'\d+(\.\d+)?', 'numbr', cleaned) cleaned = re.sub(r'[^\w\d\s]', ' ', cleaned) cleaned = re.sub(r'\s+', ' ', cleaned) cleaned = re.sub(r'^\s+|\s+?$', '', cleaned.lower()) return ' '.join( porter.stem(term) for term in cleaned.split() if term not in set(stop_words) ) As a sanity check, let's confirm this function yields the same results as the previous series of steps. In [15]: (processed == raw_text.apply(preprocess_text)).all() Out[15]: True Additionally, let's test preprocess_text() on the hypothethical SMS message from earlier. In [16]: preprocess_text(example) Out[16]: 'congratl numbr ticket hamilton nyc httpaddr worth moneysymbnumbr call phonenumbr send messag emailaddr get ticket' What a change! It looks like the preprocessing strategy is working. A quick technical note before we move on: since this was the first time I encountered regular expressions, I learned the hard way that mindful usage of the lazy quantifier ? is crucial—incorporating it reduced the total preprocessing time from 1 hour to 2 seconds! 3. Feature engineering¶ Now that we've enriched the corpus for meaningful terms, we're ready to construct features. Let's begin by breaking apart the corpus into a vocabulary of unique terms—a process called tokenization. However, there are several ways to approach this step. Tokenization¶ We can tokenize individual terms and generate what's called a bag of words model. You may notice this model has a glaring pitfall: it fails to capture the innate structure of human language. Under this model, the following sentences have the same feature vector although they convey dramatically different meanings. Does steak taste delicious? Steak does taste delicious. Alternatively, we can tokenize every sequence of $n$ terms called $n$-grams. For example, tokenizing adjacent pairs of words yields bigrams. The $n$-gram model preserves word order and can potentially capture more information than the bag of words model. To get the best of both worlds, let's tokenize unigrams and bigrams. As an example, unigrams and bigrams for "The quick brown fox" are "The", "quick", "brown", "fox", "The quick", "quick brown" and "brown fox". Implementing the tf-idf statistic¶ Having selected a tokenization strategy, the next step is assign each $n$-gram to a feature and then compute the $n$-gram's frequency using some statistic. Again, we have options. One statistic called term frequency (tf) tallies the occurrences of each $n$-gram for every training example. However, some $n$-grams will undoubtedly show up often in any given SMS message, while others rarely appear in the overall corpus but show up frequently in certain subsets of messages such as spam. Therefore, to emphasize the latter, more interesting set of $n$-grams, we'll downweight the term frequency with inverse document frequency (idf), which is calculated by logarithmically scaling the inverse of the fraction of training examples that contain a given term. Combining these two statistics yields the tf-idf statistic: $$\textrm{tf-idf}(t, i) = \textrm{tf}(t, i) \times \textrm{idf}(t) \\ = \textrm{tf}(t, i) \times \log\bigg(\frac{M}{m_t}\bigg)$$where $\textrm{tf}(t,i)$ is the term frequency for term $t$ in the $i$th training example, $M$ is the total number of training examples, and $m_t$ is the number of training examples that contain the term $t$. Scikit-learn has an off-the-shelf tool called TfidfVectorizer that performs $n$-gram tokenization and also computes the tf-idf statistic. Two technical details regarding TfidfVectorizer: a) the tf-idf statistic is computed slightly differently to avoid division by zero, and b) the computed tf-idf values for each training example are subsequently normalized. Finally, we're equipped to transform a corpus of text data into a matrix of numbers with one row per training example and one column per $n$-gram. In [17]: vectorizer = TfidfVectorizer(ngram_range=(1, 2)) X_ngrams = vectorizer.fit_transform(processed) Let's take a look at the dimensions of the X_ngrams matrix. In [18]: X_ngrams.shape Out[18]: (5572, 36348) Holy cow, that's one massive matrix! It looks like the tokenization process extracted 36,348 unigrams and bigrams from the corpus; each one defines a feature. Since each training example only makes use of a tiny fraction of the complete $n$-gram vocabulary, X_ngrams mostly consists of zeros and is called a sparse matrix. To perform linear algebra computations rapidly on such a large sparse matrix, it'd be more efficient to store only the non-zero values while maintaining the structure. Fortunately, TfidfVectorizer utilizes the SciPy library to do exactly this! 4. Training and evaluating a model¶ That was a lot of prep work and we haven't even done any machine learning yet, but all of it crucial for building a robust classifier. Not only is a model only as good as the data it's trained on, but meticulous feature engineering can beat having a fancy model. We'll be a training a state of the art classifier called support vector machines (SVM). In a nutshell, this model attempts to find the hyperplane that best separates the two classes. In particular, I've elected to use SVM with a linear kernel because text data contains a large number of features (we have over 30,000!); using a nonlinear kernel would be computationally expensive. In addition, text data is typically linearly separable to begin with. Finally, we'll use svm.LinearSVC() instead of svm.SVC(kernel='linear') because the former relies on a library whose algorithmic complexity is $O(n)$ instead of $O(n^2)$ or $O(n^3)$, meaning much faster. Preliminary analysis¶ For a rudimentary understanding of how well SVM performs on the dataset, let's start with the hold-out method: an 80/20 training and test set split. Remember to never evaluate a model on the data used to train it! In addition, since the classes are imbalanced, we'll incorporate stratification and use the $F_1$ score as the performance metric. In [19]: X_train, X_test, y_train, y_test = train_test_split( X_ngrams, y_enc, test_size=0.2, random_state=42, stratify=y_enc ) clf = svm.LinearSVC(loss='hinge') clf.fit(X_train, y_train) y_pred = clf.predict(X_test) metrics.f1_score(y_test, y_pred) Out[19]: 0.9285714285714286 Not a bad start, but we really need to run cross-vali'''
author = "Red Huq"
year_published = 2017
