every alumnus I've chatted with. In fact, Insight Data Science recruits PhDs from practically every discipline—I'm looking forward to being surrounded by a diverse group of like-minded peers! Insight Data Science is held in New York City, among a few other places, and helps you find a local position, which is perfect because my wife and I recently moved here—a lifelong aspiration. There's certainly a pleasant je ne sais quoi about living here opposed to just visiting, particularly Brooklyn. The city's incomparable energy (not to mention a 3 minute walk to the view below) has really helped me stay the course! Being the nerve center for data science and AI on the east coast doesn't hurt either. I'm thrilled to be nearing the home stretch. I'd love to share the journey in detail but I'll save that for a future blog post. data science insight Previous post Next post Comments var disqus_shortname ="machinemade", disqus_url="https://inmachineswetrust.com/posts/update-august2017/", disqus_title="The next stage in my data science training", disqus_identifier="cache/posts/post10.html", disqus_config = function () { this.language = "en"; }; (function() { var dsq = document.createElement('script'); dsq.async = true; dsq.src = 'https://' + disqus_shortname + '.disqus.com/embed.js'; (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq); })(); Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a> Comments powered by Disqus MathJax.Hub.Config({ tex2jax: { inlineMath: [ ['$','$'], ["\\(","\\)"] ], displayMath: [ ['$$','$$'], ["\\[","\\]"] ], processEscapes: true }, displayAlign: 'center', // Change this to 'center' to center equations. "HTML-CSS": { styles: {'.MathJax_Display': {"margin": 0}} } });'''
