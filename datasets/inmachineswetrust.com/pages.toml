full_description = "About Who am I? Hi, I'm Red. I'm a machine learning engineer. And I love to build stuff. Ever since I was a kid, I've adored programming, math, and tech. After spending over a decade as a life scientist, I decided to switch to a career that centers around my longtime passions—a data scientist—while still enabling me to leverage the analytical skills I've honed over the years. I soon found my niche in the ever-evolving data world: developing products and pipelines that use machine learning. This blog originally served to chronicle my journey during the career transition, but I now use it to share fascinating stuff I've learned in machine learning engineering and software development with a few other curiosities throw in. What have I done? I currently work at Nielsen where I build data science tools, pipelines, and software. I received a PhD in molecular physiology and biophysics from Baylor College of Medicine where I used carbon nanotechnology to develop a new treatment for autoimmune diseases. During grad school, I also founded and led a 501(c)(3) nonprofit organization that trains scientists and doctors to become management consultants, and also provides consulting services. Previously, I worked in biotech and venture capital. How to get in touch Feel free to connect with me on LinkedIn, GitHub, and Twitter. If you have any questions or comments, don't hesitate to contact me. Thanks for visiting! All views on this blog are my own."
