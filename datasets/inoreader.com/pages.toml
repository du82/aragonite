["https://inoreader.com/about-us"]
title = "About us | Inoreader"
description = "Get to know Inoreader's mission, team, and history. Join millions of users who choose Inoreader for personalized news and content discovery."
full_description = "Founded in 2013, our company’s ultimate goal has always been giving users back control over their newsfeeds and the content they consume online. Created to solve a common problem, Inoreader removes the need to sift through multiple sources of information to find the stories that matter to you and stay up-to-date with the latest news. Having started as an RSS aggregator, Inoreader has since evolved into an advanced content reader hosted on a feature-rich platform, combining the power of RSS, social media, and content curation to offer a seamless, personalized experience. Whether you’re a casual reader, a media professional, a content marketer, or a researcher, Inoreader has the tools you need to stay ahead of the curve. With Inoreader, you can create custom feeds that include the latest stories from your favorite websites, blogs, newsletters, and social media accounts. You can filter your feeds to show only the content that interests you and save articles to read later or share with others. The best part? You get all the information you need in one place the minute it’s posted online. No algorithms to decide what you see and when, just the way you prefer. In addition to our core features, we offer a range of advanced tools and integrations, including team collaboration, monitoring feeds, custom alerts and automations. Our goal is to provide a comprehensive solution for content management and consumption, and we’re constantly improving our features based on user feedback. At Inoreader, we’re passionate about helping people stay informed while avoiding news fatigue in the digital age. Whether you’re a casual user or a professional striving to streamline your work processes, we’re here to help. Join Inoreader today and discover a better way to consume and manage your content online! With Inoreader, content comes to you. Sign up to browse more than 5 000 000 sources and build the ultimate newsfeed!"
year_published = 2025
