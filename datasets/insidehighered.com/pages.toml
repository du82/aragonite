["https://insidehighered.com/membership"]
title = "Membership | Inside Higher Ed"
description = "section.wp-block-ihe-card { border: 1px solid #EFEFEF; } section.wp-block-ihe-card:hover { background-color: initial; } .wp-block-ihe-card .wp-block-image img { aspect-ratio: initial; margin-top: 1em; } Insider Membership Program Helping college and university presidents - and those invested in their success - do their increasingly diffi"
full_description = '''Insider Dashboard About Membership The Sandbox Webcasts Reports More About Membership The Sandbox Webcasts Reports section.wp-block-ihe-card { border: 1px solid #EFEFEF; } section.wp-block-ihe-card:hover { background-color: initial; } .wp-block-ihe-card .wp-block-image img { aspect-ratio: initial; margin-top: 1em; } Insider Membership Program Helping college and university presidents - and those invested in their success - do their increasingly difficult jobs. Ways to Join Individual$119 Teams & GroupsSave up to 15% Annual Insider Membership - $119 Billed annually, single invoice, cancel at any time. Join Now Annual Insider Membership 5-10 Users: Save 10%11-25 Users: Save 15% Billed annually, single invoice, cancel at any time. Larger groups are also welcome! First Name Last Name Your Email Phone Number Phone Organization Your Title # of users Group size5-1011-2525+ Leave this field blank The Insider membership program provides a curated set of benefits to help transform the important discussions happening at the helm of private, public, two- and four-year institutions from being reactive and prescriptive to authentic and forward-thinking. Together, we are creating a place for current and emerging leaders to create, share ideas, learn, play, connect and refuel. NEW BENEFIT | Limited Series We're excited to introduce a new member benefit: a weekly summary of federal policy news. Published Friday afternoons, for the next seven weeks, each edition will deliver a roundup of key federal developments impacting colleges and universities, along with an exclusive editor’s note providing insights into the trends, implications and behind-the-scenes context that matter most. About Insider Benefits The Sandbox A weekly newsletter where presidents write anonymously about their jobs/lives. See Issues Events & Webcasts Lively discussions with thought leaders, virtual and in-person. See Calendar Data & Analysis Download special reports, surveys and more. See Reports Discounts Get the best deals on select offerings, including in-person, national and global events hosted by IHE and THE. Join Today A Note from Inside Higher Ed Editor in Chief Sara Custer From the beginning, Inside Higher Ed has strived to make high-impact news, insightful analysis and commentary, and career services available to every professional at the diverse set of institutions that make up the rich web of higher education. The core content remains free of charge, but we've added an array of content and services for those committed readers who become members of our Insider program. This support enables us to expand what and how we cover and serve colleges, their employees and their students. If reading Inside Higher Ed is an integral part of your day, please show your support by joining our Insider membership program. For less than $10 a month, take this next step – become a member today. Become a Member Frequently Asked Questions Do I have to pay to continue to receive the Daily News Update or read Inside Higher Ed articles? Not at all. Our membership program does not affect anyone’s access to Inside Higher Ed’s daily news or opinion pieces, including our Daily News Update email. Membership is intended to enhance your Inside Higher Ed experience by adding more resources and professional development opportunities. Do you have institutional memberships? We are currently focused on providing the best possible experience for individual members, but we do offer group and team memberships that provide the same great benefits our individual members receive but at a discounted rate. Does joining increase my chances at getting a story or story idea published on Inside Higher Ed? Membership is intended to be a professional development resource and does not give members priority to pitch ideas or stories to Inside Higher Ed editorial staff. If you’re interested in sharing news with us or writing for us, contact us here. How do I reset my password? Click the "Login" button/text and at the bottom of the login screen, you will see a link to reset your password. If you need additional assistance or do not have access to the email address that you used when creating your account, please contact us. ​How do I use my discounts on Inside Higher Ed reports and events? You must be logged into your account to utilize the discounts. Discounts are either automatically applied, and you will see the discount reflected in your total, or you will be given a special promo code to add during the checkout process. Discounts are not transferable and may only be used by the member. ​I created an account, why am I seeing a message telling me to join? This can happen if you created a username and password in the system but did not successfully complete payment for your membership or you are logged out of the system. You can use the username and password you created earlier to login. On your user dashboard, you will see a message to join. If you need assistance, please contact us. How do I get a receipt for my purchase? Please email us with this request. Be sure to include the first name, last name and email address of the member, especially if you are requesting an invoice that is for a supervisor or colleague. Can I pay with a purchase order? If you do not have the ability to pay with a credit card, please contact us and we will assist you. When will I be billed again? Your membership renews annually, so you will be billed on the same date you signed up in the following year. Renewal is automatic, and we will send you a reminder prior to your renewal date. How do I cancel my membership? Please email us, and we will be happy to assist you. Do you offer refunds? No. If you cancel your membership, you will still have access to all of your member resources and benefits for the remainder of your membership period, but your membership will not renew on the renewal date.'''
