full_description = "About Us Inside Higher Ed provides the latest news, analysis and solutions for the entire higher education community. Inside Higher Ed is owned by Times Higher Education (THE), the world’s most authoritative source of data, analysis and information on higher education, with five decades’ experience dedicated to the field. Our mission is to provide forward-looking insights and services to the entire higher education community, empowering individuals and organizations to excel and transform learners’ lives.​​ We are proud to have earned the trust and loyalty of more than 2 million monthly readers by speaking as a fiercely independent voice, providing thoughtful, substantive analysis on the pressing issues facing higher education today. In addition to our news and services, we offer the best editorial and marketing solutions for organizations and employers. We tailor them to your goals, helping you reach your target audience with the right message at the right time. In late 2023, Inside Higher Ed named Sara Custer as editor-in-chief. Read more here. Work With Us View our job openings. Explore Meet The Team The people behind IHE. Explore Our History Learn about our founding. Explore Ownership Statement Read more about our owners. Explore"
