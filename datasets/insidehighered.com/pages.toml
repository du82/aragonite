full_description = "Student Voice is a news hub spotlighting the student perspective on higher education.In 2024, this collaboration is presented by Inside Higher Ed and The Generation Lab.Click below to learn more about our survey data and methodology.Learn More Student Voice 2025 Student Voice, our ongoing survey project with Generation Lab, is designed to gauge students’ views on key issues and their suggestions as to how colleges and universities can best help them succeed. Our annual Student Voice survey of 5,000-plus two- and four-year students covers academic success issues, health and wellness, campus life, and how students are preparing for life after college. The main survey is supplemented by additional student flash polls on timely topics to help institutions plan for student success in 2025 and beyond. Student Success The College Experience Trust Matters Student Voice survey data indicates that students trust professors most and the president and other senior leaders least. What makes students trust certain campus groups more than others and how can trust be built? Student Success The College Experience A Need for Digital Resources on Media Literacy for College Students College students say digital resources would help them improve their media literacy skills, but few examples are available for this group. Student Success The College Experience Students on Media Literacy and How Colleges Can Help, in 6 Charts Few students rely on traditional news media for key information, but many do approach media sources with a critical eye, according to our new Student Voice flash survey. How can colleges help boost students’ media literacy? Student Success The College Experience Survey: College Students Don’t Want Statements After Political Events A December survey by Inside Higher Ed and Generation Lab found half of students don’t think colleges should make statements about political events. Two experts weigh in on when an institution should or should not do so. Student Success The College Experience Creating Space for Disagreement on Campus Forty-three percent of Student Voice survey respondents think a designated area on campus for civil dialogue would help with free expression. Created January 15, 2025"
