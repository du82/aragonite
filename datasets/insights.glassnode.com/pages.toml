full_description = "Product Featured BTC active addresses accelerate - what about TON, BNB, and SOL? Glassnode now supports SOL, BNB and TON metrics, enabling ecosystem analysis across chains. Read below to see how you can perform a simple yet effective comparative analysis of key fundamental data with Bitcoin's $100K milestone as a backrop. Glassnode Nov 25, 2024 • 3 min read Since Friday, Bitcoin has unsuccessfully tried to breach the $100K mark. This leads to a question: has a top been reached for now, or is there more momentum ahead? While no one can predict market moves with certainty, on-chain data provides a powerful lens into network health and sentiment.One such signal has just flashed green for Bitcoin: Momentum in New Addresses has crossed above the yearly average, signaling expanding network activity.Live chart available hereWhat does this mean?Growing participation: A positive crossover indicates more unique participants are joining the network, a foundational signal of healthy demand.Bullish network sentiment: Historically, similar crossovers have preceded significant market rallies, hinting at underlying strength.Market validation: Even amid volatile price action, this signal points to a potential shift in sentiment, often a precursor to structural growth phases.While momentum continues to build for Bitcoin, it’s also possible that we’ve reached a local top, which could lead to a temporary capital rotation into major altcoins. So, which altcoins might be primed for a rally?Expanding Glassnode Coverage: BNB and TON Metrics Are Now LiveWe’re excited to announce the addition of BNB and TON metrics to Glassnode Studio, expanding our coverage of this cycle’s standout altcoins. These integrations build on our recent expansion efforts, which included support for Solana (SOL) and TRON metrics.With these new additions, you can now track ecosystem momentum across multiple chains using trusted Glassnode metrics, including:FeesActive accountsTransaction volume and ratesDerivatives dataWith these tools, we can analyze how on-chain activity for altcoins like SOL, BNB, and TON compares to Bitcoin - and to one another.To start leveraging the new metrics, dashboards, alerts and more, visit Glassnode Studio.BNB, TON, and SOL Network Activity at a GlanceBNB Chain: Steady but CautiousView BNB Active AddresseschartBNB’s active addresses currently stand at 541,760, with its 7-day SMA (546,916) closely aligned with the 30-day SMA (540,533). This flat trend indicates stable but cautious user behavior, reflecting a network that remains robust yet awaits a clear catalyst for further expansion.TON (Toncoin): Gaining MomentumView TON Active Addresses chartToncoin has been quietly building momentum, with active addresses at approximately 4.8M and the 7-day SMA showing modest outperformance over the 30-day SMA. This mild upward trend suggests growing interest in the network and reflects its potential for further adoption as its niche strengthens.Solana (SOL): A Year of Rapid GrowthView SOL Active AddresseschartSolana has seen an impressive surge in adoption this year, with active addresses reaching 19.98M. The 7-day SMA (22.65M) continues to outpace the 30-day SMA (18.40M), signaling strong and sustained momentum.Exclusive Offer: Unlock more BNB and TON MetricsSome of the critical metrics for BNB, TON, and SOL - such as Futures Volume, OI or Funding Rates - are available exclusively for Advanced plans and above. With our Black Friday deal - available until December 2nd - you get a chance to access this data at a discounted rate.To redeem this special, time-limited offer, click here.Expand your analysis. Form your view. Trade and invest with more confidence using Glassnode’s trusted metrics and tools. And stay tuned for more updates and insights from Glassnode coming soon!"
