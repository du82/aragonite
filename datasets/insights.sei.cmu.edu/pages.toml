["https://insights.sei.cmu.edu/library/toward-the-use-of-artificial-intelligence-ai-for-advanced-persistent-threat-detection"]
title = "Toward the Use of Artificial Intelligence (AI) for Advanced Persistent Threat Detection"
description = "This report examines the feasibility and usefulness of implementing AI and ML in cyber defense with a particular focus on advanced persistent threats (APTs)."
full_description = "Toward the Use of Artificial Intelligence (AI) for Advanced Persistent Threat Detection August 8, 2024 • Technical Report By Matthew Walsh, Clarence Worrell, and Tom Scanlon This report examines the feasibility and usefulness of implementing AI and ML in cyber defense with a particular focus on advanced persistent threats (APTs). Publisher Software Engineering Institute CMU/SEI Report Number CMU/SEI-2024-TR-001 DOI (Digital Object Identifier) 10.1184/R1/25282333 Topic or Tag Cybersecurity Engineering Abstract This report examines the feasibility and usefulness of implementing artificial intelligence (AI) and machine learning (ML) in cyber defense with a particular focus on advanced persistent threats (APTs). In this report, we examine the current state of AI-enabled APT defense. We begin by describing the stages that an APT must go through to succeed. Next, we perform a commercial market analysis of APT defenses. We then perform a bibliometric analysis to map out the academic research landscape on APTs. We highlight the strengths and limitations of research on the use of AI for APT defense. Finally, we offer practical recommendations that will help organizations start incorporating AI into their layered APT defense strategies. SHARE"
author = """
Matthew Walsh,                                           Clarence Worrell,                                  and Tom Scanlon"""
