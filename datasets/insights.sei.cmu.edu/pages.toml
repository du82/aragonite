full_description = "Melissa Kasan Ludwick specializes in legacy system modernization, data management, and technical project management. Melissa currently works in the Transforming Software Acquisition Policy & Practice group in the Software Solutions Division. Here she is responsible for building and participating on cross-functional teams to support the customer throughout the acquisition, evolution, and operation of software-reliant systems. Melissa has helped multiple government customers to plan for and modernize enterprise business systems. Prior to joining SSD Melissa worked as a Technical Analyst in the Emerging Technology Center and was responsible for researching and prototyping tools, techniques, and methodologies related to cyber intelligence. During that time Melissa co-developed and taught a graduate-level course on cyber intelligence at CMU’s Information Networking Institute. Preceding her time in the ETC Melissa worked as a Member of the Technical staff for the Acquisition Support Program. Melissa contributed to multiple customer engagements primarily supporting the Army, Air Force, and Civil agencies, as well as contributing to internal efforts focused on communications, web development, and eLearning course development. Carnegie Mellon University Software Engineering Institute 4500 Fifth Avenue Pittsburgh, PA 15213-2612 412-268-5800"
