["https://insights.sei.cmu.edu/blog/weaknesses-and-vulnerabilities-in-modern-ai-ai-risk-cyber-risk-and-planning-for-test-and-evaluation"]
title = "Weaknesses and Vulnerabilities in Modern AI: AI Risk, Cyber Risk, and Planning for Test and Evaluation"
description = "Modern AI systems pose consequential, poorly understood risks. This blog post explores strategies for framing test and evaluation practices based on a holistic approach to AI risk."
full_description = "Weaknesses and Vulnerabilities in Modern AI: AI Risk, Cyber Risk, and Planning for Test and Evaluation Bill Scherlis August 12, 2024 PUBLISHED IN Artificial Intelligence Engineering CITE https://doi.org/10.58012/9esz-9x30 Get Citation SHARE Modern artificial intelligence (AI) systems pose new kinds of risks, and many of these are both consequential and not well understood. Despite this, many AI-based systems are being accelerated into deployment. This is creating great urgency to develop effective test and evaluation (T&E) practices for AI-based systems.This blog post explores potential strategies for framing T&E practices on the basis of a holistic approach to AI risk. In developing such an approach, it is instructive to build on lessons learned in the decades of struggle to develop analogous practices for modeling and assessing cyber risk. Cyber risk assessments are imperfect and continue to evolve, but they provide significant benefit nonetheless. They are strongly advocated by the Cybersecurity and Infrastructure Security Agency (CISA), and the costs and benefits of various approaches are much discussed in the business media. About 70% of internal audits for large firms include cyber risk assessments, as do mandated stress tests for banks.Risk modeling and assessments for AI are less well understood from both technical and legal perspectives, but there is urgent demand from both enterprise adopters and vendor providers nonetheless. The industry-led Coalition for Secure AI launched in July 2024 to help advance industry norms around enhancing the security of modern AI implementations. The NIST AI Risk Management Framework (RMF) is leading to proposed practices. Methodologies based on the framework are still a work in progress, with uncertain costs and benefits, and so AI risk assessments are less often applied than cyber risk assessments.Risk modeling and assessment are important not only in guiding T&E, but also in informing engineering practices, as we are seeing with cybersecurity engineering and in the emerging practice of AI engineering. AI engineering, importantly, encompasses not just individual AI elements in systems but also the overall design of resilient AI-based systems, along with the workflows and human interactions that enable operational tasks.AI risk modeling, even in its current nascent stage, can have beneficial influence in both T&E and AI engineering practices, ranging from overall design choices to specific risk mitigation steps. AI-related weaknesses and vulnerabilities have unique characteristics (see examples in the prior blog posts), but they also overlap with cyber risks. AI system elements are software components, after all, so they often have vulnerabilities unrelated to their AI functionality. However, their unique and often opaque features, both within the models and in the surrounding software structures, can make them especially attractive to cyber adversaries.This is the third installment in a four-part series of blog posts focused on AI for critical systems where trustworthiness—based on checkable evidence—is essential for operational acceptance. The four parts are relatively independent of each other and address this challenge in stages:Part 1: What are appropriate concepts of security and safety for modern neural-network-based AI, including machine learning (ML) and generative AI, such as large language models (LLMs)? What are the AI-specific challenges in developing safe and secure systems? What are the limits to trustworthiness with modern AI, and why are these limits fundamental?Part 2: What are examples of the kinds of risks specific to modern AI, including risks associated with confidentiality, integrity, and governance (the CIG framework), with and without adversaries? What are the attack surfaces, and what kinds of mitigations are currently being developed and employed for these weaknesses and vulnerabilities?Part 3 (this part): How can we conceptualize T&E practices appropriate to modern AI? How, more generally, can frameworks for risk management (RMFs) be conceptualized for modern AI analogous to those for cyber risk? How can a practice of AI engineering address challenges in the near term, and how does it interact with software engineering and cybersecurity considerations?Part 4: What are the benefits of looking beyond the purely neural-network models of modern AI towards hybrid approaches? What are current examples that illustrate the potential benefits, and how, looking ahead, can these approaches advance us beyond the fundamental limits of modern AI? What are prospects in the near and longer terms for hybrid AI approaches that are verifiably trustworthy and that can support highly critical applications?Assessments for Functional and Quality AttributesFunctional and quality assessments help us gain confidence that systems will perform tasks correctly and reliably. Correctness and reliability are not absolute concepts, however. They must be framed in the context of intended purposes for a component or system, including operational limits that must be respected. Expressions of intent necessarily encompass both functionality—what the system is intended to accomplish—and system qualities—how the system is intended to operate, including security and reliability attributes. These expressions of intent, or systems specifications, may be scoped for both the system and its role in operations, including expectations regarding stressors such as adversary threats.Modern AI-based systems pose significant technical challenges in all these aspects, ranging from expressing specifications to acceptance evaluation and operational monitoring. What does it mean, for example, to specify intent for a trained ML neural network, beyond inventorying the training and testing data?We must consider, in other words, the behavior of a system or an associated workflow under both expected and unexpected inputs, where those inputs may be particularly problematic for the system. It is challenging, however, even to frame the question of how to specify behaviors for expected inputs that are not exactly matched in the training set. A human observer may have an intuitive notion of similarity of new inputs with training inputs, but there is no assurance that this aligns with the actual featuring—the salient parameter values—internal to a trained neural network.We must, additionally, consider assessments from a cybersecurity perspective. An informed and motivated attacker may deliberately manipulate operational inputs, training data, and other aspects of the system development process to create circumstances that impair correct operation of a system or its use within a workflow. In both cases, the absence of traditional specifications muddies the notion of “correct” behavior, further complicating the development of effective and affordable practices for AI T&E. This specification difficulty suggests another commonality with cyber risk: side channels, which are potential attack surfaces that are accidental to implementation and that may not be part of a specification.Three Dimensions of Cyber RiskThis alignment in the emerging requirements for AI-focused T&E with techniques for cybersecurity evaluation is evident when comparing NIST’s AI risk management playbook with the more mature NIST Cybersecurity Framework, which encompasses a huge diversity of methods. At the risk of oversimplification, we can usefully frame these methods in the context of three dimensions of cyber risk.Threat concerns the potential access and actions of adversaries against the system and its broader operational ecosystem.Consequence relates to the magnitude of impact on an organization or mission should an attack on a system be successful.Vulnerability relates to intrinsic design weaknesses and flaws in the implementation of a system.Both threat and consequence closely depend on the operational context of use of that system, though they can be largely extrinsic to the system itself. Vulnerability is characteristic of the system, including its architecture and implementation. The modeling of attack surface—apertures into a system that are exposed to adversary actions—encompasses threat and vulnerability, because access to vulnerabilities is a consequence of operational environment. It is a particularly useful element of cyber risk analysis.Cyber risk modeling is unlike traditional probabilistic actuarial risk modeling. This is primarily due to the generally nonstochastic nature of each of the three dimensions, especially when threats and missions are consequential. Threat, for example, is driven by the operational significance of the system and its workflow, as well as potential adversary intents and the state of their knowledge. Consequence, similarly, is determined by choices regarding the placement of a system in operational workflows. Adjustments to workflows—and human roles—is a mitigation strategy for the consequence dimension of risk. Risks can be elevated when there are hidden correlations. For cyber risk, these could include common elements with common vulnerabilities buried in supply chains. For AI risk, these could include common sources within large bodies of training data. These correlations are part of the reason why some attacks on LLMs are portable across models and providers.CISA, MITRE, OWASP, and others offer convenient inventories of cyber weaknesses and vulnerabilities. OWASP, CISA, and the Software Engineering Institute also provide inventories of safe practices. Many of the commonly used evaluation criteria derive, in a bottom-up manner, from these inventories. For weaknesses and vulnerabilities at a coding level, software development environments, automated tools, and continuous-integration/continuous-delivery (CI/CD) workflows often include analysis capabilities that can detect insecure coding as developers type it or compile it into executable components. Because of this fast feedback, these tools can enhance productivity. There are many examples of standalone tools, such as from Veracode, Sonatype, and Synopsys.Importantly, cyber risk is just one element in the overall evaluation of a system’s fitness for use, whether or not it is AI-based. For many integrated hardware-software systems, acceptance evaluation will also include, for example, traditional probabilistic reliability analyses that model (1) kinds of physical faults (intermittent, transient, permanent), (2) how those faults can trigger internal errors in a system, (3) how the errors may propagate into various kinds of system-level failures, and (4) what kinds of hazards or harms (to safety, security, effective operation) could result in operational workflows. This latter approach to reliability has a long history, going back to John von Neumann’s work in the 1950s on the synthesis of reliable mechanisms from unreliable components. Interestingly, von Neumann cites research in probabilistic logics that derive from models developed by McCulloch and Pitts, whose neural-net models from the 1940s are precursors of the neural-network designs central to modern AI.Applying These Ideas to Framing AI RiskFraming AI risk can be considered as an analog to framing cyber risk, despite major technical differences in all three aspects—threat, consequence, and vulnerability. When adversaries are in the picture, AI consequences can include misdirection, unfairness and bias, reasoning failures, and so on. AI threats can include tampering with training data, patch attacks on inputs, prompt and fine-tuning attacks, and so on. Vulnerabilities and weaknesses, such as those inventoried in the CIG categories (see Part 2), generally derive from the intrinsic limitations of the architecture and training of neural networks as statistically derived models. Even in the absence of adversaries, there are a variety of consequences that can arise due to the particular weaknesses intrinsic to neural-network models.From the perspective of traditional risk modeling, there is also the difficulty, as noted above, of unexpected correlations across models and platforms. For example, there can be similar consequences due to diversely sourced LLMs sharing foundation models or just having substantial overlap in training data. These unexpected correlations can thwart attempts to apply techniques such as diversity by design as a means to improve overall system reliability.We must also consider the specific attribute of system resilience. Resilience is the capacity of a system that has sustained an attack or a failure to nonetheless continue to operate safely, though perhaps in a degraded manner. This characteristic is sometimes called graceful degradation or the ability to operate through attacks and failures. In general, it is extremely challenging, and often infeasible, to add resilience to an existing system. This is because resilience is an emergent property consequential of system-level architectural decisions. The architectural goal is to reduce the potential for internal errors—triggered by internal faults, compromises, or inherent ML weaknesses—to cause system failures with costly consequences. Traditional fault-tolerant engineering is an example of design for resilience. Resilience is a consideration for both cyber risk and AI risk. In the case of AI engineering, resilience can be enhanced through system-level and workflow-level design decisions that, for example, limit exposure of vulnerable internal attack surfaces, such as ML inputs, to potential adversaries. Such designs can include imposing active checking on inputs and outputs to neural-network models constituent to a system.As noted in Part 2 of this blog series, an additional challenge to AI resilience is the difficulty (or perhaps inability) to unlearn training data. If it is discovered that a subset of training data has been used to insert a vulnerability or back door into the AI system, it becomes a challenge to remove that trained behavior from the AI system. In practice, this continues to remain difficult and could necessitate retraining without the malicious data. A related issue is the opposite phenomenon of unwanted unlearning—called catastrophic forgetting—which refers to new training data unintentionally impairing the quality of predictions based on previous training data.Industry Concerns and Responses Regarding AI RiskThere is a broad recognition among mission stakeholders and firms of the dimensionality and difficulty of framing and evaluating AI risk, despite rapid growth in AI-related business activities. Researchers at Stanford University produced a 500-page comprehensive business and technical analysis of AI-related activities that states that funding for generative AI alone reached $25.2 billion in 2023. This is juxtaposed against a seemingly endless inventory of new kinds of risks associated with ML and generative AI. Illustrative of this is a joint study by the MIT Sloan Management Review and the Boston"
