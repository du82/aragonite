full_description = "Linda Parker Gates is the principal investigator on the Software Engineering Institute’s (SEI's) Artificial Intelligence Robustness (AIR) research and transition project and leads the Software Acquisition Pathways Initiative in the SEI's Software Solutions Division. In both roles, she leverages her specialization in strategic planning, technology transition, change management, and performance excellence to support the development of effective strategies and the adopting of new technologies. Gates publishes her research in various formats and is active in the community through her contributions in several leadership roles. She is the author of the multi-part SEI blog series on Agile strategic planning as well as the SEI technical report Strategic Planning with Critical Success Factors and Future Scenarios: An Integrated Strategic Planning Framework, and she has also hosted numerous podcast and webinars on strategy and acquisition topics. Gates has served as an examiner and judge on multiple quality award programs, including as Senior Examiner for the Malcolm Baldrige National Quality Award. She is a member of the International Association for Strategy Professionals (IASP), where she chaired the IASP Global Conference in 2022, 2023, and 2024. Her work was recognized in 2024 when IASP awarded her the Janice Laureen Award for Outstanding Service. Gates holds a Bachelor of Arts degree from Denison University, where she served as an at-large member of the Alumni Council from 2021 to 2024, and she holds a Master of Architecture degree from Carnegie Mellon University. Carnegie Mellon University Software Engineering Institute 4500 Fifth Avenue Pittsburgh, PA 15213-2612 412-268-5800"
