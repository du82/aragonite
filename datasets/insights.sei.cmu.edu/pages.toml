title = "Carol Smith | Author Profile, CMU Software Engineering Institute"
description = "Author page for Carol J. Smith. Read articles written by this author and check out Carol's profile."
full_description = "Carol Smith is a senior research scientist in human-machine interaction in the SEI AI Division. In this role Smith contributes to research and development focused on improving user experiences (UX) and interactions with the nation’s AI systems, robotics, and other complex and emerging technologies. Smith’s research includes human-computer interaction (HCI), cognitive psychology, ethics, and human-machine teaming. Smith is also an adjunct instructor for Carnegie Mellon University’s Human-Computer Interaction Institute where she has taught both bachelor and master’s level courses. Smith has been conducting research to improve the human experience with complex systems across industries for over 20 years. Smith has been researching and advocating for AI ethics and responsible approaches for human-machine teaming and experiences with AI systems, autonomous vehicles, and other emerging technologies since 2015. Smith has been an active volunteer in technical communities and was Vice President of the User Experience Professionals Association (UXPA) and served two terms on the international board. Smith is currently an ACM Distinguished Speaker, an IEEE working group member for the P7008 Standard, and an editor for the UXPA Journal of Usability Studies. Smith holds a master’s degree in HCI from DePaul University. Carnegie Mellon University Software Engineering Institute 4500 Fifth Avenue Pittsburgh, PA 15213-2612 412-268-5800"
