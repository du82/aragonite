full_description = "Ipek Ozkaya is a principal researcher and the technical director of the Engineering Intelligent Software Systems group at the SEI. Ozkaya’s primary interests include developing techniques for improving software development efficiency and system evolution with an emphasis on software architecture practices, software economics, and agile development. Ozkaya’s most recent research focuses on building the theoretical and empirical foundations of managing technical debt in large-scale, complex software-intensive systems and software engineering of AI-enabled systems. Ozkaya is editor-in-chief of IEEE Software magazine and is the coauthor of a practitioner book, Managing Technical Debt, Reducing Friction in Software Development. Ozkaya holds doctoral and master’s degrees in computational design from Carnegie Mellon University. Carnegie Mellon University Software Engineering Institute 4500 Fifth Avenue Pittsburgh, PA 15213-2612 412-268-5800"
