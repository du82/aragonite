full_description = "Human Factors in Software Engineering November 12, 2019 • Podcast By Andrew O. Mellinger, Suzanne Miller, and Hasan Yasar Andrew Mellinger, Suzanne Miller, and Hasan Yasar discuss the human factors that impact software engineering, from the communication tools they use to the environments where they work. Publisher Software Engineering Institute Topic or Tag Cyber Workforce Development Listen Watch Abstract Solving the technical aspects isn’t enough to build reliable, enduring, resilient software and systems. Human decision making, behavioral factors, and cultural factors influence software engineering, acquisition, and cybersecurity. In this podcast roundtable, Andrew Mellinger, Suzanne Miller, and Hasan Yasar discuss the human factors that impact software engineering, from the communication tools they use to the environments where they work. About the Speaker Andrew O. Mellinger Suzanne Miller Suzanne Miller is an SEI alumni employee.Suzanne Miller is a principal researcher at the Software Engineering Institute of Carnegie Mellon University in the Continuous Deployment of Capability Directorate. Miller actively supports multiple large DoD cyber-physical programs in their Agile/Lean adoption efforts, in addition to designing and teaching Agile courses … Read more Hasan Yasar Hasan Yasar is the Technical Director of the Continuous Deployment of Capability group in the SSD Division of the Software Engineering Institute, CMU. Hasan leads an engineering group to enable, accelerate, and assure transformation at the speed of relevance by leveraging DevSecOps, Agile, Lean AI/ML, and other emerging technologies to … Read more SHARE"
