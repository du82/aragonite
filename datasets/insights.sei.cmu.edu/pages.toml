["https://insights.sei.cmu.edu/library/reviewing-the-role-of-machine-learning-and-artificial-intelligence-for-remote-attestation-in-5g-networks"]
title = "Reviewing the Role of Machine Learning and Artificial Intelligence for Remote Attestation in 5G+ Networks"
description = "In this paper, key aspects of models used for trust of devices are reviewed, and it discusses how these AI/ML models intersect with 5G network architecture."
full_description = "Reviewing the Role of Machine Learning and Artificial Intelligence for Remote Attestation in 5G+ Networks October 10, 2022 • Conference Paper By Shannon Gallagher, Austin Whisnant, Anton Hristozov, and Amit Vasudevan In this paper, key aspects of models used for trust of devices are reviewed, and it discusses how these AI/ML models intersect with 5G network architecture. Publisher IEEE Topic or Tag Artificial Intelligence Engineering Cybersecurity Engineering Secure Development Software Engineering Research And Development Abstract The next generation of communication networks promises exponential growth in number, low latency, and heterogeneity of devices. Consequently, we need to be able to trust devices and device-to-device interactions in sections of a 5G+ network, commonly known as slices. Devices must be willing and able to remotely attest to their trustworthiness. Although trust has previously been based upon deterministic and hardware-driven protocols, over recent decades it has become more common to incorporate artificial intelligence and machine learning (AI/ML) modeling to supplement those protocols. In this paper, we review some key aspects of models used for trust of devices, including important criteria for model selection, model structure, and inputs, and advantages and disadvantages of these models. We also examine how these AI/ML models intersect with 5G network architecture. Following that, we discuss what sort of data is expected for these trust models. Finally, we discuss the next steps for AI/ML models for remote attestation in 5G+ networks. SHARE"
author = """
Shannon Gallagher,                                           Austin Whisnant,                                           Anton Hristozov,                                  and Amit Vasudevan"""
year_published = 2022
