full_description = "Nick Testa is a Senior Data Scientist on the SEMA team within the Software Solutions Division (SSD). Since joining the SEI in August 2022, Nick has been involved in several research projects that involve applying tools like anomaly detection, causal discovery and inference, and experimental design and metrics. Before joining the SEI, Nick received a dual Ph.D. in Integrative Biology and Ecology, Evolutionary Biology, and Behavior at Michigan State University in 2016. There, his main research focus was studying the molecular-genetic and developmental mechanisms of sexual size dimorphism in the fruit fly, Drosophila melanogaster. After graduating, Nick took on a postdoctoral research position in Quantitative Genetics at Georgia Tech to study Developmental System Drift in the nematode, Caenorhabditis elegans. Starting in 2018, Nick left academic research for his first role in a data science position in the Risk division of PNC Bank where his primary roles were data process automation, agile team lead, and natural language processing and analysis. In 2019, Nick joined the Pharmacy department at Highmark Inc where he worked on various projects, including building end-to-end data solutions, clinical research, predictive analytics, and professional mentorship. Nick joined the SEI in 2022 as Senior Data Scientist to begin working on projects utilizing Causal Learning. Carnegie Mellon University Software Engineering Institute 4500 Fifth Avenue Pittsburgh, PA 15213-2612 412-268-5800"
