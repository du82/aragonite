title = "Cyber Intelligence Tradecraft Report: The State of Cyber Intelligence Practices in the United States (Study Report Only)"
description = "This report details the findings of a study the SEI conducted at the request of the United States Office of the Director of National Intelligence. In the report, we present current best practices and common challenges in cyber intelligence."
full_description = "Cyber Intelligence Tradecraft Report: The State of Cyber Intelligence Practices in the United States (Study Report Only) May 22, 2019 • Educational Material By Jared Ettinger, Hollen Barmer, Jennifer Kane, Heather Evans, Erica Brandon, and Andrew O. Mellinger This report details the findings of a study the SEI conducted at the request of the United States Office of the Director of National Intelligence. In the report, we present current best practices and common challenges in cyber intelligence. Publisher Software Engineering Institute Abstract This report details the findings of a study the Software Engineering Institute (SEI) at Carnegie Mellon University conducted at the request of the United States Office of the Director of National Intelligence (ODNI). Our mission was simple: understand how organizations across sectors conduct the work of cyber intelligence and share our findings. In this report, we describe the practices of organizations that are performing well and the areas where many organizations struggle, and we identify the models, frameworks, and innovative technologies driving cyber intelligence today. We believe this report can provide a starting point to enable organizations across the country to adopt best practices, work together to fix common challenges, and reduce the risk of cyber threats to the broader cyber community. SHARE"
author = """
Jared Ettinger,                                           Hollen Barmer,                                           Jennifer Kane,                                           Heather Evans,                                           Erica Brandon,                                  and Andrew O. Mellinger"""
