["https://insights.sei.cmu.edu/blog/weaknesses-and-vulnerabilities-in-modern-ai-integrity-confidentiality-and-governance"]
title = "Weaknesses and Vulnerabilities in Modern AI: Integrity, Confidentiality, and Governance"
description = "In the rush to develop AI, it is easy to overlook factors that increase risk. This post explores AI risk through the lens of confidentiality, governance, and integrity."
full_description = "Weaknesses and Vulnerabilities in Modern AI: Integrity, Confidentiality, and Governance Bill Scherlis August 5, 2024 PUBLISHED IN Artificial Intelligence Engineering CITE https://doi.org/10.58012/638h-ab63 Get Citation SHARE In the development of AI systems for mission applications, it is essential to recognize the kinds of weaknesses and vulnerabilities unique to modern AI models. This is important for design, implementation, and test and evaluation (T&E) for AI models and AI-based systems. The October 2023 Executive Order on AI highlights the importance of red teams, and we can expect that these weaknesses and vulnerabilities will be a focus of attention for any T&E activity.This blog post examines a number of specific weaknesses and vulnerabilities associated with modern artificial intelligence (AI) models that are based on neural networks. These neural models include machine learning (ML) and generative AI, particularly large language models (LLMs). We focus on three aspects:Triggers, including both attack vectors for deliberate adversarial action (exploiting vulnerabilities) and intrinsic limitations due to the statistical nature of the models (manifestations from weaknesses)The nature of operational consequences, including the kinds of potential failures or harms in operationsMethods to mitigate them, including both engineering and operational actionsThis is the second installment in a four-part series of blog posts focused on AI for critical systems where trustworthiness—based on checkable evidence—is essential for operational acceptance. The four parts are relatively independent of each other and address this challenge in stages:Part 1: What are appropriate concepts of security and safety for modern neural-network-based AI, including ML and generative AI, such as LLMs? What are the AI-specific challenges in developing safe and secure systems? What are the limits to trustworthiness with modern AI, and why are these limits fundamental?Part 2 (this part): What are examples of the kinds of risks specific to modern AI, including risks associated with confidentiality, integrity, and governance (the CIG framework), with and without adversaries? What are the attack surfaces, and what kinds of mitigations are currently being developed and employed for these weaknesses and vulnerabilities?Part 3: How can we conceptualize T&E practices appropriate to modern AI? How, more generally, can frameworks for risk management (RMFs) be conceptualized for modern AI analogous to those for cyber risk? How can a practice of AI engineering address challenges in the near term, and how does it interact with software engineering and cybersecurity considerations?Part 4: What are the benefits of looking beyond the purely neural network models of modern AI towards hybrid approaches? What are current examples that illustrate the potential benefits, and how, looking ahead, can these approaches advance us beyond the fundamental limits of modern AI? What are prospects in the near and longer terms for hybrid AI approaches that are verifiably trustworthy and that can support highly critical applications?The sections below identify specific examples of weaknesses and vulnerabilities, organized according to three categories of consequences—integrity, confidentiality, and governance. This builds on a number of NIST touchstones, including the AI RMF Framework, which includes an AI RMF playbook, a draft generative AI RMF profile, a model-focused categorization of adversarial ML attacks, and a testbed for evaluation and experimentation. The NIST RMF organizes actions into four categories: govern (cultivate risk-aware organizational culture), map (recognize usage context), measure (identify, analyze, and assess risks), and manage (prioritize and act). CIG builds on these NIST touchstones, with a focus on consequences of both attacks (enabled by vulnerabilities) and adverse accidental outcomes (enabled by weaknesses), with an intent to anticipate hybrid AI approaches that can safely—and verifiably—support highly critical applications.Risks, Part 1: IntegrityIn the context of modern neural-network-based AI, including ML and generative AI, integrity risks refer to the potential for attacks that could cause systems to produce results not intended by designers, implementers, and evaluators. We note that, because specifications of intent—beyond curation of the corpus of training data—are difficult or infeasible for many neural-network models, the concept of “intended results” has only informal meaning.The paragraphs below identify several kinds of integrity attacks against neural networks and the nature of the weaknesses and vulnerabilities that are exploited, along with some discussion of potential mitigations.Data poisoning. In data poisoning attacks, an adversary interferes with the data that an ML algorithm is trained on, for example by injecting additional data elements during the training process. (Poisoning can also be effective in supervised learning.) These attacks enable an adversary to interfere with test-time and runtime behaviors of the trained algorithm, either by degrading overall effectiveness (accuracy) or by causing the algorithm to produce incorrect results in specific situations. Research has shown that a surprisingly small amount of manipulated training data, even just a handful of samples, can lead to large changes in the behavior of the trained model. Data poisoning attacks are of particular concern when the quality of the training data cannot be readily ascertained; this difficulty can be amplified by the need to continuously retrain algorithms with newly acquired data.Relevant to national security and health domains, poisoning attacks can occur in federated learning, where a collection of organizations jointly train an algorithm without directly sharing the data that each organization possesses. Because the training data isn’t shared, it can be difficult for any party to determine the quality of the overall corpus of data. There are similar risks with public data, where adversaries can readily deploy adversarial training inputs. Related attacks can affect transfer learning methods, where a new model is derived from a previously trained model. It may be impossible to ascertain what data sources were used to train the source model, which would cloak any adversarial training affecting the derived model. (A number of hypotheses attempt to explain the surprising level of transferability across models, including, for larger models, commonality of data in the training corpus and in fine-tuning for alignment.)Misdirection and evasion attacks. Evasion attacks are characterized by an adversary attempting to cause a trained model to produce incorrect outputs during the operation of a system. Examples of results include misidentifying an object in an image, misclassifying risks in advising bank loan officers, and incorrectly judging the likelihood that a patient would benefit from a particular treatment. These attacks are accomplished by the adversary’s manipulation of an input or query given to the trained model. Evasion attacks are often categorized as either untargeted (the adversary’s goal is to trick the model into producing any incorrect answer) or targeted (the adversary’s goal is to trick the model into producing a specific incorrect answer). One example of an attack involves misdirecting neural networks for face recognition by placing colored dots on eyeglass frames. In many evasion attacks, it is important for the attacker-manipulated or attacker-provided input to appear benign, such that a cursory examination of the input by a human expert won’t reveal the attack. There is also the well-known attack of stickers on a stop sign. These stickers are unlikely to be noticed by human drivers—since many stop signs have stickers and other defacements—but carefully placed stickers function as patches that can reliably misdirect a sign-classification network into seeing a speed limit sign. This kind of spoofing has a relatively low work factor and indeed has been the subject of undergraduate homework assignments.In evaluating the susceptibility of models to evasion attacks, a key consideration is to define what it means for a model’s output to be correct. For many applications, correctness could be defined as always giving the answer that a human would give. Needless to say, this can be difficult to test with any degree of comprehensiveness. Additionally, there are applications where this criterion may not be sufficient. For example, we may want to prohibit outputs that are accurate but harmful, such as detailed instructions on how to make an explosive or commit credit-card fraud.One of the principal challenges in evaluation, as noted above, is defining design intent regarding system function and quality attributes, analogous to a traditional software specification. It remains a research problem to develop effective means to specify intent for many kinds of ML or LLMs. How can the outputs of models be comprehensively verified against some ground truth to guard against misinformation or disinformation? Given that full specifications are rarely possible, the three CIG categories are not crisply delineated, and indeed this kind of attack poses both an integrity and confidentiality risk.Inexactness. The fundamental weakness shared by all modern AI technologies derives from the statistical nature of neural networks and their training: The results of neural network models are statistical predictions. Results are in a distribution, and both memorization and hallucination are within the bounds of that distribution. Research is leading to rapid improvement: Model designs are improving, training corpora are increasing in scale, and more computational resources are being applied to training processes. It is nonetheless essential keep in mind that the resulting neural-network models are stochastically-based, and therefore are inexact predictors.Generative AI hallucinations. The statistical modeling that is characteristic of LLM neural network architectures can lead to generated content that conflicts with input training data or that is inconsistent with facts. We say that this conflicting and incorrect content is hallucinated. Hallucinations can be representative elements generated from within a category of responses. This is why there is often a blurry similarity with the actual facts—called aleatoric uncertainty in the context of uncertainty quantification (UQ) modeling mitigation techniques (see below).Reasoning failures. Corollary to the statistical inexactness is the fact that neural-network models do not have intrinsic capacity to plan or reason. As Yann LeCun noted, “[The models’] understanding of the world is very superficial, in large part because they are trained purely on text” and “auto-regressive LLMs have very limited reasoning and planning abilities.” The operation of LLMs, for example, is an iteration of predicting the next word in a text or building on the context of a prompt and the previous text string that it has produced. LLMs can be prompted to create the appearance of reasoning and, in so doing, often give better predictions that might create an appearance of reasoning. One of the prompt techniques to accomplish this is called chain-of-thought (CoT) prompting. This creates a simulacrum of planning and reasoning (in a kind of Kahneman “fast-thinking” style), but it has unavoidably inexact results, which become more evident once reasoning chains scale up even to a small extent. A recent study suggested that chains longer than even a dozen steps are in general not faithful to the reasoning done without CoT. Among the many metrics on mechanical reasoning systems and computation generally, two are particularly pertinent in this comparison: (1) capacity for external checks on the soundness of the reasoning structures produced by an LLM, and (2) numbers of steps of reasoning and/or computation undertaken.Examples of Approaches to MitigationIn addition to the approaches mentioned in the above sampling of weaknesses and vulnerabilities, there are a number of approaches being explored that have the potential to mitigate a broad range of weaknesses and vulnerabilities.Uncertainty quantification. Uncertainty quantification, in the context of ML, focuses on identifying the kinds of statistical predictive uncertainties that arise in ML models, with a goal of modeling and measuring those uncertainties. In the context of ML, a distinction is made between uncertainties relating to inherently random statistical effects (so-called aleatoric) and uncertainties relating to insufficiencies in the representation of knowledge in a model (so-called epistemic). Epistemic uncertainty can be reduced through additional training and improved network architecture. Aleatoric uncertainty relates to the statistical association of inputs and outputs and can be irreducible. UQ approaches depend on precise specifications of the statistical features of the problem.UQ approaches are less useful in ML applications where adversaries have access to ML attack surfaces. There are UQ methods that attempt to detect samples that are not in the central portion of a probability distribution of expected inputs. These are also susceptible to attacks.Many ML models can be equipped with the ability to express confidence or, inversely, the likelihood of failure. This enables modeling the effects of the failures at the system level so their effects can be mitigated during deployment. This is done through a combination of approaches to quantifying the uncertainty in ML models and building software frameworks for reasoning with uncertainty, and safely handling the cases where ML models are uncertain.Retrieval augmented generation (RAG). Some studies suggest building in a capacity for the LLM to check consistency of outputs against sources expected to represent ground truth, such as knowledge bases and certain websites such as Wikipedia. Retrieval augmented generation (RAG) refers to this idea of using external databases to verify and correct LLM outputs. RAG is a potential mitigation for both evasion attacks and generative AI hallucinations, but it is imperfect because the retrieval results are processed by the neural network.Representation engineering. Raising the level of abstraction in a white-box analysis can potentially improve understanding of a range of undesirable behaviors in models, including hallucination, biases, and harmful response generation. There are a number of approaches that attempt feature extraction. This form of testing requires white-box access to model internals, but there are preliminary results that suggest similar effects may be possible in black-box testing scenarios by optimizing prompts that target the same key internal representations. This is a small step to piercing the veil of opacity that is associated with larger neural-network models. More recent w"
author = "Bill Scherlis"
year_published = 2024
