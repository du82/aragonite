title = "Emerging Technology Domains Risk Survey"
description = "This report provides a snapshot in time of our current understanding of future technologies."
full_description = "Emerging Technology Domains Risk Survey April 30, 2015 • Technical Note By Christopher King, Jonathan Chu, and Andrew O. Mellinger This report provides a snapshot in time of our current understanding of future technologies. Publisher Software Engineering Institute CMU/SEI Report Number CMU/SEI-2015-TN-003 DOI (Digital Object Identifier) 10.1184/R1/6573446.v1 Topic or Tag Cloud Computing Pervasive Mobile Computing Abstract In today’s increasingly interconnected world, the information security community must be prepared to address emerging vulnerabilities that may arise from new technology domains. Understanding trends and emerging technologies can help information security professionals, leaders of organizations, and others interested in information security to anticipate and prepare for such vulnerabilities. This report, originally prepared in 2014 for the Department of Homeland Security United States Computer Emergency Readiness Team (US-CERT), provides a snapshot in time of the current understanding of future technologies. Each year, this report will be updated to include new estimates of adoption timelines, new technologies, and adjustments to the potential security impact of each domain. This report will also help US-CERT to make an informed decision about the best areas to focus resources for identifying new vulnerabilities, promoting good security practices, and increasing understanding of systemic vulnerability risk. SHARE"
author = """
Christopher King,                                           Jonathan Chu,                                  and Andrew O. Mellinger"""
