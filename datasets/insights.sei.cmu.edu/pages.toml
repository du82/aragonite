full_description = "Dangers of AI for Insider Risk Evaluation (DARE) November 19, 2024 • White Paper By Austin Whisnant This paper describes the challenges and pitfalls of using artificial intelligence for insider risk analysis and how to thoughtfully and efficiently use AI to find insider threats. Publisher Software Engineering Institute DOI (Digital Object Identifier) 10.1184/R1/27325569 Topic or Tag Insider Threat Measurement And Analysis Risk Abstract Artificial Intelligence (AI) holds the promise of reducing insider risk incidents, but it comes with a unique set of challenges. This paper outlines the potential pitfalls of leveraging AI for insider risk analysis and suggests methods for mitigating those challenges. Section 1 explains AI and its many implementations and applications, including those specific to the domain of insider risk. Section 2 outlines the challenges and pitfalls of AI and how those apply specifically to insider risk analysis. Section 3 discusses at what point it is appropriate to use AI in the insider risk domain and what to consider when implementing these methods operationally. SHARE"
