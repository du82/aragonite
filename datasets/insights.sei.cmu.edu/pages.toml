full_description = "Dr. Eric Heim is a senior machine learning research scientist at the SEI’s Emerging Technology Center. Before arriving at SEI, Heim led a basic and applied machine learning research group at the Air Force Research Laboratory, Information Directorate. Heim earned a doctoral degree in computer science in 2015 from the University of Pittsburgh. Heim’s research focuses on practical issues of applying machine learning methods to real-world environments. Such issues include: data-scarcity, model robustness, learning from structured data, and enabling models to express and reason about uncertainty in their predictions. Heim has applied his work to problems ranging from identifying man-made structures from LiDAR measurements of terrain to estimating RF signal propagation effects from aerial imagery. Carnegie Mellon University Software Engineering Institute 4500 Fifth Avenue Pittsburgh, PA 15213-2612 412-268-5800"
