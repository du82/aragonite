title = "Careers at IntechOpen | IntechOpen"
description = "Employee quote to be added"
full_description = "Our business values are based on those any scientist applies to their research. The values of our business are based on the same ones that all good scientists apply to their research. We have created a culture of respect and collaboration within a relaxed, friendly, and progressive atmosphere, while maintaining academic rigour. Please check out our job board for open positions. Open Access is an initiative that aims to make scientific research freely available to all. To date our community has made over 100 million downloads. It’s based on principles of collaboration, unobstructed discovery, and, most importantly, scientific progression. As PhD students, we found it difficult to access the research we needed, so we decided to create a new Open Access publisher that levels the playing field for scientists across the world. How? By making research easy to access, and puts the academic needs of the researchers before the business interests of publishers. We are a community of more than 103,000 authors and editors from 3,291 institutions spanning 160 countries, including Nobel Prize winners and some of the world’s most-cited researchers. Publishing on IntechOpen allows authors to earn citations and find new collaborators, meaning more people see your work not only from your own field of study, but from other related fields too. Brief introduction to this section that descibes Open Access especially from an IntechOpen perspective Our team is growing all the time, so we’re always on the lookout for smart people who want to help us reshape the world of scientific publishing. Our business values are based on those any scientist applies to their research. The values of our business are based on the same ones that all good scientists apply to their research. We have created a culture of respect and collaboration within a relaxed, friendly, and progressive atmosphere, while maintaining academic rigour. Integrity - We are consistent and dependable, always striving for precision and accuracy in the true spirit of science."
