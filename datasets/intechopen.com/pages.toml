title = "Peer Review | IntechOpen"
description = "At IntechOpen, we only publish academic books and papers that have been peer reviewed, ensuring that each accords with scientific and ethical requirements."
full_description = "Open Access is an initiative that aims to make scientific research freely available to all. To date our community has made over 100 million downloads. It’s based on principles of collaboration, unobstructed discovery, and, most importantly, scientific progression. As PhD students, we found it difficult to access the research we needed, so we decided to create a new Open Access publisher that levels the playing field for scientists across the world. How? By making research easy to access, and puts the academic needs of the researchers before the business interests of publishers. We are a community of more than 103,000 authors and editors from 3,291 institutions spanning 160 countries, including Nobel Prize winners and some of the world’s most-cited researchers. Publishing on IntechOpen allows authors to earn citations and find new collaborators, meaning more people see your work not only from your own field of study, but from other related fields too. Brief introduction to this section that descibes Open Access especially from an IntechOpen perspective Our team is growing all the time, so we’re always on the lookout for smart people who want to help us reshape the world of scientific publishing. Peer review (also known as refereeing) is the process of subjecting an author's scholarly work, research, or ideas to the scrutiny of others who are experts in the same field, before a paper describing this work is published. Peer review helps the publisher decide whether the submitted work should be accepted, considered acceptable with revisions, or is rejected. For a flowchart description of the peer review process at IntechOpen please see below. IntechOpen is dedicated to publishing high-quality content and we are a member of the Committee on Publication Ethics (COPE). All referees and Editors are instructed to review submissions in line with the COPE Ethical Guidelines for Peer Reviewers.. There is a wealth of information regarding peer review available and we would encourage our editors, authors, and reviewers to educate themselves further regarding this process. A clearer understanding of peer review can only lead to a better maintenance of the high standards of the peer review process, better perseverance of the integrity of the scholarly record, and responsible and ethical behaviour of all parties participating in the peer review process. For more information we recommend the following:"
