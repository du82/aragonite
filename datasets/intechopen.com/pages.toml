sor development was a joint venture by Intel and Analog Devices. In 2002 Lineo Inc., was taken over by another company, so he joined Aalborg University Denmark as an Assistant Professor. Professor Akbar has truly a multi-disciplined career and he continued his legacy and making progress in many areas of his interests both in teaching and research. He has contributed in stochastic estimation of control area especially, in the Multiple Target Tracking and Interactive Multiple Model (IMM) research, Ball & Beam Control Problem, Robotics, Levitation Control. He has contributed in developing Algorithms for Fingerprint Matching, Computer Vision and Face Recognition. He has been supervising Pattern Recognition, Formal Languages and Distributed Processing projects for several years. He has reviewed many books on Management, Computer Science. Currently, he is an active and permanent reviewer for many international conferences and symposia and the program committee member for many international conferences. In teaching he has taught the core computer science subjects like, Digital Design, Real Time Embedded System Programming, Operating Systems, Software Engineering, Data Structures, Databases, Compiler Construction. In the Engineering side, Digital Signal Processing, Computer Architecture, Electronics Devices, Digital Filtering and Engineering Management. Apart from his Academic Interest and activities he loves sport especially, Cricket, Football, Snooker and Squash. He plays cricket for Esbjerg city in the second division team as an opener wicket keeper batsman. He is a very good player of squash but has not played squash since his arrival in Denmark."
