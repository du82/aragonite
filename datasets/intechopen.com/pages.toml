["https://intechopen.com/news/introducing-intechopen-book-series-a-new-publishing-format-for-oa-books-20210915"]
title = "Introducing IntechOpen Book Series - A New Publishing Format for OA Books | IntechOpen"
description = "With the desire to make book publishing more relevant for the digital age and offer innovative Open Access publishing options, we are thrilled to announce the launch of our new publishing format: IntechOpen Book Series."
full_description = "Share on Twitter Share on Facebook Share on LinkedIn With the desire to make book publishing more relevant for the digital age and offer innovative Open Access publishing options, we are thrilled to announce the launch of our new publishing format: IntechOpen Book Series. Designed to cover fast-moving research fields in rapidly expanding areas, our Book Series feature a Topic structure allowing us to present the most relevant sub-disciplines. Book Series are headed by Series Editors, and a team of Topic Editors supported by international Editorial Board members. Topics are always open for submissions, with an Annual Volume published each calendar year. After a robust peer-review process, accepted works are published quickly, thanks to Online First, ensuring research is made available to the scientific community without delay. Our innovative Book Series format brings you: Topic Focused Publications - Each topic showcases high impact subject areas Renowned Editorial Expertise - Series Editors, Topic Editors, and a team of international Board Members that permanently support each Book Series Fast Publishing - quick turnaround which is unique for book publishing The benefit of ISSN and ISBN for increased citation and indexing possibilities IntechOpen Book Series will also publish a program of research-driven Thematic Edited Volumes that focus on specific areas and allow for a more in-depth overview of a particular subject. IntechOpen Book Series will be launching regularly to offer our authors and editors exciting opportunities to publish their research Open Access. We will begin by relaunching some of our existing Book Series in this innovative book format, and will expand in 2022 into rapidly growing research fields that are driving and advancing society. Launching 2021 Artificial Intelligence, ISSN 2633-1403 Veterinary Medicine and Science, ISSN 2632-0517 Biochemistry, ISSN 2632-0983 Biomedical Engineering, ISSN 2631-5343 Infectious Diseases, ISSN 2631-6188 Physiology (Coming Soon) Dentistry (Coming Soon) We invite you to explore our IntechOpen Book Series, find the right publishing program for you and reach your desired audience in record time. Note: Edited in October 2021"
year_published = 2021
year_updated = 2021
