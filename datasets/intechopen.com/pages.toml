["https://intechopen.com/profiles/496"]
title = "Carlos Leon | IntechOpen"
full_description = "Actually, a large amount of information is stored in the industrial repositories. Accessing this information is complicated, and the techniques currently used in metadata and the material chosen by the user do not scale efficiently in large collections. The semantic Web provides a frame of reference that allows sharing and reusing knowledge efficiently. In our work, we present a focus for discovering information in digital repositories based on the application of expert system technologies, and we show a conceptual architecture for a semantic search engine. We used case-based reasoning methodology to create a prototype that supports efficient retrieval knowledge from digital repositories. OntoEnter is a collaborative effort that proposes a new form of interaction between users and digital enterprise repositories, where the latter are adapted to users and their surroundings. Electric vehicle fleets and smart grids are two growing technologies. These technologies provided new possibilities to reduce pollution and increase energy efficiency. In this sense, electric vehicles are used as mobile loads in the power grid. A distributed charging prioritization methodology is proposed in this paper. The solution is based on the concept of virtual power plants and the usage of evolutionary computation algorithms. Additionally, the comparison of several evolutionary algorithms, genetic algorithm, genetic algorithm with evolution control, particle swarm optimization, and hybrid solution are shown in order to evaluate the proposed architecture. The proposed solution is presented to prevent the overload of the power grid. Nowadays, the proliferation of heterogeneous data sources provided by different research and innovation projects and initiatives is proliferating more and more and presents huge opportunities. These developments create an increase in the number of different data sources, which could be involved in the process of decision-making for a specific purpose, but this huge heterogeneity makes this task difficult. Traditionally, the expert systems try to integrate all information into a main database, but, sometimes, this information is not easily available, or its integration with other databases is very problematic. In this case, it is essential to establish procedures that make a metadata distributed integration for them. This process provides a “mapping” of available information, but it is only at logic level. Thus, on a physical level, the data is still distributed into several resources. In this sense, this chapter proposes a distributed rule engine extension (DREE) based on edge computing that makes an integration of metadata provided by different heterogeneous data sources, applying then a mathematical decomposition over the antecedent of rules. The use of the proposed rule engine increases the efficiency and the capability of rule-based expert systems, providing the possibility of applying these rules over distributed and heterogeneous data sources, increasing the size of data sets that could be involved in the decision-making process."
