["https://intechopen.com/news/intechopen-book-wins-the-2022-international-academy-of-astronautics-life-science-book-award-20230328"]
title = "IntechOpen Book Wins the 2022 International Academy of Astronautics Life Science Book Award | IntechOpen"
description = "We are thrilled that the International Academy of Astronautics has chosen IntechOpen&#39;s book &quot;Preparation of Space Experiments&quot;, edited by Dr. Vladimir Pletser, to receive the IAA Life Science&nbsp;Book Award. The award is given annually to recognize excellence in publication by an Academy member or corresponding member in the field of life sciences."
full_description = "Share on Twitter Share on Facebook Share on LinkedIn We are thrilled that the International Academy of Astronautics has chosen IntechOpen's book Preparation of Space Experiments, edited by Dr. Vladimir Pletser, to receive the IAA Life Science Book Award. The award is given annually to recognize excellence in publication by an Academy member or corresponding member in the field of life sciences. Winning the award places this book on the prestigious forty-year list of awarded books by some of the most respected academic publishers and university presses such as Elsevier, Springer, Taylor and Francis, Cambridge University Press, and others. It is a huge accomplishment to be recognised by this highly respected organisation for space research, not only for us as the publishers but also for Dr. Plester and contributing authors. It is “ one of the highest awards that the academy bestows on its members”, says Dr. Pletser. Preparation of Space Experiments was published in 2020 as our 5,000th milestone Open Access book presenting some of the current trends in space microgravity research. The eleven chapters introduce various facets of space research in physical sciences, human physiology and technology developed using the microgravity environment not only to improve our fundamental understanding in these domains but also to adapt this new knowledge for application on earth. On this occasion, we interviewed the Editor Dr. Pletser. In this interview, Dr. Pletser discusses the value of Open Access and his work with Intechopen while sharing a story about the book and how it makes space research accessible to a broader audience and humankind. He discusses his future research goals and what we can expect from upcoming and exciting Moon and Mars explorations. Watch an exclusive interview here: We want to congratulate Dr. Pletser on winning the IAA Book Award. It's a tremendous honor and additional outstanding recognition of the book and the joint work of all included contributors. About the International Academy of Astronautics (IAA) The International Academy of Astronautics (IAA), a non governmental organization recognized by the United Nations, was founded in 1960 in Stockholm. Since that time, IAA has brought together the world's foremost experts in the disciplines of astronautics on a regular basis to recognize the accomplishments of their peers, to explore and discuss cutting-edge issues in space research and technology, and to provide direction and guidance in the non-military uses of space and the ongoing exploration of the solar system."
