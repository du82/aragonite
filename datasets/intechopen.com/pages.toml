title = "The Future of Television - Convergence of Content and Technology | IntechOpen"
description = "This book presents a collection of chapters that focus on the convergence of television today, approached using an interdisciplinary perspective. Clearly, the importance of technological advances describes only one aspect of this evolutionary process. In this book, convergence is also examined from other equally important perspectives, which include a historical case study on convergence and culture-viewer evolution and the changes that interactivity has introduced as opposed to static content. Because this publication focuses on all aspects that transform the medium, users, content, broadcasting, and interactive technology, it becomes evident that convergence is a highly interdisciplinary subject that must always be addressed from various perspectives."
