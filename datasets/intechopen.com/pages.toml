["https://intechopen.com/news/intechopen-journals-presents-engaging-with-open-science-2023-webinar-series-20230407"]
title = "IntechOpen Journals Presents: 'Engaging with Open Science 2023' Webinar Series | IntechOpen"
description = "This year, to continue to support our community, we are launching our &#39;Engaging with Open Science 2023&#39; webinar series, where we will discuss key developments in open science with industry-leading experts and academics. The webinars are organised in three sessions which tell you what you need to know about preprints, open data and open peer review."
full_description = "Share on Twitter Share on Facebook Share on LinkedIn Last year we successfully launched our interdisciplinary Open Science journal portfolio, to support the changing needs of our academics. In the run-up to the launch, we worked with our community and created our first 'Introduction to Open Science' webinar demonstrating how Open Science is the natural next step for academics and publishers who support Open Access. The webinar was a great success and marked an important milestone in our Open Science journey. This year, to continue to support our community, we are launching our 'Engaging with Open Science 2023' webinar series, where we will discuss key developments in open science with industry-leading experts and academics. The webinars are organised in three sessions which tell you what you need to know about preprints, open data and open peer review. Our first webinar, ‘Engaging with Open Science 2023: PREPRINTS’, takes place on Tuesday, 18 April, at 3 pm (CET), 2 pm (UK), and 9 am (ET). REGISTER HERE The webinar will open with a short introduction to the topic presented by the chair - Dr Sarah Greaves (STEM Publishing Consultant). This will be followed by insights into 'Why Preprints Matter,' with Eric Olson (Center for Open Science), 'How to Create and Use Preprints,' with Mark Hahnel (Figshare) and 'The Value of Preprints From the Academic Perspective' with Digital Medicine and Healthcare Technology Editorial Board Member, Dr Thomas Heinbockel (Howard University College of Medicine). The session will conclude with a roundtable discussion and a question-and-answer session. We are pleased to be gathering Open Science industry experts and academics together for this webinar to share their insights on the topic. Dr Greaves chaired our first webinar in 2022, and we are delighted to welcome her back. Her twenty years of experience in the publishing industry and academia will add value to our Open Science discussion. More information about Dr Greaves and the speakers can be found on the official webinar landing page. We look forward to seeing you at the first webinar, 'Engaging with Open Science 2023: PREPRINTS,' on 18 April. To register for the webinar, click here. WEBINARS IN THIS SERIES: Webinar 1 - Engaging with Open Science 2023: PREPRINTS | 18 April 2023 Watch the recording. Webinar 2 - Engaging with Open Science 2023: OPEN DATA | 13 June 2023 Watch the recording. Webinar 3 - Engaging with Open Science 2023: OPEN PEER REVIEW | 26 September 2023 Watch the recording."
