["https://intechopen.com/profiles/137858"]
title = "Seth Appiah-Opoku | IntechOpen"
description = "Dr. Appiah-Opoku is a Professor of Geography at the University of Alabama, Tuscaloosa, USA. He teaches Urban Planning and Analysis, Land Use Regulation, World Regional Geography, and a field studies in Africa course. He teaches at both the undergraduate and graduate levels and has served on several thesis and dissertation committees. He is the author of two books and has edited five others. His research focuses on environmental assessment, transportation planning, urban and regional planning, biodiversity conservation and ecotourism, environmental risk assessment, natural resource conservation, indigenous ecological knowledge, and international development. He is an American Institute of Certified Planners member and has officially contributed questions to the AICP exam. He has served on the international editorial board of the Journal of Environmental Impact Assessment since 2003 and has published scholarly articles in several renowned journals, including Habitat International, Transport Research Part A: Policy and Practice, Journal of Urban Planning and Development, Journal of Transport and Health, Journal of Sustainable Development, Environmental Management, Environmental Impact Assessment Review, Journal of Cultural Geography, and Plan Canada. He served on the Technical Advisory Team that advised the Ghana government on preparing a 40-year development plan for the country in 2015."
full_description = "Dr. Appiah-Opoku is a Professor of Geography at the University of Alabama, Tuscaloosa, USA. He teaches Urban Planning and Analysis, Land Use Regulation, World Regional Geography, and a field studies in Africa course. He teaches at both the undergraduate and graduate levels and has served on several thesis and dissertation committees. He is the author of two books and has edited five others. His research focuses on environmental assessment, transportation planning, urban and regional planning, biodiversity conservation and ecotourism, environmental risk assessment, natural resource conservation, indigenous ecological knowledge, and international development. He is an American Institute of Certified Planners member and has officially contributed questions to the AICP exam. He has served on the international editorial board of the Journal of Environmental Impact Assessment since 2003 and has published scholarly articles in several renowned journals, including Habitat International, Transport Research Part A: Policy and Practice, Journal of Urban Planning and Development, Journal of Transport and Health, Journal of Sustainable Development, Environmental Management, Environmental Impact Assessment Review, Journal of Cultural Geography, and Plan Canada. He served on the Technical Advisory Team that advised the Ghana government on preparing a 40-year development plan for the country in 2015. Rural development involves strategies designed to improve the socioeconomic, political and environmental life of people living outside urbanized areas. It is intended to improve the well-being of rural communities by expanding their access to basic services like education, healthcare, employment opportunities, agricultural extension services, electricity, micro-credit, and infrastructural services, including feeder roads and sanitation facilities. In this light, this book presents cases that demonstrate challenges to rural development, culture and development, and technology and food production in rural areas. The book includes contributions from leading researchers and scholars in the field of rural development from different countries, including the USA, Colombia, Mozambique, Japan, Zimbabwe, South Africa, Cameroon, Sudan, and Japan. Based on empirical research, this book discusses a variety of topics, including longitudinal health sciences mentorship program for rural schools in Washington State, USA; demographic dividend and challenges for rural development in Cameroon; igniting cultural heritage tourism as potential to rural development in KwaZulu-Natal, South Africa; assessing Japan’s urban to rural migration program; enhancing food security through fisheries in rural Zimbabwe; assessing biogas technology implementation as a vehicle for rural development in Limpopo, South Africa; smart rural communities action research in Colombia and Mozambique; and evaluating selected agricultural extension approaches in rural Sudan. The book is insightful, thought-provoking, and easy to understand. It could serve as an essential reference material on contemporary rural development programs."
