["https://intechopen.com/profiles/605"]
title = "Dil Hussain | IntechOpen"
description = """
Dr. Dil Muhammad Akbar Hussain is a professor of Electronics Engineering & Computer Science at the Department of Energy Technology, Aalborg University Denmark.  Professor Akbar has a Master degree in Digital Electronics from Govt. College University, Lahore Pakistan and a P-hD degree in Control Engineering from the School of Engineering and Applied Sciences, University of Sussex United Kingdom.  Aalborg University has Two Satellite Campuses, one in Copenhagen (Aalborg University Copenhagen) and the other in Esbjerg (Aalborg University Esbjerg).
· He is a member of prestigious IEEE (Institute of Electrical and Electronics Engineers), and IAENG (International Association of Engineers) organizations. 
· He is the chief Editor of the Journal of Software Engineering.
· He is the member of the Editorial Board of International Journal of Computer Science and Software Technology (IJCSST) and International Journal of Computer Engineering and Information Technology. 
· He is also the Editor of Communication in Computer and Information Science CCIS-20 by Springer.
· Reviewer For Many Conferences
He is the lead person in making collaboration agreements between Aalborg University and many universities of Pakistan, for which the MOU’s (Memorandum of Understanding) have been signed.
Professor Akbar is working in Academia since 1990, he started his career as a Lab demonstrator/TA at the University of Sussex.  After finishing his P. hD degree in 1992, he served in the Industry as a Scientific Officer and continued his academic career as a visiting scholar for a number of educational institutions.  In 1996 he joined National University of Science & Technology Pakistan (NUST) as an Associate Professor; NUST is one of the top few universities in Pakistan.  In 1999 he joined an International Company Lineo Inc, Canada as Manager Compiler Group, where he headed the group for developing Compiler Tool Chain and Porting of Operating Systems for the BLACKfin processor.  The processor development was a joint venture by Intel and Analog Devices. In 2002 Lineo Inc., was taken over by another company, so he joined Aalborg University Denmark as an Assistant Professor.
Professor Akbar has truly a multi-disciplined career and he continued his legacy and making progress in many areas of his interests both in teaching and research.  He has contributed in stochastic estimation of control area especially, in the Multiple Target Tracking and Interactive Multiple Model (IMM) research, Ball & Beam Control Problem, Robotics, Levitation Control. He has contributed in developing Algorithms for Fingerprint Matching, Computer Vision and Face Recognition.  He has been supervising Pattern Recognition, Formal Languages and Distributed Processing projects for several years.  He has reviewed many books on Management, Computer Science.  Currently, he is an active and permanent reviewer for many international conferences and symposia and the program committee member for many international conferences.
In teaching he has taught the core computer science subjects like, Digital Design, Real Time Embedded System Programming, Operating Systems, Software Engineering, Data Structures, Databases, Compiler Construction.  In the Engineering side, Digital Signal Processing, Computer Architecture, Electronics Devices, Digital Filtering and Engineering Management.
Apart from his Academic Interest and activities he loves sport especially, Cricket, Football, Snooker and Squash.  He plays cricket for Esbjerg city in the second division team as an opener wicket keeper batsman.  He is a very good player of squash but has not played squash since his arrival in Denmark."""
