full_description = "Open Access is an initiative that aims to make scientific research freely available to all. To date our community has made over 100 million downloads. It’s based on principles of collaboration, unobstructed discovery, and, most importantly, scientific progression. As PhD students, we found it difficult to access the research we needed, so we decided to create a new Open Access publisher that levels the playing field for scientists across the world. How? By making research easy to access, and puts the academic needs of the researchers before the business interests of publishers. We are a community of more than 103,000 authors and editors from 3,291 institutions spanning 160 countries, including Nobel Prize winners and some of the world’s most-cited researchers. Publishing on IntechOpen allows authors to earn citations and find new collaborators, meaning more people see your work not only from your own field of study, but from other related fields too. Brief introduction to this section that descibes Open Access especially from an IntechOpen perspective Our team is growing all the time, so we’re always on the lookout for smart people who want to help us reshape the world of scientific publishing. Are you interested in joining us in the Open Access Revolution? We invite you to contribute to an edited volume, or alternatively, browse through our extensive online catalogue that is open for submissions. We encourage our authors to find the best home for their work, whether this is via a direct invitation from us, or by proposing their own edited volume. Below we give a brief overview of how IntechOpen’s Open Access book programme operates. Did you know that we also publish many different format types? IntechOpen accepts complete monographs, edited volumes/collections, proceedings, and IntechOpen Compacts. If you would like more information please contact us at book.department@intechopen.com. Unsure of where to find funding for your Open Access Book? IntechOpen offers a free open access support service. Click the link to find out more. You can view our Waiver Policy here."
