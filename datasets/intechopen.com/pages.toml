["https://intechopen.com/books/6534"]
title = "Heavy Metals | IntechOpen"
description = "Fundamental societal changes resulted from the necessity of people to get organized in mining, transporting, processing, and circulating the heavy metals and their follow-up products, which in consequence resulted in a differentiation of society into diversified professions and even societal strata. Heavy metals are highly demanded technological materials, which drive welfare and progress of the human society, and often play essential metabolic roles. However, their eminent toxicity challenges the field of chemistry, physics, engineering, cleaner production, electronics, metabolomics, botany, biotechnology, and microbiology in an interdisciplinary and cross-sectorial manner. Today, all these scientific disciplines are called to dedicate their efforts in a synergistic way to avoid exposure of heavy metals into the eco- and biosphere, to reliably monitor and quantify heavy metal contamination, and to foster the development of novel strategies to remediate damage caused by heavy metals."
