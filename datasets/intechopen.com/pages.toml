["https://intechopen.com/books/1004047"]
title = "Contemporaneous Issues about Creativity | IntechOpen"
description = "Over the last decades, scholars and practitioners have studied creativity as the production of original and effective ideas capable of being applied to different fields of existence. More recently, it has been recognized as one of the most important skills for the 21st century, as a differential for professionals, and as a basis for innovation. Even with this acknowledgement, creativity is being challenged by advances in Artificial Intelligence, especially generative intelligence, which is seen as capable of performing creative activities and, eventually, replacing human creativity. Besides that, more and more is said about the role of schools in preparing for this new world by developing creativity to enhance opportunities for work and careers. The book goes beyond by introducing the relationship between creativity and mental health, defying the standard view which associates creativity with madness and taking creativity as a tool for therapeutic processes."
