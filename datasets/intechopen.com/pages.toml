["https://intechopen.com/news/intechopen-celebrates-the-6-000th-open-access-book-published-20220927"]
title = "IntechOpen Celebrates the 6,000th Open Access Book Published | IntechOpen"
description = "A significant milestone was celebrated recently with the publication of IntechOpen&rsquo;s 6,000th Open Access book, &quot;Congenital Heart Defects Recent Advances.&quot; The book is edited by P. Syamasundar Rao, Professor of Pediatrics and Medicine and Emeritus Chief of Pediatric Cardiology at the McGovern Medical School, the University of Texas at Houston, a pioneer in interventional pediatric cardiology."
full_description = 'Share on Twitter Share on Facebook Share on LinkedIn A significant milestone was celebrated recently with the publication of IntechOpen’s 6,000th Open Access book, "Congenital Heart Defects Recent Advances." The book is edited by P. Syamasundar Rao, Professor of Pediatrics and Medicine and Emeritus Chief of Pediatric Cardiology at the McGovern Medical School, the University of Texas at Houston, a pioneer in interventional pediatric cardiology. This 6,000th book focuses on the remarkable developments in the diagnosis and treatment of congenital heart defects in the last 50 years. It addresses these achievements and discusses issues related to managing congenital heart disease in developing countries. Reflecting his insights on the book, Dr. Rao says: “A large number of advances have occurred in both the diagnosis and treatment of congenital heart defects over the last few decades. Some of these advances were reviewed in the book by authors from around the world. It is hoped that these reviews are helpful to the reader in diagnosing and managing their patients with congenital heart defects. “My past experience of editing and publishing with IntechOpen indicates that a large number of physicians from several countries accessed these books. I anticipate a similar response for this book as well.” The book brings the perspectives of 41 researchers from around the world, including prominent scientists in the field, such as Maria Giovanna Russo from the Pediatric Cardiology Unit—Luigi Vanvitelli—Campania University Hospital, Monaldi Hospital, Naples, Italy, Jose Da Silva from UPMC Children’s Hospital of Pittsburgh and the University of Pittsburgh, USA as well as Cecilia W. Lo from University of Pittsburgh, USA. Since 2004, all of our Open Access publications provide original content on topics ranging from robotics to space exploration, immunology to sustainable development, and beyond. With the publication of our 6,000th book, we remain a relevant source of research for scientists, scholars, and innovators worldwide. Dr. Sara Uhac, CEO at IntechOpen, says: “We are proud to reach the milestone of the 6,000th book in the year of our eighteenth anniversary since the beginning of our journey of opening up science and celebrating its contribution to improving the world in which we live. This achievement highlights our commitment to our scientific community and sets further expectations for the future as we continue to advance science through our publishing program and all our activities”. Danijela Duric, Director of Book Publishing at IntechOpen, says: "On behalf of our Book Publishing Department, I would like to express our gratitude to all the Editors and Authors who have contributed to the 6,000 books that we have published to date. Since we began as pioneers in the publishing industry with Open Access books, we have thoroughly enjoyed our years of working with academics and widely sharing their work.” As we continue advancing science and democratising knowledge through our publishing program, look at the retrospective of our Open Access books journey.'
