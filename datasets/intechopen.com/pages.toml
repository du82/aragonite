["https://intechopen.com/profiles/14201"]
title = "Sulaiman Wadi Harun | IntechOpen"
description = """
Sulaiman Wadi Harun received his B.E. degree in Electrical and Electronics System Engineering from Nagaoka University of Technology, Japan, in 1996 and his M.Sc. and Ph.D. degrees in Photonics Technology from the University of Malaya in 2001 and 2004, respectively. With over 20 years of research experience, he has contributed extensively to developing optical fiber devices, including fiber amplifiers, fiber lasers, and fiber optic sensors. He is also exploring new nanomaterials such as graphene, carbon nanotubes, black phosphorus, topological insulators, and zinc oxide nanostructures for fiber lasers and sensor applications. Prof. Harun has authored over 900 articles in renowned ISI journals, with his work cited more than 9,000 times and an h-index exceeding 55, reflecting his significant impact on the field. He is an academic editor for the International Journal of Optics, indexed in ISI and Scopus. He has successfully supervised more than 80 Ph.D. students to completion.
Additionally, he holds adjunct professorships at Brawijaya University in Indonesia and Vellore Institute of Technology in India. In 2016, he was awarded the prestigious Malaysian Rising Star award by the Ministry of Higher Education for his contributions to international collaboration. He is a Fellow of the Malaysian Academy of Science and the founder and honorary advisor of the Optical Society of Malaysia."""
full_description = "Sulaiman Wadi Harun received his B.E. degree in Electrical and Electronics System Engineering from Nagaoka University of Technology, Japan, in 1996 and his M.Sc. and Ph.D. degrees in Photonics Technology from the University of Malaya in 2001 and 2004, respectively. With over 20 years of research experience, he has contributed extensively to developing optical fiber devices, including fiber amplifiers, fiber lasers, and fiber optic sensors. He is also exploring new nanomaterials such as graphene, carbon nanotubes, black phosphorus, topological insulators, and zinc oxide nanostructures for fiber lasers and sensor applications. Prof. Harun has authored over 900 articles in renowned ISI journals, with his work cited more than 9,000 times and an h-index exceeding 55, reflecting his significant impact on the field. He is an academic editor for the International Journal of Optics, indexed in ISI and Scopus. He has successfully supervised more than 80 Ph.D. students to completion. Additionally, he holds adjunct professorships at Brawijaya University in Indonesia and Vellore Institute of Technology in India. In 2016, he was awarded the prestigious Malaysian Rising Star award by the Ministry of Higher Education for his contributions to international collaboration. He is a Fellow of the Malaysian Academy of Science and the founder and honorary advisor of the Optical Society of Malaysia. Optical technology is a cornerstone in communication, computing, and sensing. This book aims to explore the dispersion, attenuation, and nonlinear effects that occur as light signals propagate through specialized fibers, while also investigating the emerging and enabling technologies such as optical fiber sensors, quantum computing, free-space optical communication, and photonic crystal-based optical devices. The selected topics highlight optical technologies driving the next generation of communication, computing, and sensing. Featuring the latest research from leading experts in the field, this book will serve as an invaluable resource for researchers, engineers, and advanced students in photonics, ultrafast optics, sensing, and optical communication."
