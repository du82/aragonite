["https://intechopen.com/news/intechopen-retains-its-dominant-position-in-growing-oa-market-20230217"]
title = "IntechOpen retains its dominant position in growing OA market | IntechOpen"
description = "In their analysis of the latest data from the Directory of Open Access Books (DOAB), Delta Think, a strategic consulting and advisory firm, confirmed that IntechOpen remains the largest publisher across all years, with a share of 9.6%."
full_description = "Share on Twitter Share on Facebook Share on LinkedIn In their analysis of the latest data from the Directory of Open Access Books (DOAB), Delta Think, a US-based independent strategic consulting and advisory firm, confirmed that IntechOpen remains the largest publisher across all years, with a share of 9.6%. DOAB is community-driven discovery service that indexes and provides access to scholarly, peer-reviewed open access books and helps users to find trusted open access book publishers. With volume more than doubling to 60,000 titles since the last Delta Think report, 18 months ago, DOAB acts as a proxy for the wider OA market. Both indexed titles and registered publishers are continuing to grow. Indexed titles increased 17% between 2021 and 2022, and the registered number of publishers are up from 490 in the previous report to 525. IntechOpen continues to hold the most sizeable catalogue with a share of 9.6%, followed by MDPI with 8.5% and De Gruyter with 4.8% share. IntechOpen is proud to be leading that growth – and that it remains a strong choice for authors looking to publish innovative research."
