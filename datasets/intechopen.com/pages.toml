["https://intechopen.com/books/371"]
title = "Abiotic Stress in Plants - Mechanisms and Adaptations | IntechOpen"
description = "World population is growing at an alarming rate and is anticipated to reach about six billion by the end of year 2050. On the other hand, agricultural productivity is not increasing at a required rate to keep up with the food demand. The reasons for this are water shortages, depleting soil fertility and mainly various abiotic stresses. The fast  pace at which developments and novel findings that are recently taking place in the cutting edge areas of molecular biology and basic genetics, have reinforced and augmented the efficiency of science outputs in dealing with plant abiotic stresses. In depth understanding of the stresses and their effects on plants is of paramount importance to evolve effective strategies to counter them. This book is broadly dived into sections on the stresses, their mechanisms and tolerance, genetics and adaptation, and focuses on the mechanic aspects in addition to touching some adaptation features. The chief objective of the book hence is to deliver state of the art information for comprehending the nature of abiotic stress in plants. We attempted here to present a judicious mixture of outlooks in order to interest workers in all areas of plant sciences."
