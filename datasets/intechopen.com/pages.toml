["https://intechopen.com/news/intechopen-signs-open-access-institutional-agreement-with-iowa-state-university-20240311"]
title = "IntechOpen Signs Open Access Institutional Agreement with Iowa State University | IntechOpen"
description = "IntechOpen signs an institutional agreement with Iowa State University of Science and Technology to support open access and cover open access publishing fees for their faculty."
full_description = "Share on Twitter Share on Facebook Share on LinkedIn IntechOpen signs an institutional agreement with Iowa State University of Science and Technology to support open access and cover open access publishing fees for their faculty. Founded in 1858, Iowa State University of Science and Technology (ISU) is the first coeducational land-grant institution in the United States. ISU has seven colleges: Agriculture and Life Sciences, Business, Design, Engineering, Human Sciences, Liberal Arts and Sciences, and Veterinary Medicine. IntechOpen is a pioneer in the open access books movement, having published over 6,900 open access books, many from leading scholars in their field. The funding for this deal is provided by Iowa State University Library with the goals to both promote open access and openness for ISU’s research publications, and to support author choice by making open access publishing an affordable option. This multipayer cost-sharing model, and publisher discount is designed to enable Iowa State University Library to stretch its open access funds to help as many authors as possible and ensure that lack of research funds is not a barrier for authors who choose to publish in IntechOpen's Open Access Books and Journals. IntechOpen is proud to enter this agreement with Iowa State University to encourage open access publishing across all formats and fields of science. With a particular focus on open access books, IntechOpen and Iowa State University are also both supporting and actively involved with the OA Switchboard initiative for books and strive to provide a way for authors to access available funds for OA book initiatives and cover book and chapter publication costs. For more information on the agreement details, visit the landing page here. About Iowa State University Iowa State University of Science and Technology (ISU) was founded in 1858 as the land-grant institution for the State of Iowa (the first coeducational land-grant institution in the United States). ISU is one of the three state-supported universities in Iowa administered by the State Board of Regents. ISU has seven colleges: Agriculture and Life Sciences, Business, Design, Engineering, Human Sciences, Liberal Arts and Sciences, and Veterinary Medicine. Visit the university's website at www.iastate.edu for more information. About IntechOpen Born from a desire to make publishing more relevant for the digital age, IntechOpen has grown to become the world’s leading publisher of Open Access books, specialising in science, technology and medicine. In 2022, IntechOpen introduced a portfolio of Open Science journals, representing a new publishing venue for academics in areas of rapid interdisciplinary growth at the cutting edge of technology, environmental sciences, and human health. IntechOpen is built on the belief that scientific progress is generated by collaboration and is committed to openly sharing scientific research across the world, making it available for the benefit of all. Learn more at www.intechopen.com"
year_published = 2024
year_updated = 2024
