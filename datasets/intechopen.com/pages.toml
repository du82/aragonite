["https://intechopen.com/chapters/1167041"]
title = "WDM-FSO System for 5G Wireless Network Using Spatial Multiplexing in the Presence of Wireless and Optical Nonlinearities | IntechOpen"
description = '<p id="p1">This chapter focuses on theoretical analysis of the transmission performance of wavelength division multiplexed (WDM) free-space optical communication (FSO) links amidst optical and wireless nonlinearities. It has been shown that, to mitigate the nonlinearities due to atmospheric turbulence and optical path, spatial multiplexing technique has been utilized, coupled with advanced modulation formats such as CS-RZ, QPSK and DSPK, and QAM. An in-depth theoretical model and simulation study have been carried out. In the presence of strong and medium turbulence, our analysis indicates that modulation formats QAM, DPSK, and QPSK perform better than normal baseband CS-RZ. The analysis further shows that using spatial multiplexing (MIMO), QAM has a 5.1&nbsp;dB advantage over CS-RZ and a 1.6 dB advantage over DPSK and QPSK modulations at the FEC threshold level of 3.8&nbsp;&times;&nbsp;10<sup>&minus;3</sup>. The WDM-FSO system can transmit wireless signals up to a distance of 36 kilometers at the FEC threshold. Further, we have shown that a combination of the WDM-FSO system can transport wireless signals up to 36&nbsp;km at the FEC threshold 3.8&nbsp;&times;&nbsp;10<sup>&minus;3</sup>. Specifically, it has been demonstrated that the spectrally efficient QAM modulation format achieves higher transmission efficiency at FEC error rate 3.8&nbsp;&times;&nbsp;10<sup>&minus;3</sup>.</p>'
full_description = "Advertisement Advertisement Abstract This chapter focuses on theoretical analysis of the transmission performance of wavelength division multiplexed (WDM) free-space optical communication (FSO) links amidst optical and wireless nonlinearities. It has been shown that, to mitigate the nonlinearities due to atmospheric turbulence and optical path, spatial multiplexing technique has been utilized, coupled with advanced modulation formats such as CS-RZ, QPSK and DSPK, and QAM. An in-depth theoretical model and simulation study have been carried out. In the presence of strong and medium turbulence, our analysis indicates that modulation formats QAM, DPSK, and QPSK perform better than normal baseband CS-RZ. The analysis further shows that using spatial multiplexing (MIMO), QAM has a 5.1 dB advantage over CS-RZ and a 1.6 dB advantage over DPSK and QPSK modulations at the FEC threshold level of 3.8 × 10−3. The WDM-FSO system can transmit wireless signals up to a distance of 36 kilometers at the FEC threshold. Further, we have shown that a combination of the WDM-FSO system can transport wireless signals up to 36 km at the FEC threshold 3.8 × 10−3. Specifically, it has been demonstrated that the spectrally efficient QAM modulation format achieves higher transmission efficiency at FEC error rate 3.8 × 10−3. Keywords WDM (wavelength division multiplexed)FSO (free-space optical communication)MIMO (multiple input-multiple output)QAMDPSKQPSK and CS-RZ Author Information Show + Raman Jee* Ministry of Electronics and Information Technology, Government of India, New Delhi, IndiaSomnath Chandra Ministry of Electronics and Information Technology, Government of India, New Delhi, India *Address all correspondence to: ramanj35@gmail.com 1. IntroductionThe swift development of 5G and 6G wireless systems, together with their impending deployment, necessitates increased system capacity, enhanced spectral efficiency, and faster data rates for both front- and back-haul networks [1, 2, 3, 4, 5, 6]. The combined transfer of enormously diverse data traffic from several network planes and massively networked devices into the core network is the main difficult issue facing 5G and B5G wireless systems. This issue suggests that 5G systems must employ multiplexing, a spectrally efficient modulation format (MIMO), and techniques seamless integration with the core optical backbone transmission path. In the 5G scenario, a backhaul network needs dense cellular structures to provide data access, which can be accomplished using microwave and millimeter-wave systems [7, 8]. However, they face limitation signal due to degradation, fading, and spectrum scarcity. Uses of signal transmission through optical fiber transmission has the benefit of being transparent to wireless signals, allowing for the sub-carrier multiplexing of numerous heterogeneous wireless channels using coherent systems or optical intensity modulation (IM-DD). Consequently, a dual hybrid optical transmission combination such as optical-wireless free-space optics (FSO) for the wireless signal part, and wavelength division multiplexing (WDM) for optical path can utilize, and 5G needs its complementary strengths. High bandwidth, high capacity, and secure data transmission have recently been thoroughly examined [2, 9]. The statistical fading effect scintillation brought on by atmospheric turbulence limits FSO transmission and therefore the transmission distance. The FSO system will work in conjunction with WDM technology to get around that distance restriction. WDM technology can send combined data streams at a higher transmission rate by utilizing several optical wavelengths. Furthermore, a number of spectrally efficient modulation formats that can send greater data rates over channels with limited bandwidth can be used to increase the data rate. Modulation in formats such as QPSK, DPSK, and m-QAM provides resistance against fading and greater spectral efficiency. In the wireless path, they are usable.Moreover, different spatial multiplexing techniques with multiple transmit and receive structures have recently been investigated experimentally and theoretically [4, 5, 6, 9, 10] in order to improve the robustness and battle the fading effect in the FSO channel. It has been demonstrated that system performance can be enhanced by using MIMO FSO in an intensity-modulated direct-detection approach. The MIMO-FSO system’s BER performance as reported in [8, 11] only takes atmospheric distortions into account when analyzing FSO transmission. However, nonlinear distortions and fading effects in both wireless and optical channels must be considered when analyzing the WDM-FSO combination with MIMO spatial multiplexing.The analysis of system performance, including bit error rate (BER), is analyzed in this chapter using a detailed analytical model that considers both atmospheric and optical nonlinearities. The robustness of these modulation formats, which include QPSK, QAM DPSK, CS-RZ, and QAM, has been evaluated. Advertisement 2. Hybrid FSO-WDM system architectureFigure 1(a) and (b) display the system architecture that utilizes FSO to backhaul dense cellular radio access in 5G environments along with WDM-based optical core transport. The WDM enhances the data rate to approximately 40 Gb/s by multiplexing FSO channels, and they share the same wavelength and system elements. Wireless and optical transports are utilized to their full potential in the above converged architecture. DWDM employs bidirectional data transmission and capacity multiplication, However, FSO offers greater deployment and reusability flexibility. Furthermore, the 5G scenario’s radio access units (RAUs) and the FSO’s wireless portion operate in separate frequency ranges and are not impacted in a comparableway by wireless routes. The deployment requirements dictate whether or not RAUs and FSO data transfer channels are compatible, and Refs. [9, 12, 13] have already demonstrated hybrid architectures for the deployment of backhaul/front-haul networks. In addition, optical modulation is transparent to RF signals, which allows for the use of cost-effective intensity-modulation direction detection (IM-DD) in optical transmission.Figure 1.(a) Schematic diagram of FSO-based access network and (b) configuration of WDM-M-QAM transmission over FSO link.Figure 1(a) illustrates the combined FSO-WDM design for signal transmission. It is hampered by a number of nonlinear distortions in the wireless, FSO, and optical paths. The electrical signal propagating through an FSO channel experiences random intensity fluctuations, which cause scintillation. The gamma-gamma distribution can be used effectively to model medium to strong turbulence. Consequently, we must consider the distortions in each of the aforementioned segments as well as the interaction of the aforementioned effects in order to assess the system performance in terms of BER and outage likelihood. The analytical model for evaluating BER performance will be presented in the next sections, considering the nonlinear distortions in every transmission segment. Advertisement 3. Channel model3.1 Radio access RF channel modelBefore multiplexing at the micro base stations, the individual RF signals in the radio access link are subjected to statistical fading in the wireless path. In our study, we consider that the statistics of the RF fading channel follow a Rician distribution. The Rician channel’s probability density function (PDF) is expressed in the following manner:FRFγ=1+kexp−k−γSNRRF1+k.×I02γSNRRFK+K2dγE1I would like to know where I0 the zeroth order Bessel function of the first kind is located. A Rayleigh fading environment is created when K = 0 is used for strong fading.3.2 Model for FSO channelIn LOS mode, the FSO link works with the pointing error being the total distance between the beam weight center and the receiver aperture center. To obtain PDF of the pointing error hp, the model described in [14, 15] can be used, as per the model in [8, 12, 16]. According to this model, attenuation resulting from geometric spread with radial displacement r from the detector origin can be roughly represented as follows on the receiver plane at distance L from the transmitter if we consider a circular detection aperture with radius a and a Gaussian spatial intensity profile of beam waist:hprL=A0exp−2r2wleq2E2The fraction of power collected by the detector is called hp(.), v=πr/2wl, wleq2=wl2rerfv/2vexp−v2 is the equivalent beam width, A = [erf (v)]2, erf(.) is the error function, and is the percentage of the gathered power at r = 0. In contrast, the radial displacement r has a Rayleigh distribution. After that, the hp PDF is provided by:fhphp=γ2A0γ2hpγ2−10≤hp≤A0E3Where γ=wzeq/2σs is the ratio between the equivalent beam radius and the standard deviation of the pointing error displacement at the receiver. The nth moment of ha is defined as Ehpn=∫0A0hpnfhphpdhp which can be obtained asEhpn=A0nγ2n+γ2E43.3 Model for atmospheric turbulenceThe signal’s degradation is caused by the statistical random fluctuations caused by strong and weak turbulence in the atmosphere.The gamma-gamma model is a model that is commonly employed and can handle both weak and strong turbulence regimes. The PDF that has been provided contains the received irradiance;pI=2aba+b2ΓaΓbIa+b−22Ka−b2abI,I>0E5where x is the normalized signal intensity scintillation, Γ(.) is gamma function, and Kn(.) is the modified Bessel function.a=exp0.49σ21+0.18d2+0.56σ12/57/6−1−1b=exp0.51σ21+0.69σ12/5−5/61+0.9d2+0.62d2σ12/5−1−1E6σ2=0.5Cn2k7/6L11/6 and d=πD2/2λL, D(m) is the diameter of the receiver collecting lens aperture,λm is the wavelength, and L(m) is the link distance, and the parameter responsible for the refractive index structure is Cn2m−2/3. The scintillation index S.I can be expressed in terms of a and b as follows.S.I=1a+1b+1abE7The PDF can be used to express the combined effects of atmospheric turbulent and the pointer error.fhh=∫fhphp.pIdIE8Following the approach in [14, 17, 18], the combined conditional PDF is represented as;fhh=abϕhl2A0ΓaΓbG1.33.0abA0hl2hϕ2−1,a−1,b−1ϕ2E9where G (.) can I find the Meijer G function.3.4 Combined model of radio access RF and FSOOur belief is that there is no statistical correlation between the fading in the radio access path and the atmospheric turbulence in the FSO link. Conditional PDFs can be used to represent the channel state to assess system performance,Pψ=FRFγ⋅fhhE103.5 Distortion due to optical nonlinearitiesThe signal that has faded due to both RF fading and FSO atmospheric turbulence is sent through optical fiber. Different optical carriers modulate the intensity of the faded signals, which are then multiplexed to form a WDM signal. The SSMF is used to transmit each WDM signal through intensity-modulated direct detection (IM-DD). Evaluation of the system performance of the WDM-FSO involves evaluating the effects of different optical nonlinearities encountered by the signal through the SMF. After being converted to the optical carrier frequency (FC), the WDM signal for N channels can be written as:St=∑i=0N−1sit=∑i=0N−1uit⋅expjωit+ϕitE11The optical power output from the laser diode is proportional to the modulating signals asPt=Pt1+∑i=0N−1mist+a3∑i=0N−1mist3E12The average transmitted optical power, a3, and mi are the average OMI per channel, which is Pt. The equations govern the small signal intensity modulation (IM) and phase modulation (PM) as they propagate through the fiber, taking into account both chromatic dispersion and SPM effect.∂p˜N∂z=β2ω2P0ϕ˜E13∂ϕ˜∂z=−β2ω24P0+γexp−αzp˜NE14where p˜N=p˜Nzω, ϕ˜=ϕ˜zω is the frequency of angular modulation, t is the time in a frame moving at the fiber input, and z is the distance. α is the coefficient of power attenuation, γ is the nonlinearity coefficient owing to, and β2 is the dispersion coefficient to nonlinear Kerr effect. where p˜N=p˜Nzω and ϕ˜=ϕ˜zω are the Fourier transforms of the normalized