["https://intechopen.com/books/5066"]
title = "Abiotic and Biotic Stress in Plants - Recent Advances and Future Perspectives | IntechOpen"
description = "The impact of global climate change on crop production has emerged as a major research priority during the past decade. Understanding abiotic stress factors such as temperature and drought tolerance and biotic stress tolerance traits such as insect pest and pathogen resistance in combination with high yield in plants is of paramount importance to counter climate change related adverse effects on the productivity of crops. In this multi-authored book, we present synthesis of information for developing strategies to combat plant stress. Our effort here is to present a judicious mixture of basic as well as applied research outlooks so as to interest workers in all areas of plant science. We trust that the information covered in this book would bridge the much-researched area of stress in plants with the much-needed information for evolving climate-ready crop cultivars to ensure food security in the future."
