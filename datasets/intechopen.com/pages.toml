["https://intechopen.com/books/12024"]
title = "UWB Technology - New Insights and Developments | IntechOpen"
description = "Ultra-wideband (UWB) is a radio frequency communication technology that transmits data stably and quickly within a short range. Due to its unprecedented accuracy, speed and reliability, it is an ideal technology for the indoor location of moving targets in space-sensitive and complex environments. This book disseminates some of the latest scientific and technological contributions by different researchers around the world in the development of both devices and applications based on UWB technology. Antennas, filters, resonators, delay cells, and transmitters are some of the useful electronic devices or systems described. This book aims to serve as a source of inspiration for continuing scientific research on commercial, industrial, and military applications of UWB technology. The book will be a valuable source of information for undergraduate and graduate students, as well as for experts and researchers around UWB technology."
