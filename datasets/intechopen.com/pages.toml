title = "Artificial Neural Networks - Methodological Advances and Biomedical Applications | IntechOpen"
description = "Artificial neural networks may probably be the single most successful technology in the last two decades which has been widely used in a large variety of applications in various areas.  The purpose of this book is to provide recent advances of artificial neural networks in biomedical applications.  The book begins with fundamentals of artificial neural networks, which cover an introduction, design, and optimization.  Advanced architectures for biomedical applications, which offer improved performance and desirable properties, follow.  Parts continue with biological applications such as gene, plant biology, and stem cell, medical applications such as skin diseases, sclerosis, anesthesia, and physiotherapy, and clinical and other applications such as clinical outcome, telecare, and pre-med student failure prediction.  Thus, this book will be a fundamental source of recent advances and applications of artificial neural networks in biomedical areas.  The target audience includes professors and students in engineering and medical schools, researchers and engineers in biomedical industries, medical doctors, and healthcare professionals."
