description = "Loris Nanni received his Master Degree cum laude on June-2002 from the University of Bologna, and the April 26th 2006 he received his Ph.D. in Computer Engineering at DEIS, University of Bologna. On September, 29th 2006 he has won a post PhD fellowship from the university of Bologna (from October 2006 to October 2008), at the competitive examination he was ranked first in the industrial engineering area. He extensively served as referee for several international journals. He is author/coauthor of more than 100 research papers. He has been involved in some projects supported by MURST and European Community. His research interests include pattern recognition, bioinformatics, and biometric systems (fingerprint classification and recognition, signature verification, face recognition)."
