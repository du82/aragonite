description = "IntechOpen are world leaders in open access science publishing, with over 3,900 peer reviewed books available across all STEM fields"
full_description = "Open Access is an initiative that aims to make scientific research freely available to all. To date our community has made over 100 million downloads. It’s based on principles of collaboration, unobstructed discovery, and, most importantly, scientific progression. As PhD students, we found it difficult to access the research we needed, so we decided to create a new Open Access publisher that levels the playing field for scientists across the world. How? By making research easy to access, and puts the academic needs of the researchers before the business interests of publishers. We are a community of more than 103,000 authors and editors from 3,291 institutions spanning 160 countries, including Nobel Prize winners and some of the world’s most-cited researchers. Publishing on IntechOpen allows authors to earn citations and find new collaborators, meaning more people see your work not only from your own field of study, but from other related fields too. Brief introduction to this section that descibes Open Access especially from an IntechOpen perspective Our team is growing all the time, so we’re always on the lookout for smart people who want to help us reshape the world of scientific publishing. We pride ourselves on our belief that scientific progress is generated by collaboration, that the playing field for scientific research should be leveled globally, and that research conducted in a democratic environment, with the use of innovative technologies, should be made available to anyone. We are on a journey to democratise knowledge. The Open Access paradigm is the only model which allows that. Content is accessible for free, on all electronic devices - no matter where it is downloaded and read, from Burkina Faso, to Romania or in Silicon Valley. Providing freely available, accessible dynamic academic content. We hold ourselves to the highest standards of academic publishing. We subscribe to the Budapest Initiative and are members of many Open Access publishing organizations, including:"
