["https://intechopen.com/chapters/1161885"]
title = "Free Space Optics | IntechOpen"
description = '<p id="p1">When we design an optical system, we need to consider that the transmitting power is appropriate to reach the receiving end, if this power is less than required, it will be difficult to separate the data from the noise, which in turn, will causes errors. In this chapter, a new method is presented to improve the received power in wireless optical communications by introducing an adaptive power method that adjusts the amplifier&rsquo;s power according to weather conditions. The simulation was done using OptiSystem programming environment and MATLAB environment. Results have shown improvement in the received power, bit error rate, quality factor, and eye diagram, in which the quality factor was improved by a rate ranging from 3.6 to 44.45% in different weather conditions.</p>'
full_description = "Advertisement Advertisement Abstract When we design an optical system, we need to consider that the transmitting power is appropriate to reach the receiving end, if this power is less than required, it will be difficult to separate the data from the noise, which in turn, will causes errors. In this chapter, a new method is presented to improve the received power in wireless optical communications by introducing an adaptive power method that adjusts the amplifier’s power according to weather conditions. The simulation was done using OptiSystem programming environment and MATLAB environment. Results have shown improvement in the received power, bit error rate, quality factor, and eye diagram, in which the quality factor was improved by a rate ranging from 3.6 to 44.45% in different weather conditions. Keywords free space optics (FSO)wireless optical communicationsoptical amplifiersEDFAeye diagram Author Information Show + Mazen Abdullatif* Aleppo University, Aleppo, Syria *Address all correspondence to: mazenabdullatif87@gmail.com 1. IntroductionFree Space Optics (FSO) technology is very promising in the world of optical communications where the signal is transmitted from the transmitter to the receiving end through free space and using the laser beam.This technology has many advantages such as high data rates, faster installation, unlicensed spectrum data, high security, and low cost [1, 2, 3].The most prominent applications of FSO are satellite communications, data center networks, underwater communications, and mobile backhaul (Figure 1) [4, 5, 6, 7].Figure 1.Wireless optical communications.The main challenge of FSO system is the different weather conditions that affect the optical link. Attenuation is caused by weather changes such as rain, snow, fog, and dust, which in turn, affects the received power, that is reflected in BER and quality factor [8]. Advertisement 2. Photo transmittersThe light sources convert the electrical signal into a light signal with the provision of sufficient power to overcome the damping to reach the receiving end with a level of power higher than the sensitivity of the receiver. The light source is chosen according to the communication system to be established, that is according to the transmission rate and the distance to be covered. The adjustment is made directly or indirectly (external rate).Semiconductor laser sources have been adopted in modern optical communications because of their many advantages compared to other laser transmitters, including [9]:Small size: These transmitters are built on a single chip that includes all the components needed to emit laser light, which allows them to be easily combined with other equipment.Great efficiency: The efficiency of the laser transmitter is up to 50%, which allows it to be driven with low electrical power compared to other transmitters.It is driven directly and with a small current: that is, conventional transistor circuits can be used to power the laser transmitter.High reliability.However, these transmitters are not without some disadvantages, including high sensitivity to heat, and therefore the issue of cooling is a fundamental issue that must be taken into consideration.2.1 Basic parameters of laser transmittersTransmitter output power: It is measured in mW or dBm.The wavelength of light emitted by the transmitter, as the laser transmission takes place at a wavelength that represents one of the transmitter windows.Spectral width of the source: it is the width of the output pulse and is usually denoted by Δλ.Primary page. Advertisement 3. Optoelectronic modifiers3.1 Photoelectric effectThe photoelectric effect occurs when an electric field is applied to a transparent medium, where the optical properties of this medium (the refractive index) change according to the changes of the field applied to the transparent medium [10].The applied electric field causes changes in the lengths and directions of the axes of the ellipse by the crystal’s refractive index. This leads to a change in the polarization of the light wave passing through the crystal. Thus, the optical intensity at the output will change according to the applied voltage, and this is known as the photoelectric effect.3.2 Photo modulation mechanismThe optical intensity of the laser transmitter can be modified in one of two ways [11]:3.2.1 A direct modificationThis is done by feeding the laser transmitter directly with an electrical information signal. Despite the simplicity of this modification, it is rarely used because of the frequency chirping resulting from the direct modification of the source.3.2.2 Indirect modification (external)The semiconductor laser is fed with a continuous electric current to generate a continuous light wave, and the optical power is modified by an external modifier, such as the Mach Zehnder rate, and Figure 2 shows the external modulation.Figure 2.External modification.3.2.2.1 Mach-Zehnder modulatorThis rectifier consists of a planar waveguide on a substrate with a pair of electrodes, to which modulating electrical forces are applied. The instantaneous electric field at the output Eout(t) is given in terms of the instantaneous electric field at the input Ein(t) in relation (1) [11]:Eoutt=12expjπVπV1t+expjπVπV2tEintE1Vπ=V1+V2E2In order to obtain a direct relationship between the two optical intensities at the input and output, voltages V1 and V2 are chosen as follows:V1t=Vt−Vπ2E3V2t=−Vt+Vπ2E4Thus, the ratio of the electric fields at the input and output is:EouttEint=sinπ.VtVπE5Thus, the optical intensity (the square of the electric field) is modified according to the voltages applied to the two rectifier paths. Figure 3 shows the rate structure and the main intervention:Figure 3.Mach-Zehnder Modulator.Figure 4.A typical high-speed digital signal with an eye diagram.3.2.3 PhotoreceptorsThe photoreceptor converts the optical signal into an electrical signal. There are several types of these receivers depending on their physical structure, but the most common are the photodiode (PIN) and the diode scattering (APD). These elements are characterized by their small size, good sensitivity, fast response, and low noise.3.3 Basic parameters of photoreceptorsThe photodetector has the following properties:The sensitivity of the photodetector: It is defined as the ratio of the output current of the detector (estimated in mA) to the power of the input light (estimated in mW).Dark current: One of the specifications of photoreceptors is that they allow the passage of electric current even in the absence of the optical signal (darkness), which leads to the appearance of a dark current that enters as a systematic error in any of the measurements taken by this detector. The cause of this current is the thermal effect generated charge carriers.Responsiveness: It is the ratio of the detector’s output current to the input light power, measured in A/Watt, and given for a specific wavelength.Response speed: It determines the maximum possible transmission speed for a particular photodetector.Spectral response: It determines the relationship of the detector’s response with wavelength. Advertisement 4. PhotodetectorThe primary function of the photodetector is to convert the light signal falling on it into an electrical signal from which the transmitted information can be extracted using suitable electronic circuits. Semiconductor photodetectors depend in their work on the phenomenon of semiconductor absorption of photons, which leads to the generation of free charge carriers that cause the passage of an electric current, and this phenomenon is called the photoelectric effect. If a reverse bias is applied to the P-N junction and without light, a small current will pass through it called the dark current. On the other hand, when the light ray falls on the diode, it absorbs the energy of a photon and an electron-hole pair is formed. If such carriers are formed in the depletion region or near it, it will travel across the junction as a result of the effect of the electric field, and this movement of charge carriers across the junction will lead to the flow of a current in the external circuit of the diode that is directly proportional to the capacity of the light absorbed by the diode, and thus the light is converted into an electric current.It is a mechanism that gives us analysis of high-speed digital signals. This diagram is formed from the digital form of the signal by folding the part of the signal corresponding to each bit on one graphic curve so that its horizontal axis is time and its vertical axis is the amplitude of the signal, and by repeating this process for many wave samples, and the resulting curve will present the statistical average of the signal, which is similar in shape to the shape of the eye, where Figures 1–12 shows the ideal shape of the eye chart and the practical form of the eye chart. Advertisement 5. Eye chart basicsFigure 5 shows the measurements that can be obtained from an eye chart.Figure 5.Practical high-speed digital signal with eye diagram.Figure 6.Scheme of the eye with the measurements that we can read on it.One level:The one level in the eye chart expresses the mean value of the one logical amplitude.Zero level:The zero level in the eye chart expresses the mean value of the zero logical amplitude.Eye amplitude:It is the difference between the one level and the zero level, and based on the amplitude of the eye, the logical circuits at the receiving end will determine if the receiving bit is 1 or 0.Eye height:It is a measure of the vertical aperture of the eye chart, the eye height measurement will be equal to the eye amplitude measurement, but for a true eye chart noise will affect the eye height and cause the eye to close, as a result, the eye height measurement determines the degree of eye closure because of the noise, the SNR indicates directly the degree of eye closure.Eye crossing percentage:The eye crossing ratio gives an indication of the distortion of the duty cycle or problems in the symmetry of the pulses at high speeds. The best value for eye crossing percentage is 50% where the duration of the positive pulse is equal to the duration of the negative pulse.Figure 7 shows the distortion in the duty cycle and its reflection on the eye chart.Figure 7.Format of a received digital signal and the resulting eye diagram with a crossover ratio of 75. Advertisement 6. Effect of weather factors on FSO linkOne of the challenges facing the FSO channel is atmospheric attenuation due to absorption, scattering, and scintillation (which may cause signal loss and optical link failure occur), and the effect of these factors changes with time and depends on local conditions and distance. Water molecules and carbon dioxide mainly cause absorption of light signals, while fog, rain, snow, and cloud cause scattering of light signals traveling in free space. This scattering leads to the deviation the light beam that is transmitted from the sender to the receiver. Atmospheric attenuation is given by Beer law, which is the ratio between the power of the transmitted signal and the power of the received signal [8, 12]:τ=PL=P0.exp−α.LE6WherePL: is laser power at the distance L.P0: is laser power at source.α: is air attenuation coefficient.Where the air attenuation coefficient is calculated by the Kim model.α=3.91V.550nmλ−qE7Whereλ: is wavelength in nm.V:is visibility.q: is size distribution of the scattering particles.The attenuation of the transmitted signal can be obtained from the previous model for different weather conditions using q which takes the following values depending on visibility [4, 5]:q = 1.6 for visibility (V > 50 km).q = 1.3 for visibility (6 km < V < 50 km).q = 0.16 V + 0.34 for visibility(1 km < V < 6 km).q = V − 0.5 for visibility (0.5 km < V < 1 km).q = 0 for visibility (V < 0.5 km). Advertisement 7. Optical amplifiersThe importance of optical amplifiers is that they restore optical power without any conversion electro-optical, according to which the principle of the optical amplifier works depends on the induced emission mechanism. There are many types of optical amplifiers, the most important of which are semiconductor amplifiers and similar fiber amplifiers. EDFA-like fiber amplifiers are of great importance in contemporary applications due to their important properties, and they have many work patterns that we will use in our research. This power control mode considers the value of the output power to control the amplifier performance (Power Control). The specified amplifier output power (Pspeci) is [13, 14, 15]:Pspeci=G×∑λPinλ−∫−∞+∞SASEfdfE8whereG: the amplifier gain.SASEf: the spectral density of amplified spontaneous emission integrated on the optical frequency f. Advertisement 8. The proposed FSO systemWhen designing an optical system, it must be taken into account that the transmitting power is sufficient to reach the receiving end, and in the event that the receiving power is less than the required limit, it will be difficult to separate the data from the noise, and therefore this matter will cause errors, and to design a well-functioning optical system, considerations must be taken following:The received power must be large enough to keep the BER at a low value.The receiving power must be small enough to avoid damage to the receiver.The transmitted power must be the lowest value required for the system to avoid excessive power consumption.It was found through studies that when the received power decreases, the bit error rate becomes bad and thus this problem is solved either by increasing the transmitter power or by using an optical amplifier, however if the power increases by a fixed amount, we will have two additional problems, first one is the excessive consumption of power since the weather factors to which the light link is exposed are temporary factors that continue for specific hours of the day, and during certain times of the year. The second is the damages the receiver as a result of permanent exposure to high power.Hence the idea of this chapter is to suggest an adaptive method of transmitting power according to the weather conditions to which the optical link is exposed. The proposed method ensures a balance between the receiving power being large enough to maintain the BER at a low value in addition to the receiving power being small enough to avoid damaging the receiver.If the received signal is less than -30 dBm, it sends a control signal from the receiver to the EDFA amplifier which adjusts its power to obtain a good signal reception as shown in Figure 8.Figure 8.Proposed method.Figure 9.The environment of simulation used. Advertisement 9. Results and discussionThe simulation was done using OptiSystem and MATLAB.OptiSystem is a powerful software for experimenting and controlling fiber optic networks, and optical wireless communication, and has good features for this work.In this section, numerical results o"
