["https://intechopen.com/books/3828"]
title = "Application of Nanotechnology in Drug Delivery | IntechOpen"
description = "This  book collects reviews and original articles from eminent experts working in the interdisciplinary arena of nanotechnology use in drug delivery. From their direct and recent experience, the readers can achieve a wide vision on the new and ongoing potentialities of nanotechnology application of drug delivery. Since the advent of analytical techniques and capabilities to measure particle sizes in nanometer ranges, there has been tremendous interest in the use of nanoparticles for more efficient methods of drug delivery. On the other hand, this reference discusses advances in design, optimization, and adaptation of gene delivery systems for the treatment of cancer, cardiovascular, pulmonary, genetic, and infectious diseases, and considers assessment and review procedures involved in the development of gene-based pharmaceuticals."
