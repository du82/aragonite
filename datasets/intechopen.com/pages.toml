["https://intechopen.com/profiles/557"]
title = "Andon Topalov | IntechOpen"
description = "Dr. Andon V. Topalov received an MSc degree in Control Engineering from the Faculty of Information Systems, Technologies, and Automation at Moscow State University of Civil Engineering (MGGU) in 1979. He then received his Ph.D. degree in Control Engineering from the Department of Automation and Remote Control at Moscow State Mining University (MGSU), Moscow, in 1984. From 1985 to 1986, he was a Research Fellow at the Research Institute for Electronic Equipment, ZZU AD, Plovdiv, Bulgaria. In 1986, he joined the Department of Control Systems, Technical University of Sofia at the Plovdiv campus, where he is presently a Full Professor. He has held long-term visiting Professor/Scholar positions at various institutions in South Korea, Turkey, Mexico, Greece, Belgium, the UK, and Germany. And he has coauthored one book and authored or co-authored more than 80 research papers in conference proceedings and journals. His current research interests are in the fields of intelligent control and robotics."
full_description = "Dr. Andon V. Topalov received an MSc degree in Control Engineering from the Faculty of Information Systems, Technologies, and Automation at Moscow State University of Civil Engineering (MGGU) in 1979. He then received his Ph.D. degree in Control Engineering from the Department of Automation and Remote Control at Moscow State Mining University (MGSU), Moscow, in 1984. From 1985 to 1986, he was a Research Fellow at the Research Institute for Electronic Equipment, ZZU AD, Plovdiv, Bulgaria. In 1986, he joined the Department of Control Systems, Technical University of Sofia at the Plovdiv campus, where he is presently a Full Professor. He has held long-term visiting Professor/Scholar positions at various institutions in South Korea, Turkey, Mexico, Greece, Belgium, the UK, and Germany. And he has coauthored one book and authored or co-authored more than 80 research papers in conference proceedings and journals. His current research interests are in the fields of intelligent control and robotics. Mobile robots are the focus of a great deal of current research in robotics. Mobile robotics is a young, multidisciplinary field involving knowledge from many areas, including electrical, electronic and mechanical engineering, computer, cognitive and social sciences. Being engaged in the design of automated systems, it lies at the intersection of artificial intelligence, computational vision, and robotics. Thanks to the numerous researchers sharing their goals, visions and results within the community, mobile robotics is becoming a very rich and stimulating area. The book Recent Advances in Mobile Robotics addresses the topic by integrating contributions from many researchers around the globe. It emphasizes the computational methods of programming mobile robots, rather than the methods of constructing the hardware. Its content reflects different complementary aspects of theory and practice, which have recently taken place. We believe that it will serve as a valuable handbook to those who work in research and development of mobile robots."
