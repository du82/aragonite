title = "IntechOpen Presents Interviews for Young Scientists with Science's Leading Minds | IntechOpen"
description = "We are pleased to present a series of inspirational interviews for young researchers with some of today&#39;s leading scientists, ranging from a Nobel laureate to pioneers and innovators in various fields, including pharmacogenomics, pharmaceutical leadership, and academia."
full_description = "Share on Twitter Share on Facebook Share on LinkedIn We are pleased to present a series of inspirational interviews for young researchers with some of today's leading scientists, ranging from a Nobel laureate to pioneers and innovators in various fields, including pharmacogenomics, pharmaceutical leadership, and academia. The interviews offer practical advice and emphasise the importance of mentorship and supporting young researchers in their scientific endeavours. While the program primarily targets young scientists, experienced scientists and professionals will also find value in these insightful discussions. The interviews were conducted by Alen Juginovic M.D. PhD, a physician and neuroscientist at Harvard Medical School, actively involved in organising events and initiatives to inspire the next generation of biomedical leaders. Featured interviewees include: Prof. Dr. Sir Richard J. Roberts, Nobel Prize laureate in Physiology or Medicine in 1993, from New England Biolabs, Ipswich, USA Prof. Carl-Henrik Heldin, former Chair at the Nobel Foundation, Uppsala University, Sweden Prof. Robert S. Langer, Institute Professor at the Massachusetts Institute of Technology, USA Ivana Vodopivec, MD, PhD, Principal Medical Director at Roche, Switzerland Adrijana Kekic, PhD, from the Center for Individualised Medicine at Mayo Clinic in Arizona, USA The interviews aim to motivate and guide scientists, particularly those at the beginning of their careers, by showcasing the journeys of accomplished scientists and the diverse paths they have taken to success. These interviews, along with other initiatives dedicated to supporting young researchers, will be available at the Rising Stars Hub. The Rising Stars program was launched in 2015 with a project supporting and promoting the work of young robotics researchers and PhD students. Today, the Hub serves as a valuable resource for all young and aspiring scientists seeking to make a mark in the world. Visit IntechOpen's Rising Stars Hub today to get inspired."
