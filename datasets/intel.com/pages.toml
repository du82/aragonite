full_description = '''window.addEventListener('load', function() { jQuery(document).ready(function () { window.picturefill(); }); }); var intel = intel || {}; intel.globalMasthead = { campaignPath: '', allTeasers: '' }; Intel Public Policy Intel works with governments, organizations and industries around the world to advocate policies that encourage new ideas, promote fair commerce and protect resources. By promoting worldwide innovation, competition and an inclusive society, Intel seeks to help people and businesses thrive in an increasingly global economy. Public Policy Artificial Intelligence Policy Connectivity Policy Cybersecurity Policy Environment and Energy Policy Global Tax Policy Human Rights Policy International and Digital Trade Policy Intellectual Property Policy Privacy Policy Supply Chain Policy Workforce Policy Digital technology is transforming the world at an accelerated pace, driven by what I call the four “superpowers”: cloud, connectivity fueled by 5G, artificial intelligence (AI), and the intelligent edge. Along with customers, partners, governments, and NGOs, we will support smart policies that accelerate the creation of safe and secure digital infrastructure, advanced manufacturing, and an inclusive and skilled future workforce. —Pat Gelsinger, Intel CEO Policy@Intel Policy@Intel is a place to exchange ideas and perspectives promoting a thriving innovation economy through public policy. Read the blogs @IntelPolicy Ideas and perspectives promoting a thriving innovation economy from Intel’s public policy team. See the latest .has-jumplinks:not(.left-side) .jumplinksContainer { min-height: 60px; width: 100%; height: auto } Get Help <link rel="stylesheet" href="/etc.clientlibs/settings/wcm/designs/ver/250217/intel/clientlibs/pages/get-help.min.css" type="text/css">'''
