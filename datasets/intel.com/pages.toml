["https://intel.com/content/www/us/en/corporate-responsibility/corporate-responsibility.html"]
title = "Corporate Social Responsibility"
description = "We continue to raise the bar for ourselves to make greater strides in corporate responsibility, and encourage others to do the same."
full_description = '''window.addEventListener('load', function() { jQuery(document).ready(function () { window.picturefill(); }); }); var intel = intel || {}; intel.globalMasthead = { campaignPath: '', allTeasers: '' }; Corporate Responsibility Is the Foundation of Our Business We continue to raise the bar for ourselves to make greater strides in corporate responsibility, and encourage others to do the same. Our ESG Framework and RISE Strategy Through our unified “One Intel” environmental, social, and governance (ESG) framework, RISE, we aim to create a more responsible, inclusive, and sustainable world, enabled by our technology and the expertise and passion of our employees. Learn more about our RISE ESG Framework Corporate Responsibility Report We are extremely proud of our long-standing leadership in corporate responsibility, sustainability, diversity and inclusion, education initiatives, and philanthropic endeavors. Each May, we release a comprehensive report about our efforts, goals, and performance. Read the latest report Executive Summary Report Get a quick overview of our recent corporate responsibility highlights and strategy. Read the executive summary Find the Information You Need Build a custom report with exactly the information you need and download additional resources like Intel’s GRI index, our UN Global Compact mapping, water and GHG emissions data, political contributions data, past reports, localized reports, and more. Customize your information Show more Show less Global Expansion Update We are investing in geographically balanced manufacturing capacity to strengthen the resilience of the global semiconductor supply chain. In the US, we are expanding existing operations in Arizona, New Mexico, and Oregon, and building a new manufacturing campus in Ohio. We have also announced expansion plans in Ireland, Israel, Germany, and Poland. Read about our construction progress Educating the Workforce of Tomorrow Filling new jobs is critical to the success of the fast-growing semiconductor industry and Intel's IDM 2.0 strategy. To help close the industry's talent gap, Intel is investing in higher education programs around the world. See how we are helping to educate the future workforce Report Highlights Our RISE strategy outlines our approach to corporate responsibility, as well as the measurable goals we’ve set for ourselves. Through RISE, we aim to harness the breadth and scale of our reach to have a positive effect on business, society, and the planet. Our Talent Responsible Inclusive Sustainable Enabling window.addEventListener('load', function() { jQuery(document).ready(function () { window.picturefill(); }); }); A Culture of Excellence Our dynamic workplace is built on execution excellence, results-orientation, and a relentless drive toward continued innovation. Learn about our winning culture window.addEventListener('load', function() { jQuery(document).ready(function () { window.picturefill(); }); }); Sourcing Minerals Responsibly We continue to expand our efforts to map our supply chain to determine the sources of critical minerals used in our products. A key technology industry initiative in our RISE strategy is to significantly expand our impact in responsible minerals and accelerate the creation of new sourcing standards. Learn how we are expanding our impact window.addEventListener('load', function() { jQuery(document).ready(function () { window.picturefill(); }); }); Champions of Accessibility Through our integrated approach to accessibility, we unlock technology to create equitable computing experiences for all. In our workplace, we strive to become a global employer of choice for people with disabilities and those caring for family members with disabilities. Learn about accessibility at Intel › See how we are creating a culture of accessibility window.addEventListener('load', function() { jQuery(document).ready(function () { window.picturefill(); }); }); 10.2 Billion Gallons of Water Saved In 2023, we conserved approximately 10.2 billion gallons of water in our operations and community partnerships and enabled restoration of about 3.1 billion gallons through watershed restoration projects. Learn more about our environmental initiatives › Read more about water stewardship at Intel window.addEventListener('load', function() { jQuery(document).ready(function () { window.picturefill(); }); }); 21.6 Million Hours of Service We create opportunities for our employees to share their technology expertise and other skills with our communities. Since we launched the Intel Involved volunteer program in 1995, our employees have generously donated more than 21.6 million hours of service. Learn more about Intel volunteer programs › See how our employees are strengthening communities Caring for Our Planet We believe that Intel's position in the technology ecosystem, our wide range of technology, and the passion of our employees will help us to make significant progress in building a more sustainable world in the next decade and beyond. Built-In Energy Efficiency With each new generation of products, Intel aims to offer higher performance and improved energy efficiency compared to previous generations, thereby reducing the Scope 3 greenhouse gas emissions of our products in customer applications and overall energy consumption. See how we are helping to make computing sustainable Renewable Electrical Vehicle Charging Intel collaborated with Heysoft Pvt. Ltd. to develop a system that enables electric vehicle chargers to prioritize renewables-based energy when available. The collaboration is one of some 370 Intel RISE Technology Initiative (IRTI) projects that we have funded in 42 countries cumulatively through 2023, using Intel® technology to help solve unique challenges that affect individuals and organizations globally. See how IRTI is activating technology as a force for good Green Bond Update Our first-ever green bond of $1.25 billion aligns our financing priorities with our commitment to sustainable business practices and will help us advance our RISE goals. Read how we are allocating funds Reducing Our Carbon Footprint In 2022, we announced our goal to achieve net-zero greenhouse gas emissions (Scope 1 and 2) across our global operations by 2040. In 2023, we took that goal a step further and committed to work with our value chain to achieve net-zero upstream Scope 3 greenhouse gas emissions by 2050. Learn how we're creating a more sustainable supply chain Show more Show less window.addEventListener('load', function() { jQuery(document).ready(function () { window.picturefill(); }); }); Join the Conversation Be first to hear about new initiatives, see our impact up close, and share your feedback on our corporate responsibility efforts. Follow us on X › Instagram › Read our blog › Contact our corporate responsibility team › Report an ethics or human rights concern › Explore Our Integrated Approach to Corporate Responsibility Our long history of leadership in corporate responsibility is a competitive advantage for our business. Our integrated approach to corporate responsibility and sustainability creates value for Intel and our stockholders by helping us mitigate risks, reduce costs, build brand value, and identify new market opportunities. Read about our strategies, guiding principles, and policies below. Investor Relations We’re dedicated to transparency in investor relations and financial reporting. Investor relations Corporate Governance We’re committed to the highest standards of corporate governance and business ethics. Corporate governance Public Policy We’re devoted to helping people and businesses thrive in an increasingly global economy. Public policy Show more Show less Supplier.Intel.Com We’re working to improve transparency and promote corporate responsibility throughout the global electronics supply chain. Visit supplier.intel.com Sustainable Computing for a Sustainable Future Intel is leveraging its experience and international influence as one of the largest semiconductor designers and manufacturers to move us all toward a future of more sustainable computing. Read our sustainability guidelines ESG Materiality Assessment Process We have conducted formal ESG Materiality Assessments for the past decade, with each assessment building on the one prior. While the formal process is undertaken at least every two years, we consider our Materiality Assessment to be a living document, to be adapted in line with the dynamic environment in which we operate. Learn more about Intel’s ESG materiality assessment process Show more Show less Our Guidelines and Guiding Principles Intel’s Values Our values define who we are and how we act every day as employees and as a company. They speak to everyone within our diverse workforce. Read our values Intel Code of Conduct Our Code of Conduct sets the expectations for integrity and ethics that all employees follow. Read our code of conduct The Responsible Business Alliance (RBA) Intel fully supports the vision and goals of the RBA within our global operations. Read the RBA commitment letter Read our self-assessment questionnaire Intel Political Accountability Guidelines Intel’s policy describes practices, decision processes, and accountability for our political activities. Read our political accountability guidelines Intel Global Human Rights Principles and Approach At Intel, we are committed to maintaining and improving systems and processes to avoid causing or contributing to adverse human rights impacts in our own operations, our supply chain, and our products. Read our human rights principles and approach Read our responsible AI principles Intel Statement on Combating Modern Slavery and Ensuring Transparent Supply Chains Intel is committed to respecting human rights, and we expect our suppliers to respect human rights. Read our statement Intel’s Support of the SDGs We are working to help achieve many of the UN Sustainable Development Goals (SDGs) through our corporate responsibility and sustainability strategies. Review how we support the SDGs Product Content Declaration for REACH Intel goes to great lengths to make sure all our products meet applicable legal requirements, and we continually monitor changes in those requirements. Read our statement Show more Show less Our Policies Intel Corporate Accessibility Policy Intel is committed to a culture of accessibility. We use science and technology to eliminate barriers and empower people. Read our accessibility policy Intel Climate Change Policy Statement Intel led the semiconductor industry in developing the first-ever global industry commitment to address climate change. Read our climate change policy statement Responsible Minerals Sourcing Policy We collaborate to enable products that respect human rights in our operations and our global supply chain. Read the responsible minerals sourcing policy Global Environmental, Health, and Safety Policy Intel is committed to caring for our people and the planet in all aspects of our business. Read our EHS policy Global Water Policy Water is a critical natural resource that is of strategic importance to our business and the communities in which we operate. Read our water policy Quality and Reliability Intel continuously strives to deliver quality and reliability in all its products. Read our quality and reliability paper Intel Energy Policy We are committed to caring for people and the planet from the development of our products, through our supply chain and manufacturing. Read our energy policy Global Tax Policy Intel’s focus on ethical business practices is the foundation of our global tax strategy. Read our global tax policy Show more Show less Our website and the reports, press releases, and other documents provided thereon include claims that relate to our greenhouse gas emissions and environmental initiatives and strategy, including claims regarding greenhouse gas emissions, reductions, efforts, and other environmental aspirations. Information regarding these claims, including third-party limited assurance of our greenhouse gas emissions, is available in our disclosures (including archived reports) on this webpage. .has-jumplinks:not(.left-side) .jumplinksContainer { min-height: 60px; width: 100%; height: auto } Get Help <link rel="stylesheet" href="/etc.clientlibs/settings/wcm/designs/ver/250217/intel/clientlibs/pages/get-help.min.css" type="text/css">'''
