["https://intelligence.org/donate/tax-advantaged-donations"]
title = "Tax-Advantaged Donations - Machine Intelligence Research Institute"
description = "Tax-Advantaged Donations Donations to MIRI are tax-deductible in the USA as a result of our IRS-recognized 501(c)(3) status (EIN:58-2565917). Residents of a number of other countries can also claim tax benefits when supporting us. While we’re not experts in international tax, we’d like to provide some resources here to help our supporters. Select your country/region […]"
full_description = "Tax-Advantaged Donations Donations to MIRI are tax-deductible in the USA as a result of our IRS-recognized 501(c)(3) status (EIN:58-2565917).Residents of a number of other countries can also claim tax benefits when supporting us. While we’re not experts in international tax, we’d like to provide some resources here to help our supporters. Select your country/region to learn more. Netherlands Germany Czechia Switzerland UK EU Canada MIRI has Public Benefit Organization (ANBI) status in the Netherlands, allowing Dutch donors to claim tax relief when donating to MIRI. Please retain a record of our Dutch tax reference number (RSIN#:823958644) when filing your taxes. German tax residents can claim tax benefits when donating amounts over 10,000 EUR to MIRI through effektiveraltruismus.de (auf Deutsch) — please email development@intelligence.org. Czech tax residents can claim tax benefits when donating amounts over 10,000 EUR to MIRI through Effektiv Spenden — please email development@intelligence.org. Swiss tax residents can claim tax benefits when donating amounts over 10,000 EUR to MIRI through effektiveraltruismus.de (auf Deutsch) — please email development@intelligence.org. UK tax-residents are eligible for tax relief when donating to MIRI through Giving What We Can. Donor claims for Gift Aid can additionally help MIRI by up to 25% of your donation.Donations can also be made via Charities Aid Foundation (CAF) which requires donors to open a CAF Charity Account before donating to a list of CAF-verified overseas charities that includes MIRI. Note: CAF’s website is not highly transparent. Additionally, CAF’s CAF American Donor Fund allows individuals (or companies) that pay tax in the USA and the UK to claim tax benefits in both countries when donating to MIRI.Email development@intelligence.org if you’d like additional details.</p/> The European Court of Justice ruling in the Persche case (2009) opened the door for cross-border charity donations within the EU to be tax-deductible for donors resident in countries where charitable donations are tax-advantaged. The ruling’s application across the Union is thus far, highly variable, with a number of donors in some countries (e.g. Denmark and France) reporting that they are now being granted tax benefits for donating to charitable organizations in other EU countries. Tax residents in some other EU countries, however, report that obstacles still exist (e.g. Austria).What implications does this have for donating to MIRI? In theory, donations made to MIRI through effektiveraltruismus.de (under ‘Give Your Donation’, select ‘Machine Intelligence Research Institute’) should confer tax benefits to donors in Germany and other EU countries where tax relief is available on charitable donations. If you are tax-resident in a EU country other than Czechia, Germany or Netherlands and are interested in helping MIRI explore the implications of the above in your tax domain, please contact development@intelligence.org. In recent years, many Canadian tax residents have made tax-effective donations to MIRI via Rethink Charity but, as of July 2023, this channel is paused."
year_published = 2024
year_updated = 2024
