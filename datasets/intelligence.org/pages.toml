["http://intelligence.org/notes/soon"]
title = "Why expect smarter-than-human AI to be developed any time soon? - Machine Intelligence Research Institute"
description = "In 1901, two years before helping build the first heavier-than-air flyer, Wilbur Wright told his brother that powered flight was still fifty years away."
full_description = "In 1901, two years before helping build the first heavier-than-air flyer, Wilbur Wright told his brother that powered flight was still fifty years away. Meanwhile, fusion power has famously been “twenty years away” for the past fifty years. Historically, scientists and engineers have seen far more success saying whether a technology is feasible and saying what the technology will be like, than predicting when a breakthrough will unlock that technology. We consider the timeline to ASI (artificial superintelligence) uncertain, and given the difficulty of timing such developments, we expect it to remain similarly uncertain until ASI is imminent, or until it already exists. If policymakers are to intervene and prevent this technology from being built, then they will need to act before it is entirely clear how much time we have left. That said, our best guess is that the timeline to ASI is probably not long. Recent progress has been sufficiently rapid that we at MIRI would not be surprised if ASI is developed in two or five years, and we would be surprised if it were still more than twenty years away. Recent inventions like ChatGPT have helped bring AI into the public eye, but these inventions don’t represent a once-off breakthrough. Rather, tools like ChatGPT are the latest of a long series of advances. Twenty years ago, researchers argued that ASI was far off because of the many things AI couldn’t do — basic image recognition and generation, translation, Winograd schemas, computer programming, games like Go and StarCraft, and so on. All of those challenges have fallen, with the result that the gap between us and ASI is made mostly of intangibles. While there are still many problems state-of-the-art AI fails on, it has become increasingly common to see people claim that AI will never solve some problem, only to learn that current AI already excels at that task. Progress from current systems to smarter-than-human systems is likely to exhibit threshold effects. Chimpanzees and humans have broadly similar brains, and are only separated by a few million years of evolution; but the results of chimpanzee and human cognition are radically different, because humans happened to cross one or more thresholds that chimpanzees don’t reach."
author = "william"
year_published = 2025
clearnet = "http://intelligence.org/notes/soon"
tags = ["berkeley,", "california", "developed", "expect", "institute", "intelligence", "machine", "newsletter", "research", "smarter-than-human"]
