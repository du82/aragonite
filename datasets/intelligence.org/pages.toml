title = "2020 Updates and Strategy - Machine Intelligence Research Institute"
description = "MIRI’s 2020 has been a year of experimentation and adjustment. In response to the COVID-19 pandemic, we largely moved our operations to more rural areas in March, and shifted to a greater emphasis on remote work. We took the opportunity to try new work set-ups and approaches to research, and have been largely happy with […]"
full_description = '''MIRI’s 2020 has been a year of experimentation and adjustment. In response to the COVID-19 pandemic, we largely moved our operations to more rural areas in March, and shifted to a greater emphasis on remote work. We took the opportunity to try new work set-ups and approaches to research, and have been largely happy with the results. At the same time, 2020 saw limited progress in the research MIRI’s leadership had previously been most excited about: the new research directions we started in 2017. Given our slow progress to date, we are considering a number of possible changes to our strategy, and MIRI’s research leadership is shifting much of their focus toward searching for more promising paths. Last year, I projected that our 2020 budget would be $6.4M–$7.4M, with a point estimate of $6.8M. I now expect that our 2020 spending will be slightly above $7.4M. The increase in spending above my point estimate largely comes from expenses we incurred relocating staff and taking precautions in response to the COVID-19 pandemic. Our budget for 2021 is fairly uncertain, given that we are more likely than usual to see high-level shifts in our strategy in the coming year. My current estimate is that our spending will fall somewhere between $6M and $7.5M, which I expect to roughly break down as follows: new Chart(document.getElementById("2021BudgetChart"), { "type": "pie", "data": { "labels": [ "Research Personnel", "Program Activities", "Cost of Doing Business", "General Personnel" ], "datasets": [{ "label": "2021 Budget Rough Breakdown", "data": [50, 5, 25, 20], "backgroundColor": [ "rgb(43, 77, 118)", "rgb(224, 235, 246)", "rgb(202, 223, 184)", "rgb(94, 129, 63)" ], "datalabels": { "anchor": "end", "align": "end", "formatter": function(value, context) { var label = context.chart.data.labels[context.dataIndex]; return label + "\n" + value + "%"; } } }] }, "options":{ "rotation": 0.5 * Math.PI, "animation": { "animateRotate": true, }, "legend": { "display"