["https://intelligence.org/2013/12/31/7-new-technical-reports-and-a-new-paper"]
title = "7 New Technical Reports, and a New Paper - Machine Intelligence Research Institute"
description = "Recently, MIRI released 7 brief technical reports that explain several pieces of theoretical progress made at our December 2013 research workshop. Several of these results build on work done at our July and November 2013 workshops, and also on between-workshop research by Paul Christiano, Benja Fallenstein, and others. To understand these technical reports in context, […]"
full_description = "Recently, MIRI released 7 brief technical reports that explain several pieces of theoretical progress made at our December 2013 research workshop. Several of these results build on work done at our July and November 2013 workshops, and also on between-workshop research by Paul Christiano, Benja Fallenstein, and others. To understand these technical reports in context, and to discuss them, please see Benja Fallenstein’s post: Results from MIRI’s December workshop. See also two posts about the workshop by workshop participant John Baez. Also, Nik Weaver attended the first day of the workshop, and gave a tutorial on his response paper to Yudkowsky & Herreshoff’s tiling agents paper, titled “Paradoxes of rational agency and formal systems that verify their own soundness.” Benja Fallenstein’s comments on Weaver’s idea of “naturalistic trust” are here: Naturalistic trust among AIs."
author = "Luke Muehlhauser"
