["https://intelligence.org/files/RobustCooperation.pdf"]
title = "[1401.5577] Robust Cooperation in the Prisoner's Dilemma: Program Equilibrium via Provability Logic"
description = '''We consider the one-shot Prisoner's Dilemma between algorithms with read-access to one anothers' source codes, and we use the modal logic of provability to build agents that can achieve mutual cooperation in a manner that is robust, in that cooperation does not require exact equality of the agents' source code, and unexploitable, meaning that such an agent never cooperates when its opponent defects. We construct a general framework for such "modal agents", and study their properties.'''
full_description = '''Computer Science > Computer Science and Game Theory arXiv:1401.5577 (cs) [Submitted on 22 Jan 2014 (v1), last revised 5 Apr 2021 (this version, v2)] Title:Robust Cooperation in the Prisoner's Dilemma: Program Equilibrium via Provability Logic Authors:Mihaly Barasz, Paul Christiano, Benja Fallenstein, Marcello Herreshoff, Patrick LaVictoire, Eliezer Yudkowsky View a PDF of the paper titled Robust Cooperation in the Prisoner's Dilemma: Program Equilibrium via Provability Logic, by Mihaly Barasz and 5 other authors View PDF Abstract:We consider the one-shot Prisoner's Dilemma between algorithms with read-access to one anothers' source codes, and we use the modal logic of provability to build agents that can achieve mutual cooperation in a manner that is robust, in that cooperation does not require exact equality of the agents' source code, and unexploitable, meaning that such an agent never cooperates when its opponent defects. We construct a general framework for such "modal agents", and study their properties. Comments: 18 pages. Updated 2021 to indicate that bounded analogues of these results have yet to be proved Subjects: Computer Science and Game Theory (cs.GT); Logic in Computer Science (cs.LO) ACM classes: F.4.1 Cite as: arXiv:1401.5577 [cs.GT] (or arXiv:1401.5577v2 [cs.GT] for this version) https://doi.org/10.48550/arXiv.1401.5577 Focus to learn more arXiv-issued DOI via DataCite Submission history From: Patrick LaVictoire [view email] [v1] Wed, 22 Jan 2014 07:39:52 UTC (18 KB) [v2] Mon, 5 Apr 2021 01:26:49 UTC (18 KB) Full-text links: Access Paper: View a PDF of the paper titled Robust Cooperation in the Prisoner's Dilemma: Program Equilibrium via Provability Logic, by Mihaly Barasz and 5 other authorsView PDFTeX SourceOther Formats view license Current browse context: cs.GT < prev | next > new | recent | 2014-01 Change to browse by: cs cs.LO References & Citations NASA ADSGoogle Scholar Semantic Scholar 1 blog link (what is this?) DBLP 