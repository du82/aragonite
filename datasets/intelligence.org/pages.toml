["https://intelligence.org/2021/11/18/ngo-and-yudkowsky-on-ai-capability-gains"]
title = "Ngo and Yudkowsky on AI capability gains - Machine Intelligence Research Institute"
description = "This is the second post in a series of transcribed conversations about AGI forecasting and alignment. See the first post for prefaces and more information about the format. Color key:  Chat by Richard and Eliezer   Other chat   Google Doc content   Inline comments      5. September 14 conversation   5.1. Recursive self-improvement, abstractions, and […]"
full_description = "This is the second post in a series of transcribed conversations about AGI forecasting and alignment. See the first post for prefaces and more information about the format. So it seems like the obvious thread to pull today is your sense that I’m wrong about recursive self-improvement and consequentialism in a related way? Right. And then another potential thread (probably of secondary importance) is the question of what you mean by utility functions, and digging more into the intuitions surrounding those. I claim that your early writings about RSI focused too much on a very powerful abstraction, of recursively applied optimisation; and too little on the ways in which even powerful abstractions like this one become a bit… let’s say messier, when they interact with the real world. In particular, I think that Paul’s arguments that there will be substantial progress in AI in the leadup to a RSI-driven takeoff are pretty strong ones. (Just so we’re on the same page: to what extent did those arguments end up shifting your credences?) I don’t remember being shifted by Paul on this at all. I sure shifted a lot over events like Alpha Zero and the entire deep learning revolution. What does Paul say that isn’t encapsulated in that update – does he furthermore claim that we’re going to get fully smarter-than-human in all regards AI which doesn’t cognitively scale much further either through more compute or through RSI? I’ll also remark that I see my foreseeable mistake there as having little to do with “abstractions becoming messier when they interact with the real world” – this truism tells you very little of itself, unless you can predict directional shifts in other variables just by contemplating the unknown messiness relative to the abstraction. Rather, I’d see it as a neighboring error to what I’ve called the Law of Earlier Failure, where the Law of Earlier Failure says that, compared to the interesting part of the problem where it’s fun to imagine yourself failing, you usually fail before then, because of the many earlier boring points where it’s possible to fail."
author = "Rob Bensinger"
year_published = 2021
year_updated = 2021
