["https://intelligence.org/2024/09/23/the-sun-is-big-but-superintelligences-will-not-spare-earth-a-little-sunlight"]
title = "The Sun is big, but superintelligences will not spare Earth a little sunlight - Machine Intelligence Research Institute"
description = "Crossposted from Twitter with Eliezer’s permission i. A common claim among e/accs is that, since the solar system is big, Earth will be left alone by superintelligences. A simple rejoinder is that just because Bernard Arnault has $170 billion, does not mean that he’ll give you $77.18. Earth subtends only 4.54e-10 = 0.0000000454% of the angular area […]"
full_description = "A common claim among e/accs is that, since the solar system is big, Earth will be left alone by superintelligences. A simple rejoinder is that just because Bernard Arnault has $170 billion, does not mean that he’ll give you $77.18. Earth subtends only 4.54e-10 = 0.0000000454% of the angular area around the Sun, according to GPT-o1.1 Asking an ASI to leave a hole in a Dyson Shell, so that Earth could get some sunlight not transformed to infrared, would cost It 4.5e-10 of Its income. But wouldn’t humanity be able to trade with ASIs, and pay Them to give us sunlight? This is like planning to get $77 from Bernard Arnalt by selling him an Oreo cookie. There’s a basic rule in economics, Ricardo’s Law of Comparative Advantage, which shows that even if the country of Freedonia is more productive in every way than the country of Sylvania, both countries still benefit from trading with each other. But if Freedonia spends 8 hours of labor to produce 30 hotdog buns, and trades them for 15 hotdogs from Sylvania: Both countries are better off from trading, even though Freedonia was more productive in creating every article being traded! Midwits are often very impressed with themselves for knowing a fancy economic rule like Ricardo’s Law of Comparative Advantage! To be fair, even smart people sometimes take pride that humanity knows it. It’s a great noble truth that was missed by a lot of earlier civilizations. The thing about midwits is that they (a) overapply what they know, and (b) imagine that anyone who disagrees with them must not know this glorious advanced truth that they have learned. Ricardo’s Law doesn’t say (alas!) that — when Europe encounters a new continent — Europe can become selfishly wealthier by peacefully trading with the Native Americans, and leaving them their land. Comparative Advantage doesn’t imply that Earth can produce more with $77 of sunlight, than a superintelligence can produce with $77 of sunlight, in goods and services valued by superintelligences. It would actually be rather odd if this were the case!"
author = "Eliezer Yudkowsky"
year_published = 2024
year_updated = 2025
