description = "Eliezer Yudkowsky is a decision theorist who is widely cited for his writings on the long-term future of artificial intelligence. His views on the social and"
full_description = "Eliezer Yudkowsky is a decision theorist who is widely cited for his writings on the long-term future of artificial intelligence. His views on the social and philosophical significance of AI have had a major impact on ongoing debates in the field, and as MIRI’s senior research fellow, his work in mathematical logic has heavily shaped MIRI’s research agenda. He is the author of the Cambridge Handbook of Artificial Intelligence chapter “The Ethics of Artificial Intelligence” with Nick Bostrom (2014), and has written a number of popular introductions to the science of human rationality."
