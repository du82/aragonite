["https://intelligence.org/2023/10/10/announcing-miris-new-ceo-and-leadership-team"]
title = "Announcing MIRI’s new CEO and leadership team - Machine Intelligence Research Institute"
description = "In 2023, MIRI has shifted focus in the direction of broad public communication—see, for example, our recent TED talk, our piece in TIME magazine “Pausing AI Developments Isn’t Enough. We Need to Shut it All Down”, and our appearances on various podcasts. While we’re continuing to support various technical research programs at MIRI, this is […]"
full_description = "Coinciding with this shift in focus, there have also been many organizational changes at MIRI over the last several months, and we are somewhat overdue to announce them in public. The big changes are as follows: This change is in large part an enshrinement of the status quo. Malo’s been doing a fine job running MIRI day-to-day for many many years (including feats like acquiring a rural residence for all staff who wanted to avoid cities during COVID, and getting that venue running smoothly). In recent years, morale has been low and I, at least, haven’t seen many hopeful paths before us. That has changed somewhat over the past year or so, with a heightened awareness of AI across-the-board opening up new social and political possibilities. I think that Malo’s better-positioned to take advantage of many of those than I would have been. I’m also hoping that he’s able to pull off even more impressive feats (and more regularly) now that he is in the top executive role. In addition to these changes, we’ve also made two new senior staff hires to better manage, coordinate, and support MIRI’s work in our two main focus areas: We’re hopeful that this new organizational structure will enable us to execute on our priorities more effectively and, with considerable luck, move the needle on existential risk from AI. There’s a lot more we hope to say about our new (and still evolving) strategy, and about our general thinking on the world’s (generally very dire) situation. But I don’t want those announcements to further delay sharing the above updates, so I’ve factored our 2023 strategy updates into multiple posts, beginning with this one.2"
author = "Gretta Duleba"
year_published = 2023
year_updated = 2023
