["https://intelligence.org/team/aaron-scher"]
title = "Aaron Scher - Machine Intelligence Research Institute"
description = "Aaron’s research at MIRI is focused on International Coordination on AI, with an emphasis on Verification Mechanisms. He earned his Bachelor’s degree in"
full_description = "Aaron’s research at MIRI is focused on International Coordination on AI, with an emphasis on Verification Mechanisms. He earned his Bachelor’s degree in psychology from Pitzer College in 2022 and quickly transitioned to working in AI safety. After a year of up-skilling and helping grow the field, Aaron started doing independent AI alignment research with the MATS program in summer 2023. He later managed 4 research teams through SPAR, the Supervised Program in Alignment Research working on sycophancy and interpretability. Aaron joined the Technical Governance Team in July 2024."
