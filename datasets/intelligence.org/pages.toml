description = "Singularity Summit An Annual Conference onScience, Technology, and the Future Update! Singularity University has acquired the Singularity Summit! Read more here. The Singularity Summit is an annual conference on science, technology, and the future co-produced by MIRI and Singularity University. Topics explored include artificial intelligence, brain-computer interfaces, the Singularity, robotics, regenerative medicine, and big picture issues on […]"
full_description = "Singularity Summit An Annual Conference onScience, Technology, and the Future Update! Singularity University has acquired the Singularity Summit! Read more here. The Singularity Summit is an annual conference on science, technology, and the future co-produced by MIRI and Singularity University. Topics explored include artificial intelligence, brain-computer interfaces, the Singularity, robotics, regenerative medicine, and big picture issues on the trajectory of human civilization. Each year, about 25 eminent speakers share their latest views over the course of two days.The conference was founded by MIRI, Ray Kurzweil, and Peter Thiel in 2006. The inaugural conference was held in 2006 at Stanford University. Until 2008 the conference was held in the San Francisco Bay Area, at which point it began alternating between New York (where the conference was held in 2009 and 2011) and the Bay Area. The event regularly attracts over 800 scientists, entrepreneurs, academics, and other thinkers. In 2010, it was covered in a front-page article in TIME magazine.Past speakers at Singularity Summit include inventor and futurist Ray Kurzweil, philosophers David Chalmers and Nick Bostrom, nanotechnology pioneer Eric Drexler, author and scientist Douglas Hofstadter, Paypal co-founder Peter Thiel, Sebastian Thrun of Google’s driverless car, roboticist Rodney Brooks, AI researcher Peter Norvig, Intel CTO Justin Rattner, X Prize Foundation CEO Peter Diamandis, Mathematica and Wolfram Alpha creator Stephen Wolfram, economist Robin Hanson, physicist Max Tegmark, and author Michael Shermer. Summit 2012 Singularity Summit: Opening Remarks with Nathan Labenz [mp3]Temple Grandin: How Different People Think Differently [mp3] [transcript]Thiel Fellows: Olah, Deming & Other Thiel Fellows [mp3] [transcript]Julia Galef: Rationality and the Future [mp3] [transcript]Luke Muehlhauser: The Singularity, Promise and Peril [mp3] [transcript]Linda Avey: Personal Genomics [mp3] [transcri