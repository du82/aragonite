description = "Research Workshops While we do not currently have any upcoming workshops scheduled, there are other ways to get involved. Learn More July 20–22, 2018 – Berkeley, California 2nd Workshop on Approaches in AI Alignment CHAI ParticipantsJordan AlexanderLawrence ChanJames DrainAaron TuckerAlex Turner Unaffiliated ParticipantsAlex Gunning MIRI ParticipantsAlex AppelDaniel DemskiEvan HubingerLinda LinseforsAlex MennenDavid SimmonsAlex Zhu This weekend […]"
full_description = "Research Workshops While we do not currently have any upcoming workshops scheduled, there are other ways to get involved. Learn More July 20–22, 2018 – Berkeley, California 2nd Workshop on Approaches in AI Alignment CHAI ParticipantsJordan AlexanderLawrence ChanJames DrainAaron TuckerAlex TurnerUnaffiliated ParticipantsAlex Gunning MIRI ParticipantsAlex AppelDaniel DemskiEvan HubingerLinda LinseforsAlex MennenDavid SimmonsAlex Zhu This weekend workshop brought together research interns from MIRI and UC Berkeley’s Center for Human-Compatible AI (CHAI) to discuss conceptual foundations and open problems in AI safety research. November 18–19, 2017 – Berkeley, California 1st Workshop on Approaches in AI Alignment Tsvi Benson-Tilsen (MIRI)Paul Christiano (OpenAI)Andrew Critch (UC Berkeley)Wei Dai (independent)Abram Demski (MIRI) Sam Eisenstat (MIRI)Scott Garrabrant (MIRI)Richard Mallah (FLI, Cambridge Semantics)Andreas Stuhlmüller (Stanford)Jessica Taylor (independent) This weekend workshop brought together researchers interested in understanding and exploring the intersection between MIRI’s Agent Foundations research agenda and Paul Christiano’s research. April 1-2, 2017 – Berkeley, California 4th Workshop on Machine Learning and AI Safety Tsvi Benson-Tilsen (MIRI)Paul Christiano (OpenAI)Andrew Critch (UC Berkeley)Wei Dai (independent)Abram Demski (MIRI) Sam Eisenstat (MIRI)Scott Garrabrant (MIRI)Richard Mallah (FLI, Cambridge Semantics)Andreas Stuhlmüller (Stanford)Jessica Taylor (independent) This workshop brought together researchers with machine learning backgrounds to work on long-term AI safety problems that can be modeled in current machine learning systems and frameworks, for instance those described in “Concrete Problems in AI Safety” and “Alignment for Advanced Machine Learning Systems”.This workshop was funded in part by a grant from the Artificial Intelligence Journal. March 25–26, 2017 – Berkeley, California Workshop on Agent Foundations and AI Safety Alexander Appel (University of Nevada Reno)Michael Dennis (UC Berkeley)Sam Eisenstat (Google)Matt FrankScott Garrabrant (MIRI) Juan David Gil (MIT)Patrick LaVictoire (MIRI)Eliana Lorch (Thiel Fellow)Eli SenneshHarry Slatyer (Google)Alex Zhu This two-day weekend workshop brought together researchers with interests in long-term theoretical AI safety research. The workshop covered the context and content of current AI safety research agendas and projects (with a focus on MIRI’s Agent Foundations technical agenda). It was geared for researchers who have technical backgrounds and who have not previously worked extensively with MIRI. December 1-3, 2016 – Berkeley, California 3rd Workshop on Machine Learning and AI Safety Ryan Carey (MIRI)Cameron Freer (Gamalon and Borelian)Scott Garrabrant (MIRI)Marcello Herreshoff (Google)Patrick LaVictoire (MIRI) Moshe Looks (Google)Jeremy Nixon (Spark)Anand Srinivasan (AlphaSheets)Jessica Taylor (MIRI)Eliezer Yudkowsky (MIRI) This small three-day workshop brought together researchers with machine learning backgrounds to work on long-term AI safety problems that can be modeled in current machine learning systems and frameworks, for instance those described in “Concrete Problems in AI Safety” and “Alignment for Advanced Machine Learning Systems”.Topics included zero-shot learning using shared embeddings, the differences between quantilization and regularization, generative adversarial networks and Goodhart’s Law, and mathematical formalizations of conservative concept learning. November 11-13, 2016 – Berkeley, California 9th Workshop on Logic, Probability, and Reflection Tsvi Benson-Tilsen (UC Berkeley)Ryan Carey (MIRI)Andrew Critch (MIRI)Abram Demski (USC)Sam Eisenstat (UC Berkeley)Benya Fallenstein (MIRI) Jack GallagherScott Garrabrant (MIRI)Marcello Herreshoff (Google)Patrick LaVictoire (MIRI)Nisan Stiennon (Google)Jessica Taylor (MIRI)Alex Zhu (MIT) Participants at this three-day workshop — most of them veterans of past workshops — worked on a variety of problems related to MIRI’s Agent Foundations technical agenda.Topics included safe exploration in rich domains, the difference between predicting a human and predicting HCH, and decision theories resulting from other decision theories self-modifying. October 21-23, 2016 – Berkeley, California 2nd Workshop on Machine Learning and AI Safety Ryan Carey (MIRI)Sarah ConstantinScott Garrabrant (MIRI)Marcello Herreshoff (Google) Patrick LaVictoire (MIRI)William Saunders (Google)Jessica Taylor (MIRI)Eliezer Yudkowsky (MIRI) This small three-day workshop brought together researchers with machine learning backgrounds to work on long-term AI safety problems that can be modeled in current machine learning systems and frameworks, for instance those described in “Concrete Problems in AI Safety” and “Alignment for Advanced Machine Learning Systems”.Topics included concept learning with different ontologies, problems for Task AGI, censored representations, and conservative concepts. August 26-28, 2016 – Berkeley, California 1st Workshop on Machine Learning and AI Safety Paul Christiano (UC Berkeley)Daniel Filan (UC Berkeley)Cameron Freer (Gamalon and Borelian)Dylan Hadfield-Menell (UC Berkeley)Victoria Krakovna (Harvard) Janos Kramar (University of Montreal)Patrick LaVictoire (MIRI)Jelena Luketina (University of Montreal)Richard Mallah (FLI, Cambridge Semantics)Jessica Taylor (MIRI)Eliezer Yudkowsky (MIRI) This three-day workshop brought together researchers with machine learning backgrounds to work on long-term AI safety problems that can be modeled in current machine learning systems and frameworks, for instance those described in “Concrete Problems in AI Safety” and “Alignment for Advanced Machine Learning Systems”.Topics included learning human-interpretable and causal models of the environment; engineering cost functions based on impact measures to disincentivize side effects; designing robust metrics for the quality of a purported explanation of a plan; and developing a formal model of Goodhart’s Law which yields mild optimization. June 17, 2016 – Berkeley, California CSRBAI Workshop on Agent Models and Multi-Agent Dilemmas Twenty participants attended from institutions including: USC Institute for Creative TechnologiesCarleton UniversityFuture of Humanity InstituteCarnegie Mellon UniversityHarvardOxford University University College LondonAustralian National UniversityUC BerkeleyUT AustinPrinceton UniversityColumbia University The Colloquium Series on Robust and Beneficial AI included a series of workshops to facilitate conversations and collaborations between people interested in a number of different approaches to the technical challenges associated with AI robustness and reliability.The fourth workshop of CSRBAI focused on the topics of designing agents that behave well in their environments, without ignoring the effects of the agent’s own actions on the environment or on other agents within the environment. June 11-12, 2016 – Berkeley, California CSRBAI Workshop on Preference Specification Twenty participants attended from institutions including: Australian National UniversityUniversity College LondonCenter for the Study of Existential RiskUniversity of OxfordFuture of Humanity InstituteCarnegie Mellon University The Swiss AI Lab IDSIAAustralian National UniversityUC BerkeleyBrown UniversityUniversity of MontrealUSC Institute for Creative Technologies The Colloquium Series on Robust and Beneficial AI included a series of workshops to facilitate conversations and collaborations between people interested in a number of different approaches to the technical challenges associated with AI robustness and reliability.The third workshop of CSRBAI focused on the topic of preference specification for highly capable AI systems, in which the perennial problem of wanting code to “do what I mean, not what I said” becomes increasingly challenging. June 4-5, 2016 – Berkeley, California CSRBAI Workshop on Robustness and Error-Tolerance Fourteen participants attended from institutions including: University College LondonCenter for the Study of Existential RiskGoogleFuture of Humanity InstituteCarnegie Mellon University Australian National UniversityUC BerkeleyThe Swiss AI Lab IDSIACornell UniversityUSC Institute for Creative Technologies The Colloquium Series on Robust and Beneficial AI included a series of workshops to facilitate conversations and collaborations between people interested in a number of different approaches to the technical challenges associated with AI robustness and reliability.The second workshop of CSRBAI focused on the topic of robustness and error-tolerance in AI systems, and how to ensure that when AI system fail, they fail gracefully and detectably. May 28-29, 2016 – Berkeley, California CSRBAI Workshop on Transparency Twenty participants attended from institutions including: Oregon State UniversityAustralian National UniversityFuture of Humanity InstituteCarnegie Mellon UniversityIBM ResearchMontreal Institute for Learning Algorithms Google ResearchStanford UniversityGoogleUC BerkeleyUniversity College LondonHarvardFuture of Life Institute The Colloquium Series on Robust and Beneficial AI included a series of workshops to facilitate conversations and collaborations between people interested in a number of different approaches to the technical challenges associated with AI robustness and reliability.The first workshop of CSRBAI focused on the topic of transparency in AI systems, and how we can increase transparency while maintaining capabilities. April 1-3, 2016 – Berkeley, California Self-Reference, Type Theory, and Formal Verification Miëtek Bak (Least Fixed)Benya Fallenstein (MIRI)Jack Gallagher (Gallabytes)Jason Gross (MIT) Ramana Kumar (Cambridge)Patrick LaVictoire (MIRI)Daniel Selsam (Stanford)Nathaniel Thomas (Stanford) Participants worked on questions of self-reference in type theory and automated theorem provers, with the goal of studying systems that model themselves. April 1-3, 2016 – Berkeley, California Self-Reference, Type Theory, and Formal Verification Miëtek Bak (Least Fixed)Benya Fallenstein (MIRI)Jack Gallagher (Gallabytes)Jason Gross (MIT) Ramana Kumar (Cambridge)Patrick LaVictoire (MIRI)Daniel Selsam (Stanford)Nathaniel Thomas (Stanford) Participants worked on questions of self-reference in type theory and automated theorem provers, with the goal of studying systems that model themselves. August 28-30, 2015 – Berkeley, California 3rd Introductory Workshop on Logical Decision Theory Holger Dell (Saarland University)Owain Evans (MIT)Benya Fallenstein (MIRI)Benjamin Fox (Israel Defense Forces)Patrick LaVictoire (MIRI) Jonathan Lee (Cambridge)Ben Levinstein (Oxford)Jelena Luketina (Aalto)David Steinberg (U Maryland)Nate Soares (MIRI)Eliezer Yudkowsky (MIRI) This was the sixth in a series of introductory workshops, where MIRI brought together researchers with different backgrounds, discussed open problems in one of the technical agenda topics, and began projects and collaborations in that area.The topic of this workshop was decision theory, and projects begun at the workshop are discussed in the following post: Proof Length and Logical Counterfactuals Revisited August 7–9, 2015 – Berkeley, California 2nd Introductory Workshop on Logical Uncertainty Pedro Carvalho (Instituto Superior Técnico)Adele Dewey-Lopez (SEED Platform Inc.)Benya Fallenstein (MIRI)John Fox (Oxford)Robert Krzyzanowski (UIC) Patrick LaVictoire (MIRI)Michele Reilly (Turing Inc.)Nate Soares (MIRI)Nathaniel Thomas (Stanford)Michael Westmoreland (Denison)Eliezer Yudkowsky (MIRI) This was the fifth in a series of introductory workshops, where MIRI brought together researchers with different backgrounds, discussed open problems in one of the technical agenda topics, and began projects and collaborations in that area.The topic of this workshop was logical uncertainty, and projects begun at the workshop are discussed in the following post: What’s logical coherence for anyway? June 26–28, 2015 – Berkeley, California 1st Introductory Workshop on Vingean Reflection Siddharth Bhaskar (UCLA)Justin Brody (Goucher College)Abram Demski (USC)Benya Fallenstein (MIRI)Roko Jelavić (Ericsson)Seth Kurtenbach (U Missouri) Patrick LaVictoire (MIRI)Kenneth Presting (Renaissance Computing Institute)Jess Riedel (Perimeter Institute)Nate Soares (MIRI)Eliezer Yudkowsky (MIRI) This was the fourth in a series of introductory workshops, where MIRI brought together researchers with different backgrounds, discussed open problems in one of the technical agenda topics, and began projects and collaborations in that area.The topic of this workshop was Vingean reflection, and projects begun at the workshop are discussed in the following posts:Vingean Reflection: Open ProblemsRelating Modal Polymorphism to PA with soundnessWaterfall Truth Predicates June 12–14, 2015 – Berkeley, California 2nd Introductory Workshop on Logical Decision Theory Manav Bhushan (Oxford)Paul Crowley (Google)Benya Fallenstein (MIRI)Preston Greene (NTU)Jason Gross (MIT)Nick Hay (UC Berkeley) Victoria Krakovna (Harvard)Patrick LaVictoire (MIRI)Jan Leike (Australian National University)Nate Soares (MIRI)Eliezer Yudkowsky (MIRI) This was the third in a series of introductory workshops, where MIRI brought together researchers with different backgrounds, discussed open problems in one of the technical agenda topics, and began projects and collaborations in that area.The topic of this workshop was decision theory, and projects begun at the workshop are discussed in the following post: Fixed point theorem in the finite and infinite case May 29–31, 2015 – Berkeley, California 1st Introductory Workshop on Logical Uncertainty Sarah Constantin (Yale)Benya Fallenstein (MIRI)Jacob Hilton (University of Leeds)Vanessa Kosoy (Metaqube)Janos Kramar (Independent)Patrick LaVictoire (MIRI) Shivaram Lingamneni (UC Berkeley)Quinn Maurmann (Quidsi)Nate Soares (MIRI)Charlie S