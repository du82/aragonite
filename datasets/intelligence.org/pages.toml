full_description = "Lisa research leads the technical governance team, which she founded in February 2024 after joining MIRI as research manager in summer 2023. At MIRI Lisa focuses on concrete proposals for AI regulation, AI security and Verification Mechanisms. She is a Foresight Fellow in Intelligent Cooperation, mentors for MATS, and advises on Foresight AI Safety grants. Before MIRI, Lisa was an empirical researcher at MATS mentored by Alex Turner, during which they pioneered the technique of activation steering. Her education includes a BSc in Computer Science from TUM, graduate studies in Machine Learning and Reinforcement Learning for robotics at the Georgia Institute of Technology, and some coursework in medicine and neuroscience. Lisa also holds an honors degree in Technology Management and Entrepreneurship. Her current research focus includes AI Security, Verification mechanisms for coordination, and an ongoing (side) interest in whole brain emulation."
