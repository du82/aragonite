["https://intelligence.org/2017/02/28/using-machine-learning"]
title = "Using machine learning to address AI risk - Machine Intelligence Research Institute"
description = "At the EA Global 2016 conference, I gave a talk on “Using Machine Learning to Address AI Risk”: It is plausible that future artificial general intelligence systems will share many qualities in common with present-day machine learning systems. If so, how could we ensure that these systems robustly act as intended? We discuss the technical […]"
full_description = "It is plausible that future artificial general intelligence systems will share many qualities in common with present-day machine learning systems. If so, how could we ensure that these systems robustly act as intended? We discuss the technical agenda for a new project at MIRI focused on this question. The talk serves as a quick survey (for a general audience) of the kinds of technical problems we’re working on under the “Alignment for Advanced ML Systems” research agenda. Included below is a version of the talk in blog post form. ((I also gave a version of this talk at the MIRI/FHI Colloquium on Robust and Beneficial AI.)) 2.1. Actions are hard to evaluate 2.2. Ambiguous test examples 2.3. Difficulty imitating human behavior 2.4. Difficulty specifying goals about the real world 2.5. Negative side-effects 2.6. Edge cases that still satisfy the goal This talk is about a new research agenda aimed at using machine learning to make AI systems safe even at very high capability levels. I’ll begin by summarizing the goal of the research agenda, and then go into more depth on six problem classes we’re focusing on. The goal statement for this technical agenda is that we want to know how to train a smarter-than-human AI system to perform one or more large-scale, useful tasks in the world. I’m not confident that all three of these assumptions are true, but I think they’re plausible enough to deserve about as much attention from the AI community as the likeliest alternative scenarios. A task-directed AI system is a system that pursues a semi-concrete objective in the world, like “build a million houses” or “cure cancer.” For those who have read Superintelligence, task-directed AI is similar to the idea of genie AI. Although these tasks are kind of fuzzy — there’s probably a lot of work you’d need to do to clarify what it really means to build a million houses, or what counts as a good house — they’re at least somewhat concrete. An example of an AGI system that isn’t task-directed would be one with a goal like “learn human values and do things humans would consider good upon sufficient reflection.” This is too abstract to count as a “task” in the sense we mean; it doesn’t directly cash out in things in the world."
author = "Jessica Taylor"
year_published = 2017
year_updated = 2017
clearnet = "https://intelligence.org/2017/02/28/using-machine-learning"
tags = ["address", "agenda", "agendas", "ambiguity", "berkeley,", "browse", "california", "capable", "details", "follow"]
