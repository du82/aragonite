["https://intelligence.org/2019/12/02/miris-2019-fundraiser"]
title = "MIRI's 2019 Fundraiser - Machine Intelligence Research Institute"
description = "MIRI’s 2019 fundraiser is concluded. Over the past two years, huge donor support has helped us double the size of our AI alignment research team. Hitting our $1M fundraising goal this month will put us in a great position to continue our growth in 2020 and beyond, recruiting as many brilliant minds as possible to […]"
full_description = '''Over the past two years, huge donor support has helped us double the size of our AI alignment research team. Hitting our $1M fundraising goal this month will put us in a great position to continue our growth in 2020 and beyond, recruiting as many brilliant minds as possible to take on what appear to us to be the central technical obstacles to alignment. Our fundraiser progress, updated in real time (including donations and matches made during the Facebook Giving Tuesday event): MIRI is a CS/math research group with a goal of understanding how to reliably “aim” future general-purpose AI systems at known goals. For an introduction to this research area, see Ensuring Smarter-Than-Human Intelligence Has A Positive Outcome and Risks from Learned Optimization in Advanced Machine Learning Systems. For background on how we approach the problem, see 2018 Update: Our New Research Directions and Embedded Agency. At the end of 2017, we announced plans to substantially grow our research team, with a goal of hiring “around ten new research staff over the next two years.” Two years later, I’m happy to report that we’re up eight research staff, and we have a ninth starting in February of next year, which will bring our total research team size to 20. ((This number includes a new staff member who is currently doing a 6-month trial with us.)) We remain excited about our current research directions, and continue to feel that we could make progress on them more quickly by adding additional researchers and engineers to the team. As such, our main organizational priorities remain the same: push forward on our research directions, and grow the research team to accelerate our progress. While we’re quite uncertain about how large we’ll ultimately want to grow, we plan to continue growing the research team at a similar rate over the next two years, and so expect to add around ten more research staff by the end of 2021. Our projected budget for 2020 is $6.4M–$7.4M, with a point estimate of $6.8M, ((These estimates were generated using a model similar to the one I used last year. For more details see our 2018 fundraiser post.)) up from around $6M this year. ((This falls outside the $4.4M–$5.5M range I estimated in our 2018 fundraiser post, but is in line with the higher end of revised estimates we made internally in Q1 2019.)) In the mainline-growth scenario, we expect our budget to look something like this: new Chart(document.getElementById("2020BudgetChart"), { "type": "pie", "data": { "labels": [ "Research Personnel", "Future Research Personnel", "Program Activities", "Cost of Doing Business", "General Personnel" ], "datasets": [{ "label": "2020 Mainline Budget Estimate", "data": [3560, 510, 400, 800, 1400], "backgroundColor": [ "rgb(43, 77, 118)", "rgb(65, 116, 177)", "rgb(224, 235, 246)", "rgb(202, 223, 184)", "rgb(94, 129, 63)" ], "datalabels": { "anchor": "end", "align": "end", "formatter": function(value, context) { var label = context.chart.data.labels[context.dataIndex]; return label + "\n" + value + "k"; } } }] }, "options":{ "rotation": 0.43 * Math.PI, "animation": { "animateRotate": true, }, "legend": { "display": false }, "layout": { "padding": { "top": 0, "bottom": 20 } }, "aspectRatio": 1.75, "defaultFontFamily": "'Source Sans Pro', Helvetica, Arial, sans-serif", "tooltips": { "enabled": false }, "title": { "display": true, "padding": 40, "fontSize": 17.5, "fontColor": "#2e3f51", "text": "2020 Budget Estimate (Mainline)" } } });'''
