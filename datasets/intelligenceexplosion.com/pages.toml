description = "огда-нибудь, уже в этом столетии, машины превзойдут человека в плане интеллекта и возможностей. Это событие, уже получившее название «Сингулярность» станет самым важным в нашей с вами истории, а мудрое управление этим событием будет самым важным, что суждено нам когда-либо сделать.… continue reading »"
full_description = "Оглавление Когда-нибудь, уже в этом столетии, машины превзойдут человека в плане интеллекта и возможностей. Это событие, уже получившее название «Сингулярность» станет самым важным в нашей с вами истории, а мудрое управление этим событием будет самым важным, что суждено нам когда-либо сделать. Многие светлые умы, от Алана Тьюринга (Alan Turing) и Джека Гуда (Jack Good) до Билла Джоя (Bill Joy) и Стивена Хокинга (Stephen Hawking), предупреждали нас об этом. И это событие не зависит от того, насколько распространено особое мнение Рэя Курцвейла (Ray Kurzweil) о Сингулярности как об «ускоряющихся изменениях». Почему я считаю, что Хокинг и компания правы? Что нам стоит предпринять по этому поводу? Статья, озаглавленная «Перед лицом Сингулярности», представляет собой мою попытку ответить на эти вопросы. Моя история От скептицизма к технической рациональности Почему Спок нерационален Законы мышления Бунт взбесившегося робота Не созданы для размышлений об Искусственном Интеллекте Табу на слово «разумность» Предрассудки отступают Короткая остановка Не отгораживайтесь Нас некому спасать Сложная и хрупкая система ценностей Интеллектуальный взрыв Проблемы ИИ и их решения Создание утопии"
