full_description = "目录 在这个世纪的某个时候，机器将会超越人类的智力水平。这一事件——“奇点”——将会成为我们历史中最重要的事件,而明智地操纵它将成为我们能够做到的最重要事情。 从 阿兰·图灵（Alan Turing） 和 杰克·古德（Jack Good） 乃至 比尔·乔伊（Bill Joy） 及 斯蒂芬·霍金（Stephen Hawking） 这些杰出人物都曾经向我们告诫过这一事件。为什么我认为霍金他们的告诫都是正确的呢？对此我们又能做些什么呢? 直面奇点 是我尝试对这些问题作出的回答。 我自己的故事 从怀疑论到技术理性 为什么斯波克是不理性 法律思想 疯狂的机器人叛乱 并非为人工智能的思索而设 与“智能”玩禁忌 迷信在撤退 在我们上方还有充足的空间 不要退缩 这个世界并没有救世主 价值是复杂而脆弱的 智力爆炸 人工智能问题及解决方案 设计乌托邦"
