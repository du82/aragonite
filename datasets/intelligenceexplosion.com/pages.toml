full_description = "Contents Sometime this century, machines will surpass human levels of intelligence and ability. This event—the “intelligence explosion”—will be the most important event in our history, and navigating it wisely will be the most important thing we can ever do. Luminaries from Alan Turing and I. J. Good to Bill Joy and Stephen Hawking have warned us about this. Why do I think Hawking and company are right, and what can we do about it? Facing the Intelligence Explosion is my attempt to answer these questions. My Own Story From Skepticism to Technical Rationality Why Spock is Not Rational The Laws of Thought The Crazy Robot’s Rebellion Not Built to Think About AI Playing Taboo with “Intelligence” Superstition in Retreat Plenty of Room Above Us Don’t Flinch Away No God to Save Us Value is Complex and Fragile Intelligence Explosion The AI Problem, with Solutions Engineering Utopia"
