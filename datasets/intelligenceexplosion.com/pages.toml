title = "Contenuti | Affrontare L’Esplosione Di IntelligenzaAffrontare L’Esplosione Di Intelligenza"
description = "d un certo punto di questo secolo, le macchine sorpasseranno i livelli umani di intelligenza ed abilità. Questo evento—la “esplosione di intelligenza”—sarà l’evento più importante nella nostra storia, e navigare saggiamente in quelle acque sarà la cosa più importante che… continue reading »"
full_description = "Contenuti Ad un certo punto di questo secolo, le macchine sorpasseranno i livelli umani di intelligenza ed abilità. Questo evento—la “esplosione di intelligenza”—sarà l’evento più importante nella nostra storia, e navigare saggiamente in quelle acque sarà la cosa più importante che potremmo mai fare. Luminari come Alan Turing e I. J. Good oppure Bill Joy e Stephen Hawking ci hanno già avvertito a riguardo. Perché penso che Hawking e compagnia bella abbiano ragione, e cosa possiamo fare a riguardo? Affrontare l’esplosione d’intelligenza è il mio tentativo di rispondere a queste domande. La Mia Storia Dallo Scetticismo Alla Razionalità Tecnica Perché Spock non è razionale Le Leggi Del Pensiero La Ribellione Del Robot Impazzito Non siamo fatti per pensare all’IA Giocare a “Tabù” con la parola Intelligenza Superstizione in ritirata Un mucchio di spazio sopra di noi Non distogliere lo sguardo Nessun Dio ci salverà Il valore è una questione complessa e fragile L’esplosione di intelligenza Il problema dell’IA, e le sue soluzioni Realizzare l’Utopia"
