title = "Sommaire | Face à la SingularitéFace à la Singularité"
description = "n jour, au cours de ce siècle, les machines surpasseront les niveaux humains d’intelligence et de capacité. Cet événement — la “Singularité” — sera le plus important de notre histoire, et réussir à y naviguer de manière avisée sera la… continue reading »"
full_description = "Sommaire Un jour, au cours de ce siècle, les machines surpasseront les niveaux humains d’intelligence et de capacité. Cet événement — la “Singularité” — sera le plus important de notre histoire, et réussir à y naviguer de manière avisée sera la chose la plus importante que nous puissions jamais faire. Des sommités telles qu’Alan Turing, Jack Good, Bill Joy et Stephen Hawking nous ont avertis à ce sujet. Ces questions ne dépendent pas de l’arrivée d’une Singularité du « changement accéléré » telle que la conçoit Ray Kurzweil. Pourquoi je pense qu’Hawking et compagnie ont raison, et que pouvons-nous y faire ? Face à la Singularité est ma tentative pour répondre à ces questions. Mon histoire personnelle Du scepticisme à la rationalité technique Pourquoi Spock n’est pas rationnel Les lois de la pensée La rébellion du robot fou Pas conçus pour penser à l’IA Jouer à Taboo avec “l’intelligence” La retraite de la superstition Plein de place au-dessus de nous Ne vous défilez pas Aucun dieu pour nous sauver Les valeurs sont compliquées et fragiles L’explosion d’intelligence Le problème de L’IA, et ses solutions La Conception de l’Utopie"
