title = "My top posts in 2024 (Interconnected)"
description = "Posted on Monday 30 Dec 2024. 916 words, 36 links. By Matt Webb."
full_description = "My top posts in 2024 09.33, Monday 30 Dec 2024 Link to this post Hello! This is a both my summary of 2024 and also the “Start here” post for new readers. Links and stats below! According to Fathom, my 5 most popular posts in 2024 were (in descending order): Tech has graduated from the Star Trek era to the Douglas Adams age (21 Feb) Every webpage deserves to be a place (5 Sep) New app! A compass that points to the centre of the galaxy (15 Feb) Here comes the Muybridge camera moment but for text. Photoshop too (31 May) Mapping the landscape of gen-AI product user experience (19 Jul) Here are some more that might be worth your time. 20 most popular in 2024. Lots of AI. It’s not all AI, I promise. My personal faves often aren’t always the most popular… I’ve collected my favourite, more speculative posts on topics such as: Fizzy showers The mustard second coming A robot that can defrag my home Laptops that work in the rain Rasputin Find them here: 14 speculative posts in 2024. Also check out the now decade-long Filtered for… series. Each is a handful of links and a bunch of rambling, uh, interconnectedness. I like em. In 2024 you’ll find posts such as: Filtered for vampires and calendars (3 Mar) with facts about the Chicxulub impact and the Andromeda galaxy Filtered for the Russian superhuman (26 Apr) about psychic chess players and Lenin being a mushroom Filtered for time and false memory (11 Oct) on a time-travelling super-intelligent AI from the future. Here’s the whole Filtered for… series (111 posts since 2014). 2024 posts at the top. Here’s an essay: From the other side of the bridge (3 May) is my talk from UNFOLD at Domus Academy in Milan. It’s a defence of AI hallucinations but, you know, designer-y. I log my speaking appearances over on my studio site. Here’s the 2024 list. You’ll find a talk on YouTube and three podcasts to listen to. Things I made outside work! Poem/1. I took last year’s AI poetry clock to Kickstarter (1 Feb, when the campaign started) and… funded! I couldn’t be more grateful – or busier. The project has dominated my prototyping time this year, with either software development (when required) and pushing things along on WeChat (mainly). Galactic Compass. I created this iPhone app and documented the process of coding it with help from ChatGPT, and both the launch post (15 Feb) and app went viral. Here’s the press page. Find your way to the centre of the Milky Way. Between the clock and client work I didn’t have time to kick off anything new, but I continued digging on a few projects: Cursor Party. With Every webpage deserves to be a place (5 Sep) I added multiplayer presence and cursor chat to every page of this blog, wrapping up a project from last year. You can install the code yourself. It’s pretty flexible, I use it in client work in various forms. Lares. I updated my early (and award winning) smart home AI agent prototype, wrote a paper, and shipped code (6 Jul). There’s also a flexible framework here, behind the scenes. I’ve used it in multiple client prototypes and this is where I want to spend more time in 2025. Braggoscope. My unofficial BBC In Our Time archive got an embeddings-powered visual explorer ready for the podcast’s 20th birthday (11 Nov). If you’re interested in the tech stack behind this blog, check out the new colophon. PREVIOUSLY! My most popular posts in 2020 and other lists My most popular posts in 2021 and other lists My most popular posts in 2022 and other lists My most popular posts in 2023 and other lists Other ways to read: Receive new posts as an email newsletter. Subscribe to the RSS feed using your newsreader. You should totally use RSS. Learn about what it is and how to get started. Or just visit the website: interconnected.org/home. If you read a post you like, please do pass it along and share on whatever discords or socials you’re on! I like email replies. I like it when people send me links they think I’ll enjoy (they’re almost always correct). I especially like hearing about how a post has had a flapping-of-the-butterfly’s-wings effect somehow, whether personally or at your place of work. I like talking to people most of all. I started opening my calendar for Unoffice Hours about 4 years and 350+ calls ago and it’s still the highlight of my week. Learn more and book a time here. Stats for the stats fans. 2020: 116 posts (94,349 words, 713 links) 2021: 128 posts (103,460 words, 765 links) 2022: 96 posts (104,645 words, 711 links) 2023: 68 posts (69,058 words, 587 links) 2024, to date: 60 posts (62,670 words, 586 links) My current streak: I’ve been posting weekly or more for 249 weeks. Five years this coming March! February 2025 also brings up this blog’s 25th birthday. No plans yet on how to celebrate. I continue to be a terrible predictor re which of my posts will be popular, and that’s very freeing I think? Though my usual reflection: I have the most fun with the shortest, loosest posts, and I should let myself post like that more often. Anyway. I love having this public notebook. I get so much out of it – new thoughts from the writing, new friends from the reading. So thank YOU. I appreciate you being here, dear reader."
