title = "Juliette Jeffers, Author at Interview Magazine"
full_description = 'Juliette Jeffers SMOKE BREAK “I’m the Melancholy Party Photographer”: Talking Love and Natural Light With Marcus Maddox February 27, 2025 “It starts out with young, sexy people in love, very blissful,” the photographer says of “Hey Lover,” his brand-new monograph. “But then it progresses into this sequence of unhappiness.” SOUND ADVICE Rapper 9mice Made Us the Playlist of His Apocalyptic Fantasies February 19, 2025 In this week’s Sound Advice, the enigmatic Slavic musician made us a playlist and revealed his nightlife philosophy: “I don’t walk the same path twice.” SUNDANCE A Screwball Comedy About Cabbage? Director Evan Twohy Can Make It Work. January 30, 2025 “To me, it’s a love story,” says the director of his film “Bubble & Squeak,” which held its world premiere at Sundance. “But it’s just not a love story that ends where most love stories end.” SUNDANCE Director Katarina Zhu on Besties, Bunnies, and Bad Breakups January 29, 2025 “Making this film became an exercise in giving myself permission to bear parts of myself that I thought were gross or vain or selfish or evil,” says the first-time director of her debut feature, “Bunnylovr.” IT GIRL Caroline Calloway Crashed Out of New York. Now She’s Got Some Advice to Share. January 8, 2025 After decamping to Sarasota, Florida, the notorious scammer called us to talk about her new self-published book, an homage to literary it girl Elizabeth Wurtzel. FAIR Meet Shanzhai Lyric, the Art Collective Celebrating New York City’s Digestive Tract December 11, 2024 At the fifth edition of “Press Play,” Pioneer Works’ annual art fair, we talked to Ming Lin and Alex Tatarsky about parrots, piracy, and the profundity of plastic bags. TOUR DIARY “BBLs and Rolexes”: One Night in Miami With Isabella Lovestory October 28, 2024 We got on the phone with the Honduran pop princess after her Harajuku-inspired set at III Points Festival to talk drain gang, Bond girls, and haunted Airbnbs. PARKS Meet Joseph Reiver, the Man Fighting to Save the Elizabeth Street Garden October 23, 2024 As the beloved Elizabeth Street Garden once again faces eviction, we met up with the man taking on the Eric Adams administration in order to save it. POETRY Poet Ariana Reines Isn’t Afraid of Saying the Wrong Thing October 21, 2024 To mark the publication of her latest book, “Wave of Blood,” the poet talked to us about Gaza, insanity, and the process of stitching together a genre-resistant text. SOUND ADVICE Liam Benzvi on Madonna, Karaoke, and Losing His Virginity to My Bloody Valentine September 25, 2024 “I fainted from dehydration the first time I saw them play and it’s the closest to heaven I’ve ever felt.” SOUND ADVICE Actress-Turned-Musician Sophie Thatcher Endorses Funky Monkey Fall September 5, 2024 To prime us for the release of her debut EP “Pivot & Scrape,” the “Yellowjackets” star made us a blissed-out, end-of-summer playlist. Sunwoo, Seth Lee, and Ashton Sanders Shimmer in AMIRI FW24 September 4, 2024 To commemorate the launch of the brand’s latest campaign, we asked it’s stars take our September issue questionnaire. SEARCH HISTORY Industry’s TikTok Influencer Miriam Petche Reveals the Contents of Her FYP September 4, 2024 In this week’s Search History, we asked the newest addition to HBO’s “Industry” how she prepared to play the very online Sweetpea Golightly. LOVERS “I’ve Been Texting Her Mom”: A Love Island Debrief With Fan-Favorites JaNa Craig and Kenny Rodriguez August 2, 2024 One week after leaving the island where they fell in love, the happy couple called us to reflect on forging a connection and overcoming adversity in the villa. LIT Author Yasmin Zaher on Patrick Bateman, Birkin Scams, and Her Debut Novel The Coin July 26, 2024 “I wonder sometimes,” says the debut author of her new novel, “is it a love-hate letter to New York, or is it just mostly hate?” SOUND ADVICE Jeremy Pope Doesn’t Trust Anyone Who Doesn’t Like Beyoncé July 1, 2024 The actor and singer curated a a playlist that includes some of his long-time influences, and gets into the simple pleasures of Shirley Temples, Dreamgirls, and “borrowed” hotel robes. SOUND ADVICE Addison Rae Made Us An Endless Summer Playlist June 24, 2024 To accompany her sultry spread in our Summer Issue, Addison Rae made us the definitive playlist to Summer 2024, “Von Dutch” remix included. SEARCH HISTORY Hagop Kourounian of @DirectorFits on the Safdie’s Puffers and Wim Wenders’ Y3’s June 14, 2024 In this week’s Search History, we DM’d the man behind @DirectorFits to discuss the fashions of Sofia Coppola, Wim Wenders, and the Safdies. OPEN BOOK “Sex, Food, and Party Scenes”: Emma Copley Eisenberg Tells Us What She Looks For in a Book June 4, 2024 In this month’s Open Book, the author tells us about her debut novel, “Housemates,” and the books that shaped her, from “Nevada” to the “The Price of Salt.” MET The Carlyle Takes Us Behind the Scenes of The Met with Camila Cabello and Troye Sivan May 7, 2024 At the legendary hotel where A-listers get glam for the Met Gala, photographer Andrew Tess captured some of the night’s biggest stars on polaroid. .alm-btn-wrap{display:block;margin:0 0 25px;padding:10px 0 0;position:relative;text-align:center}.alm-btn-wrap:after{clear:both;content:"";display:table;height:0}.alm-btn-wrap .alm-load-more-btn{appearance:none;background:#ed7070;border:none;border-radius:4px;box-shadow:0 1px 1px rgba(0,0,0,.04);color:#fff;cursor:pointer;display:inline-block;font-size:15px;font-weight:500;height:43px;line-height:1;margin:0;padding:0 20px;position:relative;text-align:center;text-decoration:none;transition:all .3s ease;user-select:none;width:auto}.alm-btn-wrap .alm-load-more-btn.loading,.alm-btn-wrap .alm-load-more-btn:hover{background-color:#e06161;box-shadow:0 1px 3px rgba(0,0,0,.09);color:#fff;text-decoration:none}.alm-btn-wrap .alm-load-more-btn:active{box-shadow:none;text-decoration:none}.alm-btn-wrap .alm-load-more-btn.loading{cursor:wait;outline:none;padding-left:44px;pointer-