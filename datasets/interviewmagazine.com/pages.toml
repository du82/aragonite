full_description = "Eliza Douglas paints her existential issues By Matt Mullen Photographed by Bjarne X Takata December 8, 2017 View Full Images As a child growing up in New York’s Greenwich Village, Eliza Douglas spent a lot of time thinking about girls and death. “From a very early age, I worried about the implications of being a woman who liked women,” says the 33-year-old artist from Frankfurt, where she now lives. “I was also preoccupied with existential issues—especially death-related ones.” Douglas’s unease became, in a way, the catalyst for her large-scale oil paintings, which include depictions of disembodied hands and feet, monsters, and haunted young men. “I like the idea of making something that cannot easily be classified as abstract or figurative, gestural or procedural,” she says. “I want my work to be open and porous.” To wit: the hands in many works are rendered with startling realism, while the accompanying arms dissolve into bleary lines. Douglas studied photography and film as an undergrad at Bard, but enrolled at the Städelschule school in Frankfurt two years ago to pursue painting, a practice she now considers “the focus of my life.” She graduated just last spring, but has already mounted four solo shows this year and is currently working on her 2018 exhibition at New York’s Jewish Museum. Painting, however, isn’t Douglas’s only creative outlet: she also records music; occasionally models for brands such as Balenciaga and Vetements; and collaborates with her partner, Anne Imhof, who recently staged the bleak, physically intense performance, Faust, at the 2017 Venice Biennale’s German Pavilion. “There is a lot of physical improvisation involved, which is something I’ve felt uncomfortable with in the past,” Douglas says of her participation in the piece, which won the Golden Lion prize and involved crawling under glass floors and climbing up walls. “It has been really cool pushing through the discomfort and learning a new way to think.” CLICK HERE TO SEE MORE ARTISTS RETHINKING OUR NOTIONS OF PAINTING, SCULPTURE, VIDEO, PERFORMANCE, AND WHAT IT MEANS TO MAKE ART IN A DIFFICULT WORLD. Walton Goggins and Danny McBride on Nervous Breakdowns and Spiritual Awakenings Captain America’s Danny Ramirez Gives Lewis Pullman His Best G-Force Face Celebrity Psychic Wendy L’Belle-Tividad Taps Into the Frequency of Love “I’m the Melancholy Party Photographer”: Talking Love and Natural Light With Marcus Maddox How Baylen Dupree Turned Tourette’s TikTok Into Television Stardom"
author = "Matt Mullen"
year_published = 2017
