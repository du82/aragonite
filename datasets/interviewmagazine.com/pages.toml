["https://www.interviewmagazine.com/fashion/nara-smith-reviews-prada-fw25-from-scratch"]
title = "Nara Smith Reviews Prada FW25 From Scratch"
description = "On Thursday afternoon in Milan, our editor-in-chief tracked down the baked goods goddess after the Prada show to find out which looks she'd wear in the kitchen."
full_description = "MFW “I’ll Make a Stunning Cake in That”: Nara Smith Reviews Prada FW25 From Scratch By Mel Ottenberg February 27, 2025 THURSDAY 2:34 PM FEBRUARY 27, 2025 MILAN On Thursday morning in Milan, Nara Smith ditched the kitchen to attend the Prada FW25 show, where design duo Miuccia Prada and Raf Simons sent leather skirts, knit tube tops, and giant shearling coats down the runway. Smith, of course, is known for turning a look while making baked goods from scratch, so our editor-in-chief Mel Ottenberg tracked her down after the show to match recipes to the runway. “I love the coats, like the last few with the pearl buttons,” Smith told us. “I’ll make a stunning cake in that.” ——— MEL OTTENBERG: Hey Nara. NARA SMITH: Hi! OTTENBERG: What’s up? SMITH: You know, we’re at the Prada show. OTTENBERG: I feel like you would really look good in every single outfit in this show, Nara. SMITH: No, I think so too. [Laughs] OTTENBERG: Right? I mean, every shoe. You could be the sneaker girl, you could be the sandal girl. SMITH. I do it all, I’m versatile. OTTENBERG: Where would you go to wear these things? SMITH: My kitchen. Take my kids to school, you know? The usual. [Laughs] OTTENBERG: Yeah. Any recipes come to mind when thinking about this show or about these outfits? SMITH: Something chic and classic—not doing too much, but it has to be done right. OTTENBERG: What about making a cake? Which outfit? SMITH: Honestly, I love the coats, like the last few with the pearl buttons. I’ll make a stunning cake in that look. It would keep me warm. OTTENBERG: Okay, what about the really ugly, perfect printed dresses—what are you making with that? SMITH: You know what, some good breakfast. I’d chef it up in the morning. That’s like a morning situation, rolling out of bed. OTTENBERG: What about the funeral dresses at the beginning? They’re the black house dresses that are shapeless. SMITH: Oh yeah, I love. The ones with the boots, yeah? I’ll do it all. OTTENBERG: Last question: jeans with the dress, what do you make of that? SMITH: Jeans with dress—a good pasta. ‘Cause it will keep you covered in case you spill anything. OTTENBERG: Love it. Do you have a favorite outfit? SMITH: It was a fur coat with fur lining on the collar—that one I really liked. Or the last two coats. Those buttons, I just love a good detail, you know? OTTENBERG: Thanks for talking with me. Walton Goggins and Danny McBride on Nervous Breakdowns and Spiritual Awakenings Captain America’s Danny Ramirez Gives Lewis Pullman His Best G-Force Face Celebrity Psychic Wendy L’Belle-Tividad Taps Into the Frequency of Love “I’m the Melancholy Party Photographer”: Talking Love and Natural Light With Marcus Maddox How Baylen Dupree Turned Tourette’s TikTok Into Television Stardom"
author = "Emily Sandstrom"
