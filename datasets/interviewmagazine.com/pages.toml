["https://www.interviewmagazine.com/fashion/ice-spice-reviews-versace-fw25"]
title = '"Did You See That Corset?": Ice Spice Reviews Versace FW25'
description = "After sitting pretty in the front row at Versace FW25, the rapper told our editor-in-chief about her favorite fresh-off-the-runway looks (and her fave Versace skivvies)."
full_description = "MFW “Did You See That Corset?”: Ice Spice Reviews Versace FW25 By Mel Ottenberg March 1, 2025 Photon courtesy of Ice Spice. FRIDAY 8:43 PM FEBRUARY 28, 2025 MILAN “Everyone should have a little Versace attitude,” said Donatella Versace before the brand’s FW25 show, presented at the Deposito di Baggio train station in Milan on Friday evening. where sexy corsets, baggy jeans, and club-ready mini dresses paraded down runway. Ice Spice certainly does, right down to her scarf and skivvies. “That’s all the Versace I was able to get back in those days,” she told our editor-in-chief Mel Ottenberg when the two linked post-show for a debrief, Italian-style. ——— MEL OTTENBERG: Hi! ICE SPICE: Hi. OTTENBERG: What’s up, I’m Mel. ICE SPICE: [Kisses Mel on the cheek] Real Italian like. OTTENBERG: We’re doing it Italian style. How are you doing? ICE SPICE: I’m good, how are you? OTTENBERG: I’m good. What do you wanna wear from this fashion show? I feel like there’s a lot of stuff you would wear… ICE SPICE: Did you see that corset? It was like– OTTENBERG: Oh, I know. I got the video ‘cause I knew she was yours. Versace FW25 Versace FW25 ICE SPICE: Yes. When I saw that my heart started beating fast. There were also these black platforms. OTTENBERG: Oh, yeah. With the rubber on the front that said Versace. What’s your first Versace Fantasy memory? ICE SPICE: Probably a fucking scarf. That’s all I could fucking–oops, can I curse? OTTENBERG: You can. ICE SPICE: Probably just a scarf, I’m not gonna lie. That’s all the Versace I was able to get back in those days. OTTENBERG: What’s in your purse right now? ICE SPICE: Let’s see. I’m scared to check. [Opens purse] It’s lip gloss, gum, and some lipliner. OTTENBERG: Is the underwear Versace? I want Versace underwear. ICE SPICE: Oh, yeah. I have some. Versace FW25 Versace FW25 OTTENBERG: Are you jet-lagged? ICE SPICE: I am a bit. OTTENBERG: You got anything to say to the kids back home in New York? ICE SPICE: The kids? You know, I just want them to keep working really hard. And go to school. Just go. OTTENBERG: I like that. Can you do one more 360 so I can see the back and the booty? ICE SPICE: [Twirls] OTTENBERG: Have fun tonight! ICE SPICE: Thank you. Walton Goggins and Danny McBride on Nervous Breakdowns and Spiritual Awakenings Captain America’s Danny Ramirez Gives Lewis Pullman His Best G-Force Face Celebrity Psychic Wendy L’Belle-Tividad Taps Into the Frequency of Love “I’m the Melancholy Party Photographer”: Talking Love and Natural Light With Marcus Maddox How Baylen Dupree Turned Tourette’s TikTok Into Television Stardom"
