full_description = 'Art CLICK Photographer Martin Parr On Trump, Tourism, and the Trials Of Modern Living February 28, 2025 “I feel pretty upbeat, but when I think about the planet and the world and our country, I can’t help but get depressed,” says the renowned photojournalist, who’s now the subject of a new documentary. SOUL HACKER Celebrity Psychic Wendy L’Belle-Tividad Taps Into the Frequency of Love February 27, 2025 The Kundalini-awakened intuit tells her client, the painter Ariana Papademetropoulos, how she keeps her heart chakra wide open. SMOKE BREAK “I’m the Melancholy Party Photographer”: Talking Love and Natural Light With Marcus Maddox February 27, 2025 “It starts out with young, sexy people in love, very blissful,” the photographer says of “Hey Lover,” his brand-new monograph. “But then it progresses into this sequence of unhappiness.” XXX “The Only Way Out Is to Get Fucked”: Behind the Scenes of the Brand-New Brazzers Book February 26, 2025 After spending a year trailing the biggest stars in the porn industry, photographer Rosie Marks and writer Esra Padgett told us what they learned aboard the Bang Bus. RETROSPECTIVE “I’m So Old Testament, Honey”: Deborah Kass, in Conversation With Titus Kaphar February 21, 2025 Ahead of a new exhibition of her paintings at Salon 94, the pioneering artist joined her friend Titus Kaphar to ponder Reaganomics, race theory, and how to resist the regime. XXX “What a Ride I’ve Had”: Peter Berlin on Sadness, Immortality, and Good Sex February 19, 2025 “I’m constantly entertained by my thoughts,” the legendary 82-year-old artist tells writer Brontez Purnell. “Usually, I find myself more interesting than the people I’m dealing with.” BLOB Kenny Scharf on Trash, Artificial Intelligence, and the Golden Days of New York February 18, 2025 “I dislike it intensely,” the 66-year-old says of A.I. art. “I can tell it’s devoid of anything as far as the soul goes.” DIRTY “The Men Were His Life”: Inside the Sordid World of Photographer David Hurles February 13, 2025 To mark the first large-scale exhibition of the photographer’s work, our editor-in-chief called up curator Dian Hanson to talk about the well-endowed men that made David Hurles tick. XXX Photographer Del LaGrace Volcano on Cruising, Community, and the Dyke-Fag Alliance February 13, 2025 “My role as a photographer or as an artist is to be a creator of spaces where people feel safe enough to give me what they’ve got,” says Volcano, whose 1988 monograph, “Queer Dyke Cruising,” has been reissued with Climax Books. ART Get a Load of Jamian Juliano-Villani, the Chaos Agent of the New York Art World February 12, 2025 Last December, the larger-than-life artist and her friend Borna Sammak spent the night in her Flatiron studio, drawing, rolling joints, and talking the night away. OPENING At His Namesake Gallery, Rajiv Menon Wants to Put South Asian Artists on the Map February 10, 2025 “A lot of artists share a lot of their practice on Instagram,” says Rajiv Menon, whose namesake gallery opens in Los Angeles this weekend. “But I can tell very quickly if they’re in it for the art or for the clout.” DISCOURSE Michael Abel and Tunji Adeniyi-Jones on Troll Art, Traditionalism, and Taking the Bait February 7, 2025 On the heels of their respective shows in New York and Seoul, the artists got together to discuss art world economics and, of course, that infamous Harpers Magazine cover story. SCENE AND HEARD “I’m Not Buying Anything”: On the Grounds at the Armory’s Young Collectors Night February 3, 2025 At the Park Avenue Armory’s Young Collectors Night, we asked guests to come clean about whether or not they’re really buying art—and what’s up with all the horse paintings. ICONS “I Want to Live to 110”: Marina Abramović, in Conversation With Juergen Teller January 31, 2025 “This is exactly why we are in this conversation together, because I don’t compromise,” the 78-year-old conceptual artist tells photographer Juergen Teller. “I can’t compromise to the market and I never did.” IN CONVERSATION Jamie xx Tells Olafur Eliasson How He Found His Way Back to Music January 22, 2025 “I was just one of the weird kids at school, and that was my way out,” the musician told Olafur Eliasson when the two got together earlier this month to talk about getting vulnerable in their art. OPENING Na Kim Designs Your Favorite Book Covers. Now She’s Painting For Herself. January 22, 2025 “I’ve always wanted to paint,” said the artist and book designer before opening a new exhibition at Nicola Vassell Gallery. “It’s been the thing I’ve wanted to do since I was a wee, wee girl.” DREAM MAN “The Goal Is to Be a Cult Superstar”: 30 Minutes With It Boy Louis Bubko January 13, 2025 After a matinee screening of “Babygirl,” the former model linked up with our editor-in-chief Mel Ottenberg to talk about weed bags, dream men, and hook-up apps. TITTIES “I Want to Be Disgusting”: Alex Tatarsky and Crackhead Barney on Karens, Clowns, and CEOs January 9, 2025 The self-described clown got together with fellow performance artist Crackhead Barney to talk getting meta, getting milked, and humiliating yourself for all to see. CLICK “Complete Fucking Alchemy”: How Luisa Opalesky Captures New York City Grit January 6, 2025 “I love characters, and I will press my cheeks to the concrete to find them if I have to,” the photographer told Alissa Bennett when the two linked up to discuss Opalesky’s debut monograph, “Big City Nobody.” VISIONARY Doug Aitken and Beck on Making Art in an Age of White Noise January 6, 2025 On a chilly afternoon in Los Angeles, the two visionaries got together to discuss how making art helps them defy a culture of white noise and fragmentation. .alm-btn-wrap{display:block;margin:0 0 25px;padding:10px 0 0;position:relative;text-align:center}.alm-btn-wrap:after{clear:both;content:"";display:table;height:0}.alm-btn-wrap .alm-load-more-btn{appearance:none;background:#ed7070;border:none;border-radius:4px;box-shadow:0 1px 1px rgba(0,0,0,.04);