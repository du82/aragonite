full_description = 'Film KILLS Director Osgood Perkins Tells Us Why Horror Movies Are the Best Medicine March 5, 2025 The director of “The Monkey”— and son of Hollywood royalty Anthony Perkins— joined us to talk about cheap thrills, morbid kills, and the afterlife. TRAVELER Walton Goggins and Danny McBride on Nervous Breakdowns and Spiritual Awakenings March 3, 2025 “The White Lotus” star tells his longtime friend and collaborator why returning to Thailand to film the hit HBO show was a full-circle moment. SUPERHERO Captain America’s Danny Ramirez Gives Lewis Pullman His Best G-Force Face February 28, 2025 The 32-year-old actor and “Captain America” star called his friend and former co-star from the backseat of a Cadillac to talk wedgies, g-force, and superheroes. CLICK Photographer Martin Parr On Trump, Tourism, and the Trials Of Modern Living February 28, 2025 “I feel pretty upbeat, but when I think about the planet and the world and our country, I can’t help but get depressed,” says the renowned photojournalist, who’s now the subject of a new documentary. IN CONVERSATION Obsessed With Awards Season? Then Daniel D’Addario’s The Talent Is For You. February 25, 2025 The author and Chief Correspondent at Variety joined Katie Kitamura to talk about his debut novel, “The Talent,” and the dark underbelly of a Hollywood awards season. ROCK AND ROLL How the Director of Becoming Led Zeppelin Got the World’s Most Tight-Lipped Band to Talk February 24, 2025 “The film is made for movie theaters and the biggest screens possible with the biggest sound systems,” says the director of “Becoming Led Zeppelin,” a new and unvarnished documentary about the band. ACTOR Patrick Schwarzenegger Tells Chris Pratt How He Became a Sex-Crazed Finance Bro February 19, 2025 From a parking lot in L.A., the breakout star of “The White Lotus” called up with his brother-in-law to unpack the anxiety and the excitement of starring on TV’s biggest show. ICON Inside Goodbye Horses, the First Documentary About the Mysterious Q Lazzarus February 18, 2025 Filmmaker Eva Aridjis Fuentes joined us to talk about her serendipitous friendship with the most elusive of rock icons, the late Q Lazzarus. ICON Marianne Jean-Baptiste on Hard Truths and Industry Politics February 13, 2025 At the tail end of a long awards season, the 57-year-old actor joined us to discuss her career-best work in Mike Leigh’s “Hard Truths” and, of course, that Oscars snub. N.Y.C. Do You Want to Be Famous? February 11, 2025 The next gen of downtown performers make their red carpet debut. ACTORS “We Are Our Own Piano”: Fernanda Torres, in Conversation With Jessica Chastain February 10, 2025 Just after she was nominated for the Academy Award for Best Actress, Fernanda Torres joined Jessica Chastain to discuss how they’ve navigated the entertainment industry and what they’ve learned from the women they’ve portrayed on film. PORTFOLIO The Stars of Sundance… Exposed! January 31, 2025 From stairwells to hotel lobbies to Thai spots, photographer Myles Pettengill spent the week in Park City capturing the stars of Sundance in their in-between moments. SUNDANCE A Screwball Comedy About Cabbage? Director Evan Twohy Can Make It Work. January 30, 2025 “To me, it’s a love story,” says the director of his film “Bubble & Squeak,” which held its world premiere at Sundance. “But it’s just not a love story that ends where most love stories end.” SUNDANCE Director Katarina Zhu on Besties, Bunnies, and Bad Breakups January 29, 2025 “Making this film became an exercise in giving myself permission to bear parts of myself that I thought were gross or vain or selfish or evil,” says the first-time director of her debut feature, “Bunnylovr.” DIRECTOR Steven Soderbergh and David Koepp On Their Big Ghost Story Gambit January 21, 2025 The director and screenwriter got together to talk about building a palpable sense of dread in their new feature, “Presence,” a clever spin on the conventions of ghost movies. TECHNIQUE “I’m Down to Get Ugly”: Jharrel Jerome, in Conversation With Don Cheadle January 17, 2025 The “Moonlight” actor got together with Don Cheadle to explain how he prepared for his role as real-life wrestler Anthony Robles in “Unstoppable.” IN CONVERSATION Taylor Kitsch and Josh Brolin on Shamans, Sweat Lodges, and Self-Transformation January 16, 2025 “Man, it was a fucking roller coaster,” the “Friday Night Lights” heartthrob told Josh Brolin about losing 25 lbs for his role in the gritty Netflix western “American Primeval.” HEAVYWEIGHTS Michael Pitt and Ron Perlman on Redemption, Reinvention, and Reposado January 14, 2025 “I was shitting my pants pretty much every day, but I think that’s good and healthy,” the actor told his co-star Ron Perlman of starring in Jack Huston’s “Day of the Fight.” DIRECTOR “I Couldn’t Take No For an Answer”: How Gia Coppola Got Pamela Anderson to Star in The Last Showgirl January 13, 2025 The director and granddaughter of Hollywood royalty revealed how, with the help of Pamela Anderson, she brought Las Vegas to life in her third feature, “The Last Showgirl.” ACTOR “You’re a Rock Star, Man”: Michael Shannon, in Conversation With Austin Butler January 8, 2025 “I don’t want to be a giant drag all the time,” the actor told his friend Austin Butler about taking on hefty projects. “It’s nice when you excite people, or uplift them.” .alm-btn-wrap{display:block;margin:0 0 25px;padding:10px 0 0;position:relative;text-align:center}.alm-btn-wrap:after{clear:both;content:"";display:table;height:0}.alm-btn-wrap .alm-load-more-btn{appearance:none;background:#ed7070;border:none;border-radius:4px;box-shadow:0 1px 1px rgba(0,0,0,.04);color:#fff;cursor:pointer;display:inline-block;font-size:15px;font-weight:500;height:43px;line-height:1;margin:0;padding:0 20px;position:relative;text-align:center;text-decoration:none;transition:all .3s ease;user-select:none;width:auto}.alm-btn-wrap .alm-load-more-btn.loading,.alm-btn-wrap .alm-load-more-btn:hover{background-color:#e061