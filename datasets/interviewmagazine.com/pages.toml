title = "Jojo Orme of Heartworms Made Us a Playlist Fit for McQueen"
description = "The London-based musician and McQueen frontwoman made us the ultimate alt-couture playlist filled with everything from Chopin to Depeche Mode."
full_description = "SOUND ADVICE Jojo Orme of Heartworms Made Us a Playlist Fit for McQueen By Ary Russell March 3, 2025 Welcome to SOUND ADVICE, Interview’s weekly destination for playlists curated by our friends, enemies, and lovers. Over the past few weeks, we’ve collected playlists from Benny Blanco, 9mice, and Lexee Smith. This week’s installment comes from the London-based musician Heartworms, aka Jojo Orme, who’s currently making her way across Europe on tour. Fresh off the release of her debut record Glutton for Punishment—which served as the sonic inspiration behind McQueen’s elegant and moody Spring-Summer 2025 campaign—Heartworms made us the ultimate alt-couture playlist filled with everything from Chopin to Depeche Mode. Then, Orme took the time to fill out our Sound Advice questionnaire, where she revealed which girl group made her fall asleep, the true meaning of punk, and what she’s wearing to ring in the end times. ——— Where do you dance? In my front room. Who do you trust most with the aux cord? My partner. What was your first concert? Girls Aloud – I fell asleep as soon as they came on. Bluetooth or wired headphones? Bluetooth. Name three things you always have on you at the function? Hand cream, plasters and an escape plan. What song on this playlist do you wish you wrote? “On Battleship Hill.” What song on this playlist makes you cry? Tchaikovsky’s The Nutcracker. What song on this playlist screams McQueen? “Shadow of a Doubt.” The world is ending. What are you wearing? My Sunday best. What does punk mean to you? No limits. Sunglasses inside: yes or no? Yes. My prescribed ones. Who’s in your musical coven? PJ Harvey, Chopin, Josephine Foster, Patricia Morrison, Joan Jett. What is your guilty pleasure? Eating spaghetti bolognese with my hands. What’s your all-time favorite McQueen collection? “Jack the Ripper Stalks His Victims.” What song is playing in heaven? “Another Day in Paradise” by Phil Collins. Walton Goggins and Danny McBride on Nervous Breakdowns and Spiritual Awakenings Captain America’s Danny Ramirez Gives Lewis Pullman His Best G-Force Face Celebrity Psychic Wendy L’Belle-Tividad Taps Into the Frequency of Love “I’m the Melancholy Party Photographer”: Talking Love and Natural Light With Marcus Maddox How Baylen Dupree Turned Tourette’s TikTok Into Television Stardom"
