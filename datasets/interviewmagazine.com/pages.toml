full_description = 'Culture RORSCHACH TEST “That’s a Big Fat No”: Kristin Cavallari on Cabo, Co-Parenting, and Combat Boots on the Beach March 5, 2025 Before setting off on her podcast tour, the OG reality TV star joined us for the Rorschach Test, sounding off on Speidi, cheaters, and the infamous ending of “The Hills.” KILLS Director Osgood Perkins Tells Us Why Horror Movies Are the Best Medicine March 5, 2025 The director of “The Monkey”— and son of Hollywood royalty Anthony Perkins— joined us to talk about cheap thrills, morbid kills, and the afterlife. STYLE “How Do You Like That?”: Positively Cathy Reviews Some Recent Runway Looks March 4, 2025 The Midwestern faith, food, and fashion influencer graces the pages of our March 2025 issue. ONLINE Jeremy Gordon on Media Jobs, Male Loneliness, and Modern Malaise March 4, 2025 “That failed middle class of the millennial generation was certainly on my mind,” said the author when he joined us to discuss his debut novel, “See Friendship.” REALITY How Baylen Dupree Turned Tourette’s TikTok Into Television Stardom March 3, 2025 “If you’re going to talk about me and who I am, I want it to come out of my mouth and my mouth only,” says the star of TLC’s “Baylen Out Loud.” SUPERHERO Captain America’s Danny Ramirez Gives Lewis Pullman His Best G-Force Face February 28, 2025 The 32-year-old actor and “Captain America” star called his friend and former co-star from the backseat of a Cadillac to talk wedgies, g-force, and superheroes. CLICK Photographer Martin Parr On Trump, Tourism, and the Trials Of Modern Living February 28, 2025 “I feel pretty upbeat, but when I think about the planet and the world and our country, I can’t help but get depressed,” says the renowned photojournalist, who’s now the subject of a new documentary. MFW “I’ll Make a Stunning Cake in That”: Nara Smith Reviews Prada FW25 From Scratch February 27, 2025 On Thursday afternoon in Milan, our editor-in-chief tracked down the baked goods goddess after the Prada show to find out which looks she’d wear in the kitchen. SOUL HACKER Celebrity Psychic Wendy L’Belle-Tividad Taps Into the Frequency of Love February 27, 2025 The Kundalini-awakened intuit tells her client, the painter Ariana Papademetropoulos, how she keeps her heart chakra wide open. BACKSTAGE How Alastair Curtis Is Rescuing the Works of the Playwrights Lost to AIDS February 27, 2025 “We shouldn’t look to Ryan Murphy to direct us to the next bit of forgotten queer history,” says the founder of The AIDS Plays Project. “We should have a compunction to go back and search for context.” SMOKE BREAK “I’m the Melancholy Party Photographer”: Talking Love and Natural Light With Marcus Maddox February 27, 2025 “It starts out with young, sexy people in love, very blissful,” the photographer says of “Hey Lover,” his brand-new monograph. “But then it progresses into this sequence of unhappiness.” XXX “The Only Way Out Is to Get Fucked”: Behind the Scenes of the Brand-New Brazzers Book February 26, 2025 After spending a year trailing the biggest stars in the porn industry, photographer Rosie Marks and writer Esra Padgett told us what they learned aboard the Bang Bus. SMOKE BREAK “I’m Just Ready to Fucking Dance”: Kicking Off the Mayhem Era With Nick Gaga February 25, 2025 Over a pack of Capri Blues, we talked wigs, cigs, and “Mayhem” with Nick Gaga, the world’s premiere Mother Monster impersonator. IN CONVERSATION Obsessed With Awards Season? Then Daniel D’Addario’s The Talent Is For You. February 25, 2025 The author and Chief Correspondent at Variety joined Katie Kitamura to talk about his debut novel, “The Talent,” and the dark underbelly of a Hollywood awards season. BACKSTAGE “The Laughter Is a Trojan Horse”: Behind the Scenes of English With Tala Ashe February 25, 2025 At the Todd Haimes Theater, the Iranian-American actor joined us to talk about bringing Sanaz Toossi’s play to Broadway in today’s charged political climate. RORSCHACH TEST “That’s a Red Flag for Me”: Owen Thiele on Screen Time, Self-Tapes, and Cybertrucks February 24, 2025 The actor and host of the “In Your Dreams” podcast lets it all out. DESIGNER How Todd Oldham Built a Fashion Empire With 50 Bucks and a Bolt of Fabric February 21, 2025 “You know when you can do something but you don’t understand why you can do it?” said the American designer when he joined us for a look back at his career. “That was my thing with patterns.” VISION “What Are You Crying About?”: Quenlin Blackwell, by Rachel Sennott February 20, 2025 The content creator talks to her future costar about Capricorn energy, past life regression, and the business of being funny. XXX “What a Ride I’ve Had”: Peter Berlin on Sadness, Immortality, and Good Sex February 19, 2025 “I’m constantly entertained by my thoughts,” the legendary 82-year-old artist tells writer Brontez Purnell. “Usually, I find myself more interesting than the people I’m dealing with.” ICON Inside Goodbye Horses, the First Documentary About the Mysterious Q Lazzarus February 18, 2025 Filmmaker Eva Aridjis Fuentes joined us to talk about her serendipitous friendship with the most elusive of rock icons, the late Q Lazzarus. .alm-btn-wrap{display:block;margin:0 0 25px;padding:10px 0 0;position:relative;text-align:center}.alm-btn-wrap:after{clear:both;content:"";display:table;height:0}.alm-btn-wrap .alm-load-more-btn{appearance:none;background:#ed7070;border:none;border-radius:4px;box-shadow:0 1px 1px rgba(0,0,0,.04);color:#fff;cursor:pointer;display:inline-block;font-size:15px;font-weight:500;height:43px;line-height:1;margin:0;padding:0 20px;position:relative;text-align:center;text-decoration:none;transition:all .3s ease;user-select:none;width:auto}.alm-btn-wrap .alm-load-more-btn.loading,.alm-btn-wrap .alm-load-more-btn:hover{background-color:#e06161;box-shadow:0 1px 3px rgba(0,0,0,.09);color:#fff;text-decoration:none}.alm-btn-wrap .alm-load-more-btn:active{box-shadow:none;text-decoration:none}.alm-btn-wrap .alm-load-more-btn.loading{curs