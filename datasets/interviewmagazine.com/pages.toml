["https://www.interviewmagazine.com/culture/thats-a-red-flag-for-me-owen-thiele-on-screen-time-self-tapes-and-cybertrucks"]
title = "“That’s a Red Flag for Me”: Owen Thiele on Screen Time, Self-Tapes, and Cybertrucks"
description = 'For our March 2025 issue, the actor, comedian, and host of the "In Your Dreams" podcast Owen Thiele lets it all out.'
full_description = "RORSCHACH TEST “That’s a Red Flag for Me”: Owen Thiele on Screen Time, Self-Tapes, and Cybertrucks By Interview Photographed by Alyssa Kazew February 24, 2025 Owen Thiele wears Coat and Hat Bottega Veneta. Earrings (worn throughout) Owen’s Own. Sunglasses Jacques Marie Mage. Gloves Alexander. Since parlaying a bad bout of insomnia into the hit podcast In Your Dreams, Owen Thiele has cameoed in Sabrina Carpenter’s A Nonsense Christmas, bagged a starring role in FX’s coming-of-age comedy Adults, and gotten the greenlight from Amazon for a semi-autobiographical series, Off Color. But what does the 28-year-old Angeleno think about screen time, self-tapes, and Cybertrucks? Let’s find out! ——— GREEN ROOMS “I think of my high school production of 12 Angry Men. I was the 13th man. The stand-in. Looking back, I should have done a Tonya Harding.” ——— GREEN TEXTS “That’s a red flag for me. Either you’re stuck in the desert or you have an Android.” Vest, T-shirt, and Jeans Coach. Bracelets and Rings (worn throughout) Martine Ali. Belt Isabel Marant. Underwear Skims. CONTACT LENSES “I had 20/20 vision but I was wearing prescription glasses from CVS for a long time just because I liked the look of them.” ——— SELF-TAPES “I love a self-tape because you can Facetune it, which is actually very bad and nobody should do that. But I’ve done it once.” Coat, Top, and Shorts Gucci. CYBERTRUCKS “I put my name on a list for a Cybertruck a few years ago when I saw Kim Kardashian in one. Now I’m trying to figure out how to take my name off that list.” ——— CELEBRITY COUPLES “It’s People magazine, it’s TMZ, it’s everything we dream of.” Vest, Shirt, Pants, Tie, and Belt Saint Laurent by Anthony Vaccarello. DADDIES “I’m so close to my family that I’ve never been able to call someone daddy sexually. My boyfriend’s 5’8” and I’m 6’4”, but we’re both just kind of baby.” ——— DREAMS “I don’t sleep, famously. I get two hours a night of REM, which is really, really dangerous.” Jacket, T-shirt, and Jeans Balenciaga. Sunglasses Jacques Marie Mage. Gloves Stylist’s Own. SCREEN TIME “I don’t believe in checking your screen time. I think it’s actually one of the most unhealthy things a person could do. I’m on my phone for probably more than 12 hours a day.” ——— BROADWAY “It’s my dream to be on Broadway, or just near Broadway, period. I love 42nd Street. I love Times Square. I feel like I could enter the M&M’s store and then suddenly end up at The Lion King. It’s where dreams are made.” Tank Top, Pants, and Belt Dsquared2. BLUE BOTTLE “Blue balls? What did you say?” ——— WEST HOLLYWOOD “I always say it’s not for me and then I go to a gay bar and have so much fun. I think I’m just jealous of the gays who spend time in West Hollywood, because I’m never invited.” ——— VOICE NOTES “Text should be eliminated. Voice notes are in and voice notes are it. You can say the meanest thing in a voice note, but because they can hear your voice, it sounds sweet.” Jacket Loewe. Pants and Belt Stylist’s Own. ——— Grooming: Alexa Hernandes using Schwarzkopf at The Wall Group. Photography Assistant: Morganne Boulden. Fashion Assistant: Parker Harwood. Production Management: Ernie Torres. Walton Goggins and Danny McBride on Nervous Breakdowns and Spiritual Awakenings Captain America’s Danny Ramirez Gives Lewis Pullman His Best G-Force Face Celebrity Psychic Wendy L’Belle-Tividad Taps Into the Frequency of Love “I’m the Melancholy Party Photographer”: Talking Love and Natural Light With Marcus Maddox How Baylen Dupree Turned Tourette’s TikTok Into Television Stardom"
author = "Ary Russell"
