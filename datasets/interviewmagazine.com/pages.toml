title = '"Neat, Sexy, London Girl Braving the Rain": Burberry FW25'
description = "At the Tate Modern, our fashion director Dara gathered Burberry FW25 hot takes from Kim Cattrall, Julia Hobbs, an anonymous knight, and more."
full_description = "LFW “Neat, Sexy, London Girl Braving the Rain”: Burberry FW25 By Dara February 25, 2025 MONDAY 7:42 PM FEBRUARY 24, 2025 LONDON After Daniel Lee closed out London Fashion Week with a scintillating collection of reimagined classics for Burberry FW25, our fashion director Dara took her iPhone for a spin around the Tate Modern, gathering post-show hot takes from Kim Cattrall, British Vogue editor Julia Hobbs, an anonymous knight, and more! ——— DARA: Your name? JULIA HOBBS: Julia fucking Hobbs. DARA: You look amazing in your Burberry trench coat buttoned to the top. HOBBS: Babe, I have barely anything underneath it. DARA: Oh, are you naked underneath the trench? Flasher vibes? HOBBS: I’m naked underneath. DARA: Oh my god. What’s the vibe here? What did you see? Did you love it? HOBBS: I really loved it. I love a jean and a boot. DARA: Same. HOBBS: And better still, a jogger and a boot. Neat, sexy, London girl braving the rain. It never fucking stops raining. DARA: Can I get a picture of you? HOBBS: Yes. DARA: Hot. HOBBS: Are you going to the party? DARA: I am. JESSICA WILLIS: Hi! This jacket’s fab. DARA: Thank you, I’m in head-to-toe Burberry. WILLIS: It looks great on you. DARA: What does Jess Willis think about London tonight? Have you taken a selfie with the knight? WILLIS: No, where? DARA: That one right there. He’s not doing press though. I tried to interview him and he said no. [Laughs] Are you staying in London? WILLIS: Milan tomorrow. DARA: Alright, have a fun night. Maybe see you later. MIA RICANATI: Sorry, I don’t want to bother you. I just think you’re fabulous and incredible and I saw you and I was sitting behind you and I was like, “Wow.” I go to fashion school and I follow what you do. DARA: Oh my god, thank you. I love you. Can you say your name? RICANATI: Mia Ricanati. DARA: Wait, what do you do in fashion school? RICANATI: I study fashion business. DARA: Okay, and what was your fashion business take on tonight? RICANATI: Incredible. Heritage, textures, saddle. Furs. It was gorgeous and you look beautiful. DARA: Oh my god, thank you babe. It’s so good to meet you. Oh my god, Kim Cattrall, how are you? You look gorgeous. KIM CATTRALL: So do you! DARA: Thank you, I’m in a full Burberry moment. Are you in full Burberry? CATTRALL: Yes. This is my partner. DARA: Hi, I’m Dara. Nice to meet you. Can I ask you what you thought of the show for Interview magazine? CATTRALL: Yeah, I loved it. DARA: What would you wear? CATTRALL: Pretty much all of it. Even the men’s. DARA: The men’s stuff was good, like the coats and the big knits. CATTRALL: They’re gorgeous. The collars, the tassels. DARA: Those are really good. Can I get a picture of you real quick? CATTRALL: Let’s do it. [Recording pauses] DARA: Are you still not answering questions? KNIGHT: No. DARA: Oh, okay. Can you clink for me? KNIGHT: [Clinks] DARA: Audible clinking from the knight at Burberry. Thank you. DARA: Now I’m in some gallery in the Tate Modern looking at some art and it’s beautiful. I’m going to go see the models now. Hopefully they can spill some tea about this collection. Can you say your name for me? ASHLEY FLETCHER: Ashley [Fletcher]. DARA: Ashley, I’m talking to you for Interview magazine. Did you love your look? FLETCHER: Absolutely. It was giving dope and bougie at the same time. DARA: Okay! I like your sunglasses. I’m gonna get a picture. You looked amazing. CHU WONG: Wow. DARA: Oh my god, hi. Say your name into the phone. CHU WONG: Hello, hi. This is Chu Wong. LINA SHANG: Hi, this is Lina Zhang. DARA: What were your looks and tell me about your vibe. CHU WONG: My look was quite feminine as I got a very flowy dress, but I like it because it’s super, super humid inside. I really like the collection this season. It’s giving. DARA: Are you going to the after party? CHU WONG: I’m not sure. Will you be there? DARA: I think we’ll pass by. CHU WONG: Okay, cool. See you later. Walton Goggins and Danny McBride on Nervous Breakdowns and Spiritual Awakenings Captain America’s Danny Ramirez Gives Lewis Pullman His Best G-Force Face Celebrity Psychic Wendy L’Belle-Tividad Taps Into the Frequency of Love “I’m the Melancholy Party Photographer”: Talking Love and Natural Light With Marcus Maddox How Baylen Dupree Turned Tourette’s TikTok Into Television Stardom"
