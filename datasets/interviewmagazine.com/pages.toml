full_description = 'Music SOUND ADVICE Jojo Orme of Heartworms Made Us a Playlist Fit for McQueen March 3, 2025 The London-based musician and McQueen frontwoman made us the ultimate alt-couture playlist filled with everything from Chopin to Depeche Mode. IDOL Johnny Suh Tells Madeline Argy His Secrets February 26, 2025 Away from the screaming fans who swarmed their Paris Fashion Week meet-up, Madeline Argy called up the K-pop superstar for an intimate conversation, just the two of them. POET “For a Moment, You Become the Art”: Yung Lean, by Vincent Cassell February 25, 2025 With his eighth album around the corner and his acting debut on the horizon, the genre-blurring Swedish musician caught up with the veteran French actor for a conversation about reshaping perceptions and shedding personas. SMOKE BREAK “I’m Just Ready to Fucking Dance”: Kicking Off the Mayhem Era With Nick Gaga February 25, 2025 Over a pack of Capri Blues, we talked wigs, cigs, and “Mayhem” with Nick Gaga, the world’s premiere Mother Monster impersonator. ROCK AND ROLL How the Director of Becoming Led Zeppelin Got the World’s Most Tight-Lipped Band to Talk February 24, 2025 “The film is made for movie theaters and the biggest screens possible with the biggest sound systems,” says the director of “Becoming Led Zeppelin,” a new and unvarnished documentary about the band. SOUND ADVICE Here’s the Soundtrack to Your Next Dinner Party, Courtesy of Benny Blanco February 20, 2025 Our March cover star Benny Blanco couldn’t pick just one song that reminds him of his fiancée Selena Gomez (because everything does, of course). SOUND ADVICE Rapper 9mice Made Us the Playlist of His Apocalyptic Fantasies February 19, 2025 In this week’s Sound Advice, the enigmatic Slavic musician made us a playlist and revealed his nightlife philosophy: “I don’t walk the same path twice.” ICON Inside Goodbye Horses, the First Documentary About the Mysterious Q Lazzarus February 18, 2025 Filmmaker Eva Aridjis Fuentes joined us to talk about her serendipitous friendship with the most elusive of rock icons, the late Q Lazzarus. COVER Benny and Selena Against the World February 14, 2025 As they get set to release their new album “I Said I Love You First,” Hollywood’s preeminent power couple take Mel Ottenberg inside their whirlwind romance. SOUND ADVICE Lexee Smith Made Us a Playlist For Getting Loose February 10, 2025 “I would have loved to be the feminine visual embodiment of a Jimi Hendrix guitar solo.” SOUND ADVICE Rapper FearDorian Hopes Their New Album Is Playing in Heaven February 6, 2025 What’s the best way to listen to “Leaving Home,” the rapper’s sophomore album? “A walk by yourself in slight rain, or in your room after a date gone well,” they told us. PUNK “I Don’t Give a Fuck About the Rules”: Yseult, by Gabriella Karefa-Johnson February 5, 2025 The French superstar tells fashion editor Gabriella Karefa-Johnson why she’s not to be played with. SOUNDCHECK “I Want to Have People Hypnotized”: Five Minutes Backstage With 070 Shake February 4, 2025 “I can’t fucking move a muscle,” the singer told us before her sold-out show at Kings Theater in Brooklyn. “I am the worst dancer ever, so it wouldn’t be fair to the audience if I started dancing.” SHOWGIRL Lexee Smith and Addison Rae on Dance, Discipline, and Dressing for Chaos February 3, 2025 L.A.’s reigning dancer du jour talks Texas roots, toxic coaches, and killer fits with her friend and collaborator. SOUND ADVICE “Chapstick, Phone, Gummy Worms”: Soccer Mommy Made the Indie Playlist of Our Dreams January 31, 2025 In this week’s installment of Sound Advice, the Nashville-based singer-songwriter tells us her dream musical coven and all-time favorite guitar riff. ANNIVERSARY “Every Week Is a High Wire Act”: Questlove and Maya Rudolph on 50 Years of Saturday Night Live January 29, 2025 To celebrate his new documentary, which chronicles a half-century of music on “Saturday Night Live,” Questlove joined SNL veteran Maya Rudolph for a walk down memory lane. SOUND ADVICE The Boys of Wallows Made Us a Playlist to Ease Your Winter Blues January 23, 2025 In this week’s Sound Advice, Dylan, Braeden, and Cole of the alt-rock trio Wallows tell us their dream fourth member of the band and who they trust most with the aux. IN CONVERSATION Jamie xx Tells Olafur Eliasson How He Found His Way Back to Music January 22, 2025 “I was just one of the weird kids at school, and that was my way out,” the musician told Olafur Eliasson when the two got together earlier this month to talk about getting vulnerable in their art. SMOKE BREAK “I’m Still in My God Body”: A Backstage Joint With Niambi January 22, 2025 In this week’s installment of Smoke Break, we lit up with hip-hop singer before talking spirituality, bodega weed, and her brand-new EP, “Taboo.” DROP How Tamara Lindeman of The Weather Station Makes Music for the Anthropocene January 17, 2025 Before dropping her seventh album with The Weather Station, the singer-songwriter joined us to talk about making peace with imperfection and climate collapse. .alm-btn-wrap{display:block;margin:0 0 25px;padding:10px 0 0;position:relative;text-align:center}.alm-btn-wrap:after{clear:both;content:"";display:table;height:0}.alm-btn-wrap .alm-load-more-btn{appearance:none;background:#ed7070;border:none;border-radius:4px;box-shadow:0 1px 1px rgba(0,0,0,.04);color:#fff;cursor:pointer;display:inline-block;font-size:15px;font-weight:500;height:43px;line-height:1;margin:0;padding:0 20px;position:relative;text-align:center;text-decoration:none;transition:all .3s ease;user-select:none;width:auto}.alm-btn-wrap .alm-load-more-btn.loading,.alm-btn-wrap .alm-load-more-btn:hover{background-color:#e06161;box-shadow:0 1px 3px rgba(0,0,0,.09);color:#fff;text-decoration:none}.alm-btn-wrap .alm-load-more-btn:active{box-shadow:none;text-decoration:none}.alm-btn-wrap .alm-load-more-btn.loading{cursor:wait;outline:none;padding-left:44px;pointer-events:none}.alm-btn-wrap .alm-load-more-btn.done,.alm-btn-w