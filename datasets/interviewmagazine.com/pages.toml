full_description = 'Walton Goggins and Danny McBride on Nervous Breakdowns and Spiritual Awakenings STYLE “How Do You Like That?”: Positively Cathy Reviews Some Recent Runway Looks by Interview KILLS Director Osgood Perkins Tells Us Why Horror Movies Are the Best Medicine by Zachary Lee RORSCHACH TEST “That’s a Big Fat No”: Kristin Cavallari on Cabo, Co-Parenting, and Combat Boots on the Beach by Interview PFW “The Redcoats Are Coming”: Dara’s Dispatch From Dior FW25 by Mekala Rajagopal and Dara POET “For a Moment, You Become the Art”: Yung Lean, by Vincent Cassell by Vincent Cassel MFW “Did You See That Corset?”: Ice Spice Reviews Versace FW25 by Mel Ottenberg ONLINE Jeremy Gordon on Media Jobs, Male Loneliness, and Modern Malaise March 4, 2025 “That failed middle class of the millennial generation was certainly on my mind,” said the author when he joined us to discuss his debut novel, “See Friendship.” SOUND ADVICE Jojo Orme of Heartworms Made Us a Playlist Fit for McQueen March 3, 2025 The London-based musician and McQueen frontwoman made us the ultimate alt-couture playlist filled with everything from Chopin to Depeche Mode. REALITY How Baylen Dupree Turned Tourette’s TikTok Into Television Stardom March 3, 2025 “If you’re going to talk about me and who I am, I want it to come out of my mouth and my mouth only,” says the star of TLC’s “Baylen Out Loud.” SUPERHERO Captain America’s Danny Ramirez Gives Lewis Pullman His Best G-Force Face February 28, 2025 The 32-year-old actor and “Captain America” star called his friend and former co-star from the backseat of a Cadillac to talk wedgies, g-force, and superheroes. CLICK Photographer Martin Parr On Trump, Tourism, and the Trials Of Modern Living February 28, 2025 “I feel pretty upbeat, but when I think about the planet and the world and our country, I can’t help but get depressed,” says the renowned photojournalist, who’s now the subject of a new documentary. MFW “Damn, It’s Good”: 100 Delicious Years of Fendi February 27, 2025 Our fashion director Dara does some on-the-ground reporting at the brand’s knockout anniversary show. MFW “I’ll Make a Stunning Cake in That”: Nara Smith Reviews Prada FW25 From Scratch February 27, 2025 On Thursday afternoon in Milan, our editor-in-chief tracked down the baked goods goddess after the Prada show to find out which looks she’d wear in the kitchen. SOUL HACKER Celebrity Psychic Wendy L’Belle-Tividad Taps Into the Frequency of Love February 27, 2025 The Kundalini-awakened intuit tells her client, the painter Ariana Papademetropoulos, how she keeps her heart chakra wide open. BACKSTAGE How Alastair Curtis Is Rescuing the Works of the Playwrights Lost to AIDS February 27, 2025 “We shouldn’t look to Ryan Murphy to direct us to the next bit of forgotten queer history,” says the founder of The AIDS Plays Project. “We should have a compunction to go back and search for context.” SMOKE BREAK “I’m the Melancholy Party Photographer”: Talking Love and Natural Light With Marcus Maddox February 27, 2025 “It starts out with young, sexy people in love, very blissful,” the photographer says of “Hey Lover,” his brand-new monograph. “But then it progresses into this sequence of unhappiness.” XXX “The Only Way Out Is to Get Fucked”: Behind the Scenes of the Brand-New Brazzers Book February 26, 2025 After spending a year trailing the biggest stars in the porn industry, photographer Rosie Marks and writer Esra Padgett told us what they learned aboard the Bang Bus. IDOL Johnny Suh Tells Madeline Argy His Secrets February 26, 2025 Away from the screaming fans who swarmed their Paris Fashion Week meet-up, Madeline Argy called up the K-pop superstar for an intimate conversation, just the two of them. LFW “Neat, Sexy, London Girl Braving the Rain”: Burberry FW25 February 25, 2025 Our fashion director Dara took her iPhone for a spin around the Tate Modern, gathering hot takes from Kim Cattrall, Julia Hobbs, an anonymous knight, and more. SMOKE BREAK “I’m Just Ready to Fucking Dance”: Kicking Off the Mayhem Era With Nick Gaga February 25, 2025 Over a pack of Capri Blues, we talked wigs, cigs, and “Mayhem” with Nick Gaga, the world’s premiere Mother Monster impersonator. IN CONVERSATION Obsessed With Awards Season? Then Daniel D’Addario’s The Talent Is For You. February 25, 2025 The author and Chief Correspondent at Variety joined Katie Kitamura to talk about his debut novel, “The Talent,” and the dark underbelly of a Hollywood awards season. BACKSTAGE “The Laughter Is a Trojan Horse”: Behind the Scenes of English With Tala Ashe February 25, 2025 At the Todd Haimes Theater, the Iranian-American actor joined us to talk about bringing Sanaz Toossi’s play to Broadway in today’s charged political climate. RORSCHACH TEST “That’s a Red Flag for Me”: Owen Thiele on Screen Time, Self-Tapes, and Cybertrucks February 24, 2025 The actor and host of the “In Your Dreams” podcast lets it all out. ROCK AND ROLL How the Director of Becoming Led Zeppelin Got the World’s Most Tight-Lipped Band to Talk February 24, 2025 “The film is made for movie theaters and the biggest screens possible with the biggest sound systems,” says the director of “Becoming Led Zeppelin,” a new and unvarnished documentary about the band. MODEL Romeo Beckham Stuns in New Photos February 21, 2025 David and Victoria’s second child shows off his modeling chops in our March issue. RETROSPECTIVE “I’m So Old Testament, Honey”: Deborah Kass, in Conversation With Titus Kaphar February 21, 2025 Ahead of a new exhibition of her paintings at Salon 94, the pioneering artist joined her friend Titus Kaphar to ponder Reaganomics, race theory, and how to resist the regime. .alm-btn-wrap{display:block;margin:0 0 25px;padding:10px 0 0;position:relative;text-align:center}.alm-btn-wrap:after{clear:both;content:"";display:table;height:0}.alm-btn-wrap .alm-load-more-btn{appearance:none;background:#ed7070;border:none;border-radius:4px;box-shadow:0 1px 1px rgba(0,0,0,.04);color:#fff;cursor:poin