["https://www.interviewmagazine.com/fashion/damn-its-good-100-delicious-years-of-fendi"]
title = '''"Damn, It's Good": 100 Delicious Years of Fendi'''
description = "Our fashion director Dara caught up with Taylore Scarabelli the morning after the Fendi FW25 knockout anniversary show."
full_description = "MFW “Damn, It’s Good”: 100 Delicious Years of Fendi By Dara February 27, 2025 THURSDAY 2:30 PM FEBRUARY 27, 2025 PARIS Silvia Venturini Fendi paid homage to five generations of her family’s namesake label by looking to the past, and future. After a knockout FW 25/26 runway presentation featuring leather dresses, scalloped hems, and furs galore, show attendees including Sarah Jessica Parker, Naomi Ackie, and Elizabeth Olsen swirled their way to the afters, where Sean Paul and spaghetti were served up to Fendi-adorned guests. The morning after, our fashion director Dara caught up with our senior editor Taylore Scarabelli over text to talk Lulu Tenney, lux leathers, and the celebrities she’s too shy to talk to. ——— TAYLORE SCARABELLI: Gm how was Fendi?? DARA: Hiii it was chaos lol but fun sorry crazy night/day just got to Paris. SCARABELLI: Oh yes for your top secret photo shoot… Btw this is gonna be our review for Fendi. We just text and then post it. DARA: Oh I love that. Fendi was like a fashion show in a movie. Cinematic fever dream. SCARABELLI: I was looking through the runway with José from Vogue last night and I was like, “Damn, it’s good.” DARA: The music. The lights. Silvia’s twin grandsons opening up a giant door to reveal Lulu Tenney in a fur coat pumping for her life—insane! SCARABELLI: The furs… I’m sorry but I love. DARA: Ya it was actually so fab. There were a lot of good ones. SCARABELLI: Wait I’m pulling up pix. DARA: Show me your favs. SCARABELLI: Was SJP there in her baguette? DARA: Yes. She cheered at the end so cute. SCARABELLI: I love that she’s just Carrie IRL. DARA: Literally. Actually she’s the last person I saw before exiting thru the backstage after the party. I was too starstruck to talk to her but she looked amazing. We were just like in a hallway alone lmao. SCARABELLI: Omg yeah I would need a champagne before approaching her. DARA: Right I didn’t even have a sip bc I was getting that content honey. I did have the pasta tho… SCARABELLI: Okay so obviously that opening coat with the high collar is my fav but overall the styling was so NASTY like how I wanna dress… The long skirts over the boots, the scalloped hems. DARA: The high collars in general were really amazing—the black funnel neck wool coat I kinda need. It was sinister. SCARABELLI: And the leather dresses wow. DARA: The bags that matched them were so fabulous actually—the striped dress on Lina and her matching bag was so juicy IRL. SCARABELLI: And the matching boot! DARA: Wait let me check the collection…Lindsey Wixson sent meeee she was diva down. SCARABELLI: She was my Gabbriette back in the day. The kids don’t know!!! DARA: NO LITERALLY. THE it-girl. SCARABELLI: Also Gabbriette on the runway! How was she? DARA: It was so fab seeing her backstage she looked SO fresh and soft. She was like,”I never feel so lady.” Loved her giving that Roman diva vibe. SCARABELLI: She’s so pretty. Wait, where was the spaghetti? The afters? DARA: Yesss. They were handing out like rigatoni and risotto. It was really chic. I clinked my pasta bowls with the women from the atelier… They were getting their life for Sean Paul performing. SCARABELLI: Lol Sean Paul at Fendi 100 years I love!! She’s not granny she’s getting down and dirty. DARA: It was actually amazing—backup dancers wearing full Fendi monogram. SCARABELLI: Obsessed. Urg not me getting invited to “Grand diner at the Louvre.” No Paris for me it’s time to edit the next issue. I g2g talk to you soon 💋💋 DARA: AU REVOIR. Walton Goggins and Danny McBride on Nervous Breakdowns and Spiritual Awakenings Captain America’s Danny Ramirez Gives Lewis Pullman His Best G-Force Face Celebrity Psychic Wendy L’Belle-Tividad Taps Into the Frequency of Love “I’m the Melancholy Party Photographer”: Talking Love and Natural Light With Marcus Maddox How Baylen Dupree Turned Tourette’s TikTok Into Television Stardom"
author = "Taylore Scarabelli"
