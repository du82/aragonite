title = "Interviews by Shane Hudson"
full_description = "On this website I interview people that make digital products on teams of all shapes and sizes. What do they all have in common? How does one approach differ to another? Does the size of the team influence how work gets done? In this series of mostly anonymous interviews, I try to answer these questions. I decided to keep it anonymous so that my guests can talk freely about the pain points that they have encountered. It will be interesting to see how much overlap there is between interviews. I have no doubt there will be something interesting for all of us, even if it is to realise it's not just us facing a particular problem or maybe these interviews will help with a solution. If you are interested in being interviewed, please fill out some starter questions (will open a Google Form) and I will be in touch."
