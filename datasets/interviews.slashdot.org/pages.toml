["https://interviews.slashdot.org/~king*jojo"]
title = "king*jojo - Slashdot User"
full_description = '''176611059 submission Submission + - AI agent now lurks within Opera browser, for the lazy (theregister.com) Submitted by king*jojo on Tuesday March 04, 2025 @07:45AM king*jojo writes: The Opera web browser now boasts "agentic AI," meaning users can ask an onboard AI model to perform tasks that require a series of in-browser actions.The AI agent, referred to as the Browser Operator, can, for example, find 12 pairs of men's size 10 Nike socks that you can buy. This is demonstrated in an Opera-made video of the process, running intermittently at 6x time, which shows the user has to type out the request for the undergarments rather than click around some webpages. 176541823 comment Comment In a strange way, I sort of welcome this new era (Score 1) 142 by king*jojo on Tuesday February 25, 2025 @09:23AM (#65193851) Attached to: 1,000 Artists Release 'Silent' Album To Protest UK Copyright Sell-Out To AI Just for the absolutely nutty things that can ushered in because of it. And I'll freely admit to doing small things to nudge it along. Awhile ago, I dumped of bunch of tracks to soundcloud under a "creative commons" license, knowing they would be scraped up with no delay or hesitation. One was--for instance--a simple, pleasant melody using canned steel drums with an acoustic guitar accompaniment. I then put the entire mix through a couple distortion boxes, and tweaked it until it sounded suitably hellish. Then uploaded it with "#tropicália" and "#bossanova" tags, hoping in some small way, an AI will think it's what bossa nova is suppose to sound like, and replicate it when prompted. Anyway, doing something similar way be a more effective protest for major artists, rather than merely silence which will just be discarded immediately. 176373015 comment Comment Re:Now that I've twisted my brain into a pretzel (Score 1) 164 by king*jojo on Monday February 24, 2025 @01:54PM (#65191999) Attached to: Google To Eliminate SMS Authentication in Gmail, Implement QR Codes Using SMS for 2FA is what makes no sense. It's time everyone should get rid of it. Yeah, that was the first conundrum. But the whole 'making a senseless thing even more senseless' are when things became... painful.'''
year_published = 2025
clearnet = "https://interviews.slashdot.org/~king*jojo"
