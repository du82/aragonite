title = "The Rise of Never-Ending Job Interviews - Slashdot"
description = "An anonymous reader quotes a report from the BBC: Every jobseeker welcomes an invitation to a second interview, because it signals a company's interest. A third interview might feel even more positive, or even be the precursor to an offer. But what happens when the process drags on to a fourth, fift..."
full_description = '''149755571 story The Rise of Never-Ending Job Interviews (bbc.com) 205 Posted by BeauHD on Monday August 02, 2021 @07:02PM from the bad-hiring-practices dept. An anonymous reader quotes a report from the BBC: Every jobseeker welcomes an invitation to a second interview, because it signals a company's interest. A third interview might feel even more positive, or even be the precursor to an offer. But what happens when the process drags on to a fourth, fifth or sixth round -- and it's not even clear how close you are to the 'final' interview? That's a question Mike Conley, 49, grappled with earlier this year. The software engineering manager, based in Indiana, US, had been seeking a new role after losing his job during the pandemic. Five companies told him they had to delay hiring because of Covid-19 -- but only after he'd done the final round of interviews. Another three invited him for several rounds of interviews until it was time to make an offer, at which point they decided to promote internally. Then, he made it through three rounds of interviews for a director-level position at a company he really liked, only to receive an email to co-ordinate six more rounds. "When I responded to the internal HR, I even asked, 'Are these the final rounds?,'" he says. "The answer I got back was: 'We don't know yet.'" That's when Conley made the tough decision to pull out. He shared his experience in a LinkedIn post that's touched a nerve with fellow job-seekers, who've viewed it 2.6 million times as of this writing. Conley says he's received about 4,000 public comments of support, and "four times that in private comments" from those who feared being tracked by current or prospective employers. [...] In fact, the internet is awash with similar stories jobseekers who've become frustrated with companies -- particularly in the tech, finance and energy sectors -- turning the interview process into a marathon. That poses the question: how many rounds of interviews should it take for an employer to reasonably assess a candidate before the process veers into excess? And how long should candidates stick it out if there's no clear information on exactly how many hoops they'll have to jump through to stay in the running for a role? Google recently determined that four interviews was enough to make a hiring decision with 86% confidence, noting that there was a diminishing return on interviewer feedback thereafter. "John Sullivan, a Silicon Valley-based HR thought leader, says companies should nail down a hire-by date from the start of the recruitment process, because the best candidates only transition the job market briefly," reports the BBC. "According to a survey from global staffing firm Robert Half, 62% of US professionals say they lose interest in a job if they don't hear back from the employer within two weeks -- or 10 business days -- after the initial interview. That number jumps to 77% if there is no status update within three weeks. " ← You may like to read: → Australian Court Rules An AI Can Be Considered An Inventor On Patent Filings US To Halt Offensive Cyber Operations Against Russia Tesla Moves Towards Launching an Uber Competitor Utah Could Become America's First State To Ban Fluoride In Public Water How the British Broke Their Own Economy Australia, With No Auto Industry To Protect, is Awash With Chinese EVs Submission: The Rise of Never-Ending Job Interviews (function($){ $('.js_disp_only').show(); $('a.jshandle_related').on('click', '', function(e) { e.preventDefault(); var url = $(this).data('goto-url'); window.location = url }); })($j); Steam Survey Shows Linux Marketshare Hitting 1.0%'''
