description = '''Christine Peterson is a long-time futurist who co-founded the nanotech advocacy group the Foresight Institute in 1986. One of her favorite tasks has been contacting the winners of the institute's annual Feynman Prize in Nanotechnology, but she also coined the term "Open Source software" for that fam...'''
full_description = "99223263 story Interviews: Ask a Question To Christine Peterson, the Nanotech Expert Who Coined the Term 'Open Source' 246 Posted by EditorDavid on Monday April 02, 2018 @05:34AM from the talking-to-a-pioneer dept. Christine Peterson is a long-time futurist who co-founded the nanotech advocacy group the Foresight Institute in 1986. One of her favorite tasks has been contacting the winners of the institute's annual Feynman Prize in Nanotechnology, but she also coined the term \"Open Source software\" for that famous promotion strategy meeting in 1998. Now Christine's agreed to answer questions from Slashdot readers. We'll pick the very best questions and forward them along for answers. Interestingly, Christine was also on the Editorial Advisory Board of NASA's Nanotech Briefs, and on the state of California's nanotechnology task force. Her tech talks at conferences include \"Life Extension for Geeks\" at Gnomedex and \"Preparing for Bizarreness: Open Source Physical Security\" at the 2007 Singularity Summit. Another talk argues that the nanotech revolution will be like the information revolution, except that \"Instead of with bits, we should do it with atoms,\" allowing molecule-sized machines that can kill cancer and repair DNA. Her most recent publication is \"Cyber, Nano, and AGI RIsks: Decentralized Approaches to Reducing Risks.\" Christine graduated from MIT with a bachelors in chemistry. So leave your best questions in the comments. (Ask as many questions as you'd like, but please, one per comment.) We'll pick the very best questions and forward them along for answers. ← Related Links → CRISPR-Altered Plants Are Not Going To Be Regulated (For Now) 'How I Coined the Term Open Source' (function($){ $('.js_disp_only').show(); $('a.jshandle_related').on('click', '', function(e) { e.preventDefault(); var url = $(this).data('goto-url'); window.location = url }); })($j); Mark Zuckerberg: Tim Cook is 'Extremely Glib'"
