full_description = '''The Fine Print: The following comments are owned by whoever posted them. We are not responsible for them in any way. My human intuition said you're pulling a fast one, possibly with AIs from books or movies. Or perhaps it's a joke. So I fed your post to an AI via the google. I think that AI Overview means Gemini? It took you completely seriously, but the AI answer did not convince me that any of them are actual AI systems. The later hits actually indicated that they probably exist in the subcategory of AI-powered image generators. (Related argument recently with someone about not trusting the AI Overview. I sure wanted to My human intuition said you're pulling a fast one, possibly with AIs from books or movies. Or perhaps it's a joke. You wrote that long ass post, didn't know WTF GP was referring to, and didn't look up any of the key terms directly? Flux Schnell: https://huggingface.co/black-f... [huggingface.co] "Stabe(sic) Diffusion", IE: Stable Diffusion: https://en.wikipedia.org/wiki/... [wikipedia.org] DALL-E 3: https://openai.com/index/dall-... [openai.com] I'm saying you're being daft on purpose. What part of my message wasn't properly received? Or are you just Naked At Keyboard? :-) You seem to do that a lot: https://slashdot.org/comments.... [slashdot.org] https://slashdot.org/comments.... [slashdot.org] https://slashdot.org/comments.... [slashdot.org] https://slashdot.org/comments.... [slashdot.org] https://slashdot.org/comments.... [slashdot.org] This seems to be a common occurence on /. lately. I got into the same sort of interaction with someone a few weeks back. He just wanted to argue with everything anyone said. And then you go look at his history and that seems to be all he could do. And each time it was the same format. At least the guy arguing with me didn't 'break' once he couldn't argue anymore. That guy would just keep going forever, even if you said the sky was blue, he was going to argue about it. Certainly not limited to Slashdot, but a general effect of computers, me thinks. In the form of a joke, I'm sure that more than 35 years ago I was saying something like "Too much computer use is bad for mental health." But I didn't cut down, and perhaps I've become one of the poster children for the problem?'''
