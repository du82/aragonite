["https://interviews.slashdot.org/poll/3273/your-main-desktop-os-at-home-is"]
title = "Slashdot Poll | Your main desktop OS at home ..."
full_description = '''The Fine Print: The following comments are owned by whoever posted them. We are not responsible for them in any way. "Main" as in what's getting the most use as a desktop environment? Sadly, Windows. Because I haven't rebuilt my workstation yet, and it's the only OS that'll run properly on the cheap box I bought as a media center for my television. But in terms of quantity overall (and excluding the 'desktop' requirement), I'm majority Linux of one flavour or another. Given screentime, i'd say Android is my main 'desktop OS'. Yes, one should call it a ''coffeetable OS''. Hmm... I, too, feel Android is too far from Linux to call it the same. I haven't even used a terminal window for several of my latest smartphones... Lots of smartphone users even have no idea what an OS is, so I guess they would ignore the poll? I use termux on Android frequently as my terminal. There I can run python to do calculations, etc.On my cellphone I use Linphone to talk on my VOIP number.On my desktop to talk on VOIP I use.... Linphone. iOS is MacOS and MacOS is NeXTStep and that has BSD underpinnings, but also MACH. Processes run on MACH. Android is Linux underneath and it would be recognizable and comprehensible to anyone familiar with even very old UNIX, once the terminal is enabled, though there are obviously lots of differences. The Android user environment is not at all Unixlike, but there is such an environment on the device. You just aren't expected to need to use it to get things done. But it's there if you want it. I got to use NeXTStep at a job for a time and really liked it but it was different enough from my previous experience on mostly System V Unix that it was hard at first and then I switched jobs again and never really played with it again. It wasn't so much the operating system that was hard for me, but the whole Objective C vs standard C and I wanted to make everything perfect when I should haven't tried to be such a perfectionist. For example I spent way too much time making little things work just exactly t'''
year_published = 2025
clearnet = "https://interviews.slashdot.org/poll/3273/your-main-desktop-os-at-home-is"
