title = "Interviews: Ask Social Network Minds.com CEO and Founder Bill Ottman a Question - Slashdot"
description = '''As you may have noticed, Facebook is not cool anymore. The social juggernaut has been mired in controversies -- infamous privacy scandals or the company's ruthless "grow fast and break things" approach to gain users, to name a few. Luckily enough, some people are trying to build new social networks ...'''
full_description = '''106638088 story Interviews: Ask Social Network Minds.com CEO and Founder Bill Ottman a Question 84 Posted by msmash on Friday February 15, 2019 @11:15AM from the ask-away dept. As you may have noticed, Facebook is not cool anymore. The social juggernaut has been mired in controversies -- infamous privacy scandals or the company's ruthless "grow fast and break things" approach to gain users, to name a few. Luckily enough, some people are trying to build new social networks and are coming up with interesting original ideas. Minds.com is one such social network. The open source social network, which has been operational since 2012, works on a point-earning/exchange system to give users full control over the reach of their posts. One of the complaints people have with Facebook and Twitter is that they feel their posts are not being seen by all of their friends. Minds.com lets users earn points and then trade those points to boost their posts on the platform. Users earn tokens by being active on the platform and engaging in uploading, voting, commenting and other similar activities. They can then use these tokens, which can be exchanged within the platform, to boost the reach of their posts. The company last year launched a cryptocurrency reward program based on the ethereum blockchain for all users on the platform. Minds says it does not determine what should be censored. Users are free to post whatever they want. (You can follow us on Minds.) We are excited to announced that Minds founder and chief executive Bill Ottman has agreed to do an interview with us. If you have a question about Minds.com for him or his take on the current social networking space, feel free to ask it in the comments section below. ← Related Links → Visa, Mastercard Mull Increasing Fees For Processing Transactions: Report Mark Zuckerberg Addresses the Cambridge Analytica Scandal, Says Facebook 'Made Mistakes' in Protecting DataTop Facebook Executive Defended Data Collection In 2016 Memo, Warned That Facebook Could Get People Killed'We Will Never Sell-out or Compromise Our Principles. That Would Be Like Murder': The Slashdot Interview With CEO and Founder of Minds.com Social Network (function($){ $('.js_disp_only').show(); $('a.jshandle_related').on('click', '', function(e) { e.preventDefault(); var url = $(this).data('goto-url'); window.location = url }); })($j); Venezuela's Government Appears To be Trying To Hack Activists With Phishing Pages'''
