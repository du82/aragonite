["https://www.intothebytecode.com/1-vitalik-buterin-karl-floersch-retroactive-public-goods-funding"]
title = "Vitalik Buterin & Karl Floersch: Retroactive Public Goods Funding"
description = "This is a conversation with Vitalik Buterin (the creator of Ethereum) and Karl Floersch (a long-time Ethereum researcher who is working on Optimism). We talk about …"
full_description = "This is a conversation with Vitalik Buterin (the creator of Ethereum) and Karl Floersch (a long-time Ethereum researcher who is working on Optimism). We talk about topics related to public goods funding, governance models, and new social network designs. Here is my conversation with Vitalik Buterin & Karl Floersch. Vitalik is the creator of Ethereum, and Karl is a long-time Ethereum researcher who is working on Optimism (the Layer 2 optimistic rollup). We begin the conversation with a focus on retroactive public goods funding - a compelling idea that Vitalik and Karl shared earlier this year. We then move onto topics like decoupling value creation and value capture, the sustainability of public goods, Ether’s Phoenix (a play on Roko’s Basilisk, the thought experiment which originated in the LessWrong community), and governance models as lying somewhere on the continuum from being exclusionary to being conformist. Towards the end of the conversation, we talk about personal tokens and new social network designs.I hope you enjoy!Into the Bytecode:- Sina Habibian on X: https://twitter.com/sinahab- Sina Habibian on Farcaster - https://warpcast.com/sinahab- Into the Bytecode: https://intothebytecode.comDisclaimer: this podcast is for informational purposes only. It is not financial advice or a recommendation to buy or sell securities. The host and guests may hold positions in the projects discussed. Sina [00:00:18]: Welcome to Into the Bytecode. Today I sat down with Vitalik Buterin, who as you probably know, is the creator of Ethereum, and Karl Floersch, a long-time researcher in this space, who's now working on Optimism, the layer two optimistic roll up. We started the conversation by talking about retroactive public goods funding, which is a pretty compelling idea that Vitalik and Karl shared earlier this year. And then we moved on to talking about topics like decoupling value creation and value capture. The sustainability of public goods, Ethers Phoenix, which is a play on Roko's Basilisk, is the thought experiment that originated in the less wrong community. And we talked about governance models and how they lie somewhere on the continuum from being exclusionary to being conformist."
year_published = 2021
