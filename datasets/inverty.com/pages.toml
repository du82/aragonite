["https://inverty.com/2005/12/index.html"]
title = "Archive for  December 2005"
full_description = "Well, I’m home on New Year’s Eve as a result of plans falling through and the Tube strike, but I don’t really mind because it’s given me more time to play Dragon Quest VIII, which is quite incredibly excellent for no obvious reason. I mean, the music is superb and the graphics are lovely, but as far as I can tell it’s not doing anything more than millions of other RPGs. In fact, the story is actually weaker than most RPGs. So why’s it so playable, joyous and addictive? I have no idea whatsoever. It’s very strange. Must be secret herbs and spices, or something. Tortimer gave me some party poppers. Woo. Great. New animal’s moved into town. He’s an aging, grey-haired bear called Curt. Name and nature, like. Fishing’s rubbish today. No hint of anything good. And I got a terrible new haircut that makes me look like a old Etonian fop. Well, deKay set up a ‘skate crew’ today, so I’ve sent in a request to join. As my stats were utterly humiliating I decided to play it for a while to improve my scores. Now they’re only very humilating. Result! I cannot think of a single thing to stay about this game… Um… It looks very nice… And… Monster designs in particular are wonderful… Er… It’s very playable… And… Very traditional… And… Um… Nope, there’s really nothing to say about it at all. Except maybe to moan about having to go back to town to find a save point. But that’s less of an issue now I have spells that let me teleport around. (Not that I’ve used them much, unless one of the party’s dead I tend to run everywhere so I can get some more of that lovely, lovely XP.) Popped it in for a ‘quick go’ that lasted well over three hours. Seems like a decent RPG, if nothing very special yet, but the almost complete lack of save points is an act of utterly idiocy which may well mean I don’t play it much once I’m back into a normal routine and not sat on holiday. Why can’t we at least have a suspend option if there are any actual reasons for us not saving anywhere we want?"
