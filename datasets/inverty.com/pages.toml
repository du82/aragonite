["https://inverty.com/2005/12/09/beetle-adventure-racing/index.html"]
title = "Beetle Adventure Racing"
full_description = "Beetle Adventure Racing? The Nintendo 64 game? Not an Xbox 360 game? Quite right. I was waiting for a tumble drier to arrive, so I was waiting in my bedroom, which is next to the front door, because my flat is upside-down, so I was playing the N64, because it’s in the bedroom. Clear? Anyway, it’s aged badly. The frame-rate is horrible, the PAL conversion is horrible, but I did have some sort of fun… for all of one race and then the tumble drier turned up. I’d have had longer, but I’d read Bubba Ho-Tep first."
