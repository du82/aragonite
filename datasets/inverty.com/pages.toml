["https://inverty.com/2006/07/index.html"]
title = "Archive for  July 2006"
full_description = "Crikey. I played Story Mode as Lili, which was easy enough until the final boss, who took about 45 minutes to defeat. He’s got attacks that kill two-thirds of your life bar at once. And other attacks that restore his health. I hate him. But beating him unlocked Tekken Bowl, which is a cool bowling mini-game, that rewards me with money far more quickly than fighting. My best score is 148 and I was having a good time. Unfortunately, it’s now time for a recharge. Stupid PSP battery. Well, I’m now ranked thirteenth out of sixty in first dojo. Losing lots of matches, though. And I’ve discovered the very comprehensive training mode. I’ve been looking through Lili’s move list and trying to do the moves. They’re mostly reasonable enough, but there are five or six at the bottom of the list that are just stupid. Been a while since I played a Tekken. This is slightly overwhelming in terms of sheer amount of stuff. About sixteen billion characters available and a load of different modes. After going through basic training – which isn’t of much use if you’ve ever played a fighting game before – I chose a Quick Battle and ended up being a panda. My opponent was a polar bear. I lost. Very quickly. Then I went to Story Mode and chose the default character, Lili, and went through a few fights until some penguins distracted me by being cute and sliding on their bellies and Jack-5 ripped me apart. Next up I went into Tekken Dojo mode, which wasn’t explained very well, but which seems to be very similar to Virtua Fighter 4 Evolution’s big single player mode. I set it on easy and after winning five matches in a row as Lili I’m now a 9th kyu. Which is a rank of some sort. Anyway, modes and penguins aside, it seems very slick and good fun, though I’m only one step up from button mashing right now. Well, finally, after playing EVERY DAY for SEVEN MONTHS, I shot down a UFO. And got given a rare “alien artefact” for my trouble. I put that in quotes, because the “alien artefact” is a suit of armour which, while cool, doesn’t look very alien."
