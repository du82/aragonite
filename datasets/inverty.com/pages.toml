["https://inverty.com/2006/08/index.html"]
title = "Archive for  August 2006"
full_description = "Yes, its attempts to be cool and urban are teeth-grindingly awful. And its attempts to be funny are buttock-clenchingly horrible. It’s a GTA clone with none of the wit, imagination or intelligence of Rockstar’s masterpiece in terms of script or world. But at its core, on a base game level – physics, controls, interface, mission design – it takes the GTA formula and – whisper it – makes a number of brilliant improvements, which all goes to make it huge amounts of fun. Yes, fun. It’s just massive, massive FUN. And, before we forget, incredibly awful. I can forgive the rubbish wrapping paper, because the present inside is so great. But I understand why people can’t. My high score is now 112,500, which makes me the 881st best player in the world. Seems deKay is trying to catch me up, but he’s not succeeded yet. Ha! Also tried the online mode. It’s like playing offline, but jerky and your game finishes before you want it to. This I like! It’s a classic arcade game that I don’t think I’ve ever played before. And it’s excellent. Lovely little fast-paced shooter. Quick, simple, fun, throws out achievements with gay abandon. Not that it always gives them out in the right places – I got the “Don’t Lose A Life On Level One” on my first go, despite losing a life. (I’m assuming whoever coded that little forgot that you can get extra lives very easily.) I’m currently sitting on 103,000 points, top of my friends leaderboard and 1,225th in the world. It is a bit shit that it doesn’t remember the high score table and your graphics preference when you leave the game, though. Another game that cost a tenner. It hurt my head. A lot. I was pleased when, on stage four, I finally died. Keep forgetting to post about this. But I’m playing it, oh yes. Up to level 45 now, and it’s brilliant. One of the very best games you can get for a tenner, I’d say. Downloaded the Mehrunes Razor expansion quest. Took two or three hours to get through and it was enjoyable, but I thought Mehrunes Razor itself was a dagger that killed in one hit. But, er, it doesn’t seem to do much at all as far as I can see. People tend to glow orange for a while and that’s about all. Oh. I wonder if I’m using it incorrectly somehow?"
