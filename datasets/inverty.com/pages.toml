["https://inverty.com/2006/09/index.html"]
title = "Archive for  September 2006"
full_description = "Another mission. I had to capture a town. The main thing I discovered is that snipers are utter, utter bastards. I’m really loving this game. It’s nice to have a few small squads that you care about, rather than billions of tanks. It’s a really about using everyone to the full and trying to make sure they survive. I’m doing far fewer suicide runs in this than in a standard RTS. Okay, so Company of Heroes is still running on my PC, just paused, but I’ve spent hours and hours playing Stamp mode on this. I don’t even like most of the games, for goodness sake! What am I doing? Gosh. Another intense strategy game on the PC. I just had to defend a road against a convoy of German troops. I lost nearly all my little soldier guys and there were huge explosions everywhere and panic and fire and… oh! Somehow, despite some vehicles getting through I was told I did a good job and it was on to the next mission… Or rather, it was time to save and take a break before the stress killed me. Variable, but a fair amount of fun playing two-player with wife. I won. But not at everything. She beat me badly at bowling, for example. Just done the tutorial so far. I’m not sure that I’ll be very at good this game. And it gives me chills. TOKYO 8.4M DEAD First episode complete! Hoorah! Top of my friends list (for now) and number 946 in the world (for now). It really is my favourite game of all time. The controls feel perfect now I’ve adjusted, too. Wonderful, wonderful pure gaming perfection. It’s up and it’s got the best joypad controls the game’s ever had. It’s Ultimate Doom, too, not the original version. Not quite up there with a pre-Win95 keyboard, but good enough. Tried a Deathmatch online. Was laggy as fuck for a while, but got much better once a couple of people dropped out. I lost. Horribly. The worst thing I’ve played in months. Absolutely, utterly awful. Either the camera and controls get a total overhaul before release, or this is going to be one of the worst games of all time. No, really. It’s horrific."
