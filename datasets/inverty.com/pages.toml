["https://inverty.com/2005/10/index.html"]
title = "Archive for  October 2005"
full_description = "Well, I managed to complete one quest tonight, at least. A trip to Ambermill to collect stuff from corpses. Died five or six times, but got it done. My idea for this evening was to get a new pet. I tried a couple, but they were rubbish, so I’m back with Pooh. (I did want to tame a lion… but I still don’t want to talk about that.) I have just had the single most annoying ninety minutes of my life. I don’t want to talk about it. But that lion was mine, damn it! Up to level sixteen. Pooh’s now on ‘Best Friend’ status and has been a very good pet. It helps that he eats almost anything. Been doing quests for the Undead. Trouble with them is that they don’t have hunters, so I have jump on an airship back home every time I want to get some new skills. Or, indeed, go to the auction house. Finally, I’d just like to leave with you a screen shot of the Wicker Man Festival. Goodnight. You must understand, the only reason I’m not playing right now is that I forgot to charge my mouse last night and it’s been flashing red at me for an hour or two. So I’m charging it up and feeling fairly hard done by. Garak reached ‘Best Friend’ status so, of course, I shoved him in the stables and tamed a bear instead. Bears are meant to be be good pets, I think. I’m not sure why. Maybe they can take a lot of punishment. Anyway. I named him Pooh. Not very original, granted, but I wanted to see if the game would let me do it. So, what we have learned have so far: BAD WORDS: NippleGOOD WORDS: Invalid, Garak, Bob, Pooh That’s pretty much America summed up in a nutshell, right there. Maybe I should name my next pet Janet. More. Just… more. What is there to say, really? Garak is now officially my faithful friend. I’ve gone to the Undead area to get quests, because all the ones I get given in The Barrens are too hard for me. I’m still soloing, I’ve still not grouped with anyone. Almost up top level fourteen. I got on a ship to go to the neutral area of Booty Bay, but got scared so jumped off and got killed by something nasty in the water trying to swim back to shore. There’s a centaur north-west of The Crossroads who doesn’t quite exist. There are so few actual stories coming out my play this week that I’m really struggling to understand the hold it’s got on me. When I look back, it all seems so routine. All the quests are ones I did earlier this year with my first character. All the areas are familiar to me. I don’t have to look for anything, I just have to remember. Playing a hunter is also exactly the same type of play as playing a warlock. Ranged attacks and pet control. It’s very strange. And slightly worrying."
