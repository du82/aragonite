["https://inverty.com/2005/12/05/xbox-360-11/index.html"]
title = "Xbox 360"
full_description = "One setting the 360 needs but doesn’t have is a “don’t boot game automatically” setting. I quite often turn on the box wanting to go straight to the dashboard, but it spins up the disc and starts playing. Okay, so it’s not like the old days when you had to get up and eject the disc, you can now just use the guide button, so it’s progress, but it’s not quite there yet. (Unless there is a way I’ve just not found yet.) I quite often turn on the box wanting to go straight to the dashboard, but it spins up the disc and starts playing. Okay, so it’s not like the old days when you had to get up and eject the disc, you can now just use the guide button, so it’s progress, but it’s not quite there yet. Push the central Xbox 360 button on your controller. A panel will show up. Press Y. You’re on the dashboard now, enjoy! Well start it with eject… It’ll eject the tray, true, but you’ll boot on the dashboard, then you can still close the tray within the dashboard.."
