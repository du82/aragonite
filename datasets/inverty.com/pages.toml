["https://inverty.com/2006/02/index.html"]
title = "Archive for  February 2006"
full_description = "Yes, Oblivion fever sent me back to this. Xbox version, as I didn’t want to bother reinstalling the PC one. Loaded up my last save, dated 9th February 2004. Yes, over two years ago. Disturbingly, within about two minutes I’d remembered exactly what I was doing. I’d got stuck doing Imperial Guard missions when I got to a locked door in a tower that I couldn’t get past. I also remembered that in the PC version I’d found a key to the door and a bit of nosing around unearthed it. Inside the room was a nasty man who refused to pay his taxes and had imprisoned an orc who’d come to collect them. So I killed him. Harsh, but fair. He had some expensive stuff, so I took that. Freed the orc, went back to my commander. Got promoted to a trooper and got asked to see if I could find proof that some of the soldiers were in a cult planning to kill the Emperor. I had to use a fair bit of cash to bribe people, but I got my answers and found the proof. I was then tasked with killing the two main conspirators. Sorry, not killing, executing. I believe there’s a difference. Anyway, they died and I got promoted to the rank of agent and got given enough new armor to leave me unable to actually move. I saved it there. I’ll have to drop some stuff when I reload. I probably shouldn’t play this too much before Oblivion appears, lest I get Elder-Scrolled-out. But I may have the bug again. (And then I played Animal Crossing with p’anther for two hours.) Thought I’d have a quick go before playing Ridge. Quick go lasted 53 minutes. And I’m still bottom of my friends leaderboard. Gah. Played more Ridge Racer – I didn’t bugger it up as much as earlier – and then went to download some stuff on Live. Downloaded all the eighteen unlock keys for extra cars in Ridger Racer 6. Very odd. The cars are on the disc already, but you have to go online and unlock them one by one by one by one. It’s quite a long process and the only point seems to be to annoy people who aren’t online. Mind you, anyone who’s bought a 360 and doesn’t have it online needs their head looking at. Then I downloaded the Xtreme difficulty level for Crystal Quest. I shouldn’t have done. It cost 100 points. It’ll only encourage more developers to cut bits out of their games to charge for later. Anyway, it transforms the game. It… well, it makes it really hard. Obviously. Hence the name. Basicaly it cuts out all the boring stuff and turbo charges it. I’ve ony got off level one once so far, but that gave me my best score ever by about a million points."
