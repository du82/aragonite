["https://inverty.com/2006/04/index.html"]
title = "Archive for  April 2006"
full_description = "I couldn’t get any further with the Old Style game after playing more, so I tried New Style, which is more different than I thought it would be. There’s an extra initial stage and the two main stages I’ve seen so far are very different from the originals, but with lots of hints of the original layouts. Anyway, did the first stage with Mega Man and Roll, then did the Cut Man stage with Mega Man. Tried the Gut Man stage after that, but just couldn’t do it. That left me with a completion percentage of 0.6%. Of New Style mode, not including Old Style or the challenges. And talking of challenges, I’d unlocked the Cut Man ones, so did the first two of them without much trouble. Then the third one took me a long, long, long time. Number of goes well into triple figures. But unlike, say, Marble Blast, it doesn’t feel unfair or impossible. The fourth Cut Man challenge was hard, but much, much easier and went down within thirty or forty tries. The fifth one… well, I took one look at it and ran away. Tried the third Mega Man one, having down the first two earlier, but just couldn’t do it. After about twenty tries I was really feeling tired, so I just gave up. I’m knackered and the battery is low again, anyway. You do get an awful lot of game for your money. I’ve just used up a fully charged battery on this, near enough. PSP needs more battery life. Mostly Old Style game, which is almost the same as the original Mega Man game. Music and graphics have been changed and enemies and bullets don’t pass through walls any more, which makes a big difference. Did the Cutman level – twice, because autosave, er, doesn’t – then the Gutman level, then the Bombman level. No real trouble with any of them. Then tried the Elecman level. Getting to the end isn’t a problem, but Elecman has a stupidly powerful attack and I can hardly get any hits in before he kills me. It’s annoying. So I tried the Iceman level and haven’t been able to get to the end of that at all yet. Other than that, I tried a couple of the challenge levels, which were fun. I see you need to play the New Style game to unlock new challenges, but I don’t really want to play that until I’ve finsihed off Old Style. However, Old Style may be a bit too tough, so maybe I’ll have a crack at New Style later. Also went online and downloaded a user made level called “Just try it!!” Was fine until I got to a bit I just couldn’t do at all. Broken level or am I just rubbish? I don’t know."
