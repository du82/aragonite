["https://inverty.com/2005/09/index.html"]
title = "Archive for  September 2005"
full_description = "…And it’s one more boss down – great looking, pathetically easy – and time to put the DS on charge and go to bed. I like this game. God, I hate, hate, HATE, HATE sliding block puzzles. Especially ones with reset buttons just next to the square I need to click to solve it. Especially ones with reset buttons THAT DON’T ASK FOR CONFIRMATION just next to the square I need to click to solve it. I got there in the end, though. Another boss down, too. Easy one. A little bit too easy… Oh, and I hate rooms full of towers of fire-spitting dragon heads that take ages to kill and only has a hole in the ceiling, which I can’t get through yet. Hmm, unless you can stand on the dragons’ heads and build a staircase… Man, that was way back. I’ll just try to remember that in case I don’t find any flying powers later on in the game. And what was behind that dragon that kept killing me? A halbred. A fucking halberd. Ah well, at least I was able to sell it for potion money. Oh, and I bought a handgun. It’s really fun to use against weak enemies. Not much use when you’ve got a horrible ghostly being dropping down on to your head, though. Ack! Same monster killed me again! It’s not a boss or anything complicated, just one of those dragon skulls on the end of a really long neck. It’s just way down in the bottom of a pit after a load of other monsters. Luckily, I’d saved a bit later than I did last time. I got a Great Armor soul again. Turns out I didn’t need it, anyway. It’s a Valkyrie soul I need. Not sure if I’ve met those yet, I’ll have to check. I’ve lost ghoul souls both times I’ve died, too, but they seem to pop up often enough that I’m not too bothered. NOOOOOOOO!!!!!! MOST ANNOYING CASTLEVANIA DEATH EVER. I’d got another Great Armor soul. I’d uncovered loads more of the map. I’d found tons of new equipment. I just hadn’t found a save room. Buggering, bollocking fuck. Horrible, horrible unclean game. Two more bosses down – in an annoying “kill one boss, find the second two screens later” bit. Luckily, while the first one is tricky and took me three goes, the second is easy as piss. I’ve now got a lovely new move, so I’ve got to wander back through the places I’ve been looking for somewhere to use it. I want to go back to Yoko’s shop at some point, too. After about fifteen minutes of trying I got a Great Armor soul, which I think is the next one I need to upgrade my halberd. Unfortunately, it’s a useful soul power, so I’m not sure if I should use the soul or not. So I probably need to go back and get another Great Armor soul, so I don’t actually have to choose. According to the game’s clock, I’ve only played for 1 hour and 42 minutes, which seems very wrong indeed. I’m sure it must be more like three or four hours now. I’ve also uncovered 20.3% of the map already, but you always start off finding loads of new places. Later on I’ll be searching out a 0.3% here and a 1.2% there. Oh, and those summoned zombies can actually be quite useful. Hooray!"
