["https://inverty.com/2006/01/index.html"]
title = "Archive for  January 2006"
full_description = "It’s a racing game. It’s a very good racing game. It’s a very good racing game that’s great fun online because people can’t shove you off the track or otherwise annoy you. It’s a very good FREE racing game that’s great fun online because people can’t shove you off the track or otherwise annoy you. It’s a very good FREE racing game that’s great fun online because people can’t shove you off the track or otherwise annoy you… but it comes with Starforce copy protection. Whether the Starforce thing is enough to put you off is up to you, but this is a very, very good game online and – as I said – it’s FREE. And I bumped into Ste from ugvm when I went online, which was nice. HINT: Downloading it from Eurogamer was much, much faster than downloading from the official site, which is getting hit hard today. Mortgage: PAID! (Until a huge one arrives again tomorrow.) ARWING: GOT! (But I’ve not seen it yet. It’s awaiting new room tomorrow.) Been away for the weekend. Played a small amount of Animal Crossing, but that was it. I’m now within 20,000 bells of paying off my current mortgage, but I can’t be bothered to fish for ages, so I’ll pay it off next time some fruit grows. Oddly, there were no dig spots today. It’s a new downloadable demo for the 360. It’s ace… for an unfinished product… and for four minutes of fun. If they can get the slowdown sorted out prior to release – and they damn well should – then it could be really good fun. It’s a racing game with games and explosions and lots of stuff on and off the track to blow the crap out of. So I played through it three times and had a blast. But will it be fun doing that over and over again in the full game? Burnout managed it for a couple of games, so maybe Full Auto will be able to sustain itself for at least one. I guess this is where reviews come in handy. There’s a good chance it’ll go on my ‘under twenty quid’ list, along with Condemned and Amped 3. It’s a new download on Xbox Live Arcade. You roll a marble around and pick up gems and then head to the exit. It’s a bit Monkey Ballish, yes. I went through the levels in the demo, then unlocked the full game without a second thought, did all twenty beginner levels under par and then leapt into a quick online game, where I rolled around badly until I lost my connection."
