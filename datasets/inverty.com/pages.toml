["https://inverty.com/2006/05/index.html"]
title = "Archive for  May 2006"
full_description = "Unlocked World Seven this evening. Not very difficult, really, after unlocking World Four. Some lovely levels in there, and I’m only half-way through. I’ve not been managing to get all the coins, either. World 4 is a bit trickier than the rest of the game, I think. Unless it’s just that I’m out of practice after a week or so off. There was one jump in World 4-A that I really couldn’t do and ended up just fluking. On to the Faultline mission. I’m making some progress, but I’m finding it hard to find the space to perform my misdeeds away from prying eyes. There’s not a really obvious way in like there was in the last mission. This game is excellent. Right, it’s 1:04am, but I’ve finished the ‘Curtains Down’ mission. Not only did I finish it, but I got a Silent Assassin rating for it. That netted me two Achievements – one for getting a Silent Assassin rating and the other for doing a kill that looked like an accident. A wonderful night at the opera, then. I wonder where I’m going next? Been playing “Curtains Down”, the second proper mission. Just trying things out. Not close to finishing it yet. I’ve got an idea of a couple of times that I could kill one of the targets, but the second target is proving tricky to get near. Well, I was really tired so I told myself I was just going to have one game before bed. So I did. I scored 16,775 points. Which is possibly my worst score ever. I guess I’m tired. I finally finished the first proper mission! Yay! However, the newspaper headline after my mission was “Hoodlum Massacres 18!”, which shows that I didn’t quite manage to become the silent assassin that I was going for… Just a quick go. I’ve taken my PC off my TV and put it back on a monitor and instad of speakers I’ve plugged headphones in. It’s improved the experience greatly. With the sounds so loud and close the scary bits are more unnerving and the fighting bits are just immense. Good stuff. Really is bed time now, though."
