["https://invesco.com/pp/en/privacy-portal/cookie-notice.html"]
title = "Cookie Notice"
full_description = '''Cookie Notice Introduction, Who We Are and Definitions Thank you for visiting our website and for using our Online Services. We’d like to tell you about our Cookie Notice and how we use cookies and similar technologies on our websites. Who we are This Cookie Notice is provided by members of Invesco Ltd.’s group of companies (“Invesco”) and investment funds managed by members of Invesco listed in section “Issuing Companies” below (collectively “we”, “our” and “us”). We are the controllers of your personal data and, as controllers, we determine why and how we collect and use your personal data. We take seriously our responsibility to hold your personal data securely and confidentially. We are committed to protecting your privacy and personal data as you use our Online Services, that refer or link to this Cookie Notice. This Cookie Notice may be supplemented by additional privacy statements, terms or other notices provided to you. In this Cookie Notice We have defined some words and phrases to help make it clear what we mean. “personal data” means personal data as defined under the Law and includes any information about an identified or identifiable natural person. Such information may include, for example, information we collect against an identifier for you (for example, your online user ID). We also refer to personal data as “information about you”; “controller” means controller as defined in applicable data protection legislation; “Invesco”, “our”, “us” and “we” means Invesco Ltd.’s group of companies and investment funds managed by members of Invesco listed in section “Issuing Companies”; “the Law” means applicable data protection legislation in the jurisdiction of your residence; "Online Services" means Invesco websites, online chat and other services provided by Invesco online, including online events, that refer or link to this Cookie Notice; "processor" means a third party that processes personal data on Invesco's behalf (including, but not limited to our service providers, credit reference agencies, other entities within Invesco Ltd.’s group companies, and your financial advisor or other intermediaries); “manage cookies” means that you can customise your consent preferences for each cookie types individually; “accept all cookies” button means that you agree to store all types of cookies on your device; “decline all cookies” button means that you disagree to store any types of cookies (apart from the strictly necessary) on your device. The way of we recognise your information When you access our site for the first time, choose your audience type or register for our site services, we will place a 'cookie' on your computer. Cookies are small text files placed on your computer and are commonly used on the internet by many websites to store information on their users' computers. Cookies only contain information relating to the website that created them and can only return the information to that website. In other words, our site cannot read the information contained in cookies created by anyone else's website on your computer. Similarly, only our site can read the information in cookies that it creates. Cookies cannot be used to get or view data from your hard drive. How we use your information This section of the Cookie Notice explains for what purposes we use your personal data we collect through cookies and similar technologies. By consenting to the use of cookies on our website you acknowledge and agree that we may (i) track and record information for systems, marketing, troubleshooting, administrative, analysis and reporting purposes; and (ii) use your personal data in the following ways: track and record the aggregate number of visitors to Invesco websites and the sections of these sites visited by visitors using cookies; analyse our websites, for example to collect information that will help us understand visitors' browsing habits on our websites; compile statistical reports on website activity, e.g., number of visitors and the pages they visit; improve the functionality of our website by temporarily storing any information which you may enter in tools, such as calculators or demonstrations on our websites; in some cases, remember information about you when you visit our site. We may need to do this to provide some of our Online Services; and record your visit to our websites, the pages you have visited and the links you have followed. We use this information to make our websites more relevant to your interests and identify products or Services that may be of interest to you. We may also share this information with third parties for these purposes. We also use cookies that are essential to operate our websites, for example by directing you to the right area depending on what country you have selected, we call these cookies “strictly necessary” cookies. Do Not Track Do not track function allows you to indicate a preference through settings in your internet browser that indicate that our websites should not track your online activity. Any opt-out preference signal will be considered under required applicable Law. Types of cookies Session cookies: These are temporary and are deleted as soon as you close your browser. Persistent cookies: These are stored on your computer until they expire, or you remove them. Persistent cookies store your personal preferences such as your language preferences on multi-lingual sites to make subsequent visits easier. They also remember questions we have asked you previously, such as a request to complete an online survey. Strictly Necessary Cookies These cookies are necessary for the website to function and cannot be switched off in our systems. They are usually only set in response to actions made by you which amount to a request for services, such as setting your privacy preferences, logging in or filling in forms. You can set your browser to block or alert you about these cookies, but some parts of the site will not then work. These cookies do not store any personal information. Functional Cookies These cookies enable the website to provide enhanced functionality and personalisation. They may be set by us or by third party providers whose services we have added to our pages. If you do not allow these cookies, then some or all these services may not function properly. Performance Cookies These cookies allow us to count visits and traffic sources so we can measure and improve the performance of our site. They help us to know which pages are the most and least popular and see how visitors move around the site. All information these cookies collect is aggregated and therefore anonymous. If you do not allow these cookies we will not know when you have visited our site and will not be able to monitor its performance. Targeting Cookies These cookies may be set through our site by our advertising partners. They may be used by those companies to build a profile of your interests and show you relevant adverts on other sites. They do not store directly personal information but are based on uniquely identifying your browser and internet device. If you do not allow these cookies, you will experience less targeted advertising. Social Media Cookies These cookies are set by a range of social media services that we have added to the site to enable you to share our content with your friends and networks. They are able to track your browser across other sites and build up a profile of your interests. This may impact the content and messages you see on other websites you visit. If you do not allow these cookies, you may not be able to use or see these sharing tools. Third-Party cookies We work with third parties who, on our behalf, research the use of our website and activities on it. In doing so they may place a cookie on your computer. However, it would not contain any personal data in a format that can be read by anyone else. We also work with third parties to evaluate the effectiveness of our advertising and promotions on third party websites. Again, the cookie would not contain any personal data in a format that can be read by anyone else. Please note that third parties (including, for example, providers of external services like web traffic analysis services) may also use cookies, over which we have no control. These cookies are likely to be performance cookies or targeting cookies. Depending on the applicable data protection Laws in the jurisdiction of your residence we may or may not honour your browser signal preferences (e.g., Do Not Track signals). Managing your cookie settings You can adjust your cookie category preferences in the Privacy Preference Centre that can be accessed through the Manage Cookies link that is accessible in the bottom of the website or from the cookie banner. There are options to adjust your cookie preferences either by selecting the ‘Accept all cookies’ or ‘Decline all cookies’ button, or by adjusting the toggle buttons next to each cookie category. As an alternative to Manage Cookies and the Privacy Preference Centre, you can manage your cookie settings directly through your online browser. You can decline, accept, or remove cookies at any time by using the settings on your internet browser. You can configure your internet browser to warn you each time a new cookie is about to be stored on your computer so that you can decide whether to accept or decline it. Please refer to your internet browser's help section for further information. Please note that some parts of our website may not function properly if you reject certain cookies. Based on your browser, follow these instructions to manage your cookie settings: Google Chrome Apple Safari Mozilla Firefox Internet Explorer Microsoft Edge Opera DuckDuckGo You can find further information about cookies and how to manage your cookie settings on www.allaboutcookies.org or http://www.youronlinechoices.eu/. Revisions to this Cookie Notice This Cookie Notice was last updated on 09 October 