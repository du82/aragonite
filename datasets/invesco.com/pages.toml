OT BE LIABLE EVEN IF INVESCO OR AN INVESCO AUTHORIZED REPRESENTATIVE HAS BEEN ADVISED OF THE POSSIBILITY OF SUCH DAMAGES. THESE INCLUDE BUT ARE NOT LIMITED TO DAMAGES OR INJURY CAUSED BY ERROR, OMISSION, INTERRUPTION, DEFECT, FAILURE OF PERFORMANCE, DELAY IN OPERATION OR TRANSMISSION, LINE FAILURE OR COMPUTER VIRUS OR OTHER HARMFUL COMPONENT. APPLICABLE LAW MAY NOT ALLOW THE EXCLUSION OF CERTAIN WARRANTIES OR THE LIMITATION OR EXCLUSION OF LIABILITY FOR INCIDENTAL OR CONSEQUENTIAL DAMAGES. ACCORDINGLY, SOME OF THE ABOVE LIMITATIONS OR EXCLUSIONS MAY NOT APPLY TO YOU. HOWEVER, IN NO EVENT SHALL INVESCO'S TOTAL LIABILITY TO YOU FOR DAMAGES, LOSSES, AND CAUSES OF ACTION (WHETHER IN CONTRACT, TORT (INCLUDING, BUT NOT LIMITED TO, NEGLIGENCE), OR OTHERWISE) EXCEED THE GREATER OF THE AMOUNT PAID BY YOU FOR ACCESSING THE WEB SITE AND $50.00 USD. 8. General By registering any information on the Web Site or by sending e-mails to us, you consent to receive communications from us electronically. We will communicate with you by e-mail or by posting notices on the Web Site. Contact Us If you have questions regarding these Terms and Conditions, please reach out to us in the manner set forth on "website"'''
