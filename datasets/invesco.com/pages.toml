["https://invesco.com/corporate/en/about-us/our-company-and-culture.html"]
title = "Our company and culture | Invesco Corporate"
description = "Explore Invesco’s global investment expertise, delivering innovative solutions and creating greater possibilities for our clients."
full_description = "Who we are Our company and culture Founded in 1935, Invesco is an independent investment management firm with an on-the-ground presence in more than 20 countries around the world. $1.85 Tn AUM We manage $1.85 Tn in assets under management for both retail and institutional investors. 1 8,400 employees We have approximately 8,400 employees to better serve our clients. 120+ countries We service our clients in 120+ countries across the world. About Invesco At Invesco, we drive sustainable profitable growth by delivering capabilities that build enduring partnerships and create better outcomes for our clients. Our strategy leverages existing areas of strength and a focused set of priorities: Deliver the excellence our clients expect: We aim to deliver on our clients' high bar, from a quality investment process to a frictionless experience with superior engagement. Grow high demand investments: We deliver ahead of clients’ expectations through product innovation, investment styles and packaging options, focusing our offerings at the intersection of high opportunity markets and high demand capabilities. Create an environment where talented people thrive: We create an inclusive and engaging culture and value diversity of thought, which enables us to work as one team to deliver better outcomes for our clients. Act like owners for stakeholders: We are disciplined stewards of firm resources with a focus on profitable growth and know growing operating income enables us to invest in the success of our clients, shareholders, and ourselves. Our culture These three principles underpin our strategy and define how we work together and with clients: One Team: We feel ownership for the firm’s collective success in every decision we make and every action we take, ultimately in service of our clients. Culture matters: We foster an inclusive environment built on collective respect, trust and collaboration. We value every individual for what they bring to the firm. Focused execution: We are clear on our direction, crisp with decisions and execute with speed and rigor. We are transparent with outcomes and hold ourselves accountable. What makes Invesco a special place to work? Our culture thrives when we can be our best selves, doing our best work - for our clients and each other. To grow your career with us, check out our open roles. Our products and services At Invesco, we want to make sure you have access to the right information, including regional products, tools and insights. Explore our investment capabilities, vehicles and other content by selecting the appropriate region and role. Americas Explore now Transcript Asia Pacific Explore now Transcript Europe Explore now Transcript Middle East Explore now Transcript About us As one of the world’s leading independent global investment firms, we’re dedicated to rethinking possibilities for our clients around the world. Who we are Our Leadership › Our Locations › News & Insights Press Releases › CEO Insights › Footnotes 1 AUM of $1,846.0 billion as of Dec. 31, 2024"
