["https://invesco.com/corporate/en/our-commitments/corporate-governance.html"]
title = "Corporate governance | Invesco Corporate"
description = "Read about Invesco’s corporate governance guidelines, charters for our board committees, terms of reference for our chairman and CEO, and codes of conduct."
full_description = "Our commitments Corporate governance Committed to ethics, security, and governance. Governance within Invesco Ltd. At Invesco, integrity and responsibility are core principles. We ensure ethical conduct, risk management, and strong corporate governance through comprehensive principles, adherence to laws and regulations, and robust data security policies. Our Board of Directors seeks to maintain the highest standards of integrity and accountability in the stewardship of the Company's affairs and recognizes that proper and effective corporate governance is important to shareholders and other stakeholders. Below are links to corporate governance documents, including our guidelines, charters for our board committees, and codes of conduct. Guidelines Corporate Governance Guidelines 2024 (PDF) › Criteria for Selection of Candidates for Membership on the Board of Directors (PDF) › Transcript Charters of committee Nomination and Corporate Governance Committee (PDF) › Audit Committee (PDF) › Compensation Committee (PDF) › Transcript Code of conduct and compliance reporting line Code of Conduct (PDF) › Directors' Code of Conduct (PDF) › Invesco Whistleblower Hotline (PDF) › Transcript Communications Communciations with the chairman and non-management directors Any interested party may communicate with the chair of our board or with our non-management directors as a group at the following addresses: Email: Company.secretary@invesco.com US Mail: Invesco Ltd. 1331 Spring Street, N.W. Suite 2500 Atlanta, Georgia, 30309 Attn: Office of the Company Secretary Communications will be distributed to the board, or to any of the board's committees or individual directors as appropriate, depending on the facts and circumstances of the communication. In that regard, the Invesco board does not receive certain items that are unrelated to the duties and responsibilities of the board. Executive sessions of non-management directors It is our board's policy to have a separate meeting time for the independent directors at least annually in connection with a regularly-scheduled board meeting. The chair of the board presides at these meetings of non-management directors, and if the chair is not able to attend, he or she designates another independent director to assume such duties. Political activities As a global investment firm dedicated to creating greater possibilities for our clients, we believe it is important to be an active participant in the political process with the objective of promoting and protecting the economic future of the company, our clients and stockholders. Learn more in our US Policy Statement on Political Activities. Our products and services At Invesco, we want to make sure you have access to the right information, including regional products, tools and insights. Explore our investment capabilities, vehicles and other content by selecting the appropriate region and role. Americas Explore now Transcript Asia Pacific Explore now Transcript Europe Explore now Transcript Middle East Explore now Transcript About us As one of the world’s leading independent global investment firms, we're dedicated to rethinking possibilities for our clients around the world. Who we are Our Company & Culture › Our Leadership › News & Insights Press Releases › CEO Insights ›"
