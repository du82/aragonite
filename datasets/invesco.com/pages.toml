description = "Invesco is committed to respecting the privacy of those whose personal data we process, upholding their privacy rights and acting in accordance with applicable legislation. Access the relevant regional privacy notices by selecting your region below."
full_description = "Transparency To be transparent with the individuals whose Personal Data we process, so they know what Personal Data we process, the purposes for which we process it and what we do with it. Purpose limitations To only collect or process Personal Data for specified legitimate purposes, and not process such Personal Data for purposes others than those specified. Rights To enable individuals to exercise their Privacy Rights applicable to the Personal Data we collect or process. Minimization To minimize the Personal Data we collect or process to that which is necessary and relevant to the specified purposes. Storage limitation To only keep Personal Data for as long as we need it in relation to the specified purpose(s), after which it is to be deleted or otherwise appropriately disposed of. Accountability To be responsible for, and able to demonstrate our adherence to, our Privacy Principles and applicable privacy laws and regulations."
