full_description = 'SBI Updates: Posted by InvestorBlogger 1 With 65 pages, an average of 98 visitors a day, and I’m earning a few nickels a day (average) on Adsense, my coffee site is coming along. I’ve just announced some new goals: "Phase II- improve content/structure and Increase links – very slow! Phase III – build out the site to [b]100 pages and 200 visitors per day[/b]! The new goals! At 65 pages, I’m 2/3rds done. +1 more + 1 rewrite." So where are we? Well, after finishing the initial build-out of the site, traffic blossomed to 80 visitors a day or so. But with no revenue, there is still some way to go. On entering Phase II, I revised and revamped much of the Tier 2 content, including the most frequently visited pages to include additional elements. I’m hoping that visitors will stay a little longer, search for more articles, read related stuff, and eventually click away with my Most Wanted Response. There are still many pages to be revised (at least 30), and occasionally I found one or two pages that doesn’t have Analytics code, meaning that I’ve not been tracking my visitors properly! There are also 3 pages that need extensive re-writing, too. So I’m choosing my priorities: finish the rewrites – 3 to go, redesign the top pages – I think I got most of them, find more inbound/outbound links – slow!, get included in a couple of decent directories, and get the content to 80 pages. I’m finding now that some of my Tier 2 pages may need to be redone, giving me extra material that I can move to Tier 3. Also, with the extra rewriting, I may be able to start my EzineArticle marketing campaign which would bring extra traffic, PR, and visitors. Revenue efforts have started with several programs including Adsense, CommissionJunction and PopShops. But results are very mixed. Only Adsense is generating something. Early days so I’m not worried. I will only have two ad boxes for the time being… With no subscribers to my newsletter, I’m placing this in a Phase III goal. Phase III isn’t clearly thoughout yet. But it could be a couple of months before I get there. I also have a second site that is still on the drawing board. I tried to buy another site and repurpose the content as a kickstart, but the price was a little ‘expensive’ for what there was. I will just spider the site and rewrite the content myself in my own voice! So much to do. Not enough time. Posted in Newsbites Tagged Make Money Online, SBI May·21'
