full_description = "GERN: a solid company? LOL! Well… Posted by InvestorBlogger I typically avoid companies that don’t have a track record of management competence, the vagaries of biotech aside. This company has been around for ages, doesn’t turn a profit, has had several notable runs on its stock price (at least), and AFAIK no obvious path to profitability other than ‘milestones’, ‘conferences’ and ‘Qx losses’. TTM losses are even higher than 2021. So… this is not a solid financial basis in my book. The IV is 320 % because the risk is high. If you’re comfortable with that level of risk…? I’m not. I often remember the axiom: “Return OF your capital is more important than return ON your capital”! GERN: Pop & Drop This is what I reckoned would happen. It looks like it popped for a 40% gain on 1/4. But it’s already giving most of that back as I write this. The news on its drug was designed to pop the stock and the stock is now retreating on news of a public offering. Be careful trading penny stocks like this. These are my own opinions. I am not a financial adviser, and do not play one on TV. Do your own research! Posted in Investing Jan·03"
