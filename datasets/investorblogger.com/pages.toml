["https://www.investorblogger.com/tag/buzz"]
title = "Buzz Archives | Investor Blogger Dot Com"
full_description = 'Is there a Conspiracy of the Rich? Robert Kiyosaki seems to know the buzzwords, at least Posted by InvestorBlogger For those of you who are interested in the Rich Dad Series, you can visit the Conspiracy of the Rich to read the latest book from the author. I’ve pasted a sample in this jpg. But to read the full chapter you need to become a member of the site where you can read, consider and discuss what’s being written. About Rober Kiyosaki Robert Kiyosaki, author of the #1 bestselling personal finance book of all time, Rich Dad Poor Dad is taking a new approach with his next book. He’s releasing the book, Conspiracy of the Rich: The 8 New Rules of Money, online — for free. And he’s inviting readers to participate in the writing process. So it’s worth checking out. But be aware: some powerful criticisms of Kiyosaki have been written that attempt to debunk much of his factual writing. I still think there’s something worth reading if you read between the lines, whatever stance you take on his factual accounts. Posted in Newsbites Tagged Buzz May·27 My First Ezine Article: Marketing Online Posted by InvestorBlogger I just wanted to share my first ezine article with you all. Steve, from Agentschat.com fame, encouraged me to try my hand at article writing, a form of online marketing. So I decided to tweak something that I had written earlier and submit it as my article to promote our ESL school website, which needs a little TLC, (Traffic, Linking and Content!). Your article, "Go Do Your Homework! 3 Simple Techniques to Help Kids Do Homework" – has been accepted and published on EzineArticles.com: http://EzineArticles.com/?id=2027649 You’ve also earned Expert Author status: http://EzineArticles.com/?expert=Kenneth_Dickson Your article will appear on our high-traffic home page within 48 hours: http://EzineArticles.com/ Your article has also been sent to our exclusive EzineArticles RSS Feed and to our proprietary EzineArticles Email Alert Members. You are welcome to add one of these special buttons on your website to show that your articles have been featured on EzineArticles.com: http://EzineArticles.com/featured/ To Your Article Marketing Success! http://EzineArticles.com/ It won’t really go live for a few hours, so it will be a while before it draws any traffic to the blog. Let’s see what happens. I’m already planning a string of articles for this site, some of which will be written by me, and some by my team of writers headed by Anuj. Posted in Newsbites Tagged Buzz Mar·05'
