full_description = "Saturday Reading: How to Tap Into Your Customer’s Inner Desires for Fun and Big Profits Posted by InvestorBlogger For marketers and business people everywhere, I thought this article would be worth mentioning on my blog! How to Tap Into Your Customer’s Inner Desires for Fun and Big Profits When Did This Become About You? The evolutionary biologists and psychologists are right about one thing – humans have a tendency to put themselves first. That makes sense – for example, you can’t save someone else from drowning until you’ve saved yourself first. Those scientists would argue that this is simply a survival mechanism, a way to help propagate the species.However, what started out as a survival mechanism has spilled over into every part of our lives. Americans in particular are known to put their individual needs ahead of the group’s needs. Perhaps you’ve seen this selfish behavior taken to sickening levels – face it, we all have the friend who only talks about herself and never asks anyone what’s going on in their life….moreadwritingtips Let me know how it turns out for you. Posted in Uncategorized Tagged Affiliate Marketing Oct·31"
