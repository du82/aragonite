full_description = "ZIM Dividend $6.40 per share: High Beta, High Short Interest Posted by InvestorBlogger It’s a shipping stock. Heading into a slowdown, prices of the stock have come way off their highs. Next year’s consensus numbers are all over the place. From $-8 to $8!!! Do you think after divesting the dividend it’s a worthwhile stock to own? Does its current price represent a good valuation on future earnings? I really only have questions right now… That’s some dividend payout. But please remember that the stock has only traded for less than 2 years. The tally is: 2021 (y1) $24.35 and for trailing 12 months: $29.55. In yesterday’s trading, it soared over $24 before settling back. How are the options? Let’s take a look. Well, there is some depth at the ATM options and OTM which is reassuring (unlike Dropbox). Given my track record on owing odd stocks… I’m tempted to ignore it. But with a beta of 2 and short interest approaching 20%, I can sure see why premiums are as high as they are. So it’s a gamble. Posted in Investing Mar·14 GERN: a solid company? LOL! Well… Posted by InvestorBlogger I typically avoid companies that don’t have a track record of management competence, the vagaries of biotech aside. This company has been around for ages, doesn’t turn a profit, has had several notable runs on its stock price (at least), and AFAIK no obvious path to profitability other than ‘milestones’, ‘conferences’ and ‘Qx losses’. TTM losses are even higher than 2021. So… this is not a solid financial basis in my book. The IV is 320 % because the risk is high. If you’re comfortable with that level of risk…? I’m not. I often remember the axiom: “Return OF your capital is more important than return ON your capital”! GERN: Pop & Drop This is what I reckoned would happen. It looks like it popped for a 40% gain on 1/4. But it’s already giving most of that back as I write this. The news on its drug was designed to pop the stock and the stock is now retreating on news of a public offering. Be careful trading penny stocks like this. These are my own opinions. I am not a financial adviser, and do not play one on TV. Do your own research! Posted in Investing Jan·03"
