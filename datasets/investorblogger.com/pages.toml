full_description = "CNN Business Stats: Did they pay their upstream provider? Posted by InvestorBlogger Posted in Newsbites Nov·21 Willing to lose $40? Not me! Posted by InvestorBlogger Essentially no volume. If you buy it, you’ll be stuck with it until it expires and you get assigned. It’s unlikely you’ll be able to close the option before expiry. On a penny stock, you’re essentially buying a *minimum* loss of nearly 8c per share up front. Otherwise… why? It’s a declining investment, with a company that is running out of cash, likely to dilute existing shareholders value even more with further debt sales, no product, no revenue and a massively negative EPS. You’re also using your buying power instead of buying something with value, and you’re tying up your buying power until January. It makes no sense as presented. You’d be better giving your $40 to a homeless shelter! At least you’ll feel better than throwing it away. This stock is a value destruction machine: *Nasdaq FSI: *Deficient: Issuer Failed to Meet NASDAQ Continued Listing Requirements and more… Posted in Newsbites Oct·07"
