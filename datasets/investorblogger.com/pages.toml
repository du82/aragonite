full_description = "Join InvestorBlogger on Twitter! Posted by InvestorBlogger Don’t forget to follow me as well! John Chow introduces his new tool, TwitterFollower, that makes following me a snap! You can also boost your number of followers! I just boosted mine from 50 to nearly 500! Can I reach a 1000!? Let me know! Posted in Uncategorized Tagged This Website May·04 100 subscribers: We did it, well sort of Posted by InvestorBlogger It seems InvestorBlogger finally regained its 100 subscribers from a year ago. Unfortunately, it was unclear who the 100th subscriber was, whether from email or just the regular feed. So, I’m afraid I can’t give away the extra EC for two reasons: I can’t access the original forums where I made the original offer. There’s been quite a fuss about that change, on the boards. I’ve already said my piece. But perhaps my bigger mistake was not releasing how difficult it would be to tell who the 100th subscriber would be. The total in Feedburner is an aggregate of Feed readers, Email Subscribers and so on. This is not broken down into chronological order, so it is nigh impossible to tell who the 100th subscriber via email is, as the number of feed readers changes daily. Mmm. This is not what I had hoped. So I may have to rethink that competition! Any suggestions? Update: Well, we blew through the original target. We’re now approaching 120 subscribers! Wow! That was a surprise. Posted in Uncategorized Tagged This Website Apr·24 EntreCard Promotions: Get Traffic for your website! Posted by InvestorBlogger 1 Have you joined Entrecard? I did, and then quit for lack of stability. Now I’m trying it again because there a number of innovations: the EC browser helps to manage everything; and EC can now be bought and sold to EntreCard. There’s also a much more active trading community on Entrecard. I’m now running three EC promotions on this blog. The first is the usual EC widget with a small EC ad. The second is a widget that is called “Entrecard Slots”. Enter the slots and you might win some EC. I actually won 1000 EC for entering yesterday. I never expected to get it, but it was in my EC account today! Wow! The third is a little Entrecard Blog Promotion which encourages visitors to visit more of the EC blogs and earn EC. So do check out EntreCard, sign up and try it out! Don’t forget yesterday’s offer: 100 EC for signing up for my blog! I’ll drop by and drop an EC on your blog.Oh, and if you drop EC on my blog, you’ll be featured in my FriendFeed, too! Posted in Uncategorized Tagged This Website Mar·20"
