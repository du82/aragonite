title = "affiliate Archives | Investor Blogger Dot Com"
full_description = "Making a blog bilingual: it can be done easily in WordPress Posted by InvestorBlogger 3 I finally figured out how to make our website largely bi-lingual (English and Chinese). The pages, sidebars and footers have all been done. I’m now able to drive traffic to the different segments. And all within WordPress. I have separated the pages into Chinese and English groups, but the bloggings themselves are still the same. However, the changes should help both audiences feel a little more comfortable with the format. The English side located at http://www.nozkidz.com/en/. We’ll be able to drive a lot more traffic that way! Be prepared if you do check it out: use Firefox (for easy language switching) or install East Asian languages in your PC (it’s on your XP disk – you do still have that, right?). I wonder if you can figure out how I did it! Clue: Theme Switcher and Sidebar editing!… Do you want to know how? The posts are still mixed so you will encounter Chinese in the blog. But that’s not a problem is it? Posted in Blogging Tagged affiliate, Techno, wordpress, Wordpress & WP Classes Apr·01 Nine Tips for Getting Started with Google AdWords: Steve Sutherland’s Suggestions Posted by InvestorBlogger 1 AdWords is quite a learning curve, but Google breaks it down nicely into chunks with the Starter Edition. When I wrote and told my friend, Steve from AgentsChat, he immediately offered some great advice. In his email, he wrote 9 useful tips to get me started. I’d like to share them with you. Nine Tips for Getting Started with AdWords Great. I have a great book on the subject called Ultimate Guide to Google Adwords – I can lend it to you next time I see you if you want. Things to remember – 1. Look into ‘Exact Match’ and ‘Phrase match’ options (heaps of info if your Google for ‘Adwords matching options’ etc) – you may be throwing away money on using the default ‘broad match’ if you are not careful with it. 2. Google automatically give you Pay Per click ads on their search results pages and the content network (Adsense on sites – Contextual network I think they call it now). Some people prefer to turn off the content network and just focus on the search results – you can test both. You can even target specific sites with the content network if you want. 3. Look into the ‘insert keywords’ option – you can set it so that if the user types in ‘investing’ then that word will show up in your heading or ad – when the word shows up it will be in bold and thus get more attention and more clicks – more clicks = cheaper bid prices. 4. The other factor for bid prices is ‘quality score’ (should be no problem for your home-page) – to get the best quality your keywords should be in your ad, and on your landing page. 5. Grouping keywords into tight Adgroups gives more flexibility to meet quality score – don’t just do one big Adgroup as the ads you write won’t be relevant to all the keywords. 6. Go through your Analytics account to get an idea of terms that people used to find you – you can then target these terms in your keywords. 7. Investing keywords will be expensive so you could take quite a different approach and choose other keywords that are cheap (Taiwan Blog, is one idea) 8. Your ad structure looks good – many recommend the pattern Catchy heading (with keyword) Stress a benefit (possibly with keyword) Call to action (possibly with keyword) URL 9. Run two ads together – the one with better CTR will be cheaper so go with that then test another if you have time. Hope that helps. this turned into a rather long email – you can turn it into a blog post if you like. Steve Unfortunately, I’ve not had great results yet, but I’m still working on the early stages. It’s not difficult to get started. I did have one problem with an affiliate page that I wanted to market because Google Adwords TOS didn’t permit my initial efforts, so I’m still struggling with the affiliate side of the effort. Posted in Taiwan Tagged Adsense, AdWords, affiliate, affiliate marketing, Google, Google Adwords Aug·20"
