full_description = "Disclaimer General Aim InvestorBlogger strives to provide information that is useful and relevant. However, InvestorBlogger Dot Com website does not provide advice specific to financial, legal, tax, mortgage, business, travel, Taiwan, cheesecake, etc.. The website provides general information which may or may not be relevant to specific circumstances that our readers may encounter. General Disclaimer It is not intended to offer financial advice or indeed any kind of advice. With regard to any information that you find published on these pages at InvestorBlogger Dot Com (and the sub-blogs), we strongly advise you to find the specific advisors (financial, tax, legal, business, etc.) and discuss the issues raised with them thoroughly. I’m not a specialist in finance or investing or blogging, for that matter. I have no financial qualifications, financial certification or financial education of any kind. Nothing stated in this blog should be construed as any kind of financial, investment or technical advice. As such, your own results may vary considerably. You should do your own DUE DILIGENCE for any investment that you choose to make or any financial service that you choose to use. You should also seek the advice of a specialist in finance, law, taxation, investment, etc… I’m merely describing the things that happened to me, some of which generated money, some of which didn’t. As such, this blog is a personal blog written and edited by me. Naturally, I’d love to hear what results you got, but there is no warranty stated or implied. Taxation Issues Also, the blog doesn’t address the issues of taxation at all. My profits and any numbers mentioned here are considered gross profits, i.e. before any taxes are paid. Because tax jurisdictions vary greatly across the world, this blog does NOT address the issues of taxes. Any money you make may very well be liable to taxes in your own jurisdiction, as well as in the jurisdiction in which the revenue was incurred. For financial, investment and taxation advice that pertains to your own particular circumstances and jurisdiction, you need to consult a recognized authority in your country. Disclosure Information This blog presents information, ideas, opinions and thoughts that I believe are honest, truthful and accurate. In other words, I will try to write to the best of my ability, knowledge and experience as truthfully and accurately as possible. If you think I fail in either of these aspects, please contact me and show me what is inaccurate or not factual. You can contact me via the comments section, the contact me page or via email at investorblogger_at_gmail.com. Compensation I enjoy blogging very much, and I would like to spend more time writing for this blog and for my other blogs. Naturally, this requires money: Money to pay for my hosting, computers, coffee, etc.. I will not be shy about this point. It would be nice to live in a ‘free’ world, but every InvestorBlogger knows in their heart SOMEONE somewhere always pays, even if you don’t. ‘Free’ doesn’t really exist; it’s just an illusion. In addition, I would like to raise some money for one or two of my projects that are designed to benefit others, but without cash would otherwise be impossible. As time goes by, you will see these projects featured in different pages of the blog. The consequence of which is that this blog accepts forms of advertising, sponsorship, paid insertions and/or other forms of compensation. I am sometimes compensated to provide opinions on products, services, websites and various other topics. Despite this compensation for the posts or advertisements, I will always give my honest opinions, findings, beliefs, or experiences on those topics or products. All such posts are clearly identified in one or more ways, such as at the end or with a graphic or published in a specific category of posts. In fact, this blogger will refuse ANY opportunity that does require I do not disclose , no matter what the product, price or benefits are. I will always disclose to the best of my ability. Types of Compensation To highlight the different methods of generating income, this website has a number of revenue streams: Google Ads, or similar, are (sometimes) served in the sidebar and in articles. Text like links are served in the sidebar, too. Paid placements are provided to highlight products and services for advertisers: From January 1st, 2007, all such postings will be clearly identified in two ways: by appearing in a sponsor’s category of postings, and with the words similar to “this is a paid post” etc. There are occasional ads in the sidebar and in the text for Affiliate Programs. Please feel free to ignore these as you wish or check them out. As new revenue streams are tried out, they will be highlighted in the text of the blog. Stay tuned. In the event that a posting has compensation not otherwise covered, I will endeavor to disclose that relationship. HOWEVER, given the size of this blog, it may not be possible to go back and edit the older pages to bring them up to these standards. In fact, I may ‘expire’ older postings at some point. If you see a problem, please contact me. I’ll correct the problem, if I can."
