description = "Make a Fortune or Lose the Lot? Which will it be in 2023??"
full_description = "Should you ‘loose $40’ on MULN? Nope! Posted by InvestorBlogger This is a speculative play on a company with currently no profits, no earnings information (according to my broker), and (it appears) an attempt to reverse split for purposes that are undetermined. Investopedia suggests a few…What Are the Listing Requirements for the NASDAQ? (investopedia.com) “After a company gets listed on the market, it must maintain certain standards to continue trading. Failure to meet the specifications set out by the stock exchange will result in its delisting. Falling below the minimum required share price or market capitalization is one of the major factors triggering a delisting.”In short, essentially no volume. If you buy it, you’ll be stuck with it until it expires and you get assigned. It’s unlikely you’ll be able to close the option before expiry. On a penny stock, you’re essentially buying a *minimum* loss of nearly 8c per share up front. Otherwise… why? It’s a declining investment, with a company that is running out of cash, likely to dilute existing shareholders value even more with further debt sales, no product, no revenue and a massively negative EPS. You’re also using your buying power instead of buying something with value, and you’re tying up your buying power until January. It makes no sense as presented. From $968 high to $0.3031, likelihood of being delisted, and only 12 months of cash on the books. It has ZERO revenue, and has had ZERO revenue for at least 3 years. In fact, do you think this stock is junk or not? Share with me! I’m not a financial analyst, nor do I play one on TV, so these are my opinions only. Do your own fricking research, make your own decisions! If you can’t, don’t copy mine! Posted in Investing Oct·09 Beaten Down Stock, Beaten Down Option Premium Posted by InvestorBlogger Well, if you like the stock, you can keep selling the CALLS at a lower strike price, esp. if they are likely to be OTM. I suggest keeping a tight leash on them, though: shorter terms, don’t be too aggressive on premium, and be prepared to move on the strike if the contract becomes ITM. I’ve held on to PFE during good times and bad times by rolling out the expiry date, after getting caught with it going ITM. Now it’s OTM so I’ll be looking to my alternate strategy when expiry is due. Posted in Investing Oct·09"
