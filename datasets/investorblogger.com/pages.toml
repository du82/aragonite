full_description = 'Your Taxes: Personal Income Tax Deadlines in Nine English Speaking Countries Posted by InvestorBlogger For those of you international jetsetters preparing your own taxes, it’s wise to keep an eye on the different financial years when you’re preparing your taxes and accounting records. Screenshot IRS (US) website I’ve always had a tough time remembering this info when I efile, so I’ve prepared a helpful list of nine English speaking countries (and Taiwan), their fiscal years and tax deadlines for personal filing. Country Personal Tax Year Personal Taxes Deadline United States 1 Jan. to 31 Dec. 15 April United Kingdom 6 April to 5 April 31 October Australia 1 July to 30 June 31 October Canada 1 Jan. to 31 Dec. 30 April New Zealand 1 April to 31 March 7 July Hong Kong 1 April to 31 March 15 August Ireland 1 Jan. to 31 Dec. 31 October South Africa 1 April – 31 March 5 December Singapore 1 April – 31 March 15 April Taiwan 1 Jan. to 31 Dec. 31 May In some countries, the fiscal (tax) year deadline varies. There is also quite a variation in the deadline date, payment methods, even the nomenclature of the ‘personal income tax’. So always do your research thoroughly and consult competent tax and financial authorities before you submit your taxes. There are stiff penalites for being late with your tax filing or even non-filing. So I cannot stress enough: do your research ahead of time! If you spot any errors, please contact me and I’ll update this post as a matter of priority. Also, I’d like to link to some competent tax sources online, including the tax authorities, so drop any links and I’ll turn this into a real resource page. Posted in Expenses, Entrepreneurial Tagged Personal Tax Year, Personal Taxes Deadline, Taiwan, taxes Jul·15 Choose a Credit Repair Company Carefully: Three Important Questions to Ask Yourself Posted by InvestorBlogger When a person is in debt or facing mounting financial problems, it is tempting to turn to Google and sign up for the first credit repair company that pops out of the search box. But you should ask yourself three basic questions before you sign up, because there are a lot of unscrupulous vendors who are happy to make a dime out of desperate customers. And there are a lot of such companies, don’t fall victim to one of these scams! Will a credit repair company help you become debt free? 1. Can I trust this credit repair company? There are a number of markers that need to be checked before you do business with any credit repair service or company. Verify that the company has a phone, email address and physical location. You may not be able to visit the actual address of the company, but calling the telephone number or emailing them will help to determine that the company is real. Books to Help Repair Your Credit Rating amzn_assoc_placement = "adunit0"; amzn_assoc_search_bar = "true"; amzn_assoc_tracking_id = "investorblogger-20"; amzn_assoc_ad_mode = "manual"; amzn_assoc_ad_type = "smart"; amzn_assoc_marketplace = "amazon"; amzn_assoc_region = "US"; amzn_assoc_title = "Repair Your Credit"; amzn_assoc_linkid = "6c35a3a60ff9e861c0e8ea85bbcd9dcf"; amzn_assoc_asins = "0692637508,1118821513,1511632852,1505842824"; Since the credit repair company uses a website, it is important to look for four essential pages. First, the disclosure page describes how the company is going to make money from you. Second, a privacy policy page should explain how the site is going to store and use the personal information it gathers. Any credit repair service will gather a lot of sensitive information about clients. Third, look for a terms of service page that explains clearly the details of any agreement a client signs. Fourth, of course, there should be a detailed contact page so that new applicants and existing customers can reach out when necessary. Help usually is provided via a ticket-based system or online chat system these days. You will be handing over a lot of highly sensitive financial information, account details, and personal data. You also need to know that the data your sending out is properly secured. Look for the ‘https’ at the beginning of the vendor’s website address which means that it is secured by secure encryption. If you find it, you will have some assurance that your data is private. 2. Will they really help me to get my finances under control? Once you are satisfied that the company is legitimate, you need to look at the website for more information on exactly what skills the team has. It is also important to know how they are going to manage your debts. A successful credit repair company should work hard to win your business. For any individual debt-related case, there are many details that need to be worked out. However, for prospective customers, many companies provide a FAQ or knowledge-based system that can be searched, so look there for information that will help you understand the typical process. For example, do they pull your credit card reports from all the ratings companies? Do they examine the reports for negative items and help you deal with them? Negative items may include late or overdue repayments, automobile repossessions, mortgage foreclosures, tax liens, and more. Will they dispute credit items or fraudulent charges for you? Do they identify mistakes and credit report issues that affect your overall credit score? Many companies can also be searched via the Better Business Bureau where you can find ratings for many companies in this industry. On Google, Facebook, Yelp, you may also find reviews from previous clients as well. Identify themes and common experiences among all the feedback, especially the quality of the customer service. 3. How affordable is a credit repair company really? Whatever services a credit repair company can provide, you need to determine the fee structure and how it applies to your situation. Many companies charge an initial fee plus a monthly fee to cover basic credit repair services, updating the health of your credit report, and working to improve your overall credit score. Some provide additional levels of service that cover identity fraud, credit score management, and financial management tools. The fees will often include specialized services as well, so it may be hard to determine the complete cost of your credit repair service. Too often a website or company will tuck their prices away in hard to find places. Or they may require you to complete an initial application process before revealing the costs. Of course, the real benefit of hiring any credit repair service is to reduce your overall loan costs, clear up your credit profile, and improve your credit score. All of these will result in cost-savings to you because of the lower interest rates that accompany a better credit record. Now, there are many tasks that people perform for themselves – servicing the car, landscaping, basic legal services – but getting advice and practical help for repairing your credit profile is a financially smart move. If you’re interested in getting help from a credit repair company, reading up on the whole service is worth doing. If you’ve managed to get a good company to help you, what worked? Did you manage to do it all by yourself without using any credit repair company? How did you do the research? Suggested Reading for Choosing a credit repair company amzn_assoc_placement = "adunit0"; amzn_assoc_tracking_id = "investorblogger-20"; amzn_assoc_ad_mode = "manual"; amzn_assoc_ad_type = "smart"; amzn_assoc_marketplace = "amazon"; amzn_assoc_region = "US"; amzn_assoc_title = "Books to Help Repair Credit"; amzn_assoc_linkid = "6c35a3a60ff9e861c0e8ea85bbcd9dcf"; amzn_assoc_asins = "1484042298,B01M4Q6G4X,145632134X,1413321542,1466985410"; amzn_assoc_rows = "3"; amzn_assoc_design = "text_links"; Posted in Expenses May·31'
