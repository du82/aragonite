full_description = "Linking Posted by InvestorBlogger Increasingly, some people are concerned about the links that I have placed in posts, and may request that these links be removed. However, I freely place ALL of my links, and frown on removing links from my site. Why? Because the web is exactly that, that is its core function to link one site to another with relevance, authenticity and value to the reader. Webspam However, a lot of webmasters have gone out of their way to create hundreds or thousands of spammy links to their sites, such tactics worked until recently updates by Google penalized such backlinks. Spammy links are links that are obviously junk: regurgitated paragraphs, snipped content, garbage blogs, spammy comments, directory spam, … and so on. So, if you have lots of spammy links, by all means, remove them. This is not what InvestorBlogger is about. Blog links, like the links in this blog, are not spammy. InvestorBlogger has never, and never will be, a link farm; nor will we create any form of webspam. If you’re determined to go ahead and remove links from this site, you MUST follow the guidelines outline on the following page. I will not reply to requests that are vague, rude, threatening, inappropriate, insufficiently documented… so don’t piss me off. Mind your language & tone when you contact me (and any webmaster) requesting removal. InvestorBlogger no longer removes links except perhaps if the resource is no longer available or has become unsuitable. Reach me through the contact page. No Follow I am generally not in favor of using ‘no follow’ and regret the mess Google has caused with its link/search policies in the last few years, and have sought to diminish Google’s influence over this blog by removing the Adsense, Search, and Webmaster Tools from this site. I would urge you not to let Google bully webmasters into submission, and to show your displeasure by cutting your own use of Google down. The web needs diversity, not monopoly. And Google is in danger of becoming the web, if we are not careful. Posted in Newsbites Tagged blog, Google, interest Dec·05"
