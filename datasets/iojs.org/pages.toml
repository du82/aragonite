["https://iojs.org/en/about/previous-releases"]
title = "Node.js — Run JavaScript Everywhere"
description = "Node.js® is a JavaScript runtime built on Chrome's V8 JavaScript engine."
full_description = '''Run JavaScript EverywhereNode.js® is a free, open-source, cross-platform JavaScript runtime environment that lets developers create servers, web apps, command line tools and scripts.Download Node.js (LTS)Download Node.js (LTS)Downloads Node.js v22.14.01 with long-term support. Node.js can also be installed via version managers.Want new features sooner? Get Node.js v23.8.01 instead. Create an HTTP ServerWrite TestsRead and Hash a FileStreams PipelineWork with Threads// server.mjs import { createServer } from 'node:http'; const server = createServer((req, res) => { res.writeHead(200, { 'Content-Type': 'text/plain' }); res.end('Hello World!\n'); }); // starts a simple http server locally on port 3000 server.listen(3000, '127.0.0.1', () => { console.log('Listening on 127.0.0.1:3000'); }); // run with `node server.mjs` JavaScriptCopy to clipboardLearn more what Node.js is able to offer with our Learning materials.'''
year_published = 2025
clearnet = "https://iojs.org/en/about/previous-releases"
