description = "ioquake3 is the perfect FPS engine for your multiplayer game,  or something very different like these diverse choices of new games made with the ioquake3 engine. Get started making your own game wi…"
full_description = "New Games ioquake3 is the perfect FPS engine for your multiplayer game, or something very different like these diverse choices of new games made with the ioquake3 engine. Get started making your own game with our code, help from the our guides, and other developers on our forums. Once your game is ready for everybody, and you’d like to have your ioquake3-based game posted here, let us know on the forum. Reaction Reaction is like being inside your favorite action movie in this new game with the style of one of the most famous mods of all time, Action Quake 2 with a modern ioquake3-based engine. q3osc q3osc combines the fast-paced virtual playgrounds of FPS video games with the limitless possibilities afforded by dynamic interactive music programming languages. By exporting a variety of parameters from within the modified ioquake3 game engine over a data protocol called Open Sound Control, player movements and fired projectiles can be used to control sound synthesis and playback in a variety of computer music software. In short, this turns quake3-style levels into musical playgrounds, where hoardes of networked performers can play with sound and music in a communal experience. Star Trek Voyager: Elite Force This is Thilo’s reverse-engineered, multiplayer-only, version of Star Trek Voyager Elite Force. Fix yourself a coffee and get ready to set phasers to fun! Smokin Guns “With cordite in the air, splintered steel, shell casings and powder burns, there’s only one explanation…., Smokin’ Guns.” Go back to the wild west and shoot some dudes. This is a fantastic game for fans of Outlaws, Gun, and Red Dead Redemption. Tremulous Aliens fight Humans in this FPS/RTS hybrid that uses the ioquake3 engine at its core. World of Padman World of Padman is a colorful game with a comic-book style. It comes with 9 new weapons, several new game types and is ideal for a quick game. ZEQ2-Lite ZEQ2-Lite is an open-sourced and mod expandable project based on a highly modified ioquake3 engine foundation and features many true-to-reference DBZ visuals and mechanics. Q3Rally Q3 Rally is a racing game originally built as a mod for Quake 3, now it has gone standalone and offers even more racing fun! Monkeys Of Doom A multi-platform cel-shaded first person shooter that also has an Android port using Kwaak3. Turtle Arena A third person fighing game created by ZTurtleMan."
