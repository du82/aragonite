description = "If you like ioquake3 and you’d like to give back, excellent, we could use your help! Here’s how to help: Support OthersPeople have questions, they ask them on our forums, Live…"
full_description = "Get Involved If you like ioquake3 and you’d like to give back, excellent, we could use your help! Here’s how to help: Support OthersPeople have questions, they ask them on our forums, Live Chat, and on other services and websites. If the answers are already in the one of our guides, copy and paste the answer and then link the people asking questions to those pages if they have more questions. Bug Triage & TestingWe need help duplicating and managing our bug queues on Github and Bugzilla. We need people to test out ioquake3 with every mod, software, and hardware configuration. Play ioquake3 and run servers.Check out the Players Guide and Sys Admin Guide. We work on ioquake3 to keep Quake 3 and games based on our engine alive. CodeLike most free software projects, we need more developers to help us keep up to date with changes to our supported platforms, new platforms, and new projects that work with ioquake3.Our most important project right now is building a launcher/updater for ioquake3 so that we can get players up-to-date with our test builds as our last stable release was in 2009 (yikes!)We also need a build engineer to help us modernize our installers and get releases out of the door on Windows, macOS, and Linux.The source code for ioquake3 is available here. MoneyMoney buys servers, hosting, workstations, and time.You can donate directly to our developers:Ryan “icculus” Gordon has a Patreon for ongoing donations.SmileTheory has a Patreon for ongoing donations.Jack “Nuclear Monster” Slater has a Patreon for ongoing donations and a Ko-Fi for one-off donations.ZTurtleMan has a Ko-Fi for one-off donations. Social MediaFollow ioquake3 ioquake3 on Mastodon and Blue Sky. Share our posts. Let other Quake 3 players know about ioquake3, some people are still playing with id’s client! I don’t know where to get started, can I still help?Ask on our forums, or Live Chat and we’ll get you on the right track."
year_published = 2021
year_updated = 2024
