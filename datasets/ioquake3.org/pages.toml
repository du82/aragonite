["https://ioquake3.org/category/the-site"]
title = "the site – ioquake3"
full_description = "Category: the site ioquake3 Social Media Updates Dec 9, 2023 — by Mr. Nuclear Monster in the site Update (November 2, 2024): Cohost has unfortunately shut down. You can continue to find us on Mastodon and the other services linked in this post. We’ve moved our social media to two main platforms, Cohost and Mastodon. Please give ioquake3 a follow on those services to stay up-to-date with the latest updates about ioquake3. Do… Thank you, Digital Ocean! Nov 2, 2023 — by Mr. Nuclear Monster in the site For a few years now ioquake3 has been proudly sponsored by Digital Ocean. We’re proud to renew this sponsorship again and wanted to thank the generous and fine people at Digital Ocean for doing so. Digital Ocean supplies projects, companies, and people with excellent cloud hosting services from fully managed hosting, app platforms, databases, and… Test Builds Available Again May 20, 2021 — by Mr. Nuclear Monster in ioquake3, the site Head over to the downloads page to download a test build of ioquake3. The test builds are very bare-bones but can be extracted over a regular installation of Quake 3: Arena’s data files and then launch the ioquake3 executable to use our updated software instead of id’s executable from 2005. You may see warnings from… Wiki content moving to website Mar 10, 2021 — by Mr. Nuclear Monster in the site Just a quick note to say that some content from our wiki is now available on our website. For example the Player’s Guide, SysAdmin Guide, and Get Involved. More is on the way. A New ioquake3.org Jan 12, 2021 — by Mr. Nuclear Monster in ioquake3, the site Way back in the middle of 2019 the ioquake3 project ran into a security issue, 2020 was an almost complete tire fire and 2021 is… not great! Still, we are finally digging our way out of that mess and moving on. Some things are broken today, but the meta server remains operational and you can… Thank You, Discourse! Aug 4, 2016 — by Mr. Nuclear Monster in the site We’re hosted by Discourse now! ioquake3 hosting fundraiser Jun 26, 2009 — by Mr. Nuclear Monster in the site Update: We’ve met our goal, the drive has ended. Thank you again for all your help! Donations are required for ioquake3’s hosting to continue every two years. Next month, ioquake3’s hosting bill comes due. Fortunately it is only due once every two years which means that requests for donations will be infrequent. Thank you for… Check out the new wiki! Nov 30, 2007 — by Mr. Nuclear Monster in the site With the move to wordpress, and dreamhost, we’ve also added a Wiki, check it out! ioquake3 moved to dreamhost Aug 27, 2007 — by Mr. Nuclear Monster in the site If you’re reading this, your DNS is up-to-date and you’re on the new ioquake3.org host. Quake 3 Models Apr 29, 2007 — by Mr. Nuclear Monster in the site As a treat for serious Quake 3 fans, we’ve got a dump of all the old polycount Q3 models here. Enjoy. Next Page→"
