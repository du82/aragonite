title = "Turtle Arena 0.6 Released! – ioquake3"
description = "Boasting better than HD graphics, the Turtle Arena team have released version 0.6 of their Turtle-Powered video game. Here’s what’s new: Four player splitscreen! The turtles now have ta…"
full_description = "Turtle Arena 0.6 Released! Apr 13, 2012 — by Mr. Nuclear Monster in derivative games Boasting better than HD graphics, the Turtle Arena team have released version 0.6 of their Turtle-Powered video game. Here’s what’s new: Four player splitscreen! The turtles now have tails, like in the original TMNT comics. Added cel-shading to many 3D models (code from ZEQ2-lite) Remade many images at higher resolution (most or all UI/HUD graphics are “HD”) TrueType fonts are used by default and are rendered to screen size (always look nice). Redesigned main HUD area. Added joystick select menu. Created new texture for Overload base. Possible to play while hosting an internet server using the game client. Team name is now colorized in team play messages. Now uses dpmaster protocol, instead of quake3 master protocol, keeps the game separate on master server. Automatically choose next map in multiplayer using scripts/arenas.txt (and scripts/*.arena), allows new maps to be automatically be added to map rotation. Lots of fixes from ioquake3 contributers, updated from ioq3 revision 1794 to 2236. …and many other bug fixes and improvement! You can download Z Turtle Arena for Windows or Linux. Order some pizza while you do so. ebx Extraordinary Beat X turtle arena ztm Mr. Nuclear Monster A Philadelphian living in Hawaii. If you enjoy my work please consider supporting me on Patreon or Ko-Fi. Comments 2 responses to “Turtle Arena 0.6 Released!” Cyril November 28, 2012 This website does not exist! TimeDoctor December 7, 2012 Hey Cyril, I’ve updated the links now. ←Previous: Reaction Beta 1 Next: Calling all content creators!→"
