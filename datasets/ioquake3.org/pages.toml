title = "ioquake3 – ioquake3"
full_description = "Tag: ioquake3 Thank You! Nov 28, 2024 — by Mr. Nuclear Monster in ioquake3 It’s the Thanksgiving holiday in the US today, but even if you don’t celebrate that holiday, we want to thank you for contributing to ioquake3 over the years. We really appreciate it. Whatever the contribution is, code, or documentation, or making your own game/mod, or running a server, or playing ioquake3 and the other games… Ryan C. Gordon Ports ioquake3 From SDL2 to SDL3 in 90 Minutes! Nov 3, 2024 — by Mr. Nuclear Monster in ioquake3 One of the foundational parts of ioquake3 is the Simple Directmedia Layer (SDL). This open-source library makes developing any game easier, but it is especially useful for cross-platform games that want to escape the effects of getting locked in by other libraries like DirectX which are only available on Microsoft’s platforms. SDL is so useful,… Merry Quakemas! Dec 11, 2023 — by Mr. Nuclear Monster in ioquake3 We’ve got a holiday live stream and a game server! Thank you, Digital Ocean! Nov 2, 2023 — by Mr. Nuclear Monster in the site For a few years now ioquake3 has been proudly sponsored by Digital Ocean. We’re proud to renew this sponsorship again and wanted to thank the generous and fine people at Digital Ocean for doing so. Digital Ocean supplies projects, companies, and people with excellent cloud hosting services from fully managed hosting, app platforms, databases, and… ioquake3 and Xbox Game Pass Aug 21, 2021 — by Tom Kidd in ioquake3 On August 19, 2021 during QuakeCon 2021, Quake III: Arena was added to the Microsoft Store for Windows, available for purchase or included with Xbox Game Pass for subscribers, adding a new way for gamers to be able to play the game, and a new source for the data files needed to use ioquake3. ioquake3… Test Builds Available Again May 20, 2021 — by Mr. Nuclear Monster in ioquake3, the site Head over to the downloads page to download a test build of ioquake3. The test builds are very bare-bones but can be extracted over a regular installation of Quake 3: Arena’s data files and then launch the ioquake3 executable to use our updated software instead of id’s executable from 2005. You may see warnings from… Idle Thumbs’ ioquake3 VOD Mar 1, 2021 — by Mr. Nuclear Monster in ioquake3 ioquake3 git branch renamed to “main” Feb 13, 2021 — by Mr. Nuclear Monster in ioquake3 This is the bare minimum of work to dismantle white supremacy. If you’re in the United States, please donate to a bail fund, join BLM, help organize your community against the white supremacist state, join your local Tenants Union, and join Food not Bombs around the world. If you compile your own ioquake3 from git… A New ioquake3.org Jan 12, 2021 — by Mr. Nuclear Monster in ioquake3, the site Way back in the middle of 2019 the ioquake3 project ran into a security issue, 2020 was an almost complete tire fire and 2021 is… not great! Still, we are finally digging our way out of that mess and moving on. Some things are broken today, but the meta server remains operational and you can… Help Wanted: Volunteer Linux System Administrator Sep 9, 2017 — by Mr. Nuclear Monster in ioquake3 ioquake3 is an entirely volunteer-run project and we need more volunteers! Please share this post with your friends. If you love maintaining Linux servers, and specifically Ubuntu Server, this is the role for you. The ioquake3 project is looking for a qualified Linux Systems Administrator to assist with maintaining our Ubuntu VPS. We need someone… Next Page→"
