title = "News – ioquake3"
description = "Play Quake 3, mods, new games, or make your own!"
full_description = "ioquake3 news Thank You! It’s the Thanksgiving holiday in the US today, but even if you don’t celebrate that holiday, we want to thank you for contributing to ioquake3 over the years. We really appreciate it. Whatever the contribution is, code, or documentation, or making your own game/mod, or running a server, or playing ioquake3 and the other games… November 28, 2024 Ryan C. Gordon Ports ioquake3 From SDL2 to SDL3 in 90 Minutes! One of the foundational parts of ioquake3 is the Simple Directmedia Layer (SDL). This open-source library makes developing any game easier, but it is especially useful for cross-platform games that want to escape the effects of getting locked in by other libraries like DirectX which are only available on Microsoft’s platforms. SDL is so useful,… November 3, 2024 Fundraiser for Jennell Jaquays’ Heathcare and Funeral Expenses Jannell Jaquays was one of the key level designers for Quake 3: Arena and worked on many other games as well. Her work outside of games included fighting for transgender rights. Jaquays passed away today and is survived by her two children and wife Rebecca Heineman who is raising money to pay for medical expenses… January 11, 2024 Merry Quakemas! We’ve got a holiday live stream and a game server! December 11, 2023 ioquake3 Social Media Updates Update (November 2, 2024): Cohost has unfortunately shut down. You can continue to find us on Mastodon and the other services linked in this post. We’ve moved our social media to two main platforms, Cohost and Mastodon. Please give ioquake3 a follow on those services to stay up-to-date with the latest updates about ioquake3. Do… December 9, 2023 7dfps Game Jam Running From December 8 to 16 Want to try making your first first person shooter? Maybe you’ve made a few already. The 7dfps (7 Day FPS) challenge is running from December 8th 2023 to the 16th on itch.io. The 7dfps challenge is a great opportunity to get started using ioquake3 to make your FPS. 7dfps has their own Discord server for… November 3, 2023 Thank you, Digital Ocean! For a few years now ioquake3 has been proudly sponsored by Digital Ocean. We’re proud to renew this sponsorship again and wanted to thank the generous and fine people at Digital Ocean for doing so. Digital Ocean supplies projects, companies, and people with excellent cloud hosting services from fully managed hosting, app platforms, databases, and… November 2, 2023 Legacy and M1 macOS ioquake3 support macOS now has two kinds of Universal Binaries. The first were from the mid-2000’s when Apple started their transition from the PowerPC platform to Intel. The second are for Apple’s transition from Intel’s 64bit x86 platform to Apple’s in-house ARM-based Apple Silicon processors. If you visit our Downloads page you will now find two new kinds of test builds… September 13, 2021 ioquake3 and Xbox Game Pass On August 19, 2021 during QuakeCon 2021, Quake III: Arena was added to the Microsoft Store for Windows, available for purchase or included with Xbox Game Pass for subscribers, adding a new way for gamers to be able to play the game, and a new source for the data files needed to use ioquake3. ioquake3… August 21, 2021 ioquake3 IRC moved to Libera The freenode situation is a little complicated, but we moved our IRC presence to the new Libera.chat systems a few days ago due to those events. Today the new owners of freenode responded by removing our control of the #ioquake3 and #iodoom3 channels which makes it pretty clear that sticking with Freenode would have been… May 26, 2021"
