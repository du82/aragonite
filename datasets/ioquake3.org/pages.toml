["https://ioquake3.org"]
title = "ioquake3 – Play Quake 3, mods, new games, or make your own!"
description = "Play Quake 3, mods, new games, or make your own!"
full_description = "ioquake3 Download Windows macOS Linux Get more downloads here. Get Started with a Guide Players Guide SysAdmin Guide News Thank You!It’s the Thanksgiving holiday in the US today, but even if you don’t celebrate that holiday, we want to thank you for contributing to ioquake3 over the years. We really appreciate it. Whatever the contribution is, code, or documentation, or making your own game/mod, or running a server, or playing ioquake3 and the other games… Read more: Thank You! For more ioquake3 news, click here. What is ioquake3? ioquake3 is a free and open-source software first person shooter engine based on the Quake 3: Arena and Quake 3: Team Arena source code. The source code is licensed under the GPL version 2, and was first released under that license by id software on August 20th, 2005. Since then, our dedicated team has working hard to improve it, fixing bugs, and adding just the right new features to make the engine even better than before. What can I do with ioquake3? You can use it to play Quake 3: Arena, Quake 3: Team Arena, and the mods people have made for those games. See our Player’s Guide for instructions and help playing ioquake3, or our SysAdmin Guide to get started running your own game server. Or play a game that other great teams using ioquake3 have made if you don’t already have Quake 3.You can also make your own game from our source code in git on gibhub. If you like ioquake3 and you’d like to give back or get involved, excellent, we could use your help! Check out the all of the ways to do that by clicking this link or just follow us on Mastodon to keep in touch. Thank You! Thank you to everyone who has ever contributed to ioquake3, this project would not exist without you! ioquake3 would not be possible without contributions from volunteers and important resources from Digital Ocean, Discourse.org, icculus.org, and Nuclear Monster."
