full_description = "ioquake3 IRC moved to Libera May 26, 2021 — by Mr. Nuclear Monster in ioquake3 The freenode situation is a little complicated, but we moved our IRC presence to the new Libera.chat systems a few days ago due to those events. Today the new owners of freenode responded by removing our control of the #ioquake3 and #iodoom3 channels which makes it pretty clear that sticking with Freenode would have been a mistake. they even removed the ability for us to let people know what was going on. Our new Libera.chat #ioquake3 and #iodoom3 IRC channels and Discord channels are bridged, and those are where we will provide discussion and support for those communities instead of Freenode. freenode libera.chat Mr. Nuclear Monster A Philadelphian living in Hawaii. If you enjoy my work please consider supporting me on Patreon or Ko-Fi. ←Previous: Test Builds Available Again Next: ioquake3 and Xbox Game Pass→"
