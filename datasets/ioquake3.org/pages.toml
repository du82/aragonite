full_description = "ioquake3 git branch renamed to “main” Feb 13, 2021 — by Mr. Nuclear Monster in ioquake3 This is the bare minimum of work to dismantle white supremacy. If you’re in the United States, please donate to a bail fund, join BLM, help organize your community against the white supremacist state, join your local Tenants Union, and join Food not Bombs around the world. If you compile your own ioquake3 from git please note that the branch formerly known as “master” is now “main” It takes just a second to fix your local checkout from the command-line: git branch -m master main git fetch origin git branch -u origin/main main git ioquake3 Mr. Nuclear Monster A Philadelphian living in Hawaii. If you enjoy my work please consider supporting me on Patreon or Ko-Fi. ←Previous: A New ioquake3.org Next: Idle Thumbs’ ioquake3 VOD→"
