full_description = "Updated Builds Jun 7, 2008 — by Mr. Nuclear Monster in ioquake3 For a long time now, we haven’t released a new version of ioquake3. You’re probably wondering if we’re dead or not, then you see how we’re talking about VOIP, or IPV6, or stereoscopic rendering or whatever, and you want in on that action. For you, precious reader, we now have Angst Builds. Enjoy. ioquake3 releases Mr. Nuclear Monster A Philadelphian living in Hawaii. If you enjoy my work please consider supporting me on Patreon or Ko-Fi. Comments 4 responses to “Updated Builds” Blaenk Denum June 7, 2008 Sweet 🙂 BlaenkDenum June 7, 2008 Testing second comment. rhY June 9, 2008 Ummm… I tried installing this 8 ways from sunday and it just keeps telling me I don’t have quake 3 installed, which of course I do. I wanted to try it out with Urban Terror. Urban Terror + mumble + my 3d shades would be THE WIN! SlippJigg June 23, 2008 Did you copy all of the .pak files for your baseq3 to the new baseq3? try the…you also need to copy the misson pack .pak files if you have team arena also hope this help you SlippJigg ←Previous: Interview with Robert Hamilton, Creator of q3osc Next: New ioquake3 Icon Set→"
