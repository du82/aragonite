full_description = "ioquake3 Social Media Updates Dec 9, 2023 — by Mr. Nuclear Monster in the site Update (November 2, 2024): Cohost has unfortunately shut down. You can continue to find us on Mastodon and the other services linked in this post. We’ve moved our social media to two main platforms, Cohost and Mastodon. Please give ioquake3 a follow on those services to stay up-to-date with the latest updates about ioquake3. Do note that if you’re looking for help and support the place to go is as always our discourse forums helpfully provided by the fine folks at the Discourse project. Additionally, we’ve just set up new accounts on Twitch and YouTube for some future fun plans. Please give us a follow there as well to support us going forward into 2024 and don’t forget about the 7dfps game jam that just started if you’re interested in making your own FPS project! Mr. Nuclear Monster A Philadelphian living in Hawaii. If you enjoy my work please consider supporting me on Patreon or Ko-Fi. ←Previous: 7dfps Game Jam Running From December 8 to 16 Next: Merry Quakemas!→"
