full_description = "Mailing List Move May 6, 2008 — by Mr. Nuclear Monster in ioquake3 Update 2: The mailing list move is complete, archives are fully available now. Update 1: The mailing list move is almost complete, archives remain to be moved because Dreamhost support isn’t done yet. But everyone who was subscribed should be resubscribed. Please refer to http://lists.ioquake.org/ for all inquiries regarding the discussion list now. The Discussion list is the only list that is moving for now. The main discussion list is moving to lists.ioquake.org. Things are going as planned with this move, but are taking a little longer than expected. Expect another update when the move is complete. discussion lists ioquake3 mailing list Mr. Nuclear Monster A Philadelphian living in Hawaii. If you enjoy my work please consider supporting me on Patreon or Ko-Fi. ←Previous: Stereoscopic viewing in ioquake3 Next: q3osc: Using ioquake3 as a musical environment→"
