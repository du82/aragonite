title = "ryan gordon – ioquake3"
full_description = "Tag: ryan gordon Ryan C. Gordon Ports ioquake3 From SDL2 to SDL3 in 90 Minutes! Nov 3, 2024 — by Mr. Nuclear Monster in ioquake3 One of the foundational parts of ioquake3 is the Simple Directmedia Layer (SDL). This open-source library makes developing any game easier, but it is especially useful for cross-platform games that want to escape the effects of getting locked in by other libraries like DirectX which are only available on Microsoft’s platforms. SDL is so useful,… Auto-Update Update Jul 13, 2017 — by Mr. Nuclear Monster in ioquake3 Ryan “icculus” Gordon has surprised us with a cross-platform auto-updater for ioquake3. Created thanks to contributions to his patreon campaign, here’s how Ryan describes it: I’ve written an autoupdater for ioquake3, with the intention of the game operating much like Google Chrome…it just stays up to date and you don’t really notice. This has been… VOIP Support in SVN May 30, 2008 — by Mr. Nuclear Monster in ioquake3 Lets examine two quick points: Hardcore gamers like choices. Hardcore gamers like VOIP. Based on these theories, ioquake3 is adding VOIP support for the next release. This internal support is going to bring along with it support for (entirely optional) Mumble positional VOIP audio. More nerd-speak after the break, the short and quick of it is,… Mac OS X (Power PC) Fixes May 28, 2006 — by Mr. Nuclear Monster in ioquake3 We’ve got a number of fixes in subversion for the JIT VM, thanks to Tony J White and Ryan “Spent Two Solid Hours Weed Whacking” Gordon in Bug 2519. This also solves all the major remaining code issues with regard to OS X. For the final issues check out Bug 2723."
