title = "Thank you, Digital Ocean! – ioquake3"
description = "For a few years now ioquake3 has been proudly sponsored by Digital Ocean. We’re proud to renew this sponsorship again and wanted to thank the generous and fine people at Digital Ocean for doi…"
full_description = "Thank you, Digital Ocean! Nov 2, 2023 — by Mr. Nuclear Monster in the site For a few years now ioquake3 has been proudly sponsored by Digital Ocean. We’re proud to renew this sponsorship again and wanted to thank the generous and fine people at Digital Ocean for doing so. Digital Ocean supplies projects, companies, and people with excellent cloud hosting services from fully managed hosting, app platforms, databases, and kubernetes to virtual machines and storage. We use Digital Ocean’s services to host our website, game servers, and more services that benefit ioquake3’s users and it has been so reliable and easy to use. Digital Ocean really helped us out, and they can help you, too. If you sign up through our referral link you’ll get to try Digital Ocean’s services out for yourself and you’ll be supporting ioquake3. You can also use this link to find out more about Digital Ocean’s program for sponsoring open-source projects. Our thanks again to Digital Ocean for their continued support. If you’d like to support the ioquake3 project please check out this link. digital ocean ioquake3 sponsorship Mr. Nuclear Monster A Philadelphian living in Hawaii. If you enjoy my work please consider supporting me on Patreon or Ko-Fi. ←Previous: Legacy and M1 macOS ioquake3 support Next: 7dfps Game Jam Running From December 8 to 16→"
