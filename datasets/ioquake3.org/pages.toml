full_description = "Fundraiser for Jennell Jaquays’ Heathcare and Funeral Expenses Jan 11, 2024 — by Mr. Nuclear Monster in quake3 Jannell Jaquays was one of the key level designers for Quake 3: Arena and worked on many other games as well. Her work outside of games included fighting for transgender rights. Jaquays passed away today and is survived by her two children and wife Rebecca Heineman who is raising money to pay for medical expenses and the funeral. Please support the fundraiser if you can. https://www.gofundme.com/f/jennell-jaquays-has-a-long-road-back Mr. Nuclear Monster A Philadelphian living in Hawaii. If you enjoy my work please consider supporting me on Patreon or Ko-Fi. Comments 1 response to “Fundraiser for Jennell Jaquays’ Heathcare and Funeral Expenses” ←Previous: Merry Quakemas! Next: Ryan C. Gordon Ports ioquake3 From SDL2 to SDL3 in 90 Minutes!→"
