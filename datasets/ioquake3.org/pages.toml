["https://ioquake3.org/tag/ioquake3/page/2"]
title = "ioquake3 – Page 2 – ioquake3"
full_description = "Tag: ioquake3 Auto-Update Update Jul 13, 2017 — by Mr. Nuclear Monster in ioquake3 Ryan “icculus” Gordon has surprised us with a cross-platform auto-updater for ioquake3. Created thanks to contributions to his patreon campaign, here’s how Ryan describes it: I’ve written an autoupdater for ioquake3, with the intention of the game operating much like Google Chrome…it just stays up to date and you don’t really notice. This has been… Help Wanted Apr 2, 2017 — by Mr. Nuclear Monster in ioquake3 Last month I wrote about an important security update, and we were lucky that the news was spread far and wide but many players still didn’t see it. Even if they read the news, and they updated to the latest build of ioquake3, they wouldn’t have caught the follow-up security commits to the code repository unless they downloaded… Important Security Update: Please Update ioquake3 Immediately Mar 13, 2017 — by Mr. Nuclear Monster in ioquake3 Please immediately update ioquake3 to the latest test build before you connect to any online servers. Despite the name, the test builds are in fact way more stable and secure than any release at this time. In doing so you’ll also receive access to all kinds of other updates and changes that we’ve made since… ioquake3… in Docker?! Jun 26, 2015 — by Mr. Nuclear Monster in ioquake3 The folks from the open platform for building, shipping, and running distributed applications called Docker demonstrated a containerized version of ioquake3 at Dockercon. Not just the server, but also the client. Docker’s Arnaud “icecrime” Porterie even called ioquake3 “The best game ever” in their dockerfile description. I don’t think I could be more proud. They… Happy New Year, ioquake3 and github! Jan 1, 2013 — by Mr. Nuclear Monster in ioquake3 Hi All, This August will be the 7th Anniversary of ioquake3! Time flies when you’re fragging fools and breaking builds. We still haven’t had a release since 2009. Don’t worry, we still have another 365 days to go until it has been 5 years since a release! The real reason for this post is that I… ioquake3 and OS X Mountain Lion Aug 8, 2012 — by Mr. Nuclear Monster in ioquake3 The latest version of OS X, Mountain Lion has been available for a little while and we have now confirmed that ioquake3’s latest SVN (revision 2306) compiles and runs smoothly on it. If you already have ioquake3 installed on your intel Mac running 10.6 or greater please try a test build: It should run fine under… Updated Builds Jun 7, 2008 — by Mr. Nuclear Monster in ioquake3 For a long time now, we haven’t released a new version of ioquake3. You’re probably wondering if we’re dead or not, then you see how we’re talking about VOIP, or IPV6, or stereoscopic rendering or whatever, and you want in on that action. For you, precious reader, we now have Angst Builds. Enjoy. VOIP Support in SVN May 30, 2008 — by Mr. Nuclear Monster in ioquake3 Lets examine two quick points: Hardcore gamers like choices. Hardcore gamers like VOIP. Based on these theories, ioquake3 is adding VOIP support for the next release. This internal support is going to bring along with it support for (entirely optional) Mumble positional VOIP audio. More nerd-speak after the break, the short and quick of it is,… q3osc: Using ioquake3 as a musical environment May 22, 2008 — by Mr. Nuclear Monster in derivative games, ioquake3 Robert Hamilton of the Stanford University Center for Computer Research in Music and Acoustics has just released a fully usable version of q3osc. From the Forum post: q3osc is my updated version of Julian Oliver’s older q3apd mod which streamed user data from quake3 to the Pure Data (PD) audio processing language. I’ve built a… Mailing List Move May 6, 2008 — by Mr. Nuclear Monster in ioquake3 Update 2: The mailing list move is complete, archives are fully available now. Update 1: The mailing list move is almost complete, archives remain to be moved because Dreamhost support isn’t done yet. But everyone who was subscribed should be resubscribed. Please refer to http://lists.ioquake.org/ for all inquiries regarding the discussion list now. The Discussion… ←Previous Page Next Page→"
