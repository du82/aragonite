["https://ioquake3.org/ioquake3/thank-you"]
title = "Thank You! – ioquake3"
description = "It’s the Thanksgiving holiday in the US today, but even if you don’t celebrate that holiday, we want to thank you for contributing to ioquake3 over the years. We really appreciate it. W…"
full_description = "Thank You! Nov 28, 2024 — by Mr. Nuclear Monster in ioquake3 It’s the Thanksgiving holiday in the US today, but even if you don’t celebrate that holiday, we want to thank you for contributing to ioquake3 over the years. We really appreciate it. Whatever the contribution is, code, or documentation, or making your own game/mod, or running a server, or playing ioquake3 and the other games and mods that use it. Thank you! If you haven’t contributed to ioquake3 yet, check out this link to get started. Thank you to Digital Ocean, for sponsoring our servers! If you sign up for DO with this link, you can support ioquake3 and get $200 worth of credits to try out Digital Ocean’s services, too. Thank you to Discourse for for sponsoring our Discourse! If you need a home for your community, you should choose Discourse, we picked Discourse long before we got the sponsorship because it’s just that good. You should, too! Thank you to Ryan “icculus” Gordon for hosting services and so many big contributions, and being an awesome person! You should hire Ryan if you need one of the world’s best developers to work on your project. He just ported ioquake3 from SDL 2 to SDL 3 in 90 minutes! Check out that link for ways to support Ryan directly. ioquake3 wouldn’t exist at all without him. Thank you to id software for releasing the source code to Quake III: Arena! It’s been almost 20 years since id released the source code and it’s been 25 years since Quake III came out in 1999. Wow! ioquake3 thank you thanksgiving Mr. Nuclear Monster A Philadelphian living in Hawaii. If you enjoy my work please consider supporting me on Patreon or Ko-Fi. ←Previous: Ryan C. Gordon Ports ioquake3 From SDL2 to SDL3 in 90 Minutes!"
