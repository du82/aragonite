full_description = "Category: derivative games 7dfps Game Jam Running From December 8 to 16 Nov 3, 2023 — by Mr. Nuclear Monster in derivative games Want to try making your first first person shooter? Maybe you’ve made a few already. The 7dfps (7 Day FPS) challenge is running from December 8th 2023 to the 16th on itch.io. The 7dfps challenge is a great opportunity to get started using ioquake3 to make your FPS. 7dfps has their own Discord server for… Turtle Arena 0.6 Released! Apr 13, 2012 — by Mr. Nuclear Monster in derivative games Boasting better than HD graphics, the Turtle Arena team have released version 0.6 of their Turtle-Powered video game. Here’s what’s new: Four player splitscreen! The turtles now have tails, like in the original TMNT comics. Added cel-shading to many 3D models (code from ZEQ2-lite) Remade many images at higher resolution (most or all UI/HUD graphics… Reaction Beta 1 Apr 1, 2012 — by Mr. Nuclear Monster in derivative games The first beta standalone release of Reaction, an ioquake3-based Action Quake 2-styled game is now available. Previously, Reaction required a full install of Quake 3: Arena to play. If you’ve never played Action Quake 2, you should know that it was in the style of your favorite realistic action movies. Guns akimbo, headshots, ridiculous trick… ioquake3 at the movies: Urban Terror running on an eee PC Feb 11, 2009 — by Mr. Nuclear Monster in derivative games If you want to see your game running on eee PCs, use ioquake3 for your engine. As demonstrated with the hit action shooter, Urban Terror, after the break: Interview with Robert Hamilton, Creator of q3osc Jun 1, 2008 — by Mr. Nuclear Monster in derivative games As a follow up to this article about the excellent q3osc musical environment built using ioquake3 I had a quick sit down with Robert Hamilton and talked about q3osc, ioq3 and everything in between. If you haven’t heard of q3osc this will make for some great reading, after the break q3osc: Using ioquake3 as a musical environment May 22, 2008 — by Mr. Nuclear Monster in derivative games, ioquake3 Robert Hamilton of the Stanford University Center for Computer Research in Music and Acoustics has just released a fully usable version of q3osc. From the Forum post: q3osc is my updated version of Julian Oliver’s older q3apd mod which streamed user data from quake3 to the Pure Data (PD) audio processing language. I’ve built a… Comparison of free software shooters Jan 3, 2008 — by Mr. Nuclear Monster in derivative games, ioquake3 Several ioquake3 based games were compared recently over at Linux-Gamers.net. The article should be useful for non-linux gamers as well, due to the multi-platform nature of all the games mentioned within. Urban Terror 4.1 Dec 23, 2007 — by Mr. Nuclear Monster in derivative games The Urban Terror team have released version 4.1 of their stand-alone game based on ioquake3! Go get it! World of Padman 1.2 Dec 6, 2007 — by Mr. Nuclear Monster in derivative games The World of Padman team have released version 1.2 of their stand-alone game using the ioquake3 engine. Head over to their site to check it out for Windows and Linux, a Mac version is forthcoming. OpenArena 0.7.0 Jul 7, 2007 — by Mr. Nuclear Monster in derivative games Go check it out! Next Page→"
