full_description = "A New ioquake3.org Jan 12, 2021 — by Mr. Nuclear Monster in ioquake3, the site Way back in the middle of 2019 the ioquake3 project ran into a security issue, 2020 was an almost complete tire fire and 2021 is… not great! Still, we are finally digging our way out of that mess and moving on. Some things are broken today, but the meta server remains operational and you can still access our source code at GitHub. There are no downloads available on ioquake3.org today. Note: the above information is out of date, see this post. New posts will go up when features return (The wiki is notably offline at the moment.) Cryptocurrency is still a scam, GitHub and Microsoft should drop their ICE and military contracts, Black Lives Matter. ioquake3 Mr. Nuclear Monster A Philadelphian living in Hawaii. If you enjoy my work please consider supporting me on Patreon or Ko-Fi. Comments 4 responses to “A New ioquake3.org” ←Previous: ioquake3 Security Notice 06/13/19: Test Builds Possibly Compromised Next: ioquake3 git branch renamed to “main”→"
