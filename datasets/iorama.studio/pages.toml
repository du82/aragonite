["https://iorama.studio/looom-user-guide"]
title = "Looom user guide"
full_description = "Animation being a time-based art form makes fundamental use of timelines in its crafting. In Looom each layer is its own timeline which is independent in its length and speed, these layers are called threads and are represented by rotating reels. You will notice dots arranged inside the reels, these are individual frames. Each thread has its visual appearance which consists of color and an option between line or fill. These visual settings affect the whole thread and can always be tweaked, even while playing. You can create up to five threads in a project each with its own time and appearance identities.The sum of all threads in a project is called a weave. In order to navigate smoothly and intuitively through time in Looom we created a device which we call the Pulley. Simply place a finger on the canvas and the pulley will show up. You Can rotate the pulley in both directions to simply scrub time and navigate around your animation. You can also use the pulley to preview the animations you are making, an action know as 'Flipping' in the traditional craft of drawn animation.For stepping one frame at a time securely and swiftly simply swipe your finger down for frame-forward or up for frame-backwards.If you are using Looom on iPad without an Apple Pencil be sure you turn on finger draw mode in the settings page. In this mode you can still access the pulley it is simply restricted to the area next to the reels. iPhone / iPad without Apple PencilIf you are using Looom on iPad without an Apple Pencil be sure you turn on finger draw mode in the settings page. In this mode you can still access the pulley it is simply restricted to the area next to the reels. In this mode, you can adjust the properties of the selected thread. To enter Thread-edit mode press and hold one of your thread reels. * Ping-pong mode is relative, meaning it will play form your current frame and reverse on the last frame. To set Ping-pong mode to be non-relative, turn the bookmark ON on the frame you want the Ping-pong to start on."
year_published = 2025
clearnet = "https://iorama.studio/looom-user-guide"
