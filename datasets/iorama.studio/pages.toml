["https://iorama.studio/chantlings-press-release"]
title = "chantlings press release"
full_description = "Chantlings is a singing app for the iPhone and iPad. It was made for anyone brave enough to explore the colors and shapes of their voice through singing with various characters. You control the Chantlings purely through singing. They pick up on the tonality of what you sing and improvise harmonies to compliment your melodies. Not only will they pick up on your musical guidance but also the words you pronounce and the rhythm of your voice. Each Chantling has its own distinctive voice, you can experiment with different combinations. You will experience the tightest bond with the Chantlings using a wired set of headphones but you can also use wireless headphones, Bluetooth speakers or even Airplay to your Apple TV.Chantlings is using cutting edge technology to transform incoming audio into polyphonic music."
