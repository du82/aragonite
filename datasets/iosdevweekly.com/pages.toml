title = "Issue 701 – iOS Dev Weekly"
full_description = "Issue 70128th February 2025Written by Dave VerwerCommentSometimes coming up with an opening comment for this newsletter that’s worth reading can feel like I’m struggling through the day with a fever. This week I was faced with actually writing one with a fever of 40ºC (104°F) which I’ve had since Monday. 😬I’m starting to feel a little better today, but I’ll still keep the opening commentary short, as I must admit I’m still having difficulty forming coherent thoughts, let alone interesting ones! Enjoy the links.Dave VerwerSponsored LinkStop Treating Mobile Apps Like Web AppsDiscover why the web development model does not work for mobile app development and adopt winning strategies for success in the hyper-competitive mobile market. Read the blog post now.NewsNew places to find out Apple Developer newsRegardless of what I said last week, it’s great to see Apple expand where they are posting updates. The Swift language now has accounts on Bluesky and Mastodon and Apple Developer is now on WeChat, too.Also, don’t forget that RSS still exists and is just as wonderful as ever. Most of the official Apple blogs and news sites support it and you can find links to the feeds for all of them, and many more, on the iOS Dev Directory.I’m really happy to see this happen. Finally! 👍CodeWhat’s new in Swift 6.1?What’s new in Swift 6.1, which received its first public beta this week? Yep, you guessed it, more strict concurrency improvements! 🎉 Matt Massicotte has all the details, because of course he does! ❤️Is there anything other than concurrency-related changes in this release? Yes! If you’re interested in “imported member visibility”, check out Donny Wals’ latest post.OllamaIt’s great to see Mattt publish at NSHipster again, with two articles since the start of this year. Welcome back! Here he discusses his new Swift package, Ollama, and why you shouldn’t wait for Apple APIs to include LLM functionality in your apps.Tapping on Stack ViewsHow easy is it to make a stack in SwiftUI tappable across its entire surface? Very easy, but maybe not immediately obvious. Let Keith Harrison stop you going down some dead ends by giving you the answer.VideosSwift DevRoom at FOSDEM 2025 VideosHere you go! You may have heard there was a sizeable contingent of Swift content at FOSDEM 2025, and here it is! I believe there are a couple of talks missing videos, but I’m sure you’ll find something to entertain and educate in the list.JobsiOS framework developer @ Nutrient (formerly PSPDFKit) – Design APIs that will affect hundreds of apps, and create UIs used by millions of users. Collaborate globally in a small team working on the leading document SDK for iOS, macOS and visionOS. Make the most of a flexible schedule, and attend annual retreats at exciting places around the world. – Remote (Anywhere)iOS Engineer @ Bevel – We’re building at the forefront of consumer health. We are a small team that deeply cares about our craft. You’ll get a chance to work on something that improves the health of tens of thousands of people! – On-site (United States in NY)Senior iOS Engineer @ Distilled – We are seeking to recruit a Senior iOS Engineer to work on some of Ireland’s most popular mobile applications, Daft.ie. DoneDeal.ie & Adverts.ie – Remote (within European timezones) or on-site (Ireland)And finally...I missed this last year, but this is lovely coverage of a special milestone."
