["https://ipdb.org/w3c/privacy_policy.html"]
title = "Internet Pinball Database Privacy Policy"
full_description = "At the Internet Pinball Database, we care about your privacy, of course. When you browse through our site, we collect information on the efficiency and working of our Web site. This information includes the number of times a web page is accessed, the browser used, and paths used when viewing pages on the Web site. We may keep this information indefinitely. The information collected will automatically include your IP address (your current unique address on the Internet), although this may change for you each time you connect to the Internet. This information is necessary for the correct operation of the web server (how else would we know where to send the information you requested from our web server!), and every web server in existance has access to this identifier when you request a page from it. We use this identifier to detect when someone is abusing their privilidge of accessing this web site. If we detect someone is attempting to bypass security or is overloading the system with requests (such as a denial of service attack), we may completely and quietly block that IP address from conecting to this site for some arbitrary length of time, not to exceed one month. Excessive usage within a particular time period (i.e. hours) may also result in a temporary blockage, and further attempts to contact the site will result in a message asking the user to try back later. This block generally lasts only a few hours, or until the user's request rate drops back below the set limit. If you submit updates to entries in the database, we may also ask you to provide your email address. You must manually enter your email address for us to have access to it, we do not and can not gather it automatically. Your email address is used to identify the submissions you make and to send you correspondance about the information you submitted if it contradicts other information we have or if we need additional details from you. We will also send you a summary of the changes made because of your submission. The email addresses will NEVER be provided to anyone else for any reason, short of legal requirement exercised on the web site owner. Your email address may be stored, indefinitely, along with the information you submitted."
year_published = 2025
