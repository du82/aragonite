["https://www.ipdb.org/search.pl"]
title = "The Internet Pinball Machine Database"
full_description = '''The data in this database has been laboriously gathered by the Editors over many years, from books, photographs, flyers, web sites, pinball manufacturers, collectors' personal records, and of course the pinball machines themselves. Most of the actual photographs in the database came from various collectors – over 2,832 different contributors to date. To search the database, enter a word or two in the box above and press the Search Database button. Try a portion of a game's name, a manufacturer, designer, feature, or even a theme. If you want to search more than one field at a time, click on Advanced Search. You can also do a quick search using the format 'manufacturer/game_name', where the manufacturer (before the slash) is part of the manufacturer name, and game_name (after the slash) is a part of the machine name. For example: 'bal/addams' will find Bally's 'The Addams Family'. You can also use 'GID/##' and 'IMG/##' if you know the game number or image id from this database. If you would like to add something to the database, click the "Submit Changes" link displayed with each machine and then follow the instructions. We encourage everyone to share their photos, files and other pin-related information with others in the hobby; all submitted images should show these machines in their original factory condition, unmodified and unrepainted. The database is an unparalleled resource for all pinball enthusiasts, with the largest collection of pinball machines available online, but its success depends on its users. For more information on the IPDB, click the links at the bottom of the page.'''
