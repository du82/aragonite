["https://ipdb.org/support"]
title = "Support the Internet Pinball Machine Database"
full_description = '''The database can always use information, such as machine details, pictures, manuals, ROMs, etc. These can be submitted via the web update interface from a link to the right of each game listing. See the contact page. Pictures: We'd like to get a "standard" set of pictures for every game in the database: front, side, backglass, playfield, inside cabinet, inside backbox and interesting playfield details. If you notice a game missing any of these images or having only low quality images, please upload any you have, via the web interface (see the contact page) Each photograph includes an optional photographer credit (you must tell us you want it, else we don't include it for privacy reasons). Documents: Reference documents, such as schematics and manuals, should be in the PDF portable document format. If you have scans of a document, but not a PDF creator, you can email the scans to the database editors (see the contact page) to be converted into a PDF, or you can use one of the free online PDF creation sites. Otherwise, files can be uploaded via the web update screen by clicking on the "Update Game Information" link to the right of each game. ROMs: ROMs should be contained in ZIP files along with a plain text file explaining what game it is for and what version it is. There are a variety of .zip creation programs out there. If you're not sure how to create one, the ROMs can be emailed to the database editors (see the contact page). All these items can be uploaded over the web by clicking on the link titled "[Update Game Information]" displayed with every game entry. To view the list of people who have submitted images to the database, click here. Thanks to those people! Additionally, if someone is interested in gathering information of the following sort, we would be interested in hosting this information and integrating it into the database: Designers: Information related to designers, programmers, artists, etc. related to machines in the database, including their experiences, background, history and other pinball related information.'''
