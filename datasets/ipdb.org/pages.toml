["https://ipdb.org/searchhelp/regexphelp.html"]
title = "Regular Expressions"
full_description = '''When entering multiple words in a field, including the quick search field, note that all words must appear in the same database field to match your search. If you want to search multiple fields at once, use the Advanced search, available from the center link bar. These search fields use powerful regular expressions, NOT logical terms (i.e. no AND/OR). "Regular expressions" are a common method of specifying search terms, but they are explained below if you're not familiar with them. To search fields in the database, the IPD uses 'regular expressions' (RE's), a well defined "language" that has been around a number of years. Regular Expressions allow very complex searches to be performed in the fields that support them. Below is a quick explanation of some of the more common syntax, along with some links to further information. In an RE, the character '.' means to match a single occurrence of 'any character'. For example, 'b.eak' will match both the words 'bleak' and 'break' (and others with a single character between the 'b' and 'e') because the '.' matches 'l' in the first word and 'r' in the second word. The '+' character means to match one or more of the preceeding character in a row. For example, 'a+' will match 'a' and 'aa' and 'aaa' and 'aaa', etc. The '*' character means to match zero or more of the preceeding character in a row. For example, 'ab*c' will match 'ac' (zero b's) and 'abc' and 'abbc' and 'abbbc', etc. The latter may seem silly, but it allows you to use an RE like 'colou*r' to match 'color' as well as 'colour' (and also 'colouur', etc.). The '+' and '*' characters are most useful when used with the '.' character to match any number of characters between known characters or words. For example, 'The.*man' will match phrases like 'The man' and 'The tall man' and 'The person I knew when I was young was the man who...' The [ ] characters allow you to specify that the next character must match one from the provided list. For example 'b[rl]eak' will match 'break' and 'bleak' but not 'bzeak' because 'z' is not in the list specified (the [rl]). Specifying two characters separated by a '-' means anything between them, for example '[a-m]' will match any single character from a through m.'''
year_published = 2025
