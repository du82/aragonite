["http://www.ipdb.org/playing/wizard.html"]
title = "Skills for the Pinball Wizard"
full_description = "At the highest level of skill you become a Pinball Wizard. You become one with the pinball machine. It's one of those zen things. Or you learn a set of really hard skills, and nobody will know that you don't have that zen thing. A controversial skill. There are some who believe that the Death Save should be illegal, as if it is performed with the supplement of a kick on the right leg of the machine, it may potentially damage the machine. It has, however, been recognized and rewarded by Data East, who have a graphic and a point award for successful Death Saves on their machines since Rocky and Bullwinkle. Still, its not recommended to perform this technique on a friend's machine without permission, or a location you wish to remain in. If the ball has gone through the right outlane (right side only), then the ball may be retrieved if the player nudges the machine firmly and as quickly as possible to avoid a tilt and also holds up the left flipper. The nudge will cause the ball to come off the wall leading the ball to the center drain and hit the upraised left flipper, bouncing it over to the right flipper. Then just flip the ball (if you haven't tilted) and you've performed a death save. The right leg kick can be added to add more force to the nudge, but please be careful! and respect an operator who asks you not to do it. A Bangback is a sharp upward thrust on the cabinet or coin box (don't hurt yourself) where you knock the ball off the outlane wall as it heads towards the center drain and it goes through the flippers (keep the flipper up on the side which corresponds to the outlane where the ball went through) and over to the other flipper. If the ball is headed toward the center of the flipper when raised, then if you drop the flipper as soon as the ball touches the flipper, it will stop right on the flipper! In will just stop completely, and you can either attempt a trap if the ball is closer towards the base, or you can let it start to roll and then simply shoot for a target. The Drop Stop is particularly useful in some games where the ramps are tall and usually send the ball back towards the flippers very quickly if the ball does not clear the ramp, and others where you don't want to attempt a hold trap and have the ball roll up the inlanes and then out the outlanes. The Drop Stop is a great method to contain and control the ball when it moves toward the center of a flipper at a high speed. You must set it up by raising the flipper early, and then dropping it as soon as the ball makes contact."
year_published = 2025
