["https://ipdb.org/contact.html"]
title = "Contacting the Internet Pinball Machine Database"
full_description = '''To provide information on a machine or manufacturer To provide a URL of an auction or web page with images To provide references to machines missing from the database Problems with the database Suggestions for the database Other database related issues Other questions not covered in our FAQ If you're considering emailing us photos, we strongly recommend using the upload tool by clicking on the "Update Game Information" link to the right of each game, as otherwise it may take a while to get your photos on the site. The upload tool allows you to name each photo and add credit as you desire, and cuts down our work significantly! <!-- function didyouread() { return confirm("Did you read the page and are you aware of what this\nemail can and cannot provide you? Please do not contact\nthis email until you've actually read the page, or your\nemail may just be ignored.\n\nOK?"); } --> Otherwise, if your reason is this list, feel free to write us at pinball@ipdb.org (make sure your SPAM filters don't block our reply!). Note: By contacting this email address, you implicitly agree we can ignore legaleaze that includes "do not share/forward/quote" restrictions, and we will use your message as necessary to answer your question, although we will strongly guard your email address! If you're sending photos to us, please indicate if you want photo credit for the photos, and include your full, proper name (no 'handles'). If you do not clearly indicate you want credit, we will not, to preserve privacy. IMPORTANT! When you send an email to the address above, you will immediately receive an automated response to let you know we received your email. (Except AOL -- we can't auto respond to AOL because of all the forged SPAM we get from AOL.) If you do not receive this response (and are not from AOL), then it means either we did not receive your email or that you did not receive our response -- probably due to your ISP's anti-SPAM efforts. If so, we can't contact you by email at that ISP, and you either need to use a different email account or ask your ISP to fix the problem.'''
