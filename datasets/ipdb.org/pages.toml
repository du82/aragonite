["https://ipdb.org/playing/multiball.html"]
title = "Multiball Skills"
full_description = "When playing with more than one pinball, things tend to get a little stressful. These are some of the skills you can use to make multiball a little more manageable. Send balls around long time consuming ramps such as the left ramp in CFTBL or into jet bumpers, so that the ball is out of the way for the time being and you can pay attention to the others. Most modern multiballs now start with a ball saver, so take advantage of that by just keeping one or two in play and collecting unobstructed jackpots while the trough and the auto kicker take a few seconds to send the balls back onto the playfield. Trap a ball with the flipper which is not required for the next Jackpot and attempt to score the Jackpot while holding the trap. This is a good way of getting shots at the Jackpot while unobstructed by the other balls. Another advantage of the trap and play is the ability to perform a Billiard Block. If you see that the free ball is heading SDTM, use the trapped ball to knock it out of the way, preferably hitting it on either side, so that neither one of the balls go down the middle. If you have two or more balls trapped on the same flipper, and you need to only free one, you should attempt to escape the Multitrap by hitting the trapping flipper very quickly. This will hopefully cause the outermost ball (the one closest to the tip of the flipper) to do a little slingshot pass while the other balls remain trapped at the base of the flipper."
