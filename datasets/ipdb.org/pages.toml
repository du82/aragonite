["https://www.ipdb.org/glossary.php"]
title = "Pinball Glossary"
full_description = '''Chicago Coin used this feature on several of their games. In one instance, Chicago Coin's 1967 'Beatniks', the ring had two slingshots instead of a pop bumper. Gottlieb used this feature on a few of their games and referred to it in their flyers as a "semi-enclosed pop bumper". Williams used this feature on Williams' 1968 'Lady Luck' and referred to it in the flyer as a "trap bumper". Add-a-ball games start a ball counter at the original number of balls given to a player at the start of the game and then award the player additional balls as objectives are met, incrementing the "current ball" count for each one. Early add-a-ball games had individually lighted numbers on the backglass indicating the current ball count. These were usually completely separate models from the non-Add-a-ball games (even of the same name), but in later years an Add-A-Ball "Option" was instead built into a single model, allowing use as either an Add-A-Ball game, a replay game, or a novelty play game, depending of what the government rules in effect at the location. Because some locations even disallowed the display of the replay or add-a-ball totals wheel, some games came with a sticker to cover the replay counter. Some games would even "hide" the extra ball count in backglass graphics that could not be seen until an additional ball was added. Gottlieb games can usually award up to 5 additional balls at any one time. If one or more of these additional balls are awarded, they are all played before the main ball counter decrements. So you could win up to 5 balls during the play of 5 regular balls, or a total of up to 25 extra balls. Gottlieb called this the "WOW" feature. For Williams games, the ball counter started at 5 balls and awarded balls could raise the total to as 10 balls at one time. Gottlieb also used cathodic tubes, (which are distinctive with their blue glow, or green if translucent green plastic has been placed over the display such as on Gottlieb's 1982 'Haunted House'), in which the high voltage current flow causes a flourescent material on the inside of the segments to glow, much like in a tube television. These were available in 4, 6, 7, and 20 character tubes.'''
year_published = 2025
