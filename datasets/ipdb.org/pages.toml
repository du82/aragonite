["https://ipdb.org/playing/advanced.html"]
title = "Skills for the Advanced Pinball Player"
full_description = "After becoming comfortable with the intermediate level skills, move on to more advanced forms of ball control, such as stopping a speeding ball and other techniques listed here. No, this isn't a basketball pass, this is a method of choosing which flipper you want to hit the ball! The concept is to allow the ball to simply bounce off of the undesired flipper unto the desired one when the ball is rolling toward the center of the undesired flipper at a moderate rate. You must be wary of two things when performing this technique: Note the speed of the ball: If the ball is coming down fast, do not perform a bounce pass, as the ball may bounce off the desired flipper and then hit the bottom of the slingshot resulting in a drain. Also, the ball may bounce across the desired flipper, and head up the inlane, and then down the outlane. If the ball hits the undesired flipper too close the base, it will head very quickly right along the surface of the undesired flipper and then down the center drain. If the ball hits too much off the tip, it may just go SDTM. A phrase coined by Dave Hollinsworth, the Chill Manuever is a test of nerve and restraint. If a center post is between the flippers the ball may be saved from a drain when it heads STDM by simply allowing the ball to hit the center post pin and then bounce back up onto a flipper. The trick is that you must try not to flip so that the ball does not have to travel as far or as straight in order to come back up through the flippers. In order to perform the Chill Manuever correctly you must be able to accurately analyze quickly whether the ball is going straight enough between the flippers because if it comes in on an angle or does not hit the post with the center of the ball, it may hit the post and deflect left or right under the flippers, draining. This technique is useful for passing the ball from one flipper to the other when the ball is headed down the undesired flipper's inlane. If the ball is heading down the inlane at a moderately quick speed, simply hold up the undesired flipper and allow the ball to skip over to the desired one."
year_published = 2025
clearnet = "https://ipdb.org/playing/advanced.html"
