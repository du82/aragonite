["https://ipdb.org/playing/considerations.html"]
title = "General Considerations for the Pinball Player"
full_description = "Here are some general things you should think about when playing pinball. They're not really skills, but still important considerations. Try to enable yourself to see all of the playfield, don't lean over too much or you won't know exactly what's going on during Multiball. Try not to move out around such that you are concentrating more on yourself moving around and less on what you should be thinking about, the ball! Try to keep the ball as slow and controlled as possible. For example, don't hit a shot in the middle of the playfield too hard because it will probably drain. The slower the ball moves the more time you have to think about your next move. If you want to send a trapped ball across to the other flipper, quickly hit the trapping flipper so that the ball hits the bottom of the slingshot and then goes across to the other flipper via a hold pass. If one of your plays such as a Hold Pass isn't going to be successful and will result in a drain, you must perform a Defensive Push. Hit the ball any way possible; don't be stuck on trying to perform a play such that you'll drain because of it! Quickly analyze the danger and push the ball away to avoid a drain. Also perform a Defensive Push on a ball that you can't do anything with, because of speed or angle. A good Defensive Push will hit the ball such that another skill such as a Drop Stop can be performed right after."
year_published = 2025
