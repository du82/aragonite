["https://ipem.ugent.be/lw/kunstwetenschappen/en/about-us"]
title = "About us — Department of Art, Music and Theatre Sciences — Ghent University"
full_description = "About us About us Art challenges thought Art is an important part of culture, providing a means by which individuals and societies can question, shape and legitimise themselves. It contributes visual, audible and physical forms of knowledge that broadens our perspective on the world. Thanks to the study of art, we gain a better understanding of cultures, their interrelationships and their ongoing transformations. The Department of Art History, Musicology and Theatre Studies looks at a wide range of art forms, including painting, sculpture, drawing and graphic art, multimedia installations, photography, film, architecture, interior and design, fashion, music, dance, theatre and performance. Our professors and researchers approach art not only from a historical and theoretical perspective, but also in the light of the latest technological developments. On the programme and research pages you will discover how we put this into practice. The department has a strong international profile, thanks to foreign researchers and professors and to bilateral collaboration agreements with universities and institutions worldwide (a.o. with the Universidade de São Paulo, Freie Universität Berlin, Université Paris Nanterre, Universiteit van Amsterdam and University of Nebraska Omaha). At the same time, the department is strongly anchored in the local context in terms of content, through collaborations with artists and partners from the Belgian cultural sector. This keeps students well informed about current developments in the arts field and encourages them to reflect on a world in transition, influenced by digitalisation, climate change and globalisation. Societal outreach Our department regularly takes its research findings outside the walls of auditoria, through lectures, press contributions, podcasts and exhibitions. Underneath, we list some initiatives through which the department structurally fulfils its social role. GKO Gents Kunstenoverleg (NL) unites everyone who contributes to the artistic imagination of Ghent. Our department participates in the debates and is involved in its projects. Humanities Academie Humanities Academie (NL) promotes lifelong learning at the faculty of Arts and Philosophy. Our department shapes lectures, study days, training courses, micro-credentials and postgraduate courses to further develop your knowledge of arts and culture. VANDENHOVE VANDENHOVE Centre for Art and Architecture is an interfaculty study centre of the faculties of Arts and Philosophy and the faculty of Engineering and Architecture. The centre supports students and researchers from our department in exhibiting research results for a wide audience. During the programme, students also engage with the art collection of the architect Charles Vandenhove, which is managed by the centre. Film-Plateau The department of Art History, Musicology and Theatre Studies programmes several films every year for the University film club Film-Plateau (NL), as part of various courses on modern and contemporary art. Regularly, there are thematic screenings linked to exhibitions or lectures by our researchers and students. ASIL Art & Science Interaction Labs is a flexible research laboratory of the research groups IPEM, IDLab, and MICT where we create, analyse and test experiences and interactions in a virtual environment. Here, the latest immersive technologies are investigated, including those related to music. In the lab, engineers, artists, designers and scientists work together to develop solutions and experiences that improve everyday life. Library In the library collections of art history, musicology and theatre studies (NL), you can find a wide range of publications on art and art studies, divided into the following sub-collections: Architecture and conservation (heritage, interior and fashion) (L64) Art sciences (visual arts) (L70) Musicology (L66) Theatre studies (L52) You can consult the collections in the Faculty Library of Arts & Philosophy (wing ‘Loveling’). Browse the library's online catalogue. Committees Programme Committee The Programme Committee advises the faculty of Arts and Philosophy on the teaching at our department. The committee determines the objectives and structure of our programme, aiming at continuous optimization. Every year, the committee defines the curriculum and, in consultation with the department, appoints lecturers for the various course units. Students are also represented in the Educational Committee. Inquiries about the educational committee can be transmitted to onderwijscommissielw17@ugent.be. Examination Committee The Examination Committee verifies whether a particular student has passed a programme and determines the award of the diploma or certificate, as well as the degree of merit (satisfaction, distinction, major distinction, the greatest distinction). When examination fraud is detected, the Examination Committee takes the appropriate decisions in accordance with the Education and Examination Regulations. Inquiries about the educational committee can be transmitted to examencommissielw17@ugent.be."
