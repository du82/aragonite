["https://ipem.ugent.be/lw/kunstwetenschappen/en/research"]
title = "Research — Department of Art, Music and Theatre Sciences — Ghent University"
description = "Learn more about the research within the Department of Art History, Musicology and Theatre Studies at Ghent University."
full_description = "Research Learn more about the research within the Department of Art History, Musicology and Theatre Studies at Ghent University. Research Learn more about the research within the Department of Art History, Musicology and Theatre Studies at Ghent University. Every day, we build unique expertise within the various research disciplines of our department (visual arts, music, and performing arts). In this way, cross-pollination also occurs between these disciplines. Researchers study (inter)artistic developments in the fields of visual arts, architecture, design, fashion, performing arts, and music, focusing on the interaction between the paradigms associated with these disciplines. The department translates its multifaceted profile through an Art & Science approach. The collaboration between art and science can lead to innovative changes. Thanks to interaction with the Belgian art scene, such as collaborations with artists and cultural organizations, new forms of research and knowledge are developed. Working with other disciplines also leads to new insights and applications. The implementation of Digital Humanities and Augmented Humanities is central to the future vision of the department. Research clusters Research groups Projects Publications Research Learn more about the research within the Department of Art History, Musicology and Theatre Studies at Ghent University. Research Learn more about the research within the Department of Art History, Musicology and Theatre Studies at Ghent University. Every day, we build unique expertise within the various research disciplines of our department (visual arts, music, and performing arts). In this way, cross-pollination also occurs between these disciplines. Researchers study (inter)artistic developments in the fields of visual arts, architecture, design, fashion, performing arts, and music, focusing on the interaction between the paradigms associated with these disciplines. The department translates its mu