["https://ipem.ugent.be/lw/kunstwetenschappen/ipem/en/research"]
title = "Research — Institute for Psychoacoustics and Electronic Music (IPEM) — Ghent University"
description = "IPEM is a research institute for systematical musicology. We study music performances and envision applications in domains such as: multimedia and performance arts, augmented and virtual reality, physical rehabilitation, well-being, sports, ...."
full_description = "Research IPEM is a research institute for systematical musicology. We study music performances and envision applications in domains such as: multimedia and performance arts, augmented and virtual reality, physical rehabilitation, well-being, sports, .... Research Research tracks We study music performances and envision applications in domains such as: multimedia and performance arts, augmented and virtual reality, physical rehabilitation, well-being, sports, .... Theory of embodied music interaction Music interaction can be understood as a dynamic process that capitalizes upon prediction, embodiment, and expressive enactment (Leman, 2016). We aim at identifying the parameters that mark the quality of music interaction.In our brand-new art-science-interaction lab [ASIL] we use 3D-audio rendering (64 loudspeakers for wavefield synthesis and ambisonics), high-performance motion tracking (15 Qualysis infra-red cameras), brain activation tracking (EEG and fNIRS), and many other innovating technology (sensors, IOT) to study interaction from the viewpoint of the musical, the behavioral and the brain. Music education We study how music education can be innovated using interactive educational technologies and didactical approaches aimed at developing children's musical expression skills. Digital and augmented humanities We contribute to a digital and augmented humanities approach to musicology, by focusing on an advanced human artificial intelligence approach. Artistic research In 1963 IPEM started as a studio for electro-acoustic music production. Today scientists, researchers, and technicians still collaborate with artists using the new art-science-interaction lab [ASIL] and our know-how as a support for the innovation of expressive forms in music and interactive multimedia arts. Interdisciplinarity Our research is interdisciplinary, drawing on musicology, engineering and neuroscience. Music and wellbeing Our work has impact on several domains including physical rehabilitation for patients having Parkinson Disease, Multiple Sclerosis, Dementia, Stroke. We also develop tools for sports (e.g. injury prevention while running) and training assistants (e.g. for weightlifting). We thereby apply sonification strategies based on reinforcement learning. Read more Team Publications Projects"
