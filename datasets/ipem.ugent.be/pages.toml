["https://ipem.ugent.be/lw/kunstwetenschappen/ipem/en/education"]
title = "Education — Institute for Psychoacoustics and Electronic Music (IPEM) — Ghent University"
description = "IPEM UGent is offering 4 bachelor courses and one master course as part of its contribution to Musicology."
full_description = 'Education IPEM UGent is offering 4 bachelor courses and one master course as part of its contribution to Musicology. Education IPEM UGent is offering 4 bachelor courses and one master course as part of its contribution to Musicology. The education programme of the Department of Art History, Musicology and Theatre Studies offers 4 majors: Architecture and Interior Design Musicology Theatre and Performing Arts Visual Arts Bachelor Courses Grondslagen van muzikale akoestiek en sonologie Prof. dr. Pieter-Jan Maes As part of acoustic and sonological, also music science, the course introduces theoretical and practical research in both music analysis and synthesis. It tends to provide insight in the role of acoustics for the interpretation of classical and contemporary music, leading to an understanding of what digital innovation is all about. The course is providing a basic understanding of acoustic ecology, soundscapes, sonic branding. A005289 Grondslagen van muzikale actie en perceptie Prof. dr. Pieter-Jan Maes This partly theoretical and practical course gives an overview of psychoacoustics and musical perception, based on body interaction and sensorimotorical principles. Performance studies and ecological psychology have changed musicology profoundly. The course is focusing on the role of the body within the aesthetics of contemporary music, sonification with digital techniques, recording and analysis methods for music and dance performances (both qualitative and quantitative). A005290 Muziekpsychologie Prof. dr. Marc Leman The course contains a theoretical and a practical part. The theoretical part begins with situating the study field of "music psychology" in musicology, and with the introduction of basis concepts concerning action, perception and musical interaction. The course then goes deeper into recent scientific insights in predictive coding theory, in emotion theory and in expression. Predictive processes such as entrainment and alignment are then discussed in more detail. In the second part of the course, attention is devoted to the acquisition of experimental skills in ASIL (the art and science interaction lab of musicology at the Krook). The focus is on the study of music interaction (e.g. 2 musicians making music together), and on methods to measure and analyse this interaction. The course is based on research results of music research, in which experiments are used for the study of musical communication and signification. Music is thereby studied starting from acoustical structures, processen of human information processing, and the constraints of the cultural environment. A000184 Etnomusicologie Prof. dr. Dirk Moelants The course starts with an historical introduction of Etnomusicology, its domain and research methods, followed by an overview of the most important features of several important musical cultures in the world. In-depth analyses of non-western classical, etnic, folk, and pop music are on the agenda! A002059 Master Course Onderzoeksseminarie: Muziekinteractie en -technologie Prof. dr. Marc Leman This interdisciplinary course wants to teach students to conduct independent research about music and interaction. From the question how do people interact with each other and music, while playing, dancing, or listening, the students are guided in setting up their empirical research, providing interesting results and reporting these. Of importance is the development of a systematic view on the relationship of subjective experience and music, related to the physical musical environment. The purpose is to acquire knowledge and skills about the backgrounds, techniques and methods to analyse and describe music with the current technological possibilities. A005308 Bachelor test and internships IPEM is also involved in the Bachelor tests, see A005321 If you are considering an internship, see A002955 Read more (in Dutch) https://studiegids.ugent.be/current/NL/FACULTY/A/BACH/ABKUNS/ABKUNS.html https://studiegids.ugent.be/current/NL/FACULTY/A/MABA/AMKUNS/AMKUNS.html And for specific enquiries mail to Aagje Lachaert'
