["https://ipem.ugent.be/lw/en/news-events/news"]
title = "News — Faculty of Arts and Philosophy — Ghent University"
full_description = "News News Three Ghent University researchers win ERC Proof of Concept Grants Tine Destrooper (in collaboration with postdoctoral researchers Cira Palli-Aspero and Elke Evrard), Anna Tummers and Kevin Van Geem, can now further develop the industrial and social innovation potential of discoveries from their ERC work. Read More… Medieval latrine reveals ancient infection with African parasite in Bruges In a surprising discovery, researchers have found evidence of an African intestinal parasite in a 500-year-old cesspit in Bruges. The find offers valuable insights into how diseases spread in the past. Read More… Ghent University research plays leading role in exhibition on Judith of Flanders On 4 October opens the long-awaited exhibition ‘Judith. A Carolingian princess in Ghent?'. Visitors will follow in the footsteps of the Ghent University research into the identity of the mysterious woman in grave S127. Read More… Ursula Heise (UCLA) Appointed as International Francqui Professor This autumn, we will be hosting UCLA professor Ursula Heise as an International Francqui Professor at our faculty. Heise is one of the leading scholars in the field of the environmental humanities. Read More… UGent research reveals oldest skull and skull fragment in Flanders During the Contact Day Archaeology of the Province of East Flanders on Friday 28 June, it was announced that the oldest skull and skull fragment of Flanders have been discovered in Ename. Read More… Top CEO Marianne De Backer is Ghent University Alumnus of the Year 2024 She is a trail-blazer in the world of biotechnology. Not only as CEO of Vir Biotechnology but also as champion of women in leadership positions she excels. That is why Marianne De Backer is the Ghent University Alumnus of the Year 2024. Read More… Ghent University confirms its position as number one Belgian Host Institution in terms of ERC grants The European Research Council (ERC) has announced the names of 255 outstanding research leaders in Europe set to be awarded ERC Advanced Grants. Four of these are based at Ghent University. Read More… Dies Natalis 2024: Closing speech rector Rik Van de Walle Read or watch rector Rik Van de Walle's closing speech, delivered at the 2024 Dies Natalis celebration. Read More…"
