full_description = "Disclaimer This website is subject to a copyright clause and an exoneration clause. The outgoing e-mailcorrespondence of all staff members of Ghent University is subject to an e-maildisclaimer. Website disclaimer Processing of personal data Ghent University endeavors all necessary actions in order to protect and respect your privacy. You can read more about this in Ghent University's privacy statement. If you can't find the answer to your questions in our privacy statement, you can contact Ghent University's Data Protection Officer (privacy@ugent.be). If you wish to exercise your right to access, rectification, withdrawal or objection you can contact privacy@ugent.be. A formal complaint can be submitted to the Data Protection Authority via www.gegevensbeschermingsautoriteit.be. Copyright All texts and illustrations on this website as well as the lay out and the functionality of this website are protected by copyright. The texts and illustrations can be printed for private use; distribution is permitted only after authorisation of Ghent University. Quotations are allowed provided that you always refer to the valid source. Reproductions are permitted provided that you always refer to the valid source, unless for commercial aims, in which case reproduction, even with source indication, it is not allowed. Exoneration clause The publication of official texts (legal texts, decrees, regulations, ...) on this website has no official character. In case of differences between the electronic text and the published text the published text prevails, unless differently stated. In spite of all efforts Ghent University cannot guarantee that the information on this website is up-to-date, correct and complete. Ghent University is not responsible for the information on this website and cannot be held responsible for the conceivabe disadvantageous impact of possible inadequacy or incompletion of the data on this website. Some documents and multimedia sequences on this website contain references to or suggestions for information of other legal persons. The relevance, topicality, the correctness and the completeness of this external information cannot be assured by Ghent University and Ghent University cannot be held responsible for the conceivable disadvantageous impact of the possible irrelevance, inadequacy or incompletion of the external information.No rights can be derived from the data on this website. Outgoing e-mail disclaimer In the outgoing e-mailcorrespondence of all staff members of Ghent University there is no standard disclaimer or confidentiality clause. However, a link to the e-mail policy of the university should be provided: http://helpdesk.UGent.be/e-maildisclaimer.php."
