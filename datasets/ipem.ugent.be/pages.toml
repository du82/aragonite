["https://ipem.ugent.be/lw/kunstwetenschappen/ipem/en/aboutus"]
title = "About us — Institute for Psychoacoustics and Electronic Music (IPEM) — Ghent University"
description = "IPEM is a research institute for systematical musicology. The Art-Science-Interaction Lab (ASIL) is its experimental laboratorium. IPEM is part of the UGent labs situated in De Krook Library building in Ghent (BE)."
full_description = "About us IPEM is a research institute for systematical musicology. The Art-Science-Interaction Lab (ASIL) is its experimental laboratorium. IPEM is part of the UGent labs situated in De Krook Library building in Ghent (BE). About us IPEM is a research center in systematic musicology, directed by Prof. dr. Marc Leman at Ghent University. It was founded in 1963 and has a long and successful history in innovation in the arts. The center's focus today is on embodied music cognition and expressive interaction with music. Interdisciplinary methods are developed based on music theory, performer-inspired analysis, advanced behavioural and neuroscience empirical experimentation, statistics, and computer modelling. At IPEM music-based feedback systems are created, for applications in domains such as music education, rehabilitation, sports activities, and arts. In 2017 IPEM opened its ArtScienceInteractionLab (ASIL) where hightech experiments with new digital technology for augmented reality are conducted. The lab is operating with a joined team of professional researchers and artists, and works at artistic forms of expression for tomorrow. IPEM joined the De Krook consortium, taking part in a multidisciplinary constellation with IDLab (Internet Technology and Data Science Lab specialised in VR), MICT (usability in media and communication technology), the Culture and Education Group, and industrial partner IMEC (R&D in nano electronics and digital technology, IOT). IPEM's ArtScienceLab activities lie in immersive and interactive environments with 3D sound, connected and spatialized concerts with innovative performers and audience setups, the notion of wellbeing for the creation of the interactive tools, experiments investigating body-music synchronisations between people, investigating existing and new forms of interaction. The ArtScienceInteractionLab's research is working with professional classical and contemporary musicians, sound and media artists. Read more Contact Team Art-Science-Interaction Lab We did it again!"
year_published = 2025
year_updated = 2024
