["https://ipem.ugent.be/lw/kunstwetenschappen/en/programmes"]
title = "Programmes — Department of Art, Music and Theatre Sciences — Ghent University"
description = "All about the programmes of the Department of Art History, Musicology and Theatre Studies at Ghent University."
full_description = "Programmes All about the programmes of the Department of Art History, Musicology and Theatre Studies at Ghent University. Programmes All about the programmes of the Department of Art History, Musicology and Theatre Studies at Ghent University. Choose for Art History, Musicology and Theatre Studies The concept of the art studies programme at Ghent University is unique in Belgium. Students start with a broad fundamental programme that covers all art disciplines. They then choose a specialisation: visual arts (fine arts, architecture, design, fashion), performing arts (theatre, dance, performance) or music. As an exchange student, you have a wide choice of courses, focusing either on a particular discipline and methodology, or a general overview of an art form or period. The programme is theoretical. It does not train students to make art, but to thoroughly comprehend art and culture. This knowledge is regularly put into practice during the study programme, for instance through archival research, internships and collaborations with art collections and living artists. The department often collaborates with the wider arts field, both in research and teaching. This makes it the ideal setting to study and experience arts in Belgium and central Europe! General information for exchange students can be found on the webpage of the faculty. Programmes Bachelor's Programme Master's Programme Exchange Programme Students-led project week Every year, master’s students organise a project week for all art studies students. During ‘De Schone Week’, students work in small groups on a project, under the guidance of UGent staff and creators such as artists, musicians, curators, etc. In this way, the highly theoretical education is complemented by practical and creative experience. The project week takes place every year prior to the Easter break. You can find images from past editions on De Schone Week’s Instagram page. After your master (Advanced) master programmes taught in English Find out which English-language (master’s-after-) master’s programmes the Faculty of Arts and Philosophy offers! Postgraduate Curatorial Studies If you have a master's degree, you can follow the English-language postgraduate programme Curatorial Studies (KASK/Ghent University), in which the Department of Art History, Musicology and Theatre Studies plays an organising role. Curatorial Studies is an intensive, one-year, English-language postgraduate degree designed for candidates with a master’s degree or relevant experience in the arts, humanities or sciences and a strong interest in contemporary art. Candidates without a master’s degree but with relevant experience in curating are also eligible. PhD Do you excel in scientific research and would like to make valuable contributions to the art scientific field yourself? Then a PhD might be something for you! Find out what research opportunities are available to you on the faculty website. You can familiarise yourself with the research expertise and research tracks at our departments on the Research page."
