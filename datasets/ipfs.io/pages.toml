full_description = "Community: Get in Orbit Join our open source ecosystem of ~2,000 active contributors, plus many more developers and users. Connect From the annual IPFS Camp and IPFS Thing conferences to working groups and online forums, our community creates out-of-this-world ideas right here on Earth. Join us! Join the conversation Matrix Discord Slack Discuss topics in-depth Check out the IPFS Forums to discuss open problems, share ideas, and get help from the community. Join a community event Meet other members of the community virtually or in-person by subscribing to our event calendar . Keep up with what's new Get the latest on news about what's happening in the IPFS ecosystem by subscribing to our newsletter and YouTube channel . Events And Working Groups Help us untangle the thorniest problems facing the distributed web (and meet some bleeding edge thinkers) by joining one of our global working groups. Subscribe to upcoming events Community Voices Horacio Herrera@hhg2288IPFS Community round table!!5:23 PM • Oct 30, 2022Protocol Labs@protocollabsScenes from Day 1 of #IPFSCamp at #LabWeek.Head to Convento do Beato for another day of talks, workshops, connection & more for the IPFSCommunity. Happening all day.Details https://2022.ipfs.camp2:30 PM • Oct 29, 2022shann.lens@shanvasionHuge respect for the @protocollabs ecosystem #IPFSCamp Today was incredible. I met some of the absolute smartest and kindest ppl. Overheard many discussions about how projects are going to achieve adoption. The energy is all about actionIPFS @IPFS, Oct 28, 2022Ready for round 2?Join us for #IPFSCamp tomorrow, kicking off at 10am for a full day of talks, workshops, hacking, and more.2:30 PM • Oct 29, 2022Sneha Mishra@sneha_bbRealising the power of decentralisation w @IPFS @Filecoin fighting for the common people against Violence, Evidence Tampering, Wrongful Voting, Control over publishing/media industry....3:57 PM • Oct 30, 2022shann.lens@shanvasionHuge respect for the @protocollabs ecosystem #IPFSCamp Today was incredible. I met some of the absolute smartest and kindest ppl. Overheard many discussions about how projects are going to achieve adoption. The energy is all about actionIPFS @IPFS, Oct 28, 2022Ready for round 2?Join us for #IPFSCamp tomorrow, kicking off at 10am for a full day of talks, workshops, hacking, and more.2:30 PM • Oct 29, 2022Pixelmatters@pixelmatters_What a day we had yesterday at LabWeek22, the first-ever decentralized conference hosted by our partner @protocollabsIt's an event where teams are innovating and building a collective future. #plsummit7:27 PM • Oct 25, 2022omoju.eth@omojumillerSuper excited about this. I really, really, like being a part of @protocollabs family!My team and I like their approach to building a thriving eco-system of #Web3 companies solving major problems LabWeek22.Protocol Labs @protocollabs, Oct 11, 2022Only two weeks until we're together in Lisbon for LabWeek22! Events are filling up fast http://22.labweek.io for the latest news and to reserve your spot!Lisbon, Portugal Oct 24 - Nov 4, 2022http://22.labweek.io3:57 PM • Oct 30, 2022Satellite_im@satellite_imSatellite's @weveloper is up front now showing off our Iridium project, which is the special sauce that powers Satellite Core's messaging platform. #IPFSCamp3:57 PM • Oct 30, 2022Protocol Labs@protocollabsAt Hacker Base this morning, great to see some of the @Web3Storage team in person @hugomrdias @gozala @bengo @vascosantos10 @_alanshaw #labweek221:23 PM • Oct 25, 2022 The Next Frontiers We're shooting for the stars, and we can't do it without your help. Here are some of the unknowns we've yet to discover: How can we introduce privacy and encryption functionality to IPFS? How do we enable connectivity between every platform IPFS runs on, from satellites to lower powered IoT devices? What data structures and recommendations can we create to help other developers? How can we invent a more efficient peer-to-peer data transfer protocol? Interested in solving these challenges together? Join a community event , a working group , or forum discussion."
