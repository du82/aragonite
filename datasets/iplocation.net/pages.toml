["https://iplocation.net/myip"]
title = "What is My IP Address?"
description = "What is your public IPv4 or IPv6 address? Your IP address provides geolocation of your city, state and country."
full_description = '''Your IP address revealed to the rest of the world is shown below, and it is also known as the public IP address. You may have an IPv4, an IPv6 or both depending on the connection type. If you're behind a router, the IP address shown below would be your router's IP address and your computer would have received a private IP address from a DHCP server. The following describes your device details including operating system, type of browser used, and the device type. The chart below also shows marketshare captured by each brand, and your screen characteristics. Everytime your web browser requests a page, it sends a "request" header to the web server. To view a full header, you may use the HTTP Browser Header page. The longitude and latitude used to plot your location is often depicted near in the center of the city. The geolocation accuracy is not precise enough to pinpoint a specific address, and therefore it should only be used to estimate the proximity of the device. VPN is by far the best way to hide your IP Address. There are premium and free VPN providers, and finding the right provider for your need require research. Learn how to hide your IP address with a VPN. IP ban is a block set up by a server to reject the request made from a particular IP or range of IP addresses. The IP ban may have been implemented automatically due to an abuse pattern detected by the server or placed manually by an administrator. IP ban is implemented to protect the server from abuse such as brute force attacks, block emails from known spammers, and limit usage by users. An IP Address is a unique address assigned to a computing device such as a computer, tablet, or smartphone. An IP address is analogous to the postal address of a house (or the phone number of your smartphone), where two houses cannot have the same address as a mailman will be confused about where to deliver the mail. When you connect to the Internet, your service provider assigns an IP address to your device. The device can be a computer, smartphone, tablet, or any computing device communicating with other devices on the Internet. The IP address is your online identity, and whenever you exchange information with other devices the other party will be able to find your IP address.'''
