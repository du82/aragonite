["https://www.iplocation.net/find-ip-address"]
title = "What is My IP address? - Find your IP"
description = "This webpage displays public IP address of your computer or router assigned by your ISP."
full_description = 'This is the public IP address of your computer. If your computer is behind a router or used a proxy server to view this page, the IP address shown is your router or proxy server. The Internet Protocol Address (or IP Address) is a unique address that computing devices such as personal computers, tablets, and smartphones use to identify themselves and communicate with other devices in the IP network. Any device connected to the IP network must have a unique IP address within the network. An IP address is analogous to a street address or telephone number in that it is used to uniquely identify an entity. The traditional IP Address (known as IPv4) uses a 32-bit number to represent an IP address, and it defines both network and host address. A 32-bit number is capable of providing roughly 4 billion unique numbers, and hence IPv4 addresses running out as more devices are connected to the IP network. A new version of the IP protocol (IPv6) has been invented to offer a virtually limitless number of unique addresses. An IP address is written in "dotted decimal" notation, which is 4 sets of numbers separated by period each set representing an 8-bit number ranging from (0-255). An example of an IPv4 address is 216.3.128.12, which is the IP address previously assigned to iplocation.net. An IPv4 address is divided into two parts: network and host address. The network address determines how many of the 32 bits are used for the network address and the remaining bits are used for the host address. The host address can be further divided into subnetwork and host number. Traditionally IP network is classified as an A, B, or C network. The computers identify the class by the first 3 bits (A=000, B=100, C=110), while humans identify the class by the first octet(8-bit) number. With the scarcity of IP addresses, the class-based system has been replaced by Classless Inter-Domain Routing (CIDR) to more efficiently allocate IP addresses. In order to maintain uniqueness within a global namespace, the IP addresses are publicly registered with the Network Information Center (NIC) to avoid address conflicts. The devices that need to be publicly identified, such as web or mail servers, must have a globally unique IP address; and they are assigned a public IP address. The devices that do not require public access may be assigned a private IP address and make it uniquely identifiable within one organization. For example, a network printer may be assigned a private IP address to prevent the rest of the world from printing from it. To allow organizations to freely assign private IP addresses, the NIC has reserved certain address blocks for private use. A private network is a network that uses RFC 1918 IP address space. The following IP blocks are reserved for private IP addresses.'
