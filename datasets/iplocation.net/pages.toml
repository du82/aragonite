full_description = '''Here are the results from a few Geolocation providers. Is the data shown below not accurate enough? Please read geolocation accuracy info to learn why. The Geolocation lookup tool provided on this page is an estimate of where the IP address may be located. The data come from a few IP-Based Geolocation providers, and their accuracy varies depending on how quickly they update their database when changes occur. Since many Internet users are getting their dynamic IP address from their ISP, and most ISPs serve their customers in multiple regions causing Geolocation lookup to be accurate to the region they serve. For example, AT&T in the United States serve their customers in entire USA and the accuracy may be limited to the Country level. Other ISPs may be serving smaller areas, and some ISPs create subnetworks to serve their customers in smaller regions. For this reason, the IP-based Geolocation will be about 99% accurate at the country level while the accuracy of State and City may be at much less accurate level somewhere around 50% range. For more information about Geolocation Accuracy, please read How accurate is IP-based Geolocation lookup? There are several ways to hide your IP address, and your geolocation. Hiding your IP address is concealing your "true" IP address with a different one. You may use a VPN, Proxy or Anonymous Browser to hide your IP address. Would you like to change the IP address of your computer, smartphone or tablet? You're getting your IP address from your Internet Service Provider, and you have the right to obtain a new IP address whenever you desire. Let us show you how you can change an IP address of your device. A public IP address is an IP address that can be accessed over the Internet, and a private IP address is an IP address that is local to your private network. A public IP is a globally unique IP, while a private IP address can be reused in different networks. An IP address is an address assigned to a device on the Internet. A static IP address is a fixed IP address that never changes, and a dynamic IP address is an IP that is assigned by the DHCP server which may change over time.'''
