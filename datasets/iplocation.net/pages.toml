title = "Domain Names"
description = "Domain name is a human-readable Internet Address, and it is an essential element to create a website."
full_description = '''Some of you may want to build a blog, others may create a personal website, and some business owners may want to create an online store (ecommerce website). Regardless of type of website you're planning to create, registering a domain name is an essential first step in making a website. A domain name is an "unique", human readable Internet Address which is mapped to machine readable IP Address. A domain name is used to setup a website, and is also used to create email addresses. It is desirable to register a memorable, short and keyword-rich domain name. Owning a domain name involves registering the name with the ICANN, a non-profit organization that is responsible for maintaining domain name database. You cannot register a domain name directly from ICANN, but you may register one from an ICANN accredited domain name registrar or it's reseller. You may register a domain name for up to 10 years, and the name has to be renewed before expiration otherwise you'll lose the domain name. Domain name is comprised of at least two parts: top level domain (TLD) and second level domain (SLD). TLD includes generic TLD (or gTLD) such as .COM, .NET, .ORG, .INFO, and .BIZ; or country code TLD (or ccTLD) which is designed for each country such as .us (USA), .ca (Canada) or .fr (France). Each TLD is designed for a specific purpose, so choose the one that is right for you. If you're looking to build a business website, the .COM domain name is the right choice; and for non-profit organization, family or hobby website, the .ORG domain name will work. The domain name that you can register from a registrar is the second level domain (SLD) name for a particular TLD. The domain names starts from right to left separated by a dot, so TLD is the rightmost name, SLD is the one before that. The third and lower domain names are known as subdomain names, and they can be arbitrarily created by the SLD domain name owner. A good example of subdomain is the www, which is generally used for a website such as www.setup-website.com. As a owner of setup-website.com domain name, we created a subdomain name called www to serve our website.'''
