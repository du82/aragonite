full_description = '''#include <stdio.h>#include <math.h>/* solve: calculate roots of square equation.* a, b, c are coefficients in equation.* Roots would be stored at x1, x2.* Return value: count of real roots.*/int solve(double a, double b, double c, double* x1, double* x2) {double D = b*b - 4*a*c;double sqrtD;if (D > 0) { sqrtD = sqrt(D); *x1 = (-b - sqrtD)/(2.0 * a); *x2 = (-b + sqrtD)/(2.0 * a); return 2;} else if (D < 0) return 0; else { *x1 = -b/(2.0*a); return 1; }}int main (int argc, char* argv[]) {double a,b,c;double x1, x2;int roots_count;// Input coefficientsprintf("A: ");scanf("%lf", &a);printf("B: ");scanf("%lf", &b);printf("C: ");scanf("%lf", &c);// Solve the equationroots_count = solve(a,b,c, &x1, &x2);// Output resultsswitch (roots_count) { case 0: printf("No (real) roots.\n"); break; case 1: printf("One root: %0.4lf\n", x1); break; case 2: printf("Two roots: %0.4lf and %0.4lf\n", x1, x2); break;}return 0;} /tmp/cc6RNFIi.o: In function `solve': square.c:(.text+0x6d): undefined reference to `sqrt' collect2: ld returned 1 exit status GNU gdb (GDB) 7.2-ubuntu Copyright (C) 2010 Free Software Foundation, Inc. License GPLv3+: GNU GPL version 3 or later This is free software: you are free to change and redistribute it. There is NO WARRANTY, to the extent permitted by law. Type "show copying" and "show warranty" for details. This GDB was configured as "i686-linux-gnu". For bug reporting instructions, please see: ... Reading symbols from /home/portnov/LUG/src/square...done. (gdb) #include <gtk/gtk.h>// This function displays message dialog.// main_window parameter should be set to parent window of the dialog.void message_box (GtkWindow* main_window, gchar *message) { GtkWidget *dialog, *label, *content_area; // Create a dialog dialog = gtk_dialog_new_with_buttons ("Message", main_window, GTK_DIALOG_DESTROY_WITH_PARENT, GTK_STOCK_OK, GTK_RESPONSE_NONE, NULL); // Create a label content_area = gtk_dialog_get_content_area (GTK_DIALOG (dialog)); label = gtk_label_new (message); // On "response" signal (it's called when user clicks a button in // the dialog), destroy the dialog. g_signal_connect_swapped (dialog, "response", G_CALLBACK (gtk_widget_destroy), dialog); // Add a label gtk_container_add (GTK_CONTAINER (content_area), label); // Show the dialog gtk_widget_show_all (dialog);}// Callback for delete-event signalstatic gboolean delete_event( GtkWidget *widget, GdkEvent *event, gpointer data ){ // If return TRUE, window will not be closed. // This may be used to preven closing window in some situations. return FALSE;}// Callback for destroy signalstatic void destroy( GtkWidget *widget, gpointer data ){ // End main GTK+ event loop gtk_main_quit ();}// Callback for button clickstatic void hello ( GtkWidget *widget, gpointer data ){ // "data" parameter represents main window here message_box(GTK_WINDOW(data), "Hello, world!");}int main( int argc, char *argv[] ){ GtkWidget *window; GtkWidget *button; // Init GTK+ gtk_init (&argc, &argv); // Create main window window = gtk_window_new (GTK_WINDOW_TOPLEVEL); // Set up callbacks for some signals g_signal_connect (window, "delete-event", G_CALLBACK (delete_event), NULL); g_signal_connect (window, "destroy", G_CALLBACK (destroy), NULL); // Set window borders width gtk_container_set_border_width (GTK_CONTAINER (window), 10); // Create labeled button button = gtk_button_new_with_label ("Hello World"); // Set up callback for "clicked" signal of the button. // Pass main window as second parameter. g_signal_connect (button, "clicked", G_CALLBACK (hello), (gpointer)window); // Pack the button into window gtk_container_add (GTK_CONTAINER (window), button); // Show the button gtk_widget_show (button); // Show the window gtk_widget_show (window); // Run main GTK+ event loop. gtk_main (); return 0;}'''
