full_description = '''As with many other social problems, I've found that people stop caring about the chemicals and pesticides in our food as soon as _they_ have reached a point in life when they can afford high quality, expensive food for themselves. It seems to me that it is a bad idea to give ourselves democracy and not follow it up by giving outselves good, free, public education too. The former cannot function without the later! "Formula 1", triple English homonym, because why use different words if you can make things extra confusing. Clearly there's a lot of bias around social expectations of child caring and family roles:- When I emailed the nurse, she responded asking for "my husband's" medical insurance number, first assuming that wife's don't have one, and second, that since I am the one emailing aboud child matters, I must be the mom. I corrected the nurse.- When looking at this infant's second hand books I've been given, the family portrayed in it has a father that, and I quote, "helps" in the house. That is, apparently it isn't his duty to run the house, that's his wife's it seems. But he's a great dude becaise he "helps", when he feels like I imagine. I burned the book.- When browsing for infant's clothing, I find quite a few options with messages such as "Mommy's Love". Dad is not in the picture it seems. I close the website. Today I woke up to see 14 new emails in my inbox, from myself. Must . Stop . Having . Ideas . At . Night i'm one of those few men who close the toilet lid every time after i pee. i know i'm in the minority, and i really don't know why this is so difficult or why it is a thing to begin with Since it seems I'm in lecture mode lately, here goes a not so serious (or maybe yes?) message to Google and their AI / Deep Learning team: You are showing machines to paint, compose music, talk or synthesize piano from current paintings, music and recordings. Fine I guess (have you asked for permision to the artists you are learning from, though?). However, tempting as it is, I hope you do not, I repeat, you do NOT, feed the the machines with contemporary source code. Because, you surely must know much of the code out there is really bad. And even the good code is not as good - computer science is a very recent thing and we haven't figured out coding yet. You know this, right? RIGHT?'''
