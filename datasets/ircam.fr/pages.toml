ge possible. Formations professionnellesStages logiciels 2024.25Max, Max for LiveComposition assistée par ordinateurASAP & PartielsSpatialisation sonoreDesign d'expériences audio sur le webIntelligence artificielle générativeDesign sonoreInformations pratiquesEnseignement supérieurCursus de composition et d'informatique musicaleMaster scientifique AtiamDNSEP Design sonoreParcours musique mixteMastère AIMoveDécouvrir la recherche à l’IrcamActions culturellesMédiations culturelles au collègeMédiations culturelles au lycéeAteliers numériquesTACTLes films « Images d'une œuvre »Visites et ateliersL'académie du festival ManiFeste-2025Prix Élan 2025Composer l'espaceIn Situ PolytopesEnsemble ULYSSESAuditeursInnovations Au cœur d’enjeux sociétaux et économiques croisant culture et technologies de l’information, les recherches accueillies à l’Ircam se présentent dans le paysage international de la recherche comme pôle de référence interdisciplinaire autour des sciences et technologies du son et de la musique et s’exposent en permanence aux nouveaux be… Le Forum IrcamLes logicielsIrcam AmplifyProcessus d’innovation art-science-technologieForum Vertigo Création Ciné-Concert Ciné-concert Lubitsch jeu 20 février 2025, 20h00 Cité de la musique Compositions d'Oren Boneh et Martin Matalon avec l'Ensemble intercontemporain Recherche Séminaire Ircam : les années 1980-1990 mar 4 mars 2025, 14h30 - 17h30 Ircam Dans le cadre du séminaire « Les cinquante premières années du Centre Georges-Pompidou » Création Concert Musique du temps - Hommage à Boulez dim 9 mars 2025, 18h00 Kölner Philharmonie, Cologne, Allemagne L'Ircam et l'Orchestre de la WDR rendent hommage à Boulez à l'occasion de son 100e anniversaire Transmission Stage logiciel Max Perfectionnement et Certificat Ircam Max niveau 2 lun 10 au sam 15 mars 2025 Ircam Approfondir ses connaissances et sa maîtrise de Max Création Installation ŠamaŠ mar 10 décembre au dim 6 avril 2025, 10h00 - 18h00 Institut du monde arabe Installation son