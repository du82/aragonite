["https://ired.team/miscellaneous-reversing-forensics/windows-kernel-internals/sending-commands-from-userland-to-your-kernel-driver-using-ioctl"]
title = "Sending Commands From Your Userland Program to Your Kernel Driver using IOCTL | Red Team Notes"
description = "Windows Driver Model (WDM)"
full_description = '''reversing, forensics & miscInternalsSending Commands From Your Userland Program to Your Kernel Driver using IOCTLWindows Driver Model (WDM)PreviousListing Open Handles and Finding Kernel Object AddressesNextWindows Kernel Drivers 101Last updated 1 year ago Create a simple WDM kernel mode driver, that can receive and respond to a custom defined input/output control code (IOCTL) sent in from a userland program Inside driver's entry function, we populate our driver object with pointers to important routines that will be executed, for example, when the driver is unloaded or a handle to its device's symbolic link is obtained (IRP_MJ_CREATE) or closed (IRP_MJ_CLOSE): This is required, because these driver functions (callbacks) will be called by the OS when those events (i.e a userland application trying to obtain a handle to our device, unload the driver or close device's handle) will fire. We do not want the OS to not know what to do with our driver when those events fire, therefore we tell it. This is where we create a device (that we are writing the driver for) and its symbolic link. The symbolic link is required for when we want to access our driver from the userland (by opening a handle to the device by calling CreateFile) and ask it to execute some code in respose to our custom defined IOCTL: IOCTL control code is a code that is sent to the device driver from via an RP_MJ_DEVICE_CONTROL request using DeviceIoControl WinAPI. For example, IOCTL code 0x202 (IOCTL_STORAGE_EJECT_MEDIA) could be sent to a USB/CDROM device and its driver would carry out an appropriate action for the given device, i.e open the CD tray for a CD-ROM or eject the USB media storage. After the device and its symbolic links are created, the newly created device SpotlessDevice is now visible inside WinObj: Additionally, we can see the symbolic link SpotlessDeviceLink pointing to our device \Device\SpotlessDevice: This function will handle IRPs that request (CreateFile) or close (CloseHandle) the handle to our device \Device\SpotlessDevice through the symbolic link \\.\SpotlessDeviceLink:'''
