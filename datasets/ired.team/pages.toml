["https://ired.team/offensive-security-experiments/active-directory-kerberos-abuse/domain-compromise-via-unrestricted-kerberos-delegation"]
title = "Kerberos Unconstrained Delegation | Red Team Notes"
full_description = '''PinnedActive Directory & Kerberos AbuseKerberos Unconstrained DelegationPreviousKerberoasting: Requesting RC4 Encrypted TGS when AES is EnabledNextKerberos Constrained DelegationLast updated 3 years ago This lab explores a security impact of unrestricted kerberos delegation enabled on a domain computer. Usually, this privilege is given to computers (in this lab, it is assigned to a computer IIS01) running services like IIS, MSSQL, etc.; Those services usually require access to some back-end database (or some other server), so it can read/modify the database on the authenticated user's behalf; When a user authenticates to a computer that has unresitricted kerberos delegation privilege turned on, authenticated user's TGT ticket gets saved to that computer's memory; The reason TGTs get cached in memory is so the computer (with delegation rights) can impersonate the authenticated user as and when required for accessing any other services on that user's behalf. Essentially this looks like so: User --- authenticates to ---> IIS server ---> authenticates on behalf of the user ---> DB server Any user authentication (i.e CIFS) to the computer with unconstrained delegation enabled on it, will cache that user's TGT in memory, which can later be dumped and reused by an adversary. Let's give one of our domain computers/our victim computer IIS01 unrestricted kerberos delegation privilege: We can see our victim computer IIS01 with TrustedForDelegation field set to $true - we are good to attack: On the computer IIS01 with kerberos delegation rights, let's do a base run of mimikatz to see what we can find in memory: We can see that the IIS01 has now got a TGT for offense\administrator - this means that we have effectively compromised the entire offense.local domain. We will get back to this in a moment. First, let's export all kerberos tickets from IIS01 memory, so we can load offense\administrator ticket TGT into the current session and assume its privileges: ..but before we proceed with pass-the-ticket attack and become a DA, let's try PSRemoting to the DC01 from IIS01 and check currently available kerberos tickets in a current logon session - just to make sure we currently do not have DA rights:'''
