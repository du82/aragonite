title = "Privileged Accounts and Token Privileges | Red Team Notes"
full_description = '''PinnedActive Directory & Kerberos AbusePrivileged Accounts and Token PrivilegesPreviousAbusing Active Directory ACLs/ACEsNextFrom DnsAdmins to SYSTEM to Domain CompromiseLast updated 5 years ago Administrators, Domain Admins, Enterprise Admins are well known AD groups that allow for privilege escalation, that pentesters and red teamers will aim for in their engagements, but there are other account memberships and access token privileges that can also be useful during security assesments when chaining multiple attack vectors. As with Server Operators membership, we can access the DC01 file system if we belong to Backup Operators: A very dangerous privilege to assign to any user - it allows the user to load kernel drivers and execute code with kernel privilges aka NT\System. See how offense\spotless user has this privilege: Let's build on the previous code and leverage the Win32 API call ntdll.NtLoadDriver() to load the malicious kernel driver Capcom.sys. Note that lines 55 and 56 of the privileges.cpp are: The first one declares a string variable indicating where the vulnerable Capcom.sys driver is located on the victim system and the second one is a string variable indicating a service name that will be used (could be any service) when executing the exploit: Once the above code is compiled and executed, we can see that our malicious Capcom.sys driver gets loaded onto the victim system: We can now download and compile the Capcom exploit from https://github.com/tandasat/ExploitCapcom and execute it on the system to elevate our privileges to NT Authority\System: Sometimes, certain users/groups may be delegated access to manage Group Policy Objects as is the case with offense\spotless user: The below indicates that the user offense\spotless has WriteProperty, WriteDacl, WriteOwner privileges among a couple of others that are ripe for abuse: We know the above ObjectDN from the above screenshot is referring to the New Group Policy Object GPO since the ObjectDN points to CN=Policies and also the CN={DDC640FF-634A-4442-BC2E-C05EED132F0C} which is the same in the GPO settings as highlighted below:'''
