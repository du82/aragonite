["https://ired.team/miscellaneous-reversing-forensics/windows-kernel-internals/interrupt-descriptor-table-idt"]
title = "Interrupt Descriptor Table - IDT | Red Team Notes"
full_description = "reversing, forensics & miscInternalsInterrupt Descriptor Table - IDTPreviousSystem Service Descriptor Table - SSDTNextToken Abuse for Privilege Escalation in KernelLast updated 5 years ago Interrupts could be thought of as notifications to the CPU that tells it that some event happened on the system. Classic examples of interrupts are hardware interrupts such as mouse button or keyboard key presses, network packet activity and hardware generated exceptions such as a division by zero or a breakpoint - interrupts 0x00 and 0x03 respectively CPU knows how to respond and what kernel routines to execute for the newly received interrupt by looking up Interrupt Service Routines (ISR) that are found in the Interrupt Descriptor Table (IDT) IDT is a list of IDT descriptor entries which are 8 or 16 bytes in size depending on the architecture Pointer to IDT is stored in an IDTR register for each physical processor or in other words, each processor has its own IDTR register pointing to its own Interrupt Descriptor Table Offsets across different screenshots and windbg output may differ due to the fact that I rebooted the debugee a couple of times during the time these notes were taken. As noted later, the command !idt allows us to dump the Interrupt Descriptor Table contents and it also confirms that the IDT is located at fffff803`536dda00 as shown below: We can dump the IDT and see addresses of Interrupt Service Routines for a given interrupt. Below is a snippet of the Interrupt Descriptor Table: This is the routine that gets executed first inside the kernel when a keyboard event such as a keypress is registered on the OS Eventually, the routine i8042prt!I8042KeyboardInterruptService (inside the actual keyboard driver) is hit once the code at fffff8008f37f700 is finished Once the breakpoint is set, a key is pressed on the OS login prompt and our breakpoint is hit, confirming that IDT table using index 0x0a is looked up (IDT address + 0xa0 * 0x10) and the ISR Entry Point is resolved and code jumps to it"
