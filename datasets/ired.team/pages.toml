full_description = "reversing, forensics & miscInternalsWindows x64 Calling Convention: Stack FramePreviousWindows Kernel Drivers 101NextLinux x64 Calling Convention: Stack FrameLast updated 4 years ago Below return address (RSP + 0x0) 32 bytes are always allocated for RCD, RDX, R8 and R9, even if the callee uses less than 4 arguments RBP is not used for referencing local variables/function arguments (except for when functions use alloca()) as it used to be the case for X86. RSP is responsible for that, hence RSP value does not change throughout the function body (push and pop is only used for epilogue/prologue) As an example, let's take a look at the function msv1_0.LsaInitializePackage in Ghidra. Below shows how the first four arguments are stored in ECX (lower part of RCX), RDX, R8 and R9:"
