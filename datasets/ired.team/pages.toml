full_description = '''PinnedActive Directory & Kerberos AbuseActive Directory Enumeration with AD Module without RSAT or Admin PrivilegesPreviousBackdooring AdminSDHolder for PersistenceNextEnumerating AD Object Permissions with dsaclsLast updated 6 years ago This lab shows how it is possible to use Powershell to enumerate Active Directory with Powershell's Active Directory module on a domain joined machine that does not have Remote Server Administration Toolkit (RSAT) installed on it. Installing RSAT requires admin privileges and is actually what makes the AD Powershell module available and this lab shows how to bypass this obstacle. The secret to being able to run AD enumeration commands from the AD Powershell module on a system without RSAT installed, is the DLL located in C:\Windows\Microsoft.NET\assembly\GAC_64\Microsoft.ActiveDirectory.Management on a system that has the RSAT installed: This means that we can just grab the DLL from the system with RSAT and drop it on the system we want to enumerate from (that does not have RSAT installed) and simply import that DLL as a module: Note how before we import the module, Get-Command get-adcom* returns nothing, but that changes once we import the module:'''
