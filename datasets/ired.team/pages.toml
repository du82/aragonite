["https://ired.team/miscellaneous-reversing-forensics/windows-kernel-internals/pe-file-header-parser-in-c++"]
title = "Parsing PE File Headers with C++ | Red Team Notes"
full_description = "reversing, forensics & miscInternalsParsing PE File Headers with C++PreviousExploring Injected ThreadsNextInstrumenting Windows APIs with FridaLast updated 4 years ago In this lab I'm writing a simple Portable Executable (PE) file header parser for 32bit binaries, using C++ as the programming language of choice. The lab was inspired by the techniques such as reflective DLL injection and process hollowing which both deal with various parts of the PE files. This lab is going to be light on text as most of the relevant info is shown in the code section, but I will touch on the piece that confused me the most in this endevour - parsing the DLL imports. Below is a graphic showing the end result - a program that parses a 32bit cmd.exe executable and spits out various pieces of information from various PE headers as well as DLL imports. The parser is not full-blown - it only goes through the main headers and DLL imports, so no exports, relocations or resources will be touched. For the most part of this lab, header parsing was going smoothly, until it was time to parse the DLL imports. The bit below is the final solution that worked for parsing out the DLL names and their functions: Parsing out imported DLLs and their functions requires a good number of offset calculations that initially may seem confusing and this is the bit I will try to put down in words in these notes. So how do we go about extracting the DLL names the binary imports and the function names that DLL exports? Section - a PE header that defines various sections contained in the PE. Some sections are .text - this is where the assembly code is stored, .data contains global and static local variables, etc. Relative Virtual Address (RVA) - address of some file item in memory minus the base address of the image. Virtual Address (VA) - virtual memory address of some file item in memory without the image base address subtracted. For example, if we have a VA 0x01004000 and we know that the image base address is 0x0100000, the RVA is 0x01004000 - 0x01000000 = 0x0004000."
