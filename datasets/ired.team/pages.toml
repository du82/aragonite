["https://ired.team/offensive-security-experiments/active-directory-kerberos-abuse/abusing-active-directory-acls-aces"]
title = "Abusing Active Directory ACLs/ACEs | Red Team Notes"
full_description = "PinnedActive Directory & Kerberos AbuseAbusing Active Directory ACLs/ACEsPreviousPowerView: Active Directory EnumerationNextPrivileged Accounts and Token PrivilegesLast updated 5 years ago This lab is to abuse weak permissions of Active Directory Discretionary Access Control Lists (DACLs) and Acccess Control Entries (ACEs) that make up DACLs. Active Directory objects such as users and groups are securable objects and DACL/ACEs define who can read/modify those objects (i.e change account name, reset password, etc). Using powerview, let's check if our attacking user spotless has GenericAll rights on the AD object for the user delegate: We can see that indeed our user spotless has the GenericAll rights, effectively enabling the attacker to take over the account: Let's see if Domain admins group has any weak permissions. First of, let's get its distinguishedName: If you have these privileges on a Computer object, you can pull Kerberos Resource-based Constrained Delegation: Computer Object Take Over off. If we have ExtendedRight on User-Force-Change-Password object type, we can reset the user's password without knowing their current password: After the ACE enumeration, if we find that a user in our control has WriteOwner rights on ObjectType:All ...we can change the Domain Admins object's owner to our user, which in our case is spotless. Note that the SID specified with -Identity is the SID of the Domain Admins group: WriteProperty on an ObjectType, which in this particular case is Script-Path, allows the attacker to overwrite the logon script path of the delegate user, which means that the next time, when the user delegate logs on, their system will execute our malicious script: Interesting to note that I could not abuse these privileges by using Active Directory module and Set-Acl / Get-Acl cmdlets:"
