["https://ired.team/miscellaneous-reversing-forensics/reversing-password-checking-routine"]
title = "Reversing Password Checking Routine | Red Team Notes"
full_description = "reversing, forensics & miscReversing Password Checking RoutinePreviousAES Encryption Using Crypto++ .lib in Visual Studio C++Last updated 6 years ago A couple of my internet fellas were working on a CTF that presented them a binary file, which had the flag inside they had to retrieve. I jumped on this without expecting much, but anyway. The file was a non-stripped out linux binary file, which means debugging will be easier since we will be able to see original function names used in the binary. We can notice some interesting things that we can make some assumptions about - notably the following strings: ACCESS GRANTED/ACCESS DENIED - possibly will need to enter a password somewhere in the binary and these messages will be printed to the user depending on if the provded password is correct/incorrect. some long strings - maybe something interesting encoded here or maybe those strings are used as part of the password decryption algorithm? We can see that at offset b14 (cyan) there is a C function scanf called which reads from the standard input. instruction at b20 (orange) calls a check_pw routine - we can assume that the input captured from the instruction at b14 will be passed to check_pw function to decide if the string received from the standard input matches the password the binary is protected with or not instruction at b25 carries out a check against the eax register and based on if eax==0 or eax!=0, it will either take a jump to instructions at b27 (if eax==0) or continue executing instructions at b29 if eax!=0. Pressumably, the jumps are carried out based on if the provided password is correct or incorrect. Do a quick disas of the main function to remind ourselves once again what the routine for password checking was Let's hit c to continue running the program until the scanf function is called and then provide it with some dummy password, say test: If we skip through instructions one by one and keep observing how register values change over time and what instructions are executed, we will soon end up at check_pw+88:"
