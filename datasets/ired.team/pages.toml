title = "Instrumenting Windows APIs with Frida | Red Team Notes"
full_description = "reversing, forensics & miscInternalsInstrumenting Windows APIs with FridaPreviousParsing PE File Headers with C++NextExploring Process Environment BlockLast updated 4 years ago Frida is dynamic instrumentation toolkit for developers, reverse-engineers, and security researchers. The below code in hooking.js will find address of the Windows API WriteFile (lives in kernel32.dll/kernelbase.dll) and hexdump the contents of the 1st argument passed to it: Let's spawn a new notepad.exe through Frida and supply it with the above hooking.js code, so that we can start instrumenting the WriteFile API and inspect the contents of the buffer that is being written to disk: Notice that we can update the hooking.js code and the instrumentation happens instantly - it does not require us to re-spawn the notepad or re-attaching Frida to it. In the above GIF, this can be seen at the end when we request the console to spit out the process.id (the frida is attached to) and the notepad process ID gets printed out to the screen instantly. If we want to see if certain API calls are invoked by some specific process, say WriteFile, we can use frida-trace tool like so: Can we intercept the plaintext credentials from the credentials prompt the user gets when they want to execute a program as another user? Let's use frida-trace to see if explorer.exe ever calls any functions named *Cred* when we invoke the credentials popup: Below, we can see that indeed, there is a call to CredUIPromptForWindowsCredentialsW made when the prompt is first invoked: The CredUnPackAuthenticationBuffer function converts an authentication buffer returned by a call to the CredUIPromptForWindowsCredentials function into a string user name and password. With CredUnPackAuthenticationBufferW instrumented, entering credentials in the prompt launched by explorer.exe, gives us the expected result - the credentials are seen in plaintext:"
