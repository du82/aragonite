full_description = "reversing, forensics & miscInternalsExploring Process Environment BlockExploring a couple of interesting members of the PEB memory structure fieldsPreviousInstrumenting Windows APIs with FridaNextWriting a Custom BootloaderLast updated 6 years ago A very brief look into the PEB memory structure found, aiming to get a bit more comfortable with WinDBG and walking memory structures. There are many fields in the structure among which there are ImageBaseAddresss and ProcessParameters which are interesting to us for this lab: The _PEB structure can now be overlaid on the memory pointed to by the $peb to see what values the structure members are holding/pointing to: Let's check what's in memory at address 0000000049d40000 - pointed to by the ImageBaseAddress member of the _peb structure: A nice way of getting a list of linked-list structure addresses is by providing address of the first list_entry structure to the command dl and specifying how many list items it should print out: Another way of achieving the same would be to use the !list command to list through the list items and dump the info: It is possible to abuse the PEB structure and masquerade one windows processes with another process. See this lab for more:"
