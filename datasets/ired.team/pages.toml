["https://ired.team/miscellaneous-reversing-forensics/windows-kernel-internals/loading-a-windows-kernel-driver-osr-driver-loader-debugging-with-source-code"]
title = "Loading Windows Kernel Driver for Debugging | Red Team Notes"
full_description = 'reversing, forensics & miscInternalsLoading Windows Kernel Driver for DebuggingPreviousCompiling a Simple Kernel Driver, DbgPrint, DbgViewNextSubscribing to Process Creation, Thread Creation and Image Load Notifications from a Kernel DriverLast updated 4 years ago On the system where you want to load your driver (debugee), from an elevated command prompt, disable the driver integrity checks so that we can load our unsigned drivers onto Windows 10: Note that my driver name was kmdfHelloDriver. We can now confirm the driver loaded successfully by debugging the kernel: If we check it via the service configuration manager, we also see that our driver is now loaded and running: The benefit of loading a kernel driver this way is that it does not rely on OSR Driver Loader or any other 3rd party tools and also is much more efficient. Important In order for this technique to work, the WinDBG debugger needs to be attached to the debugee. The above function Install-Driver takes one parameter $name, which signifies a driver name that we want to install. Once the powershell profile is saved, close the powershell console and open it again for the function Install-Driver to become usable. Navigate to the folder that contains the .sys file of the driver you want to install, which in my case is wdm-helloworld.sys in Z:\wdm-helloworld\x64\Debug: If we have source code for the driver we want to debug, we can load its source code and step through it in WinDBG. Load the source code via the Source > Open Source File and re-load the driver again using Install-Driver function:'
