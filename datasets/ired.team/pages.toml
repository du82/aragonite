["https://ired.team/miscellaneous-reversing-forensics/windows-kernel-internals/how-kernel-exploits-abuse-tokens-for-privilege-escalation"]
title = "Token Abuse for Privilege Escalation in Kernel | Red Team Notes"
full_description = "reversing, forensics & miscInternalsToken Abuse for Privilege Escalation in KernelPreviousInterrupt Descriptor Table - IDTNextManipulating ActiveProcessLinks to Hide Processes in UserlandLast updated 5 years ago The purpose of this lab is to understand at a high level (will not be writing any kernel code, rather playing around with WinDBG) how kernel exploits abuse tokens for privilege escalation. _EPROCESS is a kernel memory structure that describes system processes (or in other words - each process running on a system has its corresponding _EPROCESS object somewhere in the kernel) as we know them as it contains details such as process image name, which desktop session it is running in, how many open handles to other kernel objects it has, what access token it has and much more. _TOKEN is a kernel memory structure that describes process's security context and contains information such as process token privileges, logon id, session id, token type (i.e primary vs. impersonation) and much more. Let's now see how we can use the above information about processes and tokens to elevate a medium integrity process to a system integrity process the way kernel exploits do it. One way kernel exploits escalate privileges is by replacing a low privileged token with a high privileged token. Below are some key points in explaining the exploitation process: _EPROCESS structure contains a pointer to a _TOKEN memory structure that describes process's security context Kernel exploit finds address of the _TOKEN structure of a low privileged process - the one it wants to escalate from In this lab, I'm going to replace the authentication token of a low privileged powershell process with a high privileged token of the system process (always a PID 4) following the above described process, except I will do it manually using WinDBG. Red dotted line signifies that the low privileged process powershell will assume the high privileged token from the process system once the _TOKEN kernel memory structure is manipulated."
