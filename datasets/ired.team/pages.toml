title = "From Domain Admin to Enterprise Admin | Red Team Notes"
description = "Explore Parent-Child Domain Trust Relationships and abuse it for Privilege Escalation"
full_description = '''PinnedActive Directory & Kerberos AbuseFrom Domain Admin to Enterprise AdminExplore Parent-Child Domain Trust Relationships and abuse it for Privilege EscalationPreviousActive Directory & Kerberos AbuseNextKerberoastingLast updated 2 years ago This lab is based on an Empire Case Study and its goal is to get more familiar with some of the concepts of Powershell Empire and its modules as well as Active Directory concepts such as Forests, Parent/Child domains and Trust Relationships and how they can be abused to escalate privileges. Firstly, some LAB setup - we need to create a child domain controller as well as a new forest with a new domain controller. After installing a child domain red.offense.local of a parent domain offense.local, Active Directory Domains and Trusts show the parent-child relationship between the domains as well as their default trusts: The first console shows the domain trust relationship from offense.local perspective and the second one from red.offense.local. Note the the direction is BiDirectional which means that members can authenticate from one domain to another when they want to access shared resources: After installing a new DC dc-blue in a new forest, let's setup a one way trust between offense.local and defense.local domains using controllers dc-mantvydas.offense.local and dc-blue.defense.blue. Now that the trust relationship is set, it is easy to check if it was done correctly. What should happen now is that resources on defense.local (trusting domain) should be available to members of offense.local (trusted domain). Note how the user on dc-mantvydas.offense.local is not able to share a folder to defense\administrator (because offense.local does not trust defense.local): However, dc-blue.defense.local, trusts offense.local, hence is able to share a resource to one of the members of offense.local - forest trust relationships work as intended: Since the agent is running within a high integrity process, let's dump credentials - some interesting credentials can be observed for a user in red.offense.local domain:'''
