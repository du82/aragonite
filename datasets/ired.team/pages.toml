title = "Kerberoasting: Requesting RC4 Encrypted TGS when AES is Enabled | Red Team Notes"
full_description = "PinnedActive Directory & Kerberos AbuseKerberoasting: Requesting RC4 Encrypted TGS when AES is EnabledPreviousAS-REP RoastingNextKerberos Unconstrained DelegationLast updated 5 years ago It is possible to kerberoast a user account with SPN even if the account supports Kerberos AES encryption by requesting an RC4 ecnrypted (instead of AES) TGS which easier to crack. Since the user account does not support Kerberos AES ecnryption by default, when requesting a TGS ticket for kerberoasting with rubeus, we will get an RC4 encrypted ticket: By default, returned tickets will be encrypted with the highest possible encryption algorithm, which is AES: As mentioned in the beginning, it's still possible to request an RC4 ecnrypted ticket (if RC4 is not disabled in the environment, which does not seem to be common yet): Even though AES encryption is supported by both parties, a TGS ticket encrypted with RC4 (encryption type 0x17/23) was returned. Note that SOCs may be monitoring for tickets encrypted with RC4:"
