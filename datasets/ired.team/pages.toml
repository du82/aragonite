full_description = "PinnedActive Directory & Kerberos AbuseKerberos: Silver TicketsCredential AccessPreviousKerberos: Golden TicketsNextAS-REP RoastingLast updated 6 years ago This lab looks at the technique of forging a cracked TGS Kerberos ticket in order to impersonate another user and escalate privileges from the perspective of a service the TGS was cracked for. I will be using mimikatz to create a Kerberos Silver Ticket - forging/rewriting the cracked ticket with some new details that benefit me as an attacker. Checking available tickets in memory with klist - note how the ticket shows our forged username benignadmin and a forged user id: Note in the above mimikatz window the Group IDs which our fake user benignadmin is now a member of due to the forged ticket: Initiating a request to the attacked service with a TGS ticket - note that the authentication is successfull: It is better not to use user accounts for running services on them, but if you do, make sure to use really strong passwords! Computer accounts generate long and complex passwords and they change frequently, so they are better suited for running services on. Better yet, follow good practices such as using Group Managed Service Accounts for running more secure services."
