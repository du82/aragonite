["https://ired.team/miscellaneous-reversing-forensics/windows-kernel-internals/etw-event-tracing-for-windows-101"]
title = "ETW: Event Tracing for Windows 101 | Red Team Notes"
full_description = "reversing, forensics & miscInternalsETW: Event Tracing for Windows 101PreviousManipulating ActiveProcessLinks to Hide Processes in UserlandNextExploring Injected ThreadsLast updated 4 years ago Event Tracing for Windows (ETW) is a Windows OS logging mechanism for troubleshooting and diagnostics, that allows us to tap into an enormous number of events that are generated by the OS every second Contollers are applications that can start a trace session and enable or disable providers in that trace session Logman.exe is a native Windows command-line utility, which is considered to be a Controller. Below, some of the concepts mentioned earlier are explored. One of the many built-in interesting providers available to us in Windows is Microsoft-Windows-Kernel-Process, so let's check it out: As we can tell from the above keywords, this provider could provide us with some process, thread and image (load/unload as we will see later) related events. Use ETWExplorer for a deep provider inspection, and see what events and more importantly data it can provide. Below shows Microsoft-Windows-Kernel-Process being inspected with ETWExplorer with some information, which looks like something Sysmon and other similar security monitoring oriented tools could use: Note that at the moment, although the tracing session is running, it is not recording any events as we have not yet subscribed to any providers: Inside the spotless-tracing tracing session, let's subscribe to events about PROCESSES and IMAGES provided by the provider Microsoft-Windows-Kernel-Process and see what they look like. In order to subscribe to those events, we first need to refer back to Microsoft-Windows-Kernel-Process available keywords (event types of this provider) and add 0x10 (WINEVENT_KEYWORD_PROCESS) to 0x40 (WINEVENT_KEYWORD_IMAGE), which gives us the total of 0x50: We can now register a provider to the tracing session and ask it to emit events that map back to events WINEVENT_KEYWORD_PROCESS and WINEVENT_KEYWORD_IMAGE:"
