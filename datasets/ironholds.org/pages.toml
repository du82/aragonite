hical Transactions of the Royal Society B 378.1872 (2023): 20210398. Lewis, Ashley. “STS Researchers as Technology: Multiple Positionalities as Interpretations of Participant Expectations and Agendas.” Catalyst: Feminism, Theory, Technoscience 9.2 (2023). Miller, Franklin G. “Clinical research before informed consent.” Kennedy Institute of Ethics Journal 24.2 (2014): 141-157. Miralles, Megane, et al. “Guest editorial: Investigating trauma: methodological, emotional and ethical challenges for the qualitative researcher.” Qualitative Research in Organizations and Management: An International Journal 17.4 (2022): 397-405. Pham, Bao-Chau, et al. “Academic citizenship, together: Prioritising care and reflexivity in scholarly life.” Journal of Praxis in Higher Education 6.2 (2024): 66-79. Procope Bell, Danielle. ““Pick-Me” Black women: tactical patriarchal femininity in the Black manosphere.” Feminist Media Studies (2023): 1-19. Previous"
