full_description = "reading Stuff I've been reading (August 2022) By Os Keyes September 01, 2022 Things I finished reading in August 2022: Books and dissertations Ahmed, Sara. Strange encounters: Embodied others in post-coloniality. Routledge, 2013. Barnard, Ian. Sex Panic Rhetorics, Queer Interventions. University of Alabama Press, 2020. Casey, Edward S. Turning emotion inside out: Affective life beyond the subject. Northwestern University Press, 2021. Casper, Monica, and Paisley Currah. Corpus: An interdisciplinary reader on bodies and knowledge. Springer, 2011. Ebeling, Mary FE. Afterlives of Data: Life and Debt Under Capitalist Surveillance. Univ of California Press, 2022. Dean, Mitchell. Critical and effective histories: Foucault’s methods and historical sociology. Routledge, 2002. Fisher, Jill A., ed. Gender and the science of difference: Cultural politics of contemporary science and medicine. Rutgers University Press, 2011. Fox, Renee C., and Judith P. Swazey. The courage to fail: A social view of organ transplants and dialysis. Transaction Publishers, 1974. Freund, Paul A., ed. Experimentation with Human Subjects. George Braziller, 1969. Garland-Thomson, Rosemarie. Staring: How we look. Oxford University Press, 2009. Garber, Marjorie B. Vested Interests: Cross-Dressing and Cultural Anxiety. Psychology Press, 1997. Hunt, Nancy. Mirror Image: The Odyssey of a Male-to-Female Transsexual. Holt McDougal, 1978. Jasanoff, Sheila. The fifth branch: science advisers as policymakers. Harvard University Press, 1998. Johnson, Austin H., Baker A. Rogers, and Tiffany Taylor, eds. Advances in Trans Studies: Moving Toward Gender Expansion and Trans Hope. Emerald Group Publishing, 2021. Karasic, Dan, and Jack Drescher, eds. Sexual and Gender Diagnoses of the Diagnostic and Statistical Manual (DSM) A Reevaluation. Haworth Press, 2005. Keating, Peter, and Alberto Cambrosio. Biomedical platforms: realigning the normal and the pathological in late-twentieth-century medicine. MIT