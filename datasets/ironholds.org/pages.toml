ugh Success: Co-construction Processes of Imaginaries (of Participation) and Group Development.” Science, Technology, & Human Values (2019): 0162243919864711. Frost, Samantha. “Re-considering the turn to biology in feminist theory.” Feminist Theory 15.3 (2014): 307-326. Garry, Ann. “Intersectionality, metaphors, and the multiplicity of gender.” Hypatia 26.4 (2011): 826-850. Gekker, Alex, and Sam Hind. “Infrastructural surveillance.” New Media & Society (2019): 1461444819879426. Grinker, Roy Richard. “Reframing the science and anthropology of autism.” Culture, Medicine, and Psychiatry 39.2 (2015): 345-350. Grzanka, Patrick R. “Queer survey research and the ontological dimensions of heterosexism.” WSQ: Women’s Studies Quarterly 44.3 (2016): 131-149. Hansen, Helena, Caroline Parker, and Jules Netherland. “Race as a Ghost Variable in (White) Opioid Research.” Science, Technology, & Human Values (2020): 0162243920912812. Herman, Elis L. “Tranarchism: transgender embodiment and destabilization of the state.” Contemporary Justice Review 18.1 (2015): 76-92. Hilário, Ana Patrícia. “Rethinking trans identities within the medical and psychological community: a path towards the depathologization and self-definition of gender identification in Portugal?.” Journal of Gender Studies 29.3 (2020): 245-256. Joel, Daphna, et al. “Queering gender: studying gender identity in ‘normative’individuals.” Psychology & Sexuality 5.4 (2014): 291-321. Johnson, Austin H. “Beyond inclusion: Thinking toward a transfeminist methodology.” in At the center: Feminism, social science and knowledge. Emerald Group Publishing Limited, 2015. Jones, Lucy. “‘The fact they knew before I did upset me most’: Essentialism and normativity in lesbian and gay youths’ coming out stories.” Sexualities (2019): 1363460719830343. Klysing, Amanda. “Exposure to Scientific Explanations for Gender Differences Influences Individuals’ Personal Theories of Gender and Their Evaluations of a Discriminatory Situation.” Sex Roles 