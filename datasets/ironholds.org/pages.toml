full_description = "fundingawardsAIgender Ada Lovelace Fellowship awarded By Os Keyes January 16, 2019 Having had to keep it under wraps for a month: I am extremely delighted to announce that I’ve been awarded one of six inaugural Ada Lovelace Fellowships, providing three years of guaranteed tuition and stipend support, by Microsoft Research. The Fellowship is aimed at supporting underrepresented student populations, and in my case will be used to continue my current work on gender, identity and AI. I am utterly overjoyed at the peace of mind and relative security this brings, as well as the obvious compliment it represents. Many, many thanks go to David, Charlotte, Gary, Anna, Cindy, Meredith and Julie for all of their support in making this somehow happen! Now, if you excuse me: I’m going to go sleep until the CSCW deadline. Previous"
