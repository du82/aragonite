title = "Hi!"
full_description = "Hi! I’m Os Keyes, a Science and Technology Studies researcher currently working as a Postdoctoral Fellow at the Evans Lab. My work is largely situated in two (seemingly-unconnected) areas; questions of gender, disabiliy and power in Artificial Intelligence, and the politics and social study of transgender medicine. Tying them together is the desire to understand how ideas of science and technology play a role in constructing the world, and how we might construct better ones. Prior to my postdoctoral work, I was a PhD student in the University of Washington’s Department of Human Centred Design & Engineering, following essentially the same two themes. The AI work resulted in over a dozen journal articles, alongside many smaller pieces, and the award of an inagurual Ada Lovelace Fellowship. My dissertation, Trans Science, explored the past, present and future of gender-affirming medicine and the politics of scientific efforts to demonstrate its effect on patients. I’m currently in the process of “bookifying” this project, as well as publishing a range of spin-off works from research that didn’t fit in the overall manuscript. Outside of formal academic research, I have written for Wired, Vice, Logic(s) and a host of other popular venues, taught philosophy in the Seattle University’s honours program just for funsies, and worked as a biomedical archivist at the University of Washington, processing interesting archive collections and making them available for future and other scholars. I can be contacted at Os_Keyes @ uml . edu if you have questions about any of the above, particularly/as well as: The history of trans medicine and medical research around that domain of care; Many, many (pretty well-informed) opinions on the politics of AI; Grad school application help and advice, particularly if you’re trans, and/or; Where you might send me high-value cheques and/or offers to be Tenured Chair of Writing Long Troublemaking Manuscripts."
