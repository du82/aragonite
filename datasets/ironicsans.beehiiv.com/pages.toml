-on-secondary-color); } .bg-wt-tertiary { background-color: var(--wt-tertiary-color); } .text-wt-tertiary { color: var(--wt-tertiary-color); } .border-wt-tertiary { border-color: var(--wt-tertiary-color); } .bg-wt-text-on-tertiary { background-color: var(--wt-text-on-tertiary-color); } .text-wt-text-on-tertiary { color: var(--wt-text-on-tertiary-color); } .border-wt-text-on-tertiary { border-color: var(--wt-text-on-tertiary-color); } .bg-wt-background { background-color: var(--wt-background-color); } .text-wt-background { color: var(--wt-background-color); } .border-wt-background { border-color: var(--wt-background-color); } .bg-wt-text-on-background { background-color: var(--wt-text-on-background-color); } .text-wt-text-on-background { color: var(--wt-text-on-background-color); } .border-wt-text-on-background { border-color: var(--wt-text-on-background-color); } .bg-wt-subscribe-background { background-color: var(--wt-subscribe-background-color); } .text-wt-subscribe-background { color: var(--wt-subscribe-background-color); } .border-wt-subscribe-background { border-color: var(--wt-subscribe-background-color); } .bg-wt-text-on-subscribe-background { background-color: var(--wt-text-on-subscribe-background-color); } .text-wt-text-on-subscribe-background { color: var(--wt-text-on-subscribe-background-color); } .border-wt-text-on-subscribe-background { border-color: var(--wt-text-on-subscribe-background-color); } .rounded-wt { border-radius: var(--wt-border-radius); } .wt-header-font { font-family: var(--wt-header-font); } .wt-body-font { font-family: var(--wt-body-font); } .wt-button-font { font-family: var(--wt-button-font); } input:focus { --tw-ring-color: transparent !important; } li a { word-break: break-word; } @media only screen and (max-width:667px) { .mob-stack { display: block !important; width: 100% !important; } .mob-w-full { width: 100% !important; } } .table-base, .table-c, .table-h { border: 1px solid #C0C0C0; } .table-c { padding:5px; background-color:#FFFFFF; } .table-c p { color: #2D2D2D; font-family:'Helvetica',Arial,sans-serif !important; overflow-wrap: break-word; } .table-h { padding:5px; background-color:#F1F1F1; } .table-h p { color: #2A2A2A; font-family:'Trebuchet MS','Lucida Grande',Tahoma,sans-serif !important; overflow-wrap: break-word; } .bh__byline_wrapper { font-size: .875rem; line-height: 1.25rem; vertical-align: middle; justify-content: space-between; display: block; } .bh__byline_social_wrapper { display: flex; margin-top: 0.5rem; align-items: center; } .bh__byline_social_wrapper > * + * { margin-left: 1rem; } @media (min-width: 768px) { .bh__byline_wrapper { display: flex; } .bh__byline_social_wrapper { margin-top: 0rem; } } The Perfect Cup of Coffee Doesn’t Exi—Two coffee men and one flying ringDavid Friedman September 03, 2024 p span[style*="font-size"] { line-height: 1.6; } I’m so pleased that Gisnep is already up to thousands of people playing daily, and I’m seeing wonderful comments like “I’ve been hooked on it ever since I discovered it” and “I'm absolutely obsessed with this game.” If you haven’t played it yet, go play! Then come back to read the newsletter. Or maybe vice versa. But check it out! p span[style*="font-size"] { line-height: 1.6; } It’s been a while since I’ve told you about an inventor from my old Inventor Portraits Project, so let me tell you today about Alan Adler. He invented two things that you have almost certainly seen even if you haven’t used them yourself, and you would never guess that they were invented by the same person. p span[style*="font-size"] { line-height: 1.6; } I’m talking about the Aerobie Flying Ring and the AeroPress Coffee Maker. p span[style*="font-size"] { line-height: 1.6; } I didn’t even realize that they were invented by the same person when I decided to reach out to Alan for my project. The AeroPress was very hot at the time and I kept seeing mentions of it all over the place. I knew that people liked to customize how they used it to the point that there were AeroPress coffee-making competitions to see who could make the best cup of coffee with an AeroPress. p span[style*="font-size"] { line-height: 1.6; } I finally got one for myself after seeing a short video Adam Lisagor made about his AeroPress ritual. p span[style*="font-size"] { line-height: 1.6; } I figured that if the coffee maker had so many fans, a video about the man behind the coffee maker would surely be a hit. When I looked into its inventor and discovered that he also invented the Aerobie toy that I played with when I was a kid, I was delighted to discover a broader story than I originally anticipated. p span[style*="font-size"] { line-height: 1.6; } The Aerobie, if you don’t know, is a ring that’s thrown kind of like a Frisbee, but is aerodynamically designed to fly much further. In fact, the world record for the furthest distance an object has ever been thrown is 406 meters with an Aerobie! p span[style*="font-size"] { line-height: 1.6; } So I sent Alan an email asking if he’d participate in my project, and he said yes, becoming the 46th inventor in the series. p span[style*="font-size"] { line-height: 1.6; } We met at his office in Los Altos, California, near Stanford, for a video interview and photo shoot. I’d designed a coffee mug that featured a simplified rendering of the Aerobie — an object that sort of combined his two major inventions — and brought it as a prop for our photos and as a gift for him to keep. I think it looked pretty neat. p span[style*="font-size"] { line-height: 1.6; } Since I was making a video, I needed some footage of the Aerobie in action. So we went to a school playground nearby to throw the Aerobie in an open field for b-roll. I learned that I had been throwing the Aerobie wrong my whole life. I tended to throw it with a slightly upward slant, like I would a Frisbee. But the Aerobie is designed to fly best when thrown flat and level. p span[style*="font-size"] { line-height: 1.6; } Just look at this actual unedited shot, and keep your eye on the Aerobie: p span[style*="font-size"] { line-height: 1.6; } It flies so straight! Not only does it not get any lower as it travels through that image, but I swear at the end it looks like it might be getting higher! p span[style*="font-size"] { line-height: 1.6; } The lip of the Aerobie is designed like an airplane’s wing to give it a bit of lift as it travels. And being thin, it doesn’t encounter a lot of resistance like a Frisbee does, so it goes a lot further. Cross-section of an Aerobie p span[style*="font-size"] { line-height: 1.6; } Here’s how Popular Science explained the physics in 1986: p span[style*="font-size"] { line-height: 1.6; } While we were at the playground, I took some photos of Alan with his invention: p span[style*="font-size"] { line-height: 1.6; } And before we left the school grounds, Alan played me some music on an instrument he designed and built based on the Japanese shakuhachi. p span[style*="font-size"] { line-height: 1.6; } Back at his office, we talked about the AeroPress. p span[style*="font-size"] { line-height: 1.6; } He described what motivated him to find a better way of making coffee: The way I got the idea for the AeroPress was that I realized that the coffee makers that we had in our house were not very good for making a single cup. And yet 90% of the time when I wanted to make coffee, that's what I wanted, was one cup.So I experimented with learning the art of what's called the pour-over with a cone filter placed over a cup, and I eventually learned how to do that pretty well. But I was frustrated by the fact that the drip-through time was on the order of about 5 minutes, and I felt that the long wet time was adding to the bitterness of the drink. And so I tried pressing on the top of the cone with a spoon, but that didn't shorten the drip-through time at all. So I decided I would make something that was enclosed, that I could pressurize with air, and force the filtering process to take place entirely in one minute instead of five minutes. And I went out in my shop and I made what was a prototype of the AeroPress. And I was just wowed at how good the coffee tasted. It was much sweeter, less bitter. Later on I measured it with instruments and found it had only 1/5 the acid level of ordinary drip coffee.Early AeroPress prototypes p span[style*="font-size"] { line-height: 1.6; } Eventually he settled on the design that people came to love, making a single cup of coffee in just about a minute. p span[style*="font-size"] { line-height: 1.6; } We shot video where he elaborates on the process, explains why people prefer AeroPress coffee, and demonstrates how he uses his AeroPress. p span[style*="font-size"] { line-height: 1.6; } You can watch the full finished video telling Alan’s story about both inventions here: Another coffee man p span[style*="font-size"] { line-height: 1.6; } A couple years later, I had an opportunity to make a video with another person important to the world of coffee: Starbucks CEO Howard Schultz. This was well before his disastrous Presidential bid. p span[style*="font-size"] { line-height: 1.6; } I was only going to have access to him for about 10 minutes, so I came up with an idea for how to make the most of his time. I asked his team how he prefers to make coffee and learned that he likes to use a French press. So the structure of the piece would be: The Starbucks CEO demonstrates how he makes coffee and while it’s steeping he answers some questions printed on index cards. p span[style*="font-size"] { line-height: 1.6; } We shot it at the then-new Starbucks Reserve Roastery in Seattle, which gave me some opportunities to capture some lovely b-roll. p span[style*="font-size"] { line-height: 1.6; } I was really happy with how it turned out! p span[style*="font-size"] { line-height: 1.6; } The opening shot with the barista putting down the cup that says “Howard” was filmed weeks later at a Starbucks near my office. The barista nailed the placement and angle of the cup in one take, and had perfect handwriting for this. I don’t think I’ve ever seen better barista handwriting. p span[style*="font-size"] { line-height: 1.6; } Maybe one day I’ll have a reason to make a third video about someone important to the world of coffee, completing my coffee trilogy. I don’t know who that might be. Any suggestions? p span[style*="font-size"] { line-height: 1.6; } In the meantime, thanks as always for reading. And if you aren’t already playing Gisnep, what are you waiting for? p span[style*="font-size"] { line-height: 1.6; } Someone recently asked me if Gisnep is pronounced with a hard or soft G and I realized I may have inadvertently created a gif situation. For the record, I say Gisnep with a hard G (unlike gif, of course). p span[style*="font-size"] { line-height: 1.6; } Your help spreading the word about this newsletter (and Gisnep) is always appreciated, as are any donations you might be inclined to give to keep my projects going. p span[style*="font-size"] { line-height: 1.6; } See you next time! p span[style*="font-size"] { line-height: 1.6; } David ReplyNewest firstAdd your commentLoginLogin or Subscribe to participate.'''
