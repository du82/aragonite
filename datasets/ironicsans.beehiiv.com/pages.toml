(--wt-text-on-secondary-color); } .bg-wt-tertiary { background-color: var(--wt-tertiary-color); } .text-wt-tertiary { color: var(--wt-tertiary-color); } .border-wt-tertiary { border-color: var(--wt-tertiary-color); } .bg-wt-text-on-tertiary { background-color: var(--wt-text-on-tertiary-color); } .text-wt-text-on-tertiary { color: var(--wt-text-on-tertiary-color); } .border-wt-text-on-tertiary { border-color: var(--wt-text-on-tertiary-color); } .bg-wt-background { background-color: var(--wt-background-color); } .text-wt-background { color: var(--wt-background-color); } .border-wt-background { border-color: var(--wt-background-color); } .bg-wt-text-on-background { background-color: var(--wt-text-on-background-color); } .text-wt-text-on-background { color: var(--wt-text-on-background-color); } .border-wt-text-on-background { border-color: var(--wt-text-on-background-color); } .bg-wt-subscribe-background { background-color: var(--wt-subscribe-background-color); } .text-wt-subscribe-background { color: var(--wt-subscribe-background-color); } .border-wt-subscribe-background { border-color: var(--wt-subscribe-background-color); } .bg-wt-text-on-subscribe-background { background-color: var(--wt-text-on-subscribe-background-color); } .text-wt-text-on-subscribe-background { color: var(--wt-text-on-subscribe-background-color); } .border-wt-text-on-subscribe-background { border-color: var(--wt-text-on-subscribe-background-color); } .rounded-wt { border-radius: var(--wt-border-radius); } .wt-header-font { font-family: var(--wt-header-font); } .wt-body-font { font-family: var(--wt-body-font); } .wt-button-font { font-family: var(--wt-button-font); } input:focus { --tw-ring-color: transparent !important; } li a { word-break: break-word; } @media only screen and (max-width:667px) { .mob-stack { display: block !important; width: 100% !important; } .mob-w-full { width: 100% !important; } } .table-base, .table-c, .table-h { border: 1px solid #C0C0C0; } .table-c { padding:5px; background-color:#FFFFFF; } .table-c p { color: #2D2D2D; font-family:'Helvetica',Arial,sans-serif !important; overflow-wrap: break-word; } .table-h { padding:5px; background-color:#F1F1F1; } .table-h p { color: #2A2A2A; font-family:'Trebuchet MS','Lucida Grande',Tahoma,sans-serif !important; overflow-wrap: break-word; } .bh__byline_wrapper { font-size: .875rem; line-height: 1.25rem; vertical-align: middle; justify-content: space-between; display: block; } .bh__byline_social_wrapper { display: flex; margin-top: 0.5rem; align-items: center; } .bh__byline_social_wrapper > * + * { margin-left: 1rem; } @media (min-width: 768px) { .bh__byline_wrapper { display: flex; } .bh__byline_social_wrapper { margin-top: 0rem; } } The SNL Superfan Who Saw Every Episode In PersonWell okay almost every episodeDavid Friedman October 01, 2024 p span[style*="font-size"] { line-height: 1.6; } This weekend, Saturday Night Live kicked off its 50th season, so I thought I’d share with you an old interview I did with Louis Klein, the SNL superfan who saw nearly every episode in person as a member of the live studio audience, starting with the very first episode. Part of his weekly SNL routine included hanging out with people in the ticket standby line, which is where I met him in 1991. When I had the idea to do this interview with him in 2006, I was happy to see he was still there 15 years later. The last I heard, Louis moved to Colorado in 2016. p span[style*="font-size"] { line-height: 1.6; } Here is the interview from 2006 on the evening of his 528th show. Louis Klein outside 30 Rock p span[style*="font-size"] { line-height: 1.6; } When Saturday Night Live started, nobody knew it was going to be a big hit. Why did you go to the first episode of a new show that nobody really knew? p span[style*="font-size"] { line-height: 1.6; } Prior to SNL, I was going to a lot of game shows. Like, I watched the game show called Jackpot, which was done in Studio 8H prior to SNL. It ended its run in the summer of ‘75, hosted by Geoff Edwards. I was also going to the Pyramid. I went to all of them over at TV-15 which doesn’t exist anymore and any game shows that were done here, I went to them also. So I was notorious as far as NBC was concerned. They knew who I was because I went to all the shows. p span[style*="font-size"] { line-height: 1.6; } Then in April of ‘75 I found out that the show SNL was coming up, so I went to the Guest Relations department and said I hear you’re doing this show. They said they want 500 people in 8H, they want to do a show that’s going to be a run-through for sound purposes, they’re going to have an audience for that, and you can float around the building and find somebody who’s going to give out standby tickets. So I come over here right after work, and I found the standby ticket and I got it and I went inside and I stood in line. p span[style*="font-size"] { line-height: 1.6; } I got upstairs. I saw a full fledged comedy routine by George Carlin. I saw a full fledged comedy routine by Billy Crystal. I saw performances by Janis Ian and Billy Preston. I saw comedy by the Not Ready for Prime Time Players including Jon Belushi and Gilda Radner among others. Now that’s three and a quarter hours of pure entertainment for free. And I could come back tomorrow night. And I did. And I got in a second time. I came back the following week and I didn’t get into the second show but I wasn’t going to give up at this point. This is a great thing to do on a Saturday night. I went to the third show, I got in, and in the first 5 years I’ve seen 59 out of 106 [episodes]. p span[style*="font-size"] { line-height: 1.6; } At what point did you realize it was turning into something you were making a regular routine? p span[style*="font-size"] { line-height: 1.6; } I never really thought of it that way at that particular time. It was just something to do on a Saturday night. I just came over. If I got in, I got in. If I didn’t, I went home. p span[style*="font-size"] { line-height: 1.6; } My memory from meeting you 15 years ago was that you had seen every episode live except for a few. But I guess you’ve missed more than that. p span[style*="font-size"] { line-height: 1.6; } In the first 5 years I’d seen 59 out of 106. So I missed 47 shows then. To date I’ve missed I think 83. That means in the last 27 years I’ve missed 36 shows. p span[style*="font-size"] { line-height: 1.6; } How many have you seen? p span[style*="font-size"] { line-height: 1.6; } This is my 528th show. p span[style*="font-size"] { line-height: 1.6; } The original producer, Lorne Michaels, is still with SNL. But he left the show for a few years in the middle. So is there anyone who outnumbers you in the number of shows attended? p span[style*="font-size"] { line-height: 1.6; } Don Pardo. He only missed one year. It was the ‘81 season. p span[style*="font-size"] { line-height: 1.6; } How come after all this time you still have to wait in the Standby Line? Why don’t they just give you season tickets? p span[style*="font-size"] { line-height: 1.6; } They do. I’ve had season tickets since 1990. p span[style*="font-size"] { line-height: 1.6; } But you just enjoy the Standby? p span[style*="font-size"] { line-height: 1.6; } When they gave that to me, they asked me to do Standby anyway, just in case the tickets didn’t come through. So I have the standby tickets to back it up. However I never needed them, and now I just walk in. But I still do standby because I’m helping NBC out watching this, make sure people don’t jump and things like that. It helps them out. If something goes wrong they know that I’ll take care of it. And then I give the details to them later in the evening. If they have to do something about it they’ll do something. p span[style*="font-size"] { line-height: 1.6; } What’s the worst thing you’ve seen go wrong while on standby? p span[style*="font-size"] { line-height: 1.6; } Jumping the line, and having people join the line. That’s a no-no, because basically the people who are joining are jumping the line. Once somebody tried to get me off the line. This was for the Soundgarden and Jim Carrey episode. We were all standing inside because there was nobody out here, and then all of a sudden somebody let me know that somebody was out here and so I came out, and he was standing over by the pole over here, two guys, and I said all the standbys are inside. He said, Oh, I’m sorry. This is where the line is and I’m going to be number one and two. Well I said, No, I’m number one. He says no, we’re going to be number one. And he argued with me all night at this pole. And I was a little perturbed about it because they weren’t really nice about the whole thing. Well when they didn’t take any standbys for the dress rehearsal, these two guys nearly blew their top to NBC. They said, A standby got upstairs! So NBC checked to see if any standby tickets were upstairs, but I went up on my regular ticket. Little did they realize, I went to the party that night! p span[style*="font-size"] { line-height: 1.6; } Do you get to go the after-party often? p span[style*="font-size"] { line-height: 1.6; } Only the season finale, if they ask. Sometimes they do, sometimes they don’t. p span[style*="font-size"] { line-height: 1.6; } When I was here 15 years ago, the line was inside. When did they move it outside? p span[style*="font-size"] { line-height: 1.6; } ‘93. Letterman was still here at the time, and according to what I’ve heard, somebody did damage to the building inside in the mezzanine. So Rockefeller Center said no you can’t be up here anymore, because they have to protect their tenants. And as a result all the lines were put outside. The line started at that time on this side of the building. And then NBC put it on the 50th street side because the Rainbow Room was complaining that we look like homeless people. Now we’re back on this side. We’d love to be inside the building again. They’ve got plenty of room on hand. But that’s not going to happen. p span[style*="font-size"] { line-height: 1.6; } I seem to remember that 15 years ago you told me Tim Kazurinsky mentioned your name during a Weekend Update segment. p span[style*="font-size"] { line-height: 1.6; } No, no. Not Weekend Update. It was in a sketch that he did. The Guru sketch. His name was Havnagootiim Vishnuuerheer [pronounced “havin’-a-good-time wish-you-were-here”]. What he was doing was he was answering Unanswered Questions of the universe. So he invited everybody in the country to write in unanswered questions that they had, and he picked one of mine, and all of a sudden I’m at dress rehearsal and he says, “Louis Klein from Ridgewood New York wants to know, does God wear Pajamas when he sleeps?” p span[style*="font-size"] { line-height: 1.6; } And what was the answer? p span[style*="font-size"] { line-height: 1.6; } The Guru says, “No he doesn’t. All he wears is a t-shirt. and on the t-shirt it says I created the universe and all I got out of it was this lousy t-shirt.” That was a Flip Wilson show in December ‘83. p span[style*="font-size"] { line-height: 1.6; } Did they mention your name on any other episodes? p span[style*="font-size"] { line-height: 1.6; } Yes, they did. And [my wife] Jamie too. This was in April of 2004. Will Ferrel was the host. And he was doing the Pepper Sketch, where Will was putting pepper on Will Forte’s salad. And the character’s name was Dr. Louis something, and his wife Jamie. In honor of my 500th show. p span[style*="font-size"] { line-height: 1.6; } Who was the writer that wrote you into the script? p span[style*="font-size"] { line-height: 1.6; } Will Forte. p span[style*="font-size"] { line-height: 1.6; } Have you seen “Studio 60” and Tina Fey’s new show “30 Rock”? p span[style*="font-size"] { line-height: 1.6; } I have. p span[style*="font-size"] { line-height: 1.6; } What do you think? p span[style*="font-size"] { line-height: 1.6; } They’re both great. p span[style*="font-size"] { line-height: 1.6; } Which do you like better? p span[style*="font-size"] { line-height: 1.6; } Oh I don’t know. I love Tina. I love Tracy [Morgan], too. And I relate more to 30 Rock than I do Studio 60 because of that. But I definitely like both shows. p span[style*="font-size"] { line-height: 1.6; } Do you get to know the SNL cast members? p span[style*="font-size"] { line-height: 1.6; } They all know me. They all come and say Hi. I’ve met most everybody. I was invited to the 25th anniversary show, and I went to that. I had to ask for a ticket, and they said that they already have a ticket for me. I was fairly shocked. p span[style*="font-size"] { line-height: 1.6; } Do you have a favorite season of SNL? Or a least favorite season? p span[style*="font-size"] { line-height: 1.6; } That’s a hard question. A favorite season? You know, I don’t remember what all the hosts and musical guests are, and it’s hard. I love them all. I mean, yes, you’re going to have somebody that doesn’t do too well, especially sports figures. I me'''
