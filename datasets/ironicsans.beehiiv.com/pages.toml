#FFFFFF; } .table-c p { color: #2D2D2D; font-family:'Helvetica',Arial,sans-serif !important; overflow-wrap: break-word; } .table-h { padding:5px; background-color:#F1F1F1; } .table-h p { color: #2A2A2A; font-family:'Trebuchet MS','Lucida Grande',Tahoma,sans-serif !important; overflow-wrap: break-word; } .bh__byline_wrapper { font-size: .875rem; line-height: 1.25rem; vertical-align: middle; justify-content: space-between; display: block; } .bh__byline_social_wrapper { display: flex; margin-top: 0.5rem; align-items: center; } .bh__byline_social_wrapper > * + * { margin-left: 1rem; } @media (min-width: 768px) { .bh__byline_wrapper { display: flex; } .bh__byline_social_wrapper { margin-top: 0rem; } } A Real Huge Voter Fraud Scandal [video]A case that history has swept under the rugDavid Friedman October 29, 2024 p span[style*="font-size"] { line-height: 1.6; } If you were one of my very earliest subscribers, you may recall four years ago in the sixth edition of this newsletter, I wrote about a very real voter fraud case in which 1,697 people were convicted of selling their votes. It was a huge scandal a hundred years ago, but history has pretty much swept it under the rug. p span[style*="font-size"] { line-height: 1.6; } Since voter fraud is once again a hot topic (even though it hardly ever happens today), I have revisited the story as a new video on my YouTube channel. It’s also available to watch on Nebula. p span[style*="font-size"] { line-height: 1.6; } I’m going to let the video speak for itself, so the newsletter is a short one this time. Go watch and let me know what you think. Should this scandal be better remembered, or is it just a weird footnote in history that doesn’t really matter? A Gisnep Update p span[style*="font-size"] { line-height: 1.6; } Last week, I updated Gisnep with the most-requested feature: access to the puzzle archives. So if you missed any days, now you can go back and play the puzzles you missed. Or if you’re new to the game, you can play from the very beginning! There are 83 puzzles as of today. p span[style*="font-size"] { line-height: 1.6; } Your game history is stored in your browser storage, not on the server, so it doesn’t sync across devices or different browsers. At some point I’ll work on a solution for that but at least now you can any play games you missed. p span[style*="font-size"] { line-height: 1.6; } I’ve been keeping track of some of the nice things people have said about Gisnep, so if you still haven’t played, perhaps this sampling of unsolicited recommendations will persuade you: “I do like daily puzzles, and Gisnep is the latest one to catch my eye… a little more challenging than the average Wordle, but it's still easy enough to be a daily challenge while feeling rewarding.” - Tom Scott in his newsletter“One of the new puzzles on my daily mental rotation.” - Ginpeck on Threads“Addicted.” - dannwebb on reddit“A new obsession” - Sarah Manvel on Bluesky“I’ve been hooked on it ever since I discovered it” — Jeff Milner on his website“I'm absolutely obsessed with this game.” - Evie Tron, comment on Beehiiv“My partner just turned me on to Gisnep. It's so sticky and fun and they just opened up their archives so there's about 80 puzzles to date, and I suspect it'll be the next big thing that NYT Games gobbles up for themselves.” - TIffany Leigh on BlueskyAnd also recommended in The Verge’s Installer newsletter p span[style*="font-size"] { line-height: 1.6; } If you have already played, thanks! And if you like it, tell your friends! p span[style*="font-size"] { line-height: 1.6; } That’s it! Short and sweet this week. Unless you watch the video, in which case it’s less short. I guess it depends on whether you intrerpret “short” to mean physical size — the video doesn’t actually add much length to the newsletter — or duration, in which case a video can make even a very short piece into a very long piece. Really, the newsletter’s “length” doesn’t even change regardless of how “long” the video is. Whoa. p span[style*="font-size"] { line-height: 1.6; } Thanks for reading as always. See you next time! p span[style*="font-size"] { line-height: 1.6; } David ReplyNewest firstAdd your commentLoginLogin or Subscribe to participate.'''
