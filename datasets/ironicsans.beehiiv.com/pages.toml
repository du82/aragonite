color); } .bg-wt-tertiary { background-color: var(--wt-tertiary-color); } .text-wt-tertiary { color: var(--wt-tertiary-color); } .border-wt-tertiary { border-color: var(--wt-tertiary-color); } .bg-wt-text-on-tertiary { background-color: var(--wt-text-on-tertiary-color); } .text-wt-text-on-tertiary { color: var(--wt-text-on-tertiary-color); } .border-wt-text-on-tertiary { border-color: var(--wt-text-on-tertiary-color); } .bg-wt-background { background-color: var(--wt-background-color); } .text-wt-background { color: var(--wt-background-color); } .border-wt-background { border-color: var(--wt-background-color); } .bg-wt-text-on-background { background-color: var(--wt-text-on-background-color); } .text-wt-text-on-background { color: var(--wt-text-on-background-color); } .border-wt-text-on-background { border-color: var(--wt-text-on-background-color); } .bg-wt-subscribe-background { background-color: var(--wt-subscribe-background-color); } .text-wt-subscribe-background { color: var(--wt-subscribe-background-color); } .border-wt-subscribe-background { border-color: var(--wt-subscribe-background-color); } .bg-wt-text-on-subscribe-background { background-color: var(--wt-text-on-subscribe-background-color); } .text-wt-text-on-subscribe-background { color: var(--wt-text-on-subscribe-background-color); } .border-wt-text-on-subscribe-background { border-color: var(--wt-text-on-subscribe-background-color); } .rounded-wt { border-radius: var(--wt-border-radius); } .wt-header-font { font-family: var(--wt-header-font); } .wt-body-font { font-family: var(--wt-body-font); } .wt-button-font { font-family: var(--wt-button-font); } input:focus { --tw-ring-color: transparent !important; } li a { word-break: break-word; } @media only screen and (max-width:667px) { .mob-stack { display: block !important; width: 100% !important; } .mob-w-full { width: 100% !important; } } .table-base, .table-c, .table-h { border: 1px solid #C0C0C0; } .table-c { padding:5px; background-color:#FFFFFF; } .table-c p { color: #2D2D2D; font-family:'Helvetica',Arial,sans-serif !important; overflow-wrap: break-word; } .table-h { padding:5px; background-color:#F1F1F1; } .table-h p { color: #2A2A2A; font-family:'Trebuchet MS','Lucida Grande',Tahoma,sans-serif !important; overflow-wrap: break-word; } .bh__byline_wrapper { font-size: .875rem; line-height: 1.25rem; vertical-align: middle; justify-content: space-between; display: block; } .bh__byline_social_wrapper { display: flex; margin-top: 0.5rem; align-items: center; } .bh__byline_social_wrapper > * + * { margin-left: 1rem; } @media (min-width: 768px) { .bh__byline_wrapper { display: flex; } .bh__byline_social_wrapper { margin-top: 0rem; } } I got you these presentsThat’s better than yet another gift guide, right?David Friedman December 12, 2024 p span[style*="font-size"] { line-height: 1.6; } Well, It’s that time of year when every website and your dentist has put together a gift guide, often a sneaky way to use affiliate links under the guise of “content” to earn a little extra end-of-year money. Last year I had an idea to write a newsletter where every single word was an affiliate link to something somehow related to that word. But then I found out that Amazon actually forbids using Amazon affiliate links in an email. Oops. p span[style*="font-size"] { line-height: 1.6; } Well, I don’t know about you, but I’m a little burnt out on gift guides anyway. So I came up with a better idea for this newsletter. p span[style*="font-size"] { line-height: 1.6; } Instead of listing the same expensive stuff you can find listed elsewhere but with my own personal breadcrumb attached so I get a few pennies if you buy it, I decided to get you some presents this year. p span[style*="font-size"] { line-height: 1.6; } Yep, that’s right. The rest of this email is things I picked out for you. No affiliate links. Just stuff I think you might like since you like this newsletter. p span[style*="font-size"] { line-height: 1.6; } Before you get too excited, none of this is physical stuff. We’re talking bits, not atoms. And I didn’t so much pay for them as I did make links to them. So curb your expectations. p span[style*="font-size"] { line-height: 1.6; } Also, um, none of it is wrapped. Sorry. As you scroll, just pretend that revealing an item on-screen is the same as unwrapping something. So are you ready to virtually unwrap some presents? Let’s do it! Since I know you like antique shopping p span[style*="font-size"] { line-height: 1.6; } I got you Guess Me If You Can, a game where you are in a museum where all the artwork is taken from real eBay listings, and you try to guess the prices. It can be played solo or multiplayer. p span[style*="font-size"] { line-height: 1.6; } It was made last week by a two-person team as part of a GameJam with the theme “Everything has a cost.” It’s very impressive for such a small project! p span[style*="font-size"] { line-height: 1.6; } It’s a downloadable game, and since it’s not a formally published app you need to give it permission to run if your OS says it hasn’t be checked for malicious software. I gave it permission, but if you’re concerned then just skip to the next gift. I won’t be offended. Since I know you like music while you drive p span[style*="font-size"] { line-height: 1.6; } I got you Isle of Tune, a web-based combination city-builder and music sequencer, where cars trigger different musical effects. Like this: Since I know you like The X-Files p span[style*="font-size"] { line-height: 1.6; } I got you two mini-seasons of The X-Files that you’ve never seen. And you still won’t see them, because they are audio dramas, so you’ll only hear them. But they star David Duchovny and Gillian Anderson reprising their roles as Mulder and Scully. These stories were released on Audible in 2017, adapted from stories that first appeared in comics. p span[style*="font-size"] { line-height: 1.6; } They’ve since been removed from the Audible catalog so they are no longer available for purchase, but someone has preserved them on YouTube: Since I know you like to solve crimes p span[style*="font-size"] { line-height: 1.6; } I got you Murdle, featuring a new made-up murder mystery every day. You get all the clues, but can you solve the crime? p span[style*="font-size"] { line-height: 1.6; } But that’s just a warmup for your real gift. I actually got you this real unsolved murder from 1910, the case of English actor Thomas Weldon Atherstone who was found dead at the bottom of the stairs in his ex-girlfriend’s backyard. p span[style*="font-size"] { line-height: 1.6; } He had the bad fortune of being murdered the same week as a woman named Cora Crippen. Her case got more attention and was solved (spoiler: her husband did it). But poor Thomas Weldon’s murder remains a mystery. p span[style*="font-size"] { line-height: 1.6; } Here is an article from 1910 with lots of information about the crime. Maybe you can solve it? Since I know you like late night TV p span[style*="font-size"] { line-height: 1.6; } I got you Conan Throwbrien, a weird dice-based game where you play a late night TV show host who has to get a high enough Nielson rating for a special guest to come on. Since I know you sometimes need a confidence booster p span[style*="font-size"] { line-height: 1.6; } I got you the subreddit /r/No_Small_Parts because sometimes it helps to see that future stars had tiny early roles before they got their big breaks. Did he just always look forty?Since I know you like writing p span[style*="font-size"] { line-height: 1.6; } I got you Typatone. As you type, you make music. It’s kinda hard to explain. And I suppose there’s a chance it will make you enjoy writing even less. On second thought, maybe this is more of a white elephant kind of gift. Since I know sometimes you just need to relax p span[style*="font-size"] { line-height: 1.6; } I got you A Soft Murmur, my favorite online background noise generator. Sometimes when I’m stressed, I like to put on a mix of rain, thunder, and waves, but you can mix several other sounds together and create the background audio of your choice. p span[style*="font-size"] { line-height: 1.6; } I once dreamed of putting a dishwasher in my bedroom because it had the most soothing sounds. Now that’s actually a thing. The White Noise app from tmsoft has a dishwasher sound that I actually listen to when I’m having trouble sleeping. Since I know you like weird old movies p span[style*="font-size"] { line-height: 1.6; } I got you Something Weird’s YouTube Channel where they’ve recently been posting full length exploitation films from the 1930s through 1970s. They use the movie title cards as the thumbnails, which makes just looking at the video page an interesting exploration of early movie typography. Since I know you also like less-weird old movies p span[style*="font-size"] { line-height: 1.6; } I got you Classic Cinema Online, a collection of more mainstream movies like Abbott and Costello Meet The Invisible Man, the Jerry Lewis comedy Hook, Line, and Sinker, and the James Stewart classic Mr. Smith Goes to Washington. Videos are embedded mainly from the Internet Archive, with the occasional YouTube video. Since I know you like to laugh p span[style*="font-size"] { line-height: 1.6; } I got you this YouTube search for Norman Gunston. Norman Gunston was an awkward fictional reporter long before characters like Ali G were doing awkward interviews, but unless you’re Australian there’s a good chance you never heard of him. Many of his interviews can be found on YouTube uploaded by different accounts, so a YouTube search is a good way to find a lot of them. p span[style*="font-size"] { line-height: 1.6; } I’ll get you started with this Sally Struthers interview and see if you’re not crying from laughter by the end: Since I know you like classic sit-coms p span[style*="font-size"] { line-height: 1.6; } I got you Fibber McGee and Molly. It’s an old time radio comedy about a married couple. I love old time radio and when I first discovered this one it became a favorite. That link goes to the Internet Archive’s collection of 1,248 episodes. p span[style*="font-size"] { line-height: 1.6; } But I also got you this episode of NewsRadio in which the giving of Fibber McGee and Molly as a Christmas gift is actually part of the plot. p span[style*="font-size"] { line-height: 1.6; } So this “class sit-coms” thing works on multiple levels. Since I know you like vintage ephemera p span[style*="font-size"] { line-height: 1.6; } I got you the David Rumsey Map Collection. It features incredible high resolution scans of maps and globes from around the world. Despite all the maps, I can get lost in this website for hours. Since I know you like word puzzles p span[style*="font-size"] { line-height: 1.6; } I got you Gisnep, the daily quote game I made that I have mentioned in the newsletter several times but I’ll bet this is the time that makes you say “Okay okay I’ll play it already!” p span[style*="font-size"] { line-height: 1.6; } Gisnep has a good number of fans who come back to play every day. But to be completely transparent, the growth has really slowed down recently. So if you’re a person who loves Gisnep, let people know about it. Especially if you’re, I dunno, a huge celebrity with millions of followers and a podcast or something. The game could use that kind of boost. p span[style*="font-size"] { line-height: 1.6; } Aaaaaand that’s it for another newsletter! The best thing about all these gifts is that you can feel free to re-gift them to others while still keeping them for yourself. It’s a holiday miracle. p span[style*="font-size"] { line-height: 1.6; } This is probably the last newsletter for the year, so I wish you all a happy version of whatever particular thing you celebrate, and a great start to the new year. p span[style*="font-size"] { line-height: 1.6; } See you on the other side. And thanks as always for reading! p span[style*="font-size"] { line-height: 1.6; } David ReplyNewest firstAdd your commentLoginLogin or Subscribe to participate.'''
