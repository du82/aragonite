full_description = '''00Ironic SansPostsLet’s Visit Some Alternate Timelines :root { --wt-primary-color: #2C81E5; --wt-text-on-primary-color: #FFFFFF; --wt-secondary-color: #F9FAFB; --wt-text-on-secondary-color: #030712; --wt-tertiary-color: #FFFFFF; --wt-text-on-tertiary-color: #222222; --wt-background-color: #FFFFFF; --wt-text-on-background-color: #222222; --wt-subscribe-background-color: #FFFFFF; --wt-text-on-subscribe-background-color: #222222; --wt-header-font: "Poppins", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,"Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; --wt-body-font: "Open Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; --wt-button-font: "Open Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; --wt-border-radius: 8px } .bg-wt-primary { background-color: var(--wt-primary-color); } .text-wt-primary { color: var(--wt-primary-color); } .border-wt-primary { border-color: var(--wt-primary-color); } .bg-wt-text-on-primary { background-color: var(--wt-text-on-primary-color); } .text-wt-text-on-primary { color: var(--wt-text-on-primary-color); } .border-wt-text-on-primary { border-color: var(--wt-text-on-primary-color); } .bg-wt-secondary { background-color: var(--wt-secondary-color); } .text-wt-secondary { color: var(--wt-secondary-color); } .border-wt-secondary { border-color: var(--wt-secondary-color); } .bg-wt-text-on-secondary { background-color: var(--wt-text-on-secondary-color); } .text-wt-text-on-secondary { color: var(--wt-text-on-secondary-color); } .border-wt-text-on-secondary { border-color: var(--wt-text-on-secondary-color); } .bg-wt-tertiary { background-color: var(--wt-tertiary-color); } .text-wt-tertiary { color: var(--wt-tertiary-color); } .border-wt-tertiary { border-color: var(--wt-tertiary-color); } .bg-wt-text-on-tertiary { background-color: var(--wt-text-on-tertiary-color); } .text-wt-text-on-tertiary { color: var(--wt-text-on-tertiary-color); } .border-wt-text-on-tertiary { border-color: var(--wt-text-on-tertiary-color); } .bg-wt-background { background-color: var(--wt-background-color); } .text-wt-background { color: var(--wt-background-color); } .border-wt-background { border-color: var(--wt-background-color); } .bg-wt-text-on-background { background-color: var(--wt-text-on-background-color); } .text-wt-text-on-background { color: var(--wt-text-on-background-color); } .border-wt-text-on-background { border-color: var(--wt-text-on-background-color); } .bg-wt-subscribe-background { background-color: var(--wt-subscribe-background-color); } .text-wt-subscribe-background { color: var(--wt-subscribe-background-color); } .border-wt-subscribe-background { border-color: var(--wt-subscribe-background-color); } .bg-wt-text-on-subscribe-background { background-color: var(--wt-text-on-subscribe-background-color); } .text-wt-text-on-subscribe-background { color: var(--wt-text-on-subscribe-background-color); } .border-wt-text-on-subscribe-background { border-color: var(--wt-text-on-subscribe-background-color); } .rounded-wt { border-radius: var(--wt-border-radius); } .wt-header-font { font-family: var(--wt-header-font); } .wt-body-font { font-family: var(--wt-body-font); } .wt-button-font { font-family: var(--wt-button-font); } input:focus { --tw-ring-color: transparent !important; } li a { word-break: break-word; } @media only screen and (max-width:667px) { .mob-stack { display: block !important; width: 100% !important; } .mob-w-full { width: 100% !important; } } .table-base, .table-c, .table-h { border: 1px solid #C0C0C0; } .table-c { padding:5px; background-color:#FFFFFF; } .table-c p { color: #2D2D2D; font-family:'Helvetica',Arial,sans-serif !important; overflow-wrap: break-word; } .table-h { padding:5px; background-color:#F1F1F1; } .table-h p { color: #2A2A2A; font-family:'Trebuchet MS','Lucida Grande',Tahoma,sans-serif !important; overflow-wrap: break-word; } .bh__byline_wrapper { font-size: .875rem; line-height: 1.25rem; vertical-align: middle; justify-content: space-between; display: block; } .bh__byline_social_wrapper { display: flex; margin-top: 0.5rem; align-items: center; } .bh__byline_social_wrapper > * + * { margin-left: 1rem; } @media (min-width: 768px) { .bh__byline_wrapper { display: flex; } .bh__byline_social_wrapper { margin-top: 0rem; } } Let’s Visit Some Alternate TimelinesBecause the one we’re in sucks nowDavid Friedman November 12, 2024 p span[style*="font-size"] { line-height: 1.6; } For obvious reasons, we’re in the suckiest timeline now. If only things had gone a different way at some point in the past — if the hanging chads had hung differently, if Howard Dean hadn’t screamed so close to the mic, if someone hadn’t stepped on a particular butterfly — we would be in a totally different reality now. p span[style*="font-size"] { line-height: 1.6; } Each of those events branched us off into a different timeline, and nobody could predict what would come next, just like you couldn’t predict that the rest of this newsletter is about to pivot to a totally unrelated topic. In another timeline, it continues on about the election, but in this timeline it takes a sudden shift to talk about television. p span[style*="font-size"] { line-height: 1.6; } See, there’s a genre of videos that can be found online that always makes me think of alternate timelines: failed TV pilots. p span[style*="font-size"] { line-height: 1.6; } Each time I see a pilot for a TV show that never got picked up, I wonder, but what if it had? p span[style*="font-size"] { line-height: 1.6; } What if Jean Smart, Octavia Spencer and Christopher Lloyd were all in a sitcom about a family medical practice and it became a huge hit everyone talked about? p span[style*="font-size"] { line-height: 1.6; } Or what if Marissa Tomei starred in a sitcom about a literary genius with writer’s block, and everyone loved it? p span[style*="font-size"] { line-height: 1.6; } Maybe comedy’s not your thing. Okay, then. What if Natalie Dormer, Leslie Odum Jr., and Christopher Egan were in a period crime drama set in 1840 Boston where the only person who could possibly solve a series of murders is Edgar Alan Poe? p span[style*="font-size"] { line-height: 1.6; } Or what if Spike Lee directed a show starring Amy Ryan and Bobby Cannavale about a public advocate who’s used to fighting City Hall but when the mayor falls into a coma he suddenly becomes the interim Mayor Of New York? p span[style*="font-size"] { line-height: 1.6; } And how would history have changed if Brian Cox and Katee Sackhoff were in a hit show about a detective forced to work old John Doe cases? I mean, okay, it probably wouldn’t have changed that much, but what if it meant Brian Cox’s career went in a slightly different direction and we never got Succession? p span[style*="font-size"] { line-height: 1.6; } And I have to wonder if Pedro Pascal would have been in the second Wonder Woman movie if the David E. Kelley Wonder Woman TV show pilot he was in had gone anywhere. p span[style*="font-size"] { line-height: 1.6; } Every one of these shows that never got picked up is the start of a counterfactual for me where I try to imagine where the show would have gone, and how that would have changed things. Think of your favorite TV show that had a cultural impact. How would things be different if it had never gotten past the pilot episode? p span[style*="font-size"] { line-height: 1.6; } Back in the 90s, people used to trade videotapes of pilot shows that achieved cult status. Most notable for me was Lookwell, a comedy written by Conan O’Brien and Robert Smigel starring Adam West as a washed up actor who used to play a detective on TV and now imagines himself to be an actual detective. When he’s not teaching acting classes, he uses his terribly outdated skills to go undercover and help the police, who find him more annoying than anything else. It’s one of the funniest things I’ve ever seen, and I still quote it often to this day. p span[style*="font-size"] { line-height: 1.6; } Lookwell finally did air on TV on the now-defunct cable network Trio. They had a series called Brilliant But Cancelled that showed programs that either never made it to air or were cancelled too soon and forgotten. p span[style*="font-size"] { line-height: 1.6; } Another critically-acclaimed pilot that never got picked up but gained a cult following was Heat Vision and Jack, written by Dan Harmon and directed by Ben Stiller, starring Jack Black as an astronaut who develops powers after being bombarded by solar energy, and his sidekick, a talking motorcycle voiced by Owen Wilson. Yes, you read all of that right. p span[style*="font-size"] { line-height: 1.6; } Unaired pilots are a mixed bag. A rare few, like Lookwell, are quite fun. But most of them are passed on for good reason. If you watched more than a minute of that Marisa Tomei example above, you understand why it wasn’t picked up. So watching old pilot episodes is rarely truly great entertainment and more often just a curiosity. p span[style*="font-size"] { line-height: 1.6; } But if you are curious to explore what might have been, here are some places you can go to find a ton of pilot episodes: p span[style*="font-size"] { line-height: 1.6; } /r/RIPilots — There are only about 1,000 members of this subreddit, but it’s always full of surprises, with people posting “unique unaired pilots, weird concepts, original pitches, and shows cancelled before they reached their full potential. Terrifying utter garbage that we are happy didn't make it to air is also allowed.” p span[style*="font-size"] { line-height: 1.6; } TV Pilots Archive — This treasure trove on the Internet Archive has 346 pilot episodes you’ve never seen, from About A Boy based on the Nick Hornby novel, starring Patrick Dempsey, to Zero Effect starring Alan Cumming as detective Daryl Zero. p span[style*="font-size"] { line-height: 1.6; } TV Tunnel Unaired Pilots — Another 72 pilot episodes on the Internet Archive p span[style*="font-size"] { line-height: 1.6; } Media Garage is a YouTube channel that posts a lot of unaired pilots, but I’ve noticed that some of them are unlisted, with links shared on the above-linked subreddit and on their Patreon. p span[style*="font-size"] { line-height: 1.6; } 90sKid is another YouTube channel with a lot of unaired pilots, particularly from an era that may be of interest to, well, 90s kids. p span[style*="font-size"] { line-height: 1.6; } Among all those pilot episodes, you’ll also find shows that did get picked up as a series but were retooled, sometimes with changes to the cast. And that brings me to the TV pilot alternate timeline I guess I most wish we were on. p span[style*="font-size"] { line-height: 1.6; } See, the pilot episode of NewsRadio featured a character who was an electrician named Rick, played by Greg Lee. p span[style*="font-size"] { line-height: 1.6; } After the pilot episode, his character was replaced by a handyman named Joe, played by Joe Rogan. p span[style*="font-size"] { line-height: 1.6; } NewsRadio was a fantastic show. It still holds up. And Joe Rogan was pretty funny on it. But I can’t help but wonder what the timeline looks like where Greg Lee was kept in the role that made Rogan famous. p span[style*="font-size"] { line-height: 1.6; } [It turns out that Cracked wondered the same thing and actually reached out to Greg to ask what he thinks would have happened in that alternate timeline.] p span[style*="font-size"] { line-height: 1.6; } Well, I guess we’re stuck in the timeline we’re in. I have no words of wisdom to help get through it right now. I fluctuate between disbelief that Trump will actually do all the things he said he would (like, logistically, how could you even round up and deport 11 million people?) and concern that he’ll do so much worse things that we haven’t even thought of yet. p span[style*="font-size"] { line-height: 1.6; } I’ll be here with you through it all. But if you need a brief escape, a way to imagine what would have been if things had gone just slightly differently, maybe one of the TV pilots can help you cope for just a little bit. p span[style*="font-size"] { line-height: 1.6; } And if anyone has a copy of the original pilot for Game Of Thrones, let me know. I’m dying to see it. p span[style*="font-size"] { line-height: 1.6; } As always, thanks for reading. See you next time. p span[style*="font-size"] { line-height: 1.6; } David ReplyNewest firstAdd your commentLoginLogin or Subscribe to participate.'''
