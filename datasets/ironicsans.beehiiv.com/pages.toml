ndary-color); } .bg-wt-tertiary { background-color: var(--wt-tertiary-color); } .text-wt-tertiary { color: var(--wt-tertiary-color); } .border-wt-tertiary { border-color: var(--wt-tertiary-color); } .bg-wt-text-on-tertiary { background-color: var(--wt-text-on-tertiary-color); } .text-wt-text-on-tertiary { color: var(--wt-text-on-tertiary-color); } .border-wt-text-on-tertiary { border-color: var(--wt-text-on-tertiary-color); } .bg-wt-background { background-color: var(--wt-background-color); } .text-wt-background { color: var(--wt-background-color); } .border-wt-background { border-color: var(--wt-background-color); } .bg-wt-text-on-background { background-color: var(--wt-text-on-background-color); } .text-wt-text-on-background { color: var(--wt-text-on-background-color); } .border-wt-text-on-background { border-color: var(--wt-text-on-background-color); } .bg-wt-subscribe-background { background-color: var(--wt-subscribe-background-color); } .text-wt-subscribe-background { color: var(--wt-subscribe-background-color); } .border-wt-subscribe-background { border-color: var(--wt-subscribe-background-color); } .bg-wt-text-on-subscribe-background { background-color: var(--wt-text-on-subscribe-background-color); } .text-wt-text-on-subscribe-background { color: var(--wt-text-on-subscribe-background-color); } .border-wt-text-on-subscribe-background { border-color: var(--wt-text-on-subscribe-background-color); } .rounded-wt { border-radius: var(--wt-border-radius); } .wt-header-font { font-family: var(--wt-header-font); } .wt-body-font { font-family: var(--wt-body-font); } .wt-button-font { font-family: var(--wt-button-font); } input:focus { --tw-ring-color: transparent !important; } li a { word-break: break-word; } @media only screen and (max-width:667px) { .mob-stack { display: block !important; width: 100% !important; } .mob-w-full { width: 100% !important; } } .table-base, .table-c, .table-h { border: 1px solid #C0C0C0; } .table-c { padding:5px; background-color:#FFFFFF; } .table-c p { color: #2D2D2D; font-family:'Helvetica',Arial,sans-serif !important; overflow-wrap: break-word; } .table-h { padding:5px; background-color:#F1F1F1; } .table-h p { color: #2A2A2A; font-family:'Trebuchet MS','Lucida Grande',Tahoma,sans-serif !important; overflow-wrap: break-word; } .bh__byline_wrapper { font-size: .875rem; line-height: 1.25rem; vertical-align: middle; justify-content: space-between; display: block; } .bh__byline_social_wrapper { display: flex; margin-top: 0.5rem; align-items: center; } .bh__byline_social_wrapper > * + * { margin-left: 1rem; } @media (min-width: 768px) { .bh__byline_wrapper { display: flex; } .bh__byline_social_wrapper { margin-top: 0rem; } } Weird and Wonderful Filmstrips[beep!] Turn the knob to advance to the next slideDavid Friedman August 20, 2024 p span[style*="font-size"] { line-height: 1.6; } Before we get to today’s topic, I want to remind everyone that I made a new daily word puzzle game called Gisnep! Hundreds of people are playing every day, and I especially thank those who have sent in ideas for improvements, or bugs you’ve run into. An update is in the works that’s going to bring a lot of nice new features. I want to turn those hundreds of daily players into thousands, so if you haven’t played yet, go try it out! p span[style*="font-size"] { line-height: 1.6; } Depending on when you grew up, you may have had filmstrip presentations in school. These were rolls of 35mm film projected one frame at a time onto a screen, accompanied by audio played on a record or cassette. When you heard a beep, some student who was picked to run the projector turned a knob that advanced it to the next frame while the teacher got to take a little break. p span[style*="font-size"] { line-height: 1.6; } Filmstrips were weird and wacky and often cringe-inducing. Some typical examples of the genre include: p span[style*="font-size"] { line-height: 1.6; } “Joe Learns to Keep His Body Clean” p span[style*="font-size"] { line-height: 1.6; } “Working in a Supermarket” p span[style*="font-size"] { line-height: 1.6; } The Scooby Gang in “What is Acne”? p span[style*="font-size"] { line-height: 1.6; } “OK To Say No: The Case For Waiting: Vicky’s Story” p span[style*="font-size"] { line-height: 1.6; } I always wanted to be the kid who got to turn the knob. But eventually, my school got a machine that would advance to the next frame automatically. That wasn’t nearly as fun. p span[style*="font-size"] { line-height: 1.6; } I hadn’t seen old filmstrips in decades, so I was delighted to stumble on a YouTube channel a few years ago called Uncommon Ephemera that was digitizing them and posting them online. The format itself is so nostalgic that it didn’t even matter that most of them were ones I’d never seen. They were all fascinating to look at. p span[style*="font-size"] { line-height: 1.6; } The videos were lovingly done. The film scans were high-resolution and clean. The “advance to the next frame” animation felt just right and brought me back to the fifth grade classroom. p span[style*="font-size"] { line-height: 1.6; } The channel was run by a guy named Mark O’Brien who, as far as he could tell, is the only person preserving these old educational filmstrips. And the work is truly arduous. A lot of old filmstrips are sadly faded and need a lot of restoration work. And the audio tracks need high quality digitization from cassette or records. p span[style*="font-size"] { line-height: 1.6; } Scanning these filmstrips is a labor of love and clearly time consuming. Mark spends several days on each one. And he has thousands of filmstrips to go through. Some of Mark’s thousands of filmstrip rolls p span[style*="font-size"] { line-height: 1.6; } I enjoyed going through his archive. Then suddenly, all the videos on the channel disappeared. Copyright vs Preservation p span[style*="font-size"] { line-height: 1.6; } While most of the companies that created these filmstrips are long gone, it turned out that the assets from one company had been acquired by Scholastic, Inc. They complained to YouTube and the channel got a copyright strike. p span[style*="font-size"] { line-height: 1.6; } A few days later, the channel got a second strike from another company that acquired some music that was heard on a cassette Mark digitized. p span[style*="font-size"] { line-height: 1.6; } On YouTube, if you get three strikes then your channel gets taken down for good. So Mark voluntarily took everything down before YouTube could, and slowly re-uploaded everything to the Internet Archive, where you can find the complete collection today as he continues to scan more filmstrips. p span[style*="font-size"] { line-height: 1.6; } Meanwhile, he has resumed uploading some filmstrips to YouTube to increase their visibility because people aren’t stumbling on them in the Internet Archive the same way people do on YouTube. The Preservation Process p span[style*="font-size"] { line-height: 1.6; } I got curious about how Mark does it, where he gets this old filmstrips, and how he got started. So I reached out to him with a few questions. Here are some of his answers, condensed and edited: p span[style*="font-size"] { line-height: 1.6; } How did you get started?In 2018 I was diagnosed with thyroid cancer after a year or two of excessive fatigue. In that recovery period after the thyroidectomy, I began looking back into filmstrips. I was dismayed, when I looked back into it, that nobody had done any work saving them in all that time. So I was in a place where I couldn’t keep a regular schedule that an employer would justifiably expect from me, but I wasn’t bedridden nor did I just want to sit around and play Xbox for the rest of my life. I’m also on the autism spectrum but too old and the area too devoid of good doctors to get help with that, either. So working out in the real world has always been a struggle for me anyway, where the politics of interacting with your coworkers always reflects more on you than the actual work you’re there to do.Then the pandemic hit, and at least around here, if you didn’t have COVID for that first year or so, you essentially couldn't see a doctor for anything. At some point I had to keep doing this just to stay sane, and almost pretend I was working through the pandemic too, even though I was making no money. p span[style*="font-size"] { line-height: 1.6; } Where do you get the filmstrips?When I started doing this, I was buying filmstrips on eBay and Craigslist when the price was right. Sometimes you’d find somebody who was selling several hundred for $50 or something. In the beginning I needed film that I could just use to create a process for getting it preserved.In 2022 I got a donation from a single collector in Michigan of over 2,000 filmstrips [link goes to unboxing video]. While I am unquestionably grateful, it’s probably going to take me another ten years to get them all scanned. p span[style*="font-size"] { line-height: 1.6; } How do you scan them?Film scanners exist for people in Hollywood. They’re the size of three refrigerators and start at about $700,000. But for the rest of us, we get flatbed scanners that can scan a strip of six 35mm still photos. So I have to scan them on a flatbed scanner - and, as a result, cut them into strips about as long as a film negative.So, as insane as it sounds, that’s the process: Carefully turn the filmstrips into shorter filmstrips, put them in one of those film holders that come with the scanner, and scan them. I’m scanning at effectively 8K, and that takes about three minutes per frame over two passes - the first for the image on the film, and a second pass with infrared light. The second pass results in a map of dust and scratches (even though the film is cleaned first, I there will always be one or two microscopic pieces of dust in the air that will inevitably stick to the film on its way to the scanner, and scratches are permanent) that is used to do some automatic image cleaning before the frame is saved. p span[style*="font-size"] { line-height: 1.6; } Wait, what? He cuts them to scan them? Oh no. That breaks my heart. It pains me to hear. But which is the better option? Let these old filmstrips fade away unpreserved where nobody will ever see them, or digitize them for the future while destroying them in the process? I’m honestly a bit torn. p span[style*="font-size"] { line-height: 1.6; } In my personal life, I’m not precious about my physical things. I think in all those years living in tiny apartments in New York City with no storage space, I came to prefer bits over atoms. So I scanned all my childhood notebooks, papers, etc, that were taking up boxes and filing cabinets and recycled the originals. I’m much more likely to look at an old paper I wrote if I can just find it on my hard drive than if I have to find it in a box. But it’s my stuff and I’m free to make that decision. I’m not sure my grandkids or their kids will care enough to keep my digital archive preserved on future formats, but by then it won’t matter to me anyway. p span[style*="font-size"] { line-height: 1.6; } But film is part of our cultural heritage, and I feel a bit differently about it. So many old movies have been lost to time. And yet in the absence of any other efforts to save the originals, maybe this actually is the best way to preserve them. p span[style*="font-size"] { line-height: 1.6; } At least Mark does keep the originals, although cut up, in case better scanning or restoration methods come up in the future. p span[style*="font-size"] { line-height: 1.6; } What are your favorite filmstrips?I have a few favorites: “The Art of Pantomime in Church” is this weird mashup of clowns and Christians and I have no idea how it even got made. The thesis is that professional clown Randall Bane can teach you how to incorporate pantomime into your church services. I have no dog in this fight, I’m not particularly anti-Christian or even anti-clown, but I literally do not understand how I struggle to get by and yet there was money to produce this thing.The Art of Pantomime in Church“How to Get Gonorrhea” and its counterpart “How to Get Syphilis” are endearingly-cringey STD filmstrips from 1974 and feature insane art and illustrations. That’s the other thing, there’s so much insane hand-drawn art on filmstrips and a lot of it has the potential to be enjoyed both ironically and non-ironically. Artists, illustrators, actors, narrators, and the people who worked on these things were often not credited as they would be in a movie or TV show, and it’s a terrible shame that all this amazing original work is just being lost.How to Get GonorrheaHow to Get SyphilisSpeaking of illustrators, there’s a two-part filmstrip set called “What Do You Do About Rules?” that was illustrated by Gray Morrow, who was co-creator of Marvel Comic’s Man-Thing and creator of the original El Diablo for DC Comics. Nobody knows it exists, even comic book nerds.What Do You Do About Rules?I have a set of 44 Mor'''
