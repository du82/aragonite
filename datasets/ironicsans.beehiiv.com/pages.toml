full_description = '''00Ironic SansPostsThe Found Art of My eBay Folder :root { --wt-primary-color: #2C81E5; --wt-text-on-primary-color: #FFFFFF; --wt-secondary-color: #F9FAFB; --wt-text-on-secondary-color: #030712; --wt-tertiary-color: #FFFFFF; --wt-text-on-tertiary-color: #222222; --wt-background-color: #FFFFFF; --wt-text-on-background-color: #222222; --wt-subscribe-background-color: #FFFFFF; --wt-text-on-subscribe-background-color: #222222; --wt-header-font: "Poppins", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,"Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; --wt-body-font: "Open Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; --wt-button-font: "Open Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; --wt-border-radius: 8px } .bg-wt-primary { background-color: var(--wt-primary-color); } .text-wt-primary { color: var(--wt-primary-color); } .border-wt-primary { border-color: var(--wt-primary-color); } .bg-wt-text-on-primary { background-color: var(--wt-text-on-primary-color); } .text-wt-text-on-primary { color: var(--wt-text-on-primary-color); } .border-wt-text-on-primary { border-color: var(--wt-text-on-primary-color); } .bg-wt-secondary { background-color: var(--wt-secondary-color); } .text-wt-secondary { color: var(--wt-secondary-color); } .border-wt-secondary { border-color: var(--wt-secondary-color); } .bg-wt-text-on-secondary { background-color: var(--wt-text-on-secondary-color); } .text-wt-text-on-secondary { color: var(--wt-text-on-secondary-color); } .border-wt-text-on-secondary { border-color: var(--wt-text-on-secondary-color); } .bg-wt-tertiary { background-color: var(--wt-tertiary-color); } .text-wt-tertiary { color: var(--wt-tertiary-color); } .border-wt-tertiary { border-color: var(--wt-tertiary-color); } .bg-wt-text-on-tertiary { background-color: var(--wt-text-on-tertiary-color); } .text-wt-text-on-tertiary { color: var(--wt-text-on-tertiary-color); } .border-wt-text-on-tertiary { border-color: var(--wt-text-on-tertiary-color); } .bg-wt-background { background-color: var(--wt-background-color); } .text-wt-background { color: var(--wt-background-color); } .border-wt-background { border-color: var(--wt-background-color); } .bg-wt-text-on-background { background-color: var(--wt-text-on-background-color); } .text-wt-text-on-background { color: var(--wt-text-on-background-color); } .border-wt-text-on-background { border-color: var(--wt-text-on-background-color); } .bg-wt-subscribe-background { background-color: var(--wt-subscribe-background-color); } .text-wt-subscribe-background { color: var(--wt-subscribe-background-color); } .border-wt-subscribe-background { border-color: var(--wt-subscribe-background-color); } .bg-wt-text-on-subscribe-background { background-color: var(--wt-text-on-subscribe-background-color); } .text-wt-text-on-subscribe-background { color: var(--wt-text-on-subscribe-background-color); } .border-wt-text-on-subscribe-background { border-color: var(--wt-text-on-subscribe-background-color); } .rounded-wt { border-radius: var(--wt-border-radius); } .wt-header-font { font-family: var(--wt-header-font); } .wt-body-font { font-family: var(--wt-body-font); } .wt-button-font { font-family: var(--wt-button-font); } input:focus { --tw-ring-color: transparent !important; } li a { word-break: break-word; } @media only screen and (max-width:667px) { .mob-stack { display: block !important; width: 100% !important; } .mob-w-full { width: 100% !important; } } .table-base, .table-c, .table-h { border: 1px solid #C0C0C0; } .table-c { padding:5px; background-color:#FFFFFF; } .table-c p { color: #2D2D2D; font-family:'Helvetica',Arial,sans-serif !important; overflow-wrap: break-word; } .table-h { padding:5px; background-color:#F1F1F1; } .table-h p { color: #2A2A2A; font-family:'Trebuchet MS','Lucida Grande',Tahoma,sans-serif !important; overflow-wrap: break-word; } .bh__byline_wrapper { font-size: .875rem; line-height: 1.25rem; vertical-align: middle; justify-content: space-between; display: block; } .bh__byline_social_wrapper { display: flex; margin-top: 0.5rem; align-items: center; } .bh__byline_social_wrapper > * + * { margin-left: 1rem; } @media (min-width: 768px) { .bh__byline_wrapper { display: flex; } .bh__byline_social_wrapper { margin-top: 0rem; } } The Found Art of My eBay FolderOld auction photos as art exhibitDavid Friedman September 17, 2024 p span[style*="font-size"] { line-height: 1.6; } What do you mean you haven’t played Gisnep yet? Go play it! p span[style*="font-size"] { line-height: 1.6; } Welcome to “Auction Folder,” a temporary pop-up museum of found art that exists only in this one edition of this newsletter. p span[style*="font-size"] { line-height: 1.6; } Ever since Marcel Duchamp placed a urinal on a pedestal and called it art, the question of whether something can be art that was not created as such has intrigued critics and gallery-goers worldwide. Today’s exhibit showcases a selection of photographs that were taken specifically for eBay auctions — and the occasional Craigslist listing. Individually, these ephemeral images may not have aspired to the realm of art, but when viewed collectively, they transcend their origins, forming a cohesive narrative that elevates them into the artistic sphere. Artist’s Statement p span[style*="font-size"] { line-height: 1.6; } I’ve gotten rid of a lot of stuff via Craigslist or eBay over the years. When I list something on Craigslist, I usually take a quick snapshot just so people know what it looks like. But when I list something on eBay, it demands a more thoughtful approach to presentation: a nicer photo. p span[style*="font-size"] { line-height: 1.6; } Maybe it’s because I used to actually work professionally as a photographer for an auction house, but it’s permanently ingrained in me to take a good clean photo for auction listings. p span[style*="font-size"] { line-height: 1.6; } If you were a reader a couple years ago when I found eight of my old Ninja Turtle action figures still in their packaging and sold them on eBay for $1,898, you might remember that I wrote “I photographed [them] from every angle I imagined a potential buyer might want to see.” That’s my old auction house experience at work (and also I suppose a pretty obvious thing to do). Detail from “Donatello-2.jpg” p span[style*="font-size"] { line-height: 1.6; } eBay used to charge extra for having more than one photo on a listing, but they also let you use html in your description. So for a long time, whenever I sold something on eBay, I just put my photos in a folder on my own server and used html to embed them in my auction listing, a loophole to avoid paying eBay per image. p span[style*="font-size"] { line-height: 1.6; } Over many years, that folder accumulated a lot of files and turned into a body of work. Some were individual images. Many were photo montages intended to reduce the amount of embedding I had to do. Individually, they may be just pictures. But seen together, these images transcend their individual purposes and coalesce into an unintended art project—a reflection on material culture, memory, and the fleeting nature of ownership. p span[style*="font-size"] { line-height: 1.6; } Eventually, as eBay allowed multiple photos for free, this folder ceased to grow, its purpose fulfilled. But in its completion, it remains a metaphor for the impermanence of life itself—an unintended art project that, like all things, reached its inevitable conclusion. The Exhibit: A Selection of Images From Auction FolderOriginally purchased at a yard sale in Rhode Island on a road tripI seem to recall there was a hack that let you save raw files with this thingThe cat photobombed my shoot. I wrote “Cat not included” in the listing.I thought the cat in the photos would draw even more people to the auction, but I don’t think it made a difference in the endI got this when I worked on the auction at Christie’s. It was a nice catalog, but it was big and heavy and I never looked at it, which is probably why I got rid of it. I think I ended up getting around 60 bucks for it.This was a much bigger auction catalog than was typicalI got this for free at an event in Union Square where Sirius was promoting the fact that that they just hired Howard Stern by giving away free Sirius stereos. Hearing Howard Stern announce the giveaway and then just walking two blocks from my apartment on a whim to see him in person giving these things away was one of those surreal only-in-New-York events.I had all the games, too. That photo is not part of this exhibit.I still find this stuff hard to look at all these years later. I still have the New York Times from 9/12. I’m not sure why I got rid of these but kept that.It was a cookie jar in the shape of the house from Beetlejuice. I should have kept it. It’s maybe my only regret from this exhibit. But what is art without a little bit of pain?I got the Dreamcast keyboard so I could play Typing Of The DeadI can hear the sound effects when I look at thisI got this specifically for a project that I never actually got around to doing, and finally admitted that to myself by getting rid of the projector. It is the physical manifestation of unrealized aspirations. I should have mentioned that in the listing.I’ve never been able to find much historical information about Solomon The Man Monkey. This poster and another showing him being arrested for drunken disorderly conduct are all I’ve ever found. Anybody know anything about him?This one’s more of a snapshot than a proper setup, but it was in the folder so it’s part of the art exhibit, showing an evolution of the artist’s work over time, natch.This ridiculous kids’ book about Q*bert did not sell. I still have it.But this Q*bert game didSee, kids, there was a time when filters were actual filters. #nofilterIf you know, you know.Okay, if you don’t know: These were 3D LCD games, kinda like a cross between ViewMaster and Game & Watch. They made seven different games. I think the ones I had were a racing game and some kind of space battle.A scan counts as a photo, right? This was the program from an event recreating the concert from the movie A Mighty Wind, featuring all the stars of the movie. It was a lot of fun. I ended up getting $1 for it on eBay.The actual equipment used for the Game Boy Color Photography ProjectDetail photo from a rug listing. Not a slippers listing. p span[style*="font-size"] { line-height: 1.6; } Thank you for visiting today’s exhibit. Please exit through the gift shop. p span[style*="font-size"] { line-height: 1.6; } Wow, I sure got rid of a lot of old video games. At some point in the very early 2000s, I went through a phase buying all the old video games I wanted but never got to have as a kid. Then when I moved in with my now-wife and we had to consolidate all our stuff into a small New York City apartment, a lot of that had to go. p span[style*="font-size"] { line-height: 1.6; } At some point I bought and eventually sold a PXL-2000, which was a toy video camera that used regular audiotapes to store the footage. It was a rare item in that I actually got more when I sold it than I spent to buy it. I’m surprised I don’t still have the photos from that listing. Weird. I wonder what else I’m missing. p span[style*="font-size"] { line-height: 1.6; } Nowadays, most of what I get rid of just goes up on our local neighborhood ListServ. I take a snapshot with my phone and post it. Those photos surely still exist somewhere in my Camera Roll, but it would take a lot of work to go through and find them all. Maybe some day an AI curator will sort through it and put together a new exhibit. p span[style*="font-size"] { line-height: 1.6; } Anyway, that’s it for another newsletter. Thanks as always for reading! And if you know anyone who likes online daily games, share Gisnep with them! p span[style*="font-size"] { line-height: 1.6; } See you next time. p span[style*="font-size"] { line-height: 1.6; } David ReplyNewest firstAdd your commentLoginLogin or Subscribe to participate.'''
