p { color: #2D2D2D; font-family:'Helvetica',Arial,sans-serif !important; overflow-wrap: break-word; } .table-h { padding:5px; background-color:#F1F1F1; } .table-h p { color: #2A2A2A; font-family:'Trebuchet MS','Lucida Grande',Tahoma,sans-serif !important; overflow-wrap: break-word; } .bh__byline_wrapper { font-size: .875rem; line-height: 1.25rem; vertical-align: middle; justify-content: space-between; display: block; } .bh__byline_social_wrapper { display: flex; margin-top: 0.5rem; align-items: center; } .bh__byline_social_wrapper > * + * { margin-left: 1rem; } @media (min-width: 768px) { .bh__byline_wrapper { display: flex; } .bh__byline_social_wrapper { margin-top: 0rem; } } The Company CompanyWe Make Products That Keep You CompanyDavid Friedman October 15, 2024 p span[style*="font-size"] { line-height: 1.6; } I worked for several years as a video producer for a large organization that focuses on issues around aging. I mostly produced short documentaries for them. But I once developed an idea for a weird scripted anthology series, like The Twilight Zone or Black Mirror, that touched on some key issues people face as they age. I never formally pitched it and so it never was even really considered. It would have been a huge undertaking and a big swing for an organization that doesn’t really do this sort of content. But I still think about it sometimes. p span[style*="font-size"] { line-height: 1.6; } The best science fiction reflects society’s hopes and fears, so what better way to prompt people to think about the issues older people face than through science fiction? p span[style*="font-size"] { line-height: 1.6; } I wrote short treatments for four possible episodes. One of them, called “The Company Company,” feels far closer to reality today than when I wrote it in 2018, years before Artificially Intelligent companionship was something people were actually playing around with. It’s also the most fleshed-out of the four treatments. p span[style*="font-size"] { line-height: 1.6; } I present it here, along with the other treatments, for your enjoyment. “The Company Company” p span[style*="font-size"] { line-height: 1.6; } Will Barnes is a lonely 65 year old man. Divorced for several years, he still doesn’t know how to get “out there” again. His online dating hasn’t gone well. But he keeps seeing ads for something called The Company Company. Their slogan is “We make products that keep you company”. And they promise something new: incredibly realistic android companions. p span[style*="font-size"] { line-height: 1.6; } Will knows it wouldn’t be a real relationship, but he’s curious enough. He visits The Company Company’s office park location where he learns how things work. Each customer can lease a lifelike android to become their companion. These aren’t sexbots. They don’t even have the necessary parts for that. And they don’t have feelings. They’re just programmed to be good company. p span[style*="font-size"] { line-height: 1.6; } Will fills out a personal profile, and is introduced to a few androids who have different attributes. They are amazingly realistic and lifelike. He chooses an android named Nancy who is designed to look like a woman around his own age, maybe just a little younger, to take out to dinner. She explains that she doesn’t really eat, being an android and all, but if he wants to go to a restaurant, she’ll chat while he eats. p span[style*="font-size"] { line-height: 1.6; } They have an amazing time. It’s the best conversation he’s had in ages. He feels like his old self again. She makes pop culture references and does a funny Cliff Clavin impression. This intrigues Will and prompts a conversation about how her programming works. Nancy explains that she’s never actually seen Cheers, she’s just programmed with certain high-level knowledge of general topics. p span[style*="font-size"] { line-height: 1.6; } They continue to see each other over several weeks. Nancy tells Will that she doesn’t understand how, but even though she’s programmed to just be a good companion, she thinks she’s actually falling in love with him. Will is on cloud nine. He’s definitely falling for Nancy. p span[style*="font-size"] { line-height: 1.6; } Then Nancy gets a glitch. She’s got something wrong with her shoulder motor that’s limiting her arm movement but she assures Will it’s not a big deal, it’s something easily fixable. The problem is that she’s afraid to tell the Company because they might deactivate her to fix her shoulder, and who knows if she would still love him once she’s reactivated? It’s too big a risk. p span[style*="font-size"] { line-height: 1.6; } But it’s okay, because she knows of rogue roboticist in town that can fix her. It’s just going to cost a little money. Will gladly pays and Nancy gets her shoulder repaired. She is so thankful, she showers Will with kisses when she returns. p span[style*="font-size"] { line-height: 1.6; } But gradually over time, Nancy’s problems get worse, and more expensive to fix. But Will keeps paying. How could he not? p span[style*="font-size"] { line-height: 1.6; } One day Nancy calls Will in a panic. She says that The Company has found out that she’s operating outside her programming, thinks she’s in love, and visited an unauthorized repair shop, and they are going to deactivate her! But they see an opportunity to squeeze him for money, so they’re willing to leave his robot love alone if he pays them a ton of money. But what they’re demanding is more than he can afford. p span[style*="font-size"] { line-height: 1.6; } Out of options, out of money, and madly in love, Will decides to rescue Nancy from The Company. He’s going to break in, get her out, and run away with her. p span[style*="font-size"] { line-height: 1.6; } Will breaks into The Company’s office park location and searches for Nancy. But when he finally finds her, she’s hanging out in the company break room with the other Company employees he met — and they’re all eating take-out food together. p span[style*="font-size"] { line-height: 1.6; } Will realizes that Nancy isn’t an android at all. She’s just a person. This whole time she and The Company Company were just using him for his money. He’d fallen for a high tech version of an old fashioned romance scam. p span[style*="font-size"] { line-height: 1.6; } Age-related Message: Con artists are always updating their scams to take advantage of the latest trends and technology. Be aware of the signs of romance scams in modern dating. “Young” p span[style*="font-size"] { line-height: 1.6; } Gordon Douglas, 62 years old, is at the top of his career. The CEO of a large corporation, he has a happy marriage and a good life. But when he looks in the mirror, he misses his old physique and longs to be young again. p span[style*="font-size"] { line-height: 1.6; } One day, while out to lunch with some other executives, he sees a young man in the restaurant who looks familiar. They catch each other’s eye but don’t speak. As Gordon is leaving the restaurant, the other man comes out, calls his name and catches up with him. p span[style*="font-size"] { line-height: 1.6; } Gordon realizes who it is. This is the son of his old friend Wallace. He looks so much like his dad did at that age! But no, Gordon is wrong. The man explains that he isn’t Wallace’s son. He is Wallace. But that’s impossible. How could he look so young? p span[style*="font-size"] { line-height: 1.6; } Wallace tells Gordon that he underwent a new experimental procedure, a sort of modern fountain of youth. It rolls back the years, leaving you physically as you were when you were younger. He gives Gordon the contact information for the company that does the procedure. p span[style*="font-size"] { line-height: 1.6; } Gordon thinks is over and decides to do it. He goes through with the experimental procedure and comes out looking half his age. He is thrilled. His wife loves her husband’s new look. And his colleagues are impressed. He commands attention in meetings. He has renewed energy in bed. All is good. p span[style*="font-size"] { line-height: 1.6; } But then things slowly start to go wrong. The procedure has a side effect. Along with losing all his wrinkles, Gordon begins to lose the wisdom of experience that came with them. First things begin to fall apart at work, as he makes poor decisions that he should have known better. Then his personal relationships are strained. He acts a lot more immature than his wife has been used to at this point in their marriage. p span[style*="font-size"] { line-height: 1.6; } Gordon realizes what he’s lost and becomes desperate to revert the process and reclaim his true age. p span[style*="font-size"] { line-height: 1.6; } Age-related Message: Age and experience are benefits to be embraced. “When I’m 64” p span[style*="font-size"] { line-height: 1.6; } The year is 2058. Tina Grant is a brilliant scientist with a major problem. 34 years ago, just before she turned 30 years old, she made a discovery that was hailed as the solution the world’s energy problem. But it didn’t turn out that way. What seemed like a panacea accidentally accelerated climate change and now the planet faces imminent doom and it’s largely her fault. p span[style*="font-size"] { line-height: 1.6; } But Tina has a chance to solve this problem. Time travel has recently been discovered. All she has to do is go back in time to 2024 and prevent her younger self from implementing her discovery, and the planet will be saved. p span[style*="font-size"] { line-height: 1.6; } But when she meets her younger self, she realizes that it’s not going to be so easy. Tina forgot that when she was younger, she was incredibly ageist. p span[style*="font-size"] { line-height: 1.6; } Young Tina has no patience for this old woman who knows everything about her and claims to be from the future. Young Tina assumes this lady is crazy, out of touch, and knows nothing, even though she clearly has a lifetime of experience in the sciences. p span[style*="font-size"] { line-height: 1.6; } The fate of the world rests on Old Tina convincing Young Tina to put her ageism aside and work together to save the planet. p span[style*="font-size"] { line-height: 1.6; } Age-related Message: Ageism is the strangest prejudice because it’s against a group you hope to one day be a part of. In a sense, it’s discrimination against your future self — in this case quite literally. And ageism prevents people from learning from each other, collaborating, and benefiting from a multigenerational experience. “Olivia Twist” p span[style*="font-size"] { line-height: 1.6; } On the morning of Olivia Twist’s 60th birthday, she goes to her corner coffee shop like she always does. But even though she’s standing there in line like everyone else, the barista never takes her order. p span[style*="font-size"] { line-height: 1.6; } A slightly older customer, Jackie, sees Olivia’s confusion and leads her over to the end of the counter where people pick up their coffee o'''
