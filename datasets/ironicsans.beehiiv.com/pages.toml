full_description = '''00Ironic SansPostsAn Episode of Bewitched Written By A High School English Class :root { --wt-primary-color: #2C81E5; --wt-text-on-primary-color: #FFFFFF; --wt-secondary-color: #F9FAFB; --wt-text-on-secondary-color: #030712; --wt-tertiary-color: #FFFFFF; --wt-text-on-tertiary-color: #222222; --wt-background-color: #FFFFFF; --wt-text-on-background-color: #222222; --wt-subscribe-background-color: #FFFFFF; --wt-text-on-subscribe-background-color: #222222; --wt-header-font: "Poppins", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,"Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; --wt-body-font: "Open Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; --wt-button-font: "Open Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; --wt-border-radius: 8px } .bg-wt-primary { background-color: var(--wt-primary-color); } .text-wt-primary { color: var(--wt-primary-color); } .border-wt-primary { border-color: var(--wt-primary-color); } .bg-wt-text-on-primary { background-color: var(--wt-text-on-primary-color); } .text-wt-text-on-primary { color: var(--wt-text-on-primary-color); } .border-wt-text-on-primary { border-color: var(--wt-text-on-primary-color); } .bg-wt-secondary { background-color: var(--wt-secondary-color); } .text-wt-secondary { color: var(--wt-secondary-color); } .border-wt-secondary { border-color: var(--wt-secondary-color); } .bg-wt-text-on-secondary { background-color: var(--wt-text-on-secondary-color); } .text-wt-text-on-secondary { color: var(--wt-text-on-secondary-color); } .border-wt-text-on-secondary { border-color: var(--wt-text-on-secondary-color); } .bg-wt-tertiary { background-color: var(--wt-tertiary-color); } .text-wt-tertiary { color: var(--wt-tertiary-color); } .border-wt-tertiary { border-color: var(--wt-tertiary-color); } .bg-wt-text-on-tertiary { background-color: var(--wt-text-on-tertiary-color); } .text-wt-text-on-tertiary { color: var(--wt-text-on-tertiary-color); } .border-wt-text-on-tertiary { border-color: var(--wt-text-on-tertiary-color); } .bg-wt-background { background-color: var(--wt-background-color); } .text-wt-background { color: var(--wt-background-color); } .border-wt-background { border-color: var(--wt-background-color); } .bg-wt-text-on-background { background-color: var(--wt-text-on-background-color); } .text-wt-text-on-background { color: var(--wt-text-on-background-color); } .border-wt-text-on-background { border-color: var(--wt-text-on-background-color); } .bg-wt-subscribe-background { background-color: var(--wt-subscribe-background-color); } .text-wt-subscribe-background { color: var(--wt-subscribe-background-color); } .border-wt-subscribe-background { border-color: var(--wt-subscribe-background-color); } .bg-wt-text-on-subscribe-background { background-color: var(--wt-text-on-subscribe-background-color); } .text-wt-text-on-subscribe-background { color: var(--wt-text-on-subscribe-background-color); } .border-wt-text-on-subscribe-background { border-color: var(--wt-text-on-subscribe-background-color); } .rounded-wt { border-radius: var(--wt-border-radius); } .wt-header-font { font-family: var(--wt-header-font); } .wt-body-font { font-family: var(--wt-body-font); } .wt-button-font { font-family: var(--wt-button-font); } input:focus { --tw-ring-color: transparent !important; } li a { word-break: break-word; } @media only screen and (max-width:667px) { .mob-stack { display: block !important; width: 100% !important; } .mob-w-full { width: 100% !important; } } .table-base, .table-c, .table-h { border: 1px solid #C0C0C0; } .table-c { padding:5px; background-color:#FFFFFF; } .table-c p { color: #2D2D2D; font-family:'Helvetica',Arial,sans-serif !important; overflow-wrap: break-word; } .table-h { padding:5px; background-color:#F1F1F1; } .table-h p { color: #2A2A2A; font-family:'Trebuchet MS','Lucida Grande',Tahoma,sans-serif !important; overflow-wrap: break-word; } .bh__byline_wrapper { font-size: .875rem; line-height: 1.25rem; vertical-align: middle; justify-content: space-between; display: block; } .bh__byline_social_wrapper { display: flex; margin-top: 0.5rem; align-items: center; } .bh__byline_social_wrapper > * + * { margin-left: 1rem; } @media (min-width: 768px) { .bh__byline_wrapper { display: flex; } .bh__byline_social_wrapper { margin-top: 0rem; } } An Episode of Bewitched Written By A High School English ClassAnd a bunch of other things to look atDavid Friedman February 25, 2025 p span[style*="font-size"] { line-height: 1.6; } This week, I bring you a variety of Things To Look At. p span[style*="font-size"] { line-height: 1.6; } So without further ado, look at these: Look At An Episode of Bewitched That Was Written By A High School English Class p span[style*="font-size"] { line-height: 1.6; } Think back. Do you remember that there was an episode of Bewitched that had Darren and Tabitha in blackface? It was a special episode about race, and was written by a class of Black students at a South Los Angeles high school where most kids were reading and writing below grade level — many at a third grade reading level. p span[style*="font-size"] { line-height: 1.6; } Knowing how much kids like TV, their teacher was inspired to reach out to several TV producers to see if they could work together on a project to motivate the kids. Only Bewitched responded. The kids were invited to Hollywood to visit the set, and the new relationship eventually culminated in this episode written mainly by the students. They all got to see their names on TV with a “Story by” credit. p span[style*="font-size"] { line-height: 1.6; } The episode received a special award at the 1971 Emmys, and was recently posted on YouTube by the official Bewitched channel. You can learn more about the story behind this episode on Wikipedia. One of three “Story by” credit screens needed to fit all 26 namesLook At Strange Nicolas Cage Items You Can Buy On Etsy For Some Reason p span[style*="font-size"] { line-height: 1.6; } Why is Etsy so obsessed with Nicolas Cage? Sell enough of these and your 3D printer pays for itselfCan’t believe they didn’t go with Duckolas CageOkay, this one’s actually pretty goodLook At A Dance Competition Held In VR p span[style*="font-size"] { line-height: 1.6; } I had no idea this was a thing. Look At A Free Zen Driving Simulator p span[style*="font-size"] { line-height: 1.6; } It’s called “Slow Roads” and you can play it in your browser for free! p span[style*="font-size"] { line-height: 1.6; } You can even go for a drive on Mars: Look At Every Advertisement in Times Square on January 20, 2007 p span[style*="font-size"] { line-height: 1.6; } One day in 2007, I found myself in Times Square with time to kill and camera in hand. For the purposes of this gallery, flashy store signs are also advertisements. You can see all these images in higher resolution on Flickr. Look At Your Parents’ Pantry p span[style*="font-size"] { line-height: 1.6; } I don’t have a picture of your parents’ pantry to post here. That would be creepy if I did. I’m just suggesting you go look at it. Before you do, try to guess what the oldest expiration date is that you’ll find. Then see if you can find something even older than that. p span[style*="font-size"] { line-height: 1.6; } This should be a TikTok trend. p span[style*="font-size"] { line-height: 1.6; } Wait, is it already a TikTok trend? Look At Eefing and Hambone p span[style*="font-size"] { line-height: 1.6; } I wish there were better quality clips of Riddle and Phelps on YouTube, but this is the best I could find. Still worth looking at. Look At Ike & Tina Turner Album Covers p span[style*="font-size"] { line-height: 1.6; } Tina Turner was awesome. Ike Turner was an asshole. Together they made great music. And they had some incredible album covers. It’s hard to praise the talent here without seeming like I’m also praising the work of an abusive prick, so this should be taken as recognition of Tina Turner specifically, and for the album designers, artists, and photographers who made these things awesome despite Ike. Wikipedia says the artist is Mike Salisbury but I suspect he was just the art director and not the actual artist. Anyone know for sure who painted this?Check out those fonts p span[style*="font-size"] { line-height: 1.6; } Those last two provocative images are the front and back of the album Outta Season and here’s a little context from Wikipedia: The art direction was by Tom Wilkes and photography by Barry Feinstein. As a sarcastic statement, Amos and Andy are credited for the design & photography on the album due to the history of the characters being portrayed by white actors wearing blackface.The album cover features the Turners (Ike on the front and Tina on the back) in whiteface eating watermelon. Due to the white audiences' interest in blues music in the 1960s, music critic Pete Johnson noted that the Turners are "pictured in whiteface eating big slices of watermelon each winking broadly at any young record buyers who might suspect that black people can't sing the blues." p span[style*="font-size"] { line-height: 1.6; } Wow, I didn’t mean to start and end this newsletter with topics about race. That turned out a bit heavier than I was going for. Still, those are definitely things you should look at, so they fit the theme. p span[style*="font-size"] { line-height: 1.6; } And that’s it for another edition of the newsletter. I wouldn’t deign to remind you that you can upgrade to a paid membership to this newsletter. I’ll save such a plea for next time when I actually have a pretty important post planned. p span[style*="font-size"] { line-height: 1.6; } Until then, thanks as always for reading! p span[style*="font-size"] { line-height: 1.6; } David ReplyNewest firstAdd your commentLoginLogin or Subscribe to participate.'''
