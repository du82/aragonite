ary-color); } .bg-wt-tertiary { background-color: var(--wt-tertiary-color); } .text-wt-tertiary { color: var(--wt-tertiary-color); } .border-wt-tertiary { border-color: var(--wt-tertiary-color); } .bg-wt-text-on-tertiary { background-color: var(--wt-text-on-tertiary-color); } .text-wt-text-on-tertiary { color: var(--wt-text-on-tertiary-color); } .border-wt-text-on-tertiary { border-color: var(--wt-text-on-tertiary-color); } .bg-wt-background { background-color: var(--wt-background-color); } .text-wt-background { color: var(--wt-background-color); } .border-wt-background { border-color: var(--wt-background-color); } .bg-wt-text-on-background { background-color: var(--wt-text-on-background-color); } .text-wt-text-on-background { color: var(--wt-text-on-background-color); } .border-wt-text-on-background { border-color: var(--wt-text-on-background-color); } .bg-wt-subscribe-background { background-color: var(--wt-subscribe-background-color); } .text-wt-subscribe-background { color: var(--wt-subscribe-background-color); } .border-wt-subscribe-background { border-color: var(--wt-subscribe-background-color); } .bg-wt-text-on-subscribe-background { background-color: var(--wt-text-on-subscribe-background-color); } .text-wt-text-on-subscribe-background { color: var(--wt-text-on-subscribe-background-color); } .border-wt-text-on-subscribe-background { border-color: var(--wt-text-on-subscribe-background-color); } .rounded-wt { border-radius: var(--wt-border-radius); } .wt-header-font { font-family: var(--wt-header-font); } .wt-body-font { font-family: var(--wt-body-font); } .wt-button-font { font-family: var(--wt-button-font); } input:focus { --tw-ring-color: transparent !important; } li a { word-break: break-word; } @media only screen and (max-width:667px) { .mob-stack { display: block !important; width: 100% !important; } .mob-w-full { width: 100% !important; } } .table-base, .table-c, .table-h { border: 1px solid #C0C0C0; } .table-c { padding:5px; background-color:#FFFFFF; } .table-c p { color: #2D2D2D; font-family:'Helvetica',Arial,sans-serif !important; overflow-wrap: break-word; } .table-h { padding:5px; background-color:#F1F1F1; } .table-h p { color: #2A2A2A; font-family:'Trebuchet MS','Lucida Grande',Tahoma,sans-serif !important; overflow-wrap: break-word; } .bh__byline_wrapper { font-size: .875rem; line-height: 1.25rem; vertical-align: middle; justify-content: space-between; display: block; } .bh__byline_social_wrapper { display: flex; margin-top: 0.5rem; align-items: center; } .bh__byline_social_wrapper > * + * { margin-left: 1rem; } @media (min-width: 768px) { .bh__byline_wrapper { display: flex; } .bh__byline_social_wrapper { margin-top: 0rem; } } Timothy Leary’s Missing BookAnd other auction house stories featuring Madonna, Neil Armstrong, Picasso, Thomas Jefferson, a Conehead, Bob Dylan, Johannes Gutenberg and a Koch Brother December 15, 2020 p span[style*="font-size"] { line-height: 1.6; } My first photography job after arriving in New York in 1997 was shooting auction catalogs for one of the big auction houses. Now, more than twenty years after I left that job, I still think back on some of the things that passed through my hands. A lot of items went from one private collector to another, and were seldom seen by the public except at auction. p span[style*="font-size"] { line-height: 1.6; } My very first day, I saw a Picasso sitting in a bin waiting to be photographed. “Oh, wow!” I thought. “I can’t believe I’m this close to a Picasso!” By the time I left, my perspective had changed considerably. I knew it was time to quit when I thought, “Oh, great. Another Picasso.” p span[style*="font-size"] { line-height: 1.6; } Shooting catalogs meant that I worked with every department in the auction house, so I handled fine art, movie memorabilia, historical documents, ancient artifacts, and learned from the experts how to identify porcelain maker’s marks, spot signs of repaired damage on paintings, etc. It was quite an experience, and I got some good stories out of it. p span[style*="font-size"] { line-height: 1.6; } Some of these are the kinds of stories that might get people in mild trouble, so for the sake of plausible deniability I’ll just say that my memory of events 20+ years ago may be imperfect, and things may not have happened exactly as I remember them. With that caveat: Timothy Leary’s Missing Book p span[style*="font-size"] { line-height: 1.6; } Not long after Timothy Leary died, some of his belongings were sold through the auction house. The sale included a few unique items, plus things that weren’t really all that important except for the fact that he owned them, like a book by comedian Don Novello. All the items came to the studio in bins, were photographed for the catalog, and then returned to the department handling the sale. Or so we thought. p span[style*="font-size"] { line-height: 1.6; } At some point, a good six months after the sale took place, we found the Don Novello book in a drawer in the studio. Somehow it hadn’t made its way back with the rest of the lot and never went up for sale. I don’t remember the pop memorabilia department ever saying there was an item missing, and I don’t think anybody ever told them we found the book. So it just sat in the drawer. Occasionally someone would pull it out to read on their lunch break. For all I know, it’s still there. Mark McGwire’s Baseball p span[style*="font-size"] { line-height: 1.6; } During this time, Mark McGwire was in the middle of his home run streak, and his 50th home run ball came through to be auctioned. We may have casually tossed the ball around the studio that day. And then it sold for $46,000. Madonna’s Diary p span[style*="font-size"] { line-height: 1.6; } There was an entertainment memorabilia auction where one of the items for sale was an old day planner that belonged to Madonna. It had appointments written in like “Christmas with Sean’s family” which must have meant Sean Penn, and “Call Mike and Robin” — which I assumed meant Mike Tyson and Robin Givens — with a phone number. It was full of famous people’s private details. And I remember “work out” was written in every day. I really couldn’t fathom how Madonna’s day planner came to be in someone’s private possession. Maybe it was stolen or fake? Or maybe it wasn’t really hers, but an assistant’s? Sure enough, for some reason, the item was pulled from the sale. I don’t know what the story was there, but I’ve always been curious. The Shattered Chandelier p span[style*="font-size"] { line-height: 1.6; } Photographing crystal chandeliers was annoying because once we got them set up, we had to wait a bit for them to stop moving before we could photograph them. There was a photographer who had a brilliant idea: at the end of the workday, he would hang up a chandelier for the next morning. Then when he comes in, all he would need to do is tiptoe into the studio so he doesn’t create a breeze, turn on the studio lights, and take the first picture of the day. But overnight, the weight of the chandelier was too much for the hook it was hanging on. So when he arrived the next day, he found the chandelier shattered on the floor in pieces. The Time I Broke A Picasso p span[style*="font-size"] { line-height: 1.6; } The only thing that ever broke under my watch was a ceramic plate made by Picasso. It was from late in his career when he was selling “multiples” — limited editions of physical objects where he made one original, and then copies were made which he just signed. So it wasn’t one-of-a-kind, and the estimate on the plate was “only” around $5,000 - 7,000. Since it didn’t merit a photo on its own, I photographed it in a group with several other plates propped upright on a large table-top set. Right after I took the photo, the Picasso plate came loose and shattered onto the ground. p span[style*="font-size"] { line-height: 1.6; } I felt terrible about it. I had seen some things break and get repaired with impressive results, but this was far beyond repair. The department that handled it said not to worry; that’s what insurance was for. By definition, since it was up for auction, the person who owned it didn’t want it anymore, and insurance would pay the mean on the estimate. All that was left was to clean up the debris. I gathered the big pieces and returned them to the department. p span[style*="font-size"] { line-height: 1.6; } Then I swept up the remaining pebble-size pieces which I keep in a Ziploc bag labeled “My Picasso”. I Got Yelled At By The Met p span[style*="font-size"] { line-height: 1.6; } All of the photographers received art handling training, and we took that part of the job very seriously (except when it came to baseballs, I suppose). We were touching fine art every day, but it quickly stopped feeling like a big deal. It was just part of the job. Psychologically, it helped not to think of something as a multi-million dollar piece of art and just think of it as an object to handle with care. p span[style*="font-size"] { line-height: 1.6; } There was a particular kinetic sculpture by George Rickey that was perhaps ten feet tall. It arrived disassembled and we had to put it together. It was intended to be installed outdoors and had large panels that would move in the wind. I spent some time moving the panels into their most aesthetic position for the photo, and it looked pretty nice, but not as cool as it looked in motion. p span[style*="font-size"] { line-height: 1.6; } Around a year later, I was at the Metropolitan Museum of Art with a friend. And wouldn’t you know it, there was the exact same sculpture on an outdoor terrace! Perhaps whoever bought it had loaned it to the Museum, or it might have been a very similar piece by the same artist. But sadly, there was no breeze that day and it remained still. p span[style*="font-size"] { line-height: 1.6; } I tried to explain to my friend how cool the piece was when it’s moving. “Here,” I said, “let me show you” and, forgetting for a moment where I was, I gave the panels a push to get it moving. p span[style*="font-size"] { line-height: 1.6; } Immediately, security was on top of me. What do you think you’re doing? Why would you touch the art at a museum!? I was so embarrassed. What could I say? “You don’t understand, just a year ago I was taking this out of a box and putting it together” didn’t seem like the right answer. I apologized profusely and left quickly. Neil Armstrong’s Space Suit p span[style*="font-size"] { line-height: 1.6; } One of my favorite sales was a space memorabilia auction, and one of the star items of the sale was Neil Armstrong’s A5L Apollo spacesuit. It wasn’t the suit he wore on the moon (that one’s at the Smithsonian) but it was used for training. p span[style*="font-size"] { line-height: 1.6; } The department handling the sale needed the suit photographed first so they could use the photo to begin promoting the sale. So they dropped off the suit in the studio and said they’d come pick it up the next day. p span[style*="font-size"] { line-height: 1.6; } And, friends, it’s entirely possible that several people in the studio tried on Neil Armstrong’s space suit that day. p span[style*="font-size"] { line-height: 1.6; } It sold for $178,000. Thomas Jefferson’s Wine That Wasn’t p span[style*="font-size"] { line-height: 1.6; } Not every shoot happened in the studio. Sometimes we would go to the home of some wealthy individual with a large collection and photograph their items there. And that’s how I found myself in the wine cellar of one of the Koch brothers. p span[style*="font-size"] { line-height: 1.6; } The Koch brothers you think of first are probably Charles and David, who fund a lot of conservative causes. But they have two other brothers, and this wine cellar belonged to Bill Koch. p span[style*="font-size"] { line-height: 1.6; } Bill Koch is a businessman and a sailor. He won the America’s Cup race in 1992 and a few years later sponsored an all-women sailing team. I visited his wine cellar in Martha’s Vineyard. The room adjacent to the wine cellar was designed to look as though you were inside a boat; it even had porthole windows with fake daylight behind them, even though it’s underground. It was weird. p span[style*="font-size"] { line-height: 1.6; } Mr. Koch wasn’t there that day, and I worked with his wine cellar staff. I photographed some of the bottles that would be going up for sale, and I took some photos of his wine cellar. p span[style*="font-size"] { line-height: 1.6; } Way in the background, almost in the center of the photo, there are four bottles of wine that are lying down with their bottoms facing the camera. Those bottles, the wine staff told me, belonged to Thomas Jefferson. p span[style*="font-size"] { line-height: 1.6; } The Jefferson wines were among the most expensive bottles of wine ever sold, and Bill Koch had four of them. p span[style*="font-size"] { line-height: 1.6; } The single most expensive wine bottle ever sold was a Jefferson wine'''
