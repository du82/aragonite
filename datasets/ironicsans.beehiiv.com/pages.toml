full_description = '''00Ironic SansPostsThe Voter Fraud That Time Forgot :root { --wt-primary-color: #2C81E5; --wt-text-on-primary-color: #FFFFFF; --wt-secondary-color: #F9FAFB; --wt-text-on-secondary-color: #030712; --wt-tertiary-color: #FFFFFF; --wt-text-on-tertiary-color: #222222; --wt-background-color: #FFFFFF; --wt-text-on-background-color: #222222; --wt-subscribe-background-color: #FFFFFF; --wt-text-on-subscribe-background-color: #222222; --wt-header-font: "Poppins", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,"Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; --wt-body-font: "Open Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; --wt-button-font: "Open Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; --wt-border-radius: 8px } .bg-wt-primary { background-color: var(--wt-primary-color); } .text-wt-primary { color: var(--wt-primary-color); } .border-wt-primary { border-color: var(--wt-primary-color); } .bg-wt-text-on-primary { background-color: var(--wt-text-on-primary-color); } .text-wt-text-on-primary { color: var(--wt-text-on-primary-color); } .border-wt-text-on-primary { border-color: var(--wt-text-on-primary-color); } .bg-wt-secondary { background-color: var(--wt-secondary-color); } .text-wt-secondary { color: var(--wt-secondary-color); } .border-wt-secondary { border-color: var(--wt-secondary-color); } .bg-wt-text-on-secondary { background-color: var(--wt-text-on-secondary-color); } .text-wt-text-on-secondary { color: var(--wt-text-on-secondary-color); } .border-wt-text-on-secondary { border-color: var(--wt-text-on-secondary-color); } .bg-wt-tertiary { background-color: var(--wt-tertiary-color); } .text-wt-tertiary { color: var(--wt-tertiary-color); } .border-wt-tertiary { border-color: var(--wt-tertiary-color); } .bg-wt-text-on-tertiary { background-color: var(--wt-text-on-tertiary-color); } .text-wt-text-on-tertiary { color: var(--wt-text-on-tertiary-color); } .border-wt-text-on-tertiary { border-color: var(--wt-text-on-tertiary-color); } .bg-wt-background { background-color: var(--wt-background-color); } .text-wt-background { color: var(--wt-background-color); } .border-wt-background { border-color: var(--wt-background-color); } .bg-wt-text-on-background { background-color: var(--wt-text-on-background-color); } .text-wt-text-on-background { color: var(--wt-text-on-background-color); } .border-wt-text-on-background { border-color: var(--wt-text-on-background-color); } .bg-wt-subscribe-background { background-color: var(--wt-subscribe-background-color); } .text-wt-subscribe-background { color: var(--wt-subscribe-background-color); } .border-wt-subscribe-background { border-color: var(--wt-subscribe-background-color); } .bg-wt-text-on-subscribe-background { background-color: var(--wt-text-on-subscribe-background-color); } .text-wt-text-on-subscribe-background { color: var(--wt-text-on-subscribe-background-color); } .border-wt-text-on-subscribe-background { border-color: var(--wt-text-on-subscribe-background-color); } .rounded-wt { border-radius: var(--wt-border-radius); } .wt-header-font { font-family: var(--wt-header-font); } .wt-body-font { font-family: var(--wt-body-font); } .wt-button-font { font-family: var(--wt-button-font); } input:focus { --tw-ring-color: transparent !important; } li a { word-break: break-word; } @media only screen and (max-width:667px) { .mob-stack { display: block !important; width: 100% !important; } .mob-w-full { width: 100% !important; } } .table-base, .table-c, .table-h { border: 1px solid #C0C0C0; } .table-c { padding:5px; background-color:#FFFFFF; } .table-c p { color: #2D2D2D; font-family:'Helvetica',Arial,sans-serif !important; overflow-wrap: break-word; } .table-h { padding:5px; background-color:#F1F1F1; } .table-h p { color: #2A2A2A; font-family:'Trebuchet MS','Lucida Grande',Tahoma,sans-serif !important; overflow-wrap: break-word; } .bh__byline_wrapper { font-size: .875rem; line-height: 1.25rem; vertical-align: middle; justify-content: space-between; display: block; } .bh__byline_social_wrapper { display: flex; margin-top: 0.5rem; align-items: center; } .bh__byline_social_wrapper > * + * { margin-left: 1rem; } @media (min-width: 768px) { .bh__byline_wrapper { display: flex; } .bh__byline_social_wrapper { margin-top: 0rem; } } The Voter Fraud That Time ForgotThe true story of a huge scandal that nobody remembers. October 13, 2020 p span[style*="font-size"] { line-height: 1.6; } The kind of voter fraud Donald Trump pretend-warns people about doesn’t really happen. (But you knew that, of course). However, there was once a voter fraud scandal in the United States so large that when it was all over, 1,679 people were convicted. It was a national story, covered by publications from the New York Times to Cosmopolitan. So why have you never heard about this? Because it happened more than 100 years ago and has rarely been mentioned since. p span[style*="font-size"] { line-height: 1.6; } The story takes place in Adams County, Ohio, where election season was an open market and votes were sold to whichever candidate would pay the most. Buying a vote could cost anywhere from a drink of whiskey to $25, with most people pricing their votes somewhere in between. And the money flowed. (So, presumably, did the whiskey). In 1887, for example, two politicians spent $30,000 between them — nearly $820,000 in today’s dollars — buying votes for their party in Adams County. p span[style*="font-size"] { line-height: 1.6; } When I say “open market,” I really mean it. The people of Adams County would literally stand on a soap box in front of the court house declaring their votes available to the highest bidder. In the early years of vote-buying, politicians and their agents would distribute cash in exchange for just a promise of a vote. Eventually things became more sophisticated so that after the sale, a voter would go into the voting booth and then show their ballot to a judge. The judge would verify the vote and give a signal for a worker to pay the man. p span[style*="font-size"] { line-height: 1.6; } And of course it was always a man because women couldn’t vote. By some accounts, the women of Adams County were opposed to the practice of vote-selling from the beginning. But there are stories of women who still got involved. Mothers sold the votes of sons and husbands. Sisters sold their brothers’ votes. It was fun for the whole family! p span[style*="font-size"] { line-height: 1.6; } Young men growing up in Adams County eagerly awaited their 21st birthday so they could sell their vote and make a little money. It was a reliable bit of income you could use to buy yourself something special. And why not? When your father, teacher, doctor, and everyone else has been selling their votes since before you were born, why would you think it’s anything but normal? p span[style*="font-size"] { line-height: 1.6; } This went on for decades. In fact, it was estimated that over thirty years there were only four “honest elections” in Adams County. p span[style*="font-size"] { line-height: 1.6; } Finally, someone developed a conscience. In December, 1910, a local federal judge named A. Z. Blair, who himself had bought votes in the past, decided it was time to put an end to this. So he convened a grand jury. The purpose wasn’t to do any sort of real investigation — everybody knew what was happening — or even to punish anyone too harshly, but just to end this practice for good. p span[style*="font-size"] { line-height: 1.6; } So Judge Blair brought in several hundred of the vote buyers and offered them immunity from prosecution if they would provide the names of all the vote sellers. And then he let word get out that he had a list. p span[style*="font-size"] { line-height: 1.6; } The judge put notices in newspapers announcing that he knew who sold their votes, and indictments would be coming. But if you came in voluntarily and confessed, you would be treated with leniency. p span[style*="font-size"] { line-height: 1.6; } People came to confess by the hundreds. They flocked to the court house in the hope of getting off easy. As the New York Times reported: Some of them walked miles to get to court. Hundreds arrived at a time… They arrived in automobiles, in wagons drawn by horses, mules, and oxen, on horseback and afoot. They were rich and poor, educated and illiterate, laborer and merchant, men with police records and church pewholders…Mrs. Lawrence Furtwanger, 65 years old, walked fifteen miles into town from her home in Turn Creek on behalf of her invalid son and husband. She pleaded guilty for both of them. p span[style*="font-size"] { line-height: 1.6; } The typical sentence was a fine of $25, plus a six month sentence in a workhouse, plus 5 years of disenfranchisement. But the workhouse sentence and $20 of the fine were both suspended, leaving people paying $5 in fines ($136 in today’s dollars) and losing their right to vote for 5 years. p span[style*="font-size"] { line-height: 1.6; } In the end, one fourth of the voting population of Adams County was convicted. p span[style*="font-size"] { line-height: 1.6; } It was controversial that only the vote sellers were punished and not the vote buyers, and Judge Blair received criticism and even threats over this. But he mostly received praise for returning Adams County to a place of honesty. p span[style*="font-size"] { line-height: 1.6; } Theodore Roosevelt had been out of office for about a year at this point and was now associate editor of a magazine called The Outlook. He wrote an editorial in the aftermath of the scandal in which he said (emphasis original): The people are good Americans who went wrong, and then themselves corrected the wrong; and until we, who live in other neighborhoods, ourselves correct the wrongs of our own neighborhoods in similarly resolute fashion, we must make up our minds that they stand well above us when judged by the standards of decent citizenship.Boodling p span[style*="font-size"] { line-height: 1.6; } Your word of the day is boodling. Merriam-Webster defines it as “graft or fraud especially in politics” and it showed up a lot in my research for this story. p span[style*="font-size"] { line-height: 1.6; } This Google ngram shows how use of boodling peaked around the time of this scandal. Use of voter fraud is also shown for comparison: Source Material p span[style*="font-size"] { line-height: 1.6; } Here is the material I drew from for my retelling of the Scandal of Adams County, all from 1910-1911 and all available to read online for free: Seventeen Hundred Rural Vote-Sellers by Judge A. Z. Blair, McClure’s, November, 1911. This is the best article, by the judge himself. A National Lesson from Adams County by Albert Shaw, The American Review of Reviews, February, 1911. This is where most of the photos above came from. The Shame of Ohio by George Creel and Sloane Gordon, Cosmopolitan, October, 1911. The article was part of a 10-part series on corruption and misconduct called “What are you going to do about it?” A County Where Selling Of Votes Is Universal, The New York Times Sunday Magazine, January 15, 1911. A full-page story recapping of all the events to that date. But they had previously run several stories covering the scandal as it unfolded. Applied Good Citizenship by Theodore Roosevelt, The Outlook, November 11, 1911. This article is a response to the judge’s piece for McClure’s linked to above. p span[style*="font-size"] { line-height: 1.6; } I discovered the scandal of Adams County in 2011 while writing Sunday Magazine, a project where I revisited the most interesting articles from the New York Times Sunday Magazine from 100 years ago each week. I’ve since handed the reigns of that project over to journalist and pun champion Jesse Rifkin, who continues it to this day. You should check it out. A New Thing You Should Listen To p span[style*="font-size"] { line-height: 1.6; } In my dreams I make videos as good as Adam Lisagor’s. And one day I hope that my newsletter will be as good as Noah Kalina’s. But one thing I have zero aspirations to ever do is buy all the junk that’s advertised on Instagram just to see how good or bad it is. Luckily, I won’t ever have to because Adam and Noah have teamed up to do exactly that for their new podcast called All Consuming. p span[style*="font-size"] { line-height: 1.6; } Here they are to tell you about it: p span[style*="font-size"] { line-height: 1.6; } That’s it for this week. If you’re new here, check out the archive. Follow me on Twitter. Vote early. And remember: No boodling. p span[style*="font-size"] { line-height: 1.6; } See you next week. p span[style*="font-size"] { line-height: 1.6; } David ReplyNewest firstAdd your commentLoginLogin or Subscribe to participate.'''
