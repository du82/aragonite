full_description = '''00Ironic SansPostsLessons From The Movies :root { --wt-primary-color: #2C81E5; --wt-text-on-primary-color: #FFFFFF; --wt-secondary-color: #F9FAFB; --wt-text-on-secondary-color: #030712; --wt-tertiary-color: #FFFFFF; --wt-text-on-tertiary-color: #222222; --wt-background-color: #FFFFFF; --wt-text-on-background-color: #222222; --wt-subscribe-background-color: #FFFFFF; --wt-text-on-subscribe-background-color: #222222; --wt-header-font: "Poppins", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,"Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; --wt-body-font: "Open Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; --wt-button-font: "Open Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; --wt-border-radius: 8px } .bg-wt-primary { background-color: var(--wt-primary-color); } .text-wt-primary { color: var(--wt-primary-color); } .border-wt-primary { border-color: var(--wt-primary-color); } .bg-wt-text-on-primary { background-color: var(--wt-text-on-primary-color); } .text-wt-text-on-primary { color: var(--wt-text-on-primary-color); } .border-wt-text-on-primary { border-color: var(--wt-text-on-primary-color); } .bg-wt-secondary { background-color: var(--wt-secondary-color); } .text-wt-secondary { color: var(--wt-secondary-color); } .border-wt-secondary { border-color: var(--wt-secondary-color); } .bg-wt-text-on-secondary { background-color: var(--wt-text-on-secondary-color); } .text-wt-text-on-secondary { color: var(--wt-text-on-secondary-color); } .border-wt-text-on-secondary { border-color: var(--wt-text-on-secondary-color); } .bg-wt-tertiary { background-color: var(--wt-tertiary-color); } .text-wt-tertiary { color: var(--wt-tertiary-color); } .border-wt-tertiary { border-color: var(--wt-tertiary-color); } .bg-wt-text-on-tertiary { background-color: var(--wt-text-on-tertiary-color); } .text-wt-text-on-tertiary { color: var(--wt-text-on-tertiary-color); } .border-wt-text-on-tertiary { border-color: var(--wt-text-on-tertiary-color); } .bg-wt-background { background-color: var(--wt-background-color); } .text-wt-background { color: var(--wt-background-color); } .border-wt-background { border-color: var(--wt-background-color); } .bg-wt-text-on-background { background-color: var(--wt-text-on-background-color); } .text-wt-text-on-background { color: var(--wt-text-on-background-color); } .border-wt-text-on-background { border-color: var(--wt-text-on-background-color); } .bg-wt-subscribe-background { background-color: var(--wt-subscribe-background-color); } .text-wt-subscribe-background { color: var(--wt-subscribe-background-color); } .border-wt-subscribe-background { border-color: var(--wt-subscribe-background-color); } .bg-wt-text-on-subscribe-background { background-color: var(--wt-text-on-subscribe-background-color); } .text-wt-text-on-subscribe-background { color: var(--wt-text-on-subscribe-background-color); } .border-wt-text-on-subscribe-background { border-color: var(--wt-text-on-subscribe-background-color); } .rounded-wt { border-radius: var(--wt-border-radius); } .wt-header-font { font-family: var(--wt-header-font); } .wt-body-font { font-family: var(--wt-body-font); } .wt-button-font { font-family: var(--wt-button-font); } input:focus { --tw-ring-color: transparent !important; } li a { word-break: break-word; } @media only screen and (max-width:667px) { .mob-stack { display: block !important; width: 100% !important; } .mob-w-full { width: 100% !important; } } .table-base, .table-c, .table-h { border: 1px solid #C0C0C0; } .table-c { padding:5px; background-color:#FFFFFF; } .table-c p { color: #2D2D2D; font-family:'Helvetica',Arial,sans-serif !important; overflow-wrap: break-word; } .table-h { padding:5px; background-color:#F1F1F1; } .table-h p { color: #2A2A2A; font-family:'Trebuchet MS','Lucida Grande',Tahoma,sans-serif !important; overflow-wrap: break-word; } .bh__byline_wrapper { font-size: .875rem; line-height: 1.25rem; vertical-align: middle; justify-content: space-between; display: block; } .bh__byline_social_wrapper { display: flex; margin-top: 0.5rem; align-items: center; } .bh__byline_social_wrapper > * + * { margin-left: 1rem; } @media (min-width: 768px) { .bh__byline_wrapper { display: flex; } .bh__byline_social_wrapper { margin-top: 0rem; } } Lessons From The MoviesGo to the head of the classDavid Friedman November 26, 2024 p span[style*="font-size"] { line-height: 1.6; } Well, the holiday season is officially here and if you have kids, they probably have at least two days off school this week for Thanksgiving. Then winter break is coming up. With all that time off school, how can you, a responsible parent, sneak extra lessons into their day? By showing them scenes from movies that take place in classrooms, of course! p span[style*="font-size"] { line-height: 1.6; } Okay maybe you don’t have kids. And kids deserve to relax during the holidays. But I needed an introduction to the newsletter. Just go with it. p span[style*="font-size"] { line-height: 1.6; } I’ve rounded up 10 class lessons from movies, grouped by subject. See if you can identify what movie each lesson is from. Answers are at the end. Stable Diffusion / Photoshop p span[style*="font-size"] { line-height: 1.6; } SUBJECT: MATH p span[style*="font-size"] { line-height: 1.6; } 1) “Parenthesis means multiply. Every time you see this, you multiply. A negative times a negative equals a positive. A negative times a negative equals a positive. Say it. A negative times a negative equals a positive.” p span[style*="font-size"] { line-height: 1.6; } SUBJECT: SCIENCE p span[style*="font-size"] { line-height: 1.6; } 2) “The parts of a flower are so constructed that very, very often the wind will cause pollination. If not, then a bee or any other nectar-gathering creature can create the same situation. Yes, anything that gets the pollen to the pistil’s right on the list. I’ll try to make it crystal clear. A flower’s insatiable passion turns its life into a circus of debauchery! Now you see just how the stamen gets its lusty dust on to the stigma and why this frenzied chlorophyllous orgy starts each spring is no enigma. We call this quest for satisfaction a what, class?” p span[style*="font-size"] { line-height: 1.6; } 3) “Archeology is the search for fact. Not truth. If it’s truth you’re interested in, Doctor Tyree’s Philosophy class is right down the hall. So forget any ideas you’ve got about lost cities, exotic travel, and digging up the world. We do not follow maps to buried treasure and X never, ever, marks the spot. Seventy percent of all archaeology is done in the library. Research. Reading.” p span[style*="font-size"] { line-height: 1.6; } 4) “For many days before the end of our Earth, people will look into the night sky and notice a star, increasingly bright and increasingly near. As this star approaches us, the weather will change. The great polar fields of the north and south will rot and divide, and the seas will turn warmer.” p span[style*="font-size"] { line-height: 1.6; } SUBJECT: HISTORY p span[style*="font-size"] { line-height: 1.6; } 5) “You remember that thing we had about 30 years ago called the Korean conflict? And how we failed to achieve victory? How come we didn’t cross the 38th parallel and push those rice-eaters back to the Great Wall of China then take the fucking wall apart brick by brick and nuke them back into the fucking stone age forever? Tell me why! How come? Say it! Say it!” p span[style*="font-size"] { line-height: 1.6; } 6) “Three weeks we’ve been talking about the Platt Amendment. What are you people? On dope? A piece of legislation was introduced into Congress by Senator John Platt. It was passed in 1906. This amendment to our Constitution has a profound impact upon all of our daily lives.” p span[style*="font-size"] { line-height: 1.6; } 7) “In 1930, the Republican-controlled House of Representatives, in an effort to alleviate the effects of the… Anyone? Anyone?… the Great Depression, passed the… Anyone? Anyone? The tariff bill? The Hawley-Smoot Tariff Act? Which, anyone? Raised or lowered?… Raised tariffs, in an effort to collect more revenue for the federal government. Did it work? Anyone? Anyone know the effects? It did not work, and the United States sank deeper into the Great Depression.” p span[style*="font-size"] { line-height: 1.6; } SUBJECT: MUSIC p span[style*="font-size"] { line-height: 1.6; } 8) “In this life, you can’t win. Yeah, you can try, but in the end you’re just gonna lose, big time, because the world is run by the Man. The Man, oh, you don’t know the Man. He’s everywhere. In the White House. Down the hall. Ms. Mullins, she’s the Man. And the Man ruined the ozone, he’s burning down the Amazon, and he kidnapped Shamu and put her in a chlorine tank! And there used to be a way to stick it to the Man. It was called rock ‘n roll, but guess what, oh no, the Man ruined that, too, with a little thing called MTV! So don’t waste your time trying to make anything cool or pure or awesome ‘cause the Man is just gonna call you a fat washed up loser and crush your soul. So do yourselves a favor and just GIVE UP!” p span[style*="font-size"] { line-height: 1.6; } 9) “You can’t dance to Mr. Beethoven. Can you tell me why, Mr. Manfield? Because the Beethoven piece doesn’t use a constant rhythm or tempo. Madonna is 4/4 time all the way through. The melody changes but the rhythm is constant. So you can dance to it. The quartet changes both melodically and rhythmically. I’m going to play them again. Listen for this.” p span[style*="font-size"] { line-height: 1.6; } SUBJECT: LITERATURE p span[style*="font-size"] { line-height: 1.6; } 10) “Excrement. That’s what I think of Mr. J. Evans Pritchard. We’re not laying pipe, we’re talking about poetry. I mean, how can you describe poetry like American Bandstand? I like Byron, I give him a 42, but I can’t dance to it. Now I want you rip out that page. Go on, rip out the entire page. You heard me, rip it out. Rip it out!” p span[style*="font-size"] { line-height: 1.6; } EXTRA CREDIT: PLAYTIME p span[style*="font-size"] { line-height: 1.6; } 11) “Now we’re going to do something extremely fun. We’re going to play a game called ‘Who is my daddy and what does he do?’” p span[style*="font-size"] { line-height: 1.6; } Okay, pencils down. Trade answer sheets with your neighbor to correct each other. Here are the answers: p span[style*="font-size"] { line-height: 1.6; } 1) Stand and Deliver; 2) Grease 2; 3) Indiana Jones and the Last Crusade 4) Rebel Without A Cause; 5) Back to School; 6) Fast Times at Ridgemont High; 7) Ferris Bueller’s Day Off; 8) School of Rock; 9) Running on Empty; 10) Dead Poets Society; 11) Kindergarten Cop p span[style*="font-size"] { line-height: 1.6; } Okay, number four is a bit of a cheat because they were on a field trip and not in a classroom, so if you got that one right give yourself an extra point. p span[style*="font-size"] { line-height: 1.6; } So how’d you do? This was actually a reprint of a post I wrote way back in 2008, which explains why there aren’t any more recent movies quoted, but I stumbled across it the other day and thought it was worth a reshare. It also seemed fitting to me that a few months ago I wrote about filmstrips in classrooms, so now I’d write about classrooms in films. p span[style*="font-size"] { line-height: 1.6; } If you enjoyed that and you like games, have you played my daily puzzle Gisnep? The number of regular daily players went up a bit as people sought out alternative games to play during the recent NY Times puzzle strike. But I’m open to ideas on how to get even more people to discover it! p span[style*="font-size"] { line-height: 1.6; } It’s been a while since I’ve mentioned that you can support this newsletter with a paid subscription or a one-time donation. So I figure I should mention that. p span[style*="font-size"] { line-height: 1.6; } Thanks as always for reading. See you next time! p span[style*="font-size"] { line-height: 1.6; } David ReplyNewest firstAdd your commentLoginLogin or Subscribe to participate.'''
