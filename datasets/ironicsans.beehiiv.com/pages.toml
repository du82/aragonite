full_description = '''00Ironic SansPostsComics That Resemble The Freewheelin’ Bob Dylan Album Cover :root { --wt-primary-color: #2C81E5; --wt-text-on-primary-color: #FFFFFF; --wt-secondary-color: #F9FAFB; --wt-text-on-secondary-color: #030712; --wt-tertiary-color: #FFFFFF; --wt-text-on-tertiary-color: #222222; --wt-background-color: #FFFFFF; --wt-text-on-background-color: #222222; --wt-subscribe-background-color: #FFFFFF; --wt-text-on-subscribe-background-color: #222222; --wt-header-font: "Poppins", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,"Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; --wt-body-font: "Open Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; --wt-button-font: "Open Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; --wt-border-radius: 8px } .bg-wt-primary { background-color: var(--wt-primary-color); } .text-wt-primary { color: var(--wt-primary-color); } .border-wt-primary { border-color: var(--wt-primary-color); } .bg-wt-text-on-primary { background-color: var(--wt-text-on-primary-color); } .text-wt-text-on-primary { color: var(--wt-text-on-primary-color); } .border-wt-text-on-primary { border-color: var(--wt-text-on-primary-color); } .bg-wt-secondary { background-color: var(--wt-secondary-color); } .text-wt-secondary { color: var(--wt-secondary-color); } .border-wt-secondary { border-color: var(--wt-secondary-color); } .bg-wt-text-on-secondary { background-color: var(--wt-text-on-secondary-color); } .text-wt-text-on-secondary { color: var(--wt-text-on-secondary-color); } .border-wt-text-on-secondary { border-color: var(--wt-text-on-secondary-color); } .bg-wt-tertiary { background-color: var(--wt-tertiary-color); } .text-wt-tertiary { color: var(--wt-tertiary-color); } .border-wt-tertiary { border-color: var(--wt-tertiary-color); } .bg-wt-text-on-tertiary { background-color: var(--wt-text-on-tertiary-color); } .text-wt-text-on-tertiary { color: var(--wt-text-on-tertiary-color); } .border-wt-text-on-tertiary { border-color: var(--wt-text-on-tertiary-color); } .bg-wt-background { background-color: var(--wt-background-color); } .text-wt-background { color: var(--wt-background-color); } .border-wt-background { border-color: var(--wt-background-color); } .bg-wt-text-on-background { background-color: var(--wt-text-on-background-color); } .text-wt-text-on-background { color: var(--wt-text-on-background-color); } .border-wt-text-on-background { border-color: var(--wt-text-on-background-color); } .bg-wt-subscribe-background { background-color: var(--wt-subscribe-background-color); } .text-wt-subscribe-background { color: var(--wt-subscribe-background-color); } .border-wt-subscribe-background { border-color: var(--wt-subscribe-background-color); } .bg-wt-text-on-subscribe-background { background-color: var(--wt-text-on-subscribe-background-color); } .text-wt-text-on-subscribe-background { color: var(--wt-text-on-subscribe-background-color); } .border-wt-text-on-subscribe-background { border-color: var(--wt-text-on-subscribe-background-color); } .rounded-wt { border-radius: var(--wt-border-radius); } .wt-header-font { font-family: var(--wt-header-font); } .wt-body-font { font-family: var(--wt-body-font); } .wt-button-font { font-family: var(--wt-button-font); } input:focus { --tw-ring-color: transparent !important; } li a { word-break: break-word; } @media only screen and (max-width:667px) { .mob-stack { display: block !important; width: 100% !important; } .mob-w-full { width: 100% !important; } } .table-base, .table-c, .table-h { border: 1px solid #C0C0C0; } .table-c { padding:5px; background-color:#FFFFFF; } .table-c p { color: #2D2D2D; font-family:'Helvetica',Arial,sans-serif !important; overflow-wrap: break-word; } .table-h { padding:5px; background-color:#F1F1F1; } .table-h p { color: #2A2A2A; font-family:'Trebuchet MS','Lucida Grande',Tahoma,sans-serif !important; overflow-wrap: break-word; } .bh__byline_wrapper { font-size: .875rem; line-height: 1.25rem; vertical-align: middle; justify-content: space-between; display: block; } .bh__byline_social_wrapper { display: flex; margin-top: 0.5rem; align-items: center; } .bh__byline_social_wrapper > * + * { margin-left: 1rem; } @media (min-width: 768px) { .bh__byline_wrapper { display: flex; } .bh__byline_social_wrapper { margin-top: 0rem; } } Comics That Resemble The Freewheelin’ Bob Dylan Album CoverAnd other comic book swipesDavid Friedman February 11, 2025 p span[style*="font-size"] { line-height: 1.6; } This is the iconic cover of Bob Dylan’s 1963 album The Freewheelin’ Bob Dylan featuring Bob and his girlfriend Suze Rotolo: p span[style*="font-size"] { line-height: 1.6; } These are some comic book illustrations that resemble the album cover: Suicide Squad (2017)Daredevil #235 (1986)What If Karen Page Had Lived? (2005)Dos Veces Breve #16 (2008)Giant-Size Fantastic Four #4 (1975)Daredevil #233 (1986)Criminal: The Last of the Innocent (2011) — Although may just be referencing that image above. If an image is referencing a reference, can it be said to be referencing the original?Mister No (2019)Dylan Dog #402 (2020)Martin Mystère Magazine #1 (2022)Teenage Mutant Ninja Turtles #23 (1989) p span[style*="font-size"] { line-height: 1.6; } I pulled these from the Facebook group Comics Swipes, where comics obsessives share instances of when a comic book artist references, makes homage, or sometimes just blatantly copies another artist’s work. p span[style*="font-size"] { line-height: 1.6; } Here’s an example of a comic swipe: p span[style*="font-size"] { line-height: 1.6; } Sometimes a swipe is just a single panel or pose. The Avengers (left) and Dynamite Magazine (right)Fantastic Four #149 (left) and Fantastic Four Annual #5 (right) p span[style*="font-size"] { line-height: 1.6; } Sometimes they copy the layout of a whole page. p span[style*="font-size"] { line-height: 1.6; } And sometimes an artist will even steal from himself! These two pages from different Spider-Man comics are both by Erik Larsen: p span[style*="font-size"] { line-height: 1.6; } One person in the Facebook group commented, “Deadlines are a bitch” to which Erik Larsen himself replied, “It wasn't because of a deadline crunch. I just thought it'd be fun to do.” p span[style*="font-size"] { line-height: 1.6; } Sometimes people share swipes that aren’t from other comics, like in the case of the Bob Dylan album cover, or this panel from Punisher #1 (2011) and the movie Se7en:Punisher #1 (left) and Se7en (right) p span[style*="font-size"] { line-height: 1.6; } Or these panels from Daredevil #501 and frames from, again, the movie Se7en: That top panel almost looks traced from the movie p span[style*="font-size"] { line-height: 1.6; } Sometimes the swiped material would come from magazines. p span[style*="font-size"] { line-height: 1.6; } If you’ve never seen comparisons like these before, you might be wondering how they can get away with that. Artists have always used reference material for poses, expressions, etc, and it’s generally considered fine as long as it’s not to a plagiaristic degree. But it has not always gone very well. Depending on the degree of “copying,” sometimes it is seen as lazy, or as theft. And sometimes it has resulted in legal action. p span[style*="font-size"] { line-height: 1.6; } Here’s an Amy Grant album cover alongside Dr. Strange Sorcerer Supreme #15, which features an obvious reproduction of her face from the cover. p span[style*="font-size"] { line-height: 1.6; } The face here is not meant to be Amy Grant, but Doctor Strange’s girlfriend in the comic. But the album cover photo was clearly used as reference material to a degree that may have gone too far in recreating the original. Amy Grant sued Marvel. She didn’t own the copyright to the original photo, but she sued them for associating her image with Dr. Strange, being that he is a practitioner of the occult and she is a Christian Music artist. She claimed that this association was damaging to her image. They settled out of court. p span[style*="font-size"] { line-height: 1.6; } And speaking of settling things, it’s time I settled this edition of the Ironic Sans newsletter. Thanks as always for reading and — what? You don’t think I should end just yet without plugging my daily online quote game Gisnep that thousands of people are enjoying already, and encouraging people to share it with their friends? I’m not sure I have space left here to do that. Maybe next time. p span[style*="font-size"] { line-height: 1.6; } Until then, thanks as always for reading! p span[style*="font-size"] { line-height: 1.6; } David ReplyNewest firstAdd your commentLoginLogin or Subscribe to participate.'''
