title = "Ironic Sans: January 2007 Archives"
full_description = "Entries for January 2007 January 31, 2007 60 Seconds in the Life of Seagulls Part 21 in an ongoing series of (approximately) 60 second films. For some reason, I just found these two birds fascinating. Posted by David at 12:04 AM | Permalink | Comments (15) Filed under: 60 Seconds January 29, 2007 “Dear Sophina” — An amazing follow-up to “The Astoria Notes” A couple weeks ago, I posted an entry I called The Astoria Notes. It included scans of several notes slipped under my door by my downstairs neighbor in my first apartment in Astoria, Queens, complaining about noise and leaks from my apartment. Her name was Sophina, and if you haven’t read her notes yet you should really check them out. Among the responses I received was an e-mail from Ryan Meehan, an English teacher at Santa Fe High School in Gainesville, Florida. He wrote, “I teach High School English to kids who really struggle with reading. I am always trying to create reading assignments they might actually enjoy. I think your post, and the notes, would be a delightful assignment. Would you mind if I used it for two of my classes?” I gladly gave him permission, and a week or so later I received this response: So your blog went over great with my kids. They are all, for the most part, kids who really struggle academically (especially with reading), so to see them tear through your story with a sense of urgency was extremely rewarding. In addition to the active reading exercises and comprehension questions I had them complete, their final assignment was to write a letter to Sophina. They were to imagine what they would have done were they in your shoes. I brought in my microphone today, and we recorded the responses in Garageband and mixed in a music track as well… Thanks again for granting me permission to use your story. This is my first year teaching high school, and though I’m 6 months in, I felt like this was the first week I really connected with the kids. It’s equal parts touching and surreal. Somewhere out there, a group of high school kids I don’t know wrote letters to my old neighbor, sticking up for me. And they set it to music. Ryan set up a wiki for the class project where he posted the classes’ spoken word performances. Here they are: Period 2 Period 5 Emotional Emotional 5 mins 33 secs 6 mins 37 secs I was a bit taken aback by these, I must confess. The students were much angrier with Sophina than I ever was. But then Ryan followed up by having the students write more respectful letters to Sophina: Period 2 Period 5 Respectful Respectful 6 mins 3 secs 4 mins 45 secs I have to imagine that, in the entire history of neighborly feuds, I’m the first person to get letters to my neighbor recorded by two high school English classes and set to music. It’s too bizarre. I love it. Thanks, Santa Fe High School English periods two and five! Posted by David at 12:20 AM | Permalink | Comments (30) Filed under: Education | New York January 24, 2007 Idea: Paintings of descriptions of the paintings If I had the time, the means, and the resources, I’d make a series of large paintings of those little cards that describe paintings in museums. They would be paintings of the cards that describe themselves. For example, I’d do a painting in oil on canvas that describes itself as being an oil painting on canvas. Then I’d hang it in a gallery next to a little card that’s identical to the painting, but is actually there to describe the painting. I’d do a whole series, with different materials. Oil on canvas, Acrylic on wood, etc. See the photo illustration above for an idea of how it might look. Posted by David at 7:52 AM | Permalink | Comments (39) Filed under: Art | Favorites | Ideas January 23, 2007 Idea: “CNN Fortune Cookie” Greasemonkey script [Note: This entry has been re-written for clarity] You remember when you were a kid, and someone taught you that trick where you add “in bed” to the end of a fortune cookie fortune and hopefully make it funny? So a fortune that says “Your great imagination will serve you well” becomes “Your great imagination will serve you well in bed.” You get the idea. Well, I’ve written a Greasemonkey script that only does one thing: It adds “in bed” to the end of the main headline at CNN.com. Just install it, visit CNN.com, and wait for the entire page to finish loading. Then read the headline. I haven’t decided yet whether or not it’s funny, but it sure amuses me. I call it The CNN Fortune Cookie script. (Link goes to the script). For those who don’t know what Greasemonkey is, here’s the scoop. The Firefox web browser allows people to write plug-ins to make it more useful. One of those plug-ins is called Greasemonkey, which allows people to write short scripts that make specific websites more useful, or slightly changes the web browsing experience, without writing a full plug-in. Greasemonkey doesn’t do anything on its own without a script installed. You can see what kinds of scripts are available by visiting userscripts.org. Some of them are pretty nice. Caveat: I’m not much of a scripter, so I can only hope this works. Posted by David at 10:09 AM | Permalink | Comments (12) Filed under: Ideas | Technology January 22, 2007 Every ad in Times Square [Update: All the photos are now available in larger sizes on flickr.] Sometimes I get dangerous thoughts in my head, like “I wonder what it would look like to see every ad in Times Square all on one page.” So when I knew I’d be passing through Times Square this weekend, I made sure I had my camera. For the purposes of this nearly purposeless project, I considered storefront signs the same as ads if they were flashy and glitzy like Times Square ads tend to be. I’m sure I missed a few, and there may be some I got more than once. I do know that some appear to be duplicates, but are actually similar billboards in different spots. Also, if an ad took up more than one billboard, I usually shot each billboard separately, unless it was a wraparound billboard on a corner, in which case I tried to get it in one shot. So without further ado, here is every ad in Times Square. More or less. Right now, you’re probably thinking one of two things. Either you’re thinking, “Does that ad really say that there’s a musical version of Legally Blonde coming to Broadway?” or you’re thinking, “Someone has too much time on his hands.” Well, I can tell you, it took about 20 minutes to take the photos, and about 2 or 3 hours to crop the images while I was listening to the pundits on Sunday morning TV. It wasn’t as bad as I feared. And yes, there is a Legally Blonde musical coming to Broadway. I don’t know what they’re thinking, either. Posted by David at 12:18 AM | Permalink | Comments (67) Filed under: Advertising | Favorites | Lists | Long | New York January 18, 2007 60 Seconds in the Life of Summer Part 20 in an ongoing series of (approximately) 60 second films. Brrr. It’s cold outside. So I thought today would be a nice day to revisit summer: Posted by David at 12:22 AM | Permalink | Comments (6) Filed under: 60 Seconds January 17, 2007 The Astoria Notes [Update: Be sure to read the surreal follow-up in which a high-school class in Florida gets involved.] My first year in New York, I lived on the top floor of an old building in Astoria, Queens, with rotted wood floors that creaked every time I took a step. I didn’t mind so much, because my schedule was so hectic I was rarely home. I got up early every day to get to my job by 9:00 a.m. I was happy to work in a photo studio, but it didn’t pay enough to survive in this town. So at 5:30 p.m. each day I left the studio and went to a bookstore across town, where I worked until 12:15 a.m. in order to make ends meet (and another 8 hours on Sundays). By the time I got back to Queens every night, hopefully before 1:30 a.m., I was beat. I’d take an hour to wind down before finally going to bed, getting a few hours sleep, and starting over. One night, I came home to find the first in a series of notes slipped under my door. Small writing filled both sides of a sheet of loose leaf paper. I didn’t know what to make of it. The note began, “Dear Neighbor. When you arrive late every night, you are probably concentrating on your chores and don’t realize that this building, this street, the traffic, the people are all very still, very quiet.” The care and craftsmanship that went into writing this note was beyond anything I’d ever heard of from an angry neighbor. I continued reading. Click the images below to see them larger for easier reading: Wow. I had no idea I was keeping them up. But what could I do? I had to come home at that hour, and it wasn’t my fault the floor was squeaky. More importantly, who bothers to write such a long and detailed letter just to say “Keep it down up there?” It seemed like every word was carefully chosen, written, re-read, and reconsidered. I tested the floor in different areas, trying to find the creakiest spots so I could avoid them when I walk, and made an effort to be quieter when I came home from work. Months passed. Then one night, I found a greeting card slipped under my door. A greeting card. They took the time to shop for the appropriate card to say exactly what they wanted to say. I opened it. Inside it read: Wow, that’s touching. They picked out the card, and even went through the trouble of using White Out to make it more relevant to the situation. Who does that? Who were these people? How did they know my name? After all this time, I’d still neither met them nor seen them. Well, I was sorry to hear that I was still keeping them awake, but I was honestly doing everything I could possibly do within reason to minimize my noise. Several more months passed with no notes about the noise. I guess all my extra efforts to be quiet were paying off. Then this arrived, slipped under my door: A leak? That’s much more serious than just some noise. I called the number on the note and left a message, explaining that I’d been having no plumbing problems, and no water was pooling in my bathroom or kitchen, so the water must be coming from somewhere else. I don’t recall exactly what I said, but I must have put forth some specific theory about water condensation and the shower, because later this note was slipped under my door: Woah. Not only was I still too noisy for them, but they were taking advantage of my noise to entice an unwanted guest to leave. And that was so sweet of them to comment on my health. I guess they could hear that I was hacking up a lung when I had that cold. Well, at least the leaks had stopped. Or so I thought. A few weeks later, there was another note: A waterfall? Coming from my apartment? Please! I’d had enough of this. No more notes. No more phone calls. It was time to march downstairs, knock on Apartment 5, and have a real conversation with these people face to face. I went downstairs and knocked. The door opened about 2 inches, and an eyeball stared at me. We had a brief conversation that way, through the crack in the door. I confess that I couldn’t pay attention to the conversation very much because I suddenly found myself wondering what it was that this woman didn’t want me to see. I remember she said something about her privacy and her beliefs being nobody’s business, and she didn’t want me to see what her apartment looked like. Okay. I told her I had no idea what the cause of these leaks were, and suggested she bring it up with the building manager to see if they can figure it out. I went back upstairs to my apartment. It wasn’t long before I received another note: That was the last note I ever received from Apartment 5. A few weeks later, I moved. Update: This story now has a very interesting and surreal follow-up, which you can read here. Posted by David at 10:42 AM | Permalink | Comments (109) Filed under: Favorites | Long | New York January 16, 2007 Have your own millionaire Picasso experience This is the story of a Picasso painting, an art auction, celebrity multimillionaires, and a disastrous blunder that put a hole in the most expensive Picasso ever sold. If you keep up with news of the art world, you may have heard it already. But this is also the untold story of an original poster connected with the original auction, why I have it, how you can get it, and how you can make your own experience similar to those celebrity multimillionaires. The poster of the auction of the paintingThe story begins in New York City in 1941, when Victor and Sally Ganz spent $7,000 to buy a painting called “Le Reve” (also known as “The Dream”) by Pablo Picasso, depicting his lover Marie-Therese Walter. This purchase began a lifetime passion of collecting works by just their five favorite artists: Picasso, Jasper Johns, Robert Rauschenberg, Frank Stella, and Eva Hesse. Over 50 years, the Ganzes spent around $2 million building their entire collection. Victor Ganz died in 1987, and Sally died 10 years later. In late 1997, their art collection went up for sale at Christie’s auction house in New York. Le Reve sold for a record-setting $48.4 million to an anonymous buyer — the most ever spent on a Picasso, and the second highest amount paid for any painting ever (the record was held by Vincent Van Gogh’s Portrait of Dr. Gachet, which sold at Christie’s for $82.5 million in 1990 and has since gone missing, an interesting story itself). The entire 58-lot collection sold for $206.5 million, setting a record for the sale of a private collection. At the time of the Ganz sale, I worked at Christie’s in the photo studio, where I photographed fine art and other collectibles for the auction catalogs. I’ll get back to that in a minute. The anonymous buyer who purchased Le Reve sold it to casino magnate Steve Wynn in 2001. He in turn sold it to hedge fund mogul Steven Cohen for $139 million, setting a new record for the most money spent on a painting. All the formalities of the deal were finished, but the handover of the painting had yet to take place when a terrible event occurred. Just a few months ago, before turning the painting over, Wynn had several famous friends over to show it off. Among the guests were Barbara Walters, Nicholas Pileggi, and Nora Ephron, who described on Ariana Huffington’s blog what happened next: The Ganz collection went up for auction in 1997, Wynn was saying — he was standing in front of the painting at this point, facing us. He raised his hand to show us something about the painting — and at that moment, his elbow crashed backwards right through the canvas. There was a terrible noise. Wynn stepped away from the painting, and there, smack in the middle of Marie-Therese Walter’s plump and allegedly-erotic forearm, was a black hole the size of a silver dollar - or, to be more exactly, the size of the tip of Steve Wynn’s elbow — with two three-inch long rips coming off it in either direction. Steve Wynn has retinitis pigmentosa, an eye disease that damages peripheral vision, but he could see quite clearly what had happened. “Oh sh"
