title = "Ironic Sans: February 2006 Archives"
full_description = "Entries for February 2006 February 27, 2006 Michelangelo’s “David” meets David’s “George Bush” While traveling on business through Houston’s Bush Intercontinental Airport, I was struck by this statue of George Bush (the senior George Bush) in one of the terminals. What struck me was the eerie similarity between this statue and Michelangelo’s David. The 8 foot tall George Bush was sculpted by David Adickes, the Houston artist whose busts of all the Presidents grace two different Presidents Parks. I can’t help but wonder if the similarity is intentional. Michelangelo’s David depicts the second King of Israel, with a sling over his shoulder that he used to slay the giant Goliath of the Philistine army who threatened to destroy Israel. With that in mind, if Bush represents David, who represents Goliath in this scenario? Posted by David at 12:29 AM | Permalink | Comments (19) Filed under: Art | Politics February 26, 2006 60 Seconds in the Life of Laundry This is the first entry in an ongoing series. I occasionally film 60 second movies. They have no conventional plot, and often no characters. They are usually studies in motion that I find interesting. Sometimes there is something moving in an otherwise static frame, and other times it’s the reverse: something is static in an otherwise moving frame. When I have movies that I especially like, I’ll be publishing them here as part of an ongoing series. In truth, they aren’t all exactly 60 seconds, but they come close. I’m kicking off the series with a movie I call “60 Seconds in the Life of Laundry.” Posted by David at 11:53 PM | Permalink | Comments (4) Filed under: 60 Seconds February 19, 2006 Idea: Ironic Sans Thinking about different fonts one day, I decided that “Ironic Sans” would be a good name for a serif font. Maybe one day I’ll get around to designing it. In the mean time, I think it makes a good name for my blog. “Ironic Sans,” the blog, is a place for me to write about art, culture, technology, law, politics, current events, critical thinking, and other topics that appeal to me. I will have a number of regular features on this site, and various articles long and short as they come to me. I hope you enjoy. Posted by David at 4:30 PM | Permalink | Comments (11) Filed under: General | Ideas"
