title = "Ironic Sans: August 2007 Archives"
full_description = "Entries for August 2007 August 30, 2007 The Beetlejuice House EXT. THE MAITLAND HOUSE - DAY The Tim Burton movie Beetlejuice takes place mostly in one location — a house in Connecticut where Adam and Barbara Maitland lived, and which the Deetz family moved into after the Maitlands died in a horrible car accident. The house is also featured prominently on the poster. But a story that takes place in one location doesn’t present very many options for establishing shots throughout the film. How many ways are there to shoot the same house? It turns out, there are at least ten ways, including the opening shot of the Maitland House as a miniature. A subplot in the movie about a hideous remodeling of the Maitland home by its new residents lends variety to the shots of the house as construction progresses throughout the film. Here are the 10 different establishing shots, in chronological order: The movie takes place in Connecticut, but was filmed in East Corinth, Vermont. The house shown in these shots is not a real house; it’s just a facade built for the movie. Posted by David at 3:53 PM | Permalink | Comments (49) Filed under: Design | Entertainment | Favorites August 29, 2007 Discovered by PC Magazine PC Magazine has just named Ironic Sans one of their Top 100 Undiscovered Web Sites for 2007. Thanks, PC Magazine! If you’re visiting for the first time by way of the article, welcome to the site. You can click the “Favorites” link (which can also be found among the categories in the sidebar) to get a good sense of what this site’s all about, or just keep reading the front page to see what’s been on my mind lately. Posted by David at 10:25 AM | Permalink | Comments (10) Filed under: General August 27, 2007 Animated Manhattan: TMNT Part 17 in an ongoing series looking at New York City in animation. The Teenage Mutant Ninja Turtles have once again been adapted for the big screen. According to the movie’s opening narration and also the official movie summary, the movie takes place in New York City. But while it sure looks like it takes place in New York, something’s missing. See if you can figure out what it is. Here’s a shot of the city from the movie: Okay, it looks pretty good. I don’t really recognize any of the buildings in this view, but they got the general feel right, down to the water towers on the rooftops. Here’s another shot: That’s a pretty good rendering of a New York City streetcorner. Okay. Another lovely skyline shot. I still don’t recognize any buildings, but I suppose that could be the Brooklyn Bridge in the image. Kinda hard to tell. Now that’s definitely lower Manhattan, with Brooklyn across the harbor. Except I still don’t recognize any buildings. And where’s the Statue of Liberty? Are we really in New York City? Or some generic lookalike city? Finally, an aerial view! That looks like it’s supposed to be Manhattan in the middle there, with New Jersey across the Hudson River, and Brooklyn across the East River. Except lower Manhattan’s not really that angular. So it’s not perfect, but pretty close. But wait. What the hell is this building? I guess I’m fine with fictional buildings in a fiction movie, but if it’s supposed to be New York City, shouldn’t we see some of the real buildings, too? And I know that’s not a New York City license plate. Newspaper titles don’t really get much more generic than that one. [Although the newspaper does seem to say “NYC Cleanup” which I missed the first time around. Thanks to Grant for pointing that out in the comments] Even the skyline on the local news is missing any landmark buildings. I can only reach one conclusion: Despite the official movie synopsis, and the opening voiceover, [and the newspaper headline] this movie doesn’t take place in New York City at all. It’s meant to evoke the atmosphere and feeling of the city, but seems to take place in a generic version of New York City. The animators did a really good job rendering Manhattan-like settings, but with no landmarks, and no mention of New York in the dialogue (they refer just to “the city”), I assume they decided to go all the way and officially call it “New York City” only after the movie was nearly complete. IMDb Rating: 6.9/10 BCDb Rating: N/A My Rating: 5/10 (My rating is for the depiction of NYC only; in this case, they get high scores for the look and feel, but low scores for the lack of anything actually representing New York City) Posted by David at 12:31 AM | Permalink | Comments (20) Filed under: Animated Manhattan | New York August 22, 2007 Dog Day Anniversary Update 9/23/09: Google just made a large collection of old LIFE Magazine issues available for viewing on-line. You can now read the original article that inspired Dog Day Afternoon in its entirety on-line. 35 years ago today, a couple guys named John Wojtowicz and Sal Naturile held up a Chase Manhattan bank in Brooklyn at the corner of Avenue P and East 3rd Street. At the time, New York City was experiencing one or two bank robberies per day. But before it was over, this one became the hottest thing on TV. The police were alerted, hostages were taken, and 12 hours later the ordeal finally came to an end after several strange turns. I don’t want to go too much further into what happened, because the story was turned into the excellent 1975 movie Dog Day Afternoon, starring Al Pacino and directed by Sidney Lumet, and some of you may not have seen it before. I don’t want to spoil it. I highly recommend it as a great movie to watch during these dog days of summer. The movie was based on a Life Magazine article about the holdup called “The Boys in the Bank.” I dug up the original article, by PF Kluge and Thomas Moore, and was amazed to discover that the photos of the event looked surprisingly similar to stills from the movie. I knew that Lumet had strived to achieve a realistic look to his film, but there were many details that were nearly identical to the real events. Here are some side-by-side comparisons. On the left, we have photos from the actual crime scene. On the right, we have images from the movie. John (called “Sonny” in the movie, played by Al Pacino) talks to cops outside the bank: Ernest (called “Leon” in the movie, played by Chris Sarandan) arrives at the scene: Sal (called “Sal” in the movie, played by John Cazale) was actually 18 when the events took place. I think Cazale looks quite a bit older. But I can forgive them. Because it’s John Cazale. Cops (called “cops” in the movie, played in part by James Broderick) huddle behind a car across the street with reporters, watching events unfold: I should have an original copy of the magazine coming my way soon, and when it does I’ll try to add a couple more side-by-side comparisons using more photos from the story. In the meantime, as further encouragement for you to watch this movie, here’s a famous scene (that’s relatively spoiler free) to tease you. Enjoy. Posted by David at 12:01 AM | Permalink | Comments (23) Filed under: Entertainment | Favorites | New York August 21, 2007 60 Seconds in the Life of the Wonder Wheel Part 29 in an ongoing series of (approximately) 60 second films. If you look quickly, you can catch a glimpse of the Cyclone, too. Posted by David at 8:37 AM | Permalink | Comments (2) Filed under: 60 Seconds | New York August 20, 2007 Idea: Give the boss a grade In business, there comes a time in the fiscal year where the boss calls his or her employees into the office for a performance evaluation. But the only direction the evaluation flows in the workplace is from top down. Nobody asks the employees how the boss is doing. Sure, the boss has to be evaluated, too, but the view of his or her performance is only seen from above. I think businesses should implement Boss Evaluations, similar to the Teacher Evaluations that students get to do in school. I’m sure we’ve all had similar thoughts when it came time for our own evaluations, so I know it’s not a revolutionary idea. But maybe it’s an idea that needs to rise out of the wishful thinking of the low rungs on the ladder and actually be implemented. Of course a manager’s performance can be measured quantitatively (are sales up? is profit up?) just as test scores can be measured to judge a teacher’s success. But human relations are an important factor in a business’s bottom line, as well. When employees are happy, they stick around. While high turnover is acceptable in some industries, time and money spent training new staff may be better spent elsewhere. It benefits a company to have dedicated employees who aren’t constantly seeking a better position. It has been said that people don’t quit their jobs – they quit their bosses. It may turn out that a division within a company is successful despite a boss that nobody likes. That is important to know, too. Employees with bad bosses may still be working hard, but they may also be more likely to steal office supplies, trade secrets, or other property. Sure, there’s always going to be the brown-noser who gives a positive evaluation no matter what. And the employee with a grudge may give a negative evaluation to a boss who’s actually pretty good. Statisticians are better equipped than I am to suggest ways to account for that (is it as simple as throwing out the highest and lowest scores?). But a progressive company bold enough to ask the employees how the boss is doing may find itself with valuable information for running their company more effectively. Note to my former boss at the last company I worked for: You didn’t inspire this article. Don’t worry. Posted by David at 11:44 PM | Permalink | Comments (7) Filed under: Business | Ideas August 14, 2007 Idea: Breed a “Mickey” Mouse Walt Disney should add a new division of scientists (biological imagineers) to its company with the goal of breeding “Mickey” mice — real mice, selectively bred for their big round ears and black facial coloring which makes them resemble a certain famous cartoon mouse. Then they can sell them as pets in pet stores. If they start now, this could be the next big craze come Christmas. Posted by David at 12:02 AM | Permalink | Comments (23) Filed under: Entertainment | Ideas | Science August 1, 2007 Photos from the Galapagos Islands By now you may have seen my 60 Second Videos from the Galapagos Islands. As promised, here is a sample of photos from the trip. The rectangular photos were shot by me, and the beautiful ethereal square photos were shot by Ellen. I think several of her photos, which she shot with a $23 Holga camera, are far more beautiful than mine, which I shot with equipment that cost a hell of a lot more. You can see more of both our photos in slide-show form here. Marine Iguana Trees on North Seymour Island Sea Lions Flightless Cormorant A Darwin Bush grows through the lava on Isabela Island More Marine Iguanas. I love these guys. Scalesia trees on Santa Cruz Island The crew from our boat plays soccer on Floreana Island Blue Footed Boobies Bartolome Island Nazca Booby Waved Albatrosses A tuff cone lava formation Giant Tortoise Back to our boat, the Beluga You can see more of both our photos in slide-show form here. Posted by David at 11:54 AM | Permalink | Comments (9) Filed under: Favorites | Photography | Science | Travel"
