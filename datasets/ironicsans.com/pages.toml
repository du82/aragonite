title = "Ironic Sans: March 2006 Archives"
full_description = "Entries for March 2006 March 31, 2006 Idea: “Less is.” The phrase “Less is more” has become ubiquitous enough that, in keeping with the spirit of the expression, I think it should be shortened to simply, “Less is.” Posted by David at 7:18 AM | Permalink | Comments (10) Filed under: Ideas | Language March 29, 2006 Idea: The Ishihara Triptych Remember when you were in third grade and the school nurse gave you that test to see if you’re color blind? The one where she shows you a circle made up of smaller colored circles and asks you what number you see? That test is the Ishihara Test of Color Vision. I’m fascinated by perception, especially by the uncommon traits that make some people’s perception different than the rest of us — color blindness, tetrachromatism, synesthesia, monocular vision, etc. I also enjoy original art. I decided to combine the two interests by making a triptych out of three Ishihara color vision test plates. At greater expense than I anticipated, I obtained a set of Ishihara color vision test plates. I picked out three plates that I felt looked good together, and blew them up to a size suitable for framing. The entire finished triptych, seen above, hangs above my bed. I think it makes a compelling piece of art. It’s titled “57-74-8, or 35-21-3” Want to make your own? Click each thumbnail below to download a high-res image you can download, print out, and frame. Posted by David at 12:42 AM | Permalink | Comments (14) Filed under: Art | Favorites | Ideas | Science March 28, 2006 Idea: “What’s your AIM Name?” Did you know that AOL’s recently launched slogan for AOL Instant Messenger is “I AM”? Aside from being offensive to oversensitive religious people, it’s really, really lame. I suggest a new slogan: “What’s your AIM Name?” It’s so easy. It’s simple. It rolls off the tongue. It rhymes. It’s fun to say. It’s a sentence people will find themselves actually using in real life. Imagine a whole ad campaign revolved around “What’s your AIM Name?” Ads can show people meeting each other in bars, at school, in business meetings, etc., asking each other, “What’s your AIM Name?” It works in a million different scenarios. Then the announcer or ad copy can ask the viewer, “What’s your AIM Name?” People will think of the ad when they’re meeting new people. They’ll swap information. They’ll ask for your phone number and your AIM Name. It can even be reinforced by the product itself. Logging on to AIM right now, it just asks for your “ScreenName.” But the product itself can ask “What’s your AIM Name?” when you log in. Now if only I can find a use for all those free AOL CDs… Posted by David at 9:22 AM | Permalink | Comments (12) Filed under: Advertising | Ideas 60 Seconds in the Life of a Staircase Part 6 in an ongoing series of (approximately) 60 second films. I almost named this one “60 Seconds in the Life of a Guy in a Sweater Vest” Posted by David at 1:40 AM | Permalink | Comments (6) Filed under: 60 Seconds 60 Seconds in the Life of a Skater Boy Part 5 in an ongoing series of (approximately) 60 second films. Posted by David at 1:10 AM | Permalink | Comments (2) Filed under: 60 Seconds March 27, 2006 Idea: Design for a WTC Monument I know, designing your own WTC memorial is so 2002. But it’s been years since the World Trade Center Site Memorial Competition, and there’s been next to no progress on actually building anything. Last week, some dirt was moved around and people got angry about it. So I’ve been thinking again about my own monument design that I came up with a few years back, but never actually rendered. It’s nice to finally get it out of my head and on paper. Er, pixel. When viewed from one direction, my memorial resembles the original towers. It stands tall and proud. It’s big and bold. Its height depends aesthetically on where it will be placed — in a memorial park, I assume — but I imagine it being really tall, the tallest thing in the park, peaking out above the tallest trees, or (since the tallest trees will eventually grow) in the middle of a clearing. The names of the September 11 victims who lost their lives are engraved in lines on the faces of the towers, like the lines of windows on the buildings. So viewed from one direction, it looks like the towers themselves. But when viewed from another direction, the monument becomes an empty shell. It’s a reminder of how fragile the towers were, and of the empty space they used to occupy. It’s very, very simple. Hopefully it’s also poignant. In my original vision, these were as big as the original towers, becoming part of the city’s skyline in the same way the original towers were. Viewing Manhattan from one side, you’d see the towers’ silhouette and the skyline looks just like it used to. Viewing from another direction you’d just see the outline of where they were. It’s a grandiose vision. But probably not realistic, so I shrunk it down to a size suitable for placement in a park. To get the best view of the monument, and really convey how it looks, I’ve put together an animated fly-around that shows it from all sides. And for those who might be interested, a note about how I created these images and the animation is after the jump. A note about how I created these images. I used a program called SketchUp. I loved it enough to heap the following unsolicited praise. I’d never heard of SketchUp before I read last week that Google acquired them. And neither, apparently, had the Google Toolbar spellchecker, which thinks I’m writing about ketchup. Anyway, when I came up with this monument idea several years ago, I drew sketches of it, but none of them really did the idea justice the way a 3D rendering could. But I knew nothing about CAD and the learning curve seemed steep. I considered building an actual 3D model, but what would I do with it once I’d made it? I have no room for such a thing in my apartment. But after viewing SketchUp’s demo on their website, I realized I’d found a tool even I could use. SketchUp makes 3D rendering easier than sketching. Seriously. I downloaded the free trial version (fully functional for 8 hours), watched the tutorials for about 15 minutes, and put all this together in about an hour. None of my sketches of this concept ever looked this good. It’s a cool product. I congratulate them on their recent successes. Posted by David at 6:41 AM | Permalink | Comments (10) Filed under: Favorites | Ideas | New York March 25, 2006 Thanks for the hits My entry about Pre-Pixelated Clothes generated a lot of traffic this week, thanks especially to links from the following websites: TVGasm, Defamer, MSNBC, USA Today, Wired, Entertainment Weekly, Fark, Digg, Kottke, Consumerist, the Morning News, and about a hundred other blogs. I didn’t really expect that much attention. Thanks for putting my little blog on the map! Posted by David at 9:05 AM | Permalink Filed under: General March 24, 2006 Lost in translation I’ve finally had time to watch the most recent episode of “Lost.” I was shocked to see this in a subtitled scene: “You’re husband… he works for your father.” Um… I know that the writers sneak all sorts of subtle clues about the show into the dialogue, the scenery, and elsewhere, but I assume this one was a legitimate mistake. Posted by David at 10:37 PM | Permalink | Comments (6) Filed under: Entertainment | Language March 23, 2006 Idea: Advertisements on the overhead bins Look, I didn’t say it’s a good idea. I admit that it’s ugly as sin. Every bit of empty space in our lives is slowly being taken over by ads, so why would I want even more? Well, have you noticed how expensive your airplane tickets are getting? Airlines are filing for bankruptcy protection, seats are getting less comfortable, and you’re asked to pay $6 for a box of stale crackers on a flight. I was on a plane yesterday, and I noticed that with all the ads they were showing us on the overhead TVs, and all the ads crammed into the in-flight magazine, there was all this prime advertising real estate overhead that wasn’t being used. You already see overhead ads on the subways, on buses, in taxis, and on trains. Sometimes you’re even glad it’s there so you have something to look at to avoid eye contact with the person sitting across from you. So what’s a little more advertising on another mode of transportation? I’m not even sure I should file this under “Ideas.” Maybe I need a category called “Predictions.” This seems sort of inevitable to me. Posted by David at 7:06 AM | Permalink | Comments (19) Filed under: Advertising | Business | Favorites | Ideas | Travel Animated Manhattan: The Simpsons Part 4 in an ongoing series looking at New York City in animation. During their ninth season, The Simpsons came to New York. And many of you will never see that episode again. The episode, titled “The City of New York vs. Homer Simpson,” featured the Simpson family taking a trip to Manhattan to retrieve the family car. Barney had borrowed it, and left it illegally parked in front of the World Trade Center. While Homer goes to the WTC to straighten matters out, the rest of the family goes sightseeing. This episode first aired in 1997. At that time, the twin towers were still standing. Much of the episode takes place at the base of the towers, with some funny moments inside, also. But after the attacks of September 11, 2001, would anybody want to see this episode ever again? Now that several years have passed, some stations are beginning to show the episode again. A San Francisco station only showed it last year for the first time since 9/11. And according to a Wikipedia article about this episode, some stations are airing a version with all references to the WTC removed. It’s too bad, too, because there are some truly funny moments in this episode. I loved Homer dancing in a field of toilets, his imagination’s depiction of what Flushing Meadows (a neighborhood in Queens) must be like. Sure, there are some neighborhoods in this town that smell like a toilet, but it’s not that bad. Sometimes when tourists come to New York, they avoid the subway at all costs, even when taking a taxi is the slower, more expensive way of getting around. They’re afraid they won’t be able to manage it, or they’ve heard bad things about it. But not the Simpsons. Bart even tries his hand at panhandling, before realizing that it’s best left to the experts. The Simpsons even manage to fit in a horse-drawn carriage ride in Central Park. I would have recommended against the carriage ride, as an overrated and overpriced experience, but I’m glad the episode manages to get the Park in there somehow. And I love this shot of the Chrysler Building Empire State Building (d’oh!). Of all the depictions of New York in the episode, this image has the most architectural detail. It’s one of the city’s most beloved buildings, so it’s fitting that it was given the extra attention. IMDb Rating: N/A BCDb Rating: N/A My Rating: 8/10 (My rating is for the episode’s depiction of NYC only) Posted by David at 12:04 AM | Permalink | Comments (9) Filed under: Animated Manhattan | Entertainment | New York March 22, 2006 Idea: An album of Misirlou covers (This entry’s alternate title: What do a surfer, a belly dancer, and a Rabbi all have in common?) In January, I heard an incredible story on NPR about the song “Misirlou.” You know the one. You heard it during the opening credits of Pulp Fiction. It’s the surf-guitar song by Dick Dale. It goes “Dow di-di-dow-dow dow di-di-dow-dow di-dowwwwww…” Yeah, that one. Well if you didn’t already know (I sure didn’t) Misirlou is actually even older than Dick Dale (no offense, Dick). It’s been recorded in different manners, with different instruments, and different tempos, by dozens of people over the years. It’s a Rabbinical chant, an old Greek tune, a belly-dancer’s song, and eventually a surfer hit. You owe it to yourself to listen to the Weekend Edition story and hear snippets of different versions. And you can even hear Dick Dale explain how and why he turned that song into the surfer classic it’s become. I wanted to hear more. So I put together an iMix in iTunes with every version that wasn’t just like the one before it. So here, for your listening pleasure, an album of Misirslou covers (iTunes required). Posted by David at 1:01 AM | Permalink | Comments (5) Filed under: Entertainment | Ideas | Music March 21, 2006 Idea: A website for reviewing restaurants in airports I do a fair amount of travelling, and I don’t always have time to eat before I leave for the airport. Sometimes I get stuck in terminals for hours due to layovers or delays. And one thing I’ve learned is that there is an enormous inconsistency in food quality at airport restaurants. Photo: tspauld / flickrMost of them are just awful. Everything’s greasy, undercooked, overcooked, or just plain tastes bad. There’s butter slathered on everything. But every now and then I eat at an airport restaurant that’s delicious. I might as well be eating at my favorite restaurant, that’s how delicious it is. I’ve been to airport restaurants that served as test kitchens for famous restaurants. And I never would have known about them if I hadn’t stumbled upon them. So why doesn’t someone build a website that reviews restaurants in airports? That way when I’m taking advantage of the terminal’s wi-fi connection and I realize I’m getting hungry, I can hop on-line at whatever.com and see what the best restaurant in my terminal is. Or if I know I’ll have a big layover in Chicago, I can look up the restaurants before I go and see what gets the best reviews? Unfortunately, I really do have air travel to do this week, and I can predict I’ll be in a rush getting to the airport and won’t have time to eat first. Can anybody recommend a good restaurant at Miami International? Posted by David at 8:17 AM | Permalink | Comments (11) Filed under: Business | Ideas | Travel Idea: A poster for a dorm room. No statement about war intended, so don’t read too much into it. He just looks so much like he’s daring me to do it… Posted by David at 12:33 AM | Permalink | Comments (5) Filed under: Ideas March 20, 2006 60 Seconds in the Life of a Taxi Meter Part 4 in an ongoing series of (approximately) 60 second films. 500 bonus points go to whoever figures out on which street this was shot. No, make it 5,000 bonus points. Posted by David at 10:52 PM | Permalink | Comments (6) Filed under: 60 Seconds | New York Idea: Pre-pixelated clothes for Reality TV shows I don’t watch much Reality TV, but I’ve seen enough of it to notice an on-going phenomenon: Someone wears a garment with a trademarked logo or artwork on it, and the producers have to pixelate it beyond recognition in post-production. Of course no Reality TV star wants their shirt, which displays their well-chosen article of self-expression, senselessly pixelated so nobody can see it. But no Reality TV producer wants to deal with the headache of removing said article of self-expression to avoid trademark violatio"
