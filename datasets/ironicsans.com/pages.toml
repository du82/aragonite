full_description = "Entries for October 2007 October 22, 2007 Interview: Art Binninger, the Ed Wood of 1970s stop-motion animated Star Trek parodies (The sixth in a series of occasional interviews with people I find interesting or who work on interesting projects.) Chances are, you’ve never heard of Art Binninger, the Star Trek fan whose mission to make stop-motion animated Star Trek parody films began in 1974, and ended shortly after a cease-and-desist letter from Paramount came in 1986. So let’s have him introduce himself: Yes, that’s right. Art Binninger produced his films with help from his friends in the Air Force’s Audio Visual Squadron. That kind of makes your high school’s A/V Club seem wimpy, huh? Between 1974 and 1975, Art and his friends produced three “Star Trix” short films (recently resurrected on YouTube). With each one, he refined his technique a little more. After Star Trek: The Motion Picture came out in 1979, Art began working on “Star Trix: The Flick,” which he finished in 1984 with even more amazing sets and special effects (it can also be seen on YouTube in five parts. To me, the best thing about Art’s “Star Trix” project is that he actually documented the creation of all the films as he went, taking behind-the-scenes photos and footage. In an attempt to get the films shown on TV at the time, Art even made a “Making of” documentary so the total running time would better fit a TV schedule. The result is that today we have a detailed look at a particularly enthusiastic fan and his friends embracing the Do-It-Yourself spirit to create something wonderfully geeky in an era we now look back on with nostalgia. Art recalls the entire period in a detailed website he put together recently. It’s full of photos and stories from behind the scenes, including the 1984 Cease-and-Desist letter he got from Paramount, and what he did about it. But I had a few more questions for Art, which he was nice enough to answer. With his permission, photos from his website appear throughout the interview: Looking back at yourself when you were making those films, how do you see yourself? Were you more of an Ed Wood or a young Spielberg? Very apt selection of names. I think I was Ed Wood trying to be Steven Spielberg. When the Ed Wood biopic came out years ago, a number of my friends who worked with me on those films saw a lot of humorous parallels and asked if I had any angora sweaters stashed away somewhere. Were you trained in animation, or were you figuring it out as you went along? There was so little material to learn from in the early 1970’s, especially in the vicinity of Vandenberg [Air Force Base], that I had to figure out a lot as I went along. I did have the advantage of the Mopic Documentary Photo section being near the barracks. I would wander over and haunt the place, asking questions and they were would show me what they were taught in the motion picture camera technical school… As for the clay animations, when I talked about a Star Trek animation, the guys got excited about this like it was something they could really sink their creative teeth in. Unfortunately, by the time we were almost ready to film, all my mentors (grand old men of 21 and 22 years of age) were either finished their enlistments or transferred. So I simplified things and carried on. By using Air Force facilities for studio space, does that mean the Air Force indirectly funded these films? Since I was in the Air Force at the time and getting paid twice a month, I guess they did indirectly fund them… When I arrived at Vandenberg AFB in California, I lived in my own room in a WWII-era barracks building. This arrangement had a sort of college dorm/apartment house vibe where you could at least close your door to the occasional rowdiness. It was here that the Star Trix shorts began their slow path to the screen. I love the production photos, showing everyone working on the sets, etc. They make great documentary material. Why were those photos taken? I had a Polaroid camera and my roommate Dennis Cargill had gotten hold of some out-of-date film that was going to be trashed. He gave it to me and I started using it for progress photos on the set construction. I’m glad I did that because as my memory gets a bit dodgy I can refer back to them. I’ve also noticed that after I scan them into the computer and bring them up onscreen, I can see details in them that I didn’t notice before. Any plans for a “Star Trix: The Next Generation” movie? Just as the series oversaturated the screen during the 1990’s, I noticed that there are countless parodies as well. One more by me would definitely be unneeded. I haven’t kept up with the technology either so it wouldn’t be very good. What have you been doing since you made these films? My steady employment during this time has been as an offset press operator. I’ve been with the Office of the Santa Barbara County Superintendent of Schools, A-1 Lithographers in Lompoc and presently in the print shop of the Lompoc Unified School District again (I worked on STAR TRIX-THE FLICK during my first stay there in the early 1980’s). I found that each time I tried to leave printing behind for the film business, I eventually ended up broke and bitter. After a few times of that, you eventually see where your bread is buttered. So I keep the lights on with printing to allow me to pursue my interests, many of which have very limited commercial value but are fun nevertheless. And what’s next for Art Binninger? I’ve been doing more drawing in recent years and for a time in the 1990’s, I was pitching ideas for comics that weren’t particularly commercial either. When I started on the Internet in the 1999, I discovered that here was a place I could put this stuff that nobody would buy and at least get it seen. I like being able to cut out the middleman and go directly to the audience. I’m experimenting with animated gifs and trying to keep the file sizes small enough to download quickly. Since I’m still doing dial-up, if the gif loads quickly for me than it’ll be a breeze for all the high-speed users. I always have to remember, though, that I gotta keep getting ink on my fingers to get the green for all these projects. Thanks, Art! Update: Several of Art’s other early films are now available for viewing on YouTube. Check them out! Posted by David at 4:19 PM | Permalink | Comments (3) Filed under: Entertainment | Interview October 17, 2007 Animated Manhattan: Casper the Friendly Ghost Part 18 in an ongoing series looking at New York City in animation. Casper the Friendly Ghost has been trying to make friends with the living for 60 years now. During the 1950s, animated by Paramount’s Famous Studios, he even made a few visits to the Big Apple. In the short film Ghost of the Town, Casper flies into Manhattan, where he saves a baby from a burning building (by scaring the fire away, naturally). He is awarded with a parade, commendation by the mayor, and an appearance on the Ed Sullivan Show: In Boo Moon, Casper’s only 3-D film, Casper rides the subway — it looks vaguely like the Astor Place station — accidentally scaring all the riders: And in Dutch Treat, Casper decides to visit Holland. He goes to the New York Public Library to do some research (the best place to learn about Old Amsterdam is in New Amsterdam, right?) and scares the lions outside the library: All of these cartoons can be found on-line. Just do a Google Video Search for “Casper” and the name of the short film (thanks to reader “Art” for suggesting these!). Sidebar: Some people have wondered, if Casper is a friendly ghost, what ever happened to Casper the friendly dead kid? Well, Marvel Comics answered that question in a 1974 issue of Crazy Magazine, with an origin parody called “Kaspar the Dead Baby in ‘Die, My Baby, Die!’” You can find all four pages here. The dialogue in the third-to-last panel is my favorite. Posted by David at 9:55 AM | Permalink | Comments (4) Filed under: Animated Manhattan October 15, 2007 Best book title ever Sadly, this book is no longer in print. Posted by David at 12:48 AM | Permalink | Comments (20) Filed under: Entertainment October 10, 2007 The Original Must See Movies Checklist Note: This is a re-posting of a pretty long list of “Must-See” Movies that I compiled in 1994. I’ve written a brief introduction today for context, and I include for posterity a lengthy introduction originally written in 1994. You can read it all below, or just skip to the list itself. BRIEF INTRO (WRITTEN TODAY) Some of the projects I’ve done on-line over the years have disappeared into the ether, no longer hosted anywhere. I recently found one of my very first internet projects, from way back in 1994 when I was in college. I’m posting it here on Ironic Sans for posterity, with slight embarrassment looking back to this 13-year-old project. I was clearly not much of a writer back then. I used lots of exclamation points and even a smiley. And I coined the term “Netters” to mean “People who use the internet.” It never caught on. There wasn’t much of a World Wide Web back then, but there were lots of interesting conversations happening on Usenet Newsgroups, including one called “rec.arts.movies” which was a message board for discussing movies. One day in May, I posted a message asking people to recommend “Must-See Movies.” I got dozens of e-mails in response, each with dozens of movie recommendations, including several suggestions from a guy named Col Needham, who was working on a relatively new project of his own called the Internet Movie Database. I also got lots of requests to share the list once it was compiled. So I posted the list to rec.arts.movies. I suggested that people add up their total and post it to the group. Eventually, the “Official Netters’ Must-See Movies Checklist” did make its way to the web, where I added interactivity. You could go down the list, and check off the movies as you go, and at the end the website calculated your total, and told you what the average was of everyone who came before you, so you could see where you ranked. Col turned out to be incredibly helpful in automating the process of linking all the movies to their IMDb listings. But sadly, the company hosting my website had a crash sometime around 1997, and lost my whole site. I had no backup and neither did they. So the following is all that survived. Hopefully it has aged well with time. You can scroll down to read the embarrassingly badly-written and too-long introduction (like the one you’re reading now?) as it appeared in 1994, or you can skip the intro and go straight to the list itself. It’s the Official Netters’ MUST-SEE MOVIES Checklist!!! v1.1 by David Friedman Last Revision: May 9, 1994 INTRODUCTION * Here’s the Introduction: This is the Official Netters’ MUST-SEE MOVIES Checklist!!! Version 1.1 This is NOT a FAQ. At the time of the first version, there had yet to be any questions asked about it, let alone any Frequently Asked Questions. There WAS a section, however, of Infrequently Asked Questions. These were questions that I anticipated people having while reading the list, but they hadn’t been asked of me yet. Since then, I have gotten lots of questions from lots of people. So there now are Frequently Asked Questions among the Infrequently Asked ones. But just because I feel proud to have coined a new phrase (Infrequently Asked Questions), I’m still calling the questions and answers section Infrequently Asked Questions. CHANGES IN EACH VERSION 1.1 -Lots of things are cleared up in the Infrequently Asked Questions section. -The Star Wars Rule has been ammended and explained more completely. -The Leonard, Part 6 rule has also been ammended and explained in detail. -About 75 more movies have been added. Any new movies are indicated with an asterisk. -Any of the Infrequently Asked Questions that are new or have been somehow changed are indicated with an asterisk. Anything else that’s been changed or added is also indicated with an asterisk. -Miscellaneous other things have been changed, mostly just slight changes. Thoroughly read the Infrequently Asked Questions for more details. TABLE OF CONTENTS No table of contents. I always thought they were a waste of space. Just keep reading… INFREQUENTLY ASKED QUESTIONS about The List 1. Why do we have The List? Well, that’s quite simple. It’s best summarized by putting here some excerpts from the post that started it all. Read: —-START—- A friend of mine recently asked me to help her come up with a list of must-see movies that she should watch over vacation. Being put-on-the-spot, I was only able to come up with about forty or fifty. So I ask all of you to send me titles of what YOU consider to be must-see movies. The guidelines are as follows: No OBVIOUS must-see movies that chances are everybody has already seen (e.g. Star Wars). “Everybody” in this case is defined as “a reasonably educated person of 20 years of age who has enough of an interest in movies that she has seen plenty of them but would like to further educate herself.” No rarely-seen movies. She wants to see must-see movies that might actually come up in an intellectual conversation about cinema without other people saying “Huh? I’ve never heard of that one.” A good tip: If you’ve ever been discussing cinema with an equally-educated movie buff, and you’ve mentioned a movie to which they replied “I’ve never seen that one. Always wanted to, but never got around to seeing it,” prompting you to say “WHAT?! You’ve NEVER SEEN So-And-So?! You’ve GOT to see it!” Send that title. Chances are, she’s never seen it either. —-END—- I got a vastly overwhelming response to this single post. Many people requested that I send them the completed list. So I decided to compile it all. These are the titles that YOU people said were MUST-SEE MOVIES. I didn’t make up the list, I only typed it all up. The members of rec.arts.movies made this list, so I give it to the members of rec.arts.movies. That’s why the apostrophe comes AFTER the word “Netters” in the title. It is by the Netters and for the Netters. 2. How on Earth can you justify calling [insert movie here] a MUST-SEE MOVIE? Since the titles are things that people sent me, I felt it beyond me to decide that even though they feel a certain movie is a MUST-SEE, I don’t and therefore it doesn’t deserve to be on The List. So for the most part, if someone sent me the movie title, I added it to the list. I did use SOME discretion, though. For instance, I’m sorry but I could not justify calling _Leonard, Part 6_ a MUST-SEE MOVIE. I tried to make sure that most of the titles followed the guidelines listed above, but I did let some slip by. 3. How on Earth can you NOT include [insert movie here] as a MUST-SEE MOVIE? * Well, first of all, it’s possible that nobody sent me that title. Secondly, it’s possible that I felt it didn’t meet the guidelines listed above. Thirdly, it’s possible you’re talking about _Leonard, Part 6_. If you’re really concerned, e-mail me "
