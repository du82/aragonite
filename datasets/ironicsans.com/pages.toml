description = "Beginning in 2006, this was the home of my blog Ironic Sans. It was popular for a while, mentioned in lots of media, and was a creative space for me to share my thoughts and ideas. But over time, blogs became less popular and my thoughts and ideas moved to other places."
full_description = "April 2, 2022 This is now a static archive of Ironic Sans Please subscribe to the Ironic Sans Newsletter In early 2022, Ironic Sans was hacked and completely wiped out. I had been running on an old platform so it's not surprising it was vulnerable to attack. I thought about converting it to a more modern platform. However, over the past couple years I relaunched Ironic Sans as a newsletter, which is where I do most of my public writing now and which many of you already subscribe to. And if you don't, you should subscribe to the newsletter here. So I decided that instead of rebuilding the website from scratch with a modern platform, I would restore it as a static website, in order to maintain an archive of what was here and no break any inbound links from other sites that have linked to me over the years. At some point I may revive the website again. But in the meantime, I leave this here for posterity. Please join me over at the newsletter! Posted by David at 8:10 AM January 20, 2019 How to Join a Social Network in 1998 In 1998, I got an invite to what many consider the first online social network: sixdegrees.com (deceptively, that link will take you to the Wikipedia article about the website and not the website itself; I have no excuse). The invite came in the form of a lengthy email with instructions on how to join. I could either use the website or actually do the entire process via email, adding my friends using a peculiar and precise format in the body of the email. The subject of the email was simply the name of the person who had added me as a friend. I came across the invite recently so I figured I’d share it here as a curious bit of internet history. It’s interesting that in 1998 they had to actually explain why someone would want to join such a thing. Here is the full text of the email with light redactions: Name: David Friedman E-Mail Address: [my old email redacted] sixdegrees Password: stopsock Hi. You’ve been sponsored as “Friend” by Rachel [last name redacted] as part of something called sixdegrees, one of the fastest growing phenomena on the Web, located at http://www.sixdegrees.com You may have already heard of the six degrees of separation concept - where everyone on the planet is connected to each other through fewer than 6 people. Well, we haven’t quite connected the whole world yet, but there are over a million people participating, and over 900,000 of them are connected in one giant chain. And, just by confirming your relationship with Rachel, you can instantly tap into this interconnected community of interesting people from all over the world. So what? Well, by getting connected, you can come to the Web site (which is completely FREE) and use a whole variety of valuable, fun and intriguing services that make use of this massive chain of connections. You can come see who’s logged on the site right now and when you find someone interesting, we’ll show you exactly how you’re connected no matter how many degrees it takes, and then you can instant message them. You can also find out how you’re connected to that head of personnel at the big firm where you’ve been trying to get your foot in the door. You can chat with people from around the globe and then see who you know in common. You can post burning questions on your own personalized bulletin board and get valuable answers from your “circle” (your friends and friends of friends). You can even get Movie recommendations from the people you’re connected to. So, stop by the site at http://www.sixdegrees.com to learn more and give it a try. (You can log in with this password: stopsock). ======================================= You can also get things started and get yourself connected right from this e-mail: ** To confirm your relationship with Rachel, just send a reply that says only CONFIRM on the first line of the message body * To deny this particular relationship (but keep open the possibility of joining sixdegrees if the concept intrigues you) send a reply that says only DENY * And, if you’d like to make sure you don’t hear from us again (even if somebody else you know lists you as a contact) then simply send a reply which says REMOVE in the SUBJECT LINE so we can process your request right away Thanks, and we look forward to seeing you at sixdegrees. ======================================= And, if you’re really ambitious, you can get your network of connections growing right away. Just list the people you think might be interested in participating in sixdegrees and we’ll contact them with an e-mail like this one which mentions your name and invites them to join. Just follow these directions: * Click your mail program’s REPLY button. * On the FIRST line of the message body of the reply e-mail that opens, type only the word CONFIRM to let us know that you are in fact Rachel’s Friend. * On the next line of the message body list the first and last names and e-mail addresses of the people you’d like to invite (you can list as many as you’d like - but we recommend you list at least two), and the relationship numbers that correspond with how those people are related to you. MAKE SURE: * That the first name, last name, e-mail address and relationship number are separated by SEMI-COLONS. * You follow the format of these examples: John; Smith; jsmith@fakeplace.com; 12 Jane; Doe; superjane@fakeplace.com; 3 * And that you define each relationship by choosing a number from this list: 1=wife 2=husband 3=life partner 4=significant other 5=mother 6=father 7=sister 8=brother 9=daughter 10=son 11=other family member 12=friend 13=employer 14=employee 15=co-worker 16=client 17=service provider 18=business contact 19=fellow alum 20=acquaintance We look forward to hearing from you! ======================================= PLEASE NOTE: All replies to this address are processed by a computer. If you have any problems, questions or requests send an e-mail to issues@sixdegrees.com and you’ll receive a prompt and courteous response. And, if you’d like to review our privacy statement just visit http://www.sixdegrees.com/Public/About/Privacy.asp ======================================= sixdegrees is Registered in the U.S. Patent and Trademark Office. E.DB.ANB.1 The website sent out weekly emails with your stats and some ideas for making the most of the network. I opted out after receiving five of these “member updates”. In the last one, these were my stats: CONTACTS Total 1st degree contacts: 4 Total 2nd degree contacts: 13 Total 3rd degree contacts: 22 Total 4th degree contacts: 93 Total 5th degree contacts: 281 Total 6th degree contacts: 2368 Total 1st-6th degree contacts: 2781 MY BULLETIN BOARD Messages posted by you: 0 Responses to your postings: 0 Posted by David at 3:40 PM | Permalink Filed under: Technology August 31, 2017 The Mystery of Why Uber Gave Me 77 Free Rides (or, How I Accidentally Gamed The System) For about two and a half years, Uber kept sending me free ride credits. I just went through my receipts and counted 77 free rides in total, averaging one every couple weeks. Then they suddenly stopped. All that time, I never knew why I was getting them — why look a gift horse in the mouth? — but once they stopped I put on my detective hat and did a little digging. I’m pretty sure I’ve solved the mystery. Follow my story and see if you can figure it out. When I joined Uber in 2011 I was given the opportunity to create any referral code I wanted as long as it started with the word “uber” (I think they still let you do that, actually) so I just added my initials to it and made the code UBERDF figuring that would be easy for me to remember. I might have given it out to a couple people, but then pretty much forgot about it. Then in late 2013, the trickle of free rides started. I’d get an email saying I earned $10, $15, or $20 in credit because someone took their first ride using my referral code. At first I assumed someone I gave my code to in 2011 finally used it. Then when more free rides came in, I wondered if perhaps my code was on some list of Uber referral codes that may have been circulating. I didn’t really think more about it. I just accumulated my free rides in my account, ready to use when I needed them. It was great. Sometimes I even forced myself to use them instead of the subway, since they would eventually expire otherwise. I casually looked into whether this was happening to anyone else. The closest thing I found was an article about a guy who placed online ads for Uber using his own referral code and got hundreds of free rides that way. Uber found out about his scheme and took them away. So I was glad that my trickle of free rides was a slow drip that was unlikely to get their attention. Then, around January of 2016, they stopped. At their peak I was getting 2-3 free rides a week. And then nothing. I couldn’t be too upset that I had to start paying for something everyone else paid for, but I was curious what happened. And since I wasn’t getting any more free rides anyway, I was no longer afraid to look into it. Continue reading “The Mystery of Why Uber Gave Me 77 Free Rides (or, How I Accidentally Gamed The System)” » Posted by David at 9:59 AM | Permalink | Comments (1) Filed under: Business | Technology | Travel December 19, 2016 How Postage Stamps Are Made I just completed a nice little mini-documentary about the design of US postage stamps. The US Postal Service has four Art Directors who oversee the stamp designs, and I worked with one of them to make this video, Antonio Alcalá of Studio A in Virginia. Posted by David at 6:40 PM | Permalink | Comments (1) Filed under: Art | Design June 25, 2016 Sunday Magazine is back. With a twist! Hey, everyone! Longtime readers (and if this is still popping up in your RSS feed, I’m not sure there’s any other kind) will remember that I used to run a side project called SundayMagazine.org, where each week I posted the most interesting articles from the New York Times Sunday Magazine exactly 100 years ago that week, usually with some commentary about its relevancy to today. I even wrote an article about it for Slate. Well, when I had kids, I lost time for those sorts of side projects, and I put SundayMagazine on hiatus. In the meantime, I’ve had occasional requests from people who wanted to pick up the mantle, and I’ve considered handing over the reigns. But it never worked out. Until now. SundayMagazine is now being run by Jesse Rifkin, a DC-based journalist. I’m sure his taste in articles to highlight will differ from mine, as will his writing style. (He’s probably a much better writer than I am). I look forward to seeing where he takes things. Check out his first post, introducing himself to readers. And then add (or re-add) SundayMagazine to your reading habits. The website: www.sundaymagazine.org The twitter: @sundaymagazine The Facebook: facebook.com/sundaymagazine (Please note that SundayMagazine has been dormant for nearly five years, and is in serious need of updating. Some things may be broken. We’ll fix things as we go.) Posted by David at 2:48 PM | Permalink | Comments (0) Filed under: General August 25, 2015 Inventor Portrait: Alan Adler (AeroPress; Aerobie) It’s a new Inventor Portrait! Alan Adler, inventor of the Aerobie Flying Disc and the AeroPress coffee maker, tells the stories behind his famous inventions. I confess I actually completed this a year ago, but hadn’t posted it for a variety of reason. It’s great to finally share it. Posted by David at 8:47 PM | Permalink | Comments (0) Filed under: Design | Interview | Photography July 8, 2015 My Letter From Oliver Sacks I’ve just written a longform article for The Morning News about the time I got a letter from Oliver Sacks. But it’s about so much more. It’s a little bit science, a little bit personal essay, and a tiny bit biography. I’ve never fully told this story before, and it’s the first time I’ve shown anyone the letter. Go read it! Posted by David at 1:50 PM | Permalink | Comments (2) Filed under: Long | Science June 11, 2015 A short documentary about a street puppeteer, his craft, and an unconventional friendship How has it been so long since I’ve written anything here? Is anyone still reading me? If so, I have something new to show you. I’m really proud of how my latest short documentary turned out. It’s about Ricky Syers, a street performer in Washington Square Park, and his friendship with Doris Diether, a local community activist who spends a lot of time in the park. The two of them are so endearing, and a couple of real New York characters. Check it out! Posted by David at 12:43 PM | Permalink | Comments (5) Filed under: Art | New York October 28, 2014 Idea: Pop Culture Twitter Lists It’s been five years since Twitter introduced Lists and frankly I never found a use for them. It’s not that I don’t see the value in curated lists, but I never remembered to look at them, preferring to watch my complete stream of tweeters, signal, noise, and all. But I finally came up with a use for them. So without further ado, here are a bunch of Pop Culture Twitter Lists you can follow, in apparently random order, with notes about what you’ll find there. (You can also see them with nicer formatting but without the notes, and easily to subscribe to them, here on Twitter). Saturday Night Live: 75 cast members, including “featured” players Parks & Recreation: 10 cast members Community: 8 cast members 3rd Rock From the Sun: 5 cast members, mainly Joseph Gordon-Levitt SCTV: 5 cast members Roseanne: 6 cast members, but mainly Roseanne being weird The Breakfast Club: 4 cast members, but mainly Molly Ringwald, who has a brand new advice column and I can’t believe more people aren’t talking about that. Doctor Who: 19 cast members, mainly Doctors and companions Star Wars IV-VI: 9 cast members from the Original Trilogy Night Court: 3 cast members, but mainly Markie Post Cheers: 5 cast members, but mainly Kirstie Alley Modern Family: 11 cast members Married… With Children: 6 cast members, but mainly David Faustino Silver Spoons: 5 cast members 30 Rock: 9 cast members Rocky Horror Picture Show: 3 cast members, but really just Susan Sarandon The Fresh Prince of Bel-Air: 7 cast members Rowan & Martin’s Laugh-In: sadly just 3 cast members, but what cast members they are: Lily Tomlin, Ruth Buzzi, and Goldie Hawn. I’d watch a movie starring all of them. Boy Meets World: 6 cast members Friends: 6 cast members The Mindy Project: 10 cast members Stephen Tobolowsky: This is just Stephen Tobolowsky Family Guy: 6 cast members The Simpsons: 7 cast members Mad Men: 9 cast members Orange is the New Black: 21 cast members plus the real Piper and Larry Breaking Bad: 15 cast members Seinfeld: 9 cast members, including a few memorable guest stars Saved by the Bell: 8 cast members Beverly Hills 90210: 9 cast members The Office (US): 16 cast members Family Ties: 5 cast members, and you should be following Justine Bateman’s blog about going back to college and being a Computer S"
