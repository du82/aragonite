full_description = "Entries for November 2007 November 27, 2007 Idea: Truly Crappy Statues Based on photo by FatBusinessmanSculptors sometimes choose their medium based on how that material will change over time. When Frederic Bartholdi decided to make the Statue of Liberty out of copper, he knew that years of wind, rain, and sun would give it a nice green patina, and he must have had that final look in mind when he designed it. I think a sculptor should be brave enough to take a similar approach to another natural phenomenon that can change a statue’s color: bird poo. Perhaps a bronze statue in homage to a historical figure who had salt-and-pepper gray hair can be erected below the branches of a tree. At that time, the sculptor’s work would be finished, but the statue would not. Only after enough pigeons have crapped on his head to give him a greater likeness to his subject would the statue truly be complete. Or maybe a statue could be made depicting a child holding up a delicious cupcake. A nice bird crap patina on the cupcake could portray delicious frosting. Or, if he holds an ice cream cone, dripping bird poo flowing from the cone to his hands could emulate melting ice cream. Maybe the child could even be depicted as about to lick it off. Or, even more simply, how about a statue of someone wiping bird crap off his shirt, placed somewhere that the statue is sure to be pooped on? A great work of art, depicting a modern Sisyphus. Previously: Michelangelo’s David meets George Bush Posted by David at 6:12 PM | Permalink | Comments (9) Filed under: Art | Ideas November 19, 2007 Siriusly? I enjoy satellite radio as part of my mix of audio news and entertainment, which includes satellite, broadcast, and podcasts. But I was a bit surprised when Sirius sent me an advertisement this week which asked: …and answered the question with this chart (I’ve put a red box around the portion that intrigued me): Really? NPR isn’t available on FM or AM or MP3? Then what are those podcasts I’ve I been listening to when I miss my local broadcast? Posted by David at 12:08 AM | Permalink | Comments (8) Filed under: Advertising | Entertainment November 15, 2007 60 Seconds in the Life of a Puddle Part 30 in an ongoing series of (approximately) 60 second films. Posted by David at 9:50 PM | Permalink | Comments (5) Filed under: 60 Seconds November 5, 2007 The Constitutionality of Storyboarding With a tip of the hat to Gilda Radner’s old SNL character Emily Litella, I present this blog entry on the constitutionality of storyboarding: America has a serious question to answer about storyboarding. I’m not talking about whether or not storyboard artists should join the writer’s guild and go on strike this week, or about whether “storyboard” is supposed to be written as one word or two. I’m talking about the more serious issue of whether or not storyboarding amounts to torture. Somewhere, in a parallel two-dimensional universe, I imagine last week’s Attorney General confirmation hearing of Michael Mukasey looked something like this: What? Water boarding? Ohh. Nevermind. (This thought popped into my head shortly after I woke up this morning, and it wouldn’t go away until I posted it. Don’t know why.) Posted by David at 8:55 AM | Permalink | Comments (13) Filed under: Art | Entertainment | Politics November 1, 2007 Halloween on the Upper West Side Every Halloween, West 69th Street closes to traffic, and thousands of kids go trick or treating from building to building. This year, I set up my camera in one building’s lobby and photographed some of the kids in their costumes. I thought I’d share a few of the shots (I particularly liked the little girl named Dalia who was dressed as the “Dalia Lama”): Posted by David at 3:04 PM | Permalink | Comments (31) Filed under: Favorites | Photography"
