title = "Ironic Sans: April 2006 Archives"
full_description = "Entries for April 2006 April 27, 2006 Freaks stay at Marriott? Am I the only person who can’t look at this Marriott advertisement without thinking of Johnny Eck? Johnny Eck, of course, was the talented performer billed in circus sideshows as “The Only Living Half Boy.” An actor, magician, painter, and photographer, Eck is famously featured in the Tod Browning movie Freaks. More information about Johnny Eck can be found at the excellent Johnny Eck Museum, an on-line tribute complete with biography, photos, answers to the usual questions, and more. Posted by David at 12:44 PM | Permalink | Comments (4) Filed under: Advertising | Entertainment | Travel April 26, 2006 Animated Manhattan: Futurama Part 8 in an ongoing series looking at New York City in animation. On December 31, 1999, pizza delivery guy Philip J. Fry delivers a pizza to a cryogenics lab in Manhattan and through a series of unfortunate events is accidentally frozen for 1000 years. While he’s in deep freeze, we can see time passing visibly outside the window. We see New York City completely destroyed by aliens (except, for some reason, the building the cryogenics lab is in) and eventually rebuilt as New New York City, where Fry wakes up on New Year’s Eve, 2999. That’s the premise of Futurama, the cancelled animated series by Simpsons creator Matt Groening which aired on FOX for four seasons and can now be seen in syndication and on DVD. In New New York, the subway system has been replaced with the New New York Tube System, which whisks people across town. In Fry’s first experience with the tube system, we see it snaking through the city. It goes underwater, passing a sunken Circle Line Cruise boat. It winds past the Statue of Liberty (was it recreated? or is it still standing?), which supports the tube where the torch used to be. In the pilot episode, Fry takes a tour of underground New New York, where the remnants of New York City can be found. The Chrysler Building’s once shiny spire lies on its side. Rockefeller Center’s skating rink has become the swamp-like home of an alien creature. Some of old New York City has been recreated a bit differently in New New York. Luna Park, for example, is no longer an amusement park in Brooklyn. Luna Park is now an amusement park on, well, the moon. And in memory of Madison Square Garden, a new sports arena has been erected: Madison Cube Garden. Thankfully, a good slice of pizza can still be found in New New York. Original Cosmic Ray’s Pizza serves its customers a steaming slice as only an Original Rays Pizzeria can. IMDb Rating: N/A BCDb Rating: N/A My Rating: 8/10 (My rating is for the series’ depiction of NYC only) Posted by David at 9:06 AM | Permalink | Comments (5) Filed under: Animated Manhattan | Entertainment | New York April 24, 2006 Idea: Another commercial I’d like to see Remember the last commercial idea I had? Well I like this one even better. Okay, picture this: The commercial begins with a shot of a bedside alarm clock. There’s a cell phone next to it. The alarm clock turns from 6:59 to 7:00 and the alarm goes off. A woman’s hand turns off the alarm, and the cell phone immediately rings. The hand grabs the phone. We hear her sleepy voice. “Yes.” Pause. “Yes.” Pause. “Yes.” Pause. Cut to… The woman brushing her teeth, still holding the phone to her face while she brushes. As she brushes, she’s talking into the phone. “Yes.” Pause. “Yes.” Pause. Cut to… The woman goes about her day. She’s making breakfast while she talks. “Yes.” Pause. “Yes.” Pause. She’s shopping for groceries. Still talking. “Yes.” Pause. “Yes.” Pause. She drops some letters in a mailbox. “Yes.” Pause. “Yes.” Pause. She does various other daily routine activities, all while talking on the phone. “Yes.” Pause. “Yes.” Pause. Her day comes to an end. She’s back at home. It’s evening. She sits down on her living room couch to watch TV. She still has the phone to her ear. “Yes.” Pause. “Yes.” Pause. We can see a big window behind her over her shoulder. It looks out onto her front yard. “Yes.” Pause. “Yes.” Pause. Outside her window, the Verizon Wireless Guy steps into view. We hear him ask into his phone, “Can you hear me now?” The woman answers into her phone, “Yes.” Verizon Wireless Guy takes a step. “Good. Can you hear me now?” She turns and waves at him through her window. “Yes.” Verizon Wireless Guy waves back, takes a step. “Good. Can you hear me now?” “Yes.” Tagline: “Verizon Wireless. Keeping calls clear for both sides of the conversation.” Or something like that. You can thank me at the Clio Awards, Verizon! Posted by David at 12:30 AM | Permalink | Comments (5) Filed under: Advertising | Ideas April 23, 2006 100,000 hits Today, Ironic Sans had its 100,000th visit, to be commemorated in this post, reflecting a long-standing tradition of posting about your 100,000th hit. I consider the site as having gone live on March 11, 2006, even though the archive has a few earlier posts, which I needed to have so I could figure out the site’s design. But March 11 was the first day I considered the site finished and posted something that I thought might attract people to my site. The next day, March 12, I started using SiteMeter to keep track of my visits. And according to SiteMeter, I had my 100,000th visit at 4:29:17 PM today. So that’s 100,000 visits in 43 days. Not bad! The top three pages in the first 100,000 hits: 1) Pre-pixelated clothes for Reality TV Shows 2) The Google Maps Guide to Ghostbusters 3) 60 Seconds in the Life of Landing Gear Thanks for helping me hit this milestone, everyone! Posted by David at 4:58 PM | Permalink Filed under: General | Technology April 20, 2006 Blog Name or Band Name? Get out your #2 pencils, everyone. It’s time for a quiz. Each of the following is either a Blog name or Band name. Which is which? 1. River Tyde 2. An Emotional Fish 3. Small Ball Paul 4. Greedy Kristian 5. Trout Fishing in America 6. The Factory Floor 7. Albany Injury Lawyers 8. Early Edison 9. Sidearm Delivery 10. Coffin Break 11. Glamordisiac 12. Whoopity Doo 13. The House of Rapp 14. Grim Skunk 15. Dr. Know 16. Dr. Sanity 17. Generation K 18. Metafizzics 19. Joust the Facts 20. Stolen Ogre 21. Subway to Sally 22. 702 23. The Third Decade 24. Clea 25. Mother Pus Bucket Okay, time’s up. Pencils down. Pass your answer sheets to the front of the class. Here are the answers: 1. Blog 2. Band 3. Band 4. Blog 5. Band 6. Blog 7. Blog 8. Band 9. Blog 10. Band 11. Blog 12. Blog 13. Blog 14. Band 15. Band 16. Blog 17. Band 18. Blog 19. Blog 20. Band 21. Band 22. Band 23. Blog 24. Blog 25. Neither. I can’t believe motherpusbucket.com is still available. Posted by David at 1:13 PM | Permalink | Comments (3) Filed under: Entertainment | Lists | Technology April 18, 2006 The Google Maps Guide to Ghostbusters NOTE: After two years working just fine, the map is having problems. I’m trying to fix it. Sorry for the inconvenience. Should be fixed now. Let me know if you have any problems! Click to launch map in new windowHey! There’s a Ghostbusters symbol in my Google logo! What’s going on? One’s a movie, and one’s a search engine. Next thing you know, fish will be flying, trees will be swimming, cats and dogs living together — mass hysteria! Welcome to the Interactive Google Maps Guide to Ghostbusters. You can click the Google logo above or the map image below at any time to launch the map in a new window, or read on for more info. Click to launch map in new windowI’ve created a mashup of Google Maps and every New York City location used in filming the movie Ghostbusters and its sequel Ghostbusters 2 that a person might be likely to visit on a trip to Manhattan. It’s my first time using the Google Maps API, but I think I’ve come up with a slick way to use it. But still, let me know if anything doesn’t work right. Also, if you’d like to link to the map, please link to this entry’s permalink instead of the map itself. Thanks. Ready? Check it out! The map will open in a new window. Posted by David at 8:22 AM | Permalink | Comments (37) Filed under: Entertainment | Favorites | Ideas | New York | Technology April 17, 2006 Animated Manhattan: Fantasia 2000: “Rhapsody in Blue” Part 7 in an ongoing series looking at New York City in animation. George Gershwin’s 1924 composition “Rhapsody in Blue” is strongly associated with New York City, partly due to its use in Woody Allen’s film Manhattan. Similarly, the illustrator Al Hirschfeld’s amazing drawings of Manhattan night life, Broadway stars, and other celebrities appeared in the New York Times for so long that his association with this city even prompted the Museum of the City of New York to put together an exhibit and book called Hirschfeld’s New York. So it was a good bet by the producers of Fantasia 2000 that combining Hirschfeld’s images with Gershwin’s music would create an amazing sequence in their movie of animation set to music. Using an animation style evocative of Hirschfeld’s drawings, the film tells the stories of several New York characters during the great depression. We meet the construction worker who dreams of playing drums in a jazz band in Harlem, and we meet the down-on-his-luck unemployed gentleman who can barely pay for a cup of coffee. We also meet well-to-do characters. We meet a little girl whose mother forces her into every hobby imaginable — dance, piano, swimming, etc. — and we meet the husband of an overbearing wife who lavishly spends money on her pooch. It’s really amazing the way the animators have managed to capture Hirschfeld’s style, and the feel of the city, synchronized expertly with the excellent music. Any fan of animation, music, and New York should rent this movie just for this sequence alone. There are pleasant surprises in the rest of the film, but this is where the movie really shines. Scaling down the images for this website doesn’t really do the artwork justice. On the big screen, each frame looks like it could be a Hirschfeld drawing. It must have been wonderful to see this sequence when it was originally released in IMAX. Note: The below IMDb and BCDb ratings are for the entire movie, not just the “Rhapsody in Blue” segment. IMDb Rating: 7.2/10 BCDb Rating: 6/10 My Rating: 9/10 (My rating is for the film’s depiction of NYC only) Posted by David at 7:25 PM | Permalink | Comments (2) Filed under: Animated Manhattan | Entertainment | New York 60 Seconds in the Life of a Wild Tail Pet Toy Part 10 in an ongoing series of (approximately) 60 second films. Posted by David at 6:59 AM | Permalink | Comments (2) Filed under: 60 Seconds April 14, 2006 60 Seconds in the Life of a Bear and Sea Captain Part 9 in an ongoing series of (approximately) 60 second films. Posted by David at 9:42 AM | Permalink | Comments (0) Filed under: 60 Seconds April 12, 2006 Museum store shop for is open inspiration! I saw this banner outside a museum last week, and I had to take a picture. I haven’t seen such a confusing use of type is a long time. First I thought it said “museum store shop for is open inspiration!” but of course that makes no sense. I tried again, separating the small 2D letters from the big 3D letters. This time I ended up with two sentences, “store is open” and “museum shop for inspiration!” I’m pretty sure the first sentence makes sense, but I don’t know about the second one. Trying again, I attached “museum” to “store is open” to get “museum store is open” which makes sense. But that left me with “shop for inspiration!” which I guess makes sense grammatically but seems overly exuberant for a gift shop. In the end, I guess I may have figured out what the designers meant, or I may not have figured it out. I’m sure there are other equally-likely ways to parse the sentences that I haven’t even tried. I have no idea. But if it takes more than a couple seconds to figure it out, that can’t really be a sign of a well-designed banner, can it? Posted by David at 1:01 AM | Permalink | Comments (12) Filed under: Advertising | Art | Design H2O OTC One of these is a medicine: The other is the logo from a bottle of Zephyrhills water that I bought recently. That’s right. It’s a brand of bottled water. But I can’t look at it without thinking it looks like a medicine logo. This label needs a redesign. Was “Zephyr Hills” too difficult to keep as two words? It looks like someone ran the formula Zyrtec + Syphillis and came up with Zephyrhills. I’ve come to call it Zephyrillin. Posted by David at 12:02 AM | Permalink | Comments (10) Filed under: Advertising | Design April 11, 2006 Boris Vallejo’s palette If you’ve ever walked through the science fiction and fantasy section of a bookstore, you’ve seen the artwork of Boris Vallejo. This weekend, I got to watch him create one of his paintings, a rather detailed picture of a dragon that he completed in only four hours. I attended an event called Art Out Loud at the Society of Illustrators where Vallejo, Julie Bell, Jon Foster, Dan Dos Santos, Gregory Manchess, and Adam Rex demonstrated their techniques to aspiring illustrators, and answered lots of questions. I think proceeds from the event go to the Society’s student scholarship fund, so it’s great that the artists were all so gracious. When Vallejo finished his painting, and everyone gathered around to admire the finished product, I noticed his palette sitting there. I realized that while millions are familiar with his work, few have probably seen his palette. So I took a picture of it. Perhaps it will provide insight or inspiration for those who were unable to attend the event this weekend. I’m told that his use of disposable palettes is significant, as the romantic notion of an artist would have him using a permanent wooden palette. Take note, students. Artist links: Boris Vallejo, Julie Bell, Jon Foster, Dan Dos Santos, Gregory Manchess, and Adam Rex. Bonus: Here are the palettes of Dan Dos Santos and Julie Bell: Posted by David at 1:23 AM | Permalink | Comments (7) Filed under: Art | Education | Favorites Flaky Advertising I saw this ad in a subway station yesterday: Um… isn’t that where all hair starts? Posted by David at 12:10 AM | Permalink | Comments (3) Filed under: Advertising April 10, 2006 How Google Book Search saved the day In late 2004, Google announced its Google Book Search feature, which allows internet users to “search the full text of books (and discover new ones),” according to the site’s main page. It’s a feature with enormous potential, but it immediately became controversial. As Wikipedia explains: While many hail the initiative for its potential to offer unprecedented access to what may become the largest online corpus of human knowledge, the publishing industry and writers’ groups decry the project as a wholesale rights-grab. The Authors Guild of America and Association of American Publishers have individually sued Google, citing ‘massive copyright infringement’. Being a person who creates intellectual property for a living, I clearly don’t support massive copyright infri"
