title = "Ironic Sans: July 2006 Archives"
full_description = "Entries for July 2006 July 31, 2006 60 Seconds in the Life of Clouds Part 15 in an ongoing series of (approximately) 60 second films. Posted by David at 11:47 AM | Permalink | Comments (5) Filed under: 60 Seconds | Travel Idea: Wear your DNA on your sleeve The other day I thought I saw someone wearing a shirt with a DNA pattern. When I got closer, I realized that the shirt just had little drawings of trees all over it. But then I got to thinking, why not? These days it’s not too expensive to get your “DNA fingerprint” made, right? Several companies, like DNA Artistry and DNA11 will already create custom artwork from your DNA, so why not take the technology in a different direction and make shirts? Having a pattern created from your DNA should be a simple step. Okay, it might end up being an expensive shirt, but look at that pattern. It’s futuristic, yet retro. It’s 1970s meets 2070. It’s pret-a-porté meets your DNA. And they make perfect gifts. Nothing says “I love you” better than your DNA on your loved one’s clothes, right? Previously: Pre-pixelated clothes for Reality TV Posted by David at 12:18 AM | Permalink | Comments (3) Filed under: Ideas | Science July 27, 2006 A parallel istaverse If you live in a major city anywhere in the world, there’s a good chance that there’s an “-ist” website covering your town. Beginning with Gothamist, covering New York City, the “istaverse” as they call it extends to Los Angeles, London, Shanghai, and beyond. Each “-ist” website has its own cute logo following the same theme: a few sillhouettes of buildings, other architecture or landmarks, followed by “citynameist.” Each one also features a different colorful background. The original Gothamist logo, above, was designed by Sam Park, of Tiny Factory. So I got to thinking. What if the “istaverse” people existed in fictional cities? I’m sure they would write about the new Starbucks being built in that up-and-coming neighborhood in Townsville, or some event being put on by that funky art collective in downtown Delta City. And I’m sure Bedrockist.com is where the Flintstones would point their, um, rockputer to see what the mayor said in his latest news conference about all those layoffs at the quarry. But what would the website logos look like? I imagine they’d look something like this: Bonus: There are two more that I didn’t think worked quite as well as those above, so I didn’t include them in the list. But you can click to see them anyway: Bonus 1 and Bonus 2 Update: Other -ists that I considered but rejected, partly because I couldn’t really think of any architectural icons to go with them at 2:00 this morning when I wrote this piece included Pleasantvilleist, Mayberryist, Funkytownist, Bumfuckist (oh, crap, I totally forgot — I was going to do a broken-down shack and some tumbleweeds for this one; oh well), CrystalLakeist, Dogpatchist, Grover’sCornersist, TwilightZoneist, and a few others. Was there a name for the town where the Smurfs lived? Update: I just added Lilliput. I couldn’t resist. Posted by David at 2:11 AM | Permalink | Comments (24) Filed under: Art | Design | Lists | Technology July 25, 2006 Animated Manhattan: An American Tail Part 11 in an ongoing series looking at New York City in animation. Don Bluth’s 1986 movie An American Tail tells the story of the Mousekewitz family’s immigration to America through New York City in 1886. Along the way, their son Fievel gets separated from the rest of the family. He spends the rest of the movie wandering through 1886 New York trying to find them. Oh, and did I mention that this is a family of mice? When the family comes to America, they go through Castle Garden, pictured at right, which was the immigrant processing station at the time. Ellis Island wouldn’t open for a few more years. Today, Castle Garden is known as Castle Clinton, and it still stands in Battery Park on the southern tip of Manhattan. But while Fievel’s family go through Castle Garden, Fievel lands at the still-under-construction Statue of Liberty. That’s where he meets Henri the pigeon, who designed the statue and hopes to finish building it before the movie ends. Feivel spends the next hour wandering around the lower east side. He hangs out on Hester Street, gets conned by a rat (you gotta watch out for those rats), makes friends with some other mice, almost gets run over by the 2nd Avenue El, and participates in an attempt to rid New York City of cats. All while searching for his family. Most of New York City in the background is kind of generic. There’s not much by way of recognizable landmarks. Of course, so much of Manhattan has changed that it would be hard to find anything recognizable anyway. But I did find this one nice detail. The full frame is on the left, with a close up on the right: That’s a menu from Delmonico’s in the background. Delmonico’s was the first restaurant in the United States, where Eggs Benedict and Chicken à la King were invented. If you don’t already know, you won’t be surprised to learn that Fievel does indeed find his family at the end of the movie. This happens to coincide with Henri’s completion of the Statue of Liberty. So he picks up Fievel and his sister and flies them around for an aerial view. That last shot of the Statue could never happen in real life, because the Statue faces East in reality. In the picture, she faces South. The closing credits of An American Tail have orange-tinted pictures of old New York City in the background, with the credits over them. I was immediately reminded of Fritz the Cat, the first movie I viewed in this series, which also utilized orange-tinted views of old New York City in the closing credits. This sickly-sweet movie wasn’t nearly as good as I thought it was when I was a kid. But it’s nice to see a historic version of New York City depicted in animation. IMDb Rating: 6.5/10 BCDb Rating: N/A My Rating: 7.5/10 (My rating is for the series’ depiction of NYC only) Posted by David at 12:47 AM | Permalink | Comments (1) Filed under: Animated Manhattan | Entertainment | New York July 24, 2006 Turn of the century racist jokebooks My friend and fellow photographer Brian Berman has been working on a series of portraits at off-beat conventions around the country. He recently came back from the Vent Haven Ventriloquists Convention where he purchased this book from 1902, Callahan’s Easy Method for Learning Ventriloquism Quickly. I wasn’t really too surprised by the racist depiction of the ventriloquist’s dummy on the cover, but I was surprised when I turned the book over and saw the advertisements on the back cover. The publisher, Wehman Brothers, featured a selection of racist joke books, available from their store in lower Manhattan. Some of the books are tame titles like Choice Riddles but then there are titles like Coon Jokes and Hebrew Jokes that would never fly today. Posted by David at 10:38 PM | Permalink | Comments (6) Filed under: Art | Entertainment | Politics Big Boggle box bears best board I’m really into Boggle these days. And I don’t mean that wussy 4x4 Boggle. No, I’m talkin’ about 5x5 Big Boggle. I know there are several on-line versions available, but nothing beats the fun of playing real people face-to-face, and the shake-shake sound of the cubes in the Boggle board. So I’ve been playing the real world game, and that’s when I noticed the Big Boggle game in progress on the Big Boggle box. I think that must be the best Big Boggle tray ever. How carefully did they have to plan it? It’s hard to believe such a great tray is even possible by chance alone. There must be tons of great words on that tray. Take a look and see how many you can find. Remember: This isn’t the wussy edition, so to make things extra tough we’re not only disallowing 3 letter words, but 4 letter words as well. So how many 5-letter or longer words can you find? For an added challenge, limit yourself to just 3 minutes. I’ll start things off: PREDATING, STEAMERS, BEIGNETS… And no fair using a computer program to figure it out. Just use your brain. Posted by David at 12:27 AM | Permalink | Comments (9) Filed under: Entertainment | Games | Language July 23, 2006 Green means stop. Red means go. Maybe I’m alone in this, but I find the website Rotten Tomatoes to be counterintuitive. Now don’t get me wrong, I find the site quite useful. I’m not highly critical of it in general. But this one thing throws me off every time. At Rotten Tomatoes, they collect movie reviews from across the internet, and use them to give movies a rating of either “fresh” or “rotten.” But every time I visit the site, I have to retrain my brain to use it properly. If a reviewer likes a particular movie, you see a brief quote from the review along with a picture of a fresh tomato. That’s right, there’s a big red circle, like say a stop sign or stop light, next to reviews that like the movie. If a reviewer doesn’t like a movie, you see a small quote from the review along with a picture of a splattered rotten tomato. So there is a big green asterisk-like star next to reviews that didn’t like the movie. So red circle means “Good movie” and green star means “Bad movie.” Okay, it’s not that big a deal, true. But every time I visit, I get thrown off by this. Posted by David at 10:25 PM | Permalink | Comments (9) Filed under: Design | Entertainment July 19, 2006 Idea: A “Critical Thinking” section on the SAT The College Board, which administers the SAT test, periodically makes changes to the SAT format. Most recently, they eliminated the analogies section and added an essay section. Well, I have an idea for a change that I’m very excited about. It would have profound implications, I think, if the College Board added a “Critical Thinking” section to the SAT. Critical Thinking skills are among the most important skills a person can have, but they aren’t taught very much in school. I’ve racked my brain trying to think how Critical Thinking could be made more important to students and educators. Making it an SAT category would go a long way. Every university would want students that score high in that section. And it would fit perfectly in test prep courses, too, because the types of questions on the test would be easy to study for. Just learn the basic forms of valid arguments and common fallacies, and learn to identify them in context. And as an added bonus, if you study well enough to answer the Critical Thinking questions on the test, you can apply Critical Thinking to real life, too. I’ve come up with a few examples to illustrate how I imagine the section. Different kinds of questions would test a student’s knowledge of basic argument and fallacy forms, and their ability to identify them. I’m not a test writer, and I’ve never taught Critical Thinking, so there may be problems with these examples from either perspective, but this is the basic idea: 1) If Tom is a cat, he is a mammal. Tom is a cat. Therefore, Tom is a mammal. This statement follows the argument form: a) modus ponens b) modus tollens c) straw man d) begging the question e) none of the above 2) In a double-blind study of 2000 men, 60% found Brand X medicine effective in alleviating their headaches. This statement shows: a) Brand X is effective because a majority of men’s headaches were alleviated when they used it. b) Brand X is ineffective because 2000 people are not statistically significant c) Brand X is effective because double-blind studies are always accurate d) Brand X is ineffective because only men were tested e) There is not enough information to know whether Brand X is effective 3) On the planet Syllo, there are Frebats and Lidgemonts. It is well known on Syllo that all Frebats are Twacklers. Betty lives on Syllo. Betty is a Twackler. Therefore, Betty is a Frebat. The conclusion “Therefore, Betty is a Frebat” is logically sound. a) True b) False 4) The “false dilemma” fallacy is sometimes called: a) the black or white fallacy b) the bifurcation fallacy c) the false dichotomy fallacy d) all of the above e) none of the above Posted by David at 1:52 AM | Permalink | Comments (11) Filed under: Critical Thinking | Education | Ideas July 18, 2006 How one man sent one e-mail and took down my entire website. And he didn’t even know it. [Note: In the following bit-too-long rant, some information has been changed to protect identities. But the name of my no-good, awful, deceitful former web host Doteasy has been left completely intact. Avoid them at all costs.] On June 23, I spent the day flying back to New York from a business trip in Los Angeles. Adam Sandler’s movie Click opened that day, and lots of websites were linking to an article I wrote about the movie’s overused plot device. It was a higher than usual traffic day for Ironic Sans. When I boarded my plane, web traffic was high. I arrived home after midnight. I was exhausted. I just wanted to follow up on a few e-mails, see where my traffic plateaued for the day, and go to bed. So you can imagine my state of mind when I checked my e-mail and found this from my web host: Hello David, We have received spam complaints regarding your website. Please note that the use of spam, sent from our email servers or to promote a website hosted on our service, is prohibited by our service policy and we strictly enforce a zero tolerance for spam. Our Service Terms and Conditions document may be viewed at the following URL: http://www.doteasy.com/Terms/index.cfm?T=TAC Due to the proliferation of SPAM abuse, we have no choice but to suspend your account from the Doteasy service due to a violation of the terms and conditions of the service. If your domain is registered through Doteasy, you may login to the Member Zone control panel to change your web host once you have found a new service provider. Regards, Miguel Doteasy Customer Service [ Offending message ] Return-Path: From: “TD” To: [x] Subject: Latest must-have fashion statement Date: Thu, 15 Jun 2006 20:47:04 -0400 MIME-Version: 1.0 Content-Type: text/plain; charset=”us-ascii” Content-Transfer-Encoding: 7bit X-Mailer: Microsoft Office Outlook, Build 11.0.5510 http://www.ironicsans.com/2006/03/ idea_prepixelated_clothes_for_1.html I was shocked. I hate spam. I wouldn’t send spam. I find spammers to be among the lowest forms of life. I have never sent a single mass e-mail about anything related to this website or pretty much anything else for that matter. No chain letters, no jokes, no urban legends, nothing. This did not come from me. This was some sort of misunderstanding. Looking at the “Offending Message” I could clearly see that it was not an e-mail I ever sent to anyone. For one thing, the header information says it was sent with Outlook. I don’t use Outlook. I do sell t-shirts on my site, but that’s meant to be funny more than anything else. It’s not the purpose of my site. If it makes a few dollars, that’s great, but this site isn’t a money making enterprise. I don’t sell Viagra, or Rolex replicas, or have any Nigerian money to offe"
