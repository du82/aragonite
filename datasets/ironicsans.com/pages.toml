title = "Ironic Sans: November 2006 Archives"
full_description = "Entries for November 2006 November 30, 2006 Those wacky Canadians I’m in Toronto today, and I’m staying at a hotel near a street called Avenue Road. But the zaniness doesn’t stop there. According to local legend (and by that I mean Wikipedia’s entry on the subject), the road got its name when the Lieutenant Governor was surveying the town, and he came to a point where he stopped, pointed north, and said in his English accent, “Let’s ‘av a new road.” Oh, Canada. Posted by David at 4:56 PM | Permalink | Comments (10) Filed under: Travel November 28, 2006 60 Seconds in the Life of Tae Kwan Do Class Part 19 in an ongoing series of (approximately) 60 second films. Posted by David at 8:33 AM | Permalink | Comments (2) Filed under: 60 Seconds November 27, 2006 Idea: Commemorative T-shirts for Fictional Events A friend of mine recently went to a convention for ventriloquists, and he brought me back a t-shirt from the event. It’s a nice enough shirt, but I feel weird about wearing it. I feel like I’m lying to everyone who sees me when I wear a shirt from an event I didn’t actually attend. Doesn’t wearing a shirt from an event make an implied statement that I was there? Well, that got me thinking. What if I came up with t-shirts for events that never really happened? What if there were t-shirts for conventions, expos, gatherings, parades, and celebrations that don’t really exist? What implied statement does that make, exactly? Well, now we can find out. I made a long list of imaginary events, and came up with t-shirt designs for nine of them. When I have time, maybe I’ll add some more. The ones I came up with are all available on t-shirts in the Ironic Sans store. So now you can wear a commemorative t-shirt from the following events that never really happened: (Children’s Sizes Only) Posted by David at 12:06 AM | Permalink | Comments (12) Filed under: Ideas November 20, 2006 By nobody who brought you Jurassic Park I know, I’m not supposed to judge a book by its cover. But that’s why the cover is there, right? It’s supposed to give me some sense of what the inside will be like. So when I found myself needing something to read on a recent flight, I picked up a book that jumped out at me in the airport terminal bookstore: Tyrannosaur Canyon by Douglas Preston. I remember being terrified by his brother Richard Preston’s non-fiction book The Hot Zone back in 1994, and I was passingly familiar with Douglas’ work with his writing partner Lincoln Childs. I’d read a few of the books they wrote together, and while they weren’t very memorable I don’t think I hated them. So how bad could this be? It was awful. I would have just left it on the plane, but then someone else might have picked it up thinking it looked good. The worst part is that I should have known better. As it turns out, all the warning signs I needed were right there on the cover the whole time. Had I paid them more attention, I would have realized that this book wants to be Jurassic Park more than any book has ever wanted to be another book. And a book that can’t stand on its own merits is probably not worth the time. Let’s start with the cover, designed by Howard Grossman of 12E Design. Right away, I noticed that it looks astonishingly like the cover of Michael Crichton’s book Jurassic Park, designed by Chip Kidd. That’s step one in the multi-part plan to appeal to Michael Crichton fans. Then, right there on the cover, comes step two, in the form of this praise by noted author Stephen Coonts: “If John Grisham had written Jurassic Park, he couldn’t do better than Tyrannosaur Canyon.” I’m not even sure what that’s supposed to mean. Turn the book over. There’s step three: “The stunning new masterwork from the acclaimed bestselling author, recently hailed by Publishers Weekly as ‘better than Crichton.’” And right below that, step four: “Michael Crichton wishes he could write half as well. -Library Journal” Can you guess what all the blurbs inside the front cover say? Publisher’s Weekly calls it “Crichton-worthy.” “He has combined the cutting-edge science of Michael Crichton and the thrills and chills of Stephen King…” say authors W. Michael and Kathleen O’Neal Gear. But this one’s my favorite: “I would put Tyrannosaur Canyon up with the best of Michael Crichton’s novels. This is the book Douglas Preston was born to write: a thriller that irresistibly combines cutting-edge science with night adventure. Whatever you do, don’t miss it!” - Lincoln Child, New York Times bestselling coauthor of Brimstone. They break up the quote’s credit so it looks like the quote comes from “Lincoln Child, New York Times.” The rest of the credit (“bestselling coauthor of Brimstone”) is on the next line. Can you guess who Lincoln Child coauthored Brimstone with? His frequent collaborator Douglas Preston! Isn’t your writing partner giving you that sort of praise sort of like your mom saying that she likes your new book? Posted by David at 12:21 AM | Permalink | Comments (3) Filed under: Design | Entertainment November 18, 2006 A museum recommendation and a recommendation for the museum Part I: A Museum Recommendation On Thursday I had a chance to attend a preview of a new exhibit called Magritte and Contemporary Art which opens tomorrow at the Los Angeles County Museum of Art. Of course, the art is impressive, including more than 60 works by Magritte, and another 60 or so by artists including Barbara Krueger, Andy Warhol, Jeff Koons, etc. But the exhibit installation is one of the best examples of museum space enhancing the artwork that I’ve ever seen. Designed by John Baldessari, the museum space is transformed into a surreal experience worthy of the artwork it contains. The floor is a carpeted Magritte-esque sky. The ceiling is covered with images of freeways. The guards all wear suits and bowlers, like they’ve stepped out of a Magritte painting. The entrance to the exhibit is a larger-than-life replica of Magritte’s painting The Unexpected Answer. When you enter the exhibit, it’s like walking into Magritte’s world. For a different exhibit, something like this could have been distracting, cheesy, or overbearing. But for this exhibit, it was just right. Part II: A Recommendation for the Museum After looking at the wonderful exhibit, I was thinking of buying the museum’s accompanying book. So I went to the gift shop to check it out. I’m sad to say that the paintings in the book are ugly. The colors are all wrong. I have experience photographing fine art for publication, and I know it’s tough to reproduce colors accurately, but we have the technology to at least come pretty close. But these were so far off that even someone unfamiliar with the paintings might wonder if that’s really what the artist intended. Some paintings had weird tints to them. Others were over-saturated. A painting with a deep blue nighttime sky was printed so light that it practically appeared to be daytime. The different colors changed the whole feel of the artwork. It was really unfortunate. I hope they can fix this problem for future print runs. Also, LACMA needs to check their cash registers. When I made a purchase, I received a receipt with the name of the museum misspelled. How long has it been like that? Someone should be paying more attention to detail. Update: The New York Times has a nice video about the exhibit including interview segments with John Baldessari. Posted by David at 10:51 AM | Permalink Filed under: Art | Design November 14, 2006 Louise Brooks’ 100th Birthday Today is the 100th birthday of silent film star Louise Brooks. She was a Ziegfeld Girl, a movie star, a recluse, a salesgirl at Saks Fifth Avenue, an author, and a rediscovered legend. In that order, more or less. She has been written about in hundreds of books, websites, and magazines since her heyday in the roaring twenties. If you’ve never heard of her, I recommend taking a look at the Louise Brooks Society website, which will lead you on a long path of books, articles, and movies you’ll rush out and read or watch. Check out their blog, too, for the most up-to-date information. There are Louise Brooks events happening all over this week, so check out your area to see what’s happening near you. The San Francisco Public Library seems to have a great exhibit going on. And wherever you are you might be able to find a screening of her most well-known film, Pandora’s Box, which is showing in a newly restored edition. It’s also being released this month in a special Criterion Edition DVD. Previously: Lou Costello’s 100th Birthday Posted by David at 9:53 AM | Permalink Filed under: Entertainment Idea: Use “apparent” when it’s not simply “alleged.” In America, a person is considered innocent by the law until he is proven guilty. When the media cover a case where someone has been accused of a crime but not convicted, they follow the same guideline. And they should. If the news calls someone an arsonist, for example, but he is later determined to be innocent, the news could get in trouble for defamation or slander. So the word “alleged” is used. Dictionary definition of alleged: “Asserted without proof or before proving.” That’s great. The media shouldn’t go around convicting people before they’ve had their day in court. But what if there is proof, but the legal process hasn’t yet taken its course? What if the suspect was caught red-handed? Sure, there might be circumstances not yet known that would shine a completely different light on the situation. But when there is known evidence, maybe “alleged” isn’t the right word. I propose “apparent.” Dictionary definition of apparent: “manifest as true on the basis of evidence that may or may not be factually valid.” Let’s look at some stories in the news. In Orange County, Florida police have arrested a man for running an “alleged pot-growing operation.” News footage shows a dozen or so large marijuana plants found in his home. Now, sure, I suppose it could turn out that they’re plastic plants and nobody realized it. Or that someone else put them there to frame him. But given the evidence on hand, I think it’s weak to call this simply an alleged pot-growing operation. It looks like an apparent pot-growing operation to me. This acknowledges that the evidence still may be shown to be invalid, but it calls the situation what it actually is. In Elmira, New York, an “alleged bank robber” is on the loose. A man approached two people making a deposit at an ATM, pushed them to the ground, and took their money. And he hasn’t been caught. Sure, it’s possible the victims made the whole thing up (the article doesn’t say whether or not the ATM’s camera caught all the action). But it seems to me that there is an apparent bank robber on the loose. [Note: This paragraph not for the squeamish] And in Hong Kong, tragedy struck a woman who had previously reported domestic violence. This time, she didn’t survive. According to reports, she called emergency services, screaming that there had been a murder, and then she got cut off. Police arrived in her home to find her and two others hacked to death. The article headline calls this an “alleged murder.” Surely it’s safe to call it an “apparent murder,” isn’t it? I understand the need to err on the side of caution. But the word “alleged” has an actual meaning. It’s not just a catch-all word to keep you out of trouble. There is another word that is just as cautious, and is often more appropriate. Apparently, not everyone sees it that way. Posted by David at 12:13 AM | Permalink | Comments (10) Filed under: Ideas | Language November 13, 2006 Interview: Louis Klein, audience member of nearly every episode of Saturday Night Live (The fourth in a series of occasional interviews with people I find interesting or who work on interesting projects.) Fifteen years ago, I spent a Friday night camped out on the mezzanine level of 30 Rockefeller Center, hoping to get one of the standby tickets to Saturday Night Live that are handed out on Saturday mornings. The line forms at around 8:00 Friday night. That’s when I met Louis Klein, the SNL fan who had seen almost every episode of Saturday Night Live in person, going back to the very first episode. Last Friday, I decided to go back to the SNL Standby Line and see if Louis was still waiting in line to get his ticket. In the years since I camped out there, the line had moved from the warmth of the indoor mezzanine to the chill of 49th street, but Louis was still there, right behind a group of teenagers who beat him to the first spot (one of the teens asked about my website, “Ironic Sans? Does it have anything to do with Horatio Sanz?”). When Louis stands in line these days, he is accompanied by his wife Jamie, whom he met on-line around six years ago. And by “on-line” I mean on the internet, not the standby line. I spoke with Louis about his SNL Standby hobby. When Saturday Night Live started, nobody knew it was going to be a big hit. Why did you go to the first episode of a new show that nobody really knew? Louis Klein with his wife JamiePrior to SNL, I was going to a lot of game shows. Like, I watched the game show called Jackpot, which was done in Studio 8H prior to SNL. It ended its run in the summer of ‘75, hosted by Geoff Edwards. I was also going to the Pyramid — any one of them, whether it was 10, 20, 25, 100 thousand, 2 cents, you know, whatever it was. I went to all of them over at TV-15 which doesn’t exist anymore. Any game shows that were done here, if any, I went to them also. So I was notorious as far as NBC was concerned. They knew who I was because I went to all the shows. Then in April of ‘75 I found out that the show SNL was coming up, so I went to the Guest Relations department and said I hear you’re doing this show. They said, Well, they want 500 people in 8H. They want to do a show that’s going to be a run through for sound purposes. We’re going to have an audience for that, and you can float around the building and find somebody who’s going to give out standby tickets. So I come over here right after work, and I found the standby ticket and I got it and I went inside and I stood in line. I got upstairs. I saw a full fledged comedy routine by George Carlin. I saw a full fledged comedy routine by Billy Crystal. I saw performances by Janis Ian and Billy Preston. I saw comedy by the Not Ready for Prime Time Players including Jon Belushi and Gilda Radner among others. Now that’s three and a quarter hours of pure entertainment for free. And I could come back tomorrow night. And I did. And I got in a second time. I came back the following week and I didn’t get into the second show but I wasn’t going to give up at this point. This is a great thing to do on a Saturday night. I went to the third show, I got in, and in the first 5 years I’ve seen 59 out of 106 [episodes]. At what point did you realize it was turning into something you were making a regular routine? I never really thought of it that way at that particular time. It was "
