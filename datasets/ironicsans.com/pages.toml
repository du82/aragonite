title = "Ironic Sans: Idea: Ironic Sans"
full_description = "February 19, 2006 Idea: Ironic Sans Thinking about different fonts one day, I decided that “Ironic Sans” would be a good name for a serif font. Maybe one day I’ll get around to designing it. In the mean time, I think it makes a good name for my blog. “Ironic Sans,” the blog, is a place for me to write about art, culture, technology, law, politics, current events, critical thinking, and other topics that appeal to me. I will have a number of regular features on this site, and various articles long and short as they come to me. I hope you enjoy. Posted by David at 4:30 PM | Permalink Filed under: General | Ideas Return to Main Page Comments Frist! Posted by: Jough Dempsey | April 12, 2008 12:49 PM Great name for a typeface (and blog)! :) Posted by: Charles Darke | July 11, 2008 8:55 AM Despite the fact that the name would actually mean that the fontface is sans-serif, I do really enjoy your blog. Posted by: Blude | August 31, 2008 8:53 PM @ blude: hence “ironic.” Posted by: sabine | September 12, 2008 7:48 AM David, glad I found your blog. The design and your inspiration for the name is top rate. Excellent job. Posted by: Doug C. | September 13, 2008 2:34 AM Fascinating Blog in terms content and cross pollination of ideas.. Posted by: Entropy | November 13, 2008 11:33 PM http://typophile.com/node/13536 I have started a font design in 2004 with the name Irony Sans. I was just googling it and found your website. I, too, found the name amusing. Let our serif and sans-serif typefaces be friends then :) The name came after I designed a logo for a fictitious park I named Irony Park. It was a park surrounded by industries and pollution in NYC. Posted by: Rodrigo | July 12, 2009 10:41 AM I REALLY hope you do an ironic sans. That would be the best font ever. Posted by: paul | July 12, 2009 11:37 PM excellent work. I appreciate that you are tackling big concepts that cover a wide breadth of human inventiveness and creativity. You are forgiven for using moveable type :) Posted by: ari salomon | October 14, 2009 2:59 AM I’ve hidden this post in your archive so that it doesn’t garner the unnecessary attention of your entire breadth of followers. Quite simply, I’ve enjoyed your blog for over a year now. As a film student over in California, I especially appreciate your one minute videos. For whatever reason (maybe you’d be more apt to pinpoint it) I got the impulse to share with you a piece of mine that, based on your one minute observations, I think you’d respect. I’ve strapped a flip camera to a bungee cord which I’ve spun and recorded over a day of mine in Santa Cruz, California. http://www.vimeo.com/11491269 Posted by: Zak Scott | July 19, 2010 4:10 AM The name of your blog reminded me of what I’ve long thought was missing from the font market: subliminal fonts and mood fonts http://utopiaforcynics.wordpress.com/2010/07/22/writtenonmyface/ Posted by: kefuoe | January 11, 2011 10:17 AM"
