["https://ishares.com/us/insights/flow-and-tell-october-2024"]
title = "Flow & Tell – October 2024 | iShares – BlackRock"
description = "October delivered standout flows – we saw sharp moves in both equity and bond markets, and we examine ETF allocations to gauge investor positioning."
full_description = "OCTOBER FLOWS The looming election is likely the headliner of the fall, but October delivered a festival’s worth of supporting acts in both macro and micro releases. Economic data continued to surprise to the upside across consumer, labor, and housing prints, all while Q3 earnings kicked off with resilient reports. Here’s what that meant for the top ETF flows of the month: ADDING TO ACTIVE October saw a sharp increase in yields and a dramatic bond selloff, with 10-year Treasury yields climbing 55bps since the September Federal Reserve meeting.1 The increase follows stronger-than-expected data pulling 3Q GDP to a robust 2.8%, above the Atlanta Fed’s GDPNow forecast at the start of the month.2 Fixed income ETF investors turned to active solutions to navigate the rapidly evolving rate backdrop. October marked the largest month of inflows ever into the exposure, with active fixed income ETFs adding $4.1bn, nearly double the YTD monthly average.3 Figure 1: Monthly active fixed income ETF flows Source: BlackRock, Markit. ETF groupings determined by Markit. As of 10/28/2024. Chart description: Bar chart depicting monthly active fixed income flows from January to October. SECTOR OUTFLOWS: TECHXIT October partially unwound overweight tech allocations: nearly $2.5bn came out of tech funds in the past two weeks, the second biggest two-week outflow in the past 18 months.4 Investors reducing tech bets did not translate to outflows in tech-adjacent pockets. Consumer discretionary ETFs saw dramatic inflows, adding their biggest weekly flow in three years, following Tesla’s 3Q earnings results. Notably, the two sessions after Tesla’s report saw more inflows than all third-quarter flows combined. Positioning reflects recent price action — in the last two weeks of the month, tech gave up earlier gains to sink into negative territory while consumer discretionary led to the upside. The real estate sector also outperformed the S&P 500, and flows followed, with real estate funds having clocked net inflows every week since the end of May."
author = "kakullia"
year_published = 2024
