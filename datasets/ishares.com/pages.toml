["https://ishares.com/us/insights/trump-policies-and-tariffs"]
title = "The Potential Portfolio Impact of Trump Policies & Tariffs | iShares"
description = "We discuss the recent announcement by the Trump administration regarding new tariffs and what it could mean for the market."
full_description = "KEY TAKEAWAYS The Trump Administrations 's second term brings new trade policies that could affect investors. While we remain pro-risk in the U.S. at the headline level, we believe understanding these potential changes is key to managing risk and identifying opportunities in the administration’s first 100 days and beyond. The impact of tariff policies will vary by industry and depend on the scope, implementation, and duration of the policies. Firms with complex global supply chains, manufacturing abroad, and major exposure to revenue generation in the U.S. are most vulnerable. For investors who want to position their portfolios around tariff risks, there are three ways investors can try to insulate their portfolios from changes in tariff policy and subsequent headline volatility: increase diversification, mitigate geopolitical risk, and manage volatility. INTRODUCTION Donald Trump’s second term as President brings with it new priorities and shifts in policy that may have significant implications for investors. The new administration looks to use tariffs as a key policy tool, going beyond addressing a range of issues like reducing trade deficits and encouraging inbound investments in U.S. manufacturing. The administration will use tariffs to raise revenue and for leverage in negotiations that go beyond trade/investment. The scope, implementation, and duration of U.S. tariffs – and any retaliatory actions by other countries – remains highly uncertain. But firms with complex global supply chains, manufacturing abroad, and major exposure to revenue generation in the U.S. are the most vulnerable. We maintain our pro-risk stance in the U.S., as outlined in our 2025 Investment Directions. But in this dynamic policy environment, we believe investors should remain nimble and consider hedges that could help insulate portfolios. TARIFFS SIGNAL GLOBAL TRADE SHIFT Uncertainty around the scope and implementation of tariffs is high. What’s key for markets is how long they last: the longer they hold, the more permanent the supply chain shifts. Legal challenges could delay implementation and add to market volatility. How countries retaliate is also important – and could draw further U.S. escalation. We believe that these actions, and their ripple effects, could dent corporate and investor confidence. The broader implications could be larger than the direct effect, in our view. Prolonged tariffs as proposed, and how countries retaliate, could hurt growth and add to inflation, leaving the Federal Reserve limited flexibility in their policy rate decisions. In markets, we think U.S. equities could come under pressure in the next few months as investors seek additional compensation for these risks. More broadly, resilient economic growth, solid corporate earnings, potential deregulation, and the AI mega force keep us positive on a six- to 12-month tactical view. We feel that markets could eventually adjust to a new regime of tariffs if growth stays solid and inflation contained. Read more about how tariffs are signaling a shift in global trade here."
