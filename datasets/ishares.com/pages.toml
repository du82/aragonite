["https://ishares.com/us/investor-education/etf-education/etfs-vs-mutual-funds"]
title = "ETFs vs. Mutual Funds – A Comparison | iShares"
description = "Explore the fundamental differences between ETFs and mutual funds to enhance your financial strategy and pursue long-term investment objectives."
full_description = "ETFs AND MUTUAL FUNDS: THE BASICS Exchange Traded Fund (ETF): an exchange-traded fund is an investment vehicle that pools a group of securities into a fund. It can be traded like an individual stock on an exchange. Mutual fund: a mutual fund is a professionally managed portfolio of stocks, bonds and/or other income vehicles devoted to a specific investment strategy or asset class. When investors buy shares in the fund, the mutual fund company pools that money to make investments on their behalf. A share represents a portion of the fund's holdings. KEY SIMILARITIES BETWEEN ETFs AND MUTUAL FUNDS Exchange Traded Funds (ETFs) and mutual funds are two of the most popular ways for investors to access the financial markets. Before getting to the differences, here are three critical elements ETFs and mutual have in common: Diversification One, both ETFs and mutual funds are financial instruments that typically own a basket of securities rather than individual stocks or bonds, providing an important benefit to investors: diversification. Although everyone’s financial goals are unique to them, the primary goal of investing is typically to generate the highest possible return for the lowest risk. By spreading your investments across asset classes, geographies and sectors – not putting all your eggs in one basket, that is – you may lower the overall risk to your portfolio. That’s because the poor performance of one investment could be offset by stronger performance in another, and vice versa. Diversifying is one of the best ways for investors to navigate fast-changing markets and stay the course to pursue their long-term financial goals. Strategic options Two, both ETFs and mutual funds can be either “index” funds, meaning they are designed to track the performance of an index, like the S&P 500, or “active”, where the managers have discretion to buy and sell different assets when they see potential opportunities. Both active and index funds are professionally managed, but active ETFs and mutual funds typically require more monitoring and trading by the managers, which can result in higher fees. Variety of Investing Styles Three, both mutual funds and ETFs come in a wide variety of assets and investing styles. For instance, you can find both equity ETFs and mutual funds that invest in specific sectors, such as technology, as well as ones that provide exposure to international stocks, including regional, country-specific and sector-focused ETFs. In addition, there are equity ETFs and mutual funds that focus on factor-based strategies (a.k.a. “smart-beta” investing) such as quality or momentum. The same variety of options – in both mutual funds and ETFs – can be found in other asset classes, including bonds and commodities. There are also mutual funds and ETFs that aim to offer “all in one” portfolio solutions, meaning combinations of stocks, bonds and other assets. iShares Core Allocation ETFs, for example, make it possible to invest in a diversified portfolio for as little as $1 if you buy fractional shares of iShares at Fidelity. For all their similarities, there are big differences between ETFs and mutual funds, which potentially have major implications for investors."
