["https://ishares.com/us/insights/2025-thematic-outlook"]
title = "2025 Thematic Outlook: AI & Geopolitics | iShares – BlackRock"
description = "Chart description: Graphic showing that the proportion of the U.S. population aged 65 and older has risen from 12% in 1985 to an expected 20% in 2030."
full_description = "KEY TAKEAWAYS Modest rate cuts could support sensitive assets: Recent fed rate cuts could start to take pressure off interest rate sensitive companies and non-cash-flowing1 assets. This presents potential tailwinds for biotech stocks, bitcoin, and gold. Rebuilding the U.S. physical economy: Themes centered around rebuilding the physical economy, like infrastructure, manufacturing, and homebuilding may be better poised to benefit in the post-election environment, as they sit at the intersection of policy tailwinds and structural changes. AI’s build phase accelerates: Massive investment in AI infrastructure as well as ever more powerful chips and models, are laying the groundwork for increased adoption. The iShares Bitcoin Trust ETF is not an investment company registered under the Investment Company Act of 1940, and therefore is not subject to the same regulatory requirements as mutual funds or ETFs registered under the Investment Company Act of 1940. This information must be accompanied or preceded by a current iShares Bitcoin Trust ETF prospectus. Please read the prospectus carefully before investing. AI AND GEOPOLITICS CONTINUE TO DRIVE MARKETS In our 2024 Thematic Mid-Year Update, we honed in on AI & geopolitics as the two main mega forces driving market narratives. Indeed, these two themes stayed in the limelight for virtually all of 2024 and we believe are likely to remain in primary focus for 2025. Yet a new backdrop to these themes is emerging featuring interest rates coming down from their highest levels in over 20 years, an evolving public policy agenda, the continuation of major demographic shifts, and ever more powerful AI chips and models. In this 2025 Thematic Outlook we seek to identify how these emerging tailwinds may create new opportunities for investors this year and beyond. MODEST RATE CUTS COULD SUPPORT RATE-SENSITIVE COMPANIES AND ASSETS From March 2022 to September 2024, the markets entered a period of quickly rising and elevated interest rates, bringing the federal funds rate to its highest levels since 2001.2 This environment punished rate-sensitive investments on two fronts: companies with long paths to profitability saw valuations contract given higher discount rates, and; firms dependent on floating rate debt or that had to roll over maturing debt were hurt by higher financing costs. Additionally, non-cash-flowing assets like bitcoin and gold faced pressure from rising opportunity costs compared to holding interest-paying assets like bonds. Now these headwinds could abate; The Federal Reserve has cut rates by 75 basis points3 as of November 2024, and while rates may not return to pre-pandemic levels, a path of additional modest rate cuts is anticipated by the market for 2025.4 Medical innovation gets a shot in the arm Higher rates have had a particularly negative impact on biotech firms by shrinking valuations and driving up borrowing costs, causing many companies to reduce R&D spending. Should rates continue to fall, it could reduce financing costs and potentially give biotech firms more confidence to expand R&D budgets. Increased spending combined with the potential introduction of AI to the discovery and trial process, could lead to a surge in drug development. AI is already being tested in drug discovery to predict protein structures and chemical reactions, as well as to conduct drug trials in automated labs and digital “in-silico” experiments. By 2025, over 30% of new drugs are expected to be discovered using generative AI techniques, potentially saving biotech companies 25% to 50% in time and costs from discovery to preclinical stages.5 Such innovation couldn’t come at a more critical time; ageing populations, particularly in developed markets, are bolstering demand for many drugs and treatments in categories that disproportionately impact seniors. Breakthroughs like personalized cancer vaccines6, treatments that could eliminate the need for insulin therapy in diabetics7, and intravenous antibody treatments that could slow the rate of cognitive decline with Alzheimer’s patients8 appear to be on the horizon. These revolutionary treatments could also drive a surge in mergers and acquisitions. Large pharmaceutical companies looking to refresh their product offerings amid an anticipated major patent cliff9 for existing blockbuster drugs could further support biotech valuations."
author = "jonjacob"
year_published = 2024
clearnet = "https://ishares.com/us/insights/2025-thematic-outlook"
