title = "Getting Exposure to Digital Assets via the Bitcoin Bridge | iShares"
description = "Unlock the potential of digital assets investing with insights into Bitcoin ETPs and innovative approaches to strategic portfolio diversification."
full_description = "KEY TAKEAWAYS Bitcoin exchange-traded products (ETPs) are facilitating greater exposure for investors who had been interested in crypto but wanted a familiar and efficient wrapper. In their first year, spot bitcoin ETPs have drawn unprecedented demand, accumulating over $105 billion in assets under management (AUM) across various issuers.1 The iShares Bitcoin Trust ETF (IBIT) became the fastest ETP to reach several milestones, including $50 billion AUM.2 Bitcoin ETPs have paved the way for more innovation in getting exposure to digital assets, including the launch of Ether ETPs, such as the iShares Ethereum Trust ETF (ETHA) and options on IBIT, giving investors more tools to participate in digital assets. INTRODUCTION: ONE YEAR OF DIGITAL ASSET ETPs When spot bitcoin exchange-traded products (ETPs) first launched in the U.S. on Jan. 11, 2024, it represented the creation of a proverbial bridge from traditional finance into bitcoin. Prior to the launch of bitcoin ETPs, U.S. investors primarily accessed digital assets through crypto exchanges, which often came with operational, tax and custody complexities. Based on the unprecedented demand for bitcoin ETPs, it seems a wide variety of investors — from individuals to institutions — had been interested in crypto but wanted a familiar and efficient vehicle in which to get exposure. Wrapping digital assets like bitcoin — the world’s largest digital asset by market cap3 — in regulated financial instruments such as ETPs helped investors get exposure to these assets through trusted providers like iShares on familiar platforms like Fidelity. (Learn more about how to buy ETPs.) This bridge to bitcoin has proven to be a two-way street. While traditional investors have moved into digital assets via bitcoin ETPs, some investors previously focused only on digital assets are opening traditional brokerage accounts and using ETPs, possibly for the first time. This is creating an on-ramp for them to diversify portfolios across other asset classes, a cornerstone of long-term investing success."
