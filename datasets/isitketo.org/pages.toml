["https://isitketo.org/soy-sauce"]
title = "Is Soy sauce Keto Friendly? | Is it Keto"
description = "Common varieties of soy sauce are keto-friendly, though there are many you should avoid. If you want an even lower-carb alternative, consider liquid aminos."
full_description = '''Answer: Common varieties of soy sauce are keto-friendly, though there are many you should avoid. If you want an even lower-carb alternative, consider liquid aminos. Fortunately, most of the most popular brands of soy sauce contain 1 g of net carbs or less for each 1 tablespoon serving. This makes it easy to fit into the keto diet as long as you're careful with your portion sizes. Even if you love the taste, resist the urge to drown your plate in soy sauce. Soy sauce originated in China. Originally, they made it by fermenting soy beans, but as the food spread to Japan and other parts of the world, other ingredients have been added. There are several major categories of soy sauce, and they're distinguished by the country of origin, the ingredients used, and the consistency of the sauce, from thick to thin. Tamari is made mostly from soybeans with little to no wheat products. People who keep gluten free often choose tamari as their soy sauce of choice, but not all tamaris are gluten-free, so always check the label. Chinese light soy sauce is the most common type of soy sauce you'll find in Chinese restaurants and recipes. Usually, if a recipe refers to "soy sauce," without specifying light or dark, you can assume they're referring to light soy sauce. Historically, light chinese soy sauce was made entirely from soy beans, but some varieties now contain wheat. Nevertheless, most brands of light Chinese soy sauce contain 1 g or less of net carbs per tablespoon. Koikuchi, or dark Japanese soy sauce, is one of the most popular varieties of soy sauce in the US. It's made with a mixture of wheat and soy, but the wheat content is low enough that the carb count is still generally ~1 g of net carbs per 1 tablespoon serving. Dark Chinese soy sauce is less common than its light counterpart, but most brands add sugar or molasses for flavor. There are a few keto-friendly brands of Chinese dark soy sauce, but check the label carefully to avoid ones with sugar-heavy ingredients. Ukusuchi is a milder tasting of soy sauce, but it's made with mirin, a type of rice wine, so it generally has more sugar than other types of soy sauce.'''
