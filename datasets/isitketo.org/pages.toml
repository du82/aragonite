full_description = "Answer: Sadly, Nutella is not keto friendly. It's packed with sugar, but there are keto-friendly alternatives that are almost as good. Nutella has developed a cult following. You either dislike Nutella or you love Nutella; there seems to be no middle ground. Fans of this chocolate hazelnut spread love it on everything, from pancakes to waffles to crepes. We've heard of some people who even add it to their scrambled eggs (we're not judging). Sadly, this chocolatey spread is almost entirely sugar, so it's incompatible with the keto diet. A 2 tablespoon serving contains 21 g of net carbs, a gigantic amount that alone could bust you out of ketosis. The most direct replacement for Nutella is a low-carb substitute product called Nutilight. They make their dark chocolate variety with erythritol and stevia, so it's only 1 g of net carbs per 2 tablespoon serving, but their hazelnut-flavored Nutella-taste-alike is only slightly higher, at 2 g of net carbs. If you're looking for a topping for your low-carb pancakes, you can also try keto-friendly maple syrup replacements. Some options include Birch Benders Magic Syrup (2 g of net carbs per 1/4 cup serving) or Pyure Organic Maple-Flavored Syrup (4 g of net carbs per 1/4 cup serving)."
