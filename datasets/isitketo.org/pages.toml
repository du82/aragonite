title = "Is Spam Keto Friendly? | Is it Keto"
description = "Despite its unglamorous reputation, Spam is low in carbs and keto-friendly."
full_description = "The Hormel Foods Corporation created Spam in 1937 to sell more pork shoulder, the worst-selling cut of pork. Then, during World War II, the U.S. government sent Spam to the troops because it was easier to deliver than fresh meat. After the war, soldiers returned home with a taste for this odd product, and Spam has adorned grocery store shelves ever since. Canned ham may not be the prettiest protein, but it's good for keto eaters since a 2 oz serving has only 1 g of net carbs. You can eliminate Spam's notoriously slimy texture by frying it for a keto-friendly sandwich or dicing it like bacon and adding it to eggs. There are several varieties and flavors of Spam that vary in keto-friendliness. Classic, Bacon, Turkey and Hickory Smoke Spam are each only 1 g of net carbs per 2 oz serving. Hot and Spicy, Jalapeno, Chorizo, and Black Pepper are slightly higher in carbs, at 2 g of net carbs per serving. With 5 g of net carbs, Teriyaki Spam is the highest carb flavor, though this is still relatively keto-friendly. Finally, consider Spam Less Sodium if you need to reduce your sodium intake but want similar macros to Classic Spam."
