full_description = '''Answer: Broccoli rabe is one of the most keto-friendly vegetables you can find. At a mere 0.3 g of net carbs per serving, it has the versatility to fit into almost any meal. Broccoli rabe is a bitter green vegetable that often appears in mediterranean and Italian recipes. Sometimes referred to as "rapini," it's a popular vegetable in the keto community due to its rich nutrients and low carb count. Each serving of broccoli rabe (1/4 bunch cooked) contains 0.3 g of net carbs. That makes it one of the most keto-friendly vegetables you can find. Broccoli rabe contains 18% of your daily value of vitamin B6, which supports cardiovascular health and strengthens your nervous system. It contains 45% of your daily value of vitamin C, an essential antioxidant that can help prevent cardiovascular disease. It delivers 19% of your recommended daily value of folate, an essential B vitamin that may lower your risk for certain cancers. Broccoli rabe is a cruciferous vegetable, a family of crop species that includes kale and broccoli. Scientists are interested in cruciferous vegetables because of evidence that suggests that they contain compounds that prevent cancer. More research is needed, but several studies have found that people who consume cruciferous vegetables like broccoli rabe are less likely to develop lung or colon cancer.'''
