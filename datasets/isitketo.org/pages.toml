full_description = "Tuna is a zero-carb food, making it a great protein if you're staying keto. Even canned tuna is keto-friendly, so it's an affordable and convenient option for meals. When shopping for tuna, stick to plain tuna in water or oil. Check the label before buying any varieties with special flavorings. Tuna is a wonderful source of omega-3 fatty acids, an essential fat for a healthy diet. One study showed that omega-3s improve the function of your heart, blood vessels, and arteries. Tuna is also rich in potassium, which reduces your risk of kidney stones and osteoporosis. Need ideas for a healthy tuna dish? Search for recipes like tuna casserole, low carb tuna salad, or cucumber tuna sushi rolls. Though contaminants are a concern for any seafood, the risk from pollutants is small for most species of tuna. Canned light tuna (including skipjack tuna) is the safest to consume. The FDA also considers albacore, yellowfin, and white tuna to be safe. Avoid bigeye tuna, as recent studies have shown that it contains high levels of mercury. Young children, pregnant women, and women who are breastfeeding should adjust their consumption of seafood based on the latest available FDA recommendations."
