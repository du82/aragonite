full_description = '''Metamucil is a brand of psyllium husk, a natural fiber that can treat digestive issues, including constipation. There are several varieties of Metamucil powder. Unfortunately, none of them are keto-friendly. The original varieties contain sucrose (sugar), which is a big no-no on keto. Metamucil claims that their "premium blend" and sugar-free varieties are keto-friendly, but a careful look at the ingredients reveal that their primary sweetener is maltodextrin, a non-keto sweetener. The Metamucil fiber wafers break keto as well, as they contain fructose, rolled oats, and wheat flour. Instead of Metamucil powder, try their Fiber supplement capsules. They contain only psyllium husk and coloring agent. The total carb count is 2 g, but that comes entirely from fiber, so these pills have zero net carbs. Metamucil is just branded psyllium husk with some additives. If you want to increase your fiber intake without the non-keto junk, just buy plain psyllium husk powder. Without any added sweeteners, it's perfectly keto-friendly.'''
