title = "Donate | ISKME"
full_description = "Support ISKME Grassroots donations from people like you help us keep the Commons vibrant, and support ISKME in striving for equitable access to education globally. Please consider making a donation to ISKME today. ISKME, a 501(c)(3) nonprofit corporation, has fostered a globalcommunity addressing the biggest opportunities and challenges facing education today. We enable educators to thrive by supporting their ability to collaborate, design, curate, and lead innovation. We connect educators with ideas, trainings, and tools, providing opportunities that strengthen their professional practice-with the goal of making education more inclusive and relevant to learners. A few short stories from inspired and inspiring educators. Tim Farquer first came to ISKME in 2012, as part of a year-long Fellowship program funded by the William and Flora Hewlett Foundation. As super-intendent of a small rural district in Illinois, Tim describes ISKME’s approach to open educational resources (OER) and training as the catalyst for advancing his own professional development, and for building capacity in his school commu-nity for curriculum improvement and innovation. Jennifer Maddrell has been using OER Commons to create MOOCs in the field of adult education. As the Chicago-based Founder of Designers for Learning, Jennifer highlights the impact of ISKME’s OER Commons collaborative toolset on the massive open online courses(MOOCs), and on the service learning opportuni-ties that her organization facilitates for educa- Advanced settings. David Harris helps to model the strength in col-laboration among OER partners. As Edi-tor-in-Chief at OpenStax, Rice University, TX, David underscores ISKME’s role across the OER ecosystem, from a holistic approach to open education and curriculum reform, to the OpenStax Hub (a Community of Practice for OpenStax users) on OER Commons. OpenStax currently has 27 textbooks that are used in 3,500"
