title = "OER in Texas Statewide Playbook; A Holistic Approach to Systems Change | ISKME"
full_description = "OER in Texas Statewide Playbook; A Holistic Approach to Systems Change by Team ISKME | Mar 27, 2023 The Open Educational Resources (OER) in Texas Statewide Playbook is a resource developed by practitioners and advocates actively involved in the labor of open education to guide new and expanding OER work at institutions of higher education. The Playbook is the result of partnerships between the Division of Digital Learning, the Institution for the Study of Knowledge Management in Education (ISKME) – creators of OER Commons and experts in open education practice and research – and faculty, librarians, staff, and administrators from institutions and systems across Texas. It aims to support institutions as they work to build capacity and drive systems change around OER. It also serves as a guiding document for institutions that have not yet engaged in OER work or taken advantage of existing programs and opportunities. The hope is that the Texas OER Playbook will serve as a companion on the journey towards OER awareness and advocacy at your institution. See the full playbook here."
