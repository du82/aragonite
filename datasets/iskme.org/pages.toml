["https://www.iskme.org/celebrating-season-1-educating-to-be-human"]
title = "Celebrating the Completion of Season 1: Educating to Be Human | ISKME"
full_description = "Celebrating the Completion of Season 1: Educating to Be Human by Team ISKME | Jan 3, 2025 | Blog We are celebrating the completion of Season 1, with 10 episodes of the “Educating to Be Human” podcast series. They are meant to be thought-provoking and engaging, and to shed light on the idea that creation and curiosity–essential superpowers of humans–can be harnessed to create a more humane world. As educators, we think a lot about how to do that–in both formal and informal education settings–from the classroom, to the everyday circumstances we find ourselves in. These 10 episodes below feature remarkable individuals who wake up thinking about how to best leverage our innate desire for community and connection. Ep 1: Monsters – Erin O’Connell Ep 2: Taking off the Mask – Ashanti Branch Ep 3: The Power of Place – Ruth Mostern Ep 4: Teaching Democracy – Joel Westheimer Ep 5: Building Creative Spaces – Nina Barbuto Ep 6: Yes, And; Improv – Chris Miller Ep 7: Language Matters – Mihalis Eleftheriou Ep 8: Paying the Price – Sara Goldrick-Rab Ep 9: Answering the Call: Young Men in the Pre-K Classroom – Julius Cave Ep 10: Beyond Recidivism, Higher Education in Prison – Jody Lewen You can also tune in wherever you listen to podcasts (Spotify, Apple Podcasts, etc). Stay tuned for Season 2 in early Spring 2025 for fresh voices and more amazing guests!"
