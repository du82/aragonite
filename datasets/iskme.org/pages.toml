full_description = "Join Our Team No Results Found The page you requested could not be found. Try refining your search, or use the navigation above to locate the post. What’s it like to work at ISKME? Our staff of educators, librarians, researchers, developers, and organizers hail from around the country – and the world. We’re a passionate and dedicated group of individuals that care about making an impact in the world. In keeping with our larger mission of equity and inclusivity in education, we also strive to build a healthy culture internally, as described here: “It hasn’t always been easy to push the education system beyond its comfort zone, both in the United States and around the world, but together we’ve kept true to our vision for an education system that is participatory, equitable, and open. We’ve worked from the bottom up, building a grassroots movement to make our vision a reality. We’ve worked from the top down, supporting federal and state policy for open education. As a collaborative team, we modeled the changes we sought, and have been at the forefront of an international community of edu- cators and leaders to advocate for open education and to equitably improve teaching and learning for all.” Lisa Petrides ISKME CEO"
