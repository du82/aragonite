["https://www.iskme.org/knowledge-sharing-and-innovation"]
title = "Knowledge Sharing and Innovation | ISKME"
full_description = "Knowledge Sharing and Innovation ISKME brings deep research-based expertise and experience to the facilitation of knowledge sharing and community building. Our team is skilled at bringing together leaders, practitioners, and other experts and learners across the field of education to collaborate and share knowledge, data, and resources so others may benefit. From communities of practice for open education implementers, to convenings and networks for policymakers, administrators, and funders, ISKME’s approach is to offer the necessary toolset, facilitate new ways to engage and learn, and by so doing, spark ideas that can result transformational change and in continuous improvement in education. ISKME also brings a unique approach to facilitating innovation through its problem solving and design thinking methodology, known as Action Collabs. Action Collabs help groups discover innovative fixes to practical problems and create real value for educators and learners. ISKME’s Action Collab framework is a collaborative approach to problem-solving that combines human-centered design thinking concepts with improvisation techniques to unlock a group’s creativity and capacity for innovation. Spotlight on #GoOpen National Network As the former partner with the U.S. Department of Education’s federal #GoOpen initiative from 2018-2021, ISKME took the helm in 2022 to transition the network to a community-led model of leadership and governance and the only national affiliation dedicated to K-12 open education. ISKME, together with Foresight Law + Policy, CAST, and a steering committee of OER leaders, set goals for leveraging a collaborative community coalition to create a renewed national K-12 open education network. Now known as the #GoOpen National Network, ISKME created and maintains a centralized hub on OER Commons for sharing resources, webinar announcements, and updates about OER strategies and implementations, and about topics such as professional learning, accessibility, AI policy and practice, cultural responsiveness, and other related issues. In early 2023, the network piloted a high profile policy action to advocate for connecting OER to Digital Equity plans by states applying for federal funding through the Infrastructure Investment and Jobs Act (“IIJA”, P.L. 117-58). A policy letter, guidance, and toolkit were created to support educational leaders in advocating for OER as a solution for consideration by state leads of Digital Equity plans looking to leverage the expansion of access to broadband, connectivity, and related offerings in their states. As part of its policy actions, network leads informed network members about state-level Digital Equity planning and public comment opportunities in their states. In addition, the Network conducted to the policy action to reach Congress (Senate Committee on Health, Education, Labor, and Pensions) as it was attending to the reauthorization of the Education Sciences Reform Act (ESRA), including the Educational Technical Assistance Act and the National Assessment of Education Progress Authorization Act. ESRA reauthorization can provide an important opportunity to recognize the pivotal role open educational resources (OER) can and should play in promoting and supporting student success. In 2024, with renewed support from the Hewlett Foundation, ISKME will continue to support the #GoOpen National Network to connect OER to other national agendas in the education landscape, from digital equity to dual enrollment to deeper learning and accessibility, we see our role as a network facilitator and connector as key to creating impact through knowledge sharing across states, districts, and regions. The Action Collab Framework: Action Collabs help groups discover innovative fixes to practical problems and create real value for educators and learners. It is a collaborative approach to problem-solving that combines human-centered design thinking concepts with improvisation techniques to unlock a group’s creativity and capacity for innovation. Action Collabs help groups: Develop fresh perspectives to reframe familiar challenges. Identify unexpected solution possibilities that open up new directions. Spark strategic thinking that reveals new partnerships and relationships. Action Collabs consist of four core stages that can be adapted to take place in half-day, multi-day, or over several months: Identify Opportunity: groups use empathy based listening and observing tools, and immersion activities to gain inspiration and insight from users. Design: No solution is out of bounds as groups stretch their imagination to answer a focusing “How might we?” question drawing from their deeper understanding of user experience. Prototype: Groups select a specific solution idea and show how it might work by creating physical prototypes, role-play scenarios, and user narratives. Impact: In order to create impact, groups share their solutions with users to get meaningful feedback. Action Collabs can be modified and tailored to meet the needs of any group charged with developing new solutions or strategies focused on creating tangible improvement in people’s experiences. ISKME offers a range of Action Collab workshops that vary in audience, length, and focus: Action Collab: Customized to a group’s specific Design Challenge (1 – 2 days, with follow-up support) Mini Action Collab: Learn and experience the framework of an Action Collab (1/2 day) Action Collab for Kids or Young Adults: Focused on a group of younger learners’ Design Challenge (1 day) Embedded Action Collab: Inserted into a larger event to catalyze action around ideas generated (1/2 day – 2 days) Action Collab Facilitator Training: Develops capacity for designing and leading Action Collabs (2 days) USING ACTION COLLABS IN YOUR WORK ISKME has worked with a number of diverse organizations using Action Collabs to move the needle on pressing challenges and begin to take positive action. Participants have used Action Collabs to: Curriculum redesign Rethink parent engagement in schools Transform professional development for educators Explore solutions for new models for restructuring teaching and learning services Imagine and explore new revenue models The Action Collab Framework creates a safe space for open and collaborative thinking and provocation, in which participants give each other permission to experiment with ideas and explore possibilities. “I’d never seen myself as someone who ‘makes’ things, and for the first time, I saw myself conceptualizing and making a solution. It was really eye-opening.” Action Collab Participant “It was that transformation of creating order out of chaos that struck me as one of the more useful practices and techniques that could be applied to day to day level of an institution, even a smaller level such as a department. In a sense, it is about letting people talk, vent, and having confidence that no matter how varied their background, there are things we share as educators, and it is very likely that we will come to some broader consensus.” Action Collab Participant BECOME A TRAINED ACTION COLLAB FACILITATOR ISKME works with individuals and groups to develop their capacity for designing and leading Action Collabs in their own organization. Public Training: ISKME offers two-day training sessions open to the public, in which participants experience an Action Collab and then look under the hood to explore the rationale of each step in the process. Participants discuss the goals for each Action Collab module, learn the activities that support those goals and the improvisation techniques that enhance the group’s collaboration. Time is dedicated for participants to practice giving process instructions and facilitate activities with rich de-brief and reflection on learning. “I learned how provocation is the land where innovation lives and how critical it is to get a group there. This includes the power of improv to bring about the innovation and provocation mind-set.” Action Collab training participant. “I loved all of the PRACTICE! It is always the most uncomfortable and the MOST rewarding. I felt the facilitation was authentic and did not feel at all scripted or wrote.The work of revising the Design Challenge was very helpful and critical to a good Action Collab.” Action Collab training participant CUSTOM TRAININGS Organizations that ould benefit from custom trainings include those that have a particular goal for their training, such as: a team charged with leading redesign efforts or new business development; or creating a multi-year initiative targeting innovation and transformation. often benefit from custom training workshops. ISKME can design a series of Action Collab sessions and trainings so that participants learn how to design and lead their own Action Collabs. A series of sessions could include experiencing an Action Collab focused on a current design challenge, then participating in a two-day training to dissect and learn the AC process, then co-facilitation with the client organization to provide first-hand experience and feedback, followed by online support. To bring a customized Action Collab to your organization, please contact us at info@iskme.org Action Collab Design Team Lisa Petrides, ISKME Megan Simmons, ISKME Jonah Houston, IDEO Chris Miller, LifePlays"
year_published = 2025
