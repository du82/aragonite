["https://www.iskme.org/privacy"]
title = "Privacy Policy | ISKME"
full_description = "ISKME’s Open Library and Collaboration Platform Privacy Policy Date last updated: 05/16/18 The Institute for the Study of Knowledge Management in Education (“ISKME”) collects limited personally identifiable information (“PII”) and non-personally identifiable information in connection with your use of ISKME’s Open Library and Collaboration Platform infrastructure (the “Microsite”). Please read this Privacy Policy carefully to obtain a clear understanding of how we collect, use, protect, and otherwise handle your PII and non-personally identifiable information. We share your PII only with your consent or as described in this policy. If you do not agree to any part of this policy, please do not access the Microsite or provide us with your PII; by using the Microsite, you consent to the practices described in this policy. ISKME reserves the right to change this Privacy Policy and will provide notice prior to doing so. If you have comments, suggestions, questions, or concerns regarding our privacy policy, please contact us at info@iskme.org for fastest processing, please include the phrase “Privacy Policy” in the subject line and in the body of your message. Scope. This Privacy Policy covers the treatment of PII and non-personally identifiable information that we obtain when you interact with the Microsite. If you have participated in or used the Microsite (for example, through contributing materials to the Microsite, adding comments, or creating a group), you will have provided PII and non-personally identifiable information to ISKME. PII means individually identifiable information about an individual user collected online by ISKME from that individual and maintained by ISKME in an accessible form, including your first name, last name, and email address. Information that we use internally to identify you as a user or Registered User of the Microsite (e.g., your User ID) is not considered PII. This policy does not cover the privacy practices of third parties, such as the practices of third-party social networking services, or our partners and/or advertisers. In addition, our service may contain links to the websites or services of third parties. Such third-party services and websites operate independently of our Microsite and each has its own privacy and security practices. We encourage you to review their policies before submitting any information to them. Consent to Collection & Processing in The United States. Our technology infrastructure is based in the United States. Accordingly, by using the Microsite, you consent to having your information, including PII, transferred to and processed in the United States. How we collect Information. Information You Provide to Us. When you create a Registered User account we require that you provide your name and email address. You may also choose to provide us with optional profile information, such as your country and state of residence, website URL, social media account information, and the like. You are not required to provide us with this optional information to use the Microsite. When you request assistance through or regarding the Microsite, you may also provide us with additional information. For example, if you email us requesting a callback, you will provide us with your telephone number. From time to time, we may contact you regarding a voluntary survey, to help us better tailor the Microsite to the needs of our users. Such surveys may ask for additional PII or other information from you. Other Information We Collect. Log Files & Analytics. Similar to many websites and internet services, we gather certain information automatically and store it in web server log files. This information includes your web request, Internet Protocol (“IP”) address information, unique device identifier (e.g., UDID, MAC Address, etc.), browser type, referring / exit pages and URLs, number of clicks, domain names, landing pages, pages viewed, web beacons, page activity, and other such information. We may analyze such data using our own analytics, Google Analytics, or other similar third-party services. To learn more about how Google Analytics collects and uses your data when you use this site, and how you can control the information sent to Google Analytics, please review https://google.com/policies/privacy/partners. We use these log files and analytics to improve and administer the Microsite, to analyze trends, and to gather information about our user base. Cookies. When you visit our website or use any part of our Microsite, one or more cookies may be sent to your computer. A cookie is a small text file containing a string of alphanumeric characters used to uniquely identify your browser, to help you log in faster, and to enhance your navigation through a website. A cookie may also convey information to ISKME about how you use our Microsite (e.g., the pages you view, the links you click and other actions you take, etc.), and allow ISKME to track your usage of our Microsite over time. We use both session cookies and persistent cookies. A session cookie is temporary and disappears after you close your browser. A persistent cookie remains on your hard drive after you close your browser, to facilitate subsequent visits to our service. Both session cookies and persistent cookies can be removed in the security or privacy settings of your web browser. You can set your web browser to refuse all cookies or to indicate when a cookie is being sent, however, some features of our Microsite may not function properly if cookies are disabled. Do Not Track (DNT). Because there is disagreement within the privacy industry about how to interpret the DNT setting, the Microsite does not currently respond to DNT settings in web browsers. Information Concerning Children. As explained further in our terms of use (available at https://oercommons.org/terms ), you must be 18 years of age or older – or, if you are under the age of majority in your jurisdiction, have the consent of your parent or legal guardian – to use the Microsite. In accordance with the Federal Children’s Online Privacy Protection Act of 1998 (“COPPA”), we will never knowingly solicit or collect PII from those known to be under thirteen (13) years of age. If you believe that we have information from or about anyone under thirteen (13) years of age, please notify our Privacy Officer by email at info@iskme.org for fastest processing, please include the phrase “COPPA Concern” in the subject line and in the body of your message. Removing or Correcting Your Information. Via the Microsite. As a Registered User of our Microsite, you can login with your email address and password to view and change your personal information at the URL https://oercommons.org/profile/edit. Contact Us. You may contact ISKME at any time, by emailing the support desk at info@iskme.org, to request that your PII be removed from the Microsite, or to request that your Registered User account be permanently deleted; for fastest processing, please include the phrase “PII Request” in the subject line and in the body of your message. How we Use Information. To Provide You with the Microsite. We use your information for the purpose of providing you with the Microsite. In Our Communications with You. We use email and/or prominent notifications on our website as a primary means of informing our users of important Microsite and promotional announcements. Microsite-Related Announcements. When you register to become a Registered User of the Microsite, we use the email address provided during account creation (or any other email address you may specify within your Registered User account) to deliver important Microsite-related announcements to you. Examples of Microsite-related announcements include email verification during registration, requests for password reset, important security or server maintenance updates, upgrades, and new releases or policy changes. These Microsite-related announcements are considered a fundamental part of the Microsite; Registered Users cannot opt out of these email announcements. Promotional Announcements. In order to improve the experience for our Registered Users, we may send updates from time to time. These communications are enhancements to our Microsite and are entirely optional. We make it easy for you to unsubscribe from these communications via a link in the footer of each such email you receive. If you are a Registered User of the Microsite, you can also see and modify your email preferences at https://oercommons.org/profile/preferences. On Our Website. We may use the information we collect to calculate and publish anonymous, non-personal, aggregate statistics that we believe our user base is interested in viewing. We publish this data in aggregate form only, and do not publish any PII in connection with this use. For Internal Reporting and Analysis. As noted above, we use information gathered from log files, cookies, and the like to improve the Microsite, analyze trends, administer the site, track the movements of users around the site, and gather aggregate information about our customers as a whole. Google Drive. If you choose to do so, you may import content to and/or export content from the Microsite via your Google Drive account. You must authorize read access for your Google Drive to import content from Google Drive; you must authorize write access to export content from the Microsite to your Google Drive. With the exception of content that you import to and/or export from the Microsite, ISKME does not gain any additional information about you from Google by virtue of your use of these features. Disclosure of Information to Others. Our Commitment to Your Privacy. We are committed to handling responsibly the information and data we collect. We share your information, including your PII, for the purpose of providing you with the Microsite, and only as described in this policy or with your express consent. Sharing, Renting, & Selling Information We Collect. Except as provided herein, we will neither rent nor sell your PII to any other third party not under our common ownership or common corporate control. We may share aggregate information about our user base with partners, and we may publish these aggregate usage statistics on our website for the interest of our users. Services to Which We Provide Links via Microsite. In some cases, we allow you to access or link to other web services through our Microsite. For example, we allow you to follow us on Twitter via a link contained in the Microsite. In such cases, those services may choose to collect your personal information as they deem appropriate. As noted above, we are neither responsible for nor in control of how third parties collect, use, or disclose information obtained through these linked services. We encourage you to be aware when using these third-party services and to review their policies before submitting any personal information to them. Third-Party Service Providers. We use other companies, agents, and/or contractors to perform services on our behalf or to assist us with providing the Microsite to you. For example, we may engage such service providers to provide marketing, communications, provide website hosting infrastructure and IT services, personalize and optimize the Microsite, provide customer service, and/or analyze and enhance data. In the course of providing such services to us, these other companies may have access to your information. We do not authorize these companies to use or disclose your PII, except in connection with providing the services we request from them. Legal and Related disclosures. We reserve the right to disclose your information, including your PII, when we have a good faith belief that access, use, preservation, or disclosure of such information is necessary to (a) comply with any law, regulation, legal process, or enforceable governmental request; (b) enforce our terms of use, including investigation of potential violations of our terms of use; (c) detect, prevent, or otherwise address fraud, security, or technical issues; or (d) protect against harm to our rights, property, or safety, or those of our employees, users, or the public, as required or permitted by law. Infringing User Content. If we receive notice that User Content you have posted to or through the Microsite may infringe the rights of thirds parties, including their intellectual property rights, we reserve the right (in our sole discretion) to disclose information, including PII, about you to those third parties, so that they can contact you directly regarding their concern. Acquisition. If we become involved in a merger, acquisition, or any form of sale of some or all of our assets, including bankruptcy, our assets, including Registered User account information and PII, may be transferred to a third party. At that time, your information may become subject to that third-party’s privacy policy. CA Shine the Light / Your California Privacy Rights. California Civil Code Section 1798.83, known as the “Shine the Light” law, permits our customers who are California residents to request and obtain from us a list of what personal information (if any) we may have disclosed to third parties for direct marketing purposes in the preceding calendar year, including the names and addresses of those third parties. Requests may be made only once a year and are free of charge. If you would like to make a request pursuant to California Civil Code Section 1798.83, you must do so in writing via email to info@iskme.org please include the phrase “Request for California Privacy Information” in the subject line and in the body of your message. We currently do not share any personal information with third parties that are not under our common ownership or common corporate control for their direct marketing purposes. Student Data and FERPA Compliance. Student Data. Any student information collected by ISKME is provided by educators on behalf of students, or by students themselves. FERPA Compliance. If you are a school administrator or teacher in the United States and want your students, who are over age thirteen (13), to use our Microsite, including in conjunction with the establishment of an account for your school or a group of students at your school, you are solely responsible for complying with the U.S. Family Educational Rights and Privacy Act (“FERPA”). This means you must notify those students’ parents/guardians of the PII you will collect and share with ISKME and obtain parental/guardian consent before your students establish accounts or use our Microsite. When obtaining such consent, you should provide parents/guardians with a copy of our Terms of Use Agreement. You must keep all consents on file and provide them to us if we request them. If you are located outside of the United States, we will rely upon you to obtain any required consent or approval from the parent or guardian of any student covered by s"
