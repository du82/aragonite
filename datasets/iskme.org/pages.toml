full_description = '''ISKME is a globalnonprofit thatinspires and conveneseducators to embracethe practice ofOpen Education Research and Development Since its founding in 2002, ISKME has built an extensive body of research and frameworks. We serve the field by offering in-depth land­scape and impact studies and program devel­opment around equitable and inclusive access to high-quality education for all. Learn more Platforms, Tools and Training Leveraging the world-class public digital library of Open Educational Resources, OER Commons, ISKME’s OER Services offer custom solutions to our partners to support OER ini­tiatives. Learn more Knowledge Sharing and Innovation As the creator of Big Ideas Fest and the design-thinking approach, Action Collabs, ISKME facilitates transformative processes and events to deepen collaboration and prob­lem-solving among educators globally. Learn more OER Commons Public Digital Library ISKME created OER Commons, a comprehensive, openly accessible digital library for educators at all levels to identify high-quality Open Educational Resources (OER) and collaborate around their use, evaluation, and improvement to address the needs of their classrooms. Learn more Latest News Celebrating the Completion of Season 1: Educating to Be Human by Team ISKME | Jan 3, 2025 | BlogWe are celebrating the completion of Season 1, with 10 episodes of the "Educating to Be Human" podcast series. They are meant to be thought-provoking and engaging, and to shed light on the idea that creation and curiosity--essential superpowers of humans--can be... read more ISKME’s Guiding Principles for Responsible AI in the World of “Open” by Team ISKME | Nov 21, 2024 | BlogAs a nonprofit organization working in the open education space, we have witnessed first-hand the frenetic pace of all things AI, particularly as they relate to education. While several members of our team have eagerly explored ways in which AI tools could be applied... read more Educators Embrace Open Educational Resources: A Curricular Game-Changer for Today’s Classrooms by Team ISKME | Nov 14, 2024 | BlogIn an era of rapid technological advancement and evolving educational needs, teachers across the country are turning to open educational resources (OER) to transform their classrooms. These freely accessible, openly licensed materials are reshaping the landscape of... read more Launching the “Educating to be Human” Podcast! by Team ISKME | Aug 6, 2024 | In The NewsA new bi-weekly podcast hosted by Lisa Petrides, ISKME's CEO, “Educating to Be Human” explores what it means to be human at the intersection of education, technology and culture. In each episode, Lisa speaks with people who, through their passion and commitment, are... read more « Older Entries'''
