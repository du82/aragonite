["https://www.iskme.org/publication/leveraging-oer-to-advance-dei-a-guide-for-campus-change-agents"]
title = "Leveraging OER to advance DEI: A Guide for Campus Change Agents | ISKME"
full_description = "Leveraging OER to advance DEI: A Guide for Campus Change Agents by Team ISKME | Apr 18, 2023 This guide is designed to support the integration of open educational resources (OER) and diversity, equity, and inclusion (DEI) goals within higher education institutions. Built upon research funded by the William and Flora Hewlett Foundation that examined the strategies and experiences of the sixty-six colleges, universities, and state systems that participated in AAC&U’s year-long inaugural Institute on Open Educational Resources (2021–22), this guide provides evidence-based guidance and best practices that result in initiative sustainability and broad adoption of OER by strategically connecting this work to DEI goals, strategies, policies, initiatives, and offices that also exist within a given educational context. Indeed, OER and DEI initiatives often seek similar outcomes, and intentionally connecting such work ultimately serves to facilitate achievement of common goals. The current and emerging higher education landscape underscores the need for attainment of these goals. See the full guide here or download it by clicking below."
year_published = 2023
