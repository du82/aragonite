["https://www.iskme.org/educators-embrace-open-educational-resources"]
title = "Educators Embrace Open Educational Resources: A Curricular Game-Changer for Today’s Classrooms | ISKME"
full_description = "Educators Embrace Open Educational Resources: A Curricular Game-Changer for Today’s Classrooms by Team ISKME | Nov 14, 2024 | Blog A sixth-grade English teacher works with two middle school students (CC BY-NC 4.0) In an era of rapid technological advancement and evolving educational needs, teachers across the country are turning to open educational resources (OER) to transform their classrooms. These freely accessible, openly licensed materials are reshaping the landscape of education, offering a host of benefits that empower educators and engage students like never before. In the K-12 landscape across the U.S., OER—which are free to use, customize, and share—have been growing in popularity over the past several years and have been adopted across many states around the country. In fact, a recent report by research organization Bay View Analytics found that awareness of OER among K-12 educators is at an all-time high (32%) — up 4% from last year — and 30% of teachers report using OER in their classrooms. “We’ve seen a meaningful increase in awareness and use of open educational resources among K-12 educators over the years,” said Julia Seaman, director of research at Bay View Analytics. “In our view, OER usage is continuing to trend upwards.” Five reasons why teachers are integrating OER into their teaching: 1. Free and Accessible With shrinking budgets and rising textbook prices, OER provides a much-needed financial reprieve. Educators can adopt entire open textbooks, or they can modify, rearrange or mix and match desired materials to suit the educational goals and objectives of their classroom and district with well-developed content that’s highly engaging and easily accessible to their students. “Michigan had the goal of developing an OER repository with enough quality resources so that any teacher at any point in the school year can come and find something to use the next day in class,” says Gina Loveless, Education Technology Manager with the Michigan Department of Education. 2. Customizable Content Unlike traditional textbooks, OER allow teachers to tailor content to their students’ needs. “One of the things educators appreciate about OER is the ability to tailor the materials to meet the unique needs of their students,” said Rebecca M. Henderson, Ed.D., Student Services Administrator at Westmoreland Intermediate Unit in Pennsylvania. “With OER, teachers have the flexibility to use the resources as-is or modify them to create more engaging, personalized learning experiences for their classrooms.” 3. Collaborative Teaching and Learning OER and the community around them foster a spirit of collaboration among educators. Because of the open nature and lack of copyright restrictions with OER, educators can share resources, exchange ideas, and build upon others’ work. The #GoOpen National Network is one community of educators that collaborate on using OER to transform teaching practices and student learning. 4. Up-to-Date and Relevant Material In rapidly evolving fields, the use of OER helps ensure that students have access to the most current information. “We truly value incorporating current, relevant materials that make learning more meaningful, while helping students develop essential 21st-century skills such as digital literacy, collaboration, and critical thinking,” said Amber Hoye, Co-Director of The Pathways Project, an OER network of educators and students. Providers of OER such as OpenStax and OER libraries, such as OER Commons, contain a wealth of customizable resources that easily allow teachers to incorporate real-world examples and relevant updates into curriculum. 5. Enhanced Student Engagement The interactive and multimedia nature of many OER materials captivates students in ways traditional textbooks cannot. “We know K-12 teachers need to find digital material that is adaptable, flexible, and engaging,” shared Kelly Arispe, Co-Director of The Pathways Project. “Open educational resources come in a lot of different forms, including activities that teachers can integrate into their curriculum to differentiate to students’ needs. With OER, our students see themselves better reflected in their learning materials and can learn at their own pace. Many of the activities we create allow students to practice as many times as they need, which is really important for skill mastery.” As the educational landscape continues to evolve, using and creating OER is a powerful way for educators to create dynamic, personalized learning experiences. By embracing these resources, teachers are not only adapting to the changing needs of their students but are also playing a crucial role in shaping the future of education. Educators can explore open educational resources to use in their classrooms by using the digital public library OER Commons, managed by ISKME (Institute for the Study of Knowledge Management in Education), and check out the Knowledge Is Meant to Be Shared YouTube channel to learn more about OER. More About #GoOpen: The #GoOpen National Network is a community of K-12 educators and leaders committed to advancing the adoption and use of Open Educational Resources to transform teaching practices and student learning. We advocate for equitable access to high quality educational materials for all learners and offer professional learning opportunities and resources for educators to integrate OER into their classrooms across states and districts. From 2015-2021, #GoOpen was a federal initiative in the U.S. Department of Education (ED) Office of Education Technology for states and districts to commit to adopt OER. ISKME became ED’s partner in 2018 to co-facilitate this effort. Since 2022, ISKME has been leading the network’s transition to a community model with a national focus on policy actions and educator awareness and professional learning around OER with partners and leaders across the country. Learn more about the benefits of OER in this blog post and by following #GoOpen on LinkedIn. -Amee Evans Godwin, Senior Advisor, ISKME, and the GoOpen National Network"
year_published = 2024
clearnet = "https://www.iskme.org/educators-embrace-open-educational-resources"
