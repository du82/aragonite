title = "Launching the “Educating to be Human” Podcast! | ISKME"
full_description = "Launching the “Educating to be Human” Podcast! by Team ISKME | Aug 6, 2024 | In The News A new bi-weekly podcast hosted by Lisa Petrides, ISKME’s CEO, “Educating to Be Human” explores what it means to be human at the intersection of education, technology and culture. In each episode, Lisa speaks with people who, through their passion and commitment, are creating transformative change in education. In Season 1, ETBH dives into the fundamental question of how we as humans might place front and center the critical need to adapt and change. We talk with folks who wake up everyday thinking about how to best leverage our innate desire for community and connection, and how creation and curiosity, our essential superpowers, can be harnessed to create a more humane world. The first episode is now live! Lisa sits down with Erin O’Connell, a university classics professor, and they delve into the world of Monsters – where we find them, how we define them, and what they can teach us about humanity in today’s world. Please tune in and subscribe wherever you get your podcasts! https://educatingtobehuman.org/monsters-with-erin-oconnell"
