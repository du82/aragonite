title = "About Us | ISKME"
full_description = "About ISKME ISKME’s mission is to make learning and knowledge sharing more participatory, equitable, and open. As an independent 501(c)(3) nonprofit established in 2002, ISKME’s research, library services, and trainings, enable schools, colleges, universities, and the organizations that support them to expand their capacity to collect and share information, and create knowledge-driven environments focused on learning and success. ISKME supports innovative teaching and learning practices throughout the globe, and is well-known for its pioneering open education initiatives. ISKME also assists policymakers, foundations, and education institutions in designing, assessing, and bringing continuous improvement to education policies, programs, and practice. Our Team Board of Directors Our Supporters Click the links above to learn more about ISKME, or visit the ISKME YouTube Channel. Tim Farquer’s work is a great example of the impact that OER can have on the ground. He first came to ISKME as part of a year-long OER Fellowship program that we had created with a grant from the Hewlett Foundation in 2012. As superintendent of a small rural district in Illinois, Tim describes ISKME’s approach to open educational resources (OER) and training as the catalyst for advancing…"
