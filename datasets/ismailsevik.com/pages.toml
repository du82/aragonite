full_description = '''Ana Sayfa Kayıtlar Hobi Olarak Yazmak Yakın zamanda şunu farkettim, güzel işlere imza atan kişilerin takipçileri, izlenme oranları, bilindik değil. Yani kitlesel ölçekte çok yer kaplamayan, kıyıda köşede kalan işler güzel oluyor. Son birkaç günde o kadar çok güzel filmler izledim ki yani o filmde oynamak isterdim. O filmlerden biri Surprized by Oxford. Çok hoşuma gitti. Filmdeki başrol oyuncusu Rose Reid'in bir röportajında ki sözleri çok manalı geldi bana.Hobi olarak yazmaya devam etmek istiyorum. Çünkü bir hobiyi işe dönüştürdüğünüzde artık o kadar eğlenceli olmadığını biliyorum. Buna karşı gerçek bir tutkum var ama sanırım şimdilik hobi olarak kalmalı. – Rose ReidBen yeni bir yazı yazmadan önce sürekli bu ikilem içerisindeyim. Sevdiğim için mi yazıyorum? Yoksa iş-kariyer için mi yazıyorum? Yavaş yavaş bunu aşmaya çalışıyorum. Zor bir şey yani. Herkesin mükemmel içerikler yazdığını falan düşününce insan bir üzülüyor ve iş için yazmaya başlıyor. Rose Reddit o sözünü okumak bende olumlu bir etki yarattı. { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://www.ismailsevik.com/2024/12/hobi-olarak-yazmak.html" }, "headline": "Hobi Olarak Yazmak", "description": "Yakın zamanda şunu farkettim, güzel işlere imza atan kişilerin takipçileri, izlenme oranları, bilindik değil. Yani kitlesel ölçekte çok yer kaplamayan, kıyıda köşede kalan işler güzel oluyor. Son birkaç günde o kadar çok güzel filmler izledim ki yan&#8230;", "articleBody": "Yakın zamanda şunu farkettim, güzel işlere imza atan kişilerin takipçileri, izlenme oranları, bilindik değil. Yani kitlesel ölçekte çok yer kaplamayan, kıyıda köşede kalan işler güzel oluyor. Son birkaç günde o kadar çok güzel filmler izledim ki yani o filmde oynamak isterdim. O filmlerden biri Surprized by Oxford. Çok hoşuma gitti. Filmdeki başrol oyuncusu Rose Reid\u0026#39;in bir röportajında ki sözleri çok manalı geldi bana. Hobi olarak yazmaya devam e