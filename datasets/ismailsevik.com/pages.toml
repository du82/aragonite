full_description = '''Ana Sayfa Kayıtlar Güzel bir film izlemenin mutluluğu Güzel bir film izlemenin verdiği mutluluk kadar güzel pek az güzel şey var. Daha iki saat önce böyle film izledim. Yumuşak, hafif ve aksiyonlu olmayan insanın içini ısıtan filmleri severim. Aksiyon filmlerini eskiden severdim. Artık o kadar aksiyon filmi izledim ki filmde ne olacağını tahmin edebiliyorum. Aksiyon filmlerinden değişen tek şey oyuncu kadrosu oluyor. Yani sıkıcı. İnsanın içine dokunan filmler de çok zor bulunuyor, ara ki bulasın. Ama bulunca izleyince üff yani. Bir de popüler filmeri, herkesin bahsettiği filmleri izlemeyi sevmiyorum. Herkesin izlediği filmler çok zevksiz geliyor. IMDB puanına bakarak film izleyenler var, onlar ayrı bir alem zaten. Arkadaşa film tavsiye ediyorum, diyor ki:"Bunun IMDB puanı düşük". Hay senin zevkine diyorum. İzlediğim güzel filmleri tanıtım babında bir inceleme yazarak yayınlamak istiyorum da güzel şeyleri anlatmakta biraz zorlanıyorum. Hani Mehmet Akif'in bir sözü var ya:" Anlarım anlatamam, hissederim söyleyemem, dili yok kalbimin ondan bizarım". Durumu anlatan bir söz. Şimdi izlediğim filmi tekrardan izleyeceğim. Güzel filmleri genelde indiriyorum daha sonra bulamam diye. Son olarak, filmleri önceden dublajlı izliyordum şu an altyazılı izliyorum. Daha güzel oluyor. Sizin güzel insanın içini ısıtan filmleriniz varsa bana iletin lütfen. { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://www.ismailsevik.com/2024/12/guzel-bir-film-izlemenin-mutlulugu.html" }, "headline": "Güzel bir film izlemenin mutluluğu", "description": "Güzel bir film izlemenin verdiği mutluluk kadar güzel pek az güzel şey var. Daha iki saat önce böyle film izledim. Yumuşak, hafif ve aksiyonlu olmayan insanın içini ısıtan filmleri severim. Aksiyon filmlerini eskiden severdim. Artık o kadar&#8230;", "articleBody": "Güzel bir film izlemenin verdiği mutluluk kadar güzel pek az güzel şey var.\n Daha iki saat önce bö