title = "E-postaları seviyorum - İsmail Şevik"
description = "İnsanlarla e-posta yoluyla iletişime geçmeyi seviyorum. Güzel işlere imza atan   kişilerle iletişime geçmek gerçekten keyif verici bir şey. ..."
full_description = '''Ana Sayfa Kayıtlar E-postaları seviyorum İnsanlarla e-posta yoluyla iletişime geçmeyi seviyorum. Güzel işlere imza atan kişilerle iletişime geçmek gerçekten keyif verici bir şey. Nezaketle ve saygıyla size cevap veriyorlar. Siz mutluluk verip mutluluk alıyorsunuz. Böyle deyince aklıma Ömer Hayyam'ın şu dizeleri aklıma geldi: Yeryüzünü gül bahçesine çevirmektenDaha güzeldir bir insanı sevindirmen.Bin kulu azat edenden daha büyüktürBir hür insanı iyilikle kul edebilen. Hakikaten de öyle. İnsanların mutlu olması kendimin mutlu olmasından daha çok mutlu eder beni. Tebessüm buna en güzel araçtır. İnternette keşfettiğim insanlara beğendiğim bir şeyi olduğunda hemen e-posta yoluyla yazıyorum. Yaptığı şeyi devam etmesi yönünde motive etmeye çalışıyorum. İnsanlar da mutlu oluyorlar. Karşılığında onlar da size ilham verici sözler söylüyorlar. Güzellik yayılıyor etfafa. İşte bu yüzden postaları, e-postaları severim. Benimle iletişime geçmek isterseniz ismail@ismailsevik.com adresi üzerinden her türlü şeyi yazabilirsiniz. Siz de sevdiğiniz şeyleri ister yorumlarda ister e-posta yoluyla bana gönderin. { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://www.ismailsevik.com/2025/01/e-postalari-seviyorum.html" }, "headline": "E-postaları seviyorum", "description": "İnsanlarla e-posta yoluyla iletişime geçmeyi seviyorum. Güzel işlere imza atan kişilerle iletişime geçmek gerçekten keyif verici bir şey. Nezaketle ve saygıyla size cevap veriyorlar. Siz mutluluk verip mutluluk alıyorsunuz. Böyle deyince aklım&#8230;", "articleBody": "İnsanlarla e-posta yoluyla iletişime geçmeyi seviyorum. Güzel işlere imza atan\n kişilerle iletişime geçmek gerçekten keyif verici bir şey. Nezaketle ve\n saygıyla size cevap veriyorlar. Siz mutluluk verip mutluluk alıyorsunuz. Böyle\n deyince aklıma Ömer Hayyam\u0026#39;ın şu dizeleri aklıma geldi:\n\u003ci\u003e Yeryüzünü gül bahçesine çevirmekten Daha güzeldir bir insanı\n sevindirmen. Bin kulu azat edenden daha büyüktür Bir hür insanı\n iyilikle kul edebilen.\u003c/i\u003e \n Hakikaten de öyle. İnsanların mutlu olması kendimin mutlu olmasından daha çok\n mutlu eder beni. Tebessüm buna en güzel araçtır. İnternette keşfettiğim\n insanlara beğendiğim bir şeyi olduğunda hemen e-posta yoluyla yazıyorum.\n Yaptığı şeyi devam etmesi yönünde motive etmeye çalışıyorum. İnsanlar da mutlu\n oluyorlar. Karşılığında onlar da size ilham verici sözler söylüyorlar.\n Güzellik yayılıyor etfafa. İşte bu yüzden postaları, e-postaları severim.\n Benimle iletişime geçmek isterseniz\n ismail@ismailsevik.com adresi\n üzerinden her türlü&#8230;", "datePublished": "2025-01-05T02:15:00+03:00", "dateModified": "2025-02-25T17:05:38+03:00", "image": { "@type": "ImageObject", "url": "https://1.bp.blogspot.com/-E250bQMM8tk/XomH5DdorOI/AAAAAAAAPY8/SCYwi79WjckWC8wHKK7OblI82BpT9JquACNcBGAsYHQ/s1600/jagotheme-img.png", "height": 348, "width": 1200 }, "publisher": { "@type": "Organization", "name": "İsmail Şevik", "logo": { "@type": "ImageObject", "url": "https://1.bp.blogspot.com/-50s1RMWV7jI/X8OaYjJcMiI/AAAAAAAAQK4/sWcpbaP0Sq0hsW473Vnb8AyBvYvdSQEPwCNcBGAsYHQ/s0/jd-logo.png", "width": 297, "height": 45 } }, "author": { "@type": "Person", "name": "İsmail Şevik", "url": "https://www.blogger.com/profile/02487074348298844362", "image": "//blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhCcDXIxudHnOx3yKBJlFPn8yKzJSUTNHkxw-S4FC0KMNnuq9xrC9RiGMdLKTah54i_jjOgqbu6Sjc7H5n6OrqvlsSOf96asgOvskBTvuy_S-JXIz4ayrQkCBbNf2Mek40Uu-mWHUzooKpNpOSYquiKe2aVlxw9B3_4ftPBSYE1VrpEPKs/s220/profil.jpg" } } /*<![CDATA[*/ function get_text(el) {ret = ''; var length = el.childNodes.length; for(var i = 0; i < length; i++) {var node = el.childNodes[i]; if(node.nodeType != 8) {ret += node.nodeType != 1 ? node.nodeValue : get_text(node);} } return ret;} var words = get_text(document.getElementById('postBody')); var count = words.split(' ').length; var avg = 200; var counted = count / avg; var mai