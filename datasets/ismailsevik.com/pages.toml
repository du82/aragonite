description = "İnternette başkaları ve kendi için güzel işler yapan insanlar var. Bu insanlar kendi bilgi birikimi, ilgi alanları ve sevdikleri pek çok şey..."
full_description = '''Ana Sayfa Kayıtlar İnsanlara destek olmak gerek İnternette başkaları ve kendi için güzel işler yapan insanlar var. Bu insanlar kendi bilgi birikimi, ilgi alanları ve sevdikleri pek çok şeyi halka açık olarak internette paylaşıyorlar. Bunlardan mutlu oluyorlar. Tabi bunları yaparken de bazen tükenmiş sendromuna giriyor, bazen maddi zorluk çekiyor, bazen ümitsizliğe düşüyorlar...Ancak yinede yaptıkları şeyleri yapmaya devam ediyorlar. İşte bu noktada bizler yani o içeriği tüketenlere birkaç sorumluluk, jest düştüğünü düşünüyorum. Bizlere düşen sorumluluklardan birkaçı. E-posta veya yorum yoluyla onlara bir teşekkür etmek. Teşvikte bulunmak, bazen hem maddi hem de manevi olarak. Fikrini almak da olur. Gibi gibi bunları çoğaltabilirizYani insanların bunlara gerçekten ihtiyacı olduğunu düşünüyorum. Yanılıyor da olabilirim. Olsun bu benim kendi fikrim. Yani bir e-posta adresine teşekkür mesajı yollamak zor olmasa gerek. Veya yorumlarda güzel veya motive edici bir şey söylemek ağır gelmese gerek. Dünyada zaten bir ton toksik, kötü, insanın ruhunu karartan şey var. Bunları iyilikle güzel sözle en aza indirmek için adım atmak gerek. Karanlığa söveceğine bir mum yak. { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://www.ismailsevik.com/2025/01/insanlara-destek-olmak-gerek.html" }, "headline": "İnsanlara destek olmak gerek", "description": "İnternette başkaları ve kendi için güzel işler yapan insanlar var. Bu insanlar kendi bilgi birikimi, ilgi alanları ve sevdikleri pek çok şeyi halka açık olarak internette paylaşıyorlar. Bunlardan mutlu oluyorlar. Tabi bunları yaparken de bazen tüken&#8230;", "articleBody": "İnternette başkaları ve kendi için güzel işler yapan insanlar var. Bu insanlar kendi bilgi birikimi, ilgi alanları ve sevdikleri pek çok şeyi halka açık olarak internette paylaşıyorlar. Bunlardan mutlu oluyorlar. Tabi bunları yaparken de bazen tükenmiş sendromuna giriyor, bazen maddi