["https://www.ismailsevik.com/2025/02/justin-cox-roportaji.html"]
title = "Justin Cox Röportajı - İsmail Şevik"
description = "İlk blog yazmaya Medium 'da başlamıştım o sırada; nasıl yazılır, ne şekilde yazılır vesaire vesaire diye araştırırken keşfettiğim bir Medium..."
full_description = '''Ana Sayfa Kayıtlar Justin Cox Röportajı İlk blog yazmaya Medium'da başlamıştım o sırada; nasıl yazılır, ne şekilde yazılır vesaire vesaire diye araştırırken keşfettiğim bir Medium yazarı vardı. O da Justin Cox'du. Daha sonra belli bir dönem Substack'te yazdı, sonra Substack'in birtakım politikalarından dolayı kendi barındırılan bir blog başlattı. Şu anda hem Medium'da hem de kendi blogunda yazıyor. Yazılarındaki akıcılığını seviyorum. O zaman sorular ve cevaplarıyla sizi başbaşa bırakayım(Not: Ben birkaç kez Medium hesabımı silmiş olduğum için yazılarım yok.)(Not 2: Bu röportaj çeviri kullanılarak yapılmıştır.)Kendinizi tanıtır mısınız?Ben Justin Cox. Yaratıcılığı keşfetmeyi seven Orlando, FL'li bir adamım. Ah, ve Star Wars. Star Wars'u gerçekten seviyorum.Yazma hikayeniz nasıl başladı?Bu benim köken hikayem gibi hissettiriyor. Bunlardan bazılarını kitabımda paylaşıyorum, ancak üniversitede ciddi olarak yazmaya başladım. Üretmesi eğlenceli olan belirli çevrelerde popüler bir blogum vardı. Ne yaptığımı gerçekten bilmiyordum, ancak yazmaktan hoşlandığımı biliyordum, bu yüzden devam ettim.Konularınızı nasıl seçiyorsunuz?Sanırım konularım beni seçiyor. Yazmaya başladım çünkü kafamda paylaşmak istediğim düşünceler vardı ve ben de az çok bu şekilde işliyorum. Fikirler beynime giriyor ve yazmaya başlamadan önce birkaç gün boyunca onları zihnimde yazıyorum.Blog yazarken karşılaştığınız en büyük zorluklarla nasıl başa çıkıyorsunuz?Yanlışlıkla web sitemi silmek gibi mi demek istiyorsun? Ben sadece zorlukların üstesinden geliyorum. Onlar hız tümsekleri, dur işaretleri değil. Belki de her zaman çözüm aramak kişiliğimin bir parçası ya da belki de daha iyisini bilmediğim için ama yine de devam ediyorum.Blog yazmanın sana kişisel olarak kazandırdığı en büyük şey nedir?Her zaman dediğim gibi, en çok keyif aldığım şey dünyanın dört bir yanındaki yazarlarla kurduğum bağlantılar. E-posta yanıtları ve yorumlar beni besliyor ve oradaki harika insanlara dair küçük bir bakış açısı sağlıyor. Bu yüzden insanları her zaman yanıtla tuşuna basmaya ve merhaba demeye davet ediyorum.Sosyal medya, yapay zeka ve bloglamayı nasıl ilişkilendiriyorsunuz? Bloglamanın geleceği nasıl olacak?Eh, oraya gidiyoruz. Kitlesel pazar sosyal medyasına karşı isyan etme konusunda oldukça sesli oldum. Ayrıca, yaratıcılığımızı ve insan ifadesini elimizden almadan ihtiyaçlarımızı destekleyen sıkıcı yapay zeka araçları için de bir yer olduğunu düşünüyorum. (Ama henüz gerçekten mevcut değiller.)Geleceğe gelince, bloglamanın veya sosyal medyanın asla ortadan kalkacağını düşünmüyorum. İnsanların kendilerini ifade etmeleri ve insanlarla bağlantı kurmaları için her zaman bir fırsat olacak. Bence en büyük soru, bunu gelecekte nasıl yapacağımız. Umarım yazılı yöntemler devam eder ve milyarderlerin kontrolündeki platformlarla sınırlı kalmaz.Bu işe tekrar başlasaydınız neyi farklı yapardınız?Neyse ki, çevrimiçi yazmak benim için bir iş değil. Bunu bir kez denedim ve nefret ettim. Bunun yerine, yazmak yaratıcılığım için bir çıkış sağlayan tutkulu olduğum bir şey. Muhtemelen farklı yapacağım tek şey, veritabanımı akşam 9:30'da silmekten kaçınmak olurdu.Günlük rutininiz nasıl? Gününüzü nasıl geçiriyorsunuz?Ülke çapında kâr amacı gütmeyen şirketleri destekleyen çok havalı insanlardan oluşan bir ekibi yönetiyorum. Çok eğlenceli.Yeni blog yazarlarına veya yazarlara ne gibi tavsiyelerde bulunursunuz?Sadece yazmaya başlayın. Her şeyi fazla düşünmeyin. Bunu yapmak için bolca zaman var. Yayımla'ya basın ve ne olacağını görün. Dürüst olmak gerekirse, kitabımın tüm amacı bu.İnternetin geleceği hakkında ne düşünüyorsunuz? Olumlu mu olumsuz mu?Bloglamanın geleceği hakkında yukarıdakilere bakın. İnternet, insanlığın başına gelen hem en iyi hem de en kötü şeydir. Bence bu benzeri görülmemiş zamanları atlatacağız ve daha iyi bir dünya yaratacağız ve internet bu yolculuğun bir parçası olacak.Bize film, kitap, müzik, blog, bülten vb. önerebilir misiniz?Oradaki bazı harika yazarlar için blogroll'umu inceleyin. Kitaplara gelince, şu anda After On'u tekrar okumaya başlamadan önce Silo serisini tekrar okumayı bitiriyorum. Bir yapay zeka süper bilgisayarının duyarlı hale gelmesiyle ilgili olduğu için, içinde yaşadığımız zamana uygun görünüyor.İş dışında neler yapmaktan hoşlanırsınız?Yazmak iş dışında yaptığım şeydir. Bunu yapmadığımda muhtemelen Disney World'deyimdir.Başarıyı nasıl tanımlarsınız?Benim yazımda başarı, birinin sohbete katılmak veya düşüncelerini paylaşmak için yanıt vermesiyle gerçekleşir.Tinker Hatfield şöyle dedi , "İnsanlar işinizi sevmiyor veya nefret etmiyorsa, o zaman pek bir şey yapmamışsınız demektir." Bir şey yapacaksak, bu insanların tepki vermesine ilham vermeli. Bu şekilde çok daha eğlenceli oluyor.Bize bir deneyiminizi anlatabilir misiniz?Yanlışlıkla web sitemi silmek ve bozuk bağlantılar içeren bir e-postayı *iki kez* göndermek dışında mı demek istiyorsun? Şey, tamam. Bir keresinde Japon film yıldızlarıyla suşi yedim.Eklemek istediğiniz bir şey var mı?Hayır. Sanırım her şeyi ele aldık. { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://www.ismailsevik.com/2025/02/justin-cox-roportaji.html" }, "headline": "Justin Cox Röportajı", "description": "İlk blog yazmaya Medium \u0026#39;da başlamıştım o sırada; nasıl yazılır, ne şekilde yazılır vesaire vesaire diye araştırırken keşfettiğim bir Medium yazarı vardı. O da Justin Cox\u0026#39;du. Daha sonra belli bir dönem Substack\u0026#39;te yazdı, sonra Substack\u0026&#8230;", "articleBody": "İlk blog yazmaya Medium \u0026#39;da başlamıştım o sırada; nasıl yazılır, ne şekilde yazılır vesaire vesaire diye araştırırken keşfettiğim bir Medium yazarı vardı. O da Justin Cox\u0026#39;du. Daha sonra belli bir dönem Substack\u0026#39;te yazdı, sonra Substack\u0026#39;in birtakım politikalarından dolayı kendi barındırılan bir blog başlattı. Şu anda hem Medium\u0026#39;da hem de kendi blogunda yazıyor. Yazılarındaki akıcılığını 