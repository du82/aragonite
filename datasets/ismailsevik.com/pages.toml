full_description = '''Ana Sayfa Kayıtlar Anne Babalara Ricamdır Evlatları lise üniversite okuyan anne babalara ricamdır, lütfen birgün evlatlarınıza haber vermeden okulda çocuklarınızı çaktırmadan bir gözlemleyin. Olayın sizin sandığınız gibi olmadığını göreceksiniz. Sizleri anlayabiliyorum ancak olay sizin umduğunuz gibi değil. Vallahi değil. Ben şahsen çok üzülüyorum. Evlatlarınıza değil, siz velilere üzülüyorum. Onların hâli hal değil. Ahlakına önem vermediyseniz vah haline.Ahlâkı anne baba veremiyorsa, okul, asker polis, devlet vesaire hiç veremez. Gerçi şimdi gençlere "18 yaşına geldiniz artık yetişkinsiniz" diye nice naneler yutturuyolar da neyse. O artık yetişkin kendi kararlarını kendi verebilir demeyin. Kendi kararlarını kendileri veremez. Hele ki şu sosyal medya ve internet toplumunda hayatta veremez. Lütfen sizden ricam gidin evlatlarınızı okulda onlardan habersiz ziyaret edin, gözlemleyin. Yanlış bir şey yapıyorsa gerekirse dövün, azarlayın. Bunun çok faydası olur. Aksini söyleyen pedagoglara inanmayın. Aksini söyleyen pedagogların çoğunun çocuğu dahi yok. İçim yanıyor içim! { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://www.ismailsevik.com/2024/12/anne-babalara-ricamdr.html" }, "headline": "Anne Babalara Ricamdır", "description": "Evlatları lise üniversite okuyan anne babalara ricamdır, lütfen birgün evlatlarınıza haber vermeden okulda çocuklarınızı çaktırmadan bir gözlemleyin. Olayın sizin sandığınız gibi olmadığını göreceksiniz. Sizleri anlayabiliyorum ancak olay sizin umdu&#8230;", "articleBody": "Evlatları lise üniversite okuyan anne babalara ricamdır, lütfen birgün evlatlarınıza haber vermeden okulda çocuklarınızı çaktırmadan bir gözlemleyin. Olayın sizin sandığınız gibi olmadığını göreceksiniz. Sizleri anlayabiliyorum ancak olay sizin umduğunuz gibi değil. Vallahi değil. Ben şahsen çok üzülüyorum. Evlatlarınıza değil, siz velilere üzülüyorum. Onların hâli hal değil. Ahlakına öne