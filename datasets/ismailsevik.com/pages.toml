title = "Son attığınız post neydi? - İsmail Şevik"
description = "Son attığınız post neydi? Peki ya tweet? Peki ya reels videosu? Hadi onu geçelim, son kaydettğiniz içerik neydi? Biraz daha zorlaştıralım, e..."
full_description = '''Ana Sayfa Kayıtlar Son attığınız post neydi? Son attığınız post neydi? Peki ya tweet? Peki ya reels videosu? Hadi onu geçelim, son kaydettğiniz içerik neydi? Biraz daha zorlaştıralım, en son zerinde derince düşündüğünüz içerik neydi?Hepimizin, hepinizin cevabı aynı: Hatırlamıyorum!İnstagram'ı aktif olarak kullandığım dönemde herkes mesaj olarak:"Bu videoyu gördün mü? Bu postumu gördün mü? Nasıl olmuş, vesaire vesaire..." diye soruyorlardı. Ben arkadaşlara diyorum:"Ben bunlardan anlamıyorum, gidin anlayan birisine sorun, bana da atmayın şunları." diyorum, yine de atıyorlardı. Şu an öyle bir derdim yok. Bu sefer de:"Senin Instagram'ın yoktu demi?" diye soruyorlar. Ben de içimden bir oh çekerek ve sinsi gülüşümle: "Evet" diyorum. Bu sefer yanımdaki başka arkadaşlara soruyorlar.Her seferinde bıktım aynı sualden. "Nasıl olmuşum? Güze mi? Şöyle mi? Böyle mi?" İçimden bilmem ney gibi olmuşsun demek geçiyor ama diyemiyorum. İnsanların aklında 24 saat hatta ne 24 saati, yarım saat sonra bile akılda kalmayacak şeyleri niye insanlara sorayım ya? Bir postun, tweetin, durumun süresi 24 saat. 24 saat sonra siliniyor. Niye bunca tantana? Niye bu kadar özenip bezenmek? Haftadan haftaya kıyafet alan arkadaşlarımı biliyorum ya. Manyak mıdır nedir?İnstagram hesabımı silmekle çok iyi bir şey yaptım. Bir de şua Youtube Shorts'lardan kurtulabilsem pek bir memnun olacağım. Ona da kısmen çözüm buldum. Brave uygulaması sayesinde Shorts'ları kapatabiliyorum, mis gibi.O zaman yazıyı bir soruyla bitirelim: Son okuduğunuz yazı neydi? Ne anladınız? { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://www.ismailsevik.com/2025/02/son-attiginiz-post-neydi.html" }, "headline": "Son attığınız post neydi?", "description": "Son attığınız post neydi? Peki ya tweet? Peki ya reels videosu? Hadi onu geçelim, son kaydettğiniz içerik neydi? Biraz daha zorlaştıralım, en son zerinde derince düşündüğünüz içerik neydi? Hepimizin, hepinizin cevabı aynı: Hatırlamıyorum! İnstagram\u0026&#8230;", "articleBody": "Son attığınız post neydi? Peki ya tweet? Peki ya reels videosu? Hadi onu geçelim, son kaydettğiniz içerik neydi? Biraz daha zorlaştıralım, en son zerinde derince düşündüğünüz içerik neydi? Hepimizin, hepinizin cevabı aynı: Hatırlamıyorum! İnstagram\u0026#39;ı aktif olarak kullandığım dönemde herkes mesaj olarak:\u0026quot;Bu videoyu gördün mü? Bu postumu gördün mü? Nasıl olmuş, vesaire vesaire...\u0026quot; diye soruyorlardı. Ben arkadaşlara diyorum:\u0026quot;Ben bunlardan anlamıyorum, gidin anlayan birisine sorun, bana da atmayın şunları.\u0026quot; diyorum, yine de atıyorlardı. Şu an öyle bir derdim yok. Bu sefer de:\u0026quot;Senin Instagram\u0026#39;ın yoktu demi?\u0026quot; diye soruyorlar. Ben de içimden bir oh çekerek ve sinsi gülüşümle: \u0026quot;Evet\u0026quot; diyorum. Bu sefer yanımdaki başka arkadaşlara soruyorlar. Her seferinde bıktım aynı sualden. \u0026quot;Nasıl olmuşum? Güze mi? Şöyle mi? Böyle mi?\u0026quot; İçimden bilmem ney gibi olmuşsun demek geçiyor ama diyemiyorum. İnsanların aklında 24 saat hatta ne 24 saati, yarım saat&#8230;", "datePublished": "2025-02-27T00:39:00+03:00", "dateModified": "2025-02-27T00:39:26+03:00", "image": { "@type": "ImageObject", "url": "https://1.bp.blogspot.com/-E250bQMM8tk/XomH5DdorOI/AAAAAAAAPY8/SCYwi79WjckWC8wHKK7OblI82BpT9JquACNcBGAsYHQ/s1600/jagotheme-img.png", "height": 348, "width": 1200 }, "publisher": { "@type": "Organization", "name": "İsmail Şevik", "logo": { "@type": "ImageObject", "url": "https://1.bp.blogspot.com/-50s1RMWV7jI/X8OaYjJcMiI/AAAAAAAAQK4/sWcpbaP0Sq0hsW473Vnb8AyBvYvdSQEPwCNcBGAsYHQ/s0/jd-logo.png", "width": 297, "height": 45 } }, "author": { "@type": "Person", "name": "İsmail Şevik", "url": "https://www.blogger.com/profile/02487074348298844362", "image": "//blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhCcDXIxudHnOx3yKBJlFPn8yKzJSUTNHkxw-S4FC0KMNnuq9xrC9RiGMdLKTah54i_jjOgqbu6Sjc7H5n6OrqvlsSOf96asgOvskBTv