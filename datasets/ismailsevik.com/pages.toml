full_description = '''Ana Sayfa Kayıtlar Gmail’de Belirli Bir Adresten Gelen E-postaları Yıldızlamak Gmail’de belirli bir e-posta adresinden gelen mesajları yıldızlamak için aşağıdaki adımları takip edebilirsiniz. Gmail Hesabınıza Giriş Yapın: Gmail hesabınıza giriş yapın. Filtre Oluşturun: Sağ üst köşede bulunan filtre simgesine tıklayın ve Ayarlar menüsüne girin. Yeni Filtre Oluştur butonuna tıklayın. Filtreyi Özelleştirin: Açılan pencerede, "Gönderen" bölümüne yıldızlamak istediğiniz e-posta adresini girin. (Örneğin: örnek@domain.com) Yıldızlı E-posta Seçeneğini İşaretleyin: "Filtre oluştur" seçeneğine tıklayın ve "Yıldız ekle" kutusunu işaretleyin. Filtreyi Uygula: Son olarak, Filtreyi Uygula butonuna tıklayarak işlemi tamamlayın. Bu adımlarla, belirttiğiniz adresten gelen tüm yeni e-postalar otomatik olarak yıldızlanacaktır. Böylece önemli mesajları kolayca takip edebilirsiniz. { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://www.ismailsevik.com/2024/11/gmailde-belirli-bir-adresten-gelen-e-postalari-yildizlamak.html" }, "headline": "Gmail&#8217;de Belirli Bir Adresten Gelen E-postaları Yıldızlamak", "description": "Gmail&#8217;de belirli bir e-posta adresinden gelen mesajları yıldızlamak için aşağıdaki adımları takip edebilirsiniz. Gmail Hesabınıza Giriş Yapın: Gmail hesabınıza giriş yapın. Filtre Oluşturun: Sağ üst köşede bulunan filtre simgesine &#8230;", "articleBody": "Gmail&#8217;de belirli bir e-posta adresinden gelen mesajları yıldızlamak için\n aşağıdaki adımları takip edebilirsiniz.\n\u003cb\u003e Gmail Hesabınıza Giriş Yapın: \u003c/b\u003e Gmail hesabınıza giriş yapın.\u003cb\u003e Filtre Oluşturun:\u003c/b\u003e Sağ üst köşede bulunan filtre simgesine tıklayın ve\n Ayarlar menüsüne girin. \u003cb\u003e Yeni Filtre Oluştur \u003c/b\u003e butonuna tıklayın.\n \u003cb\u003e Filtreyi Özelleştirin: \u003c/b\u003e Açılan pencerede, \u003cb\u003e \u0026quot;Gönderen\u0026quot; \u003c/b\u00