full_description = '''Ana Sayfa Kayıtlar Blogumun tasarımı hakkında Uzunca bir süredir blogumun tasarımı hakkında net bir karara varamadım, varamıyorum. Normalde eski tarz ve Serif fontlarının olduğu tasarımı tercih ederim. Bu temanın fontu da Serif ama tasarımı eskiyi anımsatmıyor.Ben daha çok uzun yıllardır yazan birisinin blogu gibi gözüksün istiyorum. Kararsızım. Şöyle güzel bir Şerif fontuyla renk paleti bulamadım. Mesela Medium'un fontu güzel. Manuel Moreale'nin fontu da güzel. Sonra The Guardian, The Verge, Jago Desain'ın fontu da güzel. Ama hangisi?Kafamda bende bulunan tasarımların hep bir eksik noktası var. Bir türlü, hah bu tema tam benlik diyemiyorum. Bu noktada çok ciddi bir tavsiyeye ihtiyacım var. Tasarlattırmak için param var. Ancak ne şekilde olacağına dair net fikrim yok. { "@context": "http://schema.org", "@type": "BlogPosting", "mainEntityOfPage": { "@type": "WebPage", "@id": "https://www.ismailsevik.com/2025/01/blogumun-tasarimi-hakkinda.html" }, "headline": "Blogumun tasarımı hakkında ", "description": "Uzunca bir süredir blogumun tasarımı hakkında net bir karara varamadım, varamıyorum. Normalde eski tarz ve Serif fontlarının olduğu tasarımı tercih ederim. Bu temanın fontu da Serif ama tasarımı eskiyi anımsatmıyor. Ben daha çok uzun yıllardır yazan&#8230;", "articleBody": "Uzunca bir süredir blogumun tasarımı hakkında net bir karara varamadım, varamıyorum. Normalde eski tarz ve Serif fontlarının olduğu tasarımı tercih ederim. Bu temanın fontu da Serif ama tasarımı eskiyi anımsatmıyor. Ben daha çok uzun yıllardır yazan birisinin blogu gibi gözüksün istiyorum. Kararsızım. Şöyle güzel bir Şerif fontuyla renk paleti bulamadım. Mesela Medium\u0026#39;un fontu güzel. Manuel Moreale\u0026#39;nin fontu da güzel. Sonra The Guardian , The Verge , Jago Desain\u0026#39;ın fontu da güzel. Ama hangisi? Kafamda bende bulunan tasarımların hep bir eksik noktası var. Bir türlü, hah bu tema tam benlik diyemiyorum. Bu noktada çok ciddi bir tavsiyeye ihtiyacım var.