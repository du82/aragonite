title = "ISMIR 2011"
full_description = "Taxicabs and SuperShuttle (305-871-2000) vans are available on the arrival (ground) level of the airport, outside of the baggage claim areas. It costs $19 per passenger for the shuttle service from the airport to the conference venue. Taxi is $32 flat charge one way plus tips. Car rental shuttles pick-up and drop-off areas are located on the upper (departure) level of the airport. It takes about 25 minutes driving from the airport to Miami Beach. To reach the conference venue: GO Airport Shuttle (954-561-8888 or 800-244-8252) provides shared ride and private car services. The estimated rates are $21 per passenger for shared ride and $70 for private car service. Taxi cabs are available at the Taxi Podium located outside the baggage area on the lower level at the curb of each terminal. The rate is approximately $72 from the airport to Miami Beach. The Rental Car Center locates in one building next to Terminal 1. It takes about 50 minutes driving from the airport to Miami Beach. To reach the conference venue: Late-breaking/demo submission system is now open. Details can be found in call for paper and submission. Deadline: Monday, September 5."
