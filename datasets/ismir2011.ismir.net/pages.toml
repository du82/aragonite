["https://ismir2011.ismir.net"]
title = "ISMIR 2011"
full_description = "The 12th International Society for Music Information Retrieval Conference will take place in Miami,Florida (USA) October 24–28, 2011. ISMIR 2011 celebrates the ubiquity of music, as well as the diversity of research—both basic and applied—that seeks to enhance the ways in which we interact with the music around us. ISMIR is a unique place for discussing ideas, results, and issues with the representatives of academia, industry, entertainment, and education, including researchers and developers, educators and librarians, and students and professional users. Like previous conferences, ISMIR 2011 will feature both introductory and in-depth tutorials, as well as presentations of research papers, demonstrations, and several concerts. To foster the high quality and openness of ISMIR, all regular papers will be selected through a double-blind review process, including a rebuttal phase. New this year, ISMIR 2011 is soliciting submissions of music compositions that rely on tools and research germane to the MIR community. Accepted works will be presented at a special concert during the conference. Since its inception in 2000, ISMIR has been the world’s leading forum for research on the modelling, creation, searching, processing and use of musical data. As the term Music Information Retrieval (MIR) indicates, this research is motivated by the desire to provide music lovers, music professionals and music industry with robust, effective and usable methods and tools to help them locate, retrieve and experience the music they wish to have access to. MIR is a truly interdisciplinary area, involving researchers from the disciplines of musicology, cognitive science, library and information science, computer science and many others. Late-breaking/demo submission system is now open. Details can be found in call for paper and submission. Deadline: Monday, September 5."
year_published = 2025
clearnet = "https://ismir2011.ismir.net"
category = "SitesList"
