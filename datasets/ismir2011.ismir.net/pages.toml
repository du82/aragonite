["https://ismir2011.ismir.net/privacy.html"]
title = "ISMIR 2011"
full_description = "This statement informs you how Florida International University will collect and process your personal data when you access this web site (“this Web site”). This statement constitutes the Privacy Policy for the ISMIR Web site only. Please note that while Florida International University respects individual privacy, Web sites of other units within FIU may have different privacy policies. As it is true of most Web sites, we gather certain information automatically and store it in log files. This information includes internet protocol (IP) addresses, browser type, internet service provider (ISP), referring/exit pages, operating system, date/time stamp, and clickstream data. We use this information, which does not identify individual users, to analyze trends, to administer the site, to track users’ movements around the site and to gather demographic information about our user base as a whole. We do not link this automatically-collected data to personally identifiable information. Where you are required under this website to provide personal data (such as when filling out forms) this data will be used for the following purposes: to confirm registrations, to provide you with information about our conferences and our services, to provide you with information about ISMIR, to contact you when necessary. Please note that Florida International University is a public university and is subject to Florida’s public records law which requires that all information received in connection with state business be made available to anyone upon request, unless the information is exempt by a specific statute. The security of your personal information is important to us. When you enter sensitive information (such as credit card number and/or social security number) on our registration or order forms, we encrypt that information using secure socket layer technology (SSL). To learn more about SSL, follow this link http://en.wikipedia.org/wiki/SSL We follow generally accepted industry standards to protect the personal information submitted to us, both during transmission and once we receive it. However, no method of transmission over the Internet, or method of electronic storage, is 100% secure. Therefore while we strive to use commercially acceptable means to protect your personal information, we cannot guarantee its absolute security. If you have any questions about security on our Web site, you can send email to us at taoli@cs.fiu.edu."
year_published = 2025
clearnet = "https://ismir2011.ismir.net/privacy.html"
