["https://ismir2011.ismir.net/music.html"]
title = "ISMIR 2011"
full_description = "We are pleased to offer a special category of submissions this year to ISMIR involving music compositions that rely on tools and research germane to the MIR community. We encourage submissions of new music made possible through techniques from the music information retrieval community and/or sonification of large data setsy. Music submissions are treated like paper submissions and should be entered using the link provided at ismir2011.ismir.net. Note that all submissions are blind in nature; please remove all identifying information from audio files, scores, and abstracts. Please select the “Music” category when submitting for programming consideration during these special concerts. Music submissions should include a maximum two-page description of the work submitted, including a 150–200 word abstract as well as a PDF file containing the score (if applicable). Links to online audio excerpts or other multimedia material and detailing any special requirements for the presentation should be specified on the web submission form. Acceptance is based on the recommendation of the music selection committee, the work’s relevance to MIR, availability of performers (if applicable), and production quality (if applicable). If your submitted work involves live performer(s), please indicate your ability to provide them for performance at the concert. Late-breaking/demo submission system is now open. Details can be found in call for paper and submission. Deadline: Monday, September 5."
