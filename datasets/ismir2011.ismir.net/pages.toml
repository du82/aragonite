["https://ismir2011.ismir.net/IFA.html"]
title = "ISMIR 2011"
full_description = "We encourage submissions of novel and previously unpublished contributions in areas including, but not limited to, the following: In addition to research papers, we also solicit music submissions, late-breaking/demo submissions, tutorial proposals, and exhibits. More details on each category are provided below. All papers will be peer-reviewed according to their novelty, technical content, presentation, and contribution to the overall balance of topics and disciplines represented at ISMIR 2011. Paper submissions should satisfy the following conditions: In ISMIR2011 reviews will be doubly-blinded; that is, authors and reviewers will be anonymous to each other. To ensure this please keep the author list as appearing in the text and avoid excessive reference to your own work. Note that although authors can indicate preference for oral or poster presentation upon submission, final scheduling to an oral or poster session remains at the discretion of the organizing committee. The presentation format has no relation to the reviewer judgment of paper quality and will be determined after the acceptance judgement. Three awards will be given as part of ISMIR 2011: the best paper award, the best student paper award, and the best presentation award. The presentation award will have two subcategories, oral and poster, which will be selected by votes collected during the conference. All poster sessions, excluding the late-breaking/demo session on Friday, the 28th will be held in the Regency Ballroom. For the late-breaking/demo session, the venue will be the Promenade Ballroom. Each poster will be allocation an area in the room, with a board marked with its poster ID on an easel. The dimension of a poster board is 36in by 48in (or 48in by 36in if used in landscape mode). A presenter will be responsible for removing his/her poster at the conclusion of its session. The first day of the conference (October 24) will consist of parallel sessions of half-day tutorials each concentrating on a single topic and lasting about 3 hours, including a break. The tutorials are presented either at an introductory level or in depth and are intended to provide an informative and stimulating coverage of current topics in MIR and beyond. Tutorial proposals should consist of a 1–4 page abstract including the following:"
