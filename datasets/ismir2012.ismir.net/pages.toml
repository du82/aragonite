full_description = "You are here: Home › Sponsors › Sponsorship programmes Sponsorship programmes Become a proud sponsor of ISMIR 2012. Come, hear about the latest cutting-edge research in MIR, network and showcase your company's latest research to an international crowd of MIR practitioners. ISMIR 2012 offers sponsorship opportunities at different levels: Gold, Silver and Bronze sponsorships. Your support will be clearly visible on the web and at the conference venue. Read about sponsorship benefits below. Other pro-active forms of sponsoring are very welcome as well, such as travel grant support for students, conference bags provisioning, support for reception and cultural activities, paper awards, etc. Please contact us (ismir2012@ismir.net) for further information. Gold level sponsorship (4000€ and above) Benefits: Recognition as Gold level sponsor in electronic communications, and on the web with a large logo Large logo on conference banners Large logo in conference program Large logo in printed proceedings 1 slot for a scientific poster during entire conference Up to 3 complimentary full-conference registrations Up to 3 items (flyer, CD, etc.) to be inserted in the conference bag Silver level sponsorship (between 2500-3500€) Benefits: Recognition as Silver level sponsor on the web with a medium logo Medium logo on conference banners Medium logo in conference program Medium logo in printed proceedings 1 slot for a scientific poster during entire conference 1 complimentary full-conference registration Up to 1 item (flyer, CD, etc.) to be inserted in the conference bag Bronze level sponsorship (between 1500-2000€) Benefits: Recognition as Bronze level sponsor on the web with a small logo Small logo on conference banners Small logo in conference program Small logo in printed proceedings 1 slot for a scientific poster during the demo session 1 complimentary 1-day-registration to conference Other forms of sponsoring Individual student sponsoring (estimated between 1