["https://ismir2012.ismir.net/index.html"]
title = "Welcome — ISMIR 2012"
full_description = "You are here: Home Welcome The 13th International Society for Music Information Retrieval Conference will take place in Porto, Portugal, October 8th-12th, 2012. It is organised by INESC TEC, in partnership with the TNSJ in Porto. The annual Conference of the International Society for Music Information Retrieval (ISMIR) is the world's leading research forum on processing, searching, organizing and accessing music-related data. The revolution in music distribution and storage brought about by digital technology has fueled tremendous research activities and interests in academia as well as in industry. The ISMIR Conference reflects this rapid development by providing a meeting place for the discussion of MIR-related research, developments, methods, tools and experimental results. Its main goal is to foster multidisciplinary exchange by bringing together researchers and developers, educators and librarians, as well as students and professional users. ISMIR 2012 will feature introductory and in-depth tutorials, presentations of research papers and posters as well as invited talks reflecting the true interdisciplinary nature of MIR research. To ensure a high quality of the contributions, all papers will go through a selection process. ISMIR 2012 will also feature a special session for demonstrations and late-breaking news, where no proofs, results nor evaluations are required —just great, new, insightful ideas and demos. ISMIR 2012 will also include a musical programme. The aim of the concert programme is two-fold: to encourage the use of Music Information Retrieval (MIR) techniques in the creation of new music and to explore music that can suggest novel ideas for research in the MIR ﬁeld. Related content Important dates Committee Keynotes Proceedings Satellite events Programme"
