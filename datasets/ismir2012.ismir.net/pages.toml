["https://ismir2012.ismir.net/participants/registration.html"]
title = "Registration — ISMIR 2012"
full_description = "You are here: Home › Participants › Registration Registration Important note: Remember that, for each paper/music piece, at least one author must be registered for the conference by Friday 17th August 2012. If none of the authors is registered by this date, the paper/music piece will be removed from the conference proceedings and programme. Online registrations are now closed. Registrations are now only possible (upon availability) directly at the venue, at specific time slots indicated on the program. Non-student and Student registrations to the conference include: Your individual 2012-2013 ISMIR membership fee (i.e. 10 €) Attendance to all paper sessions, posters, invited speeches between 9th-12th October Attendance to all concerts mid-morning and mid-afternoon coffee breaks between 9th-12th October 4 meals between 9th-12th October 1 ticket for the conference banquet on 11th October 1 ticket for the reception on 8th October A delegate bag including an electronic version of the conference proceedings (to purchase a printed copy of the book of proceedings, see here), among other things... 1-day registration includes: Your individual 2012-2013 ISMIR membership fee (i.e. 10 €) Attendance to all paper sessions, posters, and invited speech of that day Attendance to that day's concert mid-morning and mid-afternoon coffee breaks of that day (2 in total) that day's meal A delegate bag including an electronic version of the conference proceedings (to purchase a printed copy of the book of proceedings, see here), among other things... About Tutorial registration: The price indicated below is for attendance to 1 single tutorial (either morning or afternoon) on 8th October. Attendance to 1 tutorial in the morning and 1 in the afternoon is possible, for twice the price indicated below. People attending both morning and afternoon tutorials will have the meal of 8th October included. Prices (All prices in Euros) Non-studentStudents(*)1-day1 single tutorialEarly (until 23rd July) 400€ 300€ n/a 30€ Late (24th July-23rd September, upon availability) 465€ 350€ n/a 40€ Onsite (upon availability) 500€ 380€ 138€ 40€ Extra banquet ticket for accompanying person: 50€ (*) You must provide proof of your student status to get the student discount (NB: Post-doc are not eligible for student rates). Lunch, reception and banquet are complimentary (0€) for registered participants."
