["https://ismir2012.ismir.net/about/about-ismir.html"]
title = "About ISMIR — ISMIR 2012"
full_description = "You are here: Home › About › About ISMIR About ISMIR Since its inception in 2000, the conference of the International Society for Music Information Retrieval has been the world’s leading forum for research on the modelling, creation, searching, processing and use of musical data. As the term Music Information Retrieval (MIR) indicates, this research is motivated by the desire to provide music lovers, music professionals and the music industry with robust, effective and usable methods and tools to help them locate, retrieve and experience the music they wish to have access to. MIR is a truly interdisciplinary area, involving researchers from the disciplines of musicology, cognitive science, library and information science, computer science and many others. Visit http://www.ismir.net/ for the cumulative list of all past papers and posters in PDF, and much more information of the International Society for Music Music Information Retrieval. Most communication regarding the Society and MIR research in general happens on the Music-IR mailing. In order to register, follow the indications on the ISMIR website. Previous ISMIR conferences: ISMIR 2011, 24-28 October 2011, Miami (Florida). ISMIR 2010, 9-13 August, 2010, Utrecht (Netherlands) ISMIR 2009, 26-30 October 2009, Kobe (Japan) ISMIR 2008, 14-18 September 2008, Philadelphia (USA) ISMIR 2007, 23-30 September 2007, Vienna (Austria) ISMIR 2006, 8-12 October 2006, Victoria, BC (Canada) ISMIR 2005, 11-15 September 2005, London (UK) ISMIR 2004, 10-15 October 2004, Barcelona (Spain) ISMIR 2003, 26-30 October 2003, Baltimore, Maryland (USA) ISMIR 2002, 13-17 October 2002, Paris (France) ISMIR 2001, 15-17 October 2001, Bloomington, Indiana (USA) ISMIR 2000, 23-25 October 2000, Plymouth, Massachusetts (USA)"
