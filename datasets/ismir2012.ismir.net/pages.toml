["https://ismir2012.ismir.net/about/news/news/RSS"]
title = "News"
full_description = "MIRrors was conceived as a special session of the Conference of the International Society for Music Information Retrieval (ISMIR) 2012 and as a complementary journal special issue, supported by the MIReS European Project. The aim of both the session and this call is transforming into knowledge and insights on promising future research some of those scattered data, algorithms, ideas and findings generated during the evolution of the Music Information Retrieval field (especially since the year 2000). We encourage authors to dig into our past to uncover hidden gems of knowledge that remained unnoticed or that deserve a new look. Selected articles will be published in a special issue of the Journal of Intelligent Information Systems published by Springer (2011 impact factor 0.618). This call is targeting both extended versions of papers presented at the MIRrors ISMIR 2012 special session, and original manuscripts. We are looking for original, challenging or thought-provoking papers that are able to connect the past with the present and the future of the discipline. Of exceptional value will be those papers capable of combining quantitative methodologies to assess or support abstract or conceptual ideas. Articles should be organized to foster debate, discussion and self-criticism about MIR topics, methods and achievements. MIRrors articles should present a personal view, backed up with data, and taking into account the state-of-the-art for the selected topic. Typical state-of-the-art reviews, tutorials or white/position papers do not fit this call, as they tend to focus either only on the past or only on the future of a particular topic. We are looking for papers articulating promising novel ideas upon a systematic and exhaustive revision of the existing MIR legacy.Potential approaches (but not exhausting the options) for a MIRrorspaper could be: Prospective authors should visit http://www.springer.com/computer/database+management+%26+information+retrieval/journal/10844# for information on paper submission formal issues. Manuscripts should be submitted using the JIIS editorial management system http://www.editorialmanager.com/jiis/. Please select the “MIRrors” option when the article type is requested."
year_published = 2025
clearnet = "https://ismir2012.ismir.net/about/news/news/RSS"
