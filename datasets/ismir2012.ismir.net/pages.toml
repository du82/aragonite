["https://ismir2012.ismir.net/authors/submission.html"]
title = "Submission — ISMIR 2012"
full_description = '''You are here: Home › Authors › Submission Submission Paper submission Paper submissions should satisfy the following conditions: Submitted papers must be no more than 6 pages long when formatted with one of the templates below Papers must be submitted according the deadline specified here. The reviewing process is double-blind; that is, authors and reviewers will be anonymous to each other. To ensure this, when preparing your manuscript for submission, do not put actual authors names on the first page and avoid excessive or explicit references to your own work. Submission must consist of original contributions (not previously published and not currently being considered for publication elsewhere). There is no limitation on the number of submissions per author. For each accepted paper, at least one author must register for the ISMIR 2012 conference prior to the author registration deadline (see dates here). Papers with no registered author on the author registration deadline will be removed from the conference programme and will not appear in the proceedings. About deadline extensions There will be no extension to the paper submission deadline (13th April). However authors of registered papers on 13th April will be allowed to upload new versions of their papers (in pdf format) until 20th April (23h59 American Samoa timezone). No other changes will be possible (i.e. authors will not be able to change title, abstract, authors, keywords, or other metadata). No submission of new papers will be possible after 13th April. On the reviewing process To ensure a high quality of the contributions, all papers will go through a double-blind selection process with at least three reviewers per submission, according to the following criteria: Novelty of the paper Scholarly/scientific quality Appropriateness of topic Importance Paper organization Readability Stimulation potential Fostering of open source and free software tools/data Fostering reproducibility of research Contribution to the overall balance of topics at ISMIR 2012 We encourage reviewers to follow a series of guidelines, that can be found on that page. Different from last year's reviewing process, the rebuttal phase will be replaced by a single-blind Committee discussion phase, open only to PC members and reviewers (where papers will remain anonymous but reviewers names will be disclosed). Papers will be classified as "reject", "accept" or "conditional accept". Final acceptance of "conditional accept" papers will depend on compliance of authors revision to reviewers' comments. "Conditional accept" papers that do not take reviewers' comments into account will be rejected. After the reviewing process, accepted papers will be designated (by the Programme Committee and Programme Chairs) either as posters or as lectures. All accepted papers have the same status, assignment as poster or lecture is not indicative of the relevance or potential impact but on the type of content and way to better reach the intended audience. Paper templates Submit your paper in PDF format according to one of the following templates: ISMIR 2012 LateX Template Package ISMIR 2012 Word Template Package Paper submission webpage >>Submit your formatted paper on https://www.softconf.com/c/ismir2012/ (left column "For Authors", choose "click here to make a new submission").<< Tutorial submission Tutorial proposals should consist of a 1–4 page abstract including the following: Title Outline of the tutorial content Intended and expected audience Short biography of the presenter(s) Any special requirements Contact information The proposals should be submitted as a PDF attachment via email to <ismir2012-tutorials@ismir.net> (see here for deadline). Acceptance/rejection decisions will be made by the ISMIR 2012 Tutorial Chair and Scientific Chairs (see here for notification date). The decision will depend on the following criteria: relevance (i.e. of interest to the whole community or only a segment thereof) suitability to generally knowledgeable student in MIR rather than specialists quality comprehensiveness / coverage originality of topics with respect to previous ISMIR tutorials novelty of authors with respect to previous ISMIR tutorials expertise of authors foster complementarity of tutorials foster open source and free software tools/data, reproducible research Late-break/demo suggestion There is a dedicated wiki for participating in this session. Submission to the special session "MIRrors: Looking back to the past of ISMIR to face the future of MIR" What is MIRrors? ISMIR 2012 will feature a special session on "Looking back to the past of ISMIR to face the future of MIR", (the "MIRrors" session) in which authors will present reflections on the evolution of the MIR field or a particular MIR topic since 2000, and provide insights on short-term future challenges. This special session is sponsored the MIReS research project. We are looking for provocative, controversial ideas, challenging and thought-provocative positional papers. For instance, MIRrors papers may: Reflect on why a particular topic has failed, is systematically not improving, and why it may be doomed to continue this way. Reflect on negative results that have, or have not, had the proper impact on MIR research. Retrieve/revisit some forgotten or scarcely cited papers or promising idea(s) from a particular edition of the conference, or a number of editions, whose potential has not been fully exploited. Remind, recover, revisit what was presented on a given edition of the ISMIR conference, highlighting the best or most significant contributions. Trace and explain the evolution of a given idea through different editions of ISMIR. Provide a review of the impact of a particular idea on the MIR community. Provide a review of the impact of a particular MIR idea/topic on other conferences or neighboring fields of science (e.g. including a technical review in terms of h-index). Propose replication studies, in particular showing discrepancies between commonly accepted ideas in the MIR community and reality. ... Participating to the MIRrors session The MIRrors session consists of invited submissions. Nevertheless, researchers are invited to express their interest in participating to the MIRrors session by submitting an abstract of no more than 200 words to <ismir2012-papers@ismir.net>. (Note the very early deadline for expressions of interest. Expressions of interest reaching the Committee after this deadline, or longer than the word limit will not be considered.) Selected authors will then be individually invited by the Committee to submit a paper to be reviewed for possible inclusion in the session (see dates below). The submitted papers will be reviewed by 3 referees. This call applies both to PhD students reviewing the state-of-the-art for their thesis as well as seasoned researchers. Format Paper submissions (only for invited authors) should comply with the regular ISMIR paper format. Papers should be 6 pages-long at most. Accepted papers will be included in the conference proceedings. Accepted papers will be online 1 month before the conference, and will be presented at the conference in short talks, leaving plenty of room for discussion. Special Issue A selection of papers from the MIRrors session will be considered for inclusion, together with a regular set of submissions for a special issue of the Journal of Intelligent Information Systems on the topic of "Current status and future directions in MIR research". This special issue is intended to appear after ISMIR 2012 and to also comprise papers not presented at the conference. Important dates for MIRrors Deadline for expressions of interest to MIRrors: December 19th 2011 passed Committee invites selection of authors to submit: January 12th 2012 passed Deadline for MIRrors papers (only for invited authors): May 25th 2012 passed Notification of acceptance: June 18th 2012 passed Music submission See here. Related content Important dates Call for Participation'''
