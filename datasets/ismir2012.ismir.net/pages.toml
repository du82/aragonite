["https://ismir2012.ismir.net/participants/venue.html"]
title = "Venue — ISMIR 2012"
full_description = '''You are here: Home › Participants › Venue Venue ISMIR 2012 will take place in the São Bento da Vitória Monastery, a classified National Monument since 1977, at the very heart of old Porto. Consult this page for information on how to reach the place from the airport, the train station or your hotel. Location: Rua de São Bento da Vitória, 4050-543 Porto Conference events in the main venue are scheduled in different places: The main room hosts oral paper presentations and concerts. Upstairs and ground floor galleries, where different posters are hung everyday, and where coffee is served twice a day. The two tutorial rooms on the first floor. The "Arquivo Distrital do Porto", where lunches are served. Time slots for lunches are shown on the programme. Directions from one place to another are signposted, assistants and members of the organisation are also ready to help at any time at the front desk. Getting there Have a look at the above map with Google "Street View". If you are still lost, ask anyone for the "Clérigos" Church. It looks like this: Then on your right hand, you should see this: go ahead in front of you, approximately 100m down this street. About Lunches Lunches are served everyday in the "Arquivo Distrital do Porto". This is a different building than the main venue, yet directly connected to it through an indoor corridor. Directions to lunch are signposted. Tuesday to Friday lunches (i.e. 4 lunches in total) are included in the registration fee. As for Monday lunch, it will be served only to participants who registered for both morning and afternoon tutorials. All trash and garbage will be collected at the same place where the lunches were distributed. Time slots for lunches are shown on the programme. Auxiliary Venue Some of the conference events take place in an auxiliary venue: the bar/restaurant/cultural/art gallery/café called "Maus Hábitos". Namely, the late-breaking news/demos session, Friday night's concert, and suggested general nightly hang-out. The exact address is: Rua Passos Manuel 178, 4th floor, Porto Going from one venue to the other takes about 10 minutes walking. Simply have a look at the Google map here, or follow the graphical indications on your conference guide.'''
