["https://ismir2012.ismir.net/sponsors/student-financial-support.html"]
title = "Student financial support — ISMIR 2012"
full_description = "You are here: Home › Sponsors › Student financial support Student financial support Financial support to students attending ISMIR 2012 will take a number of forms: The International Society for MIR will provide student travel grants. If you are a student and the first author of an accepted paper at ISMIR 2012, read the conditions for applying and apply here. The local organisation will also sponsor free registration to the conference for a small number of students. (Students will be selected among those applying to the ISMIR student travel grant above, so you don't need to apply twice). Google will gently provide a 500$ best student paper award. The best student paper will be selected by the conference Committee. (You don't need to apply for that award. If you are a student and are the first author on a paper, you are already being considered for the award.) Post-conference note: Official ISMIR student travel grants were awarded to: Joe Cheri Ross Véronique Sébastien Jill Woelfer Juanjo Bosch Katerina Kosta Emanuele Benetos The local organisation awarded free registration to: Kerstin Neubarth Diane Watson Polina Proutskova The Google Best Student Paper award was awarded to: Véronique Sébastien"
