["https://ismir2012.ismir.net/event/proceedings.html"]
title = "Proceedings — ISMIR 2012"
full_description = "You are here: Home › Event › Proceedings Proceedings Electronic proceedings will be distributed at no extra cost to all registered participants. Printed proceedings will be provided, at the extra cost of 20€ per book of proceedings, to participants who specifically ask for them in the registration process (think about the trees before you do). Notice the deadline for printed proceedings request. All participants who do not make this request at registration will not receive printed proceedings. After the printed proceedings request deadline, printed proceedings can only be purchased by contacting directly the publisher (FEUP Edições). Individual pdf for the papers are available as links in the programme page. The whole book of proceedings is also available in pdf format (642 pages, 66.5 MB). As an extra to help navigation in the 642-pages book of proceedings, Maarten Grachten from JKU in Linz adapted the ISMIR Cloud browser (a web-interface to facilitate content-based access to the ISMIR proceedings, relying on Latent Semantic Analysis), specifically to the content of the ISMIR 2012 proceedings. Give it a try!"
