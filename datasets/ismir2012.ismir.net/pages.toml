["https://ismir2012.ismir.net/participants/travel-info.html"]
title = "Travel info — ISMIR 2012"
full_description = "You are here: Home › Participants › Travel info Travel info Airport Porto is served by Francisco Sá Carneiro Airport (OPO) - [Link] [Google Maps Location] Francisco Sá Carneiro Airport is a modern infrastructure, recently renewed, located just 15 min. away (by car) from the city center and the conference venue. Several companies fly to Porto, including low cost, include direct destinations to e.g. Newark, Montreal, São Paulo, Frankfurt, Paris, London, Amsterdam, Madrid, etc.: Aigle Azur Air Berlin Air Transat Brussels Airlines Easyjet Iberia Lufthansa Luxair Ryanair Sata International TAP Portugal TAAG Transavia Royal Air Maroc Train station (traveling from e.g. Lisbon, Madrid, etc.) Estação de Campanhã (Porto) - [Link] [Google Maps Location] View ISMIR 2012 Venue and Walking Distance Hotels in a larger map From the airport to the conference venue The best way to get from the airport to the conference site is using the Metro (follow the ). Average waiting time at the airport is 15 minutes. Ticket type is a Z3, costing 1.20 €. The trip takes about 20 minutes. You travel on the E line (violet), in the direction of Estadio do Dragão, and leaving at station Trindade, at a 5-minutes walk from the conference venue. (An optional 2 stations travel on the D line, until São Bento station will get you even a bit closer.) To go to your hotel, you can check the Metro and bus networks to find the best route. Note that a number of recommended hotels are at walking distance to the conference site (check the map). Moving around Porto has a Metro () and a network of buses (). Trains (CP) from the two main train stations (Campanhã or São Bento) will help you to plan any trip to the outskirts."
