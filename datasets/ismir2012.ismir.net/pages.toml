title = "ISMIR 2012 programme online — ISMIR 2012"
full_description = "You are here: Home › About › News › ISMIR 2012 programme online ISMIR 2012 programme online The ISMIR 2012 programme is now online. The program features four exciting tutorials, three inspiring keynotes by José C. Principe, Maarten de Rijke, and Emmanuel Bigand, a special panel session on evaluation initiatives, a MIRrors special session (see below), regular paper sessions (oral and posters), concerts and a thrilling social program.The pdfs of accepted papers for the MIRrors session are already accessible. Take your time to read them beforehand, ruminate, react, and bring questions and debatable issues to the session, as the session is targeted to foster debate and collective enlightenment. In MIRrors, the past of MIR reflects on its future. Registration to the conference can be done until September 23rd (upon availability) or onsite starting October 8th.Please notice that participants interested in purchasing printed proceedings should specifically ask for them in the registration process before August 17th."
