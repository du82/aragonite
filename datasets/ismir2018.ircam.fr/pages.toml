["https://ismir2018.ircam.fr/pages/events-tutorial-09.html"]
title = "Tutorials ·"
full_description = "Abstract: The main goal of this tutorial is to present an overview for computational analysis applied on non-Western music traditions and within this context, also discuss the role of musicology perspective in Music Information Retrieval. The target audience is researchers and students interested in MIR and computational musicology. The tutorial comprises of three parts.The first two parts are dedicated to critical overview of recent studies with engineering and musicology perspective. We will start by presenting some of the relevant problems and challenges for analysis of non-Western music traditions that have been studied from an MIR perspective. In the second part we discuss some current and potential challenges posed by musicological research in diverse musical genres, including in rhythmic analysis.The last part will present resources created during the CompMusic project, that are openly available to the community. It will include demonstrations for accessing non-Western music data and processing these data (focusing on intonation and rhythm analysis) with publicly available tools. We will consider research corpora from various music traditions: Hindustani (North India), Carnatic (South India), Turkish-makam (Turkey), Arab-Andalusian (Maghreb), and Beijing Opera (China). While we will focus on a few culture-specific MIR tasks for our demonstrations, we will also discuss open research problems that can be studied using these datasets. This session would serve as a quick start for students and researchers without prior experience in analysis of non-Western music and will provide them a good entry point for further investigation."
