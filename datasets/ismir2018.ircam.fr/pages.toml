full_description = "In case you have to get a visa, this website could be helpful. Contact the organization commitee if you need an invitation letter. This information is provided as a guide to participants. The ISMIR 2018 organization commitee will not be liable for any visa-related issues you may incur. The main program (oral and poster sessions) will take place at the Cité Internationale Universitaire de Paris (CIUP). In the following, we provide a guide for participants to go to CIUP from the airports Orly and Charles de Gaulle. 1 - At Orly airport buy a ticket at the Orlyval ticket office (check signs at airport). Ask for a ticket to Paris, this will cover the two connexions (Orlyval and RER B). Keep the ticket with you throughout the journey. You'll need to validate it to exit the trains. 2 - Take the Orlyval (entrance K in South Terminal, entrance A at Arrival level in West terminal) and descend in Antony. 1 - At Orly airport buy a ticket for the Orlybus with direction to Paris. You can buy it at the ticket office or ticket machine at Orly Sud departure point; on board the Orlybus; and at the Orlyval agencies at Orly Ouest and Orly Sud. 2 - Take the Orlybus at gate H platform 4 (in Terminal South) or gate J level 0 - arrivals (in Terminal West). 3 - Descend at Denfert Rochereau (terminal). Buy a ticket+ (€2) and take the train RER B direction Saint-Rémy Les-Chevreuse, Robinson or Massy Palessau. Taxis are only located at exit L and B. The vehicles located there are the only ones allowed to provide service at Orly airport. From the airport to reach Paris should cost €30-35. Official taxis always have a clear sign on top of the car and a taximeter inside. 1 - At Airport Charles de Gaulle, got to the train terminals (RER B terminals). Those are located at: terminal 1 and 3 in Airport Charles de Gaulle 1; terminals 2A, 2C, 2D, 2E, 2F, 2G in Airport Charles de Gaulle 2. Official taxis always have a clear sign on top of the car and a taximeter inside. To leave the airport, you will find taxis at the exit to the baggage reclaim area of your arrival terminal:"
