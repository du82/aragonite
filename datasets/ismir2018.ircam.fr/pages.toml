["http://ismir2018.ircam.fr/pages/call-guidelines-reviewers.html"]
title = "Papers/ Guidelines for Reviewers ·"
full_description = "the number of assigned papers and the deadline allow you enough time to complete your reviews (see section on Commitment and Respect below) Please notify the Program Committee immediately if any issues arise regarding these points. Adhering to the deadline is essential, since the Program Committee and Chairs still have a huge amount of work to do after the review process has been completed. It is advisable to read papers well in advance before the deadline in order to have time to think about them over a sufficiently long timespan before writing your reviews. This is essential in order for you to make thoughtful decisions about your assigned papers, and to provide helpful suggestions for the authors. You will be asked to provide an evaluation of the papers assigned to you according to the following criteria: Keep in mind that minor flaws can be corrected, and should not be a reason to reject a paper. However, accepted papers must be technically sound and make an original and substantial contribution to the field. Also, please familiarize yourself with the information in the Call for paper regarding the topics of the conference. When deciding your recommendation for a paper, do not be shy. Use the whole spectrum of evaluation scores: if you think a paper is outstanding, give it the highest score and no less than that. Similarly, if you think a paper is really bad (and can convincingly support your opinion), then give it the lowest score and no more than that. Very often reviewers tend to use intermediate scores, because they are not entirely confident on their judgment, and/or because they did not have time to read their papers thoroughly. This attitude causes really good papers not to stand out, and very bad papers not to be “caught”. Ensure that your scores are consistent with your comments to the authors. In particular, receiving good comments and a poor score is frustrating, and often causes the authors to request clarifications or rebuttals. Your comments for the authors are probably the most important part of your reviews. They will be returned to the authors, so you should include any specific feedback which can help improve the papers. Thorough comments also help the Program Committee decide which papers to accept, sometimes more than your score. Remember that your reviews are evaluated by the Program Committee. Moreover, after the completion of the review process, they will be available to other reviewers of the same papers. Therefore your good work will help generating a positive trend in the research community. Short reviews are not helpful to both the authors and the Program Committee. Please be as specific and detailed as you can. When discussing related work and references, simply saying “this is well known” or “this has been common practice for years” is not appropriate. You should cite publications, or other public disclosures of techniques, which can support your statements. Be specific also when you suggest improvements in the writing. If there is a particular passage in the text that is unclear, point it out and give suggestions for improvements. On the other hand, if the whole paper is poorly written, you are not expected to rewrite it for the authors."
