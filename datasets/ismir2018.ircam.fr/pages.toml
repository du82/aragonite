title = "Papers/ Information for Presenters ·"
full_description = "As opposed to previous ISMIR editions, all accepted papers will have BOTH AN ORAL AND A POSTER presentation. The reason for this is to favour the visibility (oral presentations) of all accepted papers while keeping a large space for discussions between authors and audience (poster presentations). In order to achieve this, the duration of oral presentations will be reduced to 4 minutes and oral sessions will not have a slot for questions, which will be left for the interactions that will take place during the poster sessions. Your paper will be assigned to one of the sessions A, B, C, D, E or F, which means that your oral and poster presentations will occur in the same session. In order to avoid any delays related to (the classic) difficulties with connections to the projector, we need you to send us your slides in advance so we can have them ready for you to be projected using one of the conference computers. Let’s assume I’m John Doe and my paper (whose ID is 777) has been assigned to session E and has received the session ID E3 (third presentation in session E)."
