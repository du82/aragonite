["http://ismir2018.ircam.fr/pages/events-meetup-industry.html"]
title = "Meetup with Industry ·"
full_description = "Join the largest Music Tech R&D Industry Meetup on September 27th in the world’s largest startup incubator, Station F in Paris! The event --organized by Antescofo, Pandora and Deezer as part of the Conference of International Society for Music Information Retrieval (ISMIR)-- aims at highlighting trends in the Music Industry by world-recognized actors and provide a networking environment to foster collaborations. We are expecting 300+ participants including startups and global leaders of the Music Industry, with key speeches by world-renowned decision-makers as well as major industry participation. The annual ISMIR (International Society for Music Information Retrieval) Conference is the world’s leading R&D forum for music tech since 2000. For the first time, the 2018 edition in Paris will include a Meetup with Industry, organized by Antescofo with support from Deezer and Pandora. Whether you are music tech company, a researcher, or working in the music industry, and interested in innovation and R&D, this event is for you. This will be a unique networking platform, and a perfect opportunity to: It is possible for music tech. companies to have a dedicated space in the networking area for the 4 hours of the meetup, and display their own banner/kakemono/poster. Interested companies should email ismir2018-meetup-industry@ismir.net with: Note that there will be a limit on the number of possible spots because of space reasons. So the earlier you answer the call, the better your chances are. Selected companies will be asked to pay a participation fee of 150 EUR (which covers up to 2 people from a given company). (Companies registrations will follow the selection of respondents to this call.) Companies who wish to participate even further in the ISMIR conference, and during a whole week interact with the international community of MIR researchers and practitioners, dive deep into state-of-the-art MIR R&D, and take advantage of diverse partnership opportunities should consult the call-for-sponsorship."
