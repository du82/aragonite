full_description = "In addition to the academic focus of ISMIR, we are offering a number of unique social events. The social program provides participants with an opportunity to relax after meetings, to experience Paris, and to network with other ISMIR participants. The social program includes: The welcome reception will happen at the Balajo on Sunday September 23rd. The Balajo is a historical dancing-hall in the Bastille neighbourhood opened in 1936. It has welcomed many famous artists such as Mistinguett, Marlene Dietrich and Django Reinhardt. We will be welcome at the Balajo by Riton la manivelle one of the most representative artist of the 19th century Parisian chanson. Inside the Balajo, we will have a private concert of Le Broux Gipsy 4 têtes, a Gipsy Jazz music band. We will also have hors d’oeuvres and drinks. The banquet will happen Wednesday September 26th as a Seine river cruise buffet(with views over all the most famous Paris buildings). The cruise dock will be at the root of the Eiffel tower. The cruise will be concluded with the first ever ISMIR Jam Session on a boat."
