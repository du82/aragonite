["http://ismir2018.ircam.fr/pages/call-submission.html"]
title = "Papers/ Submission ·"
full_description = "Papers can be submitted via: https://www.softconf.com/h/ismir2018/. Please be sure to read the submission requirements. Submissions that deviate from any of the requirements will be automatically rejected. There will be NO EXTENSION to the paper submission deadline. However, authors of registered papers on or before March 23rd will be allowed to upload new versions of their papers (in PDF format) until March 30th (23h59 American Samoa timezone). No other changes will be possible (i.e. authors will not be able to change title, abstract, authors, keywords/topics, or other metadata). No registration of new papers will be possible after March 23rd, and no submission of new versions of registered papers will be possible after March 30th. In order to ensure the quality of the published papers at the conference, all of the submitted papers are evaluated according to the following criteria: The reviewing workflow follows a two-tier model, i.e. with one level of “regular” reviewers, and another level of “meta-reviewers”. All the papers are examined by, at least, three reviewers. Accepted papers must be presented at the conference by one of the authors and, at least, one of the authors must register before the deadline given for author registration (July 6th). Failure to register before the deadline will result in automatic withdrawal of your paper from the conference proceedings and program."
