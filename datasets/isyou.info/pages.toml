title = ""
full_description = "Security subjects are becoming hugely important in the light of the development and deployment of new Homeland Defense solutions. Such solutions require the design of new computer systems and techniques allowing security procedures to be executed on many different planes, from system, communication and organization security to the security of the state and ensuring its defense capabilities. Advanced IT technologies based on intelligent algorithms that can analyze group behavior and interpret complex patterns or situations are increasingly frequently becoming the building blocks of the above solutions. In this context, it is worth noting research that combines security and defense aspects with achievements in designing advanced systems for the acquisition and sophisticated semantic analysis of complex image patterns and group behaviors. Such systems use cognitive models of semantic interpretation and can be applied to develop e.g. algorithms and protocols used for the security of computer systems themselves, but also to ensure the confidentiality and security of communication networks. They can also be employed to develop globally understood safe solutions connected with activities to strengthen national defense capability. Critical infrastructure normally consists of a system of interdependent systems operated by separate authorities, e.g. transport infrastructures normally depend on power (electricity- and fuel companies), communication (telecommunication companies) etc. This session will focus on collaboration models and mechanisms to support collaboration among critical infrastructure providers to ensure adequate levels of protection of the overall infrastructure. For submission, please follow the Author Instruction of SeCIHD�12 given below while making sure of checking the group �Collaborative Infrastructure Protection�. *** Program Committee Francesca Bosco (United Nations Interregional Crime and Justice Research Institute, Italy) Tomasz Hac