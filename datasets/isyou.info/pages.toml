title = ""
full_description = "[CFP][TOPICS][IMPORTANT DATES][ORGANIZATION][INVITED TALK] [PREVIOUS MISTS] [SPECIAL SESSIONS][AUTHOR INSTRUCTION] [REGISTRATION][POST PUBLICATION][PROGRAM][CONTACT] (2) Registration is now available! Please refer to the REGISTRATION page. (3) Submission Deadline is extended to September 25, 2014. During the past two decades, information security technology developments have been mainly concerned with intrusion detection to prevent unauthorized attacks from outside the network. This includes hacking, virus propagation, spyware and more. However, according to a recent Gartner Research Report, information leaks have drastically increased from insiders who are legally authorized to access corporate information. The unauthorized leak of critical or proprietary information can cause significant damage to corporate image and reputation, perhaps even weakening its competitiveness in the marketplace. On a larger scale, government and public sectors may suffer competitive loss to other nations due to an internal intelligence breach. While the leaking of critical information by insiders has a lower public profile than that of viruses and hacker attacks, the financial impact and loss can be just as devastating. in security and cryptography technologies and management systems for preventing information breaches by insiders. The workshop promotes state-of-the-art research, surveys and case analyses of practical significance. Physical, managerial, and technical countermeasures will be covered in the context of an integrated security management system that protects critical cyber-infrastructure against unauthorized internal attack. We expect that this workshop will be a trigger for further research and technology improvements related to this important subject. The submission of contributions to MIST 2014 must occur through the workshop submission system: https://www.easychair.org/conferences/?conf=mist14 Submission of a paper implies that should the paper be accepted, at least one of the authors will register and present the paper at the workshop."
