["https://italki.com/en/article/pXqHdHLGCgj3fTy6n4D96Q/start-today-not-tomorrow-a-new-year-s-resolution-lesson-from-a-chinese-poem"]
title = "italki - Start Today, Not Tomorrow: A New Year’s Resolution Lesson from a Chinese Poem"
description = "As we step into the new year, many of us are thinking about our resolutions—whether it’s learning a new language, visiting new countries, or improving ourselves in other ways. However, it’s easy to say, “I’ll start tomorrow.”"
full_description = "As we step into the new year, many of us are thinking about our resolutions—whether it’s learning a new language, visiting new countries, or improving ourselves in other ways. However, it’s easy to say, “I’ll start tomorrow.” When I was a child, I loved leaving important things until the last minute. My mom would quote the famous 15th-century Chinese poem 明日歌 (míng rì gē, The Song of Tomorrow) and say, 明日复明日，明日何其多 (míng rì fù míng rì, míng rì hé qí duō), which means, “Tomorrow and tomorrow again, how bountiful the tomorrows are.” Hearing it, I always felt a bit uneasy. Now, as I reflect on it, I understand how powerful and relevant the message of the poem is. Today, I want to share this short poem with you and offer a glimpse into Chinese poetry. Whether you're a beginner or an advanced learner, I encourage you to read through it aloud and try to interpret the meanings for yourself. Also, do you notice any rhyme patterns? This poem is a simple yet profound reflection on procrastination. The repetition of 明日 (míng rì), or “tomorrow,” captures the feeling of endless postponement. The second line, 明日何其多 (míng rì hé qí duō), has a slight irony—we often think tomorrow will always be there, when in fact it is fleeting and often wasted. The second half of the poem starkly reminds us of the consequences of procrastination: time lost, opportunities missed, and goals never reached. Chinese poetry, like this one, often relies on concise, vivid imagery and the use of parallelism—two lines that mirror each other in structure or meaning. It’s also common for Chinese poems to evoke deeper meanings through simple words. 1.Read aloud: The tones and rhythms are an essential part of the poem. Reading aloud helps you experience the melody of the language. For example, did you notice that the last word in the second line, 多(duō), and the fourth line, 跎(tuó), rhyme? This poem is an exception, but in many four-line Chinese poems, the last word in the first, second, and last lines often rhyme."
year_published = 2025
