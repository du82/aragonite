e mon pays depuis près de 3 ans déjà. Si vous souhaitez avoir une maîtrise du Français ou bien de l'anglais et en être éloquent, je suis l'enseignant qu'il vous faut.USD 6.70/trialAvailable 16:30 TodayBook trial5.015.8k LessonsJessieProfessional TeacherBusinessTest PreparationSPEAKS :EnglishNativeAfrikaans+2Hi :) I am a certified and experienced teacher with over 15 000 lessons on italki. I like to customize my sessions based on what my students need, and I use online materials instead of relying on a set textbook. During our conversations, I'll gently provide corrections, both spoken and written, without disrupting the natural flow of our discussion. This way, learning feels more comfortable and fluid. One of my biggest assets as a teacher, is my curiosity and ability to come up with questions to keep you speaking.USD 9.00/trialBook trial4.9996 LessonsRenethCommunity TutorSPEAKS :EnglishNative+1CERTIFIED TO TEACH ENGLISH AS A SECOND LANGUAGE (ESL/TEFL) I will focus on the conversational English method of teaching. Myself and the student will have a conversation about a topic or an issue. This will allow me the opportunity to asses the student's level of English fluency and literacy, this will assist me to know what areas of the English language I need to focus on teaching. Its in having a conversation that we will learn through practicing grammar, pronunciation, vocabulary and spelling. I believe practice makes perfect. I will align my teaching method to my student's learning goals. The outcome of our lessons is for the student to be able to communicate confidently, fluently and being able to understand the English language.USD 6.50/trialAvailable 06:30 TodayBook trial4.9562 LessonsMohau VumaCommunity TutorSPEAKS :EnglishNativeSothoNativeAfrikaansZulu+2Certified TEFL certificate with 3 years experience in teaching I make sure that my students are comfortable to answer questions and not be afraid to ask any. Lessons will take place in a free and comfortable environment and in an interactive and fun way. I am patient and ensure that my students understand the work.USD 11.00/trialAvailable 10:30 TodayBook trial5.04,453 LessonsTeacher TamProfessional TeacherSPEAKS :EnglishNativeAfrikaans+1Certified TEFL English Teacher with Specialization in Educational Psychology and Creative Writing I have been teaching English for over 10 years. I have taught all ages and I have a passion for helping people learn and grow. I believe that being able to speak the English language fluently, is a vital part of advancing in today’s world. I love teaching grammar rules, but I also enjoy teaching conversational English. I enjoy this more, because then I get to know my students! I have recently completed my secondary Honor's Degree in Psychology and acquired an accredited TEFL certificate. I am also certified in English Creative Writing. In my spare time I volunteer as a lay counsellor for those in need.USD 7.00/trialBook trial5.02,043 LessonsGarethProfessional TeacherBusinessTest PreparationSPEAKS :EnglishNativeSpanish+3General English, Business English, IELTS, IGCSE, PTE Academic, KET, PET, FCE, CAE and CPE. I have a CELTA certificate and a BA degree. I also have about six years of teaching experience. I teach levels from complete beginner to advanced and beyond, and I welcome students of any age, children and adults.USD 10.00/trialAvailable 19:00 TodayBook trial5.05,341 LessonsFelix BrassierProfessional TeacherSPEAKS :EnglishFrenchNativeArabicItalianSpanish+2Certified French / English / Italian teacher with more than 7 years of experience I started teaching on the field as a humanitarian worker. From an emergency and chaotic situation, where everything had to be done quickly etc ... I grew up, I experienced many different teaching experiences and I improved my skills (passing formation and certificates such as TOEFL and FLE etc ...) to be an official and professional teacher.USD 15.00/trialAvailable 07:00 TodayBook trial4.91,139 LessonsMridulProfessional TeacherSPEAKS :EnglishNativeHindiNativePunjabiNativeUrduNativeSanskritKoreanPortugueseSpanish+1 I personalize a lesson as much as possible. My style is based on patience and instructional scaffolding, just as I would do in my classes in a primary or high school, so learners of all abilities always have a chance to improve as we gradually and methodically develop your vocabulary, comprehension, pronunciation, and grammar skills, as well as your abilities in reading, writing, and listening. At the same time, I am also highly adaptable and flexible as a teacher.USD 5.00/trialAvailable 16:30 TodayBook trial5.04 LessonsFortunatoProfessional TeacherSPEAKS :EnglishNativeItalianSpanish+1$5 Trial lesson... you can request a time! TESOL certified/master's degree, native English speaker A big reason I am passionate about teaching English is because my family is from Italy and Argentina; and I live in Queens, NYC 'One of The Most Diverse Places in the World', so I am always around people who are learning English and speaking with different accents. I have helped students from over 20 countries improve their English and I feel confident that I can help you too! Areas of Focus: -Pronunciation, Grammar, Sentence structure -Business, Hospitality & Travel industry - customer service/relations -Essay and resume (CV) review -Job specific vocabulary and interview practice -Culturally relevant feedbackUSD 5.00/trialAvailable 16:30 TodayBook trial4.922 LessonsOneleCommunity TutorSPEAKS :EnglishNative+1Certified ESL tutor with over 8 years of experience in tutoring both Adults and Children. I am a highly motivated, enthusiastic and dedicated educator who wants all children to be successful learners, committed to creating a classroom atmosphere that is stimulating and encouraging to students. Enthusiastic, committed educator with innate ability to understand and motivate learners. I'm experienced in one-on-one tutoring and group learning as well. I have worked with both children and