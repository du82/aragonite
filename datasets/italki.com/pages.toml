e the Service. If you are entering into the italki Terms as the parent or legal guardian of a child who will use the italki Platform, the italki Terms shall be a binding agreement between italki and you, and you represent that you will maintain control over the settings and functionality of your italki Account. If you are entering into the italki Terms as an individual and not on behalf of a company or other legal entity, the italki Terms shall be a binding agreement between italki and you personally. You acknowledge that the italki Terms are a contract between you and italki, even though it is electronic and is not physically signed by you and italki, and that it governs your use of the Service.You represent that you have read and understood our privacy policy ("Privacy Policy"), which is available at https://www.italki.com/privacy. Note that we may disclose information about you to third parties if we have a good faith belief that such a disclosure is reasonably necessary to (i) take action regarding suspected illegal activities; (ii) enforce or apply the italki Terms or other italki Policies (as defined below); (iii) comply with legal process or other government inquiry, such as a search warrant, subpoena, statute, judicial proceeding or other legal process served on us; or (iv) protect our rights, reputation, and property or that of our Members, affiliates or the public. Our (a) Teacher policy, which is available at https://www.italki.com/instructorterms (the "Teacher Policy"); (b) payment policy, which is available at https://www.italki.com/paymentterms (the "Payment Policy"); and (c) copyright policy, which is available at https://www.italki.com/copyrightpolicy (the "Copyright Policy"), together with Privacy Policy, Teacher Policy, Payment Policy, and Copyright Policy, the "italki Polices"), to the extent applicable to your use of the italki Platform are incorporated by reference into these italki Terms.Do not access or use the italki Platform if you are unwil