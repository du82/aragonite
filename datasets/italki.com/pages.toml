ibed in the Teacher Policy, including but not limited to paid lessons, packages and other services rendered where italki Credits (as defined in Payment Policy) are exchanged. "Plus Members" means Members who purchase Paid Services or Paid Subscription Services. 2. RelationshipThe italki Platform is an online venue for language learning where registered Members ("Members") may use our Connection Services and Payment Services to directly interact with one another. You understand and agree that italki is not a party to any agreements entered into between Students and Teachers or between Members, nor is italki a language services broker or agent. italki has no control over the conduct of Students, Teachers, Members or other Members of the italki Platform or over any services provided by Teachers or other Members over the italki Platform and disclaims all liability in this regard to the maximum extent permitted by law.If you choose to teach on the italki Platform, you understand and agree that your relationship with italki is limited to being a Member and an independent, third-party contractor, and not an employee, agent, joint venturer or partner of italki for any reason, and you act exclusively on your own behalf and for your own benefit, and not on behalf of or for the benefit of italki. italki does not control, and has no right to control, your listing, your activities associated with your profile or listed services, or any other matters related to any services that you provide. As a Member you agree not to do anything to create a false impression that you are endorsed by, partnering with, or acting on behalf of or for the benefit of italki, including by using any italki intellectual property in an unauthorized or in appropriate manner.3. Modification3.1 Changes to Paid Services and Paid Subscription ServicesWe’re constantly developing new features and ways to improve our services, and we may manage, regulate, control, modify, or eliminate features and services provided (including the Paid Services and Paid Subscription Services, as defined below) at any time, with or without notice. italki shall have no liability to you or any third party in the event that italki exercises any such rights.3.2 Changes to Subscription PricingPrices for Paid Services and Paid Subscription Services may change from time to time to reflect inflation, pricing changes made by our licensors, promotional offerings, changes to the Paid Services or Paid Subscription Services, or changing business needs. We will provide you with at least 30 days advance notice of any material changes to the Paid Subscription Services with recurring payments, including price changes. If you do not want to continue the Paid Subscription Service based on such changing terms, you can cancel Paid Subscription Services before the start of the subscription period in which the new terms apply by following the steps outlined in Section 5.2 (Canceling Paid Subscription Services) of the Payment Policy. 3.3 Changes to this Agreementitalki reserves the right, at its sole discretion, to modify the italki Platform and to modify these italki Terms, at any time and without prior notice. If we modify these italki Terms, we will either post the modification on the Sites and the Applications or otherwise provide you with notice of the modification. We will also update the "Last Updated" date at the top of these italki Terms. By continuing to access or use the italki Platform after we have posted a modification on the Sites and the Applications or have provided you with notice of a modification, you are indicating that you agree to be bound by the modified italki Terms. If the modified italki Terms are not acceptable to you, your only recourse is to cease using the italki Platform.4. EligibilityThe italki Platform is available only to, and may only be used by, individuals who are 18 years and older who can form legally binding contracts under applicable law.WHILE WE USE GOOD FAITH EFFORTS TO C