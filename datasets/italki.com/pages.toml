title = "Privacy Policy - italki"
description = "Please read the privacy policy carefully and know how italki collects and deals with your data so that you don't need to worry about the security of your data."
full_description = ".PrivacyPolicy_table { width: 100%; border-collapse: collapse; border: 1px solid #000; } .PrivacyPolicy_table tr th, .PrivacyPolicy_table tr td { padding: 8px; border: 1px solid #000; vertical-align: top; } Privacy Policy (Effective as of: October 14, 2024)This privacy policy (“Privacy Policy”) explains how information about you is collected, used and disclosed by italki HK Limited and their affiliates including Lingbe, S.L. (“italki,” the “Company”, “we”, “our” or “us”). This Privacy Policy applies to information we collect when you use our websites https://www.italki.com/ and https://www.italki.cn/ (the “Sites”), mobile applications, including our WeChat mini program, and other online products and services (collectively, our “Services”).When we offer the Services in the United States (“US”), we may be subject to the data privacy laws, if any, of the state in which you are located. If you are located in the United States, please refer to your state’s data privacy laws to understand your rights.When we offer the Services in the European Economic Area (“EEA”), we are subject to the European Union’s (“EU”) General Data Protection Regulation (“GDPR”), which applies across the entire European Union. Our data representative in the EEA is Joseph Izundu, who you can reach at [email protected]. In addition, our data protection officer may be reached at [email protected]When we offer the Services in the United Kingdom (“UK”), we are subject to the UK General Data Protection Regulation Act and the Data Protection Act 2018.By downloading, accessing, using and/or interacting with our Services, you agree and expressly consent to our collection, use and disclosure of the information that you provide as described in this Privacy Policy. This Privacy Policy is incorporated by reference into the Terms of Service available at www.italki.com/tos (our “Terms of Service”) and is subject to the provisions of the Terms of Service. Capitalized terms used but not defined in this Privacy Policy shall have the meaning ascribed to such terms in our Terms of Service. If you have any concerns about providing information to us or the use of that information as described in this Privacy Policy, you should not use our Services. Modifications Because we are always looking for new and innovative ways to help you achieve your goals in connection with the use of our Services, this Privacy Policy may change over time, so please review it frequently. The effective date at the top indicates the last time this Privacy Policy was modified. If we modify any material terms of this Privacy Policy, we will notify you by email, push notification, and/or by posting a notice on our website thirty (30) days prior to the effective date of the changes and seek your consent for any such changes. If we are required by applicable data protection laws to give you enhanced notice, we will do so. You can see when this policy was last updated by checking the “last updated” date displayed at the top of this policy. Any revised Privacy Policy will supersede all previous privacy policies.Contact UsIf you have any questions about this Privacy Policy, please contact us as follows:For users accessing the Services or the Site, please email us at [email protected] or request online support at https://support.italki.com. For users accessing applications and websites operated by Lingbe, S.L., please email [email protected].1. Personal Information We CollectWe may collect and use the following personal information that identifies, relates to, describes, is reasonably capable of being associated with, or could reasonably be linked, directly or indirectly, with a particular consumer or household or natural person:Categories of Personal InformationSpecific Types CollectedIdentifiersReal name, alias, country, postal address, unique personal identifier, online identifier, username, avatar, mobile phone number, internet protocol address, email address, account name, account password, account details, avatar, photograph, billing information, and any details you provide in response to surveys about the Services, when seeking customer support, and in forum posts and comments. Commercial informationRecords of products or services purchased through the Services and the date and time of transaction. Biometric informationMicrophone activity, including volume of the sound.Internet or other similar network activityBrowsing history, search history, information on a consumer’s interaction with italki’s posts on websites, applications, advertisements, and social media platforms. Professional or employment related informationCurrent or past job history, performance evaluations, and professional certifications. Sensitive Personal InformationWe offer certain features to enhance your experience that collect and process certain types of personal information that may be considered sensitive personal information (also sometimes referred to as “sensitive personal data” or “sensitive data” under applicable laws and regulations) or may be otherwise legally protected in your jurisdiction. Throughout this Privacy Policy, this type of personal information is referred to as Sensitive Personal Information, and includes:Contents of messages and video recordings of lessons, sales calls, and webinarsAccount log-in, financial account, debit card, or credit card number in combination with any required security or access code, password, or credentials allowing access to an accountFinancial informationWe will not use your Sensitive Personal Information without first obtaining your consent.Please see Section 10 (Your Controls) below for more details on your privacy rights relating to your Sensitive Personal Information, or sign into your account and visit “Settings” > “Privacy.”Inferences drawn from Personal InformationText prompts, voice recordings, audio recordings, lesson recordings, lessons transcripts to generate profiles reflecting your preferences, behavior, and learning goals. User-Generated Profiles and ContentUser profiles, avatar, lesson recordings, video or voice broadcasts, user-generated video, livestream, broadcast, or text information. Device informationHardware model, operating system and version, unique device identifiers, mobile network information, country of access, crash reports, request and referral URL’s and/or system activity details.Software informationWhich version of software and what updates a person has installed or uses, and the presence of required plug-ins.Use informationA user’s browser type, preferred language, access times, pages viewed, activity, interactions with other users, and the pages visited before navigating to our Services.CookiesThe small data files stored on your hard drive or in device memory that help us to improve our Services and your experience, see which areas and features of our Services are popular, and count visits. For more information about cookies, and how to disable them, please see Section 10 (Your Controls) below and our Cookie Notice. https://www.italki.com/en/cookienoticeWeb BeaconsAlso known as “tracking pixels,” electronic images that may be used in our Services or emails to help deliver cookies, count visits, understand usage and campaign effectiveness and determine whether an email has been opened and acted upon.2. How We Collect InformationWe collect information that you chose to provide to us, for example, when you create an account, manage your user profile, participate in any interactive features of our Services, request our e-newsletter or other marketing communications, participate in a promotion or survey, request customer support or otherwise communicate with us. In some cases, information may be automatically collected from you when you interact with our website or Services. We only collect personal information that is necessary for providing our products and services in accordance with the principles of legitimacy, legality, necessity and good faith. We collect device information, software information, use information, and cookies from you automatically when you use the Services.In addition to personal information, we automatically collect, you may share your personal information with us in the following ways:Identifiers and User-Generated Profiles and Content. You may share personal information when you create an account with us and as you use and communicate through our Services.We may process information provided by you (including content and messages) that you post through the Services, including personally identifiable information. By sharing personal information, you acknowledge that any information you share through the Services will be available to us and to other users (including students and teachers) of the Services. You also acknowledge that some of the content you share cannot be deleted from the Service as it may be connected to lessons created by you and used by other users. We will retain this information as necessary to resolve disputes, provide customer support and troubleshoot problems as permitted by law. We reserve the right to terminate the accounts of visitors who use the Services in a manner inconsistent with the Terms of Service.We may also process your lesson recordings when you use the Services to participate in individual lessons or group class lessons. This is used to generate personalized learning content, practice exercises, and recommendations. You may choose to turn this feature off.When sharing your personal information with other users, always remember that users with whom you communicate or share such information may store or reshare your information with other third parties on and off our Services.Customer Support and Other Communications. When you contact us for customer support or otherwise communicate with us, you may provide us with information related to your use of our Services, including copies of your messages, any contact or identifying information, or any other information you deem helpful. This includes surveys and online forms you fill out on the Services, questions or comments left in the Q&A section of the Site, and any feedback you provide us with. Payment Information. We process the details of transactions you carry out through the Services, such as user identifiers and the dates and times of transactions.Service Use. When you use our Services and Products, we monitor and analyze web traffic and keep track of your behavior. Please refer to our Cookie Policy for further details as to our use of cookies and similar technologies.Language Assessment. We may process your personal data to assess your level of language proficiency and learning progress for your reference. Such an assessment may take place before or after you register with us to use the Services.Sales Calls, Events, and Webinars.With your consent, we may record you in videos for internal training purposes when you participate in sales calls or attend our webinars and other events.Professional or Employment Related Information (Teachers Only) . We may request educational certificates, curriculum vitae (CV), or background information related to teachers’ teaching experience and history.Financial Information.To comply with the applicable tax and accounting legislation, we may be required to submit various tax documentation containing your personal data. For example, a federal tax form 1099 or such other required tax form(s) necessary to receive a sweepstakes prize or withhold taxes. For submitting tax documentation, we may process your personal data, including, but not limited to, your full name, country of citizenship, permanent residence address, mailing address, date of birth, U.S. taxpayer identification number, or foreign tax identifying number.The Directive (EU) 2021/514 (DAC7) requires us as a digital platform operator to collect, verify, and report data and information on teachers who are EEA residents and provide teaching services for students using the Services. To comply with our reporting obligations under DAC7, we may process your first name, last name, primary address, date of birth, tax identification number (TIN), VAT number, and financial account identifier (e.g., bank account).AI-Powered Features. When enabled by you, the Services employ advanced generative artificial intelligence (“AI”) technology to enhance your experience on the Services and for AI data training purposes. If you give consent, we may use your text prompts, voice recordings, audio recordings, lesson recordings, lessons transcripts to provide personalized learning recommendations, generate summaries and learning content, offer grammar explanations, vocabulary cards or messages, suggest exercises and homework, assess language proficiency levels, and enable chatbot functionality for vocabulary practice and grammar inquiries.During your lessons, we may analyze your microphone activity and measure the volume of the sound. We do this to provide you with an overview of your speaking activity and to let you know how active you were during the lesson; voice data is not used to personally identify you. You may choose to turn this feature off.You can control your messages, video, and voice content sharing directly in our Services via your settings.In addition to the information that we collect directly from you, we also collect certain information from our third-party sources listed below (our “Third Party Sources”):App Stores or Distribution Channels. Our Services that are distributed through app stores or distribution channels, such as the Apple App Store, Google Play, and China-based Android app stores, may also request permission to automatically collect other information from your mobile or other device. Our Services may only collect such information with your authorization in accordance with your device operating system’s permission process.Apple App Store。 . Our Services that are distributed through the Apple App Store may also request permission to automatically collect other information from your mobile or other device. The Apple App Store may collect information regarding customer activity on the Apple App Store and aggregate that information to understand which part of Apple’s services are of most interest to you. More information on Apple’s privacy policy can be found here. Our Services may only collect such information with your authorization in accordance with your device operating system’s permission process.Google Play. Our Services that are distributed through Google Play may also request permission to automatically collect other information from your mobile or other device. Google Play may collect device-specific information to help the user decide on which devices the user would like purchases to be available for use. In mobile applications, Google Play may use identifiers specific to your device to serve you more relevant advertisements. More information on Google’s privacy policy can be found here. Our Services may only collect such inform"
