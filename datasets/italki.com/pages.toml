full_description = '''Terms of Service(Effective as of: October 14, 2024)Please read these italki Terms of Service (the "italki Terms" or "italki Terms of Service") carefully as they govern (i) your access to and use of our Sites, (ii) your access to and use of our Applications, or (iii) your access to and use of our services that link to or reference the italki Terms, and contain important information about your legal rights, remedies and obligations. The Site, Application and other italki services together are hereinafter collectively referred to as the "italki Platform." By accessing or using the italki Platform, you are agreeing to the italki Terms and concluding a legally binding contract with italki, whether or not you become a registered Member of the italki Platform. Certain areas of the italki Platform may have different terms and conditions, standards, guidelines, or policies posted or may require you to agree with and accept additional terms and conditions. If there is a conflict between the italki Terms and the terms and conditions posted for a specific area of the italki Platform, the terms and conditions that are specific to that area will take precedence with respect to your use of, or access to, that area of the italki Platform.You may be referred to in the italki Terms as "you" or "your" may be referred to specifically in your applicable role as a Company or a Member (each as defined below). If you are entering into the italki Terms on behalf of a company or other legal entity (such company or legal entity, the "Company"), the italki Terms shall be a binding agreement between italki and the Company that you represent, and you represent that you have the authority to bind such Company, its Members, and its affiliates to the italki Terms. In that case, the terms "you" or "your" shall also refer to such entity, its Members, and its affiliates, as applicable. If you do not have such authority, or if you do not agree with the italki Terms, you may not use the Service. If you are entering into the italki Terms as the parent or legal guardian of a child who will use the italki Platform, the italki Terms shall be a binding agreement between italki and you, and you represent that you will maintain control over the settings and functionality of your italki Account. If you are entering into the italki Terms as an individual and not on behalf of a company or other legal entity, the italki Terms shall be a binding agreement between italki and you personally. You acknowledge that the italki Terms are a contract between you and italki, even though it is electronic and is not physically signed by you and italki, and that it governs your use of the Service.You represent that you have read and understood our privacy policy ("Privacy Policy"), which is available at https://www.italki.com/privacy. Note that we may disclose information about you to third parties if we have a good faith belief that such a disclosure is reasonably necessary to (i) take action regarding suspected illegal activities; (ii) enforce or apply the italki Terms or other italki Policies (as defined below); (iii) comply with legal process or other government inquiry, such as a search warrant, subpoena, statute, judicial proceeding or other legal process served on us; or (iv) protect our rights, reputation, and property or that of our Members, affiliates or the public. Our (a) Teacher policy, which is available at https://www.italki.com/instructorterms (the "Teacher Policy"); (b) payment policy, which is available at https://www.italki.com/paymentterms (the "Payment Policy"); and (c) copyright policy, which is available at https://www.italki.com/copyrightpolicy (the "Copyright Policy"), together with Privacy Policy, Teacher Policy, Payment Policy, and Copyright Policy, the "italki Polices"), to the extent applicable to your use of the italki Platform are incorporated by reference into these italki Terms.Do not access or use the italki Platform if you are unwil