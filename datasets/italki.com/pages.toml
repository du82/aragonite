ativeEnglishThaiJapanese+3"Learn German with a Native Speaker - Fun and Effective Lessons for All Levels" I'm offering you a hand in learning German for your individual purposes. Whether you are a beginner looking to start your journey in German or an advanced learner looking to improve your skills, I am here to support you every step of the way. With my personalized approach and tailored lesson plans, I am confident that I can help you achieve your language learning goals. I look forward to working with you and helping you discover the joy of learning German!USD 6.00/trialBook trial5.01,563 LessonsandreasProfessional TeacherSPEAKS :GermanNativeEnglishSpanishCertified German Teacher | 11+ Years of Experience in Language Training & Exam Preparation 🔹 Full-time dedication: Teaching isn’t just my job—it’s my passion. I stay updated on the latest language pedagogy to ensure effective, modern lessons. 🔹 Adaptive & empathetic: I adjust my approach for children (games, stories), teens (pop culture, exam prep), and adults (business German, travel phrases). 🔹 Cultural immersion: Learn not just grammar, but idioms, traditions, and the “German way of thinking” through movies, music, and real-world scenarios. 🔹 Your success is my priority: I track progress with regular feedback and celebrate milestones with you!USD 10.00/trialAvailable 12:30 TodayBook trial5.04,178 LessonsDanielaProfessional TeacherSPEAKS :GermanNativeEnglishItalian+2***Creative writing for advanced students*** (info below) I would like my students to be able to speak to German speakers about anything from small talk to much more complex topics such as sport, literature, cinema, politics - anything you normally would talk about in your mother tongue. For those whose level is not good enough yet for a proper conversation, I'll teach you grammar and vocabulary to get you started. I have a postgraduate teaching qualification from the Goetheinstitut but more important I have been learning and teaching languages nearly all my life so I have experienced both sides. Living abroad and talk another language can be difficult but also fun once you get a better understanding how the language works.USD 11.00/trialBook trial5.0597 LessonsWolfgangProfessional TeacherBusinessSPEAKS :GermanNativeEnglishSpanish+2Business German with a certified German tutor I love teaching and at the same time I have experience in different industries like real estate, retail, aviation, tourism, education, online marketing, gastronomy and also medicine. And my students can notice my work experience in every lesson. What makes me “special” is that I am a certified German tutor but combined with a lot of work experience in different fields. I professionally started as a teacher 7 years after a formation at the “Goethe-Institut”. I like both teaching groups and individuals, but I prefer 1:1 teaching, above all if it's about business German. I can consider the particular needs and the work situation of my students.USD 13.00/trialBook trial5.01,974 LessonsMartynaProfessional TeacherSPEAKS :GermanPolishNativeEnglish+1Tell me what you really need, and let me guide you! I really appreciate the times we live in. I can see how much wonderful possibilities we have both as teachers and students. I love technology and use it! I’m passionate about brain-friendly teaching, so every little action in our lesson is well-thougt-out. I'm interested in future studies and trendwatching and every time we talk aboute sobe topic I try to make the topic futureproof. I know how to personalise the lessons so that you'll use taken materials immediatly.USD 15.00/trialAvailable 23:00 TodayBook trial5.02,719 LessonsMarcoProfessional TeacherSPEAKS :GermanNativeEnglishSpanish+1✺❁ Certified teacher ❁ Exam preparation ❁ Vocabulary ❁ Grammar ❁ Open conversation ❁ Easy going ❁✺ I became a teacher on italki to teach a rare and quite complicated language to all the people around the world who are interested in it and to those who have just fun to learn new things. I am a really relaxed person, pretty communicative and motivated so that I think a lesson with me is more fun than work and that's how I think it should be. For both sides. Teacher and student! A lot of fun with interesting conversations because I think you learn way faster if you do it with fun. I learned a foreign language and I know how hard it can be to step out of the comfort zone to start a conversation but you don't need to worry. I will lead you through the lesson in an comfortable way ;)USD 11.00/trialBook trial5.02,916 LessonsNico JacobProfessional TeacherTest PreparationSPEAKS :GermanNativeEnglishChinese (Mandarin)JapanesePolish+2 I have taught German and English in several different circumstances. During my early internships in China I organized basic German and business level English trainings. In the German Chamber of Commerce, I was also involved in editing a yearly bi-language training brochure for special trainings in Shanghai. But I also taught English and German for a year in kindergarten, where I focused on fun in acquiring a new language. In Germany I mainly taught German privately, mainly focusing on the Testdaf-exam but also the German high school-diploma Abitur. Occasionally, I also prepared students for the TOEFL-Exam.USD 17.00/trialAvailable 16:30 TodayBook trial5.01,066 Lessons⭐ Max ⭐Professional TeacherBusinessKidsTest PreparationSPEAKS :GermanNativeEnglishFrenchSpanish+4I'll make you reach new heights in German, express yourself and understand naturally. Feel at home. I also speak English, French, and Spanish fluently, at bilingual level. I've also studied Hebrew, Dutch, Indonesian, Russian, Mandarin Chinese, Japanese, Italian and classical Greek to different degrees. My formal academic background is in TSL, law and grammar. I've lived in Germany (Saarbrücken, Köln and Berlin), France (Paris), Indonesia (Ubud, Bali) and Argentina (Buenos Aires). I'm currently a language student in Russian and Indonesian. My passions are languages, martial arts, acting and film, democracy, nature and its protection, and literature. Practicing kindness is the main thing in life.USD 24.72/trialAvailable 20:00 TodayBook trial5.01,305 LessonsSégolène BulotProfessional TeacherTest PreparationSPEAKS :GermanFrenchNativeEnglishItalian+1Certified Jury and Examiner DELF/DALF with 4 years experience teaching French and German Je suis flexible et m'adapte à vos envies et vos besoins. Ich bin sehr flexibel und pass mich an eure Wünsche und Bedürfnisse an.USD 5.00/trialAvailable 18:00 TodayBook trial4.9619 LessonsSameer DamleProfessional TeacherSPEAKS :GermanHindiNativeMarathiNativeSpanishEnglishNativeUrdu+2Experienced C2 Certified Trainer. Preparation from A1 to C2 level for adults, students and kids. I can offer your two types of courses: Professional Courses from level A1 upto level C2 - In this module, I shall work with beginners and advanced learners. We will work using a textbook, focus on all 4 aspects of language learning i.e. speaking, listening, reading and writing and we shall focus on preparation for international exams like Goethe, DELE etc. Conversation Courses - In this module we shall work on your conversation skills, which shall encompass different topics of varying complexity. We shall focus on improving your conversational skills. Being a polyglot, I will be to teach German to you using Spanish/ English or alternatively teach Spanish to you using German/ English.USD 16.59/trialAvailable 02:30 TomorrowBook trial5.01,396 Lessonserika amerikaProfessional TeacherSPEAKS :GermanNativeEnglish+3Teacher: "German as a 2nd Language" & "English" over 30 years / helps with Level A1-C1 examination. I have taught German and English for over 30 years and still teach students of different levels. I am always willing to help with any problems that you have with either German or English and I can assure you, that together we will overcome those difficulties. I also can help you pass B1 or B2 level exams, if that is what you desire.USD 14.00/trialAvailable 16:30 TodayBook trial5.01,963 LessonsDeutsch mit DaviProfessional TeacherSPEAKS :GermanNativeEnglishSpanishItalianNativePortugueseFrench+4Professionelle Deutsch-Lehrkraft mit über 1500 Stunden Erfahrung im Online-Unterricht! I went to university in Frankfurt Germany, where I was trained to be a professional teacher in German, Spanish, Italian and Physical Education. In a team I also coach teachers and organize nationwide events involving several schools in Latin America. - In Frankfurt wurde ich zum Lehrer in den Fächern Deutsch, Spanisch, Italienisch und Sport ausgebildet. Ich habe bereits auf verschiedenen Kontinenten und in unterschiedlichen Sprachen unterrichtet. Zudem coache ich Lehrer und organisiere in einem Team landesweite Veranstaltungen in Chile. - En Frankfurt me formé como profesor en alemán, español, italiano y deportes. Usar herramientas digitales para perfeccionar mi enseñanza es mi pasión.USD 22.00/trialAvailable 18:30 TodayBook trial5.0288 LessonsReinhardProfessional TeacherSPEAKS :GermanNativeEnglishSpanishFrenchIndonesian+1I love teaching German 😊 Dear students I love teaching. And I want to make sure that you can learn the German language in a relaxed and focused atmosphere – in your time and at your speed. Our common goal: After a 60-min class, you know more about the respective language topic than at the beginning of our lesson – and we had a good time in the tuition process 😊 Btw 1: I owned two language schools in Vitoria-Gasteiz/Spain. Btw 2: I wrote my own course books "Aber Gern!" Deutsch im Hotel, vol 1 and 2 - for German classes at the BPLP Hotel College in Bali/Indonesia.USD 15.00/trialAvailable 00:00 TomorrowBook trial5.03,143 LessonsMadeleine MagnetProfessional TeacherSPEAKS :GermanNativeSpanishItalianEnglish+1On vacation from 15th to 1st Feb. 📚 Structured clases ❇️ Beginners🔸Test Prep ▪️Austrian dialect◽ ❇️Structured clases ❇️ Beginners🔹Kids🔸Test Prep 🔹Youth🔺 Advanced▪️Austrian dialect◽Grammar 🔻 Nach meinem Studienabschluss 2018 des Lehramts, habe ich ein Jahr lang an einer Handelsakademie in Österreich unterrichtet. Danach bin ich durch Kolumbien und Thailand gereist und habe noch in Kolumbien entschieden, mein Leben in Österreich aufzugeben und nach Madrid zu ziehen. Die beste Entscheidung meines Lebens. After graduating as a teacher in 2018, I taught at a commercial secondary school in Austria for one year. Afterwards I traveled through Colombia and Thailand and while still in Colombia I decided to give up my life in Austria and move to Madrid. The best decision of my life.USD 20.00/trialBook trial5.0398 LessonsMikolajCommunity TutorSPEAKS :GermanPolishNativeEnglishRussianSpanish+2Polish and German tutor with more than five years of experience You can practise with me your spoken Polish or German, but I would also love to help you with grammar, pronunciation and writing. We can talk about cultural topics, politics, travelling, news. All depends on you! Nice atmosphere is very important for me. After the first conversation with me you will see progress! If you have any questions feel free to contact me. I am looking forward to teaching you Polish or German.USD 12.00/trialAvailable 17:00 TodayBook trial5.06,118 LessonsMaria AthenaProfessional TeacherSPEAKS :GermanEnglishNativeFrenchGaelic (Irish)+5 I have been working as a German and English tutor since 2012 and I first began while I was still working on my undergraduate programme. Since 2014 I have been an active in-person and online tutor/teacher. After completing the CELTA in 2016, I also taught General English (B1-C2 levels) and Exams (FCE) at International House Minsk in Belarus in addition to meeting with my online students. I have experience teaching German at all levels and English from Low Intermediate to Advanced, including general language acquisition, reading/writing skills for both native and non-native speakers, intensive grammar and exams.USD 17.00/trialBook trial5.01,848 LessonsJack ADONGCommunity TutorSPEAKS :GermanFrenchNativeEnglish+1 J’enseigne l’allemand au lycée comme Langue Vivante II et aussi le français. J' enseigne le français en ligne depuis 3 ans.USD 5.00/trialAvailable 17:00 TodayBook trial5.01,973 LessonsMikhail DreyerProfessional TeacherSPEAKS :GermanEnglishNativeAfrikaans+2Certified teacher with over 8 years of experience. I was motivated to become an English teacher, so that I can assist in exposing students to the lingua franca of the world, that being English. Some estimates say that 80% of English speakers of the world are non native speakers. I obtained my TESOL certificate mid 2017 and decided to head to the east. I have taught kids and adults in rural Asian areas and have decided to bring my teaching expertise and experience online and have years of online teaching experience.USD 9.00/trialBook trialYour final payment will be made in USDPopular German classesGerman speaking lessonsBusiness German coursesGerman lessons for kidsGerman exam preparationDSH coursesT'''
