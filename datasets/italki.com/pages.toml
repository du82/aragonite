["https://italki.com/en/article/pXqHdHLGCgj3fTy6n4D8jO/for-german-learners-of-any-level-features-of-written-german-you-may-not-have-known-about"]
title = "italki - For German learners of any level: Features of written German you may not have known about"
description = "I will introduce five areas of language where interesting differences exist between German and English, and also give you little related cultural or historical side notes."
full_description = "Growing up, we learn to write in our mother tongue at school. While expressing things in a written rather than spoken way is a bit new to us as kids, slowly, with the time we spend reading and writing, we start to understand how meaning is encoded and transferred in the written format. However, at that time, we had no idea that texts may look quite or even entirely different in other languages. I assumed that the way that German is used in writing was universal everywhere in the world until my English teacher told me that I was not meant to write „I am at home“, but “I am at home”. Yes, indeed the quotes look different in German. As a language learner, you often won’t recognize or be taught those small differences until quite late in your learning journey. They are not very easy to look up online, plus when you just start out learning a new language, there will be other things occupying your mind. Even if not taught early on, it does make sense to know the way your target language works in written texts, because will help you in multiple ways: firstly, there will be fewer surprises for you when you read something, and in turn, your texts will be a lot better understood by natives. Secondly, understanding the way a language is written helps you understand more about that language’s culture, as it is closely linked with the way thought is expressed when writing. And thirdly, you may find elements that make so much sense to you that you may wish they were used in your native language’s texts as well. In the next section, I will introduce five areas of language where interesting differences exist between German and English, and also give you little related cultural or historical side notes. Whether you are a German beginner or already at an intermediate level, odds are, there may be some features of the German written language you didn’t know about yet! Where English writes 1st, 2nd, and 3rd to create ordinal numbers, German simply uses a full stop to do the same: 1. means first, 2. second, and 3. third. Like this, there is no need to change the suffix (st, nd, rd) depending on which number is being converted into its ordinal version. But there are more differences related to numbers between the languages. Decimal plates are marked by a full stop in English, while a comma is used in German, 1.5 versus 1,5. On the other hand, English also uses the comma, but to increase the readability of large numbers: the comma defines groups of three digits. In German, a space or a full stop may be used to do the same. What would be 1,000,000 in English can be written as 1.000.000 or 1,000,000 in German. This is something to be aware of for anyone working with both languages in the financial sector or science. Since I know this, I find myself involuntarily triple-checking my bank transfers."
year_published = 2025
