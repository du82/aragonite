["https://italki.com/en/article/PEuaai2bKTuX78vhCdxU71/let-s-try-to-avoid-always-saying-pero"]
title = "italki - Let’s try to avoid always saying 'pero'"
description = "How easy and common it is to use the word 'pero' ('but'), right? But (oops! I used it again), always using the word 'pero' can get boring and suggests that our level of Spanish is not very polished. In this article, we’ll explore other options for both formal and informal contexts."
full_description = "How easy and common it is to use the word 'pero' ('but'), right? But (oops! I used it again), always using the word 'pero' can get boring and suggests that our level of Spanish is not very polished. In this article, we’ll explore other options for both formal and informal contexts. One aspect that sets us apart when we speak is using a wide range of discourse connectors, tailored to the context and capable of capturing the listener's attention. As learners of a new language—in your case, Spanish—the first thing we need to do is understand what options exist and then incorporate them into our communication. Through this article, I hope you will learn to use alternative connectors instead of 'pero' to express objection or opposition to the main idea in both formal and informal contexts. The following options convey an idea that, in some way, contrasts with or opposes the previous one, using a slightly more relaxed register.Remember that every option can be replaced by 'pero'. A pesar de que me dijiste que la película era muy mala, de todos modos, yo fui a verla y no me pareció tan horrible Even though you told me the movie was really bad, I still went to see it and it didn't seem that horrible to me. Quería comprarme la camisa mas cara porque me gustaba mucho, sin embargo, no pude porque no tenía suficiente dinero. I wanted to buy the most expensive shirt because I really liked it; however, I couldn’t because I didn’t have enough money. And finally, a unique option that, while it might sound unusual, will elevate your speech and help you master this type of conjunction to express opposition. Básicamente, estoy de acuerdo con la idea general del proyecto, con todo y con eso, faltan detalles importantes y todavía no es posible realizarlo. Basically, I agree with the general idea of the project, even so, important details are missing, and it is not yet possible to carry it out. Reformulate the following sentences using the connectors provided. Write the sentences in the comments. You can read the reformulated sentences at the end of the text."
year_published = 2025
