full_description = '''Learn Portuguese online with experienced teachersAt italki, we offer a wide range of online Portuguese classes and courses with professional tutors. Our tutors are native speakers and experienced language instructors who are passionate about teaching Portuguese.Instant LessonWithin 72 hoursGeovanna MeloCommunity TutorSPEAKS :PortugueseNativeEnglish Sou uma pessoa muito paciente e amigável, e meu objetivo é fazer com que você aprenda de forma confortável e no seu ritmo. Tenho uma variedade de materiais de apoio, desde o nível iniciante até o mais avançado, para que possamos explorar juntos. Durante nossas conversas, vou te dar dicas de gramática de maneira natural. Além disso, planejo as aulas de acordo com seus interesses e objetivos, e também ensino gírias e expressões populares para você se sentir ainda mais à vontade no idioma!USD 5.00/trialBook trialBruno TerziCommunity TutorSPEAKS :PortugueseNativeEnglishSpanish+1 Minha experiência ensinando Português foi apoiando um projeto de inclusão para pessoas refugiadas da guerra entre Rússia e Ucrânia e também pessoas oriundas de alguns países da América Latina que se mudaram para o Brasil. Nada muito formal, más pelo contato e amizade que fiz com eles, contribuí para sua adaptação ao Brasil e aprendizagem do idioma Português.USD 5.00/trialAvailable 21:00 TodayBook trialCatarina CunhaCommunity TutorSPEAKS :PortugueseNativeEnglishFrenchSpanishLearn the Poetry of Portuguese. Como professora, sou dedicada, organizada e criativa. Acredito na eficácia científica de métodos de estudo ativo e repetição espaçada, e gosto de ensinar usando um ambiente divertido que pode envolver jogos, arte e cultura. Minhas aulas podem ser dinâmicas e interativas, focando na prática oral e escrita, e adaptadas às suas necessidades específicas. As a teacher, I am dedicated, organized and creative. I believe in the scientific effectiveness of active study methods and spaced repetition, and I like to teach using a fun enviroment that can involve games, art and culture. My classes can be dynamic and interactive, focusing on oral and written practices, and tailored to your specific needs.USD 5.50/trialAvailable 20:00 TodayBook trialThiago C RodriguesCommunity TutorSPEAKS :PortugueseNativeEnglishFrenchSpanish+1 I worked in hostels in Rio de Janeiro, and I am currently working in a small shop located within the walls of Old Quebec. Both are highly frequented cities by tourists, and because of that, I have had the opportunity to meet all kinds of people, while also learning a bit of anything and everything. I enjoy learning how to say greeting expressions and polite words in their native languages, which helps creating an nice and amicable atmosphere. I believe that this kind of experience makes me a good language tutor.USD 5.00/trialBook trialBrunoCommunity TutorSPEAKS :PortugueseNativeEnglishJapanese+1Learn authentic Brazilian Portuguese with a highly experienced tutor! ・Language and Culture With over 10 years of teaching experience, I have worked as a teacher of Portuguese, English and Japanese. I can teach students of Portuguese of all levels of proficiency, from A1 to C2. 10年以上の経験があり、ポルトガル語・英語・日本語の教師として働いてきました。A1からC2まで、すべての能力のレベルの生徒に教えることができます。 I also have experience in materials and course design, which is something I'm very fond of. 教材やコースデザインにおいて経験も積み、とても気に入っていますよ。 I am patient, encouraging and truly passionate about teaching. :) 一生徒のペースに配慮し、いつでも生徒たちを励まします。しかも、本当に教えるのが好きです。:)USD 10.00/trialAvailable 10:00 TodayBook trial3 Instant Lesson TeachersWe have teachers ready to have a lesson with you immediately! Find a teacher and start learning. View all Manuel TraqueteCommunity Tutor4.93,894 LessonsSPEAKS :PortugueseNativeEnglishNativeFrenchSpanish+2Certified foreign language teacher (English, Portuguese, French and Spanish)trialUSD 10.00BookShaheda Chowdhu...Community Tutor4.8507 LessonsSPEAKS :PortugueseNativeArabic (Egyptian)NativeChinese (Mandarin)NativeJapaneseNativeKoreanNativeSpanishNativeTurkishNativeArabicBengaliEnglishHindiUrdu"Experienced TEFL Certified Professional Teacher: 10 Years Teaching Children & Adults (Expert)"🎓trialUSD 18.00BookFilipe CristoCommunity Tutor5.0152 LessonsSPEAKS :PortugueseNativeEnglishSpanish+2Portuguese teacher with 5 years of experience in online teachingtrialUSD 5.00BookView allGabrielaCommunity TutorSPEAKS :PortugueseNativeEnglishProfessora de idiomas há quase 1 ano. Estou me graduando como professora de inglês e venho lecionando esse idioma há quase 1 ano para público de idades variadas em uma escola de idiomas.USD 6.00/trialBook trialAna Paula CardosoCommunity TutorSPEAKS :PortugueseNativeEnglishSpanishFrenchTutora de português com mais de 30 anos de experiência em educação Sempre fui muito dedicada. Continuo dando minhas aulas como professora de inglês. Sou paciente e adoro conhecer pessoas novas.USD 10.00/HourAvailable 00:00 TomorrowBook lessonEuclesia PauloCommunity TutorSPEAKS :PortugueseNativeEnglish+1 I have been a native Portuguese teacher online for 1 year, we must realize that learning language is the key to opening great doors, it has to do with history too, not just a grammar, so I have knowledge of best teaching practices, good communication, patience, ability to learn grom students and understand them, also empathy.USD 5.00/trialAvailable 16:30 TodayBook trialNathalia ParizottoCommunity TutorSPEAKS :PortugueseNativeEnglishFrenchSpanishGermanItalianPractice your Brazilian Portuguese with a native! I’m currently preparing to earn my TEFL certification and become a fully qualified teacher. In addition, I’m an experienced tutor with consistently positive feedback from students who appreciate the effectiveness of my teaching methods.USD 12.00/HourBook lessonRenata CantoCommunity TutorSPEAKS :PortugueseNativeEnglish+3 A Portuguese tutor with two years of experience teaching the language, photography, and literature workshops. Passionate about helping students achieve their goals, creating a friendly and relaxed atmosphere. Embraces cultural diversity and incorporates different perspectives into lessons to make learning more engaging. Approachable, attentive, and dedicated to making students feel comfortable while learning and progressing at their own pace.USD 17.00/HourAvailable 16:30 TodayBook lessonAna LíviaCommunity TutorSPEAKS :PortugueseNativeEnglishAprenda Português com uma Nativa: Aulas Descontraídas e Personalizadas! Embora eu não tenha experiência formal como professora de português, sou falante nativa e tenho um conhecimento profundo da língua, adquirido ao longo da minha vida no Brasil. Minha experiência vem da prática diária de comunicação em português e do meu próprio interesse em aprender e ensinar idiomas.USD 5.00/trialAvailable 10:00 TodayBook trial5.012.4k LessonsCristina DomènechProfessional TeacherKidsTest PreparationSPEAKS :PortugueseCatalanNativeSpanishNativeEnglishFrenchGermanItalianDutchSwedish+2Certified Polyglot Teacher with 16+ Years Experience - Learn 10 Languages with a Passionate Expert! I'm an open-minded, certified and enthusiastic teacher with over 12 years of teaching experience. With a friendly approach, I focus on students' goals, tailoring classes to their needs. I am committed to my students' success, ensuring each lesson is engaging and effective. Over the past 7 years, I’ve completed more than 10,000 lessons on italki, working with students of all ages and needs worldwide. Whether it's exam preparation, business language skills, relocation, or learning for pleasure, my adaptable and supportive teaching style helps students achieve their language learning goals. All in all I'm extremely passionate about my work and that's why I'm always trying to improve my skills.USD 40.00/trialAvailable 17:00 TodayBook trial5.09,264 LessonsGaëlle |Accent CoachProfessional TeacherSPEAKS :PortugueseFrenchNativeEnglishSpanish+4Accent Coach & Certified Teacher since 2014 | +9000 lessons on italki | Communicate more mindfully! I have been teaching on italki since 2015. I specialise in accent reduction and in "spoken French". I also worked for the MimicMethod for a few years, where I was the Head of French Instruction and helped give specific pronunciation feedback to students. Later on, I also took lessons with a cinema accent coach and got acquainted with a more theatrical approach, which helped me be more versatile in my feedback. When I see one type of feedback doesn't work, I try another one. Each student reacts differently to different verbal cues, so I think it's important I can bring these different approaches to them, whenever needed :)USD 25.00/trialBook trial5.04,027 LessonsDiego BrianProfessional TeacherTechnologySPEAKS :PortugueseNativeEnglishSpanishFrench+1Specialist in beginners | Especialista en principiantes I teach at all levels: from A1 (beginner) to C2 (advanced). Everyone is welcome, regardless of your race, color, gender, nationality, age, religion, or sexual orientation. I love teaching the Portuguese language and Brazilian culture. During the classes, I like to create a pleasant and supportive environment for learning. Don't be afraid to make mistakes during the classes; they are what will help you learn. I also prepare my students for exams such as Celpe-Bras.USD 15.00/trialBook trial5.03,261 LessonsNataliaProfessional TeacherTest PreparationSPEAKS :PortugueseNativeItalianNativeEnglishSpanish+2 I am very receptive to the needs of students and model classes according to individual interests.USD 14.00/trialBook trial5.01,762 LessonsRobLauberCommunity TutorSPEAKS :PortugueseNativeFrenchNativeGermanNativeSwiss GermanNativeEnglishItalianSpanish+14 Offen, Anspruchsvoll Ich bin gerne flexibel und locker, jedoch erwarte ich von meinem Schülern etwas Anderes: Sie sollen motiviert, streng zu sich sein und keine Minimalisten. Fragen Fragen Fragen und ich werde antworten, so gut ich kann und versuchen dein ganzes Potenzial aus dir raus zu holen. Ich werde auf deine Bedürfnisse eingehen und stets meine Lektionen anpassen.USD 20.00/trialAvailable 16:30 TodayBook trial5.02,669 LessonsPaulo PereiraCommunity TutorSPEAKS :PortugueseNativeEnglishFrenchSpanishTenho vários anos de experiência no Italki, com algum material bem útil. Vivi em Inglaterra e Suíça e senti a necessidade de falar uma língua estrangeira, para além de entender o que é essencial ou capricho. Por outro lado, verifiquei que o Português é ensinado de uma maneira muito defeituosa aos estrangeiros, permitindo uma aparência de aprendizagem rápida mas obrigando-os a estagnar depois sem nenhuma perspectiva na compreensão real e mais sofisticada da língua. Ensino a todas idades, desde crianças até idosos.USD 6.00/trialAvailable 16:30 TodayBook trial5.0124 LessonsRicardo Bruno CostaProfessional TeacherSPEAKS :PortugueseNativeSpanishEnglishItalian+2Professor licenciado em Ensino de Português, com pós-graduação em Teoria da Literatura I welcome and support people to learn European Portuguese. It’s a learning system that allows students to design their learning plans according to their own goals and needs. I provide tailored courses in European Portuguese as a Second Language and as a Foreign Language. My mission is to integrate international people in Portugal by developing their Portuguese language skills, opening them to increasingly meaningful and fulfilling interactions.USD 35.00/HourBook lesson5.0127 LessonsRicardo SantanaProfessional TeacherTest PreparationSPEAKS :PortugueseNativeSpanishEnglish Trabalho na área de educação presencial e online. Minhas aulas são focadas nas necessidades e interesses do aluno. Durante as aulas, priorizo o tempo de fala do aluno para que ele possa praticar e aproveitar o máximo do tempo possível. Ao final de cada encontro, disponibilizo anotações e correções feitas durante a aula, para que o aluno possa revisar o conteúdo e fixar o que foi aprendido.USD 8.00/trialAvailable 03:00 TomorrowBook trial5.0789 LessonsCristina ResendeProfessional TeacherSPEAKS :PortugueseNativeEnglish+1Certified teacher specialized in teaching beginer students of Portuguese I am a professional Portuguese teacher with over 20 years of experience teaching in language institutes and immersion courses in Brazil. Why choose me as your teacher? ✔️ Patient and supportive – I make learning comfortable and enjoyable. ✔️ Experienced and professional – 20 years teaching foreign languages. ✔️ Highly qualified – I hold a Master’s degree in Linguistics. ✔️ Specialist in second language acquisition – I understand how to make Portuguese easier for you. ✔️ Dedicated and encouraging – Your progress is my priority! Let’s learn Portuguese in a way that makes sense for you! Book a lesson and start improving today!USD 5.00/trialBook trialYour final payment will be made in USDPopular language lessonsEnglish lessons onlineSpanish lessons onlineJapanese lessons onlineFrench lessons onlineKorean lessons onlinePeople also learnItalian lessons onlineGerman lessons onlineChinese lessons onlineRussian lessons onlineDutch lessons onlineTurkish lessons onlineGreek lessons onlineUrdu lessons onlineTagalog lessons onlineYoruba lessons onlinePractical conversational classesEnglish speaking classesSpanish speaking classesJapanese speaking classesGerman speaking classesFrench speaking classesFrequently asked questions about online Portuguese lessonsCan I take online Portuguese classes if I am a beginner?How do I choose the right online Portuguese tutor for me?What types of online Portuguese classes and courses are available on italki?How much do online Portuguese classes and courses cost?Can I take online Portuguese classes and courses at any time?Ready to start learning Portuguese today? Sign up now to find the perfect Portuguese teacher for you and take your language skills to the next level!Start Learning TodayView full schedule'''
