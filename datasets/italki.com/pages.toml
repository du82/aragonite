 speaker. I have 4 lesson types: 1: Business English: I teach business terminology, practice & cultural English for students to work & be promoted in business. 2: General English: I work with you to choose the topics you want in order to improve your English. 3. Job Interview training: I use my experience hiring to train you to succeed in your interview. 3: English Exam Coaching: I teach students who are wanting to pass English exams. I have qualifications in both the IELTS and TOEFL systems and teach both. I also give feedback towards the end of every lesson so that the student understands where they are at on their journey to learning English and can set tailored homework.USD 12.00/trialBook trial5.03,589 LessonsSarah PanicoProfessional TeacherSPEAKS :EnglishItalianNativeFrench+1🌟 Learn, Speak, Achieve! 🌟 Fun, Interactive Italian & English Lessons with a Certified Expert! Every student is unique, which is why each lesson will be tailored to your learning style and personal goals. I strive to create a positive and motivating environment where you’ll feel comfortable asking questions, making mistakes, and improving. I believe language learning should be fun and engaging, so I make sure each lesson is interesting and pressure-free, while still offering the right support to help you progress quickly.USD 12.00/trialAvailable 16:30 TodayBook trial4.91,195 LessonsSteve MProfessional TeacherSPEAKS :EnglishNativeCertified Phonics (pronunciation) teacher with over 10 years experience I have been teaching in a business setting for more than 25 years. For the past 10 years, I have been teaching phonics - the proper "sound" of English - to adults and children for whom English is a second language. I use Phonics International's Systematic Synthetic Phonics program to methodically teach every sound spoken in the English language, helping you understand spoken English more easily as well as speak using English more fluently.USD 9.00/trialAvailable 16:30 TodayBook trial26 Instant 