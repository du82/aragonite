full_description = 'Smart Home / Smart Home Topics / eWeLink-Remote Control What is “eWeLink-Remote” Control? “eWeLink-Remote Control” is a unique new remote control solution for SONOFF devices, which is an optimization based on the traditional 433MHz RF control. It provides a more convenient, more reliable, and longer-distance control way for your home appliances. Overview Working Principles Video Cases Compare with RF Control Steps to Setup Scene Cases Supported Devices Special Offer FAQ How does “eWeLink-Remote” Control work? After you add the“eWeLink-Remote” sub-device to the “eWeLink-Remote” gateway, the two types of smart control below you will experience: ①* For SONOFF devices with the “eWeLink-Remote” gateway function(NSPanel Pro, MINIR4,TX Ultimate, M5, DUALR3/DUALR3 Lite, B05-BL, S40/S40 LITE…), you can get them controlled through the “eWeLink-Remote signal” transmitted by turning on/off the sub-devices (R5, S-MATE, S-MATE2) even if no Internet is available. ②* The “eWeLink-Remote” gateway and sub-device work like the Zigbee ecosystem. You can add the sub-device to any of the gateways to make the device communicate with different protocols, which means you can also control the SONOFF device without the “eWeLink-Remote” gateway function by setting the smart scene on the APP. Use Case Video Clips M5 switch & R5 scene controller MINI R3 switch & S-MATE “eWeLink Remote” Series Devices “eWeLink-Remote” Control VS 433MHz RF Control eWeLink-Remote" Control433MHz RF ControlParing method APP Long press button on devices Control other smart devices Gateway required(NSPanel Pro,MINIR4, TX Ultimate, M5, DUALR3/DUALR3 Lite, B05-BL, S40/S40 Lite...) Gateway required(RF BridgeR2) Add sub-devices to gateway Just need learn one button Learning button one by one Manage devices Add or delete device exactly Not exactly Working distance About 100M About 15M WP Data Tables How to learn and use? Why do I need “eWeLink-Remote” Control? 1. Want to find an easy solution to control the device from different positions? Our light switch is installed nearby the bedroom door and it’s very inconvenient to turn off the light at night. Is there any solution to facilitate the control without the need of retrofitting the existing wiring structure of my bedroom? The combination of the SONOFF R5 scene controller with the M5 smart switch provides you with a wiring-free and installation-free way that enables you to locally control your bedroom light from two positions. 2. Want to control several smart devices that are distributed in different rooms with one tap? I have lights turned on in the living room, porch, and bathroom, I don’t want to go out of the bedroom and turn them off. Setting the scene in the eWeLink app, you can use S-MATE to control the smart devices in different rooms. 3. Worry that the light learns mistakenly the signal from other places? Not easy to target precisely the device that you want to delete on the remote controller? The light is automatically on and off sometimes, which seems it mistakenly learned the signal from other places. “eWeLink-Remote Control” makes you exactly find the remote controls (sub-device) that you want to delete on the list of eWeLink App, ensuring easy management for the sub-devices. With “eWeLink- Remote” Control devices, nothing is a problem, which can provide you with a good experience via 150M local control and wireless remote control. Whether you are at home or not, you can enjoy the convenience brought by the SONOFF smart home in terms of functional experience and ease of use. In the near future, “eWeLink-Remote” Control will be available for more SONOFF devices. Why do I need “eWeLink-Remote” Control? 1. Want to find an easy solution to control the device from different positions? Our light switch is installed nearby the bedroom door and it’s very inconvenient to turn off the light at night. Is there any solution to facilitate the control without the need of retrofitting the existing wiring structure of my bedroom? The combination of the SONOFF R5 scene controller with the M5 smart switch provides you with a wiring-free and installation-free way that enables you to locally control your bedroom light from two positions. 2. Want to control several smart devices that are distributed in different rooms with one tap? I have lights turned on in the living room, porch, and bathroom, I don’t want to go out of the bedroom and turn them off. Setting the scene in the eWeLink app, you can use S-MATE to control the smart devices in different rooms. 3. Worry that the light learns mistakenly the signal from other places? Not easy to target precisely the device that you want to delete on the remote controller? The light is automatically on and off sometimes, which seems it mistakenly learned the signal from other places. “eWeLink-Remote Control” makes you exactly find the remote controls (sub-device) that you want to delete on the list of eWeLink App, ensuring easy management for the sub-devices. With “eWeLink- Remote” Control devices, nothing is a problem, which can provide you with a good experience via 150M local control and wireless remote control. Whether you are at home or not, you can enjoy the convenience brought by the SONOFF smart home in terms of functional experience and ease of use. In the near future, “eWeLink-Remote” Control will be available for more SONOFF devices. “eWeLink- Remote” Devices “eWeLink-Remote” Gateways Sale! .wapl-label-id-335230 .product-label:after { border-color: #ff0000; } -10% SONOFF DUALR3/DUALR3 Lite Dual Relay Two Way Power Metering Smart Switch USD$11.16 – USD$12.58 Select options This product has multiple variants. The options may be chosen on the product page SONOFF SwitchMan Smart Wall Switch-M5 USD$17.99 – USD$22.49 Select options This product has multiple variants. The options may be chosen on the product page SONOFF B02-BL/B05-BL Wi-Fi Smart LED Bulb USD$9.90 Select options This product has multiple variants. The options may be chosen on the product page Sale! SONOFF iPlug Series Wi-Fi Smart Plug – S40 & S40 Lite USD$6.93 – USD$10.90 Select options This product has multiple variants. The options may be chosen on the product page Sale! .wapl-label-id-601684 .product-label:after { border-color: #ff0000; } -25% SONOFF NSPanel Pro Smart Home Control Panel USD$119.90 Original price was: USD$119.90.USD$89.90Current price is: USD$89.90. Select options This product has multiple variants. The options may be chosen on the product page Sale! .wapl-label-id-335230 .product-label:after { border-color: #ff0000; } -10% SONOFF MINI Extreme Wi-Fi Smart Switch MINIR4 USD$9.90 Original price was: USD$9.90.USD$8.91Current price is: USD$8.91. Add to cart SONOFF TX Ultimate Smart Touch Wall Switch USD$24.90 – USD$32.90 Select options This product has multiple variants. The options may be chosen on the product page Sale! .wapl-label-id-694184 .product-label:after { border-color: #ff0000; } -10% .wapl-label-id-335240 .product-label:after { border-color: #ff0000; } -10% SONOFF iHost Smart Home Hub USD$71.90 – USD$99.90 Select options This product has multiple variants. The options may be chosen on the product page Sale! .wapl-label-id-335238 .product-label:after { border-color: #ff0000; } -30% SONOFF BASICR4 Wi-Fi Smart Switch USD$6.99 Original price was: USD$6.99.USD$4.85Current price is: USD$4.85. Add to cart .wapl-label-id-639741 .product-label:after { border-color: #ff0000; } New SONOFF SwitchMan Smart Wall Switch-M5 Matter (White) USD$17.99 – USD$22.49 Select options This product has multiple variants. The options may be chosen on the product page “eWeLink-Remote” Sub-devices SONOFF SwitchMan R5 Scene Controller USD$12.49 Select options This product has multiple variants. The options may be chosen on the product page Sale! .wapl-label-id-335230 .product-label:after { border-color: #ff0000; } -10% SONOFF S-MATE Extreme Switch Mate USD$7.49 Original price was: USD$7.49.USD$6.74Current price is: USD$6.74. Add to cart