full_description = "Build Your Smart Irrigation System with SONOFF Zigbee Smart Water Valve in Home Assistant with ZHA Jul 12, 2024Configure SONOFF Zigbee smart water valve to work with Home Assistant via Zigbee Home Automation (ZHA) to automate your watering. What is LAN Mode? May 17, 2021LAN mode ensures that users can still manage their smart devices locally using the eWeLink app, enhancing the reliability and security of their smart home setup. Connect SONOFF ZigBee Devices to Alexa Echo 4 May 17, 2021Set up Echo 4 and connect SONOFF ZigBee devices to it, then create the smart scene to make the SONOFF ZigBee device trigger smart devices. NEXTION TUTORIAL-BASED ON NEXTION ARDUINO LIBRARY May 29, 2021From this tutorial, you will learn how to use the ITEADLIB Arduino Nextion Library to work with Nextion. Nextion Advanced Application 1: Use Timer, Variable and If to Implement GIF Animation May 17, 2021Combine using multiple components like timer and variable component to make a simple GIF animation with if statements used in the code. Nextion Advanced Application 2: Use Global and Variable to Transmit Values Among Pages May 17, 2021Create number input bars using text, buttons, and variable components. Key to this is the vscope-global property, enabling value transmission across pages. RDM6300 ARDUINO DOOR CONTROL SYSTEM May 19, 2021Describe a DIY project using the RDM6300 RFID module to create an Arduino-based door control system. Includes uploading demo code to the Arduino, assembling the hardware, etc. 134.2kHz RFID reader module : RDM660 May 18, 2021RDM660 is designed for reading codes from 134.2kHz RFID cards or tags and supports HTS-H32, HTS-48, and HTS-56 card types. It is compatible with the ISO11784/85 protocol. Using ESP8266/ESP8285 to Blink an LED May 17, 2021This tutorial briefly introduces ESP8266 and ESP8285, and how to develop a simple LED blinking application based on the official SDK."
