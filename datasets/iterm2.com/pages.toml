["https://iterm2.com/3.4/documentation-tmux-integration.html"]
title = "tmux Integration - Documentation - iTerm2 - macOS Terminal Replacement"
description = "iTerm2 is a replacement for Terminal and the successor to iTerm"
full_description = '''Introduction Highlights for New Users General Usage User Interface Menu Items Preferences Touch Bar Copy Mode Fonts Profile Search Syntax Features Automatic Profile Switching Badges Buried Sessions Captured Output Coprocesses Hotkeys Session Restoration Shell Integration Smart Selection Status Bar tmux Integration Triggers Utilities Scripting Scripting Fundamentals Variables Python API Advanced Applescript Dynamic Profiles Inline Images Protocol Proprietary Escape Codes iTerm2 is integrated with tmux, allowing you to enjoy a native user interface with all the benefits of tmux's persistence. Normally, when you use tmux, multiple virtual windows are displayed in a single "physical" window. You can manipulate the environment by issuing commands to tmux. This poses a few problems: For many users, a terminal multiplexer would be a great way to work, but they don't want to accept the drawbacks. When you run "tmux -CC", a new tmux session is created. An iTerm2 window opens and it acts like a normal iTerm2 window. The difference is that when iTerm2 quits or the ssh session is lost, tmux keeps running. You can return to the host you were ssh'ed into and run "tmux -CC attach" and the iTerm2 windows will reopen in the same state they were in before. A few use cases come to mind: You should be able to use tmux as always. Just add the -CC argument to its invocation. In practice, this means running one of these commands: In general, you don't need to run commands to perform the most common actions. The following iTerm2 actions affect tmux: Check Preferences > General > tmux for configuration settings. You can also adjust whether to open the tmux Dashboard when connecting to a session with a large number of windows. You can open the tmux Dashboard by selecting the menu item Shell > tmux > Dashboard. For practical tips on how to configure iTerm2 for use with tmux integration in the real world, please see tmux Integration Best Practices.'''
