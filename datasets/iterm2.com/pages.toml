["https://iterm2.com/documentation-status-bar.html"]
title = "Status Bar - Documentation - iTerm2 - macOS Terminal Replacement"
description = "iTerm2 is a replacement for Terminal and the successor to iTerm"
full_description = "Introduction Highlights for New Users General Usage User Interface Menu Items Preferences Touch Bar Copy Mode Fonts Profile Search Syntax Features Automatic Profile Switching Badges Buried Sessions Captured Output Coprocesses Hotkeys Session Restoration Shell Integration Smart Selection Status Bar tmux Integration Triggers Utilities Scripting Scripting Fundamentals Variables Python API Advanced Applescript Dynamic Profiles Inline Images Protocol Proprietary Escape Codes iTerm2 offers a configurable, scriptable status bar. The purpose of the status bar is to show up-to-date information about the environment you're working in and to offer useful interactions where appropriate. Go to Settings > Profiles > Session. Turn on Status bar enabled. Then click Configure Status Bar to begin setting up your status bar configuration. You can also write your own components in Python. See the examples section of the Python API docs for a working demo. Custom components show up at the end of the list (you may need to scroll down to see them). To remove a status bar component, select and press backspace. You can also drag it out of the Active Components section. Many components can be configured. To modify a component's settings, select it in the Active Components section. Then click Configure Component. The clock component has a Date Format setting. It defaults to M-DD h:mm. See Unicode TR 35-1 for the syntax. The git status component lets you configure the polling interval in seconds. It periodically runs git commands in the current directory to check its status, and this determines the time between updates. The git command is run in a sandbox that does not allow writing to the filesystem outside of /tmp and /var to avoid side-effects. The interpolated string component has a String Value parameter where you can enter the interpolated string you wish to display. It is evaluated in the context of the current session. The function call comonent has a Label that is displayed in the status bar and a Function call parameter that gives the Python API function call to invoke when the component is clicked."
