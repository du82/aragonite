["https://iterm2.com/documentation-command-selection.html"]
title = "Command Selection and Command URLs - Documentation - iTerm2 - macOS Terminal Replacement"
description = "iTerm2 is a replacement for Terminal and the successor to iTerm"
full_description = "Introduction Highlights for New Users General Usage User Interface Menu Items Preferences Touch Bar Copy Mode Fonts Profile Search Syntax Features Automatic Profile Switching Badges Buried Sessions Captured Output Coprocesses Hotkeys Session Restoration Shell Integration Smart Selection Status Bar tmux Integration Triggers Utilities Scripting Scripting Fundamentals Variables Python API Advanced Applescript Dynamic Profiles Inline Images Protocol Proprietary Escape Codes The selection is indicated by drawing a colored line around the command and its output. Other areas are dimmed. To disable command selection turn off Settings > General > Selection > Clicking on a command selects it to restrict Find and Filter. The share button introduces the concept of command URLs. Here is a simple example of a command URL: iterm2:/command?c=date. If a hostname is present, iTerm2 will attempt to ssh to the host to run the command. For exmaple, iterm2:[email protected]/command?c=date runs date on host example.com as user gnachman. Normally when you open a command URL you are presented with a window that describes what will be done and offers options on how to run it (e.g., in a new tab, a new window, or in the current session). The optional silent query parameter suppresses this window. A confirmation dialog is shown instead. If the user consents, the command runs in the background and its output is not shown. This query parameter does not take a value."
