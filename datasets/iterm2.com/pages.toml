["https://iterm2.com/3.0/documentation-utilities.html"]
title = "Utilities - Documentation - iTerm2 - macOS Terminal Replacement"
description = "iTerm2 is a replacement for Terminal and the successor to iTerm"
full_description = "Introduction Highlights for New Users General Usage User Interface Menu Items Settings Touch Bar Copy Mode Fonts Profile Search Syntax Command Selection and Command URLs Features Automatic Profile Switching Badges Buried Sessions Captured Output Coprocesses Hotkeys Session Restoration Shell Integration Smart Selection tmux Integration Triggers Utilities Advanced Scripting Dynamic Profiles Inline Images Protocol Proprietary Escape Codes iTerm2 has a collection of shell scripts that help you take advantage of some of its unique features. When you install Shell Integration, you're asked if you'd like to install the Utilities Package as well. This page describes these utilities. The it2dl program downloads files. This is useful when you are ssh'ed to a remote host. The downloaded files are placed in your Downloads folder. The Utilities Package places shell scripts in $HOME/.iterm2/ and creates aliases to them at the bottom of $HOME/.iterm2_shell_integration.$SHELL."
