["https://iterm2.com/faq.html"]
title = "FAQ - iTerm2 - macOS Terminal Replacement"
description = "iTerm2 is a replacement for Terminal and the successor to iTerm"
full_description = '''A: iTerm2 is for macOS only. See the downloads page for which OS versions are supported by each version of the app. A: Go to Preferences->Profiles->Text and change the "Draw bold text in bold font" and "Draw bold text in bright colors" settings. Try running this command in bash to see the difference between the two behaviors: A: Make sure you are running the latest version. Disable transparency and blur. Use a solid background color rather than an image. If you are on 3.2 or later, ensure the GPU renderer is enabled and that it can be used per the restrictions described at Metal Renderer. A: Check that the $TERM variable is correct. xterm-256color is recommended. xterm-new will also work. Make sure you do not have custom key bindings in Preferences > Keys or Preferences > Profiles > Keys for these keys. Disabling Preferences > Profiles > Keys > Allow application keypad mode will prevent your terminal from getting stuck in application keypad mode, which often has the effect of breaking keys that normally work. A: Preferences, including profiles, are stored in ~/Library/Preferences/com.googlecode.iterm2.plist. To modify it, use the "defaults" command. For example, to delete all settings, run: A: iTerm2 lets you to specify two fonts. If you only use English or western european languages, you probably only need to set the font for ASCII characters. For other languages, you need to specify a font that works with your language as the Non-ASCII font. You need to make sure the size (height) of two fonts do not differ greatly, so iTerm2 won't display a mess of mixed glyphs. A: Go to Preferences > Profiles > Text and change the setting of "Treat ambiguous-width characters as double-width." A: Go to Preferences > Profiles tab. Select your profile on the left, and then open the Keyboard tab. At the bottom is a set of buttons that lets you select the behavior of the Option key. For most users, Esc+ will be the best choice. A: Press Cmd-I (or View->Edit Current Session...) and enter a new title in the "Name" field. You can set it programmatically (in bash) with:'''
