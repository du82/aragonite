["https://iterm2.com/version3.html"]
title = "Version 3 - iTerm2 - macOS Terminal Replacement"
description = "iTerm2 is a replacement for Terminal and the successor to iTerm"
full_description = '''iTerm2 version 3.4 is now out as a "stable" build, meaning there are no known major bugs. It has a bunch of new features. This document lists the highlights. Tmux integration now has an advanced flow control feature that will prevent excessive buffering (requires tmux 3.2). Creating a new tab is now faster and uses fewer process IDs, thanks to a redesigned daemon process. Performance with background images has been improved. There's a new Python scripting API that allows you to automate and customize many parts of iTerm2. See the documentation for details. The status bar is customizable and comes with thirteen different built-in components. You can also make your own in Python. A new Minimal theme reduces visual clutter, while the Compact theme saves space by combining the title bar and tab bar. There are dozens of new features. Many bugs have been fixed. Performance is significantly improved. The look and feel has been updated. Applescript support has been updated, but it's not backwards compatible. There are a lot of new features in 3.0. It represents about eighteen months of development. Here are the highlights. Shell Integration is a modification to your shell's login script that informs iTerm2 of which commands you're running, which host you're logged in to, what your user name is, and what your current directory is. This enables all kinds of cool features, such as easily navigating to preceding shell prompts, getting a notification when a long-running job finishes, drag-dropping files to upload and download on remote hosts, and much more. All the details are at the Shell Integration document. When Shell Integration is installed, iTerm2 records the commands you've used. You can see a list of them in the Toolbelt and easily navigate to them in your history or re-run them. You can even see which directory you were in when you ran a command. When Shell Integration is installed, iTerm2 records the directories you use most often. You can see a list of them in the Toolbelt ordered by a combination of frequency and recency of use.'''
year_published = 2025
clearnet = "https://iterm2.com/version3.html"
