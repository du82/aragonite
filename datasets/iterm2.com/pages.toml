["https://iterm2.com/3.3/documentation-badges.html"]
title = "Badges - Documentation - iTerm2 - macOS Terminal Replacement"
description = "iTerm2 is a replacement for Terminal and the successor to iTerm"
full_description = "Introduction Highlights for New Users General Usage User Interface Menu Items Preferences Touch Bar Copy Mode Fonts Profile Search Syntax Features Automatic Profile Switching Badges Buried Sessions Captured Output Coprocesses Hotkeys Session Restoration Shell Integration Smart Selection Status Bar tmux Integration Triggers Utilities Scripting Scripting Fundamentals Variables Python API Advanced Applescript Dynamic Profiles Inline Images Protocol Proprietary Escape Codes A badge is a large text label that appears in the top right of a terminal session to provide dynamic status, such as the current host name or git branch. Its initial value is defined in Preferences>Profiles>General>Badge and it can be changed by an iTerm2-proprietary escape sequence. It may also reference iTerm2- and user-defined variables. The badge format is an interpolated string. See Scripting Fundamentals for more information on how to use interpolated strings to include information from the terminal state in the badge. It also describes how you can set user-defined variables, such as the current git branch, which may appear in the badge. The badge's color may be set in Preferences>Profiles>Colors. Its position and typeface may be set in Preferences>Profiles>General. Note that the position is always relative to the top right of the session's viewport."
