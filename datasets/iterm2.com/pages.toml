["https://iterm2.com/features.html"]
title = "Features - iTerm2 - macOS Terminal Replacement"
description = "iTerm2 is a replacement for Terminal and the successor to iTerm"
full_description = "iTerm2 has a lot of features. Every conceivable desire a terminal user might have has been foreseen and solved. And these are just the main attractions! Divide a tab up into multiple panes, each one showing a different session. You can slice vertically and horizontally and create any number of panes in any imaginable arrangement. Notice how inactive panes are slightly dimmed so it's easy to see which is active. Register a hotkey that brings iTerm2 to the foreground when you're in another application. A terminal is always a keypress away. You can choose to have the hotkey open a dedicated window. This gives you an always-available terminal (like Visor, Guake, or Yakuake) at your fingertips. iTerm2 comes with a robust find-on-page feature. The UI stays out of the way. All matches are immediately highlighted. Even regular expression support is offered! Just type the start of any word that has ever appeared in your window and then Cmd-; will pop open a window with suggestions. The word you're looking for is usually on top of the list! Paste history lets you revisit recently copied or pasted text. You can even opt to have the history saved to disk so it will never be lost. Coming from a Unix world? You'll feel at home with focus follows mouse, copy on select, middle button paste, and keyboard shortcuts to avoid mousing. With both 24-bit and 256-color mode, Vim explodes with photorealism: the terminal is a medley of color and code comes alive. Do you lose your cursor when there are lots of different colors or have programs display hard-to-read color combinations? With the Smart Cursor Color and Minimum Contrast features, you can ensure that these problems are gone for good. You can use the mouse to position the cursor, highlight text, and perform other functions in programs like Vim and Emacs with the mouse reporting feature. You can choose to receive notifications of activity, bells, job completion, and more. Feel free to let a long job run in the background, secure in the knowledge that you'll know when it's done."
year_published = 2025
clearnet = "https://iterm2.com/features.html"
