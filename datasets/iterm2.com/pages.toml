["https://iterm2.com/3.4/documentation-scripting-fundamentals.html"]
title = "Scripting Fundamentals - Documentation - iTerm2 - macOS Terminal Replacement"
description = "iTerm2 is a replacement for Terminal and the successor to iTerm"
full_description = "Introduction Highlights for New Users General Usage User Interface Menu Items Preferences Touch Bar Copy Mode Fonts Profile Search Syntax Features Automatic Profile Switching Badges Buried Sessions Captured Output Coprocesses Hotkeys Session Restoration Shell Integration Smart Selection Status Bar tmux Integration Triggers Utilities Scripting Scripting Fundamentals Variables Python API Advanced Applescript Dynamic Profiles Inline Images Protocol Proprietary Escape Codes Sessions, tabs, windows, and the iTerm2 application itself each have bits of information that are useful to users and script writers. For example: a session has a working directory, a tab or a window may have a custom title, and the iTerm2 process has a theme such as light or dark mode. A variable exists in some context. Each session, tab, and window has its own context. The application itself also has a context, called the global context. A variable has a name, such as hostname, and a value. The value is any data type encodable in JSON: numbers, booleans, strings, dictionaries, arrays, and null. There is also a special kind of variable that references a different context, allowing you to reach (for example) variables in the tab's context from its sessions' contexts. iTerm2 defines a number of built-in variables. There are also special contexts for user-defined variables. A user-defined variable has a value set by a control sequence or a script. Variables were originally invented for Badges as a way for users to embed text in a badge. For example, a shell script could set a user-defined variable containing the name of the current git branch, and that could be displayed in the badge. As the Python scripting API was developed, it became clear that variables were a useful tool for sharing information between iTerm2 and scripts. Scripts may register functions which users can invoke through various hooks. For example, you can bind the invocation of function call to a keypress or a trigger. For example, let us consider a hypothetical function that creates a new window using a passed-in initial working directory and profile. We'll name our function create_window, since every function has a name."
