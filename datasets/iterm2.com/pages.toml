["https://iterm2.com/3.3/documentation-menu-items.html"]
title = "Menu Items - Documentation - iTerm2 - macOS Terminal Replacement"
description = "iTerm2 is a replacement for Terminal and the successor to iTerm"
full_description = "Introduction Highlights for New Users General Usage User Interface Menu Items Preferences Touch Bar Copy Mode Fonts Profile Search Syntax Features Automatic Profile Switching Badges Buried Sessions Captured Output Coprocesses Hotkeys Session Restoration Shell Integration Smart Selection Status Bar tmux Integration Triggers Utilities Scripting Scripting Fundamentals Variables Python API Advanced Applescript Dynamic Profiles Inline Images Protocol Proprietary Escape Codes When you start using iTerm2 it will offer to show you a daily tip describing a feature. You can show a tip immediately by selecting this item. Checks to see if a new version of iTerm2 is available. If Preferences > General > Prompt for test-release updates is turned on then this includes beta versions; otherwise only stable versions are downloaded. This saves helpful debugging information in memory. When it is toggled off it is saved to /tmp/debuglog.txt. Copies information about drawing performance to the pasteboard. This is useful for filing bug reports. Creates a file with information about how the screen was drawn when using the GPU renderer. This is useful for filing bug reports. When this is enabled, the operating system will prevent other programs running on your computer from being able to see what you are typing. If you're concerned that untrusted programs might try to steal your passwords, you can turn this on, but it may disable global hotkeys in other programs. You must hold down Option for this entry to be visible. Makes Terminal.app the default terminal for opening .command, .tool, .zsh, .csh, and .pl files. Runs a shell script that modifies your .bash_profile (or other startup script) and enables the Shell Integration features. This creates a new window or tab with the default profile. If the current session is a tmux integration session, then you will be prompted for whether to create a local or tmux session. This creates a new tab using the same profile as the current session rather than the default profile."
