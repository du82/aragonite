["https://iterm2.com/3.0/documentation-preferences.html"]
title = "Preferences - Documentation - iTerm2 - macOS Terminal Replacement"
description = "iTerm2 is a replacement for Terminal and the successor to iTerm"
full_description = "Introduction Highlights for New Users General Usage User Interface Menu Items Settings Touch Bar Copy Mode Fonts Profile Search Syntax Command Selection and Command URLs Features Automatic Profile Switching Badges Buried Sessions Captured Output Coprocesses Hotkeys Session Restoration Shell Integration Smart Selection tmux Integration Triggers Utilities Advanced Scripting Dynamic Profiles Inline Images Protocol Proprietary Escape Codes The first dropdown box lets you select how windows will be opened when iTerm2 is launched. Most users will want Use System Window Restoration Setting as it works best with Session Restoration. Users who exclusively use the Hotkey Window may prefer Don't Open Any Windows. If you have a default window arrangement saved then Open Default Window Arrangement will be available. If selected, commands that close one session will not be confirmed, but commands that close multiple sessions (such as clicking the red button on a window with two or more tabs) will be confirmed with an alert box. This setting specifies the maximum amount of memory allocated to instant replay for each tab or split pane. More memory means instant replay is able to go farther back into the past. You can enter instant replay with View > Step Back in Time. If selected, every time text is copied or pasted in iTerm2 it will be saved to disk. The last 20 values are recorded. They can be accessed with Edit > Open Paste History.... If you use Shell Integration then when this is enabled your command history, directory history, and remote hostname and usernames will also be saved to disk. Unchecking this will erase all of the saved information. If selected, all Bonjour hosts on the local network have a profile created for them as long as they're around. If enabled, iTerm2 will periodically check if a new version of iTerm2 exists, and if so it will prompt you to download and upgrade. If enabled, iTerm2 will periodically check if a new unstable version of iTerm2 exists, and if so it will prompt you to download and upgrade."
