["https://iterm2.com/documentation-dynamic-profiles.html"]
title = "Dynamic Profiles - Documentation - iTerm2 - macOS Terminal Replacement"
description = "iTerm2 is a replacement for Terminal and the successor to iTerm"
full_description = '''Introduction Highlights for New Users General Usage User Interface Menu Items Preferences Touch Bar Copy Mode Fonts Profile Search Syntax Features Automatic Profile Switching Badges Buried Sessions Captured Output Coprocesses Hotkeys Session Restoration Shell Integration Smart Selection Status Bar tmux Integration Triggers Utilities Scripting Scripting Fundamentals Variables Python API Advanced Applescript Dynamic Profiles Inline Images Protocol Proprietary Escape Codes Dynamic Profiles is a feature that allows you to store your profiles in a file outside the usual macOS settings database. Profiles may be changed at runtime by editing one or more plist files (formatted as JSON, XML, or in binary). Changes are picked up immediately. While iTerm2 runs, it monitors the contents of that folder. Any time the folder's contents change, all files in it are reloaded. Files in this folder are expected to be formatted as Apple Property Lists. No particular file extension is required. All files in the folder must be valid property lists. If any is malformed, then no changes will be processed. A property list describes a data structure consisting of arrays, dictionaries, strings, integers, and boolean values. Property lists may be written in JSON or XML. Here's an example of the skeletal structure of a JSON property list that iTerm2 expects for Dynamic Profiles: The "Guid" is a globally unique identifier. It is used to track changes to the profile over time. No other profile should ever have the same guid. One easy way to generate a Guid is to use the uuidgen program, which comes standard with macOS. The only way to change a dynamic profile is to modify its parent profile or to modify the property list file. If you change its properties through the Settings UI those changes will not be reflected in the property list. Every profile preference that iTerm2 supports may be an attribute of a Dynamic Profile. Since there are dozens of attributes, you usually won't specify them all. Any attribute not specified will inherit its value from the default profile, or a specified "parent" profile (see below).'''
year_published = 2025
