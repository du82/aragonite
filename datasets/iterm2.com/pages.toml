["https://iterm2.com/3.3/documentation-highlights.html"]
title = "Highlights for New Users - Documentation - iTerm2 - macOS Terminal Replacement"
description = "iTerm2 is a replacement for Terminal and the successor to iTerm"
full_description = '''Introduction Highlights for New Users General Usage User Interface Menu Items Preferences Touch Bar Copy Mode Fonts Profile Search Syntax Features Automatic Profile Switching Badges Buried Sessions Captured Output Coprocesses Hotkeys Session Restoration Shell Integration Smart Selection Status Bar tmux Integration Triggers Utilities Scripting Scripting Fundamentals Variables Python API Advanced Applescript Dynamic Profiles Inline Images Protocol Proprietary Escape Codes This chapter describes features of iTerm2 that go beyond basic usage and are not generally found in other terminal emulators. iTerm2 allows you to divide a tab into many rectangular "panes", each of which is a different terminal session. The shortcuts cmd-d and cmd-shift-d divide an existing session vertically or horizontally, respectively. You can navigate among split panes with cmd-opt-arrow or cmd-[ and cmd-]. You can "maximize" the current pane--hiding all others in that tab--with cmd-shift-enter. Pressing the shortcut again restores the hidden panes. iTerm2 offers a special terminal window that is always available with a single keystroke. This window is called the "hotkey window" and is most commonly used for occasional administrative tasks. It is described in Hotkeys. iTerm2 allows you to remap modifiers. You have separate control over left and right command and option keys. One common need is to exchange cmd and option. To do this, go to Preferences > Keys. Set Left option key to Left command key and Left command key to Left option key (and do the same for Right command and Right option if you please). You can add exceptions if you don't want certain combinations to be remapped (for example, cmd-tab) by adding a new global shortcut with the action "Do Not Remap" and the keystroke of the (unremapped) key you wish to keep unaffected by modifier remapping. You can mark a location in a session with cmd-shift-M and then jump back to it with cmd-shift-J. This is useful, for instance, if you suspend your editor to compile a program and it emits errors. You can save a mark at that point and then return to your editor to fix the errors. As you work, you can jump back to the compilation errors with cmd-shift-J.'''
year_published = 2025
