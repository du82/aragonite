["https://iterm2.com/news.html"]
title = "iTerm2 - macOS Terminal Replacement"
description = "iTerm2 is a replacement for Terminal and the successor to iTerm"
full_description = "Sunnyvale, CA—May 20, 2024 Version 3.5 of iTerm2 has been released. It adds a number of new features, such as improved navigation, filtering, light/dark mode color schemes, ChatGPT integration, and integration with 1Password. Read the release notes for details. Version 3.4.20 and 3.5.0beta11 have been released today. They address security vulnerabilities related to control sequences that send responses which can be used to cause iTerm2 to issue commands under certain circumstances. Credit goes to Github user solid-snail for the discovery. Please read From Terminal Output to Arbitrary Remote Code Execution for more information. iTerm2 version 3.4 has been released, featuring a number of improvements to performance, core functionality, and polish. For all the details, please see the change log. Sunnyvale, CA—October 9, 2019 A serious bug (CVE-2019-9535) was fixed in version 3.3.6. Users on older versions should upgrade right away. More details can be found here: https://groups.google.com/forum/#!topic/iterm2-discuss/57k_AuLdQa4 iTerm2 version 3.3 has been released, featuring two new themes, a status bar, and a very powerful Python scripting API. Many core features have been improved, such as how titles are displayed, how keyboard input is transmitted, how background images are drawn, and more. For all the details, please see the change log. iTerm2 version 3.2 has been released, featuring a new drawing engine that uses Metal to improve rendering performance by using the GPU. Screen updates are much faster, leaving your CPU free to do more. Scrolling is buttery smooth! Many new features and bug fixes are also included. Read the change log for details. Version 3.1.1 of iTerm2 has been released and contains an important security update. Prior versions could leak private data over DNS requests. Please update to 3.1.1 or later. For more information, please see the official statement. ...and scores of small new features (like hyperlinks and new shell integration utilities) and bug fixes. You can see all the details in the change log."
