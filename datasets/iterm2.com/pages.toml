["https://iterm2.com/3.3/documentation-buried-sessions.html"]
title = "Buried Sessions - Documentation - iTerm2 - macOS Terminal Replacement"
description = "iTerm2 is a replacement for Terminal and the successor to iTerm"
full_description = "Introduction Highlights for New Users General Usage User Interface Menu Items Preferences Touch Bar Copy Mode Fonts Profile Search Syntax Features Automatic Profile Switching Badges Buried Sessions Captured Output Coprocesses Hotkeys Session Restoration Shell Integration Smart Selection Status Bar tmux Integration Triggers Utilities Scripting Scripting Fundamentals Variables Python API Advanced Applescript Dynamic Profiles Inline Images Protocol Proprietary Escape Codes A buried session is a session that continues to run but is not a part of any window. If you have a long-running job that you want out of the way, it can be convenient to bury its session. It is used by default for the session where you initiate a tmux integration client using tmux Integration. To bury the current session, select Session > Bury Session. To restore a session, select it from the list of buried sessions in Session > Buried Sessions."
