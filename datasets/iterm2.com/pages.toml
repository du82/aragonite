["https://iterm2.com/documentation-images.html"]
title = "Images - Documentation - iTerm2 - macOS Terminal Replacement"
description = "iTerm2 is a replacement for Terminal and the successor to iTerm"
full_description = 'Introduction Highlights for New Users General Usage User Interface Menu Items Preferences Touch Bar Copy Mode Fonts Profile Search Syntax Features Automatic Profile Switching Badges Buried Sessions Captured Output Coprocesses Hotkeys Session Restoration Shell Integration Smart Selection Status Bar tmux Integration Triggers Utilities Scripting Scripting Fundamentals Variables Python API Advanced Applescript Dynamic Profiles Inline Images Protocol Proprietary Escape Codes iTerm2 is able to display images within the terminal. Using a similar mechanism, it can also facilitate file transfers over any transport (such as ssh or telnet), even in a non-8-bit-clean environment. Starting in iTerm2 version 3.2.0, Retina displays are properly supported. Previously, they would be double-size (one display "point" per image pixel rather than one display pixel per image pixel). If you prefer the old behavior, change Prefs > Advanced > Show inline images at Retina resolution. iTerm2 extends the xterm protocol with a set of proprietary escape sequences. In general, the pattern is: For file transfer and inline images, there are two control sequences. The original one, which works on all remotely modern versions of iTerm2 is: The optional arguments are formatted as key=value with a semicolon between each key-value pair. They are described below. A new way of sending files was introduced in iTerm2 version 3.5 which works in tmux integration mode by splitting the giant control sequence into a number of smaller ones: What size chunks should you use? Older versions of tmux have a limit of 256 bytes for the entire sequence. In newer versions of tmux, the limit is 1,048,576 bytes. iTerm2 also imposes a limit of 1,048,576 bytes. By omitting the inline argument (or setting its value to 0), files will be downloaded and saved in the Downloads folder instead of being displayed inline. Any kind of file may be downloaded, but only images will display inline. Any image format that macOS supports will display inline, including PDF, PICT, or any number of bitmap data formats (PNG, GIF, etc.). A new menu item titled Downloads will be added to the menu bar after a download begins, where progress can be monitored and the file can be located, opened, or removed.'
