full_description = "Only 41% of Businesses Have Programs in Place to Hire More Women in Tech by Charley Nash December 16, 2024 New research from ISACA has revealed that the majority (87%) of IT professionals agree that there is a lack of gender diversity in the cybersecurity sector, yet less than half (41%) of businesses have programmes in place to hire more women. Whilst troublesome, these stats are not necessarily surprising. What's more, 74% of businesses noted that attracting and retaining talent is a challenge. The research by ISACA formed its latest Tech Workplace and Culture report,... Read moreDetails Community Corner: InClusive InCyber by Charley Nash September 26, 2024 Community is exceptionally important to the team at the IT Security Guru. We believe that building community and supporting one another is where our industry thrives, that’s why we’re platforming charities, initiatives and networks that work within the industry, as well as the wider community. One great example of this is the InClusive InCyber initiative run by the team at LT Harper, headed up by Aymun Lashari, the cyber recruitment organisation's Head of Community. What... Read moreDetails It’s Never Too Late: Transitioning to a Career in Cybersecurity by Michael Keddie September 23, 2024 Hello, London! I’ve always dreamed of saying that and now, thanks to the International Cyber Expo, I’m going to get to say it. I like to think that I’ll be the Liam Gallagher of cyber security panel discussions, except a good deal less shouty and fighty. So, when I think about it, nothing at all like the sharp ticket practice frontman. However, the discussion that I will be chairing will be, to a certain extent,... Read moreDetails Women in CyberSecurity (WiCyS) Announces 5th Annual Security Training Scholarship by Charley Nash August 7, 2024 Women in CyberSecurity (WiCyS) have announced the 5th annual Security Training Scholarship (STS) Program in partnership with the SANS Institute. This initiative, made