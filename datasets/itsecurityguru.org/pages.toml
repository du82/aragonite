full_description = "Tarlogic Discovers Security Flaw Allowing Eavesdropping on Private Conversations Via Bluetooth Headset Microphone February 28, 2025 SandboxAQ, MITRE, and The Linux Foundation are pleased to present RWPQC Real World Post Quantum Cryptography (RWPQC) 2025, the third annual conference dedicated to advancing cybersecurity in the post-quantum era. This year’s event will take place on March 24–25, 2025, at the National Palace of Culture in Sofia, Bulgaria. It will offer an essential platform for experts, researchers, and industry professionals to share insights and collaborate on securing cryptography against quantum threats. As an extension of the Real World Crypto (RWC) annual conference, RWPQC 2025 will convene leading experts, policymakers, and industry pioneers to explore the most pressing challenges in quantum-resistant encryption. The event will showcase groundbreaking research, practical applications, and strategic discussions shaping the future of cryptographic security. “Cyber resilience in the quantum era requires proactive planning and strategic investment,” said Dr. Marc Manzano, General Manager of the Cybersecurity Group at SandboxAQ. “SandboxAQ is committed to driving the advancement of modern cryptography management solutions. RWPQC 2025 reflects our dedication to fostering collaboration across industry, academia, and government to ensure a secure and resilient quantum future. This event provides a crucial platform to advance research, share best practices, and strengthen the cybersecurity ecosystem against the challenges posed by quantum computing. We remain committed to prioritizing cryptographic resilience across both public and private sectors.” The conference will feature top cybersecurity and quantum computing experts discussing the implications of post-quantum cryptography (PQC) and its regulatory and policy considerations. Representatives from major technology firms—including AWS, Cloudflare, Entrust, Google, IBM, Meta, and NVIDIA—will highlight their efforts to integrate PQC into their security frameworks. Industry panels will bring together financial institutions, consulting firms, and technology leaders to discuss their approaches to adopting quantum-safe solutions. Additionally, sessions will explore the transition to PQC across critical sectors such as banking, IoT, and large-scale digital infrastructures. A key component of RWPQC 2025 will be discussions on government and policy initiatives focused on global PQC implementation. Experts from the National Institute of Standards and Technology (NIST) will provide updates on PQC standardisation, while representatives from the National Security Agency (NSA) and the Cybersecurity and Infrastructure Security Agency (CISA) will outline the U.S. government’s strategic roadmap. European perspectives on PQC adoption will be presented by cybersecurity leaders from the UK, France, and Germany, alongside an overview of South Korea’s newly released PQC standards. The conference will also examine how the broader internet infrastructure is adapting to ensure quantum security in the digital age. “Cybersecurity innovation requires cross-industry collaboration, and RWPQC provides a unique opportunity to bring together the best minds in technology and policy,” said Dr. Wen Masters, Vice President of Cyber Technologies at MITRE. “As a trusted partner in securing national and global infrastructure and a founder of the Post-Quantum Cryptography Coalition, MITRE is proud to partner on RWPQC 2025 as we continue to engage with the worldwide cyber community on accelerating the adoption of post-quantum cryptography and safeguarding critical systems against emerging threats.” “Open-source collaboration is at the heart of innovation in cybersecurity, and The Linux Foundation is honoured to support the RWPQC,” said Hart Montgomery at The Linux Foundation. “As the industry prepares for a post-quantum era, it is critical that we work together to develop and deploy secure, open, and scalable cryptographic solutions. This event is important in uniting the community to build a future-proof cybersecurity framework that benefits everyone.” Why Attend? RWPQC 2025 presents a premier opportunity for decision-makers, engineers, and policymakers to engage in meaningful discussions, tackle pressing challenges, and contribute to the evolution of cryptographic security. Beyond technical exploration, the conference fosters cross-industry collaboration, equipping attendees with actionable insights and strategic guidance on PQC migration. Whether actively working on quantum-safe solutions or assessing their potential impact, participants will gain expert knowledge and essential connections to navigate this rapidly evolving landscape. Registration is now open. Secure your place today at https://rwpqc.org. FacebookTweetLinkedIn"
