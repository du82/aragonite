full_description = "Tarlogic Discovers Security Flaw Allowing Eavesdropping on Private Conversations Via Bluetooth Headset Microphone February 28, 2025 The cybersecurity industry is often seen as a field dominated by technical experts who’ve spent years honing their skills. However, a panel discussion hosted by Michael Keddie, Training Academy Team Leader at Pentest People at International Cyber Expo, sought to dispel the myth that it’s too late to start a career in this dynamic industry. Alongside him were Ian Nicholson, Head of Incident Response at Pentest People, Catherine Burn, Associate Director at LT Harper, and Greg Cooper, Security Consultant at Pentest People. Together, they shared their personal journeys and valuable insights on how to successfully transition into cybersecurity. It’s Never Too Late Michael Keddie opened the discussion by highlighting the many attractive aspects of cybersecurity for career changers, including challenging work, clear career progression, and a thriving job market. “There are strong pull factors that attract career changers to cybersecurity,” Keddie noted, pointing out that the field offers both intellectual stimulation and long-term job security. He also emphasised that while transitioning into cyber requires time, commitment, and financial investment, the payoff is significant. Keddie’s personal journey into cybersecurity was inspired by reading Ghost in the Wires by Kevin Mitnick, a legendary hacker. “It takes time, perseverance, and a budget,” he explained. “But it’s an enjoyable path to take, and once the transition is made, the future is bright with plenty of opportunities.” His advice to those considering a career switch? “Believe in yourself, go for it, but have a plan and stick to it.” He also stressed that many of the soft skills from previous careers, like communication, problem-solving, and teamwork—are just as crucial in cybersecurity as technical knowledge. “It’s surprising how many skills acquired in a previous career come in handy in cybersecurity,” Keddie added, noting that the field is far more collaborative and supportive than many people assume. Real-World Insights Ian Nicholson shared his unique experience of moving from firefighting to cybersecurity, a transition that took him a decade. He noted that while the financial rewards in cybersecurity are substantial, career changers must be prepared for the initial financial hit that comes with upskilling and training. “You have to plan long and big if you’re thinking of changing careers,” Nicholson said. Nicholson highlighted one of the early challenges newcomers face: learning the industry’s terminology and acronyms. “It can feel overwhelming at first,” he admitted, but with perseverance, it becomes second nature. His key message was to keep an eye on the bigger picture, understanding that the rewards, both personal and financial, will come with time. The Power of Passion and the Importance of Trust Catherine Burn emphasised the importance of having a growth mindset when entering the cybersecurity field. She advised that newcomers must stay up-to-date with trends and current cyber news, and think like someone on the front lines of defence. “Passion and a commitment to continuous learning are what make people stand out,” Burn noted. She also underscored that trust and honesty are essential in cybersecurity. “A good reputation goes a long way in this industry,” she said, advising that maintaining ethical standards is critical for long-term success. Soft Skills and Imposter Syndrome Greg Cooper reinforced the value of soft skills in today’s cybersecurity landscape. “The stereotype of pen testers sitting in dark rooms is outdated,” Cooper remarked. In today’s world, communication and teamwork are vital to success. Cooper also acknowledged the presence of imposter syndrome, especially for those entering the field later in life. “It never fully goes away, but you have to trust in yourself and your abilities,” he said. Cooper also saw cybersecurity as a future-proof career with endless opportunities for growth. “Because the cyber landscape is constantly changing, you can rapidly develop new skills,” he explained. For him, this dynamic nature of the industry was one of its biggest draws. Follow Your Passion and Take the Leap The panel concluded with one clear message for those considering a cybersecurity career: “Follow your passion and just do it.” Whether you’re inspired by the intellectual challenges, the rewarding job market, or the opportunity to make a meaningful impact, the panellists encouraged career changers to embrace the journey with confidence. Their stories prove that, with the right mindset, it’s never too late to break into cybersecurity. By leveraging your existing skills, continuously learning, and cultivating trust and passion, you can build a successful and rewarding career in this exciting and ever-evolving field. FacebookTweetLinkedIn"
