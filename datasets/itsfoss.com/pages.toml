["https://itsfoss.com/getting-started-with-markdown"]
title = "Learn to Use Markdown Syntax [Tutorial Series]"
description = "Learning markdown could help you a lot with writing for web. Here’s a complete beginner’s guide to Markdown syntax with downloadable cheat sheet."
full_description = "From code hosting websites like GitHub to note-taking tools like Joplin and Notion, Markdown is the integral part of the web writing. Knowing the basic Markdown syntax will help you write properly formatted and beautiful looking text on the web. With a good command over Markdown, you can amp up the README of your GitHub repository, speed up your writing on your favorite CMS among many other things.Here's a quick rundown of the Markdown syntax. .tg {border-collapse:collapse;border-spacing:0;} .tg td{border-color:black;border-style:solid;border-width:1px;font-family:Arial, sans-serif;font-size:14px; overflow:hidden;padding:10px 5px;word-break:normal;} .tg th{border-color:black;border-style:solid;border-width:1px;font-family:Arial, sans-serif;font-size:14px; font-weight:normal;overflow:hidden;padding:10px 5px;word-break:normal;} .tg .tg-0pky{border-color:inherit;text-align:left;vertical-align:top} Element Syntax Headings # Level 1 Heading## Level 2 Heading### Level 3 Heading Italic *text* or _text_ Bold **text** or __text__ Blockquote > or >> Links [Site Name](Site URL) Email address <email address> Images ![Alt Text](Path to Image) Ordered list 1. Item 12. Item 23. Item 3 Unordered list Use *, – or + ** Item 1* Item 2* Item 3 Sublist Use indentation1. Item 11. Sub-item 12. Sub-item 22. Item 23. Item 3 Inline Code `code` Code block ``` code here ``` Horizontal rules --- or *** The above table helps when you already know how to use the Markdown. If you are not familiar with it, no worries. I'll help you with that.The article below gives a summary of Markdown syntax with examples.Basic Markdown Syntax Explained [With Free Cheat Sheet]Learning markdown could help you a lot with writing for web. Here’s a complete beginner’s guide to Markdown syntax with downloadable cheat sheet.It's FOSSBill DyerWant even more information? This Markdown series goes into a little more detail on the essential Markdown syntax.Just follow the desired topic from the left sidebar section."
