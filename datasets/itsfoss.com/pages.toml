["https://itsfoss.com/i3-customization"]
title = "The Ultimate Guide to i3 Customization in Linux"
description = "Learn about customizing your system's look and feel with i3 window manager in this super-detailed guide."
full_description = '''You might have come across dope screenshots (especially via r/unixporn Subreddit), where users customize their desktops to their heart's desire and share it with the world. Linux lets you customize every aspect of your desktop experience, which is why it is possible.And, the result? Something that feels and looks way better than any Mac or Windows system.Just look at this 😌Image Credits: RedditDoes it look like a Linux Mint system? 😲But how can you achieve something like that? It is tough to customize the look of your Linux desktop.The answer to your questions lies in the window manager. If you can configure a window manager, you can customize the look.For this guide, I will walk you through a basic configuration you can do with the i3 window manager. It is one of the best window managers for Linux.💡"Rice" is a word commonly used to refer to making visual improvements and customizations on one's desktop.Via /r/unixpornThings you should know before following this guide:In this guide, I will use Arch Linux to demonstrate the steps, but you can use any of your preferred distros and have the same result.Remember, this guide will be a basic foundation for the i3 ricing.And here's the result of what you should expect after following this guide:(Click to enlarge image)📥To save you time, I have uploaded all the i3 config files related to the article on GitHub, with which you can achieve the final look of what we intend from this article.Download i3 Config FilesFirst, let's start with installing the i3 window manager.Install i3 Window Manager on LinuxFor Ubuntu/Debian base:sudo apt install xorg lightdm lightdm-gtk-greeter i3-wm i3lock i3status i3blocks dmenu terminatorFor Arch Linux:sudo pacman -S xorg lightdm lightdm-gtk-greeter i3-wm i3lock i3status i3blocks dmenu terminatorOnce you are done with the installation, enable the lightdm service using the following command:sudo systemctl enable lightdm.serviceAnd start the lightdm service:sudo systemctl start lightdm.serviceThat will start the lightdm greeter that will ask you to enter the password for your username.And if you have multiple desktop environments installed, you can choose i3 from the selection menu:Once you log in to your first i3 instance, it will ask you whether you want to create an i3 config file.Press Enter to create a new i3 config file:Click to enlarge the imageNext, it will ask you to choose between Win and Alt key, which should behave as mod key.I would recommend you go with the Win (or the Super) key as most of the users are already used to it for shortcuts:And your i3 window manager is ready to use. But before we jump to the customization part, let me walk you through how you can use the i3 in the first place.Keybindings of i3 Window Manager So let's start with the basics. The basic functionality of the window manager is to frame multiple windows horizontally and vertically, so you can monitor multiple processes simultaneously.And the result looks like this:You can do a lot more than this using the following keybindings: Keybiding Description Mod + Enter Open terminal. Mod + ← Focus left. Mod + → Focus right. Mod + ↑ Focus up. Mod + ↓ Focus down. Mod + Shift + ← Move the window to the left side. Mod + Shift + → Move the window to the right side. Mod + Shift + ↑ Move the window up. Mod + Shift + ↓ Move the window down. Mod + f Toggle the focused window to full-screen. Mod + v The next window will be placed vertically. Mod + h The next window will be placed horizontally. Mod + s Enables the stacked window layout. Mod + w Enables the tabbed window layout. Mod + Shift + Space Enables the floating window (for focused window). Mod + Left-mouse-click Drag the entire window using the mouse. Mod + 0-9 Switch to another workspace. Mod + Shift + 0-9 Move the window to another workspace. Mod + d Open the application launcher (D menu). Mod + Shift + q Kills the focused window. Mod + Shift + c Reloads the I3 config file. Mod + Shift + r Restart the I3 WM. Mod + Shift + e Exit I3 WM. I know an overwhelming number of keybindings are available, but if you practice them daily, you'll get used to them in no time.And if you are wondering, you can change the keybindings at your convenience, which I will share in the later part of this guide.Now, let's have a look at the configuration part.Enable AUR in Arch LinuxSo if you have a fresh installation of Arch Linux, you may not have enabled the AUR. This means you are missing out on the most crucial feature of the Arch.To enable the AUR, you'd need AUR to utilize the AUR package helper. Here, I will be using the yay. What is Arch User Repository (AUR)? How to Use AUR on Arch and Manjaro Linux?What is AUR in Arch Linux? How do I use AUR? Is it safe to use? This article explains it all.It's FOSSDimitriosFirst, install the git:sudo pacman -S gitNow, clone the yay repository and change your directory to yay:git clone https://aur.archlinux.org/yay-git.git && cd yayAnd finally, build the package:makepkg -siThere are some other AUR package helpers like Paru, so if you want to use something else apart from yay, you can proceed, or explore other options.Change resolution of i3 WMYou will face issues, especially if you are using a virtual machine for window manager where the display resolution may be locked at 1024x768, as is in my case.So you will have to execute the following command by specifying the desired display resolution:xrandr --output [Display_name] --mode [resolution]To find the name of the connected display, you will have to use the xrandr command in the following manner:xrandr | grep -w 'connected'In my case, it is Virtual-1.So if I want to change the resolution to 1920*1080, I will have to execute the following:xrandr --output Virtual-1 --mode 1920x1080But this will only work temporarily. To make it permanent, you will have to make changes in the i3 config file. First, open the config file:nano ~/.config/i3/configGo to the end of the file in nano by pressing Alt + / and use the following syntax to change the display resolution permanently:# Display Resolution exec_always xrandr --output [Display_name] --mode [Resolution]The result should look like this:Once done, save changes and exit from the nano text editor. Now, restart the i3 WM using the Mod + Shift + r to take effect from the changes you've made to the config file and that's it!Change wallpaper in the i3 Window manager By default, i3 will look dated, and you may want to switch back to your previous desktop environment.But by changing the wallpaper itself, you can start changing the whole vibe of the system.And there are various ways to change the wallpaper in i3, but here, I will be showing you how you can use the feh utility.First, let's start with the installation itself:For Arch-based distros:sudo pacman -S fehFor Ubuntu/Debian based-distros:sudo apt install fehOnce done, you can download your favorite wallpaper from the internet. Next, open the i3 config file:nano ~/.config/i3/configGo to the end of the file and use the feh command as mentioned:# Display Wallpaper exec_always feh --bg-fill /path/to/wallpaperIn my case, the wallpaper was in the Downloads directory, so my command would look like this:Save changes and exit from the nano text editor.To take effect from the changes you made to the config file, restart the i3 window manager using Mod + Shift + r.Mine looks like this:Customize i3 lock screen By default, if you want to lock the system, you will have to execute the following command:i3lock And the lock screen looks like this:So here, I will show you:How to create a custom shortcut to lock the i3 sessionHow to change the lock screen wallpaper To make the lock screen beautiful, you'd have to use the i3lock-color package.But first, you'd have to remove the existing i3lock as it will conflict with the i3lock-color:To remove it from Arch:sudo pacman -R i3lockFor Ubuntu/Debian users:sudo apt remove i3lockOnce done, you can install the i3lock-color using the AUR helper:yay i3lock-colorAnd if you're on an Ubuntu base, you'd have to build it from scratch. You can find detailed instructions on their GitHub page.Once you are done with the installation, let's create a new directory and make a new file to store the configuration for the lock screen:mkdir ~/.config/scripts && nano ~/.config/scripts/lockAnd paste the following file contents to define the lock screen styling:#!/bin/sh BLANK='#00000000' CLEAR='#ffffff22' DEFAULT='#00897bE6' TEXT='#00897bE6' WRONG='#880000bb' VERIFYING='#00564dE6' i3lock \ --insidever-color=$CLEAR \ --ringver-color=$VERIFYING \ \ --insidewrong-color=$CLEAR \ --ringwrong-color=$WRONG \ \ --inside-color=$BLANK \ --ring-color=$DEFAULT \ --line-color=$BLANK \ --separator-color=$DEFAULT \ \ --verif-color=$TEXT \ --wrong-color=$TEXT \ --time-color=$TEXT \ --date-color=$TEXT \ --layout-color=$TEXT \ --keyhl-color=$WRONG \ --bshl-color=$WRONG \ \ --screen 1 \ --blur 9 \ --clock \ --indicator \ --time-str="%H:%M:%S" \ --date-str="%A, %Y-%m-%d" \ --keylayout 1 \Save changes and exit from the text editor.📋You can find a variety of bash scripts online for different i3 lock screen styles. This is just an example, which should be a minimal option for most.Now, make this file executable using the chmod command:sudo chmod +x .config/scripts/lockNext, you'd have to introduce some changes to the config file to add the path to this config file to make it work.Furthermore, here's where I will show you how you can use the custom keyboard shortcut for the lock screen.First, open the config file:nano ~/.config/i3/configJump to the end of the line using Alt + / and paste the following lines:# Shortcut for Lockscreen bindsym $mod+x exec /home/$USER/.config/scripts/lockIn the above, I have used mod + x as a shortcut to lock the screen, you can use any of your preferred ones.And the end would look like this:Pretty neat. Isn't it?Change theme and icons in the i3 Window managerI know what you might be thinking. Why would you need icons in the first place? But you don't need only to be using CLI tools with the window manager.There are times when opting for GUI is more convenient, such as using a file manager. So, when dealing with such utilities, you want to make it look better (and prettier?)So in this section, I will show you:How to change the theme in i3How to change the icons in i3Let's start with the installation of the theme.Here, I will be using the materia-gtk-theme and papirus icons. But you can use any of your preferred ones.To install the theme in Arch, use the following:sudo pacman -S materia-gtk-theme papirus-icon-themeFor Ubuntu/Debian base:sudo apt install materia-gtk-theme papirus-icon-themeBut installing won't get the job done. You'd have to apply the theme as you use the GNOME tweaks to change the theme.In i3, you can use the lxappearance utility to change the theme and icons. To install lxappearance in Arch, use the following:sudo pacman -S lxappearanceFor Ubuntu/Debian base:sudo apt install lxappearanceOnce you are done with the installation, start the dmenu using Mod + d and type lxappearance, and hit enter on the first result.Here, choose the theme of your liking. I'm going with the Materia-dark here.Select the theme and click on the apply button to apply the changes:Similarly, to change the icon, select the Icon Theme, choose the icon theme and hit the apply button:After applying the theme and icons, my file manager looks like this:Set icons for workspaces in the i3 window managerBy default, the workspaces are indicated by numbers only, which is not the most ideal way you want to use the workspace.So in this section, I will walk you through how you can change the name of the workspaces with appropriate icons.To use the icons in the config file, first, you will have to install new fonts named Awesome:For Arch-based distros:sudo pacman -S ttf-font-awesomeFor Ubuntu/Debian base:sudo apt install fonts-font-awesomeOnce done, open the i3 config file:nano ~/.config/i3/configIn this config file, look for the workspace section where you will be given variables for each workspace:In this section, you must interchange the number given to the workspace with what you want to name it. I will be naming it as programs as in the later part of this tutorial, I will show how you can allocate the specific workspace to the specific application. I mostly use the first 5 workspaces, so I will name them accordingly:# Define names for default workspaces for which we configure key bindings later on. # We use variables to avoid repeating the names in multiple places. set $ws1 "1: Terminal" set $ws2 "2: Firefox" set $ws3 "3: VMWare" set $ws4 "4: Spotify" set $ws5 "5: Shutter" set $ws6 "6" set $ws7 "7" set $ws8 "8" set $ws9 "9" set $ws10 "10" Now let's add the icons for each application mentioned in the config file.You can refer to the cheatsheet of the awesome font to find the appropriate icon.Copy and paste the icons in front of the name: # Define names for default workspaces for which we configure key bindings later> # We use variables to avoid repeating the names in multiple places. set $ws1 "1: Terminal" set $ws2 "2: Firefox" set $ws3 "3: VMWare" set $ws4 "4: Spotify" set $ws5 "5: Shutter" set $ws6 "6" set $ws7 "7" set $ws8 "8" set $ws9 "9" set $ws10 "10"Don't worry if it looks horrific!Once done, exit i3 using the Mod + e and log back in again to take effect from the changes you've just made.Mine looks like this:Do fonts look too small? It's time to address this!Change the font of the title window and bar in the i3 First, let's install new fonts. (I will be using Ubuntu fonts here).To install the Ubuntu fonts in Arch, use the following:sudo pacman -S ttf-ubuntu-font-familyAnd if you are on Ubuntu, you already have them installed!Once done, open the config file:nano ~/.config/i3/configIn the config file, look for the font pango:monospace 8 line as this is the default font.Once you find that line, add the name of the font and size as shown:font pango:Ubuntu Regular 14Now, restart the window manager using the Mod + Shift + r and that should do the job:Click to enlarge imageAllocate applications to workspaces in the i3 window manager After naming the workspaces, you will want to allocate specific software to that workspace.Such as, if I named my second workspace Firefox then I would want to use Firefox only inside that workspace.So how do you do that?To do so, you must find the name of the class of each application you want to allocate.Sounds complex? Let me tell you how to do so.First, run start the application and terminal side by side. For example, here, I opened the Firefox and terminal side by side:Now, execute the xprop command in the terminal, and it will change the cursor shape:xpropNext, hover the cursor on the application and click anywhere inside the application window as shown:The class name will be found in the last sting of characters in the following line:WM_CLASS(STRING) = "Navigator", "firefox"In my case, the class name for the Firefox browser '''
