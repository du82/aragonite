["https://itu.int/160-anniversary"]
title = "ITU 160th anniversary"
description = "As ITU celebrates its 160th anniversary in 2025, we are seizing this moment to shape a better digital future for all. During this anniversary year, we'll be engaging with all stakeholders on how to connect the unconnected, fast-track sustainable digital development, and empower people to use digital technologies to drive meaningful change."
full_description = "ITU 160: Technology for all and for good From the phone in your hand to the satellites in the sky, ITU – the UN agency for digital technologies – is at the heart of international cooperation that brings the benefits of technology to people everywhere. As ITU observes its 160th anniversary in 2025, we are seizing this moment to shape a better digital future for all. During this anniversary year, we’ll be engaging with all stakeholders on how to connect the unconnected, fast-track sustainable digital development, and empower people to use digital technologies to drive meaningful change. Our story The story of the International Telecommunication Union (ITU) is one of international cooperation among governments, companies, academia, and other organizations involved with communications or digital technologies. ITU plays a vital role at every stage of global communications development, ensuring increasing numbers of people benefit from access to global networks, technologies, and services. Learn more Our vision for the digital future Digital technologies are transforming societies and economies worldwide. From the rise of the Internet to AI and quantum technologies, ITU is committed to ensuring that these advancements benefit everyone, everywhere. As we mark our 160th Anniversary, we’re focused on building a safer, more affordable, accessible, sustainable, resilient, and inclusive digital future for all. Learn more Celebrate with us Join us in observing 160 years of advancing global connectivity and fostering international cooperation. This is not only a milestone for ITU, but a commemoration of the shared progress we’ve made in creating a connected, inclusive world. Be part of our journey through events, interactive experiences, and commemorative initiatives that will bring together individuals, communities, and organizations from around the globe. Learn more World Telecommunication & Information Society Day 2025 On May 17, join us in spotlighting gender equality in digital transformation and efforts to bridge the gender digital divide. Learn more"
year_published = 2024
year_updated = 2025
clearnet = "https://itu.int/160-anniversary"
tags = ["160:", "agency", "benefits", "brings", "celebrate", "cooperation", "digital", "everywhere.", "future", "hand"]
language = "en"
