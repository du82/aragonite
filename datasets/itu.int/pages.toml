["https://itu.int/en/Pages/accessibility.aspx"]
title = "Accessibility"
full_description = "​​ITU web accessibility statementThis accessibility statement applies to itu.int web pages and sub-domains. These pages are run by the International Telecommunication Union (ITU). We want as many people as possible to be able to use this website, including persons with disabilities, persons with specific needs and people with technological limitations. We understand that older web pages branded as below may not meet fully the Web Content Accessibility Guidelines version 2.1 AA standards on accessibility. We are continuously working to improve the accessibility of our website, focusing on all web content created on our new web platform in the OneITU design, as below: We aim for the website to comply with the Web Content Accessibility Guidelines version 2.1 AA standard. In early 2022, ITU staff working on the ITU website in content, design, development and project management took part in a series of targeted training sessions on improving the accessibility of the website and communication products on the website. We are continuing to raise awareness and share guidelines throughout ITU. This statement was prepared on 25 May 2022.​ It was last updated on 14 June and is reviewed every six months. This website was last tested in March 2022. We tested a sample of new webpages created on the new platform and in the new design: the homepage, news and membership pages. If you would like to help us make the website more accessible or have any further suggestions, please let us know at webaccessibility@itu.int. More on ITU and accessibility: Accessibility to ICTs: Achieving equitable communications for everyone (itu.int)."
year_published = 2025
