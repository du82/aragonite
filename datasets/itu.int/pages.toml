["https://itu.int/en/ITU-R"]
title = "ITU Radiocommunication Sector"
full_description = "​​​​​​​​​​​​​​​The 2024 edition of the ITU Radio Regulations that govern the global use of the radio-frequency spectrum and satellite orbits is now available online in all six official UN languages! The RR5 TFA stand-alone software provides a mechanism to electronically use, query and analyse the Table of Frequency Allocations International coordination, notification and recording procedures for space systems and earth stations and examination of frequency assignment notices submitted by Administrations (Membership) for inclusion in the Master International Frequency Register (MIFR). International coordination, notification and recording procedures for terrestrial systems and examination of frequency assignment notices submitted by Adminis- trations (Membership) for inclusion in the Master International Frequency Register (MIFR) and Plans. Application of administrative procedures dealing with allocation of international means of identification (call sign series, MIDs) and with safety of life, processing submissions for various service publications and corresponding online information systems. Over 5000 specialists from telecommunication and ICT organizations and administrations throughout the world, participate in the Radiocommunication Study Groups to prepare technical bases for Radiocommunication Conferences, develop ITU-R Recommendations (radiocommunication standards) and Reports and compile radiocommunication Handbooks. The Radio Regulations (RR) incorporates the decisions of the World Radiocomm​unication Conferences (WRCs), including all Appendices, Resolutions, Recommen- dations and ITU-R Recommendatio​ns incorporated by reference. The Rules of Procedure are approved by the Radio Regulations Board (RRB). They complement the RR by providing clarification of the application of particular Regulations or establishing the necessary practical procedures that may not be provided for in the current Regulatory Procedures."
year_published = 2025
