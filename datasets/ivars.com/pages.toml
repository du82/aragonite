["https://ivars.com/salmon-house"]
title = "Salmon House — Ivar's"
full_description = "Scroll Salmon House MenusLocation & ParkingGroup Dining Links below open new tabsReservationsBOOK NOW﻿ Takeout or DeliveryORDER NOW 401 NE Northlake Way | Lake UnionSunday - Thursday 11 am-8 pmFriday & Saturday: 11 am-9 pmHappy Hour: Daily 3:00 pm-6:00 pm Originally, Ivar had plans to build a floating restaurant overlooking Lake Union, but after the City of Seattle rejected architect John Adam's design, he built an Adams-designed Indian longhouse on shore instead. In 1971, largely based on the interior of the Salmon House, the Seattle Historical Society gave Haglund and Adams its Award of Merit for historical contributions to Seattle.When you visit, you will find a beautiful cedar replica of a Northwest Native American Longhouse, complete with an open-pit Native American-style barbecue for preparing succulent alder-smoked dishes. Here, in a dining setting filled with Northwest native art, décor and historical photographs, you'll enjoy memorable meals surrounded by spectacular views of boats cruising Lake Union and Seattle’s skyline.Favorite daily entrees and fresh-sheet selections include alder-smoked salmon, prawns, alder-smoked chicken, and seasonal seafood specials. The outdoor Fish Bar offers casual lakeside dining or quick take-out food.To pick up food by boat, we offer a dock to tie up for a quick grab and go. Order ahead to get your fish even faster! Overlooking Downtown SeattleLake Union ADDRESS:401 NE Northlake Way(206) 632-0767PARKING:During business hours, guest parking lots can be found on premises or directly across the street from the restaurant. Street parking is also available, as well as a boat dock for to-go orders.CONTACT:webmail@keepclam.com Address & ParkingSalmon House Dining Room and Whalemaker Lounge Ready to Eat?Reservations Find A Table —Group Dining Request Info Salmon house Photo Salmon House About Salmon House Locations Photo Salmon House Map Salmon House Chef Bio New Gallery Reservations & Groups"
