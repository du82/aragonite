["https://ivars.com/pressteacher-2018"]
title = "Press-Teacher 2018 — Ivar's"
full_description = '''Press Room Return to Press Room View fullsize Teacher of the Year Winner 2018 HaLee Webster Earns Top Marks as Ivar's "Teacher of the Year"For the past 15 years, Ivar’s Restaurants has called on Washington state students to submit reasons why their classroom leader should be recognized as “Teacher of the Year,” and every year hundreds of entries pour in telling inspiring tales of creative teaching and mentoring. This year was no exception – Ivar’s is pleased to announce HaLee Webster of Crestwood Elementary as the grand prize winner of the Teacher of the Year award.Recently, Mrs. Webster was presented with her winning prize package: a $500 check to put toward the purchase of class supplies, a commemorative plaque and the official title of “Teacher of the Year.” Plus, the nominating student received an Ivar’s Kids Meal – including a visit by Ivar’s famous Dancing Clam – for every student in her class.Fifth grade student Aly Skagen nominated Mrs. HaLee Webster for her ability to make learning fun by showing her students how lessons on taxes, area and perimeter and more can be applied in life with real-life examples. Mrs. Webster also knows when students need a little extra help with a particular subject and spends quality one-on-one time with each until they understand completely, which Skagen contributes to her good grades. She believes the class feels like family.Ivar’s also awarded two teachers first-place prizes, each receiving a $150 gift card for class supplies:Ivar’s first place winners:• Kelli Munro: Fifth Grade, Coe Elementary (Seattle)• Kristina Brown: Sixth Grade, Terrace Park School (Edmonds)Fifteen teachers also received second place honors which included a $25 Ivar’s gift card.Ivar’s second place winners:• Nadia Jessa, Fifth Grade, Cherry Crest Elementary (Bellevue)• Jessica Leuthold, Kindergarten, Brookdale Elementary (Tacoma)e)• Maria Chavez, Second Grade, Lake Grove Elementary (Federal Way)• Timmi Harrop, Kindergarten, Adams Elementary (Seattle)• Bradley Dean Proffit, Eighth Grade, Madrona K-8 (Edmonds)• Amy Huyser, First Grade, Sawyer Woods Elementary (Kent)• Kristopher Hamper, Fourth Grade, Mukilteo Elementary (Mukilteo)• Craig Arango, Fifth Grade, Bryant Elementary (Seattle)• Heid Hickman, Learning Assistance Program, Pope Elementary (Puyallup)• Richard Musser, Second Grade, Hazel Wolf K-8 (Seattle)• Laura Stafki, Third Grade, Minter Creek Elementary (Gig Harbor)• Kim Majors, Second Grade, Highland Elementary (Lake Stevens)• Denise Cahill, Third/Fourth Grades, Maple Valley Elementary (Renton)• Brian Sherrill, Fourth Grade, Carriage Crest Elementary (Kent)• Aubree Bixman, Fourth/Fifth Grades, McDonald International School (Seattle)About Ivar’s Ivar’s Seafood Restaurants began on Seattle's waterfront in 1938. Today, there are 21 Ivar's fast casual Seafood Bars and three full-service restaurants: Ivar's Acres of Clams, Ivar's Salmon House and Ivar's Mukilteo Landing. Ivar's Seafood, Soup and Sauce Company markets and sells its award-winning soups, chowders and sauces both nationally and internationally. The company also operates regional stadium concessions including Safeco Field, CenturyLink Field, Husky Stadium and Cheney Stadium. Learn more at www.Ivars.com or Follow Ivar’s on Facebook, Twitter or Instagram.* * * * *'''
