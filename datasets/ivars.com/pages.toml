title = "Group Dining — Ivar's"
full_description = '''Scroll Group Dining A Room for Any OccasionIvar's restaurants in Seattle and Mukilteo offer unsurpassed 180º views of Lake Union, Elliott Bay, or Possession Sound. These stunning views set the stage for spectacular private dining events, accommodating guest lists from 20 to 150 and serving Northwest and Alaska seafood, as well as local specialties. Our professional event planners are happy to assist you with your every need and will make your planning fun and easy. Take A Virtual Tour > Overlooking Elliott Bay, the Kalakala Room puts one of the most sought after views in Seattle directly in your hands. Featuring private space for up to 120, you and your guests will enjoy the wall-to-wall window which frames our striking views of Elliott Bay and the Washington State Ferries. The private dining room offers accordion bay windows which can be exposed for opening air dining. Or, guests can opt for a warmer option with the private expansive fireplace. RATES & AVAILABILITY: acresbanquets@keepclam.com | 206-624-6852 View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5e13a2dab276bd1e787dfcd1/1630618589533-LG5YATQ74JF4P5ZO976P/Kalakala.jpg" alt="Kalakala Room" /> Kalakala Room View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5e13a2dab276bd1e787dfcd1/1636404897787-YHR5JZUAVTVLBC8F5356/Kalakala2.jpg" alt="Kalakala Room: Meeting Setup" /> Kalakala Room: Meeting Setup View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5e13a2dab276bd1e787dfcd1/1636405070390-MO9RXK05P3SYU19CQ9MU/Kalakala3.jpg" alt="Kalakala Room: A/V Ready" /> Kalakala Room: A/V Ready #block-yui_3_17_2_1_1630617992745_104871 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1630617992745_104871 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } PDF LAYOUTS:Potlatch RoomChinook RoomNisqually RoomQuinault RoomNooksack RoomTake A Virtual Tour > Soaring 16 foot ceilings, stunning Native American artwork and panoramic views of Lake Union and the Seattle skyline will set the stage for your private event at Ivar's Salmon House on Lake Union. Whether it's daytime or evening, the best views are abundant from this glorious space that sits on the north shore of the lake. Our private rooms' exposed cedar walls and ambient lighting create a warm and welcoming atmosphere where you can wine and dine your closest friends and family, business associates, or distinguished visitors from around the world.RATES & AVAILABILITY: SHBanquets@keepclam.com | 206-632-0767 View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5e13a2dab276bd1e787dfcd1/1630620626766-EX2CXKJCM1TSWCY26SBH/Potlach.jpg" alt="Potlatch Room" /> Potlatch Room View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5e13a2dab276bd1e787dfcd1/1630620633230-ZHOF81R5ICILLEI1B0KP/Chinook.jpg" alt="Chinook Room" /> Chinook Room View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5e13a2dab276bd1e787dfcd1/1630620641962-2X9MEYZOAQWP1KC5F9R2/Nisqually.jpg" alt="Nisqually Room" /> Nisqually Room View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5e13a2dab276bd1e787dfcd1/1630620645528-MPZC5WL8BP5BKTNSXFA1/Quinault.jpg" alt="Quinault Room" /> Quinault Room View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5e13a2dab276bd1e787dfcd1/1630620648854-3NRP5E2VN7M7GUXR1XIC/Nooksack.jpg" alt="Nooksack Room" /> Nooksack Room #block-c36fadd93220de68c106 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-c36fadd93220de68c106 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } PDF LAYOUTS:Fireside RoomTake A Virtual Tour > Located on the shores of Possession Sound, the private Fireside Room at Mukilteo Landing features unsurpassed views of the Olympic Mountains, Whidbey Island, and the Washington State Ferries. Just a short ride from Seattle, the ferry docks only a few feet from your seats as you enjoy the view. Our large gas-lit fireplace acts as the focal point of the room, enhancing the cozy atmosphere of this warm and inviting space. It is perfect for small conferences, working lunches and dinners or intimate family gatherings and receptions.RATES & AVAILABILITY: mukilteobanquets@keepclam.com | 425-742-6180 View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5e13a2dab276bd1e787dfcd1/1630682566623-FHC7RS7O7Z6HPAALZZFX/FiresideRoom.jpg" alt="Fireside Room" /> Fireside Room #block-6999e8d9f91eb26c9a28 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-6999e8d9f91eb26c9a28 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } Group Dining Photo Group Dining Intro Acres of Clams Group Dining Salmon House Group Dining Mukilteo Landing Group Dining'''
