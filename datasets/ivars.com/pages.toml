title = "Ivar's"
description = """
Ivar's is a seafood chain in Seattle, WA, serving the finest wild caught 
Northwest seafood since 1938 from 3 full serve restaurants and 18 quick 
serve locations in the Puget Sound region"""
full_description = '''Scroll <img src="https://images.squarespace-cdn.com/content/v1/5e13a2dab276bd1e787dfcd1/1740767749339-S1TVX7SMP3VTVVK6ZENS/SoupSaleHeaderImage2500x1258-03-25.jpg" alt="SoupSaleHeaderImage2500x1258-03-25.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5e13a2dab276bd1e787dfcd1/1738427826473-POSULWQ4OKYEP115G1ZB/MardiGrasParty2500x1258-25.jpg" alt="MardiGrasParty2500x1258-25.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5e13a2dab276bd1e787dfcd1/1740501430658-6UY6SWIRUAQTY93S87LE/ivars120-daySlider2500x1258.jpg" alt="ivars120-daySlider2500x1258.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5e13a2dab276bd1e787dfcd1/1740782872006-FOYCE0QP3NTACUHF25G7/Group-Dining2500x1258.jpg" alt="Group-Dining2500x1258.jpg" /> Our Flounder, Ivar Haglund Ivar’s calls the Pacific Northwest homeFrom its early beginnings — with Ivar Haglund selling fish ‘n chips on Seattle's waterfront in 1938 — to today, Ivar’s has winged its way to Marysville and Tacoma, plus a few clam beds in between. The Ivar’s dining experience offers 18 fast casual Seafood Bars and three full-service waterfront-view restaurants: Ivar's Acres of Clams, Ivar's Salmon House, and Ivar's Mukilteo Landing. Ivar's also operates stadium concessions in T-Mobile Park, Lumen Field, Cheney Stadium, and Husky Stadium. No matter which restaurant you choose, you’ll find the award-winning Ivar’s seafood you love. View fullsize Acres of Clams On Pier 54 of Seattle’s historic waterfront, our flagship is where it all began in 1938MenusInformationReservationsGroup Dining View fullsize Salmon House Our Northwest Native-American Longhouse with views of Lake Union and Seattle skylineMenusInformationReservationsGroup Dining View fullsize Mukilteo Landing On the shores of Possession Sound just down from the ferry dock in historic MukilteoMenusInformationReservationsGroup Dining View fullsize Seafood Bars Our casual quick serve restaurants with 18 locations throughout the Pacific NorthwestMenusLocationsInformationAwards View fullsize Stadium Locations Stadium locations in Lumen Field, T-Mobile Park, Husky Stadium and Cheney StadiumInformationLocations “Keep Clam!”Ivar Haglund | Flounder Our StoryThe Northwest dining legacy that is Ivar’s began in 1938 with one very entrepreneurial spirit, the late Ivar Haglund. His future in music and entertaining took a slight detour when his waterfront aquarium needed a vendor to feed its guests. Using his own classic Northwest seafood recipes, Ivar’s was born. This dining destination has since spawned many more restaurants to delight future generations. Click the link below to read about the beginnings of our “flounder” as a restaurateur and his wacky promotional antics.More History Ivar Haglund Ready to Eat?Reservations Find a Table —Group Dining MORE Info About Intro Locations Keep Clam! Our Story Intro Reservations & Groups'''
