["https://ivars.com/our-fish"]
title = "Our Fish — Ivar's"
full_description = 'Scroll Our Fish Click HERE for PDF (opens in new tab). Our PartnersResources Northwest WildIvar’s serves wild caught fish from sustainable fisheries ranging from the Pacific Northwest to Alaska. Salmon from the Copper, Yukon and Taku rivers in Alaska are some of the highest quality in the world. Long migrations through these icy waters result in fish that are rich and flavorful, loaded with healthy Omega 3s. Troll caught salmon and halibut come from the pristine waters off Alaska’s rugged 34,000-mile coastline. Washington State offers salmon from the Columbia and Quinault Rivers, as well as troll caught salmon from Neah Bay. Our Partners View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5e13a2dab276bd1e787dfcd1/1583448229162-L994MPDGYYZ66LWHWEA1/AlaskaLeaderSeafoodsLogo.jpg" alt="Alaskan Leader Seafoods" /> Alaskan Leader Seafoods View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5e13a2dab276bd1e787dfcd1/1583448359710-J7QFPGTG4QYXPQWC2O5C/AmericanSeafoodsLogo.jpg" alt="American Seafoods" /> American Seafoods View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5e13a2dab276bd1e787dfcd1/1583448234946-Z1VEB8AK5VTCEUMEUWRN/PennCoveShellfishLogo.jpg" alt="Penn Cove Shellfish" /> Penn Cove Shellfish View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5e13a2dab276bd1e787dfcd1/1583448229536-ESUQ84ZGQGP89PWC2HQY/DraperValleyFarmsLogo.jpg" alt="Draper Valley Farms" /> Draper Valley Farms View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5e13a2dab276bd1e787dfcd1/1583448230620-D3C56TYA8R5BO09OTC7W/EssentialBakingLogo.jpg" alt="Essential Baking Co." /> Essential Baking Co. #block-yui_3_17_2_1_1583448187594_5697 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1583448187594_5697 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } Resources Links below open in 