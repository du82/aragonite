["https://ivars.com/mukilteo-landing"]
title = "Mukilteo Landing — Ivar's"
full_description = "Scroll Mukilteo Landing MenusLocation & ParkingGroup DiningChef Bio Links below open new tabsReservationsBOOK NOW Takeout or DeliveryORDER NOW 710 Front St. | Mukilteo Ferry DockSunday - Thursday: 11 am-8 pmFriday & Saturday: 11 am-9 pmHappy Hour: Daily 3 pm-6 pmLate night happy hour: Friday & Saturday 8-9 pm Ivar’s Mukilteo Landing is pleasantly situated on Possession Sound featuring breathtaking views of the North Puget Sound, with front row seats to watch ferries come and go. Whether dining for lunch or dinner, be sure to enjoy a mouth-watering selection of expertly prepared Northwest seafood specialties, as well as a wide variety of Ivar’s famous original recipe entrées that have made us famous since 1938. We also feature a lively bar in the Boathouse II Lounge, waterfront deck dining (open during the summer), plus a quick and delicious take-out service located at the outdoor Fish Bar.Private dining options are also available in the Fireside Room, featuring unsurpassed views of the Olympic Mountains, Whidbey Island, and the Washington State Ferries, with the ferry docks only a few feet from your seats. It is perfect for small conferences, working lunches and dinners or intimate family gatherings and receptions. Overlooking Possession SoundMukilteo Waterfront ADDRESS:710 Front St. Mukilteo, WA(425) 742-6180PARKING:Ivar’s Mukilteo Landing has a parking lot east from the restaurant, across the street, in addition to metered street parking.CONTACT:webmail@keepclam.com Address & ParkingMukilteo Landing Dining Room and Boathouse II Lounge Mukilteo Landing Executive Chef Derrell Mullin Derrell MullinExecutive Chef | Ivar's Mukilteo LandingDerrell found his passion for food early in life by learning how to cook with his father. While still in high school he assisted in opening Kidd Valley in North Seattle, later transitioning to food manufacturing. He found his way back to restaurants working in various positions, learning the ins and outs of the back-of-house operations, where he quickly rose through the ranks.He soon landed a Sous Chef position with Eurest at Boeing in Everett WA, where he managed over 100 associates who prepared food for over 8,000 customers daily, as well as delivering 100 catered events each day on average. He was then promoted to Executive Chef, overseeing food production at Boeing’s Everett, WA plant, fully enjoying his time there and all the clients he worked with.Pursuing his dream job of becoming an Executive Chef at a fine dining establishment, Derrell accepted a position under Chef Craig Breeden at Ivar’s Mukilteo Landing. His passion for food, creativity and happy-as-a-clam attitude helped to land him in the role of Executive Chef when Craig stepped down. Ready to Eat?Reservations Find A Table —Group Dining Request Info Mukilteo Landing Photo Mukilteo Landing About Mukilteo Landing Photo Mukilteo Landing Map Mukilteo Landing Chef Bio New Gallery Reservations & Groups"
