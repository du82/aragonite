["https://ivars.com/our-story"]
title = "Our Story — Ivar's"
full_description = '''Scroll Our Story View fullsize Our Flounder, Ivar Haglund TelevisionPrintAwardsOur FishOur PartnersResources Ivar HaglundIvar Haglund was a true Seattle character and icon. He was known as an entertainer, folksinger, restaurateur and ultimately the "King," "Mayor," or "Patriarch" of the waterfront. The story of Ivar's Seafood Restaurants began in 1938 when 33-year old Seattle native Ivar Haglund opened his city's first aquarium on Seattle's Pier 54. Droves of people lined up and paid a nickel to view the sea life that Ivar had collected from the surrounding Puget Sound. Noticing that his patrons often came with an appetite, Haglund began to sell red clam chowder and fish n' chips from the site—an instant success that began his career as a restaurateur.The Norwegian/Swede Haglund, locally known as a folksinger before a fish 'n chips purveyor, spread the word about his aquarium and seafood bar by performing in educational and entertainment programs at nearby schools. He also staged a number of attention grabbing spectacles, such as octopus wrestling and clam eating contests on the Seattle waterfront.He worked his way into the hearts of many, using his endearing and self-deprecating humor to make guests feel at home. His unparalleled love of Seattle shone though at all times. Through the years, he supported many local causes, so much so that the city asked him to take on the local Independence Day fireworks show for Seattle. He knew the value of advertising and public relations and relished in it. He was a regular on KJR and KIRO radio stations, as well as the Captain Puget show on channel 4. He coordinated numerous stunts, including the syrup spill/pancake feed on the rail tracks, strolling to Frederick and Nelson's department store with Patsy his seal, and created a Clam Stamp that US Postal Inspectors didn't think so humorous.He had a knack for pushing the civil boundaries. Ivar loved a good controversy over the mundane elements of life that government leaders attempted to control. When a bureaucrat told him "no", he just went ahead with reckless abandon and what he deemed Seattle spirit. For instance, Ivar hung his beloved Salmon Sock on the Smith Tower (one of Seattle's tallest structures that he owned at the time). When he wanted to use a barge for his outdoor dining at Ivar's Salmon House, he simply snuck it through Lake Union in the middle of the night. He also ran on a lark in the Port Commissioner race and much to his surprise, won!In 1985, just shy of his 80th birthday, Ivar Haglund passed away. He was posthumously voted by the public as "the person who best exemplified Seattle. A group of longtime friends commissioned a statue to honor him and placed it on historic Pier 54, next to his first restaurant, Ivar's Acres of Clams. They stated "Ivar showed us that Seattle was, and still is the jewel of the Northwest. Everyone was entertained by his quips and irreverence. And to this day, his motto KEEP CLAM lives on."You can read more about Ivar at History Link Television Come On Home To Ivar’sDances with ClamsChariots of ClamsRapping FishermenUnderwater Billboards Family AdventuresGirls Night OutMattress SurpriseChefzotic SurpriseLawyer Surprise More Videos Print View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5e13a2dab276bd1e787dfcd1/1582239568695-VJ0JEY0Y6957LDS9K765/KJR-Ad1942.jpg" alt="Strummin' Ad 1942" /> Strummin' Ad 1942 View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5e13a2dab276bd1e787dfcd1/1582238029086-G7FS8PUDPO9F1D5X8MBS/AcresCartoon.jpg" alt="Acres of Clams Comic" /> Acres of Clams Comic View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5e13a2dab276bd1e787dfcd1/1582238048426-PGMXA0ZAECY5I8YC39QP/CaptainsTableAd10-28-60.jpg" alt="Captain's Table Ad 1960" /> Captain's Table Ad 1960 View fullsize <img src="https://images.squarespace-cdn.com/content/v1/5e13a2dab276bd1e787dfcd1/1582238068146-1OUB6035GAIP74YL52VX/CaptainsTableAd1