["https://ivars.com/corporate-giving"]
title = "Corporate Giving — Ivar's"
full_description = "Corporate Giving PolicyThank you for including Ivar’s Restaurants as part of your fundraising effortsWe believe strongly in giving back to communities that have supported our restaurants and been our guests since 1938. The concerns we support are those that are important to those guests and to our employees. Ivar’s directs the donation of clam chowder and gift certificates to local food banks and community programs that promote the diversity, education, the environment, the welfare of children, and medical outreach, support, and research.To be eligible for contributions, organizations must:Qualify for non-profit status under the Internal Revenue CodeBenefit the communities where Ivar’s restaurants are locatedBe submitted on the organization’s official letterheadUnfortunately, we cannot contribute or offer support to:Funds for individualsProjects of political natureBeauty pageant participantsClass ReunionsTeam or individual sponsorships or competitionsFinancial supportIf your organization or program meets the eligibility requirements, please submit it in writing.A description of the event including purpose and objectivesDate of eventWhat you would like Ivar’s to contributeContact name and information, including return mailing address and phone numbersThe community you serveThe goal your event is trying to reachAll requests are reviewed on a monthly basis and responded to approximately 60 days in advance of the event.All responses will be in writing.Donations are made in the form of gift cards or products. The gift cards are valid at all Ivar’s restaurants and Kidd Valley hamburger locations with the exception of those located in sporting venues. They cannot be redeemed for cash.Submit all information and inquiries to:Ivar’s, Inc.1109 1st Avenue, Suite 350Seattle, WA 98101FAX: (206) 624-4895Or by email:Bonnies@keepclam.comNo phone calls please."
