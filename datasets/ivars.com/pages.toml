["https://ivars.com/locations-1"]
title = "Locations — Ivar's"
full_description = "Our Flounder, Ivar Haglund Ivar’s calls the Pacific Northwest homeFrom its early beginnings — with Ivar Haglund selling fish ‘n chips on Seattle's waterfront in 1938 — to today, Ivar’s has winged its way to Marysville and Tacoma, plus a few clam beds in between. The Ivar’s dining experience offers 18 fast casual Seafood Bars and three full-service waterfront-view restaurants: Ivar's Acres of Clams, Ivar's Salmon House, and Ivar's Mukilteo Landing. Ivar's also operates stadium concessions in T-Mobile Park, Lumen Field, Cheney Stadium, and Husky Stadium. No matter which restaurant you choose, you’ll find the award-winning Ivar’s seafood you love. View fullsize Acres of Clams On Pier 54 of Seattle’s historic waterfront, our flagship is where it all began in 1938MenusInformationReservationsGroup Dining View fullsize Salmon House Our Northwest Native-American Longhouse with views of Lake Union and Seattle skylineMenusInformationReservationsGroup Dining View fullsize Mukilteo Landing On the shores of Possession Sound just down from the ferry dock in historic MukilteoMenusInformationReservationsGroup Dining View fullsize Seafood Bars Our casual quick serve restaurants with 18 locations throughout the Pacific NorthwestMenusLocationsInformationAwards View fullsize Stadium Locations Stadium locations in Lumen Field, T-Mobile Park, Husky Stadium and Cheney StadiumInformationLocations"
