title = "Nutritionals — Ivar's"
full_description = "Scroll Seafood Bar Nutritionals Downloadable PDF Lists:(files open in new tabs)Ivar's Seafood Bar Nutritional ListIvar's Chowders Nutritional InformationIvar's Seafood Bar Ingredient ListIvar's Seafood Bar Allergy and Gluten List At Ivar’s, every wholesome, nutritious meal starts with optimal ingredients and thoughtful preparationIngredientsIvar’s respects the dietary sensitivities and preferences of its customers. Each Seafood Bar makes a list of ingredients available for a complete, on-the-spot review.Heart-Healthy SeafoodIvar Haglund was proud of the Pacific Northwest and its inherent bounty. So naturally, Ivar’s is wild about seafood with a tradition that continues in today’s quality menu offerings. The seafood we serve is high in protein, rich in antioxidants and Omega 3 fatty acids.We proudly serve wild Alaskan Salmon, deep-water Alaskan Halibut and Pacific True Cod. Our fish are sourced directly from the waters where they thrive, making their flavor robust and nutritionally pristine.Zero Grams Trans-FatWe only use 0 grams trans fat canola oil. After all, what’s better than Ivar’s classic Fish ‘n Chips? Trans-fat free Ivar’s Fish ‘n Chips!Local Means DeliciousIn our full-service restaurants, we work with local farmers and producers to offer the freshest ingredients. We also source organically farmed produce for seasonal favorites, wherever possible.Please Note: That while we have made every effort to insure that our menu items have been properly and accurately tested for nutritional content above, there may be variations in the actual nutritional content across servings based on slight variations in overall serving size and quantity of ingredients, serving portions, or based on special ordering that each customer may request. If you have special dietary needs or preferences, please talk to your server and let us know what we can do to meet your needs. Nutritionals Photo Nutritionals"
