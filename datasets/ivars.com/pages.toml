["https://ivars.com/acres"]
title = "Acres of Clams — Ivar's"
full_description = "Scroll Acres of Clams MenusLocation & ParkingGroup DiningChef Bio Links below open new tabsReservationsBOOK NOW Takeout or DeliveryOrder Now 1001 Alaskan Way | Seattle WaterfrontSunday - Thursday 11 am-8 pmFriday & Saturday: 11 am-9 pmHappy Hour: Daily 3:00 pm-6:00 pm In the summer of 2015 Ivar’s Acres of Clams unveiled a whale of a transformation at this flagship location on Pier 54 along Seattle’s Waterfront, overlooking Elliott Bay.The stunning down-to-the-studs remodel was the biggest in its history, which included an expanded indoor dining space, a new large outdoor patio, enlarged state-of-the-art kitchen, and a completely refreshed interior that pays homage to our iconic restaurant’s roots.Upon entering Ivar’s Acres of Clams you will be immersed in the history and lore of Ivar’s and our flounder Ivar Haglund. Original features of the Pier, which opened in 1901, including exposed fir beams and a refurbished Galbraith-Bacon & Co. sign from the original tenant (some say the Seattle Costco of its time) were restored. With a more airy feel and expansive views, diners enjoy views of the Puget Sound, passing Washington State ferries and fireboats from historic Fire Station #3.If you prefer al fresco dining, enjoy a stunning, new outside patio deck. Bask in the open-air breeze while taking in the sights and sounds of Elliott Bay, including the tranquil passing of ferries – and the occasional seagull friend.To satisfy your craving for Northwest seafood, our chefs have created award-winning preparations to reflect the season’s bounty, yet still showcase Ivar Haglund’s world-famous original recipes. Choose from wild Alaska salmon, deep-water halibut, Alaska King crab, Dungeness crab, jumbo prawns, Manila clams and weathervane scallops, just to name a few.Be sure to check out our Pier 54 Fish Bar, which offers take-out service of Ivar's classics including award-wining fish ‘n chips, chowder and other seafood favorites. As part of the local lore, feel free to feed a few fries to the seagulls. It’s a photo opportunity worth sharing! Overlooking Puget SoundSeattle Waterfront ADDRESS:1001 Alaskan WayPier 54(206) 624-6852PARKING:There is metered street parking all along the waterfront, as well as paid lots. More info: Downtown Seattle ParkingCONTACT:webmail@keepclam.com Address & ParkingAcres of Clams Dining Room and Clam Digger Lounge View fullsize Acres of Clams Executive Chef Victor Martinez Chef Victor MartinezExecutive Chef | Ivar's Acres of ClamsVictor Martinez joined Ivar’s in 2023 and loved the chance to “come back to seafood.” He began cooking in a Claim Jumper restaurant in Los Angeles in 1989 and by 1994 was managing 25 cooks. He was named Employee of the Year for all of Claim Jumper. He was promoted to Assistant Kitchen Manager, then Kitchen manager where he managed a staff of 42. He moved to Seattle to help open the Claim Jumper in Lynnwood, and, once open, decided not to move back to Los Angeles.He loved the Pacific NW and so became the executive chef at Gordon Biersch restaurants and brewery in 2010. In 2016, Victor went to work for Compass Microsoft in catering and dining, until joining the Ivar’s team.Victor was born in Oaxaco, Mexico and graduated from Universidad Autonoma Benito Juarez. In his free time, Victor enjoys dancing and teaching salsa, DJ-ing Latin music, and spending time with his 5 year old son, Shaden.He and his family live in Redmond, WA. Ready to Eat?Reservations Find A Table —Group Dining More Info Acres of Clams Photo Acres About Acres Locations Photo Acres Map Acres Chef Bio Acres Gallery Reservations & Groups"
