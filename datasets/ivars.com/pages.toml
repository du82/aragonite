["https://ivars.com/birthday"]
title = "Birthday — Ivar's"
full_description = "View fullsize Back to all Promos PromotionsIvar’s 120th Birthday –Buy One Entrée, Get One for $1.20!*Our flounder, Ivar Haglund, would have been a youthful 120 years old on Tuesday, March 18. He may not have wanted us to make a big deal about it, but we’re going to celebrate anyway (like we always do).On Tuesday, March 18, visit Ivar’s Seafood Bars, Fish Bars, Acres of Clams, Salmon House or Mukilteo Landing for Ivar’s Birthday Special: Buy one entrée from Ivar’s Birthday Menu and get a second for $1.20 from the same menu.It’s almost time to say, “Happy birthday, Ivar!” *Valid Tuesday, March 18, 2025 only. Purchase one entrée and receive one entrée for $1.20 from the special Ivar’s Birthday Menu (menus vary per location and are subject to change). One per person. Not valid with any other offer or promotion.Online ordering will be suspended for the day of March 18, 2024.Orders must be placed in-store for dine-in or take-out only."
