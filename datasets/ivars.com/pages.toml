["https://ivars.com/ivars-1"]
title = "Ivar's Leaves SeaTac — Ivar's"
full_description = "Press Room Return to Press Room View fullsize Ivar’s at SeaTac Airport Ivar’s Thanks Seattle for 12 Years at SeaTac AirportMEDIA RELEASEFebruary 14, 2018For More Information:Don Stark(206) 953-3969Ivar’s Thanks Seattle for 12 Years at SeaTac AirportSeattle – Well, Seattle travelers and SeaTac employees, it was fun and tasty while it lasted. After 12 years, Ivar’s will be out at SeaTac, the Seattle Port Commission announced today.“We’re disappointed,” said Ivar’s president Bob Donegan. We have loved serving our loyal customers at SeaTac and we’re very sorry we won’t be able to continue. The Port has selected companies other than Ivar’s for leases at SeaTac, so we will be finishing our tenancy there early in 2019.”Last June the Port chose to replace Ivar’s in the Central Terminal with a new vendor. More than 31,000 Ivar’s customers and supporters acted via email, phone calls, and social media to protest the Port’s process. The Port Commission made changes in its scoring system and Ivar’s agreed to submit bids in a subsequent leasing process.In the latest round, Ivar’s bid on two spaces, one in the C Concourse and one in the North Satellite expansion. Unfortunately, the Port again selected other vendors.Temporarily, Ivar’s will provide a limited menu at SeaTac. On Monday, the Port shut down all quick food service in the airport’s Central Terminal, to begin a renovation.Donegan said Ivar’s has guaranteed all its airport employees they will have jobs within the Ivar’s family of stores, including its newly remodeled Seafood Bar in Burien, just northwest of the airport. Ivar’s will also continue to supply free chowder to the USO lounge at SeaTac until Ivar’s has to leave, he said.“In appreciation of 12 fun and tasty years at SeaTac,” Donegan said, we’re offering all those who had contacted the Port on our behalf a gift cup of chowder from Ivar’s.”* * * * *"
