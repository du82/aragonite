["https://ivars.com/pressteacher-2017"]
title = "Press-Teacher 2017 — Ivar's"
full_description = "Press RoomReturn to Press Room View fullsize Teacher of the Year Winner 2017 Washington Educator Earns Coveted “Teacher of the Year” AwardAfter reviewing hundreds of worthy submissions from kindergarten through eighth grade students, who nominated their most inspiring teachers, Ivar’s announced today that it awarded two Washington state educators as “Teacher of the Year” for its 14th annual contest. The Ivar’s grand prize went to Kirsten Jewett of View Ridge Elementary in Seattle.In a late June ceremony, each teacher was presented their winning prize package: a $500 check to put toward the purchase of class supplies, a commemorative plaque and the official title of “Teacher of the Year.” Plus, the nominating students of the grand prize winners received either an Ivar’s Kids Meal – including a visit by Ivar’s famous Dancing Clam.Third grade student Quinn Heldridge nominated Ms. Jewett for her kindness and eagerness to help her kids excel. On the first day of class, Ms. Jewett created “buddy groups” to help others when they are feeling down or sad. Ms. Jewett also has a bag with beans, available for kids who are feeling fidgety or want to stand up, the bag reminds them that the class needs to stay focused and understand what to do with their growing bodies. Ms. Jewett also helps her class by teaching them to actively participate and never dismisses a wrong answer, rather gives the class “think time” to try and get the correct answer.Ivar’s also awarded two teachers each the first-place prizes of a $150 gift card for class supplies:First place winners: Christi Chang: Sixth Grade, Chinook Middle School (Bellevue) Jennifer Morris: Third Grade, McDonald international School (Seattle)Fifteen teachers each also received second place honors which included a $25 Ivar’s gift card, including: Nick Kosty: Sixth Grade, Kent Mountain View (Des Moines) Chris Lirhus: Fourth Grade, Parkwood Elementary (Shoreline) Josh Hill: Fifth Grade, Cascadia Elementary (Seattle) Kris Jensen: Seventh Grade, Marysville Middle School (Marysville) Gillian Gordon-Smith: Fifth Grade, Whittier Elementary (Seattle) Dana Radcliffe: Sixth Grade, Hamilton International (Seattle) Tony Lockett: Seventh Grade, Aylen Junior High (Puyallup) Tammy Zitzer: First Grade, Neely-O’Brien Elementary Bob Good: Seventh Grade, Kingston Middle School (Kingston) Merry Trent: Second Grade, Mukilteo Elementary (Mukilteo) Suzanne Gutheil: Fourth Grade, Heritage Christian Academy (Bothell) Sam Kuyper: Eighth Grade, Redmond Middle School (Redmond) Cathy Alward: Third Grade, Adams Elementary (Seattle) Jordan Jacobsen: Kindergarten, Island Park Elementary (Mercer Island) Kacy Lebby: Third Grade, Tops K-8 School (Seattle)About Ivar’s Ivar’s Seafood Restaurants began on Seattle's waterfront in 1938. Today, there are 23 Ivar's fast casual Seafood Bars and three full-service restaurants: Ivar's Acres of Clams, Ivar's Salmon House and Ivar's Mukilteo Landing. Ivar's Seafood, Soup and Sauce Company markets and sells its award-winning soups, chowders and sauces both nationally and internationally. The company also operates regional stadium concessions including Safeco Field, CenturyLink Field, Alaska Airlines Arena, Husky Stadium and Cheney Stadium. Learn more at www.Ivars.com or Follow Ivar’s on Facebook, Twitter, Pinterest or Instagram.* * * * *"
