["http://iwcs2015.github.io/pages/instructions-for-authors.html"]
title = "IWCS 2015"
full_description = 'Instructions for Authors Formatting Instructions Papers should be formatted with a Times font, size 11pt, typeset in one column, and with margins of 25mm all around. Papers should be submitted in PDF A4 paper format using the START electronic submission web page at https://www.softconf.com/iwcs2015/main. Long paper submissions should not exceed 10 pages of content, but can optionally use an additional page for references. (Just to be clear: this means the total length must be 11 pages or less, and the content must fit into 10 pages or less). Short paper submissions should not exceed 5 pages of content, with an optional additional page for references. The first page should include an abstract of c. 10 lines. Authors are strongly encouraged to prepare their submission using LaTeX. Submission Deadline Authors must submit final camera-ready versions no later than 27th February 2015. Final versions should no longer be anonymised! LaTeX Submissions Users of LaTeX should use documentclass article with the options a4paper and 11pt, using the packages times and geometry to set font and margins. For citations please use the natbib package with chicago.bst as bibliography style. See below for an example LaTeX file: \documentclass[a4paper,11pt]{article} \usepackage{graphicx} %%% for including graphics \usepackage{url} %%% for including URLs \usepackage{times} \usepackage{natbib} \usepackage[margin=25mm]{geometry} \title{Example Paper for IWCS} \date{} \author{Example Author\\ Affiliation\\ \texttt{example@email.org} \and Someone Else\\ Another Affiliation\\ \texttt{another@email.org} } \begin{document} \maketitle \thispagestyle{empty} \pagestyle{empty} \section{Introduction} .... \bibliographystyle{chicago} \bibliography{mybib} \end{document} Dual Submission Papers that have been or will be submitted to other meetings or publications must indicate this at submission time. Authors of papers accepted for presentation at IWCS 2015 must notify the program chairs by the camera-ready deadline as to whether the paper will be presented. All accepted papers must be presented at the conference to appear in the proceedings. We will not accept for publication or presentation papers that overlap significantly in content or results with papers that will be (or have been) published elsewhere. Preprint servers such as arXiv.org and workshops without published proceedings are not considered as prior publications for this purpose. Authors should state in the online submission form the name of the workshop or preprint server and title of any such non-archival version, so that reviewers can be informed appropriately.'
