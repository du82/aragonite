["http://iwcs2015.github.io/announcement-and-call-for-workshop-proposals.html"]
title = "IWCS 2015"
full_description = "Announcement and call for workshop proposals 11th International Conference on Computational Semantics (IWCS) Queen Mary University of London, UK 14-17th April 2015 (workshops on 14th) Proposal deadline: 10th October 2014 The International Conference for Computational Semantics (IWCS) invites proposals for one-day or half-day workshops, to be held in conjunction with the 2015 IWCS conference. IWCS 2015 will take place on 15th-17th April 2015 at Queen Mary University of London, UK. Workshops will take place on the day immediately preceding the conference: 14th April 2015. The aim of the IWCS conference is to bring together researchers interested in any aspects of the computation, annotation, extraction, and representation of meaning in natural language, whether this is from a lexical or structural semantic perspective. IWCS embraces both symbolic and statistical approaches to computational semantics, and everything in between. Topics of interest Topics of interest for the workshops include all those topics relevant to the main conference, including but not limited to: representation of meaning syntax-semantics interface representing and resolving semantic ambiguity shallow and deep semantic processing and reasoning hybrid symbolic and statistical approaches to representing semantics alternative approaches to compositional semantics inference methods for computational semantics recognizing textual entailment learning by reading methodologies and practices for semantic annotation machine learning of semantic structures statistical semantics computational aspects of lexical semantics semantics and ontologies semantic web and natural language processing semantic aspects of language generation semantic relations in discourse and dialogue semantics and pragmatics of dialogue acts multimodal and grounded approaches to computing meaning semantics-pragmatics interface Submission information Proposals for workshops should contain: A title and brief (2-page max) description of the workshop topic and content. An estimate of the audience size The names, postal addresses, and email addresses of the organizers, with one-paragraph statements of their research interests and areas of expertise. A list of potential members of the program committee, with an indication of which members have already agreed. A description of special requirements for technical needs. Proposals should be submitted by email to iwcs2015@gmail.com as soon as possible, but no later than 10th October 2014. Notification of acceptance of workshop proposals will occur no later than 17th October 2014. After acceptance Organizers of accepted workshops must provide descriptions of their workshops, for inclusion in the conference registration material, by 1st December 2014. The description must be provided in two formats: an ASCII version that can be included with the email announcement, and an HTML version that can be included on the conference home page. These descriptions should be mailed to: iwcs2015@gmail.com The final workshop materials must be received by the IWCS organizers by 1st March 2015. This includes the detailed proceedings (camera-ready versions of papers), which will be made available electronically, as well as a short workshop program, which will be printed together with the main conference program. Finances Workshops must be financially self-supporting. The conference organizers will establish registration rates so as to provide the room, audio-visual equipment, internet access, snacks for breaks, and the workshop proceedings. Important dates 10th October 2014 Workshop proposal submissions due 17th October 2014 Workshop proposal notification of acceptance 1st December 2014 Workshop description mailed to IWCS organizers 1st March 201 Workshop material due to IWCS organizers 14th April 2015 Workshop date"
