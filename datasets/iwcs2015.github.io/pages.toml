title = "IWCS 2015"
full_description = "The 11th International Conference on Computational Semantics (IWCS 2015) was held at Queen Mary University of London, UK on 14-17th April 2015. IWCS is the bi-yearly meeting of SIGSEM, the ACL special interest group on semantics; this year's edition is hosted by Queen Mary's Computational Linguistics Lab. The aim of the IWCS conference is to bring together researchers interested in any aspects of the computation, annotation, extraction, and representation of meaning in natural language, whether this is from a lexical or structural semantic perspective. IWCS embraces both symbolic and statistical approaches to computational semantics, and everything in between. The main conference was held Wednesday 15th to Friday 17th April, with a day of workshops on Tuesday 14th, and a hackathon on the previous weekend 11-12th."
