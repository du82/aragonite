["http://iwcs2015.github.io/location.html"]
title = "IWCS 2015"
full_description = "Location / Venue IWCS 2015 is being hosted at Queen Mary University of London, on the Mile End Campus. The campus is close to Mile End station, just two stops on the Underground from Liverpool Street. Conference Handbook Please download the conference handbook containing all the information here, and more. Conference Venue The conference and workshops will take place in the Bancroft Building. Conference plenary sessions will be held in the Mason Lecture Theatre on the first floor (in UK terms, i.e. one floor above the ground floor). Poster sessions will be just across the corridor, and workshops in rooms very close by. The registration desk will be in the foyer on the ground floor as you come in. The Bancroft is building 31 on the QMUL campus map, although the map below might be more helpful for finding your way there: Getting around There are several options for eating and having a drink near Queen Mary. On the Mile End Road, towards and close to the Mile End underground station, there is a plethora of cafés and fast food places, e.g. Starbucks, Costa and Nandos. There is also an Indian buffet and a sit down Chinese restaurant. From the places close to the Stepney Green underground station, Pride of Asia stands out, which is also an Indian buffet. The cheapest pub option is the The Half Moon on Mile End Road and close to Stepney Green Station. Nearby is the more expensive but good quality Italian restaurant Verdi (237 Mile End Road). Orthogonal to Mile End Road, just before the underground station, on Midlothian Road, there is the reasonably priced Afghan/Persian restaurant Ariana (2 Midlothian Road, London E3 4SE); also orthogonal to Mile End Road, on Grove Road, there is The Greedy Cow (2 Grove Road, London E3 5AX), with a popular range burgers from different sources; down the Grove Road, there is a lovely coffee shop The Coffee room. Close to Mile End station there is the gastro-style pub The Morgan Arms (43 Morgan St Bow, London E3 5AA). The Palm Tree in the Mile End Park is a cosy and traditional East End pub (but beware it only takes cash). Some other places are shown on the map. If you're looking for the Indian/Bangladeshi food for which the area is famous, there are many options on Brick Lane a little further west (get a bus or tube to Aldgate East or Whitechapel station), but they can be hit-and-miss; we recommend Tayyabs and the Lahore Kebab House nearby more highly. Conference Dinner The conference dinner includes a Thames boat trip and is included as part of the registration fee. The boat is called Thames Princess. We embark at Lambeth Pier at 7pm sharp, returning at 11pm. To get there, take a District line train from Mile End to Westminster station, walk over Westminster Bridge and turn right along the river (away from the London Eye). It’s a 5-10 minute walk before you reach Lambeth Pier, which is just by Lambeth Bridge. Walking Tour Queen Mary is situated in a historic part of London's East End. If you're interested in exploring it, we offer a self-guided audio tour together with map and expert commentary. It takes about an hour to complete, and you can download it free here. Highlights include: Whitechapel murder scene of Jack the Ripper East End's Speakers Corner (Mile End Waste) Petticoat Lane Market Christ Church, Spitalfields Brick Lane Internet Access Wireless internet access will be available at the conference venue itself; details on how to connect will be available closer to the time. However, QMUL supports eduroam, so if you are a member of a participating institution, you won't have to do anything - it'll just connect without any extra setup. We highly recommend setting up to use this if you can (mainly because it's so useful and works in so many places)! You should make sure that you have eduroam working at your institution before leaving, though - it can be a bit tricky to set up initially (there's no software to install, but you do need to tinker with security certificates). Just ask your local IT people: it'll be worth it - you'll be able to connect anywhere that supports eduroam. Getting Here You can go to the QMUL website for more information about the Mile End campus and how to get there, and for a full campus map. The nearest Underground stations are Mile End (Central, District and Hammersmith & City lines) and Stepney Green (District and Hammersmith & City), each about 5 minutes walk away. Central London is very close: Liverpool Street station is only two stops on the Central Line (5 mins) from Mile End. Trains from Paris and the continent arrive at St Pancras; from there it's 20-25 minutes on the Underground. Trains from elsewhere in the UK could arrive almost anywhere, but for airport train information see below. The number 25 bus (Oxford Circus to Ilford - see here for a route map) travels along Mile End Road at five to ten minute intervals throughout the day, and stops outside the College. Airports The closest airport is London City Airport, 25 mins away by public transport. Next closest is Heathrow, with Gatwick, Stansted and Luton all further away - but they all take about an hour to get to QMUL. In rough order of travel time, fastest first: London City Airport (LCY) - about 25 minutes to central London (Bank), the same to Mile End Heathrow Airport (LHR) - from 15 to 60 mins to central London (Paddington) (quicker but more expensive on the Heathrow Express train, slower but cheaper taking the Underground all the way); 50-70 mins to Mile End Stansted Airport (STN) - 45 mins to central London (Liverpool Street); about 65 mins to Mile End Luton Airport (LTN) - about 25 mins to central London (St Pancras); 60-70 mins to Mile End Gatwick Airport (LGW) - 30-35 mins to central London (Victoria); about 70 mins to Mile End Accommodation Hotels close to QMUL They are all new or fairly new, all have their own character, some are more funky than others, and of course some have more facilities. We suggest you check their websites to see which would suit you. Bookable by the usual hotels web sites. All hotels are about 30 mins walk, 12-14 mins by bus 25/205 every 3-4 mins, 15 mins by tube District/Hammersmith and City line. City Hotel ☆☆☆ 12 Osborn Street, Aldgate East, London, E1 6TE Ibis City ☆☆ 5 Commercial Street, London, E1 6BF Ibis Budget London Whitechapel ☆☆ 100 Whitechapel Road, LONDON, E1 1JG Premier Inn London City (Aldgate) ☆☆☆ 66 Alie Street, Aldgate, London, E1 8PX Qbic Hotel London City ☆☆☆ 42 Adler Street, London, E1 1EE The Whitechapel ☆☆☆☆ 49-53 New Road, London, E1 1HH Hotels in Bloomsbury Imperial Hotels have several hotels in and around the Bloomsbury area where there are plentiful restaurants. The nearest tube station is Holborn on the central line direct to Mile End. Imperial ☆☆☆☆ Russell Square, London WC1B 5BB President ☆☆☆☆ 56-60 Guildford Street, London WC1N 1DB Bedford ☆☆☆ Southampton Row, London WC1B 4HD If none of these appeal or are full you can choose any hotel close to a District/Hammersmith and City/Central line tube station. Journey time approx. 45 – 50 mins. Alternative Options This list from QMUL Residential Services has some alternatives in the area, including some cheaper options: Alternative Acommodation"
