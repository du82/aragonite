full_description = '''Programme and Proceedings Proceedings The full proceedings are available here online (and also via the ACL Anthology): Main conference: IWCS 2015 Workshops: ISA-11 MOMA Language and Ontologies IMC ADS Schedule details are also available in the conference handbook. Recordings You can view recordings of the talks, with slides, here via QMUL's Q-Review system. Unfortunately a fault meant that Friday's talks have no audio (sorry! guess you can still watch the slides ...) but the rest should be OK. Wednesday: Keynote: Regina Barzilay Lexical Semantics session Discourse & Generation session Probabilistic Semantics session Thursday: Keynote: Yoshua Bengio Distributional Methods session Reference & Incrementality session Friday (audio problem, sorry): Keynote: Ann Copestake Parsing & Grammars session Dialogue & Pragmatics session Logic & Complexity session Conference Schedule Sat 11th Sun 12th Mon 13th Tue 14th Wed 15th Thu 16th Fri 17th Hackathon ISO meetings Workshops Main Conference 9 9:30 Hackathon Hackathon ISO meetings Workshops Introduction (video) 9:30 10 Keynote: Regina Barzilay(video) Keynote: Yoshua Bengio(video) Keynote: Ann Copestake(video) 10 10:30 10:30 11 coffee coffee coffee 11 11:30 Lexical Semantics(papers 22, 26, 27)(video) Distributional Methods(papers 56, 59, 61)(video) Parsing & Grammars(papers 42, 52, 80)(video) 11:30 12 12 12:30 12:30 1 Lightning Talks lunch lunch 1 1:30 lunch lunch 1:30 2 Reference & Incrementality(papers 34, 38, 53)(video) Dialogue & Pragmatics(papers 17, 62, 65)(video) 2 2:30 Workshops Poster session 2:30 3 3 3:30 coffee coffee 3:30 4 coffee Open Space Event("unconference") Logic & Complexity(papers 23, 82)(video) 4 4:30 Discourse & Generation(papers 69, 75)(video) 4:30 5 5 5:30 Probabilistic Semantics(papers 63, 71)(video) 5:30 6 Evening Reception Dinner & Boat Trip Session & Paper Details Session Paper ID Title Authors Lexical Semantics 27 Leveraging a Semantically Annotated Corpus to Disambiguate Preposit