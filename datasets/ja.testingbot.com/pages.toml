["https://ja.testingbot.com/security"]
title = "エンタープライズグレードのセキュリティ-TestingBot"
description = "クラウドベースのSeleniumテスト用のエンタープライズグレードのセキュリティ。大企業や大企業から信頼されています。"
full_description = "実行するすべてのテストについて、テストするプラットフォーム/ブラウザー/デバイスを使用して、まったく新しい仮想マシン（VM）を起動します。 すべてのテストは、元の状態の新しく起動されたマシンで実行されます。 VMでテストを行うすべてのことは、COW（コピーオンライト）を介してRAMディスク（メモリ）に書き込まれます。 テストの最後に、テストのスクリーンショット、ログ、およびビデオを収集した後、RAMディスクとVMを完全に消去するようにハイパーバイザーに指示します。 すべてのテストは、ファイアウォールで保護された独自のVMで実行されます。 TestingBotは、VMにアクセスできるのはあなただけであることを保証し、実行するすべてのVMにファイアウォールを適用することで、他のすべてのトラフィックをブロックします。 VMはパブリックインターネットにのみアクセスできます。または、TestingBotトンネルを実行している場合は、コンピューター/ネットワーク上のコンテンツ。 デフォルトでは、さまざまなコンポーネント（Seleniumログ、Chrome-ドライバーログ、Firefox-ドライバーログ、コンソールログなど）のログとともに、テストのスクリーンショットとビデオを撮影します。 これらのアセットは、SSLを介してアセットサーバーにアップロードされます。これらのアセットへのアクセスは制限されています。アセットごとに署名付きURLを作成します。各アセットには、SSL経由で30分間のみアクセスできます。 ロギング、スクリーンショットの撮影、ビデオの録画を無効にすることもできます。このように、テスト中に発生したことは何も記録されません。 チームに同僚を追加し、次のようなアカウント所有者としてユーザーポリシーを適用します。"
