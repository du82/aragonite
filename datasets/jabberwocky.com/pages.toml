["https://jabberwocky.com/carroll/jabber"]
title = "Glorious Nonsense - Jabberwocky"
description = """
See what happens when someone really,
really, likes a poem? Bah. This is a whole page of Jabberwockies found in
movies, print, and song."""
full_description = '''I was reading away, with quiet enjoyment, when I came across Jabberwocky. I read it, paused, and read it again. Pondered for a while, then read it again. Jabberwocky beautifully skates the thin edge of being understood and being nonsense. But such glorious nonsense! As Alice put it, I am currently analyzing works of Lewis Carroll for my 10th grade English class. My two works of choice are "Alice's Adventures in Wonderland" and "Jabberwocky." However, I seem to be having great difficulty in analyzing this poem. When I read it I am unable to find if it's true. I believe the album (Columbia OS 3240, I was told, but mine says Columbia CK 3240) is out of print now, alas. All in all, though, it's a good album - where else can you hear Tiny Tim singing "I Got You Babe"? :) Anything to add? Mail me! (Yes, I've heard the Jack the Ripper stories. I've also heard the drug stories. AND the sex fiend stories. They're all not true.)'''
year_published = 2025
