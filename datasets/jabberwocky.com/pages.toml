title = "Photography"
full_description = "I first became interested in photography years ago. There was always something just so wonderful about making images that way. When I was in film school, and I had access to their amazing darkroom, I would enter early in the morning, and print until sheer exhaustion and hunger drove me outside, only to realize that I had been in the dark for 12 hours straight. It's hard to write words about photography, so I'll just let some images speak for themselves. Aside from here, I touched on photography in my abbreviated life story, and in my photography links page."
