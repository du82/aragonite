["https://jair.org/index.php/jair/SpecialTrack-HHAI"]
title = """
Hybrid Human-Artificial Intelligence
\t\t\t\t\t\t\t| Journal of Artificial Intelligence Research"""
description = """
Viewpoint: Hybrid Intelligence Supports Application Development for Diabetes Lifestyle Management 

Bernd J. W. Dudzik, Jasper S. van der Waa, Pei-Yu Chen, Roel Dobbe, Inago M.D.R. de Troya, Roos M. Bakker, Maaike H. T. de Boer, Quirine T.S. Smit, Davide Dell'Anna, Emre Erdogan, Pinar Yolum, Shihan Wang, Selene Baez Santamaria, Lea Krause, and Bart A. Kamphorst

 PDF"""
full_description = "Hybrid Human-Artificial Intelligence Track Editors Davide Grossi, University of Groningen, The NetherlandsWendy Mackay, Inria, FranceFrans Oliehoek, Delft University of Technology, The Netherlands (Contact for Enquiries)Ana Paiva, Inesc-ID & Instituto Superior Técnico, PortugalMaria Perez-Ortiz, University College London, United KingdomStefan Schlobach, Vrije Universiteit Amsterdam, The NetherlandsMyrthe Tielman, Delft University of Technology, The Netherlands Overview We invited scholars to submit novel research focusing on the intersection of human and artificial intelligence to this special track, which aims to emphasize the need for adaptive, collaborative, responsible, interactive and human-centered intelligent systems. Contents of the special track are made available as articles are accepted. The papers in this JAIR Special Track will also include a selected subset of papers in extended form from the 1st International Conference on Hybrid Human-Artificial Intelligence (HHAI), held in Amsterdam in June 2022. Hybrid Human-Artificial Intelligence is the field focusing on the study of artificial intelligent systems that cooperate synergistically, proactively and purposefully with humans, amplifying instead of replacing human intelligence. The field is driven by current developments in AI, but also requires fundamentally new approaches and solutions. Specifically, we need collaboration with areas such as HCI, cognitive and social sciences, philosophy & ethics, complex systems, and others. The goal of this track was to provide scholarly input and novel contributions on the topic of how intelligent machines could collaborate and interact with humans, building a new type of collective intelligence. The track also aimed to provide a forum in which research on the different applications of human-AI collaboration and interaction can be presented. We invited research on the different challenges in Hybrid Human-Artificial Intelligence, including but not limited to: Human-AI interaction and collaboration Adaptive human-AI co-learning and co-creation Learning, reasoning and/or planning with humans and machines in the loop User (including teammate or opponent) modelling and personalization Integration of learning and reasoning, i.e. symbolic & sub-symbolic AI Transparent, explainable and accountable AI Fair, ethical, responsible and trustworthy AI Meaningful human control over AI systems Societal values, law and politics in the design and use of human-AI interaction Multimodal machine perception of real world settings Social signal processing Types of Submissions The special track invited three types of submissions: Regular journal articles, aiming to advance the state of the art of HHAI. Viewpoints (short articles of up to 2000 words, dedicated to technical views and opinions on HHAI in which positions are substantiated by facts or principled arguments) Multi-author discussion articles (e.g. half a dozen authors discuss arguments around an issue concerning HHAI) Regular journal articles present novel research. Novelty could be in i) the AI techniques developed and presented, ii) in the application of existing AI techniques to a novel domain of HHAI, iii) in a novel experimental comparison of different HHAI techniques (either through computational experiments or user studies), or iv) novel analyses, theories or models that expand the understanding of HHAI, among others. Viewpoint and multi-author discussion papers are dedicated to technical and critical views and opinions on the field of human-AI collaboration and interaction and should present a novel viewpoint on a problem, or on a novel solution to a problem. They do not need to contain primary research data, but are substantiated by facts or principled arguments to provide new insights or opinions to a debate. Status The track is closed for new submissions. Accepted submissions will be added to this page on publication. Viewpoint: Hybrid Intelligence Supports Application Development for Diabetes Lifestyle Management Bernd J. W. Dudzik, Jasper S. van der Waa, Pei-Yu Chen, Roel Dobbe, Inago M.D.R. de Troya, Roos M. Bakker, Maaike H. T. de Boer, Quirine T.S. Smit, Davide Dell'Anna, Emre Erdogan, Pinar Yolum, Shihan Wang, Selene Baez Santamaria, Lea Krause, and Bart A. Kamphorst PDF Cultural Bias in Explainable AI Research: A Systematic Analysis Uwe Peters and Mary Carman PDF Tackling Cooperative Incompatibility for Zero-Shot Human-AI Coordination Yang Li, Shao Zhang, Jichen Sun, Wenhao Zhang, Yali Du, Ying Wen, Xinbing Wang and Wei Pan PDF A Hybrid Intelligence Method for Argument Mining Michiel van der Meer, Enrico Liscio, Catholijn M. Jonker, Aske Plaat, Piek Vossen, Pradeep K. Murukannaiah PDF Evaluating Trustworthiness of AI-Enabled Decision Support Systems: Validation of the Multisource AI Scorecard Table (MAST) Pouria Salehi, Yang Ba, Nayoung Kim, Ahmadreza Mosallanezhad, Anna Pan, Myke C. Cohen, Yixuan Wang, Jieqiong Zhao, Shawaiz Bhatti, James Sung, Erik Blasch, Michelle V. Mancenido and Erin K. Chiou PDF A Fortiori Case-Based Reasoning: From Theory to Data Wijnand van Woerkom, Davide Grossi, Henry Prakken, Bart Verheij PDF Prosociality in Microtransit Divya Sundaresan, Akhira Watson, Eleni Bardaka, Crystal Chen Lee, Christopher B. Mayhorn, Munindar P. Singh PDF TOMA: Computational Theory of Mind with Abstractions for Hybrid Intelligence Emre Erdogan, Frank Dignum, Rineke Verbrugge, Pinar Yolum PDF AI Reliance and Decision Quality: Fundamentals, Interdependence, and the Effects of Interventions Jakob Schöffer, Johannes Jakubik, Michael Vössing, Niklas Kühl, Gerhard Satzger PDF Value Preferences Estimation and Disambiguation in Hybrid Participatory Systems Enrico Liscio, Luciano C. Siebert, Catholijn M. Jonker, Pradeep K. Murukannaiah PDF"
