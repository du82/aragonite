["https://jair.org/index.php/jair/IJCAIJAIR"]
title = """
IJCAI-JAIR Awards
\t\t\t\t\t\t\t| Journal of Artificial Intelligence Research"""
description = """
Confident Learning: Estimating Uncertainty in Dataset Labels

2024 Prize
Curtis Northcutt, Lu Jiang, and Isaac Chuang
Citation: The work focuses on data label noise, providing both theoretical and empirical perspectives on how to handle this pressing issue. A strong contribution is a method for estimating the joint distribution of noisy and clean labels without regard to data modality, leading to actionable insights that are grounded in theory. The paper forms the basis for a widely-used open-source software library that has led to significant practical impact. 
 

 PDF 


Reward machines: Exploiting reward function structure in reinforcement learning

2023 Prize
Rodrigo Toro Icarte, Toryn Q. Klassen, Richard Valenzano, and Sheila A. McIlraith
Citation: This work considers how the structure of an explicitly-described reward function can be exploited to support efficient learning. This important setting has so far been under-explored; reward functions are typically expert-designed and therefore contain structure that most existing work ignores. The article proposes representing such a structure using a reward machine, a richly expressive type of finite-state machine; it also describes several powerful and effective methodologies to exploit the resulting structure. This article is the culmination of an influential line of research that bridges and enriches three different communities: AI planning, reinforcement learning, and formal methods.
 

 PDF"""
full_description = "IJCAI-JAIR Awards The Annual IJCAI-JAIR Best Paper Prize is awarded to an outstanding paper published in JAIR in the preceding five calendar years. The prize committee is comprised of associate editors and members of the JAIR Advisory Board; their decision is based on both the significance of the paper and the quality of presentation. The recipient(s) of the award receives a prize of US$500 (to be split amongst the authors of a co-authored paper). Funding for this award was provided by the International Joint Conferences on Artificial Intelligence. Confident Learning: Estimating Uncertainty in Dataset Labels 2024 Prize Curtis Northcutt, Lu Jiang, and Isaac Chuang Citation: The work focuses on data label noise, providing both theoretical and empirical perspectives on how to handle this pressing issue. A strong contribution is a method for estimating the joint distribution of noisy and clean labels without regard to data modality, leading to actionable insights that are grounded in theory. The paper forms the basis for a widely-used open-source software library that has led to significant practical impact. PDF Reward machines: Exploiting reward function structure in reinforcement learning 2023 Prize Rodrigo Toro Icarte, Toryn Q. Klassen, Richard Valenzano, and Sheila A. McIlraith Citation: This work considers how the structure of an explicitly-described reward function can be exploited to support efficient learning. This important setting has so far been under-explored; reward functions are typically expert-designed and therefore contain structure that most existing work ignores. The article proposes representing such a structure using a reward machine, a richly expressive type of finite-state machine; it also describes several powerful and effective methodologies to exploit the resulting structure. This article is the culmination of an influential line of research that bridges and enriches three different communities: AI planning, reinforcement learning, and formal methods. PDF DESPOT: Online POMDP Planning with Regularization 2022 Prize Nan Ye, Adhiraj Somani, David Hsu and Wee Sun Lee Citation: This paper presents the state-of-the-art results in online POMDP planning. It offers both theoretical proofs and empirical evaluations to justify the claims presented by the authors. Online POMDP solving is one of the more popular problems recently, and DESPOT is considered as one of the top choices in this direction. Since its publication, the paper has been employed for solving problems in applications including human-robot collaboration tasks and autonomous driving, as well as in fundamental research in hybrid POMDPs. PDF Learning Explanatory Rules from Noisy Data 2021 Prize Richard Evans and Edward Grefenstette Citation: This paper makes an important contribution to AI, namely one of the first end-to-end differentiable approaches to inductive logic programming (ILP). The approach taken is elegant and extends ILP beautifully to the differentiable domain, paving the way to bridging both logical and deep (neural) learning. Since its publications, the work has inspired a lot of follow ups, and the idea described therein, namely differentiable deduction through forward chaining on definite clauses has been demonstrated to have profound impact on making symbolic systems more robust and neural systems more understandable. In addition, the paper gives new emphasis and impulse to neuro-symbolic AI and, in turn, to the System 1 and System 2 debate in psychology, cognitive science, and AI. PDF From Skills to Symbols: Learning Symbolic Representations for Abstract High-Level Planning 2020 Prize George Konidaris, Leslie Pack Kaelbling and Tomas Lozano-Perez Citation: This paper elegantly shows how to automatically construct abstract representations suitable for evaluating plans composed of sequences of high-level actions in a continuous, low-level environment. This follows a long tradition in AI of structuring agent control architectures around procedural abstraction, i.e., grounded abstract symbolic representation, establishing a principled link between high-level actions and abstract representations along with a theoretical foundation for constructing abstract representations with provable properties and a practical mechanism for autonomously learning abstract high-level representations. PDF Coactive Learning 2020 Honorable Mention Pannaga Shivaswamy and Thorsten Joachims Citation: This paper introduces a novel learning paradigm that lies between traditional online learning, where the utilities of each action are visible to the algorithm, and bandit settings, where the utilities of only the optimal action are observed. It presents very solid theoretical results, showing upper bounds on expected regret, as well as an extensive experimental evaluation of a number of algorithms implementing the approach on real-world scenarios. PDF PS Clause Elimination for SAT and QSAT 2019 Prize Marijn Heule, Matti Järvisalo, Florian Lonsing, Martina Seidl and Armin Biere Citation: This paper describes fundamental and practical results on a range of clause elimination procedures as preprocessing and simplification techniques for SAT and QBF solvers. Since its publication, the techniques described therein have been demonstrated to have profound impact on the efficiency of state-of-the-art SAT and QBF solvers. The work is elegant and extends beautifully some well-established theoretical concepts. In addition, the paper gives new emphasis and impulse to pre- and in-processing techniques - an emphasis that resonates beyond the two key problems, SAT and QBF, covered by the authors. PDF PS Framing Image Description as a Ranking Task: Data, Models and Evaluation Metrics 2018 Prize M. Hodosh, P. Young and J. Hockenmaier Citation: This article deals with the problem of associating images with natural language sentences that describe what is depicted in them. It specifically considers the task of associating images with sentences drawn from a large, predefined pool of image descriptions, and introduces a benchmark collection for sentence-based image description and search that has since become widely used within the community. The authors describe and thoroughly evaluate several image description algorithms and demonstrate that image features capturing only low-level perceptual properties can work surprisingly well in cases where no in-domain detectors are available. In their empirical evaluation, they consider different metrics for the quality of single image-caption pairs. Automatically computed scores are also compared with detailed human judgments. The work is recognised for its thorough empirical treatment of an interesting problem at the intersection of computer vision and natural language processing, and for its lasting impact on the literature in this area. It clearly demonstrates the value of carefully designed benchmark sets and computational experiments. Overall, this article serves as an excellent example for high-quality and impactful empirical work in AI. PDF PS Data Multimodal Distributional Semantics 2017 Prize E. Bruni, N. K. Tran, M. Baroni Citation: This paper describes a procedure for constructing word representations using text- and image-based distributional information. This has been a fundamental and innovative contribution in the area of natural language and vision. Another key contribution is the data set, which has since been used extensively. This work is recognised for its impact within multiple areas in AI, including NLP, Vision, and Machine Learning, and for its seminal role in the introduction of a multimodal perspective in distributional semantics models for computational representations of word meaning. PDF PS COLIN: Planning with Continuous Linear Numeric Change 2017 Honorable Mention A. J. Coles, A. I. Coles, M. Fox, D. Long Citation: This paper combines classical planning over a domain model with reasoning over continuous change - a challenging topic of high relevance within the AI community as well as for real-world applications, including energy management, chemical engineering and robotics. It introduces a concrete instantiation of what has since become the dominant approach for temporal hybrid planning, by effectively combining heuristic search with an external numeric reasoner such as a linear program solver. This work is recognised for its impact within AI planning and beyond, and for its seminal role in the development of hybrid discrete-continuous planning techniques. PDF PS Data Automated Search for Impossibility Theorems in Social Choice Theory: Ranking Sets of Objects 2016 Prize Christian Geist, Ulle Endriss Citation: This article presents a core AI result in computational social choice using automatic theorem proving techniques, by studying axioms that relate preferences over individual objects with preferences over sets of objects. These axioms are represented as formulae in a many-sorted first-order-logic that are then mapped into propositional logic formulae amenable and tackled using a SAT solver. A key contribution of the paper is a result showing that inconsistencies found for a fixed domain size can be extended to larger domains, leading to an impossibility theorem. Using this approach, the authors verify a number of known theorems and discover several new ones. Overall, the contributions made in this work are of considerable importance for computational social choice and for AI in general; they include: (i) a practical automatic method for theorem search, (ii) the verification of a number of well-known theorems, and (iii) the automatic discovery of several new and non-trivial impossibility theorems in social choice. PDF PS Theoretical and Practical Foundations of Large-Scale Agent-Based Micro-Storage in the Smart Grid 2016 Honorable Mention Perukrishnen Vytelingum, Thomas Voice, Sarvapali D. Ramchurn, Alex Rogers, Nicholas R. Jennings PDF PS The LAMA Planner: Guiding Cost-Based Anytime Planning with Landmarks 2015 Prize S. Richter, M. Westphal Citation: This paper gives a comprehensive description and analysis of the award winning LAMA planner. LAMA's use of landmarks in combination with cost-sensitive heuristics is presented, and the performance of the planner in different configurations is evaluated and analyzed in a detailed and insightful experimental study. This excellently written paper has been very influential and has helped to establish the use of landmarks as a key technique in classical planning. PDF PS Appendix Wikipedia-based Semantic Interpretation for Natural Language Processing 2014 Prize Evgeniy Gabrilovich, Shaul Markovitch Citation: This paper demonstrates how contextual word meaning can be represented in a high-dimensional space of concepts derived from encyclopedic knowledge bases such as Wikipedia. A key insight is that the set of target documents provided for a semantic analysis task is normally insufficient; knowledge from publicly available resources, such as Wikipedia, allow much finer-grained representations of contextual word meaning to be recovered, which can significantly improve the quality of text categorization and assessments of semantic relatedness. This work represents one of the earliest and most influential investigations of using large-scale encyclopedic resources for extracting meaning representations---an idea that now lies at the heart of much work in natural language processing and information retrieval. PDF PS A Monte-Carlo AIXI Approximation 2014 Honorable Mention Joel Veness, Kee Siong Ng, Marcus Hutter, William Uther, David Silver Citation: This paper investigates the possibility of designing reinforcement learning agents based on a direct approximation of AIXI, a Bayesian notion of optimality in uncertain sequential decision making environments. Although it had been unclear whether AIXI could provide a practical foundation for designing learning agents, this paper demonstrates the first plausible realization of an AIXI agent by exploiting Monte Carlo tree search and context tree weighting algorithms. The paper presents a bold and original perspective on the difficult problem of partially observable reinforcement learning, while demonstrating impressive results on a range of applications. PDF PS Adaptive Submodularity: Theory and Applications in Active Learning and Stochastic Optimization 2013 Prize Daniel Golovin, Andreas Krause PDF PS Compiling Uncertainty Away in Conformant Planning Problems with Bounded Width 2012 Prize H. Palacios, H. Geffner PDF PS Optimal Value of Information in Graphical Models 2012 Honorable Mention A. Krause, C. Guestrin PDF PS Original Version Computationally Feasible VCG Mechanisms 2011 Prize N. Nisan, A. Ronen PDF PS Approximate Policy Iteration with a Policy Language Bias: Solving Relational Markov Decision Processes 2011 Honorable Mention A. Fern, S. Yoon, R. Givan PDF PS SATzilla: Portfolio-based Algorithm Selection for SAT 2010 Prize L. Xu, F. Hutter, H. Hoos, K. Leyton-Brown PDF PS Knowledge Derived From Wikipedia For Computing Semantic Relatedness 2010 Honorable Mention S. Ponzetto, M. Strube PDF PS CP-nets: A Tool for Representing and Reasoning with Conditional Ceteris Paribus Preference Statements 2009 Prize C. Boutilier, R. Brafman, C. Domshlak, H. Hoos, D. Poole PDF PS PS.Z The Fast Downward Planning System 2009 Honorable Mention M. Helmert PDF PS Data Pure Nash Equilibria: Hard and Easy Games 2008 Prize G. Gottlob, G. Greco, F. Scarcello PDF PS PS.Z Towards Understanding and Harnessing the Potential of Clause Learning 2008 Honorable Mention P. Beame, H. Kautz, A. Sabharwal PDF HTML PS PS.Z Efficient Solution Algorithms for Factored MDPs 2007 Prize Guestrin, C., Koller, D., Parr, R., Venkataraman, S. PDF PS PS.Z Additive Pattern Database Heuristics 2007 Honorable Mention Felner, A., Korf, R.E., Hanan, S. PDF PS PS.Z A Knowledge Compilation Map 2006 Prize Darwiche, A., Marquis, P. PDF PS PS.Z GIB: Imperfect Information in a Computationally Challenging Game 2006 Honorable Mention Ginsberg, M.L. PDF PS PS.Z The FF Planning System: Fast Plan Generation Through Heuristic Search 2005 Prize Hoffmann, J., Nebel, B. PDF PS PS.Z Data Data Code AIS-BN: An Adaptive Importance Sampling Algorithm for Evidential Reasoning in Large Bayesian Networks 2005 Honorable Mention Cheng, J., Druzdzel, M.J. PDF HTML PS PS.Z Decentralized Markets versus Central Control: A Comparative Study 2004 Prize Ygge, F., Akkermans, H. PDF PS PS.Z Markov Localization for Mobile Robots in Dynamic Environments 2004 Honorable Mention Fox, D., Burgard, W., Thrun, S. PDF HTML PS PS.Z Video Hierarchical Reinforcement Learning with the MAXQ Value Function Decomposition 2003 Prize Dietterich, T.G. PDF PS PS.Z The Computational Complexity of Probabilistic Planning 2003 Honorable Mention Littman, M.L., Goldsmith, J., Mundhenk M. PDF PS PS.Z"
