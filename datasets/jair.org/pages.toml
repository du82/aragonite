["http://jair.org/index.php/jair/faq"]
title = """
FAQ
\t\t\t\t\t\t\t| Journal of Artificial Intelligence Research"""
full_description = "FAQ Some Frequently Asked Questions What types of articles does JAIR publish? What is our Open Access Policy? Does JAIR publish special issues? How do I submit articles to JAIR? Is there a charge for submitting or publishing articles in JAIR? How do I ressubmit an article to JAIR? What if I have trouble accessing the site? What other features should I know about? Online appendices -- source code, data, and demos. Twitter notifications What is the policy for digitally archiving JAIR articles? How can I contact the editors or staff? How can I help support JAIR? What is the history of JAIR? What types of articles does JAIR publish? JAIR publishes full-length research articles, short technical notes, and survey and expository articles. See the editorial charter for more details. What is our Open Access Policy? JAIR distributes articlees for free on the public internet. Individual users may read, download, copy, distribute, print, search, or link to the full texts of indvidual articles, crawl them for indexing, pass them as data to software, or use them for any other lawful purpose as specified in our licensing terms. However, the right to publish complete volumes of the journal in print is reserved exclusively for AAAI, and therefore others may not sell or publish complete volumes of JAIR in print. Does JAIR publish special issues? JAIR publishes special tracks, which are similar to special issues except that papers are submitted during a period of time and are published asynchronously in regular issues. Once the papers designated for the special track are published, a virtual collection is created that includes all of papers and an introduction written by the editors. See the policy on special tracks for more details. How do I submit articles? JAIR articles should be submitted via our online form. See the submission information for more details. Is there a charge for submitting or publishing articles in JAIR? JAIR does not charge authors for submitting or publishing articles. How do I resubmit an article to JAIR? JAIR resubmissions should be submitted the same way as original submissions. They should not be sent directly back to the editor. See the submission information for more details. What if I have trouble accessing the site? If attempts to access our site result in a message that the server is unavailable, please send mail to editors@jair.org to notify us. What Other Features Should I Know About? Online appendices containing source code, data, and demos Some JAIR articles are accompanied by on online appendices containing source code, data or demos. Each appendix is contained in a separate file. If an article is accompanied by online appendices, this will be stated in the announcement as well as in the Table of Contents. Twitter notifications As an alternative to our mailing list, you can also follow JAIR on Twitter for announcements about new articles and other news. What is the policy for digitally archiving JAIR articles? Authors The author retains the right to post an electronic copy of the article on his or her web site, on web sites operated by the author's institution, and on scholarly repositories, provided there is no commercial purpose involved, and with appropriate bibliographic citation to the JAIR article. Repositories Scholarly repositories may archive electronic copies of JAIR articles, provided that appropriate reference is made to JAIR as the original publisher. How can I contact the editors or staff? The JAIR editors and staff can be contacted by sending email to editors@jair.org. Correspondence can also be sent by physical mail to Steven Minton, JAIR Managing Editor, AI Access Foundation, 326 Loma Vista St., El Segundo, CA, 90245, USA. How can I help support JAIR? JAIR depends first and foremost on its authors. Support JAIR by submitting high-qulity articles. JAIR also depends on its readers. Please email us with suggestions, and we certainly welcome donations to JAIR. Our publisher, AI Access Foundation, is a tax-exempt 501(c)(3) public benefit corporation. The Foundation welcomes all donations, including individual and corporate gifts of money, equipment, and personnel to help support the operation of JAIR. We recently launched the JAIR Sustainability Campaign, with the goal of raising an endowment to secure the journal's future. Individuals and organizations wishing to make financial gifts to support JAIR can do so here. Alternatively, you can make checks payable to AI Access Foundation, Inc. and send them to: Steven Minton, AI Access Foundation Secretary 326 Loma Vista St. El Segundo, CA 90245 For more information, please contact the editors at editors@jair.org What is the history of JAIR? JAIR began accepting submissions on June 15, 1993, and published its first article in August, 1993. A brief description of our history is available online. An article published in AI Magazine (Spring 1999) describing the first half decade of JAIR is also available."
year_published = 2025
