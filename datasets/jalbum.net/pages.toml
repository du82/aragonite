["https://jalbum.net/about"]
title = "The people behind jAlbum"
description = "jAlbum is a community effort. These are the people behind jAlbum, making it happen."
full_description = '''Returning from a skiing trip in 2002, founder David Ekholm intended to share his newly taken pictures with his friends. David started to look for photo album software and tried out what the market had to offer. After numerous disappointments with various album clients, being a programmer, he decided to take matters into his own hands... With jAlbum you have full control of the look of the generated album, not just the color theme and basic layout. Making an album is still just a simple matter of drag and drop, plus a button click if you prefer to use one of the many existing looks. jAlbum will process your images, make index pages, create slide show pages and even upload the final album to the Internet for your friends to see. jAlbum runs on all platforms and speaks over 30 languages. Today, jAlbum is one of the world's most popular applications for producing web photo albums. The jAlbum application has been used to publish more than twenty million albums and is downloaded more than two thousand times per day. The variety of album skins and the possibility to personalize the presentation makes jAlbum extremely flexible. jAlbum has an active community that contributes to the development of the skins, plugins and language options. More info: "I started making jAlbum after coming home from a ski trip with friends and didn't find any good software for making web albums. That was in 2002. The years since then have been the most exciting in my life, but a lot of work too. (I wouldn't mind another ski trip...) Luckily jAlbum has the best community in the world to help. /David" More info: "I have seen the development of jAlbum since the first beta version back in 2002. I also like photography. But maybe more the technical part of taking photos, than the artistic. Trying out a new lens on the SLR is great. /Anders" Connection: Designer, Skin developer: Chameleon, Turtle, Compact, Happenings, Slider, Sports, TopLeague More info: "I started my career as electric engineer and freelancer programmer but then I switched to graphics and ad industry. Now I'm getting fed up with the ads and trying to move back to programming and web-design. My hobbies are jAlbum :) , photography, travel, cooking, running. I started making Chameleon in 2005, when after I've tried several album software finally found jAlbum."'''
year_published = 2025
