title = "Features - jAlbum Software"
description = "Create stunning online photo albums with jAlbum. Discover the most powerful web album making tool there is!"
full_description = "Use the powerful jAlbum software to create professional web galleries for any website. Choose from dozens of album skins and customize to your own personal touch. With one button click jAlbum will batch process your images, scale them for the web and create web pages for you. You'll be instantly familiar with jAlbum's explorer-like user interface. Use drag-and drop to add new photos and videos. Create folders to better organize your gallery. Use the right-click menu (context menu) to access the most frequently used functions, like sorting, rotating, editing or choosing as folder thumbnail. Add captions right below the thumbnails. You can upload your galleries to any place on the internet: to your own site or blog. You can even share a gallery straight from your hard disk. If you don't own a site, use jalbum.net – our community site – which is specialized on storing, sharing and showcasing web galleries in a spectacular way. jAlbum is optimized to handle huge image volumes and can use your current folder structure. This means you can update your web galleries with more images or new features in no time at all. An average jAlbum gallery has 70 images and it is not uncommon to find galleries with 10.000 to 100.000 images presented in an organized portfolio site created with just a few clicks. Many organizations appreciate jAlbum for this aspect as they have a recurring need to update image galleries of their events. Here are some examples: Are your images laying around in a mess on various disks and memory cards? jAlbum quickly and easily organizes them into clear folder trees based on camera date (year, month etc), name or place (GPS location). Duplicates are handled and jAlbum provides multi level undo/redo so you can play around. Here are two videos showing how jAlbum handles files and how to get your images organized. Read more in our blog post →. With jAlbum there is minimal lock-in. jAlbum is a cross platform desktop software for Windows, Mac and Linux. As such it doesn't rely on central cloud services. It works within your existing folder structure (you know where your files are) and uses Adobe’s open standard for handling metadata like captions, ratings and keywords (xmp). This means it integrates well with Photoshop, Lightroom and Bridge, and your valuable metadata is kept within your image files. jAlbum’s configuration files are plain text and XML and most skins are open source that you can modify to your liking. It’s easy to start using jAlbum and it’s easy to stop using jAlbum."
