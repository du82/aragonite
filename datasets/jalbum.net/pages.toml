title = "jAlbum"
description = "Create stunning online photo albums with jAlbum. Discover the most powerful web album making tool there is!"
full_description = '''Your albums will look great and functional on every device, delivering an immersive experience for viewers across all screen sizes. Check out these templates: Story, Projector, Mercury, FancyBox, Neptune, Animatics, Lucid, Projector, Zigzag, Saturn, Tiger, PhotoSwipe, Photoblogger! When it comes to a quick presentation, there's no point in spending much time polishing the details. Just drag and drop the images, press the "Make album" button, and you're ready to go in no time. Check out these minimalistic templates for the quickest results: Plain, Neptune and Mercury. Colors, fonts, custom logos, layout variations – our templates offer countless possibilities for those who'd like to raise their websites to the next level. No other album creator software comes close to jAlbum in customization possibilities. Many templates come with predefined About, Contact, or Sitemap pages, and you can even create a custom page from the ground. These pages not only can act as a standalone page, but you can mix them into the "normal" pages. Check out the Tiger, Story and Photoblogger templates if you're interested in full website creation." You can create huge albums in jAlbum complete with search and keyword tagging features so your visitors can easily navigate through the album. With jAlbum it's truly easy to sell your images (or the items they show). It only takes a couple of minutes to set up an album that is fitted with a shopping cart. You decide the pricing and products to sell. In large albums or webshops it’s sometimes hard to find the content you’re after. Filtering and sort lets visitors find images by labels, categories, price or anything; you can define your own custom variables too for this purpose. Add videos, background music or whatever content you wish – they integrate with photos smoothly. You can even include external websites or YouTube videos in the album. Use your 360° camera photos in the Tiger or Photoblogger templates for an immersive experience! Normal panorama images are supported by even more templates, just make sure the Image bounds are wide enough – e.g. 6000px will do – so jAlbum won’t crop them!'''
