["https://jalbum.net/help/en/Developer_center"]
title = "Developer center - jAlbum Wiki"
full_description = '''Are you a developer? Want to learn how to develop skins for albums published with jAlbum, or how to write plugins for the application? Our developer center contains all the information you need, and more. If you are creating a new or modifying an existing skin, there are a few rules about naming the skin: If you're using any third-party code, make sure you're not violating the licensing terms imposed by the author of that code. Remember that even if you're not charging people for using your skin, jAlbum itself could be deemed to be "selling" the code used in your skin. If any code used requires accreditation, or a license to be included, ensure you conform to the stated terms. Accreditation should be done both to the stated terms and in the spirit of those terms, e.g. if a link to a website or a credit text it must be clearly and permanently visible. Want to learn how to write your own jAlbum skin? Or perhaps you just want to know how you can enhance your favorite one? The skin development section of the developer center covers all you need to know when working with jAlbum skins. For model skins, showing how to implement specific functions see this thread in the skin developer forum If you decide to compile your skin, see tutorial below on compiling in NetBeans, note that you should use Java 14 as the Source/Binary Skins extend the way jAlbum present albums. Plugins extend jAlbum itself. In the plugin development section you will learn how to make your own plugins. The jAlbum desktop application is partly open source and can be extended in all sorts of ways. You can learn how to write your own image filter or external tool by browsing the API. If you need help during development, use our development forum section! Note that when external tools are run variables, such as rootFolder, are bound just before script execution begins while a method call, like window.explorer.getRootFolder() does a dynamic lookup. So if you don’t get the expected result from a variable use an api call instead.'''
year_published = 2025
