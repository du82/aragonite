title = "jAlbum - Free Photo Gallery Website Software"
description = "Create stunning online photo albums with jAlbum. Discover the most powerful web album making tool there is!"
full_description = '''Just drag and drop images (and videos) onto jAlbum, press "Make" and your website is ready to upload to your own site. Or to jalbum.net if you don't have one. Unlike competing image sharing services, we don't lock your photos into one single place. YOU have full control of the management, storage and presentation of YOUR images. Furthermore, your precious metadata is managed using open standards = no lock in. Host your images with us or with ANY web hotel you like. Your galleries will work - even without us. Being a desktop software, jAlbum makes it natural and convenient to manage large amounts of images on a regular basis. You shouldn't have to start by uploading your images and videos to an online service in order to pick the best ones for presentation and add captions. This is better done locally, and it works offline too! The albums generated by jAlbum do no rely on server-side scripting, which ensures no harmful code can sneak into your server by these pages. Even though we offer loads of features, making a good looking gallery is still as easy as dropping images onto jAlbum and pressing one button. Competitors offer few choices for stylish presentations (typically only CSS variations to the same functionality). With jAlbum you have a rich variety of templates / themes (we call them skins) to choose from, each offering unique functionality as well as presentation. We've been in business since 2002. To date, there are over 120 million galleries published world wide. jAlbum also enjoys an extremely high user satisfaction score of 4.7/5 in TrustPilot. Many of users have been with us for decades. jAlbum has according to our opinion secured its position as the best program to manage and present your pictures and albums on the web, no matter if you're using your own site or jAlbum's storage service. jAlbum gives you complete freedom to upload your albums to any website. You are not bound to any one service. I love jAlbum, but don’t take my word for it, read what our great customers have to say.'''
