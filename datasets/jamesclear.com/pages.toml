["https://jamesclear.com/3-2-1/april-16-2020"]
title = "3-2-1: On correcting mistakes, youth, and focus - James Clear"
description = "3 IDEAS FROM ME I. “Correct your mistakes before they become your habits.” II. “Balance is timing, not intensity. It is not doing multiple tasks at 80%, but developing the skill of turning it on and turning it off. Sleep fully, then work intensely. Focus deeply, then relax completely. Give each phase your full attention. […]"
full_description = "Sleep fully, then work intensely. Focus deeply, then relax completely. Give each phase your full attention. “Youth is not a time of life; it is a state of mind; it is not a matter of rosy cheeks, red lips and supple knees; it is a matter of the will, a quality of the imagination, a vigor of the emotions; it is the freshness of the deep springs of life. Youth means a temperamental predominance of courage over timidity of the appetite, for adventure over the love of ease. This often exists in a man of sixty more than a boy of twenty. Nobody grows old merely by a number of years. We grow old by deserting our ideals. Years may wrinkle the skin, but to give up enthusiasm wrinkles the soul. Worry, fear, self-distrust bows the heart and turns the spirit back to dust. Whether sixty or sixteen, there is in every human being’s heart the lure of wonder, the unfailing child-like appetite of what’s next, and the joy of the game of living.” James ClearAuthor of the million-copy bestseller, Atomic HabitsCreator of The Habits Academy and the Habit Journal Thanks for reading. You can get more actionable ideas in my popular email newsletter. Each week, I share 3 short ideas from me, 2 quotes from others, and 1 question to think about. Over 3,000,000 people subscribe. Enter your email now and join us. The 3-2-1 Newsletter is one of the most popular newsletters in the world. Over 3,000,000 people subscribe. Each issue contains 3 short ideas from James Clear, 2 quotes from other people, and 1 question for you."
