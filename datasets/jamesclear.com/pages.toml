["https://jamesclear.com/3-2-1/april-15-2021"]
title = "3-2-1: On learning by doing, a rule to live by, and the seasons of life - James Clear"
description = "3 IDEAS FROM ME I. “Whenever you are stuck searching for the optimal plan, remember: Getting started changes everything.” ​II. “The desire to improve does not have to come from a place of self-loathing.” III. “The teacher learns more than the student. The author learns more than the reader. The speaker learns more than the […]"
full_description = "“We are in the habit of imagining our lives to be linear, a long march from birth to death in which we mass our powers, only to surrender them again, all the while slowly losing our youthful beauty. This is a brutal untruth. Life meanders like a path through the woods. We have seasons when we flourish and seasons when the leaves fall from us, revealing our bare bones. Given time, they grow again.” Thanks for reading. You can get more actionable ideas in my popular email newsletter. Each week, I share 3 short ideas from me, 2 quotes from others, and 1 question to think about. Over 3,000,000 people subscribe. Enter your email now and join us. The 3-2-1 Newsletter is one of the most popular newsletters in the world. Over 3,000,000 people subscribe. Each issue contains 3 short ideas from James Clear, 2 quotes from other people, and 1 question for you."
