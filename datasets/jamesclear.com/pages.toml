["https://jamesclear.com/3-2-1/april-1-2021"]
title = "3-2-1: On mentors, margin of safety, and how to say no - James Clear"
description = "3 IDEAS FROM ME I. “Fear of failure is higher when you’re not working on the problem. If you are taking action, you are less worried about failure because you realize you can influence the outcome.” ​II. “You can often learn more from peers who are 2 years ahead of you than mentors who are […]"
full_description = "If you are taking action, you are less worried about failure because you realize you can influence the outcome.” “You can often learn more from peers who are 2 years ahead of you than mentors who are 20 years ahead of you. “The biggest fear most of us have with learning to say no is that we will miss an opportunity. An opportunity that would have catapulted us to success, or that will never come again. And most of the time, that simply isn’t true.​I’ve found that the first part of learning to say no is learning to accept that offers and opportunities are merely an indication that you’re on the right path—not that you’ve arrived at a final destination you can never find again.​If someone is choosing you, it means you’re doing something right. And that is the biggest opportunity you can receive—the chance to recognize that your hard work is paying off. And if you continue to do good work, those opportunities will continue—and improve—over time.” It is extraordinary to discover that comparatively few people reach this level of maturity. They seem never to have paused to consider what has value for them. They spend great effort and sometimes make great sacrifices for values that, fundamentally, meet no real needs of their own. Perhaps they have imbibed the values of their particular profession or job, of their community or their neighbors, of their parents or family. Not to arrive at a clear understanding of one’s own values is a tragic waste. You have missed the whole point of what life is for.” Thanks for reading. You can get more actionable ideas in my popular email newsletter. Each week, I share 3 short ideas from me, 2 quotes from others, and 1 question to think about. Over 3,000,000 people subscribe. Enter your email now and join us. The 3-2-1 Newsletter is one of the most popular newsletters in the world. Over 3,000,000 people subscribe. Each issue contains 3 short ideas from James Clear, 2 quotes from other people, and 1 question for you."
