["https://jamesclear.com/3-2-1/april-18-2024"]
title = "3-2-1: Two ways to grow, how to criticize, and a simple recipe for finding good opportunities - James Clear"
description = "3 IDEAS FROM ME I. “Wisdom is the echo of experience.” ​II. “Early feedback is usually better than late criticism. Delaying the conversation or stringing someone along with indirect feedback won’t make them feel better once the real issue is finally addressed. Nobody likes getting bad news, but everyone appreciates clarity.” III. “A simple recipe […]"
full_description = "“Early feedback is usually better than late criticism. Delaying the conversation or stringing someone along with indirect feedback won’t make them feel better once the real issue is finally addressed. Nobody likes getting bad news, but everyone appreciates clarity.” It’s hard for a warm and pleasant person who is asking a lot of questions and engaging in their industry daily to not come across interesting opportunities.” “If you’re trying to choose between two theories and one gives you an excuse for being lazy, the other one is probably right.” “Good and evil both increase at compound interest. That is why the little decisions you and I make every day are of such infinite importance. The smallest good act today is the capture of a strategic point from which, a few months later, you may be able to go on to victories you never dreamed of. An apparently trivial indulgence in lust or anger today is the loss of a ridge or railway line or bridgehead from which the enemy may launch an attack otherwise impossible.” James Clear Author of ​Atomic Habits​, the #1 best-selling book Creator of ​Atoms​, the official Atomic Habits app Writer of the ​3-2-1 newsletter​ with 3 million subscribers Thanks for reading. You can get more actionable ideas in my popular email newsletter. Each week, I share 3 short ideas from me, 2 quotes from others, and 1 question to think about. Over 3,000,000 people subscribe. Enter your email now and join us. The 3-2-1 Newsletter is one of the most popular newsletters in the world. Over 3,000,000 people subscribe. Each issue contains 3 short ideas from James Clear, 2 quotes from other people, and 1 question for you."
