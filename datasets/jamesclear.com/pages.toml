title = "3-2-1: On getting what you deserve, the power of flexibility, and how good decisions are made - James Clear"
description = "3 IDEAS FROM ME I. “People frequently get what they deserve, but it doesn’t feel like it because the unspoken rule is that you only deserve it if you have (1) the courage to attempt it, (2) the guts to ask for it, and (3) the willingness try again when it doesn’t work out the […]"
full_description = "“People frequently get what they deserve, but it doesn’t feel like it because the unspoken rule is that you only deserve it if you have (1) the courage to attempt it, (2) the guts to ask for it, and (3) the willingness try again when it doesn’t work out the first time.” You can’t learn all the lessons beforehand. You learn a lot about what you want in a marriage after getting married. You discover what type of career you enjoy after doing a lot of work. And so it goes in nearly every area of life. In many cases, what you wish you knew ahead of time can only be learned after the decision is made. So there is nothing left but to pay attention to what you like, continue to iterate, and commit to making the most of each opportunity. There is no perfect decision. Good decisions are made right after the fact.” “If you make lists of lofty goals, it can be easy to leave them to accumulate, as happens sometimes, into a mountain of to-do’s and notes and half-forgotten plans. Dreaming alone is seductive, even a little sweet, since it lacks the pain of trying. So it feels proper to prize attempts more than dreams. You should have ideals, but you cannot only love an idealized future, you must cultivate a love of effort, too. If you really want something, then the soul must make demands of the body.” Instead of running from parts of your life and compensating elsewhere, what if you began to restore what is broken? James Clear ​​​ Author of ​Atomic Habits​ Creator of the ​3-2-1 Newsletter​ Founding Author of ​Authors Equity​ Thanks for reading. You can get more actionable ideas in my popular email newsletter. Each week, I share 3 short ideas from me, 2 quotes from others, and 1 question to think about. Over 3,000,000 people subscribe. Enter your email now and join us. The 3-2-1 Newsletter is one of the most popular newsletters in the world. Over 3,000,000 people subscribe. Each issue contains 3 short ideas from James Clear, 2 quotes from other people, and 1 question for you."
