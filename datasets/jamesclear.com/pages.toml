["https://jamesclear.com/3-2-1/april-13-2023"]
title = "3-2-1: The work required to be happy, and important lessons that aren't taught in school - James Clear"
description = "3 IDEAS FROM ME I. “You are the average of the 5 habits you repeat most.” ​II. “Speed is perpetually undervalued. Asking that person out today means you get to live more of your life with them and less of your life waiting. Starting your business today means you begin learning immediately and have more […]"
full_description = "Asking that person out today means you get to live more of your life with them and less of your life waiting. Starting your business today means you begin learning immediately and have more time to figure out what works. “Many people won’t attempt something unless they can find an example of someone else who is already doing it. Rely on this type of thinking too much and you’ll never do anything interesting. Your path through life is unique. It is important to extract lessons from the experiences of others, but you can’t wait for a perfect example to take action. You are the example.” “Let no one think it is an easy way because it is concerned with moments of happiness rather than with stern duty or high moral endeavour. For what is really easy, as I found, is to blind one’s eyes to what one really likes, to drift into accepting one’s wants ready-made from other people, and to evade the continual day to day sifting of values.” Mike Markkula, an electrical engineer and investor who worked alongside Steve Jobs and eventually became the first chairman of Apple Computer, shares a few of the company’s core principles: Focus. In order to do a good job of those things we decide to do we must eliminate all of the unimportant opportunities. Impute. People DO judge a book by its cover. We may have the best product, the highest quality, the most useful software, etc.; if we present them in a slipshod manner, they will be perceived as slipshod; if we present them in a creative, professional manner, we will impute the desired qualities.” What is one important lesson for life that isn’t taught in school, but that you want to teach to your kids? Thanks for reading. You can get more actionable ideas in my popular email newsletter. Each week, I share 3 short ideas from me, 2 quotes from others, and 1 question to think about. Over 3,000,000 people subscribe. Enter your email now and join us. The 3-2-1 Newsletter is one of the most popular newsletters in the world. Over 3,000,000 people subscribe. Each issue contains 3 short ideas from James Clear, 2 quotes from other people, and 1 question for you."
