["https://jamesclear.com/3-2-1/april-2-2020"]
title = "3-2-1: Helping others, focus, and the difference between ambition and happiness - James Clear"
description = "3 IDEAS FROM ME I. “Before you ask for readers, write the article you wish you could read. Before you ask for the sale, create the product you wish you had. Before you need support, be the supportive friend. Before you need love, be the loving partner. Always give value before you ask for value.” […]"
full_description = "“Each day is a new battle to say yes to what matters and say no to what doesn’t. Focus is a practice.” -pushups is a solid workout-sprints will leave you winded-conversation can rekindle a relationship-reading can finish an insightful article-meditation can reset your mood “Loving someone means helping them to be more themselves, which can be different from being what you’d like them to be, although often they turn out the same.” Bill Watterson, the cartoonist and creator of Calvin and Hobbes, on the difference between ambition and happiness: “…having an enviable career is one thing, and being a happy person is another. Creating a life that reflects your values and satisfies your soul is a rare achievement. In a culture that relentlessly promotes avarice and excess as the good life, a person happy doing his own work is usually considered an eccentric, if not a subversive. Ambition is only understood if it’s to rise to the top of some imaginary ladder of success. Someone who takes an undemanding job because it affords him the time to pursue other interests and activities is considered a flake. A person who abandons a career in order to stay home and raise children is considered not to be living up to his potential-as if a job title and salary are the sole measure of human worth. You’ll be told in a hundred ways, some subtle and some not, to keep climbing, and never be satisfied with where you are, who you are, and what you’re doing. There are a million ways to sell yourself out, and I guarantee you’ll hear about them. To invent your own life’s meaning is not easy, but it’s still allowed, and I think you’ll be happier for the trouble.” James ClearAuthor of the million-copy bestseller, Atomic HabitsCreator of The Habits Academy and the Habit Journal Thanks for reading. You can get more actionable ideas in my popular email newsletter. Each week, I share 3 short ideas from me, 2 quotes from others, and 1 question to think about. Over 3,000,000 people subscribe. Enter your email now and join us."
