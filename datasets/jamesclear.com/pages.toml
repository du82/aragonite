["https://jamesclear.com/3-2-1/february-6-2025"]
title = "3-2-1: On grief and friendship, the value of reputation, and prevailing when you're in a tight spot - James Clear"
description = "3 IDEAS FROM ME I. “When accessing all information is common, paying attention to important information is rare.” (​​Share this on X​​) ​II. “On funerals, loss, grief, friendship, and support: It’s not about knowing what to say. It’s about being there when nobody knows what to say. The only thing people need to hear is, […]"
full_description = "It’s not about knowing what to say. It’s about being there when nobody knows what to say. The only thing people need to hear is, “You are not alone.” And that doesn’t require words. It just requires your presence.” “When you get into a tight place, and everything goes against you till it seems as if you couldn’t hold on a minute longer, never give up then, for that’s just the place and time that the tide’ll turn.” “My wish for you is that you continue. Continue to be who you are, to astonish a mean world with your acts of kindness. The effect you have on others’ lives is the highest expression of your own.” It’s hard to get a great outcome when your resources — time, money, attention — are spread thin. Are you concentrating your energies on a small set of targets? James Clear ​​​ Author of ​Atomic Habits​ Creator of the ​3-2-1 Newsletter​ Founding Author of ​Authors Equity​ Thanks for reading. You can get more actionable ideas in my popular email newsletter. Each week, I share 3 short ideas from me, 2 quotes from others, and 1 question to think about. Over 3,000,000 people subscribe. Enter your email now and join us. The 3-2-1 Newsletter is one of the most popular newsletters in the world. Over 3,000,000 people subscribe. Each issue contains 3 short ideas from James Clear, 2 quotes from other people, and 1 question for you."
