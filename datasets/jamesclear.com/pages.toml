["https://jamesclear.com/3-2-1/april-11-2024"]
title = "3-2-1: What top performers do, and how to deal with critics and detractors - James Clear"
description = "3 IDEAS FROM ME I. “You don’t need to worry about progressing slowly. You need to worry about climbing the wrong mountain.” ​II. “If you already live a comfortable life, then choosing to make more money but live a worse daily life is a bad trade. And yet, we talk ourselves into it all the […]"
full_description = "“You don’t need to worry about progressing slowly. You need to worry about climbing the wrong mountain.” “If you already live a comfortable life, then choosing to make more money but live a worse daily life is a bad trade. And yet, we talk ourselves into it all the time. We take promotions that pay more, but swallow our free time. We already have a successful business, but we break ourselves trying to make it even more successful. “Mastery is not only about getting better at your craft, but also about finding ways to eliminate the obstacles, distractions, and other annoyances that prevent you from working on your craft. Top performers find ways to spend as much time as possible on what matters and as little time as possible on what doesn’t. It is not someone else’s responsibility to create the conditions for success. You have to actively work to eliminate the things that don’t matter from your workload. If you haven’t figured out how to do that, you haven’t mastered your craft.” Poet and writer Joseph Brodsky on how to deal with the critics, detractors, and negative influences in your life: “Try not to pay attention to those who will try to make life miserable for you. There will be a lot of those — in the official capacity as well as the self-appointed. Suffer them if you can’t escape them, but once you have steered clear of them, give them the shortest shrift possible. Above all, try to avoid telling stories about the unjust treatment you received at their hands; avoid it no matter how receptive your audience may be. Tales of this sort extend the existence of your antagonists; most likely they are counting on your being talkative and relating your experience to others. By himself, no individual is worth an exercise in injustice (or for that matter, in justice). The ratio of one-to-one doesn’t justify the effort: it’s the echo that counts. That’s the main principle of any oppressor, whether state-sponsored or autodidact. Therefore, steal, or still, the echo, so that you don’t allow an event, however unpleasant or momentous, to claim any more time than it took for it to occur. What your foes do derives its significance or consequence from the way you react. Therefore, rush through or past them as though they were yellow and not red lights. Don’t linger on them mentally or verbally; don’t pride yourself on forgiving or forgetting them — worse come to worse, do the forgetting first. This way you’ll spare your brain cells a lot of useless agitation; this way, perhaps, you may even save those pigheads from themselves, since the prospect of being forgotten is shorter than that of being forgiven. So flip the channel: you can’t put this network out of circulation, but at least you can reduce its ratings.”"
