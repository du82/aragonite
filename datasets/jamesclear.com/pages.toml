["https://jamesclear.com/about"]
title = "About James Clear"
description = "Read this page to learn about James Clear, his work, and his mission."
full_description = "I’ve been writing at JamesClear.com about habits, decision making, and continuous improvement since 2012. I’m the author of the #1 New York Times bestseller, Atomic Habits, which has sold more than 20 million copies worldwide and has been translated into more than 60 languages. I’m also known for my popular 3-2-1 newsletter, which is sent out each week to more than 3 million subscribers. Click here to learn more and sign up. I’m an advocate for useful ideas. The central question I explore through my work is, “How can we live better?” In other words, I want to find great ideas and explain them in a way that is easy to use and apply to daily life. Most of the concepts I write about aren’t my own. They are ideas I discover and build upon after many hours of reading and research. I look for insights from all fields: architecture, biology, economics, history, mathematics, physics, philosophy, and more. I consider it my job to find the best ideas and explain them in a way that is actionable and easy-to-understand. Humankind progresses by adding layer upon layer of knowledge. We all benefit from the insights of our ancestors. I like the idea of leaving a great “intellectual inheritance,” and I’m trying to add a little bit of knowledge to the pile by creating this website and sharing my work. I don’t claim to have all the answers and I still have a lot to learn, but I’m happy to share what I’ve discovered so far. My work isn’t the only way to think about life, but it’s how I think about it. Hopefully, you’ll find it useful as well. In 2017, I began donating 5% of after-tax profit to charitable causes. My primary charity partner is Against Malaria Foundation (AMF). AMF distributes nets to protect children, pregnant mothers, and families from mosquitos carrying malaria. It is one of the most cost-effective ways to increase lifespan. To date, we have provided nets for over 319,000 people. As a side project, I like to search for insightful speeches that are not well known. Whenever I find a gem, I create a transcript and add it to my list of great speeches. To the best of my knowledge, this is the only place on the web where you can find all of these amazing speeches in one place."
