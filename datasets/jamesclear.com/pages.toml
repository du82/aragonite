d applicable data protection laws you have the rights, among other things, to access your personal data, have us erase it, and/or restrict its further processing. If you wish to access or delete your personal data (if any) maintained by us or AdThrive related to advertising on the Site, you can contact AdThrive at [email protected]. If you wish to see a list of the advertising partners we work with or change which of those partners track your behavior using cookies, click the ad preferences icon. (Available in the EU.) Email Addresses We may collect your email address, but only if you voluntarily provide it to us. This may occur, for example, if you sign up to receive an email newsletter or free product from the Site. We will use your email address for the purposes for which you provided it to us, and also from time to time to send you emails regarding the Site or other products or services that we believe may be of interest to you. You may opt out of such email communications at any time by clicking the “unsubscribe” button in the email. Your email address may also be shared with the technology provider we use in connection with the purposes for which you provided it, and that technology provider may also contact you from time to time. If you are a resident of a country in the European Economic Area (EEA), please refer to the section below entitled “Additional Rights of EEA Residents.” Account Data JamesClear.com strives to offer its visitors the many advantages of Internet technology and to provide an interactive and personalized experience. We may use Personally Identifiable Information (your name, e-mail address, street address, telephone number, etc.) subject to the terms of this privacy policy. We will never sell, barter, or rent your email address to any unauthorized third party. Period. How we gather information from users How we collect and store information depends on the page you are visiting, the activities in which you elect to participate, and the serv