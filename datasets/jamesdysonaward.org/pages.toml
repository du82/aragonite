"imageUrl":"/Document/b74bb927-1e1e-4e09-999e-e465efd969b8/usr-4825-img-1500235793-8007d.jpg"},{"id":"e6d29d85-ca0d-46fd-8aa0-498705a249ab","name":"airXeed Radiosonde","description":"A nature-friendly radiosonde designed to save the environment and enhance weather prediction.","nameTruncated":"airXeed Radiosonde","descriptionTruncated":"A nature-friendly radiosonde designed to save the environment and enhance weather prediction.","badge":"Sustainability winner","projectUrl":"/2024/project/airxeed-radiosonde","imageUrl":"/Document/8a9ff81c-13f2-4bde-a7cf-647dc411c2dc/jda-pics001.png"},{"id":"a683b8cf-5588-4393-9d64-adbf590529c0","name":"E-COATING","description":"E-COATING is an eco-friendly and affordable roof and exterior wall coating with a high cooling effect for electricity-free cooling. The material is mainly made of waste glass and VOC-free binder.","nameTruncated":"E-COATING","descriptionTruncated":"E-COATING is an eco-friendly and affordable roof and exterior wall coating with a high cooling effect for electricity-free cooling. The material is mainly made of waste glass and VOC-free binder.","badge":"Sustainability winner","projectUrl":"/2023/project/e-coating","imageUrl":"/Document/bd99511a-900f-4409-b44f-15313cca071d/main-picture.jpg"},{"id":"af03910d-3200-4b8c-a054-4d8d34038097","name":"Polyformer - Plastic Bottles to Filament in Rwanda","description":"An open-source machine that recycles waste plastics into 3D printer filament.","nameTruncated":"Polyformer - Plastic Bottles to Filament in Rwanda","descriptionTruncated":"An open-source machine that recycles waste plastics into 3D printer filament.","badge":"Sustainability winner","projectUrl":"/2022/project/polyformer-plastic-bottles-to-filament-in-rwanda","imageUrl":"/Document/eefc4f6c-bc6e-46e1-805b-b839de109f4d/polyformer-1.png"},{"id":"720e2f17-72da-4c86-80a3-22336069556c","name":"Plastic Scanner","description":"An open-source design with which anybody can build a scanner that tells you what type of plastic a waste item is.","nameTruncated":"Plastic Scanner","descriptionTruncated":"An open-source design with which anybody can build a scanner that tells you what type of plastic a waste item is.","badge":"Sustainability winner","projectUrl":"/2021/project/plastic-scanner","imageUrl":"/Document/4e6e1220-1c98-4a82-91bb-3cceb870981d/img5118-min.jpg"},{"id":"543a8a5b-1031-45a2-b270-cff60919e2ee","name":"AuREUS: Aurora Renewable Energy & UV Sequestration","description":"The AuREUS system is an evolution for walls/windows, and uses technology synthesized from upcycled crop waste to absorb stray UV light from sunlight and convert it to clean renewable electricity.","nameTruncated":"AuREUS: Aurora Renewable Energy & UV Sequestration","descriptionTruncated":"The AuREUS system is an evolution for walls/windows, and uses technology synthesized from upcycled crop waste to absorb stray UV light from sunlight and convert it to clean renewable electricity.","badge":"Sustainability winner","projectUrl":"/2020/project/aureus-aurora-renewable-energy-uv-sequestration","imageUrl":"/Document/423769c8-8f23-41d9-ad68-67078e17747f/img20200715121623.jpg"},{"id":"608a36a6-dea4-435b-91fb-32e55b91c9d0","name":"ivvy","description":"intravenous therapies are often moved to the home setting. ivvy is a product solution that aligns with the needs of patients and home nurses in this new setting.","nameTruncated":"ivvy","descriptionTruncated":"intravenous therapies are often moved to the home setting. ivvy is a product solution that aligns with the needs of patients and home nurses in this new setting.","badge":"International Runner Up","projectUrl":"/2022/project/ivvy","imageUrl":"/Document/6f123041-323e-425b-aef4-61a29c1e7276/foto1.jpg"},{"id":"45948306-67f6-407b-ab10-148f42321858","name":"The Tyre Collective","description":"We are The Tyre Collective, and our patent pending technology captures tyre wear right at the wheel; safeguarding us from the second largest microplastic pollutant in our environment.","nameTruncated":"The Tyre Collective","descriptionTruncated":"We are The Tyre Collective, and our patent pending technology captures tyre wear right at the wheel; safeguarding us from the second largest microplastic pollutant in our environment.","badge":"International Runner Up","projectUrl":"/2020/project/the-tyre-collective","imageUrl":"/Document/eda5b808-c506-4038-9120-838467573ec9/ttc1detail.jpg"},{"id":"c3bae069-8f7a-4517-9259-94c78279bb0b","name":"Scope","description":"Electrically tunable lenses enabling lossless zoom and compact cameras with higher image quality and lower costs for smartphones, AR/VR, LiDAR scanning, machine vision, microscopes, and beyond.","nameTruncated":"Scope","descriptionTruncated":"Electrically tunable lenses enabling lossless zoom and compact cameras with higher image quality and lower costs for smartphones, AR/VR, LiDAR scanning, machine vision, microscopes, and beyond.","badge":"International Runner Up","projectUrl":"/2020/project/scope-1","imageUrl":"/Document/1b0bc05e-2846-4ae2-8c49-898cbe240143/1.png"},{"id":"18999496-86ce-4178-970e-06a314b634bb","name":"Afflo","description":"Afflo is an AI-enabled wearable device to monitor asthmatic symptoms and predict triggers, allowing users to make data driven decisions about their asthma management, improving quality of life.","nameTruncated":"Afflo","descriptionTruncated":"Afflo is an AI-enabled wearable device to monitor asthmatic symptoms and predict triggers, allowing users to make data driven decisions about their asthma management, improving quality of life.","badge":"International Runner Up","projectUrl":"/2019/project/afflo","imageUrl":"/Document/80a58b66-d5ce-4a15-a0b8-02f058326ed7/img3582.jpeg"},{"id":"46a19dc3-7cce-4be7-898b-c6470184607f","name":"Gecko Traxx","description":"portable off-road access for wheelchair users.","nameTruncated":"Gecko Traxx","descriptionTruncated":"portable off-road access for wheelchair users.","badge":"International Runner Up","projectUrl"