["https://jamesdysonaward.org/privacy-policy"]
title = "Privacy Policy | James Dyson Award"
full_description = '''Privacy Policy Overview – the key information you should be aware of (A) Who we are: We are James Dyson Foundation. If you need it, our company number is 04601338 and our registered office is Tetbury Hill, Malmesbury, SN16 0RP, UK. James Dyson Foundation is the controller of your personal information, and is responsible for your personal information. All references in this policy to "James Dyson Foundation", "our", "us" or "we" refer to James Dyson Foundation. All references in this policy to "our website", refer to the website owned by James Dyson Foundation at www.jamesdysonfoundation.co.uk and www.jamesdysonaward.org (B) Our values and what this policy is for: We value your privacy and want to be accountable and fair to you as well as transparent with you in the way that we collect and use your personal information. We also want you to know your rights in relation to your information which you can find in section 6. In line with these values, this privacy policy tells you what to expect when we collect and use personal information about you. We have tried to make it easy for you to navigate so you can find the information that is most relevant to you and our relationship with you. (C) Who this policy applies to: This policy applies to: 1. Visitors to our website; 2. James Dyson Award applicants and other individuals requesting a bursary; 3. General public or organisations requesting charitable support; 4. Students at schools which are collaborating with us; 5. Teachers at schools which are collaborating with us; 6. Individuals to whom we send communications; 7. People who contact us with enquiries; 8. Third parties who we interact with such as universities and staff at universities, our moderators for the James Dyson Award and other suppliers and employees of our suppliers; and 9. Attendees at James Dyson Foundation events. Depending on our relationship, we will collect and use your information in different ways. Please click on the links above to find out the information that we collect about you and how we use this information. (D) What this policy contains: This privacy policy describes the following important topics relating to your information: 1. How we obtain your personal information (Section 1); 2. Collection of your personal information and how we use it (Section 2); 3. Our legal basis for using your personal information (Section 3); 4. How and why we share your personal information with others (Section 4); 5. How long we store your personal information (Section 5); 6. Your rights (Section 6); 7. Where we may transfer your personal information (Section 8); 8. How we keep your personal information secure (Section 9); 9. Changes to this privacy policy (Section 12); and 10. Further questions and how to make a complaint (Section 11) (E) Your rights to object: You have various rights in respect of our use of your personal information as set out in section 6. Two particular rights to be aware of are that: 1. You may ask us to stop using your personal information for direct-marketing purposes. If you exercise this right, we will stop using your personal information for this purpose. 2. You may ask us to consider any valid objections which you have to our use of your personal information where we process your personal information on the basis of our, or another person's, legitimate interest. You can find out more information in section 6. (F) What you need to do and your confirmation to us: Please read this privacy policy carefully to understand how we handle your personal information. By engaging with us in the ways set out in this privacy policy, you confirm that you have read and understood the entirety of this privacy policy, as it applies to you. 1. How we obtain your personal information 1.1 You may provide us with your personal information voluntarily. We may also receive information about you from third parties where we have a legal basis to do so such universities, James Dyson Award moderators, group companies, public websites and public agencies, which we refer to as "third party sources" or "suppliers" throughout this policy. 1.2 You may give us personal information about yourself by using the online forms provided on our website or by contacting us by phone, email or other means. This includes, for example, where you provide your personal information to us in order to receive information or services from us. If you are a supplier, you may also give us personal information about you when you are offering or providing services to us. 2. Collection of your personal information and how we use it Please go to the section or sections below that best describes our relationship with you to find out the information that we collect about you and how we use this information. We refer to this as "personal information" throughout this policy. 2.1 Visitors to our website (a) What personal information we collect about you We, or third parties on our behalf, may collect and use any of the following information about you: (i) your name including your title; (ii) your postal address; (iii) your email address; (iv) your telephone number; (v) information provided when you correspond with us; (vi) any updates to information provided to us; (vii) the following information created and recorded automatically when you visit our website: (A) Technical information. This includes: the Internet Protocol (IP) address used to connect your computer to the internet address; the website address and country from which you access information; the files requested; browser type and version; browser plug-in types and versions; operating system; and platform. We use this personal information to administer our website, to measure the efficiency of our systems and to undertake an analysis on the locations from which people access our webpages; (B) Information about your visit and your behaviour on our website (for example, the pages that you click on). This may include the website you visit before and after visiting our website (including date and time), time and length of visits to certain pages, page interaction information (such as scrolling, clicks, and mouse-overs), methods used to browse away from the page, traffic data, location data, weblogs and other communication data and information provided when requesting further service or downloads. (b) How we use your personal information We will collect, use and store the personal information listed above for the following reasons: (i) to allow you to access, use our website; (ii) to receive enquiries from you through the website; (iii) for improvement and maintenance of our website and to provide technical support for our website; (iv) to ensure the security of our website; (v) to recognise you when you return to our website and store information about your preferences so that we can customise the website according to your individual interests or send you targeted advertising on social media sites; and (vi) to evaluate your visit to the website and prepare reports or compile statistics to understand the type of people who use our website, how they use our website and to make our website more intuitive. Such details will be anonymised as far as reasonably possible and you will not be identifiable from the information collected. Please see sections 2.10 and 2.11 for more details about how we use your personal information. 2.11 Cookie Policy We use cookies across our website. “Cookies” are small text files that websites save onto your computer via your web browser. Many essential website functions rely on cookies. The cookies that we use don’t collect any personal information about you and they can’t harm your computer, tablet or mobile phone. They are there to allow our website to work, and to help us understand what information is most useful to our website visitors. Please read the following to understand the types of cookies and how they are used. (a) Essential cookies: these cookies are used to ensure our site can function correctly. (b) Tracking cookies: these cookies are used to meausre and analyse how our site users use the site. By using this website, you accept that the James Dyson Award may set cookies on your computer or mobile device. If we change our cookies policy, any changes will be posted on this page without notification. Questions regarding this cookies policy should be directed to JDA-support@jamesdysonaward.com 2.2 James Dyson Award applicants and other individuals requesting a bursary (a) What personal information we collect about you We, or third parties on our behalf, may collect and use any of the following information about you: (i) your name; (ii) your postal address; (iii) your email address; (iv) your telephone number; (v) your age; (vi) your gender; (vii) university attended, degree subject and proof of study; (viii) profile photograph; (ix) social media URL; (x) information provided when you correspond with us; (xi) information provided in your James Dyson Award application or bursary application; (xii) any updates to information provided to us; (xiii) information you provide to help us provide you with improved service, for example if we ask you to fill in a survey or questionnaire; and (b) How we use your personal information We will collect, use and store the personal information listed above for the following reasons: (i) to assess your application for the James Dyson Award or the bursary and, if applicable, administer the award or bursary to you; (ii) to deal with any of your enquiries; (iii) to send you certain communications (including by email or post) about our services such as administrative messages (for example, setting out changes to our terms and conditions and keeping you informed about your application; (iv) to carry out statistical analysis and market research on people who may be interested in our awards and bursaries; (v) to contact you (including by telephone, post or email) with information about the services which either you request or which we feel will be of interest to you such as our newsletters; and (vi) if you have consented, to feature your name, photograph and other details about you in publicity. Please see sections 2.10 and 2.11 for more details about how we use your personal information. (c) Source of personal information. We may receive some of your personal information from third parties, such as from a moderator who is assessing your application or from your university if you are a bursary student. (d) Information we need to provide services to you. We need certain types of personal information so that we can provide services (i.e. administer your application for the James Dyson Award or a bursary) to you and perform contractual and other legal obligations that we have to you. If you do not provide us with such personal information, or if you ask us to delete it, you may no longer be able to apply for the James Dyson Award or one of our bursaries 2.3 General public or organisations requesting charitable support (a) What personal information we collect about you We, or third parties on our behalf, may collect and use any of the following information about you: (i) your name; (ii) your postal address; (iii) your email address; (iv) your telephone number; (v) charitable objective/organisation being supported; (vi) date of fundraising event; (vii) nature of donation request (financial support or machine donation); (viii) organisation's mission and how the donation will be used; (ix) delivery address; (x) bank details (where needed to make a donation payment); (xi) information provided when you correspond with us; (xii) information provided in your application; (xiii) any updates to information provided to us; and (xiv) information you provide to help us provide you with improved service, for example if we ask you to fill in a survey or questionnaire. (b) How we use your personal information We will collect, use and store the personal information listed above for the following reasons: (i) to assess your application for charitable support and (where relevant) to send you (or a third party) our donation; (ii) to deal with any enquiries from you; (iii) to send you certain communications (including by email or post) about our services such as administrative messages (for example, setting out changes to our terms and conditions and keeping you informed about your application; (iv) to carry out statistical analysis and market research on people who may be interested in our charitable support; and Please see sections 2.10 and 2.11 for more details about how we use your personal information. (c) Information we need to provide services to you. We need certain types of personal information so that we can provide services to you and perform contractual and other legal obligations that we have to you. If you do not provide us with such personal information, or if you ask us to delete it, you may no longer be able to apply for our charitable support. 2.4 Students at schools who are collaborating with us (a) What personal information we collect about you We have programmes in place where we work together with certain schools to develop new design and technology curriculum and ways of teaching. As part of this programme we may collect any of the following information about you as one of the students in the programme: (i) your name; (ii) your photo; (iii) your address; (iv) your responses to our interview questions. Please note that we may film your interviews if we have either your consent if you are over 16 or your parent's consent if you are aged under 16; and (v) responses to any ad hoc surveys that we may run. (b) How we use your personal information We will collect, use and store the personal information listed above (with you or your parent’s consent) so that we can assess how successful the programme has been and we share it with other schools and the government to discuss the programme’s success. We may use you photos or videos on our website, CRM, social media channels and printed materials. Please see sections 2.10 and 2.11 for more details about how we use your personal information. (c) Source of personal information. We receive your personal information either from you directly or from your school. 2.5 Teachers at schools which are collaborating with us (a) What personal information we collect about you We, or third parties on our behalf, may collect and use any of the following information about you: (i) your name; (ii) your postal address; (iii) your email address; (iv) your telephone number; (v) information provided when you correspond with us; (vi) information provided in your interview responses; (vii) where we have your consent to do so, we may create a video and/or audio recording of our interview with you (viii) any updates to information provided to us; (ix) information you provide to help us provide you with improved service, for example if we ask you to fill in a survey or questionnaire (b) How we use your personal i'''
