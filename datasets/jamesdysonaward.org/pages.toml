full_description = '''Successful previous entries THE TRAILBLAZERS View national and international winners, runners up and top 20 finalists from previous years. Past winners Filters No entries found Back to top footerFunctions.push((function () { var readyFlags = {}; function addDependancy(moduleKey) { readyFlags[moduleKey] = false; } function runIfAllLoaded(moduleKey) { readyFlags[moduleKey] = true; var allReady = Object.keys(readyFlags).every(function (thisModuleKey) { return readyFlags[thisModuleKey]; }); if (!allReady) return; galleryModule.getSubModule('dataManager').setEntriesData([{"id":"5ac4e9bb-5a47-47b2-a032-6dee245079b9","name":"Athena","description":"Supporting patient quality of life during chemotherapy.","nameTruncated":"Athena","descriptionTruncated":"Supporting patient quality of life during chemotherapy.","badge":"International Winner","projectUrl":"/2024/project/athena","imageUrl":"/Document/c98a7c0e-14fd-47fd-bfbc-bbb1e8d584eb/wide.jpg"},{"id":"53d2a0be-5d68-462f-81c5-357ca20ff48d","name":"The Golden Capsule","description":"The Golden Capsule is a non-powered medicine-injection device for emergencies. Rescuers do not have to move through harsh environments while carrying several intravenous packs in their hands.","nameTruncated":"The Golden Capsule","descriptionTruncated":"The Golden Capsule is a non-powered medicine-injection device for emergencies. Rescuers do not have to move through harsh environments while carrying several intravenous packs in their hands.","badge":"International Winner","projectUrl":"/2023/project/the-golden-capsule","imageUrl":"/Document/a88d5b81-39ff-4ff7-9a11-cb59b94a981d/%eb%8b%a4%ec%9d%b4%ec%8a%a801-%ed%91%9c%ec%a7%80.png"},{"id":"9ccebb9a-dc7c-47fb-81ed-a6ee24a72dbc","name":"The Life Chariot","description":"frontline tested MEDEVAC evacuation trailer","nameTruncated":"The Life Chariot","descriptionTruncated":"frontline tested MEDEVAC evacuation trailer","badge":"International Winner","projectUrl":"/2023/project/the-life-chariot","imageUrl":"/Document/ec85ca1f-8c08-4c23-9a6c-619c115650c5/life-chariot32.jpg"},{"id":"8574c57a-40dd-4a30-baa4-e4f3135c0ea6","name":"SmartHeal","description":"SmartHeal - precise, affordable, and scalable smart pH sensor integrated with wound dressing for monitoring of chronic wounds condition.","nameTruncated":"SmartHeal","descriptionTruncated":"SmartHeal - precise, affordable, and scalable smart pH sensor integrated with wound dressing for monitoring of chronic wounds condition.","badge":"International Winner","projectUrl":"/2022/project/smartheal","imageUrl":"/Document/2e9097a6-785a-4b0c-9ac0-818f6314861f/start.jpg"},{"id":"eac115b1-183b-4d45-b1ae-e98dcf37030c","name":"REACT","description":"A new system for stopping bleeding from a knife wound.","nameTruncated":"REACT","descriptionTruncated":"A new system for stopping bleeding from a knife wound.","badge":"International Winner","projectUrl":"/2021/project/react","imageUrl":"/Document/c564db90-5d21-4d67-ab41-d9f004831538/react-1.jpg"},{"id":"e818a104-8af9-4ef6-9226-f49d1c2f0ee5","name":"HOPES","description":"Home Eye Pressure E-skin Sensor (HOPES) is a wearable biomedical device for pain-free, low cost, at-home intraocular pressure (IOP) testing ","nameTruncated":"HOPES","descriptionTruncated":"Home Eye Pressure E-skin Sensor (HOPES) is a wearable biomedical device for pain-free, low cost, at-home intraocular pressure (IOP) testing ","badge":"International Winner","projectUrl":"/2021/project/hopes","imageUrl":"/Document/3ed29838-7e4a-44db-9f0a-078b9e03e86d/dyson-competition-f1.jpg"},{"id":"ab20bc6b-f0a4-4b7e-a6e6-fdbd8882525b","name":"The Blue Box","description":"Point-of-care biomedical device for pain-free, non-irradiating, non-invasive, low-cost and in-home breast cancer testing.","nameTruncated":"The Blue Box","descriptionTruncated":"Point-of-care biomedical device for pain-free, non-irradiating, non-invasive, low-cost and in-home breast cancer testing.","badge":"International Winner","projectUrl":"