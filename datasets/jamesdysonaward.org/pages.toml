full_description = '''Past winners Where are they now? We've caught up with some success stories from past years to find out how entering the James Dyson Award has benefitted their careers. Subscribe to our newsletter Sign up Meet the Winners Solveiga Pakštaitė, inventor of Bump Mark Solveiga Pakštaitė, inventor of Bump Mark Solveiga was the UK National Winner of the James Dyson Award in 2014 with her bioreactive expiry label for food. Dan Watson, inventor of Safety Net Dan Watson, inventor of Safety Net Dan was the overall winner of the James Dyson Award in 2012 with his sustainable fishing net. Kai Xiang Lin, inventor of Klippa Kai Xiang Lin, inventor of Klippa Kai was a US National Runner-up with his invention: a prosthetic leg designed for amputee rock climbers. Project Gallery Meet the competition There are currently no entries for this year. Take a look at our past winner's gallery to see the winning entries from previous years. Back to top footerFunctions.push((function () { var readyFlags = {}; function addDependancy(moduleKey) { readyFlags[moduleKey] = false; } function runIfAllLoaded(moduleKey) { readyFlags[moduleKey] = true; var allReady = Object.keys(readyFlags).every(function (thisModuleKey) { return readyFlags[thisModuleKey]; }); if (!allReady) return; galleryModule.getSubModule('dataManager').setEntriesData([{"id":"5ac4e9bb-5a47-47b2-a032-6dee245079b9","name":"Athena","description":"Supporting patient quality of life during chemotherapy.","nameTruncated":"Athena","descriptionTruncated":"Supporting patient quality of life during chemotherapy.","badge":"International Winner","projectUrl":"/2024/project/athena","imageUrl":"/Document/c98a7c0e-14fd-47fd-bfbc-bbb1e8d584eb/wide.jpg"},{"id":"53d2a0be-5d68-462f-81c5-357ca20ff48d","name":"The Golden Capsule","description":"The Golden Capsule is a non-powered medicine-injection device for emergencies. Rescuers do not have to move through harsh environments while carrying several intravenous packs in their hands.