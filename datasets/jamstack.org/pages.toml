["https://jamstack.org/headless-cms/brill"]
title = "Brill CMS | Jamstack"
description = '''The Brill CMS supports visual editing of pages containing React components. The Brill Framework provides a "low code" platform that's designed to save you time and effort when developing web applications.'''
full_description = "The Brilll CMS supports visual editing of pages using React components. There's an extensive Storybook containing React components that can be Dragged and Dropped onto pages. The Storybook includes Material UI Components, data table components and editors such as the Visual Studio Code text editor and a HTML editor, as well as many other components. You can add your own React components and create a Stroybook of components specifically for your organization, that implements your organizations Look and Feel guidelines. This saves Content Editors time and helps them keep to the Look and Feel guidelines. The Brill CMS is designed for creating enterprise level application but can equally be used for smaller projects. There's no limit as to the sophistication of a web application that can be developed. You can create any web application you could using a bespoke React application. Components can include text, images, forms, fields, radio buttons, checkboxes, tables and anything you can think of. The Brill CMS was developed using the Brill CMS. We're not aware of any other CMSes that were created using themsleves or that can edit themselves. The Brill CMS uses a Git repository for storing versions of pages and resources. This allows large teams of Developers and Content Editors to work on a project without tripping over each other. There's a workflow for reviewing and testing changes, before they go live. The Brill Framework ties everything together and supports the rapid development of enterprise web applications using a 'low code' approach. The Brill Framework includes client and server side functionality and middleware that ties everything together. The Brill Middleware allows React components to communicate with each other within a web application and also with the server. A component typically subscribes to a topic and publishes its results to another topic. The Brill Middleware uses WebSockets and is two way. React Components can get data from the server but also the server can push data to components. This allows applications to be developed that display real time information such as share prices or news."
year_published = 2025
clearnet = "https://jamstack.org/headless-cms/brill"
