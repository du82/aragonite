["https://jamstack.org/generators/bestatic"]
title = "Bestatic | Jamstack"
description = "A simple but feature-rich static site generator, written in Python and Jinja2."
full_description = "Bestatic is a simple but powerful static-site generator that you can install graphically without worrying about dependencies. It can simply turn your text files into fully functional websites and blogs. It is really minimal yet feature-rich. Like every other static-site generator, it can generate a complete website by processing a bunch of markdown files. As a result, it eliminates the need for server-side programming, databases, and constant security updates. The site that Bestatic generates can be served from any web server or host (or even from Git-based platforms, for completely free). Blog-aware. You can easily create your blog/news page along with your website. Customizable list pages for blog posts, reverse chronological order of posts, tags, comments (using Giscus or Disqus), URL customizations, RSS feeds - All standard good stuff are already included. Feature-rich. Want LaTeX support? Syntax highlighting for code? Powerful search functionality? Auto-reloading server? We have all these things out-of-the box. Flexible. Want to configure things? Use simple yaml file. Want to use command line? Use our CLI options. Want to theme in your own way? Use standard Jinja2 templating to design freely. Scalable. Bestatic ultimately builds a bunch of static files. So, no need for database management, server maintenance, or constant security updates. A hassle-free way to manage large-scale websites. Free and open-source. Of course, Bestatic is free and open-source, licensed under GNU GPL-3.0. This will remain free and open-source forever. Simple. Making things simple for you is our goal. Be it via graphical installation, OS compatibility, dedicated quickstart, or in-depth documentation: We just want to make your Bestatic journey easy and enjoyable for the beginning! Want to try Bestatic? Download and install it from the release page, or Snap store, or Flathub, or PyPI. You can use Bestatic on Windows, Linux, and macOS. Detailed installation instructions, quickstart guide, and user manual are available on our official documentation."
