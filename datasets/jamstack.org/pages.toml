title = "Jamstack Community Survey Results 2022 | Jamstack"
description = "The third annual Jamstack Survey conducted by Netlify reveals developer attitudes towards trends like remote work, Web3, serverless, edge and more."
full_description = "The third year of the Jamstack Community Survey found a mix of things we expected – indeed, things we predicted last year – as well as some big surprises about the many diverse members of our community. Some key takeaways include: Netlify sits at the center of the Jamstack community, and we conduct our annual survey so we can understand our community of developers. This helps us tailor our products and services to our community. In sharing our survey results, we also want to help developers better understand themselves and one another. Working as a developer often means working in a vacuum, without a sense of what’s happening in the broader community. Our survey data can help provide a sense of best practices as well as an idea of what else is happening in the community. In addition to our usual framework census and our questions about content management systems, this year we asked about some emerging technologies that have received a lot of attention. The fuzzy group of technologies called “Web3” garnered mixed feelings despite a great deal of press in 2021 and 2022. Browser-native web components, on the other hand, seem to have finally reached mainstream adoption. As usual, our survey covers everyone we can reach: every kind of developer responded to our survey from every region of the world, whether or not they were Netlify users, and whether or not they considered themselves Jamstack developers. Our survey this year received a little under 7,000 responses. If you’re interested in the specifics of our methodology, we have a detailed writeup of the demographics and margins of error in our survey. As usual, we want to thank the developers who took the time to contribute to the survey. We have done our best to take the data you’ve given us and turn it into useful, actionable insights for everyone in our community, and we hope it helps you. There was not much change in the breakdown of reported job titles in our survey this year: as usual, nearly everyone (84%) who responded considers themselves to be an engineer of some kind. There was one curious change, however: the number of people calling themselves “full stack” versus “front end” has almost exactly flipped, from 32% full stack and 45% front end last year to 44% full stack and 33% front end in the 2022 survey. None of the other demographic markers we tracked changed very much, so we believe this is a real shift in how the community thinks of itself. We have two theories about why this might be the case, and we’ll discuss them in the sections on job changes and serverless."
year_published = 2025
clearnet = "https://jamstack.org/survey/2022"
