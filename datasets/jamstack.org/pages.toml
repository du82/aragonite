full_description = "Contentrain is a Git-based Headless CMS that was focused on developer and content editor experience which provide seamless integration with Jamstack web apps. We created Contentrain for agencies, startups, freelancers, or corporates to faster their development and content management time. Create once, use always! We care about your time! With our reusable content models you will never spend extra time for creating the same schemas over and over again. 🚀 Contentrain is a Git-based headless CMS that focuses on developer and content editor experience first. All web projects need to have high Lighthouse scores, great SEO optimization performance, and quality content. Contentrain offers all of these benefits to your web projects with the power of Static Sites and the power of Git. ⚡ Contentrain is framework agnostic, meaning you can use all Jamstack SSG frameworks... such as Nuxt.js, Next.js, Gatsby, 11ty, Hugo, Gridsome, Jekyll, and more. Contentrain has great productivity-enhancing features for developers like Shared Collections and Saved Collections. Contentrain is one of the most developer-experienced products that developers can use with modern technologies. It is also the easiest CMS for those who do not have coding knowledge to manage the content on their websites. Content teams can manage content as if using a simple spreadsheet program (Excel, Google Sheets) with modern interfaces, providing maximum productivity in projects with user-role management and multi-language support. With the historical content control provided by Contentrain's Git-based structure, data loss and security issues are no longer an issue for you. Freelancers, startups, small businesses, and enterprise companies meet the practical and innovative way of producing and distributing content on modern web projects. 🤝"
