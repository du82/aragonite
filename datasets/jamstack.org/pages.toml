full_description = "DatoCMS is the headless CMS that gets out of the way, so you can bring projects to life quickly and without unnecessary complexity. All the content in DatoCMS is accessible via API. We offer Content Delivery API in GraphQL and Content Management API. DatoCMS boasts a comfortable editing UI that sets the stage for anyone in the content game, including side-by-side previews of draft content. DatoCMS comes with starter projects for Next.js, Nuxt, Svelte, and other frameworks. If you're new to DatoCMS, we recommend trying our Marketing Website or E-commerce starters, which offer typed GraphQL queries, Tailwind, multi-language, Web Previews, real-time updates in Preview Mode, SEO/Readability analysis, and much more! The Content Delivery API is written in GraphQL, which offers a number of advantages over classic REST APIs: Rich text fields, images, geopoints, complex relationships, SEO/social sharing settings... DatoCMS makes it easy to build a tailored authoring experience for your editors and marketers. Create any kind of object — pages, products, case studies. Just drag and drop fields into your model and everything will be instantly editable. Every DatoCMS plan comes with the power of Imgix, an extremely powerful and fast CDN that allows you to perform any kind of manipulation to the uploaded assets. Optimize, resize, crop, rotate and watermark images on-the-fly simply adding custom parameters to the URL of your image. With DatoCMS you can achieve structured, rich-content editing using a specific type of field called Modular Content. Give your authors the freedom to compose inspiring visual stories by alternating a number of reusable custom components without depending on their developers. Customize theme colors, logo, custom domain.. you can easily setup DatoCMS to match your — or your clients' — brand identity. DatoCMS offers full localization support. All your content types and assets can be localizable, including rich text, images, geopoints and especially your URLs. We also provide"
