full_description = "Contento is the only headless CMS focused on building websites. It features a stunning, modern and intuitive design and comes with quick start templates to get you up and running fast. We've made building a headless website fast and simple for developers — with ease, speed and repeatability at the core of our focus. Our range of starter kits, content type library and ability to reuse your own content models across projects helps speed up your build process, making headless websites more profitable to deploy. We also bake in key website tools like SEO, visual preview and internationalisation across all product tiers enabling all users to access the entire feature set. Our intuitive admin panel and editing experience also makes Contento easy to use for the marketing team. With optional features like the content workflow and auto translation available on our Pro plan for those who need it."
