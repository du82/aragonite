["https://jamstack.org/headless-cms/directus"]
title = "Directus | Jamstack"
description = "The CMS (and more) you've been looking for 😎🐰."
full_description = "Directus is a headless CMS that instantly turns your SQL database into REST and GraphQL APIs and gives you a beautiful, intuitive no-code app to manage all your content and data. But it's also more than just a headless CMS. It’s an open data platform that has all the tools you need for creating, managing, serving, visualizing, and even automating your data for your next web, mobile, or digital project. Agencies, Fortune 500s, and organizations in-between are using Directus for many different types of use cases in addition to Headless CMS. If you want to go to market faster with a solution that’s also ready for true-production scale - Directus is the choice for your next headless CMS. Instant REST and GraphQL APIs – Directus creates powerful and easy to use REST and GraphQL APIs from your SQL database in 90 seconds or less. The APIs are highly performant and come with built-in features like robust authentication, caching, image transformation, aggregation, filtering, sorting, and pagination. Intuitive No-Code App (CMS) – Developers AND non-technical users love how easy it is to manage content and even data models inside our Data Studio. Page Builder – Take advantage of Many To Any (M2A) Relationships to create a page builder that allows your content editors to build pages composed of different components with totally customizable schemas. Live Preview – Preview how your content will appear on your live site right within Directus... without waiting on long build times or deploy previews. Localization & Translations – Directus makes it easy manage multilingual content with a specialized interface that users love. And no matter what languages your organization requires, our Admin App supports a growing number of locales. Realtime – With WebSockets, you can effortlessly integrate real-time data updates into your frontend applications. Say goodbye to manual polling or workarounds, and embrace a more efficient and elegant solution that keeps your applications in sync with the latest information in real time."
