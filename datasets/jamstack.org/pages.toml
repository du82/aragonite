["https://jamstack.org/headless-cms/butter-cms"]
title = "Butter CMS | Jamstack"
description = "An API-first CMS for rapidly building CMS-powered websites in any programming language."
full_description = "ButterCMS is an API-first headless CMS for rapidly building CMS-powered apps and websites in any programming language. Great for blogs, dynamic pages, and more. Custom Components and References empower you to model your content to fit the unique use cases for your app, website, or blog. Our powerful Collections feature is great for ecommerce sites, allowing you to update new product information for your online store. Collections can also be used to create new promotional content like case studies and testimonials so you can create reusable content one time in Butter, and use it multiple times wherever you need it in your app. You've got better things to do than building another blog. Just drop in our pre-built, SEO optimized API-first blog engine and get back to working on more interesting problems Our fully-featured and customizable WYSIWYG rich text editor allows your content editors to control text formatting, embed images and media, edit HTML, insert tables and more. Configure Preview URLs to preview new blog posts and pages, as well as updates to existing content, before publishing them to your live environment. Schedule a specific time for your changes and new content to go live. Enable localization to distribute your content globally. ButterCMS lets you customize locales and keys to create a multilingual app that matches the content to your audience in any number of countries or regions. Use our robust and reliable Media Library to store and distribute your images and files. No need to configure your own complex CDN. Our Media Library supports all file types, and provides a fast and efficient experience for your content editors and your end users. We also provide an in-app image editor so you can do all your image editing right within your Butter dashboard. Get notified when content changes. Configure webhooks to POST change notifications to your application for important event types. Agencies and enterprise businesses often manage multiple websites. Our dashboard easily scales to meet this requirement, allowing you to manage content from all of your websites in one Butter instance."
