title = "BowTie | Jamstack"
description = "Build fast and lean websites for your clients that don't skimp on features."
full_description = "BowTie professional site builder. Build fast and lean websites for your clients that don't skimp on features. Database-driven websites expose your clients to security risks, and often require complex optimization and maintenance. BowTie helps you deploy websites that are faster, easier to maintain, and more secure than a traditional content management system - without losing convenience. BowTie gives you Stripe Payments, User Management, Zapier, and a Hosted Content Editor without a database. Handing off content creation? Clients and non-technical collaborators can use a customized editor to modify only what they need to. Developers can manage access to content, roll back changes with git version control, and work locally with familiar tools. Database driven legacy sites are needlessly complex and susceptible to known exploits – and we all pay the price. BowTie captures information (behavior, payments, custom data) securely when you need persistent data. There's no software to maintain, and no database to hack. Use our template framework to produce brochures, donation sites, or simple e-commerce sites quickly – allowing you to focus on what matters, design and content."
