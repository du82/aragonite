["https://jan.rychter.com/enblog/2009/4/8/the-cross-platform-browser-fallacy.html"]
title = "The cross-platform browser fallacy"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = '''The cross-platform browser fallacy2009-04-08As I watch my browser sluggishly scroll a page, I can’t help but think: with all this hardware, why can’t we have decent performance in our browsers? I have 320 processors1 on my graphics card, together with half a gigabyte of memory. Four cores crunch instructions at over 3GHz, storing data in four gigabytes of main memory. Surely that is enough for smooth page scrolling? I mean, seriously — my 1MHz Commodore 64 could scroll things smoothly!2 The problem with todays browsers is that everyone assumes that a browser has to be cross-platform. A new browser obviously has to rule the world, so it has to run on all the major platforms. And since those have wildly different APIs, a compatibility layer is needed on top of them. Performance, you ask? Oh, it got lost along the way. Let’s list the benefits that multi-platform browsers bring to users: slow rendering and scrolling code bloat resulting in low performance large memory consumption bugs resulting from overly complicated code For all the unified experience talk, not a single browser can even sync bookmarks across platforms!3 Don’t believe the hype; there is exactly zero benefit from the multi-platformness of our browsers. It used to be that for economic and political reasons it was necessary to have a unified multi-platform solution. Mozilla/Firefox had to do it to fight the IE monopoly and the misconception that Internet==IE (also to get money from Google for directing searches to them). Safari and Chrome had to be multi-platform because of Apple’s and Google’s world domination goals. IE didn’t have to be multi-platform, but curiously enough was designed as such anyway, so even though it only runs on Windows now, it carries a load of platform abstraction cruft. Today, we live in a world where it is generally accepted that there can be many browsers and one has to stick to standards when designing web pages. World domination goals can safely be dropped: you don’t have to rule the world anymore. Every major platform out there exposes the GPU to applications. There are also platform-specific approaches to threading, networking and disk I/O, providing great performance. I would like to see a Mac-specific browser4, a Linux-specific browser and a Windows-specific one. Each one should be light and trimmed, make the best possible use of platform-specific features, use the native GUI and integrate with the OS. Stop building multi-platform monsters, users don’t need them. 1 Give or take a hundred. 2 …and do it in the overscan area where supposedly it was impossible to display anything! 3 Foxmarks/Xmarks finally came along and did the job right. 4 Safari 4 is close, but it could do better.CommentsI utterly and completely disagree. Let me look at the first fallacyyou attribute to multiplatformness of the browsers: * slow rendering and scrollingSlow scrolling, you say? Well, I'm reading this post in Firefox 3.1b2on an old Celeron 2400 box with 512 megs of RAM (and a Radeon 9200w/32 MB), running a current installation of Arch Linux, and I reallycan't accuse it of unsmoothness -- once it loaded up, it's actuallypretty good. In fact, it's trivially easy to make a smooth scrollthese days: just grab any GUI framework (cross-platform or not),create a scroll pane and stack it up with content. Hey, it's outthere, you can install qtdemo and see for yourself.Sure enough, this blog is just a bunch of mostly static HTML pages,which are the easiest case (Gmail is barely usable for me in the verysame browser). But this shows that the problem is not really inscrolling performance, which is easily achieved; it's in the waybrowsers create and show the content to be scrolled.Now, as for slow rendering (by which I understand the amount of systemresources taken up by the browser while loading and rendering a pageand its general responsiveness at this time), that's a differentkettle of fish. Don't take me wrong, Firefox certainly is a hog, andthis shows -- so much so that I've mostly switched to Midori forcasual web browsing on this box, despite its immaturity andinstability. But whence does this sluggishness come from? There isprobably no single good answer, but I'll try to make some points.First, over-engineering. Firefox didn't start out as just a browser,but as an extraction of the browser from the Mozilla suite, and itshows. At the core of Firefox there is a general, abstract,heavyweight framework for writing anything (XPCOM); then there arecompatibility layers for making it fit into multiple environments;then there's the XUL way of doing GUI (also incompatible with prettymuch everything); then there's Gecko, which itself is quite sluggishthanks to...Second, code bit rot. There's still code in there that traces backits heritage to the early days of Mozilla and Netscape; it was writtenin C++, and the ARM C++ of those days and the thing that is nowadayscalled C++ are almost two different languages. (Not to mention thevery nature of C++, which is the Bible of programming languages: it'shorrendously big, complex, self-contradictory and next to impossibleto parse (and compile) correctly.)But going back to the original question of slow rendering: What doesit take to write a rendering subsystem of a browser? You need todesign and implement all the HTML/XML/CSS/JS/... parsers, astandards-compliant layout engine that takes into account all thecomplicated algorithms set forth by W3C standards, a JavaScriptengine that seamlessly integrates with the previous components, etc.It's all just a matter of good algorithms and good implementations.And the big question is: Where in the world do you see theopportunity for system-specific APIs to help in these tasks?Leveraging GPU power, you say? Hey, I've got an old graphics card,it's not compliant with all this modern stuff -- I want smoothbrowsing experience, too! (Besides, if we did it that way, doesn't itshift the focus to writing _hardware-oriented_ rather than OS-orientedextremely efficient browsers? Isn't CUDA NVidia-specific?) Even myold Commodore 64 could do wonders with the little power it had!(To make a short digression: Despite everything that other platform'safficionados might say, C64 is alive and thriving. The last versionof the Contiki OS, a considerable achievement (including a webbrowser, no less!) appeared in March. But hey, Contiki is portable!It even runs on the VIC-20! Talk about code bloat caused byportability!)Yes, for (say) Web servers or FTP daemons, it makes a lot of sense towrite a Linux-specific program to make use of the sendfile() syscallto avoid copying data between kernelspace and userspace. This is whatvsftpd does, and it does wonders. But those are I/O-bound rather thanCPU-bound applications, and there's little room for algorithmicimprovement there.I'm dreaming of a lean and mean, standards-compliant browser, too.But the claim that "there can be many browsers and one has to stick tostandards when designing web pages" is also not exactly true. Let mequote some comments from the source code of Google V8, Chrome'sJavaScript engine:From runtime.cc: // In Firefox/SpiderMonkey, Safari and Opera you can access the characters // of a string using [] notation. We need to support this too in // JavaScript.From conversions.cc: // NOTE: We optimistically try to parse the number as an octal (if // we're allowed to), even though this is not as dictated by // ECMA-262. The reason for doing this is compatibility with IE and // Firefox.Yeah. All hail standards compliance!Daniel Janus2009-04-151) Internet Explorer is not cross platform, yet it doesn't have the magical smooth scrolling you are looking for. That scrolling has little to do with cross-platform code.2) Use a plugin such as XMarks to solve your cross-platform bookmark woes.The reality is that cross platform browsers have a much larger user base, justifying increased amounts of effort on the browser. Chrome for instance has a much better Javascript engine than IE, the costs of which can be amortised across many different users on many different platforms. Were it locked to one single platform, the costs would be harder to justify.Tom Leys2010-03-31'''
year_published = 2009
clearnet = "https://jan.rychter.com/enblog/2009/4/8/the-cross-platform-browser-fallacy.html"
