["http://jan.rychter.com/blog/2009/2/11/mini-seedcamp-w-warszawie.html"]
title = "Mini Seedcamp w Warszawie"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = "Mini Seedcamp w Warszawie2009-02-11W marcu odbędzie się w Warszawie Mini Seedcamp -- współorganizowana przez Aula Polska impreza, mająca na celu danie młodym firmom szansy zaprezentowania się i wystartowania w konkursie Seedcamp. Z notki prasowej:Ty lub Twój zespół macie pomysł na nowy, innowacyjny start-up, ale brakujeWam środków do jego realizacji i rozwoju? Już teraz dla wszystkichtworzących aplikacje internetowe otwiera się nowa szansa. Mogą oni składaćswoje zgłoszenia na marcowy Mini Seedcamp Warszawa, przeznaczony dla twórcówz krajów nadbałtyckich i Europy Wschodniej.Po raz kolejny za sprawą imprezy Mini Seedcamp, która odbędzie się 18 marcaw Warszawie w budynku Agory przy ul. Czerskiej 8/10, twórcy dwudziestunajlepszych projektów w trakcie prezentacji, dyskusji panelowych iindywidualnych rozmów skonfrontują swoje pomysły z opiniami ponadpięćdziesięciu liderów branży IT w Europie - przedsiębiorców, inwestorów iprojektantów. To okazja dla stale rozwijającego się i obiecującego rynkunowych technologii w Polsce na zaistnienie ze swoimi projektami w Europie ina świecie.Zespoły skorzystają z zaangażowania i porad uznanych mentorów i liderówbranży IT. Znajdą się wśród nich m.in. projektanci, specjaliści odmarketingu, przedsiębiorcy i przedstawiciele funduszy typu venture capital.Podczas serii interaktywnych paneli dyskusyjnych i nieformalnych sesjiindywidualnych wybrane zespoły uzyskają nie tylko bezcenną wiedzę, ale takżesolidne fundamenty i porady pomocne przy uruchamianiu innowacyjnychprojektów w Europie.Projekty można zgłaszać do końca wtorku 3 marca 2009. Więcej szczegółów oidei Seedcampu, aktualności i informacje jak aplikować do konkursu namini-stronie http://seedcamp.com/pages/warsaw09.W warszawskim wydaniu Mini Seedcampu będę jednym z mentorów. Zachęcam do zgłaszania się i do zobaczenia!"
