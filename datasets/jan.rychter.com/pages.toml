["http://jan.rychter.com/blog/2009/10/19/polacy-chc-kar-dla-urzdnikow.html"]
title = "Polacy chcą kar dla urzędników"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = "Polacy chcą kar dla urzędników2009-10-19Polacy chcą kar dla urzędników — i słusznie. Każdy przedsiębiorca regularnie spotyka się z brakiem równowagi jeśli chodzi o odpowiedzialność za decyzje. Jako przedsiębiorca odpowiadam swoim majątkiem, jak również przed prawem za podjęte przeze mnie decyzje. Tymczasem urzędnik po drugiej stronie biurka nie odpowiada niczym za decyzje dotyczące mnie. W najgorszym przypadku zostanie upomniany, dostanie naganę z wpisem do akt, lub zostanie zwolniony (choć — czy ktoś słyszał o tym by urzędnik skarbówki został ukarany za błędy dotyczące podatników?). Spójrzmy na przypadek ekstremalny — jeden podpis prokuratora wystarczy, by wobec kogoś zastosować areszt. W tej chwili prokurator może podpisywać lekką ręką polecenia aresztowania, bo nic go nie kosztują. Są po prostu bezpieczniejszym wyjściem. Są ludzie, którzy spędzili lata w więzieniu, a następnie nikt nawet nie postawił im zarzutów. Uważam, że w takim przypadku prokurator stosujący areszt powinien sam odbyć karę w więzieniu. Bądźmy wyrozumiali: niech odsiedzi choć 10% tego, co niesprawiedliwie odsiedział oskarżany przez niego człowiek. Ta asymetria musi ulec zmianie, choć opór będzie wielki. Urzędnicy muszą zacząć podejmować przemyślane decyzje i ponosić za nie odpowiedzialność. Ludzie muszą zrozumieć, że nie każdy może być urzędnikiem, a słowo “urzędnik” musi przestać kojarzyć się z nieudacznikiem.KomentarzeWymaganie jak najbardziej zasadne... tylko nie przy takich wynagrodzeniach jakie są teraz.I zanim zaczniemy przytaczać dane o magicznych kwotach jakie się zarabia w urzędach to proszę pamiętać, że te kwoty to sumy jakie zarabia kierownictwo a wymagania sa kierowane do szeregowego urzędnika.Paweł Lipiec2009-10-19Nawiązując do wypowiedzi przedmówcy rozumiem iż niskie płace w urzędach zwalniają urzędników z myślenia i odpowiedzialności.Paweł Wasilewski2009-10-19Paweł Lipiec: ja również nie zgadzam się z takim podejściem. To, że urzędnikom płacimy mało (co również jest tezą dyskusyjną) wcale nie oznacza, że mamy się godzić na miernotę.Należy stawiać wysokie wymagania, a jeśli okaże się że faktycznie płace są za małe i nie ma chętnych do wykonywania tego zawodu, można płace podnosić. Redukując w tym samym czasie liczbę urzędnikow.Jan Rychter2009-10-20Oczywiście, że niska płaca nie uzasadnia kiepskiej pracy. Muszę jednak stanąć w obronie urzędników. Przede wszystkim należy się zastanowić o kim mówimy. Czy o tej osobie od której podpisu coś zależy, czy też o chmarze pracowników, będących w rzeczywistości prostymi robotnikami walącymi całymi dniami w klawisze albo noszącymi papiery?Gdy robotnik po dniu opierania się o łopatę stwierdzi, że za te pieniądze to on się wysilać nie będzie, zaraz słychać głosy poruszonego społeczeństwa, że jakiś zły kapitalista tego robotnika wyzyskuje. Zupełnie inna jest reakcja, gdy pracownik urzędu ośmieli się stwierdzić, że jemu to 1000zł na rękę nie starcza do pierwszego.Czy pracownik w firmie prywatnej ponosi odpowiedzialność za swoje błędy? Oczywiście -zawsze może jednak spróbować jakiejś ugody z pracodawcą. Urzędnik nie będzie miał takiej szansy – jego odpowiedzialność będzie wynikała z ustawy.Oczywiście taka odpowiedzialność powinna zostać wprowadzona. Urzędnik powinien mieć jednak szansę stania się profesjonalistą. Jak na razie, to widzę zastraszonych ludzi, niejednokrotnie przesiadujących w pracy po kilkanaście godzin dziennie, za głodowe wynagrodzenie, bez jakiejkolwiek szansy na podniesienie swoich kwalifikacji.Nie, niska płaca nie usprawiedliwia kiepskiej pracy. Musimy jednak najpierw zapłacić, żeby przyciągnąć do urzędów prawdziwych profesjonalistów. Wprowadzając jedynie kary, odstraszymy od pracy w urzędach, ostatnich kandydatów którzy mają jakikolwiek wybór i zostaną tylko ci, których naprawdę nikt inny nie chce już zatrudnić.Zupełnie nieprawdziwe jest zdanie – „można płace podnieść”. Ciekawe kto się na to zdecyduje? W następnych wyborach z pewnością nie będzie miał szans. Czy można zmniejszyć liczbę urzędników. Niektóre procedury są tak obłędne, że z pewnością taka liczba osób nie jest potrzebna. Rzecz w tym, że urzędy, nie realizują dziesiątek nałożonych na nie obowiązków, bo nie mają odpowiedniej ilości ludzi. Moim zdaniem zmniejszenie ilości pracowników się nie uda, lepsza realizacja zadań – jak najbardziej jest potrzebna.Potrzebni są jednak ludzie, którzy będą w stanie te zmiany przeprowadzić. I tu wracamy do sprawy wynagrodzeń...pcs2009-10-20No dobrze -- bardzo piękna dyskusja nam się wywiązała o ciężkim losie urzędników.Porozmawiajmy jednak może o przedsiębiorcach. Mi nikt nie wypłaca nawet 1000zł co miesiąc za siedzenie przy biurku. Muszę sam zorganizować produkt i klientów, żeby móc płacić ludziom, a potem być może na końcu sobie. Gdy staję przed owym urzędnikiem, odpowiadam przed majestatem prawa nie dość, że swoim majątkiem, to jeszcze losami ludzi, których zatrudniam, a w ekstremalnych przypadkach -- swoją wolnością (jeśli ktoś myśli że niemożliwe jest trafić do więzienia za nie ogłoszenie na czas upadłości, to mogę wyprowadzić z błędu).Dla urzędnika bezpieczniej jest podjąć decyzję korzystną dla jego kariery, a potencjalnie niekorzystną dla mnie. Nic go nie kosztuje błąd. Dlatego w Urzędzie Skarbowym kiedyś dowiedziałem się, że łatwiej jest wysłać wezwanie do zapłaty niż sprawdzać czy przypadkiem nie zostało już zapłacone. W końcu tak bezpieczniej dla stołka, a jeśli zostało zapłacone, to podatnik się wytłumaczy, a błąd nie kosztuje nic.Dla prokuratora bezpieczniej jest zastosować areszt wobec podejrzanego. Areszt rujnuje życie normalnego człowieka. A ile kosztuje owego prokuratora błąd w przypadku gdy nawet nie postawi zarzutów? Właśnie.Czy nikogo nie razi ta asymetria?Jan Rychter2009-10-20"
year_published = 2009
