["http://jan.rychter.com/blog"]
title = "Jan Rychter: Blog [PL]"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = "Grand Prix Polski Pojazdów Zabytkowych im. Witolda Rychtera2015-09-15Plakat rajdu Już za kilka dni startuje z Warszawy Pierwsze Grand Prix Polski Pojazdów Zabytkowych im. Witolda Rychtera. Miejsce startu znajduje się w Ursusie przy ul. Posagu 7 Panien 6 na terenie dawnej fabryki Ursus, a pierwsza załoga wyrusza na trasę o 10:00. Więcej o samym rajdzie można dowiedzieć się z oficjalnej strony. Witold Rychter to mój Dziadek, można przeczytać o nim trochę w wikipedii. Gwiazdą rajdu ma być zmontowany przed wojną w Warszawie Chevrolet Master Sedan. Będzie to premiera pojazdu po kilkuletnim remoncie. Podobnym wozem startował w rajdach Witold Rychter, można go też zobaczyć w naszych archiwach w albumie ze zdjęciami z podróży po Europie z 1938r. Nareszcie?2015-05-31Z mieszaniną radości i strachu czytam i oglądam wywiady z Ryszardem Petru, który z poparciem Leszka Balcerowicza tworzy nową partię. Cieszy mnie, że wreszcie pojawia się sensowny głos w polityce. Jestem zmęczony ciągłymi dyskusjami o niczym, wyborami gdzie jedna partia straszy mnie „tą drugą”, głosowaniem z przymusu, na tych którzy moim zdaniem mniej popsują. Męczy mnie, że politycy robią co mogą, żeby poprzyklejać sobie nawzajem etykietki, wiedząc że tak naprawdę nie różnią się niemal niczym. Jako przedsiębiorcę cieszy mnie też, że wreszcie widać sensowny ruch który stawia na przedsiębiorczość. Gdzie budowa silnej Polski odbywać się ma nie przez wymachiwanie szabelką i pokrzykiwanie o tradycjach, lecz przez pracę i wzrost gospodarczy. Równocześnie jednak boję się, że gdy tylko „stara gwardia” polityczna dostrzeże zagrożenie, zostaną przyklejone etykietki. Nowi staną się „liberałami”, będą „działać w interesach obcych mocarstw”, będą wyzyskiwaczami i panami. Zostaną też wciągnięci w debaty na tematy interesujące kościół katolicki i szybko sklasyfikowani jako wrogowie kościoła. Boję się też, że przedsiębiorcy, zamiast wreszcie pójść po rozum do głowy i się zorganizować, będą nadal narzekać po cichu, każdy z osobna, nie ufając nikomu. Imponujące jest, jak potrafią zorganizować się rolnicy, górnicy i inne grupy społeczne, a jak słabo reprezentowani są mali i średni przedsiębiorcy, wyrabiający tak naprawdę istotną część PKB. Będę z zainteresowaniem patrzył na rozwój wydarzeń. Pierwszy raz od kilkunastu lat słyszę wypowiedzi, które napawają mnie nadzieją. DOPISANE po kilku godzinach: no i proszę, nie musiało minąć dużo czasu i już dzieje się dokładnie to czego się obawiałem. Pierwsi pajace już przyklejają naklejki („nowa partia zagranicznych banków i korporacji”). Niesamowite, jak bardzo nikt nie chce konstruktywnie dyskutować o kraju. Wszyscy wolą przykleić sobie etykietki i wyśmiewać się nawzajem z daleka."
