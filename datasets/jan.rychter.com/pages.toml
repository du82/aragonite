description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = "Clear and concise explanations2009-03-21It seems I’m not the only one complaining about the lack of clarity and brevity in many startups’ pitches. Guy Kawasaki wrote: […] the companies had two minutes to explain what they do, and very few could. Indeed, in most cases the first question that the panelists asked was, “What exactly do you do again?” The same thing happens hundreds of thousands of times every day as people visit company websites. How many websites pass this simple test: “People can understand what the company does in two minutes or less”? That was exactly my impression after listening to the seedcamp pitches. Only two or three companies out of 20 got it right."
