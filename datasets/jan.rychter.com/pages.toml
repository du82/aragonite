["http://jan.rychter.com/blog/2009/11/6/z-ycia-przedsibiorcy-zawiadczenia.html"]
title = "Z życia przedsiębiorcy: zaświadczenia"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = '''Z życia przedsiębiorcy: zaświadczenia2009-11-06Z życia przedsiębiorcy: zaświadczenia Urząd Dzielnicy Warszawa Mokotów, okienko kancelarii. Stawiam się po odbiór zaświadczenia o wpisie do ewidencji działalności gospodarczej, które zamówiłem kilka dni temu. Wokół pusto, urząd w remoncie, a ludzi niewiele. „Dzień dobry, ja…” „Dzień dobry, numerek pan ma? Numerek, proszę pana, trzeba wziąć.” — przerywa pani w okienku. Rozglądam się wokół, nikogo nie ma, jestem jedyny w okolicy. „Musi Pan się wrócić i przy wejściu wziąć!”. Grzecznie wracam do wejścia, naciskam „Kancelaria” na ekranie, maszyna leniwie wypluwa numerek. Wracam do okienka. „Ja po odbiór zaświadczenia o wpisie do ewidencji”, mówię, podając pani równocześnie numerek. „Odbiór zaświadczeń to na pierwszym piętrze, pokój 119!”. Idę więc na pierwsze piętro odebrać zaświadczenie i tak sobie myślę, jak ułatwiłoby życie ludziom, gdyby procedura wydawania owych zaświadczeń nie wyglądała tak kuriozalnie jak wygląda. Obecnie kroki są takie: 1) pokój 119, odstać w kolejce, poprosić panią, dostać wniosek o zaświadczenie, 2) kasa, odstać w kolejce, zapłacić 17zł, 3) kancelaria, złożyć wniosek, 4) odczekać kilka dni, 5) pokój 119, odstać w kolejce, odebrać zaświadczenie. Owe „zaświadczenie” to jest po prostu wydruk z systemu komputerowego. Równie dobrze mógłbym je dostać jako PDF przez Internet. O samym kuriozalnym wymaganiu „zaświadczeń” na wszystko już kiedyś pisałem.KomentarzeTo ja opowiem swoją historię z ZUS'em.Wyrabiałem książeczkę ubezpieczeniową dla rodziny.Nie wiem gdzie - informacja mówi, że pokój 201 na 1 p. Na 1p. dowiaduję się, że tutaj tylko formularz.Składam formularz, za jakiś czas stawiam się po odbiór (miał być w tym samym pokoju). Okazuje się, że jednak poprzednia pani od formularzy nie miała racji - ale w pokoju 203 na pewno będą.Nie było bo petentów na literę J obsługują na VIp w pokoju 710. W pokoju 710 otrzymałem książeczkę z odpowiednii wpisami, ale po pieczątkę na głównej stronie mam się zgłosić na parterze w dziale obsługi petentów (taka informacja + różnośći), bo ta pani nie może jej postawić.Czasem się ma wrażanie, że nasze urzędy czerpały inwencję z filmu pt. "Asteix i Obelix w rzymie"Marcin Jurczuk2009-11-07Albo z "Procesu", albo z "Pamiętnika znalezionego w wannie", albo i z "Rewizora" jakby spojrzeć szerzej. Tylko nie wiadomo czy :) czy :(.Varelsee2009-11-08No tak -- to wszystko byłoby bardzo zabawne, gdyby nie fakt, że to my płacimy pensje tych wszystkich urzędników, którzy nas odsyłają z pokoju do pokoju. My też finansujemy owe pokoje i numerki.Jan Rychter2009-11-08'''
year_published = 2009
