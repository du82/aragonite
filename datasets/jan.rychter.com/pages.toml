full_description = "Szyfrowanie dysku twardego2008-12-02Coraz więcej pojawia się na rynku dysków z automatycznym szyfrowaniem danych (wprowdza je np. Seagate). Według producentów dyski takie szyfrują wszystko co jest zapisywane na dysk i automatycznie odszyfrowują dane przy odczycie, pod warunkiem, że użytkownik wcześniej podał odpowiedni klucz.Tylko jaki to ma sens?W jaki sposób mogę sprawdzić, czy mój dysk faktycznie dane zaszyfrował? Skąd mogę wiedzieć, czy nie są zapisane czystym tekstem, lub “zaszyfrowane” ROT13? Skąd wiem, czy dysk nie przechowuje w pamięci mojego klucza, na wypadek gdyby zażądała go “uprawniona agencja wywiadowcza”?Nieaudytowalne rozwiązania dotyczące bezpieczeństwa nie mają sensu."
