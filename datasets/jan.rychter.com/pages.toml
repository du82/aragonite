full_description = 'Idzie nowe2009-03-17Koniec odkładania na później. Coraz więcej osób szydziło ze mnie, że nie prowadzę bloga, tylko "stronę WWW z RSSem". Podobno komentarze są na fali i nie wolno mieć bloga bez komentarzy bo to wstyd. Obiecywałem, że komentarze będą -- i oto są! Pozostaje tylko mieć nadzieję, że będą bardziej merytoryczne niż te poza blogiem.KomentarzeYup, nawet trackback się zrobiłMekk2009-03-18Heh... I ktoś mnie później będzie przekonywał, że marudzenie nie jest najlepszym sposobem wpływania na ludzi :-)Ryszard Szopa2009-03-19Marudzenie i obśmiewanie, a szczególnie wymyślanie od przestarzałych :-)Jan Rychter2009-03-19'
