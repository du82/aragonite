["https://jan.rychter.com/blog/2008/12/3/polska-potg-superkomputerow.html"]
title = "Polska potęgą superkomputerową"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = "Polska potęgą superkomputerową2008-12-03Według artykułu w dzisiejszej Gazecie Polska jest potęgą obliczeniową:“Na opublikowanej niedawno liście TOP500 znalazły się klastry z czterech polskich ośrodków obliczeniowych, a wszystkich systemów z naszego kraju znalazło się aż sześć, co plasuje nas na jedenastym miejscu w świecie i siódmym w Europie.”Warto zadać pytanie: czy to dobrze? Kupować urządzenia nie jest trudno, szczególnie za pieniądze podatników. Można potem brylować na listach TOP500, pokazywać na zjazdach prezentacje ze zdjęciami superkomputerów, chwalić się kto ma najszybszy, największy, najnowszy. Co jednak podatnicy za te pieniądze dostają?Chętnie zobaczyłbym takie zestawienia: Ośrodki superkomputerowe posortowane według liczby publikacji naukowych, ważonych np.impact factorczasopism, gdzie zostały opublikowane. Oczywiście bierzemy pod uwagę wyłącznie publikacje, do których niezbędne było wykorzystanie superkomputerów. Ośrodki posortowane według skuteczności: na powyższej liście dzielimy każdą pozycję przez liczbę złotych, jaką wydał dany ośrodek na infrastrukturę obliczeniową. Otrzymujemy ranking wyrażony w jednostkachimpact factorna wydaną złotówkę podatnika. Potem porównałbym takie współczynniki z podobnymi dla centrów superkomputerowych na świecie. Bo może nie warto wydawać pieniędzy na duże i drogie superkomputery?Ośrodki obliczeniowe w Polsce mają wszelkie dane potrzebne do przygotowania takich zestawień. Podejrzewam niestety, że mało kto się odważy..."
