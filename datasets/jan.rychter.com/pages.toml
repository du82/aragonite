["https://jan.rychter.com/blog/2008/4/2/teoria-a-praktyka.html"]
title = "Teoria a praktyka"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = 'Teoria a praktyka2008-04-02W świecie technologii często zdarza się, że względy inne niż czystomerytoryczne decydują o tym, która technologia się upowszechni.Miałem okazję ostatnio porównać ze sobą dwa mechanizmy zabezpieczeńsystemu Linux: SELinux (Security-Enhanced Linux) i AppArmor. Obaprzedstawiane są jako pełnoprawne rozwiązanie kontroli dostępu.Systemy UNIX tradycyjnie opierają się na nieskomplikowanej kontroli prawdostępu: każdy element w systemie plików ma prawa dostępu dlaużytkownika, grupy oraz wszystkich pozostałych. Nie zawsze to jednakwystarcza -- z powodu częstych problemów z bezpieczeństwemposzczególnych aplikacji, często potrzebne jest ograniczenie prawdostępu konkretnym programom wyłącznie do niezbędnych dla nich plików,czy urządzeń w systemie. Co ważniejsze, istotnym problemem w systemachUNIX jest wszechmocny administrator (root), który ma nieograniczonydostęp do wszystkiego.Mechanizmy MAC (Mandatory Access Control) pozwalają na ograniczenie prawdostępu. Poprzez zdefiniowanie polityki bezpieczeństwa można pozwolićkonkretnym aplikacjom na dostęp do konkretnych elementów systemu,niezbędnych im do pracy. Co więcej, możliwe jest zdefiniowanie takiejpolityki bezpieczeństwa, w której nie ma wszechmocnego administratora, azmiana polityki bezpieczeństwa nie jest możliwa bez restartu systemu ifizycznego dostępu do niego. Dla systemu Linux powstały dwa mechanizmytypu MAC: SELinux i AppArmor.SELinux jest rozwiązaniem nieco starszym. Początkowo opracowane w NSA(National Security Agency), zostało szybko przyjęte m.in. przez Red Hatajako rozwiązanie bezpieczeństwa dla systemów Red Hat EnterpriseLinux. Pozwala na zdefiniowanie kompletnej polityki bezpieczeństwa dlacałego systemu i całkowite wzajemne odizolowanie od siebie aplikacji.AppArmor to alternatywne rozwiązanie, opracowane w firmie Immunix, anastępnie rozwinięte przez Novella. Cele są tu nieco inne niż dlaSELinux: AppArmor służy do chronienia systemu przed konkretnymizagrożeniami, ze strony konkretnych aplikacji. Z założenia niewielkaczęść programów w systemie będzie miała zdefiniowane profilebezpieczeństwa. Będą to na ogół programy mające kontakt ze światemzewnętrznym, takie jak np. serwisy sieciowe.Najbardziej zaognionym punktem spornym w dyskusjach na temat wyższościjednego rozwiązania nad drugim jest ich podejście do oznaczania plików wsystemie. SELinux operuje na i-węzłach -- odpowiednio oznaczonejkonkretnej zawartości w systemie plików. AppArmor używa tradycyjnychścieżek dostępu.Zwolennicy SELinux twierdzą, że używanie ścieżek dostępu nie zapewniaodpowiedniego bezpieczeństwa. Można przecież tworzyć dowiązania (hardlinks), manipulować przestrzenią nazw systemu plików, czy podmieniaćzawartość plików. W końcu ścieżka do pliku to wyłącznie wskazanie --"plik, który znajduje się pod tym adresem", nie zaś sama zawartośćpliku. Dlatego SELinux wymaga oznaczania i-węzłów, czyli konkretnejzawartości, za pomocą specjalnych metek. Do nich później odwołuje siępolityka bezpieczeństwa.Entuzjaści AppArmor odpowiadają na to: racja, ścieżki dostępu mają swojewady. Są za to nieskomplikowane, intuicyjne w użyciu, a wszyscy są donich przyzwyczajeni. Politykę bezpieczeństwa tworzy się więc łatwo.Trudno jest porównać ze sobą mechanizmy, które w założeniach mająspełniać różne role. W praktyce jednak często staje się przed wyborem,którego z nich użyć.Teoretycznie SELinux jest rozwiązaniem technologicznie lepszym. Pozwalana zdefiniowanie kompletnej polityki bezpieczeństwa, odseparowanie odsiebie przepływów danych, zabezpieczenie całego systemu. Definiowaniedostępu do konkretnych i-węzłów zabezpiecza system przed wielomarodzajami ataków. Są też jednak minusy: i-węzły w systemie plików trzebaoznaczyć i pilnować, by pozostały oznaczone. Trudniej jest robić kopiebezpieczeństwa, bo trzeba dbać o zachowanie metadanych. Politykębezpieczeństwa definiuje się też trudno.W praktyce więc AppArmor, pomimo że ma mniejsze możliwości, może sięokazać znacznie lepszym rozwiązaniem. W wielu zastosowaniach lepiej miećdobrze wdrożony i działający AppArmor dla ograniczonej liczby aplikacji,niż nie do końca zaimplementowany SELinux dla całego systemu.Dochodząc do tytułu tego artykułu: w teorii SELinux jest rozwiązaniembardziej zaawansowanym technologicznie, ale w praktyce AppArmor spisujesię lepiej. Wystarczającym powodem jest tu trudność użycia: są znaczniewiększe szanse, że administrator poprawnie zdefiniuje profilebezpieczeństwa w AppArmor, niż że zrobi to dobrze dla SELinux, a nawetnajlepsze technologicznie rozwiązanie przy źle zdefiniowanej politycebezpieczeństwa nie zabezpieczy systemu.'
year_published = 2008
