["https://jan.rychter.com/blog/2009/11/10/nagroda-dla-parp.html"]
title = "Nagroda dla PARP?"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = "Nagroda dla PARP?2009-11-10Małgorzata Widłak słusznie pyta, dlaczego Polska Agencja Rozwoju Przedsiębiorczości (PARP) została laureatem nagrody Najlepszego Partnera w Biznesie w kategorii „Wspieranie biznesu” w konkursie organizowanym przez Magazyn Ekonomiczny Home&Market. Zgadzam się z pytaniem, choć pytałbym z innych powodów. Warto czasem przypominać, że PARP nie jest źródłem dofinansowania dla przedsiębiorców, a jedynie jego dysponentem. Mówiąc inaczej, PARP bierze pieniądze za poprawne rozdysponowanie pieniędzy otrzymanych ze Skarbu Państwa. Dlatego jak najbardziej należy krytykować PARP za problemy z tym dysponowaniem, w końcu agencja wykonuje konkretną usługę za niemałe pieniądze. Spotkałem się zaś już kilka razy z podejściem „cieszcie się, że dostajecie pieniądze”. Opis samodzielnych działań PARP można znaleźć np. tutaj „Jednocześnie Agencja angażuje się w działalność badawczo-analityczną w zakresie swoich kompetencji, mającą na celu identyfikowanie potrzeb przedsiębiorców, w szczególności MSP, celem wykorzystania tej wiedzy przy tworzeniu propozycji nowych działań na rzecz przedsiębiorczości, innowacyjności i rozwoju zasobów ludzkich.” To za takie (jakże konkretnie opisane) samodzielne działania można PARP przyznawać nagrodę. Dysponowanie środkami unijnymi jest działalnością usługową, którą można wykonywać lepiej lub gorzej (przedsiębiorcy czekający obecnie na opóźniające się zaliczki i refundacje na pewno oceniliby słabo), ale nie powinno się za to przyznawać nagrody w kategorii „Wspieranie biznesu”. Jeśli już, to tę nagrodę powinny dostać Unia Europejska i Skarb Państwa, bo to te instytucje wspierają biznes."
year_published = 2009
