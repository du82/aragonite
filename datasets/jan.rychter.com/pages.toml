["https://jan.rychter.com/blog/2009/12/30/mit-kredytu-bankowego-dla-przedsibiorcy-poig-81.html"]
title = "Mit kredytu bankowego dla przedsiębiorcy POIG 8.1."
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = 'Mit kredytu bankowego dla przedsiębiorcy POIG 8.1.2009-12-30AntyWeb cytuje wypowiedzi kilku osób na temat dofinansowania z POIG 8.1. Dyskusja jak dyskusja, ale chciałem skomentować tę wypowiedź: Dawno temu, pierwsze programy PHARE realizowane były przy założeniu, że część projektu realizowana jest z kredyty bankowego. Rodziło to konieczność jego uzyskania, co w zasadzie na starcie eliminowało wszelkie nowe podmioty, wymóg „ciężki” ale do przejścia. Być może ten element dla nowych firm, byłby wskazany? Bank jest w końcu zainteresowany analizą finansowych podstaw przedsięwzięcia. Nawet nie wiem od czego zacząć komentować. Bank jest zainteresowany analizą?! Realizowanie części projektu z kredytu bankowego?! Pobudka! Mili Państwo, banki w Polsce to wielkie, przerośnięte, skostniałe instytucje, w dodatku nieefektywne i rozpuszczone możliwością zdzierania dowolnie dużych opłat za rachunki od klientów indywidualnych. Uzyskanie kredytu bankowego dla firmy, która istnieje krócej niż rok jest, oczywiście, możliwe. W przypadku ustanowienia 102% zabezpieczenia. Najlepiej w postaci blokowanych środków na rachunku. Zaraz, chwileczkę… ale… no właśnie. Walczę z tym mitem, bo jest regularnie bez zastanowienia powtarzany. Swego czasu ludzie z PARP mieli w prezentacjach zachęcających do 8.1 slajd opisujący „możliwości finansowania”, była tam na poczetnym miejscu promesa kredytowa. Gdy zapytałem kiedy ktoś ostatnio faktycznie widział taką promesę zapadła cisza… Żeby zakończyć weselszą nutą powiem jeszcze, że swego czasu dzwoniła do mnie miła pani z Banku Fortis i chciała oferować „specjalny kredyt dla firm, które uzyskały dofinansowanie europejskie w programie POIG”. Miło się rozmawiało, do momentu gdy Pani upewniła się, czy firma istnieje ponad rok, a ja powiedziałem, że oczywiście nie, bo gdyby istniała dłużej niż rok to by nie spełniała warunków POIG 8.1. Na to Pani powiedziała, że niestety mają wymogi żeby nie dawać kredytów firmom, które działają krócej niż rok. Sugerowałem przemyślenie działań, bo te dwa wymagania się nie spotkają i kredytów bank udzieli, powiedzmy, niewiele — ale Pani tylko powiedziała, że szef jej kazał dzwonić. Tak właśnie działają banki w Polsce — udają, że dają kredyty na nowe przedsięwzięcia. Nie pomagajmy więc budować fikcji.KomentarzeStara prawda głosi, iż banki to takie przewrotne instytucje które dają Ci kasę jak jej nie potrzebujesz, a zabierają wtedy gdy jest najbardziej potrzebna....Ponieważ 8.1 skierowane jest do przedsiębiorców < 12 mcy praktycznie wyklucza to możliwość otrzymania kredytu na realizacje przedsięwzięcia... Wyjątkiem mogą być:- kredyty brane fizycznie przez właścicieli - np. hipoteczne - firmy które mają zabezpieczenie w aktywach (właściciele wnieśli aportem np. budynek biurowy)- firma przed rozpoczęciem realizacji projektu 8.1 ukończyła rok działalności, posiada bardzo dobry pit (która firma z 8.1 posiada) - dotyczy to więc firm które powstały na bazie innych biznesów i tak naprawdę projekt 8.1 realizują przy okazji.To tak generalizując - ale prawda jest smutna... dużo prościej otworzyć linię kredytową pod 8.2 - bo firma jest starsza i prawdopodobnie ma dobrą historię kredytową.Łukasz Plutecki2009-12-30Łukasz: dokładnie. Dlatego denerwuję się, gdy powtarza się bez zastanowienia frazesy o finansowaniu nowych firm z kredytów bankowych.Jan Rychter2009-12-31Polecam kredyt technologiczny ;)Kredyty2010-02-05Witam, wszystko co jest napisane w tym artykule to szczera prawda. Sam prowadzę działalność gospodarczą i zdobycie kredytu w momencie, gdy firma istnieje mniej niz rok jest praktycznie nie możliwe. Jak już coś proponują to oczywiście wymagają wykaz dochodów, na a jaki wykaz dochodów może okazać nowa dopiero co rozwijająca się firma? Podsumowując: Śmiech na sali.Zapraszam również na mojąstronę, gdzie można znalieźc informacje na temat: kredytów:"http://www.noweinwestycje.portalemaxi.pl"timonpl2010-04-21'
