["https://jan.rychter.com/blog/2009/2/25/dziura-w-google.html"]
title = "Dziura w Google"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = "Dziura w Google2009-02-25Przyjęło się twierdzić, że Google potrafi wszystko znaleźć. W jego indeksie jest jednak wielka dziura, na pierwszy rzut oka trudna do zauważenia.Wyszukiwarka Google robi ranking zauważonych stron według algorytmu PageRank. W uproszczeniu polega on na tym, że więcej punktów dostają strony, do których prowadzi więcej odnośników. Sprawdza się to znakomicie dla popularnych stron internetowych -- w końcu jeśli strona jest interesująca, więcej osób daje do niej odnośniki. Nie działa jednak zupełnie dla stron niszowych lub regionalnych.Kilka miesięcy temu uruchomiłem niewielki portal internetowy, przeznaczony dla mieszkańców kilku osiedli w Warszawie. Jak się okazuje, strona ta nie ma żadnych szans na zaistnienie w sensownym miejscu rezultatów wyszukiwania w Google. Ponieważ jest niszowa i regionalna, nikt nie będzie dawał do niej odnośników. Czytelnicy dowiadują się o niej z ogłoszeń lub wzajemnie od siebie. Pomimo tego, że kilkaset osób regularnie odwiedza stronę i uczestniczy w dyskusjach, w Google jest ona nie do znalezienia!Ktoś powie “to problem strony, widocznie nie jest interesująca” -- jednak czy nie jest źle, gdy w rezultatach wyszukiwania dla danej nazwy ulicy dominują portale z nieaktualnymi ogłoszeniami dotyczącymi nieruchomości i niby-strony informacyjne z mapą i reklamami?O podobnym problemie pisze Mateusz Pakulski w artykule “Jeśli nie ma w Google to nie istnieje? Nieprawda” w Internet Standard. Nie należy za bardzo polegać na wyszukiwarkach.Moim zdaniem jest to problem, który dotyczy większej ilości stron i Google będzie musiał go prędzej czy później rozwiązać."
