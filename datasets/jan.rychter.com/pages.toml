["http://jan.rychter.com/blog/2009/11/8/hity-i-kity-prawne-wedug-przedsibiorcow.html"]
title = "Hity i kity prawne według przedsiębiorców"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = 'Hity i kity prawne według przedsiębiorców2009-11-08Hity i kity prawne według przedsiębiorców: „Największy bubel: przerzucenie na pracodawców obowiązku sporządzania PIT pracowników.” Zgadzam się całkowicie. To jest pusty ruch, który niczego nie poprawi, a tylko doda pracy przedsiębiorcom. Ma jednak poważniejsze efekty: tak samo jak „połowa ZUS płacona przez pracodawcę” zaciemnia rzeczywisty obraz. Ukrywa przed ludźmi wielkość faktycznych obciążeń fiskalnych. Warto też powtarzać, że podatek dochodowy wcale nie jest czymś naturalnym czy oczywistym. Zniesienie PIT i wprowadzenie zamiast tego podatku od przychodu (bez żadnych ulg czy „kosztów”) pozwoliłoby na likwidację zeznań rocznych i całej urzędniczej maszynerii z nimi związanych. Pracodawca odprowadzałby po prostu stały procent pensji pracowników do Skarbu Państwa. Szkoda, że rządowi i Sejmowi brakuje odwagi, by takie zmiany wprowadzić.KomentarzeWłaściwie zgadzam się z tym wpisem, mam jednak jedną uwagę do ostatniego akapitu.Proponowana zmiana jest zupełną rewolucją, reformą fiskalną bardzo dużego kalibru, i jako taka powinna być wprowadzana maksymalnie ostrożnie. Mam takie spostrzeżenie, że działający organizm państwowy jest pod bardzo wieloma względami podobny do wdrożonego dużego systemu informatycznego (Polsce to nawet numery wersji się nadaje; kiedyś skrobnąłem o tym eseik). Jest w tym oczywiście trochę żartu, ale ta analogia prowadzi do ciekawych wniosków. Na przykład: zmiany należy robić metodą stopniowych refaktorów, wyrzucania złych mechanizmów i zastępowania ich dobrymi, a nie przepisywania kodu... ehm, to jest, chciałem powiedzieć: projektowania ustaw od zera (por. esej Joela Spolskiego "Things You Should Never Do, Part I").Daniel Janus2009-11-08Daniel: nie zgadzam się -- właśnie tak wprowadzamy zmiany przez ostatnie 10 lat. Polecam lekturę tzw. UPDoOF (Ustawa o Podatku Dochodowym od Osób Fizycznych) by zobaczyć jakie efekty to daje. Łatanie łat na łatach.Całą tę ustawę moim zdaniem należy wyrzucić do kosza, bo jest gniotem, którego nikt do końca nie rozumie i który generuje masę problemów i realnych kosztów.Jan Rychter2009-11-09'
year_published = 2009
