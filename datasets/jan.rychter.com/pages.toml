["http://jan.rychter.com/blog/2009/10/20/karty-miejskie-w-warszawie-a-prywatno.html"]
title = "Karty miejskie w Warszawie a prywatność"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = '''Karty miejskie w Warszawie a prywatność2009-10-20Dyskusja o nowych, spersonalizowanych kartach miejskich jakie Zarząd Transportu Miejskiego wprowadził w Warszawie toczy się już od dłuższego czasu. Dziś raban w tej sprawie podnieśli radni PiS (o dziwo). Mają rację. Nie ma żadnego powodu, żeby na kartach miejskich zapisywać dane osobowe ich właścicieli. Tłumaczenie ZTM, że dzięki danym osobowym jest „możliwość odzyskania niewykorzystanej części zakodowanego na karcie biletu w przypadku utraty karty” jest bzdurą. Każdy sensowny projektant systemów informatycznych może wytłumaczyć ZTM jak zbudować system, który ma te same właściwości a nie przechowuje odczytywalnych danych osobowych. Po co jednak budować system, skoro dotąd rolę dowodu zakupu doskonale spełniał paragon? Czy nagle paragony się zepsuły i nie nadają się już do udowadniania zakupu w przypadku gdy utraciłem kartę? Prywatności i ochrony danych osobowych nie można traktować lekko. Nie można też tolerować niekompetentnych tłumaczeń.KomentarzeNo właśnie nie do końca paragon się do tego nadaje. Problem polega na tym, że Data kupienia karty nie zawsze oznacza daty jej aktywacji. W takiej sytuacji nie jest możliwe odzyskanie niewykorzystanych środków. Oczywiście pobieranie danych przez ZTM też jest nie do końca w porządku, ale w jaki inny sposób można zrealizować taki system? Standardowe zestawienie login/hasło, może numer PESEL?Michał Słowikowski2009-10-21Jezeli karta nie ma byc spersonalizaowana, to przez zglaszanie jej zgubienia i doladowanie na podstawie paragonu moge sobie wyrobic pare kopii i rozdac znajomim i to chyba bolalo by ZTM. I uzywanie PESEL, prosze bardzo, moj jest 00000000000 :) Trzeba pamietac o uzytkownikach, ktory nie sa Polakami.Martin2009-10-21Jan oczywiście ma rację.1. jak konkretne często gubicie Panowie karty? -> procedura odtwarzania nie musi byc szybka.2. procedura odtwarzania środków, w przeciwieństwie do wydawania biletów, może już wymagać podania danych osobowych.A jeżeli procedura odtwarzania środków nie musi być natychmiastowa a "przedstawienie się", kto konkretnie te środku chce otrzymać jest dopuszczalne, to łatwo sobie wyobrazić procedurę kulkudniową, która umożliwia zebranie "kopii paragonów", przez pewien czas i wtedy widać, który paragon jest oryginalny, a który jest kopią. Kopistę oczywiście daje się łatwo ścigać i to w ogóle nie bolało by ZTM ... chyba, że by nie sprawdzali.RP2009-10-27A czy urząd sprawdza jakoś podany PESEL ? (z dowodu np). Algorytm generowania numeru PESEL jest znany tutaj, więc można takowy sobie wygenerować. Pytanie czy lepiej oszukać urzędnika i iść "pod prąd" czy jak całe stado ..PozdrawiamMarcin Jurczuk2009-11-06Co do pytania Martina - ZTM ma wniosek dla nie posiadających numeru PESEL :) Niestety tylko obcokrajowiec może go wypełnić. Jak widać można posiadać dane bez PESEL'u umożlwiające identyfikacjęWniosek tutajMarcin Jurczuk2009-11-06'''
