["https://jan.rychter.com/blog/2009/12/22/wsparcie-unijne-nie-straszne-tylko-drogie.html"]
title = "Wsparcie unijne: nie straszne, tylko drogie"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = "Wsparcie unijne: nie straszne, tylko drogie2009-12-22Przemek Żyła zżyma się na narzekających na biurokratyczne trudności związane z dofinansowaniem POIG 8.1. Wszystko zależy od punktu widzenia i celów. Dla przedsiębiorcy, który właśnie założył innowacyjną firmę, celem nie jest zdobycie pieniędzy unijnych. On z tych pieniędzy i tak sobie nie zapłaci, a z samego dofinansowania kokosów ani technologii nie będzie. Dla niego celem jest zbudowanie firmy, czyli stworzenie odpowiednich technologii, a następnie sprzedanie ich. Fundusze unijne są środkiem, a nie celem. To jest zupełnie inny punkt widzenia niż konsultantów, prawników, urzędników, oraz całej masy firm, które innowacyjne nie są, a zakładane są tylko po to, żeby uszczknąć nieco pieniędzy unijnych. Dlatego nie dziwcie się przedsiębiorcom, którzy denerwują się na bezsensowne wymogi i formalności. Oni denerwują się nie na wszystkie formalności, tylko na te bezsensowne. Do tego każdego dnia liczą, czy się opłacało — czy na pewno fundusze unijne były najlepszym środkiem do realizacji ich celów? Sam złożyłem właśnie trzecią rundę poprawek do pierwszego wniosku o rozliczenie etapu. Bardzo niewielka część tych poprawek jest merytoryczna i faktycznie potrzebna. Zabawa w poświadczanie za zgodność z oryginałem wyciągu ze stawek ZUS (wywieszonego w każdej sali oddziału ZUS) albo dostarczanie rozmaitych oświadczeń sprzedawców, że faktycznie mi sprzedali to, na co wystawili fakturę, jest tak naprawdę kosztem — zarówno dla mnie, jak i dla podatnika.KomentarzePoliczyłeś może procentowo jak drogie jest to wsparcie?pkj2009-12-24"
