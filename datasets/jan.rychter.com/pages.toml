["https://jan.rychter.com/blog/2009/2/4/arogancja-mbanku.html"]
title = "Arogancja mBanku"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = "Arogancja mBanku2009-02-04Jeśli kogoś nie przekonał mój wpis sprzed paru dni na temat krótkowzroczności zarządów spółek i krótkoterminowego planowania, polecam przeczytanie odpowiedzi mBanku na oburzenie swoich klientów, których trzyma w szachu wymuszając marże znacznie powyżej rynku:“Klienci są oburzeni. Założyli nawet dwie strony internetowe i protestują przeciwko takim praktykom - mstop.pl i nabiciwbank.pl Jarosław Mastalerz, wiceprezes BRE tłumaczy gazecie, że klienci bez żadnych opłat mogą zrezygnować z umowy z nami i przejść do innego banku, ale tego nie robią. - Wielu z nich w ogóle nie dostałaby finansowania we franku - dodaje.”dalej czytamy też:“Na niższe marże w BRE nie ma co liczyć, bo zarabianie na wysokich marżach jest jednym z głównych punktów strategii BRE na ten rok.”Dziękuję panu wiceprezesowi za potwierdzenie moich słów. Z pewnością wyniki banku w krótkim terminie będą doskonałe. Już mogę obecnemu zarządowi gratulować premii i zarobków.Ja zaś gdy tylko mi się uda, wyrwę się ze szponów mBanku i przeniosę do konkurencji absolutnie wszystko, co udało mi się tam przez lata skonsolidować. Podobnie zrobią inni -- nikt nie lubi być wyciskany i każdy kto został wycisnięty, dobrze to sobie zapamięta."
