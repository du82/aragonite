["http://jan.rychter.com/blog/2009/11/9/wity-rachunek-zaliczkowy.html"]
title = "Święty Rachunek Zaliczkowy"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = '''Święty Rachunek Zaliczkowy2009-11-09Każdy kto prowadzi firmę wie, że powyżej pewnej ilości transakcji nie daje się łatwo zrozumieć wszystkiego, co się dzieje w finansach. Śledząc rachunek bankowy nie zobaczymy wszystkiego i pełen obraz nie będzie zrozumiały. Dlatego opracowane zostały standardy rachunkowości: mamy pełną księgowość, plan kont, bilans, zestawienia i sprawozdania. Narzędzia świetnie spełniające swoją funkcję. Niestety, przy projektowaniu systemu zaliczek w działaniu POIG 8.1 pojawił się Urzędnik, który o rachunkowości pojęcia nie miał. Postanowił więc „uprościć” życie sobie i swoim kolegom, wprowadzając specjalny Święty Rachunek Do Obsługi Zaliczki. Aktywa, pasywa i rachunek przepływów pieniężnych były dla niego abstrakcją, ale rozumiał co to jest stan rachunku i wyciąg bankowy. Wprowadził więc regułę: zaliczka z dofinansowania POIG 8.1 może być przelana wyłącznie na rachunek bankowy założony specjalnie w tym celu. Potem zaś wszelkie płatności związane z kosztami kwalifikowanymi projektu mogą być robione tylko z tego rachunku, nie wolno go też pod żadnym pozorem wykorzystywać do niczego innego. Proste? W wyimaginowanym przez Urzędnika świecie tak. Oto świat stanie się zrozumiały, a wyciąg bankowy zastąpi sprawozdania finansowe firmy. Niestety, rzeczywistość jest inna. Gdyby to było takie proste, to nikt nie zatrudniałby księgowych, tylko miał dużo Specjalnych Rachunków Bankowych i drukował z nich wyciągi. Najwyraźniej jednak firmy tego nie robią — dlaczego? Oto kilka przykładowych powodów: Płacąc za towary, w/g Urzędnika powinniśmy płacić dwoma przelewami: kwalifikowane 85% kosztu z rachunku zaliczkowego, pozostałe 15% oraz VAT z innego rachunku firmy. Pomijając już dwukrotne prowizje bankowe oraz fakt, że w umowie dofinansowania jest to niejasno zapisane, jest to czasochłonne dla wszystkich i kłopotliwe dla dostawców. Nie da się przypisać wszystkich płatności kwalifikowanych w odpowiednim procencie do jednego rachunku. Urzędnik zapomniał np. o poleceniach zapłaty (np. za telefony komórkowe), albo o przelewach ZUS, których nie robi się w kawałkach. Zapomniał też o zwrotach pieniędzy za zakupy zrobione prywatną kartą kredytową. Ze Świętego Rachunku Zaliczkowego i tak zostaną pobrane prowizje bankowe, które nie będą kosztami kwalifikowanymi i będą problemem w rozliczeniach. Mnóstwo rzeczy jest niejasne: np. czy można zwrócić pieniądze na rachunek zaliczkowy? Przelać tam wydany wcześniej z niego VAT? Zwrócić prowizje bankowe? Ktoś, kto nie znał się na finansach, postanowił „uprościć” rozliczenia, zamiast tego powodując mnóstwo problemów, dodatkowych kosztów, niejasności. Zmarnował mnóstwo czasu przedsiębiorców i urzędników, którzy teraz muszą odpowiadać na pytania, kwestionować rozliczenia (pomimo że sumarycznie kasa się zgadza), dochodzić szczegółów. Wszystko przez niekompetencję i fałszywe wyobrażenia o finansach i prowadzeniu firmy.KomentarzeNie mam styczności z POIG 8.1 ale w koło słyszę różne historie mniej lub bardziej prawdziwe (w świecie Urzędników ciężko odróżnić fikcję od rzeczywistości). Doszła do mnie informacja która uważam za mało wiarygodną choć w kontekście Świętego Rachunku Zaliczkowego jestem skłonny zastanowić się czy aby się nie mylę. Mianowicie rozważano, a może nawet taki zapis wprowadzono w ostatnim naborze do 8.1, przymus wykonania minimalnych przychodów z pesymistycznej wersji biznesplanu w okresie 3 lat pod rygorem zwrotu dotacji unijnej.Paweł Wasilewski2009-11-09Paweł: a potrafisz konkretnie wskazać, gdzie taki zapis się znajduje? (jeśli istnieje)Wolałbym trzymać się konkretów. Nie uogólniajmy też z urzędnikami -- z moich dotychczasowych doświadczeń wszyscy urzędnicy, z jakimi miałem kontakt w RIF lub PARP byli mili, konkretni i pomocni. Pisałem o abstrakcyjnym Urzędniku, który wymyślił ten bezsensowny specjalny rachunek zaliczkowy i nie chciałbym, żeby było to zinterpretowane jako ogólne narzekanie.Jan Rychter2009-11-09No to ja musze małe dementi wprowadzić ;)Z tego co się orientuje - a dopytywaliśmy kilka razy w MARR'ze (wiadomo - co kraj to obyczaj, więc trzeba pytać u źródła), możesz wykonać zapłatę za całą fakture w kwocie netto z rachunku przeznaczonego na potrzeby zaliczki.Następnie VAT dopłacasz ze swojego konta.Udział własny koszty - tj 15% w przypadku 8.1 masz wykazać na zakończenie kolejnych etapów. Nie jest to więc tak bardzo restrykcyjne. Przykład:- 3 etapy po 100tys, dofinansowanie 85tys na każdym- kwota zaliczki 76,5Na zakończenie etapu 1 po prostu wnioskujesz o wypłatę 85-76,5. Mają się zgadzać rachunki, uzyskane oprocentowanie na rachunku zaliczkowym doliczasz do 75,6 (defakto będzie to 85-76,5 - oprocentowanie).Podobny przykład - 5 etapów po 100tys. Kwota dofinansowania 425tys, zaliczka 127tys.- koniec pierwszego etapu wydane 100 tys (+VAT) - wszystko z zaliczki, brak refundacji- koniec drugiego etapu wydane 200tys, z zaliczki 127 tys, refundacja = 2*85tys - 127tys - należne odsetki To że jest dodatkowy rachunek według mnie mocno upraszcza obliczanie odsetek od kapitału. To, że są problemy z ustawieniem polecenia zapłaty. No zgadza się, ale c'mon dostajesz przysłowiowe pińcet tysięcy. Podejrzewam, ze byłbyś w stanie rozliczyć polecenie zapłaty, tylko to dodatkowa papierologia. Jak otrzymujemy kilkaset tys złoty to trzeba się liczyć, ze ktoś będzie chciał sprawdzić wydatkowanie. Na piekne oczy się nie da.Co do zwrotu na rachunek zaliczkowy - AFAIK absolutnie nie wolno. Nie wolno z zaliczkowego płacić niczego poza kosztami kwalifikowanymi.Łukasz Plutecki2009-11-10Łukasz: no, niespecjalne dementi. Z tego co piszesz, nadal wynika że za każdą fakturę muszę płacić dwa razy oraz że niczego ów osobny rachunek nie rozwiązuje, tylko wprowadza dodatkowe problemy.Jan Rychter2009-11-10Jan: Odnośnie mojego komentarza to miałem nadzieję że opisany wymóg był tylko plotką ale po przeczytaniu Twojego wpisu nabrałem podejrzeń iż mogło tak być. Postaram się dowiedzieć u źródła z którego posiadam informacje i odpisać tutaj.Paweł Wasilewski2009-11-10Zgadzam sie - 2 przelewy pozostaja, ale chyba moja wizja 8.1 mimo wszystko jest troche prostsza ;)Co do prawdziwych problemow, to powiem tak - problemy zaczynaja sie przy rozliczaniu kosztow :D my na szczescie nie mamy pelnej ksiegowosci, ale firmy ktore maja musza robic statystyczna korekte kosztow - i nie jest to wymysl PARP a US. Chodzi o to, ze do czasu otrzymania refundacji calosc poniesionego wydatku stanowi koszt i amrotyzuje sie normalnie. Po np. 30 dniach (w chwili otrzymania refundacj) tylko wklad wlasny jest kosztem i trzeba zrobic statystyczna korekte..... Nie wiem jak w to wszystko wpisuja sie zaliczki, ale pewnie jeszcze bardziej komplikuja...Łukasz Plutecki2009-11-10Ja tylko dopiszę sprawdzone info:* ze specracunku płacimy kwotę netto, vat idzie z naszego normalnego firmowego konta* nie rozbijamy kwoty netto na 85-15%, jeden przelew* absolutnie nie należy zwracać VATu jeśli się już zapłaciło całą kwotę ze specracunku. W tej chwili w PARPie rozpatruje się temat "co zrobić z tym durnym modelem płatności, bo ludzie narobili już bigosu na obu rachunkach..."Pozdrmichal samojlik2009-11-10Michał: czy przeszło to już przez rozliczenie jakiegoś etapu?PARP niech temat rozpatruje, bo jestem pewien, że nikomu nie udało się mieć tego tak idealnie rozdzielonego jak sobie to zamarzył ów mityczny Urzędnik.Jan Rychter2009-11-11Trafiłem tu wczoraj, więc komentuję rozmowy sprzed kilku miesięcy :/Tak na prawdę największym problemem przy koncie zaliczkowym (i zresztą w innych kwestiach finansowych związanych z dotacją), jest przestawienie się z myślenia biznesowego (czyli tego do którego jesteśmy przyzwyczajeni) na myślenie urzędnicze, którego się od nas wymaga, i które w tym wypadku jest definitywnie nadrzędne. Jeżeli przed dokonaniem jakiejkolwiek operacji w ramach realizowania projektu dokładnie przeczytamy instrukcje, a o wyjaśnienia zwrócimy się nie do księgowej tylko do PARP lub RIF, to dużych problemów nie powinno być. A w dokumentach PARPowskich stoi jak byk, żeby NIGDY POD ŻADNYM POZOREM, nie przelewać ŻADNYCH pieniędzy na ŚRZ (gratuluję udanej nazwy: Święty Rachunek Zaliczkowy). I nie ma mowy o przelewaniu tam zapłaconego już VAT, czy czegokolwiek innego. Lepiej się z VAT'u tłumaczyć przed PARP'em niż samodzielnie dokonać przelewu.A czemu nie należy konsultować się z księgową? Otóż większość księgowych (chyba, że mamy taką osobę na etacie), ma generalnie w nosie nasz projekt. Dla nich ważne jest tylko, żeby wszystko zgadzało się w Urzędzie Skarbowym. Poza tym ciężko jest im zrozumieć, że jakaś instytucja może nie akceptować wymogów skarbówki i żądać innego sposobu rozliczania / księgowania / łotewer. A jak problemu uniknąć. Trzeba było o tym myśleć wcześniej: prowadzenie rachunku bankowego jest kosztem niezbędnym do realizacji projektu, w związku z czym jest jak najbardziej kosztem kwalifikowanym. Jeśli zatem umieścilibyśmy ten koszt w biznes planie, to teraz nie byłoby problemów ze ściąganiem automatycznym tych kosztów przez bank. A na koniec pozostaje jedno: jeśli wydawanie / rozliczanie zaliczki wydaje się zbyt trudne, zawsze można realizować projekt opierając się tylko na refundacji. To oczywiście wymaga zaangażowania znacznych własnych środków (lub kredytu). Coś za coś.Buzz2010-02-24'''
year_published = 2009
