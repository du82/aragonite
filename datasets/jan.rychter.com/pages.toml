["http://jan.rychter.com/blog/szkoly-przedszkola-koncepcje-urbanistyczne-10-2014"]
title = "Szkoły, przedszkola i koncepcje urbanistyczne"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = "Szkoły, przedszkola i koncepcje urbanistyczne2014-10-16Wszystkie niepubliczne szkoły w mojej okolicy przeprowadzać będą rekrutację. Egzaminy (!) pozwalają na wyselekcjonowanie tylu dzieci, na ile faktycznie szkoła ma miejsce. Właśnie dowiedziałem się, że w jednej ze szkół w okolicy będzie 14 miejsc dla sześciolatków, z czego 8 prawdopodobnie zostanie zajęte przez rodzeństwo starszych dzieci już chodzących do szkoły. Podań złożono 90. Jeśli ktoś sądzi, że w szkołach państwowych jest lepiej, to się myli. Dyrektor niedalekiej szkoły podstawowej musi przyjąć 300 dzieci w tym roku do pierwszych klas. Oczywiście nauka odbywać się będzie w systemie zmianowym. Fenomenalny wyż demograficzny? Bynajmniej. Nakładają się dwa problemy: reforma oświatowa i brak sensownej polityki przestrzennej w Warszawie. Szczególnie irytujący jest ten drugi problem. Zaniedbane przez dziesiątki lat plany zagospodarowania, bezmyślne sprzedawanie przez spółki miejskie wielkich terenów deweloperom i brak spójnej polityki urbanistycznej zaczynają się mścić. Deweloperzy ochoczo budują wielkie ogrodzone osiedla, sprzedając klientom idylliczną wizję mieszkania w cudownej enklawie. „Ci inni” mają pozostać za płotem. Rzecz jasna deweloperzy nie pozostawiają ani skrawka terenu na szkoły i przedszkola, bo to nie jest opłacalne. A klienci o tym nie myślą, kupując mieszkania, bo przecież zawsze szkoła będzie „w okolicy”. Problem w tym, że są miejsca, gdzie tej „okolicy” już nie ma, tak dużo jest nowych osiedli. Popatrzmy na konkretny przykład z warszawskiego Mokotowa: miasto, bądź zależne od miasta spółki miejskie sprzedało kilkunasto-hektarowe działki pod osiedle Marina Mokotów, oraz osiedla budowane przez Eko-Park, BRE i MPRO. Działki te zostały całkowicie zabudowane budynkami mieszkaniowymi i biurowymi, bez pozostawienia ani metra kwadratowego na usługi oświatowe. Nieco lepsza sytuacja jest w „miasteczku Wilanów” (kuriozalna nazwa!), gdzie miasto pod presją Stowarzyszenia Mieszkańców Miasteczka Wilanów obudziło się po kilku latach i wykupiło od deweloperów grunty pod budowę szkoły i przedszkola. Architekci i urbaniści są tak oderwani od rzeczywistości, że opisują te problematyczne osiedla jako osiągnięcia. Weźmy jako przykład artykuł „Ikony architektury mieszkaniowej w polsce na początku XXI wieku – charakterystyka miejskiego środowiska mieszkaniowego”. Przeczytamy tam o liniach pierzei, kwintesencji nurtu neomodernizmu, czytelnych i konsekwentnych układach urbanistycznych, siatkach ulic, oraz o tym, że „całość skomponowano konsekwentnie według ścisłych reguł urbanistycznych”. Ze ścisłych reguł urbanistycznych nie wynikało, że osiedle na pięć tysięcy mieszkańców potrzebuje wydzielonego miejsca na budowę przedszkola i szkoły podstawowej?! Moim zdaniem pracownia APA Kuryłowicz & Associates, która opracowywała koncepcje urbanistyczne dwóch z trzech opisywanych osiedli, powinna być znana nie z „ikon architektury mieszkaniowej”, ale z gniotów urbanistycznych, jakimi są wspomniane osiedla. Czy dojrzeliśmy już na tyle, żeby wstydzić się dzielnic miast budowanych w ten sposób?KomentarzeNa Tarchominie miejsca była masa a jest ciągle sporo, tylko szkół jakoś nikt nie zbudował. Parę lat temu burmistrz raczył powiedzieć, że wyż będzie trwał krótko i nie warto i snuł jakieś rozważania o dowożeniu dzieci do innych dzielnic... W podstawówce na Strumykowej jeszcze przed rewolucją sześciolatków nauka szła na trzy zmiany (syn kolegi w 4 czy 5 klasie chodził na 15-16). Co się tam dzieje teraz boję się dowiadywać. Aha, gdy kupowałem mieszkanie, gmina oficjalnie planowała budowę co najmniej dwóch nowych szkół, gdzieś na wczesne lata 2000-e.Mekk2014-10-16"
year_published = 2014
