["https://jan.rychter.com/blog/2009/1/28/era-szybkiego-pienidza.html"]
title = "Era szybkiego pieniądza"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = 'Era szybkiego pieniądza2009-01-28Żyjemy w czasach, gdy rzeczy dzieją się szybciej, a perspektywy czasowe skracają.Mój bank postanowił poprawić sobie wynik finansowy poprzez wyciągnięcie na siłę pieniędzy od swoich najbardziej lojalnych klientów. Najpierw wytrwale nie obniżał oprocentowania kredytów hipotecznych we frankach szwajcarskich, pomimo spadku stopy procentowej CHF o 2,1%. Przyciśnięty do muru przez dobrze prowadzoną kampanię zdesperowanych klientów (http://www.mstop.pl/),wykonał gest w kierunku klientów. Zaproponowano wszystkim kredytobiorcom ze "starymi" umowami z oprocentowaniem wyznaczanym przez zarząd banku przejście na system LIBOR+marża. Brzmi dobrze? Dostałem od banku taki komunikat:mBank przygotował dla Ciebie nowe warunki kredytu hipotecznego (nr umowy kredytowej 000______). Proponujemy naliczanie oprocentowania w oparciu o stałą marżę oraz LIBOR3M CHF. Proponowana marża to: 3,10%.Żaden człowiek o zdrowych zmysłach nie zaciągnąłby kredytu hipotecznego w CHF z marżą banku 3,10%. Jest to marża zbójecka, wymuszona przez bank na obecnych klientach. Bank ją wymusza, bo może. Wiadomo, że przy tak trudnej sytuacji z zaciąganiem nowych kredytów oraz przy tak rozchwianych kursach walutowych operacja refinansowania raz, że jest trudna, a dwa, że może skończyć się ubytkiem w portfelu rzędu kilkudziesięciu tysięcy złotych, gdy kurs CHF drgnie z dnia na dzień o kilka groszy.Czy wyciśnięcie pieniędzy z klientów, którzy nie mogą uciec poprawi wynik finansowy banku w tym kwartale? Oczywiście. Pewnie poprawi też wyniki w kilku kolejnych kwartałach. Zarząd będzie mógł sobie pogratulować sukcesów, uścisnąć dłonie i wypłacić sowite premie za świetne wyniki finansowe. Tylko jakim kosztem? "Wyciśnięci" w ten sposób klienci doskonale sobie zapamiętają, jak bank ich potraktował. Jak tylko będą mogli, wyniosą się nie tylko z kredytami, ale też z innymi usługami. Zła prasa się rozniesie, bank straci budowany przez lata wizerunek niedrogiego i nowoczesnego.Oczywiście nic z tego nie martwi obecnego zarządu banku -- przecież w tej chwili wyniki będą doskonałe, a to z bieżących wyników zarząd jest rozliczany. Akcjonariusze oczekują szybkich zysków.Weźmy inny przykład. Miałem podpisaną umowę na 2 lata z Orange, z której zerwaniem wiązała się kara umowna. Po roku zgłosiłem się do Orange i powiedziałem, że abonament jest dla mnie za wysoki i ogólnie nie przystaje do moich potrzeb. Chciałem więc rozwiązać bieżącą umowę, zapłacić karę i natychmiast podpisać nową w Orange (z którego byłem zadowolony), zachowując numer telefonu. Jak się okazało, takie zachowanie numeru telefonu jest niemożliwe, celowo -- jak mi wytłumaczono, gdyby było możliwe, to wszyscy ciągle zmienialiby abonamenty na bardziej optymalne. A tak operator ma ich czym szantażować -- chcesz zmienić abonament, musisz zmienić numer telefonu.Argumentowałem, że prawo daje mi możliwość przeniesienia numeru telefonu do innego operatora, co jest bardzo łatwe. Przy tej możliwości ów szantaż przestawał mieć sens. W Orange jednak byli twardzi, wytrzymali i zmusili mnie to przeniesienia się do Ery.Jaki sens ma wymuszanie metodami szantażu na klientach by płacili więcej? Finansowy! Tacy klienci płacą więcej, a wynik w tym kwartale jest dzięki temu lepszy. To, że w końcu zawsze odejdą, będzie już problemem następnego zarządu.Kolejny przykład, rzecz drobna, ale znacząca. Podpisałem umowę z Erą. Abonament Twój Wspaniały Abonament XXX dawał mi XXX "darmowych minut" w pakiecie. Zaraz po aktywowaniu mojej karty (co notabene wymagało trzech wizyt w sklepach, 7 telefonów do infolinii oraz strajku okupacyjnego w sklepie przed Panem Kierownikiem) radośnie zacząłem korzystać z telefonu. Jakież było moje zdziwienie gdy po paru dniach dostałem fakturę na kilkadziesiąt złotych za wykonane rozmowy!Jak się okazuje, w sieci Era pierwszy okres rozliczeniowy trwa dwa dni. W tym czasie przysługuje mi 2/30 darmowych minut i 2/30 darmowych SMS -- czyli, powiedzmy, niedużo. Wszystkie ponad to są płatne. Sprytne? Jak najbardziej! Poprawia wyniki firmy? Pewnie! Przecież nikt nie zdaje sobie z tego sprawy i myśli, że może rozmawiać w ramach abonamentu. Założę się, że wszystkie pierwsze faktury są dzięki tej sztuczce przynajmniej o kilkadziesiąt złotych większe.Jaki sens ma taka sztuczka? Finansowy! Wynik w bieżącym kwartale...Niestety, nikt już nie patrzy na zyski długoterminowo. W dzisiejszym kapitaliźmie giełdowym nie ma żadnego gracza, który byłby zainteresowany tym, co wydarzy się za 10 czy 20 lat. Taka perspektywa istnieje w firmach rodzinnych, kończy się jednak w momencie wejścia na giełdę. Ironią jest to, że bankowcy i operatorzy telekomunikacyjni potem wylewają krokodyle łzy rozpaczając nad "churn rates" (czyli tym, ilu klientów od nich odchodzi) i zrzucając winę na tych niedobrych, nielojalnych klientów, co to w dzisiejszych czasach tak nierozsądnie zmieniają zdanie.'
