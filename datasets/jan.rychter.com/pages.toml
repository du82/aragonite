full_description = "O prawdziwych przedsiębiorcach2009-03-01Warto przeczytać: Jason Calacanis radzi jak przetrwać ciężkie czasy. Zgadzam się ze wszystkim, co napisał, a za szczególnie ważne uważam:“People’s reputations are made in the bad times more than the good times.”Przedsiębiorczość poza sukcesem, który tak chętnie gloryfikuje prasa, ma też swoją drugą stronę: ciężką pracę, porażki i rozczarowania. Sam byłem niedawno świadkiem jak kończyła się firma i bardzo zmieniło to moje zdanie o wielu ludziach.Pamiętajmy, że naturalną częścią życia jest, że niektórym firmom się powodzi, a innym nie. Niepowodzenie nie jest tragedią -- tak jak pisze Jason, jest częścią życia przedsiębiorcy."
