["https://jan.rychter.com/blog/nareszcie-5-2015"]
title = "Nareszcie?"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = 'Nareszcie?2015-05-31Z mieszaniną radości i strachu czytam i oglądam wywiady z Ryszardem Petru, który z poparciem Leszka Balcerowicza tworzy nową partię. Cieszy mnie, że wreszcie pojawia się sensowny głos w polityce. Jestem zmęczony ciągłymi dyskusjami o niczym, wyborami gdzie jedna partia straszy mnie „tą drugą”, głosowaniem z przymusu, na tych którzy moim zdaniem mniej popsują. Męczy mnie, że politycy robią co mogą, żeby poprzyklejać sobie nawzajem etykietki, wiedząc że tak naprawdę nie różnią się niemal niczym. Jako przedsiębiorcę cieszy mnie też, że wreszcie widać sensowny ruch który stawia na przedsiębiorczość. Gdzie budowa silnej Polski odbywać się ma nie przez wymachiwanie szabelką i pokrzykiwanie o tradycjach, lecz przez pracę i wzrost gospodarczy. Równocześnie jednak boję się, że gdy tylko „stara gwardia” polityczna dostrzeże zagrożenie, zostaną przyklejone etykietki. Nowi staną się „liberałami”, będą „działać w interesach obcych mocarstw”, będą wyzyskiwaczami i panami. Zostaną też wciągnięci w debaty na tematy interesujące kościół katolicki i szybko sklasyfikowani jako wrogowie kościoła. Boję się też, że przedsiębiorcy, zamiast wreszcie pójść po rozum do głowy i się zorganizować, będą nadal narzekać po cichu, każdy z osobna, nie ufając nikomu. Imponujące jest, jak potrafią zorganizować się rolnicy, górnicy i inne grupy społeczne, a jak słabo reprezentowani są mali i średni przedsiębiorcy, wyrabiający tak naprawdę istotną część PKB. Będę z zainteresowaniem patrzył na rozwój wydarzeń. Pierwszy raz od kilkunastu lat słyszę wypowiedzi, które napawają mnie nadzieją. DOPISANE po kilku godzinach: no i proszę, nie musiało minąć dużo czasu i już dzieje się dokładnie to czego się obawiałem. Pierwsi pajace już przyklejają naklejki („nowa partia zagranicznych banków i korporacji”). Niesamowite, jak bardzo nikt nie chce konstruktywnie dyskutować o kraju. Wszyscy wolą przykleić sobie etykietki i wyśmiewać się nawzajem z daleka.KomentarzeProszę, rzeczowa dyskusja: Postępowe środowisko "przyjazne przedsiębiorcom" nigdy nie było u władzy, (w wyborach prezydenckich wybrano byłego członka Unii Wolności, a przegrał je inny były członek Unii Wolności). No dobrze, "naprawdę, naprawdę przyazne przedsiębiorcom" (no true scotsman, anyone?). Petru jest nowym niezależnym ekspertem, który nie był w polityce http://wikileaks.org/plusd/cables/09WARSAW288_a.html To czego trzeba w kraju najniższego CIT w UE i formalności tak prostych że oszuści zakładają kilometrami łańcuchy spółek wyłudzających VAT bez żadnej kontroli jak w Home Office to większa przyjazność przedsiębiorcom (tak tak, biurokracja polska jest największa w Unii jak potwierdzi kazdy kto probowal zalozyc konto w banku w UK, czy dostac zezwolenia w Niemczech), to rozwiąże również problem bezrobocia, bo każdy tak naprawdę jest przedsiębiorcą, trzeba tylko tę energię uwolnić (chyba z wyzionięciem ducha) http://www.krytykapolityczna.pl/artykuly/opinie/20150602/dymek-chcemy-etatow-nie-start-upow Ryszard Petru mówi z sensem. Na przykład zachwalał kredyty we frankach długo po tym jak sam swój przewalutował na złotówki. Systematycznie studzi emocje racjonalnym głosem, jak przed uwolnieniem kursu franka w 2014: "Prognozy, że frank będzie niedługo kosztował 4 zł, są oderwane od rzeczywistości." Oczywiście nikt nie może przewidzieć kursu walut, jak się tłumaczy Petru, na 40 lat do przodu (może mu się pomieszało, bo w tym przypadku nie minęło nawet 40 dni prawdziwości tej prognozy, nie musi się też tłumaczyć, bo nikt od niego nie wymagał, żeby się wypowiadał), ale systematycznie powielać ten sam błąd co roku przez kilka lat w każdym programie telewizyjnym... http://wyborcza.pl/duzyformat/1,145319,18037029,Kolysanka_Petru.htmlglitter2015-06-04Nie można przytomnie myśleć, że startupy, wymagające zarówno ponadprzecietnych kopmpetencji, jak i energii, czasu, beztroski i wychowania w domu, a i tak potem jak wiemy mająsuccess rate w pojedyńczych procentach, są odpowiedzią na potrzeby rynku pracy. Nick Hanauer (Amazon billionaire) chciał o tym wygłosić TED talk i spotkał się z rzeczową krytyką w tym pluralistycznym środowisku http://en.wikipedia.org/wiki/Nick_Hanauerglitter2015-06-04'
