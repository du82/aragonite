["http://jan.rychter.com/blog/2009/2/15/szyfrowanie-twardych-dyskow-znowu.html"]
title = "Szyfrowanie twardych dysków (znowu)"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = "Szyfrowanie twardych dysków (znowu)2009-02-15W grudniu pisałem krytycznie o “sprzętowym” szyfrowaniu dysków twardych, nie wierząc w zapewnienia producentów że dane faktycznie są dobrze zaszyfrowane. Nie mam zaufania do producentów sprzętu i wolę stosować takie rozwiązania, które mogę zaudytować: samemu sprawdzić czy faktycznie cokolwiek szyfrują.Obawy nie są bezpodstawne. Szyfrowanie stosowane przez chińskiego producenta obudów dyskowych USB okazało się właśnie być nic nie warte. Po bliższym przyjrzeniu się algorytm szyfrowania okazał się być zwykłym przekształceniem liniowym.Bruce Scheier również nie wierzy w zapewnienia producentów."
