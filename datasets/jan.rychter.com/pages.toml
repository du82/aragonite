["http://jan.rychter.com/blog/wybory-samorzdowe-11-2014"]
title = "Wybory samorządowe"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = 'Wybory samorządowe2014-11-27Kilka przemyśleń na temat ostatnich wyborów samorządowych: Media jak zwykle zamieniły wybory w sondaż. „Wygrał PiS”, „wygrało PO”, „wygrało PSL” — jakie to ma dla mnie znaczenie? Moi radni nie będą organizować się w większość parlamentarną i desygnować premiera. Będą zajmować się ścieżkami rowerowymi w okolicy, bardziej mnie więc interesuje czy dany radny jeździ na rowerze, niż do jakiej „partii” należy. Winię tu media, bo tam widać płytkość komentarza i obsesję (łatwymi w pozyskaniu i skomentowaniu) wynikami. Wrażenie sondażu pogłębione jest przez fakt, że większość ludzi nie ma pojęcia co robią sejmiki wojewódzkie (też nie wiedziałem, dopóki nie sprawdziłem w Wikipedii). Idiotyczny podział „PO przeciw PiS” jest sztucznie podsycany przez media. To, co wydarzyło się z wyborczym systemem informatycznym, jest niekompetencją. Zarówno firmy, która go dostarczyła, jak i Państwowej Komisji Wyborczej. Ponieważ jedynym zadaniem komisji jest przeprowadzanie wyborów, a jak widać nie potrafi tego zrobić, powinna zostać w całości natychmiast zwolniona. Nie ma już czasu na zamawianie nowych systemów informatycznych do kolejnych wyborów. Powinny zostać one więc przeprowadzone ręcznie. Nie wiem czemu wszyscy nagle zapomnieli, że kiedyś głosy liczyło się ręcznie i nie było to wielkim problemem. Będzie to tańsze i bardziej przewidywalne niż kupowanie kolejnych niedorobionych systemów. Pewien polityk znany już z tego, że używa insynuacji, niedomówień i teorii spiskowych do zdobywania władzy, trąbi na lewo i prawo o „sfałszowanych wyborach” i „zagrożonej demokracji” i organizuje afery w Parlamencie Europejskim. Jest to działanie destrukcyjne: swoimi wymysłami podważa zaufanie do Polski, pośrednio wpływając na gospodarkę, bo postrzeganie naszego kraju silnie wpływa na biznes. Ktoś powinien przypomnieć mu, że aby mógł wymachiwać swoją szabelką, ktoś musi najpierw na nią zarobić. Podejrzewam, że wszystkie wyborcze systemy informatyczne projektowane są kiepsko i nie tak jak powinno się dziś budować tego typu rozwiązania. Ale to już temat na osobny wpis. KomentarzeA ja się zastanawiam dlaczego do każdych kolejnych wyborów budowany jest kolejny całkowicie nowy system informatyczny? Czy nie można zwyczajnie zbudować jednego i poprawnie działającego, w tym odpowiednio wyskalowanego? Rozumiem że każde kolejne wybory są trochę inne od pozostałych, ale w mojej ocenie łatwiej (i zapewne taniej) jest dostosować istniejący system niż za każdym razem budować całość od nowa. Od pierwszych wyborów obsługiwanych przez system informatyczny w 2002 roku PKW miała bardzo dużo czasu na te prace.Radek2014-11-27Słuszne pytanie. Też się nad tym zastanawiałem — dlatego wkrótce zamierzam napisać na ten temat nieco więcej.Jan Rychter2014-11-27Czyżbyśmy mieli już pierwszą "oddolną" inicjatywę w tym kierunku? :)http://osworld.pl/openpkw-pierwszy-otwarty-spolecznosciowy-system-do-obslugiwania-glosowania-dla-pkw/Radek2014-11-27'
