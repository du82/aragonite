full_description = "Brak otwartości wynika z braku wartości2009-03-23Grzegorz Marczak (Antyweb) słusznie zauważa, że serwisy internetowe w Polsce budowane są jak wieże obronne: prawie nikt nie udostępnia interfejsów i platform aplikacyjnych. Otwarcie serwisu i udostępnienie interfejsów umożliwia innym dostęp do danych. Jeśli owe dane (faktycznie: zarejestrowani użytkownicy i ich preferencje) są jedyną wartością serwisu, to trudno się dziwić, że mało kto chce je udostępniać na zewnątrz. Wszak na plecach czuć oddech konkurencji. Większość serwisów internetowych w Polsce wprowadza za mało wartości dodanej by móc otworzyć się na zewnątrz. Gdy doczekamy się serwisów, które faktycznie coś robią poza rejestrowaniem użytkowników i umożliwianiem im komunikowania się, pojawią się też otwarte platformy. Brak otwartości wynika z braku wartości."
