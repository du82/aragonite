["https://jan.rychter.com/blog/2008/3/17/sztuka-prezentacji-pi-rad-dla-wystpujcych.html"]
title = "Sztuka prezentacji: pięć rad dla występujących"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = 'Sztuka prezentacji: pięć rad dla występujących2008-03-17Po ostatnich spotkaniach bootstrapowych i aulowych nasunęło mi się kilka spostrzeżeń na temat sposobu prezentowania, szczególnie gdy czas prezentacji jest bardzo krótki. Spisuję je w formie rad -- nie dlatego, żebym sam trudną sztukę wystąpień publicznych opanował w stopniu doskonałym, ale po to by pomogły tym, którzy dopiero zaczynają się tego uczyć. Oto kilka rad, których warto się trzymać:1. Przećwicz sam lub przed znajomymi swoją prezentację zanim powiesz ją publicznie. To jest niezmiernie ważne, szczególnie dla prezentacji krótkich (5 minut), gdzie każda sekunda ma znaczenie. W żaden inny sposób nie dowiesz się czy zmieścisz się w czasie, co jest naprawdę trudne do oszacowania nawet dla doświadczonych mówców. Jeśli ćwiczysz ze znajomymi, dodatkowo skrytykują oni Twoją prezentację, zwrócą uwagę na to, co jest niejasne i poradzą skrócić to, o czym mówisz za długo. Jeśli ćwiczysz sam, nie rób tego na skróty: wygłoś prezentację, a nie czytaj w myśli. To są zupełnie różne rzeczy.2. Miej sposób na skrócenie lub wydłużenie prezentacji, jeśli zajdzie taka potrzeba. Wydłużenie jest nietrudne: wystarczy mieć na końcu dodatkowy slajd lub dwa, a na nich rozwinięcie ciekawszych wątków. Skrócenie jest trudniejsze, ale niezmiernie cenne, bo znacznie lepiej jest zamknąć prezentację własną puentą niż mieć ją przerwaną brutalnie na 2-3 slajdy przed końcem. Sam staram się na końcowych slajdach mieć kilka punktów, których w razie potrzeby mogę nie omawiać.3. Nadaj swojej prezentacji strukturę. Niech będzie widoczne z jakich części się składa i na którym jej etapie jest słuchacz w każdej chwili. Struktura zaczyna się od dokładnego przemyślenia prezentacji, ale potem można ją też podkreślać formatowaniem slajdów, kolorem paska z boku lub na dole, "progress-barem", a nawet przejściami między slajdami. Warto też dodawać wskazówki słowne ("kolejne zagadnienie, o którym powiem", "drugi temat to", "ostatni temat dotyczy" itp.). Niedoścignionym mistrzem nadawania struktury był dla mnie Michael Dertouzos, szef MIT Laboratory for Computer Science, który potrafił wygłosić 45-minutowy wykład bez slajdów (!) tak, by w każdym momencie dowolny słuchacz wiedział dokładnie o czym jest mowa, gdzie obecny temat mieści się w ogólnej strukturze wykładu i co będzie dalej. Słuchając go na konferencji ACM1 zrozumiałem, jak bardzo wiele jeszcze muszę się nauczyć jeśli chodzi o publiczne wystąpienia.Dla dłuższych prezentacji warto wstawić blisko początku slajd opisujący strukturę, zaś potem trzymać się punktów z tego slajdu.4. Zadbaj o aspekty techniczne. Jeśli masz prezentację na urządzeniu USB, wgraj ją wcześniej na komputer organizatora. Jeśli masz własny laptop, sprawdź wcześniej, czy działa z rzutnikiem i czy masz poprawne ustawienia ekranu. Wyłącz Wi-Fi i Bluetooth, żeby nie dostać kompromitujących komunikatów od kogoś w czasie prezentacji.⁃ Jeśli używasz Windows: wyłącz screensaver, posprzątaj pulpit, by nie było tam poufnych bądź kompromitujących rzeczy (tak, tak).⁃ Jeśli używasz Mac OS: nie ustawiaj swojego maka w tryb "mirror", tylko w Keynote wybierz "present on secondary display", w ten sposób Twój pulpit nigdy nie pojawi się na ekranie rzutnika. Ważne: zawsze podłączaj rzutnik do komputera, nigdy rzutnik do przelotki wetkniętej do komputera (wiele osób robi to drugie, przez co komputer ma kłopoty z wykryciem rzutnika).Mnóstwo osób nie zwraca uwagi na takie rzeczy, a mają one duże znaczenie dla odbioru mówcy i jakości prezentacji. Jeśli ktoś zaczyna spóźniony pięć minut po wielkiej walce z laptopami, kablami, ekranami, desktopami i ustawieniami, to ma znacznie gorszą pozycję wyjściową niż inny mówca, startujący na luzie i bez problemów. Mówca jest zestresowany, publiczność znudzona lub (gorzej) rozbawiona. Naprawdę lepiej to dobrze przygotować.5. Gdy przedstawiasz "elevator pitch", czyli radykalnie nowy pomysł na biznes w wielkim skrócie, koniecznie na początku powiedz na czym polega pomysł. Oczywiste? A jednak. Widziałem już sporo prezentacji w których po kilku minutach nadal nie było wiadomo o co chodzi, za to dowiedziałem się dużo o konkurencji, rynkach, trendach i innych mało istotnych rzeczach. Jeśli nie umiesz opisać czym jest Twój pomysł w jednym zdaniu na jednym slajdzie, to nie powinieneś go prezentować.'
