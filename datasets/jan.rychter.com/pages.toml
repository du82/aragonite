full_description = "Bus Pirate Reference Card2013-11-14The Bus Pirate from Dangerous Prototypes is a really useful tool. I use it regularly to bring up and test new I2C devices, or as a cheap protocol analyzer for I2C and SPI. Unfortunately, the supplied cables aren't clearly labeled (only color-coded), and I found the reference cards available on the net lacking: they were usually not clearly readable and didn't help much. So I created my own. You can print it on A4 paper and laminate it (which is what I did), or cut away just the upper color-coding portion and make a smaller laminated card. Enjoy — Bus Pirate Reference Card (PDF) CommentsThis is going on my wall. Thanks!!Hemal2013-11-16"
