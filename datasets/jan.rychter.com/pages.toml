title = "Mobile World Congress 2009"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = "Mobile World Congress 20092009-02-27Tydzień temu zakończył się Mobile World Congress w Barcelonie. Wielcy świata telekomunikacyjnego zjechali się, by rozmawiać o innowacji, aplikacjach, przyszłości, nowych strategiach i wielkich zyskach.W każdym wystąpieniu padało słowo “iPhone”.Mówiono o “iPhone killer”, o nowych sklepach z aplikacjami na telefony, o multimedialnych urządzeniach, ekranach dotykowych, GPSach i mapach, audio i wideo. Wszystko lepsze niż na iPhone. Każdy obiecywał, że dni iPhone są policzone. iPhone to przecież chwilowe zjawisko, błąd pomiaru, wyskok statystyczny.Obserwuję to z rozbawieniem. Oto przemysł, który przez dziesięć lat nie był w stanie wyprodukować telefonu, który by po prostu działał, z ekosystemem oprogramowania, które można po prostu kupić, nagle z przerażeniem zrozumiał prawdę. Przyszła firma, która zrobiła telefon dobrze: przemyślano od podstaw jak powinien działać, zidentyfikowano co jest istotne, zaprojektowano urządzenie, które da się lubić. A potem dodano do tego możliwość łatwego kupowania oprogramowania i mediów. Apple wywróciło do góry nogami przemysł telekomunikacyjny.Mobile World Congress jest potwierdzeniem tego jak wiele się zmieniło. Nie wszyscy to jeszcze zrozumieli. Oto największa na świecie impreza telekomunikacyjna, na którą producent najlepiej sprzedającego się “smartphone” nawet nie raczy przyjechać! Więcej, nie dość że Apple z rozbawieniem obserwuje zdenerwowanych szefów firm dyskutujących między sobą, to o ataki śmiechu musi przyprawiać ich, że i tak wszyscy mówią o iPhone!"
year_published = 2009
