full_description = "kupujemy.to: o to chodziło2009-11-08kupujemy.to: świetny pomysł. Jest mnóstwo ludzi, którzy nie mają czasu na porównywanie produktów, czytanie forów, przeszukiwanie recenzji, odfiltrowywanie pseudorecenzji. Do tego wiele sklepów internetowych ma idiotyczne sposoby kategoryzowania produktów (np. według producentów), co utrudnia znalezienie poszukiwanego urządzenia. W kupujemy.to są tylko trzy urządzenia w każdej kategorii. Przejrzałem dotychczasowe wybory i są bardzo sensowne. Jeśli tylko serwisowi uda się zachować obiektywność i rozszerzyć nieco liczbę kategorii, będę z pewnością z niego korzystał (i odsyłał tam innych).Komentarzei to Nie jest Twoje 8.1, prawda?x2009-11-08x: nie, przecież nie recenzowałbym własnego projektu w trzeciej osobie, udając że nie jest mój?Jan Rychter2009-11-08jwr: niezbadane są ścieżki współczesnego marketingu.A serwis faktycznie fajny. Może ciekawie zmienić rynek jeśli się przyjmie. Może producenci zrezygnują z tłuczenia 1000modeli telefonów skoro większości wystarczą 3...jx2009-11-09A co Wam przeszkadza duża ilość do porównania. Ja i tak sprawdzam tylko trzy pierwsze ;-)Implant2009-12-30"
