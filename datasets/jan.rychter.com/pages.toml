["https://jan.rychter.com/blog/lekarze-i-homeopatia-5-2014"]
title = "Lekarze i homeopatia"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = 'Lekarze i homeopatia2014-05-10Kolejny lekarz zaproponował mi „lek” homeopatyczny. Odmówiłem uprzejmie, wyjaśniając, że nie wierzę w homeopatię. Przez chwilę jeszcze próbował mnie przekonać („to jest fizyka, proszę pana”), ale na szczęście zrezygnował, a ja wykazałem daleko idącą powściągliwość i nie dałem się sprowokować „fizyką”. Po wyjściu jednak uświadomiłem sobie, że coś tu jest bardzo nie w porządku. Oto byłem u Lekarza Medycyny: człowieka wykonującego zawód regulowany przez państwo. Moja wizyta była opłacona przez NFZ, a więc z państwowego ubezpieczenia społecznego. Powinienem więc się spodziewać, że lekarz będzie stosował metody zweryfikowane naukowo. Intuicja podpowiada mi, że lekarz nie może doradzać mi terapii, których skuteczność nie została potwierdzona. Oczywiście szanuję prawo do wolności wyznania: każdy może wierzyć w to, co chce. Są więc ludzie, którzy wierzą w Latającego Potwora Spaghetti i dla nich być może idealna kuracja to chodzenie przez tydzień z durszlakiem na głowie. Dopóki jednak w kontrolowanym eksperymencie nie zostanie udowodnione, że taka kuracja faktycznie jest skuteczna — lekarzom nie wolno jej sugerować. Podobnie jak nie wolno sugerować odmawiania modlitw, składania ofiar Swarogowi, czy odprawiania obrzędów voodoo. Nawet jeśli to nie może zaszkodzić. Wyjaśnię od razu: uważam, że „efekt placebo”, to worek, do którego wrzucamy obecnie mnóstwo niezrozumiałych mechanizmów. Wiem, że organizm potrafi dokonać imponujących rzeczy, które często potem określane są jako „efekt placebo”. Nie twierdzę więc, że specyfiki homeopatyczne nie mogą działać. Lekarz jednak nie jest od leczenia efektem placebo, ani żadnymi innymi metodami, które nie są sprawdzalne naukowo. Nie widzę rzecz jasna problemu w tym, żeby istnieli „doradcy homeopatyczni”, czy „kliniki homeopatyczne”. Chciałbym jedynie, żeby było wyraźne rozgraniczenie: muszę wiedzieć, czy idę do Lekarza, czy do Doradcy/Znachora. Podobnie jak jest rozgraniczenie pomiędzy „lekiem” a „suplementem diety”. Jak się okazało, intucja mnie nie myli i w Kodeksie Etyki Lekarskiej czytamy między innymi: „Lekarzowi nie wolno posługiwać się metodami uznanymi przez naukę za szkodliwe, bezwartościowe lub nie zweryfikowanymi naukowo”. Ponieważ homeopatia jest jednogłośnie przez naukę uznana za bezwartościową, a jej skuteczność nigdy nie została zweryfikowana, sugerowanie specyfików homeopatycznych jest naruszeniem Kodeksu Etyki Lekarskiej. Podobnie jak leczenie przez chodzenie z durszlakiem na głowie albo leczenie przez składanie ofiar Swarogowi. Każde może być skuteczne, a jednak nie jest rolą lekarza sugerowanie takich kuracji. Ktoś może zapytać, dlaczego mnie to tak zdenerwowało? W końcu to nieszkodliwe. Picie wody destylowanej nie może zaszkodzić. Spójrzmy jednak na to inaczej: czy ów lekarz polecający magiczne metody związane z „pamięcią wody” chciałby potem jechać mostem zbudowanym przez inżyniera, wierzącego głęboko w skuteczność wzmacniania przęseł mostu poprzez wachlowanie piórami strusiów szaroskórych (koniecznie po 10 razy w każdą stronę, najlepiej przy świetle księżyca w nowiu)? Tymczasem homeopatia wkrada się wszędzie i skutecznie udaje medycynę. Mówimy o „lekach” homeopatycznych, chociaż to wcale nie są leki. Nawet nie trzeba ich nazywać „suplementami diety”. W aptece pudełka z owymi „lekami” leżą przemieszane z faktycznymi lekami. Na pudełkach z papierosami państwo każe drukować ostrzeżenia o ich szkodliwości, ale już na „lekach” homeopatycznych nie ma ani słowa o tym, że ich skuteczność nie została w żaden sposób wykazana. I co najgorsze, zadziwiająco często lekarze takie „leki” polecają.KomentarzeLike it.Jedna uwaga - suplementy diety powinny/muszą (nie znam stanu prawnego) mieć badania (te, które przyjmuję ja/moja rodzina mają - np. witamina D i K dla kobiet w ciąży), więc porównanie niespecjalnie trafne. Ale cały wpis nt. przerażających medycznych guseł jak najbardziej słuszny.A "lekarz" za "to jest fizyka" powinien stracić licencję...shagrat2014-05-10Taka uwaga do picia wody destylowanej/z filtra odwróconej osmozy - w większej ilości grozi nawet śmiercią, więc nie polecam :P Woda taka nie zawiera minerałów i tak jak wszystko w naturze dąży do równowagi - wypłukuje z organizmu.Adam2014-05-12Mnie lekarka raz przepisała lek homeopatyczny - uczciwie o tym informując - z dość oryginalnego powodu: zastosowany w nim konserwant (!) łagodził działania uboczne właściwego leku.Antey2014-06-08'
year_published = 2014
