["http://jan.rychter.com/blog/fablitics-11-2014"]
title = "Fablitics"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = "Fablitics2014-11-05 Uruchomiliśmy Fablitics — przyjazne rozwiązanie „business intelligence” dla sklepów internetowych (E-commerce). Pracując z firmami sprzedającymi w Internecie zauważyliśmy, że nie ma dobrego narzędzia analitycznego, które pozwalałoby szybko i łatwo ocenić stan biznesu i pomagałoby w podejmowaniu decyzji. Owszem, wszyscy używają Google Analytics — ale jest to niewygodne i skomplikowane narzędzie, które teoretycznie potrafi wiele, a w praktyce pokazuje mało. Projektując Fablitics staraliśmy się pokazywać tylko liczby, które mają znaczenie dla biznesu. Sklep internetowy to przede wszystkim marketing (pozyskiwanie klientów), klienci i sprzedaż. Od tego należy więc zacząć. Dlatego tam gdzie tylko można liczymy pieniądze albo klientów, a w ogóle nie interesujemy się np. odsłonami stron. Odkryliśmy też, że w wielu przypadkach trudno jest ocenić efektywność wydawania pieniędzy na marketing. Czy na jednym kliknięciu w moją reklamę w serwisie X tracę, czy zyskuję? Ile wart jest klient przychodzący z serwisu X, a ile taki z serwisu Y? Z jakiej reklamy mogę zrezygnować? Stworzyliśmy więc własny system: po dodaniu kodu śledzącego od razu zaczynamy pokazywać wyniki. Wszystko dzieje się na bieżąco. Pokazujemy tylko liczby, które uważamy za sensowne i cały czas pracujemy nad coraz lepszymi metrykami. Wkrótce pojawi się na przykład LTV (Customer Lifetime Value), czyli prognozowane przychody od klienta w perspektywie roku. Chętnych zapraszamy — rejestracja jest darmowa."
