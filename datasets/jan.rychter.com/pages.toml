["https://jan.rychter.com/enblog/i2c-driver-for-freescale-kinetis-microcontrollers-12-2014"]
title = "I2C driver for Freescale Kinetis microcontrollers"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = "I2C driver for Freescale Kinetis microcontrollers2014-12-17I wrote a tiny driver that allows you to access I2C (IIC, I²C, or I squared C) on Freescale Kinetis microcontrollers. It works asynchronously (interrupt-driven), supports repeated start (restart) and does not depend on any large software framework. The code is on Github and the driver has its own page, too, with a README. Even though it isn't fully-featured or well tested, I have a good reason for publishing the code. I wrote this and then had to put my Kinetis-related projects on hold. After several months I forgot having written this driver and started searching online for one… only to finally find it using Spotlight, on my hard drive. This is what happens if you work on too many projects. To avoid this happening in the future, I now intend to publish most things I write as soon as they are reasonably complete, so that I can find them online when I need them."
