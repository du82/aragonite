["http://jan.rychter.com/blog/2009/2/24/schyek-gazet-w-internecie.html"]
title = "Schyłek gazet w internecie"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = "Schyłek gazet w internecie2009-02-24Dziś rano jak zwykle przy śniadaniu sięgnąłem po gazetę. Oczywiście nie po prawdziwą gazetę, tylko po wydanie elektroniczne w sieci. I nie po jedną, tylko po kilka. Jak zwykle byłem rozczarowany tym, co znalazłem. Zrzut przemielonych nieco informacji z agencji prasowych, podanych jako jedna wielka papka na stronie WWW.W portalu gazeta.pl dominują wiadomości sensacyjne i katastroficzne, obficie okraszone sensacjami z życia gwiazdeczek. Czytając wiadomości gospodarcze trudno nie oprzeć się wrażeniu, że koniec świata jest blisko — oto przykład sprzed kilku dni:“Śmierć, załamuje, dramatyczne, nie ustępują, błąd, bunt, nadciąga przecena, branża na krawędzi, stracić, toksyczne opcje...” — zaiste, Koniec jest blisko!W innych gazetach (np. w Rzeczpospolitej) jest nieco lepiej, wszystkie jednak popełniają podstawowy błąd. Kopiując się nawzajem wyraźnie doszły do wniosku, że Internet polega na podawaniu jak największej ilości wiadomości, jak najszybciej. W wyniku tego gazety online szybko zmierzają w kierunku upiększonych agregatorów feedów RSS z agencji prasowych. Wiadomości pojawia się coraz więcej, wszystkie wyglądają identycznie, a czytelnik musi filtrować i zastanawiać się co jest istotne. Wszędzie panuje model: jedna duża wiadomość ze zdjęciem i rządek małych tytułów pod spodem. Zdjęcie najlepiej gdy przedstawia piękną kobietę, lub coś szokującego, by jak najwięcej osób kliknęło.Panowie dziennikarze — to nie o to chodzi! To jest dobra droga do maksymalizacji CPM i czerpania zysków z reklam bannerowych, ale ten trend prędzej czy później się skończy.Gdy nie było internetu, wartość gazety polegała głównie na dostarczaniu wiadomości. Nie było wielu innych źródeł, więc samo podanie informacji wystarczało. Dziś jest inaczej: mamy do czynienia z nadmiarem informacji. Problemem jest odpowiednie ich przefiltrowanie, a nie dostarczenie jak największej ilości.Dlaczego więc gazety na całym świecie idą w przeciwnym kierunku, redukując swoją wartość w internecie, a równocześnie narzekając, że rynek im zanika i coraz mniej ludzi kupuje gazety na papierze?Jestem skłonny płacić za gazetę w internecie. Płaciłbym jednak nie za informacje, ale za wartość redakcyjną. Za czas ludzi, którzy wyselekcjonują informacje, zredagują je, skomentują i zaprezentują w odpowiedniej formie, tak bym łatwo mógł stwierdzić co jest istotne a co nie.Drodzy redaktorzy, pobudka!"
