full_description = "Pieniądze dla firm z POIG 8.1: gdzie są?2009-11-17„Rzeczpospolita” pyta resortu finansów czy prawdą jest, że to działania rządu (łatanie dziury budżetowej pieniędzmi z UE) powodują, że PARP ma coraz większe opóźnienia w wypłacaniu zaliczek i refundacji przedsiębiorcom. Rzeczniczka resortu Magdalena Kobos tłumaczy na łamach “Rzeczpospolitej”, że opóźnienia w przekazywaniu środków do dysponentów nie występują, a długotrwałe procedury wynikają z konieczności weryfikacji wniosków przez wiele instytucji. Ściema. Patrz też Wygrali konkursy na dotacje, pieniędzy nie zobaczyliKomentarzeZ tego co sie orientuje to PARP wznowił wypłacanie zaliczek i refundacji...jakos tak w ciagu ostatnich 7 dni..Łukasz Plutecki2009-11-18Ciekawe czy teraz już będzie płynnie. Obserwuję z zainteresowaniem (i lekkim przerażeniem) ten blog.Jan Rychter2009-11-18A ja sie nie zgodze...johny-max2009-11-25"
