["https://jan.rychter.com/blog/2009/12/20/aula-44-relacja-i-zdjcia.html"]
title = "Aula 44: relacja i zdjęcia"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = "Aula 44: relacja i zdjęcia2009-12-20Panel dyskusyjnyŚwietna, ostatnia w 2009 Aula postawiła wysoko poprzeczkę na następny rok. Sądząc po reakcjach publiczności, nie wszyscy docenili wystąpienie Adama Badowskiego, który powiedział o błędach popełnionych przy tworzeniu gry „Wiedźmin”. Było to swego rodzaju post-mortem projektu, wiedza na wagę złota dla każdego, kto zamierza brać udział w większych projektach informatycznych. Byłem pod wrażeniem szczerości i otwartości Adama. Wśród publiczności Aulowej nadal mało jest ludzi prowadzących firmy i projekty kilkudziesięcioosobowe, ale część przedsiębiorców wkrótce się tam znajdzie, warto więc słuchać o doświadczeniach innych. Piotr „Vagla” Waglowski mówił o „przejmowaniu państwa”, czyli dostępie do informacji opracowanych za pieniądze podatników. Cieszy mnie, że ktoś się interesuje tym tematem i mam nadzieję, że zostanie skutecznie przewalczony. Front rozszerzyłbym o publikacje naukowe i wyniki badań naukowych — przykładem niech będzie Korpus IPI PAN, opracowany za pieniądze podatników, a dostępny na bardzo restrykcyjnych zasadach (do praktycznych komercyjnych zastosowań: niedostępny). Wszyscy powinni być świadomi, że jak się coś robi za pieniądze podatników, to wynik prac jest własnością podatników. Jeśli ktoś zaś chce prowadzić działalność gospodarczą, to nie ma przeszkód — ale niech opracuje informacje za własne pieniądze. O komercyjnym wykorzystywaniu treści dostępnych w Internecie mówił Przemysław Walasek. To ważny temat, ciągle lekceważony w Polsce. Nie szukając daleko, moje zdjęcia są regularnie wykorzystywane bez zezwolenia i z naruszeniem osobistych praw autorskich, chociażby przez Akademickie Inkubatory Przedsiębiorczości (przykład). Wstyd? Oczywiście, ale AIP pomimo poinformowania zupełnie się nie przejmuje. Wojtek Kuśmierek ciekawie mówił o problemach z polskimi sklepami internetowymi. Często próbując coś kupić mam wrażenie, że sprzedawca stara mi się to maksymalnie utrudnić, nie szanując zupełnie mojego czasu. Wojtek pokazywał konkretne przykłady złych rozwiązań. Panel dyskusyjny prowadzony przez Marcina Grodzickiego był znacznie ciekawszy, niż się spodziewałem. Sporo osób było niezadowolonych, bo mało było „ducha venture”: Michał Olszewski z Agory i Michał Brański z o2.pl nie wykazywali dużego entuzjazmu do ryzykownych inwestycji. Dlaczego jednak mieliby wykazywać?! Przecież nie każdy musi inwestować w młode, ryzykowne przedsięwzięcia! Agora nie jest inwestorem venture, tylko korporacją prasowo-medialną, a Michał Brański prezentował zdrowe podejście inwestora, który oparzył się kilka razy i teraz ogranicza ryzyko. Bardzo cenne informacje. Jak zwykle z przyjemnością słuchałem Rafała Agnieszczaka. Ma zdolność do mówienia rzeczy wprost i sprowadzania dyskusji na ziemię, co jest bardzo potrzebne. Panele dyskusyjne zbyt często nadymają się jak balony i odlatują do stratosfery. Rafał potrafi przypomnieć wszystkim, że tak naprawdę chodzi o pieniądze („innowacja, która nie zarabia, jest sztuką a nie innowacją”) i wprost powiedzieć, że nie ma co mówić o inwestycjach, bo nie ma w co inwestować — za mało ludzi zakłada obiecujące firmy. Wiarygodność Rafała podnosi fakt, że coś robi, w dodatku za własne pieniądze. Dostępny jest (jak zwykle) fotoreportaż Przy okazji: szukam sponsora fotoreportaży Aulowych — a konkretniej sponsora Canona 7D. W zamian wszystkie zdjęcia będą miały adnotację o sponsorze."
year_published = 2009
