["http://jan.rychter.com/blog/2009/3/19/mini-seedcamp-podsumowanie-i-rady.html"]
title = "Mini Seedcamp — podsumowanie i rady"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = "Mini Seedcamp — podsumowanie i rady2009-03-19Nieco przemyśleń już na spokojnie, następnego dnia po warszawskim Seedcampie. Podobało mi się, że pojawiły się firmy nie tylko z Polski. Bardzo dobre były projekty litewskie i estońskie, rewelacyjne było węgierskie Joobili, ciekawi ludzie przyjechali też z Ukrainy. Zdziwiło mnie, że niemal wszyscy występujący mówili, że liczą na zwiększenie widoczności swojego serwisu/inicjatywy poprzez zaprezentowanie się na Mini-Seedcamp. Moim zdaniem jest to pomyłka: Seedcamp może zapewnić konsultacje z dużą liczbą krytyków (mentorów), kontakt z partnerami oraz ewentualne dofinansowanie. Nie jest to jednak sposób na zdobycie klientów! Tyle ogólników, a ponieważ te, jak pochwały, są nieciekawe, dalej będzie nieco krytyki. Co mnie zawiodło? Treść prezentacji. Z wystąpień trudno było zrozumieć co właściwie jest budowane. Czasem dopiero po kilku minutach publiczność dowiadywała się o co chodzi. Krótki opis powinien pojawić się na jednym z pierwszych trzech slajdów! Jeszcze raz polecam ćwiczenia ze znajomymi, szczególnie z takimi, którzy jeszcze nie wiedzą co budujemy. Niech powiedzą, czy w pierwszych dwóch minutach wystąpienia zrozumieli o co chodzi. Słabe przygotowanie wystąpień. Nie ma na to wytłumaczenia: jeśli ktoś zgłasza się do konkursu Seedcamp, powinien znaleźć czas by się porządnie przygotować. Wystąpienia powinny być kilkakrotnie przećwiczone przed znajomymi. Nie ma prawa być w nich literówek (przy okazji, błędne napisanie słowa “analyze” przez “i” zamiast “y” rozbawi anglojęzyczną publiczność). Muszą mieścić się dokładnie w wyznaczonym czasie. Mało liczb. Zarówno w prezentacjach jak i w rozmowach z mentorami przewijało się niepokojąco mało liczb. Wszyscy mieli pomysł, mało kto jednak dobrze przemyślał ów pomysł pod względem biznesowym. Brak przygotowanych pytań do mentorów i panelistów. Wśród mentorów było wiele osób ze znacznie większym od mojego doświadczeniem. Dawało to niepowtarzalną szansę zadania im konkretnych pytań. W większości spotkań jednak firmy były pasywne. Mała aktywność. Największą wartością tego typu spotkania jest szansa na nawiązanie nowych znajomości biznesowych. Pasywne podejście i rozmawianie wyłącznie z dawnymi znajomymi niewiele daje. Nakładając kapelusz “mentora” (skoro już nim chwilowo zostałem) radziłbym na przyszłość startupom: Starannie przemyśleć treść prezentacji: na pierwszych 2-3 slajdach powinien pojawić się krótki opis problemu i rozwiązania, jakie jest budowane. Polecam przejrzeć slajdy z mojej prezentacji “Sztuka prezentacji przedsięwzięć e-biznesowych” — nie jestem wyrocznią, ale warto przemyśleć te rady. Przećwiczyć wystąpienie kilka razy przed znajomymi. Wysłuchać krytyki, uwzględnić ją. Przemyśleć model biznesowy. Jakie będą przychody, kiedy, z czego? Tabela w arkuszu kalkulacyjnym pomoże — warto ją zrobić na dwa lata naprzód. Jako minimum powinny pojawić się kosztorys i prognoza przychodów. Owszem, będzie to trudne, nie będzie wiadomo co założyć. Tym niemniej, warto to zrobić i pomanipulować nieco liczbami. Szybko może okazać się, że jeśli po dwóch latach zakładamy 1900 płacących po $8 miesięcznie użytkowników, to przychody na poziomie 45 tysięcy złotych miesięcznie nie pozwolą nawet na utrzymanie firmy z kilkoma programistami, nie mówiąc już o zarabianiu i wzroście. Żaden inwestor też nie zainteresuje się takimi liczbami. Owszem, na tym etapie nikt nie wymaga od założycieli by byli ekspertami finansowymi. Przyłożenie się do prognoz daje jednak znacznie lepsze spojrzenie na biznes. I tak będzie trzeba je mieć w przyszłości. Przygotować się do spotkań z mentorami i panelistami. Gdybym startował w SeedCampie, sprawdziłbym wcześniej doświadczenie zawodowe wszystkich mentorów, z jakimi dane mi się będzie spotkać i przygotował listę konkretnych pytań. Potem wymagałbym odpowiedzi na te pytania. Nie codziennie ma się szansę uzyskania porad od ludzi z doświadczeniem: szkoda ją tracić siedząc pasywnie i czekając co sami powiedzą! W kuluarach aktywnie szukać interesujących nas osób i nawiązywać kontakty. Nie widziałem wianuszków osób wokół Mariusza Gralewskiego (GoldenLine), Tomasza Berezowskiego (TVN) albo Łukasza Wejcherta (Onet.pl) — dlaczego? Dla wielu startupów byli to potencjalni partnerzy, z którymi można uruchomić wspólne inicjatywy. Podobnie z przedstawicielami funduszy inwestycyjnych: spodziewałbym się znacznie większej aktywności. Tyle podsumowań i rad, zdejmuję teraz kapelusz “mentora” i obiecuję, że mądrzyć się będę nieco mniej. Zapraszam też przedsiębiorców na spotkania Aula Polska — jak się okazało, nie wszyscy o nich wiedzieli, a są bardzo wartościowe dla warszawskiej społeczności startupowej."
