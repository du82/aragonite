full_description = 'Wywiad z Leszkiem Balcerowiczem2014-09-23Leszek Balcerowicz w [wywiadzie] doskonale podsumowuje rządy PO. Już dawno mi się nie zdarzyło tak całkowicie zgadzać z czyjąś opinią — prof. Balcerowicz wyraża doskonale to, co sam czuję. Głównie rozczarowanie. Dwa kolejne ataki na oszczędności emerytalne w OFE, najpierw w 2011 roku, a potem w 2013. Byłem zaskoczony, nie spodziewałem się, że Tusk, Rostowski, Bielecki, Boni, Sikorski mogą się tak daleko posunąć. Po pierwsze, że mogą robić tak szkodliwą rzecz dla gospodarki. Po drugie, że będą uprawiać tak nieuczciwą propagandę, z taką pogardą dla opinii publicznej. "Ciemna masa to kupi" - cytując klasyka. Po trzecie, z takim lekceważeniem konstytucji. Warto przeczytać.'
