full_description = "TUBA032008-10-29Robiąc fotoreportaż z TUBY03 w Multikinie przysłuchiwałem się prezentacjom i dyskusji. Czegoś mi brakowało, ale nie bardzo potrafiłem sprecyzować czego -- prezentacje brzmiały pusto, brakowało konkretów i treści. Dopiero podczas panelu dyskusyjnego padło świetne pytanie, które mnie obudziło. Ktoś z publiczności zapytał “Co nowego widzą państwo w blogach? Jak dotąd wszystko, co usłyszeliśmy, można było odnieść do dowolnych witryn WWW!”Trudno się nie zgodzić. Mowa była o CPM, UU, niszach tematycznych, sile nabywczej użytkowników, etyce i sponsoringu, “monetyzacji” (co za bezsensowne słowo). Nic z tego nie jest związane wyłącznie z blogowaniem. Brakowało innowacji, świeżego pomysłu.Patrząc nieco szerzej, martwi mnie ogólna stagnacja. Zapatrzeni w Stany Zjednoczone wszyscy powielają tamtejsze pomysły. Idziemy równo 2-3 lata za USA, udając że tworzymy nową jakość. Blogi, blogerzy, “rewolucja blogowania” -- dlaczego zamiast tego nie porozmawiać o niezależnym dziennikarstwie, niezależnych twórcach medialnych, zaufaniu do tego typu nowych źródeł medialnych, dalszych losach gazet drukowanych, radia i telewizji? Czemu ciągle tak mało jest w polskiej sieci miejsc naprawdę opiniotwórczych, a czemu tak dużo jest “przedruków” z wiadomości zagranicznych?W całej tej formie brakuje mi treści."
