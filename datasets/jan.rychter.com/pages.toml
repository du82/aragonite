description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = "Follow Me (konferencja mediafunLAB) + fotoreportaż2009-10-17W piątek byłem na konferencji o mikroblogach “Follow Me” organizowanej przez Maćka “mediafun” Budzicha. Było ciekawie, choć brakowało mi nieco dwóch rzeczy. Po pierwsze, na dotychczasowych konferencjach Mediafun była zawsze myśl przewodnia, którą Maciek zgrabnie przeplatał w komentarzach pomiędzy wystąpieniami i w dyskusji. W tej konferencji wyraźnie tego zabrakło — może dlatego, że temat młody? Po drugie, nietypowo dla Mediafun konferencja była wyjątkowo statyczna. Mało dyskusji, niemal żadnych pytań od publiczności. Szkoda, bo szczególnie przy tak młodej tematyce publiczność często ma najwięcej ciekawego do powiedzenia! Jest też do obejrzenia fotoreportaż."
