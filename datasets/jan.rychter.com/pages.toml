full_description = "Grand Prix Polski Pojazdów Zabytkowych im. Witolda Rychtera2015-09-15Plakat rajdu Już za kilka dni startuje z Warszawy Pierwsze Grand Prix Polski Pojazdów Zabytkowych im. Witolda Rychtera. Miejsce startu znajduje się w Ursusie przy ul. Posagu 7 Panien 6 na terenie dawnej fabryki Ursus, a pierwsza załoga wyrusza na trasę o 10:00. Więcej o samym rajdzie można dowiedzieć się z oficjalnej strony. Witold Rychter to mój Dziadek, można przeczytać o nim trochę w wikipedii. Gwiazdą rajdu ma być zmontowany przed wojną w Warszawie Chevrolet Master Sedan. Będzie to premiera pojazdu po kilkuletnim remoncie. Podobnym wozem startował w rajdach Witold Rychter, można go też zobaczyć w naszych archiwach w albumie ze zdjęciami z podróży po Europie z 1938r."
