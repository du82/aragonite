["http://jan.rychter.com/blog/2009/10/13/seedcamp-nie-wszystko-zoto-co-si-wieci.html"]
title = "Seedcamp: nie wszystko złoto co się świeci"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = 'Seedcamp: nie wszystko złoto co się świeci2009-10-13Uczestnicy ostatniej Auli mogli odnieść wrażenie, że startowanie w konkursach Seedcamp jest jedyną drogą rozwinięcia firmy. Dla niektórych firm może i tak jest, popatrzmy jednak na sprawę z drugiej strony. Jakie są minusy startu w konkursie Seedcamp? Przede wszystkim, udział oznacza upublicznienie swojego pomysłu i swojej firmy. Dla firm na wczesnym etapie rozwoju może to nie być pożądane. Pamiętajmy, że mentorzy biorą udział w Seedcampie za darmo i większość z nich ma w tym swoje cele — spora część to konsultanci, którzy żyją z doradzania młodym firmom. Dla nich informacje o potencjalnej konkurencji są ważne i z pewnością je wykorzystają. Dla firm, które mają gotowy produkt i szukają rozgłosu upublicznienie nie jest problemem. Jeśli jednak mają produkt, który może być sprzedawany, to dlaczego szukają finansowania przez Seedcamp? Idąc dalej — dlaczego w ogóle szukają finansowania? Tyle się słyszy o funduszach VC, funduszach private equity, inwestycjach i wycenach, że łatwo zapomnieć, że często nic takiego nie jest firmie potrzebne. Jest mnóstwo firm, które znakomicie radzą sobie wzrastając naturalnie, zarabiając na sprzedaży. Co więcej, takie firmy potrafią być stabilniejsze niż te finansowane przez inwestorów. Wokół pieniędzy inwestora z reguły kręcą się „konsultanci”, prawnicy, bankowcy, są do zapłacenia „finder’s fee”, do wynegocjowania i skonsultowania umowy. To wszystko pożera czas i pieniądze, hamując rozwój. Gdy zaś pieniądze się pozyska, w firmie pojawiają się grupy interesów, naciski, decyzje płynące z góry, presja na błyskawiczny rozwój, koncentracja tylko na szybkim wzroście wartości. Aulowa dyskusja na temat SeedCampuCzęsto słyszę powtarzany frazes: „tylko z pieniędzmi VC można osiągnąć szybki rozwój na dużą skalę”. Czasem dla wzmocnienia dorzuca się frazę „na światowym poziomie” (cokolwiek by to znaczyło). Niech szukający pieniędzy jednak zadadzą sobie pytanie, czy potrafią dobrze wykorzystać takie pieniądze, o jakie się starają? Czy na pewno są one niezbędne? Czy gdyby mieli te same pieniądze wyłożyć z własnej kieszeni, to też by to zrobili? Warto też pamiętać, że Seedcamp ma świetnie prowadzone public relations, co mocno wykrzywia obraz tej instytucji. Seedcamp nie jest organizacją non-profit, wręcz przeciwnie. Konkurs nie jest też konkursem — nie ma punktów, rankingu, są subiektywne decyzje. Jest też warunek: „wygranie” jest możliwe pod warunkiem zaakceptowania przedstawionych przez Seedcamp warunków inwestycji i zgodzenia się na tę inwestycję. Jeśli ktoś wątpi w jakość marketingu Seedcamp, niech zada sobie pytanie: jakim cudem w komercyjnym przedsięwzięciu udaje się regularnie ściągnąć setki „mentorów” by wykonywali ciężką pracę, wykorzystując swoje doświadczenie i umiejętności — całkowicie za darmo? Piszę te słowa nie po to, żeby deprecjonować Seedcamp, ale po to, żeby przypomnieć wszystkim, że nie jest to jedyna opcja (co najwyżej w tej chwili najgłośniejsza) i zachęcić do samodzielnego i niezależnego myślenia.KomentarzeJak ze wszystkim - wszystko zależy od sytuacji konkretnej firmy. Tegoroczni finaliści byli już dojrzałymi - mieli co najmniej prototypy i pierwszych klientów. W większości szukali rozgłosu - jasno o tym mówili na miejscu. I nikt nie miał Twoich obaw ;). Ale pełna zgoda - nie jest to jedyna opcja. Jest ich na świecie bardzo wiele :).Krzysiek Kowalczyk2009-10-14Oczywiście! Nie każdy musi szybko rosnąć, nie każdy też chce szybko rosnąć - np. Strategy Letter I.Prowadzenie firmy to wielka radość. Wpuszczając pieniądze z zewnątrz oddaje się część udziałów i władzy, ale ponosi się mniejsze ryzyko związane z szybkim budowaniem sprzedaży i rozwoju produktu. Decyzja -- rosnąć organicznie czy szybko to jedna z decyzji, którą każdy startup wcześniej czy później musi podjąć. Gorzej, jeśli nie podejmie żadnej.Jest jeszcze jedna istotna kwestia, o której było raczej mało na Auli: "smart money". W poszukiwaniu inwestora, jeśli już na tę ścieżkę się zdecydujemy, najczęściej nie jest istotna kwota, ale to, co inwestor wnosi do firmy, a czego za pieniądze nie kupisz.Na przestrogę tym, co beztrosko podchodzą do VC, historia opisana przez Phila Greenspuna.Tomek Błaszczyk2009-10-14Tomek: to bardzo ważny temat i faktycznie na Auli było o tym za mało. Moim zdaniem to dlatego, że w Polsce ciężko się doszukać inwestorów wnoszących cokolwiek poza pieniędzmi.Ogólnie warto zawsze myśleć o "wnoszonej wartości", nie tylko co do inwestorów, ale wszędzie.Jan Rychter2009-10-15'
