["http://jan.rychter.com/blog/2009/3/18/mini-seedcamp-relacja.html"]
title = "Mini Seedcamp - relacja"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = 'Mini Seedcamp - relacja2009-03-18Miałem przyjemność brać udział w Mini-Seedcampie w Warszawie jako jeden z "mentorów". Brzmi poważnie, w praktyce jest to spora grupa ludzi, którzy spotykają się ze startującymi firmami i krytykują oraz udzielają porad. Postaram się opisać pokrótce każdą ze startujących firm, wraz z krótką oceną i komentarzem: JakElvis.pl: karaoke dla każdego. Bardzo sympatyczny serwis, gdzie można spróbować swoich sił w śpiewaniu, nagrywając równocześnie wideo. Dobry pomysł, dobra realizacja, Dobrze zaprezentowane. Twórcy otwarci na sugestie i pełni entuzjazmu. Moja ocena: bardzo dobry. EMP Game: gra online. Projekt jest w zalążku, w tej chwili dopiero został zaangażowany grafik, który ma zaprojektować wygląd gry. Twórcy szukają partnerów do ukończenia produktu i wprowadzenia go na rynek. Moja ocena: dostateczny, głównie dlatego, że projekt jest w tak wczesnym stadium. Moim zdaniem nie powinien się w zasadzie znaleźć na Seedcampie. Contails: Zarządzanie książką adresową: import adresów z różnych źródeł, synchronizacja, zarządzanie, budowanie społeczności. Moja ocena: dostateczny. Podobnych serwisów jest już dużo i nie widzę znaczącej przewagi konkurencyjnej. GeoGoer.com: współdzielenie transportu (ride sharing, carpooling). Dobry pomysł, dobre wykonanie, poparcie polityków (na Litwie). Moja ocena: dobry. Joobili: gdzie jechać na wakacje? (w danym okresie czasu). Świetny pomysł, rozwiązuje faktyczny problem. Podajemy daty i klikamy "zainspiruj mnie", dostajemy sugestie miejsc, wydarzeń, imprez i festiwali w zadanym okresie czasowym. Dobry model biznesowy -- wycelowane reklamy, zagospodarowanie części budżetów obecnie przeznaczonych na ulotki, promocje i billboardy. Zdecydowanie najbardziej dorosły z prezentowanych startupów, o czym świadczy też wczesna inwestycja przez Esther Dyson. Moja ocena: celujący, w zasadzie nie powinni się znaleźć na Seedcampie, bo ten etap mają już za sobą! mepi.pl: Zestaw aplikacji i narzędzi ułatwiających edukację przez internet. Nie brzmi to przekonująco? Mnie też nie przekonało. Niestety z prezentacji nie dowiedziałem się o co właściwie chodzi, z WWW też nie. Bardzo niepokoją mnie też projekty tłumaczeń wykładów z konferencji TED: uważam, że tłumaczenia to jak dawanie ludziom ryb zamiast wędki. Moja ocena: dopuszczający. Owszem, coś się dzieje, ale nie bardzo wiadomo co i dlaczego. mypolitiq.eu: Wsparcie demokracji -- informacje o politykach, informacje dla głosujących. Dobry pomysł, niezła realizacja, plany ekspansji. Moja ocena: dobry. opiekuninwestora.pl: Porady dla inwestujących w fundusze, indywidualne podejście do portfela. Słabo zaprezentowane, średni serwis WWW. Pomysł jest dobry, ale serwis trzeba zdecydowanie uprościć. Mało kto zdecyduje się brnąć przez gąszcz opisów i gigantyczne formularze do wypełnienia. Nie do końca oczywisty był też dla mnie model biznesowy. Moja ocena: dopuszczający. oQuizo.pl: Quizy w czasie rzeczywistym. Były problemy techniczne z filmem, ale dlaczego straciliśmy kilka minut na mówienie o tym? Prezentacja słaba, bo przez pierwsze parę minut nie było wiadomo do końca o co chodzi. Ogólnie pomysł jest jednak bardzo dobry i warty realizowania, co wynikło później w sesji mentorskiej. Moja ocena: dobry. PlayerAware: Gry dla ludzi, którzy mają życie (i nie mają czasu na czytanie serwisów dla nastolatków). Gdy zobaczyłem taki opis, ucieszyłem się, że to jest serwis dokładnie dla mnie. Jak się okazuje, jeszcze trochę mu brakuje, ale wygląda obiecująco. Nieźle zaprezentowane, wiadomo na czym serwis polega. Wielu mentorów miało problem ze zrozumieniem idei "collaborative filtering". Jest pomysł na model biznesowy. Moja ocena: dobry. przezwlasciciela.pl: Ogłoszenia o nieruchomościach: sprzedaż, wynajem. Deweloperzy są mile widziani, pośrednicy i agencje nie. Nie zrozumiałem jaki jest model biznesowy. Ogólnie mało innowacyjny serwis, w dodatku trafiający w bardzo mocno wypełnioną niszę. Obecne wyszukiwanie jest niemal bezużyteczne. Nie wiem też jak serwis obroni się przed pośrednikami? Moja ocena: dopuszczający. Programeter: mierzenie produktywności programistów. Pomysł niezły (choć nie nowy). Bez rewelacji. Moja ocena: dobry. Psychik.pl: społeczności dla ludzi pragnących rozwijać swoją inteligencję. Słaba prezentacja, nie do końca wynikło z niej co to jest za serwis, dla kogo i dlaczego ktoś chciałby go używać. Jak się później okazało w sesji mentorskiej, pomysłów jest więcej, tylko nie wszystkie trafiły do prezentacji (szkoda!). Wykorzystanie zebranych danych do celów marketingowych jest moim zdaniem bardzo nieoczywiste. Moja ocena: dopuszczający. Nisko, bo nie jestem przekonany dlaczego ktoś chciałby regularnie z takiego serwisu korzystać. Skrybot.pl: rozpoznawanie mowy po polsku. Prezentacja wygłoszona po polsku, co moim zdaniem powinno zdyskwalifikować firmę. Uważam, że przejście na język polski na imprezie prowadzonej po angielsku to afront wobec organizatorów i gości z zagranicy. Było to po prostu niegrzeczne. Co więcej, nie rozumiem dlaczego prezentacja była po polsku, skoro slajdy były po angielsku, zaś prowadzący wyraźnie tym językiem władał. Wstyd! Model biznesowy nieznany. Użytkownicy domowi, klienci biznesowi, nie bardzo wiadomo dla kogo to właściwie jest. Nie da się sprzedawać wszystkiego wszystkim. Niepotrzebne przedstawienie wszystkich możliwości wykorzystania rozpoznawania mowy. Moja ocena: niedostateczny. Przede wszystkim za prezentację w języku polskim, po drugie za naiwny model biznesowy zakładający, że 100zł ze sprzedaży licencji pokryje 100zł kosztów firmy. Nie wiem dlaczego firma ta w końcu uzyskała czwarte miejsce w głosowaniu -- moim zdaniem niezasłużenie. statystyczni.pl: dane na temat opinii publicznej w różnych krajach świata. Skradziona do prezentacji ikonka Mac OS X Preferences (wstyd). Nie było dla mnie jasne dlaczego ktoś miałby brać udział w głosowaniach oraz jak dobra wynika z tego próba statystyczna. Mam poważne wątpliwości co do poważniejszych zastosowań. Model biznesowy oparty na reklamach: słabo. Moja ocena: dostateczny (zarobiony głównie za wykonanie). superdeveloper.pl: rozwiązanie dla developerów -- kompletne narzędzie do marketingu nieruchomości. Dobry pomysł, dobra nisza, dobre wykonanie, dobra prezentacja. Moja ocena: bardzo dobry. tachoport.net (Tacholab): obsługa tachometrów (w ciężarówkach) on-line. Jak się później okazało, projekt bardzo dobry, choć nijak nie wynikało to z prezentacji. Trudno się było z niej domyślić o co właściwie chodzi. Moja ocena: dobry (ale dopiero po sesji mentorskiej). timecamp.com: śledzenie co robią pracownicy. Mój najpoważniejszy zarzut to nadmierne podobieństwo logo i nazwy do produktów 37signals (np. Basecamp). Do tego, cele biznesowe (1900 płacących użytkowników w ciągu 2 lat po $8/user/mo) są bardzo niskie i moim zdanie nie pokryją nawet kosztów. Moja ocena: dostateczny. Tognu: rezerwacje w restauracjach, zintegrowane z restauracyjnymi POS. Dobrze przedstawiony problem i zalety rozwiązania. Wyjaśniony model biznesowy: restauracje płacą za dokonaną rezerwację. Rokuje dobrze. Moja ocena: dobry. HumanWay.pl: wygodne zarządzanie rekrutacją. Świetna prezentacja (i to nie ze względu na efekty specjalne): dobre przedstawienie problemu, szybkie przejście do opisu rozwiązania. Wszystko zrozumiałe. Jest model biznesowy, jest działający produkt. Moja ocena: celujący. Cała impreza odbyła się sprawnie i niemal zgodnie z harmonogramem, w bardzo sympatycznej atmosferze. Bardzo udane wydarzenie, mam nadzieję, że będzie więcej tego typu imprez! Ogólne wnioski i spostrzeżenia zamieszczę już jutro w oddzielnym wpisie.'
