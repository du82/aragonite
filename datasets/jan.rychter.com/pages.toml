["https://jan.rychter.com/blog/2008/3/1/startuje-techaula.html"]
title = "Startuje TechAula"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = 'Startuje TechAula2008-03-01Wkrótce pierwsze spotkanie TechAuli, czyli nurtu technologicznego spotkań Aula Polska. Przygotowania zajmują mi sporo czasu -- trzeba określić tematy wystąpień, znaleźć mówców, przekonać że chcą być mówcami, umówić. Trochę jeszcze może to potrwać.W międzyczasie krótki "teaser", czyli opis koncepcji TechAuli: TechAula jest miejscem do dyskusji o nowych technologiach informatycznych. Dyskutowane tematy mają z założenia być kontrowersyjne. Koledzy z dużych firm będą stukać się w głowę, mówiąc "kto o tym słyszał? przecież nikt tego nie używa! wiadomo, że świat przechodzi na technologię X!". Tym lepiej: by zbudować firmę typu start-up niezbędne są technologie, które pozwolą wybić się z tłumu, wyjść ponad średnią. Przecież nikt nigdy nie osiągnął sukcesu robiąc to samo, co wszyscy! Warto więc o nowych i kontrowersyjnych technologiach słuchać, nawet jeśli połowa z nich okaże się być kiedyś niewypałami.TechAula to nie jest miejsce do dyskusji o tym, jak najlepiej wytłoczyć kolejną aplikację w Java Enterprise Cokolwiek ani o tym jak zrobić, by kod w PHP działał dwa procent szybciej. Nie rozmawiamy tu o "industry standard practices", nie mówimy o trendach, tendencjach i modach. Nie jesteśmy zapatrzeni w to, co robi "świat". Jeśli technologia jest powszechnie używana, automatycznie przestaje być nośnym tematem dla TechAuli, chyba że można przedstawić jej interesującą krytykę.Rolą TechAuli jest poszerzanie horyzontów. Nawet jeśli nigdy nie użyjemy danego języka programowania, to pewne pojęcia, jakie on wprowadza, mogą okazać się użyteczne. Podobnie jest z wieloma technologiami i pomysłami. Stąd szeroki zakres tematyczny i dodatkowe punkty dla tematów, o których pojęcia jak dotąd nie ma nikt. Korzystając z okazji: jeśli ktoś przeczytawszy powyższy opis ma ciekawy temat do zaprezentowania, to zapraszam do kontaktu ze mną!'
