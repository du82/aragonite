["https://jan.rychter.com/blog/praca-clojurescript-reactjs-clojure-5-2015"]
title = "Praca: ClojureScript, React.js, Clojure"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = 'Praca: ClojureScript, React.js, Clojure2015-05-19Raz na jakiś czas staram się przypominać, że w Fablo cały czas oferujemy pracę. A ponieważ statystyki pokazują, że najciekawsze zgłoszenia (i najlepsi współpracownicy!) pojawiają się za pośrednictwem tego bloga, to przypominam ponownie. Jeśli kogoś interesują systemy rozproszone, aplikacje w „chmurze”, nowoczesne architektury i chce się dużo nauczyć, to zapraszamy! Piszemy głównie w Clojure (i ClojureScript). Wymagamy zamiłowania do ładnego i efektywnego kodu i doświadczenia w pisaniu aplikacji działających w przeglądarkach. W tej chwili do pisania aplikacji używamy: ClojureScript, Rum lub Reagent, Datascript, React.js, D3.js, Clojure (po stronie serwerowej). Dodatkowe hasła to Apache Storm, RethinkDB, Redis, HDFS, Kafka, ZooKeeper. Jeśli ktoś nie programuje w przeglądarkach, to też zapraszamy, jeśli nieobce są mu takie hasła jak L-BFGS, Stochastic Gradient Descent, CRF, czy LDA i poza przygotowaniem matematycznym potrafi również implementować algorytmy w Clojure. Celowo nie piszę „programista Clojure”, ani „programista ClojureScript”, bo staramy się nikogo tak nie ograniczać. Nikt nie powinien być „programistą” jednego języka. W Fablo tworzymy nowoczesne narzędzia dla E-commerce: systemy rekomendacyjne, wyszukiwarki, narzędzia nawigacyjne, systemy machine-learning („Big Data”). Budujemy skalowalne systemy rozproszone. A żeby lepiej takie systemy budować, sami jesteśmy firmą rozproszoną, więc nie ma dla nas większego znaczenia praca na miejscu. Zapraszamy do rozmowy kandydatów z całej Polski (lub nawet spoza). Sposobem na rozpoczęcie rozmowy jest przysłanie adresu swojej strony GitHub z przykładami kodu/projektów na adres praca@fablo.pl. Najlepiej pokazać kod, który używa wymienionych wyżej technologii.KomentarzeHej, a używacie jakiegoś frameworka (np. Hoplon lub Luminus) ?Marcin2015-05-31Nie, bo z reguły za dużo narzucają i są mało elastyczne, a każda aplikacja jest nieco inna. W świecie Clojure "framework" nie jest też aż tak bardzo potrzebny, bo jest mnóstwo niewielkich bibliotek, które na wiele sposobów można skutecznie ze sobą łączyć.Jan Rychter2015-05-31'
