["https://jan.rychter.com/blog/betonujemy-miasta-10-2014"]
title = "Betonujemy miasta"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = "Betonujemy miasta2014-10-17Cieszy mnie, że w końcu zaczyna być podchwytywany temat ciągłego wybetonowywania miast: A wciąż nie doszło do ważnej próby - wody. Im więcej zabetonowanych i zapłytowanych powierzchni w mieście, tym bardziej gwałtowny przebieg mają ulewy. Deszczówka błyskawicznie spływa do studzienek, a kanalizacja Lindleyowska ma już 130 lat. Czy wytrzyma z nową Świętokrzyską między Nowym Światem i Marszałkowską prawie bez drzew w gruncie, bez trawników i żywopłotów? Prawdziwa próba wody nadejdzie zapewne już jesienią lub na wiosnę. […] Dlatego w miastach na Zachodzie tak duży nacisk kładzie się na sadzenie drzew przy ulicach i na chodnikach, dba się o trawniki. Przybywa też zielonych dachów na budynkach. Troska o tzw. powierzchnie biologicznie czynne wynika nie tylko z chęci poprawienia mikroklimatu i estetyki - chodzi także o zatrzymanie jak największej ilości wody, zanim trafi ona do kanalizacji burzowej, która ma swoją przepustowość. Firmom budującym domy z dachami, którymi szybko spływa deszcz, co podnosi ryzyko zalewania okolicy, nalicza się podatek. Inwestowanie w ogrody dachowe staje się więc bardziej opłacalne. Mam wrażenie, że w miejscach gdzie planuje się rozwój miasta dominuje myślenie sprzed kilkudziesięciu lat. Urzędnicy dumni są z wielkich, szerokich, wielopasmowych ulic, oraz z rozległych wyłożonych płytami placów. Wszystkie remonty, wokół których nie podniesie się społeczna wrzawa, kończą się ubytkiem zieleni, przybywa nam za to równych betonowych powierzchni. Przykłady można mnożyć: w Warszawie np. Pasaż Wiecha, nowa Świętokrzyska, czy przerobione ulice Racławicka czy Wołoska. Jest coś w równych betonowych powierzchniach, co wywołuje zadowolenie w urzędniczych umysłach. Potem efekty są takie, że betonowe pasaże świecą pustkami, bo nikt nie chce tam być i każdy tylko szybko przemyka (Pasaż Wiecha). Na trzypasmowych ulicach, które rozcinają miasto, samochody stoją w korku w trzech rzędach zamiast w jednym, zaś na odcinkach między światłami trwa ciągły wyścig i każdy jest Kubicą. W nowych planach zagospodarowania planuje się rozległe betonowe place w miejscu dzisiejszych parków. Gdy przychodzi zaś burza, wszyscy są nagle bardzo zdziwieni, że kanalizacja miejska nie jest w stanie odprowadzić takich ilości wody. Mam nadzieję, że w końcu ktoś zauważy, że to nie jest dobre dla miasta. Wyborcy zresztą zaczynają dawać o tym znać — w inicjatywie „Budżet Partycypacyjny” jakoś nikt nie prosił o wybetonowanie dodatkowych powierzchni. Dobrze też, że prasa zaczyna o problemie pisać.KomentarzeDużo bardziej niepokojąca/denerwująca (itd) jest tendencja do likwidowania ważnych szlaków komunikacyjnych (arterii, dojazdów do mostów), przekształcania ich w osiedlowe uliczki po jednym pasie w każdą stronę i likwidowanie na potęgę miejsc parkingowych zamiast czegoś dokładnie odwrotnego.kip2014-10-22Oparłbym się na doświadczeniach większych miast. Wiadomo już, że budowanie szerszych ulic (autostrad, dróg) w żaden sposób nie rozwiązuje problemu ruchu. Każda ulica się zatka. Nie jesteśmy w stanie zapewnić milionom ludzi w miastach możliwości swobodnego poruszania się półtoratonowym wehikułem, potrzebującym 12m2 miejsca. Nie da się i już. Dlatego mnie akurat to zupełnie nie niepokoi, szczególnie że idzie w parze z budowaniem obwodnic i tras szybkiego ruchu. Centrum miasta nie powinno służyć do tranzytu. Co więcej, moim zdaniem nikt nie powinien oczekiwać, że będzie do centrum mógł po prostu wjechać samochodem i załatwiać sobie tam co chce i gdzie chce. To się nie skaluje. Dobrym przykładem, gdzie wąska ulica świetnie zdaje egzamin, jest Marszałkowska w Warszawie, na odcinku między pl. Unii Lubelskiej a pl. Konstytucji. Dwa pasy, efektywnie jeden (bo jeden jest zastawiony przez samochody dostawcze), pełno świateł i przejść dla pieszych. I jakoś działa. Uważam, że nie powinniśmy oczekiwać, że każdy może zawsze wjechać do centrum samochodem. Ucieszyłbym się, gdyby Warszawa wprowadziła opłatę za wjazd, podobnie do Londynu.Jan Rychter2014-10-23Janku poruszyłeś bardzo ciekawy temat - wpływu zabudowy miejskiej/podmiejskiej na retencję i zaburzenia obiegu wody....Jak wszystko temat ma kilka warstw, więc po kolei: 1) Problem centrum miasta - w Warszawie mamy tak wiele powierzchni utwardzonej, że wykonywanie zielonych dachów i skwerków niewiele zmieni. Owszem działanie chwalebne z rożnych powodów, natomiast zatrzyma promil wody spływającej.Kanalizacja Lindleyowska akurat w centrum spokojnie wyrabia, polecam się wybrać na wycieczkę kanałami. 2) Problem dzielnic innych niż Centrum - tutaj faktycznie mamy kłopot, bo często przekroje kanalizacji ogólnospławnej sa za małe, i deszczówki odebrać nie sposób. Tutaj walka o retencję ma sens, coś tam pewnie można zrobić odpowiednio kształtując krajobraz. 3) Problem suburbanizacji miasta. Tutaj zaczynają się schody. Problemu nie stanowią nowe, szerokie drogi - one są wyposażone w studnie chłonne, baseny odparowujące, przepompownie tam gdzie potrzeba. Problemu nie stanowią nawet markety wielkopowierzchniowe i zakłady - w większości pod parkingami mają potwornej wielkości zbiorniki retencyjne które przyjmują nadmiar opadu i oddaje się go w stosownym czasie. Ciekawie robi się kiedy zajżymy do takiego Józefosławia czy okolic Ożarowa.Sporo terenów na których obecnie deweloperzy budują osiedla o pięknych nazwach to tereny porolnicze, często osuszone bagna, w wielu przypadkach kiedyś były zmeliorowane. Kiedy wraz z kapitalizmem zaczęła się moda na zabudowę podmiejską nikt nie zwracał uwagi na wodę. Poniszczono rowy, rurociągi odprowadzajace wodę opadową i gruntową, pogodzono pola betonem, słowem - zniszczono działającą sieć, a tam gdzie nie zniszczono - padła sama z braku środków na konserwację. Teraz jak deszcz popada czy jest lato podnosi się wielki krzyk, że woda... cóż natura wraca do równowagi, było bagno - będzie bagno, albo trzeba płacić. 4) Urbanistyka i działania władz lokalnych.Urbanistyka w zakresie spójnego kształtowania środowiska w tym warunków wodnych miała wielką dziurę czasową, stąd pewnie stało sto co się stało. W obecnym czasie każdą inwestycję na terenach porolniczych trzeba uzgadniać w zakresie kolizji z siecią rurociągów i rowów, urzędnicy niedawno poszli po rozum do głowy. Celowo nie komentuję wyglądu miasta, i nie odnoszę się do kwestii zamykać/ nie zamykać centrum, bo każdy kij ma dwa końceLech2014-11-10Sporo ryzykuję podejmując dyskusję z kimś, kto faktycznie na temacie się zna (a nie tylko udaje) :-) — ale: Byłem przekonany, że były publikowane wyliczenia dotyczące zielonych dachów i deszczówki. Aż poszukałem dokładniej w sieci i… niewiele znalazłem. Wszyscy wiedzą, że im więcej zielonych dachów i ogólnie zieleni tym mniej problemów z deszczówką w miastach, ale mało kto potrafi to zamienić w konkretne liczby. Mimo wszystko upierałbym się, żeby zazieleniać miasto na ile się da. Poza względami estetycznymi jednak wpływa to na deszczówkę (w niewielkim, ale rosnącym stopniu — od czegoś trzeba zacząć), do tego pomaga też w utrzymaniu nieco niższej temperatury w mieście w lecie (problem gorącego centrum: Warszawa już zaczyna go mieć, na Manhattanie jest nieznośny). Ciekawe jest co piszesz o terenach podmiejskich. To tłumaczy problemy jakie wielu znajomych miało z podtopieniami.Jan Rychter2014-11-27Nie znalazłeś, bo bardzo ciężko coś takiego rzetelnie zasymulować. Z uwagi na ciężar, ograniczoną miąższość warstw gruntu i specyficzny dobór roślin na zielony dach wpływ na retencję jakiś tam jest, ale w porównaniu do takiego parku czy skwerku - znikomy. Nie podejmuję się podawania konkretnych liczb z podanego wyżej powodu. Napisałem wcześniej, że działania zmierzające do zazielenienia miasta są chwalebne z wielu względów, problem gorącego centrum jest jednym z wielu. Tak samo ważne jest to, na co patrzysz codziennie za oknem, to wszystko składa się na otoczenie.Lech2014-12-03"
