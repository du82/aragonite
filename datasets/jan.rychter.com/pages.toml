full_description = 'Statystyki kłamią2008-03-14Jak wiadomo, statystyki kłamią. A skoro kłamią, to nikt nie powiedział, że raz opublikowanych wyników nie można zmienić. Na ostatniej Auli rozdałem uczestnikom tę samą ankietę, którą dostali wszyscy na Ogólnopolskim Barcampie. W ten sposób pozyskałem prawie dwudziestu nowych respondentów. Oto jak poprzesuwały się obszary zainteresowań: Starałem się utrzymać ogólną orientację grafiki podobną do tej poprzedniej -- wymagało to odwrócenia jednego ze składników podstawowych i poobracania wykresu ręcznie.Co widać nowego? Niewiele -- za to wyniki się skonkretyzowały. Tematy popularne ("mainstream") są zgrupowane ciaśniej razem. Erlang odjechał zgodnie z przewidywaniami w stronę języków funkcyjnych. Lua, SeaSide i Arc nadal leżą na końcu znanego świata, zaś makra wyraźnie już wylądowały w grupie mainstream, więc większość respondentów nie widzi ich jako metaprogramowanie.Chciałbym przygotować animację zmian w miarę jak przybywa respondentów, lecz nie wiem czy znajdę na to czas. Są niestety ekspertyzy i oprogramowanie do napisania...'
