["https://jan.rychter.com/blog/2009/10/13/kiedy-przerwa-projekt-komentarz-do-auli-39.html"]
title = "Kiedy przerwać projekt? (komentarz do Auli 39)"
description = "Jan Rychter: Tech Consulting, Product Development, Data Science."
full_description = "Kiedy przerwać projekt? (komentarz do Auli 39)2009-10-13Tomek Kolinko tłumaczy co dzieje się z szuku.plSzczegół, ale jakże istotny. Tomek Kolinko tłumaczył dlaczego zdecydowali się przerwać prace nad szuku.pl. Rozmawiający z nim Marcin Grodzicki pół żartem a pół lekceważąco potraktował te tłumaczenia. W podtekście była silna sugestia, że przerwanie prac nad projektem oznacza porażkę. Nie zgadzam się. Tomek wyznaczył sobie mierzalne cele, a następnie regularnie sprawdzał postępy. Gdy okazało się, że cele nie są osiągane, zgodnie z wcześniejszymi postanowieniami przerwał projekt. To jest odważne, mądre i odpowiedzialne podejście do biznesu, zasługujące na spory szacunek. Dla kontrastu, mnóstwo młodych firm wpada w pułapkę „wiecznych niskich lotów”: projekt idzie słabo, nikt nie stawia sobie celów ani nie mierzy postępów. Niepowodzenia są za to starannie tłumaczone: zawsze są okoliczności zewnętrzne, które je powodują. Brakuje obiektywizmu i stanowczości. Pamiętajmy, że zajmując się wiecznie projektem, który być może nigdy się nie uda, tracimy szansę na zajęcie się innym. Ślepy upór nie jest dobrym podejściem, za to obiektywna ocena faktów i stanowcze decyzje — jak najbardziej tak.KomentarzeTakie przerwanie jest odpowiedzialne, tyle tylko, że szkoda okazji, kiedy można było sprzedać serwis.Paweł Małkowski2009-10-13Możliwe że przerwanie projektu oznacza porażkę. Z drugiej strony czy kontynuowanie projektu który nie spełnia założeń twórców nie jest również porażką?Tak mi się skojarzyło powiedzenie osób związanych z inwestowaniem że straty trzeba ciąć wcześnie a zyskom pozwalać rosnąć. Trzeba mieć odwagę podjąć właściwą decyzję.Paweł Wasilewski2009-10-13Paweł: dokładnie o tym pisałem.Jan Rychter2009-10-14"
year_published = 2009
