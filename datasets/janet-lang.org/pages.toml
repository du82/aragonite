["https://janet-lang.org"]
title = "Janet Programming Language"
description = "Janet is a functional and imperative programming language. It runs on Windows, Linux, macOS, and should run on other systems with some porting. The entire language (core library, interpreter, compiler, assembler) is less than 1MB while offering a very rich language and should run on many constrained systems."
full_description = "Janet is a functional and imperative programming language. It runs on Windows, Linux, macOS, BSDs, and should run on other systems with some porting. The entire language (core library, interpreter, compiler, assembler, PEG) is less than 1MB. You can also add Janet scripting to an application by embedding a single C source file and a single header. Janet makes a good system scripting language, or a language to embed in other programs. Janet also can be used for rapid prototyping, dynamic systems, and other domains where dynamic languages shine. Implemented mostly in standard C99, Janet runs on Windows, Linux and macOS. The few features that are not standard C (dynamic library loading, compiler specific optimizations), are fairly straightforward. Janet can be easily ported to new platforms. While Janet is embeddable, it comes with a bit more out of the box than many other such easily embeddable languages such as threading, networking, an event loop, subprocess handling, regex-like library called PEG, and more. A REPL is launched when the janet binary is invoked with no arguments. Pass the -h flag to display the usage information. Individual scripts can be run with janet myscript.janet If you are looking to explore, you can print a list of all available macros, functions, and constants by entering the command (doc) into the REPL. See some auxiliary projects on GitHub. Here is a short list of libraries for Janet to help you get started with some interesting stuff. See the Janet Package Listing for a more complete list. Packages in the listing can be installed via jpm install pkg-name. Janet support exists for a number of editors. See the links below for some editor-specific details. The Zulip Instance also has an editors and tooling discussion area. For help, you can also check out Janet Docs for Janet documentation with user-provided examples. Feel free to contribute your own examples here to help fellow programmers."
year_published = 2025
clearnet = "https://janet-lang.org"
