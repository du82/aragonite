["https://janet-lang.org/docs/index.html"]
title = "Introduction"
description = "Janet is a functional and imperative programming language. It runs on Windows, Linux, macOS, FreeBSD and *nix."
full_description = "Janet is prebuilt for a few systems, but if you want to develop Janet, run Janet on a non-x86 system, or get the latest, you must build Janet from source. The recommended way to install on Windows is just to run the installer from the releases page. A Scoop package was maintained previously, but ongoing support is being dropped. If you want to use jpm to install native extensions, you will also need to install Visual Studio, ideally a recent release (2019 or 2017 should work well). Then, running jpm from the x64 Native Tools Command Prompt should work for a 64-bit build, and from the Developer Command Prompt should work for 32-bit builds. Using these specific command prompts for jpm simply lets jpm use the Microsoft compiler to compile native modules on install. You can install either the latest git version or the latest stable version for Arch Linux from the Arch user repositories with janet-lang-git or janet-lang. Janet is available for installation through the homebrew package manager as janet. The latest version from git can be installed by adding the --HEAD flag. If you would like the latest version of Janet, are trying to run Janet on a platform that is not macOS or Windows, or would like to help develop Janet, you can build Janet from source. Janet only uses Make and batch files to compile on POSIX and Windows respectively. To configure Janet, edit the header file src/conf/janetconf.h before compilation. To build and install Janet (and jpm) to a local or temporary directory tree instead of the default prefix of /usr/local, set the PREFIX environment variable while building and installing. You will like likely also want to update your path to point to PREFIX/bin to use janet, jpm, and any scripts installed via jpm. On most platforms, use Make to build Janet. The resulting files (including the janet binary) will be in the build/ directory. After building, run make install to install the janet binary and libraries. This will install in /usr/local by default, see the Makefile to customize."
year_published = 2025
clearnet = "https://janet-lang.org/docs/index.html"
