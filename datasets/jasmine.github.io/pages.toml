["https://jasmine.github.io/tutorials/default_spy_strategy"]
title = "Default Spy Strategy"
full_description = "You can customize the default spy strategy used by Jasmine when it creates spies. Normally, the default strategy is .and.stub(), which returns undefined if the spy is called. To change this, use the jasmine.setDefaultSpyStrategy helper in a beforeEach() or beforeAll() block. Call jasmine.setDefaultSpyStrategy with no arguments to remove a custom default. This can be helpful if you want to temporarily create a spy strategy for a series of spies."
