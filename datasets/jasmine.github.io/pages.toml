["https://jasmine.github.io/tutorials/custom_equality"]
title = "Custom Equality Testers"
full_description = "You can customize how jasmine determines if two objects are equal by defining your own custom equality testers. A custom equality tester is a function that takes two arguments. If the custom equality tester knows how to compare the two items, it should return either true or false. Otherwise, it should return undefined, to tell jasmine’s equality tester that it can’t compare the items. Now when you do comparisons in a spec, your custom equality testers will be checked first before falling back to the default equality tests. Note that if your custom tester returns false, no other equality checking will be performed."
