title = "Class: Env"
description = """
The Jasmine environment.
Note: Do not construct this directly. You can obtain the Env instance by
calling jasmine.getEnv."""
full_description = "Since: 2.0.0 Methods addReporter(reporterToAdd) Add a custom reporter to the Jasmine environment. Parameters: Name Type Description reporterToAdd Reporter The reporter to be added. Since: 2.0.0 See: custom reporter allowRespy(allow) Configures whether Jasmine should allow the same function to be spied on more than once during the execution of a spec. By default, spying on a function that is already a spy will cause an error. Parameters: Name Type Description allow boolean Whether to allow respying Since: 2.5.0 clearReporters() Clear all registered reporters Since: 2.5.2 configuration() → {Configuration} Get the current configuration for your jasmine environment Since: 3.3.0 Returns: Type Configuration configure(configuration) Configure your jasmine environment Parameters: Name Type Description configuration Configuration Since: 3.3.0 deprecated(deprecation, optionsopt) Causes a deprecation warning to be logged to the console and reported to reporters. The optional second parameter is an object that can have either of the following properties: omitStackTrace: Whether to omit the stack trace. Optional. Defaults to false. This option is ignored if the deprecation is an Error. Set this when the stack trace will not contain anything that helps the user find the source of the deprecation. ignoreRunnable: Whether to log the deprecation on the root suite, ignoring the spec or suite that's running when it happens. Optional. Defaults to false. Parameters: Name Type Attributes Description deprecation String | Error The deprecation message options Object <optional> Optional extra options, as described above Since: 2.99 (async) execute(runablesToRunopt) → {Promise.<JasmineDoneInfo>} Executes the specs. If called with no parameter or with a falsy parameter, all specs will be executed except those that are excluded by a spec filter or other mechanism. If the parameter is a list of spec/suite IDs, only those specs/suites will be run. execute should not be called more than once unless the env has been configured with {autoCleanClosures: false}. execute returns a promise. The promise will be resolved to the same overall result that's passed to a reporter's jasmineDone method, even if the suite did not pass. To determine whether the suite passed, check the value that the promise resolves to or use a Reporter. The promise will be rejected in the case of certain serious errors that prevent execution from starting. Parameters: Name Type Attributes Description runablesToRun Array.<string> <optional> IDs of suites and/or specs to run Since: 2.0.0 Returns: Type Promise.<JasmineDoneInfo> provideFallbackReporter(reporterToAdd) Provide a fallback reporter if no other reporters have been specified. Parameters: Name Type Description reporterToAdd Reporter The reporter Since: 2.5.0 See: custom reporter setSpecProperty(key, value) Sets a user-defined property that will be provided to reporters as part of the properties field of SpecResult Parameters: Name Type Description key String The name of the property value * The value of the property Since: 3.6.0 setSuiteProperty(key, value) Sets a user-defined property that will be provided to reporters as part of the properties field of SuiteResult Parameters: Name Type Description key String The name of the property value * The value of the property Since: 3.6.0 topSuite() → {Suite} Provides the root suite, through which all suites and specs can be accessed. Since: 2.0.0 Returns: the root suite Type Suite"
