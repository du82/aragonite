["https://jasmine.github.io/tutorials/custom_reporter"]
title = "Custom Reporters"
full_description = "A jasmine reporter is just an object with the right functions available. None of the functions here are required when creating a custom reporter, any that are not specified on your reporter will just be ignored. Additionally, in Jasmine 3.0, these functions can all be asynchronous in the same way as the callbacks in your suite. Either by receiving a done callback, returning a Promise, or using the async keyword. See the async tutorial for more information. If you write a custom reporter, you should make sure it handles all of the failure modes Jasmine can report on. Note: The way some of the failures are reported has changed in Jasmine 3.0 Failure types should have global failures that are reported to jasmineDone, suite level failures at suiteDone and spec level failures at specDone. Your reporter should display a total of 5 errors to the user. Exclusions should report the non-fdescribed specs as having not been run. The reporter terminology for this has changed in Jasmine 3.0 and is now called excluded to more accurately represent the state of the suite."
year_published = 2025
clearnet = "https://jasmine.github.io/tutorials/custom_reporter"
