["https://jasmine.github.io/tutorials/react_with_node"]
title = "Testing a React app in Node.js with Jasmine"
full_description = "The Jasmine NPM package was originally designed just to run specs against your Node.js code, but with a couple of other packages, you can use it to run your React specs as well. This tutorial assumes you’re using babel to compile your code and React Testing Library to test it. We’ll also be using jsdom to provide a fake HTML DOM for the specs. That command will create spec/support/jasmine.json and populate it with an initial default configuration. With Jasmine initialized, the first thing we’ll do is make a helper to register babel into the require chain. This will cause TypeScript files to be compiled to Javascript on the fly when they’re loaded. Make a new file called babel.js in the spec/helpers directory: We need to tell Babel what flavor of Javascript we want by adding a Babel configuration with the following contents: Next, we need to provide a simulated browser environment. Create jsdom.js in spec/helpers with the following contents: In order to ensure these files are loaded before any specs run, we’ll edit spec/support/jasmine.json. We need the Babel helper to be loaded before any helpers that contain TypeScript, JSX, or any other code that needs to be transpiled, so we modify jasmine.json like so: It’s common for React code to import CSS or image files. Normally those imports are resolved at build time but they’ll produce errors when the specs are run in Node. To fix that, we add one more package: You also might want to change the way that Jasmine looks for spec files. Jasmine traditionally looks for files in the spec directory with names ending in .spec.js, but a common convention in React projects is to put spec files in the same directories as the code they test and give them names ending in .test.js. If you want to follow that convention, change the spec_dir, spec_files, and helpers setting in spec/support/jasmine.json accordingly: We’ll need a way to render React components and inspect the result. There are several utility libraries that provide that functionality. The most popular is React Testing Library."
