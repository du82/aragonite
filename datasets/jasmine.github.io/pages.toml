["https://jasmine.github.io/upgrade-guides/2.0"]
title = "2.0"
full_description = "A matcher is set up a bit different now. The factory receives a util object which contains things like jasmines equality functions, and any registered customEqualityTesters. The factory is expected to return an object with a compare function which will be called with the actual and expected directly, instead of the actual value being on this For more information on the use of custom matchers. This page is intended to show the changes necessary to upgrade a 1.x suite to 2.0 The runs, waits, and waitsFor methods have been removed in favor of allowing functions run as part of the spec to receive and invoke a done callback. By having a beforeEach, afterEach, or it receive a done callback, jasmine will wait until that function is invoked before moving to the next thing in the queue. This means if the asynchronous logic also takes a callback for when it is done, jasmines done can just be passed through and jasmine will wait appropriately. All the ways to tell the spy how to behave are no longer their own attribute directly on the spy. There is a single and attribute that has all of the spy behaviors on it so fewer attributes are added to the function being spied upon. The jasmine mock clock is now an instanciated object and not a global, and it is now installed instead of being told to useMock. Jasmine 2.0 removes the ability for addons to dynamically add afterEach callbacks. In order to keep the clock from being a special object that is able to uninstall itself, it now needs to be manually uninstalled."
year_published = 2025
clearnet = "https://jasmine.github.io/upgrade-guides/2.0"
tags = ["asynchronous", "clock", "custom", "matchers", "specs", "spies"]
