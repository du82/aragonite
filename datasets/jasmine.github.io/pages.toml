["https://jasmine.github.io/tutorials/custom_asymmetric_equality_testers"]
title = "Custom Asymmetric Equality Testers"
full_description = "Jasmine provides a number of asymmetric equality testers out of the box, such as jasmine.any() and jasmine.objectContaining(). When it’s helpful, you can create your own custom asymmetric equality testers to encapsulate testing logic. To start, create a function that returns an object. The object must provide an asymmetricMatch function. Just like Jasmine’s built-in asymmetric equality testers, yours can be nested inside an array or object and will work correctly. Just like Jasmine’s built-in asymmetric equality testers, yours can be used anywhere Jasmine does an equality check."
year_published = 2025
