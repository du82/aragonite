["https://jasmine.github.io/tutorials/running_specs_in_parallel"]
title = "Running Specs in Parallel"
full_description = "Support for parallel execution in Node.js is available in 5.0.0 and later releases. You can run your Jasmine specs in parallel if all the following apply: The ideal number of workers depends on the nature of your specs and the number and type of available CPU cores. CPU bound suites often run fastest if the number of workers is slightly less than the number of cores. I/O bound suites may benefit from a lower number of workers. Jasmine 5.0 offers a new API for exactly-once global setup and teardown. It is intended to support parallel execution scenarios that require out-of-process setup to be done once regardless of the number of workers. It can also be used in the default sequential execution mode. To use the global setup/teardown API, add globalSetup and/or globalTeardown functions to your Jasmine configuration, e.g.: If a global setup/teardown function is declared async or otherwise returns a promise, Jasmine will wait for the returned promise to be resolved before continuing. Callback-style async is not supported. Parallel mode imposes a number of limitations on reporters. Since some of the most popular third-party reporters will need some changes to work in parallel mode, Jasmine assumes that a reporter is incompatible with parallel mode unless it declares compatibility. A reporter can declare that it is compatible with parallel mode by exposing a reporterCapabilities property with value {parallel: true}. The biggest limitation to be aware of is that events are delivered as they are received from worker processes. That means that events for unrelated specs and suites can interleave. A reporter that assumes that a specDone event is for the same spec as the most recently received specStarted event, or that all events between a suiteStarted and suiteDone event relate to children of that suite, will not work in parallel mode. Jasmine makes only the following guarantees about event ordering in parallel mode: In Jasmine 4.6 and later, suite and spec reporter events have a parentSuiteId property that allows reporters to identify a spec or suite’s parent suite without relying on event order."
year_published = 2025
clearnet = "https://jasmine.github.io/tutorials/running_specs_in_parallel"
