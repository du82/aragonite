["https://jasmine.github.io/tutorials/spying_on_properties"]
title = "Spying on Properties"
full_description = "Properties are more complicated than functions. In Jasmine, you can do anything with a property spy that you can do with a function spy, but you may need to use different syntax. Changing the value of an existing spy is more difficult than with a function, because you cannot refer to a property without calling its getter method. To get around this, you can save a reference to the spy for later changes. If saving a reference to the spy is awkward, you can also access it from anywhere in your test using Object.getOwnPropertyDescriptor. You can create a spy object with several properties on it quickly by passing an array or hash of properties as a third argument to createSpyObj. In this case you won’t have a reference to the created spies, so if you need to change their spy strategies later, you will have to use the Object.getOwnPropertyDescriptor approach."
year_published = 2025
clearnet = "https://jasmine.github.io/tutorials/spying_on_properties"
