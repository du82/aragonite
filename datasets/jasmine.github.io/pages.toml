["https://jasmine.github.io/tutorials/module_mocking"]
title = "Module Mocking"
full_description = "Module mocking is a testing technique in which a test replaces parts or all of one module that are imported into another module, without the cooperation of either of the modules involved. In most cases dependency injection is a better choice than module mocking. But if you really want to do it, it’s possible in most of the environments where Jasmine is used. The biggest advantage of module mocking is that it lets you easily test code that is tightly coupled to its dependencies. This can be very convenient, especially if you’re testing legacy code that wasn’t designed with testability in mind or you’ve decided that you prefer hard-wired dependencies. The biggest disadvantage of module mocking is also that it lets you easily test code that is tightly coupled to its dependencies. As a result, the act of writing tests will no longer give you feedback about excessive coupling. Another major disadvantage of module mocking is that it alters global state that the code under test depends on. This makes tests flaky by default: each test that interacts with a mocked module will affect the behavior of the tests that follow unless the mocks are reset to their original configuration between tests. Module mocking also “sands against the grain” of the JavaScript language. It involves one file mutating what appear to be global variables in another file, without that file’s knowledge or involvement. This can be confusing because it doesn’t happen anywhere else in JavaScript. It can also cause problems in cases where the mocking technique conflicts with the specification of the module system or the language itself. Module mocking in many environments involves unstable APIs or private implementation details of Node, transpilers, or bundlers. This greatly increases the risk that things will stop working in the future. Here are some recipes that might help. Most of them include links to complete working examples that you can run locally. To choose the right recipe you’ll need to know a bit about how your code is compiled, bundled, and loaded. In most cases, what matters is the kind of code that’s actually loaded into Node or the browser. So for instance, if your code is compiled to CommonJS modules, you need a CommonJS module mocking approach even if the source code contains import statements."
