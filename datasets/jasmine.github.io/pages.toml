["https://jasmine.github.io/tutorials/react_with_browser"]
title = "Testing a React app in browsers with Jasmine"
full_description = "This tutorial will explain how to set up jasmine-browser-runner to test React applications in web browsers. You can follow a similar process to test other kinds of applications that are built with Webpack and Babel. If you used create-react-app to set up your application, you don’t have to eject. However, it can help to eject in a separate copy of your application so that you can see how create-react-app configures Webpack and Babel. If you used create-react-app to set up your application, you may also need to add the following dependencies: You can find out the versions of installed packages with the npm ls command, e.g. npm ls webpack. (This works even if you’re using Yarn to install packages.) Next, create a new Webpack configuration file webpack-test.config.js for your specs. This should be similar to the one that packages the JavaScript code for your application. Set the output filename to test.js and the entry to the list of spec files. (Tip: use glob so you don’t have to manually update the list as you add and remove files.) The above example assumes that your spec files will be stored in the spec directory and have names that end in Spec.js. You’ll need to change the glob pattern if you want to put the spec files somewhere else. For instance, many React developers put the spec files next to the code that they test and give them names ending in .test.js. To match those files, use src/**/*.test.js instead of spec/**/*Spec.js(x). Some React codebases have a statment like import React from 'react' near the start of every file that contains JSX expressions. Others use a Webpack plugin to automatically add that at compile time. Check your component source files. If they don’t have an import statement like the one above, you’ll need to make sure that webpack-test.config.ts contains something like this: Otherwise, errors like ReferenceError: React is not defined will be thrown from component source files when you run the specs. The values of specDir and specFiles need to correspond to the output path from the WebPack configuration, in this case dist/test.js."
