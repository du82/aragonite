title = "Interface: Configuration"
description = """
This represents the available options to configure Jasmine.
Options that are not provided will use their default values."""
full_description = '''This represents the available options to configure Jasmine. Options that are not provided will use their default values. Since: 3.3.0 See: Env#configure Members autoCleanClosures :boolean Clean closures when a suite is done running (done by clearing the stored function reference). This prevents memory leaks, but you won't be able to run jasmine multiple times. Type: boolean Since: 3.10.0 Default Value: true failSpecWithNoExpectations :Boolean Whether to fail the spec if it ran no expectations. By default a spec that ran no expectations is reported as passed. Setting this to true will report such spec as a failure. Type: Boolean Since: 3.5.0 Default Value: false forbidDuplicateNames :boolean Whether to forbid duplicate spec or suite names. If set to true, using the same name multiple times in the same immediate parent suite is an error. Type: boolean Default Value: false hideDisabled :Boolean Whether or not reporters should hide disabled specs from their output. Currently only supported by Jasmine's HTMLReporter Type: Boolean Since: 3.3.0 Default Value: false random :Boolean Whether to randomize spec execution order Type: Boolean Since: 3.3.0 Default Value: true seed :number|string Seed to use as the basis of randomization. Null causes the seed to be determined randomly at the start of execution. Type: number | string Since: 3.3.0 Default Value: null specFilter :SpecFilter Function to use to filter specs Type: SpecFilter Since: 3.3.0 Default Value: A function that always returns true. stopOnSpecFailure :Boolean Whether to stop execution of the suite after the first spec failure In parallel mode, `stopOnSpecFailure` works on a "best effort" basis. Jasmine will stop execution as soon as practical after a failure but it might not be immediate. Type: Boolean Since: 3.9.0 Default Value: false stopSpecOnExpectationFailure :Boolean Whether to cause specs to only have one expectation failure. Type: Boolean Since: 3.3.0 Default Value: false verboseDeprecations :Boolean Whether or not to issue warnings for certain deprecated functionality every time it's used. If not set or set to false, deprecation warnings for methods that tend to be called frequently will be issued only once or otherwise throttled to to prevent the suite output from being flooded with warnings. Type: Boolean Since: 3.6.0 Default Value: false'''
