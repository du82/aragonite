["https://jasmine.github.io/upgrade-guides/5.0"]
title = "5.0"
full_description = "Most users will be able to upgrade to Jasmine 5.0 without making any changes. However, it does contain a few breaking changes that will affect some users. Following the advice in this guide will give you the greatest chance of a smooth upgrade experience. Breaking changes in Jasmine 5.0 include changes to how backslashes are handled in file globs on Windows, changes to how Env#execute is called, changes to how Node-based libraries boot jasmine-core, and changes to the system requirements. You can find a complete list of breaking changes in the release notes for jasmine-core and jasmine . All users are encouraged to upgrade to the latest 4.x release and resolve any errors or deprecation warnings prior to upgrading to 5.0. In particular, people who use the jasmine package on Windows should upgrade to at least 4.5.0 first because that release adds an important deprecation warning that affects Windows users. For the same reason, people who use the jasmine-browser-runner package on Windows should upgrade that package to at least 1.3.0 prior to upgrading it to 2.0. The new parallel execution mode introduced in Jasmine 5.0 comes with additional restrictions on how both specs and reporters are written. These restrictions apply only when Jasmine is run in the parallel mode. See the guide to parallel execution for details. Although Jasmine 5.0 may still work in some of those environments, we no longer test against them and won’t try to maintain compatibility with them in future 5.x releases. If you’re using jasmine-browser-runner, upgrade to version 2.0. Your package manager (npm/yarn/etc) should automatically install jasmine-core 5.0 or later unless your package.json specifies an earlier version. Historically, backslashes in file globs such as the spec_files configuration property were treated as directory separators on Windows and as the start of an escape sequence on other operating systems. Beginning with jasmine 5.0 and jasmine-browser-runner 2.0, they are treated as the start of an escape sequence on all operating systems. This change makes Jasmine configuration files more portable and ensures that Windows users can specify filenames that happen to match special glob syntax. See the glob package’s changelog and README for more information."
