["https://jasmine.github.io/tutorials/custom_object_formatters"]
title = "Custom Object Formatters"
full_description = "You can customize how Jasmine describes your objects in matcher failure messages by defining your own custom object formatters. A custom object formatter is simply a function that returns a string if it knows how to describe an object, or undefined if it doesn’t. For instance, consider this test for a Sudoku game in which cells are modeled as objects with expected and correctValue properties: The output can be improved by defining a custom object formatter that knows how to format cells. If the value is not a cell, it returns undefined. Now Jamsine will use the custom object formatter whenever a cell appears in a matcher failure message: Note that in order to use custom object formatters, a custom matcher must either use MatchersUtil#pp to format the expected and actual values for its failure message or allow Jasmine to generate the message by returning a result object with no message property."
year_published = 2025
