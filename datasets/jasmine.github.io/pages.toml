["https://jasmine.github.io/setup/nodejs.html"]
title = "Node.js Setup"
full_description = 'The jasmine module is a command line interface and supporting code for running Jasmine specs under Node.js. Jasmine 5.x supports Node versions 18, 20, and 22. (Odd-numbered Node versions aren’t supported, but many of them work.) Optionally you can also install jasmine globally so that you can invoke the CLI tool without npx. This is not recommended, however, since it’s difficult to keep the globally installed jasmine version in sync with each project that uses it. Customize spec/support/jasmine.json to enumerate the source files and spec files you would like the Jasmine runner to include. You may use dir glob strings. spec_dir is used as a prefix for all spec_files and helpers. Helpers are executed once before all specs. For an example of some helpers see the React tutorial. You can also specify a different config file by using either the --config command line argument or the JASMINE_CONFIG_PATH environment variable, as follows. Config files may be either .json or .js. A .js config file should be a module whose default export is a configuration object. Once you have set up your jasmine.json, you can execute all your specs by running jasmine from the root of your project (or npx jasmine if you had installed it locally). If you want to just run one spec or only those in files that match a certain glob pattern you can do it like this: Jasmine loads your code using dynamic import, which should be compatible with both ES modules and CommonJS modules. This means that a script will be loaded as an ES module if its name ends in .mjs or if the package.json of the package containing the file contains "type": "module". The default configuration should work fine for nearly all CommonJS projects as well as those that use ES modules. But if necessary you can configure Jasmine to load scripts using require by adding "jsLoader": "require" to your Jasmine config file. If you have code that works with "jsLoader": "require" but not without it, please let us know. Files with names ending in .mjs will be loaded via dynamic import even if jsLoader is set to "require".'
year_published = 2025
