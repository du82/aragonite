["https://jasmine.github.io/upgrade-guides/4.0"]
title = "4.0"
full_description = "We think that Jasmine 4.0 will be an easy upgrade for most users. However, it does contain a number of breaking changes and some people will need to make changes to their code in order to upgrade. Following the steps in this guide will give you the greatest chance of a smooth upgrade experience. Breaking changes in Jasmine 4.0 include changes to how Jasmine is configured, changes to custom matchers and asymmetric equality testers, better detection of common errors, and changes to the system requirements. You can find a complete list of breaking changes in the release notes for jasmine-core and jasmine. Although Jasmine 4.0 may still work in some of those environments, we no longer test against them and won’t try to maintain compatibility with them in future 4.x releases. Odd-numbered Node versions (13.x, 15.x, 17.x) are unsupported and may or may not work. In particular, some 13.x versions have incomplete support for ES/CommonJS module interop and can’t run Jasmine 4.0. Jasmine 3.99 issues deprecation warnings for most code that uses APIs that are removed or changed in incompatible ways in 4.0. We recommend upgrading to 3.99 and fixing all deprecation warnings before upgrading to 4.0. You should upgrade the Jasmine packages that you depend on directly, as usual. If you upgrade the jasmine NPM package, the jasmine Rubygem, or the jasmine Python package to 3.99, you’ll also get version 3.99 of jasmine-core. 3.99 is the final version of Jasmine for Ruby and Python. We recommend that most users migrate to the jasmine-browser-runner NPM package, which is the direct replacement for the jasmine Ruby gem and Python package. It runs your specs in browsers, including headless Chrome and Saucelabs. It works with Rails applications including those that use Webpacker, which was never supported by the jasmine gem. Unlike the jasmine-core pacakge, the jasmine package did not have a documented public interface until version 3.8. Beginning with 4.0, anything that’s not part part of the documented public interface will be considered a private API and subject to change at any time. If you use the jasmine package programmatically (i.e. you have code that does require('jasmine') or import('jasmine'), please check your code against the API docs."
