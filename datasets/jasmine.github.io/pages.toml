dering (random or not) of this execution of the suite. Note that this property is not present when Jasmine is run in parallel mode. parallel Boolean Whether Jasmine is being run in parallel mode. Since: 2.0.0 SpecFilter(spec) A function that takes a spec and returns true if it should be executed or false if it should be skipped. Parameters: Name Type Description spec Spec The spec that the filter is being applied to. Returns: boolean SpecResult Properties: Name Type Description id String The unique id of this spec. description String The description passed to the it that created this spec. fullName String The full description including all ancestors of this spec. parentSuiteId String | null The ID of the suite containing this spec, or null if this spec is not in a describe(). filename String The name of the file the spec was defined in. failedExpectations Array.<ExpectationResult> The list of expectations that failed during execution of this spec. passedExpectations Array.<ExpectationResult> The list of expectations that passed during execution of this spec. deprecationWarnings Array.<ExpectationResult> The list of deprecation warnings that occurred during execution this spec. pendingReason String If the spec is pending, this will be the reason. status String Once the spec has completed, this string represents the pass/fail status of this spec. duration number The time in ms used by the spec execution, including any before/afterEach. properties Object User-supplied properties, if any, that were set using Env#setSpecProperty debugLogs Array.<DebugLogEntry> | null Messages, if any, that were logged using jasmine.debugLog during a failing spec. Since: 2.0.0 SuiteResult Properties: Name Type Description id String The unique id of this suite. description String The description text passed to the describe that made this suite. fullName String The full description including all ancestors of this suite. parentSuiteId String | null The ID of the suite containing this suite, or null if this is not in another describe(). filename String The name of the file the suite was defined in. failedExpectations Array.<ExpectationResult> The list of expectations that failed in an afterAll for this suite. deprecationWarnings Array.<ExpectationResult> The list of deprecation warnings that occurred on this suite. status String Once the suite has completed, this string represents the pass/fail status of this suite. duration number The time in ms for Suite execution, including any before/afterAll, before/afterEach. properties Object User-supplied properties, if any, that were set using Env#setSuiteProperty Since: 2.0.0'''
