["https://jasmine.github.io/setup/browser.html"]
title = "Browser Setup"
full_description = 'The jasmine-browser-runner NPM module runs your Jasmine specs in a browser. It’s suitable for interactive use with normal browsers as well as running specs in CI builds using either headless Chrome or Saucelabs. Then, customize spec/support/jasmine-browser.mjs to suit your needs. You can change the spec files, helpers, and source files that are loaded, specify the Jasmine env’s configuration, and more. You can also use the --config option to specify a different file. This file can be a JavaScript file (either .js or .mjs) or a JSON file whose contents are similar to the object exported by the generated spec/support/jasmine-browser.mjs. If you’re using an older version of jasmine-browser-runner than 2.5.0, the init subcommand will create jasmine-browser.json rather than jasmine-browser.mjs. The specs will be run in a browser (Firefox by default). Once the run is finished, jasmine-browser-runner will exit 0 if everything passed and nonzero if any specs failed or were filtered out. Its value can be "internet explorer", "firefox", "safari", "MicrosoftEdge", "chrome", or "headlessChrome". If a source, spec, or helper file’s name ends in .mjs, it will be loaded as an ES module rather than a regular script. Note that ES modules can only be loaded from other ES modules. So if your source files are ES modules, your spec files need to be ES modules too. To allow spec files to import source files via relative paths, set the specDir config field to something that’s high enough up to include both spec and source files, and set srcFiles to []. You can autogenerate such a configuration by running npx jasmine-browser-runner init --esm. You can use jasmine-browser-runner to test your Rails application’s JavaScript, whether you use the Asset Pipeline or Webpacker. jasmine-browser-runner can run your Jasmine specs on a remote grid provider like Saucelabs, BrowserStack or your own Selenium Grid. To use a remote grid hub, set the browser object in your config file as follows:'
