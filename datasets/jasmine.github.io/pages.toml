["https://jasmine.github.io/pages/faq.html"]
title = "Frequently Asked Questions"
full_description = "Jasmine follows semver as defined by the Semantic Versioning Specification. This means we reserve major versions (1.0, 2.0, etc.) for breaking changes or other significant work. Most Jasmine releases end up being minor releases (2.3, 2.4, etc.). Major releases are infrequent. Many people use Jasmine via either the jasmine package which runs specs in Node or the jasmine-browser-runner package. For historical reasons, those packages have different versioning strategies: A list of supported browser and Node versions is included in the release notes of each version of Jasmine. Jasmine supports a rolling window of versions of Node and each supported browser. As a general rule, versions that still receive security updates, are available to test against in CI, and are available to us for local testing are fully supported. Older versions are supported on a best effort basis for as long as it’s practical to do so. This approach allows Jasmine to keep supporting older versions of Node and non-evergreen browsers for longer. However, it does mean that support for outdated platforms may be dropped in minor versions of Jasmine. Currently, the support status of platform versions is determined as follows. This is subject to change. If you need to know what’s currently supported, check the release notes for the Jasmine packages that you’re using. * In practice, Jasmine is very likely to work with older versions of evergreen browsers. However, only the latest versions are tested. Selenium-webdriver, which is a dependency of jasmine-browser-runner, has a more restrictive rolling support window policy. So far that hasn’t caused any problems, but jasmine-browser-runner users with a low tolerance for broken builds should be aware of it. Sometimes it takes more than one expectation to assert a particular result. In those situations it can be helpful to see all of the expectations fail before trying to make any of them pass. This is particularly useful when a single code change will make multiple expectations pass."
year_published = 2025
clearnet = "https://jasmine.github.io/pages/faq.html"
