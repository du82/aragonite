["https://jasonevanish.com/2023/02/24/things-i-hate-about-convertkit"]
title = "10 Things I Hate about ConvertKit (and how to fix them) Building Customer Driven SaaS Products | Jason Evanish"
description = "How can ConvertKit be improved? What are weaknesses I've experienced as a customer? Learn what I'd fix & improve plus why I chose them."
full_description = "10 Things I Hate About ConvertKit 24 February 2023 Ever have a love-hate relationship with a product? If you’re a product manager, designer, or UX-conscious engineer, you know how using products that don’t live up to their full potential can drive you crazy. Today, I want to talk about a product that best personifies that feeling for me: ConvertKit. Why I love ConvertKit First and foremost, I want to emphasize I like a lot about ConvertKit, and I’ve been satisfied with them since switching from Mailchimp a couple years ago. Mailchimp used to be the *gold standard* for UX. I loved their product and would often point people to their workflows as examples of good UX. I often could hire people with no experience and set them loose and they’d be able to figure out how to do everything they needed to easily. Unfortunately, a couple years ago, it seems Mailchimp’s team decided that they needed to fix what wasn’t broken, so as that got worse, and some of their brand decisions also didn’t sit well with with me, I made the switch to ConvertKit. Their offer to migrate our data was a HUGE selling point and we probably never would have switched without it. Overall, their performance has been adequate and their support team has been excellent at filling in many of the gaps in the product. I also admire Nathan’s founding story and love some of the stories of what he does at the company, like doing podcast interviews of each new hire to introduce them to the team. What I hate about ConvertKit Now that my team and I are settled in a couple years removed from switching to ConvertKit, and we’re a pretty sophisticated user, there’s quite a few UX things that drive me crazy. This post is about how ConvertKit could go from good to great, which is how you turn quiet users into raving evangelists. It’s also how you significantly reduce the workload of your support team, who in many of the cases I’m going to share have to make up for the gaps in the product. (Note: Wish your product could go from good to great? I’m a product coach and consultant who has helped many teams build the habits that create great products.) 10 Things I Hate About ConvertKit When you’re using a product, you are trying to accomplish specific tasks. When they are easy and smooth, you often don’t notice and get on with your day. Sometimes, they do something clever and delightful, which then becomes memorable. It’s why I’ve started a thread of Little Big Details to call them out when I see them. The following 10 things are a mix of big frustrations that have gotten in the way of key tasks my team wants to do, and those kinds of little big details that are the difference between a good enough product and a GREAT one. And because I want this to be a constructive conversation, I try to present solutions where possible. Let’s dive in. 1) Reactivating unsubscribes is a tedious chore that could easily be productized When you have a large list with tens or hundreds of thousands of subscribers, and you have a sophisticated workflow that involves many automations, sequences, and types of emails you send, there are going to be times where someone hits unsubscribe and changes their mind. And because ConvertKit’s architecture is built around “1 list to rule them all” with many tags and segmentations to manage it, that means that an unsubscribe from one thing also unsubscribes them from everything else associated with our company. Sometimes people didn’t want that. While looking up the answer to the question of, “Did subscriber X get the email they say is missing?” is a great experience in ConvertKit, fixing an unsubscribe is not. Looking up an individual users tells you so much useful information all in one view. Currently the workflow to get a subscriber reactivated is this: Click to open up Intercom to ask support to help Click through 2-3 prompts where Intercom tries to guess if they can automate answering your question Finally get to chat with a support person Tell them what the issue is Provide a screenshot of an email proving the person wants to be resubscribed Chat with the support person for any clarifications they need Wait about 20 minutes to a few hours Get the person resubscribed or deal with another round of questions with another person on the support team The problem with this is two-fold: It’s tedious as a user. Half of those steps feel extraneous and that they could be streamlined to make my life as a customer easier. ConvertKit’s support team is burdened with managing the ticket and manually managing this process. Now, I understand with spam laws you need to be really sure that someone wants to be resubscribed, and it happens often enough, it’s an option in Intercom. However, it would be better to just give me a form to fill out. You could even put a button on the individual user’s profile or the Subscriber’s section to take me to the form, so it doesn’t require Intercom yet. Then, when you click “Resubscribe” you can pop up a form that: Makes clear the requirements to reactivate a subscriber Asks for the same details the support team has to manually ask (the user’s email, a field to explain the situation, and a way to attach an image or other evidence) Confirms the request has been received and provide an estimate for updates This could then create a simple system in a very basic admin panel where you can queue up a list for someone on the support team to batch process these. Over time, you can then iterate on it to make their lives easier by both improving and streamlining this process, and adding other customer issues to it as well. I’ve helped spec out these at multiple companies and they always are built faster than many people projected and save more time than most expected. Having your support team cover for gaps in your product is a very expensive way to compensate for product issues and missing features. Fixing problems support identifies and making them more efficient at supporting customers are high leverage activities for product teams. You’ll see in many of today’s items, support at ConvertKit is currently left to cover for exactly these kinds of issues. 2) Import users doesn’t tell me what I need to know Want to send your support team on a wild goose chase wasting hours of time to support a customer? This is how. A simple query from engineering would save HOURS. So now imagine you are importing an important list for a key customer that expects everyone to receive a certain email. You have everything configured in ConvertKit and the spreadsheet looked right to you when you checked it. Yet, when you imported it, you expected 1,000 emails to be imported, and the confirmation email tells you 998 were. Frustratingly, when I import a list, I get an email (like the one pictured above) saying how many were imported. Yet what I don’t get are: How many people did I try to import? How many failed? Who specifically failed? What errors, if any, you have detected? Those last 2 are really important. How else will you know who didn’t work. Missing MailChimp… Mailchimp used to do this exceptionally well, so that you could immediately diagnose an issue and fix it. Notice in the email it confirms exactly what ConvertKit does, and it also tells me about a failure, with a suggestion why, and a link to more details. Typos happen. People are already unsubscribed (see 1!) and more. Letting me know which emails failed, and if possible, why, makes it easy to fix. Rather than needing to start a support ticket, I can fix this issue myself relatively quickly. But without the details MailChimp provides, do you really think I’m going to guess and check line by line myself? Unlikely. Telling me how many did not successfully import and who failed at least let’s me try to fix it myself before contacting support. If you also have error messages that are customer readable (like Mailchimp mentioning syntax) you’d save customers TONS of time and mostly eliminate support needing to spend tons of time investigating. As just one example, recently, I had a ticket run for almost a full week over 1 customer email not importing properly. It was handed off at least 3 times across support before we finally figured out the issue. That was frustrating for me, and costly for the ConvertKit Support team who repeatedly had to start over as they handed off the ticket. 3) #littlebigdetails Make the import flow better There a bunch of ways to improve the import process. The elements are already there with today’s interface: The current view when you’re importing a CSV This is already an efficient pop-up, but when you are a power user and have dozens of each category, it gets unwieldy and mistakes are easy to make. To improve this view, I would add: 1. Quick search in each section. This would make my life sooo much easier and faster to import, so I don’t have to scroll through long lists of categories. Best of all, this functionality already exists. When I add a selected user to a sequence, ConvertKit does have search in that view (pictured below). Why not implement the same in import, too? 2. Show what I picked in the collapsed view. When you are importing a list, you pick out any forms to assign the new subscribers to, sequences they should start receiving, and tags to add. This is core to making your orchestrations in ConvertKit do what you need it to; this is how you segment your audience, trigger the right emails, and manage your master list effectively. As you set your forms, sequences, and tags, you expand and collapse them one at a time. Ideally, when I collapse one of those lists, I want ConvertKit to show me which ones I selected so I can quickly review everything before hitting submit. My crude mockup combining the import pop up with the add subscribers to sequence pop up behavior. When you are doing an import, it can be a stressful moment, because a mistake will have people get the wrong email (or potentially many wrong emails). Having the clear sanity check (like ConvertKit has when you’re about to send a Broadcast) would help, and this is a simple way to accomplish that. 3. Add a working spinner to the page. Sometimes I have to click twice on the “Import Subscribers” button, or it’s not clear if it’s working. Adding a spinner (or progress bar) would let me know it worked and to be patient while it works. Note: Research shows people are MUCH more patient with a spinner or other loading signal; the rule of thumb I’ve found is that customers are willing to wait 2-3 seconds at most on their own, then that grows to 10-15 seconds with a spinner. Add some messaging to read during the spinner and they’ll wait as much as 45 seconds. Each of these items is a nice win, that in total takes the import process from okay to exceptional. These are also the kinds of things that make great quick wins to mix in along with bigger projects. One of these is likely a single point ticket in your project management tool. Best of all, few things boost the morale of a tired engineering team like feeling like they can ship some things measured in hours or days instead of weeks or months, especially if they also get to hear from happy customers that love the updates they made. 4) Give more thoughtful ways to manage tags My team and I have made hundreds of tags at this point. This is only growing, because ConvertKit’s support and account management teams have encouraged us to make more tags to further help us segment, target, and understand our subscribers. As it is, these tags are in a massive list that you endlessly scroll in the sidebar of the Subscribers page. The tags are listed in alphabetical order with the number of subscribers there are, and that’s it. Given the many purposes of tags, the big win would be making it easier to view them for various reasons. Organize poll results and other jobs for tags For example, if you have me do a poll where I’m measuring clicks of various options in the email we send (a clever suggestion from your account management team), allow me to view those results as a special view in the Broadcast results area, instead of having to do a CMD+F in my browser to find it: Then, for viewing the rest of the tags info in the Subscribers tab, consider the jobs that customers want to get done with their tags. The goal should be to make it easier to do each of those jobs based on how frequent those jobs are needed across the ConvertKit user base (surveys and understanding the segmentation of your user base are great for figuring this out). Create tags when in the flow to tag subscribers It would also be a big help to be able to create a new tag in the flow of looking to add a tag. Since ConvertKit has a great search here to try and find the right existing tag, you’re less likely to miss one, but then you may also want to create one right there. Not likely the exact spot for the button, but illustrates it would be helpful to have somewhere in this pop up. For example, I recently had a broadcast that went to what was a combination of a variety of groups. When I look at the broadcast results, I’d love to be able to tag everyone in that group, and not have to navigate to Subscribers, scroll all the way to the bottom of my list of 160+ tags, and click + Create a Tag, then go back to the broadcast and tag them. Like much of this list, it’s all about understanding customer workflows and removing friction from the tasks customers are trying to complete. 5) #DesignCrimes Fix the blue on blue stack bar charts The product team that shipped this missed the mark. Who can make sense of this?!?!? Let’s look at the issues here with what is supposed to be a breakdown of how our 7 landing pages and forms that drive our subscribers are performing: The bars are all the same color There are only 2 shades, despite many more than 2 forms There’s no legend to tell what each piece of a bar is (only hover tells you one piece at a time) Sometimes the same color is displayed twice in a row While I understand if you have a lot of forms you can’t have 500 colors, but you could at least have 8 (ie- ROYGBIV plus black/gray) and then potentially add patterns or shades to the bars, which in particular would help with accessibility (i.e.- colorblind people). Examples of patterns added to a bar to differentiate beyond color Add those additional colors with a legend or color code and you’d significantly improve the experience. And to truly make this a WOW, let me: Check and uncheck some of the forms to more easily compare some, but not all of my forms Instead of stacking the bar chart, put them side by side so I can more easily tell which bars are clearly the best performing Helping your customers be smarter is a key part of the process of making a good product, especially in the field of marketing. If your customers can’t understand how their forms and giveaways are performing, nor track the progress of experiments, it’s leaving a lot of value out of the product. 6) Add labels to the Unsubscribes bar chart Another place to ma"
