description = "“Let’s see what the highest voted features were on our feature voting site.” – Said no great product team, ever. Whether a company is using the new hotness of a Canny, or the old clunky of a UserVoice site, public feature voting systems are an example of terrible product management practices. https://twitter.com/Evanish/status/1212966208775045126 Feature Voting is…"
full_description = "Why Feature Voting Creates Poor Products (and what to do instead) 23 April 2021 1 Comment “Let’s see what the highest voted features were on our feature voting site.” – Said no great product team, ever. Whether a company is using the new hotness of a Canny, or the old clunky of a UserVoice site, public feature voting systems are an example of terrible product management practices. 62/ Show me a product team that relies on data from feature voting, and I’ll show you a team that thinks they know their users a lot better than they actually do. Some day I'll finally turn this into a blog post it deserves: https://t.co/zF69tsNx5K— Jason Evanish (@Evanish) January 3, 2020 Feature Voting is not talking to customers I’m a HUGE fan of founders and product managers talking to customers. In fact, I’ve written a variety of posts to specifically help more people confidently and effectively “get outside the building” to learn from their customers to build better products. Unfortunately, feature voting apps are the kind of shortcut that make some people think they’re getting customer input, when really they’re making a mess. Just looking at this page makes me 🤢 I’ve had a personal disdain for these tools for many years, as I’ve tweeted about issues a few times, and had many conversations with other founders and PMs about it. And today, I’m finally pulling together a comprehensive case for: Why great product teams would never dream of using a Feature Voting tool All the reasons feature voting leads to a worse products and bad decisions What to do instead to be truly customer driven and deliver real customer value With that in mind, let’s dive in… Why Great Product Teams Avoid Feature Voting Tools like the Plague There’s more than one way to build a great product, but there are a few traits that great product teams have in common: Data Informed: They measure the results of their work and use analytics and data to help them focus their efforts and see where they need to ask questions. Customer Driven: They think with the end user in mind, whether they understand it innately because they are it, or they deeply dig in to get to know and speak with end users of all types. Detail Oriented: The details are what separate okay and good from great when it comes to products. One of my favorite sites is dedicated to them: LittleBigDetails.com Product Sense: This obviously takes time to develop, but the best product teams include people who have and enforce having taste; they don’t fall for every fad, and bring a stamp to their work that people can see a bit of their fingerprints on. Collaborative: The Holy Grail of great product teams is being able to operate with the Cauldron approach that Steve Jobs used; everyone brings their best ideas, no one cares whose idea was what, and everyone focuses on creating the best possible solution. These are all hard to build and can take time to develop. If you’re trying to level up a product org, you likely can only improve one at a time, but that’s a post for another day. I spent the week talking to customers on the phone.I'll be honest. I haven't done this in awhile. Easy to think you're past the 'phone call stage'. One of the best weeks of my Tinder career. It doesn't matter what scale you operate at. Pick up the phone & talk to customers.— Jeff Morris Jr. (@jmj) July 20, 2019 When it comes to feature voting, it works against all of these: Data Informed: As we’ll dig into more below, the data from feature voting is trash. Bad data is worse than no data. Customer Driven: It may seem like it brings some customer voice in, but feature voting is so distorted and warped, it represents a bastardized version of listening to and understanding your customer. Detail Oriented: When people vote on a feature, what are they really saying? You don’t know. You just know they clicked an up arrow, not the nuance of their needs. Product Sense: Feature voting tries to turn your customers into your product team. Don’t. do. that. You build a product team so your PM, designer, and engineers can create the best solution, which customers usually haven’t thought of. Collaborative: There’s nothing collaborative about a wall of feature votes on a screen. And without the real context of the problems to be solved, there’s no way to talk tradeoffs and iterate to something great. Yet, despite all these being true, these are minor issues compared to the biggest issues with feature voting: They are fatally flawed from the start. Let’s talk about why. How Feature Voting Fails Let’s deconstruct all the failed parts of using a feature voting system. It starts with a faulty foundation, and falls completely apart from there. 1) You get *features* not problems. If you look at the average results of feature voting sites, what you’ll see is a lot of people asking for a feature. Typically posts say things like: Make a CSV export Build an integration with X Add tangential feature Y Here’s the thing: Any of those requests should be the *start* of a conversation, not the answer by itself. For instance, with a CSV export, all of these questions come to mind putting on my PM hat: What specifically do you want to export? Why do you need an export? How will you use the export? How would you like the export formatted? How often would you expect to need the export? Why that frequency? All of these questions can lead you down a rabbit hole that realizes any of the following: A new report in your product would be better, and more up to date, than an export. The export is for a key weekly meeting for the customer, so automatically emailing the numbers would be even better. The export is only needed once a year, and needs to cover multiple sections of your product to really meet their needs. The only way to get these kinds of insights is to talk directly to customers, and a feature voting site does not allow you to have those 1 on 1 conversations effectively. 2) People get easily sidetracked… You’re using a product. Suddenly you notice something annoying, confusing, or missing. You decide you’ll share the feedback that their stacked bar chart that only has two shades of blue is very difficult to read and you’d like more control and granularity. You notice they have a feedback button, or a link to their feature site and eagerly head over. When you get there, you’re greeted by a list of dozens, if not hundreds of other options.Without meaning to, you start reading the other options, maybe clicking on a few. “Oh that sounds interesting…” you think. Without meaning to, you start reading the other options, maybe clicking on a few. “Oh that sounds interesting…” you think. But then you forget why you came, and either never get around to sharing the feedback you meant to, or giving only a partial explanation of your original thought. Either way, the product team loses, as the feedback that motivated you to come to the page is much more valuable than a random upvote or two. 3) …Too many votes for something discourages future posting While distraction is one problem, the sibling of it is people flat out giving up. If you look and see the top upvoted item was posted in 2017 and has 400 upvotes, what makes you think your new idea will ever get any attention? And do you think that anyone at the company is even really listening? When feature voting apps were first getting popular about 5-10 years ago, I used to dig into them to try to get an idea of how product teams used them. It was depressingly rare how often I’d see someone from the company actually active. Even worse, when they were active, it was usually trying to explain why they’re not going to build the most popular items. Now, feature voting sites can try to help with this by building some kind of algorithm to show “trending” or “most recent” items, but that’s really lipstick on a pig; this is just one of many significant problems. (Fun aside: At a past job, I looked at our competitor’s UserVoice and noticed a number of posts from people asking for features we had that they didn’t. I passed this to our VP of Sales who then figured out who these people were and got some of them to switch to us. So your Feature Voting page not only hurts your product, but makes it easier for your more ambitious competitors to steal your frustrated customers.) 4) Nobody wants yet another log in One of the most famous stories in e-commerce history is the discovery that you can make *millions* more, and have double-digit improvements in checkout conversion by allowing people to check out as guests: ASOS improved #conversion by 50% by allowing checkout as guest. Streamlining checkout is no joke for #ecommerce https://t.co/99bLuPuDZa pic.twitter.com/hFD88ygfwC— Meticulosity (@Meticulosity) November 15, 2017 No one wants yet another log in, yet in many feature voting tools, the first thing you have to do is create another account to upvote or leave a suggestion. As anyone who has worked on growth teams or on e-commerce conversion rates knows, adding steps to a process will always lead to more drop-off. So let’s think about it…which is easier: Feature Voting: Leave product you’re in to go to feature voting site Land on the overall page filled with existing suggestions Click on an item or to post your own feedback Sign up for an account (or if you’re a masochist, sign in with your account from last time) Find the way to add your suggestion and post it Or, the direct way: Click on Intercom, a Feedback button, or link Send your message If you’re measuring the rate of customers having feedback to actually sending, the latter option will far outperform the former. But we’re getting ahead of ourselves on the solution, so let’s continue with the problems of Feature Voting. 5) Not all votes are equal. Let’s look at two different Product Managers and see what they have: PM 1: Talks to customers directly, gets feedback passed to them from other teams, and with help, organizes it all. PM 2: Relies on the feature voting page, when convenient, to show how many people are asking for something like what they dreamed up. — PM 1 has 25 logged conversations where they or a colleague they trained asked some follow up questions for context, and understands this is “very important” not just a “nice to have.” PM 2 has 50 upvotes for a feature that kinda sounds like what they’ve spec’d out. Question: Who has more real data to back up their decision making? Answer: PM 1 in a landslide. Upvotes != real customer feedback The number of upvotes a Feature Voting submission has does not mean all of those people want the same thing. Let me repeat that: The number of upvotes does not mean every upvote wants the same thing. Here are some of the reasons someone may upvote it: “I want that feature exactly as described.” “Well, this has 25 votes already, and it’s close enough, I’ll upvote that instead of post mine.” “Oh that looks interesting, I wouldn’t mind that. Click.” “I think my coworker wanted that…” “I could have used that a few months ago” (and haven’t needed it since) “That sounds cool.” All those upvotes and you don’t really have a quantitative count of customer input. Something could have 250 upvotes, but it’s the least important item. Or they could want different functionality or features as part of it. You don’t know though, because all you have is an upvote, not a conversation, or even a few sentences from each of those people. QUICK PM QUIZ: You’re a SaaS PM that has a mix of SMB and mid-market customers. Which feature should you build: A) A feature that all 5 of your biggest customers say is critical to their workflow B) Dark Mode, because it’s highly upvoted on your Feature Voting tool If you choose B, please think about a career change 6) Customers forget what they wanted if you wait to reach out Do you remember what you were thinking a year ago? How about a month ago? A week? For the vast majority of people, ideas, and feedback, are fleeting. When you’re in the moment doing something is the time you’re most in tune with the situation. If I come back to you a year later asking, “Hey – I saw you upvoted Feature X last year. We’re finally working on it. What were you looking for?” Unless you have continued regularly experiencing the issue that prompted the vote, you’re unlikely to remember the request well. You might have also changed jobs and be unreachable, gone on vacation when I reach out, or not even remember voting for something. That means following up with all those upvoters when you finally get around to a feature, you’re unlikely to get nearly as many useful insights as you would in the moment. Feedback is like milk…it goes bad quickly when raw. That’s why it’s so important to talk to customers regularly, and ask them in the moment what the underlying problem is and why it matters to them. That’s when they’ll remember the context you need to truly understand their request. Just because you can’t build something right away does not mean you can’t talk to customers about their needs and save it for later. You do that by talking to them (in chat, email, calls, etc), not by collecting votes and checking your Feature Voting app once a quarter for ideas. — From distractions to lost feedback, and murky data to blurred meaning, Feature Voting is fundamentally flawed from the start, and only gets worse the longer you use it. Now, let’s talk about what to do instead. No founder ever regretted talking to their customers more— @jason (@Jason) March 31, 2021 What to do instead of Feature Voting: By now you understand why it’s a terrible idea to add feature voting to your product, but that’s only half the battle. You need to then focus on what to do instead. 1) Source feedback where it naturally occurs Done right, your company can be a customer / feedback gathering machine. We did it when I was the 1st PM at KISSmetrics. There are great sources of feedback available all around you: Sales Teams: They know what deals are closing and what deals they’re losing. And the best sales people know the difference between good losses (not a great fit) and bad losses (could have won and the customer would be happy). Customer Support: They deal with the angry, the frustrated, the annoyed, and the confused. Tap into their knowledge and fix their biggest problems…and you’ll fix your customers’ problems, too. They also will get feedback, so give them a way to pass it to you. Account Management: They’re in charge of keeping customers and making them successful, so they see the gap between the promises your sales team made, and the reality of using your product. Another gold mine of feedback and insights, and even a potential source of future junior PMs. UX Researchers: As they do usability testing and test new features, they likely hear customer gripes, questions, and feedback. Make sure that gets captured. Data Teams: Ever wanted to ask a specific subsegment of your audience a question? Your data team is your best friend in helping create all kinds of great segments to an"
