["https://jasonevanish.com/2013/08/11/95-ways-to-find-your-first-customers-for-customer-development-or-your-first-sale"]
title = "» 95 Ways to find your first customers for customer development or your first sale Building Customer Driven SaaS Products | Jason Evanish"
description = '''You can have the best idea in the world, but until you find someone besides yourself that wants it, it's not really a business.  To find those people, as Paul Graham wrote in a recent essay, you have to "Do Things That Don't Scale." The problem is, it is often unclear what those "Things" are.…'''
full_description = "95 Ways to find your first customers for customer development or your first sale 11 August 2013 18 Comments You can have the best idea in the world, but until you find someone besides yourself that wants it, it’s not really a business. To find those people, as Paul Graham wrote in a recent essay, you have to “Do Things That Don’t Scale.” The problem is, it is often unclear what those “Things” are. Fortunately, the internet is full of help. In particular, I was inspired by recent posts on someone going from zero to revenue in 5 weeks using customer development and validation by Melissa Tsang for her new startup Cusoy. I’ve also found the advice for Joel of Buffer about his start and the advice from this post by Jason Cohen of ASmartBear blog to be spot on. With all that advice though I still hadn’t seen anyone tell you where to look. How to use this post: Before we get into the massive list of tactics below, I want to be clear on what to do with this list and what to expect when you find a few tactics you want to follow: Your initial goal should be learning.In the immortal words of Lean Godfather, Steve Blank, “No Plan Survives First Contact With Customers.” With that in mind, the last thing you want to do is be hard selling your idea to them. Instead, you want to interview your customers to understand their problems. You can learn how to do customer development interviews here. Understand you’re going to have a low success rate.There is no silver bullet for finding users for your startup, just tactics like the ones below that work to varying degrees depending on your idea and market. Even for good channels, a 10-20% response rate is normal, so don’t get discouraged. Don’t worry about scaling!None of the ideas below are really scalable when taken literally. However, like Paul Graham said in his essay: don’t worry about scaling right now. Just do whatever it takes to find people and the scalable methods will emerge later. If you have a cofounder worried about scaling early, have them read the Paul Graham essay. Remember your manners and personalize.You’re likely asking people to talk to you when you have nothing but an idea and maybe a prototype of some sort. Be respectful in communicating with them. Also realize that no one likes a form note, so the more you personalize it and make it feel like they’re special, the better chance you have of a response. Elizabeth Yin of Launchbit has an awesome slideshare with advice on reaching out to customers effectively. Don’t get banned.If you abuse any of the tactics below, many of the sites and groups will ban or block you. Pay attention to restrictions to how often you can do certain things (like Meetup.com allows you to message 12 users per day). Realize the more times you break a terms of service, the more likely you are to get noticed and banned. On the flip side, it is easier to ask for forgiveness than permission. Just don’t be egregious. A special thanks to these people that helped edit & provide ideas for this post: Thomas Schranz, Cofounder of Blossom.io Eric Jorgenson, Marketplace Manager at Zaarly I write semi-regularly about product management and building great, customer driven SaaS businesses. You can sign up to receive future posts here. 95 Ways to Find Your First Customers for Customer Development and Sales Linkedin: 1) Use Linkedin Answers: Look for people asking questions around your problem and market or ask your own. 2) Join Linkedin Groups: Join Linkedin Groups for your target market. Engage in discussions there, reach out to people that post relevant ideas or questions, or post looking for help. 3) Use Search + InMail: If you know the kind of person you want to talk to, try searching for them (like VP Marketing at companies between 25-200 employees) and using InMail to message them. 4) Check your existing connections: People change careers a lot more than you may expect. You may have also lost touch with an old classmate that is now in just the right market. Either way, your existing connects are very likely to respond and you’ll have access to their email address, which is better than their LinkedIn inbox. 5) Ask your connections for intros: It’s quite possible the perfect people to talk to aren’t already a connection, but they may be one degree away. Don’t be afraid to ask connections you have a good relationship with for an intro. 6) Post to the Linkedin Social Network: Linkedin now has status updates you can post. It’s a lot less active than other networks, but it can’t hurt to see if anyone notices. 7) Run Linkedin Ads: Linkedin is the network for professionals and their careers. If your startup idea has them as the target customer (say marketers or executives), then an alternative to the high maintenance of Linkedin Groups can be to run ads. Linkedin also has a partner network for a lot of business content sites which can further the reach. There’s a great guide on KISSmetrics for Linkedin Ads here. Facebook: 8) Look up your friends: For most people, their closest people in their life now and in the past are on Facebook. If you haven’t already exhausted your existing network on Linkedin, definitely look to see if any of your friends are in the market and worth talking to. 9) Ask your friends: There’s also a lot of random people you met in college and other times. You never know who knows who so you have to ask. I just got introduced to another person in tech through someone I was in a beirut league with in college. 10) Look for Fan Pages: There’s fan pages for just about anything you can think of. People that run those pages in your market are great people to talk to both as potential customers and to see if they’ll post something on your behalf on their page. Friends who have leveraged this have found it cheaper than Facebook ads, even when they pay the Fan Page owner. Just click the “message” button on the fan page. 11) Run Targeted Facebook Ads: If you think you really know your audience demographics, then running a small set of Facebook ads to a landing page, can be a great way to garner interest. 12) Try the new Graph Search: I haven’t had a lot of success using it, but it’s worth searching for things related to your market to see if anything else turns up, especially now that you can message people you aren’t friends with. In particular, Facebook has a great geographic filtering ability you won’t find on Twitter or otherwise. Twitter: (My personal favorite) 13) Ask your followers: If you have any kind of follower base at all, you should definitely tweet about who you want to talk to. If you don’t have a big follower base, ask the people with bigger followings you’re friends with to ReTweet you. As you develop your idea, you may want to tweet different requests, which may be seen by different people since no one sees every tweet of their followers. 14) Ask your followers for referrals: It’s not just about who you know. The bigger benefit is who your network knows so be sure to not just ask people you follow or follow you if they’re a fit, but ask others for referrals. 15) Run Twitter Ads: Twitter ads can be a cheap way to reach people you’d never know otherwise. We got thousands of sign ups for MyAnalytics App at KISSmetrics using them. Like any channel, the more mature it gets, the more expensive it will become, so by 2015, this may not be nearly as economical (like many Adwords today). 16) Ask Twitter Accounts to tweet on your behalf: Just like you can ask Fan Pages on Facebook to talk about you, you can reach out to Twitter accounts in your target market to see if they’ll tweet something for you or ReTweet you. If it makes sense for your business, you can also ask some celebrities via tools like BuySellAds and Sponsored Tweets. 17) Search for relevant Hashtags: Hashtags are a big part of Twitter for many markets. For example, in the analytics market, there’s #Measure. Find accounts using the hashtag and reach out to them and join the conversations happening. Find relevant hashtags by asking others or checking out sites like Hashtags.org 18) Join a Twitter Chat: Many groups have regular chats that can be found based on the group’s hashtag they use. A great example is the Community Manager chat, #cmgrchat. This is a great way to ask questions and engage your target audience if they’re holding Twitter chats. 19) Search Twitter for People Talking about your Problem: Remember that time you were really annoyed at a company? What did you probably do? You tweeted about it. Try searching different ways for people talking about frustrations and you’re bound to find people happy to talk because they’re excited someone is going to make things better. I’ve successfully used this to talk to people about, of all things, email migration. Email: 20) Email relevant friends/contacts: There’s a right way and wrong way to do this. Yes, you can spam all your contacts in one big dump asking for help. What will yield a better result is if you invest the time to be more targeted in who you reach out to. Close friends and family won’t mind and those actually related to your target industry. 21) Start a personal newsletter: I’ve known some people to start a personal newsletter to have their contacts *opt into* that then regularly updates them on your startup journey and can ask for specific help then repeatedly in the newsletter. This works great for getting mentors and early supporters engage in a small ask (just opt in) and later help more as you have different needs. 22) Use Rapportive to find emails & cold email: Somehow you may have stumbled upon someone you’d *love* to talk to, but you don’t know them. You can use tools like Rapportive to guess the email address and send them a personal note asking to speak with them about what you’re working on. You can find more advice on this tactic here and here. 23) Make your GChat status a call for help/intros: This may seem simple and passive, but you’d be surprised who reads your GChat statuses. Adding a note of what you’re looking for and leave it up for a few days and you might just get a few people to help you out. This works for other chat tools as well, of course. 24) Make your signature a call for help/intros: Just like your GChat status is a long tail way to get people’s attention, you can use your email signature the same way. Below your name in your signature is the perfect place to let people know. Don’t forget to update your mobile app’s signature as well as your computer’s. Meetup.com: 25) Join & Attend Meetups in your category: Meetup has become an amazing hub of groups around just about any topic you can think of. Whether you’re making an app for LARPers or a hardware startup, there’s a meetup group likely in your area you should join to meet and talk with group members in your target market. 26) Ask organizers to message the group: Organizers have unique privileges to send messages to their groups. You don’t get what you don’t ask for, so don’t be afraid to reach out to group organizers to talk to them (they may be a great target user) and see if they’ll message the group. They often make no money in running their groups, so you can think of them like the Facebook Fan Page owners previously mentioned. 27) Ask the organizer to allow you to address the audience at a Meetup: Potentially even better than getting into everyone’s cluttered inbox is the opportunity to address the whole group at one of their events. This allows people most interested to immediately approach you. This can be a great consolation ask if they don’t want to message their whole group since this requires no work on their part. 28) Mention in your Meetup profile what you’re looking for: Like the GChat status, this is a passive move that alone won’t get you everyone to talk to, but you’d be surprised how often people read the profiles of other new members in a group. Be sure to include your desired contact method if you want Meetup members to reach out to you. 29) Message users on Meetup.com: Not every member of a Meetup group attends every event and if there’s no upcoming meetups or it’s a group outside your area, you can still reach users by sending them individual messages. Per a great write up by Melissa Tsang, Meetup has a limit of 12 messages per day, which is still enough to get some quality responses as she writes in detail about. 30) Create a Meetup group: Just because a group doesn’t exist, does not mean there would not be interest. Countless people have launched successful businesses based on the idea of organizing a high value group. Just remember that if you do this, not only will you build trust and relationships with all the attendees, you’ll be the organizer who can send all those messages, decide who addresses the audience, etc. Your Blog: 31) Write a blog post about the problem you’re solving: If you feel you know some of the key problems that users are facing in your target market, write about it! If it resonates with them, they will share, upvote, tweet, etc it and some will even sign up as long as you remember to have a call to action to sign up at the end. You can see an example here, where 1,000 reads turned into 10 sign ups and a look at some famous companies that started with a blog here. 32) Post your blog to discussion sites in appropriate categories: Sites like Reddit and HackerNews are awesome to access established audiences for your market. Before posting, do your homework so you actually post it somewhere it’s welcome; a baker would not be well served to post their baking innovation on HackerNews, but a marketing startup would do very well posting to Inbound.org. By posting it to these sites you’ll significantly increase the reach of #31 and might also get some interesting commenters there you can reach out to like this example from Vero. 33) Update your About Page for what you’re looking for: Just like #23 and #28, it is always beneficial to list what your looking for on your About page. The most engaged people on your blog are likely to click to your about page to see who you are and if they see this, they can help even if they don’t read your specific blog post about your idea. 34) Make a page on your blog just about your market: Depending on your blogging platform, this could be easy or hard, but it can never hurt to organize your information in a way that people can easily navigate it. If you’re writing a whole series of items or have already created a lot of related content, this can be a great way to assert your expertise and act as a honeypot to draw in interested potential customers. 35) Start a blog just to talk about your industry: Don’t already have a blog or don’t want to talk about your startup on your existing blog? Then start a new one. It helps to have more content than just one post, so if you go this route, try to have a few posts you can post over a few weeks. If you know your startup’s domain, you can make this the start of your company’s blog. Especially for blogs like this, try to g"
