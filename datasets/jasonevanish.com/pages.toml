description = "A few years ago, I read a great blog post about how you can read 52 books a year with limited effort. While I haven't been able to quite hit that rate, I have managed to hit half that thanks to a commitment to always reading while I'm on public transportation. I've read ~25 books…"
full_description = "Books 22 Comments A few years ago, I read a great blog post about how you can read 52 books a year with limited effort. While I haven’t been able to quite hit that rate, I have managed to hit half that thanks to a commitment to always reading while I’m on public transportation. I’ve read ~25 books a year for the last 7+ years. 90% of them are fantastic, and so I’d like to highlight them in case you’re looking for a book on any of these subjects. (Note: The date represents when I finished reading it). If you have any recommendations, please leave a comment with the book and why it’s a must read! Ratings Scale Explained: 9-10 – One of the best I’ve ever read on the subject. A must-read. 7-8 – Well worth the read if you’re interested in the subject. 6 – The book is only ok. It may be long-winded, redundant or just doesn’t pack enough of a punch relative to higher rated books. 0-5 – I do not recommend the book. Common causes of such a score: too much fluff, bad advice, nothing actionable, or copying content from better books. You can learn more about my approach to what books I read and why here. And if you have a great book recommendation, tweet me @Evanish, and check out what others have recommended here on my Amazon Wish List. Leadership 1. “How to Win Friends & Influence People” by Dale Carnegie (9.23.11), (3.14.12), (1.14.13), (2.12.14), (4.19.15), (1.21.17), (4.3.18), (12.31.19) Rating: 10/10 Why Read it: This is literally a timeless classic for anyone interested in leadership. Virtually everyone I know that has read this actually re-reads it regularly. No book can single-handedly do more to improve your skills with others. I’ve read this book at least 5 times now and find things to improve in myself every time I read it. Who Recommended: My father. 2. “The Score Takes Care of Itself: My Philosophy of Leadership” by Bill Walsh (6.30.12), (8.14.15) Rating: 9.5/10 Why Read it: Bill Walsh is one of the most successful coaches in NFL history and more of his assistants went on to be successful head coaches than any other ever. This is his defacto book on his leadership approach and is filled with great insights. It’s not every day you can get a first hand account of how a 3-time Super Bowl champion coach did it from day 1. Who Recommended: Jack Dorsey via Twitter. 3. “The 21 Irrefutable Laws of Leadership” by John C Maxwell (11.27.10) & (6.21.15) Rating: 9.5/10 Why Read it: Growing as a leader has many stages that are all challenging. John Maxwell breaks each stage down and gives actionable advice on how to grow as a leader through each of the 10 levels. I’ve reread this book many times now and find new things to learn every time I read it. If you think you want to become a leader, read this book. If you are excited to do the things Maxwell discusses, you can be a great leader. Who Recommended: My father. 4. High Output Management by Andy Grove (11.14.14) Rating: 9.5/10 Why Read it: If you ever want to lead or manage others, then you need to read this book. The legendary CEO of Intel, Andy Grove, breaks down the keys to getting the most out of your team. He does this by helping you understand how to focus effectively on your people and to look at the big picture to understand how you and your team can best fit into your company’s overall systems. Despite being written over 30 years ago, it has aged like a fine wine. Who Recommended: Ryan Sarver in this tweet. 5. The Hard Thing About Hard Things by Ben Horowitz (5.18.14) & (4.27.17) Rating: 9/10 Why Read it: Building a company is hard. Gut-wrenchingly hard. There are no short cuts to building a billion-dollar-plus business. In this book, Ben Horowitz recounts the insane story of how his company that should have failed dozens of times came back from the brink over and over again. He shares specific advice for handling the tough situations a founder of a high growth business will face. The longer I’m working on startups as a founder, the more helpful this book has been. Who Recommended: Many friends & avid reader of @pmarca tweets and Ben’s blog. 6. First, break all the rules: What the world’s best managers do differently by Gallup & Marcus Buckingham (9.17.16) Rating: 8.5/10 Why Read it: Being a good manager is hard. You’re rarely given much training and the examples around you are often more of what *not* to do. This book is a compilation of over 80,000 managers and 2,000,000 employees studied by Gallup and the key actions they found that make great managers, which are not what you’d expect. If you want to learn more, I wrote about it on the Lighthouse blog here. Who Recommended: Chris Paul 7. The Charisma Myth: How Anyone Can Master the Art and Science of Personal Magnetism by Olivia Cabane (8.9.14) Rating: 8.5/10 Why Read It: To be a leader, to inspire others, you must be charismatic. But what if you’re not naturally charismatic? It’s a skill like any other and the author breaks down the various types of charisma, when and how to use them, and easy exercises you can use to make yourself more charismatic in any situation. I found myself writing all over this book, getting results from the exercises, and reflecting on many of the ideas. Who Recommended: Matt Ellsworth 8. Hacking Leadership by Mike Myatt (3.20.15) Rating: 8/10 Why Read it: There are many facets to being a great leader and Myatt explores both what those many areas are and what to do about it. Myatt has a great mix of hitting home on the flaws every leader knows they need to work on and showing you what you can actually do about it. If you want to audit yourself as a leader and learn what you can do to improve yourself and your organization, this is a great read. Who Recommended: Josh Lowry 9. “What Got You Here Won’t Get You There” by Marshall Goldsmith (4.6.13) Rating: 8/10 Why Read It: Writing a book for beginners is easy. When you know nothing on a subject, everything feels like an amazing insight. What makes this book great is that it’s not for beginners. As I learn more about various subjects, I’m always looking for books that will help me go deeper. This book is excellent for anyone mid-career who knows they have leadership flaws they want to correct and strive for greatness. Who Recommended: Found on Amazon and was sold by reviews. 10. “The Cycle of Leadership: How Great Leaders Teach Their Companies to Win” by Tichy and Cardwell (9.13.10) Rating: 8/10 Why Read it: How do you build great leadership into your company as it grows? This book dives into how Jack Welch and his team were able to build an organization full of leaders they could develop consistently. It’s a long read, but well worth it if you have big questions about growing leaders in a scalable way. Who Recommended: Found on the company bookshelf when I worked at oneforty. 11. “Who: Solve Your #1 Problem” by Smart and Street (5.20.13) Rating: 8/10 Why Read it: When starting a business or any organization, nothing, I repeat nothing, is as important as your team. Finding and hiring the best talent can be quite challenging and replacing those that didn’t work out is costly. While I didn’t agree with (and question the legality of) some of the tactics they suggest, the overall process for getting the right person for every job on your team is well worth the read. Who Recommended: Matt Lauzon 12. “Great by Choice” by John Collins (1.8.12) Rating: 7.5/10 Why Read it: This is a classic business book trying to answer the question of “why are some businesses super successful and others fail?” It provides solid advice to apply to your business. Who Recommended: Tweet conversation with Dharmesh Shah and Rob May 13. “Principles” by Ray Dalio (10.25/15) Rating: 7/10 Why Read it: Ray Dalio is a multi-billionaire who has built his investment firm, Bridgewater Associates, to be a titan in its industry. This book breaks down his philosophy on culture and leadership, and the principles that guide it. It’s fascinating to see the degree of structure he brings to his teams and the thoughtful ways he attempts to give his people frameworks to help them do their jobs better. Who Recommended: Alex McClafferty 14. “The Art of War” by Sun Tzu (5.10.12) Rating: 7/10 Why Read it: This is a true classic on battlefield strategy. Much of it applies to startups and business. Definitely one to read and you can get it for free on Amazon. Who Recommended: Found on Amazon Kindle free books 15. Lead from the Heart by Mark C Crowley (4.10.16) Rating: 7/10 Why Read it: Being a great leader is about more than numbers. Showing heart, that you care for your team matters. Mark has spent his career investing his people and showing them heart, in the coldest of industries: finance, and had great success. He shares some fascinating research that backs up his great lessons on how to lead from the heart. Who Recommended: I spoke with Mark and wanted to learn more. 16. The Advantage: Why Organizational Help Trumps Everything Else by Patrick Lencioni (2.20.17) Rating: 7/10 Why Read it: Building a great company does not happen by accident. Lencioni breaks down the keys to strong communication and creating an aligned vision for everyone to follow. Many of the principles he preaches align with all the data I’ve seen since I started Lighthouse. Who Recommended: Norman Tran and Kai Zau. 17. “The Starfish and the Spider” by Brafman & Beckstrom (2.29.12) Rating: 7/10 Why Read it: When building an organization, you can build it like a starfish (independent arms that work together) or a spider (every limb answers to the top). This book does a good job of explaining the concept and how you can apply it to your company inside and out (especially if you have an API/ecosystem). Who Recommended: Abby Fichtner – Culture, Team Building, and Communication 1. “Tribal Leadership” by Logan, King & Fischer-Wright (12.22.11) Rating: 9/10 Why Read it: If you read only one book on culture, this is the one to read. It has an easy to follow process for identifying where you and your company are at and specifically how to get everyone on your team to a higher level. I got Hiten to read it and he loved it so much every member of the KISSmetrics team got a copy. Who Recommended: Willis Jackson 2. “Creativity, Inc.” by Ed Catmull (12.6.14) Rating: 9/10 Why Read it: Ed Catmull helped start Pixar Studios, the legendary creators of films like Toy Story and the Incredibles. With all the hits they have produced, it’s little surprise that culture has played a HUGE role in their success. In this book Catmull shares what he did to foster and preserve an incredible, creative-friendly culture not just at Pixar, but also to turn around a Disney animation studio that was crumbling. As if that wasn’t enough, he has an added chapter on what working with Steve Jobs for over 25 years was really like. Who Recommended: Steven Loi, Mathias Meyer, Kevin Lamping, and Lars Lofgren. 3. “Drive” by Dan Pink (3.21.16) Rating: 8.5/10 Why Read it: The modern workforce is mobile, adaptable, and doesn’t always respond to the old “carrot and stick” approach to leadership. Dan Pink shares extensive research to back up his modern management theories that show how today’s workforce must be motivated, especially to get the most out of any role requiring creativity. Who Recommended: I’ve been a big fan of his TED talk and wanted to get the full story. 4. Non Violent Communication by Marshall Rosenberg (6.22.18) Rating: 8/10 Why Read it: Communicating with others whether in work or your personal life can be a real challenge. Especially when we all have different backgrounds, places we grew up, and norms in our cultures, misunderstanding is bound to happen. Marshall Rosenberg has a process that can help improve that communication. I didn’t agree with everything he suggested, but his frameworks for expressing your thoughts to others and getting more out of the people you need to improve relationships with are well worth the read. Who Recommended: Matthew Fornaciari 5. “Fierce Conversations: Achieving Success in Work and Life One Conversation at a Time” by Susan Scott (2.8.13) Rating: 8/10 Why Read it: To succeed in both your personal and professional life, communication is key. This book shows you how to have those difficult conversations that matter most. It’s never easy to broach the tough subjects, but without doing so, your company, your marriage and your friendships will suffer. This book gives great, actionable advice on how to handle all kinds of conversations. Who Recommended: Amazon.com recommendation engine 6. “The Five Dysfunctions of a Team” by Patrick Lencioni (12.24.10) Rating: 8/10 Why Read it: Not all startups succeed. Sometimes companies become a wreck with all kinds of people problems. This book highlights the five most common issues and most importantly, how to fix them with vivid examples. If your team is struggling, this is well worth the read. Who Recommended: Jeff Bussgang via this blog post 7. Turn the Ship Around!: A True Story of Turning Followers into Leaders by Ret. Capt. L. David Marquet (11.27.15) Rating: 8/10 Why Read it: Imagine taking over the lowest performing submarine in the fleet and being asked to challenge convention in the most standard of places (the US Navy). This book covers the tactics Retired Captain L. David Marquet used and that apply well beyond the military. Most interesting, it’s in diary form, so you can follow the journey as he slowly, successfully changes the culture. Who Recommended: Billy Griffin 8. Powerful: Building a culture of freedom & responsibility by Patty McCord (5.4.18) Rating: 7.5/10 Why Read it: It’s always great to learn from successful companies. Netflix is a particularly strong company in our era of turmoil and change in many industries. Patty McCord worked directly with Netflix’s CEO to create their famous Culture and Culture deck. This book adds nuance and clarifies what’s in the deck and is well worth the read for anyone thinking about company culture. (Read my takeaways from the book here) Who Recommended: Saw discussion about it on Twitter. 9. What Your Do Is Who You Are by Ben Horowitz (4.27.20) Rating: 7.5/10 Why Read it: This isn’t as good as The Hard Thing About Hard Things, so read that first if you haven’t. That said, it’s a creative way to reinvent the business case study – lesson structure of business books by talking about the leader of a prison gang, Genghis Khan, and Toussaint Louverture instead of your usual companies. There’s some good lessons in here, but probably could have been a long form essay. It also was a stretch sometimes where the lesson was a stretch when you add all the caveats around rape and violence of his leaders he highlights. Who Recommended: Was interested because of The Hard Thing About Hard Things. 10. “Delivering Happiness” by Tony Hsieh (5.7.10) Rating: 7.5/10 Why Read it: Zappos is legendary for their culture (before they made a mess with holacracy). This book highlights both the Zappos culture and Tony’s theories on what drives happiness fo"
