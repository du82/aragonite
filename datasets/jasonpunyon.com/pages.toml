["https://jasonpunyon.com/blog/2012/05/17/on-counter-offers"]
title = "On Counter Offers"
description = """
Last I left you, dear readers, I had just been given an offer to work my dream job at Stack Exchange by Joel. I accepted the offer on the spot, and went home walking on air. What do you do when you get the offer for your dream job? You go home, crack open a bottle of wine and write your resignation letter.
Achieving a dream is really liberating. I’d written a resignation letter before, but it wasn’t like this."""
full_description = "On Counter Offers May 17, 2012 Last I left you, dear readers, I had just been given an offer to work my dream job at Stack Exchange by Joel. I accepted the offer on the spot, and went home walking on air. What do you do when you get the offer for your dream job? You go home, crack open a bottle of wine and write your resignation letter. Achieving a dream is really liberating. I’d written a resignation letter before, but it wasn’t like this. Last time I was leaving one garbage job for one with promise but there was ambivalence instead of the uncontainable excitement I was feeling. I knew things were getting “better”, but still didn’t know what to expect. This time I was typing with purpose and a carefree attitude. Things were gonna be great! I know this sounds silly because resignation letters are generally a one line affair. “This is my notice that I will be leaving the company effective [notice period] from today.” I printed out three copies, signed ’em, enveloped ’em and I was ready to go in in the morning and start my new adventure. I had two bosses. So naturally I printed out three copies. One for each of my bosses and one for the #2 guy at the 1,000 person company that needed one according to the employee handbook (this would be my first interaction with him). I went in to work and boss #1 was already there. I checked the error log and made some quick fix commits while waiting for boss #2 to arrive. Boss #2 finally got there and I called them both into boss #2’s office. We sat down and I broke the news to them and the inevitable happened. They started bargaining. Boss #1: “Well, is there anything we can do to keep you around?” Me: “No. This is my dream job.” Boss #2: “What about $[2X my current salary]” BOOM. The counter offer and a doozy at that. The employer’s last resort in the face of losing a good employee. Boss #1’s eyes went a little wide, remembering that we went through bonus and raise season a few months earlier where he and I had it out over a pittance relative to the current offer on the table. B&R season at hedge funds is a harrowing time for everyone at the company. Almost all productivity stops for a month while secret incantations are spoken in back rooms by big wigs and pointy-headed bosses. The results are never transparent and rarely equitable and good people end up unhappy. This counter offer reeked of skeeze. He was trying to buy my dreams from me. When someone tells you “I’ve been given the opportunity to live my dreams, I’m leaving” the decent human thing to do is to congratulate them and send them on their way. (With a security escort out the building, of course. You don’t know what these dream heads are gonna do on the way out.) What you don’t do is tell them you think so little of them, their lives and their goals that you think can buy them off. The only thing the counter offer does is open up the possibility that the employee might take it. In my case I had a really positive reason about another company for leaving. It usually goes the other way though. The employee can have a really negative feeling about their current job, which led them to seek out new employment. Either way, the worst thing that can happen at this point is for the employee to take the counter offer. If I were to accept the completely out of whack offer on the table, the company would have successfully bought my dreams…for a little while. Eventually, the hard truth of “Holy shit, did I really just sell me and my dreams down the river for a couple extra benjamins?” would get the better of me, and I’d end up really really unhappy. Bad for me. Over time I’d become less and less productive and more and more depressed at work and now I cost them minimum twice as much. Bad for the company. The other case, where the employee is leaving because the company she’s at sucks is pretty much just as bad. The employee is so unhappy with the company that they’ve gone to the trouble of updating their resume, getting in the candidate pipeline at at least a few companies, phoners, in person interviews, second in person interviews. They’ve invested an inordinate amount of time and effort which should tell you, the company, one simple thing. It’s not them, it’s you. Again, money might paper things over for a while but the ultimate truth is, they’re not going to be the awesome employee you want. They’re going to end up just as unhappy and unproductive after the money wears off as I would’ve been had I taken it. The other thing employees have to think about with an outsize counter offer is the fact that it may just simply be a pipe dream. Companies don’t just allow their managers to get slapped around and make outrageous counter offers to people. Budgets and HR minions can’t stand that. The manager gets dinged by the higher ups because she’s “lost control”. So some of these offers are just plain “keep them in the building while we find a replacement who’ll do the job at the price we were paying.” As soon as they do that, you’ll find yourself on your ass without the cushion of the comfy offer you declined to take earlier. I didn’t miss a beat when I heard the offer, told Boss #2 “No,” and got up and left the room. There was no way I was going to let this skeezy jerk buy my dreams. NEXT PREVIOUS"
author = "Jason Punyon"
year_published = 2012
year_updated = 2012
clearnet = "https://jasonpunyon.com/blog/2012/05/17/on-counter-offers"
