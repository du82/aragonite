["https://jasonpunyon.com/blog/2012/06/22/dont-be-represented-by-contingency-recruiters"]
title = "Don't Be Represented by Contingency Recruiters"
description = "Before I faded a crazy counter offer and got my dream job I worked in finance. I was going on interviews in 2009 having been laid off from my second job after the 2008 collapse. This was back in the days when I was still using contingency recruiters to find jobs. They’re a natural fit for finding finance jobs because banks and hedge funds have money they’re willing to spend on recruiters when they aren’t swimming in it (artists rendering on the right), or spinning it into thread for their golden parachute side business."
full_description = "Don't Be Represented by Contingency Recruiters June 22, 2012 Before I faded a crazy counter offer and got my dream job I worked in finance. I was going on interviews in 2009 having been laid off from my second job after the 2008 collapse. This was back in the days when I was still using contingency recruiters to find jobs. They’re a natural fit for finding finance jobs because banks and hedge funds have money they’re willing to spend on recruiters when they aren’t swimming in it (artists rendering on the right), or spinning it into thread for their golden parachute side business. A Counter… I went on an interview and it turned out they liked me, a dubious honor in retrospect, so we continued through the process. One day my recruiter, let’s call her Nancy, phoned me up and had exciting news. Nancy had always been pulling for me. She was on my side. We’d gone through interviews at a couple of companies together already. This one liked me enough that they wanted to make me an offer at $X a year. “Great!” I thought. I took a pause and rewound to what happened the last time I was made an offer. I didn’t have a particular reason for doing so, but after I heard the offer of $Y I said “It’d be really nice if you could make that $Y+5K a year.” The guy I was talking to was the one who would go on to hire me and without a thought he said “Sure, no problem.” So going off my statistically significant set of one data point I said the same thing to Nancy. I was expecting “Hey, let me check on that for you” or even a hedged “I’m not sure where they are on the range, but I’ll find out”. Instead Nancy’s tone dropped from celebratory to agitated. “Jason, I don’t know what you’re thinking…they aren’t going to move on this. You need to take it.” This was not the Nancy who was on my side. This was Nasty Nancy, a voice and a force not to be trifled with. The exact same question provoked a totally different response. Why would she have turned on me so quickly for my inquiry, when the last person I asked had no problem with it? Incentives… There could be a million reasons, but the incentives for contingency recruiters best explain the evidence. Contingency recruiters are paid on commission when they successfully place a candidate in a job and the candidate stays for a honeymoon period of 3-6 months. The payment is a handsome ransom at 25%-35% of the candidate’s first year salary. So for a $100K job they might see $25,000 (No doubt a kingly sum for what is essentially an introduction, but that’s neither here nor there. I don’t understand it, but the market pays what the market pays). So my attempt at a counteroffer put a little wrinkle in her reward. She felt like she had a done deal and I was jeopardizing her jackpot. “The company made an offer! It’s so close and this dunderhead is screwing it up!”. She had $ChunkOfChange in her hand. If the company was fine with the counteroffer she stood to make an extra ~$1K. If they weren’t, she could end up making nothing. I’m sure it didn’t help that business was down because everyone was getting laid off after the collapse in 2008 and there was less hiring than ever going on. Faced with this situation Nancy attempted to “Close the deal” with me. She took the hard line to try and get me to just accept the offer so she could book the commission. A very similar situation comes up when you use a real estate agent to sell your house. They may not take the hard line like Nancy, but they will try to persuade you to take the deal if offerred. Real estate agents are paid the same way as recruiters, commissions for done deals. The percentages are lower (around 3% per agent) which magnifies the effect of them wanting to close the deal. The difference between $475K for your house and $500K for your house is $25K to you, an amount not to be sneezed at. The agent’s commision only goes up a mere $750 bucks though, from $14,250 to $15,000. Of course they’d much rather you take the deal than try and bargain your way up to a better price if it means they could lose everything. Turns out this was a bad idea from the start… When you’re the candidate and a recruiter is involved, my experience has been that you don’t talk to someone from the company very much aside from interviews. If you get rejected, you get rejected by the recruiter. When you get an offer you get it from the recruiter. So when it comes to a counter offer, most likely the recruiter is going to be in the middle. The problem with having the recruiter in the middle if you’re going to make a counter offer is Dual Agency. Dual Agency is a term that comes from real estate. One situation where dual agency comes up is when one entity (a single agent or two agents that work at the same broker) represents both the seller and buyer of a house in a transaction. The problem is that a real estate agent has a fiduciary responsibility to the party they represent. They can’t fulfill this obligation to two parties on opposite sides of the same transaction. One side wants to sell high, the other wants to buy low, the agent is stuck in the middle unable to fulfill their duty. Nancy doesn’t have a fiduciary obligation to anyone written in law like real estate agents do but the essence of the dual agency problem still exists. When Nancy’s services were employed by the company, Nancy became their agent. By trying to route a counter offer through her I was trying to engage her in dual agency. The employer wants to buy low, I want to sell high and Nancy’s stuck in the middle unable to effectively represent both sides. It was a bad idea from the outset. Should you not heed my advice (really…you should) and use a contingency recruiter anyway, make sure you don’t try to make a counter offer through them. I’m taking my ball… Because of the incentives at play and the problems of dual agency the goals of a contingency recruiter (close the deal at any price) simply aren’t aligned with those of a candidate seeking a job (sell my labor for the highest price). I don’t have any data to support it (I’d love to see some if you’ve got it) but I wouldn’t be surprised if candidates who choose (yes…it’s your choice) to be represented to companies by contingency recruiters end up with lower salaries than they could’ve had because of this misalignment (not to mention that giant fee the company pays). Ultimately I don’t think Nancy’s a bad person who was nefariously trying to screw me out of anything, or that she wanted to be mean to me. Getting a stack of money dangled in front of you and being threatened with getting it yanked away at the last minute is going to have an effect on someone’s behavior. Incentives matter and I don’t agree with the incentive scheme that’s been setup, so I’m just not going to play ever again. Don’t be represented by contingency recruiters. NEXT PREVIOUS"
