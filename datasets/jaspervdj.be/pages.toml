full_description = "Overview Static sites are fast, secure, easy to deploy, and manageable using version control. Hakyll is a Haskell library for generating static sites, mostly aimed at small-to-medium sites and personal blogs. It is written in a very configurable way and uses an xmonad-like DSL for configuration. Integration with pandoc gives us markdown and TeX support, including syntax highlighting and other goodies. The Hakyll System Write your content in whatever format you prefer Write your content Create compilation rules in a Haskell EDSL Write your rules Compile it to HTML and upload it! Compile it Getting Started You can get the latest version from hackage using cabal install hakyll, or using stack by using stack install hakyll. Then, you can: read the tutorials; mail the google discussion group; ask questions on the IRC channel: #hakyll on irc.libera.chat (we do not have a channel on Freenode anymore)."
