full_description = "Hi! I'm Jasper I was born in 1990, and spent most of my youth in Lokeren & Ghent, Belgium. I currently live in Zürich and write code for Fugue Snyk. Software I love Haskell because it's a lot of fun to write, and you end up with robust and maintainable software. I think PureScript is a good alternative when you're targeting the browser. Here are some things I made: 双曲番 (sōkyoku-ban): Hyperbolic Sokoban, playable in your browser patat: Terminal-based presentations using Pandoc Hakyll: A static website compiler library in Haskell stylish-haskell: a highly configurable Haskell code prettifier Beeraffe: a word mashup game Lorem Markdownum: a lorem ipsum generator for markdown A fair number of Haskell libraries and tools: websockets, psqueues, blaze-html, profiteur, ... Community Since 2017, I have organized ZuriHac, the largest Haskell community event in the world. I organized the 2021 ICFP Programming Contest. I was part of the Haskell.org committee for around 6 years. I was chair for half of that time and focused mostly on the Summer of Haskell program. When I was at Ghent university, I was heavily involved in the Zeus WPI computer club. Blog Sometimes I write things on this website. Here are some of the more interesting ones: “Lazy Layout” ‒ July 22, 2023 “Visual Arrow Syntax” ‒ March 12, 2020 “Haskell Design Patterns: The Handle Pattern” ‒ March 8, 2018 “Image Processing with Comonads” ‒ November 27, 2014 Hobbies I love skateboarding (previously downhill, now a bit of street), and I love snowboarding even more. I've been practicing street photography for a long time. Recently I did a project around Tram line 8 in Zürich. I spend a lot of time listening to audiobooks and my favorite author is probably Haruki Murakami. I have a soft spot for horror movies. I recommend everyone to watch Riget. Site proudly generated by Hakyll. The source code of this website is available on github."
