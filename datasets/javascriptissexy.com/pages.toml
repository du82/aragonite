uides are for both beginners and seasoned developers. The first study guide, which uses a book, a paid screencast, and some free online resources, teaches you how to build a sophisticated, modern social-media web application with Meteor. And the second study guide, which uses only free resources (one affordable screencast and free online resources), is just as instructive as the first, though you won’t build a specific web application throughout the course. [sc:mongodb-book] First, I give a comprehensive Meteor overview, in which I discuss just about everything you want and need to know about Meteor before you commit to investing your time and other resources in this still burgeoning though exceptional technology. Time to read the Meteor Overview: 14 minutes What You Will Learn in this Meteor Overview I explain exactly what Meteor is, how it differs from typical JavaScript frameworks, what it offers developers specifically, Read more 115 comments Like By: Richard Bovell October 9, 2014"
