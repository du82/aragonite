full_description = 'JavaScript Learn Meteor.js Properly Richard Bovell·October 9, 2014 At the end of this article, I outline two comprehensive study guides to help you learn Meteor properly. The study guides are for both beginners and seasoned developers. The first study guide, which uses a book, a paid screencast, and some free online resources, teaches you how to build a sophisticated, modern social-media web application with Meteor. And the second study guide, which uses only free resources (one affordable screencast and free online resources), is just as instructive as the first, though you won’t build a specific web application throughout the course. [sc:mongodb-book] First, I give a comprehensive Meteor overview, in which I discuss just about everything you want and need to know about Meteor before you commit to investing your time and other resources in this still burgeoning though exceptional technology. Time to read the Meteor Overview: 14 minutes What You Will Learn in this Meteor Overview I explain exactly what Meteor is, how it differs from typical JavaScript frameworks, what it offers developers specifically, its alternatives and contemporaries, whether you should be excited or skeptical about it, and where to find Meteor jobs. I also enumerate some of the endorsements written by Meteor converts, and I explore the justifiable criticisms, known limitations, and frequently asked questions that many have raised about Meteor. You will learn all this and much more. I am honored that you have joined me and I am hopeful you will find this article helpful and illuminating and the accompanying study guides and recommended resources sufficiently instructive. Read more 115 comments Like 12 Powerful JavaScript Tips Beautiful JavaScript: Easily Create Chainable (Cascading) Methods for Expressiveness Richard Bovell·August 13, 2013 (Part of the “12 Powerful JavaScript Tips” Series) Prerequisites: — Understand JavaScript’s “this” With Ease — JavaScript Objects in Detail Chaining Methods, also known as Cascading, refers to repeatedly calling one method after another on an object, in one continuous line of code. This technique abounds in jQuery and other JavaScript libraries and it is even common in some JavaScript native methods. [sc:mongodb-book] Writing code like this: $("#wrapper").fadeOut().html("Welcome, Sir").fadeIn(); or this: str.replace("k", "R").toUpperCase().substr(0,4); is not just pleasurable and convenient but also succinct and intelligible. It allows us to read code like a sentence, flowing gracefully across the page. It also frees us from the monotonous, blocky structures we usually construct. We will spend the next 20 minutes learning to create expressive code using this cascading technique. To use cascading, we have to return this (the object we want subsequent methods to operate on) in each method. Let’s quickly learn the details and get back to eating, or watching YouTube videos, or reading Hacker News, or working and browsing, or working and focusing. Let’s create all of our “chainable” code within an object, along with a local data store. Note that in a real-world app we will likely store the data in a database, but here we are just saving it in a variable. // The data store: var usersData = [ {firstName: "tommy", Read more 31 comments Like'
