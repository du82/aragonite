full_description = "Adobe AEM, also known as AEM, stands for Adobe Experience Manager. It is a comprehensive content management solution used for building websites, mobile apps, and forms. It is used to make your marketing content and assets easily manageable. AEM is based on the concepts of Apache Sling, a Java application based on OSGi using the Apache Felix engine. It is also a part of the Adobe Marketing Cloud. The architecture of AEM can be divided into the following stacks from the lowest to the highest level. A Java Platform is necessary for AEM. AEM or Adobe Experience Manager is a Java web application requiring a server-side Java Runtime Environment (JRE). It requires at least JRE 1.6 version, though JRE 1.7 is recommended for the best result. Granite is an open web stack of Adobe. It is required to form the technical foundation on which AEM is built. OSGi is a dynamic software component system for Java. In this system, an application is composed of an assemblage of components, called bundles in OSGi terminology, which can be dynamically installed, started, stopped and uninstalled at runtime, without shutting down and restarting the entire application. In a running AEM instance, bundle management is provided through the AEM Web Console at http://:/system/console/bundles. At the time of quickstart installation, the built-in CQSE servlet engine runs as a bundle within the OSGi framework. In a war file installation servlet handling is delegated to a third-party application server. AEM includes a built-in servlet engine (CQSE) which runs as a bundle within the OSGi framework when AEM is deployed via the standalone quickstart jar file. JCR stands for Java Content Repository. All the data within AEM is stored in the built-in CRX content repository, which implements the Java Content Repository Specification. All data in AEM is stored in its built-in content repository. Sling is a web application framework based on REST principles providing easy development of content-oriented applications. Sling uses a JCR repository, such as Apache Jackrabbit, or in the case of AEM, the CRX Content Repository, as its data store. AEM is built using Sling."
