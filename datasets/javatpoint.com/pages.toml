description = "1. What is the difference between population and sample? A population includes all elements from a set of data, while a sample consists of one or more observ..."
full_description = "A population includes all elements from a set of data, while a sample consists of one or more observations drawn from the population. Statistical power is the probability that a test correctly rejects a false null hypothesis (1 - beta). The p-value is the probability of obtaining test results at least as extreme as the observed results, assuming the null hypothesis is true. The CLT states that the sampling distribution of the sample mean approaches a normal distribution as the sample size becomes large. The null hypothesis is a statement that there is no effect or no difference, and it is tested to be rejected or not rejected in statistical testing. Type I error occurs when the null hypothesis is wrongly rejected, while Type II error occurs when the null hypothesis is wrongly accepted. A confidence interval is a range of values used to estimate the true value of a population parameter with a certain level of confidence. Descriptive statistics summarize and describe data, while inferential statistics use data to make predictions or inferences about a population. ANOVA (Analysis of Variance) tests for significant differences between the means of three or more groups. Correlation measures the strength and direction of a relationship between two variables, while causation indicates that one variable directly affects another. A histogram is a graphical representation of the distribution of numerical data, showing the frequency of data within certain ranges. Overfitting occurs when a model is too complex and captures noise instead of the underlying pattern, leading to poor generalization to new data. Parametric tests assume underlying statistical distributions, while non-parametric tests do not require such assumptions. Multicollinearity occurs when independent variables in a regression model are highly correlated, making it difficult to estimate individual coefficients accurately. Heteroscedasticity refers to the condition where the variance of errors is not constant across all levels of the independent variable in regression analysis."
