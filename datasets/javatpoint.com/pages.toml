full_description = "A bitcoin is a type of digital currency which can be bought, sold, and transfer between the two parties securely over the internet. It cannot be touched and seen, but it can be traded electronically. We can store it in our mobiles, computers or any other storage media as a virtual currency. Bitcoin can store values much like fine gold, silver, and some other type of investments. It can be used to buy products and services as well as make payments and exchange values electronically. It is the most popular cryptocurrency in the world. Bitcoin mining is performed by bitcoin miners(a group of people). The procedure of bitcoin mining is done by specialized computers equipped for solving algorithmic equations. Miners achieve bitcoin mining by solving a computational problem which makes the chain of blocks of transactions. These specialized computers help miners to authenticate the block of transaction held within each bitcoin network. Whenever a new block added into the blockchain, immediately miners get rewards for this new block. The miners get rewards in bitcoin along with transaction fees. Bitcoin was invented by an unknown person Satoshi Nakamoto in the year 2008. But there is no valid proof for this because the person behind bitcoin has never given an interview. It was released as open-source software in 2009. It was the first successful virtual currency designed with faith and equivalent to authorized currency of centralized government. It is a digital currency that uses rules of cryptography for regulation and generation of units of currency. It is commonly called decentralized digital currency. Bitcoin is not a company, so no one can govern the Bitcoin. Bitcoin is decentralized digital money that is issued and managed without any centralized authority. It is created as a reward in a competition in which miners who own the specialized computer offer their computing power to verify and generate new Bitcoins. They are also responsible for maintaining the security of the network into the blockchain. The activity of creating a bitcoin is known as mining, and every successful miner gets a reward with newly created bitcoins and transaction fees."
