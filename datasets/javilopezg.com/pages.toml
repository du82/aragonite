title = "diciembre 2012 - Javi López G."
description = "Gestiono equipos, proyectos y productos tecnológicos.  Aporto soluciones creativas a grandes problemas, mezclando las metodologías y tecnologías más modernas."
full_description = "Hacer los deberes Decía el otro día Carlos Blanco en una conferencia que por norma general los emprendedores no hacemos los deberes. Pero… ¿qué es ésto de hacer los deberes? Seguir leyendo en GPMESS. Autor Javi López G.Publicado el 2012-12-272017-05-10Categorías Español, GPMESSEtiquetas Corporativo¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva) ¿Cuál es tu nombre? El proceso de elegir tu marca distintiva Hace no mucho os conté que nos habíamos dado de alta oficialmente, pero hay algo en lo que no os fijasteis todos y que me han preguntado algunas personas. No os fijasteis en que no dije cuál era el nombre de la empresa. Sí, seguro que la mayoría daréis por hecho que es gpmess, pero os equivocáis. Seguir leyendo en GPMESS. Autor Javi López G.Publicado el 2012-12-202017-05-10Categorías Español, GPMESSEtiquetas Corporativo¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva) ¿Qué hay por detrás? Pinceladas de nuestro backend No, no os penséis que ha habido un golpe de estado, y los tecnólogos frikis nos hemos hecho con el poder de las comunicaciones en la empresa, pero ya iba siendo hora de hablar de temas “divertidos” para el pequeño grupo de developers que hay suelto por el mundo. Eso sí, no voy a profundizar mucho, para que a la gente “normal” no le explote la cabeza (y para poder pasar la censura, claro, claro). Seguir leyendo en GPMESS. Autor Javi López G.Publicado el 2012-12-112017-05-10Categorías Español, GPMESSEtiquetas desarrollo¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva)"
