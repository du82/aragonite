["https://javilopezg.com/2007/04"]
title = "abril 2007 - Javi López G."
description = "Gestiono equipos, proyectos y productos tecnológicos.  Aporto soluciones creativas a grandes problemas, mezclando las metodologías y tecnologías más modernas."
full_description = 'Google me gana He visto un post en google.dirson que me ha recordado una de esas tantas cosas que deje a medio empezar. Cuando tuve mis primeros y únicos contactos con ajax, me dije «Hostia tu!!», y despues de eso pensando en lo simple y potente que era, se me ocurrió que se podía usar un servicio simple , gratuito y con capacidad (+ o -) ilimitada (por ej. blogger) para obtener un servicio complejo. Sin liarlo mas, lo que pense es en hacerme una cuenta-blog de frases, hacer que en su portada solo se mostrase una entrada, y mostrarla como cita en este blog usando ajax, de tal modo que siempre mostrara la última que yo metiese en ese blog, sin tener que cambiar nada, solo agregando una entrada. Realicé varios intentos, y llegué a la conclusión (por los resultados y lo visto en busquedas) de que no se puede solicitar la pagina desde fuera de la dirección que contiene el blog, por ejemplo, esta página sólo puede ser cargada solicitada desde dirección de cerocoma.blogspto.com. Para nada se me ocurrió hacerlo con el atom. Ahora gracias a la nueva API de Google con unas pocas lineas (estan al principio del codigo de la página, si eso mañana ya lo actualizo poniendo el código) he podido incluir una frase aleatoria. La unica pega, es como dice en dirson, que en realidad el feed que se carga es el último que visitaron las arañas de google, por esto ahora (04:53) se ven las frases que tenía antes de prueba. Cuando se actualicen mirare a ver como formateo las nuevas, porque las he puesto entre etiquetas blocquote, y me suena que esa la tengo formateada en el css. Por lo tanto se hace un poco pesado esperar a que se actualice para ver como queda y modificarlo o no. Ahora a pensar para que mas se puede aprovechar, quizá, para tener todos los codigos ordenados en otro blog, y incluirlos en este, o algo así. Ya veremos… (al final acabaré sin hacer nada mas) En realidad la idea primigenia era que cerocoma fuese solo una pagina de presentación, sin entradas, y tener un conjunto de subblogs (citas, entradas, códigos, etc.) en las que el contenido de la entrada es xml para así dejar el tema del formato directamente a cerocoma, y que el formato pueda cambiar sin tener que modificar todos los contenidos. Por ejemplo, como está ahora montado lo de las frases, estoy cambiando el código directamente en esas entradas, y haciendolo bien, ahi tendría un texto etiquetado con xml: la cita con «texto-cita» y la parte que alineo a la derecha con «autoria», por ejemplo. Sin embargo, no basta con usar el feed que se genera automáticamente, ya que está limitado a las últimas 25 entradas. Por esto habría que jugar con los valores que se le pueden pasar, usando urls del tipo: http://cerocoma.blogspot.com/feeds/posts/default?start-index=1&max-results=100000 , o http://cerocoma.blogspot.com/feeds/posts/default/113760076829500765 para cuando queramos una entrada específica no tener que cargar todas y buscarla, si no que podamos cargar solo los datos que necesitemos. Otra cosa a pensar es como relacionar las entradas de uno y otro blog, ya que un código en principio lo vas a querer siempre relacionado con la entrada que lo explica. Tal vez para esto puedan usarse etiquetas del tipo «paramtro:valor» para despues separarlo y utilizar el valor, o simplemente en el xml, pero la pega es que para relacionar con un post concreto, tienes que haberlo creado para saber su identificador, que hasta donde se, se asigna automáticamente, y no hay manera de conocerlo a partir de algun otro dato. Tal vez se pueda sacar un feed con sólo los titulos de las entradas para poder buscar entre ellos, sin cargar lo gordo, que serían los cuerpos de las entradas. Ya pensaré en ello cuando tenga tiempo (y de eso estoy mal, que ahora a parte de currar se acerca el viña). Bueno, la idea es clara, puede que al final no la acabe llevando a cabo por que soy un aragán, pero sería tener un blog con cada tipo de contenido a mostrar en el blog, elaborar estos contenidos de forma bien estructurada con xml, y hacer que el blog principal formatee estos contenidos como queramos. Esto nos permitirá crearlas funcionalidades que queramos, como un buscador propio que se ejecuta en el navegador cliente y cosas así. Aquí os dejo el código que he empleado para las frases aleatorias. Es muy simple, y similar a los ejemplos que hay en dirson o en google: //esta función la he sacado literalmente de una página de por ahi function aleatorio(inferior,superior){ numPosibilidades = superior - inferior aleat = Math.random() * numPosibilidades aleat = Math.round(aleat) return parseInt(inferior) + aleat } google.load("feeds", "1"); function initialize() { var feed = new google.feeds.Feed("http://frases-cerocoma.blogspot.com/atom.xml"); feed.load(function(result) { //Valor por defecto por si ocurre un error que no se quede en blanco var texto = "Todo conocer depende de la estructura que conoce."; var container = document.getElementById("citaAleatoria"); if (!result.error) { var i = aleatorio(1,result.feed.entries.length); var entry = result.feed.entries[i]; texto = entry.content; } container.innerHTML = texto; }); } google.setOnLoadCallback(initialize); Otra cosa sería cambiar el código de los otros blogs para que cuando se acceda a uno de ellos, se redireccione al principal, pero tendría que aportarle alguna información de algun modo, para cargar la información que el usuario va a querer. Actualización: 21/04/07 ~12:00 Autor Javi López G.Publicado el 2007-04-212017-05-10Categorías Cerocoma, EspañolEtiquetas Ajax, citas, Google¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva)'
