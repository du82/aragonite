title = "enero 2007 - Javi López G."
description = "Gestiono equipos, proyectos y productos tecnológicos.  Aporto soluciones creativas a grandes problemas, mezclando las metodologías y tecnologías más modernas."
full_description = "Nokia N70 Pos si, me lo he regalado de reyes, que me apetecía cambiar. Además aproveche para abandonar telefónica, que estaba un poco jartao de sus tarifas, de su trato y de todo. Lo peor era lo de los horarios, no puedo estar pensando que si llamo antes de las X me van a cobrar tres veces mas. Así que me he pasao a Yoigo, y me he pillao el N70. No es que sea un movil barato, pero si no te va a durar 2 dias (por robo o perdida), no esta tan mal de precio. Si lo vas a tener 2 años por ejemplo, sale a menos de 4 euros al mes… Yoigo, pos bueno, las tarifas no son macro económicas, pero no estan tan mal, y no tiene horarios. Con el movil estoy contentisimo, y eso que solo lo llevo usando 2 dias, pero saca fotos bombas, tiene flash, videos bien tambien, symbian (puedes meter un programa de lo que quieras, incluso podrías hacertelo tu mismo), la batería no parece durar poquisimo tampoco, que anoche he estado tirando fotos y videos y con musica y enredando con él todo el rato y aun tiene todas las rayas. Además con la tarifa de datos de yoigo, de maximo 1,2 € al día, pos ya me dirás que chollo. Ademas no va nada mal de velocidad, que el otro dia me conecte con el portatil a traves del movil para probarlo, y iba a 460 kilobits o por ahi, que para conectarte de vez en cuando esta mas que bien… Tiene algunas cosas malas, pero que en realidad no son tan malas. No se le puede decir de primeras que bloquue el teclado solo, pero te metes en softonic y encuentras programas gratuitos que lo hacen. Tarda un poco en arrancar, comparado al movil que tenía antes, pero la verdad es que despues las aplicaciones se ejecutan a una velocidad bastante buena (mejor que en el pentium 150 que tuve). Parece que cuando se le carga la memoria hace alguna cosilla rara, ayer despues de mucho enredar al deslizar la tapa no cargaba la aplicacion de la cámara, pero no estaba roto porque se desbloqueaba y bloqueaba el teclado, así que supuse que lo que pasaba es que tardaba o algo por tener la memoria llena, lo apague y lo encendi y ya funcionaba de lujo. Otra pega es que la aplicacion deel pcsuite de nokia que viene para administrar las aplicaciones no funciona con este movil, asi que tengo que quitar las aplicaciones a mano, pero bueno, así cuando halla metido mucha mierda borro la tarjeta entera y restauro la copia de la original y listo. Si, la original, porque viene una de 64 MB, que viene con la mitad llena de aplicaciones, así que no vale pa na. Yo al menos me he ido a las rebajas de boulanguer, y por 30 eurucos tenia una de 1 GB, que me da mucho mas de si. Aun no he podido probar todo todo, pero en general estoy contentisimo. Quiero meterle algun navegador gratuito o pirateao (no voy a pagar por algo que no se si me va a ser muy util) para conectarlo a un receptor gps que tengo por ahi, tambien quiero mirar algo del symbian este, para ver como funciona, y que herramientas hay para programar para el, y enterarme de como va lo del pulsar-para-hablar (pph) o push-to-talk (ptt) en ingles, que el movil viene preparado para ello, y si es como creo que es, con un servidor libre bastaría. Pensaba que era un servicio de la operadora, pero por lo que he leido, el movil graba la voz y la manda por internet a los contactos y/o grupos. Ademas en donde se configura esa aplicación te deja seleccionar una de las conexiones que tienes en el movil (para conectarse), un servidor (para pasarle el mensaje a unos u otros), y un nombre de usuario y contraseña (para autentificarse en el servidor), así que si no hay algo mas que se que se me escapa, bastaria con un servidor que permita registrarse a cualquiera, y un movil preparado para usarlo, barstaría. Es mas por curiosidad que otra cosa, que que yo sepa pocos o ninguno de mis amigos tiene un movil con pph,pero quiero saber si aqui no se usa eso por desinformación, o por que de verdad la operadora tiene que proveerte algún servicio. Bueno, y no me lio mas, que ya estoy soltando mucha parrafada pa decir que me mola el movil, que he hecho una compra de pm y se lo recomiendo a todo el mundo. Voy a darme una vuelta por /. a ver si alguien sabe de algo del pph y a descansar del fin de semana, que mañana hay que currelar. un saludo Autor Javi López G.Publicado el 2007-01-142017-05-10Categorías Cerocoma, Español¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva)"
