["https://javilopezg.com/2006/02"]
title = "febrero 2006 - Javi López G."
description = "Gestiono equipos, proyectos y productos tecnológicos.  Aporto soluciones creativas a grandes problemas, mezclando las metodologías y tecnologías más modernas."
full_description = '''Haskell Haskell es un «lenguaje funcional puro». Mi contacto con el se a basado, solamente, en el empleo de este para la practica de una asignatura. Mientras espero las notas, para poder pedir el titulo y buscarme la vida por fin (ya se que ya podría haberlo hecho, pero «como estudiando no se vive»), a vosotros (quienes seais los que leeis esto) os toca agunatar mis ratos ocioso. La cosa es que el lenguaje me gustó, sencillo, facil de aprender (al menos lo básico), … Incluso me dió la sensación de que si le pones delante a alguien que no sepa nada de programación este lenguaje, y otro imperativo u orientado a objetos (que son los que se llevan), si había estudiado matematicas en el colegio, le sería mas facil de aprender este que los otros. Lo poco que yo he leido no es nada complicado, pero trata (mas o menos) todos los temas necesarios, excepto las monadas, que deben ser un poco paranoicas (si leo algo donde lo expliquen bien ya os lo pasare 😉 que se usan para entrada salida y cosas así. Creo que están basadas en teoria de enteros, pero no me hagais mucho caso. Las principales caracteristicas de este lenguaje son: la evaluacion perezosa, que las funciones son un elemento más, definicion parcial, aparte de otras típicas de muchos lenguajes como puede ser la no necesidad de declaración de tipos (seguro que me dejo mucho en el tintero, esto es lo que me viene ahora a la mente). Evaluación perezosa significa, que sólo evalua lo que necesita evaluar, lo que permite el uso de estructuras potencialmente infinitas, y la no restricción de los tipos de los elementos. Por ejemplo el tipo Integer es el de todos los enteros (y cuando digo todos es TODOS), elinterprete o el compilador (hay mas) se encargan de los bits, sin tener que preocuparnos de ir a usar un entero demasiado grande. Otro ejemplo, es que [1..] es la lista de todos los naturales (nuevamente TODOS), el sistema se encarga de generar los que necesite. Que las funciones sean un elemento mas, implica que se pueden almacenar o pasar como parametro, como cualquier otro dato. Esto hace que no nos tengamos que preocupar de pasarlas como punteros. Además se iguala al sistema que usamos en matematicas ya que podemos resolver un problema para x, sin preocuparnos (en general) de que es x, y cuando tenemos la solución sustituirla por lo que queramos. La definicion parcial nos permite definir facilmente funciones en función (valga la redundancia) de otras funciones, asignando valores a los parametros que tengamos, y dejando para la llamada a la nueva función el reto. Como ya he dicho, es un lenguaje facil de entender (una vez que se entiende ;), que facilita una implementación rápida, y que para (hasta donde se) ser un «lenguaje de laboratorio» tiene bastanteslibrerias de todo tipo y herramientas, alguna que permite integrar librerias de c en los programas haskell, e incluso hay quien a integrado haskell en programas .NET. {-RESUMEN DE FUNCIONES-} {- Las que funcionan en hugs tal cual carga, sin añadir nada: Hugs session for: /usr/lib/hugs/libraries/Hugs/Prelude.hs /usr/lib/hugs/libraries/Prelude.hs /usr/lib/hugs/libraries/Hugs/Base.hs Paquetes instalados: hugs libhugs-http libhugs-hunit libhugs-missingh Algunas cosas funcionan diferente (reinstale todo el sistema, asi que seran paquetes mas actuales) de cuando hice la practica. Por ejemplo, al hacer la practica para hacer la raiz de dos, primero tenia que pasarlo a real. Ahora no es necesario. -} {-FOKKER y las que he ido recordando sobre la marcha-} -- sqrt x = Raiz cuadrada de x raizDe2= sqrt 2 -- sin x = Seno de x {- Se le pasan radianes, asi que sin 90 da 0.98..., y sin (pi/2) da 1.0-} senoDe90 = sin 90 senoDePiMedios = sin (pi/2) -- cos x = Coseno de x cosenoDePi = cos (pi) -- sum l = Suma de los elementos de l sumaDe1a10 = sum [1..10] -- length l = Nº de elementos de l longitudDe1a10 = length [1..10] -- reverse l = Devuelve l al reves de10a1 = reverse [1..10] -- product l = Multiplica los elementos de l factorialDe3 = product [1..3] -- pi = numero pi con 14 decimales piCon14 = pi -- abs x = valor absoluto de x tres = abs (-3) -- signum x = el signo de x o 0 si es 0 menos1 = signum (-3) -- gcd x y = El maximo comun divisor de x e y dos = gcd 4 6 -- log x = logaritmo neperiano de x cero = log 1 -- exp x = exponencial de x (e^x) e = exp 1 -- fromInteger x = Pasa x a cual quier tipo numerico que necesites {- Como comento arriba al hacer la practica para hacer la raiz cuadrada de un entero x, necesitaba hacer (sqrt.fromInteger) x. Ahora, supongo que por actualización de algun paquete, no es necesario. El tipo de la funcion es: fromInteger :: Num a => Integer -> a -} uno:: Float uno = fromInteger 1 -- round x = Redondea x al entero mas cercano seis = round 5.5 -- floor x = redondea al entero mas pequeño cinco = floor 5.5 menos6 = floor (-5.5) -- even x = True si x es par falso = even 7 -- odd x = True si x es impar verdadero = odd 7 -- null l = si una lista esta vacia vaciaMasVacia = null ([]++[]) -- and l = hace && con los elementos de la lista f = and [True, False, True] -- or l = hace || con los elementos de la lista v = or [True, False, True] -- take n l = los primeros n elementos de l unoA3 = take 3 [1..10] -- drop n l = l sin los primeros n elementos de4a10 = drop 3 [1..10] -- map f l = aplica la funcion f a todos los elementos de l de2a4 = map (+1) [1..3] -- head l = primer elemento de l el1 = head [1..10] -- tail l = todo menos el primer elemento de l de2a10 = tail [1..10] -- error c = devuelve la cadena c en vez del valor de la funcion convierteEn5 x | x==5 = error "Ya es 5" | otherwise = 5 yaEs5 = convierteEn5 5 -- show x = cadena para mostrar por pantalla {-Si un tipo no tiene una funcion show, hay que poner la opcion de hugs -u para que no pite-} valorDe x | x/=7 = "el numero es "++(show x) | otherwise = "el numero es 7" elNumeroEs8 = valorDe 8 -- infix n o = define el operador o con prioridad n y como no asociativo -- infixr n o = define el operador o con prioridad n y asociativo por la derecha -- infixl n o = define el operador o con prioridad n y asociativo por la izquierda {-Si no te acuerdas de la asociatividad o prioridad de un operador, pon parentesis, mas vale pasarse de parentesis, que equivocarse en lo otro-} x ++++ y = (x+1, y+1) infixl 1 ++++ tresY4 = 2 ++++ 3 -- filter c l = devuelve una lista con los elementos de l que cumplen c impares = filter odd [1..10] -- foldr o b l = Aplica el operador o a la lista l teniendo de caso base (colocando a la derecha) b {-El caso base debe ser del tipo que devuelve la funcion: menoresDe10 = foldr (<) 10 [1..9] no vale-} concatenada = foldr (++) [] ["con","ca","te","na","da"] -- foldl o p l = Aplica el operador o a la lista l teniendo de primer elemento (colocando a la izquierda) p {-Generalmente el caso base, o el primer elemento suelen ser el elemento neutro para esa funcion, de tal modo que si la lista solo tiene un elemento pueda aplicar la funcion, y si no tiene elementos devuelve el elemento neutro-} concatenadaTb = foldl (++) [] ["con","ca","te","na","da","Tb"] -- until c f x = aplica la funcion f a x HASTA que cumpla la condicion c quince = until (10<=) (\x->x+x+1) 0 -- rem a b = resto de la division entera entre a y b manteniendo el signo {- Tambien existe mod pero es un poco distinto-} menos7 = -27 `rem` 10 -- quot a b = division entera de a entre b {- Tambien existe div, pero es un poco distinto-} menos2 = -27 `quot` 10 {-mod y div dan el mismo valor que quot y rem excepto cuando el signo del resto es contrario al signo del denominador. En ese caso usando mod y div al cociente se le suma -1 y al resto se le suma el denominador. Están definidas así: n `quot` d = q where (q,r) = quotRem n d n `rem` d = r where (q,r) = quotRem n d n `div` d = q where (q,r) = divMod n d n `mod` d = r where (q,r) = divMod n d divMod n d = if signum r == - signum d then (q-1, r+d) else qr where qr@(q,r) = quotRem n d En general se deberia usar siempre quot y rem. En alguno de los apuntes habia leido que rem era como mod, pero que mod mantenia el signo y rem no, casi siempre he usado mod, y en algun ejercicio he tenido problemas yno sabia porque. -} -- [] = lista vacia -- (:) a l = pone el elemento a al inicio de la lista l -- (++) l1 l2 = concatena la lista 1 con la 2 de1a7 = 1:2:[3,4]++(5:6:7:[]) -- .. = en la definicion de una lista es algo asi como incremento hasta, pudiendose omitir el hasta. {-Si se omite el hasta se iran añadiendo elementos mientras se pidan, si no se especifica, el incremento es 1. El hasta no es hasta que sea igual a ese valor, si no hasta que se sobrepase. Algunos ejemplos: -} cincoA7 = [5..7] --[5,6,7] cincoAinf = [5..] --[5,6,7,...] deMediosHasta6 = [2.5..6] --[2.5,3.5,4.5,5.5,6.5] de3en3 = [1,4..10] --[1,4,7,10] deMedioEnMedio = [3.5,4..6] --[3.5,4.0,4.5,5.0,5.5,6.0] cerosInf = [0,0..3] -- [0,0,0,0,...] --concat ll = concatena las listas contenidas en la lista de listas ll concatenadaMasAun = concat ["con","ca","te","na","da","Mas","A","un"] --init x = x sin el ultimo elemento hol = init "hola" -- last x = el ultimo elemento de x a = last "hola" -- (!!) l n = devuelve el elemento n de la lista l siendo el primero el 0 l = "hola" !! 2 --elem x l = True si x es elemento de la lista l false = 'j' `elem`"Jhon F. Keneddy" --notElem x l = False si x es elemento de la lista l true = 'j' `notElem` "Jhon F. Keneddy" --takeWhile c l = devuelve los elementos de l mientras cumplan la condicion c --dropWhile c l = devuelve los elementos de l desde el ultimo que cumple la condicion c tupla = (takeWhile c l, dropWhile c l) where l = "tupla" c = ('l'/=) --splitAt n l = separa en dos listas a partir del elemento n {-Lo mismo que hacer un take y un drop pero mas eficiente-} tuplas = splitAt 3 "tuplas" --span c l = separa en dos listas desde el ultimo que cumple la condicion {- Lo mismo que hacer un takeWhile y un dropWhile pero mas eficiente-} masTuplas = span (/='T') "masTuplas" -- words c = separa la cadena c por los espacios holaMas = words "hola Mas" --["hola","Mas"] -- unwords l = Une las cadenas de la lista poniendo como separador espacios en una sola cadena masHola = unwords ["mas","Hola"] --"mas Hola" --lines c = separa por los caracteres de salto de linea '\n' {-Ojo, "esto\nno\nson\nvarias\nlineas"-} lineas = "esto"++('\n':"Son")++('\n':"Lineas") estoSonLineas = lines lineas --unlines l = Une las cadenas de l usando '\n' como separador tBestoSonLineas = "tB"++('\n':(unlines estoSonLineas)) --repeat x = crea una lista infinita en el que todos los elementos son x masCerosInf = repeat 0 --iterate f x = Crea una lista infinita con los resultados de aplicar f a x recursivamente hombres = iterate (\x->x++x) " O-|-< " --zip l1 l2 = devuelve una lista de tuplas que contienen los elementos de l1 y de l2 {-Si las listas no son de igual tamaño se descha el resto de la grande-} numera = zip [1..] estoSonLineas --zipWith f l1 l2=Devuelve una lista de los elementos de 1 y 2 combinados mediante f numeraLineas = zipWith (\x y-> (show x)++(' ':y)++['\n']) [1..] estoSonLineas --curry f = devuelve una funcion que hace lo mismo que f pero de forma currificada {- Currificada quiere decir que recibe los parametros separados, si no los recibe juntos en una tupla-} algo (x,y) | x==1 = 200 | y==0 = 100 | True = 0 doscientos = curry algo 1 0 --uncurry f = devuelve una funcion que hace lo mismo que f pero toma los parametros en una tupla (un solo parametro) cincuentaY3 = uncurry (+) (47, 6) {-PEÑA MARÍ-} --all c l = True si todos los elementos de l cumplen la condicion c mayoresQue0 = all (>0) [1..10] --any c l = True si algun elemento de l cumple la condicion c algun0 = any (0==) [0..5] --id x= Devuelve x diHola = id "diHola" {-LABRA-} --negate x= Devuelve x negado (-x) menos8 = negate 8 -- lcm x y = Devuelve el minimo comun multiplo de x e y veintiuno = lcm 3 7 -- tan x = tangente de x (en radianes) unoDouble = tan (pi/4) --atan x= arco que tiene tangente x (en radianes) grados45 = 180*(atan 1)/pi -- asin x = arco que tiene seno x (en radianes) grados90 = 180*(asin 1)/pi -- cos x = arco que tiene coseno x (radianes) double0 = acos 1 -- fromEnum x = el entero asociado a x en "la enumeracion" {-x tiene que pertenecer a la clase Enum-} sesentaY5 = fromEnum 'A' -- toEnum x =devuelve el elemento x de "la enumeracion" aMayuscula :: Char aMayuscula = toEnum 65 -- |x<- = Se usa para definir listas {- La ultima variable crece mas rapido que la anterior, y así sucesivamente. Una variable puede estar en funcion de las anteriores nunca que las posteriores. Tambien se puden poner condiciones.-} variasTuplas :: [(Int, Int, Char)] variasTuplas = [(x,y,z) | x<-[1..5] , y<-[1..x], z<-[toEnum(65)..toEnum(65+x+y)],x<3,z/='C'] --[(1,1,'A'),(1,1,'B'),(2,1,'A'),(2,1,'B'),(2,1,'D'),(2,2,'A'),(2,2,'B'),(2,2,'D'),(2,2,'E')] --flip f a b = cambia el orden de sus parametros a f b a {-Es la que se usa cuando iniciamos una funcion parcialmente con el operando a la derecha, como (+2) (*2) (/2)-} dos'5 = (flip (/)) 2 5 -- type Para crear sinonimos de tipos: type String = [Char] -- data Para crear verdaderos nuevos tipos: data Pila a= PilaVacia |P (a Pila) Un saludo, espero que esto os anime a echarle un vistazo al haskell. PD: Parece que en la universidad de málaga se explica un poco lo que son las monadas, pero aun no me lo he leido. Ya os diré. Autor Javi López G.Publicado el 2006-02-282017-05-10Categorías Cerocoma, Español¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva)'''
