full_description = "Historia de Azure No, no os voy a contar un cuento. Esta “historia” es más “history” que “story”, aunque como toda historia está influenciada por quien la cuenta. La cuestión es que pensaba comenzar a dar la murga con Azure (aprovechando que estoy trabajando con ello otra vez), y unos días en Edimburgo me han hecho reflexionar que a veces las cosas se entienden mejor si conoces su historia. Por tanto voy a intentar contaros la historia de Azure tal y como yo la recuerdo. Seguir leyendo en CantabriaTIC. Autor Javi López G.Publicado el 2015-11-262017-11-21Categorías CantabriaTIC, Español, Gestión, TecnologíaEtiquetas Tecnologías Microsoft¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva) Resumen evento #DevOpsAzureDay El jueves pasado asistí al evento DevOps Azure Day en las instalaciones de Microsoft. Fue un evento en el que se trató mucho de la relación actual entre Microsoft y el Software Libre, del perfil de DevOps, de integración continua, de microservicios y, por supuesto, de Azure. Os dejo algunas notas sobre las cosas que comentaron los ponentes: Seguir leyendo en CantabriaTIC. Autor Javi López G.Publicado el 2015-11-172017-11-21Categorías CantabriaTIC, Español, TecnologíaEtiquetas Reportajes¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva) Resumen del evento WordCamp Cantabria Si no me equivoco, nadie por estos lares anunció el evento WordCamp Cantabria. Mi excusa es que cuando empecé a publicar ya no quedaban entradas y es que, a diferencia de muchos eventos, este no es de cuantos más mejor. Solo 200 entradas para que 200 participantes compartieran y aprendieran unos de otros. Seguir leyendo en CantabriaTIC. Autor Javi López G.Publicado el 2015-11-102017-11-21Categorías CantabriaTIC, Español, TecnologíaEtiquetas Desarrollo Web, Reportajes, WordPress¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva)"
