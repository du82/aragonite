title = "Páginas curiosas - Javi López G."
description = 'La metapágina La metapágina es una página que contiene enlaces a otras páginas útiles o curiosas que me gusta tener a mano cual navaja suiza, pues nunca sabes cuándo las vas a necesitar. Están «catalogadas» como utilidades, ocio y cosas raras. Daily Games Es una web que recoge un montón de juegos a los que … Continuar leyendo "Páginas curiosas"'
full_description = "Páginas curiosas La metapágina La metapágina es una página que contiene enlaces a otras páginas útiles o curiosas que me gusta tener a mano cual navaja suiza, pues nunca sabes cuándo las vas a necesitar. Están «catalogadas» como utilidades, ocio y cosas raras. Daily Games Es una web que recoge un montón de juegos a los que puedes jugar sólo una vez al día Tiene muchas variantes del Wordle, pero también otros juegos que no tienen nada que ver con este como Sudokus, el Panal o el Figure. Site-Shot Una web que permite tomar capturas de otras web Puedes cambiar la resolución, el formato y otros parámetros. El resultado es como las capturas que estás viendo ahora mismo. También tiene una API por si quieres automatizar el proceso. RealState – Cercalia 3D API Una app que permite ver la incidencia del sol en los edificios Es ideal para cuando estás valorando comprar o alquilar una vivienda u oficina. Permite ver como da el sol (y la sombra) en los edificios a cualquier hora de cualquier día, con lo que te puedes hacer una idea de como de luminoso y caluroso puede ser un habitáculo. Tiny Wow Un set de herramientas online para resolver cualquier problema puntual que te surja Puedes hacer de todo online a archivos PDF, imágenes, vídeos, documentos de Office, ebooks… HTTP Cats Los códigos de respuesta HTTP en gatos Simplemente muestra imágenes de gatos para cada código HTTP. OSM Haiku Un mapa que escribe Haikus Este mapa basado en Open Street Maps escribe Haikus a partir de la ubicación que está mostrando. Nombres de recién nacidos Un listado de los nombres más usados en España cada año Este es uno de los mejores regalos que le puedes hacer a unos futuros padres. Gracias a él podrán evitar que su descendencia vaya a clase con otras 5 personitas que se llamen del mismo modo. Recambios para coches Herramienta para saber los datos de un coche en función de su matrícula ¿Te ha pasado que quieras saber el modelo exacto de un coche? ¿O de qué año es? ¿Has necesitado completar una matrícula de la que te falta una letra o un número? Hay muchas páginas que te dan los datos de un coche a partir de una matrícula, pero las mejores son las de piezas y recambios online ya que les interesa funcionar bien para vender más. Lorca Editor Un editor de texto online sencillo y súperpotente Este editor de texto corrige no sólo la ortografía y la gramática, sino también el estilo con indicaciones muy claras de cómo mejorar la legibilidad de nuestros textos en castellano. REIAC Base de datos de chips para perros de España Te encuentras a un perro perdido, lo llevas al veterinario, leen el chip y ¡no lo encuentran en la base de datos! La mayoría sólo buscan en la autonómica porque no saben que existe la posibilidad de buscar a nivel nacional. Incluso si no fuese español, se puede buscar en la base de datos que enlaza a nivel europeo. BC SRT to ASS Coversor de formato de archivo SRT a ASS Los archivos SRT de subtítulos no tienen formato, y en ocasiones necesitas un archivo de subtítulos con formato. Este conversor te ayuda en la tarea. Si no te gusta el formato que trae por defecto puedes retocarlo a tu gusto: Style: Default,Arial,10,&H00FFFFFF,&H0300FFFF,&H00000000,&H02000000,0,0,0,0,100,100,0,0,1,2,1,2,10,10,40,1"
