full_description = "AARRR: las 5 claves del éxito Aarrr, aarrr, aarrr. No, no me he transformado en un pirata cojo con pata de palo, con parche en el ojo y con cara de malo. Tampoco es que os vaya a hablar del entrañable personaje de los Simpsons que huele a pescadilla y tiene un ojo de cristal. Estas son las siglas que acuñó en su presentación “Metrics for pirates” Dave McClure, a quien conocerán de otras presentaciones como “I’m the fucking founder of ‘500 Startups’” o “Don’t trust me and trust in magic viral growth y verás cómo te va”. Seguir leyendo en GPMESS. Autor Javi López G.Publicado el 2014-07-312017-05-10Categorías Español, GPMESSEtiquetas Corporativo2 comentarios en AARRR: las 5 claves del éxito¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva) Estuvimos en el Keiretsu Forum Hemos tenido la suerte de poder presentar GPMESS tanto en Keiretsu Madrid, como en Keiretsu Barcelona, y quiero contaros cómo fue la experiencia ya que tampoco es que haya demasiada información por ahí publicada. Seguir leyendo en GPMESS. Autor Javi López G.Publicado el 2014-07-242017-05-10Categorías Español, GPMESSEtiquetas Corporativo¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva) Yo Yo, y no me refiero a mí, me refiero a Yo. Yo es una app de esas que están de moda y “nadie” sabe por qué. Como hicimos recientemente con Secret, intentemos entre todos averiguar cuál es el factor de éxito de Yo. Seguir leyendo en GPMESS. Autor Javi López G.Publicado el 2014-07-172017-05-10Categorías Español, GPMESSEtiquetas Usuarios¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva)"
