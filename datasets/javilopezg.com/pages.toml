full_description = "3 links about email design Email design differs from web design because the result is not going to be shown in a web browser. Your design is going to be shown in an app: a desktop app, a mobile app, or a web app (like gmail.com or outlook.com). For this reason, the user interaction is different and the elements of HTML and CSS that you can use in your design are not the same. If you have to design an email, you can be inspired by others’ designs.And you can use a specific editor.But you always have to keep in mind the restrictions of the different apps that are going to show your email. Autor Javi López G.Publicado el 2020-06-182020-06-06Categorías 3 links, EnglishEtiquetas design, editor, email, example, Gmail, outlook, template, templatesDeja un comentario en 3 links about email design¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva) 3 links about AARRR AARRR, also known as The Pirate Metrics or The Pirate Framework, is the acronym for Acquisition, Activation, Retention, Referral, and Revenue. They are the simplest metrics that you have to consider in your funnel when going to build a business. If you can read Spanish you could read my very own explanation about AARRR. There, you can also see Dave McClure’s speech (in English) who is the originator of this.As they are simple metrics you don’t need a complex system to analyze them. You can use a single page canvas.The theory is great but, how you can improve those metrics? There are several tools for each phase. Autor Javi López G.Publicado el 2020-06-112020-05-24Categorías 3 links, EnglishEtiquetas AARRR, Acquisition, Activation, Dave McClure, referral, Retention, Revenue, toolsDeja un comenta