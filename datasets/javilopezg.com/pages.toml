full_description = "Graffitis – Las calles hablan Pensaba yo que ya os había hablado de lo que me gustan los graffitis y lo que me llaman la atención artistas que no son considerados artistas por todo el mundo como el gran Banksy, pero Google me ha aclarado que sólo fue una ensoñación. Así que aprovecho que ha pasado por mi pantalla el documental “Las calles hablan” para explicaros el porqué. Seguir leyendo en GPMESS. Autor Javi López G.Publicado el 2013-05-292017-05-10Categorías Español, GPMESSEtiquetas Usuarios¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva) Developers, developers, developers Mientras escribo estas líneas estoy viendo el Google I/O, un evento en el que la compañía de Mountain View presenta novedades en sus productos. Desde mi punto de vista Google es una empresa que se ha preocupado mucho por los usuarios y siempre les da cosas guays muy pensadas para ellos, pero hoy me da la sensación de que hay un cambio de chip, no porque se abandonen a los usuarios, sino porque aparece una gran preocupación por los developers. Seguir leyendo en GPMESS. Autor Javi López G.Publicado el 2013-05-162017-05-10Categorías Español, GPMESSEtiquetas desarrollo¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva) Ponlo fácil si quieres atención Ya me tocaba escribir, que hacía mucho que no lo hacía, y con lo centrado que estoy últimamente con el desarrollo no podía ser de otra manera que escribiendo sobre algo técnico (o no tanto). Además dado que me he pasado todo el día reescribiendo una buena parte de la aplicación de Android (ya, ya sé que la queréis ya, pero seguro que también queréis que vaya fina fina) por culpa de un post del amigo Zootropo (a quien si sois desarrolladores deberíais seguir como hago yo desde mi adolescencia en Internet). En dicho post habla de AndroidAnnotations una librería que sirve para abreviar cosas que habitualmente hay que escribir en Android, así como para inyectar dependencias y otros menesteres, obteniendo como resultado un código mucho más fácil de leer. Seguir leyendo en GPMESS. Autor Javi López G.Publicado el 2013-05-092017-05-10Categorías Español, GPMESSEtiquetas Corporativo¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva)"
