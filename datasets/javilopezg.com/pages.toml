full_description = "Currela al fin Ya se que llevo un par de semanas con esto muy desatendido, pero cuando no hay tiempo no hay tiempo. He estado ocupadisimo con un curso y tal, pero la dedicacion de tiempo a valido la pena, he conseguido un trabajo sin tener experiencia previa, y no me he tenido que ir a barcelona ni madrid ni ningun otro lado, a 11 minutos de mi casa. Ya he metido el pie dentro, ahora hay que conseguir mantener el equilibrio, y despues intentar meter el otro. Tengo muchas cosas pendientes de contar, por ejemplo consegui unas entradas por el morro para el festival cine+comic y aunque algunas ya las habia visto, me vi unas cuantas, y alguna me gusto bastante. Pero eso y otros proyectos ya vendrán cuando halla mas tiempo, que lo primero es lo primero… Autor Javi López G.Publicado el 2006-06-252017-05-10Categorías Cerocoma, Español¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva) Too sexy for the spamers Pues eso parece, o al menos para sus bots, que me han obligado a activar los captchas, y eso que el de blogger no creo que sea de los mejores, así que si no sirve tendré que activar el filtrado de comentarios a traves de mi visto bueno, cosa que no me gustaria. Aunque no estoy muy seguro de que fuera un robot, o no consigo identificar bien el patron. Las entradas en las que ha aparecido el spam cumplían las siguientes condiciones: Todas menos una no tenian ningun comentario, aunque no estaban en todas las que no tenian comentarios Son de los dos meses anteriores al presente, lo que supongo que fuese para evitar que estuviesen en portada, y tardasen mas en darse cuenta. Por suerte no escribo tan a menudo como a ellos les gustaria. Si esto es así, si fuese una persona podría haber evitado facilmente las que estaban en portada, si fuese un robot, no le habria costado mucho mas al programador que esto fuera así, pero es mas posible que pasara de hacerlo. ¡Es usted un autentico vago señor programador de bots spamers! Creo que han omitido las que eran demasiado cortas, no entiendo porque. Siempre puede ser que me esté equivocando, y que los comentarios que he borrado no fuesen basura spamer, y fuese basura salida de los dedos de algun fan angloparlante. Si esto es así, perdondeme querido fan, comuniquemelo en los comentarios de esta entrada, o en mi correo (sí, ese al que escribe constantemente prometiendole amor, sexo, perdida de peso, incluso drogas). Si me demuestra que es tanto lo que le gusta mi trabajo, y que ¿adora mis imagenes?, intentare reponer sus comentarios, o en su defecto trataré de compensarle como usted prefiera 😉 Si en un tiempo prudencialmente prudencial, querido fan, usted no objeta nada al borrado de sus comentarios, entenderé que o se ha enfadado tanto que ni insultarme quiere y prefiere ignorarme, dejando de ser tan aferrimo fan; o bien, usted no era tan fan como pretendía en sus comentarios, y no me tenia el primero entre sus favoritos, y por lo tanto, al no ser en ambos casos un gran fan, borraré sus comentarios definitivamente con sumo placer. Dicho todo esto no me queda mas por decir que:¡Que toca pelotas sois!, ¡por dios! Autor Javi López G.Publicado el 2006-06-122017-05-10Categorías Cerocoma, Español¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva)"
