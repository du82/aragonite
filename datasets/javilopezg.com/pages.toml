full_description = "Big Data, venta de datos y el lado oscuro por @IgnacioBustillo El martes pasado, tuve la suerte de poder asistir a la charla que Ignacio Bustillo (un gran amiguete) impartió sobre Big Data™ dentro del Ciclo de charlas en el ámbito de la Informática que viene organizando la Universidad de Cantabria los últimos años. A modo de breve resumen os diré que soltó tal cantidad de información que a cualquiera no iniciado le habrá explotado el cerebro. Dividió la charla en dos partes, la primera en la que hablaba del mundo Big Data™, tecnología, herramientas, etc.; y la segunda que presentaba un caso real de la última empresa por la que pasó (lo que yo llamo su «época Black Hat») en la que se dedicaban a captar y vender datos, explicando como es todo el proceso de obtención, manipulación, venta y uso abriendo la puerta al debate sobre el estado actual y el futuro del negocio del Big Data. Seguir leyendo en CantabriaTIC. Autor Javi López G.Publicado el 2016-03-292017-11-21Categorías CantabriaTIC, Español, Gestión, TecnologíaEtiquetas Big Data, Data Mining, Eventos, Flink, Hadoop, Ignacio Bustillo, MongoDB, Spark, Storm¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva) Patrones cloud: Particionado Continuamos con esa serie que ya lleva una y dos entregas de soluciones de común aplicación en cualquier entorno pero especialmente en los entornos de nube. Hoy veremos el particionado, que aunque es una solución generalmente poco eficiente, nos puede salvar el culo más de una vez. Continuar leyendo en CantabriaTIC. Autor Javi López G.Publicado el 2016-03-222017-11-21Categorías CantabriaTIC, Español, TecnologíaEtiquetas Arquitectura, cloud, nube, particionado, patr