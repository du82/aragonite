full_description = "La importancia de los porqués Estaba leyendo un hilo de un foro en el que un emprendedor planteaba lo que le frustraba su situación actual en la que tras un fracaso no podía reintentarlo porque necesitaba cubrir deudas, y en los comentarios se generaba un pequeño debate sobre los porqués. Siempre he sido un amante de las causas, de los motivos, de los porqués en todos los aspectos, porque en ellos radica la capacidad de que se replique. Seguir leyendo en GPMESS. Autor Javi López G.Publicado el 2014-08-212017-05-10Categorías Español, GPMESSEtiquetas Corporativo¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva) La fórmula del éxito Releyendo el post de hace unos días en el que hablaba de las “5 claves para el éxito”, me di cuenta que faltaba algo muy importante en él, que aunque puede parecer obvio no lo es. Es algo que recuerdo haber estado debatiendo recientemente con varias personas y el primero fue con François Derbaix en Retuiter cuando me preguntó si había alguien que hiciera lo mismo que GPMESS y hubiese tenido éxito. Y es una pregunta muy complicada ya que depende de la percepción de cada uno de ¿qué es éxito? Seguir leyendo en GPMESS. Autor Javi López G.Publicado el 2014-08-072017-05-10Categorías Español, GPMESSEtiquetas Corporativo¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva)"
