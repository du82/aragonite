["https://javilopezg.com/2006/01"]
title = "enero 2006 - Javi López G."
description = "Gestiono equipos, proyectos y productos tecnológicos.  Aporto soluciones creativas a grandes problemas, mezclando las metodologías y tecnologías más modernas."
full_description = "Ocurrencias de números Esta es una de esas cosas que son evidentes (al menos una vez que ya lo sabes), pero de ahi a que se te ocurra, lo compruebes y veas que realmente es como pensabas hay un cacho. Está un poco mejor explicado en la wikipedia que en microsiervos, pero la idea es simplisima. Como empezamos a contar por 1, en la mayoria de datos que encontramos en la vida real, el uno tiene una mayor ocurrencia que el resto. El descenso en el porcentaje de ocurrencias es mas o menos asintotico. Esto me ha llevado a hacerme mi propia ley 😉 Aunque podría hacer un programa para comprobarla preguntando a tito google, poniendo un «sleep(1)» tardaría años (llegando solo a 6 cifras), y sin él tambien tardaria lo suyo, y encima me acabaria baneando. Así que quedara sin comprobación, pero la intuicion me dice que probablemente sea asi, y si no habre tenido la cabeza ocupada por unos momentos en algo inutil que nunca esta de mas. A pesar de que los numeros de una cifra sean bastantes menos que los de dos, y estos que los de tres … (un crecimiento exponencial) el numero de ocurrencias en la vida real de numeros de una, dos ,… cifras es lineal, comenzando a estabilizarse en 4, y descendiendo a partir de 7 asintoticamente. Un saludo, seguro que a partir de ahora os fijais mas en los numeros. PD: Aunque solo sea una chorrada, si alguien se toma algun dia la molestia de comprobarlo, le estaria agradecido si me dice si mi prediccion es correcta… Autor Javi López G.Publicado el 2006-01-302017-05-10Categorías Cerocoma, Español¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva) Matando el tiempo Cuando tienes muchísimas cosas por hacer, es cuando mas útil es relajarse y pasar página un ratuco, aunque luego tengas que volver a ella. Algo que puede ayudar a perder ese tiempo precioso que tanta falta nos haces es flipbook (requiere flash)donde puedes perder tiempo expresando tus frustraciones, o lo que quieras expresar. Yo ya he hecho alguno, aunque no son tan buenos como otros. Iba un poco mal (nunca me gusto el flash), no guardaba todo bien, pero sigue siendo igual de entretenido. Es impresionante la pila de ellos que se crean, y algunos realmente ingeniosos. Un saludo, y no perdais mucho tiempo con ello 😉 PD: si veis alguno que os gusta darle al botoncito de «i like it» que seguro que si su autor lo ve se le agranda el ego. Autor Javi López G.Publicado el 2006-01-302017-05-10Categorías Cerocoma, Español¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva)"
