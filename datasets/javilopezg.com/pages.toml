["https://javilopezg.com/2008/02"]
title = "febrero 2008 - Javi López G."
description = "Gestiono equipos, proyectos y productos tecnológicos.  Aporto soluciones creativas a grandes problemas, mezclando las metodologías y tecnologías más modernas."
full_description = "Java Estaba comenzando a leer Piensa en java para una asignatura, cuando me he acordado de que hice un curso de java de las aulas mentor hace como un año. Lo hice porque me aburría, pero desde que me matricule en 4 en la UNED, estoy con la cosa de ir por el título por si me dan algún crédito de libre configuración. Bueno, pues la cosa es que para el curso hice una práctica que nunca llegué a publicar. Es el típico ejemplo de cosas dibujables, a mi parecer bastante didáctico. Se basa en un applet central (lienzo) en el que se pueden realizar acciones mediante otros applets (botones ejecutables). Pretende ser un ejemplo fácilmente ampliable, añadiendo applets de este segundo tipo. En el correo en el que mandé la practica, envié algunas propuestas de ampliación, y aunque ya no se donde anda, recuerdo que una era por ejemplo pasar un objeto dibujable de un lienzo a otro. He subido todo a un nuevo espacio de google pages, ya que como no se pueden hacer carpetas, no queria guarrear tanto el otro. Os dejo algunos de los enlaces que podeis encontrar ahí que pueden ser mas útiles: documnetación, uno de los ejemplos, y todo comprimido en un zip. Espero que a alguien le pueda servir de ayuda, apoyo, o para practicar. Ante cualquier problema o duda ya sabeis. Autor Javi López G.Publicado el 2008-02-232017-05-10Categorías Cerocoma, Español¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva) WAMP-Server Cuando acabe los exámenes, a parte de ponerme con los del 2º cuatrimestre, tengo pensado aprovechar los ratos muertos en los que no esté currando ni de fiesta en enredar un poco con PHP. Ya había tenido algún contacto, pero no me acuerdo de na, y a pesar de que en algunos sitios digan que no es una comunidad muy buena, siempre he pensado que las cosas siempre se pueden hacer bien independientemente de la herramienta que uses. Al fin y al cabo en el trabajo tengo que mantener un programa escrito en VB… Es verdad que algunos lenguajes te lo facilitan, o se aseguran de que no lo puedas hacer tremendamente mal. Pues la cosa es que después de pasar media hora intentando configurar el php para que acceda al mysql, me ha dado por mirar si existía alguna forma mas fácil (al estilo linux/ubunt) ya que ahora tengo puesto windows, que de momento sólo quiero hacer pruebas, ya llegará el momento si publico algo de meterse en los entresijos de la configuración. El primer resultado de google al respecto ha sido lo que estaba buscando: WampServer. Te instala la última versión de Apache, PHP y MySql. Además puedes ponerle luego la versión que quieras para simular el entorno de producción. Todo controlado desde un tray icon. Lo único que a primera vista le falta es un configurador de la seguridad. Si quieres poner contraseñas lo tienes que hacer a mano, lo que para hacer unas pruebas y unos ejemplos está bien, pero si quieres montar un entorno de preproducción hay que simular las condiciones en todo lo posible (aunque entonces tendrás también un entorno de producción y sabrás configurarlo sin problemas). Muy útil para el que quiera empezar a enredar con php en windows, sin pegarse con nadie en 5 minutos. Autor Javi López G.Publicado el 2008-02-032017-05-10Categorías Cerocoma, Español¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva)"
