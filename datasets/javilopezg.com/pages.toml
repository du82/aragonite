full_description = "GLAT – 16 16. Dado un triangulo ABC, como harías para encontrar con el borde (se entiende que sin la escala) de una regla, y un compas para encontrar un punto P de tal modo que los triángulos resultantes ABP, ACP y BCP tengan el mismo perímetro? (Asumir que ABC está construido de tal modo que exista una solución) Tomando con el compas un lado, y trazando un arco desde el vértice opuesto, así con los tres pares de lado/vértice. El punto de intersección es el punto P. El punto ya está encontrado, pero se podría usar el borde de la regla para unir P con los vértices… Tampoco lo he probado, sólo lo he pensado, con lo cual puede estar tremendamente equivocado. Autor Javi López G.Publicado el 2007-09-292017-05-10Categorías Cerocoma, Español¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva) GLAT – 15 15. ¿Cuál es el tamaño óptimo de un equipo de proyecto, teniendo en cuenta que los miembros adicionales no contribuyen a la productividad equivalentemente al porcentaje en que incrementa el personal? a. 1b. 3c. 5d. 11e. 24 Depende de lo grande del proyecto y de lo bien organizado que esté de esas opciones la mínima (para algo no muy pequeño, pero tampoco muy grande) creo que lo ideal es 5, uno que organice (pero también desarrolle si le sobra tiempo) y el resto que piensen y actúen, pero si el proyecto es realmente grande, haría falta más gente, mas capas, aunque tendría que estar muy bien organizado. Para algo concreto, pequeñito, bien pensado y claro, y sobre todo si se basa en cosas ya hechas con 2 es más que suficiente…. Yo que sé. Los empieces son mas sencillos, pero a medida que crecen las cosas…. Autor Javi López G.Publicado el 2007-09-292017-05-10Ca