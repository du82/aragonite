["https://javilopezg.com/2016/02"]
title = "febrero 2016 - Javi López G."
description = "Gestiono equipos, proyectos y productos tecnológicos.  Aporto soluciones creativas a grandes problemas, mezclando las metodologías y tecnologías más modernas."
full_description = 'Summary of the main stage #dotNetSpain2016 Yesterday was the .Net Conference at Kinepolis Madrid. The schedule was really huge but, lucky me, I could not assist so I did not have to choose and only could see the streaming of the main stage. The starting keynote was carried out by Jose Bonin. Jose was talking about the future, about the great things that technology will give us. He talked about different things like just-in-time translation with skype or homomorphic encryption to operate with encrypted data. He shared the stage with Alberto Diaz, he showed a factory robot and talked about interfaces, IA and stuff like that. "El número de frameworks de js superará el de dispositivos y el de humanos" @wasat en #dotNetSpain2016 xD — Javi López G. (@JaviLopezG) February 24, 2016 After that, Chema Alonso talked about security with examples specially focused on Microsoft technologies. He did a Pen test to Microsoft.com site. Chema is always amazing and funny. The most expected talk by social networks was the the keynote of Satya Nadella (CEO@Microsoft). Mobile-first & cloud-first says @satyanadella at #dotnetspain2016. A new world that relies over the environment that we all are developing. — Javi López G. (@JaviLopezG) February 24, 2016 He talked about the great moment to be a .Net developer, and says that they are giving us a single development model to create programms for all their technologies. You can use .Net to implement Machine Learning algorithms and an interface for Hololens. "When you change the way you see the world, you change the world you see" @satyanadella at #dotNetSpain2016 — Javi López G. (@JaviLopezG) February 24, 2016 The first in the afternoon was Hugo Biarge (the last at the morning for Spanish people as he said). He talked about Authentication and Authorization with the new version of ASP .Net. The new model (Imperative Authorization) is based on policies and claims, no more user and roles (roles stay but they are not recommended). Active Directory and Identity Server are the main characters to do this. After lunch break, Luis Ruiz Pavón talked about the new .Net framework (and ASP .Net). It was crazy because Microsoft changed all things. I wrote a post two weeks ago about what is coming, this post was published yesterday and it has a lot of mistakes because they changed all: environment, commands, even the names! Eduard Tomas presented all the news of MVC6, a lot of changes. It will be like learn a new framework (I tested it and I cannot recommend it for production projects at this moment). Nowadays it is hard to be up to day but necessary to do our job, isn’t it? Last ones over the stage were Francesc Jaumot and Jose Cousiño. They did a demo with a lot of code, teaching how to use Visual Studio Code to develop a single page application using Angular 2 (the TypeScript flavor) in the frontend and ASP .Net Core 1 in the backend. It was a talk with a lot of problems but they were ready to jump obstacles and in the end all worked. All of them were really interesting, and I suggest you see the linked videos. At the end of the day everybody was surprised with the information of Microsoft acquiring Xamarin. Me too, but it has perfect sense attending changes coming that we saw during the #dotNerSpain2016. Autor Javi López G.Publicado el 2016-02-252017-11-21Categorías Blog, English, TecnologíaEtiquetas .NET, ASP, Microsoft, MVC, Tecnologías MicrosoftDeja un comentario en Summary of the main stage #dotNetSpain2016¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva)'
