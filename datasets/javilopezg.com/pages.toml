full_description = 'Siempre hay un modo mas simple… Hoy va la cosa de como hay que pararse a pensar antes de actuar, es algo que no siempre hago. A través de fresqui, me encontré una página en la que puedes ver mapas de la tierra en «tiempo real». Esta, en realidad «roba» su funcionalidad a otra, en cuyo dominio se pueden encontrar varias cosas interesantes. Cuando lo vi me dije que estaría bien tenerlo de fondo de escritorio a pesar de la resolución, y ya me estaba preparando para hacer algún programa/script que la descargara periódicamente. En linux sería fácil, ya que el wget suele estar por defecto. Sin embargo en windows lo único, que yo sepa, con lo que se podría hacer eso por linea de comandos es telnet (seguro que hay alguna cosilla, pero no la conoceré). La cosa es que ya cuando estaba poniéndome a ello, me acordé de que en el escritorio de windows se pueden incrustar trozos de paginas, creo que desde el 95. Echando un vistazo, vi que también se podían establecer como fondo de escritorio paginas html, así que eso hice (está ajustado a mi escritorio 1280×800 con la barra de windows con la altura por defecto): <html><head></head><body bgcolor="black" alink="black" link="black"><a href="javascript:location.reload(true);"><img src="https://www.fourmilab.ch/cgi-bin/uncgi/Earth?img=learth.evif&dynimg=y&opt=-p" width="1250" height="740" /></a></body></html> Esto es mucho mas simple que lo que me proponía en un principio, pero realmente tiene la suficiente funcionalidad, y el resultado es similar al que esperaba. Además seguro que en unos días me he aburrido de ello. Autor Javi López G.Publicado el 2007-12-242017-05-10Categorías Cerocoma, Español¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva)'
