full_description = "Conociendo al equipo: Juan “¿Quién leches es este Juan?”, seguro que os preguntáis todos cuando véis a la derecha su foto en pose ¿sexy? Es fácil, Juan es mi vocecilla de Pepito Grillo particular. Es quien me dice, cuando yo ya veo que todo funciona, “vale, pero ahora tomemonos un rato para hacerlo bonito y fácil”. Seguir leyendo en GPMESS. Autor Javi López G.Publicado el 2012-10-302017-05-10Categorías Español, GPMESSEtiquetas Corporativo¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva) Compartiendo conocimientos… ¡en un hackathon! Hoy me gustaría quitarnos el estigma con el que nos podéis estar marcando en plan “frikis emprendedores” gracias a las entradas de nuestro blog. ¡Nada más lejos de la realidad! ¡La verdad es que también somos frikis de otras cosas! Seguir leyendo en GPMESS. Autor Javi López G.Publicado el 2012-10-182017-05-10Categorías Español, GPMESSEtiquetas desarrollo¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva) ¡Campeones en SIMO! ¡Sí! El pasado 27 de septiembre vencimos en el SIMO, la feria informática española con más reputación. ¿Y qué fue lo que ganamos? Este año entre los eventos del programa se incluía un concurso de proyectos empresariales llamado “15 minutos de gloria”, realizado en colaboración con CSEV, y ¡el que más gustó al jurado fue gpmess! Seguir leyendo en GPMESS. Autor Javi López G.Publicado el 2012-10-112017