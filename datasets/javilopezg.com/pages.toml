["https://javilopezg.com/diario_enfermo_raro"]
title = "Diario enfermo raro - Javi López G."
description = "Gestiono equipos, proyectos y productos tecnológicos.  Aporto soluciones creativas a grandes problemas, mezclando las metodologías y tecnologías más modernas."
full_description = "Querido diario: No puedo más, no aguanto más, no puedo seguir. Estoy cansado de dolores, de pasarlo mal, de enfrentarme a médicos, a burocracia, de vivir frustrado… no me quedan fuerzas. Sé que uno de mis grandes problemas al enfrentarme a esta enfermedad es que siempre, tanto en lo profesional como en lo personal, he sido muy resolutivo. Mi trabajo siempre ha sido prever, identificar y resolver problemas. Y en mi familia siempre que se rompe algo acaba en mis manos antes de desecharlo. El hecho de no poder hacer nada para mejorar esta situación me puede, es algo que siempre me ha frustrado, y en mis manos sólo hay un modo de solucionarlo que no quiero tomar. Todos los días me pregunto cuánto más podré aguantar y si realmente quiero aguantar, pero llevo ya varios días sin apenas poder dormir buscando una respuesta positiva a esa pregunta y no la encuentro… no puedo. Aunque debería no voy a ir a urgencias, ya sé lo que me espera allí, y lejos de suponer una ayuda siempre empeora todo. En general, me causa mucha ansiedad ir a cualquier consulta por la incertidumbre de “a ver con qué me sorprenden esta vez”. Pero en urgencias, aunque no siempre, he tenido experiencias terribles por las que no estoy dispuesto a arriesgarme a pasar. Voy a combinar todas las drogas que tengo por casa, aunque sé que no es la mejor de las ideas y mañana intentaré llamar a ver si consigo hablar con un psiquiatra que me pueda ayudar. A ver si llego."
year_published = 2025
year_updated = 2023
