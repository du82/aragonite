full_description = "GPMESS ya forma parte del programa Bizspark Plus Hoy me salto todas las normas y procedimientos (las hemos puesto nosotros, podemos saltárnoslas cuando queramos) y comparto con vosotros algo que llevamos persiguiendo mucho tiempo y que se materializó el miércoles. Es ni más ni menos que tras mucho trabajo hemos sido seleccionados por Microsoft para ser una de las empresas que forman parte del programa Bizspark Plus. Esto además tenemos que agradecérselo al CIIN y en especial a Roberto Rico que nos ha dado seguimiento y nos ha ayudado con todo esto. Seguir leyendo en GPMESS. Autor Javi López G.Publicado el 2014-04-132017-05-10Categorías Español, GPMESSEtiquetas Usuarios¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva) De cosas que dicen ‘yipi’ GPMESS es un nombre peculiar, que no acaba de calar nunca de primeras, pero que en cuanto la gente se acostumbra te dice “¡Ni se os ocurra cambiarlo!”. Sin embargo yipi es algo que desde el principio llama la atención, un concepto guay, algo divertido. De hecho en inglés es un grito de alegría, o como dice el Oxford Dictionary: “a short, sharp cry or yelp, especially of excitement or delight”. Seguir leyendo en GPMESS. Autor Javi López G.Publicado el 2014-04-032017-05-10Categorías Español, GPMESSEtiquetas Usuarios¿Te ha gustado? ¡Comparte!:Haz clic para compartir en Twitter (Se abre en una ventana nueva)Haz clic para compartir en LinkedIn (Se abre en una ventana nueva)Haz clic para compartir en Facebook (Se abre en una ventana nueva)Haz clic para compartir en Telegram (Se abre en una ventana nueva)Haz clic para compartir en WhatsApp (Se abre en una ventana nueva)"
