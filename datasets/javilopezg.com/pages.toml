title = "Legado - Javi López G."
full_description = "Legado Legado Febrero de 2024: Es curioso pasar por aquí y darse cuenta de que todo lo que empecé se ha quedado en nada. Ahora he empezado a subir relatos cortos que ya tenía a Wattpad «¿Que por qué no los he subido a este blog?» estoy seguro que me preguntaría mi querido Juan y tendría razón. Sólo vi que tenía un usuario de la plataforma creado en 2011 (yo y mi manía de probar todas las apps del mundo) y se me ocurrió que tenía el contenido perfecto para volcar ahí. Sin más. PD: después de casi 4 años, ya tengo un diagnóstico «seguro» y un tratamiento que me ha mejorado levemente. Octubre de 2023: Lejos de mejorar parece que todo empeora. Sigo sin saber quien soy o quien seré, sólo quién era. Pero he empezado algo: La voz de los vivos Diario de un enfermo raro, versión online Globalzine, el 1er fanzine global Septiembre de 2023: Tras más de tres años enfermo y empeorando, sin apenas ser capaz de salir de la cama, y casi tres años de baja y con previsión (por no decir amenaza) de una segunda alta laboral por falta de diagnóstico que me dejará en una situación muy complicada (ya me han desahuciado 5 veces sin darme un diagnóstico y sin un diagnóstico la SS te da de alta), creo que ha llegado el momento de asumir que no tiene sentido mantener una página profesional, del mismo modo que con las IA generativas en enero de este año (2023) tocó apagar el bot que generaba páginas con las noticias más relevantes de la semana. Se había quedado obsoleto, como yo. Anticipando que mi querido Juan no me dejaría borrar mi paso por Internet que, desde el 95 ha sido muy extenso y variado y, ya ha perdido bastante por la falta de sus tan bien defendidas web abierta y control del contenido, he decidido reformar esto en una especie de legado que recopile todo lo que quede mío online. No recuerdo todos los sitios en los que he colaborado o creado contenido, al principio como nakochagui, luego como lopez y más hacia la actualidad como javilopezg… por circunstancias de la vida, la mía ha estado ligeramente expuesta, y en cualquier caso no tengo nada que esconder, así que he ido dejando miguitas de pan por todos lados. Veré cuales soy capaz de recuperar porque supongo que de los grupos de noticias, servidores IRC, etc. no quede ni rastro por ningún lado. Sin duda muchas de las cosas que he hecho y tienen restos online están obsoletas y pueden sonar hasta ridículas como cuando hice que mi MSN Messenger me leyese los mensajes que iban llegando para no distraerme de lo que estaba haciendo, la gran colección de malware que recopilé mi primer año de universidad y un colega borró porque le parecía peligroso, o cuando fui el primero (del mundo, ojo) que consiguió que Ubuntu diese vueltas como un cubo o se prendiese fuego al conseguir instalar Compiz. No obstante, al igual que casi todo queda obsoleto, siempre hay cosas atemporales aunque ahora no se me ocurra ninguna, pero escarbando seguro que algo puedes encontrar. Feliz búsqueda. nakochagui en emulespana lopez en barrapunto lopez en debug_mode=on Estos primeros son de lo más antiguo que he podido encontrar, aunque es dificil ver todo en la máquina del tiempo. Por ejemplo de emulespana sólo he enlazado el manual de C que escribí, pero participaba en el foro de continuo e incluso hice alguna pequeña colaboración en el mod de emule diseñando las modificaciones que habria que hacer para encapsular la definición de paquete de Windows y así poder modificar el valor de QoS… una movida que nadie se atrevió a probar. Parece que lo que era el MDC donde traduje muchos artículos sobre javascript y la web api, se ha reformado tanto que ni los usuarios perduran ya. El antiguo blog de cerocoma le transferí casi en su totalidad al blog actual (podréis identificar sus entradas por estar plagadas de faltas ?). A partir de aquí pasamos a las cosas que a día de hoy siguen existiendo. La antigua portada de este site Mi KoFI para cuando tenga que pedir limosna Mis libros (0€ de beneficio, si te valen en pdf, busca en el siguiente apartado) PDFs Globalzine, un fanzine global facebook, no lo uso twitter, Apenas uso linkedin, no entro a nada instagram, con shadowban por denunca anónima por fomentar el suicidio ?‍♂️. A penas entro Donde pinto mi grupo de música (en remoto, que no puedo salir ?) Mi Spotify Mi perfil de «Brillant Thing 2390» colección de juegos de 1 partida al día Un pato de goma colección de páginas curiosas o útiles Y que me acuerde ahora, esto es todo lo que puedo recuperar. Para cualquier cosa no dudes en contactarme, lo que sea, mi carencia de vida es terriblemente aburrida."
year_published = 2025
year_updated = 2024
