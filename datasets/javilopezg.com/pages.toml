["https://javilopezg.com/sobre-mi"]
title = "Sobre mí - Javi López G."
description = '¿Quién soy yo? Nací en Astillero (Cantabria), un pequeño pueblo al final de la bahía de Santander, el año de Naranjito. De pequeño quería ser inventor, pero un inventor práctico… ¡cómo MacGyver! Desmonté muchas cosas, algunas de las cuales nunca volvieron a funcionar, aprendiendo siempre cómo funcionaba el mundo. El primer «ordenador» al que tuve … Continuar leyendo "Sobre mí"'
full_description = '''Sobre mí ¿Quién soy yo? Nací en Astillero (Cantabria), un pequeño pueblo al final de la bahía de Santander, el año de Naranjito. De pequeño quería ser inventor, pero un inventor práctico… ¡cómo MacGyver! Desmonté muchas cosas, algunas de las cuales nunca volvieron a funcionar, aprendiendo siempre cómo funcionaba el mundo. El primer «ordenador» al que tuve acceso (a los 10 años) era un Atari de 8 bits que consistía en un teclado y dos joysticks, y que si no le metías un cartucho podías programar en BASIC. Eso me abrió un mundo de posibilidades: ¡podía inventar sin romper cosas! Conseguí un libro y empecé a hacer mis primeros programas tras días numerando líneas de 10 en 10. Esta odisea era especialmente dura porque al no tener unidad de almacenamiento, tenía que hacer los programas del tirón (evitando que mis padres se diesen cuenta de que el Atari estaba encendido en los momentos de descanso) y una vez que los veía funcionar como yo quería, tenía que apagarlos y dejar que el cacharro descansara para evitar incendios. Mi primer PC me llegó en el 95. Era uno de esos con cerradura y botón de turbo. Se rompía (o lo rompía) constantemente, por lo que siempre andaba desmontándolo y aquel temprano acceso a Internet me abrió un mundo de conocimiento sólo interrumpido cuando mi hermana quería hablar por teléfono. Al llegar a la edad adulta lo tenía claro: quería estudiar informática. Debido a que Cantabria era la única comunidad autónoma en la que no existía esta carrera, me fui a estudiar a Alicante. Por los días universidad y por las noches debuguear Windows en ensamblador, hacer cracks, probar otros lenguajes distintos de los que nos enseñaban, entender cómo funcionaba todo más allá de las explicaciones básicas que daban en clase. Por distintos motivos acabé la carrera en la UNED, lo que me permitió obtener una experiencia tremenda en cuanto a organización y gestión, ya que ahí no había un paso a paso como podía haber en la universidad presencial. Al acabar la carrera seguí estudiando, pero me di cuenta de que una vez trabajando, no tenía mucho sentido seguir obteniendo títulos y abandoné la formación reglada para ir a otra mucho más práctica e incluso abrirme a otras materias como gestión, contabilidad, marketing, resolución de conflictos, emprendimiento y un largo etc. ¿Cuál es mi experiencia profesional? Durante el tiempo que estuve en la UNED, realicé además una beca de prácticas en la Dirección General de Universidades e Investigación del Gobierno de Cantabria. Al finalizar mis estudios empecé a trabajar en Semicrol, una de las «grandes» empresas de desarrollo de Cantabria. Ahí se usaban tecnologías Microsoft: VB6, ASP, Objetos COM y COM+ y .NET; de las cuales yo no tenía ni idea antes de entrar, poniéndome en poco tiempo a la altura de los mejores que llevaban años lidiando con ellas. Aunque colaboré en otros proyectos, mis funciones principales se desempeñaron alrededor de un ERP orientado a la gestión de proyectos en el que se podía manejar la facturación, la tesorería, la contabilidad, el inmovilizado y los bienes inmuebles, cursos y congresos (con su portal online para inscripciones), ensayos clínicos, y un largo etcétera que crecía con cada petición de un cliente a la que el comercial de turno contestase con un: ¡sí, lo tenemos! Cuando ya no pude crecer más en esa empresa di el salto a Danca, una startup de IoT cuando nadie sabía lo que era el IoT. Tenía (y tiene) un dispositivo que se colocaba juntos a los plomos de una casa o una empresa y tomaba medidas del consumo de los distintos circuitos eléctricos, mandando las muestras por Internet cada segundo. Toda esa información se recopilaba y trataba para ofrecérselo a los usuarios en modo de gauges en tiempo real, informes periódicos o alarmas por SMS. Tras un tiempo ahí di otro salto para montar mi primera empresa. Kasai Solutions era una empresa de desarrollos a medida, en la que dos informáticos creíamos que haciendo las cosas bien podríamos financiarnos con los desarrollos a grandes clientes para sacar nuestros propios productos. Esta idea tan encantadora, que ahora sabemos era una utopía, explotó junto a la burbuja inmobiliaria dándonos una bofetada de realidad. Mi socio pasó a otros menesteres, pero yo que soy más insistente (o pesado) y con la motivación extra de haber vuelto de una visita a grandes empresas como Google, IDEO, Intel, etc. en San Francisco, decidí unir un nuevo equipo (esta vez multidisciplinar, que siempre aprendo de los errores) y monté una nueva empresa llamada GPMESS. GPMESS tenía como eje central una aplicación de información geolocalizada, con la que la gente dejaba sus mensajes, consejos y recuerdos anclados virtualmente a sitios, para que los descubriese quien pasara por el lugar. Tuvimos muchos aciertos y muchos errores (aunque todos siempre nuevos), pero tras 3 años y 10 personas tuvimos que echar el cierre. En ella ejercí de CEO y CTO. Como CEO tuve que lidiar con el equipo, con proveedores, clientes, inversores, aceleradora (fuimos uno de los 15 proyectos de los más de 4200 que se presentaron a Lanzadera en su primera edición) y asumir todas las funciones que no estaban cubiertas por algún otro miembro del equipo. Como CTO tuve que iniciar los desarrollos de los clientes web, Android e iOS y montar un backend que llegó a soportar 1000 peticiones por segundo de manera mantenida… ¡menos mal que ya había nubes! Si no hubiese sido por Azure y el apoyo de Microsoft no habríamos podido escalar y manejar esos volúmenes. Tras esto eché una mano puntual a un amiguete (Álvaro de Mindrop) realizando tareas de I+D para resolver un problema de automatización de Office en servidor, y me volví a Cantabria a colaborar en la organización de SofCloudIT, una startup que acababa de ser comprada por la multinacional Ingram Micro y que tenía un reto importante de crecimiento (en 5 meses pasamos de ser menos de 20 a ser 80 personas) con todo lo que ello supone, teniendo que seguir sacando producción adelante y manteniendo siempre el contacto con unidades de EEUU, Canadá, Rusia, India, etc. Durante todo este tiempo, además era freelance como gestor de unos proyectos de desarrollo de sistemas distribuidos. De ahí pasé al Banco Santander, dónde me dediqué a introducir nuevas tecnologías y metodologías en sus procesos. Es una entidad bastante burocrática y rígida, pero puedo estar orgulloso de que pese a perder al sponsor a los dos meses (un directivo que pasó de Produban a corporativo) fueron bastantes los proyectos que conseguí que saliesen adelante mientras estaba allí, algunos de un nivel de dificultad en la gestión tales que tenía que lidiar con el Director de IT de USA, abogados y entidades gubernamentales para resolver problemas de compliance. Finalmente estuve en eldiario.es gestionando un proyecto financiado por Google, desarrollando un producto en un ciclo completo, con un presupuesto muy ajustado y un tiempo muy limitado (un año), en el que hubo que aterrizar el proyecto, montar un equipo de lo más heterogéneo, hacerles trabajar como tal, y validar continuamente con los clientes que el camino era el adecuado mientras producíamos un proceso de transformación digital muy grande. Además he dado distintas formaciones y ponencias sobre tecnología, metodologías de gestión, etc. en universidades y eventos del sector. Ahora ofrezco mis servicios como freelance, para ayudar a tu empresa en todo lo que pueda necesitar. Puedes encontrar toda esta información esquematizada, detallada y más completa descargándote mi CV desde aquí o si lo quieres en inglés desde aquí, o visitando mi página en LinkedIn. ¿Qué otras aficiones tengo? Me gusta muchísimo la música en directo, y soy de los que creen que casi cualquiera tiene su momento (he dicho CASI cualquiera). La playa (o mejor dicho «la mar»), pero para estar haciendo cosas, nada de dorarse vuelta y vuelta al sol. También el monte, y la escalada deportiva que es un deporte de lo más completo (aunque si quieres esto te lo puedo explicar con una caña, que va para largo). Leo muchísimo, sobre todo ciencia ficción, novela histórica y libros de los que aprender cosas que no sepa o que necesite reforzar. Me gusta estar al día de las últimas tecnologías que mueven el mundo, siempre me empapo de todo lo que pasa e intento probarlas a la mínima ocasión. ¿Qué puedo decir? Soy muy curioso y para ser un inventor práctico, como MacGyver, hay que conocer qué herramientas tienes a mano. javilopezg Luna lunera #dibujo #drawing #moon Probando. Un, dos, tres… #test #dibujo #prueba Set ready #instrumentos #musica #bajo #guitarra #tronie #dibujo #drawing ¡Qué te mire cómo le mira Lydia! #beetlejuice ¿Dónde está la calavera? ¿Puedes verla? #chat Libros septiembre #libros #books Vicky el vikingo #dibujo #drawing #vickyelviking Pebbles #picapiedra #flinstones #dibujo #drawing Padre e hija #bajo #guitarra #bass #guitar #music Revolcón #aler🐕‍🦺 #superchuchete #perro Aseado para empezar bien el mes Dobby and the Goblet of Fire #harrypotter #howart Libros de agosto #libros #books Easy peasy Jolly Jumper #jollyjumper #luckyluke #caballo #h Iris El gato no quiere jugar #aler🐕‍🦺 #superchu Magic horse #dibujo #drawing #horse #caballo La madriguera/The burrow #harrypotter #howarts #t Cargar más... Síguenos en Instagram mutant.duck You can move while you seem static. You can seem s #monkeydluffy #luffy #onepiece #onepiecefanart Yogui haciendo yoga #yogui #yoga #hannabarbera #c "A great series requires a great bookmark." #tank I spent the whole morning talking with gpt to get Rules of the cover contest Normas del concurso de I hate when "final" artworks look worse than the s Colorful vs grey Fire vs ice The demon vs the samu El primer número de @globalzine a la venta ya en Pixel art with Lego dots. Results with hard crayo My Halloween #halloweenart #halloween #zombies #r Where is it? #inspiration #challenge #dare #inspi Do you know what animal it is? It's a real one, I The secret section of Instagram that no one knows Which style do you prefer? ¿Qué estilo prefiere A drawing is like a plan; if it goes wrong, it can Ada #adalovelace #womenintech #womeninstem #compu Coyote #looneytunes #wileecoyote #coyoteart #acme Isidoro / Heathcliff #IsidoroElGato #HeathcliffT Guess what color I used to sketch each one of the Cargar más Seguir en Instagram'''
