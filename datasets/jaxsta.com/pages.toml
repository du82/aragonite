["https://jaxsta.com/privacy-policy"]
title = "Jaxsta | Official Music Credits"
full_description = "Last updated: 23 February 2024Privacy PolicyVinyl Group Ltd and Vinyl Group Operations Pty Ltd Commitment to PrivacyVinyl Group Ltd (“Vinyl”) (ACN: 004 523 782) and its related entities, including but not limited to, Vinyl Group Operations Pty Ltd (“VGO”) (ACN 605 344 054) are committed to managing personal information in accordance with the Australian Privacy Principles under the Privacy Act 1988 (Cth), the General Data Protection Regulation (EU) 2016/679 (GDPR) and other applicable privacy laws.This document sets out our policies for managing your personal information and is referred to as our “Privacy Policy”.In this Privacy Policy, “Jaxsta”, “we”, “us” and “our” refers to Vinyl Group and/or VGO and “you“ refers to any individual about whom we collect personal information.This Privacy Policy applies to all personal information collected by us, or submitted to us, whether offline or online, including any name, profile information, skills, image (including, in each case, photographs and other images), work history, location or other personal information collected or submitted through our website www.jaxsta.com, through our official social media channel pages which we control (such as our Facebook, Twitter (X), Instagram and LinkedIn pages), and through email messages that we may send to you or receive from you, as well as in administering and managing relationships with our stakeholders and licensees and licensors.We understand that you care about how your Personal Information is used and shared, and we take your privacy seriously. This Privacy Policy describes how we collect, use, share, and safeguard your Personal Information when you access the Jaxsta website(s), mobile application(s), and any other linked pages, features, content, or platform services offered from time to time by Jaxsta in connection therewith (collectively, the “Service”), or otherwise interact with us. This policy does not apply to the practices of companies that Jaxsta does not own or control, or to individuals that Jaxsta does not employ or manage.By accessing or using our Service(s), you acknowledge that you accept the practices and policies outlined in this Privacy Policy.We reserve the right to amend this Privacy Policy at any time by posting the amended terms on the Service. If we make material changes to this policy, we will notify you by means of a notice on our announcements board and/or other means so that you access and review the changes. If you object to any changes, you may close your account. By continuing to use the Service after notice of changes has been sent to you or published on the Service, you are deemed to have consented to the changes.About Vinyl Group and Vinyl Group Operations Pty Ltd and JaxstaVinyl Group Ltd is an Australian public company that operates a number of businesses in the music, retail and media industries.Vinyl Group Operations Pty Ltd is an Australian company and subsidiary of Vinyl Group Ltd.Jaxsta is a business unit owned by Vinyl Group and operated operated by Vinyl Group Operations Pty Ltd that uses technology to meet the need for authenticated music credits information.The Jaxsta platform collates and authenticates data from major and independent record labels, publishers, royalty agencies and industry associations and other reliable sources and publishes it online, making it a trusted source of official music information. The core Jaxsta platform is located at jaxsta.com and is live.Definitions“Personal Information” means information that can be associated with a specific person and can be used to identify that person and includes your Information. Information that has been made anonymous or aggregated so that it cannot be used, whether in combination with other information or otherwise, to identify a specific user is not personal information.“Processing” means any operation or set of operations which is performed on personal information or on sets of personal information, whether or not by automated means, such as collection, recording, organisation, structuring, storage, adaptation or alteration, retrieval, consultation, use, disclosure by transmission, dissemination or otherwise making available, alignment or combination, restriction, erasure or destruction.“Related Entity” means any Parent or Subsidiary of Vinyl Group or VGO and any business, corporation, partnership, limited liability company or other entity in which Vinyl Group or VGO or a Parent or a Subsidiary of Vinyl Group or VGO holds a substantial ownership interest, directly or indirectly.How and why do we collect and use your personal information?We collect personal information reasonably necessary to carry out our business, to assess and manage our members', subscribers' and customers' needs, and provide our services to those groups. We may also collect information to fulfill administrative functions associated with these services, for example, billing, entering into contracts with you and/or third parties and managing member, subscriber and other business relationships. We also collect personal information to administer and manage relationships with our shareholders. We may allow shareholders and other visitors to our website to sign up for alerts and otherwise communicate with us.Our principal purpose in collecting, using and storing your personal information is to provide you with access to and use of our services and those of related entities in a personalised, safe and efficient manner. You consent to us collecting, using, storing and sharing your personal information to enable us and related entities to provide services to you and fulfil obligations under a membership or subscription agreement and/or any other contract you may have with us or a related entity;to provide information about our services or services of companies related to us and/or special offers to users;to obtain opinions or comments about services from users;to record statistical data for marketing analysis from users;managing, planning, advertising and administering programs, events, competitions and performances;managing our relationship with you if you are a data supplier, user, business partner or shareholder;researching, developing and expanding our services and those of related entities;informing you or others of our activities, events and services and those of related entities;to operate, evaluate and improve our business and the business of companies related to us, including developing new products and services; managing our communications; determining the effectiveness of, and optimizing the content you see; analysing our products, services, website(s), mobile application(s), and any other digital assets and those of related entities; facilitating the functionality of our website(s), mobile application(s), and any other digital assets and those of related entities;to facilitate recruitment processes; andto respond to reasonable and lawful requests for information, general enquiries and complaints.We generally collect personal information directly from you. We may collect and update your personal information over the phone, by email, over the internet or social media, or in person. We may also collect personal information about you from other sources, for example:our affiliated and related companies; andthird party suppliers and contractors who assist us to operate our business.We also collect and use personal information for market research purposes and to innovate our delivery of services.ou agree we have a legitimate interest in using your information in the ways listed above. In some cases, it will be lawful for us to collect and use your personal information, for example where it is necessary as part of our, or a third party's, statutory or public functions or because the law permits or requires us to.What information do we collect about you?Members and prospective membersWhen you enquire about our platform and/or services or when you subscribe to or become a member of our platforms, a record is may be made which includes your personal information.The type of personal information that we collect or you provide will vary depending on the circumstances and the kind of service that you request from us, but will typically include:your name, email, images, postal address and other contact details;your professional details and details about your affiliations with creators, artists, music professionals, managers or music companies;details regarding your work history and skills;your login details and passwords which you use to access your account with us as well as your online interactions with us;details of the services (such as membership or subscriber options) you have purchased from us or which you have enquired about, together with any additional information necessary to deliver those services and to respond to your enquiries;any additional information relating to you that you provide to us directly through our websites or by other means such as over the phone, via email or in person; andany additional information, images you provide to us, or authorize us to collect, as part of your interaction, membership or subscription with us.Prospective employees/applicantsWe collect personal information when recruiting personnel, such as your name, title, date of birth, gender, contact details, qualifications and work history (including references and other information included in a CV or cover letter as part of the application process). Generally, we will collect this information directly from you.We may also collect personal information from third parties in ways which you would expect (for example, from recruitment agencies or referees you have nominated). Before offering you a position, we may collect additional details such as your tax file number and superannuation information and other information necessary to conduct background checks to determine your suitability for certain positions.We may also collect relevant information from third party sources such as LinkedIn and other professional websites.Other individualsWe may collect personal information about other individuals who are not our members or subscribers. This includes members of the public who participate in events we are involved with; individual service providers and contractors to us; and other individuals who interact with us on a commercial basis. The kinds of personal information we collect will depend on the capacity in which you are dealing with us. Generally, it would include your name, contact details, and information regarding our interactions and transactions with you.If you are participating in an event we are managing or delivering, we may take images or audio-visual recordings which identify you.ShareholdersWe (or a share registry provider we may engage) may also collect information to maintain shareholder information in accordance with Australian Securities Exchange (ASX) requirements, such as:the name of the individual shareholder and any trustee (if applicable);personal details relating to any power of attorney (e.g. the attorney's name, address, occupation, date of birth and phone number);bank account details; andyour Securityholder Reference Number or Holder Identification Number.When we collect personal information from shareholders, we may also use and disclose it for other reasons related to your shareholding, such as identity verification, providing shareholder services, sending you correspondence and documents and responding to complaints and enquiries. We may also use your information to market our products and services, such as exclusive shareholder offers, to you.Visitors to our websiteThe way in which we manage the personal information of visitors to our website(s) is explained below.What happens if you don't provide your personal information?You may visit our website (www.jaxsta.com) or websites of related entities without identifying yourself. If you identify yourself (for example, by providing your contact details in an enquiry / logging into our online membership platform), any personal information you provide to us will be managed in accordance with this Privacy Policy.Our websites may contain links to third-party websites. We are not responsible for the content or privacy practices of websites that are linked to our website(s), and we encourage you to carefully read the privacy policy of any third-party website you visit.Our Cookies PolicyWhat is a cookie?Our websites use cookies. A 'cookie' is a small file stored on your computer's browser, which assists in managing customized settings of the website and delivering content. We collect certain information such as your device type, browser type, IP address, the pages you have accessed on our website and on third-party websites.While the cookie may identify your computer, it should not identify you unless you are registered with our website (for example, because you are a member and subscribe to our website) or logged in using your social media profile. In that case, the cookie will be linked to your profile so that we can identify you and provide more relevant content.Use of CookiesWe (or a third-party providing services to us) may use cookies, pixel tags, “flash cookies”, or other local storage provided by your browser or associated applications.Cookies may be used to provide you with our range of services including to identify you as a user or member or subscriber of our service, to remember your preferences, customise and measure the effectiveness of the service and our promotions, for advertising and marketing purposes, to analyse your usage of the service, and for security purposes.Cookies may collect and store your personal information. This Privacy Policy applies to personal information collected via cookies. You may adjust your internet browser to disable cookies. If Cookies are disabled, we may not be able to provide you with the full range of our services.You also may encounter Cookies used by third parties and placed on certain pages of the service that we do not control and have not authorised (such as webpages created by another user). We are not responsible nor are we liable for the use of such Cookies.The service may also include links to third party websites (including links created by users or members) and applications and advertising delivered to the service by third parties (Linked Sites). Organisations who operate Linked Sites may collect personal information including through the use of Cookies. We are not responsible nor liable for Linked Sites and recommends that you read the privacy policies of such Linked Sites before disclosing your personal information.Why we use cookiesWe use cookies to personalize your browsing experience (for example, by remembering your preferences and recognizing you as a repeat visitor to our website), and to track statistics about the usage of our websites. This allows us to better understand our users and improve the layout and functionality of our web"
