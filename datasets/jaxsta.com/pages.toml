full_description = "Last updated: 23 February 2024Terms & Conditions1. Introduction1.1 Jaxsta and the ServiceVinyl Group Operations Pty Ltd (ACN 605 344 054) (“Jaxsta”, “we” and “us”) provides the Jaxsta service, websites and communications (together, the “Service”) for music fans, creators and music professionals alike (“user”, “you” and “your”). The Service includes a website located at URL: jaxsta.com, as further described below.These Terms and Conditions (“Terms”) govern the provision by us of the Service to you. By creating an account or otherwise accessing or using the Service, you are agreeing to enter into this legally binding contract with Jaxsta (even if you are using our Service on behalf of a company, in which case you are entering into these Terms on behalf of such company and represent that you have the authority to do this). If you do not agree to these Terms, you must immediately delete your account or cease accessing or using the Service.In providing the Service to you, we may collect from you or you may provide us with certain information, including personal information, and you confirm that such information provided to us is complete, true and correct. The collection, holding, use and disclosure of your personal information is governed by our Privacy Policy (which includes our Cookies Policy), which is available on Jaxsta's website here. By agreeing to these T&Cs you also hereby agree to be bound by our Privacy Policy.1.2 Jaxsta SubscriptionJaxsta provides a number of products as referred to on the at website at https://jaxsta.com/subscriptions, that encompass subscription services with features available to its registered members depending on the level of service subscribed to (“Jaxsta Subscriptions”). The features available to registered subscribers are subject to change from time to time through the Service to Jaxsta subscribers.1.3 Changes to these T&CsWe may amend or update these Terms from time to time. If we make material changes to these Terms, we will take reasonable steps to provide you with notice through our Service, or by other means, to provide you the opportunity to review the changes before they become effective. If you object to any changes, you must close your account and otherwise cease using or accessing the Service. Your continued use of our Service after any changes are made to these Terms means that you agree to be bound by any such amended version of these Terms.2. Use of the Jaxsta Subscription Service and Registration2.1 Service eligibilityIn order to use Jaxsta Subscriptions, you must:be of the necessary age to enter into a binding contract with Jaxsta and not be barred from doing so under any applicable laws in your country of residence (“Necessary Age”) or, if you are under the Necessary Age, you confirm that you have permission from your parent or legal guardian (or, if you are an artist under the Necessary Age represented by a manager, such manager) to use the Service; andbe resident in a country where the Service is available.2.2 Registration for the ServiceIn order to use Jaxsta Subscriptions, you must register and become a member (“Member”) or if you have chosen not to register for our Service, you may access the Jaxsta Service as a visitor(“Visitor”). You acknowledge and agree that if you access our Service as a Visitor, you will not be able to access all the features of Jaxsta Subscriptions.In order to use the Service as a Member, you must register to use the Service by providing Jaxsta with certain true and correct information about yourself as requested by the registration page on the Service (“Member Information”). Member Information requested by us may include, but is not necessarily limited to:your first name and last name;your email address;your user name and password; andother information that may be required in order to provide the Service to you.You must promptly notify and/or update your account if any of your Member Information is incorrect or changes from time to time. By providing your contact details, you agree to Jaxsta contacting you via such means.When you register as a Member, you may sign up to an unpaid Jaxsta Subscription (“Jaxsta Subscription Free Account”) or a paid Jaxsta Subscription subscription (“Jaxsta Subscription Paid Account”).2.3 Registration for the Service by Credited EntitiesThe Service allows Members with a Jaxsta Subscription Free Account or Jaxsta Subscription Paid Account that are creators, artists, music professionals, managers (and/or their representatives) or music companies (each, a “Credited Entity”, and collectively, the “Credited Entities”) to ‘claim’ associated Credited Entity Profiles.A “Credited Entity Profile” is a Credited Entity profile page which contains official data associated with a specific Credited Entity and is publicly viewable by all Members.For clarity, Members can manage several Credited Entity Profiles, depending on the level of membership. When a Member claims a Credited Entity Profile, Jaxsta shall have the right to validate such Member's identity in order to determine if such Member will qualify as a Credited Entity, in Jaxsta's sole discretion.You agree that Jaxsta or a related entity may:use the fact that you have a Jaxsta Subscription Free Account or Jaxsta Subscription Paid Account and/or that you have claimed a Credited Entity Profile for our business purposes; anddirectly or indirectly benefit from the above facts.2.4 Jaxsta Analytics ServicesSubject to entering into a further agreement with us (“Jaxsta Analytics Services Agreement”) and the terms of such an agreement, when a Credited Entity links with its respective Credited Entity Profile(s), the Credited Entity is allowed to access certain features, functionality, information and services provided by us and/or our affiliates, which may include, but not be limited to:the ability to promote, market, display, message and make certain information available to users regarding work, products, services, events, tickets, audio-visual content and other related services; andanalysis, statistics, reports and other information regarding how users interact with a Credited Entity Profile and or their credited work and associated companies (“Jaxsta Analytics Services”).If a Credited Entity executes a Jaxsta Analytics Services Agreement, Jaxsta may grant to the Credited Entity a non-exclusive, non-transferable right to use certain information provided by Jaxsta to the Credited Entity through the Jaxsta Analytics Services, including analytics, statistics, reports and information regarding a Credited Entity's user base, social interaction and marketing and other similar related information (“Jaxsta Analytics Services Information”) solely for the Credited Entity's research and development purposes, subject to any limitations provided in these Terms and in the Jaxsta Analytics Services Agreement (including the following paragraph).If a Credited Entity executes a Jaxsta Analytics Services Agreement, the Credited Entity acknowledges and agrees that the Credited Entity will not disclose the Jaxsta Analytics Services Information to any competitors of Jaxsta or Jaxsta's affiliates, or use the Jaxsta Analytics Service Information for purposes which are competitive with, directly or indirectly, Jaxsta or Jaxsta's affiliates. Additionally, the Credited Entity also acknowledges and agrees that Jaxsta may develop products or services that may compete with any platform(s), businesses or any other products or services owned or controlled by the Credited Entity or any third party.If a Credited Entity executes a Jaxsta Analytics Services Agreement, the Credited Entity acknowledges and agrees that Jaxsta has no obligation to provide any technical support services in connection with the access to and/or use of the Jaxsta Analytics Services and/or Jaxsta Analytics Services Information. Subject to the terms of an existing Jaxsta Analytics Services Agreement between the Credited Entity and us, we reserve the right at any time to increase the fees for access to and/or use of the Jaxsta Analytics Service in our sole discretion.2.5 Security and your accountYou acknowledge that the internet is an inherently insecure communication medium, and you use the Service at your own risk. You agree that we have no responsibility for any use, misuse, loss, corruption, interception or delay of any content or other information or data uploaded, downloaded, hosted or otherwise communicated via the Service.You are solely responsible for maintaining the confidentiality and security of your username, password and other security-based information at all times, and you will remain responsible for all use of your username and password, and all activity emanating from your account, whether or not such activity was authorized by you. We are entitled to assume that you are the user of the Service if your username, password or other security-based information is used to access the Service.If your username or password is lost or stolen, or if you believe that your account has been accessed by unauthorized third parties, you are advised to notify Jaxsta in writing, and you must change your password at the earliest possible opportunity.As between you and others (including your employer and representatives), your Member account belongs to you. However, if your access to the Service was purchased by another party on your behalf (e.g. under a Jaxsta Subscriptions Paid Account for an enterprise), the party paying for such Service access has the right to control access to and request reports on your use of such paid Service access.2.6 PaymentIf you subscribe to any of our paid Service tiers (e.g. Boutique, Business, Enterprise), you agree to pay us the applicable fees and taxes and must agree to any additional terms supplied at the point of payment and/or registration specific to the paid Service tier. We may change the amount of the fees charged for our paid Service tiers at any time, provided we will give you notice prior to such a change taking effect. You acknowledge that if you do not pay fees and charges when they are due, your access to the Service and enjoyment and benefit of the Service may be delayed or suspended without notice, in Jaxsta's sole discretion.2.7 Content, sharing of submitted materialsAs part of the Service, Jaxsta may provide music, videos, data, images, files, scripts, photographs, lyrics, software, audio or other materials or content, often licensed to Jaxsta by third parties (“Content”).Our Service also allows Members to submit and share information, content and materials through their profile page, such as images and biography uploads (“Member Generated Content”). Jaxsta does not systematically review Member Generated Content submitted by Members and is not responsible for the form or content of any Member Generated Content. All such Member Generated Content shall be subject to Jaxsta's Digital Millennium Copyright Act (“DMCA”) policy below.Jaxsta's DMCA policyIf you choose to submit and share Member Generated Content:you must own or have the right to submit that Member Generated Content and you must have obtained all permissions necessary for us to include that Member Generated Content on the Service, including any permissions needed from third parties;the Member Generated Content must be true, accurate and complete in all respects;the Member Generated Content and its inclusion on the Service must not:infringe any intellectual property rights (including any copyright, database right or trademark right) of any person or be in breach of any legal duty owed to any person, such as a contractual duty or a duty of confidence;deceive or be likely to deceive any person;be used to impersonate any person (including Jaxsta and any of its representatives or any artist or individual or organization in the music industry) or to misrepresent your identity or affiliation with any person; orbe illegal, obscene, defamatory, threatening, pornographic, harassing, hateful, racially or ethnically offensive, encourage conduct that would be considered a criminal offense, give rise to civil liability, promote racism, bigotry, hatred or physical harm, violate any law or be otherwise inappropriate. If you become aware or reasonably suspect that any third-party content on the Service may infringe these requirements, you must promptly inform us in writing.Member Generated Content that you submit, or share may be seen by users or third parties (including via distributed data feeds). Where we have made settings available, we will use commercially reasonable efforts to honor the choices you make about who can see your Member Generated Content (e.g., restricting your profile visibility from Visitors or from search engines).You agree that Jaxsta may:edit or delete your Member Generated Content in our sole discretion, with or without notice to you;use your Member Generated Content for our business purposes; anddirectly or indirectly benefit from your Member Generated Content.You acknowledge that you should not upload Member Generated Content that infringes copyright, including but not limited to cover versions of songs you did not compose. Such posts may be subject to copyright infringement actions including but not limited to removal of the infringing Member Generated Content without notice to youUnless specified by another agreement you have with us we are under no obligation to regularly monitor the accuracy or reliability of your Member Generated Content incorporated into the Service. We reserve the right to modify or remove any Member Generated Content at any time.You acknowledge and agree that all Member Generated Content you provide on the Service will be publicly available information and you bear the risks involved with such public disclosures.You acknowledge that should you choose to post link to content on You Tube you are using YouTube's API in conjunction with the Services, and in so doing you are agreeing to be bound by the YouTube Terms of Service, which can be found at https://www.youtube.com/t/terms2.7 Content, sharing of submitted materialsAs part of the Service, Jaxsta may provide music, videos, data, images, files, scripts, photographs, lyrics, software, audio or other materials or content, often licensed to Jaxsta by third parties (“Content”).Our Service also allows Members to submit and share information, content and materials through their profile page, such as images and biography uploads (“Member Generated Content”). Jaxsta does not systematically review Member Generated Content submitted by Members and is not responsible for the form or content of any Member Generated Content. All such Member Generated Content shall be subject to Jaxsta's Digital Millennium Copyright Act (“DMCA”) policy below.Jaxsta's DMCA policyIf you choose to submit and share Member Generated Content:you must own or have the right to submit that Member Generated Content and you must have obtained all permissions necessary for us to in"
