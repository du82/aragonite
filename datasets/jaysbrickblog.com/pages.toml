["https://jaysbrickblog.com/about"]
title = "About Me - Jay's Brick Blog"
description = "Hello, and welcome to Jay’s Brick Blog!!! My name is Jay and this blog serves as a creative outlet where I can gush about everything I love about LEGO. Jay’s Brick Blog is a LEGO blog with a distinctive Aussie flavour that primarily focuses on high quality editorial content and perspectives from an average guy with an […]"
full_description = "Enter your email address here to receive updates about new posts from Jay's Brick Blog - straight to your inbox! My name is Jay and this blog serves as a creative outlet where I can gush about everything I love about LEGO. Jay’s Brick Blog is a LEGO blog with a distinctive Aussie flavour that primarily focuses on high quality editorial content and perspectives from an average guy with an above average love of LEGO. I’m here to help you make better purchasing decisions when it comes to LEGO, regularly writing LEGO set reviews to help you decide how to best spend your hard-earned dollars, and make the most of your LEGO fan experience. This blog is all about celebrating the love of LEGO, sharing exciting news and being a hub for LEGO fans to connect with one another. Jay’s Brick Blog is a Recognised LEGO Fan Media (new designation for recognised LEGO User Group). I mostly enjoy writing independent and comprehensive LEGO set reviews, updates on LEGO news and sales and sharing my perspectives and thoughts on the latest LEGO news. Whether you’re a brand new LEGO fan, someone rediscovering your love for LEGO or a seasoned collector/builder, I hope to write LEGO content that everyone can enjoy. If you’d like to keep up with the latest posts, I encourage you to subscribe to receive updates in your inbox or like the Jay’s Brick Blog Facebook page. If you have any questions or would just like to geek out with a fellow LEGO enthusiast, you can email me at: jaysbrickblog [at] gmail.com. Wall Street Journal – 10 Fascinating Facts About Lego—From World Records to David Beckham’s Obsession – 3 November 2022 New York Times – Lego Isn’t Just for Kids. Here’s How to Become an Adult Lego Master. – 1 June 2021 news.com.au – eBay has revealed this item is selling every second on its site for as much as $10,000 – 7 May 2019 Women In The World / New York Times – LEGO to release ‘Women of NASA’ figurines based on 5 American legends of space program – 2 March 2017"
