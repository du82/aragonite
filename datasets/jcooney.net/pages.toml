full_description = "Integration mapping with api-map How Should Two APIs be Integrated? As our apps become more and more integrated with different APIs figuring out how to make them ‘work together’ becomes a larger piece of the software development effort. Protocols and standards have made authentication and sending and receiving messages easier, but don’t help us to understand the contents of the messages. Some companies spend a lot of time designing their APIs and messages, whereas others seem to just surface the details of their underlying system. » 13 May 2020 Dotnet Core 3 on a $5/mo Linux VM Dotnet Core 3.0 is nearing release. At the time of writing preview 5 has been out for almost 1 month. I’ve been working on a small Dotnet Core 3 app which I eventually intend to run on GCP, but since GCP doesn’t currently support Dotnet Core 3 without creating your own custom app engine runtime I thought I would instead get my app up and running on a cheap and cheerful $5/mo Linux VM, courtesy of Digital Ocean. » 7 Jun 2019 You're Competing With Netflix, Probably As Peter Thiel noted in zero to one, it is common for companies to lie to themselves and to others, and claim they’re in a league of their own. The fatal temptation is to describe your market extremely narrowly so that you dominate it by definition. Suppose you want to start a restaurant that serves British food in Palo Alto. “No one else is doing it,” you might reason. “We’ll own the entire market. » 13 Dec 2018 Evergreen Skills for Software Developers Almost 12 months ago I delivered a talk at DDD Brisbane with my good friend Leon Bambrick because co-presenting is awesome. The “big idea” of the talk is that even though technology is changing more and more quickly there are things you can spend time learning that can last you the rest of your life. If you feel pressured by the pace of change this talk might give you some things to think about. » 19 Oct 2018 On The Merits of Using Standard Parts When I was much younger I had a european car. Not a fancy, nice, european car, but something that was just…“unusual”. One day the alternator in the car stopped working, and I needed a new one in order for my car to work again. The man from the auto-club shook his head, nodded sagaciously and said that if my car had been a Toyota, Ford or several other more popular brands I could be on my way for a few hundred dollars, because he carried alternators for those makes of cars in the back of his truck. » 4 Oct 2018"
