full_description = "Lessons from the Fountain Fountain is an iconic piece of ‘art’ produced by Marcel Duchamp [1], a white porcelain urinal with the words “R. Mutt 1917” scrawled on the side. While the original was lost (most likely thrown out after the exhibition) it has been the subject of controversy and discussion ever since. A small number of replicas were made during the 1950’s and In 1964 eight replicas were created by Duchamp. In 1999, one of these replicas sold at Sotheby’s for $1. » 10 Sep 2016 Data-bound Tags with At.js and Knockout.js I wanted to add an editor that supported tags to an existing web application that used knockout.js (I know, not what the cool kids are using but a full re-write just to add tags seemed ill-advised). After persevering with ProseMirror I decided it was too rich for what i wanted. All I needed was plain text + tags, not the full richness of ProseMirror. After doing a bit of investigation I found a nice little library called At. » 3 Aug 2016 Migrating to a different blog platform After over 5 years using DotNetBlogEngine I thought it was time to move on to something different. I was interested in a modern code-base that could run on linux. After a bit of searching around I settled on Hugo. I was initially tempted by Ghost, but wanted to try out life in the Go ecosystem for a little while, so Hugo fit the bill. Migrating Content Migrating my content was fairly straight-forward. » 2 Jul 2016 Building ProseMirror ProseMirror is another top-notch javascript library from Marijn Haverbeke, creator of CodeMirror and Eloquent Javascript author. Since ProseMirror is less mature than CodeMirror it currently doesn’t ship in a ‘built’ form, but instead as a mix-n-match set of modules (presumably as it matures it will be packaged differently). Since I’ve been out of the game a little bit with front-end development (or at least sticking with what I know) I wasn’t quite up with the tools I was going to need to compile ProseMirror. » 23 May 2016"
year_published = 2016
