["https://jcooney.net/page/2.html"]
title = "JCooney.NET"
description = "Joseph Cooney's Weblog"
full_description = "Product Documentation with Wyam I recently wanted to add documentation and a product blog to an existing asp.net application, and rather than build out a full data model to support this I decided I’d go with the static file generation route. Although I’d had good experiences with Hugo, which I used to generate this blog I decided to go with Wyam because its “docs” recipe was close to what I wanted. Although the Wyam docs suggested I could create a custom theme and then package it up via nuget, the path of least resistance turned out to be just copying the files I wanted to change from the existing Samson theme into the input folder (where your content goes) and changing them there. » 8 Oct 2017 Edge Cases Will Kill You Distributed systems can fail in lots of different ways. Messages not received, messages sent multiple times, messages received out of order, and concurrency issues arising from different parts of the system receiving or not receiving related messages in the right order, or at the right time. Network partitions force you to decide between consistency and availability. Good architecture and technology stacks can shield us from a lot of these problems, however if you start picking away at the edges you can invariably find problems that can still arise in complex distributed systems. » 6 Sep 2017 Lessons from the Skunk Works Lockheed-Martin’s Skunk Works has a hallowed place in the annals of engineering. Established in 1943 near a plastics factory in Burbank, California as a secretive, elite engineering group they built the first jet fighter for the United States, the P-80. Led by Kelly Johnson their chief engineer they completed this amazing feat in 143 days from the start of the design process to the first production model flying, under the severe resource and personnel shortages you would expect in a nation at war. » 3 Aug 2017 Choice, Happiness and Javascript Frameworks Malcolm Gladwell in his TED talk Choice, happiness and spaghetti sauce tells the story of Howard Moskowitz, a psychophysicist and market researcher and his insights into customer satisfaction. Howard’s big idea was that in many cases there was not one perfect platonic ideal for a particular product. Some people like chunky spaghetti sauce, some people like spicy, and some people like thin, blended spaghetti sauce. By trying to make a ‘one-size-fits-all’ product a lot of marketers and food scientists were making something that was the least offensive to most people, but was sub-optimal compared to multiple products in the same category, each tuned to the tastes of a particular ‘cluster’ of customers. » 27 Jan 2017"
year_published = 2017
clearnet = "https://jcooney.net/page/2.html"
