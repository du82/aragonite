["https://jdsupra.com/legalnews/europe-s-latest-energy-squabble-england-7722768"]
title = "Europe's Latest Energy Squabble - England Versus Norway | Flaster Greenberg PC - JDSupra"
description = "Great Britain’s Labour Prime Minister Keir Starmer has shaken up the British political scene since July 2024, including making a priority of a “Net Zero” policy regarding energy generation and..."
full_description = "Great Britain’s Labour Prime Minister Keir Starmer has shaken up the British political scene since July 2024, including making a priority of a “Net Zero” policy regarding energy generation and use in the United Kingdom. Led by Ed Miliband, who has the curious title of Secretary of State for Energy Security and Net Zero, Labour has initiated a policy seeking, among other things, to retrofit every building and electrify ground transport and heat. Recently those Net Zero plans have generated much controversy. A renowned British scientist sent a letter to Mr. Milband this week branding his Net Zero plans a “fantasy,” and claiming that the cost of such Net Zero transition will hit £4.4 trillion. (Source). Now Britain has another growing problem regarding the transition to renewable energy, this time in the field of international relations. On December 15, 2024, Norway and England announced a strategic partnership called the “Green Industrial Partnership” to increase cooperation concerning clean energy innovations. (Source). Great Britain doubled down on this by announcing the first construction of carbon capture projects in the Northeast of the Kingdom. The euphoria of that announcement did not last long. Even though Great Britain’s imports of Norwegian energy have risen to £41B from £19B in the last five years, (Source), the UK now is more dependent than ever on political events in Norway, and that country’s government fell in January over energy nationalism. Specifically, a junior partner in the Norwegian governing coalition quit over that government’s plans to implement European Union green energy laws. (Source). Importantly, before the Norwegian government’s fall, both governing parties indicated that they wished to end the energy supply deals that Norway has entered into with the United Kingdom and Germany. In December, as Germany faced a lack of wind, it dramatically increased its imports of Norwegian power, causing prices in southern Norway to soar by twenty times from one week to the next. A similar, if less dramatic price increase, occurred in Norway in 2022 when interconnection cables opened to both Great Britain and Germany. This has caused great consternation in the Scandinavian country, which suffers from energy prices that are six times the European average. (Source). The internal angst was so great that it brought down the government."
year_published = 2025
clearnet = "https://jdsupra.com/legalnews/europe-s-latest-energy-squabble-england-7722768"
