["https://jdsupra.com/legalnews/chevron-deference-decisions-and-its-2296813"]
title = "Chevron Deference Decisions and Its Implications on Businesses | Flaster Greenberg PC - JDSupra"
description = "A win for business. The Supreme Court ends Chevron Deference in a spate of recent decisions limiting administrative authority and assisting regulated parties in challenging agency rulemaking.   ..."
full_description = "On June 28, 2024, the Supreme Court announced decisions in a pair of cases-- Loper Bright Enterprises v. Raimondo and Relentless, Inc. v. Department of Commerce --that curtailed the power of federal agencies to regulate beyond constitutional limits. In the 6-3 ruling, written by Chief Justice John Roberts, Jr., the Court overruled a long-held doctrine of administrative law established in the 1984 decision of Chevron U.S.A., Inc. v. Nat. Res. Def. Council that required courts to defer to agency interpretations of ambiguities in statutes. In overruling this “Chevron Deference” doctrine, the Supreme Court held that courts, not agencies, rightfully have the power to interpret ambiguities in statutes. This decision likely will rein in agency discretion, giving judges the primary role in determining the meaning and applicability of any ambiguities in statutes, and place the onus back on Congress to draft more precisely worded statutes and address necessary updates to and gaps in statutes. This decision was issued with a spate of other Supreme Court decisions that limit agency discretion and provide litigants with a far better opportunity to resist agency rulemaking than before in seeking to resist what they believe amounts to an overreach of agency authority. On July 1, 2024, the Supreme Court held in Corner Post v. Board of Governors of the Federal Reserve System, that agency regulations are no longer exempt from legal challenges six years after going into effect. Rather, the Supreme Court ruled that the limitations period for claims arising under the Administrative Procedures Act does not begin to run until the plaintiff sustains an injury from final agency action. In so holding, the Supreme Court rejected the government’s argument that the six-year statute of limitations period begins once the agency action is finalized, which, of course, made it very difficult to challenge longstanding regulations. This decision suddenly exposed decades-old regulations to new challenges, and likely will lead to an uptick in litigation."
year_published = 2024
year_updated = 2024
