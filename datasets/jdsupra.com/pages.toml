["https://jdsupra.com/legalnews/california-ab-1415-and-expanded-ohca-6392482"]
title = "California: AB 1415 and Expanded OHCA Oversight — What Providers, MSOs, and Investors Need to Know | Foley & Lardner LLP - JDSupra"
description = "On February 21, 2025, California introduced AB 1415, a bill aimed at expanding the regulatory oversight of the Office of Health Care Affordability (OHCA). As discussed in our previous blog,..."
full_description = "On February 21, 2025, California introduced AB 1415, a bill aimed at expanding the regulatory oversight of the Office of Health Care Affordability (OHCA). As discussed in our previous blog, certain health care entities are required to provide written notice to OHCA of any proposed merger, acquisition, corporate affiliation, or other transaction that will result in a material change to the ownership, operations, or governance structure of a health care entity. AB 1415 seeks to expand the types of entities required to provide notice to OHCA by: Currently, the OHCA statutes and regulations define a “health care entity” as a payor, provider, or a fully integrated delivery system. AB 1415 would expand this definition to specifically include MSOs within the definition of a health care entity directly regulated by the statute. An MSO is defined in AB 1415 as “an entity that provides administrative services or support for a provider, not including the direct provision of health care services.” The bill specifies that administrative services may include, but are not limited to, functions such as utilization management, billing and collections, customer service, provider rate negotiation, and network development. This broad definition could capture a broader scope of administrative service providers that have not been traditionally considered an MSO. For example, a business that exclusively provides billing and collections services to health care organizations may be included within the definition of an “MSO,” even though they are not engaged in the management of a health care practice. While these functions align with typical MSO activities, AB 1415’s use of open-ended language in the definition could extend OHCA’s oversight to other intermediaries that support providers but do not exert managerial control over them, such as third-party administrators (TPAs) and health care technology firms. If interpreted broadly, AB 1415 could impose unintended compliance burdens on entities that offer administrative services without directly influencing health care delivery, potentially increasing regulatory complexity for non-clinical service providers."
year_published = 2025
