["https://jdsupra.com/legalnews/cfpb-expands-oversight-finalizes-new-2352444"]
title = "CFPB Expands Oversight: Finalizes New Rule Targeting Big Players in Digital Payments | Venable LLP - JDSupra"
description = "On November 21, the Consumer Financial Protection Bureau (CFPB) finalized a rule to supervise nonbank companies that offer digital wallets and payment apps. The rule allows the CFPB to supervise..."
full_description = '''On November 21, the Consumer Financial Protection Bureau (CFPB) finalized a rule to supervise nonbank companies that offer digital wallets and payment apps. The rule allows the CFPB to supervise and examine nonbank companies in the market for "general-use digital consumer payment applications" that handle more than 50 million transactions per year. The CFPB already has enforcement authority over these companies, but this rule now allows the CFPB to conduct examinations. The CFPB has the authority to examine certain firms, including banks, credit unions, payday lenders, and nonbank mortgage companies. But it can also extend supervisory authority to larger nonbank entities. According to CFPB Director Rohit Chopra, digital payments have gone from "novelty to necessity" as consumers use payment apps for daily transactions at rates that rival or exceed the use of cash. This move aligns with the CFPB's broader goal of strengthening oversight of technology companies in consumer finance. By expanding its supervisory authority, the agency aims to detect and address issues early, ultimately reducing consumer harm. The CFPB highlighted its intent to focus on areas such as data privacy, error resolution, fraud prevention, and "debanking" (account closures or freezes). The original proposal, released in November 2023, set the supervisory threshold at five million transactions. The CFPB increased this to fifty million in the final rule after considering comments that noted that many small and mid-size companies would be subject to supervision. Certain types of transactions, including international money transfers, extensions of consumer credit (initiated through a digital application provided by the entity who is extending, brokering, acquiring, or purchasing the credit), purchases for goods and services (when conducted through the seller's online or physical store or marketplace), and fundraiser donations (when conducted through a donation/fundraiser platform), do not count towards the 50 million transactions threshold.'''
year_published = 2024
