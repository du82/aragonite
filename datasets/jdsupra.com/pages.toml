["https://jdsupra.com/legalnews/big-workplace-ai-implications-buried-in-3842942"]
title = "Big Workplace AI Implications Buried in Groundbreaking Data Privacy Proposal: What Employers Need to Know | Fisher Phillips - JDSupra"
description = "A provision that would significantly disrupt the use of artificial intelligence in the workplace is buried deep in a bipartisan federal proposal to legislate data privacy. If the American Privacy..."
full_description = "A provision that would significantly disrupt the use of artificial intelligence in the workplace is buried deep in a bipartisan federal proposal to legislate data privacy. If the American Privacy Rights Act is passed by Congress as currently proposed, employers would be required to notify applicants and workers when AI is used for workplace decisions – and also allow workers to force employers to remove AI from the equation if they choose to “opt out” of its use for consequential employment decisions. Many questions remain and the proposal is still a long way off from becoming the law of the land. But this issue bears close monitoring due to its potential to be an absolute game-changer. What do employers need to know about this breaking news development? You can read about the 10 things that employers need to know about the bipartisan data privacy proposal here. The sole focus of this Insight will be on the AI implications for employers. The AI portion of the proposal would require employers to do two things if they use AI for certain workplace uses: The proposal applies to “covered algorithms,” which expressly includes the use of AI. It defines a covered algorithm as any computational process, including one derived from machine learning, statistics, or other data processing “or artificial intelligence techniques.” This definition is incredibly broad. It could apply to an incredibly broad array of programs used by employers to manage human capital. If the proposal becomes law, employers will need to take stock in exactly what products they are using that may contain some aspect of machine learning, statistics, or other data processing, including AI to ensure compliance. The proverbial “I didn’t know” defense will not work. The proposal says that the obligation would kick in when employers use AI to make “or facilitate” a “consequential decision.” Once we determine what AI uses would be covered by the law, employers would be required to provide notice of that use to applicants and workers. To comply with the law, employers would need to provide “meaningful information” to the applicant or employee about how the AI tool makes or facilitates the consequential decision, including the range of potential outcomes."
year_published = 2024
