["https://jdsupra.com/legalnews/10-things-employers-need-to-know-about-2315468"]
title = "10 Things Employers Need to Know About Senate’s New AI Roadmap | Fisher Phillips - JDSupra"
description = "A bipartisan group of Senate leaders unveiled a long-awaited artificial intelligence “roadmap” yesterday, laying out their hopes for potential legislation that would govern the use of AI across..."
full_description = "A bipartisan group of Senate leaders unveiled a long-awaited artificial intelligence “roadmap” yesterday, laying out their hopes for potential legislation that would govern the use of AI across the country and ensure the U.S. stays on the frontline of AI innovation. And while the roadmap covers several key workplace-related proposals, what’s not included in the roadmap is almost as important – meaning we can expect to see a great deal of AI governance left to the states. What are the 10 things employers need to know? The roadmap is the culmination of almost a year’s worth of work by Senate leaders. We covered the AI Insight Forums held by the Senate last year as they laid the groundwork for the policy proposals we see in yesterday’s roadmap. However, the roadmap – crafted by Sen. Chuck Schumer (D-N.Y.), Sen. Mike Rounds (R-S.D.), Sen. Martin Heinrich (D-N.M.), and Sen. Todd Young (R-Ind.) – doesn’t include any specific legislative language. It reads more like a wish list of proposals they would like to see become reality. While the 31-page roadmap covers a broad spectrum of issues, the role of AI in the workplace plays a prominent role. It specifically calls for employers, unions, and employment-related organizations to be involved in the legislative development process given all of the many issues arising. The roadmap notes that many workers are worried about AI impacting their jobs – from blue-collar positions all the way up to C-suite executives. It calls for the exploration of possible solutions – including private sector best practices – to the impact that AI will have on the long-term future of work. It also calls for the development of an “appropriate policy framework” in response, including ways that government can help combat disruptive job displacement. The roadmap also calls for the development of legislation that would boost training, retraining, and upskilling workers so they can successfully participate in an AI-enabled economy. It specifically mentions the idea of offering incentives for businesses that develop strategies to integrate new technologies and reskill employees."
year_published = 2024
clearnet = "https://jdsupra.com/legalnews/10-things-employers-need-to-know-about-2315468"
