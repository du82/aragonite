["https://jdsupra.com/legalnews/caused-in-whole-or-in-part-by-4341572"]
title = "Caused, in Whole or In Part, By: Additional Insured Coverage in the Wake of Burlington v. NYCTA | Goldberg Segalla - JDSupra"
description = "Obtaining additional insured coverage is one critical tool in the risk transfer toolbox. Owners and contractors on construction projects routinely ask “downstream” contractors and subcontractors..."
full_description = "Obtaining additional insured coverage is one critical tool in the risk transfer toolbox. Owners and contractors on construction projects routinely ask “downstream” contractors and subcontractors to sign contracts wherein the latter agrees to provide the owners and contractors with additional insured coverage for accidents or damages resulting from the performance of their work on the project. Similarly, owners routinely ask tenants in lease agreements to provide the owners with additional insured coverage for accidents resulting from the use of the premises. The purpose of that coverage is to transfer the risk to the entity closest to controlling the risk. Whether a party claiming to be an additional insured is actually entitled to additional insured coverage under another entity’s policy depends on the policy that was procured, whether it has an additional insured endorsement, and the scope of the coverage under that endorsement. The endorsement rather than the insurance procurement provision of the applicable contract or lease controls whether coverage is actually available. Because additional insured coverage is integral to risk transfer, New York courts are constantly deciding issues related to additional insured coverage. In fact, if you performed a nationwide search on Lexis Nexis for 2020 cases where the term “additional insured” appears, there are 560 results. If you search only New York, the number is 224. In July 2017, the New York Court of Appeals decided a seminal case impacting the scope of additional insured coverage when Burlington Ins. Co. v. NYC Tr. Auth., 29 N.Y.3d 313 (2017) was published. That decision has been analyzed by numerous motion courts and throughout the State’s four appellate divisions. Those decisions have attempted to resolve exactly what the Court of Appeals decided when it rendered its opinion in Burlington and the impact of that decision on both the duty to defend and indemnify those seeking additional insured coverage. The purpose of this article is to discuss some of these recent opinions in order to provide attorneys and insurance professionals with guidance regarding the scope of additional insured coverage, including when the duty to defend starts and ends."
year_published = 2022
