["https://jdsupra.com/legalnews/banking-on-a-nonbank-bank-in-2024-the-2533440"]
title = "Banking on a Nonbank Bank in 2024 - The ILC Option Revisited | Venable LLP - JDSupra"
description = 'Becoming or owning an industrial loan company (or ILC)—the elusive "nonbank bank" option, as Congress coined the term in 1987— still has an allure for financial services providers that want to...'
full_description = '''Becoming or owning an industrial loan company (or ILC)—the elusive "nonbank bank" option, as Congress coined the term in 1987— still has an allure for financial services providers that want to (1) lend on a national scale while avoiding state-by-state licensure, (2) accept (insured) deposits with some limits, and (3) avoid full, comprehensive regulation and supervision of parent companies and various affiliates by the Federal Reserve under the Bank Holding Company Act. Fintechs and other non-banks considering becoming or obtaining an ILC may have noted some recent developments at the FDIC, including the approval of a (kind of) new ILC's application for FDIC deposit insurance, as well as a proposed rule concerning the FDIC regulations for parent companies of ILCs. Earlier this summer, the FDIC approved a deposit application for an ILC submitted by Thrivent Financial for Lutherans (Thrivent) for Thrivent Bank, a Utah-chartered ILC. Thrivent is a fraternal benefit society, which is a unique type of organization that is owned by members who share a common bond. It offers financial products and services and sponsors Thrivent Federal Credit Union. Thrivent Bank will merge with the credit union and absorb its products, customers, and personnel. Thrivent Bank's services will be available to new customers nationwide, regardless of religious affiliation, and it will operate online only. In approving the application, Acting Comptroller of the Currency Michael Hsu, who is an FDIC director, remarked that the ILC "would look a lot like a community bank." That says a lot. The FDIC is fundamentally comfortable with the community bank model. The FDIC's approval does not amount to a credible federal option for fintechs or other organizations interested in providing financial services that do not look a lot like community banks. While another administration may take a different tack, the current administration or one that follows in its footsteps is not expected to change this policy at the FDIC in the near term.'''
year_published = 2024
