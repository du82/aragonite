["https://jdsupra.com/legalnews/ai-hiring-tools-under-attack-aclu-files-2920498"]
title = "AI Hiring Tools Under Attack: ACLU Files Claims with Feds Over Common Hiring Tools | Fisher Phillips - JDSupra"
description = "The ACLU recently fired a clear warning shot to employers by asking the FTC to investigate a personality assessment test, a video interview tool, and a cognitive ability assessment screening..."
full_description = "The ACLU recently fired a clear warning shot to employers by asking the FTC to investigate a personality assessment test, a video interview tool, and a cognitive ability assessment screening device – all powered by artificial intelligence – because of alleged discrimination. The May 30 complaint follows the ACLU filing a charge with the EEOC over the same AI tools, alleging they unfairly screen out applicants with disabilities and unfairly target those with certain racial backgrounds. What do employers and AI developers need to know about these aggressive maneuvers and how should employers adjust when it comes to hiring? The three tools under attack were developed by Aon Consulting, a major player in the assessment field. The ACLU claims that these tools assess general personality traits such as positivity, emotional awareness, liveliness, ambition, and drive that are not job-related or necessary for a specific job. It claims they can unfairly screen out people based on disabilities, as those with depression, anxiety, and autism (to name a few) can be scored low without regard to their actual job skills. The ACLU specifically says that the use of AI to fuel these tools does nothing but exacerbate these fundamental problems. In fact, it alleges that the video interviewing tool is likely to discriminate based on disability, race, and other protected characteristics because of the AI data relied upon by the programs. The ACLU cites data showing that the average gridChallenge scores for assessment-takers of different races reveals troubling disparities. It claims that a study revealed Asian, Black, Hispanic or Latino, and other test-takers scored lower than white test-takers on average. It also claims that gridChallenge can discriminate against those with cognitive impairments and various mental health disabilities. For example, it contends that autistic people score significantly lower on various measures of working memory compared to individuals in the general population."
