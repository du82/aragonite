["https://jdsupra.com/legalnews/france-s-energy-straightjacket-and-4355464"]
title = "France's Energy Straightjacket and America's Energy Independence | Flaster Greenberg PC - JDSupra"
description = "Ever since the beginning of the Israeli assault on Hezbollah in Lebanon, France’s President Emmanuel Macron has been taking an increasingly strong public stance against the actions of the Jewish..."
full_description = "Ever since the beginning of the Israeli assault on Hezbollah in Lebanon, France’s President Emmanuel Macron has been taking an increasingly strong public stance against the actions of the Jewish State, if not against the country itself. On October 7, Macron demanded an arms embargo against Israel. This resulted in criticism even from members of his own party. (Source) Acrimony between Macron and Israeli Prime Minister Benjamin Netanyahu continued throughout October. Most recently, on October 24, Macron stepped up the criticism, accusing Israel of “sowing barbarism’, and drawing yet another sharp rebuke from Netanyahu. (Source). Macron’s increasing stridency has surprised even members of his own party. Perhaps he is trying to follow the French Gaullist tradition in staking out positions that contrast with whatever the Americans seem comfortable with in an attempt to assert French leadership, (Source) but a closer look indicates that his pronouncements may have more to do with economic interests than with any real change in ideology. A case in point is France’s increasing involvement with Qatar. In February, Macron announced that France was entering into a €10B strategic partnership with Qatar “to the mutual benefit of both countries.” (Source). Paris is interested in selling weapons, including aircraft, to the gas-rich emirates. (Source). Qatar’s sovereign wealth fund also has investments in top-tier French hotels (Source), luxury goods companies and retail. (Source). The question all of this now raises is how much influence Qatari investments, fueled by extraordinary oil wealth, may be having over French foreign policy. Despite having a population of only 350,000 citizens out of 3 million residents (most of whom are there on work visas (Source), Qatar boasts oil reserves estimated at 25.2 billion barrels, making it the 13th largest in the world (Source). However, more importantly, Qatar was also the world’s third-largest exporter of liquefied natural gas (LNG), after the U.S. and Australia, as of 2022, and it shares the South Pars gas field (Source) with Iran."
