title = "California Enacts New Franchise Broker Law | Polsinelli - JDSupra"
description = "On Sept. 24, 2024, California Gov. Gavin Newsom signed Senate Bill 919, the California Franchise Broker Law, into law. Officially titled the “Franchise Investment Law: Franchise Brokers,” the..."
full_description = "On Sept. 24, 2024, California Gov. Gavin Newsom signed Senate Bill 919, the California Franchise Broker Law, into law. Officially titled the “Franchise Investment Law: Franchise Brokers,” the California Franchise Broker Law amends the California Franchise Investment Law to require franchise brokers to comply with annual registration and presale disclosure requirements. Beginning in 2026, the California Franchise Broker Law will require franchise brokers to register with the California Department of Financial Protection and Innovation (DFPI) before attempting to offer or sell a franchise in California. In this regard, the California Franchise Broker Law is similar to the existing franchise broker registration laws in New York and Washington. However, the California Franchise Broker Law goes further and imposes an additional presale disclosure obligation upon all franchise brokers. Specifically, a franchise broker may not communicate with a prospective franchisee about investing in a franchise opportunity until the franchise broker first provides the prospective franchisee with a copy of the broker’s disclosure document. Various details regarding California’s new broker registration and disclosure regime remain to be sorted out, and we expect California will issue official guidance over the coming year. Below is a summary of the California Franchise Broker Law as it currently stands. The California Franchise Broker Law applies to franchise brokers. It defines a “franchise broker” as “a person who directly or indirectly engages in the business of the offer or sale of a franchise, regardless of the title used by the person or any organization with which they are affiliated, and receives or is promised a fee, commission or other form of consideration from a franchisor, subfranchisor, franchisee or affiliate of a franchisor, subfranchisor or franchisee.” Common titles for a franchise broker may include franchise seller, broker network, broker organization, franchise sales organization, consultant and coach."
