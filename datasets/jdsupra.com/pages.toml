["https://jdsupra.com/legalnews/cfpb-proposes-interpretive-rule-6164678"]
title = "CFPB Proposes Interpretive Rule Clarifying EFTA Application to Crypto and Other Emerging Payment Mechanisms | Venable LLP - JDSupra"
description = "The Consumer Financial Protection Bureau (CFPB) has proposed an interpretive rule aimed at addressing what it views as ambiguities in the application of the Electronic Fund Transfer Act (EFTA)..."
full_description = '''The Consumer Financial Protection Bureau (CFPB) has proposed an interpretive rule aimed at addressing what it views as ambiguities in the application of the Electronic Fund Transfer Act (EFTA) and its implementing Regulation E to emerging payment mechanisms. The potential changes are relevant for crypto exchanges, digital gaming platforms, online marketplaces, and others. This development signals the Biden/Chopra CFPB's intention to influence the regulatory framework of the rapidly evolving landscape of financial technology and payment systems before new leadership takes control. The CFPB has opened the proposal for public comment through March 31, 2025. Passed in 1978, the EFTA was designed to regulate electronic fund transfers (EFTs) through consumer accounts, establishing rights and responsibilities for both financial institutions and consumers. The statute has since been interpreted to accommodate innovations in payments, including debit cards, payroll cards, and prepaid accounts. However, recent advancements in digital wallets, stablecoins, virtual currencies, and other emerging mechanisms have outpaced existing regulatory clarity. In its notice, the CFPB cited its ongoing research into novel payment systems and identified gaps in consistent application of EFTA protections, which could harm consumers or create competitive disadvantages for certain market participants. 1. Expanded Definition of "Funds": The CFPB interprets "funds" under EFTA to include assets such as stablecoins and other fungible digital assets used as a medium of exchange or for payments. This interpretation aligns with some recent case law that has classified cryptocurrencies as "funds" in various legal contexts. 2. Broader Scope of "Accounts": The rule clarifies that the EFTA applies to "other consumer asset accounts," which may include virtual currency wallets, gaming platform accounts, and proprietary digital balance products, provided they are used for personal, family, or household purposes.'''
year_published = 2025
clearnet = "https://jdsupra.com/legalnews/cfpb-proposes-interpretive-rule-6164678"
