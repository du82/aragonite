["https://jdsupra.com/legalnews/colorado-lawmakers-pass-landmark-ai-8764968"]
title = "Colorado Lawmakers Pass Landmark AI Discrimination Bill – and Employers Across the Country Should Take Notice | Fisher Phillips - JDSupra"
description = "Colorado is close to becoming the first state to enact a law prohibiting employers from using artificial intelligence to discriminate against their workers – and requiring companies to take..."
full_description = "Colorado is close to becoming the first state to enact a law prohibiting employers from using artificial intelligence to discriminate against their workers – and requiring companies to take extensive measures to avoid such algorithmic discrimination. The landmark AI bill, which passed the state legislature on May 8, would also impose broad rules on developers of high-risk artificial intelligence systems and the businesses that use them. If enacted, the law would fully take effect in 2026 and target discrimination arising from AI used to make important decisions – such as hirings and firings. We’ll cover the key points so Colorado employers can prepare and businesses across the country can understand what is likely to eventually head your way. The Colorado legislature passed SB 205 on May 8. If signed by Gov. Jared Polis, the bill would apply to certain companies that develop or use “high-risk artificial intelligence systems” – meaning AI systems that make or are a substantial factor in making “consequential decisions” impacting: One of the main purposes of the bill is to prevent “algorithmic discrimination” – which occurs when the use of AI systems results in unlawful differential treatment or impact disfavoring certain individuals or groups based on protected classifications (for example, age, disability, race, religion, or sex). If this sounds familiar, it’s because it seems to closely model the EU’s AI Act, which also classifies AI use in employment settings as “high risk.” If enacted, “developers” and “deployers” of high-risk AI systems would have a legal duty, beginning on February 1, 2026, to use reasonable care to avoid algorithmic discrimination in the AI system. The attorney general would have exclusive authority to enforce the new rules. In an enforcement action, there would be a rebuttable presumption that a developer or deployer used reasonable care if it complied with the rules applicable to it under the new bill and any other rules established by the attorney general."
