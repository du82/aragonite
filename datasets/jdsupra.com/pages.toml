["https://jdsupra.com/legalnews/cfpb-homes-in-on-mortgage-junk-fees-3090537"]
title = 'CFPB Homes in on Mortgage "Junk Fees" | Venable LLP - JDSupra'
description = "Recent releases from the Consumer Financial Protection Bureau (CFPB) show that the mortgage industry is in the crosshairs of the CFPB's campaign against so-called junk fees. Earlier this year,..."
full_description = '''Recent releases from the Consumer Financial Protection Bureau (CFPB) show that the mortgage industry is in the crosshairs of the CFPB's campaign against so-called junk fees. Earlier this year, the CFPB indicated its interest in mortgage servicing fees when it, along with the Federal Trade Commission, filed an amicus brief in a case concerning whether payment convenience fees, what the Bureau calls "pay-to-pay" fees, are permissible when collecting mortgage loan payments. The CFPB argued that, unless the payment convenience fee was explicitly authorized by the mortgage agreements, payment convenience fees may not be charged by a mortgage servicer acting as a debt collector under the Fair Debt Collection Practices Act. Now, the CFPB is releasing guidance, in the form of a Supervisory Highlights and a blog post, regarding the imposition of "junk fees" during the life cycle of a mortgage loan transaction. Each signals the CFPB's further attention on junk fees and a return of focus on mortgage originators and servicers after the COVID-19 pandemic. Last month, the CFPB released an issue of its Supervisory Highlights focused on mortgage servicing and, in particular, loss mitigation and fee practices. The CFPB also noted that it is currently reviewing Regulation X's existing framework to "simplify and streamline" the mortgage servicing rules. The Supervisory Highlights focused on the following acts and practices, among others, that the CFPB states amount to unfair, deceptive, or abusive acts or practices (UDAAPs) and violations of mortgage servicing law and regulations, such as Regulation X and Regulation Z: The CFPB's Supervisory Highlights are an important source of insight into the CFPB's supervisory efforts and offer guidance to covered persons on the practices the CFPB is currently scrutinizing. That said, Supervisory Highlights do not provide detail concerning how many covered persons were engaged in the conduct cited or the effects of the finding on the institution. They can be best used as a guidepost or benchmark to ensure that current practices are compliant with current law and, if a servicer is engaging in a practice cited in the Supervisory Highlights, as a notice to modify current practices and procedures.'''
year_published = 2024
