["https://jdsupra.com/legalnews/collecting-ip-addresses-not-an-invasion-8993294"]
title = "Collecting IP Addresses? “Not An Invasion of Privacy,” Says New York Federal Court in CIPA Pen-Register Action | Mayer Brown - JDSupra"
description = "On February 18, 2025, US District Judge Edgardo Ramos of the United States District Court of the Southern District of New York granted the defendant’s motion to dismiss against a plaintiff..."
full_description = "On February 18, 2025, US District Judge Edgardo Ramos of the United States District Court of the Southern District of New York granted the defendant’s motion to dismiss against a plaintiff bringing claims under California Invasion of Privacy (CIPA) Section 638.51, which prohibits the use of a pen register absent a court order, for lack of Article III standing. The court held in Gabrielli v. Insider, Inc.,2025 WL 52515 (S.D.N.Y. Feb. 18, 2025) that the disclosure of an IP address does not bear a close relationship to the common law public disclosure of private facts and intrusion upon seclusion invasion of privacy torts—or to the traditional understanding of unjust enrichment—and cannot establish standing under TransUnion v. Ramirez,594 U.S. 419 (2021). The court also held that alleging a violation of CIPA Section 638.51 is the kind of statutory violation that is “a bare procedural violation, divorced from any concrete harm” and likewise cannot confer standing under Spokeo v. Robins,578 U.S. 330 (2016). California Penal Code Section 638.51 (“Section 638.51”) prohibits a person from “install[ing] or us[ing] a pen register . . . without first obtaining a court order[.]” California Penal Code Section 638.50(b) defines a “pen register” as “a device or process that records or decodes dialing, routing, addressing, or signaling information transmitted by an instrument or facility from which a wire or electronic communication is transmitted, but not the contents of a communication.” In other words, pen registers trace outgoing signals from a phone or computer, like which phone numbers are being dialed by a certain phone. Pen registers are typically used in law enforcement investigations. It is no secret that the plaintiffs’ bar has taken a particular interest in several of CIPA’s provisions to bring waves of class actions against website operators based on novel theories applying this decades-old statute to commonplace online tools like cookies and pixels. In 2024, plaintiffs’ attorneys set their sights on a new theory, arguing that the collection and disclosure of the IP addresses or similar information about website visitors violates CIPA’s “pen register” provision, Section 638.51."
year_published = 2025
