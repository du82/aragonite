["https://jdsupra.com/legalnews/chatgpt-is-rolling-out-a-new-version-5697721"]
title = "ChatGPT Is Rolling Out a New Version for Universities: Here’s What Your School Needs to Know | Fisher Phillips - JDSupra"
description = "ChatGPT quickly became unavoidable in higher education after its release in 2022. While the artificial intelligence chatbot can be a valuable tool on college campuses, it also raises serious..."
full_description = "ChatGPT quickly became unavoidable in higher education after its release in 2022. While the artificial intelligence chatbot can be a valuable tool on college campuses, it also raises serious concerns – such as widespread student cheating and data privacy issues. Now, the developer behind this technology, OpenAI, is about to release “ChatGPT Edu” – a new version that is specifically aimed at higher education. While this new AI tool may benefit students, faculty, researchers, and campus operations, there are important considerations to keep in mind. We’ll explain everything you should know and cover the top considerations for deciding if ChatGPT Edu might be right for your school. OpenAI introduced ChatGPT Edu on May 30, describing it as “a version of ChatGPT built for universities to responsibly deploy AI to students, faculty, researchers, and campus operations.” Both ChatGPT and this latest version are chatbots and forms of generative AI, but ChatGPT Edu can further be categorized as “enterprise AI” since it integrates advanced AI technologies within large organizations – such as universities. ChatGPT Edu, which is expected to start rolling out this summer, builds on the positive impacts its predecessor has made (or has the potential to make) in higher education. This includes capabilities related to personalized tutoring, student resume review, help with grant applications, and assisting faculty with grading and feedback. The new product follows success stories at some top universities that have used ChatGPT Enterprise, a subscription-based plan launched in August 2023. While only limited information on ChatGPT Edu is currently available, it could have potential benefits for your educational institution. ChatGPT Edu provides access to GTP-4o (the latest version of ChatGPT), advanced capabilities (such as data analytics, web browsing, and document summarization), improved language capabilities, significantly higher message limits in comparison to the free version of ChatGPT, and the ability to build custom versions of ChatGPT and share them within university workspaces."
year_published = 2024
