["https://jdsupra.com/legalnews/cfpb-issues-faqs-expands-interpretive-9695870"]
title = "CFPB Issues FAQs: Expands Interpretive Rule for BNPL Products | Venable LLP - JDSupra"
description = "On September 18, the CFPB issued a set of Frequently Asked Questions (FAQs) related to Buy Now, Pay Later (BNPL) products. These FAQs follow the CFPB's release of the 2024 BNPL Interpretive Rule..."
full_description = '''On September 18, the CFPB issued a set of Frequently Asked Questions (FAQs) related to Buy Now, Pay Later (BNPL) products.[1] These FAQs follow the CFPB's release of the 2024 BNPL Interpretive Rule (Interpretive Rule), which subjected BNPL products to certain provisions of Regulation Z that typically apply to conventional credit card providers. The Interpretive Rule became effective on July 30, 2024. However, on August 16, 2024, Director Chopra stated in a BNPL blog post that the CFPB would not enforce the rule right away. Specifically, the blog post stated that "the CFPB does not intend to seek penalties for violations of the rules addressed in the interpretive rule against any Buy Now, Pay Later lender while it is transitioning into compliance in a good faith and expeditious manner." These FAQs are intended to serve as guidance with respect to how to apply Regulation Z requirements to Pay-in-Four BNPL products accessed through digital user accounts (DUAs). The FAQs have three sections: 1) a general description of BNPL products and DUAs, 2) the scope and coverage of Pay-in-Four BNPL loans, and 3) the requirements for periodic statements for Pay-in-Four BNPL loans. Each section is addressed in detail below. The CFPB defines BNPL products as loans that are 1) structured as installment loans, in which the consumer incurs debt and has the right to defer payment, and 2) made to consumers for the purchase of personal, family, or household goods and services. The CFPB further states that some features of BNPL products may vary from product to product, such as the interest rate, finance charges, other fees, and the number of installments. A digital user account (DUA) is defined as a secure, personal profile that the BNPL provider activates for a consumer, enabling the consumer to access and use BNPL credit. A DUA permits a consumer to access Pay-in-Four BNPL loans as a form of payment for purchasing goods or services. In the FAQs, the CFPB defines Pay-in-Four BNPL loans to consumers as made by the BNPL loan provider that 1) are structured as closed-end installment loans, in which the consumer incurs debt and has the right to defer payment, 2) are made for the purchase of goods and services for the consumer's personal, family, or household use, 3) are payable in four installments, and 4) do not incur interest or other finance charges. Moreover, the CFPB explicitly states that the FAQs are only referring to the typical Pay-in-Four BNPL loans accessed through digital user accounts issued by the BNPL loan provider or their agent, as discussed in the Interpretive Rule. The CFPB also states that those BNPL loan providers that assess a finance charge are not the subject of the FAQs but may be otherwise subject to Regulation Z.'''
year_published = 2024
