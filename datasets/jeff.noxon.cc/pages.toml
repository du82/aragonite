["https://jeff.noxon.cc/2014/05/09/migrating-virtual-machines-from-amazon-ec2-to-google-compute-engine"]
title = "Migrating virtual machines from Amazon EC2 to Google Compute Engine - @jnoxon's thoughts"
description = """
My Amazon EC2 discount contract is almost up, and I’ve been playing with Google Compute Engine (GCE). Initial impressions are that it’s faster and costs less money, particularly if you don’t want to pay up-front for EC2 reserved instances. Google’s web console is more modern than Amazon’s, though slightly less sophisticated. Google’s CLI tools are much faster and don’t require Java. Google’s API uses JSON instead of XML.
In terms of capabilities, GCE is not as advanced as EC2, but it’s vastly more powerful than Linode, Digital Ocean, and the like."""
full_description = 'My Amazon EC2 discount contract is almost up, and I’ve been playing with Google Compute Engine (GCE). Initial impressions are that it’s faster and costs less money, particularly if you don’t want to pay up-front for EC2 reserved instances. Google’s web console is more modern than Amazon’s, though slightly less sophisticated. Google’s CLI tools are much faster and don’t require Java. Google’s API uses JSON instead of XML.In terms of capabilities, GCE is not as advanced as EC2, but it’s vastly more powerful than Linode, Digital Ocean, and the like. One exception is that Google doesn’t permit sending SMTP directly from GCE instances. They have a partnership with Sendgrid for that. I’m using Mandrill instead, and so far I’m very pleased with that choice.Migration from EC2 to GCE without re-installationIt’s possible to migrate virtual machines from EC2 to GCE. This post explains how I migrated my production Ubuntu 12.04 LTS instance. It’s not a detailed guide. If you possess a good amount of Linux operations knowledge, I hope the information here will help you do your own migration quickly.AssumptionsYou’re an experienced Linux system administrator.You’ve managed to boot an instance on Google Compute Engine already.You’ve read Google’s documentation on building boot images from scratch.Important differences between EC2 and GCEEC2 uses Xen for virtualization. GCE uses KVM.Most EC2 instances are paravirtualized (PV). They do not emulate actual PC hardware, and depend on Xen support in the kernel. Most of the time, EC2 instances use PVGRUB to boot. PVGRUB is part of the Amazon Kernel Image (aki-xxxxxxxx) associated with your instance. PVGRUB basically parses a GRUB configuration file in your root filesystem, figures out what kernel you want to boot, and tells Xen to boot it. You never actually run GRUB inside your instance.With KVM, you have a full hardware virtual machine that emulates a PC. It requires a functioning bootloader in your boot disk image. Without one, you won’t boot. Fixing this, and using a kernel with the proper support, are the two main obstacles in migrating a machine from EC2 to GCE.Let’s get started.On EC2:Snapshot your system before you do anything else. If you’re paranoid, create the snapshot while your system isn’t running.Install a recent kernel. The Ubuntu 12.04 LTS kernel images don’t have the virtio SCSI driver needed by GCE. I used HPA’s 3.13.11 generic kernel. (These days it isn’t necessary to use a “virtual” kernel image. The generic ones have all the paravirtualized drivers and Xen/KVM guest support.)Make sure your EC2 system still boots! If it doesn’t boot on EC2, it won’t do much good on GCE.On GCE:Create and boot a new (temporary) instance on GCE using one of their existing distribution bundles.Create a new volume large enough to receive the boot volume you have at EC2, and attach it to your temporary instance.Create an MBR partition table on the target volume, partition it, and create a root filesystem.Mount your new filesystem.On EC2:Copy data to your new GCE filesystem. Use any method you like; consider creating a volume on EC2 from the snapshot you just created and using that as your source. That will make sure you copy device nodes and other junk you might overlook otherwise. Remember to use a method that preserves hard links, sparse files, extended attributes, ACL’s, and so on.On GCE:Verify you received your data on your target volume and everything looks OK.Bind-mount /proc and /dev into your target volume and chroot into it.Install grub2 and grub-pc (Or whatever provides grub2 on your distribution.)Remove any legacy grub ec2 packages you might have.Remove /boot/grub/menu.lstAdd and edit the following in /etc/default/grub:GRUB_CMDLINE_LINUX_DEFAULT="console=ttyS0,38400n8 ro root=LABEL=(your root fs label)" GRUB_TERMINAL=serial GRUB_SERIAL_COMMAND="serial --speed=38400 --unit=0 --word=8 --parity=no --stop=1" Run update-grubInstall grub onto your new volume (probably grub-install /dev/sdb).Edit your fstab to disable any other disks you haven’t migrated overEdit the hostname (/etc/hostname)Edit /etc/resolv.conf to use a valid resolverUninstall any ec2-specific software packages.Exit the chrootUn-mount the bind mounts and target fsDetach the target fsCreate a new GCE instance using the target fs, and boot!If it boots, destroy your temporary instance. If it doesn’t, re-attach the target disk to it and see what went wrong.These are the minimum changes required to boot the image on GCE. You’ll still want to clean things up and make changes according to Google’s suggestions.TroubleshootingCheck the serial console output. Is the kernel starting?Booting from Hard Disk... Booting from 0000:7c00 [ 0.000000] Initializing cgroup subsys cpuset [ 0.000000] Initializing cgroup subsys cpu [ 0.000000] Initializing cgroup subsys cpuacct [ 0.000000] Linux version 3.14.3-031403-generic (apw@gomeisa) (gcc version 4.6.3 (Ubuntu/Linaro 4.6.3-1ubuntu5) ) #201405061153 SMP Tue May 6 15:54:50 UTC 2014 If you don’t see anything after “Booting from 0000:7c00” then you haven’t installed GRUB properly.If the kernel starts but the root filesystem doesn’t mount, make sure you see the root disk being detected. Make sure the root disk label is properly set in the filesystem and the GRUB configuration.Please help me improve this post. Leave a comment below!Google Internet Software Tech'
author = "Jeff Noxon"
