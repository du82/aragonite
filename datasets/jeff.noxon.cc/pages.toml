title = "Migrated From WordPress to Hugo - @jnoxon's thoughts"
description = """
I’ve migrated this blog from WordPress to Hugo. It’s something I’ve wanted to do for a long time. WordPress is a bit of a security nightmare, and although I’ve somehow never had my server owned, I did notice a couple of successful exfiltration attacks against WordPress while reviewing logs. Thankfully, the attacks were harmless.
If you subscribe to my RSS feed, you’ll notice some repeated content. It wasn’t worth the effort to match the content GUIDs."""
full_description = "I’ve migrated this blog from WordPress to Hugo. It’s something I’ve wanted to do for a long time. WordPress is a bit of a security nightmare, and although I’ve somehow never had my server owned, I did notice a couple of successful exfiltration attacks against WordPress while reviewing logs. Thankfully, the attacks were harmless.If you subscribe to my RSS feed, you’ll notice some repeated content. It wasn’t worth the effort to match the content GUIDs.I’m still not sure about this theme, but it will do for now.As part of this migration, I’ve finally made the site HTTPS-only. HTTPS has been enabled for years with HSTS, but now HTTP is permanently redirected to HTTPS.There are still a bunch of tweaks I’d like to make, particularly with responsive image sizes and re-enabling the CDN.Last but not least, comments are gone, at least temporarily. I’d like to add Commento or another open-source comment engine at some point, but for now, I’m exhaused.If you encounter any issues or have any feedback, send me an email!tech rss internet software"
