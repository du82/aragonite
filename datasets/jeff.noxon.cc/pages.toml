full_description = "Migrated From WordPress to Hugo Posted on Mar 14, 2019 | Jeff NoxonI’ve migrated this blog from WordPress to Hugo. It’s something I’ve wanted to do for a long time. WordPress is a bit of a security nightmare, and although I’ve somehow never had my server owned, I did notice a couple of successful exfiltration attacks against WordPress while reviewing logs. Thankfully, the attacks were harmless. If you subscribe to my RSS feed, you’ll notice some repeated content. It wasn’t worth the effort to match the content GUIDs. [Read More]tech rss internet software Using PCI pass-through in VMware ESXi 6.7 on a 2012 Mac Mini Posted on Feb 13, 2019 | Jeff NoxonI use a 2012 Mac Mini as a home VMware ESXi server. It’s a surprisingly great little machine, with exceptionally low power consumption and good performance. It runs several Linux and Windows VMs. I’ve been gradually migrating applications to it, and the most recent is my home PLEX server. To do that, I needed to move a Thunderbolt disk enclosure (OWC ThunderBay 4) to the Mini and attach it to a Linux VM. [Read More]Hardware Software Tech Replacing Dropbox with BitTorrent Sync Posted on Oct 29, 2014 | Jeff Noxon[Edit: December, 2015 – Since BitTorrent Sync hit 2.x, I’m no longer using it and I can no longer recommend it.] Too many times, you’ve heard a cloud storage/sync product described as “like Dropbox.” There’s Box, OneDrive, Google Drive, iCloud Drive, Bitcasa, SpiderOak, Wuala, Transporter, and I’ve missed a bunch. It doesn’t matter because they’re all pretty bad, and nearly all have the same problem, which is that any data you upload can be decrypted by the provider. [Read More]Internet Software Tech TestDisk Data Recovery on OS X Posted on Jun 17, 2014 | Jeff NoxonOne of the 4TB external USB hard drives I use for local backups started randomly disconnecting a few days ago. Today it failed completely. It’s a Seagate Backup Plus model, where the bottom of the enclosure consists of a small, removable shim that contains the USB & power connections and the USB to SATA converter chip. After trying different USB ports and cables without success, I decided to hook up the drive directly using SATA. [Read More]Hardware Open Source Software Tech"
