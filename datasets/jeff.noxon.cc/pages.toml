full_description = "Emulating a CD-ROM or DVD-ROM drive Posted on Feb 29, 2016 | Jeff NoxonI occasionally encounter situations where a bootable CD or DVD is necessary. Most recently, I had to load an operating system on a server. Before that, I had to burn and boot a CD to update the firmware of a device in my computer. I found out last week that hardware emulators are available that can read .ISO files and pretend to be a CD-ROM or DVD-ROM drive. On the recommendation of a co-worker, I got a Zalman ZM-V350B. [Read More]Tech LED strip light experimentation and impressions (Part 1) Posted on Jan 9, 2016 | Jeff NoxonThe first custom lighting project in our new home will be under-cabinet lights in the kitchen. After researching various choices for high-CRI LED strips, I decided to purchase a reel from Flexfire LED’s for experimentation. I settled on the Ultrabright High CRI Series Warm White LED Strip Light. Let me start by saying I’ve never purchased or played with LED strips before, but these are the real deal. I’ve played with demo strips at electronics stores, and the Flexfire strip is much brighter and the color is quite natural. [Read More]Hardware Projects Tech Lighting our new home Posted on Dec 30, 2015 | Jeff NoxonI’ve been fascinated with lighting since building my first home in 2003. The ceilings in that place have more 6″ downlights than anyone would reasonably install. Continuous Xenon lighting was used under the cabinets in the kitchen and bar. I like a lot of light, and that home demands it with its high ceilings and lack of natural light in the main living spaces. We started out with horrible incandescent 130-volt BR40 reflectors in the ceiling fixtures. [Read More]Hardware Projects Tech Replacing Dropbox with BitTorrent Sync Posted on Oct 29, 2014 | Jeff Noxon[Edit: December, 2015 – Since BitTorrent Sync hit 2.x, I’m no longer using it and I can no longer recommend it.] Too many times, you’ve heard a cloud storage/sync product described as “like Dropbox.” There’s Box, OneDrive, Google Drive, iCloud Drive, Bitcasa, SpiderOak, Wuala, Transporter, and I’ve missed a bunch. It doesn’t matter because they’re all pretty bad, and nearly all have the same problem, which is that any data you upload can be decrypted by the provider. [Read More]Internet Software Tech"
