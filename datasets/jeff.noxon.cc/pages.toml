full_description = "LEGO Nightstand Light Switch Posted on Nov 21, 2018 | Jeff NoxonI’ve been playing a lot with home automation recently, and in particular I’ve been installing a lot of cheap ESP8266-based Wi-Fi relays, such as the Sonoff Basic, Sonoff SV, Sonoff S31, Sonoff iFan02, and Shelly1, which have all been flashed to run the open-source Tasmota firmware. These communicate with Home Assistant through an MQTT message broker over Wi-Fi. Home Assistant, in turn, allows the devices to work with schedules, timers, voice-activated cylinders, and so on. [Read More]Hardware Open Source Projects Tech LED strip light experimentation and impressions (Part 1) Posted on Jan 9, 2016 | Jeff NoxonThe first custom lighting project in our new home will be under-cabinet lights in the kitchen. After researching various choices for high-CRI LED strips, I decided to purchase a reel from Flexfire LED’s for experimentation. I settled on the Ultrabright High CRI Series Warm White LED Strip Light. Let me start by saying I’ve never purchased or played with LED strips before, but these are the real deal. I’ve played with demo strips at electronics stores, and the Flexfire strip is much brighter and the color is quite natural. [Read More]Hardware Projects Tech Lighting our new home Posted on Dec 30, 2015 | Jeff NoxonI’ve been fascinated with lighting since building my first home in 2003. The ceilings in that place have more 6″ downlights than anyone would reasonably install. Continuous Xenon lighting was used under the cabinets in the kitchen and bar. I like a lot of light, and that home demands it with its high ceilings and lack of natural light in the main living spaces. We started out with horrible incandescent 130-volt BR40 reflectors in the ceiling fixtures. [Read More]Hardware Projects Tech Opendiag OBD-II Schematics & PCB Layout Posted on May 18, 2013 | Jeff NoxonBack in 2000, I created my first open-source hardware: An RS-232 to OBD-II interface. I’m no longer interested in this project, but it gets a surprising amount of traffic every day. I’m keeping it available for those who want it. Today there are far better approaches for connecting computers to cars, so please keep in mind that this information hasn’t been updated since 2002. [Read More]Hardware Open Source Projects"
