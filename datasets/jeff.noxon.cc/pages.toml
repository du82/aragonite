full_description = "Using custom DNS-over-HTTPS with CoreDNS and Google ChromeRun your own DoH with CoreDNS Posted on Sep 17, 2020 | Jeff NoxonI’ve been using CoreDNS on my home network infrastructure for a few years, and it’s worked really well. One of the things I use it for is translating local DNS queries into DNS-over-TLS queries, which keeps my ISP from inspecting and manipulating DNS lookups. That use case is well documented and works well. Today I found myself wanting to override the DNS provider used by just one browser on my computer. [Read More]tech dns internet Migrated From WordPress to Hugo Posted on Mar 14, 2019 | Jeff NoxonI’ve migrated this blog from WordPress to Hugo. It’s something I’ve wanted to do for a long time. WordPress is a bit of a security nightmare, and although I’ve somehow never had my server owned, I did notice a couple of successful exfiltration attacks against WordPress while reviewing logs. Thankfully, the attacks were harmless. If you subscribe to my RSS feed, you’ll notice some repeated content. It wasn’t worth the effort to match the content GUIDs. [Read More]tech rss internet software Setting up WireGuard between Linux and iOS Posted on Dec 28, 2018 | Jeff NoxonWireGuard is a modern VPN that’s designed to be easy to configure, performant, and secure. The ease-of-configuration is really important. If you’ve ever set up IPsec, you know what I mean. OpenVPN isn’t awful, but it isn’t good, either. WireGuard has both a Linux kernel implementation as well as a Go-based portable implementation that works on Mac and iOS. Official Windows support doesn’t exist yet, but is on the way. [Read More]Internet Open Source Tech Closing a Yahoo account Posted on Aug 4, 2017 | Jeff NoxonI terminated my Yahoo account on June 24. It was only used for Flickr. Flickr has been in a sad state for years, and is unlikely to improve under Verizon ownership. Yahoo sent the following as a confirmation: It’s strange that the final date is approximate. The 40