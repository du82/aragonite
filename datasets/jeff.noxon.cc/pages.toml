full_description = "Using PCI pass-through in VMware ESXi 6.7 on a 2012 Mac Mini Posted on Feb 13, 2019 | Jeff NoxonI use a 2012 Mac Mini as a home VMware ESXi server. It’s a surprisingly great little machine, with exceptionally low power consumption and good performance. It runs several Linux and Windows VMs. I’ve been gradually migrating applications to it, and the most recent is my home PLEX server. To do that, I needed to move a Thunderbolt disk enclosure (OWC ThunderBay 4) to the Mini and attach it to a Linux VM. [Read More]Hardware Software Tech TV standards are still a mess Posted on Dec 27, 2018 | Jeff NoxonI picked up a Vizio PQ65-F1 4K TV during the holiday sale season, and it’s a tremendous upgrade from our old LCD, an almost 10-year-old Sharp. The color and dynamic range are amazing and I don’t regret skipping OLED at all. I haven’t played with the built-in TV app platform at all, preferring instead to use an Apple TV 4K as the sole source device. Sadly, TV’s continue to be anything but plug-and-play. [Read More]Hardware Tech LEGO Nightstand Light Switch Posted on Nov 21, 2018 | Jeff NoxonI’ve been playing a lot with home automation recently, and in particular I’ve been installing a lot of cheap ESP8266-based Wi-Fi relays, such as the Sonoff Basic, Sonoff SV, Sonoff S31, Sonoff iFan02, and Shelly1, which have all been flashed to run the open-source Tasmota firmware. These communicate with Home Assistant through an MQTT message broker over Wi-Fi. Home Assistant, in turn, allows the devices to work with schedules, timers, voice-activated cylinders, and so on. [Read More]Hardware Open Source Projects Tech Disabling Wi-Fi on an LG Smart Refrigerator Posted on Mar 2, 2016 | Jeff NoxonOur LG LFXS30766S refrigerator is broadcasting an open Wi-Fi access point. I’m sure it’s doing that so LG’s Android app can connect to it and deliver pairing instructions for another AP. Sadly, there doesn’t seem to be any way to disable this feature. LG: If you’re listening, nobody asked for this garbage. Making the door shelves adjustable would be pretty great, though. A $2,300 fridge should have adjustable shelves. I also see LG recently posted a firmware update for this fridge to their website. [Read More]Hardware Internet Tech"
