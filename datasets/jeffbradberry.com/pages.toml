title = "Jeff Bradberry - Jeff Bradberry"
full_description = '''Building an Org-mode Workflow: Epic Organization Sat 26 August 2023 by Jeff Bradberry Not long after my last Org-mode post, we started planning for a new release cycle at work. Previously, I was tracking individual issues or small features as level-1 headlines with action items immediately underneath as level-2 headlines with the TODO keyword. Now though, I was going to need to keep track of an entire collection of interrelated features (an 'epic' in the Agile terminology), not all of which would be things I would work on. Clearly I needed to adjust some things to keep a handle on it all. Usage The New Structure Hiding Things Tags Settings Key Bindings Learned Next Steps Usage The New Structure This process added a couple of layers of complexity, so I started with deeper nested headlines. Roughly speaking, level-1 headlines now each correspond to a high-level epic, which would then contain multiple level-2 story or individual feature headlines. For a while I also created level-2 headlines that would capture notes and so forth, but as things proceeded I moved away from that (more on this in the next sub-section). * Generalized solution for adding/removing execution capacity - https://issues.redhat.com/browse/AAP-2238 - https://issues.redhat.com/browse/AAP-493 (pushed to 4.4) - https://issues … Continue reading This post is part 5 of the "Building an Org-mode Workflow" series: Building an Org-mode Workflow: Basic TODOs Building an Org-mode Workflow: Multiple Files and Archiving Building an Org-mode Workflow: Scheduling and Deadlines Building an Org-mode Workflow: Lists and Checklists Building an Org-mode Workflow: Epic Organization Posted in everything | Tags: orgmode time-management gtd Building an Org-mode Workflow: Lists and Checklists Mon 25 July 2022 by Jeff Bradberry I've reached a point where I need to organize things at a level lower than individual tasks. So for that, I've started making use of the lists and checklists features of Org mode. Usage Settings Key Bindings Learned Next Steps Usage As mentioned in the part about notes in Part 1, I've been using unordered lists from the beginning. There are other options for bullets to use with these, but so far I've only been using -. While it is easy enough to just manually type these out (and I still do some of the time), the thing I have started to do recently is to make use of the keybindings to insert them instead. M-RET will add a new list item if your cursor is already in a list. A typical thing I might then combine with that is M-RIGHT to increase the indent of the new item, to turn it into the start of a sub-list. The only awkwardness then is starting the list, since M-RET will just create a new headline if you aren't already in a list. Technically you could turn that headline into a list item with C-c -, but I always just manually type the dash … Continue reading This post is part 4 of the "Building an Org-mode Workflow" series: Building an Org-mode Workflow: Basic TODOs Building an Org-mode Workflow: Multiple Files and Archiving Building an Org-mode Workflow: Scheduling and Deadlines Building an Org-mode Workflow: Lists and Checklists Building an Org-mode Workflow: Epic Organization Posted in everything | Tags: orgmode time-management gtd'''
