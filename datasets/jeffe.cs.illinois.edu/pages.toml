["https://jeffe.cs.illinois.edu/pubs/ccw.html"]
title = "Topologically Trivial Closed Walks in Directed Surface Graphs"
full_description = "🔥 Discrete & Computational Geometry 64(4):1253–1294, 2020. (Special issue of invited papers from the 35th International Symposium on Computational Geometry) We also describe three polynomial-time algorithms to compute shortest contractible closed walks, depending on whether the fundamental group of the surface is free, abelian, or hyperbolic. A key step in our algorithm for hyperbolic surfaces is the construction of a context-free grammar with O(g2L2) non-terminals that generates all contractible closed walks of length at most L, and only contractible closed walks, in a system of quads of genus g≥2. Finally, we show that computing shortest simple contractible cycles, shortest simple bounding cycles, and shortest bounding closed walks are all NP-hard."
