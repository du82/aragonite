title = "CS 225 Honors — Spring 2024"
full_description = '''Potential topics include sequence data structures (stacks, queues, steques, quacks, deques, dynamic arrays, catenable lists, list ordering), amortized analysis, time/space tradeoffs, self-adjusting data structures, competitive analysis, disjoint-set data structures, randomized data structures, ordered dictionaries (AVL trees, red-black trees, splay trees, scapegoat trees, treaps, skip lists), priority queues (binary heaps, Fibonacci heaps, quake heaps, pairing heaps), text data structures (ropes), and geometric data structures (range trees, interval trees, sweepline algorithms, multilevel search trees). Obviously we won't cover everything in this list. As a "description of special work to be completed for honors credit" in the HCLA, write "Additional exercises on data structure design and analysis". Each college runs its own independent James Scholar program, and different colleges have different deadlines for submitting HCLAs. These are the deadlines I have found online, in chronological order, but you should confirm your deadline well in advance with your college advisor: Satisfactory completion of the honors coursework earns you an "H" after your CS 225 grade (assuming that grade is B– or better), which has no effect on your GPA. Satisfactory completion of the honors coursework earns you a grade of "S" (satisfactory) in CS 199–225, which has no effect on your GPA.'''
