["https://jeffe.cs.illinois.edu/pubs/copyright.html"]
title = "Copyright notice"
full_description = '''Take a look at the copyright transfer agreement that all ACM authors are required to sign. Almost every publisher requires a similar contract, forcing the author to relinquish, at least in principle, all rights to their own work. (To their credit, ACM and most other publishers now explicitly allow papers to be posted to the author's web site "for limited non-commercial distribution".) According to ACM, this transfer of rights is necessary to ensure the "quality" and "integrity" of their publications, and to "protect the author's interests against plagiarism". Yeah, right. And monkeys might fly out of my butt. The issue is especially frustrating in light of the growing number of volunteer- and grant-supported electronic distribution methods, which on the one hand have much lower costs than traditional paper journals (if any!), and on the other hand recognize that the purpose of scientific publication is to disseminate information, not to make a profit. Many electronic journals, such as the Electronic Journal of Combinatorics and the The Journal of Graph Algorithms and Applications, have much less annoying agreements. The arXiv requires no copyright transfer at all. Let's not even mention voluntary page charges, or their mutant offspring, "author-pays" open access. As David Eppstein aptly put it, "Outside of academia, publishers who charge their authors for the privilege of being published are known as vanity presses." I encourage you to copy and distribute any of these papers, in any medium, for any noncommercial purpose, at no charge to anyone. That's why they're here! However, if any money (beyond the actual cost of reproduction) is going to change hands, you need permission first, and you won't get it from me. The Fair Use clauses of United States copyright law explicitly allow you to make personal copies of any copyrighted work for research or teaching use, including multiple copies for classroom use. For more information/propaganda about copyright issues, see the Association of Research Libraries' Copyright and Intellectual Property site and their "Subversive" Proposal for Electronic Publishing, as well as the white paper "Who Should Own Scientific Papers?" by Steven Bachrach et al.'''
year_published = 2025
clearnet = "https://jeffe.cs.illinois.edu/pubs/copyright.html"
