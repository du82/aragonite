["https://jeffe.cs.illinois.edu/pubs/global.html"]
title = "Global Minimum Cuts in Surface Embedded Graphs"
full_description = "Previously, the best time bounds known for this problem followed from two algorithms for general sparse graphs: a randomized algorithm of Karger that runs in O(n log3n) time and succeeds with high probability, and a deterministic algorithm of Nagamochi and Ibaraki that runs in O(n2 log n) time. We can also achieve a deterministic gO(g)n2log log n time bound by repeatedly applying the best known algorithm for minimum (s,t)-cuts in surface graphs. The bulk of our work focuses on the case where the dual of the minimum cut splits the underlying surface into multiple components with positive genus."
