["https://jeffe.cs.illinois.edu/pubs/fsmbuilder.html"]
title = "FSM Builder: A Tool for Writing Autograded Finite Automata Questions"
full_description = "To appear in Proceedings of the 29th Annual ACM Conference on Innovation and Technology in Computer Science Education, 2024. We introduce the FSM Builder, a new pedagogical tool enabling students to practice constructing DFAs and NFAs with a graphical editor, giving personalized feedback and partial credit. The algorithms used for generating these are heavily inspired by previous works. The key advantages to its competitors are greater flexibility and scalability. This is because the FSM Builder is implemented using efficient algorithms from an open source package, allowing for easy extension and question creation. We discuss the implementation of the tool, how it stands out from previous tools, and takeaways from experiences of using the tool in multiple large courses. Survey results indicate the interface and feedback provided by the tool were useful to students."
