["https://jeffe.cs.illinois.edu/pubs/barycenter.html"]
title = "Planar and Toroidal Morphs Made Easier"
full_description = "🔥To appear in Proceedings of the 29th International Symposium on Graph Drawing and Network Visualization, 2021. Lecture Notes in Computer Science 12868, Springer. 🔥Submitted by invitation to the special issue of Journal of Graph Algorithms and Applications devoted to the conference. First, we give a much simpler algorithm to construct piecewise-linear morphs between planar straight-line graphs. Specifically, given isomorphic straight-line drawings Γ₀ and Γ₁ of the same 3-connected planar graph, with the same convex outer face, we construct a morph from Γ₀ to Γ₁ that consists of O(n) unidirectional morphing steps, in O(n1+ω/2) time. Our algorithm entirely avoids the classical edge-collapsing strategy dating back to Cairns; instead, in each morphing step, we interpolate the pair of weights associated with a single edge. Second, we describe a natural extension of barycentric interpolation to geodesic graphs on the flat torus. Barycentric interpolation cannot be applied directly in this setting, because the linear systems defining intermediate vertex positions are not necessarily solvable. We describe a simple scaling strategy that circumvents this issue. Computing the appropriate scaling requires O(nω/2) time, after which we can can compute the drawing at any point in the morph in O(nω/2) time. Our algorithm is considerably simpler than the recent algorithm of Chambers et al. and produces more natural morphs. Our techniques also yield a simple proof of a conjecture of Connelly et al. for geodesic torus triangulations."
year_published = 2025
