title = "Weekly Notes 09 Feb 2025 | Jeff McNeill"
full_description = "Home > Articles > Journal > Weekly Notes 09 Feb 2025 Weekly Notes 09 Feb 2025 10-Feb-202509-Feb-2025 by admin Week 06/2025 This is one of the ongoing weekly notes, as per Thej. Contents Work Health Transportation Reading Music Video Work Started changing metadata and organizational information across distributors. First things first, one at a time (Drucker, Effective Executive). Bookshop.org now has ebook distribution, and a 10% affiliate program. Health Feeling better, ramping up activity Able to run 3.5 kms at a 10 min/km pace -- Not great, but a good place to start From my falling injury, only my sprained fingers remain in pain. I can type just fine, but I don't have grip strength. Riding the motorbike causes some discomfort; driving, hardly any. Transportation Got bicycle helmets for everyone. Some progress on the motorcycle modification. I've worked out the pannier framework, with some welding needed to finish it off. I've got the second pannier bag on order, let's hope it comes through soon. I just ordered a new front seat extender, and sissy bar backrest. I'll have to manufacture my own rear-seat extension, but that should not be so bad. I've identified the fiberglass kit I'll need. Reading Read The Japanese Mind Fantastic! A collection of essays, each provides fundamental insight into Japanese culture. Picked back up Peter Drucker's The Effective Executive, nearly finished, but I'll go back through and write up the notes version to refer to it this year. Is it wrong to pick up girls in a Dungeon? volume 12 Music Ongoing enjoyment of many of the channels on SomaFM, using Alpha+ on Android and the command-line SomaFM perl script by David Moreno for Linux. Good stuff and hard to put down. I especially like *Groove Salad, Groove Salad Classic, and Suburbs of Goa, though other channels do get a listen on any given week. Getting deeper into Ado and Yoasobi, Japanese pop. Video Standard anime, including: Wrong to pick up girls in a dungeon, Sakamoto days, Re:Zero Finally saw One Piece - Red, great music by Ado, and a compelling story line. Categories Journal Weekly Notes 02 Feb 2025Obesity"
