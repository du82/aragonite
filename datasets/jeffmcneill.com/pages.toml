["https://jeffmcneill.com/weekly-notes-16-feb-2025"]
title = "Weekly Notes 16 Feb 2025 | Jeff McNeill"
full_description = '''Home > Articles > Journal > Weekly Notes 16 Feb 2025 Weekly Notes 16 Feb 2025 17-Feb-202516-Feb-2025 by admin W07/2025: Monday 10 February - Sunday 16 February 2025 This is one of the ongoing weekly notes, as per Thej. Contents Work Tech Health Transportation Reading Music Video Work Some progress, though much left to do. Tech EMF blocking clothing? Great idea. Horrible prices. The venerable Kiwi Browser is no longer getting updates, and it is no longer in the Android store (though a similarly named browser chock full of ads and spyware is in fact in that store). Final Android apk file is available. The recommendation is Microsoft Edge Canary, which for me is a non-starter in that spam and bloat-ware product. I'm going to try out the Vivaldi browser, and StartPage which is my search engine of choice, and also now has its own mobile apps. Turns out Vivaldi browser is horrible, at least on low resource Linux machines. Even with YouTube Enhancer, and downgrading codecs and video resolution, it is unable to properly play video without stuttering and high CPU utilization. Back to Ungoogled Chromium. For Android, the Startpage browser does not allow for support of ad blocking (only 3rd party cookies blocking), so Vivaldi browser actually works better for that platform. Tutanota has a good business model and nice email and calendar interfaces. It competes against Fastmail, though for me I pay $50/year for unlimited domains, whereas it would cost me 96 EUR/year for 10 domains. Tutanota has offline, and Fastmail will soon have it. Had a bundle of fun when I updated some of my files to Debian Test and ended up having to reinstall (twice, the first day ended in a non-bootable system) to return to a stable Debian Stable system. Getting back on my feet now (and enjoying it, though it does consume time). Playing with XMPP clients. Settled on Conversations.im on Android and Dino on Linux. Health Still running 3.5 kms in the morning, between 9-10 minutes per km, 4-5 days per week. Feeling better in general, but still slow to ramp up, ah age. Transportation Motorcycle Modifications Can't borrow a welder and don't want to spend 2,500 baht on a welding kit including safety equipment, will hire for these two things I need done: Welding crossbars to fit pannier clamps (wait until receive second pannier) (@weldingshop) Welding bracket for footpegs in the front, secure and useful for small boy (@weldingshop) Mould a rear seat with frame (metal framework and fiberglass), include hinge on back end so main seat can still be lifted up (@self) Add cushion and leather on top of rear seat frame, include padding around rear edge metal (@upholsterer) Give old trunk box to in-laws? Reading Read The Japanese Mind Fantastic! A collection of essays, each provides fundamental insight into Japanese culture. Picked back up Peter Drucker's The Effective Executive, nearly finished, but I'll go back through and write up the notes version to refer to it this year. Is it wrong to pick up girls in a Dungeon? volume 13 First volume of Reborn to Master the Blade, not a bad start. Music Jazzy but not too jazzy... https://www.youtube.com/watch?v=OgU_UDYd9lYVideo can't be loaded because JavaScript is disabled: <a href="https://www.youtube.com/watch?v=OgU_UDYd9lY" title="jazzy but not too jazzy">jazzy but not too jazzy (https://www.youtube.com/watch?v=OgU_UDYd9lY)</a> Video Lots of Hunter x Hunter, the boys and I love it. Categories Journal ObesityDino – Linux XMPP client'''
