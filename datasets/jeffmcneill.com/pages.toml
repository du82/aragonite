full_description = '''Home > Articles > Devops > Software > VS Codium / codium VS Codium / codium 16-Feb-202504-Sep-2024 by admin Updated 16-Feb-2025 Contents Codium aka VSCodium Installation Configuration Some bugs Codium aka VSCodium Alternative to the instrumented VSCode. Less tracking, same Open Source flavor. Another option is Pulsar, the resurrected Atom editor. Ignore Pulsar, vscodium is fine. Note that with Foam, Codium can provide some level of Obsidian-like functionality, though not nearly as extensive functionality and constrained to a desktop (no mobile apps). Installation Installation instructions sudo wget https://gitlab.com/paulcarroty/vscodium-deb-rpm-repo/raw/master/pub.gpg -O /usr/share/keyrings/vscodium-archive-keyring.asc echo 'deb [ signed-by=/usr/share/keyrings/vscodium-archive-keyring.asc ] https://paulcarroty.gitlab.io/vscodium-deb-rpm-repo/debs vscodium main' | sudo tee /etc/apt/sources.list.d/vscodium.list sudo apt update sudo apt install codium Configuration Which extensions What settings Using with git Using with pandoc Zoom in (ctrl+) and resize main font to 14px "workbench.editor.enablePreview": false See also Foam Maybe Excalidraw?... Some bugs Sometimes codium seems to take over opening file folders. So fix it this way: sudo nano ~/.config/mimeapps.list Then add: inode/directory=thunar.desktop Under [Default Applications] Categories Software ObsidianGoogle TV Shenanigans'''
