["https://jeffmcneill.com/git"]
title = "Git and Git-related | Jeff McNeill"
full_description = "Home > Articles > Devops > Software > Linux > Git and Git-related Git and Git-related 09-Aug-202409-Aug-2024 by admin Git is great, and even better as a core part of a full development / deployment toolchain. These days there are choices as to which more robust Git platform to use. First, those not to use: Github (owned by Microsoft), proprietary Gitlab (owned publicly traded company), open core Both of these are worrisome for privacy and AI scraping issues Contents Open source Git platforms Sourcehut Codeberg / Forgejo Bottom Line Notes Open source Git platforms There are two main players, though others on the periphery: Sourcehut Codeberg / Forgejo Sourcehut Sourcehut is a small group of devs and a company, which also release their toolset open source (though currently only available for Alpine linux). Sourcehut is useful and allows for hosting of private and public repositories for a low price. They offer transparency on their income and expenses. In general, a good project to get behind. Codeberg / Forgejo While Codeberg and Forgejo are two different things, the Codeberg organization controls the Forgejo name and domain assets. Forgejo is a hard fork of Gitea, after Gitea transferred its name and domains to a private individual, and is different in a few ways. While Gitea still offers web services, not all of it is open source, and therefore like Gitlab it can be considered open core. Codeberg is a SAAS for free and open source project git hosting (using Foregjo, of course). Forgejo is open source and there are binaries for a variety of Linux distributions. Comparing Forgejo to Gitea, Sourcehut, Gitlab and Github is quite useful. Bottom Line When choosing a git platform, the use case can provide insight: If one cares about open source, and also wants public hosting of private repositories, and doesn't care as much about private hosting, then Sourcehut is a good choice. Good governance. If one cares about open source, and is also interested in self-hosting, and also public hosting of open source repositories, then Forgejo / Codeberg is a good choice. Good governance. Of course one can use both of these, though learning and using the integration tools for two different platforms can be a lot of work. Notes Enable Wiki (and other settings) on Codeberg / Forgejo as needed. Categories Devops, Linux, Software Chrome / Chromium BrowserManga, et al"
