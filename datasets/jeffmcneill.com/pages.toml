["https://jeffmcneill.com/weekly-notes-02-feb-2025"]
title = "Weekly Notes 02 Feb 2025 | Jeff McNeill"
full_description = "Home > Articles > Journal > Weekly Notes 02 Feb 2025 Weekly Notes 02 Feb 2025 07-Feb-202506-Feb-2025 by admin Week 05/2025 This is one of the ongoing weekly notes, as per Thej. Actually this note also accounts for the previous week, which is without a note. Four things impacted me at once which took away most motivation and a lot of energy and inertia, and it took a week to get back in the saddle: Two health impacts (listed below) and the notification that our landlord is trying to sell the house out from underneath us, and that my bank in the US has requirements that make it much more difficult / impossible to use. Sigh. Tackling all these issues (health, house, bank) this week, with some progress. Contents Work Tech Health Transportation Reading Music Video Work Started changing metadata and organizational information across distributors. Increasing distributors is the first project moving forward (as a part of increase customers, sales, profits). Tech Lots of brouhaha about Deepseek Encountered Mythic Beasts hosting. Looks like good pricing and a viable business model. Of course no guarantee they won't sell out like every other provider I've been with (looking at you Linode). Mythic Beasts can do IPv6 only, while my email provider Fastmail cannot, with no issue on the roadmap for this (sadly). Lemmy vs. Reddit. Sure, Reddit has the content, but Lemmy at least is looking not so bad. Health Better mental health through tidying and doing spring cleaning (ongoing, and progressing). Doing things I can control. This seems like mere repetition but indeed every week things are getting sorted and reduced. It really is metaphorically mind-cleansing. Literal face plant in running this week, dark road and rubble caused me to trip and fall. Ruined a pair of glasses, cut my face with said glasses, bruised and cut lips and sprained two fingers. Ouch! Still, it was a good run. Need to run with a light. After this I got sick (from the children) but had it much worse. End of week recovery was in full swing. Transportation Finally progress on the motorcycle modification. I've worked out the pannier framework, with some welding needed to finish it off. I've got the second pannier bag on order, let's hope it comes through soon. I just ordered a new front seat extender, and sissy bar backrest. I'll have to manufacture my own rear-seat extension, but that should not be so bad. I've identified the fiberglass kit I'll need. Outstanding Need to figure out bicycle helmets (and maybe gloves?). Planned for next Saturday. Reading Read Murder Mindfully by Karsten Dusse. Brilliant! Music Dengue Fever's latest (2023) album Ting Mong is great, especially paired with The Deepest Lake (2015). Lots of Caravan Palace and Glass Beams, as well as Japanese pop artist Ado. Video Lots of Anime, including *Sakamoto Days, Solo Leveling, Pick Up Girls in a Dungeon, Hunter x Hunter, etc. Categories Journal Weekly Notes 26 Jan 2025Weekly Notes 09 Feb 2025"
