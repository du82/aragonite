["https://jeffmcneill.com/apt"]
title = "APT - Advanced Package Tool | Jeff McNeill"
full_description = "Home > Articles > Devops > Software > Linux > APT – Advanced Package Tool APT – Advanced Package Tool 28-Feb-202530-May-2019 by admin Updated 28-Feb-2025 APT -- Advanced Package Tool -- is all that is needed for most application installations when there are repositories which are regularly updated for packages of interest. Note that apt essentially makes irrelevant apt-get so there is no reason for that redundancy any longer. Note: Use aptitude when dealing with packages that have upgrade/downgrade issues, as aptitude provides better options for resolving issues. Use the -f flag with aptitude if the downgrading is out of hand. If packages are kept back, simply install them directly with the install command. Use -f to force dependency upgrade. Additional Note: Use apt or aptitude to install .deb packages including the ./ before packagename, as in: sudo apt install ./packagename See also this discussion on linux/unix stackexchange. Contents stable, backports, testing, unstable repos Apt pinning Upgrading the linux kernel using apt Update Repositories Upgrade Applications Broken Dependencies Upgrade Distributon (e.g, Debian Stable) Clean, Autoclean, Check, Autoremove Purge and Remove Sources Extrepo extrepo architecture error see also Debian Fasttrack rmadison Can I use PPAs in Debian? Resources stable, backports, testing, unstable repos For a stable system, using stable (or oldstable) and backports ensures stability. However, it doesn't deal with new hardware issues, or any kind of additional functionality, such as adding updated applications. For this, it is a matter of tracking down external packages, or using the testing or unstable repositories. Note that mixing repos is discouraged by debian and may result in breakage. See also choosing a distribution. Currently, my main desktop is tied to an oldstable release to keep an older printer working properly. I do expect to be running Debian 10, and Debian 11 (aka stable and test)more or less parallel (backup desktop, server, primary desktop). Apt pinning See apt configuration / apt preferences Upgrading the linux kernel using apt See installing the kernel with a named package Update Repositories sudo apt update -y sudo apt update -y -t stretch-backports Upgrade Applications sudo apt upgrade -y --fix-missing sudo apt upgrade -y -t stretch-backports --fix-missing Broken Dependencies sudo apt install -f also sudo apt --fix-broken install Upgrade Distributon (e.g, Debian Stable) sudo apt dist-upgrade -y --fix-missing Clean, Autoclean, Check, Autoremove All these commands can be run from apt. In particular, autoremove is a good option to keep things tidy. sudo apt autoremove -y Purge and Remove To seriously remove things, do: sudo apt --purge remove package-name Sources Sources are found in a few places: sudo nano /etc/apt/sources.list Current stable/backports sources: deb http://deb.debian.org/debian/ bookworm main contrib non-free non-free-firmware deb http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware deb http://deb.debian.org/debian/ bookworm-updates main contrib non-free non-free-firmware deb http://ftp.debian.org/debian bookworm-backports main contrib non-free non-free-firmware ls /etc/apt/sources.list.d Current additional sources (note, see extrepo below for making these obsolete): element-io.list home:ungoogled_chromium.list signal-xenial.list syncthing.list vscodium.list Extrepo Extrepo allows one to enable known external repositories, using a tool extrepo. Extrepo writes the necessary keys (to /usr/share/extrepo/offline-data/debian/...) and repositories (to /etc/apt/sources.list.d/...). Install from apt, then enable and update various sources, for example: sudo extrepo enable postgresql sudo extrepo enable nginx sudo extrepo enable signal sudo extrepo enable vscodium sudo extrepo enable openvpn sudo extrepo enable syncthing sudo extrepo enable steam sudo extrepo enable sury sudo extrepo update postgresql sudo extrepo update nginx sudo extrepo update signal sudo extrepo update vscodium sudo extrepo update openvpn sudo extrepo update syncthing sudo extrepo update steam sudo extrepo update sury Note: I seem to have to run these commands twice through, to get it to enable and update, at least the first time. extrepo architecture error Sometimes there is an architecture error, such as noted in this merge request: https://salsa.debian.org/extrepo-team/extrepo-data/-/merge_requests/313, if it isn't removed upstream, simply edit the repository file found in /etc/apt/sources.list.d/... and remove the offending architectures. see also extrepo man page Debian Fasttrack For making non-standard packages available to stable users (not using standard testing distribution). rmadison Note the use of rmadison which is a utility found in devscripts. To install: sudo apt install devscripts Use the command rmadison to find all available versions of an application across all debian repositories, e.g., rmadison inkscape will result in: inkscape | 0.92.4-3 | oldoldstable | source, amd64, arm64, armhf, i386 inkscape | 1.0.2-4~bpo10+1 | buster-backports | source, amd64, arm64, armel, armhf, i386, mips, mips64el, mipsel, ppc64el, s390x inkscape | 1.0.2-4~bpo10+1 | buster-backports-debug | source inkscape | 1.0.2-4 | oldstable | source, amd64, arm64, armel, armhf, i386, mips64el, mipsel, ppc64el, s390x inkscape | 1.2.2-2~bpo11+1 | bullseye-backports | source, amd64, arm64, armel, armhf, i386, mips64el, mipsel, ppc64el, s390x inkscape | 1.2.2-2~bpo11+1 | bullseye-backports-debug | source inkscape | 1.2.2-2 | stable | source inkscape | 1.2.2-2+b1 | stable | amd64, arm64, armel, armhf, i386, mips64el, mipsel, ppc64el, s390x inkscape | 1.2.2-7 | testing | source inkscape | 1.2.2-7 | unstable | source inkscape | 1.2.2-7 | unstable-debug | source inkscape | 1.2.2-7+b1 | testing | amd64, arm64, armel, armhf, i386, mips64el, ppc64el, riscv64, s390x inkscape | 1.2.2-7+b1 | unstable | mips64el, riscv64 inkscape | 1.2.2-8 | buildd-unstable | source, amd64, arm64, armel, armhf, i386, ppc64el, s390x inkscape | 1.2.2-8 | unstable | source, amd64, arm64, armel, armhf, i386, ppc64el, s390x inkscape | 1.2.2-8 | unstable-debug | source inkscape | 1.4-3 | experimental | source, amd64, armel, armhf, mips64el inkscape | 1.4-3 | experimental-debug | source Can I use PPAs in Debian? Well, sort of, but should you? Only if really needed. Resources How do I install a .deb file via the command line? How can I run Debian stable but install some packages from testing? Chapter 2. Debian package management - packages from mixed source of archives How to install some packages from “unstable” Debian on a computer running “stable” Debian? Apt Configuration Note: mixing repositories is not needed and generally discouraged (called franken-distributions). Stable for servers, testing for desktop. Categories Devops, Linux, Software Delete Site Cache from ChromeTelegram for Social Networking"
