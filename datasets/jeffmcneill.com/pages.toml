full_description = "Home > Devops > Software > Linux Screenshot with XFCE 19-Feb-2025 by admin Upon installing XFCE, the xfce4-screenshooter is also installed. Create keyboard shortcut for screenshots Note that the Below will initiate a selection screenshot so that one may select the appropriate screen area using the crosshairs. It will also automatically save the screenshot in the Downloads directory and name it appropriately. In order to have a nice ... Read more Categories Linux, Software Home > Devops > Software > Linux Dino – Linux XMPP client 27-Feb-202517-Feb-2025 by admin Dino is pretty neat. It supports voice/video along with text, images, etc. Dino website Dino on Github Dino on Mastodon Install On Debian: sudo apt install dino-im Or for the latest nightly, which may or may not be dino-im, as sometimes this is dino. Tweaks Add groups Tweak font size sudo nano ~/.config/gtk-4.0/gtk.css add @import ... Read more Categories Linux, Software Home > Devops > Software > Linux Git and Git-related 09-Aug-202409-Aug-2024 by admin Git is great, and even better as a core part of a full development / deployment toolchain. These days there are choices as to which more robust Git platform to use. First, those not to use: Github (owned by Microsoft), proprietary Gitlab (owned publicly traded company), open core Both of these are worrisome for privacy ... Read more Categories Devops, Linux, Software Home > Devops > Software > Linux Chrome / Chromium Browser 13-Feb-202513-Jul-2024 by admin This is meant to help with selecting and installing a chrome-based browser, with minimal tracking and other cruft. Ungoogled Chromium for Debian Actually there are a variety of OS builds for ungoogled Chromium. For Debian, the simplest is the add repository and install manually option. echo 'deb http://download.opensuse.org/repositories/home:/ungoogled_chromium/Debian_Sid/ /' | sudo tee /etc/apt/sources.list.d/home:ungoogled_chromium.list curl -fsSL ... Read more Categories Android, Devops, Linux, Software"
