["https://jeffpearlman.com/about-the-author"]
title = "About the Author – JEFF PEARLMAN"
description = "ABOUT THE AUTHOR In an effort to try and seem cool and professional and savvy, I’m required by law to write this biography in the third person—as if someone has been hired by Jeff Pearlman to pen a bio of Jeff Pearlman. Alas, it’s me, Jeff Pearlman, typing these words. I am not cool, not professional, not savvy. I smell a bit…"
full_description = "I am not cool, not professional, not savvy. I smell a bit mildewy, I cut my own hair (poorly), my back hurts and I eat too many snacks. My writing journey began in Mahopac, N.Y., a small town about an hour north of Manhattan. I started writing for The Chieftain, Mahopac High’s student newspaper, as a junior, and the following year I served as sports editor. I was a shit writer and a shit reporter, and I never kissed a girl or drank a beer, and I had a chronic nasal drip, but otherwise I was pretty spectacular at all things. Really, what I had going for me was chutzpah. Upon arriving at the University of Delaware in the fall of 1990, I marched up to the offices of The Review, the weekly student newspaper, armed with a binder overflowing with clips from The Chieftain and my local town weekly, The Putnam Trader. Although freshmen weren’t typically allowed to write, I begged and pleaded and whined and bitched upon an editor started handing me some assignments covering the Blue Hen men’s lacrosse team. That led to more pieces, and more pieces, and more pieces—until, one day, the paper’s managing editor pulled me aside, said everyone at The Review hated my shitty attitude (it was, indeed, shitty) and wanted me banished. I returned to my dorm room, sobbed, contemplated transferring, sobbed some more—then wrote an apologetic letter to the staff that led to my reinstatement. My journalism outlook improved dramatically in the spring of 1991, when I wrote a front-page piece, headlined DELAWARE V. DELAWARE STATE: THE SPORTS RIVALRY THAT NEVER WAS, that resulted in the First State’s two Division I colleges finally competing in athletics. Over the next three years I rose up the masthead and covered (among other things) the Blue Hens’ first two March Madness appearances, Jimmy Carter’s visit to campus and the mystery of a guy who stole donuts from the cafeteria (we were pretty hard hitting). As a senior I was editor of The Review—and repeatedly exercised such brutal judgement that one longtime journalism professor told me I “was the worst editor in the paper’s long history.” In hindsight, he had a point."
