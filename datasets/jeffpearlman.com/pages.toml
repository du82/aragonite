["https://jeffpearlman.com/showtime"]
title = "Showtime – JEFF PEARLMAN"
description = "SHOWTIME BUY THE BOOK! AMAZON BARNES & NOBLE BOOKSAMILLION INDIEBOUND APPLE BOOKS Magic, Kareem, Riley, and the Los Angeles Lakers Dynasty of they 1980s The Los Angeles Lakers of the 1980s personified the flamboyance and excess of the decade over which they reigned. Beginning with the arrival of Earvin “Magic” Johnson as the number-one overall…"
full_description = "The Los Angeles Lakers of the 1980s personified the flamboyance and excess of the decade over which they reigned. Beginning with the arrival of Earvin “Magic” Johnson as the number-one overall pick of the 1979 draft, the Lakers played basketball with gusto and pizzazz, unleashing their famed “Showtime” run-and-gun style on a league unprepared for their speed and ferocity – and became the most captivating show in sports and, arguably, in all-around American entertainment. The Lakers’ roster overflowed with exciting all-star-caliber players, including center Kareem Abdul-Jabbar, and they were led by the incomparable Pat Riley, known for his slicked-back hair, his Armani suits, and his arrogant strut. Hollywood’s biggest celebrities lined the court and gorgeous women flocked to the arena. Best of all, the team was a winner. Between 1980 and 1991, the Lakers played in an unmatched nine NBA championship series, capturing five of them. Pearlman draws from almost 300 interviews to take the first full measure of the Lakers’ epic Showtime era. A dazzling account of one of America’s greatest sports sagas, Showtime is packed with indelible characters, vicious rivalries, and jaw-dropping, behind-the-scenes stories of the players’ decadent Hollywood lifestyles. From the Showtime era’s remarkable rise to its tragic end – marked by Magic Johnson’s 1991 announcement that he had contracted HIV – Showtime is a gripping narrative of sports, celebrity, and 1980s-style excess."
