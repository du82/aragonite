["https://jeffpearlman.com/2019/05/15/menachem-ickovitz"]
title = "Menachem Ickovitz – JEFF PEARLMAN"
description = "He is the the greatest Cleveland-centric, New York-based Orthodox Jewish sports writer of the past 100 years. He is the only Cleveland-centric, New York-based Orthodox Jewish sports writer of the past 100 years."
full_description = "But in my 2 1/2 decades in the business of writing about collegiate and professional athletics, Menachem is—hands down—the absolute greatest Orthodox Jew among us. And, ahem, the only Orthodox Jew among us. Which is something I truly love, because while the matches we chronicle are played by a diverse cross section of Americana, too often the press boxes are homogeneous odes to cookie cutter white men. So, yeah, Menachem is different. He was educated in a Yeshiva; well-versed in Maimonides; as skilled reading the Torah as he is the Browns’ depth chart. He now writes sports for Big Play, with an emphasis on Cleveland Cleveland Cleveland Cleveland. JEFF PEARLMAN: So Menachem, you’re a 35-year-old Orthodox Jewish man. You’ve devoted much of your life to your religious beliefs. Like, MUCH of your life. So here’s my question: Is it possible you’re wrong? Like, is it possible that maybe, just maybe, Jesus Christ is actually God’s son and the messiah? Or that, maybe, just maybe, there is no God, and this is all an accident? With all the religions, beliefs out there, why are you so dogmatic about yours? What if you’re simply incorrect? MENACHEM ICKOVITZ: Coming in high and tight with the first question—love it! This is a difficult question but I will do my best to answer. Obviously, I believe that I am right. As you mentioned in the question, I have spent a lot of time and energy in my life following my beliefs and I am confident that they are correct. I say the ‘13 Principles of Faith’ from Maimonides on a daily basis and it brings me comfort knowing that the world is not random just because I don’t truly understand everything (or anything) that occurs. To me, that is what faith is all about. That being said, let’s say, for hypothetical purposes, I am not right, I would have absolutely no regrets. I try to do good things because it makes me feel like a positive member of society. Being courteous, giving charity and helping others in need do not have to have religious undertones to them."
year_published = 2019
year_updated = 2021
