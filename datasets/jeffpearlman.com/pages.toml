full_description = "Drawing on an astonishing 720 original interviews, Pearlman captures as never before the elusive truth about Jackson, Auburn University’s transcendent Heisman Trophy winner, superstar of both the NFL and Major League Baseball and ubiquitous “Bo Knows” Nike pitchman). Did Bo really jump over a parked Volkswagen? (Yes.) Did he actually run a 4.13 40? (Yes.) During the 1991 flight that nearly killed every member of the Chicago White Sox, was he in the cockpit trying to help? (Oddly, yes. Or no. Or … maybe.). Bo Jackson isn’t Jim Thorpe. He’s not Deion Sanders, either. No, Bo Jackson is Paul Bunyan. Drawing on an astonishing 720 original interviews, Pearlman captures as never before the elusive truth about Jackson, Auburn University’s transcendent Heisman Trophy winner, superstar of both the NFL and Major League Baseball and ubiquitous “Bo Knows” Nike pitchman). Did Bo really jump over a parked Volkswagen? (Yes.) Did he actually run a 4.13 40? (Yes.) During the 1991 flight that nearly killed every member of the Chicago White Sox, was he in the cockpit trying to help? (Oddly, yes. Or no. Or … maybe.). Bo Jackson isn’t Jim Thorpe. He’s not Deion Sanders, either. No, Bo Jackson is Paul Bunyan. It was 1986, and the New York Mets won 108 regular-season games and the World Series, capturing the hearts (and other assorted body parts) of fans everywhere. But their greatness on the field was nearly eclipsed by how bad they were off it. Led by the indomitable Keith Hernandez and the young dynamic duo of Dwight Gooden and Darryl Strawberry, along with the gallant Scum Bunch, the Amazin’s left a wide trail of wreckage in their wake—hotel rooms, charter planes, a bar in Houston, and most famously Bill Buckner and the hated Boston Red Sox. With an unforgettable cast of characters—including Doc, Straw, the Kid, Nails, Mex, and manager Davey Johnson—Pearlman’s “affectionate but critical look at this exciting season” (Publishers Weekly) celebrates the last of baseball’s arrogant, insane, rock-and-roll-and-party-all-night teams, exploring what could have been, what should have been, and what never was."
