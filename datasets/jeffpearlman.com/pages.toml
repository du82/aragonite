["https://jeffpearlman.com/2022/10/04/upcoming-book-signings"]
title = "Upcoming book signings – JEFF PEARLMAN"
description = "We can't all be Snooki. So I've never aspired to be famous, because fame seems to truly suck. But—one thing that doesn't suck about fame is you 100% know people will turn out for your book signings. That's why people like Oprah and Will Smith can do a 40-book tour and sell thousands upon thousands…"
full_description = "But—one thing that doesn’t suck about fame is you 100% know people will turn out for your book signings. That’s why people like Oprah and Will Smith can do a 40-book tour and sell thousands upon thousands of books without much of a sweat. People want to be in their presence. The signed book is almost secondary. Alas, I am no Oprah. No Will Smith. I wouldn’t do an extended book tour, because I’m uncertain whether people would attend. But—I will be doing a mini-tour in support of “The Last Folk Hero: The Life and Myth of Bo Jackson.” And, by “mini,” I mean really mini. • Oct. 29: I will literally be walking the Jordan-Hare Stadium parking lot putting postcards in car windows during the Auburn game."
