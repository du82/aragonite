["https://jeffpearlman.com/2022/07/13/the-good-man"]
title = "The good man – JEFF PEARLMAN"
description = "Richard Guggenheimer: A good man. My father in law died yesterday. His name was Richard Guggenheimer. He was 78, and had been struggling with health issues for quite the spell. He was a good man. I think, too often, we use the occasion of someone's death to exaggerate the positives; to pretend as if our…"
full_description = "His name was Richard Guggenheimer. He was 78, and had been struggling with health issues for quite the spell. I think, too often, we use the occasion of someone’s death to exaggerate the positives; to pretend as if our lost beloved hovered above water and cured Chronic Focal Encephalitis and never cursed or snarled or farted or burped. We insist that so-and-so figure will eternally be remembered; that he/she changed an infinite number of lives; that the world is a worse place without their presence. Most of us aspire to be good, and that generally takes work. You think about who you are and what needs to be changed. You think about perceptions. How people see you. How they digest your behaviors. He was quiet. Not bashful, but reserved. If he had something to say, he’d say it. But he was far more listener than gabber. An observer. A watcher. And the thing is (and this, to me, is the greatest compliment one can give another person), Richard never talked shit about anyone. When I say ‘never,’ I literally mean n-e-v-e-r. He was married (and divorced) twice, and I failed to hear an ill word concerning either ex. He has three daughters (including my wife), and not once did I witness him criticize them. His oldest child is divorced—not a moment of bashing the ex-husband. Not. A. Moment. And what’s truly unique about this is Richard wasn’t suppressing his trash talk. As I do on occasion. As you do on occasion. Nope—it simply never occurred to him to speak ill of others. It wasn’t inside of him. My father in law displayed no sign of an ego. None. Zero. Zip. He never bragged. He never boasted. Few were the sentences that began with “I.” Few were the times he went with “Me.” Again—this wasn’t by any sort of pre-determined thought. The ego simply did not exist. Once, not all that long ago, my father in law lost much of what was in his life. He had a fancy car—gone. He had a longtime marriage—over. He had a beautiful house—goodbye. It’s too complicated and thick to get into, but all the material things one craves (and hopes to accumulate) no longer existed. This happened to occur around the same time his once-razor-sharp memory was slipping, and his business career was falling apart, and he moved in with his sister, and …"
