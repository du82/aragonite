["https://jeffpearlman.com/2021/09/01/the-radicalization-of-mark-mulder"]
title = "The Radicalization of Mark Mulder – JEFF PEARLMAN"
description = '''He almost certainly named the fish "Pelosi" If I had the time, and the energy, and the non-financial needs, I'd love, love, love to write a 5,000-word piece on the political radicalization of Mark Mulder, former (enjoyable, agreeable, friendly) Oakland A's pitcher-turned-hard-right zealot. In case you don't follow Mark on Twitter, well, I wouldn't start…'''
full_description = "If I had the time, and the energy, and the non-financial needs, I’d love, love, love to write a 5,000-word piece on the political radicalization of Mark Mulder, former (enjoyable, agreeable, friendly) Oakland A’s pitcher-turned-hard-right zealot. In case you don’t follow Mark on Twitter, well, I wouldn’t start now (unless you’re a fan of Biden Sucks memes and ultimately debunked political “facts”). But, either way, this is a topic worth exploring. Because it’s so much of America: 2021. First, to be clear—I have no problem with people thinking Joe Biden is a shit president. I have no problem with people thinking he screwed the pooch on Afghanistan. I have no problem with people thinking Nancy Pelosi is a liberal hack. I have no problem with people who are pro-life (I get it), even with people who believe marriage is a sacred church-ordained institution that needs to be specifically man-woman (I obviously strongly disagree. But if one was raised in the church, and this is what he/she was taught …). I understand all of this, because it’s what politics used to be. I feel this way, you feel that way. You believe in lower taxes, I believe in higher (for some). You want to negotiate with Russia, I think it’s a bad idea. We’d argue, disagree, deliberate, then sorta walk off and maybe have a drink. No biggie. Now, however, it’s personal. It’s a Civil War without the muskets. It’s “THE GREATEST THREAT FACING AMERICA ISN’T RUSSIA OR NORTH KOREA—IT’S THE LIBERALS!!!!!!!“ Mulder’s feed is … I don’t even know the word. But I’ll say it’s a weirdly paranoid view of the country, with Donald Trump and Co. as God-like creatures and anyone affiliated with Biden/Obama/Harris/Pelosi cast as demonic spawn. Take a look … And what fascinates me—truly, truly fascinates me—is you’d think Mark Mulder might know better, based upon life experience. Example: Mulder is decidedly anti-immigration. The kids in cages didn’t ruffle his feathers. People seeking asylum—no empathy. In Mulder World, it seems, the only people worthy of being brought into this nation from “shit-hole countries” are … guys like this. And this. And this. And this. And this. In other words, men who gift our cherished nation with the import societal contribution of being able to throw a baseball really, really hard. In that case, “Welcome to America! Grab a uni!” Because, lord knows, Mark Mulder never uttered a peep when the A’s/Cardinals found a way to important that 17-year-old Dominican second baseman who grew up living in a shack without energy or running water."
year_published = 2021
year_updated = 2021
