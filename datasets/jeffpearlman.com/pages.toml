["https://jeffpearlman.com/the-rocket-that-fell-to-earth"]
title = "The Rocket That Fell To Earth – JEFF PEARLMAN"
description = "THE ROCKET THAT FELL TO EARTH BUY THE BOOK! AMAZON BARNES & NOBLE BOOKSAMILLION INDIEBOUND APPLE BOOKS Roger Clemens and the Rage for Baseball Immortality To be completely honest, my least-favorite of the nine book projects.I worked hard on this. Really hard. I learned a ton about Roger Clemens, and came to appreciate the difficulties…"
full_description = "I worked hard on this. Really hard. I learned a ton about Roger Clemens, and came to appreciate the difficulties he faced throughout life. His biggest problem was his older brother Randy, a former athletic phenom who would up ruining his life with battles against substance abuse. And yet… Roger Clemens lacks introspection. And depth. He’s a pretty shallow guy, and shallow guys are hard material for 300 pages. So, as an author, you end up writing around him, and delving into the existences of the people who surrounded and influenced him."
