["https://jeffpearlman.com/my-wife-donated-one-of-her-kidneys-to-a-stranger-this-morning"]
title = "My wife donated one of her kidneys to a stranger this morning. – JEFF PEARLMAN"
description = "It's 10:15 am, and as I write this my wife Catherine is in surgery here at UCLA's Ronald Reagan Medical Center—donating one of her kidneys to a complete stranger. You read that correctly, but I recommend reading it again. My wife Catherine is in surgery donating one of her kidneys to a complete stranger. The…"
full_description = "It’s 10:15 am, and as I write this my wife Catherine is in surgery here at UCLA’s Ronald Reagan Medical Center—donating one of her kidneys to a complete stranger. You read that correctly, but I recommend reading it again. My wife Catherine is in surgery donating one of her kidneys to a complete stranger. The story dates back several months, when Catherine was sitting in a Starbucks. She was doing our friend Bev a favor, and had a moment to spare, so it wasn’t a coffee shop she often frequents. While waiting, or standing, or thinking, or something—she spotted a flyer hanging near the front of the store, above the sugar and powders and milk canisters. It was posted by a woman, Monica Valdez, whose husband was in need of a kidney. The man’s name was Eli, he was in his mid-40s, he had type O+ blood. Like most Americans, I was naive to kidneys in about 10,000 different ways. I didn’t know how they function, what they do (in any sort of detail), how donations kick off. I certainly didn’t know that, across the country, hundreds of thousands of people are in need of kidneys, and that we can live fruitfully with just one, and that the process of having a kidney removed is remarkably safe. So we talked about it, and I said, “It seems like it’d be an amazing thing to do.” Catherine followed with something she’s wondered—openly—over and over and over. “Does it come off as dumb to give a kidney to someone you don’t know?” I get the question. I’ve always gotten the question. You’re a parent with two children. You’re a daughter. You’re a sister. Is this wise? Is this prudent? Is it putting yourself at risk? Also, to a lesser degree, what will others think? Does it seem foolish? Reckless? We’re only humans, after all, and these are the ponderings that enter a mind. Am I being kind, or insane? Catherine decided to go for it. Or at least put herself out there. She underwent the various tests at UCLA, and was deemed a match. In many ways, it always felt more hypothetical than realistic. She might give a kidney. This could happen. It may go down. Probably not—but maybe."
year_published = 2019
year_updated = 2021
