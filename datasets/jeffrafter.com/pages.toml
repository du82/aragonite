["https://jeffrafter.com/releasing-github-actions"]
title = "Releasing GitHub Actions | Jeff Rafter"
description = "Once you've made some amazing GitHub Actions, you'll want to re-use them and share them with your friends. To do that you'll want to organize your project a little differently, publish and release them."
full_description = '''Releasing GitHub ActionsJanuary 31, 2020 Image credit: GitHub's Bring innovation to work with GitHub Enterprise Previously, I posted about Working with GitHub Actions. It covered the basics of setting up a repository, configuring embedded actions and the associated workflows. If you haven’t worked with GitHub Actions before, you might want to read that first.Once you’ve created your amazing GitHub Actions, you’ll want to re-use them and share them with your friends. To do that you’ll want to organize your project a little differently. Also, you’ll want to release your actions with all of the dependencies included so that they run efficiently. In this post we’ll create a repository which contains a GitHub Action - built in TypeScript - and a second repository which will use the action.Before you read this it is important to note: starting with a template will save you a lot of time and setup. Creating actions can be very simple. In this post, however, I am going to work through and explain all of the steps. Included in this post are some of the reasons I’ve chosen one particular setup and skipped another. When getting started with GitHub Actions it is difficult to understand how all of the pieces fit together, or why you might want to create an action for a particular task. Hopefully this post provides some helpful examples. That said, there are probably steps here that you’ve seen before, don’t care about, or just want to skip and that’s okay.In order to follow this, you’ll need a GitHub account. You’ll need Node, Node Version Manager (nvm), and Node Package Manager (npm). The examples will be in TypeScript. All of the code is available at https://github.com/jeffrafter/honk-action.HonkFor our example we’ll create a GitHub Action which listens for new issue comments - if the comment doesn’t contain the word “honk” our action will delete the comment and add a new comment with a picture of the goose from Untitled Goose Game.The inspiration for this GitHub Action came from a Discord Bot created by @melissamcewen. This isn’t very practical, but it should serve as a good foundation for building actions that respond to comments.Here is the layout for our action:__tests__ honk.test.ts .eslintignore .eslintrc.json .gitignore .nvmrc action.yml honk.ts jest.config.js package-lock.json package.json README.md tsconfig.jsonNotice that honk.ts and __tests__ are both in the root of our repository. In this case our action is not very complex, using only a single file. If you have a complex action which contains many modules it might make sense to to put these into a src or lib folder.We’ll dig into each of these files.SetupFirst you want to create a folder for your project:mkdir honk-action cd honk-action EnvironmentAs we did in the previous post we’ll be using TypeScript to build our action, which requires Node. Out of the box GitHub supports a few environments for your actions to run There are several different virtual operating systems you can use for your actions which come preloaded with useful software. Additionally, you can utilize Docker containers running in one of these virtual environments to pre-configure your hosts.. There is built-in support for running actions built in JavaScript (using Node). When we release our action we’ll package up the compiled JavaScript so that users of the action don’t need to install the TypeScript dependencies. Taking a few extra seconds to build your action on execution may not seem like a big deal; but GitHub Actions have a limited about of free compute time. While developing an action this might not matter; but long-term those seconds can add up. Leveraging the default environments means your action will run more quickly and reduce the amount of billable hours used.Let’s setup our example to use Node. If you have multiple local projects you might run into a conflict about which Node version should be used. Node Version Manager solves this problem. After installing a Node Version Manager, check which version of Node you have installed:nvm lsIf you don’t have the version you want, find a remote version:nvm ls-remoteThis will show lots of versions. Find the last one with LTS (for Long Term Support). Generally LTS versions are very stable. Install it using:nvm install 12.16.1To control which version of Node should be used in your project, add a .nvmrcNotice that the .nvmrc file starts with a "." (period). By default on most systems this creates a hidden file. Oftentimes general project config is hidden away. On MacOS you can show hidden files in Finder by running defaults write com.apple.finder AppleShowAllFiles -bool true and restarting Finder. If you want to list hidden files in your console use the -a parameter: ls -a. file:12.16.1The file is pretty simple; just the version. I chose 12.16.1 because it matches the version that is used to run our action (node12). Node 10.16.3 is installed in the default GitHub Action software environment and can be used as well but will not match the running action environment. At the time you read this there may be a newer version of Node or you may chose to use an older version because your code requires it. You can check https://nodejs.org. Ignore some thingsWe plan to use git to keep track of our changes. As we work on our project locally, there will be a lot of files we won’t want to keep track of; we’ll want to ignore them. To do this we’ll create a .gitignore file. If you are looking for an complete example .gitignore you can check out https://github.com/github/gitignore. For now, just copy the following (this .gitignore includes only what is important for this post. For a more complete version see here):# Dependency directories node_modules/ # Logs logs *.log npm-debug.log* # Typescript v1 declaration files typings/ # Optional npm cache directory .npm # Optional eslint cache .eslintcacheWith this setup we’ll ignore node_modules. Again, when we release our action we’ll need the dependencies included. If we don’t include them, we’ll need users of our action to install them which will not only take 25 to 30 seconds but will require extra steps in the calling workflow. Packages & DependenciesFor almost any Node project you’ll find that you use a lot of packages – you’ll have far more code in packages in your node_modules folder (where package code is stored) than your main project.Initialize your packages:npm init -yNow you have a package.json:{ "name": "honk-action", "version": "1.0.0", "description": "", "main": "index.js", "scripts": { "test": "echo \"Error: no test specified\" && exit 1" }, "keywords": [], "author": "", "license": "ISC" }Let’s simplify it a bit (you can fill out or keep fields you like here, but this is the minimum):{ "private": true, "scripts": { "build": "tsc", "test": "tsc --noEmit && jest" }, "license": "ISC" }The only scripts we need at the moment are build which will convert our TypeScript to JavaScript and test which will run our tests. While we’re developing our action we’ll need access to all of our project’s dependencies; but when we release our action we don’t want to include the testing, linting and TypeScript dependencies. Because of this, the difference between dependencies and devDependencies is important (as well as --save versus --save-dev).npm install --save \ @actions/core \ @actions/githubThe @actions/core and @actions/github are the baseline for interacting with GitHub and the incoming events. Our published action will need these dependencies when it runs.When developing we’ll want to add testing support to test our action:npm install --save-dev \ jest \ nock TypeScriptLet’s add TypeScript support to our development dependencies:npm install --save-dev \ typescript \ ts-jestFinally, because we’re using TypeScript, we’ll want to add type support for development:npm install --save-dev \ @types/jest \ @types/nodeWe’ll need to configure TypeScript before we can build our action. Create tsconfig.json:{ "compilerOptions": { "module": "commonjs", "target": "esnext", "lib": ["es2015", "es2017"], "strict": true, "esModuleInterop": true, "skipLibCheck": true, "noUnusedLocals": true, "noUnusedParameters": true, "noImplicitAny": true, "removeComments": false, "preserveConstEnums": true }, "include": ["**/*.ts"], "exclude": ["node_modules"] }By default this allows us to build all of the actions contained in our repository, adds some strict compile-time checks, and skips type checking for our dependencies. Keep it clean (optional) Note: this section is not required to complete this tutorial; if you want to skip it feel free. Everyone has different preferences when they edit code. Some prefer tabs over spaces. Some want two spaces instead of four. Some prefer semicolons and some don’t. It shouldn’t matter right? But it does. If editors are auto-formatting code based on user preferences it is important to make sure everyone has chosen the same set of defaults for that auto-formatting. This makes it easy to tell what changed between versions – even when different developers (with different preferences) have made changes.For this reason we’ll setup a linter and code formatter for our code. Install eslint and prettier:npm install --save-dev \ eslint \ @typescript-eslint/eslint-plugin \ @typescript-eslint/parser \ eslint-config-prettier \ eslint-plugin-prettier \ prettierNow that we have the packages we’ll need to configure them in .eslintrc.json:{ "parser": "@typescript-eslint/parser", "plugins": ["@typescript-eslint", "prettier"], "extends": [ "eslint:recommended", "plugin:@typescript-eslint/recommended", "plugin:prettier/recommended" ], "rules": { "prettier/prettier": [ "error", { "singleQuote": true, "trailingComma": "all", "bracketSpacing": false, "printWidth": 120, "tabWidth": 2, "semi": false } ], // octokit/rest requires parameters that are not in camelcase "camelcase": "off", "@typescript-eslint/camelcase": ["error", {"properties": "never"}] }, "env": { "node": true, "jest": true, "es6": true }, "parserOptions": { "ecmaVersion": 2018, "sourceType": "module" } }I won’t go into too much detail here; there are better explanations to be found. This configuration does a few things: Relies on the typescript eslint parser with the prettier plugin - I’ve found this works very well in @Code. If you were previously using ts-lint with prettier this setup should replace your old configuration. This eslint config doesn’t work perfectly for projects that contain both JavaScript and TypeScript - because of that we won’t attempt to lint JavaScript files in our project I’ve turned off the camelcase rules for properties - when writing GitHub Actions you will likely use properties from @actions/github and from the API and these will not be camelcase.There are lots of ways to name variables including camelCase, snake_case, ProperCase, and CONSTANT_CASE. JavaScript and TypeScript tend to use camelCase for variable names, but Ruby (which is what much of GitHub and the GitHub API is written in) generally uses snake_case. This is one of those places where the idioms of different languages collide and you have to make the best of it. The expected environment should include node and jest - this will help eslint ignore missing declarations for things like describe, process, module, etc. If you need to ignore specific files when linting you can add them to .eslintignore. Because our setup doesn’t work well for JavaScript we’ll ignore all JavaScript files in .eslintignore:*.jsAdd a lint item to the scripts node in package.json: "scripts": { "build": "tsc", "test": "tsc --noEmit && jest", "lint": "eslint . --ext .ts" },With this in place we can run:npm run lintWait, there’s an error:Oops! Something went wrong! :( ESLint: 6.6.0. No files matching the pattern "." were found. Please check for typing mistakes in the pattern.We haven’t written any TypeScript to lint yet. Time to stop configuring and start writing code.Building the actionCreate a new file called honk.ts:import * as core from '@actions/core' import * as github from '@actions/github' const run = async (): Promise<void> => { try { // Our action will need to API access the repository so we require a token // This can be set in the calling workflow or it can use the default const token = process.env['GITHUB_TOKEN'] || core.getInput('token') if (!token || token === '') return // Create the octokit client const octokit: github.GitHub = new github.GitHub(token) // The environment contains a variable for current repository. The repository // will be formatted as a name with owner (`nwo`); e.g., jeffrafter/example // We'll split this into two separate variables for later use const nwo = process.env['GITHUB_REPOSITORY'] || '/' const [owner, repo] = nwo.split('/') // This action works on issue comments. Because of this we expect the context // payload to contain the issue and the comment const issue = github.context.payload['issue'] if (!issue) return const comment = github.context.payload.comment const commentBody = comment.body // If the comment contains "honk" anywhere in the body, there is nothing for our action to do if (commentBody.match(/honk/i)) return // The comment didn't contain "honk", delete it // https://octokit.github.io/rest.js/#octokit-routes-issues-delete-comment const deleteCommentResponse = await octokit.issues.deleteComment({ owner, repo, comment_id: comment.id, }) console.log(`Deleted comment! ${JSON.stringify(deleteCommentResponse.status)}`) // Add a new comment that says honk // https://octokit.github.io/rest.js/#octokit-routes-issues-create-comment const issueCommentResponse = await octokit.issues.createComment({ owner, repo, issue_number: issue.number, body: '![honk](https://user-images.githubusercontent.com/4064/65900857-cf462f80-e36b-11e9-9a9c-76170c99618b.png)', }) console.log(`Honk! ${issueCommentResponse.data.url}`) } catch (error) { // If there is any error we'll fail the action with the error message console.error(error.message) core.setFailed(`Honk-action failure: ${error}`) } } // Don't auto-execute in the test environment if (process.env['NODE_ENV'] !== 'test') { run() } export default runThe code inside your action should be auto-executing. In this case we define a runWe've named our function run but you could name the function anything you wanted. run is a convention used in the base typescript-template method and then immediately call it right after it has been defined. In fact, you don’t even need to define a method, you could include the code for your action directly. In some cases that might be okay, but as the complexity of the action increases it would become confusing. We’ve also made our function the default export. This isn’t required but will make things easier as we move forward and test our code.The image this includes is: Testing the actionCreate a new file called __tests__/honk.test.ts:import * as github from '@actions/github' import * as core from '@actions/core' import {WebhookPayload} from '@actions/github/lib/interfaces' import nock from 'nock' '''
year_published = 2025
